isbe[8768]='Threshing`thresh\'-ing (dush; aloao): Dush means literally, "to trample out." In <a onClick="return mV(\'Jer\',51,33);">Jer 51:33</a>, darakh, is used of threshing. Fitches and cummin were beaten off with a rod. The distinction between beating and threshing is made in <a onClick="return mV(\'Isa\',28,27);">Isa 28:27</a>. Gideon, in order to avoid being seen by the Midianites, beat out his wheat in a wine press instead of threshing it on the threshing-floor (<a onClick="return mV(\'Jdg\',6,11);">Jud 6:11</a>). For a general description of the threshing operations see <a href="./study/isbe/search.html?string=AGRICULTURE">AGRICULTURE</A>.<P>Figurative: "Thou shalt thresh the mountains," i.e. thou wilt overcome great difficulties (<a onClick="return mV(\'Isa\',41,15);">Isa 41:15</a>). Babylon\'s destruction was foretold poetically in the language of the threshing-floor (<a onClick="return mV(\'Isa\',21,10);">Isa 21:10</a>; <a onClick="return mV(\'Jer\',51,33);">Jer 51:33</a>; <a onClick="return mV(\'Dan\',2,35);">Da 2:35</a>); Zion\'s foes would be gathered as sheaves on the threshing-floor (<a onClick="return mV(\'Mic\',4,12,13);">Mic 4:12,13</a>; compare <a onClick="return mV(\'2Ki\',13,7);">2Ki 13:7</a>; <a onClick="return mV(\'Amo\',1,3);">Am 1:3</a>; <a onClick="return mV(\'Hab\',3,12);">Hab 3:12</a>); threshing unto the vintage, i.e. throughout the summer, indicated an extra abundant yield (<a onClick="return mV(\'Lev\',26,5);">Le 26:5</a>).``133';
isbe[8769]='Threshing-Floor`thresh\'-ing-flor (goren; halon; \'iddar, occurs in <a onClick="return mV(\'Dan\',2,35);">Da 2:35</a>): The location and method of making threshing-floors have already been described under <a href="./study/isbe/search.html?string=AGRICULTURE">AGRICULTURE</a>. These floors have come into prominence because of the Biblical events which occurred on or near them. Joseph with his kinsmen and Egyptian followers halted for seven days at the threshing-floor of Atad to lament the death of Jacob (<a onClick="return mV(\'Gen\',50,10);">Ge 50:10</a>). Probably there was a group of floors furnishing a convenient spot for a caravan to stop. Travelers today welcome the sight of a threshing-floor at their halting-place. The hard, level spot is a much preferable to the surrounding stony fields for their tents.<P>David built an altar on Ornan\'s (Araunah\'s) threshing-floor (<a onClick="return mV(\'2Sa\',24,\'18-24\');">2Sa 24:18-24</a>; <a onClick="return mV(\'1Ch\',21,\'18-27\');">1Ch 21:18-27</a>), which later became the site of the Temple (<a onClick="return mV(\'2Ch\',3,1);">2Ch 3:1</a>). David probably chose this place for his altar because it was on an elevation, and the ground was already level and prepared by rolling. Uzzah died near the threshing-floor of Nacon for touching the ark (<a onClick="return mV(\'2Sa\',6,6);">2Sa 6:6</a>). Ruth reveals herself to Boaz on his threshing-floor (<a onClick="return mV(\'Rth\',3,\'6-9\');">Ru 3:6-9</a>).<P>Threshing-floors are in danger of being robbed (<a onClick="return mV(\'1Sa\',23,1);">1Sa 23:1</a>). For this reason, someone always sleeps on the floor until the grain is removed (<a onClick="return mV(\'Rth\',3,7);">Ru 3:7</a>). In Syria, at the threshing season, it is customary for the family to move out to the vicinity of the threshing-floor. A booth is constructed for shade; the mother prepares the meals and takes her turn with the father and children at riding on the sledge.<P>The instruments of the threshing-floor referred to in <a onClick="return mV(\'2Sa\',24,22);">2Sa 24:22</a> were probably:<P>(1) the wooden drag or sledge, charuts or moragh, Arabic lauch eddiras;<P>(2) the fan (fork), mizreh, Arabic midra, for separating straw from wheat;<P>(3) shovel, meghraphah, Arabic mirfashat, for tossing the wheat into the air in winnowing;<P>(4) broom, mat\'ate\', for sweeping the floor between threshing and for collecting the wheat after winnowing;<P>(5) goad, malmedh, Arabic messas;<P>(6) the yoke, \'ol, Arabic tauk;<P>(7) sieve, kebharah, Arabic gharbal;<P>(8) dung catcher, Arabic milkat.``1';
isbe[8770]='Threshold`thresh\'-old.`<a href="./study/isbe/search.html?string=HOUSE">HOUSE</a>`1';
isbe[8771]='Throne`thron. (kicce\', a "seat" in <a onClick="return mV(\'2Ki\',4,10);">2Ki 4:10</a>; a "royal seat" in <a onClick="return mV(\'Jon\',3,6);">Jon 3:6</a>; thronos): Usually the symbol of kingly power and dignity. Solomon\'s throne was noted for its splendor and magnificence (<a onClick="return mV(\'1Ki\',10,\'18-20\');">1Ki 10:18-20</a>; compare <a onClick="return mV(\'2Ch\',9,\'17-19\');">2Ch 9:17-19</a>). It symbolizes:<P>(1) The exalted position of earthly kings, rulers, judges, etc., their majesty and power (of kings: <a onClick="return mV(\'Gen\',41,40);">Ge 41:40</a>; <a onClick="return mV(\'1Ki\',2,19);">1Ki 2:19</a>; <a onClick="return mV(\'Job\',36,7);">Job 36:7</a>, etc.; denoting governing or judicial power: <a onClick="return mV(\'2Sa\',14,9);">2Sa 14:9</a>; <a onClick="return mV(\'Neh\',3,7);">Ne 3:7</a>; <a onClick="return mV(\'Psa\',122,5);">Ps 122:5</a>, etc.; often equivalent to kingdom or reign: <a onClick="return mV(\'1Sa\',2,8);">1Sa 2:8</a>; <a onClick="return mV(\'1Ki\',1,37,47);">1Ki 1:37,47</a>, etc.; in this connection we note the expressions: "a man on the throne of Israel," <a onClick="return mV(\'1Ki\',2,4);">1Ki 2:4</a>, etc.; "to sit upon a throne" <a onClick="return mV(\'1Ki\',1,13,17);">1Ki 1:13,17</a>, etc.; <a onClick="return mV(\'Jer\',13,13);">Jer 13:13</a>, etc.; "to set a person on a throne," <a onClick="return mV(\'2Ki\',10,3);">2Ki 10:3</a>; "the throne of Israel," <a onClick="return mV(\'1Ki\',8,20);">1Ki 8:20</a>, etc.; "the throne of David" <a onClick="return mV(\'2Sa\',3,10);">2Sa 3:10</a>, etc.; of Solomon, <a onClick="return mV(\'2Sa\',7,13);">2Sa 7:13</a>, etc.; of Joash, <a onClick="return mV(\'2Ch\',23,20);">2Ch 23:20</a>, etc.). In <a onClick="return mV(\'Jer\',17,12);">Jer 17:12</a> it is equivalent to "temple" ("A glorious throne...is the place of our sanctuary"); it symbolizes the power of the Gentiles being hostile to the people of Yahweh (<a onClick="return mV(\'Psa\',94,20);">Ps 94:20</a>), and is used metaphorically in <a onClick="return mV(\'Isa\',22,23);">Isa 22:23</a> ("He (i.e. Eliakim) shall be for a throne of glory to his father\'s house").<P>(2) The majesty and power of Yahweh as the true king of Israel; He "is enthroned above the cherubim" (<a onClick="return mV(\'1Sa\',4,4);">1Sa 4:4</a> the Revised Version margin; compare <a onClick="return mV(\'2Sa\',6,2);">2Sa 6:2</a>; <a onClick="return mV(\'2Ki\',19,15);">2Ki 19:15</a>; Solomon\'s throne is really Yahweh\'s throne (<a onClick="return mV(\'1Ch\',29,23);">1Ch 29:23</a>), and there shall come a time when Jerusalem shall be called "the throne of Yahweh" (<a onClick="return mV(\'Jer\',3,17);">Jer 3:17</a>) and the enemies of Yahweh shall be judged by him ("I will set my throne in Elam," <a onClick="return mV(\'Jer\',49,38);">Jer 49:38</a>). According to <a onClick="return mV(\'Eze\',43,7);">Eze 43:7</a>, the Lord said of the future temple: "This is the place of my throne."<P>(3) The rule of the promised theocratic king (the Messiah), its everlasting glory and righteousness. He, too, is Yahweh\'s representative, inasmuch as He "shall rule upon his throne" (<a onClick="return mV(\'Zec\',6,13);">Zec 6:13</a>). Thus, the permanence of the throne of David is warranted (<a onClick="return mV(\'Isa\',9,7);">Isa 9:7</a>); eternal peace (<a onClick="return mV(\'1Ki\',2,33);">1Ki 2:33</a>), loving-kindness and justice (<a onClick="return mV(\'Isa\',16,5);">Isa 16:5</a>) characterize his reign. The New Testament points to Jesus as this promised king (<a onClick="return mV(\'Luk\',1,32);">Lu 1:32</a>; compare <a onClick="return mV(\'Act\',2,30);">Ac 2:30</a>; <a onClick="return mV(\'Hbr\',12,2);">Heb 12:2</a>); Christ Himself refers to His future state of glory (<a onClick="return mV(\'Mat\',25,31);">Mt 25:31</a>) and guarantees His faithful disciples a similar distinction (<a onClick="return mV(\'Mat\',19,28);">Mt 19:28</a>; compare <a onClick="return mV(\'Luk\',22,30);">Lu 22:30</a>; <a onClick="return mV(\'Rev\',20,4);">Re 20:4</a>).<P>(4) The matchless glory, the transcendent power and absolute sovereignty of God (and Christ); Micaiah "saw Yahweh sitting on his throne," etc. (<a onClick="return mV(\'1Ki\',22,19);">1Ki 22:19</a>; compare <a onClick="return mV(\'2Ch\',18,18);">2Ch 18:18</a>); Isaiah and Ezekiel had similar visions (<a onClick="return mV(\'Isa\',6,1);">Isa 6:1</a>; <a onClick="return mV(\'Eze\',1,26);">Eze 1:26</a>); compare also <a onClick="return mV(\'Dan\',7,9);">Da 7:9</a> and <a onClick="return mV(\'Rev\',4,2);">Re 4:2</a> (and often); in trying to depict the incomparable greatness of the King of kings, the Bible tells us that His throne is in heaven (<a onClick="return mV(\'Psa\',11,4);">Ps 11:4</a>, etc.) and, moreover, that heaven itself is His throne (<a onClick="return mV(\'Isa\',66,1);">Isa 66:1</a>; <a onClick="return mV(\'Mat\',5,34);">Mt 5:34</a>, etc.); His reign is founded on righteousness and justice (<a onClick="return mV(\'Psa\',89,14);">Ps 89:14</a>; compare <a onClick="return mV(\'Psa\',97,2);">97:2</A>) and of eternal duration (<a onClick="return mV(\'Psa\',45,6);">Ps 45:6</a>; compare <a onClick="return mV(\'Hbr\',1,8);">Heb 1:8</a>; <a onClick="return mV(\'Lam\',5,19);">La 5:19</a>); He acts justly and kindly (<a onClick="return mV(\'Psa\',9,4);">Ps 9:4</a> and <a onClick="return mV(\'Psa\',89,14);">Ps 89:14</a>); He defends His glory (<a onClick="return mV(\'Jer\',14,21);">Jer 14:21</a>); He manifests His holiness (<a onClick="return mV(\'Psa\',47,8);">Ps 47:8</a>) and His grace (<a onClick="return mV(\'Hbr\',4,16);">Heb 4:16</a>), and yet His dealings with us are not always fully understood by us (<a onClick="return mV(\'Job\',26,9);">Job 26:9</a>).<P>(5) Heavenly kingdoms or rulers (angels: <a onClick="return mV(\'Col\',1,16);">Col 1:16</a>).`<a href="./study/isbe/search.html?string=KING,+KINGDOM">KING, KINGDOM</a>`8';
isbe[8772]='Thrum`thrum: In <a onClick="return mV(\'Isa\',38,12);">Isa 38:12</a> the Revised Version (British and American) reads "He will cut me off from the loom," margin "thrum." "Thrum" is a technical term of weavers, denoting the threads of the warp hanging down in a loom, suiting dallah, "that which hangs down" (<a onClick="return mV(\'Sgs\',7,5);">So 7:5</a>, "hair"). A misinterpretation of "hanging down" is responsible for the King James\' "pining sickness."``1';
isbe[8773]='Thummim`thum\'-im.`<a href="./study/isbe/search.html?string=URIM+AND+THUMMIM">URIM AND THUMMIM</a>`1';
isbe[8774]='Thunder`thun\'-der (ra\'am (<a onClick="return mV(\'1Sa\',2,10);">1Sa 2:10</a>; <a onClick="return mV(\'Job\',26,14);">Job 26:14</a>; <a onClick="return mV(\'Job\',39,19);">39:19</a>; <a onClick="return mV(\'Job\',40,9);">40:9</a>; <a onClick="return mV(\'Psa\',77,18);">Ps 77:18</a>; <a onClick="return mV(\'Psa\',81,7);">81:7</a>; <a onClick="return mV(\'Psa\',104,7);">104:7</a>; <a onClick="return mV(\'Isa\',29,6);">Isa 29:6</a>), qol, "a voice" (<a onClick="return mV(\'Exd\',9,23);">Ex 9:23</a>; <a onClick="return mV(\'1Sa\',7,10);">1Sa 7:10</a>; <a onClick="return mV(\'1Sa\',12,17);">12:17</a>; <a onClick="return mV(\'Job\',28,26);">Job 28:26</a>; <a onClick="return mV(\'Job\',38,25);">38:25</a>)): Thunder is the noise resulting from the lightning discharge. It is very common in the winter storms of Syria and Palestine and occurs in the extra-season storms. Thunder accompanied the storm of hail in Egypt at the time of the plagues: "The Lord sent thunder and hail" (<a onClick="return mV(\'Exd\',9,23);">Ex 9:23</a>).<P>Lightning and thunder are indications of the power of Yahweh and His might. "The thunder of his power who can understand?" (<a onClick="return mV(\'Job\',26,14);">Job 26:14</a>); "The God of glory thundereth" (<a onClick="return mV(\'Psa\',29,3);">Ps 29:3</a>). Yahweh also confused the Philistines with thunder (<a onClick="return mV(\'1Sa\',7,10);">1Sa 7:10</a>), and His foes were "visited of Yahweh of hosts with thunder" (<a onClick="return mV(\'Isa\',29,6);">Isa 29:6</a>). Thunder was regarded as the voice of Yahweh: "God thundereth with the voice of his excellency" (<a onClick="return mV(\'Job\',37,4);">Job 37:4</a>), and God spoke to Jesus in the thunder (bronte, <a onClick="return mV(\'Jhn\',12,29);">Joh 12:29</a>).`<a href="./study/isbe/search.html?string=LIGHTNING">LIGHTNING</a>`85';
isbe[8775]='Thyatira`thi-a-ti\'-ra (Thuateira): Thyatira was a wealthy town in the northern part of Lydia of the Roman province of Asia, on the river Lycus. It stood so near to the borders of Mysia, that some of the early writers have regarded it as belonging to that country. Its early history is not well known, for until it was refounded by Seleucus Nicator (301-281 BC) it was a small, insignificant town. It stood on none of the Greek trade routes, but upon the lesser road between Pergamos and Sardis, and derived its wealth from the Lycus valley in which it rapidly became a commercial center, but never a metropolis. The name "Thyatira" means "the castle of Thya." Other names which it has borne are Pelopia and Semiramis. Before the time of Nicator the place was regarded as a holy city, for there stood the temple of the ancient Lydian sun-god, Tyrimnos; about it games were held in his honor. Upon the early coins of Thyatira this Asiatic god is represented as a horseman, bearing a double-headed battle-ax, similar to those represented on the sculptures of the Hittites. A goddess associated with him was Boreatene, a deity of less importance. Another temple at Thyatira was dedicated to Sambethe, and at this shrine was a prophetess, by some supposed to represent the Jezebel of <a onClick="return mV(\'Rev\',2,20);">Re 2:20</a>, who uttered the sayings which this deity would impart to the worshippers.<P>Thyatira was specially noted for the trade guilds which were probably more completely organized there than in any other ancient city. Every artisan belonged to a guild, and every guild, which was an incorporated organization, possessed property in its own name, made contracts for great constructions, and wielded a wide influence. Powerful among them was the guild of coppersmiths; another was the guild of the dyers, who, it is believed, made use of the madder-root instead of shell-fish for making the purple dyestuffs. A member of this guild seems to have been Lydia of Thyatira, who, according to <a onClick="return mV(\'Act\',16,14);">Ac 16:14</a>, sold her dyes in Philippi. The color obtained by the use of this dye is now called Turkish red. The guilds were closely connected with the Asiatic religion of the place. Pagan feasts, with which immoral practices were associated, were held, and therefore the nature of the guilds was such that they were opposed to Christianity. According to <a onClick="return mV(\'Act\',19,10);">Ac 19:10</a>, Paul may have preached there while he was living at Ephesus, but this is uncertain; yet Christianity reached there at an early time. It was taught by many of the early church that no Christian might belong to one of the guilds, and thus the greatest opposition to Christianity was presented.<P>Thyatira is now represented by the modern town of Ak-Hissar on a branch line of the Manisa-Soma Railroad, and on the old Roman road 9 hours from Sardis. Ak-Hissar is Turkish for "white castle," and near the modern town may be seen the ruins of the castle from which the name was derived. The village is of considerable size; most of the houses are of mud, but several of the buildings erected by Caracalla are still standing, yet none of them are perfect. In the higher part of the town are the ruins of one of the pagan temples, and in the walls of the houses are broken columns and sarcophagi and inscribed stones. The population of 20,000 is largely Greek and Armenian, yet a few Jews live among them. Before the town is a large marsh, fever-laden, and especially unhealthful in the summer time, formed by the Lycus, which the Turks now call Geurdeuk Chai. The chief modern industry is rug-making.``7';
isbe[8776]='Thyine, Wood`thi\'-in (xulon thuinon): An aromatic wood described as sold in "Babylon" (<a onClick="return mV(\'Rev\',18,12);">Re 18:12</a>, the King James Version margin "sweet wood"). It is the wood of the thya (thuia) tree, probably identical with Thuia articulata an evergreen tree growing in Northern Africa, resembling the cypress, which in Roman times was employed for making valuable furniture.``1';
isbe[8777]='Tiberias`ti-be\'-ri-as ([Tiberias], <a onClick="return mV(\'Jhn\',6,23);">Joh 6:23</a>): About the middle of the western shore of the Sea of Galilee, the mountains fall back from the coast, and leave a roughly crescent-shaped plain, about 2 miles in length. The modern city of Tiberias (Tabariyeh) stands at the northern extremity, where the ground begins to rise; and the Hot Baths (Hammath) at the south end. On the southern part of this plain Herod Antipas built a city (circa 26 AD), calling it "Tiberias" in honor of the emperor who had befriended him. In clearing the ground and digging foundations certain tombs were disturbed (Ant., XVIII ii, 3). It may have been the graveyard of old Hammath. The palace, the famous "Golden House," was built on the top of a rocky hill which rises on the west to a height of some 500 ft. The ruin is known today as Qasr bint el-Melek, "Palace of the King\'s Daughter" The strong walls of the city can be traced in almost their entire length on the landward side. Parts are also to be seen along the shore, with towers at intervals which guarded against attack by sea. The ruins cover a considerable area. There is nothing above ground older than Herod\'s city. Only excavation can show whether or not the Talmud is fight in saying that Tiberias was built on the site of Rakkath and Chinnereth (Neubauer, Geog. du Talmud, 208). The Jews were shy of settling in a city built over an old cemetery; and Herod had trouble in finding occupants for it. A strange company it was that he ultimately gathered of the "poorer people," foreigners, and others "not quite freemen"; and these were drawn by the prospect of good houses and land which he freely promised them. With its stadium, its palace "with figures of living things" and its senate, it may be properly described as a Greek city, although it also contained a proseuche, or place of prayer, for the Jews (BJ II, xxi, 6; Vita, XII,54,etc.). This accounts for it figuring so little in the Gospels. In his anxiety to win the favor of the Jews, Herod built for them "the finest synagogue in Galilee"; but many years were to elapse before it should become a really Jewish city.<P>Superseding Sepphoris, Tiberias was the capital of Galilee under Agrippa I and the Roman procurators. It surrendered to Vespasian, and was given by Nero to Agrippa II, Sepphoris again becoming the capital. During the Jewish war its inhabitants were mainly Jewish, somewhat turbulent and difficult to manage. In 100 AD, at Agrippa\'s death, the Romans assumed direct control. After the fall of Jerusalem, the Sanhedrin retreated to Galilee, first to Sepphoris, and then to Tiberias. Here, some time before 220 AD, under supervision of the famous Rabbi Jehuda ha-Nasi\', "Judah the Prince," or, as he is also called ha-qadhosh, "the Holy," the civil and ritual laws, decrees, customs, etc., held to be of binding obligation, handed down by tradition, but not having Scriptural authority, were codified and written down, under the title of "Mishna." Here also later was compiled the Jerusalem Talmud (Yerushalmi), as distinguished from that compiled in Babylon (Babhli). The city thus became a great center of Jewish learning. Maimonides\' tomb is shown near the town, and that of Aqiba on the slope of the mountain, where it is said 24,000 of his disciples are buried with him.<P>In Christian times Tiberias was the seat of a bishop. It fell to the Moslems in 637. It changed hands several times as between the Crusaders and the Saracens. It was finally taken by the Moslems in 1247.<P>The enclosing walls of the modern city, and the castle, now swiftly going to ruin, were built by Tancred and repaired by Daher el-\'Omar in 1730. There are over 5,000 inhabitants, mostly Jews, in whose hands mainly is the trade of the place. The fishing in the lake, in which some 20 boats are occupied, is carried on by Moslems and Christians. Tiberias is the chief inhabited place on the lake, to which as in ancient days it gives its name, Bachr Tabariyeh, "Sea of Tiberias" (<a onClick="return mV(\'Jhn\',6,1);">Joh 6:1</a>; <a onClick="return mV(\'Jhn\',21,1);">21:1</a>). It is the market town for a wide district. The opening of the Haifa-Damascus Railway has quickened the pulse of life considerably. A steamer and motor boat ply between the town and the station at Semach, bringing the place into easy touch with the outside world. The water of the lake is largely used for all purposes, although there are cisterns for rain water under some of the houses.<P>After a residence of over five years in the city, the present writer can say that it does not deserve the evil reputation which casual travelers have given it. In matters of cleanliness and health it stands comparison very well with other oriental towns. Sometimes, in east wind; it is very hot, thermometer registering over 114 Degrees Fahrenheit in the shade. The worst time is just at the beginning of the rainy season, when the impurities that have gathered in the drought of summer are washed into the sea, contaminating the water.<P>The United Free Church of Scotland has here a well-equipped mission to the Jews.``54';
isbe[8778]='Tiberias, Sea of``<a href="./study/isbe/search.html?string=GALILEE+SEA+OF">GALILEE, SEA OF</a>`1';
isbe[8779]='Tiberius`ti-be\'-ri-us (Tiberios):<P>1. Name and Parentage:<P>The 2nd Roman emperor; full name Tiberius Claudius Nero, and official name as emperor Tiberius Caesar Augustus; born November 16, 42 BC. His father—of the same name—had been an officer under Julius Caesar and had later joined Antony against Octavian (Augustus). His mother was Livia, who became the 3rd wife of Augustus; thus Tiberius was a stepson of Augustus.<P>2. Early Life and Relation to Augustus:<P>Much of his early life was spent in successful campaigning. Although the ablest of the possible heirs of Augustus, Tiberius was subjected to many an indignity, Augustus accepting him as his successor only when every other hope failed. When Julia, daughter of Augustus, became a widow for the second time (12 BC), Tiberius was obliged to marry her (11 BC) in order to become protector of the future emperors. For this purpose he was compelled to divorce his wife, Vipsania Agrippina, who had borne him a son, Drusus. Julia brought Tiberius nothing but shame, and for her immorality was banished by her father (2 BC). Tiberius was consul in 12 BC, and received the proconsular authority, 9 BC. He carried on successful wars in Pannonia, Dalmatia, Armenia and Germany. He retired in disgust to voluntary exile at Rhodes where he spent several years in study. In 2 AD, he returned to Rome, and lived there in retirement, 2-4 AD. On June 27, 4 AD, Tiberius and Agrippa Postumus were adopted by Augustus. From this date on Tiberius came more and more into prominence, receiving the tribunician power for 10 years.<P>3. Reign:<P>In 13 AD (or according to Mommsen 11 AD) Tiberius was by a special law raised to the co-regency. Augustus died August 19, 14 AD, and Tiberius succeeded. A mutiny in the Rhine legions was suppressed by Germanicus. The principal events of his reign (see also below) were the campaigns of Germanicus and Drusus, the withdrawal of the Romans to the Rhine, the settlement of the Armenian question, the rise and fall of Sejanus, the submission of Parthia. In 26 AD, Tiberius retired to Capreae, where rumor attributed to him every excess of debauchery. On March 16, 37 AD, Tiberius died at Misenum and was succeeded by Caius.<P>4. Administration:<P>On the whole, Tiberius followed the conservative policy of Augustus and maintained the "diarchy." But he approached nearer to monarchy by receiving supreme power for an indefinite period. He went beyond Augustus in practically excluding the people from government by transferring the right of election from the comitia of the people to the senate, leaving to the people the right merely to acclaim the nominees of the senate, and further by imposing laws upon the people without their counsel or discussion. He established a permanent praetorian camp at Rome—a fact of great importance in later Roman history. The administration of Tiberius was that of a wise, intelligent statesman with a strong sense of duty. The civil service was improved, and officers were kept longer at their posts to secure efficiency. Taxes were light on account of his economy. Public security increased. He paid attention to the administration of justice and humane laws were placed on the statute-book.<P>5. Character:<P>Though Tiberius was unpopular, he left the empire in a state of prosperity and peace. Of his character the most opposite views are held. His fame has suffered especially from his suspecting nature, which extended the law of majestas to offenses against his person and encouraged delation, which made the latter part of his reign one of terror. The tyranny of Sejanus, too, has been laid upon his shoulders, and he has been accused of the wildest excesses in his retreat at Capreae—a charge which seems to be refuted by the fact that no interruption to his wise administration took place. His character has been blackened most by Tacitus and Suetonius. But on nearer criticism Tiberius\'s character will appear in better light. No doubt, toward the close of his reign he degenerated, but his cruelties affected only the upper classes. He was called a tyrant and was refused deification after death, and Augustus was said to have prophesied "Alas for the Roman people who shall be ground under such slow jaws." Tiberius was stern and taciturn, critical with himself and, soured by his own disappointments, was suspicious of others. Pliny the Elder calls him "the gloomiest of men." Much of his unpopularity was due to his inscrutability, to the fact that people could not understand him or penetrate into the mystery of his motives. He rarely took counsel with anyone. His life was frugal and modest—a rebuke to the contemporary dissipation. He felt contempt for the inanities of court life and was supremely indifferent to public opinion, but actuated by a strong sense of duty.<P>6. Tiberius and the New Testament:<P>The reign of Tiberius is memorable as that in which fell our Lord\'s public ministry, death and resurrection. It also witnessed the preaching of John the Baptist (<a onClick="return mV(\'Luk\',3,1);">Lu 3:1</a>), the conversion of Paul and perhaps his first preaching, the martyrdom of Stephen and the first Christian persecution (by the Jews). Tiberius is mentioned by name only once in the New Testament (<a onClick="return mV(\'Luk\',3,1);">Lu 3:1</a>): "the 15th year of the reign (hegemonia) of Tiberius." The question is, From what date is this to be reckoned—the date of Tiberius\'s co-regency, 13 (or 11) AD, or from his accession, 14 AD? He is the "Caesar" mentioned in the Gospels in connection with Jesus\' public ministry (<a onClick="return mV(\'Mar\',12,14);">Mr 12:14</a> and parallel\'s; <a onClick="return mV(\'Jhn\',19,12,15);">Joh 19:12,15</a>). Herod Antipas built Tiberias in honor of Tiberius (Josephus, Ant, XVIII, ii-iii). It is unlikely that Tiberius ever heard anything about Christianity; it had not risen as yet into prominence. Early Christian writers wished to represent Tiberius, if not friendly to the new faith, at least as condemning the action of Pilate. According to one apocryphal tradition, Tiberius actually summoned Pilate to Rome to answer for crucifying Jesus. It is true that Pilate was sent to Rome by the governor of Syria to answer to a charge of unjustifiable cruelty, but Tiberius died before Elate reached Rome.<P>7. Tiberius and the Jews:<P>Under Tiberius Palestine was governed by Roman procurators. Toward the Jews in Italy, Tiberius showed some intolerance. In 19 AD all the Jews were expelled from Rome according to Josephus (Ant., XVIII, iii, 5), from Italy according to Tacitus (Ann. ii.85), and 4,000 Jewish freedmen were deported to Sardinia to reduce bands of brigands. Philo attributes this severity to Sejanus, and says that after Sejanus\' fall Tiberius, recognizing that the Jews had been persecuted without cause, gave orders that officials should not annoy them or disturb their rites. They were therefore probably allowed to return to Rome (see Schurer, III, 60f; 4th edition).<P>LITERATURE.<P>(a) Ancient literature, as modern, is divided on its estimate of Tiberius; Tacitus Annals i-vi; Dio Cassius Rom. Hist. xivi-xivii, and Suetonius Tib. painting him in the darkest colors, while Velleius Paterculus II gives the other side.<P>(b) Of modern literature it is enough to cite on opposite sides: J. C. Tarver, Tiberius the Tyrant, 1902; Ihne, Zur Ehrenrettung des K. Tib.,1892,and the moderate estimate of Merivale, Romans under the Empire.``5';
isbe[8780]='Tibhath`tib\'-hath (tibhchath; Metabechas, Codex Alexandrinus Matebeth; Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) Thebath; Peshitta Tebhach): A city of Hadadezer, king of Zobah, from which David took much of the brass used later by Solomon in the construction of the temple-furnishings (<a onClick="return mV(\'1Ch\',18,8);">1Ch 18:8</a>). In <a onClick="return mV(\'2Sa\',8,8);">2Sa 8:8</a> we must for the betach of the Massoretic Text read with the Syriac Tebhach. It may be the same as the Tubihi of the Tell el-Amarna Letters; the Dibhu of the Karnak lists; and the Tubihi mentioned with Kadesh on the Orontes in the "Travels of an Egyptian" in the reign of Rameses II. The site is unknown, but it must have been on the eastern slopes of Anti-Lebanon, between which and the Euphrates we must locate Hadadezer\'s kingdom of Zobah. "Tebah" occurs also as an Aramaic personal or tribal name in <a onClick="return mV(\'Gen\',22,24);">Ge 22:24</a>.``23';
isbe[8781]='Tibni`tib\'-ni (tibhni; Codex Vaticanus Thamnei, Codex Alexandrinus Thamni, Lucian Thabennei): A rival of Omri for the throne of Israel after the death of Zimri (<a onClick="return mV(\'1Ki\',16,21);">1Ki 16:21</a>f). This is the only reference to Tibni that has come down to us; a comparison of this passage with the account of Zimri\'s death (especially <a onClick="return mV(\'1Ki\',16,15);">1Ki 16:15</a>) shows that the length of the struggle was four years.``1';
isbe[8782]='Tidal`ti\'-dal (tidh\'al; Thalga, Thalgal, Codex E, Thargal):<P>1. The Name and Its Forms:<P>Tidal is mentioned in <a onClick="return mV(\'Gen\',14,1,9);">Ge 14:1,9</a> in the account of the expedition of Chedorlaomer of Elam, with his allies, Amraphel of Shinar (Babylonia), Arioch of Ellasar, and Tidal, who is called "king of nations" (the King James Version) (goyim, Targum \'ammin). Whether the last-named took part in this expedition as one of Chedorlaomer\'s vassals or not is unknown. The Greek form possibly prints to an earlier pronunciation Tadgal.<P>2. Its Babylonian Equivalent:<P>The only name in the cuneiform inscriptions resembling Tidal is Tudhula, or, as it was probably later pronounced, Tudhul. This, from its form, might be Sumerian, meaning "evil progeny," or the like. In addition to the improbability of a name with such a signification, however, his title "king of goyim," or "nations," in <a onClick="return mV(\'Gen\',14,1);">Ge 14:1</a>, presupposes a ruler of another race.<P>3. The Babylonian Tudhula and His Time:<P>The inscription in which the name Tudhula occurs is one of three of late date (4th to 3rd century BC), all referring, apparently, to the same historical period. The text in question (Sp. iii.2) is of unbaked clay, and is broken and defaced. After referring to a ruler who did not maintain the temples, Durmah-ilani son of Eri-Aku (Arioch) is referred to, appatently as one who ravaged the country, and "waters (came) over Babylon and E-sagila," its great temple. The words which follow suggest that Durmah-ilani was slain by his son, after which a new invader appeared, who would seem to have been Tudhula, son of Gazza(ni?). He likewise ravaged the land, and floods again invaded Babylon and E-sagila. To all appearance he met with the fate which overtook Durmah-ilani—death at the hands of his son, who "smote his head." Then came the Elamite, apparently Chedorlaomer, who was likewise slain. This inscription, therefore, gave historical quotations of the fate which overtook those who were regarded as enemas of the gods.<P>4. Doubts as to His Identity:<P>Though we have here the long-sought name of Tidal, it may legitimately be doubted whether this personage was the ruler of that name mentioned in <a onClick="return mV(\'Gen\',14,\'1-\');">Ge 14</a>. The "nations" (goyim) which he ruled are regarded by Sayce as having been wandering hordes (umman manda), probably Medes. On the other hand, the occurrence of the name Dudhalia, son of Hattusil (Khetasir), contemporary of Rameses II, in the inscriptions found at Hattu, the capital of the Hittites, suggests that that extensive confederation may have been the "nations" referred to. In other words, Tidal or Tudhula (for Dudhalia) was an earlier ruler bearing the same name as Hattusil\'s son.<P>5. Probably a Hittite:<P>If he be, as is possible, the same personage as is mentioned in <a onClick="return mV(\'Gen\',14,\'1-\');">Ge 14</a>, he must have fought against Arioch\'s son, conquered his domains and been killed, in his turn, by either the Biblical Chedorlaomer or another Elamite ruler beaming the same or a similar name.`<a href="./study/isbe/search.html?string=AMRAPHEL">AMRAPHEL</a>; <a href="./study/isbe/search.html?string=ARIOCH">ARIOCH</a>; <a href="./study/isbe/search.html?string=CHEDORLAOMER">CHEDORLAOMER</a>; <a href="./study/isbe/search.html?string=ERI-AKU">ERI-AKU</a>; <a href="./study/isbe/search.html?string=NATIONS">NATIONS</a>`136';

isbe[8784]='Tiglath-Pileser`tig-lath-pi-le-zer<P>tighlath pil\'eser, as the name is read in 2 Kings, tilleghath pilnecer, in 2 Chronicles; Septuagint Algathphellasar; Assyrian, Tukulti-abal-i-sarra): King of Assyria in the days of Menahem, Pekahiah, and Pekah, kings of Israel, and of Uzziah, Jotham and Ahaz, kings of Judah. The king of Assyria, whom the historian of 2 Kings knows as exacting tribute from Menahem, is Pul (<a onClick="return mV(\'2Ki\',15,19);">2Ki 15:19</a>f). In the days of Pekah who had usurped the throne of Menahem\'s son and successor, Pekahiah, the king of Assyria is known as Tiglath-pileser, who invaded Naphtali and carried the inhabitants captive to Assyria (<a onClick="return mV(\'2Ki\',15,29);">2Ki 15:29</a>). This invasion is described by the Chronicler (<a onClick="return mV(\'1Ch\',5,25);">1Ch 5:25</a>f) rather differently, to the effect that "the God of Israel stirred up the spirit of Pul king of Assyria, and the spirit of Tilgath-pilneser king of Assyria, and he carried them away, even the Reubenites and the Gadites, and the half-tribe of Manasseh, and brought them unto Halah, and Habor, and Hara, and to the river of Gozan, unto this day." Still later we find Pekah forming a coalition with Rezin, king of Damascus, into which they tried to force Ahaz, even going the length of besieging him in Jerusalem (<a onClick="return mV(\'2Ki\',16,5);">2Ki 16:5</a>). The siege was unsuccessful. Ahaz called in the aid of Tiglath-pileser, sacrificing his independence to get rid of the invaders (<a onClick="return mV(\'2Ki\',16,7,8);">2Ki 16:7,8</a>). He offered the Assyrian the silver and gold that were found in the house of the Lord and in the royal treasury; and Tiglath-pileser, in return, invaded the territories of Damascus and Israel in the rear, compelling the allied forces to withdraw from Judah, while he captured Damascus, and carried the people away to Kir and slew Rezin (<a onClick="return mV(\'2Ki\',16,9);">2Ki 16:9</a>). It was on the occasion of his visit to Damascus to do homage to his suzerain Tiglath-pileser, that Ahaz fancied the idolatrous altar, a pattern of which he sent to Urijah, the priest, that he might erect an altar to take the place of the brazen altar which was before the Lord in the temple at Jerusalem. It is a significant comment which is made by the Chronicler (<a onClick="return mV(\'2Ch\',28,21);">2Ch 28:21</a>) upon the abject submission of Ahaz to the Assyrian king: "It helped him not."<P>From the inscriptions we learn particulars which afford striking corroboration of the Biblical narrative and clear up some of the difficulties involved. It is now practically certain that Pul, who is mentioned as taking tribute from Menahem, is identical with Tiglath-pileser (Schrader, COT, I, 230, 231). In all probability Pul, or Pulu, was a usurper, who as king of Assyria assumed the name of one of his predecessors, Tiglath-pileser I, and reigned as Tiglath-pileser III. This king of Assyria, who reigned, as we learn from his annals, from 745 BC to 727 BC, was one of the greatest of Assyrian monarchs. See <a href="./study/isbe/search.html?string=ASSYRIA">ASSYRIA</a>. From the fact that no fewer than five Hebrew kings are mentioned in his annals, the greatest interest attaches to his history as it has come down to us. These kings are Uzziah or Azariah, and Jehoahaz, that is Ahaz, of Judah; and Menahem, Pekah and Hushes of Israel. Along with them are mentioned their contemporaries Rezin of Damascus, Hiram of Tyre, and two queens of Arabia otherwise unknown, Zabibi and Samsi. When he died in 727 BC, he was succeeded by Shalmaneser IV, who had occasion to suspect the loyalty of his vassal Hoshea, king of Israel, and besieged him in Samaria.<P>LITERATURE.<P>Schrader, COT, I, 229-57; McCurdy, HPM, sections 279-341.``128';
isbe[8785]='Tigris`ti\'-gris the Greek equivalent of the Hebrew chiddeqel): One of the rivers of Eden going "eastward to Assyria" (<a onClick="return mV(\'Gen\',2,14);">Ge 2:14</a> margin), called the Great River (<a onClick="return mV(\'Dan\',10,4);">Da 10:4</a>), elsewhere mentioned in the apocryphal books, as in Tob 6:1; Judith 1:6; Ecclesiasticus 24:25, called Diglath in Josephus, and Diglit in Pliny, now called in Mesopotamia Dijleh, generally supposed to be a Semitic corruption of Tigra, meaning originally an arrow, which from its rapidity of motion is symbolized. The Tigris rises in the mountains of Armenia, latitude 38 degrees 10 minutes, longitude 39 degrees 20 minutes, only a few miles from the main branch of the Euphrates. After pursuing a tortuous southeasterly course for 150 miles, it is joined by the east branch at Osman Kieui, some distance below Diarbekr. Here the stream is 450 ft. wide and 3 or 4 ft. deep. Passing through numerous mountain gorges for another 150 miles, it emerges into the region of low hills about Nineveh, and a little below into the great alluvial plain of Mesopotamia. Thence in its course to Bagdad it is joined by the Great Zab, the Lesser Zab, the Adhem, and the Diyaleh rivers, bringing a large amount of water from the Zagros Mountains. At Bagdad the overflows from the Euphrates in high water often increase the inundations. The flood season begins early in the month of March, reaching its climax about May 1, declining to its natural level by midsummer. In October and November, the volume of water increases considerably, but not so much as to overflow its banks. Below Bagdad, throughout the region of Babylonia proper, the Tigris joins with the Euphrates in furnishing the water for irrigation so successfully used in ancient times. English engineers are at present with great promise of success aiming to restore the irrigating systems of the region and the prosperity of ancient times. The total length of the river <span class="noTag">is</span> 1,146 miles. It now joins the Euphrates about 40 miles northwest of the Persian Gulf, the two streams there forming the Shat el Arab, but in early historical times they entered the Persian Gulf by separate mouths, the Gulf then extending a considerable distance above the present junction of the rivers, the sediment of the streams having silted up the head of the Gulf to that distance.`<a href="./study/isbe/search.html?string=EDEN">EDEN</a>`198';
isbe[8786]='Tikvah; Tikvath`tik\'-va, tik\'-vath (tiqwah, "hope"): <P>(1) The father-in-law of Huldah the prophetess (<a onClick="return mV(\'2Ki\',22,14);">2Ki 22:14</a>) (Codex Vaticanus Thekkouau; Codex Alexandrinus Thekkoue; Lucian Thekoue), called in <a onClick="return mV(\'2Ch\',34,22);">2Ch 34:22</a> "Tokhath" (Qere Kethibh Codex Vaticanus Kathoual; Codex Alexandrinus Thakouath, Lucian Thekoe). The reading of 2 Kings is to be preferred.<P>(2) The father of Jahzeiah (<a onClick="return mV(\'Ezr\',10,15);">Ezr 10:15</a>) (Codex Vaticanus Helkeia; Codex Alexandrinus Thekoue, called "Theocanus," Revised Version "Thocanus" in 1Esdras 9:14).``1';

isbe[8793]='Time`tim: The basis of the Hebrew measurement of time was the day and the lunar month, as with the Semites generally. The division of the day into hours was late, probably not common until after the exile, although the sun-dial of Ahaz (<a onClick="return mV(\'2Ki\',20,9);">2Ki 20:9</a>; <a onClick="return mV(\'Isa\',38,8);">Isa 38:8</a>) would scent to indicate some division of the day into periods of some sort, as we know the night was divided, The word used for "hour" is Aramaic she\'a\' (sha\'ta\'), and does not occur in the Old Testament until the Book of Daniel (<a onClick="return mV(\'Dan\',4,33);">4:33</a>; <a onClick="return mV(\'Dan\',5,5);">5:5</a>), and even there it stands for an indefinite period for which "time" would answer as well.<P>1. The Day:<P>The term "day" (yom) was in use from the earliest times, as is indicated in the story of the Creation (<a onClick="return mV(\'Gen\',1,\'1-\');">Ge 1</a>). It there doubtless denotes an indefinite period, but is marked off by "evening and morning" in accordance with what we know was the method of reckoning the day of 24 hours, i.e. from sunset to sunset.<P>2. Night:<P>The night was divided, during pre-exilic times, into three divisions called watches (\'ashmurah, \'ashmoreth), making periods of varying length, as the night was longer or shorter (<a onClick="return mV(\'Jdg\',7,19);">Jud 7:19</a>). This division is referred to in various passages of the Old Testament, but nowhere with indication of definite limits (see <a onClick="return mV(\'Psa\',90,4);">Ps 90:4</a>; <a onClick="return mV(\'Psa\',119,148);">119:148</a>; <a onClick="return mV(\'Jer\',51,12);">Jer 51:12</a>; <a onClick="return mV(\'Hab\',2,1);">Hab 2:1</a>).<P>In the New Testament we find the Roman division of, etc.). But the use of the word in the indefinite sense, as in the expressions: "day of the Lord," "in that day," "the day of judgment," etc., is far more frequent (see DAY). Other more or less indefinite periods of the day and night are: dawn, dawning of the day, morning, evening, noonday, midnight, cock-crowing or crowing of the cock, break of day, etc.<P>3. Week:<P>The weekly division of time, or the seven-day period, was in use very early and must have been known to the Hebrews before the Mosaic Law, since it was in use in Babylonia before the days of Abraham and is indicated In the story of the Creation. The Hebrew shabhua\', used in the Old Testament for "week," is derived from shebha\', the word for "seven." As the seventh day was a day of rest, or Sabbath (Hebrew shabbath), this word came to be used for "week," as appears in the New Testament sabbaton, sabbata), indicating the period from Sabbath to Sabbath (<a onClick="return mV(\'Mat\',28,1);">Mt 28:1</a>). The same usage is implied in the Old Testament (<a onClick="return mV(\'Lev\',23,15);">Le 23:15</a>; <a onClick="return mV(\'Lev\',25,8);">25:8</a>). The days of the week were indicated by the numerals, first, second, etc., save the seventh, which was the Sabbath. In New Testament times Friday was called the day of preparation (paraskeue) for the Sabbath (<a onClick="return mV(\'Luk\',23,54);">Lu 23:54</a>).<P>4. Month:<P>The monthly division of time was determined, of course, by the phases of the moon, the appearance of the new moon being the beginning of the month, chodhesh. Another term for month was yerach yerach, meaning "moon," which was older and derived from the Phoenician usage, but which persisted to late times, since it is found in the Aramaic inscriptions of the 3rd century AD in Syria. The names of the months were Babylonian and of late origin among the Hebrews, probably coming into use during and after the Captivity. But they had other names, of earlier use, derived from the Phoenicians, four of which have survived in "Abib," "Ziv," "Ethanim" and "Bul."<P>See <a href="./study/isbe/search.html?string=CALENDAR">CALENDAR</A>.<P>5. Year:<P>The Hebrew year (shanah) was composed of 12 or 13 months, the latter being the year when an intercalary month was added to make the lunar correspond with the solar year. As the difference between the two was from ten to eleven days, this required the addition of a month once in about three years, or seven in nineteen years. This month was added at the vernal equinox and was called after the month next preceding, we-\'adhar, or the "second Adar." We do not know when this arrangement was first adopted, but it was current after the Captivity. There were two years in use, the civil and the ritual, or sacred year. The former began in the autumn, as would appear from <a onClick="return mV(\'Exd\',23,16);">Ex 23:16</a>; <a onClick="return mV(\'Exd\',34,22);">34:22</a>, where it is stated that the "feast of ingathering" should be at the end of the year, and the Sabbatic year began in the 7th month of the calendar or sacred year, which would correspond to September-October (<a onClick="return mV(\'Lev\',25,9);">Le 25:9</a>). Josephus says (Ant., I, iii, 3) that Moses designated Nican (March-April) as the 1st month of the festivals, i.e. of the sacred year, but preserved the original order of the months for ordinary affairs, evidently referring to the civil year. This usage corresponds to that of the Turkish empire, where the sacred year is lunar and begins at different seasons, but the financial and political year begins in March O.S. The beginning of the year was called ro\'sh ha-shanah, and was determined by the priests, as was the beginning of the month. Originally this was done by observation of the moon, but, later, calculation was employed in connection with it, until finally a system based on accurate calculation was adopted, which was not until the 4th century AD. New-Year was regarded as a festival.<P>See <a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>, sec. I, 5; <a href="./study/isbe/search.html?string=YEAR">YEAR</A>.<P>6. Seasons:<P>The return of the seasons was designated by summer and winter, or seed-time and harvest; for they were practically the same. There is, in Palestine, a wet season, extending from October to March or April, and a dry season comprising the remainder of the year. The first is the winter (choreph), and this is the seed-time (zera\'), especially the first part of it called yoreh, or the time of the early rain; the second is the summer (qayits, "fruit-harvest," or qatsir, "harvest").<P>Seed-time begins as soon as the early rains have fallen in sufficient quantity to moisten the earth for plowing, and the harvest begins in some parts, as in the lower Jordan region, near the Dead Sea, about April, but on the high lands a month or two later. The fruit harvest comes in summer proper and continues until the rainy season. "The time when kings go out to war" (<a onClick="return mV(\'2Sa\',11,1);">2Sa 11:1</a>; <a onClick="return mV(\'1Ki\',20,22);">1Ki 20:22</a>) probably refers to the end of the rainy season in Nican.<P>7. No Era:<P>We have no mention in the Old Testament of any era for time reckoning, and we do not find any such usage until the time of the Maccabees. There are occasional references to certain events which might have served for eras had they been generally adopted. Such was the Exodus in the account of the building of the temple (<a onClick="return mV(\'1Ki\',6,1);">1Ki 6:1</a>) and the Captivity (<a onClick="return mV(\'Eze\',33,21);">Eze 33:21</a>; <a onClick="return mV(\'Eze\',40,1);">40:1</a>) and the Earthquake (<a onClick="return mV(\'Amo\',1,1);">Am 1:1</a>). Dates were usually fixed by the regnal years of the kings, and of the Persian kings after the Captivity. When Simon the Maccabee became independent of the Seleucid kings in 143-142 or 139-138 BC, he seems to have established an era of his own, if we may attribute to him a series of coins dated by the years "of the independence of Israel" (see <a href="./study/isbe/search.html?string=COINS">COINS</a>: <a href="./study/isbe/search.html?string=MONEY">MONEY</a>; also 1Macc 13:41 and 15:6,10). The Jews doubtless were familiar with the Seleucid era, which began in 312 BC, and with some of the local eras of the Phoenician cities, but we have no evidence that they made use of them. The era of the Creation was not adopted by them until after the time of Christ. This was fixed at 3,830 years before the destruction of the later temple, or 3760 BC.`<a href="./study/isbe/search.html?string=ERA">ERA</a>`138';

isbe[8797]='Timna`tim\'-na (timna\'; Thamna): A conbubine of Eliphaz, Esau\'s son, and the mother of Amalek (<a onClick="return mV(\'Gen\',36,12);">Ge 36:12</a>). But in <a onClick="return mV(\'Gen\',36,22);">Ge 36:22</a> and <a onClick="return mV(\'1Ch\',1,39);">1Ch 1:39</a> Timna is the sister of Lotan, and in <a onClick="return mV(\'Gen\',36,40);">Ge 36:40</a> and <a onClick="return mV(\'1Ch\',1,51);">1Ch 1:51</a> a chief or elan of Edom (see <a href="./study/isbe/search.html?string=TIMNAH">TIMNAH</a> (3)). These variations are to be expected when the origin of genealogies is recalled. (In Genesis, English Versions of the Bible read, contrary to rule, "Timnah.") Gunkel\'s theory is that <a onClick="return mV(\'Gen\',36,12);">Ge 36:12</a> is a later insertion in P.``1';
isbe[8798]='Timnah`tim\'-na (timnah, timnathah (<a onClick="return mV(\'Jos\',19,43);">Jos 19:43</a>; <a onClick="return mV(\'Jdg\',14,1,2,5);">Jud 14:1,2,5</a>), "allotted portion"; Codex Vaticanus Thamnatha; also several Greek variations; King James Version has Timnath in <a onClick="return mV(\'Gen\',38,12,13,14);">Ge 38:12,13,14</a>; <a onClick="return mV(\'Jdg\',14,1,2,5);">Jud 14:1,2,5</a>; and Thimnathah in <a onClick="return mV(\'Jos\',19,43);">Jos 19:43</a>):<P>(1) A town in the southern part of the hill country of Judah (<a onClick="return mV(\'Jos\',15,57);">Jos 15:57</a>). Tibna proposed by Conder, a ruin 8 miles west of Bethlehem, seems too far N. (PEF, III, 53, Sh XVII). It is possible this may be the "Timnah" of <a onClick="return mV(\'Gen\',38,12,13,14);">Ge 38:12,13,14</a>.<P>(2) A town on the northern border of Judah (<a onClick="return mV(\'Jos\',15,10);">Jos 15:10</a>), lying between Beth-shemesh and Ekron. It is probably the same Timnah as Judah visited (<a onClick="return mV(\'Gen\',38,\'12-14\');">Ge 38:12-14</a>), and certainly the scene of Samson\'s adventures (<a onClick="return mV(\'Jdg\',14,1);">Jud 14:1</a>f); his "father-in-law" is called a "Timnite" (<a onClick="return mV(\'Jdg\',15,6);">Jud 15:6</a>). At this time the place is clearly Philistine (<a onClick="return mV(\'Jdg\',14,1);">Jud 14:1</a>), though in <a onClick="return mV(\'Jos\',19,43);">Jos 19:43</a> it is reckoned to Dan. Being on the frontier, it probably changed hands several times. In <a onClick="return mV(\'2Ch\',28,18);">2Ch 28:18</a> it was captured from the Philistines by Ahaz, and we learn from Assyrian evidence (Prison Inscription) that Sennacherib captured a Tamna after the battle of Alteka before he besieged Ekron (Schrader, Die Keilinschriften und das Altes Testament, 170). The site is undoubted. It is now a deserted ruin called Tibneh on the southern slopes of the Wady es Surar (Valley of Sorek), about 2 miles west of Beth-shemesh. There is a spring, and there are evident signs of antiquity (PEF, II, 417, 441, Sh XVI).<P>(3) There was probably a Timna in Edom (<a onClick="return mV(\'Gen\',36,12,22,40);">Ge 36:12,22,40</a>; <a onClick="return mV(\'1Ch\',1,39,51);">1Ch 1:39,51</a>). Eusebius and Jerome (in Onomasticon) recognized a Thamna in Edom at their time.<P>(4) The "Thamnatha" of 1Macc 9:50 (the King James Version) is probably another Timnah, and identical with the Thamna of Josephus (BJ, III, iii, 5; IV, viii, 1). This is probably the Tibneh, 10 miles northwest of Bethel, an extensive ruin.``117';

isbe[8800]='Timnath-Heres`tim-nath-he\'rez (timnath cherec, "portion of the sun"; Codex Vaticanus Thamnathares; Codex Alexandrinus Thamnathar; heos): This is the form of the name given to Joshua\'s property and place of burial in <a onClick="return mV(\'Jdg\',2,9);">Jud 2:9</a>. The name in <a onClick="return mV(\'Jos\',19,50);">Jos 19:50</a>; <a onClick="return mV(\'Jos\',24,30);">24:30</a> is Timnath-serah. "Serah" simply reverses the order of the letters in "Heres." Scholars are divided in opinion as to which form is correct. It is possible that the change from Heres to Serah may have been deliberate, in order to avoid a form which might savor of idolatry—sun-worship. The Jews and Samaritans hold that Heres is the original form.``54';
