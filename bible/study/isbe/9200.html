isbe[9248]='Worm; Scarlet-Worm`wurm, skar\'-let-wurm:<P>(1) tola\', tole\'ah, tola\'ath, tola\'ath, from tala\'; compare Arabic tala, "to stretch the neck"; usually with shani, "bright" (of Arabic sana, "a flash of lightning"), the term tola\'ath shani being translated "scarlet" in English Versions of the Bible; also in the same sense the following: sheni tola\'ath (<a onClick="return mV(\'Lev\',14,4);">Le 14:4</a>), tola\' (<a onClick="return mV(\'Isa\',1,18);">Isa 1:18</a>, English Versions of the Bible "crimson"), shanim (<a onClick="return mV(\'Pro\',31,21);">Pr 31:21</a>; <a onClick="return mV(\'Isa\',1,18);">Isa 1:18</a>, English Versions of the Bible "scarlet"), shani (<a onClick="return mV(\'Gen\',38,28);">Ge 38:28</a>; <a onClick="return mV(\'Jos\',2,18);">Jos 2:18</a>; <a onClick="return mV(\'Sgs\',4,3);">So 4:3</a>); also kokkos, and kokkinos (<a onClick="return mV(\'Mat\',27,23);">Mt 27:23</a>; <a onClick="return mV(\'Hbr\',9,19);">Heb 9:19</a>; <a onClick="return mV(\'Rev\',17,3,4);">Re 17:3,4</a>; <a onClick="return mV(\'Rev\',18,12,16);">18:12,16</a>).<P>(2) rimmah, from ramam, "to putrefy" (<a onClick="return mV(\'Exd\',16,20);">Ex 16:20</a>); compare Arab ramm, "to become carious" (of bone).<P>(3) cac (only in <a onClick="return mV(\'Isa\',51,8);">Isa 51:8</a>); compare Arabic sus, "worm"; ses, "moth" (<a onClick="return mV(\'Mat\',6,19);">Mt 6:19</a>).<P>(4) zochalim (<a onClick="return mV(\'Mic\',7,17);">Mic 7:17</a>, the King James Version "worms," the Revised Version (British and American) "crawling things"), from zachal, "to crawl."<P>(5) skolex (<a onClick="return mV(\'Mar\',9,48);">Mr 9:48</a>), skolekobrotos, "eaten of worms" (<a onClick="return mV(\'Act\',12,23);">Ac 12:23</a>).<P>Besides the numerous passages, mostly in Exodus, referring to the tabernacle, where tola\'ath, with shani, is translated "scarlet," there are eight pasages in which it is translated "worm." These denote worms which occur in decaying organic matter or in sores (<a onClick="return mV(\'Exd\',16,20);">Ex 16:20</a>; <a onClick="return mV(\'Isa\',14,11);">Isa 14:11</a>; <a onClick="return mV(\'Isa\',66,24);">66:24</a>); or which are destructive to plants (<a onClick="return mV(\'Deu\',28,39);">De 28:39</a>; <a onClick="return mV(\'Jon\',4,7);">Jon 4:7</a>); or the word is used as a term of contempt or depreciation (<a onClick="return mV(\'Job\',25,6);">Job 25:6</a>; <a onClick="return mV(\'Psa\',22,6);">Ps 22:6</a>; <a onClick="return mV(\'Isa\',41,14);">Isa 41:14</a>). Rimmah is used in the same senses. It occurs with tola\'ath as a synonym in <a onClick="return mV(\'Exd\',16,24);">Ex 16:24</a>; <a onClick="return mV(\'Job\',25,6);">Job 25:6</a>; <a onClick="return mV(\'Isa\',14,11);">Isa 14:11</a>. In <a onClick="return mV(\'Job\',25,6);">Job 25:6</a>, English Versions of the Bible, rendering both tola\'ath and rimmah by "worm," \'enosh and \'adham by "man," and introducing twice "that is a," makes a painfully monotonous distich out of the concise and elegant original, in which not one word of the first part is repeated in the second. Cac (<a onClick="return mV(\'Isa\',51,8);">Isa 51:8</a>), English Versions of the Bible "worm," is the larva of the clothes-moth. See <a href="./study/isbe/search.html?string=MOTH">MOTH</a>. In none of the cases here considered are worms, properly so called, denoted, but various insect larvae which are commonly called "worms," e.g. "silkworm," "apple-worm," "meal-worm," etc. These larvae are principally those of Diptera or flies, Coleoptera or beetles, and Lepidoptera or butterflies and moths.<P>Tola\'ath shani, "scarlet," is the scarlet-worm, Cermes vermilio, a scale-insect which feeds upon the oak, and which is used for producing a red dye. It is called by the Arabs dudeh, "a worm," a word also used for various insect larvae. It is also called qirmiz, whence "crimson" and the generic name Cermes. This scarlet-worm or scale-insect is one of the family Coccidae of the order Rhynchota or Hemiptera. The female is wingless and adheres to its favorite plant by its long, sucking beak, by which it extracts the sap on which it lives. After once attaching itself it remains motionless, and when dead its body shelters the eggs which have been deposited beneath it. The males, which are smaller than the females, pass through a complete metamorphosis and develop wings. The dye is made from the dried bodies of the females. Other species yielding red dyes are Porphyrophora polonica and Coccus cacti. The last named is the Mexican cochineal insect which feeds on the cactus and which largely supplanted the others after the discovery of America. Aniline dyes have in turn to a great extent superseded these natural organic colors, which, however, continue to be unsurpassed for some purposes.`<a href="./study/isbe/search.html?string=COLORS">COLORS</a>`37';
isbe[9249]='Wormwood`wurm\'-wood (la\'anah (<a onClick="return mV(\'Deu\',29,18);">De 29:18</a>; <a onClick="return mV(\'Pro\',5,4);">Pr 5:4</a>; <a onClick="return mV(\'Jer\',9,15);">Jer 9:15</a>; <a onClick="return mV(\'Jer\',23,15);">23:15</a>; <a onClick="return mV(\'Lam\',3,15,19);">La 3:15,19</a>; <a onClick="return mV(\'Amo\',5,7);">Am 5:7</a>; <a onClick="return mV(\'Amo\',6,12);">6:12</a>, the King James Version hemlock); apsinthos (<a onClick="return mV(\'Rev\',8,11);">Re 8:11</a>)): What the Hebrew la\'anah may have been is obscure; it is clear it was a bitter substance and it is usually associated with "gall"; in the Septuagint it is variously translated, but never by apsinthos, "wormwood." Nevertheless all ancient tradition supports the English Versions of the Bible translation. The genus Artemisia (Natural Order Compositae), "wormwood," has five species of shrubs or herbs found in Palestine (Post), any one of which may furnish a bitter taste. The name is derived from the property of many species acting as anthelmintics, while other varieties are used in the manufacture of absinthe.``117';
isbe[9250]='Wormwood, the Star`In <a onClick="return mV(\'Rev\',8,11);">Re 8:11</a>, the name is figurative, given to a great star which, at the sounding of the third angel\'s trumpet, fell from heaven upon the third part of the rivers and on the fountains of the waters, turning them to a bitterness of which many died. Wormwood is used of bitter calamities (of <a onClick="return mV(\'Lam\',3,15);">La 3:15</a>), and may here indicate some judgment, inflicted under a noted leader, affecting chiefly the internal sources of a country\'s prosperity. Older expositors, applying the earlier trumpets to the downfall of the Roman empire, saw in the star a symbol of the barbarian invasions of Attila or Genseric.`<a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>`132';
isbe[9251]='Worship`wur\'-ship (Anglo-Saxon: weorthscipe, wyrthscype, "honor," from weorth, wurth, "worthy," "honorable," and scipe, "ship"):<P>1. Terms<P>2. Old Testament Worship<P>3. New Testament Worship<P>4. Public Christian Worship<P>LITERATURE<hr /><P>Honor, reverence, homage, in thought, feeling, or act, paid to men, angels, or other "spiritual" beings, and figuratively to other entities, ideas, powers or qualities, but specifically and supremely to Deity.<P>1. Terms:<P>The principal Old Testament word is shachah, "depress," "bow down," "prostrate" (Hithpael), as in <a onClick="return mV(\'Exd\',4,31);">Ex 4:31</a>, "bowed their heads and worshipped"; so in 94 other places. The context determines more or less clearly whether the physical act or the volitional and emotional idea is intended. The word is applied to acts of reverence to human superiors as well as supernatural. the Revised Version (British and American) renders it according to its physical aspect, as indicated by the context, "bowed himself down" (the King James Version "worshipped," <a onClick="return mV(\'Gen\',24,52);">Ge 24:52</a>; compare <a onClick="return mV(\'Gen\',23,7);">23:7</A>; <a onClick="return mV(\'Gen\',27,29);">27:29</A>, etc.).<P>Other words are: caghadh, "prostrate," occurring in <a onClick="return mV(\'Isa\',44,15,17,19);">Isa 44:15,17,19</a>; <a onClick="return mV(\'Isa\',46,6);">46:6</a>, but rendered (English Versions of the Bible) "fall down." In <a onClick="return mV(\'Dan\',2,46);">Da 2:46</a>; <a onClick="return mV(\'Dan\',3,5,6,7,10,15,18,28);">3:5,6,7,10,15,18,28</a>, it (Aramaic ceghidh) is "worship" (English Versions of the Bible), 7 times associated with "falling down" and 5 times with "serve." \'abhadh, "work," "labor," "serve," is rendered "worship" by English Versions of the Bible in <a onClick="return mV(\'2Ki\',10,19,21);">2Ki 10:19,21</a>ff: "the worshippers (servants) of Baal." In <a onClick="return mV(\'Isa\',19,21);">Isa 19:21</a> the Revised Version (British and American) has "worship with sacrifice and oblation" (the King James Version "do sacrifice"). <a onClick="return mV(\'Isa\',19,23);">Isa 19:23</a> the King James Version has "served," the Revised Version (British and American) "worship." \'atsabh, "carve," "fabricate," "fashion," is once given "worship," i.e. "make (an object of) worship" (<a onClick="return mV(\'Jer\',44,19);">Jer 44:19</a>, the American Revised Version margin "portray").<P>The Old Testament idea is therefore the reverential attitude of mind or body or both, combined with the more generic notions of religions adoration, obedience, service.<P>The principal New Testament word (59 times) is proskuneo, "kiss (the hand or the ground) toward," hence, often in the oriental fashion bowing prostrate upon the ground; accordingly, Septuagint uses it for the Hithpael of shachah (hishtachawah), "prostrate oneself." It is to render homage to men, angels, demons, the Devil, the "beast," idols, or to God. It is rendered 16 times to Jesus as a beneficent superior; at least 24 times to God or to Jesus as God. The root idea of bodily prostration is much less prominent than in the Old Testament. It is always translated "worship."<P>Next in frequency is sebomai, "venerate," and its various cognates, sebazomai, eusebeo, theosebes, sebasma. Its root is sebas, "fear," but this primitive meaning is completely merged into "reverence," "hold in awe": "In vain do they worship me" (<a onClick="return mV(\'Mat\',15,9);">Mt 15:9</a>, etc.). latreuo, is "serve" (religiously), or "worship publicly," "perform sacred services," "offer gifts," "worship God in the observance of the rites instituted for His worship." It is translated "worship" in <a onClick="return mV(\'Act\',7,42);">Ac 7:42</a>; <a onClick="return mV(\'Act\',24,14);">24:14</a> the King James Version, but "serve," American Standard Revised Version: "serve the host of heaven," "serve I the God of our fathers"; but both the King James Version and the American Standard Revised Version render <a onClick="return mV(\'Phl\',3,3);">Php 3:3</a>, "worship by the Spirit of God," and <a onClick="return mV(\'Hbr\',10,2);">Heb 10:2</a>, "the worshippers," the context in the first two being general, in the second two specific. In <a onClick="return mV(\'2Ti\',1,3);">2Ti 1:3</a> and many other cases both the King James Version and the Revised Version (British and American) give "serve," the meaning not being confined to worship; but compare <a onClick="return mV(\'Luk\',2,37);">Lu 2:37</a> Revised Version: "worshipping (the King James Version "served") with fastings and supplications." <a onClick="return mV(\'Rom\',1,25);">Ro 1:25</a> gives both sebazomai and latreuo in their specific meanings: "worshipped (venerated) and served (religiously,) the creature." doxa, "glory" (<a onClick="return mV(\'Luk\',14,10);">Lu 14:10</a>, King James Version: "Thou shalt have worship," is a survival of an old English use, rightly discarded in the Revised Version (British and American)). threskeia (<a onClick="return mV(\'Col\',2,18);">Col 2:18</a>), "a voluntary humility and worshipping of the angels" (the American Revised Version margin "an act of reverence"), has the root idea of trembling or fear. therapeuo, "serve," "heal," "tend" (<a onClick="return mV(\'Act\',17,25);">Ac 17:25</a>, King James Version: "neither is worshipped by men\'s hands"), is "served" in the Revised Version (British and American), perhaps properly, but its close connection with "temples made with hands" makes this questionable. neokoros, "temple-sweepers," "temple-keeper" (<a onClick="return mV(\'Act\',19,35);">Ac 19:35</a>), has its true meaning in the Revised Version (British and American), but "worshipper" is needed to complete the idea, in our modern idiom.<P>In the Apocrypha the usage is the same as in the New Testament, the verbs used being, in the order of their frequency, proskuneo, sebomai, threskeuo, and latreuo.<P>The New Testament idea of worship is a combination of the reverential attitude of mind and body, the general ceremonial and religious service of God, the feeling of awe, veneration, adoration; with the outward and ceremonial aspects approaching, but not reaching, the vanishing point. The total idea of worship, however, both in the Old Testament and New Testament, must be built up, not from the words specifically so translated, but also, and chiefly, from the whole body of description of worshipful feeling and action, whether of individuals singly and privately, or of larger bodies engaged in the public services of sanctuary, tabernacle, temple, synagogue, upper room or meeting-place.<P>Space permits no discussion of the universality of worship in some form, ranging from superstitious fear or fetishism to the highest spiritual exercise of which man is capable; nor of the primary motive of worship, whether from a desire to placate, ingratiate, or propitiate some higher power, or to commune and share with him or it, or express instinctive or purposed devotion to him. On the face of the Bible narratives, the instinct of communion, praise, adoring gratitude would seem to be the earliest moving force (compare <a onClick="return mV(\'Gen\',4,3,4);">Ge 4:3,4</a>, Cain, Abel; <a onClick="return mV(\'Rom\',1,\'18-25\');">Ro 1:18-25</a>, the primitive knowledge of God as perverted to creature-worship; <a onClick="return mV(\'Gen\',8,20);">Ge 8:20</a>, Noah\'s altar; and <a onClick="return mV(\'Gen\',12,7);">Ge 12:7</a>, Abram\'s altar). That propitiation was an early element is indicated probably by Abel\'s offering from the flock, certainly by the whole system of sacrifice. Whatever its origin, worship as developed in the Old Testament is the expression of the religious instinct in penitence, prostration, adoration, and the uplift of holy joy before the Creator.<P>2. Old Testament Worship:<P>In detail, Old Testament worship was individual and private, though not necessarily secret, as with Eliezer (<a onClick="return mV(\'Gen\',24,26);">Ge 24:26</a>f), the expression of personal gratitude for the success of a mission, or with Moses (<a onClick="return mV(\'Exd\',34,8);">Ex 34:8</a>), seeking God\'s favor in intercessory prayer; it was sometimes, again, though private, in closest association with others, perhaps with a family significance (<a onClick="return mV(\'Gen\',8,20);">Ge 8:20</a>, Noah; <a onClick="return mV(\'Gen\',12,7);">Ge 12:7</a>; <a onClick="return mV(\'Gen\',22,5);">22:5</a>, Abraham: "I and the lad will go yonder; and...worship"); it was in company with the "great congregation," perhaps partly an individual matter, but gaining blessing and force from the presence of others (<a onClick="return mV(\'Psa\',42,4);">Ps 42:4</a>: "I went with the throng...keeping holyday"); and it was, as the national spirit developed, the expression of the national devotion (<a onClick="return mV(\'1Ch\',29,20);">1Ch 29:20</a>: "And all the assembly...worshipped Yahweh, and the king"). In this public national worship the truly devout Jew took his greatest delight, for in it were inextricably interwoven together, his patriotism, his sense of brotherhood, his feeling of solidarity, his personal pride and his personal piety.<P>The general public worship, especially as developed in the Temple services, consisted of:<P>(1) Sacrificial acts, either on extraordinary occasions, as at the dedication of the Temple, etc., when the blood of the offerings flowed in lavish profusion (<a onClick="return mV(\'2Ch\',7,5);">2Ch 7:5</a>), or in the regular morning and evening sacrifices, or on the great annual days, like the Day of Atonement.<P>(2) Ceremonial acts and posture of reverence or of adoration, or symbolizing the seeking and receiving of the divine favor, as when the high priest returned from presenting incense offering in the holy place, and the people received his benediction with bowed heads, reverently standing (<a onClick="return mV(\'2Ch\',7,6);">2Ch 7:6</a>), or the worshippers prostrated themselves as the priests sounded the silver trumpets at the conclusion of each section of the Levites\' chant.<P>(3) Praise by the official ministrants of the people or both together, the second probably to a very limited extent. This service of praise was either instrumental, silver "trumpets and cymbals and instruments of music," or it might be in vocal song, the chant of the Levites (very likely the congregation took part in some of the antiphonal psalms); or it might be both vocal and instrumental, as in the magnificent dedicatory service of Solomon (<a onClick="return mV(\'2Ch\',5,13);">2Ch 5:13</a>), when "the trumpeters and singers were as one, to make one sound to be heard in praising and thanking Yahweh." Or it might be simply spoken: "And all the people said, Amen, and praised Yahweh" (<a onClick="return mV(\'1Ch\',16,36);">1Ch 16:36</a>). How fully and splendidly this musical element of worship was developed among the Hebrews the Book of Psalms gives witness, as well as the many notices in Chronicles (<a onClick="return mV(\'1Ch\',15,\'1-\');">1Ch 15</a>; <a onClick="return mV(\'1Ch\',16,\'1-\');">16</a>; <a onClick="return mV(\'1Ch\',25,\'1-\');">25</a>; <a onClick="return mV(\'2Ch\',5,\'1-\');">2Ch 5</a>; <a onClick="return mV(\'2Ch\',29,\'1-\');">29</a>; <a onClick="return mV(\'2Ch\',30,\'1-\');">30</a>, etc.). It is a pity that our actual knowledge of Hebrew music should be so limited.<P>(4) Public prayer, such as is described in <a onClick="return mV(\'Deu\',26,\'1-\');">De 26</a>, at the dedication of the Temple (<a onClick="return mV(\'2Ch\',6,\'1-\');">2Ch 6</a>, etc.), or like <a onClick="return mV(\'Psa\',60,\'1-\');">Psalms 60</a>; <a onClick="return mV(\'Psa\',79,\'1-\');">79</a>; <a onClick="return mV(\'Psa\',80,\'1-\');">80</a>. Shorter forms, half praise, half prayer, formed a part of the service in Christ\'s time.<P>(5) The annual feasts, with their characteristic ceremonies.<P>See <a href="./study/isbe/search.html?string=PASSOVER">PASSOVER</a>; <a href="./study/isbe/search.html?string=TABERNACLE">TABERNACLE</a>; etc. Places of worship are discussed under <a href="./study/isbe/search.html?string=ALTAR">ALTAR</a>; <a href="./study/isbe/search.html?string=HIGH+PLACE">HIGH PLACE</a>; <a href="./study/isbe/search.html?string=SANCTUARY">SANCTUARY</a>; <a href="./study/isbe/search.html?string=TABERNACLE">TABERNACLE</a>; <a href="./study/isbe/search.html?string=TEMPLE">TEMPLE</A>, etc.<P>3. New Testament Worship:<P>In the New Testament we find three sorts of public worship, the temple-worship upon Old Testament lines, the synagogue-worship, and the worship which grew up in the Christian church out of the characteristic life of the new faith. The synagogue-worship, developed by and after the exile, largely substituted the book for the symbol, and thought for the sensuous or object appeal; it was also essentially popular, homelike, familiar, escaping from the exclusiveness of the priestly service. It had four principal parts:<P>(1) the recitation of the shema\', composed of <a onClick="return mV(\'Deu\',6,\'4-9\');">De 6:4-9</a>; <a onClick="return mV(\'Deu\',11,\'13-21\');">11:13-21</a>, and <a onClick="return mV(\'Num\',15,\'37-41\');">Nu 15:37-41</a>, and beginning, "Hear (shema\'), O Israel: Yahweh our God is one Yahweh";<P>(2) prayers, possibly following some set form, perhaps repeating some psalm;<P>(3) the reading by male individuals of extracts from the Law and the Prophets selected by the "ruler of the synagogue," in later years following the fixed order of a lectionary, as may have been the case when Jesus "found the place";<P>(4) the targum or condensed explanation in the vernacular of the Scriptures read.<P>It is questioned whether singing formed a part of the service, but, considering the place of music in Jewish religious life, and its subsequent large place in Christian worship, it is hard to think of it as absent from the synagogue.<P>4. Public Christian Worship:<P>Public Christian worship necessarily developed along the lines of the synagogue and not the temple, since the whole sacrificial and ceremonial system terminated for Christianity with the life and death of Jesus. The perception of this, however, was gradual, as was the break of Jewish Christians with both synagogue and temple. Jesus Himself held the temple in high honor, loved to frequent it as His Father\'s house, reverently observed the feasts, and exhibited the characteristic attitude of the devout but un-Pharisaic Israelite toward the temple and its worship. Yet by speaking of Himself as "greater than the temple" (<a onClick="return mV(\'Mat\',12,6);">Mt 12:6</a>) and by quoting, <a onClick="return mV(\'Hsa\',6,6);">Ho 6:6</a>, "I desire goodness and not sacrifice," He indicated the relative subordinateness of the temple and its whole system of worship, and in His utterance to the woman of Samaria He intimated the abolition both of the whole idea of the central sanctuary and of the entire ceremonial worship: "Neither in this mountain, nor in Jerusalem, shall ye worship the Father"; "They that worship him must worship in spirit and truth" (<a onClick="return mV(\'Jhn\',4,21,24);">Joh 4:21,24</a>). His chief interest in the temple seems to have been as a "house of prayer" and an opportunity to reach and touch the people. We cannot help feeling that with all His love for the holy precincts, He must have turned with relief from the stately, formal, distant ceremonial of the temple, partly relieved though it was by the genuine religious passion of many worshippers, to the freer, more vital, closer heart-worship of the synagogue, loaded though that also was with form, tradition, ritual and error. Here He was a regular and reverent attendant and participant (<a onClick="return mV(\'Mar\',1,21,39);">Mr 1:21,39</a>; <a onClick="return mV(\'Mar\',3,1);">3:1</a>; <a onClick="return mV(\'Mar\',6,2);">6:2</a>; <a onClick="return mV(\'Luk\',6,6);">Lu 6:6</a>). Jesus did not Himself prescribe public worship for His disciples, no doubt assuming that instinct and practice, and His own spirit and example, would bring it about spontaneously, but He did seek to guard their worship from the merely outward and spectacular, and laid great emphasis on privacy and real "innerness" in it (<a onClick="return mV(\'Mat\',6,\'1-18\');">Mt 6:1-18</a>, etc.). Synagogue-worship was probably not abandoned with Pentecost, but private brotherhood meetings, like that in the upper chamber, and from house to house, were added. The young church could hardly have "grown in favor with the people," if it had completely withdrawn from the popular worship, either in temple or synagogue, although no attendance on the latter is ever mentioned. Possibly the Christians drew themselves together in a synagogue of their own, as did the different nationalities. The reference in James: "if there come unto your synagogue" (<a onClick="return mV(\'Mat\',2,2);">2:2</A>), while not conclusive, since "synagogue" may have gained a Christian significance by this time, nevertheless, joined with the traditions concerning James\'s ascetic zeal and popular repute, argues against such a complete separation early. Necessarily with the development into clearness of the Christian ideas, and with the heightening persecution, together with the hard industrial struggle of life, the observance of the Jewish Sabbath in temple or synagogue, and of the Christian\'s Lord\'s Day, grew incompatible. Yet the full development of this must have been rather late in Paul\'s life. Compare his missionary tactics of beginning his work at the synagogue, and his custom of observing as far as possible the Jewish feasts (<a onClick="return mV(\'Act\',20,16);">Ac 20:16</a>; <a onClick="return mV(\'1Cr\',16,8);">1Co 16:8</a>). Our notions of the worship of the early church must be constructed out of the scattered notices descriptive of different stages in the history, and different churches present different phases of development. The time was clearly the Lord\'s Day, both by the Jewish churches (<a onClick="return mV(\'Jhn\',20,19,29);">Joh 20:19,26</a>) and by the Greek (<a onClick="return mV(\'Act\',20,7);">Ac 20:7</a>; <a onClick="return mV(\'1Cr\',16,2);">1Co 16:2</a>) The daily meeting of <a onClick="return mV(\'Act\',2,46);">Ac 2:46</a> was probably not continued, no mention occurring later.<P>There are no references to yearly Christian festivals, though the wide observance in the sub-apostolic period of the Jewish Passover, with references to the death and resurrection of Jesus, and of Pentecost to commemorate the gift of the Holy Spirit, argues for their early use. The place was of course at first in private houses, and the earliest form of Christian church architecture developed from this model rather than the later one of the basilica. 1 Corinthians gives rather full data for the worship in this free and enthusiastic church. It appears that there were two meetings, a public and a private. The public worship was open, informal and missionary, as well as edificatory. The unconverted, inquirers and others, were expected to be present, and were frequently converted in the meeting (<a onClick="return mV(\'1Cr\',14,24);">1Co 14:24</a>). It resembled much more closely, an evangelical "prayer and conference meeting" of today than our own formal church services. There is no mention of official ministrants, though the meeting seems to have been under some loose guidance. Any male member was free to take part as the Spirit might prompt, especially in the line of his particular "spiritual gift" from God, although one individual might have several, as Paul himself. Largely developed on synagogue lines, but with a freedom and spirit the latter must have greatly lacked, it was composed of:<P>(1) Prayer by several, each followed by the congregational "Amen."<P>(2) Praise, consisting of hymns composed by one or another of the brethren, or coming down from the earlier days of Christian, perhaps Jewish, history, like the Benedictus, the Magnificat, the Nunc dimittis, etc. Portions of these newer hymns seem to be imbedded here and there in the New Testament, as at <a onClick="return mV(\'Rev\',5,\'9-13\');">Re 5:9-13</a>: "Worthy art thou," etc. (compare <a onClick="return mV(\'Rev\',15,3);">Re 15:3</a>; <a onClick="return mV(\'Rev\',11,17);">11:17</a>, etc.); also: "He who was manifested in the flesh, Justified in the spirit, Seen of angels, Preached among the nations, Believed on in the world, Received up in glory" (<a onClick="return mV(\'1Ti\',3,16);">1Ti 3:16</a>). Praise also might take the form of individual testimony, not in metrical form (<a onClick="return mV(\'1Cr\',14,16);">1Co 14:16</a>).<P>(3) Reading of the Scripture must have followed, according to the synagogue model. Paul presupposes an acquaintance with the Old Testament Scriptures and the facts of Jesus\' life, death, resurrection. Instructions to read certain epistles in the churches indicate the same.<P>(4) Instruction, as in <a onClick="return mV(\'1Cr\',2,7);">1Co 2:7</a>; <a onClick="return mV(\'1Cr\',6,5);">6:5</a>, teaching for edification. (These passages, however, may not have this specific reference.)<P>(5) Prophesying, when men, believed by themselves and by the church to be specially taught by the Holy Spirit, gave utterance to His message. At Corinth these crowded on one another, so that Paul had to command them to speak one at a time.<P>(6) Following this, as some believe, came the "speaking with tongues," perhaps fervent and ejaculatory prayers "so rugged and disjointed that the audience for the most part could not understand" until someone interpreted. The speaking with tongues, however, comprised praise as well as prayer (<a onClick="return mV(\'1Cr\',14,16);">1Co 14:16</a>), and the whole subject is enshrouded in mystery. See <a href="./study/isbe/search.html?string=TONGUES,+GIFT+OF">TONGUES, GIFT OF</a>.<P>(7) The meeting closed with the benediction and with the "kiss of peace."<P>The "private service" may have followed the other, but seems more likely to have been in the evening, the other in the morning. The disciples met in one place and ate together a meal of their own providing, the agape, or love feast, symbolizing their union and fellowship, preceded or followed by prayers (Didache x), and perhaps interspersed by hymns. Then the "Lord\'s Supper" itself followed, according to the directions of the apostle (<a onClick="return mV(\'1Cr\',11,\'23-28\');">1Co 11:23-28</a>).<P>How far "Christian worship" was "Christian" in the sense of being directly addressed to Christ, is not easily answered. We must not read into their mental content the fully developed Christology of later centuries, but it is hard to believe that those who had before them Thomas\' adoring exclamation, "My Lord and my God!" the saying of the first martyr, "Lord Jesus, receive my spirit," the dictum of the great apostle, "Who, existing in the form of God," the utterances of He, "And let all the angels of God worship him," "Thy throne, O God, is forever and forever," and, later, the prologue of Jn, and the ascriptions of praise in the Apocalypse, could have failed to bow down in spirit before Jesus Christ, to make known their requests through Him, and to lift up their adoration in song to Him, as according to Pliny\'s witness, 112 AD, "they sing a hymn to Christ as God." The absolutely interchangeable way in which Paul, for instance, applies "Lord" in one breath to the Father, to the Old Testament Yahweh, and to Jesus Christ (<a onClick="return mV(\'Rom\',10,11,13);">Ro 10:11,13</a>; <a onClick="return mV(\'Rom\',14,4,6,8,11,12);">14:4,6,8,11,12</a>, etc.) clearly indicates that while God the Father was, as He must be, the ultimate and principal object of worship, the heart and thought of God\'s New Testament people also rested with adoring love on Him who is "worthy...to receive the power and riches and wisdom, and might, and glory, and honor and blessing." The angel of the Apocalypse would not permit the adoration of the seer (<a onClick="return mV(\'Rev\',22,9);">Re 22:9</a>), but Jesus accepts the homage of Thomas, and in the Fourth Gospel declares it the duty of all to "honor the Son, even as they honor the Father" (<a onClick="return mV(\'Jhn\',5,23);">Joh 5:23</a>).<P>The classical passages for Christian worship are <a onClick="return mV(\'Jhn\',4,23,24);">Joh 4:23,24</a>, culminating in (margin): "God is spirit: and they that worship him must worship in spirit and truth," and <a onClick="return mV(\'Phl\',3,3);">Php 3:3</a>, "who worship by the Spirit of God." These define its inner essence, and bar out all ceremonial or deputed worship whatever, except as the former is, what the latter can never be, the genuine and vital expression of inner love and devotion. Anything that really stimulates and expresses the worshipful spirit is so far forth a legitimate aid to worship, but never a substitute for it, and is harmful if it displaces it. Much, perhaps most, stately public worship is as significant to God and man as the clack of a Thibetan prayer-mill. The texts cited also make of worship something far deeper than the human emotion or surrender of will; it is the response of God\'s Spirit in us to that Spirit in Him, whereby we answer "Abba, Father," deep calling unto deep. Its object is not ingratiation, which is unnecessary, nor propitiation, which has been made "once for all," nor in any way "serving" the God who \'needeth not to be worshipped with men\'s hands\' (<a onClick="return mV(\'Act\',17,25);">Ac 17:25</a>), but it is the loving attempt to pay our unpayable debt of love, the expression of devoted hearts, "render(ing) as bullocks the offering of our lips" (<a onClick="return mV(\'Hsa\',14,2);">Ho 14:2</a>). For detail it is not a physical act or material offering, but an attitude of mind: "The sacrifices of God are a broken spirit"; "sacrifices of praise, with which God is well pleased"; not the service of form in an outward sanctuary, the presentation of slain animals, but the service of love in a life: "Present your bodies a living sacrifice"; not material sacrifices, but spiritual: your rational "service"; not the service about an altar of stone or wood, but about the sanctuary of human life and need; for this is true religion ("service," "worship," threskeia), "to visit the fatherless and widows in their affliction"; not the splendor of shining robes or the sounding music of trumpets or organs, but the worshipping glory of holy lives; in real fact, "hallowing Thy name," "and keeping oneself unspotted from the world." The public worship of God in the presence of His people is a necessity of the Christian life, but in spiritual Christianity the ceremonial and outward approaches, if it does not quite reach, the vanishing point.<P>LITERATURE.<P>BDB; Thayer\'s New Testament Lexicon under the word; arts; on "Praise," "Worship," "Temple," "Church," "Prayer," in HDB, DB, New Sch-Herz, DCG; Commentaries on Psalms, Chronicles, Corinthians; Weizsacker, The Apostolic Age of the Church, II; Pfleiderer, Das Urchristenthum (English translation); Leoning, Gemeindeverfassung des Urchristenthums; Edersheim, The Temple, Its Ministry and Service, as They Were at the Time of Jesus Christ, and Life and Times of Jesus the Messiah; Hort, The Christian Ecclesia; Lindsay, Church and the Ministry in the Early Centuries; McGiffert, A History of Christianity in the Apostolic Age.``31';

isbe[9254]='Worthies`wur\'-thiz (\'addir, "majestic," "noble" (compare <a onClick="return mV(\'Jdg\',5,13);">Jud 5:13</a>, Etc.)): in <a onClick="return mV(\'Nah\',2,5);">Na 2:5</a>, the King James Version "He shall recount his worthies" (margin "gallants"), the English Revised Version "He remembereth his worthies," the American Standard Revised Version "He remembereth his nobles." As Massoretic Text stands, the Assyrian king hurriedly summons his commanders to repel the assault, but the passage is obscure and the text quite possibly in need of emendation.``1';

isbe[9256]='Wrath, (Anger)`rath, roth, rath (\'aph, from \'anaph, "to snort," "to be angry"; orge, thumos, orgizomai): Designates various degrees of feeling, such as sadness (<a onClick="return mV(\'Psa\',85,4);">Ps 85:4</a>), a frown or turning away of the face in grief or anger (<a onClick="return mV(\'2Ch\',26,19);">2Ch 26:19</a>; <a onClick="return mV(\'Jer\',3,12);">Jer 3:12</a>), indignation (<a onClick="return mV(\'Psa\',38,3);">Ps 38:3</a>), bitterness (<a onClick="return mV(\'Jdg\',18,25);">Jud 18:25</a>), fury (<a onClick="return mV(\'Est\',1,12);">Es 1:12</a>), full of anger (<a onClick="return mV(\'Gen\',4,5);">Ge 4:5</a>; <a onClick="return mV(\'Jhn\',7,23);">Joh 7:23</a>), snorting mad (<a onClick="return mV(\'Gen\',27,45);">Ge 27:45</a>; <a onClick="return mV(\'Mat\',2,16);">Mt 2:16</a>).<P>1. Divine Wrath:<P>Wrath is used with reference to both God and man. When used of God it is to be understood that there is the complete absence of that caprice and unethical quality so prominent in the anger attributed to the gods of the heathen and to man. The divine wrath is to be regarded as the natural expression of the divine nature, which is absolute holiness, manifesting itself against the willful, high-handed, deliberate, inexcusable sin and iniquity of mankind. God\'s wrath is always regarded in the Scripture as the just, proper, and natural expression of His holiness and righteousness which must always, under all circumstances, and at all costs be maintained. It is therefore a righteous indignation and compatible with the holy and righteous nature of God (<a onClick="return mV(\'Num\',11,\'1-10\');">Nu 11:1-10</a>; <a onClick="return mV(\'Deu\',29,27);">De 29:27</a>; <a onClick="return mV(\'2Sa\',6,7);">2Sa 6:7</a>; <a onClick="return mV(\'Isa\',5,25);">Isa 5:25</a>; <a onClick="return mV(\'Isa\',42,25);">42:25</a>; <a onClick="return mV(\'Jer\',44,6);">Jer 44:6</a>; <a onClick="return mV(\'Psa\',79,6);">Ps 79:6</a>). The element of love and compassion is always closely connected with God\'s anger; if we rightly estimate the divine anger we must unhesitatingly pronounce it to be but the expression and measure of that love (compare <a onClick="return mV(\'Jer\',10,24);">Jer 10:24</a>; <a onClick="return mV(\'Eze\',23,\'1-\');">Eze 23</a>; <a onClick="return mV(\'Amo\',3,2);">Am 3:2</a>).<P>2. Human Wrath:<P>Wrath, when used of man, is the exhibition of an enraged sinful nature and is therefore always inexcusable (<a onClick="return mV(\'Gen\',4,5,6);">Ge 4:5,6</a>; <a onClick="return mV(\'Gen\',49,7);">49:7</a>; <a onClick="return mV(\'Pro\',19,19);">Pr 19:19</a>; <a onClick="return mV(\'Job\',5,2);">Job 5:2</a>; <a onClick="return mV(\'Luk\',4,28);">Lu 4:28</a>; <a onClick="return mV(\'2Cr\',12,10);">2Co 12:10</a>; <a onClick="return mV(\'Gal\',5,20);">Ga 5:20</a>; <a onClick="return mV(\'Eph\',4,31);">Eph 4:31</a>; <a onClick="return mV(\'Col\',3,8);">Col 3:8</a>). It is for this reason that man is forbidden to allow anger to display itself in his life. He is not to "give place unto wrath" (<a onClick="return mV(\'Rom\',12,19);">Ro 12:19</a> margin), nor must he allow "the sun to go down upon his wrath" (<a onClick="return mV(\'Eph\',4,26);">Eph 4:26</a>). He must not be angry with his brother (<a onClick="return mV(\'Mat\',5,22);">Mt 5:22</a>), but seek agreement with him lest the judgment that will necessarily fall upon the wrathful be meted out to him (<a onClick="return mV(\'Mat\',5,25,26);">Mt 5:25,26</a>). Particularly is the manifestation of an angry spirit prohibited in the training and bringing up of a family (<a onClick="return mV(\'Eph\',6,4);">Eph 6:4</a>; <a onClick="return mV(\'Col\',3,19);">Col 3:19</a>). Anger, at all times, is prohibited (<a onClick="return mV(\'Num\',18,5);">Nu 18:5</a>; <a onClick="return mV(\'Psa\',37,8);">Ps 37:8</a>; <a onClick="return mV(\'Rom\',12,19);">Ro 12:19</a>; <a onClick="return mV(\'Gal\',5,19);">Ga 5:19</a>; <a onClick="return mV(\'Eph\',4,26);">Eph 4:26</a>; <a onClick="return mV(\'Jam\',1,19,20);">Jas 1:19,20</a>).<P>3. Divine Wrath Consistent with Love:<P>Wrath or anger, as pertaining to God, is very much more prominent in the Old Testament than in the New Testament. This is to be accounted for probably because the New Testament magnifies the grace and love of God as contrasted with His wrath; at least love is more prominent than wrath in the revelation and teaching of Christ and His apostles. Nevertheless, it must not be thought that the element of wrath, as a quality of the divine nature, is by any means overlooked in the New Testament because of the prominent place there given to love. On the contrary, the wrath of God is intensified because of the more wonderful manifestation of His grace, mercy and love in the gift of His Son Jesus Christ as the Saviour of the world. God is not love only: He is also righteous; yea, "Our God is a consuming fire" (<a onClick="return mV(\'Hbr\',12,29);">Heb 12:29</a>); "It is a fearful thing to fall into the hands of the living God" (<a onClick="return mV(\'Hbr\',10,31);">Heb 10:31</a>). No effeminate, sentimental view of the Fatherhood of God or of His mercy and loving-kindness can exclude the manifestation of His just, righteous and holy anger against sin and the sinner because of his transgression (<a onClick="return mV(\'1Pe\',1,17);">1Pe 1:17</a>; <a onClick="return mV(\'Hbr\',10,29);">Heb 10:29</a>). One thing only can save the sinner from the outpouring of God\'s righteous anger against sin in the day of visitation, namely, faith in the Lord Jesus Christ as the divinely-appointed Redeemer of the world (<a onClick="return mV(\'Jhn\',3,36);">Joh 3:36</a>; <a onClick="return mV(\'Rom\',1,\'16-18\');">Ro 1:16-18</a>; <a onClick="return mV(\'Rom\',5,9);">5:9</a>). Nor should the sinner think that the postponement or the omission (or seeming omission) of the visitation of God\'s wrath against sin in the present means the total abolition of it in the future. Postponement is not abolition; indeed, the sinner, who continually rejects Jesus Christ and the salvation which God has provided in Him, is simply \'treasuring up\' wrath for himself "in the day of wrath and revelation of the righteous judgment of God; who (one day) will render to every man according to his works:...to them that...obey not the truth, but obey unrighteousness,...wrath and indignation, tribulation and anguish, upon every soul of man that worketh evil" (<a onClick="return mV(\'Rom\',2,\'5-9\');">Ro 2:5-9</a>; <a onClick="return mV(\'2Pe\',3,10);">2Pe 3:10</a>; <a onClick="return mV(\'Rev\',6,16,17);">Re 6:16,17</a>; <a onClick="return mV(\'Rev\',16,19);">16:19</a>; <a onClick="return mV(\'Rev\',19,15);">19:15</a>).<P>See <a href="./study/isbe/search.html?string=RETRIBUTION">RETRIBUTION</a>, 5.<P>God\'s anger while slow, and not easily aroused (<a onClick="return mV(\'Psa\',103,8);">Ps 103:8</a>; <a onClick="return mV(\'Isa\',48,9);">Isa 48:9</a>; <a onClick="return mV(\'Jon\',4,2);">Jon 4:2</a>; <a onClick="return mV(\'Nah\',1,3);">Na 1:3</a>), is to be dreaded (<a onClick="return mV(\'Psa\',2,12);">Ps 2:12</a>; <a onClick="return mV(\'Psa\',76,7);">76:7</a>; <a onClick="return mV(\'Psa\',90,11);">90:11</a>; <a onClick="return mV(\'Mat\',10,28);">Mt 10:28</a>); is not to be provoked (<a onClick="return mV(\'Jer\',7,19);">Jer 7:19</a>; <a onClick="return mV(\'1Cr\',10,22);">1Co 10:22</a>); when visited, in the present life, should be borne with submission (<a onClick="return mV(\'2Sa\',24,17);">2Sa 24:17</a>; <a onClick="return mV(\'Lam\',3,39,43);">La 3:39,43</a>; <a onClick="return mV(\'Mic\',7,9);">Mic 7:9</a>); prayer should be earnestly made for deliverance from it (<a onClick="return mV(\'Psa\',39,10);">Ps 39:10</a>; <a onClick="return mV(\'Psa\',80,4);">80:4</a>; <a onClick="return mV(\'Dan\',9,16);">Da 9:16</a>; <a onClick="return mV(\'Hab\',3,2);">Hab 3:2</a>); it should be the means of leading man to repentance (<a onClick="return mV(\'Isa\',42,24,25);">Isa 42:24,25</a>; <a onClick="return mV(\'Jer\',4,8);">Jer 4:8</a>).<P>Certain specific things are said especially to arouse God\'s anger: continual provocation (<a onClick="return mV(\'Num\',32,14);">Nu 32:14</a>), unbelief (<a onClick="return mV(\'Psa\',78,21,22);">Ps 78:21,22</a>; <a onClick="return mV(\'Hbr\',3,18,19);">Heb 3:18,19</a>), impenitence (<a onClick="return mV(\'Isa\',9,13,14);">Isa 9:13,14</a>; <a onClick="return mV(\'Rom\',2,5);">Ro 2:5</a>), apostasy (<a onClick="return mV(\'Hbr\',10,26,27);">Heb 10:26,27</a>), idolatry (<a onClick="return mV(\'Deu\',32,19,20,22);">De 32:19,20,22</a>; <a onClick="return mV(\'2Ki\',22,17);">2Ki 22:17</a>; <a onClick="return mV(\'Jer\',44,3);">Jer 44:3</a>), sin in God\'s people (<a onClick="return mV(\'Psa\',89,\'30-32\');">Ps 89:30-32</a>; <a onClick="return mV(\'Isa\',47,6);">Isa 47:6</a>), and it is manifested especially against opponents of the gospel of Jesus Christ (<a onClick="return mV(\'Psa\',2,2,3,5);">Ps 2:2,3,5</a>; <a onClick="return mV(\'1Th\',2,16);">1Th 2:16</a>).<P>4. Righteous and Unrighteous Anger:<P>There is a sense, however, in which anger is the duty of man; he is to "hate evil" (<a onClick="return mV(\'Psa\',97,10);">Ps 97:10</a>). It is not enough that God\'s people should love righteousness, they must also be angry with sin (not the sinner). A man who is incapable of being angry at sin is at the same time thereby adjudged to be incapable of having a real love for righteousness. So there is a sense in which a man may be said to "be...angry, and sin not" (<a onClick="return mV(\'Eph\',4,26);">Eph 4:26</a>). Anger at the sin and unrighteousness of men, and because their sin is grievous to God, may be called a "righteous indignation." Such an indignation is attributed to Jesus when it is said that He "looked round about on them with anger, being grieved at the hardening of their heart" (<a onClick="return mV(\'Mar\',3,5);">Mr 3:5</a>). When anger arises because of this condition, it is sinless, but when anger arises because of wounded or aggrieved personality or feelings, it is sinful and punishable. Anger, while very likely to become sinful, is not really sinful in itself.<P>We have illustrations in the Scriptures of wrath or anger that is justifiable: Jesus (<a onClick="return mV(\'Mar\',3,5);">Mr 3:5</a>), Jacob (<a onClick="return mV(\'Gen\',31,36);">Ge 31:36</a>), Moses (<a onClick="return mV(\'Exd\',11,8);">Ex 11:8</a>; <a onClick="return mV(\'Exd\',32,19);">32:19</a>; <a onClick="return mV(\'Lev\',10,16);">Le 10:16</a>; <a onClick="return mV(\'Num\',16,15);">Nu 16:15</a>), Nehemiah (<a onClick="return mV(\'Neh\',5,6);">Ne 5:6</a>; <a onClick="return mV(\'Neh\',13,17,25);">13:17,25</a>); of sinful anger: Cain (<a onClick="return mV(\'Gen\',4,5);">Ge 4:5,6</a>), Esau (<a onClick="return mV(\'Gen\',27,45);">Ge 27:45</a>), Moses (<a onClick="return mV(\'Num\',20,10,11);">Nu 20:10,11</a>), Balaam (<a onClick="return mV(\'Num\',22,27);">Nu 22:27</a>), Saul (<a onClick="return mV(\'1Sa\',20,30);">1Sa 20:30</a>), Ahab (<a onClick="return mV(\'1Ki\',21,4);">1Ki 21:4</a>), Naaman (<a onClick="return mV(\'2Ki\',5,11);">2Ki 5:11</a>), Herod (<a onClick="return mV(\'Mat\',2,16);">Mt 2:16</a>), the Jews (<a onClick="return mV(\'Luk\',4,28);">Lu 4:28</a>), the high priest (<a onClick="return mV(\'Act\',5,17);">Ac 5:17</a>; <a onClick="return mV(\'Act\',7,54);">7:54</a>).``53';
isbe[9257]='Wrest`rest: Found in the King James Version and the Revised Version (British and American) 3 times in the writings of Moses, namely, <a onClick="return mV(\'Exd\',23,2,6);">Ex 23:2,6</a>; <a onClick="return mV(\'Deu\',16,19);">De 16:19</a>. In all three places it refers to twisting, or turning aside, or perverting judgment or justice. In <a onClick="return mV(\'Deu\',24,17);">De 24:17</a> the Revised Version (British and American) has "wrest" where the King James Version has "pervert."<P>In <a onClick="return mV(\'Psa\',56,5);">Ps 56:5</a> (\'atsabh); <a onClick="return mV(\'2Pe\',3,16);">2Pe 3:16</a> (strebloo), it refers to the word or words of God in the Scriptures. In the Psalms the servant of God, who speaks in God\'s name, complains that the enemies "wrest," misinterpret, misapply and pervert his words. In Peter it is the ignorant and unstedfast who so pervert and misuse some of the difficult words of Paul, and they do it to their own destruction—a most earnest warning against carelessness and conscienceless indifference in interpreting Scripture.``64';
isbe[9258]='Wrestling`res\'-ling (\'abhaq; pale).`<a href="./study/isbe/search.html?string=GAMES">GAMES</a>; <a href="./study/isbe/search.html?string=JACOB">JACOB</a>; <a href="./study/isbe/search.html?string=NAPHTALI">NAPHTALI</a>`1';
isbe[9259]='Wrinkle`rin\'-k\'-l (qamaT, "to lay hold on"; rhutis, "a wrinkle"): In <a onClick="return mV(\'Job\',16,8);">Job 16:8</a>, the Revised Version (British and American) substitutes, "Thou hast laid fast hold on me" (margin "shrivelled me up") for the King James Version "Thou hast filled me with wrinkles." In <a onClick="return mV(\'Eph\',5,27);">Eph 5:27</a>, Paul\'s figurative reference to the church as a bride, "not having spot or wrinkle," is indicative of the perennial youth and attractiveness of the church.``1';
isbe[9260]='Writing, 1`rit\'-ing:<P><b>I. GENERAL</b><P class="in15">1. Definition<P class="in15">2. Inward Writing<P class="in15">3. Outward Writing<P><b>II. THE SYMBOLS</b><P class="in15">1. Object Writing<P class="in15">2. Image Writing<P class="in15">3. Picture Writing<P class="in15">4. Mnemonic Writing<P class="in15">5. Phonetic Writing<P><b>III. METHODS</b><P><b>IV. INSTRUMENTS</b><P><b>V. MATERIALS</b><P class="in15">1. Clay<P class="in15">2. Stone<P class="in15">3. Lead<P class="in15">4. Bronze<P class="in15">5. Gold and Silver<P class="in15">6. Wood<P class="in15">7. Bones and Skins<P class="in15">8. Vellum<P class="in15">9. Papyrus<P class="in15">10. Paper<P class="in15">11. Ink<P><b>VI. FORMS</b><P class="in15">1. The Roll<P class="in15">2. The Codex<P><b>VII. WRITING</b><P class="in15">1. Writers<P class="in15">2. The Writing Art<P><b>VIII. HISTORY OF BIBLICAL HANDWRITING</b><P class="in15">1. Mythological Origins<P class="in15">2. Earliest Use<P class="in15">3. Biblical History<P><b>LITERATURE</b><hr /><P>I. General.<P>1. Definition:<P>Writing is the art of recording thought, and recording is the making of permanent symbols. Concept, expression and record are three states of the same work or word. Earliest mankind expressed itself by gesture or voice and recorded in memory, but at a very early stage man began to feel the need of objective aids to memory and the need of transmitting a message to a distance or of leaving such a message for the use of others when he should be away or dead. For these purposes, in the course of time, he has invented many symbols, made in various ways, out of every imaginable material. These symbols, fixed in some substance, inward or outward, are writing as distinguished from oral speech, gesture language, or other unrecording forms of expression. In the widest sense writing thus includes, not only penmanship or chirography, but epigraphy, typography, phonography, photography, cinematography, and many other kinds of writing as well as mnemonic object writing and inward writing.<P>Writing has to do primarily with the symbols, but as these symbols cannot exist without being in some substance, and as they are often modified as to their form by the materials of which they are made or the instrument used in making, the history of writing has to do, not only with the signs, symbols or characters themselves, but with the material out of which they are made and the instruments and methods by which they are made.<P>2. Inward Writing:<P>The fact that memory is a real record is well known in modern psychology, which talks much of inward speech and inward writing. By inward writing is commonly meant the inward image or counterpart of visual or tangible handwriting as distinguished from the inward records of the sound of words, but the term fairly belongs to all inward word records. Of these permanent records two chief classes may be distinguished: sense records, whether the sense impression was by eye, ear, finger-tip or muscle, and motor records or images formed in the mind with reference to the motion of the hand or other organs of expression. Both sense records and meter records include the counterparts of every imaginable kind of outward handwriting.<P>We meet this inward writing in the Bible in the writing upon the tablets of the heart (<a onClick="return mV(\'Pro\',3,3);">Pr 3:3</a>; <a onClick="return mV(\'Pro\',7,3);">7:3</a>; <a onClick="return mV(\'Jer\',17,1);">Jer 17:1</a>; <a onClick="return mV(\'2Cr\',3,3);">2Co 3:3</a>), which is thus not a mere figure of speech but a proper description of that effort to fix in memory which some effect by means of sound symbols and some by the sight symbols of ordinary handwriting.<P>It has also its interesting and important bearing on questions of inspiration and revelation where the prophet "hears" a voice (<a onClick="return mV(\'Exd\',19,19);">Ex 19:19</a>; <a onClick="return mV(\'Num\',7,89);">Nu 7:89</a>; <a onClick="return mV(\'Rev\',19,1,2);">Re 19:1,2</a>) or "sees" a vision (<a onClick="return mV(\'2Ki\',6,17);">2Ki 6:17</a>; <a onClick="return mV(\'Isa\',6,\'1-\');">Isa 6</a>; <a onClick="return mV(\'Amo\',7,\'1-9\');">Am 7:1-9</a>) or even sees handwriting (<a onClick="return mV(\'Rev\',17,5);">Re 17:5</a>). This handwriting not only seems "real" but is real, whether caused by external sound or vision or internal human or superhuman action.<P>3. Outward Writing:<P>Outward writing includes many kinds of symbols produced in various ways in many kinds of material. The commonest kind is alphabetical handwriting with pen and ink on paper, but alphabetic symbols are not the only symbols, the hand is not the only means of producing symbols, the pen is not the only instrument, and ink and paper are far from being the only materials.<P>The ordinary ways of human expression are voice and gesture. Corresponding to these there is an oral writing and a gesture writing. For the recording of vocal sounds various methods have been invented: direct carving or molding in wax or other material, or translating into light vibrations and recording these by photograph or kymograph. Both phonographic and photographic records of sounds are strictly oral writing.<P>The record of gestures by making pictures of them forms a large fraction of primitive picture writing (e.g. the picture of a man with weapon poised to throw) and the modern cinematography of pantomime is simply a perfected form of this primitive picture writing.<P>Handwriting is simply hand gesture with a mechanical device for leaving a permanent record of its motion by a trail of ink or incision. In the evolution of expression the imitation of human action tends to reduce itself to sign language, where both arms and the whole body are used, and then to more and more conventionalized hand gesture. This hand gesture, refined, condensed and adapted to mechanical conditions, and provided with pencil, chisel, or pen and ink, is handwriting. Its nature is precisely analogous to that of the self-registering thermometer or kymograph.<P>Nearly all the great body of existing written documents, save for the relatively few modern phonographic, kymographic and other visible speech records, is handwritten, the symbols being produced, selected, arranged, or at least pointed out, by the hand. Even the so-called phonetic writing, as usually understood, is not sound record but consists of hand-gesture symbols for sounds.<P>II. The Symbols.<P>Among the many kinds of outward signs used in writing the best known are the so-called Phoenician alphabet and its many derivatives, including the usual modern alphabets. Other well-known varieties are the wedge system of Assyria and Babylonia, the hieroglyphic systems of Egypt and Mexico, the Chinese characters, stenographic systems, the Morse code, the Braille system, the abacus, the notched stick, the knotted cord, wampum and twig bundles. These, however, by no means exhaust the list of signs which have been used for record or message purposes; e.g. colored flags for signaling, pebbles, cairns, pillars, flowers, trees, fishes, insects, animals and parts of animals, human beings, and images of all these things, have all served as record symbols in writing.<P>The various symbols may be grouped as objects and images, each of these classes divided again into pictorial or representative signs and mnemonic or conventional signs, mnemonic signs again divided into ideographic and phonetic, and phonetic again into verbal, syllabic (consonantal), and alphabetic. This may be represented graphically as follows:<P>(A) OBJECTS<P class="in15">(1) Pictorial<P class="in15">(2) Conventional (Mnemonic)<P class="in30">(a) Ideographic (Eye Images)<P class="in30">(b) Phonetic (Ear Images)<P class="in45">(i) Verbal<P class="in45">(ii) Syllabic<P class="in45">(iii) Consonantal<P class="in45">(iv) Alphabetic<P>(B) IMAGES<P class="in15">(1) Pictorial<P class="in15">(2) Conventional (Mnemonic)<P class="in30">(a) Ideographic<P class="in30">(b) Phonetic<P class="in45">(i) Verbal<P class="in45">(ii) Syllabic<P class="in45">(iii) Consonantal<P class="in45">(iv) Alphabetic<P>Objects may be whole objects (a man) or characteristic parts (human head, arm, leg) or samples (feather or piece of fur). The objects may be natural objects or artificial objects designed for another purpose (arrow), or objects designed especially to be used as writing symbols (colored flags). Images include images of all these objects and any imaginary images which may have been invented for writing purposes.<P>Pictorial or representative signs are distinguished from mnemonic or conventional signs by the fact that in themselves they suggest the thing meant, while the others require agreement beforehand as to what they shall mean. The fact, however, that the symbol is a picture of something does not make it pictorial or the writing picture writing. It is pictorial, not because it is a picture, but because it pictures something. The fact, e.g., that a certain symbol may be recognized as an ox does not make of this a pictograph. If it stands for or means an ox, it is a pictograph; if it stands for "divinity," it may be called an ideograph, or if it stands for the letter a it is phonetic, a phonogram.<P>The key to the evolution of writing symbols is to be found in a law of economy. Object writing undoubtedly came first, but man early learned that the image of an object would serve as well for record purposes and was much more convenient to handle. True picture writing followed. The same law of economy led to each of the other steps from pictorial to alphabetic, and may be traced in the history of each kind and part. Every alphabet exhibits it. The history of writing is in brief a history of shorthand. It begins with the whole object or image, passes to the characteristic part, reduces this to the fewest possible strokes which retain likeness, conventionalizes these strokes, and then, giving up all pretense of likeness to the original symbol, and frankly mnemonic, it continues the process of abbreviation until the whole ox has become the letter "a" or perhaps a single dot in some system of stenography.<P>Object writing is not common in the phonetic stage, but even this is found, for example, in alphabetical flags for ship signaling. The actual historical evolution of writing seems to have been object, image-picture, ideogram. phonogram, syllable, consonant, letter. All of these stages have some echoes at least in the Bible, although even the syllabic stage seems to have been already passed at the time of Moses. The Hebrew Old Testament as a whole stands for the consonantal stage and the Greek New Testament for the complete alphabetic—still the climax of handwriting, unless the evolution of mathematical symbols, which is a very elaborate evolution of ideographic handwriting, is so regarded.<P>Although probably not even a single sentence of the Hebrew Bible was written in ideographic, picture, or object handwriting, many documents which are used or quoted by Biblical writers were written by these methods, and all of them are repeatedly implied. In a number of cases full exegesis requires a knowledge of their nature and history. A certain number of scholars now believe that the Pentateuch was originally written in cuneiform, after the analogy of the circumstances shown by the Tell el-Amarna Letters. In this case of course there would still be traces both of the syllabic and ideographic, but theory is improbable.<P>1. Object Writing:<P>The most primitive writing was naturally pictorial object writing. When the hunter first brought home his quarry, this had in it most of the essential elements of modern handwriting. Those who remained at home read in the actual bodies the most essential record of the trip. When, further, the hunter brought back useless quarry to evidence his tale of prowess, the whole essence of handwriting was involved. This was whole-object record, but object abbreviations soon followed. Man early learned that skins represented whole animals (the determinative for "quadruped" in Egyptian is a hide), and that a reindeer\'s head or antlers, or any characteristic part, served the simple purpose of record just as well as the whole object, and this method of record survives in a modern hunting-lodge. The bounty on wolves\' scalps and the expression "so many head of cattle" are similar survivals. In war, men returning hung the dead bodies of their enemies from the prows of their triumphal ships or from the walls of the city, and, in peace, from the gibbet, as object lessons. They soon learned, however, that a head would serve all practical purposes as well as a whole body, and the inhabitants of Borneo today practice their discovery. Then they discovered that a scalp was just as characteristic and more portable, and the scalp belt of the American Indian is the result. The ancient Egyptians counted the dead by "hands" carried away as trophies. Both objects and images tend thus to pass from the whole object to a characteristic part, then to the smallest characteristic part: from the tiger\'s carcass or stuffed tiger to the tiger\'s claw or its picture. The next or mnemonic step was taken when the simplest characteristic part was exchanged for a pebble, a twig, a notched stick, a knot, or any other object or image of an object which does not in itself suggest a tiger.<P>The pictorial object writing had an evolution of its own and reached a certain degree of complexity in elaborate personal adornment, in sympathetic magic, the medicine bag, the prayer stick, pillars, meteoric stones, etc., for worship, collections of liturgical objects, fetishes, votive offerings, trophies, etc.<P>It reached a still higher order of complexity when it passed into the mnemonic stage represented by the abacus, the knotted cord, the notched stick, the wampum, etc. The knotted cord may be recognized in the earliest hieroglyphic signs, is found still among primitive people, and its most famous example is the, Peruvian quipu. It still survives in the cardinal\'s hat and the custom of knotting a handkerchief for mnemonic purposes. It is found in the Bible in a peculiarly clear statement in the mnemonic "fringes" of <a onClick="return mV(\'Num\',15,\'37-41\');">Nu 15:37-41</a> (compare <a onClick="return mV(\'Deu\',22,12);">De 22:12</a>). The notched stick is equally old, as seen in the Australian message stick, and its best-known modern example is the tally of the British Exchequer. The abacus and the rosary are practically the lineal descendants of the pebble heap which has a concrete modern counterpart in the counting with pebbles by Italian shepherd boys. It is possible that the notched message stick has its echo in <a onClick="return mV(\'Jdg\',5,14);">Jud 5:14</a> (military scribe\'s staff); <a onClick="return mV(\'Num\',17,\'1-10\');">Nu 17:1-10</a> (Aaron\'s inscribed rod), and all scepters (rods of authority) and herald\'s wands.<P>2. Image Writing:<P>It was a very long step in the history of handwriting from object to image, from the trophy record to the trophy image record. The nature of this step may perhaps be seen in the account of the leopard-tooth necklace of an African chief described by Frobenius. In itself this was merely a complex trophy record—the tribal record of leopards slain. When, however, the chief took for his own necklace the actual trophy which some members of the tribe had won, while the hunter made a wooden model of the tooth which served him as trophy, this facsimile tooth became an image record. This same step from object to image is most familiar in the history of votive offerings, where the model is substituted for the object, the miniature model for the model, and finally a simple written inscription takes the place of the model. It is seen again in sympathetic magic when little wax or clay images are vicariously buried or drowned, standing for the person to be injured, and taking the place of sample parts, such as the lock of hair or nail-parings, etc., which are used in like manner by still more primitive peoples.<P>3. Picture Writing:<P>It was another long step in the evolution of symbols when it occurred to man that objects worn for record could be represented by paint upon the body. The origin of written characters is often sought in the practice of tattooing, but whatever truth there may be in this must be carried back one step, for it is generally agreed and must naturally have been the fact that body painting preceded tattooing, which is a device for making the record permanent. The transition from the object trophy to the image on the skin might easily have come from the object causing a pressure mark on the skin. There is good reason to believe that the wearing of trophies was the first use of record keeping.<P>It is of course not proved that body ornaments or body marks are the original of image writing or that trophies are the earliest writing, nor yet that models of trophies or votive offerings were the first step in image writing. It may be that the first images were natural objects recognized as resembling other objects. The Zuni Indians used for their chief fetishes natural rock forms. The first step may have been some slight modification of natural stone forms into greater resemblance, such as is suggested by the slightly modified sculptures of the French-Spanish caves. Or again the tracks of animals in clay may have suggested the artificial production of these tracks or other marks, and the development of pottery and pottery marks may have been the main line of evolution. The Chinese trace the origin of their symbols to bird tracks. Or again smear marks of earth or firebrand or blood may have suggested marks on stone, and the marked pebbles of the Pyrenean caves may have reference to this. Or yet again the marks on the animals in the Pyrenean caves may have been ownership marks and point back to a branding of marks or a primitive tattooing by scarification.<P>Whatever the exact point or motive for the image record may have been, and however the transition was made, the idea once established had an extensive development which is best illustrated by the picture writing of the American Indians, though perhaps to be found in the Bushmen drawings, petroglyphs, and picture writing the world over. It is almost historic in the Sumerian and the Egyptian, whose phonetic symbols are pictographic in origin at least and whose determinatives are true pictographs.<P>4. Mnemonic Writing:<P>The transition from pictorial to conventional or mnemonic takes place when the sign ceases to suggest the meaning directly, even after explanation. This happens in two ways: (1) when an object or image stands for something not directly related to that naturally suggested, e.g., when a stuffed fox stands for a certain man because it is his totem, or an ox\'s head stands for divinity or for the sound "a," or when the picture of a goose stands for "son" in the Egyptian because the sounds of the two words are the same; (2) when by the natural process of shorthanding the object or image has been reduced beyond the point of recognition. Historically, the letter a is ox (or goat?); actually it means a certain sound.<P>When this unrecognizable or conventional sign is intended to suggest a visual image it is called an ideogram, when an ear picture, a phonogram. Anybody looking casually over a lot of Egyptian hieroglyphics can pick out kings\' names because of the oval line or cartouche in which they are enclosed. This cartouche is ideagraphic. On the other hand the pictures of a sun, two chicks, and a cerastes within the cartouche have nothing to do with any of these objects, but stand for the sounds kufu—who is the person commonly known as Cheops. This is phonetic. Both old Babylonian and Egyptian show signs of picture origin, but the earliest Babylonian is mainly ideographic, and both developed soon into the mixed stage of phonetic writing with determinatives.<P>5. Phonetic Writing:<P>Phonetic writing seems to have developed out of the fact that in all languages the same sound often has many different meanings. In English "goose" may mean the fowl or the tailor\'s goose. In Egyptian the sound "sa" or "s", with a smooth breathing, means "goose" or "son," and the picture of a goose means either.<P>Whether the word-sign is an ideogram or a phonogram is a matter of psychology. Many modern readers even glimpse a word as a whole and jump to the visual image without thinking of sounds at all. To them it is an ideagram. Others, however, have to spell out the sounds, even moving their lips to correspond. To them as to the writer it is a phonogram. The same was true of the ancient picture or ideagraphic sign. The word-sign was ideagram or phonogram according to intention or to perception.<P>With the transition to syllabic writing, record became chiefly phonetic. The transition was made apparently by an entirely natural evolution from the practice of using the same word-sign for several different objects having the same sound, and it proceeded by the way of rebus, as shown in Mexican and Egyptian hieroglyphics.<P>Syllabic writing implies a symbol for every monosyllable. It was a great step therefore when it was discovered that the number of sounds was small and could be represented by individual symbols, as compound words could by syllable signs. At first only consonants were written. In the Semitic languages vowels were at first not written at all—possibly they were not even recognized, and one might use any vowel with a particular combination of consonants. However that may be, what many prefer to call consonantal writing seems to have existed for 2,000 years before the vowels were recognized and regularly introduced into the Phoenician alphabet. It is at this stage that alphabetic writing, as usually reckoned, began.<P>See <a href="./study/isbe/search.html?string=ALPHABET">ALPHABET</a>.<P>Phonetic consonantal writing has now been in use some 5,000 years and strict alphabetic writing some 3,000 years, almost to the exclusion of other forms. The characters in use today in several hundred alphabets are probably the historical descendants, with accumulation of slight changes through environment, of characters existing from near the beginning.<P>Alongside the development of the historic system of symbols, there has been, still within the field of alphabetic writing for the most part, a parallel line with multitudes of shorthand and cryptographic systems. An equally great multitude of code systems are in effect phonetic words or sentences and cryptographically or otherwise used for cable or telegraph, diplomatic letters, criminal correspondence and other secret purposes.<P>III. Methods.<P>Roughly speaking, the ways of making symbols, apart from the selection of the ready-made, may be reduced to two which correspond to art in the round or in three dimensions and art in the flat or in two dimensions. The former appeals to eye or touch, affording a contrast by elevation or depression, while the latter produces the same effect by contrasting colors on a flat surface.<P>Written symbols in three dimensions are produced either by cutting or by pressure. In the case of hard material superfluous matter is removed by sculpture, engraving or die cutting. In the case of plastic or malleable material, it is modeled, molded, hammered or stamped into the required form. To the first form belongs the bulk of stone inscriptions, ancient metal inscriptions, scratched graffiti, wax tablets, etc., to the later clay tablets, votive figurines, seal impressions, hammered inscriptions, minted coins, also molded inscriptions, coins and medals, etc. Several of the Hebrew and Greek words for writing imply cutting (chaqaq, charaT, charash, etc.; grapho).<P>Symbols in two dimensions are produced either by drawing or printing, both of which methods consist in the applying of some soft or liquid material to a material of a contrasting color or cutting from thin material and laying on. Drawing applies the material in a continuous or interrupted line of paint, charcoal, colored chalk, graphite, ink or other material. Its characteristic product is the manuscript. This laying on is implied, as some think (Blau, 151), in the commonest Hebrew word for writing (kathabh). Tattooing (<a onClick="return mV(\'Deu\',14,1);">De 14:1</a>; <a onClick="return mV(\'Lev\',19,28);">Le 19:28</a>, etc.), embroidery (embroidered symbolic figures, <a onClick="return mV(\'Exd\',28,33,34);">Ex 28:33,34</a>) and weaving belong in this class (embroidered words in Palestine Talmud 20a, quoted by Blau, 165).<P>Printing consists in laying the contrasting color on by means of stencil or pressure, forming symbols in two dimensions at one stroke. Perhaps the most primitive form of printing is that of the pintadoes, by which the savage impresses war paint or other ceremonial forms on his face and body. Branding also belongs in this class (<a onClick="return mV(\'Gal\',6,17);">Ga 6:17</a>, figuratively; 3Macc 2:19; branding on the forehead, Code of Hammurabi, section 127; branding a slave, Code of Hammurabi, sections 226, 227).<P>These processes of cutting, molding, drawing and printing roughly correspond with inscriptions, coins, medals, seals, manuscripts, and printed documents—epigraphy, numismatics, sigillography, chirography, typography.<P>IV. Instruments.<P>The commonest instruments of ancient writing were the pen, brush and style. Other instruments are: the various tools for modeling, molds, stencils, dies, stamps, needles, engraving tools, compass, instruments for erasure, for the ruling of lines, vessels for ink or water, etc. Several of these are mentioned and others are implied in the Bible. The chisel which cuts and the stylus which scratches are both called stylus or simply the "iron" (the iron pen). The graving tool of <a onClick="return mV(\'Exd\',32,4);">Ex 32:4</a>, the iron pen of <a onClick="return mV(\'Job\',19,24);">Job 19:24</a>, the pen of <a onClick="return mV(\'Isa\',8,1);">Isa 8:1</a>, the pen of iron of <a onClick="return mV(\'Jer\',17,1);">Jer 17:1</a>, and, with less reason, the pencil of <a onClick="return mV(\'Isa\',44,13);">Isa 44:13</a>, are all commonly interpreted as stilus or style, but they are sometimes at least cutting rather than scratching tools. References to wooden tablets also imply the style, and references to clay tablets either the style proper or a similar instrument for pressure marks. The point of a diamond in <a onClick="return mV(\'Jer\',17,1);">Jer 17:1</a>, whether it is joined with the pen of iron or not, seems to refer to the use of corundum in the engraving of precious stones. The passages which refer to blotting out (see below) or writing on papyrus (see below) or refer to an ink-horn or ink (see respective articles) imply a pen or brush rather than style, and presumably the writing of the New Testament implied in general a reed pen. The wide house "painted with vermilion" (<a onClick="return mV(\'Jer\',22,14);">Jer 22:14</a>) implies the brush, but there is no direct evidence of its use in writing in the Bible itself. The existing ostraca from Ahab\'s palace are, however, done with the brush. The pencil (seredh) mentioned in <a onClick="return mV(\'Isa\',44,13);">Isa 44:13</a> certainly means some instrument for shaping, but is variously translated as "line" (the King James Version), "red ochre" (Revised Version margin), and even "stilus," or "line-marking stilus" (paragraphis Aquila). The compass, often referred to in classical times, is found in <a onClick="return mV(\'Isa\',44,13);">Isa 44:13</a>. The line ruler (paragraphis), referred to by Aquila (<a onClick="return mV(\'Isa\',44,13);">Isa 44:13</a>), and the simple plummet as well were probably used, as in later times, for marking lines. The needle is referred to in late Hebrew and needlework in the Bible (see III, above). The ink-horn or water vessel for moistening the dry inks is implied in all papyrus or leather writing.<P>See INK, INK-HORN.<P>The Hebrew term translated "weight of lead" in <a onClick="return mV(\'Zec\',5,8);">Zec 5:8</a>, and "talent of lead" is precisely equivalent to the Greek term for the circular plate of lead (kuklomolibdos) used for ruling lines, but something heavier than the ruling lead seems meant.<P>Erasure or blotting out is called for in <a onClick="return mV(\'Num\',5,23);">Nu 5:23</a>, and often figuratively (<a onClick="return mV(\'Exd\',32,32,33);">Ex 32:32,33</a>; <a onClick="return mV(\'Rev\',3,5);">Re 3:5</a>, etc.). If writing was on papyrus, this would call for the sponge rather than the penknife as an eraser, but the latter, which is used for erasure or for making reed pens, is referred to in <a onClick="return mV(\'Jer\',36,23);">Jer 36:23</a>. For erasing waxed surfaces the blunt end of the style was used certainly as early as the New Testament times. Systematic erasure when vellum was scarce produced the palimpsest.``147';
isbe[9261]='Writing, 2`V. Materials.<P>The materials used in writing include almost every imaginable substance, mineral, vegetable, and animal: gold, silver, copper, bronze, clay, marble, granite, precious gems, leaves, bark, wooden planks, many vegetable complexes, antlers, shoulder-blades, and all sorts of bones of animals, and especially skins. The commonest are stone, clay, metal, papyrus, paper and leather, including vellum, and all of these except paper are mentioned in the Bible. Paper too must be reckoned with in textual criticism, and it was its invention which, perhaps more even than the discovery of printing with movable type, made possible the enormous multiplication of copies of the Bible in recent times.<P>1. Clay:<P>Whatever may be the fact as to the first material used for record purposes, the earliest actual records now existing in large quantities are chiefly on clay or stone, and, on the whole, clay records seem to antedate and surpass in quantity stone inscriptions for the earliest historical period. After making all allowances for differences in dating and accepting latest dates, there is an immense quantity of clay records written before 2500 BC and still existing. About 1400 or 1500 BC the clay tablet was in common use from Crete to the extreme east and all over Palestine, everywhere, in short, but Egypt and it seems perhaps to have been the material for foreign diplomatic communications, even in Egypt. Hundreds of thousands of these tablets have been dug up, and undoubtedly millions are in existence, dug or undug. These are chiefly of Mesopotamia. The most famous of these tablets were for a long time of the later period from the library of Ashurbanipal at Nineveh. See <a href="./study/isbe/search.html?string=LIBRARY+OF+NINEVEH">LIBRARY OF NINEVEH</a>. Recently, however those from Tell el-Amarna in Egypt, Boghaz-keui in the Hittite country, and a few from Palestine itself vie with these in interest. Most of these tablets are written on both si
