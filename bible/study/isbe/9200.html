isbe[9269]='Yodh`yod "y": The 10th letter of the Hebrew alphabet; transliterated in this Encyclopedia as "y". It came also to be used for the <span class="noTag">number 10</span>.`<a href="./study/isbe/search.html?string=JOB">JOB</a>; <a href="./study/isbe/search.html?string=ALPHABET">ALPHABET</a>`1';
isbe[9270]='Yoke`yok:<P>(1) The usual word is \'ol (<a onClick="return mV(\'Gen\',27,40);">Ge 27:40</a>, etc.), less commonly the (apparently later) form motah (<a onClick="return mV(\'Isa\',58,6);">Isa 58:6</a>, etc.; in Nab 1:13 mot), which the Revised Version (British and American) in <a onClick="return mV(\'Jer\',27,\'1-\');">Jer 27</a>; <a onClick="return mV(\'Jer\',28,\'1-\');">28</a> translates "bar" (a most needless and obscuring change). The Greek in Apocrypha (Sirach 28:19, etc.) and in the New Testament (<a onClick="return mV(\'Mat\',11,29);">Mt 11:29</a>f; etc.) is invariably zugos. Egyptian monuments show a yoke that consisted of a straight bar fastened to the foreheads of the cattle at the root of the horns, and such yokes were no doubt used in Palestine also; but the more usual form was one that rested on the neck (<a onClick="return mV(\'Gen\',27,40);">Ge 27:40</a>, etc.). It was provided with straight "bars" (mototh in <a onClick="return mV(\'Lev\',26,13);">Le 26:13</a>; <a onClick="return mV(\'Eze\',34,27);">Eze 34:27</a>) projecting downward, against which the shoulders of the oxen pressed, and it was held in position by thongs or "bonds" (moceroth in <a onClick="return mV(\'Jer\',2,20);">Jer 2:20</a>; <a onClick="return mV(\'Jer\',5,5);">5:5</a>; <a onClick="return mV(\'Jer\',27,2);">27:2</a>; <a onClick="return mV(\'Jer\',30,8);">30:8</a>; \'aghuddoth in <a onClick="return mV(\'Isa\',58,6);">Isa 58:6</a>, "bands"), fastened under the animals\' throats. Such yokes could of course be of any weight (<a onClick="return mV(\'1Ki\',12,4);">1Ki 12:4</a>), depending on the nature of the work to be done, but the use of "iron yokes" (<a onClick="return mV(\'Deu\',28,48);">De 28:48</a>; <a onClick="return mV(\'Jer\',28,13);">Jer 28:13</a>f) must have been very rare, if, indeed, the phrase is anything more than a figure of speech.<P>What is meant by "the yoke on their jaws" in <a onClick="return mV(\'Hsa\',11,4);">Ho 11:4</a> is quite obscure. Possibly a horse\'s bit is meant; possibly the phrase is a condensed form for "the yoke that prevents their feeding"; possibly the text is corrupt.<P>See <a href="./study/isbe/search.html?string=JAW">JAW</A>.<P>The figurative use of "yoke" in the sense of "servitude" is intensely obvious (compare especially <a onClick="return mV(\'Jer\',27,\'1-\');">Jer 27</a>; <a onClick="return mV(\'Jer\',28,\'1-\');">28</a>). Attention needs to be called only to <a onClick="return mV(\'Lam\',3,27);">La 3:27</a>, where "disciplining sorrow" is meant, and to <a onClick="return mV(\'Jer\',5,5);">Jer 5:5</a>, where the phrase is a figure for "the law of God." This last use became popular with the Jews at a later period and it is found, e.g. in Apocrypha Baruch 41:3; <span class="noTag">Psalter of Solomon 7:9; 17:32</span>; Ab. iii.7, and in this sense the phrase is employed. by Christ in <a onClick="return mV(\'Mat\',11,29);">Mt 11:29</a>f. "My yoke" here means "the service of God as I teach it" (the common interpretation, "the sorrows that I bear," is utterly irrelevant) and the emphasis is on "my." The contrast is not between "yoke" and "no yoke," but between "my teaching" (light yoke) and "the current scribal teaching"; (heavy yoke).<P>(2) "Yoke" in the sense of "a pair of oxen" is tsemedh (<a onClick="return mV(\'1Sa\',11,7);">1Sa 11:7</a>, etc.), or zeugos (<a onClick="return mV(\'Luk\',14,19);">Lu 14:19</a>).`<a href="./study/isbe/search.html?string=UNEQUAL">UNEQUAL</a>; <a href="./study/isbe/search.html?string=YOKE+FELLOW">YOKE-FELLOW</a>`48';
isbe[9271]='Yoke-Fellow`yok\'-fel-o (sunzugos, "yoked together"): The word is used by Greek writers of those united by any bond, such as marriage, relationship, office, labor, study or business; hence, a yoke-fellow, consort, comrade, colleague or partner.<P>(1) In the New Testament it occurs once only (<a onClick="return mV(\'Phl\',4,3);">Php 4:3</a>): "I beseech thee also, true yoke-fellow." Most interpreters hold that Paul here addresses some particular but unnamed person, who had formerly been associated with him in the work of the gospel in Philippi. Many guesses have been made in regard to the identity of the unnamed "yoke-fellow," and these names have been suggested: Luke, Lydia, Epaphroditus, each of whom had in one way or another some connection with Philippi.<P>(2) Renan has suggested that yoke-fellow means Lydia (<a onClick="return mV(\'Act\',16,14,15,40);">Ac 16:14,15,40</a>), and that she had been married to Paul. But the fact that the adjective gnesios, "true," qualifying "yoke-fellow" is masculine and not feminine shows that it is not a woman but a man who is referred to. Renan\'s suggestion is an unworthy one, and is quite devoid of proof. It is a mere fanciful and unsupported creation of the Frenchman\'s brain. Renan\'s idea is a modification of an opinion which is as old as Clement of Alexandria, that Paul here referred to his own wife. But this conjecture is contradicted by the statement of the apostle himself, that he had not a wife (<a onClick="return mV(\'1Cr\',7,8);">1Co 7:8</a>; <a onClick="return mV(\'1Cr\',9,5);">9:5</a>).<P>(3) There is still another way of interpreting "yoke-fellow," and probably it is the right one. Some expositors take the word as a proper name. Among these Westcott and Hort print "Sunzuge," in the margin. In favor of this interpretation there is much to be said, especially the fact that the word is found in the very midst of the names of other persons. The names of Euodia and Syntyche are mentioned immediately before, and that of Clement follows immediately after the true yoke-fellow. The meaning therefore is probably, "I beseech thee also, true Synzygos," i.e. I beseech thee, who art a genuine Synzygos, a colleague rightly so called, a colleague in fact as well as in name. It is obvious to compare the way in which the apostle plays upon the name Onesimus, in <a onClick="return mV(\'Phm\',1,11);">Phm 1:11</a>.``155';
isbe[9272]='Young; Men, Young Women`yung, (bachur, na\'ar; neanias, neaniskos): "Young man" is generally in the Old Testament the translation of bachur, from bachar, "to prove," "to choose," and of na\'ar (literally, "boy," but used sometimes also of a girl). The former term denotes a young man, no longer a mere youth, but liable to military service (<a onClick="return mV(\'Deu\',32,25);">De 32:25</a>; <a onClick="return mV(\'Jdg\',14,10);">Jud 14:10</a>; <a onClick="return mV(\'1Sa\',8,16);">1Sa 8:16</a>; <a onClick="return mV(\'2Ki\',8,12);">2Ki 8:12</a>, etc.). In <a onClick="return mV(\'Num\',11,28);">Nu 11:28</a>, the King James Version "Joshua...the servant of Moses, one of his young men" (bechurim), the Revised Version (British and American) renders "one of his chosen men," margin "from his youth." Na\'ar is frequently used (singular and plural) of soldiers (<a onClick="return mV(\'1Sa\',14,1,6);">1Sa 14:1,6</a>; <a onClick="return mV(\'1Sa\',21,4);">21:4</a>; <a onClick="return mV(\'1Sa\',25,5,8,9);">25:5,8,9</a>; <a onClick="return mV(\'2Sa\',1,5,6,15);">2Sa 1:5,6,15</a>, etc.). Abraham\'s "young men" (ne\'arim) were "trained servants," "trained men," warriors (<a onClick="return mV(\'Gen\',14,24);">Ge 14:24</a>; compare <a onClick="return mV(\'Gen\',14,14);">14:14</A> the Revised Version (British and American)). The word is often in the Old Testament translated "servant": thus in the Revised Version (British and American) for the King James Version "young man," "young men" (<a onClick="return mV(\'Gen\',18,7);">Ge 18:7</a>; <a onClick="return mV(\'2Ki\',4,22);">2Ki 4:22</a>; <a onClick="return mV(\'1Ki\',20,14);">1Ki 20:14</a>, the Revised Version margin). In the New Testament, the ordinary words for "young man" are neanias (<a onClick="return mV(\'Act\',7,58);">Ac 7:58</a>; <a onClick="return mV(\'Act\',20,9);">20:9</a>; <a onClick="return mV(\'Act\',23,17,18,22);">23:17,18,22</a>) and neaniskos (<a onClick="return mV(\'Mat\',19,20,22);">Mt 19:20,22</a>; <a onClick="return mV(\'Mar\',14,51);">Mr 14:51</a>, etc.). "Young men" in <a onClick="return mV(\'Act\',5,6);">Ac 5:6</a> is neoteroi, comparative of neos, "young," recent; the feminine of the latter word is "young women" in <a onClick="return mV(\'Tts\',2,4);">Tit 2:4</a>, and neoterai is "younger women" (the Revised Version (British and American) "widows") in <a onClick="return mV(\'1Ti\',5,14);">1Ti 5:14</a>. In both the Old Testament and the New Testament young men are earnestly exhorted to wisdom and sober-mindedness (<a onClick="return mV(\'Pro\',1,8,9);">Pr 1:8,9</a>; <a onClick="return mV(\'Ecc\',11,9);">Ec 11:9</a>; <a onClick="return mV(\'Ecc\',12,1,13,14);">12:1,13,14</a>; <a onClick="return mV(\'Tts\',2,6);">Tit 2:6</a>, "discreet"; compare <span class="noTag">The Wisdom of Solomon 9:11</span>), etc.``185';
isbe[9273]='Zaanaim`za-a-na\'-im.`<a href="./study/isbe/search.html?string=ZAANANNIM">ZAANANNIM</a>`1';
isbe[9274]='Zaanan`za\'-a-nan (tsa\'anan; Sennaar): A place named by Micah in the Shephelah of Judah (<a onClick="return mV(\'Mic\',1,11);">1:11</A>). In this sentence the prophet makes verbal play with the name, as if it were derived from yatsa\', "to go forth": "The inhabitant (margin "inhabitress") of tsa\'anan is not come forth" (yatse\'ah). The place is not identical. It is probably the same as <a href="./study/isbe/search.html?string=ZENAN">ZENAN</A>.``1';
isbe[9275]='Zaanannim; Plain or Oak of`za-a-nan\'-im, elon betsa\'anayim; or betsa\'anannim Codex Vaticanus Besamiein; Codex Alexandrinus Besananim (<a onClick="return mV(\'Jos\',19,33);">Jos 19:33</a>); in <a onClick="return mV(\'Jdg\',4,11);">Jud 4:11</a> Codex Vaticanus translates it as pleonektounton, and Codex Alexandrinus has anapauomenon): In <a onClick="return mV(\'Jos\',19,33);">Jos 19:33</a> the King James Version reads "Allon to Zaanannim," the Revised Version (British and American) "the oak in Zaanannim," the Revised Version margin "oak (or terebinth) of Bezaanannim." In <a onClick="return mV(\'Jdg\',4,11);">Jud 4:11</a> the King James Version reads "plain of Zaanaim," the Revised Version (British and American) "oak in Zaanannim." It is probable that the same place is intended in the two passages. It was a place on the southern border of the territory of Naphtali (Joshua), and near it the tent of Heber the Kenite was pitched (Judges). The absence of the article before \'elon shows that the "be" is not the preposition before "z", but the first letter of the name, which accordingly should be read "Bezaanannim." We should naturally look for it near Adami and Nekeb. This agrees also with the indications in Judges, if the direction of Sisera\'s flight suggested in <a href="./study/isbe/search.html?string=MEROZ">MEROZ</a> (which see) is correct. The Kadesh, then, of <a onClick="return mV(\'Jdg\',4,11);">Jud 4:11</a> may be represented by the ruin Qadish on the western shore of the Sea of Galilee; and in the name Khirbet Bessum, about 3 miles northeast of Tabor, there is perhaps an echo of Bezaanannim.``54';
isbe[9276]='Zaavan`za\'-a-van (za\'-awan, meaning unknown): A Horite descendant of Seir (<a onClick="return mV(\'Gen\',36,27);">Ge 36:27</a>; <a onClick="return mV(\'1Ch\',1,42);">1Ch 1:42</a>). In 1 Chronicles, Lucian has Zauan = Samaritan z-w-\'-n i.e. Zaw\'an, from a root meaning "to tremble," "fear" (see ..., BDB). King James Version has "Zavan" in 1 Chronicles.``1';
isbe[9277]='Zabad`za\'-bad (zabhadh, perhaps a contraction for (1) zebhadhyah, "Yahweh has given," i.e. Zebadiah; or (2) zabhdi\'el, "El (God) is my gift" (HPN, 222f); Zabed(t), with many variants):<P>(1) A Jerahmeelite (<a onClick="return mV(\'1Ch\',2,36,37);">1Ch 2:36,37</a>), son of Nathan (see <a href="./study/isbe/search.html?string=NATHAN">NATHAN</A>, IV).<P>(2) An Ephraimite, son of Tahath (<a onClick="return mV(\'1Ch\',7,21);">1Ch 7:21</a>).<P>(3) Son of Ahlai (<a onClick="return mV(\'1Ch\',11,41);">1Ch 11:41</a>) and one of David\'s mighty men (the name is wanting in <a onClick="return mV(\'2Sa\',23,\'24-29\');">2Sa 23:24-29</a>).<P>(4) Son of Shimeath the Ammonitess (<a onClick="return mV(\'2Ch\',26,\'1-\');">2Ch 26</a>); he was one of the murderers of King Joash of Judah; called "Jozacar" in <a onClick="return mV(\'2Ki\',12,21);">2Ki 12:21 (Hebrew verse 22)</a>. Perhaps the name in Chronicles should be Zacar (zakhar),<P>(5) Name of three men who had married foreign wives:<P>(a) son of Zattu (<a onClick="return mV(\'Ezr\',10,27);">Ezr 10:27</a>)= "Sabathus" of 1Esdras 9:28;<P>(b) son of Hashum (<a onClick="return mV(\'Ezr\',10,33);">Ezr 10:33</a>) = "Sabanneus" of 1Esdras 9:33;<P>(c) son of Nebo (<a onClick="return mV(\'Ezr\',10,43);">Ezr 10:43</a>) = "Zabadeas" of 1Esdras 9:35.``149';
isbe[9278]='Zabadaeans`zab-a-de\'-anz (Zabadaioi; the King James Version Zabadeans; Oesterley, in Charles, Apocrypha, I,112,prefers, on what seems insufficient evidence, to read "Gabadeans"; Josephus (Ant., XIII, v, 10) by an obvious error has "Nabateans"): According to 1Macc 12:31, an Arabian tribe, defeated and spoiled by Jonathan after his victory in Hamath and before he came to Damascus. There is an ez-Zebedani about 25 miles northwest of Damascus (now a station on the railway to Beirut), on the eastern slope of the Anti-Lebanon range. This town may very well have preserved the name of the Zabadaeans, and its situation accords nicely with Jonathan\'s movements in 1Macc 12.``48';
isbe[9279]='Zabadaias`zab-a-da\'-yas. The King James Version = the Revised Version (British and American) <a href="./study/isbe/search.html?string=ZABADEAS">ZABADEAS</A> (which see)``1';
isbe[9280]='Zabadeas`zab-a-de\'-as (Zabadaias; the King James Version Zabadaias): One of the sons of Nooma who put away their foreign wives (1Esdras 9:35) = "Zabad" of <a onClick="return mV(\'Ezr\',10,43);">Ezr 10:43</a>.``1';
isbe[9281]='Zabbai`zab\'-a-i, zab\'-i (zabbay, meaning unknown; Zabou):<P>(1) One of those who had married foreign wives (<a onClick="return mV(\'Ezr\',10,28);">Ezr 10:28</a>) = "Jozabdus" of 1Esdras 9:29.<P>(2) Father of Baruch (<a onClick="return mV(\'Neh\',3,20);">Ne 3:20</a>). The Qere has zakkay = "Zaccai"of <a onClick="return mV(\'Ezr\',2,9);">Ezr 2:9</a>; <a onClick="return mV(\'Neh\',7,14);">Ne 7:14</a>.``1';
isbe[9282]='Zabbud`zab\'-ud (zabbudh, meaning uncertain; <a onClick="return mV(\'Ezr\',8,14);">Ezr 8:14</a>, where Kere is zakkur and Kethibh is zabhudh = "Zabud"; 1Esdras 8:40 has "Istalcarus"): A companion of Ezra on his journey from Babylon to Jerusalem.``1';
isbe[9283]='Zabdeus`zab-de\'-us (Zabdaios): In 1Esdras 9:21 = "Zebadiah" of <a onClick="return mV(\'Ezr\',10,20);">Ezr 10:20</a>.``1';
isbe[9284]='Zabdi`zab\'-di (zabhdi>, perhaps "(a) gift of Yahweh" or "my gift" = New Testament "Zebedee"):<P>(1) An ancestor of Achan (<a onClick="return mV(\'Jos\',7,1,17,18);">Jos 7:1,17,18</a>). Some Septuagint manuscripts and <a onClick="return mV(\'1Ch\',2,6);">1Ch 2:6</a> have "Zimri" (zimri); "the confusion of the Hebrew letter beth (b) and the Hebrew letter mem (m) is phonetic; the confusion of the Hebrew letter daleth (d) and the Hebrew letter resh (r) is graphic" (Curtis, Chronicles, 86).<P>See <a href="./study/isbe/search.html?string=ZIMRI+(1)">ZIMRI, (3)</A>.<P>(2) A Benjamite, son of Shimei (<a onClick="return mV(\'1Ch\',8,19);">1Ch 8:19</a>), and possibly a descendant of Ehud (Curtis).<P>(3) "The Shiphmite," one of David\'s officers who had charge of the wine-cellars (<a onClick="return mV(\'1Ch\',27,27);">1Ch 27:27</a>). The Septuagint\'s Codex Vaticanus has Zachrei (probably Zichri).<P>(4) An ancestor of Mattaniah (<a onClick="return mV(\'Neh\',11,17);">Ne 11:17</a>). Luc. and <a onClick="return mV(\'1Ch\',9,15);">1Ch 9:15</a> have "Zichri."<P>See <a href="./study/isbe/search.html?string=ZICHRI">ZICHRI, I, 2</A>.``149';
isbe[9285]='Zabdiel`zab\'-di-el (zabhdi\'el, "my gift is El (God)"; Zabdiel):<P>(1) Father of Jashobeam (<a onClick="return mV(\'1Ch\',27,2);">1Ch 27:2</a>), or rather Ishbaal (Curtis, Chronicles, 290f).<P>(2) An overseer of the priests (<a onClick="return mV(\'Neh\',11,14);">Ne 11:14</a>).<P>(3) An Arabian who beheaded Alexander Balas and sent his head to Ptolemy (1Macc 11:17).``1';
isbe[9286]='Zabud`za\'-bud (zabhudh, "bestowed"):<P>(1) A son of Nathan (the prophet, probably) said in Kings to be chief minister to Solomon and also the king\'s friend (<a onClick="return mV(\'1Ki\',4,5);">1Ki 4:5</a>; <a onClick="return mV(\'1Ch\',2,36);">1Ch 2:36</a>). The American Revised Version margin has "priest" for "chief minister." Benzinger (Kurz. Hand-Commentary, 18) holds that "this expression is a marginal gloss here," while Kittel (Handkomm., 31) holds it to be genuine, though it is wanting in the Septuagint. Some suggest cokhen (see <a href="./study/isbe/search.html?string=SHEBNA">SHEBNA</a>) for kohen. The expression "king\'s friend" (compare <a onClick="return mV(\'2Sa\',15,37);">2Sa 15:37</a>; <a onClick="return mV(\'2Sa\',16,16);">16:16</a>) is, says Kittel, an old Canaanite title, found also in the Tell el-Amarna Letters.`<a href="./study/isbe/search.html?string=ZACCUR">ZACCUR</a>; <a href="./study/isbe/search.html?string=PRIESTS+AND+LEVITES">PRIESTS AND LEVITES</a>`149';
isbe[9287]='Zabulon`zab\'-u-lon (Zaboulon): Greek form of "Zebulun" of <a onClick="return mV(\'Mat\',4,13,16);">Mt 4:13,16</a>; <a onClick="return mV(\'Rev\',7,8);">Re 7:8</a> the King James Version.``1';
isbe[9288]='Zaccai`zak\'-a-i, zak\'-i.`<a href="./study/isbe/search.html?string=ZABBAI">ZABBAI</a>`1';
isbe[9289]='Zacchaeus`za-ke\'-us (Zakchaios, from zakkay, "pure"):<P>(1) A publican with whom Jesus lodged during His stay in Jericho (<a onClick="return mV(\'Luk\',19,\'1-10\');">Lu 19:1-10</a>). He is not mentioned in the other Gospels. Being a chief publican, or overseer, among the tax-gatherers, Zaccheus had additional opportunity, by farming the taxes, of increasing that wealth for which his class was famous. Yet his mind was not entirely engrossed by material considerations, for he joined the throng which gathered to see Jesus on His entrance into the city. Of little stature, he was unable either to see over or to make his way through the press, and therefore scaled a sycomore tree. There he was singled out by Jesus, who said to him, "Zacchaeus, make haste, and come down; for to-day I must abide at thy house" (<a onClick="return mV(\'Luk\',19,5);">Lu 19:5</a>). The offer thus frankly made by Jesus was accepted eagerly and gladly by Zaccheus; and the murmurings of the crowd marred the happiness of neither. How completely the new birth was accomplished in Zaccheus is testified by his vow to give half of his goods to the poor, and to make fourfold restitution where he had wrongfully exacted. The incident reveals the Christian truth that just as the publican Zaccheus was regarded by the rest of the Jews as a sinner and renegade who was unworthy to be numbered among the sons of Abraham, and was yet chosen by our Lord to be His host, so the social outcast of modern life is still a son of God, within whose heart the spirit of Christ is longing to make its abode. "For the Son of man came to seek and to save that which was lost" (<a onClick="return mV(\'Luk\',19,10);">Lu 19:10</a>).<P>(2) An officer of Judas Maccabeus (2Macc 10:19). (3) A Zaccheus is mentioned in the Clementine Homilies (iii.63) as having been a companion of Peter and appointed bishop of Caesarea.<P>(4) According to the Gospel of the Childhood, by Thomas, Zaccheus was also the name of the teacher of the boy Jesus.``88';
isbe[9290]='Zacchur`zak\'-ur.`<a href="./study/isbe/search.html?string=ZACCUR">ZACCUR</a>`1';
isbe[9291]='Zaccur`zak\'-ur (zakkur, perhaps "ventriloquist" (Gray, Numbers, 137)):<P>(1) Father of Shammua the Reubenite spy (<a onClick="return mV(\'Num\',13,4);">Nu 13:4</a>).<P>(2) A Simeonite (<a onClick="return mV(\'1Ch\',4,26);">1Ch 4:26</a>); the King James Version "Zacchur."<P>(3) Levites: (a) a Merarite (<a onClick="return mV(\'1Ch\',24,27);">1Ch 24:27</a>); (b) a "son" of Asaph (<a onClick="return mV(\'1Ch\',25,2,10);">1Ch 25:2,10</a>; <a onClick="return mV(\'Neh\',12,35);">Ne 12:35</a>); (c) <a onClick="return mV(\'Neh\',10,12);">Ne 10:12 (Hebrew verse 13)</a>, and probably the same as in <a onClick="return mV(\'Neh\',13,13);">Neh 13:13</A>, father of Hanan.<P>(4) A marginal reading in <a onClick="return mV(\'Ezr\',8,14);">Ezr 8:14</a> for Zabbud where Kethibh is really "Zabud".<P>See <a href="./study/isbe/search.html?string=ZABBUD">ZABBUD</A>.<P>(5) Son of Imri and one of the builders of Jerusalem (<a onClick="return mV(\'Neh\',3,2);">Ne 3:2</a>).``149';
isbe[9292]='Zachariah`zak-a-ri\'-a (Zacharias; the King James Version, Zacharias):<P>(1) The son of Barachiah, who, Jesus says, was slain between the temple and the altar (<a onClick="return mV(\'Mat\',23,35);">Mt 23:35</a>; <a onClick="return mV(\'Luk\',11,51);">Lu 11:51</a>). The allusion seems to be to the murder of Zechariah, the son of Jehoiada (<a onClick="return mV(\'2Ch\',24,20);">2Ch 24:20</a>). In this case "Barachiah" would seem to be a gloss which has crept into the text through confusion with the name of the father of the prophet Zechariah, <a href="./study/isbe/search.html?string=BERECHIAH">BERECHIAH</A> (which see).`<a href="./study/isbe/search.html?string=ZECHARIAH">ZECHARIAH</a>`1';
isbe[9293]='Zacharias (1)`zak-a-ri\'-as (Zacharias):<P>(1) One of the "rulers of the temple" at the time of Josiah\'s Passover (1Esdras 1:8) = "Zechariah" of <a onClick="return mV(\'2Ch\',35,8);">2Ch 35:8</a>.<P>(2) One of the "holy singers" at Josiah\'s Passover (1Esdras 1:15); the name stands in place of "Heman" in <a onClick="return mV(\'2Ch\',35,15);">2Ch 35:15</a>.<P>(3) In 1Esdras 6:1; 7:3 = the prophet Zechariah.<P>(4) One of the sons of Pharos who returned with Ezra at the head of his family (1Esdras 8:30) = "Zechariah" of <a onClick="return mV(\'Ezr\',8,3);">Ezr 8:3</a>, and perhaps identical with (5).<P>(5) One of the "men of understanding" with whom Ezra consulted when he discovered the absence of priests and Levites (1Esdras 8:44) = "Zechariah" of <a onClick="return mV(\'Ezr\',8,16);">Ezr 8:16</a>, and perhaps identical with (6).<P>(6) Zacharias (omitted in the King James Version), who stood on Ezra\'s left hand as he expounded the Law (1Esdras 9:44) = "Zechariah" of <a onClick="return mV(\'Neh\',8,4);">Ne 8:4</a>.<P>(7) One of the sons of Babi who went up at the head of his family with Ezra (1Esdras 8:37) = "Zechariah" of <a onClick="return mV(\'Ezr\',8,11);">Ezr 8:11</a>.<P>(8) One of the sons of Elam who had taken foreign wives (1Esdras 9:27) = "Zechariah" of <a onClick="return mV(\'Ezr\',10,26);">Ezr 10:26</a>.<P>(9) The father of Joseph, one of the "leaders of the people" under Judas (1Macc 5:18,56).<P>(10) The King James Version = the Revised Version (British and American) "Zarains" (1Esdras 5:8).<P>(11) The King James Version = the Revised Version (British and American) "Zachariah" of <a onClick="return mV(\'Mat\',23,35);">Mt 23:35</a>.``5';
isbe[9294]='Zacharias (2)`(Zacharias): Father of John the Baptist (<a onClick="return mV(\'Luk\',1,5);">Lu 1:5</a>, etc.). He was a priest of the course of <a href="./study/isbe/search.html?string=ABIJAH">ABIJAH</A> (which see), of blameless life, who in his old age was still childless. But on one occasion when it was the turn of the course of Abijah to minister in the temple (see <a href="./study/isbe/search.html?string=TEMPLE">TEMPLE</a>), Zacharias was chosen by lot to burn incense. While engaged in this duty he was visited by Gabriel, who announced to him that he should become the father of the precursor of the Messiah. Zacharias received the promise incredulously and was punished by being stricken mute. When, however, the child was born and Zacharias had obeyed the injunction of Gabriel by insisting on the name John, his powers of speech returned to him. According to <a onClick="return mV(\'Luk\',1,\'67-79\');">Lu 1:67-79</a>, Zacharias was the author of the hymn Benedictus, which describes God\'s deliverance of Israel in language drawn entirely from the Old Testament, and which is unaffected by the later Christian realization that the Kingdom is also for Gentiles.<P>Elisabeth, his wife, was of the daughters of Aaron (<a onClick="return mV(\'Luk\',1,5);">Lu 1:5</a>) and kinswoman of the Virgin (<a onClick="return mV(\'Luk\',1,36);">Lu 1:36</a>; the relationship is altogether obscure). According to <a onClick="return mV(\'Luk\',1,\'42-45\');">Lu 1:42-45</a>, she was one of those who shared in the secret of the Annunciation. A few manuscripts in <a onClick="return mV(\'Luk\',1,46);">Lu 1:46</a> ascribe the Magnificat to her, but this seems certainly erroneous. See especially Zahn, Evangelium des Lucas, 98-101 and 745-751 (1913).``48';
isbe[9295]='Zachary`zak\'-a-ri (Latin Zacharias): the King James Version and the Revised Version (British and American) in 2Esdras 1:40 = the prophet Zechariah.``1';
isbe[9296]='Zacher`za\'-ker.`<a href="./study/isbe/search.html?string=ZACHER">ZACHER</a>`1';
isbe[9297]='Zadok`za\'-dok (tsadowq, once tsadhoq (<a onClick="return mV(\'1Ki\',1,26);">1Ki 1:26</a>), similar to tsaddiq, and tsadduq, post-Biblical, meaning justus, "righteous"; Septuagint Sadok): Cheyne in Encyclopedia Biblica suggests that Zadok was a modification of a Gentilic name, that of the Zidkites the Negeb, who probably derived their appellation from the root ts-d-q, a secondary title of the god they worshipped. At the same time Cheyne admits that cultivated Israelites may have interpreted Zadok as meaning "just," "righteous"—a much more credible supposition.<P>(1) Zadok the son of Ahitub (<a onClick="return mV(\'2Sa\',8,17);">2Sa 8:17</a>)—not of Ahitub the ancestor of Ahimelech (<a onClick="return mV(\'1Sa\',14,3);">1Sa 14:3</a>) and of Abiathar, his son (<a onClick="return mV(\'1Sa\',22,20);">1Sa 22:20</a>).<P>(2) Zadok father of Jerusha, mother of Jotham, and wife of Uzziah king of Judah (<a onClick="return mV(\'2Ki\',15,33);">2Ki 15:33</a>; <a onClick="return mV(\'2Ch\',27,1);">2Ch 27:1</a>).<P>(3) Zadok the son of Ahitub and father of Shallum (<a onClick="return mV(\'1Ch\',6,12);">1Ch 6:12</a>) or Meshullam (<a onClick="return mV(\'Neh\',11,11);">Ne 11:11</a>), and the ancestor of Ezra (<a onClick="return mV(\'Ezr\',7,1,2);">7:1,2</a>).<P>(4) Zadok the son of Baana, a wall-builder in the time of Nehemiah (<a onClick="return mV(\'Neh\',3,4);">Ne 3:4</a>), and probably one of the signatories to the covenant made by the princes, priests and Levites of Israel (<a onClick="return mV(\'Neh\',10,21);">Ne 10:21</a>)—in both places his name occurring immediately after that of Meshezabel.<P>(5) Zodak the son of Immer, and, like the preceding, a repairer of the wall (<a onClick="return mV(\'Neh\',3,29);">Ne 3:29</a>).<P>(6) Zodak a scribe in the time of Nehemiah (<a onClick="return mV(\'Neh\',13,13);">13:13</a>). Whether this was the same as either of the two preceding cannot be determined.<P>The first of these filled a larger place in Old Testament history than either of the others; and to him accordingly the following paragraphs refer. They set forth the accounts given of him first in Samuel and Kings and next in Chronicles; after which they state and criticize the critical theory concerning him.<P>1. In Samuel and Kings:<P>(1) In these older sources Zodak first appears in David\'s reign, after Israel and Judah were united under him, as joint occupant with Ahimelech of the high priest\'s office and his name taking precedence of that of his colleague Ahimelech, the son of Abiathar (<a onClick="return mV(\'2Sa\',8,17);">2Sa 8:17</a>).<P>(2) On David\'s flight from Jerusalem, occasioned by Absalom\'s rebellion, Zadok and Abiathar (now the joint high priest), accompanied by the whole body of the Levites, followed the king across the Kidron, bearing the Ark of the Covenant, which, however, they were directed to carry back to the city, taking with them their two sons, Ahimaaz the son of Zadok, and Jonathan the son of Abiathar, to act as spies upon the conduct of the rebels and send information to the king (<a onClick="return mV(\'2Sa\',15,\'24-36\');">2Sa 15:24-36</a>; <a onClick="return mV(\'2Sa\',17,15);">17:15</a>,<a onClick="return mV(\'2Sa\',17,\'17-21\');">17-21</a>).<P>(3) On the death of Absalom, Zodak and Abiathar were employed by David as intermediaries between himself and the elders of Judah to consult about his return to the city, which through their assistance was successfully brought about (<a onClick="return mV(\'2Sa\',19,11);">2Sa 19:11</a>).<P>(4) When, toward the end of David\'s life, Adonijah the son of Haggith, and therefore the crown prince, put forward his claim to the throne of all Israel, taking counsel with Joab and Abiathar, Zodak along with Benaiah, the son of Jehoiada, and Nathan the prophet, espoused the cause of Solomon, Bathsheba\'s son, and acting on David\'s instructions anointed him as king in Gihon (<a onClick="return mV(\'1Ki\',1,8,26,\'32-45\');">1Ki 1:8,26,32-45</a>).<P>(5) Accordingly, when Solomon found himself established on the throne, he put Zodak in the room of Abiathar, i.e. made him sole high priest, while retaining Abiathar in the priestly office, though deposed from a position of coordinate authority with Zodak (<a onClick="return mV(\'1Ki\',2,26,27,35);">1Ki 2:26,27,35</a>; <a onClick="return mV(\'1Ki\',4,4);">4:4</a>).<P>2. In Chronicles:<P>(1) As in the earlier sources so in these, Zodak\'s father was Ahitub and his son Ahimaaz—the information being added that they were all descendants from Aaron through Eleazar (<a onClick="return mV(\'1Ch\',6,\'50-53\');">1Ch 6:50-53</a>).<P>(2) Among the warriors who came to Hebron to turn the kingdom of Saul to David was "Zodak, a young man mighty of valor," who was followed by 22 captains of his father house (<a onClick="return mV(\'1Ch\',12,\'26-28\');">1Ch 12:26-28</a>).<P>(3) Along with Abiathar and the Levites, Zodak was directed by David to bring up the Ark from the house of Obed-edom to the tent pitched for it on Mt. Zion, when Zodak was appointed to officiate at Gibeon, while Abiathar, it is presumed, ministered in Jerusalem (<a onClick="return mV(\'1Ch\',15,11);">1Ch 15:11</a>; <a onClick="return mV(\'1Ch\',16,39);">16:39</a>).<P>(4) Toward the end of David\'s reign Zodak and Abimelech the son of Abiathar acted as priests, Zodak as before having precedence (<a onClick="return mV(\'1Ch\',18,16);">1Ch 18:16</a>).<P>(5) To them was committed by the aged king the task of arranging the priests and Levites according to their several duties, it being intimated by the narrator that Zodak was of the sons of Eleazar, and Ahimelech (in <a onClick="return mV(\'1Ch\',18,16);">1Ch 18:16</a>, named Abiathar; see above) of the sons of Ithamar (<a onClick="return mV(\'1Ch\',24,3);">1Ch 24:3</a>). In <a onClick="return mV(\'1Ch\',24,6);">1Ch 24:6</a> Ahimelech is called the son of Abiathar, while in <a onClick="return mV(\'1Ch\',18,16);">18:16</A>, Abiathar\'s son is Abimelech—which suggests that the letters "b" and "h" were interchangeable in the name of Abiathar\'s sons.<P>(6) When Solomon was anointed king, Zodak was anointed (sole) priest (<a onClick="return mV(\'1Ch\',29,22);">1Ch 29:22</a>).<P>Obviously a large measure of agreement exists between the two narratives. Yet some points demand explanation.<P>3. Harmony of the Accounts:<P>(1) The seeming discrepancy between the statements in the earlier sources, that Zodak\'s colleague in the high priest\'s office is first named Ahimelech (<a onClick="return mV(\'2Sa\',8,17);">2Sa 8:17</a>) and afterward Abiathar (<a onClick="return mV(\'2Sa\',15,24);">2Sa 15:24</a>), should occasion little perplexity. Either Ahimelech and Abiathar were one and the same person—not an unlikely supposition (see above); or, what is more probable, Abiathar was Ahimelech\'s son and had succeeded to his father\'s office.<P>(2) Zodak\'s appearance as a young soldier among the captains who brought David to Jerusalem (assuming that Zodak the soldier was Zodak the priest, which is not absolutely certain) need create no difficulty, if Zodak was not then of age to succeed his father in the priestly office. The earlier sources do not make Zodak an acting priest till after David\'s accession to the throne of all Israel.<P>(3) Neither should it prove an insoluble problem to explain how, soon after David\'s accession to the throne of Judah and Israel, Zodak should be found engaged along with Abiathar in bringing up the Ark to Mt. Zion, as by this time Zodak had obviously entered on the high-priestly office, either in succession to or as colleague of his father.<P>(4) That Zodak was left to officiate at Gibeon where the tabernacle was, while Abiathar was selected to exercise office in the capital, in no way conflicts with the earlier account and seems reasonable as a distribution of official duties. Why Zodak was sent to Gibeon, where the tabernacle was, and not kept at Jerusalem whither the Ark had been brought, he being always named before Abiathar and probably looked upon as the principal high priest, may have had its reason either in the fact that the king regarded Gibeon as the central sanctuary for national worship, the tabernacle being there (Solomon obviously did; see <a onClick="return mV(\'2Ch\',1,3);">2Ch 1:3</a>), and therefore as the proper place for the principal high priest; or in the fact that Zodak was younger than Abiathar and therefore less fitted than his older colleague to be at court, as an adviser to the king.<P>(5) That toward the end of David\'s reign, not Abiathar, but his son Ahimelech (or Abimelech), should be introduced as joint high priest with Zodak will not be surprising, if Abiathar was by this time an old man, as his father was at the beginning of David\'s reign. That grandfather and grandson should have the same name is as likely to have been common then as it is today.<P>(6) That Zodak should have been appointed sole high priest on Solomon\'s accession (<a onClick="return mV(\'1Ch\',29,22);">1Ch 29:22</a>) is not inconsistent with the statement (<a onClick="return mV(\'1Ki\',4,4);">1Ki 4:4</a>) that under Solomon Zodak and Abiathar were priests. Abiathar might still be recognized as a priest or even as a high priest, though no longer acting as such. The act of deposition may have affected his son Ahimelech as well, and if both father and son were degraded, perhaps this was only to the extent of excluding them from the chief dignity of high priest.<P>4. The Higher Critical Theory:<P>The higher criticism holds:<P>(1) that the Zadok of David\'s reign was not really an Aaronite descended from Eleazar through Ahitub, who was not Zadok\'s father but Ahimelech\'s (Gray in EB, article "Ahitub"), but an adventurer, a soldier of fortune who had climbed up into the priest\'s office, though by what means is not known (Wellhausen, GJ, 145);<P>(2) that up till Zadok\'s appearance the priesthood had been in Ithamar\'s line, though, according to the insertion by a later writer in the text of <a onClick="return mV(\'1Sa\',2,\'1-\');">1Sa 2</a> (see <a onClick="return mV(\'1Sa\',2,27);">2:27</A>ff), in Eli\'s day it was predicted that it should pass from Eli\'s house and be given to another;<P>(3) that when Abiathar or Ahimelech or both were deposed and Zadok instituted sole high priest by Solomon, this fictitious prophecy was fulfilled—though in reality there was neither prophecy nor fulfillment;<P>(4) that during the exile Ezekiel in his sketch of the vision-temple represented the Zadokites as the only legitimate priests, while the others of the line of A were degraded to be Levites;<P>(5) that in order to establish the legitimacy of Zadok the writer of the Priestly Code (P) invented his Aaronic descent through Eleazar and inserted the fictitious prophecy in 1 Samuel.<P>5. Criticism of This Theory:<P>(1) This theory proceeds upon the assumption, not that the Chronicler was a post-exilic writer (which is admitted), but that he deliberately and purposely idealized and to that extent falsified the past history of his people by ascribing to them a faithful adherence to the Levitical institutions of the Priestly Code, which, according to this theory, were not then in existence—in other words by representing the religious institutions and observances of his own age as having existed in the nation from the beginning. Were this theory established by well-accredited facts, it would doubtless require to be accepted; but the chief, if not the only, support it has is derived from a previous reconstruction of the sacred text in accordance with theory it is called on to uphold.<P>(2) That the father of Zadok was not Ahitub, a priest of the line of Eleazar, is arrived at by declaring the text in <a onClick="return mV(\'2Sa\',8,17);">2Sa 8:17</a> to have been intentionally corrupted, presumably by a late redactor, the original form of the verse having been, according to criticism (Wellhausen, TBS, 176f): "Abiathar the son of Ahimelech, the son of Ahitub, and Zadok were priests." But if this was the original form of the words it is not easy to explain why they should have been so completely turned round as to say the opposite, namely, that Ahimelech was the son of Abiathar, and that Ahitub was the father of Zadok., when in reality he was the father of Ahimelech. If, as Cornill admits (Einl, 116), the Chronicler worked "with good, old historical material," it is not credible that he made it say the opposite of what it meant.<P>(3) If Zadok was not originally a priest, but only a military adventurer, why should David have made him a priest at all? Wellhausen says (GI, 20) that when David came to the throne he "attached importance to having as priests the heirs of the old family who had served the Ark at Shiloh." But if so, he had Abiathar of the line of Ithamar at hand, and did not need to go to the army for a priest. If, however, it be urged that in making Zadok a priest he gave him an inferior rank to Abiathar, and sent him to Gibeon where the tabernacle was, why should both sources so persistently place Zadok before Abiathar?<P>(4) If Zadok was originally a soldier not connected with the priesthood, and only became a priest after David came to Jerusalem, why should the earlier source have omitted to record this, when no reason existed, so far as one can discover, why it should have been left out? And why should the priestly disposed Chronicler have incorporated this in his narrative when all his inclinations should have moved him to omit it, more especially when he was intending to invent (according to the critical theory) for the young warrior an Aaronite descent?<P>(5) That the prediction of the fall of Eli\'s house (<a onClick="return mV(\'1Sa\',2,\'27-36\');">1Sa 2:27-36</a>) was inserted by a late writer to justify its supersession by the line of Zadok has no foundation except the presupposition that prediction is impossible, which fair-minded criticism cannot admit. The occurrence of the word "anointed" it is contended, presupposes the monarchy. This, however, it only predicts; and at the most, as Driver sees (Introduction, 164), cannot prove the fictitious character of the prophecy, but merely that it has been "recast by the narrator and colored by the associations with which he himself is familiar"; and even this is entirely hypothetical.<P>(6) Ezekiel\'s reference to Zadok\'s descendants as the only legitimate priests in the vision-temple does not prove that Zadok himself was a soldier who climbed up into the priesthood. Even if the critical interpretation of the vision-temple were correct, it in no way affects the personality of Zadok, and certainly does not disprove his original connection with the priesthood or his descent from Eleazar.``192';
isbe[9298]='Zaham`za\'-ham (zaham, meaning uncertain; Septuagint Codex Alexandrinus Zalam, Codex Vaticanus Rhoollam): A son of King Rehoboam (<a onClick="return mV(\'2Ch\',11,19);">2Ch 11:19</a>).``1';
isbe[9299]='Zain`za\'-in.`<a href="./study/isbe/search.html?string=ZAYIN">ZAYIN</a>`1';
isbe[9300]='Zair`za\'-ir (tsa\'ir; Zeior): When he invaded Edom, we are told that Joram passed over to Zair and all his chariots with him (<a onClick="return mV(\'2Ki\',8,21);">2Ki 8:21</a>). In the parallel passage (<a onClick="return mV(\'2Ch\',21,9);">2Ch 21:9</a>), "with his captains" (\'im sarayw) takes the place of "to Zair" (tsa\'irah), probably a copyist\'s corruption. The place has not been identified. Some have thought that Mt. Seir is intended; others that it means the town of Zoar. Conder suggested ez-Zuweirah, southeast of the Dead Sea. If Zoar lay in this direction, it is the way by which an invading army might enter Edom.``1';
