1-12:2</span>).<P>(b) The Canaanites (The <span class="noTag">Wisdom of Solomon 12:3-27</span>): The abominations of the worship and the divine punishment with the lessons this last teaches.<P>(2) Idolatry described and condemned (The <span class="noTag">Wisdom of Solomon 13-15</span<). These chapters form a unity in themselves, a digression from the historical survey closed with The <span class="noTag">Wisdom of Solomon 12:27 and continued in 16:1-19</span>. The digression may of course be due to the allusion in <span class="noTag">11:5-12</span> to the sins of the Egyptians and Canaanites. Kinds of idolatry:<P>(a) Nature-worship (fire, wind, air, water, heavenly bodies), due often to sincere desire to find out God (<span class="noTag">13:1-9</span>);<P>(b) worship of idols in animal form, a much grosset sin (<span class="noTag">13:10-19</span>);<P>(c) God\'s indignation against all forms of idolatry (<span class="noTag">14:1-11</span>);<P>(d) origin of image-worship (<span class="noTag">14:15-21</span>); the father mourning for his deceased son makes an image of him and then worships it (<span class="noTag">14:15</span>); rulers are often flattered and then deified (<span class="noTag">14:16f</span>); artists often make images so attractive as to tempt men to regard them as gods (<span class="noTag">14:18-21</span>);<P>(e) immoral results of idolatry: "The worship of idols...a beginning and cause and end of every evil" (<span class="noTag">14:27</span>) (<span class="noTag">14:22-31</span>);<P>(f) Israel was free from idolatry and in consequence enjoyed the divine favor (<span class="noTag">15:1-5</span>);<P>(g) the folly of idolatry: the image man made less capable than man its maker and worshipper; the Egyptians the worst offenders (<span class="noTag">15:6-19</span>).<P>(3) In five different respects the fortunes of Egypt and Israel in the past are contrasted, Nature using similar means to punish the Egyptians and to reward the Israelites (The <span class="noTag">Wisdom of Solomon 16-19:22</span>), namely, in respect of the following:<P>(a) animals, quail (The <span class="noTag">Wisdom of Solomon 16:1-4</span>) and fiery serpents (The <span class="noTag">Wisdom of Solomon 16:5-14</span>) (The <span class="noTag">Wisdom of Solomon 16:1-14</span>);<P>(b) fire and water, heat and cold (The <span class="noTag">Wisdom of Solomon 16:15-29</span>);<P>(c) light and darkness (The <span class="noTag">Wisdom of Solomon 17:1-18:4</span>);<P>(d) death (The <span class="noTag">Wisdom of Solomon 18:5-25</span>);<P>(e) passage of the Red Sea (The <span class="noTag">Wisdom of Solomon 19:1-22</span>).<P>IV. Literary Form.<P>There is not so much manifest poetry in this book as in Sirach, though there is large amount of genuine poetry characterized by parallelism, but not by meter in the ordinary sense of the term. In parts of the book, which must be pronounced prose, parallelism is nevertheless often found (see The <span class="noTag">Wisdom of Solomon 10:1ff</span>). There are far fewer epigrammatic sentences in Wisdom than in Sirach, but on the other hand there is a far greater number of other rhetorical devices, assonances (The <span class="noTag">Wisdom of Solomon 1:10; 4:2; 5:15; 7:13</span>), alliterations (The <span class="noTag">Wisdom of Solomon 2:23; 5:12, 18; 6:11; 12:15</span>), antitheses (The <span class="noTag">Wisdom of Solomon 13:18f</span>), etc. See for details Speaker\'s Apocrypha (Farrar), I, 404ff.<P>V. Unity and Integrity.<P>Nearly all writers on the book believe it to be one homogeneous whole, the work of one mind. They point for proof to the fact that the whole book is a consistent whole directed against the two evils, apostasy and idolatry; that the language is from beginning to end uniform, such as one writer would be likely to employ.<P>For a statement of contrary views and a reply to them see the Commentary of Grimm, pp. 9-15. Until about the middle of the 18th century no doubt had been expressed as regards the unity of the book.<P>(1) Houbigant (Notae criticae in universos New Testament libros,1777,169) divided the book into two parts: The <span class="noTag">Wisdom of Solomon 1-9</span> written by Solomon in Hebrew, The <span class="noTag">Wisdom of Solomon 10-19</span> composed in Greek at a later time, perhaps by the translation into Greek of chapters 1-9. Against the Solomonian authorship see VIII, below, and against a Hebrew original see X, below. Doederlein adopted Houbigant\'s division of the book, denying, however, the authorship by Solomon.<P>(2) Eichhorn (Einleitung in das New Testament, 142ff) divided the book also into two parts: The <span class="noTag">Wisdom of Solomon 1-11 and 11:2-19</span>. He held that the whole was composed in Greek by two different writers or by the same writer at different times.<P>(3) Nachtigal (Das Buch der Welshelf, 1799) went much farther, holding that the book is nothing more than anthology, but he has had no followers in this.<P>(4) Bretschneider (De lib. Sap., 1804) ascribes the book to three principal authors and to a final editor.<P>The <span class="noTag">Wisdom of Solomon 1-6:8</span> was composed in Hebrew in the time of Antiochus Epiphanes (died 164 BC) by a Palestinian Jew, though it is an excerpt from a larger work; 6:9-10 is the work of an Alexandrian Jew, a contemporary of our Lord; The <span class="noTag">Wisdom of Solomon 11</span> was inserted by the final editor as seemingly necessary to connect parts 2 and 3; The <span class="noTag">Wisdom of Solomon 12-19</span> were written about the same time by a Jewish partisan of slender education and narrow sympathies.<P>Summary.<P>Perhaps, on the whole, the arguments in favor of the unity of the book outweigh those against it. But the evidence is by no means decisive. The Wisdom section (The <span class="noTag">Wisdom of Solomon 1:1-11:4</span>) is a much finer bit of writing than the rest of the book, and it bears the general characteristics of the Wisdom literature. Yet even within this larger unity <span class="noTag">The Wisdom of Solomon 6-9</span> stand out from the rest, since only in them is Solomon made to speak in the first person (compare <a onClick="return mV(\'Ecc\',1,12);">Ec 1:12</a>ff); but these four chapters agree with the rest of the Wisdom section in other respects. Within the historical section (The <span class="noTag">Wisdom of Solomon 11:5-19:22</span>) The <span class="noTag">Wisdom of Solomon 13-15</span> stand together as if a separate treatise on idolatry (see III, above), though if originally independent an editor has logically joined chapter 15 to chapter 12; compare "for" (gar), "etc." (<span class="noTag">13:1</span>). Indeed the book in its present form is made at least externally one, though it is not absolutely certain whether or not this external unity is due to editorial revision. Some scholars have maintained that the book as it stands is a torso (so Eichhorn, etc.). Calmer infers this from the fact that the historical sketch closes with the entrance of the Israelites into Canaan. Others say that the writer\'s sketch was cut short by some unforeseen event (Grotius, Eichhorn), or that the remainder of the once complete work has been lost in transmission (Heydenreich). But on the other hand it must be remembered that the writer\'s record is limited by his purpose, and that the history of the Egyptians supplies an admirable and adequate illustration of the wickedness and calamitous results of unfaithfulness to God and His law.<P>VI. Teaching.<P>In the treatment of this section it is assumed with some hesitation that the book is throughout the work of one man. The following is a brief statement of the teaching of this book concerning theology, anthropology, deontology, martiology, soteriology, and eschatology.<P>1. Theology:<P>Theology in the strict sense, i.e. the doctrine about God: God is incomparably powerful (The <span class="noTag">Wisdom of Solomon 11:21f</span>), omni-present (The <span class="noTag">Wisdom of Solomon 1:7; 12:1</span>) and all-loving (The <span class="noTag">Wisdom of Solomon 11:24</span>). He made the world out of formless matter (The <span class="noTag">Wisdom of Solomon 11:17</span>, the doctrine of the Alexandrian Judaism). He did not create the world out of nothing as the Old Testament (<a onClick="return mV(\'Gen\',1,1);">Ge 1:1</a>) and even Sirach teach (see <a href="./study/isbe/search.html?string=SIRACH,+BOOK+OF">SIRACH, BOOK OF</a>, IV, 1). The author\'s highest conception of creation is the conversion of chaos into cosmos. It is the order and beauty of the universe that amaze the writer, not the stupendous power required to make such a universe out of nothing (The <span class="noTag">Wisdom of Solomon 11:20; 13:3</span>). Though God is said to be just (The <span class="noTag">Wisdom of Solomon 12:15</span>), kind (The <span class="noTag">Wisdom of Solomon 1:13; 11:17-26; 12:13-16; 15:1; 16:7</span>), and is even addressed as Father (The <span class="noTag">Wisdom of Solomon 14:3</span>), yet He is in a unique sense the Favorer and Protector of Israel (The <span class="noTag">Wisdom of Solomon 16:2; 18:8; 19:22</span>); yet according to The <span class="noTag">Wisdom of Solomon 12:2-20</span> even the calamities He heaps up upon the foes of Israel were designed to lead them to repentance (<span class="noTag">12:2-20</span>), though in The <span class="noTag">Wisdom of Solomon 11</span>f we are clearly taught that while the sufferings of the Israelites were remedial, those of their enemies were purely penal. The conception of God in Wisdom agrees on the whole with that of Alexandrian Judaism (circa 100 BC); i.e. it lays principal stress on His transcendence, His infinite aloofness from man and the material world. We have therefore in this book the beginning of the doctrine of intermediaries which issued in Philo\'s Powers, the media through which the Absolute One comes into definite relation with men.<P>(1) Spirit of the Lord.<P>In Wisdom as in the later books of the Old Testament (exilic and post-exilic), the expression "the Spirit of the Lord" denotes the person of God. What God does is done by the Spirit. Thus, it is His Spirit that fills and sustains the world, that observes all human actions (The <span class="noTag">Wisdom of Solomon 1:7</span>f), that is present everywhere (The <span class="noTag">Wisdom of Solomon 12:1</span>). Wisdom does not hypostatize "the Spirit of the Lord," making it an intermediary between God and His creatures, but the way is prepared for this step.<P>(2) Wisdom.<P>Much that is said of the Spirit of the Lord in this book is said of Wisdom, but much more, and there is a much closer approach to hypostatization in the case of Wisdom. At the creation of the world Wisdom was with God (compare <a onClick="return mV(\'Pro\',8,\'22-31\');">Pr 8:22-31</a>), sat by His throne, knew His thoughts and was His associate (The <span class="noTag">Wisdom of Solomon 8:3; 9:4,9</span>), made all things, taught Solomon the Wisdom for which he prayed (The <span class="noTag">Wisdom of Solomon 7:22</span>); all powerful, seeing all things (The <span class="noTag">Wisdom of Solomon 7:23</span>), pervading all things (The <span class="noTag">Wisdom of Solomon 7:24</span>), an effluence of the glory of the Almighty (The <span class="noTag">Wisdom of Solomon 7:25</span>); she teaches sobriety, understanding, righteousness and courage (The <span class="noTag">Wisdom of Solomon 8:7</span>, the four cardinal virtues of the Stoic philosophy). For detailed account of the conception of Wisdom in this book see <a href="./study/isbe/search.html?string=WISDOM">WISDOM</a>.<P>(3) The Logos.<P>In Philo the Logos is the intermediary power next to Deity, but in Wisdom the term keeps to the Old Testament sense, "word," that by which God addresses men. It never means more, though some hold (Gfrorer, Philo, etc., I 225ff) that in <span class="noTag">The <span class="noTag">Wisdom of Solomon 9:1f; 12:9; 16:12; 18:22</span>, Logos has the technical sense which it bears in Philo; but a careful examination of the passages shows that nothing more than "word" is meant (see <a href="./study/isbe/search.html?string=LOGOS">LOGOS</a>). The only other superhuman beings mentioned in the book are the gods of the Gentiles which are distinctly declared to be nonentities, the product of man\'s folly (<span class="noTag">14:13f</span>), and the Devil who is, however, but once referred to as identical with the serpent of <a onClick="return mV(\'Gen\',3,\'1-\');">Ge 3</a>. The book does not once speak of a Canon of Scripture or of any divine revelation to man in written form, though it often quotes from the Pentateuch and occasionally from Isaiah and Psalms, never, however, naming them. Wisdom is thus much more universalistic and in harmony with Wisdom literature than Sirach, which identifies Wisdom with the Law and the Prophets and has other distinctly Jewish features.<P>2. Anthropology:<P>In its psychology Wisdom follows the dichotomy of Platonism. Man has but two parts, soul and body (The <span class="noTag">Wisdom of Solomon 1:4; 8:19f; 9:15</span>), the word soul (psuche) including the reason (nous) and the spirit (pneuma). The <span class="noTag"Wisdom of Solomon 15:11</span> is the only passage which seems to teach the doctrine of the trichotomy of man, but in reality it does nothing of the kind, for the parallelism shows that by "soul" and "spirit" the same thing is meant. Philo teaches the same doctrine (see Drummond, Philo, etc., I, 316ff). Man\'s soul is breathed into the body (<span class="noTag">15:11</span>; compare <a onClick="return mV(\'Gen\',2,7);">Ge 2:7</a>) and taken back again by God (<span class="noTag">15:8</span>). The writer adopts the Platonic theory of the pre-existence of souls (<span class="noTag">8:20</span>; compare <span class="noTag">15:8,11,16</span>), which involves the belief in a kind of predestination, for the previous doings of the soul determine the kind of body into which it enters. Solomon\'s soul, being good, entered an undefiled body (<span class="noTag">8:20</span>). R. H. Charles (Eschatology, etc., 254f) is hardly correct when he says that according to Wisdom (<span class="noTag">1:4; 9:15</span>, etc.) matter is inherently sinful. This doctrine was definitely taught by Philo, who accepted Heraclitus\' epigram, soma sema, "The body is a tomb." So it is said (<span class="noTag">12:10; 13:1</span>) that man is by nature evil, his wickedness being inborn. But if he sins it is his own affair, for he is free (<span class="noTag">1:16; 5:6,13</span>). The writer borrows two words from Greek poetry and philosophy which appear to involve a negation of human freedom, namely, anake, "necessity" and dike "justice" "avenging justice". The first blinds the eyes of the ungodly (<span class="noTag">17:17</span>), but the blindness is judicial, the result of a course of evil (see <span class="noTag">19:1-5</span>). The second term is used in Greek philosophy in the sense of nemesis, and it has that sense in The <span class="noTag">Wisdom of Solomon 1:8</span>, etc. But throughout this book it is assumed that punishment for sin is deserved, since man is free. The author of Wisdom believes in a twofold division into good (wise) and bad (ungodly), and, unlike the writers of the later parts of the Old Testament, he holds it possible for a person to pass from one class into another. But does not God, according to parts of Wisdom, as of the Old Testament, appear to show undue favoritism to Israel and neglect of other people? Thus Israel is "God\'s Son" (<span class="noTag">18:13</span>), His children (sons, <span class="noTag">12:19,21; 16:10,26</span>), His sons and daughters (<span class="noTag">9:7</span>). They are His holy and elect ones (<span class="noTag">3:9; 4:15; and especially 10:17; 18:1,5</span>). But the Israelites were treated as they were, not because they were Israelites, but because they were morally better than the nations around (see Drummond, op. cit., II, 207ff).<P>3. Deontology:<P>Under the term "deontology" here, religious and ethical practice is included.<P>(1) As might be expected in a Wisdom book, little importance is attached to the Law of Moses and its requirements. Though historical allusions are made to the offering of sacrifices, the singing of psalms and the taking upon themselves of the obligation of the covenant of the Law (The <span class="noTag">Wisdom of Solomon 18:9</span>); though, moreover, reference is made to the offering of incense by Aaron (The <span class="noTag">Wisdom of Solomon 18:21</span>), and Solomon is made to utter the words "temple," "altar," "tabernacle" (The <span class="noTag">Wisdom of Solomon 9:8</span>), yet in other respects nothing is said of the temple and its feasts, of the priesthood, of sacrifice, or of the laws of clean and unclean. Yet the duty of worshipping the one true God and Him only and the evil results of worshipping idols are strongly and constantly insisted upon, especially in the second or historical part of the book (The <span class="noTag">Wisdom of Solomon 11:5</span> to end).<P>(2) The cardinal virtues inculcated are those of the Stoic philosophy, namely, prudence (sophrosune), common-sense (phronesis), justice dikaiosune) and courage (andreia), showing that the writer was influenced by the philosophy of the Greeks.<P>4. Hamartiology:<P>As a historical fact, the writer adopts the account in <a onClick="return mV(\'Gen\',3,\'1-\');">Ge 3</a> of the entrance of sin into the world. "By the envy of the Devil, death (i.e. as the connection proves, spiritual death) entered into the world" (The <span class="noTag">Wisdom of Solomon 2:24</span>). In The <span class="noTag">Wisdom of Solomon 14:27</span>, however, sin is made to have its root in idolatry, meaning perhaps that all sin consists in not giving-proper heed to the one true God, and that the moral monstrosities of his time were outgrowths of idolatrous worship. The freedom of the will is taught explicitly or implicitly throughout the book (see above VI, 2).<P>5. Soteriology:<P>The book is silent as to a Messiah who shall deliver his people. It is Wisdom that saves man: "Because of her I shall have immortality" (The <span class="noTag">Wisdom of Solomon 8:13</span>); immortality lies in kinship to Wisdom (The <span class="noTag">Wisdom of Solomon 8:17</span>); all who give heed to the commands of Wisdom have the assurance of incorruption, and incorruption brings men near to God (The <span class="noTag">Wisdom of Solomon 6:18f</span>). The knowledge of God\'s power is the root of immortality (The <span class="noTag">Wisdom of Solomon 15:2</span>).<P>6. Eschatology:<P>The doctrine of individual immortality is explicitly taught in this book. Man (= all men) was created for incorruption (The <span class="noTag">Wisdom of Solomon 2:23; 6:19; 12:1</span>). The righteous have the full hope of immortality (The <span class="noTag">Wisdom of Solomon 3:4</span>) and shall live forever (The <span class="noTag">Wisdom of Solomon 5:15</a>). When the wicked die they have no hope (The <span class="noTag">Wisdom of Solomon 3:18</span>), since they suffer for their sins in this present world as well as in that which is to come (The <span class="noTag">Wisdom of Solomon 3:16,18</span>). The doctrine of a resurrection of the body is not taught. If the author accepted Philo\'s doctrine of the inherent sinfulness of matter (see above VI, 2), as R. H. Charles holds, he could not believe in a bodily resurrection. After death there is to be a day of decision (diagnosis, the word used in <a onClick="return mV(\'Act\',25,21);">Ac 25:21</a>; see The <span class="noTag">Wisdom of Solomon 3:18</span>); there will be an examination (exetasis) into the counsels of the ungodly. The sins of the wicked shall be reckoned up (The <span class="noTag">Wisdom of Solomon 4:20</span>), but the righteous man shall stand in great boldness before the face of them that afflicted him (The <span class="noTag">Wisdom of Solomon 5:1</span>). The teaching of the book as to the future of the righteous does not seem to be consistent. According to The <span class="noTag">Wisdom of Solomon 3:1</span>ff, the righteous pass at death immediately into the bliss of God; but the teaching of <span class="noTag">4:20</span>f is that the wicked and the righteous shall be assembled in one place to receive their sentence.<P>VII. Aim.<P>The writer\'s purpose appears to have been to recommend to his fellow-countrymen in Alexandria the claims of religion under the names of Wisdom, Righteousness, etc., and to warn them against falling into the idolatry of the Egyptians. In addition to glorifying Wisdom, he gives an ironical account of the rise of idolatry, and he uses strong language in pointing out the disastrous consequences in this world and the next of a life away from the true God (see above, III). The book is ostensibly addressed to rulers, but they are mentioned only in The <span class="noTag">Wisdom of Solomon 6:1-11,20-25</span>, and the appeal of the book is to men as such. In addressing rulers the author uses a rhetorical device. It might be argued that if rulers with their superior advantages need such exhortations and warnings, how much more ordinary men!<P>Plumptre (Ecclesiastes, 70) and Siegfried (HDB, iV, 928) contend that the Solomon of this book is made to answer the Solomon of Ecclesiastes. But the author does not show any acquaintance with Ecclesiastes, and it is hardly likely that this last book was known at the time in Alexandria, for though composed about 200 BC, it was not put into Greek for a long time afterward. Besides, there is nothing about idolatry in Ecclesiastes. The conclusion reached in the genuine parts of this last book is a counsel of despair: "All is vanity." A reply to that book would seek to show that life is worth living for the sake of the present and the future. The Book of Wisdom denounces idolatry in the most scathing language: how can this and the like be a polemic against Ecclesiastes?<P>VIII. Author.<P>The author was an Alexandrian Jew, well read in the Septuagint whose phrases he often uses, fairly acquainted with Greek philosophy as taught at Alexandria and also with physical science as known at the time (see The <span class="noTag">Wisdom of Solomon 7:17-20; 8:8</span>). He was beyond all doubt a Jew, for the views he advocates are those of an enlightened but strong Judaism; his interests are even narrowly Jewish (note the fiercely anti-Gentile sentiments of The <span class="noTag">Wisdom of Solomon 11:10-13,17-23</span>), and his style is largely tinged by the vocabulary and the phraseology of the Greek version of the Hebrew Scriptures. That he was an Alexandrian or at least an Egyptian Jew is equally probable. No Palestinian could have written the language of this work with its rhetorical devices (see above, IV), or have displayed the acquaintance which the book reveals with Greek philosophy as modified by Jewish-Alexandrian thought.<P>Other Views.<P>These include: (1) that Solomon is the author: see above, II. No modern scholar takes this view seriously, though singularly enough it has been revived by D. S. Margoliouth;<P>(2) that Zerubbabel is the author (J. M. Faber);<P>(3) that the author was one of the translators of the Septuagint;<P>(4) that the author belonged to the Therapeutae: so Gfrorer (Philo, II, 265), Dahne (Philo, II, 270); compare Jost (Geschichte des Judaismus, I, 378). This has been inferred from The Wisdom of Solomon 16:28, the Therapeutae being, it is said, a Jewish sect which, like the Zarathustrians, worshipped toward the rising sun. But we know very little about this sect, and there is no decisive evidence that it ever existed. If, however, Eusebius (Historia Ecclesiastica, II, 17) is right in saying that Philo\'s Therapeutae were Christians (the earliest Christian sect of Alexandria), it is clear that no member of this sect wrote Wisdom, for the book is wholly free from Christian influence;<P>(5) that Ben Sira is the author (Augustine);<P>(6) that Apollos is the author: so Noack (Der Ursprung des Christenthums, I, 222); Plumptre (Expositor, I, 329ff, 409ff); see summary of grounds in Speaker\'s Apocrypha (Farrar), I, 413ff; but the author must have been a Jew and he wrote too early to allow of this hypothesis;<P>(7) that Philo is the author: thus Jerome writes (Praef. in lib. Sol.): Nonnulli scriptorum hunt ease Judaei Philonis affirmant. This view was supported by Luther and other scholars; compare the Muratorian Fragment (in Zahn\'s text) in XI, below. But the teaching of this book represents an earlier stage of Alexandrian Jewish speculation than that found in Philo\'s works, and the allegorical method of interpretation so rampant in the latter is almost wholly absent from Wisdom.<P>(8) It has been held by some (Kirschbaum, Weisse, etc.) that whoever the author was he must have been a Christian, but the whole trend and spirit of the book prove the contrary.<P>IX. Date.<P>1. Literary:<P>The book was probably composed about 120-100 BC. The evidence is literary, historical and philosophical. The book must have been written after the Septuagint version of the Pentateuch and Isaiah had been made, since the author has evidently used this version of both books and perhaps of the Psalms as well (compare <span class="noTag">The Wisdom of Solomon 3:1</span> and <a onClick="return mV(\'Psa\',31,5);">Ps 31:5(6)</a>; and also The <span class="noTag">Wisdom of Solomon 15:15</span>f and <a onClick="return mV(\'Psa\',115,\'4-7\');">Ps 115:4-7</a> (=<a onClick="return mV(\'Psa\',135,\'15-18\');">Ps 135:15-18</a>)). Now we know from Sirach (Prolegomena) that the Septuagint of the Pentateuch, the Prophets and of at least a portion of the Writings (Hagiographa) was completed by 132 BC, when the younger Siracide finished his translation of Sirach (see <a href="./study/isbe/search.html?string=SIRACH,+BOOK+OF">SIRACH, BOOK OF, VIII</a>). It may therefore be inferred that Wisdom was written after 132 BC. Moreover, in The <span class="noTag">Wisdom of Solomon 4:1</span> the author shows an acquaintance with Sirach 16:1-4 in Greek, for the pseudo-Solomon does not seem to have known Hebrew, or he would sometimes at least have quoted from the Hebrew text. This confirms the conclusion drawn from the use of the Septuagint that this book is at least as late as, say, 130 BC, and almost certainly later. The book was composed earlier than any of the New Testament writings, or some of the latter would have been quoted or referred to. Moreover, it may be assumed that the Greek Canon was complete in the time of our Lord, and thus included Wisdom as well as the rest of the Old Testament Apocrypha. But see International Journal of Apocrypha, October, 1913, p. 77, article by the present writer. It must have taken a long time after writing for the book to gain the respect which secured its canonization. A date 100 BC agrees with all the facts.<P>2. Historical:<P>The <span class="noTag">Wisdom of Solomon 3:1; 5:1; 6:5-9</span> imply that at the time of writing the Jews addressed were suffering under the lash of persecution, and we have the resulting feeling of, animosity against the Egyptians, the persecuting power, expressed in <span class="noTag">11:16-19</span>. Now we know that the early Ptolemies treated the Jews with consideration, and Ptolemy VII (Physcon, 145-117 BC) was the first to adopt a contrary policy toward the Jews of Egypt, owing to the support they had given to Cleopatra. Josephus (Apion, II, 5) gives an account of the vengeance which this king wreaked upon the Jews of Alexandria at this time. Nevertheless, the literary manner and the restrained spirit with which these matters are referred to show that the writer is describing a state of things which belongs to the past, though to a recent past. A date about 100 BC would admirably suit the situation of the author at the time of composition.<P>3. Philosophical:<P>The teaching of the book (see above, VI) belongs to that stage in the development of Alexandrian Judaism which existed about 100 BC. We have not in this book the allegorization characteristic of Philo (born 20 BC, died 40 AD), nor had his Logos doctrine as yet become a part of the creed of Alexandrian Jews.<P>X. Original Languages.<P>Scholars are practically agreed that the book was composed in Greek D. S. Margoliouth attempted to prove a Hebrew original (Journal of the Royal Asiatic Society,1890,263-97; see reply by Freudenthal, JQR, III, 722-53), but the evidence he offers has convinced nobody.<P>(1) The Greek of Wisdom is free, spontaneous and idiomatic. There are a few Hebraisms, but only such as characterize Hellenistic Greek in general; Wisdom is very different in this from Sirach which abounds with Hebraisms, due no doubt to translation from a Hebrew original.<P>(2) The rhetorical devices so common in the Greek of the book can be due only to the original text; they could hardly occur in such profusion in a translation. In addition to those mentioned above in IV, note the Greek rhetorical figures chiasmus (The <span class="noTag">Wisdom of Solomon 1:1-4:8; 3:15</a>) and sorites (The <span class="noTag">Wisdom of Solomon 6:7-20</span>).<P>(3) The translation of Sirach into Hebrew before the discovery of the Hebrew fragments had been often attempted and found comparatively easy; but it is very difficult to put Wisdom into Hebrew because the style is so thoroughly Greek.<P>(4) No trace of a Hebrew original has thus far been found. What Nachmanides saw was not the original Hebrew, but a translation in Hebrew from the original text. Jerome (Praef. in lib. Sol.) says that though he had himself seen Sirach in Hebrew, a Hebrew text of Wisdom was not to be found.<P>XI. Use of Wisdom by Christian Writers.<P>It has been thought that the following parts of the New Testament have been influenced by Wisdom: <a onClick="return mV(\'Luk\',2,7);">Lu 2:7</a> (compare The <span class="noTag">Wisdom of Solomon 7:4</span>); <a onClick="return mV(\'Luk\',12,20);">Lu 12:20</a> (compare The <span class="noTag">Wisdom of Solomon 15:8</span>); <a onClick="return mV(\'Luk\',9,31);">Lu 9:31</a> (compare The <span class="noTag">Wisdom of Solomon 3:2</span>); <a onClick="return mV(\'Luk\',19,44);">Lu 19:44</a> (compare <span class="noTag">The Wisdom of Solomon 3:7</span>). The Logos doctrine of John (see <a onClick="return mV(\'Jhn\',1,1);">Joh 1:1</a>, etc.) has certainly a connection with the doctrine of Wisdom in Wisdom (see Gregg, Commentary, livff). Grafe (Theologische Abhandlungen, Freiburg in B., 1892) endeavors to prove that Paul made large use of Wisdom (see also Sanday and Headlam, Romans, 51f; 267-69); but this has been denied; see further Dearie (Commentary, 15ff). The book was certainly known to Clement of Rome, Tatian, Irenaeus, Tertullian, Clement of Alexandria and Hippolytus. The Muratorian Fragment states the work to have been "composed by the friends of Solomon in his honor" (ll. 69-71). Zahn (Gesch. Kan., II,101,following a suggestion of Tregelles) prefers to read "composed by Philo in Solomon\'s honor"—an easy change in the Greek (philonos for philon). Origen (Contra Celsus, v.29) calls it "the work entitled Wisdom of Solomon," so intimating doubt as to the authorship.<P>XII. Text and Versions.<P>The text in Codex Vaticanus pointed with collations in Swete\'s Old Testament in Greek, is on the whole the best, though both Codex Sinaiticus and Codex Ephraemi (which is incomplete) have good texts, Codex Alexandrinus being fairly trustworthy. The text is found also in fair preservation in many cursives.<P>1. Latin:<P>The Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) is identical with, but has slight variations from, the Old Latin Lagarde (Mittheilungen, 243-86) gives the Latin version of Sirach and Wisdom found in Codex Amiaut. This last is a literal rendering from the Greek.<P>2. Syriac:<P>The Syriac (Peshitta) version found in the London Polyglot and in Lagarde (Lib. Apocrypha Syr) was made immediately from the Greek, but apparently from the text in Codex Alexandrinus or in one like it.<P>LITERATURE.<P>Besides the works cited in the course of the foregoing article and the general works (commentaries, etc.) on the Apocrypha mentioned under <a href="./study/isbe/search.html?string=APOCRYPHA">APOCRYPHA</a> (which see), the following are to be noted:<P>(1) Commentaries: Bauermeister, Commentary in Sap. Sol. libr., 1828; Grimm, Komm. uber das Buch der Weisheit, 1857, also his excellent commentary in the Kurzgefasstes exegetisches Handbuch, series 1860; J.H. Schmid, Das Buch der Welsheit: Uebersetzt und erklart, 1857; Gutberlet, Das Buch der Weisheit, 1874; W. J. Deane, The Book of Wisdom, Greek Vulgate and the King James Version with "Commentary." (1881, full and fairly scholarly); Speaker\'s Apocrypha (Farrar) is interesting and often helpful; Siegfried\'s "Introduction" and "Commentary" in Kautzsch\'s Die Apocrypha is slight, but also often helpful; The Wisdom of Solomon by J. A. E. Gregg (the Revised Version (British and American) with "Introduction" and "Commentary," Cambridge Bible) is brief and popular, but trustworthy; A. T. S. Goodrick, The Book of Wisdom, 1913 (admirable); S. Holmes (in the Oxford Apocrypha, with Introduction and Comm.).<P>(2) Of the dict. arts., that in Encyclopedia Biblica (by C. H. Toy) is perhaps the best; that in HDB (Siegfried) is fair but defective.<P>(3) In addition to the works by Gfrorer and Dahne discussing the philosophy of the book, the following works may be mentioned: Bruch, Weisheits-Lehre der Hebraer, 1851 (322-78); Zeller, Die Philosophic der Griechen (1881), III, part 2, 271-74, 4th edition, 272-96; Kubel, "Die ethischen Grundanschauungen der Weisheit Salomos," in Theologische Studien und Kritiken, 1865, 690-722; Menzel, Der griechische Einfluss auf Prediger und Weisheit Salomos,1889,39-70; Bois, Essai sur les origines de la philosophic judeo-alexandrine, 1890, 211-309, 337-412. The work by Drummond, often quoted, has been carefully done and is interestingly written (Philo Judaeus,1888,2 volumes; see I, 177-229).<P>For detailed bibliography see Schurer, GJV4, 1909, III, 508ff; HJP,1886, II, 3, pp. 236f; is necessarily very defective.``33';
isbe[9224]='Wise Men`wiz\'-men: In addition to the uses of "wise" specified in the article <a href="./study/isbe/search.html?string=WISDOM">WISDOM</a>, the adjective is employed occasionally as the technical description of men who are adepts in magic, divination, etc. (e.g. in <a onClick="return mV(\'Gen\',41,8);">Ge 41:8</a>; <a onClick="return mV(\'Exd\',7,11);">Ex 7:11</a>; <a onClick="return mV(\'Est\',1,13);">Es 1:13</a>; <a onClick="return mV(\'Dan\',2,27);">Da 2:27</a>; <a onClick="return mV(\'Dan\',5,15);">5:15</a>). Naturally, however, in the ancient world the boundary between genuine knowledge and astrology, etc., was exceedingly vague, and it was never denied that real knowledge could be gained along lines that we know to be futile. So the initiation of Moses into all the wisdom of the Egyptians (<a onClick="return mV(\'Act\',7,22);">Ac 7:22</a>) or of Daniel into all the learning of the Chaldeans (<a onClick="return mV(\'Dan\',1,4);">Da 1:4</a>) met with no disapproval. These great men could be trusted to avoid the moral and religious pitfalls of such pursuits. For the ordinary Israelites, however the uncompromising prohibition of idolatry closed the door definitely to all studies of this kind. See <a href="./study/isbe/search.html?string=ASTROLOGY">ASTROLOGY</a>; <a href="./study/isbe/search.html?string=DIVINATION">DIVINATION</a>, etc. And for the Wise-men of <a onClick="return mV(\'Mat\',2,1);">Mt 2</a> see <a href="./study/isbe/search.html?string=MAGI">MAGI</a>.``48';
isbe[9225]='Wise, Man`wiz.`<a href="./study/isbe/search.html?string=WISDOM">WISDOM</a>`1';
isbe[9226]='Wish`wish: The word appears both as a substantive and as a verb in the Old Testament, having a variety of meanings: (1) The substantive, peh, means "mouth" and also "speech." In this form it occurs in <a onClick="return mV(\'Job\',33,6);">Job 33:6</a> margin: "Behold, I am according to thy wish in God\'s stead." Elihu here refers to Job\'s expressed desire for an umpire (<a onClick="return mV(\'Job\',9,33);">9:33</A>), and one who would maintain his right with God (<a onClick="return mV(\'Job\',16,21);">16:21</A>). (2) The verb: (a) haphets, "willing," or "desirous" (<a onClick="return mV(\'Psa\',40,14);">Ps 40:14</a> the King James Version); (b) sha\'-al, "to ask," "petition," "supplicate" (<a onClick="return mV(\'Job\',31,30);">Job 31:30</a> the King James Version); (c) another variation of meaning is found in <a onClick="return mV(\'Psa\',73,7);">Ps 73:7</a> where maskith, "to imagine," is translated "wish": "They have more than heart could wish"; (d) euchomai, "to solicit," "to implore" (<a onClick="return mV(\'Rom\',9,3);">Ro 9:3</a>).``52';
isbe[9227]='Wist, Witty, Wot`wist, wit\'-i, wot: The verb "to wit" in the King James Version is interchangeable with "to know," and is conjugated with a present "wot," and a past "wist." This inflection is derived from more complicated forms in the older English, and in post-Elizabethan times has become quite obsolete. (But compare the roots in "wisdom," "witness.") "Wit," then, is simply "knowledge," and "witty" is "having knowledge," although the noun and the adjective have become narrowly specialized in modern English (compare the similar evolution of "knowing," in its use as an adjective). Even in Elizabethan English, however, the indicative of "to wit" was becoming displaced by "know," and "wot" and "wist" together occur only 24 times in the King James Version (not at all in Apocrypha). the English Revised Version has retained all the New Testament examples, but in the Old Testament has altered about half the occurrences to "know," but has followed no discoverable rule in so doing ("wot" retained only in <a onClick="return mV(\'Jos\',2,5);">Jos 2:5</a>). the American Standard Revised Version has changed to "know" throughout (Old Testament and New Testament). The infinitive "to wit" is still in use (chiefly in legal formulas) before an apposition, and the King James Version has introduced it rather frequently to clarify a construction (<a onClick="return mV(\'Jos\',17,1);">Jos 17:1</a>; <a onClick="return mV(\'1Ki\',2,32);">1Ki 2:32</a>, etc.), and the Revised Version (British and American) has usually retained it (omitted in <a onClick="return mV(\'Jos\',17,1);">Jos 17:1</a>; <a onClick="return mV(\'2Ch\',4,12);">2Ch 4:12</a>). In the other uses of this inf. (<a onClick="return mV(\'Gen\',24,21);">Ge 24:21</a>; <a onClick="return mV(\'Exd\',2,4);">Ex 2:4</a>) it is replaced by "to know," while the very obsolete expression in <a onClick="return mV(\'2Cr\',8,1);">2Co 8:1</a>, the King James Version "We do you to wit" (i.e. "We cause you to know"; see Do), has become in the Revised Version (British and American) "We make known unto you."<P>The noun "wit" is found in <a onClick="return mV(\'Psa\',107,27);">Ps 107:27</a>, "at their wits\' (the King James Version "wit\'s") end," for chokhmah, "wisdom," "technical skill"; compare the Revised Version margin "All their wisdom is swallowed up." The meaning is "their skilled seamanship cannot cope with the danger" (the phrase is very commonly misapplied). "Wit" occurs also 1Esdras 4:26 (dianoia, "mind"); 2Esdras 5:9 (sensus, here "intelligence"); Sirach 31:20 (psuche, "soul," with the force of "reason").<P>Witty is found in the King James Version, the Revised Version margin <a onClick="return mV(\'Pro\',8,12);">Pr 8:12</a>, "witty inventions" (mezimmah, "discretion" (so the Revised Version (British and American)); if "and" is not read in this verse, translate "discrete knowledge"). In Judith 11:23 occurs "witty in thy words" (agathos, "good," here probably = "thou hast spoken sound sense"). <span class="NoTag">The Wisdom of Solomon 8:19</span> the King James Version has "a witty child," the Revised Version (British and American) "a child of parts," margin "goodly" (euphues, "well grown," "of a good disposition," "clever"). "Wittingly" occurs in <a onClick="return mV(\'Gen\',48,14);">Ge 48:14</a> (sakhal, "act intelligently").``48';
isbe[9228]='Witch; Witchcraft`wich, wich\'-kraft:<P>1. Meaning and Use of the Words<P>2. Biblical Usage<P>3. Common Elements in Witchcraft and Ancient Oriental Magic<P>4. Rise, Spread and Persecution of Witchcraft<P>LITERATURE<hr /><P>1. Meaning and Use of the Words:<P>The word "witch" seems to denote etymologically "one that knows." it is historically both masculine and feminine; indeed the Anglo-Saxon form wicca, to which the English word is to be traced, is masculine alone. "Wizard" is given as masculine for witch, but it has in reality no connection with it. Wright (English Dialect Dictionary, VII, 521) says he never heard an uneducated person speak of wizard. When this word is used by the people it denotes, he says, a person who undoes the work of a witch. Shakespeare often uses "witch" of a male (compare Cymbeline, I,6, l. 166: "He is...a witch"). In Wycliff\'s translation of <a onClick="return mV(\'Act\',8,9);">Ac 8:9</a> Simon Magus is called "a witch" ("wicche"). Since the 13th century the word "witch" has come more and more to denote a woman who has formed a compact with the Devil or with evil spirits, by whose aid she is able to cause all sorts of injury to living beings and to things. The term "witchcraft" means in modern English the arts and practices of such women.<P>2. Biblical Usage:<P>Since the ideas we attach to "witch" and "witchcraft" were unknown in Bible times, the words have no right place in our English Bible, and this has been recognized to some extent but not completely by the Revisers of 1884. The word "witch" occurs twice in the King James Version, namely, (1) in <a onClick="return mV(\'Exd\',22,18);">Ex 22:18</a>, "Thou shalt not suffer a witch (the Revised Version (British and American) "a sorceress") to live"; (2) in <a onClick="return mV(\'Deu\',18,10);">De 18:10</a>, "or a witch" (the Revised Version (British and American) "or a sorcerer"). The Hebrew word is in both cases the participle of the verb (kishsheph), denoting "to practice the magical article." See <a href="./study/isbe/search.html?string=MAGIC">MAGIC</a>, V, 2. In the first passage, however, the feminine ending (-ah) is attached, but this ending denotes also one of a class and (on the contrary) a collection of units; see Kautzsch, Hebrew Grammar 28, section 122, s, t.<P>The phrase "the witch of Endor" occurs frequently in literature, and especially in common parlance, but it is not found in the English Bible. The expression has come from the heading and summary of the King James Version, both often so misleading. In <a onClick="return mV(\'1Sa\',28,\'1-\');">1Sa 28</a>, where alone the character is spoken of, English Versions of the Bible translates the Hebrew \'esheth ba\'alath \'obh by "a woman that hath a familiar spirit." A literal rendering would be "a woman who is mistress of an \'obh or ghost," i.e. one able to compel the departed spirit to return and to answer certain questions. This woman was therefore a necromancer, a species of diviner (see <a href="./study/isbe/search.html?string=DIVINATION">DIVINATION, IV</a>; <a href="./study/isbe/search.html?string=ENDOR,+WITCH+OF">ENDOR, WITCH OF</a>; <a href="./study/isbe/search.html?string=FAMILIAR">FAMILIAR</a>), and not what the term "witch" imports.<P>The word "witchcraft" occurs thrice in the King James Version in <a onClick="return mV(\'1Sa\',15,23);">1Sa 15:23</a>, "the sin of witchcraft" should be as in the Revised Version margin, "the sin of divination," the latter representing the Hebrew word qecem, generally translated "divination".<P>See <a href="./study/isbe/search.html?string=DIVINATION">DIVINATION</a>, sec. VII, 1.<P>The phrase "used witchcraft" (of Manasseh, <a onClick="return mV(\'2Ch\',33,16);">2Ch 33:16</a>) is properly rendered in the Revised Version (British and American) "practised sorcery," the Hebrew verb (kishsheph) being that whence the participles in <a onClick="return mV(\'Exd\',22,18);">Ex 22:18</a> and <a onClick="return mV(\'Deu\',18,10);">De 18:10</a>, translated in the King James Version "witch," are derived (see above). The word translated in the King James Version "witchcraft" in <a onClick="return mV(\'Gal\',5,20);">Ga 5:20</a> (pharmakeia) is the ordinary Greek one for "sorcery," and is so rendered in the Revised Version (British and American), though it means literally the act of administering drugs and then of giving magical potions. It naturally comes then to stand for the magician\'s art, as in the present passage and also in <span class="noTag">The Wisdom of Solomon 12:4; 18:13</span>; and in the Septuagint of <a onClick="return mV(\'Isa\',47,9);">Isa 47:9</a>, where it represents the Hebrew noun keshaphim, translated "sorceries"; compare the Hebrew verb kishsheph; see above.<P>The plural "witchcrafts" (in the King James Version and the Revised Version (British and American)) stands for the Hebrew noun just noticed (keshaphim) in <a onClick="return mV(\'2Ki\',9,22);">2Ki 9:22</a>; <a onClick="return mV(\'Mic\',5,12);">Mic 5:12</a>; <a onClick="return mV(\'Nah\',3,4);">Na 3:4</a>, but in all three passages a proper rendering would be "sorceries" or "magical arts." "Witchcrafts" is inaccurate and misleading.<P>The verb "bewitch" occurs in <a onClick="return mV(\'Act\',8,9,11);">Ac 8:9,11</a> the King James Version (of Simon Magus bewitching the people) and in <a onClick="return mV(\'Gal\',3,1);">Ga 3:1</a> ("O foolish Galatians, who hath bewitched you?"). In the first context the Greek verb is existemi, which is properly rendered by the Revisers "amazed"; in 3:13 the passive of the same verb is translated "he was amazed" (the King James Version "He wondered"). In <a onClick="return mV(\'Gal\',3,1);">Ga 3:1</a>, the verb is baskaubaino, which is used of a blinding effect of the evil eye and has perhaps an occult reference, but it has nothing whatever to do with "witch" or "witchcraft."<P>3. Common Elements in Witchcraft and Ancient Oriental Magic:<P>Though the conceptions conveyed by the English word "witch" and its cognates were unknown to the Hebrews of Bible times, yet the fundamental thought involved in such terms was familiar enough to the ancient Hebrews and to other nations of antiquity (Babylonians, Egyptians, etc.), namely, that there exists a class of persons called by us magicians, sorcerers, etc., who have superhuman power over living creatures including man, and also over Nature and natural objects. This power is of two kinds: (1) cosmic, (2) personal. For an explanation see <a href="./study/isbe/search.html?string=MAGIC">MAGIC</a>, II. it is in Assyrio-Babylonian literature that we have the completest account of magical doctrine and practice. The words used in that literature for the male and female magician are ashipu and ashiptu, which correspond to the Hebrew mekhashsheph and mekhashshephah in <a onClick="return mV(\'Deu\',18,10);">De 18:10</a> and <a onClick="return mV(\'Exd\',22,18);">Ex 22:18</a> (see 2, above) and are cognate to \'ashshaph (see <a onClick="return mV(\'Dan\',1,20);">Da 1:20</a>; <a onClick="return mV(\'Dan\',2,2,10);">2:2,10</a>, etc.), which means a magician (the Revised Version (British and American) "enchanter"). Other Babylonian words are kashshapu and kashshaptu, which in etymology and in sense agree with the Hebrew terms mekhashsheph and mekhashshephah mentioned above. But neither in the Babylonian or Hebrew words is there the peculiar idea of a witch, namely, one who traffics with malicious spirits for malicious ends. indeed the magician was a source of good (male and female) as conceived by the Babylonians, especially the ashipu and ashiptu, to the state and to individuals, as well as of evil, and he was often therefore in the service of the state as the guide of its policy. And the same applies to the magician as the Hebrews regarded him, though the true teachers and leaders in Israel condemned magic and divination of every sort as being radically opposed to the religion of Yahweh (<a onClick="return mV(\'Deu\',18,10);">De 18:10</a>f). Of course, if a Babylonian magician used his art to the injury of others he was punished as other criminals, and in case of the death of the victim he was executed as a murderer. It is, however, noteworthy in its bearing on "witchcraft" that the female magician or sorceress played a larger part in ancient Babylonia than her male counterpart, and the same is true of the Greeks and other ancient people. This arose perhaps from the fact that in primitive times men spent their time in fighting and hunting; the cooking of the food and the healing of the sick, wounded, etc., by magical potions and otherwise, falling to the lot of the woman who stayed at home. In the early history of the Hebrews inspired women played a greater role than in later time; compare Miriam (<a onClick="return mV(\'Exd\',15,20);">Ex 15:20</a>f; <a onClick="return mV(\'Num\',12,\'1-\');">Nu 12</a>); Deborah (<a onClick="return mV(\'Jdg\',5,12);">Jud 5:12</a>); Huldah (<a onClick="return mV(\'2Ki\',22,14);">2Ki 22:14</a>). Note also the \'ishshah chakhamah, or "wise woman" of <a onClick="return mV(\'2Sa\',14,2);">2Sa 14:2</a>ff; <a onClick="return mV(\'2Sa\',20,16);">20:16</a>.<P>The first two sections of the Code of Hammurabi are as follows: "1. If a man has laid a curse (kispu = keshaphim) upon (another) man and it is not justified, he that laid the curse shall be put to death. 2. If a man has put a spell upon (another) man and it is not justified, he upon whom the spell is laid shall go to the holy river; into the holy river shall he plunge. If the holy river overcome him (and he is drowned), the man who put the spell upon him shall take possession of his house. If the holy river declares him innocent and he remains unharmed the man who laid the spell shall be put to death. He that plunged into the river shall take possession of the house of him who laid the spell upon him." Not a word is said here of a female that weaves a spell, but probably the word "man" in the Babylonian is to be taken as including male and female (so Canon C. H. W. Johns in a private letter, dated December 22, 1912).<P>4. Rise, Spread, and Persecution of Witchcraft:<P>In the early and especially in the medieval church, the conception of the Devil occupied a very important place, and human beings were thought to be under his dominion until he was exorcised in baptism. It is to this belief that we owe the rise and spread of infant baptism. The unbaptized were thought to be Devil-possessed. The belief in the existence of women magicians had come down from hoary antiquity. It was but a short step to ascribe the evil those women performed to the Devil and his hosts. Then it was natural to think that the Devil would not grant such extraordinary powers without some quid pro quo; hence, the witch (or wizard) was supposed to have sold her (or his) soul to the Devil, a proceeding that would delight the heart of the great enemy of good always on the alert to hinder the salvation of men; compare the Faust legend. For the conditions believed to be imposed by the Devil upon all who would be in league with him see A. Lehmann, Aberglaube und Zauberei2 (1908), 110ff.<P>This idea of a covenant with the Devil is wholly absent from the early heathen conception of magic; nor do we in the latter read of meetings at night between the magicians and the demons with whom they dealt, such as took place on the Witches\' Sabbath. The witches were believed to have sexual commerce with devils and to be capable only of inflicting evil, both thoughts alien to oriental and therefore to Biblical magic.<P>The history and persecution and execution of women, generally ignorant and innocent, supposed to have been guilty of witchcraft, do not fall within the scope of this article, but may be perused in innumerable works: see "Literature" below. In Europe alone, not to mention America (Salem, etc.), Sprenger says that over nine million suspected witches were put to death on the flimsiest evidence; even if this estimate be too high the actual number must have been enormous. The present writer in his booklet, The Survival of the Evangelical Faith ("Essays for the Times," 1909), gives a brief account of the defense of the reality of witch power by nearly all the Christian theologians of the 17th century and by most of those living in the early 18th century (see pp. 23ff). See also <a href="./study/isbe/search.html?string=MAGIC">MAGIC</a>, and The Expositor T, IX, 157ff.<P>LITERATURE.<P>In addition to the literature cited under articles <a href="./study/isbe/search.html?string=DIVINATION">DIVINATION</a> and <a href="./study/isbe/search.html?string=MAGIC">MAGIC</a> (which see), the following worlds may be mentioned (the books on witchcraft proper are simply innumerable): Reginald Scot, The Discovery of Witchcraft (aimed at preventing the persecution of witches, 1584; republished London, 1886); reply to the last work by James I of England: Daemonologie, 1597; Casaubon, On Credulity and Incredulity...A Treatise Proving Spirits, Witches and Supernatural Operations, 1668; Joseph Glanrill, Saducismus Triumphatus: Full and Plain Evidences concerning Witches and Apparitions (the last two books are by theologians who class with "atheists"—a vague word in those times for unbelief—all such as doubt the power of witches and deny the power of devils upon human life). For the history of witchcraft and its persecutions see howard Williams, The Superstitions of Witchcraft,1865,and (brief but interesting and compact) Charles Mackay, Memoirs of Extraordinary Popular Delusions (2 volumes,1851,101-91). See also Sir W. Scott, Demonology and Witchcraft, 1830; W. R. Halliday, Greek Divination: A Study of its Methods and Principles, London, Macmillan (important); and article by the present writer in The Expositor, January,1914,on "The Words Witch and Witchcraft in history and in Literature." For a full account of the witch craze and persecution at Salem, near Boston, U.S.A., see The Wonders of the Invisible World by Cotton Mather, D. D., with a further account by increase Mather, D. D., and compare Demon Possession by J. L. Nevins, 303-10.``33';
isbe[9229]='Withered`with\'-erd (nabhel, "to fade away," "to be dried up"):<P>(1) Used figuratively to express leanness of soul, spiritual impotence, a low condition of spiritual life, a lack of moral nourishment: "My heart is smitten like grass, and withereth" (<a onClick="return mV(\'Psa\',102,4);">Ps 102:4</a>). The contrasting figure emphasizes this idea: "All my fountains are in thee" (<a onClick="return mV(\'Psa\',87,7);">Ps 87:7</a>). Also <a onClick="return mV(\'Psa\',1,3);">Ps 1:3</a>, where the freshness and beauty of the righteous man\'s life are thus described: "And he shall be like a tree planted by the streams of water,...whose leaf also doth not wither." In the New Testament xeraino, "to wither," is used to carry out the same idea of moral decay, or malnutrition of soul (<a onClick="return mV(\'Mat\',13,6);">Mt 13:6</a>; <a onClick="return mV(\'Mat\',21,19);">21:19</a>).<P>(2) "Wither" also had a physiological meaning, expressing both in the Old Testament and in the New Testament the idea of bodily impotence, especially, though not exclusively, of the limbs. Jeroboam was struck suddenly with paralysis of the arm, which is said to have "dried up" (<a onClick="return mV(\'1Ki\',13,\'4-6\');">1Ki 13:4-6</a>); "probably due to sudden hemorrhage affecting some part of the brain, which may under certain circumstances be only temporary" (HDB, 1-vol, 599). "Their skin cleaveth to their bones; it is withered" (<a onClick="return mV(\'Lam\',4,8);">La 4:8</a>).<P>In the New Testament (<a onClick="return mV(\'Mat\',12,10);">Mt 12:10</a>; <a onClick="return mV(\'Mar\',3,1);">Mr 3:1</a>; <a onClick="return mV(\'Luk\',6,6);">Lu 6:6</a>) "withered hand" was probably our modern "infantile paralysis," which may leave one or more limbs shrunken and powerless without detriment to the general health.``52';
isbe[9230]='Withes, Withs, Green`withs, (yetharim lachim, margin "new bowstrings," the King James Version margin "new (moist) cords" (<a onClick="return mV(\'Jdg\',16,7);">Jud 16:7</a>); Septuagint neura hugra): The material with which Samson was bound by Delilah (<a onClick="return mV(\'Jdg\',16,8);">Jud 16:8</a>) was probably some moist "gut" such as was used for bowstrings. Compare metharim, "bowstrings" (<a onClick="return mV(\'Psa\',21,12);">Ps 21:12</a>; yether, <a onClick="return mV(\'Job\',30,11);">Job 30:11</a>; <a onClick="return mV(\'Psa\',11,2);">Ps 11:2</a>); lahim, translated "green," means "fresh," "sappy" or "moist."``1';
isbe[9231]='Witness`wit\'-nes (nouns \'edh, and \'edhah, and verb \'anah; martus, with all derivative words and their compounds): The word "witness" is used of inanimate things, e.g. the heap of stones testifying to the covenant between Jacob and Laban (<a onClick="return mV(\'Gen\',31,\'44-54\');">Ge 31:44-54</a>), and the So of Moses. (<a onClick="return mV(\'Deu\',31,19,21);">De 31:19,21</a>). The main use of the word is forensic, and from this use all other applications are naturally derived. Important legal agreements required the attestation of witnesses, as in the case of the purchase of property, or a betrothal (<a onClick="return mV(\'Rth\',4,\'1-11\');">Ru 4:1-11</a>, where we are told that the ancient form of attestation was by a man drawing off his shoe and giving it to his neighbor).<P>The Mosaic Law insisted on the absolute necessity of witnesses in all cases which came before a judge, especially in criminal cases. Not only in criminal cases, but in all cases, it was necessary to have at least two witnesses to make good an accusation against a person (<a onClick="return mV(\'Deu\',17,6);">De 17:6</a>; <a onClick="return mV(\'Deu\',19,15);">19:15</a>; compare <a onClick="return mV(\'Num\',35,30);">Nu 35:30</a>; <a onClick="return mV(\'Mat\',18,16);">Mt 18:16</a>; <a onClick="return mV(\'Jhn\',8,17);">Joh 8:17</a>; <a onClick="return mV(\'2Cr\',13,1);">2Co 13:1</a>; <a onClick="return mV(\'1Ti\',5,19);">1Ti 5:19</a>). According to the Talmud (Pesachim 113b), if in a case of immorality only one witness came forward to accuse anyone, it was regarded as sinful on the part of that witness. On the other hand, anyone who, being present at the adjuration (<a onClick="return mV(\'Lev\',5,1);">Le 5:1</a> the Revised Version (British and American)), refused to come forward as a witness when he had testimony to bear, was considered to have sinned (<a onClick="return mV(\'Pro\',29,24);">Pr 29:24</a>). Among those not qualified to be witnesses were the near relations of the accuser or the accused, friends and enemies, gamesters, usurers, tax-gatherers, heathen, slaves, women and those not of age (Sanhedhrin 3 3, 4; Ro\'sh Ha-shanah 1 7; Babha\' Kamma\' 88a; compare Ant, IV, viii, 15). No one could be a witness who had been paid to render this service (Bekhoroth 4 6). In cases of capital punishment there was an elaborate system of warning and cautioning witnesses. Each witness had to be heard separately (Sanhedhrin 5; compare 3 5). If they contradicted one another on important points their witness was invalidated (Sanhedhrin 5).<P>No oath was required from witnesses. The meaning of <a onClick="return mV(\'Lev\',5,1);">Le 5:1</a> was not that witnesses had to take an oath, as some think; it describes the solemn adjuration of the judge to all those with knowledge of the case to come forward as witnesses (see <a href="./study/isbe/search.html?string=OATH">OATH</a>). When a criminal was to be put to death, the witnesses against him were to take the foremost share in bringing about his death (<a onClick="return mV(\'Deu\',17,7);">De 17:7</a>; compare <a onClick="return mV(\'Act\',7,58);">Ac 7:58</a>), in order to prove their own belief in their testimony. In the case of a person condemned to be stoned, all the witnesses had to lay their hands on the head of the condemned (<a onClick="return mV(\'Lev\',24,14);">Le 24:14</a>). "False witnessing" was prohibited in the Decalogue (<a onClick="return mV(\'Exd\',20,16);">Ex 20:16</a>); against it the lexicon talionis was enforced, i.e. it was done to the witness as he meant to do to the accused (<a onClick="return mV(\'Deu\',19,\'16-21\');">De 19:16-21</a>). The Sadducees held that only when the falsely accused had been executed, the false witnesses should be put to death; the Pharisees, that false witnesses were liable to be executed the moment the death sentence had been passed on the falsely accused (Makkoth 17). In spite of prohibitions, false witnessing was a very common crime among the people (<a onClick="return mV(\'Psa\',27,12);">Ps 27:12</a>; <a onClick="return mV(\'Psa\',35,11);">35:11</a>; <a onClick="return mV(\'Pro\',6,19);">Pr 6:19</a>; <a onClick="return mV(\'Pro\',12,17);">12:17</a>; <a onClick="return mV(\'Pro\',14,5);">14:5</a>; <a onClick="return mV(\'Pro\',19,5);">19:5</a>; <a onClick="return mV(\'Pro\',24,28);">24:28</a>; <a onClick="return mV(\'Mat\',26,60);">Mt 26:60</a>; <a onClick="return mV(\'Act\',6,13);">Ac 6:13</a>).<P>In <a onClick="return mV(\'Act\',22,20);">Ac 22:20</a>; <a onClick="return mV(\'Rev\',2,13);">Re 2:13</a>; <a onClick="return mV(\'Rev\',17,6);">17:6</a> the word martus, "witness", seems to be beginning to acquire the meaning of "martyr," as in the King James Version, although the Revised Version (British and American) translates "witness" in the first two passages, retaining "martyr" only in the third with "witness" in the m. For "Tabernacle of Witness" see <a href="./study/isbe/search.html?string=TABERNACLE">TABERNACLE</a>.``98';
isbe[9232]='Witness of the Spirit`This phrase arises from the words of <a onClick="return mV(\'Rom\',8,16);">Ro 8:16</a>: "The Spirit himself beareth witness with our spirit, that we are children of God." With this may be grouped, as illustrative, <a onClick="return mV(\'1Jo\',5,10);">1Joh 5:10</a>: "he that believeth on the Son of God hath the witness in him." in interpreting, we may approach the former passage through the latter. To the man who "believeth on the Son of God," so as to prove him by reliance, He becomes self-evidential in experience, verifying himself to the believer as the divine response to his whole spiritual need. Thus, believed on as the Son, he awakens in the soul which he embraces the filial attitude toward God, the cry, "Abba, Father." On the other side the Spirit, both in the written Word (e.g. <a onClick="return mV(\'Jhn\',1,12);">Joh 1:12</a>) and in his secret converse with the believer in the life of faith, assures him of the paternal love toward him, as toward a "dear child," (<a onClick="return mV(\'Eph\',5,1);">Eph 5:1</a>) of the Father of his Lord. There is thus a concurrent "witnessing." The believer\'s spirit says, "Thou art my Father"; the Spirit, says to the believer\'s spirit, "Thou art His child." We may compare <a onClick="return mV(\'Rom\',5,5);">Ro 5:5</a>: "The love of God hath been shed abroad in our hearts through the Holy Spirit."``46';
