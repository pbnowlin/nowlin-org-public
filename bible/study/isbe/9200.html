isbe[9201]='Will-Worship`In <a onClick="return mV(\'Col\',2,23);">Col 2:23</a>, "a show of wisdom in will-worship," for ethelothreskia), a word found nowhere else but formed exactly like "will-worship": worship originating in the human will as opposed to the divine, arbitrary religious acts, worthless despite their difficulty of performance.``1';
isbe[9202]='Willow Tree`wil\'-o-tre (tsaphtsaphah): Comparison with the Arabic cafcaf, "the willow," makes it very probable that thc translation of <a onClick="return mV(\'Eze\',17,5);">Eze 17:5</a> is correct.``1';
isbe[9203]='Willows`wil\'-oz (\'arabhim); itea (<a onClick="return mV(\'Lev\',23,40);">Le 23:40</a>; <a onClick="return mV(\'Job\',40,22);">Job 40:22</a>; <a onClick="return mV(\'Psa\',137,2);">Ps 137:2</a>; <a onClick="return mV(\'Isa\',15,7);">Isa 15:7</a>; <a onClick="return mV(\'Isa\',44,4);">44:4</a>)): In all references this tree is mentioned as beside running water. They may all refer to the willow, two varieties of which, Salix fragilis and S. alba, occur commonly in Palestine, or to the closely allied Populus euphratus (also Natural Order Salicaceae), which is even more plentiful, especially on the Jordan and its tributaries. The Brook of the Willows (<a onClick="return mV(\'Isa\',15,7);">Isa 15:7</a>) must have been some stream running from Moab to the Jordan or Dead Sea. Popular fancy has associated the willows of <a onClick="return mV(\'Psa\',137,2);">Ps 137:2</a> with the so-called "weeping willow" (Salix babylonica), but though this tree is found today in Palestine, it is an introduction from Japan and cannot have existed "by the waters of Babylon" at the time of the captivity.``117';
isbe[9204]='Willows, the Brook of the`Evidently mentioned as the boundary of Moab (<a onClick="return mV(\'Isa\',15,7);">Isa 15:7</a>) and generally identified with the brook Zered.`<a href="./study/isbe/search.html?string=BROOK">BROOK</a>; <a href="./study/isbe/search.html?string=ZERED">ZERED</a>`1';
isbe[9205]='Wimple`wim\'-p\'l: the Revised Version (British and American) substitutes "shawls" for the King James Version "wimples" in <a onClick="return mV(\'Isa\',3,22);">Isa 3:22</a>. The precise article of dress intended is unknown.`<a href="./study/isbe/search.html?string=DRESS">DRESS</a>`1';
isbe[9206]='Wind`wind (anemos:<P>1. Causes:<P>Unequal distribution of heat in the atmosphere causes currents of air or wind. The heated air rises and the air from around rushes in. The direction from which a current comes determines its name, as west wind coming from the west but blowing toward the east. When two currents of air of different directions meet, a spiral motion sometimes results.<P>See <a href="./study/isbe/search.html?string=WHIRLWIND">WHIRLWIND</a>.<P>2. West Wind:<P>In Palestine the west wind is the most common. It comes from the sea and carries the moisture which condenses to form clouds, as it is turned upward by the mountains, to the cooler layers of the atmosphere. If the temperature reached is cool enough the cloud condenses and rain falls. Elijah looked toward the west for the "small cloud," and soon "the heavens grew black with clouds and wind" (<a onClick="return mV(\'1Ki\',18,44);">1Ki 18:44</a>f). "When ye see a cloud rising in the west, straightway ye say, There cometh a shower; and so it cometh to pass" (<a onClick="return mV(\'Luk\',12,54);">Lu 12:54</a>).<P>3. South Wind:<P>The south wind is frequent in Palestine. If it is slightly southwest, it may bring rain, but if it is due south or southeast, there is no rain. It is a warm wind bringing good weather. "When ye see a south wind blowing, ye say, There will be a scorching heat; and it cometh to pass" (<a onClick="return mV(\'Luk\',12,55);">Lu 12:55</a>). In the cooler months it is a gentle, balmy wind, so that the "earth is still by reason of the south wind" (<a onClick="return mV(\'Job\',37,17);">Job 37:17</a>; compare <a onClick="return mV(\'Sgs\',4,16);">So 4:16</a>).<P>4. North Wind:<P>The north wind is usually a strong, continuous wind blowing down from the northern hills, and while it is cool it always "drives away rain," as correctly stated in <a onClick="return mV(\'Pro\',25,23);">Pr 25:23</a>, the King James Version; yet it is a disagreeable wind, and often causes headache and fever. 5. East Wind:<P>The east wind or sirocco (from Arabic shark= "east") is the "scorching wind" (<a onClick="return mV(\'Jam\',1,11);">Jas 1:11</a>) from the desert. It is a hot, gusty wind laden with sand and dust and occurs most frequently in May and October. The temperature in a given place often rises 15 or 20 degrees within a few hours, bringing thermometer to the highest readings of the year. It is customary for the people to close up the houses tightly to keep out the dust and heat. The heat and dryness wither all vegetation (<a onClick="return mV(\'Gen\',41,6);">Ge 41:6</a>). Happily the wind seldom lasts for more than three days at a time. It is the destructive "wind of the wilderness" (<a onClick="return mV(\'Job\',1,19);">Job 1:19</a>; <a onClick="return mV(\'Jer\',4,11);">Jer 4:11</a>; <a onClick="return mV(\'Jer\',13,24);">13:24</a>): "Yahweh caused the sea to go back by a strong east wind all the night" (<a onClick="return mV(\'Exd\',14,21);">Ex 14:21</a>) for the children of Israel to pass; the "rough blast in the day of the east wind" (<a onClick="return mV(\'Isa\',27,8);">Isa 27:8</a>). The strength of the wind makes it dangerous for ships at sea: "With the east wind thou breakest the ships of Tarshish" (<a onClick="return mV(\'Psa\',48,7);">Ps 48:7</a>). Euraquilo or Euroclydon (<a onClick="return mV(\'Act\',27,14);">Ac 27:14</a> the King James Version), which caused Paul\'s shipwreck, was an east-northeast wind, which was especially dangerous in that region.<P>6. Practical Use:<P>The wind is directly of great use to the farmer in Palestine in winnowing the grain after it is threshed by treading out (<a onClick="return mV(\'Psa\',1,4);">Ps 1:4</a>; <a onClick="return mV(\'Psa\',35,5);">35:5</a>; <a onClick="return mV(\'Isa\',17,13);">Isa 17:13</a>). It was used as a sign of the weather (<a onClick="return mV(\'Ecc\',11,4);">Ec 11:4</a>). It was a necessity for traveling on the sea in ancient times (<a onClick="return mV(\'Act\',28,13);">Ac 28:13</a>; <a onClick="return mV(\'Jam\',3,4);">Jas 3:4</a>), but too strong a wind caused shipwreck (<a onClick="return mV(\'Jon\',1,4);">Jon 1:4</a>; <a onClick="return mV(\'Mat\',8,24);">Mt 8:24</a>; <a onClick="return mV(\'Luk\',8,23);">Lu 8:23</a>).<P>7. Scripture References:<P>The Scriptural references to wind show many illustrative and figurative uses:<P>(1) Power of God (<a onClick="return mV(\'1Ki\',19,11);">1Ki 19:11</a>; <a onClick="return mV(\'Job\',27,21);">Job 27:21</a>; <a onClick="return mV(\'Job\',38,24);">38:24</a>; <a onClick="return mV(\'Psa\',107,25);">Ps 107:25</a>; <a onClick="return mV(\'Psa\',135,7);">135:7</a>; <a onClick="return mV(\'Psa\',147,18);">147:18</a>; <a onClick="return mV(\'Psa\',148,8);">148:8</a>; <a onClick="return mV(\'Pro\',30,4);">Pr 30:4</a>; <a onClick="return mV(\'Jer\',10,13);">Jer 10:13</a>; <a onClick="return mV(\'Hsa\',4,19);">Ho 4:19</a>; <a onClick="return mV(\'Luk\',8,25);">Lu 8:25</a>): "He caused the east wind to blow in the heavens; and by his power he guided the south wind" (<a onClick="return mV(\'Psa\',78,26);">Ps 78:26</a>).<P>(2) Scattering and destruction: "A stormy wind shall rend it" (<a onClick="return mV(\'Eze\',13,11);">Eze 13:11</a>; compare <a onClick="return mV(\'Eze\',5,2);">5:2</a>; <a onClick="return mV(\'Eze\',12,14);">12:14</a>; <a onClick="return mV(\'Eze\',17,21);">17:21</a>; <a onClick="return mV(\'Hsa\',4,19);">Ho 4:19</a>; <a onClick="return mV(\'Hsa\',8,7);">8:7</a>; <a onClick="return mV(\'Jer\',49,36);">Jer 49:36</a>; <a onClick="return mV(\'Mat\',7,25);">Mt 7:25</a>).<P>(3) Uncertainty: "tossed to and fro and carried about with every wind of doctrine" (<a onClick="return mV(\'Eph\',4,14);">Eph 4:14</a>; compare <a onClick="return mV(\'Pro\',27,16);">Pr 27:16</a>; <a onClick="return mV(\'Ecc\',1,6);">Ec 1:6</a>; <a onClick="return mV(\'Jhn\',3,8);">Joh 3:8</a>; <a onClick="return mV(\'Jam\',1,6);">Jas 1:6</a>).<P>(4) Various directions: "toward the four winds of heaven" (<a onClick="return mV(\'Dan\',11,4);">Da 11:4</a>; compare <a onClick="return mV(\'Dan\',8,8);">8:8</a>; <a onClick="return mV(\'Zec\',2,6);">Zec 2:6</a>; <a onClick="return mV(\'Mat\',24,31);">Mt 24:31</a>; <a onClick="return mV(\'Mar\',13,27);">Mr 13:27</a>).<P>(5) Brevity: "a wind that passeth away" (<a onClick="return mV(\'Psa\',78,39);">Ps 78:39</a>; compare <a onClick="return mV(\'Psa\',1,4);">1:4</A>; <a onClick="return mV(\'Psa\',35,5);">35:5</a>; <a onClick="return mV(\'Psa\',103,16);">103:16</a>).<P>(6) Nothingness: "Molten images are wind" (<a onClick="return mV(\'Isa\',41,29);">Isa 41:29</a>; compare <a onClick="return mV(\'Jer\',5,13);">Jer 5:13</a>).``85';

isbe[9209]='Wine-Skins`(chemeth (<a onClick="return mV(\'Gen\',21,14);">Ge 21:14</a> margin), n\'odh (<a onClick="return mV(\'Jdg\',4,19);">Jud 4:19</a> "\'bottle") nebhel, nebhel (<a onClick="return mV(\'1Sa\',10,3);">1Sa 10:3</a> margin), (\'obh) (<a onClick="return mV(\'Job\',32,19);">Job 32:19</a>); askos (<a onClick="return mV(\'Mat\',9,17);">Mt 9:17</a>; <a onClick="return mV(\'Mar\',2,22);">Mr 2:22</a>; <a onClick="return mV(\'Luk\',5,37);">Lu 5:37</a>; compare askoputine, Judith 10:5, the Revised Version (British and American) "leathern bottle")): These words are all used to designate skins for the containing of liquids, nebhel, however, being the most common in the case of wine. The Israelite, like the modern Arabic and Syrian, used mainly the skin of the goat and the sheep, but the skins of the ox and the camel have also been put to this purpose. The skin is removed from the animal by drawing it over the body from the neck downward, half the skin on each of the limbs being also retained. It is then tanned, the hair cut close, turned inside out, and has all the openings save one closed with cords, when it is ready for use. The reference to "a wineskin in the smoke" in <a onClick="return mV(\'Psa\',119,83);">Ps 119:83</a> is generally explained on the supposition of its being hung there for mellowing purposes, but this can scarcely be accepted, for wine is never left for any length of time in the skin on account of its imparting a disagreeable flavor to the contents. The explanation of the New Testament passages is that the new wine, still liable to continue fermenting to a small extent at least, was put into new, still expansible skins, a condition that had ceased in the older ones.`<a href="./study/isbe/search.html?string=WINE">WINE</a>`23';
isbe[9210]='Wine; Wine Press`win, win\'-pres:<P>I. Terms.<P>1. Wine:<P>(1) (yayin), apparently from a non-Tsere root allied to Greek oinos, Latin vinum, etc. This is the usual word for "wine" and is found 141 times in Massoretic Text.<P>(2) chemer, perhaps "foaming" (<a onClick="return mV(\'Deu\',32,14);">De 32:14</a> and Massoretic Text <a onClick="return mV(\'Isa\',27,2);">Isa 27:2</a> (but see the English Revised Version margin)); Aramaic chamar (<a onClick="return mV(\'Ezr\',6,9);">Ezr 6:9</a>; <a onClick="return mV(\'Ezr\',7,22);">7:22</a>; <a onClick="return mV(\'Dan\',5,1,2,4,23);">Da 5:1,2,4,23</a>).<P>(3) tirosh. Properly this is the fresh grape juice (called also mishreh, <a onClick="return mV(\'Num\',6,3);">Nu 6:3</a>), even when still in the grape (<a onClick="return mV(\'Isa\',65,8);">Isa 65:8</a>). But unfermented grape juice is a very difficult thing to keep without the aid of modern antiseptic precautions, and its preservation in the warm and not over-cleanly conditions of ancient Palestine was impossible. Consequently, tirosh came to mean wine that was not fully aged (although with full intoxicating properties (<a onClick="return mV(\'Jdg\',9,13);">Jud 9:13</a>; <a onClick="return mV(\'Hsa\',4,11);">Ho 4:11</a>; compare <a onClick="return mV(\'Act\',11,13);">Ac 11:13</a>)) or wine when considered specifically as the product of grapes (<a onClick="return mV(\'Deu\',12,17);">De 12:17</a>; <a onClick="return mV(\'Deu\',18,4);">18:4</a>, etc.). The Septuagint always (except <a onClick="return mV(\'Isa\',65,8);">Isa 65:8</a>; <a onClick="return mV(\'Hsa\',4,11);">Ho 4:11</a>) translates by oinos and the Targums by chamar. the King James Version has "wine" 26 times, "new wine" 11 times, "sweet wine" in <a onClick="return mV(\'Mic\',6,15);">Mic 6:15</a>; the Revised Version (British and American) "vintage" in <a onClick="return mV(\'Num\',18,12);">Nu 18:12</a>; <a onClick="return mV(\'Mic\',6,15);">Mic 6:15</a> (with the same change in <a onClick="return mV(\'Neh\',10,37,39);">Ne 10:37,39</a> the Revised Version margin; <a onClick="return mV(\'Isa\',62,8);">Isa 62:8</a> the English Revised Version margin). Otherwise the English Revised Version has left the King James Version unchanged, while the American Standard Revised Version uses "new wine" throughout.<P>(4) Two apparently poetic words are \'acic (the Revised Version (British and American) "sweet wine," <a onClick="return mV(\'Isa\',49,26);">Isa 49:26</a>; <a onClick="return mV(\'Amo\',9,13);">Am 9:13</a>; <a onClick="return mV(\'Joe\',1,5);">Joe 1:5</a>; <a onClick="return mV(\'Joe\',3,18);">3:18</a>, "juice"; <a onClick="return mV(\'Sgs\',8,2);">So 8:2</a>), and cobhe\' ("wine," <a onClick="return mV(\'Isa\',1,22);">Isa 1:22</a>; "drink," <a onClick="return mV(\'Hsa\',4,18);">Ho 4:18</a> (margin "carouse"); <a onClick="return mV(\'Nah\',1,10);">Na 1:10</a>).<P>(5) For spiced wine three words occur: mecekh, <a onClick="return mV(\'Psa\',75,8);">Ps 75:8</a> (English Versions of the Bible "mixture"); mimcakh, <a onClick="return mV(\'Pro\',23,30);">Pr 23:30</a> ("mixed wine"); <a onClick="return mV(\'Isa\',65,11);">Isa 65:11</a> (the Revised Version (British and American) "mingled wine"); mezegh, <a onClick="return mV(\'Sgs\',7,2);">So 7:2</a> (the Revised Version (British and American) "mingled wine"); compare also yayin hareqach, <a onClick="return mV(\'Sgs\',8,2);">So 8:2</a> ("spiced wine").<P>(6) mamethaqqim, literally, "sweet," <a onClick="return mV(\'Neh\',8,10);">Ne 8:10</a>.<P>(7) shekhar (22 times), translated "strong drink" in English Versions of the Bible. Shekhar appears to mean "intoxicating drink" of any sort and in <a onClick="return mV(\'Num\',28,7);">Nu 28:7</a> is certainly simply "wine" (compare also its use in parallelism to "wine" in <a onClick="return mV(\'Isa\',5,11,22);">Isa 5:11,22</a>, etc.). In certain passages (<a onClick="return mV(\'Lev\',10,9);">Le 10:9</a>; <a onClick="return mV(\'Num\',6,3);">Nu 6:3</a>; <a onClick="return mV(\'1Sa\',1,15);">1Sa 1:15</a>, etc.), however, it is distinguished from "wine," and the meaning is not quite certain. But it would seem to mean "drink not made from grapes." Of such only pomegranate wine is named in the Bible (<a onClick="return mV(\'Sgs\',8,2);">So 8:2</a>), but a variety of such preparations (made from apples, quinces, dates, barley, etc.) were known to the ancients and must have been used in Palestine also. The translation "strong drink" is unfortunate, for it suggests "distilled liquor," "brandy," which is hardly in point.<P>See <a href="./study/isbe/search.html?string=DRINK,+STRONG">DRINK, STRONG</a>.<P>(8) In the Apocrypha and New Testament "wine" represents oinos, with certain compounds, except in <a onClick="return mV(\'Act\',2,13);">Ac 2:13</a>, where the Greek is gleukos, "sweet," English Versions of the Bible "new wine."<P>See also <a href="./study/isbe/search.html?string=BLOOD">BLOOD</a>; <a href="./study/isbe/search.html?string=DRINK">DRINK</a>; <a href="./study/isbe/search.html?string=FLAGON">FLAGON</a>; <a href="./study/isbe/search.html?string=FRUIT">FRUIT</a>; <a href="./study/isbe/search.html?string=HONEY">HONEY</a>.<P>2. Wine Press:<P>(1) Properly speaking, the actual wine press was called gath (<a onClick="return mV(\'Jdg\',6,11);">Jud 6:11</a>, etc.), and the receiving vat ("fat") yeqebh (<a onClick="return mV(\'Num\',18,27);">Nu 18:27</a>, etc.), but the names were interchangeable to some degree (<a onClick="return mV(\'Isa\',16,10);">Isa 16:10</a>; <a onClick="return mV(\'Job\',24,11);">Job 24:11</a>; compare <a onClick="return mV(\'Isa\',5,2);">Isa 5:2</a>, the Revised Version (British and American) text and margin) and either could be used for the whole apparatus (see <a href="./study/isbe/search.html?string=GATH">GATH</a> and compare <a onClick="return mV(\'Jdg\',7,25);">Jud 7:25</a>; <a onClick="return mV(\'Zec\',14,10);">Zec 14:10</a>). In <a onClick="return mV(\'Isa\',63,3);">Isa 63:3</a> the Hebrew has purah, "wine trough" a word found also in <a onClick="return mV(\'Hag\',2,16);">Hag 2:16</a> where it seems to be a gloss (so, apparently, the American Standard Revised Version).<P>(2) In the Apocrypha (Sirach 33:16) and in the New Testament  (<a onClick="return mV(\'Mat\',21,33);">Mt 21:33</a>; <a onClick="return mV(\'Rev\',14,19,20);">Re 14:19,20</a> (twice); <a onClick="return mV(\'Rev\',19,15);">19:15</a>) "winepress" is lenos; in <a onClick="return mV(\'Mar\',12,1);">Mr 12:1</a> hupolenion, by which only the receiving vat seems to be meant (the Revised Version (British and American) a pit for a winepress").<P>II. Wine-Making.<P>1. The Vintage:<P>For the care of the vine, its distribution, different varieties, etc., see <a href="./study/isbe/search.html?string=VINE">VINE</a>. The ripening of the grapes took place as early as June in the Jordan valley, but on the coast not until August, while in the hills it was delayed until September. In whatever month, however, the coming of the vintage was the signal for the villagers to leave their homes in a body and to encamp in booths erected in the vineyards, so that the work might be carried on without interruption. See <a href="./study/isbe/search.html?string=TABERNACLES,+FEAST+OF">TABERNACLES, FEAST OF</a>. It was the great holiday season of the year and the joy of the vintage was proverbial (<a onClick="return mV(\'Isa\',16,10);">Isa 16:10</a>; <a onClick="return mV(\'Jer\',25,30);">Jer 25:30</a>; <a onClick="return mV(\'Jer\',48,33);">48:33</a>; compare <a onClick="return mV(\'Jdg\',9,27);">Jud 9:27</a>), and fragments of vintage songs seem to be preserved in <a onClick="return mV(\'Isa\',27,2);">Isa 27:2</a>; <a onClick="return mV(\'Isa\',65,8);">65:8</a>. The grapes were gathered usually by cutting off the clusters (see <a href="./study/isbe/search.html?string=SICKLE">SICKLE</a>), and were carried to the press in baskets.<P>2. Wine Presses:<P>Many of the ancient wine presses remain to the present day. Ordinarily they consisted of two rectangular or circular excavations, hewn (<a onClick="return mV(\'Isa\',5,2);">Isa 5:2</a>) in the solid rock to a depth of 2 or 3 feet. Where possible one was always higher than the other and they were connected by a pipe or channel. Their size, of course, varied greatly, but the upper vat was always wider and shallower than the lower and was the press proper, into which the grapes were thrown, to be crushed by the feet of the treaders (<a onClick="return mV(\'Isa\',63,\'1-3\');">Isa 63:1-3</a>, etc.). The juice flowed down through the pipe into the lower vat, from which it was removed into jars (<a onClick="return mV(\'Hag\',2,16);">Hag 2:16</a>) or where it was allowed to remain during the first fermentation.<P>Many modifications of this form of the press are found. Where there was no rock close to the surface, the vats were dug in the earth and lined with stonework or cement, covered with pitch. Or the pressvat might be built up out of any material (wood was much used in Egypt), and from it the juice could be conducted into a sunken receptacle or into jars. Not infrequently a third (rarely a fourth) vat might be added between the other two, in which a partial settling and straining could take place. Wooden beams are often used either to finish the pressing or to perform the whole operation, and holes into which the ends of these beams fitted can still be seen. A square of wood attached to the beam bore down on the pile of grapes, while the free end of the beam was heavily weighted. In the simpler presses the final result was obtained by piling stones on the mass that remained after the treaders had finished their work.<P>3. Grading:<P>It is a general principle of wine-making (compare that "the less the pressure the better the product"; therefore the liquid that flowed at the beginning of the process, especially that produced by the mere weight of the grapes themselves when piled in heaps, was carefully kept separate from that which was obtained only under heavy pressure. A still lower grade was made by adding water to the final refuse the mixture to ferment. Possibly this last concoction is sometimes meant by the word "vinegar" (chomets).<P>4. Fermentation:<P>In the climate of Palestine fermentation begins almost immediately, frequently on the same day for juice pressed out in the morning, but never later than the next day. At first a slight foam appears on the surface of the liquid, and from that moment, according to Jewish tradition, it is liable to the wine-tithe (Ma\'aseroth 1 7). The action rapidly becomes more violent, and while it is in progress the liquid must be kept in jars or in a vat, for it would burst even the newest and strongest of wine-skins (<a onClick="return mV(\'Job\',32,19);">Job 32:19</a>). Within about a week this violent fermentation subsides, and the wine is transferred to other jars or strong wine-skins (<a onClick="return mV(\'Mar\',2,22);">Mr 2:22</a> and parallel\'s), in which it undergoes the secondary fermentation. At the bottom of the receptacles collects the heavier matter or "lees" (shemarim, <a onClick="return mV(\'Psa\',75,8);">Ps 75:8</a> ("dregs"); <a onClick="return mV(\'Jer\',48,11);">Jer 48:11</a>; <a onClick="return mV(\'Zep\',1,12);">Ze 1:12</a> in <a onClick="return mV(\'Isa\',25,6);">Isa 25:6</a> the word is used for the wine as well), from which the "wines on the lees" gather strength and flavor.<P>At the end of 40 days it was regarded as properly "wine" and could be offered as a drink offering (\'Edhuyyoth 6 1). The practice after this point seems to have varied, no doubt depending on the sort of wine that was being made. Certain kinds were left undisturbed to age "on their lees" and were thought to be all the better for so doing, but before they were used it was necessary to strain them very carefully. So <a onClick="return mV(\'Isa\',25,6);">Isa 25:6</a>, \'A feast of wine aged on the lees, thoroughly strained.\' But usually leaving the wine in the fermentation vessels interfered with its improvement or caused it to degenerate. So at the end of 40 days it was drawn off into other jars (for storage, <a onClick="return mV(\'1Ch\',27,27);">1Ch 27:27</a>, etc.) or wine-skins (for transportation, <a onClick="return mV(\'Jos\',9,4);">Jos 9:4</a>, etc.). So <a onClick="return mV(\'Jer\',48,11);">Jer 48:11</a>: \'Moab has been undisturbed from his youth, and he has rested on his lees and has not been emptied from vessel to vessel....Therefore his flavor remains unchanged (or "becomes insipid") and his scent is unimproved (or "lacks freshness")\'; compare <a onClick="return mV(\'Zep\',1,12);">Ze 1:12</a>.<P>5. Storage:<P>Jars were tightly sealed with caps covered with pitch. The very close sealing needed to preserve sparkling wines, however, was unknown to the Hebrews, and in consequence (and for other reasons) such wines were not used. Hence, in <a onClick="return mV(\'Psa\',75,8);">Ps 75:8</a>, "The wine foameth," the allusion must be to very new wine whose fermentation had not yet subsided, if indeed, the translation is not wrong (the Revised Version margin "The wine is red"). The superiority of old wine to new was acknowledged by the Hebrews, in common with the rest of the world (Sirach 9:10; <a onClick="return mV(\'Luk\',5,39);">Lu 5:39</a>), but in the wines of Palestine acetous fermentation, changing the wine into vinegar, was likely to occur at any time. Three years was about the longest time for which such wines could be kept, and "old wine" meant only wines that had been, stored for a year or more (Bab. Bath. 6 3).<P>See also <a href="./study/isbe/search.html?string=CRAFTS">CRAFTS, II, 19</a>.<P>III. Use of Wine.<P>1. Mixed Wine:<P>In Old Testament times wine was drunk undiluted, and wine mixed with water was thought to be ruined (<a onClick="return mV(\'Isa\',1,22);">Isa 1:22</a>). The "mixed" or "mingled wines" (see I,1,(5), above) were prepared with aromatic herbs of various sorts and some of these compounds, used throughout the ancient world, were highly intoxicating (<a onClick="return mV(\'Isa\',5,22);">Isa 5:22</a>). Wine mixed with myrrh was stupefying and an anesthetic (<a onClick="return mV(\'Mar\',15,23);">Mr 15:23</a>). At a later period, however, the Greek use of diluted wines had attained such sway that the writer of 2Maccabees speaks (15:39) of undiluted wine as "distasteful" (polemion). This dilution is so normal in the following centuries that the Mishna can take it for granted and, indeed, R. Eliezer even forbade saying the table-blessing over undiluted wine (Berakhoth 7 5). The proportion of water was large, only one-third or one-fourth of the total mixture being wine (Niddah 2 7; Pesachim 108b).<P>NOTE.<P>The wine of the Last Supper, accordingly, may be described in modern terms as a sweet, red, fermented wine, rather highly diluted. As it was no doubt the ordinary wine of commerce, there is no reason to suppose that it was particularly "pure."<P>2. Wine-Drinkinig:<P>Throughout the Old Testament, wine is regarded as a necessity of life and in no way as a mere luxury. It was a necessary part of even the simplest meal (<a onClick="return mV(\'Gen\',14,18);">Ge 14:18</a>; <a onClick="return mV(\'Jdg\',19,19);">Jud 19:19</a>; <a onClick="return mV(\'1Sa\',16,20);">1Sa 16:20</a>; <a onClick="return mV(\'Isa\',55,1);">Isa 55:1</a>, etc.), was an indispensable provision for a fortress (<a onClick="return mV(\'2Ch\',11,11);">2Ch 11:11</a>), and was drunk by all classes and all ages, even by the very young (<a onClick="return mV(\'Lam\',2,12);">La 2:12</a>; <a onClick="return mV(\'Zec\',9,17);">Zec 9:17</a>). "Wine" is bracketed with "grain" as a basic staple (<a onClick="return mV(\'Gen\',27,28);">Ge 27:28</a>, etc.), and the failure of the winecrop or its destruction by foreigners was a terrible calamity (<a onClick="return mV(\'Deu\',28,30,39);">De 28:30,39</a>; <a onClick="return mV(\'Isa\',62,8);">Isa 62:8</a>; <a onClick="return mV(\'Isa\',65,21);">65:21</a>; <a onClick="return mV(\'Mic\',6,15);">Mic 6:15</a>; <a onClick="return mV(\'Zep\',1,13);">Ze 1:13</a>, etc.). On the other hand, abundance of wine was a special token of God\'s blessing (<a onClick="return mV(\'Gen\',27,28);">Ge 27:28</a>; <a onClick="return mV(\'Deu\',7,13);">De 7:13</a>; <a onClick="return mV(\'Amo\',9,14);">Am 9:14</a>, etc.), and extraordinary abundance would be a token of the Messianic age (<a onClick="return mV(\'Amo\',9,13);">Am 9:13</a>; <a onClick="return mV(\'Joe\',3,18);">Joe 3:18</a>; <a onClick="return mV(\'Zec\',9,17);">Zec 9:17</a>). A moderate "gladdening of the heart" through wine was not looked upon as at all reprehensible (<a onClick="return mV(\'2Sa\',13,28);">2Sa 13:28</a>; <a onClick="return mV(\'Est\',1,10);">Es 1:10</a>; <a onClick="return mV(\'Psa\',104,15);">Ps 104:15</a>; <a onClick="return mV(\'Ecc\',9,7);">Ec 9:7</a>; <a onClick="return mV(\'Ecc\',10,19);">10:19</a>; <a onClick="return mV(\'Zec\',9,15);">Zec 9:15</a>; <a onClick="return mV(\'Zec\',10,7);">10:7</a>), and while <a onClick="return mV(\'Jdg\',9,13);">Jud 9:13</a> represented a mere verbal remnant of a long-obsolete concept, yet the idea contained in the verse was not thought shocking. "Drink offerings," indeed, were of course a part of the prescribed ritual (<a onClick="return mV(\'Lev\',23,13);">Le 23:13</a>, etc.; see <a href="./study/isbe/search.html?string=SACRIFICE">SACRIFICE</a>), and a store of wine was kept in the temple (tabernacle) to insure their performance (<a onClick="return mV(\'1Ch\',9,29);">1Ch 9:29</a>). Even in later and much more moderate times, Sirach writes the laudation of wine in 31:27, and the writer of 2Maccabees (see above) objects as strongly to pure water as he does to pure wine. Christ adapted Himself to Jewish customs (<a onClick="return mV(\'Mat\',11,19);">Mt 11:19</a> parallel <a onClick="return mV(\'Luk\',7,34);">Lu 7:34</a>; <a onClick="return mV(\'Luk\',22,18);">Lu 22:18</a>), and exegetes usually suppose that the celebrated verse <a onClick="return mV(\'1Ti\',5,23);">1Ti 5:23</a> is meant as a safeguard against ascetic (Gnostic?) dualism, as well as to give medical advice.<P>On the temporal conditioning of the Biblical customs, the uncompromising opposition of the Bible to excess, and the non-applicability of the ancient attitude to the totally different modern conditions, see <a href="./study/isbe/search.html?string=DRUNKENNESS">DRUNKENNESS</a>.<P>The figurative uses of wine are very numerous, but are for the most part fairly obvious. Those offering difficulty have been discussed in the course of the article. For wine in its commercial aspect see <a href="./study/isbe/search.html?string=TRADE">TRADE</a>.``48';
isbe[9211]='Winebibber`win\'-bib-er: In <a onClick="return mV(\'Pro\',23,20);">Pr 23:20</a>, cobhe yauin; in <a onClick="return mV(\'Mat\',11,19);">Mt 11:19</a> = <a onClick="return mV(\'Luk\',7,34);">Lu 7:34</a>, oinopotes, of habitual wine-drinkers. The accusation was falsely brought against Jesus of being "a gluttonous man and a winebibber," because, unlike John, He ate and drank with others.``1';

isbe[9214]='Wings`wingz (kanaph; pterux): Biblical references to the wings of birds are common, especially in Psalms, many of them exquisitely poetical. Often the wings of an eagle are mentioned because they are from 7 to 9 feet in sweep, of untiring flight, and have strength to carry heavy burdens: so they became the symbol of strength and endurance. Ancient monuments and obelisks are covered with the heads of bulls, lions, different animals, and men even, to which the wings of an eagle were added to symbolize strength. Sometimes the wings of a stork are used to portray strong flight, as in the vision of Zechariah: "Then lifted I up mine eyes, and saw, and, behold, there came forth two women, and the wind was in their wings; now they had wings like the wings of a stork; and they lifted up the ephah between earth and heaven" (<a onClick="return mV(\'Zec\',5,9);">5:9</A>). The wings of a dove symbolized love. Wings in the abstract typified shelter, strength or speed, as a rule, while in some instances their use was ingenious and extremely poetical, as when Job records that the Almighty used wings to indicate migration: "And stretcheth her wings toward the south" (<a onClick="return mV(\'Job\',39,26);">39:26</A>). In <a onClick="return mV(\'Psa\',17,8);">Ps 17:8</a> there is a wonderful poetical imagery in the plea, "Hide me under the shadow of thy wings." In <a onClick="return mV(\'Psa\',18,10);">Ps 18:10</a> there is a reference to "the wings of the wind." And in <a onClick="return mV(\'Psa\',55,6);">55:6</A> the Psalmist cries, "Oh that I had wings like a dove!" The brightness and peace of prosperous times are beautifully described in <a onClick="return mV(\'Psa\',68,13);">Ps 68:13</a>, the wings of a dove covered with silver, and her pinions with pale green gold.\' The first rays of dawn are compared to "the wings of the morning" (<a onClick="return mV(\'Psa\',139,9);">139:9</A>). Solomon was thinking of the swiftness of wings when he said, "For riches\' certainly make themselves wings, like an eagle that flieth toward heaven" (<a onClick="return mV(\'Pro\',23,5);">Pr 23:5</a>). So also was Isaiah in <a onClick="return mV(\'Isa\',40,31);">40:31</a>, "They that wait for Yahweh shall renew their strength; they shall mount up with wings as eagles; they shall run, and not be weary; they shall walk, and not faint." In <a onClick="return mV(\'Mal\',4,2);">Mal 4:2</a> the King James Version, there is a beautiful reference, "But unto you that fear my name shall the Sun of righteousness arise with healing in his wings." the Revised Version (British and American) changes "his" to "its." Wings as an emblem of love were used by Jesus in the cry, "O Jerusalem...how often would I have gathered thy children...as a hen gathereth her chickens under her wings" (<a onClick="return mV(\'Mat\',23,37);">Mt 23:37</a>).``167';
isbe[9215]='Wink`wink (razam, literally, "to roll the eyes"): The act or habit of winking was evidently considered to be evil both in its motives and in its results. The idea of its facetiousness, prevalent in our day, is nowhere apparent in the Scriptures. It is mentioned frequently, but is always associated with sin, in the Old Testament especially in the sense of conceit, pride, and rebellion against God: "Why doth thine heart carry thee away? and what do thy eyes wink at, that thou turnest thy spirit against God" (<a onClick="return mV(\'Job\',15,12,13);">Job 15:12,13</a> the King James Version). So also <a onClick="return mV(\'Psa\',35,19);">Ps 35:19</a>: "Neither let them wink with the eye that hate roe without a cause." "A naughty person, a wicked man, walketh with froward mouth. He winketh with his eyes," etc. (<a onClick="return mV(\'Pro\',6,12,13);">Pr 6:12,13</a> the King James Version). "He that winketh with the eye causeth sorrow" (<a onClick="return mV(\'Pro\',10,10);">Pr 10:10</a>). See Watkinson, Education of the Heart, "Ethics of Gesture," 194ff.<P>In the New Testament the word is used to express the longsuffering patience and forgiveness of God toward erring Israel: "And the times of this ignorance God winked at" (<a onClick="return mV(\'Act\',17,30);">Ac 17:30</a> the King James Version, hupereidon, "overlooked," and so translated in the Revised Version (British and American); compare <span class="noTag">The Wisdom of Solomon 11:23</span>; Ecclesiasticus 30:11). The use of "winked" in this connection would in our day, of course, be considered in bad taste, if not actually irreverent, but it is an excellent example of the colloquialism of the King James Version.``52';

isbe[9217]='Winter`win\'-ter (choreph, from charaph, "to inundate," "overflow"): The rainy season, also the autumn harvest season (<a onClick="return mV(\'Gen\',8,22);">Ge 8:22</a>; <a onClick="return mV(\'Psa\',74,17);">Ps 74:17</a>; <a onClick="return mV(\'Zec\',14,8);">Zec 14:8</a>). It is also the time of cold (<a onClick="return mV(\'Jer\',36,22);">Jer 36:22</a>; <a onClick="return mV(\'Amo\',3,15);">Am 3:15</a>). The verb "to winter" occurs in <a onClick="return mV(\'Isa\',18,6);">Isa 18:6</a>. Cethaw has the same meaning as Choreph (<a onClick="return mV(\'Sgs\',2,11);">So 2:11</a>). cheimon, corresponds to choreph as the rainy season, and the verb paracheimazo, signifies "to pass the winter" (<a onClick="return mV(\'Act\',27,12);">Ac 27:12</a>), the noun from which is paracheimasia (same place).`<a href="./study/isbe/search.html?string=SEASONS">SEASONS</a>`1';
isbe[9218]='Winter-House`(beth ha-choreph (<a onClick="return mV(\'Jer\',36,22);">Jer 36:22</a>; <a onClick="return mV(\'Amo\',3,15);">Am 3:15</a>)): See under <a href="./study/isbe/search.html?string=SUMMER-HOUSE">SUMMER-HOUSE</a>. The "winter-house" in Jeremiah is that of King Jehoiakim; mention is made of the fire burning in the brazier.``1';
isbe[9219]='Wisdom`wiz\'-dum:<P>1. Linguistic<P>2. History<P>3. Religious Basis<P>4. Ideals<P>5. Teaching of Christ<P>6. Remainder of the New Testament<P class="in15">(1) James<P class="in15">(2) Paul<P>7. Hypostasis<P>LITERATURE<hr /><P>1. Linguistic:<P>In the Revised Version (British and American) the noun "wisdom" and its corresponding adjective and verb ("be wise," "act wisely," etc.) represent a variety of Hebrew words: bin (binah, and in the English Revised Version tebunah), sakhal (sekhel, sekhel), lebh (and in the English Revised Version labhabh), tushiyah (and in the English Revised Version Te\'em, \'ormah, piqqach. None of these, however, is of very frequent occurrence and by far the most common group is the verb chakham, with the adjective chakham, and the nouns chokhmah, chokhmoth, with something over 300 occurrences in the Old Testament (of which rather more than half are in Job, Proverbs, and Ecclesiastes). Cokhmah, accordingly, may be treated as the Hebrew equivalent for the English "wisdom," but none the less the two words do not quite correspond. For chokhmah may be used of simple technical skill (<a onClick="return mV(\'Exd\',28,3);">Ex 28:3</a>; <a onClick="return mV(\'Exd\',35,25);">35:25</a>, etc.; compare <span class="noTag">The Wisdom of Solomon 14:2</span>; Sirach 38:31; note that the English Versions of the Bible gives a false impression in such passages), of military ability (<a onClick="return mV(\'Isa\',10,13);">Isa 10:13</a>), of the intelligence of the lower animals (<a onClick="return mV(\'Pro\',30,24);">Pr 30:24</a>), of shrewdness applied to vicious (<a onClick="return mV(\'2Sa\',13,3);">2Sa 13:3</a>) or cruel (<a onClick="return mV(\'1Ki\',2,9);">1Ki 2:9</a> Hebrew) ends, etc. Obviously no one English word will cover all these different uses, but the general meaning is clear enough—"the art of reaching one\'s end by the use of the right means" (Smend). Predominantly the "wisdom" thought of is that which comes through experience, and the "wise man" is at his best in old age (<a onClick="return mV(\'Job\',12,12);">Job 12:12</a>; <a onClick="return mV(\'Job\',15,10);">15:10</a>; <a onClick="return mV(\'Pro\',16,31);">Pr 16:31</a>; Sirach 6:34; 8:9; 25:3-6, etc.; contrast <a onClick="return mV(\'Job\',32,9);">Job 32:9</a>; <a onClick="return mV(\'Ecc\',4,13);">Ec 4:13</a>; The <span class="noTag">Wisdom of Solomon 4:9</span>; Sirach 25:2). And in religion the "wise man" is he who gives to the things of God the same acuteness that other men give to worldly affairs (<a onClick="return mV(\'Luk\',16,8);">Lu 16:8</a>). He is distinguished from the prophets as not having personal inspiration, from the priestly school as not laying primary stress on the cult, and from the scribes as not devoted simply to the study of the sacred writings. But, in the word by itself, a "wise man" need not in any way be a religious man.<P>In the Revised Version (British and American) Apocrypha and New Testament the words "wisdom," "wise," "act wisely," etc., are always translations of phronimos, or of their cognates. For "wisdom," however, sophia is in almost every case the original word, the sole exception in the New Testament being <a onClick="return mV(\'Luk\',1,17);">Lu 1:17</a> (phronesis).<P>See also <a href="./study/isbe/search.html?string=PRUDENCE">PRUDENCE</a>.<P>2. History:<P>(1) In the prophetic period, indeed, "wise" generally has an irreligious connotation. Israel was fully sensible that her culture was beneath that of the surrounding nations, but thought of this as the reverse of defect. Intellectual power without moral control was the very fruit of the forbidden tree (<a onClick="return mV(\'Gen\',3,5);">Ge 3:5</a>), and "wisdom" was essentially a heathen quality (<a onClick="return mV(\'Isa\',10,13);">Isa 10:13</a>; <a onClick="return mV(\'Isa\',19,12);">19:12</a>; <a onClick="return mV(\'Isa\',47,10);">47:10</a>; <a onClick="return mV(\'Eze\',28,\'3-5\');">Eze 28:3-5</a>; <a onClick="return mV(\'Zec\',9,2);">Zec 9:2</a>; specifically Edomite in <a onClick="return mV(\'Jer\',49,7);">Jer 49:7</a>; <a onClick="return mV(\'Oba\',1,8);">Ob 1:8</a>; contrast Baruch 3:22,23) that deserved only denunciation (<a onClick="return mV(\'Isa\',5,21);">Isa 5:21</a>; <a onClick="return mV(\'Isa\',29,14);">29:14</a>; <a onClick="return mV(\'Jer\',4,22);">Jer 4:22</a>; <a onClick="return mV(\'Jer\',9,23);">9:23</a>; <a onClick="return mV(\'Jer\',18,18);">18:18</a>, etc.). Certainly at this time Israel was endeavoring to acquire a culture of her own, and there is no reason to question that Solomon had given it a powerful stimulus (<a onClick="return mV(\'1Ki\',4,\'29-34\');">1Ki 4:29-34</a>). But the times were too distracted and the moral problems too imperative to allow the more spiritually-minded any opportunity to cultivate secular learning, so that "wisdom" in Israel took on the unpleasant connotation of the quality of the shrewd court counselors, with their half-heathen advice (<a onClick="return mV(\'Isa\',28,\'14-22\');">Isa 28:14-22</a>, etc.). And the associations of the word with true religion are very few (<a onClick="return mV(\'Deu\',4,6);">De 4:6</a>; <a onClick="return mV(\'Jer\',8,8);">Jer 8:8</a>), while <a onClick="return mV(\'Deu\',32,6);">De 32:6</a>; <a onClick="return mV(\'Jer\',4,22);">Jer 4:22</a>; <a onClick="return mV(\'Jer\',8,9);">8:9</a> have a satirical sound—\'what men call "wisdom" is really folly!\' So, no matter how much material may have gathered during this period (see <a href="./study/isbe/search.html?string=PROVERBS">PROVERBS</a>), it is to the post-exilic community that we are to look for the formation of body of Wisdom literature really associated with Israel\'s religion.<P>(2) The factors that produced it were partly the same as those that produced scribism (see <a href="./study/isbe/search.html?string=SCRIBES">SCRIBES</a>). Life in Palestine was lived only on the sufferance of foreigners and must have been dreary in the extreme. Under the firm hand of Persia there were no political questions, and in later times the nation was too weak to play any part in the conflicts between Antioch and Alexandria. Prophecy had about disappeared, fulfillment of the Messianic hope seemed too far off to affect thought deeply, and the conditions were not yet ripe that produced the later flame of apocalyptic enthusiasm. Nor were there vital religious problems within the nation, now that the fight against idolatry had been won and the ritual reforms established. Artistic pursuits were forbidden (compare especially <span class="noTag">The Wisdom of Solomon 15:4-6</span>), and the Jewish temperament was not of a kind that could produce a speculative philosophy (note the sharp polemic against metaphysics, etc., in Sirach 3:21-24). It was in this period, to be sure, that Jewish commercial genius began to assert itself, but there was no satisfaction in this for the more spiritually-minded (Sirach 26:29). So, on the one hand, men were thrown back on the records of the past (scribism), while on the other the problems of religion and life were studied through sharp observation of Nature and of mankind. And the recorded results of the latter method form the Wisdom literature.<P>(3) In this are included Job, Proverbs, and Ecclesiastes, with certain psalms (notably <a onClick="return mV(\'Psa\',19,\'1-\');">Ps 19</a>; <a onClick="return mV(\'Psa\',37,\'1-\');">37</a>; <a onClick="return mV(\'Psa\',104,\'1-\');">104</a>; <a onClick="return mV(\'Psa\',107,\'1-\');">107</a>; <a onClick="return mV(\'Psa\',147,\'1-\');">147</a>; <a onClick="return mV(\'Psa\',148,\'1-\');">148</a>); in the Apocrypha must be added Sirach and Wisdom, with part of Baruch; while of the other writings of the period parts of Philo, 4 Maccabees, and the Abikar legend belong here also. How far foreign influence was at work it is hard to say. Egypt had a Wisdom literature of her own (see <a href="./study/isbe/search.html?string=EGYPT">EGYPT</a>) that must have been known to some degree in Palestine, while Babylonia and Persia could" not have been entirely without effect—but no specific dependence can be shown in any of these cases. For Greece the case is clearer, and Greek influence is obvious in Wisdom, despite the particularistic smugness of the author. But there was vitality enough in Judaism to explain the whole movement without recourse to outside influences, and, in any case, it is most arbitrary and untrue to attribute all the Wisdom speculation to Greek forces (as, e.g., does Siegfried, HDB).<P>3. Religious Basis:<P>The following characteristics are typical of the group:<P>(1) The premises are universal. The writers draw from life wherever found, admitting that in some things Israel may learn from other nations. The Proverbs of Lemuel are referred explicitly to a non-Jewish author (<a onClick="return mV(\'Pro\',31,1);">Pr 31:1</a> the Revised Version margin), and Sirach recommends foreign travel to his students (34:10,11; 39:4). Indeed, all the princes of the earth rule through wisdom (<a onClick="return mV(\'Pro\',8,16);">Pr 8:16</a>; compare <a onClick="return mV(\'Ecc\',9,15);">Ec 9:15</a>). And even some real knowledge of God can be obtained by all men through the study of natural phenomena (<a onClick="return mV(\'Psa\',19,1);">Ps 19:1</a>; Sirach 16:29-17:14; 42:15-43:33; <span class="noTag">The Wisdom of Solomon 13:2,9</span>; compare <a onClick="return mV(\'Rom\',1,20);">Ro 1:20</a>).<P>(2) But some of the writers dissent here (<a onClick="return mV(\'Job\',28,28);">Job 28:28</a>; <a onClick="return mV(\'Job\',11,7);">11:7</a>; <a onClick="return mV(\'Ecc\',2,11);">Ec 2:11</a>; <a onClick="return mV(\'Ecc\',8,16,17);">8:16,17</a>; <a onClick="return mV(\'Ecc\',11,5);">11:5</a>; The Wisdom of Solomon 9:13(?)). And in any case this wisdom needs God\'s explicit grace for its cultivation (Sirach 51:13-22; The <span class="noTag">Wisdom of Solomon 7:7; 8:21</span>), and when man trusts simply to his own attainments he is bound to go wrong (<a onClick="return mV(\'Pro\',3,\'5-7\');">Pr 3:5-7</a>; <a onClick="return mV(\'Pro\',19,21);">19:21</a>; <a onClick="return mV(\'Pro\',21,30);">21:30</a>; <a onClick="return mV(\'Pro\',28,11);">28:11</a>; Sirach 3:24; 5:2,3; 6:2; 10:12; Baruch 3:15-28). True wisdom must center about God (<a onClick="return mV(\'Pro\',15,33);">Pr 15:33</a>; <a onClick="return mV(\'Pro\',19,20);">19:20</a>f), starting from Him (<a onClick="return mV(\'Pro\',1,7);">Pr 1:7</a>; <a onClick="return mV(\'Pro\',9,10);">9:10</a>; <a onClick="return mV(\'Psa\',111,10);">Ps 111:10</a>; Sirach 21:11; <a onClick="return mV(\'Job\',28,28);">Job 28:28</a>) and ending in Him (<a onClick="return mV(\'Pro\',2,5);">Pr 2:5</a>); compare especially the beautiful passage Sirach 1:14-20. But the religious attitude is far from being the whole of Wisdom. The course is very difficult (<a onClick="return mV(\'Pro\',2,4);">Pr 2:4</a>f; <a onClick="return mV(\'Pro\',4,7);">4:7</a>; Sirach 4:17; 14:22,23; <span class="noTag">The Wisdom of Solomon 1:5; 17:1</a>); continual attention must be given every department of life, and man is never done learning (<a onClick="return mV(\'Pro\',9,9);">Pr 9:9</a>; Sirach 6:18; <a onClick="return mV(\'Ecc\',4,13);">Ec 4:13</a>).<P>(3) The attitude toward the written Law varies. In Ecclesiastes, Job and Proverbs it is hardly mentioned (<a onClick="return mV(\'Pro\',28,\'7-9\');">Pr 28:7-9</a>; <a onClick="return mV(\'Pro\',29,18);">29:18</a> (?)). Wisdom, as a special pamphlet against idolatry, has little occasion for specific reference, but its high estimate of the Law is clear enough (The <span class="noTag">Wisdom of Solomon 2:12-15; 18:9</span>). Sirach, especially, can find no terms high enough for the praise of the Law (especially Sirach 24; 36; compare <span class="noTag">9:15; 21:11</span>, etc.), and he identifies the Law with Wisdom (24:23-25) and claims the prophets as Wisdom teachers (44:3,4). Yet this perverse identification betrays the fact that Sirach\'s interest is not derived from a real study of the Law; the Wisdom that was so precious to him must be in the sacred books! Compare Baruch 4:1 (rather more sincere).<P>(4) The attitude toward the temple-worship is much the same. The rites are approved (<a onClick="return mV(\'Pro\',3,9);">Pr 3:9</a>; Sirach 35:4-8; 38:11; Sirach seems to have an especial interest in the priesthood, 7:29-33; 50:5-21), but the writers clearly have no theory of sacrifice that they can utilize for practical purposes. And for sacrifice (and even prayer, <a onClick="return mV(\'Pro\',28,9);">Pr 28:9</a>) as a substitute for righteousness no condemnation is too strong (<a onClick="return mV(\'Pro\',7,14);">Pr 7:14</a>; <a onClick="return mV(\'Pro\',15,8);">15:8</a>; <a onClick="return mV(\'Pro\',20,25);">20:25</a>; <a onClick="return mV(\'Pro\',21,3,17);">21:3,17</a>; <span class="noTag"Sirach 34:18-26; 35:1-3,12; Ec (5:1)</span>.<P>(5) An outlook on life beyond the grave is notably absent in the Wisdom literature. Wisdom is the only exception (The <span class="noTag">Wisdom of Solomon 3:1</span>, etc.), but Greek influence in Wisdom is perfectly certain. In Job there are expressions of confidence (14:13-15; 19:25-29), but these do not determine the main argument of the book. Proverbs does not raise the question, while Ecclesiastes and Sirach categorically deny immortality (<a onClick="return mV(\'Ecc\',9,\'2-10\');">Ec 9:2-10</a>; Sirach 14:16; 17:27,28; 30:4; note that the Revised Version (British and American) in Sirach 7:17; 48:11 is based on a glossed text; compare the Hebrew). Even the Messianic hope of the nation is in the background in Pr (2:21,22 (?)), and it is altogether absent in Job and Ecclesiastes. To Sirach (35:19; 36:11-14; 47:22) and Wisdom (3:8; 5:16-23) it is important, however, but not even these works have anything to say of a personal Messiah (Sirach 47:22 (?)).<P>(6) That in all the literature the individual is the center of interest need not be said. But this individualism, when combined with the weak eschatology, brought dire confusion into the doctrine of retribution (see <a href="./study/isbe/search.html?string=SIN">SIN</a>). Sirach stands squarely by the old doctrine of retribution in this life: if at no other time, a man\'s sins will be punished on his deathbed (1:13; 11:26). Neither Job nor Ecclesiastes, however, are content with this solution. The latter leaves the problem entirely unsolved (<a onClick="return mV(\'Ecc\',8,14);">8:14</A>, etc.), while the former commends it to God\'s unsearchable ways.<P>4. Ideals:<P>The basis of the Wisdom method may be described then as that of a "natural" religion respecting revelation, but not making much use of it. So the ideal is a man who believes in God and who endeavors to live according to a prudence taught by observation of this world\'s laws, with due respect, however, to Israel\'s traditional observances.<P>(1) From many standpoints the resulting character is worthy of admiration. The man was intelligent, earnest, and hard-working (Proverbs has a particular contempt for the "sluggard"; and compare <a onClick="return mV(\'Ecc\',9,10);">Ec 9:10</a>). Lying and injustice are denounced on almost every page of the literature, and unceasing emphasis is laid on the necessity for benevolence (<a onClick="return mV(\'Psa\',37,21);">Ps 37:21</a>; <a onClick="return mV(\'Psa\',112,5,9);">112:5,9</a>; <a onClick="return mV(\'Job\',22,7);">Job 22:7</a>; <a onClick="return mV(\'Job\',31,\'16-20\');">31:16-20</a>; <a onClick="return mV(\'Pro\',3,27,28);">Pr 3:27,28</a>; <a onClick="return mV(\'Pro\',14,31);">14:31</a>; <a onClick="return mV(\'Pro\',21,13);">21:13</a>; <a onClick="return mV(\'Pro\',22,9);">22:9</a>; <a onClick="return mV(\'Ecc\',11,1);">Ec 11:1</a>; Sirach 4:16; 7:34,35; 29:11-13; 40:24, etc.). All of the writers feel that life is worth the living—at their most pessimistic moments the writers of Job and Ecclesiastes find attraction in the contemplation of the world. In Proverbs and Sirach the outlook is even buoyant, Sirach in especial being far from indifferent to the good things of life (30:23-25; 31:27; compare <a onClick="return mV(\'Ecc\',2,24);">Ec 2:24</a> and contrast The <span class="noTag">Wisdom of Solomon 2:6-9</span>).<P>(2) The faults of the Wisdom ideal are the faults of the postulates. The man is always self-conscious and self-centered. All intense enthusiasms are repressed, as likely to prove entangling (<a onClick="return mV(\'Ecc\',7,16,17);">Ec 7:16,17</a> is the most extreme case), and the individual is always calculating (Sirach 38:17), even among his friends (Sirach 6:13; <a onClick="return mV(\'Pro\',25,17);">Pr 25:17</a>) and in his family (Sirach 33:19-23). Benevolence itself is to be exercised circumspectly (<a onClick="return mV(\'Pro\',6,\'1-5\');">Pr 6:1-5</a>; <a onClick="return mV(\'Pro\',20,16);">20:16</a>; Sirach 12:5-7; 29:18), and Sirach, in particular, is very far from feeling an obligation to love all men (25:7; 27:24; 30:6; 50:25,26). So "right" and "wrong" become confused with "advantage" and "disadvantage." Not only is adultery wrong (<a onClick="return mV(\'Pro\',2,17);">Pr 2:17</a>; Sirach 23:23), but the injured husband is a dangerous enemy (<a onClick="return mV(\'Pro\',5,\'9-11\',14);">Pr 5:9-11,14</a>; <a onClick="return mV(\'Pro\',6,34,35);">6:34,35</a>; Sirach 23:21). As a resuit the "moral perspective" is affected. With some of the finest moral observations in Proverbs and Sirach are combined instructions as to table manners (<a onClick="return mV(\'Pro\',23,\'1-3\');">Pr 23:1-3</a>; Sirach 31:12-18) and merely humorous observations (<a onClick="return mV(\'Pro\',20,14);">Pr 20:14</a>), while such passages as <a onClick="return mV(\'Pro\',22,\'22-28\');">Pr 22:22-28</a> and Sirach 41:17-24 contain extraordinary conglomerations of disparate motives.<P>(3) So hope of earthly recompense becomes a very explicit motive (<a onClick="return mV(\'Pro\',3,10);">Pr 3:10</a>; <a onClick="return mV(\'Pro\',11,25);">11:25</a>, etc.; The <span class="noTag">Wisdom of Solomon 7:8-12</span> is the best statement on the other side). Even though riches are nothing in themselves (<a onClick="return mV(\'Pro\',10,2);">Pr 10:2</a>; <a onClick="return mV(\'Pro\',11,28);">11:28</a>; <a onClick="return mV(\'Pro\',23,4,5);">23:4,5</a>; <a onClick="return mV(\'Pro\',28,11);">28:11</a>; <a onClick="return mV(\'Ecc\',5,13);">Ec 5:13</a>; Sirach 11:19; 31:5-7; all the literature denounces the unrighteous rich), yet Wisdom is to be desired as bringing not only righteousness but riches also (<a onClick="return mV(\'Pro\',8,21);">Pr 8:21</a>; <a onClick="return mV(\'Pro\',11,25);">11:25</a>; <a onClick="return mV(\'Pro\',13,18);">13:18</a>; Sirach 4:15; 20:27,28; <span class="noTag">The Wisdom of Solomon 6:21</span>). This same desire for advantage gives an unpleasant turn to many of the precepts which otherwise would touch the highest point; perhaps <a onClick="return mV(\'Pro\',24,17,18);">Pr 24:17,18</a> is the most extreme case: "Rejoice not when thine enemy falleth,...lest Yahweh...turn away his wrath from him" (!)<P>(4) But probably the most serious fault was that the Wisdom method tended to produce a religious aristocracy (Sirach 6:22, etc.). It was not enough that the heart and will should be right, for a long course of almost technical training was needed (the "house of instruction" in Sirach 51:23 is probably the school; compare <a onClick="return mV(\'Pro\',9,4);">Pr 9:4</a>). The uninstructed or "simple" (<a onClick="return mV(\'Pro\',1,22);">Pr 1:22</a>, etc.) were grouped quite simply with the "sinners"; knowledge was virtue and ignorance was vice. Doubtless Wisdom cried in the streets (<a onClick="return mV(\'Pro\',1,20,21);">Pr 1:20,21</a>; <a onClick="return mV(\'Pro\',8,\'1-13\');">8:1-13</a>; <a onClick="return mV(\'Pro\',9,\'1-6\');">9:1-6</a>, almost certainly a reference to the canvassing efforts of the teachers for pupils), but only men of ability and leisure could obey the call to learn. And despite all that is said in praise of manual labor (<a onClick="return mV(\'Pro\',12,11);">Pr 12:11</a>; <a onClick="return mV(\'Pro\',24,27);">24:27</a>; <a onClick="return mV(\'Pro\',28,19);">28:19</a>; Sirach 7:15; 38:31,32,34), Sirach is merely frank when he says explicitly (38:25-34) that Wisdom cannot be for artisans (a carpenter as Messiah evidently would have been unthinkable to Sirach; <a onClick="return mV(\'Mar\',6,3);">Mr 6:3</a>). Scribism was at work along the same lines of development, and the final union of the Wisdom method with the scribal produced a class who called the common people accursed (<a onClick="return mV(\'Jhn\',7,49);">Joh 7:49</a>).<P>5. Teaching of Christ:<P>The statement of the methods and ideals of the Wisdom school is also virtually a statement of our Lord\'s attitude toward it and an explanation of why much of His teaching took the form it did. As to the universality of the premises He was at one with the Wisdom writers, one great reason for the universality of the appeal of His teaching. Almost everything in the life of the time, from the lily of the field to the king on his throne, contributed its quota to His illustrations. And from the Wisdom method also the form of His teaching—the concise, antithetical saying that sticks in the memory—was derived to some degree. (Of all the sayings of Christ, perhaps <a onClick="return mV(\'Luk\',14,\'8-10\');">Lu 14:8-10</a>—a quotation of <a onClick="return mV(\'Pro\',25,6,7);">Pr 25:6,7</a>—comes nearest to the pure Wisdom type.) In common with the Wisdom writers, also, is the cheerful outlook, despite the continual prospect of the Passion, and we must never forget that all morbid asceticism was entirely foreign to Him (<a onClick="return mV(\'Luk\',7,34);">Lu 7:34</a> parallel <a onClick="return mV(\'Mat\',11,19);">Mt 11:19</a>). With the self-conscious, calculating product of the Wisdom method, however, He had no patience. Give freely, give as the Father giveth, without regard to self, in no way seeking a reward, is the burden of His teaching, and such a passage as <a onClick="return mV(\'Luk\',6,\'27-38\');">Lu 6:27-38</a> seems to have been aimed at the head of such writers as Sirach. The attack on the religious aristocracy is too familiar to need recapitulation. Men by continual exercise of worldly prudence could make themselves as impervious to His teaching as by obstinate adherence to a scribal tradition, while His message was for all men on the sole basis of a desire for righteousness on their part. This was the true Wisdom, fully justified of her children (<a onClick="return mV(\'Luk\',7,35);">Lu 7:35</a>; compare <a onClick="return mV(\'Mat\',11,19);">Mt 11:19</a>), while, as touching the other "Wisdom," Christ could give thanks that God had seen fit to hide His mysteries from the wise and prudent and reveal them unto "babes" (<a onClick="return mV(\'Luk\',10,21);">Lu 10:21</a> parallel <a onClick="return mV(\'Mat\',11,25);">Mt 11:25</a>).<P>6. Remainder of the New Testament:<P>(1) James<P>The remainder of the New Testament, despite many occurrences of the words "wise," "wisdom," etc., contains very little that is really relevant to the technical sense of the words. The one notable exception is James, which has even been classed as "Wisdom literature," and with some justice. For James has the same appeal to observation of Nature (<a onClick="return mV(\'Jas\',1,11);">1:11</a>; <a onClick="return mV(\'Jas\',3,\'3-6\'.11.12);">3:3-6,11,12</a>; <a onClick="return mV(\'Jas\',5,7);">5:7</A>, etc.), the same observation of human life (<a onClick="return mV(\'Jas\',2,2,3,15,16);">2:2,3,15,16</a>; <a onClick="return mV(\'Jas\',4,13);">4:13</A>, etc.), the same antithetical form, and even the same technical use of the word "wisdom" (<a onClick="return mV(\'Jas\',1,5);">1:5</A>; <a onClick="return mV(\'Jas\',3,15,16,17);">3:15-17</a>). The fiery moral zeal, however, is far above that of the other Wisdom books, even above that of Job.<P>(2) Paul<P>Paul, on the other hand, belongs to an entirely different class, that of intense religious experience, seeking its premises in revelation. So the Wisdom method is foreign to him and the absence of Nature illustrations from his pages is notorious (even <a onClick="return mV(\'Rom\',11,17);">Ro 11:17</a> is an artificially constructed figure). Only one passage calls for special comment. The "wisdom" against which he inveighs in <a onClick="return mV(\'1Cr\',1,\'1-\');">1Co 1-3</a> is not Jewish but Greek-speculation in philosophy, with studied elegance in rhetoric. Still, Jewish or Greek, the moral difficulty was the same. God\'s message was obscured through an overvaluation of human attainments, and so Paul\'s use of such Old Testament passages as <a onClick="return mV(\'Isa\',29,14);">Isa 29:14</a>; <a onClick="return mV(\'Job\',5,13);">Job 5:13</a>; <a onClick="return mV(\'Psa\',94,11);">Ps 94:11</a> (in <a onClick="return mV(\'1Cr\',1,19);">1Co 1:19</a>; <a onClick="return mV(\'1Cr\',3,19,20);">3:19,20</a>) is entirely lust. Against this "wisdom" Paul sets the doctrine of the Cross, something that outraged every human system but which, all the more, taught man his entire dependence on God.<P>Yet Paul had a "wisdom" of his own (<a onClick="return mV(\'1Cr\',2,6);">1Co 2:6</a>), that he taught to Christians of mature moral (not intellectual: <a onClick="return mV(\'1Cr\',3,\'1-3\');">1Co 3:1-3</a>) progress. Some commentators would treat this wisdom as doctrinal and find it in (say) Romans; more probably it is to be connected with the mystical experiences of the Christian whose life has become fully controlled by the Spirit (<a onClick="return mV(\'1Cr\',2,\'10-13\');">1Co 2:10-13</a>). For religious progress is always accompanied by a higher insight that can never be described satisfactorily to persons without the same experience (<a onClick="return mV(\'1Cr\',2,14);">1Co 2:14</a>).<P>7. Hypostasis:<P>(1) One characteristic of the Wisdom writers that proved of immense significance for later (especially Christian) theology was a love of rhetorical personification of Wisdom (<a onClick="return mV(\'Pro\',1,\'20-33\');">Pr 1:20-33</a>; <a onClick="return mV(\'Pro\',8,1);">8:1-9:6</a>; Sirach 4:11-19; 6:23-31; 14:20-15:10; 24; 51:13-21; The <span class="noTag">Wisdom of Solomon 6:12-9:18</span>; Baruch 3:29-32). Such personifications in themselves are not, of course, remarkable (compare e.g. the treatment of "love" in <a onClick="return mV(\'1Cr\',13,\'1-\');">1Co 13</a>), but the studied, somewhat artificial style of the Wisdom writers carries out the personification with a curious elaboration of details: Wisdom builds her house, marries her disciple, mingles wine, etc. The most famous passage is <a onClick="return mV(\'Pro\',8,\'22-31\');">Pr 8:22-31</a>, however. The Wisdom that is so useful to man was created before man, before, indeed, the creation of the world. When the world was formed she was in her childhood, and while God formed the world she engaged in childish play, under His shelter and to His delight. So <a onClick="return mV(\'Pro\',8,30);">Pr 8:30</a> should be rendered, as the context makes clear that \'mwn should be pointed \'amun, "sheltered," and not \'amon, "as a master-workman." And "Wisdom" is a quality of man (<a onClick="return mV(\'Pro\',8,\'31-36\');">Pr 8:31-36</a>), not a quality of God.<P>(2) Indeed, "Wisdom" is an attribute rarely predicated of God in the Old Testament (<a onClick="return mV(\'1Ki\',3,28);">1Ki 3:28</a>; <a onClick="return mV(\'Isa\',10,13);">Isa 10:13</a>; <a onClick="return mV(\'Isa\',31,2);">31:2</a>; <a onClick="return mV(\'Jer\',10,12);">Jer 10:12</a>; <a onClick="return mV(\'Jer\',51,15);">51:15</a>; compare <a onClick="return mV(\'Dan\',5,11);">Da 5:11</a>), even in the Wisdom writers (<a onClick="return mV(\'Job\',5,12);">Job 5:12</a>ff; <a onClick="return mV(\'Job\',9,4);">9:4</a>; <a onClick="return mV(\'Psa\',104,24);">Ps 104:24</a>; <a onClick="return mV(\'Pro\',3,19);">Pr 3:19</a>). Partly this reticence seems to be due to a feeling that God\'s knowledge is hardly to be compared in kind to man\'s, partly to the fact that to the earlier writers "Wisdom" had a profane sound. Later works, however, have less hesitation in this regard (e.g., Sirach 42:21; Baruch 3:32, the Massoretic Text pointing and the Septuagint of <a onClick="return mV(\'Pro\',8,30);">Pr 8:30</a>), so that the personifications became personifications of a quality of God. The result was one of the factors that operated to produce the doctrine of the "Word" as it appeared in the Palestinian form.<P>See <a href="./study/isbe/search.html?string=LOGOS">LOGOS</a>.<P>(3) In the Apocrypha, however, the most advanced step is taken in Wisdom. Wisdom is the only-begotten of God (<span class="noTag">The Wisdom of Solomon 7:22</span>), the effulgence of eternal light (<span class="noTag">The Wisdom of Solomon 7:26</span>; compare <a onClick="return mV(\'Hbr\',1,3);">Heb 1:3</a>), living with God (The <span class="noTag">Wisdom of Solomon 8:3</span>) and sharing (?) His throne (The <span class="noTag">Wisdom of Solomon 9:4</span<). She is the origin (or "mother") of all creatures (<span class="noTag">The Wisdom of Solomon 7:12</span>; compare <span class="noTag">8:6</span>), continually active in penetrating (The <span class="noTag">Wisdom of Solomon 7:24</span>), ordering (The <span class="noTag">Wisdom of Solomon 8:1</span>), and renewing (The <span class="noTag">Wisdom of Solomon 7:27</span>) all things, while carrying inspiration to all holy souls (The <span class="noTag">Wisdom of Solomon 7:23</span>), especially to Israel (The <span class="noTag">Wisdom of Solomon 10:17,18</span<). Here there is no doubt that the personification has ceased to be rhetorical and has become real. Wisdom is thought of as a heavenly being, not so distinctively personal, perhaps, as an angel, but none the less far more than a mere rhetorical term; i.e. she is a "hypostasis."<P>(4) Most of Wisdom\'s description is simply an expansion of earlier Palestinian concepts, but it is evident that other influence has been at work also and that that influence was Greek. The writer of Wisdom was touched genuinely by the Greek philosophy, and in The <span class="noTag">Wisdom of Solomon 7:24</span>, at any rate, his "Wisdom" is the logos spermatikos of the Stoics, with more than suspicions of Greek influence elsewhere in the descriptions. This combination of Jewish and Greek thought was still further elaborated by Philo—and still further confused. For Philo endeavored to operate with the Wisdom doctrine in its Palestinian form, the Wisdom doctrine into which Wisdom had already infused some Loges doctrine, and the Logos doctrine by itself, without thoroughly understanding the discordant character of his terms. The result is one of the most obscure passages in Philo\'s system. Sometimes, as in DeFug. section 109, chapter xx, Wisdom is the mother of the Logos, as God is its Father (compare Cherubim, sections 49,50,chapter xiv), while, again, the relation can be inverted almost in the same context and the Logos appears as the source of Wisdom (De Fug. section 97, chapter xviii).<P>See <a href="./study/isbe/search.html?string=LOGOS">LOGOS</a>.<P>(5) Philo\'s influence was incalculable, and Wisdom, as a heavenly power, plays an almost incredible role in the Gnostic speculations of the 2nd and 3rd centuries, the Gnostic work, Pistis Sophia, probably attaining the climax of unreality. The orthodox Fathers, however, naturally sought Wisdom within the Trinity, and Irenaeus made an identification with the Holy Spirit (iv. 20, 3). Tertullian, on the other hand, identified Wisdom with the Son (probably following earlier precedent) in Adv. Prax.,7,and this identification attained general acceptation. So <a onClick="return mV(\'Pro\',8,\'22-30\');">Pr 8:22-30</a> became a locus classicus in the Christological controversies (an elaborate exposition in Athanaslus, Orat. ii. 16-22), and persisted as a dogmatic proof-text until a very modern period.<P>LITERATURE.<P>The Old Testament Theologies, particularly those of Smend, edition 2 (1899), and Bertholet (1911). For the intermediate period, GJV, III, edition 4 (1909), and Boasset, Die Religion des Judentums, edition 2 (1906). Special works: Toy, "Wisdom Literature," EB, IV (1903); Meinhold, Die Weisheit Israels (1908); Friedlander, Griechische Philosophie im Altes Testament (1904, to be used cautiously). On Philo, compare especially Drummond, Philo Judaeus, II, 201-13 (1888).`<a href="./study/isbe/search.html?string=LOGOS">LOGOS</a>; <a href="./study/isbe/search.html?string=PHILO,+JUDAEUS">PHILO, JUDAEUS</a>`48';
isbe[9220]='Wisdom Literature`lit\'-er-a-tur.`<a href="./study/isbe/search.html?string=WISDOM">WISDOM</a>`1';
isbe[9221]='Wisdom of God`(sophia): <a onClick="return mV(\'Luk\',11,49);">Lu 11:49</a> reads: "Therefore also said the wisdom of God, I will send unto them prophets and apostles; and some of them they shall kill and persecute." The patristic and many later commentators, on the basis of the parallel in <a onClick="return mV(\'Mat\',23,34);">Mt 23:34</a>, took "wisdom of God" here to be a self-designation of Christ—an interpretation, however, that is obviously impossible. Somewhat similar is the view (Meyer) that treats the words as a Lukan designation of Christ, with the assumption that Luke here reintroduces Christ as the speaker in order to give solemnity to the judgment pronounced. But this is incredibly awkward and has no parallel in the Lukan use for even more solemn passages. Much simpler is the interpretation (Hofmann, B. Weiss, Plummer) that regards Christ as announcing here a decree formed by God in the past. But it is the behavior of the present generation that is in point (compare <a onClick="return mV(\'Luk\',13,8,9);">Lu 13:8,9</a>; <a onClick="return mV(\'Luk\',20,13);">20:13</a>; altogether different is <a onClick="return mV(\'Luk\',10,21);">Lu 10:21</a>). And the circumstantial wording of what follows is inappropriate for such a decree, is without parallel in Christ\'s teaching, and implies rather a written source. In the Old Testament, however, no passage exists that resembles this (<a onClick="return mV(\'Pro\',1,\'20-31\');">Pr 1:20-31</a> (so Godet) is quite out of the question). So many exegetes (Holtzmann, J. Weiss, Loisy, Harnack) find here a quotation from some lost source that our Lord approved and that was familiar to His hearers. This is certainly the most natural explanation. Nor can it be said to be impossible that Christ recognized genuine prophetic inspiration in some writing that was meant to have transitory value only and not to be preserved for future generations. Perhaps this bore the title "Wisdom of God" or represented "Wisdom" as speaking, as in <a onClick="return mV(\'Pro\',1,\'22-33\');">Pr 1:22-33</a>.``48';
isbe[9222]='Wisdom of Jesus``<a href="./study/isbe/search.html?string=SIRACH">SIRACH</a>`1';
isbe[9223]='Wisdom of Solomon, the`<b>I. NAME</b><P><b>II. CANONICITY</b><P><b>III. CONTENTS</b><P class="in15">1. The Wisdom Section, The <span class="noTag">Wisdom of Solomon 1:1-11:14</span><P class="in15">2. The Historical Section, The <span class="noTag">Wisdom of Solomon 11:5-19:22</span><P><b>IV. LITERARY FORM</b><P><b>V. UNITY AND INTEGRITY</b><P><b>VI. TEACHING</b><P class="in15">1. Theology<P class="in15">2. Anthropology<P class="in15">3. Deontology<P class="in15">4. Hamartiology<P class="in15">5. Soteriology<P class="in15">6. Eschatology<P><b>VII. AIM</b><P><b>VIII. AUTHOR</b><P><b>IX. DATE</b><P class="in15">1. Literary<P class="in15">2. Historical<P class="in15">3. Philosophical<P><b>X. ORIGINAL LANGUAGE</b><P><b>XI. USE OF WISDOM BY CHRISTIAN WRITERS</b><P><b>XII. TEXT AND VERSIONS</b><P class="in15">1. Latin<P class="in15">2. Syriac<P><b>LITERATURE</b><hr /><P>I. Name.<P>In the Greek manuscripts (Codex Vaticanus, Codex Alexandrinus, Codex Sinaiticus, etc.) the book is called "The Wisdom of Solomon" Sophia Salomonos, the form of the latter word varying in the best manuscripts). In the Syriac (Peshitta) its title is "The Book of the Great Wisdom of Solomon." Solomon was among the Jews and the early Christians the patron of didactic, as David was of lyrical, and Moses of religious-legal, literature, and their names came to be associated with literary compositions with which they had nothing to do. We read in the Old Testament of the wisdom of Solomon (<a onClick="return mV(\'1Ki\',3,\'7-14\');">1Ki 3:7-14</a>; compare Sirach 47:12-18 (14-19)), and the whole of the Book of Proverbs is called by his name, though he is at most the author of but a part. Solomon speaks in the first person in this book (<span class="noTag">The Wisdom of Solomon 6-9</span>), as he does in <a onClick="return mV(\'Ecc\',1,12);">Ec 1:12</a>ff, for that he is made the speaker until the close of <span class="noTag">The Wisdom of Solomon 9 is made certain by 7:1ff; 9:2ff</span>. As long as he was thought to be the composer of this book it continued to be called "The Wisdom of Solomon" among the Jews and the early Christians.<P>Influenced by the Greek thought and style of the book, Jerome came to the conclusion that Solomon was not its author and he accordingly altered its title to "The Book of Wisdom" (Liber sapientiae), and it is this designation that the book bears in the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) and the versions made from it, though in the Protestant translations (German, English, Welsh, etc.) the title "The Wisdom of Solomon" is continued, as these, follow the Greek version and not the Latin Luther\'s title is The Wisdom of Solomon to Tyrants". (Die Weisheit Salamos an die Tyrannen). Epiphanius and Athanasius quote the book under the name "All-Virtuous Wisdom" (Panaretos Sophia), a title by which Proverbs and Sirach are also known in the writings of some of the Fathers.<P>II. Canonicity.<P>In the manuscripts and odd of the Greek Bible and in the Vulgate, English Versions of the Bible, etc., Wisdom follows Proverbs, Ecclesiastes, and Canticles, and is followed by Sirach. Some of the Fathers, believing the book to be by Solomon, thought it divinely-inspired and therefore canonical; so Hippolytus, Cyprian, Ambrose, etc. Other Fathers, though denying the Solomonian authorship of the book, yet accorded it canonical rank; so Origen, Eusebius, Augustine, etc. On the other hand there were some in the early church who refused to acknowledge the book as in any way authoritative in matters of doctrine. The Council of Trent included it with the rest of the Protestant Apocrypha (except 1 and 2Esdras and Pr Man) in the Canon, so that the Romanist Bible includes it, but the Protestant Bible excludes it.<P>III. Contents.<P>The book is made up of two main parts so different as to suggest difference of authorship.<P>(1) The wisdom section (The <span class="noTag">Wisdom of Solomon 1:1-11:4</span>): In this part the writer describes and commends Wisdom, warning his readers against neglecting it.<P>(2) The historical section (The <span class="noTag">Wisdom of Solomon 11:5-19:22</span>).<P>1. The Wisdom Section, The <span class="noTag">Wisdom of Solomon 1:1-11:14</span>:<P>(1) Righteousness:<P>Righteousness (i.e. Wisdom in operation) leads to immortality, unrighteousness to death (The <span class="noTag">Wisdom of Solomon 1</span>).<P>(2) Contrasted Fortunes of the Wise (Righteous) and Unwise (Ungodly) (The <span class="noTag">Wisdom of Solomon 2:1-6:21</span>).<P>(a) Sensual pleasures issue in death while God intended all men to live spiritually (The <span class="noTag">Wisdom of Solomon 2</span>);<P>(b) the lot of the wise (righteous) is a happy one. Their sufferings are disciplinary and remedial; they shall live forever and reign hereafter over the nations (Gentiles) (The <span class="noTag">Wisdom of Solomon 3:1-9</span>);<P>(c) but the lot of the wicked and of their children is a miserable one; the wise (righteous) shall be happy though childless (The <span class="noTag">Wisdom of Solomon 3:10-19</span>);<P>(d) virtuous childlessness secures immortality before guilty parenthood (The <span class="noTag">Wisdom of Solomon 4:1-6</span>);<P>(e) though the wise (righteous) die early, yet they have rest in their death, and accomplish their life mission in the allotted time (of Enoch) (The <span class="noTag">Wisdom of Solomon 4:7-14</span>);<P>(f) the ungodly (unwise) shall come to a wretched end: then they shall see and envy the prosperity of the righteous. Though they shall pass tracelessly away, the righteous shall rejoice in a life that is endless (<span class="noTag">The Wisdom of Solomon 4:15-5:23</span>);<P>(g) kings ought therefore to rule according to Wisdom and thus attain to immortality (<span class="noTag">The Wisdom of Solomon 6:1-21</span).<P>(3) Wisdom.<P>Speaking in the name of Solomon, the writer praises Wisdom and commends it to kings ("judges"= "rulers" in The <span class="noTag">Wisdom of Solomon 6:1</span>, is but a synonym) (The <span class="noTag">Wisdom of Solomon 6:1-11:4</span>).<P>(a) All men come into the world with the same universal need of Wisdom which leads to true kingship and immortality (The <span class="noTag">Wisdom of Solomon 6:1-25</span>);<P>(b) I (Solomon) sought Wisdom as the main thing and in obtaining it had along with it every good thing, including knowledge of every kind (The <span class="noTag">Wisdom of Solomon 7:1-8:21</span>);<P>(c) the prayer which Solomon offered for Wisdom (The <span class="noTag">Wisdom of Solomon 9:1-18</span>);<P>(d) how Wisdom defended the heroes of Hebrew history, from the first man, Adam, to the Israelites at the Red Sea and in the wilderness (The <span class="noTag">Wisdom of Solomon 10:1-11:4</span>).<P>2. The Historical Section, <span class="noTag">The Wisdom of Solomon 11:5-19:22</span>:<P>In this second part of the book Solomon no longer speaks in the first person (as in <span class="noTag">The Wisdom of Solomon 6-9</span>), nor is Wisdom once mentioned or for certain referred to, though most writers see in this part the attempt of the author of The <span class="noTag">Wisdom of Solomon 1:1-11:4</span> to exemplify in concrete instances the working of that Wisdom of which in the first part he describes the nature and issues.<P>(1) Contrasted treatment by God (not Wisdom) of the Israelites and their foes (The <span class="noTag">Wisdom of Solomon 11:5-12</span>). By what things their foes were punished they were benefited (<span class="noTag">The Wisdom of Solomon 11:5</span>).<P>(a) The Egyptians (The <span class="noTag">Wisdom of Solomon 11:5-12:2</span>): Water a boon to Israel, a bane to Egypt (The <span class="noTag">Wisdom of Solomon 11:6-14</span>). The Egyptians punished by the animals they worshipped (The <span class="noTag">Wisdom of Solomon 11:15-20</span>), though there was a relenting on God\'s part that sinners might repent (The <span class="noTag">Wisdom of Solomon 11:2
