isbe[9240]='Woof`woof (\'erebh, "mixture," "woof" (<a onClick="return mV(\'Lev\',13,48);">Le 13:48</a>)).`<a href="./study/isbe/search.html?string=WARP">WARP</a>`1';
isbe[9241]='Wool`wool (tsemer; erion): Wool and flax were the fibers most used by the ancient weavers. Wool was used principally for the outside garments (<a onClick="return mV(\'Lev\',13,48);">Le 13:48</a>ff; <a onClick="return mV(\'Pro\',31,13);">Pr 31:13</a>; <a onClick="return mV(\'Eze\',34,3);">Eze 34:3</a>; <a onClick="return mV(\'Hsa\',2,5,9);">Ho 2:5,9</a>). Syrian wool is found on the world\'s markets today, but it is not rated as first quality, partly because it is so contaminated with thorns, straw and other foreign matter which become entangled with the wool while the sheep are wandering over the barren, rocky mountain sides in search of food. Extensive pastures are almost unknown.<P>Two kinds of wool are sold:<P>(1) That obtained by shearing. This is removed from the animal as far as possible in one piece or fleece usually without previous washing. The fleeces are gathered in bales and carried to a washing-place, which is usually one of the stony river beds, with but a small stream flowing through it during the summer. The river bed is chosen because the rocks are clean and free from little sticks or straw which would cling to the washed wool. The purchaser of this washed wool submits it to a further washing with soap, ishnan (alkali plant), "soapwort", or other cleansing agent (see <a href="./study/isbe/search.html?string=FULLER">FULLER</a>), and then cards it before spinning and weaving. The wool thus obtained is nearly snow white.<P>(2) The second supply of wool is from the tanneries where the wool is removed from the skins with slaked lime (see <a href="./study/isbe/search.html?string=TANNER">TANNER</a>). This is washed in many changes of water and used for stuffing mattresses, quilts, etc., but not for weaving.<P>Gideon used a fleece of wool to seek an omen from God (<a onClick="return mV(\'Jdg\',6,37);">Jud 6:37</a>). Mesha, king of Moab, sent a large quantity of wool as a tribute to the king of Israel (<a onClick="return mV(\'2Ki\',3,4);">2Ki 3:4</a>). Wool was forbidden to be woven with linen (<a onClick="return mV(\'Deu\',2,11);">De 2:11</a>; compare <a onClick="return mV(\'Lev\',19,19);">Le 19:19</a>). Priests could not wear woolen garments (<a onClick="return mV(\'Eze\',44,17);">Eze 44:17</a>). Wool dyed scarlet with the qermes was used in the blood-covenant ceremony (<a onClick="return mV(\'Hbr\',9,19);">Heb 9:19</a>; compare <a onClick="return mV(\'Lev\',14,\'1-\');">Le 14</a>; <a onClick="return mV(\'Num\',19,6);">Nu 19:6</a>).<P>The whiteness of wool was used for comparison<P>(1) with snow (<a onClick="return mV(\'Psa\',147,16);">Ps 147:16</a>);<P>(2) with sins forgiven (<a onClick="return mV(\'Isa\',1,18);">Isa 1:18</a>);<P>(3) with hair (<a onClick="return mV(\'Dan\',7,9);">Da 7:9</a>; <a onClick="return mV(\'Rev\',1,14);">Re 1:14</a>).``133';
isbe[9242]='Word`wurd: The commonest term in the Old Testament for "word" is dabhar (also "matter" "thing"); in the New Testament logos ("reason," "discourse," "speech"); but also frequently rhema. Rhema is a "word" in itself considered; logos is a spoken word, with reference generally to that which is in the speaker\'s mind. Some of the chief applications of the terms may thus be exhibited:<P>(1) We have the word of Yahweh (or God; see below)<P>(a) as the revelation to the patriarch, prophet, or inspired person (<a onClick="return mV(\'Gen\',15,1);">Ge 15:1</a>; <a onClick="return mV(\'Exd\',20,1);">Ex 20:1</a>; <a onClick="return mV(\'Num\',22,38);">Nu 22:38</a>, etc.);<P>(b) as spoken forth by the prophet (<a onClick="return mV(\'Exd\',4,30);">Ex 4:30</a>; <a onClick="return mV(\'Exd\',34,1);">34:1</a>; <a onClick="return mV(\'2Ki\',7,1);">2Ki 7:1</a>; <a onClick="return mV(\'Isa\',1,10);">Isa 1:10</a>, etc.).<P>(2) The word is often a commandment, sometimes equivalent to "the Law" (<a onClick="return mV(\'Exd\',32,28);">Ex 32:28</a>; <a onClick="return mV(\'Num\',20,24);">Nu 20:24</a>; <a onClick="return mV(\'Deu\',6,6);">De 6:6</a>; <a onClick="return mV(\'Psa\',105,8);">Ps 105:8</a>; <a onClick="return mV(\'Psa\',119,11,17);">119:11,17</a>; <a onClick="return mV(\'Isa\',66,2);">Isa 66:2</a>, etc.).<P>(3) As a promise and ground of hope (<a onClick="return mV(\'Psa\',119,25,28,38);">Ps 119:25,28,38</a>, etc.; <a onClick="return mV(\'Psa\',130,5);">130:5</A>, etc.).<P>(4) As creative, upholding, and preserving (<a onClick="return mV(\'Psa\',33,6);">Ps 33:6</a>; compare <a onClick="return mV(\'Gen\',1,3);">Ge 1:3</a>; <a onClick="return mV(\'Psa\',147,15,18);">Ps 147:15,18</a>; <a onClick="return mV(\'Hbr\',1,3);">Heb 1:3</a>; <a onClick="return mV(\'Hbr\',11,3);">11:3</a>; <a onClick="return mV(\'2Pe\',3,5,7);">2Pe 3:5,7</a>).<P>(5) As personified (in Apocrypha, The Wisdom of Solomon 18:15; Ecclesiasticus 1:5, the Revised Version margin "omitted by the best authorities").<P>(6) As personal (<a onClick="return mV(\'Jhn\',1,1);">Joh 1:1</a>). Logos in Philo and Greek-Jewish philosophy meant both reason or thought and its utterance, "the whole contents of the divine world of thought resting in the Nous of God, synonymous with the inner life of God Himself and corresponding to the logos endiathetos of the human soul; on the other hand, it is the externalizing of this as revelation corresponding to the logos prophorikos in which man\'s thought finds expression (Schultz). Compare also the references to Creation by "the word of God" and its personifications; see <a href="./study/isbe/search.html?string=LOGOS">LOGOS</a>; incarnated in Jesus Christ (<a onClick="return mV(\'Jhn\',1,14);">Joh 1:14</a>; <a onClick="return mV(\'1Jo\',1,1,2);">1Joh 1:1,2</a>; <a onClick="return mV(\'Rev\',19,13);">Re 19:13</a>, "His name is called, The Word of God," Ho Logos tou Theou). See <a href="./study/isbe/search.html?string=PERSON+OF+CHRIST">PERSON OF CHRIST</a>.<P>(7) Cannot be broken, endureth forever (<a onClick="return mV(\'2Ki\',10,10);">2Ki 10:10</a>; <a onClick="return mV(\'Psa\',119,89);">Ps 119:89</a>; <a onClick="return mV(\'Isa\',40,8);">Isa 40:8</a>, etc.).<P>(8) A designation of the gospel of Christ: sometimes simply "the word"; with Jesus "the word of the Kingdom" (<a onClick="return mV(\'Mat\',13,19);">Mt 13:19</a>; <a onClick="return mV(\'Mar\',2,2);">Mr 2:2</a>; <a onClick="return mV(\'Act\',4,4,29,31);">Ac 4:4,29,31</a>, etc.). In John\'s Gospel Jesus frequently speaks of His "word" and "works" as containing the divine revelation and requirements made through Him, which men are asked to believe in, cherish and obey (<a onClick="return mV(\'Jhn\',5,24);">Joh 5:24</a>; <a onClick="return mV(\'Jhn\',6,63,68);">6:63,68</a>, etc.); "the words of God" (<a onClick="return mV(\'Jhn\',3,34);">Joh 3:34</a>; <a onClick="return mV(\'Jhn\',8,47);">8:47</a>; <a onClick="return mV(\'Jhn\',14,10);">14:10</a>; <a onClick="return mV(\'Jhn\',17,8,14);">17:8,14</a>, etc.); His "word" (logos and rhema) is to be distinguished from lalia, speech (compare <a onClick="return mV(\'Mat\',26,73);">Mt 26:73</a>; <a onClick="return mV(\'Mar\',14,70);">Mr 14:70</a>), translated "saying," <a onClick="return mV(\'Jhn\',4,42);">Joh 4:42</a> (<a onClick="return mV(\'Jhn\',4,41);">4:41</a>, "Many more believed because of his own word" (logos); <a onClick="return mV(\'Jhn\',4,42);">4:42</A>, "not because of thy saying" (lalia), the Revised Version (British and American) "speaking"); in the only other occurrence of lalia in this Gospel (<a onClick="return mV(\'Jhn\',8,43);">Joh 8:43</a>) Jesus uses it to distinguish the outward expression from the inner meaning, "Why do ye not understand my speech?" (lalia), "Even because ye cannot hear my word" (logos).<P>(9) "Words" are distinguished from "power" (<a onClick="return mV(\'1Cr\',4,20);">1Co 4:20</a>; <a onClick="return mV(\'1Th\',1,5);">1Th 1:5</a>); are contrasted with "deed" (<a onClick="return mV(\'Mal\',2,17);">Mal 2:17</a>; <a onClick="return mV(\'1Cr\',4,20);">1Co 4:20</a>; <a onClick="return mV(\'1Jo\',3,18);">1Joh 3:18</a>). (10) Paul refers to "unspeakable words" (arrheta rhemata) which he heard in Paradise (<a onClick="return mV(\'2Cr\',12,4);">2Co 12:4</a>), and to "words (logoi)...which the Spirit teacheth" (<a onClick="return mV(\'1Cr\',2,13);">1Co 2:13</a>).<P>For "word" the Revised Version (British and American) has "commandment" (<a onClick="return mV(\'Num\',4,45);">Nu 4:45</a>, etc.); for "words," "things" (<a onClick="return mV(\'Jhn\',7,9);">Joh 7:9</a>; <a onClick="return mV(\'Jhn\',8,30);">8:30</a>; <a onClick="return mV(\'Jhn\',9,22,40);">9:22,40</a>; <a onClick="return mV(\'Jhn\',17,1);">17:1</a>), "sayings" (<a onClick="return mV(\'Jhn\',10,21);">Joh 10:21</a>; <a onClick="return mV(\'Jhn\',12,47,48);">12:47,48</a>); for "enticing words," "persuasiveness of speech" (<a onClick="return mV(\'Col\',2,4);">Col 2:4</a>); conversely, "word" for "commandment" (<a onClick="return mV(\'Num\',24,13);">Nu 24:13</a>; <a onClick="return mV(\'Num\',27,14);">27:14</a>; <a onClick="return mV(\'Jos\',8,8);">Jos 8:8</a>, etc.), with numerous other changes.``185';
isbe[9243]='Work; Works`wurk, wurks: "To work" in the Old Testament is usually the translation of \'asah, or of pa\'al (of the works both of God and of man), and "work" (noun) is most frequently the translation of ma\'aseh, or mela\'khah; in the New Testament of energeo, ergazomai (and compound), with ergon (noun). The word "works" (erga) is a favorite designation in John for the wonderful works of Jesus (<a onClick="return mV(\'Jhn\',5,36);">5:36</A>; <a onClick="return mV(\'Jhn\',10,38);">10:38</A>; <a onClick="return mV(\'Jhn\',15,24);">15:24</A>, etc.; "miracles" to us, "works" to Him). "Works" is used by Paul and James, in a special sense, as denoting (with Paul) those legal performances by means of which men sought to be accepted of God, in contradistinction to that faith in Christ through which the sinner is justified apart from all legal works (<a onClick="return mV(\'Rom\',3,27);">Ro 3:27</a>; <a onClick="return mV(\'Rom\',4,2,6);">4:2,6</a>, etc.; <a onClick="return mV(\'Gal\',2,16);">Ga 2:16</a>; <a onClick="return mV(\'Gal\',3,2,5,10);">3:2,5,10</a>), "working through love" (<a onClick="return mV(\'Gal\',5,6);">Ga 5:6</a>; <a onClick="return mV(\'1Th\',1,3);">1Th 1:3</a>), and is fruitful in all truly "good works," in which Christian believers are expected to abound (<a onClick="return mV(\'2Cr\',9,8);">2Co 9:8</a>; <a onClick="return mV(\'Eph\',2,10);">Eph 2:10</a>; <a onClick="return mV(\'Col\',1,10);">Col 1:10</a>; <a onClick="return mV(\'2Th\',2,17);">2Th 2:17</a>, etc.). When James speaks of being justified by "works" as well as by "faith" (<a onClick="return mV(\'2Th\',2,\'14-26\);">2:14-26</A>), he has in view those works which show faith to be real and vital. "Dead works" avail nothing (compare <a onClick="return mV(\'Hbr\',9,14);">Heb 9:14</a>; <a onClick="return mV(\'Hbr\',10,24);">10:24</a>). Judgment is according to "works" (<a onClick="return mV(\'Mat\',16,27);">Mt 16:27</a>, the Revised Version (British and American) "deeds," margin "Greek: \'doing\' " praxis; <a onClick="return mV(\'Rom\',2,6);">Ro 2:6</a>; <a onClick="return mV(\'1Pe\',1,17);">1Pe 1:17</a>, etc.), the new life being therein evidenced. A contrast between "faith" and "good works" is never drawn in the New Testament.`<a href="./study/isbe/search.html?string=JUSTIFICATION">JUSTIFICATION</a>`185';
isbe[9244]='Worker; Workfellow; Workman`wur\'-der, wurk\'-fel-o, wurk\'-man (charash, pa\'al; ergates, sunergos): "Worker" (artificer) is the translation of charash, "to cut in" (<a onClick="return mV(\'1Ki\',7,14);">1Ki 7:14</a>, "a worker in brass"), and of charash, "artificer," etc. (<a onClick="return mV(\'1Ch\',22,15);">1Ch 22:15</a>); "workers of stone," rendered "workman," "workmen" (<a onClick="return mV(\'Isa\',40,20);">Isa 40:20</a>; <a onClick="return mV(\'Isa\',44,11);">44:11</a>; <a onClick="return mV(\'Jer\',10,3,9);">Jer 10:3,9</a>, "artificer"; <a onClick="return mV(\'Hsa\',8,6);">Ho 8:6</a>); \'asah, "to work," is translated "workers" of iniquity (<a onClick="return mV(\'Psa\',37,1);">Ps 37:1</a>, "them that work unrighteousness"); \'asah mela\'khah, "to do work" (<a onClick="return mV(\'2Ki\',12,14,15);">2Ki 12:14,15</a>, "workmen," "them that did the work"; <a onClick="return mV(\'1Ch\',22,15);">1Ch 22:15</a>; <a onClick="return mV(\'2Ch\',24,13);">2Ch 24:13</a>, etc.; <a onClick="return mV(\'Ezr\',3,9);">Ezr 3:9</a>);\'aneshe mela\'khah, "men of work" (<a onClick="return mV(\'1Ch\',25,1);">1Ch 25:1</a>, "workmen," "them that did the work"); \'amel, "working," "toiling" (<a onClick="return mV(\'Jdg\',5,26);">Jud 5:26</a>, "put...her right hand to the workmen\'s hammer"); pa\'al, "to act," "do," when translated "workers," is joined with "iniquity," "workers of iniquity" (<a onClick="return mV(\'Job\',31,3);">Job 31:3</a>; <a onClick="return mV(\'Job\',34,8,22);">34:8,22</a>; <a onClick="return mV(\'Psa\',5,5);">Ps 5:5</a>; <a onClick="return mV(\'Psa\',6,8);">6:8</a>; <a onClick="return mV(\'Psa\',14,4);">14:4</a>, etc.; <a onClick="return mV(\'Pro\',10,29);">Pr 10:29</a>; <a onClick="return mV(\'Pro\',21,15);">21:15</a>); ergates, "worker," is translated "workman" (<a onClick="return mV(\'Mat\',10,10);">Mt 10:10</a>, "laborer"; <a onClick="return mV(\'2Ti\',2,15);">2Ti 2:15</a>; <a onClick="return mV(\'Act\',19,25);">Ac 19:25</a>), "workers" (of iniquity) (<a onClick="return mV(\'Luk\',13,27);">Lu 13:27</a>), "deceitful workers" (<a onClick="return mV(\'2Cr\',11,13);">2Co 11:13</a>), "evil workers" (<a onClick="return mV(\'Phl\',3,2);">Php 3:2</a>); dunamis, "power," is translated "(workers of) miracles" (<a onClick="return mV(\'1Cr\',12,29);">1Co 12:29</a> margin, the Revised Version (British and American) "powers"); sunergeo, "to work with" (<a onClick="return mV(\'2Cr\',6,1);">2Co 6:1</a>, "working together with him").<P>Workfellow is the translation of sunergos, "joint or fellow-worker" (<a onClick="return mV(\'Rom\',16,21);">Ro 16:21</a>; <a onClick="return mV(\'Col\',4,11);">Col 4:11</a>).<P>Workmaster occurs in Ecclesiasticus 38:27, as the translation of architekton.<P>For "of ("with") cunning work" (<a onClick="return mV(\'Exd\',26,1,31);">Ex 26:1,31</a>; <a onClick="return mV(\'Exd\',28,6,15);">28:6,15</a>; <a onClick="return mV(\'Exd\',36,8,35);">36:8,35</a>; <a onClick="return mV(\'Exd\',39,3,8);">39:3,8</a>), the American Standard Revised Version has "the work of the skillful workman," the English Revised Version "of the cunning workman"; instead of "I was by him as one brought up (with him)" (<a onClick="return mV(\'Pro\',8,30);">Pr 8:30</a>), the Revised Version (British and American) has "I was by him as a master workman.``185';
isbe[9245]='World (General)`1. Original Words:<P>In the King James Version this word represents several originals, as follows: \'erets "earth"; chedhel, "the underworld"; cheledh, "lifetime," "age"; \'olam, "indefinite time," "age"; tebhel, "fertile earth"; ge, "earth"; aion, "age," "indefinite time," with frequent connotation of the contents of time, its influences and powers; oikoumene, "inhabited earth," the world of man considered in its area and distribution; last, and most frequently, kosmos, properly "order," with the suggestion of beauty; thence the material universe, as the great example of such order; then the moral universe, the total system of intelligent creatures, perhaps sometimes including angels (<a onClick="return mV(\'1Cr\',4,9);">1Co 4:9</a>), but as a rule human beings only; then, in view of the fact of universal human failure, humanity in its sinful aspect, the spirit and forces of fallen humanity regarded as antagonistic to God and to good, "all around us which does not love God."<P>2. Remarks:<P>Of the above terms, some need not detain us; \'erets, as the original to "world," occurs only thrice, chedhel, once, cheledh, twice, \'olam, twice (including <a onClick="return mV(\'Ecc\',3,11);">Ec 3:11</a>), ge, once. The most important of the series, looking at frequency of occurrence, are tebhel, aion, oikoumene, kosmos. On these we briefly comment in order.<P>(1) Tebhel.<P>Tebhel, as the original to "world," occurs in 35 places, of which 15 are found in Psalms and 9 in the first half of Isaiah. By derivation it has to do with produce, fertility, but this cannot be said to come out in usage. The word actually plays nearly the same part as "globe" with us, denoting man\'s material dwelling-place, as simply as possible, without moral suggestions.<P>(2) Aion.<P>We have indicated above the speciality of aion. It is a time, with the suggestion always of extension rather than limit (so that it lends itself to phrases denoting vast if not endless extension, such as "to the aions of aions," rendered "forever and ever," or "world without end"). In <a onClick="return mV(\'Hbr\',1,2);">Heb 1:2</a>; <a onClick="return mV(\'Hbr\',11,13);">11:13</a>, it denotes the "aeons" of the creative process. In numerous places, notably in Matthew, it refers to the "dispensations" of redemption, the present "age"of grace and, in distinction, the "age" which is to succeed it—"that world, and the resurrection" (<a onClick="return mV(\'Luk\',20,35);">Lu 20:35</a>). Then, in view of the moral contents of the present state of things, it freely passes into the thought of forces and influences tending against faith and holiness, e.g., "Be not fashioned according to this world" (<a onClick="return mV(\'Rom\',12,2);">Ro 12:2</a>). In this connection the Evil Power is said to be "the god of this world" (<a onClick="return mV(\'2Cr\',4,4);">2Co 4:4</a>).<P>(3) Oikoumene.<P>The word oikoumene occasionally means the Roman empire, regarded as pre-eminently the region of settled human life. So <a onClick="return mV(\'Luk\',2,1);">Lu 2:1</a>; <a onClick="return mV(\'Act\',11,28);">Ac 11:28</a>, and perhaps <a onClick="return mV(\'Rev\',3,10);">Re 3:10</a>, and other apocalyptic passages. In Hebrews it is used mystically of the Empire of the Messiah (<a onClick="return mV(\'Hbr\',1,6);">1:6</A>; <a onClick="return mV(\'Hbr\',2,5);">2:5</A>).<P>(4) Kosmos.<P>We have remarked above on kosmos, with its curious and suggestive history of meanings. It may be enough here to add that that history prepares us to find its reference varying by subtle transitions, even in the same passage. See e.g. <a onClick="return mV(\'Jhn\',1,10);">Joh 1:10</a>, where "the world" appears first to denote earth and man simply as the creation of "the Word," and then mankind as sinfully alienated from their Creator. We are not surprised accordingly to read on the one hand that "God...loved the world" (<a onClick="return mV(\'Jhn\',3,16);">Joh 3:16</a>), and on the other that the Christian must "not love the world" (<a onClick="return mV(\'1Jo\',2,15);">1Joh 2:15</a>). The reader will find the context a sure clue in all cases, and the study will be pregnant of instruction.``46';
isbe[9246]='World, Cosmological`wurld, koz-mo-loj\'-i-kal:<P>1. Terms and General Meaning<P>2. Hebrew Idea of the World<P>3. Its Extent<P>4. Origin of the World—Biblical and Contrasted Views<P>5. The Cosmogony of <a onClick="return mV(\'Gen\',1,\'1-\');">Genesis 1</a>—Comparison with Babylonian and Other Cosmogonies<P>6. <a onClick="return mV(\'Gen\',1,\'1-\');">Genesis 1</a> and Science<P>LITERATURE<hr /><P>1. Terms and General Meaning:<P>The Hebrews had no proper word for "world" in its wide sense of "universe." The nearest approach to such a meaning is in the phrase "the heavens and the earth" (<a onClick="return mV(\'Gen\',1,1);">Ge 1:1</a>, etc.). Even this, in a physical reference, does not convey the modern idea, for the earth is still the center with which heaven and the heavenly bodies are connected as adjuncts. It is here, however, to be remembered that to the Hebrew mind the physical world was not the whole. Beyond were the heavens where God\'s throne was, peopled by innumerable spiritual intelligences, whose hosts worshipped and obeyed Him (<a onClick="return mV(\'Gen\',28,12);">Ge 28:12</a>; <a onClick="return mV(\'Psa\',103,\'19-21\');">Ps 103:19-21</a>, etc.). Their conception of the universe was thus enlarged, but the heavens, in this sense, would not be included in the "world." For "world," in its terrestrial meaning, several Hebrew words are used. The King James Version thus occasionally renders the word \'erets, "earth" (the rendering is retained in the Revised Version (British and American) in <a onClick="return mV(\'Isa\',23,17);">Isa 23:17</a>; <a onClick="return mV(\'Jer\',25,26);">Jer 25:26</a>; in <a onClick="return mV(\'Psa\',22,27);">Ps 22:27</a>; <a onClick="return mV(\'Isa\',62,11);">Isa 62:11</a>, it is changed to its proper meaning "earth"); \'olam, "age," twice rendered "world" in the King James Version (<a onClick="return mV(\'Psa\',73,12);">Ps 73:12</a>; <a onClick="return mV(\'Ecc\',3,11);">Ec 3:11</a>), is changed in the Revised Version (British and American)—in the latter case into "eternity." The chief word for "world" in the sense of the habitable earth, the abode of man, with its fullness of created life, is tebhel—a poetical term (<a onClick="return mV(\'1Sa\',2,8);">1Sa 2:8</a>; <a onClick="return mV(\'2Sa\',22,16);">2Sa 22:16</a>; <a onClick="return mV(\'Job\',18,18);">Job 18:18</a>; <a onClick="return mV(\'Job\',34,13);">34:13</a>; <a onClick="return mV(\'Job\',37,12);">37:12</a>; <a onClick="return mV(\'Psa\',9,8);">Ps 9:8</a>; <a onClick="return mV(\'Psa\',18,15);">18:15</a>, etc.)—answering to the Greek oikoumene.<P>In the New Testament a frequent word for "world" is aion, "age" (<a onClick="return mV(\'Mat\',12,32);">Mt 12:32</a>; <a onClick="return mV(\'Mat\',13,22,39,40,49);">13:22,39,40,49</a>; <a onClick="return mV(\'Mat\',24,3);">24:3</a>; <a onClick="return mV(\'Mar\',4,19);">Mr 4:19</a>; <a onClick="return mV(\'Luk\',16,8);">Lu 16:8</a>; <a onClick="return mV(\'Rom\',12,2);">Ro 12:2</a>; <a onClick="return mV(\'Hbr\',1,2);">Heb 1:2</a>, etc.). the Revised Version (British and American) notes in these cases "age" in margin, and sometimes changes in text into "of old" (thus the American Standard Revised Version in <a onClick="return mV(\'Luk\',1,70);">Lu 1:70</a>; <a onClick="return mV(\'Act\',3,21);">Ac 3:21</a>), "ages," "times," etc., according to the sense (compare <a onClick="return mV(\'1Cr\',10,11);">1Co 10:11</a>; <a onClick="return mV(\'Hbr\',6,5);">Heb 6:5</a>; <a onClick="return mV(\'Hbr\',9,26);">9:26</a>; <a onClick="return mV(\'2Ti\',1,9);">2Ti 1:9</a>; .<a onClick="return mV(\'Tts\',1,2);">Tit 1:2</a>, etc.). Most generally the Greek word used is kosmos, the "ordered world" (e.g. <a onClick="return mV(\'Mat\',4,8);">Mt 4:8</a>; <a onClick="return mV(\'Mat\',5,14);">5:14</a>; <a onClick="return mV(\'Mat\',26,13);">26:13</a>; <a onClick="return mV(\'Mar\',8,36);">Mr 8:36</a>; <a onClick="return mV(\'Jhn\',1,9);">Joh 1:9</a>; <a onClick="return mV(\'Jhn\',8,12);">8:12</a>; <a onClick="return mV(\'Act\',17,24);">Ac 17:24</a>; <a onClick="return mV(\'Rom\',1,8,20);">Ro 1:8,20</a>, etc.). The wider sense of "all creation," or "universe" (see above on the Old Testament), is expressed by such phrases as panta, "all things" (<a onClick="return mV(\'Jhn\',1,3);">Joh 1:3</a>), pasa he ktisis, "the whole creation" (<a onClick="return mV(\'Rom\',8,22);">Ro 8:22</a>).<P>2. Hebrew Idea of the World:<P>Two errors are to be avoided in framing a representation of the Hebrew conception of the world.<P>(1) The attempt should not be made to find in the Biblical statements precise anticipations of modern scientific discoveries. The relations of the Biblical teaching to scientific discovery are considered below. Here it is enough to say that the view taken of the world by Biblical writers is not that of modern science, but deals with the world simply as we know it—as it lies spread out to ordinary view—and things are described in popular language as they appear to sense, not as telescope, microscope, and other appliances of modern knowledge reveal their nature, laws and relations to us. The end of the narration or description is throughout religious, not theoretic.<P>(2) On the other hand, the error is to be avoided of forcing the language of popular, often metaphorical and poetic, description into the hard-and-fast forms of a cosmogony which it is by no means intended by the writers to yield. It is true that the Hebrews had no idea of our modern Copernican astronomy, and thought of the earth as a flat surface, surmounted by a vast expanse of heaven, in which sun, moon and stars were placed, and from whose reservoirs the rain descended. But it is an exaggeration of all this to speak, as is sometimes done, as if the Hebrews were children who thought of the sky as a solid vault (<a onClick="return mV(\'Gen\',1,\'6-8\');">Ge 1:6-8</a>; <a onClick="return mV(\'Job\',37,18);">Job 37:18</a>), supported on pillars (<a onClick="return mV(\'Job\',26,11);">Job 26:11</a>), and pierced with windows (<a onClick="return mV(\'Gen\',7,11);">Ge 7:11</a>; <a onClick="return mV(\'Isa\',24,18);">Isa 24:18</a>), through which the rains came. "The world is a solid expanse of earth, surrounded by and resting on a world-ocean, and surmounted by a rigid vault called the \'firmament,\' above which the waters of a heavenly ocean are spread" (Skinner). The matter is carried farther when elaborate resemblances are sought between the Hebrew and Babylonian cosmogonies (see below). Such representations, though common, are misleading. Language is not to be pressed in this prosaic, unelastic way. It is forgotten that if the "firmament" or "heaven" is sometimes spoken of as a solid vault, it is at other times compared to a "curtain" stretched out (<a onClick="return mV(\'Psa\',104,2);">Ps 104:2</a>; <a onClick="return mV(\'Isa\',40,22);">Isa 40:22</a>), or a "scroll" that can be rolled up (<a onClick="return mV(\'Isa\',34,4);">Isa 34:4</a>); if "windows" of heaven are once or twice mentioned, in many other places there is a quite clear recognition that the rain comes from the clouds in the air (<a onClick="return mV(\'Jdg\',5,4);">Jud 5:4</a>; <a onClick="return mV(\'Job\',36,28);">Job 36:28</a>; <a onClick="return mV(\'Psa\',77,17);">Ps 77:17</a>, etc.); if the earth is sometimes spoken of as a "circle" (<a onClick="return mV(\'Isa\',40,22);">Isa 40:22</a>), at other times it has "corners" and "ends" (<a onClick="return mV(\'Isa\',11,12);">Isa 11:12</a>; <a onClick="return mV(\'Deu\',33,17);">De 33:17</a>; <a onClick="return mV(\'Job\',37,3);">Job 37:3</a>; <a onClick="return mV(\'Psa\',19,6);">Ps 19:6</a>, etc.); if sun, moon and stars are figured as if attached to the firmament—"fixed as nails," as one has put it—"from which they might be said to drop off" (<a onClick="return mV(\'Isa\',14,12);">Isa 14:12</a>, etc.), far more frequently the sun is represented as pursuing his free, rejoicing course around the heavens (<a onClick="return mV(\'Psa\',19,5,6);">Ps 19:5,6</a>, etc.), the moon as "walking" in brightness (<a onClick="return mV(\'Job\',31,26);">Job 31:26</a>), etc. The proper meaning of the word raqia\' is simply "expanse" and the pellucid vault of the heavens, in which the clouds hung and through which the sun traveled, had probably for the Hebrews associations not very different from what it has to the average mind of today. The earth, itself composed of "dry land" and "seas" (<a onClick="return mV(\'Gen\',1,9,10);">Ge 1:9,10</a>), the former with its mountains, valleys and rivers, may have been conceived of as encircled by an ocean—the circular form being naturally suggested by the outline of the horizon. A few passages convey the idea of depths within or beneath, as well as around the solid earth (<a onClick="return mV(\'Gen\',7,11);">Ge 7:11</a>; <a onClick="return mV(\'Deu\',33,13);">De 33:13</a>)—a thought again suggested by springs, wells, floods, and similar natural phenomena—but there is no fixity in these representations. One place in Job (<a onClick="return mV(\'Job\',26,7);">26:7</a>) has the bold idea of the earth as hung in free space—a near approach to the modern conception.<P>3. Its Extent:<P>The ideas formed of the extent of the world were naturally limited by the geographical knowledge of the Hebrews, and expanded as that knowledge increased. At no time, however, was it so limited as might be supposed. The <a href="./study/isbe/search.html?string=TABLE+OF+NATIONS">TABLE OF NATIONS</a> (which see) in <a onClick="return mV(\'Gen\',10,\'1-\');">Ge 10</a> shows a wide knowledge of the different peoples of the world, "after their tongues, in their lands, in their nations" (<a onClick="return mV(\'Gen\',10,20,31);">10:20,31</a>). The outlook to the west was bounded by the Mediterranean ("great sea," <a onClick="return mV(\'Num\',31,6);">Nu 31:6</a>; <a onClick="return mV(\'Eze\',47,10);">Eze 47:10</a>, etc.), with its "islands" (<a onClick="return mV(\'Gen\',10,5);">Ge 10:5</a>; <a onClick="return mV(\'Isa\',11,11);">Isa 11:11</a>, etc.), to Tarshish (Spain?) in the extreme west. To the north was the great empire of the Hittites (<a onClick="return mV(\'Jos\',1,4);">Jos 1:4</a>; <a onClick="return mV(\'1Ki\',10,29);">1Ki 10:29</a>, etc.). North and east across the desert, beyond Syria, lay the familiar region of Mesopotamia (Aram-Naharaim, <a onClick="return mV(\'Psa\',60,1);">Ps 60, title</a>), with Ararat (<a onClick="return mV(\'Gen\',8,4);">Ge 8:4</a>) still farther north; and, southward, in the Tigris-Euphrates valley, the ancient and powerful empires of Assyria and Babylonia (<a onClick="return mV(\'Gen\',2,14);">Ge 2:14</a>; <a onClick="return mV(\'Gen\',10,10,11);">10:10,11</a>), with Media and Elam (<a onClick="return mV(\'Gen\',10,2,22);">Ge 10:2,22</a>), at a later time Persia (<a onClick="return mV(\'Est\',1,1);">Es 1:1</a>), farther east. To the southeast, between the Red Sea and the Persian Gulf, lay the great peninsula of Arabia, and to the west of the Red Sea, southwest of Canaan, the mighty Egypt, Israel\'s never-forgotten "land of bondage" (<a onClick="return mV(\'Exd\',20,2);">Ex 20:2</a>, etc.). South of Egypt was Ethiopia. Of more distant peoples, India is first mentioned in <a onClick="return mV(\'Est\',1,1);">Es 1:1</a>; <a onClick="return mV(\'Est\',8,9);">8:9</a>, but trade with it must have been as early as the days of Solomon. On the dim horizon are such peoples as Gomer (the Cimmerians, north of the Euxine <a onClick="return mV(\'Gen\',10,2);">Ge 10:2</a>; <a onClick="return mV(\'Eze\',38,6);">Eze 38:6</a>) and Magog (<a onClick="return mV(\'Gen\',10,2);">Ge 10:2</a>; <a onClick="return mV(\'Eze\',38,2);">Eze 38:2</a> the Scythians (?)); probably even China is intended by "the land of Sinim" in <a onClick="return mV(\'Isa\',49,12);">Isa 49:12</a>. In the apocryphal books and the New Testament the geographical area is perceptibly widened. Particularly do Asia Minor, Macedonia, Greece and Italy, with their islands, cities, etc., come clearly into view. A list like that in <a onClick="return mV(\'Act\',2,\'9-11\');">Ac 2:9-11</a> of the representatives of peoples present at the day of Pentecost gives a vivid glimpse of the extent of the Jewish religious connection at this period (compare <a onClick="return mV(\'Act\',8,27);">Ac 8:27</a>ff).<P>4. Origin of the World—Biblical and Contrasted Views:<P>From the first there has been abundant speculation in religion and philosophy as to how the world came to be—whether it was eternal, or had a commencement, and, if it began to be, how it originated. Theories were, as they are still, numberless and various. Some cosmogonies were purely mythological (Babylonian, Hesiod); some were materialistic (Democritus, Epicurus—"concourse of atoms"); some were demiurgic (Plato in Timaeus—an eternal matter formed by a demiurge); some were emanational (Gnostics—result of overflowing of fullness of divine life in "aeons"); some were dualistic (Parsism, Manicheism—good and evil principles in conflict); some imagined endless "cycles"—alternate production and destruction (Stoics, Buddhist kalpas); many were pantheistic (Spinoza—an eternal "substance," its "attributes" necessarily determined in their "modes"; Hegel, "absolute spirit," evolving by logical necessity); some are pessimistic (Schopenhauer—the world the result of an irrational act of "will"; hence, necessarily evil), etc.<P>In contrast with these conflicting, and often foolish and irrational, theories, the Biblical doctrine of the origin of the world stands alone and unique. It is unique because the view of God on which it rests is unique. According to the teaching of the Bible, from its first page to its last, God is a free, personal Spirit, one, omnipotent, holy, and the world originates in a free act of His almighty will (<a onClick="return mV(\'Gen\',1,1);">Ge 1:1</a>; <a onClick="return mV(\'Psa\',33,9);">Ps 33:9</a>; <a onClick="return mV(\'Hbr\',11,3);">Heb 11:3</a>; <a onClick="return mV(\'Rev\',4,11);">Re 4:11</a>, etc.), is continually upheld by His power, ruled by His providence, and is the sphere of the realization of His purpose. As against theories of the eternity of the world, accordingly, it declares that the world had a beginning (<a onClick="return mV(\'Gen\',1,1);">Ge 1:1</a>); as against dualism, it declares that it is the product of one almighty will (<a onClick="return mV(\'Deu\',4,35);">De 4:35</a>; <a onClick="return mV(\'Isa\',45,7);">Isa 45:7</a>; <a onClick="return mV(\'1Cr\',8,6);">1Co 8:6</a>, etc.); as against the supposition of an eternal matter, it declares that matter as well as form takes its origin from God (<a onClick="return mV(\'Gen\',1,1);">Ge 1:1</a>; <a onClick="return mV(\'Hbr\',11,3);">Heb 11:3</a>); as against pantheism and all theories of necessary development, it affirms the distinction of God from His world, His transcendence over it as well as His immanence in it, and His free action in creation (<a onClick="return mV(\'Eph\',4,6);">Eph 4:6</a>; <a onClick="return mV(\'Rev\',4,11);">Re 4:11</a>); as against pessimism, it declares the constitution, aim and end of the world to be good (<a onClick="return mV(\'Gen\',1,31);">Ge 1:31</a>; <a onClick="return mV(\'Psa\',33,5);">Ps 33:5</a>; <a onClick="return mV(\'Mat\',5,45);">Mt 5:45</a>, etc.). To the Old Testament doctrine of the origin of the world the New Testament adds the fuller determination that the world was created through the agency of the "Word" (Logos), or Son (<a onClick="return mV(\'Jhn\',1,3);">Joh 1:3</a>; <a onClick="return mV(\'Col\',1,16,17);">Col 1:16,17</a>; <a onClick="return mV(\'Hbr\',1,2,3);">Heb 1:2,3</a>, etc.).<P>5. The Cosmogony of <a onClick="return mV(\'Gen\',1,1);">Genesis 1</a>—Comparison with Babylonian and Other Cosmogonies:<P>No stronger proof could be afforded of the truth and sublimity of the Biblical account of the origin of things than is given by the comparison of the narrative of creation in <a onClick="return mV(\'Gen\',1,\'1)-\';">Ge 1</a>-<a onClick="return mV(\'Gen\',2,\'1-4\');">2:4</a>, with the mythological cosmogonies and theogonies found in other religions. Of these the best known, up to the time of recent discoveries, were the Babylonian account of the creation preserved by Berosus, a priest of Babylon in the 3rd century BC, and the Theogony of the Greek Hesiod (9th century BC). Hesiod\'s poem is a confused story of how from Chaos came forth Earth, Tartarus (Hell), Eros (Love) and Erebus (Night). Erebus gives birth to Aether (Day). Earth produces the Heaven and the Sea. Earth and Heaven, in turn, become the parents of the elder gods and the Titans. Cronus, one of these gods, begets Zeus. Zeus makes war on his father Cronus, overthrows him, and thus becomes king of the Olympian gods. The descent of these is then traced. How far this fantastic theory, commencing with Chaos, and from it generating Nature and the gods, has itself an original affinity with Babylonian conceptions, need not here be discussed. It hardly surpasses in crudeness the late shape of the Babylonian cosmogony furnished by Berosus. Here, too, Chaos—"darkness and water"—is the beginning, and therefrom are generated strange and peculiar forms, men with wings and with two faces, or with heads and horns of goats, bulls with human heads, dogs with four bodies, etc. Over this welter a woman presides, called Omorka. Belus appears, cuts the woman in twain, of one half of her makes the heavens, and of the other the earth, sets the world in order, finally makes one of the gods cut off his head, and from the blood which flowed forth, mixed with earth, forms intelligent man. That Berosus has not essentially misrepresented the older Babylonian conceptions is now made apparent through the recovery of the Babylonian story itself.<P>In 1875 George Smith discovered, among the tablets in the British Museum brought from the great library of the Assyrian king Assurbanipal (7th century BC), several on which was inscribed the Chaldean story of creation, and next year published his work, The Chaldean Account of Genesis. The tablets, supplemented by other fragments, have since been repeatedly translated by other hands, the most complete translation being that by L. W. King in his Seven Tablets of Creation in the Babylonian and Assyrian Legends concerning the Creation of the World. The story of these tablets, still in many parts fragmentary, is now familiar (see <a href="./study/isbe/search.html?string=BABYLONIA+AND+ASSYRIA,+RELIGION+OF">BABYLONIA AND ASSYRIA, RELIGION OF</a>). Here, too, the origin of all things is from Chaos, the presiding deities of which are Apsu and Tiamat. The gods are next called into being. Then follows a long mythological description, occupying the first four tablets, of the war of Marduk with Tiamat, the conflict issuing in the woman being cut in two, and heaven being formed of one half and earth of the other. The 5th tablet narrates the appointing of the constellations. The 6th seems to have recorded the creation of man from the blood of Marduk. This mythological epic is supposed by many scholars to be the original of the sublime, orderly, monotheistic account of the creation which stands at the commencement of our Bible. The Babylonian story is (without proof) supposed to have become naturalized in Israel, and there purified and elevated in accordance with the higher ideas of Israel\'s religion. We cannot subscribe to this view, which seems to us loaded with internal and historical improbabilities. Points of resemblance are indeed alleged, as in the use of the Hebrew word tehom for "deep" (<a onClick="return mV(\'Gen\',1,2);">Ge 1:2</a>), cognate with Tiamat; the separation of heaven and earth (<a onClick="return mV(\'Gen\',1,\'6-8\');">Ge 1:6-8</a>); the appointing of the constellations (<a onClick="return mV(\'Gen\',1,\'14-18\');">Ge 1:14-18</a>), etc. But in the midst of the scanty resemblances, how enormous are the contrasts, which all writers acknowledge! Gunkel, e.g., says, "Anyone who compares this ancient Babylonian myth with <a onClick="return mV(\'Gen\',1,\'1-\');">Ge 1</a>, will perceive at once hardly anything else than the infinite distance between them. There the heathen gods, inflamed against each other in wild warfare, here the One, who speaks and it is done" (Israel und Babylonien, 24). One can understand how these wild polytheistic legends could arise from corruption of a purer, simpler form, but not vice versa. The idea of a "deep," or chaos, must have preceded the fanciful and elaborate creation of the woman-monster, Tiamat; the distinction of sky and earth would go before the coarse idea of the cutting of the woman in two; and so with the other features of supposed resemblance. Professor Clay has recently shown reason for challenging the whole idea of the borrowing of these myths from Babylonia, and declares that "it is unreasonable to assume that the Hebrew tehom is a modification of a Babylonian pattern ..... To say, therefore, that the origin of the Marduk-Tiamat myth is to be found in a Nippurian version, originally known as Ellil-Tiamat, is utterly without foundation" (Amurru, 50). Much more reasonably may we adopt the hypothesis of Dillmann, Kittel, Hommel, Oettli, etc., that the relation between these Babylonian legends and the Biblical narratives is one of cognateness, and not of derivation. These traditions came down from a much older source and are preserved by the Hebrews in their purer form (see the writer\'s POT, 402-9).<P>The superiority of the Genesis cosmogony to those of other peoples is generally admitted, but objection to it is taken in the name of modern science. The narrative conflicts, it is said, with both modern astronomy and modern geology; with the former, in regarding the earth as the center of the universe, and with the latter in its picture of the order and stages of creation, and the time occupied in the work (for a full statement of these alleged discrepancies, see Dr. Driver\'s Genesis, Introduction).<P>6. <a onClick="return mV(\'Gen\',1,\'1-\');">Genesis 1</a> and Science:<P>On the general question of the harmony of the Bible with science it is important that a right standpoint be adopted. It has already been stated that it is no part of the aim of the Biblical revelation to anticipate the discoveries of 19th-century and 20th-century science. The world is taken as it is, and set in its relations to God its Creator, without consideration of what after-light science may throw on its inner constitution, laws and methods of working. As Calvin, with his usual good sense, in his commentary on <a onClick="return mV(\'Gen\',1,\'1-\');">Ge 1</a> says, "Moses wrote in the popular style, which, without instruction, all ordinary persons endowed with common sense are able to understand....He does not call us up to heaven; but only proposes things that lie open before our eyes." This of itself disposes of the objection drawn from astronomy, for everywhere heaven and earth are spoken of according to their natural appearances, and not in the language of modern Copernican science. To this hour we use the same language in speaking of the sun rising and setting.<P>The further objection that modern knowledge discredits the Biblical view by showing how small a speck the world is in the infinitude of the universe is really without force. Whatever the extent of the universe, it remains the fact that on this little planet life has effloresced into reason, and we have as yet no ground in science for believing that anywhere else it has ever done so (compare Dr. A. R. Wallace\'s striking book, Man\'s Place in the Universe). Even supposing that there are any number of inhabited worlds, this does not detract from the soul\'s value in this world, or from God\'s love in the salvation of its sinful race. The objection drawn from geology, though so much is sometimes made of it, is hardly more formidable. It does not follow that, because the Bible does not teach modern science, we are justified in saying that it contradicts it. On the contrary, it may be affirmed, so true is the standpoint of the author in this first chapter of Genesis, so divine the illumination with which he is endowed, so unerring his insight into the order of Nature, that there is little in his description that even yet, with our advanced knowledge, we need to change. To quote words used elsewhere, "The dark watery waste over which the spirit broods with vivifying power, the advent of light, the formation of an atmosphere or sky capable of sustaining the clouds above it, the settling of the great outlines of the continents and seas, the clothing of the dry land with abundant vegetation, the adjustment of the earth\'s relation to sun and moon as the visible rulers of its day and night, the production of the great seamonsters and reptile-like creatures and birds, the peopling of the earth with four-footed beasts and cattle, last of all, the advent of man—is there so much of all this which science requires us to cancel?" (Orr, Christian View of God and the World, 421).<P>Even in regard to the "days"—the duration of time involved—there is no insuperable difficulty. The writer may well have intended symbolically to represent the creation as a great week of work, ending with the Creator\'s Sabbath rest. In view, however, of the fact that days of 24 hours do not begin to run till the appointment of the sun on the 4th day (<a onClick="return mV(\'Gen\',1,14);">Ge 1:14</a>), it seems more probable that he did not intend to fix a precise length to his creation "days." This is no new speculation. Already Augustine asks, "Of what fashion these days were it is exceeding hard or altogether impossible to think, much more to speak" (De Civ. Dei, xi.6, 7); and Thomas Aquinas in the Middle Ages leaves the matter an open question. Neither does this narrative, in tracing the origin of all things to the creative word of God, conflict with anything that may be discovered by science as to the actual method of creation, e.g. in evolution. Science itself is gradually coming to see the limits within which the doctrine of evolution must be received, and, kept within these limits, there is nothing in that doctrine which brings it into conflict with the Biblical representations (see <a href="./study/isbe/search.html?string=ANTHROPOLOGY">ANTHROPOLOGY</a>; <a href="./study/isbe/search.html?string=CREATION">CREATION</a>; <a href="./study/isbe/search.html?string=EVOLUTION">EVOLUTION</a>; also the writer\'s works, God\'s Image in Man and Sin as a Problem of Today). Whatever may be said of the outward form of the narrative, one has only to look at the great ideas which the first chapter of Genesis is intended to teach to see that it conveys those great truths on the origin and ordering of things which are necessary as the basis of a true religious view of the world, no matter to what stage knowledge or science may attain. This chapter, standing at the head of the Bible, lays the foundation for all that follows in the Biblical view of the relation of God to the world, and yields the ground for our confidence that, as all things are created by God and dependent on Him, so everything in Nature and providence is at His disposal for the execution of His purposes and the care and protection of His people. The story of creation, therefore, remains to all time of the highest religious value.<P>LITERATURE.<P>See articles "Earth" in Smith\'s DB and in EB. The other works mentioned above may be consulted. A valuable extended discussion of the word "Firmament" may be seen in Essay V of the older work, Aids to Faith (London, Murray), 220-30.``132';
