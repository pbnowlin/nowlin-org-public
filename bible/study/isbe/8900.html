ever, is grounded in the secular development of the redemptive purpose of God: the times were ripe for the revelation of the Trinity in the unity of the Godhead until the fullness of the time had come for God to send forth His Son unto redemption, and His Spirit unto sanctification. The revelation in word must needs wait upon the revelation in fact, to which it brings its necessary explanation, no doubt, but from which also it derives its own entire significance and value. The revelation of a Trinity in the divine unity as a mere abstract truth without relation to manifested fact, and without significance to the development of the kingdom of God, would have been foreign to the whole method of the divine procedure as it lies exposed to us in the pages of Scripture. Here the working-out of the divine purpose supplies the fundamental principle to which all else, even the progressive stages of revelation itself, is subsidiary; and advances in revelation are ever closely connected with the advancing accomplishment of the redemptive purpose. We may understand also, however, from the same central fact, why it is that the doctrine of the Trinity lies in the New Testament rather in the form of allusions than in express teaching, why it is rather everywhere presupposed, coming only here and there into incidental expression, than formally inculcated. It is because the revelation, having been made in the actual occurrences of redemption, was already the common property of all Christian hearts. In speaking and writing to one another, Christians, therefore, rather spoke out of their common Trinitarian consciousness, and reminded one another of their common fund of belief, than instructed one another in what was already the common property of all. We are to look for, and we shall find, in the New Testament allusions to the Trinity, rather evidence of how the Trinity, believed in by all, was conceived by the authoritative teachers of the church, than formal attempts, on their part, by authoritative declarations, to bring the church into the understanding that God is a Trinity.<P>9. Implied in the Whole New Testament:<P>The fundamental proof that God is a Trinity is supplied thus by the fundamental revelation of the Trinity in fact: that is to say, in the incarnation of God the Son and the outpouring of God the Holy Spirit. In a word, Jesus Christ and the Holy Spirit are the fundamental proof of the doctrine of the Trinity. This is as much as to say that all the evidence of whatever kind, and from whatever source derived, that Jesus Christ is God manifested in the flesh, and that the Holy Spirit is a Divine Person, is just so much evidence for the doctrine of the Trinity; and that when we go to the New Testament for evidence of the Trinity we are to seek it, not merely in the scattered allusions to the Trinity as such, numerous and instructive as they are, but primarily in the whole mass of evidence which the New Testament provides of the Deity of Christ and the divine personality of the Holy Spirit. When we have said this, we have said in effect that the whole mass of the New Testament is evidence for the Trinity. For the New Testament is saturated with evidence of the Deity of Christ and the divine personality of the Holy Spirit, Precisely what the New Testament is, is the documentation of the religion of the incarnate Son and of the outpoured Spirit, that is to say, of the religion of the Trinity, and what we mean by the doctrine of the Trinity is nothing but the formulation in exact language of the conception of God presupposed in the religion of the incarnate Son and outpoured Spirit. We may analyze this conception and adduce proof for every constituent element of it from the New Testament declarations. We may show that the New Testament everywhere insists on the unity of the Godhead; that it constantly recognizes the Father as God, the Son as God and the Spirit as God; and that it cursorily presents these three to us as distinct Persons. It is not necessary, however, to enlarge here on facts so obvious. We may content ourselves with simply observing that to the New Testament there is but one only living and true God; but that to it Jesus Christ and the Holy Spirit are each God in the fullest sense of the term; and yet Father, Son and Spirit stand over against each other as I, and Thou, and He. In this composite fact the New Testament gives us the doctrine of the Trinity. For the doctrine of the Trinity is but the statement in wellguarded language of this composite fact. Through out the whole course of the many efforts to formulate the doctrine exactly, which have followed one another during the entire history of the church, indeed, the principle which has ever determined the result has always been determination to do justice in conceiving the relations of God the Father, God the Son and God the Spirit, on the one hand to the unity of God, and, on the other, to the true Deity of the Son and Spirit and their distinct personalities. When we have said these three things, then—that there is but one God, that the Father and the Son and the Spirit is each God, that the Father and the Son and the Spirit is each a distinct person—we have enunciated the doctrine of the Trinity in its completeness.<P>That this doctrine underlies the whole New Testament as its constant presupposition and determines everywhere its forms of expression is the primary fact to be noted. We must not omit explicitly to note, however, that it now and again also, as occasion arises for its incidental enunciation, comes itself to expression in more or less completeness of statement. The passages in which the three Persons of the Trinity are brought together are much more numerous than, perhaps, is generally supposed; but it should be recognized that the formal collocation of the elements of the doctrine naturally is relatively rare in writings which are occasional in their origin and practical rather than doctrinal in their immediate purpose. The three Persons already come into view as Divine Persons in the annunciation of the birth of our Lord: \'The Holy Ghost shall come upon thee,\' said the angel to Mary, \'and the power of the Most High shall overshadow thee: wherefore also the holy thing which is to be born shall be called the Son of God\' (<a onClick="return mV(\'Luk\',1,35);">Lu 1:35</a> margin; compare <a onClick="return mV(\'Mat\',1,18);">Mt 1:18</a>ff). Here the Holy Ghost is the active agent in the production of an effect which is also ascribed to the power of the Most High, and the child thus brought into the world is given the great designation of "Son of God." The three Persons are just as clearly brought before us in the account of Matthew (<a onClick="return mV(\'Mat\',1,18);">1:18</A>ff), though the allusions to them are dispersed through a longer stretch of narrative, in the course of which the Deity of the child is twice intimated (<a onClick="return mV(\'Mat\',1,21);">1:21</a>: \'It is He that shall save His people from their sins\'; <a onClick="return mV(\'Mat\',1,23);">1:23</a>: \'They shall call His name Immanuel; which is, being interpreted, God-with-us\') In the baptismal scene which finds record by all the evangelists at the opening of Jesus\' ministry (<a onClick="return mV(\'Mat\',3,16,17);">Mt 3:16,17</a>; <a onClick="return mV(\'Mar\',1,10,11);">Mr 1:10,11</a>; <a onClick="return mV(\'Luk\',3,21,22);">Lu 3:21,22</a>; <a onClick="return mV(\'Jhn\',1,\'32-34\');">Joh 1:32-34</a>), the three Persons are thrown up to sight in a dramatic picture in which the Deity of each is strongly emphasized. From the open heavens the Spirit descends in visible form, and \'a voice came out of the heavens, Thou art my Son, the Beloved, in whom I am well pleased.\' Thus care seems to have been taken to make the advent of the Son of God into the world the revelation also of the Triune God, that the minds of men might as smoothly as possible adjust themselves to the preconditions of the divine redemption which was in process of being wrought out.<P>10. Conditions the Whole Teaching of Jesus:<P>With this as a starting-point, the teaching of Jesus is conditioned throughout in a Trinitarian way. He has much to say of God His Father, from whom as His Son He is in some true sense distinct, and with whom He is in some equally true sense one. And He has much to say of the Spirit, who represents Him as He represents the Father, and by whom He works as the Father works by Him. It is not merely in the Gospel of John that such representations occur in the teaching of Jesus. In the Synoptics, too, Jesus claims a Sonship to God which is unique (<a onClick="return mV(\'Mat\',11,27);">Mt 11:27</a>; <a onClick="return mV(\'Mat\',24,36);">24:36</a>; <a onClick="return mV(\'Mar\',13,32);">Mr 13:32</a>; <a onClick="return mV(\'Luk\',10,22);">Lu 10:22</a>; in the following passages the title of "Son of God" is attributed to Him and accepted by Him: <a onClick="return mV(\'Mat\',4,6);">Mt 4:6</a>; <a onClick="return mV(\'Mat\',8,29);">8:29</a>; <a onClick="return mV(\'Mat\',14,33);">14:33</a>; <a onClick="return mV(\'Mat\',27,40,43,44);">27:40,43,44</a>; <a onClick="return mV(\'Mar\',3,11);">Mr 3:11</a>; <a onClick="return mV(\'Mar\',12,\'6-8\');">12:6-8</a>; <a onClick="return mV(\'Mar\',15,39);">15:39</a>; <a onClick="return mV(\'Luk\',4,41);">Lu 4:41</a>; <a onClick="return mV(\'Luk\',22,70);">22:70</a>; compare <a onClick="return mV(\'Jhn\',1,34,49);">Joh 1:34,49</a>; <a onClick="return mV(\'Jhn\',9,35);">9:35</a>; <a onClick="return mV(\'Jhn\',11,27);">11:27</a>), and which involves an absolute community between the two in knowledge, say, and power: both Matthew (<a onClick="return mV(\'Mat\',11,27);">11:27</A>) and Luke (<a onClick="return mV(\'Luk\',10,22);">10:22</A>) record His great declaration that He knows the Father and the Father knows Him with perfect mutual knowledge: "No one knoweth the Son, save the Father; neither doth any know the Father, save the Son." In the Synoptics, too, Jesus speaks of employing the Spirit of God Himself for the performance of His works, as if the activities of God were at His disposal: "I by the Spirit of God"—or as Luke has it, "by the finger of God—cast out demons" (<a onClick="return mV(\'Mat\',12,28);">Mt 12:28</a>; <a onClick="return mV(\'Luk\',11,20);">Lu 11:20</a>; compare the promise of the Spirit in <a onClick="return mV(\'Mar\',13,11);">Mr 13:11</a>; <a onClick="return mV(\'Luk\',12,12);">Lu 12:12</a>).<P>11. Father and Son in Johannine Discourses:<P>It is in the discourses recorded in John, however, that Jesus most copiously refers to the unity of Himself, as the Son, with the Father, and to the mission of the Spirit from Himself as the dispenser of the divine activities. Here He not only with great directness declares that He and the Father are one (<a onClick="return mV(\'Jhn\',10,30);">10:30</A>; compare <a onClick="return mV(\'Jhn\',17,11,21,22,25);">17:11,21,22,25</A>) with a unity of interpenetration ("The Father is in me, and I in the Father," <a onClick="return mV(\'Jhn\',10,38);">10:38</A>; compare <a onClick="return mV(\'Jhn\',16,10,11);">16:10,11</a>), so that to have seen Him was to have seen the Father (<a onClick="return mV(\'Jhn\',14,9);">14:9</a>; compare <a onClick="return mV(\'Jhn\',15,21);">15:21</a>); but He removes all doubt as to the essential nature of His oneness with the Father by explicitly asserting His eternity ("Before Abraham was born, I am," <a onClick="return mV(\'Jhn\',8,58);">Joh 8:58</a>), His co-eternity with God ("had with thee before the world was," <a onClick="return mV(\'Jhn\',17,5);">17:5</A>; compare <a onClick="return mV(\'Jhn\',17,18);">17:18</a>; <a onClick="return mV(\'Jhn\',6,62);">6:62</a>), His eternal participation in the divine glory itself ("the glory which I had with thee," in fellowship, community with Thee "before the world was," <a onClick="return mV(\'Jhn\',17,5);">17:5</A>). So clear is it that in speaking currently of Himself as God\'s Son (<a onClick="return mV(\'Jhn\',5,25);">5:25</a>; <a onClick="return mV(\'Jhn\',9,35);">9:35</a>; <a onClick="return mV(\'Jhn\',11,4);">11:4</a>; compare <a onClick="return mV(\'Jhn\',10,36);">10:36</a>), He meant, in accordance with the underlying significance of the idea of sonship in Semitic speech (founded on the natural implication that whatever the father is that the son is also; compare <a onClick="return mV(\'Jhn\',16,15);">16:15</A>; <a onClick="return mV(\'Jhn\',17,10);">17:10</A>), to make Himself, as the Jews with exact appreciation of His meaning perceived, "equal with God" (<a onClick="return mV(\'Jhn\',5,18);">5:18</A>), or, to put it brusquely, just "God" (<a onClick="return mV(\'Jhn\',10,33);">10:33</a>). How He, being thus equal or rather identical with God, was in the world, He explains as involving a coming forth (exelthon) on His part, not merely from the presence of God (apo, <a onClick="return mV(\'Jhn\',16,30);">16:30</a>; compare <a onClick="return mV(\'Jhn\',13,3);">13:3</A>) or from fellowship with God (para, <a onClick="return mV(\'Jhn\',16,27);">16:27</a>; <a onClick="return mV(\'Jhn\',17,8);">17:8</a>), but from out of God Himself (ek, <a onClick="return mV(\'Jhn\',8,42);">8:42</A>; <a onClick="return mV(\'Jhn\',16,28);">16:28</A>). And in the very act of thus asserting that His eternal home is in the depths of the Divine Being, He throws up, into as strong an emphasis as stressed pronouns can, convey, His personal distinctness from the Father. \'If God were your Father,\' says Hebrews (<a onClick="return mV(\'Hbr\',8,42);">8:42</A>), \'ye would love me: for I came forth and am come out of God; for neither have I come of myself, but it was He that sent me.\' Again, He says (<a onClick="return mV(\'Jhn\',16,26,27);">Joh 16:26,27</a>): \'In that day ye shall ask in my name: and I say not unto you that I will make request of the Father for you; for the Father Himself loveth you, because ye have loved me, and have believed that it was from fellowship with the Father that I came forth; I came from out of the Father, and have come into the world.\' Less pointedly, but still distinctly, He says again (<a onClick="return mV(\'Jhn\',17,8);">Joh 17:8</a>): They know of a truth that it was from fellowship with Thee that I came forth, and they believed that it was Thou that didst send me.\' It is not necessary to illustrate more at large a form of expression so characteristic of the discourses of our Lord recorded by John that it meets us on every page: a form of expression which combines a clear implication of a unity of Father and Son which is identity of Being, and an equally clear implication of a distinction of Person between them such as allows not merely for the play of emotions between them, as, for instance, of love (<a onClick="return mV(\'Jhn\',17,24);">Joh 17:24</a>; compare <a onClick="return mV(\'Jhn\',15,9);">15:9</a> (<a onClick="return mV(\'Jhn\',3,35);">3:35</a>); <a onClick="return mV(\'Jhn\',14,31);">14:31</a>), but also of an action and reaction upon one another which argues a high measure, if not of exteriority, yet certainly of exteriorization. Thus, to instance only one of the most outstanding facts of our Lord\'s discourses (not indeed confined to those in John\'s Gospel, but found also in His sayings recorded in the Synoptists, as e.g. <a onClick="return mV(\'Luk\',4,43);">Lu 4:43</a> (compare parallel <a onClick="return mV(\'Mar\',1,38);">Mr 1:38</a>); <a onClick="return mV(\'Luk\',9,48);">Lu 9:48</a>; <a onClick="return mV(\'Luk\',10,16);">10:16</a>; <a onClick="return mV(\'Luk\',4,34);">4:34</a>; <a onClick="return mV(\'Luk\',5,32);">5:32</a>; <a onClick="return mV(\'Luk\',7,19);">7:19</a>; <a onClick="return mV(\'Luk\',19,10);">19:10</a>), He continually represents Himself as on the one hand sent by God, and as, on the other, having come forth from the Father (e.g. <a onClick="return mV(\'Jhn\',8,42);">Joh 8:42</a>; <a onClick="return mV(\'Jhn\',10,36);">10:36</a>; <a onClick="return mV(\'Jhn\',17,3);">17:3</a>; <a onClick="return mV(\'Jhn\',5,23);">5:23</a>, et saepe).<P>12. Spirit in Johannine Discourses:<P>It is more important to point out that these phenomena of interrelationship are not confined to the Father and Son, but are extended also to the Spirit. Thus, for example, in a context in which our Lord had emphasized in the strongest manner His own essential unity and continued interpenetration with the Father (" If ye had known me, ye would have known my Father also"; "He that hath seen me hath seen the Father"; "I am in the Father, and the Father in me"; "The Father abiding in me doeth his works," <a onClick="return mV(\'Jhn\',14,7,9,10);">Joh 14:7,9,10</a>), we read as follows (<a onClick="return mV(\'Jhn\',14,\'16-26\');">Joh 14:16-26</a>): \'And I will make request of the Father, and He shall ive you another (thus sharply distinguished from Our lord as a distinct Person) Advocate, that He may be with you forever, the Spirit of Truth...He abideth with you and shall be in you. I will not leave you orphans; I come unto you....In that day ye shall know that I am in the Father....If a man love me, he will keep my word; and my Father will love him and we (that is, both Father and Son) will come unto him and make our abode with him....These things have I spoken unto you while abiding with you. But the Advocate, the Holy Spirit, whom the Father will send in my name, He shall teach you all things, and bring to your remembrance all that I said unto you.\' It would be impossible to speak more distinctly of three who were yet one. The Father, Son and Spirit are constantly distinguished from one another—the Son makes request of the Father, and the Father in response to this request gives an Advocate, "another" than the Son, who is sent in the Son\'s name. And yet the oneness of these three is so kept in sight that the coming of this "another Advocate" is spoken of without embarrassment as the coming of the Son Himself (<a onClick="return mV(\'Jhn\',14,\'18-21\');">Joh 14:18,19,20,21</a>), and indeed as the coming of the Father and the Son (<a onClick="return mV(\'Jhn\',14,23);">Joh 14:23</a>). There is a sense, then, in which, when Christ goes away, the Spirit comes in His stead; there is also a sense in which, when the Spirit comes, Christ comes in Him; and with Christ\'s coming the Father comes too. There is a distinction between the Persons brought into view; and with it an identity among them; for both of which allowance must be made. The same phenomena meet us in other passages. Thus, we read again (<a onClick="return mV(\'Jhn\',15,26);">Joh 15:26</a>): But when there is come the Advocate whom I will send unto you from (fellowship with) the Father, the Spirit of Truth, which goeth forth from (fellowship with) the Father, He shall bear witness of me.\' In the compass of this single verse, it is intimated that the Spirit is personally distinct from the Son, and yet, like Him, has His eternal home (in fellowship) with the Father, from whom He, like the Son, comes forth for His saving work, being sent thereunto, however, not in this instance by the Father, but by the Son.<P>This last feature is even more strongly emphasized in yet another passage in which the work of the Spirit in relation to the Son is presented as closely parallel with the work of the Son in relation to the Father (<a onClick="return mV(\'Jhn\',16,5);">Joh 16:5</a>).\' But now I go unto Him that sent me...Nevertheless I tell you the truth; it is expedient for you that I go away; for, if I go not away the Advocate will not come unto you; but if I go I will send Him unto you. And He, after He is come, will convict the world...of righteousness because I go to the Father and ye behold me no more....I have yet many things to say unto you, but ye cannot bear them now. Howbeit when He, the Spirit of truth is come, He shall guide you into all the truth; for He shall not speak from Himself; but what things soever He shall hear, He shall speak, and He shall declare unto you the things that are to come. He shall glorify me: for He shall take of mine and shall show it unto you. All things whatsoever the Father hath are mine: therefore said I that He taketh of mine, and shall declare it unto you.\' Here the Spirit is sent by the Son, and comes in order to complete and apply the Son\'s work, receiving His whole commission from the Son—not, however, in derogation of the Father, because when we speak of the things of the Son, that is to speak of the things of the Father.<P>It is not to be said, of course, that the doctrine of the Trinity is formulated in passages like these, with which the whole mass of our Lord\'s discourses in John are strewn; but it certainly is presupposed in them, and that is, considered from the point of view of their probative force, even better. As we read we are kept in continual contact with three Persons who act, each as a distinct person, and yet who are in a deep, underlying sense, one. There is but one God—there is never any question of that—and yet this Son who has been sent into the world by God not only represents God but is God, and this Spirit whom the Son has in turn sent unto the world is also Himself God. Nothing could be clearer than that the Son and Spirit are distinct Persons, unless indeed it be that the Son of God is just God the Son and the Spirit of God just God the Spirit.<P>13. The Baptismal Formula:<P>Meanwhile, the nearest approach to a formal announcement of the doctrine of the Trinity which is recorded from our Lord\'s lips, or, perhaps we may say, which is to be found in the whole compass of the New Testament, has been preserved for us, not by John, but by one of the synoptists. It too, however, is only incidentally introduced, and has for its main object something very different from formulating the doctrine of the Trinity. It is embodied in the great commission which the resurrected Lord gave His disciples to be their "marching orders" "even unto the end of the world": "Go ye therefore, and make disciples of all the nations, baptizing them into the name of the Father and of the Son and of the Holy Spirit" (<a onClick="return mV(\'Mat\',28,19);">Mt 28:19</a>). In seeking to estimate the significance of this great declaration, we must bear in mind the high solemnity of the utterance, by which we are required to give its full value to every word of it. Its phrasing is in any event, however, remarkable. It does not say, "In the names (plural) of the Father and of the Son and of the Holy Ghost"; nor yet (what might be taken to be equivalent to that), "In the name of the Father, and in the name of the Son, and in the name of the Holy Ghost," as if we had to deal with three separate Beings. Nor, on the other hand does it say, "In the name of the Father, Son and Holy Ghost," as if "the Father, Son and Holy Ghost" might be taken as merely three designations of a single person. With stately impressiveness it asserts the unity of the three by combining them all within the bounds of the single Name; and then throws up into emphasis the distinctness of each by introducing them in turn with the repeated article: "In the name of the Father, and of the Son, and of the Holy Ghost (the King James Version). These three, the Father, and the Son, and the Holy Ghost, each stand in some clear sense over against the others in distinct personality: these three, the Father, and the Son, and the Holy Ghost, all unite in some profound sense in the common participation of the one Name. Fully to comprehend the implication of this mode of statement, we must bear in mind, further, the significance of the term, "the name," and the associations laden with which it came to the recipients of this commission. For the Hebrew did not think of the name, as we are accustomed to do, as a mere external symbol; but rather as the adequate expression of the innermost being of its bearer. In His Name the Being of God finds expression; and the Name of God—"this glorious and fearful name, Yahweh thy God" (<a onClick="return mV(\'Deu\',28,58);">De 28:58</a>)—was accordingly a most sacred thing, being indeed virtually equivalent to God Himself. It is no solecism, therefore, when we read (<a onClick="return mV(\'Isa\',30,27);">Isa 30:27</a>), "Behold, the name of Yahweh cometh"; and the parallelisms are most instructive when we read (<a onClick="return mV(\'Isa\',59,19);">Isa 59:19</a>): \'So shall they fear the Name of Yahweh from the west, and His glory from the rising of the sun; for He shall come as a stream pent in which the Spirit of Yahweh driveth.\' So pregnant was the implication of the Name, that it was possible for the term to stand absolutely, without adjunction of the name itself, as the sufficient representative of the majesty of Yahweh: it was a terrible thing to \'blaspheme the Name\' (<a onClick="return mV(\'Lev\',24,11);">Le 24:11</a>). All those over whom Yahweh\'s Name was called were His, His possession to whom He owed protection. It is for His Name\'s sake, therefore, that afflicted Judah cries to the Hope of Israel, the Saviour thereof in time of trouble: \'O Yahweh, Thou art in the midst of us, and Thy Name is called upon us; leave us not\' (<a onClick="return mV(\'Jer\',14,9);">Jer 14:9</a>); and His people find the appropriate expression of their deepest shame in the lament, \'We have become as they over whom Thou never barest rule; as they upon whom Thy Name was not called\' (<a onClick="return mV(\'Isa\',63,19);">Isa 63:19</a>); while the height of joy is attained in the cry, \'Thy Name, Yahweh, God of Hosts, is called upon me\' (<a onClick="return mV(\'Jer\',15,16);">Jer 15:16</a>; compare <a onClick="return mV(\'2Ch\',7,14);">2Ch 7:14</a>; <a onClick="return mV(\'Dan\',9,18,19);">Da 9:18,19</a>). When, therefore, our Lord commanded His disciples to baptize those whom they brought to His obedience "into the name of...," He was using language charged to them with high meaning. He could not have been understood otherwise than as substituting for the Name of Yahweh this other Name "of the Father, and of the Son, and of the Holy Ghost"; and this could not \'possibly have meant to His disciples anything else than that Yahweh was now to be known to them by the new Name, of the Father, and the Son, and the Holy Ghost. The only alternative would have been that, for the community which He was rounding, Jesus was supplanting Yahweh by a new God; and this alternative is no less than monstrous. There is no alternative, therefore, to understanding Jesus here to be giving for His community a new Name to Yahweh, and that new Name to be the threefold Name of "the Father, and the Son, and the Holy Ghost." Nor is there room for doubt that by "the Son" in this threefold Name, He meant just Himself with all the implications of distinct personality which this carries with it; and, of course, that further carries with it the equally distinct personality of "the Father" and "the Holy Ghost," with whom "the Son" is here associated, and from whom alike "the Son" is here distinguished. This is a direct ascription to Yahweh, the God of Israel, of a threefold personality, and is therewith the direct enunciation of the doctrine of the Trinity. We are not witnessing here the birth of the doctrine of the Trinity; that is presupposed. What we are witnessing is the authoritative announcement of the Trinity as the God of Christianity by its Founder, in one of the most solemn of His recorded declarations. Israel had worshipped the one only true God under the Name of Yahweh; Christians are to worship the same one only and true God under the Name of "the Father, and the Son, and the Holy Ghost." This is the distinguishing characteristic of Christians; and that is as much as to say that the doctrine of the Trinity is, according to our Lord\'s own apprehension of it, the distinctive mark of the religion which He founded.<P>14. Genuineness of Baptismal Formula:<P>A passage of such range of implication has, of course, not escaped criticism and challenge. An attempt which cannot be characterized as other than frivolous has even been made to dismiss it from the text of Matthew\'s Gospel. Against this, the whole body of external evidence cries out; and the internal evidence is of itself not less decisive to the same effect. When the "universalism," "ecclesiasticism," and "high theology" of the passage are pleaded against its genuineness, it is forgotten that to the Jesus of Matthew there are attributed not only such parables as those of the Leaven and the Mustard Seed, but such declarations as those contained in <a onClick="return mV(\'Mat\',8,11,12);">8:11,12</A>; <a onClick="return mV(\'Mat\',21,43);">21:43</A>; <a onClick="return mV(\'Mat\',24,14);">24:14</A>; that in this Gospel alone is Jesus recorded as speaking familiarly about His church (<a onClick="return mV(\'Mat\',16,18);">16:18</A>; <a onClick="return mV(\'Mat\',18,17);">18:17</A>); and that, after the great declaration of <a onClick="return mV(\'Mat\',11,27);">11:27</A> if, nothing remained in lofty attribution to be assigned to Him. When these same objections are urged against recognizing the passage as an authentic saying of Jesus own, it is quite obvious that the Jesus of the evangelists cannot be in mind. The declaration here recorded is quite in character with the Jesus of Matthew\'s Gospel, as has just been intimated; and no less with the Jesus of the whole New Testament transmission. It will scarcely do, first to construct a priori a Jesus to our own liking, and then to discard as "unhistorical" all in the New Testament transmission which would be unnatural to such a Jesus. It is not these discarded passages but our a priori Jesus which is unhistorical. In the present instance, moreover, the historicity of the assailed saying is protected by an important historical relation in which it stands. It is not merely Jesus who speaks out of a Trinitarian consciousness, but all the New Testament writers as well. The universal possession by. His followers of so firm a hold on such a doctrine requires the assumption that some such teaching as is here attributed to Him was actually contained in Jesus\' instructions to His followers. Even had it not been attributed to Him in so many words by the record, we should have had to assume that some such declaration had been made by Him. In these circumstances, there can be no good reason to doubt that it was made by Him, when it is expressly attributed to Him by the record.<P>15. Paul\'s Trinitarianism:<P>When we turn from the discourses of Jesus to the writings of His followers with a view to observing how the assumption of the doctrine of the Trinity underlies their whole fabric also, we naturally go first of all to the letters of Paul. Their very mass is impressive; and the definiteness with which their composition within a generation of the death of Jesus may be fixed adds importance to them as historical witnesses. Certainly they leave nothing to be desired in the richness of their testimony to the Trinitarian conception of God which underlies them. Throughout the whole series, from 1 Thessalonians, which comes from about 52 AD, to 2 Timothy, which was written about 68 AD, the redemption, which it is their one business to proclaim and commend, and all the blessings which enter into it or accompany it are referred consistently to a threefold divine causation. Everywhere, throughout their pages, God the Father, the Lord Jesus Christ, and the Holy Spirit appear as the joint objects of all religious adoration, and the conjunct source of all divine operations. In the freedom of the allusions which are made to them, now and again one alone of the three is thrown up into prominent view; but more often two of them are conjoined in thanksgiving or prayer; and not infrequently all three are brought together as the apostle strives to give some adequate expression to his sense of indebtedness to the divine source of all good for blessings received, or to his longing on behalf of himself or of his readers for further communion with the God of grace. It is regular for him to begin his Epistles with a prayer for "grace and peace" for his readers, "from God our Father, and the Lord Jesus Christ," as the joint source of these divine blessings by way of eminence (<a onClick="return mV(\'Rom\',1,7);">Ro 1:7</a>; <a onClick="return mV(\'1Cr\',1,3);">1Co 1:3</a>; <a onClick="return mV(\'2Cr\',1,2);">2Co 1:2</a>; <a onClick="return mV(\'Gal\',1,3);">Ga 1:3</a>; <a onClick="return mV(\'Eph\',1,2);">Eph 1:2</a>; <a onClick="return mV(\'Phl\',1,2);">Php 1:2</a>; <a onClick="return mV(\'2Th\',1,2);">2Th 1:2</a>; <a onClick="return mV(\'1Ti\',1,2);">1Ti 1:2</a>; <a onClick="return mV(\'2Ti\',1,2);">2Ti 1:2</a>; <a onClick="return mV(\'Phm\',1,3);">Phm 1:3</a>; compare <a onClick="return mV(\'1Th\',1,1);">1Th 1:1</a>). It is obviously no departure from this habit in the essence of the matter, but only in relative fullness of expression, when in the opening words of the Epistle to the Colossians, the clause "and the Lord Jesus Christ" is omitted, and we read merely: "Grace to you and peace from God our Father." So also it would have been no departure from it in the essence of the matter, but only in relative fullness of expression, if in any instance the name of the Holy Spirit had chanced to be adjoined to the other two, as in the single instance of <a onClick="return mV(\'2Cr\',13,14);">2Co 13:14</a> it is adjoined to them in the closing prayer for grace with which Paul ends his letters, and which ordinarily takes the simple form of, "the grace of our Lord Jesus Christ be with you" (<a onClick="return mV(\'Rom\',16,20);">Ro 16:20</a>; <a onClick="return mV(\'1Cr\',16,23);">1Co 16:23</a>; <a onClick="return mV(\'Gal\',6,18);">Ga 6:18</a>; <a onClick="return mV(\'Phl\',4,23);">Php 4:23</a>; <a onClick="return mV(\'1Th\',5,28);">1Th 5:28</a>; <a onClick="return mV(\'2Th\',3,18);">2Th 3:18</a>; <a onClick="return mV(\'Phm\',1,25);">Phm 1:25</a>; more expanded form, <a onClick="return mV(\'Eph\',6,23,24);">Eph 6:23,24</a>; more Compressed, <a onClick="return mV(\'Col\',4,18);">Col 4:18</a>; <a onClick="return mV(\'1Ti\',6,21);">1Ti 6:21</a>; <a onClick="return mV(\'2Ti\',4,22);">2Ti 4:22</a>; <a onClick="return mV(\'Tts\',3,15);">Tit 3:15</a>). Between these opening and closing passages the allusions to God the Father, the Lord Jesus Christ, and the Holy Spirit are constant and most intricately interlaced. Paul\'s monotheism is intense: the first premise of all his thought on divine things is the unity of God (<a onClick="return mV(\'Rom\',3,30);">Ro 3:30</a>; <a onClick="return mV(\'1Cr\',8,4);">1Co 8:4</a>; <a onClick="return mV(\'Gal\',3,20);">Ga 3:20</a>; <a onClick="return mV(\'Eph\',4,6);">Eph 4:6</a>; <a onClick="return mV(\'1Ti\',2,5);">1Ti 2:5</a>; compare <a onClick="return mV(\'Rom\',16,22);">Ro 16:22</a>; <a onClick="return mV(\'1Ti\',1,17);">1Ti 1:17</a>). Yet to him God the Father is no more God than the Lord Jesus Christ is God, or the Holy Spirit is God. The Spirit of God is to him related to God as the spirit of man is to man (<a onClick="return mV(\'1Cr\',2,11);">1Co 2:11</a>), and therefore if the Spirit of God dwells in us, that is God dwelling in us (<a onClick="return mV(\'Rom\',8,10);">Ro 8:10</a>), and we are by that fact constituted temples of God (<a onClick="return mV(\'1Cr\',3,16);">1Co 3:16</a>). And no expression is too strong for him to use in order to assert the Godhead of Christ: He is "our great God" (<a onClick="return mV(\'Tts\',2,13);">Tit 2:13</a>); He is "God over all" (<a onClick="return mV(\'Rom\',9,5);">Ro 9:5</a>); and indeed it is expressly declared of Him that the "fulness of the Godhead, that is, everything that enters into Godhead and constitutes it Godhead, dwells in Him. In the very act of asserting his monotheism Paul takes our Lord up into this unique Godhead. "There is no God but one" he roundly asserts, and then illustrates and proves this assertion by remarking that the heathen may have "gods many, and lords many," but "to us there is one God, the Father, of whom are all things, and we unto him; and one Lord, Jesus Christ, through whom are all things, and we through him" (<a onClick="return mV(\'1Cr\',8,6);">1Co 8:6</a>). Obviously, this "one God, the Father," and "one Lord, Jesus Christ," are embraced together in the one God who alone is. Paul\'s conception of the one God, whom alone he worships, includes, in other words, a recognition that within the unity of His Being, there exists such a distinction of Persons as is given us in the "one God, the Father" and the "one Lord, Jesus Christ."``187';
isbe[8927]='Trinity, 2`16. Conjunction of the Three in Paul:<P>In numerous passages scattered through Paul\'s Epistles, from the earliest of them (<a onClick="return mV(\'1Th\',1,\'2-5\');">1Th 1:2-5</a>; <a onClick="return mV(\'2Th\',2,13,14);">2Th 2:13,14</a>) to the latest (<a onClick="return mV(\'Tts\',3,\'4-6\');">Tit 3:4-6</a>; <a onClick="return mV(\'2Ti\',1,3,13,14);">2Ti 1:3,13,14</a>), all three Persons, God the Father, the Lord Jesus Christ and the Holy Spirit, are brought together, in the most incidental manner, as co-sources of all the saving blessings which come to believers in Christ. A typical series of such passages may be found in <a onClick="return mV(\'Eph\',2,18);">Eph 2:18</a>; <a onClick="return mV(\'Eph\',3,\'2-5\',14,17);">3:2-5,14,17</a>; <a onClick="return mV(\'Eph\',4,\'4-6\');">4:4-6</a>; <a onClick="return mV(\'Eph\',5,\'18-20\');">5:18-20</a>. But the most interesting instances are offered to us perhaps by the Epistles to the Corinthians. In <a onClick="return mV(\'1Cr\',12,\'4-6\');">1Co 12:4-6</a> Paul presents the abounding spiritual gifts with which the church was blessed in a threefold aspect, and connects these aspects with the three Divine Persons. "Now there are diversities of gifts, but the same Spirit. And there are diversities of ministrations, and the same Lord. And there are diversities of workings, but the same God, who worketh all things in all." It may be thought that there is a measure of what might almost be called artificiality in assigning the endowments of the church, as they are graces to the Spirit, as they are services to Christ, and as they are energizings to God. But thus there is only the more strikingly revealed the underlying Trinitarian conception as dominating the structure of the clauses: Paul clearly so writes, not because "gifts," "workings," "operations" stand out in his thought as greatly diverse things, but because God, the Lord, and the Spirit lie in the back of his mind constantly suggesting a threefold causality behind every manifestation of grace. The Trinity is alluded to rather than asserted; but it is so alluded to as to show that it constitutes the determining basis of all Paul\'s thought of the God of redemption. Even more instructive is <a onClick="return mV(\'2Cr\',13,14);">2Co 13:14</a>, which has passed into general liturgical use in the churches as a benediction: "The grace of the Lord Jesus Christ, and the love of God, and the communion of the Holy Spirit, be with you all." Here the three highest redemptive blessings are brought together, and attached distributively to the three Persons of the Triune God. There is again no formal teaching of the doctrine of the Trinity; there is only another instance of natural speaking out of a Trinitarian consciousness. Paul is simply thinking of the divine source of these great blessings; but he habitually thinks of this divine source of redemptive blessings after a trinal fashion. He therefore does not say, as he might just as well have said, "The grace and love and communion of God be with you all," but "The grace of the Lord Jesus Christ, and the love of God, and the communion of the Holy Spirit, be with you all." Thus he bears, almost unconsciously but most richly, witness to the trinal composition of the Godhead as conceived by Him.<P>17. Trinitarianism of Other New Testament Writers:<P>The phenomena of Paul\'s Epistles are repeated in the other writings of the New Testament. In these other writings also it is everywhere assumed that the redemptive activities of God rest on a threefold source in God the Father, the Lord Jesus Christ, and the Holy Spirit; and these three Persons repeatedly come forward together in the expressions of Christian hope or the aspirations of Christian devotion (e.g. <a onClick="return mV(\'Hbr\',2,3,4);">Heb 2:3,4</a>; <a onClick="return mV(\'Hbr\',6,\'4-6\');">6:4-6</a>; <a onClick="return mV(\'Hbr\',10,\'29-31\');">10:29-31</a>; <a onClick="return mV(\'1Pe\',1,2);">1Pe 1:2</a>; <a onClick="return mV(\'1Pe\',2,\'3-12\');">2:3-12</a>; <a onClick="return mV(\'1Pe\',4,\'13-19\');">4:13-19</a>; <a onClick="return mV(\'1Jo\',5,\'4-8\');">1Joh 5:4-8</a>; <a onClick="return mV(\'Jud\',1,20,21);">Jude 1:20,21</a>; <a onClick="return mV(\'Rev\',14,1);">Re 1:4-6</a>). Perhaps as typical instances as any are supplied by the two following: "According to the foreknowledge of God the Father, in sanctification of the Spirit, unto obedience and sprinkling of the blood of Jesus Christ" (<a onClick="return mV(\'1Pe\',1,2);">1Pe 1:2</a>); "Praying in the Holy Spirit, keep yourselves in the love of God, looking for the mercy of our Lord Jesus Christ unto eternal life" (<a onClick="return mV(\'Jud\',1,20,21);">Jude 1:20,21</a>). To these may be added the highly symbolical instance from the Apocalypse: \'Grace to you and peace from Him which is and was and which is to come; and from the Seven Spirits which are before His throne; and from Jesus Christ, who is the faithful witness, the firstborn of the dead, and the ruler of the kings of the earth\' (<a onClick="return mV(\'Rev\',1,4,5);">Re 1:4,5</a>). Clearly these writers, too, write out of a fixed Trinitarian consciousness and bear their testimony to the universal understanding current in apostolical circles. Everywhere and by all it was fully understood that the one God whom Christians worshipped and from whom alone they expected redemption and all that redemption brought with it, included within His undiminished unity the three: God the Father, the Lord Jesus Christ, and the Holy Spirit, whose activities relatively to one another are conceived as distinctly personal. This is the uniform and pervasive testimony of the New Testament, and it is the more impressive that it is given with such unstudied naturalness and simplicity, with no effort to distinguish between what have come to be called the ontological and the economical aspects of the Trinitarian distinctions, and indeed without apparent consciousness of the existence of such a distinction of aspects. Whether God is thought of in Himself or in His operations, the underlying conception runs unaffectedly into trinal forms.<P>18. Variations in Nomenclature:<P>It will not have escaped observation that the Trinitarian terminology of Paul and the other writers of the New Testament is not precisely identical with that of our Lord as recorded for us in His discourses. Paul, for example—and the same is true of the other New Testament writers (except John)—does not speak, as our Lord is recorded as speaking, of the Father, the Son, and the Holy Spirit, so much as of God, the Lord Jesus Christ, and the Holy Spirit. This difference of terminology finds its account in large measure in the different relations in which the speakers stand to the Trinity. our Lord could not naturally speak of Himself, as one of the Trinitarian Persons, by the designation of "the Lord," while the designation of "the Son," expressing as it does His consciousness of close relation, and indeed of exact similarity, to God, came naturally to His lips. But He was Paul\'s Lord; and Paul naturally thought and spoke of Him as such. In point of fact, "Lord" is one of Paul\'s favorite designations of Christ, and indeed has become with him practically a proper name for Christ, and in point of fact, his Divine Name for Christ. It is naturally, therefore, his Trinitarian name for Christ. Because when he thinks of Christ as divine he calls Him "Lord," he naturally, when he thinks of the three Persons together as the Triune God, sets Him as "Lord" by the side of God—Paul\'s constant name for "the Father"—and the Holy Spirit. Question may no doubt be raised whether it would have been possible for Paul to have done this, especially with the constancy with which he has done it, if, in his conception of it, the very essence of the Trinity were enshrined in the terms "Father" and "Son." Paul is thinking of the Trinity, to be sure, from the point of view of a worshipper, rather than from that of a systematizer. He designates the Persons of the Trinity therefore rather from his relations to them than from their relations to one another. He sees in the Trinity his God, his Lord, and the Holy Spirit who dwells in him; and naturally he so speaks currently of the three Persons. It remains remarkable, nevertheless, if the very essence of the Trinity were thought of by him as resident in the terms "Father," "Son," that in his numerous allusions to the Trinity in the Godhead, he never betrays any sense of this. It is noticeable also that in their allusions to the Trinity, there is preserved, neither in Paul nor in the other writers of the New Testament, the order of the names as they stand in our Lord\'s great declaration (<a onClick="return mV(\'Mat\',28,19);">Mt 28:19</a>). The reverse order occurs, indeed, occasionally, as, for example, in <a onClick="return mV(\'1Cr\',12,\'4-6\');">1Co 12:4-6</a> (compare <a onClick="return mV(\'Eph\',4,\'4-6\');">Eph 4:4-6</a>); and this may be understood as a climactic arrangement and so far a testimony to the order of <a onClick="return mV(\'Mat\',28,19);">Mt 28:19</a>. But the order is very variable; and in the most formal enumeration of the three Persons, that of <a onClick="return mV(\'2Cr\',13,14);">2Co 13:14</a>, it stands thus: Lord, God, Spirit. The question naturally suggests itself whether the order Father, Son, Spirit was especially significant to Paul and his fellow-writers of the New Testament. If in their conviction the very essence of the doctrine of the Trinity was embodied in this order, should we not anticipate that there should appear in their numerous allusions to the Trinity some suggestion of this conviction?<P>19. Implications of "Son" and "Spirit":<P>Such facts as these have a bearing upon the testimony of the New Testament to the interrelations of the Persons of the Trinity. To the fact of the Trinity—to the fact, that is, that in the unity of the Godhead there subsist three Persons, each of whom has his particular part in the working out of salvation—the New Testament testimony is clear, consistent, pervasive and conclusive. There is included in this testimony constant and decisive witness to the complete and undiminished Deity of each of these Persons; no language is too exalted to apply to each of them in turn in the effort to give expression to the writer\'s sense of His Deity: the name that is given to each is fully understood to be "the name that is above every name." When we attempt to press the inquiry behind the broad fact, however, with a view to ascertaining exactly how the New Testament writers conceive the three Persons to be related, the one to the other, we meet with great difficulties. Nothing could seem more natural, for example, than to assume that the mutual relations of the Persons of the Trinity are revealed in the designations, "the Father, the Son, and the Holy Spirit," which are given them by our Lord in the solemn formula of <a onClick="return mV(\'Mat\',28,19);">Mt 28:19</a>. Our confidence in this assumption is somewhat shaken, however, when we observe, as we have just observed, that these designations are not carefully preserved in their allusions to the Trinity by the writers of the New Testament at large, but are characteristic only of our Lord\'s allusions and those of John, whose modes of speech in general very closely resemble those of our Lord. Our confidence is still further shaken when we observe that the implications with respect to the mutual relations of the Trinitarian Persons, which are ordinarily derived from these designations, do not so certainly lie in them as is commonly supposed.<P>It may be very natural to see in the designation "Son" an intimation of subordination and derivation of Being, and it may not be difficult to ascribe a similar connotation to the term "Spirit." But it is quite certain that this was not the denotation of either term in the Semitic consciousness, which underlies the phraseology of Scripture; and it may even be thought doubtful whether it was included even in their remoter suggestions. What underlies the conception of sonship in Scriptural speech is just "likeness"; whatever the father is that the son is also. The emphatic application of the term "Son" to one of the Trinitarian Persons, accordingly, asserts rather His equality with the Father than His subordination to the Father; and if there is any implication of derivation in it, it would appear to be very distant. The adjunction of the adjective "only begotten" (<a onClick="return mV(\'Jhn\',1,14);">Joh 1:14</a>; <a onClick="return mV(\'Jhn\',3,\'16-18\');">3:16-18</a>; <a onClick="return mV(\'1Jo\',4,9);">1Joh 4:9</a>) need add only the idea of uniqueness, not of derivation (<a onClick="return mV(\'Psa\',22,21);">Ps 22:21</a>; <a onClick="return mV(\'Psa\',25,16);">25:16</a>; <a onClick="return mV(\'Psa\',35,17);">35:17</a>; <span class="noTag">The Wisdom of Solomon 7:22</span> margin); and even such a phrase as "God only begotten" (<a onClick="return mV(\'Jhn\',1,18);">Joh 1:18</a> margin) may contain no implication of derivation, but only of absolutely unique consubstantiality; as also such a phrase as \'the first-begotten of all creation\' (<a onClick="return mV(\'Col\',1,15);">Col 1:15</a>) may convey no intimation of coming into being, but merely assert priority of existence. In like manner, the designation "Spirit of God" or "Spirit of Yahweh," which meets us frequently in the Old Testament, certainly does not convey the idea there either of derivation or of subordination, but is just the executive name of God—the designation of God from the point of view of His activity—and imports accordingly identity with God; and there is no reason to suppose that, in passing from the Old Testament to the New Testament, the term has taken on an essentially different meaning. It happens, oddly enough, moreover, that we have in the New Testament itself what amounts almost to formal definitions of the two terms "Son" and "Spirit," and in both cases the stress is laid on the notion of equality or sameness. In <a onClick="return mV(\'Jhn\',5,18);">Joh 5:18</a> we read: \'On this account, therefore, the Jews sought the more to kill him, because, not only did he break the Sabbath, but also called God his own Father, making himself equal to God.\' The point lies, of course, in the adjective "own." Jesus was, rightly, understood to call God "his own Father," that is, to use the terms "Father" and "Son" not in a merely figurative sense, as when Israel was called God\'s son, but in the real sense. And this was understood to be claiming to be all that God is. To be the Son of God in any sense was to be like God in that sense; to be God\'s own Son was to be exactly like God, to be "equal with God." Similarly, we read in <a onClick="return mV(\'1Cr\',2,10,11);">1Co 2:10,11</a>: \'For the Spirit searcheth all things, yea, the deep things of God. For who of men knoweth the things of a man, save the spirit of man which is in him? Even so the things of God none knoweth, save the Spirit of God.\' Here the Spirit appears as the substrate of the divine self-consciousness, the principle of God\'s knowledge of Himself: He is, in a word, just God Himself in the innermost essence of His Being. As the spirit of man is the seat of human life, the very life of man itself, so the Spirit of God is His very life-element. How can He be supposed, then, to be subordinate to God, or to derive His Being from God? If, however, the subordination of the Son and Spirit to the Father in modes of subsistence and their derivation from the Father are not implicates of their designation as Son and Spirit, it will be hard to find in the New Testament compelling evidence of their subordination and derivation.<P>20. The Question of Surbordination:<P>There is, of course, no question that in "modes of operation," as it is technically called—that is to say, in the functions ascribed to the several persons of the Trinity in the redemptive process, and, more broadly, in the entire dealing of God with the world—the principle of subordination is clearly expressed. The Father is first, the Son is second, and the Spirit is third, in the operations of God as revealed to us in general, and very especially in those operations by which redemption is accomplished. Whatever the Father does, He does through the Son (<a onClick="return mV(\'Rom\',2,16);">Ro 2:16</a>; <a onClick="return mV(\'Rom\',3,22);">3:22</a>; <a onClick="return mV(\'Rom\',5,1,11,17,21);">5:1,11,17,21</a>; <a onClick="return mV(\'Eph\',1,5);">Eph 1:5</a>; <a onClick="return mV(\'1Th\',5,9);">1Th 5:9</a>; <a onClick="return mV(\'Tts\',3,5);">Tit 3:5</a>) by the Spirit. The Son is sent by the Father and does His Father\'s will (<a onClick="return mV(\'Jhn\',6,38);">Joh 6:38</a>); the Spirit is sent by the Son and does not speak from Himself, but only takes of Christ\'s and shows it unto His people (<a onClick="return mV(\'Jhn\',17,7);">Joh 17:7</a>); and we have our Lord\'s own word for it that \'one that is sent is not greater than he that sent him\' (<a onClick="return mV(\'Jhn\',13,16);">Joh 13:16</a>). In crisp decisiveness, our Lord even declares, indeed: \'My Father is greater than I\' (<a onClick="return mV(\'Jhn\',14,28);">Joh 14:28</a>); and Paul tells us that Christ is God\'s, even as we are Christ\'s (<a onClick="return mV(\'1Cr\',3,23);">1Co 3:23</a>), and that as Christ is "the head of every man," so God is "the head of Christ" (<a onClick="return mV(\'1Cr\',11,3);">1Co 11:3</a>). But it is not so clear that the principle of subordination rules also in "modes of subsistence," as it is technically phrased; that is to say, in the necessary relation of the Persons of the Trinity to one another. The very richness and variety of the expression of their subordination, the one to the other, in modes of operation, create a difficulty in attaining certainty whether they are represented as also subordinate the one to the other in modes of subsistence. Question is raised in each case of apparent intimation of subordination in modes of subsistence, whether it may not, after all, be explicable as only another expression of subordination in modes of operation. It may be natural to assume that a subordination in modes of operation rests on a subordination in modes of subsistence; that the reason why it is the Father that sends the Son and the Son that sends the Spirit is that the Son is subordinate to the Father, and the Spirit to the Son. But we are bound to bear in mind that these relations of subordination in modes of operation may just as well be due to a convention, an agreement, between the Persons of the Trinity—a "Covenant" as it is technically called—by virtue of which a distinct function in the work of redemption is voluntarily assumed by each. It is eminently desirable, therefore, at the least, that some definite evidence of subordination in modes of subsistence should be discoverable before it is assumed. In the case of the relation of the Son to the Father, there is the added difficulty of the incarnation, in which the Son, by the assumption of a creaturely nature into union with Himself, enters into new relations with the Father of a definitely subordinate character. Question has even been raised whether the very designations of Father and Son may not be expressive of these new relations, and therefore without significance with respect to the eternal relations of the Persons so designated. This question must certainly be answered in the negative. Although, no doubt, in many of the instances in which the terms "Father" and "Son" occur, it would be possible to take them of merely economical relations, there ever remain some which are intractable to this treatment, and we may be sure that "Father" and "Son" are applied to their eternal and necessary relations. But these terms, as we have seen, do not appear to imply relations of first and second, superiority and subordination, in modes of subsistence; and the fact of the humiliation of the Son of God for His earthly work does introduce a factor into the interpretation of the passages which import His subordination to the Father, which throws doubt upon the inference from them of an eternal relation of subordination in the Trinity itself. It must at least be said that in the presence of the great New Testament doctrines of the Covenant of Redemption on the one hand, and of the Humiliation of the Son of God for His work\'s sake and of the Two Natures in the constitution of His Person as incarnated, on the other, the difficulty of interpreting subordinationist passages of eternal relations between the Father and Son becomes extreme. The question continually obtrudes itself, whether they do not rather find their full explanation in the facts embodied in the doctrines of the Covenant, the Humiliation of Christ, and the Two Natures of His incarnated Person. Certainly in such circumstances it were thoroughly illegitimate to press such passages to suggest any subordination for the Son or the Spirit which would in any manner impair that complete identity with the Father in Being and that complete equality with the Father in powers which are constantly presupposed, and frequently emphatically, though only incidentally, asserted for them throughout the whole fabric of the New Testament.<P>21. Witness of the Christian Consciousness:<P>The Trinity of the Persons of the Godhead, shown in the incarnation and the redemptive work of God the Son, and the descent and saving work of God the Spirit, is thus everywhere assumed in the New Testament, and comes to repeated fragmentary but none the less emphatic and illuminating expression in its pages. As the roots of its revelation are set in the threefold divine causality of the saving process, it naturally finds an echo also in the consciousness of everyone who has experienced this salvation. Every redeemed soul, knowing himself reconciled with God through His Son, and quickened into newness of life by His Spirit, turns alike to Father, Son and Spirit with the exclamation of reverent gratitude upon his lips, "My Lord and my God!" If he could not construct the doctrine of the Trinity out of his consciousness of salvation, yet the elements of his consciousness of salvation are interpreted to him and reduced to order only by the doctrine of the Trinity which he finds underlying and giving their significance and consistency to the teaching of the Scriptures as to the processes of salvation. By means of this doctrine he is able to think clearly and consequently of his threefold relation to the saving God, experienced by him as Fatherly love sending a Redeemer, as redeeming love executing redemption, as saving love applying redemption: all manifestations in distinct methods and by distinct agencies of the one seeking and saving love of God. Without the doctrine of the Trinity, his conscious Christian life would be thrown into confusion and left in disorganization if not, indeed, given an air of unreality; with the doctrine of the Trinity, order, significance and reality are brought to every element of it. Accordingly, the doctrine of the Trinity and the doctrine of redemption, historically, stand or fall together. A Unitarian theology is commonly associated with a Pelagian anthropology and a Socinian soteriology. It is a striking testimony which is borne by E. Koenig (Offenbarungsbegriff des Altes Testament,1882,I, 125): "I have learned that many cast off the whole history of redemption for no other reason than because they have not attained to a conception of the Triune God." It is in this intimacy of relation between the doctrines of the Trinity and redemption that the ultimate reason lies why the Christian church could not rest until it had attained a definite and well-compacted doctrine of the Trinity. Nothing else could be accepted as an adequate foundation for the experience of the Christian salvation. Neither the Sabellian nor the Arian construction could meet and satisfy the data of the consciousness of salvation, any more than either could meet and satisfy the data of the Scriptural revelation. The data of the Scriptural revelation might, to be sure, have been left unsatisfied: men might have found a modus vivendi with neglected, or even with perverted Scriptural teaching. But perverted or neglected elements of Christian experience are more clamant in their demands for attention and correction. The dissatisfied Christian consciousness necessarily searched the Scriptures, on the emergence of every new attempt to state the doctrine of the nature and relations of God, to see whether these things were true, and never reached contentment until the Scriptural data were given their consistent formulation in a valid doctrine of the Trinity. Here too the heart of man was restless until it found its rest in the Triune God, the author, procurer and applier of salvation.<P>22. Formulation of the Doctrine:<P>The determining impulse to the formulation of the doctrine of the Trinity in the church was the church\'s profound conviction of the absolute Deity of Christ, on which as on a pivot the whole Christian conception of God from the first origins of Christianity turned. The guiding principle in the formulation of the doctrine was supplied by the Baptismal Formula announced by Jesus (<a onClick="return mV(\'Mat\',28,19);">Mt 28:19</a>), from which was derived the ground-plan of the baptismal confessions and "rules of faith" which very soon began to be framed all over the church. It was by these two fundamental principia—the true Deity of Christ and the Baptismal Formula—that all attempts to formulate the Christian doctrine of God were tested, and by their molding power that the church at length found itself in possession of a form of statement which did full justice to the data of the redemptive revelation as reflected in the New Testament and the demands of the Christian heart under the experience of salvation.<P>In the nature of the case the formulated doctrine was of slow attainment. The influence of inherited conceptions and of current philosophies inevitably showed itself in the efforts to construe to the intellect the immanent faith of Christians. In the 2nd century the dominant neo-Stoic and neo-Platonic ideas deflected Christian thought into subordinationist channels, and produced what is known as the Logos-Christology, which looks upon the Son as a prolation of Deity reduced to such dimensions as comported with relations with a world of time and space; meanwhile, to a great extent, the Spirit was neglected altogether. A reaction which, under the name of Monarchianism, identified the Father, Son, and Spirit so completely that they were thought of only as different aspects or different moments in the life of the one Divine Person, called now Father, now Son, now Spirit, as His several activities came successively into view, almost succeeded in establishing itself in the 3rd century as the doctrine of the church at large. In the conflict between these two opposite tendencies the church gradually found its way, under the guidance of the Baptismal Formula elaborated into a "Rule of Faith," to a better and more well-balanced conception, until a real doctrine of the Trinity at length came to expression, particularly in the West, through the brilliant dialectic of Tertullian. It was thus ready at hand, when, in the early years of the 4th century, the Logos-Christology, in opposition to dominant Sabellian tendencies, ran to seed in what is known as Arianism, to which the Son was a creature, though exalted above all other creatures as their Creator and Lord; and the church was thus prepared to assert its settled faith in a Triune God, one in being, but in whose unity there subsisted three consubstantial Persons. Under the leadership of Athanasius this doctrine was proclaimed as the faith of the church at the Council of Nice in 325 AD, and by his strenuous labors and those of "the three great Cappadocians," the two Gregories and Basil, it gradually won its way to the actual acceptance of the entire church. It was at the hands of Augustine, however, a century later, that the doctrine thus become the church doctrine in fact as well as in theory, received its most complete elaboration and most carefully grounded statement. In the form which he gave it, and which is embodied in that "battle-hymn of the early church," the so-called Athanasian Creed, it has retained its place as the fit expression of the faith of the church as to the nature of its God until today. The language in which it is couched, even in this final declaration, still retains elements of speech which owe their origin to the modes of thought characteristic of the Logos-Christology of the 2nd century, fixed in the nomenclature of the church by the Nicene Creed of 325 AD, though carefully guarded there against the subordinationism inherent in the Logos-Christology, and made the vehicle rather of the Nicene doctrines of the eternal generation of the Son and procession of the Spirit, with the consequent subordination of the Son and Spirit to the Father in modes of subsistence as well as of operation. In the Athanasian Creed, however, the principle of the equalization of the three Persons, which was already the dominant motive of the Nicene Creed—the homoousia—is so strongly emphasized as practically to push out of sight, if not quite out of existence, these remanent suggestions of derivation and subordination. It has been found necessary, nevertheless, from time to time, vigorously to reassert the principle of equalization, over against a tendency unduly to emphasize the elements of subordinationism which still hold a place thus in the traditional language in which the church states its doctrine of the Trinity. In particular, it fell to Calvin, in the interests of the true Deity of Christ—the constant motive of the whole body of Trinitarian thought—to reassert and make good the attribute of self-existence (autotheotos) for the Son. Thus Calvin takes his place, alongside of Tertullian, Athanasius and Augustine, as one of the chief contributors to the exact and vital statement of the Christian doctrine of the Triune God.<P>LITERATURE.<P>F. C. Baur, Die christliche Lehre von der Dreieinigkeit Gottea, 3 volumes, Tubingen, 1841-43; Dionysius Petavius, De Trinitate (vol II, of De Theologicis Dogmaticis, Paris, 1647); G. Bull, A Defence of the Nicene Creed (1685), 2 volumes, Oxford, 1851; G. S. Faber, The Apostolicity of Trinitarianism, 2 volumes, 1832; Augustine, On the Holy Trinity (Volume III of Nicene and Post-Nicene Fathers of the Christian Church, 1-228), New York, 1887; Calvin, Institutes of the Christian Religion, I, chapter xiii; C. Hodge, Systematic Theology and Index, I, New York,1873,442-82; H. Bavinck, Gereformeerde Dogmatick(2), II, Kampen,1908,260-347 (gives excellent references to literature); S. Harris, God, Creator, and Lord of All, New York, 1896; R. Rocholl, Der christliche Gottesbegriff, Gottingen, 1900; W. F. Adeney, The Christian Conception of God, London,1909,215-46; J. Lebreton, Lea origines du dogme de la Trinite, Paris, 1910; J. C. K. Hofmann, Der Schriftbeweis(2), Nordlingen, 1857-60, I, 85-111; J. L. S. Lutz, Biblische Dogmatik, Pforzheim,1817,319-94; R. W. Landis, A Plea for the Catholic Doctrine of the Trinity, Philadelphia, 1832; E. H. Bickersteth, The Rock of Ages, etc., London,1860,New York, 1861; E. Riggenbach, "Der trinitarische Taufbefehl, <span class="noTag">Mt 28:19</span>" (in Schlatter and Cremer, Beitrage zur Forderung christlicher Theologie,1903,VII; also 1906, X); F. J. Hall, The Trinity, London and New York,1910,100-141; J. Pearson, An Exposition of the Creed, edition Chevallier and Sinker, Cambridge, 1899; J. Howe," Calm Discourse on the Trinity," in Works, edition Hunt, London, 1810-22; J. Owen, \'Vindication of the Doctrine of the Holy Trinity," and "Saint\'s Fellowship with the Trinity," in Works, Gould\'s edition, London, 1850-55; J. Edwards, Observations concerning the Scripture Economy of the Trinity, etc., New York,1880,also An Unpublished Essay on the Trinity, New York, 1903; J. R. Illingworth, The Doctrine of the Trinity Apologetically Considered, London and New York, 1907; A. F. W. Ingrain, The Love of the Trinity, New York, 1908.<P>(NOTE: In this article the author has usually given his own renderings of original passages, and not those of any particular version --EDITORS.)``187';
isbe[8928]='Tripolis`trip\'-o-lis (Tripoils, "triple city"): Demetrius the son of Seleucus, having fled from Rome, collected "a mighty host and fleet," sailed into the haven of Tripoils, took the city, obtained possession of the country, and put to death his cousin, Antiochus V, along with his guardian Lysias (2Macc 14:1ff; Josephus, Ant, XII, x, 1). After a period of unsuccessful guerrilla warfare against Hyrcanus in Samaria, Antiochus Cyzicenus retired to Tripells (Ant., XII, x, 2). The city was founded by the Phoenicians and was a member of the Phoenician league. It was divided into 3 quarters by walls—hence, the name "triple city"—and these were occupied by settlers from Tyre, Sidon, and Aradus, respectively. The federal council of these states sat here. Its position on the Phoenician seacoast, with easy access to the interior, gave it many advantages from the commercial point of view. The Seleucid monarchs, the Romans, and Herod the Great did much to beautify the city; the last-named building a gymnasium (Josephus, BJ, I, xxi, 11). When attacked by the Arabs the inhabitants took ship and escaped. Later their places were taken by Jews and Persians. Captured by the Crusaders in 1109, it was taken by the Egyptians in 1289. The ancient city was surrounded on three sides by the sea. The site is now occupied by el-Mina, the harbor of the modern city, Tarabulus, which stands on the bank of Nahr Kadisha, about 2 miles away. The inhabitants number about 23,000. The town gives its name to a district under the vilayet of Beirut, which has always been famous for its fruitfulness.``54';
isbe[8929]='Triumph`tri\'-umf (thriambeuo, "to lead in triumph"): The word is used by Paul to express an idea very familiar to antiquity, and to the churches at Corinth and Colosse: "But thanks be unto God, who always leadeth us in triumph in Christ" (<a onClick="return mV(\'2Cr\',2,14);">2Co 2:14</a>); "Having despoiled the principalities and the powers, he made a show of them openly, triumphing over them in it" (<a onClick="return mV(\'Col\',2,15);">Col 2:15</a>).<P>A triumph in Rome was a magnificent procession in honor of a victorious general, and the highest military distinction which he could obtain. It was granted by the senate only to one who had held the office of dictator, consul, or praetor, and after a decisive victory in the complete subjugation of a province. In a Roman triumph the victorious general entered the city in a chariot drawn by four horses. He was crowned with laurel, having a scepter in one hand and a branch of laurel in the other. He was preceded by the senate and magistrates, musicians, the spoils of his victory, and the captives in fetters; and followed by his army on foot, in marching order. The procession thus advanced along the Via Sacra to the Capitol, where a bull was sacrificed to Jupiter, and the laurel wreath deposited in the lap of the god. During the triumphal entry the priests burned incense, and hence, the reference of the apostle: "For we are a sweet savor of Christ unto God, in them that are saved, and in them that perish; to the one a savor from death unto death; to the other a savor from life unto life" (<a onClick="return mV(\'2Cr\',2,15,16);">2Co 2:15,16</a>). The incense that was to the victor the "savor" of his triumph would be to the wretched captives the "savor," or intimation, of a rapidly approaching death in the Roman arena or in the damp vaults of the Tullianum. Thus the "incense," or influence, of the apostolic gospel would be to the believer the assurance of redemption through Christ, and to the unbeliever the assurance of spiritual death.<P>After the suicide of Antony in Alexandria (30 BC) Augustus Caesar succeeded in getting Cleopatra into his power. She had hoped to subdue him by her charms, but without avail. Aware that she was doomed, she revolted against the thought of being led in triumph to Rome, and, as tradition states, took her own life by allowing an asp to bite her, saying, "I will not be led in triumph"; see Shakespeare\'s Antony and Cleopatra, V, ii:<P>"He\'ll lead me, then, in triumph?...<P>Thou, an Egyptian puppet, shalt be shown<P>In Rome as well as I: mechanic slaves,<P>With greasy aprons, rules, and hammers shall<P>Uplift us to the view....``52';
isbe[8930]='Troas`tro\'-as (Troas): The chief city in the northwest of Asia Minor, on the coast of Mysia in the Roman province of Asia. From here, according to <a onClick="return mV(\'Act\',16,8);">Ac 16:8</a>, Paul sailed. Here, also, according to <a onClick="return mV(\'Act\',20,\'5-12\');">Ac 20:5-12</a>, Paul raised Eutychus from the dead. The name Troas was not confined to the town itself, but it was also applied to the surrounding district, or to that part of the coast which is now generally known as the Troad. In its early history it bore the name of Antigona Troas, which was given it by its founder Antigonus, but after 300 BC it was generally known to the classical writers as Alexander Troas, a name given to it by Lysimachus. For a time the Seleucid kings made their homes at Troas. Later, when the city became free, it struck its own coins, of which vast numbers are found; a common type is one upon which is stamped a grazing horse. In 133 BC Troas came into the possession of the Romans, and later, during the reign of Augustus, it was made a Roman colonia, independent of the Roman governor of the province of Asia. Its citizens were then exempt from poll and land tax. During Byzantine times Troas was the seat of a bishopric.<P>The ruins of Troas, now bearing the name of Eski Stambul, are extensive, giving evidence of the great size and importance of the ancient city. They have, however, long been used as a quarry, and the columns of the public buildings were taken to Constantinople for use in the construction of the mosque known as the Yeni Valideh Jami. The site is now mostly overgrown with oaks, but from the higher portions of the ruins there is an extensive view over the sea and the neighboring islands. It is only with difficulty that one may now trace the city walls and locate the square towers which flanked them at intervals. Within the walls are the remains of theater, the temple and the gymnasium, which was provided with baths. The port from which Paul sailed was constructed by means of a mole, with an outer and an inner basin. The most imposing of the ruins, however, is a large aqueduct which was built in the time of Trajan.``7';
isbe[8931]='Trogyllium`tro-jil\'-i-um, tro-gil\'-i-um (Trogullion): According to <a onClick="return mV(\'Act\',20,15);">Ac 20:15</a> the King James Version, the American Revised Version margin, the ship in which Paul sailed to Caesatea on his return from his 3rd missionary journey tarried at Trogyllium. Several of the early manuscripts omit the words, "tarried at Trogyllium" (Westcott and Hort omit as "Western" interpolation); yet, whether the words belonged to the text or not, Paul evidently passed the promontory, and probably stopped there. From the coast near Miletus the promontory projects into the sea toward the island of Samos; the strait separating the mainland from the island is scarcely a mile wide. It was in this strait which is now called Kutchuk Boghaz by the Turks that the battle of Mycale was fought in 479 BC. The promontory now bears the name of Santa Maria, and the place of anchorage is called Saint Paul\'s port.``7';
isbe[8932]='Troop`troop.`<a href="./study/isbe/search.html?string=ARMY">ARMY</a>`1';
isbe[8933]='Trophimus`trof\'-i-mus (Trophimos, literally, "a foster child" (<a onClick="return mV(\'Act\',20,4);">Ac 20:4</a>; <a onClick="return mV(\'Act\',21,29);">21:29</a>; <a onClick="return mV(\'2Ti\',4,20);">2Ti 4:20</a>)): An Asiatic Christian, a friend and companion-in-travel of the apostle Paul.<P>1. An Ephesian:<P>In the first of the three passages in which Trophimus is mentioned, he and Tychicus are called Asianoi, that is, natives of the Roman province of Asia; and making it still more definite, in <a onClick="return mV(\'Act\',21,29);">Ac 21:29</a>, he is termed an "Ephesian." Trophimus was one of eight friends, who accompanied Paul at the close of his 3rd missionary journey, and traveled with him from Greece through Macedonia into Asia, and onward by sea until Jerusalem was reached (see <a href="./study/isbe/search.html?string=TYCHICUS">TYCHICUS</a>). Trophimus went with Paul all the way, for, in the second of the passages referred to, he is mentioned as being with Paul in Jerusalem immediately on the close of this journey.<P>2. Cause of Paul\'s Arrest:<P>He was the innocent cause of Paul being assaulted, in the courts of the temple by the Jewish mob, and then of his being arrested and imprisoned by the Romans. The occasion of this outrage was that the Jews supposed that Paul had "brought Greeks also into the temple, and...defiled this holy place" (<a onClick="return mV(\'Act\',21,28);">Ac 21:28</a>). The modicum of fact lying at the root of this false accusation was that they had seen Paul and Trophimus in each other\'s company in the city. On this slender basis "they supposed" that Paul had brought Trophimus past the barrier or middle wall of partition (<a onClick="return mV(\'Eph\',2,14);">Eph 2:14</a>; see <a href="./study/isbe/search.html?string=PARTITION">PARTITION</a>), beyond which no Gentile was allowed to penetrate on pain of death. They supposed that Trophimus who was neither a Jew nor a proselyte, but Gentile Christian, had been introduced
