isbe[8971]='Ucal`u\'-kal (\'ukhal (see below)): This name occurs along with that of Ithiel (<a onClick="return mV(\'Pro\',30,1);">Pr 30:1</a>), both being taken by older interpreters as those of ancient sages. Some have suggested (see Toy, Proverbs, 519f) that Ucal might be the "Caleol" of <a onClick="return mV(\'1Ki\',4,31);">1Ki 4:31 (Hebrew 5:11)</a>. Ucal was also explained as "I can," i.e. "I can maintain my obedience to God," just as Ithiel was taken to be "signs of God." Septuagint, Aquila, Theodotion do not take the words as proper names, and so BDB with others point this word as a vb., "(and) I am consumed" (wa\'ekhel, for we\'ukhal). The last three words of the verse are then translated "I have wearied myself, O God, I have wearied myself, O God, and am consumed."`<a href="./study/isbe/search.html?string=ITHIEL">ITHIEL</a>`149';
isbe[8972]='Uel`u\'-el, \'u\'el, "will of God"): One of the sons of Bani who had taken foreign wives (<a onClick="return mV(\'Ezr\',10,34);">Ezr 10:34</a>). The name in 1Esdras 9:35 is "Juel" (Codex Vaticanus Ouel; Codex Alexandrinus Iouel).``1';
isbe[8973]='Uknaz`uk\'-naz (uqenaz, "and Kenaz," probably): Found in the King James Version margin of <a onClick="return mV(\'1Ch\',4,15);">1Ch 4:15</a> for the King James Version "even Kenaz," the Revised Version (British and American) "and Kenaz," whereas the Septuagint omits "and." It is probable that some name has dropped out after Elah. Curtis suggests reading "and these are the sons of Kenaz," i.e. those mentioned in <a onClick="return mV(\'1Ch\',4,13);">1Ch 4:13</a>f.`<a href="./study/isbe/search.html?string=KENAZ">KENAZ</a>`1';
isbe[8974]='Ulai`u\'-li, u\'-lai (\'ubhal \'ulay, "river Ulai"; Theodotion <a onClick="return mV(\'Dan\',8,2);">Da 8:2</a>, Oubal, the Septuagint and Theodotion in <a onClick="return mV(\'Dan\',8,16);">8:16</A>, Oulai Latin, Eulaeus):<P>1. The Name and Its Forms:<P>A river which, running through the province of Elam, flowed through Shushan or Susa. It was from "between" this river that Daniel (<a onClick="return mV(\'Dan\',8,16);">8:16</a>) heard a voice, coming apparently from the waters which flowed between its two banks.<P>2. Present Names and Course:<P>Notwithstanding that the rivers of Elam have often changed their courses, there is but little doubt that the Ulai is the Kerkhah, which, rising in the Persian plain near Nehavend (there called the Gamas-ab), is even there a great river. Turned by the mountains, it runs northwest as far as Bisutun, receiving all the waters of Southern Kurdistan, where, as the Sein Merre, it passes through the inaccessible defiles of Luristan, its course before reaching the Kebir-Kuh being a succession of rapids. Turned aside by this mountain, it follows for about 95 miles the depression which here exists as far as the foothills of Luristan, reaching the Susian plain as a torrent; but it becomes less rapid before losing itself in the marshes of Hawizeh. The course of the stream is said to be still doubtful in places.<P>3. Changed Bed at Susa:<P>In ancient times it flowed at the foot of the citadel of Susa, but its bed is now about 1 1/4 miles to the west. The date of this change of course (during which a portion of the ruins of Susa was carried away) is uncertain, but it must have been later than the time of Alexander the Great. The stream\'s greatest volume follows the melting of the snows in the mountains, and floods ensue if this coincides with the advent of heavy rain. Most to be dreaded are the rare occasions when it unites with the Ab-e-Diz.<P>4. Assyrian References:<P>The Ulai (Assyrian Ulaa or Ulaia) near Susa is regarded as being shown on the sculptures of the Assyrian king Ashur-bani-pal (British Museum, Nineveh Gal.) illustrating his campaign against Te-umman. Its rapid stream bears away the bodies of men and horses, with chariots, bows and quivers. The bodies which were thrown into the stream hindered its course, and dyed its waters with their blood.<P>LITERATURE<P>See Delegation en Perse: Memoires, I, Recherches Archeologiques, 25ff.``136';
isbe[8975]='Ulam`u\'-lam (\'ulam, "preceding"):<P>(1) A "son"of Peresh; a Manassite clan (<a onClick="return mV(\'1Ch\',7,16,17);">1Ch 7:16,17</a>). Lucian reads Elam.<P>(2) A descendant of Benjamin who had sons, "mighty men of valor" (<a onClick="return mV(\'1Ch\',8,39,40);">1Ch 8:39,40</a>). The Septuagint\'s Codex Vaticanus has Ailam in <a onClick="return mV(\'1Ch\',8,39);">1Ch 8:39</a> and Aileim in <a onClick="return mV(\'1Ch\',8,40);">8:40</A>; Codex Alexandrinus has Oulam in both verses, and so Lucian.``1';
isbe[8976]='Ulla`ul\'-a (\'ulla\' meaning unknown): An Asherite (<a onClick="return mV(\'1Ch\',7,39);">1Ch 7:39</a>).``1';
isbe[8977]='Ummah`um\'-a (\'ummah; Archob, Amma): One of the cities allotted to the tribe of Asher (<a onClick="return mV(\'Jos\',19,30);">Jos 19:30</a>). By a slight emendation of the text it would read Acco, the name of the place subsequently known as Ptolemais, the modern \'Akka. This emendation is generally adopted by scholars, although it is at best a conjecture. No other identification is yet possible.``1';
isbe[8978]='Umpire`um\'-pir.`<a href="./study/isbe/search.html?string=DAYSMAN">DAYSMAN</a>`1';
isbe[8979]='Unbelief`un-be-lef\':The word (the King James Version) represents two Greek words, apeitheia, "disobedience" (only in <a onClick="return mV(\'Rom\',11,30,32);">Ro 11:30,32</a>; <a onClick="return mV(\'Hbr\',4,6,11);">Heb 4:6,11</a>), and apistia, "distrust," the antithesis to "<a href="./study/isbe/search.html?string=FAITH">faith</a>" (which see). The two words are not only akin etymologically but run into one another by mental connection, certainly where spiritual relations are concerned, as between man and God. For when God has spoken, in precept and yet more in promise, distrust involves, at least potentially, an element of disobedience. His supreme claim is to be trusted to command only what is right, and to promise only what is true. He is infinitely sympathetic in His insight, and infallibly knows where distrust comes only of the dim perceptions and weak mis-givings of our mortal nature, and where, on the other hand, a moral resistance lies at the back of the non-confidence. But the presence of that darker element is always to be suspected, at least, and searched for in serious self-examination.<P>We may remark that it is a loss in our language that "unbelief" is the only word we can use as the antithesis to "faith"; for "<a href="./study/isbe/search.html?string=FAITH">faith</a>" and "<a href="./study/isbe/search.html?string=BELIEF">belief</a>" (which see) are not exactly synonyms. "Unfaith" would be a welcome word for such use, if it were generally so understood.``46';
isbe[8980]='Unbeliever`un-be-lev\'-er: This word follows closely the lines of "<a href="./study/isbe/search.html?string=UNBELIEF">unbelief</a>" (which see) in its relation to originals. Once only (<a onClick="return mV(\'Act\',14,2);">Ac 14:2</a>) it represents the participle apeithountes, "disobeying (ones)." Elsewhere (nine cases) it represents apistos, "faithless," "without faith." In six of these passages (all in 1 and 2 Corinthians) it denotes the unconverted pagan as distinguished from the convert. In the other passages (<a onClick="return mV(\'Luk\',12,46);">Lu 12:46</a>; <a onClick="return mV(\'Tts\',1,15);">Tit 1:15</a>; <a onClick="return mV(\'Rev\',21,8);">Re 21:8</a>) the reference is to the unbelief which comes of moral resistance to God.``1';
isbe[8981]='Uncertain; Uncertainty`un-sur\'-tin, un-sur\'-tin-ti: Adjective adelos, 2Macc 7:34; <a onClick="return mV(\'1Cr\',14,8);">1Co 14:8</a>; adverb adelos, <a onClick="return mV(\'1Cr\',9,26);">1Co 9:26</a>; noun adelotes, <a onClick="return mV(\'1Ti\',6,17);">1Ti 6:17</a>; adelos means "not clear," and so "uncertain." Also the King James Version The Wisdom of Solomon 9:14 for episphales, "unsteady," the Revised Version (British and American) "prone to fall."``1';
isbe[8982]='Unchangeable; Unchangeableness`un-chanj\'-a-bl, un-chanj\'-a-bl-nes:<P><b>I. UNCHANGEABLENESS OF GOD A TRUTH OF NATURAL THEOLOGY</b><P><b>II. SCRIPTURAL DOCTRINE OF THE UNCHANGEABLENESS OF GOD</b><P class="in15">1. Not Lifeless Immobility<P class="in15">2. As Contrasted with the Finite<P class="in15">3. God\'s Knowledge, Will and Purpose<P class="in15">4. In His Relation to the World<P class="in15">5. His Relations to Men<P><b>LITERATURE</b><hr /><P>The unchangeablehess or immutability of God is that divine attribute which expresses the truth that in His nature and perfections, in His knowledge, will and purpose, He always remains the same in the fullness of His infinite and perfect Being; infinitely exalted above change, becoming and development, which are the specific characteristics of all finite existence. This is one of what theologians have called the incommunicable attributes of God, that is, one of those specific characteristics of the divine nature which make God to be God in distinction from all that is finite. These attributes have also been called negative attributes. By calling them negative, however, it is not meant that they express the nature of God in so far as He is unknowable and incomprehensible by the finite mind, while the positive attributes, such as love and righteousness, express God\'s nature as revealed and known. Both kinds of attributes can be known only in so far as God reveals Himself, and furthermore the so-called negative attributes involve a positive idea, while the positive ones in turn imply the negation of all finite limitations. Moreover, since the finite mind cannot comprehend the infinite God, back of all that God has revealed of Himself, back even of His absoluteness, eternity and unchangeability, lies the fullness of His infinite Being, unsearchable, unknowable, and incomprehensible alike in His nature and attributes (<a onClick="return mV(\'Psa\',145,3);">Ps 145:3</a>; <a onClick="return mV(\'Psa\',147,5);">147:5</a>; <a onClick="return mV(\'Job\',11,\'7-9\');">Job 11:7-9</a>; <a onClick="return mV(\'Isa\',40,28);">Isa 40:28</a>).<P>It is these incommunicable attributes, including unchangeableness, which make God to be God, and mark the specific difference between Him and all finite existence. Unchangeableness is, therefore, the characteristic of God\'s entire nature and of all His attributes. It cannot be limited to His ethical nature or to His love, and, while it is true that these incommunicable attributes are revealed with especial richness in God\'s saving activity, they cannot be limited to marks of God\'s saving action or purpose. It is true that God is unchangeable in His love and grace and power to save, but that is only because it is the love and grace and power of the absolute, infinite and immutable God.<P>I. Unchangeableness of God a Truth of Natural Theology.<P>As the One infinitely perfect and absolute or self-existent Being, God is exalted far above the possibility of change, because He is independent, self-existent and unlimited by all the causes of change. As uncaused and self-existent, God cannot be changed from without; as infinitely perfect, He cannot suffer change from within; and as eternal and independent of time, which is the "form" of change and mutability, He cannot be subject to any change at all. God\'s unchangeablehess, therefore, follows from His self-existence and eternity.<P>II. Scriptural Doctrine of the Unchangeableness of God.<P>The Scripture doctrine of God reaffirms this truth. It conceives of God as a living Person in relation to the world and man, and at the same time as absolutely unlimited by the world and man, and as absolutely unchangeable. The God who has revealed Himself in the Old Testament and the New Testament is never identified with, or merged in, the processes of Nature. He is complete and perfect in Himself, and is not the result of any process of self-realization. He is so great that His relations to the created universe cannot begin to exhaust His Being, and yet He stands in the closest relations to man and the world as Creator, Preserver, Governor, and Saviour.<P>1. Not Lifeless Immobility:<P>On the one hand, then, the Bible never represents the unchangeableness of God as a dead immobility out of all relation to man and the world. This tendency of thought, fearing anthropomorphism, proceeds on the principle that to make any definite predications about God is to limit Him. The logical result of this is to conceive of God as abstract Being or Substance, so that the word "God" becomes only a name for the Unknowable. Over against this error, the Scripture represents God concretely as a Person in relation to the world and man. In the beginning He created the heavens and the earth, and from that time on He is the life of the world, especially of Israel, His chosen people. To bring out this truth anthropomorphisms are employed. God comes and goes, reveals Himself and hides Himself. He repents (<a onClick="return mV(\'Gen\',6,6);">Ge 6:6</a>; <a onClick="return mV(\'1Sa\',15,11);">1Sa 15:11</a>; <a onClick="return mV(\'Amo\',7,3);">Am 7:3</a>; <a onClick="return mV(\'Joe\',2,13);">Joe 2:13</a>); He becomes angry (<a onClick="return mV(\'Num\',11,1);">Nu 11:1</a>; <a onClick="return mV(\'Psa\',106,40);">Ps 106:40</a>); and lays aside His anger (<a onClick="return mV(\'Deu\',13,17);">De 13:17</a>; <a onClick="return mV(\'Hsa\',14,4);">Ho 14:4</a>). He sustains a different relation to the godly and the wicked (<a onClick="return mV(\'Pro\',11,20);">Pr 11:20</a>; <a onClick="return mV(\'Pro\',12,22);">12:22</a>). In the fullness of time He became incarnate through the Son, and He dwells in His people by His Spirit, their experience of His grace being greater at some times than at others.<P>But on the other hand, the Scripture always asserts in unmistakable terms the unchangeableness of God. He is unchangeable in His nature. Although the name \'El Shadday, by which He made Himself known in the patriarchal period of revelation, denotes especially God\'s power, this name by no means exhausts the revelation of God in that period. His unchangeableness is involved in His eternity as made known to Abraham (<a onClick="return mV(\'Gen\',21,33);">Ge 21:33</a>). This attribute finds its clearest expression in the name Yahweh as revealed to Moses, the significance of which is unfolded in the passage <a onClick="return mV(\'Exd\',3,\'13-15\');">Ex 3:13-15</a>. God here reveals Himself to His people as "I AM THAT I AM," using the future tense of the verb "to be," which, as the context shows, is given as the meaning of the name Yahweh. Some recent writers would derive these words from the Hiphil stem of the verb, and affirm that it signifies that God is the giver of life. The verb, however, is in the Qal stem, the tense denoting the changeless continuity of the life and nature of God. The idea expressed is not merely that of self-existence, but also of unchangeableness, and this unchangeableness, as the context clearly indicates (especially <a onClick="return mV(\'Exd\',3,15);">Ex 3:15</a>), is here set forth not simply as belonging to the nature of God in Himself, but is brought into closest connection with His covenant relation to His people, so that the religious value of God\'s unchangeableness is most clearly implied in this fundamental assertion of the attribute. The same idea of God\'s immutability is reaffirmed in the prophecy of Isaiah. It is connected with the name Yahweh (<a onClick="return mV(\'Isa\',41,4);">Isa 41:4</a>; compare also 48:12), where Yahweh affirms that He is the first and, with the last, the same God, thereby asserting not merely His eternity, but also that He is the same in His divine existence throughout all ages. This attribute, moreover, is claimed by Yahweh, and set forth as an especial mark of His Godhead in <a onClick="return mV(\'Isa\',44,6);">Isa 44:6</a>. The unchangeableness of the divine nature is also asserted by the prophet Malachi in a difficult passage (3:6). This is a clear affirmation of the unchangeableness of God, the only question being whether it is set forth as the ground of Israel\'s confidence, or in contrast with their fickleness, a question which depends partly on that of the text.<P>In the New Testament the thought of the passage in <a onClick="return mV(\'Exd\',3,1);">Exodus 3</a> is reiterated in the Apocalypse where God is described as He who is and was and is to come (<a onClick="return mV(\'Rev\',1,4);">Re 1:4</a>). This is an expansion of the covenant name Yahweh in <a onClick="return mV(\'Exd\',3,\'13-15\');">Ex 3:13-15</a>, denoting not merely eternity but also immutability. The phrases "the Alpha and the Omega" (<a onClick="return mV(\'Rev\',1,8);">Re 1:8</a>; <a onClick="return mV(\'Rev\',21,6);">21:6</a>; <a onClick="return mV(\'Rev\',22,13);">22:13</a>); and "the first and the last" (<a onClick="return mV(\'Rev\',1,17);">Re 1:17</a>; <a onClick="return mV(\'Rev\',22,13);">22:13</a>); and "the beginning and the end" (<a onClick="return mV(\'Rev\',21,6);">Re 21:6</a>; <a onClick="return mV(\'Rev\',22,13);">22:13</a>) bring out the same idea, and are applied to Christ as well as to God, which is a clear indication of our Lord\'s Deity. The apostle Paul likewise asserts the incorruptibility, eternity and immortality of the divine nature, all of which ideas imply the unchangeableness of God (<a onClick="return mV(\'Rom\',1,23);">Ro 1:23</a>; <a onClick="return mV(\'1Ti\',1,17);">1Ti 1:17</a>; <a onClick="return mV(\'1Ti\',6,16);">6:16</a>).<P>2. As Contrasted with the Finite:<P>Not only is the unchangeableness of God\'s nature asserted in Scripture, and placed in relation to His dealings with men, but also it is declared to be the distinctive characteristic of God\'s nature as contrasted with the entire universe of finite being. While the heavens and the earth change and are passing away, God endures forever and forever the same God (<a onClick="return mV(\'Psa\',102,\'26-28\');">Ps 102:26-28 (Hebrew 27-29)</a>). The application of the language of this psalm to Christ by the author of the Epistle to the <a onClick="return mV(\'Hbr\',1,\'10-12\');">Heb 1:10-12</a> involves the unchangeableness of Christ, which is again explicitly asserted in this Epistle (<a onClick="return mV(\'Hbr\',13,8);">Heb 13:8</a>), being another clear indication of the way in which the Deity of Jesus Christ pervades the New Testament. This idea of God\'s immutability, as contrasted with the mutability of finite existence which is His creation, is given expression in the New Testament by the apostle James. As Creator of the heavenly bodies, God is called the Father of lights. While their lights, however, are intermittent, God\'s light is subject to neither change nor obscuration (<a onClick="return mV(\'Jam\',1,17);">Jas 1:17</a>).<P>In accordance with this idea of the unchangeableness of God\'s nature, the Scripture, in ascribing life and personality to Him, never regards God as subject to any process of becoming or self-realization, and the views which so conceive of God are unscriptural whether they proceed upon a unitarian or a trinitarian basis.<P>3. God\'s Knowledge, Will and Purpose:<P>God is also represented in Scripture as unchangeable in His knowledge, will and purpose. He is not a man that He should repent (<a onClick="return mV(\'1Sa\',15,29);">1Sa 15:29</a>). His purposes, therefore, are unchangeable (<a onClick="return mV(\'Num\',23,19);">Nu 23:19</a>; <a onClick="return mV(\'Isa\',46,11);">Isa 46:11</a>; <a onClick="return mV(\'Pro\',19,21);">Pr 19:21</a>); and His decrees are accordingly likened to "mountains of brass" (<a onClick="return mV(\'Zec\',6,1);">Zec 6:1</a>). His righteousness is as immutable as mountains (<a onClick="return mV(\'Psa\',36,6);">Ps 36:6 (Hebrew 7)</a>); and His power also is unchangeable (<a onClick="return mV(\'Isa\',26,4);">Isa 26:4</a>). Hence, while the Scripture represents God as sustaining living relations to His creatures, it does not conceive of Him as conditioned or determined in any way by men\'s acts, in either His knowledge, will, purpose or power. God knows eternally the changing course of events, and He acts differently upon different occasions, but all events, including human actions, are determined by God\'s unchangeable purpose, so that God\'s knowledge and actions are not contingent upon anything outside Himself.<P>Although, therefore, the idea of God as pure abstract Being, out of all relation to the world, is unscriptural, it is no less true that conception of God which represents a reaction from this, and which conceives of God anthropomorphically and as conditioned and determined by the world and man, is also quite contradictory to the Scripture conception of God. This latter tendency goes too far in the opposite direction, and falls into the error of conceiving God\'s knowledge, will, purpose and power too anthropomorphically, and as limited by the free acts of man. While the opposite tendency kept God out of all relation to the world, this one erects God\'s relation to the world into something which limits Him. This way of conceiving of God, which is the error of Rationalism, Socinianism and Arminianism, is as unscriptural as that which conceives of God as abstract Being, unknowable, and entirely out of relation to the world.<P>4. In His Relation to the World:<P>Unchangeable in His nature and attributes, God is likewise unchangeable in His relation to the world, which relation the Scripture represents as creation and providence, and not as emanation. Hence while everything finite changes, God remains ever the same (<a onClick="return mV(\'Psa\',102,\'26-28\');">Ps 102:26-28</a>). Consequently, the pantheistic idea is also unscriptural, which idea, going farther than the anthropomorphic and dualistic conception which places the world over against God, completely merges God\'s Being in the world and its processes of change, affirming that God comes to self-realization in the evolution of the world and man. In its reaction from the denial of God\'s living relation to the world, this view does not stop with limiting God by reason of this relation, but merges Him completely in the world-development. The Scripture, on the contrary, always conceives of God as immutably free and sovereign in His relation to all the creation.<P>In accordance with this idea of the unchangeableness of God\'s nature and attributes, the Bible always maintains God\'s absoluteness and transcendence of Nature and her processes in all of the relations which He sustains to the finite universe. It came into being by His creative fiat, not by any process of emanation from His Being. He sustains it in existence, and governs it, not by any process of Self-realization in the series of second causes, but from without, by His sovereign will and power. And He intrudes into the series of finite causes miraculously, producing events in Nature which are due solely to His power. When for man\'s salvation the Son of God became incarnate, it was not by any change of His nature in laying aside some or all of the attributes of Deity, but by assuming a human nature into personal union with the divine nature. The Scripture passages which speak of the incarnation of our Lord clearly indicate that the Son retained His full Deity in "becoming flesh" (compare especially the prologue to John\'s Gospel and <a onClick="return mV(\'Phl\',2,\'6-8\');">Php 2:6-8</a>). Moreover, the Old Testament doctrine of the Spirit of God as the source of life to the world is always at pains to avoid any mingling of the Spirit with the processes of Nature, and the same thing is true of the New Testament doctrine of the indwelling of the Spirit in the believer, always keeping the Spirit distinct from the spirit of man (<a onClick="return mV(\'Rom\',8,16);">Ro 8:16</a>).<P>5. His Relations to Men:<P>Finally, God is unchangeable not only in relation to the universe, but in His relations to men and especially to His people. This follows from His unchangeable ethical nature. The Scripture often connects the unchangeableness of God with His goodness (<a onClick="return mV(\'Psa\',100,5);">Ps 100:5</a>; <a onClick="return mV(\'Jam\',1,17);">Jas 1:17</a>); with His truthfulness and mercy (<a onClick="return mV(\'Psa\',100,5);">Ps 100:5</a>; <a onClick="return mV(\'Psa\',117,2);">117:2</a>); and with His covenant promises (<a onClick="return mV(\'Exd\',3,13);">Ex 3:13</a>). In connection with His covenant promises, God\'s unchangeableness gives the idea of His faithfulness which is emphasized in the Old Testament to awaken trust in God (<a onClick="return mV(\'Deu\',7,9);">De 7:9</a>; <a onClick="return mV(\'Psa\',36,5);">Ps 36:5 (Hebrew 6)</a>; <a onClick="return mV(\'Psa\',92,2);">Ps 92:2 (Hebrew 3)</a>; <a onClick="return mV(\'Isa\',11,5);">Isa 11:5</a>; <a onClick="return mV(\'Lam\',3,23);">La 3:23</a>). This idea of God\'s unchangeableness in His covenant promises or His faithfulness is repeated and emphasized in the New Testament. His gifts or graces and election are without repentance (<a onClick="return mV(\'1Th\',5,24);">1Th 5:24</a>; <a onClick="return mV(\'Rom\',11,29);">Ro 11:29</a>); He is faithful toward men because unchangeably true to His own nature (<a onClick="return mV(\'2Ti\',2,13);">2Ti 2:13</a>); His faithfulness abides in spite of men\'s lack of faith (<a onClick="return mV(\'Rom\',3,5);">Ro 3:5</a>), and is in many places represented as the basis of our confidence in God who is true to His election and gracious promises (<a onClick="return mV(\'1Cr\',1,9);">1Co 1:9</a>; <a onClick="return mV(\'1Cr\',10,13);">10:13</a>; <a onClick="return mV(\'2Th\',3,3);">2Th 3:3</a>; <a onClick="return mV(\'Hbr\',10,23);">Heb 10:23</a>; <a onClick="return mV(\'Hbr\',11,11);">11:11</a>; <a onClick="return mV(\'1Pe\',4,19);">1Pe 4:19</a>; <a onClick="return mV(\'1Jo\',1,9);">1Joh 1:9</a>). See <a href="./study/isbe/search.html?string=FAITHFULNESS">FAITHFULNESS</a>. It is thus the religious significance and value of God\'s unchangeableness which is especially emphasized throughout the Scripture. Because He is unchangeably true to His promises, He is the secure object of religious faith and trust, upon whom alone we can rely in the midst of human change and decay. It is this idea to which expression is given by calling God a rock, the rock of our strength and of our salvation (<a onClick="return mV(\'Deu\',32,15);">De 32:15</a>; <a onClick="return mV(\'Psa\',18,2);">Ps 18:2 (Hebrew 3)</a>; <a onClick="return mV(\'Psa\',42,9);">42:9 (Hebrew 10)</a>; <a onClick="return mV(\'Psa\',71,3);">71:3</a>; <a onClick="return mV(\'Isa\',17,10);">Isa 17:10</a>). God is even eternally a rock, the never-failing object of confidence and trust (<a onClick="return mV(\'Isa\',26,4);">Isa 26:4</a>).<P>It appears, therefore, that the Scripture idea of the unchangeableness of God lays emphasis upon four points. First, it is not lifeless immobility, but the unchangeableness of a living Person. Second, it is, however, a real unchangeableness of God\'s nature, attributes and purpose. Third, this unchangeableness is set forth as one of the specific characteristics of Deity in distinction from all that is finite. Fourth, God\'s unchangeableness is not dealt with in an abstract or merely theoretic manner, but its religious value is invariably emphasized as constituting God the one true object of religious faith.<P>LITERATURE.<P>Besides the commentaries on appropriate passages, and the discussion of the divine attributes in the general works on systematic theology, see Dillmann, Handbuch der alttest. Theol.,1895,215-20, 243-44; Oehler, Theology of the Old Testament, English translation,1883,95, 100; Schultz, Alttest. Theol.,1896,419; Davidson, The Theology of the Old Testament,1904,45-58, 165. For a fuller discussion see Charhock, "The Immutability of God," Works, volume I, 374-419; Dorner, Ueber die richtige Fassung des dogmatischen Begrifts der Unverdnderlichkeit Gottea, u.s.w.; Article I, "Die neueren Laugnungen der Unveranderlichkeit des personlichen Gottes, u.s.w.," JDT, I, 201-77; II, "Die Geschichte der Lehre von der Unveranderlichkeit Gottea bis auf Schleiermacher," JDT, II, 440-500; III, "Dogmatische Erorterung der Lehre von der Unveranderlichkeit Gottes," JDT, III, 579-660; H. Cremer, Die christliche Lehre von den Eigenschaften Gottea,1897,pub. in the Beitrage zur Forderung christlicher Theol., I, 7-111; see pp. 10ff, and especially pp. 102-9.``72';
isbe[8983]='Unchastity`un-chas\'-ti-ti.`<a href="./study/isbe/search.html?string=CRIMES">CRIMES</a>; <a href="./study/isbe/search.html?string=PUNISHMENTS">PUNISHMENTS</a>`1';
isbe[8984]='Uncircumcised; Uncircumcision`un-sur\'-kum-sizd, un-sur-kum-sizh\'-un: The adjective in the Old Testament is \'arel (<a onClick="return mV(\'Gen\',17,14);">Ge 17:14</a>, etc.), from a root of uncertain meaning, with the noun \'orlah, "uncircumcised (person)" (<a onClick="return mV(\'Lev\',19,23);">Le 19:23</a>; <a onClick="return mV(\'Jer\',9,25);">Jer 9:25</a>), and the verb \'aral, "count as uncircumcised" (<a onClick="return mV(\'Lev\',19,23);">Le 19:23</a>; the Revised Version (British and American) <a onClick="return mV(\'Hab\',2,16);">Hab 2:16</a>). In the Apocrypha and the New Testament the noun is akrobustia (a physiological term, 1Macc 1:15; <a onClick="return mV(\'Act\',11,3);">Ac 11:3</a>, etc.), and the adjective aperitmetos (Additions to Esther 14:15; 1Macc 1:48; 2:46; <a onClick="return mV(\'Act\',7,51);">Ac 7:51</a>), with the verb epispaomai, "become uncircumcised" (<a onClick="return mV(\'1Cr\',7,18);">1Co 7:18</a>). The language of 1Macc 1:15 suggests the performance of some surgical operation, but no such operation appears to be possible, and "behaved like uncircumcised persons" (as in <a onClick="return mV(\'1Cr\',7,18);">1Co 7:18</a>) is the probable meaning.`<a href="./study/isbe/search.html?string=CIRCUMCISION">CIRCUMCISION</a>`48';
isbe[8985]='Uncle`un\'-k\'l (dodh, "beloved," "uncle," "relation").`<a href="./study/isbe/search.html?string=RELATIONSHIPS+FAMILY">RELATIONSHIPS, FAMILY</a>`1';
isbe[8986]='Unclean Spirit`un-klen\'.`<a href="./study/isbe/search.html?string=SPIRIT+UNCLEAN">SPIRIT, UNCLEAN</a>; <a href="./study/isbe/search.html?string=DEMON,+DEMONIAC">DEMON, DEMONIAC</a>`1';
isbe[8987]='Uncleanness`un-klen\'-nes:<P><b>I. TERMS</b><P class="in15">1. In the Old Testament (Hebrew)<P class="in15">2. In the New Testament<P class="in15">3. In the Septuagint<P><b>II. POSSIBLE RELATION OF ISRAEL\'S LAWS ON UNCLEANNESS WITH THE LAWS OF TABOO AMONG THE NATIONS</b><P><b>III. TEACHING AS TO UNCLEANNESS</b><P class="in15">1. In the Old Testament<P class="in15">2. In the Apocrypha<P class="in15">3. In the New Testament<P><b>LITERATURE</b><hr /><P>I. Terms.<P>1. In the Old Testament (Hebrew):<P>Tum\'ah, "uncleanness," "defilement," occurs 26 times (<a onClick="return mV(\'Lev\',7,20,21);">Le 7:20,21</a>; <a onClick="return mV(\'Lev\',14,19);">14:19</a>; <a onClick="return mV(\'Lev\',15,3,15,26,30,31);">15:3,15,26,30,31</a>, etc.). niddah, "separation," "impurity," occurs in <a onClick="return mV(\'Lev\',20,21);">Le 20:21</a>; <a onClick="return mV(\'Ezr\',9,11);">Ezr 9:11</a>; <a onClick="return mV(\'Zec\',13,1);">Zec 13:1</a>. \'erwah, occurs in <a onClick="return mV(\'Deu\',23,14);">De 23:14</a>. \'erwath dabhar, "unclean thing" (<a onClick="return mV(\'Deu\',24,1);">De 24:1</a>) is translated "uncleanness" in the King James Version. The adjective Tame\', "defiled," "unclean," occurs 72 times (over half in Leviticus), but is never translated "uncleanness," but always "unclean." The verb Tame\', "to make" or "declare unclean," occurs often. Other Hebrew verbs "to defile" are ga\'al, chalal, chaneph, Tanaph, \'alal, \'anah.<P>2. In the New Testament:<P>The Greek word for "uncleanness" is akatharsia, which occurs 10 times (<a onClick="return mV(\'Mat\',23,27);">Mt 23:27</a>; <a onClick="return mV(\'Rom\',1,24);">Ro 1:24</a>; <a onClick="return mV(\'Rom\',6,19);">6:19</a>; <a onClick="return mV(\'2Cr\',12,21);">2Co 12:21</a>, etc.). miasmos, "pollution," occurs only in <a onClick="return mV(\'2Pe\',2,10);">2Pe 2:10</a>. The adjective akathartos, "unclean," occurs 31 times, 23 times in reference to unclean spirits (Luke once using the expression "unclean demon," <a onClick="return mV(\'Luk\',4,33);">4:33</A>), 4 times to ceremonial uncleanness (thee by Peter and one by John the revelator), and 4 times to moral uncleanness (three by Paul and one by John the revelator). Koinos, "common," "unclean," occurs 8 times in the sense of "unclean" (<a onClick="return mV(\'Mar\',7,2,5);">Mr 7:2,5</a>; <a onClick="return mV(\'Act\',10,14,28);">Ac 10:14,28</a>; <a onClick="return mV(\'Act\',11,8);">11:8</a>; <a onClick="return mV(\'Rom\',14,14);">Ro 14:14</a>; <a onClick="return mV(\'Rev\',21,27);">Re 21:27</a>). The verb koinoo, "to defile," occurs 11 times (<a onClick="return mV(\'Mat\',15,1118,20);">Mt 15:11,18,20</a>; <a onClick="return mV(\'Mar\',7,15);">Mr 7:15</a>, etc.). miaino, "to defile," occurs 5 times (<a onClick="return mV(\'Jhn\',18,28);">Joh 18:28</a>; <a onClick="return mV(\'Tts\',1,15);">Tit 1:15</a>; <a onClick="return mV(\'Hbr\',12,15);">Heb 12:15</a>; <a onClick="return mV(\'Jud\',1,8);">Jude 1:8</a>). moluno, "to make filthy," occurs 3 times (<a onClick="return mV(\'1Cr\',8,7);">1Co 8:7</a>; <a onClick="return mV(\'Rev\',3,4);">Re 3:4</a>; <a onClick="return mV(\'Rev\',14,4);">14:4</a>). spiloo, occurs twice (<a onClick="return mV(\'Jam\',3,6);">Jas 3:6</a>; <a onClick="return mV(\'Jud\',1,23);">Jude 1:23</a>) and phtheiro, "to corrupt," occurs 7 times in Greek, once in English Versions of the Bible (<a onClick="return mV(\'1Cr\',3,17);">1Co 3:17</a>).<P>3. In the Septuagint:<P>Akatharsia, "uncleanness," occurs 59 times in Septuagint (including many instances in apocryphal books) (1 and 2Esdras, Tobit, 1 and 2Maccabees, etc.). Akathartos, "unclean," occurs 134 times in the Septuagint (including one example in 1Maccabees). Koinos, "unclean," and koinoo, "to make unclean," occur in Esther, Proverbs, Wisdom,1, 2, 3 and 4 Maccabees). Miaino, "to defile," occurs over 100 times. Moluno, "to make filthy," occurs 18 times (both in the Old Testament and in the Apocrypha).<P>II. Possible Relation of Israel\'s Laws on Uncleanness with the Laws of Taboo among the Nations:<P>W. R. Smith (Lectures on the Religion of the Semites, 152-55) thinks there is a kinship between Israel\'s laws of uncleanness and the heathen taboo. Frazer, in The Golden Bough, shows numerous examples of the taboo among various tribes and nations which present striking similarity to some of Israel\'s laws on uncleanness. But does this diminish our respect for the Old Testament laws on uncleanness? Might not Yahweh use this natural religious perception of men as to an intrinsic distinction between clean and unclean in training Israel to a realization of a higher conception—the real difference between sin and holiness, i.e. between moral defilement and moral purification? The hand of Yahweh is visible even in the development of Israel\'s rudimentary laws on ceremonial uncleanness. They are not explicable on purely naturalistic grounds, but Yahweh is training a people to be holy, and so He starts on the lower plane of ceremonial uncleanness and cleanness (see <a onClick="return mV(\'Lev\',11,44);">Le 11:44</a> as to the purpose of Yahweh in establishing these laws respecting clean and unclean animals).<P>III. Teaching as to Uncleanness.<P>1. In the Old Testament:<P>Each term above for uncleanness is used in two senses:<P>(a) to signify ceremonial uncleanness, which is the most usual significance of the term in the Old Testament;<P>(b) but, in the Prophets, to emphasize moral, rather than ceremonial, uncleanness. There are four principal spheres of uncleanness in the Old Testament:<P>(1) Uncleanness in the Matter of Food.<P>The law as to clean and unclean beasts is laid down in <a onClick="return mV(\'Lev\',11,\'1-23\');">Le 11:1-23</a>. Notice that the law does not extend to vegetable foods, as does a similar law in the Egyptian religion. Four kinds of beasts are named as fit for food:<P>(a) among quadrupeds, those that both chew the cud and part the hoof;<P>(b) among fishes, only those having both fins and scales;<P>(c) most birds or fowls, except, in the main, birds of prey and those noted for uncleanness of habits, are permitted;<P>(d) of insects those that have legs above the feet to leap withal (e.g. the cricket, the grasshopper, etc.), but those that go on all four, or have many feet, or go upon the belly (e.g. worms, snakes, lizards, etc.), are forbidden.<P>See, further, <a href="./study/isbe/search.html?string=FOOD">FOOD</A>.<P>(2) Uncleanness Connected with the Functions of Reproduction (<a onClick="return mV(\'Lev\',12,1);">Leviticus 12</a> and <a onClick="return mV(\'Lev\',12,1);">15</a>).<P>In <a onClick="return mV(\'Lev\',15,\'2-18\');">Le 15:2-18</a>, we find the laws applied to issues of men; in 15:19ff, to the issues of women. Not only is the man or woman unclean because of the issue, whether normal or abnormal, but the bed on which they lie, or whatever or whoever is touched by them while they are in this state, is unclean. The uncleanness lasts seven days from the cessation of the issue. To become clean men must wash their clothes and batheir bodies (though this requirement is not made of women), and both men and women must offer through the priest a pair of turtle-doves, or two young pigeons (<a onClick="return mV(\'Lev\',15,\'1-\');">Le 15</a>). According to <a onClick="return mV(\'Lev\',13,\'1-\');">Le 13</a>, the woman who conceives and bears a child is unclean. This uncleanness lasts seven days if the child born is a male, but 14 days if the child is a female. However, there is a partial uncleanness of the mother that continues 40 days from the birth of a male, 80 days from the birth of a female, at the end of which period she is purified by offering a lamb and a young pigeon (or turtle-dove), or if too poor to offer a lamb she may substitute one of the birds for the lamb.<P>(3) Uncleanness Connected with Leprosy.<P>According to <a onClick="return mV(\'Lev\',14,\'1-\');">Le 14</a> and <a onClick="return mV(\'Lev\',15,\'1-\');">15</A>, the leper was regarded as under the stroke of God, and so was deemed unclean. The leper (so adjudged by the priest) must separate himself from others, with torn clothes, disheveled hair, and crying with covered lips, "Unclean! Unclean!" That is, he was regarded as a dead man, and therefore unclean and so must live secluded from others.<P>See, further, <a href="./study/isbe/search.html?string=LEPER,+LEPROSY">LEPER, LEPROSY</a>.<P>(4) Uncleanness Associated with Death.<P>According to <a onClick="return mV(\'Lev\',15,\'24-\');">Le 15:24-40</a>, anyone who touched a dead beast, whether unclean or clean, was rendered unclean. According to <a onClick="return mV(\'Num\',19,\'11-22\');">Nu 19:11-22</a>, anyone touching the corpse of a human being is unclean. Likewise, everyone in the tent, or who enters the tent, where lies a dead man, is unclean seven days. Even the open vessels in the tent with a dead person are unclean seven days. Whoever, furthermore, touched a dead man\'s bone or grave was unclean seven days. Purification, in all these cases of uncleanness as related to death, was secured by sprinkling the ashes of a red heifer with living water upon the unclean person, or object, on the 3rd and 7th days.<P>See <a href="./study/isbe/search.html?string=PURIFICATION">PURIFICATION</A>.<P>2. In the Apocrypha:<P>In Tobit 3:7-9; 6:13,14; 7:11; 8:1-3; 1Macc 1:41-53, and in other books, we find the same laws on uncleanness recognized by the descendants of Abraham. It was regarded as abominable to sacrifice other animals (swine for instance) than those prescribed by Yahweh. There is a growing sense in Israel during this period, that all customs and all conduct of the heathen are unclean. Witness the resistance of the loyal Jews to the demands of Antiochus Epiphanes (1Macc 1; 2; 6; 7). The sense of ceremonial uncleanness was still a conspicuous element in the religious consciousness of the Jews in the inter-Biblical period. But the training of God in ceremonial purification and in the moral and spiritual teachings of the prophets had prepared the way for an advance in moral cleanness (both in thought and in practice).<P>3. In the New Testament:<P>By the days of Jesus the scribes and rabbis had wrought out a most cumbrous system of ceremonial uncleanness and purification. Nor did they claim that all their teachings on this subject were found in the Old Testament. See <a href="./study/isbe/search.html?string=TRADITION">TRADITION</A>. This is fitly illustrated in the New Testament in the washing of hands. See <a href="./study/isbe/search.html?string=UNWASHEN">UNWASHEN</a>. When the Mishna (the collection of rabbinic teachings) was produced, the largest book was devoted to the laws of purification, 30 chapters being used to describe the purification of vessels alone.<P>See <a onClick="return mV(\'Jhn\',2,\'1-11\');">Joh 2:1-11</a>, and note how the Jews had six stone waterpots for purification at the wedding in Cana. See <a onClick="return mV(\'Jhn\',3,25);">Joh 3:25</a> as to the controversy on purification between John\'s disciples and the Jews. This question of cleanness and uncleanness was a tremendous issue with every Jew. He must keep himself ceremonially clean if he would be righteous and win the approval of God.<P>Jesus utterly disregarded for Himself these laws of purification, though He orders the cleansed leper to return to the priest and secure his certificate of cleansing. He did not wash His hands before eating, and His disciples followed His example. Therefore, the Pharisees challenged Him to give an account of His course and that of His disciples (<a onClick="return mV(\'Mat\',15,\'3-20\');">Mt 15:3-20</a> = <a onClick="return mV(\'Mar\',7,\'6-23\');">Mr 7:6-23</a>). Jesus then enunciated the great principle that there is no ceremonial, but only moral and spiritual, uncleanness. Not what goes into a man from hands that touch unclean things defiles the man, but the things that come out of his heart, evil thoughts, hatred, adultery, murder, etc., these defile the man.<P>Paul likewise regarded nothing as unclean of itself (<a onClick="return mV(\'Rom\',14,14,20);">Ro 14:14,20</a>; <a onClick="return mV(\'Tts\',1,15);">Tit 1:15</a>), yet no man should violate the scruples of his own conscience or that of his brother (and thus put a stumblingblock in his way). Love, not ceremonialism is the supreme law of the Christian. Paul, in submitting to the vow of purification in Jerusalem, set an example of this principle (<a onClick="return mV(\'Act\',21,26);">Ac 21:26</a>).<P>See also <a href="./study/isbe/search.html?string=CRIMES">CRIMES</A>; <a href="./study/isbe/search.html?string=PUNISHMENTS">PUNISHMENTS</A>.<P>LITERATURE.<P>W. R. Smith, Lectures on the Religion of the Semites (especially pp. 152-55, on taboo, and pp. 455,456,on the uncleanness of sexual intercourse); Frazer, The Golden Bough (examples of taboo and similar laws and customs among various nations); Frazer, article "Taboo" in Encyclopedia Britannica, 9th edition; Benzinger, Hebrew Archaeology; Nowack, Hebrew Archaeology; Kellogg, commentary on "Leviticus" (Expositor\'s Bible); Kalisch, Leviticus; Dillmann-Ryssel, Leviticus; Schultz, Dillmann, Smend, Marti, Davidson, in their Old Testament Theologies, give useful hints on this subject; article "Casuistry" (Hebrew) in ERE, III, is valuable.``194';
isbe[8988]='Unclothed`un-klothd\'.`<a href="./study/isbe/search.html?string=CLOTHED+UPON">CLOTHED UPON</a>`1';
isbe[8989]='Unction`unk\'-shun: The the King James Version translation of chrisma (<a onClick="return mV(\'1Jo\',2,20);">1Joh 2:20</a>), which the Revised Version (British and American) renders "anointing," as the King James Version renders the same word in <a onClick="return mV(\'1Jo\',2,27);">1Joh 2:27</a>.``1';
isbe[8990]='Undefiled`un-de-fild\':In the Old Testament tam, "perfect," presents the positive side. Hence, <a onClick="return mV(\'Psa\',119,1);">Ps 119:1</a> is translated in the Revised Version: "Blessed are they that are perfect in the way." In the New Testament amiantos, presents the negative side, "unstained" "unsullied" "without taint." Used to describe the sinlessness of Christ (<a onClick="return mV(\'Hbr\',7,26);">Heb 7:26</a>), to declare the marriage act free from all guilt, disgrace or shame (<a onClick="return mV(\'Hbr\',13,4);">Heb 13:4</a>), to contrast the heavenly inheritance with earthly possessions (<a onClick="return mV(\'1Pe\',1,4);">1Pe 1:4</a>).``1';
isbe[8991]='Undergirding`un-der-gurd\'-ing.`<a href="./study/isbe/search.html?string=SHIPS+AND+BOATS">SHIPS and BOATS</a>`1';
isbe[8992]='Underneath`un-der-neth\' (tachath, "the bottom (as depressed)"): "Underneath are the everlasting arms" (<a onClick="return mV(\'Deu\',33,27);">De 33:27</a>). In these words Moses sums up the history of Israel and gives expression to his final thought about life and time and all things visible. Underneath all phenomena and all the chances and changes of life and time there is unchanging law, everlasting principle, an all-enfolding power, an all-embracing love.``1';
isbe[8993]='Undersetter`un\'-der-set-er (katheph): The word, used in <a onClick="return mV(\'1Ki\',7,30,34);">1Ki 7:30,34</a> of supports of the laver, means lit. "shoulder," and is so rendered in the Revised Version margin.`<a href="./study/isbe/search.html?string=LAVER">LAVER</a>`1';
isbe[8994]='Undertake`un-der-tak\':"To take upon one\'s self," "assume responsibility," and so in Elizabethan English "be surety." In this sense in the King James Version <a onClick="return mV(\'Isa\',38,14);">Isa 38:14</a>, "O Lord,...undertake for me" (\'arabh, the Revised Version (British and American) "be thou my surety"). Perhaps in the same sense in Sirach 29:19, although the idea is scarcely contained in the Greek verb dioko, "pursue." In the modern sense in 1Esdras 1:28; 2Macc 2:29; 8:10; the King James Version 2:27.`<a href="./study/isbe/search.html?string=SURE">SURE</a>; <a href="./study/isbe/search.html?string=SURETY">SURETY</a>`1';
isbe[8995]='Unequal`un-e\'-kwal: <a onClick="return mV(\'Eze\',18,25,29);">Eze 18:25,29</a> for lo\' thakhan, "not weighed," "illogical." "Unequally" in <a onClick="return mV(\'2Cr\',6,14);">2Co 6:14</a>, in the phrase "unequally yoked," heterozugeo, is used of the yoking together of two animals of different kinds (compare the Septuagint of <a onClick="return mV(\'Lev\',19,19);">Le 19:19</a>).``1';
isbe[8996]='Unfeigned`un-fand\' (anupokritos, "unfeigned," "undisguised"): The Greek word occurs only in the New Testament (<a onClick="return mV(\'1Ti\',1,5);">1Ti 1:5</a>; <a onClick="return mV(\'2Ti\',1,5);">2Ti 1:5</a>) and is designative of the moral quality of faith as "the mark of transparency and simplicity of soul—the most complete and distinct exponent of a man\'s character—the natural hypothesis of a pure and good heart—a readiness to believe in goodness" (Martineau, Hours of Thought, First Series, 86ff). Compare <a onClick="return mV(\'2Cr\',6,6);">2Co 6:6</a>; <a onClick="return mV(\'1Pe\',1,22);">1Pe 1:22</a>; <a onClick="return mV(\'Jam\',3,17);">Jas 3:17</a>.``1';
isbe[8997]='Ungodly`un-god\'-li (rasha\' (<a onClick="return mV(\'Psa\',1,1);">Ps 1:1</a>), "wicked," beliya\'al (<a onClick="return mV(\'2Sa\',22,5);">2Sa 22:5</a>), "worthless"; in the New Testament asebes (<a onClick="return mV(\'Rom\',5,6);">Ro 5:6</a>), e.g. indicating that the persons so called are both irreverent and impious): Trench says that the idea of active opposition to religion is involved in the word, that it is a deliberate withholding from God of His dues of prayer and of service; a standing, so to speak, in battle array against God and His claims to respect, reverence and obedience. Those whose sins are particularly aggravating and deserving of God\'s wrath are the "ungodly." And yet it is for such that Jesus Christ died (<a onClick="return mV(\'Rom\',5,6);">Ro 5:6</a>).``53';
isbe[8998]='Unicorn`u\'-ni-korn (re\'em (<a onClick="return mV(\'Num\',23,22);">Nu 23:22</a>; <a onClick="return mV(\'Num\',24,8);">24:8</a>; <a onClick="return mV(\'Deu\',33,17);">De 33:17</a>; <a onClick="return mV(\'Job\',39,9,10);">Job 39:9,10</a>; <a onClick="return mV(\'Psa\',22,21);">Ps 22:21</a>; <a onClick="return mV(\'Psa\',29,6);">29:6</a>; <a onClick="return mV(\'Psa\',92,10);">92:10</a>; <a onClick="return mV(\'Isa\',34,7);">Isa 34:7</a>)): "<a href="./study/isbe/search.html?string=UNICORN">Unicorn</a>" occurs in the King James Version in the passages cited, where the Revised Version (British and American) has "<a href="./study/isbe/search.html?string=WILD+OX">wild-ox</A>" (which see).``1';
isbe[8999]='Unity`u\'-ni-ti: <a onClick="return mV(\'Psa\',133,1);">Ps 133:1</a> for (yachadh, "unitedness," and <a onClick="return mV(\'Eph\',4,3,13);">Eph 4:3,13</a> for henotes "oneness." Also Sirach 25:1 the King James Version for homonoia "concord" (so the Revised Version (British and American)).``1';
isbe[9000]='Unknown God`un-non\', (agnostos theos): In <a onClick="return mV(\'Act\',17,23);">Ac 17:23</a> (St. Paul\'s speech in Athens) the American Standard Revised Version reads: "I found also an altar with this inscription, To AN UNKNOWN GOD. What therefore ye worship in ignorance, this I set forth unto you." the King James Version and the English Revised Version margin translate "to the Unknown God," owing to the fact that in Greek certain words, of which theos is one, may drop the article when it is to be understood. In the present case the use of the article. is probably right (compare <a onClick="return mV(\'Act\',17,24);">Ac 17:24</a>). In addition, the King James Version reads "whom" and "him" in place of "what" and "this." The difference here is due to a variation in the Greek manuscripts, most of which support the King James Version. But internal probability is against the King James Version\'s reading, as it would have been very easy for a scribe to change neuters (referring to the divine power) into masculines after "God," but not vice versa. Hence, modern editors (except yon Soden\'s margin) have adopted the reading in the Revised Version (British and American).<P>Paul in Athens, "as he beheld the city full of idols," felt that God was truly unknown there. Hence the altar with the inscription struck him as particularly significant. Some Athenians, at any rate, felt the religious inadequacy of all known deities and were appealing to the God who they felt must exist, although they knew nothing definite about Him. No better starting-point for an address could be wished. What the inscription actually meant, however, is another question. Nothing is known about it. Altars dedicated "to unknown gods" (in the plural) seem to have been fairly common (Jerome on <a onClick="return mV(\'Tts\',1,12);">Tit 1:12</a>; Pausanias, i.1,4; Philaster, Vita Apoll., vi.3), and Blase (Commentary ad loc.) has even suggested that the words in Acts were originally in the plural. But this would spoil the whole point of the speech, and the absence of references to a single inscription among thousands that existed can cause no surprise. Those inscriptions in the plural seem to have been meant in the sense "to the other deities that may exist in addition to those already known," but an inscription in the sing. could not have this meaning. Perhaps a votive inscription is meant, where the worshipper did not know which god to thank for some benefit received. That a slur on all the other Athenian objects of worship was intended is, however, most improbable, but Paul could not of course be expected to know the technical meaning of such inscriptions.`<a href="./study/isbe/search.html?string=ATHENS">ATHENS</a>`48';
