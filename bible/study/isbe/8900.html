isbe = [];

isbe[8901]='Travail`trav\'-al (yaladh (<a onClick="return mV(\'Gen\',35,16);">Ge 35:16</a>, etc.), chul, chil (properly "writhe," <a onClick="return mV(\'Job\',15,20);">Job 15:20</a>, etc.); odin (classical odis) (<a onClick="return mV(\'Mat\',24,8);">Mt 24:8</a>, etc.), odino (Sirach 19:11, etc.; <a onClick="return mV(\'Gal\',4,19);">Ga 4:19</a>, etc.)): "Travail" and its derivatives are used in the primary sense of the labor of childbirth, descriptive of the actual cases of Rachel (<a onClick="return mV(\'Gen\',35,16);">Ge 35:16</a>), Tamar (<a onClick="return mV(\'Gen\',38,27);">Ge 38:27</a>), Ichabod\'s mother (<a onClick="return mV(\'1Sa\',4,19);">1Sa 4:19</a>), and the apocalyptic woman clothed with the sun (<a onClick="return mV(\'Rev\',12,2);">Re 12:2</a>). In the majority of passages, however, "travail" is used figuratively, to express extreme and painful sorrow (9 times in Jeremiah), "as of a woman in travail." It is also employed in the sense of irksome and vexatious business (6 times in Ecclesiastes, where it is the rendering of the word \'inyan). In the same book "travail" is used to express the toil of one\'s daily occupation (<a onClick="return mV(\'Ecc\',4,4,6);">Ecclesiastes 4:4,6</a>), where it is the translation of \'amal. In three places (<a onClick="return mV(\'Exd\',18,8);">Ex 18:8</a>; <a onClick="return mV(\'Num\',20,14);">Nu 20:14</a>; <a onClick="return mV(\'Lam\',3,5);">La 3:5</a>) where the King James Version has "travel" the Revised Version (British and American) has changed it to "travail," as in these passages the word tela\'ah refers to the sense of weariness and toil, rather than to the idea of journeying (in the King James Version the spellings "travel" and "travail" were used indiscriminately; compare Sirach 19:11; 31:5). The sorrows which are the fruits of wickedness are compared to the pain of travail in <a onClick="return mV(\'Job\',15,20);">Job 15:20</a> (chul) and <a onClick="return mV(\'Psa\',7,14);">Ps 7:14</a> (chabhal), the word used here meaning the torture or twisting pains of labor; see also the fanciful employment of "travail" in Sirach 19:11.<P>In the New Testament the travail of childbirth is used as the figure of the painful and anxious struggle against the evils of the world in the soul\'s efforts to attain the higher ideals of the Christian life (<a onClick="return mV(\'Jhn\',16,21);">Joh 16:21</a> (tikto); <a onClick="return mV(\'Rom\',8,22);">Ro 8:22</a>; <a onClick="return mV(\'Gal\',4,27);">Ga 4:27</a>); twice, however, it is the rendering of mochthos, the ordinary word for "toil," "hardship" or "distress" (<a onClick="return mV(\'1Th\',2,9);">1Th 2:9</a>; <a onClick="return mV(\'2Th\',3,8);">2Th 3:8</a>).`<a href="./study/isbe/search.html?string=birth">BIRTH</a>; <a href="./study/isbe/search.html?string=labor">LABOR</a>`107';
isbe[8902]='Traveller`trav\'-el-er: <a onClick="return mV(\'Jdg\',5,6);">Jud 5:6</a> for halakh nethibhah, "goers on paths"; <a onClick="return mV(\'2Sa\',12,4);">2Sa 12:4</a> for helekh, literally, "a going"; <a onClick="return mV(\'Job\',31,32);">Job 31:32</a> for \'arach, participle of a verb meaning "to wander"; Sirach 26:12; 42:3 for hodoiporos, "one making a way."`<a href="./study/isbe/search.html?string=WAYFARING+MAN">WAYFARING MAN</a>`1';
isbe[8903]='Tread`tred.`<a href="./study/isbe/search.html?string=WINE+PRESS">WINE PRESS</a>`1';
isbe[8904]='Treason`tre\'-z\'-n: The translation of qesher, in English Versions of the Bible <a onClick="return mV(\'1Ki\',16,20);">1Ki 16:20</a>; <a onClick="return mV(\'2Ki\',11,14);">2Ki 11:14</a> parallel <a onClick="return mV(\'2Ch\',23,13);">2Ch 23:13</a>. Qesher (from qashar, "to bind") means "a conspiracy" (<a onClick="return mV(\'2Sa\',15,12);">2Sa 15:12</a>; <a onClick="return mV(\'2Ki\',12,20);">2Ki 12:20</a>, etc.), and the translation "treason" is due to the King James Versions\' love of variety.``1';
isbe[8905]='Treasure; Treasurer; Treasury`trezh\'-ur, trezh\'-ur-er, trezh\'-ur-i (otsar, genaz, genez, ganzakh, chocen matmon, mickenah, mikhman, \'athudh, saphan; gaza, thesauros):<P>I. In the Old Testament.<P>1. Treasure<P>The English word "treasure" has in the Old Testament at least five somewhat distinct meanings as expressed in the words: "treasure," genaz (Aramaic) or genez (Hebrew), usually meaning "the thing stored"; translated "treasures" in <a onClick="return mV(\'Ezr\',6,1);">Ezr 6:1</a>, but in <a onClick="return mV(\'Ezr\',5,17);">5:17</A> and <a onClick="return mV(\'Ezr\',7,20);">7:20</A> translated "treasure-house": "search made in the king\'s treasure-house." In <a onClick="return mV(\'Est\',3,9);">Es 3:9</a>; <a onClick="return mV(\'Est\',4,7);">4:7</a> the Hebrew form is translated "treasury," as is ganzakh in <a onClick="return mV(\'1Ch\',28,11);">1Ch 28:11</a>.<P>2. Storehouse:<P>"Storehouse," not the thing stored but the place of storage; \'otsar means depository, cellar, garner, armory, store or treasure-house. In several places it ought to be translated by some of these words. It is the most frequent word for treasure. the English Revised Version and the American Standard Revised Version both translate in some instances by other words, e.g. <a onClick="return mV(\'1Ki\',7,51);">1Ki 7:51</a>, "treasuries of the house of Yahweh," so also <a onClick="return mV(\'2Ch\',5,1);">2Ch 5:1</a>; "treasury" in <a onClick="return mV(\'Neh\',7,70,71);">Ne 7:70,71</a>, "gave to the treasury a thousand darics of gold"; in <a onClick="return mV(\'Job\',38,22);">Job 38:22</a>, "treasuries of the snow" (compare <a onClick="return mV(\'Pro\',8,21);">Pr 8:21</a>; <a onClick="return mV(\'Jer\',10,13);">Jer 10:13</a>; <a onClick="return mV(\'Jer\',51,16);">51:16</a>; <a onClick="return mV(\'Ezr\',2,69);">Ezr 2:69</a>).<P>3. Hidden Riches:<P>"Treasure" or something concealed. There are 3 Hebrew words with this meaning and all in the King James Version translated "treasure." (1) Matmon, which literally means "a secret storehouse" and so a secreted valuable, usually money buried, and so hidden riches of any kind, hid treasures: "treasure in your sacks" (<a onClick="return mV(\'Gen\',43,23);">Ge 43:23</a>); "dig for it more than for hid treasures" (<a onClick="return mV(\'Job\',3,21);">Job 3:21</a>); "search for her as for hid treasures" (<a onClick="return mV(\'Pro\',2,4);">Pr 2:4</a>); "We have stores hidden in the field, of wheat," etc. (<a onClick="return mV(\'Jer\',41,8);">Jer 41:8</a>). (2) Mikhman, treasure as hidden, used only in <a onClick="return mV(\'Dan\',11,43);">Da 11:43</a>: "have power over the treasures of gold and silver." (3) Saphan, meaning hidden treasure or valuables concealed: "hidden treasures of the sand" (<a onClick="return mV(\'Deu\',33,19);">De 33:19</a>).<P>4. Strength:<P>Perhaps the strength of riches and so treasure, the Hebrew word being chocen, from a root meaning to hoard or lay up: "In the house of the righteous is much treasure" (<a onClick="return mV(\'Pro\',15,6);">Pr 15:6</a>); "They take treasure and precious things" (<a onClick="return mV(\'Eze\',22,25);">Eze 22:25</a>).<P>5. Something Prepared:<P>"Something prepared," made ready, the Hebrew word being \'athudh, meaning "prepared," "ready," therefore something of value and so treasure: "have robbed their treasures," fortifications or other things "made ready" (<a onClick="return mV(\'Isa\',10,13);">Isa 10:13</a>).<P>In the Old Testament the Hebrew word most often translated "treasure" is \'otsar. It occurs in the sing. as follows: <a onClick="return mV(\'Deu\',28,12);">De 28:12</a>; <a onClick="return mV(\'1Ch\',29,8);">1Ch 29:8</a>; <a onClick="return mV(\'Neh\',10,38);">Ne 10:38</a>; <a onClick="return mV(\'Psa\',17,14);">Ps 17:14</a>; <a onClick="return mV(\'Psa\',135,4);">135:4</a>; <a onClick="return mV(\'Pro\',15,16);">Pr 15:16</a>; <a onClick="return mV(\'Pro\',21,20);">21:20</a>; <a onClick="return mV(\'Ecc\',2,8);">Ec 2:8</a>; <a onClick="return mV(\'Isa\',33,6);">Isa 33:6</a>; <a onClick="return mV(\'Dan\',1,2);">Da 1:2</a>; <a onClick="return mV(\'Hsa\',13,15);">Ho 13:15</a>; in the pl.: <a onClick="return mV(\'Deu\',32,34);">De 32:34</a>; <a onClick="return mV(\'1Ki\',14,26);">1Ki 14:26</a>; <a onClick="return mV(\'1Ki\',15,18);">15:18</a>; <a onClick="return mV(\'2Ki\',12,18);">2Ki 12:18</a>; <a onClick="return mV(\'2Ki\',14,14);">14:14</a>; <a onClick="return mV(\'2Ki\',16,8);">16:8</a>; <a onClick="return mV(\'2Ki\',18,15);">18:15</a>; <a onClick="return mV(\'2Ki\',20,13,15);">20:13,15</a>; <a onClick="return mV(\'2Ki\',24,13);">24:13</a>, etc.<P>The same word is in the King James Version translated "treasuries" in <a onClick="return mV(\'1Ch\',9,26);">1Ch 9:26</a>; <a onClick="return mV(\'1Ch\',28,12);">28:12</a>; <a onClick="return mV(\'2Ch\',32,27);">2Ch 32:27</a>; <a onClick="return mV(\'Neh\',13,12,13);">Ne 13:12,13</a>; <a onClick="return mV(\'Psa\',135,7);">Ps 135:7</a>; and "treasury" in <a onClick="return mV(\'Jos\',6,19,24);">Jos 6:19,24</a>; <a onClick="return mV(\'Jer\',38,11);">Jer 38:11</a>.<P>II. In the New Testament.<P>1. Gaza:<P>There are two words translated "treasure": Gaza is of Persian origin, meaning "treasure." Found only once in <a onClick="return mV(\'Act\',8,27);">Ac 8:27</a> concerning the Ethiopian "who was over all her (Queen Candace\'s) treasure." In the compound gazophulakion, "guarding of gaza," the same word appears and the compound is translated "treasury" in <a onClick="return mV(\'Mar\',12,41,43);">Mr 12:41,43</a> parallel <a onClick="return mV(\'Luk\',21,1);">Lu 21:1</a>; <a onClick="return mV(\'Jhn\',8,20);">Joh 8:20</a>.<P>See <a href="./study/isbe/search.html?string=TEMPLE">TEMPLE</A>; <a href="./study/isbe/search.html?string=TREASURY+(OF TEMPLE)">TREASURY (OF TEMPLE)</A>.<P>2. Thesauros:<P>The word thesauros means literally, a "deposit," so wealth and treasure. Evidently throughout the New Testament it has a twofold usage as describing<P>(1) material treasure, either money or other valuable material possession, and<P>(2) spiritual treasure, e.g. "like unto treasure hid in a field" (<a onClick="return mV(\'Mat\',13,44);">Mt 13:44</a>); "good treasure of the heart" (<a onClick="return mV(\'Mat\',12,35);">Mt 12:35</a>).<P>Other references to material treasure are <a onClick="return mV(\'Mat\',6,21);">Mt 6:21</a>; <a onClick="return mV(\'Mat\',13,52);">13:52</a>; <a onClick="return mV(\'Luk\',12,21,34);">Lu 12:21,34</a>, etc. References to spiritual treasure are <a onClick="return mV(\'Mat\',19,21);">Mt 19:21</a>; <a onClick="return mV(\'Mar\',10,21);">Mr 10:21</a>; <a onClick="return mV(\'Luk\',6,45);">Lu 6:45</a>; <a onClick="return mV(\'Luk\',12,33);">12:33</a>; <a onClick="return mV(\'Luk\',18,22);">18:22</a>; plural <a onClick="return mV(\'Mat\',6,20);">Mt 6:20</a>; <a onClick="return mV(\'Col\',2,3);">Col 2:3</a>.<P>In <a onClick="return mV(\'Mat\',27,6);">Mt 27:6</a> the word for "treasury" is korbanas; compare the Revised Version margin.<P>See <a href="./study/isbe/search.html?string=CORBAN">CORBAN</A>.``142';
isbe[8906]='Treasurer`(\'atsar, gedhabhar, gizbar, cakhan; oikonomos):<P>(1) \'Atsar, meaning primarily "to store up," and hence, one who lays up in store, i.e. a "treasurer": "I made treasurers over the treasuries" (<a onClick="return mV(\'Neh\',13,13);">Ne 13:13</a>).<P>(2) Gedhabhar (Aramaic), used only in <a onClick="return mV(\'Dan\',3,2,3);">Da 3:2,3</a>: "treasurers," named with judges and counselors as recognized officials.<P>(3) Gizbar, used in <a onClick="return mV(\'Ezr\',7,21);">Ezr 7:21</a> (Aramaic) and equivalent in <a onClick="return mV(\'Ezr\',1,8);">Ezr 1:8</a> (Hebrew): "treasurers beyond the river" and "Mithredath the treasurer."<P>(4) Cakhan, primarily meaning "one who ministers to," and hence, a keeper of treasure, treasurer: "Get thee unto this treasurer" (<a onClick="return mV(\'Isa\',22,15);">Isa 22:15</a>). Perhaps the idea of steward is here intended.<P>(5) Oikonomos, by the King James Version translated "chamberlain," more properly in the American Standard Revised Version translated "treasurer": "Erastus the treasurer of the city saluteth you" (<a onClick="return mV(\'Rom\',16,23);">Ro 16:23</a>).``142';
isbe[8907]='Treasury, (of Temple)`trezh\'-ur-i (\'otsar, usually; ganzakh, <a onClick="return mV(\'1Ch\',28,11);">1Ch 28:11</a>; gazophulakion, korbanas):<P>1. Origin of the Treasury:<P>The need of a "treasury" in connection with the house of Yahweh would early be felt for the reception of the offerings of the people, of tithes, and of the spoils of war dedicated to Yahweh. Already in <a onClick="return mV(\'Jos\',6,19,24);">Jos 6:19,24</a>, therefore, we read of a "treasury of the house of Yahweh," into which "the silver and gold, and vessels of brass and iron," taken at Jericho, were brought. In the reign of David, and in his plans for the future temple, great prominence is given to the "treasuries." In <a onClick="return mV(\'1Ch\',26,20);">1Ch 26:20</a>ff are given the names of those who were over "the treasures of the house of God," and over "the treasures of the dedicated things" ("the spoil won in battles," <a onClick="return mV(\'1Ch\',26,27);">26:27</a>), the latter being applied "to repair the house of Yahweh."<P>2. The Solomonic Temple:<P>In David\'s plans for Solomon the "treasuries" (ganzakkim) are mentioned with the "porch," "the houses," the "upper rooms," the "inner chambers" of the Temple (<a onClick="return mV(\'1Ch\',28,11);">1Ch 28:11</a>); and the same distinction is made of "the treasuries (\'otsroth) of the house of God," and "the treasuries of the dedicated things" (<a onClick="return mV(\'1Ch\',28,12);">1Ch 28:12</a>). In the accounts of the actual building of the Temple, "treasuries" are not mentioned, but subsequent notices give ample evidence of their existence. In the narratives of the repeated plunderings of the Temple (see <a href="./study/isbe/search.html?string=TEMPLE">TEMPLE</A>), constant allusion is made to the carrying away of "the treasures of the house of Yahweh" and "the treasures of the king\'s house" or palace (<a onClick="return mV(\'1Ki\',14,26);">1Ki 14:26</a>; <a onClick="return mV(\'1Ki\',15,15,18);">15:15,18</a>; <a onClick="return mV(\'2Ki\',12,18);">2Ki 12:18</a>; <a onClick="return mV(\'2Ki\',14,14);">14:14</a>; <a onClick="return mV(\'2Ki\',16,8);">16:8</a>; <a onClick="return mV(\'2Ki\',18,15);">18:15</a>; <a onClick="return mV(\'2Ki\',24,13);">24:13</a>). In the episode of Jehoash\'s repair of the Temple (<a onClick="return mV(\'2Ki\',12,1);">2Ki 12</a>; <a onClick="return mV(\'2Ch\',24,\'1-\');">2Ch 24</a>), we have a refreshing glimpse of the presence and uses of the treasury; but this brighter gleam is soon swallowed up again in darkness. Of the larger store-chambers we get a glance in Jeremiah, where we are told that "the house of the king" was "under the treasury" (38:11), i.e. on a lower level under the south wall.<P>3. The Second Temple:<P>The Book of Nehemiah introduces us to treasury-chambers in the second temple—now used for the voluntary offerings (tithes) of the people—grain, and wine, and oil (<a onClick="return mV(\'Neh\',13,4);">Ne 13:4</a>ff; compare <a onClick="return mV(\'Mal\',3,10);">Mal 3:10</a>). A certain Meshullam had repaired the city wall "over against his chamber" (<a onClick="return mV(\'Neh\',3,30);">Ne 3:30</a>), and he, with other Levites, kept "the watch at the storehouses of the gates" (<a onClick="return mV(\'Neh\',12,25);">Ne 12:25</a>). These gates were probably gates of exit on the southern side, as in the Herodian temple.<P>4. Herod\'s Temple in the New Testament:<P>In Herod\'s temple the name "treasury" was specially given to the "court of the women" (see <a href="./study/isbe/search.html?string=TEMPLE,+HEROD\'S">TEMPLE, HEROD\'S</a>), where were 13 trumpet-shaped boxes for the reception of the offerings of the worshippers. It was here that Jesus saw the poor widow cast in her two mites (<a onClick="return mV(\'Mar\',12,41);">Mr 12:41</a>; <a onClick="return mV(\'Luk\',21,\'1-4\');">Lu 21:1-4</a>), and the court is expressly named the "treasury" in <a onClick="return mV(\'Jhn\',8,20);">Joh 8:20</a>: "These words spake he in the treasury, as he taught in the temple." It is a legitimate deduction that this court was the ordinary scene of the Lord\'s ministry when teaching in the temple.`<a href="./study/isbe/search.html?string=TREASURE,+TREASURER,+TREASURY">TREASURE, TREASURER, TREASURY</a>`17';
isbe[8908]='Treaty`tre\'-ti (berith, karath berith, "make a covenant," "league," "treaty"): Although the Israelites were forbidden to make treaties, or enter into covenant, with the Canaanites because of the risk thereby involved of religious apostasy and moral contamination (<a onClick="return mV(\'Exd\',23,32);">Ex 23:32</a>; <a onClick="return mV(\'Exd\',34,12);">34:12</a>; <a onClick="return mV(\'Deu\',7,2);">De 7:2</a>; <a onClick="return mV(\'Jdg\',2,2);">Jud 2:2</a>), they were so situated in the midst of the nations that treaty relations of some sort with their neighbors were from time to time inevitable. After the rise of the monarchy, treaties were common. David and Solomon had friendly relations with Hiram, king of Tyre (<a onClick="return mV(\'1Ki\',5,15);">1Ki 5:15</a>); Asa, to rid himself of the hostile approaches of Baasha, king of Israel, entered into a league with Ben-hadad of Syria, which the prophet Hanani denounced (<a onClick="return mV(\'2Ch\',16,1);">2Ch 16:1</a>); Ahab entered into a similar compact with Ben-hadad\'s son and successor, and set him at liberty when he was his prisoner of war (<a onClick="return mV(\'1Ki\',20,34);">1Ki 20:34</a>); and at a later time Jehoshaphat joined Ahab in an expedition against Ben-hadad II to Ramoth-gilead in which Ahab lost his life (<a onClick="return mV(\'1Ki\',22,\'1-\');">1Ki 22</a>). Sometimes with Syria and neighboring states against the terrible Assyrian power, and sometimes with Egypt against Assyria or Babylon, the kings of Israel and Judah entered into treaty to resist their advances and to preserve their own independence (<a onClick="return mV(\'2Ki\',17,4);">2Ki 17:4</a>; <a onClick="return mV(\'Hsa\',7,11);">Ho 7:11</a>; <a onClick="return mV(\'Isa\',30,1);">Isa 30:1</a>). Against such alliances the prophets raised their testimony (<a onClick="return mV(\'Isa\',31,1);">Isa 31:1</a>; <a onClick="return mV(\'Jer\',27,3);">Jer 27:3</a>).`<a href="./study/isbe/search.html?string=WAR">WAR</a>; <a href="./study/isbe/search.html?string=ROME">ROME</a>`128';
isbe[8909]='Tree`tre.`<a href="./study/isbe/search.html?string=BOTANY">BOTANY</a>`1';
isbe[8910]='Tree of Life`(\'ets chayyim; xulon tes zoes): The expression "tree of life" occurs in four groups or connections: (1) in the story of the Garden of Eden, (2) in the Proverbs of the Wise Men, (3) in the apocryphal writings, and (4) in the Apocalypse of John.<P>1. The Tree of Life in the Garden of Eden:<P>The tree was in the midst of the Garden, and its fruit of such a nature as to produce physical immortality (<a onClick="return mV(\'Gen\',2,9);">Ge 2:9</a>; <a onClick="return mV(\'Gen\',3,22);">3:22</a>). After guiltily partaking of the tree of the knowledge of good and evil, and the sinful tendency having thus been implanted in their natures, the man and woman are driven forth from the Garden lest they should eat of the tree of life and live forever (<a onClick="return mV(\'Gen\',3,22);">Ge 3:22</a>). The idea seems to be that, if they should eat of it and become immortalized in their sinful condition, it would be an unspeakable calamity to them and their posterity. For sinful beings to live forever upon earth would be inconceivably disastrous, for the redemption and development of the race would be an impossibility in that condition. Earth would soon have been a hell with sin propagating itself forever. To prevent such a possibility they were driven forth, cherubim were placed at the entrance of the Garden, the flame of a sword revolving every way kept the way of the tree of life, and this prevented the possibility of man possessing a physical immortality. It is implied that they had not yet partaken of this tree and the opportunity is now forever gone. Immortality must be reached in some other way.<P>The interpretation of the story is a standing problem. Is it mythical, allegorical, or historical? Opinions vary from one of these extremes to the other with all degrees of difference between. In general, interpreters may be divided into three classes:<P>(1) Many regard the story as a myth, an ancient representation of what men then conceived early man to have been, but with no historical basis behind it. All rationalistic and modern critical scholars are practically agreed on this. Budde in his Urgeschichte says there was but one tree, that is the tree of the knowledge of good and evil, and the intimation of a tree of life is an interpolation. Barton has endeavored to show that the tree of life was really the date-palm, and the myth gathered around this tree because of its bisexual nature. He holds that man came to his self-realization through the sexual relation, and therefore the date-palm came to be regarded as the tree of life, and the tree of the knowledge of good and evil. But this difference came in later when the knowledge of its origin became obscured. He calls attention to the fact that the sacred palm is found in the sanctuary of Ea at Eridu. All such interpretations are too obviously based upon a materialistic evolution hypothesis.<P>(2) There are those who regard the entire story as literal: one tree would actually impart physical immortality, the other the knowledge of evil. But this involves endless difficulties also, requires tremendous differences between the laws of Nature then and now, vast differences in fruits, men and animals, and an equally vast difference in God\'s dealings with man.<P>(3) We prefer to regard it as a pictorial-spiritual story, the representing of great spiritual facts and religious history in the form of a picture. This is the usual Bible method. It was constantly employed by the prophets, and Jesus continually "pictured" great spiritual facts by means of material objects. Such were most of His parables. John\'s Apocalypse is also a series of pictures representing spiritual and moral history. So the tree of life is a picture of the glorious possibilities which lay before primitive man, and which might have been realized by him had not his sin and sinful condition prevented it. God\'s intervention was a great mercy to the human race. Immortality in sin is rendered impossible, and this has made possible an immortality through redemption; man at first is pictured as neither mortal nor immortal, but both are possible, as represented by the two trees. He sinned and became mortal, and then immortality was denied him. It has since been made possible in a much higher and more glorious way.<P>2. A Common Poetic Simile:<P>This picture was not lost to Israel. The "tree of life," became a common poetic simile to represent that which may be a source of great blessing. In the Book of Proverbs the conception deepens from a physical source of a mere physical immortality to a moral and spiritual source of a full life, mental moral and spiritual, which will potentially last forever. Life, long life, is here attributed to a certain possession or quality of mind and heart. Wisdom is a source and supply of life to man. This wisdom is essentially of a moral quality, and this moral force brings the whole man into right relations with the source of life. Hence, a man truly lives by reason of this relationship (<a onClick="return mV(\'Pro\',3,18);">Pr 3:18</a>). The allusion in this verse is doubtless to <a onClick="return mV(\'Gen\',2,9);">Ge 2:9</a>; <a onClick="return mV(\'Gen\',3,22);">3:22</a>. An expression very similar is <a onClick="return mV(\'Pro\',10,11);">Pr 10:11</a>, where the mouth of the righteous is declared to be a fountain of life. Good words are a power for good, and hence, produce good living. <a onClick="return mV(\'Pro\',11,30);">Pr 11:30</a> has a like thought: "The fruit of the righteous is a tree of life," i.e. the good life is a source of good in its influence on others. <a onClick="return mV(\'Pro\',13,12);">Pr 13:12</a> says: "Hope deferred maketh the heart sick; but when the desire cometh, it is a tree of life." The meaning seems to be that the gratification of good and lawful desires produces those pleasures and activities which make up life and its blessings. <a onClick="return mV(\'Pro\',15,4);">Pr 15:4</a> says: "A gentle tongue is a tree of life," i.e. its beneficent influences help others to a better life.<P>3. The Apocryphal Writings:<P>The apocryphal writings contain a few references to the tree of life, but use the phrase in a different sense from that in which it is used in the canonical books: "They shall have the tree of life for an ointment of sweet savour" (2Esdras 2:12). Ecclesiasticus 1:20 has only an indirect reference to it. Ethiopic Enoch, in his picture of the Messianic age, uses his imagination very freely in describing it: "It has a fragrance beyond all fragrances; its leaves and bloom and wood wither not forever; its fruit is beautiful and resembles the date-palm" (24:4). Slavonic Enoch speaks thus: "In the midst there is the tree of life...and this tree cannot be described for its excellence and sweet odor" (8:3). 2Esdras describing the future says: "Unto you is paradise opened, the tree of life is planted" (8:52).<P>4. The Book of Revelation:<P>The Apocalypse of John refers to the tree of life in three places (<a onClick="return mV(\'Rev\',2,7);">Re 2:7</a>; <a onClick="return mV(\'Rev\',22,2,14);">22:2,14</a>). These are pictures of the glorious possibilities of life which await the redeemed soul. In Ezekiel\'s picture of the ideal state and the Messianic age, there flows from the sanctuary of God a life-giving river having trees upon its banks on either side, yielding fruit every month. The leaf of this tree would not wither, nor its fruit fail, because that which gave moisture to its roots flowed from the sanctuary. This fruit was for food and the leaves for medicine (<a onClick="return mV(\'Eze\',47,12);">Eze 47:12</a>). Very similar to this and probably an expansion of it is John\'s picture in Revelation: "To him that overcometh, to him will I give to eat of the tree of life, which is in the Paradise of God" (<a onClick="return mV(\'Rev\',2,7);">2:7</A>). This means that all the possibilities of a complete and glorious life are open to the one that overcomes, and by overcoming is prepared to become immortal in a vastly higher sense than was possible to primitive man. In his picture of the few Jerusalem, the river of water of life has the tree of life on either side (<a onClick="return mV(\'Rev\',22,2);">22:2</A>). Its leaf never fades and its monthly fruitage never fails. Food and medicine these are to be to the world, supplied freely to all that all may enjoy the highest possibilities of activity and blessedness which can come to those who are in right relationships with God and Jesus Christ. In <a onClick="return mV(\'Rev\',22,14);">22:14</A> John pronounces a blessing on those who wash their robes, who lead the clean and pure Christ life, for they thereby have the right and privilege of entering into the gates of the City and partaking of the tree of life. This means not only immortal existence, but such relations with Jesus Christ and the church that each has unrestricted access to all that is good in the universe of God. The limit is his own limited capacity.``146';

isbe[8915]='Trespass`tres\'-pas: To pass over, to go beyond one\'s right in place or act; to injure another; to do that which annoys or inconveniences another; any violation of law, civil or moral; it may relate to a person, a community, or the state, or to offenses against God. The Hebrew \'asham ("sin"), is used very frequently in the Old Testament when the trespass is a violation of law of which God is the author. The Greek word is paraptoma.<P>In the Old Testament an offering was demanded when the offense was against God: a female lamb; in other cases, according to the magnitude of the wrong, a ram or a goat; the offering was to be preceded by a confession by the one committing the trespass. If the trespass was against a human being, the wrong-doer must make it right with the person, and when reconciliation should have been effected, then the offering for sin was to be made. See under <a href="./study/isbe/search.html?string=SACRIFICE">SACRIFICE</A>, "Trespass Offering." If a person\'s property has been injured, then the trespasser shall add a fifth to the value of the property injured and give that to the injured party (<a onClick="return mV(\'Lev\',6,5);">Le 6:5</a>). Zaccheus, wanting to make full restitution, went beyond the demands of the Law (<a onClick="return mV(\'Luk\',19,\'1-9\');">Lu 19:1-9</a>).<P>The New Testament teaching on the subject is, first to be reconciled to the brother and then offer, or worship (<a onClick="return mV(\'Mat\',5,23,24);">Mt 5:23,24</a>). In all cases, also, the offended party must forgive if the offender shall say, "I repent" (<a onClick="return mV(\'Mat\',6,14);">Mt 6:14</a>; <a onClick="return mV(\'Eph\',4,32);">Eph 4:32</a>; <a onClick="return mV(\'Col\',3,13);">Col 3:13</a>). We have been alienated by our trespasses from God (<a onClick="return mV(\'Eph\',2,1);">Eph 2:1</a>). It was the Father\'s good will to reconcile all to Himself through Christ (<a onClick="return mV(\'Col\',1,\'20-22\');">Col 1:20-22</a>). We must be reconciled to God (<a onClick="return mV(\'2Cr\',5,20,21);">2Co 5:20,21</a>). This being done, our trespasses shall be forgiven and we shall be justified.``45';

isbe[8919]='Tribe`trib (in the Old Testament always for matteh, 183 times, or shebhet, 145 times, also spelled shebhet; Aramaic shebhat (<a onClick="return mV(\'Ezr\',6,17);">Ezr 6:17</a>)): Both words mean "staff," and perhaps "company led by chief with staff" (OHL, 641) is the origin of the meaning "tribe." In the Apocrypha and New Testament always for phule, from phuo, "beget," with dodekaphulon, "twelve tribes," in <a onClick="return mV(\'Act\',26,7);">Ac 26:7</a>. Of the two Hebrew words, shebhet appears to be considerably the older, and is used in <a onClick="return mV(\'Psa\',74,2);">Ps 74:2</a>; <a onClick="return mV(\'Jer\',10,16);">Jer 10:16</a>; <a onClick="return mV(\'Jer\',51,19);">51:19</a> of the whole people of Israel, and in <a onClick="return mV(\'Num\',4,18);">Nu 4:18</a>; <a onClick="return mV(\'Jdg\',20,12);">Jud 20:12</a> (Revised Version margin); <a onClick="return mV(\'1Sa\',9,21);">1Sa 9:21</a> (Revised Version margin) of subdivisions of a tribe (but the text of most of these six verses is suspicious). Further, in <a onClick="return mV(\'Isa\',19,13);">Isa 19:13</a>, shebhet is used of the "tribes" (nomes?) of Egypt and phule in <a onClick="return mV(\'Mat\',24,30);">Mt 24:30</a> of "all the tribes of the earth," but otherwise shebhet, matteh and phule refer exclusively to the tribes of Israel. In <a onClick="return mV(\'2Sa\',7,7);">2Sa 7:7</a> for shibhete, "tribes," read shophete, "judges" (of the Revised Version margin).``48';
isbe[8920]='Tribulation`trib-u-la\'-shun (tsar, tsar, "staid," "narrow," "pent up"; compare <a onClick="return mV(\'Num\',22,26);">Nu 22:26</a>):<P>1. In the Old Testament:<P>Closely pressed, as of seals (<a onClick="return mV(\'Job\',41,15);">Job 41:15</a> (7)); of streams pent up (<a onClick="return mV(\'Isa\',59,9);">Isa 59:9</a> margin); of strength limited (<a onClick="return mV(\'Pro\',24,10);">Pr 24:10</a>, "small"). Hence, figuratively, of straitened circumstances; variously rendered "affliction," "tribulation," "distress" (<a onClick="return mV(\'Deu\',4,30);">De 4:30</a>; <a onClick="return mV(\'Job\',15,24);">Job 15:24</a>; <a onClick="return mV(\'Job\',30,12);">30:12</a>; <a onClick="return mV(\'Psa\',4,2);">Ps 4:2</a>; <a onClick="return mV(\'Psa\',18,7);">18:7</a>; <a onClick="return mV(\'Psa\',32,7);">32:7</a>; <a onClick="return mV(\'Psa\',44,11);">44:11</a>, etc.; <a onClick="return mV(\'Psa\',78,42);">Ps 78:42</a>; <a onClick="return mV(\'Psa\',102,3);">102:3</a>; <a onClick="return mV(\'Psa\',106,44);">106:44</a>; <a onClick="return mV(\'Psa\',119,143);">119:143</a>; <a onClick="return mV(\'Isa\',26,16);">Isa 26:16</a>; <a onClick="return mV(\'Isa\',30,20);">30:20</a>; <a onClick="return mV(\'Hsa\',5,15);">Ho 5:15</a>; <a onClick="return mV(\'Eze\',30,16);">Eze 30:16</a>). Frequently, the feminine form (tsarah) is similarly rendered "tribulation" (<a onClick="return mV(\'Jdg\',10,14);">Jud 10:14</a> the King James Version; <a onClick="return mV(\'1Sa\',10,19);">1Sa 10:19</a> the King James Version; <a onClick="return mV(\'1Sa\',26,24);">1Sa 26:24</a>); in other places "distress," "affliction" (<a onClick="return mV(\'Gen\',42,21);">Ge 42:21</a>; <a onClick="return mV(\'Psa\',120,1);">Ps 120:1</a>; <a onClick="return mV(\'Pro\',11,8);">Pr 11:8</a>; <a onClick="return mV(\'2Ch\',20,9);">2Ch 20:9</a>; <a onClick="return mV(\'Isa\',63,9);">Isa 63:9</a>; <a onClick="return mV(\'Jer\',15,11);">Jer 15:11</a>; <a onClick="return mV(\'Jon\',2,2);">Jon 2:2</a>; <a onClick="return mV(\'Nah\',1,9);">Na 1:9</a>; <a onClick="return mV(\'Zec\',10,11);">Zec 10:11</a>).<P>2. In the New Testament:<P>The Greek is thlipsis, a "pressing together" (as of grapes), squeezing or pinching (from verb thlibo); used figuratively for "distress," "tribulation"; Septuagint for tsar and tsarah; Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) tribulatio pressura (from tribulum, "a threshing sledge"). The verb form is rendered "suffer tribulation" (<a onClick="return mV(\'1Th\',3,4);">1Th 3:4</a> the King James Version, "suffer affliction" the Revised Version (British and American)); "trouble" (<a onClick="return mV(\'2Th\',1,6);">2Th 1:6</a> the King James Version, "afflict" the Revised Version (British and American); compare <a onClick="return mV(\'2Cr\',1,6);">2Co 1:6</a>; <a onClick="return mV(\'2Cr\',4,8);">4:8</a>; <a onClick="return mV(\'2Cr\',7,5);">7:5</a>; <a onClick="return mV(\'1Ti\',5,10);">1Ti 5:10</a>; <a onClick="return mV(\'Hbr\',11,37);">Heb 11:37</a>). The noun form is rendered in the King James Version variously as "tribulation," "affliction," "persecution," though more uniformly "tribulation" in the Revised Version (British and American). The word is used generally of the hardships which Christ\'s followers would suffer (<a onClick="return mV(\'Mat\',13,21);">Mt 13:21</a>; <a onClick="return mV(\'Mat\',24,9,21,29);">24:9,21,29</a>; <a onClick="return mV(\'Mar\',4,17);">Mr 4:17</a>; <a onClick="return mV(\'Mar\',13,19,24);">13:19,24</a>; <a onClick="return mV(\'Jhn\',16,33);">Joh 16:33</a>; <a onClick="return mV(\'1Cr\',7,28);">1Co 7:28</a>); or which they are now passing through (<a onClick="return mV(\'Rom\',5,3);">Ro 5:3</a>; <a onClick="return mV(\'Rom\',12,12);">12:12</a>; <a onClick="return mV(\'2Cr\',4,17);">2Co 4:17</a>; <a onClick="return mV(\'Phl\',4,14);">Php 4:14</a>); or through which they have already come (<a onClick="return mV(\'Act\',11,19);">Ac 11:19</a>; <a onClick="return mV(\'2Cr\',2,4);">2Co 2:4</a>; <a onClick="return mV(\'Rev\',7,14);">Re 7:14</a>).``137';
isbe[8921]='Tribute`trib\'-ut (mac, "tribute," really meaning "forced laborers," "labor gang" (<a onClick="return mV(\'1Ki\',4,6);">1Ki 4:6</a>; <a onClick="return mV(\'1Ki\',9,15,21);">9:15,21</a>); also "forced service," "serfdom"; possibly "forced payment" is meant in <a onClick="return mV(\'Est\',10,1);">Es 10:1</a>; the idea contained in the modern word is better given by middah (<a onClick="return mV(\'Ezr\',6,8);">Ezr 6:8</a>; <a onClick="return mV(\'Neh\',5,4);">Ne 5:4</a>)): Words used only of the duty levied for Yahweh on acquired spoils are mekhec, "assessment" (<a onClick="return mV(\'Num\',31,28,37,38,39,40,41);">Nu 31:28,37,38,39,40,41</a>), belo, "excise" (<a onClick="return mV(\'Ezr\',4,13,20);">Ezr 4:13,20</a>; <a onClick="return mV(\'Neh\',7,24);">Ne 7:24</a>), massa\', "burden" (<a onClick="return mV(\'2Ch\',17,11);">2Ch 17:11</a>), and \'onesh, "fine" or "indemnity" (<a onClick="return mV(\'2Ki\',23,33);">2Ki 23:33</a>; compare <a onClick="return mV(\'Pro\',19,19);">Pr 19:19</a>). The translation "tribute" for miccath, in <a onClick="return mV(\'Deu\',16,10);">De 16:10</a> is wrong (compare the Revised Version margin). kensos (<a onClick="return mV(\'Mat\',22,17);">Mt 22:17</a>; <a onClick="return mV(\'Mar\',12,14);">Mr 12:14</a>) = "census," while phoros (<a onClick="return mV(\'Luk\',20,22);">Lu 20:22</a>; <a onClick="return mV(\'Luk\',23,2);">23:2</a>; <a onClick="return mV(\'Rom\',13,6,7);">Ro 13:6,7</a>), signifies an annual tax on persons, houses, lands, both being direct taxes. The phoroi were paid by agriculturists, payment being made partly in kind, partly in money, and are contrasted with the tele of the publicans, while kensos is strictly a poll tax. The amount of tribute required as a poll tax by the Romans was the didrachmon (<a onClick="return mV(\'Mat\',17,24);">Mt 17:24</a>), the King James Version "tribute," the Revised Version (British and American) "half-shekel." The stater (<a onClick="return mV(\'Mat\',17,27);">Mt 17:27</a>), was a tetradrachm, "one shekel," or pay for two. After the destruction of Jerusalem, the Jews were required to pay this poll tax toward the support of the worship of Jupiter Capitolinus. Different kinds of personal taxes were raised by the Romans:<P>(1) an income tax,<P>(2) the poll tax.<P>The latter must be paid by women and slaves as well as by free men, only children and aged people being exempted. The payment exacted began with the 14th year in the case of men and the 12th in the case of women, the obligation remaining in force up to the 65th year in the case of both. For purposes of assessment, each person was permitted to put his own statement on record. After public notice had been given by the government, every citizen was expected to respond without personal visitation by an official (see <a onClick="return mV(\'Luk\',2,1);">Lu 2:1</a>ff). On the basis of the records thus voluntarily made, the tax collectors would enforce the payment of the tribute.`<a href="./study/isbe/search.html?string=TAX,+TAXING">TAX, TAXING</a>`77';
isbe[8922]='Tribute Money`(to nomisma tou kensou (<a onClick="return mV(\'Mat\',22,19);">Mt 22:19</a>), "the coin used in payment of the imperial taxes"): Lit. "the lawful money of the tax," which, in the case of the poll tax, had to be paid in current coin of the realm (see <a onClick="return mV(\'Mat\',17,27);">Mt 17:27</a>).``1';
isbe[8923]='Triclinium`tri-klin\'-ti-um (Latin from Greek triklinion, from tri and kline, "a couch"): A couch for reclining at meals among the ancient Romans, arranged along three sides of a square, the fourth side being left open for bringing in food or tables, when these were used. In the larger Roman houses the dining-rooms consisted of small alcoves in the atrium arranged to receive triclinia. In early Old Testament times people sat at their meals (<a onClick="return mV(\'Gen\',27,19);">Ge 27:19</a>; <a onClick="return mV(\'Jdg\',19,6);">Jud 19:6</a>; <a onClick="return mV(\'1Sa\',20,5);">1Sa 20:5</a>; <a onClick="return mV(\'1Ki\',13,20);">1Ki 13:20</a>). Reclining was a luxurious habit imported from foreign countries by the degenerate aristocracy in the days of the later prophets (<a onClick="return mV(\'Amo\',2,8);">Am 2:8</a>; <a onClick="return mV(\'Amo\',6,4);">6:4</a>). Still, we find it common in New Testament times (<a onClick="return mV(\'Mat\',9,10);">Mt 9:10</a>; <a onClick="return mV(\'Mat\',26,7);">26:7</a>; <a onClick="return mV(\'Mar\',6,22,39);">Mr 6:22,39</a>; <a onClick="return mV(\'Mar\',14,3,18);">14:3,18</a>; <a onClick="return mV(\'Luk\',5,29);">Lu 5:29</a>; <a onClick="return mV(\'Luk\',7,36,37);">7:36,37</a>; <a onClick="return mV(\'Luk\',14,10);">14:10</a>; <a onClick="return mV(\'Luk\',17,7);">17:7</a>; <a onClick="return mV(\'Jhn\',12,2);">Joh 12:2</a>; in these passages, though English Versions of the Bible read "sat," the Greek words are anakeimai, sunanakeimai, anapipto, katakeimai and anaklino, all indicating "reclining"; compare <a onClick="return mV(\'Jhn\',13,23);">Joh 13:23</a>; <a onClick="return mV(\'Jhn\',21,20);">21:20</a>; here the King James Version translates these words "lean," probably with reference to the Jewish custom of leaning at the Passover feast). In <a onClick="return mV(\'Jhn\',2,8,9);">Joh 2:8,9</a> the ruler or governor of the feast is called architriklinos, that is, the master of the triclinium.`<a href="./study/isbe/search.html?string=MEALS">MEALS</a>`81';
isbe[8924]='Trim`The only non-modern use is in <a onClick="return mV(\'Jer\',2,33);">Jer 2:33</a>, "How trimmest thou thy way to seek love!" used for yatabh, "to make good," here "to study out," and the whole phrase means "to walk in an artificial manner," "like a courtesan."``1';
isbe[8925]='Trine Immersion; Triune Immersion`trin tri\'-un i-mur\'-shun:<P><b>I. LINGUISTIC BASIS</b><P class="in15">1. Immersion<P class="in15">2. Triple Action<P><b>II. DOCTRINAL ARGUMENT</b><P><b>III. HISTORICAL PRACTICE</b><P class="in15">1. The Jews<P class="in15">2. John the Baptist<P class="in15">3. The Didache<P class="in15">4. Justin Martyr<P class="in15">5. Tertullian<P class="in15">6. Eunomius<P class="in15">7. Greek Church<P><b>LITERATURE</b><hr /><P>I. Linguistic Basis.<P>1. Immersion:<P>The meaning of the word baptizo, is "to dip repeatedly," "to sub-merge" (Thayer, Greek Lexicon of the New Testament). It is probably the frequentative of bapto, "to dip," meaning "to dip repeatedly." The word baptizo (and baptisma) in the New Testament is "used absolutely, \'to administer the rite of ablution,\' \'to baptize\'" (same place). It is "an immersion in water, performed as a sign of the removal of sin," etc. (same place);" Baptizo, to dip in or under water" (Liddell and Scott, Greek Lexicon).<P>2. Triple Action:<P>The threefold immersion is based upon the Trinity into which the believer is to be baptized "into the name of the Father and of the Son and of the Holy Spirit" (eis to onoma tou patros kal tou huiou kai tou hagiou pneumatos, <a onClick="return mV(\'Mat\',28,19);">Mt 28:19</a>). (On the genuineness of this passage see Plummer, Commentary on Matthew.)<P>II. Doctrinal Argument.<P>Whether Jesus spoke the words of <a onClick="return mV(\'Mat\',28,19);">Mt 28:19</a> as a baptismal formula or not does not affect the question. The passages in Acts, "in the name of Jesus Christ" (<a onClick="return mV(\'Act\',2,38);">2:38</A>; <a onClick="return mV(\'Act\',10,48);">10:48</A>), and "in the name of the Lord Jesus" (<a onClick="return mV(\'Act\',8,16);">8:16</A>; <a onClick="return mV(\'Act\',19,5);">19:5</A>), are not baptismal formulas, but mean the confession of Christ with all that Christ stands for, namely, the fullness of God and His salvation. The idea of the Trinity pervades the New Testament and many of the earliest writings (compare <a onClick="return mV(\'1Cr\',12,\'4-6\');">1Co 12:4-6</a>; <a onClick="return mV(\'2Cr\',13,14);">2Co 13:14</a>; <a onClick="return mV(\'Eph\',2,18);">Eph 2:18</a>; <a onClick="return mV(\'Eph\',3,\'14-17\');">3:14-17</a>; <a onClick="return mV(\'Eph\',4,\'4-6\');">4:4-6</a>; <a onClick="return mV(\'2Th\',2,\'13-15\');">2Th 2:13-15</a>; <a onClick="return mV(\'Hbr\',6,\'4-6\');">Heb 6:4-6</a>; <a onClick="return mV(\'1Jo\',3,23,27);">1Joh 3:23,24</a>; <a onClick="return mV(\'1Jo\',4,2);">4:2</a>; <a onClick="return mV(\'Jud\',1,20,21);">Jude 1:20,21</a>; <a onClick="return mV(\'Rev\',1,4,5);">Re 1:4,5</a>). "Baptized into Christ" has the same religious content as <a onClick="return mV(\'Mat\',28,19);">Mt 28:19</a>. Triune immersion is the symbol of baptism into the Triune God. All believers in the Trinity should see the consistency of this symbol. Baptism is the symbol<P>(1) of a complete cleansing,<P>(2) of death,<P>(3) of burial,<P>(4) of resurrection, and<P>(5) of entering into full union and fellowship with the Triune God as revealed by Christ.<P>Triune immersion is the only symbol that symbolizes all that baptism stands for. Note the words of Sanday on <a onClick="return mV(\'Rom\',6,\'1-14\');">Ro 6:1-14</a> (comm. on Romans, ICC, 153): "Baptism has a double function:<P>(1) It brings the Christian into personal contact with Christ, so close that it may fitly be described as personal union with Him.<P>(2) It expresses symbolically a series of acts corresponding to the redeeming acts of Christ. Immersion = Death. Submersion = Burial (the ratification of Death). Emergence = Resurrection. All these the Christian has to undergo in a moral and spiritual sense, and by means of his union with Christ." Hence, the psychological need of a true symbol, triune immersion, to teach and impress the significance of the new life.<P>III. Historical Practice.<P>1. The Jews: The Jews received proselytes by circumcision, baptism (complete immersion) and sacrifice (Schurer, HJP, II,2,pp. 319f; Edersheim, LTJM, II,745,and I, 273). John the Baptist, baptized "in the river Jordan" (<a onClick="return mV(\'Mat\',3,6);">Mt 3:6</a>) and "in AEnon near to Salim, because there was much water there" (<a onClick="return mV(\'Jhn\',3,23);">Joh 3:23</a>).<P>2. John the Baptist:<P>Philip and the eunuch "both went down into the water" and they "came up out of the water." All New Testament baptisms were by immersion (see also <a onClick="return mV(\'Rom\',6,\'1-11\');">Ro 6:1-11</a>).<P>3. The Didache:<P>The Didache (100-150 AD) chapter vii: "Baptize into the name of the Father and of the Son and of the Holy Spirit in living (running) water. But if they have not living water, baptize into other water; and if thou canst not in cold, in warm" (baptisate eis to onoma tou patos kai tou huiou kai tou hagiou pneumatos en hudati zonti). "But if thou have not either, pour out water thrice (tris) upon the head into the name of the Father and Son and Holy Spirit." Here the triple action is maintained throughout, even in clinical baptism, while immersion is the rule.<P>Justin Martyr (Apology i.61) describes baptism which can only be understood as triune immersion.<P>4. Justin Martyr:<P>Tertullian (De Corona, iii) says, "Hereupon we are thrice immersed" (dehinc ter mergitamur). Again (Ad Praxeam, xxvi), "And lastly he commands them to baptize into the Father and the Son and the Holy Spirit, not into a unipersonal God.<P>5. Tertullian:<P>And indeed it is not only once but three times that we are immersed into the Three Persons, at each several mention of their names" (nam nec semel, sed ter, ad singula nomina, in personas singulos, tinguimur).<P>6. Eunomius:<P>Eunomius (circa 360) introduced single immersion "into the death of Christ." This innovation was condemned. Apostolical Constitutions,50,says, "If any presbyter or bishop does not perform the one initiation with three immersions, but with giving one immersion only into the death of the Lord, let him be deposed." Single immersion was allowed by Gregory the Great (circa 691) to the church in Spain in opposition to the Arians who used a trine (not triune) immersion (Epis., i.43). This was exceptional.<P>7. Greek Church:<P>The Greek church has always baptized by triune immersion. The historical practice of the Christian church may well be summed up in the words of Dean Stanley: "There can be no question that the original form of baptism—the very meaning of the word—was complete immersion in the deep baptismal waters; and that for at least four centuries, any other form was either unknown, or regarded, unless in the case of dangerous illness, as an exceptional, almost monstrous case....A few drops of water are now the western substitute for the threefold plunge into the rushing river or the wide baptisteries of the East" (History of Eastern Church, 28). "For the first three centuries the most universal practice of baptism was...that those who were baptized, were plunged, submerged, immersed into the water" (Christian Institutions, p. 21).<P>See further, <a href="./study/isbe/search.html?string=BAPTISM">BAPTISM</A>; <a href="./study/isbe/search.html?string=LITERATURE,+SUB-APOSTOLIC">LITERATURE, SUB-APOSTOLIC</A>, II, 5.<P>LITERATURE.<P>James Quinter, Triune Immersion as the Apostolic Form of Christian Baptism; C. F. Yoder, God\'s Means of Grace, Brethren Pub. House, Elgin, Ill., U.S.A.; Smith, Dict. of Christian Antiquities; Hastings, ERE; Bible Dicts.; Church Fathers; Church Histories, and Histories of Baptism.``92';
isbe[8926]='Trinity, 1`trin\'-i-ti<P>1. The Term "Trinity"<P>2. Purely a Revealed Doctrine<P>3. No Rational Proof of It<P>4. Finds Support in Reason<P>5. Not Clearly Revealed in the Old Testament<P>6. Prepared for in the Old Testament<P>7. Presupposed Rather Than Inculcated in the New Testament<P>8. Revealed in Manifestation of Son and Spirit<P>9. Implied in the Whole New Testament<P>10. Conditions the Whole Teaching of Jesus<P>11. Father and Son in Johannine Discourses<P>12. Spirit in Johannine Discourses<P>13. The Baptismal Formula<P>14. Genuineness of Baptismal Formula<P>15. Paul\'s Trinitarianism<P>16. Conjunction of the Three in Paul<P>17. Trinitarianism of Other New Testament Writers<P>18. Variations in Nomenclature<P>19. Implications of "Son" and "Spirit"<P>20. The Question of Subordination<P>21. Witness of the Christian Consciousness<P>22. Formulation of the Doctrine<P>LITERATURE<P><hr />1. The Term "Trinity":<P>The term "Trinity" is not a Biblical term, and we are not using Biblical language when we define what is expressed by it as the doctrine that there is one only and true God, but in the unity of the Godhead there are three coeternal and coequal Persons, the same in substance but distinct in subsistence. A doctrine so defined can be spoken of as a Biblical doctrine only on the principle that the sense of Scripture is Scripture. And the definition of a Biblical doctrine in such un-Biblical language can be justified only on the principle that it is better to preserve the truth of Scripture than the words of Scripture. The doctrine of the Trinity lies in Scripture in solution; when it is crystallized from its solvent it does not cease to be Scriptural, but only comes into clearer view. Or, to speak without figure, the doctrine of the Trinity is given to us in Scripture, not in formulated definition, but in fragmentary allusions; when we assemble the disjecta membra into their organic unity, we are not passing from Scripture, but entering more thoroughly into the meaning of Scripture. We may state the doctrine in technical terms, supplied by philosophical reflection; but the doctrine stated is a genuinely Scriptural doctrine.<P>2. Purely a Revealed Doctrine:<P>In point of fact, the doctrine of the Trinity is purely a revealed doctrine. That is to say, it embodies a truth which has never been discovered, and is indiscoverable, by natural reason. With all his searching, man has not been able to find out for himself the deepest things of God. Accordingly, ethnic thought has never attained a Trinitarian conception of God, nor does any ethnic religion present in its representations of the divine being any analogy to the doctrine of the Trinity.<P>Triads of divinities, no doubt, occur in nearly all polytheistic religions, formed under very various influences. Sometimes, as in the Egyptian triad of Osiris. Isis and Horus, it is the analogy of the human family with its father, mother and son which lies at their basis. Sometimes they are the effect of mere syncretism, three deities worshipped in different localities being brought together in the common worship of all. Sometimes, as in the Hindu triad of Brahma, Vishnu and Shiva, they represent the cyclic movement of a pantheistic evolution, and symbolize the three stages of Being, Becoming and Dissolution. Sometimes they are the result apparently of nothing more than an odd human tendency to think in threes, which has given the number three widespread standing as a sacred number (so H. Usener). It is no more than was to be anticipated, that one or another of these triads should now and again be pointed to as the replica (or even the original) of the Christian doctrine of the Trinity. Gladstone found the Trinity in the Homeric mythology, the trident of Poseidon being its symbol. Hegel very naturally found it in the Hindu Trimurti, which indeed is very like his pantheizing notion of what the Trinity is. Others have perceived it in the Buddhist Triratna (Soderblom); or (despite their crass dualism) in some speculations of Parseeism; or, more frequently, in the notional triad of Platonism (e.g. Knapp); while Jules Martin is quite sure that it is present in Philo\'s neo-Stoical doctrine of the "powers," especially when applied to the explanation of Abraham\'s three visitors. Of late years, eyes have been turned rather to Babylonia; and H. Zimmern finds a possible forerunner of the Trinity in a Father, Son, and Intercessor, which he discovers in its mythology. It should be needless to say that none of these triads has the slightest resemblance to the Christian doctrine of the Trinity. The Christian doctrine of the Trinity embodies much more than the notion of "threeness," and beyond their "threeness" these triads have nothing in common with it.<P>3. No Rational Proof of It:<P>As the doctrine of the Trinity is indiscoverable by reason, so it is incapable of proof from reason. There are no analogies to it in Nature, not even in the spiritual nature of man, who is made in the image of God. In His trinitarian mode of being, God is unique; and, as there is nothing in the universe like Him in this respect, so there is nothing which can help us to comprehend Him. Many attempts have, nevertheless, been made to construct a rational proof of the Trinity of the God head. Among these there are two which are particularly attractive, and have therefore been put forward again and again by speculative thinkers through all the Christian ages. These are derived from the implications, in the one case, of self-consciousness; in the other, of love. Both self-consciousness and love, it is said, demand for their very existence an object over against which the self stands as subject. If we conceive of God as self-conscious and loving, therefore, we cannot help conceiving of Him as embracing in His unity some form of plurality. From this general position both arguments have been elaborated, however, by various thinkers in very varied forms.<P>The former of them, for example, is developed by a great 17th-century theologian—Bartholomew Keckermann (1614)—as follows: God is self-conscious thought; and God\'s thought must have a perfect object, existing eternally before it; this object to be perfect must be itself God; and as God is one, this object which is God must be the God that is one. It is essentially the same argument which is popularized in a famous paragraph (section 73) of Lessing\'s The Education of the Human Race. Must not God have an absolutely perfect representation of Himself—that is, a representation in which everything that is in Him is found? And would everything that is in God be found in this representation if His necessary reality were not found in it? If everything, everything without exception, that is in God is to be found in this representation, it cannot, therefore, remain a mere empty image, but must be an actual duplication of God. It is obvious that arguments like this prove too much. If God\'s representation of Himself, to be perfect, must possess the same kind of reality that He Himself possesses, it does not seem easy to deny that His representations of everything else must possess objective reality. And this would be as much as to say that the eternal objective coexistence of all that God can conceive is given in the very idea of God; and that is open pantheism. The logical flaw lies in including in the perfection of a representation qualities which are not proper to representations, however perfect. A perfect representation must, of course, have all the reality proper to a representation; but objective reality is so little proper to a representation that a representation acquiring it would cease to be a representation. This fatal flaw is not transcended, but only covered up, when the argument is compressed, as it is in most of its modern presentations, in effect to the mere assertion that the condition of self-consciousness is a real distinction between the thinking subject and the thought object, which, in God\'s case, would be between the subject ego and the object ego. Why, however, we should deny to God the power of self-contemplation enjoyed by every finite spirit, save at the cost of the distinct hypostatizing of the contemplant and the contemplated self, it is hard to understand. Nor is it always clear that what we get is a distinct hypostatization rather than a distinct substantializing of the contemplant and contemplated ego: not two persons in the Godhead so much as two Gods. The discovery of the third hypostasis—the Holy Spirit—remains meanwhile, to all these attempts rationally to construct a Trinity in the Divine Being, a standing puzzle which finds only a very artificial solution.<P>The case is much the same with the argument derived from the nature of love. Our sympathies go out to that old Valentinian writer—possibly it was Valentinus himself—who reasoned—perhaps he was the first so to reason—that "God is all love," "but love is not love unless there be an object of love." And they go out more richly still to Augustine, when, seeking a basis, not for a theory of emanations, but for the doctrine of the Trinity, he analyzes this love which God is into the triple implication of "the lover," "the loved" and "the love itself," and sees in this trinary of love an analogue of the Triune God. It requires, however, only that the argument thus broadly suggested should be developed into its details for its artificiality to become apparent. Richard of Victor works it out as follows: It belongs to the nature of amor that it should turn to another as caritas. This other, in God\'s case, cannot be the world; since such love of the world would be inordinate. It can only be a person; and a person who is God\'s equal in eternity, power and wisdom. Since, however, there cannot be two divine substances, these two divine persons must form one and the same substance. The best love cannot, however, confine itself to these two persons; it must become condilectio by the desire that a third should be equally loved as they love one another. Thus love, when perfectly conceived, leads necessarily to the Trinity, and since God is all He can be, this Trinity must be real. Modern writers (Sartorius, Schoberlein, J. Muller, Liebner, most lately R. H. Grutzmacher) do not seem to have essentially improved upon such a statement as this. And after all is said, it does not appear clear that God\'s own all-perfect Being could not supply a satisfying object of His all-perfect love. To say that in its very nature love is self-communicative, and therefore implies an object other than self, seems an abuse of figurative language.<P>Perhaps the ontological proof of the Trinity is nowhere more attractively put than by Jonathan Edwards. The peculiarity of his presentation of it lies in an attempt to add plausibility to it by a doctrine of the nature of spiritual ideas or ideas of spiritual things, such as thought, love, fear, in general. Ideas of such things, he urges, are just repetitions of them, so that he who has an idea of any act of love, fear, anger or any other act or motion of the mind, simply so far repeats the motion in question; and if the idea be perfect and complete, the original motion of the mind is absolutely reduplicated. Edwards presses this so far that he is ready to contend that if a man could have an absolutely perfect idea of all that was in his mind at any past moment, he would really, to all intents and purposes, be over again what he was at that moment. And if he could perfectly contemplate all that is in his mind at any given moment, as it is and at the same time that it is there in its first and direct existence, he would really be two at that time, he would be twice at once: "The idea he has of himself would be himself again." This now is the case with the Divine Being. "God\'s idea of Himself is absolutely perfect, and therefore is an express and perfect image of Him, exactly like Him in every respect....But that which is the express, perfect image of God and in every respect like HIm is God, to all intents and purposes, because there is nothing wanting: there is nothing in the Deity that renders it the Deity but what has something exactly answering to it in this image, which will therefore also render that the Deity." The Second Person of the Trinity being thus attained, the argument advances. "The Godhead being thus begotten of God\'s loving (having?) an idea of Himself and showing forth in a distinct Subsistence or Person in that idea, there proceeds a most pure act, and an infinitely holy and sacred energy arises between the Father and the Son in mutually loving and delighting in each other....The Deity becomes all act, the divine essence itself flows out and is as it were breathed forth in love and joy. So that the Godhead therein stands forth in yet another manner of Subsistence, and there proceeds the Third Person in the Trinity, the Holy Spirit, namely, the Deity in act, for there is no other act but the act of the will." The inconclusiveness of the reasoning lies on the surface. The mind does not consist in its states, and the repetition of its states would not, therefore, duplicate or triplicate it. If it did, we should have a plurality of Beings, not of Persons in one Being. Neither God\'s perfect idea of Himself nor His perfect love of Himself reproduces Himself. He differs from His idea and His love of Himself precisely by that which distinguishes His Being from His acts. When it is said, then, that there is nothing in the Deity which renders it the Deity but what has something answering to it in its image of itself, it is enough to respond—except the Deity itself. What is wanting to the image to make it a second Deity is just objective reality.<P>4. Finds Support in Reason:<P>Inconclusive as all such reasoning is, however, considered as rational demonstration of the reality of the Trinity, it is very far from possessing no value. It carries home to us in a very suggestive way the superiority of the Trinitarian conception of God to the conception of Him as an abstract monad, and thus brings important rational support to the doctrine of the Trinity, when once that doctrine has been given us by revelation. If it is not quite possible to say that we cannot conceive of God as eternal self-consciousness and eternal love, without conceiving Him as a Trinity, it does seem quite necessary to say that when we conceive Him as a Trinity, new fullness, richness, force are given to our conception of Him as a self-conscious, loving Being, and therefore we conceive Him more adequately than as a monad, and no one who has ever once conceived Him as a Trinity can ever again satisfy himself with a monadistic conception of God. Reason thus not only performs the important negative service to faith in the Trinity, of showing the self-consistency of the doctrine and its consistency with other known truth, but brings this positive rational support to it of discovering in it the only adequate conception of God as self-conscious spirit and living love. Difficult, therefore, as the idea of the Trinity in itself is, it does not come to us as an added burden upon our intelligence; it brings us rather the solution of the deepest and most persistent difficulties in our conception of God as infinite moral Being, and illuminates, enriches and elevates all our thought of God. It has accordingly become a commonplace to say that Christian theism is the only stable theism. That is as much as to say that theism requires the enriching conception of the Trinity to give it a permanent hold upon the human mind—the mind finds it difficult to rest in the idea of an abstract unity for its God; and that the human heart cries out for the living God in whose Being there is that fullness of life for which the conception of the Trinity alone provides. 5. Not Clearly Revealed in the Old Testament:<P>So strongly is it felt in wide circles that a Trinitarian conception is essential to a worthy idea of God, that there is abroad a deep-seated unwillingness to allow that God could ever have made Himself known otherwise than as a Trinity. From this point of view it is inconceivable that the Old Testament revelation should know nothing of the Trinity. Accordingly, I. A. Dorner, for example, reasons thus: "If, however—and this is the faith of universal Christendom—a living idea of God must be thought in some way after a Trinitarian fashion, it must be antecedently probable that traces of the Trinity cannot be lacking in the Old Testament, since its idea of God is a living or historical one." Whether there really exist traces of the idea of the Trinity in the Old Testament, however, is a nice question. Certainly we cannot speak broadly of the revelation of the doctrine of the Trinity in the Old Testament. It is a plain matter of fact that none who have depended on the revelation embodied in the Old Testament alone have ever attained to the doctrine of the Trinity. It is another question, however, whether there may not exist in the pages of the Old Testament turns of expression or records of occurrences in which one already acquainted with the doctrine of the Trinity may fairly see indications of an underlying implication of it. The older writers discovered intimations of the Trinity in such phenomena as the plural form of the divine name \'Elohim, the occasional employment with reference to God of plural pronouns ("Let us make man in our image," <a onClick="return mV(\'Gen\',1,26);">Ge 1:26</a>; <a onClick="return mV(\'Gen\',3,22);">3:22</a>; <a onClick="return mV(\'Gen\',11,7);">11:7</a>; <a onClick="return mV(\'Isa\',6,8);">Isa 6:8</a>), or of plural verbs (<a onClick="return mV(\'Gen\',20,13);">Ge 20:13</a>; <a onClick="return mV(\'Gen\',35,7);">35:7</a>), certain repetitions of the name of God which seem to distinguish between God and God (<a onClick="return mV(\'Gen\',19,27);">Ge 19:27</a>; <a onClick="return mV(\'Psa\',45,6,7);">Ps 45:6,7</a>; <a onClick="return mV(\'Psa\',110,1);">110:1</a>; <a onClick="return mV(\'Hsa\',1,7);">Ho 1:7</a>), threefold liturgical formulas (<a onClick="return mV(\'Deu\',16,4);">De 16:4</a>; <a onClick="return mV(\'Num\',6,24,26);">Nu 6:24,26</a>; <a onClick="return mV(\'Isa\',6,3);">Isa 6:3</a>), a certain tendency to hypostatize the conception of Wisdom (<a onClick="return mV(\'Pro\',8,\'1-\');">Pr 8</a>), and especially the remarkable phenomena connected with the appearances of the Angel of Yahweh (<a onClick="return mV(\'Gen\',16,\'2-13\');">Ge 16:2-13</a>; <a onClick="return mV(\'Gen\',22,11,16);">22:11,16</a>; <a onClick="return mV(\'Gen\',31,11,13);">31:11,13</a>; <a onClick="return mV(\'Gen\',48,15,16);">48:15,16</a>; <a onClick="return mV(\'Exd\',3,2,4,5);">Ex 3:2,4,5</a>; <a onClick="return mV(\'Jdg\',13,\'20-22\');">Jud 13:20-22</a>). The tendency of more recent authors is to appeal, not so much to specific texts of the Old Testament, as to the very "organism of revelation" in the Old Testament, in which there is perceived an underlying suggestion "that all things owe their existence and persistence to a threefold cause," both with reference to the first creation, and, more plainly, with reference to the second creation. Passages like <a onClick="return mV(\'Psa\',33,6);">Ps 33:6</a>; <a onClick="return mV(\'Isa\',61,1);">Isa 61:1</a>; <a onClick="return mV(\'Isa\',63,\'9-12\');">63:9-12</a>; <a onClick="return mV(\'Hag\',2,5,6);">Hag 2:5,6</a>, in which God and His Word and His Spirit are brought together, co-causes of effects, are adduced. A tendency is pointed out to hypostatize the Word of God on the one hand (e.g. <a onClick="return mV(\'Gen\',1,3);">Ge 1:3</a>; <a onClick="return mV(\'Psa\',33,6);">Ps 33:6</a>; <a onClick="return mV(\'Psa\',107,20);">107:20</a>; <a onClick="return mV(\'Psa\',119,87);">119:87</a>; <a onClick="return mV(\'Psa\',147,\'15-18\');">147:15-18</a>; <a onClick="return mV(\'Isa\',55,11);">Isa 55:11</a>); and, especially in Ezekiel and the later Prophets, the Spirit of God, on the other (e.g. <a onClick="return mV(\'Gen\',1,2);">Ge 1:2</a>; <a onClick="return mV(\'Isa\',48,16);">Isa 48:16</a>; <a onClick="return mV(\'Isa\',63,10);">63:10</a>; <a onClick="return mV(\'Eze\',2,2);">Eze 2:2</a>; <a onClick="return mV(\'Eze\',8,3);">8:3</a>; <a onClick="return mV(\'Zec\',7,12);">Zec 7:12</a>). Suggestions—in Isaiah for instance (<a onClick="return mV(\'Isa\',7,14);">7:14</A>; <a onClick="return mV(\'Isa\',9,6);">9:6</a>)—of the Deity of the Messiah are appealed to. And if the occasional occurrence of plural verbs and pronouns referring to God, and the plural form of the name \'Elohim, are not insisted upon as in themselves evidence of a multiplicity in the Godhead, yet a certain weight is lent them as witnesses that "the God of revelation is no abstract unity, but the living, true God, who in the fullness of His life embraces the highest variety" (Bavinck). The upshot of it all is that it is very generally felt that, somehow, in the Old Testament development of the idea of God there is a suggestion that the Deity is not a simple monad, and that thus a preparation is made for the revelation of the Trinity yet to come. It would seem clear that we must recognize in the Old Testament doctrine of the relation of God to His revelation by the creative Word and the Spirit, at least the germ of the distinctions in the Godhead afterward fully made known in the Christian revelation. And we can scarcely stop there. After all is said, in the light of the later revelation, the Trinitarian interpretation remains the most natural one of the phenomena which the older writers frankly interpreted as intimations of the Trinity; especially of those connected with the descriptions of tile Angel of Yahweh, no doubt, but also even of such a form of expression as meets us in the "Let us make man in our image" of <a onClick="return mV(\'Gen\',1,26);">Ge 1:26</a>—for surely <a onClick="return mV(\'Gen\',1,27);">1:27</a>: "And God created man in his own image," does not encourage us to take the preceding verse as announcing that man was to be created in the image of the angels. This is not an illegitimate reading of New Testament ideas back into the text of the Old Testament; it is only reading the text of the Old Testament under the illumination of the New Testament revelation. The Old Testament may be likened to a chamber richly furnished but dimly lighted; the introduction of light brings into it nothing which was not in it before; but it brings out into clearer view much of what is in it but was only dimly or even not at all perceived before. The mystery of the Trinity is not revealed in the Old Testament; but the mystery of the Trinity underlies the Old Testament revelation, and here and there almost comes into view. Thus, the Old Testament revelation of God is not corrected by the fuller revelation which follows it, but only perfected, extended and enlarged.<P>6. Prepared for in the Old Testament:<P>It is an old saying that what becomes patent in the New Testament was latent in the Old Testament. And it is important that the continuity of the revelation of God contained in the two Testaments should not be overlooked or obscured. If we find some difficulty in perceiving for ourselves, in the Old Testament, definite points of attachment for the revelation of the Trinity, we cannot help perceiving with great clearness in the New Testament abundant evidence that its writers felt no incongruity whatever between their doctrine of the Trinity and the Old Testament conception of God. The New Testament writers certainly were not conscious of being "setters forth of strange gods." To their own apprehension they worshipped and proclaimed just the God of Israel; and they laid no less stress than the Old Testament itself upon His unity (<a onClick="return mV(\'Jhn\',17,3);">Joh 17:3</a>; <a onClick="return mV(\'1Cr\',8,4);">1Co 8:4</a>; <a onClick="return mV(\'1Ti\',2,5);">1Ti 2:5</a>). They do not, then, place two new gods by the side of Yahweh, as alike with Him to be served and worshipped; they conceive Yahweh as Himself at once Father, Son and Spirit. In presenting this one Yahweh as Father, Son and Spirit, they do not even betray any lurking feeling that they are making innovations. Without apparent misgiving they take over Old Testament passages and apply them to Father, Son and Spirit indifferently. Obviously they understand themselves, and wish to be understood, as setting forth in the Father, Son and Spirit just the one God that the God of the Old Testament revelation is; and they are as far as possible from recognizing any breach between themselves and the Fathers in presenting their enlarged conception of the Divine Being. This may not amount to saying that they saw the doctrine of the Trinity everywhere taught in the Old Testament. It certainly amounts to saying that they saw the Triune God whom they worshipped in the God of the Old Testament revelation, and felt no incongruity in speaking of their Triune God in the terms of the Old Testament revelation. The God of the Old Testament was their God, and their God was a Trinity, and their sense of the identity of the two was so complete that no question as to it was raised in their minds.<P>7. Presupposed Rather Than Inculcated in the New Testament:<P>The simplicity and assurance with which the New Testament writers speak of God as a Trinity have, however, a further implication. If they betray no sense of novelty in so speaking of Him, this is undoubtedly in part because it was no longer a novelty so to speak of Him. It is clear, in other words, that, as we read the New Testament, we are not witnessing the birth of a new conception of God. What we meet with in its pages is a firmly established conception of God underlying and giving its tone to the whole fabric. It is not in a text here and there that the New Testament bears its testimony to the doctrine of the Trinity. The whole book is Trinitarian to the core; all its teaching is built on the assumption of the Trinity; and its allusions to the Trinity are frequent, cursory, easy and confident. It is with a view to the cursoriness of the allusions to it in the New Testament that it has been remarked that "the doctrine of the Trinity is not so much heard as overheard in the statements of Scripture." It would be more exact to say that it is not so much inculcated as presupposed. The doctrine of the Trinity does not appear in the New Testament in the making, but as already made. It takes its place in its pages, as Gunkel phrases it, with an air almost of complaint, already "in full completeness" (vollig fertig), leaving no trace of its growth. "There is nothing more wonderful in the history of human thought," says Sanday, with his eye on the appearance of the doctrine of the Trinity in the New Testament, "than the silent and imperceptible way in which this doctrine, to us so difficult, took its place without struggle—and without controversy—among accepted Christian truths." The explanation of this remarkable phenomenon is, however, simple. Our New Testament is not a record of the development of the doctrine or of its assimilation. It everywhere presupposes the doctrine as the fixed possession of the Christian community; and the process by which it became the possession of the Christian community lies behind the New Testament.<P>8. Revealed in Manifestation of Son and Spirit:<P>We cannot speak of the doctrine of the Trinity, therefore, if we study exactness of speech, as revealed in the New Testament, any more than we can speak of it as revealed in the Old Testament. The Old Testament was written before its revelation; the New Testament after it. The revelation itself was made not in word but in deed. It was made in the incaration of God the Son, and the outpouring of God the Holy Spirit. The relation of the two Testaments to this revelation is in the one case that of preparation for it, and in the other that of product of it. The revelation itself is embodied just in Christ and the Holy Spirit. This is as much as to say that the revelation of the Trinity was incidental to, and the inevitable effect of, the accomplishment of redemption. It was in the coming of the Son of God in the likeness of sinful flesh to offer Himself a sacrifice for sin; and in the coming of the Holy Spirit to convict the world of sin, of righteousness and of judgment, that the Trinity of Persons in the Unity of the Godhead was once for all revealed to men. Those who knew God the Father, who loved them and gave His own Son to die for them; and the Lord Jesus Christ, who loved them and delivered Himself up an offering and sacrifice for them; and the Spirit of Grace, who loved them and dwelt within them a power not themselves, making for righteousness, knew the Triune God and could not think or speak of God otherwise than as triune. The doctrine of the Trinity, in other words, is simply the modification wrought in the conception of the one only God by His complete revelation of Himself in the redemptive process. It necessarily waited, therefore, upon the completion of the redemptive process for its revelation, and its revelation, as necessarily, lay complete in the redemptive process.<P>From this central fact we may understand more fully several circumstances connected with the revelation of the Trinity to which allusion has been made. We may from it understand, for example, why the Trinity was not revealed in the Old Testament. It may carry us a little way to remark, as it has been customary to remark since the time of Gregory of Nazianzus, that it was the task of the Old Testament revelation to fix firmly in the minds and hearts of the people of God the great fundamental truth of the unity of the Godhead; and it would have been dangerous to speak to them of the plurality within this unity until this task had been fully accomplished. The real reason for the delay in the revelation of the Trinity, how
