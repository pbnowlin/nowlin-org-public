 into the temple itself by Paul—which would have been profanation. Hence, their fury against the apostle.<P>How strongly they insisted on the crime which Trophimus was falsely alleged to have committed on that occasion, is seen again in the way in which the orator Tertullus repeated the charge against Paul before the Roman governor Felix, who moreover assayed to profane the temple" (<a onClick="return mV(\'Act\',24,6);">Ac 24:6</a>).<P>3. At Miletus:<P>The third reference to Trophimus is in <a onClick="return mV(\'2Ti\',4,20);">2Ti 4:20</a>, "Trophimus I left at Miletus sick." This final notice shows that he was again—several years after the date indicated in the previous passages—traveling with Paul on one of the missionary journeys which the apostle undertook after being liberated from his first imprisonment in Rome. It is exceedingly difficult, perhaps impossible, to trace the course of the different journeys which Paul now made, as there is no such narrative as is given in Acts for the former journeys, but merely incidental notices of his later travels, in the Pastoral Epistles. In this, the last of all his letters—2 Timothy—Paul indicates various places which he had visited, and also the names of friends who traveled with him on this the last of his apostolic journeys.<P>Among other places, he had visited Miletus, a city on the coast of the province of Asia; and there his old friend Trophimus had been laid down with illness, so severe that he could travel no farther, but Paul left him "at Miletus sick." It is to be noted that Miletus was not far from Ephesus, which was Trophimus\' native city. There would be much intercourse between the two cities (see <a onClick="return mV(\'Act\',17,\'1-\');">Ac 17</a>, where Paul sends for the elders of the church at Ephesus to come to him at Miletus, which they did). Trophimus therefore, in his sickness, could easily reach Ephesus, or his friends from that city could quickly come to him at Miletus, and give him whatever attention and nursing he might require.<P>4. The Description of <a onClick="return mV(\'2Cr\',8,18);">2 Corinthians 8:18</a>:<P>It has been conjectured that Trophimus is to be identified with the person mentioned in <a onClick="return mV(\'2Cr\',8,\'16-24\');">2Co 8:16-24</a>. Paul there speaks in the highest terms of one of his companions—but without giving his name—whom he sent with Titus. Titus and this disciple were evidently those to whose care Paul entrusted the carrying of the Second Epistle to the Corinthians to its destination. The apostle says of this unnamed brother, not only that his praise is in the gospel throughout all the churches, but also that he was chosen by the churches to travel with him, i.e. with Paul, with this grace, i.e. with the contribution of money collected in the Gentile churches for the poor saints in Jerusalem.<P>Now it is certain that at the close of his 3rd missionary journey Paul carried these gifts to Jerusalem ("I came to bring alms to my nation, and offerings," <a onClick="return mV(\'Act\',24,17);">Ac 24:17</a>); and some of the eight friends who accompanied him on the journey (<a onClick="return mV(\'Act\',20,4);">Ac 20:4</a>) were those who had been entrusted by the churches with the safe conveyance of the money. Speaking of these collections, Paul writes (<a onClick="return mV(\'1Cr\',16,\'3-4\');">1Co 16:3-4</a>). "Whomsoever ye shall approve, them will I send with letters to carry your bounty unto Jerusalem: and if it be meet for me to go also, they shall go with me." These conditions were fulfilled, when Paul and his eight friends traveled from Greece to Jerusalem, carrying the money with them. There is therefore certainty that one of the eight is the brother referred to in <a onClick="return mV(\'2Cr\',8,18);">2Co 8:18</a>, whose praise in the gospel was in all the churches, and whom the churches had appointed to travel with Paul for the purpose of carrying the money contribution, and whom Paul had "many times proved earnest in many things" (<a onClick="return mV(\'2Cr\',8,18,19,22);">2Co 8:18,19,22</a>). The eight were Sopater of Berea, Aristarchus and Secundus, both from Thessalonica, Gaius of Derbe, Timothy, Tychicus and Trophimus, both "Asians," and lastly Luke.<P>There is certainly the possibility that the unnamed brother was Trophimus: if not Trophimus, then he was one of the other seven. Of these seven, by the process of elimination, the unnamed brother could only be one of those who traveled with Paul the whole distance as far as Jerusalem, for this was the work which "the brother" had been appointed by the churches to do. Now it is certain that Luke and Trophimus were with him on his arrival in Jerusalem (<a onClick="return mV(\'Act\',21,17,29);">Ac 21:17,29</a>). Therefore the brother whose praise in the gospel was in all the churches may very well have been Trophimus: if not Trophimus, then possibly Luke or Aristarchus. Gaius and Aristarchus are termed "Paul\'s companions in travel" (<a onClick="return mV(\'Act\',19,29);">Ac 19:29</a>); and Aristarchus was afterward with Paul in Palestine, and sailed with him to Rome. It is quite remarkable that the same word, sunekdemos, "companion in travel," is applied to the unnamed brother (<a onClick="return mV(\'2Cr\',8,19);">2Co 8:19</a>), and to Gaius and Aristarchus in <a onClick="return mV(\'Act\',19,29);">Ac 19:29</a>.<P>As the conditions do not seem to be satisfied in Sopater, Secundus or Timothy, the brother so highly commended must have been either Luke or Gaius or Aristarchus or Tychicus or Trophimus.``155';
isbe[8934]='Trough`trof.`<a href="./study/isbe/search.html?string=SHEEP+TENDING">SHEEP TENDING</a>; <a href="./study/isbe/search.html?string=BREAD">BREAD</a>`1';
isbe[8935]='Trow`tro: An obsolete verb meaning "to believe"; compare "trust" and the German trauen. It occurs only in <a onClick="return mV(\'Luk\',17,9);">Lu 17:9</a>, the King James Version "Doth he thank that servant...? I trow not," as a translation of ou doko, "I believe not." The words ou doko, however, are not part of the original text, but are a later gloss to supply an answer to the question, and hence, "I trow not" is omitted by the Revised Version (British and American).``1';
isbe[8936]='Trucebreaker`troos\'-brak-er: The King James Version rendering in <a onClick="return mV(\'2Ti\',3,3);">2Ti 3:3</a> of aspondos, literally, "without a libation." As a libation always accompanied the making of a treaty in Greek lands, the lack implied that no treaty had been made, or, by a natural extension of meaning, could be made. Hence, the word came to mean "implacable" (Revised Version).``1';
isbe[8937]='Trump; Trumpet`trump, trum\'-pet, trum\'pit.`<a href="./study/isbe/search.html?string=MUSIC">MUSIC</a>`1';
isbe[8938]='Trumpets, Feast of`1. Description:<P>In <a onClick="return mV(\'Lev\',23,\'23-25\');">Le 23:23-25</a> the first day (new moon) of the seventh month is set apart as a solemn rest, "a memorial of blowing of trumpets" (the Hebrew leaves "of trumpets" to be understood), signalized further by "a holy convocation," abstinence from work, and the presentation of "an offering made by fire." In <a onClick="return mV(\'Num\',29,\'1-6\');">Nu 29:1-6</a> these directions are repeated, with a detailed specification of the nature of the offering. In addition to the usual daily burnt sacrifices and the special offerings for new moons, there are to be offered one bullock, one ram, and seven he-lambs, with proper meal offerings, together with a he-goat for a sin offering.<P>2. Significance:<P>The significance of the feast lay in the fact that it marked the beginning of the new year according to the older calendar. Originally the "revolution" of the year was reckoned in the fall (<a onClick="return mV(\'Exd\',23,16);">Ex 23:16</a>; <a onClick="return mV(\'Exd\',34,22);">34:22</a>), and the change to the spring never thoroughly displaced the older system. In fact the spring New Year never succeeded in becoming a specially recognized feast, and to Jewish ears "New Year\'s Day" (ro\'sh ha-shanah) invariably signifies an autumnal festival. So the Mishna (Ro\'sh ha-shanah, i.1): "There are four periods of commencement of years: On the 1st of Nisan is a new year for kings and for festivals; the 1st of Elul is a new year for the tithe of cattle....The 1st of Tishri is new year\'s (day) for the ordinary or civil year, for the computation of 7th years, and of the jubilees; also for the planting of trees, and for herbs. On the 1st of Shebat is the new year for trees."<P>3. Ritual:<P>The ritual for the day consequently needs little explanation. All new moons were heralded by trumpeting (<a onClick="return mV(\'Num\',10,10);">Nu 10:10</a>), and so the custom was of course observed on this feast also. There is nothing in the language of either <a onClick="return mV(\'Lev\',23,\'1-\');">Le 23</a> or <a onClick="return mV(\'Num\',29,\'1-\');">Nu 29</a> to require a prolongation of the music on this special new moon, but its special distinction was no doubt marked by special trumpeting at all times, and at a later period (see below) elaborate rules were laid down for this feature. The additional sacrifices simply involved an increase of those prescribed for new moons (<a onClick="return mV(\'Num\',28,\'11-15\');">Nu 28:11-15</a>), without changing their type. Perhaps <a onClick="return mV(\'Psa\',81,\'1-\');">Ps 81</a> was especially written for this feast (compare <a onClick="return mV(\'Psa\',81,3);">81:3</a>).<P>4. Origin:<P>Mentions of a special observance of the 1st of Tishri are found also in <a onClick="return mV(\'Eze\',45,20);">Eze 45:20</a> (reading, as is necessary, "first day of seventh month" here for "seventh day") and <a onClick="return mV(\'Neh\',8,\'1-12\');">Ne 8:1-12</a>. In the former passage, the day is kept by offering a bullock as a sin offering and sprinkling its blood in a way that recalls the ritual of the Day of Atonement. In Nehemiah an assembly of the people was held to hear Ezra read the Law. The day was kept as a festival on which mourning was forbidden (<a onClick="return mV(\'Neh\',8,9);">Ne 8:9</a>). Apart from these references there is no mention of the feast elsewhere in the Old Testament, and, indeed, there is some reason to think that at one time the 10th, and not the 1st, of Tishri was regarded as the beginning of the year. For <a onClick="return mV(\'Eze\',40,1);">Eze 40:1</a> specifically calls this day ro\'sh hashanah, and <a onClick="return mV(\'Lev\',25,9);">Le 25:9</a> specifies it as the opening of the Jubilee year (contrast the Mishna passage, above). Consequently scholars generally are inclined to assign <a onClick="return mV(\'Lev\',23,\'23-25\');">Le 23:23-25</a> and <a onClick="return mV(\'Num\',29,\'1-6\');">Nu 29:1-6</a> to the latest part of the Pentateuch (Ps). This need not mean that the observance of the 1st (or 10th) of Tishri was late, but only that the final adoption of the day into Israel\'s official calendar, with a fixed ritual for all Israelites, was delayed. If the original New Year\'s Day fell on the 10th of Tishri, its displacement ten days earlier was certainly due to the adoption of the 10th for the Day of Atonement. An explanation of the date of the latter feast would be gained by this supposition.<P>5. Later History:<P>The instrument to be used in the trumpeting is not specified in the Bible, but Jewish tradition decided in favor of the horn and not the metal trumpet, permitting for synagogue use any kind of horn except a cow\'s, but for temple use only a straight (antelope\'s) horn and never a crooked (ram\'s) horn (Ro\'-sh ha-shanah, iii. 2-4). According to iv. 1, when the new year began on a Sabbath the horns were blown only in the temple, but after its destruction they were blown in every synagogue. Every Israelite was obliged to come within hearing distance of the sound (iii.7). In the synagogue liturgy of iv.5-9 (which forms the basis of the modern Jewish practice), four sets of "benedictions" were read, and after each of the last three sets the horn blown nine times. Modern Judaism sees in the signals a call to self-examination and repentance, in view of the approaching Day of Atonement.`<a href="./study/isbe/search.html?string=TRUMPET">TRUMPET</a>`48';
isbe[8939]='Trust, Breach of`The clearest reference to the crime designated by this modern expression is found in <a onClick="return mV(\'Lev\',6,\'2-7\');">Le 6:2-7</a>, where the transgression is defined and the penalty set forth. Breach of covenant or contract and the removal of landmarks (<a onClick="return mV(\'Deu\',19,14);">De 19:14</a>; <a onClick="return mV(\'Deu\',27,17);">27:17</a>; <a onClick="return mV(\'Pro\',22,28);">Pr 22:28</a>; <a onClick="return mV(\'Pro\',23,10);">23:10</a>) may be included.`<a href="study/isbe/search.html?string=CRIMES">CRIMES</A>`1';
isbe[8940]='Truth`trooth (\'emeth, emunah, primary idea of "firmness," "stability" (compare <a onClick="return mV(\'Exd\',17,12);">Ex 17:12</a>), hence "constancy," "faithfulness," etc.; the Septuagint\'s Apocrypha and the New Testament, aletheia (<a onClick="return mV(\'Rom\',3,7);">Ro 3:7</a>), pistis (<a onClick="return mV(\'Rom\',3,3);">Ro 3:3</a>); in adjectival and adverbial sense, "in truth," "of a truth," "faithful," etc.; alethos (<a onClick="return mV(\'Luk\',21,3);">Lu 21:3</a>; <a onClick="return mV(\'Jhn\',6,14);">Joh 6:14</a>; <a onClick="return mV(\'Jhn\',7,40);">7:40</a>; <a onClick="return mV(\'1Th\',2,13);">1Th 2:13</a>); alethinos (<a onClick="return mV(\'Jhn\',17,3);">Joh 17:3</a>); ontos (<a onClick="return mV(\'1Cr\',14,25);">1Co 14:25</a>); pistos (<a onClick="return mV(\'1Ti\',3,1);">1Ti 3:1</a>); in the King James Version; the Revised Version (British and American), the American Standard Revised Version, as generally, "faithful"; Anglo-Saxon: treow, tryw with Teutonic stem, trau-," to believe," "to keep faith"):<P><b>I. TERMS</b><P><b>II. GENERAL VIEW</b><P class="in15">1. Aspects of Truth<P class="in30">(1) Ontological<P class="in30">(2) Logical<P class="in30">(3) Moral<P class="in30">(4) Religious<P class="in15">2. Standards of Truth<P class="in15">3. Special Features in Biblical Writings<P><b>III. ANALYTICAL SUMMARY</b><P class="in15">1. Truth in God<P class="in15">2. Truth in Man<P class="in15">3. Truth in Religion<hr /><P>I. Terms.<P>The English word has developed and maintained the broadest, most general and varied usage, going beyond both Hebrew and Greek, which were already extended in connotation. It is possible to analyze and classify the special applications of the term almost indefinitely, using other terms to indicate specific meanings in special connections, e.g. loyalty (<a onClick="return mV(\'Jdg\',9,15);">Jud 9:15</a>); honesty (<a onClick="return mV(\'Exd\',18,21);">Ex 18:21</a>); fidelity (<a onClick="return mV(\'Deu\',32,4);">De 32:4</a>); justice (<a onClick="return mV(\'Rom\',2,2);">Ro 2:2</a>); uprightness (<a onClick="return mV(\'Isa\',38,3);">Isa 38:3</a>); faith (<a onClick="return mV(\'Isa\',26,2);">Isa 26:2</a>); righteousness (<a onClick="return mV(\'Psa\',85,10);">Ps 85:10</a>); reality (<a onClick="return mV(\'Jhn\',17,19);">Joh 17:19</a>); veracity (<a onClick="return mV(\'Gen\',42,16);">Ge 42:16</a>). It is unfortunate that translators have generally adhered to single terms to represent the original words. On the other hand, they have sometimes introduced words not represented in the original, and thus unduly limited the meaning. An example is <a onClick="return mV(\'Eph\',4,15);">Eph 4:15</a>, where the original meaning "being true," i.e. in all respects, is narrowed to "speaking the truth."<P>II. General View.<P>No term is more familiar and none more difficult of definition.<P>With applications in every phase of life and thought the word has varying general senses which may be classified as:<P>1. Aspects of Truth:<P>(1) Ontological<P>Ontological truth, i.e. accurate and adequate idea of existence as ultimate reality. In this sense it is a term of metaphysics, and will be differently defined according to the type of philosophical theory accepted. This aspect of truth is never primary in Scripture unless in the question of Pilate (<a onClick="return mV(\'Jhn\',18,38);">Joh 18:38</a>). He had so far missed the profound ethical sense in which Jesus used the word that Jesus did not at all answer him, nor, indeed, does Pilate seem to have expected any reply to what was probably only the contemptuous thrust of a skeptical attitude. In Proverbs where, if at all, we might look for the abstract idea, we find rather the practical apprehension of the true meaning and method of life (<a onClick="return mV(\'Pro\',23,23);">23:23</a>). Ontological reality and possible ideas of reality apprehending it are obviously presupposed in all Scripture. There is objective reality on which subjective ideas depend for their validity; and all knowing is knowledge of reality. There is also in the whole of Scripture a subjective idea, the product of revelation or inspiration in some form of working, that constitutes an ideal to be realized objectively. The Kingdom of God, for example, is the formative idea of Scripture teaching. In a definite sense the kingdom exists and still it is to be created. It must be kept in mind, however, that only vaguely and indirectly does truth have abstract, meta-physical meaning to the Biblical writers. For John it approaches this, but the primary interest is always concrete.<P>(2) Logical<P>Logical truth is expressive of the relation between the knower and that which is known, and depends upon the arrangement of ideas with reference to a central or composite idea. Truth in this sense involves the correspondence of concepts with facts. While this meaning of truth is involved in Scripture, it is not the primary meaning anywhere, save in a practical religious application, as in <a onClick="return mV(\'Eph\',4,21);">Eph 4:21</a>; <a onClick="return mV(\'1Jo\',2,4,21);">1Joh 2:4,21</a>.<P>(3) Moral<P>Moral truth is correspondence of expression with inner conception. Taken in its full meaning of correspondence of idea with fact, of expression with thought and with intention, of concrete reality with ideal type, this is the characteristic sense of the word in the Scriptures. Here the aim of religion is to relate man to God in accordance with truth. In apprehension man is to know God and His order as they are in fact and in idea. In achievement, man is to make true in his own experience the idea of God that is given to him. Truth is thus partly to be apprehended and partly to be produced. The emphatically characteristic teaching of Christianity is that the will to produce truth, to do the will of God, is the requisite attitude for apprehending the truth. This teaching of Jesus in <a onClick="return mV(\'Jhn\',7,17);">Joh 7:17</a> is in accord with the entire teaching of the Bible. <a onClick="return mV(\'Eph\',1,18);">Eph 1:18</a> suggests the importance of right attitude for learning, while <a onClick="return mV(\'Eph\',4,18);">4:18</A> shows the effect of a wrong attitude in ignorance of vital truth.<P>(4) Religious<P>Religious truth is a term frequently met in modern literature, but it has no sound basis in reason and it has none at all in the Bible. All truth is ultimately religious and only in a superficial way can religious truth be spoken of as an independent conception. Least of all can religious truth and scientific truth be at variance.<P>2. Standards of Truth:<P>Philosophy has continuously tried to find tests for truth, and so has wrought out theories of knowledge—epistemologies, Not to go back into the Greek philosophy, we have in modern times such theories as (1) the Kantian, (2) the scholastic, (3) the Hegelian, (4) the pragmatic, (5) that of the "new realism"; and these include only such as may be defined with some clearness, for the tendencies of current thought have been toward confusion concerning all standards of truth and reality, and so toward widespread agnosticism and skepticism. This temper has, naturally, reacted on thinking in practical ethics and upon the sanctions of religion. There is thus in religion and morals a tendency to obscure the distinction between what is and what ought to be.<P>See <a href="./study/isbe/search.html?string=AUTHORITY">AUTHORITY</A>; <a href="./study/isbe/search.html?string=ETHICS">ETHICS</A>; <a href="./study/isbe/search.html?string=PHILOSOPHY">PHILOSOPHY</A>; <a href="./study/isbe/search.html?string=RIGHT">RIGHT</A>; <a href="./study/isbe/search.html?string=RIGHT">SIN</A>.<P>In the Bible, the known will of God is final for man as a standard of truth, not as arbitrary, but as expressive of God\'s nature. God\'s nature is all-comprehensive of fact and goodness, and so is, all and in all, the source, support and objective of all concrete being. The will of God thus reveals, persuades to and achieves the ideals and ends of complete existence. The term "truth" is sometimes, therefore, nearly equivalent to the revealed will of God.<P>3. Special Features in Biblical Writings:<P>(1) The Old Testament uses the term "truth" primarily of God and applies the principle to man. The practical objective is ever prominent.<P>(2) The Synoptic Gospels and Acts use the term chiefly in popular idiomatic phrases "of a truth," "in truth," "surely" (compare <a onClick="return mV(\'Luk\',22,59);">Lu 22:59</a>; <a onClick="return mV(\'Act\',4,27);">Ac 4:27</a>). In <a onClick="return mV(\'Mat\',22,16);">Mt 22:16</a> there is a more serious and comprehensive application, but it is in the flattering words of Pharisaic hypocrisy (compare <a onClick="return mV(\'Mar\',12,14);">Mr 12:14</a>; <a onClick="return mV(\'Luk\',20,21);">Lu 20:21</a>). To be sure, we are to understand that even in the phrases of common speech Jesus employed the term in all seriousness (<a onClick="return mV(\'Luk\',4,25);">Lu 4:25</a>; <a onClick="return mV(\'Luk\',9,27);">9:27</a>).<P>(3) In Paul the sense of divine faithfulness, as in the Old Testament, is occasionally met (<a onClick="return mV(\'Rom\',3,3,7);">Ro 3:3,7</a>; <a onClick="return mV(\'Rom\',15,8);">15:8</a>). Again the term emphasizes sincerity (<a onClick="return mV(\'1Cr\',5,8);">1Co 5:8</a>; <a onClick="return mV(\'2Cr\',7,14);">2Co 7:14</a>). Generally it has direct or clearly implied reference to God\'s revelation in Jesus Christ with a view to redeeming men. In a general way the term is thus equivalent to the gospel, but there is never identification of the two terms (see <a onClick="return mV(\'Rom\',2,8);">Ro 2:8</a>; <a onClick="return mV(\'Eph\',1,13);">Eph 1:13</a>; <a onClick="return mV(\'1Ti\',3,15);">1Ti 3:15</a>). In <a onClick="return mV(\'Gal\',2,5);">Ga 2:5</a>; <a onClick="return mV(\'Gal\',5,7);">5:7</a>, "the truth of the gospel" is its content in the purpose of God, in contrast with misconceptions of it: the true gospel as against false representations of the gospel.<P>(4) In the Johannine writings we find occasionally the emphatic phrase of genuineness (<a onClick="return mV(\'1Jo\',3,18);">1Joh 3:18</a>; <a onClick="return mV(\'2Jo\',1,1);">2Joh 1:1</a>; <a onClick="return mV(\'3Jo\',1,1);">3Joh 1:1</a>) and emphatic reality (<a onClick="return mV(\'Jhn\',8,46);">Joh 8:46</a>; <a onClick="return mV(\'Jhn\',16,7);">16:7</a>). In Revelation we have "true" in the sense of trustworthy, because ultimately real or in accord with ultimate reality (<a onClick="return mV(\'Rev\',3,7,14);">3:7,14</a>; <a onClick="return mV(\'Rev\',6,10);">6:10</a>; <a onClick="return mV(\'Rev\',15,3);">15:3</A>; <a onClick="return mV(\'Rev\',19,9,11);">19:9,11</a>, etc.). Generally, as in the Gospel, we approach more nearly than elsewhere in Scripture a metaphysical use, yet always with the practical religious end dominant. Truth is reality in relation to the vital interests of the soul. It is primarily something to be realized and done, rather than something to be learned or known. In the largest aspect it is God\'s nature finding expression in His creation, in revelation, in Jesus Christ in whom "grace and truth came" (<a onClick="return mV(\'Jhn\',1,17);">Joh 1:17</a>), and finally in man apprehending, accepting and practically realizing the essential values of life, which are the will of God (<a onClick="return mV(\'Jhn\',1,14);">Joh 1:14</a>; <a onClick="return mV(\'Jhn\',8,32);">8:32</a>; <a onClick="return mV(\'Jhn\',17,19);">17:19</a>; <a onClick="return mV(\'Jhn\',18,37);">18:37</a>f; <a onClick="return mV(\'1Jo\',2,21);">1Joh 2:21</a>; <a onClick="return mV(\'1Jo\',3,19);">3:19</a>). Truth is personalized in Jesus Christ. He truly expresses God, presents the true ideal of man, in Himself summarizes the harmony of existence and becomes the agent for unifying the disordered world. Hence, He is the Truth (<a onClick="return mV(\'Jhn\',14,6);">Joh 14:6</a>), the true expression (Logos, <a onClick="return mV(\'Jhn\',1,1);">Joh 1:1</a>) of God. See the same idea without the terminology in Paul (<a onClick="return mV(\'Col\',1,14);">Col 1:14</a>ff; <a onClick="return mV(\'Col\',2,9);">2:9</a>). Similarly, the Holy Spirit is the Spirit of truth because His function is to guide into all truth (<a onClick="return mV(\'Jhn\',16,13);">Joh 16:13</a>; <a onClick="return mV(\'1Jo\',2,27);">1Joh 2:27</a>; <a onClick="return mV(\'1Jo\',5,7);">5:7</a>).<P>(5) It is understood by many that in James, Peter, Hebrews, and possibly the Pastoral Epistles, the term connotes "the body of Christian teaching" (compare <a onClick="return mV(\'Jam\',1,18);">Jas 1:18</a>; <a onClick="return mV(\'Jam\',3,14);">3:14</a>; <a onClick="return mV(\'1Pe\',1,22);">1Pe 1:22</a>; <a onClick="return mV(\'2Pe\',2,2);">2Pe 2:2</a>; <a onClick="return mV(\'Hbr\',10,26);">Heb 10:26</a>; <a onClick="return mV(\'1Ti\',3,15);">1Ti 3:15</a>). The use of the article here cannot be conclusive, and instead of "the body of Christian teaching," it seems more correct to understand the reality of life values as represented in the gospel plan of salvation and of living. In a general way this would include "the body of Christian teaching," but the reference would be less concrete. James is too early a writing to employ the term in this so specific a sense.<P>III. Analytical Summary.<P>1. Truth in God:<P>(1) Truth is presented in Scripture as a chief element in the nature of God (<a onClick="return mV(\'Psa\',31,5);">Ps 31:5</a>; <a onClick="return mV(\'Isa\',65,16);">Isa 65:16</a>).<P>(2) But this quality is never given as an abstract teaching, but only as qualifying God in His relations and activities. So it is a guaranty of constancy (<a onClick="return mV(\'Deu\',32,4);">De 32:4</a>; <a onClick="return mV(\'Psa\',100,5);">Ps 100:5</a>; <a onClick="return mV(\'Psa\',146,6);">146:6</a>; <a onClick="return mV(\'Jam\',1,17);">Jas 1:17</a>); especially a ground of confidence in His promises (<a onClick="return mV(\'Exd\',34,6);">Ex 34:6</a>; <a onClick="return mV(\'Psa\',91,4);">Ps 91:4</a>; <a onClick="return mV(\'Psa\',146,6);">146:6</a>); of right dealing with men without reference to any explicit pledges (<a onClick="return mV(\'Psa\',85,11);">Ps 85:11</a>; <a onClick="return mV(\'Psa\',89,14);">89:14</a>); a basis of security in the correctness of His teachings (<a onClick="return mV(\'Neh\',9,13);">Ne 9:13</a>; <a onClick="return mV(\'Psa\',119,142);">Ps 119:142</a>; <a onClick="return mV(\'Isa\',25,1);">Isa 25:1</a>); of assurance within His covenant relations (<a onClick="return mV(\'Psa\',89,5);">Ps 89:5</a>; <a onClick="return mV(\'Isa\',55,3);">Isa 55:3</a>).<P>(3) God\'s truth is especially noteworthy as a guaranty of merciful consideration of men. This is an important element in theology of the Old Testament, as it is a point guarded also in the New Testament (<a onClick="return mV(\'Psa\',25,10);">Ps 25:10</a>; <a onClick="return mV(\'Psa\',31,5);">31:5</a>; <a onClick="return mV(\'Psa\',61,7);">61:7</a>; <a onClick="return mV(\'Psa\',85,10);">85:10</a>; <a onClick="return mV(\'Psa\',98,3);">98:3</a>; <a onClick="return mV(\'Jhn\',3,16);">Joh 3:16</a>; <a onClick="return mV(\'Rom\',3,\'23-26\');">Ro 3:23-26</a>).<P>(4) Equally is the truth of God an assurance to men of righteous judgment in condemnation of sin and sinners (<a onClick="return mV(\'1Sa\',15,29);">1Sa 15:29</a>; <a onClick="return mV(\'Psa\',96,13);">Ps 96:13</a>; <a onClick="return mV(\'Rom\',2,2,8);">Ro 2:2,8</a>). In general the truth of God stands for the consistency of His nature and guarantees His full response in all the relations of a universe of which He is the Maker, Preserver, and End.<P>2. Truth in Man:<P>As related to God in origin and obligation, man is bound morally to see and respond to all the demands of his relations to God and to the order in which he lives under God.<P>(1) Truthfulness in speech, and also in the complete response of his nature to the demand upon it, is urged as a quality to be found in man and is commended where found, as its lack is condemned. It is essential to true manhood. Here, as in the case of truth in God, truth is regarded as revealed in social relations and responsibilities. Truth is not merely in utterance, nor is it only response to a specific command or word, but lies in the response of the will and life to the essential obligations of one\'s being (<a onClick="return mV(\'Psa\',15,2);">Ps 15:2</a>; <a onClick="return mV(\'Psa\',119,30);">119:30</a>; <a onClick="return mV(\'Pro\',12,19);">Pr 12:19</a>; <a onClick="return mV(\'Pro\',23,23);">23:23</a>; <a onClick="return mV(\'Isa\',59,4,14,15);">Isa 59:4,14,15</a>; <a onClick="return mV(\'Jer\',7,28);">Jer 7:28</a>; <a onClick="return mV(\'Jer\',9,3);">9:3</a>; <a onClick="return mV(\'Hsa\',4,1);">Ho 4:1</a>; <a onClick="return mV(\'Rom\',1,18,25);">Ro 1:18,25</a>; <a onClick="return mV(\'Eph\',4,15);">Eph 4:15</a>; <a onClick="return mV(\'2Th\',2,10,12);">2Th 2:10,12</a>).<P>(2) Truth in man is in response to truth in God, and is to be acquired on the basis of a gift from God. This gift comes by way of teaching and also by way of the working of the Divine Spirit in the life of man. Highest truth in correspondence to ideal is possible only by the working of "the God of truth" in the spirit of the man. Man\'s freedom to realize his being is dependent upon his receptive attitude toward the Son of God. Hence salvation in its fullest idea is stated in terms of truth (<a onClick="return mV(\'Jhn\',11,3);">Joh 11:3</a>; <a onClick="return mV(\'Phl\',3,10);">Php 3:10</a>ff). See in general, <a onClick="return mV(\'Psa\',51,6);">Ps 51:6</a>; <a onClick="return mV(\'Isa\',25,1);">Isa 25:1</a>; <a onClick="return mV(\'Jhn\',3,21);">Joh 3:21</a>; <a onClick="return mV(\'Jhn\',8,32);">8:32</a>; <a onClick="return mV(\'Jhn\',16,13);">16:13</a>; <a onClick="return mV(\'Jhn\',17,19);">17:19</a>; <a onClick="return mV(\'Jhn\',18,37);">18:37</a>; <a onClick="return mV(\'Eph\',4,21,24);">Eph 4:21,24</a>; <a onClick="return mV(\'Eph\',5,9);">5:9</a>; <a onClick="return mV(\'Hbr\',10,26);">Heb 10:26</a>; <a onClick="return mV(\'1Jo\',2,27);">1Joh 2:27</a>.<P>3. Truth in Religion:<P>The modern study of religion on an evolutionary hypothesis and the comparative study of religions have contributed to an extensive questioning whether there is any absolute truth in religion, or at least any standards by which truth in religion may be known. <a onClick="return mV(\'Isa\',43,1);">Isa 43</a> and 44 and Paul in <a onClick="return mV(\'Act\',17,\'1-\');">Ac 17</a> and <a onClick="return mV(\'Gal\',3,\'1-\');">Ga 3</a> accord with modern findings that there is an element of truth in religions generally, and that God\'s faithfulness pledges Him to bring the light of fuller truth to all men. This He does through the religion and the testimony of them to whom He has already come with this fuller light. This light is contained in the revealed word of the Old Testament prophets and of the New Testament witnesses to Jesus. In a definite way the Scriptures preserve these standards of religious truth. But always the attitude of the individual, as also of the group, determines the measure of apprehension of the truth and the certainty with which it is held. It is always important to keep in mind that truth in religion is not primarily an intellectualistic affair, to be cognized, but is essentially a voluntaristic experience and a duty to be done for the glory of God in the realization of the complete truth of God. Jesus Christ as the truth of God becomes the standard and test for truth in the religion of men. And this not in any objective and formal way of a series of propositions, to be accepted and contended for, but in the subjective way of experience, in a series of ideals to be realized and propagated. If anyone wishes to do God\'s will, he shall be able to decide the truth of religious teaching, and the Son who is true will give the freedom of truth (<a onClick="return mV(\'Jhn\',7,17);">Joh 7:17</a>; <a onClick="return mV(\'Jhn\',8,32);">8:32</a>).``21';
isbe[8941]='Tryphaena`tri-fe\'-na (Truphaina; the King James Version, Tryphena): Tryphaena is coupled with "Tryphosa"—among those members of the Christian community at Rome to whom Paul sends greetings (<a onClick="return mV(\'Rom\',16,12);">Ro 16:12</a>). He describes them as those "who labor in the Lord." "The names, which might be rendered \'Dainty\' and \'Disdain\' (see <a onClick="return mV(\'Jam\',5,5);">Jas 5:5</a>; <a onClick="return mV(\'Isa\',66,11);">Isa 66:11</a>), are characteristically pagan, and unlike the description" (Denney). They were probably sisters or near relatives, for "it was usual to designate members of the same family by derivatives of the same root" (Lightfoot, Phil, 175). Both names are found in inscriptions connected with the imperial household, "Tryphosa" occurring more frequently than "Tryphaena."``78';
isbe[8942]='Tryphon`tri\'-fon (Truphon): The surname of Diodotus, a usurper of the Syrian throne. He was a native of Apamea, and had been in the service of Alexander Balas. On the death of Balas (145 BC), Tryphon, taking advantage of the complaints of discontent among the troops of Demetrius II (Nicator), set up the younger son of Balas, Antiochus VI, as claimant to the throne against Demetrius (1Macc 11:39). The Jews under Jonathan came to the assistance of Demetrius in his difficulties against his revolting subjects. But Demetrius, when confirmed on his throne, soon made it apparent that he did not intend to fulfill his promises to his Jewish allies (1Macc 11:53). Consequently, Jonathan and Simon joined Tryphon and Antiochus VI, securing many advantages for their country (1Macc 11:54ff). Jonathan inflicted a severe defeat on the forces of Demetrius. The successes of the Jewish leaders awakened the jealousy and suspicion of Tryphon, who determined to thwart the further plans of Jonathan and to remove him as an obstacle in the way of his securing the crown for himself. By an act of shrewd treachery, Tryphon captured Jonathan at Ptolemais and butchered all his followers (1Macc 12:48). Simon, brother of Jonathan, now undertook the conduct of affairs and thwarted Tryphon in his attempts upon Jerusalem, whereupon the latter murdered Jonathan at Bascama (1Macc 13:1ff) in 143 BC. Tryphon next murdered the young Antiochus VI (1Macc 13:31) and claimed the throne of Syria for himself (143 BC) (but see the chronology as given in Schurer, HJP, 4th edition, I, 172). Simon now went over to the side of Demetrius on condition that Judea should be free from tribute to Syria—a privilege that was rather in the power of Tryphon than of Demetrius to give, and so "in the 170th year (143 BC) was the yoke of the heathen taken away from Israel" (1Macc 13:41). In 138 BC Demetrius was captured by Mithridates I (Arsaces), king of Parthia (1Macc 14:2). His brother, Antiochus VII (Sidetes), continued the struggle against Tryphon, first with the aid of Simon, but later repudiating it. Tryphon was obliged to flee before Sidetes to Dor (1Macc 15:11), where Antiochus refused the assistance of Simon (1Macc 15:26). He next escaped to Ptolemais, then to Orthosia, and finally to his native Apamea, where he was driven to suicide (Josephus, Ant, XIII, vii, 2; Strabo, 668; Appian, Syriac, 68). (The best account is given in Schurer, 4th edition, I, 172ff; compare also Speaker\'s Commentary in the place cited.)`<a href="./study/isbe/search.html?string=ANTIOCHUS">ANTIOCHUS</a>; <a href="./study/isbe/search.html?string=DEMETRIUS">DEMETRIUS</a>`5';
isbe[8943]='Tryphosa`tri-fo\'-sa (Truphosa): Greetings are sent by Paul to "Tryphaena and Tryphosa, who labor in the Lord" (<a onClick="return mV(\'Rom\',16,12);">Ro 16:12</a>).`<a href="./study/isbe/search.html?string=TRYPHAENA">TRYPHAENA</a>`1';
isbe[8944]='Tsadhe`tsa-tha\' ("ts"): The eighteenth letter of the Hebrew alphabet, and as such employed in <a onClick="return mV(\'Psa\',119,1);">Ps 119</a> to designate the 18th part, every verse of which begins with this letter. It is transliterated in this Encyclopedia as "ts". It came also to be used for the number 90.`<a href="./study/isbe/search.html?string=ALPHABET">ALPHABET</a>; <a href="./study/isbe/search.html?string=TSADHE">TSADHE</a>`1';
isbe[8945]='Tubal`tu\'-bal (tubhal, tubhal; Septuagint Thobel, Codex Alexandrinus in <a onClick="return mV(\'Eze\',39,1);">Eze 39:1</a>, Thober): As the text stands, Tubal and Meshech are always coupled, except in <a onClick="return mV(\'Isa\',66,19);">Isa 66:19</a> (Massoretic Text) and <a onClick="return mV(\'Psa\',120,5);">Ps 120:5</a>. In the former passage Tubal is yoked with Javan; in the latter Meshech occurs in <a onClick="return mV(\'Psa\',120,5);">120:5</a> and Kedar in <a onClick="return mV(\'Psa\',120,6);">120:6</A>. In <a onClick="return mV(\'Gen\',10,2);">Ge 10:2</a> parallel, they are sons of Japheth. In Ezekiel (<a onClick="return mV(\'Eze\',27,3);">27:13</a>) the two are mentioned as exporters of slaves and copper, as a warlike people of antiquity (<a onClick="return mV(\'Eze\',32,26);">32:26</a>), in the army of Gog (<a onClick="return mV(\'Eze\',38,2);">38:2</a>ff; <a onClick="return mV(\'Eze\',39,1);">39:1</a>). Josephus identifies them with the Iberians and Cappadocians respectively; but they are most probably the Tibarenoi, and Moschoi, first mentioned in Herodotus iii.94 as belonging to the 19th satrapy of Darius, and again (vii.78) as furnishing a contingent to the host of Xerxes. Equally obvious is their identity with the Tabali and Muski of the Assyrian monuments, where the latter is mentioned as early as Tiglath-pileser I, and the former under Shalmaneser II; both are described as powerful military states. They appear together in Sargon\'s inscriptions; and during this entire period their territory must have extended much farther south and west than in Greek-Roman times. They are held (Winckler and Jeremias) to have been remnants of the old Hittite population which were gradually driven (probably by the Cimmerian invasion) to the mountainous district southeast of the Black Sea.``197';
isbe[8946]='Tubal-Cain`tu\'-bal-kan (tubhal qayin): One of the sons of Lamech (<a onClick="return mV(\'Gen\',4,22);">Ge 4:22</a>). He is a brother of Jabal and Jubal, who appear to have been the founders of several industries and articles The text (lotesh kol choresh nechosheth u-bharzel) has been the cause of endless dispute. Holzinger and Gunkel hold that latash was a marginal gloss to charash, and that, as in <a onClick="return mV(\'Gen\',4,20,21);">Ge 4:20 and 21</a>, there stood before kal originally hu hayah \'abhi. This would make Tubal-cain the founder of the metal industry, and place him in a class similar to that of his brothers. The Septuagint, however, has no equivalent of qayin. This omission leads Dillmann, Wellhausen, and others to the position that "Tubal" originally stood alone, and qayin, being a later addition, was translated "smith." Many commentators identify Tubal with the Assyrian Tubal, a people living southwest of the Black Sea; in later times they were called "Tibareni" (<a onClick="return mV(\'Eze\',27,13);">Eze 27:13</a>). Tubal may be the eponymous ancestor of these people, whose principal industry seems to have been the manufacture of vessels of bronze and iron.``197';
isbe[8947]='Tubias`tu\'-bi-as (en tois Tobiou; the King James Version "in the places of Tobie," the Revised Version (British and American) "in the land of Tubias"): A place in Gilead where 1,000 men of the Jews were slaughtered by the Gentiles, their wives and children being carried away captive (1Macc 5:13). It is identified with the land of <a href="./study/isbe/search.html?string=TOB">TOB</a> (which see).``1';
isbe[8948]='Tubieni`tu-bi-e\'-ni (pros tous legomenous Toubienous Ioudaious, "unto the Jews that are called Tubieni"): Men of <a href="./study/isbe/search.html?string=TOB">TOB</a> (which see) who had occupied the town of Charax (2Macc 12:17).``1';
isbe[8949]='Tumor`tu\'-mer, tu\'-mor (\'ophel): the Revised Version (British and American) substitutes this word for "emerods" in <a onClick="return mV(\'1Sa\',5,12);">1Sa 5:12</a>; <a onClick="return mV(\'1Sa\',6,4);">6:4</a>; <a onClick="return mV(\'Deu\',28,27);">De 28:27</a> margin.`<a href="./study/isbe/search.html?string=EMERODS">EMERODS</a>`1';
isbe[8950]='Turban`tur\'-ban (<a onClick="return mV(\'Lev\',16,4);">Le 16:4</a> margin).`<a href="./study/isbe/search.html?string=DRESS+V">DRESS, V</a>`1';

isbe[8959]='Twilight`twi\'-lit (nesheph): The twilight of Palestine is of short duration, owing to the low latitude, there being scarcely more than an hour between sunset and complete darkness. It is a distinct boundary between daytime and the darkness. The people of Palestine still give the time of an event as so many hours before or after sunrise or sunset: "David smote them from the twilight even unto the evening of the next day" (<a onClick="return mV(\'1Sa\',30,17);">1Sa 30:17</a>), and "They rose up in the twilight to go" (<a onClick="return mV(\'2Ki\',7,5);">2Ki 7:5</a>). The word is evidenly used in the sense of darkness in "the stars of twilight" (<a onClick="return mV(\'Job\',3,9);">Job 3:9</a>) and "The adulterer waiteth for the twilight" (<a onClick="return mV(\'Job\',24,15);">Job 24:15</a>). the King James Version has "twilight" in <a onClick="return mV(\'Eze\',12,6);">Eze 12:6</a>ff, but the Revised Version (British and American) has "dark."``85';

isbe[8961]='Twine`twin (shazar, "to be twined"): The word is used in <a onClick="return mV(\'Exd\',26,1);">Ex 26:1</a>ff; <a onClick="return mV(\'Exd\',36,8);">36:8</a>ff, etc., of the "fine twined linen" used for the curtains and hangings of the tabernacle, and for parts of the priests\' dress. It denotes linen the finely spun threads of which consisted of two or more smaller threads twined together.`<a href="./study/isbe/search.html?string=LINEN">LINEN</a>; <a href="./study/isbe/search.html?string=TABERNACLE">TABERNACLE</a>`1';

isbe[8963]='Tychicus`tik\'-i-kus (Tuchikos, lit. "chance"): Mentioned 5 times in the New Testament (<a onClick="return mV(\'Act\',20,4);">Ac 20:4</a>; <a onClick="return mV(\'Eph\',6,21);">Eph 6:21</a>; <a onClick="return mV(\'Col\',4,7);">Col 4:7</a>; <a onClick="return mV(\'2Ti\',4,12);">2Ti 4:12</a>; <a onClick="return mV(\'Tts\',3,12);">Tit 3:12</a>); an Asiatic Christian, a friend and companion of the apostle Paul.<P>(1) In the first of these passages his name occurs as one of a company of the friends of Paul. The apostle, at the close of his 3rd missionary journey, was returning from Greece through Macedonia into Asia, with a view to go to Jerusalem. This journey proved to be the last which he made, before his apprehension and imprisonment. It was felt, both by himself and by his friends, that this journey was a specially important one. He was on his way to Jerusalem, "bound in the spirit" (<a onClick="return mV(\'Act\',20,22);">Ac 20:22</a>). But another cause which gave it particular importance was that he and his friends were carrying the money which had been collected for several years previous in the churches of the Gentiles, for the help of the poor members of the church in Jerusalem (<a onClick="return mV(\'Act\',24,17);">Ac 24:17</a>). No fewer than eight of his intimate friends companied him into Asia, and one of these was Tychicus Luke uses the word "Asian" (English Versions of the Bible "of Asia," <a onClick="return mV(\'Act\',20,4);">Ac 20:4</a>) to describe Tychicus. He was with Paul at Troas, and evidently journeyed with him, as one of "Paul\'s company" (<a onClick="return mV(\'Act\',21,8);">Ac 21:8</a> the King James Version), all the way to Jerusalem.<P>(2) The 2nd and 3rd passages in which the name of Tychicus occurs (see above) give the information that he was with Paul in Rome during his first imprisonment. In Colossians Paul writes, "All my affairs shall Tychicus make known unto you, the beloved brother and faithful minister and fellow-servant in the Lord: whom I have sent unto you for this very purpose, that ye may know our state, and that he may comfort your hearts" (<a onClick="return mV(\'Col\',4,7,8);">4:7,8</a>). In almost identical words he writes in Ephesians, "But that ye also may know my affairs, how I do, Tychicus, the beloved brother and faithful minister in the Lord, shall make known to you all things: whom I have sent unto you for this very purpose, that ye may know our state, and that he may comfort your hearts" (<a onClick="return mV(\'Eph\',6,21,22);">6:21,22</A>).<P>Paul had entrusted Tychicus with a very important mission. He was to deliver the Epistle to the Ephesians, that is, "the circular letter" (see <a href="./study/isbe/search.html?string=LAODICEANS,+EPISTLE+TO+THE">LAODICEANS, EPISTLE TO THE</a>) to the churches in proconsular Asia, to which it was sent, giving a copy of it to the church in Laodicea. He was then to proceed to Colosse, with the Epistle to the church there. In Colosse Tychicus would plead the cause of Onesimus, who accompanied him from Rome. "Under his shelter Onesimus would be safer than if he encountered Philemon alone" (Lightfoot, Commentary on Colossians, 314). In Laodicea and Colosse Tychicus would not only deliver the Epistles from Paul, but he would also, as the apostle had written to the churches in those places, Communicate to them all information about his "state," that is, how things were going with him in regard to his appeal to the emperor, and his hope of being soon set at liberty. Tychicus would make known to them all things.<P>(3) The passages in the Epistles to Titus and to Timothy show that Tychicus was again with Paul, after the appeal to the emperor had resulted in the apostle regaining his freedom. The passage in Titus evidently refers to the interval between Paul\'s first and second Roman imprisonments, and while he was again engaged in missionary journeys. The apostle writes to Titus, who was in Crete in charge of the churches there, that he intended to send either Artemas or Tychicus to him, so as to take the oversight of the work of the gospel in that island, that Titus might be free to come to be with the apostle at Nicopolis.<P>(4) The last passage where Tychicus is mentioned occurs in 2 Timothy, which was written in Rome not long before Paul\'s execution. To the very end Paul was busy as ever in the work of the gospel; and though it would have been a comfort to him to have his friends beside him, yet the interests of the kingdom of Christ are uppermost in his thoughts, and he sends these friends to help the progress of the work. To the last, Tychicus was serviceable as ever: "Tychicus I sent to Ephesus" (<a onClick="return mV(\'2Ti\',4,12);">4:12</a>). As Timothy was in charge of the church in Ephesus (<a onClick="return mV(\'1Ti\',1,3);">1Ti 1:3</a>), the coming of Tychicus would set him free, so as to enable him to set off at once to rejoin Paul at Rome, as the apostle desired him (<a onClick="return mV(\'2Ti\',4,9,21);">2Ti 4:9,21</a>).<P>It should also be noted that at Ephesus Tychicus would be able to visit his old friend Trophimus, who was, at that very time, only a few miles away, at Miletus, sick (<a onClick="return mV(\'2Ti\',4,20);">2Ti 4:20</a>).<P>It is possible that Tychicus is the brother referred to in <a onClick="return mV(\'2Cr\',8,22,23);">2Co 8:22,23</a> as one "whom we have many times proved earnest in many things...(one of) the messengers of the churches...the glory of Christ."<P>(5) The character and career of Tychicus are such as show him altogether affectionate, faithful and worthy of the confidence reposed in him by Paul, who, as already seen, sent him again and again on important work, which could be performed only by a man of ability and of high Christian worth and experience. Thus, all that is known regarding Tychicus fully bears out the description of his character given by the apostle himself, that he was a beloved brother, a faithful minister and fellow-servant in the Lord.``155';
isbe[8964]='Type`tip:<P>1. Definition of Type<P>2. Distinctive Features<P>3. Classification of Types<P>4. How Much of the Old Testament Is Typical?<P>LITERATURE<hr /><P>The Bible furnishes abundant evidence of the presence of types and of typical instruction in the Sacred Word. The New Testament attests this fact. It takes up a large number of persons and things and events of former dispensations, and it treats them as adumbrations and prophecies of the future. A generation ago a widespread interest in the study of typology prevailed; latterly the interest has largely subsided, chiefly because of the vagaries and extravagances which attended its treatment on the part of not a few writers. Pressing the typical teaching of Scripture so far as to imperil the historical validity of God\'s word is both dangerous and certain to be followed by reaction and neglect of the subject.<P>1. Definition of Type:<P>The word "type" is derived from a Greek term tupos, which occurs 16 times in the New Testament. It is variously translated in the King James Version, e.g. twice "print" (<a onClick="return mV(\'Jhn\',20,25);">Joh 20:25</a>); twice "figure" (<a onClick="return mV(\'Act\',7,43);">Ac 7:43</a>; <a onClick="return mV(\'Rom\',5,14);">Ro 5:14</a>); twice "pattern" (<a onClick="return mV(\'Tts\',2,7);">Tit 2:7</a>; <a onClick="return mV(\'Hbr\',8,5);">Heb 8:5</a>); once "fashion" (<a onClick="return mV(\'Act\',7,44);">Ac 7:44</a>); once "manner" (<a onClick="return mV(\'Act\',23,25);">Ac 23:25</a>); once "form" (<a onClick="return mV(\'Rom\',6,17);">Ro 6:17</a>); and 7 times "example" (<a onClick="return mV(\'1Cr\',10,6,11);">1Co 10:6,11</a>; <a onClick="return mV(\'Phl\',3,17);">Php 3:17</a>; <a onClick="return mV(\'1Th\',1,7);">1Th 1:7</a>; <a onClick="return mV(\'2Th\',3,9);">2Th 3:9</a>; <a onClick="return mV(\'1Ti\',4,12);">1Ti 4:12</a>; <a onClick="return mV(\'1Pe\',5,3);">1Pe 5:3</a>). It is clear from these texts that the New Testament writers use the word "type" with some degree of latitude; yet one general idea is common to all, namely, "likeness." A person, event or thing is so fashioned or appointed as to resemble another; the one is made to answer to the other in some essential feature; in some particulars the one matches the other. The two are called type and antitype; and the link which binds them together is the correspondence, the similarity, of the one with the other.<P>Three other words in the New Testament express the same general idea. One is "shadow" (skia, <a onClick="return mV(\'Hbr\',10,1);">Heb 10:1</a>), "For the law having a shadow of the good things to come"—as if the substance or reality that was still future cast its shadow backward into the old economy. "Shadow" implies dimness and transitoriness; but it also implies a measure of resemblance between the one and the other.<P>The 2nd term is "parable" (parabole, <a onClick="return mV(\'Hbr\',9,9);">Heb 9:9</a>); the tabernacle with its services was an acted parable for the time then present, adumbrating thus the blessed reality which was to come.<P>The 3rd term is "copy." or "pattern" (hupodeigma), a word that denotes a sketch or draft of something future. invisible (<a onClick="return mV(\'Hbr\',9,23);">Heb 9:23</a>); the tabernacle and its furniture and services were copies, outlines of heavenly things.<P>Types are pictures, object-lessons, by which God taught His people concerning His grace and saving power. The Mosaic system was a sort of kindergarten in which God\'s people were trained in divine things, by which also they were led to look for better things to come. An old writer thus expresses it: "God in the types of the last dispensation was teaching His children their letters. In this dispensation He is teaching them to put the letters together, and they find that the letters, arrange them as they will, spell Christ, and nothing but Christ."<P>In creation the Lord uses one thing for many purposes. One simple instrument meets many ends. For how many ends does water serve! And the atmosphere: it supplies the lungs, conveys sound, diffuses odors, drives ships, supports fire, gives rain, fulfills besides one knows not how many other purposes. And God\'s Word is like His work, is His work, and, like creation, is inexhaustible. Whatever God touches, be it a mighty sun or an insect\'s wing, a vast prophecy or a little type, He perfects for the place and the purpose He has in mind.<P>2. Distinctive Features:<P>What are the distinctive features of a type? A type, to be such in reality, must possess three well-defined qualities.<P>(1) It must be a true picture of the person or the thing it represents or prefigures. A type is a draft or sketch of some well-defined feature of redemption, and therefore it must in some distinct way resemble its antitype, e.g. Aaron as high priest is a rough figure of Christ the Great High Priest, and the Day of Atonement in Israel (<a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a>) must be a true picture of the atoning work of Christ.<P>(2) The type must be of divine appointment. In its institution it is designed to bear a likeness to the antitype. Both type and antitype are preordained as constituent parts of the scheme of redemption. As centuries sometimes lie between the type and its accomplishment in the antitype, of course infinite wisdom alone can ordain the one to be the picture of the other. Only God can make types.<P>(3) A type always prefigures something future. A Scriptural type and predictive prophecy are in substance the same, differing only in form. This fact distinguishes between a symbol and a type. A symbol may represent a thing of the present or of the past as well as of the future, e.g. the symbols in the Lord\'s Supper. A type always looks to the future; an element of prediction must necessarily be in it.<P>3. Classification of Types:<P>Another thing in the study of types should be borne in mind, namely, that a thing in itself evil cannot be the type of what is good and pure. It is somewhat difficult to give a satisfactory classification of Biblical types, but broadly they may be distributed under three heads:<P>(1) Personal types, by which are meant those personages of Scripture whose lives and experiences illustrate some principle or truth of redemption. Such are Adam, who is expressly described as the "figure of him that was to come" (<a onClick="return mV(\'Rom\',5,14);">Ro 5:14</a>), Melchizedek, Abraham, Aaron, Joseph, Jonah, etc.<P>(2) Historical types, in which are included the great historical events that under Providence became striking foreshadowings of good things to come, e.g. the Deliverance from the Bondage of Egypt; the Wilderness Journey; the Conquest of Canaan; the Call of Abraham; Deliverances by the Judges, etc.<P>(3) Ritual types, such as the Altar, the Offerings, the Priesthood, the Tabernacle and its furniture. There are typical persons, places, times, things, actions, in the Old Testament, and a reverent study of them leads into a thorough acquaintance with the fullness and the blessedness of the word of God.<P>4. How Much of the Old Testament Is Typical?:<P>How much of the Old Testament is to be regarded as typical is a question not easily answered. Two extremes, however, should be avoided. First, The extravagance of some of the early Fathers, as Origen, Ambrose, Jerome (revived in our time by Andrew Jukes and his imitators). They sought for types, and of course found them, in every incident and event, however trivial, recorded in Scripture. Even the most simple and commonplace circumstance was thought to conceal within itself the most recondite truth. Mystery and mysticism were seen everywhere, in the cords and pins of the tabernacle, in the yield of herds, in the death of one, in the marriage of another, even in the number of fish caught by the disciples on the night the risen Saviour appeared to them—how much some have tried to make of that number, 153! The very serious objection to this method is, that it wrests Scripture out of the sphere of the natural and the historical and locates it in that of the arbitrary and the fanciful; it tends to destroy the validity and trustworthiness of the record.<P>Second, the undue contraction of the typical element. "Professor Moses Stuart expresses this view as follows: "Just so much of the Old Testament is to be accounted typical as the New Testament affirms to be so, and no more." This opinion assumes that the New Testament writers have exhausted the types of the Old Testament, while the fact is that those found in the later Scripture are but samples taken from the storehouse where many more are found. If they are not, then nothing is more arbitrary than the New Testament use of types, for there is nothing to distinguish them from a multitude of others of the same class. Further, the view assumes that divine authority alone can determine the reality and import of types—a view that applies with equal force against prophecy. This rule may be safely followed: wherever the three characteristics of types are found which have been already mentioned, there is the type.<P>Weighty are the words of one equally eminent for his piety as for his learning: "That the Old Testament is rich in types, or rather forms in its totality one type, of the New Testament, follows necessarily from the entirely unique position which belongs to Christ as the center of the history of the world and of revelation. As we constantly see the principle embodied in the vegetable and animal kingdoms, that the higher species are already typified in a lower stage of development, so do we find, in the domain of saving revelation, the highest not only prepared for, but also shadowed forth, by that which precedes in the lower spheres" (Van Oosterzee).<P>LITERATURE<P>P. Fairbairn, Typology of Scripture, 2 volumes; Angus, The Bible HandBook; Andrew Jukes, Law of Offerings in Leviticus; Mather, Gospel of Old Testament, Explanation of Types; McEwen, Grace and Truth: Types and Figures of the Old Testament; Soltau, Tabernacle, Priesthood and Offerings.``123';
isbe[8965]='Tyrannus`ti-ran\'-us (Turannos): When the Jews of Ephesus opposed Paul\'s teaching in the synagogue, he withdrew, and, separating his followers, reasoned daily in the school of Tyrannus. "This continued for the space of two years" (<a onClick="return mV(\'Act\',19,9,10);">Ac 19:9,10</a>). D Syriac (Western text) adds after Tyrannus (<a onClick="return mV(\'Act\',19,9);">Ac 19:9</a>), "from the 5th hour unto the 10th." Schole is the lecture-hall or teaching-room of a philosopher or orator, and such were to be found m every Greek city. Tyrannus may have been<P>(1) a Greek rhetorician or<P>(2) a Jewish rabbi.<P>(1) This is the common opinion, and many identify him with a certain Tyrannus, a sophist, mentioned by Suidas. Paul would thus appear to be one of the traveling rhetors of the time, who had hired such a hall to proclaim his own peculiar philosophy (Ramsay, Paul the Traveler, 246, 271).<P>(2) Meyer thinks that as the apostle had not passed wholly to the Gentiles, and Jews still flocked to hear him, and also that as Tyrannus is not spoken of as a proselyte (sebomenos ton Theon), this schole is the beth Midrash of a Jewish rabbi. "Paul with his Christians withdrew from the public synagogue to the private synagogue of Tyrannus, where he and his doctrine were more secure from public annoyance" (Meyer in the place cited.).<P>(3) Another view (Overbeck) is that the expression was the standing name of the place after the original owner.``78';
isbe[8966]='Tyre`tir (tsowr. tsor, "rock"\' Turos, "Tyrus"; modern Sur):<P>1. Physical Features:<P>The most noted of the Phoenician cities situated on the coast, lat. 33ø 17 minutes, about 20 miles south of Sidon and about 35 north of Carmel. The date of its foundation is uncertain, but it was later than that of Sidon. It is mentioned in the travels of the Egyptian Mohar, dating probably from the 14th century BC, and in the Tell el-Amarna Letters of about the same period. Herodotus describes the temple of Hercules at Tyre and says it was built 2,300 years before his time, which would carry back the beginning of the city to more than 2700 BC. It was a double city, one part on an island, a short distance from the shore, and the other on the mainland opposite. The island city had two harbors, connected by a canal, one looking north and the other south. The island was rocky and the city was fortitled on the land side by a wall 150 ft. high, the wall being of less elevation on the other sides. It was an exceedingly strong position, and is referred to in the Bible as the "strong" or "fortitled" city (<a onClick="return mV(\'Jos\',19,29);">Jos 19:29</a>). The space within the walls was crowded with buildings, and is said to have contained 40,000 inhabitants. The town on the mainland was situated in a plain extending from the Ras el-\'Abyad, on the south to Sarepta on the north, a distance of about 20 miles. It was fertile and well watered, the river Leontes (Litany) passing through it to the sea, about 5 miles N. of Tyre, and the copious fountain of Ras el-\'Ain, 3 miles to the south, furnishing an abundant supply both for the city and the gardens.<P>2. History:<P>(1) Tyre was for centuries subordinate to Sidon, but when the Philistines subdued the latter city, probably in the 12th century. (see <a href="./study/isbe/search.html?string=SIDON">SIDON</a>), Tyre received an accession of inhabitants from the fugitives which gave it the pre-eminence. From this time dates its great commercial and colonial activity. Its mariners pushed boldly out to the West and founded colonies in Spain and North Africa, some of which, like Gades, Abdera and Carthage, became famous. They extended their commerce more widely than Sidon had ever done and ventured into the Atlantic and reached the coasts of Britain and West Africa. They reached out to the East also, and had their ships in the Red Sea and the Indian Ocean, and their land routes threaded all Western Asia (see <a href="./study/isbe/search.html?string=PHOENICIA">PHOENICIA</a>). Tyre, like all the Phoenician cities, became subject to Egypt under Thothmes III in the first half of the 15th century BC, and remained so for some 300 years, but it enjoyed practical autonomy under native kings, being only subject to tribute and to furnishing contingents of ships when the Egyptian kings made their expeditions to the north. In the Tell el-Amarna Letters, dating from the first half of the 14th century, we find a certain Abi-melek (or Abi-milki) writing from Tyre to the king of Egypt asking for aid against the Amorite leader, Aziru, and the king of Sidon, who had joined the rebels. The name is Phoenician, and we know that it was the policy of the Egyptian kings to leave the native dynasts on the throne.<P>(2) After the decline of Egypt, Tyre regained her independence and exercised the hegemony over most of the Phoenician towns, at least as far north as Gebal (Byblus), as appears in the control that Hiram had over the Lebanon forests in the time of David and Solomon. Hiram was evidently desirous of an alliance with Israel, since he sent messengers to David and furnished cedar and workmen to build him a house, apparently without solicitation. The friendly connection between the two kingdoms was advantageous to both, since David and Solomon needed the timber and the skilled artisans that Hiram could furnish, and Hiram needed the food products of the land of Israel (<a onClick="return mV(\'1Ki\',5,\'1-\');">1Ki 5</a>). Tyre was at this time noted for the skill of its artificers, and its manufactured products were famous throughout the world (see <a href="./study/isbe/search.html?string=PHOENICIA">PHOENICIA, 4)</a>. The purple dye and works in bronze were especially famous, and Hiram, the Tyrian artisan, was engaged by Solomon to cast the bronzes required for the temple (<a onClick="return mV(\'1Ki\',7,13);">1Ki 7:13</a>). Hiram, the king, enlarged and beautified his capital. He united the two small islands on which the city was built by filling up the space between, where he made an open square and built a splendid temple to Melkarth and Astarte. He engaged in commercial enterprises with Solomon (<a onClick="return mV(\'1Ki\',9,\'26-28\');">1Ki 9:26-28</a>; <a onClick="return mV(\'1Ki\',10,22);">10:22</a>), both in pursuance of the friendly alliance and also for the advantage of having the use of the port of Ezion-geber on the Red Sea. His brilliant reign lasted 43 years.<P>(3) The list of kings who succeeded him contains the names of Baal-azar, Abd-ashtoreth, murdered by his brothers, the eldest of whom succeeded him, followed by Astartus and Aserymus murdered by his brother, Pheles, who was overthrown by the high priest Eth-baal, showing how disturbed the period was. Eth-baal, or Ithobal, was the king who made an alliance with Ahab and gave him Jezebel, his daughter, in marriage, which proved most disastrous both to her and the country because of the introduction of the Baal-worship into Israel. Eth-baal was an energetic monarch, and is said to have rounded Botrys (Batrun). He reigned 32 years, and was followed by Badezor and Mattan, who gave his daughter, Elissa (Dido), in marriage to her uncle Sicharbas and transferred the throne to them; but they were set aside by an uprising of the people, and Pygmalion, son of Mattan, was placed on the throne, and Sicharbas put to death. Elissa fled with a party of nobles, by sea, to Africa and founded the city of Carthage. This happened about the middle of the 9th century BC, Josephus putting it at 860 BC.<P>(4) In the first half of this century Tyre became subject to Assyria, and her hegemony in Phoenicia came to an end, but her prosperity was not seriously checked as we may infer from <a onClick="return mV(\'Isa\',23,8);">Isa 23:8</a>, which was written a century or so later. Assyria was satisfied with the payment of tribute until the time of Tiglath-pileser III (745-727), who laid a heavier hand upon her, and this led Elulaeus, king of Tyre, to form a confederacy of the Phoenician cities against Assyria. Shalmaneser IV subdued all except Tyre, which he distressed by cutting off her water-supply. But the people dug wells and obtained enough to subsist upon for five years, when Shalmaneser was killed and Elulaeus recovered control of his territory. He was not molested by Sargon, but Sennacherib advanced against him with 200,000 men, and Elulaeus fled to Cyprus. The citizens made a successful resistance and Sennacherib did not take Tyre, but it submitted to Esar-haddon, and its king, Baal, obtained the special favor of the Assyrian king, who made him ruler of all the coast cities from Dor to Gebal, and the Lebanon was placed under his control (680-673 BC). It is rather surprising that Baal refused to assist him in his attack upon Egypt and that Esar-haddon did not punish him, probably because he was too much occupied with Egypt. Ashur-banipal, however, did compel him to submit and to give him his daughter, and those of his brothers, as secondary wives, but left him as king of Tyre.<P>(5) On the decline of Assyria, Tyre regained its independence, and its greatness is indicated by the fact that it resisted Nebuchadnezzar 13 years (598-585); it is uncertain whether the island city was taken, but it evidently came to terms with the king of Babylon (compare <a onClick="return mV(\'Eze\',27,26);">Eze 27:26</a>; Josephus, Ant, X, xi, 1 and see The Expository Times,1899, pp. 378, 430, 475, 520). After this siege Sidon took the lead and Tyre was in a disturbed state: the monarchy was overthrown and suffetes, or judges, took its place for six years, when the old order was restored. The decline of Babylon enabled Tyre to regain her independence for a short period until its submission to the Persians about 525 BC, and thenceforth it was a vassal state during the continuance of the Persian empire.<P>(6) It was by no means hindered in its commercial prosperity, and its great strength is seen in the brave and energetic resistance it made to Alexander the Great. All Phoenicia submitted to him without resistance, and Tyre was willing to admit his suzerainty, but declined to receive him into the city. This so angered Alexander that he at once commenced a siege that proved the most difficult undertaking in all his wars. He had no fleet and was obliged to build a mole (causeway) from the mainland to the island, but before he could finish it the Tyrians destroyed it and beat back their assailants handily. Alexander had to do the work all over again, and since he was convinced that without a fleet he would not be able to take the city, he procured ships from the Phoenician towns that had submitted, and with the aid of these was able to blockade the port and prevent the besieged from issuing forth to destroy the new causeway. This was at length pushed up to the very wall of the city, which was finally breached, and the troops of Alexander forced their way in. But even then the defenders would not yield, and the king himself had to lead the assault upon them with his bodyguard and put them all to the sword. Those who died with arms in their hands were 8,000, and the survivors, women, children and slaves, to the number of 30,000, were sold in the open market. He placed over the ruined city, into which he introduced some colonists, a certain Abd-elonim, and left it after having spent about seven months in subduing it.<P>(7) After the death of Alexander, Tyre passed into the hands of Ptolemy Lagi, and when Antigonus, in 314 BC, took Phoenicia from him, Tyre resisted, and he had to blockade it 15 months before it would yield, showing how quickly it had recovered from its previous disaster. It became a part of the Seleucid kingdom when Antiochus III drove the Ptolemies from Syria (198 BC), and the Seleucid kings regarded it of importance and gave it the right of asylum, and it was allowed the status of a free city by the Romans, Antony recognizing the magistrates and council of Tyre as allies. When the Parthians attacked and took Syria, in 40 BC, Tyre would not submit and was left untouched, being too strong for them. Augustus deprived it of its freedom, but it was given the status of a "metropolis" by Hadrian, and this title appears on its coins.<P>(8) Tyre is mentioned in the New Testament several times: Christ visited its territory (<a onClick="return mV(\'Mat\',15,21);">Mt 15:21</a>; <a onClick="return mV(\'Mar\',7,24);">Mr 7:24</a>), and people from there came to hear Him (<a onClick="return mV(\'Luk\',6,17);">Lu 6:17</a>). Herod Agrippa I had trouble with Tyre, and a deputation came to visit him at Caesarea (<a onClick="return mV(\'Act\',12,20);">Ac 12:20</a>). Paul visited Tyre on his journey from Asia to Jerusalem (<a onClick="return mV(\'Act\',21,\'6-7\');">Ac 21:6-7</a>).<P>Christianity was accepted by the people of Tyre, so that the 2nd century AD saw a bishopric established there, and in the 4th a council was held there to consider charges against Athanasius, by the party of Arius; he was condemned, a decision which brought the Tyrian church into disrepute. Tyre was already obnoxious to Christians because the anti-Christian philosopher Porphyry was from there. Tyre continued a commercial center, and Jerome says that it was the noblest and most beautiful of the Phoenician cities and an emporium of commerce for almost the whole world (Commentary on Ezekiel). It was of considerable importance in the Crusades and continued so until toward the end of the 13th century, when its trade declined, and it has now dwindled to a town of some 5,000 inhabitants.`<a href="./study/isbe/search.html?string=PHOENICIA">PHOENICIA</a>`138';
isbe[8967]='Tyre, Ladder of`(klimakos Turou): Given. in 1Macc 11:59 as the northern limit of the territory placed under the authority of Simon Thassi the Maccabee by Antiochus VI (Theos), in the year 143 BC. The statement of Josephus (B J, II, x, 2) that it was 100 furlongs north of Ptolemais, and a similar indication of position in the Jerusalem Talmud (Ab Zar 19) lead us to identify it with Ras-en-Naqurah and not with Ras-el-\'Abyad (Promontorium Album of Pliny), as has been done. Here the rugged hills of Upper Galilee descend in bold precipices to the sea and leave no beach between. A natural barrier is thus formed which prevented the histories of Israel and Tyre from ever touching one another except in peaceful relations.``23';
isbe[8968]='Tyropoeon, the`ti-ro-pe\'-on.`<a href="./study/isbe/search.html?string=JERUSALEM">JERUSALEM</a>`1';
