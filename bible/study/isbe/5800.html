isbe[5801]='Marble`mar\'-b\'-l (shayish, shesh, \'abhne shayish, "stones of marble" (<a onClick="return mV(\'1Ch\',29,2);">1Ch 29:2</a>); ritspath bahat wa-shesh we-dhar we-cochareth, "a pavement of red, and white, and yellow, and black marble," or, according to the margin, "a pavement of porphyry, and white marble, and alabaster, and stone of blue color" (<a onClick="return mV(\'Est\',1,6);">Es 1:6</a>); \'ammudhe shesh, "pillars of marble" (<a onClick="return mV(\'Est\',1,6);">Es 1:6</a>; <a onClick="return mV(\'Sgs\',5,15);">So 5:15</a>); compare shesh, the King James Version margin "silk" or the Revised Version (British and American) "fine linen" (<a onClick="return mV(\'Gen\',41,42);">Ge 41:42</a>; <a onClick="return mV(\'Exd\',25,4);">Ex 25:4</a>, etc.); shoshannim, "lilies" (<a onClick="return mV(\'Sgs\',2,16);">So 2:16</a>, etc.), apparently from a root signifying "white"; marmaros, "marble" (<a onClick="return mV(\'Rev\',18,12);">Re 18:12</a>)): Marble is properly crystalline limestone, usually pure white or veined with black, the former being in demand for statuary, while the latter is used in architecture, especially for floors and pillars. True marble is not found in Palestine, but is obtained from Greece or Italy. Much of the stone described as marble is non-crystalline limestone capable of being smoothed and polished. White or yellow stone of this character is abundant in Palestine. Non-crystalline rocks of other colors are also sometimes called marble. In the passage from Esther cited above (compare margin), it is a question whether the reference is to marble and other stones or to marble of different colors. In <a onClick="return mV(\'1Ch\',29,2);">1Ch 29:2</a>, "marble stones" are mentioned among the materials brought together by David for the building of the temple. In <a onClick="return mV(\'Est\',1,6);">Es 1:6</a>, pillars and a pavement of marble are features of the palace of Ahasuerus. In <a onClick="return mV(\'Sgs\',5,15);">So 5:15</a>, the various parts of the body of the "beloved" are likened to gold, beryl, ivory, sapphire, and marble. In <a onClick="return mV(\'Rev\',18,12);">Re 18:12</a>, marble occurs in the list of the merchandise of Babylon. All these references imply a costly stone, and therefore probably one imported from other countries, and make it likely that true crystalline marble is meant.``37';

isbe[5806]='Mardocheus`mar-do-ke\'-us (Mardochaios):<P>(1) One of the Jewish leaders who accompanied Zerubbabel on the return from Babylon to Judah (1Esdras 5:8, where it stands for "Mordecai" of <a onClick="return mV(\'Ezr\',2,2);">Ezr 2:2</a> and <a onClick="return mV(\'Neh\',7,7);">Ne 7:7</a>).<P>(2) Another form of Mordecai, the uncle of Esther (<span class="noTag">Additions to Esther 10:4; 11:2,12; 12:1,4ff; 16:13</span>).``1';
isbe[5807]='Mare`mar<P>(1) cucah, "steed," the King James Version "company of horses"; Septuagint he hippos, "mare" (<a onClick="return mV(\'Sgs\',1,9);">So 1:9</a>);<P>(2) bene ha-rammakhim, "bred of the stud," the King James Version and the Revised Version margin "young dromedaries" (<a onClick="return mV(\'Est\',8,10);">Es 8:10</a>); compare Arabic ramakat, "mare"): The word "mare" does not occur in English Versions of the Bible, but in <a onClick="return mV(\'Sgs\',1,9);">So 1:9</a> we find cucah, the feminine of cuc, "horse," and in <a onClick="return mV(\'Est\',8,10);">Es 8:10</a>, bene ha-rammakhim is by some translated "sons of mares."`<a href="./study/isbe/search.html?string=CAMEL">CAMEL</a>; <a href="./study/isbe/search.html?string=HORSE">HORSE</a>`1';
isbe[5808]='Mareshah`ma-re\'-sha (mareshah; Septuagint: Codex Vaticanus Bathesar; Codex Alexandrinus Maresa): A town in the Shephelah of Judah named with Keilah and Achzib (<a onClick="return mV(\'Jos\',15,44);">Jos 15:44</a>). It occupied such a position that Rehoboam thought well to fortify it for the protection of Jerusalem (<a onClick="return mV(\'2Ch\',11,8);">2Ch 11:8</a>). In the valley of Zephathah at Mareshah, Asa overwhelmed Zerah the Ethiopian and his army, pursuing them as far as Gezer (<a onClick="return mV(\'2Ch\',14,9);">2Ch 14:9</a>). From Mareshah came Eliezer the prophet who denounced disaster upon the commercial copartnery of Jehoshaphat and Ahaziah (<a onClick="return mV(\'2Ch\',20,37);">2Ch 20:37</a>). The place is mentioned in Mic (<a onClick="return mV(\'2Ch\',1,15);">2Ch 1:15</a>). Mareshah was plundered and burned by Judas Maccabeus (Ant., XII, viii, 6; 1Macc 5:66 the Revised Version margin). Hither Gorgias escaped, having been rescued from the hands of Dositheus by a Thracian horseman (2Macc 12:35). It was taken by John Hyrcanus, who allowed the inhabitants to remain on condition that they adopt circumcision and submit to the Jewish law. This they did; and later John avenged an injustice done to Mareshah by the Samaritans. It is then described as "a colony of Jews" (Ant., XIII, ix, 1; x, 2). The city was treated with favor by Pompey (XIV, iv, 4). When the Parthians invaded Judea in support of Antigonus they demolished Mareshah (xiii, 9).<P>According to Eusebius, Onomasticon, Mareshah was 2 Roman miles from Eleutheropolis (Beit Jibrin). Until recently it was thought that Khirbet Mir\'ash, where the old name lingers, not far southwest of Beit Jibrin, represented the ancient city. The work of Dr. Bliss, however ("Excavations in Palestine," PEF), shows that it must be located at Tell Sandachannah, about a mile south of Beit Jibrin. A series of remarkable tombs was discovered here. From <a onClick="return mV(\'1Ch\',2,42);">1Ch 2:42</a> we may perhaps gather that Hebron was colonized by the men of Mareshah.``54';
isbe[5809]='Marimoth`mar\'-i-moth, mar\'-i-moth: An ancestor of Esdras (Ezra) (2Esdras 1:2), identical with Meraioth (<a onClick="return mV(\'Ezr\',7,3);">Ezr 7:3</a>). In 1Esdras 8:2, it appears also as "Memeroth" (the King James Version "Meremoth").``1';

isbe[5812]='Marish`mar\'-ish (gebhe\'; helos): An old form of "marsh," found in the King James Version, the English Revised Version <a onClick="return mV(\'Eze\',47,11);">Eze 47:11</a> (the American Standard Revised Version "marsh"). Some (not all) editions of the King James Version Apocrypha have retained this same spelling in 1Macc 9:42,45 (the Revised Version (British and American) "marsh").``1';
isbe[5813]='Mark`mark: In the King James Version this word is used 22 times as a noun and 26 times as a predicate. In the former case it is represented by 5 Hebrew and 3 Greek words; in the latter by 11 Hebrew and 2 Greek words. As a noun it is purely a physical term, gaining almost a technical significance from the "mark" put upon Cain (<a onClick="return mV(\'Gen\',4,15);">Ge 4:15</a> the King James Version); the stigmata of Christ in Paul\'s body (<a onClick="return mV(\'Gal\',6,17);">Ga 6:17</a>); the "mark of the beast" (<a onClick="return mV(\'Rev\',16,2);">Re 16:2</a>).<P>As a verb it is almost exclusively a mental process: e.g. "to be attentive," "understand ": bin (<a onClick="return mV(\'Job\',18,2);">Job 18:2</a> the King James Version), rightly rendered in the Revised Version (British and American) "consider"; shith, "Mark ye well her bulwarks" (<a onClick="return mV(\'Psa\',48,13);">Ps 48:13</a>), i.e. turn the mind to, notice, regard; shamar, i.e. observe, keep in view; so <a onClick="return mV(\'Psa\',37,37);">Ps 37:37</a>, "Mark the perfect man"; compare <a onClick="return mV(\'Job\',22,15);">Job 22:15</a> the King James Version. This becomes a unique expression in <a onClick="return mV(\'1Sa\',1,12);">1Sa 1:12</a>, where Eli, noticing the movement of Hannah\'s lips in prayer, is said to have "marked her mouth." Jesus "marked" how invited guests chose out (epecho, i.e. "observed") the chief seats (<a onClick="return mV(\'Luk\',14,7);">Lu 14:7</a>); so skopeo (<a onClick="return mV(\'Rom\',16,17);">Ro 16:17</a>; <a onClick="return mV(\'Phl\',3,17);">Php 3:17</a>), "Mark them," i.e. look at, signifying keen mental attention, i.e. scrutinize, observe carefully. The only exceptions to this mental signification of the verb are two verses in the Old Testament: <a onClick="return mV(\'Isa\',44,13);">Isa 44:13</a>, "He marketh it out with a pencil" ("red ochre," the King James Version "line"), and "with the compasses," where the verb is ta\'ar, "to delineate," "mark out"; <a onClick="return mV(\'Jer\',2,22);">Jer 2:22</a>, "Thine iniquity is marked (katham, "cut (i.e. engraved)) before me," signifying the deep and ineradicable nature of sin. It may also be rendered "written," as in indelible hieroglyphics.<P>As a noun the term "mark" may signify, according to its various Hebrew and Greek originals, a sign, "a target" an object of assault, a brand or stigma cut or burnt in the flesh, a goal or end in view, a stamp or imprinted or engraved sign.<P>(1) \'oth, "a sign": <a onClick="return mV(\'Gen\',4,15);">Ge 4:15</a> the King James Version, "The Lord set a mark upon Cain" (the American Standard Revised Version "appointed a sign"). It is impossible to tell the nature of this sign. Delitzsch thinks that the rabbins were mistaken in regarding it as a mark upon Cain\'s body. He considers it rather "a certain sign which protected him from vengeance," the continuance of his life being necessary for the preservation of the race. It was thus, as the Hebrew indicates, the token of a covenant which God made with Cain that his life would be spared.<P>(2) mattara\', "an aim," hence, a mark to shoot at. Jonathan arranged to shoot arrows as at a mark, for a sign to David (<a onClick="return mV(\'1Sa\',20,20);">1Sa 20:20</a>); Job felt himself to be a target for the Divine arrows, i.e. for the Divinely decreed sufferings which wounded him and which he was called to endure (<a onClick="return mV(\'Job\',16,12);">Job 16:12</a>); so Jeremiah, "He hath set me as a mark for the arrow" (<a onClick="return mV(\'Lam\',3,12);">La 3:12</a>); closely akin to this is miphga\', an object of attack (<a onClick="return mV(\'Job\',7,20);">Job 7:20</a>), where Job in bitterness of soul feels that God has become his enemy, and says, \'Why hast thou made me the mark of hostile attack?\'; "set me as a mark for thee."<P>See <a href="./study/isbe/search.html?string=TARGET">TARGET</a>.<P>(3) taw, "mark" (<a onClick="return mV(\'Eze\',9,4,6);">Eze 9:4,6</a>). In Ezekiel\'s vision of the destruction of the wicked, the mark to be set upon the forehead of the righteous, at Yahweh\'s command, was, as in the case of the blood sprinkled on the door-posts of the Israelites (<a onClick="return mV(\'Exd\',12,22,23);">Ex 12:22,23</a>), for their protection. As the servants of God (<a onClick="return mV(\'Rev\',7,2,3);">Re 7:2,3</a>)—the elect—were kept from harm by being sealed with the seal of the living God in their foreheads, so the man clothed in linen, with a writer\'s inkhorn by his side, was told to mark upon their foreheads those whom God would save from judgment by His sheltering grace. Taw also appears (<a onClick="return mV(\'Job\',31,35);">Job 31:35</a>) for the attesting mark made to a document (the Revised Version (British and American) "signature," margin "mark").<P>The equivalent Hebrew letter taw ("t") in the Phoenician alphabet and on the coins of the Maccabees had the form of a cross (T). In oriental synods it was used as a signature by bishops who could not write. The cross, as a sign of ownership, was burnt upon the necks or thighs of horses and camels. It may have been the "mark" set upon the forehead of the righteous in Ezekiel\'s vision.<P>(4) qa\'aqa\', "a stigma" cut or burnt. The Israelites were forbidden (<a onClick="return mV(\'Lev\',19,28);">Le 19:28</a>) to follow the custom of other oriental and heathen nations in cutting, disfiguring or branding their bodies.<P>The specific prohibition "not to print any marks upon" themselves evidently has reference to the custom of tattooing common among savage tribes, and in vogue among both men and women of the lower orders in Arabia, Egypt, and many other lands. It was intended to cultivate reverence for and a sense of the sacredness of the human body, as God\'s creation, known in the Christian era as the temple of the Holy Spirit.<P>See also <a href="./study/isbe/search.html?string=CUTTINGS+IN+THE+FLESH">CUTTINGS IN THE FLESH</A>.<P>(5) skopos, something seen or observed in the distance, hence, a "goal." The Christian life seemed to Paul, in the intensity of his spiritual ardor, like the stadium or race-course of the Greeks, with runners stretching every nerve to reach the goal and win the prize. "I press on toward the goal (the King James Version "mark") unto the prize" (<a onClick="return mV(\'Phl\',3,14);">Php 3:14</a>). The mark or goal is the ideal of life revealed in Christ, the prize, the attainment and possession of that life.<P>In The <span class="noTag">Wisdom of Solomon 5:21</span> "they fly to the mark" is from eustochoi, "with true aim" (so the Revised Version (British and American)).<P>(6) stigma, "a mark pricked or branded upon the body." Slaves and soldiers, in ancient times, were stamped or branded with the name of their master. Paul considered and called himself the bondslave of Jesus Christ. The traces of his sufferings, scourging, stonings, persecution, wounds, were visible in permanent scars on his body (compare <a onClick="return mV(\'2Cr\',11,\'23-27\');">2Co 11:23-27</a>). These he termed the stigmata of Jesus, marks branded in his very flesh as proofs of his devotion to his Master (<a onClick="return mV(\'Gal\',6,17);">Ga 6:17</a>).<P>This passage gives no ground for the Romanist superstition that the very scars of Christ\'s crucifixion were reproduced in Paul\'s hands and feet and side. It is also "alien to the lofty self-consciousness" of these words to find in them, as some expositors do, a contrast in Paul\'s thought to the scar of circumcision.<P>(7) charagma, "a stamp" or "imprinted mark." "The mark of the beast" (peculiar to Revelation) was the badge of the followers of Antichrist, stamped on the forehead or right hand (<a onClick="return mV(\'Rev\',13,16);">Re 13:16</a>; compare <a onClick="return mV(\'Eze\',9,4,6);">Eze 9:4,6</a>). It was symbolic of character and was thus not a literal or physical mark, but the impress of paganism on the moral and spiritual life. It was the sign or token of apostasy. As a spiritual state or condition it subjected men to the wrath of God and to eternal torment (<a onClick="return mV(\'Rev\',14,\'9-11\');">Re 14:9-11</a>); to noisome disease (<a onClick="return mV(\'Rev\',16,2);">Re 16:2</a>); to the lake of fire (<a onClick="return mV(\'Rev\',19,20);">Re 19:20</a>). Those who received not the mark, having faithfully endured persecution and martyrdom, were given part in the first resurrection and lived and reigned with Christ a thousand years (<a onClick="return mV(\'Rev\',20,4);">Re 20:4</a>). The "beast" symbolizes the anti-Christian empires, particularly Rome under Nero, who sought to devour and destroy the early Christians.<P>(8) molops, "bruise," Sirach 23:10 (the Revised Version (British and American) "bruise"); 28:17.``139';
isbe[5814]='Mark, John`mark, John (Ioannes) represents his Jewish, Mark (Markos) his Roman name. Why the latter was assumed we do not know.<P>1. Name and Family: Perhaps the aorist participle in <a onClick="return mV(\'Act\',12,25);">Ac 12:25</a> may be intended to intimate that it dated from the time when, in company with Barnabas and Saul, he turned to service in the great Gentile city of Antioch. Possibly it was the badge of Roman citizenship, as in the case of Paul. The standing of the family would be quite consistent with such a supposition.<P>His mother\'s name was Mary (<a onClick="return mV(\'Act\',12,12);">Ac 12:12</a>). The home is spoken of as hers. The father was probably dead. The description of the house (with its large room and porch) and the mention of the Greek slave, suggest a family of wealth. They were probably among the many zealous Jews who, having become rich in the great world outside, retired to Jerusalem, the center of their nation and faith. Mark was "cousin" to Barnabas of Cyprus (<a onClick="return mV(\'Col\',4,10);">Col 4:10</a>) who also seems to have been a man of means (<a onClick="return mV(\'Act\',4,36);">Ac 4:36</a>). Possibly Cyprus was also Mark\'s former home.<P>2. His History as Known from the New Testament:<P>When first mentioned, Mark and his mother are already Christians (44 AD). He had been converted through Peter\'s personal influence (<a onClick="return mV(\'1Pe\',5,13);">1Pe 5:13</a>) and had already won a large place in the esteem of the brethren, as is shown by his being chosen to accompany Barnabas and Saul to Antioch, a little later. The home was a resort for Christians, so that Mark had every opportunity to become acquainted with other leaders such as James and John, and James the brother of the Lord. It was perhaps from the latter James that he learned the incident of <a onClick="return mV(\'Mar\',3,21);">Mr 3:21</a> which Peter would be less likely to mention.<P>His kinship with Barnabas, knowledge of Christian history and teaching, and proved efficiency account for his being taken along on the first missionary journey as "minister" (huperetes) to Barnabas and Saul (<a onClick="return mV(\'Act\',13,5);">Ac 13:5</a>). Just what that term implies is not clear. Chase (HDB) conjectures the meaning to be that he had been huperetes, "attendant" or chazzan in the synagogue (compare <a onClick="return mV(\'Luk\',4,20);">Lu 4:20</a>), and was known as such an official. Wright (English translation, February, 1910) suggests that he was to render in newly founded churches a teaching service similar to that of the synagogue chazzan. Hackett thought that the kai of this verse implies that he was to be doing the same kind of work as Barnabas and Saul and so to be their "helper" in preaching and teaching. The more common view has been (Meyer, Swete, et al.) that he was to perform "personal service not evangelistic," "official service but not of the menial kind"—to be a sort of business agent. The view that he was to be a teacher, a catechist for converts, seems to fit best all the facts.<P>Why did he turn back from the work (<a onClick="return mV(\'Act\',13,13);">Ac 13:13</a>)? Not because of homesickness, or anxiety for his mother\'s safety, or home duties, or the desire to rejoin Peter, or fear of the perils incident to the journey, but rather because he objected to the offer of salvation to the Gentiles on condition of faith alone. There are hints that Mark\'s family, like Paul\'s, were Hebrews of the Hebrews, and it is not without significance that in both verses (<a onClick="return mV(\'Act\',13,5,13);">Ac 13:5,13</a>) he is given only his Hebrew name. The terms of Paul\'s remonstrance are very strong (<a onClick="return mV(\'Act\',15,38);">Ac 15:38</a>), and we know that nothing stirred Paul\'s feelings more deeply than this very question. The explanation of it all may be found in what happened at Paphos when the Roman Sergius Paulus became a believer. At that time Paul (the change of name is here noted by Luke) stepped to the front, and henceforth, with the exception of <a onClick="return mV(\'Act\',15,12,25);">15:12,25</a>, where naturally enough the old order is maintained, Luke speaks of Paul and Barnabas, not Barnabas and Saul. We must remember that, at that time, Paul stood almost alone in his conviction. Barnabas, even later than that, had misgivings (<a onClick="return mV(\'Gal\',2,13);">Ga 2:13</a>). Perhaps, too, Mark was less able than Barnabas himself to see the latter take second place.<P>We hear nothing further of Mark until the beginning of the second missionary journey 2 years later, when Paul\'s unwillingness to take him with them led to the rupture between Paul and Barnabas and to the mission of Barnabas and Mark to Cyprus (<a onClick="return mV(\'Act\',15,39);">Ac 15:39</a>). He is here called Mark, and in that quiet way Luke may indicate his own conviction that Mark\'s mind had changed on the great question, as indeed his willingness to accompany Paul might suggest. He had learned from the discussions in the council at Jerusalem and from subsequent events at Antioch.<P>About 11 years elapse before we hear of him again (<a onClick="return mV(\'Col\',4,10);">Col 4:10</a>f; <a onClick="return mV(\'Phm\',1,24);">Phm 1:24</a>). He is at Rome with Paul. The breach is healed. He is now one of the faithful few among Jewish Christians who stand by Paul. He is Paul\'s honored "fellowworker" and a great "comfort" to him.<P>The Colossian passage may imply a contemplated visit by Mark to Asia Minor. It may be that it was carried out, that he met Peter and went with him to Babylon. In <a onClick="return mV(\'1Pe\',5,13);">1Pe 5:13</a> the apostle sends Mark\'s greeting along with that of the church in Babylon. Thence Mark returns to Asia Minor, and in <a onClick="return mV(\'2Ti\',4,11);">2Ti 4:11</a> Paul asks Timothy, who is at Ephesus, to come to him, pick up Mark by the way, and bring him along. In that connection Paul pays Mark his final tribute; he is "useful for ministering" (euchrestos eis diakonian), so useful that his ministry is a joy to the veteran\'s heart.<P>3. His History as Known from Other Sources:<P>The most important and reliable tradition is that he was the close attendant and interpreter of Peter, and has given us in the Gospel that bears his name account of Peter\'s teaching. For that comradeship the New Testament facts furnish a basis, and the gaps in the New Testament history leave plenty of room. An examination of the tradition will be found in <a href="./study/isbe/search.html?string=MARK,+THE+GOSPEL+ACCORDING+TO">MARK, THE GOSPEL ACCORDING TO</A> (which see).<P>Other traditions add but little that is reliable. It is said that Mark had been a priest, and that after becoming a Christian he amputated a finger to disqualify himself for that service. Hence, the nickname kolobo-daktulos, which, however, is sometimes otherwise explained. He is represented as having remained in Cyprus until after the death of Barnabas (who was living in 57 AD according to <a onClick="return mV(\'1Cr\',9,5);">1Co 9:5</a>f) and then to have gone to Alexandria, founded the church there, become its first bishop and there died (or was marthyred) in the 8th year of Nero (62-63). They add that in 815 AD Venetian soldiers stole his remains from Alexandria and placed them under the church of Mark at Venice.<P>LITERATURE.<P>Chase, HDB, III, 245ff; Rae, DCG, II, 119f; Harnack, Encyclopedia Brit; Zahn, Introduction to the New Testament, II, 427-56; Lindsay, Salmond, Morison and Swete in their Comms.``56';
isbe[5815]='Mark, the Gospel According To, 1`<b>I. OUR SECOND GOSPEL</b><P><b>II. CONTENTS AND GENERAL CHARACTERISTICS</b><P class="in15">1. Scope<P class="in15">2. Material Peculiar to Mark<P class="in15">3. Quotations<P class="in15">4. A Book of Mighty Works<P class="in15">5. The Worker Is Also a Teacher<P class="in15">6. A Book of Graphic Details<P><b>III. THE TEXT</b><P><b>IV. LANGUAGE</b><P class="in15">1. General Character<P class="in15">2. Vocabulary<P class="in15">3. Style<P class="in15">4. Original Language<P><b>V. AUTHORSHIP</b><P class="in15">1. External Evidence<P class="in15">2. Internal Evidence<P><b>VI. SOURCES AND INTEGRITY</b><P><b>VII. DATE AND PLACE OF COMPOSITION</b><P><b>VIII. HISTORICITY</b><P><b>IX. PURPOSE AND PLAN</b><P class="in15">1. The Gospel for Romans<P class="in15">2. Plan of the Gospel<P><b>X. LEADING DOCTRINES</b><P class="in15">1. Person of Christ<P class="in15">2. The Trinity<P class="in15">3. Salvation<P class="in15">4. Eschatology<P><b>LITERATURE</b><hr /><P>I. Our Second Gospel.<P>The order of the Gospels in our New Testament is probably due to the early conviction that this was the order in which the Gospels were written. It was not, however, the invariable order. The question of order only arose when the roll was superseded by the codex, our present book-form. That change was going on in the 3rd century. Origen found codices with the order John-Matthew-Mark-Luke—due probably to the desire to give the apostles the leading place. That and the one common today may be considered the two main groupings—the one in the order of dignity, the other in that of time. The former is Egyptian and Latin; the latter has the authority of most Greek manuscripts, Catalogues and Fathers, and is supported by the old Syriac.<P>Within these, however, there are variations. The former is varied thus: John-Matthew-Luke-Mark, and Matthew-John-Mark-Luke, and Matthew-John-Luke-Mark; the latter to Matthew-Mark-John-Luke. Mark is never first; when it follows Luke, the time consideration has given place to that of length.<P>II. Contents and General Characteristics.<P>1. Scope:<P>The Gospel begins with the ministry of John the Baptist and ends with the announcement of the Resurrection, if the last 12 verses be not included. These add post-resurrection appearances, the Commission, the Ascension, and a brief summary of apostolic activity. Thus its limits correspond closely with those indicated by Peter in <a onClick="return mV(\'Act\',10,\'37-43\');">Ac 10:37-43</a>. Nothing is said of the early Judean ministry. The Galilean ministry and Passion Week with the transition from the one to the other (in <a onClick="return mV(\'Act\',10,\'1-\');">Ac 10</a>) practically make up the Gospel.<P>2. Material Peculiar to Mark:<P>Matter peculiar to Mark is found in <a onClick="return mV(\'Mar\',4,\'26-29\');">4:26-29</A> (the seed growing secretly); <a onClick="return mV(\'Mar\',3,21);">3:21</A> (his kindred\'s fear); <a onClick="return mV(\'Mar\',7,\'32-37\');">7:32-37</a> (the deaf and dumb man); <a onClick="return mV(\'Mar\',8,\'22-26\');">8:22-26</A> (the blind man); <a onClick="return mV(\'Mar\',4,\'26-29\');">13:33-37</a> (the householder and the exhortation to watch); <a onClick="return mV(\'Mar\',14,51);">14:51</A> (the young man who escaped). But, in addition to this, there are many vivid word-touches with which the common material is lighted up, and in not a few of the common incidents Mark\'s account is very much fuller; e.g. <a onClick="return mV(\'Mar\',6,\'14-29\');">6:14-29</a> (death of John the Baptist); <a onClick="return mV(\'Mar\',7,\'1-23\');">Mr 7:1-23</a> (on eating with unwashen hands); <a onClick="return mV(\'Mar\',9,\'14-29\');">9:14-29</A> (the demoniac boy); <a onClick="return mV(\'Mar\',12,\'28-34\');">12:28-34</A> (the questioning scribe). There is enough of this material to show clearly that the author could not have been wholly dependent on the other evangelists. Hawkins reckons the whole amount of peculiar material at about fifty verses (Hor. Syn., 11).<P>3. Quotations:<P>In striking contrast to Matthew who, in parallel passages, calls attention to the fulfillment of prophecy by Jesus, Mark only once quotes the Old Testament and that he puts in the very forefront of his Gospel. The Isaiah part of his composite quotation appears in all 4 Gospels; the Malachi part in Mark only, though there is a reflection of it in <a onClick="return mV(\'Jhn\',3,28);">Joh 3:28</a>. This fact alone might convey an erroneous impression of the attitude of the Gospel to the Old Testament. Though Mark himself makes only this one twofold reference, yet he represents Jesus as doing so frequently. The difference in this respect between him and Matthew is not great. He has 19 formal quotations as compared with 40 in Matthew, 17 in Luke and 12 in John. Three of the 19 are not found elsewhere. The total for the New Testament is 160, so that Mark has a fair proportion. When Old Testament references and loose citations are considered the result is much the same. Westcott and Hort, The New Testament in Greek give <span class="noTag">Matthew 100, Mark 58, Luke 86, John 21, Acts 107</span>. Thus. the Old Testament lies back of Mark also as the authoritative word of God. Swete (Introduction to the Old Testament in Greek, 393) points out that in those quotations which are common to the synoptists the Septuagint is usually followed; in others, the Hebrew more frequently. (A good illustration is seen in <a onClick="return mV(\'Mar\',7,7);">Mr 7:7</a> where the Septuagint is followed in the phrase, "in vain do they worship me"—a fair para-phrase of the Hebrew; but "teaching as their doctrines the precepts of men" is a more correct representation of the Hebrew than the Septuagint gives.) Three quotations are peculiar to Mark, namely, <a onClick="return mV(\'Mar\',9,48);">9:48</A>; <a onClick="return mV(\'Mar\',10,19);">10:19</A>; <a onClick="return mV(\'Mar\',12,32);">12:32</a>.<P>4. A Book of Mighty Works:<P>Judged by the space occupied, Mark is a Gospel of deeds. Jesus is a worker. His life is one of strenuous activity. He hastens from one task to another with energy and decision. The word euthus, i.e. "straightway," is used 42 times as against Matthew\'s 7 and Luke\'s 1. In 14 of these, as compared with 2 in Matthew and none in Luke, the word is used of the personal activity of Jesus. It is not strange therefore that the uneventful early years should be passed over (compare <a onClick="return mV(\'Jhn\',2,11);">Joh 2:11</a>). Nor is it strange that miracles should be more numerous than parables. According to Westcott\'s classification (Introduction to Study of the Gospel, 480-86), Mark has 19 miracles and only 4 parables, whereas the corresponding figures for Matthew are 21 to 15 and for <span class="noTag">Luke 20</span> to 19. Of the miracles 2 are peculiar to Mark, of the parables only 1. The evangelist clearly records the deeds rather than the words of Jesus. These facts furnish another point of contact with Peter\'s speeches in Acts—the beneficent character of the deeds in <a onClick="return mV(\'Act\',10,38);">Ac 10:38</a>, and their evidential significance in <a onClick="return mV(\'Act\',2,22);">Ac 2:22</a> (compare <a onClick="return mV(\'Mar\',1,27);">Mr 1:27</a>; <a onClick="return mV(\'Mar\',2,10);">2:10</a>, etc.).<P>The following are the miracles recorded by Mark: the unclean spirit (<a onClick="return mV(\'Mar\',1,\'21-28\');">1:21-28</a>), the paralytic (<a onClick="return mV(\'Mar\',2,\'1-12\');">2:1-12</a>), the withered hand (<a onClick="return mV(\'Mar\',3,\'1-5\');">3:1-5</A>), the storm stilled (<a onClick="return mV(\'Mar\',4,\'35-41\');">4:35-41</a>), the Gerasene demoniac (<a onClick="return mV(\'Mar\',5,\'1-17\');">5:1-17</A>), Jairus\' daughter (<a onClick="return mV(\'Mar\',5,22);">5:22</A>ff), the woman with the issue (<a onClick="return mV(\'Mar\',5,\'25-34\');">5:25-34</a>), feeding the 5,000 (<a onClick="return mV(\'Mar\',6,\'35-44\');">6:35-44</A>), feeding the 4,000 (<a onClick="return mV(\'Mar\',8,\'1-10\');">8:1-10</a>), walking on the water (<a onClick="return mV(\'Mar\',6,48);">6:48</A>ff); the Syrophoenician\'s daughter (<a onClick="return mV(\'Mar\',7,\'24-30\');">7:24-30</A>), the deaf mute (<a onClick="return mV(\'Mar\',7,\'31-37\');">7:31-37</a>), the blind man (<a onClick="return mV(\'Mar\',8,\'22-26\');">8:22-26</A>), the demoniac boy (<a onClick="return mV(\'Mar\',9,14);">9:14</A>ff), blind Bartimeus (<a onClick="return mV(\'Mar\',10,\'46-52\');">10:46-52</a>), the fig tree withered (<a onClick="return mV(\'Mar\',11,20);">11:20</a>ff), the resurrection (<a onClick="return mV(\'Mar\',16,1);">16:1</A>ff). For an interesting classification of these see Westcott\'s Introduction to Study of the Gospels, 391. Only the last three belong to Judea.<P>5. The Worker Is Also a Teacher:<P>Though what has been said is true, yet Mark is by no means silent about Jesus as a teacher. John the Baptist is a preacher (<a onClick="return mV(\'Mar\',1,4,7);">Mr 1:4,7</a>), and Jesus also is introduced as a preacher, taking up and enlarging the message of John. Very frequent mention is made of him as teaching (e.g. <a onClick="return mV(\'Mar\',1,21);">Mr 1:21</a>; <a onClick="return mV(\'Mar\',2,13);">2:13</a>; <a onClick="return mV(\'Mar\',6,6);">6:6</a>, etc.); indeed the words didache, and didasko, occur more frequently in Mark than in any other Gospel. Striking references are made to His originality, methods, popularity and peerlessness as a teacher (<a onClick="return mV(\'Mar\',1,22);">Mr 1:22</a>; <a onClick="return mV(\'Mar\',4,1,33);">4:1f; 33</a>; <a onClick="return mV(\'Mar\',11,\'27-\');">11:27</a>-<a onClick="return mV(\'Mar\',12,\'1-37\');">12:37</a>; especially <a onClick="return mV(\'Mar\',12,34);">12:34</a>). A miracle is definitely declared to be for the purpose of instruction (<a onClick="return mV(\'Mar\',2,10);">Mr 2:10</a>), and the implication is frequent that His miracles were not only the dictates of His compassion, but also purposed self-revelations (<a onClick="return mV(\'Mar\',5,19);">Mr 5:19</a>f; <a onClick="return mV(\'Mar\',11,21,22,23);">11:21-23</a>). Not only is He Himself a teacher, but He is concerned to prepare others to be teachers (<a onClick="return mV(\'Mar\',3,13);">Mr 3:13</a>f; <a onClick="return mV(\'Mar\',4,10);">4:10</a>f). Mark is just as explicit as Matthew in calling attention to the fact that at a certain stage He began teaching the multitude in parables, and expounding the parables to His disciples (<a onClick="return mV(\'Mar\',4,\'2-11\');">Mr 4:2-11</a>f). He mentions, however, only four of them—the Sower (<a onClick="return mV(\'Mar\',4,\'1-20\');">Mr 4:1-20</a>), the Seed Growing Secretly (<a onClick="return mV(\'Mar\',4,\'26-29\');">Mr 4:26-29</a>), the Mustard Seed (<a onClick="return mV(\'Mar\',4,\'30-32\');">Mr 4:30-32</a>) and the Husband-men (<a onClick="return mV(\'Mar\',12,\'1-12\');">Mr 12:1-12</a>). The number of somewhat lengthy discourses and the total amount of teaching is considerably greater than is sometimes recognized. <a onClick="return mV(\'Mar\',4,\'1-\');">Mark 4</a> and <a onClick="return mV(\'Mar\',13,\'1-\');">13</a> approach most nearly to the length of the discourses in Matthew and correspond to <a onClick="return mV(\'Mat\',13,\'1-\');">Mt 13</a> and <a onClick="return mV(\'Mat\',24,\'1-\');">24</a> respectively. But in <a onClick="return mV(\'Mar\',7,\'1-23\');">Mr 7:1-23</a>; <a onClick="return mV(\'Mar\',9,\'33-50\');">9:33-50</a>; <a onClick="return mV(\'Mar\',10,\'5-31\',\'39-45\');">10:5-31,39-45</a> and <a onClick="return mV(\'Mar\',12,\'1-44\');">12:1-44</a> we have quite extensive sayings. If Jesus is a worker, He is even more a teacher. His works prepare for His words rather than His words for His works. The teachings grew naturally out of the occasion and the circumstances. He did and taught. Because He did what He did He could teach with effectiveness. Both works and words reveal Himself.<P>6. A Book of Graphic Details:<P>There is a multitude of graphic details: Mark mentions actions and gestures of Jesus (<a onClick="return mV(\'Mar\',7,33);">7:33</A>; <a onClick="return mV(\'Mar\',9,36);">9:36</A>; <a onClick="return mV(\'Mar\',10,16);">10:16</a>) and His looks of inquiry (<a onClick="return mV(\'Mar\',5,32);">5:32</a>), in prayer (<a onClick="return mV(\'Mar\',6,41);">6:41</A>; <a onClick="return mV(\'Mar\',7,34);">7:34</a>), of approval (<a onClick="return mV(\'Mar\',3,34);">3:34</a>), love (<a onClick="return mV(\'Mar\',10,21);">10:21</A>), warning (to Judas especially <a onClick="return mV(\'Mar\',10,23);">10:23</A>), anger (<a onClick="return mV(\'Mar\',3,5);">3:5</a>), and in judgment (<a onClick="return mV(\'Mar\',11,11);">11:11</a>). Jesus hungers (<a onClick="return mV(\'Mar\',11,12);">11:12</a>), seeks rest in seclusion (<a onClick="return mV(\'Mar\',6,31);">6:31</a>) and sleeps on the boat cushion (<a onClick="return mV(\'Mar\',4,38);">4:38</a>); He pities the multitude (<a onClick="return mV(\'Mar\',6,34);">6:34</a>), wonders at men\'s unbelief (<a onClick="return mV(\'Mar\',6,6);">6:6</A>), sighs over their sorrow and blindness (<a onClick="return mV(\'Mar\',6,34);">6:34</A>; <a onClick="return mV(\'Mar\',8,12);">8:12</a>), grieves at their hardening (<a onClick="return mV(\'Mar\',3,5);">3:5</a>), and rebukes in sadness the wrong thought of His mother and brothers, and in indignation the mistaken zeal and selfish ambitions of His disciples (<a onClick="return mV(\'Mar\',8,33);">8:33</a>; <a onClick="return mV(\'Mar\',10,14);">10:14</A>). Mark represents His miracles of healing usually as instantaneous (<a onClick="return mV(\'Mar\',1,31);">1:31</a>; <a onClick="return mV(\'Mar\',2,11);">2:11</a>f; <a onClick="return mV(\'Mar\',3,5);">3:5</A>), sometimes as gradual or difficult (<a onClick="return mV(\'Mar\',1,26);">1:26</a>; <a onClick="return mV(\'Mar\',7,\'32-35\');">7:32-35</a>; <a onClick="return mV(\'Mar\',9,\'26-28\');">9:26-28</a>), and once as flatly impossible "because of their unbelief" (<a onClick="return mV(\'Mar\',6,6);">6:6</A>). With many vivid touches we are told of the behavior of the people and the impression made on them by what Jesus said or did. They bring their sick along the streets and convert the market-place into a hospital (<a onClick="return mV(\'Mar\',1,32);">1:32</a>), throng and jostle Him by the seaside (<a onClick="return mV(\'Mar\',3,10);">3:10</A>), and express their astonishment at His note of authority (<a onClick="return mV(\'Mar\',1,22);">1:22</A>) and power (<a onClick="return mV(\'Mar\',2,12);">2:12</a>). Disciples are awed by His command over the sea (<a onClick="return mV(\'Mar\',4,41);">4:41</A>), and disciples and others are surprised and alarmed at the strange look of dread as He walks ahead alone, going up to Jerusalem and the cross (<a onClick="return mV(\'Mar\',10,32);">10:32</a>). Many other picturesque details are given, as in <a onClick="return mV(\'Mar\',1,13);">1:13</A> (He was with the wild beasts); <a onClick="return mV(\'Mar\',2,4);">2:4</A> (digging through the roof); <a onClick="return mV(\'Mar\',4,38);">4:38</A> (lying asleep on the cushion); <a onClick="return mV(\'Mar\',5,4);">5:4</A> (the description of the Gerasene demoniac); <a onClick="return mV(\'Mar\',6,39);">6:39</a> (the companies, dressed in many colors and looking like flower beds on the green mountain-side). Other details peculiar to Mark are: names (<a onClick="return mV(\'Mar\',1,29);">1:29</a>; <a onClick="return mV(\'Mar\',3,6);">3:6</a>; <a onClick="return mV(\'Mar\',13,3);">13:3</A>; <a onClick="return mV(\'Mar\',15,21);">15:21</A>), numbers (<a onClick="return mV(\'Mar\',5,13);">5:13</A>; <a onClick="return mV(\'Mar\',6,7);">6:7</A>), time (<a onClick="return mV(\'Mar\',1,35);">1:35</A>; <a onClick="return mV(\'Mar\',2,1);">2:1</A>; <a onClick="return mV(\'Mar\',11,19);">11:19</a>; <a onClick="return mV(\'Mar\',16,2);">16:2</a>), and place (<a onClick="return mV(\'Mar\',2,13);">2:13</a>; <a onClick="return mV(\'Mar\',3,8);">3:8</a>; <a onClick="return mV(\'Mar\',7,3);">7:31</A>; <a onClick="return mV(\'Mar\',12,41);">12:41</A>; <a onClick="return mV(\'Mar\',13,3);">13:3</A>; <a onClick="return mV(\'Mar\',14,68);">14:68</A> and <a onClick="return mV(\'Mar\',15,39);">15:39</a>). These strongly suggest the observation of an eyewitness as the final authority, and the geographical references suggest that even the writer understood the general features of the country, especially of Jerusalem and its neighborhood. (For complete lists see Lindsay, Mark\'s Gospel, 26ff.)<P>III. The Text.<P>Of the 53 select readings noted by Westcott and Hort, The New Testament in Greek (Into), only a few are of special interest or importance. The following are to be accepted: en to Esaia to prophete (<a onClick="return mV(\'Mar\',1,2);">Mr 1:2</a>) hamartematos (<a onClick="return mV(\'Mar\',3,29);">Mr 3:29</a>); pleres (indeclinable, <a onClick="return mV(\'Mar\',4,28);">4:28</a>); to tekton (<a onClick="return mV(\'Mar\',6,3);">Mr 6:3</a>; Jesus is here called "the carpenter"); autou (<a onClick="return mV(\'Mar\',6,22);">Mr 6:22</a>, Herod\'s daughter probably had two names, Salome and Herodias); pugme (<a onClick="return mV(\'Mar\',7,23);">Mr 7:23</a>, "with the fist," i.e. "thoroughly," not pukna "oft"). Westcott and Hort, The New Testament in Greek are to be followed in rejecting pisteusai (leaving the graphic To Ei dune (<a onClick="return mV(\'Mar\',9,23);">Mr 9:23</a>)]; kai nesteia (<a onClick="return mV(\'Mar\',9,29);">Mr 9:29</a>); pasa...halisthesetai (<a onClick="return mV(\'Mar\',9,49);">Mr 9:49</a>); tous...chremasi (<a onClick="return mV(\'Mar\',10,24);">Mr 10:24</a>); but not in rejecting huiou Theou (<a onClick="return mV(\'Mar\',1,1);">Mr 1:1</a>). They are probably wrong in retaining hous...onomasan (<a onClick="return mV(\'Mar\',3,14);">Mr 3:14</a>; it was probably added from <a onClick="return mV(\'Luk\',6,31);">Lu 6:31</a>); and in rejecting kai klinon and accepting pantisontai instead of baptisontai (<a onClick="return mV(\'Mar\',7,4);">Mr 7:4</a>; ignorance of the extreme scrupulosity of the Jews led to these scribal changes; compare <a onClick="return mV(\'Luk\',11,38);">Lu 11:38</a>, where ebaptisthe is not disputed). So one may doubt eporei (<a onClick="return mV(\'Mar\',6,20);">Mr 6:20</a>), and suspect it of being an Alexandrian correction for epoiei which was more difficult and yet is finely appropriate.<P>The most important textual problem is that of <a onClick="return mV(\'Mar\',16,\'9-20\');">Mr 16:9-20</a>. Burgon and Miller and Salmon believe it to be genuine. Miller supposes that up to that point Mark had been giving practically Peter\'s words, that for some reason those then failed him and that <a onClick="return mV(\'Mar\',16,\'9-20\');">16:9-20</A> are drawn from his own stores. The majority of scholars regard them as non-Markan; they think <a onClick="return mV(\'Mar\',16,8);">16:8</a> is not the intended conclusion; that if Mark ever wrote a conclusion, it has been lost, and that <a onClick="return mV(\'Mar\',16,\'9-20\');">16:9-20</a>, embodying traditions of the Apostolic Age, were supplied later. Conybeare has found in an Armenian manuscript a note referring these verses to the presbyter Ariston, whom he identifies with that Aristion, a disciple of John, of whom Papias speaks. Many therefore would regard them as authentic, and some accept them as clothed with John\'s authority. They are certainly very early, perhaps as early as 100 AD, and have the support of Codices Alexandrinus, Ephraemi, Bezae, Xi, Gamma, Delta, Zeta all late uncials, all cursives, most versions and Fathers, and were known to the scribes of Codex Sinaiticus and Codex Vaticanus, who, however, do not accept them.<P>It is just possible that the Gospel did end at verse <a onClick="return mV(\'Mar\',16,8);">8</A>. The very abruptness would argue an early date when Christians lived in the atmosphere of the Resurrection and would form an even appropriate closing for the Gospel of the Servant (see below). A Servant comes, fulfills his task, and departs—we do not ask about his lineage, nor follow his subsequent history.<P>IV. Language.<P>1. General Character:<P>Mark employs the common coloquial Greek of the day, understood everywhere throughout the Greek-Roman world. It was emphatically the language of the Character people, "known and read of all men." His vocabulary is equally removed from the technicalities of the schools and from the slang of the streets. It is the clean, vigorous, direct speech of the sturdy middle class.<P>2. Vocabulary:<P>Of his 1,330 words, 60 are proper names. Of the rest 79 are peculiar to Mark, so far as the New Testament is concerned; 203 are found elsewhere only in the Synoptics, 15 only in John\'s Gospel, 23 only in Paul (including Hebrews), 2 in the Catholic Epistles (1 in James, 1 in 2 Peter), 5 in the Apocalypse (Revelation) (see Swete, Commentary on Mark). Rather more than a fourth of the 79 are non-classical as compared with one-seventh for Luke and a little more than one-seventh for Mr. Hawkins also gives a list of 33 unusual words or expressions. The most interesting of the single words are schizomanous, ephien, komopoleis, ekephaliosan, proaulion, and hoti, in the sense of "why" (<a onClick="return mV(\'Mar\',2,16);">Mr 2:16</a>; <a onClick="return mV(\'Mar\',9,11,28);">9:11,28</a>); of the expressions, the distributives in <a onClick="return mV(\'Mar\',6,7,39);">Mr 6:7,39</a>f and <a onClick="return mV(\'Mar\',14,19);">14:19</a>, the Hebraistic ei dothesetai, and hotan with the indicative. Of ordinary constructions the following are found with marked frequency: kai (reducing his use of de to half of Matthew\'s or Luke\'s), historic present (accounting for the very frequent use of legei instead of eipen the periphrastic imperfect, the article with infinitives or sentences, participles, and prepositions.<P>There are indications that the writer in earlier life was accustomed to think in Aramaic. Occasionally that fact shows itself in the retention of Aramaic words which are proportionately rather more numerous than in Matthew and twice as numerous as in Luke or John. The most interesting of these are taleitha koum, ephphatha, and Boanerges, each uttered at a time of intense feeling.<P>Latinisms in Mark are about half as numerous as Aramaisms. They <span class="noTag">number 11</span>, the same as in Matthew, as compared with 6 in Luke and 7 in John. The greater proportion in Mark is the only really noteworthy fact in these figures. It suggests more of a Roman outlook and fits in with the common tradition as to its origin and authorship.<P>For certain words he has great fondness: euthus 42 times; akathartos 11 times; blepo, and its compounds very frequently; so eperotan, hupagein, exousia, euaggelion, proskaleisthai, epitiman compounds of poreuesthai, sunzetein, and such graphic words as ekthambeisthai, embrimasthai, enagkalizesthai, and phimousthai. The following he uses in an unusual sense: eneichen, pugme, apechei, epibalon.<P>The same exact and vivid representation of the facts of actual experience accounts for the anacolutha and other broken constructions, e.g. <a onClick="return mV(\'Mar\',4,31);">Mr 4:31</a>f; <a onClick="return mV(\'Mar\',5,23);">5:23</a>; <a onClick="return mV(\'Mar\',6,8);">6:8</a>f; <a onClick="return mV(\'Mar\',11,32);">11:32</a>. Some are due to the insertion of explanatory clauses, as in <a onClick="return mV(\'Mar\',7,3,4,5);">7:3-5</a>; some to the introduction of a quotation as in <a onClick="return mV(\'Mar\',7,11);">7:11</a>f. These phenomena represent the same type of mind as we have already seen (II, 6 above).<P>3. Style:<P>The style is very simple. The common connective is kai. The stately periods of the classics are wholly absent. The narrative is commonly terse and concise. At times, however, a multitude of details are crowded in, resulting in unusual fullness of expression. This gives rise to numerous duplicate expressions as in <a onClick="return mV(\'Mar\',1,32);">Mr 1:32</a>; <a onClick="return mV(\'Mar\',2,25);">2:25</a>; <a onClick="return mV(\'Mar\',5,19);">5:19</a> and the like, which become a marked feature of the style. The descriptions are wonderfully vivid. This is helped out by the remarkably frequent use of the historic present, of which there are 151 examples, as contrasted with 78 in Matthew and 4 in Luke, apart from its use in parables. Mark never uses it in parables, whereas Matthew has 15 cases, and Luke has 5. John has 162, a slightly smaller proportion than Mark on the whole, but rather larger in narrative parts. But Mark\'s swift passing from one tense to another adds a variety and vividness to the narrative not found in John.<P>4. Original Language:<P>That the original language was Greek is the whole impression made by patristic references. Translations of the Gospel are always from, not into, Greek. It was the common language of the Roman world, especially for letters. Paul wrote to the Romans in Greek. Half a century later Clement wrote from Rome to Corinth in Greek. The Greek Mark bears the stamp of originality and of the individuality of the author.<P>Some have thought it was written in Latin. The only real support for that view is the subscription in a few manuscripts (e.g. 160,161,egraphe Rhomaisti en Rhome) and in the Peshitta and Harclean Syriac. It is a mistaken deduction from the belief that it was written in Rome or due to the supposition that "interpreter of Peter" meant that Mark translated Peter\'s discourses into Latin<P>Blass contended for an Aramaic original, believing that Luke, in the first part of Acts, followed an Aramaic source, and that that source was by the author of the Second Gospel which also, therefore, was written in Aramaic. He felt, moreover, that the text of Mark suggests several forms of the Gospel which are best explained as translations of a common original. Decisive against the view is the translation of the few Aramaic words which are retained.<P>V. Authorship.<P>1. External Evidence:<P>The external evidence for the authorship is found in the Fathers and the manuscripts. The most important patristic statements are the following:<P>Papias—Asia Minor, circa 125 AD—(quoted by Eus., HE, III, 39): "And this also the elder said: Mark, having become the interpreter (hermeneutes) of Peter, wrote accurately what he remembered (or recorded) of the things said or done by Christ, but not in order. For he neither heard the Lord nor followed Him; but afterward, as I said (he attached himself to) Peter who used to frame his teaching to meet the needs (of his hearers), but not as composing an orderly account (suntaxin) of the Lord\'s discourses, so that Mark committed no error in thus writing down some things as he remembered them: for he took thought for one thing not to omit any of the things he had heard nor to falsify anything in them."<P>Justin Martyr—Palestine and the West, circa 150 AD—(In Dial. with Trypho, cvi, Migne ed.): "And when it is said that He imposed on one of the apostles the name Peter, and when this is recorded in his \'Memoirs\' with this other fact that He named the two sons of Zebedee \'Boanerges,\' which means \'Sons of Thunder,\' " etc.<P>Irenaeus—Asia Minor and Gaul, circa 175 AD—(Adv. Haer., iii. 1, quoted in part Eus., HE, V, 8): "After the apostles were clothed with the power of the Holy Spirit and fully furnished for the work of universal evangelization, they went out ("exierunt," in Rufinus\' translation) to the ends of the earth preaching the gospel. Matthew went eastward to those of Hebrew descent and preached to them in their own tongue, in which language he also (had?) published a writing of the gospel, while Peter and Paul went westward and preached and founded the church in Rome. But after the departure (exodon. "exitum" in Rufinus) of the, Mark, the disciple and interpreter (hermeneutes) of Peter, even he has delivered to us in writing the things which were preached by Peter."<P>Clement of Alexandria—circa 200 AD—(Hypotyp. in Eus., HE, VI, 14): "The occasion for writing the Gospel according to Mark was as follows: After Peter had publicly preached the word in Rome and declared the gospel by the Spirit, many who were present entreated Mark, as one who had followed him for a long time and remembered what he said, to write down what he had spoken, and Mark, after composing the Gospel, presented it to his petitioners. When Peter became aware of it he neither eagerly hindered nor promoted it."<P>Also (Eus., HE, II, 15): "So charmed were the Romans with the light that shone in upon their minds from the discourses of Peter, that, not contented with a single hearing and the viva voce proclamation of the truth, they urged with the utmost solicitation on Mark, whose Gospel is in circulation and who was Peter\'s attendant, that he would leave them in writing a record of the teaching which they had received by word of mouth. They did not give over until they had prevailed on him; and thus they became the cause of the composition of the so-called Gospel according to Mk. It is said that when the apostle knew, by revelation of the Spirit, what was done, he was pleased with the eagerness of the men and authorized the writing to be read in the churches."<P>Tertullian—North Africa, circa 207 AD—(Adv. Marc., iv. 5): He speaks of the authority of the four Gospels, two by apostles and two by companions of apostles, "not excluding that which was published by Mark, for it may be ascribed to Peter, whose interpreter Mark was."<P>Origen—Alexandria and the East, c 240 AD—("Comm. on Mt" quoted in Eus., HE, VI, 25): "The second is that according to Mark who composed it, under the guidance of Peter (hos Petros huphegesato auto), who therefore, in his Catholic (universal) epistle, acknowledged the evangelist as his son."<P>Eusebius—Caesarea, circa 325 AD—(Dem. Evang., III, 5): "Though Peter did not undertake, through excess of diffidence, to write a Gospel, yet it had all along been currency reported, that Mark, who had become his familiar acquaintance and attendant (gnorimes kat phoitetes) made memoirs of (or recorded, apomnemoeusai) the discourses of Peter concerning the doings of Jesus." "Mark indeed writes this, but it is Peter who so testifies about himself, for all that is in Mark are memoirs (or records) of the discourses of Peter."<P>Epiphanius—Cyprus, circa 350 AD—(Haer., 41): "But immediately after Matthew, Mark, having become a follower (akolouthos) of the holy Peter in Rome, is entrusted in the putting forth of a gospel. Having completed his work, he was sent by the holy Peter into the country of the Egyptians."<P>Jerome—East and West, circa 350 AD—(De vir. illustr., viii): "Mark, disciple and interpreter of Peter, at the request of the brethren in Rome, wrote a brief Gospel in accordance with what he had heard Peter narrating. When Peter heard it he approved and authorized it to be read in the churches."<P>Also xi: "Accordingly he had Titus as interpreter just as the blessed Peter had Mark whose Gospel was composed, Peter narrating and Mark writing."<P>Preface Commentary on Matthew: "The second is Mark, interpreter of the apostle Peter, and first bishop of the Alexandrian church; who did not himself see the Lord Jesus, but accurately, rather than in order, narrated those of His deeds, which he had heard his teacher preaching."<P>To these should be added the Muratorian Fragment—circa 170 AD—"which gives a list of the New Testament books with a brief account of the authorship of each. The account of Matthew and most of that of Mark are lost, only these words relating to Mark being left: \'quibus tamen interfuit, et ita posuit\'" (see below).<P>These names represent the churches of the 2nd, 3rd, and 4th centuries, and practically every quarter of the Roman world. Quite clearly the common opinion was that Mark had written a Gospel and in it had given us mainly the teaching of Peter.<P>That our second Gospel is the one referred to in these statements there can be no reasonable doubt. Our four were certainly the four of Irenaeus and Tatian; and Salmon (Introduction) has shown that the same four must have been accepted by Justin, Papias and their contemporaries, whether orthodox or Gnostics. Justin\'s reference to the surname "Boanerges" supports this so far as Mark is concerned, for in the Gospel of Mark alone is that fact mentioned (<a onClick="return mV(\'Mar\',3,17);">3:17</A>).<P>A second point is equally clear—that the Gospel of Mark is substantially Peter\'s. Mark is called disciple, follower, interpreter of Peter. Origen expressly quotes "Marcus, my son" (<a onClick="return mV(\'1Pe\',5,13);">1Pe 5:13</a> the King James Version) in this connection. "Disciple" is self-explanatory. "Follower" is its equivalent, not simply a traveling companion. "Interpreter" is less clear. One view equates it with "translator," because Mark translated either Peter\'s Aramaic discourses into Greek for the Hellenistic Christians in Jerusalem (Adeney, et al.), or Peter\'s Greek discourses into Latin for the Christians in Rome (Swete, et al.). The other view—that of the ancients and most moderns (e.g. Zahn, Salmon)—is that it means "interpreter" simply in the sense that Mark put in writing what Peter had taught. The contention of Chase (HDB, III, 247) that this was a purely metaphorical use has little weight because it may be so used here. The conflict in the testimony as to date and place will be considered below (VII).<P>There is no clear declaration that Mark himself was a disciple of Jesus or an eyewitness of what he records. Indeed the statement of Papias seems to affirm the contrary. However, that statement may mean simply that he was not a personal disciple of Jesus, not that he had never seen Him at all.<P>The Muratorian Fragment is not clear. Its broken sentence has been differently understood. Zahn completes it thus: "(ali) quibus tamen interfuit, et ita posuit," and understands it to mean that "at some incidents (in the life of Jesus), however, he was present and so put them down." Chase (HDB) and others regard "quibus tamen" as a literal translation of the Greek hois de, and believe the meaning to be that Mark, who had probably just been spoken of as not continuously with Peter, "was present at some of this discourses and so recorded them." Chase feels that the phrase following respecting Luke: "Dominum tamen nec ipse vidit in carne," compels the belief that Mark like Luke had not seen the Lord. But Paul, not Mark, may be there in mind, and further, this interpretation rather belittles Mark\'s association with Peter.<P>The patristic testimony may be regarded as summarized in the title of the work in our earliest manuscripts, namely, kata Markon. This phrase must refer to the author, not his source of information, for then it would necessarily have been kata Petron. This is important as throwing light on the judgment of antiquity as to the authorship of the first Gospel, which the manuscripts all entitle kata Matthaion.<P>2. Internal Evidence:<P>The internal evidence offers much to confirm the tradition and practically nothing to the contrary. That Peter is back of it is congruous with such facts as the following:<P>(1) The many vivid details referred to above (III, 6) must have come from an eyewitness. The frequent use of legei, in Mark and Matthew where Luke uses eipen, works in the same direction.<P>(2) Certain awkward expressions in lists of names can best be explained as Mark\'s turning of Peter\'s original, e.g. <a onClick="return mV(\'Mar\',1,29);">Mr 1:29</a>, where Peter may have said, "We went home, James and John accompanying us." So in <a onClick="return mV(\'Mar\',1,36);">Mr 1:36</a> (contrasted with Luke\'s impersonal description, <a onClick="return mV(\'Luk\',4,42);">Lu 4:42</a>f); <a onClick="return mV(\'Mar\',3,16);">Mr 3:16</a>; <a onClick="return mV(\'Mar\',13,3);">13:3</a>.<P>(3) Two passages (<a onClick="return mV(\'Mar\',9,6);">Mr 9:6</a>; <a onClick="return mV(\'Mar\',11,21);">11:21</a>) describe Peter\'s own thought; others mention incidents which Peter would be most likely to mention: e.g. <a onClick="return mV(\'Mar\',14,37);">Mr 14:37</a> and <a onClick="return mV(\'Mar\',14,\'66-72\');">14:66-72</A> (especially imperfect erneito); <a onClick="return mV(\'Mar\',16,7);">16:7</a>; <a onClick="return mV(\'Mar\',7,\'12-23\');">7:12-23</A> in view of <a onClick="return mV(\'Act\',10,15);">Ac 10:15</a>).<P>(4) In <a onClick="return mV(\'Mar\',3,7);">Mr 3:7</a> the order of names suits Peter\'s Galilean standpoint rather than that of Mark in Jerusalem—Galilee, Judea, Jerusalem, Perea, Tyre, Sidon. The very artlessness of these hints is the best kind of proof that we are in touch with one who saw with his own eyes and speaks out of his own consciousness.<P>(5) Generally Mark, like Matthew, writes from the standpoint of the Twelve more frequently than Luke; and Mark, more frequently than Matthew, from the standpoint of the three most honored by Jesus. Compare <a onClick="return mV(\'Mar\',5,37);">Mr 5:37</a> with <a onClick="return mV(\'Mat\',9,23);">Mt 9:23</a>, where Matthew makes no reference to the three; the unusual order of the names in Luke\'s corresponding passage (<a onClick="return mV(\'Luk\',8,51);">Lu 8:51</a>) suggests that James was his ultimate source. The language of <a onClick="return mV(\'Mar\',9,14);">Mr 9:14</a> is clearly from one of the three, Luke\'s may be, but Matthew\'s is not. The contrast in this respect between the common synoptic material and <a onClick="return mV(\'Luk\',9,\'51-\');">Lu 9:51-18:14</a> lends weight to this consideration.<P>(6) The scope of the Gospel which corresponds to that outlined in Peter\'s address to Cornelius (<a onClick="return mV(\'Act\',10,\'37-41\');">Ac 10:37-41</a>).<P>(7) The book suits Peter\'s character—impressionable rather than reflective, and emotional rather than logical. To such men arguments are of minor importance. It is deeds that count (Burton, Short Intro).<P>It may seem to militate against all this that the three striking incidents in Peter\'s career narrated in <a onClick="return mV(\'Mat\',14,\'28-33\');">Mt 14:28-33</a> (walking on the water), <a onClick="return mV(\'Mar\',17,\'24-27\');">17:24-27</A> (tribute money), and <a onClick="return mV(\'Mar\',16,\'16-19\');">16:16-19</a> (the church and the keys), should be omitted in Mark. But this is just a touch of that fine courtesy and modesty which companionship with Jesus bred. We see John in his Gospel hiding himself in a similar way. These men are more likely to mention the things that reflect discredit on themselves. It is only in Matthew\'s list of the Twelve that he himself is called "the publican." So "Peter never appears in a separate role in Mark except to receive a rebuke" (Bacon).<P>As to Mark\'s authorship, the internal evidence appears slight. Like the others, he does not obtrude himself. Yet for that very reason what hints there are become the more impressive.<P>There may be something in Zahn\'s point that the description of John as brother of James is an unconscious betrayal of the fact that the author\'s own name was John. There are two other passages, however, which are clearer and which reinforce each other. The story of the youth in <a onClick="return mV(\'Mar\',14,51);">Mr 14:51</a> seems to be of a different complexion from other Gospel incidents. But if Mark himself was the youth, its presence is explained and vindicated. In that case it is likely that the Supper was celebrated in his own home and that the upper room is the same as that in <a onClick="return mV(\'Act\',12,\'1-\');">Ac 12</a>. This is favored by the fuller description of it in Mark, especially the word "ready"—a most natural touch, the echo of the housewife\'s exclamation of satisfaction when everything was ready for the guests. It is made almost a certainty when we compare <a onClick="return mV(\'Mar\',14,17);">Mr 14:17</a> with the parallels in Matthew and Luke. <a onClick="return mV(\'Mat\',26,20);">Mt 26:20</a> reads: "Now when even was come, he was sitting at meat with the twelve disciples"; <a onClick="return mV(\'Luk\',22,14);">Lu 22:14</a>: "And when the hour was come, he sat down, and the apostles with him"; while Mark has: "And when it was evening he cometh with the twelve." The last represents exactly the standpoint of one in the home who sees Jesus and the Twelve approaching. (And how admirably the terms "the twelve disciples," "the apostles" and "the twelve" suit Matthew, Luke, and Mark respectively.) Such phenomena, undesigned (save by the inspiring Spirit), are just those that would not have been invented later, and become the strongest attestation of the reliability of the tradition and this historicity of the narrative. Modern views opposed to this are touched upon in what follows.``1';
isbe[5816]='Mark, the Gospel According To, 2`VI. Sources and Integrity.<P>We have seen that, according to the testimony of the Fathers, Peter\'s preaching and teaching are at least the main source, and that many features of the Gospel support that view. We have seen, also, subtle but weighty reasons for believing that Mark added a little himself. Need we seek further sources, or does inquiry resolve itself into an analysis of Peter\'s teaching?<P>B. Weiss believes that Mark used a document now lost containing mainly sayings of Jesus, called Logia (L) in the earlier discussions, but now commonly known as Q (Quelle). In that opinion he has recently been joined by Sanday and Streeter. Harnack, Sir John Hawkins and Wellhausen have sought to reconstruct Q on the basis of the non-Markan matter in Matthew and Luke. Allen extracts it from Matthew alone, thinking that Mark also may have drawn a few sayings from it. Some assign a distinct source for <a onClick="return mV(\'Mar\',13,\'1-\');">Mark 13</a>. Streeter considers it a document written shortly after the fall of Jerusalem, incorporating a few utterances by Jesus and itself incorporated bodily by Mark. Other sources, oral or written, are postulated by Bacon for smaller portions and grouped under X. He calls the final redactor R—not Mark but a Paulinist of a radical type.<P>In forming a judgment much depends upon one\'s conception of the teaching method of Jesus and the apostles. Teaching and preaching are not synonymous terms. Matthew sums up the early ministry in Galilee under "teaching, preaching and healing," and gives us the substance of that teaching as it impressed itself upon him. Mark reports less of it, but speaks of it more frequently than either Matthew or Luke. Jesus evidently gave teaching a very large place, and a large proportion of the time thus spent was devoted to the special instruction of the inner circle of disciples. The range of that instruction was not wide. It was intensive rather than extensive. He held Himself to the vital topic of the kingdom of God. He must have gone over it again and again. He would not hesitate to repeat instructions which even chosen men found it so difficult to understand. Teaching by repetition was common then as it is now in the East. The word "catechize" (katecheo) implies that, and that word is used by Paul of Jewish (<a onClick="return mV(\'Rom\',2,18);">Ro 2:18</a>) and by Luke of Christian teaching (<a onClick="return mV(\'Luk\',1,4);">Lu 1:4</a>).<P>See <a href="./study/isbe/search.html?string=CATECHIST">CATECHIST</a>.<P>The novelty in His teaching was not in method so much as in content, authority and accompanying miraculous power (<a onClick="return mV(\'Mar\',1,27);">Mr 1:27</a>). Certainly He was far removed from vain repetition. His supreme concern was for the spirit. Just as certainly He was not concerned about a mere reputation for originality or for wealth and variety of resources. He was concerned about teaching them the truth so effectively that they would be prepared by intellectual clearness, as well as spiritual sympathy, to make it known to others. And God by His Providence, so kind to all but so often thwarted by human self-will was free to work His perfect work for Him and make all things work together for the furtherance of His purpose. Thus incidents occur, situations arise and persons of all types appear on the scene, calling forth fresh instruction, furnishing illustration and securing the presentation of truth in fullness with proper balance and emphasis and in right perspective.<P>Thus before His death the general character of that kingdom, its principles and prospects, were taught. That furnished the warp for the future Gospels. The essence, the substance and general form were the same for all the Twelve; but each from the standpoint of his own individually saw particular aspects and was impressed with special details. No one of them was large enough to grasp it all, for no one was so great as the Master. And it would be strange indeed, though perhaps not so strange as among us, if none of them wrote down any of it. Ramsay, Salmon and Palmer are quit justified in feeling that it may have been put in writing before the death of Jesus. It may well be that Matthew wrote it as it lay in his mind, giving us substantially Harnack\'s Q. John and James may have done the same and furnished Luke his main special source. But whether it was written down then or not, the main fact to be noted is that it was lodged in their minds, and that the substance was, and the details through mutual conference increasingly became, their common possession. They did not understand it all—His rising from the dead, for example. But the words were lodged in memory, and subsequent events made their meaning clear.<P>Then follow the great events of His death and resurrection, and for forty days in frequent appearances He taught them the things concerning the kingdom of God and expounded in all the Scriptures the things concerning Himself, especially the necessity of His death and resurrection. These furnished the woof of the future Gospels. But even yet they are not equipped for their task. So He promises them His Spirit, a main part of whose work will be to bring to their remembrance all He had said, to lead them into all the truth, and show them things to come. When He has come they will be ready to witness in power.<P>The apostles\' conception of their task is indicated in some measure by Peter when he insisted that an indispensable qualification in a successor to Judas was that he must have been with them from the beginning to the end of Christ\'s ministry, and so be conversant with His words and deeds. From the day of Pentecost onward they gave themselves preeminently to teaching. The thousands converted on that day continued in the teaching of the apostles. When the trouble broke out between Hebrews and Hellenists, the Seven were appointed because the apostles could not leave the word of God to serve tables. The urgency of this business may have been one reason why they stayed in Jerusalem when persecution scattered so many of the church (<a onClick="return mV(\'Act\',8,2);">Ac 8:2</a>). They were thus in close touch for years, not only through the struggle between Hebrews and Hellenists, but until the admission of the GentileCornelius and his friends by Peter had been solemnly ratified by the church in Jerusalem and possibly until the Council had declared against the contention that circumcision was necessary for salvation. During these years they had every opportunity for mutual conference, and the vital importance of the questions that arose would compel them to avail themselves of such opportunities. Their martyr-like devotion to Jesus would make them quick to challenge anything that might seem a misrepresentation of His teaching. The Acts account of their discussions at great crises proves that conclusively. To their success in training others and the accuracy of the body of catechetical instruction Luke pays fine tribute when he speaks of the "certainty" or undoubted truth of it (<a onClick="return mV(\'Luk\',1,4);">Lu 1:4</a>). Thus Jesus\' post-resurrection expositions, the experience of the years and the guidance of the Spirit are the source and explanation of the apostolic presentation of the gospel.<P>Of that company Peter was the recognized leader, and did more than any other to determine the mold into which at least the post-resurrection teachings were cast. Luke tells us of many attempts to record them. He himself in his brief reports of Peter\'s addresses sketches their broad outlines. Mark, at the request of Roman Christians and with Peter\'s approval, undertook to give an adequate account. Two special facts influenced the result—one, the character of the people for whom he wrote; the other, the existence (as we may assume) of Matthew\'s Q. It would be natural for him to supplement rather than duplicate that apostolic summary. Moreover, since Q presented mainly the ethical or law side of Christianity the supplement would naturally present the gospel side of it—and so become its complement—while at the same time this presentation and the needs of the people for whom he specially writes make it necessary to add something from the body of catechetical material, oral or written, not included in Q, as his frequent kai elegen, seems to imply (Buckley, 152ff). So Mk\'s is "the beginning of the Gospel." He introduces Jesus in the act of symbolically devoting Himself to that death for our sins and rising again, which constitutes the gospel and then entering upon His ministry by calling upon the people to "repent and believe in the gospel." The book is written from the standpoint of the resurrection, and gives the story of the passion and of the ministry in a perspective thus determined. About the same time it may be, Matthew, writing for Jewish Christians, combines this gospel side of the teaching with his own Q side of it, adding from the common stock or abridging as his purpose might suggest or space might demand. Later Luke does a similar service for Greek Christians (compare Harnack, The Twofold Gospel in the New Testament).<P>The only serious question about the integrity of the book concerns the last twelve verses, for a discussion of which see under III above. Some have suggested that <a onClick="return mV(\'Mar\',1,\'1-13\');">Mr 1:1-13</a> is akin to <a onClick="return mV(\'Mar\',16,\'9-20\');">16:9-20</A>, and may have been added by the same hand. But while vocabulary and connection are main arguments against the genuineness of the latter, in both these respects <a onClick="return mV(\'Mar\',1,\'1-13\');">1:1-13</A> is bound up with the main body of the book. Nor is there sufficient reason for denying <a onClick="return mV(\'Mar\',13,\'1-\');">Mark 13</a> as a true report of what Jesus said. Wendling\'s theory of three strata assignable to three different writers—historian, poet, and theologian—is quite overdrawn. Barring the closing verses, there is nothing which can possibly demand anything more than an earlier and a later edition by Mark himself, and the strongest point in favor of that is Luke\'s omission of <a onClick="return mV(\'Mar\',6,\'45-\');">Mr 6:45-8:26</a>. But Hawkins gives other reasons for that.<P>VII. Date and Place of Composition.<P>Ancient testimony is sharply divided. The Paschal Chronicle puts it in 40 AD, and many manuscripts, both uncial and cursive (Harnack, Chronologie,70,124) 10 or 12 years after the Ascension. These Swete sets aside as due to the mistaken tradition that Peter began work in Rome in the 2nd year of Claudius (42 AD). Similarly he would set aside the opinion of Chrysostom (which has some manuscripts subscriptions to support it) that it was written in Alexandria, as an error growing out of the statement of Eusebius (Historia Ecclesiastica, II, 16) that Mark went to Egypt and preached there the Gospel he composed. This he does in deference to the strong body of evidence that it was written in Rome about the time of Peter\'s death. Still there remains a discrepancy between Irenaeus, as commonly understood, and the other Fathers. For, so understood, Irenaeus places it after the death of Peter, whereas Jerome, Epiphanius, Origen and Clement of Alexandria clearly place it within Peter\'s lifetime. But it does not seem necessary so to understand Irenaeus. It may be that it was composed while Peter was living, but only published after his death. Christopherson (1570 AD) had suggested that and supported it by the conjectural emendation of ekdosin, "surrendering," "imprisonment" for exodon, in Irenaeus. Grabe, Mill and others thought Irenaeus referred, not to Peter\'s death, but to his departure from Rome on further missionary tours. But if we take exodon in that sense, it is better to understand by it departure from Palestine or Syria, rather than from Rome. Irenaeus\' statement that the apostles were now fully furnished for the work of evangelization (Adv. Haer., iii.1) certainly seems to imply that they were now ready to leave Palestine; and his next statement is that Matthew and Mark wrote their respective Gospels. And Eusebius (Historia Ecclesiastica, III, 24) states explicitly that Matthew committed his Gospel to writing "when he was about" to leave Palestine "to go to other peoples." The same may very possibly be true of Mark. If the fact be that Romans in Caesarea or Antioch made the request of Mark, we can easily understand how, by the time of Irenaeus, the whole incident might be transferred to Rome.<P>If this view be adopted, the date would probably not be before the council at Jerusalem and the events of <a onClick="return mV(\'Gal\',2,11);">Ga 2:11</a>ff. It is true the New Testament hints are that the apostles had left Jerusalem before that, but that they had gone beyond Syria is not likely. At any rate, at the time of the clash at Antioch they had not become so clear on the question touching Jews and Gentiles in the church as to be "fully furnished for the work of universal evangelization." But may it not be that Paul\'s strong statement of the seriousness of their error actually did settle those questions in the minds of the leaders? If so, and if with new vision and ardor, they turn to the work of world-wide evangelism, that would be a natural and worthy occasion for the composition of the Gospel. The place may be Caesarea or Antioch, and the date not earlier than 50 AD. This is the simplest synthesis of the ancient testimony. Modern opinion as to date has ranged more widely than the ancient. Baur and Strauss were compelled by their tendency and mythical theories to place it in the 2nd century. Recent criticism tends strongly to a date in the sixties of the 1st century, and more commonly the later sixties. This is based partly on hints in the Gospel itself, partly on its relation to Matthew and Luke. The hints usually adduced are <a onClick="return mV(\'Mar\',2,26);">Mr 2:26</a> and <a onClick="return mV(\'Mar\',13,\'1-\');">13</A>. The former, representing the temple as still standing, has force only if the relative clause be Mark\'s explanatory addition. <a onClick="return mV(\'Mar\',13,\'1-\');">Mark 13</a> has more force because, if Jerusalem had already fallen, we might expect some recognition of the fact.<P>Two other slight hints may be mentioned. The omission by the synoptists of the raising of Lazarus, and of the name of Mary in connection with the anointing of Jesus argues an early date when mention of them might have been unpleasant for the family. When the Fourth Gospel was published, they may have been no longer alive. The description of John as the brother of James (<a onClick="return mV(\'Mar\',5,37);">Mr 5:37</a>) may also take us back to an early date when James was the more honored of the two brothers—though the unusual order of the names may be due, as Zahn thinks, to the author\'s instinctively distinguishing that John from himself.<P>The relation of Mark to Matthew and Luke is important if the very widespread conviction of the priority of Mark be true. For the most likely date for Acts <span class="noTag">is</a> 62 AD, as suggested by the mention of Paul\'s two years\' residence in Rome, and Luke\'s Gospel is earlier than the Acts. It may well have been written at Caesarea about 60 AD; that again throws Mark back into the fifties.<P>The great objection to so early a date is the amount of detail given of the destruction of Jerusalem. Abbott and others have marshalled numerous other objections, but they have very little weight—most of them indeed are puerile. The real crux is that to accept an earlier date than 70 AD is to admit predictive prophecy. Yet to deny that, especially for a believer in Christ, is an unwarranted pre-judgment, and even so far to reduce it as to deny its presence in this passage is to charge Luke—a confessedly careful historian—with ascribing to Jesus statements which He never made.<P>T
