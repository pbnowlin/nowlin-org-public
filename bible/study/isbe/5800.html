he eagerness to date Matthew not earlier than 70 is due to the same feeling. But the problem here is complicated by the word "immediately" (<a onClick="return mV(\'Mat\',2,26);">2:26</A>). Some regard that as proof positive that it must have been written before the destruction of Jerusalem. Others (e.g. Allen and Plummer) feel that it absolutely forbids a date much later than 70 AD, and consider 75 AD as a limit. But is it not possible that by by eutheos (not parachrema), Christ, speaking as a prophet, may have meant no more than that the next great event comparable with the epochal overthrow of Judaism would be His own return and that the Divine purpose marches straight on from the one to the other? The New Testament nowhere says that the second advent would take place within that generation. See below under "Eschatology." There is therefore no sufficient reason in the Olivet discourse for dating Luke or Matthew later than 60 AD, and if Mark is earlier, it goes back into the fifties.<P>VIII. Historicity.<P>Older rationalists, like Paulus, not denying Mark\'s authorship, regarded the miraculous elements as misconceptions of actual events. Strauss, regarding these as mythical, was compelled to postulate a 2nd-century date. When, however, the date was pushed back to the neighborhood of 70 AD, the historicity was felt to be largely established. But recently theory of "pragmatic values" has been developed; Bacon thus states it: "The key to all genuinely scientific appreciation of Biblical narrative...is the recognition of motive. The motive...is never strictly historical but always etiological and frequently apologetic....The evangelic tradition consists of so and so many anecdotes, told and retold for the purpose of explaining or defending beliefs and practices of the contemporary church" (Modern Commentary, Beginnings of Gospel Story, 9). Bacon works out the method with the result that Mark is charged again and again with historical and other blunders. This view, like Baur\'s tendency-theory, has elements of truth. One is that the vocabulary of a later day may be a sort of necessary translation of the original expression. But translation is neither invention nor perversion. The other is that each author has his purpose, but that simply determines his selection and arrangement of material; it neither creates nor misrepresents it if the author be honest and well informed. The word "selection" is advisedly chosen. The evangelists did not lack material. Each of the Twelve had personal knowledge beyond the content of Q or of Mark. These represent the central orb—the one the ethical, the other the evangelic side of it—but there were rays of exceeding brightness radiating from it in all directions. Luke\'s introduction and John\'s explicit declaration attest that fact. And neither John nor Luke throws the slightest suspicion on the reliability of the material they did not use. There is no sufficient reason for charging them with misstating the facts to make a point. Bacon seems to trust any other ancient writers or even his own imagination rather than the evangelists. The test becomes altogether too subjective. Yet since Christianity is a historical revelation, perversion of history may become perversion of most vital religious teaching. In the last analysis, the critic undertakes to decide just what Jesus could or could not have done or said. The utter uncertainty of the result is seen by a comparison of Schmiedel and Bacon. The former is sure that the cry "My God, my God, why hast thou forsaken me" is one of the very few genuine sayings of Jesus; Bacon is equally sure that Jesus could not have uttered it. Bacon also charges Mark with "immoral crudity" because in <a onClick="return mV(\'Mar\',10,45);">10:45</a> he reports Jesus as saying that He came "to give his life a ransom for (anti) many." Thus, on two most vital matters he charges the evangelists with error because they run counter to his own religious opinions.<P>Plummer\'s remark is just (Commentary on Matthew, xxxiii): "To decide a priori that Deity cannot become incarnate, or that incarnate Deity must exhibit such and such characteristics, is neither true philosophy nor scientific criticism." And A.T. Robertson ("Matthew" in Bible for Home and School, 26): "The closer we get to the historic Jesus the surer we feel that He lived and wrought as He is reported in the Synoptic Gospels." The evangelists had opportunities to know the facts such as we have not. The whole method of their training was such as to secure accuracy. They support each other. They have given us sketches of unparalleled beauty, vigor and power, and have portrayed for us a Person moving among men absolutely without sin—a standing miracle. If we cannot trust them for the facts, there is little hope of ever getting at the facts at all.<P>IX. Purpose and Plan.<P>1. The Gospel for Romans:<P>Mark\'s purpose was to write down the Gospel as Peter had presented it to Romans, so say the Fathers, at least, and internal evidence supports them. In any additions made by himself he had the same persons in mind. That the Gospel was for Gentiles can be seen<p class="in15">(a) from the translation of the Aramaic expressions in <a onClick="return mV(\'Mar\',3,17);">Mr 3:17</a> (Boanerges), <a onClick="return mV(\'Mar\',5,41);">5:41</A> (Talitha cumi), <a onClick="return mV(\'Mar\',7,11);">7:11</A> (Corban), <a onClick="return mV(\'Mar\',10,46);">10:46</A> (Bartimaeus), <a onClick="return mV(\'Mar\',14,36);">14:36</A> (Abba), <a onClick="return mV(\'Mar\',15,22);">15:22</A> (Golgotha);<p class="in15">(b) in the explanation of Jewish customs in <a onClick="return mV(\'Mar\',14,12);">14:12</a> and <a onClick="return mV(\'Mar\',15,42);">15:42</A>;<p class="in15">(c) from the fact that the Law is not mentioned and the Old Testament is only once quoted in Mark\'s own narrative;<p class="in15">(d) the Gentile sections, especially in <a onClick="return mV(\'Mar\',6,\'1-\');">Mark 6-8</a>.<P>That it was for Romans is seen in<p class="in15">(a) the explanation of a Greek term by a Latin in <a onClick="return mV(\'Mar\',12,42);">Mr 12:42</a>;<p class="in15">(b) the preponderance of works of power, the emphasis on authority (<a onClick="return mV(\'Mar\',2,10);">2:10</A>), patience and heroic endurance (<a onClick="return mV(\'Mar\',10,17);">10:17</A>ff);<p class="in15">(c) <a onClick="return mV(\'Mar\',10,12);">10:12</A> which forbids a practice that was not Jewish but Roman.<P>Those who believe it was written at Rome find further hints in the mention of Rufus (<a onClick="return mV(\'Mar\',15,21);">15:21</A>; compare <a onClick="return mV(\'Rom\',16,13);">Ro 16:13</a>) and the resemblance between <a onClick="return mV(\'Mar\',7,\'1-23\');">7:1-23</a> and <a onClick="return mV(\'Rom\',14,1);">Ro 14</a>. The Roman centurion\'s remark (<a onClick="return mV(\'Mar\',15,39);">15:39</a>) is the Q.E.D. of the author, and bears the same relation to Mark\'s purpose as <a onClick="return mV(\'Jhn\',20,31);">Joh 20:31</a> to John\'s.<P>But one cannot escape the feeling that we have in this Gospel the antitype of the Servant of Yahweh. A.B. Davidson (Old Testament Theology, 365) tells us that there are two great figures around which Isaiah\'s thoughts gather—the King and the Servant. The former rises "to the unsurpassable height of \'God with us,\' \'mighty God,\' teaching that in Him God shall be wholly present with His people." The Servant is the other. The former is depicted in Matthew, who also identifies Him with the Servant (<a onClick="return mV(\'Mat\',12,18);">12:18</A>f); the latter by Mark who identifies Him with the Messianic King (<a onClick="return mV(\'Mar\',11,10);">11:10</a>; <a onClick="return mV(\'Mar\',14,62);">14:62</A>). Davidson summarizes the description of the Servant: "<P>(1) He is God\'s chosen;<P>(2) He has a mission to establish judgment on the earth....The word is His instrument and the Lord is in the Word, or rather He Himself is the impersonation of it;<P>(3) His endowment is the Spirit and an invincible faith;<P>(4) There is in Him a marvelous combination of greatness and lowliness;<P>(5) There are inevitable sufferings—bearing the penalty of others\' sins;<P>(6) He thus redeems Israel and brings light to the Gentiles.<P>(7) Israel\'s repentance and restoration precede that broader blessing."<P>It is not strange that this Servant-conception—this remarkable blend of strength and submission, achieving victory through apparent defeat—should appeal to Peter. He was himself an ardent, whole-souled man who knew both defeat and victory. Moreover, he himself had hired servants (<a onClick="return mV(\'Mar\',1,20);">Mr 1:20</a>), and now for years had been a servant of Christ (compare <a onClick="return mV(\'Act\',4,29);">Ac 4:29</a>). That it did appeal to him and became familiar to the early Christians can be seen from <a onClick="return mV(\'Act\',3,13);">Ac 3:13</a> and <a onClick="return mV(\'Act\',4,30);">4:30</a>. In his First Epistle he has 17 references to Isaiah, 9 of which belong to the second part. Temperamentally Mark seems to have been like Peter. And his experience in a wealthy home where servants were kept (<a onClick="return mV(\'Act\',12,13);">Ac 12:13</a>), and as himself huperetes of apostles in Christian service, fitted him both to appreciate and record the character and doings of the perfect servant—the Servant of Yahweh. For Roman Christians that heroic figure would have a peculiar fascination.<P>2. Plan of the Gospel:<P>The plan of the Gospel seems to have been influenced by this conception. Christ\'s kingship was apprehended by the Twelve at a comparatively early date. It was not until after the resurrection, when Jesus opened to them the Scriptures, that they saw Him as the Suffering Servant of <a onClick="return mV(\'Isa\',53,\'1-\');">Isa 53</a>. That gave Peter his gospel as we have already seen, and at the same time the general lines of its presentation. We see it sketched for Romans in <a onClick="return mV(\'Act\',10,\'1-\');">Ac 10</a>. That sketch is filled in for us by Mark. So we have the following analysis:<P>Title: <a onClick="return mV(\'Mar\',1,1);">Mark 1:1</a><P>1. The Baptist preparing the way: <a onClick="return mV(\'Mar\',1,\'2-8\');">Mr 1:2-8</a>; compare <a onClick="return mV(\'Isa\',40,3);">Isa 40:3</a> f.<P>2. Devotement of Jesus to death for us and endowment by the Spirit: <a onClick="return mV(\'Mar\',1,\'9-13\');">Mr 1:9-13</a>; compare <a onClick="return mV(\'Isa\',42,1);">Isa 42:1</a>ff.<P>3. His greatness—the Galilean Ministry: <a onClick="return mV(\'Mar\',1,\'14-\');">Mr 1:14-8:30</a>; compare <a onClick="return mV(\'Isa\',43,\'1-\');">Isa 43-52:12</a>.<P class="in15">(1) In the synagogue: period of popular favor leading to break with Pharisaic Judaism: <a onClick="return mV(\'Mar\',1,\'14-\');">Mr 1:14-3:6</a>.<P class="in15">(2) Outside the synagogue: parabolic teaching of the multitude, choice and training of the Twelve and their Great Confession: <a onClick="return mV(\'Mar\',3,\'7-\');">Mr 3:7ff through 8:30</a>.<P>4. His lowliness—mainly beyond Galilee: <a onClick="return mV(\'Act\',8,\);">Mr 8:31-15</span>; compare <a onClick="return mV(\'Isa\',52,\'13-\');">Isa 52:13</a>-<a onClick="return mV(\'Isa\',63,\'1-9\');">53:9</a>.<P class="in15">(1) In the north—announcement of death: <a onClick="return mV(\'Mar\',8,31);">Mr 8:31-9:29</a>.<P class="in15">(2) On the way to Jerusalem and the cross—through Galilee (<a onClick="return mV(\'Mar\',9,\'30-50\');">Mr 9:30-50</a>), Peraea (<a onClick="return mV(\'Mar\',10,\'1-45\');">Mr 10:1-45</a>), Judea (<a onClick="return mV(\'Mar\',10,\'46-52\');">Mr 10:46-52</a>).<P class="in15">(3) The triumphal entry into Jerusalem (<a onClick="return mV(\'Mar\',11,\'1-11\');">Mr 11:1-11</a>).<P class="in15">(4) In Jerusalem and vicinity—opposed by the leaders (<a onClick="return mV(\'Mar\',11,\12-\');">Mr 11:12</a>-<a onClick="return mV(\'Mar\',12,\1-44\');">12:44</a>); foretelling their doom (<a onClick="return mV(\'Mar\',13,\'1-\');">Mr 13</a>); preparing for death (<a onClick="return mV(\'Mar\',14,\'1-42\');">Mr 14:1-42</a>); betrayed, condemned, crucified and buried in a rich man\'s tomb (<a onClick="return mV(\'Mar\',14,\43-\');">Mr 14:43</a>-<a onClick="return mV(\'Mar\',15,\1-\');">15</a>).<P>5. His victory—the resurrection: <a onClick="return mV(\'Mar\',16,\'1-\');">Mark 16</a>; compare <a onClick="return mV(\'Isa\',53,\'10-12\');">Isa 53:10-12</a>. What follows in Isaiah is taken up in Acts, for the first part of which Peter or Mark may have been Luke\'s main source.<P>Generally speaking the plan is chronological, but it is plain that the material is sometimes grouped according to subject-matter.<P>This Servant-conception may also be the real explanation of some of the striking features of this Gospel, e.g. the absence of a genealogy and any record of His early life; the frequent use of the word "straightway"; the predominance of deeds; the Son\'s not knowing the day (<a onClick="return mV(\'Mar\',13,32);">Mr 13:32</a>); and the abrupt ending at <a onClick="return mV(\'Mar\',16,8);">Mr 16:8</a> (see III).<P>X. Leading Doctrines.<P>1. Person of Christ:<P>The main one, naturally, is the Person of Christ. The thesis is that He is Messiah, Son of God, Author (Source) of the gospel. The first half of the book closes with the disciples\' confession of His Messiahship; the second, with the supreme demonstration that He is Son of God. Introductory to each is the Father\'s declaration of Him as His Beloved Son (<a onClick="return mV(\'Mar\',1,11);">Mr 1:11</a>; <a onClick="return mV(\'Mar\',9,7);">9:7</a>). That the sonship is unique is indicated in <a onClick="return mV(\'Mar\',12,6);">Mr 12:6</a> and <a onClick="return mV(\'Mar\',13,32);">13:32</A>. At the same time He is the Son of Man—true man (<a onClick="return mV(\'Mar\',4,38);">4:38</a>; <a onClick="return mV(\'Mar\',8,5);">8:5</a>; <a onClick="return mV(\'Mar\',14,34);">14:34</a>); ideal man as absolutely obedient to God (<a onClick="return mV(\'Mar\',10,40);">10:40</A>; <a onClick="return mV(\'Mar\',14,36);">14:36</a>), and Head of humanity (<a onClick="return mV(\'Mar\',2,10,28);">2:10,28</a>), their rightful Messiah or King (<a onClick="return mV(\'Mar\',1,1);">1:1</a>; <a onClick="return mV(\'Mar\',14,62);">14:62</A>)—yet Servant of all (<a onClick="return mV(\'Mar\',10,44);">10:44</a>f); David\'s Son and David\'s Lord (<a onClick="return mV(\'Mar\',12,37);">12:37</A>). The unique Sonship is the final explanation of all else, His power, His knowledge of both present (<a onClick="return mV(\'Mar\',2,5,8);">2:5,8</a>; <a onClick="return mV(\'Mar\',8,17);">8:17</a>) and future (<a onClick="return mV(\'Mar\',8,31);">8:31</a>; <a onClick="return mV(\'Mar\',10,39);">10:39</a>; <a onClick="return mV(\'Mar\',14,27);">14:27</a>; <a onClick="return mV(\'Mar\',13,\'1-\');">13</a>), superiority to all men, whether friends (<a onClick="return mV(\'Mar\',1,7);">1:7</a>; <a onClick="return mV(\'Mar\',9,3);">9:3</a>ff) or foes (<a onClick="return mV(\'Mar\',12,34);">12:34</a>), and to superhuman beings, whether good (<a onClick="return mV(\'Mar\',13,32);">13:32</a>) or evil (<a onClick="return mV(\'Mar\',1,13,32);">1:13,32</a>; <a onClick="return mV(\'Mar\',3,27);">3:27</a>).<P>2. The Trinity:<P>The Father speaks in <a onClick="return mV(\'Mar\',1,11);">Mr 1:11</a>; <a onClick="return mV(\'Mar\',9,7);">9:7</a>; is spoken of in <a onClick="return mV(\'Mar\',13,32);">13:32</a>; and spoken to in <a onClick="return mV(\'Mar\',14,36);">14:36</a>. The usual distinction between His fatherhood in relation to Christ and in relation to us is seen in <a onClick="return mV(\'Mar\',11,5);">11:25</a>; <a onClick="return mV(\'Mar\',12,6);">12:6</a> and <a onClick="return mV(\'Mar\',13,32;">13:32</a>. The Spirit is mentioned in <a onClick="return mV(\'Mar\',1,8,10,12);">1:8,10,12</a>; <a onClick="return mV(\'Mar\',3,29);">3:29</a> and <a onClick="return mV(\'Mar\',13,11);">13:11</A>. The last passage especially implies His personality.<P>3. Salvation:<P>As to salvation, the Son is God\'s final messenger (<a onClick="return mV(\'Mar\',12,6);">Mr 12:6</a>); He gives His life a ransom instead of many (<a onClick="return mV(\'Mar\',10,45);">Mr 10:45</a>); His blood shed is thus the blood of the covenant (<a onClick="return mV(\'Mar\',14,24);">Mr 14:24</a>); that involves for Him death in the fullest sense, including rupture of fellowship with God (<a onClick="return mV(\'Mar\',15,34);">Mr 15:34</a>). From the outset He knew what was before Him—only so can His baptism be explained (<a onClick="return mV(\'Mar\',1,5,11);">Mr 1:5,11</a>; compare <a onClick="return mV(\'Mar\',2,20);">2:20</a>); but the horror of it was upon Him, especially from the transfiguration onward (<a onClick="return mV(\'Mar\',10,32);">Mr 10:32</a>; <a onClick="return mV(\'Mar\',14,\'33-36\');">14:33-36</a>); that was the Divine provision for salvation: He gave His life (<a onClick="return mV(\'Mar\',10,45);">Mr 10:45</a>). The human condition is repentance and faith (<a onClick="return mV(\'Mar\',1,15);">Mr 1:15</a>; <a onClick="return mV(\'Mar\',2,5);">2:5</a>; <a onClick="return mV(\'Mar\',5,34,36);">5:34,36</a>; <a onClick="return mV(\'Mar\',6,5);">6:5</a>; <a onClick="return mV(\'Mar\',9,23);">9:23</a>; <a onClick="return mV(\'Mar\',16,16);">16:16</a>), though He bestows lesser blessings apart from personal faith (<a onClick="return mV(\'Mar\',1,\'23-26\');">Mr 1:23-26</a>; <a onClick="return mV(\'Mar\',5,\'1-20\');">5:1-20</a>; <a onClick="return mV(\'Mar\',6,\'35-43\');">6:35-43</a>). The power of faith, within the will of God, is limitless (<a onClick="return mV(\'Mar\',11,25);">Mr 11:25</a>); faith leads to doing the will of God, and only such as do His will are Christ\'s true kindred (<a onClick="return mV(\'Mar\',3,35);">Mr 3:35</a>). Salvation is possible for Gentile as well as Jew (<a onClick="return mV(\'Mar\',7,\'24-30\');">Mr 7:24-30</a>).<P>4. Eschatology:<P>The eschatology of this Gospel is found chiefly in <a onClick="return mV(\'Mar\',8,\'34-\');">Mr 8:34</a>-<a onClick="return mV(\'Mar\',9,1);">9:1</a> and <a onClick="return mV(\'Mar\',9,13);">13</a>. In <a onClick="return mV(\'Mar\',9,1);">Mr 9:1</a> we have a prediction of the overthrow of Jerusalem which is here given as a type and proof of His final coming for judgment and reward which He has had in mind in the preceding verses. <a onClick="return mV(\'Mar\',13,\'1-\');">Mark 13</a> is a development of this—the destruction of Jerusalem being meant in <a onClick="return mV(\'Mar\',13,\'5-13\');">13:5-23</a> and <a onClick="return mV(\'Mar\',13,\'28-31\');">28-31</a>, the final coming in <a onClick="return mV(\'Mar\',13,\'24-27\',32);">13:24-27</a> and <a onClick="return mV(\'Mar\',13,32);">32</a>. The distinction is clearly marked by the pronouns (tauta, and ekeines, in <a onClick="return mV(\'Mar\',13,30);">13:30</a> and <a onClick="return mV(\'Mar\',13,32);">32</a> (compare <a onClick="return mV(\'Mat\',24,34,36);">Mt 24:34,36</a>). In each passage (<a onClick="return mV(\'Mar\',9,\'1-\');">Mr 9:1</a>; <a onClick="return mV(\'Mar\',13,30);">13:30</a>) the fall of Jerusalem is definitely fixed as toward the close of that generation; the time of the latter is known only to the Father (<a onClick="return mV(\'Mar\',13,32);">Mr 13:32</a>). Between Christ\'s earthly life and the Second Coming He is seated at the right hand of God (<a onClick="return mV(\'Mar\',12,36);">Mr 12:36</a>; <a onClick="return mV(\'Mar\',16,19);">16:19</a>). The resurrection which He predicted for Himself (<a onClick="return mV(\'Mar\',8,31);">Mr 8:31</a>; <a onClick="return mV(\'Mar\',9,31);">9:31</a>; <a onClick="return mV(\'Mar\',10,34);">10:34</a>) and which actually took place (<a onClick="return mV(\'Mar\',16,\'1-\');">Mark 16</a>), He affirms for others also (<a onClick="return mV(\'Mar\',12,\'24-27\');">Mr 12:24-27</a>).<P>LITERATURE.<P>The works marked with the asterisk are specially commended; for very full list see Moffat\'s Introduction.<P>Commentaries:<P>Fritzsche, 1830; Olshausen, translated 1863; J.A. Alexander, 1863; Lange, translated 1866; Meyer,1866,American edition, 1884; Cook, Speaker\'s Commentary, 1878; Plumptre, Ellicott\'s, 1879; Riddle, Schaff\'s, 1879; W.N. Clarke, Amer. Comm., 1881; Lindsay, 1883; Broadus, 1881 and 1905; Morison, 1889; H.G. Holtzmann(3), 1901; Maclean, Cambridge Bible, 1893; Gould, International Critical Commentary, 1896; Bruce, The Expositor Greek Testament, 1897; B. Weiss, Meyer, 1901; Menzies, The Earliest Gospel, 1901; Salmond, Century Bible; Wellhausen2, 1909; Swete, 1908; Bacon, The Beginnings of Gospel Story, 1909; Wohlenberg, Zahn\'s Series, Das Evangelium des Markus, 1910. For the earlier see Swete.<P>Introduction:<P>Eichhorn, 1827; Credner, 1836; Schleiermacher, 1845; De Wette, 1860; Bleek,1866,translated 1883; Reuss,1874,translated 1884; B. Weiss. 2nd edition, translated 1886; 3rd edition, 1897; H.J. Holtzmann, 1892; Th. Zahn,1897,translated 1909; Godet, 1899; Julicher(6), 1906; von Soden,1905,translated 1906; Wendling, Ur-Marcus, 1905; A. Muller, Geschichtskerne in den Evang., 1905; Wrede, Origin of New Testament Scriptures,1907,translated 1909; Horne, 1875; Westcott, Introduction to Study of Gospels, 7th edition,1888,and The Canon, 6th edition, 1889; Salmon, 1897; Adeney, 1899; Bacon, 1900; Burton, 1904; Moffat, Historical New Testament, 1901; Introduction to the Literature of New Testament, 1911; Peake, 1909; Gregory, Einleitung., 1909; Charteris, Canonicity, 1881; The New Testament Scriptures,1882,and popular Intros by Plumptre, 1883; Lumby, 1883; Kerr, 1892; McClymont, 1893; Dods, 1894; Lightfoot, Essays on the Work Entitled Supernatural Religion, 1889; Sanday, Gospels in the 2nd Century, 1874; Stanton, Gospels as Historical Documents, I, 1903; II, 1909.<P>Mark and the Synoptic Problem:<P>Rushbrooke, Synopticon, 1880; Wright, Synopsis of the Gospels in Greek, 3rd edition, 1906; Composition of the Four Gospels, 1890; Some New Testament Problems, 1898; H.J. Holtzmann, Die synopt. Evang., 1863; Weizsacker, Untersuch. uber die evang. Gesch., 2nd edition, 1901; Wernle, Die synopt. Frage, 1899; Loisy, Les ev. syn., 1908; Wellhausen, Einleitung in die drei ersten Evang., 1905; Blass, Origin and Char. of Our Gospels, English translation, xviii; Norton, Internal Evid. of the Genuineness of the Gospels, 1847; F.H. Woods, Stud. Bibl., II, 594; Palmer, Gospel Problems and Their Solution, 1899; J.A. Robinson, The Study of the Gospels, 1902; Gloag, Introduction to the Synoptic Gospels; Burton, Some Principles of Literary Criticism and Their Application to the Synoptic Problem, 1904; Stanton, as above, and in Hastings, Dictionary of the Bible (five volumes), II, 234ff; Turner, "Chronology of New Testament," Hastings, Dictionary of the Bible (five volumes), I, 403ff; J.J. Scott, The Making of the Gospels, 1905; Burkitt, Gospel History and Its Transmission, 1906; Salmon, Human Element in the Gospels, 1907; Harnack, Gesch. der altchristl. Lit., I, 1893; II, 2nd edition, 1904; Beitrage zur Einleitung in das New Testament, 4 volumes, translated in "Crown Theol. Lib.," Luke the Physician, 1907; The Sayings of Jesus, 1908; The Acts of the Apostles, 1909; The Date of the Acts and of the Synoptic Gospels, 1911; Montefiore, The Synoptic Gospels, 1909; Hawkins, Horae Synopticae, 2nd edition, 1909; Denney, Jesus and the Gospel; Cambridge Biblical Essays, edition by Swete, 1909; Oxford Studies in the Syn. Problem, edition by Sanday, 1911; Salmond, Hastings, Dictionary of the Bible (five volumes), III, 248ff; Maclean, Hastings, Dictionary of Christ and the Gospels, II, 120f; Petrie, Growth of Gospels Shown by Structural Criticism, 1910; Buckley, Introduction to Synoptic Problem, 1912.<P>The Language:<P>Dalman, Words of Jesus, translated 1909; Deissmann, Bible Studies, translated 1901; Light from the Ancient East, translated 1910; Allen, The Expositor, I, English translation, 1902; Marshall, The Expositor, 1891-94; Wellhausen, Einleitung.; Hatch, Essays in Biblical Greek, 1889; Swete and Hawkins.<P>Text:<P>Westcott and Hort, The New Testament in Greek, Introduction to the New Testament in Greek; Salmon, Introduction, chapter ix; Gregory, Text and Canon; Morison and Swete, in Commentary; Burgon, The Last Twelve Verses of Mark.<P>Special:<P>Schweizer, Quest of the Historical Jesus, 1910; Sanday, Life of Christ in Recent Research; Emmet, Eschatological Question in the Gospels, 1911; Hogg, Christ\'s Message of the Kingdom, 1911; Forbes, The Servant of the Lord, 1890; Davidson, Old Testament Theology.``56';

isbe[5818]='Market; Marketplace; Mart`mar\'-ket, mar\'-ketplas, mart (ma\'arabh, cachar; agora):<P>(1) Ma\'arabh, from a root meaning "trading" and hence, goods exchanged, and so "merchandise" in the Revised Version (British and American), "market" in the King James Version, occurs only in <a onClick="return mV(\'Eze\',27,13,17,19,25);">Eze 27:13,17,19,25</a>, and is translated correctly "merchandise" in both the English Revised Version and the American Standard Revised Version.<P>(2) Cachar means a "trading emporium," hence, mart, and merchandise. It occurs only in <a onClick="return mV(\'Isa\',23,3);">Isa 23:3</a> (see <a href="./study/isbe/search.html?string=MERCHANDISE">MERCHANDISE</a>).<P>(3) Agora, from root meaning "to collect," means a "town meeting-place," "resort of the people," so a place where the public generally met to exchange views and wares. No doubt, the central place soon filling up, the people thronged the adjoining streets, and so in time each street thus used came to be called agora, "marketplace"; translated "marketplace(s)" in 1Esdras 2:18; Tobit 2:3; <a onClick="return mV(\'Mat\',11,16);">Mt 11:16</a>; <a onClick="return mV(\'Mat\',20,3);">20:3</a>; <a onClick="return mV(\'Mat\',23,7);">23:7</a>; <a onClick="return mV(\'Mar\',6,56);">Mr 6:56</a>; <a onClick="return mV(\'Mar\',7,4);">7:4</a>; <a onClick="return mV(\'Mar\',12,38);">12:38</a>; <a onClick="return mV(\'Luk\',7,32);">Lu 7:32</a>; <a onClick="return mV(\'Luk\',11,43);">11:43</a>; <a onClick="return mV(\'Luk\',20,46);">20:46</a>; <a onClick="return mV(\'Act\',16,19);">Ac 16:19</a>; <a onClick="return mV(\'Act\',17,17);">17:17</a>; "Market of Appius" in <a onClick="return mV(\'Act\',28,15);">Ac 28:15</a> means, probably, "street" (see <a href="./study/isbe/search.html?string=APPII+FORUM">APPII FORUM</a>).<P>The marketplace in New Testament times was the public open space, either simple or ornate, in town, city or country, where (<a onClick="return mV(\'Mar\',6,56);">Mr 6:56</a>) the people congregated, not only for exchange of merchandise, but for one or more of the following purposes:<P>(1) a place where the children came together to sing, dance and play, a "back-to-date" municipal recreation center (<a onClick="return mV(\'Mat\',11,16,17);">Mt 11:16,17</a>; <a onClick="return mV(\'Luk\',7,32);">Lu 7:32</a>);<P>(2) a place for loafers, a sort of ancient, irresponsible labor bureau where the out-of-work idler waited the coming of an employer with whom he might bargain for his services, usually by the day (<a onClick="return mV(\'Mat\',20,\'1-16\');">Mt 20:1-16</a>);<P>(3) a place where the proud pretender could parade in long robes and get public recognition, "salutations in the market-places," e.g. the scribes and Pharisees against whom Jesus emphatically warns His disciples (<a onClick="return mV(\'Mat\',23,\'3-7\');">Mt 23:3-7</a>; <a onClick="return mV(\'Mar\',12,38);">Mr 12:38</a>; <a onClick="return mV(\'Luk\',11,43);">Lu 11:43</a>; <a onClick="return mV(\'Luk\',20,46);">20:46</a>);<P>(4) a place where the sick were brought for treatment, the poor man\'s sanatorium, a municipal hospital; Jesus "who went about doing good" often found His opportunity there (<a onClick="return mV(\'Mar\',6,56);">Mr 6:56</a>);<P>(5) a place of preliminary hearing in trials, where the accused might be brought before rulers who were present at the time, e.g. Paul and Silas at Philippi (<a onClick="return mV(\'Act\',16,19);">Ac 16:19</a>);<P>(6) a place for religious and probably political or philosophical discussion (gossip also), a forum, a free-speech throne; no doubt often used by the early apostles not only as a place of proclaiming some truth of the new religion but also a place of advertisement for a coming synagogue service, e.g. Paul in Athens (<a onClick="return mV(\'Act\',17,17);">Ac 17:17</a>).<P>The <span class="noTag">Wisdom of Solomon 15:12</span> (the King James Version) has "They counted ... our time here a market for gain," the Revised Version (British and American) "a gainful fair," margin "a keeping of festival," Greek panegurismos, "an assembly of all." Such assemblies offered particular opportunities for business dealings.``142';
isbe[5819]='Marmoth`mar\'-moth, mar\'-moth (Codex Vaticanus, Marmothi; Codex Alexandrinus, Marmathi): "The priest the son of Urias" to whom were committed the silver and gold for the temple by the returning exiles (1Esdras 8:62) = "Meremoth" in parallel <a onClick="return mV(\'Ezr\',8,33);">Ezr 8:33</a>.``1';
isbe[5820]='Maroth`ma\'-roth, ma\'-roth (maroth; (katoikousa) (odunas): An unknown town probably in the Philistine plain, named by Micah (<a onClick="return mV(\'Mic\',1,12);">1:12</A>).``1';
isbe[5821]='Marriage`mar\'-ij:<P>Introduction<P>Scope and Viewpoint of the Present Article<P>1. Marriage among the Hebrews<P>2. Betrothal the First Formal Part<P>3. Wedding Ceremonies<P>4. Jesus\' Sanction of the Institution<P>5. His Teaching concerning Divorce<P>LITERATURE<hr /><P>It would be interesting to study marriage biologically and sociologically, to get the far and near historical and social background of it as an institution, especially as it existed among the ancient Jews, and as it figures in the teaching of Jesus as recorded in the New Testament. For, like all social institutions, marriage, and the family which is the outcome of marriage, must be judged, not by its status at any particular time, but in the light of its history. Such a study of it would raise a host of related historic questions, e.g. What was its origin? What part has it played in the evolution and civilization of the race? What social functions has it performed? And then, as a sequel, Can the services it has rendered to civilization and progress be performed or secured in any other way? This, indeed, would call for us to go back even farther—to try to discover the psychology of the institution and its history, the beliefs from which it has sprung and by which it has survived so long. This were a task well worth while and amply justified by much of the thinking of our time; for, as one of the three social institutions that support the much challenged form and fabric of modern civilization, marriage, private property and the state, its continued existence, in present form at least, is a matter of serious discussion and its abolition, along with the other two, is confidently prophesied. "Marriage, as at present understood, is an arrangement most closely associated with the existing social status and stands or falls with it" (Bebel, Socialism and Sex,199,Reeves, London; The Cooperative Commonwealth in Its Outline, Gronlund, 224). But such a task is entirely outside of and beyond the purpose of this article.<P>Neither the Bible in general, nor Jesus in particular, treats of the family from the point of view of the historian or the sociologist, but solely from that of the teacher of religion and morals. In short, their point of view is theological, rather than sociological. Moses and the prophets, no less than Jesus and His apostles, accepted marriage as an existing institution which gave rise to certain practical, ethical questions, and they dealt with it accordingly. There is nothing in the record of the teachings of Jesus and of His apostles to indicate that they gave to marriage any new social content, custom or sanction. They simply accepted it as it existed in the conventionalized civilization of the Jews of their day and used it and the customs connected with it for ethical or illustrative purposes. One exception is to be made to this general statement, namely, that Jesus granted that because of the exigencies of the social development Moses had modified it to the extent of permitting and regulating divorce, clearly indicating, however, at the same time, that He regarded such modification as out of harmony with the institution as at first given to mankind. According to the original Divine purpose it was monogamous, and any form of polygamy, and apparently of divorce, was excluded by the Divine idea and purpose. The treatment of the subject here, therefore, will be limited as follows: Marriage among the Ancient Hebrews and Other Semites; Betrothal as the First Formal Part of the Transaction; Wedding Ceremonies Connected with Marriage, especially as Reflected in the New Testament; and Jesus\' Sanction and Use of the Institution, Teaching concerning Divorce, etc.<P>1. Marriage among the Hebrews:<P>With the Hebrews married life was the normal life. Any exception called for apology and explanation. "Any Jew who has not a wife is no man" (Talmud). It was regarded as awaiting everyone on reaching maturity; and sexual maturity comes much earlier indeed in the East than with us in the West—in what we call childhood. The ancient Hebrews, in common with all Orientals, regarded the family as the social unit. In this their view of it coincides with that, of modern sociologists. Of the three great events in the family life, birth, marriage and death, marriage was regarded as the most important. It was a step that led to the gravest tribal and family consequences. In case of a daughter, if she should prove unsatisfactory to her husband, she would likely be returned to the ancestral home, discarded and discredited, and there would be almost inevitably a feeling of injustice engendered on one side, and a sense of mutual irritation between the families (<a onClick="return mV(\'Jdg\',14,20);">Jud 14:20</a>; <a onClick="return mV(\'1Sa\',18,19);">1Sa 18:19</a>). If she failed to pass muster with her mother-in-law she would just as certainly have to go, and the results would be much the same (compare customs in China). It was a matter affecting the whole circle of relatives, and possibly tribal amity as well. It was natural and deemed necessary, therefore, that the selection of the wife and the arrangement of all contractual and financial matters connected with it should be decided upon by the parents or guardians of the couple involved. Though the consent of the parties was sometimes sought (<a onClick="return mV(\'Gen\',24,8);">Ge 24:8</a>) and romantic attachments were not unknown (<a onClick="return mV(\'Gen\',29,20);">Ge 29:20</a>; <a onClick="return mV(\'Gen\',34,3);">34:3</a>; <a onClick="return mV(\'Jdg\',14,1);">Jud 14:1</a>; <a onClick="return mV(\'1Sa\',18,20);">1Sa 18:20</a>), the gift or woman in the case was not currently thought of as having a personal existence at her own disposal. She was simply a passive unit in the family under the protection and supreme control of father or brothers. In marriage, she was practically the chattel, the purchased possession and personal property of her husband, who was her ba\'al or master (<a onClick="return mV(\'Hsa\',2,16);">Ho 2:16</a>), she herself being be\'ulah (<a onClick="return mV(\'Isa\',62,4);">Isa 62:4</a>). The control, however, was not always absolute (<a onClick="return mV(\'Gen\',26,34);">Ge 26:34</a>; <a onClick="return mV(\'Exd\',2,21);">Ex 2:21</a>).<P>The bargaining instinct, so dominant among Orientals then as now, played a large part in the transaction. In idea the family was a little kingdom of which the father was the king, or absolute ruler. There are many indications, not only that the family was the unit from which national coherence was derived, but that this unit was perpetuated through the supremacy of the oldest male. Thus society became patriarchal, and this is the key of the ancient history of the family and the nation. Through the expansion of the family group was evolved in turn the clan, the tribe, the nation, and the authority of the father became in turn that of the chief, the ruler, and the king. The Oriental cannot conceive, indeed, of any band, or clan, or company without a "father," even though there be no kith or kinship involved in the matter. The "father" in their thought, too, was God\'s representative, and as such he was simply carrying out God\'s purpose, for instance, in selecting a bride for his son, or giving the bride to be married to the son of another. This is as true of the Far East as of the Near East today. Accordingly, as a rule, the young people simply acquiesced, without question or complaint, in what was thus done for them, accepting it as though God had done it directly. Accordingly, too, the family and tribal loyalty overshadowed love-making and patriotism, in the larger sense. Out of this idea of the solidarity and selectness of the tribe and family springs the overmastering desire of the Oriental for progeny, and for the conservation of the family or the tribe at any cost. Hence, the feuds, bloody and bitter, that persist between this family or tribe and another that has in any way violated this sacred law.<P>Traces of what is known as beena marriage are found in the Old Testament, e.g. that of Jacob, where Laban claims Jacob\'s wives and children as his own (<a onClick="return mV(\'Gen\',31,31,43);">Ge 31:31,43</a>), and that of Moses (<a onClick="return mV(\'Exd\',2,21);">Ex 2:21</a>; <a onClick="return mV(\'Exd\',4,18);">4:18</a>). This is that form of marriage in which the husband is incorporated into the wife\'s tribe, the children belonging to her tribe and descent being reckoned on her side (compare W. Robertson Smith, Kinship and Marriage in Early Arabia, 94). In Samson\'s case we seem to have an instance of what is known among Arabs as tsadqat marriage (from tsadaq, "gift"), the kid here being the customary tsadaq (<a onClick="return mV(\'Jdg\',14,\'1-\');">Jud 14</a>; <a onClick="return mV(\'Jdg\',15,\'1-\');">15:1</a>; <a onClick="return mV(\'Jdg\',16,4);">16:4</a>). There is no hint that he meant to take his wife home. It is differentiated from prostitution in that no disgrace is attached to it and the children are recognized as legitimate by the tribe. Such marriages make it easier to understand the existence of the matriarchate, or the custom of reckoning the descent of children and property through the mothers. The influence of polygamy would work in the same direction, subdividing the family into smaller groups connected with the several wives. There is, however, no clear evidence in the Old Testament of polyandry (a plurality of husbands), though the Levirate marriage is regarded by some as a survival of it. In other words, polygamy among the Hebrews seems to have been confined to polygyny (a plurality of wives). It is easy to trace its chief causes: (1) desire for a numerous offspring ("May his tribe increase!"); (2) barrenness of first wife (as in Abraham\'s case); (3) advantages offered by marital alliances (e.g. Solomon); (4) the custom of making wives of captives taken in war (compare <a onClick="return mV(\'Psa\',45,3,9);">Ps 45:3,9</a>); (5) slavery, which as it existed in the Orient almost implied it.<P>2. Betrothal the First Formal Part:<P>Betrothal with the ancient Hebrews was of a more formal and far more binding nature than the "engagement" is with us. Indeed, it was esteemed a part of the transaction of marriage, and that the most binding part. Among the Arabs today it is the only legal ceremony connected with marriage. <a onClick="return mV(\'Gen\',24,58,60);">Ge 24:58,60</a> seems to preserve for us an example of an ancient formula and blessing for such an occasion. Its central feature was the dowry (mohar), which was paid to the parents, not to the bride. It may take the form of service (<a onClick="return mV(\'Gen\',29,\'1-\');">Ge 29</a>; <a onClick="return mV(\'1Sa\',18,25);">1Sa 18:25</a>). It is customary in Syria today, when the projected marriage is approved by both families, and all the financial preliminaries have been settled, to have this ceremony of betrothal. It consists in the acceptance before witnesses of the terms of the marriage as contracted for. Then God\'s blessing is solemnly asked on the union thus provided for, but to take place probably only after some months, or perhaps some years. The betrothal effected, all danger from any further financial fencing and bluffing now being at an end, happiness and harmony may preside over all the arrangements for the marriage day. Among the Jews the betrothal was so far regarded as binding that, if marriage should not take place, owing to the absconding of the bridegroom or the breach of contract on his part, the young woman could not be married to another man until she was liberated by a due process and a paper of divorce. A similar custom prevails in China and Japan, and in cases becomes very oppressive. The marriage may have been intended by the parents from the infancy of the parties, but this formality of betrothal is not entered on till the marriage is considered reasonably certain and measurably near. A prolonged interval between betrothal and marriage was deemed undesirable on many accounts, though often an interval was needed that the groom might render the stipulated service or pay the price—say a year or two, or, as in the case of Jacob, it might be seven years. The betrothed parties were legally in the position of a married couple, and unfaithfulness was "adultery" (<a onClick="return mV(\'Deu\',22,23);">De 22:23</a>; <a onClick="return mV(\'Mat\',1,19);">Mt 1:19</a>).<P>Polygamy is likely to become prevalent only where conditions are abnormal, as where there is a disproportionate number of females, as in tribal life in a state of war. In settled conditions it is possible only to those able to provide "dowry" and support for each and all of the wives.<P>The fact of polygamy in Old Testament times is abundantly witnessed in the cases of Abraham, Jacob, the judges, David, Solomon, etc. It was prevalent in Issachar (<a onClick="return mV(\'1Ch\',7,4);">1Ch 7:4</a>); among the middle class (<a onClick="return mV(\'1Sa\',1,1);">1Sa 1:1</a>f). But it is treated, even in the Old Testament, as incompatible with the Divine ideal (<a onClick="return mV(\'Gen\',2,24);">Ge 2:24</a>), and its original is traced to deliberate departure from that ideal by Lamech, the Cainite (<a onClick="return mV(\'Gen\',4,19);">Ge 4:19</a>). Kings are warned against it (<a onClick="return mV(\'Deu\',17,17);">De 17:17</a>; compare <a onClick="return mV(\'Gen\',29,31);">Ge 29:31</a>; <a onClick="return mV(\'Gen\',30,\'1-\');">30</a>). Noah, Isaac and Joseph had each only one wife, and Bible pictures of domestic happiness are always connected with monogamy (<a onClick="return mV(\'2Ki\',4,\'1-\');">2Ki 4</a>; <a onClick="return mV(\'Psa\',128,\'1-\');">Ps 128</a>; <a onClick="return mV(\'Pro\',31,\'1-\');">Pr 31</a>; compare Sirach 25:1; 26:1,13). Marriage is applied figuratively, too, to the union between God and Israel, implying monogamy as the ideal state. Nevertheless, having the advantage of precedent, it was long before polygamy fell into disuse in Hebrew society. Herod had nine wives at one time (Josephus, Ant, XVII, i, 2). Justin Martyr (Dial.,134, 141) reproaches Jews of his day with having "four or even five wives," and for "marrying as many as they wish" (compare Talm). It was not definitely and formally forbidden among Jews until circa 1000 AD. It exists still among Jews in Moslem lands. Side by side with this practice all along has been the ideal principle (<a onClick="return mV(\'Gen\',2,18);">Ge 2:18</a>) rebuking and modifying it. The legal theory that made the man "lord" of the wife (<a onClick="return mV(\'Gen\',3,16);">Ge 3:16</a>; Tenth Commandment) was likewise modified in practice by the affection of the husband and the personality of the wife.<P>The difference between a concubine and a wife was largely due to the wife\'s birth and higher position and the fact that she was usually backed by relatives ready to defend her. A slave could not be made a concubine without the wife\'s consent (<a onClick="return mV(\'Gen\',16,2);">Ge 16:2</a>).<P>3. Wedding Ceremonies:<P>There is a disappointing uncertainty as to the exact ceremonies or proceedings connected with marriage in Bible times. We have to paint our picture from passing allusions or descriptions, and from what we know of Jewish and Arabic customs. In cases it would seem that there was nothing beyond betrothal, or the festivities following it (see <a onClick="return mV(\'Gen\',24,3);">Ge 24:3</a>ff). Later, in the case of a virgin, an interval of not exceeding a year came to be observed.<P>The first ceremony, the wedding procession, apparently a relic of marriage by capture (compare <a onClick="return mV(\'Jdg\',5,30);">Jud 5:30</a>; <a onClick="return mV(\'Psa\',45,15);">Ps 45:15</a>), was the first part of the proceedings. The bridegroom\'s "friends" (<a onClick="return mV(\'Jhn\',3,29);">Joh 3:29</a>) went, usually by night, to fetch the bride and her attendants to the home of the groom (<a onClick="return mV(\'Mat\',9,15);">Mt 9:15</a>; <a onClick="return mV(\'Jhn\',3,29);">Joh 3:29</a>). The joyousness of it all is witnessed by the proverbial "voice of the bridegroom" and the cry, "Behold the bridegroom cometh!" (<a onClick="return mV(\'Jer\',7,34);">Jer 7:34</a>; <a onClick="return mV(\'Rev\',18,23);">Re 18:23</a>). The procession was preferably by night, chiefly, we may infer, that those busy in the day might attend, and that, in accordance with the oriental love of scenic effects, the weird panorama of lights and torches might play an engaging and kindling part.<P>The marriage supper then followed, generally in the home of the groom. Today in Syria, as Dr. Mackie, of Beirut, says, when both parties live in the same town, the reception may take place in either home; but the older tradition points to the house of the groom\'s parents as the proper place. It is the bringing home of an already accredited bride to her covenanted husband. She is escorted by a company of attendants of her own sex and by male relatives and friends conveying on mules or by porters articles of furniture and decoration for the new home. As the marriage usually takes place in the evening, the house is given up for the day to the women who are busy robing the bride and making ready for the coming hospitality. The bridegroom is absent at the house of a relative or friend, where men congregate in the evening for the purpose of escorting him home. When he indicates that it is time to go, all rise up, and candles and torches are supplied to those who are to form the procession, and they move off. It is a very picturesque sight to see such a procession moving along the unlighted way in the stillness of the starry night, while, if it be in town or city, on each side of the narrow street, from the flat housetop or balcony, crowds look down, and the women take up the peculiar cry of wedding joy that tells those farther along that the pageant has started. This cry is taken up all along the route, and gives warning to those who are waiting with the bride that it is time to arise and light up the approach, and welcome the bridegroom with honor. As at the house where the bridegroom receives his friends before starting some come late, and speeches of congratulation have to be made, and poems have to be recited or sung in praise of the groom, and to the honor of his family, it is often near midnight when the procession begins. Meanwhile, as the night wears on, and the duties of robing the bride and adorning the house are all done, a period of relaxing and drowsy waiting sets in, as when, in the New Testament parable, both the wise and the foolish virgins were overcome with sleep. In their case the distant cry on the street brought the warning to prepare for the reception, and then came the discovery of the exhausted oil.<P>Of the bridegroom\'s retinue only a limited number would enter, their chief duty being that of escort. They might call next day to offer congratulations. An Arabic wedding rhyme says:<P class="in15">"To the bridegroom\'s door went the torch-lit array,<br>And then like goats they scattered away."<P>With their dispersion, according to custom, the doors would be closed, leaving within the relatives and invited guests; and so, when the belated virgins of the parable hastened back, they too found themselves inexorably shut out by the etiquette of the occasion. The opportunity of service was past, and they were no longer needed.<P>At the home all things would be "made ready," if possible on a liberal scale. <a onClick="return mV(\'Jhn\',2,\'1-\');">Joh 2</a> gives a picture of a wedding feast where the resources were strained to the breaking point. Hospitality was here especially a sacred duty, and, of course, greatly ministered to the joy of the occasion. An oriental proverb is significant of the store set by it:<P class="in15">"He who does not invite me to his marriage<br>Will not have me to his funeral."<P>To decline the invitation to a marriage was a gross insult (<a onClick="return mV(\'Mat\',22,\'1-\');">Mt 22</a>).<P>It was unusual in Galilee to have a "ruler of the feast" as in Judea (<a onClick="return mV(\'Jhn\',2,\'1-\');">Joh 2</a>). There was no formal religious ceremony connected with the Hebrew marriage as with us—there is not a hint of such a thing in the Bible. The marriage was consummated by entrance into the "chamber," i.e. the nuptial chamber (Hebrew chedher), in which stood the bridal bed with a canopy (chuppah), being originally the wife\'s tent (<a onClick="return mV(\'Gen\',24,67);">Ge 24:67</a>; <a onClick="return mV(\'Jdg\',4,17);">Jud 4:17</a>). In all lands of the dispersion the name is still applied to the embroidered canopy under which the contracting parties stand or sit during the festivities. In Arabic, Syriac, and Hebrew the bridegroom is said to "go in" to the bride.<P>A general survey of ancient marriage laws and customs shows that those of the Hebrews are not a peculiar creation apart from those of other peoples. A remarkable affinity to those of other branches of the Semitic races especially, may be noted, and striking parallels are found in the Code of Hammurabi, with regard, e.g., to betrothal, dowry, adultery and divorce. But modern researches have emphasized the relative purity of Old Testament sexual morality. In this, as in other respects, the Jews had a message for the world. Yet we should not expect to find among them the Christian standard. Under the new dispensation the keynote is struck by our Lord\'s action. The significance of His attending the marriage feast at Cana and performing His first miracle there can hardly be exaggerated. The act corresponds, too, with His teaching on the subject. He, no less than Paul, emphasizes both the honorableness of the estate and the heinousness of all sins against it.<P>4. Jesus\' Sanction of the Institution:<P>The most characteristic use of marriage and the family by our Lord is that in which He describes the kingdom of God as a social order in which the relationship of men to God is like that of sons to a father, and their relation to each other like that between brothers. This social ideal, which presents itself vividly and continuously to His mind, is summed up in this phrase, "Kingdom of God," which occurs more than a hundred times in the Synoptic Gospels. The passages in which it occurs form the interior climax of His message to men. It is no new and noble Judaism, taking the form of a political restoration, that He proclaims, and no "far-off Divine event" to be realized only in some glorious apocalyptic consummation; but a kingdom of God "within you," the chief element of it communion with God, the loving relation of "children" to a "Father," a present possession. Future in a sense it may be, as a result to be fully realized, and yet present; invisible, and yet becoming more and more visible as a new social order, a conscious brotherhood with one common, heavenly Father, proclaimed in every stage of His teaching in spite of opposition and varying fortunes with unwavering certainty of its completion—this is the "kingdom" that Jesus has made the inalienable possession of the Christian consciousness. His entire theology may be described as a transfiguration of the family (see Peabody, Jesus Christ, and the Social Question, 149ff; Holtzmann, New Testament Theology, I, 200; Harnack, History of Dogma, I, 62; B. Weiss, Biblical Theol. of the New Testament, I,72,English translation, 1882).<P>Beyond this Jesus frequently used figures drawn from marriage to illustrate His teaching concerning the coming of the kingdom, as Paul did concerning Christ and the church. There is no suggestion of reflection upon the Old Testament teaching about marriage in His teaching except at one point, the modification of it so as to allow polygamy and divorce. Everywhere He accepts and deals with it as sacred and of Divine origin (<a onClick="return mV(\'Mat\',19,9);">Mt 19:9</a>, etc.), but He treats it as transient, that is of the "flesh" and for this life only.<P>5. His Teaching concerning Divorce:<P>A question of profound interest remains to be treated: Did Jesus allow under any circumstances the remarriage of a divorced person during the lifetime of the partner to the marriage? Or did He allow absolute divorce for any cause whatsoever? Upon the answer to that question in every age depend momentous issues, social and civic, as well as religious. The facts bearing on the question are confessedly enshrined in the New Testament, and so the inquiry may be limited to its records. Accepting with the best scholarship the documents of the New Testament as emanating from the disciples of Jesus in the second half of the 1st century AD, the question is, what did these writers understand Jesus to teach on this subject? If we had only the Gospels of Mark and Luke and the Epistles of Paul, there could be but one answer given: Christ did not allow absolute divorce for any cause (see <a onClick="return mV(\'Mar\',10,2);">Mr 10:2</a>ff; <a onClick="return mV(\'Luk\',16,18);">Lu 16:18</a>; <a onClick="return mV(\'Gal\',1,12);">Ga 1:12</a>; <a onClick="return mV(\'1Cr\',7,10);">1Co 7:10</a>). The Old Testament permission was a concession, He teaches, to a low moral state and standard, and opposed to the ideal of marriage given in Genesis (<a onClick="return mV(\'Mar\',2,23);">2:23</a>).<P>"The position of women in that day was far from enviable. They could be divorced on the slightest pretext, and had no recourse at law. Almost all the rights and privileges of men were withheld from them. What Jesus said in relation to divorce was more in defense of the rights of the women of His time than as a guide for the freer, fuller life of our day. Jesus certainly did not mean to recommend a hard and enslaving life for women. His whole life was one long expression of full understanding of them and sympathy for them" (Patterson, The Measure of a Man, 181f).<P>Two sayings attributed to Christ and recorded by the writer or editor of the First Gospel (<a onClick="return mV(\'Mat\',5,32);">Mt 5:32</a>; <a onClick="return mV(\'Mat\',19,9);">19:9</a>) seem directly to contravene His teaching as recorded in Mark and Luke. Here he seems to allow divorce for "fornication" (ei me epi porneia, save for fornication"), an exception which finds no place in the parallels (compare <a onClick="return mV(\'1Cr\',7,15);">1Co 7:15</a>, which allows remarriage where a Christian partner is deserted by a heathen). The sense here demands that "fornication" be taken in its wider sense (<a onClick="return mV(\'Hsa\',2,5);">Ho 2:5</a>; <a onClick="return mV(\'Amo\',7,17);">Am 7:17</a>; <a onClick="return mV(\'1Cr\',5,1);">1Co 5:1</a>). Divorce to a Jew carried with it the right of remarriage, and the words \'causeth her to commit adultery\' (<a onClick="return mV(\'Mat\',5,32);">Mt 5:32</a>) show that Jesus assumed that the divorced woman would marry again. Hence, if He allowed divorce, He also allowed remarriage. A critical examination of the whole passage in Matthew has led many scholars to conclude that the exceptive clause is an interpolation due to the Jewish-Christian compiler or editor through whose hands the materials passed. Others think it betrays traces of having been rewritten from Mark or from a source common to both Matthew and Mark, and combined with a semi-Jewish tradition, in short, that it is due to literary revision and compilation. The writer or compiler attempted to combine the original sayings of Jesus and His own interpretation. Believing that our Lord had not come to set aside the authority of Moses, but only certain Pharisaic exegesis, and supported, as doubtless he was, by a Jewish-Christian tradition of Palestine, he simply interpreted Mark\'s narrative by inserting what he regarded as the integral part of an eternal enactment of Yahweh. In doing this he was unconsciously inconsistent, not only with Mark and Luke, but also with the context of the First Gospel itself, owing to his sincere but mistaken belief that the Law of Moses must not be broken. The view implied by the exception, of course, is that adultery ipso facto dissolves the union, and so opens the way to remarriage. But remarriage closes the door to reconciliation, which on Christian principles ought always to be possible (compare Hosea; <a onClick="return mV(\'Jer\',3,\'1-\');">Jer 3</a>; Hermas, Mand iv.1). Certainly much is to be said for the view which is steadily gaining ground, that the exception in Matthew is an editorial addition made under the pressure of local conditions and practical necessity, the absolute rule being found too hard (see Hastings, Dictionary of the Bible (five volumes), extra vol, 27b, and The Teaching of our Lord as to the Indissolubility of Marriage, by Stuart Lawrence Tyson, M.A. Oxon., University of the South, 1912).<P>The general principle expanded in the New Testament and the ideal held up before the Christians is high and clear. How far that ideal can be embodied in legislation and applied to the community as a whole all are agreed must depend upon social conditions and the general moral development and environment.<P>LITERATURE.<P>Material from Mishna in Selden, Uxor Heb, London, 1546; Hamberger, Real. Encyclopedia f. Bibel und Talmud, Breslau, 1870; Benzinger, Hebraische Archaologie; Nowack, Lehrbuch der hebraischen Archaologie; McLennan, Primitive Marriage; Westermarck, History of Human Marriage, London, 1891; W. R. Smith, Kinship and Marriage in Early Arabia, Cambridge, 1895; Tristram, Eastern Customs, London, 1894; Mackie, Bible Manners and Customs, London, 1898; Peabody, Jesus Christ and the Social Question, III, concerning the family.`<a href="./study/isbe/search.html?string=DIVORCE">DIVORCE</a>`47';
isbe[5822]='Marrow`mar\'-o (moach, chelebh, shiqquy, machah, "to make fat," "to grease"; muelos): Marrow is the nourisher and strengthener of the bones; it is said to moisten the bones: "The marrow (moach) of his bones is moistened" (<a onClick="return mV(\'Job\',21,24);">Job 21:24</a>). The fear of Yahweh "will be health to thy navel, and marrow (shiqquy, margin "refreshing, Hebrew moistening") to thy bones" (<a onClick="return mV(\'Pro\',3,8);">Pr 3:8</a>). Thus, the expression is used figuratively of the things which alone can satisfy the soul: "My soul shall be satisfied as with marrow (chelebh, "fat") and fatness" (<a onClick="return mV(\'Psa\',63,5);">Ps 63:5</a>); "In this mountain will Yahweh of hosts make unto all peoples a feast of fat things, a feast of wines on the lees, of fat things full of marrow (memuchayim, particle, plural, Pual of machah), of wines on the lees well refined" (<a onClick="return mV(\'Isa\',25,6);">Isa 25:6</a>). In the Epistle to the Hebrews the writer speaks of the word of God, which is "living, and active, and sharper than any two-edged sword, and piercing even to the dividing of soul and spirit, of both joints and marrow" (<a onClick="return mV(\'Hbr\',4,12);">Heb 4:12</a>).``106';
isbe[5823]='Mars\' Hill`marz hil.`<a href="./study/isbe/search.html?string=AREOPAGUS">AREOPAGUS</a>`1';
isbe[5824]='Marsena`mar-se\'-na, mar\'-se-na (marcena\'; derivation unknown but probably of Persian origin (<a onClick="return mV(\'Est\',1,14);">Es 1:14</a>)): One of "the seven princes of Persia and Media, who saw the king\'s face, and sat first in the kingdom."``1';
isbe[5825]='Marsh`marsh<p>(1) gebhe\', the American Standard Revised Version "marsh," the King James Version and the English Revised Version "marish" (<a onClick="return mV(\'Eze\',47,11);">Eze 47:11</a>); the King James Version "pit," the Revised Version (British and American) "cistern" (<a onClick="return mV(\'Isa\',30,14);">Isa 30:14</a>); compare Arabic jaba\', "reservoir," "watering-through";<p>(2) bots, "mire"; bitstsah, "mire," "fen"; compare Arabic badda, to "trickle," badad, "a little water"; <p>(3) tit, "mire" "clay";<p>(4) chomer, "mire," "clay," "mortar";<p>(5) ma\'abheh ha-\'adhamah (<a onClick="return mV(\'1Ki\',7,46);">1Ki 7:46</a>), and \'abhi ha-\'adhamah (<a onClick="return mV(\'2Ch\',4,17);">2Ch 4:17</a>), "clay ground"):<p>In the vision of Ezekiel the saltness of the Dead Sea is "healed" by the stream issuing from under the threshold of the temple, "But the miry places (bitstsah) thereof, and the marshes (gebhe\') thereof, shall not be healed" (<a onClick="return mV(\'Eze\',47,11);">Eze 47:11</a>). Gebhe\' occurs elsewhere only in <a onClick="return mV(\'Isa\',30,14);">Isa 30:14</a>, where the King James Version has "pit" and the Revised Version (British and American) "cistern." Bots, "mire," is found only in <a onClick="return mV(\'Jer\',38,22);">Jer 38:22</a>. Bitstsah is found also in <a onClick="return mV(\'Job\',8,11);">Job 8:11</a>,<P class="in15">"Can the rush grow up without mire (bitstsah)?<br>Can the flag grow without water?"<P>and in <a onClick="return mV(\'Job\',40,21);">Job 40:21</a> (of the behemoth),<P class="in15">"He lieth under the lotus-trees,<br>In the covert of the reed, and the fen (bitstsah)."<P>In 1Macc 9:42,45 helos, but in 9:42 Codex Vaticanus reads oros, "mount." Marshes are found near the mouths of some of the rivers, as the Kishon, about the Chuleh (? waters of Merom), at various places in the course of the Jordan and about the Dead Sea, especially at its south end. For the most part Palestine is rocky and dry.``37';
isbe[5826]='Marshal`mar\'-shal: Not found in the King James Version, but in the Revised Version (British and American) the word represents two Hebrew words:<p class="in15">(1) copher (<a onClick="return mV(\'Jdg\',5,14);">Jud 5:14</a>), translated "they that handle the marshal\'s staff." A difficulty arises because the usual meaning of copher is "scribe" or "writer" (so the King James Version). The revisers follow Septuagint and Greek authority which favor "marshal" as against "scribe." The office of marshal was to help the general to maintain discipline (compare 1Macc 5:42).<p class="in15">(2) Tiphcar (<a onClick="return mV(\'Jer\',51,27);">Jer 51:27</a>), a loan-word whose meaning is clear. Lenormant thinks it akin to a Babylonian-Assyrian word meaning "tablet-writer" (compare Delitzsch). Accordingly, the Revised Version margin renders <a onClick="return mV(\'Nah\',3,17);">Na 3:17</a> "thy scribes," though the Syriac has "thy warriors," as does the Targum in Jeremiah. We must await further light on both words.``47';
