isbe[5886]='Meals, Meal-Time`melz: Bread materials, bread-making and baking in the Orient are dealt with under <a href="./study/isbe/search.html?string=BREAD">BREAD</a> (which see). For food-stuffs in use among the Hebrews in Bible times more specifically see <a href="./study/isbe/search.html?string=FOOD">FOOD</a>. This article aims to be complementary, dealing especially with the methods of preparing and serving food and times of meals among the ancient Hebrews.<P>The Book of Judges gives a fair picture of the early formative period of the Hebrew people and their ways of living. It is a picture of semi-savagery—of the life and customs of free desert tribes. In 1 Samuel we note a distinct step forward, but the domestic and cultural life is still low and crude. When they are settled in Palestine and come in contact with the most cultured people of the day, the case is different. Most that raised these Semitic invaders above the dull, crude existence of fellahin, in point of civilization, was due to the people for whom the land was named (Macalister, Hist of Civilization in Pal). From that time on various foreign influences played their several parts in modification of Hebrew life and customs. A sharp contrast illustrative of the primitive beginnings and the growth of luxury in Israel in the preparation and use of foods may be seen by a comparison of <a onClick="return mV(\'2Sa\',17,28);">2Sa 17:28</a>f with <a onClick="return mV(\'1Ki\',4,22);">1Ki 4:22</a> f.<P>I. Methods of Preparing Food.<P>1. Cereals:<P>The most primitive way of using the cereals was to pluck the fresh ears (<a onClick="return mV(\'Lev\',23,14);">Le 23:14</a>; <a onClick="return mV(\'2Ki\',4,42);">2Ki 4:42</a>), remove the husk by rubbing (compare <a onClick="return mV(\'Deu\',23,25);">De 23:25</a> and <a onClick="return mV(\'Mat\',12,1);">Mt 12:1</a>), and eat the grain raw. A practice common to all periods, observed by fellahin today, was to parch or roast the ears and eat them not ground. Later it became customary to grind the grain into flour, at first by the rudimentary method of pestle and mortar (<a onClick="return mV(\'Num\',11,8);">Nu 11:8</a>; compare <a onClick="return mV(\'Pro\',27,22);">Pr 27:22</a>), later by the hand-mill (<a onClick="return mV(\'Exd\',11,5);">Ex 11:5</a>; <a onClick="return mV(\'Job\',31,10);">Job 31:10</a>; compare <a onClick="return mV(\'Mat\',24,41);">Mt 24:41</a>), still later in mills worked by the ass or other animal (<a onClick="return mV(\'Mat\',18,6);">Mt 18:6</a>, literally, "a millstone turned by an ass"). The flour was then made into bread, with or without leaven.<P>See <a href="./study/isbe/search.html?string=LEAVEN">LEAVEN</a>.<P>Another simple way of preparing the grain was to soak it in water, or boil it slightly, and then, after drying and crushing it, to serve it as the dish called "groats" is served among western peoples.<P>The kneading of the dough preparatory to baking was done doubtless, as it is now in the East, by pressing it between the hands or by passing it from hand to hand; except that in Egypt, as the monuments show, it was put in "baskets" and trodden with the feet, as grapes in the wine press. (This is done in Paris bakeries to this day.)<P>See <a href="./study/isbe/search.html?string=BREAD">BREAD</a>; <a href="./study/isbe/search.html?string=FOOD">FOOD</a>.<P>2. Vegetables:<P>Lentils, several kinds of beans, and a profusion of vegetables, wild and cultivated, were prepared and eaten in various ways. The lentils were sometimes roasted, as they are today, and eaten like "parched corn." They were sometimes stewed like beans, and flavored with onions and other ingredients, no doubt, as we find done in Syria today (compare <a onClick="return mV(\'Gen\',25,29,34);">Ge 25:29,34</a>), and sometimes ground and made into bread (<a onClick="return mV(\'Eze\',4,9);">Eze 4:9</a>; compare Zeitschrift des Deutschen Palastina-Vereins, IX, 4). The wandering Israelites in the wilderness looked back wistfully on the cucumbers, melons, leeks, onions and garlic of Egypt (<a onClick="return mV(\'Num\',11,5);">Nu 11:5</a>), and later we find all of these used for food in Palestine How many other things were prepared and used for food by them may be gathered from the Mishna, our richest source of knowledge on the subject.<P>3. Meat:<P>The flesh of animals—permission to eat which it would seem was first given to Noah after the deluge (<a onClick="return mV(\'Gen\',1,29);">Ge 1:29</a>f; <a onClick="return mV(\'Gen\',9,3);">9:3</a>f)—was likewise prepared and used in various ways:<P>(a) Roasting was much in vogue, indeed was probably the oldest of all methods of preparing such food. At first raw meat was laid upon hot stones from which the embers had been removed, as in the case of the "cake baken on the hot stones" (<a onClick="return mV(\'1Ki\',19,6);">1Ki 19:6</a> the Revised Version margin; compare <a onClick="return mV(\'Hsa\',7,8);">Ho 7:8</a>, "a cake not turned"), and sometimes underneath with a covering of ashes. The fish that the disciples found prepared for them by the Sea of Galilee (<a onClick="return mV(\'Jhn\',21,9);">Joh 21:9</a>) was, in exception to this rule, cooked on the live coals themselves. A more advanced mode of roasting was by means of a spit of green wood or iron (for baking in ovens, see <a href="./study/isbe/search.html?string=FOOD">FOOD</a>).<P>(b) Boiling was also common (see <a onClick="return mV(\'Gen\',25,29);">Ge 25:29</a>; <a onClick="return mV(\'Exd\',12,9);">Ex 12:9</a>, etc., the American Standard Revised Version; English Versions of the Bible more frequently "seething," "sod," "sodden"), as it is in the more primitive parts of Syria today. The pots in which the boiling was done were of earthenware or bronze (<a onClick="return mV(\'Lev\',6,28);">Le 6:28</a>). When the meat was boiled in more water than was required for the ordinary "stew" the result was the broth (<a onClick="return mV(\'Jdg\',6,19);">Jud 6:19</a>f), and the meat and the broth might then be served separately. The usual way, however, was to cut the meat into pieces, larger or smaller as the case might demand (<a onClick="return mV(\'1Sa\',2,13);">1Sa 2:13</a>; <a onClick="return mV(\'Eze\',24,3);">Eze 24:3</a>; compare Micah\'s metaphor, <a onClick="return mV(\'Mic\',3,3);">Mic 3:3</a>), and put these pieces into the cooking-pot with water sufficient only for a stew. Vegetables and rice were generally added, though crushed wheat sometimes took the place of the rice, as in the case of the "savory meat" which Rebekah prepared for her husband from the "two kids of the goats" (<a onClick="return mV(\'Gen\',27,9);">Ge 27:9</a>). The seeds of certain leguminous plants were also often prepared by boiling (<a onClick="return mV(\'Gen\',25,29);">Ge 25:29</a>; <a onClick="return mV(\'2Ki\',4,38);">2Ki 4:38</a>).<P>(c) The Hebrew housewives, we may be sure, were in such matters in no way behind their modern kinswomen of the desert, of whom Doughty tells: "The Arab housewives make savory messes of any grain, seething it and putting thereto only a little salt and samn (clarified butter)."<P>4. Oil:<P>Olive oil was extensively and variously used by the ancient Hebrews, as by most eastern peoples then, as it is now.<P>(a) Oriental cooking diverges here more than at any other point from that of the northern and western peoples, oil serving many of the purposes of butter and lard among ourselves.<P>(b) Oil was used in cooking vegetables as we use bacon and other animal fats, and in cooking fish and eggs, as sJso in the finer sorts of baking. See <a href="./study/isbe/search.html?string=BREAD">BREAD</a>; <a href="./study/isbe/search.html?string=FOOD">FOOD</a>; <a href="./study/isbe/search.html?string=OIL">OIL</a>.<P>(c) They even mixed oil with the flour, shaped it into cakes and then baked it (<a onClick="return mV(\'Lev\',2,4);">Le 2:4</a>). The "little oil" of the poor widow of Zerephath was clearly not intended for the lamps, but to bake her pitiful "handful of meal" (<a onClick="return mV(\'1Ki\',17,12);">1Ki 17:12</a>).<P>(d) Again the cake of unmixed flour might be baked till almost done, then smeared with oil, sprinkled with anise seed, and brought by further baking to a glossy brown. A species of thin flat cakes of this kind are "the wafers anointed with oil" of <a onClick="return mV(\'Exd\',29,2);">Ex 29:2</a>, etc.<P>(e) Oil and honey constituted, as now in the East, a mixture used as we use butter and honey, and are found also mixed in the making of sweet cakes (<a onClick="return mV(\'Eze\',16,13,19);">Eze 16:13,19</a>). The taste of the manna is said in <a onClick="return mV(\'Exd\',16,31);">Ex 16:31</a> to be like that of "wafers made with honey," and in <a onClick="return mV(\'Num\',11,8);">Nu 11:8</a> to be like "the taste of cakes baked with oil" (Revised Version margin).<P>II. Meals, Meal-Time, etc.<P>(1) It was customary among the ancient Hebrews, as among their contemporaries in the East in classical lands, to have but two meals a day. The "morning morsel" or "early snack," as it is called in the Talmud, taken with some relish like olives, oil or melted butter, might be used by peasants, fishermen, or even artisans, to "break their fast" (see the one reference to it in the New Testament in <a onClick="return mV(\'Jhn\',21,12,15);">Joh 21:12,15</a>), but this was not a true meal. It was rather ariston proinon (Robinson, BRP, II, 18), though some think it the ariston, of the New Testament (Edersheim, Life and Times of Jesus the Messiah, II, 205, note 3; compare Plummer, International Critical Commentary, on <a onClick="return mV(\'Luk\',11,37);">Lu 11:37</a>). To "eat a meal," i.e. a full meal, in the morning was a matter for grave reproach (<a onClick="return mV(\'Ecc\',10,16);">Ec 10:16</a>), as early drinking was unusual and a sign of degradation (of <a onClick="return mV(\'Act\',2,15);">Ac 2:15</a>).<P>(2) The first meal (of "meal-time," literally, "the time of eating," <a onClick="return mV(\'Rth\',2,14);">Ru 2:14</a>; <a onClick="return mV(\'Gen\',43,16);">Ge 43:16</a>), according to general usage, was taken at or about noon when the climate and immemorial custom demanded a rest from labor. Peter\'s intended meal at Joppa, interrupted by the messengers of Cornelius, was at "the sixth hour," i.e. 12 M. It corresponded somewhat to our modern "luncheon," but the hour varied according to rank and occupation (Shabbath 10a). The Bedawi take it about 9 or 10 o\'clock (Burckhardt, Notes, I, 69). It is described somewhat fully by Lane in Modern Egyptians. To abstain from this meal was accounted "fasting" (<a onClick="return mV(\'Jdg\',20,26);">Jud 20:26</a>; <a onClick="return mV(\'1Sa\',14,24);">1Sa 14:24</a>). Drummond (Tropical Africa) says his Negro bearers began the day\'s work without food.<P>(3) The second and main meal (New Testament, deipnon) was taken about the set of sun, or a little before or after, when the day\'s work was over and the laborers had "come in from the field" (<a onClick="return mV(\'Luk\',17,7);">Lu 17:7</a>; <a onClick="return mV(\'Luk\',24,29);">24:29</a>f). This is the "supper time," the "great supper" of <a onClick="return mV(\'Luk\',14,16);">Lu 14:16</a>, the important meal of the day, when the whole family were together for the evening (Burckhardt, Notes, I, 69). It was the time of the feeding of the multitudes by Jesus (<a onClick="return mV(\'Mar\',6,35);">Mr 6:35</a>; <a onClick="return mV(\'Mat\',14,15);">Mt 14:15</a>; <a onClick="return mV(\'Luk\',9,12);">Lu 9:12</a>), of the eating of the Passover, and of the partaking of the Lord\'s Supper. According to Jewish law, and for special reasons, the chief meal was at midday—"at the sixth hour," according to Josephus (Vita, 54; compare <a onClick="return mV(\'Gen\',43,\'16-25\');">Ge 43:16-25</a>; <a onClick="return mV(\'2Sa\',24,15);">2Sa 24:15</a> Septuagint). It was Yahweh\'s promise to Israel that they should have "bread" in the morning and "flesh" in the evening (<a onClick="return mV(\'Exd\',16,12);">Ex 16:12</a>), incidental evidence of one way in which the evening meal differed from that at noon. At this family meal ordinarily there was but one common dish for all, into which all "dipped the sop" (see <a onClick="return mV(\'Mat\',26,23);">Mt 26:23</a>; <a onClick="return mV(\'Mar\',14,20);">Mr 14:20</a>), so that when the food, cooked in this common stew, was set before the household, the member of the household who had prepared it had no further work to do, a fact which helps to explain Jesus\' words to Martha, \'One dish alone is needful\' (<a onClick="return mV(\'Luk\',10,42);">Lu 10:42</a>; Hastings, Dictionary of Christ and the Gospels, under the word "Meals").<P>(4) Sabbath banqueting became quite customary among the Jews (see examples cited by Lightfoot, Hor. Heb et Talmud on <a onClick="return mV(\'Luk\',14,1);">Lu 14:1</a>; compare Edersheim, Life and Times of Jesus the Messiah, II,52,437; Farrar, Life of Christ, II,119,note). Indeed it was carried to such an excess that it became proverbial for luxury. But the principle which lay at the root of the custom was the honor of the Sabbath (Lightfoot, op. cit., III, 149), which may explain Jesus countenance and use of the custom (compare <a onClick="return mV(\'Luk\',7,36);">Lu 7:36</a>; <a onClick="return mV(\'Luk\',11,37);">11:37</a>; <a onClick="return mV(\'Luk\',14,\'7-14\');">14:7-14</a>), and the fact that on the last Sabbath He spent on earth before His passion He was the chief guest at such a festive meal (<a onClick="return mV(\'Jhn\',12,2);">Joh 12:2</a>). It is certain that He made use of such occasions to teach lessons of charity and religion, in one case even when His host was inclined to indulge in discourteous criticism (<a onClick="return mV(\'Luk\',7,39);">Lu 7:39</a>; <a onClick="return mV(\'Luk\',11,38,45);">11:38,45</a>f; compare <a onClick="return mV(\'Jhn\',12,7);">Joh 12:7</a>f). He seems to have withheld His formal disapproval of what might be wrong in tendency in such feasts because of the latent possibilities for good He saw in them, and so often used them wisely and well. It was on one of these occasions that a fellow-guest in his enthusiasm broke out in the exclamation, "Blessed is he that shall eat bread in the kingdom of God" (<a onClick="return mV(\'Luk\',14,15);">Lu 14:15</a>), referring evidently to the popular Jewish idea that the Messianic kingdom was to be ushered in with a banquet, and that feasting was to be a chief part of its glories (compare <a onClick="return mV(\'Isa\',25,6);">Isa 25:6</a>; <a onClick="return mV(\'Luk\',13,29);">Lu 13:29</a>).<P>See <a href="./study/isbe/search.html?string=BANQUET">BANQUET</a>.<P>III. Customs at Meals.<P>In the earliest times the Hebrews took their meals sitting, or more probably squatting, on the ground like the Bedouin and fellahin of today (see <a onClick="return mV(\'Gen\',37,25);">Ge 37:25</a>, etc.), with the legs gathered tailor-fashion (Palestine Exploration Fund Statement, 1905, 124). The use of seats naturally followed upon the change from nomadic to agricultural life, after the conquest of Canaan. Saul and his mess-mates sat upon "seats" (<a onClick="return mV(\'1Sa\',20,25);">1Sa 20:25</a>), as did Solomon and his court (<a onClick="return mV(\'1Ki\',10,5);">1Ki 10:5</a>; compare <a onClick="return mV(\'1Ki\',13,20);">1Ki 13:20</a>, etc.). With the growth of wealth and luxury under the monarchy, the custom of reclining at meals gradually became the fashion. In Amos\' day it was regarded as an aristocratic innovation (<a onClick="return mV(\'Amo\',3,12);">Am 3:12</a>; <a onClick="return mV(\'Amo\',6,4);">6:4</a>), but two centuries later Ezekiel speaks of "a stately bed" or "couch" (compare <a onClick="return mV(\'Est\',1,6);">Es 1:6</a> the Revised Version (British and American)) with "a table prepared before it" (<a onClick="return mV(\'Eze\',23,41);">Eze 23:41</a>), as if it was no novelty. By the end of the 3rd century BC it was apparently universal, except among the very poor (Judith 12:15; Tobit 2:1). Accordingly, "sitting at meat" in the New Testament (English Versions of the Bible) is everywhere replaced by "reclining" (Revised Version margin), though women and children still sat. They leaned on the left elbow (Sirach 41:19), eating with the right hand (see <a href="./study/isbe/search.html?string=LORD\'S+SUPPER">LORD\'S SUPPER</a>). The various words used in the Gospels to denote the bodily attitude at meals, as well as the circumstances described, all imply that the Syrian custom of reclining on a couch, followed by Greeks and Romans, was in vogue (Edersheim, II, 207). Luke uses one word for it which occurs nowhere else in the New Testament (kataklithenai, <a onClick="return mV(\'Luk\',7,36);">7:36</A>; <a onClick="return mV(\'Luk\',14,8);">14:8</A>; <a onClick="return mV(\'Luk\',24,30);">24:30</A>; and kataklinein, <a onClick="return mV(\'Luk\',9,14,15);">9:14,15</A>), which Hobart says is the medical term for laying patients or causing them to lie in bed (Medical Language of Luke, 69). For costumes and customs at more elaborate feasts see <a href="./study/isbe/search.html?string=BANQUET">BANQUET</a>; <a href="./study/isbe/search.html?string=DRESS">DRESS</a>. For details in the "minor morals" of the dinner table, see the classical passages (Sirach 31:12-18; 32:3-12), in which Jesus ben-Sira has expanded the counsel given in <a onClick="return mV(\'Pro\',23,1);">Pr 23:1</a>f; compare Kennedy in The 1-Volume Hastings, Dictionary of the Bible, under the word "Meals."<P>LITERATURE.<P>Edersheim, Life and Times of Jesus the Messiah; O. Holtzmann, Eine Untersuchung zum Leben Jesu, English translation, 206; B. Weiss, The Life of Christ, II,125,note 2; Plummer, International Critical Commentary, "Luke," 159f; Farrar, Life of Christ; Hastings, Dictionary of the Bible (five volumes), Hastings, Dictionary of Christ and the Gospels, the 1-volume Hastings, Dictionary of the Bible; Encyclopedia Biblica; Jewish Encyclopedia, etc.``47';
isbe[5887]='Mean`men: The noun "meaning" (<a onClick="return mV(\'Dan\',8,15);">Da 8:15</a> the King James Version, the Revised Version (British and American) "I sought to understand"; and <a onClick="return mV(\'1Cr\',14,11);">1Co 14:11</a>) is synonymous with "signification" but in 1Macc 15:4 the King James Version it expresses "purpose" (the Revised Version (British and American) "I am minded to land"). The noun "mean" in Hebrew always occurs in the plural, and is generally used in the sense of "agency," "instrument" (compare <a onClick="return mV(\'1Ki\',10,29);">1Ki 10:29</a>, etc.). the Revised Version (British and American) very frequently changes, King James Version: The <span class="noTag">Wisdom of Solomon 8:13</span>, "because of her"; <a onClick="return mV(\'2Th\',2,3);">2Th 2:3</a>, "in any wise"; <a onClick="return mV(\'Luk\',8,36);">Lu 8:36</a>, "how"; <a onClick="return mV(\'Pro\',6,26);">Pr 6:26</a>, "on account of"; <a onClick="return mV(\'Rev\',13,14);">Re 13:14</a>, "by reason of" (compare also <a onClick="return mV(\'2Th\',3,16);">2Th 3:16</a>; <a onClick="return mV(\'Jhn\',9,21);">Joh 9:21</a>). <a onClick="return mV(\'Hbr\',9,15);">Heb 9:15</a> (the King James Version "that by means of death") translates literally, "that a death having taken place," from ginomai, "to become," "to happen." <a onClick="return mV(\'Act\',18,21);">Ac 18:21</a> the King James Version, "I must by all means keep this feast," is omitted in the Revised Version (British and American) in harmony with several cursives, the Vulgate, and some other versions<P>The adjective "mean" is used in the sense of "common," "humble" (\'adham, "man"; compare <a onClick="return mV(\'Isa\',2,9);">Isa 2:9</a>; <a onClick="return mV(\'Isa\',5,15);">5:15</a>; <a onClick="return mV(\'Isa\',31,8);">31:8</a> omits "mean"). It is also used in the sense of "obscure" (<a onClick="return mV(\'Pro\',22,29);">Pr 22:29</a>, chashokh, "obscure"; asemos, literally, "without a mark," "unknown," <a onClick="return mV(\'Act\',21,39);">Ac 21:39</a>). "Mean" is found in expressions like "in the meanwhile" (the King James Version <a onClick="return mV(\'1Ki\',18,45);">1Ki 18:45</a>, the Revised Version (British and American) "little while"; <a onClick="return mV(\'Jhn\',4,31);">Joh 4:31</a>; <a onClick="return mV(\'Rom\',2,15);">Ro 2:15</a>, the Revised Version (British and American) "one with another"); "in the meantime" (1Macc 11:41 the King James Version; <a onClick="return mV(\'Luk\',12,1);">Lu 12:1</a>); and "in the mean season" the King James Version (1Macc 11:14; 15:15). The adverb "meanly" is found (2Macc 15:38) in the sense of "moderately."<P>The verb "mean" expresses purpose (<a onClick="return mV(\'Isa\',3,15);">Isa 3:15</a>; <a onClick="return mV(\'Isa\',10,7);">10:7</a>; <a onClick="return mV(\'Gen\',50,20);">Ge 50:20</a>, etc.). In some cases the Revised Version (British and American) renders literal translation: <a onClick="return mV(\'Act\',27,2);">Ac 27:2</a>, "was about to sail" (the King James Version "meaning to sail"); compare <a onClick="return mV(\'Act\',21,13);">Ac 21:13</a>; <a onClick="return mV(\'2Cr\',8,13);">2Co 8:13</a>. In other instances the idea of "to mean" is "to signify," "to denote" (<a onClick="return mV(\'1Sa\',4,6);">1Sa 4:6</a>; <a onClick="return mV(\'Gen\',21,29);">Ge 21:29</a>; <a onClick="return mV(\'Mat\',9,13);">Mt 9:13</a>, etc.). <a onClick="return mV(\'Luk\',15,26);">Lu 15:26</a> translates literally, "what these things might be." In <a onClick="return mV(\'Exd\',12,26);">Ex 12:26</a> the sense of "mean ye" is "to have in mind."``16';
isbe[5888]='Meani`me-a\'-ni: the King James Version = the Revised Version (British and American) "Maani" (1Esdras 5:31).``1';
isbe[5889]='Mearah`me-a\'-ra (me\'arah; omitted in the Septuagint): A town or district mentioned only in <a onClick="return mV(\'Jos\',13,4);">Jos 13:4</a>, as belonging to the Zidonians. The name as it stands means "cave." If that is correct it may be represented by the modern village Mogheiriyeh, "little cave," not far from Sidon. Perhaps, however, we should find in the word the name of a Sidonian city, with the preposition min, that has suffered change in transcription. Septuagint reads "from Gaza"; but Gaza is obviously too far to the south.``1';
isbe[5890]='Measure; Measures`mezh\'-ur, Several different words in the Hebrew and Greek are rendered by "measure" in English Versions of the Bible. In <a onClick="return mV(\'Job\',11,9);">Job 11:9</a> and <a onClick="return mV(\'Jer\',13,25);">Jer 13:25</a> it stands for madh, middah, and it is the usual rendering of the verb madhadh, "to measure," i.e. "stretch out," "extend," "spread." It is often used to render the words representing particular measures, such as [\'ephah] (<a onClick="return mV(\'Deu\',25,14,15);">De 25:14,15</a>; <a onClick="return mV(\'Pro\',20,10);">Pr 20:10</a>; <a onClick="return mV(\'Mic\',6,10);">Mic 6:10</a>); or kor (<a onClick="return mV(\'1Ki\',4,22);">1Ki 4:22</a>; <a onClick="return mV(\'1Ki\',5,11);">5:11</a> (<a onClick="return mV(\'1Ki\',5,2);">1Ki 5:2</a>, <a onClick="return mV(\'1Ki\',5,5);">5:25</a> Hebrew text); <a onClick="return mV(\'2Ch\',2,10);">2Ch 2:10 (Hebrew text 2:9)</a>; <a onClick="return mV(\'2Ch\',27,5);">27:5</A>; <a onClick="return mV(\'Ezr\',7,22);">Ezr 7:22</a>); or seah (<a onClick="return mV(\'Gen\',18,6);">Ge 18:6</a>; <a onClick="return mV(\'1Sa\',25,18);">1Sa 25:18</a>; <a onClick="return mV(\'1Ki\',18,32);">1Ki 18:32</a>; <a onClick="return mV(\'2Ki\',7,1,16,18);">2Ki 7:1,16,18</a>); or batos, "bath" (<a onClick="return mV(\'Luk\',16,6);">Lu 16:6</a>). For these terms see <a href="./study/isbe/search.html?string=WEIGHTS+AND+MEASURES">WEIGHTS AND MEASURES</a>. It also renders middah, "measure of length" (<a onClick="return mV(\'Exd\',26,2);">Ex 26:2</a>); mesurah, a liquid measure (<a onClick="return mV(\'Lev\',19,35);">Le 19:35</a>; <a onClick="return mV(\'1Ch\',23,29);">1Ch 23:29</a>; <a onClick="return mV(\'Eze\',4,11,16);">Eze 4:11,16</a>); mishpat, "judgment" (<a onClick="return mV(\'Jer\',30,11);">Jer 30:11</a>; <a onClick="return mV(\'Jer\',46,28);">46:28</a>); ca\'ce\'ah, a word of uncertain meaning, perhaps derived from seah (<a onClick="return mV(\'Isa\',27,8);">Isa 27:8</a>); shalish, "threefold, large measure" (<a onClick="return mV(\'Psa\',80,5);">Ps 80:5</a> (Hebrew text <a onClick="return mV(\'Psa\',80,6);">Ps 80:6</a>); <a onClick="return mV(\'Isa\',40,12);">Isa 40:12</a>); tokhen, and mathkoneth, "weight" and that which is weighed, taken as measure (<a onClick="return mV(\'Eze\',45,11);">Eze 45:11</a>). In <a onClick="return mV(\'Isa\',5,14);">Isa 5:14</a> it stands for choq, "limit." In the New Testament, besides being the usual rendering of the verb metreo, and of the noun metron, it is used for choinix, a dry measure containing about a quart (<a onClick="return mV(\'Rev\',6,6);">Re 6:6</a>).``138';
isbe[5891]='Measuring Line`(qaw, qeweh): The usual meaning is simply line, rope or cord, in <a onClick="return mV(\'Isa\',28,10,13);">Isa 28:10,13</a>, but the line was used for measurement, as is evident from such passages as <a onClick="return mV(\'1Ki\',7,23);">1Ki 7:23</a>; <a onClick="return mV(\'Job\',38,5);">Job 38:5</a>; <a onClick="return mV(\'Jer\',31,39);">Jer 31:39</a>. Whether the line for measuring had a definite length or not we have no means of knowing. In <a onClick="return mV(\'Isa\',44,13);">Isa 44:13</a> it refers to the line used by the carpenter in marking the timber on which he is working, and in <a onClick="return mV(\'Zec\',1,16);">Zec 1:16</a> it refers to the builder\'s line.<P>Figuratively: It signifies destruction, or a portion of something marked off by line for destruction, as in <a onClick="return mV(\'2Ki\',21,13);">2Ki 21:13</a>; or for judgment, as in <a onClick="return mV(\'Isa\',28,17);">Isa 28:17</a>.``138';
isbe[5892]='Measuring Reed`(qeneh hamiddah; kalamos): Used in <a onClick="return mV(\'Eze\',40,5);">Eze 40:5</a>ff; <a onClick="return mV(\'Eze\',42,16);">42:16</a>; <a onClick="return mV(\'Eze\',45,1);">45:1</a>; <a onClick="return mV(\'Rev\',11,1);">Re 11:1</a>; <a onClick="return mV(\'Rev\',21,15,16);">21:15,16</a>. The length of the reed is given as 6 cubits, each cubit being a cubit and a palm, i.e. the large cubit of 7 palms, or about 10 ft. See <a href="./study/isbe/search.html?string=CUBIT">CUBIT</a>. Originally it was an actual reed used for measurements of considerable length, but came at last to be used for a measure of definite length, as indicated by the reference in Ezkiel (compare "pole" in English measures).``1';
isbe[5893]='Meat`met (broma, brosis): In the King James Version used for food in general, e.g. "I had my meat of herbs" (2Esdras 12:51); "his disciples were gone away into the city to buy meat," the Revised Version (British and American) "food" (<a onClick="return mV(\'Jhn\',4,8);">Joh 4:8</a>). The English word signified whatever is eaten, whether of flesh or other food.``1';
isbe[5894]='Meat offering``<a href="./study/isbe/search.html?string=SACRIFICE">SACRIFICE</a>`1';
isbe[5895]='Mebunnai`me-bun\'-i, me-bun\'-a-i (mebhunnay, "well-built"): One of David\'s "braves" (<a onClick="return mV(\'2Sa\',23,27);">2Sa 23:27</a>). In <a onClick="return mV(\'2Sa\',21,18);">2Sa 21:18</a> he is named "Sibbechai" (the Revised Version (British and American) "Sibbecai"), and is there mentioned as the slayer of a Philistine giant. The Revised Version (British and American) spelling occurs in <a onClick="return mV(\'1Ch\',11,29);">1Ch 11:29</a>, the King James Version "Sibbechai" in <a onClick="return mV(\'1Ch\',20,4);">1Ch 20:4</a> (compare <a onClick="return mV(\'2Sa\',21,18);">2Sa 21:18</a>); and in <a onClick="return mV(\'1Ch\',27,11);">1Ch 27:11</a> the Revised Version (British and American) spelling recurs, where this person is mentioned as captain of the 8th course of the 12 monthly courses that served the king in rota. Scribal error, and the similarity in Hebrew spelling of the two forms accounts for the difference in spelling. the Revised Version (British and American) consistently tries to keep this right.``186';
isbe[5896]='Mecherathite`me-ke\'-rath-it (mekherathi, "dweller in Mecharah"): Possibly this is a misreading of "Maachathite" (the King James Version). It is the description of Hepher, one of David\'s valiant men (<a onClick="return mV(\'1Ch\',11,36);">1Ch 11:36</a>).<P>In the Wallel list of <a onClick="return mV(\'2Sa\',23,1);">2Sa 23</a>, especially <a onClick="return mV(\'2Sa\',23,34);">23:34</A>, the "Maachathite" is mentioned without name in the place in the list given to Hepher in <a onClick="return mV(\'1Ch\',11,36);">1Ch 11:36</a>. The variations do not destroy the conviction that the list is virtually the same.``1';
isbe[5897]='Meconah`me-ko\'-na (mekhonah; Machna): A town apparently in the neighborhood of Ziklag, named only in <a onClick="return mV(\'Neh\',11,28);">Ne 11:28</a>, as reoccupied by the men of Judah after the Captivity. It is not identified.``1';
isbe[5898]='Medaba`med\'-a-ba: The Greek form of "Medeba" in 1Macc 9:36.``1';
isbe[5899]='Medad`me\'-dad (medhadh, "affectionate"): One of the 70 elders on whom the spirit of the Lord came in the days of Moses enabling them to prophesy. Medad and one other, Eldad, began to prophesy in the camp, away from the other elders who had assembled at the door of the tabernacle to hear God\'s message. Joshua suggested that Eldad and Medad be stopped, but Moses interceded on their behalf, saying, "Would that all Yahweh\'s people were prophets!" (<a onClick="return mV(\'Num\',11,\'26-29\');">Nu 11:26-29</a>). The subject-matter of their prophecy has been variously supplied by tradition. Compare the Palestine Targums at the place, the apocalyptic Book of Eldad and Modad, and Ba\'al ha-Turim (ad loc.).``80';
isbe[5900]='Medan`me\'-dan (medhan, "strife"): One of the sons of Abraham by Keturah (<a onClick="return mV(\'Gen\',25,2);">Ge 25:2</a>; <a onClick="return mV(\'1Ch\',1,32);">1Ch 1:32</a>). The tribe and its place remain unidentified, and the conjecture that the name may be connected with the Midianites is unlikely from the fact that in the list of the sons of Abraham and Keturah Midian is mentioned alongside of Medan.``1';
