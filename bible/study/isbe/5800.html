isbe[5828]='Martha`mar\'-tha (Martha, "mistress," being a transliteration of the feminine form of mar, "Lord"): Martha belonged to Bethany, and was the sister of Lazarus and Mary (<a onClick="return mV(\'Jhn\',11,1);">Joh 11:1</a>f). From the fact that the house into which Jesus was received belonged to Martha, and that she generally took the lead in action, it is inferred that she was the eider sister. Martha was one of those who gave hospitality to Jesus during His public ministry. Thus, in the course of those wanderings which began when "he stedfastly set his face to go to Jerus" (<a onClick="return mV(\'Luk\',9,51);">Lu 9:51</a>), he "entered into a certain village"—its name is not stated—and "a certain woman named Martha received him into her house" (<a onClick="return mV(\'Luk\',10,38);">Lu 10:38</a>). Martha, whose sense of responsibility as hostess weighed heavily upon her, was "cumbered about much serving," and her indignation was aroused at the lack of assistance given to her by her sister. Her words, "Lord, dost thou not care?" implied a certain reproach to Jesus also, in that she felt He showed a want of sympathy with her efforts and was the cause of Mary\'s remissness. But Jesus, in tones of gentle reproof, reminded her that for Him not the preparation of an elaborate meal but the hearing of His Word in the spirit of Mary was the "one thing needful" (<a onClick="return mV(\'Luk\',10,\'39-42\');">Lu 10:39-42</a>).<P>Martha is first mentioned by John—the only other Gospel writer who refers to Martha—in his account of the raising of Lazarus from the dead at Bethany (<a onClick="return mV(\'Jhn\',11,\'1-44\');">Joh 11:1-44</a>). The narrative indicates, however, that Jesus was already on terms of the closest friendship with her and her household (compare <a onClick="return mV(\'Jhn\',11,3,5);">11:3,5</a>). In the incident which John here records, Martha again displayed her more practical nature by going out to meet Jesus, while Mary sat in the house (<a onClick="return mV(\'Jhn\',11,20);">11:20</A>). But she was not behind her sister in her love for her brother (<a onClick="return mV(\'Jhn\',11,19);">11:19</A>), in her faith in Jesus (<a onClick="return mV(\'Jhn\',11,21);">11:21</A>f) and in her belief in the final resurrection (<a onClick="return mV(\'Jhn\',11,3,5);">11:24</a>). The power of Him, whom she termed the "Teacher," to restore Lazarus to life even upon earth was beyond her understanding. To the words of Jesus concerning this she gave, however, a verbal assent, and went and informed Mary, "The Teacher is here, and calleth thee" (<a onClick="return mV(\'Jhn\',11,27);">11:27</a>f). Yet she remained inwardly unconvinced, and remonstrated when Jesus ordered the stone before the grave to be removed (<a onClick="return mV(\'Jhn\',11,39);">11:39</A>). Jesus then recalled His previous words to her remembrance (<a onClick="return mV(\'Jhn\',11,40);">11:40</a>), and vindicated them by restoring her brother to life (<a onClick="return mV(\'Jhn\',11,\'41-44\');">11:41-44</a>). After the raising of Lazarus, Jesus then made His departure, but after a short stay in Ephraim (<a onClick="return mV(\'Jhn\',11,54);">11:54</A>) He returned to Bethany (<a onClick="return mV(\'Jhn\',12,1);">Joh 12:1</a>). While He supped there, Martha once more served, and Lazarus was also present (<a onClick="return mV(\'Jhn\',12,2);">Joh 12:2</a>). It was on this occasion that Mary anointed the feet of Jesus (<a onClick="return mV(\'Jhn\',12,\'3-8\');">Joh 12:3-8</a>). According to <a onClick="return mV(\'Mat\',26,\'6-13\');">Mt 26:6-13</a>; <a onClick="return mV(\'Mar\',14,\'3-9\');">Mr 14:3-9</a>, the anointing took place in the house of Simon the leper, and it has hence been concluded by some that Martha was the wife or widow of Simon. The anointing described in <a onClick="return mV(\'Luk\',7,\'36-50\');">Lu 7:36-50</a> happened in the house of Simon a Pharisee. But in none of the synoptist accounts is Martha mentioned. For the relationship of these anointings with each other, see <a href="./study/isbe/search.html?string=MARY">MARY, IV</a>. As, according to John, the abode of the sisters was in Bethany, a further difficulty of a topographical nature is raised by those who hold that Luke implies, from the Galilean setting of <a onClick="return mV(\'Luk\',10,\'38-41\');">Lu 10:38-41</a>, that the sisters lived in Galilee. But the information supplied by Luke, upon which this inference is based, is of the vaguest (compare <a onClick="return mV(\'Luk\',10,38);">Lu 10:38</a>), and the great division of Luke\'s Gospel (<a onClick="return mV(\'Luk\',9,\'51-\');">Lu 9:51-18:31</a>) has within it no organic cohesion of parts. In it is mentioned that on two separate occasions Jesus passed through Samaria (<a onClick="return mV(\'Luk\',9,52);">Lu 9:52</a>; <a onClick="return mV(\'Luk\',17,11);">17:11</a>). It is therefore more logical to suppose that the events described in <a onClick="return mV(\'Luk\',10,\'38-41\');">Lu 10:38-41</a>, falling within the intervening period, took place in Bethany during an excursion of Jesus to Judea, and formed one of the several visits upon which the friendship recorded in <a onClick="return mV(\'Jhn\',11,3,5);">Joh 11:3,5</a> was built. According to a fragment of a Coptic gospel belonging to the 2nd century (compare Hennecke, Neutestamentliche Apokryphen, 38, 39), Martha was present with the other two Marys at the empty grave of Jesus (compare <a onClick="return mV(\'Mat\',28,1,11);">Mt 28:1,11</a>), and went and informed the disciples.``88';
isbe[5829]='Martyr`mar\'-ter (martus, Aeolic martur): One who gives heed, and so, a "witness," so translated in numerous passages, both as of one bearing testimony, and also as of one who is a spectator of anything (see <a href="./study/isbe/search.html?string=WITNESS">WITNESS</a>). In the King James Version rendered "martyr" in <a onClick="return mV(\'Act\',22,20);">Ac 22:20</a>, "thy martyr Stephen"; and <a onClick="return mV(\'Rev\',2,13);">Re 2:13</a>, "Antipas my faithful martyr"; also <a onClick="return mV(\'Act\',17,6);">17:6</A>, "the blood of the martyrs of Jesus," where alone the American Standard Revised Version retains "martyrs." These 3 passages are the beginning of the use of the word "martyr" for such witnesses as were faithful even unto death, its uniform modern use.``1';
isbe[5830]='Marvel; Marvelous`mar\'-vel, mar\'-vel-us (tamah, pala\'; thaumazo, thaumastos): "To marvel" is the translation of tamah, "to wonder" (<a onClick="return mV(\'Gen\',43,33);">Ge 43:33</a>; <a onClick="return mV(\'Psa\',48,5);">Ps 48:5</a>, the Revised Version (British and American) "were amazed"; <a onClick="return mV(\'Ecc\',5,8);">Ec 5:8</a>); of thaumazo, "to admire," "wonder" (<a onClick="return mV(\'Mat\',8,10,27);">Mt 8:10,27</a>; <a onClick="return mV(\'Mar\',5,20);">Mr 5:20</a>; <a onClick="return mV(\'Jhn\',3,7);">Joh 3:7</a>; <a onClick="return mV(\'Act\',2,7);">Ac 2:7</a>; <a onClick="return mV(\'Rev\',17,7);">Re 17:7</a> the King James Version, etc.); "marvel" (substantive) occurs in the plural as translation of pala\', "to distinguish," figuratively, "to make wonderful" (<a onClick="return mV(\'Exd\',34,10);">Ex 34:10</a>, "I will do marvels, such as have not been wrought" (the Revised Version margin "created")); and of thaumastos (thauma) (<a onClick="return mV(\'2Cr\',11,14);">2Co 11:14</a>).<P>"Marvelous" is the translation of pala\', "marvelous works" (<a onClick="return mV(\'1Ch\',16,12,24);">1Ch 16:12,24</a>; <a onClick="return mV(\'Psa\',9,1);">Ps 9:1</a>); "marvelous things" (<a onClick="return mV(\'Job\',5,9);">Job 5:9</a>; <a onClick="return mV(\'Job\',10,16);">10:16</a>; <a onClick="return mV(\'Psa\',31,21);">Ps 31:21</a>; <a onClick="return mV(\'Psa\',118,23);">118:23</a>; <a onClick="return mV(\'Isa\',29,14);">Isa 29:14</a>; <a onClick="return mV(\'Dan\',11,36);">Da 11:36</a>; <a onClick="return mV(\'Zec\',8,6);">Zec 8:6</a>, bis); "marvellously," pala\' (<a onClick="return mV(\'Job\',37,5);">Job 37:5</a>; <a onClick="return mV(\'Hab\',1,5);">Hab 1:5</a> twice (tamah), "regard and wonder marvelously," literally, "marvel marvelously"); thaumastos, "admirable," "wonderful," is translated "marvelous" (<a onClick="return mV(\'Mat\',21,42);">Mt 21:42</a>; <a onClick="return mV(\'1Pe\',2,9);">1Pe 2:9</a>; <a onClick="return mV(\'Rev\',15,1,3);">Re 15:1,3</a>, etc.).<P>In Apocrypha we have "marvel" (Ecclesiasticus 11:13; 47:17; 2Macc 1:22; 7:12); "marvelleth" (Ecclesiasticus 40:7; 43:18); "marvellous" (The <span class="noTag">Wisdom of Solomon 10:17; 19:8</span>, etc., mostly thaumazo and compounds).<P>The Revised Version (British and American) has "wonder" for "marvel" (<a onClick="return mV(\'Rev\',17,7);">Re 17:7</a>)\' "the marvel" for a "marvellous thing" (<a onClick="return mV(\'Jhn\',9,30);">Joh 9:30</a>); "marvelled" for "wondered" (<a onClick="return mV(\'Luk\',8,25);">Lu 8:25</a>; <a onClick="return mV(\'Luk\',11,14);">11:14</a>); "marvelled at" for "admired" (<a onClick="return mV(\'2Th\',1,10);">2Th 1:10</a>); "marveling" for "wondered" (<a onClick="return mV(\'Luk\',9,43);">Lu 9:43</a>); "marvellous" for "wondrous" (<a onClick="return mV(\'1Ch\',16,9);">1Ch 16:9</a>; <a onClick="return mV(\'Psa\',105,2);">Ps 105:2</a>); "marvellous things" for "and wonders" (<a onClick="return mV(\'Job\',9,10);">Job 9:10</a>); "wonderful" for "marvellous" (<a onClick="return mV(\'Psa\',139,14);">Ps 139:14</a>); for "marvelled" (<a onClick="return mV(\'Mat\',9,8);">Mt 9:8</a>), "were afraid," and (<a onClick="return mV(\'Mar\',12,17);">Mr 12:17</a>) "marvelled greatly" (different texts).``185';
isbe[5831]='Mary`ma\'-ri, mar\'-i (Maria, Mariam, Greek form of Hebrew miryam):<P><b>I. DEFINITION AND QUESTIONS OF IDENTIFICATION</b><P class="in15">The Name Mary in the New Testament<P><b>II. MARY, THE VIRGIN</b><P class="in15">1. Mary in the Infancy Narratives<P class="in15">2. Mary at Cana<P class="in15">3. Mary and the Career of Jesus<P class="in15">4. Mary at the Cross<P class="in15">5. Mary in the Christian Community<P class="in15">6. Mary in Ecclesiastical Doctrine and Tradition<P class="in30">(1) Legend<P class="in30">(2) Dogma<P class="in45">(a) The Dogma of Her Sinlessness<P class="in45">(b) Dogma of Mary\'s Perpetual Virginity<P class="in45">(c) Doctrine of Mary\'s Glorification as the Object of Worship and Her Function as Intercessor<P class="in30">(3) Conclusion<P><b>III. MARY MAGDALENE</b><P class="in15">1. Mary Not the Sinful Woman of <a onClick="return mV(\'Luk\',7,\'1-\');">Luke 7</a><P class="in15">2. Mary Not a Nervous Wreck<P><b>IV. MARY OF BETHANY</b><P class="in15">1. Attack upon Luke\'s Narrative<P class="in15">2. Evidence of Luke Taken Alone<P class="in15">3. Evidence Sifted by Comparison<P class="in15">4. Character of Mary<P><b>V. MARY, THE MOTHER OF JAMES AND JOSES</b><P><b>VI. MARY, THE MOTHER OF JOHN MARK</b><hr /><P>I. Definition and Questions of Identification.<P>A Hebrew feminine proper name of two persons in the Old Testament (see <a onClick="return mV(\'Exd\',15,20);">Ex 15:20</a>; <a onClick="return mV(\'Num\',12,1);">Nu 12:1</a>; <a onClick="return mV(\'Mic\',6,4);">Mic 6:4</a>; <a onClick="return mV(\'1Ch\',4,17);">1Ch 4:17</a>) and of a number not certainly determined in the New Testament. The prevalence of the name in New Testament times has been attributed, with no great amount of certainty, to the popularity of Mariamne, the last representative of the Hasmonean family, who was the second wife of Herod I.<P>The Name Mary in the New Testament:<P>(1) The name Mary occurs in 51 passages of the New Testament to which the following group of articles is confined (see <a href="./study/isbe/search.html?string=MIRIAM">MIRIAM</a>). Collating all these references we have the following apparent notes of identification:<P class="in15">(a) Mary, the mother of Jesus;<P class="in15">(b) Mary Magdalene;<P class="in15">(c) Mary, the mother of James;<P class="in15">(d) Mary, the mother of Joses;<P class="in15">(e) Mary, the wife of Clopas;<P class="in15">(f) Mary of Bethany;<P class="in15">(g) Mary, the mother of Mark;<P class="in15">(h) Mary of Rome;<P class="in15">(i) the "other" Mary.<P>(2) A comparison of <a onClick="return mV(\'Mat\',27,56);">Mt 27:56</a>; <a onClick="return mV(\'Mat\',28,1);">28:1</a> with <a onClick="return mV(\'Mar\',15,47);">Mr 15:47</a> seems clearly to identify the "other" Mary with Mary the mother of Joses.<P>(3) <a onClick="return mV(\'Mar\',15,40);">Mr 15:40</a> identifies Mary the mother of James and Mary the mother of Joses (compare <a onClick="return mV(\'Mar\',15,47);">Mr 15:47</a>) (see Allen\'s note on <a onClick="return mV(\'Mat\',27,56);">Mt 27:56</a>).<P>(4) At this point a special problem of identification arises. Mary, the wife of Clopas, is mentioned as being present at the cross with Mary the mother of Jesus, the latter\'s sister and Mary of Magdala (<a onClick="return mV(\'Jhn\',19,25);">Joh 19:25</a>). In the other notices of the group at the cross, Mary, the mother of James, is mentioned (<a onClick="return mV(\'Mat\',27,56);">Mt 27:56</a>; <a onClick="return mV(\'Mar\',15,40);">Mr 15:40</a>). Elsewhere, James is regularly designated "son of Alpheus" (<a onClick="return mV(\'Mat\',10,3);">Mt 10:3</a>; <a onClick="return mV(\'Mar\',3,18);">Mr 3:18</a>; <a onClick="return mV(\'Luk\',6,15);">Lu 6:15</a>). Since it can hardly be doubted that James, the apostle, and James the Less, the son of Mary, are one and the same person, the conclusion seems inevitable that Mary, the mother of James, is also the wife of Alpheus. Here we might stop and leave the wife of Clopas unidentified, but the fact that the name Alpheus (Alphaios) is the Greek transliteration of the Aramaic chalpay, together with the unlikelihood that anyone important enough to be mentioned by John would be omitted by the synoptists and that another Mary, in addition to the three definitely mentioned, could be present and not be mentioned, points to the conclusion that the wife of Clopas is the same person as the wife of Alpheus (see <a href="./study/isbe/search.html?string=ALPHAEUS">ALPHAEUS</a>). Along with this reasonable conclusion has grown, as an excrescence, another for which there is no basis whatever; namely, that the wife of Clopas was the sister of Mary, the mother of Jesus. This would make the apostle James the cousin of Jesus, and, by an extension of the idea, would identify James, the apostle, with James, the "Lord\'s brother." The available evidence is clearly against both these inferences (see <a onClick="return mV(\'Mat\',13,55);">Mt 13:55</a>; <a onClick="return mV(\'Mar\',6,3);">Mr 6:3</a>; <a onClick="return mV(\'Gal\',1,19);">Ga 1:19</a>).<P>(5) One other possible identification is offered for our consideration. Zahn, in an exceedingly interesting note (New Testament, II, 514), identifies Mary of Rome (<a onClick="return mV(\'Rom\',16,6);">Ro 16:6</a>) with the "other" Mary of Matthew. We need not enter into a discussion of the point thus raised, since the identification of a woman of whom we have no details given is of little more than academic interest.<P>We are left free, however, by the probabilities of the case to confine our attention to the principal individuals who bear the name of Mary. We shall discuss Mary, the mother of Jesus; Mary of Magdala; Mary of Bethany; Mary, the mother of James and Joses; Mary, the mother of Mark.<P>II. Mary, the Virgin.<P>The biography of the mother of Jesus is gathered about a brief series of episodes which serve to exhibit her leading characteristics in clear light. Two causes have operated to distort and make unreal the very clear and vivid image of Mary left for us in the Gospels. Roman Catholic dogmatic and sentimental exaggeration has well-nigh removed Mary from history (see <a href="./study/isbe/search.html?string=IMMACULATE+CONCEPTION">IMMACULATE CONCEPTION</a>). On the other hand, reaction and overemphasis upon certain features of the Gospel narrative have led some to credit Mary with a negative attitude toward our Lord and His claims, which she assuredly never occupied. It is very important that we should follow the narrative with unprejudiced eyes and give due weight to each successive episode.<P>Mary appears in the following passages: the Infancy narratives, <a onClick="return mV(\'Mat\',1,\'1-\');">Mt 1</a> and <a onClick="return mV(\'Mat\',2,\'1-\');">2</a>; <a onClick="return mV(\'Luk\',1,\'1-\');">Lu 1</a> and <a onClick="return mV(\'Luk\',2,\'1-\');">2</a>; the wedding at Cana of Galilee, <a onClick="return mV(\'Jhn\',2,\'1-11\');">Joh 2:1-11</a>; the episode of <a onClick="return mV(\'Mat\',12,46);">Mt 12:46</a>; <a onClick="return mV(\'Mar\',3,21,31);">Mr 3:21,31</a>ff; the incident at the cross, <a onClick="return mV(\'Jhn\',19,25);">Joh 19:25</a>ff; the scene in the upper chamber, <a onClick="return mV(\'Act\',1,14);">Ac 1:14</a>.<P>1. Mary in the Infancy Narratives:<P>(1) It is to be noted, first of all, that Mary and her experiences form the narrative core of both Infancy documents. This is contrary to the ordinary opinion, but is unquestionably true. She is obviously the object of special interest to Luke (see Ramsay, Was Christ Born at Bethlehem? 76f), and there are not wanting indications that Luke\'s story came from Mary herself. But, while Matthew\'s account does not exhibit his interest in Mary quite so readily, that he was interested in the pathetic story of the Lord\'s mother is evident.<P>Luke tells the story of Mary\'s inward and deeply personal experiences, her call (<a onClick="return mV(\'Luk\',1,26);">1:26f</a>), her maidenly fears (<a onClick="return mV(\'Luk\',1,29,35);">1:29,35</A>), her loyal submission (<a onClick="return mV(\'Luk\',1,38);">1:38</A>), her outburst of sacred and unselfish joy (<a onClick="return mV(\'Luk\',1,\'39-55\');">1:39-55</A>). From this anticipatory narrative he passes at once to the Messianic fulfillment.<P>Matthew tells the story of the outward and, so to say, public experiences of Mary which follow hard upon the former and are in such dramatic contrast with them: the shame and suspicion which fell upon her (<a onClick="return mV(\'Mat\',1,18);">1:18</a>); her bitter humiliation (<a onClick="return mV(\'Mat\',1,19);">1:19</a>), her ultimate vindication (<a onClick="return mV(\'Mat\',1,20);">1:20</A>f). Here the two narratives supplement each other by furnishing different details but, as in other instances, converge upon the central fact—the central fact here being Mary herself, her character, her thoughts, her experiences. The point to be emphasized above all others is that we have real biography, although in fragments; in that the same person appears in the inimitable reality of actual characterization, in both parts of the story. This is sufficient guaranty of historicity; for no two imaginary portraits ever agreed unless one copied the other—which is evidently not the case here. More than this, the story is a truly human narrative in which the remarkable character of the events which took place in her life only serves to bring into sharper relief the simple, humble, natural qualities of the subject of them.<P>(2) One can hardly fail to be impressed, in studying Mary\'s character with her quietness of spirit; her meditative inwardness of disposition; her admirable self-control; her devout and gracious gift of sacred silence. The canticle (<a onClick="return mV(\'Luk\',1,\'46-55\');">Lu 1:46-55</a>), which at least expresses Luke\'s conception of her nature, indicates that she is not accustomed to dwell much upon herself (4 lines only call particular attention to herself), and that her mind is saturated with the spirit and phraseology of the Old Testament. The intensely Jewish quality of her piety thus expressed accounts for much that appears anomalous in her subsequent career as depicted in the Gospels.<P>2. Mary at Cana:<P>The first episode which demands our attention is the wedding at Cana of Galilee (<a onClick="return mV(\'Jhn\',2,\'1-11\');">Joh 2:1-11</a>). The relationship between Jesus and His mother has almost eclipsed other interests in the chapter. It is to be noted that the idea of wanton interference on the part of Mary and of sharp rebuke on the part of Jesus is to be decisively rejected. The key to the meaning of this episode is to be found in 4 simple items:<P class="in15">(1) in a crisis of need, Mary turns naturally to Jesus as to the one from whom help is to be expected;<P class="in15">(2) she is entirely undisturbed by His reply, whatever its meaning may be;<P class="in15">(3) she prepares the way for the miracle by her authoritative directions to the servants;<P class="in15">(4) Jesus does actually relieve the situation by an exercise of power.<P>Whether she turned to Jesus with distinctly Messianic expectation, or whether Jesus intended to convey a mild rebuke for her eagerness, it is not necessary for us to inquire, as it is not possible for us to determine. It is enough that her spontaneous appeal to her Son did not result in disappointment, since, in response to her suggestion or, at least, in harmony with it, He "manifested his glory." The incident confirms the Infancy narrative in which Mary\'s quiet and forceful personality is exhibited.<P>3. Mary and the Career of Jesus:<P>In <a onClick="return mV(\'Mat\',12,46);">Mt 12:46</a> (parallel <a onClick="return mV(\'Mar\',3,\'31-35\');">Mr 3:31-35</a>), we are told that, when His mother and His brethren came seeking Him, Jesus in the well-known remark concerning His true relatives in the kingdom of heaven intended to convey a severe rebuke to His own household for an action which involved both unbelief and presumptuous interference in His great life-work. The explanation of this incident, which involves no such painful implications as have become connected with it in the popular mind, is to be found in Mark\'s account. He interrupts his narrative of the arrival of the relatives (which belongs in <a onClick="return mV(\'Mar\',3,21);">Mr 3:21</a>) by the account of the accusation made by the scribes from Jerusalem that the power of Jesus over demons was due to Beelzebub. This goes a long way toward explaining the anxiety felt by the relatives of Jesus, since the ungoverned enthusiasm of the multitude. which gave Him no chance to rest and seemed to threaten His health, was matched, contrariwise, by the bitter, malignant opposition of the authorities, who would believe any malicious absurdity rather than that His power came from God. The vital point is that the attempt of Mary and her household to get possession of the person of Jesus, in order to induce Him to go into retirement for a time, was not due to captious and interfering unbelief, but to loving anxiety. The words of Jesus have the undoubted ring of conscious authority and express the determination of one who wills the control of his own life—but it is a serious mistake to read into them any faintest accent of satire. It has been well said (Horace Bushnell, Sermons on Living Subject, 30) that Jesus would scarcely make use of the family symbolism to designate the sacred relationships of the kingdom of heaven, while, at the same time, He was depreciating the value and importance of the very relationships which formed the basis of His analogy. The real atmosphere of the incident is very different from this.<P>4. Mary at the Cross:<P>To be sure that many have misinterpreted the above incident we need only turn to the exquisitely tender scene at the cross recorded by John (<a onClick="return mV(\'Jhn\',19,25);">19:25</a>ff). This scene, equally beautiful whether one considers the relationship which it discloses as existing between Jesus and His mother, or between Jesus and His well-beloved disciple removes all possible ambiguity which might attach to the preceding incidents, and reveals the true spirit of the Master\'s home. Jesus could never have spoken as He did from the cross unless He had consistently maintained the position and performed the duties of an eldest son. The tone and quality of the scene could never have been what it is had there not been a steadfast tie of tender love and mutual understanding between Jesus and His mother. Jesus could hand over His sacred charge to the trustworthy keeping of another, because He had faithfully maintained it Himself.<P>5. Mary in the Christian Community:<P>The final passage which we need to consider (<a onClick="return mV(\'Act\',1,14);">Ac 1:14</a>) is especially important because in it we discover Mary and her household at home in the midst of the Christian community, engaged with them in prayer. It is also clear that Mary herself and the family, who seemed to be very completely under her influence, whatever may have been their earlier misgivings, never broke with the circle of disciples, and persistently kept within the range of experiences which led at last to full-orbed Christian faith. This makes it sufficiently evident, on the one hand, that the household never shared the feelings of the official class among the Jews; and, on the other, that the family of Jesus passed through the same cycle of experiences which punctuated the careers of the whole body of disciples on the way to faith. The beating of this simple but significant fact upon the historical trustworthiness of the body of incidents just passed in review is evident.<P>The sum of the matter concerning Mary seems to be this: The mother of Jesus was a typical Jewish believer of the best sort. She was a deeply meditative, but by no means a daring or original thinker. Her inherited Messianic beliefs did not and perhaps could not prepare her for the method of Jesus which involved so much that was new and unexpected. But her heart was true, and from the beginning to the day of Pentecost, she pondered in her heart the meaning of her many puzzling experiences until the light came. The story of her life and of her relationship to Jesus is consistent throughout and touched with manifold unconscious traits of truth. Such a narrative could not have been feigned or fabled.<P>6. Mary in Ecclesiastical Doctrine and Tradition:<P>(1) Legend.<P>The ecclesiastical treatment of Mary consists largely of legend and dogma, about equally fictitious and unreliable. The legendary accounts, which include the apocryphal gospels, deal, for the most part, with details tails of her parentage and early life; her betrothal and marriage to Joseph; her journey to Bethlehem and the birth of her child. At this point the legendary narratives, in their crass wonder-mongering and indelicate intimacy of detail, are in striking contrast to the chaste reserve of the canonical story, and of evidential value on that account.<P>(2) Dogma.<P>There is, in addition, a full-grown legend concerning Mary\'s later life in the house of John; of her death in which the apostles were miraculously allowed to participate; her bodily translation to heaven; her reception at the hands of Jesus and her glorification in heaven. In this latter series of statements, we have already made the transition from legend to dogma. It is quite clear, from the statements of Roman Catholic writers themselves, that no reliable historical data are to be found among these legendary accounts. The general attitude of modern writers is exhibited in the following sentences (from Wilhelm and Scannel, Manual of Catholic Theology, II, 220, quoted by Mayor, Hastings, Dictionary of the Bible, II, 288, note): "Mary\'s corporeal assumption into heaven is so thoroughly implied in the notion of her personality as given by Bible and dogma, that the church, can dispense with strict historical evidence of the fact." If that is the way one feels, there is very little to say about it. Aside from the quasi-historical dogma of Mary\'s bodily assumption, the Roman Catholic doctrinal interpretation of her person falls into three parts.<P>(a) The Dogma of Her Sinlessness:<P>This is discussed under <a href="./study/isbe/search.html?string=IMMACULATE+CONCEPTION">IMMACULATE CONCEPTION</a> (which see) and need not detain us here.<P>(b) Dogma of Mary\'s Perpetual Virginity:<P>It is evident that this, too, is a doctrine of such a nature that its advocates might, with advantage to their argument, have abstained from the appearance of critical discussion.<P>Even if all the probabilities of exegesis are violated and the cumulative evidence that Mary had other children done away with; if the expression, "brethren of the Lord" is explained as "foster-brethren," "cousins" or what-not; if Jesus is shown to be not only "first-born" but "only-born" Son (<a onClick="return mV(\'Luk\',2,7);">Lu 2:7</a>); if the expression of <a onClick="return mV(\'Mat\',1,25);">Mt 1:25</a> is interpreted as meaning "up to and beyond" (Pusey, et al.; compare Roman Catholic Dict., 604), it would still be as far as possible from a demonstration of the dogma. That a married woman has no children is no proof of virginity—perpetual or otherwise. That this thought has entered the minds of Roman Catholic apologists although not openly expressed by them, is evidenced by the fact that while certain forms of dealing with the "brethren-of-the-Lord" question make these the sons of Joseph by a former marriage, the favorite doctrine includes the perpetual virginity of Joseph. Just as the idea of the sinlessness of Mary has led to the dogma of the immaculate conception, so the idea of her perpetual virginity demands the ancillary notion of Joseph\'s. No critical or historical considerations are of any possible use here. It is a matter of dogmatic assumption unmixed with any alloy of factual evidence, and might better be openly made such.<P>It is evident that a very serious moral issue is raised here. The question is not whether virginity is a higher form of life than marriage. One might be prepared to say that under certain circumstances it is. The point at issue here is very different. If Mary was married to Joseph and Joseph to Mary in appearance only, then they were recreant to each other and to the ordinance of God which made them one. How a Roman Catholic, to whom marriage is a sacrament, can entertain such a notion is an unfathomable mystery. The fact that Mary was miraculously the mother of the Messiah has nothing to do with the question of her privilege and obligation in the holiest of human relationships. Back of this unwholesome dogma are two utterly false ideas: that the marriage relationship is incompatible with holy living, and that Mary is not to be considered a human being under the ordinary obligations of human life.<P>(c) Doctrine of Mary\'s Glorification as the Object of Worship and Her Function as Intercessor: With no wish to be polemic toward Roman Catholicism, and, on the contrary, with every desire to be sympathetic, it is very difficult to be patient with the puerilities which disfigure the writings of Roman Catholic dogmaticians in the discussion of this group of doctrines.<P>(i) Take, for example, the crude literalism involved in the identification of the woman of <a onClick="return mV(\'Rev\',12,\'1-6\');">Re 12:1-6</a> with Mary. Careful exegesis of the passage (especially <a onClick="return mV(\'Rev\',12,6);">12:6</a>), in connection with the context, makes it clear that no hint of Mary\'s status in heaven is intended. As a matter of fact, Mary, in any literal sense, is not referred to at all. Mary\'s motherhood along with that of the mother of Moses is very likely the basis of the figure, but the woman of the vision is the church, which is, at once, the mother and the body of her Lord (see Milligan, Expositors\' Bible, "Revelation," 196f).<P>Three other arguments are most frequently used to justify the place accorded to Mary in the liturgy.<P>(ii) Christ\'s perpetual humanity leads to His perpetual Sonship to Mary. This argument, if it carries any weight at all, in this connection, implies that the glorified Lord Jesus is still subject to His mother. It is, however, clear from the Gospels that the subjection to His parents which continued after the incident in the Temple (<a onClick="return mV(\'Luk\',2,51);">Lu 2:51</a>) was gently but firmly laid aside at the outset of the public ministry (see above, II,2,3). In all that pertains to His heavenly office, as Lord, Mary\'s position is one of dependence, not of authority.<P>(iii) Christ hears her prayers. Here, again, dogmatic assumption is in evidence. That He hears her prayers, even if true in a very special sense, does not, in the least, imply that prayers are to be addressed to her or that she is an intercessor through whom prayers may be addressed to Him.<P>(iv) Since Mary cared for the body of Christ when He was on earth, naturally His spiritual body would be her special care in heaven. But, on any reasonable hypothesis, Mary was, is, and must remain, a part of that body (see <a onClick="return mV(\'Act\',1,14);">Ac 1:14</a>). Unless she is intrinsically a Divine being, her care for the church cannot involve her universal presence in it and her accessibility to the prayers of her fellow-believers.<P>To a non-Romanist, the most suggestive fact in the whole controversy is that the statements of cautious apologists in support of the ecclesiastical attitude toward Mary, do not, in the least degree, justify the tone of extravagant adulation which marks the non-polemical devotional literature of the subject (see Dearden, Modern Romanism Examined, 22f).<P>(3) Conclusion.<P>Our conclusion on the whole question is that the literature of Mariolatry belongs, historically, to unauthorized speculation; and, psychologically, to the natural history of asceticism and clerical celibacy.<P>III. Mary Magdalene<P>(Maria Magdalene = of "Magdala").—A devoted follower of Jesus who entered the circle of the taught during the Galilean ministry and became prominent during the last days. The noun "Magdala," from which the adjective "Magdalene" is formed, does not occur in the Gospels (the word in <a onClick="return mV(\'Mat\',15,39);">Mt 15:39</a>, is, of course, "Magadan"). The meaning of this obscure reference is well summarized in the following quotations from Plummer (International Critical Commentary, "Luke," 215): "\'Magdala is only the Greek form of mighdol or watch-tower, one of the many places of the name in Palestine\' (Tristram, Bible Places, 260); and is probably represented by the squalid group of hovels which now bears the name of Mejdel near the center of the western shore of the lake."<P>1. Mary not the Sinful Woman of <a onClick="return mV(\'Luk\',7,\'1-\');">Luke 7</a>:<P>As she was the first to bear witness to the resurrection of Jesus, it is important that we should get a correct view of her position and character. The idea that she was a penitent, drawn from the life of the street, undoubtedly arose, in the first instance, from a misconception of the nature of her malady, together with an altogether impossible identification of her with the woman who was a sinner of the preceding section of the Gospel. It is not to be forgotten that the malady demon-possession, according to New Testament ideas (see <a href="./study/isbe/search.html?string=DEMON,+DEMONOLOGY">DEMON, DEMONOLOGY</a>), had none of the implications of evil temper and malignant disposition popularly associated with "having a devil." The possessed was, by our Lord and the disciples looked upon as diseased, the victim of an alien and evil power, not an accomplice of it. Had this always been understood and kept in mind, the unfortunate identification of Mary with the career of public prostitution would have been much less easy.<P>According to New Testament usage, in such cases the name would have been withheld (compare <a onClick="return mV(\'Luk\',7,37);">Lu 7:37</a>; <a onClick="return mV(\'Jhn\',8,3);">Joh 8:3</a>). At the same time the statement that 7 demons had been cast out of Mary means either that the malady was of exceptional severity, possibly involving several relapses (compare <a onClick="return mV(\'Luk\',11,26);">Lu 11:26</a>), or that the mode of her divided and haunted consciousness (compare <a onClick="return mV(\'Mar\',5,9);">Mr 5:9</a>) suggested the use of the <span class="noTag">number</span> 7. Even so, she was a healed invalid, not a rescued social derelict.<P>The identification of Mary with the sinful woman is, of course, impossible for one who follows carefully the course of the narrative with an eye to the transitions. The woman of <a onClick="return mV(\'Luk\',7,\'1-\');">Luke 7</a> is carefully covered with the concealing cloak of namelessness. Undoubtedly known by name to the intimate circle of first disciples, it is extremely doubtful whether she was so known to Luke. Her history is definitely closed at <a onClick="return mV(\'Luk\',7,50);">7:50</A>.<P>The name of Mary is found at the beginning of a totally new section of the Gospel (see Plummer\'s analysis, op. cit., xxxvii), where the name of Mary is introduced with a single mark of identification, apart from her former residence, which points away from the preceding narrative and is incompatible with it. If the preceding account of the anointing were Mary\'s introduction into the circle of Christ\'s followers, she could not be identified by the phrase of Luke. Jesus did not cast a demon out of the sinful woman of <a onClick="return mV(\'Luk\',7,\'1-\');">Luke 7</a>, and Mary of Magdala is not represented as having anointed the Lord\'s feet. The two statements cannot be fitted together.<P>2. Mary Not a Nervous Wreck:<P>Mary has been misrepresented in another way, scarcely less serious. She was one of the very first witnesses to the resurrection, and her testimony is of sufficient importance to make it worth while for those who antagonize the narrative to discredit her testimony. This is done, on the basis of her mysterious malady, by making her a paranoiac who was in the habit of "seeing things." Renan is the chief offender in this particular, but others have followed his example.<P>(1) To begin with, it is to be remarked that Mary had been cured of her malady in such a marked way that, henceforth, throughout her life, she was a monument to the healing power of Christ. What He had done for her became almost a part of her name along with the name of her village. It is not to be supposed that a cure so signal would leave her a nervous wreck, weak of will, wavering in judgment, the victim of hysterical tremors and involuntary hallucinations.<P>(2) There is more than this a priori consideration against such an interpretation of Mary. She was the first at the tomb (<a onClick="return mV(\'Mat\',28,1);">Mt 28:1</a>; <a onClick="return mV(\'Mar\',16,1);">Mr 16:1</a>; <a onClick="return mV(\'Luk\',24,10);">Lu 24:10</a>). But she was also the last at the cross—she and her companions (<a onClick="return mV(\'Mat\',27,61);">Mt 27:61</a>; <a onClick="return mV(\'Mar\',15,40);">Mr 15:40</a>). A glance at the whole brief narrative of her life in the Gospels will interpret this combination of statements. Mary first appears near the beginning of the narrative of the Galilean ministry as one of a group consisting of "many" (<a onClick="return mV(\'Luk\',8,3);">Lu 8:3</a>), among them Joanna, wife of Chuzas, Herod\'s steward, who followed with the Twelve and ministered to them of their substance. Mary then disappears from the text to reappear as one of the self-appointed watchers of the cross, thereafter to join the company of witnesses to the resurrection. The significance of these simple statements for the understanding of Mary\'s character and position among the followers of Jesus is not far to seek. She came into the circle of believers, marked out from the rest by an exceptional experience of the Lord\'s healing power. Henceforth, to the very end, with unwearied devotion, with intent and eager willingness, with undaunted courage even in the face of dangers which broke the courage of the chosen Twelve, she followed and served her Lord. It is impossible that such singleness of purpose, such strength of will, and, above all, such courage in danger, should have been exhibited by a weak, hysterical, neurotic incurable. The action of these women of whom Mary was one, in serving their Master\'s need while in life, and in administering the last rites to His body in death, is characteristic of woman at her best.<P>IV. Mary of Bethany.<P>Another devoted follower of Jesus. She was a resident of Bethany (Bethania), and a member of the family consisting of a much-beloved brother, Lazarus, and another sister, Martha, who made a home for Jesus within their own circle whenever He was in the neighborhood.<P>The one descriptive reference, aside from the above, connected with Mary, has caused no end of perplexity. John (<a onClick="return mV(\'Jhn\',11,2);">11:2</a>) states that it was this Mary who anointed the Lord with ointment and wiped His feet with her hair, whose brother Lazarus was sick. This reference would be entirely satisfied by the narrative of <a onClick="return mV(\'Jhn\',12,1,8);">Joh 12:1,8</a>, and no difficulty would be suggested, were it not for the fact that Luke (<a onClick="return mV(\'Luk\',7,\'36-50\');">7:36-50</a>) records an anointing of Jesus by a woman, accompanied with the wiping of His feet with her hair. The identification of these two anointings would not occasion any great difficulty, in spite of serious discrepancies as to time, place and other accessories of the action, but for the very serious fact that the woman of <a onClick="return mV(\'Luk\',7,\'1-\');">Lu 7</a> is described as a sinner in the dreadful special sense associated with that word in New Testament times. This is so utterly out of harmony with all that we know of Mary and the family at Bethany as to be a well-nigh intolerable hypothesis.<P>On the other hand, we are confronted with at least one serious difficulty in affirming two anointings. This is well stated by Mayor (Hastings Dictionary Bible, III, 280a): "Is it likely that our Lord would have uttered such a high encomium upon Mary\'s act if she were only following the example already set by the sinful woman of Galilee; or (taking the other view) if she herself were only repeating under more favorable circumstances the act of loving devotion for which she had already received His commendation?" We shall be compelled to face this difficulty in case we are forced to the conclusion that there were more anointings than one.<P>1. Attack upon Luke\'s Narrative:<P>In the various attempts to solve this problem, or rather group of problems, otherwise than by holding to two anointings, Luke, who stands alone against Mark, Matthew and John, has usually suffered loss of confidence. Mayor (op. cit., 282a) suggests the possibility that the text of Luke has been tampered with, and that originally his narrative contained no reference to anointing. This is a desperate expedient which introduces more difficulties than it solves. Strauss and other hostile critics allege confusion on the part of Luke between the anointing at Bethany and the account of the woman taken in adultery, but, as Plummer well says, the narrative shows no signs of confusion. "The conduct both of Jesus and of the woman is unlike either fiction or clumsily distorted fact. His gentle severity toward Simon, and tender reception of the sinner, are as much beyond the reach of invention as the eloquence of her speechless affection" (International Critical Commentary, "Luke," 209).<P>2. Evidence of Luke Taken Alone:<P>The first step in the solution of this difficulty is to note carefully the evidence supplied by Luke\'s narrative taken by itself. Mary is named for the first time in <a onClick="return mV(\'Luk\',10,\'38-42\');">Lu 10:38-42</a> in a way which clearly indicates that the family of Bethany is there mentioned for the first time (a "certain tis woman named Martha," and "she had a sister called Mary," etc.). This phrasing indicates the introduction of a new group of names (compare <a onClick="return mV(\'Jhn\',11,1);">Joh 11:1</a>). It is also a clear indication of the fact that Luke does not identify Mary with the sinful woman of <a onClick="return mV(\'Luk\',7,\'1-\');">Luke 7</a> (compare <a onClick="return mV(\'Mat\',26,\'6-13\');">Mt 26:6-13</a>; <a onClick="return mV(\'Mar\',14,\'3-9\');">Mr 14:3-9</a>; <a onClick="return mV(\'Luk\',7,\'36-50\');">Lu 7:36-50</a>; <a onClick="return mV(\'Jhn\',12,\'1-8\');">Joh 12:1-8</a>).<P>3. Evidence Sifted by Comparison:<P>Our next task is to note carefully the relationship between the narratives of Mark, Matthew and John on one side, and that of Luke on the other. We may effectively analyze the narratives under the following heads:<P class="in15">(1) notes of time and place;<P class="in15">(2) circumstances and scenery of the incident;<P class="in15">(3) description of the person who did the anointing;<P class="in15">(4) complaints of her action, by whom and for what;<P class="in15">(5) the lesson drawn from the woman\'s action which constitutes our Lord\'s defense of it;<P class="in15">(6) incidental features of the narrative.<P>Under<P>(1) notice that all three evangelists place the incident near the close of the ministry and at Bethany. Under<P>(2) it is important to observe that Matthew and Mark place the scene in the house of Simon "the leper," while John states vaguely that a feast was made for Him by persons not named and that Martha served. Under<P>(3) we observe that Matthew and Mark say "a woman," while John designates Mary.<P>(4) According to Matthew, the disciples found fault; according to Mark, some of those present found fault; while according to John, the fault-finder was Judas Iscariot. According to all three, the ground or complaint is the alleged wastefulness of the action.<P>(5) Again, according to all three, our Lord defended the use made of the ointment by a mysterious reference to an anointing of His body for the burial. John\'s expression in particular is most interesting and peculiar (see <a onClick="return mV(\'Jhn\',12,7);">Joh 12:7</a>).<P>(6) The Simon in whose house the incident is said to have taken place is by Matthew and Mark designated "the leper." This must mean either that he had previously been cured or that his disease had manifested itself subsequent to the feast. Of these alternatives the former is the more natural (see Gould, International Critical Commentary, "Mark," 257). The presence of a healed leper on this occasion, together with the specific mention of Lazarus as a guest, would suggest that the feast was given by people, in and about Bethany, who had especial reason to be grateful to Jesus for the exercise of His healing power.<P>It is beyond reasonable doubt that the narratives of Matthew, Mark and John refer to the same incident. The amount of convergence and the quality of it put this identification among the practical certainties. The only discrepancies of even secondary importance are a difference of a few days in the time (Gould says four) and the detail as to the anointing of head or feet. It is conceivable, and certainly no very serious matter, that John assimilated his narrative at this point to the similar incident of <a onClick="return mV(\'Luk\',7,\'1-\');">Lu 7</a>.<P>An analysis of the incident of <a onClick="return mV(\'Luk\',7,\'1-\');">Lu 7</a> with reference to the same points of inquiry discloses the fact that it cannot be the same as that described by the other evangelists.<P>(1) The time and place indications, such as they are, point to Galilee and the Galilean ministry. This consideration alone is a formidable obstacle in the way of any such identification.<P>(2) The immediate surroundings are different. Simon "the leper" and Simon "the Pharisee" can hardly be one person. No man could have borne both of these designations. In addition to this, it is difficult to believe that a Pharisee of Simon\'s temper would have entertained Jesus when once he had been proscribed by the authorities. Simon\'s attitude was a very natural one at the beginning of Christ\'s ministry, but the combination of hostility and questioning was necessarily a temporary mood.<P>(3) The description of the same woman as sinner in the sense of <a onClick="return mV(\'Luk\',7,\'1-\');">Lu 7</a> in one Gospel; simply as a woman in two others; and as the beloved and honored Mary of Bethany in a third is not within the range of probability, especially as there is no hint of an attempt at explanation on the part of any of the writers. At any rate, prima facie, this item in Luke\'s description is seriously at variance with the other narratives.<P>(4) Luke is again at variance with the others, if he is supposed to refer to the same event, in the matter of the complaint and its cause. In Luke\'s account there is no complaint of the woman\'s action suggested. There is no hint that anybody thought or pretended to think that she had committed a sinful waste of precious material. The only complaint is Simon\'s, and that is directed against the Lord Himself, because Simon, judging by himself, surmised that Jesus did not spurn the woman because He did not know her character. This supposed fact had a bearing on the question of our Lord\'s Messiahship, concerning which Simon was debating; otherwise one suspects he had little interest in the episode. This fact is, as we shall see, determinative for the understanding of the incident and puts it apart from all other similar episodes.<P>(5) The lesson drawn from the act by our Lord was in each incident different. The sinful woman was commended for an act of courtesy and tenderness which expressed a love based upon gratitude for deliverance and forgiveness. Mary was commended for an act which had a mysterious and sacramental relationship to the Lord\'s death, near at hand.<P>This brings us to the point where we may consider the one serious difficulty, that alleged by Mayor and others, against the hypothesis of two anointings, namely, that a repetition of an act like this with commendation attached would not be likely to occur. The answer to this argument is that the difficulty itself is an artificial one due to a misreading of the incident. In the point of central reference the two episodes are worlds apart. The act of anointing in each case was secondary, not primary. Anointing was one of those general and prevalent acts of social courtesy which might mean much or little, this or that, and might be repeated a score of times in a year with a different meaning each time. The matter of primary importance in every such case would be the purpose and motive of the anointing. By this consideration alone we may safely discriminate between these incidents. In the former case, the motive was to express the love of a forgiven penitent. In the latter, the motive was gratitude for something quite different, a beloved brother back from the grave, and, may we not say (in view of <a onClick="return mV(\'Jhn\',12,7);">Joh 12:7</a>), grief and foreboding? That Mary\'s feeling was expressed in the same way outwardly as that of the sinful woman of the early ministry does not change the fact that the feeling was different, that the act was different and that, consequently, the commendation she received, being for a different thing, was differently expressed. The two anointings are not duplicates. Mary\'s act, though later, was quite as spontaneous and original as that of the sinful woman, and the praise bestowed upon her quite as natural and deserved.<P>4. Character of Mary:<P>With this fictitious and embarrassing identification out of the way, we are now free to consider briefly the career and estimate the character of Mary.<P>(1) At the outset it is worth mentioning that we have in the matter of these two sisters a most interesting and instructive point of contact between the synoptic and Johannine traditions. The underlying unity and harmony of the two are evident here as elsewhere. In <a onClick="return mV(\'Luk\',10,\'38-42\');">Lu 10:38-42</a> we are afforded a view of Mary and Martha photographic in its clear revelation of them both. Martha is engaged in household affairs, while Mary is sitting at the feet of Jesus, absorbed in listening. This, of course, might mean that Mary was idle and listless, leaving the burden of responsibility for the care of guests upon her more conscientious sister. Most housewives are inclined to take this view and to think that Martha has been hardly dealt with. The story points to the contrary. It will be noticed that Mary makes no defense of herself and that the Master makes no criticism of Martha until she criticizes Mary. When He does speak, it is with the characteristic and inimitable gentleness, but in a way leaving nothing to be desired in the direction of completeness. He conveyed His love, His perfect understanding of the situation, His defense of Mary, His rebuke to Martha, in a single sentence which contains a perfect photograph of the two loved sisters. Martha is not difficult to identify. She was just one of those excellent and tiresome women whose fussy concern and bustling anxiety about the details of household management make their well-meant hospitality a burden to all their guests. Mary\'s quiet and restful interest in the guest and His conversation must be set against the foil of Martha\'s excess of concern in housework and the serving of food. When one comes to think of it, Mary chose the better part of hospitality, to put no higher construction upon her conduct.<P>(2) In <a onClick="return mV(\'Jhn\',11,20);">Joh 11:20</a>, we are told that Martha went forth to meet Jesus while Mary remained in the house. In this we have no difficulty in recognizing the same contrast of outwardness and inwardness in the dispositions of the sisters; especially, as when Mary does come at Martha\'s call to meet Jesus, she exhibits an intensity of feeling of which Martha gives no sign. It is significant that, while Mary says just what Martha had already said (<a onClick="return mV(\'Jhn\',11,21,32);">11:21,32</a>), her way of saying it and her manner as a whole so shakes the Lord\'s composure that He is unable to answer her directly but addresses His inquiry to the company in general (<a onClick="return mV(\'Jhn\',11,340);">11:34</a>).<P>(3) Then we come to the events of the next chapter. The supper is given in Bethany. Martha serves. Of course she serves. She always serves when there is opportunity. Waiting on guests, plate in hand, was the innocent delight of her life. One cannot fail to see that, in a single incidental sentence, the Martha of <a onClick="return mV(\'Luk\',10,\'38-42\');">Lu 10:38-42</a> is sketched again in lifelikeness. It is the same Martha engaged in the same task. But what of Mary in this incident? She is shown in an unprecedented role, strange to an oriental woman and especially to one so retiring in disposition as Mary. Her action not only thrust her into a public place alone, but brought her under outspoken criticism. But after all, this is just what we come to expect from these deep, intense, silent natures. The Mary who sat at Jesus\' feet in listening silence while Martha bustled about the house, who remained at home while Martha went out to meet Him, is the very one to hurl herself at His feet in a storm and passion of tears when she does meet Him and to break out in a self-forgetful public act of devotion, strange to her modest disposition, however native to her deep emotion.<P>Martha was a good and useful woman. No one would deny that, least of all the Master who loved her (<a onClick="return mV(\'Jhn\',11,5);">Joh 11:5</a>). But she lived on the surface of things, and her affections and her piety alike found adequate and satisfying expression at all times in the ordinary kindly offices of hospitality and domestic service. Not so Mary. Her disposition was inward, silent, brooding, with a latent capacity for stress and the forthwith, unconventional expression of feelings, slowly gathering intensity through days of thought and repression. Mary would never be altogether at home in the world of affairs. Hers was a rare spirit, doomed often to loneliness and misunderstanding except at the hands of rarely discerning spirits, such as she happily met in the person of her Lord.<P>V. Mary, the Mother of James and Joses.<P>Under this caption it is necessary merely to recall and set in order the few facts concerning this Mary given in the Gospels (see <a onClick="return mV(\'Mat\',27,55,56,61);">Mt 27:55,56,61</a>; <a onClick="return mV(\'Mar\',15,40);">Mr 15:40</a>; <a onClick="return mV(\'Mar\',16,1);">16:1</a>; <a onClick="return mV(\'Luk\',24,10);">Lu 24:10</a>; compare <a onClick="return mV(\'Luk\',23,\'49-56\');">Lu 23:49-56</a>).<P>In <a onClick="return mV(\'Mat\',27,55,56);">Mt 27:55,56</a> (parallel <a onClick="return mV(\'Mar\',15,40);">Mr 15:40</a>), we are told that at the time of the crucifixion there was a group of women observing the event from a distance. These women are said to have followed Jesus from Galilee, ministering to Him and to the disciples. Among these were Mary Magdalene (see III, above); Mary, mother of James and Joses; and the unnamed mother of Zebedee\'s children. By reference to <a onClick="return mV(\'Luk\',8,2,3);">Lu 8:2,3</a>, where this group is first introduced, it appears that, as a whole, it was composed of those who had been healed of infirmities of one kind or another. Whether this description applies individually to Mary or not we cannot be sure, but it is altogether probable. At any rate, it is certain that Mary was one who persistently followed with the disciples and ministered of her substance to aid and comfort the Lord in His work for others. The course of the narrative seems to imply that Mary\'s sons accompanied their mother on this ministering journey and that one of them became an apostle. It is interesting to note that two mothers with their sons joined the company of the disciples and that three out of the four became members of the apostolic group. Another item in these only too fragmentary references is that this Mary, along with her of Magdala and the others of this group, was of sufficient wealth and position to be marked among the followers of Jesus as serving in this particular way. The mention of Chuzas\' wife (<a onClick="return mV(\'Luk\',8,3);">Lu 8:3</a>) is an indication of the unusual standing of this company of faithful women.<P>The other notices of Mary show her lingering late at the cross (<a onClick="return mV(\'Mar\',15,40);">Mr 15:40</a>); a spectator at the burial (<a onClick="return mV(\'Mar\',15,47);">Mr 15:47</a>); and among the first to bear spices to the tomb. This is the whole of this woman\'s biography extant, but perhaps it is enough. We are told practically nothing, directly, concerning her; but, incidentally, she is known to be generous, faithful, loving, true and brave. She came in sorrow to the tomb to anoint the body of her dead Lord; she went away in joy to proclaim Him alive forevermore. A privilege to be coveted by the greatest was thus awarded to simple faith and trusting love.<P>VI. Mary, the Mother of John Mark.<P>This woman is mentioned but once in the New Testament (<a onClick="return mV(\'Act\',12,12);">Ac 12:12</a>), but in a connection to arouse intense interest. Since she was the mother of Mark, she was also, in all probability, the aunt of Barnabas. The aunt of one member and the mother of another of the earliest apostolic group is a woman of importance. The statement in Acts, so far as it concerns Mary, is brief but suggestive. Professor Ramsay (see Paul the Traveler, etc., 385) holds that the authority for this narrative was not Peter but Mark, the son of the house. This, if true, adds interest to the story as we have it. In the first place, the fact that Peter went thither directly upon his escape from prison argues that Mary\'s house was a well-known center of Christian life and worship. The additional fact that coming unannounced and casually the apostle found a considerable body of believers assembled points in the same direction. That "many" were gathered in the house at the same time indicates that the house was of considerable size. It also appears that Rhoda was only one of the maids, arguing a household of more than ordinary size. There is a tradition of doubtful authenticity, that Mary\'s house was the scene of a still more sacred gathering in the upper room on the night of the betrayal. We conclude that Mary was a wealthy widow of Jerusalem, who, upon becoming a disciple of Christ, with her son, gave herself with whole-souled devotion to Christian service, making her large and well-appointed house a place of meeting for the proscribed and homeless Christian communion whose benefactor and patron she thus became.``169';

isbe[5835]='Mash`(mash): Named in <a onClick="return mV(\'Gen\',10,23);">Ge 10:23</a> as one of the sons of Aramaic In the parallel passage in <a onClick="return mV(\'1Ch\',1,17);">1Ch 1:17</a> the name is given as "Meshech" (meshekh), and the Septuagint (Mosoch) supports this form in both passages. "Meshech," however, is a Japhetic name (<a onClick="return mV(\'Gen\',10,2);">Ge 10:2</a>), and "Mash" would seem to be the original reading. It is probably to be identified with the Mons Masius of classical writers (Strabo, etc.), on the northern boundary of Mesopotamia.``1';
isbe[5836]='Mashal`ma\'-shal (mashal, <a onClick="return mV(\'1Ch\',6,74);">1Ch 6:74</a>).`<a href="./study/isbe/search.html?string=MISHAL">MISHAL</a>`1';
isbe[5837]='Masias`ma-si\'-as (Codex Alexandrinus, Masias; Codex Vaticanus, Meisaias): The head of one of the families of Solomon\'s servants (1Esdras 5:34); it has no equivalent in the parallel <a onClick="return mV(\'Ezr\',2,55);">Ezr 2:55</a>ff; the Revised Version margin "Missaias."``1';
