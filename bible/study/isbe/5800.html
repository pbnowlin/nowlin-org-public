isbe[5839]='Mason`ma\'-s\'n: The translation of 4 Hebrew words:<P>(1) charash \'ebhen, "graver of stone" (<a onClick="return mV(\'2Sa\',5,11);">2Sa 5:11</a>);<P>(2) (3) gadhar (<a onClick="return mV(\'2Ki\',12,12);">2Ki 12:12</a>), charash qur (<a onClick="return mV(\'1Ch\',14,1);">1Ch 14:1</a>), "maker of a wall (or hedge)";<P>(4) chatsabh, "a hewer or digger (of stones)" (<a onClick="return mV(\'1Ch\',22,2);">1Ch 22:2</a>; <a onClick="return mV(\'Ezr\',3,7);">Ezr 3:7</a>).<P>Lebanon still supplies the greater number of skilled masons to Palestine and Syria (see <a onClick="return mV(\'2Sa\',5,11);">2Sa 5:11</a>), those of Shweir being in special repute.`<a href="./study/isbe/search.html?string=CRAFTS">CRAFTS</a>; <a href="./study/isbe/search.html?string=ARCHITECTURE">ARCHITECTURE</a>; <a href="./study/isbe/search.html?string=BUILDING">BUILDING</a>; <a href="./study/isbe/search.html?string=GEBAL">GEBAL</a>; <a href="./study/isbe/search.html?string=HOUSE">HOUSE</a>`1';
isbe[5840]='Maspha`mas\'-fa (1Macc 3:46, the Revised Version (British and American) "Mizpeh").`<a href="./study/isbe/search.html?string=MIZPEH">MIZPEH</a>`1';
isbe[5841]='Masrekah`mas\'-re-ka, mas-re\'-ka (masreqah; Masekka): A place mentioned in the list of ancient rulers of Edom (<a onClick="return mV(\'Gen\',36,31);">Ge 36:31</a>), "before there reigned any king over the children of Israel." Masrekah was the royal city of Samlah, son of Hadad (<a onClick="return mV(\'Gen\',36,36);">Ge 36:36</a>; <a onClick="return mV(\'1Ch\',1,47);">1Ch 1:47</a>). The name may mean "place of choice vines," but there is nothing to show in what locality it must be sought.``1';
isbe[5842]='Massa`mas\'-a (massa\', "burden"): Descendant of Abraham through Ishmael (<a onClick="return mV(\'Gen\',25,14);">Ge 25:14</a>; <a onClick="return mV(\'1Ch\',1,30);">1Ch 1:30</a>). His people may be the Masani of Ptolemy, having Eastern Arabia near Babylon as their habitat. The marginal reading of the heading to <a onClick="return mV(\'Pro\',31,\'1-\');">Pr 31</a> mentions Lemuel as king of Massa. If that reading is accepted, it would seem that a tribe and probably a place were named from Ishmael\'s descendant. The reading is doubtful, however, for where the phrase recurs in <a onClick="return mV(\'Pro\',30,\'1-\');">Pr 30</a> (Revised Version (British and American)) it appears to be a gloss.``1';
isbe[5843]='Massacre of the Innocents`mas\'-a-ker.`<a href="./study/isbe/search.html?string=INNOCENTS,+MASSACRE+OF+THE">INNOCENTS, MASSACRE OF THE</a>`1';
isbe[5844]='Massah And Meribah`mas\'-a, mer\'-i-ba (maccah umeribhah, "proving and strife"; peirasmos kai loidoresis): These names occur together as applied to one place only in <a onClick="return mV(\'Exd\',17,7);">Ex 17:7</a>; they stand, however, in parallelism in <a onClick="return mV(\'Deu\',33,8);">De 33:8</a>; <a onClick="return mV(\'Psa\',95,8);">Ps 95:8</a>. In all other cases they are kept distinct, as belonging to two separate narratives. The conjunction here may be due to conflation of the sources. Of course, it is not impossible that, for the reason stated, the double name was given, although elsewhere (<a onClick="return mV(\'Deu\',6,16);">De 6:16</a>; <a onClick="return mV(\'Deu\',9,22);">9:22</a>) the place is referred to as Massah.<P>1. First Instance:<P>This scene is laid in <a onClick="return mV(\'Exd\',17,1);">Ex 17:1</a> at <a href="./study/isbe/search.html?string=REPHIDIM">REPHIDIM</a> (which see) and in <a onClick="return mV(\'Exd\',17,6);">17:6</a> at <a href="./study/isbe/search.html?string=HOREB">HOREB</a> (which see). It is near the beginning of the desert wanderings. In dearth of water the people murmur and complain. Moses, appealing to God, is told what to do. He takes with him the elders of Israel, and smites with his rod the rock on which the Lord stands in Horeb, whereupon water gushes forth, and the people drink. Here Moses alone is God\'s agent. There is no hint of blame attaching to him. He called the place Massah and Meribah, because of the of the striving of the children of Israel, and because they tempted the Lord (<a onClick="return mV(\'Exd\',17,7);">17:7</A>). In some way not indicated, here and at Meribah, God put the Levites to proof (<a onClick="return mV(\'Deu\',33,8);">De 33:8</a>).<P>2. Second Instance:<P>The second narrative describes what took place at Kadesh (i.e. "Kadesh-barnea") when the desert wanderings were nearly over (<a onClick="return mV(\'Num\',20,\'1-13\');">Nu 20:1-13</a>). The flow of water from the famous spring for some reason had ceased. In their distress the people became impatient and petulant. At the door of the tent of meeting Moses and Aaron received the Lord\'s instructions. In his speech of remonstrance to the people Moses seemed to glorify himself and his brother; and instead of speaking to the rock as God had commanded, he struck it twice with his rod. The flow of water was at once restored; but Moses and Aaron were heavily punished because they did not sanctify God in the eyes of the children of Israel. The "Waters of Meribah" was the name given to this scene of strife. The incident is referred to in <a onClick="return mV(\'Num\',20,24);">Nu 20:24</a>, and <a onClick="return mV(\'Deu\',32,51);">De 32:51</a> (merobhath qadhesh, the King James Version "Meribah-Kadesh," the Revised Version (British and American) "Meribah of Kadesh"). In <a onClick="return mV(\'Psa\',81,7);">Ps 81:7</a> God appears as having tested Israel here. The sin of Israel and the ensuing calamity to Moses are alluded to in <a onClick="return mV(\'Psa\',106,32);">Ps 106:32</a>.<P>The place appears in <a onClick="return mV(\'Eze\',47,19);">Eze 47:19</a>; <a onClick="return mV(\'Eze\',48,28);">48:28</a>, as on the southern border of the land of Israel, in the former as "Meriboth-kadesh," in the latter as "Meribath-kadesh" (Meriboth = plural Meribath = "construct singular") where the position indicated is that of \'Ain Qadis, "Kadesh-barnea."<P>In <a onClick="return mV(\'Deu\',33,2);">De 33:2</a>, by a slight emendation of the text we might read meribhoth qadhesh for meribhebhoth qodhesh. This gives a preferable sense.``54';
isbe[5845]='Massias`ma-si\'-as (Codex Alexandrinus, Massias; Codex Vaticanus, Asseias): One of those who put away their "strange wives" (1Esdras 9:22) = "Maaseiah" of <a onClick="return mV(\'Ezr\',10,22);">Ezr 10:22</a>.``1';
isbe[5846]='Mast``<a href="./study/isbe/search.html?string=SHIPS+AND+BOATS">SHIPS AND BOATS</a>`1';
isbe[5847]='Master`mas\'-ter (\'adhon, ba\'al, rabbi; despotes, didaskalos, kurios, rhabbi): "Master," when the translation of \'adhon, "ruler," "lord" (Sir), often translated "lord," denotes generally the owner or master of a servant or slave (<a onClick="return mV(\'Gen\',24,9);">Ge 24:9</a>, etc.; <a onClick="return mV(\'Gen\',39,2);">39:2</A>, etc.; <a onClick="return mV(\'Exd\',21,4);">Ex 21:4</a>, etc.; <a onClick="return mV(\'Deu\',23,15);">De 23:15</a> bis; <a onClick="return mV(\'2Sa\',9,9,10);">2Sa 9:9,10</a> twice; <a onClick="return mV(\'Pro\',30,10);">Pr 30:10</a>); elsewhere it is rather "lord" or "ruler" (often king, e.g. <a onClick="return mV(\'1Sa\',24,6,8);">1Sa 24:6,8</a>; <a onClick="return mV(\'1Sa\',26,16);">26:16</a>); in the plural \'adhonim, it is, as the rule, used only of God (but see <a onClick="return mV(\'Gen\',19,2,18);">Ge 19:2,18</a>; <a onClick="return mV(\'Deu\',10,17);">De 10:17</a>; <a onClick="return mV(\'Psa\',136,3);">Ps 136:3</a>, "Lord of lords"; <a onClick="return mV(\'Isa\',26,13);">Isa 26:13</a>, "other lords"; <a onClick="return mV(\'Isa\',19,4);">19:4</A> (Hebrew "lords"); <a onClick="return mV(\'Isa\',24,2);">24:2</A>). Ba\'al, "lord," "owner," is translated "master": "the master of the house" (<a onClick="return mV(\'Exd\',22,8);">Ex 22:8</a>; <a onClick="return mV(\'Jdg\',19,22,23);">Jud 19:22,23</a>); "the ass his master\'s crib" (<a onClick="return mV(\'Isa\',1,3);">Isa 1:3</a>). We have it also translated "masters of assemblies" (<a onClick="return mV(\'Ecc\',12,11);">Ec 12:11</a>). See <a href="./study/isbe/search.html?string=ASSEMBLIES,+MASTERS+OF">ASSEMBLIES, MASTERS OF</a>. Compare Ecclesiasticus 32:1, "master (of a feast)," the Revised Version (British and American) "ruler"; <a onClick="return mV(\'Jhn\',2,9);">Joh 2:9</a>, "ruler of the feast"; [rabh] (<a onClick="return mV(\'Dan\',1,3);">Da 1:3</a>; <a onClick="return mV(\'Jon\',1,6);">Jon 1:6</a>, "shipmaster"); rabh, Aramaic, "great," "mighty," "elder" (<a onClick="return mV(\'Dan\',4,9);">Da 4:9</a>; <a onClick="return mV(\'Dan\',5,11);">5:11</a>," master of the magicians"); also [sar], "head" or "chief" (<a onClick="return mV(\'Exd\',1,11);">Ex 1:11</a>, "taskmasters"; <a onClick="return mV(\'1Ch\',15,27);">1Ch 15:27</a>, "master of the song," the Revised Version margin "the carrying of the ark, Hebrew the lifting up"); \'ur, "to call," "to awake," is also rendered "master" in the King James Version, "The Lord will cut off the man that doeth this, the master and the scholar," margin "him that waketh and him that answereth," the Revised Version (British and American) as the King James Version margin (<a onClick="return mV(\'Mal\',2,12);">Mal 2:12</a>).<P>The verb "to master" does not occur in the Old Testament, but we have in Apocrypha (The <span class="noTag">Wisdom of Solomon 12:18</span>) "mastering thy power" (despozon ischuos), the Revised Version (British and American) "being sovereign over (thy) strengh."<P>In the New Testament despotes answers to \'adhon as "master" (<a onClick="return mV(\'1Ti\',6,1,2);">1Ti 6:1,2</a>; <a onClick="return mV(\'2Ti\',2,21);">2Ti 2:21</a>), rendered also "Lord" (<a onClick="return mV(\'Luk\',2,29);">Lu 2:29</a>, etc.); kurios, is "Master," "Lord," "Sir," used very frequently of God or of Christ (<a onClick="return mV(\'Mat\',1,20,22,24);">Mt 1:20,22,24</a>), translated "Master" (<a onClick="return mV(\'Mat\',6,24);">Mt 6:24</a>; <a onClick="return mV(\'Mat\',15,27);">15:27</a>; the King James Version <a onClick="return mV(\'Mar\',13,35);">Mr 13:35</a>; <a onClick="return mV(\'Rom\',14,4);">Ro 14:4</a>, etc.); kathegetes, a "leader," is translated "Master" (<a onClick="return mV(\'Mat\',23,8);">Mt 23:8</a> (the King James Version), <a onClick="return mV(\'Mat\',23,10);">10</A>); didaskalos, a title very often applied to our Lord in the Gospels, is "Teacher," translated "Master" in the King James Version <a onClick="return mV(\'Mat\',8,19);">Mt 8:19</a>; <a onClick="return mV(\'Mat\',9,11);">9:11</a>; <a onClick="return mV(\'Mar\',4,38);">Mr 4:38</a>; <a onClick="return mV(\'Luk\',3,12);">Lu 3:12</a>, etc.; the Revised Version (British and American) "Teacher"; also <a onClick="return mV(\'Jhn\',3,2,10);">Joh 3:2,10</a>; <a onClick="return mV(\'Jam\',3,1);">Jas 3:1</a>, "be not many masters," the Revised Version (British and American) "teachers"; rhabbi, rhabbei ("Rabbi") (a transliterated Hebrew term signifying "my Teacher") is also in several instances applied to Jesus, the King James Version "Master" (<a onClick="return mV(\'Mat\',26,25,49);">Mt 26:25,49</a>; <a onClick="return mV(\'Mar\',9,5);">Mr 9:5</a>; <a onClick="return mV(\'Mar\',11,21);">11:21</a>; <a onClick="return mV(\'Jhn\',9,2);">Joh 9:2</a> (the Revised Version (British and American) leaves untranslated) <a onClick="return mV(\'Mar\',10,51);">Mr 10:51</a>, "Rabboni," the King James Version "Lord"; <a onClick="return mV(\'Jhn\',20,16);">Joh 20:16</a> ("Rabbouni"), the Revised Version (British and American) "<a href="./study/isbe/search.html?string=RABBONI">Rabboni</a>," which see).<P>For "master" the Revised Version (British and American) has "lord" (<a onClick="return mV(\'1Sa\',26,16);">1Sa 26:16</a>; <a onClick="return mV(\'1Sa\',29,4,10);">29:4,10</a>; <a onClick="return mV(\'Amo\',4,1);">Am 4:1</a>; <a onClick="return mV(\'Mar\',13,35);">Mr 13:35</a>; <a onClick="return mV(\'Rom\',14,4);">Ro 14:4</a>); "master" for "lord" (<a onClick="return mV(\'Gen\',39,16);">Ge 39:16</a>; <a onClick="return mV(\'2Pe\',2,1);">2Pe 2:1</a>; <a onClick="return mV(\'Rev\',6,10);">Re 6:10</a>); for "good man of the house" (<a onClick="return mV(\'Mat\',24,43);">Mt 24:43</a>; <a onClick="return mV(\'Luk\',12,39);">Lu 12:39</a>), "master of the house"; in <a onClick="return mV(\'Eph\',6,5);">Eph 6:5</a>, the Revised Version margin gives "Gr lords" in (<a onClick="return mV(\'Eph\',6,9);">6:9</a>, "their Master and yours" is also Greek kurios); instead of "the only Lord God and our Lord Jesus Christ" (<a onClick="return mV(\'Jud\',1,4);">Jude 1:4</a>), the Revised Version (British and American) reads "our only Master and Lord, Jesus Christ," margin "the only Master, and our Lord Jesus Christ"; for "overcame them" (<a onClick="return mV(\'Act\',19,16);">Ac 19:16</a>), "mastered both of them."``185';
isbe[5848]='Mastery`mas\'-ter-i, gebhurah, shelet, Aramaic; agonizomai, athleo): "Mastery" occurs twice in the Old Testament and twice in the King James Version of the New Testament: in <a onClick="return mV(\'Exd\',32,18);">Ex 32:18</a> (gebhurah, "might"), "the voice of them that shout for mastery"; in <a onClick="return mV(\'Dan\',6,24);">Da 6:24</a> (shelet, "to have power"), "The lions had the mastery of them"; in <a onClick="return mV(\'1Cr\',9,25);">1Co 9:25</a>, agonizomai, "to contend for a prize," to be a combatant in the public games, is translated "striveth for the mastery," the Revised Version (British and American) "striventh in the games"; and in <a onClick="return mV(\'2Ti\',2,5);">2Ti 2:5</a>, athelo, with the same meaning, is translated "strive for masteries," the Revised Version (British and American) "contend in the games." From the Greek we have the words "athlete," etc..``185';
isbe[5849]='Mastic, Mastick`mas\'-tik (schinos): A tree mentioned only in Susanna verse 54 (compare <a onClick="return mV(\'Gen\',37,25);">Ge 37:25</a> margin). It is the Pistacia lentiscus (Arabic, Mistaki), a shrub which attains a height of 10 to 12 ft., growing in thickets on the slopes round the Mediterranean. The gum which exudes through incisions made in the bark is greatly prized as a masticatory. The smell and flavor are suggestive of the terebinth. It is chewed in order to preserve the teeth and gums. But often men chew it without any special purpose, just because they like it. The mastick produced in Chios is most highly esteemed. It is employed in making perfumes and sweetmeats; in preparing bread a little is sometimes added to the dough just before it is put into the oven.``54';
isbe[5850]='Mathanias`math-a-ni\'-as: the King James Version in 1Esdras 9:31.`<a href="./study/isbe/search.html?string=MATTHANIAS">MATTHANIAS</a>`1';
isbe[5851]='Mathelas`ma-the\'-las (Codex Alexandrinus, Mathelas; Codex Vaticanus, Maeelas; the King James Version Matthelas): One of the priests who had married "strange wives" (1Esdras 9:19) = "Maaseiah" of <a onClick="return mV(\'Ezr\',10,18);">Ezr 10:18</a>.``1';
isbe[5852]='Mathusala`ma-thu\'-sa-la (Mathousala): Greek form of "Methuselah," the Revised Version (British and American) (<a onClick="return mV(\'Luk\',3,37);">Lu 3:37</a> the King James Version).``1';
isbe[5853]='Matred`ma\'-tred (matredh, "expulsion"): The mother of Mehetabel, wife of Hadar, one of the kings of Edom (<a onClick="return mV(\'Gen\',36,39);">Ge 36:39</a>; <a onClick="return mV(\'1Ch\',1,50);">1Ch 1:50</a>, "Hadad"). The Septuagint and Peshitta designate Matred as male, i.e. as son of Mezahab instead of daughter.``1';
isbe[5854]='Matri`ma\'-tri (matri, "rainy"): A family of the tribe of Benjamin to which King Saul belonged (<a onClick="return mV(\'1Sa\',10,21);">1Sa 10:21</a> the King James Version).``1';
isbe[5855]='Matrites`ma\'-trits (ha-matri): The Revised Version (British and American) translation of matri with the definite article, "the Matrites" (<a onClick="return mV(\'1Sa\',10,2);">1Sa 10:2</a>)``1';
isbe[5856]='Mattan`mat\'-an (mattan, "a gift"):<P>(1) A priest in the house of Baal, slain by Jehoiada before Baal\'s altar (<a onClick="return mV(\'2Ki\',11,18);">2Ki 11:18</a>; <a onClick="return mV(\'2Ch\',23,17);">2Ch 23:17</a>).<P>(2) The father of Shephatiah a contemporary and persecutor of Jeremiah (<a onClick="return mV(\'Jer\',38,1);">Jer 38:1</a>), one of those who put Jeremiah into Malechiah\'s dungeon (<a onClick="return mV(\'Jer\',38,6);">38:6</a>).``1';
isbe[5857]='Mattanah`mat\'-a-na (mattanah; Codex Vaticanus, Manthanaein; Codex Alexandrinus, Manthanein): A station of the Israelites which seems to have lain between Beer and Nahaliel (<a onClick="return mV(\'Num\',21,18);">Nu 21:18</a>f). The name means "gift," and might not inappropriately be applied to a well in the wilderness (Budde translates "Out of the desert a gift"; see The Expository Times, VI, 482). Some would therefore identify it with Beer. This is improbable. There is now no clue to the place, but it must have lain southwest of the Dead Sea.``1';
isbe[5858]='Mattaniah`mat-a-ni\'-a (mattanyaha, "gift of Yah"):<P>(1) King Zedekiah\'s original name, but changed by Nebuchadnezzar when he made him king over Judah instead of his nephew Jehoiachin (<a onClick="return mV(\'2Ki\',24,17);">2Ki 24:17</a>).<P>(2) A descendant of Asaph (<a onClick="return mV(\'1Ch\',9,15);">1Ch 9:15</a>), leader of the temple choir (<a onClick="return mV(\'Neh\',11,17);">Ne 11:17</a>; <a onClick="return mV(\'Neh\',12,8);">12:8</a>). Mentioned among the "porters," keepers of "the storehouses of the gates" (<a onClick="return mV(\'Neh\',12,25);">Ne 12:25</a>), and again in <a onClick="return mV(\'Neh\',12,35);">Ne 12:35</a> as among the "priests\' sons with trumpets."<P>(3) May be the same as (2), though in <a onClick="return mV(\'2Ch\',20,14);">2Ch 20:14</a> he is mentioned as an ancestor of that Jahaziel whose inspired words in the midst of the congregation encouraged Jehoshaphat to withstand the invasion of Moab, Ammon and Seir (<a onClick="return mV(\'2Ch\',20,14);">20:14</A>ff).<P>(4-7) Four others who had foreign wives,<P>(a) the Matthanias of 1Esdras 9:27 (<a onClick="return mV(\'Ezr\',10,26);">Ezr 10:26</a>);<P>(b) the Othonias of 1Esdras 9:28 (<a onClick="return mV(\'Ezr\',10,27);">Ezr 10:27</a>);<P>(c) the Matthanias of 1Esdras 9:31 (<a onClick="return mV(\'Ezr\',10,30);">Ezr 10:30</a>);<P>(d) the fourth of these in 1Esdras 9:34 the King James Version has had his name blended into that of Mattenai, and the two appear as the composite name Mamnitanemus (<a onClick="return mV(\'Ezr\',10,37);">Ezr 10:37</a>). He is a son of Bani.<P>(8) A Levite, father of Zaccur, ancestor of Hanan the under-treasurer of the Levitical offerings under Nehemiah (<a onClick="return mV(\'Neh\',13,13);">Ne 13:13</a>).<P>(9) One of the sons of Heman the singer, whose office it was to blow the horns in the temple-service as David had appointed it (<a onClick="return mV(\'1Ch\',25,4,5);">1Ch 25:4,5</a>). He was head of the 9th division of the 12 Levites (<a onClick="return mV(\'1Ch\',25,16);">1Ch 25:16</a>), who were proficient in the Songs of Yahweh (<a onClick="return mV(\'1Ch\',25,7);">1Ch 25:7</a>).<P>(10) One of the sons of Asaph who helped Hezekiah in the fulfilling of his vow to cleanse the house of the Lord (<a onClick="return mV(\'2Ch\',29,13);">2Ch 29:13</a>).``186';
isbe[5859]='Mattatha`mat\'-a-tha (Mattatha): Son of Nathan the son of David in the genealogy of Jesus (<a onClick="return mV(\'Luk\',3,31);">Lu 3:31</a>).``1';
isbe[5860]='Mattathah`mat\'-a-tha: the Revised Version (British and American).`<a href="./study/isbe/search.html?string=MATTATTAH">MATTATTAH</a>`1';
isbe[5861]='Mattathias`mat-a-thi\'-as (Mattathias). The persons of this name in the Apocrypha are:<P>(1) Mattathias the father of the Maccabees.<P>See <a href="./study/isbe/search.html?string=ASMONEANS">ASMONEANS</a>; <a href="./study/isbe/search.html?string=MACCABEES">MACCABEES</a>.<P>(2) One of the 7 who stood on Ezra\'s right hand as he read the law (1Esdras 9:43) = "Mattithiah" of <a onClick="return mV(\'Neh\',8,4);">Ne 8:4</a>.<P>(3) The son—probably the youngest (compare 1Macc 16:2)—of Simon the Maccabean, treacherously murdered along with his father and his brother Judas by his brother-in-law Ptolemy, son of Abubus in the stronghold of Dok near Jericho in the 177th Seleucid—136-135 BC (1Macc 16:14).<P>(4) Son of Absalom, one of the two "captains of the forces" who in the campaign against Demetrius in the plain of Hazor gallantly supported Judas, enabling the latter to turn an impending defeat into a great victory (1Macc 11:70).<P>(5) One of the three envoys sent by Nicanor to treat with Judas in 161 BC (2Macc 14:19). No names of envoys are given in the account of 1Macc 7:27ff.<P>(6) One of the sons of Asom who put away his "strange wife" (1Esdras 9:33) = the King James Version "Matthias" = "Mattattah" of <a onClick="return mV(\'Ezr\',10,33);">Ezr 10:33</a>.<P>In addition to these two of this name are mentioned in the New Testament:<P>(7) <a onClick="return mV(\'Luk\',3,25);">Lu 3:25</a>, "son of Amos."<P>(8) <a onClick="return mV(\'Luk\',3,26);">Lu 3:26</a>, "son of Semein."``5';
isbe[5862]='Mattattah`mat\'-a-ta (mattattah): the Revised Version (British and American) for "Mattathah" in the King James Version (<a onClick="return mV(\'Ezr\',10,33);">Ezr 10:33</a>). The same as "Mattathias" of 1Esdras 9:33, the King James Version "<a href="./study/isbe/search.html?string=MATTHIAS">Matthias</a>" (which see).``1';
isbe[5863]='Mattenai`mat-e-na\'-i, mat\'-e-ni (mattenay, "liberal"):<P>(1) (2) Two who married foreign wives, one a son of Hashum (<a onClick="return mV(\'Ezr\',10,33);">Ezr 10:33</a>; in 1Es 9:33 "Altanneus"); the other a son of Bani (<a onClick="return mV(\'Ezr\',10,37);">Ezr 10:37</a>).<P>(3) A priest in the days of Joiakim son of Jeshua (<a onClick="return mV(\'Neh\',12,19);">Ne 12:19</a>), representing the house of Joiarib.``1';
isbe[5864]='Matter`mat\'-er: This word being a very general term may express various ideas. the Revised Version (British and American) therefore frequently changes the reading of the King James Version in order to state more definitely the meaning of the context (compare <a onClick="return mV(\'Exd\',24,14);">Ex 24:14</a>; <a onClick="return mV(\'1Sa\',16,18);">1Sa 16:18</a>; <a onClick="return mV(\'1Ki\',8,59);">1Ki 8:59</a>; <a onClick="return mV(\'2Sa\',11,19);">2Sa 11:19</a>; <a onClick="return mV(\'Est\',3,4);">Es 3:4</a>; <a onClick="return mV(\'Psa\',35,20);">Ps 35:20</a>; <a onClick="return mV(\'Psa\',64,5);">64:5</a>; <a onClick="return mV(\'Pro\',16,20);">Pr 16:20</a>; <a onClick="return mV(\'Pro\',18,13);">18:13</a>). dabhar, and the Greek logos, both meaning "word," are very frequently translated by "matter." hule, "wood," is rendered "matter" in <a onClick="return mV(\'Jam\',3,5);">Jas 3:5</a> the King James Version (the Revised Version (British and American) "how much wood is kindled"; compare Sirach 28:10). <a onClick="return mV(\'Job\',32,18);">Job 32:18</a> translates literally, "words"; also <a onClick="return mV(\'Dan\',4,17);">Da 4:17</a>, "sentence." diaphero, "to carry in different places," "to differ," is rendered "to make matter" (<a onClick="return mV(\'Gal\',2,6);">Ga 2:6</a>). The meaning is "it makes a difference," "it matters," "it is of importance."``16';
isbe[5865]='Matthan`mat\'-than (Textus Receptus Matthan, Westcott and Hort, The New Testament in Greek Maththan): An ancestor of Jesus, grandfather of Joseph the husband of Mary (<a onClick="return mV(\'Mat\',1,15);">Mt 1:15</a>).`<a href="./study/isbe/search.html?string=MATTHAT">MATTHAT</a>`1';
isbe[5866]='Matthanias`mat-tha-ni\'-as (Codex Alexandrinus, Matthanias, Codex Vaticanus, Matan):<P>(1) One of those who put away their "strange wives" (1Esdras 9:27) equals "Mattaniah" of <a onClick="return mV(\'Ezr\',10,26);">Ezr 10:26</a>.<P>(2) the King James Version "Mathanias" (1Esdras 9:31) equals "Mattaniah" of <a onClick="return mV(\'Ezr\',10,30);">Ezr 10:30</a>. Codex Vaticanus, followed by Swete, reads Beskaspasmus.``1';
isbe[5867]='Matthat`mat\'-that (Matthat, Maththat): The name of two ancestors of Jesus in Luke\'s genealogy (<a onClick="return mV(\'Luk\',3,24,29);">Lu 3:24,29</a>), one being the grandfather of Joseph, the husband of Mary.``1';
isbe[5868]='Matthew`math\'-u: Matthew the apostle and evangelist is mentioned in the 4 catalogues of the apostles in <a onClick="return mV(\'Mat\',10,3);">Mt 10:3</a>; <a onClick="return mV(\'Mar\',3,18);">Mr 3:18</a>; <a onClick="return mV(\'Luk\',6,15);">Lu 6:15</a>; <a onClick="return mV(\'Act\',1,13);">Ac 1:13</a>, though his place is not constant in this list, varying between the 7th and the 8th places and thus exchanging positions with Thomas. The name occurring in the two forms Matthaios, and Maththaios, is a Greek reproduction of the Aramaic Mattathyah, i.e. "gift of Yahweh," and equivalent to Theodore. Before his call to the apostolic office, according to <a onClick="return mV(\'Mat\',9,9);">Mt 9:9</a>, his name was Levi. The identity of Matthew and Levi is practically beyond all doubt, as is evident from the predicate in <a onClick="return mV(\'Mat\',10,3);">Mt 10:3</a>; and from a comparison of <a onClick="return mV(\'Mar\',2,14);">Mr 2:14</a>; <a onClick="return mV(\'Luk\',5,27);">Lu 5:27</a> with <a onClick="return mV(\'Mat\',9,9);">Mt 9:9</a>. Mark calls him "the son of Alpheus" (<a onClick="return mV(\'Mar\',2,14);">Mr 2:14</a>), although this cannot have been the Alpheus who was the father of James the Less; for if this James and Matthew had been brothers this fact would doubtless have been mentioned, as is the case with Peter and Andrew, and also with the sons of Zebedee. Whether Jesus, as He did in the case of several others of His disciples, gave him the additional name of Matthew is a matter of which we are not informed. As he was a customs officer (ho telones, <a onClick="return mV(\'Mat\',10,3);">Mt 10:3</a>) in Capernaum, in the territory of Herod Antipas, Matthew was not exactly a Roman official, but was in the service of the tetrarch of Galilee, or possibly a subordinate officer, belonging to the class called portitores, serving under the publicani, or superior officials who farmed the Roman taxes. As such he must have had some education, and doubtless in addition to the native Aramaic must have been acquainted with the Greek His ready acceptance of the call of Jesus shows that he must have belonged to that group of publicans and sinners, who in Galilee and elsewhere looked longingly to Jesus (<a onClick="return mV(\'Mat\',11,19);">Mt 11:19</a>; <a onClick="return mV(\'Luk\',7,34);">Lu 7:34</a>; <a onClick="return mV(\'Luk\',15,1);">15:1</a>). Just at what period of Christ\'s ministry he was called does not appear with certainty, but evidently not at once, as on the day when he was called (<a onClick="return mV(\'Mat\',9,11,14,18);">Mt 9:11,14,18</a>; <a onClick="return mV(\'Mar\',5,37);">Mr 5:37</a>), Peter, James and John are already trustworthy disciples of Jesus. Unlike the first six among the apostles, Matthew did not enter the group from among the pupils of John the Baptist. These are practically all the data furnished by the New Testament on the person of Matthew, and what is found in post-Biblical and extra-Biblical sources is chiefly the product of imagination and in part based on mistaking the name of Matthew for Matthias (compare Zahn, Introduction to the New Testament, chapter liv, note 3). Tradition states that he preached for 15 years in Palestine and that after this he went to foreign nations, the Ethiopians, Macedonians, Syrians, Persians, Parthians and Medea being mentioned. He is said to have died a natural death either in Ethiopia or in Macedonia. The stories of the Roman Catholic church that he died the death of a martyr on September 21 and of the Greek church that this occurred on November 10 are without any historical basis. Clement of Alexandria (Strom., iv.9) gives the explicit denial of Heracleon that Matthew suffered martyrdom.``159';
isbe[5869]='Matthew, the Gospel of`(euaggelion kata Maththaion (or Matthaion)):<P>1. Name of Gospel—Unity and Integrity<P>2. Canonicity and Authorship<P>3. Relation of Greek and Aramaic Gospels<P>4. Contents, Character, and Purpose<P>5. Problems of Literary Relation<P>6. Date of Gospel<P>LITERATURE<hr /><P>1. Name of Gospel—Unity and Integrity:<P>The "Gospel according to Matthew," i.e. the Gospel according to the account of Matthew, stands, according to traditional, but not entirely universal, arrangement, first among the canonical Gospels. The Gospel, as will be seen below, was unanimously ascribed by the testimony of the ancient church to the apostle Matthew, though the title does not of itself necessarily imply immediate authorship. The unity and integrity of the Gospel were never in ancient times called in question. <a onClick="return mV(\'Mat\',1,\'1-\');">Matthew 1</a>; <a onClick="return mV(\'Mat\',2,\'1-\');">2</a>, particularly—the story of the virgin birth and childhood of Jesus—are proved by the consentient testimony of manuscripts, VSS, and patristic references, to have been an integral part of the Gospel from the beginning (see <a href="./study/isbe/search.html?string=VIRGIN+BIRTH">VIRGIN BIRTH</a>). The omission of this section from the heretical Gospel of the Ebionites, which appears to have had some relation to our Gospel, is without significance.<P>The theory of successive redactions of Matthew, starting with an Aramaic Gospel, elaborated by Eichhorn and Marsh (1801), and the related theories of successive editions of the Gospel put forth by the Tubingen school (Baur, Hilgenfeld, Kostlin, etc.), and by Ewald (Bleek supposes a primitive Greek Gospel), lack historical foundation, and are refuted by the fact that manuscripts and versions know only the ultimate redaction. Is it credible that the churches should quietly accept redaction after redaction, and not a word be said, or a vestige remain, of any of them?<P>2. Canonicity and Authorship:<P>(1) Canonicity.<P>The apostolic origin and canonical rank of the Gospel of Matthew were accepted without a doubt by the early church. Origen, in the beginning of the 3rd century could speak of it as the first of "the four Gospels, which alone are received without dispute by the church of God under heaven" (in Eusebius, Historia Ecclesiastica, VI, 25). The use of the Gospel can be traced in the apostolic Fathers; most distinctly in Barnabas, who quotes <a onClick="return mV(\'Mat\',22,14);">Mt 22:14</a> with the formula, "It is written" (5). Though not mentioned by name, it was a chief source from which Justin took his data for the life and words of Jesus (compare Westcott, Canon, 91ff), and apostolic origin is implied in its forming part of "the Memoirs of the Apostles," "which are called Gospels," read weekly in the assemblies of the Christians (Ap. i. 66, etc.). Its identity with our Matthew is confirmed by the undoubted presence of that Gospel in the Diatessaron of Tatian, Justin\'s disciple. The testimony of Papias is considered below. The unhesitating acceptance of the Gospel is further decisively shown by the testimonies and use made of it in the works of Irenaeus, Tertullian, Clement of Alexandria, and by its inclusion in the Muratorian Canon, the Itala, Peshitta, etc.<P>See <a href="./study/isbe/search.html?string=CANON+OF+THE+NEW+TESTAMENT">CANON OF THE NEW TESTAMENT</a>; <a href="./study/isbe/search.html?string=GOSPELS">GOSPELS</a>.<P>(2) Authorship.<P>The questions that cluster around the First Gospel have largely to do with the much-discussed and variously disputed statement concerning it found in Eusebius (Historia Ecclesiastica, III, 39), cited from the much older work of Papias, entitled Interpretation of the Words of the Lord. Papias is the first who mentions Matthew by name as the author of the Gospel. His words are: "Matthew composed the Logia (logia, "words," "oracles") in the Hebrew (Aramaic) tongue, and everyone interpreted them as he was able." Papias cannot here be referring to a book of Matthew in which only the discourses or sayings of Jesus had been preserved, but which had not any, or only meager accounts of His deeds, which imaginary document is in so many critical circles regarded as the basis of the present Gospel, for Papias himself uses the expression ta logia, as embracing the story, as he himself says, in speaking of Mark, "of the things said or done by Christ" (Eusebius, Historia Ecclesiastica, III, 24; compare particularly T. Zahn, Introduction to New Testament, section 54, and Lightfoot, Supernatural Religion, 170ff). Eusebius further reports that after Matthew had first labored among his Jewish compatriots, he went to other nations, and as a substitute for his oral preaching, left to the former a Gospel written in their own dialect (III, 24). The testimony of Papias to Matthew as the author of the First Gospel is confirmed by Irenaeus (iii.3, 1) and by Origen (in Eusebius, Historia Ecclesiastica, V, 10), and may be accepted as representing a uniform 2nd-century tradition. Always, however, it is coupled with the statement that the Gospel was originally written in the Hebrew dialect. Hence, arises the difficult question of the relation of the canonical Greek Gospel, with which alone, apparently, the fathers were acquainted, to this alleged original apostolic work.<P>3. Relation of Greek and Aramaic Gospels:<P>One thing which seems certain is that whatever this Hebrew (Aramaic) document may have been, it was not an original form from which the present Greek Gospel of Matthew was translated, either by the apostle himself, or by somebody else, as was maintained by Bengel, Thiersch, and other scholars. Indeed, the Greek Matthew throughout bears the impress of being not a translation at all, but as having been originally written in Greek, and as being less Hebraistic in the form of thought than some other New Testament writings, e.g. the Apocalypse. It is generally not difficult to discover when a Greek book of this period is a translation from the Hebrew or Aramaic. That our Matthew was written originally in Greek appears, among other things, from the way in which it makes use of the Old Testament, sometimes following the Septuagint, sometimes going back to the Hebrew. Particularly instructive passages in this regard are <a onClick="return mV(\'Mat\',12,\'18-21\');">12:18-21</a> and <a onClick="return mV(\'Mat\',13,14,15);">13:14,15</A>, in which the rendering of the Alexandrian translation would have served the purposes of the evangelist, but he yet follows more closely the original text, although he adopts the Septuagint wherever this seemed to suit better than the Hebrew (compare Keil\'s Commentary on Matthew, loc. cit.).<P>The external evidences to which appeal is made in favor of the use of an original Hebrew or Aramaic. Matthew in the primitive church are more than elusive. Eusebius (Historia Ecclesiastica, V, 10) mentions as a report (legetai) that Pantaenus, about the year 170 AD, found among the Jewish Christians, probably of south Arabia, a Gospel of Matthew in Hebrew, left there by Bartholomew; and Jerome, while in the Syrian Berea, had occasion to examine such a work, which he found in use among the Nazarenes, and which at first he regarded as a composition of the apostle Matthew, but afterward declared not to be such, and then identified with the Gospel according to the Hebrews (Evangelium secundum or juxta Hebraeos) also called the Gospel of the Twelve Apostles, or of the Nazarenes, current among the Nazarenes and Ebionites (De Vir. Illustr., iii; Contra Pelag., iii.2; Commentary on <a onClick="return mV(\'Mat\',12,13);">Mt 12:13</a>, etc.; see <a href="./study/isbe/search.html?string=GOSPEL+ACCORDING+TO+THE+HEBREWS">GOSPEL ACCORDING TO THE HEBREWS</a>). For this reason the references by Irenaeus, Origen, Eusebius to the Hebrew Gospel of Matthew are by many scholars regarded as referring to this Hebrew Gospel which the Jewish Christians employed, and which they thought to be the work of the evangelist (compare for fuller details See Hauck-Herzog, Realencyklopadie fur protestantische Theologie und Kirche, XII, article "Matthaeus der Apostel"). Just what the original Hebrew. Mathew was to which Papias refers (assuming it to have had a real existence) must, with our present available means, remain an unsolved riddle, as also the possible connection between the Greek and Hebrew texts. Attempts like those of Zahn, in his Kommentar on Matthew, to explain readings of the Greek text through an inaccurate understanding of the imaginary Hebrew original are arbitrary and unreliable. There remains, of course, the possibility that the apostle himself, or someone under his care (thus Godet), produced a Greek recension of an earlier Aramaic work.<P>The prevailing theory at present is that the Hebrew Matthean document of Papias was a collection mainly of the discourses of Jesus (called by recent critics Q), which, in variant Greek translations, was used both by the author of the Greek Matthew and by the evangelist Luke, thus explaining the common features in these two gospels (W.C. Allen, however, in his Critical and Exegetical Commentary on Matthew, disputes Luke\'s use of this supposed common source, Intro, xlviff). The use of this supposed Matthean source is thought to explain how the Greek Gospel came to be named after the apostle. It has already been remarked, however, that there is no good reason for supposing that the "Logia" of Papias was confined to discourses. See further on "sources" below.<P>4. Contents, Character and Purpose:<P>(1) Contents and Character.<P>As respects contents, the Gospel of Matthew can be divided into 3 chief parts:<P>(1) preliminary, including the birth and early youth of the Lord (<a onClick="return mV(\'Mat\',1,\'1-\');">Matthew 1</a>; <a onClick="return mV(\'Mat\',2,\'1-\');">2</a>);<P>(2) the activity of Jesus in Galilee (<a onClick="return mV(\'Mat\',3,\'1-\');">Matthew 3-18</a>);<P>(3) the activity of Jesus in Judea and Jerusalem, followed by His passion, death, and resurrection (<a onClick="return mV(\'Mat\',19,\'1-\');">Matthew 19-28</a>).<P>In character, the Gospel, like those of the other evangelists, is only a chrestomathy, a selection from the great mass of oral tradition concerning the doings and sayings of Christ current in apostolic and early Christian circles, chosen for the special purpose which the evangelist had in view. Accordingly, there is a great deal of material in Matthew in common with Mark and Luke, although not a little of this material, too, is individualistic in character, and of a nature to vex and perplex the harmonist, as e.g. Matthew\'s accounts of the temptation, of the demoniacs at Gadara, of the blind man at Jericho (<a onClick="return mV(\'Mat\',4,\'1-11\');">4:1-11</A>; <a onClick="return mV(\'Mat\',8,\'28-34\');">8:28-34</A>; <a onClick="return mV(\'Mat\',20,\'20-34\');">20:20-34</a>); yet there is much also in this Gospel that is peculiar to it. Such are the following pericopes: <a onClick="return mV(\'Mat\',1,\'1-\');">Matthew 1</a>; <a onClick="return mV(\'Mat\',2,\'1-\');">2</a>; <a onClick="return mV(\'Mat\',9,\'27-36\');">9:27-36</a>; <a onClick="return mV(\'Mat\',10,15);">10:15</a>, <a onClick="return mV(\'Mat\',10,\'37-40\');">37-40</a>; <a onClick="return mV(\'Mat\',11,\'28-30\');">11:28-30</a>; <a onClick="return mV(\'Mat\',12,11,12,\'15-21\',\'33-38\');">12:11,12,15-21,33-38</a>; <a onClick="return mV(\'Mat\',13,\'24-30\');">13:24-30</a>,<a onClick="return mV(\'Mat\',13,\'36-52\');">36-52</a>; <a onClick="return mV(\'Mat\',14,\'28-31\');">14:28-31</a>; <a onClick="return mV(\'Mat\',16,\'17-19\');">16:17-19</a>; <a onClick="return mV(\'Mat\',17,\'24-27\');">17:24-27</a>; <a onClick="return mV(\'Mat\',18,\'15-35\');">18:15-35</a>; <a onClick="return mV(\'Mat\',19,\'10-12\');">19:10-12</a>; <a onClick="return mV(\'Mat\',20,\'1-16\');">20:1-16</a>; <a onClick="return mV(\'Mat\',21,10,14,15,16,\'28-32\');">21:10f; 14-16,28-32</a>; <a onClick="return mV(\'Mat\',22,\'1-14\');">22:1-14</a>; <a onClick="return mV(\'Mat\',23,\'8-22\');">23:8-22</a>; <a onClick="return mV(\'Mat\',24,\'42-\');">24:42</a>-<a onClick="return mV(\'Mat\',25,\'1-46\');">25:46</a>; <a onClick="return mV(\'Mat\',27,\'3-10\',\'62-66\');">27:3-10,62-66</a>; <a onClick="return mV(\'Mat\',28,11);">28:11</a>ff. The principle of arrangement of the material is not chronological, but rather that of similarity of material. The addresses and parables of Jesus are reported consecutively, although they may have been spoken at different times, and material scattered in the other evangelists—especially in Luke—is found combined in Matthew. Instances are seen in the Sermon on the Mount (<a onClick="return mV(\'Mat\',5,\'1-\');">Matthew 5-7</a>), the "mission address" (<a onClick="return mV(\'Mat\',10,\'1-\');">Matthew 10</a>), the seven parables of the Kingdom of God (<a onClick="return mV(\'Mat\',13,\'1-\');">Matthew 13</a>), the discourses and parables (<a onClick="return mV(\'Mat\',18,\'1-\');">Matthew 18</a>), the woes against the Pharisees (<a onClick="return mV(\'Mat\',23,\'1-\');">Matthew 23</a>), and the grand eschatological discourses (<a onClick="return mV(\'Mat\',24,\'1-\');">Matthew 24</a>; <a onClick="return mV(\'Mat\',25,\'1-\');">25</a>) (compare with parallel in the other gospels, on the relation to which, see below).<P>(2) Purpose.<P>The special purpose which the writer had in view in his Gospel is nowhere expressly stated, as is done, e.g., by the writer of the Fourth Gospel in <a onClick="return mV(\'Jhn\',20,30,31);">Joh 20:30,31</a>, concerning his book, but it can readily be gleaned from the general contents of the book, as also from specific passages. The traditional view that Matthew wrote primarily to prove that in Jesus of Nazareth is to be found the fulfillment and realization of the Messianic predictions of the Old Testament prophets and seers is beyond a doubt correct. The mere fact that there are about 40 proof passages in Matthew from the Old Testament, in connection even with the minor details of Christ\'s career, such as His return from Egypt (<a onClick="return mV(\'Mat\',2,15);">2:15</A>), is ample evidence of this fact, although the proof manner and proof value of some of these passages are exegetical cruces, as indeed is the whole way in which the Old Testament is cited in the New Testament.<P>See <a href="./study/isbe/search.html?string=QUOTATIONS+IN+THE+NEW+TESTAMENT">QUOTATIONS IN THE NEW TESTAMENT</a>.<P>The question as to whether the Gospel was written for Jewish Christians, or for Jews not yet converted, is less important, as this book, as was the case probably with the Epistle of James, was written at that transition period when the Jewish and the Christian communions were not yet fully separated, and still worshipped together.<P>Particular indications as to this purpose of the Gospel are met with at the beginning and throughout the whole work; e.g. it is obvious in <a onClick="return mV(\'Mat\',1,1);">Mt 1:1</a>, where the proof is furnished that Jesus was the son of Abraham, in whom all families of the earth were to be blessed (<a onClick="return mV(\'Gen\',12,3);">Ge 12:3</a>), and of David, who was to establish the kingdom of God forever (<a onClick="return mV(\'2Sa\',7,\'1-\');">2Sa 7</a>). The genealogy of Luke, on the other hand (<a onClick="return mV(\'Luk\',3,23);">3:23</A>ff), with its cosmopolitan character and purpose, aiming to show that Jesus was the Redeemer of the whole world, leads back this line to Adam, the common ancestor of all mankind. Further, as the genealogy of Matthew is evidently that of Joseph the foster and legal father of Jesus, and not that of Mary, as is the case in Luke, the purpose to meet the demands of the Jewish reader is transparent. The full account in Matthew of the Sermon on the Mount, which does not, as is sometimes said, contain a "new program of the kingdom of God"—indeed does not contain the fundamental principles of the Gospel at all—but is the deeper and truly Biblical interpretation of the Law over against the superficial interpretation of the current Pharisaism, which led the advocates of the latter in all honesty to declare, "What lack I yet?" given with the design of driving the auditors to the gospel of grace and faith proclaimed by Christ (compare <a onClick="return mV(\'Gal\',3,24);">Ga 3:24</a>)—all this is only intelligible when we remember that the book was written for Jewish readers. Again the gegraptai—i.e. the fulfillment of Old Testament Scripture, a matter which for the Jew was everything, but for the Gentile was of little concern—appears in Matthew on all hands. We have it e.g. in connection with the birth of Jesus from a virgin, His protection from Herod, His coming to Nazareth (<a onClick="return mV(\'Mat\',1,22);">Mt 1:22</a>f; <a onClick="return mV(\'Mat\',2,5,6,15,17,23);">2:5,6,15,17f; 23</a>), the activity of John the Baptist (<a onClick="return mV(\'Mat\',3,3);">Mt 3:3</a>; compare <a onClick="return mV(\'Mat\',11,10);">Mt 11:10</a>), the selection of Galilee as the scene of Jesus\' operations (<a onClick="return mV(\'Mat\',4,14);">Mt 4:14</a>), the work of Jesus as the fulfillment of the Law and Prophets (<a onClick="return mV(\'Mat\',5,17);">Mt 5:17</a>), His quiet, undemonstrative methods (<a onClick="return mV(\'Mat\',12,17);">Mt 12:17</a>), His teaching by parables (<a onClick="return mV(\'Mat\',13,35);">Mt 13:35</a>), His entrance into Jerusalem (<a onClick="return mV(\'Mat\',21,4,16);">Mt 21:4f; 16</a>), His being arrested (<a onClick="return mV(\'Mat\',26,54);">Mt 26:54</a>), the betrayal of Judas (<a onClick="return mV(\'Mat\',27,9);">Mt 27:9</a>), the distribution of His garments (<a onClick="return mV(\'Mat\',27,35);">Mt 27:35</a>). Throughout, as Professor Kubel says, the Gospel of Matthew shows a "diametrical contrast between Christ and Pharisaism." Over against the false Messianic ideas and ideals of contemporary teachings among the Jews, Matthew selects those facts from the teachings and deeds of Christ which show the true Messiah and the correct principles of the kingdom of God. In this respect the Gospel can be regarded as both apologetic and polemical in its aim, in harmony with which also is its vivid portraiture to the growing hostility of the Jews to Christ and to His teachings which, in the latter part of Matthew, appears as intense as it does in John. Nowhere else do we find such pronounced denunciations of the Pharisees and their system from the lips of Jesus (compare <a onClick="return mV(\'Mat\',9,11);">Mt 9:11</a>ff; <a onClick="return mV(\'Mat\',12,1);">12:1</a>ff; <a onClick="return mV(\'Mat\',15,1);">15:1ff</a>; <a onClick="return mV(\'Mat\',16,1);">16:1ff</a>; and on particular points <a onClick="return mV(\'Mat\',5,20);">5:20</a>ff; <a onClick="return mV(\'Mat\',9,13);">9:13</a>; <a onClick="return mV(\'Mat\',23,23);">23:23</a>; see also <a onClick="return mV(\'Mat\',8,12);">8:12</a>; <a onClick="return mV(\'Mat\',9,34);">9:34</a>; <a onClick="return mV(\'Mat\',12,24);">12:24</a>; <a onClick="return mV(\'Mat\',21,43);">21:43</a>). It is from this point of view, as representing the antithesis to the narrow Pharisaic views, that we are to understand the writer\'s emphasis on the universality of the kingdom of Jesus Christ (compare <a onClick="return mV(\'Mat\',3,\'1-12\');">Mt 3:1-12</a>; <a onClick="return mV(\'Mat\',8,\'10-12\');">8:10-12</a>; <a onClick="return mV(\'Mat\',21,\'33-44\');">21:33-44</a>; <a onClick="return mV(\'Mat\',28,\'18-20\');">28:18-20</a>)—passages in which some have thought they discerned a contradiction to the prevailing Jewish strain of the Gospel.<P>5. Problems of Literary Relation:<P>The special importance of the Gospel of Matthew for the synoptic problem can be fully discussed only in the article on this subject (see <a href="./study/isbe/search.html?string=GOSPELS,+THE+SYNOPTIC">GOSPELS, THE SYNOPTIC</a>), and in connection with Mark and Luke. The synoptic problem deals primarily with the literary relations existing between the first 3 Gospels. The contents of these are in many cases so similar, even in verbal details, that they must have some sources in common, or some dependence or interdependence must exist between them; on the other hand, each of the 3 Gospels shows so many differences and dissimilarities from the other two, that in their composition some independent source or sources—oral or written—must have been employed. In general it may be said that the problem itself is of little more than literary importance, having by no means the historical significance for the development of the religion of the New Testament which the Pentateuchal problem has for that of the Old Testament. Nor has the synoptic problem any historical background that promises a solution as the Pentateuchal problem has in the history of Israel. Nothing save an analysis of the contents of these Gospels, and a comparison of the contents of the three, offers the scholar any material for the study of the problem, and as subjective taste and impressions are prime factors in dealing with materials of this sort, it is more than improbable, in the absence of any objective evidence, that the synoptic problem in general, or the question of the sources of Matthew in particular, will ever be solved to the satisfaction of the majority of scholars. The hypothesis which at present has widest acceptance is the "two-source" theory, according to which Mark, in its existing or some earlier form, and the problematical original Matthew (Q), constitute the basis of our canonical Gospel.<P>In proof of this, it is pointed out that nearly the whole of the narrative-matter of Mark is taken up into Matthew, as also into Luke, while the large sections, chiefly discourses, common to Matthew and Luke are held, as already said, to point to a source of that character which both used. The difficulties arise when the comparison is pursued into details, and explanation is sought of the variations in phraseology, order, sometimes in conception, in the respective gospels.<P>Despite the prestige which this theory has attained, the true solution is probably a simpler one. Matthew no doubt secured the bulk of his data from his own experience and from oral tradition, and as the former existed in fixed forms, due to catechetical instruction, in the early church, it is possible to explain the similarities of Matthew with the other two synoptics on this ground alone, without resorting to any literary dependence, either of Matthew on the other two, or of these, or either of them, on Matthew. The whole problem is purely speculative and subjective and under present conditions justifies a cui bono? as far as the vast literature which it has called into existence is concerned.<P>6. Date of Gospel:<P>According to early and practically universal tradition Matthew wrote his Gospel before the other three, and the place assigned to it in New Testament literature favors the acceptance of this tradition. Irenaeus reports that it was written when Peter and Paul were preaching in Rome (ill.1), and Eusebius states that this was done when Matthew left Palestine and went to preach to others (Historia Ecclesiastica, III, 24). Clement of Alexandria is responsible for the statement that the presbyters who succeeded each other from the beginning declared that "the gospels containing the genealogies (Matthew and Luke) were written first" (Eusebius, Historia Ecclesiastica, VI, 14). This is, of course, fatal to the current theory of dependence on Mark, and is in consequence rejected. At any rate, there is the best reason for holding that the book must have been written before the destruction of Jerusalem in 70 AD (compare 2415). The most likely date for the Greek Gospel is in the 7th Christian decade. Zahn claims that Matthew wrote his Aramaic Gospel in Palestine in 62 AD, while the Greek Matthew dates from 85 AD, but this latter date is not probable.<P>LITERATURE.<P>Introduction to the Commentary on Matthew (Meyer, Alford, Allen (ICC), Broadus (Philadelphia, 1887), Morison, Plummer, Schaeffer in Lutheran Commentary (New York, 1895), etc.); works on Introduction to the New Testament (Salmon, Weiss, Zahn, etc.); articles in Bible Dictionaries and Encyclopedia may be consulted. See also F.C. Burkitt, The Gospel History and Its Transmission; Wellhausen, Das Evangelium Matthaei and Einleitung in die drei ersten Evangelien; Sir J.C. Hawkins, Horae Synopticae; Westcott, Introduction to the Study of the Gospels; Lightfoot, Essays on Supernatural Religion, V, "Papias of Hierapolis" (this last specially on the sense of Logia).`<a href="./study/isbe/search.html?string=MARK,+THE+GOSPEL+ACCORDING+TO">MARK, THE GOSPEL ACCORDING TO</a>`159';
isbe[5870]='Matthias`ma-thi\'-as (Matthias, or Maththias; Mattithyah, "given of Yah"): Matthias was the one upon whom the lot fell when he, along with Joseph Barsabbas, was put forward to fill up the place in the apostleship left vacant by Judas Iscariot (<a onClick="return mV(\'Act\',1,\'15-26\');">Ac 1:15-26</a>). This election was held at Jerusalem, and the meeting was presided over by Peter. The conditions demanded of the candidates were that they should "have companied with us all the time that the Lord Jesus went in and went out among us, beginning from the baptism of John, unto the day that he was received up from us," and that the one chosen should "become a witness with us of his resurrection" (<a onClick="return mV(\'Act\',1,21,22);">Ac 1:21,22</a>). The mode of procedure was by lot, and with prayer was the election made (compare <a onClick="return mV(\'Act\',1,24);">Ac 1:24</a>).<P>Hilgenfeld identifies Matthias with Nathanael (compare <a href="./study/isbe/search.html?string=NATHANAEL">NATHANAEL</a>). He was traditionally the author of the "Gospel of Matthias," a heretical work referred to by Origen (Hom. on Luke, i), by Eusebius (Historia Ecclesiastica, III, 25, 6) and by Hieronymus (Proem in Matth.). No trace of it is left. The Gnostic Basilides (circa 133 AD) and his son Isidor claimed to ground their doctrine in the "Gospel of Basilides" on the teaching Matthias received directly from the Saviour (Hippol., vii.20) (compare Hennecke, Neutestamentliche Apokryphen, 167). Various parts of the apocryphal "Contendings of the Apostles" deal with the imprisonment and blinding of Matthias by the Ethiopian cannibals, and his rescue by Andrew (compare Budge, Contendings of the Apostles, II,163,164, 267-88; see also <a href="./study/isbe/search.html?string=ANDREW">ANDREW</a>). According to the Martyrdom of Matthias (Budge, II, 289-94) he was sent to Damascus, and died at Phalaeon, a city of Judea. Other sources mention Jerusalem as the place of Matthias\' ministry and burial.``88';
isbe[5871]='Mattithiah`mat-i-thi\'-a (mattithyah, or mattithyahu, "gift of Yah"):<P>(1) The Mattithiah of <a onClick="return mV(\'Neh\',8,4);">Ne 8:4</a> (1st spelling) was one of those who stood at Ezra\'s right hand while he read the law (compare 1Esdras 9:43). He may be the individual set over "things that were baked in pans" (<a onClick="return mV(\'1Ch\',9,31);">1Ch 9:31</a>).<P>(2) One of those appointed by David to minister before the ark, and to "celebrate and to thank and praise Yahweh, the God of Israel" (<a onClick="return mV(\'1Ch\',16,4,5);">1Ch 16:4,5</a>).<P>(3) One of those who had foreign wives (<a onClick="return mV(\'Ezr\',10,43);">Ezr 10:43</a>). In 1Esdras 9:35, "Mazitias."<P>(4) One of the Levites who ministered before the ark with harps <a onClick="return mV(\'1Ch\',15,18,21);">1Ch 15:18,21</a>; <a onClick="return mV(\'1Ch\',25,3,11);">25:3,11</a>, 2nd spelling).``186';
isbe[5872]='Mattock`mat\'-ok: The translation of 3 Hebrew words:<P>(1) machereshah, probably "a pick-axe" (<a onClick="return mV(\'1Sa\',13,20,21);">1Sa 13:20,21</a>; compare <a onClick="return mV(\'1Sa\',13,21);">1Sa 13:21</a> margin);<P>(2) cherebh, "sword," "ax," "tool" (<a onClick="return mV(\'2Ch\',34,6);">2Ch 34:6</a> the King James Version, "with their mattocks," the King James Version margin "mauls," the Revised Version (British and American) "in their ruins," the Revised Version margin "with their axes");<P>(3) ma\'-der, "a hoe," "rake," "chopping instrument" (<a onClick="return mV(\'Isa\',7,25);">Isa 7:25</a>). Vines were usually grown on terraces on the hills of Palestine, and then the mattock was in constant use. The usual mattock is a pick with one end broad, the other pointed.``1';
isbe[5873]='Maul`mol (mephits, literally, "a breaker," "a club," "mace," "mattock"): A smashing weapon like the oriental war-club or the clubs always carried by the shepherds of Lebanon (<a onClick="return mV(\'Pro\',25,18);">Pr 25:18</a>; compare <a onClick="return mV(\'Jer\',51,20);">Jer 51:20</a> margin).``1';
isbe[5874]='Mauzzim`moz\'-em, mots\'-em (ma\'uzzim, "places of strength," "fortress"): Many conjectures as to the meaning of this word and its context (<a onClick="return mV(\'Dan\',11,38);">Da 11:38</a>; compare <a onClick="return mV(\'Dan\',11,19,39);">Da 11:19,39</a>) have been made. The Septuagint (uncertainly), Theodotion, and the Geneva Version render it as a proper name. Theodoret adopted Theodotion\'s reading and explained it as "Antichrist"! Grotius thought it a corruption of "Azizos, the Phoenician war-god, while Calvin saw in it the "god of wealth"! Perhaps the buzz of conjectures about the phrase is owing to the fact that in the first passage cited the word is preceded by \'Eloah, meaning God. The context of the passage seems clearly to make the words refer to Antiochus Epiphanes, and on this account some have thought that the god Mars—whose figure appears on a coin of Antiochus—is here referred to. All this is, however, little better than guesswork, and the Revised Version (British and American) translation, by setting the mind upon the general idea that the monarch referred to would trust in mere force, gives us, at any rate, the general sense, though it does not exclude the possibility of a reference to a particular deity. In <a onClick="return mV(\'Dan\',11,19);">Da 11:19</a> and <a onClick="return mV(\'Dan\',11,39);">39</a>, the word "Mauzzim" is simply translated "fortresses," and the idea conveyed is that the mental obsession of fortresses is equivalent to deifying them. A conjecture of Layard\'s (Nineveh, II,456,note), is, at any rate, worth referring to.``186';
isbe[5875]='Maw`mo (qebhah (compare qobhah, <a onClick="return mV(\'Num\',25,8);">Nu 25:8</a>), keres; Septuagint enustron): The first word means the maw or stomach of ruminants. It is derived from a root designating "hollowed out." It is mentioned alongside of the shoulder and the two cheeks of ox and sheep, which are the priest\'s share of any sacrifice brought by Israelites (<a onClick="return mV(\'Deu\',18,3);">De 18:3</a>). Septuagint, where enustron corresponds to Attic enustron, denotes the fourth stomach or abomasum, which was considered as a delicacy, and was almost a national dish of the Athenians, just as tripe is of the Londoners. The parallel form qobhah is used for the body of a woman, which is being transfixed by a spear thrust in <a onClick="return mV(\'Num\',25,8);">Nu 25:8</a>. The last word keres is found in a metaphorical sense: "(Nebuchadrezzar) hath, like a monster, swallowed me up, he hath filled his maw with my delicacies" (<a onClick="return mV(\'Jer\',51,34);">Jer 51:34</a>).``106';
isbe[5876]='Mazitias`maz-i-ti\'-as (Codex Alexandrinus, Mazitias; Codex Vaticanus, Zeitias): One of those who had taken "strange wives" (1Esdras 9:35), identical with Mattithiah (<a onClick="return mV(\'Ezr\',10,43);">Ezr 10:43</a>).``1';
isbe[5877]='Mazzaloth`maz\'-a-loth (The Planets).`<a href="./study/isbe/search.html?string=ASTROLOGY">ASTROLOGY</a>`1';
isbe[5878]='Mazzaroth`maz\'-a-roth: The 12 constellations of the Zodiac.`<a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>`1';
isbe[5879]='Mazzebah`maz-e\'-ba, mats-e\'-ba.`<a href="./study/isbe/search.html?string=PILLAR">PILLAR</a>`1';
isbe[5880]='Me-Jarkon`me-jar\'-kon (me ha-yarqon; thalassa Hierakon): The Hebrew may mean "yellow water." The phrase is literally, "the waters of Jarkon." Septuagint reads "and from the river, Jarkon and the boundary near Joppa." From this possibly we should infer a place called Jarkon in the lot of Dan; but no name resembling this has been found. The text (<a onClick="return mV(\'Jos\',19,46);">Jos 19:46</a>) is corrupt.``1';
isbe[5881]='Me-Zahab`mez\'-a-hab, me-za\'-hab (me zahabh, "waters of gold"; Codex Vaticanus Maizoob, Codex Alexandrinus, Mezoob): Grandfather of Mehetabel, the wife of Hadar, the last-mentioned "duke" of Edom descended from Esau (<a onClick="return mV(\'Gen\',36,39);">Ge 36:39</a>). The Jewish commentators made much play with this name. Abarbanel, e.g., says he was "rich and great, so that on this account he was called Mezahab, for the gold was in his house as water." The name, however, may denote a place, in which case it may be identical with Dizahab.``1';
isbe[5882]='Meadow`med\'-o:<P>(1) \'aroth, "the meadows (the King James Version "paper reeds") by the Nile" (<a onClick="return mV(\'Isa\',19,7);">Isa 19:7</a>); ma\'areh-gabha\', the King James Version "meadows of Gibeah," the Revised Version (British and American) "Maareh-geba," the Revised Version margin "the meadow of Geba, or Gibeah" (<a onClick="return mV(\'Jdg\',20,33);">Jud 20:33</a>); from \'arah, "to be naked"; compare Arabic ariya, "to be naked," \'ara\'a\', "a bare tract of land." \'Aroth and ma\'areh signify tracts bare of trees.<P>(2) \'achu, in Pharaoh\'s dream of the kine, the King James Version "meadow," the Revised Version (British and American) "reed grass" (<a onClick="return mV(\'Gen\',41,2,18);">Ge 41:2,18</a>). \'Achu is found also in <a onClick="return mV(\'Job\',8,11);">Job 8:11</a>, the King James Version and the Revised Version (British and American) "flag," the Revised Version margin "reed-grass." According to Gesenius, achu is an Egyptian word denoting the vegetation of marshy ground.<P>(3) \'abhel keramim, "Abel-cheramim," the Revised Version margin "The meadow of vineyards," the King James Version "the plain (the King James Version margin, "Abel") of the vineyards" (<a onClick="return mV(\'Jdg\',11,33);">Jud 11:33</a>); "Abel-beth-maacah" (<a onClick="return mV(\'1Ki\',15,20);">1Ki 15:20</a>; <a onClick="return mV(\'2Ki\',15,29);">2Ki 15:29</a>; compare <a onClick="return mV(\'2Sa\',20,14,15,18);">2Sa 20:14,15,18</a>); "Abel-shittim" (<a onClick="return mV(\'Num\',33,49);">Nu 33:49</a>; compare <a onClick="return mV(\'Num\',25,1);">Nu 25:1</a>; <a onClick="return mV(\'Jos\',2,1);">Jos 2:1</a>; <a onClick="return mV(\'Jos\',3,1);">3:1</a>; <a onClick="return mV(\'Jdg\',7,22);">Jud 7:22</a>; <a onClick="return mV(\'Joe\',3,18);">Joe 3:18</a>; <a onClick="return mV(\'Mic\',6,5);">Mic 6:5</a>); "Abel-meholah" (<a onClick="return mV(\'Jdg\',7,22);">Jud 7:22</a>; <a onClick="return mV(\'1Ki\',4,12);">1Ki 4:12</a>; <a onClick="return mV(\'1Ki\',19,16);">19:16</a>); "Abel-maim" (<a onClick="return mV(\'2Ch\',16,4);">2Ch 16:4</a>); "Abel-mizraim" (<a onClick="return mV(\'Gen\',50,11);">Ge 50:11</a>); "stone," the King James Version "Abel," the Revised Version margin "Abel," that is "a meadow" (<a onClick="return mV(\'1Sa\',6,18);">1Sa 6:18</a>); compare Arabic \'abal, "green grass," and \'abalat, "unhealthy marshy ground," from wabal, "to rain."``37';
isbe[5883]='Meah`me\'-a (me\'ah, "hundred").`<a href="./study/isbe/search.html?string=HAMMEAH">HAMMEAH</a>`1';
isbe[5884]='Meal`mel (\'okhel): Denotes the portion of food eaten at any one time. It is found as a compound in <a onClick="return mV(\'Rth\',2,14);">Ru 2:14</a>, "meal-time," literally, "the time of eating."`<a href="./study/isbe/search.html?string=FOOD">FOOD</a>`1';
