,28,19);">Ex 28:19</a>; <a onClick="return mV(\'Exd\',39,12);">39:12</a>: 3rd stone, 3rd row, of the breastplate. Septuagint translates amethustos; Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) translates amethystus; English Versions of the Bible "amethyst."<P>The Septuagint rendering amethustos is generally accepted as correct, but the late Professor N. S. Maskelyne, F.R.S., formerly (1857-80) Keeper of Minerals in the British Museum, gave reasons for regarding the \'achlamah of breastplate times as possibly an onyx in which white bands alternated with waxy-yellow to reddish-yellow bands.<P>Amber: in <a onClick="return mV(\'Eze\',1,4,27);">Eze 1:4,27</a>; <a onClick="return mV(\'Eze\',8,2);">8:2</a>, the King James Version, the English Revised Version and the American Revised Version margin translation of Hebrew chashmal; in <a onClick="return mV(\'Exd\',28,19);">Ex 28:19</a>, the Revised Version margin translation of Hebrew leshem.<P>Amethustos (amethustos): in <a onClick="return mV(\'Rev\',21,20);">Re 21:20</a>: the 12th foundation of the New Jerusalem; Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) translates amethystus; English Versions of the Bible "amethyst." Four varieties of amethystus were recognized by Pliny as precious; all of them were transparent, and of purple tint or of tints derived from purple. According to the Septuagint, amethustos was the 3rd stone, 3rd row, of the breastplate, and the stone occupying this position is given in our Hebrew text as \'achlamah. Amethustos is mentioned under the name amethuson by Theophrastus; he describes it as a transparent stone resembling wine in color and as used by the gem engravers of his day. Amethystus and amethuson were doubtless identical with the amethyst of the present day, a purple variety of quartz (silica). Beads and other ornaments of amethyst found in old Egyptian tombs show that the stone was regarded as precious in very ancient times.<P>Amethyst: in <a onClick="return mV(\'Exd\',28,19);">Ex 28:19</a>; <a onClick="return mV(\'Exd\',39,12);">39:12</a>, English Versions of the Bible translation of Hebrew \'achlamah; in <a onClick="return mV(\'Rev\',21,20);">Re 21:20</a>, English Versions of the Bible translation of Greek amethustos.<P>Anthrax (anthrax): in Tobit 13:17; Ecclesiasticus 32:5, English Versions of the Bible translates "carbuncle." According to the Septuagint, anthrax was also a stone of the breastplate, 1st stone, 2nd row, but there is uncertainty as to the Hebrew text of the Septuagint in respect of this word. The anthrax of Theophrastus included different kinds of hard, red stone used by the gem engravers. It is the carbunculus of Pliny\'s time, and probably included the oriental ruby (corundum, alumina), the balas ruby (spinel, aluminate of magnesium), the almandine (a kind of garnet, alumino-silicate of iron) and pyrope (another kind of garnet, alumino-silicate of magnesium) of the present day.<P>Bareqeth: in <a onClick="return mV(\'Exd\',28,17);">Ex 28:17</a>; <a onClick="return mV(\'Exd\',39,10);">39:10</a>; <a onClick="return mV(\'Eze\',28,13);">Eze 28:13</a>: 3rd stone, 1st row, of breastplate. Septuagint probably translates smaragdos, but there is uncertainty as to the Hebrew text of the Septuagint in respect of this word: English Versions of the Bible translates "carbuncle"; the Revised Version margin translates "emerald." The rendering smaragdos may be correct, but no emeralds of very early age have been found in Egypt. From the similarity of the words bareqeth and baraq ("lightning"), it has been suggested that possibly the breastplate stone was not green but of bluish-red color, in which case it may have been an almandine (garnet). English Versions of the Bible has interchanged the names given by Septuagint, to the 3rd stone of the 1st row (smaragdos, "emerald") and the 1st stone of the 2nd row (anthrax, "carbuncle").<P><a href="./study/isbe/search.html?string=BDELLIUM">Bdellium</a> (see also special article): in <a onClick="return mV(\'Gen\',2,12);">Ge 2:12</a>; <a onClick="return mV(\'Num\',11,7);">Nu 11:7</a>, English Versions of the Bible translation of Hebrew bedholach.<P>Bedholach: The Septuagint translates anthrax in <a onClick="return mV(\'Gen\',2,12);">Ge 2:12</a>, and krustallos in <a onClick="return mV(\'Num\',11,7);">Nu 11:7</a>; Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) and English Versions of the Bible translate bdellium. Some commentators, rejecting both the Septuagint translations, interpret the material to be pearl, others to be the gum of an Arabian tree.<P>Berullos (berullos): in Tobit 13:17; <a onClick="return mV(\'Rev\',21,20);">Re 21:20</a>: the 8th foundation of the New Jerusalem. Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) translates beryllus; English Versions of the Bible translates "beryl." According to Septuagint, berullion was a stone of the breastplate, the 2nd stone, 4th row; owing to uncertainty as to their Hebrew text, there is doubt as to the Hebrew word translated berullion. Berullos is not mentioned by Theophrastus, who may have regarded it as included in the smaragdos of his day.<P>In the time of Pliny 8 varieties were recognized; he says that beryllus was already thought by some to be "of the same nature as the smaragdus, or at least closely analogous. India produces them, and they are rarely to be found elsewhere. The lapidaries cut all beryls of a hexagonal form because the color which is deadened by a dull uniformity of surface is heightened by the reflections resulting from the angles. If they are cut in any other way, these stones have no brilliancy whatever. The most esteemed beryls are those which in color resemble the pure green of the sea. Some are of opinion that beryls are naturally angular."<P>This description suggests the identity of the seagreen beryllus of Pliny\'s time with the sea-green beryl (alumino-silicate of beryllium) of the present day.<P>Beryl: in <a onClick="return mV(\'Exd\',28,20);">Ex 28:20</a>; <a onClick="return mV(\'Exd\',39,13);">39:13</a>; <a onClick="return mV(\'Sgs\',5,14);">So 5:14</a>; <a onClick="return mV(\'Eze\',1,16);">Eze 1:16</a>; <a onClick="return mV(\'Eze\',10,9);">10:9</a>; <a onClick="return mV(\'Eze\',28,13);">28:13</a>; <a onClick="return mV(\'Dan\',10,6);">Da 10:6</a>, English Versions of the Bible translation of Hebrew tarshish; in <a onClick="return mV(\'Gen\',2,12);">Ge 2:12</a>; <a onClick="return mV(\'Exd\',25,7);">Ex 25:7</a> margin; <a onClick="return mV(\'Exd\',28,9,20);">28:9,20</a>; <a onClick="return mV(\'Exd\',35,27);">35:27</A> margin; <a onClick="return mV(\'1Ch\',29,2);">1Ch 29:2</a> margin; <a onClick="return mV(\'Job\',28,16);">Job 28:16</a> margin, the Revised Version margin translation of Hebrew shoham; in Tobit 13:17; <a onClick="return mV(\'Rev\',21,20);">Re 21:20</a>, English Versions of the Bible translation of Greek berullos.<P>Carbuncle: in <a onClick="return mV(\'Exd\',28,17);">Ex 28:17</a>; <a onClick="return mV(\'Exd\',39,10);">39:10</a>; <a onClick="return mV(\'Eze\',28,13);">Eze 28:13</a>, English Versions of the Bible translation of Hebrew bareqeth; in <a onClick="return mV(\'Exd\',28,18);">Ex 28:18</a> margin; <a onClick="return mV(\'Exd\',38,11);">39:11</A>; <a onClick="return mV(\'Eze\',27,16);">Eze 27:16</a>; <a onClick="return mV(\'Eze\',28,13);">28:13</a>, the Revised Version margin translation of Hebrew nophekh; in <a onClick="return mV(\'Isa\',54,12);">Isa 54:12</a>, English Versions of the Bible translation of Hebrew \'eqdach; Tobit 13:17; Ecclesiasticus 32:5, English Versions of the Bible translation of Greek anthrax.<P>Chalcedony: in <a onClick="return mV(\'Exd\',28,20);">Ex 28:20</a>, the Revised Version margin translation of Hebrew tarshish; in <a onClick="return mV(\'Rev\',21,19);">Re 21:19</a>, English Versions of the Bible translation of Greek chalkedon.<P>Chalkedon (chalkedon): in <a onClick="return mV(\'Rev\',21,19);">Re 21:19</a>: the 3rd foundation of the New Jerusalem. Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) translates calcedonius; English Versions of the Bible translates "chalcedony." Though the name Chalcedon (Latin form) occurs in Pliny, it is not as the name of a stone but as that of a free town then standing on the southern side of the Bosphorus, probably close to the site on which Scutari now stands. Chalcedon had once been noted for its copper mines; but the latter, when Pliny wrote, had been so far exhausted that they were no longer worked.<P>Pliny refers to a kind of smaragdus (a green stone) as having been found near Chalcedon, but adds that the stones were of very small size and value. They were "brittle, and of a color far from distinctly pronounced; they resembled in their tints the feathers that are seen in the tail of the peacock or on the neck of the pigeon. More or less brilliant, too, according to the angle at which they were viewed, they presented an appearance like that of veins and scales." In another place he refers to a stone from Chalcedon or Calchedon (another reading) as being an iaspis of turbid hue. It is possible that at Patmos or Ephesus, at one of which John was living when he wrote the Book of Revelation, the word chalkedon was used to specify the particular kind of smaragdus or iaspis that had been found near the town of that name. It is uncertain what name would be given to such a stone in the present day, but the signification now attached to the name "chalcedony" (cryptocrystalline silica) cannot be traced farther back than the 15th century.<P>Chrusolithos (chrusolithos): in <a onClick="return mV(\'Rev\',21,20);">Re 21:20</a>: the 7th foundation of the New Jerusalem. Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) translates chrysolithus; the King James Version translates "chrysolyte"; the Revised Version (British and American) translates "chrysolite." According to Septuagint chrusolithos was one of the stones of the breastplate (lst stone, 4th row), but there is uncertainty as to the Hebrew text of the Septuagint in respect of this word; the name is not mentioned by Theophrastus. The chrysolithus of Pliny was a "transparent stone with a refulgence like that of gold." Those were most valued which "when placed by the side of gold, impart to it a sort of whitish hue, and so give it the appearance of silver."<P>It may perhaps have included the yellow sapphire (alumina), the yellow quartz (citrine, silica) and the yellow jargoon (zircon; silicate of zirconium) of the present day. The term "chrysolite" is now applied to a different mineral, namely, to a yellow variety of olivine (silicate of magnesium and iron), a species that includes the green precious stone peridot as another of its varieties.<P>Chrusoprasos (chrusoprasos): in <a onClick="return mV(\'Rev\',21,20);">Re 21:20</a>: the 10th foundation of the New Jerusalem. Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) and the King James Version translate chrysoprasus; the Revised Version (British and American) translates "chrysoprase." The chrysoprasus was regarded by some naturalists of the time of Pliny as a variety of beryllus. The 1st variety of beryllus and the most esteemed was, as stated above, of a pure sea-green color; the 2nd was paler, and approached a golden tint; the 3rd, allied to the 2nd in brilliancy but more pallid, was the chrysoprasus. The latter was thought by other naturalists to belong to an independent genus of stone. In another place Pliny describes the color as like that of the leek, but as varying in tint between the topazion of his day (our peridot) and gold. The stone may have been a yellowish-green plasma (chalcedony, crypto-crystalline silica) or, as suggested by King, pale chrysoberyl (aluminate of beryllium); it is not the chrysoprase of the present day, which is an apple-green chalcedony (colored by nickel).<P>Chrysolite, chrysolyte: "chrysolite" in <a onClick="return mV(\'Eze\',28,13);">Eze 28:13</a>, the King James Version margin translation of Hebrew tarshish; <a onClick="return mV(\'Rev\',21,20);">Re 21:20</a>, the Revised Version (British and American) translation of Greek chrusolithos; "chrysolyte" in <a onClick="return mV(\'Rev\',21,20);">Re 21:20</a>, the King James Version translation of Greek chrusolithos.<P>Chrysoprase, chrysoprasus: "chrysoprase" in <a onClick="return mV(\'Eze\',27,16);">Eze 27:16</a>, the King James Version margin translation of Hebrew kadhkodh; <a onClick="return mV(\'Rev\',21,20);">Re 21:20</a>, the Revised Version (British and American) translation of Greek chrusoprasos; "chrysoprasus" in <a onClick="return mV(\'Rev\',21,20);">Re 21:20</a>, the King James Version translation of Greek chrusoprasos.<P>Coral, red coral (see special article): "coral" in <a onClick="return mV(\'Job\',28,18);">Job 28:18</a>; <a onClick="return mV(\'Eze\',27,16);">Eze 27:16</a>, English Versions of the Bible translation of Hebrew ra\'moth; <a onClick="return mV(\'Lam\',4,7);">La 4:7</a>, the Revised Version margin translation of Hebrew peninim; "red coral" in <a onClick="return mV(\'Job\',28,18);">Job 28:18</a>, the Revised Version margin translation of Hebrew peninim.<P>Crystal (see special article): in <a onClick="return mV(\'Job\',28,17);">Job 28:17</a>, the King James Version translation of Hebrew zekhukhith; <a onClick="return mV(\'Eze\',1,22);">Eze 1:22</a>, the King James Version translation of Hebrew qerach; in <a onClick="return mV(\'Job\',28,18);">Job 28:18</a>, the Revised Version (British and American) translation of Hebrew gabhish; in <a onClick="return mV(\'Rev\',4,6);">Re 4:6</a>; <a onClick="return mV(\'Rev\',22,1);">22:1</a>, English Versions of the Bible translation of Greek krustallos; in <a onClick="return mV(\'Rev\',21,11);">Re 21:11</a>, English Versions of the Bible translation of Greek krustallizo ("to shine like crystal").<P>Diamond: in <a onClick="return mV(\'Jer\',17,1);">Jer 17:1</a>, English Versions of the Bible translation of Hebrew shamir; in <a onClick="return mV(\'Exd\',28,18);">Ex 28:18</a>; <a onClick="return mV(\'Exd\',39,11);">39:11</a>; <a onClick="return mV(\'Eze\',28,13);">Eze 28:13</a>, English Versions of the Bible translation of Hebrew yahalom.<p>\'Eqdach: in <a onClick="return mV(\'Isa\',54,12);">Isa 54:12</a>: Septuagint translates krustallos; Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) periphrases as lapides sculpti ("engraved stones"); English Versions of the Bible translates "carbuncles." From the similarity to qadhach, "to burn," it is interpreted as meaning fiery or sparkling, whence comes the rendering "carbuncles."<P>Electrum (see special article): <a onClick="return mV(\'Eze\',1,4);">Eze 1:4</a>, the Revised Version margin translation of Hebrew chashmal, "amber."<P>Emerald: in <a onClick="return mV(\'Exd\',28,18);">Ex 28:18</a>; <a onClick="return mV(\'Exd\',39,11);">39:11</a>; <a onClick="return mV(\'Eze\',27,16);">Eze 27:16</a>; <a onClick="return mV(\'Eze\',28,13);">28:13</a>, English Versions of the Bible translation of Hebrew nophekh; in <a onClick="return mV(\'Exd\',28,17);">Ex 28:17</a>; <a onClick="return mV(\'Exd\',39,10);">39:10</a>, the Revised Version margin translation of Hebrew bareqeth; in Tobit 13:16; Judith 10:21; Ecclesiasticus 32:6; <a onClick="return mV(\'Rev\',21,19);">Re 21:19</a>, English Versions of the Bible translation of Greek smaragdos; in <a onClick="return mV(\'Rev\',21,19);">Re 21:19</a>, English Versions of the Bible translation of Greek adjective smaragdinos.<P>Gabhish: in <a onClick="return mV(\'Job\',28,18);">Job 28:18</a>: The Septuagint transliterates gabis; the King James Version translates "pearls"; the Revised Version (British and American) translates "crystal." From the similarity to gabhash, "ice," the rendering "crystal" is suggested.<P>Chashmal: in <a onClick="return mV(\'Eze\',1,4,27);">Eze 1:4,27</a>; <a onClick="return mV(\'Eze\',8,2);">8:2</a>: The Septuagint translates elektron; Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) and the Revised Version margin translate electrum; the King James Version, the English Revised Version and the American Revised Version margin translate "amber"; the American Standard Revised Version translates "glowing metal." The elektron of the time of the Septuagint and Theophrastus was the amber, of the present day; in the time of Pliny amber was an object of luxury ranked next to crystal, and the term electrum was then applied, not only to amber, but also to a metallic alloy of gold and silver.<P>Huakinthos, (huakinthos): in <a onClick="return mV(\'Rev\',9,17);">Re 9:17</a>; <a onClick="return mV(\'Rev\',21,20);">21:20</a>: the 11th foundation of the New Jerusalem. Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) translates hyacinthus; the King James Version translates "jacinth"; the Revised Version (British and American) translates "jacinth" (<a onClick="return mV(\'Rev\',21,20);">Re 21:20</a>) and "hyacinth" (<a onClick="return mV(\'Rev\',9,17);">Re 9:17</a>); the Revised Version margin translates "sapphire" (<a onClick="return mV(\'Rev\',21,20);">Re 21:20</a>). Pliny describes the hyacinthus as being very different from amethystus, "though partaking of a color that closely\' borders upon it" and as being of a more diluted violet, It may have been the pale blue sapphire (alumina) of the present day; the modern hyacinth, or jacinth, is a quite different stone, a brownish to reddish zircon (silicate of zirconium).<P>Hyacinth, jacinth (see also special article on <a href="./study/isbe/search.html?string=HYACINTH">HYACINTH</A>): "hyacinth" in <a onClick="return mV(\'Rev\',9,17);">Re 9:17</a>, the Revised Version (British and American) translation of Greek huakinthos; "jacinth" in <a onClick="return mV(\'Exd\',28,19);">Ex 28:19</a>; <a onClick="return mV(\'Exd\',39,12);">39:12</a>, the Revised Version (British and American) translation of Hebrew leshem; in <a onClick="return mV(\'Rev\',9,17);">Re 9:17</a>; <a onClick="return mV(\'Rev\',21,20);">21:20</a>, the King James Version translation of Greek huakinthos.<P>Iaspis (iaspis): in <a onClick="return mV(\'Rev\',4,3);">Re 4:3</a>; <a onClick="return mV(\'Rev\',21,11,18);">21:11,18</a> f: the 1st foundation of the New Jerusalem. Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) translates jaspis; English Versions of the Bible translates "jasper." According to Septuagint iaspis was the 3rd stone, 2nd row, of the breastplate, but there is uncertainty as to the Hebrew text of the Septuagint in respect of this word; Septuagint translates also kadhkodh as iaspis (<a onClick="return mV(\'Isa\',54,12);">Isa 54:12</a>). Pliny describes iaspis as being generally green and often transparent; he recognizes as many as 14 varieties.<P>He adds that "many countries produce this stone: that of India is like smaragdus in color; that of Cyprus is hard and of a full sea-green; and that of Persia is skyblue. Similar to the last is the Caspian iaspis. On the banks of the river Thermodon the iaspis is of an azure color; in Phrygia it is purple; and in Cappadocia of an azure-purple, somber and not refulgent. The best kind is that which has a shade of purple, the next best being the rose-colored, and the next the stone with the green color of the smaragdus," etc.<P>The term "jasper" is now restricted to opaque stones; the green transparent kind of iaspis may have been identical with the green chalcedony (crypto-crystalline silica) called plasma at the present day.<P>Jasper: in <a onClick="return mV(\'Exd\',28,20);">Ex 28:20</a>; <a onClick="return mV(\'Exd\',39,13);">39:13</a>; <a onClick="return mV(\'Eze\',28,13);">Eze 28:13</a>, English Versions of the Bible translation of Hebrew yashepheh; in <a onClick="return mV(\'Rev\',4,3);">Re 4:3</a>; <a onClick="return mV(\'Rev\',21,11,18,19);">21:11,18,19</a>, English Versions of the Bible translation of Greek iaspis.<P>Kadhkodh: in <a onClick="return mV(\'Isa\',54,12);">Isa 54:12</a>; <a onClick="return mV(\'Eze\',27,16);">Eze 27:16</a>: The Septuagint translates iaspis (<a onClick="return mV(\'Isa\',54,12);">Isa 54:12</a>) and transliterates chorchor (<a onClick="return mV(\'Eze\',27,16);">Eze 27:16</a>); Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) translates jaspis (<a onClick="return mV(\'Isa\',54,12);">Isa 54:12</a>) and transliterates chodchod (<a onClick="return mV(\'Eze\',27,16);">Eze 27:16</a>); the King James Version translates "agate"; the King James Version margin translates "chrysoprase" (<a onClick="return mV(\'Eze\',27,16);">Eze 27:16</a>); the Revised Version (British and American) translates "ruby." There is little to indicate the probable meaning of the word.<P>Qerach: in <a onClick="return mV(\'Eze\',1,22);">Eze 1:22</a>: Septuagint translates krustallos; Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) translates crystallum; English Versions of the Bible translates "crystal"; the Revised Version margin translates "ice." The translations are suggested by the similarity to the Hebrew qerach, "ice."<P>Krustallos (krustallos): in <a onClick="return mV(\'Rev\',4,6);">Re 4:6</a>; <a onClick="return mV(\'Rev\',22,1);">22:1</a>: Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) translates crystallum; English Versions of the Bible translates "crystal." The crystallum of Pliny was the rock-crystal (clear quartz) of the present day. Among the localities cited for crystallum by Pliny are "the crags of the Alps, so difficult of access that it is usually found necessary to be suspended by ropes in order to extract it."<P>Lapis lazuli: in <a onClick="return mV(\'Rev\',21,19);">Re 21:19</a>, the Revised Version margin translation of Greek sappheiros.<P>Leshem: in <a onClick="return mV(\'Exd\',28,19);">Ex 28:19</a>; <a onClick="return mV(\'Exd\',39,12);">39:12</a>: 1st stone, 3rd row, of the breastplate. Septuagint probably translates ligurion, but there is uncertainty as to their Hebrew text; Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) probably translates ligurius; the King James Version translates "ligure"; the Revised Version (British and American) translates "jacinth"; the Revised Version margin translates "amber."<P>The ligurion of the Septuagint is probably identical with the lugkurion of Theophrastus; this was a yellow to yellowishred stone used by seal engravers, and was transparent and difficult to polish. The yellow ligurion may be the yellow jargoon of the present day (zircon, silicate of zirconium), a stone much used by the ancient Greek and Roman engravers; but as the jargoon has not been found among ancient Egyptian work, it has been suggested that the ligurion of the breastplate may have been a yellow quartz (citrine) or agate. The yellowish-red ligurion may have been one of the stones to which the name "jacinth" (also a zircon) is now applied. Professor Maskelyne, rejecting the Septuagint translated, suggests that the leshem was identical with the neshem of the Egyptians, namely the green feldspar now called amazon stone; as an alternative rendering to this he suggests yellow jasper. The translation "amber" (Revised Version, margin) is not likely to be correct, for that material would have been too soft for use as a stone of the breastplate; its properties do not accord with those assigned by Theophrastus to the lugkurion.<P>Ligure: in <a onClick="return mV(\'Exd\',38,19);">Ex 38:19</a>; <a onClick="return mV(\'Exd\',39,12);">39:12</a>, the King James Version translation of Hebrew leshem.<P>Ligurion (ligurion): in Septuagint <a onClick="return mV(\'Exd\',28,19);">Ex 28:19</a>; <a onClick="return mV(\'Exd\',39,12);">39:12</a>, Septuagint translation of Hebrew leshem: 1st stone, 3rd row, of breastplate.<P>Margarites (margarites): in <a onClick="return mV(\'Mat\',7,6);">Mt 7:6</a>; <a onClick="return mV(\'Mat\',13,45,46);">13:45,46</a>; <a onClick="return mV(\'1Ti\',2,9);">1Ti 2:9</a>; <a onClick="return mV(\'Rev\',18,12,16);">Re 18:12,16</a>; <a onClick="return mV(\'Rev\',21,21);">21:21</a>: Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) translates margarita; English Versions of the Bible translates "pearl." The margarites is mentioned by Theophrastus as being one of the precious stones, but not pellucid, as produced in a kind of oyster and in the pinna, and as brought from the Indies and the shores of certain islands in the Red Sea. Hence, it was identical with the pearl of the present day.<P>Nophekh, in <a onClick="return mV(\'Exd\',28,18);">Ex 28:18</a>; <a onClick="return mV(\'Exd\',39,11);">39:11</a>; <a onClick="return mV(\'Eze\',27,16);">Eze 27:16</a>; <a onClick="return mV(\'Eze\',28,13);">28:13</a>: 1st stone, 2nd row, of the breastplate. There is uncertainty as to the Hebrew text used by the Septuagint, but probably nophekh is translated anthrax (except in <a onClick="return mV(\'Eze\',27,16);">Eze 27:16</a>, where the text differs); Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) probably translates carbunculus; English Versions of the Bible translates "emerald"\' the Revised Version margin translates "carbuncle." English Versions of the Bible interchanges the names given by the Septuagint to the 3rd stone, 1st row (smaragdos, "emerald") and the 1st stone, 2nd row (anthrax, "carbuncle"). Professor Maskelyne suggests that the nophekh of the breastplate may have been the mophak or mafka of the Egyptian hieroglyphics, the turquoise of the present day.<p>\'Odhem, in <a onClick="return mV(\'Exd\',28,17);">Ex 28:17</a>; <a onClick="return mV(\'Exd\',39,10);">39:10</a>; <a onClick="return mV(\'Eze\',28,13);">Eze 28:13</a>: 1st stone, 1st row, of the breastplate. Septuagint probably translates sardion, Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) probably translates sardius; English Versions of the Bible translates "sardius"; EVm translates "ruby." The Hebrew word is related to [\'adham], "to be red," and signifies a reddish stone; it may have been sard (a name given not only to red, but also to pale reddish-yellow or brown, translucent chalcedony), but was more probably carnelian, a red stone closely allied to sard, and much used by the ancient Egyptians and Assyrians.<P>Onuchion, (onuchion, onux): "onux," Septuagint translation of Hebrew shoham (<a onClick="return mV(\'Job\',28,16);">Job 28:16</a>); onuchion, perhaps Septuagint translation of shoham in the descriptions of the ornaments of the king of Tyre (<a onClick="return mV(\'Eze\',28,13);">Eze 28:13</a>) and the stones of the breastplate (being there made 3rd stone, 4th row, in <a onClick="return mV(\'Exd\',28,20);">Ex 28:20</a>; <a onClick="return mV(\'Exd\',39,13);">39:13</a>), but there is uncertainty as to the Hebrew text of the Septuagint; Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) translates onyx, lapis onychinus, lapis sardonychus. The onuchion of Theophrastus was a hard, translucent stone used by the seal engravers; it consisted of white and dusky layers in alternation. The onyx of Roman times was an opaque stone of white and black layers, like the onyx of the present day.<P>Onyx: in <a onClick="return mV(\'Gen\',2,12);">Ge 2:12</a>; <a onClick="return mV(\'Exd\',25,7);">Ex 25:7</a>; <a onClick="return mV(\'Exd\',28,9,20);">28:9,20</a>; <a onClick="return mV(\'Exd\',35,9,27);">35:9,27</a>; <a onClick="return mV(\'Exd\',39,6,13);">39:6,13</a>; <a onClick="return mV(\'1Ch\',29,2);">1Ch 29:2</a>; <a onClick="return mV(\'Job\',18,16);">Job 18:16</a>; <a onClick="return mV(\'Eze\',28,13);">Eze 28:13</a>, English Versions of the Bible translation of Hebrew shoham.<P>Pearl: in <a onClick="return mV(\'Job\',28,18);">Job 28:18</a>, the King James Version translation of Hebrew gabhish; in <a onClick="return mV(\'Job\',28,18);">Job 28:18</a>, the Revised Version margin translation of Hebrew peninim; in <a onClick="return mV(\'Mat\',7,6);">Mt 7:6</a>; <a onClick="return mV(\'Mat\',13,45);">13:45</a>f; <a onClick="return mV(\'1Ti\',2,9);">1Ti 2:9</a>; <a onClick="return mV(\'Rev\',18,12,16);">Re 18:12,16</a>; <a onClick="return mV(\'Rev\',21,20,21);">21:20,21</a>, English Versions of the Bible translation of Greek margarites.<P>Peninim, in <a onClick="return mV(\'Job\',28,18);">Job 28:18</a>; <a onClick="return mV(\'Pro\',3,15);">Pr 3:15</a>; <a onClick="return mV(\'Pro\',8,11);">8:11</a>; <a onClick="return mV(\'Pro\',20,15);">20:15</a>; <a onClick="return mV(\'Pro\',31,10);">31:10</a>; <a onClick="return mV(\'Lam\',4,7);">La 4:7</a>: Septuagint (from which <a onClick="return mV(\'Pro\',20,15);">Pr 20:15</a> is missing) periphrases the word or had a different Hebrew text; Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) translates ebur antiquum ("old ivory") in <a onClick="return mV(\'Lam\',4,7);">La 4:7</a>, but elsewhere periphrases the word or had a different Hebrew text; English Versions of the Bible translates "rubies"; the Revised Version margin translates "red coral," or "pearls," except for <a onClick="return mV(\'Lam\',4,7);">La 4:7</a>, where the translation is "corals." The word is similar to an Arabic word meaning "branches" and may signify red coral, which has been highly esteemed since very ancient times; a description of korallion is given by Theophrastus. Pliny says that in his day the reddest and most branched was most valued.<P>Pitedhah, in <a onClick="return mV(\'Exd\',28,17);">Ex 28:17</a>; <a onClick="return mV(\'Exd\',39,10);">39:10</a>; <a onClick="return mV(\'Job\',28,19);">Job 28:19</a>; <a onClick="return mV(\'Eze\',28,13);">Eze 28:13</a>: 2nd stone, 1st row, of the breastplate. Septuagint translates topazion in <a onClick="return mV(\'Job\',28,19);">Job 28:19</a> and probably also in the other verses; Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) translates topazius; English Versions of the Bible translates "topaz." The topazion of ancient times appears to have been scarcely known before the Ptolemaic period, and Professor Maskelyne suggested that the Hebrew word may possibly be allied to bijada, which in Persian and Arabic signifies "garnet."<P>Ramoth: in <a onClick="return mV(\'Job\',28,18);">Job 28:18</a>, the King James Version margin translation of Hebrew ra\'moth.<P>Ra\'moth, in <a onClick="return mV(\'Job\',28,18);">Job 28:18</a>; <a onClick="return mV(\'Eze\',27,16);">Eze 27:16</a>: Septuagint translates meteora (<a onClick="return mV(\'Job\',28,18);">Job 28:18</a>) and ramoth (<a onClick="return mV(\'Eze\',27,16);">Eze 27:16</a>); Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) periphrases the passages; English Versions of the Bible translates "coral"; the King James Version margin translates "ramoth" (only in <a onClick="return mV(\'Job\',28,18);">Job 28:18</a>). There is little to indicate the meaning of the Hebrew word.<P>Ruby: in <a onClick="return mV(\'Job\',28,18);">Job 28:18</a>; <a onClick="return mV(\'Pro\',3,15);">Pr 3:15</a>; <a onClick="return mV(\'Pro\',8,11);">8:11</a>; <a onClick="return mV(\'Pro\',20,15);">20:15</a>; <a onClick="return mV(\'Pro\',31,10);">31:10</a>; <a onClick="return mV(\'Lam\',4,7);">La 4:7</a>, English Versions of the Bible translation of Hebrew peninim; in <a onClick="return mV(\'Isa\',54,12);">Isa 54:12</a>; <a onClick="return mV(\'Eze\',27,16);">Eze 27:16</a>, the Revised Version (British and American) translation of Hebrew kadhkodh; in <a onClick="return mV(\'Exd\',28,17);">Ex 28:17</a>; <a onClick="return mV(\'Exd\',39,10);">39:10</a>; <a onClick="return mV(\'Eze\',28,13);">Eze 28:13</a>, the King James Version margin translation of Hebrew \'odhem.<P>Sappheiros (sappheiros): in Tobit 13:16; <a onClick="return mV(\'Rev\',21,19);">Re 21:19</a>: the 2nd foundation of the New Jerusalem. Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) translates sapphirus; English Versions of the Bible translates "sapphire"; the Revised Version margin translates "lapis lazuli" (but only in <a onClick="return mV(\'Rev\',21,19);">Re 21:19</a>). According to the Septuagint, sappheiros was the 2nd stone, 3rd row, of the breastplate, but there is uncertainty as to the Hebrew text. Pliny describes sapphirus as "refulgent with spots like gold. It is also of an azure color, though sometimes, but rarely, it is purple; the best kind being that which comes from Media. In no case, however, is this stone transparent." These characteristics correspond to the lapis lazuli (sulphato-silicate of sodium and aluminum), not to the sapphire (alumina) of the present day.<P>Cappir, in <a onClick="return mV(\'Exd\',24,10);">Ex 24:10</a>; <a onClick="return mV(\'Exd\',28,18);">28:18</a>; <a onClick="return mV(\'Exd\',39,11);">39:11</a>; <a onClick="return mV(\'Job\',28,6,16);">Job 28:6,16</a>; <a onClick="return mV(\'Sgs\',5,14);">So 5:14</a>; <a onClick="return mV(\'Isa\',54,11);">Isa 54:11</a>; <a onClick="return mV(\'Lam\',4,7);">La 4:7</a>; <a onClick="return mV(\'Eze\',1,26);">Eze 1:26</a>; <a onClick="return mV(\'Eze\',10,1);">10:1</a>; <a onClick="return mV(\'Eze\',28,13);">28:13</a>: 2nd stone, 2nd row, of the breastplate. Septuagint translates sappheiros; Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) translates sapphirus and (<a onClick="return mV(\'Exd\',24,10);">Ex 24:10</a>) lapis sapphirinus; English Versions of the Bible translates "sapphire." The Hebrew word is universally accepted as equivalent to the Greek sappheiros; that name was used, not for the stone now known as sapphire, but for that now known as lapis lazuli, a substance which was regarded by the ancient Egyptians as a precious stone.<P>Sardine (stone), sardius: "sardine" (stone) in <a onClick="return mV(\'Rev\',4,3);">Re 4:3</a>, the King James Version translation of Greek sardinon, an error of text for sardion; "sardius" in <a onClick="return mV(\'Rev\',4,3);">Re 4:3</a>, the Revised Version (British and American) translation of Greek sardion; in <a onClick="return mV(\'Rev\',21,20);">Re 21:20</a>, English Versions of the Bible translation of Greek sardion; in <a onClick="return mV(\'Exd\',28,17);">Ex 28:17</a>; <a onClick="return mV(\'Exd\',39,10);">39:10</a>; <a onClick="return mV(\'Eze\',28,13);">Eze 28:13</a>, English Versions of the Bible translation of Hebrew \'odhem.<P>Sardion (sardion): in <a onClick="return mV(\'Rev\',4,3);">Re 4:3</a>; <a onClick="return mV(\'Rev\',21,20);">21:20</a>: the 6th foundation of the New Jerusalem. According to the Septuagint, sardion was the 1st stone, 1st row, of the breastplate. Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) translates sardius; the King James Version translates "sardine" (stone) (<a onClick="return mV(\'Rev\',4,3);">Re 4:3</a>) and "sardius" (<a onClick="return mV(\'Rev\',21,20);">Re 21:20</a>); the Revised Version (British and American) translates "sardius." The sarda of Pliny\'s time was much used by the seal engravers. There were three Indian varieties, all of them transparent, one of them red in color; there was then no precious stone in more common use; those of honey-color were less valued. It probably included both the sard and the carnelian of the present day (crypto-crystalline silica).<P>Sapphire: in <a onClick="return mV(\'Exd\',24,10);">Ex 24:10</a>; <a onClick="return mV(\'Exd\',28,18);">28:18</a>; <a onClick="return mV(\'Exd\',39,11);">39:11</a>; <a onClick="return mV(\'Job\',28,6,16);">Job 28:6,16</a>; <a onClick="return mV(\'Sgs\',5,14);">So 5:14</a>; <a onClick="return mV(\'Isa\',54,11);">Isa 54:11</a>; <a onClick="return mV(\'Lam\',4,7);">La 4:7</a>; <a onClick="return mV(\'Eze\',1,26);">Eze 1:26</a>; <a onClick="return mV(\'Eze\',10,1);">10:1</a>; <a onClick="return mV(\'Eze\',28,13);">28:13</a>, English Versions of the Bible translation of Hebrew sappir; in Tobit 13:16; <a onClick="return mV(\'Rev\',21,19);">Re 21:19</a>, English Versions of the Bible translation of Greek sappheiros; in <a onClick="return mV(\'Rev\',21,20);">Re 21:20</a>, the Revised Version margin translation of Greek huakinthos.<P>Sardonux (sardonux): in <a onClick="return mV(\'Rev\',21,20);">Re 21:20</a>: the 5th foundation of the New Jerusalem. Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) and English Versions of the Bible translate sardonyx. According to Pliny, the name sardonyx was at first given to an Indian (red) sarda with a layer of white in it, both being transparent.<P>Pliny says that later three colors were considered essential, but that they might be repeated indefinitely. The Arabian sardonyx was "characterized by several different colors, black or azure for the base and vermilion surrounded with a line of rich white for the upper part, not without a certain glimpse of purple as the white passes into the red."<P>The sardonux of John\'s time is included in the sardonyx of the present day.<P>Sardonyx: in <a onClick="return mV(\'Rev\',21,20);">Re 21:20</a>, English Versions of the Bible translation of Greek sardonux; <a onClick="return mV(\'Exd\',28,18);">Ex 28:18</a>; <a onClick="return mV(\'Exd\',39,11);">39:11</a>, the Revised Version margin translation of Hebrew yahalom.<P>Shamir, in <a onClick="return mV(\'Jer\',17,1);">Jer 17:1</a>; <a onClick="return mV(\'Eze\',3,9);">Eze 3:9</a>; <a onClick="return mV(\'Zec\',7,12);">Zec 7:12</a>; Septuagint omits <a onClick="return mV(\'Jer\',17,1);">Jer 17:1</a>, and in the other two verses either periphrases the word or had a different text; Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) translates (unguis) adamantinus in <a onClick="return mV(\'Jer\',17,1);">Jer 17:1</a>, and adamas in the other two verses; English Versions of the Bible translates "diamond" (<a onClick="return mV(\'Jer\',17,1);">Jer 17:1</a>) and "adamant" (<a onClick="return mV(\'Eze\',3,9);">Eze 3:9</a>; <a onClick="return mV(\'Zec\',7,12);">Zec 7:12</a>). Shamir was a hard material used for engraving precious stones; in the days of Jeremiah, Ezekiel and Zechariah, splinters of both diamond and corundum (white sapphire or adamant stone) were probably available for the purpose. Both diamond and adamant are English modifications of the Latin adamas; the form "diamond" has been restricted for some centuries to the more precious of the above stones.<P>Shebho, in <a onClick="return mV(\'Exd\',28,19);">Ex 28:19</a>; <a onClick="return mV(\'Exd\',39,12);">39:12</a>: the 2nd stone, 3rd row, of the breastplate. Both Septuagint and Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) probably translate achates, but their Hebrew texts are uncertain; English Versions of the Bible translates "agate." The name achates was given in ancient times to certain stones having banded structures, the agates of the present day. In the time of Theophrastus achates was sold at a great price, but by the time of Pliny had ceased to be a precious stone. Professor Maskelyne suggests that the shebho of the breastplate may have signified the "stone of Sheba" or "Seba," a district in Southern Arabia, and have been the Arabian onyx.<P>Shoham, in <a onClick="return mV(\'Gen\',2,12);">Ge 2:12</a>; <a onClick="return mV(\'Exd\',25,7);">Ex 25:7</a>; <a onClick="return mV(\'Exd\',28,9,20);">28:9,20</a>; <a onClick="return mV(\'Exd\',35,9,27);">35:9,27</a>; <a onClick="return mV(\'Exd\',39,6,13);">39:6,13</a>; <a onClick="return mV(\'1Ch\',29,2);">1Ch 29:2</a>; <a onClick="return mV(\'Job\',28,16);">Job 28:16</a>; <a onClick="return mV(\'Eze\',28,13);">Eze 28:13</a>: the 2nd stone, 4th row, of the breastplate. Septuagint translates prasinos, i.e. "leek-green stone" (<a onClick="return mV(\'Gen\',2,12);">Ge 2:12</a>), sardion (<a onClick="return mV(\'Exd\',25,7);">Ex 25:7</a>; <a onClick="return mV(\'Exd\',35,9);">35:9</a>), smaragdos (<a onClick="return mV(\'Exd\',28,9);">Ex 28:9</a>; <a onClick="return mV(\'Exd\',35,27);">35:27</a>), berullion, probably, through interchange of words in the Hebrew text (<a onClick="return mV(\'Exd\',28,20);">Ex 28:20</a>; <a onClick="return mV(\'Exd\',39,13);">39:13</a>), soom (<a onClick="return mV(\'1Ch\',29,2);">1Ch 29:2</a>), onux (<a onClick="return mV(\'Job\',28,16);">Job 28:16</a>) and perhaps onuchion (<a onClick="return mV(\'Eze\',28,13);">Eze 28:13</a>); Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) translates onyx (<a onClick="return mV(\'Eze\',28,13);">Eze 28:13</a>), lapis sardonychus (<a onClick="return mV(\'Job\',28,16);">Job 28:16</a>) and lapis onychinus elsewhere; English Versions of the Bible translates "onyx"; the Revised Version margin translates "beryl" (except in <a onClick="return mV(\'Eze\',28,13);">Eze 28:13</a>). Professor Maskelyne and Professor Sayce, accepting green as the color of shoham, have expressed the opinion that the stone known by that name in very early times was the stone called \'siamu by the Assyrians, and therefore the green turquoise; Professor Maskelyne gives "amazon stone" as an alternative rendering of the word. Berullion is given by the Septuagint as the 2nd stone, onuchion as the 3rd stone, of the 4th row; sardion as the 1st stone, smaragdos as the 3rd stone, of the 1st row; but their Hebrew text is uncertain.<P>Smaragdinos, smaragdos (smaragdinos): in <a onClick="return mV(\'Rev\',4,3);">Re 4:3</a>: the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) translates smaragdinus; English Versions of the Bible translates "emerald." Smaragdos (smaragdos) in Tobit 13:16; Judith 10:21; Ecclesiasticus 32:5; <a onClick="return mV(\'Rev\',21,19);">Re 21:19</a>: the Vulgate translates it as smaragdus; English Versions of the Bible translates "emerald." According to the Septuagint, smaragdos was the 3rd stone, 1st row, of the breastplate, but their Hebrew text is uncertain. The smaragdos of Theophrastus was a small, scarce, presumably green, stone used by the gem engravers. In Pliny\'s time the genus smaragdus comprised no fewer than 12 kinds; one of them was the emerald of the present day, and probably the smaragdos of Theophrastus.<P>Tarshish, in <a onClick="return mV(\'Exd\',28,20);">Ex 28:20</a>; <a onClick="return mV(\'Exd\',39,13);">39:13</a>; <a onClick="return mV(\'Sgs\',5,14);">So 5:14</a>; <a onClick="return mV(\'Eze\',1,16);">Eze 1:16</a>; <a onClick="return mV(\'Eze\',10,9);">10:9</a>; <a onClick="return mV(\'Eze\',28,13);">28:13</a>; <a onClick="return mV(\'Dan\',10,6);">Da 10:6</a>: the 1st stone, 4th row, of the breastplate. The Septuagint translates tharsis (<a onClick="return mV(\'Sgs\',5,14);">So 5:14</a>; <a onClick="return mV(\'Eze\',1,16);">Eze 1:16</a>; <a onClick="return mV(\'Dan\',10,6);">Da 10:6</a>), anthrax (<a onClick="return mV(\'Eze\',10,9);">Eze 10:9</a>); in the remaining verses there is uncertainty as to the order of the Hebrew words in the several texts. The most likely Septuagint equivalent of tarshish is either chrusolithos or berullion; Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) translates hyacinthus (<a onClick="return mV(\'Sgs\',5,14);">So 5:14</a>), mare ("sea") (<a onClick="return mV(\'Eze\',1,16);">Eze 1:16</a>), chrysolithus (<a onClick="return mV(\'Eze\',10,9);">Eze 10:9</a>; <a onClick="return mV(\'Dan\',10,6);">Da 10:6</a>). The Septuagint gives anthrax as the 1st stone, 2nd row, chrusolithos as the 1st stone, 4th row, berullion as the 2nd stone, 4th row, of the breastplate; English Versions of the Bible translates "beryl"; the King James Version margin translates "chrysolite" (in <a onClick="return mV(\'Eze\',28,13);">Eze 28:13</a> only); the Revised Version margin translates "chalcedony" (<a onClick="return mV(\'Exd\',28,20);">Ex 28:20</a>; <a onClick="return mV(\'Exd\',39,13);">39:13</a>), "topaz" (<a onClick="return mV(\'Sgs\',5,14);">So 5:14</a>) and "stone of Tarshish" (<a onClick="return mV(\'Eze\',10,9);">Eze 10:9</a>). Professor Maskelyne suggests that the stone may have been citrine (quartz), if yellow as suggested by chrusolithos, and green jasper, if green as suggested by berullion.<P>Topaz: in <a onClick="return mV(\'Exd\',28,17);">Ex 28:17</a>; <a onClick="return mV(\'Exd\',39,10);">39:10</a>; <a onClick="return mV(\'Job\',28,19);">Job 28:19</a>; <a onClick="return mV(\'Eze\',28,13);">Eze 28:13</a>, English Versions of the Bible translation of Hebrew pitedhah; in <a onClick="return mV(\'Rev\',21,20);">Re 21:20</a>, English Versions of the Bible translation of Greek topazion; in <a onClick="return mV(\'Sgs\',5,14);">So 5:14</a>, the Revised Version margin translation of Hebrew tarshish.<P>Topazion (topazion): in <a onClick="return mV(\'Rev\',21,20);">Re 21:20</a>: the 9th foundation of the New Jerusalem. According to the Septuagint topazion was the 2nd stone, 1st row, of the breastplate. Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) translates topazius; English Versions of the Bible translate it as "topaz."<P>The topazion of Pliny\'s time was "held in very high estimation for its green tints; when it was first discovered it was preferred to every other kind of precious stone." It was said to be brought from an island in the Red Sea, off the coast of Arabia. It was the only stone of high value that yielded to the action of the file. Topazion is not mentioned by Theophrastus. Pliny\'s account corresponds to the peridot of the present day (silicate of magnesium and iron), not to our topaz (fluosilicate of aluminium).<P>Yahalom, in <a onClick="return mV(\'Exd\',28,18);">Ex 28:18</a>; <a onClick="return mV(\'Exd\',39,11);">39:11</a>; <a onClick="return mV(\'Eze\',28,13);">Eze 28:13</a>: the 3rd stone, 2nd row, of the breastplate. Owing to the uncertainty as to the order of the words in the Hebrew text of the Septuagint, there is uncertainty as to the Greek equivalent of yahalom; probably it is one of the words chrusolithos, berullion, onuchion, given by the Septuagint as the names of the stones of the 4th row. English Versions of the Bible translates "diamond"; this is certainly wrong, for the stone had a name engraved on it and the method of engraving a diamond was not invented till 2,000 or 3,000 years after the breastplate was made; nor were diamonds, if known at all, then known so large as to be comparable in respect of size, with the other stones of the breastplate. The Revised Version margin translates "sardonyx" (in Exodus only). Professor Maskelyne suggests that the Hebrew yahalom and the Greek hualos may be kindred words and that yahalom may have been a bluish glass (considered valuable in very early times), or blue chalcedony, or perhaps even beryl.<P>Yashepheh, in <a onClick="return mV(\'Exd\',28,20);">Ex 28:20</a>; <a onClick="return mV(\'Exd\',39,13);">39:13</a>; <a onClick="return mV(\'Eze\',28,13);">Eze 28:13</a>: the 3rd stone, 4th row, of the breastplate. Septuagint probably translates iaspis, though iaspis is placed by the Septuagint as the 3rd stone, 2nd row; Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) probably translates jaspis; English Versions of the Bible translate it as "jasper." The equivalence of the Hebrew yashepheh and the Greek iaspis is generally accepted.<P>Zekhukhith, in <a onClick="return mV(\'Job\',28,17);">Job 28:17</a>: Septuagint translates hualos, a name given at first to any transparent stone, but in later times only to glass; Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) translates vitrum; the King James Version translates "crystal"; the Revised Version (British and American) translates "glass." Zekhukhith is related to a Hebrew word meaning "to be pure," whence the renderings crystal and glass.``60';

isbe[8429]='Stool`stool (\'obhnayim): It is not clear what the character and purpose of this stool were Septuagint has no reference to it). It seems to have been a chair of a peculiar sort upon which a woman reclined in parturition (<a onClick="return mV(\'Exd\',1,16);">Ex 1:16</a>). The Hebrew word is in the dual number and primarily means "two stones." The only other place where it occurs is <a onClick="return mV(\'Jer\',18,3);">Jer 18:3</a>, where it is rendered "wheels" Septuagint epi ton lithon, "on the stones"). In <a onClick="return mV(\'2Ki\',4,10);">2Ki 4:10</a>, the word translated in the King James Version as "stool" (kicce\') is in the Revised Version (British and American) more correctly translated "seat."`<a href="./study/isbe/search.html?string=BIRTH+STOOL">BIRTH-STOOL</a>; <a href="./study/isbe/search.html?string=SEAT">SEAT</a>`29';

isbe[8431]='Store-Cities`stor\'-cit-iz (mickenoth): the Revised Version (British and American) <a onClick="return mV(\'Exd\',1,11);">Ex 1:11</a> (of <a href="./study/isbe/search.html?string=PITHOM">PITHOM</A> and <a href="./study/isbe/search.html?string=RAAMSES">RAAMSES</A> (which see)) for the King James Version "treasure cities" (compare <a onClick="return mV(\'1Ki\',9,19);">1Ki 9:19</a>; <a onClick="return mV(\'2Ch\',8,4,6);">2Ch 8:4,6</a>; <a onClick="return mV(\'2Ch\',16,4);">16:4</a>, etc.). Depots of provisions and magazines of arms.``1';
isbe[8432]='Storehouses`stor\'-houz-iz, -ez: The following chief changes in the use of this word (representing various Hebrew words) in the Revised Version (British and American) to be noted are: In <a onClick="return mV(\'Deu\',28,8);">De 28:8</a>, the Revised Version (British and American) has "barns" (\'acamim); in <a onClick="return mV(\'1Ch\',27,25);">1Ch 27:25</a>, "treasures" (\'otsroth); in <a onClick="return mV(\'Neh\',12,25);">Ne 12:25</a>, for "thresholds" has "storehouses" (\'asuppim), so, for "Asuppim" in <a onClick="return mV(\'1Ch\',26,15,17);">1Ch 26:15,17</a> ("house of Asuppim," "toward Asuppim") has "store-house"; in <a onClick="return mV(\'Luk\',12,24);">Lu 12:24</a>, for "storehouse" has "store-chamber" (tameion). In other passages the King James Version "storehouse" is retained (<a onClick="return mV(\'Gen\',41,56);">Ge 41:56</a>; <a onClick="return mV(\'2Ch\',32,28);">2Ch 32:28</a>, mickenoth; <a onClick="return mV(\'Psa\',33,7);">Ps 33:7</a>, \'otsroth; <a onClick="return mV(\'Jer\',50,26);">Jer 50:26</a>, ma\'abhucim).``1';
isbe[8433]='Stories`sto\'-riz: For the King James Version "stories" (ma\'aloth) in <a onClick="return mV(\'Amo\',9,6);">Am 9:6</a>, the Revised Version (British and American) reads "chambers" (in heavens); in <a onClick="return mV(\'Gen\',6,16);">Ge 6:16</a> (ark); <a onClick="return mV(\'Eze\',42,3,6);">Eze 42:3,6</a> (temple), the word is supplied. the Revised Version (British and American) in the latter verse reads in the text "the third story" (margin as in the King James Version). In <a onClick="return mV(\'1Ki\',6,5,10);">1Ki 6:5,10</a>, the Revised Version (British and American) has "stories" (yatsia\' yatsua\'; see <a href="./study/isbe/search.html?string=TEMPLE">TEMPLE</A>), and in <a onClick="return mV(\'Eze\',41,6);">Eze 41:6</a> supphes "stories."``1';
isbe[8434]='Stork`stork (chacidhah; variously rendered in the Septuagint: <a onClick="return mV(\'Lev\',11,19);">Le 11:19</a>, erodios; <a onClick="return mV(\'Deu\',14,18);">De 14:18</a>, pelekan; <a onClick="return mV(\'Job\',39,13);">Job 39:13</a>, hasida (transliteration of Hebrew); <a onClick="return mV(\'Zec\',5,9);">Zec 5:9</a>, (epops; Latin Ciconia alba): A large wading bird of the family Ardeidae, related to crane, ibis, heron and bittern. The stork on wing is a bird of exquisite beauty. The primary, secondary and a few of the tertiary wing feathers are black, the remainder, also the head, neck, and back and under parts white, the bill and legs red. When a perching white bird suddenly unfolds these wonderful wings, having at times a sweep of 7 ft., and sails away, it makes a very imposing picture. Zechariah in a vision saw a woman having the wings of a stork; <a onClick="return mV(\'Zec\',5,9);">Zec 5:9</a>, "Then lifted I up mine eyes, and saw, and, behold, there came forth two women, and the wind was in their wings; now they had wings like the wings of a stork; and they lifted up the ephah between eaxth and heaven." These birds winter in Africa. In their spring migration many pairs pause in Palestine, others cross the Mediterranean and spread over the housetops, ruins and suitable building-places of Europe as far north as Rolland and England. Always and everywhere the bird has been more or less protected on account of its fidelity to a chosen location, its fearlessness of man and the tender love between mated pairs and for its young.<P>The stork first appears among the birds of abomination, and it is peculiar that the crane does not, for they are closely related. But the crane eats moles, mice, lizards and smaller animals it can capture, also frogs and fish. To this same diet the stork adds carrion and other offensive matter, and the laws of Moses, as a rule, are formulated with good reason. Yet at one time, storks must have been eaten, for Pliny quoted Cornelius Nepos, who died in the days of Augustus Caesar, as saying that "in his time storks were holden for a better dish at board than cranes." Pliny adds: "Yet see, how in our age now, no man will touch a stork if it be set before him on the board, but everyone is ready to reach into the crane and no dish is more in request." He also wrote that it was a capital crime in Thessaly to kill storks, because of their work in slaying serpents. This may have been the beginning of the present laws protecting the bird, reinforced by the steady growth of respect and love for its tender, gentle disposition. The Hebrew word chaidhah, from which the stork took its name, means "kindness."<P>There is a smaller stork having a black neck and back, that homes in Palestine, but only in small numbers as compared with the white. These birds flock and live in forests around the borders of waste and desert places, and build in trees. The young of both species remain a long time in the nest and are tenderly cared for, so much so indeed that from their performances and love of building on housetops arose the popular tradition that the stork delivers newly born children to homes. The birds first appear in <a onClick="return mV(\'Lev\',11,19);">Le 11:19</a> and <a onClick="return mV(\'Deu\',14,18);">De 14:18</a>. Jeremiah noticed that the stork was migratory; see <a onClick="return mV(\'Jer\',8,7);">8:7</a>: "Yea, the stork in the heavens knoweth her appointed times; and the turtle-dove and the swallow and the crane observe the time of their coming; but my people know not the law of Yahweh." The Psalmist referred to their nesting in the cedars of Lebanon, for in Palestine these birds could not build on housetops, which were flat, devoid of chimneys and much used by the people as we use a veranda today; see <a onClick="return mV(\'Psa\',104,17);">Ps 104:17</a>:<P class="in15">"Where the birds make their nests:<br>As for the stork, the fir-trees are her house."``167';
