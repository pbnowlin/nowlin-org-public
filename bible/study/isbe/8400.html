isbe[8437]='Story Writer`sto\'-ri-rit-er: In the sense of chronicler or historian occurs in 1Esdras 2:17 (margin "recorder") and 2:25.``1';
isbe[8438]='Stout; Stoutness`stout, stout\'-nes: In modern English the word signifies strength firmness, corpulence, etc., but in English Versions of the Bible (<a onClick="return mV(\'Psa\',76,5);">Ps 76:5</a>; <a onClick="return mV(\'Isa\',10,12);">Isa 10:12</a>; <a onClick="return mV(\'Isa\',46,12);">46:12</a>; <a onClick="return mV(\'Dan\',7,20);">Da 7:20</a>; <a onClick="return mV(\'Mal\',3,13);">Mal 3:13</a> with stoutness" in <a onClick="return mV(\'Isa\',9,9);">Isa 9:9</a>) it always means "bold" or "proud" and invariably in a bad sense; compare the German stolz, with which "stout" is allied.``1';
isbe[8439]='Straight Street`strat stret.`<a href="./study/isbe/search.html?string=DAMASCUS">DAMASCUS</a>`1';
isbe[8440]='Straight; Straightway`strat, strat\'-wa: "Straiglit" and "strait" are two entirely different words that have no connection with each other in English, the former being derived from the Anglo-Saxon, while the latter has come back from the Latin through the Romance. At some point still farther back, however, the two words may have had some common original with the general meaning "to stretch." But in straight the stretched object is a cord from which all curvature is removed, while in strait a solid is thought of, which is drawn out and made narrow, used figuratively in <a onClick="return mV(\'Job\',20,22);">Job 20:22</a>; <a onClick="return mV(\'Job\',36,16);">36:16</a>; <a onClick="return mV(\'Mat\',7,13);">Mt 7:13</a>f; <a onClick="return mV(\'Phl\',1,23);">Php 1:23</a>. Before English spelling had reached a relatively settled stage the spelling of the two words was interchanged occasionally, but in even Elizabethan times this could happen only through ignorance. In English Versions of the Bible the forms are kept distinct with great care. "Straight," then, appears only in the sense "not crooked," in the Old Testament most commonly for some form of yashar, "be smooth" (<a onClick="return mV(\'2Ch\',32,30);">2Ch 32:30</a>, etc.). In the Apocrypha and New Testament the word is not very common, being used for orthos (Baruch 6:27; <a onClick="return mV(\'Hbr\',12,13);">Heb 12:13</a>); euthus (Judith 13:20; <a onClick="return mV(\'Mar\',1,3);">Mr 1:3</a> and parallel\'s), with the verbs anorthoo (<a onClick="return mV(\'Luk\',13,13);">Lu 13:13</a>), and euthuno (<a onClick="return mV(\'Jhn\',1,23);">Joh 1:23</a>; <a onClick="return mV(\'Hbr\',12,12);">Heb 12:12</a> the Revised Version margin), "to make straight," and euthudromeo, "to make a straight course" (<a onClick="return mV(\'Act\',16,11);">Ac 16:11</a>; <a onClick="return mV(\'Act\',21,1);">21:1</a>). For straightway in English Versions of the Bible overwhelmingly the most common word is euthus, or eutheos. the King James Version varies the translation of this adverb by using either "straightway" or "immediately" without distinction, but the Revised Version (British and American) (with a very few exceptions, e.g., <a onClick="return mV(\'Mat\',24,29);">Mt 24:29</a>) has adhered to "straightway." The other occurrences in the Bible (<a onClick="return mV(\'1Sa\',9,13);">1Sa 9:13</a>; <a onClick="return mV(\'1Sa\',28,20);">28:20</a>, etc.) represent no special word.``48';
isbe[8441]='Strain`stran (diulizo, "to strain off," "to filter"): <a onClick="return mV(\'Mat\',23,24);">Mt 23:24</a>, "Ye blind guides, that strain out the gnat, and swallow the camel" The imagery is that of a drinking-vessel full of liquid, from which tiny impurities are carefully removed while immense masses of other impure matter (<a onClick="return mV(\'Lev\',11,4);">Le 11:4</a>) are overlooked (compare <a onClick="return mV(\'Mat\',7,3);">Mt 7:3</a>f). The first edition of the King James Version read the same as the Revised Version (British and American), but in the later editions a misprint converted "strain out" into "strain at," an error that has never been corrected.``1';
isbe[8442]='Strait; Straiten; Straitly`strat, strat\'-\'-n, strat\'-il: The word "strait" and its compounds are used in English Versions of the Bible in the literal sense of "narrow" (tsar, <a onClick="return mV(\'2Ki\',6,1);">2Ki 6:1</a>; <a onClick="return mV(\'Isa\',49,20);">Isa 49:20</a>; mutsaq, <a onClick="return mV(\'Job\',37,10);">Job 37:10</a>; \'atsal, <a onClick="return mV(\'Eze\',42,6);">Eze 42:6</a>) and in the figurative sense of "strict" (shabha\', <a onClick="return mV(\'Exd\',13,19);">Ex 13:19</a>; caghar, <a onClick="return mV(\'Jos\',6,1);">Jos 6:1</a>; tsarar, "to be distressed," <a onClick="return mV(\'2Sa\',24,14);">2Sa 24:14</a> parallel; yatsar, <a onClick="return mV(\'Job\',20,22);">Job 20:22</a>; metsar, <a onClick="return mV(\'Lam\',1,3);">La 1:3</a>). In Apocrypha the verb "straitened" occurs in Susanna verse 22. In the New Testament we have stenos (<a onClick="return mV(\'Mat\',7,13);">Mt 7:13</a>f parallel, the Revised Version (British and American) "narrow"; polus, "much"; so the Revised Version (British and American) <a onClick="return mV(\'Mar\',3,12);">Mr 3:12</a>; <a onClick="return mV(\'Mar\',5,43);">5:43</a>; sunecho, "to urge," "hold together," <a onClick="return mV(\'Luk\',12,50);">Lu 12:50</a>; <a onClick="return mV(\'Phl\',1,23);">Php 1:23</a>). It occurs in its superlative form in <a onClick="return mV(\'Act\',26,5);">Ac 26:5</a>, "After the straitest (akribestatos, "most exact," "scrupulous") sect of our religion," i.e. "the most precise and rigorous in interpreting the Mosaic Law, and in observing the more minute precepts of the Law and of tradition" (Thayer, Lexicon, under the word; compare <a onClick="return mV(\'Act\',22,3);">Ac 22:3</a>).`<a href="./study/isbe/search.html?string=STRAIGHT+STRAIGHTWAY">STRAIGHT, STRAIGHTWAY</a>`91';
isbe[8443]='Strakes`straks: An older form for "streaks" (so the American Standard Revised Version) in the King James Version, the English Revised Version <a onClick="return mV(\'Gen\',30,37);">Ge 30:37</a> (pitslah, "peeled spot"); <a onClick="return mV(\'Lev\',14,37);">Le 14:37</a> (sheqa\'aruroth, "hollow places"). For "strake," Tobit 11:11; the King James Version <a onClick="return mV(\'Act\',27,17);">Ac 27:17</a>.`<a href="./study/isbe/search.html?string=STRIKE">STRIKE</a>`1';
isbe[8444]='Strange Gods``<a href="./study/isbe/search.html?string=GOD,+STRANGE">GOD, STRANGE</a>`1';
isbe[8445]='Strange Wife`"Strange" as contrasted with "an Israelite." Such wives are spoken of in the King James Version <a onClick="return mV(\'Ezr\',10,2,11);">Ezr 10:2,11</a> (the English Revised Version "strange women," the American Standard Revised Version "foreign women"; see <a href="./study/isbe/search.html?string=STRANGER+AND+SOJOURNER">STRANGER AND SOJOURNER</A>; in the parallel 1Esdras 8:68-9:37, the King James Version uses "strange wives" and "strange women" indifferently, and the Revised Version (British and American) here follows the King James Version) as "wives of the people of the land," in taking whom the men of Israel are said to have "trespassed against their God." Accordingly such wives were "put away."``1';
isbe[8446]='Strange Woman`The Hebrew zar, translated "stranger," meant primarily one "who turns aside," i.e. to visit another country; then a "sojourner," "stranger." The "strange woman" of <a onClick="return mV(\'Pro\',2,16);">Pr 2:16</a> is a technical term for "harlot"; compare <a onClick="return mV(\'Jdg\',11,1,2);">Jud 11:1,2</a>, where "son of a strange (the Revised Version (British and American) "another") woman" (<a onClick="return mV(\'Jdg\',11,2);">11:2</a>, \'acher) is parallel to "the son of a harlot" (<a onClick="return mV(\'Jdg\',11,1);">11:1</A>).`<a href="./study/isbe/search.html?string=STRANGE+WIFE">STRANGE WIFE</a>`1';
isbe[8447]='Strange, Fire`stranj (\'esh zarah, "alien fire"): These words are mentioned in connection with the fatal sin committed by the two oldest sons of Aaron, Nadab and Abihu, in "offering strange fire before Yahweh," on the occasion of the formal consecration of the Aaronitic priesthood (<a onClick="return mV(\'Lev\',10,1,2);">Le 10:1,2</a>). The fact is mentioned again in <a onClick="return mV(\'Num\',3,4);">Nu 3:4</a>; <a onClick="return mV(\'Num\',26,61);">26:61</a>. The greatest calamity of all befell them in that they were cut off childless, which for every true Israelite was the darkest fate imaginable. This fact is mentioned twice (<a onClick="return mV(\'Num\',3,4);">Nu 3:4</a>; <a onClick="return mV(\'1Ch\',24,2);">1Ch 24:2</a>). The power which cut off the lives of Nadab and Abihu (<a onClick="return mV(\'Lev\',10,1,2);">Le 10:1,2</a>) is the same as that which shortly before had consumed the consecratory burnt offering (<a onClick="return mV(\'Lev\',9,24);">Le 9:24</a>). What was its true character, whether, as Rosenmuller and Dachsel surmise, it was a lightning stroke or some other supernatural agency, is not worth while debating. It is enough for us to know that "there came forth fire from before Yahweh and devoured them." Yet this latter word is not to be taken literally, since they were carried out for burial in their own linen garments (<a onClick="return mV(\'Lev\',10,5);">Le 10:5</a>). They were therefore merely killed, not incinerated. What was their sin? The words "strange fire" have been explained either as common fire, which they placed in their censers, or as unholy incense, which they put thereon (<a onClick="return mV(\'Exd\',39,38);">Ex 39:38</a>). But the text plainly points to the former. The sacred fire, once kindled on the altar, was never to be permitted to go out (<a onClick="return mV(\'Lev\',6,12);">Le 6:12</a>f). When later the temple was dedicated Yahweh again lighted the fire on the altar from heaven, as in the case of the dedication of the tabernacle. As, however, the injunction to take fire for the censers of the incense offering only from the coals of the altar is not found before (<a onClick="return mV(\'Lev\',16,12);">Le 16:12</a>), Rosenmuller\'s observation would seem to be very much to the point: "Quamquam enim in iis quae praecedunt, non extat hoc interdictum, tamen est verisimile Mosem vetasse Aaroni et filiis eius ne ignem alienum altari imponerent." ("For although his injunction does not hold in regard to the preceding cases, yet it is very probable that Moses had forbidden Aaron and his sons to place strange fire upon the altar.") A verbal injunction of Moses must have preceded the fatal mistake. But the text leads us to believe there was more than a mistake here. Some find here the sin of drunkenness, from the enjoined abstinence from any intoxicating drink before the priests thereafter minister before Yahweh (<a onClick="return mV(\'Lev\',10,9);">Le 10:9</a>). The likeliest explanation is that, inflated with pride on account of the exaltation of the Aaronitic family above all Israel, they broke unbidden into the ritual of the consecration of the tabernacle and priesthood, eager to take part in the ceremony, and in their haste bringing strange fire into the tabernacle, and thus met their death (see Oehler, Old Testament Theol.,126, 282). The fire burning on the altar came from God, it might never go out, since it represented "the unbroken course of adoration of Yahweh, carried on in sacrifice." And this course was interrupted by Nadab and Abihu. The fire on the altar was a symbol of holiness, and they sought to overlay it with unholiness. And thus it became to them a consuming fire, because they approached the Holy One in a profane spirit (compare <a onClick="return mV(\'Isa\',33,14);">Isa 33:14</a>).``42';
isbe[8448]='Stranger And Sojourner (In the Apocrypha And the New Testament)`The technical meaning attaching to the Hebrew terms is not present in the Greek words translated "stranger" and "sojourner," and the distinctions made by English Versions of the Bible are partly only to give uniformity in the translation. For "stranger" the usual Greek word is xenos, meaning primarily "guest" and so appearing in the combination "hatred toward guests" in <span class="noTag">The Wisdom of Solomon 19:13</span> (misoxenia). Xenos is the most common word for "stranger" in the New Testament (<a onClick="return mV(\'Mat\',25,35);">Mt 25:35</a>, etc.), but it seems not to be used by itself with this force in the Apocrypha. Almost equally common in the New Testament is allotrios, "belonging to another" (<a onClick="return mV(\'Mat\',17,25,26);">Mt 17:25,26</a>; <a onClick="return mV(\'Jhn\',10,5);">Joh 10:5</a> (bis)), and this is the usual word in the Apocrypha (Sirach 8:18; 1Macc 1:38, etc.), but for some inexplicable reason the Revised Version (British and American) occasionally translates by "alien" (contrast, e.g. 1Macc 1:38; 2:7). Compare the corresponding verb apallotrioo (<a onClick="return mV(\'Eph\',2,12);">Eph 2:12</a>; <a onClick="return mV(\'Eph\',4,18);">4:18</a>; <a onClick="return mV(\'Col\',1,21);">Col 1:21</a>). With the definite meaning of "foreigner" are allogenes, "of another nation," the Revised Version (British and American) "stranger" (1Esdras 8:83; 1Macc 3:45 (the King James Version "alien"); <a onClick="return mV(\'Luk\',17,18);">Lu 17:18</a> (the Revised Version margin "alien")), and allophulos, "of another tribe," the Revised Version (British and American) "stranger" (Baruch 6:5; 1Macc 4:12, etc.) or "of another nation" (<a onClick="return mV(\'Act\',10,28);">Ac 10:28</a>). For "to sojourn" the commonest form is paroikeo, "to dwell beside," the Revised Version (British and American) always "to sojourn" (Judith 5:7; Sirach 41:19; <a onClick="return mV(\'Luk\',24,18);">Lu 24:18</a> (the King James Version "to be a stranger"); <a onClick="return mV(\'Hbr\',11,9);">Heb 11:9</a>). The corresponding noun for "sojourner" is paroikos (Sirach 29:26f (the King James Version "stranger"); <a onClick="return mV(\'Act\',7,6,26);">Ac 7:6,26</a>; <a onClick="return mV(\'Eph\',2,19);">Eph 2:19</a>; <a onClick="return mV(\'1Pe\',2,11);">1Pe 2:11</a>), with paroikia, "sojourning" (<span class="noTag">The Wisdom of Solomon 19:10</span>; Sirach 16:8; <a onClick="return mV(\'Act\',13,17);">Ac 13:17</a> (the King James Version "dwelling as strangers"); <a onClick="return mV(\'1Pe\',1,17);">1Pe 1:17</a>). In addition, epidemeo, "to be among people," is translated "to sojourn" in <a onClick="return mV(\'Act\',2,10);">Ac 2:10</a>; <a onClick="return mV(\'Act\',17,21);">17:21</a>, and its compound parepidemos, as "sojourner" in <a onClick="return mV(\'1Pe\',1,1);">1Pe 1:1</a> (in <a onClick="return mV(\'Hbr\',11,13);">Heb 11:13</a>; <a onClick="return mV(\'1Pe\',2,11);">1Pe 2:11</a>, "pilgrim").``48';
isbe[8449]='Stranger and Sojourner (In the Old Testament)`stranj\'-er:<P><b>I. THE GER</b><P class="in15">1. Legal provisions<P class="in30">(1) Principles<P class="in30">(2) Rules<P class="in15">2. Relation to Sacrifice and Ritual<P class="in15">3. Historical Circumstances<P><b>II. THE TOSHABH</b><P><b>III. THE NOKHRI OR BEN NEKHAR</b><P class="in15">1. Marriage<P class="in15">2. Exclusion of Some Races from the Assembly<P><b>IV. THE ZAR</b><P class="in15">Four different Hebrew words must be considered separately:<P class="in30">(1) ger, the American Standard Revised Version "sojourner" or "stranger";<P class="in30">(2) toshabh, the American Standard Revised Version "sojourner";<P class="in30">(3) nokhri, ben nekhar, the American Standard Revised Version "foreigner";<P class="in30">(4) zar, the American Standard Revised Version "stranger."<hr /><P>I. The Ger.<P>This word with its kindred verb is applied with slightly varying meanings to anyone who resides in a country or a town of which he is not a full native land-owning citizen; e.g., the word is used of the patriarchs in Palestine, the Israelites in Egypt, the Levites dwelling among the Israelites (<a onClick="return mV(\'Deu\',18,6);">De 18:6</a>; <a onClick="return mV(\'Jdg\',17,7);">Jud 17:7</a>, etc.), the Ephraimite in Gibeah (<a onClick="return mV(\'Jdg\',19,16);">Jud 19:16</a>). It is also particularly used of free aliens residing among the Israelites, and it is with the position of such that this article deals. This position is absolutely unparalleled in early legal systems (A. H. Post, Grundriss der ethnologischen Jurisprudenz, I, 448, note 3), which are usually far from favorable to strangers.<P>1. Legal Provisions:<P>(1) Principles.<P>The dominant principles of the legislation are most succinctly given in two passages: He "loveth the ger in giving him food and raiment" (<a onClick="return mV(\'Deu\',10,18);">De 10:18</a>); "And if a ger sojourn with thee (variant "you") in your land, ye shall not do him wrong. The ger that sojourneth with you shall be unto you as the home-born among you, and thou shalt love him as thyself; for ye were gerim in the land of Egypt" (<a onClick="return mV(\'Lev\',19,33);">Le 19:33</a>f). This treatment of the stranger is based partly on historic recollection, partly on the duty of the Israelite to his God. Because the ger would be at a natural disadvantage through his alienage, he becomes one of the favorites of a legislation that gives special protection to the weak and helpless.<P>(2) Rules.<P>In nationality the freeman followed his father, so that the son of a ger and an Israelitess was himself a ger (<a onClick="return mV(\'Lev\',24,\'10-22\');">Le 24:10-22</a>). Special care was to be taken to do him no judicial wrong (<a onClick="return mV(\'Deu\',1,16);">De 1:16</a>; <a onClick="return mV(\'Deu\',27,19);">27:19</a>). In what may roughly be called criminal law it was enacted that the same rules should apply to gerim as to natives (<a onClick="return mV(\'Lev\',18,26);">Le 18:26</a>, which is due to the conception that certain abominations defile a land; <a onClick="return mV(\'Lev\',20,2);">Le 20:2</a>, where the motive is also religious; <a onClick="return mV(\'Lev\',24,\'10-22\');">Le 24:10-22</a>; see SBL, 84ff; <a onClick="return mV(\'Num\',35,15);">Nu 35:15</a>). A free Israelite who became his slave was subject to redemption by a relative at any time on payment of the fair price (<a onClick="return mV(\'Lev\',25,47);">Le 25:47</a>). This passage and <a onClick="return mV(\'Deu\',28,43);">De 28:43</a> contemplate the possibility of a stranger\'s becoming wealthy, but by far the greater number of the legal provisions regard him as probably poor. Thus provision is made for him to participate in tithes (<a onClick="return mV(\'Deu\',14,29);">De 14:29</a>; <a onClick="return mV(\'Deu\',26,12);">26:12</a>), gleanings of various sorts and forgotten sheaves (<a onClick="return mV(\'Lev\',19,10);">Le 19:10</a>; <a onClick="return mV(\'Lev\',23,22);">23:22</a>; <a onClick="return mV(\'Deu\',24,19,20,21);">De 24:19,20,21</a>), and poor hired servants were not to be oppressed (<a onClick="return mV(\'Deu\',24,14);">De 24:14</a>).<P>2. Relation to Sacrifice and Ritual:<P>Nearly all the main holy days apply to the ger. He was to rest on the Sabbath (<a onClick="return mV(\'Exd\',20,10);">Ex 20:10</a>; <a onClick="return mV(\'Exd\',23,12);">23:12</a>, etc.), to rejoice on Weeks and Tabernacles (<a onClick="return mV(\'Deu\',16,\'1-\;);">De 16</a>), to observe the Day of Atonement (<a onClick="return mV(\'Lev\',16,29);">Le 16:29</a>), to have no leaven on the Festival of Unleavened Bread (<a onClick="return mV(\'Exd\',12,19);">Ex 12:19</a>). But he could not keep the Passover unless he underwent circumcision (<a onClick="return mV(\'Exd\',12,48);">Ex 12:48</a>). He could not eat blood at any rate during the wilderness period (<a onClick="return mV(\'Lev\',17,\'10-12\');">Le 17:10-12</a>), and for that period, but not thereafter, he was probihited from eating that which died of itself (<a onClick="return mV(\'Lev\',17,15);">Le 17:15</a>; <a onClick="return mV(\'Deu\',14,21);">De 14:21</a>) under pain of being unclean until the even. He could offer sacrifices (<a onClick="return mV(\'Lev\',17,8);">Le 17:8</a>f; <a onClick="return mV(\'Lev\',22,18);">22:18</a>; <a onClick="return mV(\'Num\',15,14);">Nu 15:14</a>f), and was subject to the same rules as a native for unwitting sins (<a onClick="return mV(\'Num\',15,\'22-31\');">Nu 15:22-31</a>), and for purification for uncleanness by reason of contact with a dead body (<a onClick="return mV(\'Num\',19,\'10-13\');">Nu 19:10-13</a>).<P>3. Historical Circumstances:<P>The historical circumstances were such as to render the position of the resident alien important from the first. A "mixed multitude" went up with the Israelites from Egypt, and after the conquest we find Israelites and the races of Palestine living side by side throughout the country. We repeatedly read of resident aliens in the historical books, e.g. Uriah the Hittite. According to <a onClick="return mV(\'2Ch\',2,17);">2Ch 2:17f (Hebrew 16f)</a> there was a very large number of such in the days of Solomon, but the figure may be excessive. These seem to have been the remnant of the conquered tribes (<a onClick="return mV(\'1Ki\',9,20);">1Ki 9:20</a>f). Ezekiel in his vision assigned to gerim landed inheritance among the Israelites (47:22f). Hospitality to the ger was of course a religious duty and the host would go to any lengths to protect his guest (<a onClick="return mV(\'Gen\',19,1);">Ge 19</a>; <a onClick="return mV(\'Jdg\',19,24);">Jud 19:24</a>).<P>II. The Toshabh.<P>Of the toshabh we know very little. It is possible that the word is practically synonymous with ger, but perhaps it is used of less permanent sojourning. Thus in <a onClick="return mV(\'Lev\',22,10);">Le 22:10</a> it appears to cover anybody residing with a priest. A toshabh could not eat the Passover or the "holy" things of a priest (<a onClick="return mV(\'Exd\',12,45);">Ex 12:45</a>; <a onClick="return mV(\'Lev\',22,10);">Le 22:10</a>). His children could be purchased as perpetual slaves, and the law of the Jubilee did not apply to them as to Israelites (<a onClick="return mV(\'Lev\',25,45);">Le 25:45</a>). He is expressly mentioned in the law of homicide (<a onClick="return mV(\'Num\',35,15);">Nu 35:15</a>), but otherwise we have no information as to his legal position. Probably it was similar to that of the ger.<P>III. The Nokhri Ben Nekhar.<P>The nokhri or ben nekhar was a foreigner. The word is far wider than those considered above. It covers everything of alien or foreign character regardless of the place of residence. By circumcision a foreign slave could enter into the covenant with Abraham. Foreigners were of course excluded from the Passover (<a onClick="return mV(\'Exd\',12,43);">Ex 12:43</a>), but could offer sacrifices to Israel\'s God at the religious capital (<a onClick="return mV(\'Lev\',22,25);">Le 22:25</a>). The Israelite could exact interest of them (<a onClick="return mV(\'Deu\',23,20);">De 23:20</a>) and the payment of debts in cases where an Israelite debtor was protected by the release of <a onClick="return mV(\'Deu\',15,3);">De 15:3</a>. Moses forbade the appointment of a foreigner as a ruler (<a onClick="return mV(\'Deu\',17,15);">De 17:15</a>, in a law which according to Massoretic Text relates to a "king," but in the preferable text of Septuagint to a ruler generally). Later the worship of God by foreigners from a distance was contemplated and encouraged (<a onClick="return mV(\'1Ki\',8,\'41-43\');">1Ki 8:41-43</a>; <a onClick="return mV(\'Isa\',2,2);">Isa 2:2</a>f; <a onClick="return mV(\'Isa\',53,6);">56:3,6</a>f; etc.), while the case of Naaman shows that a foreigner might worship Him abroad (<a onClick="return mV(\'2Ki\',5,17);">2Ki 5:17</a>). A resident foreigner was of course a ger. The distinction between these three words is perhaps best seen in <a onClick="return mV(\'Exd\',12,43,45,48);">Ex 12:43,45,48</a>f. in the first of these verses we have ben nekhar, used to cover "alien" generally; in the last the ger is contemplated as likely to undergo a complete naturalization; while in <a onClick="return mV(\'Exd\',12,45);">12:45</a> the toshabh is regarded as certain to be outside the religious society.<P>1. Marriage:<P>In the earlier period marriages with foreigners are common, though disliked (e.g. <a onClick="return mV(\'Gen\',24,3);">Ge 24:3</a>; <a onClick="return mV(\'Gen\',27,46);">27:46</a>ff; <a onClick="return mV(\'Num\',12,1);">Nu 12:1</a>; <a onClick="return mV(\'Jdg\',14,3);">Jud 14:3</a>, etc.). The Law provides for some unions of this kind (<a onClick="return mV(\'Deu\',21,10);">De 21:10</a>; compare <a onClick="return mV(\'Num\',31,18);">Nu 31:18</a>), but later Judaism became more stringent. Moses required the high priest to marry a virgin of his own people (<a onClick="return mV(\'Lev\',21,14);">Le 21:14</a>); Ezekiel limited all descendants of Zadok to wives of the house of Israel (<a onClick="return mV(\'Eze\',44,22);">44:22</a>); Ezra and Nehemiah carried on a vigorous polemic against the intermarriage of any Jew with foreign women (<a onClick="return mV(\'Ezr\',10,\'1-\');">Ezr 10</a>; <a onClick="return mV(\'Neh\',13,\'23-31\');">Ne 13:23-31</a>).<P>2. Exclusion of Some Races from Assembly:<P>Deuteronomy further takes up a hostile attitude to Ammonites and Moabites, excluding them from the assembly of the Lord even to the tenth generation, while the children of the third generation of Edomites and Egyptians could enter it (<a onClick="return mV(\'Deu\',23,\'3-8\');">Deu 23:3-8 (Hebrew 4-9)</a>). From <a onClick="return mV(\'1Ki\',9,20,21,24);">1Ki 9:20,21,24</a>; <a onClick="return mV(\'1Ch\',22,2);">1Ch 22:2</a> we learn of the existence of foreign quarters in Israel.<P>IV. The Zar.<P>The remaining word zar means "stranger" and takes its coloring from the context. It may mean "stranger in blood," e.g. non-Aaronite (<a onClick="return mV(\'Num\',16,40);">Nu 16:40 (Heb 17:5)</a>), or non-Levite (e.g. <a onClick="return mV(\'Num\',1,51);">Nu 1:51</a>), or a non-member of some other defined family (<a onClick="return mV(\'Deu\',25,5);">De 25:5</a>). In opposition to priest it means "lay" (<a onClick="return mV(\'Lev\',22,\'10-13\');">Le 22:10-13</a>), and when the contrast is with holy, it denotes "profane" (<a onClick="return mV(\'Exd\',30,9);">Ex 30:9</a>).`<a href="./study/isbe/search.html?string=FOREIGNER">FOREIGNER</a>; <a href="./study/isbe/search.html?string=GENTILES">GENTILES</a>; <a href="./study/isbe/search.html?string=PROSELYTE">PROSELYTE</a>; <a href="./study/isbe/search.html?string=CHERETHITES">CHERETHITES</a>; <a href="./study/isbe/search.html?string=PELETHITES">PELETHITES</a>; <a href="./study/isbe/search.html?string=MARRIAGE">MARRIAGE</a>; <a href="./study/isbe/search.html?string=COMMERCE">COMMERCE</a>`193';
isbe[8450]='Strangled`stran\'-g\'-ld (chanaq; pniktos, from verb pnigo, "to choke," "to smother," "to strangle" (compare choking of swine in the lake, <a onClick="return mV(\'Mar\',5,13);">Mr 5:13</a>; the seed are choked by the thorns, <a onClick="return mV(\'Mat\',13,7);">Mt 13:7</a>; the servant takes his fellow-servant by the throat, the King James Version <a onClick="return mV(\'Mat\',18,28);">Mt 18:28</a>)): As adjective "strangled," used of animals deprived of life by choking, and so without the shedding of the blood. Flesh thus killed was forbidden as food among the Hebrews, because it contained the blood (<a onClick="return mV(\'Lev\',17,12);">Le 17:12</a>). Even Jewish Christians in the Jerusalem council thought it best to forbid things strangled to be eaten by Gentile converts, so as not to give offense to Jewish sentiment, and doubtless also to prevent participation in heathen sacrificial feasts (<a onClick="return mV(\'Act\',15,20);">Ac 15:20</a>; <a onClick="return mV(\'Act\',21,25);">21:25</a>).``137';
isbe[8451]='Strangling`stran\'-g\'-ling.`<a href="./study/isbe/search.html?string=PUNISHMENTS">PUNISHMENTS</a>`1';
isbe[8452]='Straw; Stubble`stro, stub\'-\'-l: The cognates of Hebrew tebhen, "straw" and qash, "stubble," have been retained in the modern Arabic terms tibn and qashsh. Tibn applies to the straw which has been cut up into short pieces and more or less split by the threshing operations. It is commonly used throughout the East as a coarse fodder or roughage for domestic herbivorous animals (compare <a onClick="return mV(\'Gen\',24,25,32);">Ge 24:25,32</a>; <a onClick="return mV(\'Jdg\',19,19);">Jud 19:19</a>; <a onClick="return mV(\'1Ki\',4,28);">1Ki 4:28</a>; <a onClick="return mV(\'Isa\',11,7);">Isa 11:7</a>; <a onClick="return mV(\'Isa\',65,25);">65:25</a>). Hay and similar cured crops are practically unknown. Barley, peas and other grain, when fed to animals, are mixed with the tibn. The animals will frequently reject the tibn unless there is grain in it. They often nose about the tibn until the grain settles to the bottom so that they can eat the latter without the straw. Straw left in the manger is thrown out in the stall to form part of the bedding (compare <a onClick="return mV(\'Isa\',25,10);">Isa 25:10</a>).<P>Tibn is mixed with clay for plastering walls or for making sun-dried bricks. It is also mixed with lime and sand for plastering. The children of Israel had their task of brickmaking made more arduous by being required to gather stubble and prepare it by chopping it up instead of being given the already prepared straw of the threshing-floors (<a onClick="return mV(\'Exd\',5,7);">Ex 5:7</a>).<P>Qashsh (literally, "dried up") refers to the stalks left standing in the wheat fields or to any dried-up stalks or stems such as are gathered for burning. Camels and other flocks sometimes supplement their regular meals by grazing on the stubble, otherwise it has no use. In the Bible stubble is used to typify worthless inflammable material (<a onClick="return mV(\'Exd\',15,7);">Ex 15:7</a>; <a onClick="return mV(\'Job\',13,25);">Job 13:25</a>; <a onClick="return mV(\'Job\',41,28,29);">41:28,29</a>; <a onClick="return mV(\'Psa\',83,13);">Ps 83:13</a>; <a onClick="return mV(\'Isa\',5,24);">Isa 5:24</a>, etc.; <a onClick="return mV(\'1Cr\',3,12);">1Co 3:12</a>, kalame).<P>mathben, is translated "straw" in <a onClick="return mV(\'Isa\',25,10);">Isa 25:10</a>.``133';
isbe[8453]='Strawed`strod: Past participle of "to strew," "scatter," or "spread about," as powder (of the golden calf, <a onClick="return mV(\'Exd\',32,20);">Ex 32:20</a>, the Revised Version (British and American) "strewed"); branches (<a onClick="return mV(\'Mat\',21,8);">Mt 21:8</a>, the Revised Version (British and American) "spread"); seed (<a onClick="return mV(\'Mat\',25,24,26);">Mt 25:24,26</a>, the Revised Version (British and American) "scatter").``1';
isbe[8454]='Stream`strem:<P>(1) nachal, English Versions of the Bible "stream," as: "Behold, he smote the rock, so that waters gushed out, and streams overflowed" (<a onClick="return mV(\'Psa\',78,20);">Ps 78:20</a>). Often "valley," as "the valley (the King James Version "river") of the Arnon" (<a onClick="return mV(\'Deu\',2,24);">De 2:24</a>); or "brook," as "the brook (the King James Version "river") of Egypt" (<a onClick="return mV(\'Jos\',15,4);">Jos 15:4</a>; see <a href="./study/isbe/search.html?string=BROOK">BROOK</a> or <a href="./study/isbe/search.html?string=EGYPT">EGYPT</A>); or "river," as "the river Kishon" (<a onClick="return mV(\'Jdg\',4,7);">Jud 4:7</a>).<P>(2) nahar (Aramaic nehar (<a onClick="return mV(\'Dan\',7,10);">Da 7:10</a>); compare Arabic nahr, "river"): "He bindeth the streams," the King James Version "floods" (<a onClick="return mV(\'Job\',28,11);">Job 28:11</a>); "the River" (Euphrates) (<a onClick="return mV(\'Exd\',23,31);">Ex 23:31</a>, etc.); "Abanah and Pharpar, the rivers of Damascus" (<a onClick="return mV(\'2Ki\',5,12);">2Ki 5:12</a>).<P>(3) pelegh, the root palagh, "to split," "to divide," hence, "cleft," "channel": "a tree planted by the streams (the King James Version "rivers") of water" (<a onClick="return mV(\'Psa\',1,3);">Ps 1:3</a>); "There is a river, the streams whereof make glad the city of God" (<a onClick="return mV(\'Psa\',46,4);">Ps 46:4</a>); but: "The king\'s heart is...as the watercourses" (the King James Version "rivers of water") (<a onClick="return mV(\'Pro\',21,1);">Pr 21:1</a>).<P>(4) \'aphiq, the root \'aphaq, "to be strong," hence, "channel," "valley," as holding, confining (BDB): "the streams in the south" (<a onClick="return mV(\'Psa\',126,4);">Ps 126:4</a>); elsewhere "brook," as "the brooks (the King James Version "rivers") of Judah" (<a onClick="return mV(\'Joe\',3,18);">Joe 3:18</a>); or "channel," as "the channel of brooks" (<a onClick="return mV(\'Job\',6,15);">Job 6:15</a>); or "watercourses" (the Revised Version margin "ravines," the King James Version "rivers") (<a onClick="return mV(\'Eze\',6,3);">Eze 6:3</a>, etc.).<P>(5) ye\'or, from Egyptian \'iotr, \'io\'r, especially of the Nile, as: "Seven other kine came up after them out of the river" (<a onClick="return mV(\'Gen\',41,3);">Ge 41:3</a>); the Revised Version (British and American) "stream," the King James Version "river" (<a onClick="return mV(\'Exd\',7,19);">Ex 7:19</a>; <a onClick="return mV(\'Exd\',8,5);">8:5</a>); the Revised Version (British and American) "stream," the King James Version "brook"; "The streams (margin "canals") of Egypt shall be diminished and dried up" (<a onClick="return mV(\'Isa\',19,6);">Isa 19:6</a>).<P>(6) yabhal, the root yabhal, "to bear along": "brooks and streams of waters" (<a onClick="return mV(\'Isa\',30,25);">Isa 30:25</a>); compare yabhal, "river," "that spreadeth out its roots by the river" (<a onClick="return mV(\'Jer\',17,8);">Jer 17:8</a>); \'ubhal, "the river Ulai" (<a onClick="return mV(\'Dan\',8,2);">Da 8:2</a>).<P>(7) nazal, "to flow," "to trickle": "He brought streams also out of the rock" (<a onClick="return mV(\'Psa\',78,16);">Ps 78:16</a>).<P>(8) \'eshedh, "the slope of the valleys," the King James Version "the stream of the brooks" (<a onClick="return mV(\'Num\',21,15);">Nu 21:15</a>); compare \'ashedhoth, "the slopes" (<a onClick="return mV(\'Jos\',10,40);">Jos 10:40</a>); "the slopes (margin "springs") of Pisgah" (<a onClick="return mV(\'Deu\',3,17);">De 3:17</a>).<P>(9) potamos, "The stream brake against that house" (<a onClick="return mV(\'Luk\',6,48,19);">Lu 6:48,49</a>); elsewhere "river," as "the river Jordan" (<a onClick="return mV(\'Mar\',1,5);">Mr 1:5</a>).<P>(10) kludon, "stream," the King James Version <span class="noTag">The Wisdom of Solomon 19:7</a> (the Revised Version (British and American) "surge").`<a href="./study/isbe/search.html?string=BROOK">BROOK</a>; <a href="./study/isbe/search.html?string=CANALS">CANALS</a>; <a href="./study/isbe/search.html?string=CHANNEL">CHANNEL</a>; <a href="./study/isbe/search.html?string=RIVER">RIVER</a>; <a href="./study/isbe/search.html?string=VALE">VALE</a>; <a href="./study/isbe/search.html?string=WATERCOURSE">WATERCOURSE</a>`37';
isbe[8455]='Street`stret.`<a href="./study/isbe/search.html?string=CITY">CITY</a>`1';
isbe[8456]='Strength, of Israel`strength: For "the strength of the children of Israel," applied to Yahweh in the King James Version <a onClick="return mV(\'Joe\',3,16);">Joe 3:16</a>, the Revised Version (British and American) reads "a stronghold to the children of Israel."``1';
isbe[8457]='Strike`strik: The verbs "to strike" and "to stroke" (latter not in English Versions) have the same derivation, and originally "strike" was the intrans, "stroke" the transitive form. "Strike" however, became used in both senses (always transitive in English Versions of the Bible), while "to stroke" took on the meaning "to, rub gently." But in the King James Version this last force still belonged sometimes to "strike" and is so found in <a onClick="return mV(\'2Ki\',5,11);">2Ki 5:11</a>, "strike his hand over the place" (the Revised Version (British and American) "wave"), and perhaps <a onClick="return mV(\'Exd\',12,7,22);">Ex 12:7,22</a>; Tobit 11:11 Otherwise AV\'s uses of the simple "strike" are modern, including "strike sail" (<a onClick="return mV(\'Act\',27,17);">Ac 27:17</a>; here and in Tob 11:11 with an archaic preterite "strake," elsewhere "struck"). The Revised Version\'s "They lowered the gear" is a more precise translation, not a modernizing of the King James Version\'s English. The combination "to strike through," however, is not modern English, and was used by the King James Version as meaning either "to pierce" (<a onClick="return mV(\'Jdg\',5,26);">Jud 5:26</a>; <a onClick="return mV(\'Job\',20,24);">Job 20:24</a>; <a onClick="return mV(\'Pro\',7,23);">Pr 7:23</a>; <a onClick="return mV(\'Lam\',4,9);">La 4:9</a>), or, as an intensive, "to strike violently," "to crush" (<a onClick="return mV(\'Psa\',110,5);">Ps 110:5</a>). The Revised Version (British and American) has attempted to distinguish only in <a onClick="return mV(\'Hab\',3,14);">Hab 3:14</a>, "pierce," margin "smite." "Striking hands" is a common custom at the conclusion of a bargain (Additions to Esther 14:8), but in <a onClick="return mV(\'Job\',17,3);">Job 17:3</a>; <a onClick="return mV(\'Pro\',6,1);">Pr 6:1</a>; <a onClick="return mV(\'Pro\',17,18);">17:18</a>; <a onClick="return mV(\'Pro\',22,26);">22:26</a>; the Revised Version margin <a onClick="return mV(\'Pro\',11,15);">11:15</A>, the ceremony is used technically for an agreement to be surety for another. Striking (the Revised Version margin "firing") stones to produce a fire is mentioned (2Macc 10:3).<P>The past participle of "strike" is stricken (modern English "struck") (compare <a onClick="return mV(\'Pro\',23,35);">Pr 23:35</a>; <a onClick="return mV(\'Jer\',5,3);">Jer 5:3</a>; <a onClick="return mV(\'Lam\',4,9);">La 4:9</a>). So <a onClick="return mV(\'Isa\',1,5);">Isa 1:5</a>, "Why will ye be still stricken?" is equivalent to "Why should ye receive any more blows?" (compare <a onClick="return mV(\'Isa\',16,7);">16:7</a>; <a onClick="return mV(\'Isa\',53,4,8);">53:4,8</a> margin). But in the phrase "stricken in age" (<a onClick="return mV(\'Gen\',18,11);">Ge 18:11</a>, etc.) "strike" has an older meaning, "advance."<P>Striker is found in <a onClick="return mV(\'1Ti\',3,3);">1Ti 3:3</a>; <a onClick="return mV(\'Tts\',1,7);">Tit 1:7</a> as a literal translation of plektes. A hot-tempered man, prone to physical outbursts, is meant. A stroke is simply a"blow," but in <a onClick="return mV(\'Deu\',17,8);">De 17:8</a>; <a onClick="return mV(\'Deu\',21,5);">21:5</a>, "stroke" is used technically for "assault."``48';
isbe[8458]='Stringed, Instruments`stringd.`<a href="./study/isbe/search.html?string=MUSIC">MUSIC</a>`1';
isbe[8459]='Stripes`strips.`<a href="./study/isbe/search.html?string=PUNISHMENTS">PUNISHMENTS</a>`1';
isbe[8460]='Strive`striv.`<a href="./study/isbe/search.html?string=GAMES">GAMES</a>`1';
isbe[8461]='Stronghold`strong\'-hold.`<a href="./study/isbe/search.html?string=FORTIFIED+CITIES">FORTIFIED CITIES</a>`1';
isbe[8462]='Stubble`stub\'-\'-l (qash (<a onClick="return mV(\'Exd\',5,12);">Ex 5:12</a>, etc.); kalame (The <span class="noTag">Wisdom of Solomon 3:7</span>; <a onClick="return mV(\'1Cr\',3,12);">1Co 3:12</a>)): These Hebrew and Greek forms are used of the stalks of wheat, etc., left knee-high in the field by the reapers. tebhen (<a onClick="return mV(\'Job\',21,18);">Job 21:18</a>), is a mixture of chopped straw and chaff produced in threshing, which is winnowed out by the fan (compare <a onClick="return mV(\'Jer\',23,28);">Jer 23:28</a>; <a onClick="return mV(\'Isa\',5,24);">Isa 5:24</a>; <a onClick="return mV(\'Mat\',3,12);">Mt 3:12</a>). When tebhen was withheld from them the Israelites had to utilize qash for the manufacture of their bricks (<a onClick="return mV(\'Exd\',5,12);">Ex 5:12</a>).``1';
isbe[8463]='Studs`studz (nequddoth, "engraving," "stud"): Ornaments consisting of small silver points which it was proposed (<a onClick="return mV(\'Sgs\',1,11);">So 1:11</a>) to affix to the new golden "plaits" (the Revised Version) or "borders" (the King James Version), and which were to replace the strung beads of the bride\'s necklace.``1';
isbe[8464]='Stuff`stuf (keli; skeuos): "Material" for any purpose (<a onClick="return mV(\'Eze\',12,3,4,7);">Eze 12:3,4,7</a>); or "supplies" in a more general sense (<a onClick="return mV(\'Exd\',36,7);">Ex 36:7</a>, Hebrew mela\'-khah; compare the King James Version, the English Revised Version <a onClick="return mV(\'1Sa\',10,22);">1Sa 10:22</a>; <a onClick="return mV(\'1Sa\',25,13);">25:13</a>; <a onClick="return mV(\'1Sa\',30,24);">30:24</a> (the American Standard Revised Version substitutes "baggage")); frequently, "household possessions" (<a onClick="return mV(\'Gen\',31,37);">Ge 31:37</a>; <a onClick="return mV(\'Gen\',45,20);">45:20</a>; <a onClick="return mV(\'Exd\',22,7);">Ex 22:7</a>; <a onClick="return mV(\'Jos\',7,11);">Jos 7:11</a>; <a onClick="return mV(\'Neh\',13,8);">Ne 13:8</a>; Jdt 16:19; the King James Version Judith 15:11 (skeuasmata, the Revised Version (British and American) "furniture"); the King James Version <a onClick="return mV(\'Luk\',17,31);">Lu 17:31</a>, where the Revised Version (British and American) reads "goods"). "Mingled stuff" is the translation of sha\'atnez in the Revised Version (British and American) instead of "garment of divers sorts" the King James Version (<a onClick="return mV(\'Deu\',22,11);">De 22:11</a>).``1';
isbe[8465]='Stumbling-Block; Stumbling-Stone`stum\'-bling-blok, (mikhshol, makhshelah; proskomma, skandalon): These are the most important of the varied renderings of either of two cognate Hebrew words, or of two different Greek words. Sometimes the Greek word for "stone" (lithos) accompanies the principal word. There is no important difference in the meaning of the words or of their renderings. the Revised Version (British and American) generally substitutes "stumbling" for "offence" of the King James Version.<P>The literal meaning of the Hebrew words—an object which causes one to stumble or fall—appears in such passages as <a onClick="return mV(\'Lev\',19,14);">Le 19:14</a>: "Thou shalt not...put a stumblingblock (mikhshol) before the blind" (compare <a onClick="return mV(\'Jer\',6,21);">Jer 6:21</a>). But the expression is ordinarily figurative, referring to that which causes material ruin or spiritual downfall, which were closely connected in Old Testament thought (<a onClick="return mV(\'Psa\',119,165);">Ps 119:165</a>; <a onClick="return mV(\'Eze\',21,15);">Eze 21:15</a>). The things that lead astray are silver and gold (<a onClick="return mV(\'Eze\',7,19);">Eze 7:19</a>); idols (<a onClick="return mV(\'Eze\',14,3);">Eze 14:3</a>; <a onClick="return mV(\'Zep\',1,3);">Ze 1:3</a>, etc.).<P>One of the New Testament words, skandalon, literally means the stick of a trap to which the bait is attached, and which when touched springs the trap. Figuratively either word refers to a thing or a person that leads one to fall into error, into sin or into destruction: the cross of Christ (<a onClick="return mV(\'Gal\',5,11);">Ga 5:11</a>; <a onClick="return mV(\'Rom\',11,9);">Ro 11:9</a>); another\'s liberty (<a onClick="return mV(\'1Cr\',8,9);">1Co 8:9</a>); Peter in <a onClick="return mV(\'Mat\',16,23);">Mt 16:23</a>; Christ, whose life and character were so different from Jewish expectation (<a onClick="return mV(\'Rom\',9,33);">Ro 9:33</a>).`<a href="./study/isbe/search.html?string=OFFENCE">OFFENCE</a>`76';
isbe[8466]='Sua`su\'-a (Soua; the King James Version, Sud): Name of a family of temple-servants who went up from exile with Zerubbabel (1Esdras 5:29) = "Sia" of <a onClick="return mV(\'Neh\',7,47);">Ne 7:47</a>; "Siaha" of <a onClick="return mV(\'Ezr\',2,44);">Ezr 2:44</a>.``1';
isbe[8467]='Suah`su\'-a (cuach): Son of Zophah, of the tribe of Asher (<a onClick="return mV(\'1Ch\',7,36);">1Ch 7:36</a>).``1';
isbe[8468]='Sub-Apostolic Literature``<a href="./study/isbe/search.html?string=LITERATURE+SUB+APOSTOLIC">LITERATURE, SUB-APOSTOLIC</a>`1';
isbe[8469]='Subai`su\'-ba-i, su\'-bi (Subaei): Name of a family of temple-servants who returned with Zerubbabel (1Esdras 5:30) = "Shamlai" of <a onClick="return mV(\'Ezr\',2,46);">Ezr 2:46</a>; "Salmai" of <a onClick="return mV(\'Neh\',7,48);">Ne 7:48</a>.``1';
isbe[8470]='Subas`su\'-bas (Soubas; the King James Version, Suba): Name of a family of "the sons of the servants of Solomon" returning with Zerubbabel (1Esdras 5:34), wanting in the parallel lists of <a onClick="return mV(\'Ezr\',2,57);">Ezr 2:57</a>; <a onClick="return mV(\'Neh\',7,59);">Ne 7:59</a>.``1';
isbe[8471]='Suborn`sub-orn\' (hupoballo (<a onClick="return mV(\'Act\',6,11);">Ac 6:11</a>; only here in the New Testament)): The word means to introduce by collusion, to put one person in the place of another, to employ anyone in a secret manner and instruct such a one to act for and as though he were another person.``1';
isbe[8472]='Substance`sub\'-stans (rekhush; hupostasis): Lit. that which stands under, is in the Bible used chiefly of material goods and possessions. In the Old Testament it is the translation of numerous Hebrew words, of which rekhush, "that which is gathered together," is one of the earliest and most significant (<a onClick="return mV(\'Gen\',12,5);">Ge 12:5</a>; <a onClick="return mV(\'Gen\',13,6);">13:6</a>; <a onClick="return mV(\'Gen\',15,14);">15:14</a>; <a onClick="return mV(\'1Ch\',27,31);">1Ch 27:31</a>; <a onClick="return mV(\'Ezr\',8,21);">Ezr 8:21</a>, etc.). In the New Testament "substance" appears in a few passages as the translation of ousia, "being," "subsistence" (<a onClick="return mV(\'Luk\',15,13);">Lu 15:13</a>), huparxis, "goods," "property" (<a onClick="return mV(\'Hbr\',10,34);">Heb 10:34</a>), huparchonta, "things at hand" (<a onClick="return mV(\'Luk\',8,3);">Lu 8:3</a>). Special interest attaches to <a onClick="return mV(\'Hbr\',11,1);">Heb 11:1</a>, the King James Version "Now faith is the substance of things hoped for," etc., where the word is used in its proper etymological sense as the translation of hupostasis, "that which stands under." the Revised Version (British and American) changes to "assurance," margin "the giving substance to," which last seems best to bring out the idea of faith as that which makes the things hoped for real to the soul. The same Greek word hupostasis is rendered "substance" in <a onClick="return mV(\'Hbr\',1,3);">Heb 1:3</a> the Revised Version (British and American), instead of the King James Version "person," with reference to Christ, "the very image (margin "impress") of his substance," i.e. of God\'s invisible essence or being, the manifestation of God Himself.``185';
isbe[8473]='Subtil; Subtle; Subtlety; Subtilty`sub\'-til, sut\'-\'-l, sut\'-\'-l-ti (chakham, nakhal, mirmah; dolos): These words are used<P>(1) in a good sense: <a onClick="return mV(\'2Sa\',13,3);">2Sa 13:3</a>, chakham, "wise," "Jonadab was a very subtle (the American Standard Revised Version "subtle") man" (discreet); <a onClick="return mV(\'Pro\',1,4);">Pr 1:4</a>, \'ormah, "prudence," "to give subtlety to the simple," the American Standard Revised Version and the English Revised Version margin "prudence"; <span class="noTag">The Wisdom of Solomon 7:22</span>, leptos, "thin," said of the spirit in Wisdom (very fine or refined); 8:8, strophe, "winding," "subtilties of speeches"; Ecclesiasticus 39:2, "subtil parables," the Revised Version (British and American) "the subtleties of parables";<P>(2) in a bad sense: <a onClick="return mV(\'Gen\',3,1);">Ge 3:1</a>, \'arum, "crafty," "Now the serpent was more subtle than any beast of the field," the American Standard Revised Version "subtle."<P><a onClick="return mV(\'Gen\',27,35);">Ge 27:35</a>, mirmah, "deceit," "fraud," "Thy brother came with subtlety," the Revised Version (British and American) "with guile"; <a onClick="return mV(\'Psa\',105,25);">Ps 105:25</a>, nakhal, "to deceive," the King James Version "deal subtlely," the American Standard Revised Version "subtly"; <a onClick="return mV(\'Pro\',7,10);">Pr 7:10</a>, natsar, "to watch," "guard," "to be hidden or subtle of heart," the Revised Version (British and American) "wily," margin "\' close,\' Hebrew \'guarded\'";<a onClick="return mV(\'2Ki\',10,19);">2Ki 10:19</a>, \'oqebhah, "deceit" or "treachery" (here only); Judith 5:11, katasophizo, "to use subtlety"; Ecclesiasticus 19:25, panourgia, "cunning," "unscrupulousness," "There is an exquisite subtlety, and the same is unjust"; <a onClick="return mV(\'2Cr\',11,3);">2Co 11:3</a>, "The serpent beguiled Eve through his subtlety," the Revised Version (British and American) "in his craftiness"; <a onClick="return mV(\'Mat\',26,4);">Mt 26:4</a>, dolos, "deceit," "that they might take Jesus by subtlety, and kill him"; <a onClick="return mV(\'Act\',13,10);">Ac 13:10</a>, "O full of all subtlety and all mischief," the Revised Version (British and American) "all guile and all villany."<P>English Revised Version has "subtilty" for "wisdom" (<a onClick="return mV(\'Pro\',8,5,12);">Pr 8:5,12</a>), margin and the American Standard Revised Version, "prudence"; for "with subtlety" (the English Revised Version <a onClick="return mV(\'Mar\',14,1);">Mr 14:1</a>, the King James Version "by craft") the American Standard Revised Version has "with subtlety."``185';
isbe[8474]='Suburbs`sub\'-urbz.`<a href="./study/isbe/search.html?string=CITY">CITY</a>`1';
isbe[8475]='Subvert`sub-vurt\' (\'awath; anatrepo): Occurs 5 t:<P>(1) in the sense of overturning, etc., as the translation of \'awath, "to make bent or crooked" (<a onClick="return mV(\'Lam\',3,36);">La 3:36</a>), "to subvert a man in his cause"; of anaskeudzo, primarily, "to pack up baggage"; then, "to ravage," etc. (<a onClick="return mV(\'Act\',15,24);">Ac 15:24</a>, "subverting your souls"); of anatrepo, "to turn upside down," "to overturn" (<a onClick="return mV(\'Tts\',1,11);">Tit 1:11</a>, "who subvert whole houses," the Revised Version (British and American) "overthrow"); of katastrophe, "overthrow," "destruction" (<a onClick="return mV(\'2Ti\',2,14);">2Ti 2:14</a>, "to the subverting of them that hear");<P>(2) in the sense of perverting: ekstrepho, "to turn or twist out" "to turn about" (<a onClick="return mV(\'Tts\',3,11);">Tit 3:11</a>, "such is subverted," the Revised Version (British and American) "perverted"). For "overthrown me" (<a onClick="return mV(\'Job\',19,6);">Job 19:6</a>) the Revised Version (British and American) has "subverted me (in my cause)," margin "overthrown me"; for "perverteth" (<a onClick="return mV(\'Pro\',19,3);">Pr 19:3</a>), "subverteth."``185';
isbe[8476]='Sucathites`su\'kath-its (sukhathim; Codex Vaticanus Sochathieim; Codex Alexandrinus Sokathieim; the King James Version Suchathites): These are named only once (<a onClick="return mV(\'1Ch\',2,55);">1Ch 2:55</a>), a family of scribes living at Jabez.``1';
isbe[8477]='Succeed; Success`suk-sed\', suk-ses\' (yarash, sakhal; euemeria): "To succeed" means,<P>(1) and originally, "to follow after";<P>(2) mostly in modern English, "to prosper"; in the King James Version, with one exception, the word has a qualifying adjective.<P>(1) In the first sense it is the translation of yarash, "to seize" or "to take possession" (<a onClick="return mV(\'Deu\',2,12);">De 2:12</a>; <a onClick="return mV(\'Deu\',12,29);">12:29</a>, the American Standard Revised Version "dispossessest," the English Revised Version "possessest"); of qum, "to rise up" (<a onClick="return mV(\'Deu\',25,6);">De 25:6</a>, "shall succeed in the name of his brother"); of diadechomai (Ecclesiasticus 48:8, "prophets to succeed after him").<P>(2) In the sense of prospering, "success" is the translation of sakhal, "to be wise," "to prosper" (<a onClick="return mV(\'Jos\',1,8);">Jos 1:8</a>, "Thou shalt have good success," the King James Version margin "do wisely," the Revised Version margin "deal wisely"; compare the King James Version margin <a onClick="return mV(\'Job\',22,2);">Job 22:2</a>; <a onClick="return mV(\'Psa\',111,10);">Ps 111:10</a>; <a onClick="return mV(\'Pro\',3,4);">Pr 3:4</a>); "good success" occurs in Tobit 7:12, euodosei ta kallista; <span class="noTag">The Wisdom of Solomon 13:19</span>, epituchia; Ecclesiasticus 20:9, euodia, the Revised Version (British and American) "prosperity," "There is a prosperity that a man findeth in misfortunes; and there is a gain that turneth to loss"; Ecclesiasticus 38:13, euodia (so Codex Sinaiticus and Codex Ephraemi—this word = "sweet savior," "fragrance"; compare <a onClick="return mV(\'Phl\',4,18);">Php 4:18</a>; <a onClick="return mV(\'Eph\',5,2);">Eph 5:2</a>; <a onClick="return mV(\'2Cr\',2,15);">2Co 2:15</a>). See further <a href="./study/isbe/search.html?string=EUODIA">EUODIA</A>. the Revised Version (British and American) "the issue for good" 1Macc 4:55, euodoo; 8:23, kalos, etc. "Success," simply (as "prosperity," euemeria), 2Macc 10:28, "a pledge of success and victory"; "successor" occurs (Ecclesiasticus 46:1, "Joshua...was the successor diadochos of Moses"; 2Macc 9:23; 14:26).``185';
isbe[8478]='Succor; Succorer`suk\'-er, suk\'-er-er (\'azar; boetheo, prostatis): Is the translation of \'azar, "to gird" (<a onClick="return mV(\'2Sa\',8,5);">2Sa 8:5</a>, etc.); of boetheo, "to come in aid of" (<a onClick="return mV(\'2Cr\',6,2);">2Co 6:2</a>, "In a day of salvation did I succor thee"; <a onClick="return mV(\'Hbr\',2,18);">Heb 2:18</a>, "He is able to succor them that are tempted"); of prostatis, "one standing before" (<a onClick="return mV(\'Rom\',16,2);">Ro 16:2</a>, the American Standard Revised Version "helper of many"); of antilepsis (Ecclesiasticus 51:7, the King James Version "I looked for the succour of men, but there was none"); of phugadeuterion (1Macc 1:53, "flee for succor," the Revised Version (British and American) "place of refuge"); of sozo (1Macc 2:44, "for succor," the Revised Version (British and American) "for safety"); of skepe (2Macc 5:9, the Revised Version (British and American) "shelter"); "succors" occurs (<span class="noTag">The Wisdom of Solomon 17:12</span>, the King James Version boethema, "for fear is nothing else but a betraying (the Revised Version (British and American) "surrender") of the succours which reason offereth"); "succoreth" (1Macc 12:15, boetheo, "help from heaven that succoureth us," the Revised Version (British and American) "to help us"). the Revised Version (British and American) has "succor" for "help" (<a onClick="return mV(\'1Ch\',18,5);">1Ch 18:5</a>); "O thou my succor," for "O my strength" (<a onClick="return mV(\'Psa\',22,19);">Ps 22:19</a>).``185';
isbe[8479]='Succoth (1)`suk\'-oth, suk\'-oth (cukkoth, "booths"; Skenai, Sokchoth, etc.): After parting with Esau, Jacob journeyed to Succoth, a name which he gave to the place from the "booths" which he erected to shelter his cattle (<a onClick="return mV(\'Gen\',33,17);">Ge 33:17</a>). It was in the territory of Gad, and is mentioned with Beth-nimrah (<a onClick="return mV(\'Jos\',13,27);">Jos 13:27</a>). In his pursuit of Zeba and Zalmunnah, Gideon seems to have retraced the path followed by Jacob, passing Succoth before Penuel (<a onClick="return mV(\'Jdg\',8,5);">Jud 8:5</a>). Their churlishness on that occasion brought dire punishment upon the men of Succoth. Gideon on his return "taught them" with thorns and briers (<a onClick="return mV(\'Jdg\',8,16);">Jud 8:16</a>). In the soil of the valley between Succoth and Zarethan, which was suitable for the purpose, the brass castings of the furniture for Solomon\'s Temple were made (<a onClick="return mV(\'1Ki\',7,46);">1Ki 7:46</a>; <a onClick="return mV(\'2Ch\',4,17);">2Ch 4:17</a>). Jerome (on <a onClick="return mV(\'Gen\',33,17);">Ge 33:17</a>) says that in his day it was a city beyond Jordan in the district of Scythopolis. From the above data it is clear that Succoth lay on the east of the Jordan and north of the Jabbok. From <a onClick="return mV(\'Psa\',60,6);">Ps 60:6</a>; <a onClick="return mV(\'Psa\',108,7);">108:7</a>, we may infer that it was close to the Jordan valley, part of which was apparently known by its name. Neubauer (Geog. du Talmud, 248) gives the Talmudic name as Tar\'ala. Merrill (East of the Jordan, 386) and others compare this with Tell Deir \'Alla, the name of an artificial mound about a mile north of the Jabbok, on the edge of the valley, fully 4 miles east of the Jordan. There is a place called Sakut west of the Jordan, about 10 miles south of Beisan. This has been proposed by some; but it is evident that Succoth lay east of the river. No trace of the name has been found here.``54';
isbe[8480]='Succoth (2)`(cukkoth; Sokchoth (<a onClick="return mV(\'Exd\',12,37);">Ex 12:37</a>; <a onClick="return mV(\'Exd\',13,20);">13:20</a>; <a onClick="return mV(\'Num\',33,5);">Nu 33:5</a>)): The first station of the Hebrews on leaving Rameses (see <a href="./study/isbe/search.html?string=EXODUS">EXODUS</A>). The word means "booths." The distance from <a href="./study/isbe/search.html?string=ETHAM">ETHAM</A> (which see) suggests that the site may have lain in the lower part of Wady Tumeilat, but the exact position is unknown. This region seems possibly to have been called T-K-u by the Egyptians (see <a href="./study/isbe/search.html?string=PITHOM">PITHOM</A>). Brugsch and other scholars suppose this term to have been changed to Succoth by the Old Testament writer, but this is very doubtful, Succoth being a common Hebrew word, while T-K-u is Egyptian The Hebrew "c" does not appear ever to be rendered by "t" in Egyptian. The capital of the Sethroitic nome was called T-K-t (Pierret, Vocab. hieroglyph., 697), and this word means "bread." If the region of T-K-u was near this town, it would seem to have lain on the shore road from Edom to Zoan, in which case it could not be the Succoth of the Exodus.``28';
isbe[8481]='Succoth-Benoth`suk\'-oth, suk\'-oth-be\'-noth, be\'-noth (cukkoth benoth; Rhochchothbaineithei, Codex Alexandrinus (better) Sokchothbenithei):<P>1. The Meaning according to the Hebrew:<P>The name of an idol made by the Babylonians sent into exile at Samaria by an Assyrian king (Shalmaneser), and mentioned among the deities of the various nationalities there assembled (<a onClick="return mV(\'2Ki\',17,30);">2Ki 17:30</a>). In Hebrew, Succoth-benoth means "booths of daughters," and has been explained as the chambers wherein the Babylonians placed women for prostitution; or booths or tabernacles in which images of certain goddesses were worshipped.<P>2. Sir H. Rawlinson\'s Identification of the Name:<P>The parallelism, however, requires a deity, like the Nergal of the Cutheans, the Ashima of the Hamathites, etc., and not a chamber or shrine. This consideration caused Sir H. to suggest an identification of Succoth-benoth with the Babylonian Zer-panitum (= Zer-banitum), whose name was probably pronounced Zer-panith, the spouse of Merodach (the god of Babylon), as the "seed-creatress." The difference in the first component, zer, was regarded as due to its possible Hamitic (= Sumerian) equivalent, or to a Semitic mistranslation, both of which explanations are now known to be untenable.<P>3. Is Succoth the Babylonian Sakut?:<P>As the people who made Succoth-benoth were Babylonians, we should expect here either a name of Merodach, the god of Babylon, or one of the deities identified with him. At present the only suggestion which can be made is that Benoth is for ban wath, i.e. ban\'(i) mati, "creator of the land." Both the Semitic and the bilingual creation-stories speak of Merodach as the creator of the world, with its products, and the great cities of Babylonia; and "father Enlil," who bore the title "lord of the world," bestowed the same upon Merodach at the creation, thus identifying Merodach with himself. Now there is a group which may be read either Dikut, "the Judge," or Sakut, "the Counselor," and if we can read Succoth-benoth as Sakut(h)ban\' wat(h), "the Counselor, creator of the land," a satisfactory explanation of this puzzling name will be furnished. The terminal -i of the Babylonian has been preserved in the ei, of the Greek. The adoption of such a descriptive name of Enlil-Merodach would form a compromise between abandoning their old objects of worship and accepting "the god of the land" (<a onClick="return mV(\'2Ki\',17,26);">2Ki 17:26</a>).``136';

isbe[8484]='Sudias`su\'-di-as (Soudias): In 1Esdras 5:23, a Levitical family that returned with Zerubbabel, called in <a onClick="return mV(\'Ezr\',2,40);">Ezr 2:40</a> "Hodaviah" and in <a onClick="return mV(\'Neh\',7,43);">Ne 7:43</a> "<a href="./study/isbe/search.html?string=HODEVAH">Hodevah</a>" (which see).``1';
isbe[8485]='Suffering`suf\'-er-ing: A great variety of Hebrew and Greek expressions, too large to be here enumerated, have been translated by "suffering" and other forms derived from the same verb. The most obvious meanings of the word are the following:<P>(1) The commonest meaning perhaps in the English Versions of the Bible is "to permit," "to allow," "to give leave to": "Moses suffered to write a bill of divorcement, and to put her away" (<a onClick="return mV(\'Mar\',10,4);">Mr 10:4</a>).<P>(2) "To experience," "to go through,"\' "to endure": "I have suffered many things this day in a dream because of him" (<a onClick="return mV(\'Mat\',27,19);">Mt 27:19</a>). A woman "had suffered many things of many physicians" (<a onClick="return mV(\'Mar\',5,26);">Mr 5:26</a>). Other common phrases are "to suffer affliction" (<a onClick="return mV(\'1Th\',3,4);">1Th 3:4</a>; <a onClick="return mV(\'Hbr\',11,25);">Heb 11:25</a>, the Revised Version (British and American) "share ill-treatment"), "to suffer hardship" (<a onClick="return mV(\'2Ti\',2,9);">2Ti 2:9</a>), "to suffer adversity" (<a onClick="return mV(\'Hbr\',13,3);">Heb 13:3</a> the King James Version, the Revised Version (British and American) "to be ill-treated"), "to suffer dishonor" (the King James Version "shame," <a onClick="return mV(\'Act\',5,41);">Ac 5:41</a>), "to suffer violence," (<a onClick="return mV(\'Mat\',11,12);">Mt 11:12</a>), "to suffer wrong" (<a onClick="return mV(\'Act\',7,24);">Ac 7:24</a>), "to suffer terror" (<a onClick="return mV(\'Psa\',88,15);">Ps 88:15</a>), "to suffer shipwreck" (<a onClick="return mV(\'2Cr\',11,25);">2Co 11:25</a>), "to suffer hunger" (<a onClick="return mV(\'Psa\',34,10);">Ps 34:10</a>; <a onClick="return mV(\'Pro\',19,15);">Pr 19:15</a>), "to suffer thirst" (<a onClick="return mV(\'Job\',24,11);">Job 24:11</a>).<P>(3) "To put up with," "to tolerate": the King James Version, "For ye suffer fools gladly (the Revised Version (British and American) "ye bear with the foolish gladly"), seeing ye yourselves are wise" (<a onClick="return mV(\'2Cr\',11,1,9);">2Co 11:1,9</a>).<P>(4) "To undergo punishment": "Think ye that these Galileans were sinners above all the Galileans, because they have suffered these things?" (<a onClick="return mV(\'Luk\',13,2);">Lu 13:2</a>).<P>(5) "To sustain loss": "If any man\'s work shall be burned, he shall suffer loss" (<a onClick="return mV(\'1Cr\',3,15);">1Co 3:15</a>; also <a onClick="return mV(\'Phl\',3,8);">Php 3:8</a>). (6) "To suffer death." Here the clearest references are to the suffering or passion of Christ, which indeed includes the enduring of untold hardships and affliction, all of which culminate in His vicarious death for man (<a onClick="return mV(\'Mat\',16,21);">Mt 16:21</a>; <a onClick="return mV(\'Mar\',8,31);">Mr 8:31</a>; <a onClick="return mV(\'Mar\',9,12);">9:12</a>; <a onClick="return mV(\'Luk\',9,22);">Lu 9:22</a>; <a onClick="return mV(\'Luk\',17,25);">17:25</a>; <a onClick="return mV(\'Luk\',22,15);">22:15</a>; <a onClick="return mV(\'Luk\',24,26,46);">24:26,46</a>; <a onClick="return mV(\'Act\',3,18);">Ac 3:18</a>; <a onClick="return mV(\'Act\',17,3);">17:3</a>; <a onClick="return mV(\'Act\',26,23);">26:23</a>; <a onClick="return mV(\'1Pe\',3,18);">1Pe 3:18</a>).<P>Suffering belongs to the discipline of all Christ\'s followers (<a onClick="return mV(\'Rom\',8,17);">Ro 8:17</a>; <a onClick="return mV(\'2Cr\',1,7);">2Co 1:7</a>; <a onClick="return mV(\'Gal\',3,4);">Ga 3:4</a>; <a onClick="return mV(\'Phl\',3,10);">Php 3:10</a>; <a onClick="return mV(\'1Th\',2,2);">1Th 2:2</a>; <a onClick="return mV(\'2Th\',1,5);">2Th 1:5</a>; <a onClick="return mV(\'2Ti\',2,12);">2Ti 2:12</a>; <a onClick="return mV(\'2Ti\',3,12);">3:12</a>; <a onClick="return mV(\'Jam\',5,10);">Jas 5:10</a>; <a onClick="return mV(\'1Pe\',2,20);">1Pe 2:20</a>f; <a onClick="return mV(\'1Pe\',3,14,17);">3:14,17</a>; <a onClick="return mV(\'1Pe\',4,1,13,16);">4:1,13,16</a>; <a onClick="return mV(\'1Pe\',5,10);">5:10</a>). Such suffering is called a suffering for God\'s or Christ\'s sake (<a onClick="return mV(\'Jer\',15,15);">Jer 15:15</a>; <a onClick="return mV(\'Act\',9,16);">Ac 9:16</a>; <a onClick="return mV(\'Phl\',1,29);">Php 1:29</a>; <a onClick="return mV(\'2Ti\',1,12);">2Ti 1:12</a>). This fellowship in suffering unites us with the saints of God in all times (<a onClick="return mV(\'Jam\',5,10);">Jas 5:10</a>), and is indeed a fellowship with the Lord Himself (<a onClick="return mV(\'Phl\',3,10);">Php 3:10</a>), who uses this discipline to mold us more and more according to His character.``106';

isbe[8488]='Sukkiim`suk\'-i-im (cukkiyim): Named in <a onClick="return mV(\'2Ch\',12,3);">2Ch 12:3</a> as a tribe that took part with Libyans and Cretans in the invasion of Judea by Shishak. The identification is uncertain.``1';
isbe[8489]='Sulphur`sul\'-fur.`<a href="./study/isbe/search.html?string=BRIMSTONE">BRIMSTONE</a>`1';
isbe[8490]='Summer`sum\'-er (qayits; Aramaic qayit (<a onClick="return mV(\'Dan\',2,35);">Da 2:35</a>), from quts quT, "to cut off," "to pluck or gather fruit," hence, the time of fruit, summer (<a onClick="return mV(\'2Sa\',16,1,2);">2Sa 16:1,2</a>; <a onClick="return mV(\'Jer\',40,10,12);">Jer 40:10,12</a>); theros (<a onClick="return mV(\'Mat\',24,32);">Mt 24:32</a>; <a onClick="return mV(\'Luk\',21,30);">Lu 21:30</a>)): The Hebrew verb, mentioned above, occurs in <a onClick="return mV(\'Isa\',18,6);">Isa 18:6</a>, "to summer," used of the ravenous birds feeding upon carcasses of the slain. The term "summer parlor" in <a onClick="return mV(\'Jdg\',3,20);">Jud 3:20</a> (compare <a onClick="return mV(\'Jdg\',3,24);">3:24</A>) is literally, "upper room," and is so rendered in the Revised Version (British and American). The summer was the dry season extending from April to October when usually no rain falls. Hence, the "drought of summer" (<a onClick="return mV(\'Psa\',32,4);">Ps 32:4</a>).`<a href="./study/isbe/search.html?string=SEASONS">SEASONS</a>`138';
isbe[8491]='Summer-House`(beth ha-qayits): <a onClick="return mV(\'Amo\',3,15);">Am 3:15</a> notes it as part of the judgment on Israel that Yahweh would smite "the winter-house with the summer-house." It belonged to the luxury of the period that kings and wealthy persons had separate residences for the cold and hot seasons. This is the only mention of "the summer-house," but Eglon\'s "cool upper room" (<a onClick="return mV(\'Jdg\',3,20);">Jud 3:20</a>, the King James Version and the English Revised Version "summer parlour," not in this case a separate building) may be compared.`<a href="./study/isbe/search.html?string=WINTER+HOUSE">WINTER-HOUSE</a>`1';
isbe[8492]='Sun (1)``<a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>`1';
isbe[8493]='Sun (2)`(Figurative): Poetical conceptions for the sun are frequently found in the Scriptures, though the strictly figurative expressions are not common. Undoubtedly the Jewish festivals, religious as well as agricultural, were determined by the sun\'s movements, and this fact, together with the poetical nature of the Hebrews and their lack of scientific knowledge, had a tendency. to multiply spiritual and metaphorical expressions concerning the "greater light" of the heavens. Some of these poetical conceptions are very beautiful, such as the sun having a habitation (<a onClick="return mV(\'Hab\',3,11);">Hab 3:11</a>), a tabernacle (<a onClick="return mV(\'Psa\',19,4);">Ps 19:4</a>f) set for him by Yahweh, out of which he comes as a bridegroom from his chamber, rejoicing as a strong man to run a race. The sun is also given as the emblem of constancy (<a onClick="return mV(\'Psa\',72,5,17);">Ps 72:5,17</a>), of beauty (<a onClick="return mV(\'Sgs\',6,10);">So 6:10</a>), of the law of God (<a onClick="return mV(\'Psa\',19,7);">Ps 19:7</a>), of the purity of heavenly beings (<a onClick="return mV(\'Rev\',1,16);">Re 1:16</a>; <a onClick="return mV(\'Rev\',12,1);">12:1</a>), and of the presence and person of God (<a onClick="return mV(\'Psa\',84,11);">Ps 84:11</a>). The ancient world given to personifying the sun did not refrain from sun-worship, and even the Hebrew in the time of the kings came perilously near this idolatry (<a onClick="return mV(\'2Ki\',23,11);">2Ki 23:11</a>).`<a href="./study/isbe/search.html?string=SUN+WORSHIP">SUN-WORSHIP</a>`158';

isbe[8497]='Sun, Smiting By`smit\'-ing: Exposure of the uncovered head to the heat of the sun is likely to produce either of two conditions; the commoner is heat exhaustion with faintness, the rarer is heatstroke with fever and paralysis of the heat-regulating apparatus of the nervous system. This condition is described as siriasis. The two fatal instances recorded were probably of the latter kind. One, the case of the Shunammite\'s son (<a onClick="return mV(\'2Ki\',4,19);">2Ki 4:19</a>), was apparently very acute, like some of the cases described by Manson and Sambon. Of the other case, that of Manasseh, Judith\'s husband, we have no particulars (Judith 8:3), except that it was likewise brought on by exposure in the harvest field, and occurred at the time of barley harvest, that is, early in May. Jonah\'s attack was one of heat syncope, as he fainted from the heat (<a onClick="return mV(\'Jon\',4,8);">Jon 4:8</a>). According both to psalmist (<a onClick="return mV(\'Psa\',121,6);">Ps 121:6</a>) and to prophet (<a onClick="return mV(\'Isa\',49,10);">Isa 49:10</a>), the people of God are protected from the stroke of the sun as well as from that of the moon. The latter was supposed to cause lunacy (hence, the name), and epilepsy, so in <a onClick="return mV(\'Mat\',4,24);">Mt 4:24</a> the word rendered "lunatic" (the King James Version) for "epileptic" (Revised Version) is seleniazomenous, literally, "moon struck."`<a href="./study/isbe/search.html?string=MOON">MOON</a>`107';

isbe[8499]='Sun-Worship`sun\'-wur-ship: The splendor of the sun makes it a natural object of adoration, once the purer idea of the one true God (<a onClick="return mV(\'Rom\',1,20,21);">Ro 1:20,21</a>) is parted with, and in most ancient nations the worship of the sun was an outstanding feature. It is found in Babylonian and Assyrian (Samas; special seats of sun-worship were Sippara and Larsa); in Egypt it is a leading feature of the religion (Ra, and, under special phases, Horus, Tum, Aten; a special seat of sun-worship was Heliopollis, the Old Testament On, called in <a onClick="return mV(\'Jer\',43,13);">Jer 43:13</a> Beth-shemesh, "house of the sun"). Other cities bore the same name: Beth-shemesh (<a onClick="return mV(\'Jos\',15,10);">Jos 15:10</a> = Ir-shemesh; <a onClick="return mV(\'Jos\',19,41);">Jos 19:41</a>, in Judah; <a onClick="return mV(\'Jos\',19,22);">Jos 19:22</a>, in Issachar; <a onClick="return mV(\'Jos\',19,38);">Jos 19:38</a>, in Naphtali; see <a href="./study/isbe/search.html?string=BETH-SHEMESH">BETH-SHEMESH</A>). Allusions to, and warnings against, sun-worship are frequent in the Old Testament, as in <a onClick="return mV(\'Lev\',26,30);">Le 26:30</a>; <a onClick="return mV(\'2Ch\',14,5);">2Ch 14:5</a>; <a onClick="return mV(\'2Ch\',34,4,7);">34:4,7</a>; <a onClick="return mV(\'Isa\',17,8);">Isa 17:8</a>; <a onClick="return mV(\'Isa\',27,9);">27:9</a>; <a onClick="return mV(\'Eze\',6,4,6);">Eze 6:4,6</a>, in which passages for the King James Version "images," "idols," the Revised Version (British and American) has "<a href="./study/isbe/search.html?string=SUN-IMAGES">sun-images</a>" (which see); <a onClick="return mV(\'Job\',31,26,27);">Job 31:26,27</a> and numerous passages show that this form of idolatry latterly penetrated deeply into Judah—even into its temple-worship (<a onClick="return mV(\'2Ki\',23,5,11);">2Ki 23:5,11</a>, "horses...given to the sun" (see under <a href="./study/isbe/search.html?string=HORSES+OF+THE+SUN">HORSES OF THE SUN</A>, "Chariots of the Sun"; and <a onClick="return mV(\'Eze\',8,16);">Eze 8:16</a>). Josiah\'s reformation took account of these abuses (<a onClick="return mV(\'2Ki\',23,5,11);">2Ki 23:5,11</a>ff; <a onClick="return mV(\'2Ch\',34,4,7);">2Ch 34:4,7</a>), and Ezekiel strenuously denounced them (<a onClick="return mV(\'Eze\',8,16);">8:16</A>ff).``132';
