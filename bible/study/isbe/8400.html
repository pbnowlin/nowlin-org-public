isbe[8404]='Stately`stat\'-li (kebhuddah, "weight," "honor," "wealth"): "And sit upon a stately (magnificent) bed" (<a onClick="return mV(\'Eze\',23,41);">Eze 23:41</a>).``1';
isbe[8405]='Stater`sta\'-ter (stater): Used only once, <a onClick="return mV(\'Mat\',17,27);">Mt 17:27</a>, where it is rendered by "piece of money" in the King James Version and "shekel" in the Revised Version (British and American). It was originally a standard Greek weight equal to two drachmas, but later it was used to designate the tetradrachma, and this is probably the coin referred to in the above passage.`<a href="./study/isbe/search.html?string=MONEY">MONEY</a>`1';
isbe[8406]='Stature`stat\'-ur (madh, middah, "measure" (<a onClick="return mV(\'Num\',13,32);">Nu 13:32</a>, etc.), qomah, "standing up" (<a onClick="return mV(\'1Sa\',16,7);">1Sa 16:7</a>, etc.); helikia, "greatness"): This last word means "height of the body," "stature," in <a onClick="return mV(\'Luk\',2,52);">Lu 2:52</a>; <a onClick="return mV(\'Luk\',19,3);">19:3</a>; <a onClick="return mV(\'Eph\',4,13);">Eph 4:13</a>, but it can mean "length of life" equally well and has this force in <a onClick="return mV(\'Jhn\',9,21,23);">Joh 9:21,23</a>; <a onClick="return mV(\'Hbr\',11,11);">Heb 11:11</a>. And this meaning, not "stature" (as in the King James Version), is fixed for <a onClick="return mV(\'Mat\',6,27);">Mt 6:27</a> parallel <a onClick="return mV(\'Luk\',12,25);">Lu 12:25</a>, for to add some 18 inches (see <a href="./study/isbe/search.html?string=CUBIT">CUBIT</A>) to one\'s "stature" would be a grotesque feat, while it is the smallness of the act that is emphasized. Hence, the translation "able to extend his long path of life by a single cubit" (the Revised Version (British and American) "measure of life"). Compare also "great of stature" Baruch 3:26 (eumegethes).``1';
isbe[8407]='Staves`stavz (baddim): Ten or eleven Hebrew words are used in the Old Testament to describe various staffs, bars, and wooden rods used by the Hebrews (compare <a href="./study/isbe/search.html?string=STAFF">STAFF</A>; <a href="./study/isbe/search.html?string=ROD">ROD</a>; <a href="./study/isbe/search.html?string=SCEPTER">SCEPTER</A>). One word only is used to describe the staves or wooden poles used for carrying the holy furniture of the tabernacle from place to place. That word is badh (plural baddim), which occurs 28 times in Exodus and Numbers and 5 times in Kings and Chronicles (compare also <a onClick="return mV(\'Job\',17,16);">Job 17:16</a>; <a onClick="return mV(\'Hsa\',11,6);">Ho 11:6</a>). The only passage in which these staves are mentioned by another name is <a onClick="return mV(\'1Ch\',15,15);">1Ch 15:15</a>, where the staves used for carrying the ark from its captivity into Jerusalem are called motah. The reason for this probably is that the original baddim had been lost during the long absence of the sacred chest from its home in the tabernacle.<P>In the wilderness wanderings, arrangements were made that four items of the holy furniture of the portable tabernacle should be carried on the shoulders of Levites, suspended on these staves. These were the golden altar of incense, the golden table for shewbread, the brazen altar of sacrifice, and the ark of the covenant (<a onClick="return mV(\'Exd\',35,\'12-16\');">Ex 35:12-16</a>).<P>In the case of the large altar of sacrifice, which was in reality a hollow wooden chest covered with brass (bronze) plates (see <a href="./study/isbe/search.html?string=ALTAR">ALTAR</A>), four rings were attached to the brass grating which rose midway in the chest, and through these rings the staves passed. The staves were of acacia wood and were covered with brass plating. In the case of the three golden utensils of the sanctuary, the staves were of acacia wood, covered with gold plates.<P>The last mention of any of these staves is in <a onClick="return mV(\'1Ki\',8,\'7-9\');">1Ki 8:7-9</a>, where it is stated of the ark, in the holy of holies in Solomon\'s Temple, that the ends of its staves were seen by anyone standing in the adjoining holy place, before (i.e. east of) the oracle. Priests only might view them there, the curtain being withdrawn. The writer of <a onClick="return mV(\'1Ki\',8,\'1-\');">1Ki 8</a> adds that the staves were thus visible when he wrote, an item of evidence worthy of note as to the date of the document.``17';
isbe[8408]='Stay`sta: Is derived from two distinct forms. From one derivation it has the meaning "to stand" and so "to continue in one place" (<a onClick="return mV(\'Gen\',8,10);">Ge 8:10</a>; <a onClick="return mV(\'Lev\',13,23,28);">Le 13:23,28</a>, etc.), "to forbear to act" (<a onClick="return mV(\'Rth\',1,13);">Ru 1:13</a>), "to rest," "to be trustful" (King James Version, the English Revised Version <a onClick="return mV(\'Isa\',10,20);">Isa 10:20</a>; see below). Transitively it means "to cause to stay," "to hinder" (<a onClick="return mV(\'Dan\',4,35);">Da 4:35</a>, etc.), and "stay" as a noun means "cessation of progress"\' (<a onClick="return mV(\'Lev\',13,5,37);">Le 13:5,37</a>), "sojourn." From the second derivation the verb means "to support" (<a onClick="return mV(\'Exd\',17,12);">Ex 17:12</a>; <a onClick="return mV(\'1Ki\',22,35);">1Ki 22:35</a>; <a onClick="return mV(\'Sgs\',2,5);">So 2:5</a>), while the noun means "a support" (<a onClick="return mV(\'1Ki\',10,19);">1Ki 10:19</a>; <a onClick="return mV(\'Isa\',3,1);">Isa 3:1</a>, etc.). The American Standard Revised Version has judged obsolete "stay on" in the sense "trust in," and for "stay" has substituted "lean" in <a onClick="return mV(\'Isa\',10,20);">Isa 10:20</a> and "rely" in <a onClick="return mV(\'Isa\',30,12);">30:12</A>; <a onClick="return mV(\'Isa\',31,1);">31:1</A>; <a onClick="return mV(\'Isa\',50,10);">50:10</a>, although "stay themselves upon" (= "support themselves by") has been kept in <a onClick="return mV(\'Isa\',48,2);">48:2</A>. Otherwise the Revised Version (British and American) has made few alterations. But such as have been made ("tarry ye" for "stay yourselves" in <a onClick="return mV(\'Isa\',29,9);">Isa 29:9</a> and the American Standard Revised Version "restrain" for "stay" in <a onClick="return mV(\'Job\',37,4);">Job 37:4</a>) could have been carried farther with advantage.``48';
isbe[8409]='Stead; Steads`sted, stedz (tachath, "(same) place"; AS stede, "place"): Occurs only in <a onClick="return mV(\'1Ch\',5,22);">1Ch 5:22</a>, "They dwelt in their stead (place) until the captivity."``1';
isbe[8410]='Stealing`ste\'-ling.`<a href="./study/isbe/search.html?string=CRIMES">CRIMES</a>; <a href="./study/isbe/search.html?string=PUNISHMENTS">PUNISHMENTS</a>`1';
isbe[8411]='Stedfastness`sted\'-fast-nes:<P>(1) stereoma, "firmness": "The steadfastness of your faith in Christ" (<a onClick="return mV(\'Col\',2,5);">Col 2:5</a>). Some take this figuratively, in a military sense, of a "solid front" (see Thayer, Greek-English Lexicon of New Testament, under the word).<P>(2) sterigmos, "stability" (<a onClick="return mV(\'2Pe\',3,17);">2Pe 3:17</a>; compare <a onClick="return mV(\'1Cr\',15,58);">1Co 15:58</a>).``1';
isbe[8412]='Steel`stel: the Revised Version (British and American) substitutes "brass" for "steel" in <a onClick="return mV(\'2Sa\',22,35);">2Sa 22:35</a>; <a onClick="return mV(\'Job\',20,24);">Job 20:24</a>; <a onClick="return mV(\'Psa\',18,34);">Ps 18:34</a>; <a onClick="return mV(\'Jer\',15,12);">Jer 15:12</a>, and "steel" for "torches" in <a onClick="return mV(\'Nah\',2,3);">Na 2:3</a>.`<a href="./study/isbe/search.html?string=BRASS">BRASS</a>`1';
isbe[8413]='Stephanas`stef\'-a-nas (Stephanas): The name occurs only in <a onClick="return mV(\'1Cr\',1,16);">1Co 1:16</a>; <a onClick="return mV(\'1Cr\',16,\'15-18\');">16:15-18</a>. Stephanas was a Christian of Corinth; his household is mentioned in <a onClick="return mV(\'1Cr\',16,15);">1Co 16:15</a> as the first family won to Christ in Achaia, and in <a onClick="return mV(\'1Cr\',1,16);">1Co 1:16</a> as among the few personally baptized by Paul at Corinth. The "house of Stephanas," apparently of independent means, had "set themselves to minister unto the saints" (<a onClick="return mV(\'1Cr\',16,15);">1Co 16:15</a>), i.e. to do Christian service. Possibly this service consisted in putting their house at the disposal of the Christians at Corinth for worshipping, or in rendering special assistance in establishing intercommunication between the Corinthian church and the apostle, or the other churches. An instance of such service was the commission of Stephanas at Ephesus referred to in <a onClick="return mV(\'1Cr\',16,17,18);">1Co 16:17,18</a>. At the occasion of some disorders in the Corinthian church Stephanas, with Fortunatus and Achaicus in the deputation, brought a letter of the Corinthians to Paul. Our present 1 Corinthians is the reply to this letter, and thus, in all probability, the three men mentioned above were the bearers of this epistle. With fine courtesy Paul expresses his appreciation for this service in <a onClick="return mV(\'1Cr\',16,18);">1Co 16:18</a>, referring to it as a cherished opportunity of fellowship with his beloved Corinthians through these representatives. It is in consideration of such Christian service that Paul enjoins upon the Corinthians to show the house of Stephanas that respect and deference due to Christian leaders by willingly submitting to their direction.``141';
isbe[8414]='Stephen`ste\'-vn (Stephanos, "crown" (<a onClick="return mV(\'Act\',6,\'5-\');">Ac 6:5-8:12</a>)):<P>1. His Personal Antecedents<P>2. His Character and Activity<P>3. His Teaching<P>4. His Arraignment before the Sanhedrin<P>5. His Defence before the Sanhedrin<P class="in15">(1) Personal Defence<P class="in15">(2) Defense of His Teaching<P>6. Martyrdom of Stephen<hr /><P>LITERATURE<P>Known best as the proto-martyr of the Christian church, introducing the heroic period of persecutions. He deserves as well to be called the first great apologist for Christianity, since it was this that brought on his death as a martyr (circa 36 or 37 AD).<P>1. His Personal Antecedents:<P>As his name and his relations in the church at Jerusalem seem to imply (<a onClick="return mV(\'Act\',6,3);">Ac 6:3</a>), he was a Hellenist, i.e. a Greek-speaking Jew. Thus he belonged to that class of Jews usually residing outside of Palestine who, though distinguished from the orthodox Palestinian Jew by a broader outlook on life due to a more liberal education, were Jews none the less, the original Jewish element predominating in their character, and who might be true Israelites indeed, as Stephen was. Of his conversion to Christianity we know nothing, though there is a tradition that he was among the Seventy. As Stephen by his life and work marks a period of transition in the development of the early Christian church, so his name is connected with an important new departure within the organization of the church itself, namely, the institution of the office of the Seven (<a onClick="return mV(\'Act\',6,1);">Ac 6:1</a>), who were entrusted with the administration of the work of relief in the church at Jerusalem—the foundation of the diaconate (Iren., Haer., i.26; Cyprian, Epist., iii.3). Of the seven men, all Hellenists, elected to this office at the occasion of a grievance of the Hellenistic Christians in the Jerusalem church against the Hebrew Christians, to the effect that in the distribution of alms their widows were being discriminated against, Stephen, who heads the list, is by far the most distinguished.<P>2. His Character and Activity:<P>Stephen more than met the requirements of the office to which he was elected (<a onClick="return mV(\'Act\',6,3);">Ac 6:3</a>); the record characterizes him as "a man full of faith and of the Holy Spirit" (<a onClick="return mV(\'Act\',6,5);">Ac 6:5</a>), i.e. of an enthusiastic faith and of a deep spirituality, and his activity was not restricted to the functions of his office; in fact while nothing is said of the manner in which he fulfilled the duties of his office, though without doubt he fulfilled them faithfully, the record makes it very clear that the importance of Stephen lay in his activity as a preacher, a witness for Christ; it is this activity which has given him the place he holds in history (<a onClick="return mV(\'Act\',22,20);">Ac 22:20</a>). In itself that is not surprising, for in the early Christian church every Christian was at once a witness for Christ, and lay-preaching was common. The Seven from the first were occupied with essentially spiritual work, as also the later diaconate was engaged in something far different from mere charity organization. But Stephen was especially qualified for this high work, having been endued by the Holy Spirit with apostolical gifts, not only that of preaching, but also that of working miracles (<a onClick="return mV(\'Act\',6,8);">Ac 6:8</a>). In his freer views of Jewish law and customs, due to his deeper conception and better understanding of the essence of Christianity, he even excelled the apostles.<P>3. His Teaching:<P>He burst the bonds of Judaism, by which the other apostles were still bound, by teaching that the temple and the Law of Moses were evanescent and that Christianity was destined to supersede Judaism (<a onClick="return mV(\'Act\',6,14);">Ac 6:14</a>). These freer views of Stephen, though possibly attributable to his Hellenic culture, were certainly not of Hellenistic origin, for just their promulgation is what brought him into controversy with the Hellenistic synagogues of Jerusalem. Though the Hellenist dispensed himself from keeping all of the Pharisaic additions to the Law, he always regarded the Law of Moses and the temple at Jerusalem as highly as the Palestinian Jew. Even Philo characterizes the Law of Moses in distinction from the laws of other nations, as stedfast, immovable and unchangeable, placing it on a level with the laws of Nature. The true source of Stephen\'s freer views of the Mosaic Law and the temple was Christ\'s own teachings, Stephen showing a wonderfully ripened understanding of them, paralleled only by that of Paul some time later. Christ\'s words regarding the temple (<a onClick="return mV(\'Jhn\',4,\'20-24\');">Joh 4:20-24</a>; <a onClick="return mV(\'Mar\',13,2);">Mr 13:2</a>) not only led Stephen to see that the true worship of God was not confined to the temple, but opened his eyes as to the purely formal character of this worship in that day, which, far from being true worship, had become a mere ceremonialism (<a onClick="return mV(\'Mar\',7,6);">Mr 7:6</a>), and in the words of Christ (<a onClick="return mV(\'Jhn\',2,19);">Joh 2:19</a>) he saw an intimation of the new temple which was to take the place of the old. Thus also his conception of the transitory nature of the Mosaic Law may be traced to Christ\'s teaching as to the Sabbath, the laws of purifying, the fulfillment of the Law and Jewish customs of the day (<a onClick="return mV(\'Mat\',5,20);">Mt 5:20</a>) and of a better righteousness than that of the Pharisees and scribes (<a onClick="return mV(\'Mat\',9,16);">Mt 9:16</a>). As Christ had been drawn into controversy with Pharisees and scribes on account of these freer views, and as His word about the temple was used to frame the accusation against Him in His trial, so also in the case of Stephen. He did not hesitate to preach his views, choosing the Hellenistic synagogues for this purpose, and soon became engaged in controversies there. But, as the record says, his opponents "were not able to withstand the wisdom," i.e. better understanding, convincing knowledge, "and the Spirit," i.e. the deep earnestness and spirituality, "by which he spake" so convincingly (<a onClick="return mV(\'Act\',6,10);">Ac 6:10</a>; <a onClick="return mV(\'Mat\',10,19,20);">Mt 10:19,20</a>). Seeing themselves beaten, they took recourse to the ignoble method of declaring him a blasphemer and a heretic, by using the same foul means that the enemies of Jesus had resorted to, by suborning false witnesses to the plot, by stirring up the people against him, by appealing to their Jewish prejudices and to the scribes and elders, members of the Sanhedrin, and thus eventually brought about his arraignment.<P>4. His Arraignment before the Sanhedrin:<P>The accusation which they brought against him, through the introduction of false witnesses, included a twofold charge, one against his person, a charge of blasphemous words against Moses which would make him also a blasphemer of God, and one against his teaching, charging him with revolutionary and radical statements concerning the temple and the Law. (compare <a onClick="return mV(\'Mar\',14,58);">Mr 14:58</a>; <a onClick="return mV(\'Mar\',13,2);">13:2</a>; <a onClick="return mV(\'Mar\',15,29);">15:29</a>). "Customs of Moses" (<a onClick="return mV(\'Act\',6,14);">Ac 6:14</a>) were the institutions that distinguished the Jews and that were derived from Moses. By his reference to "this place" and "these customs" Stephen was understood to imply the destruction of the temple and the change of the Law, Christianity thus aiming not only at the overthrow of the Jews\' religion but the very termination of their national existence.<P>The charge against Stephen\'s person was a baseless accusation. There was no blasphemy on the part of Stephen, save by perversion of his words. The charge against his teaching was both false and true. It was false as an implied insinuation that he impugned the divine origin and character of the temple and the Mosaic Law, but it was true as far as he conceived both to be only of a temporary nature and serving a merely provisional purpose, which, as we have seen, constituted the peculiarity of his teaching. As in the trial of Christ, the judge, Pontius Pilate, read his true verdict, "I find no guilt in him," written on His countenance and whole bearing, thus here the record tells us that the judges of Stephen, "All that sat in the council...saw his face as it had been the face of an angel" (<a onClick="return mV(\'Act\',6,15);">Ac 6:15</a>; <a onClick="return mV(\'2Cr\',3,18);">2Co 3:18</a>); as if in refutation of the charge made against him, Stephen receives the same mark of divine favor which had been granted to Moses. It is a significant fact that Stephen was not arraigned before the Sanhedrin as being a Nazarene though at bottom it was the real cause of his arraignment. Thus also his defense before the Sanhedrin, though the name of Jesus was not mentioned until the very last, was in reality a grand apology for Christ.<P>5. His Defense before the Sanhedrin:<P>While the assembly was overawed by the evidence of singular innocence and holiness written upon the countenance of Stephen (<a onClick="return mV(\'Act\',6,15);">Ac 6:15</a>), the question of the high priest "Are these things so?" broke in upon the silence. It drew forth from Stephen that masterful pleading which, so sublime in form and content and bare of all artificiality, belongs to the highest type of oratory, characterized by its deep, earnest, and genuine spirituality, the kind of oratory of which the great speeches of our own martyred Lincoln were models. It is not so much a plea in selfdefence as a grand apology for the cause which Stephen represents.<P>Beginning by mentioning "the God of glory" and ending with a vision of that glory itself, the speech is a wonderful apotheosis of the humble cause of the Nazarene, the enthusiastic tribute of its first great martyr delivered in the face of death. The contents of his speech are a recital of the most marked phases of Jewish history in the past, but as read from the point of view of its outworkings in the present—old facts interpreted by a spiritfilled disciple of Christ. It is in reality a philosophy of Israel\'s history and religion, and in so far it was a novum. Thus the new feature that it furnishes is its philosophy of this history which might be termed the Christian philosophy of Jewish history. In appealing to their reason he calls up picture after picture from Abraham to Moses; the speech exhibits vividly the continuity and the progress of the divine revelation which culminated in Jesus of Nazareth, the same thought as that expressed by Christ in <a onClick="return mV(\'Mat\',5,17);">Mt 5:17</a> of the principal agreement between the Old Testament and the New Testament revelation.<P>The emotional appeal lies in the reverential and feeling manner in which he handles the history sacred to them all. The strong appeal to the will is made by holding up the figure of Moses type of the Law, in its vital significance, in such a way as passionately to apply it to the fundamental relation of divine plan and human conduct. Thus the aim of Stephen was to point out to his hearers the true meaning of Jewish history and Jewish Law in reference to the present, i.e. in such a way that they might better understand and judge the present and adjust their conduct to it accordingly. Their knowledge of Jewish history and Jewish religion as he would convey it to them would compel them to clear him of the accusation against him as blasphemer and false teacher.<P>In accordance with the accusation against him, his defense was a twofold one: personal defense and defense of his teaching.<P>(1) Personal Defense<P>The charge of blasphemy against God and contempt of the Law is implicitly repudiated by the tenor of the whole speech. The courteous and at once endearing terms in Stephen\'s address (<a onClick="return mV(\'Act\',7,2);">Ac 7:2</a>) to the council, and the terms "our fathers" and "our race" in <a onClick="return mV(\'Act\',7,2,19);">Ac 7:2,19</a> by which he closely associates himself with his hearers, his declaration of the divine majesty of Yahweh with which the speech opens (<a onClick="return mV(\'Act\',7,2);">7:2</a>), of the providential leading of the patriarchs (<a onClick="return mV(\'Act\',7,8,10);">7:8,10</A>), his recognition of the Old Testament institutions as divinely decreed (<a onClick="return mV(\'Act\',7,8);">7:8</a>), his reference to the divine sanction of the Law and its condemnation of those who had not kept it (<a onClick="return mV(\'Act\',7,53);">7:53</A>), at the close of his speech, show clearly his reverence, not only for the past history of the Jewish race, but as well for its Sacred Writings and all of its religious institutions. It makes evident beyond doubt how not grounded the accusation of blasphemy against him was. Not to impiety or frivolity in Stephen, but to some other cause, must be due therefore the difference between him and his opponents. What it is Stephen himself shows unmistakenly in the second part of his defense.<P>(2) Defence of His Teaching<P>The fundamental differences between Stephen and his opponents, as is evident from the whole tone and drift and purpose of his speech, lay in that he judged Old Testament history from the prophetical point of view, to which Jesus had also allied Himself, while his opponents represented the legalistic point of view, so characteristic of the Jewish thought of that day. The significance of this difference is borne out by the fact upon which Stephen\'s refutation hinges, namely, the fact, proved by the history of the past, that the development of the divine revelation and the development of the Jewish nation, so far from combining, move in divergent lines, due to a disposition of obstinate disobedience on the part of their fathers, and that therefore not he but they were disobedient to the divine revelation. Thus in a masterful way Stephen converts the charge of Antinomianism and anti-Mosaism brought against him into a countercharge of disobedience to the divine revelation, of which his hearers stood guilty in the present as their fathers had in the past. In this sense the speech of Stephen is a grand apology for the Christian cause which he represented, inasmuch as it shows clearly that the new religion was only the divinely-ordered development of the old, and not in opposition to it.<P>The main arguments of the speech may be summed up as follows:<P>(a) God\'s self-manifestation to Israel in revealing His covenant and His will, so far from being bound to one sanctuary and conveyed to one single person (Moses), began long before Moses and long before there was a temple. Thus it was gradual, and as it had begun before Moses it was not completed by him, as is evident from his own words, "A prophet shall God raise up unto you from among your brethren, like unto me" (<a onClick="return mV(\'Act\',7,\'2-37\');">Ac 7:2-37</a>).<P>(b) The Jews to whom these revelations were granted, so far from being thankful at all stages of their history, had been slow to believe and understand them because they "would not be obedient" (<a onClick="return mV(\'Act\',7,39,57);">Ac 7:39,57</a>). They resisted the purpose of God by obstinately and stiff-neckedly opposing those through whom God worked. Thus their fathers had turned away from Moses at the very moment when he was receiving God\'s greatest revelation, and, instead of obeying the "living oracles" (<a onClick="return mV(\'Act\',7,38);">7:38</A>) he gave them, turned to idol-worship for which God punished them by the Babylonian captivity (<a onClick="return mV(\'Act\',7,\'39-43\');">7:39-43</A>). They had killed the prophets who had protested against the dead ritualism of the temple-worship and raised their voice in behalf of a true spiritual worship as that of the tabernacle had been (<a onClick="return mV(\'Act\',7,\'44-50\',52);">7:44-50,52</A>). This disposition of disobedience so characteristic of the race in its whole history, because, in spite of the divine revelation received, they remained unregenerate (<a onClick="return mV(\'Act\',7,51);">7:51</A>), reached its culmination in that awful crime of betrayal and murder committed by the present generation upon the "Righteous One" whose coming the prophets had predicted the rejection of Jesus of Nazareth, by which the Jews doomed not only their national existence, but also their temple-worship and the reign of the Law to destruction (<a onClick="return mV(\'Act\',7,52);">7:52</A>).<P>Though the name of Jesus was not uttered by Stephen in his speech and does not occur until in his dying prayer, his hearers could not fail to notice the hidden reference to Him throughout the entire speech and to draw parallels intended by Stephen: As Joseph and Moses, types of the Messiah, had been rejected, scorned and illtreated (<a onClick="return mV(\'Act\',7,9,27,39);">Ac 7:9,27,39</a>), before being raised to be ruler and deliverer, so Jesus had also been repulsed by them.<P>The climax of his speech is reached in <a onClick="return mV(\'Act\',7,\'51-53\');">Ac 7:51-53</a>, when Stephen, breaking off the line of argument, suddenly in direct address turns upon his hearers, and, the accused becoming the accuser, charges them openly with the sin of resisting the Holy Spirit, with the murder of the prophets and the Righteous One, and with continual disobedience to the Law. These words which mark the climax, though probably not the close of the speech, pointed the moral in terms of the most cutting rebuke, and were at once prophetical as to the effect the speech would have upon his hearers and for him.<P>6. Martyrdom of Stephen:<P>Such arguing and directness as Stephen\'s could have but one result. Prejudiced and enraged as they were, the unanswerable arguments of Stephen, based on their own Scriptures, made them mad with fury, and doubtless through their demonstrations they stopped the speech. But Stephen, ansported with enthusiasm and inspiration, was vouchsafed a vision of the "glory of God," which he had mentioned in the beginning of his speech (<a onClick="return mV(\'Act\',7,2);">Ac 7:2</a>), and of Jesus, whose cause he had so gallantly defended (<a onClick="return mV(\'Act\',7,55);">Ac 7:55</a>). Stephen standing there, his gaze piercing into heaven, while time and human limitations seemed effaced for him, marks one of the most historic moments in the history of Israel, as his words constitute the most memorable testimony ever uttered in behalf of Christ: "Behold, I see the heavens opened, and the Son of man"—the only place where this title is uttered by any other person than Jesus—"standing on the right hand of God" (<a onClick="return mV(\'Act\',7,56);">Ac 7:56</a>). Now the audience could restrain its rage no longer, and the catastrophe followed immediately. Contrary to Roman law and order they took Stephen, and without awaiting sentence against him, amid a tumultuous scene, stoned him to death, the punishment prescribed in Mosaic Law for a blasphemer (<a onClick="return mV(\'Deu\',17,7);">De 17:7</a>; <a onClick="return mV(\'Lev\',24,\'14-16\');">Le 24:14-16</a>). This recourse to lynch law may have been connived at by the Roman authorities, since the act was without political significance. It is noteworthy, however, that the Jewish legal forms were observed, as if to give to the violence the appearance of legality. Accordingly, Stephen was taken outside the city (<a onClick="return mV(\'Lev\',24,14);">Le 24:14</a>; compare <a onClick="return mV(\'Luk\',4,29);">Lu 4:29</a>); the witnesses threw the first stone at him (compare <a onClick="return mV(\'Deu\',17,7);">De 17:7</a>) after taking off their upper garments and laying them at the feet of a "young man named Saul" (<a onClick="return mV(\'Act\',7,58);">Ac 7:58</a>)—afterward Paul, now about 30 years old—who evidently had charge of the whole proceedings.<P>Stephen died as he had lived, a faithful witness to his Master whom he acknowledged as such amid the rain of stones hurled at him, loudly calling upon His name, "Lord Jesus, receive my spirit" (<a onClick="return mV(\'Act\',7,59);">Ac 7:59</a>; compare <a onClick="return mV(\'Luk\',23,46);">Lu 23:46</a>), and whose spirit he exemplified so nobly when, with a final effort, bending his knees, he "cried with a loud voice, Lord, lay not this sin to their charge" (<a onClick="return mV(\'Act\',7,60);">Ac 7:60</a>; compare <a onClick="return mV(\'Luk\',23,34);">Lu 23:34</a>). "And when he had said this, he fell asleep" (<a onClick="return mV(\'Act\',7,60);">Ac 7:60</a>; compare <a onClick="return mV(\'1Cr\',15,\'1-\');">1Co 15</a>).<P>The impression made by Stephen\'s death was even greater than that made by his life. Though it marks the beginning of the first great persecution of Christians, the death of the first Christian martyr resulted in the greatest acquisition Christianity has probably ever made, the conversion of Saul of Tarsus. The vision of the risen and exalted Jesus vouchsafed to the dying Stephen presented Christianity to Saul of Tarsus in a new light, tending to remove what had been its greatest stumbling-block to him in the Crucified One. This revelation coupled with the splendid personality of Stephen, the testimony of his righteous life and the noble bravery of his sublime death, and above all his dying prayer, fell upon the honest soul of Saul with an irresistible force and inevitably brought on the Damascus event, as Augustine clearly recognized: "Si Stephanus non orasset, ecclesia Paulum non habuisset." Judged by his teaching, Stephen may be called the forerunner of Paul. He was one of the first to conceive of the fact that Christianity represented a new order of things and as such would inevitably supersede the old order. Thus his teachings forecast that greatest controversy of the first Christian century, the controversy between Judaism and Christianity, which reached its culmination-point in the Council of Jerusalem, resulting in the independence of the Christian church from the fetters of Judaistic legalism.<P>LITERATURE.<P>R. J. Knowling, "Acts" in Expositor\'s Greek Testament., II (1900); Feine, PRE3, XIX (1907); Pahncke in Studien u. Krit. (1912), I. S. D. Press``1';
isbe[8415]='Steward`stu\'-erd (\'ish \'al bayith (<a onClick="return mV(\'Gen\',43,16,19);">Ge 43:16,19</a>; <a onClick="return mV(\'Gen\',44,1);">44:1</a>; <a onClick="return mV(\'1Ki\',16,9);">1Ki 16:9</a>), ha-meltsar (<a onClick="return mV(\'Dan\',1,11);">Da 1:11</a>), ha-cokhen (<a onClick="return mV(\'Isa\',22,15);">Isa 22:15</a>)):<P>1. Old Testament Usage:<P>In the King James Version the word "steward" is found in <a onClick="return mV(\'Gen\',15,2);">Ge 15:2</a>; <a onClick="return mV(\'1Ch\',28,1);">1Ch 28:1</a>, in addition to the above. The American Standard Revised Version renders <a onClick="return mV(\'Gen\',15,2);">Ge 15:2</a> as "possessor," and <a onClick="return mV(\'1Ch\',28,1);">1Ch 28:1</a> "rulers."<P>The phrase ben-mesheq in <a onClick="return mV(\'Gen\',15,2);">Ge 15:2</a> is best rendered "son of acquisition," hence, "heir." But this is disputed. Skinner in the ICC on Genesis regards the text as hopelessly corrupt, and offers no solution of the difficulty. In the other passages, the phrase \'ish \'al bayith is conveniently translated "steward," though literally it is "man over the house." The word ha-meltsar in <a onClick="return mV(\'Dan\',1,11);">Da 1:11</a> is translated in the King James Version as a proper noun. This is certainly a mistake. The margin gives "the steward," and this is followed in the Revised Version (British and American). A better rendering perhaps would be "overseer," as this man seemed to have the superintendence of the training and feeding of the young men until they were fitted to enter the king\'s service. He was thus rather a steward of persons than of property (see <a href="./study/isbe/search.html?string=MELZAR">MELZAR</a>). In <a onClick="return mV(\'Isa\',22,15);">Isa 22:15</a> Shebna is described in the text as "treasurer," but in the margin as "steward," and seems to combine the ideas in both the words "treasurer" and "steward." Shebna was thus one of the highest officials, having charge of the city\'s funds, and of administering them for the city\'s benefit.<P>Though the word for "steward" occurs but once in that sense, the idea is one familiar to the Old Testament. Eliezer of Damascus was Abraham\'s slave and trusted steward. Heseems to have had the oversight of all his affairs and was entrusted with the important duty of getting a wife for Isaac. He apparently had charge over the family of his master as well as his property. Whether Isaac had such a steward or not is nowhere stated, but it is practically certain that he had. Jacob seems to have been Laban\'s steward for a time, as he apparently had full charge of the flocks and herds of his master. Joseph was practically Potiphar\'s steward, and when he became Pharaoh\'s chief minister, he himself had a steward over his own house (<a onClick="return mV(\'Gen\',39,4,5,);">Ge 39:4,5</a>; <a onClick="return mV(\'Gen\',44,1,4);">44:1,4</a>). The king Elah in his brief reign of two years had a steward in charge of his household (<a onClick="return mV(\'1Ki\',16,9);">1Ki 16:9</a>). The same was doubtless true of all the kings, and it may be safely inferred that every household of distinction or of sufficient wealth had a steward in charge. The functions of this officer seem at times to have included the care of the children or minors, as well as of the property. Sometimes he was a slave, sometimes a freedman.<P>2. In the New Testament:<P>epitropos, oikonomos. These two terms denote similar positions. The exact difference cannot be clearly defined, as they are sometimes almost synonymous. The two are found together in <a onClick="return mV(\'Gal\',4,2);">Ga 4:2</a>. Some scholars say they are used synonymously, others that the first word is a more general term including the latter. Lightfoot and Ellicott think that the former refers rather to the guardianship of persons, the child\'s legal representative, while the latter word refers to the head servant appointed to manage the household or property (compare 2Macc 11:1; 13:2). There would, however, not be any such hard-and-fast line between their respective duties; these might vary with every master, or might be combined in one individual.<P>(1) In the Gospels.<P>The idea seems to have been perfectly familiar to the people in Christ\'s day. Every household of distinction seems to have had a steward in charge, Herod\'s steward was named Chuzas, and his wife, Joanna, followed and ministered to Jesus (<a onClick="return mV(\'Luk\',8,3);">Lu 8:3</a>). The word epitropos used here is held by some scholars to imply that he had charge of the education of Herod\'s children. This is very probable but not certain. In the parable of the Laborers in the Vineyard, it is the steward who pays the laborers at the close of the day (<a onClick="return mV(\'Mat\',20,8);">Mt 20:8</a>). The parable of the Unjust Steward best illustrates the practice. This steward was a freeman, had full charge of his master\'s affairs and could use them to his own advantage if he chose, was fully accountable to his master and had to render an account when called upon. If unfaithful he was usually discharged at once (<a onClick="return mV(\'Luk\',16,\'1-13\');">Lu 16:1-13</a>). The parables of the Minae or Pounds (<a onClick="return mV(\'Luk\',19,\'12-27\');">Lu 19:12-27</a>), the Talents (<a onClick="return mV(\'Mat\',25,\'14-30\');">Mt 25:14-30</a>), and the Wicked Husbandmen (<a onClick="return mV(\'Mat\',21,\'33-46\');">Mt 21:33-46</a>) teach similar truths. In His warning to His disciples Jesus seems to imply that they were to act as stewards in His absence (<a onClick="return mV(\'Luk\',12,42);">Lu 12:42</a>). According to this passage a steward\'s task was to manage all the affairs of his master, attend to receipts and expenditures, and portion out to each one of the household what should come to him. The disciples were left thus in charge of His gospel and were to use this gift to the best advantage in behalf of others until His return. In <a onClick="return mV(\'Jhn\',2,8);">Joh 2:8</a> the term "ruler" is given in the margin as "steward." The one referred to here was really director of the feast rather than steward, though in a sense charged with the responsibility of conducting it. Many stewards were no doubt slaves, as is implied in <a onClick="return mV(\'Mat\',24,45);">Mt 24:45</a>, while others were freedmen (<a onClick="return mV(\'Luk\',16,\'1-21\');">Lu 16:1-21</a>).<P>(2) In the Epistles.<P>The application of this term is largely confined to the ministry of the gospel. Paul and his fellow-laborers regarded themselves as stewards of the mysteries of God (<a onClick="return mV(\'1Cr\',4,1,2);">1Co 4:1,2</a>). The idea is that he take scrupulous care of that which was entrusted to him, and give it out to others faithfully and as directed by his master Jesus Christ. A bishop or overseer is to be as God\'s steward (<a onClick="return mV(\'Tts\',1,7);">Tit 1:7</a>). Peter considered himself and all other Christians as "stewards of the manifold grace of God" (<a onClick="return mV(\'1Pe\',4,10);">1Pe 4:10</a>). The prevalence of the custom of having guardians and stewards over children in their minority is shown in <a onClick="return mV(\'Gal\',4,2);">Ga 4:2</a>. The difference in meaning of the two words used here is stated above. In <a onClick="return mV(\'Rom\',16,23);">Romans 16:23</a> Erastus is called the oikonomos of the city. This is best translated "treasurer." Erastus was thus an influential member of the community of Corinth and evidently a faithful Christian.``146';
isbe[8416]='Stewpan`stu\'-pan (<a onClick="return mV(\'Lev\',11,35);">Le 11:35</a> margin).`<a href="./study/isbe/search.html?string=PAN">PAN</a>`1';
isbe[8417]='Stiff-Necked`stif\'-nekt (qesheh \'oreph, literally, "hard of neck"): As it is figuratively used, both in the Old Testament and in the New Testament, the word means "stubborn," "untractable," "not to be led." The derivation of the idea was entirely familiar to the Jews, with whom the ox was the most useful and common of domestic animals. It was especially used for such agricultural purposes as harrowing and plowing (<a onClick="return mV(\'Jdg\',14,18);">Jud 14:18</a>; <a onClick="return mV(\'1Cr\',9,9);">1Co 9:9</a>).<P>The plow was usually drawn by two oxen. As the plowman required but one hand to guide the plow, he carried in the other an "ox-goad." This was a light pole, shod with an iron spike. With this he would prick the oxen upon the hind legs to increase their speed, and upon the neck to turn, or to keep a straight course when deviating. If an ox was hard to control or stubborn, it was "hard of neck," or stiff-necked. Hence, the figure was used in the Scriptures to express the stubborn, untractable spirit of a people not responsive to the guiding of their God (<a onClick="return mV(\'Exd\',32,9);">Ex 32:9</a>; <a onClick="return mV(\'Exd\',33,3);">33:3</a>; <a onClick="return mV(\'Deu\',9,6);">De 9:6</a>; <a onClick="return mV(\'2Ch\',36,13);">2Ch 36:13</a>; <a onClick="return mV(\'Jer\',17,23);">Jer 17:23</a>, etc.). See also the New Testament where sklerotrachelos, is so translated (<a onClick="return mV(\'Act\',7,51);">Ac 7:51</a>), "Ye stiff-necked and uncircumcised in heart and ears, ye do always resist the Holy Spirit.". Compare Baruch 2:30,33.``52';
isbe[8418]='Still`stil: "To be still" is "to keep silence" (<a onClick="return mV(\'Psa\',4,4);">Ps 4:4</a>, etc.) and so "to be quiet" (<a onClick="return mV(\'Psa\',107,29);">Ps 107:29</a>, etc.) or "inactive" in any way (<a onClick="return mV(\'Jdg\',18,9);">Jud 18:9</a>; <a onClick="return mV(\'1Ki\',22,3);">1Ki 22:3</a>; <a onClick="return mV(\'Zec\',1,11);">Zec 1:11</a>, etc.). So "be still" in <a onClick="return mV(\'Psa\',46,10);">Ps 46:10</a> means "desist from your war" (compare the Revised Version margin "let be"). The "still small voice" of <a onClick="return mV(\'1Ki\',19,12);">1Ki 19:12</a> (the Revised Version margin "sound of gentle stillness") is due to taking the Hebrew demamah in its literal force of "silent," but the word here means "whisper"—"a whispering, little voice." This familiar passage, however, has made "still voice" good English, and the combination is used in <a onClick="return mV(\'Job\',4,16);">Job 4:16</a> by the Revised Version margin. In <a onClick="return mV(\'Psa\',23,2);">Ps 23:2</a> the translation "still waters" takes "waters of rest" (so literally for menuchah; compare the Revised Version margin) to mean "waters with little motion." But the meaning is either "wells by which the flocks rest" or "wells that give refreshing water." As an adverb "still" is perhaps more emphatic than in modern English; compare "power to keep still the kingdom," <a onClick="return mV(\'2Ch\',22,9);">2Ch 22:9</a> the King James Version (the Revised Version (British and American) "to hold the kingdom").``48';
isbe[8419]='Sting`sting (parash, "to cut into"; kentron, "a goad," "spur"): A sharp, pointed organ or instrument for inflicting wounds by puncture; sting of an adder, <a onClick="return mV(\'Pro\',23,32);">Pr 23:32</a>; of scorpions, <a onClick="return mV(\'Rev\',9,10);">Re 9:10</a>. In the free quotation of <a onClick="return mV(\'1Cr\',15,55);">1Co 15:55</a> from <a onClick="return mV(\'Hsa\',13,14);">Ho 13:14</a>, death is personified as a deadly animal, like a scorpion or serpent, which inflicts destruction by means of sin as its kentron. It should also be remembered that in <a onClick="return mV(\'Act\',26,14);">Ac 26:14</a> the same Greek word is used with reference to an instrument for exciting fear, rather than death. Both figures are pertinent; for death is powerless, except through sin, and, also, when sin is vanquished, the fear of death (<a onClick="return mV(\'Hbr\',2,15);">Heb 2:15</a>) is gone.``84';
isbe[8420]='Stir, Stir Up`stur: Used transitively and intransitively to indicate inner, concentrated movement; translates a number of Hebrew and Greek verbs, each of which has its different shade of meaning. Thus, e.g. in <a onClick="return mV(\'Psa\',39,2);">Ps 39:2</a>, we have \'akhar, "to be troubled," "excited"; in <a onClick="return mV(\'Sgs\',2,7);">So 2:7</a>, \'ur, "to awake," "disturb" (by the festal dances and songs). In <a onClick="return mV(\'2Ti\',1,6);">2Ti 1:6</a>, it stands for Greek anazopureo, used of the resuscitation of a flame; in <a onClick="return mV(\'2Pe\',1,13);">2Pe 1:13</a>; <a onClick="return mV(\'2Pe\',3,1);">3:1</a>, Greek diegeiro, "to awaken from sleep or stupor"; in <a onClick="return mV(\'Act\',21,27);">Ac 21:27</a>, Greek sugcheo, "to commingle," vividly portraying the confusion and tumult that resulted; in <a onClick="return mV(\'Act\',13,50);">Ac 13:50</a>, Greek parotruno, "to urge on"; <a onClick="return mV(\'Act\',17,13);">Ac 17:13</a>, Greek saleuo, "to shake to and fro."``1';
isbe[8421]='Stock`stok: In English Versions of the Bible is used for:<P>(1) The stem of a tree, whether alive (<a onClick="return mV(\'Job\',14,8);">Job 14:8</a>; <a onClick="return mV(\'Isa\',40,24);">Isa 40:24</a>) or cut down (<a onClick="return mV(\'Isa\',44,19);">Isa 44:19</a>; Wis 14:21). In <a onClick="return mV(\'Jer\',2,27);">Jer 2:27</a>; <a onClick="return mV(\'Jer\',3,9);">3:9</a>; <a onClick="return mV(\'Hsa\',4,12);">Ho 4:12</a>, where the Hebrew has simply \'ets, "wood," either meaning is possible (tree-worship? idolatry?). In <a onClick="return mV(\'Jer\',10,8);">Jer 10:8</a> the text is doubtful.<P>(2) A family (<a onClick="return mV(\'Lev\',25,47);">Le 25:47</a>; 1Es 5:37; Tob 5:13; 1Ma 12:21; 2Ma 1:10; <a onClick="return mV(\'Act\',13,26);">Ac 13:26</a>; <a onClick="return mV(\'Phl\',3,5);">Php 3:5</a>).<P>(3) Elsewhere (<a onClick="return mV(\'Job\',13,27);">Job 13:27</a>, etc.) the word refers to an instrument of punishment.`<a href="./study/isbe/search.html?string=PUNISHMENTS">PUNISHMENTS</a>`1';
isbe[8422]='Stoics`sto\'-iks (Stoikoi):<P>1. Origin and Propagation<P>2. Metaphysics and Religion<P>3. Sensationalist Epistemology<P>4. Ethical Teaching<P>5. Relation to Christianity<P>LITERATURE<hr /><P>1. Origin and Propagation:<P>The name was derived from the Stoa Poikile, the painted porch at Athens, where the founders of the school first lectured. This school of Greek philosophy was founded at Athens circa 294 BC by Zeno (circa 336-264 BC), a native of Citium, a Greek colony in Cyprus. But the Semitic race predominated in Cyprus, and it has been conjectured that Zeno was of Semitic rather than Hellenic origin. His Greek critics taunted him with being a Phoenician. It has therefore been suggested that the distinctive moral tone of the system was Semitic and not Hellenic. Further color is given to this view by the fact that Zeno\'s immediate successors at the head of the school also hailed from Asia Minor, Cleanthes (331-232 BC) being a native of Assos, and Chrysippus (280-206 BC) of Soli in Cilicia. Several other adherents of the system hailed from Asia Minor, and it flourished in several Asiatic cities, such as Tarsus and Sidon. In the 2nd century BC the doctrine was brought to Rome by Panaetius of Rhodes (circa 189-109 BC), and in the course of the two succeeding centuries it spread widely among the upper classes of Roman society. It reckoned among its adherents a Scipio and a Cato, Seneca and Marcus Aurelius, as well as the freedman Epictetus. The most adequate account of the teaching of the Greek Stoics has been preserved in the writings of Cicero, who, however, was a sympathetic critic, rather than an adherent of the school. The system acquired its most lasting influence by its adoption as the formative factor in the jurisprudence of imperial Rome, and Roman law in its turn contributed to the formation of Christian doctrine and ethics.<P>2. Metaphysics and Religion:<P>The main principles of Stoicism were promulgated by Zeno and Cleanthes, and Chrysippus formulated them into a systematic doctrine which became a standard of orthodoxy for the school, and which permitted but little freedom of speculation for its subsequent teachers. Whatever may have been the Semitic affinities of mind of Zeno and his followers, they derived the formal principles of their system from Greek antecedents. The ethical precept, "Follow Nature," they learnt from the Socratic school of Antisthenes, the Cynics. But they followed the earlier philosopher Heraclitus in defining the law of Nature as reason (logos), which was at once the principle of intelligence in man, and the divine reason immanent in the world. This doctrine they again combined with the prevalent Greek hylozoism, and therefore their metaphysics inclined to be a materialistic pantheism. On the one side, Nature is the organization of material atoms by the operation of its own uniform and necessary laws. On the other side, it is a living, rational being, subduing all its parts to work out a rational purpose inherent in the whole. As such it may be called Providence or God.<P>While the Stoics rejected the forms and rites of popular religion, they defended belief in God and inculcated piety and reverence toward Him. Their pantheism provided a basis for Greek polytheism also alongside of their monism, for where all the world is God, each part of it is divine, and may be worshipped. Another consequence of their pantheism was their attitude to evil, which they held to be only apparently or relatively evil, but really good in the harmony of the whole. Therefore they bore evil with courage and cheerfulness, because they believed that "all things worked together for good" absolutely.<P>3. Sensationalist Epistemology: The materialistic trend of their metaphysics also comes out in their epistemology, which was sensationalist. The human mind at its birth was a tabula rasa. Its first ideas were derived from sensations, the impressions made by the external world upon the soul, which they also conceived as a material body, though made of finer atoms than the external body. Out of these sense-impressions the mind built up its intuitions or preconceptions, and its notions, which constituted its store of ideas. It is not clear how far they attributed originative power to the mind as contributing some factor to the organization of knowledge, which was not derived from experience. The Stoic system is never consistently materialistic, nor consistently idealistic. Most of its terms are used in a dual sense, material and spiritual.<P>4. Ethical Teaching:<P>But its ethical teaching shows that the main trend of the system was spiritualistic. For its crown and climax was the ethics. The Stoics did not pursue knowledge for its own sake. They speculated about ultimate problems only for the practical purpose of discovering a rule of life and conduct. And in their ethics, the great commandment, "Follow Nature," is interpreted in a distinctly idealistic sense. It means, "Follow reason," as reason inheres both in man and in the universe as a whole. It is submission to Providence or the rational order of the universe, and the fulfillment of man\'s own rational nature. The life according to Nature is man\'s supreme good. How actual Nature could be the ideal good that man ought to seek, or how man was free to pursue an ideal, while he was bound in a system of necessity, were fundamental paradoxes of the system which the Stoics never solved. They summed up their moral teaching in the ideal of the sage or the wise man. His chief characteristic is ataraxy, a calm passionless mastery of all emotions, and independence of all circumstances. He therefore lives a consistent, harmonious life, in conformity with the perfect order of the universe. He discovers this order by knowledge or wisdom. But the Stoics also defined this ideal as a system of particular duties, such as purity in one\'s self, love toward all men, and reverence toward God. In Stoic ethics, Greek philosophy reached the climax of its moral teaching. Nowhere else outside Christianity do we find so exalted a rule of conduct for the individual, so humane, hopeful and comprehensive an deal for society.<P>5. Relation to Christianity:<P>When "certain...of the Epicurean and Stoic philosophers encountered" Paul at Athens, and when, after the apostle had spoken on Mars\' Hill, "some mocked; but others said, We will hear thee concerning this yet again" (<a onClick="return mV(\'Act\',17,18,32);">Ac 17:18,32</a>), it is no improbable inference that the Epicureans mocked, while the Stoics desired to hear more. For they would find much in the apostle\'s teaching that harmonized with their own views. Paul\'s quotation from the classics in his Athenian speech was from the Stoic poet, Aratus of Soli in Cilicia: "For we are also his offspring." His doctrine of creation, of divine immanence, of the spirituality and fatherhood of God, would be familiar and acceptable to them. His preaching of Christ would not have been unwelcome to them, who were seeking for the ideal wise man. Paul\'s moral teaching as it appears in his Epistles reveals some resemblance to Stoic ethics. it is possible that Paul had learnt much from the Stoic school at Tarsus. It is certain that subsequent Christian thought owed much to Stoicism. Its doctrine of the immanent Logos was combined with Philo\'s conception of the transcendent Logos, to form the Logos doctrine through which the Greek Fathers construed the person of Christ. And Stoic ethics was taken over almost bodily by the Christian church.<P>See <a href="./study/isbe/search.html?string=EPICUREANS">EPICUREANS</a>; <a href="./study/isbe/search.html?string=PHILOSOPHY">PHILOSOPHY</a>.<P>LITERATURE. The chief extant sources are the writings of Cicero, De Finibus, De Natura Deorum, etc.; Seneca, Plutarch, M. Antoninus Aurelius, Epictetus, Diogenes Laertius, Sextus Empiricus and Stobaeus. Modern works: H. von Arnim, Stoicorum veterum fragmenta; Zeller, Stoics, Epicureans and Sceptics; R. D. Hicks, Stoic and Epicurean; W. L. Davidson, The Stoic Creed; E. V. Arnold, Roman Stoicism, which contains a full bibliography and deals with the relation of Stoicism to Christianity; on the latter point see also Lightfoot, Philippians, Excursus II, "St. Paul and Seneca"; histories of philosophy by Rogers, Windelband, Ueberweg, and E. Caird.``145';
isbe[8423]='Stomach`stum\'-uk (stomachos): In man and most vertebrates, a membranous sac-like portion of the alimentary canal, in which the earlier stages of digestion take place and in which food is prepared to yield its nourishment (<a onClick="return mV(\'1Ti\',5,23);">1Ti 5:23</a>).<P>Used figuratively of pride, "A proud look and high stomach" (<a onClick="return mV(\'Psa\',101,7);">Ps 101:7</a>, Prayer-book Version), and courage, "Stirring up her womanish thoughts with a manly stomach" (2Macc 7:21 the King James Version, the Revised Version (British and American) "with manly passion").``1';
isbe[8424]='Stomacher`stum\'-uk-er: Used to translate pethighil (<a onClick="return mV(\'Isa\',3,24);">Isa 3:24</a> the King James Version), where the meaning is uncertain. The English word denotes that part of a woman\'s dress which covered the breast and the pit of the stomach. It was usually much ornamented.``1';
isbe[8425]='Stone, Stones`ston, stonz:<P>1. Hebrew and Greek Words:<P>(1) Chiefly \'ebhen, and lithos; but also, occurring rarely, \'eshekh (<a onClick="return mV(\'Lev\',21,20);">Le 21:20</a>); tsur (<a onClick="return mV(\'Job\',22,24);">Job 22:24</a>), usually "rock"; tseror (<a onClick="return mV(\'2Sa\',17,13);">2Sa 17:13</a>); petros (<a onClick="return mV(\'Jhn\',1,42);">Joh 1:42</a>); psephos (<a onClick="return mV(\'Rev\',2,17);">Re 2:17</a>). For cela\', usually "cliff," "crag," "rock," the King James Version, in <a onClick="return mV(\'Psa\',137,9);">Ps 137:9</a>; <a onClick="return mV(\'Psa\',141,6);">141:6</a>, has "stone," but the Revised Version (British and American) "rock." For the King James Version "stones," cheres (<a onClick="return mV(\'Job\',41,30);">Job 41:30</a>), the Revised Version (British and American) has "potsherds."<P>See <a href="./study/isbe/search.html?string=SELA">SELA</A>.<P>2. Literal Usage:<P>The word is used of great stones (<a onClick="return mV(\'Gen\',29,2);">Ge 29:2</a>); of small stones (<a onClick="return mV(\'1Sa\',17,40);">1Sa 17:40</a>); of stones set up as memorials (<a onClick="return mV(\'1Sa\',7,12);">1Sa 7:12</a>, "Eben-ezer," "stone of help"); of precious stones (<a onClick="return mV(\'Exd\',35,9);">Ex 35:9</a>, etc.); of hailstones (<a onClick="return mV(\'Jos\',10,11);">Jos 10:11</a>).<P>3. Figurative Usage: Of hardness: "I will take the stony heart out of their flesh" (<a onClick="return mV(\'Eze\',11,19);">Eze 11:19</a>); of one smitten: "(Nabal\'s) heart died within him, and became as a stone" (<a onClick="return mV(\'1Sa\',25,37);">1Sa 25:37</a>); of weight: "A stone is heavy, and the sand weighty" (<a onClick="return mV(\'Pro\',27,3);">Pr 27:3</a>); of dumbness: "Woe unto him that saith to the wood, Awake; to the dumb stone, Arise!" (<a onClick="return mV(\'Hab\',2,19);">Hab 2:19</a>); of Jerusalem: "I will make Jerusalem a burdensome stone for all the peoples" (<a onClick="return mV(\'Zec\',12,3);">Zec 12:3</a>); of the corner-stone as a figure of high position:<P class="in15">"The stone which the builders rejected<br>Is become the head of the corner" (<a onClick="return mV(\'Psa\',118,22);">Ps 118:22</a>).<P>See <a href="./study/isbe/search.html?string=FLINT">FLINT</A>; <a href="./study/isbe/search.html?string=ROCK">ROCK</A>.<P>(2) Used also anatomically of the testicles (<a onClick="return mV(\'Lev\',21,20);">Le 21:20</a>; <a onClick="return mV(\'Deu\',23,1);">De 23:1</a>; <a onClick="return mV(\'Job\',40,17);">Job 40:17</a>, pachadh, the Revised Version (British and American) "thighs").``37';
isbe[8426]='Stone-Squarers`ston\'-skwar-erz: the King James Version in <a onClick="return mV(\'1Ki\',5,18);">1Ki 5:18</a>; the Revised Version (British and American) "<a href="./study/isbe/search.html?string=GEBALITES">the Gebalites</a>" (which see).``1';
isbe[8427]='Stones, Precious`1. Ancient and Modern Names<P>2. Change of Signification of Names<P>3. Three Important Lists of Stones<P>4. Interpretation of Greek Names Used by John<P>5. Interpretation of Hebrew Names<P>6. Greek and Latin Equivalents of Hebrew Names<P>7. Inconsistencies of Text or Translation<P>8. Vulgate and Septuagint<P>9. Hebrew Texts of Septuagint and English Versions of the Bible<P>10. Equivalence of Hebrew and Greek Names<P>11. Interpretation of Greek Names Used by Septuagint<P>12. List of Names with Biblical References<hr /><P>1. Ancient and Modern Names:<P>Great difficulty is met with in any attempt to translate the Greek and Hebrew names mentioned in the Bible into names that would be used for the same minerals in a particular country at the present day. It is only within the last century, through the development of the sciences of chemistry and crystallography, that it has become possible to define mineral species with any considerable approach to precision. In ancient times various minerals were regarded as belonging to a single kind, and indicated by a single name, that are now distributed into different kinds and mentioned under different names.<P>For example, 2,000 years ago the Greek term anthrax was used to signify various hard, transparent, red stones that are now known to differ much from one another in chemical composition, and are therefore assigned to different species and given different names; among them are oriental ruby (red corundum), balas ruby (red spinel), almandine and pyrope (red garnets); a stone designated anthrax by the ancient Greeks might thus belong to any one of a number of various kinds to the assemblage of which no name is now given, and the word anthrax has no simple equivalent in a modern language.<P>2. Change of Signification of Names:<P>Confusion is introduced in another way. The English names of most of the precious stones mentioned in the Bible are adaptations of Greek names through the Latin; for instance, the English word "topaz" is a modification of the Latin word topazius, itself merely a Latin form of the Greek word topazion. It would at first sight appear that the Greek word topazion must be translated into English by the word "topaz"; but, strangely, although the words are virtually identical, the stones indicated by the words are quite different. The topazion of the ancient Greeks was a green stone yielding to the action of a file and said to be brought from an island in the Red Sea, whereas the topaz of the present day is not a green stone, does not yield to the action of a file, and has not been brought from an island in the Red Sea. The topazion of the ancient Greeks is really the peridot, not the topaz, of modern mineralogy; topazion and topaz are different kinds of stone. For the interpretation of the Bible it is thus necessary to ascertain, if possible, the kind of stone to which a Greek or Hebrew name was applied at the time when the word was written.<P>3. Three Important Lists of Stones:<P>Most of the names of the precious stones mentioned in the Bible are contained in the Hebrew description of the breastplate of the high priest and the Greek description of the foundations of the New Jerusalem. The ornaments assigned to the king of Tyre (<a onClick="return mV(\'Eze\',28,13);">Eze 28:13</a>) included only stones that had been used in the breastplate; indeed, in the Septuagint, they are the same twelve, mentioned in precisely the same order.<P>The stones of the breastplate according to our Hebrew text (<a onClick="return mV(\'Exd\',28,\'17-21\');">Ex 28:17-21</a>) were:<P>The foundations of the New Jerusalem are (<a onClick="return mV(\'Rev\',21,19,20);">Re 21:19,20</a>):<P>1 iaspis<P>2 sappheiros<P>3 chalkedon<P>4 smaragdos<P>5 sardonux<P>6 sardion<P>7 chrusolithos<P>8 berullos<P>9 topazion<P>10 chrusoprasos<P>11 huakinthos<P>12 amethustos<P>Only 4 of the latter stones are mentioned elsewhere in the New Testament, also in the Book of Revelation, namely: iaspis (<a onClick="return mV(\'Rev\',4,3);">4:3</a>; <a onClick="return mV(\'Rev\',21,18);">21:18</A>), smaragdos (<a onClick="return mV(\'Rev\',4,3);">4:3</A>), sardion (<a onClick="return mV(\'Rev\',4,3);">4:3</a>) and huakinthos (<a onClick="return mV(\'Rev\',9,17);">9:17</A>).<P>4. Interpretation of Greek Names Used by John:<P>For the interpretation of the Greek names used by John, much help is given by Pliny\'s great work on Natural History, published 77 AD, for it records what was known about precious stones at the very time when John himself was living. The Greek names of stones and their Latin verbal equivalents had presumably the same signification for both these writers; it is thus possible, in some cases at least, to ascertain what name is now assigned to a stone mentioned in the New Testament if the name and description are recorded in the treatise of Pliny; the results are given in the alphabetical list below. All twelve stones, except chalkedon, are mentioned by Pliny; the few important stones described by him, but not mentioned by John as foundations, are crystallum and adamas, both of them colorless; onyx, remarkable rather for structure than color; electrum (amber), a soft material; carbunculus, fiery red; callaina, pale green, probably turquoise; cyanus, dark blue; and opalus (opal); ranked in Pliny\'s time immediately after smaragdus in value. Achates (agate) is omitted, but was no longer precious.<P>5. Interpretation of Hebrew Names:<P>In the interpretation of the Hebrew names of the stones of the breastplate there is much greater difficulty, for no Hebrew literature other than the Old Testament has been preserved, and little help is afforded by the contexts of other verses in which some of the Hebrew names of precious stones occur. If we could assume that the Septuagint and the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) versions of the description of the breastplate were made from Hebrew texts absolutely identical in respect of the names of the stones with those used for the preparation of the English Versions of the Bible, and that the versions were correctly made, the Greek equivalents of the Hebrew terms for the time of the Septuagint translators (about 280 BC) and their Latin equivalents for the time of Jerome (about 400 AD) would be directly determinable by collation of the Hebrew original with the Greek and Latin translations.<P>It must be remembered, however, that a Hebrew writer, in describing the arrangement of a row of stones, began with that on his right and mentioned them in the order right to left, while a western writer begins with the stone on his left and mentions them in the reverse order. Hence, in translating a Hebrew statement of arrangement into a western language, one may either translate literally word by word, thus adopting the Hebrew direction of reading, or, more completely, may adopt the western direction for the order in the row. As either method may have been adopted by the Septuagint translators, it follows that \'odhem and bareqeth, the first and last stones of the 1st row according to our Hebrew text, may respectively be equivalent either to sardion and smaragdos, or, conversely, to smaragdos and sardion; and similarly for the other rows. The number of the middle stone of any row is the same whichever direction of reading is adopted. \'Odhem being red, and sardion and smaragdos respectively red and green (see below), \'odhem must be equivalent to the former, not the latter, and the Septuagint translators must have adopted the Hebrew direction of reading the rows.<P>6. Greek and Latin Equivalents of Hebrew Names:<P>Other sets of possible equivalents are derivable by collation of the Biblical description with each of the two descriptions given by Josephus (Ant., III, vii, 5; BJ, V, v, 7). The possible Greek and Latin equivalents of Hebrew names are thus as follows:<P>It may be remarked, as regards the 1st stone of the 1st row, that in the time of Josephus the stone sardonux could be signified also by the more general term sardion; and, as regards the 1st stone of the 2nd row, that anthrax and carbo being respectively Greek and Latin for "glowing coal," anthrax and carbunculus, diminutive of carbo, were used as synonyms for certain red stones.<P>7. Inconsistencies of Text or Translations<P>From the inconsistencies of the above table of possible equivalents it may be inferred that either<P>(1) essentially different translations were given in several cases for the same Hebrew word, or<P>(2) the Hebrew texts used in the preparation of the Septuagint and the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) versions were, in respect of the precious stones, different from each other and from that used in the preparation of English Versions of the Bible, or<P>(3) the breastplate differed at different epochs, or<P>(4) one or other, or both, of the descriptions by Josephus are incorrect. Conceivably differences may have arisen in all the above-mentioned ways.<P>(1) Inconsistency of Septuagint Translators<P>That the Septuagint translators were uncertain as to the correct translation of the Hebrew names used for the precious stones into the Greek names used in their time, and that they translated the Hebrew name of a stone in more than one way may be shown as follows. In the Hebrew text corresponding to English Versions of the Bible the word shoham, designating the 2nd stone of the 4th row of the breastplate, occurs also in several verses where there is no mention of other stones, and where there is thus no risk of accidental interchange, such as may easily occur when technical terms, more especially if unintelligible to the transcriber, are near to one another in the text. Now, for our versions shoham has been systematically translated "onyx," and for the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) the Hebrew word having the same position in the text has been systematically translated by a Latin synonym of onyx, namely, lapis onychinus (except in <a onClick="return mV(\'Job\',28,16);">Job 28:16</a>, where lapis sardonychus is the rendering). Hence, it is probable that the word in these particular verses was shoham in the Hebrew original of the Vulgate, and therefore also of the Hebrew original of the Septuagint. Yet in the Septuagint the Hebrew word is translated soom (<a onClick="return mV(\'1Ch\',29,2);">1Ch 29:2</a>, indicating that the translator, not knowing the Greek word for shoham, gave merely its Greek transliteration) as well as smaragdos (<a onClick="return mV(\'Exd\',28,9);">Ex 28:9</a>; <a onClick="return mV(\'Exd\',35,27);">35:27</a>; <a onClick="return mV(\'Exd\',39,6);">39:6</a> or Septuagint / LXX <a onClick="return mV(\'Exd\',36,13);">Ex 36:13</a>), prasinos (<a onClick="return mV(\'Gen\',2,12);">Ge 2:12</a>), sardion (<a onClick="return mV(\'Exd\',25,7);">Ex 25:7</a>; <a onClick="return mV(\'Exd\',35,9);">35:9</a> or Septuagint <a onClick="return mV(\'Exd\',35,8);">Ex 35:8</a>), onux (<a onClick="return mV(\'Job\',28,16);">Job 28:16</a>).<P>These differences suggest that there were different Septuagint translators, even for different chapters of the same book, and that little care was taken by them to be consistent with one another in the translation of technical terms.<P>(2) Differences of Hebrew Texts<P>That the Hebrew texts used for the Septuagint, Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) and English Versions of the Bible were not identical in all the verses in which there is mention of precious stones is especially clear from an analysis of the respective descriptions of the ornaments of the king of Tyre (<a onClick="return mV(\'Eze\',28,13);">Eze 28:13</a>). In the Septuagint 12 stones are mentioned; as already stated, they have precisely the same names and are mentioned in precisely the same order as the stones of the breastplate described in that version, the only difference being that gold and silver are inserted in the middle of the list. On the other hand, in Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) and English Versions of the Bible descriptions of the ornaments, only 9 of the 12 stones of the breastplate are mentioned; they are not in the same order as the corresponding stones in the breastplate as described in those VSS, silver is not mentioned at all, while gold is placed, not in the middle, but at the end of the list. Further, the order of mention of the stones in English Versions of the Bible differs from that of mention in Vulgate.<P>(3) Changes in the Breastplate<P>That the breastplate in use in the time of the Septuagint translators (about 280 BC) may have been different from the one described in the Book of Exodus is manifest if we have regard to the history of the Jewish nation; for Jerusalem was captured by Shishak, king of Egypt, about 973 BC, by Nebuchadnezzar, king of Babylon, about 586 BC, and by Ptolemy Soter, king of Egypt, about 320 BC. The original breastplate may have been part of the spoil on one or other of these occasions, and have then disappeared forever.<P>Again, between the times of the Septuagint translators and Josephus, Jerusalem was more than once in the hands of its enemies; in 198 BC the city was captured by Antiochus the Great; in 170 BC it was stormed, and its temple plundered, by Antiochus Epiphanes; in 54 BC the temple was desecrated by Crassus. The breastplate familiar to Josephus (for he was long a priest in the temple of Jerusalem) may thus not have been identical with that in use when the Septuagint version was made.<P>And if the signification of the Hebrew names of the stones had not been carefully passed down from one generation to another while the breastplate was no longer in existence (for instance, during the Babylonian captivity), or if stones like those of the original breastplate were not available when a new breastplate was being made, there would inevitably be differences in the breastplate at different times.<P>The probability of this hypothesis of one or more replacements of the breastplate is still further increased if we have regard to the large stones that were set in gold buttons and fastened to the shoulderpieces of the ephod, the vestment to which the breastplate itself was attached (<a onClick="return mV(\'Exd\',28,9);">Ex 28:9</a>; <a onClick="return mV(\'Exd\',39,6);">39:6</a> or Septuagint <a onClick="return mV(\'Exd\',36,13);">Ex 36:13</a>). According to the Septuagint, the material was smaragdos (and therefore green); according to Josephus it was sardonux (and therefore red with a layer of white). Though the Septuagint translators may never have had opportunities of looking closely at the stones, they might be expected to know the color of the material; Josephus must have seen them often. But the complete difference of colors of smaragdos and sardonux suggests that the difference of the names is due, not to a Septuagint mistranslation of the Hebrew name shoham, but to an actual difference of the material; it may have been smaragdos (and green) at the time when the Septuagint translation was made, and yet sardonux (and red with a layer of white) in the time of Josephus.<P>(4) Descriptions Given by Josephus<P>That in respect of the breastplate it is unsafe to collate the Hebrew texts of the various versions with that of Josephus may be demonstrated as follows. The 2nd stone of the 2nd row, termed cappir in our Hebrew text, is termed sappheiros in the Septuagint and sapphirus in the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) Wherever else cappir occurs in our Hebrew text, sappheiros occurs in the corresponding place in the Septuagint and sapphirus in the Vulgate; it may thus be inferred that in respect of the word cappir our Hebrew text and the Hebrew texts used for the Septuagint and Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) versions were in complete accord with one another. Also, it is certain that the Latin word sapphirus was derived from the Greek word sappheiros, and that either the latter had its origin in the Hebrew word cappir or that both words had the same source. There is no reason to think that from the time of the Septuagint translators to that of Jerome the word sappheiros was ever used to signify any other than one kind of stone or that the kind was ever called iaspis. But in both the descriptions given by Josephus the middle stone of the 2nd row is given as iaspis, not as sappheiros, which he makes the last stone of the row. Hence, for the middle stone of the 2nd row, the Hebrew texts were concordant in giving the name cappir, but they fundamentally differed from that of Josephus whose two descriptions agree in giving the name iaspis; it is not a difference of mere nomenclature or translation, but of the kind of stone set in a definite part of the breastplate. This being the case, collation of the Hebrew, Septuagint and Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) descriptions of the breastplate with those given by Josephus cannot be relied on to give a true Greek or a true Latin equivalent for the Hebrew name of any of the stones.<P>It may be added that the two descriptions given by Josephus differ from each other only as regards the order of the stones in the last two rows; in the 3rd row, the order is precisely reversed; in the 4th row the order is chrusolithos, onuchion, berullion for Ant, and onuchion, berullion, chrusolithos for BJ. Josephus, Antiquities was written at greater leisure than BJ, and was not completed till 18 years later; Josephus had thus more time for the consultation of old manuscripts. Speaking generally, it is more accurate than his earlier treatise as regards the history of those times of which he had no direct knowledge; its description of the breastplate is more precise as regards the arrangement of the stones, and is therefore the one to which the greater weight must be given. It differs from the Septuagint only through the interchange of the 2nd and 3rd stones in the 2nd, 3rd and 4th rows; and possibly Josephus gave the order from his memory either of the Septuagint or of the actual breastplate.<P>The only difference between the descriptions given in the Septuagint and the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) is that the last two stones, namely berullion (beryllus) and onuchion (onychinus), are interchanged.<P>8. Vulgate and Septuagint:<P>As already pointed out, the Hebrew texts of the Septuagint and English Versions of the Bible must have differed completely as regards the descriptions of the ornaments of the king of Tyre; it is thus not at all certain that they were in complete accord as regards the descriptions of the breastplate. In fact, it is generally accepted that the Hebrew word yashepheh and the Greek word iaspis are virtually identical, and that they were used to signify the same kind of stone.<P>9. Hebrew Texts of Septuagint and English Versions of the Bible:<P>Hence, it follows that the Hebrew text of English Versions of the Bible is not identical with the Hebrew texts of the Septuagint and the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) versions in respect of the stones in the 2nd and 4th rows; if our Hebrew text is correct as regards yashepheh, that stone was the last stone in the last row; if the Hebrew texts of the Septuagint and Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) versions were correct, yashepheh, which had for its Greek equivalent iaspis, must have been the last stone in the 2nd row; further, onuchion (Septuagint) and beryllus (Vulgate) must be equivalent, not to yashepheh, but to some other stones of the breastplate.<P>10. Equivalence of Hebrew and Greek Names:<P>Taking these matters into consideration, the following have considerable claims to be regarded as equivalents:<P>The remaining three stones, tarshish, shoham and yahalom, are thus equivalent to chrusolithos, onuchion and berullion, but it is uncertain which Greek name corresponds to any of those Hebrew names.<P>11. Interpretation of Greek Names Used by Sepuagint:<P>For the interpretation of the Greek names of stones mentioned in the Septuagint (and thus of the Hebrew names in the original text), the work of Theophrastus, a contemporary of the Septuagint translators, is very useful. That author mentions, besides krustallos and margarites which occur elsewhere than in the description of the breastplate, nine of the Septuagint names of the breastplate stones, namely: achates, amethustos (as amethuson), anthrax, iaspis, ligurion (as lugkurion), onuchion, sappheiros, sardion, smaragdos. The three stones mentioned in the Septuagint but not by Theophrastus are berullion, chrusolithos, and topazion. Since he mentions only four stones that are not referred to in the Septuagint, namely chrusokolla, hualoeides, kuanos and omphax, it follows that the Septuagint translators at Alexandria introduced every important name that was then in use at Athens for a precious stone.<P>In the following alphabetical list references are given to all the verses in which each name of a precious stone occurs, and for each use of a translated name the corresponding word in the original text.<P>12. List of Names with Biblical References:<P>Achates (achates): probably Septuagint translation of shebho (<a onClick="return mV(\'Exd\',28,19);">Ex 28:19</a>; <a onClick="return mV(\'Exd\',39,12);">39:12</a>). It is not mentioned in Apocrypha or the New Testament.<P><a href="./study/isbe/search.html?string=ADAMANT">Adamant</a> (see also special article): in <a onClick="return mV(\'Eze\',3,9);">Eze 3:9</a>; <a onClick="return mV(\'Zec\',7,12);">Zec 7:12</a>, English Versions of the Bible translation of Hebrew shamir.<P>Agate: in <a onClick="return mV(\'Exd\',28,19);">Ex 28:19</a>; <a onClick="return mV(\'Exd\',39,12);">39:12</a>, English Versions of the Bible translation of Hebrew shebho; in <a onClick="return mV(\'Isa\',54,12);">Isa 54:12</a>; <a onClick="return mV(\'Eze\',27,16);">Eze 27:16</a>, the King James Version translation of Hebrew kadhkodh.<p>\'Achlamah: in <a onClick="return mV(\'Exd\'
