isbe[928]='Aterezaias`a-ter-e-zi\'-as (Ater to Hezekia): Usually found in the abbreviated form Ater. Head of a Jewish family, which returned with Zerubbabel, under the decree of Cyrus. Mentioned (<a onClick="return mV(\'Ezr\',2,16);">Ezr 2:16</a>) as sprung from Hezekiah. Their number is given as 98.<P>Mentioned again as found in the register of the genealogies of the first returned exiles by Nehemiah (<a onClick="return mV(\'Neh\',7,21);">Ne 7:21</a>). Again among those who sealed "the sure covenant" (<a onClick="return mV(\'Neh\',10,17);">Ne 10:17</a>). Also found in 1Esdras 5:15, where the name is given variously as Ater or Aterezaias. The number of the family, given by Esdras, is 92.``1';
isbe[929]='Atergatis`a-ter\'-ga-tis.`<a href="./study/isbe/search.html?string=ATARGATIS">ATARGATIS</a>`1';
isbe[930]='Ateta`a-te\'-ta (the King James Version Teta; Codex Alexandrinus Ateta, Codex Vaticanus, om.): Head of a family of Levites; gate keepers who returned from the captivity with Zerubbabel (1Esdras 5:28); called Hitita in <a onClick="return mV(\'Ezr\',2,42);">Ezr 2:42</a>; <a onClick="return mV(\'Neh\',7,45);">Ne 7:45</a>.``1';
isbe[931]='Athach`a\'-thak (\'athakh, "lodging-place"): One of the cities of Judah to which David sent from Ziklag the spoil of the Amalekites (<a onClick="return mV(\'1Sa\',30,30);">1Sa 30:30</a>). Its site is unknown. Driver, Budde, and Wellhausen identify it with Ether (<a onClick="return mV(\'Jos\',15,42);">Jos 15:42</a>).``1';
isbe[932]='Athaiah`a-tha\'-ya (\'athayah = "Yahweh is helper"; Athea, or Atheai): He is designated (<a onClick="return mV(\'Neh\',11,4);">Ne 11:4</a>) as a descendant of Judah and the son of Uzziah. After the return from Babylon, he dwelt in Jerusalem. In <a onClick="return mV(\'1Ch\',9,4);">1Ch 9:4</a> his name is given as Uthai.``1';
isbe[933]='Athaliah`ath-a-li\'-a (\'athalyah; meaning uncertain, perhaps, "whom Yahweh has afflicted"; <a onClick="return mV(\'2Ki\',8,26);">2Ki 8:26</a>; <a onClick="return mV(\'2Ki\',11,\'1-\');">11</a>; <a onClick="return mV(\'2Ch\',22,\'1-\');">2Ch 22</a>; <a onClick="return mV(\'2Ch\',23,\'1-\');">23</a>):<P>1. Relationship:<P>(1) Daughter of Ahab and Jezebel, grand-daughter of Omri, 6th king of Israel. In her childhood the political relations of the two kingdoms of Judah and Israel had, after many years of strife, become friendly, and she was married to Jehoram, eldest son of Jehoshaphat, king of Judah (<a onClick="return mV(\'2Ki\',8,18);">2Ki 8:18</a>). The marriage was one of political expediency, and is a blot on the memory of Jehoshaphat.<P>2. Athaliah as Queen:<P>When Jehoram was 32 years of age, he succeeded to the throne, and Athaliah became queen of Judah. She inherited her mother\'s strength of will, and like her developed a fanatical devotion to the cult of the Zidonian Baal. Elijah\'s blow at the worship of Baal in Samaria shortly before her accession to power did nothing to mitigate her zeal. It probably intensified it. The first recorded act of Jehoram\'s reign is the murder of his six younger brothers; some princes of the realm, who were known to be favorable to the ancient faith of the nation, were also destroyed (<a onClick="return mV(\'2Ch\',21,4);">2Ch 21:4</a>). There can be little doubt that these deeds of blood were supported, and perhaps instigated, by Athaliah, who was a much stronger character than her husband.<P>3. Murder of Her Grandchildren:<P>After eight years of royal life, Athaliah became a widow, and her son, Ahaziah, then 22 years of age (<a onClick="return mV(\'2Ki\',8,26);">2Ki 8:26</a>; not 42 as in <a onClick="return mV(\'2Ch\',22,2);">2Ch 22:2</a>), ascended his father\'s throne. As queen-mother, Athaliah was now supreme in the councils of the nation, as well as in the royal palace. Within a single year, the young king fell (see <a href="./study/isbe/search.html?string=JEHU">JEHU</a>), and the only persons who stood between Athaliah and the throne were her grandchildren. It is in such moments that ambition, fired by fanaticism, sees its opportunity, and the massacre of the royal seed was determined on. This was carried out: but one of them, Jehoash, a babe, escaped by the intervention of his aunt, Jehosheba (<a onClick="return mV(\'1Ki\',11,2);">1Ki 11:2</a>; <a onClick="return mV(\'2Ch\',22,11);">2Ch 22:11</a>).<P>4. Her Usurpation:<P>The palace being cleared of its royal occupants, Athaliah had herself proclaimed sovereign. No other woman, before or since, sat upon the throne of David, and it is a proof of her energy and ability that, in spite of her sex, she was able to keep it for six years. From <a onClick="return mV(\'2Ch\',24,7);">2Ch 24:7</a> we gather that a portion of the temple of Yahweh was pulled down, and the material used in the structure of a temple of Baal.<P>5. The Counter-Revolution:<P>The high priest at this time was Jehoiada, who had married the daughter of Athaliah, Jehosheba (<a onClick="return mV(\'2Ch\',22,11);">2Ch 22:11</a>). His promotion to the primacy led to the undoing of the usurper, as Jehoiada proved staunchly, if secretly, true to the religion of Yahweh. For six years he and his wife concealed in their apartments, near the temple, the young child of Ahaziah. In the seventh year a counter-revolution was planned. The details are given with unusual fullness in Kings and Chronicles, the writings of which supplement one another. Thus, when the Chronicler wrote, it had become safe to give the names of five captains who led the military rising (<a onClick="return mV(\'2Ch\',23,1);">2Ch 23:1</a>). With the Book of Kings before him, it was not necessary to do more than extract from the ancient records such particulars as had not hitherto appeared. This it is which has chiefly given rise to the charge of variations in the two narratives. See <a href="./study/isbe/search.html?string=JEHOASH">JEHOASH</a>.<P>6. Her Death:<P>At the time of her deposition, Athaliah was resident in the royal palace. When roused to a sense of danger by the acclamations which greeted the coronation ceremony, she made an attempt to stay the revolt by rushing into the temple court, alone; her guards, according to Josephus, having been prevented from following her (Ant., IX, vii, 3). A glance sufficed. It showed her the lad standing on a raised platform before the temple, holding the Book of the Law in his hand, and with the crown upon his brow. Rending her robe and shouting, "Treason! Treason!" she fled. Some were for cutting her down as she did so, but this was objected to as defiling the temple with human blood. She was, therefore, allowed to reach the door of the palace in flight. Here she fell, smitten by the avenging guards.<P>Athaliah\'s usurpation lasted for six years (<a onClick="return mV(\'2Ki\',11,3);">2Ki 11:3</a>; <a onClick="return mV(\'2Ki\',12,1);">12:1</a>; <a onClick="return mV(\'2Ch\',22,12);">2Ch 22:12</a>). Her 1st year synchronizes with the 1st of Jehu in Israel, and may be placed 846 BC (some put later). See <a href="./study/isbe/search.html?string=CHRONOLOGY+OF+THE+OLD+TESTAMENT">CHRONOLOGY OF THE OLD TESTAMENT</a>. The statement of <a onClick="return mV(\'2Ki\',12,1);">2Ki 12:1</a> is here understood in the sense that Jehoash began his public reign in the 7th year of Jehu, and that he reigned 40 years counting from the time of his father\'s death. A modern parallel is the dating of all official records and legal documents of the time of Charles II of England from the death of Charles I.<P>The only other reference to Athaliah is that above alluded to in <a onClick="return mV(\'2Ch\',24,7);">2Ch 24:7</a>, where she is spoken of as "that wicked woman."<P>(2) A Benjamite who dwelt in Jerusalem (<a onClick="return mV(\'1Ch\',8,26,28);">1Ch 8:26, 28</a>).<P>(3) Father of Jeshaiah, who returned with Ezra (<a onClick="return mV(\'Ezr\',8,7);">8:7</a>); called Gotholias in Apocrypha (1Esdras 8:33).``17';

isbe[936]='Atharim`ath\'-a-rim (\'atharim): the Revised Version (British and American) "The way of Atharim"; the King James Version "The way of the spies." the Revised Version (British and American) regards Atharim as a place (so Septuagint). The King James Version follows Syriac and Targum, rendering Atharim as if Tarim = spies. Dillmann translates "the caravan path," connecting it with Arabic athar, "a track or footprint." Here the king of Arad fought against Israel, taking some captives (<a onClick="return mV(\'Num\',21,1);">Nu 21:1</a>).`<a href="./study/isbe/search.html?string=HORMAH">HORMAH</a>`1';
isbe[937]='Atheism`a\'-the-iz\'-m (atheos, "without God" (<a onClick="return mV(\'Eph\',2,12);">Eph 2:12</a>)): Ordinarily this word is interpreted to mean a denial of the existence of God, a disbelief in God, the opposite of theism. But it seems better that we should consider it under four heads, in order to obtain a clear idea of the different meanings in which it has been used.<P>(1) The classical.<P>In this sense it does not mean a denial of the existence of a Divine Being, but the denial of the existence or reality of the god of a particular nation. Thus the Christians were repeatedly charged with atheism, because of their disbelief in the gods of heathenism. It was not charged that they did not believe in any god, but that they denied the existence and reality of the gods worshipped, and before whom the nation hitherto had bowed. This was considered so great a crime, so dangerous a thing to the nation, that it was felt to be a just cause for most cruel and determined persecutions. Socrates\' teaching cast a shadow on the reality of the existence of the gods, and this charge was brought against him by his contemporaries. Cicero also uses the word in this sense in his charge against Diagoras of Athens. Indeed, such use of it is common in all classical literature.<P>(2) Philosophic.<P>It is not meant that the various philosophic systems to which this term is applied actually deny the existence of a Divine Being or of a First Cause, but that they are atheistic in their teaching, and tend to unsettle the faith of mankind in the existence of God. There is indeed a belief in a first cause, in force, in motion, in a certain aggregation of materials producing life, but the Divine Being as taught by theism is absolutely denied. This is true of the Idealism of Fichte, of the Ideal Pantheism of Spinoza, the Natural Pantheism of Schelling, and similar forms of thought. In applying the word atheism to the teaching here given, theism does not intend to assail them as wholly without a belief in a Divine Being; but it affirms that God is a person, a self-conscious Being, not merely a first cause or force. To deny this fundamental affirmation of theism is to make the teaching atheistic, a denial of that which is essential to theism (<a onClick="return mV(\'Hbr\',11,3);">Heb 11:3</a>).<P>(3) Dogmatic.<P>It absolutely denies the existence of God. It has often been held that this is, in fact, impossible. Cousin has said, "It is impossible, because the existence of God is implied in every assertion." It is true, however, that in all ages there have been persons who declared themselves absolute atheists. Especially is this true of the 18th century a period of widespread skepticism—when not a few, particularly in France, professed themselves atheists. In many cases, however, it resulted from a loose use of the word, careless definition, and sometimes from the spirit of boastfulness.<P>(4) Practical atheism.<P>It has nothing at all to do with belief. Indeed it accepts the affirmations of theism. It has reference wholly to the mode of life. It is to live as though there was no God.<P>It takes the form often of complete indifference to the claims of the Divine Being or again of outbroken and defiant wickedness (<a onClick="return mV(\'Psa\',14,1);">Ps 14:1</a>). That this form of atheism is widely prevalent is well known. It is accompanied in many cases with some form of unbelief or prejudice or false opinion of the church or Christianity. Dogmatic atheism is no longer a menace or even a hindrance to the progress of Christianity, but practical atheism is widespread in its influence and a dangerous element in our modern life (compare <a onClick="return mV(\'Isa\',31,1);">Isa 31:1</a>; <a onClick="return mV(\'Jer\',2,13,17,18);">Jer 2:13, 17-18</a>; <a onClick="return mV(\'Jer\',18,\'13-15\');">18:13-15</a>). Whatever the form, whether it be that of religious agnosticism, denying that we can know that God exists, or critical atheism, denying that the evidence to prove His existence is sufficient, or dogmatic, or practical atheism, it is always a system of negation and as such tears down and destroys. It destroys the faith upon which all human relations are built. Since there is no God, there is no right nor wrong, and human action is neither good nor bad, but convenient or inconvenient. It leaves human society without a basis for order and human government without foundation (<a onClick="return mV(\'Rom\',1,\'10-32\');">Ro 1:10-32</a>). All is hopeless, all is wretchedness, all is tending to the grave and the grave ends all.<P>Arguments against atheism may be summarized as follows:<P>(1) It is contrary to reason. History has shown again and again how impossible it is to bring the mind to rest in this doctrine. Although Buddhism is atheistic in its teaching, idolatry is widespread in the lands where it prevails. While the Positive Philosophy of Auguste Comte was based on a denial of the existence of God, his attempt to found the new religion of humanity with rites and ceremonies of worship reveals how the longing for worship cannot be suppressed. It is a revelation of the fact so often seen in the history of human thought, that the mind cannot rest in the tenets of atheism.<P>(2) It is contrary to human experience. All history testifies that there are deep religious instincts within the human breast. To regard these as deceptive and unreasonable would itself be utterly unreasonable and unscientific. But the fact of such spiritual longing implies also that there is a Being who is responsive to and can satisfy the cry of the heart (<a onClick="return mV(\'Hbr\',11,6);">Heb 11:6</a>). In his Bampton Lectures Reville has said on this subject: "It would be irrational in the last degree to lay down the existence of such a need and such a tendency, and yet believe that the need corresponds to nothing, that the tendency has no goal."<P>(3) It fails to account for the evidence of design in the universe.<P>See <a href="./study/isbe/search.html?string=COSMOLOGY">COSMOLOGY</a>.<P>(4) It fails to account for the existence of man and the world in general. Here is the universe: how did it come to be? Here is man: how is he to be accounted for? To these and like questions, atheism and atheistic philosophy have no adequate answer to give.`<a href="./study/isbe/search.html?string=COSMOLOGY">COSMOLOGY</a>; <a href="./study/isbe/search.html?string=CREATION">CREATION</a>; <a href="./study/isbe/search.html?string=GOD">GOD</a>`87';
isbe[938]='Athenians`a-the\'-ni-ans Athenaioi: Inhabitants of Athens. Luke has a remark on their curiosity and their delight in novelty (<a onClick="return mV(\'Act\',17,21);">Ac 17:21</a>).`<a href="./study/isbe/search.html?string=ATHENS">ATHENS</a>`1';
isbe[939]='Athenobius`ath-e-no\'-bi-us [Athenobios]: A "friend" of Antiochus VII (Sidetes), who was sent to Jerusalem by the king to protest against the occupation of Joppa and Gazara, and the citadel Jerusalem. A demand was made on Simon Maccabeus to give up all the places he had taken or pay 1,000 talents in silver. Simon declined to pay more than 100 talents, and Athenobius returned to Antiochus from his fruitless mission (1Macc 15:28-36).``1';
isbe[940]='Athens`ath\'-enz Athenai In antiquity the celebrated metropolis of Attica, now the capital of Greece. Two long walls, 250 ft. apart, connected the city with the harbor (Peiraeus). In <a onClick="return mV(\'Act\',17,\'1-\');">Ac 17</a> we are told what Paul did during his single sojourn in this famous city. He came up from the sea by the new road (North of the ancient) along which were altars of unknown gods, entered the city from the west, and passed by the Ceramicus (burial-ground), which can be seen to this day, the "Theseum," the best preserved of all Greek temples, and on to the Agora (Market-Place), just north of the Acropolis, a steep hill, 200 ft. high, in the center of the city. Cimon began and Pericles completed the work of transforming this citadel into a sanctuary for the patron goddess of the city.<P>The magnificent gateway (Propylaea), of which the Athenians were justly proud, was built by Mnesicles (437-432 BC). A monumental bronze statue by Phidias stood on the left, as one emerged on the plateau, and the mighty Parthenon a little further on, to the right. In this temple was the famous gold and ivory statue of Athena. The eastern pediment contained sculptures representing the birth of the goddess (Elgin Marbles, now in the British Museum), the western depicting her contest with Poseidon for supremacy over Attica. This, the most celebrated edifice, architecturally, in all history, was partially destroyed by the Venetians in 1687. Other temples on the Acropolis are the Erechtheum and the "Wingless Victory." In the city the streets were exceedingly narrow and crooked. The wider avenues were called plateiai, whence English "place," Spanish "plaza." The roofs of the houses were flat. In and around the Agora were many porticoes stoai. In the Stoa Poecile ("Painted Portico"), whose walls were covered with historical paintings, Paul met with the successors of Zeno, the Stoics, with whom he disputed daily. In this vicinity also was the Senate Chamber for the Council of Five Hundred, and the Court of the Areopagus, whither Socrates came in 399 BC to face his accusers, and where Paul, five centuries later, preached to the Athenians "the unknown God." In this neighborhood also were the Tower of the Winds and the water-clock, which must have attracted Paul\'s attention, as they attract our attention today.<P>The apostle disputed in the synagogue with the Jews (<a onClick="return mV(\'Act\',17,17);">Ac 17:17</a>), and a slab found at the foot of Mount Hymettus (a range to the east of the city, 3,000 ft. high), with the inscription haute he pule tou kuriou, dikaioi eiseleusontai en aute (<a onClick="return mV(\'Psa\',118,20);">Ps 118:20</a>), was once thought to indicate the site, but is now believed to date from the 3rd or 4th century. Slabs bearing Jewish inscriptions have been found in the city itself.<P>The population of Athens was at least a quarter of a million. The oldest inhabitants were Pelasgians. Cecrops, the first traditional king, came from Egypt in 1556 BC, and by marrying the daughter of Actaeon, obtained the sovereignty. The first king was Erechtheus. Theseus united the twelve communities of Attica and made Athens the capital. After the death of Codrus in 1068 BC, the governing power was entrusted to an archon who held office for life. In 753 BC the term of office was limited to ten years. In 683 BC nine archons were chosen for a term of one year. Draco\'s laws, "written in blood," were made in 620 BC. Solon was chosen archon in 594 BC and gave the state a constitution. The tyrant Pisistratus was in control permanently from 541 to 527 BC; his son Hipparchus was assassinated in 514. Clisthenes changed the constitution and introduced the practice of ostracism.<P>In 490 BC the Athenians defeated the Persians at Marathon, and again in 480 BC at Salamis. In 476 BC Aristides organized the great Athenian Confederacy. After his death Conon became the leader of the conservative party; and when the general Cimon was killed, Pericles became the leader of the people. In 431 BC the Peloponnesian War broke out and continued till 404 BC, when Athens succumbed to Sparta. An oligarchical government was set up with Critias and Theramenes at the head. War broke out again but peace was restored by the pact of Antalcidas (387 BC). In the Sacred War (357-355 BC) Athens exhausted her strength. When Philip of Macedon began to interfere in Greek affairs, Athens could neither resolve on war measures (to which the oratory of Demosthenes incited her), nor make terms with Philip. Finally, she joined Thebes in making armed resistance, but in spite of her heroic efforts at Chaeronea, she suffered defeat (338 BC). Philip was murdered in 336 BC, and Alexander the Great became master.<P>After the subjugation of Greece by the Romans, Athens was placed under the supervision of the governor of Macedonia, but was granted local independence in recognition of her great history. As the seat of Greek art and science, Athens played an important role even under Roman sway—she became the university city of the Roman world, and from her radiated spiritual light and intellectual energy to Tarsus, Antioch and Alexandria. Philo, the Jew, declares that the Athenians were Hellenon oxuderkestatoi dianoian ("keenest in intellect") and adds that Athens was to Greece what the pupil is to the eye, or reason to the soul. Although the city had lost her real independence, the people retained their old characteristics: they were still interested in art, literature and philosophy.<P>Paul may possibly have attended theater of Dionysus (under the southeast cliff of the Acropolis) and witnessed a play of the Greek poets, such as Euripides or Menander. Many gifts were received from foreign monarchs by Athens. Attalus I of Perg amum endowed the Academy, Eumenes added a splendid Stoa to theater and Antiochus Epiphanes began the Olympeium (15 columns of which are still standing), the massive sub-basement of which had been constructed by Pisistratus. Athens became a favorite residence for foreign writers who cultivated history, geography and literature. Horace, Brutus and Cassius sojourned in the city for some time. Josephus declares that the Athenians were the most god-fearing of the Greeks eusebestatous ton Hellenon. Compare Livy xlv.27.<P>LITERATURE.<P>See Wordsworth, Athens and Attica; Butler, Story of Athens; Ernest Gardner, Ancient Athens; Tucker, Life in Ancient Athens; A. Mommsen, Athenae Christianae; Conybeare and Howson, Life and Epistles of Paul, chapter x; Gregorovius, Stadt Athen im Mittelalter; Leake, Grote, Thirlwall, Curtius, Wachsmuth, Holm, and Pausanias\' Attica, recently edited by Carroll (Ginn and Co.), or in the large work of Frazer.``71';
isbe[941]='Athlai`ath\'-la-i \'athlay, ("afflicted?"): A Jew, the son of Bebai, who was influenced by Ezra to put away his wife (<a onClick="return mV(\'Ezr\',10,28);">Ezr 10:28</a>).``1';
isbe[942]='Atipha`at\'i-fa.`<a href="./study/isbe/search.html?string=HATIPHA">HATIPHA</a>`1';
isbe[943]='Atonement`a-ton\'-ment: Translates kaphar; chata\'; ratsah, the last employed only of human relations (<a onClick="return mV(\'1Sa\',29,4);">1Sa 29:4</a>); translates the following Greek stems hilas-, simple and compounded with various prepositions; allag- in composition only, but with numerous prepositions and even two at a time, e. g. <a onClick="return mV(\'Mat\',5,24);">Mt 5:24</a>; lip- rarely (<a onClick="return mV(\'Dan\',9,24);">Da 9:24</a>).<P>I. Terms Employed.<P>1. Hebrew and Greek Words:<P>The root meanings of the Hebrew words, taking them in the order cited above, are, to "cover," hence expiate, condone, cancel, placate; to "offer," or "receive a sin offering," hence, make atonement, appease, propitiate; "effect reconciliation," i. e. by some conduct, or course of action. Of the Greek words the meanings, in order, are "to be," or "cause to be, friendly"; "to render other," hence to restore; "to leave" and with preposition to leave off, i. e. enmity, or evil, etc.;" to render holy," "to set apart for"; hence, of the Deity, to appropriate or accept for Himself.<P>2. The English Word:<P>It is obvious that the English word "atonement" does not correspond etymologically with any Hebrew or Greek word which it translates. Furthermore, the Greek words in both Septuagint and New Testament do not correspond exactly to the Hebrew words; especially is it true that the root idea of the most frequently employed Hebrew word, "cover," is not found in any of the Greek words employed. These remarks apply to both verbs and substantives The English word is derived from the phrase "at one," and signifies, etymologically, harmony of relationship or unity of life, etc. It is a rare instance of an AS theological term; and, like all purely English terms employed in theology, takes its meaning, not from its origin, but from theological content of the thinking of the Continental and Latin-speaking Schoolmen who employed such English terms as seemed most nearly to convey to the hearers and readers their ideas. Not only was no effort made to convey the original Hebrew and Greek meanings by means of English words, but no effort was made toward uniformity in translating of Hebrew and Greek words by their English equivalents.<P>3. Not to Be Settled by Lexicon Merely:<P>It is at once clear that no mere word-study can determine the Bible teaching concerning atonement. Even when first employed for expressing Hebrew and Christian thought, these terms, like all other religious terms, already had a content that had grown up with their use, and it is by no means easy to tell how far heathen conceptions might be imported into our theology by a rigidly etymological study of terms employed. In any case such a study could only yield a dictionary of terms, whereas what we seek is a body of teaching, a circle of ideas, whatever words and phrases, or combinations of words and phrases, have been employed to express the teaching.<P>4. Not Chiefly a Study in Theology:<P>There is even greater danger of making the study of the Atonement a study in dogmatic theology. The frequent employment of the expression "the Atonement" shows this tendency. The work of Christ in reconciling the world to God has occupied so central a place in Christian dogmatics that the very term atonement has come to have a theological rather than a practical atmosphere, and it is by no means easy for the student, or even for the seeker after the saving relation with God, to pass beyond the accumulated interpretation of the Atonement and learn of atonement.<P>5. Notes on Use of Terms:<P>The history of the explanation of the Atonement and the terms of preaching atonement cannot, of course, be ignored. Nor can the original meaning of the terms employed and the manner of their use be neglected. There are significant features in the use of terms, and we have to take account of the history of interpretation. Only we must not bind ourselves nor the word of God in such forms.<P>(1) The most frequently employed Hebrew word, kaphar, is found in the Prophets only in the priestly section (<a onClick="return mV(\'Eze\',45,15,20);">Eze 45:15, 20</a>; <a onClick="return mV(\'Dan\',9,24);">Da 9:24</a>) where English Versions of the Bible have "make reconciliation," margin, "purge away." Furthermore, it is not found in Deuteronomy, which is the prophetic book of the Pentateuch (Hexateuch). This indicates that it is an essentially priestly conception. The same term is frequently translated by "reconcile," construed as equivalent to "make atonement" (<a onClick="return mV(\'Lev\',6,30);">Le 6:30</a>; <a onClick="return mV(\'Lev\',8,15);">8:15</a>; <a onClick="return mV(\'Lev\',16,20);">16:20</a>; <a onClick="return mV(\'1Sa\',29,4);">1Sa 29:4</a>; <a onClick="return mV(\'Eze\',45,15,20);">Eze 45:15, 20</a>; <a onClick="return mV(\'Dan\',9,24);">Da 9:24</a>). In this latter sense it connects itself with chata\'. In <a onClick="return mV(\'2Ch\',29,24);">2Ch 29:24</a> both words are used: the priests make a sin offering chata\' to effect an atonement kaphar. But the first word is frequently used by metonymy to include, at least suggestively, the end in view, the reconciliation; and, on the other hand, the latter word is so used as to involve, also, doing that by which atonement is realized.<P>(2) Of the Greek words employed hilaskesthai means "to make propitious" (<a onClick="return mV(\'Hbr\',2,17);">Heb 2:17</a>; <a onClick="return mV(\'Lev\',6,30);">Le 6:30</a>; <a onClick="return mV(\'Lev\',16,20);">16:20</a>; <a onClick="return mV(\'Eze\',45,20);">Eze 45:20</a>); allattein, used however only in composition with prepositions, means "to render other," "to restore" to another (former?) condition of harmony (compare <a onClick="return mV(\'Mat\',5,24);">Mt 5:24</a> = "to be reconciled" to a fellow-man as a condition of making an acceptable sacrifice to God).<P>(3) In the English New Testament the word "atonement" is found only at <a onClick="return mV(\'Rom\',5,11);">Ro 5:11</a> and the American Standard Revised Version changes this to "reconciliation." While in strict etymology this word need signify only the active or conscious exercise of unity of life or harmony of relations, the causative idea probably belongs to the original use of the term, as it certainly is present in all current Christian use of the term. As employed in Christian theology, both practical and technical, the term includes with more or less distinctness: (a) the fact of union with God, and this always looked upon as (b) a broken union to be restored or an ideal union to be realized, (c) the procuring cause of atonement, variously defined, (d) the crucial act wherein the union is effected, the work of God and the response of the soul in which the union becomes actual. Inasmuch as the reconciliation between man and God is always conceived of as effected through Jesus Christ (<a onClick="return mV(\'2Cr\',5,\'18-21\');">2Co 5:18-21</a>) the expression, "the Atonement of Christ," is one of the most frequent in Christian theology. Questions and controversies have turned mainly on the procuring cause of atonement, (c) above, and at this point have arisen the various "theories of the Atonement."<P>II. Bible Teaching concerning Atonement in General:<P>The Atonement of Christ must be interpreted in connection with the conception of atonement in general in the Scriptures. This idea of atonement is, moreover, part of the general circle of fundamental ideas of the religion of Yahweh and Jesus. Theories of the Atonement root themselves in conceptions of the nature and character of God, His holiness, love, grace, mercy, etc.; of man, his nature, disposition and capacities; of sin and guilt.<P>1. Primary Assumption of Unity of God and Man:<P>The basal conception for the Bible doctrine of atonement is the assumption that God and man are ideally one in life and interests, so far as man\'s true life and interest may be conceived as corresponding with those of God. Hence, it is everywhere assumed that God and man should be in all respects in harmonious relations, "at-one." Such is the ideal picture of Adam and Eve in Eden. Such is the assumption in the parable of the Prodigal Son; man ought to be at home with God, at peace in the Father\'s house (<a onClick="return mV(\'Luk\',15,\'1-\');">Lu 15</a>).<P>Such also is the ideal of Jesus as seen especially in <a onClick="return mV(\'Jhn\',14,\'1-\');">Joh 14-17</a>; compare particularly <a onClick="return mV(\'Jhn\',17,21);">17:21</a>ff; compare also <a onClick="return mV(\'Eph\',2,\'11-22\');">Eph 2:11-22</a>; <a onClick="return mV(\'1Cr\',15,28);">1Co 15:28</a>. This is quite possibly the underlying idea of all those offerings in which the priests—God\'s representatives-and the people joined in eating at a common meal parts of what had been presented to God. The prohibition of the use of blood in food or drink is grounded on the statement that the life is in the blood (<a onClick="return mV(\'Lev\',17,10);">Le 17:10</a>f) or is the blood (<a onClick="return mV(\'Gen\',9,4);">Ge 9:4</a>; <a onClick="return mV(\'Deu\',12,23);">De 12:23</a>). Blood was used in the consecration of tabernacle, temple, vessels, altars, priests; all things and persons set apart for Yahweh. Then blood was required in offerings made to atone for sin and uncleanness. The reason for all this is not easy to see; but if we seek an explanation that will account for all the facts on a single principle, shall we not find it in the idea that in the life-principle of the blood God\'s own life was present? Through this life from God all living beings shared God\'s life. The blood passing out of any living being must therefore return to God and not be consumed. In sprinkling blood, the life-element, or certainly the life-symbol, over persons and things set apart for God they were, so to say, visibly taken up into the life of God, and His life extending over them made them essentially of His own person. Finally the blood of sacrifices was the returning to God of the life of the man for whom the beasts stood. And this blood was not burned with the dead sacrifice but poured out beside the holy altar. The now dead sin offering was burned, but the blood, the life, returned to God. In peace-offerings of various sorts there was the common meal in which the common life was typified.<P>In the claim of the first-fruits of all crops, of all flocks and of all increase, God emphasized the common life in production; asserted His claim to the total life of His people and their products. God claimed the lives of all as belonging essentially to Himself and a man must recognize this by paying a ransom price (<a onClick="return mV(\'Exd\',30,12);">Ex 30:12</a>). This did not purchase for the man a right to his own life in separation from God, for it was in no sense an equivalent in value to the man\'s time. It the rather committed the man to living the common life with God, without which recognition the man was not fit to live at all. And the use of this recognition-money by the priests in the temple was regarded as placing the man who paid his money in a sort of continuous worshipful service in the tabernacle (or temple) itself (<a onClick="return mV(\'Exd\',30,\'11-16\');">Ex 30:11-16</a>).<P>2. The Breach in the Unity:<P>In both Old Testament and New Testament the assumption of unity between God and man stands over against the contrasted fact that there is a radical breach in this unity. This breach is recognized in all God\'s relations to men; and even when healed it is always subject to new failures which must be provided for, by the daily oblations in the Old Testament, by the continuous intercession of the Christ (<a onClick="return mV(\'Hbr\',7,25);">Heb 7:25</a>; <a onClick="return mV(\'Hbr\',9,24);">9:24</a>) in the New Testament. Even when there is no conscious breach, man is taught to recognize that it may exist and he must avail himself of the appointed means for its healing, e. g. daily sacrifices. This breach is universally attributed to some behavior on man\'s part. This may be moral or ceremonial uncleanness on man\'s part. He may have broken with God fundamentally in character or conduct and so by committing sin have incurred guilt; or he may have neglected the fitting recognition that his life is in common with God and so by his disregard have incurred uncleanness. After the first breach between God and man it is always necessary that man shall approach God on the assumption that this breach needs healing, and so always come with an offering. In human nature the sin breach is rooted and universal (<a onClick="return mV(\'Rom\',3,\'9-19\');">Ro 3:9-19</a>; <a onClick="return mV(\'Rom\',5,\'12-14\');">5:12-14</a>).<P>3. Means for Expressing, Restoring and Maintaining:<P>Numerous and various means were employed for expressing this essential unity of life, for restoring it since it was broken off in sin, and for maintaining it. These means were primarily spiritual and ethical but made extensive use of material substances, physical acts and symbolical ceremonials; and these tended always to obscure and supplant the spiritual and ethical qualities which it was their function to exhibit. The prophet came to the rescue of the spiritual and ethical and reached his highest insight and function in the doctrine of the Suffering Servant of Yahweh through whom God was to be united with a redeemed race (compare among many passages, <a onClick="return mV(\'Isa\',49,\'1-7\');">Isa 49:1-7</a>; <a onClick="return mV(\'Isa\',66,18);">66:18</a>ff; <a onClick="return mV(\'Psa\',22,27);">Ps 22:27</a>ff).<P>Atonement is conceived in both Old Testament and New Testament as partly personal and partly social, extending to the universal conception. The acts and attitudes by which it is procured, restored and maintained are partly those of the individual alone (<a onClick="return mV(\'Psa\',51,\'1-\');">Ps 51</a>), partly those in which the individual secures the assistance of the priest or the priestly body, and partly such as the priest performs for the whole people on his own account. This involves the distinction that in Israel atonement was both personal and social, as also were both sin and uncleanness. Atonement was made for the group by the priest without specific participation by the people although they were, originally at least, to take cognizance of the fact and at the time. At all the great feasts, especially upon the <a href="./study/isbe/search.html?string=DAY+OF+ATONEMENT">DAY OF ATONEMENT</a> (which see) the whole group was receptively to take conscious part in the work of atonement (<a onClick="return mV(\'Num\',29,\'7-11\');">Nu 29:7-11</a>).<P>The various sacrifices and offerings by means of which atonement was effected in the life and worship of Israel will be found to be discussed under the proper words and are to be spoken of here only summarily. The series of offerings, guilt-offerings, burnt-offerings, sin-offerings, peace-offerings, reveal a sense of the breach with God, a conviction of the sin making the breach and an ethical appreciation of the holiness of God entirely unique among religions of ancient or modern times, and this fact must never be overlooked in interpreting the New Testament Christian doctrine of the Atonement. In the Old Testament there are sins and sinful circumstances for which no atonement is possible. Many passages, indeed, almost seem to provide against atonement for any voluntary wrongdoing (e. g. <a onClick="return mV(\'Lev\',4,2,13,22,27);">Le 4:2, 13, 22, 27</a>; <a onClick="return mV(\'Lev\',5,14);">5:14</a>ff). <P>This is, no doubt, an extreme interpretation, out of harmony with the general spirit of the Old Testament, but it does show how seriously sin ought to be taken under the Old Testament regime. No atonement for murder could make possible the residence of the murderer again in that section of the land where the murder was done (<a onClick="return mV(\'Num\',35,33);">Nu 35:33</a>), although the land was not by the murder rendered unfit for occupation by others. When Israel sinned in making the golden calf, God refused to accept any atonement (<a onClick="return mV(\'Exd\',32,20);">Ex 32:20</a>ff) until there had been a great loss of life from among the sinners. No repentance could find atonement for the refusal to follow Yahweh\'s lead at Kadesh-barnea (<a onClick="return mV(\'Num\',14,\'20-25\');">Nu 14:20-25</a>), and complete atonement was effected only when all the unbelieving generation had died in the wilderness (<a onClick="return mV(\'Num\',26,65);">Nu 26:65</a>; <a onClick="return mV(\'Num\',32,10);">32:10</a>ff); i. e. no atonement was possible, but the people died in that sin, outside the Land of Promise, although the sin was not allowed to cut off finally from Yahweh (<a onClick="return mV(\'Num\',14,29);">Nu 14:29</a>f).<P>Permanent uncleanness or confirmed disease of an unclean sort caused permanent separation from the temple and the people of Yahweh (e. g. <a onClick="return mV(\'Lev\',7,20);">Le 7:20</a>f), and every uncleanness must be properly removed (<a onClick="return mV(\'Lev\',5,2);">Le 5:2</a>; <a onClick="return mV(\'Lev\',17,15);">17:15</a>; <a onClick="return mV(\'Lev\',22,\'2-8\');">22:2-8</a>; <a onClick="return mV(\'Deu\',23,10);">De 23:10</a>f). A house in which an unclean disease was found must be cleansed—have atonement made for it (<a onClick="return mV(\'Lev\',14,53);">Le 14:53</a>), and in extreme cases must be utterly destroyed (<a onClick="return mV(\'Lev\',14,43);">Le 14:43</a>ff).<P>After childbirth (<a onClick="return mV(\'Lev\',12,7);">Le 12:7</a>f) and in all cases of hemorrhage (compare <a onClick="return mV(\'Lev\',15,30);">Le 15:30</a>) atonement must be effected by prescribed offerings, a loss, diminution, or pollution of blood, wherein is the life, having been suffered. All this elaborate application of the principle of atonement shows the comprehensiveness with which it was sought by the religious teachers to impress the people with the unity of all life in the perfectly holy and majestic God whom they were called upon to serve. Not only must the priests be clean who bear the vessels of the Lord (<a onClick="return mV(\'Isa\',52,11);">Isa 52:11</a>), but all the people must be clean also from all defilement of flesh and spirit, seeking perfect holiness in the fear of their God (compare <a onClick="return mV(\'2Cr\',7,1);">2Co 7:1</a>).<P>III. The Atonement of Jesus Christ<P>1. Preparation for New Testament Doctrine:<P>All the symbols, doctrine and examples of atonement in the Old Testament among the Hebrews find their counterpart, fulfillment and complete explanation in the new covenant in the blood of Jesus Christ (<a onClick="return mV(\'Mat\',26,28);">Mt 26:28</a>; <a onClick="return mV(\'Hbr\',12,24);">Heb 12:24</a>). By interpreting the inner spirit of the sacrificial system, by insisting on the unity and holiness of God, by passionate pleas for purity in the people, and especially by teaching the principle of vicarious suffering for sin, the Prophets laid the foundation in thought-forms and in religious atmosphere for such a doctrine of atonement as is presented in the life and teaching of Jesus and as is unfolded in the teaching of His apostles.<P>The personal, parabolic sufferings of Hosea, the remarkable elaboration of the redemption of spiritual Israel through a Suffering Servant of Yahweh and the extension of that redemption to all mankind as presented in <a onClick="return mV(\'Isa\',40,\'1-\');">Isa 40-66</a>, and the same element in such psalms as <a onClick="return mV(\'Psa\',22,\'1-\');">Ps 22</a>, constitute a key to the understanding of the work of the Christ that unifies the entire revelation of God\'s righteousness in passing over human sins (<a onClick="return mV(\'Rom\',3,24);">Ro 3:24</a>f). Yet it is remarkable that such a conception of the way of atonement was as far as possible from the general and average Jewish mind when Jesus came. In no sense can the New Testament doctrine of the Atonement be said to be the product of the thought and spirit of the times.<P>2. The One Clear Fact:<P>However much theologians may disagree as to the rationale of the Atonement, there is, as there can be, no question that Jesus and all His interpreters in the New Testament represent the Atonement between God and men as somehow accomplished through Jesus Christ. It is also an agreed fact in exegesis that Jesus and His apostles understood His death to be radically connected with this Atonement.<P>(1) Jesus Himself teaches that He has come to reveal the Father (<a onClick="return mV(\'Jhn\',14,9);">Joh 14:9</a>), to recover the lost (<a onClick="return mV(\'Luk\',19,10);">Lu 19:10</a>), to give life to men (<a onClick="return mV(\'Jhn\',6,33);">Joh 6:33</a>; <a onClick="return mV(\'Jhn\',10,10);">10:10</a>), to disclose and establish the kingdom of heaven (or of God), gathering a few faithful followers through whom His work will be perpetuated (<a onClick="return mV(\'Jhn\',17,2);">Joh 17:2</a>ff; <a onClick="return mV(\'Mat\',16,13);">Mt 16:13</a>ff); that salvation, personal and social, is dependent upon His person (<a onClick="return mV(\'Jhn\',6,53);">Joh 6:53</a>ff; <a onClick="return mV(\'Jhn\',14,6);">14:6</a>). He cannot give full teaching concerning His death but He does clearly connect His sufferings with the salvation He seeks to give. He shows in <a onClick="return mV(\'Luk\',4,16);">Lu 4:16</a>ff and <a onClick="return mV(\'Luk\',22,37);">22:37</a> that He understands <a onClick="return mV(\'Isa\',52,\'1-\');">Isa 52-53</a> as realized in Himself; He is giving Himself (and His blood) a ransom for men (<a onClick="return mV(\'Mat\',20,28);">Mt 20:28</a>; <a onClick="return mV(\'Mat\',26,26);">26:26</a>ff; compare <a onClick="return mV(\'1Cr\',11,23);">1Co 11:23</a>ff). He was not a mere martyr but gave Himself up willingly, and voluntarily (<a onClick="return mV(\'Jhn\',10,17);">Joh 10:17</a>f; <a onClick="return mV(\'Gal\',2,20);">Ga 2:20</a>), in accordance with the purpose of God (<a onClick="return mV(\'Act\',2,23);">Ac 2:23</a>), as the Redeemer of the world, and expected that by His lifting up all men would be drawn to Him (<a onClick="return mV(\'Jhn\',12,\'31-33\');">Joh 12:31-33</a>). It is possible to explain the attention which the Evangelists give to the death of Jesus only by supposing that they are reflecting the importance which they recall Jesus Himself to have attached to His death.<P>(2) All the New Testament writers agree in making Jesus the center of their idea of the way of salvation and that His death is an essential element in His saving power. This they do by combining Old Testament teaching with the facts of the life and death of the Lord, confirming their conclusion by appeal to the Resurrection. Paul represents himself as holding the common doctrine of Christianity at the time, and from the beginning, when in <a onClick="return mV(\'1Cr\',15,3);">1Co 15:3</a>f he sums up his teaching that salvation is secured through the death and resurrection of Jesus according to the Scriptures. Elsewhere (<a onClick="return mV(\'Eph\',2,16,18);">Eph 2:16, 18</a>; <a onClick="return mV(\'1Ti\',2,5);">1Ti 2:5</a>; compare <a onClick="return mV(\'Act\',4,12);">Ac 4:12</a>) in all his writings he emphasizes his belief that Jesus Christ is the one Mediator between God and man, by the blood of His cross (<a onClick="return mV(\'Col\',1,20);">Col 1:20</a>; <a onClick="return mV(\'1Cr\',2,2);">1Co 2:2</a>), removing the sin barrier between God and men. Peter, during the life of Jesus so full of the current Jewish notion that God accepted the Jews de facto, in his later ministry makes Jesus in His death the one way to God (<a onClick="return mV(\'Act\',4,12);">Ac 4:12</a>; <a onClick="return mV(\'1Pe\',1,2,18,19);">1Pe 1:2, 18-19</a>; <a onClick="return mV(\'1Pe\',2,21,24);">2:21, 24</a>; <a onClick="return mV(\'1Pe\',3,18);">3:18</a>).<P>John has this element so prominent in his Gospel that radical critical opinion questions its authorship partly on that account, while the epistles of John and the Revelation are, on the same ground, attributed to later Greek thought (compare <a onClick="return mV(\'1Jo\',1,7);">1Joh 1:7</a>; <a onClick="return mV(\'1Jo\',2,2);">2:2</a>; <a onClick="return mV(\'1Jo\',3,5);">3:5</a>; <a onClick="return mV(\'1Jo\',4,10);">4:10</a>; <a onClick="return mV(\'Rev\',1,5);">Re 1:5</a>; <a onClick="return mV(\'Rev\',5,9);">5:9</a>). The Epistle to the Hebrews finds in Jesus the fulfillment and extension of all the sacrificial system of Judaism and holds that the shedding of blood seems essential to the very idea of remission of sins (<a onClick="return mV(\'Hbr\',9,22);">He 9:22</a>; compare <a onClick="return mV(\'Hbr\',2,17);">He 2:17</a>; <a onClick="return mV(\'Hbr\',7,26);">7:26</a>f; <a onClick="return mV(\'Hbr\',9,\'24-28\');">9:24-28</a>).<P>3. How Shall We Understand the Atonement?<P>When we come to systematize the teaching concerning the Atonement we find, as in all doctrine, that definite system is not offered us in the New Testament, but all system, if it is to have any value for Christianity, must find its materials and principles in the New Testament. Proceeding in this way some features may be stated positively and finally, while others must be presented interrogatively, recognizing that interpretations may differ.<P>(1) An initial consideration is that the Atonement originates with God who "was in Christ reconciling the world unto himself" (<a onClick="return mV(\'2Cr\',5,19);">2Co 5:19</a>), and whose love gave Jesus to redeem sinful men (<a onClick="return mV(\'Jhn\',3,16);">Joh 3:16</a>; <a onClick="return mV(\'Rom\',5,8);">Ro 5:8</a>, etc.). In all atonement in Old Testament and New Testament the initiative is of God who not only devises and reveals the way to reconciliation, but by means of angels, prophets, priests and ultimately His only begotten Son applies the means of atonement and persuades men to accept the proffered reconciliation. Nothing in the speculation concerning the Atonement can be more false to its true nature than making a breach between God and His Christ in their attitude toward sinful men.<P>(2) It follows that atonement is fundamental in the nature of God in His relations to men, and that redemption is in the heart of God\'s dealing in history. The "Lamb slain from the foundation of the world" (<a onClick="return mV(\'Rev\',13,8);">Re 13:8</a> the King James Version and the English Revised Version; compare <a onClick="return mV(\'Rev\',5,\'5-7\');">Re 5:5-7</a>) is the interpreter of the seven-sealed book of God\'s providence in historyú In Jesus we behold the Lamb of God taking away the sin of the world (<a onClick="return mV(\'Jhn\',1,29);">Joh 1:29</a>).<P>(3) The question will arise in the analysis of the doctrine: How does the death of Christ save us? No specific answer has ever been generally satisfactory. We have numerous theories of the Atonement. We have already intimated that the answer to this question will depend upon our idea of the nature of God, the nature of sin, the content of salvation, the nature of man, and our idea of Satan and evil spirits. We ought at once to dismiss all merely quantitative and commercial conceptions of exchange of merit. There is no longer any question that the doctrines of imputation, both of Adam\'s sin and of Christ\'s righteousness, were overwrought and applied by the early theologians with a fatal exclusiveness, without warrant in the Word of God. On the other hand no theory can hold much weight that presupposes that sin is a thing of light consequence in the nature of man and in the economy of God. Unless one is prepared to resist unto blood striving against sin (<a onClick="return mV(\'Hbr\',12,\'2-4\');">Heb 12:2-4</a>), he cannot know the meaning of the Christ. Again, it may be said that the notion that the death of Christ is to be considered apart from His life, eternal and incarnate life, as the atoning work, is far too narrow to express the teaching of the Bible and far too shallow to meet the demands of an ethical conscience.<P>It would serve clearness if we reminded ourselves that the question of how in the Atonement may involve various elements. We may inquire: (a) for the ground on which God may righteously receive the sinner; (b) for the means by which God places the restoration within the reach of the sinner; (c) for the influence by which the sinner is persuaded to accept the reconciliation; (d) for the attitude or exercise of the sinner toward God in Christ wherein he actually enters the state of restored union with God. The various theories have seemed to be exclusive, or at least mutually antagonistic, largely because they have taken partial views of the whole subject and have emphasized some one feature of the whole content. All serious theories partly express the truth and all together are inadequate fully to declare how the Daystar from on high doth guide our feet into the way of peace (<a onClick="return mV(\'Luk\',1,79);">Lu 1:79</a>).<P>(4) Another question over which theologians have sorely vexed themselves and each other concerns the extent of the Atonement, whether it is available for all men or only for certain particular, elect ones. That controversy may now be passed by. It is no longer possible to read the Bible and suppose that God relates himself sympathetically with only a part of the race. All segregated passages of Scripture formerly employed in support of such a view have now taken their place in the progressive self-interpretation of God to men through Christ who is the propitiation for the sins of the whole world (<a onClick="return mV(\'1Jo\',2,2);">1Joh 2:2</a>). No man cometh unto the Father but by Him (<a onClick="return mV(\'Jhn\',14,6);">Joh 14:6</a>): but whosoever does thus call upon the name of the Lord shall be saved (<a onClick="return mV(\'Joe\',2,32);">Joe 2:32</a>; <a onClick="return mV(\'Act\',2,21);">Ac 2:21</a>).<P>See also <a href="./study/isbe/search.html?string=ATONEMENT+DAY+OF">ATONEMENT, DAY OF</a>; <a href="./study/isbe/search.html?string=PROPITIATION">PROPITIATION</a>; <a href="./study/isbe/search.html?string=RECONCILIATION">RECONCILIATION</a>; <a href="./study/isbe/search.html?string=SACRIFICE">SACRIFICE</a>.<P>LITERATURE.<P>In the vast literature on this subject the following is suggested: Articles by Orr in HDB; by Mackenzie in Standard Bible Dictionary; in the Catholic Encyclopedia; in Jewish Encyclopedia; by Simpson in Hastings, DCG; J. McLeod Campbell, The Nature of the Atonement; John Champion, The Living Atonement; W. M. Clow, The Cross in Christian Experience; T. J. Crawford, The Doctrine of Holy Scripture Respecting the Atonement; R. W. Dale, The Atonement; J. Denney, The Death of Christ: Its Place and Interpretation in the New Testament, and The Atonement and the Modern Mind; W. P. DuBose, The Soteriology of the New Testament; P. T. Forsyth, The Cruciality of the Cross; J. Scott Lidgett, The Spiritual Principle of the Atonement; Oxenham, The Catholic Doctrine of the Atonement; A. Ritschl, The Christian Doctrine of Justification and Reconciliation, I, II; Riviere, Le dogme de la redemption; D. W. Simon, Reconciliation by Incarnation; W. L. Walker, The Cross and the Kingdom; various writers, The Atonement and Modern Religious Thought.``21';
isbe[944]='Atonement, Day of`a-ton\'-ment:<P><b>I. THE LEGAL ENACTMENTS</b><P class="in15">1. Named<P class="in15">2. <span class="noTag">Leviticus 16</span><P class="in30">(1) Contents, Structure and Position<P class="in45">(a) <span class="noTag">Leviticus 16:1-10</span><P class="in45">(b) <span class="noTag">Leviticus 16:11-24</span><P class="in45">(c) <span class="noTag">Leviticus 16:25-28</span><P class="in45">(d) <span class="noTag">Leviticus 16:29-34</span><P class="in60">Use of Number Four<P class="in60">Place in Leviticus<P class="in30">(2) Modern Attempts to Disprove Unity of Chapter <p><b>II. THE SIGNIFICANCE OF THE DAY OF ATONEMENT</b><P class="in15">1. The Significance for Israel<P class="in15">2. The Significance from a Christian Standpoint<P><b>III. ON THE HISTORY OF THE DAY OF ATONEMENT</b><P class="in15">1. The Long Silence of History<P class="in30">(1) The Facts and the False Conclusions<P class="in30">(2) The Historicity of the Day of Atonement<P class="in15">2. Further Development<P><hr />I. The Legal Enactments.</b><P>1. Named:<P>In addition to the chief passage, <a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a>, which is treated under a separate head, we have the following:<P>In <a onClick="return mV(\'Exd\',30,10);">Ex 30:10</a> it is mentioned in the directions that are given for the construction of the altar of incense that Aaron, once a year, is to make an atonement on the horns of the altar, with the blood of the sin offering, which is used for the purpose of an atonement for sin.<P>In <a onClick="return mV(\'Lev\',23,\'26-32\');">Le 23:26-32</a> mention is made in the list of festivals of the Day of Atonement, on the 10th day of the 7th month. It is ordered that for this day there shall be a holy convocation at the sanctuary, a fast, an offering by fire, and rest from labor from the 9th day of the 7th month in the evening.<P>According to <a onClick="return mV(\'Lev\',25,9);">Le 25:9</a> the year of jubilee begins with the Day of Atonement.<P><a onClick="return mV(\'Num\',18,\'1-\');">Nu 18</a> speaks of the duties and the rights of the priests and the Levites. In contrast with the latter, according to <a onClick="return mV(\'Num\',18,7);">18:7</a>, Aaron and his sons are to perform the duties of the priesthood in all matters pertaining to the altar and of the service within the veil and shall render this service. We have here doubtless a comprehensive law for the entire priestly order, so that from this alone it cannot be determined that the service within the veil, by which reference is made to the ceremony of the Day of Atonement, has been reserved for the high priest alone, just as in <a onClick="return mV(\'Deu\',10,8);">De 10:8</a>; <a onClick="return mV(\'Deu\',33,8);">33:8</a>ff, everything that pertains to the whole tribe of Levi is found combined, without thereby the division into high priest, priests and Levites, being regarded as excluded (compare <a href="./study/isbe/search.html?string=EZEKIEL">EZEKIEL, II, 2, (1), c</a>).<P><a onClick="return mV(\'Num\',29,\'7-11\');">Nu 29:7-11</a> contains in connection with the laws treating of sacrifices also the enactment, that on the 10th day of the 7th month there shall take place a holy convocation at the sanctuary, fasting and rest from labor. In addition to the sin offering, which is brought for the purpose of atonement for sin, and in addition to the regular burnt offerings and the accompanying meal offerings and drink offerings, burnt offerings also are to be brought, namely, one young bullock, one young ram, seven lambs of the first year (all without blemish); then meal offerings, namely, three-tenths (compare <a onClick="return mV(\'Num\',28,\'12-14\');">Nu 28:12-14</a>) of fine flour mingled with oil for each bullock; two-tenths for each ram; one-tenth for each lamb; then a sin offering, namely, one he-goat. Ezekiel in his vision of the new temple, of the holy city and the holy country (chapters <a onClick="return mV(\'Eze\',40,\'1-\');">40-48</a>), in <a onClick="return mV(\'Eze\',45,18);">45:18</A>ff, gives a series of enactments for the festivals and the sacrifices. According to these, on the 1st day of the 1st month and on the 7th day of the 1st month (on the 1st day of the 7th month according to the Septuagint), the sanctuary is to be cleansed through a young bullock without blemish, the priest taking some of the blood of the sin offering and putting it on the posts of the temple, on the four corners of the altar and on the posts of the gate of the inner court; and this is to be done for the sake of those who perhaps have sinned through error or ignorance. Further, that sacrifice which is to be brought on the Passover by the princes for themselves and all the people of the land (compare <a onClick="return mV(\'Eze\',45,22);">45:22</A>) appears to present a clear analogy to <a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a>. As for the rest, <a onClick="return mV(\'Eze\',40,1);">Eze 40-48</a> cannot without further consideration be put on the same level with the other legal enactments, but are to be regarded as an ideal scheme, the realization of which is conditioned on the entrance of the wonderful future (compare <a href="./study/isbe/search.html?string=EZEKIEL">EZEKIEL</a>).<P>2. <a onClick="return mV(\'Lev\',16,\'1-\');">Leviticus 16</a>:<P>(1) Contents, Structure and Position.<P><a onClick="return mV(\'Lev\',16,\'1-28\');">Le 16:1-28</a> contains instructions given by Yahweh to Moses for his brother Aaron (<a onClick="return mV(\'Lev\',16,1,2);">16:1-2</a>).<P>(a) <a onClick="return mV(\'Lev\',16,\'1-10\');">Leviticus 16:1-10</a>.<P><a onClick="return mV(\'Lev\',16,\'1-10\');">Leviticus 16:1-10</a> contain presuppositions, preparations and summary statements of the ceremonies on the Day of Atonement. According to <a onClick="return mV(\'Lev\',16,1,2);">16:1-2</a>, Aaron is not allowed to enter the holy place at any time whatever, lest he may die as did his sons with their unseemly fire offering (compare <a onClick="return mV(\'Lev\',10,1);">Le 10:1</a>ff); <a onClick="return mV(\'Lev\',16,\'3-4\'1);">16:3-5</a> tell what is necessary for the ceremony: For himself four things: a young bullock as a sin offering (compare <a onClick="return mV(\'Lev\',16,6,11,14,15,27);">16:6, 11, 14-15, 27</a>); a ram for burnt offering (compare <a onClick="return mV(\'Lev\',16,24);">16:24</a>); sacred garments, namely, a linen coat, linen breeches, linen girdle, linen mitre (compare <a onClick="return mV(\'Lev\',16,23,32);">16:23, 32</a>); a bath. For the congregation: two he-goats as a sin offering (compare <a onClick="return mV(\'Lev\',16,7);">16:7</a>ff, <a onClick="return mV(\'Lev\',16,\'15-22\',25,27,28,32,33);">15-22, 25, 27-28, 32-33</a>), a ram as a burnt offering (compare <a onClick="return mV(\'Lev\',16,24);">16:24</a>). The passages in parentheses show how closely the succeeding parts of this account are connected with this introductory part, <a onClick="return mV(\'Lev\',16,\'1-10\');">16:1-10</a>. In other parts of Leviticus also it is often found that the materials used for the sacrifices are mentioned first, before anything is said in detail of what is to be done with this material. Compare <a onClick="return mV(\'Lev\',8,1,2);">8:1-2</A> with <a onClick="return mV(\'Lev\',8,6,7);">8:6-7</a>ff, <a onClick="return mV(\'Lev\',8,10,18,22,26);">10,14, 18, 22, 26</a> and <a onClick="return mV(\'Lev\',9,2,3,4);">9:2-4</a> with <a onClick="return mV(\'Lev\',9,7,8);">9:7-8</a>ff, <a onClick="return mV(\'Lev\',9,12);">12</a>ff, <a onClick="return mV(\'Lev\',9,\'15-18\');">15-18</a>. In <a onClick="return mV(\'Lev\',16,6);">16:6</a>, Aaron\'s sin-offering bullock is to be used as an atonement for himself; <a onClick="return mV(\'Lev\',16,\'7-10\');">16:7-10</a> refer to the two goats: they are to be placed at the door of the tent of meeting (<a onClick="return mV(\'Lev\',16,7);">16:7</a>); lots are to be cast upon them for Yahweh and Azazel (<a onClick="return mV(\'Lev\',16,8);">16:8</a>); the first to be prepared as a sin offering for Yahweh (<a onClick="return mV(\'Lev\',16,9);">16:9</a>); the second, in accordance with the law, to be sent into the desert (<a onClick="return mV(\'Lev\',16,10);">16:10</a>).<P>(b) <a onClick="return mV(\'Lev\',16,\'11-24\');">Leviticus 16:11-24</a>.<P><a onClick="return mV(\'Lev\',16,\'11-24\');">Leviticus 16:11-24</a> describe the ceremony itself and give fuller directions as to how the different sacrificial materials mentioned under (a) are to be used by Aaron: <a onClick="return mV(\'Lev\',16,\'11-14\');">16:11-14</a> speak of the atonement for Aaron and his house; <a onClick="return mV(\'Lev\',16,11);">16:11</a>, of his sin-offering bullock to be killed; <a onClick="return mV(\'Lev\',16,12);">16:12</a>, of burning coal from the altar and two handfuls of sweet incense beaten small to be placed behind the veil; <a onClick="return mV(\'Lev\',16,13);">16:13</a>, of the cloud of incense to be made in the Holy of Holies, so that the top covering is hidden and Aaron is protected from the danger of death; <a onClick="return mV(\'Lev\',16,14);">16:14</a>, of some of the blood to be sprinkled once on the front of the top covering and seven times in front of it. <a onClick="return mV(\'Lev\',16,\'15-19\');">Le 16:15-19</a> prescribe the ceremony with the first sin-offering goat for the congregation: in <a onClick="return mV(\'Lev\',16,15,16);">16:15-16</a>, the ceremony described in <a onClick="return mV(\'Lev\',16,14);">16:14</a> is directed also to be carried out with the goat, as an atonement for the inner sanctuary, cleansing it from blemishes; in <a onClick="return mV(\'Lev\',16,16);">16:16b</a> the same thing is directed to be done in regard to the tabernacle of revelation, i. e. the holy place, in <a onClick="return mV(\'Lev\',16,17);">16:17</a>, no one is permitted to be present even in the holy place when these ceremonies take place; in <a onClick="return mV(\'Lev\',16,18,19);">16:18-19</a>, the altar too is directed to be cleansed by an atonement, some of the blood of both sin-offering animals being smeared on the horns and sprinkled seven times on the ground.<P><a onClick="return mV(\'Lev\',16,\'20-22\');">Le 16:20-22</a> prescribes the ceremony with the second sin-offering goat for the congregation: <a onClick="return mV(\'Lev\',16,20);">16:20</a> directs it to be brought there; in <a onClick="return mV(\'Lev\',16,21);">16:21</a> there takes place the transfer of guilt; Aaron shall lay both his hands upon the goat; shall confess all guilt over him; shall lay them upon the head of the goat; shall through a man send him into the desert; in <a onClick="return mV(\'Lev\',16,22);">16:22a</a>, the goat carries the guilt into an uninhabited land; in <a onClick="return mV(\'Lev\',16,22);">16:22b</a>, he is not to be let go until he is in the desert.<P><a onClick="return mV(\'Lev\',16,23,24);">Le 16:23-24</a>, the concluding act: in <a onClick="return mV(\'Lev\',16,23);">16:23a</a>, Aaron takes off his linen garments in the tent of meeting, and in <a onClick="return mV(\'Lev\',16,23);">16:23b</a> puts them down there; in <a onClick="return mV(\'Lev\',16,24);">16:24a</a>, he bathes in the holy place and again puts on his usual clothing; in <a onClick="return mV(\'Lev\',16,24);">16:24b</a> he brings the burnt offering for himself and his people. (The statement \'for himself and his people\' at this place concludes the ritual as such.)<P>(c) <a onClick="return mV(\'Lev\',16,\'25-28\');">Leviticus 16:25-28</a>.<P><a onClick="return mV(\'Lev\',16,\'25-28\');">Leviticus 16:25-28</a> are explanatory, with three additional directions. In <a onClick="return mV(\'Lev\',16,25);">16:25</a>, the fat of the sin offering is directed to be consumed into smoke on the altar; <a onClick="return mV(\'Lev\',16,26);">16:26</a>, he who has taken away the second goat must wash his clothes and bathe himself, and only then is he permitted to enter the camp; <a onClick="return mV(\'Lev\',16,27);">16:27</a>, the fat, flesh and dung of the sin-offering animal, and then the blood that was brought into the (inner) sanctuary, are to be burned outside of the camp; <a onClick="return mV(\'Lev\',16,28);">16:28</a>, he who has burned these must wash his clothes, and must bathe, and only after this can he enter the camp. (In this case <a onClick="return mV(\'Lev\',16,25);">16:25</a> and <a onClick="return mV(\'Lev\',16,27);">27</a> correspond, and also <a onClick="return mV(\'Lev\',16,26);">16:26</a> and <a onClick="return mV(\'Lev\',16,28);">28</a>; and in addition <a onClick="return mV(\'Lev\',16,26,27,28);">16:26-28</a> are united by their reference to the camp.)<P>(d) <a onClick="return mV(\'Lev\',16,\'29-34\');">Leviticus 16:29-34</a>.<P><a onClick="return mV(\'Lev\',16,\'29-34\');">Leviticus 16:29-34</a>: Over against these sections (a)—(c) (<a onClick="return mV(\'Lev\',16,\'1-28\');">16:1-28</a>), which contain the instructions for the high priest, we have a fourth (<a onClick="return mV(\'Lev\',16,\'29-34\');">16:29-34</a>), which already through the address in the second person plural and also by its contents is intended for the congregation. In <a onClick="return mV(\'Lev\',16,29,30,31);">16:29-31</a>, the demand is made of the congregation. As in <a onClick="return mV(\'Lev\',23,26);">Le 23:26</a>ff; <a onClick="return mV(\'Num\',29,7);">Nu 29:7</a>ff, a fast and absolute rest are prescribed for the 10th day of the 7th month as the Day of Atonement; in <a onClick="return mV(\'Lev\',16,\'32-34\');">Le 16:32-34</a>, a number of directions are given in a summary to the congregation on the basis of <a onClick="return mV(\'Lev\',16,1);">16:1</a>ff, namely, <a onClick="return mV(\'Lev\',16,32);">16:32</a>, how the atonement is to take place: the priest who is anointed; he shall be consecrated; that he perform the service in his father\'s place; in his linen garments; <a onClick="return mV(\'Lev\',16,33);">16:33</a> prescribes when and for whom the atonement is to take place: for the holy of holies; for the holy place; for the altar; for the order of priests and all the people; in <a onClick="return mV(\'Lev\',16,34);">16:34</a>, the one Day of Atonement in the year for all sins is declared to be an everlasting statute. The statement that Aaron (<a onClick="return mV(\'Lev\',16,2);">16:2</a>), according to Yahweh\'s command, did as Moses directed aptly closes the whole chapter.<P>Use of Number Four<P>The number four appears to occupy a predominating place in this chapter, as the bird\'s-eye view above already shows, and as this can be traced still further in the details of the accounts. But even if this significance of the number four in the division of the chapter is accidental, although this number appears almost as a matter of course, and in <a onClick="return mV(\'Exd\',35,\'4-\');">Ex 35:4-40:38</a>, in <a onClick="return mV(\'Gen\',12,\'1-\');">Ge 12-25</a>, in the story of Abraham, <a onClick="return mV(\'Lev\',11,\'1-\');">Le 11-15</a>, and <a onClick="return mV(\'Deu\',12,\'1-\');">De 12-26</a> naturally fall into four pericopes with four subdivisions, yet this chapter is, as far as contents are concerned, so closely connected, and so well organized as a whole, that all attempts to ascribe it to different sources, concerning which we shall speak immediately, must come to naught in view of this fact.<P>Place in Leviticus<P>At this point we first of all draw attention to the fact that <a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a> has its well-established place in the whole of the Book of Leviticus (compare <a href="./study/isbe/search.html?string=LEVITICUS">LEVITICUS</a>). The whole book has as its purpose to regulate the dealings of the Israelites with their God, and it does this in such a way that the first part (<a onClick="return mV(\'Lev\',1,\'1-\');">Le 1-17</a>) removes the hindrances that have been caused by sin. In this the ordinances with reference to the Day of Atonement (<a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a>), and with reference to the significance of the blood (<a onClick="return mV(\'Lev\',17,\'1-\');">Le 17</a>), constitute a natural acme and excellent conclusion, while this prepares for the positive sanctification, which is discussed in <a onClick="return mV(\'Lev\',18,\'1-\');">Le 18</a>ff. In <a onClick="return mV(\'Lev\',15,31);">15:31</a> we find in addition a clear transition to the thoughts of <a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a>, for in this passage mention is made of the uncleanness of the Israelites, which contaminates the dwelling-place of Yahweh that is in their midst.<P>(2) Modern Attempts to Disprove Unity of Chapter.<P>A large number of attempts have been made to destroy the unity of this chapter, which has been demonstrated in division (1) above. Thus Stade separates <a onClick="return mV(\'Lev\',16,\'3-10\');">Le 16:3-10</a> as the original kernel from the explanatory and changing details that were added in <a onClick="return mV(\'Lev\',16,\'11-28\');">16:11-28</a>. But we have already seen that <a onClick="return mV(\'Lev\',16,\'3-10\');">16:3-10</a> are the preparation for all that follows, so that these verses demand <a onClick="return mV(\'Lev\',16,11);">16:11</a>ff as a necessary complement. Again Oort separates <a onClick="return mV(\'Lev\',16,\'1-4\',11,14,16,18,19,23,24,25,29);">16:1-4, 11b, 14, 16, 18a,19, 23, 24a, 25a, 29a</a> from the rest, by using the purification of the sanctuary and the atonement of the people as the measure for this separation; but above all it is proved by <a onClick="return mV(\'Eze\',45,\'18-20\');">Eze 45:18-20</a> that just these two thoughts are inseparably united. In recent times it has become the custom, following the leadership of Benzinger, to divide the text into three parts. Baentsch divides as follows:<P>(a) <a onClick="return mV(\'Lev\',16,\'1-4\',6,12,34);">Le 16:1-4, 6, 12ff, 34b</a> contain a single pericope, which on the basis of the fate of the sons of Aaron, described in <a onClick="return mV(\'Lev\',10,\'1-\');">Le 10</a>, determines under what circumstances Aaron alone is permitted to enter the Holy of Holies;<P>(b) <a onClick="return mV(\'Lev\',16,\'29-34\');">Le 16:29-34</a> a contain "an older, relatively simpler law in reference to the yearly day of penitence and atonement";<P>(c) <a onClick="return mV(\'Lev\',16,5,\'7-11\',\'14-28\');">16:5, 7-10, 11, 14-28</a> are a "later enlargement of this ritual, with a more complicated blood rite," and above all with "the rite of the sin goat." Of these three pieces only (a) is thought to belong to the original Priest Codex, as proved especially by its reference back to <a onClick="return mV(\'Lev\',10,\'1-\');">Le 10</a>; (b) is regarded as belonging to the secondary parts, because the day of repentance is not yet mentioned in <a onClick="return mV(\'Neh\',8,\'1-\');">Ne 8</a>ff; compare III, 1; at any rate the anointing of all the priests is there not yet presupposed (compare <a href="./study/isbe/search.html?string=LEVITICUS">LEVITICUS</a>); (c), however, is declared to be very late and its separate parts are regarded as having originated only after the others (thus recently also Bertholet).<P>It is impossible here to enter into all the minor parts eliminated by the exegetes; and in the same way we do not intend in our examination to enter into all the incorrect views found in these criticisms. We confine ourselves to the chief matter. The very foundation of the criticism is wrong. What Aaron\'s sons experienced according to <a onClick="return mV(\'Lev\',10,\'1-\');">Le 10</a> could very easily have furnished a connecting link for that ritual which is introduced in <a onClick="return mV(\'Lev\',16,2);">Le 16:2</a>ff, but could never have furnished the occasion for the composition of the pericope described above (a); for Nadab and Abihu had not entered into the Holy of Holies at all. Just as little justifiable is the conclusion drawn from chapter <a onClick="return mV(\'Lev\',10,\'1-\');">10</a>, that chapter <a onClick="return mV(\'Lev\',16,\'1-\');">16</a> originally followed immediately on chapter <a onClick="return mV(\'Lev\',10,\'1-\');">10</a>. For who could possibly have conceived the thought of inserting chapters <a onClick="return mV(\'Lev\',11,\'1-\');">11-15</a> in an altogether unsuitable place between chapters <a onClick="return mV(\'Lev\',10,\'1-\');">10</a> and <a onClick="return mV(\'Lev\',16,\'1-\');">16</a> and thus have split asunder a connection so transparent? In general, the different attempts to break the unity of this chapter show how subjective and arbitrary these attempts are. They are a characteristic example of the manner in which the Priest Codex is now being further divided (compare <a href="./study/isbe/search.html?string=LEVITICUS">LEVITICUS</a>). In general, sufficient material for the positive refutation of such attempts has been given above.<P>II. The Significance of the Day of Atonement.<P>1. The Significance for Israel:<P>The significance of the day is expressed in the name "Day of Atonement" Yom ha-kippurim: (<a onClick="return mV(\'Lev\',23,27);">Le 23:27</a>f; <a onClick="return mV(\'Lev\',25,9);">25:9</a>) in the same manner as it is in the fast which was enjoined on the congregation as a sign of sorrow for their sins (this fasting being the only one enjoined by the law: <a onClick="return mV(\'Lev\',16,29,31);">Le 16:29, 31</a>; <a onClick="return mV(\'Lev\',23,26);">23:26</a>ff; <a onClick="return mV(\'Num\',29,7);">Nu 29:7</a>ff), as also finally and chiefly in the entire ritual (<a onClick="return mV(\'Exd\',30,10);">Ex 30:10</a>; <a onClick="return mV(\'Lev\',23,28);">Le 23:28</a>; <a onClick="return mV(\'Num\',29,11);">Nu 29:11</a>; <a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a>; compare also <a onClick="return mV(\'Eze\',18,20,22);">Eze 18:20, 22</a>). Then, too, the atonement takes place for the sanctuary which has been defiled by the contamination of the Israelites (<a onClick="return mV(\'Exd\',30,10);">Ex 30:10</a>; <a onClick="return mV(\'Lev\',16,\'16-20\',33);">Le 16:16-20, 33</a>; compare also <a onClick="return mV(\'Eze\',45,\'18-20\');">Eze 45:18-20</a>). In particular, mention is made of the Holy of Holies (<a onClick="return mV(\'Lev\',16,33);">Le 16:33</a>, called Miqdash ha-qodhesh; otherwise in Leviticus regularly ha-qodhesh), then of the holy place (<a onClick="return mV(\'Lev\',16,16,20,33);">16:16b, 20,33</a>), and then of the altar (<a onClick="return mV(\'Lev\',16,18,20,33);">16:18, 20, 33</a>). In the last-mentioned case it is a matter of discussion whether the altar of incense is meant, as is claimed by Jewish tradition, on the basis of <a onClick="return mV(\'Exd\',30,10);">Ex 30:10</a>, or the altar of burnt offerings, for which reference could be made to the additional statements in <a onClick="return mV(\'Lev\',16,18);">Le 16:18</a>, to those of <a onClick="return mV(\'Lev\',16,16);">16:16</a>, and to the conclusion in <a onClick="return mV(\'Lev\',16,17);">16:17</a>. The altar of incense (<a onClick="return mV(\'Exd\',30,10);">Ex 30:10</a>) would then be included in the atonement of the tent of meeting. The somewhat remarkable position of <a onClick="return mV(\'Lev\',16,17);">16:17b</a> would then at the same time find its motive in this, that, while <a onClick="return mV(\'Lev\',16,6);">16:6</a> and <a onClick="return mV(\'Lev\',16,11);">11b</a> mention an atonement only for Aaron and his house, the atonement of the Holy of Holies and of the holy place in <a onClick="return mV(\'Lev\',16,17);">16:17</a> is for Aaron, his house, and the whole congregation, while the atonement of the burnt-offering altar in the forecourt (<a onClick="return mV(\'Lev\',16,18);">16:18</a>) would be intended only for the sins of the congregation. The atonement, however, takes place for all the transgressions of the congregation since the last Day of Atonement (compare <a onClick="return mV(\'Lev\',16,21,30,34);"
