isbe[901]='Assyrian and Babylonian Libraries``<a href="./study/isbe/search.html?string=NINEVEH+LIBRARY+OF">NINEVEH, LIBRARY OF</a>`1';
isbe[902]='Assyrians`a-sir\'-i-ans (\'ashshur): The inhabitants of Assyria. In Hebrew the name of the people is the same as that of the country.`<a href="./study/isbe/search.html?string=ASSYRIA">ASSYRIA</a>`1';
isbe[903]='Astad`as\'-tad: The reading of the English versions of 1Esdras 5:13 for the name which appears as Azgad in <a onClick="return mV(\'Ezr\',2,12);">Ezr 2:12</a> and <a onClick="return mV(\'Neh\',7,17);">Ne 7:17</a>. In the different Greek copies of 1Esdras the name varies.`<a href="./study/isbe/search.html?string=AZGAD">AZGAD</a>; <a href="./study/isbe/search.html?string=ASTATH">ASTATH</a>`1';
isbe[904]='Astaroth`as\'-ta-roth.`<a href="./study/isbe/search.html?string=ASHTAROTH">ASHTAROTH</a>`1';
isbe[905]='Astarte; Astoreth`as-tar\'-te.`<a href="./study/isbe/search.html?string=ASHTAROTH">ASHTAROTH</a>`1';
isbe[906]='Astath`as\'-tath (Astath): the form given in 1Esdras 8:38 to the name which in <a onClick="return mV(\'Ezr\',8,12);">Ezr 8:12</a> appears as Azgad.`<a href="./study/isbe/search.html?string=AZGAD">AZGAD</a>`1';
isbe[907]='Astonished; Astonied`as-ton\'-isht, as-ton\'-id (shamem, "astonished," the root idea being "silent," i.e. struck dumb with amazement; ekplessomai, "to be struck with astonishment," as if by a blow or a shock; existemi, "to amaze," "to throw into wonderment"; thambeomai, "to astonish" to the point of fright): The state of being surprised, startled, stunned by some exceptional wonder, some overwhelming event or miracle, as e.g. Nebuchadnezzar\'s amazement at the miracle in the burning fiery furnace (<a onClick="return mV(\'Dan\',3,24);">Da 3:24</a>) (tewah, "astonished"); of the passer-by at the desolation of Babylon (<a onClick="return mV(\'Jer\',50,13);">Jer 50:13</a>). The personality, teaching and works of Jesus were so wonderful, Divine, supernatural, as to awaken emotions of surprise and awe never before known in the presence of man.<P>The people "were astonished out of measure" at His doctrine (<a onClick="return mV(\'Mar\',10,26);">Mr 10:26</a> the King James Version); "astonished with a great astonishment" at His raising the dead (<a onClick="return mV(\'Mar\',5,42);">Mr 5:42</a> the King James Version). The gift of the Holy Ghost to the Gentiles was in like manner a source of astonishment to those Jews who believed through the power of Peter\'s preaching (<a onClick="return mV(\'Act\',10,45);">Ac 10:45</a> the King James Version). The miracle of regeneration today, which renews and transforms debased and fallen men into saints, makes the same impression on an observing world.``139';
isbe[908]='Astonishment`as-ton\'-ish-ment: Amazement; mental surprise, excitement, wonder; often the cause of the startled emotion, as in <a onClick="return mV(\'Deu\',28,37);">De 28:37</a>: "Thou shall become an astonishment." The chosen people, visited with calamities for idolatry would become a source of amazement to all nations (<a onClick="return mV(\'Jer\',25,9,11,18);">Jer 25:9, 11, 18</a>); Solomon\'s\' lofty and beautiful temple would be "an astonishment" (<a onClick="return mV(\'2Ch\',7,21);">2Ch 7:21</a> the King James Version).`<a href="./study/isbe/search.html?string=ASTONISHED">ASTONISHED</a>`1';
isbe[909]='Astray`a-stra\' (ta\'ah, "to wander," "to err"; planaomai, "to go astray," each carrying the idea of being lost): With one exception (<a onClick="return mV(\'Exd\',23,4);">Ex 23:4</a> "his ass going astray") used metaphorically of moral wandering, going astray in paths of error and sin, like "sheep going astray" (<a onClick="return mV(\'1Pe\',2,25);">1Pe 2:25</a> the King James Version; <a onClick="return mV(\'Isa\',53,6);">Isa 53:6</a>; <a onClick="return mV(\'Psa\',119,176);">Ps 119:176</a>).<P>This wandering may be due<P>(1) to inherent evil (<a onClick="return mV(\'Psa\',58,3);">Ps 58:3</a>);<P>(2) to false shepherds (<a onClick="return mV(\'Jer\',50,6);">Jer 50:6</a>); contrast the beautiful and classic passage, <a onClick="return mV(\'Mat\',18,12,13);">Mt 18:12-13</a>, the Son of man (verse <a onClick="return mV(\'Mat\',18,12);">12</a>) seeketh that which is gone astray. No word more vividly portrays sin as a straying, a separation from God. To be morally "astray" is to be "lost."``139';
isbe[910]='Astrology`as-trol\'-o-ji:<P><b>I. THE DESIRE TO FORECAST THE FUTURE</b><P class="in15">1. Methods of Soothsaying<P class="in15">2. Divination<P class="in15">3. Looking in the Liver<P class="in15">4. The Astrologers, or Dividers of the Heavens<P class="in15">5. The Stargazers, or Seers of the Constellations<P class="in15">6. The Monthly Prognosticators, or Men Who Knew the Omens of the New Moon<P><b>II. THE WORSHIP OF THE HEAVENLY BODIES THE FORM OF IDOLATRY TO WHICH THE ISRAELITES WERE MOST PRONE</b><P class="in15">1. Chiun, Certainly the Planet Saturn<P class="in15">2. Saturn or Moloch Worship<P class="in15">3. Mazzaloth, or Planet Worship<P class="in15">4. Gadh and Meni or Star Worship<P class="in15">5. Lucifer, the Shining Star<P><b>III. SYSTEMS OF ASTROLOGY</b><P class="in15">1. Names of the Week Days, Due to an Astrological System<P class="in15">2. Origin of Modern Astrology<P class="in15">3. "Curious Arts" of Ephesus<P><b>LITERATURE</b><hr /><P>I. The Desire to Forecast the Future.<P>The desire to penetrate the future and influence its events has shown itself in all lands and ages. But it is clear that a knowledge of the future does not lie within the scope of man\'s natural powers; "divination" therefore has always been an attempt to gain the help of beings possessing knowledge and power transcending those of man. The answer of the Chaldeans to King Nebuchadnezzar when he demanded that they should tell his dream was a reasonable one: "There is not a man upon the earth that can show the king\'s matter:...there is no other that can show it before the king, except the gods, whose dwelling is not with flesh" (<a onClick="return mV(\'Dan\',2,10,11);">Da 2:10-11</a>). "Divination," therefore, in all its forms is but an aspect of polytheism.<P>It was for the twofold reason that the arts of divination were abominable in themselves, and gave to their votaries no knowledge of the will of God, that such arts were forbidden in the Law (<a onClick="return mV(\'Deu\',18,\'9-15\');">De 18:9-15</a>). Israel was to be perfect with God and He would reveal to them His will perfectly through that prophet like unto Moses whom He would send. Keil and Delitzsch in commenting on this passage well remark: "Moses groups together all the words which the language contained for the different modes of exploring the future and discovering the will of God, for the purpose of forbidding every description of soothsaying, and places the prohibition of Molochworship at the head, to show the inward connection between soothsaying and idolatry, possibly because februation, or passing children through the fire in the worship of Moloch, was more intimately connected with soothsaying and magic than any other description of idolatry" (Commentary on the Pentateuch, III, 393).<P>1. Methods of Soothsaying:<P>The forms of soothsaying mentioned in this catalogue are as follows: "One that practiceth augury" (me\'onen) is of uncertain etymology, but the tabbins connect it with \'ayin, "an eye"; literally therefore one who ogles, or who bewitches with the evil eye. "An enchanter" (menachesh), sometimes supposed to be a snakecharmer, is probably one who fascinates like a snake; in other words a mesmerist or hypnotist. The word occurs in connection with Joseph\'s divining-cup, and such cups were employed both in Babylon and Egypt, and their use was akin to the more modern crystal-gazing, the hypnotic state being induced by prolonged staring, as in the fascination ascribed to serpents. On this account, snakes were sometimes figured upon such cups. Thus in Talmud we read: "If one finds vessels with delineations of the sun, the moon, or of a serpent upon them, let him cast them into the salt sea" (\'Abho-dhah-Zarah, fol 42, <span class="noTag">col. 2</span>). "A sorcerer" (mekhashsheph) is one who mutters incantations or speaks in ventriloquial whispers, as if under the influence of the spirits of the dead. "A charmer" (chobher chebher), is one who inflicts a spell by weaving magical knots. "A consulter with a familiar spirit" (\'obh), denotes one who is possessed of a python or soothsaying demon. Such were the woman of Endor whom Saul consulted on the eve of the battle of Gilboa (<a onClick="return mV(\'1Sa\',28,\'1-\');">1Sa 28</a>) and the pythoness of Philippi out of whom Paul cast the spirit (<a onClick="return mV(\'Act\',16,\'16-18\');">Ac 16:16-18</a>). The word (\'obh) means "bottle" and either indicates that the medium was the receptacle of the spirit or is a relic of the old tradition that genii (jinns) might be enslaved and imprisoned in bottles by means of magical incantations. "A wizard" (yidh\'oni) means a wise man, "a knowing one." The word in Old Testament is always used in connection with \'obh, and denotes a man who could interpret the ravings of the medium. "A necromancer" (doresh \'el ha-methim) is one who calls up the spirits of the dead and has intercourse with them. "Consulting the teraphim" (<a onClick="return mV(\'Eze\',21,21);">Eze 21:21</a>) may have been a form of consulting the dead, if, as is probable, the teraphim were ancestral images, raised by superstition to the rank of household gods. The manner of consultation we do not know; but as an illustration of the use of the image of a dead person, we may remember that a modern medium will often ask for a portrait of a deceased relative for the alleged purpose of entering into communication with the departed spirit.<P>It will be seen that these forms of soothsaying are allied to the arts which in modern times bear the names of hypnotism and mediumship. They are more briefly referred to in <a onClick="return mV(\'Isa\',8,19);">Isa 8:19</a>, "When they shall say unto you, Seek unto them that have familiar spirits and unto the wizards, that chirp and that mutter: should not a people seek unto their God? on behalf of the living should they seek unto the dead?" Here again mediumship and spiritism are connected with the ventriloquial whispers and mutterings, which are supposed to be characteristic of the utterances of the dead.<P>2. Divination:<P>But the first term in the catalogue, "one that useth divination" (qecem) is of wider application. It signifies a "divider" and refers to the practice which men have followed in an infinite variety of ways for trying to get light upon the future by resorting to what seems to them the arbitrament of chance. The results of a battle and of the fall of dice are alike unknown beforehand. But the second can be tested, and men assume that the result of the first will correspond to the second. Any chance will serve; the shuffling of a pack of cards; the flight of birds; the arrangement of dregs in a cup; nothing is too trivial for the purpose. The allotment of a particular interpretation to a particular sign was of course purely arbitrary, but the method could be applied in an infinite number of ways, every one of which could be worked out to an extent only limited by the limits of the misdirected ingenuity of man. Two such forms of "divination," that is of "dividing," are mentioned by Ezekiel in his description of the king of Babylon: "The king of Babylon stood at the parting of the way, at the head of the two ways, to use divination (qecem): he shook the arrows to and fro, he consulted the teraphim, he looked in the liver" (<a onClick="return mV(\'Eze\',21,21);">Eze 21:21</a>). The arrows were either marked to represent certain courses of action, and one was drawn out or shaken out, or else they were thrown promiscuously up into the air, and the augury was deduced from the way in which they fell.<P>3. "Looking in the Liver":<P>"Looking in the liver" is one of the most venerable forms of divination. Here again it was a question of "division." Each of the various parts of the liver, its lobes, the gall bladder, the ducts and so forth, had a special significance allotted to it, theory, apparently, being that the god to whom the animal was sacrificed revealed his will by the way in which he molded the organ which was supposed to be the seat of the victim\'s life.<P>It will be noted that no explicit mention is made of astrology in this catalogue of the modes of soothsaying. But astrology was, as will be shown, closely connected with Moloch-worship, and was most directly a form of "divination," that is of division. Morris Jastrow the Younger indeed considers that astrology rose from hepatoscopy, and points out that, the common designation for "planet" amongst the Babylonians is a compound ideograph, the two elements of which signify "sheep" and "dead." He considers that the sacrificial sheep was offered to the deity specially for the purpose of securing an omen. Hence, when the planets were used as omens, this name of "slain sheep" was naturally applied to them, even as "augury," divination by the flight of birds, came to represent amongst the Romans all kinds of divination. "On the famous bronze model of a liver found near Piacenza and which dating from about the 3rd century BC was used as an object-lesson for instruction in hepatoscopy, precisely as the clay model of a liver dating from the Hammurabi period was used in a Babylonian temple school, we find the edge of the liver divided into sixteen regions with names of the deities inhabiting them corresponding to divisions of the heavens in which the gods have their seats, while on the reverse side there is a line dividing the liver into \'day\' and \'night.\' Professor Korte, in a study of this remarkable object, summing up the results of many years of research, explains this by showing that the liver was regarded as a microcosm reflecting the macrocosm, or, in other words, the liver of the sacrificial animal from being originally a reflection of the soul or mind of the god to whom the animal was offered, was brought into connection with the observation of the heavenly bodies revealing the intention of the gods acting in concert" (Morris Jastrow, Jr., "Hepatoscopy and Astrology in Babylonia and Assyria," in Proc. Amer. Phil. Soc., 665-66). Three well-marked classes of astrology, that is to say of divination by the heavenly bodies, are mentioned in <a onClick="return mV(\'Isa\',47,13);">Isa 47:13</a>, as being practiced in Babylon. "Let now the astrologers, the star-gazers, the monthly prognosticators, stand up, and save thee."<P>4. The Astrologers, or Dividers of the Heavens:<P>The astrologers are the "dividers of the heavens" (hobhere shamayim); that is to say the significance of any stellar conjunction was made to depend upon the division of the heavens in which it occurred. The earliest of such divisions appears to have been into the four quarters, north, south, east, west, and astrological tablets of this character have been discovered in considerable numbers. Thus tablet W. A. I. III, 56,1,gives a table of eclipses for each day of the month Tammuz up to the middle of the month, and the significance of the eclipse is connected with the quarter in which it was seen. On the first day the eclipse is associated with the south, on the second with the north, on the third with the east, and on the fourth with the west (Sayce, Astronomy and Astrology of the Babylonians, 222). Tablets of this description are very instructive since they prove that those who drew up such lists of omens had not even a rudimentary knowledge of astronomy. For the Babylonian months were intended to be natural months, yet at this time it was not realized that an eclipse of the sun could only take place when the moon was invisible, that is to say about the 28th or 29th day of the month, if the calendar was correct. Further, it was not realized that neither sun nor moon can ever be in the north in the latitude of Babylon. Such tables of omens then were not derived, as has sometimes been supposed, from a striking event having occurred near the time of an observed eclipse, but they must have been drawn up on an entirely arbitrary plan.<P>The same principle of "division" was applied to the moon itself for the purpose of drawing omens from its eclipses. Thus in R. C. Thompson\'s Reports of the Magicians and Astrologers of Nineveh and Babylon we read in No. 268, "The omens of all lands. The right of the moon is Akkad, the left Elam, the top Aharru, the bottom Subartu." The constellations of the zodiac also had omens allotted to them in a similar manner.<P>5. The Star-gazers, or Seers of the Constellations:<P>The astrologers mentioned in the Book of Daniel (\'ashshaphim) were not "dividers of the heavens," but mutterers of incantations. The star-gazers or seers of the stars or constellations (chozim ba-kokhabhim) may be illustrated from two of Thompson\'s Reports. No. 216, "Saturn has appeared in Leo. When Leo is obscured, for three years lions and jackals...and kill men"; and No. 239, "When Mars (apin) approaches Scorpio the prince will die by a scorpion\'s sting and his son after him will take the throne." It may be remarked that as the planet Saturn takes three years to pass through the constellation Leo, the ravages of lions are predicted to last for that time.<P>At a later date we find a complete system of astrology based upon the constellations of the zodiac which happen to be rising at the moment when the stars were consulted. Examples of this form of divination are found in the works of Zeuchros of Babylon, who flourished about the beginning of our era. By his day the system had received a considerable development. Twelve signs did not give much scope for prediction, so each sign had been divided into three equal portions or "decans"; each decan therefore corresponding nearly to the part of the ecliptic which the sun would pass through in a decade or "week" of 10 days of the Egyptians. A yet further complexity was brought about by associating each one of the 36 decans with one of the 36 extra-zodiacal constellations, and a further variety was obtained by associating each zodiacal constellation with its sunanatellon, or constellation rising with it; that is, at the same time; or with its paranatellon, or constellation rising beside it; that is, a constellation on the same meridian. At what time these particular forms of augury by the constellations came into use we do not know, but the division into the decans is distinctly alluded to in the 5th tablet of the Bah Creation Epic: "4. For the twelve months he (Marduk) fixed three stars."<P>6. The Monthly Prognosticators, or Men Who Knew the Omens of the New Moon:<P>The monthly prognosticators were the men who knew the omens of the new moon (modhi\'im le-chodh-ashim). At one time the error of the calendar was made the basis of prediction. This is seen in the great astrological work based on the omens drawn up for Sargon of Agade, and entitled from its opening phrase Enuma anu Bel, "When the heaven god Bel" (the "Illumination of Bel"), as, for instance, "The moon as on the 1st day is seen in its appearance on the 27th day; evil is fixed for the land of Elam"; and "The moon as on the 1st day is seen on the 28th day: evil is fixed for the land of the Ahurru." Other omens were drawn from the position of the horns of the new moon when first seen; the right horn being assigned to the king and the left to his enemies, as in Thompson\'s Reports, No. 25: "When at the moon\'s appearance its right horn is high (literally, "long") and its left horn is low (literally, "short") the king\'s hand will conquer land other than this." The "monthly prognosticators" had not learned that the righthand horn is always the higher and that the amount of its elevation depends on the time of the year, or they kept the knowledge to themselves.<P>II. The Worship of the Heavenly Bodies the form of Idolatry to Which the Israelites Were Most Prone.<P>As we should naturally expect, the earliest astrological tablets relate chiefly to omens dependent upon the two great lights, the sun and moon. There is no evidence at present available to fix the date when the planets were first recognized as distinct from the fixed stars. Probably this discovery was intimately connected with the formation of the constellations; it cannot have been long delayed after it. Certainly planet-worship, and as connected with it, planetary divination, prevailed in the Euphrates valley at a very early period.<P>1. Chiun, Certainly the Planet Saturn:<P>One planet is certainly mentioned in Old Testament, and we may safely infer that the other four were known, since this particular planet is the least conspicuous both in brightness and in motion, and was therefore probably the last to be discovered. The reference to Saturn occurs in <a onClick="return mV(\'Amo\',5,25,26);">Am 5:25-26</a>: "Did ye bring unto me sacrifices and offerings in the wilderness forty years, O house of Israel? Yea, ye have borne the tabernacle of your king (the King James Version Moloch) and the shrine of (the King James Version Chiun) your images, the star of your god, which ye made to yourselves." This passage was quited from Septuagint by Stephen in his defense, "And they made a calf in those days, and brought a sacrifice unto the idol, and rejoiced in the works of their hands. But God turned, and gave them up to serve the host of heaven; as it is written in the book of the prophets," " Did ye offer unto me slain beasts and sacrifices Forty years in the wilderness, O house of Israel? And ye took up the tabernacle of Moloch, And the star of the god Rephan, The figures which ye made to worship them" (<a onClick="return mV(\'Act\',7,\'41-43\');">Ac 7:41-43</a>). The difference between the names Chiun and Rephan, is due either to Rephan being local Egyptian name for the planet Saturn, and therefore used by the Septuagint as its equivalent, or to an actual error of transcription in the text from which they were translating: the initial of the word being taken as resh (r) when it should have been kaph (k), r instead of k. The word should therefore be transliterated Kaivan, which was the name of the planet Saturn amongst the ancient Arabs and Syrians, while kaimanu, "constant" or "regular," was its name with the Assyrians. The English Revised Version in <a onClick="return mV(\'Amo\',5,26);">Am 5:26</a> adopts the reading of the King James Version margin, "Siccuth your king," Moloch meaning king; but the authority of the Septuagint and the parallelism of the text and its general line of thought support the reading given by some of the ancient versions and followed by the King James Version.<P>2. Saturn or Moloch Worship:<P>The difficulty of the passage is that both Amos and Stephen appear to represent the worship of the golden calf as identical with the worship of Moloch and of the planet Saturn; yet though Kaivan is only mentioned here, the nature of the reference would imply that this deity was one familiar both to speaker and hearers. The difficulty vanishes at once, if the plain statement of Stephen be accepted, that when God permitted Israel to "go after the stubbornness of their heart, that they might walk in their own counsels" (<a onClick="return mV(\'Psa\',81,12);">Ps 81:12</a>) He "gave them up to serve the host of heaven." The worship of the golden calf was star worship; it was the solar bull, the constellation Taurus, in which the sun was at the time of the spring equinox, that was thus represented. The golden calf was therefore analogous to the familiar symbol of the Mithraic cult, the bull slain by Mithra, Sol Invictus, if indeed the latter did not take its origin from this apostasy of Israel.<P>See <a href="./study/isbe/search.html?string=CALF+GOLDEN">CALF, GOLDEN</a>.<P>And Moloch the king, the idol of the Ammonites and Phoenicians, was intimately connected both with the solar bull and the planet Saturn. According to the rabbins, his statue was of brass, with a human body but the head of an ox. On the Carthaginian worship of Moloch or Saturn, Diodorus (book xx, chapter i) writes: "Among the Carthaginians there was a brazen statue of Saturn putting forth the palms of his hands bending in such a manner toward the earth, as that the boy who was laid upon them, in order to be sacrificed, should slip off, and so fall down headlong into a deep fiery furnace. Hence it is probable that Euripides took what he fabulously relates concerning the sacrifice in Taurus, where he introduces Iphigenia asking Orestes this question: \'But what sepulchre will me dead receive, shall the gulf of sacred fire me have?\' The ancient fable likewise that is common among all the Grecians, that Saturn devoured his own children, seems to be confirmed by this law among the Carthaginians." The parallelism of the text therefore is very complete. The Israelites professed to be carrying the tabernacle of Yahweh upon which rested the Shekinah glory; but in spirit they were carrying the tabernacle of the cruelest and most malignant of all the deities of the heathen, and the light in which they were rejoicing was the star of the planet assigned to that deity.<P>Moloch then was the sun as king, and especially the sun as he entered upon what might be considered his peculiar kingdom, the zodiac from Taurus to Serpens and Scorpio, the period of the six summer months. The connection of the sun with Saturn may seem to us somewhat forced, but we have the most direct testimony that such a connection was believed in by the Babylonians. In Thompson\'s Reports, obverse of No. 176 reads: "When the sun stands in the place of the moon, the king of the land will be secure on his throne. When the sun stands above or below the moon, the foundation of the throne will be secure." The "sun" in this inscription clearly cannot be the actual sun, and it is explained on the reverse as being "the star of the sun," the planet Saturn. No. 176 rev. reads: "Last night Saturn drew near to the moon. Saturn is the star of the sun. This is the interpretation: it is lucky for the king. The sun is the king\'s star." The connection between the sun and Saturn probably arose from both being taken as symbols of Time. The return of the sun to the beginning of the zodiac marked the completion of the year. Saturn, the slowest moving of all the heavenly bodies, accomplished its revolution through the signs of the zodiac in about 30 years, a complete generation of men. Saturn therefore was in a peculiar sense the symbol of Time, and because of Time, of Destiny.<P>3. Mazzaloth, or Planet Worship:<P>The connection between the worship of the golden calves, of the heavenly host and of Moloch, and of these with divination and enchantments, is brought out very clearly in the judgment which the writer of the Book of Kings pronounces upon the apostate ten tribes: "They forsook all the commandments of Yahweh their God, and made them molten images, even two calves, and made an Asherah, and worshipped all the host of heaven, and served Baal. And they caused their sons and their daughters to pass through the fire, and used divination and enchantments" (<a onClick="return mV(\'2Ki\',17,16,17);">2Ki 17:16-17</a>). The sin of apostate Judah was akin to the sin of apostate Israel. In the reformation of Josiah, he put down the idolatrous priests that "burned incense unto Baal, to the sun, and to the moon, and to the planets (mazzaloth), and to all the host of heaven" (<a onClick="return mV(\'2Ki\',23,5);">2Ki 23:5</a>). He also destroyed the \'asherah and he "defiled Topheth...that no man might make his son or his daughter to pass through the fire to Molech" (<a onClick="return mV(\'2Ki\',23,10);">2Ki 23:10</a>). "Moreover them that had familiar spirits, and the wizards, and the teraphim, and the idols, and all the abominations that were seen in the land of Judah and in Jerusalem, did Josiah put away" (<a onClick="return mV(\'2Ki\',23,24);">2Ki 23:24</a>). The idolatries to which the Israelites of both kingdoms were especially prone were those of the heavenly bodies, and inextricably woven with them was the passion for employing those heavenly bodies as omens, and in consequence for every kind of divination and witchcraft.<P>The word translated "planets" in <a onClick="return mV(\'2Ki\',23,5);">2Ki 23:5</a> is mazzaloth, closely akin to the mazzaroth of <a onClick="return mV(\'Job\',38,32);">Job 38:32</a>. This rendering probably reproduces correctly the meaning of the original. R. C. Thompson in his introduction to the Reports writes (xxvii): "The places where the gods stood in the zodiac were called manzalti, a word which means literally \'stations,\' and we are probably right in assuming that it is the equivalent of the mazzaloth mentioned in <a onClick="return mV(\'2Ki\',23,5);">2Ki 23:5</a>. The use of the word in late Hebrew is, however, somewhat more vague, for mazzal, though literally meaning a constellation of the zodiac, is also applied to any or every star, and in the Ber\'shith Rabba\', cx, it is said \'One mazzal completeth its circuit in thirty days, another completeth it in thirty years.\' " The two bodies referred to are evidently the moon with its lunation of about 30 days, and Saturn with its revolution of about 30 years; these being the two planets with the shortest and longest periods respectively. By a natural metonymy, mazzaloth, the complete circuit of the zodiac, came also to mean mazzaloth, the bodies that performed that circuit, just as in the present day we speak of a railway, which means literally the "permanent way," when we really mean the trains that travel upon it.<P>4. Gadh and Meni or Star Worship:<P>The references in Old Testament to the planets other than Saturn are not so clear. In <a onClick="return mV(\'Isa\',65,11);">Isa 65:11</a> two deities are apparently referred to: "Ye that forsake Yahweh, that forget my holy mountain, that prepare a table for Fortune (Gad), and that fill up mingled wine unto Destiny (Meni); I will destine you to the sword, and ye shall all bow down to the slaughter." It is clear that Gad and Meni are the titles of two closely associated deities, and Gesenius identifies them with Jupiter and Venus, the Greater and Lesser Good Fortunes of the astrologers; But as I have suggested in the Astronomy of the Bible (133, 217), if any of the heavenly bodies are here intended (which cannot as yet be considered certain), it is more probable that they are the two beautiful starclusters that stand on the head and the shoulder of the Bull at the old commencement of the zodiac, as if they marked the gateway of the year—the Hyades and Pleiades. Both groups were considered traditionally as composed of seven stars; and the two names Gadh (the Hyades) and Meni (the Pleiades) taken together give the meaning of the "Fortunate Number," i.e. seven. The lectisternia—the spreading the table and mingling the wine to Gadh and Meni—at the beginning of the year to secure good fortune throughout its course, were therefore held about the time of the Passover, as if in parody, if indeed they were not a desecration of it: heathen rites added to one of the most solemn services of Yahweh.<P>5. Lucifer, the Shining Star:<P>The planet Venus is more distinctly referred to in <a onClick="return mV(\'Isa\',14,12);">Isa 14:12</a>: "How art thou fallen from heaven, O Lucifer, son of the morning!" (the King James Version). The word here rendered Lucifer, that is, "light-bearer," is the word helel corresponding to the Assyrian mustelil, "the shining star," an epithet to which the planet Venus has a preeminent claim. Mars and Mercury, the two remaining planets, are not mentioned as such in Old Testament, but the deities connected with them, Nergal = Mars (<a onClick="return mV(\'2Ki\',17,30);">2Ki 17:30</a>) and Nebo = Mercury (<a onClick="return mV(\'Isa\',46,1);">Isa 46:1</a>), both occur.<P>III. Systems of Astrology.<P>1. Names of the Week-Days, Due to an Astrological System:<P>In astrology the planets were regarded as being 7 in number, but the idea that the <span class="noTag">number 7</span> derived its sacredness from this fact is an inversion of the true state of the case. It was that 7 being regarded as a sacred number, the number of the planets was artificially made to correspond by including in the same class as the five wandering stars, bodies that differed so widely from them in appearance as the sun and moon. So artificial a classification cannot have been primitive, and it is significant that in <a onClick="return mV(\'Gen\',1,14);">Ge 1:14</a> the sun and moon are presented as being (as indeed they appear to be) of an altogether different order from the rest of the heavenly bodies. Yet there is one feature that they have in common with the five planets: all move among the stars within the band of the zodiac; each of the seven makes the circuit of the mazzaloth.<P>We owe the names of the days of the week to this astrological conception of the planets as being 7 in number, and some writers (e. g. R. A. Proctor in his Myths and Marvels of Astronomy, 43-47) have supposed that the week of 7 days owed its origin to this astrological conception and that the 7th day—Saturn\'s Day—became the Sabbath, the Day of Rest, because Saturn was the planet of ill-omen and it was then unlucky to undertake any work. The way in which the allotment of the planets to the days of the week was arrived at was the following. The Greek astronomers and mathematicians concluded that the planet Saturn was the most distant from the earth and that the others followed in the descending order of Jupiter, Mars, Sun, Venus, Mercury, Moon. In the progress of astrology there came a time when it was found necessary to assign a planet to every hour so as to increase the number of omens it could afford. Starting then with Saturn as presiding over the first hour of the first day, each planet was used three times over on that day, and three planets were used a fourth time. The sun, the fourth planet, took therefore the first hour of the second day, and gave it its name, so that Sunday followed Saturday. In like manner the third day became the moon\'s day, and so on with the other planets which followed in the order Mars, Mercury, Jupiter, Venus, and again Saturn. This idea of the relative distances of the planets was that arrived at by the astronomers of Alexandria, and was necessarily subsequent to the reduction of the planetary motions to a mathematical system by Eudoxus and his successors. The division of the day implied was one of 24 hours, not of 12; the Egyptian division, not the Babylonian. But the Egyptian week was one of 10 days, the 7-day week was Semitic, and the week implied in the system is the free week, running on continuously, the Jewish week, not the Babylonian. For the Babylonians, though they paid some attention to the 7th day, began their reckoning afresh at the beginning of each month. This particular astrological system therefore owed its origin to four distinct nationalities. The conception of the influence of the planets was Babylonian; the mathematical working out of the order of the planets was exclusively Gr; the division of the day into 24 hours was Egyptian; the free continuous 7-day week was particularly Jewish. These four influences were brought together in Alexandria not very long before the Christian era. Here therefore and at this time, this particular system of astrology took its origin.<P>This form of astrology was readily adopted by the Jews in their degenerate days, as we find from references in Talmud. Thus, Rabbi Chanena said to his disciples, "Go and tell Ben Laive, the planetary influence does not depend upon days but hours. He that is born under the influence of the sun (no matter on what day) will have a beaming face"; and so the rabbi went through the whole list of the planets (Shabbath, fol 156, <span class="noTag">col. 1</span>). The above was spoken as a criticism of Rabbi Shimon Ben Laive who had written, "Whoever is born on the first day of the week will be either a thoroughly good or a thoroughly bad man; because light and darkness was created on that day"; and the rabbi spoke similarly for the other days. We get a relic of this superstition in our nursery rhyme, "Monday\'s child is full of grace; Tuesday\'s child is fair of face," etc.; and some present-day astrologers still use the system for their forecasts. It will of course be noted that the system takes no account of the actual positions of the heavenly bodies; the moon does not shine more or less on Monday than on any other day.<P>2. Origin of Modern Astrology:<P>It was from Alexandrian astrology that modern astrology immediately derived its form; but the original source of all astrology in the ancient world lay in the system of planetary idolatry prevalent in the Euphrates valley, and in the fact that this idolatry was practiced chiefly for the purpose of divination. At one time it was supposed that a real astronomy was cultivated at an early time in Babylonia, but Jastrow, Kugler and others have shown that this idea is without basis. The former writes, "The fact however is significant that, with perhaps some exceptions, we have in the library of Ashurbanipal representing to a large extent copies from older originals, no text that can properly be called astronomical ..... It is certainly significant that the astronomical tablets so far found belong to the latest period, and in fact to the age following on the fall of the Babylonian empire. According to Kugler the oldest dated genuinely astronomical tablet belongs to the 7th year of Cambyses, i.e. 522 BC" ("Hepatoscopy and Astrology in Babylonia and Assyria," in Proc. Amer. Phil. Soc., 667).<P>The conquests of Alexander the Great brought into close connection with each other the Babylonian and Greek systems of thought, and Babylonian astrology was introduced to the Greeks by Berosus the Chaldean priest. In Greek hands, astrology was changed from its character of an oriental religion into the appearance of a science. In Babylonia the stars had been consulted for the benefit of the king as representing the state; amongst the Greeks, with their strong individualistic tendency, the fortunes of the individual became the most frequent subject of inquiry, and the idea was originated of determining the character and fortune of a man from the position of the stars at his birth—genethlialogy—a phase of astrology which never existed in the Euphrates valley. This extension rendered it necessary to increase greatly the complexities of the omens, and the progress which the Greeks had made in mathematics supplied them with the means of doing so. Thus came into existence that complex and symmetrical system of divination of which we have the earliest complete exposition in the writings of Claudius Ptolemy about 130 AD; a system which, though modified in details, is in effect that in use today.<P>3. "Curious Arts" of Ephesus:<P>Since this mathematical astrology did not come into existence until about the commencement of the Christian era, it is clear that there could not be any reference to its particular form in the Old Testament. We may probably see one reference in the New Testament (<a onClick="return mV(\'Act\',19,19);">Ac 19:19</a>). Of the converts at Ephesus it is written, "Not a few of them that practiced magical arts brought their books together and burned them in the sight of all; and they counted the price of them, and found it 50,000 pieces of silver." Books of magical incantations and prescriptions were certainly included, but it is also likely that the almanacs, tables and formulas, essential to the astrologer for the exercise of his art, were also in the number. It was of course impossible then, as now, for the convert to Christianity to consult astrologers or to practice astrological divination. Partly because it was an absurdity, for the divisions of the heavens upon which the predictions are based, are purely imaginary; the "signs" of the zodiac, and the "houses" have nothing whatsoever correspending to them in Nature; such division is exactly that denounced by the prophets of old as qecem, "divination." Next, and of more importance, it ascribes to mere creatures, the planets or the spirits supposed to preside over them, the powers that belong to God alone; it was and is essentially idolatrous. As one of the chief living astrologers puts it, "The <span class="noTag">TRUE</span> astrologer believes that the sun is the body of the Loges of this solar system, \'in Him we live and move and have our being.\' The planets are his angels, being modifications in the consciousness of the Loges" (Knowledge, XXIII, 228). Astrology is indeed referred to in the Old Testament, with other forms of divination, and the idolatry inherent in them, but they are only mentioned in terms of the most utter reprobation. The Jews alone of all the nations of antiquity were taught by their religion neither to resort to such arts nor to be afraid of the omens deduced from them. Isaiah knew the Lord to be He that "frustrateth the signs of the liars, and maketh diviners mad" (<a onClick="return mV(\'Isa\',44,25);">Isa 44:25</a>), and Jeremiah declared, "Thus saith Yahweh, Learn not the way of the nations, and be not dismayed at the signs of heaven; for the nations are dismayed at them" (<a onClick="return mV(\'Jer\',10,2);">Jer 10:2</a>). And what held good for the Jews of old holds good for us today. Above all, astrology is an attempt to ascertain the will of God by other means than those which He has appointed—His Son, who is the Way and the Truth and the Life, and His Holy Scriptures in which we learn of Him, and which are able to make us "wise unto salvation through faith which is in Christ Jesus" (<a onClick="return mV(\'2Ti\',3,15);">2Ti 3:15</a>).<P>LITERATURE.<P>Franz Boll, Sphaera: Neue griechische Texte und Untersuchungen zur Geschichte der Sternbilder, 1903; Kugler, Kulturhistorische Bedeutung der babylonischen Astronomie, 1907; Sternkunde und Sterndienst in Babel; E. W. Maunder, Astronomy of the Bible, 1908; The Bible and Astronomy, Annual Address before the Victoria Institute, 1908; E. W. Maunder and A. S. D. Maunder, "Note on the Date of the Passage of the Vernal Equinox from Taurus into Aries," in Monthly Notices of the Royal Astronomical Society, LXIV, 488-507; also three papers on "The Oldest Astronomy" in Journal of the British Astronomical Association, VIII, 373; IX, 317; XIV, 241; R. A. Proctor, Myths and Marvels of Astronomy; R. C. Thompson, Reports of the Magicians and Astrologers of Nineveh and Babylon; G. V. Schiaparelli, Astronomy in the Old Testament; also two papers, "I Primordi" and "I Progressi dell\' Astronomia presso i Babilonesi," in Rivista di Scienzia, 1908; C. Virolleaud, L\'astrologie chaldeenne. Le livre intitule "Enuma Anu Bel," 1908, 1909.``119';
isbe[911]='Astronomy, I`as-tron\'-omi:<P><b>I. THE HEAVENLY BODIES</b><P class="in15">1. The Ordinances of Heaven<P class="in15">2. The Sun<P class="in30">(1) The Names for the Sun<P class="in30">(2) The "City of the Sun"<P class="in30">(3) The Greater Light-Giver<P class="in30">(4) The Purpose of the Sun<P class="in30">(5) The Sun as a Type<P class="in15">3. The Moon<P class="in30">(1) The Names for the Moon<P class="in30">(2) The Lesser Light-Giver<P class="in30">(3) Phases of the Moon<P class="in15">4. Signs<P class="in30">(1) Solar and Lunar Eclipses<P class="in30">(2) The Wings of the Morning<P class="in15">5. Seasons<P class="in30">(1) The Meaning of the Word<P class="in30">(2) Natural Seasons for Worship<P class="in30">(3) The Hallowing of the Seventh<P class="in30">(4) The Jubilee a Luni-solar Cycle<P class="in30">(5) The 19-Year Luni-solar Cycle<P class="in30">(6) The Jewish Ritual Preexilic<P class="in30">(7) The Luni-solar Cycles of Daniel<P class="in15">6. The Stars<P class="in30">(1) Their Number<P class="in30">(2) Their Distance<P class="in30">(3) Their Brightness<P class="in15">7. Morning Stars<P class="in30">The Stars as a Dial<P class="in15">8. Falling Stars<P class="in30">(1) Meteorites<P class="in30">(2) The Star "Wormwood"<P class="in15">9. Wandering Stars<P class="in30">(1) Comets as a Spiritual Type<P class="in30">(2) Comets Referred to in Scripture?<P><b>II. THE CONSTELLATIONS</b><P class="in15">1. Nachash, the "Crooked Serpent"<P class="in15">2. Leviathan<P class="in15">3. The Seed of the Woman<P class="in15">4. The Bow Set in the Cloud<P class="in15">5. The Dragon of Eclipse<P class="in15">6. Joseph\'s Dream<P class="in15">7. The Standards of the Tribes<P class="in15">8. The Cherubim<P class="in15">9. Balaam\'s Prophecy<P class="in15">10. Pleiades<P class="in15">11. Orion<P class="in15">12. Mazzaroth, the Constellations of the Zodiac<P class="in15">13. "Arcturus"<P class="in30">(1) The "Scatterers," or the North<P class="in30">(2) The Ordinances of Heaven Established on the Earth<P class="in15">14. The Date of the Book of Job<P><b>III. PHYSIOGRAPHY</b><P class="in15">1. The Circle of the Earth<P class="in30">(1) The Earth a Sphere<P class="in30">(2) The North Stretched out over Empty Space<P class="in30">(3) The Corners of the Earth<P class="in15">2. The Pillars of the Earth<P class="in15">3. The Firmament<P class="in30">(1) The Hebrew Conception<P class="in30">(2) The Alexandrian Conception<P class="in15">4. The Windows of Heaven<P class="in15">5. Rain<P class="in15">6. Clouds<P class="in15">7. The Deep<P class="in30">(1) Meaning of the Word<P class="in30">(2) The Babylonian Dragon of Chaos<P><b>LITERATURE</b><hr /><P>The keynote of the Hebrew writers respecting the heavenly bodies is sounded in <a onClick="return mV(\'Psa\',8,\'1-\');">Ps 8</a>: " When I consider thy heavens, the work of thy fingers, The moon and the stars, which thou hast ordained; What is man, that thou art mindful of him? And the son of man, that thou visitest him? For thou hast made him but little lower than God, And crownest him with glory and honor. Thou makest him to have dominion over the works of thy hands; Thou hast put all things under his feet" (<a onClick="return mV(\'Psa\',8,\'3-6\');">Ps 8:3-6</a>). The heavenly bodies were inexpressibly glorious, and they were all the handiwork of Yahweh—without power or vitality of their own—and man, not by any inherent virtue, but by the will and grace of God, was superior to them in importance. Thus there was a great gulf fixed between the superstitions of the heathen who worshipped the sun, moon and stars as gods, and the faith of the pious Hebrew who regarded them as things made and moved by the will of one only God. And it followed from this difference that the Hebrew, beyond all nations of like antiquity, was filled with a keen delight in natural objects and phenomena, and was attentively observant of them.<P>I. The Heavenly Bodies.<P>1. The Ordinances of Heaven:<P>To the sacred writers, the ordinances of heaven taught the lesson of Order—great, magnificent and immutable. Day by day, the sun rose in the east, "as a bridegroom coming out of his chamber" (<a onClick="return mV(\'Psa\',19,5);">Ps 19:5</a>), and pursued unswervingly his appointed path across the sky, to his going down. Night by night, the stars, the "host of heaven," moved in their "highways" or "courses" (mecillah), and the words of Joel (<a onClick="return mV(\'Joe\',2,7);">2:7</A>) respecting the Assyrian army might be applied to them. "They march every one on his ways, and they break not their ranks. Neither doth one thrust another; they march every one in his path." Some wheeled in northern circuits that were wholly seen; some swept in long courses from their rising in the east to their setting in the west; some scarcely lifted themselves above the southern horizon. Little wonder that this celestial army on the march, "the host of heaven," suggested to the Hebrews a comparison with the "angels," the unseen messengers of God who in their "thousands of thousands ministered unto him" (<a onClick="return mV(\'Dan\',7,10);">Da 7:10</a>).<P>But, as the year revolved, the dial of stars in the north shifted round; whilst of the other stars, those in the west disappeared into the light of the setting sun, and new stars seemed to spring out of the dawning light. There was thus a yearly procession of the stars as well as a nightly one. And to this "ordinance of the heaven" the Hebrews noted that there was an answer from the earth, for in unfailing correspondence came the succession of seasons, the revival of vegetation, the ripening of harvest and of fruits, the return of winter\'s cold. Of them God asked the question: "Knowest thou the ordinances of the heavens? Canst thou establish the dominion thereof in the earth?" (<a onClick="return mV(\'Job\',38,33);">Job 38:33</a>), and they recognized that to this question no answer could be given, for these ordinances of heaven were the sign and evidence of Almighty wisdom, power and unchangeableness. "Thus saith Yahweh, who giveth the sun for a light by day, and the ordinances of the moon and of the stars for a light by night...Yahweh of hosts is his name" (<a onClick="return mV(\'Jer\',31,35);">Jer 31:35</a>).<P>We have no writings of the early Hebrews other than the books of the Old Testament, and in them there is no record of any research into the mechanical explanation of the movements of the heavenly bodies. Nor should we expect to find in them a record of the research if such were made, since the purpose of Holy Scripture was, not to work out the relation of thing to thing—the inquiry to which modern science is devoted—but to reveal God to man. Therefore the lesson which is drawn from the observed ordinances of heaven is, not that the earth rotates on its axis or revolves round the sun, but that God is faithful to His purpose for mankind. "Thus saith Yahweh: If my covenant of day and night stand not, if I have not appointed the ordinances of heaven and earth; then will I also cast away the seed of Jacob, and of David my servant" (<a onClick="return mV(\'Jer\',33,25,26);">Jer 33:25-26</a>). And "the glory of God" which "the heavens declare" is not only His almighty power, but the image which the order and perfection of the heavenly movements supply of the law which He has revealed unto man. The "speech" that they "utter," the "knowledge" that they "show" is: "The law of Yahweh is perfect, restoring the soul" (<a onClick="return mV(\'Psa\',19,7);">Ps 19:7</a>).<P>2. The Sun:<P>(1) The Names for the Sun.<P>Four words are translated "sun" in the Old Testament:<P>(a) Or simply means "light" and is usually rendered thus, but in one instance (<a onClick="return mV(\'Job\',31,26);">Job 31:26</a>), being in antithesis to "moon," it is given as "sun," the great light-giver.<P>(b) Chammah means "heat" and is used for the sun when this is in association with lebhanah or "snow-white" for the moon, as in <a onClick="return mV(\'Isa\',24,23);">Isa 24:23</a>, \'Then the snow-white (moon) shall be confounded, and the heat (sun) ashamed,\' the antithesis being drawn between the cold light of the silver moon and the fiery radiance, of the glowing sun.<P>(c) Shemesh, the Samas of the Babylonians, is a primitive word, probably with the root meaning of "ministrant." This is the word most frequently used for the sun, and we find it used topographically as, for instance, in Beth-shemesh, "the house of the sun." Four places of this name are mentioned in the Old Testament: one in Judah, a Levitical city, to which the two milch kine bearing the ark took their straight way from the country of the Philistines; one on the border of Issachar; one in Naphtali, a fenced city; and one in Egypt, supposed to be the same as Heliopolis or On, the city of Asenath, wife of Joseph.<P>(d) Cherec means "blister" or "burning heat," from a root "to scratch" or "be rough," and is an unusual term for the sun, and its precise rendering is sometimes in doubt. Once it is translated as "itch," when it occurs amongst the evils threatened in the "cursings" that the six tribes uttered from Mount Ebal (<a onClick="return mV(\'Deu\',28,27);">De 28:27</a>). Once it is certainly used of the sun itself when Job (<a onClick="return mV(\'Job\',9,7);">9:7</A>) said of God, He "commandeth the sun (cherec or cheres), and it riseth not." Once it is certainly the name of a hill, for Mount Heres was near Aijalon, on the borders of Judah and Dan. In another passage, authorities differ in their rendering, for when Gideon overcame Zebah and Zalmunna (<a onClick="return mV(\'Jdg\',8,13);">Jud 8:13</a>), he "returned from the battle," according to the King James Version, "before the sun was up," but according to the Revised Version (British and American), "from the ascent of Heres." In yet another passage (<a onClick="return mV(\'Jdg\',14,18);">Jud 14:18</a>), when the Philistines answered Samson\'s riddle, both the King James Version and the Revised Version (British and American) translation cherec as sun—"before the sun went down." We moreover get slight variants of the same word, joined with qir ("wall" or "fortress"), in Qir-Chareseth (<a onClick="return mV(\'2Ki\',3,25);">2Ki 3:25</a>; <a onClick="return mV(\'Isa\',16,7);">Isa 16:7</a>) and Qir-Cheres (<a onClick="return mV(\'Isa\',16,11);">Isa 16:11</a>; <a onClick="return mV(\'Jer\',48,31,36);">Jer 48:31, 36</a>). These are probably to be identified with the modern Kerak of Moab.<P>(2) The "City of the Sun".<P>But the most interesting reference is found in <a onClick="return mV(\'Isa\',19,18);">Isa 19:18</a>: "In that day there shall be five cities in the land of Egypt that speak the language of Canaan, and swear to Yahweh of hosts; one shall be called The city of destruction." The word here rendered "destruction" is in Hebrew herec, which has that meaning, but Gesenius and other authorities would substitute for the initial letter, he, the letter, cheth, which it so closely resembles, and so read it "The city of the sun." With this reading it was identified with On, that is, Heliopolis (the city of the sun), and on this belief Onias, the son of Onias the high priest, persuaded Ptolemy Philometor to allow him to build a temple to Yahweh in that prefecture, 149 BC (Ant., XIII, iii, 1).<P>(3) The Greater Light-Giver.<P>(e) Yet a fifth expression is used to denote the sun, and in one respect it is the most important and significant of all. In the creation narrative it is called the greater light or rather light-giver (ma\'or): \'And God made the two great light-givers; the greater light-giver to rule the day, and the lesser light-giver to rule the night: He made the stars also\' (<a onClick="return mV(\'Gen\',1,16);">Ge 1:16</a>). The extreme simplicity of this passage is most significant. In marked contrast to the Bah creation poem, which by its more complex astronomy reveals its later origin (see post, section II,12,Mazzaroth), the sun and moon have no distinctive names assigned to them; there is no recognition of the grouping of the stars into constellations, none of any of the planets. The celestial bodies could not be referred to in a more simple manner. And this simplicity is marred by no myth; there is not the faintest trace of the deification of sun or moon or stars; there is no anthropomorphic treatment, no suggestion that they formed the vehicles for spirits. They are described as they were observed when they were first noticed by men, simply as "light-givers" of different brightness. It is the expression of man\'s earliest observation of the heavenly bodies, but it is real observation, free from any taint of savage fantasies; it marks the very first step in astronomy. No record, oral or written, has been preserved to us of a character more markedly primitive than this.<P>(4) The Purpose of the Sun.<P>Two purposes for the great heavenly bodies are indicated in <a onClick="return mV(\'Gen\',1,14,15);">Ge 1:14-15</a>. The sun and moon are appointed to give light and to measure time. These, from the human and practical point of view, are the two main services which they render to us. Their purpose for measuring time by their movements will be taken up under another heading; but here it may be pointed out that when it is stated in the Book of The Wisdom of Solomon (7:18) that King Solomon knew "the alternations of the solstices and the changes of seasons," the reference is to the whole cycle of changes from winter through summer back to winter again. From winter onward the places of sunrise and sunset move northward along the horizon until midsummer when for some days they show no change—the "solstice" is reached; then from midsummer onward the movement "turns" southward until midwinter, when again a "solstice" is reached, after which the places of sunrise and sunset again move northward. This changing place of sunrise is also referred to when God asked Job (<a onClick="return mV(\'Job\',38,12,13,14);">38:12-14</a>): Hast thou "caused the dayspring to know its place," and the passage goes on, "It (the earth) is changed as clay under the seal; and all things stand forth as a garment." As the shapeless clay takes form under the pressure of the seal, as the garment, shapeless while folded up, takes form when the wearer puts it on, so the earth, shapeless during the darkness, takes form and relief and color with the impress upon it of the dawning light. In the New Testament when James (<a onClick="return mV(\'Jam\',1,17);">1:17</a>) speaks of "the Father of lights, with whom can be no variation (parallage), neither shadow that is cast by turning (trope)" he is using astronomical technical terms for these same apparent movements of the sun.<P>(5) The Sun as a Type.<P>But the apparent unchangeability of the sun makes it, as it were, a just measure of eternal duration (<a onClick="return mV(\'Psa\',72,5,17);">Ps 72:5, 17</a>). The penetration of its rays renders "under the sun" (<a onClick="return mV(\'Ecc\',1,9);">Ec 1:9</a>) a fit expression for universality of place, and on the other hand the fierceness of its heat as experienced in Palestine makes it equally suitable as a type of oppression and disaster, so the sun is said, in Scripture, to "smite" those oppressed by its heat (<a onClick="return mV(\'Psa\',121,6);">Ps 121:6</a>).<P>But it was in its light-giving and ministering power that the Hebrew writers used the sun as a type to set forth the power and beneficence of God. Words are the symbols of ideas and it was only by this double symbolism that it was possible to express in intelligible human speech, and to make men partly apprehend some of the attributes of God. So we find in the Ps of pilgrimage (<a onClick="return mV(\'Psa\',84,11);">Ps 84:11</a>) "Yahweh God is a sun and a shield"; Malachi (<a onClick="return mV(\'Mal\',4,2);">4:2</A>) foretells that "the sun of righteousness shall arise with healing in its wings." But the old Hebrew writers were very guarded and careful in the symbolism they used, whether of word or illustration. Men in those days terribly perverted the benefits which they received through the sun, and made them the occasion and excuse for plunging into all kinds of nature worship and of abominable idolatries. It was not only clear thinking on the part of the sacred writers that made them refer all the benefits that came to them in the natural world direct to the action of God; it was a necessity for clean living. There is no bottom to the abyss in which men plunged when they "worshipped and served the creature rather than the Creator, who is blessed for ever" (<a onClick="return mV(\'Rom\',1,25);">Ro 1:25</a>).<P>In New Testament times, though men were no less prone to evil, the fashion of that evil was changing. "The pillars of Beth- shemesh" were broken down (<a onClick="return mV(\'Jer\',43,13);">Jer 43:13</a>), idolatry was beginning to fall into disrepute and men were led away rather by "the knowledge (gnosis) which is falsely so called" (<a onClick="return mV(\'1Ti\',6,20);">1Ti 6:20</a>). The apostles could therefore use symbolism from the natural world more freely, and so we find John speaking of our Lord as "There was the true light, even the light which lighteth every man, coming into the world" (<a onClick="return mV(\'Jhn\',1,9);">Joh 1:9</a>), and again, "God is light, and in him is no darkness at all" (<a onClick="return mV(\'1Jo\',1,5);">1Jo 1:5</a>); and again, that the glory of the New Jerusalem shall be that "the city hath no need of the sun, neither of the moon, to shine upon it: for the glory of God did lighten it, and the lamp thereof is the Lamb" (<a onClick="return mV(\'Rev\',21,23);">Re 21:23</a>); while the great modern discovery that nearly every form of terrestrial energy is derived ultimately from the energy of the sun\'s rays, gives a most striking appropriateness to the imagery of James that \'Every good gift and perfect boon is from above, coming down from the Father of lights, with whom can be no variation, neither shadow that is cast by turning\' (<a onClick="return mV(\'Jam\',1,17);">Jas 1:17</a> the English Revised Version).<P>3. The Moon:<P>(1) The Names for the Moon.<P>Three words are translated "moon" in the Old Testament, not including cases where "month" has been rendered "moon" for the sake of a more flowing sentence: (a) Lebhanah, "white"; a poetic expression, used in connection with chammah, "heat," for the sun.<P>(b) Chodhesh, "new moon," meaning "new," "fresh." As the Hebrews reckoned their months from the actual first appearance of the young crescent, chodhesh is most frequently translated "month." Thus "In the six hundredth year of Noah\'s life, in the second month, on the seventeenth day of the month" (<a onClick="return mV(\'Gen\',7,11);">Ge 7:11</a>), and in the great majority of cases, the word for month is chodhesh, "new moon." In <a onClick="return mV(\'Isa\',66,23);">Isa 66:23</a>, "from one new moon to another," should be literally, "from new moon to new moon." Once it is rendered "monthly" (<a onClick="return mV(\'Isa\',47,13);">Isa 47:13</a>), when it is used to denote the astrologers who fixed the omens of the opening month. Chodhesh, therefore, when translated "new moon" is not a designation of the actual heavenly body, but denotes the first day of the month. It is a term directly or indirectly connected with the calendar.<P>(c) Yareach, probably "wandering," a very appropriate primitive term for the moon, since her motion among the stars from night to night is sufficiently rapid to have caught the attention of very early observers. Its use therefore as the proper name for the "lesser light" indicates that the systematic observation of the heavenly bodies had commenced, and that the motion of the moon, relative to the stars, had been recognized.<P>Yerach, "month," is twice translated "moon" (<a onClick="return mV(\'Deu\',33,14);">De 33:14</a>; <a onClick="return mV(\'Isa\',60,20);">Isa 60:20</a>), but without any great reason for the variation in either case.<P>(2) The Lesser Light-Giver.<P>The direct references in Scripture to the moon as a light-giver are not numerous, but those that occur are significant of the great importance of moonlight in ancient times, when artificial lights were few, expensive and dim, and the lighting of streets and roads was unthought of. To shepherds, the moon was of especial assistance, and many of the people of Israel maintained the habits of their forefathers and led the shepherd\'s life long after the settlement of the nation in Palestine. The return of the moonlit portion of the month was therefore an occasion for rejoicing and for solemn thanks to God, and the "new moon" as well as the Sabbath was a day of special offerings. On the other hand one of the judgments threatened against the enemies of God was that the light of the moon should be withheld. The threat made against Pharaoh is "I will cover the sun with a cloud, and the moon shall not give its light" (<a onClick="return mV(\'Eze\',32,7);">Eze 32:7</a>); and in the day of the Lord denounced against Babylon, "The sun shall be darkened in its going forth, and the moon shall not cause its light to shine" (<a onClick="return mV(\'Isa\',13,10);">Isa 13:10</a>). But among the glories of the restoration of Israel it is promised that "the light of the moon (lebhanah) shall be as the light of the sun (chammah)" (<a onClick="return mV(\'Isa\',30,26);">Isa 30:26</a>).<P>(3) Phases of the Moon.<P>There is no direct mention of the phases of the moon in Scripture; a remarkable fact, and one that illustrates the foolishness of attempting to prove the ignorance of the sacred writers by the argument from silence, since it is not conceivable that men at any time were ignorant of the fact that the moon changes her apparent shape and size. So far from the Hebrews being plunged in such a depth of more than savage ignorance, they based their whole calendar on the actual observation of the first appearance of the young crescent. In two passages in the Revised Version (British and American) we find the expression "at the full moon," keceh (<a onClick="return mV(\'Psa\',81,3);">Ps 81:3</a>; <a onClick="return mV(\'Pro\',7,20);">Pr 7:20</a>), but though this is what is intended, the literal meaning of the word is doubtful, and may be that given in the King James Version, "at the day appointed." In another passage already quoted, there is a reference to the dark part of the month. "Thy sun shall no more go down, neither shall thy moon (yerach, "month") withdraw itself"—the "withdrawn" part of the month being the time near new moon when the moon is nearly in conjunction with the sun and therefore invisible.<P>The periodical changes of the moon are its ordinances (<a onClick="return mV(\'Jer\',31,35);">Jer 31:35</a>). It was also appointed for "seasons" (<a onClick="return mV(\'Psa\',104,19);">Ps 104:19</a>), that is, for religious assemblies or feasts (mo\'adhim). Two of these were held at the full of the moon, the Passover and the Feast of Tabernacles; one at the new moon, the Feast of Trumpets; but the ordinary new moon did not rank among the great "appointed feasts" (mo\'adhim). As light-giver, assisting men in their labors with the flock and in the field and helping them on their journeys; as time-measurer, indicating the progress of the months and the seasons for the great religious festivals, the moon was to the pious Hebrew an evidence of the goodness and wisdom of God.<P>The "round tires like the moon" worn by the daughters of Zion (<a onClick="return mV(\'Isa\',3,18);">Isa 3:18</a> the King James Version), and those on the camels of Zeba and Zalmunna (<a onClick="return mV(\'Jdg\',8,21);">Jud 8:21</a> King James Version, margin), were designated by the same Hebrew word, saharonim, translated in the Vulgate (Jerome\'s Latin Bible, 390-405 A. D.) as lunulae, and were little round ornaments, probably round like crescents, not discs like the full moon.<P>Jericho possibly means "the city of the moon," and Jerah, "moon," was the name of one of the sons of Joktan.<P>4. Signs:<P>(1) Solar and Lunar Eclipses .<P>The sun and moon were not only given "for days and years" (<a onClick="return mV(\'Gen\',1,14);">Ge 1:14</a>), but also "for signs," and in no way do they better fulfill what was in the old time understood by this word than in their eclipses. Nothing in Nature is more impressive than a total eclipse of the sun; the mysterious darkness, the sudden cold, the shining forth of the weird corona, seen at no other time, affect even those who know its cause, and strike unspeakable terror in those who cannot foresee or understand it. In bygone ages an eclipse of the sun was counted an omen of disaster, indeed as itself the worst of disasters, by all nations except that one to whom the word of the prophet came: "Learn not the way of the nations, and be not dismayed at the signs of heaven; for the nations are dismayed at them" (<a onClick="return mV(\'Jer\',10,2);">Jer 10:2</a>). To the Hebrew prophets, eclipses were "signs" of the power and authority of God who forbade them to be alarmed at portents which distressed the heathen.<P>The phenomena of both solar and lunar eclipses are briefly but unmistakably described by several of the prophets. Joel refers to them twice (<a onClick="return mV(\'Joe\',2,10,31);">2:10, 31</a>), the second time very definitely: "The sun shall be turned into darkness, and the moon into blood," and this was quoted by Peter on the Day of Pentecost (<a onClick="return mV(\'Act\',2,19,20);">Ac 2:19-20</a>). John also says that when the sixth seal was opened "the sun became black as sackcloth of hair, and the whole moon became as blood" (<a onClick="return mV(\'Rev\',6,12);">Re 6:12</a>). When the new moon in its revolution or turning comes exactly between the earth and the sun, and its shadow—the "shadow that is cast by turning" of <a onClick="return mV(\'Jam\',1,17);">Jas 1:17</a>—falls on the earth, the sun is completely hidden and its glowing discovered is replaced by the dark body of the moon; "the sun is turned into darkness." When the shadow of the earth falls upon the full moon, and the only rays from the sun that reach it have passed through an immense thickness of our atmosphere and are therefore of a dull copper-red color like clotted blood, "the moon is turned into blood."<P>(2) The Wings of the Morning.<P>But a solar eclipse is not solely darkness and terror. Scarcely has the dark moon hidden the last thread of sunlight than a beautiful pearly halo, the corona, is seen surrounding the blackness. This corona changes its shape from one eclipse to another, but the simplest form is that of a bright ring with outstretched wings, and is characteristic of times when the sun has but few spots upon it. This form appears to have been the origin of the sacred symbol of the ring or discovered with wings, so frequently figured on Egyptian, Babylonian and Persian monuments. It is possible that these coronal "wings of the sun" may have been in the mind of the prophet Malachi when he wrote, "Unto you that fear my name shall the sun of righteousness arise with healing in its wings" (<a onClick="return mV(\'Mal\',4,2);">Mal 4:2</a>). The metaphor "wings of the morning" of <a onClick="return mV(\'Psa\',139,9);">Ps 139:9</a> is however more probably due to the long streamers, the crepuscular rays, seen at dawn when the sun rises behind a low bank of clouds.<P>Total eclipses of the moon must frequently have been visible in Palestine as in other countries, but only two or three total eclipses of the sun were visible there during Old Testament history; that of 831 BC, August 15, was total in Judea, and that of 824 BC, April 2, very nearly total. It has been suggested that two eclipses of the sun were predicted in the Old Testament—that of Nineveh, 763 BC, June 15, in <a onClick="return mV(\'Amo\',8,9);">Am 8:9</a>, and that of Thales, 585 BC, May 28, in <a onClick="return mV(\'Isa\',13,10);">Isa 13:10</a>, but the suggestion has little to support it.<P>5. Seasons:<P>(1) The Meaning of the Word.<P>The sun and moon were appointed "to give light upon the earth," and "for signs," and "for days and years." They were also appointed "for seasons" (mo\'adhim), i. e. "appointed assemblies." These seasons were not primarily such seasons as the progress of the year brings forth in the form of changes of weather or of the condition of vegetation; they were seasons for worship. The word mo\'edh occurs some 219 times; in 149, it is translated "congregation," and in about 50 other instances by "solemn assembly" or some equivalent expression. Thus before ever man was created, God had provided for him times to worship and had appointed two great lights of heaven to serve as signals to call to it.<P>The appointed sacred seasons of the Jews form a most complete and symmetrical series, developing from times indicated by the sun alone to times indicated by the sun and moon together, and completed in times indicated by luni-solar cycles.<P>(2) Natural Seasons for Worship.<P>The sun alone indicated the hours for daily worship; at sunrise, when the day began, there was the morning sacrifice; at sunset, when the day closed, there was the evening sacrifice.<P>The moon indicated the time for monthly worship; when the slender crescent of the new moon was first seen in the western sky, special sacrifices were ordained with the blowing of trumpets over them.<P>The sun and moon together marked the times for the two great religious festivals of the year. At the beginning of the bright part of the year, when the moon was full in the first month of spring, the Passover, followed by the Feast of Unleavened Bread, was held. At the end of the bright part of the year, when the moon was full in the first month of autumn, the Feast of Tabernacles was held. These may all be termed natural seasons for worship, obviously marked out as appropriate. The beginning and close of the bright part of the day, and of the bright part of the year, and the beginning of the bright part of the month, have been observed by many nations.<P>(3) The Hallowing of the Seventh.<P>But that which was distinctive in the system of the Jewish festivals was the hallowing of the seventh: the seventh day, the seventh week, the seventh month, the seventh year were all specially marked out. The sun alone indicated the Sabbath by the application of the sacred number seven to the unit of time given by the day. For the period of seven days, the week was not dependent upon any phase of the moon\'s relation to the sun; it was not a quarter month, but a free week, running on independently of the month. The Jewish Sabbath therefore differed from the Babylonian, which was tied to the lunar month. The same principle was applied also to the year; every seventh year was set apart, as a period of rest, the Sabbatic year. Every seventh day, every seventh year, was thus observed. But for the week and month, the principle of hallowing the seventh came into operation only once in each year. The Feast of Pentecost, or as it was also called, the Feast of Weeks, was held at the close of the seventh week from the morrow after the Sabbath of Unleavened Bread; and the new moon of the seventh month was held as a special feast, the Feast of Trumpets, "a holy convocation. Ye shall do no servile work" (<a onClick="return mV(\'Lev\',23,24,25);">Le 23:24-25</a>). The other new moons of the year were not thus distinguished.<P>The weekly Sabbath, the Passover, Pentecost, and the Feasts of Trumpets and of Tabernacles, with one other day of solemnity, were in an especial sense, the mo\'adhim of the Lord.<P>The seventh day was especially the day of worship, and to correspond, the seventh month was especially the month of worship; and this, not only because it was ushered in with peculiar solemnity, and included one of the chief great feasts of the year, but because it furnished the culminating ceremony of the entire Jewish system, the great Day of Atonement, held on the tenth day of the month, and therefore on a day not marked directly by any phase of the moon. The Day of Atonement purged away the offenses of the past year, and restored Israel to the full enjoyment of the Divine favor.<P>(4) The Jubilee a Luni-solar Cycle.<P>The Jewish month was a natural month, based upon the actual observation of the young crescent. The Jewish year was a natural year, that is, a solar tropical year, based upon actual observation of the ripening of the grain. But there is not an exact number of days in a lunar month, nor is there an exact number of months in a solar year; twelve lunar months falling short of the year, by eleven days; so that in three years the error would amount to more than a complete month, and to restore the balance a thirteenth month would have to be intercalated. As the months were determined from actual observation, and as observation would be interrupted from time to time by unfavorable weather, it was necessary to have some means for determining when intercalation would take place, irrespective of it. And this was provided by carrying the principle of hallowing the seventh, one stage farther. Not only was the seventh of the day, week, month and year distinguished, but the seventh week of years was marked by the blowing of the trumpet of Jubilee on the Day of Atonement. The Day of Atonement meant the restitution of Israel to the Divine favor; the blowing of the trumpet of Jubilee every forty-ninth year meant "the restitution of all things"; every Hebrew in servitude returned to freedom, all land, mortgaged or sold, returned to its original owner.<P>And this period of 49 solar years was astronomically a period of restitution, for the sun and moon returned nearly to their original positions relative to each other, since 49 solar years are 606 lunar months with an error of only 32 hours. So that though the Jubilee period is not a perfect lunar cycle, it was quite exact enough to guide the Jewish priests in drawing up their calendar in cases where the failure of observation had given rise to some doubt.<P>The beginning of each month was marked by the blowing of the two silver trumpets (chatsotserah: <a onClick="return mV(\'Num\',10,2,10);">Nu 10:2, 10</a>). The beginning of the civil, that is to say, of the agricultural year, was marked by a special blowing of trumpets (teru\'ah), giving the name "Feast of Trumpets" to that new moon (<a onClick="return mV(\'Lev\',23,24);">Le 23:24</a>; <a onClick="return mV(\'Num\',29,1);">Nu 29:1</a>). And the beginning of a new cycle of 49 years was marked by the Jubilee, the loud trumpet (shophar: <a onClick="return mV(\'Lev\',25,9);">Le 25:9</a>). Thus the cycle of the Jubilee made symmetrical, completed, and welded together all the mo\'adhim of the Lord—the two great lights were set "for seasons."<P>(5) The 19-Year Luni-solar Cycle.<P>The cycle of the Jubilee was sufficient for the purposes of the religious calendar so long as the nation inhabited its own land, since from its small extent there would be no conflict of time reckoning and it would be easy to notify the appearance of the new moon from one end of the country to the other. But after the captivities, when the people were scattered from Gozan of the Medes to Syene on the Nile, it was necessary to devise some method by which the Jews, however far they had been dispersed, would be able to reckon for themselves as to when the moon was new for Jerusalem. We have lately learned from the discovery of a number of Aramaic papyri at Syene that there was a colony of Jews there who used a calendar constructed, not from observation, but from calculation based upon a very exact luni-solar cycle (E. B. Knobel, "Ancient Jewish Calendar Dates in Aramaic Papyri," Monthly Notices of the Royal Astronomical Society, LXVIII, 334). This cycle, known to us by the name of its supposed discoverer, Meton, is one of 19 years
