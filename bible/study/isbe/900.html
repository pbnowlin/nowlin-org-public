>16:21f; 30, 34</a>). In reference to the significance of what is done with the second goat of sin offering, compare <a onClick="return mV(\'Lev\',16,8,20);">16:8ff, 20ff</a>, and <a href="./study/isbe/search.html?string=AZAZEL">AZAZEL</a>, II,<P>1. In this way Delitzsch has correctly called the Day of Atonement "the Good Friday of the Old Testament." How deeply the consciousness of sin must have been awakened, if the many otherwise commanded private and congregational sacrifices did not make such an institution superfluous, and if even the high priest himself stood before God as a sinner (<a onClick="return mV(\'Lev\',16,6,11);">16:6, 11</a>ff). On this day, with the exception of the mitre, he does not wear the insignia of his high-priestly office, but wears white garments, which in their simplicity correspond to the earnestness of the situation. The repetition of the bath, both in his case and in that of the other persons engaged in the ceremony (<a onClick="return mV(\'Lev\',16,4,24,26,28);">16:4, 24, 26, 28</a>), was necessary, because the mere washing of the hands and feet (<a onClick="return mV(\'Exd\',30,19);">Ex 30:19</a>f) would not suffice on this occasion (compare <a onClick="return mV(\'Num\',19,7,19,21);">Nu 19:7ff, 19, 21</a>). The flesh of the sin-offering animals was not permitted to be eaten but had to be burned (<a onClick="return mV(\'Lev\',16,27);">16:27</a>) because it was sacrificed also for Aaron\'s sin, and its blood was carried not only into the holy place but also into the Holy of Holies, compare <a onClick="return mV(\'Lev\',16,27);">16:27</a> with <a onClick="return mV(\'Lev\',6,23);">Le 6:23</a>; <a onClick="return mV(\'Lev\',4,11,21);">4:11f; 21</a>; <a onClick="return mV(\'Exd\',29,14);">Ex 29:14</a>; <a onClick="return mV(\'Lev\',8,17);">Le 8:17</a>; <a onClick="return mV(\'Lev\',9,11);">9:11</a>; <a onClick="return mV(\'Lev\',10,19);">10:19</a>. And in comparison with the consciousness of sin that had been aroused, how great must on the other hand God\'s grace appear, when once in each year a general remission of all the sins that had been forgiven was guaranteed.<P>2. Significance from a Christian Standpoint:<P>"The Day of Atonement, the good Friday of the Old Testament"—these words express not only the highest significance of the day but also its limitations. As the tabernacle, the sacrificial system, the entire law, thus too the Day of Atonement in particular contained only the shadow of future good things, but not these things themselves (<a onClick="return mV(\'Hbr\',10,1);">Heb 10:1</a>), and is "like in pattern to the true" (<a onClick="return mV(\'Hbr\',9,24);">Heb 9:24</a>). Christ Himself entered into the holy place, which was not made with hands, namely, into heaven itself, and has now appeared before God, by once for all giving Himself as a sacrifice for the removal of sin (<a onClick="return mV(\'Hbr\',9,23);">Heb 9:23</a>ff). By this act the purpose of the Old Testament sacrificial cult and its highest development, namely, the Day of Atonement, understood in its typical significance, has been fulfilled, and at the same time surpassed and thereby abrogated (compare <a href="./study/isbe/search.html?string=LEVITICUS">LEVITICUS</a>). Accordingly, our hope, too, like an anchor—(<a onClick="return mV(\'Hbr\',6,19);">Heb 6:19</a>), penetrates to the inner part of the veil in the higher sense of the term, i. e. to heaven.<P>III. On the History of the Day of Atonement.<P>1. The Long Silence of History:<P>(1) The Facts and the False Conclusions.<P>The Day of Atonement is stated to have been instituted in the times of Moses (<a onClick="return mV(\'Lev\',16,1);">Le 16:1</a>); the ceremony takes place in the tabernacle (tent of meeting); the people are presupposed to be in the camp (<a onClick="return mV(\'Lev\',16,26);">Le 16:26</a>ff); Aaron is still the high priest. Very remarkably there is but little evidence of the observance of this prominent day in the later history of Israel. Down to the time of the Exile there is found a deep silence on this subject.<P>The days of atonement in <a onClick="return mV(\'Eze\',45,18);">Eze 45:18</a>ff (compare under I, 1) differ in number and observance from that in <a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a>. According to <a onClick="return mV(\'Zec\',3,9);">Zec 3:9</a>, God in the Messianic future will take away the guilt of the land in a single day; but this too presents no more than an analogy to the results of the Day of Atonement. On the other hand, there is no reference made to the day where we could expect it. Not only <a onClick="return mV(\'2Ch\',7,\'7-9\');">2Ch 7:7-9</a> in connection with the consecration of Solomon\'s temple, and <a onClick="return mV(\'Ezr\',3,\'1-6\');">Ezr 3:1-6</a>, in the account of the reintroduction of the sacrificial services after the return from the Exile, are silent on the subject, which fact could possibly be explained in an easy manner; but also <a onClick="return mV(\'Neh\',8,\'1-\');">Ne 8</a>f. According to <a onClick="return mV(\'Neh\',8,2);">8:2</a>f; Ezra begins on the 1st day of the 7th month in the year 444 BC to read from the law; on the 2nd day of the 7th month remembrance is made of the ordinance treating of the feast of tabernacles, and on the 22nd day of the 7th month (<a onClick="return mV(\'Neh\',8,13);">Ne 8:13</a>ff), this festival is observed; on the 24th day of the 7th month a day of penance is observed (<a onClick="return mV(\'Neh\',9,1);">Ne 9:1</a>); but of the Day of Atonement coming in between <a onClick="return mV(\'Neh\',8,1);">Ne 8:1</a> and chapter <a onClick="return mV(\'Neh\',9,1);">9:1</a>, namely, on the 10th day of the 7th month, which would seem to make the day of penance superfluous, nothing is said.<P>From these facts the Wellhausen school has drawn the conclusion, in accordance with its principles elsewhere observed, that all those legal enactments that have not in the history a sufficient evidence of having been observed, did not exist until the time when they have such historical evidence; that therefore the Day of Atonement did not originate until after the year 444 BC. It is claimed that the day originated in the two days of atonement mentioned in <a onClick="return mV(\'Eze\',45,\'18-20\');">Eze 45:18-20</a> (compare under I, 1); in the four national fast days of <a onClick="return mV(\'Zec\',7,5);">Zec 7:5</a>, and <a onClick="return mV(\'Zec\',8,19);">8:19</a>, and in the day of penance of 444 BC, just mentioned, on the 24th day of the 7th month, which is said to have been repeated on the following New Year\'s day, the 10th day of the 7th month; and that by the sacred character of its observance it soon crowded the New Year day upon the 1st day of the 7th month (compare <a onClick="return mV(\'Lev\',23,23);">Le 23:23</a>ff; <a onClick="return mV(\'Num\',29,1);">Nu 29:1</a>ff; contrary to <a onClick="return mV(\'Lev\',25,9);">Le 25:9</a> and <a onClick="return mV(\'Eze\',40,1);">Eze 40:1</a>). In this way it is thought that <a onClick="return mV(\'Lev\',16,29);">Le 16:29</a>ff first originated, and that at a still later time the complicated blood ritual had been added (compare under I,1,2). But it is to be observed that in still later times there is found no more frequent mention of the Day of Atonement than in the earlier, although it is the custom of modern criticism to place a much larger bulk of Biblical literature into this later period. It is only when we come to Jesus Sirach (Ecclesiasticus 50:5ff) that the high priest Simon is praised, when he came forth from behind the veil; and this is certainly a reference to the Day of Atonement, although no further mention is made at this place of the ceremony as such. Then there is a further silence on the subject down to Philo and the Epistle to the Hebrews (<a onClick="return mV(\'Hbr\',6,19);">He 6:19</a>; <a onClick="return mV(\'Hbr\',9,7,13);">9:7, 13</a>ff; <a onClick="return mV(\'Hbr\',10,1);">10:1</a>ff; compare under II, 2). It is probable too that the fasting mentioned in <a onClick="return mV(\'Act\',27,9);">Ac 27:9</a> is based on the Day of Atonement. We have in this manner a characteristic example to show how carefully we must handle the argument from silence, if we do not want to arrive at uncomfortable results.<P>(2) The Historicity of the Day of Atonement.<P>Since <a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a> constitutes only one part of the Levitical legislation, the question as to the original and historical character of the day cannot be fully discussed at this place (see <a href="./study/isbe/search.html?string=LEVITICUS">LEVITICUS</a>). At so late a period, naturally all the data that would lead to an explanation of the origin of such a fundamental institution as the Day of Atonement are lacking. It is all the more impossible to separate <a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a> from the other priestly ordinances, because the name of the lid of the ark of covenant hakapporeth: (<a onClick="return mV(\'Exd\',25,17);">Ex 25:17</a>ff; <a onClick="return mV(\'Exd\',26,34);">26:34</a>) stands in the clearest relation to the ceremony that takes place with this ark on the Day of Atonement. The impossibility of splitting up <a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a> as is the manner of critics, or even as much as separating it from <a onClick="return mV(\'Lev\',11,\'1-\');">Le 11-15</a>, has been sufficiently demonstrated above (compare under I). Against the view which forces the Priest Codex down at least to the Exile and to claim the tabernacle as the product of imagination and as a copy of the temple of Solomon (see <a href="./study/isbe/search.html?string=EXODUS">EXODUS</a>), we have still the following to add: If the ark of the covenant was no longer in existence after the Exile and if, according to <a onClick="return mV(\'Jer\',3,16);">Jer 3:16</a>, the Israelites no longer expected its restoration, then it would have been absolutely impossible in the ritual of the Day of Atonement to connect the most important ceremony of this ritual with this ark and on this to base the atonement. In the second temple, as is well known, the incense pan was placed on the "foundation stone" in the Holy of Holies, because there was no tabernacle. Against these facts the counter-arguments mentioned above cannot stand. Even those who deny the existence of the Day of Atonement do not lay much stress on <a onClick="return mV(\'2Ch\',7,\'1-9\');">2Ch 7:1-9</a> and <a onClick="return mV(\'Ezr\',3,\'1-6\');">Ezr 3:1-6</a>; but <a onClick="return mV(\'Neh\',8,\'1-\');">Ne 8</a>ff also does not deserve mention, since in this place the emphasis lies on the purpose of showing how the congregation was to declare its adherence to the law, and how the Day of Repentance, which had been observed since the beginning of the history of Israel, was instituted to be observed on the 24th day of the 7th month for all sins (<a onClick="return mV(\'Neh\',9,1);">9:1</a>ff), and was not made superfluous by the celebration of the Day of Atonement on the 10th day of the 7th month, on which day only the sins of the last year were taken into consideration. But Ezekiel changed or ignored also other pre-exilic arrangements (compare <a href="./study/isbe/search.html?string=EZEKIEL">EZEKIEL</a>), so that he is no authority in deciding the question as to the earlier existence of the Day of Atonement. Finally, attention must be drawn to the fact that the Passover festival is mentioned in prophetic literature, in addition to the mere reference in <a onClick="return mV(\'Isa\',30,29);">Isa 30:29</a>, only in <a onClick="return mV(\'Eze\',45,21);">Eze 45:21</a>; the ark of the covenant only in <a onClick="return mV(\'Jer\',3,16);">Jer 3:16</a>; the Feast of Tabernacles only in <a onClick="return mV(\'Hsa\',12,9);">Ho 12:9</a>; <a onClick="return mV(\'Eze\',45,25);">Eze 45:25</a>; and that in its historical connection the Feast of Weeks is mentioned incidentally only in <a onClick="return mV(\'2Ch\',8,13);">2Ch 8:13</a>, and possibly in <a onClick="return mV(\'1Ki\',9,25);">1Ki 9:25</a>, and is not at all found in Ezekiel (compare <a onClick="return mV(\'Eze\',45,18);">45:18ff</a>), although the existence of these institutions has for a very long time been called into question.<P>2. Further Development:<P>The Day of Atonement, in accordance with its purpose in later times, came more and more into the foreground and was called "the great fast" or "the great day," or merely "the day." Its ritual was further enlarged and the special parts mentioned in the law were fully explained, fixed and specialized. Compare especially the tract "Yoma" in the Mishna; and for the further elaborations and stories in poetry and prose on the basis of the Talmud, see, e. g. Delitzsch\'s translation from Maim, Ha-yadh ha-chazaqah, in the supplement to his Commentary on the Epistle to the Hebrews, 1857. According to these accounts, e. g. the high priest had to be a married man. Already seven days before the beginning of the Day of Atonement he was ordered to leave his house and had to submit to a series of purifications and had to practice for the performance of the different purification ceremonies, some of which were difficult. The last night he was not allowed to sleep and had to spend his time in studying the sacred writings.<P>On the Day of Atonement he took five baths and ten washings. Four times he enters the Holy of Holies (with the incense), with the blood of both sin offerings, and when he brings out the utensils used with the incense he makes three confessions of sins (for himself, for himself and his house, for Israel); 10 times in all he utters the name of Yahweh; 43 times he sprinkles; in addition he must read certain sections of the Scriptures or repeat them from memory (compare also <a href="./study/isbe/search.html?string=AZAZEL">AZAZEL</a>). When he returns home he celebrates a festival of rejoicing, because he has without harm been able to leave the sanctuary. In addition, he had performed severe physical work, and especially difficult was the manipulation of the incense. The modern estimate put on the Day of Atonement appears from the following citation of Wellhausen: "The rite and the sacrifice through the unfavorable circumstances of the times have disappeared; but it has retained the same sacred character. He who has not yet entirely broken with Judaism observes this day, no matter how indifferent he may be otherwise to old customs and festivals."``122';
isbe[945]='Atroth-Beth-Joab`at-roth-beth-jo\'-ab \'atroth beth yo\'abh ("crowns of the house of Joab"): the King James Version "Ataroth," the house of Joab. Probably a family in Judah (<a onClick="return mV(\'1Ch\',2,54);">1Ch 2:54</a>).``1';
isbe[946]='Atroth-Shophan`at\'-roth-sho\'fan \'Troth shophan; Septuagint gen sophan: A town built or fortified by the children of Gad east of the Jordan (<a onClick="return mV(\'Num\',32,35);">Nu 32:35</a>), named next to Aroer. If it had been at Khirbet \'Attarus or Jebel \'Attarus (HDB and EB, under the word) Aroer would hardly have been named between them. The King James Version reads Atroth, Shophah, understanding that two places are named. No identification is yet possible.``1';
isbe[947]='Attai`at\'-ta-i at\'-i \'attay, ("timely?"):<P>(1) A son of Jarha, the Egyptian, by a daughter of Sheshan (<a onClick="return mV(\'1Ch\',2,35);">1Ch 2:35</a>f).<P>(2) A Gadite soldier who joined David\'s army at Ziklag (<a onClick="return mV(\'1Ch\',12,11);">1Ch 12:11</a>).<P>(3) A son of Rehoboam and grandson of Solomon (<a onClick="return mV(\'2Ch\',11,20);">2Ch 11:20</a>).``1';
isbe[948]='Attain`a-tan\':The rendering of qanah = "buy," "get" (<a onClick="return mV(\'Pro\',1,5);">Pr 1:5</a>); nasagh= "reach," "a meal-offering...according as he is able" (<a onClick="return mV(\'Eze\',46,7);">Eze 46:7</a> margin), "not attained unto the days" (<a onClick="return mV(\'Gen\',47,9);">Ge 47:9</a>); yakhol or yakhowl = "be able," "overcome," "attain to innocency" (<a onClick="return mV(\'Hsa\',8,5);">Ho 8:5</a>); bo\' = "come," "follow" (<a onClick="return mV(\'2Sa\',23,19,23);">2Sa 23:19, 23</a>; <a onClick="return mV(\'1Ch\',11,21,25);">1Ch 11:21, 25</a>); katantao= "arrive at" (<a onClick="return mV(\'Act\',27,12);">Ac 27:12</a> the King James Version; <a onClick="return mV(\'Phl\',3,11);">Php 3:11</a>); katalambano = "take eagerly," "seize," "apprehend," "attained to righteousness" (<a onClick="return mV(\'Rom\',9,30);">Ro 9:30</a>); phthano = "have arrived at" (<a onClick="return mV(\'Rom\',9,31);">Ro 9:31</a> the King James Version; <a onClick="return mV(\'Phl\',3,16);">Php 3:16</a>); lambano -"take," "get a hold of," "catch," the Revised Version (British and American) "already obtained" (<a onClick="return mV(\'Phl\',3,12);">Php 3:12</a>); parakoloutheo = "follow," "trace out," "conform to" (<a onClick="return mV(\'1Ti\',4,6);">1Ti 4:6</a>). Here the Revised Version (British and American) corrects the King James Version.``77';
isbe[949]='Attalia`at-a-li\'-a Attalia: A city on the southern coast of Asia Minor in ancient Pamphylia which, according to <a onClick="return mV(\'Act\',14,25);">Ac 14:25</a>, was visited by Paul and Barnabas on the way to Antioch during their first missionary journey. The city was founded by Attalus II Philadelphus (159-138 BC), hence, its name Attalia, which during the Middle Ages was corrupted to Satalia; its modern name is Adalia. Attalia stood on a flat terrace of limestone, about 120 ft. high, near the point where the Catarrhactes River flowed into the sea. The river now, however, has practically disappeared, for the greater part of its water is turned into the fields for irrigation purposes. The early city did not enjoy the ecclesiastical importance of the neighboring city of Perga; but in 1084 when Perga declined, Attalia became a metropolis. In 1148 the troops of Louis IV sailed from there to Syria; in 1214 the Seljuks restored the city walls, and erected several public buildings. The city continued to be the chief port for ships from Syria and Egypt, and the point of entry to the interior until modern times, when the harbor at Mersine was reopened; it has now become a place of little importance.<P>The town possesses considerable which is of archaeological interest. The outer harbor was protected by ancient walls and towers now in ruins; its entrance was closed with a chain. The inner harbor was but a recess in the cliff. The city was surrounded by two walls which were constructed at various times from material taken from the ruins of the ancient city; the outer wall was protected by a moat. The modern town, lying partly within and partly without the walls is thus divided into quarters. In the southern quarter live the Christians; in the northern the Moslems. Among other objects of archaeological interest still to be seen may be mentioned the inscribed arched gateway of Hadrian and the aqueduct. Rich gardens now surround the town; the chief exports are grain, cotton, licorice root and valonia or acorn-cups.``7';
isbe[950]='Attalus`at\'-a-lus: King of Pergamum, mentioned in 1Macc 15:22 among the kings to whom was sent an edict (Ant., XIV, viii, 5) from Rome forbidding the persecution of the Jews.`<a href="./study/isbe/search.html?string=ATTALIA">ATTALIA</a>`1';
isbe[951]='Attend; Attendance`a-tend\'; a-tend\'-ans:<P>(1) "To incline," "listen," "regard" qashabh; (<a onClick="return mV(\'Psa\',17,1);">Ps 17:1</a> etc.); then, in the King James Version, "observe," but in the Revised Version (British and American), more frequently, "give heed" prosechein noun, as in <a onClick="return mV(\'1Ti\',4,13);">1Ti 4:13</a>.<P>(2) "To be with," "take care of," "wait upon" (<a onClick="return mV(\'Est\',4,5);">Es 4:5</a>; <a onClick="return mV(\'Hbr\',7,13);">Heb 7:13</a>; <a onClick="return mV(\'Rom\',13,6);">Ro 13:6</a>); literally, "give unremitting care to," as in <a onClick="return mV(\'1Cr\',7,35);">1Co 7:35</a> (Luther: "serve the Lord constantly and without hindrance").``1';
isbe[951]='Attend; Attendance`a-tend\'; a-tend\'-ans:<P>(1) "To incline," "listen," "regard" qashabh; (<a onClick="return mV(\'Psa\',17,1);">Ps 17:1</a> etc.); then, in the King James Version, "observe," but in the Revised Version (British and American), more frequently, "give heed" prosechein noun, as in <a onClick="return mV(\'1Ti\',4,13);">1Ti 4:13</a>.<P>(2) "To be with," "take care of," "wait upon" (<a onClick="return mV(\'Est\',4,5);">Es 4:5</a>; <a onClick="return mV(\'Hbr\',7,13);">Heb 7:13</a>; <a onClick="return mV(\'Rom\',13,6);">Ro 13:6</a>); literally, "give unremitting care to," as in <a onClick="return mV(\'1Cr\',7,35);">1Co 7:35</a> (Luther: "serve the Lord constantly and without hindrance").``1';
isbe[952]='Attent; Attentive`a-tent\' (archaic; <a onClick="return mV(\'2Ch\',6,40);">2Ch 6:40</a>); a-tent\'-iv: Expresses the direction of thought and interest toward some one point. Same Hebrew word as "attend," and is used particularly in prayers (<a onClick="return mV(\'Psa\',130,2);">Ps 130:2</a>; <a onClick="return mV(\'Neh\',1,6);">Ne 1:6</a>). "Very attentive" (<a onClick="return mV(\'Luk\',19,48);">Lu 19:48</a>) is a paraphrase for what is literally rendered in the Revised Version (British and American), "the people all hung upon him, listening" exekremeto.``1';
isbe[953]='Attharates`a-thar\'-a-tez: A title assigned to Nehemiah, probably by a later editor (<a onClick="return mV(\'Neh\',8,9);">Ne 8:9</a>). The Septuagint omits the title; the Vulgate (Jerome\'s Latin Bible, 390-405 A. D.) gives "Athersatha"; the King James Version reads "Nehemiah, which is the Tirshatha." Tirshatha is the Persian title for a local or provincial governor (<a onClick="return mV(\'Neh\',8,9);">Ne 8:9</a> = 1Esdras 9:49).`<a href="./study/isbe/search.html?string=TIRSHATHA">TIRSHATHA</a>`1';
isbe[954]='Attharias; Atharias`a-tha-ri\'as: 1Esdras 5:40 = <a onClick="return mV(\'Ezr\',2,63);">Ezr 2:63</a>.`<a href="./study/isbe/search.html?string=TIRSHATHA">TIRSHATHA</a>`1';
isbe[955]='Attire; Dyed Attire`a-tir\':"Can a virgin forget her ornaments, or a bride her attire?" asks the prophet Jeremiah in hot remonstrance against Israel\'s unfaithfulness. "Yet," saith Yahweh, "my people have forgotten me" (<a onClick="return mV(\'Jer\',2,32);">2:32</a>). "And I saw that she was defiled," cries Ezekiel against Jerusalem; "she saw men ... girded with girdles upon their loins, with flowing turbans [AV exceeding in dyed attire] upon their heads, ..... after the likeness of the Babylonians in Chaldea,...and...she doted upon them ...."(<a onClick="return mV(\'Eze\',23,\'13-16\');">Eze 23:13-16</a>). "And, behold, there met him," says the author of Proverbs (<a onClick="return mV(\'Pro\',7,10);">Pr 7:10</a>) in his description of the "strange woman," that "lieth in wait at every street corner," "a woman with the attire of a harlot, and wily of heart," whose "house is the way to Sheol" (<a onClick="return mV(\'Pro\',7,27);">Pr 7:27</a>). These passages show how diversely and elastically the term "attire" was used among the Hebrews. The numerous synonyms for "dress," "attire," "apparel," "clothes," "raiment," "garment," etc., found in English Versions of the Bible, reflect a similar wealth of nomenclature in the original Hebrew and Greek; but the lack of exactness and consistency in the renderings of translators makes the identification of the various articles of dress referred to very difficult, sometimes impossible.`<a href="./study/isbe/search.html?string=DRESS">DRESS</a>`47';
isbe[956]='Attitudes`at\'-i-tuds: Customs change slowly in Bible lands. This becomes clear by a comparison of the many references found in the Bible and other literatures of the Orient with existing circumstances and conditions. The same fact is attested by the pictures illustrating daily life upon the monuments of Assyria, Babylonia and Egypt in the countries between the Nile and the Tigris. Many of these, dating back to the second or third millennium before our era, prove conclusively that the same practices and usages as are now common among the inhabitants of those lands were in vogue in the days of Hammurabi and the early rulers of Egypt. This is especially true of matters pertaining to the worship of the gods, and of the attitudes or positions assumed in homage and respect to monarchs and those in authority.<P>The many references found in the Bible to these same usages prove that the Hebrews too had much in common with the nations around them, not only in creed, but also in the mode of worship, as well as in general everyday etiquette. This is not strange, at least among the Semitic peoples, for there is more or less agreement, even among all nations, ancient and modern, in the attitude of the worshipper in temple and high place.<P>The outward tokens of respect and honor shown by Orientals to their superiors, above all to monarchs, may seem exaggerated. But when we consider that the king was God\'s vicegerent upon the earth or over a certain country, and in some sense Divine, worthy even of adoration, it is not strange that almost equal homage should be paid him as the gods themselves. The higher the person was in power, the greater the honor and respect shown him. It is natural, therefore, that God, the Lord of Lords, and the King of Kings should be the recipient of the highest reverence and adoration.<P>There are several Hebrew words used to describe the various attitudes assumed by those who worshipped Yahweh and heathen gods; these same words are constantly employed in speaking of the homage or respect paid to rulers and persons in authority. The most common terms are those rendered "to stand," "to bow," "to kneel" and "prostrate oneself" or "fall on the face." It is not always easy to differentiate between them, for often one passes imperceptibly into the other. No doubt several attitudes were assumed by the worshipper or suppliant while offering a prayer or petition. The intensity, the ardor or earnestness with which such a petition or prayer was presented would naturally have much to do with the words and posture of the petitioner, though the same expression might be employed to designate his posture or attitude. Thus "to fall on the face" might be done in many different ways. The Moslems observe a regular course of nine or more different postures in their worship. These are more or less faithfully observed by the faithful everywhere. It is almost certain that the Hebrews in common with other Orientals observed and went through almost every one of these attitudes as they presented themselves in prayer to Yahweh. We shall call attention to just four postures:<P class="in15">(1) standing,<P class="in15">(2) bowing,<P class="in15">(3) kneeling, and<P class="in15">(4) falling on the face or prostration.<P>1. Standing:<P>This was one of the very common postures in prayer to God, especially in public worship. It is still customary to stand either erect or with slightly bowed head while offering the public prayers in the synagogue. This is likewise the common practice of a large number of Christians in this and other lands, and no doubt such a posture is sanctioned by the example of the early church and primitive Christians, who, in turn, adopted the usages of the Jewish church. The same practice was in vogue among the Persians, Egyptians and Babylonians and other ancient people as is evidenced by their sculptures and paintings. The famous stela of Hammurabi shows this great king in a standing position as he receives the famous Code from the sun-god.<P>There are numerous Babylonian and Assyrian seals on which are pictured a priest in a standing position before the throne of Sin or Shamash. In this attitude with uplifted hands, he is sometimes accompanied by the person in whose behalf prayers are made. A beautiful rock sculpture at Ibriz, southeast of Eregli in Lycaonia, shows us a king or satrap in a standing position, worshipping a local Baal. E. J. Davies, the discoverer of this Hittite monument, in describing it, makes this remark, which we cannot refrain from inserting, inasmuch as it gives another proof of the unchangeable East. He says: "He (the god) wears boots turned up in front, and bound round the leg above the ankle by thongs and a piece of leather reaching half-way up the shin, exactly as it is worn to this day by the peasants of the plain of Cilicia round Adana." King Solomon, during at least a portion of his prayer at the dedication of the temple, stood before the altar with his hands stretched out toward heaven (<a onClick="return mV(\'1Ki\',8,22);">1Ki 8:22</a>). Numerous allusions to prayer in the New Testament prove that standing was the common posture (<a onClick="return mV(\'Mat\',6,5);">Mt 6:5</a>; <a onClick="return mV(\'Mar\',11,25);">Mr 11:25</a>; <a onClick="return mV(\'Luk\',18,11);">Lu 18:11</a>).<P>What has been said about standing while praying to God is true also of the attitude of the petitioner when paying homage or making an entreaty to man. The Assyrian and Babylonian monuments are full of evidence on this point; we shall give only one illustration: One of the sculptures describing the siege of Lachish by Sennacherib represents the monarch as seated upon his throne while the conquered stand or kneel before him. Joseph stood before Pharaoh (<a onClick="return mV(\'Gen\',41,46);">Ge 41:46</a>). Solomon\'s advisers stood before him (<a onClick="return mV(\'2Ch\',10,6);">2Ch 10:6</a>) and so did those of Rehoboam (<a onClick="return mV(\'2Ch\',10,8);">2Ch 10:8</a>). The same attitude was assumed by suppliants in the Persian court (<a onClick="return mV(\'Est\',5,2);">Es 5:2</a>; <a onClick="return mV(\'Est\',8,4);">8:4</a>). The same is true of Babylonia (<a onClick="return mV(\'Dan\',1,19);">Da 1:19</a>; <a onClick="return mV(\'Dan\',2,2);">2:2</a>).<P>2. Kneeling:<P>Though standing seems to have been the usual attitude, it is quite certain that kneeling was common at all times. The monuments afford abundant proof for this statement; so too the many references in the Bible. Solomon not only stood before the altar on the occasion of dedicating his famous temple, but he also knelt (<a onClick="return mV(\'1Ki\',8,54);">1Ki 8:54</a>; <a onClick="return mV(\'2Ch\',6,13);">2Ch 6:13</a>). Josephus, describing this ceremony, says that the king at the conclusion of his prayer prostrated himself on the ground and in this posture continued worshipping for a long time. Ezra fell upon his knees as he addressed Yahweh in prayer (<a onClick="return mV(\'Ezr\',9,5);">Ezr 9:5</a>). Daniel, too, knelt upon his knees and prayed three times a day (<a onClick="return mV(\'Dan\',6,10);">Da 6:10</a>). The same practice was observed by the apostles and the early church; for we read that Stephen (<a onClick="return mV(\'Act\',7,60);">Ac 7:60</a>), Peter (<a onClick="return mV(\'Act\',9,40);">Ac 9:40</a>), Paul (<a onClick="return mV(\'Act\',20,36);">Ac 20:36</a>) and others (<a onClick="return mV(\'Act\',21,5);">Ac 21:5</a>) assumed this posture as they prayed.<P>3. Bowing:<P>As already stated, it is not always easy to determine the exact posture of those described as kneeling or bowing, for this varied with the temperament of the suppliant and the intensity of his prayer or supplication. Eleazer when sent to select a wife for his master, Isaac, bowed before Yahweh (<a onClick="return mV(\'Gen\',24,26);">Ge 24:26</a>). The Hebrews on leaving Egypt were commanded to bow to Yahweh (<a onClick="return mV(\'Exd\',11,8);">Ex 11:8</a>; <a onClick="return mV(\'Exd\',12,27,28);">12:27-28</a>). The injunction of the Psalmist shows the prevalence of this posture in prayer: "O come, let us worship and bow down" (<a onClick="return mV(\'Psa\',95,6);">Ps 95:6</a>). Isaiah refers to the same when he says: "Every knee shall bow" to God (<a onClick="return mV(\'Isa\',45,23);">Isa 45:23</a>). Paul also bowed his knees to the Father (<a onClick="return mV(\'Eph\',3,14);">Eph 3:14</a>). The same practice obtained among the heathen nations as they worshipped their gods or idols. Naaman bowed before Rimmon, his god. The numerous prohibitions in the Hebrew Scriptures against bowing down at the shrines of the nations around Israel prove the prevalence of this method of adoration. Indeed, one of the ten commandments is directed explicitly against bowing to or worshipping idols (<a onClick="return mV(\'Exd\',20,5);">Ex 20:5</a>). The same prohibition was often repeated, as by Joshua (<a onClick="return mV(\'Jos\',23,7);">23:7</a>) and the author of 2Ki (<a onClick="return mV(\'2Ki\',17,35);">17:35</a>). Unfortunately, Israel did transgress in this very thing, for while still in the Wilderness they bowed down to the gods of Moab (<a onClick="return mV(\'Num\',25,2);">Nu 25:2</a>) and again after their settlement in Canaan (<a onClick="return mV(\'Jdg\',2,12);">Jud 2:12</a>). Amaziah bowed down to the gods of Edom (<a onClick="return mV(\'2Ch\',25,14);">2Ch 25:14</a>).<P>Like deference was also shown to angels or supernatural beings. Thus, Abraham bows to the three angels as they appear to him at Mamre (<a onClick="return mV(\'Gen\',18,2);">Ge 18:2</a>). And so did Lot at Sodom (<a onClick="return mV(\'Gen\',19,1);">Ge 19:1</a>). Joshua fell on his face before the prince of the host of Yahweh (<a onClick="return mV(\'Jos\',5,14);">Jos 5:14</a>). This attitude was a common one to Ezekiel as he saw his wonderful visions (<a onClick="return mV(\'Eze\',1,28);">Eze 1:28</a>; <a onClick="return mV(\'Eze\',3,23);">3:23</a>, and often). Daniel when he saw Gabriel in a vision was afraid and fell upon his face (<a onClick="return mV(\'Dan\',8,17);">Da 8:17</a>). The three disciples had the same experience on the Mount of Transfiguration (<a onClick="return mV(\'Mat\',17,6);">Mt 17:6</a>).<P>Monarchs and persons of superior rank were the recipients of like honors and marks of respect. Joseph\'s brothers bowed as they came into his presence, thinking that he was an Egyptian of high rank (<a onClick="return mV(\'Gen\',43,28);">Ge 43:28</a>). Bathsheba bowed to King David when she entered his presence in the interest of their son Solomon (<a onClick="return mV(\'1Ki\',1,16,31);">1Ki 1:16, 31</a>). But such deference was not shown to monarchs only, for Jacob and his household bowed down seven times to the irate Esau (<a onClick="return mV(\'Gen\',33,3);">Ge 33:3</a>ff). Abigail fell on her face before David as he was marching to avenge himself upon Nabal, her husband (<a onClick="return mV(\'1Sa\',25,23);">1Sa 25:23</a>). David too when he went to meet Jonathan fell on his face to the ground and bowed himself three times (<a onClick="return mV(\'1Sa\',20,41);">1Sa 20:41</a>). The Shunammite woman, as she came to entreat Elisha for the life of her boy, bowed before the prophet (<a onClick="return mV(\'2Ki\',4,37);">2Ki 4:37</a>). The same custom prevailed not only among the Persians, as is evident from the Book of Esther and the monuments at Persepolis, but also in Babylonia, Assyria and other countries.<P>4. Prostration:<P>This was but a more intense way of showing one\'s regard or of emphasizing a petition. It was the token of abject subjection or the deepest reverence. Abraham, when Yahweh appeared to him and promised him a son, with profoundest gratitude and greatest joy fell prostrate on his face (<a onClick="return mV(\'Gen\',17,3);">Ge 17:3</a>). Moses and Aaron were often found in this posture (<a onClick="return mV(\'Num\',14,5);">Nu 14:5</a>; <a onClick="return mV(\'Num\',16,4,45);">16:4, 45</a>; <a onClick="return mV(\'Num\',20,6);">20:6</a>). Elijah, eccentric in many ways, cast himself upon the earth and placed his face between his knees (compare <a onClick="return mV(\'1Ki\',18,42);">1Ki 18:42</a>). Job fell on the ground and worshipped Yahweh (<a onClick="return mV(\'Job\',1,20);">Job 1:20</a>). Such homage was often shown to our Saviour (<a onClick="return mV(\'Mar\',5,22);">Mr 5:22</a>; <a onClick="return mV(\'Jhn\',11,32);">Joh 11:32</a>), not because men realized that He was God in the flesh, but simply as a mark of respect for a great teacher and miracle-worker. It is to be noticed that our Saviour never refused such homage, but accepted it as pertinent and proper. Did He not realize that honor and worship Divine belonged to Him, He would have refused them just as Peter did when Cornelius fell down at his feet and worshipped him (<a onClick="return mV(\'Act\',10,25);">Ac 10:25</a>) or as the angel in <a onClick="return mV(\'Rev\',19,10);">Re 19:10</a>, who said to John, prostrate at his feet, "See thou do it not: I am a fellow servant," etc.`<a href="./study/isbe/search.html?string=ADORATION">ADORATION</a>`34';
isbe[957]='Attus`at\'-us (1Esdras 8:29 = <a onClick="return mV(\'Ezr\',8,2);">Ezr 8:2</a>).`<a href="./study/isbe/search.html?string=HATTUSH">HATTUSH</a>`1';
isbe[958]='Audience`o\'-di-ens: Translated from the Hebrew \'ozen, "ear." In <a onClick="return mV(\'Gen\',23,10);">Ge 23:10</a>f "in the audience of" is equal to "in the presence of," or "while they listened." Compare <a onClick="return mV(\'Exd\',24,7);">Ex 24:7</a>; <a onClick="return mV(\'1Sa\',25,24);">1Sa 25:24</a> (Revised Version (British and American) "in thine ears"); <a onClick="return mV(\'1Ch\',28,8);">1Ch 28:8</a>; <a onClick="return mV(\'Neh\',13,1);">Ne 13:1</a>. In the New Testament the expression "to give audience" (<a onClick="return mV(\'Act\',22,22);">Ac 22:22</a>; <a onClick="return mV(\'Act\',13,16);">13:16</a>, the Revised Version (British and American) "hearken"; <a onClick="return mV(\'Act\',15,12);">Ac 15:12</a>, the Revised Version (British and American) "they hearkened") translated from the Greek akouo "to hear" or derivatives, and means "to listen," "to pay attention." In the King James Version <a onClick="return mV(\'Luk\',7,1);">Lu 7:1</a> (Revised Version, "in the ears of") and the King James Version <a onClick="return mV(\'Luk\',20,45);">Lu 20:45</a> (Revised Version, "in the hearing of") the usage is similar to that of the Old Testament.``1';
isbe[959]='Augia`o\'-ji-a Augia: The wife of Jaddus, whose sons were removed from priesthood because their names were not found in the register, their ancestors having "usurped the office of the priesthood" (1Esdras 5:38). Omitted in <a onClick="return mV(\'Ezr\',2,\'1-\');">Ezr 2</a> and <a onClick="return mV(\'Neh\',7,\'1-\');">Ne 7</a>.``1';
isbe[960]='Augur\'s Oak`o\'-gurs\' ok: If we translated the Hebrew verb \'onen, "to practice augury" (see <a href="./study/isbe/search.html?string=AUGURY">AUGURY</a>) we should in <a onClick="return mV(\'Jdg\',9,37);">Jud 9:37</a> for "the oak of Meonemm" render "the augurs\' oak" as in the Revised Version, margin, for the last word is simply the participle of the same verb and means "one who practices augury," though there is some doubt as to the exact connotation of the word. See under <a href="./study/isbe/search.html?string=DIVINATION">DIVINATION</a>.<P>The English Versions of the Bible make this noun the name of a place; but no such place is known and the derivation and form of the word are clear and certain. We have a similar phrase similarly misunderstood by our translators in <a onClick="return mV(\'Gen\',12,6);">Ge 12:6</a> where the "oak of Moreh" should be "the oak" (or "terebinth?") "of the diviner" or "augur," for moreh is also a participle = "one who teaches" or "directs." Probably the same tree is meant, since in each ease the neighborhood is that of Shechem. The worship of trees, or rather the deity supposed to make them his home, has prevailed very widely. See W. R. Smith, Rel. Semitic. (2), 195; compare <a onClick="return mV(\'Jdg\',4,5);">Jud 4:5</a>; <a onClick="return mV(\'2Sa\',5,24);">2Sa 5:24</a> and "the oak of Zeus at Dodona. " In <a onClick="return mV(\'Jdg\',9,6);">Jud 9:6</a> we read of a "matstsebhah, oak tree": the tree with an altar on which sacrifices were offered. The oak trees of <a onClick="return mV(\'Gen\',12,6);">Ge 12:6</a> and of <a onClick="return mV(\'Jdg\',9,37);">Jud 9:37</a>, if two distinct trees are meant, would be trees which the Canaanites had been in the habit of consulting: hence, the name.``33';
isbe[961]='Augury`o\'-gu-ri o\'-gur-i: This word occurs in the Revised Version (British and American) in <a onClick="return mV(\'Lev\',19,26);">Le 19:26</a>; <a onClick="return mV(\'Deu\',18,10, 14);">De 18:10, 14</a>; <a onClick="return mV(\'2Ki\',21,6);">2Ki 21:6</a>, and the parallel in <a onClick="return mV(\'2Ch\',33,6);">2Ch 33:6</a>. In all these cases the verb "practice augury" is in the King James Version "to observe times." The verb thus translated is \'onen, which means probably to utter a low croaking sound as was done in divining. See <a href="./study/isbe/search.html?string=DIVINATION">DIVINATION</a>.<P>I. Definition.<P>The derivation of "augur" is doubtful, but that it means strictly to divine from the flight of birds is suggested by its likeliest etymology (avis, gur) and especially from the fact that in early Latin the augur was called auspex (= avi spex). But both words came to be applied to all forms of divining from omens.<P>II. Augury among the Romans.<P>The Roman augur was a government official, paid to guide the councils of the nation in times of peace and of war. The principal signs from which these augurs deduced their omens were these:<P>(1) celestial signs, chiefly lightning and thunder, the direction of the former (right to left a good sign, and vice versa);<P>(2) signs from the flight, cries and feeding of birds;<P>(3) signs from the movements and audible sounds of animals, including serpents;<P>(4) signs from the examination of the entrails of animals;<P>(5) belomancy, or divination by arrows;<P>(6) sortilege, or divination by lot. Among the Romans as among other nations (Babylonians, etc.), a sacrifice was offered before omens were taken, so as to propitiate the gods.<P>III. Augury among the Greeks.<P>Almost the only kind of divination practiced or even known among the Romans was that by signs or omens, though Cicero (de Div. i.1f) notices another kind which may be called divining by direct inspiration from the gods. It is this higher and more spiritual mode of divining that obtained most largely among the Greeks, whose chief word for diviner implies this. Yet the lower kind of divination known as augury was to some extent practiced among the Greeks.<P>IV. Augury among the Hebrews.<P>In general it may be said that the religion of Israel set itself steadfastly and consistently against augury; a very remarkable fact when one remembers how rife it was among the surrounding peoples—Arabs, Assyrians, Babylonians, Egyptians, etc. Surely there is in this evidence of special Divine guidance, for those ancient Hebrews are not fit to be compared with the Babylonians or Egyptians or Romans for achievements in art and general secular literature. For the attitude of the Old Testament toward augury see the passages enumerated in the opening of this article. Several kinds of augury are mentioned in the Old Testament, and in some cases without explicit condemnation.<P>1. Belomancy:<P>Belomancy was a method of divination by arrows, a number of which were marked in certain ways, then mixed and drawn at random. We have a reference to this in <a onClick="return mV(\'Hsa\',4,12);">Ho 4:12</a>: \'My people ask counsel from their wood [literally, "tree"] and their staff [i. e. "arrow"] tells them (their oracles)\'; and also in <a onClick="return mV(\'Eze\',21,21);">Eze 21:21</a>: \'For the king of Babylon...used divination, shaking the arrows to and fro.\' The first passage shows that belomancy was practiced by Israelites though the prophet condemned it. The second is interesting as showing how the Babylonian used his arrows. It is to be noticed that the prophet Ezekiel records the incident without making any comment on it, favorable or otherwise. He would, however, had he spoken, almost certainly have condemned it. Mohammed forbade this use of arrows as "an abomination of Satan\'s work" (Koran, Sur. 5 92).<P>2. Hydromancy:<P>Hydromancy, or divination by water, was practiced by Joseph (<a onClick="return mV(\'Gen\',44,\'3-5\');">Ge 44:3-5</a>) without any censure on the part of the writer. There were among the Romans and other ancient nations, as among modern Arabs, etc., many modes of divining by means of water. Generally a piece of silver or gold or a precious stone was thrown into a vessel containing water: the resulting movements of the water and the figures formed were interpreted according to certain fixed signs. See August., de Civ. Dei, vii.31; Strabo xvi.11.39; Iamblichus, de Myst., iii.4.<P>3. Sortliege:<P>Of sortliege, or divination by lot, we have instances in <a onClick="return mV(\'Lev\',16,8);">Le 16:8</a>; <a onClick="return mV(\'Mat\',27,35);">Mt 27:35</a>; <a onClick="return mV(\'1Ch\',25,8);">1Ch 25:8</a>; <a onClick="return mV(\'Jon\',1,2);">Jon 1:2</a>ff; <a onClick="return mV(\'Act\',1,26);">Ac 1:26</a>, etc. The Urim and Thummim was simply a case of sortilege, though in this case, as in the cases enumerated above, God was supposed to control the result. A proper translation of <a onClick="return mV(\'1Sa\',14,41);">1Sa 14:41</a>f; based on a text corrected according to the Septuagint of Lucian, is the following: "And Saul said, O Lord the God of Israel, why hast thou not answered thy servant this day? If the iniquity be in me or in Jonathan my son, give Urim; and if thou sayest thus, The ......" If iniquity is in the people, give Thummim," seems almost certain that these words refer to two balls put into the high priest\'s ephod and drawn by him at random, the one divining one answer, and the other the contrary.<P>4. Other Methods:<P>We meet with several other signs. The prophet Elisha directs King Joash to throw two arrows through the window in order to find out whether the king will be victorious or not (<a onClick="return mV(\'2Ki\',13,\'14-19\');">2Ki 13:14-19</a>). If Gideon\'s fleece were wet and the ground dry this was to be a sign of coming victory over the Midianites. There is nothing in the narrative disapproving of the course taken (<a onClick="return mV(\'Jdg\',6,\'36-40\');">Jud 6:36-40</a>). In <a onClick="return mV(\'1Sa\',14,8);">1Sa 14:8</a>ff Jonathan is represented as deciding whether or not he is to attack the Philistines by the words he will hear them speak. See further <a onClick="return mV(\'Gen\',24,\'12-19\');">Ge 24:12-19</a>; <a onClick="return mV(\'2Ki\',20,9);">2Ki 20:9</a>.<P>5. Dreams:<P>Dreams are very commonly mentioned in the Bible as a means of forecasting the future. See <a onClick="return mV(\'Gen\',20,3,6);">Ge 20:3, 6</a>f (Abimelech); <a onClick="return mV(\'Gen\',31,\'10-13\');">31:10-13</a> (Jacob); <a onClick="return mV(\'Gen\',37,5);">37:5</a>; <a onClick="return mV(\'Gen\',40,3);">40:3</A>ff (Joseph), and also <a onClick="return mV(\'Jdg\',7,13);">Jud 7:13</a>; <a onClick="return mV(\'1Ki\',3,5);">1Ki 3:5</a>f; <a onClick="return mV(\'Mat\',1,20);">Mt 1:20</a>; <a onClick="return mV(\'Mat\',2,12);">2:12</a>ff; <a onClick="return mV(\'Mat\',27,19);">27:19</a>, etc. The part of the Pentateuch ascribed by Wellhausen, etc., to Elohist abounds with accounts of such significant dreams.<P>6. Astrology:<P>That omens were taken from the heavenly bodies by the Babylonians, and other ancient nations is matter of definite knowledge, but it is never countenanced in the Old Testament. Indeed the only explicit reference to it in the Hebrew Scriptures occurs in <a onClick="return mV(\'Isa\',47,13);">Isa 47:13</a> where the Exilic author mockingly urges Babylon to turn to her astrologers that they may save her from her threatened doom.<P>Several cuneiform inscriptions give lists of celestial omens by which Babylonian augurs prognosticated the future. In <a onClick="return mV(\'Mat\',2,\'1-\');">Mt 2</a> the wise men received their first intimation of the birth of the child Jesus from a bright star which they saw in the east.<P>V. Higher Character of Hebrew Prophecy.<P>Though Old Testament prophecy in its lowest forms has features in common with heathen divination, it stands on an infinitely higher level. The prophet speaks under a strong impulse and from a sense of duty. The heathen diviner plied his calling for money. The Greek mantis worked himself into a state of frenzy, thought to imply inspiration, by music and certain drugs. The prophet believed himself directly guided by God. See <a href="./study/isbe/search.html?string=ASTROLOGY">ASTROLOGY</a>, 1; <a href="./study/isbe/search.html?string=DIVINATION">DIVINATION</A>.<P>LITERATURE.<P>T. Witton Davies, Magic. Divination and Demonology among the Hebrews, 1898, 72ff; articles on "Divination" in Hastings, Dictionary of the Bible (five volumes) (Jevons); Encyclopedia Biblica (T. Witton Davies), and on "Augury" in Jewish Encyclopedia (Blau), valuable as giving the rabbinical side as well.``33';
isbe[962]='Augustan; Augustan Band`o-gus\'-tan o-gus\'-tus-izs`<a href="./study/isbe/search.html?string=ARMY+ROMAN">ARMY, ROMAN</a>`1';
isbe[963]='Augustus`o-gus\'-tus Augoustos:<P>(1) The first Roman emperor, and noteworthy in Bible history as the emperor in whose reign the Incarnation took place (<a onClick="return mV(\'Luk\',2,1);">Lu 2:1</a>). His original name was Caius Octavius Caepias and he was born in 63 BC, the year of Cicero\'s consulship. He was the grand-nephew of Julius Caesar, his mother Atia having been the daughter of Julia, Caesar\'s younger sister. He was only 19 years of age when Caesar was murdered in the Senate house (44 BC), but with a true instinct of statesmanship he steered his course through the intrigues and dangers of the closing years of the republic, and after the battle of Actium was left without a rival. Some difficulty was experienced in finding a name that would exactly define the position of the new ruler of the state. He himself declined the names of rex and dictator, and in 27 BC he was by the decree of the Senate styled Augustus. The epithet implied respect and veneration beyond what is bestowed on human things: " Sancta vocant augusta patres: augusta vocantur Templa sacerdotum rite dicata manu." —Ovid Fasti. 609; compare Dion Cass., 5316<P>The Greeks rendered the word by Sebastos, literally, "reverend\'"(<a onClick="return mV(\'Act\',25,21,25);">Ac 25:21, 25</a>). The name was connected by the Romans with augur—"one consecrated by religion"—and also with the verb augere. In this way it came to form one of the German imperial titles "Mehrer des Reichs" (extender of the empire). The length of the reign of Augustus, extending as it did over 44 years from the battle of Actium (31 BC) to his death (14 AD), doubtless contributed much to the settlement and consolidation of the new regime after the troubled times of the civil wars.<P>It is chiefly through the connection of Judea and Palestine with the Roman Empire that Augustus comes in contact with early Christianity, or rather with the political and religious life of the Jewish people at the time of the birth of Christ: "Now it came to pass in those days, there went out a decree from Caesar Augustus, that all the world should be enrolled" (<a onClick="return mV(\'Luk\',2,1);">Lu 2:1</a>). During the reign of Herod the Great the government of Palestine was conducted practically without interference from Rome except, of course, as regarded the exaction of the tribute; but on the death of that astute and capable ruler (4 BC) none of his three sons among whom his kingdom was divided showed the capacity of their father.<P>In the year 6 AD the intervention of Augustus was invited by the Jews themselves to provide a remedy for the incapacity of their ruler, Archelaus, who was deposed by the emperor from the rule of Judea; at the same time, while Caesarea was still the center of the Roman administration, a small Roman garrison was stationed permanently in Jerusalem. The city, however, was left to the control of the Jewish Sanhedrin with complete judicial and executive authority except that the death sentence required confirmation by the Roman procurator. There is no reason to believe that Augustus entertained any specially favorable appreciation of Judaism, but from policy he showed himself favorable to the Jews in Palestine and did everything to keep them from feeling the pressure of the Roman yoke. To the Jews of the eastern Diaspora he allowed great privileges. It has even been held that his aim was to render them pro-Roman, as a counterpoise in some degree to the pronounced Hellenism of the East; but in the West autonomous bodies of Jews were never allowed (see Mommsen, Provinces of the Roman Empire, chapter 11).<P>(2) For Augustus in <a onClick="return mV(\'Act\',25,21,25);">Ac 25:21, 25</a> the King James Version.`<a href="./study/isbe/search.html?string=EMPEROR">EMPEROR</a>`79';
isbe[964]='Aul`ol:`<a href="./study/isbe/search.html?string=AWL">AWL</a>`1';
isbe[965]='Aunt`ant dodhah, ("loving"): A father\'s sister (<a onClick="return mV(\'Exd\',6,20);">Ex 6:20</a>); an uncle\'s wife (<a onClick="return mV(\'Lev\',18,14);">Le 18:14</a>; <a onClick="return mV(\'Lev\',20,20);">20:20</a>).`<a href="./study/isbe/search.html?string=RELATIONSHIPS+FAMILY">RELATIONSHIPS, FAMILY</a>`1';
isbe[966]='Austere`os-ter\' austeros, "harsh," ("rough"): Twice used by Christ in the parable of the Pounds (<a onClick="return mV(\'Luk\',19,21,22);">Lu 19:21-22</a>), and of special significance as illustrating the false conception of God cherished by the sinful and disobedient. The fear resident in a guilty conscience sees only sternness and severity in God\'s perfect righteousness. The word may be made an eminent study in the psychology of an evil heart. Wrongdoing eclipses the soul\'s vision of God\'s love and pictures His righteousness as harsh, unfeeling, partial, unjust, forbidding. The awfulness of sin may thus be seen in its power so to pervert the soul as to make goodness seem evil, justice unjust, and even love unlovely. Compare "hard" skleros, "dried up," "harsh" in the parable of the Talents (<a onClick="return mV(\'Mat\',25,24);">Mt 25:24</a>).``139';
isbe[967]='Author`o\'-ther: This word is used to translate two Greek words:<P>(1) aitios, literally, "cause," hence, "author." <a onClick="return mV(\'Hbr\',5,9);">Heb 5:9</a>, He "became the author of eternal salvation."<P>(2) archego = literally, "chief leader," "prince," "captain"; then author, originator. It is rendered "author" in the following passages:<P>(a) <a onClick="return mV(\'Hbr\',12,2);">Heb 12:2</a>, "looking unto Jesus, the author [King James Version, Revised Version] and finisher [Revised Version, "perfecter"] of our faith." But here it seems better to take archegos in its primary sense, "leader" (Revised Version margin "captain"), rather than in its secondary sense "author." The meaning is, not that He is the originator of faith in us, but that He Himself is the pioneer in the life of faith. He is first in the company of the faithful (compare references to His "faithfulness," <a onClick="return mV(\'Hbr\',2,17);">Heb 2:17</a>; <a onClick="return mV(\'Hbr\',3,2,5,6);">3:2, 5-6</a>), far surpassing in His fidelity even the Old Testament saints mentioned in chapter <a onClick="return mV(\'Hbr\',2,11);">11</a>; and therefore we are to look to Him as our perfect pattern of faith. Faith has not only Christ for its object, but Christ for its supreme example. So Bengel, Bleek, B. Weiss, Alford, A. B. Davidson, Grimm-Thayer. Others, however, take the word in the sense of "author."<P>(b) <a onClick="return mV(\'Hbr\',2,10);">Heb 2:10</a>, "to make the author [King James Version, "captain"] of their salvation perfect through sufferings." Here the idea of Christ as originator or author of our salvation is present (compare the passage <a onClick="return mV(\'Hbr\',5,9);">Heb 5:9</a>, where however a different word is used; see above). But here again the original meaning of "leader" is not to be lost sight of. He, being the first possessor of salvation, becomes the author of it for others. "The idea that the Son goes before the saved in the same path ought perhaps to be retained" (Davidson). Compare <a onClick="return mV(\'Hbr\',6,20);">Heb 6:20</a>, where Jesus is said to be our "forerunner."<P>(c) <a onClick="return mV(\'Act\',3,15);">Ac 3:15</a>, King James Version margin and the Revised Version margin have "author," where text has "prince." Here again it is possible that the two ideas are present.``49';
isbe[968]='Authority in Religion`o-thor\'-i-ti rabhah; toqeph; exousia; exousiazo; katexousiazo; epitage; huperoche; authenteo; dunastes<P><b>I. GENERAL IDEA</b><P class="in15">1. Of Two Kinds<P class="in30">(1) External<P class="in30">(2) Internal<P class="in15">2. Universal Need of Authority<P class="in15">3. Necessity for Infallible Criterion of Truth<P class="in15">4. Ultimate Nature of Authority<P class="in15">5. It Is God<P class="in15">6. Different Ideas of God and Different Views of Authority<P class="in15">7. A Problem of Knowledge for Christians<P><b>II. THE BIBLICAL REFERENCES</b><P class="in15">1. In Old Testament<P class="in15">2. In New Testament<P class="in15">3. Common Elements in their Meaning<P><b>III. BIBLICAL TEACHING</b><P class="in15">1. Old Testament Teaching<P class="in30">(1) Earliest Form Patriarchal<P class="in30">(2) Tribal and Personal Authority<P class="in30">(3) Seers and Priests<P class="in30">(4) Kings and Established Religion<P class="in30">(5) The Great Prophets<P class="in30">(6) The Canon and Rabbinical Tradition<P class="in15">2. New Testament Teaching<P class="in30">(1) Jesus Christ\'s Authority<P class="in60">(a) His Teaching<P class="in60">(b) His Works<P class="in60">(c) Forgiving and Judging<P class="in60">(d) Life and Salvation<P class="in60">(e) Derived from His Sonship<P class="in60">(f) In His Ascended State<P class="in60">(g) Christ and the Paraclete<P class="in30">(2) The Disciples\' Authority<P class="in60">(a) Derived from Christ<P class="in60">(b) Paul\'s Authority<P class="in60">(c) Authority of All Believers<P class="in60">(d) Authority over the Nations<P class="in60">(3) Church\'s Authority Moral and Personal<P class="in60">(4) Authority of the Bible<P><b>IV. OUTLINE HISTORY OF ECCLESIASTICAL DOCTRINE OF AUTHORITY</b><P class="in15">1. Appeal to Reason as Logos<P class="in15">2. Orthodox Dogma<P class="in15">3. Scholasticism<P class="in15">4. Ecclesiastical Absolutism<P class="in15">5. Reformation Principles<P class="in15">6. New Scholasticism<P class="in15">7. The Inner Light<P class="in15">8. Back to Experience<P class="in15">9. Distrust of Reason<P class="in15">10. Christian Skepticism<P><b>V. CLASSIFICATION OF THEORIES</b><P class="in15">1. External<P class="in30">(1) Incipient Catholicism<P class="in30">(2) General Councils<P class="in30">(3) Romanism<P class="in30">(4) Papal Infallibility<P class="in30">(5) Inerrancy of Scripture<P class="in30">(6) Anglican Appeal to Antiquity<P class="in30">(7) Limitations of External Authority<P class="in60">(a) Not Infallible<P class="in60">(b) Rests on Personal Authority<P class="in60">(c) No Apostolical Tradition Extant<P class="in60">(d) No Consensus of Fathers<P class="in60">(e) Bible Needs Interpretation<P class="in60">(f) Authority Necessarily Spiritual<P class="in15">2. Internal Authority<P><b>LITERATURE</b><hr /><P>I. General Idea.<P>1. Of Two Kinds:<P>The term is of manifold and ambiguous meaning. The various ideas of authority fall into two main classes: as external or public tribunal or standard, which therefore in the nature of the case can only apply to the outward expressions of religion; and as immanent principle which governs the most secret movements of the soul\'s life.<P>(1) External.<P>A characteristic instance of the former idea of authority is found in A. J. Balfour\'s Foundations of Belief: "Authority as I have been using the term is in all cases contrasted with reason, and stands for that group of non-rational causes, moral, social and educational, which produces its results by psychic processes other than reasoning" (p. 232, 8th edition). The bulk of men\'s important beliefs are produced and authorized by "custom, education, public opinion, the contagious convictions of countrymen, family, party or church" (p. 226). Authority and reason are "rival claimants" (p. 243). "Authority as such is, from the nature of the case, dumb in the presence of argument" (p. 234).<P>Newman makes a kindred distinction between authority in revealed religion and conscience in natural religion, although he does not assign as wide a sphere to authority, and he allows to conscience a kind of authority. "The supremacy of conscience is the essence of natural religion, the supremacy of apostle or pope or church or bishop is the essence of revealed; and when such external authority is taken away, the mind falls back again of necessity upon that inward guide which it possessed even before revelation was vouchsafed" (Development of Doctrine, 86, edition 1878). From a very different standpoint the same antithesis appears in the very title of Sabatier\'s book, The Religions of Authority and the Religion of the Spirit. He knows both kinds of authority. "The authority of material force, of custom, tradition, the co de, more and more yields place to the inward authority of conscience and reason, and in the same measure becomes transformed for the subject into a true autonomy" (p. xxxiii, English Translation).<P>(2) Internal.<P>Martineau distinguishes the two types of authority to reject the former and accept the latter. "The mere resort to testimony for information beyond our province does not fill the meaning of \'authority\'; which we never acknowledge till that which speaks to us from another and a higher strikes home and wakes the echoes in ourselves, and is thereby instantly transferred from external attestation to self-evidence. And this response it is which makes the moral intuitions, started by outward appeal, reflected back by inward veneration, more than egoistic phenomena, and turning them into correspondency between the universal and the individual mind, invests them with true authority" (Seat of Authority, Preface, edition 1890).<P>Confusion would disappear if the fact were recognized that for different persons, and even for the same persons at different times, authority means different things. For a child his father\'s or his teacher\'s word is a decree of absolute authority. He accepts its truth and recognizes his obligation to allow it to determine his conduct. But when reason awakes in him, he may doubt their knowledge or wisdom, and he will seek other guides or authorities. So it is in religious development. Some repudiate authorities that others acknowledge. But no one has a monopoly of the term or concept, and no one may justly say to Dr. Martineau or anybody else that "he has no right to speak of \'authority\' at all."<P>2. Universal Need of Authority:<P>All religion involves a certain attitude of thought and will toward God and the Universe. The feeling element is also present, but that is ignored in theories of external authority. All religion then involves certain ideas or beliefs about God, and conduct corresponding to them, but ideas may be true or false, and conduct right or wrong. Men need to know what is true, that they may do that which is right. They need some test or standard or court of appeal which distinguishes and enforces the truth; forbids the wrong and commands the right. As in all government there is a legislative and an executive function, the one issuing out of the other, so in every kind of religious authority recognized as such, men require that it should tell them what ideas they ought to believe and what deeds to perform.<P>In this general sense authority is recognized in every realm of life, even beyond that which is usually called religious life. Science builds up its system in conformity with natural phenomena. Art has its ideals of beauty. Politics seeks to realize some idea of the state. Metaphysics reconstructs the universe in conformity with some principle of truth or reality.<P>3. Necessity for Infallible Criterion of Truth:<P>"If we are ....to attach any definite intelligible meaning to the distinction between things as they really are, and things as they merely appear to be, we must clearly have some universal criterion or test by which the distinction may be made. This criterion must be in the first place infallible; that is, must be such that we cannot doubt its validity without falling into a contradiction in our thought ..... Freedom from contradiction is a characteristic that belongs to everything that is real...and we may therefore use it as a test or criterion of reality "(Taylor, Elements of Metaphysics, 18-19). A more skeptical philosopher writes:<P>"That the truth itself is one and whole and complete, and that all thinking and all experience moves within its recognition, and subject to its manifest authority, this I have never doubted" (Joachim, The Nature of Truth, 178). It is only a thoroughgoing skeptic that could dispense with authority, a "Pyrrho," who holds suspense of judgment to be the only right attitude of mind, and he, to be logical, must also suspend all action and cease to be. There can be no question, therefore, except in total nescience, as to the fact of authority in general; and the problem to decide is, "What is the authority in religion?"<P>4. Ultimate Nature of Authority:<P>It is a problem involved in the difficulties of all ultimate problems, and all argument about it is apt to move in a circle. For the ultimate must bear witness of its own ultimacy, the absolute of its own absoluteness, and authority of its own sovereignty. If there were a court of appeal or a standard of reference to which anything called ultimate, absolute and supreme, could apply for its credentials, it would therefore become relative and subordinate to that other criterion. There is a sense in which Mr. Balfour\'s saying is true, "that authority is dumb in the presence of argument." No process of mediate reasoning can establish it, for no premise can be found from which it issues as a conclusion. It judges all things, but is judged of none. It is its own witness and judge. All that reason can say about it is the dictum of Paxmenides: "it is."<P>5. It Is God:<P>In this sense, there can be no question again among religious people, that the authority is God. The one idea involves the other. He alone is self-existent and supreme, who is what He is of His own right. If God exists, He is the ultimate criterion and power of truth and reality. All truth inheres in Him and issues from Him. The problem of authority thus becomes one with the proof and definition of God. These questions lie beyond the purpose of the present article; (see <a href="./study/isbe/search.html?string=GOD">GOD</a>). Their solution is assumed in this discussion of authority, although different theories of authority no doubt involve different ideas of God.<P>6. Different Ideas of God and Different Views of Authority:<P>External theories generally involve what is called a deistic conception of God. Spiritualistic theories of authority correspond to theistic views of God. If He is immanent as well as transcendent, He speaks directly to men, and has no need of intermediaries. Pantheism results in a naturalistic theory of truth. The mind of God is the law of Nature. But pantheism in practice tends to become polytheism, and then to issue in a crude anarchy which is the denial of all authority and truth. But within Christendom the problem of authority lies between those who agree in believing in one God, who is personal, transcendent and to some extent immanent. The differences on these points are really consequences of differences of views as to His mode of self-communication.<P>7. A Problem of Knowledge For Christians:<P>It is, therefore, a problem of epistemology rather than of ontology. The question is, in what way does God make known Himself, His mind and His authority to men generally? The purpose of this article is the exposition of the Biblical teaching of authority, with some attempt to place it in its true position in the life of the church.<P>II. The Biblical References.<P>1. In the Old Testament:<P>Only for<P>(1) rabhah (<a onClick="return mV(\'Pro\',29,2);">Pr 29:2</a>): "to be great" or "many." "When the righteous are in authority, the people rejoice." So the King James Version and the Revised Version, margin, but the Revised Version (British and American) "When the righteous are increased" (so BDB). Toy in the place cited remarks, "The Hebrew has: \'When the righteous increase,\' the suggestion being that they then have control of affairs; the change of a letter gives the reading \'rule\' which is required by the \'govern\' of the second line."<P>(2) toqeph (<a onClick="return mV(\'Est\',9,29);">Es 9:29</a>): "Esther the queen...wrote with all authority to confirm this second letter of Purim" (Revised Version margin "strength" [so BDB]).<P>2. In the New Testament:<P>(1) Most frequently for exousia; exousiazo; and katexousiazo:<P>(a) of God\'s authority (<a onClick="return mV(\'Act\',1,7);">Ac 1:7</a>): as the potter\'s over clay (<a onClick="return mV(\'Rom\',9,21);">Ro 9:21</a>, right; <a onClick="return mV(\'Jud\',1,25);">Jude 1:25</a>, "power"; <a onClick="return mV(\'Rev\',9,\'1-\');">Re 9</a>, "power");<P>(b) of Christ\'s teaching and works (<a onClick="return mV(\'Mat\',7,29);">Mt 7:29</a>; <a onClick="return mV(\'Mat\',21,23,24,27);">21:23-24, 27</a> = <a onClick="return mV(\'Mar\',1,22,27);">Mr 1:22, 27</a>; <a onClick="return mV(\'Mar\',11,28,29,33);">Mr 11:28-29, 33</a> = <a onClick="return mV(\'Luk\',4,36);">Lu 4:36</a>; <a onClick="return mV(\'Luk\',20,2,8);">20:2, 8</a>; <a onClick="return mV(\'Jhn\',5,27);">Joh 5:27</a>, authority to execute judgment. The same Greek word, translated "power" in the King James Version but generally "authority" in the Revised Version (British and American) or the Revised Version, margin, appears also in <a onClick="return mV(\'Mat\',9,6,8);">Mt 9:6, 8</a>, to forgive sins: <a onClick="return mV(\'Mat\',28,18);">Mt 28:18</a>; <a onClick="return mV(\'Mar\',2,10);">Mr 2:10</a>; <a onClick="return mV(\'Luk\',4,32);">Lu 4:32</a>; <a onClick="return mV(\'Luk\',5,24);">5:24</a>; <a onClick="return mV(\'Jhn\',10,18);">Joh 10:18</a>; <a onClick="return mV(\'Jhn\',17,2);">17:2</a>; <a onClick="return mV(\'Rev\',12,10);">Re 12:10</a>);<P>(c) of the disciples, as Christ\'s representatives and witnesses (<a onClick="return mV(\'Luk\',9,1);">Lu 9:1</a>, the twelve; <a onClick="return mV(\'2Cr\',10,8);">2Co 10:8</a>, Paul); also of their rights and privileges; (the same Greek word in <a onClick="return mV(\'Mat\',10,1);">Mt 10:1</a>; <a onClick="return mV(\'Mar\',3,15);">Mr 3:15</a>; <a onClick="return mV(\'Mar\',6,7);">6:7</a>; <a onClick="return mV(\'Luk\',10,19);">Lu 10:19</a> = the Revised Version (British and American) "authority"; <a onClick="return mV(\'Jhn\',1,12);">Joh 1:12</a>; <a onClick="return mV(\'Act\',8,19);">Ac 8:19</a>; <a onClick="return mV(\'2Cr\',13,10);">2Co 13:10</a>; <a onClick="return mV(\'2Th\',3,9);">2Th 3:9</a>; <a onClick="return mV(\'Hbr\',13,10);">Heb 13:10</a>; <a onClick="return mV(\'Rev\',2,26);">Re 2:26</a>; <a onClick="return mV(\'Rev\',22,14);">22:14</a> = the Revised Version (British and American) "right");<P>(d) of subordinate heavenly authorities or powers (<a onClick="return mV(\'1Cr\',15,24);">1Co 15:24</a>; <a onClick="return mV(\'1Pe\',3,22);">1Pe 3:22</a>; and the same Greek word in <a onClick="return mV(\'Eph\',1,21);">Eph 1:21</a>; <a onClick="return mV(\'Eph\',3,10);">3:10</a>; <a onClick="return mV(\'Eph\',6,12);">6:12</a>; <a onClick="return mV(\'Col\',1,16);">Col 1:16</a>; <a onClick="return mV(\'Col\',2,10,15);">2:10, 15</a>; <a onClick="return mV(\'Rev\',11,6);">Re 11:6</a>; <a onClick="return mV(\'Rev\',14,18);">14:18</a>; <a onClick="return mV(\'Rev\',18,1);">18:1</a>);<P>(e) of civil authority, as of king, magistrate or steward (<a onClick="return mV(\'Luk\',7,8);">Lu 7:8</a> = <a onClick="return mV(\'Mat\',8,9);">Mt 8:9</a> [centurion]; <a onClick="return mV(\'Mar\',13,34);">Mr 13:34</a>; <a onClick="return mV(\'Luk\',19,17);">Lu 19:17</a>; <a onClick="return mV(\'Luk\',20,20);">20:20</a>; <a onClick="return mV(\'Luk\',22,25);">22:25</a> = <a onClick="return mV(\'Mat\',20,25);">Mt 20:25</a> = <a onClick="return mV(\'Mar\',10,42);">Mr 10:42</a>; and <a onClick="return mV(\'Act\',9,14);">Ac 9:14</a>; <a onClick="return mV(\'Act\',26,10,12);">26:10, 12</a> [of Saul]; and the same Greek word in <a onClick="return mV(\'Luk\',12,11);">Lu 12:11</a>; <a onClick="return mV(\'Luk\',23,7);">23:7</a>; <a onClick="return mV(\'Jhn\',19,10,12);">Joh 19:10-11</a>; <a onClick="return mV(\'Act\',5,4);">Ac 5:4</a>; <a onClick="return mV(\'Rom\',13,1,2,3);">Ro 13:1-3</a>; <a onClick="return mV(\'Tts\',3,1);">Tit 3:1</a>; <a onClick="return mV(\'Rev\',17,12,13);">Re 17:12-13</a>);<P>(f) of the powers of evil (<a onClick="return mV(\'Rev\',13,2);">Re 13:2</a>, "the beast that came out of the sea"; and the same Greek word in <a onClick="return mV(\'Luk\',4,6);">Lu 4:6</a>; <a onClick="return mV(\'Luk\',12,5);">12:5</a>; <a onClick="return mV(\'Luk\',22,53);">22:53</a>; <a onClick="return mV(\'Act\',26,18);">Ac 26:18</a>; <a onClick="return mV(\'Eph\',2,2);">Eph 2:2</a>; <a onClick="return mV(\'Col\',1,13);">Col 1:13</a>; <a onClick="return mV(\'Rev\',6,8);">Re 6:8</a>; <a onClick="return mV(\'Rev\',9,3,10,19);">9:3, 10, 19</a>; <a onClick="return mV(\'Rev\',13,4,5,7,12);">13:4-5, 7, 12</a>; <a onClick="return mV(\'Rev\',20,6);">20:6</a>).<P>(g) of man\'s inward power of self-control (the same Greek word in <a onClick="return mV(\'1Cr\',7,37);">1Co 7:37</a>; <a onClick="return mV(\'1Cr\',8,9);">8:9</a>, "liberty"; <a onClick="return mV(\'1Cr\',6,12);">1Co 6:12</a>; <a onClick="return mV(\'1Cr\',7,4);">7:4</a>; <a onClick="return mV(\'1Cr\',9,4,5,6,12,18);">9:4-6, 12, 18</a>, the Revised Version (British and American) "right"; <a onClick="return mV(\'1Cr\',11,10);">1Co 11:10</a>).<P>(2) For epitage: commandment, authority to exhort and reprove the church (<a onClick="return mV(\'Tts\',2,15);">Tit 2:15</a>).<P>(3) For huperoche: "for kings and all that are in high place" (Revised Version (British and American) <a onClick="return mV(\'1Ti\',2,2);">1Ti 2:2</a>).<P>(4) For authenteo: "I permit not a woman...to have dominion over a man" (Revised Version, <a onClick="return mV(\'1Ti\',2,12);">1Ti 2:12</a>).<P>(5) For dunastes: "A eunuch of great authority" (<a onClick="return mV(\'Act\',8,27);">Ac 8:27</a>).<P>3. Common Elements in Their Meaning:<P>Of the words translated "authority," exousia, alone expresses the idea of religious authority, whether of God, of Christ or of man. The other uses of this word are here instructive in as bringing out the common element in secular and religious authority.<P>The control of the state over its subjects, whether as supreme in the person of emperor or king, or as delegated to and exercised by proconsul, magistrate or soldier, and the control of a householder over his family and servants and property, exercised directly or indirectly through stewards, have some characteristics which also pertain to religious authority; and the differences, essential though they are, must be derived from the context and the circumstances of the case. In one passage indeed the civil type of authority is mentioned to be repudiated as something that should not obtain within the religious community (<a onClick="return mV(\'Mat\',20,\'25-27\');">Mt 20:25-27</a> = <a onClick="return mV(\'Mar\',10,\'42-44\');">Mr 10:42-44</a> = <a onClick="return mV(\'Luk\',22,25);">Lu 22:25-26</a>). But although its principle and power are so entirely different in different realms, the fact of authority as determining religious thought, conduct and relations permeates the whole Bible, and is expressed by many terms and phrases besides those translated "authority."<P>III. Biblical Teaching.<P>A summary of the Biblical account of authority is given in <a onClick="return mV(\'Hbr\',1,1);">Heb 1:1</a>; "God, having of old time spoken unto the fathers in the prophets by divers portions and in divers manners, hath at the end of these days spoken unto us in a Son [RVm]." Behind all persons and institutions stands God, who reveals His mind and exercises His sovereignty in many ways, through many persons and institutions, piecemeal and progressively, until His final revelation of His mind and will culminates in Jesus Christ.<P>1. Old Testament Teaching:<P>(1) Earliest Form Patriarchal<P>The earliest form of authority is patriarchal. The father of the family is at once its prophet, priest and king. The consciousness of individuality was as yet weak. The unit of life was the family, and the father sums up the family in himself before God and stands to it as God. Such is the earliest picture of religious life found in the Bible. For whatever view may be taken of the historicity of Genesis, there can be little doubt that the stories of the patriarchs represent an early stage of religious life, before the national or even the tribal consciousness had developed.<P>(2) Tribal and Personal Authority<P>When the tribal consciousness emerges, it is clad in a network of customs and traditions which had grown with it, and which governed the greater part of the life of the tribe. The father had now become the elder and judge who exercised authority over the larger family, the tribe. But also, men of commanding personality and influence appear, who change and refashion the tribal customs. They may be men of practical wisdom like Jethro, great warriors like Joshua, or emergency men like the judges. Moses stands apart, a prophet and reformer who knew that he bore a message from God to reform his people\'s religion, and gave Israel a knowledge of God and a covenant with God which set them forever apart from all other peoples. Other tribes might have a Jethro, a Joshua and a Jephtha, but Israel alone had its Moses. His authority has remained a large factor in the life of Israel to the present day and should hereafter be assumed as existing side by side with other authorities mentioned.<P>(3) Seers and Priests<P>In our earliest glimpses of Hebrew life in Canaan we find bands of seers or prophets associated with religion in Israel, as we
