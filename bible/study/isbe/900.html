, which is only two hours short of 235 complete months. As this Jewish colony appears to have been founded after Nebuchadnezzar\'s destruction of Jerusalem by some of the refugees who fled into Egypt with Johanan the son of Kareah (<a onClick="return mV(\'Jer\',40,\'1-\');">Jer 40-44</a>), this acquaintance with the Metonic cycle cannot have been due to Babylonian influence. Nor can it have been due to Egyptian, since the Egyptians did not use or require any such cycle, their year being a solar one of 365 days. Indeed no other nation appears to have been aware of it until, a generation later, Meton, the Athenian, won immortal fame by announcing it. The evidence of these Syene papyri renders it probable that Meton did not himself discover the cycle but learned it from Jewish sources. Many of the Semitic nations used, like the Jews, a natural month in conjunction with the natural year, but the Jews were the most likely to have discovered this cycle, since they alone had their worship centralized at a single shrine which became, in consequence, their standard observatory for their observation of the new moon. These observations, therefore, would all be comparable, and during the 400 years that the Temple stood, it must have been quite clear to them that the 19-year cycle not only gave them seven, the sacred number, of intercalated months, but brought the setting places of the new moons to the same points of the western horizon and in the same order.<P>It is clear from the evidence of these Syene papyri that the Jews, there, used the 19-year cycle both for fixing the day of the new moon, and in order to determine when a thirteenth month had to be intercalated, an illustration of the futility of "the argument from silence," for so far from there being any notice in Scripture of the use of a cycle for determining intercalation, there is no mention of intercalation at all.<P>(6) The Jewish Ritual Preexilic.<P>Ever since this date of the Captivity, the 19-year cycle has been used by the Jews, and it gives to us the "Golden Number" which is employed in fixing the date of Easter in our own ecclesiastical calendar. Since the 19-year cycle has been in use ever since the Captivity, the 49-year cycle, the Jubilee, cannot have been an exilic or post-exilic innovation. In this fact we find the decision of the controversy which has so long divided critics as to whether the ritual legislation of the Jews dated from before or from after their captivity. We may take Kuenen as representing the more recent school: "Even the later prophets and historians, but more especially and emphatically those that lived before the Exile, were unacquainted with any ritual legislation, and specifically with that which has come down to us" (The Hexateuch, 273-74). "In determining its antiquity we must begin by considering its relation to Deuteronomy, to which it is evidently subsequent....This comes out most clearly in the legislation concerning the feasts. Other indications though less unequivocal, plead for the same relationship. In the next place the legislation itself gives evidence of the date of its origin, and those data which justify a positive inference point to the Babylonian captivity....It would follow that the \'legislation of sanctity\' arose in the second half of the Babylonian captivity, presumably shortly before its close; and there is not a single valid objection to this date" (ibid., 276). Kuenen was evidently unaware of the astronomical relations concerned in the ritual legislation, and was unable to anticipate the striking discoveries made from the Syene papyri. More recent knowledge has reversed the verdict which he pronounced so confidently. The traditional view, that the Hebrew ritual preceded the Captivity, was correct. For the Jubilee, with which the Day of Atonement was bound up, was both the culmination and the completion of the entire ritual, and, since the period of the Jubilee, as a luni- solar cycle, was preexilic, the ritual, as a system, must have been preexilic likewise.<P>(7) The Luni-solar Cycles of Daniel.<P>The seasons for which the sun and moon were appointed are mentioned in yet another connection. In the last vision given to Daniel the question was asked, "How long shall it be to the end of these wonders?" and it was answered, "It shall be for a time, times (dual), and a half; and when they have made an end of breaking in pieces the power of the holy people, all these things shall be finished" (<a onClick="return mV(\'Dan\',12,6,7);">Da 12:6-7</a>). From the parallel passage in <a onClick="return mV(\'Dan\',7,25);">Da 7:25</a>, where it is said of the fourth beast, "He shall think to change the times and the law; and they shall be given into his hand until a time (\'iddan) and times (dual) and half a time," it is inferred that mo\'edh in the first instance stands, like \'iddan in the second, for a year; or the period is equivalent to half a week of years. The parallel passages in <a onClick="return mV(\'Rev\',11,2,3);">Re 11:2-3</a>; <a onClick="return mV(\'Rev\',12,6,14);">12:6, 14</a>; <a onClick="return mV(\'Rev\',13,5);">13:5</a> have caused these years to be taken as conventional years of 360 days, each year being made up of 12 conventional months of 30 days, and on the year-day principle of interpretation, the entire period indicated would be one of 1,260 tropical years. This again is a luni-solar cycle, since 1,260 years contain 15,584 months correct to the nearest day. To the same prophet Daniel a further chronological vision was given, and a yet more perfect cycle indicated. In answer to the question, "How long shall be the vision concerning the continual burnt-offering, and the transgression that maketh desolate, to give both the sanctuary and the host to be trodden under foot?" the answer was returned, "Unto two thousand and three hundred evenings and mornings; then shall the sanctuary be cleansed" (<a onClick="return mV(\'Dan\',8,13,14);">Da 8:13-14</a>). Whatever may be the prophetic significance of the passage its astronomical significance is clear: 840,057 days are precisely 2,300 solar years, or 28,447 lunar months, or 30,487 anomalistic months, the anomalistic month being the period in which the moon travels from perigee to perigee. It is the most perfect lunisolar cycle known, and restores the two great lights exactly to their former relationship. This fullest "season" indicated by the sun and moon is given as that for the cleansing of the sanctuary, for the bringing in, as it were, of the full and perfect Jubilee.<P>It is not possible at present to decide as to whether the Jews had learnt of this cycle and its significance from their astronomical observations. If so, they must have been far in advance in mathematical science of all other nations of antiquity. If not, then it must have been given to them by Divine revelation, and its astronomical significance has been left for modern science to reveal.<P>6. The Stars:<P>As with the sun and moon, the stars are regarded under the two aspects of light-givers and time-measurers; or, in other words, as marking the seasons.<P>(1) Their Number.<P>But two other ideas are also strongly dwelt upon; the stars and the heaven of which they form the "host" are used to express the superlatives of number and of height. "Look now toward heaven, and number the stars, if thou be able to number them" (<a onClick="return mV(\'Gen\',15,5);">Ge 15:5</a>); "As the host of heaven cannot be numbered" (<a onClick="return mV(\'Jer\',33,22);">Jer 33:22</a>) are a few of the passages in which the stars are used for limitless number. Those separately visible to the naked eye at any one time do not exceed 2,000 in number, but it was just as evident to the Hebrews of old, as it was to Ptolemy, the astronomer of Alexandria, that beside the stars separately visible, there is a background, a patterned curtain of light, which indicates by its granular and mottled appearance that it is made up of countless myriads of stars, too faint to be individually detected, too close to be individually defined. The most striking feature of this curtain is the grand stellar stream that we call the Milky Way, but the mind easily recognizes that the minute points of light, composing its pattern, are as really stars as the great leaders of the constellations. Later astronomy has confirmed the testimony of the prophets that the stars are without number. The earliest star catalogue, that of Hipparchus, contained a little over one thousand stars; the great International Photographic Chart will show the images of more than fifty millions, and there are photographs which show more than a hundred thousand stars on a single plate. The limit that has been reached is due only to the limited power of our telescopes or the limited time of exposure of the photographs, not to any limitation in the number of stars. To us today, as to the Psalmist of old, it is a token of the infinite power and knowledge of God that "He telleth the number of the stars; He giveth them all their names" (<a onClick="return mV(\'Psa\',147,4);">Ps 147:4</a> the King James Version).<P>(2) Their Distance.<P>As regards the height, that is to say, the distance of the stars, this is immeasurable except in a very few cases. By using as a base line the enormous diameter of the earth\'s orbit—186,000,000 miles—astronomers have been able to get a hint as to the distance of some 40 or 50 stars. Of these the nearest, Alpha Centauri, is distant about twenty-five millions of millions of miles; the brighter stars are on the average quite ten times as far; whilst of the distances of the untold millions of stars beyond, we have no gauge. For us, as for King Solomon, the "heaven" of the stars is "for height" (<a onClick="return mV(\'Pro\',25,3);">Pr 25:3</a>), for a height that is beyond measure, giving us therefore the only fitting image for the immensity of God. So Zophar the Naamathite asked, "Canst thou find out the Almighty unto perfection? It is high as heaven; what canst thou do?" And Eliphaz the Temanite reiterated the same thought, "Is not God in the height of heaven? And behold the height of the stars, how high they are!" (<a onClick="return mV(\'Job\',11,7,8);">Job 11:7-8</a>; <a onClick="return mV(\'Job\',22,12);">22:12</a>). And the height of the heaven, that is to say, the distance of the stars, stands as a symbol, not only of God\'s infinitude, but of His faithfulness and of His mercy: "Thus saith Yahweh: If heaven above can be measured, and the foundations of the earth searched out beneath, then will I also cast off all the seed of Israel for all that they have done, saith Yahweh" (<a onClick="return mV(\'Jer\',31,37);">Jer 31:37</a>). And the Psalmist sings, "For as the heaven is high above the earth, so great is his mercy toward them that fear him" (<a onClick="return mV(\'Psa\',103,11);">Ps 103:11</a> the King James Version).<P>(3) Their Brightness.<P>The stars are not all of equal brightness; a fact alluded to by Paul when he wrote that "one star differeth from another star in glory" (<a onClick="return mV(\'1Cr\',15,41);">1Co 15:41</a>). The ancient Greek astronomers divided the stars according to their brightness into six classes or magnitudes, to use the modern technical term, the average star in any particular magnitude giving about two and a half times as much light as the average star of the next magnitude.<P>Just as the number of the stars and their ordered movement led them to be considered as a mighty army, "the host of heaven," and as a type of that other celestial host, the holy angels, so the individual stars are taken as fitly setting forth, by their brightness and exalted position, spiritual powers and intelligences, whether these are the angels of God, as in <a onClick="return mV(\'Job\',38,7);">Job 38:7</a>, or rulers of churches, as in <a onClick="return mV(\'Rev\',1,20);">Re 1:20</a>. The same image is naturally applied in a yet higher sense to Christ Himself, who is the "star out of Jacob" (<a onClick="return mV(\'Num\',24,17);">Nu 24:17</a>), and "the bright, the morning star" (<a onClick="return mV(\'Rev\',22,16);">Re 22:16</a>; <a onClick="return mV(\'2Pe\',1,19);">2Pe 1:19</a>).<P>7. Morning Stars:<P>The Stars as a Dial<P>In ancient times there were two methods by which the progress of the year could be learned from observation of the heavens. The sun was "for seasons," and the change in its place of rising or of setting supplied the first method. The second method was supplied by the stars. For as the Hebrew shepherds, such as Jacob, Moses, David and Amos, kept watch over their flocks by night, they saw the silent procession of the stars through the hours of darkness, and knew without clock or timepiece how they were progressing. They noticed what stars were rising in the east, what stars were culminating in the south, what were setting in the west, and how the northern stars, always visible, like a great dial, were turning. But as the eastern horizon began to brighten toward the dawn, they would specially note what stars were the last to rise before their shining was drowned in the growing light of day. These, the last stars to appear in the east before sunrise, were the "morning stars," the heralds of the sun. As morning followed morning, these morning stars would be seen earlier and earlier, and therefore for a longer time before they disappeared in the dawn, until some morning, other stars, unseen before, would shine out for a few moments, and thus supplant the stars seen earlier as the actual heralds of the sun. Such a first appearance of a star was termed by the Greek astronomers its "heliacal" rising, and the mention in Scripture of "morning stars," or "stars of the twilight" (<a onClick="return mV(\'Job\',38,7);">Job 38:7</a>; <a onClick="return mV(\'Job\',3,9);">3:9</a>), shows that the Hebrews like the Greeks were familiar with this feature of the ordinances of heaven, and noted the progress of the year by observation of the apparent changes of the celestial host. One star would herald the beginning of spring, another the coming of winter; the time to plow, the time to sow, the time of the rains would all be indicated by successive "morning stars" as they appeared.<P>8. Falling Stars:<P>(1) Meteorites.<P>Meteors are not stars at all in the popular sense of the word, but are quite small bodies drawn into our atmosphere, and rendered luminous for a few moments by the friction of their rush through it. But as they have been shown not to be mere distempers of the air, as they were considered at one time, but bodies of a truly planetary nature, traveling round the sun in orbits as defined as that of the earth itself, the epithet is quite appropriate to them. They are astronomical and not merely terrestrial bodies. Meteors are most striking either when they are seen as solitary aerolites or when they fall in some great shower. The most celebrated shower which seemed to radiate from the constellation Leo—and hence called the Leonid—gave for centuries a magnificent spectacle every thirty-three years; the last great occasion having been on November 14, 1866. Those who saw that shower could appreciate the vivid description given by John when he wrote, "The stars of the heaven fell unto the earth, as a fig tree casteth her unripe figs when she is shaken of a great wind" (<a onClick="return mV(\'Rev\',6,13);">Re 6:13</a>), for the meteors fell like autumn leaves, driven by a great storm, as numerous and as fast. The prophet Isaiah also used a very similar figure (<a onClick="return mV(\'Isa\',34,4);">Isa 34:4</a>).<P>(2) The Star "Wormwood."<P>Such great meteoric showers are most impressive spectacles, but solitary meteors are sometimes hardly less striking. Bolides or aerolites, as such great solitary meteors are termed, are apparently of great size, and are sometimes so brilliant as to light up the sky even in broad daylight. Such a phenomenon is referred to by John in his description of the star Wormwood: "There fell from heaven a great star, burning as a torch" (<a onClick="return mV(\'Rev\',8,10);">Re 8:10</a>). Such aerolites are not entirely consumed in their passage through our atmosphere, but portions of them reach the ground, and in some cases large masses have been found intact. These are generally of a stony nature, but others are either almost pure iron or contain much of that metal. Such a meteoric stone was used as the pedestal of the image of the goddess Diana at Ephesus, and the "townclerk" of the city referred to this circumstance when he reminded the Ephesians that their city was "temple-keeper of the great Diana, and of the image which fell down from Jupiter" (<a onClick="return mV(\'Act\',19,35);">Ac 19:35</a>).<P>9. Wandering Stars:<P>It has already been noted that the moon may perhaps have received its Hebrew name from the fact of its being a "wanderer" among the stars, but there is no direct and explicit reference in Scripture to other celestial "wanderers" except in <a onClick="return mV(\'Jud\',1,13);">Jude 1:13</a>: "Wandering stars, for whom the blackness of darkness hath been reserved for ever." These asteres planetai are not our "planets," but either meteors or comets, more probably the latter, as meteors are more appropriately described as "falling stars."<P>(1) Comets as a Spiritual Type.<P>But as comets and meteors are intimately connected with each other—meteors being in many cases the debris of comets—the simile applies to either. False professors of religion, unstable or apostate teachers, are utterly unlike the stars which shine forth in heaven for ever, but are fitly represented by comets, which are seen only for a few weeks or days, and then are entirely lost to sight, or by meteors, which flash out for a few moments, and are then totally extinguished.<P>All the great comets, all the comets that have been conspicuous to the naked eye, with the single exception of that named after Halley, have appeared but once within the period of human records and Halley\'s Comet only takes 80 days to traverse that part of its orbit which lies within the orbit of the earth; the rest of its period of revolution—76 years—is passed outside that boundary, and for 38 years at a time it remains outside the orbit of Neptune, more than 2,800,000,000 miles from the sun. The other great comets have only visited our neighborhood once within our experience.<P>(2) Comets Referred to in Scripture?<P>The question has been raised whether the appearance of comets is ever referred to in Scripture. Josephus, speaking of the signs which preceded the destruction of Jerusalem by Titus, says, "Thus there was a star resembling a sword which stood over the city, and a comet that continued a whole year" (BJ, VI, v, 3). The "star resembling a sword" was doubtless the return of Halley\'s Comet in 66 AD, and the phrase used by Josephus has suggested that it was a stellar phenomenon that is referred to in <a onClick="return mV(\'1Ch\',21,16);">1Ch 21:16</a>: "The angel of Yahweh...between earth and heaven, having a drawn sword in his hand stretched out over Jerusalem." But this, and the corresponding suggestion as to the nature of the flaming sword that kept the way of the tree of life (<a onClick="return mV(\'Gen\',3,24);">Ge 3:24</a>), are unsupported conjectures not worthy of attention. The astronomer Pingre thought that the first vision of Jeremiah of the "rod of an almond tree" and of a "boiling caldron" (<a onClick="return mV(\'Jer\',1,11,13);">Jer 1:11, 13</a>) had its physical basis in a return of Halley\'s Comet, and other commentators have thought that cometary appearances were described in the "pillars of smoke" of <a onClick="return mV(\'Joe\',2,30);">Joe 2:30</a>; but none of these suggestions appear to have plausibility.<p><a href="file:./study/isbe/900.html?toc=912">Continues next article...</a>``119';
isbe[912]='Astronomy, II`II. The Constellations.<P>The principal achievement of the science of astronomy in the centuries during which the books of the Old Testament were written was the arrangement and naming of the constellations, and there can be no reasonable doubt that the same system was known to the Hebrews as that which has been handed down to us through the Greek astronomers. Paul certainly knew the Greek constellations, for in his sermon on Mars\' Hill (<a onClick="return mV(\'Act\',17,28);">Ac 17:28</a>) he quoted from that poetical description of them which Aratus the great poet of Cilicia had written about 270 BC. But these constellations have a much greater antiquity than this, and it is probable that they were well known to Abraham before he left Ur of the Chaldees. It has been frequently shown (The Astronomy of the Bible, 158; Astronomy without a Telescope, 5) that these constellations themselves supply evidence that they were designed about 2700 BC. They thus antedated the time of Abraham by some centuries, and since some of their most characteristic forms are found upon old Babylonian "boundary stones," it is clear that they were known in the country from whence he came out.<P>1. Nachash, the "Crooked Serpent":<P>The direct references to these old constellation-forms in Scripture are not numerous. One of the clearest is in <a onClick="return mV(\'Job\',26,13);">Job 26:13</a>, where "formed the crooked serpent" (the King James Version) is used as the correlative of "garnished the heavens"; the great constellation of the writhing Dragon, placed at the crown of the heavens, being used, metaphorically, as an expression for all the constellations of the sky. For by its folds it encircles both the poles, that of the equator and that of the ecliptic.<P>2. Leviathan:<P>The term bariach, rendered "crooked" but better as in the Revised Version, margin as "fleeing," is applied by Isaiah to "Leviathan" (liwyathan: <a onClick="return mV(\'Isa\',27,1);">Isa 27:1</a>), properly a "wreathed" or writhing animal, twisted in folds, and hence also called by the prophet \'aqallathon, "crooked," "twisted," or "winding"; a very appropriate designation for Draco, the great polar Dragon. But the latter was not the only "crooked serpent" in the constellations; there were three others, two of which were placed with an astronomical significance not less precise than the coiling of Draco round the poles. Hydra, the Watersnake, marked out the original celestial equator for about one-third of its circumference, and Serpens, the Adder, lay partly along the celestial equator and then was twisted up the autumnal colure, and reached the zenith with its head.<P>The arrangement of the twelve signs of the zodiac to mark out the apparent yearly path of the sun, and of these three serpent- forms to hold their respective and significant positions in the heavens, shows that a real progress in astronomy had been made before the constellations were designed, and that their places were allotted to these figures on a definite astronomical plan.<P>3. The Seed of the Woman:<P>A further purpose is shown by the relation of the three serpents to the neighboring figures, and it is clear that the history preserved in <a onClick="return mV(\'Gen\',3,\'1-\');">Ge 3</a> was known to the designers of the constellations, and that they wished to perpetuate its memory by means of the stellar frescoes. For the constellations, Scorpio, Ophiuchus and Serpens, show us a man strangling a snake and standing on a scorpion; the head of the latter he crushes with one foot, but his other foot is wounded by its reverted sting. When these three constellations were due south, that is to say, at midnight in spring-time, Hercules and Draco were due north, and presented the picture of a man kneeling on one knee, and pressing down with his other foot the head of the great northern serpent or dragon. During the winter midnight the zodiacal constellation on the meridian was the Virgin, figured as a woman holding an ear of corn in her hand, while beneath her the immense length of Hydra was stretched out upon its belly in the attitude of a snake when fleeing at full speed. These figures are evidently meant to set forth in picture that which is expressed in word in <a onClick="return mV(\'Gen\',3,14,15);">Ge 3:14-15</a>, "And Yahweh God said unto the serpent, Because thou hast done this, cursed art thou above all cattle, and above every beast of the field; upon thy belly shalt thou go and dust shalt thou eat all the days of thy life: and I will put enmity between thee and the woman, and between thy seed and her seed: he shall bruise thy head, and thou shalt bruise his heel."<P>4. The Bow Set in the Cloud:<P>Nor is this the only narrative in Genesis which finds a parallel in the constellations. Among the southern groups we find a ship Argo that has grounded on a rock; and close to it stands a figure, Centaurus, who is apparently slaying an animal, Lupus, beside an Altar. The cloud of smoke arising from the Altar is represented by the Milky Way, and in the midst of the cloud there is set the Bow of the Archer, Sagittarius. Here there seems to be pictured the covenant made with Noah after he offered his sacrifice when he left the ark: "I do set my bow in the cloud, and it shall be for a token of a covenant between me and the earth" (<a onClick="return mV(\'Gen\',9,13);">Ge 9:13</a>). Thus the constellations, designed several centuries before the time of Abraham, clearly express a knowledge, and appear designed to preserve a remembrance of the two first promises made by God to mankind as recorded in the early chapters of Gen.<P>There is no need to assume, as some writers have done, that all the 48 primitive constellations were of Divine origin, or even that any of them were. If some of the early astronomers possessed in one form or another the histories that we have in <a onClick="return mV(\'Gen\',3,8,9);">Ge 3:8-9</a>, it would not be unnatural for them to attempt to preserve a memorial of them in the heavens by associating these figures with the stars.<P>It does not follow that all the old constellations have an analogous significance, or that if they have, we should now be able to detect it, and a great deal of ingenuity has been wasted in the attempt to convert the old 48 constellations into a sort of gospel in hieroglyphic. Interpretations of this order were current quite early in Christian times, for they are denounced at considerable length and in detail by Hippolytus in his Refutation of All the Heresies, circa 210 AD. Their revival in recent years is chiefly due to Mazzaroth, a series of papers by the late Miss Frances Rolleston in which fanciful etymologies were given to the Arabic names by which the principal stars are known. These names, for the most part, simply indicate the places which the stars were severally supposed to hold in the figures to which they were assigned, and Miss Rolleston\'s derivations for them are quite misleading and unfounded. Nevertheless her results have been blindly accepted by a number of writers.<P>5. The Dragon of Eclipse:<P>The peculiar arrangement of the serpent forms in the constellations, and especially the position allotted to Hydra, extended along the equator with its head near the spring equinox and its tail near that of autumn, appears to have given rise to the terms "Dragon\'s Head" (omega) and "Dragon\'s Tail" (an upside-down omega), for the nodes or points of intersection of the ecliptic (the apparent path of the sun) with the celestial equator, and hence for nodes in general. As eclipses of the sun and moon can only occur when those bodies are near the nodes of the moon\'s orbit, that is, near the Dragon\'s Head or Tail, the myth seems to have arisen that such eclipses were due to one or other of the two great lights being swallowed by a dragon, and a reference to this myth is found in <a onClick="return mV(\'Job\',3,8);">Job 3:8</a>: "Let them curse it that curse the day, who are ready (the Revised Version, margin: skillful) to rouse up leviathan." The persons referred to are the magicians who pretended to be able by their incantations to cause an eclipse of the sun by bringing up the mythical dragon that was supposed to devour it. Astronomical nomenclature still retains a trace of these old expressions, for the time taken by the moon to pass from one node to the same node again is still called a "draconic month," a "month of the dragon."<P>6. Joseph\'s Dream:<P>If we realize that the Hebrews were quite familiar with the same constellation figures that we have inherited through the Greeks, several indirect allusions to them gain an added meaning. Thus Joseph dreamed that "the sun and the moon and eleven stars made obeisance" to him (<a onClick="return mV(\'Gen\',37,9);">Ge 37:9</a>). The twelve constellations of the zodiac are the twelve among which the sun and moon move, and thus constitute, as it were, their family. Eleven of them therefore represented eleven sons of Jacob, Joseph himself being of course the twelfth. There is some evidence that the time came when the suggestion of this dream was acted upon to the extent that some of the tribes adopted certain of the constellation figures by way of crest or armorial bearing. In <a onClick="return mV(\'Num\',2,\'1-\');">Nu 2</a> it is stated that each of the four camps into which the host of Israel was divided had its own standard:<P>7. The Standards of the Tribes:<P>"Neither the Mosaic law nor the Old Testament generally gives us any intimation as to the form or character of the standard (deghel). According to rabbinical tradition, the standard of Judah bore the figure of a lion, that of Reuben the likeness of a man, or of a man\'s head, that of Ephraim the figure of an ox, and that of Dan the figure of an eagle; so that the four living creatures united in the cherubic forms described by Ezekiel were represented upon these four standards" (Keil and Delitzsch, Commentary on the Pentateuch, III, 17). A variant of this tradition gives as the standard of Reuben, "unstable as water" (<a onClick="return mV(\'Gen\',49,4);">Ge 49:4</a> the King James Version), a Man and a River, and of Dan, "Da shall be a serpent in the way" (<a onClick="return mV(\'Gen\',49,17);">Ge 49:17</a>), an Eagle and a Serpent. These four forms are also found in the constellations in the four quarters of the heavens. Aquarius, the man with a stream of water, and Leo were the original zodiacal constellations of the two solstices, Taurus was that of the spring equinox, and Aquila and Serpens were close to the autumnal equinox, the latter being actually upon the colure.<P>8. The Cherubim:<P>This distribution of the four cherubic forms in the four quarters of heaven gives a special significance to the invocation used by Hezekiah and the Psalmist, "Thou that dwellest between the cherubims" (<a onClick="return mV(\'Isa\',37,16);">Isa 37:16</a> King James Version: <a onClick="return mV(\'Psa\',80,1);">Ps 80:1</a> the King James Version). The Shekinah glory rested indeed between the golden cherubim over the ark in the Holy of Holies, but "the Most High dwelleth not in houses made with hands" (<a onClick="return mV(\'Act\',7,48);">Ac 7:48</a>), and the same cherubic forms were pictured on the curtains of the heavens. "Behold, heaven and the heaven of heavens cannot contain thee" (<a onClick="return mV(\'1Ki\',8,27);">1Ki 8:27</a>); \'Thou dwellest between the cherubim,\' filling the infinite expanse of the stellar universe.<P>9. Balaam\'s Prophecy:<P>When Balaam saw "Israel dwelling according to their tribes; and the Spirit of God came upon him" (<a onClick="return mV(\'Num\',24,2);">Nu 24:2</a>), it was not unnatural that he should allude in his prophecy to the great standards which he would see floating above the camps, and three of the four appear to be indicated: the bull of Joseph—"He hath as it were the strength of the wild-ox"; the lion of Judah—"He lay down as a lion and as a great lion," the King James Version; and Aquarius, the man pouring out a stream of water from a pitcher, the cognizance of Reuben—"Water shall flow from his buckets" (<a onClick="return mV(\'Num\',24,7,8,9);">Nu 24:7-9</a>).<P>In a similar way when the prophets refer to the enemies of Israel under the figure of dragons or reptiles, there seems occasionally an indirect reference to the serpents that represent the powers of evil in the pictures that have been associated with the star groups. Thus in <a onClick="return mV(\'Isa\',27,1);">Isa 27:1</a>, the English Revised Version, it is prophesied that the Lord "shall punish leviathan the swift serpent, and leviathan the crooked serpent; and He shall slay the dragon that is in the sea"; the first allusion being appropriate to the attitude of Hydra, the second to Draco, the third to Cetus. Whilst the group of constellations, Andromeda, Cetus and Eridanus, the woman persecuted by a dragon that casts a river out of its mouth, a river which flowing down below the horizon appears to be swallowed up by the earth, would seem to have furnished John with some of the material for the imagery of <a onClick="return mV(\'Rev\',12,\'1-\');">Re 12</a> in his great vision.<P>Besides references direct or indirect to the familiar constellation figures, four special astronomical terms occur in the Hebrew of the Old Testament which have given rise to much discussion. These are Kimah, Kecil, Mazzaroth and \'Ayish. The tradition of their significance had been lost before the Septuagint translation was made, but it may be taken as practically certain that the renderings given in the Revised Version (British and American) are substantially correct.<P>10. Pleiades:<P>The word Kimah occurs in three passages, in each case in conjunction with Kecil (<a onClick="return mV(\'Amo\',5,8);">Am 5:8</a>; <a onClick="return mV(\'Job\',9,9);">Job 9:9</a>; <a onClick="return mV(\'Job\',38,31);">38:31</a>). It apparently means a "heap" or "cluster," and is hence especially applicable to the beautiful little group of the Pleiades, the most conspicuous star cluster visible to the naked eye. There is the less uncertainty about this identification since "kima" is the term generally used in Syriac literature to denote the Pleiades.<P>Six stars can now easily be seen by any good sight, but very keen-sighted persons can detect more; thus Maestlin, the tutor of Kepler, mapped 11 before the invention of the telescope, and in recent times Carrington and Denning have counted 14 with the naked eye. Still, 6 is the number visible to most persons, though there is a curiously widespread and uniform tradition that they once "were seven who now are six," and seven is the number almost always assigned to them in literature. Hesiod calls them "the seven sisters, the Virgin stars," and Milton, "the seven Atlantic sisters," as representing the daughters of Atlas. Many of the Greek poets, however, regarded them as Peleiades, "rock pigeons," doves, flying from the hunter Orion; but whether they have been considered as representing doves or maidens, seven has still been their traditional number. Possibly one of the group has declined in brightness in the course of the centuries; Alcyone would seem to have increased in brightness, for though now the brightest, it is not one of the four that figure in Ptolemy\'s Catalogue, and if one has increased in brightness, others may have diminished. In the telescope many hundreds of stars are visible. The photographic plate has registered thousands and shows the principal stars as enveloped and threaded together by delicate streams of nebulous matter, the stars shining on these filamentous lines of light like pearls upon a string. This, the appearance of the Pleiades on the best modern photographs, would be strikingly appropriate to the rendering of <a onClick="return mV(\'Job\',38,31);">Job 38:31</a>, which has been adopted in the Revised Version (British and American), "Canst thou bind the cluster (margin "chain") of the Pleiades?" and the question put to Job would be equivalent to asking him if it were his power that had brought together the Pleiades and bound them in so compact a cluster. This rendering which involves the reading "ma\'anaddoth" is supported by the Septuagint, and all the early versions, and hence by nearly all Orientalists. The reading in Massoretic Text, "ma\'adhannoth," that is to say, "dainties" or "delights," and adopted in the King James Version, where the word is paraphrased as "sweet influences," is however correct, as will be shown below.<P>The designation of the group as that of the seven stars gives a special significance to one of the details of the vision of John: "I saw seven golden candlesticks; and in the midst of the candlesticks one like unto a son of man,...And He had in his right hand seven stars:...The seven stars are the angels of the seven churches: and the seven candlesticks are seven churches" (<a onClick="return mV(\'Rev\',1,12,13,16,20);">Re 1:12-13, 16, 20</a>). The seven stars in a single compact cluster shining as one, furnish an image of the church in its many diversities and its essential unity.<P>It may be well to correct here a certain widely diffused error. When it was discovered that the sun itself with all its attendant planets was traveling rapidly through space, the German astronomer Madler hazarded the suggestion that the center of the sun\'s motion, the attracting body that governed it, might lie in the group of the Pleiades, and this suggestion has been quoted in many popular writings as if it were a demonstrated fact. It soon became evident that there was no sufficient ground for the suggestion, and the idea has been entirely abandoned by astronomers.<P>11. Orion:<P>The word Kecil as denominating a constellation occurs in the singular number in three passages, and in each it is placed in antithesis to Kimah. In a fourth passage (<a onClick="return mV(\'Isa\',13,10);">Isa 13:10</a>) it occurs by itself and is in the plural. There is no doubt as to the significance of the word in its common use. In 70 cases it is translated either "fool" or "foolish." It does not signify a weak- minded person, so much as a violent, impious, self-confident one. As a star name, it is probably rightly considered to refer to the glorious constellation of Orion. According to an old tradition, the name of Nimrod, mentioned in <a onClick="return mV(\'Gen\',10,10);">Ge 10:10</a>, as the founder of Babel, Erech, Accad and Calneh, was given by his courtiers to this most brilliant of all the constellations, one that by its form somewhat suggests a gigantic warrior armed for the fight.<P>Until recently it was not found possible to identify the Nimrod of Scripture with any Babylonian monarch until Dr. T. G. Pinches suggested that "Nimrod" was a deliberate Hebrew transmutation of "Marduk," the name of the great Babylonian national hero, and chief deity of their pantheon. "The change was brought about by making the root triliteral, and the ending uk (ak) in Merodach-Baladan disappearing first, Marduk appeared as Marad. This was connected with the root maradh, \'to be rebellious,\' and the word was still further mutilated, or rather deformed, by having a ni attached, assimilating it to a certain extent to the niph\'al forms of the Hebrew verbs, and making a change altogether in conformity with the genius of the Hebrew language" (The Old Testament in the Light of the Historical Records of Assyria and Babylonia, 129-30). In the very brief reference to Nimrod in <a onClick="return mV(\'Gen\',10,8,9);">Ge 10:8-9</a>, he is three times overemphatically termed gibbor, "a mighty (one)" and this has been the name of this constellation among Syrians, Arabs and Jews for many centuries. Indeed the brightest star of the constellation, the one in the left knee, now generally known as Rigel, is still occasionally called Algebar, a corruption of Al Jabbar, though now one of the fainter stars near it more generally bears that name. The word Kecil as applied to this constellation would parallel closely the etymology suggested for the name "Merodach," by its transformation into "Nimrod" as if it were derived from maradh, "to rebel." He who was to the Babylonians a deified hero, was to the Hebrews a rebel Titan, bound in chains among the stars that all might behold his punishment, and in this aspect the question, "Canst thou...loose the bands of Orion?" (<a onClick="return mV(\'Job\',38,31);">Job 38:31</a>) would be equivalent to asking "Canst thou bring down out of their places the stars that make up this figure and so, as it were, set the Titan free?"<P>In <a onClick="return mV(\'Isa\',13,10);">Isa 13:10</a>, kecil occurs in the plural kecilim, "for the stars of heaven and the constellations thereof shall not give their light"; kecilim being translated as "constellations" under the impression that Orion, the brightest of all the constellations, is here put for the constellations in general. This is no doubt correct, but the context shows that the meaning goes farther than this, and that the kecilim who were to be darkened were the proud and arrogant tyrants like Nimrod or Merodach who would, if possible, climb up into heaven itself, even as Orion is represented in our star atlases as if trying to climb up into the zodiac—the home of the sun.<P>12. Mazzaroth, the Constellations of the Zodiac:<P>A further astronomical term which occurs in <a onClick="return mV(\'Job\',38,32);">Job 38:32</a> is left untranslated in both the King James Version and the Revised Version (British and American), namely, the word Mazzaroth. It occurs only once in the Old Testament, but the similar word mazzaloth, translated "planets" in the King James Version and the Revised Version (British and American), occurs in <a onClick="return mV(\'2Ki\',23,5);">2Ki 23:5</a>. For the latter see <a href="./study/isbe/search.html?string=ASTROLOGY">ASTROLOGY</a>. In the fifth tablet of the Babylonian Epic of Creation, we read:<P class="in15">1. He (Marduk) made the station for the great gods;<P class="in15">2. The stars, their images, as the stars of the zodiac he fixed.<P class="in15">3. He ordained the year, and into sections (mizrata) he divided it.<P class="in15">4. For the twelve months he fixed three stars.<P>Here in the third line, mizrata, cognate with the Hebrew mazzaroth, means the sections or divisions of the year, corresponding to the signs of the zodiac mentioned in the second line.<P>Yet again when <a onClick="return mV(\'Job\',9,9);">Job 9:9</a> is compared with <a onClick="return mV(\'Job\',38,31,32);">Job 38:31-32</a>, it is seen that the place of the word mazzaroth in the latter passage is held by the expression "the chambers of the south" (chadhre theman) in the earlier. Mazzaroth therefore is equivalent to "the chambers of the south," and clearly signifies the twelve constellations of the zodiac through which the sun appears to pass in the course of the year, poetically likened to the "inns," the "chambers" or "tabernacles" in which the sun successively rests during the several monthly stages of his annual journey. The same idea was employed by the Arabs in their "mansions of the moon," its "lodging-houses" (menazil), which are 28 in number, since the moon takes 28 days to make the circuit of the heavens, just as the sun takes 12 months.<P>The word Mazzaroth therefore represents the twelve "signs" or, to speak more correctly, the twelve "constellations" of the zodiac. These two terms are often used indiscriminately, but there is a real difference between their significations. The constellations of the zodiac are the actual groupings of the stars, lying along the ecliptic, and are quite irregular in form and length. The signs have no connection with the actual stars but are imaginary divisions of the ecliptic, all exactly equal in length, and they are reckoned from that point in the heavens where the sun is at the moment that it is crossing the celestial equator in its northward motion in springtime. As this point, known to astronomers as "the first point of Aries," moves slowly amongst the stars, taking 25,800 years to complete a revolution of the heavens, the signs of the zodiac also move among the stars, and hence, though at one time each sign bore a rough and general correspondence to the constellation of the same name, the signs have gradually drawn away from them. The constellations of the zodiac were designed about 2700 BC, but the signs—the equal divisions of the zodiac named from them—cannot have been adopted earlier than 700 BC, and were probably even later. For since Aries is the first of the signs, it is clear that it was the first of the constellations at the time when the equal division of the zodiac was effected, and 700 BC is the very earliest date that the constellation Aries can have been so regarded. Incidentally it may be remarked that the mention in the Babylonian story of creation of the allotment of three stars to each of the sections (Mizrata) of the year, shows that not only had the division of the zodiac into 12 equal signs been effected, but that a further step had been taken, namely, the division of each sign into 3 equal parts, later known amongst the Greeks as its "decans," corresponding roughly to the 36 decades of the Egyptian calendar. Whatever, therefore, may have been the antiquity of the traditions embodied in it, the actual Babylonian poem quoted above, so far from being an early document, as it was at one time supposed to be, is probably almost as late as the destruction of Jerusalem by Nebuchadnezzar.<P>13. "Arcturus":<P>There are three constellations, natural groupings of the stars, the Pleiades and Orion and "Charles\'s Wain," which have always attracted men\'s attention, and we accordingly find them referred to in the earliest poems extant. Thus they are the three groups of the stars most frequently mentioned by Homer and Hesiod. The two first groups, the Pleiades and Orion, are, as we have seen, indicated by Kimah and Kecil. We should therefore naturally expect that the third constellation which we find associated with these in the Book of Job should be none other than the seven bright stars in the north, the principal part of the Great Bear. The Hebrew name for this third constellation appears in two slightly different forms. It is \'ash in <a onClick="return mV(\'Job\',9,9);">Job 9:9</a>, and \'ayish in <a onClick="return mV(\'Job\',38,32);">Job 38:32</a>, and in the latter case it is connected with its "sons." The last star of Charles\' Wain or the Plough, as the group is often called among ourselves, still bears the name Benetnasch, derived from the Arabic name Benet Na\'sh, "the daughters of the Bier," by which the Arabs designated the three stars in the Plough-handle, while they called the four stars in the body of the Plough, Na\'sh, "the bier" or "litter." Na\'sh and its daughters so closely correspond to "\' ayish and its sons," that there can be no reasonable doubt that the same seven bright stars are intended; so that the rendering of the Revised Version (British and American), "Canst thou guide the Bear with her train?" correctly reproduces the original meaning. The Arcturus of the King James Version is derived from Vulgate, where it is probably a mistake for Arctos, that is to say, Ursa Major, the Great Bear.<P>The antithesis which is presented in <a onClick="return mV(\'Job\',38,32);">Job 38:32</a> now reveals itself. The Mazzaroth are the twelve constellations of the zodiac, and of these each one rules the night for about a month in its turn; they are each "led forth" in its "season." Each, in its turn, is the "chamber," "tabernacle" or "resting-place" of the sun, and they are appropriately called "chambers of the south," since it is especially in the southern sky that each is seen. In contrast to these are the northern constellations, those round the pole, of which the Great Bear or Charles\' Wain is the brightest and best known At the time of the origin of the constellations, this group was much nearer the pole of the heavens than at present, but now as then these stars are not "led forth," for they are visible at all hours and during every night; but they are "guided"; they move round the pole of the heavens in an unending circle, as if the wain or chariot were being guided by a skillful driver.<P>(1) The "Scatterers," or the North.<P>There is some probability that in <a onClick="return mV(\'Job\',37,9);">Job 37:9</a> the same two regions of the heavens are alluded to: "Out of the chamber of the south cometh the storm, and cold out of the north." It will be observed that the complete expression, "chamber of the south," is not in the original, the translators having supplied "of the south" from analogy with <a onClick="return mV(\'Job\',9,9);">Job 9:9</a>. The sirocco comes then from the region held by the mazzal, the "chamber," or constellation of the zodiac, then on the meridian. But the cold, the blizzard, comes from "the scatterers" (Mezarim). Who or what are the scatterers, and why do they represent the north? The late Professor Schiaparelli suggested that by a slight difference in the pointing, the word might be read as mizrayim, "the two winnowing fans," and that this may well have been a native term for the stars which we now know as the two Bears, Ursa Major and Minor, emphatically the northern constellations; the names being given them from the natural grouping of their chief stars, just as they are known as the two "Dippers" in the United States, or the two "Ladles" in China ("Astronomy in the Old Testament," 67-72).<P>(2) The Ordinances of Heaven Established on the Earth.<P>The astronomical antithesis between Mazzaroth, the constellations of the zodiac ("led forth" each "in its season"), and \'Ayish\', "the Bear with her train" ("guided" in its unceasing revolution round the pole), is so complete and astronomically appropriate, that there is reason to expect an antithesis as clear and as astronomically significant between the two clauses of the preceding verse. But the rendering of the Revised Version (British and American) does not afford anything of the kind: "Canst thou bind the cluster of the Pleiades, or loose the bands of Orion?" is simply equivalent to the question as to whether Job could fix these stars in their places in the sky; and for an inquiry so perfectly general, one constellation would be no more appropriate than another. The true rendering must certainly bring out some difference or at least distinction between the two constellations or the use that was made of them.<P>And in the third passage in which Kimah and Kecil are mentioned together an important distinction is hinted at. The order in <a onClick="return mV(\'Amo\',5,8);">Am 5:8</a> suggests that the Pleiades corresponded in some way to daybreak, Orion to nightfall: "That maketh the Pleiades and Orion, and turneth the shadow of death into the morning, and maketh the day dark with night." Sunrise turns "the shadow of death into the morning," and in the progress of the seasons the analogous change on the higher scale is effected when Nature revives from the death of winter in the morning of the year, that is to say, at the return of spring. And at the time of the origin of the constellations the Pleiades were the harbingers of this change at their "cosmical" rising, that is to say, when they rose with the sun at daybreak they brought back the "delights" of springtime.<P>Similarly sunset makes "the day dark with night," and in the progress of the seasons the analogous change on the higher scale is effected when the long nights and short days of winter set in the evening of the year, and all nature is bound as by iron bands, in cold and frost. And at the time of the origin of the constellations, the "acronychal" rising of Orion, i. e. its rising at nightfall, was the harbinger of this change; the rigor of winter formed "the bands of Orion."<P>These regular changes in the appearings and positions of the constellations constitute the ordinances of the heavens, ordinances which Job could neither alter for the worse by holding back the delights of springtime, or for the better by breaking the bonds of winter cold. But these ordinances were not confined in their effects to the heavens; their dominion was established on the earth, which answered by the revival of vegetation when the Pleiades, then nearly in conjunction with the sun, appeared for a short time before sunrise; and by the return of the constraints of cold and frost when Orion, in opposition to the sun, rode the sky the whole night long.<P>The completeness and beauty of the imagery will now be apparent.<P>The Pleiades stood for the east, since by their rising just before daybreak, they heralded the morning of the year and the "delights" of springtime.<P>Orion stood for the west, since his appearing just after nightfall heralded the evening of the year, and the bands of winter cold.<P>Mazzaroth, the twelve constellations of the zodiac, the "chambers of the south," each "led forth" from the underworld in its own "season," stood for the south.<P>And the "Bear with her train," "guided" in their unceasing course round the pole, stood for the circumpolar constellations in the north.<P>And the movements of them all in a perfect obedience to the law of God were the ordinances of heaven; whilst the dominion of them was seen to be established upon the earth in the constant succession of the seasons there in unfailing answer to the changes in the stars above.<P>These three verses give us a vivid picture of the work of primitive astronomy. The science was then in an early stage of development, but it was a real science, a science of observation, thoroughly sound so far as it had progressed, and showing high intelligence on the part of those who pursued it. We now know that the movement of "the Bear with her train," that is, the apparent rotation of the heavens round the pole, is due to the real rotation of the earth upon its axis; that the bringing out of "the Mazzaroth in their season," apparently due to the revolution of the sun round the earth, is due to the real revolution of the earth round the sun. But this knowledge which has enabled us to see where the actual movements lie has not brought us any nearer penetrating the mystery of those movements. What is the ultimate cause of the rotation of this vast globe, we know no more than the ancients knew what caused the heavens to rotate; what causes it to fly through space 18 miles in every second of time, we know no more than the ancients knew why the sun appeared to move among the stars. To us, as to them, it is the power of God, and the will of God.<P>14. The Date of the Book of Job:<P>It has been supposed by some scholars that the Book of Job was written during the Captivity in Babylon, but this supposition is untenable in view of the statement in Job\'s Apology that the worship of the heavenly bodies was "an iniquity to be punished by the judges" (<a onClick="return mV(\'Job\',31,\'26-28\');">Job 31:26-28</a>). This could not have been written by Jews in exile amongst the worshippers of Samas and Sin. But neither can this book have been written after the Return. The meaning of the three terms, \'Ayish, Kimah and Kecil, had been lost before the Septuagint made the rendering of the Hebrew Scriptures into Greek, for in <a onClick="return mV(\'Amo\',5,8);">Am 5:8</a> they left Kimah and Kecil untranslated, and they rendered \'Ayish and Kecil differently in <a onClick="return mV(\'Job\',9,9);">Job 9:9</a>, and <a onClick="return mV(\'Job\',38,31,32);">38:31-32</a>.<P>Before the Captivity, Kimah and Kecil were plainly in common use, since Amos uses them as if they were familiar to his hearers, and as he himself points out, he was not a man of learning but a simple herdsman. The obvious and sufficient explanation of the later ignorance respecting these three terms lies in the catastrophes of the Assyrian and Bah conquests. Not less significant of their complete loss of the old Hebrew astronomy is the alteration which the Septuagint made in the Hebrew text. The "delights of the Pleiades" had evidently no more meaning for them than they have had for the majority of modern Orientalists, and no doubt it seemed a plausible and legitimate emendation to write ma\'anaddoth, "chains," instead of ma\'adhannoth, "delights," so as to bring about a fancied parallelism with moshekhoth, the "bands" of Orion. But the alteration transforms a complete, beautiful and symmetrical figure, an epitome of the astronomical observation of the time, into a bald tautology. Those critics are therefore right who assign the Book of Job and the <a onClick="return mV(\'Isa\',13,\'1-\');">Isa 13</a> to the period before the Captivities, and the three names come to us as indications, not of a Babylonian science of astronomy, learned by the Jews during their exile, but of a Hebrew astronomy destroyed by the unspeakable disaster of the conquest.<p><a href="file:./study/isbe/900.html?toc=913">Continues next article...</a>``119';
isbe[913]='Astronomy, III`III. Physiography.<P>1. The Circle of the Earth:<P>It has generally been assumed that the Hebrews considered the earth to be a vast circular plain, arched over by a solid vault—"the firmament"—above which were stored, as if in cisterns, the "treasuries" (<a onClick="return mV(\'Job\',38,22);">Job 38:22</a>) of the rain, snow and hail, and some writers have even attempted to express this supposed conception in diagrammatic form. One of the best of these attempts, reproduced below, is given by Schiaparelli, in his Astronomy in the Old Testament.<P>But this assumption is in reality based more upon the ideas prevalent in Europe during the Dark Ages than upon any actual statements in the Old Testament. The same word (chagh) used in the Old Testament to express the roundness of the heavens (<a onClick="return mV(\'Job\',22,14);">Job 22:14</a>) is also used when the circle of the earth is spoken of (<a onClick="return mV(\'Isa\',40,22);">Isa 40:22</a>), and it is likewise applied to the deep (<a onClick="return mV(\'Pro\',8,27);">Pr 8:27</a>). Now it is obvious that the heavens are spherical in appearance, and to an attentive observer it is clear that the surface of the sea is also rounded. There is therefore no sufficient warrant for the assumption that the Hebrews must have regarded the earth as flat.<P>(1) The Earth a Sphere.<P>Certain astronomical relations were recognized very early. The stars appear as if attached to a globe rotating round the earth once in 24 hours, and this appearance was clearly familiar to the author of the Book of Job, and indeed long before the time of Abraham, since the formation of the constellations could not have been effected without such recognition. But the spherical form of the heavens almost involves a similar form for the earth, and their apparent diurnal rotation certainly means that they are not rigidly connected with the earth, but surround it on all sides at some distance from it. The earth therefore must be freely suspended in space, and so the Book of Job describes it: "He stretcheth out the north over empty space, and hangeth the earth upon nothing" (<a onClick="return mV(\'Job\',26,7);">Job 26:7</a>).<P>(2) The North Stretched Out over Empty Space.<P>Here the "north" signifies the northern circumpolar constellations and the writer recognized that they stretch out beyond the utmost confines of the earth; so that he was not under any impression that the heavens rested upon the earth, or were borne up by mountains. The celestial sphere surrounded the earth entirely, but at a distance from it; between the two there was "empty space." Some commentators have indeed claimed that <a onClick="return mV(\'Job\',26,10);">Job 26:10</a>, "He hath described a boundary upon the face of the waters, unto the confines of light and darkness" is equivalent to a statement that the circumference of the terrestrial plain extended to the place where sea and sky met. But no man of intelligence can, at any time, have supposed that the sea horizon marked the dividing line between day and night, and the meaning of the passage is correctly given in the King James Version, "until the day and night come to an end"; in other words, the waters of the sea will be confined to their appointed place never again to overflow the earth so long as the succession of day and night shall continue (compare <a onClick="return mV(\'Gen\',8,22);">Ge 8:22</a>; <a onClick="return mV(\'Gen\',9,15);">9:15</a>).<P>(3) The Corners of the Earth.<P>See <a href="./study/isbe/search.html?string=EARTH+CORNERS+OF+THE">EARTH, CORNERS OF THE</a>.<P>2. The Pillars of the Earth:<P>erets, "the earth," is in general the surface of the earth, the dry land inhabited by man and beast. Hence "the pillars" of the earth (<a onClick="return mV(\'Job\',9,6);">Job 9:6</a>) are the rocks that bear up that surface, for as has been shown, it was quite clear to the author of the Book of Job, and to the primitive astronomers, that our world was unsupported in space. For "Vault of the Earth" see <a href="./study/isbe/search.html?string=EARTH+VAULT+OF">EARTH, VAULT OF</a>.<P>3. The Firmament:<P>(1) The Hebrew Conception.<P>Above the, spherical earth was stretched out the "firmament" (raqia\') made on the second day of creation to "divide the waters from the waters" (<a onClick="return mV(\'Gen\',16,\'1-\');">Ge 16</a>). To the Hebrews the "firmament" was the apparent void above, in which clouds float and the lights of heaven pursue their appointed paths. The word raqia\', by its etymology, suggests an expanse, something stretched, spread or beaten out, as when Isaiah (<a onClick="return mV(\'Isa\',40,22);">40:22</a>) says that the Lord "stretcheth out the heavens as a curtain, and spreadeth them out as a tent to dwell in." But the Greek word stereoma, by which the Septuagint rendered raqia\', gives the meaning of a firm and solid structure, and our translators have carried out this same idea in their English rendering of "firmament."<P>(2) The Alexandrian Conception.<P>In this however the Septuagint simply expressed the astronomical science of their day as accepted in Alexandria, where the doctrine of a succession of solid crystalline spheres, each carrying a planet, held currency. But in order to express the Hebrew idea, raqia\' should be rendered "expanse" or "space"; it corresponds to the "empty space" of <a onClick="return mV(\'Job\',26,7);">Job 26:7</a>. This "expanse" was appointed to divide "the waters which were under the expanse, from the waters which were above the expanse"; and it has been argued from this that the upper waters must have been regarded as being enclosed in a watertight reservoir, furnished with sluices or floodgates, which could be opened to allow the rain to fall.<P>4. The Windows of Heaven:<P>Thus in the account of the Flood, "the windows of heaven" are said to have been opened. But, \'arubbah, "window," means a network, or lattice, a form which can never have been ascribed to a literal floodgate; and in the other passages where "the windows of heaven" are mentioned the expression is obviously metaphorical (<a onClick="return mV(\'2Ki\',7,2,19);">2Ki 7:2, 19</a>; <a onClick="return mV(\'Isa\',24,18);">Isa 24:18</a>; <a onClick="return mV(\'Mal\',3,10);">Mal 3:10</a>).<P>5. Rain:<P>Further the numerous other references to rain connect it with the clouds, as "I will also command the clouds that they rain no rain" (<a onClick="return mV(\'Isa\',5,6);">Isa 5:6</a>), or in the Song of Deborah, "The clouds dropped water" (<a onClick="return mV(\'Jdg\',5,4);">Jud 5:4</a>; see also <a onClick="return mV(\'Psa\',77,17);">Ps 77:17</a>; <a onClick="return mV(\'Psa\',147,8);">147:8</a>; <a onClick="return mV(\'Pro\',16,15);">Pr 16:15</a>; <a onClick="return mV(\'Ecc\',12,2);">Ec 12:2</a>). The fantastic idea of solidly built cisterns in the sky furnished with sluices has no warrant in Scripture. So far from any such crude conception, there is a very clear and complete account of the atmospheric circulation. Elihu describes the process of evaporation, "For he draweth up the drops of water, which distilll in rain from his vapor, which the skies pour down and drop upon man abundantly" (<a onClick="return mV(\'Job\',36,27,28);">Job 36:27-28</a>).<P>6. Clouds:<P>Jeremiah and the Psalmist repeat the description, "He causeth the vapors to ascend from the ends of the earth; he maketh lightnings for the rain, and bringeth forth the wind out of his treasuries" (<a onClick="return mV(\'Jer\',10,13);">Jer 10:13</a>). By the foreshortening that clouds undergo in the distance they inevitably appear to form chiefly on the horizon, "at the ends of the earth," whence they move upward toward the zenith. Thus God "calleth for the waters of the sea, and poureth them out upon the face of the earth" (<a onClick="return mV(\'Amo\',9,6);">Am 9:6</a>); and thus "All the rivers run into the sea, yet the sea is not full; unto the place whither the rivers go, thither they go again" (<a onClick="return mV(\'Ecc\',1,7);">Ec 1:7</a>). Other references to the clouds in the Book of Job reveal not merely observation but acute reflection. "Dost thou know the balancings of the clouds, the wondrous works of him who is perfect in knowledge?" (<a onClick="return mV(\'Job\',37,16);">Job 37:16</a>) indicates a perception that the clouds float, each in its own place, at its own level, each perfectly balanced in the thin air.<P>7. The Deep:<P>(1) Meaning of the Word.<P>Tehom, "the deep," means moving water, and hence the ocean, which is represented as being essentially one, exactly as we now know it to be by actual exploration—"Let the waters under the heavens be gathered together unto one place" (<a onClick="return mV(\'Gen\',1,9);">Ge 1:9</a>). And the earth is stretched out "above the waters" (<a onClick="return mV(\'Psa\',136,6);">Ps 136:6</a>; <a onClick="return mV(\'Psa\',24,2);">Ps 24:2</a>). That is to say that the water surface lies lower than the land surface; and not only so, but, within the substance of the earth itself, there are subterranean waters which form a kind of ocean underground. This also is called in <a onClick="return mV(\'Eze\',31,4);">Eze 31:4</a> the "deep," tehom; "The waters nourished it, the deep made it to grow." But in general tehom denotes the sea, as when Pharaoh\'s chosen captains were drowned in the Red Sea, "The deeps cover them" (<a onClick="return mV(\'Exd\',15,5);">Ex 15:5</a>). Indeed the word appears to be onomatopoetic derived from the "moaning" or "humming" of the sea; whilst \'erets, the "earth," seems intended to represent the "rattle" of shingle, "the scream of a madden\'d beach dragged down by the wave."<P>(2) The Babylonian Dragon of Chaos.<P>In <a onClick="return mV(\'Gen\',1,\'1-\');">Ge 1</a>, tehom denotes the primeval waters, and the resemblance of the word to Tiamat, the name of the Babylonian she-dragon of Chaos, has led some commentators to ascribe a Babylonian origin to this chapter. It need hardly be pointed out that if this resemblance proves any connection between the Hebrew and Babylonian accounts of creation, it proves the Hebrew to be the original. The natural object, tehom, the sea, must have preceded the mythological personification of it.<P>LITERATURE.<P>Maunder, Astronomy of the Bible; Astronomy without a Telescope; Schiaparelli, Astronomy in the Old Testament; Warren, The Earliest Cosmologies, 1909.``119';
isbe[914]='Astyages`as-ti\'-a-jes (Astuages; or Astyigas (in Ktesias)), or Istuvigu, son of Cyaxares.<P>I, king of the Medes 585-550 BC, and predecessor of Cyrus (Bel and the Dragon verse 1): His wife was the daughter of Alyattes, king of Lydia. The daughter of Astyages (Mandane) married a Persian, Cambyses, and a son was born to them who later became Cyrus the Great. Astyages had given orders to expose the babe; but Harpagus, on whom the task had been imposed, gave the child to a herdsman, with instructions to kill him. When the boy, who had been brought up as his own by the herdsman, arrived at the age of twelve, Astyages discovered that he was the son of Mandane. The king in wrath then had the son of Harpagus killed and served to his father as food. The latter concealed his feelings of hatred and resentment, and bided his time; and when the young Cyrus had grown to manhood, he stirred up the grandson in insurrection against Astyages, who was defeated and taken prisoner (Herodotus i.127-30). When Astyages marched against the Persians, the Medes, under the command of Harpagus, deserted their king, and sided with the disappointed Persians; and Cyrus was crowned king. This account of Herodotus is confirmed by the Annalistic Tablet of Cyrus (RP, series ii, 159). The dethroned monarch was treated with kindness by his conqueror. According to Ktesias, a home was provided for him by Cyrus in Hyrcania.<P>Astyages was the last of the kings of the Manda (Media). An exceedingly shrewd man, Deioces by name, had founded the kingdom 150 years before (699-646). Phraortes was the second in line (646-624), and Cyaxares the third (624-584).``71';
isbe[915]='Asunder`a-sun\'-der: This word occurs 22 times in the King James Version, 13 in Old Testament and 9 in the New Testament. It is found in combination with break (twice), burst, cleave (twice), depart, cut (six times), divide (three times), drive, part, pluck, put (twice), rend, saw. These are the translation of 9 Hebrew, and 4 Greek words.<P>Break asunder<P>(1) (parpar): Job, in reply to Eliphaz, complains about God, "I was at ease, and he brake me asunder" (<a onClick="return mV(\'Job\',16,12);">Job 16:12</a>).<P>(2) (nitteq): In <a onClick="return mV(\'Psa\',2,\'1-\');">Ps 2</a> the kings and rulers, meditating rebellion against Yahweh and His anointed, say, "Let us break their bonds asunder" (<a onClick="return mV(\'Psa\',2,3);">Ps 2:3</a>).<P>Burst asunder (lasko): This was the fate of Judas (<a onClick="return mV(\'Act\',1,18);">Ac 1:18</a>).<P>Cleave asunder<P>(1) (nibhqa\'): The same root as of biq\'ah, "a valley." "The ground clave asunder" and swallowed up Dathan and Abiram with their households (<a onClick="return mV(\'Num\',16,31);">Nu 16:31</a>).<P>(2) (pillach): Job complains of God, "He cleaveth my reins asunder" (<a onClick="return mV(\'Job\',16,13);">Job 16:13</a>).<P>Cut asunder<P>(1) (qitstsets): The Lord "cut asunder the cords of the wicked" (<a onClick="return mV(\'Psa\',129,4);">Ps 129:4</a>). The Hebrew word is used of cutting into wires or strips (<a onClick="return mV(\'Exd\',39,3);">Ex 39:3</a>).<P>(2) (gadha\'):" to cut off a branch or cut down a tree." "How is the hammer of the whole earth (Babylon) cut asunder!" (<a onClick="return mV(\'Jer\',50,23);">Jer 50:23</a>). Zechariah "cut asunder" the staff "Beauty," signifying the breach of the covenant between Yahweh and His people, and also the staff "Bands," signifying the breach of the brotherhood between Judah and Israel (<a onClick="return mV(\'Zec\',11,10,14);">Zec 11:10, 14</a>).<P>(3) (dichotomeo): The fate of the Unfaithful Steward, literally, "cut in two"; the Revised Version, margin "severely scourge him" (<a onClick="return mV(\'Mat\',24,51);">Mt 24:51</a>; <a onClick="return mV(\'Luk\',12,46);">Lu 12:46</a>). See <a href="./study/isbe/search.html?string=PUNISHMENTS">PUNISHMENTS</a>.<P>Depart asunder (apochorizomai): Paul and Barnabas "departed asunder from one another" (<a onClick="return mV(\'Act\',15,39);">Ac 15:39</a> the King James Version); the Revised Version (British and American) "parted asunder."<P>Divide asunder<P>(1) (hibhdil): Usually to separate, to make a division between. Here the reference is to the offering of pigeons or turtledoves (<a onClick="return mV(\'Lev\',1,17);">Le 1:17</a>; <a onClick="return mV(\'Lev\',5,8);">5:8</a>).<P>(2) (merismos): From merizo, "to divide." The noun is abstract, "the act of dividing." The word of God pierces "even to the dividing of soul and spirit" (<a onClick="return mV(\'Hbr\',4,12);">Heb 4:12</a>).<P>Drive asunder (hittir): Lit. "to cause to tremble," then "to loosen." God "drove asunder the nations" (<a onClick="return mV(\'Hab\',3,6);">Hab 3:6</a>). Part asunder (hiphridh): With a preposition ben, "between," "to separate." The chariot and horses of fire "parted asunder" Elijah and Elisha (<a onClick="return mV(\'2Ki\',2,11);">2Ki 2:11</a>).<P>Pluck asunder (diaspao): To bear asunder, to part forcibly. "Chains had been plucked asunder" by the demoniac of the Gerasenes (<a onClick="return mV(\'Mar\',5,4);">Mr 5:4</a> the King James Version); the Revised Version (British and American) "rent asunder."<P>Put asunder (chorizo): To sever one from another. See the words of Jesus on divorce (<a onClick="return mV(\'Mat\',19,6);">Mt 19:6</a>; <a onClick="return mV(\'Mar\',10,9);">Mr 10:9</a>).<P>Rend asunder (nibhqa\'): The same Hebrew word as "cleave asunder."<P>(1) "And No shall be rent asunder" (<a onClick="return mV(\'Eze\',30,16);">Eze 30:16</a> the King James Version): the Revised Version (British and American) "broken up."<P>(2) the Revised Version (British and American) for the King James Version "plucked asunder" (<a onClick="return mV(\'Mar\',5,4);">Mr 5:4</a>). Saw asunder (prizo or prio): The fate of some on the roll of faith, "They were sawn asunder" (<a onClick="return mV(\'Hbr\',11,37);">Heb 11:37</a>).`<a href="./study/isbe/search.html?string=PUNISHMENTS">PUNISHMENTS</a>`78';
isbe[916]='Asuppim; House of Asuppim`a-sup\'-im, (beth ha-\'acuppim):<P>King James Version, margin "gatherings"; the Revised Version (British and American) "the storehouses." In <a onClick="return mV(\'Neh\',12,25);">Ne 12:25</a>, the King James Version renders the same word Thresholds(king James Version, margin "treasuries, assemblies"). A storehouse most probably at the southern gate of the temple (<a onClick="return mV(\'1Ch\',26,15,17);">1Ch 26:15, 17</a>; <a onClick="return mV(\'Neh\',12,25);">Ne 12:25</a>).``1';
isbe[917]='Asur`as\'-ur (Asour): the Revised Version (British and American) for Assur in 1Esdras 5:31. Same as Harhur of <a onClick="return mV(\'Ezr\',2,51);">Ezr 2:51</a>.``1';
isbe[918]='Asylum`a-si\'-lum: The custom of fleeing to specially sacred places to obtain the protection of a deity is found all over the world (Post, Grundriss, II, 252ff). In ancient Israel we meet with it in two forms—the asylum of the altar and the asylum of the cities of refuge. The altar at the House of God was a place to which persons in danger fled for protection (<a onClick="return mV(\'1Ki\',1,50);">1Ki 1:50</a>; <a onClick="return mV(\'1Ki\',2,28);">2:28</a>). It had horns and must not be confused with the altars of earth or stone that were used for lay sacrifices. See <a href="./study/isbe/search.html?string=ALTAR">ALTAR</a>; <a href="./study/isbe/search.html?string=SANCTUARY">SANCTUARY</a>. <a onClick="return mV(\'Exd\',21,14);">Ex 21:14</a> provides that a murderer is to be taken from the altar to be put to death. The law of the cities of refuge proceeds upon a somewhat different principle. Its objects are<P>(1) to shield a homicide from the avenger of blood until trial, and<P>(2) to provide a refuge for the manslayer who has not been guilty of murder. There is one reference to the institution in the history of the kingdom (<a onClick="return mV(\'2Sa\',14,14);">2Sa 14:14</a>). For the legal and geographical information.`<a href="./study/isbe/search.html?string=CITIES+OF+REFUGE">CITIES OF REFUGE</a>; <a href="./study/isbe/search.html?string=HOMICIDE">HOMICIDE</a>`193';
isbe[919]='Asyncritus`a-sin\'-kri-tus (Asunkritos, "incomparable"): An unknown Christian at Rome to whom Paul sent an affectionate salutation (<a onClick="return mV(\'Rom\',16,14);">Ro 16:14</a>).``1';
isbe[920]='At One`eis eirenen, "at one," ("at peace"): "Set them at one again" (<a onClick="return mV(\'Act\',7,26);">Ac 7:26</a>), the reconciliation of persons at variance. From this adverb we have the words "atone" and "atonement."``1';
isbe[921]='Atad`a\'-tad (\'atadh, "a thorn").`<a href="./study/isbe/search.html?string=ABEL+MIZRAIM">ABEL-MIZRAIM</a>`1';
isbe[922]='Atar`at\'-ar (Atar; the King James Version Jatal = Ater (<a onClick="return mV(\'Ezr\',2,42);">Ezr 2:42</a>; <a onClick="return mV(\'Neh\',7,45);">Ne 7:45</a>)): The sons of Atar (porters) returned with Zerubbabel to Jerusalem (1Esdras 5:28).``1';
isbe[923]='Atarah`at\'-a-ra, a-ta\'-ra (\'atarah, "crown"): One of Jerahmeel\'s wives and mother of Onam (<a onClick="return mV(\'1Ch\',2,26);">1Ch 2:26</a>).``1';
isbe[924]='Atargatis`a-tar\'-ga-tis (Atargatis; the Revised Version (British and American) wrongly <a href="./study/isbe/search.html?string=ATERGATIS">ATERGATIS</a>):<P>Is stated in 2Macc 12:26 to have been worshipped at Karnion, the Ashtaroth-Karnaim of the Old Testament (compare Ant, XII, viii, 4). The name is found on coins of Membij as \'atar-\'atah, where \'Atar (i. e. Ashtoreth) is identified with the goddess \'Atah, whose name is sometimes written \'Ati. or \'Atah or \'Ati was also worshipped at Palmyra, and (according to Melito) in Adiabene.<P>The compound Atargatis, often corrupted by the Greeks into Derketo, had her chief temples at Membij (Hierapolis) and Ashkelon where she was represented with the body of a woman and the tail of a fish, fish being sacred to her. Herodotus made her the Aphrodite Urania of the Greeks. \'Ati may have been originally a Hittite goddess with whom the Assyrian Ishtar (\'Atar) came afterward to be identified tory of the kingdom (<a onClick="return mV(\'2Sa\',14,14);">2Sa 14:14</a>). For the legal and geographical information.`<a href="./study/isbe/search.html?string=CITIES+OF+REFUGE">CITIES OF REFUGE</a>; <a href="./study/isbe/search.html?string=HOMICIDE">HOMICIDE</a>`157';
isbe[925]='Ataroth`at\'-a-roth, a-ta\'-roth (\'ataroth, "crowns" or "wreaths"; Ataroth):<P>(1) A city east of the Jordan, apparently in the territory given to Reuben, but built, or fortified, by the children of Gad (<a onClick="return mV(\'Num\',32,3,34);">Nu 32:3, 34</a>). It is named along with Dibon, which is identified with Dhiban. Eight miles northeast by north of Dibon, on the south of Wady Zerqa Ma\'in, stands Jebel \'Attarus, in which the ancient name is preserved. The city is doubtless represented by Khirbet \'Attarus, about 4 miles west of the mountain.<P>(2) A place on the boundary between Ephraim and Benjamin, toward the West (<a onClick="return mV(\'Jos\',16,2);">Jos 16:2</a>). It seems to be the same as Ataroth-addar of <a onClick="return mV(\'Jos\',16,5);">Jos 16:5</a>; <a onClick="return mV(\'Jos\',18,13);">18:13</a>. It is probably to be identified with the modern ed-Dariyeh south of nether Bethhoron, and about 12 1/2 miles west of Jerusalem.<P>(3) A place on the eastern frontier of Ephraim (<a onClick="return mV(\'Jos\',16,7);">Jos 16:7</a>). This town has not been identified. Conder thinks it may be identified with et-Truneh in the Jordan valley, or with Khirbet et-Taiyereh.``54';
isbe[926]='Ataroth-Addar`at\'-a-roth-ad\'-ar (\'atroth \'addar, "crowns of Addar").`<a href="./study/isbe/search.html?string=ATAROTH">ATAROTH</a>`1';
isbe[927]='Ater`a\'-ter (\'ater, "bound" (?)):<P>(1) The ancestor of a family of 98 persons who returned from Babylonian captivity with Zerubbabel (<a onClick="return mV(\'Ezr\',2,16);">Ezr 2:16</a>; <a onClick="return mV(\'Neh\',7,21);">Ne 7:21</a>). the King James Version has "Ater of Hezekiah"; the Revised Version (British and American) of 1Esdras 5:15 has "Ater of Ezekias," margin, "Ater of Hezekiah." the King James Version has "Aterezias."<P>(2) The head of a family of porters who returned from Babylon to Jerusalem (<a onClick="return mV(\'Ezr\',2,42);">Ezr 2:42</a>; <a onClick="return mV(\'Neh\',7,45);">Ne 7:45</a>).``1';
