ll as a disorganized priesthood which conducted the public worship of Yahweh. These features were probably common to Israel and neighboring Semitic tribes. Here again the individual person emerges who rises above custom and tradition, and exercises an individual authority direct from God over the lives of the people. Samuel, too, was a prophet, priest and king, but he regarded his function as so entirely ministerial, that God might be said to govern His people directly and personally, though He made known His will through the prophet.<P>(4) Kings and Established Religion<P>In the period of the kingship, religious authority became more organized, institutional and external. The occasional cooperation of the tribes developed into nationality, and the sporadic leadership of emergency chieftains gave way to the permanent rule of the king. Priests and prophets became organized and recognized guilds which acted together under the protection and influence of the king, along the lines of traditional morality and religion. The Hebrew church in its middle ages was an established church and thoroughly "Erastian." We know very little of the details of its organization, but it is clear that the religious orders as a rule offered little resistance to the corrupting influences of the court and of the surrounding heathenism.<P>(5) The Great Prophets<P>Opposition to corruption and advance to higher levels of religious life invariably originated outside the recognized religious authorities. God raised for Himself prophets such as Elijah, Amos, Isaiah and Jeremiah, who spoke out of the consciousness of an immediate vision or message or command from God. In turn they influenced the established religious authorities, as may be seen in the reformations of Hezekiah and Josiah. All that is distinctive in the religion of Israel, all revelation of God in the Old Testament, proceeded from the inner experiences of the irregular prophets.<P>(6) The Canon and Rabbinical Tradition<P>In the Judaism of the post-exilic period, the disappearance of the kingship, and the cessation of prophecy produced new conditions which demanded a readaptation of religious authorities. The relative position of the priesthood was greatly enhanced. Its chiefs became princes of Jerusalem, and exercised all the powers of theocracy that remained under foreign rule. And new developments emerged.<P>The formation of the canon of the Old Testament set up a body of writings which stood as a permanent and external standard of doctrine and worship. But the necessity was felt to interpret the Scriptures and to apply them to existing conditions. The place of the old prophetic guilds was taken by the new order of rabbis and scribes. Gradually they secured a share with the priests in the administration of the law. "In the last two pre-Christian centuries and throughout the Talmudic times, the scribes tsopherim, also called the wise chakhamim, who claimed to have received the true interpretation of the Law as \'the tradition of the Elders and Fathers\' in direct line from Moses, the prophets, and the men of the great synagogue,...included people from all classes. They formed the court of justice in every town as well as the high court of justice, the Sanhedrin in Jerus" (Kohler in Jewish Encyclopedia, II, 337). In the time of Christ, these courts were the recognized authorities in all matters of religion.<P>2. New Testament Teaching:<P>(1) Jesus Christ\'s Authority.<P>When He began to teach in Palestine, all knowledge of God, and all exercise of His authority were mediated through the priests and scribes, who however claimed the Old Testament as their source. Christ was neither the destroyer nor the creator of institutions. He never discussed the abstract right or capacity of the Jewish orders to be religious teachers. He enjoined obedience to their teaching (<a onClick="return mV(\'Mat\',23,2,3);">Mt 23:2-3</a>). Still less did He question the authority of the Old Testament. He came not to destroy, but to fulfill the law and the prophets (<a onClick="return mV(\'Mat\',5,17);">Mt 5:17</a>). But He did two things which involved the assertion of a new and superior authority in Himself. He repudiated the scribes\' interpretation of the law (<a onClick="return mV(\'Mat\',23,\'13-16\');">Mt 23:13-16</a>), and He declared that certain of the provisions of the Mosaic law itself were temporary and tentative, and to be replaced or supplemented by His own more adequate teaching (<a onClick="return mV(\'Mat\',5,32,34,39,44);">Mt 5:32, 34, 39, 44</a>; <a onClick="return mV(\'Mat\',19,8,9);">19:8-9</a>).<P>In doing this, He was really fulfilling a line of thought which permeates the entire Old Testament. All its writers disclaim finality and look forward to a fuller revelation of the mind of God in a day of Yahweh or a new covenant or a Messiah. Jesus Christ regarded these expectations as being realized in Himself, and claimed to complete and fulfill the development which had run through the Old Testament. As such, He claims finality in His teaching of the will of God, and absolute authority in the realm of religion and morals.<P>(a) His Teaching<P>His teaching is with authority. His hearers contrast it with that of the scribes, who, with all the prestige of tradition and establishment, in comparison with Him, entirely lacked authority (<a onClick="return mV(\'Mat\',7,29);">Mt 7:29</a>; <a onClick="return mV(\'Mar\',1,22);">Mr 1:22</a>; <a onClick="return mV(\'Luk\',4,32);">Lu 4:32</a>; <a onClick="return mV(\'Jhn\',7,46);">Joh 7:46</a>).<P>(b) His Works<P>His authority as a teacher is closely associated with His works, especially as these revealed His authority over that world of evil spirits whose influence was felt in the mental disorders that afflicted people (<a onClick="return mV(\'Mar\',1,27);">Mr 1:27</a>; <a onClick="return mV(\'Luk\',4,36);">Lu 4:36</a>).<P>(c) Forgiving and Judging<P>In His claim to forgive sins, sanctioned by works of healing, He seemed to exercise a Divine prerogative (<a onClick="return mV(\'Mat\',9,6,8);">Mt 9:6, 8</a>; <a onClick="return mV(\'Mar\',2,10);">Mr 2:10</a>; <a onClick="return mV(\'Luk\',5,24);">Lu 5:24</a>). It implied an infallible moral judgment, a power to dispense with the recognized laws of retribution and to remove guilt, which could only inhere in God. All these powers are asserted in another form in the statement that He is the final judge (<a onClick="return mV(\'Jhn\',5,27);">Joh 5:27</a>).<P>(d) Life and Salvation<P>He therefore possesses authority over life and salvation. The Father gave Him authority over all flesh, "that whatsoever thou hast given him, to them he should give eternal life" (<a onClick="return mV(\'Jhn\',17,2);">Joh 17:2</a> the American Revised Version, margin). This authority begins in His power over His own life to give it in sacrifice for men (<a onClick="return mV(\'Jhn\',10,18);">Joh 10:18</a>). By faith in Him and obedience to Him, men obtain salvation (<a onClick="return mV(\'Mat\',10,32);">Mt 10:32</a>; <a onClick="return mV(\'Mat\',11,\'28-30\');">11:28-30</a>). Their relation to Him determines their relation to God and to the kingdom of heaven (<a onClick="return mV(\'Mat\',10,40);">Mt 10:40</a>; <a onClick="return mV(\'Luk\',12,8);">Lu 12:8</a>).<P>(e) Derived from His Sonship<P>When challenged by the chief priests and elders, the established religious authorities, to state by what authority He taught, He gives no categorical reply, but tells them the parable of the Vineyard. All the prophets and teachers that had come from God before Him were servants, but He is the Son (<a onClick="return mV(\'Mat\',21,\'23-27\',37);">Mt 21:23-27, 37</a>; <a onClick="return mV(\'Mar\',11,\'28-33\');">Mr 11:28-33</a>; <a onClick="return mV(\'Mar\',12,6);">12:6</a>; <a onClick="return mV(\'Luk\',20,2,8,13);">Lu 20:2, 8, 13</a>). The Fourth Gospel definitely founds His authority upon His sonship (<a onClick="return mV(\'Jhn\',5,\'19-27\');">Joh 5:19-27</a>). Paul deduces it from His self-sacrifice (<a onClick="return mV(\'Phl\',2,\'5-11\');">Php 2:5-11</a>).<P>(f) In His Ascended State<P>In His ascended state, all authority in heaven and on earth is given unto Him (<a onClick="return mV(\'Mat\',28,18);">Mt 28:18</a>). It is not only authority in the church, and in the moral kingdom, but in the universe. God has set Him "far above all rule, and authority, and power, and dominion, and every name that is named, not only in this world, but also in that which is to come" (<a onClick="return mV(\'Eph\',1,21);">Eph 1:21</a>; compare <a onClick="return mV(\'Col\',2,10);">Col 2:10</a>; <a onClick="return mV(\'1Pe\',3,22);">1Pe 3:22</a>; <a onClick="return mV(\'1Cr\',15,24);">1Co 15:24</a>; <a onClick="return mV(\'Rev\',12,10);">Re 12:10</a>).<P>(g) Christ and the Paraclete<P>His authority in the church as revealer of truth and Lord of spirits is not limited or completed within His earthly life. By His resurrection and exaltation He lives on in the church. "Where two or three are gathered...in my name, there am I in the midst of them" (<a onClick="return mV(\'Mat\',18,20);">Mt 18:20</a>). "Lo, I am with you always, even unto the end of the world" (<a onClick="return mV(\'Mat\',28,20);">Mt 28:20</a>). Greater works than He did in the flesh will be done in the church, because of His exaltation: (<a onClick="return mV(\'Jhn\',14,12);">Joh 14:12</a>); and by His sending the Paraclete, "Comforter" (American Revised Version) (<a onClick="return mV(\'Jhn\',14,16);">Joh 14:16</a>). The Paraclete, which is the Holy Spirit, will teach the disciples all things, and bring to their remembrance all that He said unto them (<a onClick="return mV(\'Jhn\',14,26);">Joh 14:26</a>).<P>He has many things to tell them which in the days of His flesh they cannot receive, but the Spirit of truth shall guide them into all truth (<a onClick="return mV(\'Jhn\',16,12,13);">Joh 16:12-13</a>). And the Paraclete is neither separated nor distinct from Him in His exalted and permanent life (<a onClick="return mV(\'Jhn\',14,18,28);">Joh 14:18, 28</a>). Herein is the authority of Christ made complete and permanent. His teaching, works and character, as facts outside of men, even while He lived, and still more when He was dead, could only partially and imperfectly rule their spirits. "Have I been so long time with you, and dost thou not know me, Philip?" In the day of the Spirit\'s revelation "ye shall know that I am in my Father" (<a onClick="return mV(\'Jhn\',14,9,20);">Joh 14:9, 20</a>). Nor, again, did or could He define the truth as it applied to every contingency throughout all time, while He lived under the limitations of time and place.<P>Such a revelation, if it could have been given, would have been quite useless, for men can only a pprehend the truth progressively and in relation to the position they occupy in time and place. But by His permanent spiritual presence in the church, He enters into, inhabits and governs its whole life and determines for it what is true and right at every stage of its development. (See Forrest, Authority of Christ, 202-3.) To ask whence Christ derives or how He possesses the authority above described, is to raise the whole question of His metaphysical existence. Empirically, we see it issuing from two facts which are essentially one—His filial consciousness and His moral perfection. These chiefly are the empirical facts which the church has sought to interpret and express in the metaphysical doctrine of the Incarnation. (See Forrest, op. cit.)<P>(2) The Disciples\' Authority.<P>The first disciples acknowledged Christ in all things as their Lord and Master; not the teaching they had heard, nor the example they had witnessed, but Christ in His permanent, living presence. They pray to Him to fill Judas\' place among the Twelve (<a onClick="return mV(\'Act\',1,24,25);">Ac 1:24-25</a>). He gave the Spirit at Pentecost (<a onClick="return mV(\'Act\',2,33);">Ac 2:33</a>). In His name they perform their miracles (<a onClick="return mV(\'Act\',3,6);">Ac 3:6</a>; <a onClick="return mV(\'Act\',9,34);">9:34</a>). With Him Saul meets on the way to Damascus (<a onClick="return mV(\'Act\',9,5);">Ac 9:5</a>; <a onClick="return mV(\'Gal\',1,12);">Ga 1:12</a>). From Him they receive the teaching and commands which they deliver to the churches (<a onClick="return mV(\'1Cr\',11,23);">1Co 11:23</a>).<P>But they too exercised an authority which is derivative, secondary, and dependent upon Him.<P>(a) Derived from Christ<P>While Jesus Christ yet lived He gave the Twelve, and again the Seventy, authority to cast out unclean spirits and to heal all manner of diseases, while they went about preaching (<a onClick="return mV(\'Mat\',10,1);">Mt 10:1</a>; <a onClick="return mV(\'Mar\',3,15);">Mr 3:15</a>; <a onClick="return mV(\'Mar\',6,7);">6:7</a>; <a onClick="return mV(\'Luk\',9,1);">Lu 9:1</a>; <a onClick="return mV(\'Luk\',10,19);">10:19</a>). After His resurrection He gave them commission to bear witness for Him, to baptize and to teach all nations (<a onClick="return mV(\'Mat\',28,\'18-20\');">Mt 28:18-20</a>; <a onClick="return mV(\'Luk\',24,48,49);">Lu 24:48-49</a>). Paul also traced his authority to preach directly to Jesus Christ (<a onClick="return mV(\'Gal\',1,1,12);">Ga 1:1-12</a>). From Him they received their endowment with the Holy Spirit for the work (<a onClick="return mV(\'Act\',1,5);">Ac 1:5</a>; <a onClick="return mV(\'Act\',2,33);">2:33</a>).<P>(b) Paul\'s Authority<P>Paul claimed for himself, and by inference, for the other apostles, authority to exercise discipline in the churches, "which the Lord gave for building you up" (<a onClick="return mV(\'2Cr\',10,8);">2Co 10:8</a>; <a onClick="return mV(\'2Cr\',13,10);">13:10</a>). All the church\'s ministers exercise oversight and admonition over the churches (<a onClick="return mV(\'1Th\',5,12);">1Th 5:12</a>; <a onClick="return mV(\'2Ti\',4,2);">2Ti 4:2</a>; <a onClick="return mV(\'2Ti\',2,2);">2:2</a>).<P>(c) Authority of All Believers<P>The authority of sonship, and of participation in the tree of life belongs to all believers (<a onClick="return mV(\'Jhn\',1,12);">Joh 1:12</a>; <a onClick="return mV(\'Rev\',22,14);">Re 22:14</a>).<P>(d) Authority over the Nations<P>And in virtue of their faith they have authority over the nations (<a onClick="return mV(\'Rev\',2,26);">Re 2:26</a>; <a onClick="return mV(\'Rev\',20,4);">20:4</a>). Christ makes them to be kings (Revised Version (British and American) a kingdom) and priests (<a onClick="return mV(\'Rev\',1,6);">Re 1:6</a>), a royal priesthood (<a onClick="return mV(\'1Pe\',2,9);">1Pe 2:9</a>).<P>In all this we are to see the authority of faith, of character, of men who are messengers of Christ because they are in living union with Him. It pertains to no office or institution, and exists only where Christ reigns in men, and therefore, through them.<P>(3) Church\'s Authority Moral and Personal.<P>It is moral and personal and more concerned with life than with doctrine. Paul was the greatest teacher of the early church, but he claims no infallibility, promulgates no dogma, imposes no standard of orthodoxy beyond faith in Christ. He reasons, argues and persuades men to accept the gospel he had received of the Lord, but he knows no other authority than the truth as it is a living fact in Jesus Christ.<P>In the Pastoral Epistles we certainly read of a "sound doctrine" which should be taught and believed, but it has not crystallized into a creed, and the only condition of salvation laid down is living faith in Jesus Christ. See <a href="./study/isbe/search.html?string=DOCTRINE">DOCTRINE</a>.<P>The authority of the apostolic church, then, is in the first place that of individual men in whom Jesus Christ lives, a direct personal and individual authority. It is true that the individual can only live the Christian life, and therefore know the Christian truth, in a society, but that does not impair the individual and personal character of his witness. Yet as the church lives a collective life, there is a sense in which it may be said to bear a collective witness. Men are naturally more readily impressed by an idea held by the many. That is right in so far as the probability of the truth of a doctrine increases with the number of minds which approve it.<P>That is the element of truth in the Catholic dictum quod ubique, quod semper, quod ab omnibus creditum est ("what is believed everywhere, always, and by all"). But the assent of the many does not constitute the truth of an idea or fact, nor enhance its authority. And there are levels of truth to which only few minds can attain, so that the assent of the many may be a presumption against the truth of an idea. And in the last resort, men do not accept ideas with mind and heart, because many believe them, but because of their inherent truth, their power to govern their minds. And the essential truth of a doctrine is no greater, whether one or a million accept it.<P>The apostolic church recognized this principle, for it never claimed for itself greater authority than that of a tutor to bring men to Christ, the one Lord. Peter, Paul, John, each knew Christ in a degree, and each spoke of Him as well as he could, but none of them claims to say all, or demands that his own teaching should absolutely rule men\'s minds; and the collective authority of the church can never rise higher than that of its best spirits.<P>(4) Authority of the Bible.<P>And the authority of the Bible as a whole is of the same nature as that of the church. It is a record of the experiences of men who knew God in various ways and degrees, but among them all there is only one Master. \'No one knows the Father save the Son, and he to whomsoever the Son willeth to reveal Him.\' In varying degrees obedience should be rendered to many men in the church and outside of it, as they satisfy the demands of reason and conscience, but in the last resort every soul by itself must find, choose and obey its own King. For Christians Christ alone is King, as He revealed Himself in His human personality, in the experience and history of the church, and ultimately in the personal experience of every believer. (For a different view see J. H. Leckie, Authority in Religion.)<P>IV. Outline History of Ecclesiastical Doctrine of Authority.<P>1. Appeal to Reason as Logos:<P>Different ideas, drawn from many sources, soon replaced New Testament principles of authority in the life and thought of the church. The Greek apologists and Fathers were generally dominated by the Platonic doctrine of the Logos, and thought of God as dwelling in man and communicating His mind to him by giving him a share of His own mind and reason. While they accepted the Scriptures and the traditions of the church as Divine teaching, they did not regard them as external and sovereign authorities, but rather as copies of the Divine reason which dwelt in every man, but in complete and perfect manner only in Jesus Christ.<P>2. Orthodox Dogma:<P>Neo-Platonism followed, and it underlies much of the church teaching from Origen to Augustine. God as pure being could not make known His essence to men, and His Logos in all the forms of its manifestation tended to become a spoken word which God had sent forth from Himself, rather than the living indwelling of God with men. When the Logos ceased to be living, it tended to become external and stereotyped, and upon this basis grew up Greek orthodoxy. Men who knew but little of the living personal Word felt the need of defining and establishing the central truths of Christianity in fixed and permanent forms which should become the standard of all thinking. The inward witness of the Logos disappears, and the external authority of tradition and dogma as defined by the councils took its place. The bishops preserved the tradition and constituted the councils and thus became the organs of authority. The Scriptures were still venerated in words, but in fact subordinated to the episcopacy.<P>3. Scholasticism:<P>Aristotle\'s philosophy dominated the Middle Ages, or rather the pale ghost of Aristotle\'s system, the formal logic only. The forms of thought were mistaken for its essence. Truth consisted in logical consistency and systematic coherence. The dogmas of earlier ages were assumed as premises from which to deduce, by syllogistic inference, the whole structure of the church and its organs and sacraments, as the infallible representatives of God on earth.<P>4. Ecclesiastical Absolutism:<P>Nominalism emptied the forms of thought of all reality and reared the ecclesiastical system upon negation. All the more necessary was it to affirm the absolute and unquestioned authority of the church, since it rested upon no reason or reality to which appeal could be made to justify its position and teaching. Thus, the growth of absolutism in the church went pari passu with the disappearance of idealism, of any contact of the mind with reality, truth and God. Another way of saying this truth is that the doctrine of the Holy Spirit and of the living Christ suffered a total eclipse during the Middle Ages, while the authority of the church as the organ of revelation became absolute.<P>5. Reformation Principles:<P>The Reformation was not consciously based upon any philosophic principles. It was the product of practical necessities. Men\'s spiritual needs drove them back to God, and they found Him in two sources, in the Bible, which was the record of His self-revelation through prophet, psalmist, apostle and preeminently through Jesus Christ, and in the accordant testimony of the Holy Spirit in their own hearts. But the underlying principles of this teaching were not articulated in a philosophy of knowledge and revelation for two centuries.<P>6. New Scholasticism:<P>Therefore the second and third generations of Reformers, no longer possessed by the visions and convictions of Luther and Calvin, were thrown back upon the old scholastic philosophy which recognized no kinship of mind between God and man, and knew no direct communication between them. Hence, it was necessary to find a new external authority, and this they discovered in the Bible which they made into a law of truth, as defined anew by ecclesiastical councils.<P>7. The Inner Light:<P>But the mystical side of the Reformers\' teaching was not altogether lost, and a few obscure bodies of Christians continued to hold the doctrine of the inner light. Yet as the scholastic Protestants took only half—the objective half of the Reformers\' teaching—the mystics only took the subjective half, and every man\'s imagination tended to become a law unto himself.<P>8. Back to Experience:<P>Kant did for philosophy what Luther had done for religion. He rejected its dogmas and external authorities in order to come back to its realities. He was the first philosopher of the Protestant principle. He sought to discover a direct relation between man\'s mind and reality. He did not fully succeed. The old dogma of the noumenon as something that lay completely beyond man\'s ken clung to him, and vitiated his system. But through man\'s moral nature, he found a way to the heart of reality and to God. His idealistic principles were developed by his successors into the modern idealism, upon which it has been possible to erect a theory of knowledge that brings man\'s mind into direct contact with God, and therefore, a theory of authority which represents God as directly the sovereign of the soul.<P>9. Distrust of Reason:<P>But the other side of Kant\'s philosophy, too, was developed into a theory of religious skepticism and external authority. Man\'s reason, he had taught, could not come into contact with reality, with the thing-in-itself, and therefore it could know nothing of God. This distrust of reason was made the basis of two different systems of external authority by Dean Mansol and Cardinal Newman. The skeptical element really descended from Locke and Hume, but men who would have disdained to learn their theology from Hume accepted Hume\'s principles from Kant, and built upon them, as a house upon sand, one, the authority of Anglicanism, and the other, the authority of Romanism.<P>10. Christian Skepticism:<P>Kant\'s skepticism also allied itself with elements of Luther\'s teaching and traveled a middle course in the school of Ritschl. While holding that man may have knowledge and experience of Divine things in Jesus Christ, who is of the practical value of God for religious experience, the Ritschlians scruple to affirm that it is a direct and actual knowledge of God as He is essentially. This they will neither deny nor affirm, but the refusal to affirm has for many minds the effect of denial, and it leads to a subjectivism which is not far removed from skepticism and the denial of all authority.<P>V. Classification of Theories:<P>The various theories of authority may be now classed as follows:<P>1. External:<P>(1) Incipient Catholicism<P>Incipient Catholicism in the 2nd and 3rd centuries.—All ideas of a living and prosefit revelation were suppressed as in the case of Montanism. Three more or less coordinate authorities were set up which determined for individual Christians what was Christian truth and conduct. The canon of the New Testament was gradually formed to define what writings, in addition to the Old Testament taken over from the Jewish church, were inspired by the Holy Spirit and of Divine authority. The outline of a common creed or rule of faith grew up as the standard interpretation of Scripture. Above all was the episcopacy, which was supposed to preserve in unbroken tradition the unwritten teaching of the apostles. As the only living factor in this system of authority the last easily secured the predominant place. (See Harnack, History of Dogma, II, chapter ii, English translation.)<P>(2) General Councils.<P>The authority of the episcopacy was organized into a permanent and general form in the councils, to whose decision obedience was demanded on pain of excommunication. The councils professed and believed that they were only defining the teaching that had always obtained in the church, and therefore invested themselves and their decisions with the authority of Christ.<P>(3) Romanism.<P>During the Middle Ages, the church of Rome concentrated in itself, that is, in its episcopacy, all the authority of tradition, bishops, councils and whatever else had held sway over the mind of the church. Scripture was ignored and the Bishop of Rome exercised the plenary authority of God over men\'s minds and lives. "Boniface VIII accepted in the Bull Unam sancram (ecclesiam) of November 18,1302, the Thomist doctrine of the papacy: \'We declare, say, define and pronounce that it is essential to salvation that every human creature should subject himself to the Roman Pontiff\'" (Loofs, Dogmengeschichte, 307).<P>(4) Papal Infallibility.<P>This theory culminated in 1870 in the formal declaration of the infallibility of the pope. "The Roman Pontiff, when he speaks ex cathedra...has that infallibility, with which the Divine Redeemer endowed His church, in defining a doctrine of faith or morals" (Vatican Council, 1870, Session 4, cap. 4). This authority of the pope extends over all questions of knowledge and conduct, of discipline and government in the whole church. The theory is based upon the doctrine of tradition, as laid down in the Council of Chalcedon. "The doctrine of Catholic teaching is, that the body of publicly revealed doctrine has received no objective increase since the days of the apostles," and "it is no change of doctrine when that which has always been held implicitly becomes the subject of an explicit declaration" (Hunter, Outlines of Dogmatic Theology, I, 159, 164).<P>Newman and recent modernists, however, concede a development in the doctrines of the church, but on the basis of the traditional teaching derived from the apostles. But once a development is conceded, questions arise as to its principles and conditions, and the whole authority that rests upon them falls to the ground by the mere fact of an appeal from it to the principles that govern its development. The attempt to evade criticism by positing the miraculous preservation of the tradition from error involves a further appeal from the supposed authority to a hypothetical miracle for which there is no tittle of evidence. All the evidence is against it. The history of the church shows that it has been as liable to error, and as readily influenced by natural conditions, as any other human institution.<P>(5) Inerrancy of Scripture.<P>When Protestants sought an external authority, they posited the inerrancy and infallibility of the Bible, and the whole Christian faith was founded upon that dogma. "Holy Scripture is the judge, or rather the voice of the supreme and infallible judge, the Holy Spirit, and the norm to which an inferior judge should refer in deciding controversies of faith, and according to which alone he should give sentence" (Quenstedt, quoted in Hutterns Redivivus, 119,10th edition). Protestants found it necessary to interpret Scripture, and to define doctrines in synods and councils, but their decisions had authority only because they were supposed to be expositions of Scripture, and in that sense, the expression of God\'s mind. They differed from the "Catholic" councils in that they claimed no authority of their own and repudiated any authority that might be derived from tradition or the ministerial office.<P>(6) Anglican Appeal to Antiquity.<P>In the Anglican church too, the Scriptures as infallible were the ultimate authority, but some kind of a coordinate authority was claimed for the priesthood as standing in the succession of the apostles, and for the church Fathers and councils of the first six centuries. And the tendency has been to lay increasing emphasis on the latter factors, as criticism has undermined the literal and external authority of Scripture.<P>(7) Limitations of External Authority.<P>All the above-mentioned theories contain an element of truth, and the authorities they posit have in their turns ruled the minds and lives of men; but none of them can be regarded as adequate and final expressions of the mind of God to man.<P>(a) Not Infallible<P>It is superfluous to demonstrate that they are not infallible; in spite of that they might still be all the authority that man can have or need.<P>(b) Rests on Personal Authority<P>They all rest on the assumption that God\'s self-revelation came to an end with the apostolic age. The Biblical theory admittedly does, and the tradition theories strictly interpreted are in exactly the same case. An authority resting upon a traditional teaching handed down faithfully from the apostles would differ in no essential respect from one resting upon the written words of the apostles. They would be equally limited, literal, external and mechanical. But problems of mind and conduct have arisen, which the apostles never contemplated, and which their teaching (whether preserved in written or oral tradition matters nothing) could not solve.<P>(c) No Apostolical Tradition Extant<P>As a matter of fact no traditional teaching of the apostles supplementing their writings has ever been discovered or can be discovered. What has been put forward as such is in manifest contradiction to their writings.<P>(d) No Consensus of Fathers<P>The idea that there is a consensus of opinion among church Fathers is equally illusory. If there were, it would need to be proved that such opinion could have any binding authority in religion.<P>(e) Bible Needs Interpretation<P>The Bible is not one body of truth all standing at the same level, and whatever view of its inspiration may be held, some further authority will be needed to discriminate between the lower and the higher in its teaching.<P>(f) Authority Necessarily Spiritual<P>Above all, an authority which is merely external and objective is no authority at all to the mature religious life. Blind submission to any external authority, creed, church or book, is the condition of a slave, and in such case "our spiritual intelligence is not quickened and developed by communion with the infinite wisdom, but arrested and quelled. Only then, on the other hand, are we spiritually enfranchised when we receive a revelation as from God, not because we are awed or terrified or allured by our selfish interests into reception of it, but because our own minds and hearts respond to it, because we see and know it to be true" (J. Caird, University Sermons (1898), 204-5).<P>2. Internal Authority:<P>Theories of internal authority are in the nature of the case not so easily classified or defined as those of external; nor have they as yet filled so large a place in the public life of the church. But it would be a serious error to suppose that all the men who gave their adherence to systems of external authority lived in mere subjection to them. The history of mysticism in the church is the history of independent thought resting in a direct knowledge of God that transcended all external authority. Montanism and Gnosticism each in its own way appealed to an inner criterion of truth. All heresies involved some independent judgment, and appealed to authorities that were neither objective nor established. The Protestant Reformation was an open revolt against external authority, and although it resulted for a time in the substitution of another external authority, neither its original motive, nor its permanent force had any kinship with it.<P>Luther\'s free criticism of the Bible, and Calvin\'s appeal to the testimony of the Holy Spirit as the final principle of its interpretation, are well known. No body of Protestants at present founds its faith on the mere letter of Scripture or creed. Inward authority has been conceived in many ways and expressed by many terms, such as the Logos (Greek apologists); the Paraclete (Montanus); ecstasy (Mystics); knowledge as opposed to faith or creed (Gnostics); the personal experience of faith (Luther); the testimony of the Holy Spirit (Calvin); the inner light (Quakers); individual experience (Pietists); practical reason (Kant); religious feeling (Schleiermacher); the historical Christ (Ritschl); conscience (Martineau); the living Christ (R. W. Dale); the consciousness of Christ (A. M. Fairbairn); the Christ of history and of experience (D. W. Forest) and many more. The variety suggests at first the denial rather than the affirmation of authority, but it is only in such a variety that the principles of an adequate authority can be recognized.<P>The ultimate authority in religion is God as He reigns in men\'s hearts. But both the experience itself and the expression and interpretation of it vary with each individual. A religious authority to be real and effective must win the response of the human spirit, and in that personal relation of Spirit with spirit lie the conditions of variation. Yet human reason and conscience everywhere tend to acknowledge one standard, to recognize one ideal and to obey one Lord. Nothing can force such a uniformity but the inward fitness of one supreme revelation to the common demands of humanity. No agreement yet exists as to the possibility or reality of such a revelation. But wherever men lend themselves to the spiritual contact of Jesus Christ with their souls, without the intervention of human creeds or institutions, their conscience and reason approve His moral supremacy and their spirits recognize His intimate knowledge of the Father.<P>LITERATURE:<P>Besides books already mentioned, Bruce, Chief End of Revelation; Sanday, Inspiration, and Oracles of God; Oman, Vision and Authority, and The Problem of Faith and Freedom; Asia Minor Fairbairn, Catholicism, Roman and Anglican; Sabatier, The Religions of Authority; Watson, The Philosophical Basis of Religion; Kaftan, The Truth of the Christian Religion; Gwatkin, The Knowledge of God; Iverach, article "Authority" in Hastings, Encyclopedia of Theology and Ethics; E. O. Davies, Prolegomena to Systematic Theology, especially for Bibliography.``145';

isbe[973]='Avail`a-val\' shawah, ("to be equal," hence "to be enough," "to avail"): Used in the sense of "satisfy" (<a onClick="return mV(\'Est\',5,13);">Es 5:13</a>). Queen Esther\'s exceptional favor availed not to satisfy Haman, because of his insane jealousy of his rival Mordecai. ischuo, "to be strong.," translated also "prevail" (<a onClick="return mV(\'Rev\',12,8);">Re 12:8</a>); with a negative signifies incompetence, e. g. the impossibility of redemptivc merit or power in an outward ceremony or act (<a onClick="return mV(\'Gal\',5,6);">Ga 5:6</a>; <a onClick="return mV(\'Gal\',6,15);">6:15</a> the King James Version): "neither circumcision availcth anything," contrasted with the efficacy of faith "in Christ Jesus." Used also to express the efficacy of prayer (<a onClick="return mV(\'Jam\',5,16);">Jas 5:16</a>).``1';
isbe[974]='Avaran`av\'-a-ran: A surname of Eleazar, the third son of Mattathias (1Macc 2:5). It is doubtfully conjectured that Eleazar received this surname from the episode related in 1Macc 6:43-46; the word may mean "the piercer," referring to his stabbing of the elephant. Some connect it with chur, "to be white," and connect it with Eleazar\'s white complexion. The Syriac reads "Chavran" and the Vulgate\'s "Abaron"; the Septuagint in 1Macc 6:43 gives Sauaran which is an error for Eleazaros auran; Septuagint\'s Codex Venetus corrects to auran.``1';
isbe[975]='Aven`a\'-ven \'awen "emptiness," "vanity": Used in <a onClick="return mV(\'Eze\',30,17);">Eze 30:17</a> for On or Heliopolis, in Egypt. See <a href="./study/isbe/search.html?string=ON">ON</a>. As a term of contempt Hosea calls Beth-el "Beth-aven" (<a onClick="return mV(\'Hsa\',4,15);">4:15</A>; <a onClick="return mV(\'Hsa\',5,\'1-\');">5</a>). So Amos speaks of some valley near Damascus as "the valley of Aven" (that is, of the idol, <a onClick="return mV(\'Hsa\',1,5);">1:5</a>), in which Baalbek (Heliopolis) was situated. The word is rendered "idol" in <a onClick="return mV(\'Isa\',66,3);">Isa 66:3</a>.``1';
isbe[976]='Avenge; Avenger`a-venj\' a-venj\'-er: Avenge.—The general idea connected with this word is that of inflicting punishment upon the wrongdoer. Since emphasis may be placed upon the deed itself, the wrongdoer, or the injured party, the verb is found an intransitive (only <a onClick="return mV(\'Lev\',19,18);">Le 19:18</a>; see below), transitive (<a onClick="return mV(\'2Sa\',4,8);">2Sa 4:8</a> et al.); and also active (<a onClick="return mV(\'Deu\',32,43);">De 32:43</a>), passive (<a onClick="return mV(\'Jer\',5,9);">Jer 5:9</a>) and reflexive (<a onClick="return mV(\'Est\',8,13);">Es 8:13</a>). In <a onClick="return mV(\'1Sa\',25,26);">1Sa 25:26</a>ff avenge is translated from yasha\', "to save" (Revised Version margin, "thine own hand saving thee"), in <a onClick="return mV(\'Hsa\',1,4);">Ho 1:4</a> from paqadh, "to visit," and in <a onClick="return mV(\'2Sa\',18,19);">2Sa 18:19</a>ff from shaphaT, "to judge," but the usual Hebrew word is naqam, or derivatives, "to avenge."<P>The translation in the Revised Version (British and American) differs in some places from King James Version: <a onClick="return mV(\'Num\',31,3);">Nu 31:3</a> Revised Version (British and American) "execute Yahweh\'s vengeance"; (compare <a onClick="return mV(\'2Sa\',22,48);">2Sa 22:48</a>; <a onClick="return mV(\'Psa\',18,47);">Ps 18:47</a>; <a onClick="return mV(\'Lev\',26,25);">Le 26:25</a>); <a onClick="return mV(\'Lev\',19,18);">Le 19:18</a> Revised Version (British and American) "take vengeance"; <a onClick="return mV(\'Jdg\',5,2);">Jud 5:2</a> Revised Version (British and American) "for that the leaders took the lead in Israel" from para\', "to be free, to lead".<P>In the New Testament avenge is translated from the Greek ekdikeo, "to do justice," "to protect" (<a onClick="return mV(\'Luk\',18,3);">Lu 18:3</a>ff et al.) and the King James Version <a onClick="return mV(\'Rev\',18,20);">Re 18:20</a>, krino, "to judge" Revised Version (British and American) "God hath judged your judgment".<P>Avenger.—That is, the person who inflicts punishment upon the evil-doer for a wrong experienced by himself (from naqam, "to avenge"; <a onClick="return mV(\'Psa\',8,2);">Ps 8:2</a> et al.) or by someone else from ga\'al, "to redeem"; (<a onClick="return mV(\'Num\',35,12);">Nu 35:12</a>ff et al.). In the New Testament avenger occurs only once; "the Lord is an avenger in all things" (<a onClick="return mV(\'1Th\',4,6);">1Th 4:6</a>). It was the duty of the nearest relative to execute vengeance upon the murderer of his kin: he became the go\'el. With reference to the protective legislation and custom, see <a href="./study/isbe/search.html?string=GOEL">GOEL</a>. Compare <a href="./study/isbe/search.html?string=BLOOD">BLOOD</a>; <a href="./study/isbe/search.html?string=REVENGE;+Revenger">REVENGE; REVENGER</a>.``16';
isbe[977]='Averse`a-vurs\' shabh, "to turn back," ("retreat"): Quiet, peaceful wanderers (<a onClick="return mV(\'Mic\',2,8);">Mic 2:8</a>).``1';

isbe[979]='Avims`av\'-imz (<a onClick="return mV(\'Deu\',2,23);">De 2:23</a>).`<a href="./study/isbe/search.html?string=AVVIM">AVVIM</a>`1';
isbe[980]='Avites`a\'-vits.`<a href="./study/isbe/search.html?string=AVVIM">AVVIM</a>`1';
isbe[981]='Avith`a\'-vith \'awith: The royal city of Hadad king of Edom (<a onClick="return mV(\'Gen\',36,35);">Ge 36:35</a>; <a onClick="return mV(\'1Ch\',1,46);">1Ch 1:46</a>). The Septuagint reads Getthaim. There is no clue to its identification.``1';
isbe[982]='Avoid`a-void: Archaic use in <a onClick="return mV(\'1Sa\',18,11);">1Sa 18:11</a> for "escaped." In the Revised Version (British and American) of New Testament only in <a onClick="return mV(\'2Cr\',8,20);">2Co 8:20</a> stellomenoi (with negative), literally, "arranging that not," etc., i. e. by anticipation providing that something should not occur. In the King James Version for "turn away from," ekklinete: <a onClick="return mV(\'Rom\',16,17);">Ro 16:17</a>; <a onClick="return mV(\'1Ti\',6,20);">1Ti 6:20</a>; "refuse," paraitou, <a onClick="return mV(\'2Ti\',2,23);">2Ti 2:23</a>; periistaso, <a onClick="return mV(\'Tts\',3,9);">Tit 3:9</a>.``1';
isbe[983]='Avouch`a-vouch\': In English Versions of the Bible only in <a onClick="return mV(\'Deu\',26,17,18);">De 26:17-18</a>, in the sense of "to confess," "avow," "publicly and solemnly declare." The Hebrew form is likewise unique (Hiph. of \'amar).``1';
isbe[984]='Avvim; Avites`av\'-im a\'-vits \'awwim; Heuaioi, also unaspirated; (also used to represent the name of the Hivites): The early inhabitants of the southern extremity of Canaan afterward occupied by the Philistines (<a onClick="return mV(\'Deu\',2,23);">De 2:23</a>; compare <a onClick="return mV(\'Jos\',13,3,4);">Jos 13:3-4</a>, the King James Version "Avim," a\'-vim).<P>The Avvim of <a onClick="return mV(\'Jos\',18,23);">Jos 18:23</a> was a town of Benjamin, not a people. Gesenius supposes the name to mean "dwellers in the desert," but it was more probably the name of some pre-Sem tribe. The Avvim are described as living in Chatserim or "encampments" and extending as far as the outskirts of Gaza.``1';
isbe[985]='Awa`av\'-a \'awwa\'; the King James Version Ava, a\'-va: A province, the people of which Shalmaneser king of Assyria placed in the cities of Samaria in the room of the children of Israel taken into exile by him (<a onClick="return mV(\'2Ki\',17,24);">2Ki 17:24</a>). It is probably the same as Ivva (<a onClick="return mV(\'2Ki\',18,34);">2Ki 18:34</a>; <a onClick="return mV(\'2Ki\',19,13);">19:13</a>; <a onClick="return mV(\'Isa\',37,13);">Isa 37:13</a>), a province conquered by Assyria.``1';
isbe[986]='Await`a-wat\': Only in <a onClick="return mV(\'Act\',9,24);">Ac 9:24</a> the King James Version, in its now obsolete sense as a noun, "ambush": "their laying await was known of Saul." the Revised Version (British and American) "their plot."``1';
isbe[987]='Awake`a-wak\' yaqats, ("to waken"; \'ur, "to rouse up" from sleep; egeiro, "to arouse from sleep"): The ordinary terms for awaking from natural slumber: as of Jacob at Bethel (<a onClick="return mV(\'Gen\',28,16);">Ge 28:16</a>); of Solomon at Gibeon (<a onClick="return mV(\'1Ki\',3,15);">1Ki 3:15</a>); of Jesus in the storm-tossed boat (<a onClick="return mV(\'Luk\',8,24);">Lu 8:24</a>).<P>Used figure with striking effect of awaking from mental, moral and spiritual sleep: as when Deborah calls upon herself to awake to the fervor and eloquence of poetry (<a onClick="return mV(\'Jdg\',5,12);">Jud 5:12</a>); of Zion\'s awaking to moral vigor and beauty (<a onClick="return mV(\'Isa\',52,1);">Isa 52:1</a>); of waking from spiritual death (<a onClick="return mV(\'Eph\',5,14);">Eph 5:14</a>); from the grave in resurrection (<a onClick="return mV(\'Dan\',12,2);">Da 12:2</a>). Poetically used of the rising north wind (<a onClick="return mV(\'Sgs\',4,16);">So 4:16</a>); of music (<a onClick="return mV(\'Psa\',108,2);">Ps 108:2</a>); of the sword in battle (<a onClick="return mV(\'Zec\',13,7);">Zec 13:7</a>); of a lover\'s affection (<a onClick="return mV(\'Sgs\',2,7);">So 2:7</a>); of God Himself responding to prayer (<a onClick="return mV(\'Psa\',59,4);">Ps 59:4</a>). Also used of moral awaking, as from drunkenness: eknepho, "to become sober" (compare <a onClick="return mV(\'Joe\',1,5);">Joe 1:5</a>).``139';
isbe[988]='Away With`(1) "To endure," "to bear with" (<a onClick="return mV(\'Isa\',1,13);">Isa 1:13</a>), "I cannot away with iniquity and the solemn meeting," i. e. endure the combination of wickedness and worship. In the Hebrew merely, "I am unable iniquity and the solenm meeting."<P>(2) To destroy airo. Found in such expressions as <a onClick="return mV(\'Act\',22,22);">Ac 22:22</a>, "Away with such a fellow from the earth."``1';
isbe[989]='Awe`o: Fear mingled with reverence and wonder, a state of mind inspired by something terrible or sublime.<P>In the King James Version and the Revised Version (British and American) it occurs in <a onClick="return mV(\'Psa\',4,4);">Ps 4:4</a>: "Stand in awe, and sin not" (where the Revised Version, margin has, "Be ye angry," so Septuagint; compare <a onClick="return mV(\'Eph\',4,26);">Eph 4:26</a>); <a onClick="return mV(\'Psa\',33,8);">Ps 33:8</a>; <a onClick="return mV(\'Psa\',119,161);">119:161</a>. In the following passages the Revised Version (British and American) substitutes "stand in awe" for the King James Version "fear": <a onClick="return mV(\'Psa\',22,23);">Ps 22:23</a> phoboumenoi;<P><a onClick="return mV(\'Isa\',29,23);">Isa 29:23</a>; <a onClick="return mV(\'1Sa\',18,15);">1Sa 18:15</a>; <a onClick="return mV(\'Mal\',2,5);">Mal 2:5</a>; and in <a onClick="return mV(\'Hbr\',12,28);">Heb 12:28</a> it substitutes "awe" for the King James Version "reverence" (deos here only in New Testament). In all these passages, except <a onClick="return mV(\'1Sa\',18,15);">1Sa 18:15</a> (eulabeito, where it describes Saul\'s feeling toward David), the word stands for man\'s attitude of reverential fear toward God. This is the characteristic attitude of the pious soul toward God in the Scriptures, especially in the Old Testament. It arises from a consciousness of the infinite power, sublimity and holiness of God, which fills the mind with the "fear of the Lord," and a dread of violating His law.`<a href="./study/isbe/search.html?string=FEAR">FEAR</a>`49';
isbe[990]='Awl`ol martsea\': "Bore his ear through with an awl" (<a onClick="return mV(\'Exd\',21,6);">Ex 21:6</a>; <a onClick="return mV(\'Deu\',15,17);">De 15:17</a>). The ear was pierced as being the organ of hearing, thus signifying the servant\'s promise of obedience.`<a href="./study/isbe/search.html?string=BORE">BORE</a>`1';
isbe[991]='Ax (Axe); Ax-Head`aks; aks\'hed: Nine different Hebrew words have been rendered "ax":<P>(1) garzen. This unquestionably was one of the larger chopping instruments, as the uses to which it was put would imply (<a onClick="return mV(\'Deu\',19,5);">De 19:5</a>; <a onClick="return mV(\'Deu\',20,19);">20:19</a>; <a onClick="return mV(\'1Ki\',6,7);">1Ki 6:7</a>; <a onClick="return mV(\'Isa\',10,15);">Isa 10:15</a>). The modern ax used by the woodchoppers in Syria has a shape much like the ancient stone and bronze axes, with the exception that it is fastened to the handle by passing the latter through a hole in the ax-head, whereas the Egyptian sculptures show that their ax-heads were held to the handles by means of thongs. The so-called battle-ax found at Tell el-Chesy was probably fastened in this way. Syrian peasants are frequently seen carrying in their belts small hatchets the heads of which are shaped like a battle-ax and which are bound to the handles by thongs.<P>(2) ma\'atsar, is used in <a onClick="return mV(\'Isa\',44,12);">Isa 44:12</a> (King James Version renders "tongs") and in <a onClick="return mV(\'Jer\',10,3);">Jer 10:3</a>.<P>(3) qardom, is used in <a onClick="return mV(\'Jdg\',9,48);">Jud 9:48</a>; <a onClick="return mV(\'1Sa\',13,20,21);">1Sa 13:20-21</a>; <a onClick="return mV(\'Psa\',74,5);">Ps 74:5</a>; <a onClick="return mV(\'Jer\',46,22);">Jer 46:22</a>. The present Arabic word, qudum, which is the name for the native adze, is from the same origin. The adze is the only chopping instrument of the Syrian carpenter. He uses it for many purposes, where a foreigner would use a saw or chisel or plane, and with a skill which the foreigner envies. Many students of Syrian life believe that the adze is a tool which has survived from the early Hebrew times.<P>(4) barzel (<a onClick="return mV(\'Deu\',19,5);">De 19:5</a>; <a onClick="return mV(\'2Ki\',6,5);">2Ki 6:5</a>): The interest associated with this word is that it literally means "iron," although the context indicates that it means "ax." If the word iron was not used here to mean "metal," then iron axes were used by the children of Israel. If iron axes existed, however, they have long since disappeared as the result of corrosion, since the only ones discovered have been of stone, copper or bronze. See <a href="./study/isbe/search.html?string=METALS">METALS</a>.<P>(5) maghzirah (<a onClick="return mV(\'2Sa\',12,31);">2Sa 12:31</a>) is literally, "a cutting instrument," and might be rendered, "a blade" or sickle.<P>(6) megherah (<a onClick="return mV(\'1Ch\',20,2);">1Ch 20:2</a>), translated in this one passage as axes, but better translated "saws."<P>(7) cherebh (<a onClick="return mV(\'Eze\',26,9);">Eze 26:9</a>), rendered ax in this passage only. It is usually translated sword. It could also mean pick-axe.<P>(8) kashil (<a onClick="return mV(\'Psa\',74,6);">Ps 74:6</a> the King James Version), literally, "a feller," hence, an axe.<P>(9) mapets (<a onClick="return mV(\'Jer\',51,20);">Jer 51:20</a>), literally, "a smiter," hence, a war club or battle-axe. The Greek word used in the New Testament is axine (<a onClick="return mV(\'Mat\',3,10);">Mt 3:10</a>; <a onClick="return mV(\'Luk\',3,9);">Lu 3:9</a>).``133';
isbe[992]='Axle-Tree`ak\'-sil-tre.`<a href="./study/isbe/search.html?string=SEA+THE+MOLTEN">SEA, THE MOLTEN</a>`1';
isbe[993]='Ayin`a\'-yen: \'ayin, "eye" or "fountain": The 16th letter of the Hebrew alphabet, so named, probably, because the original form resembled the eye. \'Ayin (\') is usually neglected in pronunciation, and inverted comma (\') is the sign most commonly employed to represent it in transliteration.<P>The same sound is found in the Arabic and other Semitic languages. The Arabs have two pronunciations, one a very strong guttural formed at the back of the palate, something like a rattled "r" or "rg," the other similar in quality, only less harsh and guttural. The Septuagint reproduced the \'ayin (\') in some cases by the Greek letter gamma (g). The numerical value of this letter is 70. An \'ayin (\') begins each verse of the 16th section of <a onClick="return mV(\'Psa\',119,\'1-\');">Ps 119</a> in the Hebrew.``34';
isbe[994]='Azael`az\'-a-el Azaelos; compare Asahel [<a onClick="return mV(\'Ezr\',10,15);">Ezr 10:15</a>]: Father of Jonathan, one of two chief investigators of foreign marriages (1Esdras 9:14).``1';
isbe[995]='Azaelus`az-a-e\'-lus (B, Azaelos; A, Azael; omitted in <a onClick="return mV(\'Ezr\',10,\'1-\');">Ezr 10</a>): Azaelus, son of Ezora, put away his "strange wife" (1Esdras 9:34).``1';
isbe[996]='Azal`a\'-zal.`<a href="./study/isbe/search.html?string=AZEL">AZEL</a>`1';
isbe[997]='Azaliah`az-a-li\'-a atsalyahu, ("Yahweh has set aside"): A son of Meshullam and father of Shaphan the scribe, famous in connection with the discovery of the law in the reign of King Josiah (<a onClick="return mV(\'2Ki\',22,3);">2Ki 22:3</a>).``1';
isbe[998]='Azaniah`az-a-ni\'-a \'azanyah, ("Yahweh has given ear"): A son of Jeshua, a Levite who signed the covenant (<a onClick="return mV(\'Neh\',10,9);">Ne 10:9</a>).``1';
isbe[999]='Azaphion`a-za\'-fi-on.`<a href="./study/isbe/search.html?string=ASSAPHIOTH">ASSAPHIOTH</a>`1';
isbe[1000]='Azara`az\'-a-ra.`<a href="./study/isbe/search.html?string=ASARA">ASARA</a>`1';
