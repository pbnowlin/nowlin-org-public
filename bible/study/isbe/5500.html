hered round the Logia—as many as fifty publications relating to A only in the first few months—only a few can be mentioned here. A was first published in 1897 as a pamphlet and afterward as <span class="noTag">Number 1</span> of Oxyrhynchus Papyri. Valuable articles by Cross and Harnack peared in The Expositor, series V, volume VI, 257ff, 321ff, 401ff, an important lecture by Swete in The Expository Times, VIII, 544ff,568,and a very useful pamphlet by Sanday and Lock in the same year. B appeared in 1904 in pamphlet form and as Number 654 of the Oxyrhynchus Papyri, with a fuller commentary. Dr. C. Taylor\'s pamphlets on A and B issued respectively in 1899 and 1905, and Swete\'s lecture on B, The Expositor T, XV, 488ff, are of exceptional significance for the study of the subject. Compare also Griffinhoofe, The Unwritten Sayings of Christ (A only), 55-67; Klostermann, Kleine Texte, <span class="noTag">Numbers 8</span>, pp. 11f and 11, pp. 17ff; Resch, Agrapha2, 68-73, 353f; HDB, article "Agrapha," extra vol; also articles on "Unwritten Sayings" in HDB, 1909, and DCG.``162';
isbe[5570]='Logos`log\'-os (logos):<P><b>I. GREEK SPECULATION</b><P class="in15">1. Heraclitus<P class="in15">2. Anaxagoras<P class="in15">3. Plato<P class="in15">4. Aristotle<P class="in15">5. Stoics<P><b>II. HEBREW ANTICIPATION OF DOCTRINE</b><P class="in15">1. Word as Revelation of God<P class="in15">2. Suggestions of Personal Distinctions in Deity<P class="in15">3. Theophanies<P class="in15">4. Wisdom<P class="in15">5. Targums<P><b>III. ALEXANDRIAN SYNTHESIS</b><P class="in15">Philo<P><b>IV. CHRISTIAN REALIZATION</b><P class="in15">1. Pauline Doctrine<P class="in15">2. Doctrine in Hebrews<P class="in15">3. Doctrine in Fourth Gospel<P class="in30">(1) Content of Doctrine<P class="in45">(a) Relation of Logos to God<P class="in45">(b) Relation of Logos to World<P class="in30">(2) Origin of Terminology<P class="in45">(a) Hebrew Source<P class="in45">(b) Hellenic Source<P class="in45">(c) Contrast between Philo and John<P><b>V. PATRISTIC DEVELOPMENT</b><P><b>LITERATURE</b><hr /><P>The doctrine of the Logos has exerted a decisive and far-reaching influence upon speculative and Christian thought. The word has a long history, and the evolution of the idea it embodies is really the unfolding of man\'s conception of God. To comprehend the relation of the Deity to the world has been the aim of all religious philosophy. While widely divergent views as to the Divine manifestation have been conceived, from the dawn of Western speculation, the Greek word logos has been employed with a certain degree of uniformity by a series of thinkers to express and define the nature and mode of God\'s revelation.<P>Logos signifies in classical Greek both "reason" and "word." Though in Biblical Greek the term is mostly employed in the sense of "word," we cannot properly dissociate the two significations. Every word implies a thought. It is impossible to imagine a time when God was without thought. Hence, thought must be eternal as the Deity. The translation "thought" is probably the best equivalent for the Greek term, since it denotes, on the one hand, the faculty of reason, or the thought inwardly conceived in the mind; and, on the other hand, the thought outwardly expressed through the vehicle of language. The two ideas, thought and speech, are indubitably blended in the term logos; and in every employment of the word, in philosophy and Scripture, both notions of thought and its outward expression are intimately connected.<P>In this article it will be our aim to trace the evolution of the doctrine from its earliest appearance in Greek philosophy through its Hebrew and Alexandrian phases till it attained its richest expression in the writings of the New Testament, and especially in the Fourth Gospel.<P>The doctrine may be said to have two stages: a Hellenistic and a Hebrew; or, more correctly, a pre-Christian and a Christian. The theory of Philo and of the Alexandrian thinkers generally may be regarded as the connecting link between the Greek and the Christian forms of the doctrine. The Greek or pre-Christian speculation on the subject is marked by the names of Heraclitus, Plato and the Stoics. Philo paves the way for the Christian doctrine of Paul, Hebrews and the Johannine Gospel.<P>I. Greek Speculation.<P>The earliest speculations of the Greeks were occupied with the world of Nature, and the first attempts at philosophy take the shape of a search for some unitary principle to explain the diversity of the universe.<P>1. Heraclitus:<P>Heraclitus was practically the first who sought to account for the order which existed in a world of change by a law or ruling principle. This profoundest of Greek philosophers saw everything in a condition of flux. Everything is forever passing into something else and has an existence only in relation to this process. We cannot say things are: they come into being and pass away. To account for this state of perpetual becoming, Heraclitus was led to seek out a new and primary element from which all things take their rise. This substance he conceived to be, not water or air as previous thinkers had conjectured, but something more subtle, mysterious and potent—fire. This restless, all-consuming and yet all-transforming activity—now darting upward as a flame, now sinking to an ember and now vanishing as smoke—is for him at once the symbol and essence of life. But it is no arbitrary or lawless element. If there is flux everywhere, all change must take place according to "measure." Reality is an "attunement" of opposites, a tension or harmony of conflicting elements. Heraclitus saw all the mutations of being governed by a rational and unalterable law. This law he calls sometimes "Justice," sometimes "Harmony"; more frequently "Logos" or "Reason," and in two passages at least, "God." Fire, Logos, God are fundamentally the same. It is the eternal energy of the universe pervading all its substance and preserving in unity and harmony the perpetual drift and evolution of phenomenal existence. Though Heraclitus sometimes calls this rational principle God, it is not probable that he attached to it any definite idea of consciousness. The Logos is not above the world or even prior to it. It is in it, its inner pervasive energy sustaining, relating and harmonizing its endless variety.<P>2. Anaxagoras:<P>Little was done by the immediate successors of Heraclitus to develop the doctrine of the Logos, and as the distinction between mind and matter became more defined, the term nous superseded that of Logos as the rational force of the world. Anaxagoras was the first thinker who introduced the idea of a supreme intellectual principle which, while independent of the world, governed it. His conception of the nous or "mind" is, however, vague and confused, hardly distinguishable from corporeal matter. By the artificial introduction of a power acting externally upon the world, a dualism, which continued throughout Greek philosophy, was created. At the same time it is to the merit of Anaxagoras that he was the first to perceive some kind of distinction between mind and matter and to suggest a teleological explanation of the universe.<P>3. Plato:<P>In Plato the idea of a regulative principle reappears. But though the word is frequently used, it is nous and not Logos which determines his conception of the relation of God and the world. The special doctrine of the Logos does not find definite expression, except perhaps in the Timaeus, where the word is employed as descriptive of the Divine force from which the world has arisen. But if the word does not frequently occur in the dialogues, there is not wanting a basis upon which a Logos-doctrine might be framed; and the conception of archetypal ideas affords a philosophical expression of the relation of God and the world. The idea of a dominating principle of reason was lifted to a higher plane by the distinction which Plato made between the world of sense and the world of thought, to the latter of which God belonged. According to Plato, true reality or absolute being consisted of the "Ideas" which he conceived as thoughts residing in the Divine mind before the creation of the world. To these abstract concepts was ascribed the character of supersensible realities of which in some way the concrete visible things of the world were copies or images. Compared with the "Ideas," the world of things was a world of shadows. This was the aspect of the Platonic doctrine of ideas which, as we shall see, Philo afterward seized upon, because it best fitted in with his general conception of the transcendence of God and His relation to the visible world. Three features of Plato\'s view ought to be remembered as having a special significance for our subject:<P>(1) While God is regarded by Plato as the intelligent power by which the world is formed, matter itself is conceived by him as in some sense eternal and partly intractable.<P>(2) While in the Philebus Plato employs the expression, "the regal principle of intelligence in the nature of God" nous basilikos en te tou Dios phusei), it is doubtful if reason was endowed with personality or was anything more than an attribute of the Divine mind.<P>(3) The ideas are merely models or archetypes after which creation is fashioned.<P>4. Aristotle:<P>The doctrine of the Logos cannot be said to occupy a distinctive place in the teaching of Aristotle, though the word does occur in a variety of senses (e.g. orthos logos, "right insight," the faculty by which the will is trained to proper action). Aristotle sought to solve the fundamental problem of Greek philosophy as to how behind the changing multiplicity of appearances an abiding Being is to be thought by means of the concept of development. Plato had regarded the "ideas" as the causes of phenomena—causes different from the objects themselves. Aristotle endeavored to overcome the duality of Plato by representing reality as the essence which contains within itself potentially the phenomena, and unfolds into the particular manifestations of the sensible world. This conception has exerted a powerful influence upon subsequent thought, and particularly upon the monotheistic view of the world. At the same time in working it out, the ultimate "prime-mover" of Aristotle was not materially different from the idea of "the Good" of Plato. And inasmuch as God was conceived as pure thought existing apart from the world in eternal blessedness, Aristotle did not succeed in resolving the duality of God and the universe which exercised the Greek mind.<P>5. Stoics:<P>It is to the Stoics we must look for the first systematic exposition of the doctrine of the Logos. It is the key to their interpretation of life, both in the realms of Nature and of duty. Interested more in ethical than physical problems, they were compelled to seek general metaphysical basis for a rational moral life. Some unitary idea must be found which will overcome the duality between God and the world and remove the opposition between the sensuous and supersensuous which Plato and Aristotle had failed to reconcile. For this end the Logos-doctrine of Heraclitus seemed to present itself as the most satisfactory solution of the problem. The fundamental thought of the Stoics consequently is that the entire universe forms a single living connected whole and that all particulars are the determinate forms assumed by the primitive power which they conceived as never-resting, all-pervading fire. This eternal activity or Divine world-power which contains within itself the conditions and processes of all things, they call Logos or God. More particularly as the productive power, the Deity is named the logos spermatikos, the Seminal Logos or generative principle of the world. This vital energy not only pervades the universe, but unfolds itself into innumerable logoi spermatikoi or formative forces which energize the manifold phenomena of Nature and life. This subordination of all particulars to the Logos not only constitutes the rational order of the universe but supplies a norm of duty for the regulation of the activities of life. Hence, in the moral sphere "to live according to Nature" is the all-determining law of conduct.<P>II. Hebrew Anticipation of Doctrine.<P>So far we have traced the development of the Logos-doctrine in Greek philosophy. We have now to note a parallel movement in Hebrew thought. Though strictly speaking it is incorrect to separate the inner Reason from the outer expression in the term Logos, still in the Hellenistic usage the doctrine was substantially a doctrine of Reason, while in Jewish literature it was more especially the outward expression or word that was emphasized.<P>1. Word as Revelation of God:<P>The sources of this conception are to be found in the Old Testament and in the post-canonical literature. The God who is made known in Scripture is regarded as one who actively reveals Himself. He is exhibited therefore as making His will known in and by His spoken utterances. The "Word of God" is presented as the creative principle (<a onClick="return mV(\'Gen\',1,3);">Ge 1:3</a>; <a onClick="return mV(\'Psa\',33,6);">Ps 33:6</a>); as instrument of judgment (<a onClick="return mV(\'Hsa\',6,5);">Ho 6:5</a>); as agent of healing (<a onClick="return mV(\'Psa\',107,20);">Ps 107:20</a>); and generally as possessor of personal qualities (<a onClick="return mV(\'Isa\',55,2);">Isa 55:2</a>; <a onClick="return mV(\'Psa\',147,15);">Ps 147:15</a>). Revelation is frequently called the "Word of the Lord," signifying the spoken as distinct from the written word.<P>2. Suggestions of Personal Distinctions in Deity:<P>In particular, we may note certain adumbrations of distinction of persons within the Being of God. It is contended that the phrase "Let us make" in Genesis points to a plurality of persons in the God-head. This indefinite language of Genesis is more fully explained by the priestly ritual in Numbers (<a onClick="return mV(\'Num\',5,\'23-26\');">6:23-26</A>) and in the Psalter. In Jeremiah, Ezra and the vision of Isaiah (<a onClick="return mV(\'Isa\',6,\'2-8\');">6:2-8</a>) the same idea of Divine plurality is implied, showing that the Old Testament presents a doctrine of God far removed from the sterile monotheism of the Koran (compare Liddon, Divinity of our Lord, and Konig).<P>3. Theophanies:<P>Passing from these indefinite intimations of personal distinction in the inner life of God, we may mention first that series of remarkable apparitions commonly known as the theophanies of the Old Testament. These representations are described as the "Angel of Yahweh" or of "the Covenant"; or as the "Angel of his presence." This angelic appearance is sometimes identified with Yahweh (<a onClick="return mV(\'Gen\',16,11,13);">Ge 16:11,13</a>; <a onClick="return mV(\'Gen\',32,\'29-31\');">32:29-31</a>; <a onClick="return mV(\'Exd\',3,2);">Ex 3:2</a>; <a onClick="return mV(\'Exd\',13,21);">13:21</a>), sometimes distinguished from Him (<a onClick="return mV(\'Gen\',22,15);">Ge 22:15</a>; <a onClick="return mV(\'Gen\',24,7);">24:7</a>); sometimes presented in both aspects (<a onClick="return mV(\'Exd\',3,6);">Ex 3:6</a>; <a onClick="return mV(\'Zec\',1,11);">Zec 1:11</a>). We find God revealing Himself in this way to Abraham, Sarah, Lot, Hagar, Jacob, Moses, Joshua, Gideon, Manoah. Who was this angel? The earliest Fathers reply with general unanimity that He was the "Word" or "Son of God." But while the earlier church teachers distinguished between the "Angel of the Lord" and the Father, the Arians sought to widen the distinction into a difference of natures, since an invisible Being must be higher than one cognizable by the senses. Augustine insists upon the Scriptural truth of the invisibility of God as God, the Son not less than the Father. He will not presume, however, to say which of the Divine persons manifested Himself in this or that instance; and his general doctrine, in which he has been followed by most of the later teachers of the church, is that theophanies were not direct appearances of a Person of the Godhead, but self-manifestations of God through a created being.<P>4. Wisdom:<P>A further development of the conception of a personal medium of revelation is discernible in the description of Wisdom as given in some of the later books of the Old Testament. The wisdom of Jewish Scripture is more than a human endowment or even an attribute of God, and may be said to attain almost to a personal reflex of the Deity, reminding us of the archetypal ideas of Plato. In Job, wisdom is represented as existent in God and as communicated in its highest form to man. It is the eternal thought in which the Divine Architect ever beholds His future creation (<a onClick="return mV(\'Job\',28,\'23-27\');">Job 28:23-27</a>). If in Job wisdom is revealed only as underlying the laws of the universe and not as wholly personal, in the Book of Proverbs it is coeternal with Yahweh and assists Him in creation (<a onClick="return mV(\'Pro\',8,\'22-31\');">Pr 8:22-31</a>). It may be doubtful whether this is the language of a real person or only of a poetic personification. But something more than a personified idea may be inferred from the contents of the sapiential books outside the Canon. Sirach represents Wisdom as existing from all eternity with God. In Baruch, and still more in Wisdom, the Sophia is distinctly personal—"the very image of the goodness of God." In this pseudo-Solomonic book, supposed to be the work of an Alexandrian writer before Philo, the influence of Greek thought is traceable. The writer speaks of God\'s Word (me\'mera\') as His agent in creation and judgment.<P>5. Targums:<P>Finally in the Targums, which were popular interpretations or paraphrases of the Old Testament Scripture, there was a tendency to avoid anthropomorphic terms or such expressions as involved a too internal conception of God\'s nature and manifestation. Here the three doctrines of the Word, the Angel, and Wisdom are introduced as mediating factors between God and the world. In particular the chasm between the Divine and human is bridged over by the use of such terms as me\'mera\' ("word") and shekhinah ("glory"). The me\'mera proceeds from God, and is His messenger in Nature and history. But it is significant that though the use of this expression implied the felt need of a Mediator, the Word does not seem to have been actually identified with the Messiah.<P>III. Alexandrian Synthesis.<P>We have seen that according to Greek thought the Logos was conceived as a rational principle or impersonal energy by means of which the world was fashioned and ordered, while according to Hebrew thought the Logos was regarded rather as a mediating agent or personal organ of the Divine Being. The Hellenistic doctrine, in other words, was chiefly a doctrine of the Logos as Reason; the Jewish, a doctrine of the Logos as Word.<P>Philo:<P>In the philosophy of Alexandria, of which Philo was an illustrious exponent, the two phases were combined, and Hellenistic speculation was united with Hebrew tradition for the purpose of showing that the Old Testament taught the true philosophy and embodied all that was highest in Greek reflection. In Philo the two streams meet and flow henceforth in a common bed. The all-pervading Energy of Heraclitus, the archetypal Ideas of Plato, the purposive Reason of Aristotle, the immanent Order of the Stoics are taken up and fused with the Jewish conception of Yahweh who, while transcending all finite existences, is revealed through His intermediatory Word. As the result of this Philonic synthesis, an entirely new idea of God is formulated. While Philo admits the eternity of matter, he rejects the Greek view that the world is eternal, since it denies the creative activity and providence of God. At the same time he separates Divine energy from its manifestations in the world, and is therefore compelled to connect the one with the other by the interposition of subordinate Powers. These Divine forces are the embodiment of the ideai, of Plato and the aggeloi, of the Old Testament. The double meaning of Logos—thought and speech—is made use of by Philo to explain the relation subsisting between the ideal world existing only in the mind of God and the sensible universe which is its visible embodiment. He distinguishes, therefore, between the Logos inherent in God (logos endiathetos), corresponding to reason in man, and the Logos which emanates from God (logos prophorikos), corresponding to the spoken Word as the revelation of thought. Though in His inner essence God is incomprehensible by any but Himself, He has created the intelligible cosmos by His self-activity. The Word is therefore in Philo the rational order manifested in the visible world.<P>Some special features of the Philonic Logos may be noted:<P>(1) It is distinguished from God as the instrument from the Cause.<P>(2) As instrument by which God makes the world, it is in its nature intermediate between God and man.<P>(3) As the expressed thought of God and the rational principle of the visible world, the Logos is "the Eldest or Firstborn Son of God." It is the "bond" (desmos) holding together all things (De Mundi, i.592), the law which determines the order of the universe and guides the destinies of men and nations (same place). Sometimes Philo calls it the "Man of God": or the "Heavenly man," the immortal father of all noble men; sometimes he calls it "the Second God," "the Image of God."<P>(4) From this it follows that the Logos must be the Mediator between God and man, the "Intercessor" (hiketes) or "High Priest," who is the ambassador from heaven and interprets God to man. Philo almost exhausts the vocabulary of Hebrew metaphor in describing the Logos. It is "manna," "bread from heaven," "the living stream," the "sword" of Paradise, the guiding "cloud," the "rock" in the wilderness.<P>These various expressions, closely resembling the New Testament descriptions of Christ, lead us to ask: Is Philo\'s Logos a personal being or a pure abstraction? Philo himself seems to waver in his answer, and the Greek and the Jew in him are hopelessly at issue. That he personifies the Logos is implied in the figures he uses; but to maintain its personality would have been inconsistent with Philo\'s whole view of God and the world. His Jewish faith inclines him to speak of the Logos as personal, while his Greek culture disposes him to an impersonal interpretation. Confronted with this alternative, the Alexandrian wavers in indecision. After all has been said, his Logos really resolves itself into a group of Divine ideas, and is conceived, not as a distinct person, but as the thought of God which is expressed in the rational order of the visible universe.<P>In the speculations of Philo, whose thought is so frequently couched in Biblical language, we have the gropings of a sincere mind after a truth which was disclosed in its fullness only by the revelation of Pentecost. In Philo, Greek philosophy, as has been said, "stood almost at the door of the Christian church." But if the Alexandrian thinker could not create the Christian doctrine, he unconsciously prepared the soil for its acceptance. In this sense his Logos-doctrine has a real value in the evolution of Christian thought. Philo was not, indeed, the master of the apostles, but even if he did nothing more than call forth their antagonism, he helped indirectly to determine the doctrine of Christendom.<P>IV. Christian Realization.<P>We pass now to consider the import of the term in the New Testament. Here it signifies usually "utterance," "speech" or "narrative." In reference to God it is used sometimes for a special utterance, or for revelation in general, and even for the medium of revelation—Holy Scripture. In the prologue of the Fourth Gospel it is identified with the personal Christ; and it is this employment of the term in the light of its past history which creates the interest of the problem of the New Testament doctrine.<P>1. Pauline Doctrine:<P>The author of the Fourth Gospel is not, however, the first New Testament writer who represents Jesus as the Logos. Though Paul does not actually use the word in this connection, he has anticipated the Johannine conception. Christ is represented by Paul as before His advent living a life with God in heaven (<a onClick="return mV(\'Gal\',4,4);">Ga 4:4</a>; <a onClick="return mV(\'Rom\',10,6);">Ro 10:6</a>). He is conceived as one in whose image earthly beings, and especially men, were made (<a onClick="return mV(\'1Cr\',11,7);">1Co 11:7</a>; <a onClick="return mV(\'1Cr\',15,\'45-49\');">15:45-49</a>); and even as participating in the creation (<a onClick="return mV(\'1Cr\',8,6);">1Co 8:6</a>). In virtue of His distinct being He is called God\'s "own Son" (<a onClick="return mV(\'Rom\',8,32);">Ro 8:32</a>).<P>Whether Paul was actually conversant with the writings of Philo is disputed (compare Pfleider, Urchristentum), but already when he wrote to the Colossians and Ephesians the influence of Alexandrian speculation was being felt in the church. Incipient Gnosticism, which was an attempt to correlate Christianity with the order of the universe as a whole, was current. Most noticeable are the pointed allusions to Gnostic watchwords in <a onClick="return mV(\'Eph\',3,19);">Eph 3:19</a> ("fullness of God") and in <a onClick="return mV(\'Col\',2,3);">Col 2:3</a> ("Christ, in whom are all the treasures of wisdom and knowledge hidden"), where Paul shows that everything sought for in the doctrine of the Pleroma is really given in Christ. The chief object of these epistles is to assert the unique dignity and absolute power of the Person of Christ. He is not merely one of the Eons which make up the Pleroma, as Gnostic teachers affirm, but a real and personal Being in whom all the fullness of the Godhead dwells. He is not merely an inferior workman creating glory for a higher Master. He creates for Himself. He is the end as well as the source of all created. things (<a onClick="return mV(\'Col\',1,\'15-20\');">Col 1:15-20</a>). Though throughout this epistle the word "Logos" is never introduced, it is plain that the eikon, of Paul is equivalent in rank and function to the Logos of John. Each exists prior to creation, each is equal to God, shares His life and cooperates in His work.<P>2. Doctrine in Hebrews:<P>In the Epistle to the Hebrews we have an equally explicit, if not fuller, declaration of the eternal Deity of Christ. Whatever may be said of Paul there can be little doubt that the author of He was familiar with the Philonic writings. Who this writer was we do not know; but his Philonism suggests that he may have been an Alexandrian Jew, possibly even a disciple of Philo. In language seemingly adapted from that source ("Son of God," "Firstborn," "above angels," "Image of God," "Agent in Creation," "Mediator," "Great High Priest" "Melchizedek") the author of He sneaks of Christ as a reflection of the majesty and imprint of the nature of God, just as in a seal the impression resembles the stamp. The dignity of His title indicates His essential rank. He is expressly dressed as God; and the expression "the effulgence of his glory" (the Revised Version (British and American) apaugasma) implies that He is one with God (<a onClick="return mV(\'Hbr\',1,3);">Heb 1:3</a>). By Him the worlds have been made, and all things are upheld by the fiat of His word (<a onClick="return mV(\'Hbr\',1,3);">Heb 1:3</a>). In the name He bears, in the honors ascribed to Him, in His superiority to angels, in His relationship as Creator both to heaven and earth (<a onClick="return mV(\'Hbr\',1,10);">Heb 1:10</a>), we recognize (in language which in the letter of it strongly reminds us of Philo, yet in its spirit is so different) the description of one who though clothed with human nature is no mere subordinate being, but the possessor of all Divine prerogatives and the sharer of the very nature of God Himself.<P>3. Doctrine in the Fourth Gospel:<P>In the Fourth Gospel the teaching of Paul and the author of He finds its completest expression. "The letter to the He stands in a sense half-way between Pauline and Johannine teaching" (Weizsacker, Apostolic Age, V, 11). It is, however, too much to say that these three writers represent the successive stages of single line of development. While all agree in emphasizing the fact of Christ\'s Divine personality and eternal being, Paul represents rather the religious interest, the Epistle to the Hebrews the philosophical. In the Johannine Christology the two elements are united.<P>In discussing the Johannine doctrine of the Logos we shall Speak first of its content and secondly of its terminology.<P>(1) Content of Doctrine.<P>The evangelist uses "Logos" 6 times as a designation of the Divine preexistent person of Christ (<a onClick="return mV(\'Jhn\',1,1,14);">Joh 1:1,14</a>; <a onClick="return mV(\'1Jo\',1,1);">1Joh 1:1</a>; <a onClick="return mV(\'Rev\',19,13);">Re 19:13</a>), but he never puts it into the mouth of Christ. The idea which John sought to convey by this term was not essentially different from the conception of Christ as presented by Paul. But the use of the word gave a precision and emphasis to the being of Christ which the writer must have felt was especially needed by the class of readers for whom his Gospel was intended. The Logos with whom the Fourth Gospel starts is a Person. Readers of the Synoptics had long been familiar with the term "Word of God" as equivalent to the Gospel; but the essential purport of John\'s Word is Jesus Himself, His Person. We have here an essential change of meaning. The two applications are indeed connected; but the conception of the perfect revelation of God in the Gospel passes into that of the perfect revelation of the Divine nature in general (compare Weizsacker, Apostolic Age, V, ii, 320).<P>In the prologue (which, however, must not be regarded as independent of, or having no integral connection with, the rest of the book) there is stated: (a) the relation of the Logos to God; and (b) the relation of the Logos to the world.<P>(a) Relation of Logos to God:<P>Here the author makes three distinct affirmations:<P>(i) "In the beginning was the Word."<P>The evangelist carries back his history of our Lord to a point prior to all temporal things. Nothing is said of the origin of the world. As in <a onClick="return mV(\'Gen\',1,1);">Ge 1:1</a>, so here there is only implied that the Logos was existent when the world began to be. When as yet nothing was, the Logos was. Though the eternal preexistence of the Word is not actually stated, it is implied.<P>(ii) "The Word was with God."<P>Here His personal existence is more specifically defined. He stands distinct from, yet in eternal fellowship with, God. The preposition pros (bei, Luther) expresses beyond the fact of coexistence that of perpetual intercommunion. John would guard against the idea of mere self-contemplation on the one hand, and entire independence on the other. It is union, not fusion.<P>(iii) "The Word was God."<P>He is not merely related eternally, but actually identical in essence with God. The notion of inferiority is emphatically excluded and the true Deity of the Word affirmed. In these three propositions we ascend from His eternal existence to His distinct personality and thence to His substantial Godhead. All that God is the Logos is. Identity, difference, communion are the three phases of the Divine relationship.<P>(b) Relation of Logos to the World:<P>The Logos is word as well as thought, and therefore there is suggested the further idea of communicativeness. Of this self-communication the evangelist mentions two phases—creation and revelation. The Word unveils Himself through the mediation of objects of sense and also manifests Himself directly. Hence, in this section of the prologue (<a onClick="return mV(\'Jhn\',1,\'3-5\');">Joh 1:3-5</a>) a threefold division also occurs.<P>(i) He is the Creator of the visible universe. "All things were made through him"—a phrase which describes the Logos as the organ of the entire creative activity of God and excludes the idea favored by Plato and Philo that God was only the architect who molded into cosmos previously existing matter. The term egeneto ("becomes," werden), implies the successive evolution of the world, a statement not inconsistent with the modern theory of development.<P>(ii) The Logos is also the source of the intellectual, moral and spiritual life of man. "In him was life; and the life was the light of men." He is the light as well as the life—the fountain of all the manifold forms of being and thought in and by whom all created things subsist, and from whom all derive illumination (compare <a onClick="return mV(\'1Jo\',1,\'1-3\');">1Joh 1:1-3</a>; also <a onClick="return mV(\'Col\',1,17);">Col 1:17</a>). But inasmuch as the higher phases of intelligent life involve freedom, the Divine Light, though perfect and undiminished in itself, was not comprehended by a world which chose darkness rather than light (<a onClick="return mV(\'Jhn\',1,5,11);">Joh 1:5,11</a>).<P>(iii) The climax of Divine revelation is expressed in the statement, The Word became flesh," which implies on the one hand the reality of Christ\'s humanity, and, on the other, the voluntariness of His incarnation, but excludes the notion that in becoming man the Logos ceased to be God. Though clothed in flesh, the Logos continues to be the self-manifesting God, and retains, even in human form, the character of the Eternal One. In this third phase is embodied the highest manifestation of the Godhead. In physical creation the power of God is revealed. In the bestowal of light to mankind His wisdom is chiefly manifested. But in the third especially is His love unveiled. All the perfections of the Deity are focused and made visible in Christ—the "glory as of the only begotten from the Father, full of grace and truth" (<a onClick="return mV(\'Jhn\',1,14);">Joh 1:14</a>).<P>Thus the Word reveals the Divine essence. The incarnation makes the life, the light and the love which are eternally present in God manifest to men. As they meet in God, so they meet in Christ. This is the glory which the disciples beheld; the truth to which the Baptist bore witness (<a onClick="return mV(\'Jhn\',1,7);">Joh 1:7</a>); the fullness whereof His apostles received (<a onClick="return mV(\'Jhn\',1,16);">Joh 1:16</a>); the entire body of grace and truth by which the Word gives to men the power to become the sons of God.<P>There is implied throughout that the Word is the Son. Each of these expressions taken separately have led and may lead to error. But combined they correct possible misuse. On the one hand, their union protects us from considering the Logos as a mere abstract impersonal quality; and, on the other, saves us from imparting to the Son a lower state or more recent origin than the Father. Each term supplements and protects the other. Taken together they present Christ before His incarnation as at once personally distinct from, yet equal with, the Father—as the eternal life which was with God and was manifested to us.<P>(2) Origin of Terminology.<P>We have now to ask whence the author of the Fourth Gospel derived the phraseology employed to set forth his Christology. It will be well, however, to distinguish between the source of the doctrine itself and the source of the language. For it is possible that Alexandrian philosophy might have suggested the linguistic medium, while the doctrine itself had another origin. Writers like Reuss, Keim, Holtzmann, Weizsacker, Schmiedel, etc., who contend for the Alexandrian derivation of the prologue, are apt to overlook two considerations regarding the Johannine doctrine:<P>(1) There is no essential difference between the teaching of John and that of the other apostolic writers; and even when the word "Logos" is not used, as in Paul\'s case, the view of Christ\'s person is virtually that which we find in the Fourth Gospel.<P>(2) The writer himself affirms that his knowledge of Christ was not borrowed from others, but was derived from personal fellowship with Jesus Himself. "We beheld his glory, glory as of the only begotten." This is John\'s summary and witness upon which he proceeds to base the vivid memories of Jesus which follow. The Johannine doctrine is not to be regarded merely as a philosophical account of the nature of God and His creation of the world, but rather as the statement of a belief which already existed in the Christian church and which received fresh testimony and assurance from the evangelist\'s own personal experience.<P>But the question may still be asked: Even if it was no novel doctrine which John declared, what led him to adopt the language of the Logos, a word which had not been employed in this connection by previous Christian writers, but which was prevalent in the philosophical vocabulary of the age? It would be inconceivable that the apostle lighted upon this word by chance or that he selected it without any previous knowledge of its history and value. It may be assumed that when he speaks of the "Word" in relation to God and the world, he employs a mode of speech which was already familiar to those for whom he wrote and of whose general import he himself was well aware.<P>The truth that Jesus of Nazareth was the Christ was borne in upon John. The problem which confronted him was how he could make that truth real to his contemporaries. This he sought to do by using the language of the highest religious thought of his day.<P>We have seen that the term "Logos" had undergone a twofold and to some extent parallel evolution. On the one hand, it had a Hebrew and, on the other, a Hellenic history. In which direction are we to look for the immediate source of the Johannine terminology?<P>(a) Hebrew Source:<P>As a Palestinian Jew familiar with current Jewish ideas and forms of devout expression, it would be natural for him to adopt a word, or its Greek equivalent, which played so important a part in shaping and expressing the religious beliefs of the Old Testament people. Many scholars consider that we have here the probable source of Johannine language. In the Old Testament, and particularly, in the Targums or Jewish paraphrases, the "Word" is constantly spoken of as the efficient instrument of Divine action; and the "Word of God" had come to be used in a personal way as almost identical with God Himself. In <a onClick="return mV(\'Rev\',19,13);">Re 19:13</a>, we have obviously an adoption of this Hebrew use of the phrase. Throughout the Gospel there is evinced a decided familiarity and sympathy with the Old Testament teaching, and some expressions would seem to indicate the evangelist\'s desire to show that Jesus is the fulfillment of Jewish expectation (e.g. <a onClick="return mV(\'Jhn\',1,14,29,31);">Joh 1:14,29,31</a>; <a onClick="return mV(\'Jhn\',2,19);">2:19</a>; <a onClick="return mV(\'Jhn\',3,14);">3:14</a>; <a onClick="return mV(\'Jhn\',6,32);">6:32</a>,<a onClick="return mV(\'Jhn\',6,\'48-50\');">48-50</a>), and the living embodiment of Israelite truth (<a onClick="return mV(\'Jhn\',1,16);">Joh 1:16</a>; <a onClick="return mV(\'Jhn\',8,12);">8:12</a>; <a onClick="return mV(\'Jhn\',11,25);">11:25</a>; <a onClick="return mV(\'Jhn\',14,6);">14:6</a>). But as against this it has been pointed out by Weizsacker (Apostolisches Zeitalter) that the Word of God is not conceived in the Old Testament as an independent Being, still less as equivalent for the Messiah, and that the rabbinical doctrine which identifies the memra with God is of much later date.<P>At the same time the Hebrew cast of thought of the Johannine Gospel and its affinities with Jewish rather than Hellenic modes of expression can hardly be gainsaid. Though John\'s knowledge of and sympathy with Palestinian religion may not actually account for his use of the term "Logos," it may have largely colored and directed his special application of it. For, as Neander observes, that name may have been put forward at Ephesus in order to lead those Jews, who were busying themselves with speculations on the Logos as the center of all theophanies, to recognize in Christ the Supreme Revelation of God and the fulfillment of their Messianic hopes.<P>(b) Hellenic Source:<P>Other writers trace the Johannine ideas and terms to Hellenic philosophy and particularly to Alexandrian influence as represented in Philo. No one can compare the Fourth Gospel with the writings of Philo without noting a remarkable similarity in diction, especially in the use of the word "Logos". It would be hazardous, however, on this ground alone to impute conscious borrowing to the evangelist. It is more probable that both the Alexandrian thinker and the New Testament writer were subject to common influences of thought and expression. Hellenism largely colors the views and diction of the early church. Paul takes over many words from Greek philosophy. "There is not a single New Testament writing," says Harnack (Dogmen-Geschichte, I,47,note), "which does not betray the influence of the mode of thought and general culture which resulted from the Hellenizing of the East." But, while that is true, it must not be forgotten, as Harnack himself points out, "that while the writers of the New Testament breathe an atmosphere created by Greek culture, the religious ideas in which they live and move come to them from the Old Testament."<P>It is hardly probable that John was directly acquainted with the writings of Philo. But it is more than likely that he was cognizant of the general tenor of his teaching and may have discovered in the language which had floated over from Alexandria to Ephesus a suitable vehicle for the utterance of his own beliefs, especially welcome and intelligible to those who were familiar with Alexandrian modes of thought.<P>But whatever superficial resemblances there may be between Philo and John (and they are not few or vague), it must be at once evident that the whole spirit and view of life is fundamentally different. So far from the apostle being a disciple of the Alexandrian or a borrower of his ideas, it would be more correct to say that there is clearly a conscious rejection of the Philonic conception, and that the Logos of John is a deliberate protest against what he must have regarded as the inadequate and misleading philosophy of Greece.<P>(c) Contrast between Philo and John:<P>The contrast between the two writers is much more striking than the resemblance. The distinction is not due merely to the acceptance by the Christian writer of Jesus as the Word, but extends to the whole conception of God and His relation to the world which has made Christianity a new power among men. The Logos of Philo is metaphysical, that of John, religious. Philo moves entirely in the region of abstract thought, his idea of God is pure being; John\'s thought is concrete and active, moving in a region of life and history. Philo\'s Logos is intermediate, the instrument which God employs in fashioning the world; John\'s Logos is not subsidiary but is Himself God, and as such is not a mere instrument, but the prime Agent in creation. According to Philo the Deity is conceived as an architect who forms the world out of already existent matter. According to John the Logos is absolute Creator of all that is, the Source of all being, life and intelligence. In Philo the Logos hovers between personality and impersonality, and if it is sometimes personified it can hardly be said to have the value of an actual person; in John the personality of the Logos is affirmed from the first and it is of the very essence of his doctrine, the ground of His entire creative energy. The idea of an incarnation is alien to the thought of Philo and impossible in his scheme of the universe; the "Word that has become flesh" is the pivot and crown of Johannine teaching. Philo affirms the absolute incomprehensibility of God; but it is the prime object of the evangelist to declare that God is revealed in Christ and that the Logos is the unveiling through the flesh of man of the self-manifesting Deity. Notwithstanding the personal epithets employed by Philo, his Logos remains a pure abstraction or attribute of God, and it is never brought into relation with human history. John\'s Logos, on the other hand, is instinct with life and energy from the beginning, and it is the very heart of his Gospel to declare as the very center of life and history the great historical event of the incarnation which is to recreate the world and reunite God and man.<P>From whatever point of view we compare them, we find that Philo and John, while using the same language, give an entirely different value to it. The essential purport of the Johannine Logos is Jesus Christ. The adoption of the term involves its complete transformation. It is baptized with a new spirit and henceforth stands for a new conception. From whatsoever source it was originally derived—from Hebrew tradition or Hellenic speculation—on Christian soil it is a new product. It is neither Greek nor Jewish, it is Christian. The philosophical abstraction has become a religious conception. Hellenism and Hebrewism have been taken up and fused into a higher unity, and Christ as the embodiment of the Logos has become the creative power and the world-wide possession of mankind.<P>The most probable view is that Philo and John found the same term current in Jewish and Gentile circles and used it to set forth their respective ideas; Philo, following his predilections for Greek philosophy, to give a Hellenic complexion to his theory of the relation of Divine Reason to the universe; John, true to, his Hebrew instincts, seeing in the Logos the climax of that revelation of God to man of which the earlier Jewish theophanies were but partial expressions.<P>There is nothing improbable in the surmise that the teaching of Philo gave a fresh impulse to the study of the Logos as Divine Reason which was already shadowed forth in the Biblical doctrine of Wisdom (Westcott). Nor need we take offense that such an important idea should have come to the Biblical author from an extra-Biblical writer (compare Schmiedel, Johannine Writings), remembering only that the author of the Johannine Gospel was no mechanical borrower, but an entirely independent and original thinker who gave to the Logos and the ideas associated with it a wholly-new worth and interpretation. Thus, as has been said, the treasures of Greece were made contributory to the full unfolding of the Gospel.<P>V. Patristic Development.<P>The Johannine Logos became the fruitful source of much speculation in Gnostic circles and among the early Fathers regarding the nature of Christ. The positive truth presented by the Fourth Gospel was once more broken up, and the various elements of which it was the synthesis became the seeds of a number of partial and one-sided theories respecting the relation of the Father and the Son. The influence of Greek ideas, which had already begun in the Apostolic Age, became more pronounced and largely shaped the current of ante-Nicene theology (see Hatch, Hibbert Lectures).<P>Gnosticism in particular was an attempt to reconcile Christianity with philosophy; but in Gnostic systems the term "Logos" is only sparingly employed. According to Basilides the "Logos" was an emanation from the nous as personified Wisdom, which again was directly derived from the Father. Valentinus, in whose teaching Gnosticism culminated, taught that Wisdom was the last of a series of Eons which emanated from the Primal Being, and the Logos was an emanation of the first two principles which issued from God—Reason, Faith. Justin Martyr, the first of the sub-apostolic Fathers, sought to unite the Scriptural idea of the Logos as Word with the Hellenic idea of Reason. According to him God produced in His own nature a rational power which was His agent in creation and took the form in history of the Divine Man. Christ is the organ of all revelations, and as the logos spermatikos, He sows the seeds of virtue and truth among the heathen. All that is true and beautiful in the pagan world is to be traced to the activity of the Logos before His incarnation. Tatian and Theophilus taught essentially the same doctrine; though in Tatian there is a marked leaning toward Gnosticism, and consequently a tendency to separate the ideal from the historical Christ. Athenagoras, who ascribes to the Logos the creation of all things, regarding it in the double sense of the Reason of God and the creative energy of the world, has a firm grasp of the Biblical doctrine, which was still more clearly expressed by Irenaeus, who held that the Son was the essential Word, eternally begotten of the Father and at once the interpreter of God and the Creator of the world.<P>The Alexandrian school was shaped by the threefold influence of Plato, Philo and the Johannine Gospel. Clement of Alexandria views the Son as the Logos of the Father, the Fountain of all intelligence, the Revealer of the Divine Being and the Creator and Illuminator of mankind. He repudiates the idea of the inferiority of the Son, and regards the Logos not as the spoken but as the creative word. Origen seeks to reconcile the two ideas of the eternity and the subordination of the Logos, and is in this sense a mediator between the Arian and more orthodox parties and was appealed to by both. According to him the Son is equal in substance with the Father, but there is a difference in essence. While the Father is "the God" (ho theos) and "God Himself" (autotheos), the Logos is "a second God" (deuteros theos). In the Nicene Age, under the shaping influence of the powerful mind of Athanasius, and, to a lesser degree, of Basil and the two Gregories, the Logos-doctrine attained its final form in the triumphant statement of the Nicene Creed which declared the essential unity, but, at the same time, the personal distinction of the Father and Son. The Council of Nicea practically gathered up the divergent views of the past and established the teaching of the Fourth Gospel as the doctrine of the church.<P>LITERATURE.<P>(1) On Greek Logos:<P>Schleiermacher, Herakleitos der Dunkle; Histories of Philosophy, Zeller, Ueberweg, Hitter; Heinze, Die Lehre yore Logos in der Greek Phil. (1872); Aall, Gesch. d. Logosidee in d. Greek Phil. (1896).<P>(2) On Jewish Doctrine:<P>Oehler, O T Theol. (1873); Schurer, Lehrbuch d. New Testament Zeitgesch; Schultz, Old Testament Theol.<P>(3) On Alexandrian Doctrine:<P>Gfrorer, Philo u. die alex. Theosophie (1831); Dahne, Gesch. Darstell. der jud-alex. Religions-Philosophic (1843); Keferstein, Philos Lehre yon den gottlichen Mittelwesen (1846); Dorner, Entwicklungsgesch. der Lehre v. d. Person Christi; Siegfried, Philo v. Alex. (1875); Drummond, Philo Judaeus (1888); Reville, La doctrine du Logos; Huber, Die Philosophic der Kirchenvater; Grossmann, Questiones Philoneae (1841); Watson, Philos. Basis of Religion (1907).<P>(4) On Johannine Gospel:<P>Relative comma. of Meyer, Godet, Westcott, Luthardt, E. Scott (1907); Liddon, Divinity of our Lord ("Bampton Lectures," 1866); Watkins, Modern Criticism on the Fourth Gospel ("Bampton Lectures," 1890); Gloag, Introduction to Johannine Writing, (1891); Stevens, Johannine Theol. (1894); Drummond, Gospel of John; Bertling, Der Johan. Logos (1907); Schmiedel, The Johannine Writings (1908); Weizsacker, Apostolic Age, V, ii; Beyschlag and Weiss, Biblical Theol. of New Testament; Drummond, Via, Veritas, Vita (1894); Hatch, Greek Ideas and Usages, Their Influence upon the Christian Church (Hibbert Lectures, 1888).<P>(5) Patristic Period:<P>Harnack, Dogmen-Gesch.; Baur, Kirchen-Gesch.; Dorner, System d. chr. Glaubenslehre; Loofs, Leitfaden fur seine Vorlesungen uber Dogmengeschichte; Atzbergen, Die Logoslehre d. heiligen Athanasius (1880).``2';
isbe[5571]='Loins`loinz (chalats, Aramaic charats, mothen, kecel, yarekh; osphus): This variety of Hebrew synonyms seems to be used rather promiscuously for the loins, though there is no little difference in the secondary meanings of these words. They represent various modes of expressing the loins as the seat of strength and vigor (<a onClick="return mV(\'Job\',40,16);">Job 40:16</a>, Hebrew mothen, here used of Behemoth), the center of procreative power, the portion of the body which is girded about, and is considered as specially needful of covering, even under primitive conditions of life (<a onClick="return mV(\'Job\',31,20);">Job 31:20</a>), and where painful disease most effectually unfits a man for work and warfare.<P>Jacob receives the Divine promise that "kings shall come out of (his) loins" (chalats, <a onClick="return mV(\'Gen\',35,11);">Ge 35:11</a>), and we read of 66 souls "that came out of his loins" (yarekh) which went into Egypt (<a onClick="return mV(\'Gen\',46,26);">Ge 46:26</a>). The Epistle to the Hebrews speaks of the Levites as having come out of the loins of Abraham (<a onClick="return mV(\'Hbr\',7,5);">Heb 7:5</a>).<P>As the seat of strength (compare <a href="./study/isbe/search.html?string=LEG">LEG</a>; <a href="./study/isbe/search.html?string=THIGH">THIGH</a>), the loins are girded with belts of leather (<a onClick="return mV(\'2Ki\',1,8);">2Ki 1:8</a>; <a onClick="return mV(\'Mat\',3,4);">Mt 3:4</a>), or cloth, often beautifully embroidered (<a onClick="return mV(\'Exd\',28,39);">Ex 28:39</a>), or of costly material (<a onClick="return mV(\'Exd\',39,29);">Ex 39:29</a>; <a onClick="return mV(\'Jer\',13,1);">Jer 13:1</a>f). Girded loins are a sign of readiness for service or endeavor (<a onClick="return mV(\'Exd\',12,11);">Ex 12:11</a>; <a onClick="return mV(\'1Ki\',18,46);">1Ki 18:46</a>; <a onClick="return mV(\'2Ki\',4,29);">2Ki 4:29</a>; <a onClick="return mV(\'Job\',38,3);">Job 38:3</a>; <a onClick="return mV(\'Pro\',31,17);">Pr 31:17</a>; <a onClick="return mV(\'Luk\',12,35);">Lu 12:35</a>; <a onClick="return mV(\'1Pe\',1,13);">1Pe 1:13</a>). Of God it is said that "he looseth the bond of kings, and bindeth their loins with a girdle," i.e. strengthens them (<a onClick="return mV(\'Job\',12,18);">Job 12:18</a>). On the loins the sword is worn (<a onClick="return mV(\'2Sa\',20,8);">2Sa 20:8</a>). It is a sign of mourning to gird the loins with sackcloth (<a onClick="return mV(\'1Ki\',20,32);">1Ki 20:32</a>; <a onClick="return mV(\'Isa\',32,11);">Isa 32:11</a>; <a onClick="return mV(\'Jer\',48,37);">Jer 48:37</a>; <a onClick="return mV(\'Amo\',8,10);">Am 8:10</a>; see also the First Papyrus of Elephantine, l. 20). A man whose strength is in his attachment to truth, in other words is faithful, is spoken of as having his loins girt about with truth (<a onClick="return mV(\'Eph\',6,14);">Eph 6:14</a>). Thus, the Messiah is described: "Righteousness shall be the girdle of his waist, and faithfulness the girdle of his loins" (<a onClick="return mV(\'Isa\',11,5);">Isa 11:5</a>). One of the most primitive modes of clothing consisted of a fleece tied around the loins (<a onClick="return mV(\'Job\',31,20);">Job 31:20</a>).<P>The condition of unfitness for service is described in that the loins (kecel) are filled with a burning (<a onClick="return mV(\'Psa\',38,7);">Ps 38:7</a>, the King James Version "loathsome disease"), or that "a sore burden" is laid upon the "loins" (mothen, <a onClick="return mV(\'Psa\',66,11);">Ps 66:11</a>). Thus the loins are made "continually to shake" (<a onClick="return mV(\'Psa\',69,23);">Ps 69:23</a>), "the joints of (the) loins" (charats) are loosed (<a onClick="return mV(\'Dan\',5,6);">Da 5:6</a>), the "loins are filled with anguish" (<a onClick="return mV(\'Isa\',21,3);">Isa 21:3</a>). It is very likely that originally a disabling lumbago or the painful affections of the gall or the bladder (calculus, etc.) are meant, but very soon the expression becomes merely metaphorical to express personal helplessness, especially that which can but rely upon assistance and help from God.``106';
isbe[5572]='Lois`lo\'-is (Lois (<a onClick="return mV(\'2Ti\',1,5);">2Ti 1:5</a>)): The grandmother of Timothy, and evidently the mother of Eunice, Timothy\'s mother. The family lived at Lystra (<a onClick="return mV(\'Act\',16,1);">Ac 16:1</a>). It was on the occasion of Paul\'s first missionary journey (<a onClick="return mV(\'Act\',14,1);">Ac 14</a>) that Eunice and Timothy were converted to Christ, and it was, in all likelihood, on the same occasion that Lois also became a Christian. Paul speaks of the unfeigned faith that there was in Timothy, and he adds that this faith dwelt at the first in thy grandmother Lois, and thy mother Eunice. This is the only passage where Lois is mentioned; but by comparing <a onClick="return mV(\'2Ti\',1,5);">2Ti 1:5</a> with <a onClick="return mV(\'2Ti\',3,15);">2Ti 3:15</a> (the King James Version), where Paul refers to Timothy\'s having "from a child known the holy scriptures," it would appear that Lois was associated with Eunice, both in a reverent faith in God and in the careful instruction in the Old Testament which was given to Timothy.`<a href="./study/isbe/search.html?string=EUNICE">EUNICE</a>; <a href="./study/isbe/search.html?string=TIMOTHY">TIMOTHY</a>`155';
isbe[5573]='Longevity`lon-jev\'-i-ti: In the part of Genesis ascribed to the Priestly Code (P), the names and genealogies of the patriarchs are given (<a onClick="return mV(\'Gen\',5,\'1-\');">Ge 5</a>; <a onClick="return mV(\'Gen\',11,\'1-\');">11</a>). In the three versions which are our chief sources, Massoretic Text, Septuagint and Sam, the age-numbers given for these patriarchs are hopelessly at variance. It is in accord with what we find in the earliest legend of most races that in these chapters a great length of life is ascribed to these; thus Berosus attributes to the first 10 kings of Babylonia a span of 430,000 years, and Hesiod (Works and Days, 129) says that in the Silver Age childhood lasted 100 years, during which a boy was reared and grew up beside his mother. On the other hand the evidence of prehistoric archaeology shows that the rate of development of the individual in the early Stone Age differed very little from that of humanity at the present day. It is possible that, in the case of the Hebrew record, the names of certain pre-Abrahamic patriarchs were derived from an ancient tradition, and that in the desire to fill up the chronology of the period before the call of Abraham, these names were inserted and the time which was supposed to have elapsed was divided among them; on the basis of some such hypothesis as that which is said to have existed among the Jews, that the Messiah should come 4,000 years after Adam.<P>We know from the archaeological evidence that the antiquity of primitive man extends to a date very much farther back than 4,000 years. Indeed, we can prove that before 4000 BC there were settled nationalities both in the valley of the Nile and that of the Euphrates, and that among these the duration of individual life was much the same as at the present day. The first three dynasties in Egypt, starting at or about 4400 BC, consisted of 25 consecutive kings, the average length of whose several reigns was about 30 years. The biographic sketches of Biblical persons other than those in Genesis showed that their longevity did not exceed that of our contemporaries. Eli was blind and feeble at 98. At 70 David was bedridden and frail. Manasseh, the king of Judah whose reign was longest, died at 67; Uzziah died at 68. The statement in <a onClick="return mV(\'Psa\',90,10);">Ps 90:10</a> attributed to Moses is a correct estimate of what has been the expectation of life at all time.<P>At the present day among Palestinian fellahin very old men are uncommon. I have never seen anyone among them who could prove that he was 80 years of age; the rate of infant mortality is appallingly high. Maturity is earlier, and signs of senility appear among them sooner than among the same class in Great Britain.``107';
isbe[5574]='Longsuffering`long-suf\'-er-ing (\'erekh \'appayim; makrothumia): The words \'erekh \'appayim, translated longsuffering, mean literally, "long of nose" (or "breathing"), and, as anger was indicated by rapid, violent breathing through the nostrils, "long of anger," or "slow to wrath." The adjective is applied to God (<a onClick="return mV(\'Exd\',34,6);">Ex 34:6</a> the King James Version, in the name of Yahweh as proclaimed to Moses; <a onClick="return mV(\'Num\',14,18);">Nu 14:18</a> the King James Version; <a onClick="return mV(\'Psa\',86,15);">Ps 86:15</a> the King James Version; the Revised Version (British and American) "slow to anger," which is also the translation in other places; the King James Version and the Revised Version (British and American) <a onClick="return mV(\'Neh\',9,17);">Ne 9:17</a>; <a onClick="return mV(\'Psa\',103,8);">Ps 103:8</a>; <a onClick="return mV(\'Psa\',145,8);">145:8</a>; <a onClick="return mV(\'Pro\',15,18);">Pr 15:18</a>; <a onClick="return mV(\'Pro\',16,32);">16:32</a>; <a onClick="return mV(\'Joe\',2,13);">Joe 2:13</a>; <a onClick="return mV(\'Jon\',4,2);">Jon 4:2</a>; <a onClick="return mV(\'Nah\',1,3);">Na 1:3</a>); it is associated with "great kindness" and "plenteous in mercy." The substantive occurs in <a onClick="return mV(\'Jer\',15,15);">Jer 15:15</a>: "Take me not away in thy longsuffering." In <a onClick="return mV(\'Ecc\',7,8);">Ec 7:8</a>, we have \'erekh ruach, the King James Version and the Revised Version (British and American) "patient in spirit."<P>The word in the New Testament rendered "longsuffering," makrothumia (once makrothumeo, "to be longsuffering"), which is the rendering of \'erekh \'appayim in the Septuagint, is literally, "long of mind or soul" (regarded as the seat of the emotions), opposed to shortness of mind or soul, irascibility, impatience, intolerance. It is attributed to God (<a onClick="return mV(\'Rom\',2,4);">Ro 2:4</a>; <a onClick="return mV(\'Rom\',9,22);">9:22</a>; <a onClick="return mV(\'2Pe\',3,9);">2Pe 3:9</a>), of His bearing long with sinners and slowness to execute judgment on them. It is, therefore, one of "the fruits of the Spirit" in man (<a onClick="return mV(\'Gal\',5,22);">Ga 5:22</a>) which Christians are frequently exhorted to cherish and show one toward the other (<a onClick="return mV(\'Eph\',4,2);">Eph 4:2</a>; <a onClick="return mV(\'Col\',1,11);">Col 1:11</a>; <a onClick="return mV(\'Col\',3,12);">3:12</a>, etc.); it belongs, Paul says, to the love, without which all else is nothing: "Love suffereth long (makrothumei), and is kind" (<a onClick="return mV(\'1Cr\',13,4);">1Co 13:4</a>); The verb makrothumeo is sometimes translated by "patience" (<a onClick="return mV(\'Mat\',18,26,29);">Mt 18:26,29</a>, "Have patience with me"). <a onClick="return mV(\'Luk\',18,7);">Lu 18:7</a> has been variously rendered; the King James Version has "And shall not God avenge his own elect...though he bear long with them"; the Revised Version (British and American) "and yet he is longsuffering over them," the American Revised Version margin "and is he slow to punish on their behalf?" Weymouth (New Testament in Modern Speech) has "although he seems slow in taking action on their behalf," which most probably gives the sense of the passage; in <a onClick="return mV(\'Jam\',5,7,8);">Jas 5:7,8</a> the verb occurs thrice, the King James Version "be patient," "hath long patience"; the Revised Version (British and American) also translates by "patient"; this, however, as in <a onClick="return mV(\'Mat\',18,26,29);">Mt 18:26,29</a>, seems to lose the full force of the Greek word. According to Trench (Synonyms of the New Testament, 189), the difference between hupomone ("patience") and makrothumia is that the latter word expresses patience in respect to persons, and the former in respect to things; hence, hupomone is never ascribed to God; where He is called "the God of patience," it is as He gives it to His servants and saints. But in <a onClick="return mV(\'Jam\',5,7);">Jas 5:7</a> it is used with reference to things, and in <a onClick="return mV(\'Col\',1,11);">Col 1:11</a> it is associated with patience (compare <a onClick="return mV(\'Hbr\',6,12,15);">Heb 6:12,15</a>), suggesting patient endurance of trials and sufferings. In <a onClick="return mV(\'Col\',1,11);">Col 1:11</a> it is also associated with "joy," indicating that it is not a mere submissiveness, but a joyful acceptance of the will of God, whatever it may be. In The <span class="noTag">Wisdom of Solomon 15:1; Ecclesiasticus 5:4</span>, we have "longsuffering" (makrothumos) ascribed to God; also in Ecclesiasticus 2:11, the Revised Version (British and American) "mercy."``185';
isbe[5575]='Look`look:<P>(1) The uses of the simple verb in English Versions of the Bible are nearly all good modern English. In <a onClick="return mV(\'Isa\',5,2);">Isa 5:2</a>, however, "He looked that it should bring forth grapes"—"look" is used in the sense of "expect." Compare the King James Version of Sirach 20:14; <a onClick="return mV(\'Act\',28,6);">Ac 28:6</a>, "They looked when he should have swollen" (the Revised Version (British and American) "They expected that he would have swollen"). In 1Macc 4:54, the King James Version has inserted "look" (omitted in the Revised Version (British and American)) as a simple interjection, without a corresponding word in the Greek<P>(2) "Look upon" means "fix one\'s attention on," and is often so used in English Versions of the Bible without further significance (<a onClick="return mV(\'Ecc\',2,11);">Ec 2:11</a>; <a onClick="return mV(\'Luk\',22,56);">Lu 22:56</a>, etc.); but in <a onClick="return mV(\'2Ch\',24,22);">2Ch 24:22</a> the King James Version and the Revised Version (British and American), "Yahweh look upon it" means "remember." However, continual attention given to an object usually denotes that pleasure is found in it, and from this fact such uses as those of <a onClick="return mV(\'Pro\',23,31);">Pr 23:31</a>, "Look not thou upon the wine when it is red," are derived. In particular, God\'s "looking upon" a person becomes a synonym for "showing favor unto," as in <a onClick="return mV(\'Deu\',26,7);">De 26:7</a> the King James Version; <a onClick="return mV(\'Psa\',84,9);">Ps 84:9</a> the King James Version and the Revised Version (British and American); <a onClick="return mV(\'Psa\',119,132);">Ps 119:132</a> the King James Version; <a onClick="return mV(\'Luk\',1,48);">Lu 1:48</a> the Revised Version (British and American) only, etc. (the Revised Version (British and American) usually, re-words, in such passages). On the other hand, "look on" may be weakened, as in such phrases as "fair to look unon" (<a onClick="return mV(\'Gen\',12,11);">Ge 12:11</a> etc.), where it means only "fair to the sight." Or as in modern English, "look on" may describe the attitude of the passive spectator, even when applied to God. So <a onClick="return mV(\'Psa\',35,17);">Ps 35:17</a>, "Lord, how long wilt thou look on?"<P>(3) "Look to" usually means "pay attention to," as in <a onClick="return mV(\'Pro\',14,15);">Pr 14:15</a>; <a onClick="return mV(\'Jer\',39,12);">Jer 39:12</a>; <a onClick="return mV(\'2Jo\',1,8);">2Joh 1:8</a>, etc., and the Revised Version (British and American) occasionally uses this phrase in place of AV\'s "look upon" (<a onClick="return mV(\'Phl\',2,4);">Php 2:4</a>). The reverse change is made in the King James Version\'s <a onClick="return mV(\'1Sa\',16,12);">1Sa 16:12</a>, "goodly to look to"; <a onClick="return mV(\'Eze\',23,15);">Eze 23:15</a>, "all of them princes to look to," but in the latter verse a more drastic revision was needed, for the meaning is "all of them in appearance as princes." "Look out" may mean "search for" (<a onClick="return mV(\'Gen\',41,33);">Ge 41:33</a>; <a onClick="return mV(\'Act\',6,3);">Ac 6:3</a>), but may also be used literally, (<a onClick="return mV(\'Gen\',26,8);">Ge 26:8</a>, etc.). The King James Version\'s "looking after those things" in <a onClick="return mV(\'Luk\',21,26);">Lu 21:26</a> has been changed by the Revised Version (British and American) into "expectation of the things." "Look one another in the face" in <a onClick="return mV(\'2Ki\',14,8,11);">2Ki 14:8,11</a> means "meet in battle."``48';
isbe[5576]='Looking-Glass`look\'-ing-glas (<a onClick="return mV(\'Exd\',38,8);">Ex 38:8</a> the King James Version margin "brasen glasses").`<a href="./study/isbe/search.html?string=GLASS">GLASS</a>; <a href="./study/isbe/search.html?string=MIRROR">MIRROR</a>`1';
isbe[5577]='Loom`loom`<a href="./study/isbe/search.html?string=WEAVING">WEAVING</a>`1';
isbe[5578]='Loop`loop (in plural lula\'oth (<a onClick="return mV(\'Exd\',26,4,10);">Ex 26:4f; 10f</a>; <a onClick="return mV(\'Exd\',36,11,17);">36:11f; 17</a>)): A ring or fold made of blue thread to fasten into the corresponding golden clasps, or taches upon the curtains of the tabernacle, joining them in sets, or pairs.`<a href="./study/isbe/search.html?string=TABERNACLE">TABERNACLE</a>`1';
isbe[5579]='Lord of Hosts`A name or title of God frequently used in the Old Testament, always translated "Yahweh of Hosts" (Yahweh tsebha\'oth) in the American Standard Revised Version, since Yahweh, never \'Adhonay, is used in this phrase. Evidently the meaning of the title is that all created agencies and forces are under the leadership or dominion of Yahweh, who made and maintains them (<a onClick="return mV(\'Gen\',2,1);">Ge 2:1</a>; <a onClick="return mV(\'Isa\',45,12);">Isa 45:12</a>). It is used to express Yahweh\'s great power.`<a href="./study/isbe/search.html?string=GOD,+NAMES+OF">GOD, NAMES OF</a>`1';
isbe[5580]='Lord\'s Day`(he kuriake hemera):<P>1. Linguistic:<P>Formerly it was supposed that the adjective kuriakos (translated "the Lord\'s") was a purely Christian word, but recent discoveries have proved that it was in fairly common use in the Roman Empire before Christian influence had been felt. In secular use it signified "imperial," "belonging to the lord"—the emperor—and so its adoption by Christianity in the sense "belonging to the Lord"—to Christ—was perfectly easy. Indeed, there is reason to suppose that in the days of Domitian, when the issue had been sharply defined as "Who is Lord? Caesar or Christ?" the use of the adjective by the church was a part of the protest against Caesar-worship (see <a href="./study/isbe/search.html?string=LORD">LORD</a>). And it is even possible that the full phrase, "the Lord\'s day," was coined as a contrast to the phrase, "the Augustean day" he sebaste hemera), a term that seems to have been used in some parts of the Empire to denote days especially dedicated in honor of Caesar-worship.<P>2. Post-Apostolic:<P>"Lord\'s day" in the New Testament occurs only in <a onClick="return mV(\'Rev\',1,10);">Re 1:10</a>, but in the post-apostolic literature we have the following references: Ignatius, Ad Mag., ix.1, "No longer keeping the Sabbath but living according to the Lord\'s day, on which also our Light arose"; Ev. Pet., verse 35, "The Lord\'s day began to dawn" (compare <a onClick="return mV(\'Mat\',28,1);">Mt 28:1</a>); verse 50, "early on the Lord\'s day" (compare <a onClick="return mV(\'Luk\',24,1);">Lu 24:1</a>); Barn 15 9, "We keep the eighth day with gladness," on which Jesus arose from the dead." I.e. Sunday, as the day of Christ\'s resurrection, was kept as a Christian feast and called "the Lord\'s day," a title fixed so definitely as to be introduced by the author of Ev. Pet. into phrases from the canonical Gospels. Its appropriateness in <a onClick="return mV(\'Rev\',1,10);">Re 1:10</a> is obvious, as John received his vision of the exalted Lord when all Christians had their minds directed toward His entrance into glory through the resurrection.<P>3. In the New Testament:<P>This "first day of the week" appears again in <a onClick="return mV(\'Act\',20,7);">Ac 20:7</a> as the day on which the worship of the "breaking of bread" took place, and the impression given by the context is that Paul and his companions prolonged their visit to Troas so as to join in the service. Again, <a onClick="return mV(\'1Cr\',16,2);">1Co 16:2</a> contains the command, "Upon the first day of the week let each one of you lay by him in store," where the force of the form of the imperative used (the present for repeated action) would be better represented in English by "lay by on the successive Sundays." Worship is here not explicitly mentioned (the Greek of "by him" is the usual phrase for "at home"), but that the appropriateness of the day for Christian acts involves an appropriateness for Christian worship is not to be doubted. Indeed, since the seven-day week was unknown to Greek thought, some regular observance of a hebdomadal cycle must have been settled at Corinth before Paul could write his command. Finally, the phrase, "first day in the week" is found elsewhere in the New Testament only in <a onClick="return mV(\'Mat\',28,1);">Mt 28:1</a>; <a onClick="return mV(\'Mar\',16,2);">Mr 16:2</a>; <a onClick="return mV(\'Luk\',24,1);">Lu 24:1</a>; <a onClick="return mV(\'Jhn\',20,1,19);">Joh 20:1,19</a>. The word in all passages for "first" is poor Greek (mia, "one," for prote, a Hebraism), and the coincidence of the form of the phrase in <a onClick="return mV(\'Act\',20,7);">Ac 20:7</a> and <a onClick="return mV(\'1Cr\',16,2);">1Co 16:2</a> with the form used by all four evangelists for the Resurrection Day \'is certainly not accidental; it was the fixed Christian base, just as "Lord\'s day" was to the writer of Ev. Pet.<P>4. Origin:<P>The hebdomadal observance of Sunday points back of Corinth to Jewish-Christian soil, but it is impossible to say when the custom first began. Not, apparently, in the earliest days, for <a onClick="return mV(\'Act\',2,46);">Ac 2:46</a> represents the special worship as daily. But this could not have continued very long, for waning of the first enthusiasm, necessity of pursuing ordinary avocations, and increasing numbers of converts must soon have made general daily gatherings impracticable. A choice of a special day must have become necessary, and this day would, of course, have been Sunday. Doubtless, however, certain individuals and communities continued the daily gatherings to a much later date, and the appearance of Sunday as the one distinctive day for worship was almost certainly gradual.<P>5. Sunday and the Sabbath:<P>Sunday, however, was sharply distinguished from the Sabbath. One was the day on which worship was offered in a specifically Christian form, the other was a day of ritual rest to be observed by all who were subject? the Law of Moses through circumcision (<a onClick="return mV(\'Gal\',5,3);">Ga 5:3</a>; compare <a onClick="return mV(\'Act\',21,20);">Ac 21:20</a>). Uncircumcised Gentiles, however, were free from any obligation of Sabbath observance, and it is quite certain that in apostolic times no renewal of any Sabbath rules or transfer of them to Sunday was made for Gentile converts. No observance of a particular "day of rest" is contained among the "necessary things" of <a onClick="return mV(\'Act\',15,28,29);">Ac 15:28,29</a>, nor is any such precept found among all the varied moral directions given in the whole epistolary literature. Quite on the contrary, the observance of a given day as a matter of Divine obligation is denounced by Paul as a forsaking of Christ (<a onClick="return mV(\'Gal\',4,10);">Ga 4:10</a>), and Sabbath-keeping is condemned explicitly in <a onClick="return mV(\'Col\',2,16);">Col 2:16</a>. As a matter of individual devotion, to be sure, a man might do as he pleased (<a onClick="return mV(\'Rom\',14,5,6);">Ro 14:5,6</a>), but no general rule as necessary for salvation could be compatible with the liberty wherewith Christ has made us free. Evidently, then, the fact that the Christian worship was held on Sunday did not sanctify Sunday any more than (say) a regular Wednesday service among us sanctifies Wednesday, noting especially that the apostolic service was held in the evening. For it was felt that Christian enthusiasm would raise every day to the highest religious plane, the decay of that enthusiasm through the long delay of the Parousia not being contemplated.<P>6. Later History:<P>The delay occurred, however, and for human beings in the ordinary routine of life there are necessary, not only set periods of worship, but set periods of relaxation from routine to make worship profitable. And the Christian fundamental doctrine of mercy demands that Christianity, where she has the power, shall give to men relief from the drain of continuous toil.<P>The formulation of general rules to carry these principles into effect, however, belongs to a period outside New Testament times, and so does not come within the scope of this Encyclopedia. It is enough to say that the ecclesiastical rules for Sunday were felt to be quite distinct from the laws for Sabbath observance, and that Alcuin (733?-804) is the first to hold that the church had transferred the Sabbath rules as a whole to Sunday. This principle is still maintained in Roman Catholic theology, but at the Reformation was rejected uncompromisingly by both Lutherans (Augsb. Conf., II, 7) and Calvinists (Helvet. Conf., XXIV, 1-2) in favor of a literally apostolic freedom (Calvin even proposed to adopt Thursday in place of Sunday). The appearance of the opposite extreme of a genuinely "legalistic" Sabbatarianism in the thoroughly Evangelical Scotch and English Puritanism is an anomaly that is explained by reaction from the extreme laxity of the surroundings.<P>7. Practical:<P>Sunday was fixed as the day for Christian worship by general apostolic practice, and the academic possibility of an alteration hardly seems worth discussing. If a literal apostolicity is to be insisted upon, however, the "breaking of bread" must be made part of the Sunday service. Rest from labor for the sake of worship, public and private, is intensely desirable, since the regaining of the general apostolic enthusiasm seems unattainable, but the New Testament leaves us quite free as to details. Rest from labor to secure physical and mental renewal rests on a still different basis, and the working out of details involves a knowledge of sociological and industrial conditions, as well as a knowledge of religious principles. It is the task of the pastor to combine the various principles and to apply them to the particular conditions of his people in their locality, in accordance with the rules that his own church has indubitably the right to lay down—very special attention being given, however, to the highly important matter of the peculiar problem offered by children. In all cases the general principles underlying the rules should be made clear, so that they will not appear as arbitrary legalism, and it is probably best not to use the term "Sabbath" for Sunday. Under certain conditions great freedom may be desirable, and such is certainly not inconsistent with our liberty in Christ. But experience, and not least of all the experience of the first churches of the Reformation, has abundantly shown that much general laxness in Sunday rules invariably results disastrously.<P>See further, <a href="./study/isbe/search.html?string=ETHICS+OF+JESUS">ETHICS OF JESUS, I,3,(1)</a>.<P>LITERATURE. For the linguistic matters, Deissmann, Light from the Ancient East,1910,361-66. Hessey\'s Sunday (ed 1880) ("Bampton Lectures," 1860) contains a good summary of the history of the problems. Zockler\'s "Sonntagsfeier," PRE, edition 3, XVIII,1906,521-29 is the best general survey. In Sch-Herz this article ("Sunday") is harmed by abbreviation, but an exhaustive bibliography is added.``48';
