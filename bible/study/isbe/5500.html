:24,25</a>). Why not the Agape?<P>(3) The Agape was perpetuated by the apostles and disciples. They certainly understood Jesus to mean that the entire services of the Last Supper should be perpetuated, else they would not have done so.<P>III. Practice of the Church of the Brethren.<P>The "Love Feast" commemorates Jesus\' Last Supper with His disciples. These Love Feasts are held once or twice each year, always in the evening, by each local church or congregation. Preparatory services on "self-examination" (<a onClick="return mV(\'1Cr\',11,28);">1Co 11:28</a>) precede the ordinances. The church pews are converted into tables. The Supper (deipnon) is made ready beforehand by the deacons and deaconesses. The devotional exercises aim to accomplish special consecration, confession, and reconciliation. Before the eating of the Supper, <a onClick="return mV(\'Jhn\',13,\'1-17\');">Joh 13:1-17</a> is read and explained, whereupon the brethren proceed to wash one another\'s feet, and the sisters likewise by themselves. All tarry one for another (<a onClick="return mV(\'1Cr\',11,33);">1Co 11:33</a>) until they are ready for the Supper. The officiating elder then calls upon someone to offer prayer for the meal, which is then eaten together. Another prayer of thanksgiving is offered at the close of the meal. After the meal, the officiating elder calls upon one to read the story of Christ\'s sufferings (<a onClick="return mV(\'Isa\',53,\'1-\');">Isa 53</a>, or <a onClick="return mV(\'Jhn\',19,\'1-\');">Joh 19</a>). After a short explanation of the meaning of the symbol, the communicants rise while the officiating elder gives thanks for the bread. He then turns to his brother at his right and breaks a piece of the unleavened bread for him with the words, "My beloved brother, the bread which we break is the communion of the body of Christ" (see <a onClick="return mV(\'1Cr\',10,16);">1Co 10:16</a>). The brethren then break the bread one to the other, with these words. Likewise the sisters in the same manner. Again the congregation rises while the officiating elder gives thanks for the cup, which is then passed by one to the other with the words "Beloved brother (or sister), the cup of the New Testament is the communion of the blood of Christ" (<a onClick="return mV(\'1Cr\',10,16);">1Co 10:16</a>). This is followed by prayers of praise and thanksgiving, then a hymn (<a onClick="return mV(\'Mat\',26,30);">Mt 26:30</a>) and a benediction.<P>IV. The Meaning and Significance of the Love Feast.<P>All these ordinances or symbols signify some fundamental virtue in the Christian life. We are commanded to follow our Master who is the Way and the Truth. But these symbols have a real significance, apart from merely "following" or "obeying" the Lord\'s command.<P>(1) Feet-washing symbolized humility and service, and also the partial cleansing which all Christians need.<P>(2) The Agape signifies the bread-and-water covenant of brotherhood and peace. It is not only the symbol of true Christian fellowship, but is productive of such fellowship. It is also symbolic of the "Marriage Supper of the Lamb," which is supremely a symbol of joy.<P>(3) the Eucharist:<P>(a) The broken bread represents the "body of Christ" (<a onClick="return mV(\'1Cr\',10,16);">1Co 10:16</a>) "which is broken for you" (<a onClick="return mV(\'1Cr\',11,24);">1Co 11:24</a> the King James Version); hence, the symbol of sacrifice. It is a memorial of Christ\'s sufferings, and a consecration to suffer with Him. It means also feeding on Christ, whose flesh we must eat (<a onClick="return mV(\'Jhn\',6,35,51,53,54);">Joh 6:35,51,53,54</a>).<P>(b) The cup represents the blood of Christ (<a onClick="return mV(\'1Cr\',10,16);">1Co 10:16</a>; <a onClick="return mV(\'Jhn\',6,53,54);">Joh 6:53,54</a>). It is the blood covenant that symbolizes the unity of man with God (<a onClick="return mV(\'Jhn\',17,21);">Joh 17:21</a>). Jesus is the vine, we are the branches (<a onClick="return mV(\'Jhn\',15,\'1-\');">Joh 15</a>). The same mind, spirit, life and love which are in God and Christ are to be in us.<P>LITERATURE.<P>C. F. Yoder, God\'s Means of Grace; R.H. Miller, Doctrine of Brethren Defended; D. W. Kurtz, Outline of the Fundamental Doctrines (all of Elgin, Illinois, U.S.A.).``92';
isbe[5584]='Lord; the Lord`lord, This English word in our Bible represents one Aramaic, 3 Greek and 9 Hebrew words, two of them in two forms. It thus expresses all grades of dignity, honor, and majesty. It is not always possible to be sure of the sense in which the term is to be taken. In <a onClick="return mV(\'Gen\',18,3);">Ge 18:3</a>; <a onClick="return mV(\'Gen\',19,18);">19:18</a>, the translators waver between interpreting of the Divine Person and a finite angel (compare marginal readings). It represents the most sacred Hebrew name for God, as their covenant God, Yah, Yahweh, and the more usual designation of Deity, \'Adhonay, \'Adhon, a term which they adopted to avoid pronouncing the most holy designation. They had placed on <a onClick="return mV(\'Lev\',24,16);">Le 24:16</a> an interpretation that aroused such a dread that they seldom dared use the name at all. When two of the words usually translated "Lord," both referring to God, occur together, the King James Version renders "Lord God," and the American Standard Revised Version "Lord Yahweh." the American Standard Revised Version has adopted the rule of using the covenant name transliterated, instead of the term "Lord," in which the King James Version adopts the rule of the Hebrews to avoid the holy name.<P>The Aramaic designation, Mare\', occurs only in Daniel (e.g. <a onClick="return mV(\'Dan\',2,47);">2:47</A>; <a onClick="return mV(\'Dan\',5,23);">5:23</A>), and the same word refers to a man (<a onClick="return mV(\'Dan\',4,24);">4:24</A>).<P>Of the Greek words, Kurios is freely used of both the Deity and men. Despotes, of men in classic usage, occurs only of God, including the ascended Jesus, and is employed only 5 times. Megistanes (plural) is found once, of men (<a onClick="return mV(\'Mar\',6,21);">Mr 6:21</a>). Rabboni (Hebrew in Greek letters) is applied only to the Christ, and is simply transliterated in the Revised Version (British and American), but rendered "Lord" in the King James Version (compare <a onClick="return mV(\'Mar\',10,51);">Mr 10:51</a>).<P>Our English versions distinguish the 3 main uses of the term thus:<P>(1) "LORD" represents the Hebrew Yahweh, Septuagint Kurios, except where \'Adhonay or \'Adhon is combined with Yahweh (= "Lord God"); the American Standard Revised Version has in these examples employed the name as it is found in the Hebrew, simply transliterated.<P>(2) "Lord" corresponds to \'Adhonay, \'Adhon, Mare\', also Greek Kurios (see (1)), and Despotes, for which the American Standard Revised Version has always "Master" in either the text or the margin.<P>(3) "Lord" ("lord") translates all the remaining 8 Hebrew words and the Greek words except Despotes. It is thus seen that Kurios corresponds to all three forms of writing the English term.`<a href="./study/isbe/search.html?string=JEHOVAH">JEHOVAH</a>`21';
isbe[5585]='Lords of the Philistines`(ceren, same as Hebrew word for "axle," probably a native designation): These "lords" (<a onClick="return mV(\'Jos\',13,3);">Jos 13:3</a>; <a onClick="return mV(\'Jdg\',3,3);">Jud 3:3</a>; <a onClick="return mV(\'Jdg\',16,5);">16:5</a>, etc.; <a onClick="return mV(\'1Sa\',5,8,11);">1Sa 5:8,11</a>, etc.), elsewhere called "princes" (sar, <a onClick="return mV(\'1Sa\',18,30);">1Sa 18:30</a>; <a onClick="return mV(\'1Sa\',29,3,4,9);">29:3,4,9</a>), were the petty rulers or kings of the 5 Philistine cities, Gaza, Ashkelon, Ashdod, Ekron, Gath.`<a href="./study/isbe/search.html?string=PHILISTINES">PHILISTINES</a>`1';
isbe[5586]='Loss`chata "to suffer as one erring, or as a sinner" (<a onClick="return mV(\'Gen\',31,39);">Ge 31:39</a>, where Jacob assures Laban that he (Jacob) suffered the loss of all animals of the flock torn by beasts); shekhol, "bereavement" (<a onClick="return mV(\'Isa\',47,8);">Isa 47:8</a>f; where the prophet foretells the humiliation of proud Babylon who shall suffer the loss of her children, and widowhood); shikkulim, "bereavement" (<a onClick="return mV(\'Isa\',49,20);">Isa 49:20</a>, translated "bereavement" in the Revised Version (British and American), where the prophet promises to the desolate Zion enlargement). In the New Testament the translations of three Greek words: apobole, "casting away" (<a onClick="return mV(\'Act\',27,22);">Ac 27:22</a>, where Paul assures the crew and passengers that there shall be no "loss" of life from the storm); zemia, "loss" (<a onClick="return mV(\'Act\',27,21);">Ac 27:21</a>, referring to the harm sustained in the storm; <a onClick="return mV(\'Phl\',3,7);">Php 3:7</a>f; where Paul counts all his natural privileges and attainments as forfeited for the excellency of the knowledge of Christ); zemioo. "to suffer loss" (<a onClick="return mV(\'1Cr\',3,15);">1Co 3:15</a>, where Paul says the man whose works are burned shall suffer "loss"; <a onClick="return mV(\'Phl\',3,8);">Php 3:8</a>, same context as above).``194';
isbe[5587]='Lot (1)`lot:<P>I. Personality.<P>The man who bore the name Lot (lot; Lot) is mentioned for the first time in <a onClick="return mV(\'Gen\',11,27);">Ge 11:27</a>, at the beginning of that section of Genesis which is entitled "the generations of Terah." After Terah\'s 3 sons are named, it is added that the third of these, Haran, begat Lot.<P>The reason for thus singling out but one of the grandsons of Terah appears in the next verse, where we are told that "Haran died before his father Terah in the land of his nativity, in Ur of the Chaldees." For that period in the life of this family, therefore, which begins with the migration from Ur, Lot represents his father\'s branch of the family (<a onClick="return mV(\'Gen\',11,31);">Ge 11:31</a>). It is hardly probable that the relation between Abraham and Lot would have been what it was, had not Haran died; but be this as it may, we read this introduction of Lot into the genealogy of Terah as an anticipation of the story to which it furnishes an introduction, and in which Lot is destined to play an important part.<P>The sections of that story in which Lot appears are: in <a onClick="return mV(\'Gen\',11,\'1-\');">Ge 11</a>, the migration from Ur to Haran; in <a onClick="return mV(\'Gen\',12,\'1-\');">Ge 12</a>, Abraham\'s wanderings; in <a onClick="return mV(\'Gen\',13,\'1-\');">Ge 13</a>, the separation of Abraham and Lot; in <a onClick="return mV(\'Gen\',14,\'1-\');">Ge 14</a>, the campaign of the eastern kings against Sodom and Abraham\'s recovery of the captives; and in <a onClick="return mV(\'Gen\',19,\'1-\');">Ge 19</a>, the destruction of Sodom.<P>In <a onClick="return mV(\'Gen\',14,14,16);">Ge 14:14,16</a> Lot is termed the "brother" of Abraham; but that this does not represent a variant tradition is proved by reference to <a onClick="return mV(\'Gen\',14,12);">14:12</a> of the same chapter (ascribed to "an independent source") and to <a onClick="return mV(\'Gen\',13,8);">13:8</a> (ascribed to J; compare <a onClick="return mV(\'Gen\',11,28);">11:28</A> J).<P>II. Career.<P>1. First Period:<P>Lot\'s life, as the scanty references to him permit us to reconstruct it, falls into four periods. Of the first period—that previous to the migration from Haran—we know nothing save Lot\'s birth in Ur, the death of his father there, the marriage of his sister Milcah to his uncle Nahor (of another sister, Iscah, we learn only the name), and the journey to Haran in company with Terah, Abraham and Sarah. The fact that Sarah\'s childlessness and Haran\'s death are the only two circumstances related of the family history, may serve to explain why Lot went with Abraham instead of staying with Nahor. A childless uncle and a fatherless nephew may well have remained together with the idea that, even if there was no formal adoption, the nephew might become his uncle\'s heir. Certainly, the promise of a numberless seed, so often repeated to the patriarchs, comes first to Abraham immediately after Lot has separated from him (see <a onClick="return mV(\'Gen\',13,\'6-18\');">Ge 13:6-18</a>).<P>2. Second Period:<P>In the second period of Lot\'s life, we find him the companion of Abraham on his journeys from Mesopotamia to Canaan, through Canaan to Egypt, and back again to the neighborhood of Beth-el. His position is subordinate, for his uncle is head of the family, and oriental custom is uniform and rigorous in the matter of family rule. Hence, the use of the singular number throughout the narrative. What Abraham did, his whole "clan" did. Yet Lot\'s position was as nearly independent as these patriarchal conditions admit. When the story reaches the point where it is necessary to mention this fact, the narrator explains, first, the generosity with which Abraham treated his nephew, in permitting him to have "flocks, and herds, and tents" of his own, a quasi-independent economy, and second, that disproportion between their collective possessions and the land\'s resources which made separation inevitable. Up to this point the only mention of Lot during this period of wandering is contained in <a onClick="return mV(\'Gen\',13,1);">Ge 13:1</a>, in the words "and Lot with him." And even here the words are useless (because stating a fact perfectly presumable here as elsewhere), except as they prepare the reader for the story of the separation that is immediately to follow.<P>3. Third Period:<P>That story introduces the third period of Lot\'s career, that of his residence in the Kikkar (the Revised Version (British and American) "Plain," the Revised Version margin "Circle") and in Sodom. To the fundamental cause of separation, as above stated, the author adds the two circumstances which contributed to produce the result, namely, first, the strife that arose between Abraham\'s herdsmen and Lot\'s herdsmen, and, second, the presence in the same country of others—the Canaanites and Perizzites—thus reminding his readers that it was no vacant land, through which they might spread themselves absolutely at will and so counteract the operation of the principal cause and the contributory cause already set forth.<P>With a magnanimity that must have seemed even greater to minds accustomed to patriarchal authority than it seems to us, and that was in fact much more remarkable than it would be here and now, Abraham offers to his nephew the choice of the land—from the nomad\'s point of view. In the "we are brethren" (<a onClick="return mV(\'Gen\',13,8);">Ge 13:8</a>), the whole force of the scene is crystallized. Lot, who believes himself to have chosen the better part, is thereupon traced in his nomadic progress as far as Sodom, and the reader leaves him for a time face to face with a city whose men "were wicked and sinners against Yahweh exceedingly," while the narrative moves on with Abraham through that fresh scene of revelation which presented to this man of magnanimity a Divine deed to all the land, and to this man, now left without an heir from among his own kindred (compare <a onClick="return mV(\'Gen\',15,2,3);">Ge 15:2,3</a>), a Divine pledge of innumerable offspring.<P>Lot returns for a moment to our view as the mainspring of Abraham\'s motions in the campaign of <a onClick="return mV(\'Gen\',14,\'1-\');">Ge 14</a>. We are expressly told that it was "when Abram heard that his brother was taken captive," that he "led forth his trained men...and pursued." On the one hand we hear that Lot now "dwelt in Sodom," having abandoned the life in tents that he had led since Mesopotamian days, and on the other hand we find in him a foil to the energetic, decisive and successful figure of his uncle—for Lot plays a sorry role, bracketed always with "the women and the goods."<P>This period of his life ends with the annihilation of his chosen home, his wealth, his companions, and all that was his save two daughters, who, it would seem, might better have perished with the rest. <a onClick="return mV(\'Gen\',19,\'1-\');">Genesis 19</a>, coming immediately after the intercession of Abraham for Sodom that poignantly impresses on the reader\'s mind the wickedness of Lot\'s environment, exhibits to us the man himself in his surroundings, as they have affected him through well-nigh a score of years (compare <a onClick="return mV(\'Gen\',12,4);">12:4</A>; <a onClick="return mV(\'Gen\',17,1);">17:1</A>). What we see is a man who means well (courtesy, <a onClick="return mV(\'Gen\',19,1);">19:1</A>; hospitality, <a onClick="return mV(\'Gen\',19,2,3,6,7,8);">19:2,3,6-8</a>; natural shame, <a onClick="return mV(\'Gen\',19,7);">19:7</A>; loyalty, <a onClick="return mV(\'Gen\',19,14);">19:14</A>; and gratitude, <a onClick="return mV(\'Gen\',19,19);">19:19</A>), but who is hopelessly bound up with the moral life of the city through his family connections—alliances that have pulled him down rather than elevated others (<a onClick="return mV(\'Gen\',19,9,14,26,\31-35\');">19:9,14,26,31-35</a>). The language of <a onClick="return mV(\'2Pe\',2,7,8);">2Pe 2:7,8</a> reminds us that Lot was, even at this time of his life, a "righteous" man. Viewed as a part of his environment (the writer has been speaking of Sodom, <a onClick="return mV(\'Gen\',19,6);">19:6</A>), Lot was certainly entitled to be called a "righteous" man, and the term fits the implications of <a onClick="return mV(\'Gen\',18,\'23-32\');">Ge 18:23-32</a>. Moreover, <a onClick="return mV(\'Gen\',19,\'1-\');">Ge 19</a> itself shows Lot "vexed...with their lawless deeds" and "sore distressed by the lascivious life of the wicked" (compare <a onClick="return mV(\'Gen\',19,3,7,8,14);">19:3,7,8,14</A>). Yet the contrast with Abraham is always present in the reader\'s mind, so that the most lasting impressions are made by Lot\'s selfishness worldliness vacillation and cowardice, not to mention the moral effect made by the closing scene of his life (<a onClick="return mV(\'Gen\',19,\'30-38\');">19:30-38</a>).<P>4. Fourth Period:<P>The fourth period of Lot\'s career is of uncertain duration. Upon the destruction of Sodom he dwelt at first in Zoar, the "little" city, spared as a convenient refuge for him and his; but at some time unspecified, he "went up out of Zoar," for "he feared to dwell in Zoar"—why, we cannot say. This fear was greater than even the evidently great fear he entertained of dwelling in "the mountain" (<a onClick="return mV(\'Gen\',19,19);">Ge 19:19</a>). In this mountain-country of rocks and caves (Driver in HDB, article "Lot," cites Buckingham, Travels in Syria, 61-63,87,as authority for the statement that people still live in caves in this region), Lot and his two remaining daughters dwell; and the biography of this companion of "the friend of God" ends in a scene of incest, which supplies the logical epilogue to a drama of progressive moral deterioration. This bestial cave-man of <a onClick="return mV(\'Gen\',19,\'1-\');">Ge 19</a> is the "brother" of Abraham, but he has reached this goal because his path had led down from Beth-el to Sodom. The origin of the two neighboring and kindred nations, Moab and Ammon, is by the Hebrew tradition traced thus to Lot and his daughters.<P>III. Place in Later Literature.<P>In the Bible, Lot finds mention only as the father of Moab and Ammon (<a onClick="return mV(\'Deu\',2,9,19);">De 2:9,19</a>; <a onClick="return mV(\'Psa\',83,8);">Ps 83:8</a>), and in the passage in 2 Peter already noticed; and, besides these places, in <a onClick="return mV(\'Luk\',17,\'28-32\');">Lu 17:28-32</a>. Here Lot represents the central figure in the destruction of Sodom, as Noah in the flood in the preceding context (compare the association of these two characters in 2 Peter and the Koran). His deliverance is mentioned, the haste and narrowness of that escape is implied, and his wife\'s fate is recalled. In Jewish and Mohammedan lore (including many passages in the Koran itself), Lot is a personage of importance, about whom details are told which fancy has added to the sober traditions of old Israel. But particularly for Mohammed there was point of attachment in Lot\'s career, offered in <a onClick="return mV(\'Gen\',19,7,14);">Ge 19:7,14</a>. Like Mohammed to the men of wicked Mecca, Lot becomes a preacher of righteousness and a messenger of judgment to the men of wicked Sodom. He is one of the line of apostles, sent to reveal God\'s will and purpose to his contemporaries.<P>IV. Critical Theories about the Figure of Lot.<P>The common view of those who deny the historical reality of Lot is that this name simply stands for the ethnic group, Moab and Ammon. Wellhausen, e.g., expressly calls "Lot" a national name (Volksname). As to what is told of him in Genesis he remarks: "Were it not for the remarkable depression in which the Dead Sea lies, Sodom and Gomorrah would not have perished; were it not for the little flat tongue of land that reaches out into the swamp from the southeast, Lot would have fled at once to the mountains of his sons, Moab and Ammon, and not have made the detour by Zoar, which merely serves the purpose of explaining why this corner is excepted from \'the overthrow,\' to the territory of which it really belongs" (Prolegomena 6, 323). Meyer confesses that nothing can be made of Lot, because "any characteristic feature that might furnish a point of attachment is entirely lacking." The first of the families of the Horites of Seir was named Lotan (<a onClick="return mV(\'Gen\',36,20,22);">Ge 36:20,22</a>), and this writer believes it "probable that this name is derived from Lot; but that Lot was ever a tribal name (Stammname) follows neither from this fact (rather the contrary) nor from the designation of Moab and the bene \'Ammon as \'Sons of Lot\' "(Die Israeliten und ihre Nachbarstamme, 311; Compare 261, 339). If "Horite" was understood as "cave-dweller," the story in <a onClick="return mV(\'Gen\',19,30);">Ge 19:30</a> might be adduced in support of this combination. But the most recent line of reasoning concerning these patriarchal figures makes their names "neither Divine names nor tribal names, whether in actual use or regarded as such, but rather simple personal names like Tom, Dick and Harry....Typical names they became...so that...Israel\'s story-tellers would connect the name of Lot with the overthrow of the cities" (Gressmann, article in ZATW, 1910). These names were chosen just because "they were very common at the time when the narratives were stamped into types"; later they became unfashionable, but the story-tellers held fast to the old names. "One sees from this at once into how ancient a time the proper names Abraham and Lot must reach, and understands therefore the more easily how they could be changed into tribal ancestors." It does not require the cautions, uttered by writers of this way of thinking, against regarding their views as a return to the old historical view of the patriarchs, to remind us that, in spite of all that may be said to the contrary, the present trend of thought among the most radical critics of the Genesis-traditions is much mote favorable to that conservative historical view than were the opinions which they have overthrown. So that it may justly be asserted, as Gressmann writes: "Confidence in tradition is in any case on the rise."<P>Lot\'s Wife: This woman, unknown by name, figures in the narrative of Lot that relates his escape from Sodom. She is mentioned in <a onClick="return mV(\'Gen\',19,\'1-\');">Ge 19</a> only in verses <a onClick="return mV(\'Gen\',19,15,16,17);">15-17</A>, where she is commanded to flee from the doomed city with her husband and daughters, and is laid hold upon by the angelic visitors in their effort to hasten the slow departure; and in <a onClick="return mV(\'Gen\',19,26;">19:26</A>, where she alone of the four fugitives disobeys the warning, looks back, and becomes a "pillar of salt" This disobedience, with the moral state it implied and the judgment it entailed, is held up as an example by Christ in <a onClick="return mV(\'Luk\',17,32);">Lu 17:32</a>. In the Scriptures this is all that is said of a person and event that furnished the basis for a great deal of speculation. Josephus (Ant., I, xi, 4) adds to the statement derived from Genesis, "She was changed into a pillar of salt," the words, "for I visited it, and it still remains even now" (see also The <span class="noTag">Wisdom of Solomon 10:7</span>).<P>Among Christian writers contemporary with and subsequent to Josephus, as well as among the Jews themselves and other Orientals, the same assertion is found, and down to recent times travelers have reported the persistence of such a "pillar of salt," either on the testimony of natives or as eyewitnesses. The question of the origin and nature of these "pillars" is a part of the larger question of Sodom and its neighborhood (see <a href="./study/isbe/search.html?string=SALT">SALT</a>; <a href="./study/isbe/search.html?string=SIDDIM">SIDDIM</a>; <a href="./study/isbe/search.html?string=SLIME">SLIME</a>); for that no one particular "pillar" has persisted through the centuries may be regarded as certain; nor if it had, would the identification of Lot\'s wife with it and with it alone be ascertainable. This is just an early, persistent and notable case of that "identification" of Biblical sites which prevails all over the Holy Land. It is to be classed with the myth-and legend-building turn of mind in simple peoples, which has e.g. embroidered upon this Old Testament account of the destruction of Sodom such marvelous details and embellishments.<P>The principal thing to observe is the vagueness and the simplicity of the story in Genesis. For it does not necessarily imply the "metamorphosis" popularly attributed to it, in the strict sense of that word. And it lacks, even in a narrative like this, where the temptation would be greatest, all indications of that "popular archaeology" or curiosity, which according to some critics, is alleged to have furnished the original motive for the invention of the patriarchal narratives. "She became a pillar of salt," and "Remember Lot\'s wife": this is the extent of the Biblical allusions. All the rest is comment, or legend, or guess, or "science."``15';

isbe[5593]='Lotus Trees`lo\'-tus (tse\'elim; the King James Version shady trees): The trees under which behemoth (the "hippopotams") rests; "He lieth under the lotus-trees," "The lotus-trees cover him with their shade" (<a onClick="return mV(\'Job\',40,21,22);">Job 40:21,22</a>). The Arabic equivalent is the dom tree, Zizyphus lotus, a species of jujube tree (Natural Order Rhamneae); it has many spines and small globular fruit a little bigger than a pea. It is common in the Jordan valley. This plant has nothing to do with the Egyptian lotus.`<a href="./study/isbe/search.html?string=LILY">LILY</a>`1';
isbe[5594]='Love`luv (\'ahebh, \'ahabhah, noun; phileo, agapao, verb; agape, noun): Love to both God and man is fundamental to true religion, whether as expressed in the Old Testament or the New Testament. Jesus Himself declared that all the law and the prophets hang upon love (<a onClick="return mV(\'Mat\',22,40);">Mt 22:40</a>; <a onClick="return mV(\'Mar\',12,\'28-34\');">Mr 12:28-34</a>). Paul, in his matchless ode on love (<a onClick="return mV(\'1Cr\',13,\'1-\');">1Co 13</a>), makes it the greatest of the graces of the Christian life—greater than speaking with tongues, or the gift of prophecy, or the possession of a faith of superior excellence; for without love all these gifts and graces, desirable and useful as they are in themselves, are as nothing, certainly of no permanent value in the sight of God. Not that either Jesus or Paul underestimates the faith from which all the graces proceed, for this grace is recognized as fundamental in all God\'s dealings with man and man\'s dealings with God (<a onClick="return mV(\'Jhn\',6,28);">Joh 6:28</a>f; <a onClick="return mV(\'Hbr\',11,6);">Heb 11:6</a>); but both alike count that faith as but idle and worthless belief that does not manifest itself in love to both God and man. As love is the highest expression of God and His relation to mankind, so it must be the highest expression of man\'s relation to his Maker and to his fellow-man.<P>I. Definition.<P>While the Hebrew and Greek words for "love" have various shades and intensities of meaning, they may be summed up in some such definition as this: Love, whether used of God or man, is an earnest and anxious desire for and an active and beneficent interest ins the well-being of the one loved. Different degrees and manifestations of this affection are recognized in the Scriptures according to the circumstances and relations of life, e.g. the expression of love as between husband and wife, parent and child, brethren according to the flesh, and according to grace; between friend and enemy, and, finally, between God and man. It must not be overlooked, however, that the fundamental idea of love as expressed in the definition of it is never absent in any one of these relations of life, even though the manifestation thereof may differ according to the circumstances and relations. Christ\'s interview with the apostle Peter on the shore of the Sea of Tiberias (<a onClick="return mV(\'Jhn\',21,\'15-18\');">Joh 21:15-18</a>) sets before us in a most beautiful way the different shades of meaning as found in the New Testament words phileo, and agapao. In the question of Christ, "Lovest thou me more than these?" the Greek verb agapas, denotes the highest, most perfect kind of love (Latin, diligere), implying a clear determination of will and judgment, and belonging particularly to the sphere of Divine revelation. In his answer Peter substitutes the word philo, which means the natural human affection, with its strong feeling, or sentiment, and is never used in Scripture language to designate man\'s love to God. While the answer of Peter, then, claims only an inferior kind of love, as compared to the one contained in Christ\'s question, he nevertheless is confident of possessing at least such love for his Lord.<P>II. The Love of God.<P>First in the consideration of the subject of "love" comes the love of God—He who is love, and from whom all love is derived. The love of God is that part of His nature—indeed His whole nature, for "God is love"—which leads Him to express Himself in terms of endearment toward His creatures, and actively to manifest that interest and affection in acts of loving care and self-sacrifice in behalf of the objects of His love. God is "love" (<a onClick="return mV(\'1Jo\',4,8,16);">1Joh 4:8,16</a>) just as truly as He is "light" (<a onClick="return mV(\'1Jo\',1,5);">1Joh 1:5</a>), "truth" (<a onClick="return mV(\'1Jo\',1,6);">1Joh 1:6</a>), and "spirit" (<a onClick="return mV(\'Jhn\',4,24);">Joh 4:24</a>). Spirit and light are expressions of His essential nature; love is the expression of His personality corresponding to His nature. God not merely loves, but is love; it is His very nature, and He imparts this nature to be the sphere in which His children dwell, for "he that abideth in love abideth in God, and God abideth in him" (<a onClick="return mV(\'1Jo\',4,16);">1Joh 4:16</a>). Christianity is the only religion that sets forth the Supreme Being as Love. In heathen religions He is set forth as an angry being and in constant need of appeasing.<P>1. Objects of God\'s Love:<P>The object of God\'s love is first and foremost His own Son, Jesus Christ (<a onClick="return mV(\'Mat\',3,17);">Mt 3:17</a>; <a onClick="return mV(\'Mat\',17,5);">17:5</a>; <a onClick="return mV(\'Luk\',20,13);">Lu 20:13</a>; <a onClick="return mV(\'Jhn\',17,24);">Joh 17:24</a>). The Son shares the love of the Father in a unique sense; He is "my chosen, in whom my soul delighteth" (<a onClick="return mV(\'Isa\',42,1);">Isa 42:1</a>). There exists an eternal affection between the Son and the Father—the Son is the original and eternal object of the Father\'s love (<a onClick="return mV(\'Jhn\',17,24);">Joh 17:24</a>). If God\'s love is eternal it must have an eternal object, hence, Christ is an eternal being.<P>God loves the believer in His Son with a special love. Those who are united by faith and love to Jesus Christ are, in a different sense from those who are not thus united, the special objects of God\'s love. Said Jesus, thou "lovedst them, even as thou lovedst me" (<a onClick="return mV(\'Jhn\',17,23);">Joh 17:23</a>). Christ is referring to the fact that, just as the disciples had received the same treatment from the world that He had received, so they had received of the Father the same love that He Himself had received. They were not on the outskirts of God\'s love, but in the very center of it. "For the father himself loveth you, because ye have loved me" (<a onClick="return mV(\'Jhn\',16,27);">Joh 16:27</a>). Here phileo is used for love, indicating the fatherly affection of God for the believer in Christ, His Son. This is love in a more intense form than that spoken of for the world (<a onClick="return mV(\'Jhn\',3,16);">Joh 3:16</a>).<P>God loves the world (<a onClick="return mV(\'Jhn\',3,16);">Joh 3:16</a>; compare <a onClick="return mV(\'1Ti\',2,4);">1Ti 2:4</a>; <a onClick="return mV(\'2Pe\',3,9);">2Pe 3:9</a>). This is a wonderful truth when we realize what a world this is—a world of sin and corruption. This was a startling truth for Nicodemus to learn, who conceived of God as loving only the Jewish nation. To him, in his narrow exclusiveism, the announcement of the fact that God loved the whole world of men was startling. God loves the world of sinners lost and ruined by the fall. Yet it is this world, "weak," "ungodly," "without strength," "sinners" (<a onClick="return mV(\'Rom\',5,\'6-8\');">Ro 5:6-8</a>), "dead in trespasses and sins" (<a onClick="return mV(\'Eph\',2,1);">Eph 2:1</a> the King James Version), and unrighteous, that God so loved that He gave His only begotten Son in order to redeem it. The genesis of man\'s salvation lies in the love and mercy of God (<a onClick="return mV(\'Eph\',2,4);">Eph 2:4</a>f). But love is more than mercy or compassion; it is active and identifies itself with its object. The love of the heavenly Father over the return of His wandering children is beautifully set forth in the parable of the Prodigal Son (<a onClick="return mV(\'Luk\',15,1);">Lu 15</a>). Nor should the fact be overlooked that God loves not only the whole world, but each individual in it; it is a special as well as a general love (<a onClick="return mV(\'Jhn\',3,16);">Joh 3:16</a>, "whosoever"; <a onClick="return mV(\'Gal\',2,20);">Ga 2:20</a>, "loved me, and gave himself up for me").<P>2. Manifestations of God\'s Love:<P>God\'s love is manifested by providing for the physical, mental, moral and spiritual needs of His people (<a onClick="return mV(\'Isa\',48,14,20,21);">Isa 48:14,20,21</a>; <a onClick="return mV(\'Isa\',62,\'9-12\');">62:9-12</a>; <a onClick="return mV(\'Isa\',63,3,12);">63:3,12</a>). In these Scriptures God is seen manifesting His power in behalf His people in the time of their wilderness journeying and their captivity. He led them, fed and clothed them, guided them and protected them from all their enemies. His love was again shown in feeling with His people, their sorrows and afflictions (<a onClick="return mV(\'Isa\',63,9);">Isa 63:9</a>); He suffered in their affliction, their interests were His; He was not their adversary but their friend, even though it might have seemed to them as if He either had brought on them their suffering or did not care about it. Nor did He ever forget them for a moment during all their trials. They thought He did; they said, "God hath forgotten us," "He hath forgotten to be gracious"; but no; a mother might forget her child that she should not have compassion on it, but God would never forget His people. How could He? Had He not graven them upon the palms of His hands (<a onClick="return mV(\'Isa\',49,15);">Isa 49:15</a>f)? Rather than His love being absent in the chastisement of His people, the chastisement itself was often a proof of the presence of the Divine love, "for whom the Lord loveth he chasteneth, and scourgeth every son whom he receiveth" (<a onClick="return mV(\'Hbr\',12,\'6-11\');">Heb 12:6-11</a>). Loving reproof and chastisement are necessary oftentimes for growth in holiness and righteousness. Our redemption from sin is to be attributed to God\'s wondrous love; "Thou hast in love to my soul delivered it from the pit of corruption; for thou hast cast all my sins behind thy back" (<a onClick="return mV(\'Isa\',38,17);">Isa 38:17</a>; compare <a onClick="return mV(\'Psa\',50,21);">Ps 50:21</a>; <a onClick="return mV(\'Psa\',90,8);">90:8</a>). <a onClick="return mV(\'Eph\',2,4);">Eph 2:4</a>f sets forth in a wonderful way how our entire salvation springs forth from the mercy and love of God; "But God, being rich in mercy, for his great love wherewith he loved us, even when we were dead through our trespasses, made us alive together with Christ," etc. It is because of the love of the Father that we are granted a place in the heavenly kingdom (<a onClick="return mV(\'Eph\',2,\'6-8\');">Eph 2:6-8</a>). But the supreme manifestation of the love of God, as set forth in the Scripture, is that expressed in the gift of His only-begotten Son to die for the sins of the world (<a onClick="return mV(\'Jhn\',3,16);">Joh 3:16</a>; <a onClick="return mV(\'Rom\',5,\'6-8\');">Ro 5:6-8</a>; <a onClick="return mV(\'1Jo\',4,9);">1Joh 4:9</a>f), and through whom the sinful and sinning but repentant sons of men are taken into the family of God, and receive the adoption of sons (<a onClick="return mV(\'1Jo\',3,1);">1Joh 3:1</a>f; <a onClick="return mV(\'Gal\',4,\'4-6\');">Ga 4:4-6</a>). From this wonderful love of God in Christ Jesus nothing in heaven or earth or hell, created or uncreated or to be created, shall be able to separate us (<a onClick="return mV(\'Rom\',8,37);">Ro 8:37</a>f).<P>III. The Love of Man.<P>1. Source of Man\'s Love:<P>Whatever love there is in man, whether it be toward God or toward his fellowman, has its source in God—"Love is of God; and every one that loveth is begotten of God, and knoweth God. He that loveth not knoweth not God; for God is love" (<a onClick="return mV(\'1Jo\',4,7);">1Joh 4:7</a>f); "We love, because he first loved us" (<a onClick="return mV(\'1Jo\',4,19);">1Joh 4:19</a>). Trench, in speaking of agape, says it is a word born within the bosom of revealed religion. Heathen writers do not use it at all, their nearest approach to it being philanthropia or philadelphia—the love betweeen those of the same blood. Love in the heart of man is the offspring of the love of God. Only the regenerated heart can truly love as God loves; to this higher form of love the unregenerate can lay no claim (<a onClick="return mV(\'1Jo\',4,7,19,21);">1Joh 4:7,19,21</a>; <a onClick="return mV(\'1Jo\',2,\'7-11\');">2:7-11</a>; <a onClick="return mV(\'1Jo\',3,10);">3:10</a>; <a onClick="return mV(\'1Jo\',4,11);">4:11</a>f). The regenerate man is able to see his fellow-man as God sees him, value him as God values him, not so much because of what he is by reason of his sin and unloveliness, but because of what, through Christ, he may become; he sees man\'s intrinsic worth and possibility in Christ (<a onClick="return mV(\'2Cr\',5,\'14-17\');">2Co 5:14-17</a>). This love is also created in the heart of man by the Holy Ghost (<a onClick="return mV(\'Rom\',5,5);">Ro 5:5</a>), and is a fruit of the Spirit (<a onClick="return mV(\'Gal\',5,22);">Ga 5:22</a>). It is also stimulated by the example of the Lord Jesus Christ, who, more than anyone else, manifested to the world the spirit and nature of true love (<a onClick="return mV(\'Jhn\',13,34);">Joh 13:34</a>; <a onClick="return mV(\'Jhn\',15,12);">15:12</a>; <a onClick="return mV(\'Gal\',2,20);">Ga 2:20</a>; <a onClick="return mV(\'Eph\',5,\'25-27\');">Eph 5:25-27</a>; <a onClick="return mV(\'1Jo\',4,9);">1Joh 4:9</a>f).<P>2. Objects of Man\'s Love:<P>God must be the first and supreme object of man\'s love; He must be loved with all the heart, mind, soul and strength (<a onClick="return mV(\'Mat\',22,37);">Mt 22:37</a>f; <a onClick="return mV(\'Mar\',12,\'29-34\');">Mr 12:29-34</a>). In this last passage the exhortation to supreme love to God is connected with the doctrine of the unity of God (<a onClick="return mV(\'Deu\',6,4);">De 6:4</a>f)—inasmuch as the Divine Being is one and indivisible, so must our love to Him be undivided. Our love to God is shown in the keeping of His commandments (<a onClick="return mV(\'Exd\',20,6);">Ex 20:6</a>; <a onClick="return mV(\'1Jo\',5,3);">1Joh 5:3</a>; <a onClick="return mV(\'2Jo\',1,6);">2Joh 1:6</a>). Love is here set forth as more than a mere affection or sentiment; it is something that manifests itself, not only in obedience to known Divine commands, but also in a protecting and defense of them, and a seeking to know more and more of the will of God in order to express love for God in further obedience (compare <a onClick="return mV(\'Deu\',10,12);">De 10:12</a>). Those who love God will hate evil and all forms of worldliness, as expressed in the avoidance of the lust of the eyes, the lust of the flesh and the pride of life (<a onClick="return mV(\'Psa\',97,10);">Ps 97:10</a>; <a onClick="return mV(\'1Jo\',2,\'15-17\');">1Joh 2:15-17</a>). Whatever there may be in his surroundings that would draw the soul away from God and righteousness, that the child of God will avoid. Christ, being God, also claims the first place in our affections. He is to be chosen before father or mother, parent, or child, brother or sister, or friend (<a onClick="return mV(\'Mat\',10,\'35-38\');">Mt 10:35-38</a>; <a onClick="return mV(\'Luk\',14,26);">Lu 14:26</a>). The word "hate" in these passages does not mean to hate in the sense in which we use the word today. It is used in the sense in which Jacob is said to have "hated" Leah (<a onClick="return mV(\'Gen\',29,31);">Ge 29:31</a>), that is, he loved her less than Rachel; "He loved also Rachel more than Leah" (<a onClick="return mV(\'Gen\',29,30);">Ge 29:30</a>). To love Christ supremely is the test of true discipleship (<a onClick="return mV(\'Luk\',14,26);">Lu 14:26</a>), and is an unfailing mark of the elect (<a onClick="return mV(\'1Pe\',1,8);">1Pe 1:8</a>). We prove that we are really God\'s children by thus loving His Son (<a onClick="return mV(\'Jhn\',8,42);">Joh 8:42</a>). Absence of such love means, finally, eternal separation (<a onClick="return mV(\'1Cr\',16,22);">1Co 16:22</a>).<P>Man must love his fellow-man also. Love for the brotherhood is a natural consequence of the love of the fatherhood; for "In this the children of God are manifest, and the children of the devil: whosoever doeth not righteousness is not of God, neither he that loveth not his brother" (<a onClick="return mV(\'1Jo\',3,10);">1Joh 3:10</a>). For a man to say "I love God" and yet hate his fellowman is to brand himself as "a liar" (<a onClick="return mV(\'1Jo\',4,20);">1Joh 4:20</a>); "He that loveth not his brother whom he hath seen, cannot love God whom he hath not seen" (<a onClick="return mV(\'1Jo\',4,20);">1Joh 4:20</a>); he that loveth God will love his brother also (<a onClick="return mV(\'1Jo\',4,21);">1Joh 4:21</a>). The degree in which we are to love our fellow-man is "as thyself" (<a onClick="return mV(\'Mat\',22,39);">Mt 22:39</a>), according to the strict observance of law. Christ set before His followers a much higher example than that, however. According to the teaching of Jesus we are to supersede this standard: "A new commandment I give unto you, that ye love one another; even as I have loved you, that ye also love one another" (<a onClick="return mV(\'Jhn\',13,34);">Joh 13:34</a>). The exhibition of love of this character toward our fellow-man is the badge of true discipleship. It may be called the sum total of our duty toward our fellow-man, for "Love worketh no ill to his neighbor: love therefore is the fulfillment of the law"; "for he that loveth his neighbor hath fulfilled the law" (<a onClick="return mV(\'Rom\',13,8,10);">Ro 13:8,10</a>). The qualities which should characterize the love which we are to manifest toward our fellow-men are beautifully set forth in <a onClick="return mV(\'1Cr\',13,\'1-\');">1Co 13</a>. It is patient and without envy; it is not proud or self-elated, neither does it behave discourteously; it does not cherish evil, but keeps good account of the good; it rejoices not at the downfall of an enemy or competitor, but gladly hails his success; it is hopeful, trustful and forbearing—for such there is no law, for they need none; they have fulfilled the law.<P>Nor should it be overlooked that our Lord commanded His children to love their enemies, those who spoke evil of them, and despitefully used them (<a onClick="return mV(\'Mat\',5,\'43-48\');">Mt 5:43-48</a>). They were not to render evil for evil, but contrariwise, blessing. The love of the disciple of Christ must manifest itself in supplying the necessities, not of our friends only (<a onClick="return mV(\'1Jo\',3,\'16-18\');">1Joh 3:16-18</a>), but also of our enemies (<a onClick="return mV(\'Rom\',12,20);">Ro 12:20</a>f).<P>Our love should be "without hypocrisy" (<a onClick="return mV(\'Rom\',12,9);">Ro 12:9</a>); there should be no pretense about it; it should not be a thing of mere word or tongue, but a real experience manifesting itself in deed and truth (<a onClick="return mV(\'1Jo\',3,18);">1Joh 3:18</a>). True love will find its expression in service to man: "Through love be servants one to another" (<a onClick="return mV(\'Gal\',5,13);">Ga 5:13</a>). What more wonderful illustration can be found of ministering love than that set forth by our Lord in the ministry of foot-washing as found in <a onClick="return mV(\'Jhn\',13,\'1-\');">Joh 13</a>? Love bears the infirmities of the weak, does not please itself, but seeks the welfare of others (<a onClick="return mV(\'Rom\',15,\'1-3\');">Ro 15:1-3</a>; <a onClick="return mV(\'Phl\',2,21);">Php 2:21</a>; <a onClick="return mV(\'Gal\',6,2);">Ga 6:2</a>; <a onClick="return mV(\'1Cr\',10,24);">1Co 10:24</a>); it surrenders things which may be innocent in themselves but which nevertheless may become a stumbling-block to others (<a onClick="return mV(\'Rom\',14,15,21);">Ro 14:15,21</a>); it gladly forgives injuries (<a onClick="return mV(\'Eph\',4,32);">Eph 4:32</a>), and gives the place of honor to another (<a onClick="return mV(\'Rom\',12,10);">Ro 12:10</a>). What, then, is more vital than to possess such love? It is the fulfillment of the royal law (<a onClick="return mV(\'Jam\',2,8);">Jas 2:8</a>), and is to be put above everything else (<a onClick="return mV(\'Col\',3,14);">Col 3:14</a>); it is the binder that holds all the other graces of the Christian life in place (<a onClick="return mV(\'Col\',3,14);">Col 3:14</a>); by the possession of such love we know that we have passed from death unto life (<a onClick="return mV(\'1Jo\',3,14);">1Joh 3:14</a>), and it is the supreme test of our abiding in God and God in us (<a onClick="return mV(\'1Jo\',4,12,16);">1Joh 4:12,16</a>).``53';
isbe[5595]='Love, Brotherly``<a href="./study/isbe/search.html?string=BROTHERLY+LOVE">BROTHERLY LOVE</a>`1';
isbe[5596]='Love-Feast`luv\'-fest.`<a href="./study/isbe/search.html?string=AGAPE">AGAPE</a>`1';
isbe[5597]='Lovely`luv\'-li (\'ahabh, \'ahebh; prosphiles): "Lovely" occurs only 4 times. In <a onClick="return mV(\'2Sa\',1,23);">2Sa 1:23</a> it is the translation of \'ahebh, "to be loved" ("Saul and Jonathan were lovely and pleasant (the King James Version margin "sweet") in their lives"), where it seems to mean "loving" or "lovable." Two other words are so translated in the Old Testament: machmadch, "desire" a "desirable thing" (<a onClick="return mV(\'Sgs\',5,16);">So 5:16</a>, "He is altogether lovely," that is, "lovable," "to be desired," literally, "all of him lovableness," or "desirableness"); \'aghabhim "loves," or "charms" (<a onClick="return mV(\'Eze\',33,32);">Eze 33:32</a>, "Thou art unto them as a very lovely song," the King James Version margin "a song of loves," the Revised Version margin "a love-song"; in <a onClick="return mV(\'Eze\',33,31);">33:31</A> the same word is translated "much love," the King James Version margin "They make loves or jests"); in <a onClick="return mV(\'Phl\',4,8);">Php 4:8</a> we have prosphiles, "very lovely," or "lovable," "whatsoever things are lovely."``185';
isbe[5598]='Lover`luv\'-er (\'ohebh, \'ahebh): In the Old Testament \'ohebh, from \'ahebh, "to love," is sometimes "lover" in the sense of "friend," in the older English sense of the word (<a onClick="return mV(\'1Ki\',5,1);">1Ki 5:1</a>, "Hiram was ever a lover of David"; <a onClick="return mV(\'Psa\',38,11);">Ps 38:11</a>; <a onClick="return mV(\'Psa\',88,18);">88:18</a>; <a onClick="return mV(\'Lam\',1,2);">La 1:2</a>); more frequently it has the meaning of "lover" in the special sense, sometimes in the evil sense of the word (<a onClick="return mV(\'Jer\',22,20,22);">Jer 22:20,22</a>; <a onClick="return mV(\'Jer\',30,14);">30:14</a>; <a onClick="return mV(\'Eze\',16,33,36);">Eze 16:33,36</a>f; etc.; <a onClick="return mV(\'Hsa\',2,5,7,10);">Ho 2:5,7,10</a>, etc.); \'aghabh, "to love" (<a onClick="return mV(\'Jer\',4,30);">Jer 4:30</a>), rea\', "companion" (<a onClick="return mV(\'Jer\',3,1);">Jer 3:1</a>), and ahabhim, "loves" (<a onClick="return mV(\'Hsa\',8,9);">Ho 8:9</a>), are also translated "lovers" in this sense.<P>In the New Testament the simple word "lover" does not occur, but we have various compound words, philotheos "lover of God" (<a onClick="return mV(\'2Ti\',3,4);">2Ti 3:4</a>); philagathos, "lover of good," and philoxenos, "lover of hospitality" (<a onClick="return mV(\'Tts\',1,8);">Tit 1:8</a>); philautos, "lover of self" (<a onClick="return mV(\'2Ti\',3,2);">2Ti 3:2</a>); philedonos, "lover of pleasure" (<a onClick="return mV(\'2Ti\',3,4);">2Ti 3:4</a>).<P>In the Revised Version (British and American) we have, for "a lover of hospitality" (<a onClick="return mV(\'Tts\',1,8);">Tit 1:8</a>), "given to"; for "covetous" (<a onClick="return mV(\'Luk\',16,14);">Lu 16:14</a>; <a onClick="return mV(\'2Ti\',3,2);">2Ti 3:2</a>), "lovers of money"; for "not covetous" (<a onClick="return mV(\'1Ti\',3,3);">1Ti 3:3</a>), "no lover of money"; for "despisers of them that are good" (<a onClick="return mV(\'2Ti\',3,3);">2Ti 3:3</a>), "no lovers of good."``185';
isbe[5599]='Loves`luvz (<a onClick="return mV(\'Psa\',45,1);">Ps 45:1, title</a>).`<a href="./study/isbe/search.html?string=PSALMS">PSALMS</a>`1';
isbe[5600]='Lovingkindness`luv-ing-kind\'-nes (hecedh): "Lovingkindness" in the King James Version always represents this word (30 times), but of hecedh there are many other renderings, e.g. "mercy" (frequently), "kindness" (38 [times]), "goodness" (12 [times]). The word is derived from chacadh, meaning, perhaps, "to bend or bow oneself," "to incline oneself"; hence, "to be gracious or merciful." the English Revised Version has not many changes, but in the American Standard Revised Version "lovingkindness" is invariably employed when checedh is used of God, and, as a rule, "kindness" when it is used of man, as in <a onClick="return mV(\'Gen\',21,23);">Ge 21:23</a>; <a onClick="return mV(\'Jdg\',1,24);">Jud 1:24</a> (the King James Version "mercy," the Revised Version (British and American) "deal kindly"); <a onClick="return mV(\'Rth\',3,10);">Ru 3:10</a>; <a onClick="return mV(\'2Ch\',32,32);">2Ch 32:32</a>; <a onClick="return mV(\'2Ch\',35,26);">35:26</a> (the King James Version "goodness,"\'); margin "Hebrew: kindness" the Revised Version (British and American) "good deeds"); <a onClick="return mV(\'Job\',6,14);">Job 6:14</a>, etc. Of the uses of the word as on man\'s part toward God, the only occurrences are: <a onClick="return mV(\'Jer\',2,2);">Jer 2:2</a>, "I remember for thee the kindness of thy youth, the love of thine espousals," etc.; <a onClick="return mV(\'Hsa\',6,4,6);">Ho 6:4,6</a>, "Your goodness (the Revised Version margin "or kindness") is as a morning cloud," "I desire goodness (the King James Version "mercy," the Revised Version margin "Kindness"), and not sacrifice," which last passage may denote kindness as toward man.<P>When used of God checedh denotes, in general, "the Divine Love condescending to His creatures, more especially to sinners, in unmerited kindness" (Delitzsch). It is frequency associated with forgiveness, and is practically equivalent to "mercy" or "mercifulness" (<a onClick="return mV(\'Exd\',20,6);">Ex 20:6</a>), "showing lovingkindness (the English Revised Version "mercy") unto thousands of them that love me"; <a onClick="return mV(\'Exd\',34,6);">Ex 34:6</a>f; "slow to anger, and abundant in lovingkindness (the English Revised Version "plenteous in mercy")"; (<a onClick="return mV(\'Exd\',34,7);">34:7</A>) "keeping lovingkindness (the English Revised Version "mercy") for thousands, forgiving iniquity and transgression and sin" (compare <a onClick="return mV(\'Num\',14,18);">Nu 14:18</a>); <a onClick="return mV(\'Mic\',7,18);">Mic 7:18</a>, "He retaineth not his anger for ever, because he delighteth in lovingkindness" (the English Revised Version "mercy"). This quality in Yahweh was one by which He sought to bind His people to Himself. It is greatly magnified in the Old Testament, highly extolled and gloried in, in many of the psalms (<a onClick="return mV(\'Psa\',136,\'1-\');">Ps 136</a> has the constant refrain, "For his lovingkindness endureth forever"). In <a onClick="return mV(\'Deu\',7,12);">De 7:12</a> it is associated with the covenant, and in <a onClick="return mV(\'2Sa\',7,15);">2Sa 7:15</a> with the covenant with David (compare <a onClick="return mV(\'Isa\',55,3);">Isa 55:3</a>, etc.). It was something that could always be relied on.<P>Being such an essential and distinctive quality of God, the prophets taught that it should also characterize His people. It is part of the Divine requirement in <a onClick="return mV(\'Mic\',6,8);">Mic 6:8</a>, "to love kindness" (compare <a onClick="return mV(\'Zec\',7,9);">Zec 7:9</a>, "Show kindness and compassion every man to his brother"). The want of it in the nation was a cause of Yahweh\'s controversy with them, e.g. <a onClick="return mV(\'Hsa\',4,1);">Ho 4:1</a>, "There is no truth, nor goodness (checedh) (the King James Version and the English Revised Version "mercy"), nor knowledge of God in the land"; <a onClick="return mV(\'Hsa\',12,6);">Ho 12:6</a>, "Therefore turn thou to thy God: keep kindness (the King James Version and the English Revised Version "mercy") and justice, and wait for thy God continually." Cheyne (Encyclopedia Biblica) regards checedh as denoting paternal affection on God\'s part, answered by filial and loyal affection and brotherly love on man\'s part (philadelphia in the New Testament).<P>The word "lovingkindness" does not occur in the New Testament, but as its equivalents we have such terms as "mercy" "goodness," "kindness," "brotherly love" (see special articles).``185';
