ne to lime, the amount of time depending upon the size of the kiln and upon the nature of the fuel. At the present day, mineral coal imported from Europe is sometimes employed, and requires much less time than the shrubs which are ordinarily used.`<a href="./study/isbe/search.html?string=CHALKSTONE">CHALKSTONE</a>; <a href="./study/isbe/search.html?string=CLAY">CLAY</a>`37';
isbe[5539]='Limit`lim\'-it (gebhul, "bound"): Occurs once in <a onClick="return mV(\'Eze\',43,12);">Eze 43:12</a> ("limit" of holy mountain). "Limited" (<a onClick="return mV(\'Psa\',78,41);">Ps 78:41</a>) and "limiteth" (horizo, <a onClick="return mV(\'Hbr\',4,7);">Heb 4:7</a>) are changed in the Revised Version (British and American) to "provoked" (the margin retains "limited") and "defineth" respectively.``1';
isbe[5540]='Line`lin (qaw, chebhel): Usually of a measuring line, as <a onClick="return mV(\'Jer\',31,39);">Jer 31:39</a>; <a onClick="return mV(\'Eze\',47,3);">Eze 47:3</a>; <a onClick="return mV(\'Zec\',1,16);">Zec 1:16</a> (qaw); <a onClick="return mV(\'Psa\',78,55);">Ps 78:55</a>; <a onClick="return mV(\'Amo\',7,17);">Am 7:17</a>; <a onClick="return mV(\'Zec\',2,1);">Zec 2:1</a> (chebhel). Other Hebrew words mean simply a cord or thread (<a onClick="return mV(\'Jos\',2,18,21);">Jos 2:18,21</a>; <a onClick="return mV(\'1Ki\',7,15);">1Ki 7:15</a>; <a onClick="return mV(\'Eze\',40,3);">Eze 40:3</a>). In <a onClick="return mV(\'Psa\',19,4);">Ps 19:4</a> (qaw, "Their line is gone out through all the earth"), the reference is probably still to measurement (the heaven as spanning and bounding the earth), though the Septuagint, followed by <a onClick="return mV(\'Rom\',10,18);">Ro 10:18</a>, takes it as meaning a musical cord phthoggos). The "line," as measure, suggests rule of conduct (<a onClick="return mV(\'Isa\',28,10);">Isa 28:10</a>). For "line" in <a onClick="return mV(\'Isa\',44,13);">Isa 44:13</a>, the Revised Version (British and American) reads "pencil," margin "red ochre" (seredh), and in <a onClick="return mV(\'2Cr\',10,16);">2Co 10:16</a>, "province," margin "limit" (kanon).`<a href="./study/isbe/search.html?string=MEASURING+LINE">MEASURING LINE</a>; <a href="./study/isbe/search.html?string=WEIGHTS+AND+MEASURES">WEIGHTS AND MEASURES</a>`132';
isbe[5541]='Lineage`lin\'-e-aj (patria): Found only once in <a onClick="return mV(\'Luk\',2,4);">Lu 2:4</a> (the King James Version, the Revised Version (British and American) "family"), and signifying the line of paternal family descent. A word pregnant in meaning among the Jews, who kept all family records with religious care, as may be seen from the long genealogical records found everywhere in the Old Testament.``1';
isbe[5542]='Linen`lin\'-en (badh, "white linen," used chiefly for priestly robes, buts, "byssus," a fine white Egyptian linen, called in the earlier writings shesh; pesheth, "flax," cadhin; bussos, othonion, linon, sindon): Thread or cloth made of flax.<P>1. History:<P>Ancient Egypt was noted for its fine linen (<a onClick="return mV(\'Gen\',41,42);">Ge 41:42</a>; <a onClick="return mV(\'Isa\',19,9);">Isa 19:9</a>). From it a large export trade was carried on with surrounding nations, including the Hebrews, who early learned the art of spinning from the Egyptians (<a onClick="return mV(\'Exd\',35,25);">Ex 35:25</a>) and continued to rely on them for the finest linen (<a onClick="return mV(\'Pro\',7,16);">Pr 7:16</a>; <a onClick="return mV(\'Eze\',27,7);">Eze 27:7</a>). The culture of flax in Palestine probably antedated the conquest, for in <a onClick="return mV(\'Jos\',2,6);">Jos 2:6</a> we read of the stalks of flax which Rahab had laid in order upon the roof. Among the Hebrews, as apparently among the Canaanites, the spinning and weaving of linen were carried on by the women (<a onClick="return mV(\'Pro\',31,13,19);">Pr 31:13,19</a>), among whom skill in this work was considered highly praiseworthy (<a onClick="return mV(\'Exd\',35,25);">Ex 35:25</a>). One family, the house of Ashbea, attained eminence as workers in linen (<a onClick="return mV(\'1Ch\',4,21);">1Ch 4:21</a>; <a onClick="return mV(\'2Ch\',2,14);">2Ch 2:14</a>).<P>2. General Uses:<P>Linen was used, not only in the making of garments of the finer kinds and for priests, but also for shrouds, hangings, and possibly for other purposes in which the most highly prized cloth of antiquity would naturally be desired.<P>3. Priestly Garments:<P>The robes of the Hebrew priests consisted of 4 linen garments, in addition to which the high priest wore garments of other stuffs (<a onClick="return mV(\'Exd\',28,\'1-\');">Ex 28</a>; <a onClick="return mV(\'Exd\',39,\'1-\');">39</a>; <a onClick="return mV(\'Lev\',6,10);">Le 6:10</a>; <a onClick="return mV(\'Lev\',16,4);">16:4</a>; <a onClick="return mV(\'1Sa\',22,18);">1Sa 22:18</a>; <a onClick="return mV(\'Eze\',44,17,18);">Eze 44:17,18</a>). Egyptian priests are said to have worn linen robes (Herod. ii.37). In religious services by others than priests, white linen was also preferred, as in the case of the infant Samuel (<a onClick="return mV(\'1Sa\',2,18);">1Sa 2:18</a>), the Levite singers in the temple (<a onClick="return mV(\'2Ch\',5,12);">2Ch 5:12</a>), and even royal personages (<a onClick="return mV(\'2Sa\',6,14);">2Sa 6:14</a>; <a onClick="return mV(\'1Ch\',15,27);">1Ch 15:27</a>). Accordingly, it was ascribed to angels (<a onClick="return mV(\'Eze\',9,2,3,11);">Eze 9:2,3,11</a>; <a onClick="return mV(\'Eze\',10,2,6,7);">10:2,6,7</a>; <a onClick="return mV(\'Dan\',10,5);">Da 10:5</a>; <a onClick="return mV(\'Dan\',12,6,7);">12:6,7</a>). Fine linen, white and pure, is the raiment assigned to the armies which are in heaven following Him who is called Faithful and True (<a onClick="return mV(\'Rev\',19,14);">Re 19:14</a>). It is deemed a fitting symbol of the righteousness and purity of the saints (<a onClick="return mV(\'Rev\',19,8);">Re 19:8</a>).<P>4. Other Garments:<P>Garments of distinction were generally made of the same material: e.g. those which Pharaoh gave Joseph (<a onClick="return mV(\'Gen\',41,42);">Ge 41:42</a>), and those which Mordecai wore (<a onClick="return mV(\'Est\',8,15);">Es 8:15</a>; compare also <a onClick="return mV(\'Luk\',16,19);">Lu 16:19</a>). Even a girdle of fine linen could be used by a prophet as a means of attracting attention to his message (<a onClick="return mV(\'Jer\',13,1);">Jer 13:1</a>). It is probable that linen wrappers of a coarser quality were used by men (<a onClick="return mV(\'Jdg\',14,12,13);">Jud 14:12,13</a>) and women (<a onClick="return mV(\'Pro\',31,22);">Pr 31:22</a>). The use of linen, however, for ordinary purposes probably suggested unbecoming luxury (<a onClick="return mV(\'Isa\',3,23);">Isa 3:23</a>; <a onClick="return mV(\'Eze\',16,10,13);">Eze 16:10,13</a>; compare also <a onClick="return mV(\'Rev\',18,12,16);">Re 18:12,16</a>). The poorer classes probably wore wrappers made either of unbleached flax or hemp (Ecclesiasticus 40:4; <a onClick="return mV(\'Mar\',14,51);">Mr 14:51</a>). The use of a mixture called sha\'atnez, which is defined (<a onClick="return mV(\'Deu\',22,11);">De 22:11</a>) as linen and wool together, was forbidden in garments.<P>5. Shrouds:<P>The Egyptians used linen exclusively in wrapping their mummies (Herod. ii.86). As many as one hundred yards were used in one bandage. Likewise, the Hebrews seem to have preferred this material for winding-sheets for the dead, at least in the days of the New Testament (<a onClick="return mV(\'Mat\',27,59);">Mt 27:59</a>; <a onClick="return mV(\'Mar\',15,46);">Mr 15:46</a>; <a onClick="return mV(\'Luk\',23,53);">Lu 23:53</a>; <a onClick="return mV(\'Jhn\',19,40);">Joh 19:40</a>; <a onClick="return mV(\'Jhn\',20,5);">20:5</a>) and the Talmud (Jerusalem Killayim 9:32b).<P>6. Hangings:<P>The use of twisted linen (shesh moshzar) for fine hangings dates back to an early period. It was used in the tabernacle (<a onClick="return mV(\'Exd\',26,1);">Ex 26:1</a>; <a onClick="return mV(\'Exd\',27,9);">27:9</a>; <a onClick="return mV(\'Exd\',35,\'1-\');">35</a>; <a onClick="return mV(\'Exd\',36,\'1-\');">36</a>; <a onClick="return mV(\'Exd\',38,\'1-\');">38</a>; Josephus, Ant, III, vi, 2), in the temple (<a onClick="return mV(\'2Ch\',3,14);">2Ch 3:14</a>), and no doubt in other places (Mishna, Yoma\', iii. 4). Linen cords for hangings are mentioned in the description of the palace of Ahasuerus at Shushan (<a onClick="return mV(\'Est\',1,6);">Es 1:6</a>).<P>7. Other Uses:<P>Other uses are suggested, such as for sails, in the imaginary ship to which Tyre is compared (<a onClick="return mV(\'Eze\',27,7);">Eze 27:7</a>), but judging from the extravagance of the other materials in the ship, it is doubtful whether we may infer that such valuable material as linen was ever actually used for this purpose. It is more likely, however, that it was used for coverings or tapestry (<a onClick="return mV(\'Pro\',7,16);">Pr 7:16</a>), and possibly in other instances where an even, durable material was needed, as in making measuring lines (<a onClick="return mV(\'Eze\',40,3);">Eze 40:3</a>).``80';
isbe[5543]='Lintel`lin\'-tel.`<a href="./study/isbe/search.html?string=HOUSE">HOUSE</a>`1';
isbe[5544]='Linus`li\'-nus (Linos (<a onClick="return mV(\'2Ti\',4,21);">2Ti 4:21</a>)): One of Paul\'s friends in Rome during his second and last imprisonment in that city. He was one of the few who remained faithful to the apostle, even when most of the Christians had forsaken him. And writing to Timothy when he realized that his execution could not be very far distant—for he was now ready to be offered, and the time of his departure was at hand (<a onClick="return mV(\'2Ti\',4,6);">2Ti 4:6</a>)—he sends greeting to Timothy from four friends whom he names, and Linus is one of them. There is a tradition that Linus was bishop of the church at Rome. "It is perhaps fair to assume, though of course there is no certainty of this, that the consecration of Linus to the government of the Roman church as its first bishop was one of the dying acts of the apostle Paul" (H.D.M. Spence, in Ellicott\'s New Testament Commentary on 2 Tim).<P>Irenaeus—bishop of Lyons about 178 AD—in his defense of orthodox doctrine against the Gnostics "appeals especially to the bishops of Rome, as depositories of the apostolic tradition." The list of Irenaeus commences with Linus, whom he identifies with the person of this name mentioned by Paul, and whom he states to have been "entrusted with the office of the bishopric by the apostles ..... With the many possibilities of error, no more can safely be assumed of Linus...than that he held some prominent position in the Roman church" (Lightfoot\'s "Dissertation on the Christian Ministry," in Commentary on Phil, 220f).<P>"Considering the great rarity of this Greek mythological name as a proper name for persons, we can hardly doubt that here, as Irenaeus has directly asserted, the same Roman Christian is meant who, according to ancient tradition, became after Peter and Paul the first bishop of Rome. Among the mythical characters in Apostolical Constitutions, vii, 46 occurs Linos ho Klaudias, who is declared to have been ordained by Paul as the first bishop of Rome. He is thus represented as the son or husband of the Claudia whose name comes after his in <a onClick="return mV(\'2Ti\',4,21);">2Ti 4:21</a>.<P>"These meager statements have been enlarged upon by English investigators. The Claudia mentioned here is, they hold, identical with the one who, according to Martial, married a certain Pudens (85-90 AD), and she, in turn, with the Claudia Rufina from Britain, who is then made out to be a daughter of the British king, Cogidumnus, or Titus Claudius Cogidubnus. For a refutation of these assumptions, which, even chronologically considered, are impossible, see Lightfoot, Clement, I, 76-79" (Zahn, Introduction to the New Testament, 20).``155';
isbe[5545]='Lion`li\'-un:<P>(1) Occurring most often in the Old Testament is \'aryeh, plural \'ardyoth. Another form, \'ari, plural \'arayim, is found less often.<P>1. Names:<P>Compare \'ari\'el, "Ariel" (<a onClick="return mV(\'Ezr\',8,16);">Ezr 8:16</a>; <a onClick="return mV(\'Isa\',29,1,2,7);">Isa 29:1,2,7</a>); char\'el, "upper altar," and \'ari\'el, "altar hearth" (<a onClick="return mV(\'Eze\',43,15);">Eze 43:15</a>); \'aryeh, "Arieh" (<a onClick="return mV(\'2Ki\',15,25);">2Ki 15:25</a>); \'ar\'eli, "Areli" and "Arelites" (<a onClick="return mV(\'Gen\',46,16);">Ge 46:16</a>; <a onClick="return mV(\'Num\',26,17);">Nu 26:17</a>).<P>(2) kephir, "young lion," often translated "lion" (<a onClick="return mV(\'Psa\',35,17);">Ps 35:17</a>; <a onClick="return mV(\'Pro\',19,12);">Pr 19:12</a>; <a onClick="return mV(\'Pro\',23,1);">23:1</a>, etc.).<P>(3) shachal, translated "fierce lion" or "lion" (<a onClick="return mV(\'Job\',4,10);">Job 4:10</a>; <a onClick="return mV(\'Job\',10,16);">10:16</a>; <a onClick="return mV(\'Job\',28,8);">28:8</a>; <a onClick="return mV(\'Hsa\',5,14);">Ho 5:14</a>).<P>(4) layish, translated "old lion" or "lion" (<a onClick="return mV(\'Job\',4,11);">Job 4:11</a>; <a onClick="return mV(\'Pro\',30,30);">Pr 30:30</a>; <a onClick="return mV(\'Isa\',30,6);">Isa 30:6</a>).<P>Compare Arabic laith, "lion": layish, "Laish," or "Leshem" (<a onClick="return mV(\'Jos\',19,47);">Jos 19:47</a>; <a onClick="return mV(\'Jdg\',18,7,14,27,29);">Jud 18:7,14,27,29</a>); layish, "Laish" (<a onClick="return mV(\'1Sa\',25,44);">1Sa 25:44</a>; <a onClick="return mV(\'2Sa\',3,15);">2Sa 3:15</a>).<P>(5) lebhi, plural lebha\'im, "lioness", also labhi\', and \'lebhiya\' (<a onClick="return mV(\'Gen\',49,9);">Ge 49:9</a>; <a onClick="return mV(\'Num\',23,24);">Nu 23:24</a>; <a onClick="return mV(\'Num\',24,9);">24:9</a>); compare town in south of Judah, Lebaoth (<a onClick="return mV(\'Jos\',15,32);">Jos 15:32</a>) or Beth-lebaoth (<a onClick="return mV(\'Jos\',19,6);">Jos 19:6</a>); also Arabic labwat, "lioness "; Lebweh, a town in Coele-Syria.<P>(6) aur, gor, "whelp," with \'aryeh or a pronoun, e.g. "Judah is a lion\'s whelp," gur \'aryeh (<a onClick="return mV(\'Gen\',49,9);">Ge 49:9</a>); "young ones" of the jackal (<a onClick="return mV(\'Lam\',4,3);">La 4:3</a>). Also bene labhi\', "whelps (sons) of the lioness" (<a onClick="return mV(\'Job\',4,11);">Job 4:11</a>); and kephir \'arayoth, "young lion," literally, "the young of lions" (<a onClick="return mV(\'Jdg\',14,5);">Jud 14:5</a>). In <a onClick="return mV(\'Job\',28,8);">Job 28:8</a>, the King James Version has "lion\'s whelps" for bene shachats, the Revised Version (British and American) "proud beasts." the Revised Version margin "sons of pride"; compare <a onClick="return mV(\'Job\',41,34);">Job 41:34 (Hebrew 26)</a>.<P>(7) leon, "lion" (<a onClick="return mV(\'2Ti\',4,17);">2Ti 4:17</a>; <a onClick="return mV(\'Hbr\',11,33);">Heb 11:33</a>; <a onClick="return mV(\'1Pe\',5,8);">1Pe 5:8</a>; <a onClick="return mV(\'Rev\',4,7);">Re 4:7</a>; <a onClick="return mV(\'Rev\',5,5);">5:5</a>; The <span class="noTag">Wisdom of Solomon 11:17; Ecclesiasticus 4:30; 13:19; Bel and the Dragon 31,32,34</span>).<P>(8) skumnos, "whelp" (1Macc 3:4).<P>2. Natural History:<P>The lion is not found in Palestine at the present day, though in ancient times it is known to have inhabited not only Syria and Palestine but also Asia Minor and the Balkan peninsula, and its fossil remains show that it was contemporary with prehistoric man in Northwestern Europe and Great Britain. Its present range extends throughout Africa, and it is also found in Mesopotamia, Southern Persia, and the border of India. There is some reason to think that it may be found in Arabia, but its occurrence there remains to be proved. The Asiatic male lion does not usually have as large a mane as the African, but both belong to one species, Fells leo.<P>3. Figurative:<P>Lions are mentioned in the Bible for their strength (<a onClick="return mV(\'Jdg\',14,18);">Jud 14:18</a>), boldness (<a onClick="return mV(\'2Sa\',17,10);">2Sa 17:10</a>), ferocity (<a onClick="return mV(\'Psa\',7,2);">Ps 7:2</a>), and stealth (<a onClick="return mV(\'Psa\',10,9);">Ps 10:9</a>; <a onClick="return mV(\'Lam\',3,10);">La 3:10</a>). Therefore in prophetical references to the millennium, the lion, with the bear, wolf, and leopard, is mentioned as living in peace with the ox, calf, kid, lamb and the child (<a onClick="return mV(\'Psa\',91,13);">Ps 91:13</a>; <a onClick="return mV(\'Isa\',11,\'6-8\');">Isa 11:6-8</a>; <a onClick="return mV(\'Isa\',65,25);">65:25</a>). The roaring of the lion is often mentioned (<a onClick="return mV(\'Job\',4,10);">Job 4:10</a>; <a onClick="return mV(\'Psa\',104,21);">Ps 104:21</a>; <a onClick="return mV(\'Isa\',31,4);">Isa 31:4</a> (the Revised Version (British and American) "growling"); <a onClick="return mV(\'Jer\',51,38);">Jer 51:38</a>; <a onClick="return mV(\'Eze\',22,25);">Eze 22:25</a>; <a onClick="return mV(\'Hsa\',11,10);">Ho 11:10</a>). Judah is a "lion\'s whelp" (<a onClick="return mV(\'Gen\',49,9);">Ge 49:9</a>), likewise Dan (<a onClick="return mV(\'Deu\',33,22);">De 33:22</a>). It is said of certain of David\'s warriors (<a onClick="return mV(\'1Ch\',12,8);">1Ch 12:8</a>) that their "faces were like the faces of lions." David\'s enemy (<a onClick="return mV(\'Psa\',17,12);">Ps 17:12</a>) "is like a lion that is greedy of his prey." "The king\'s wrath is as the roaring of a lion" (<a onClick="return mV(\'Pro\',19,12);">Pr 19:12</a>). God in His wrath is "unto Ephraim as a lion, and as a young lion to the house of Judah" (<a onClick="return mV(\'Hsa\',5,14);">Ho 5:14</a>). "The devil, as a roaring lion, walketh about, seeking whom he may devour" (<a onClick="return mV(\'1Pe\',5,8);">1Pe 5:8</a>). "Lion" occurs in the figurative language of Ezekiel, Daniel, and Revelation. The figures of lions were used in the decorations of Solomon\'s temple and throne (<a onClick="return mV(\'1Ki\',7,29,36);">1Ki 7:29,36</a>; <a onClick="return mV(\'1Ki\',10,19);">10:19</a>f).<P>4. Narrative:<P>Nearly all references to the lion are figurative. The only notices of the lion in narrative are of the lion slain by Samson (<a onClick="return mV(\'Jdg\',14,5);">Jud 14:5</a>); by David (<a onClick="return mV(\'1Sa\',17,34);">1Sa 17:34</a>f); by Benaiah (<a onClick="return mV(\'2Sa\',23,20);">2Sa 23:20</a>; <a onClick="return mV(\'1Ch\',11,22);">1Ch 11:22</a>); the prophet slain by a lion (<a onClick="return mV(\'1Ki\',13,24);">1Ki 13:24</a>; also <a onClick="return mV(\'1Ki\',20,36);">1Ki 20:36</a>); the lions sent by the Lord among the settlers in Samaria (<a onClick="return mV(\'2Ki\',17,25);">2Ki 17:25</a>); Daniel in the lions\' den (<a onClick="return mV(\'Dan\',6,16);">Da 6:16</a>). In all these cases the word used is \'aryeh or \'ari.<P>5. Vocabulary:<P>The Arabic language boasts hundreds of names for the lion. Many of these are, however, merely adjectives used substantively. The commonest Arabic names are sab\', \'asad, laith, and labwat, the last two of which are identified above with the Hebrew layish and labhi\'. As in Arabic, so in Hebrew, the richness of the language in this particular gives opportunity for variety of expression, as in <a onClick="return mV(\'Job\',4,10,11);">Job 4:10,11</a>:<P class="in15">"The roaring of the lion (\'aryeh), and the voice of the fierce lion (shachal),<br>And the teeth of the young lions (kephirim), are broken.<br>The old lion (layish) perisheth for lack of prey,<br>And the whelps of the lioness (bene labhi\') are scattered abroad."<P>In <a onClick="return mV(\'Jdg\',14,\'5-18\');">Jud 14:5-18</a>, no less than three different terms, kephir \'arayoth, aryeh, and \'ari, are used of Samson\'s lion.``37';
isbe[5546]='Lip`(saphah, sepheth, "lip," "language," "speech," "talk" (also "rim," "border," "shore," "bank," etc.), sapham, "(upper) lip," "moustache," "beard"; cheilos, "lip" (also once, "shore" in the quotation <a onClick="return mV(\'Hbr\',11,12);">Heb 11:12</a> equals <a onClick="return mV(\'Gen\',22,17);">Ge 22:17</a>)):<P>(1) Lips stand in oriental idiom for speech or language, like "mouth," "tongue"; therefore they stand in parallelism. "The lip of truth shall be established for ever; but a lying tongue is but for a moment" (<a onClick="return mV(\'Pro\',12,19);">Pr 12:19</a>). "To shoot out the lip" (<a onClick="return mV(\'Psa\',22,7);">Ps 22:7</a>) means to make a mocking, contemptuous, scornful face. As the lips are the chief instrument of speech, we find numerous idiomatic phrases for "speaking," such as: "the utterance of the lips" (<a onClick="return mV(\'Num\',30,6,8);">Nu 30:6,8</a>), "to proceed out of the lips" (<a onClick="return mV(\'Num\',30,12);">Nu 30:12</a>), "to open the lips" (<a onClick="return mV(\'Job\',32,20);">Job 32:20</a>), "to go out of the lips" (<a onClick="return mV(\'Psa\',17,1);">Ps 17:1</a>). These expressions do not convey, as a rule, the idea that the utterance proceeds merely out of the lips, and that it lacks sincerity and the consent of the heart, but occasionally this is intended, e.g. "This people draw nigh unto me, and with their mouth and with their lips do honor me, but have removed their heart far from me" (<a onClick="return mV(\'Isa\',29,13);">Isa 29:13</a>; compare <a onClick="return mV(\'Mat\',15,8);">Mt 15:8</a>). The "fruit of the lips" (<a onClick="return mV(\'Isa\',57,19);">Isa 57:19</a> equals <a onClick="return mV(\'Hbr\',13,15);">Heb 13:15</a>) and "calves of the lips" (<a onClick="return mV(\'Hsa\',14,2);">Ho 14:2</a> the King James Version) designate the praise and thanksgiving due to God. "Fervent (the King James Version "burning") lips" (<a onClick="return mV(\'Pro\',26,23);">Pr 26:23</a>) are synonymous with eloquence. "To refrain the lips" (<a onClick="return mV(\'Psa\',40,9);">Ps 40:9</a>; <a onClick="return mV(\'Pro\',10,19);">Pr 10:19</a>) means to keep silence, where the godless or unwise would wish to assert his rights.<P>Numerous other expressions need no further explanation, such as "perverse lips" (<a onClick="return mV(\'Pro\',4,24);">Pr 4:24</a>), "uncircumcised lips" (<a onClick="return mV(\'Exd\',6,12,30);">Ex 6:12,30</a>), "feigned lips" (<a onClick="return mV(\'Psa\',17,1);">Ps 17:1</a>), "lying lips" (<a onClick="return mV(\'Psa\',31,18);">Ps 31:18</a>; <a onClick="return mV(\'Pro\',10,18);">Pr 10:18</a>; <a onClick="return mV(\'Pro\',12,22);">12:22</a>), "wicked (or false) lips" (<a onClick="return mV(\'Pro\',17,4);">Pr 17:4</a>), "unclean lips" (<a onClick="return mV(\'Isa\',6,5);">Isa 6:5</a>), "strange (the King James Version "stammering") lips" (<a onClick="return mV(\'Isa\',28,11);">Isa 28:11</a>), "flattering lips" (<a onClick="return mV(\'Psa\',12,2,3);">Ps 12:2,3</a>; <a onClick="return mV(\'Pro\',7,21);">Pr 7:21</a>), "righteous lips" (<a onClick="return mV(\'Pro\',16,13);">Pr 16:13</a>).<P>(2) The Hebrew word sapham is found only in the phrase "to cover the lip or lips," which is an expression of mourning, submission and shame. The Oriental covers his lips with his hand or a portion of his garment, when he has been sunk into deep grief and sorrow. He expresses, thereby, that he cannot open his mouth at the visitation of God. Differently, however, from common mourners, Ezekiel was forbidden of God "to cover his lips" (<a onClick="return mV(\'Eze\',24,17);">Eze 24:17</a>; see also <a onClick="return mV(\'Eze\',24,22);">Eze 24:22</a>), i.e. to mourn in the usual way over Israel\'s downfall, as Israel had brought these judgments upon himself. The leper, victim of an incurable disease, walks about with rent clothes and hair disheveled, covering his lips, crying: "Unclean, unclean!" (<a onClick="return mV(\'Lev\',13,45);">Le 13:45</a>). The thought here is that even the breath of such a one may defile. The prophet calls upon all seers and diviners, to whom God has refused the knowledge of the future, to cover their lips in shame and confusion (<a onClick="return mV(\'Mic\',3,7);">Mic 3:7</a>).``106';
isbe[5547]='Liquor`lik\'-er: Every sort of intoxicating liquor except the beverage prepared from the juice of the grape (yayin), according to the usage of the Old Testament, is comprehended under the generic term shekhar (compare shakhar, to "be drunk"), rendered "strong drink" (compare Greek sikera in <a onClick="return mV(\'Luk\',1,15);">Lu 1:15</a>). The two terms, yayin and shekhar, "wine" and "strong drink," are often found together and are used by Old Testament writers as an exhaustive classification of the beverages in use among the ancient Hebrews (<a onClick="return mV(\'Lev\',10,9);">Le 10:9</a>; <a onClick="return mV(\'1Sa\',1,15);">1Sa 1:15</a>; <a onClick="return mV(\'Pro\',20,1);">Pr 20:1</a>, etc.).`<a href="./study/isbe/search.html?string=WINE">WINE</a>; <a href="./study/isbe/search.html?string=DRINK,+STRONG">DRINK, STRONG</a>`1';
isbe[5548]='List`A variant of "lust" (see <a href="./study/isbe/search.html?string=LUST">LUST</a>), meaning "to wish," found in the King James Version of <a onClick="return mV(\'Mat\',17,12);">Mt 17:12</a> parallel <a onClick="return mV(\'Mar\',9,13);">Mr 9:13</a>; <a onClick="return mV(\'Jhn\',3,8);">Joh 3:8</a>, as translation of thelo, and in <a onClick="return mV(\'Jam\',3,4);">Jas 3:4</a> as translation of boulomai. The last case the English Revised Version has rendered "will," and the American Standard Revised Version has made the same change throughout. The word is obsolete in modern English, but <a onClick="return mV(\'Jhn\',3,8);">Joh 3:8</a> is still used proverbially, "The wind bloweth where it listeth."``1';
isbe[5549]='Literature, Sub-Apostolic, 1`lit\'-er-a-tur, sub-ap-os-tol\'-ik (Christian):<P><b>I. EPISTLE OF CLEMENT TO THE CORINTHIANS</b><P class="in15">1. Authorship and Date<P class="in15">2. Occasion and Contents<P class="in15">3. Apologetic Testimony<P class="in15">4. Doctrinal Testimony<P class="in15">5. Office-Bearers and Organization<P class="in15">6. Ritual<P><b>II. THE DIDACHE</b><P class="in15">1. Disappearance and Recovery<P class="in15">2. Date<P class="in15">3. Standpoint, Authorship and Object<P class="in15">4. Testimony to New Testament Writings<P class="in15">5. Contents and Notabilia<P><b>III. EPISTLES OF IGNATIUS</b><P class="in15">1. Author and Date<P class="in15">2. Genuineness<P class="in15">3. Leading Ideas<P class="in15">4. Other Notabilia<P><b>IV. EPISTLES OF POLYCARP</b><P class="in15">1. Date and Genuineness<P class="in15">2. Occasion and Contents<P class="in15">3. Notabilia<P><b>V. PAPIAS FRAGMENTS</b><P class="in15">1. Author and Date<P class="in15">2. Testimony to Matthew and Mark<P class="in15">3. Other Notabilia<P><b>VI. EPISTLE OF BARNABAS</b><P class="in15">1. Authorship<P class="in15">2. Date<P class="in15">3. Object and Contents<P class="in15">4. Notabilia<P><b>VII. PASTOR (SHEPHERD) OF HERMAS</b><P class="in15">1. Authorship and Date<P class="in15">2. Object and Contents<P class="in15">3. Notabilia<P><b>VIII. SECOND EPISTLE OF CLEMENT</b><P class="in15">1. Nature and Document<P class="in15">2. Date and Authorship<P class="in15">3. Contents<P class="in15">4. Notabilia<P><b>IX. APOLOGY OF ARISTIDES</b><P class="in15">1. Recovery and Date<P class="in15">2. Contents<P class="in15">3. Notabilia<P><b>X. JUSTIN MARTYR</b><P class="in15">1. Incidents of Life<P class="in15">2. First Apology<P class="in15">3. Second Apology<P class="in15">4. Dialogue with Trypho the Jew<P class="in15">5. Notabilia<P><b>XI. EPISTLE TO DIOGNETUS</b><P class="in15">1. Date and Authorship<P class="in15">2. Contents<P><b>LITERATURE</b><hr /><P>The Sub-apostolic Age is usually held to extend from the death of John, the last surviving apostle, about 100 AD, to the death of Polycarp, John\'s aged disciple (155-56 AD). The Christian literature of this period, although as a whole of only moderate intrinsic value, is of historical interest and importance. This is owing to the light which it throws back on apostolic times, and the testimony borne to Christian life, thought, worship, work and organization during an age when the church was under the guidance, mainly, of men who had been associated with the apostles and who might be supposed, therefore, to know their mind. Some writings are omitted from this review, having been dealt with in previous articles. For the Protevangelium of James and the Gospel and Apocalypse of Peter see <a href="./study/isbe/search.html?string=APOCRYPHAL+GOSPELS">APOCRYPHAL GOSPELS</a>; <a href="./study/isbe/search.html?string=APOCRYPHAL+ACTS">APOCRYPHAL ACTS</a>. For an account of extant fragments of Basilides and Valentinus, see <a href="./study/isbe/search.html?string=GNOSTICISM">GNOSTICISM</a>. For pseudo-Clementine writings see <a href="./study/isbe/search.html?string=PETER,+EPISTLES+OF">PETER, EPISTLES OF</a>; <a href="./study/isbe/search.html?string=SIMON+MAGUS">SIMON MAGUS</a>.<P>I. Epistle of Clement to the Corinthians.<P>1. Authorship and Date:<P>Only the larger part had previously been extant, when the complete epistle was recovered in 1875 by Bryennios, bishop of Nicomedia. The high honor in which it was held by early Christendom is attested<P>(1) by its position in Codex Alexandrinus, at the end of the New Testament, and in an ancient Syriac MS, between the Catholic and Pauline Epistles;<P>(2) by its being publicly read in many churches down to the 4th century.<P>(Historia Ecclesiastica, III, 16). The work is anonymous, but sent in the name of the Roman church. Dionysius of Corinth (170 AD) refers to it as written by the agency of (dia) Clement (Historia Ecclesiastica, IV, 23); Clement of Alexandria states distinctly the Clementine authorship (Strom., iv.17). The writer is evidently leading office-bearer of his church, and is identified with the Clement whom Eusebius designates as third "bishop" (or chief presbyter) of Rome after Peter, and as holding office between 92 and 101 AD (Historia Ecclesiastica, III, 34). Clement is further identified by Origen (Commentary on John) and in HE, III, 15 with the Clement of <a onClick="return mV(\'Phl\',4,3);">Php 4:3</a>; but the name is too common and the interval too long to render this identity more than possible. Some conjecture the writer to be the consul, Flavius Clemens, whom Domitian (his cousin) put to death in 95 AD for alleged "atheism," i.e. probably, profession of Christianity (see Harnack, Gesch. Lit., I,253,note 1). But Clement the "bishop" is never otherwise referred to as a martyr, and a member of the imperial family would hardly have been head of the Roman church without so signal a fact being noted by some contemporary or later writer. Lightfoot, with some probability, supposes (Apostolic Fathers, I, 61) that Clement was a "freedman or the son of freedman, belonging to the household of Flavius Clemens." From Paul\'s time (<a onClick="return mV(\'Phl\',4,22);">Php 4:22</a>) the imperial household included Christians; and many slaves were men of culture. To such a Christian freedman\'s influence the consul\'s conversion may have been due. Internal evidence points to Clement having been a Hellenist Jew or proselyte of Judaism; for he writes with some classical culture and with knowledge of Old Testament history and of the Septuagint; his style, moreover, has a "strong Hebraistic tinge" (Lightfoot, p. 59). The date of the epistle is fixed approximately by a reference to a persecution at Rome in progress or very recent; this persecution (during Clement\'s "episcopate") was doubtless that by Domitian in 95 AD. Clement\'s Epistle is thus not strictly within the Sub-apostolic Age, but it is uniformly included in sub-apostolic literature.<P>2. Occasion and Contents:<P>The occasion was a church feud at Corinth, and the expulsion of some faithful presbyters. The writer seeks to procure their restoration and to heal the dissension. He quotes Old Testament examples of the evil issue of envy and strife, and of the blessedness of humility, submission and concord. He adduces as a pattern the peace and harmony of Nature. In this connection occurs an anticipation of geographical discovery, when the author writes (chapter xx) of "the impassable ocean and the worlds beyond it" (compare Seneca, Medea ii.375; Strabo i.4; Plut. Mor. ix.41). Paul\'s warnings in 1 Corinthians about party spirit are recalled; a not unworthy echo of <a onClick="return mV(\'1Cr\',13,\'1-\');">1Co 13</a> is embodied; and the erring community is solemnly monished.<P>In the course of the letter, with obvious reference to <a onClick="return mV(\'1Cr\',15,\'1-\');">1Co 15</a>, Clement introduces the resurrection, for which he argues from the Old Testament and from natural analogies. He refers to the phoenix which lives 500 years, and, when dissolution approaches, builds a nest of spices into which it enters to die. As the flesh decays, however, a "worm is generated, which is nurtured from the dead bird\'s moisture and putteth forth wings." The fable is mentioned by Herodotus and Pliny.<P>A lengthy prayer of intercession for "all sorts and conditions of men" is abruptly introduced near the end, in order, presumably, to imbue Corinthian Christians with that charity which they needed and which is the chief incentive to intercession. The epistle closes with a hopeful anticipation of restored concord and peace.<P>3. Apologetic Testimony:<P>Apologetic testimony is found to (1) books of the New Testament, namely, to the Pauline authorship of I Corinthians; to Mark\'s Gospel, through which (chapter xv) he quotes <a onClick="return mV(\'Isa\',29,13);">Isa 29:13</a>, reproducing Mark\'s variations from the Septuagint; to Acts, through which he similarly quotes (chapter xviii) <a onClick="return mV(\'1Sa\',13,14);">1Sa 13:14</a>; to Romans, Ephesians, 1 Timothy, Titus, James, 1 Peter (chapters xxxv, xlvi, xxi, ii, xlvi, xlix, respectively). The parallels between Clement and He are so numerous that the latter work has from early times been ascribed to him by some (Historia Ecclesiastica, VI, 25). But the general type both of thought and of diction is dissimilar; (2) against the Tubingen theory of essential divergence between the doctrine of Peter and of Paul. The chief presbyter of Rome could not have been ignorant of such divergence; yet he refers the partisanship of which the two apostles were victims entirely to the Corinthians, not at all to the apostles (chapter xlix).<P>4. Doctrinal Testimony:<P>Doctrinal testimony is found:<P>(1) to the Trinity, "As God liveth and the Lord Jesus Christ liveth, and the Holy Spirit" (chapter lviii);<P>(2) to the personality of Christ, "The Lord Jesus Christ, to whom be the glory and the majesty forever." In union and communion with Christ we have life, are sanctified, possess love, manifest godliness (chapter i, xxxvi);<P>(3) to the atonement: Clement ascribes to Christ\'s death not merely subjective moral influence, but objective vicarious efficacy in securing our salvation, without any attempt, however, to explain the mystery. Christ hath "given his flesh for our flesh, his life for our lives" (chapter xlix);<P>(4) to justification which is distinctly enunciated as before God through faith (chapter xxxii). But this faith (as in Paul\'s writings) is a "faith which worketh" (chapter xxxv), and such justification is consistent with our being justified by works before men;<P>(5) to the inspiration of Scripture, which is real ("the Holy Spirit saith"), but not verbal; for quotations are often inexact. Apocryphal books are quoted, but not with a formula indicating Divine authority.<P>5. Office-Bearers and Organization:<P>(1) The basis of authority is not sacerdotal, but a combination of official succession and popular call; office-bearers are appointed "by the apostles or afterward by men of repute with consent of the whole ecclesia."<P>(2) Clement indicates no distinction between presbyter and bishop. Office-bearers designated as presbyters (chapters xlvii, liv) are referred to (chapters xlii, xliv) as filling the office of bishop. Addressing a church on congregational strife and insubordination, he refers to no single bishop in authority over the church. Had the episcopate, in the post-New Testament sense of mono-episcopate, been apostolically enjoined, surely the injunction would have been obeyed or enforced in Corinth.<P>(3) None the less we discern in Clement\'s own position and action the anticipation of the later episcopate. Clement is an example of how, through the personal qualities and ecclesiastical services of the man, the status of presiding presbyter developed out of seniority into superiority, out of representativeness into official authority.<P>(4) The early germ of the papacy is disclosed in the passage: "If certain persons should be disobedient unto the words spoken by God through us, let them understand that they will entangle themselves in no slight transgression and peril" (chapter lix). Such assumption by a revered man like Clement might give no offense, and the Corinthians plainly needed correction. Still we have here the first stage in the process which ultimately issued in the Roman claim to universal spiritual supremacy. The assumption, however, is not grounded on Clement\'s own official position (he speaks always in the 1st person plural), but on the superior dignity of the Roman church. The later theory of supremacy builds Roman authority on the primacy of Peter and his successors; but here the authority of the leading presbyter, in dealing with a provincial church, rests on the suggested primacy of the ecclesia in which he presides.<P>6. Ritual:<P>(1) The long prayer (chapters lix-lxi) bears internal evidence of liturgical character, through its balanced and rhythmical style, its somewhat remote relevance to the special object of the ep., and greater suitability for congregational worship, than as part of a counsel to a sister church. This internal testimony is confirmed by the correspondence of the prayer in certain verbal details with the earliest extant liturgies, particularly those of Mark and James, pointing to the early use in the Roman church of forms of prayer afterward incorporated into these liturgies. While there is evidence that down at least to the time (148 AD) of Justin\'s 1st Apology (chapter lxvii) a minister offered up prayers of his own composition, this prayer of Clement\'s Epistle indicates that before the close of the Apostolic Age, forms of supplication had begun to be introduced, not to the exclusion of "free prayer," but simply as a mode of congregational devotion countenanced by a venerated leader of the church at Rome.<P>(2) In chapter lvi Clement writes about "compassionate remembrance of them (i.e. the erring brethren) before God and the saints." By the saints, however, are most probably meant, not the beatified dead, but the living Christian brotherhood, as in <a onClick="return mV(\'1Cr\',1,2);">1Co 1:2</a>; <a onClick="return mV(\'2Cr\',8,4);">2Co 8:4</a>.<P>This epistle leaves on readers\' minds two different yet mutually compatible impressions—impressions both apparently made on the early church, by which the letter was widely read at public worship and yet excluded from the Canon of Scriptures. We realize, on the one hand, the inferiority of this writing to epistles of apostles. Clement\'s mind is receptive, not creative; and the freshness of thought characteristic of New Testament writers is absent. What New Testament book, moreover, contains such a foolish legend as that of the phoenix? On the other hand, this epistle breathes much of the spirit, as it adopts in considerable measure the phraseology and style of apostolic writings. It is as if, although the sun of special inspiration had sunk below the horizon, there remained to the church for a while a spiritual afterglow.<P>II. The "Didache"<P>1. Disappearance and Recovery:<P>The "Didache" or Teaching (longer title, "The Teaching of the Lord, by (dia) the Twelve Apostles, to the Gentiles").—This work is quoted as "Scripture," without being named, by Clement of Alexandria (circa 170 AD, in Strom., i. 20). It is mentioned in HE, III, 25 as the "Teachings so-called of the Apostles," "recognized by most ecclesiastical writers," although "not a genuine" composition of apostles. Athanasius (Fest. Epistle, 39) denies its canonicity, but acknowledges its utility. The latest ancient reference to the work from personal knowledge is by Nicephoros (9th century) who includes it among apocryphal writings. Thenceforth it disappears until its recent recovery in 1875 by Bryennios.<P>2. Date:<P>There is no reliable external testimony to date. Resemblances too considerable to be accidental exist between the Didache and the Epistle of Barnabas; but opinion is divided as to priority of composition. Lightfoot and others favor a common lost source. As to internal evidence the simplicity of the Eucharist and of baptism as here described, with no formal admission to the catechumenate (chapter vii); the use of "bishop" to denote the same office-bearer as presbyter; and the expectation of an impending Second Advent—point to an early date. On the other hand it is unlikely that a writing which professes to give the Teaching of the Twelve would be issued until all or most apostles had passed away; and the writer seems to be acquainted with writings of John (Didache, ix.2; x.2; x.5; see Schaff, Oldest Church Manual, 90). Probably the document went through a series of recensions (Harnack in Sch-Herz; Bertlet in DB, V), and the date or dates of composition may be put between 80 and 120 AD.<P>3. Standpoint, Authorship and Object:<P>The work does not profess to be written by apostles; but the author seems to be a Jewish Christian, for he calls Friday "Preparation Day," and the style and diction are Hebraic. The work is neither Judaistic nor Ebionite: circumcision, the Sabbath, and special Mosaic observances, are ignored. From the book in whole or in part being addressed specially, although not exclusively, to Gentiles, we infer that the community among whom it was composed, while mainly Jewish Christian, made special provision for conversion and instruction of Gentiles. The doctrinal standpoint is neither Pauline nor anti-Pauline, but resembles that of James. Canon Spence (Teaching) conjectures plausibly that the author may be Simeon, cousin of James the Lord\'s brother, who became chief presbyter of the Jewish Christian community, first at Jerusalem, afterward at Pella, until his martyrdom in 107 AD.<P>4. Testimony to New Testament Writings:<P>Mt was certainly in the writer\'s hands; for the Didache contains 22 quotations from, or reminiscences of, that Gospel, extending over ten chapters of it. Particularly notable is Didache, viii.2, "Neither pray ye as the hypocrites, but as the Lord commanded in His Gospel; after this manner pray ye, Our Father," etc. (see also vii.1; ix.5; xvi.6). There are also references to the Gospel of Luke (Didache, iii.5, 16); John\'s writings (see above); Acts (Didache, iv.8), Romans (Didache, iv.5), 2 Thessalonians (Didache, xiv.1), 1 Peter (Didache, i.4). No extra-canonical saying of our Lord is recorded.<P>5. Contents and Notabilia:<P>The contents and notabilia may be examined as follows:<P>(1) Didactic (Chapters i through vi):<P>Intended for catechumens in preparation for baptism. This catechetical manual (the earliest of its kind) opens with the words: "There are two ways: one of life and one of death" (suggested probably by <a onClick="return mV(\'Jer\',21,8);">Jer 21:8</a>). From this text the writer gives a summary of Christian duty especially toward our neighbor, based on the Decalogue, the Golden Rule, and the Sermon on the Mount, which is frequently quoted.<P>Among notable precepts is a command to fast as well as pray for enemies; a warning against infanticide which, in the case of sickly infants, heathenism approved, and against augury and astrology as generating idolatry; an admonition not to" stretch out one\'s hands for receiving and to draw them in for giving"; an injunction to " share all things with thy brethren, and not to say that they are thine own"; a command to "love some above thine own life"; and a quaint corrective against indiscriminate and ill-informed beneficence: "Let thine alms sweat into thy hands until thou know to whom thou shouldest give." A precept to "give with thy hands a ransom for sin" may not mean more than that sinful habits are subdued by good works, but it suggests and paves the way for the error of the atoning efficacy of almsgiving. The summary of duty relates chiefly to the second Table of the Law; duty toward God is afterward (so far) dealt with under "worship." This may account for obedience to parents being strangely omitted; for among the Jews the Fifth Commandment was included in the First Table.<P>(2) Devotional: Worship and Rites (Chapters vii through x, xiv).<P>The Lord\'s Prayer is to be used thrice a day. "Heaven" and "debt" are found instead of "heavens" and "debts." The Doxology is added (with "kingdom" omitted)—its earliest recorded use in this connection. Christians are to fast on Wednesday and Friday, the days of the betrayal and crucifixion. Fasting is enjoined for a day or two before baptism, both on baptizer and on baptized; it is recommended to "others who can." There is no mention of oil, salt, or exorcism. The baptismal formula, "In the name of the Father, the Son, and the Holy Ghost," is commanded, confirming the historical trustworthiness of <a onClick="return mV(\'Mat\',28,19);">Mt 28:19</a>. Triple immersion in "living water" is assumed to be normal; but where this is impracticable, other water and affusion are permitted (see <a href="./study/isbe/search.html?string=TRINE+IMMERSION">TRINE IMMERSION</a>). The Lord\'s Supper is dealt with only on its eucharistic side, the writer\'s object being not to expound the nature of the rite, but to give models of thanksgiving.<P>The phrase, "after being filled give thanks," suggests that the Agape was still associated with the sacrament: the dissociation had begun when Pliny wrote to Trajan in 112 AD. A liturgical element in sacramental worship is indicated by the prescription of forms of thanksgiving for the cup, the broken bread, and spiritual mercies. "Give thanks thus." The thanksgiving for the cup is as follows: "We give thanks to thee our Father, for the holy vine of David, thy servant, which thou hast made known to us through Jesus Christ." But nothing suggests that the entire service is liturgical, and the forms supplied are not rigidly imposed; for prophets are to offer thanks in such terms as they choose. On the Lord\'s Day congregational worship and eucharistic bread-breaking, after confession to God and reconciliation with men, are distinctly enjoined.<P>(3) Ecclesiastical (Chapters xi through xiii, xv).<P>Of church office-bearers, two classes are mentioned, ordinary and extraordinary. Of the former (essential to congregational organization) only bishops and deacons are mentioned, i.e. those entrusted with rule and oversight, with their assistants. Presbyter and bishop appear to be still identical, as the former is not specified (compare <a onClick="return mV(\'Phl\',1,1);">Php 1:1</a>). Popular election of these functionaries is indicated: "Elect for yourselves"; without denial, however, of those already in office having a share in the settlement. In the second class, apostles, prophets and teachers are included. "Apostle" is used, not in the narrower sense of men called to the office personally by Christ, but in the wider sense which embraces all whose call to be His ambassadors has been signalized by Divine gifts-specially accredited evangelists unconnected with any particular community. (Among Jewish Christians the designation survived to the 4th century, for the Theodosian Code of that period refers to Jewish presbyters and to those "quos ipsi apostolos vocant.") These apostles were to be received as the Lord," and hospitably entertained; but, unlike apostles in the special sense, they were not to remain anywhere longer than "one or two days." Their function was to scatter the seed widely, and any expression of desire to remain longer was to be discouraged, while a demand for salary from a particular community would be evidence of false apostleship. The special function of prophets and teachers, on the other hand, was the instruction and comfort of church members. They accordingly might be encouraged to settle in a community and receive "first-fruits" for their support. These prophets and teachers, however, were not to supersede the "bishops" or presbyters in ruling, but were to undertake only those functions for which they were specially qualified. On the other hand, bishops and deacons were not to be excluded from preaching and teaching by the settlement of prophets and official teachers in particular communities; and in the Didache may be traced the transition, then being gradually accomplished, of the preaching and teaching functions from extraordinary to ordinary office-bearers. "They also (the bishops and deacons) minister to you the ministry of prophets and teachers: therefore despise them not." Even before the close of Paul\'s ministry, the episkopos, whose essential function was rule and oversight, was expected, if not required, also to be didatikos, "qualified to teach," i.e. along with teachers specially set apart for the purpose (<a onClick="return mV(\'1Ti\',3,2);">1Ti 3:2</a>; <a onClick="return mV(\'1Ti\',5,17);">5:17</a>). By the middle of the 2nd century, the prophets had disappeared, and their preaching function had been vested in the office of bishop or presbyter, assisted by the diaconate.<P>(4) Eschatological (Chapter xvi).<P>This concluding section consists chiefly of exhortations to watchfulness in view of the Second Advent. The premonitory signs of that Coming are given, with reminiscences from Christ\'s eschatological discourses, namely, rise of false prophets, decline of love, persecution, lawlessness, and the appearance of Antichrist, who is designated the World-deceiver. Without definitely stating chiliastic doctrine, the writer suggests it; for in referring to the immediate signals of Christ\'s advent (opening in heaven, voice of trumpet, resurrection of dead) he is careful to add "Not of all the dead; but the Lord shall come, and all the saints with Him"—implying that the general resurrection would take place at an after-stage, presumably, as Millennialists held, after the 1,000 years had expired. Without dogmatic authority, and with only moderate spiritual value, the Didache is important historically as a witness to the church\'s beliefs, usages and condition during the transition between the Apostolic and the Post-apostolic Age. During that transition period, we see much of the freedom of primitive Christianity mingled with rudiments of ecclesiastical regulations and formularies; and while we cannot assume that every belief and usage recorded in the Didache were sanctioned by apostles, we may reasonably ascribe them to apostolic times, and regard them as not opposed by those apostles within whose view they must have come.<P>III. Epistles of Ignatius.<P>1. Author and Date:<P>Ignatius was bishop of Antioch early in the 2nd century Origen (Hom. vi on Luke) refers to him as "second after Peter"; Euodius came between (Historia Ecclesiastica, III, 22). As he calls himself ektroma, "untimely born" (compare <a onClick="return mV(\'1Cr\',15,8);">1Co 15:8</a>), he was probably converted in mature life: the legend of his being the "child" of <a onClick="return mV(\'Mat\',18,3);">Mt 18:3</a> rests on misinterpretation of his designation "Theophotos." Traditions current in the 4th century represent him as a disciple of John (Eusebius, Chron.) and ordained by Paul (Apostolical Constitutions, vii.46).<P>The Martyrium of Ignatius (6th century) dates his trial at Antioch in the 9th year of Trajan\'s reign (107-8 AD) and represents it as conducted before the emperor. Only one visit, however, of Trajan to Antioch is known, in 114-15; neither any Ignatian letter nor Eusebius, nor any other early writer refers to so memorable a circumstance as the presidency of an emperor over a Christian\'s trial, and Ignatius speaks of a proposed attempt by Roman friends to secure a reversal of the sentence, which would have been impossible had Trajan personally pronounced it. His alleged presence, therefore, must be rejected as a later embellishment.<P>The epistles, so far as genuine, were written after Ignatius\' condemnation, on his way to martyrdom at Rome.<P>2. Genuineness:<P>The epistles are extant in 3 editions:<P>(1) the longer Greek, of 15 letters now admitted to be largely spurious;<P>(2) a Syriac recension of three letters, now generally held to be a mere epitome;<P>(3) the shorter Greek edition, containing 7 letters of intermediate length, to the Ephesians, Magnesians, Trallians, Philadelphians, Smyrneans, Romans, and Polycarp. Lightfoot, Zahn, and most recent critics accept the substantial genuineness of these seven.<P>The chief external evidence is that of Polycarp (Phil., xiii), who, soon after Ignatius\' death, writes of a letter addressed to himself, of another to the Smyrneans, and of "all the rest which we have by us." Now 2 Ignatian epistles are addressed to Polycarp and the Christians of Smyrna, while 4 profess to be written by Ignatius at Smyrna, harmonizing well with copies of these being in Polycarp\'s possession.<P>Further external evidence is supplied by Irenaeus (v.29) who quotes a saying from Ignat., Romans, iv, as that of a martyr, and who uses 8 notable phrases borrowed apparently from Ignatius. This external testimony (only got rid of by an arbitrary assumption of Polycarp\'s Epistle being wholly or partly spurious) is supported by strong internal and cumulative evidence:<P>(1) Frequent Grammatical Dislocation:<P>Natural in letters written on a journey but unaccountable on the supposition of a later forgery (Rom., i; Mag., ii; Eph., i).<P>(2) Geographical Particulars:<P>E.g. Ignatius goes by land from Antioch to Smyrna—an unusual route which a forger would hardly invent.<P>(3) Historical Illustrations:<P>E.g. conveyance of prisoners from distant provinces to Rome harmonizes with the account by Dion Cassius (lxviii.15) of the magnitude of amphitheatrical exhibitions under Trajan causing extensive orders for human victims from all parts.<P>(4) Theological Evidence:<P>E.g. these epistles refer to Judaistic error combined with a type of doctrine denying any real incarnation—a combination which ceased after Ignatius\' time.<P>(5) Ecclesiastical Usage:<P>Thus, the Agape still includes the Eucharist (Smyr., viii), whereas soon after Ignatius\' death these were separated (Pliny, Epistle 96; Just., 1 Ap., 65,67).<P>(6) Personal References.<P>The writer shows an excess and affectation of self-depreciation—"last of Antiochene Christians" (Trall., xiii) "not worthy to be counted one of the brotherhood" (Rom., ix)—such as a later forger would hardly have introduced.<P>3. Leading Ideas:<P>(1) Joy and Glory of Martyrdom.<P>Heroic courage and loyalty to Christ are united with fanatical craving after a martyr\'s death: "I would rather die for Christ than reign over the whole earth" (Rom., vi); "He who is near the sword is near to God" (Smyr., iv). This is noble; but when he writes, "Entice wild beasts to become my sepulchre" (Rom., iv); "May I have joy of the wild beasts and find them prompt"; "Though they be unwilling I will force them" (Rom., iv.5), we realize how Aurelius (recalling perhaps some such case) was moved to write that "death was to be encountered, not as by the Christians like a military display, but solemnly, and not as if one acted in a tragedy" (Med. xi.3).<P>(2) Evil and Peril of Heresy and Schism.<P>"Abstain from heresy"; "These heretics mix up Jesus Christ with their own poison" (Trall., vi); "Flee those evil outshoots, which produce death-bearing fruit" (Trall., xi); "Avoid all divisions as the beginning of evils"; "Nothing is better than unity" (To Polyc., i; Phil., iii).<P>(3) Submission to Office-Bearers, Especially to the Bishop.<P>"Do nothing without your bishop, and be subject to the presbyters" (Mag., vii); "Be on your guard against heresy: and this will be, if ye continue in intimate union with Christ and with the bishop"; "He who does anything without the bishop\'s knowledge serveth the devil" (Smyr., ix). The bishop here is higher than "primus inter pares"; he is a new and separate office-bearer. Yet, without going beyond these epistles, we discern that such an episcopate was not an express apostolic institution. For had Ignatius been able to magnify the office as apostolically enjoined, so zealous a champion of episcopal authority would have adduced such injunction as the most cogent reason for submission. His zeal for the episcopate apparently sprang only from its high ecclesiastical expediency as the most effective agency for maintaining the church\'s unity against heresy and schism.<P>4. Other Notabilia:<P>(1) References to the Gospel of John.<P>The Gospel of John is never quoted, but numerous phrases suggest that it was in the writer\'s hands. He speaks of Christ "proceeding from the Father," "doing nothing without the Father," "in all things pleasing Him who sent Him." Christ is the "Door of the Father" and "Living water." Satan is the" Prince of this world." "The Holy Spirit knoweth whence He cometh and whither He goeth."<P>(2) Doctrine.<P>Ignatius asserts emphatically Christ\'s true Divinity: "Our God" (Eph., xviii; Trall, vii). The Trinity is frequently suggested, although not expressly affirmed. Christians are "established in the Son, the Father, and the Spirit"; "subject to Christ and the Father, and the Spirit." With strong support of episcopal authority no sacerdotalism is united. "Priest" occurs only once, "The priests are good: but Christ, the High Priest, is better." Here, as the context shows, the imperfect Levitical priesthood is contrasted with perfect high-priesthood of Christ.<P>(3) Ecclesiastical Usage.<P>Ignatius contains one of the latest references to the Agape as still conjoined with the Eucharist. The letter to Polycarp (chapter iv) contains the earliest allusion to the practice of redeeming Christian slaves at the cost of the congregation. Slaves are not to "long to be set free," thus implying that such emancipation, while not required as a duty, was often conferred as a privilege.<P>(4) General Characteristics.<P>Ignatius presents striking contrast, as a writer, to Clement. Clement is calm, cultured, chaste in diction, but somewhat commonplace and deficient in originality; his best passages are echoes of Scripture. The diction and style of Ignatius are impassioned, rugged, turgid, but pithy, fresh and individualistic.<P>IV. Epistles of Polycarp.<P>1. Date and Genuineness:<P>Polycarp was born not later, perhaps considerably earlier, than 70 AD; for at his martyrdom, of which the now accepted date is 155 or 156 (Lightfoot, Apostolic Fathers, II, i, 629), he declared, when invited to abjure his faith, that he had "served Christ for 86 years" (Mart. Pol., ix). He was disciple of John, who ordained him as bishop or leading presbyter of Smyrna before 100 AD (Iren., iii.3, 4). Of several letters by Polycarp, only this epistle remains: it professes (chapter xiii) to have been written soon after the martyrdom of Ignatius. The genuineness of the letter is attested by Irenaeus, Polycarp\'s own disciple (in the place cited), whose evidence cannot be set aside on the ground of its testimony to the Ignatian letters without an obvious begging of the question. The supposition that the Ignatian letters and Polycarp\'s Epistle are parts of one great forgery is otherwise negatived by the very marked difference of style and standpoint between those writings (Lightfoot, l.c., 577).<P>2. Occasion and Contents:<P>The epistle replies to a letter from the Philippian church inviting his counsel, and asking for epistles of the recently martyred Ignatius. He acknowledges their kind ministry to that martyr and to others, "entwined with saintly fetters," who had "set a pattern of all patience." He sends what he has of the letters of Ignatius and asks in return for any information which they might possess. He commends to their careful study Paul\'s epistle to themselves, acknowledging his inability to attain to the apostle\'s wisdom. With much Scripture language, interwoven with his own matter, and giving to his letter the semblance of an apostolic echo, he exhorts his readers to righteousness and godliness, charity and mercy, and warns them against covetousness, evil-speaking and revenge. He dwells on the mutual relations and obligations of presbyters and deacons, on the one hand, and of the congregation on the other. He repeats John\'s admonition against teachers who denied the reality of the incarnation: "Every spirit that confesseth not," etc. (<a onClick="return mV(\'1Jo\',4,3);">1Joh 4:3</a>). He grieves over the lapse of a Philippian presbyter, Valens, who, along with his wife had flagrantly sinned; but he bids his readers not count such as enemies, but seek to recall them from their wanderings.<P>3. Notabilia:<P>(1) Polycarp mentions only one book of the New Testament, namely, Philippians, but within the brief compass of 200 lines he quotes verses or reproduces phrases from 12 New Testament writings, Matthew, 1 Peter, 1 John, and 9 Pauline Epistles, including three whose early date has been disputed in modern times (1 and 2 Timothy and Ephesians). The absence of any quotation from the Gospel of John is notable, considering his relation to the apostle; but the shortness of the letter prevents any conclusion being drawn against the authenticity of that Gospel; and he quotes (as we have seen) from 1 John, which is a kind of appendix to the Gospel (Lightfoot).<P>(2) At a time when Ignatius had been emphasizing the paramount duty of submission to the bishop, Polycarp, even when enjoining subjection to presbyters, does not mention a bishop. These two inferences are irresistible:<P>(a) there was then no episkopos, in the post-New Testament, sense, at Philippi;<P>(b) Polycarp did not consider the defect (?) sufficiently important to ask the Philippians to supply it.<P>Had John instituted the mono-episcopate as the one proper form of church government, surely his disciple Polycarp would have embraced the opportunity, when the Philippians invited his counsel, to inform them of the apostolic ordinance, and to enjoin its adoption.``1';
isbe[5550]='Literature, Sub-Apostolic, 2`V. Papias Fragments.<P>1. Author and Date:<P>Papias is called by his younger contemporary Irenaeus (v.33) a "disciple of John and friend of Polycarp." Eusebius writes (Historia Ecclesiastica, III, 36) that he was episkopos of Hierapolis in Phrygia. The Chronicon Paschale (7th century, but embodying materials from older documents) states that he was martyred about the same time as Polycarp (155-56). His work, Exposition of our Lord\'s Sayings, was extant in the 13th century, but only fragments quoted by Irenaeus, Eusebius, etc., remain. These bear out the twofold description of Papias by Eusebius, as a "man of little judgment" yet "most learned and well acquainted with the Scriptures" (Historia Ecclesiastica, III,39,36). (But the words of praise in verse 36 may be a gloss.) Papias states that he subjoins to his expositions "whatsoever I learned carefully from the elders and treasured up in my memory...I was wont to put questions regarding the words of the elders (i.e. presumably men of an earlier generation), what Andrew or Peter said, or what Philip or Thomas, or James, or what John or Matthew, or any other of the Lord\'s disciples said, as well as regarding what Aristion, and the presbyter John, the disciple of the Lord, have to say."<P>It is disputed whether Papias here refers to two Johns, the apostle and another disciple of the same name; or to John the apostle in two different relations, i.e. first as one about whose testimony Papias heard from others, and second, as one with whom, also, he held personal communication. In favor of the first view is,<P>(1) Eusebius\' own opinion (in the place cited);<P>(2) the alleged unlikelihood of the same John being twice mentioned in one sentence;<P>(3) a statement by Eusebius (Historia Ecclesiastica, III, 39) that in his day two monuments (mnemata) of "John" existed at Ephesus.<P>For the latter view is,<P>(1) no other writer until Eusebius hints the existence of a presbyter John distinct from the apostle;<P>(2) the change in the quotation from "said" to "say" seems to give a reason for John being twice mentioned; some things stated by John having been heard by Papias through "elders," others having been told him by the apostle himself.<P>The fact that John is called presbyter, instead of apostle, is no insuperable objection, since John so designates himself in 2 John and 3 John; and Jerome denies that the two mnemata were both tombs. See Lightfoot, Essay on Papias, and Nicol, Four Gospels, 187 if, who come to divergent conclusions.<P>2. Testimony to Matthew and Mark:<P>On the testimony to Matthew and Mark see <a href="./study/isbe/search.html?string=MATTHEW,+THE+GOSPEL+OF">MATTHEW, THE GOSPEL OF</a>; <a href="./study/isbe/search.html?string=MARK,+THE+GOSPEL+ACCORDING+TO">MARK, THE GOSPEL ACCORDING TO</a>.<P>3. Other Notabilia:<P>(1) According to Eusebius, Papias relates the story of "a woman accused before our Lord"—the story, presumably, which eventually crept into <a onClick="return mV(\'Jhn\',8,\'1-\');">Joh 8</a>; so that to him, in part, is due the preservation of a narrative, which, whether historical or not, finely illustrates the union in our Lord of holy purity and merciful charity.<P>(2) Papias is quoted by the Chronicler Georgius Hamartolos (in a manuscript of the 9th century) as declaring in his Expositon that John "was put to death by the Jews," and a similar quotation is made by Philip of Side (Epitome manuscript of the 7th-8th centuries). On the bearing of this upon the question of the apostle\'s residence at Ephesus see <a href="./study/isbe/search.html?string=JOHN,+THE+APOSTLE">JOHN, THE APOSTLE</a>.<P>(3) Irenaeus (v.32) quotes Papias as writing about a Post-resurrection millennium, and as reporting, on John\'s authority, how the Lord said, "The days will come when vines shall grow having each 10,000 branches, and on each branch 10,000 twigs, and on each twig 10,000 shoots," etc. This may be an exaggerated record (misunderstood by Papias) of some parabolic utterance of Christ, indicating prophetically the wonderful extension of the church.<P>VI. Epistle of Barnabas.<P>1. Authorship:<P>This book is first expressly quoted by Clement of Alexandria (circa 190 AD) as the composition of Barnabas, companion of Paul (Strom., ii.6). Origen concurs, and calls it a "Catholic ep." (Con. Celsum, i.63), thus suggesting canonical position; Eusebius (Historia Ecclesiastica, III, 25) testifies to the widespread ascription of it to this Barnabas, although he himself regards it as "spurious." Codex Sinaiticus places it immediately after the New Testament, as being read in churches, and thus suggests its composition by a companion at least of apostles. Against this external testimony, however, to authorship by the Barnabas of Acts, is strong internal evidence:<P>(1) apostolic sinfulness prior to discipleship is spoken of in exaggerated terms hardly credible in a writer who knew the Twelve—"exceedingly lawless beyond all (ordinary) sin" (chapter v)—an echo apparently of Paul\'s "sinners of whom I am chief";<P>(2) ignorance of Jewish rites incomprehensible in a Levite who had lived in Jerusalem, e.g. the priests are said to eat goat\'s flesh on the great Day of Atonement;<P>(3) extreme anti-Judaism (see below), inconsistent with the representation of Barnabas in Acts and Galatians.<P>The writer may have been some other Barnabas, a converted Alexandrian Jew, or, more probably, a converted Gentile proselyte, trained in Philo\'s school, but ignorant of Jewish rites as practiced at Jerusalem, and possessing little real sympathy with Judaism.<P>2. Date:<P>The epistle must be dated after 70 AD, as the destruction of Jerusalem is referred to (chapter xvi); also after the publication of the Gospel of John, of which there are several reminiscences. But the absence of any reference to the rebuilding of Jerusalem under Hadrian, in 120 AD, in a passage (chapter xvi) where such allusion might have been expected, suggests a date prior to that year. We may place the writing between 90 and 120 AD.<P>3. Object and Contents:<P>The object is to deter both Jewish and Gentile Christians from Judaistic lapse by a bold application of the allegorizing method to the Old Testament, far beyond what Philo would have sanctioned. Jewish sacrifices, festivals, Sabbath enactments, temple-worship, distinction of clean and unclean food, are not only not of perpetual obligation, but never were binding at all, even on Jews. Belief in their obligatoriness rests on a slavishly liberal exegesis of the Old Testament, which, properly interpreted, is not a preparation for Christ but Christianity itself in allegorical disguise.<P>Ceremonies are simply allegorical enforcements of spiritual worship; distinctions of clean and unclean are merely pictorial representations of the necessity of separation from vice and vicious men; interdict of swine\'s flesh means no more than "associate not with swinish men." The only circumcision really commanded by God is circumcision of the heart. Barnabas ignores what Paul realized, that Jewish laws and rites, even literally interpreted, are a Divine discipline of wholesome self-restraint, neighborly consideration and obedience to God. Barnabas not only explains away Old Testament enactments, but finds in trivial Old Testament statements Christian fact and truth. Thus, in Abraham\'s circumcision of the 318 men of his house, the 10 and 8 are significantly denoted by the Greek letters "I" and "H", the initial letters of Iesous (Jesus); while the 300 represented by the Greek "T", points to the cross. The writer self-complacently intimates that "no one has been admitted by me to a more genuine piece of knowledge than this!" (chapter ix).<P>When Barnabas, however, leaves obscure allegory for plain exhortation, he writes effectively of the "two ways" of light and darkness. Among edifying admonitions the following are outstanding: "Thou shalt not go to prayer with an evil conscience"; "Thou shalt not let the word of God issue from lips stained with impurity"; "Be not ready to stretch forth thine hands to take, while thou contractest them to give"; "Thou shalt not issue orders with bitterness to thy servant, lest thou fail in reverence to God who is above you both"; "Thou shalt not make a schism, but shalt bring together them who contend"; "The way of darkness is crooked"; "In this way are (among others mentioned) those who labor not to aid him who is overdone with toil" (chapters xix, xx).<P>4. Notabilia:<P>(1) The Divinity of Christ is emphasized: "Lord of all the world"; "Joint Creator, with the Father, of mankind" (chapter v). (2) The writer, while following the Alexandrian method of allegorical interpretation, is free from the Alexandrian doctrine of the essential evil of matter; the necessity of a real incarnation is affirmed (chapter v). (3) In chapter xi, he writes, "We go down into the water full of sins and filth, and come up bearing fruit in our heart, having the fear of God and trust in Jesus in our spirit." This has been interpreted as involving the doctrine of baptismal regeneration; but the reference may be rather to the regeneration which baptism symbolizes. (4) In chapter xv, the words, "We keep the 8th day with joy, the day on which Jesus rose again," are the earliest express testimony that the observance of the Lord\'s Day was a memorial of our Lord\'s resurrection. This observance is distinguished from Jewish Sabbath-keeping which is called an error; the Sabbath really intended to be kept being a period of 1,000 years after the 6,000 years in which all things will be finished (chapter xv). (5) Testimony to New Testament Books,<P>(a) the existence and canonical authority of the Gospel of Matthew are attested (chapter iv) by the quotation of <a onClick="return mV(\'Mat\',22,14);">Mt 22:14</a>, "Many are called, but few chosen," introduced by the formula, "It is written";<P>(b) various passages taken together testify to the writer having the Gospel of John in his hands: "Whoso eateth of these shall live for ever" (chapter xi and <a onClick="return mV(\'Jhn\',6,58);">Joh 6:58</a>); "Abraham looking before in Spirit to Jesus" (chapter ix and <a onClick="return mV(\'Jhn\',8,58);">Joh 8:58</a>); "the new law of our Lord Jesus Christ" (chapter ii and <a onClick="return mV(\'Jhn\',13,34);">Joh 13:34</a>); a reference to the brazen serpent as a type of Christ\'s suffering, glory and healing power (chapter xii and <a onClick="return mV(\'Jhn\',3,14);">Joh 3:14</a>);<P>(c) "Thou shalt not say that anything is thine own" (chapter xix) appears to be a reminiscence of <a onClick="return mV(\'Act\',4,32);">Ac 4:32</a>; (d) the passage in xv, "The day of the Lord shall be as a thousand years," seems to be an echo of <a onClick="return mV(\'2Pe\',3,8);">2Pe 3:8</a>, and, if so, is the earliest testimony to the existence of that writing, and thus proves its great antiquity, although not its canonicity.<P>VII. Pastor (Shepherd) of Hermas.<P>1. Authorship and Date:<P>This work is the earliest example, on a large scale, of Christian allegory, and was hardly less popular in the early church than the Pilgrim\'s Progress in later times. It was reckoned by many almost, by some altogether, as "Scripture." Irenaeus quotes it as "Scripture" (iv.20); Clement of Alexandria refers to it as "containing revelations Divinely imparted" (Strom., i.29); Origen regards it as "Divinely inspired" (Commentary on <a onClick="return mV(\'Rom\',16,14);">Romans 16:14</a>). It is placed with the Epistle of Barnabas in the Codex Sinaiticus at the close of the New Testament, and was read in many churches down to Jerome\'s time (Works, II, 846). The writer represents himself as a slave sold to a Roman Christian lady. He afterward obtained freedom, lived with his family in Rome, became earnestly religious, and saw visions which he imparted the community in this book with a view to repentance and spiritual well-being.<P>Origen (followed by Eusebius, Jerome, etc.) ascribes the work to the Hermes of <a onClick="return mV(\'Rom\',16,14);">Ro 16:14</a>; but his opinion is pure conjecture (puto). The Canon Muratori (170 AD) of Italian authorship describes the work as "recently composed at Rome by the brother of Plus during the latter\'s episcopate" (137-54). This distinct local testimony has been widely accepted (Hefele, Lightfoot, Charteris, Cruttwell, etc.). Yet the writer represents himself (Vision, ii.4) as enjoined to send his book to Clement as man in authority in the church, whom it is natural to identify with the chief presbyter of Rome between 92 and 101. This reference, along with the absence of any allusion to Gnosticism or to the mono-episcopate, has led Schaff, Zahn, and others to fix the date of the work at about 100 AD. The external and internal evidence, thus apparently divergent, may be reconciled by supposing (with Kruger and Harnack) that the book was not "written in a single draft"; that portions were issued successively during Clement\'s episcopate; and that under Plus (circa 140) the separate issues were gathered into a volume under the title of The Pastor. In Rome, where the author was known, the Canon Muratori attested at once its religious usefulness as a "book to be read" and the absence of any claim to canonical authority.<P>2. Object and Contents:<P>The purpose of the book is not doctrinal but ethical; it is an allegorical manual of Christian duty with earnest calls to individual repentance and church revival in view of the near Advent.<P>The book consists of<P>(1) Five Visions,<P>(2) Twelve Mandates,<P>(3) Ten Similitudes or Parables.<P>In (1) the church appears\' to the writer as a venerable matron, then as a tower near completion, thereafter as a Holy Virgin. In the last vision, the Angel of Repentance, in pastoral garb, delivers to him the Mandates and Similitudes. The Mandates deal with chastity, truth, patience, meekness, reverence, prayer, penitence, and warn against grieving the Spirit. In the similitudes the church is again a tower whose stones are examined for approbation or reprobation. Similitudes are also drawn from trees. The vine clinging to the elm signifies union of rich and poor in the church; a large willow from which a multitude receive branches or twigs, some of these blossoming or fruit-bearing, others dry or rotten, symbolizes the diverse effect of law and gospel on different souls. The author, although a Gentile, writes from the standpoint of James rather than of Paul. The closing words summarize his combined ethical and eschatological purpose: "Ye who have received good from the Lord, do good works, lest while ye delay, the tower be completed, and you be rejected."<P>3. Notabilia:<P>(1) Montanistic Affinity.<P>Hermas, indeed, differs from Montanists in permitting, though not encouraging, second marriage, and recognizing one possible repentance after post-baptismal flagrant sin; but he is also their fore-runner, through his disallowance of readmission after second lapse, through emphatic expectation of an impending Advent, and through his rigorous view of fasting: "On the fast day taste nothing but bread and water."<P>(2) Fasting, However, Is Regarded Not as an End but as a Means<P>A discipline toward humility, purity, charity. Fasting for charity is illustrated by the injunction (Sim., v.3) to "reckon up the price of what you meant to eat, and give that to one in want."<P>(3) Absence of Names "Jesus" and "Christ."<P>The names" Jesus and "Christ" never occur. He is "Son of God" and "Lord of His people," whom "God made to dwell in flesh," by whom "the whole world is sustained," who "endured great sufferings that He might do away with the sins of His people" (Sim., .v.6; ix. 14).<P>(4) Church Organization.<P>Hermas is charged (Via., ii.4) to "read his writings to (or along with) the presbyters who preside over the church" in Rome. It is reasonable to conclude that no one in that community could then be called "bishop"
