>, but to all Israel; compare <a onClick="return mV(\'Lev\',7,23,29);">7:23,29</a>. On some other data less intimately connected with the matter, compare above under 1.<P>(b) Consecration of priests and related matters (<a onClick="return mV(\'Lev\',8,\'1-\');">Le 8-10</a>): In this pericope, as in the following, down to <a onClick="return mV(\'Lev\',17,\'1-\');">Le 17</a> inclusive, but especially from <a onClick="return mV(\'Lev\',11,\'1-\');">Le 11</a> on, the principle of division on the basis of the number four predominates, in many cases in the details, too; so that this could scarcely be regarded as an accidental feature (compare also the history of Abraham in <a onClick="return mV(\'Gen\',12,\'1-\');">Ge 12-26</a>; further, in <a onClick="return mV(\'Exd\',35,\'4-\');">Ex 35:4-40:38</a>; and in <a href="./study/isbe/search.html?string=EXODUS">EXODUS, II,2,(7)</a>; <a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a>, under <a href="./study/isbe/search.html?string=DAY+OF+ATONEMENT">DAY OF ATONEMENT, I,2,(1)</a>); <a onClick="return mV(\'Deu\',12,\'1-\');">De 12-26</a>, too, is probably to be divided on this principle, even to the minutest details (compare finally <a onClick="return mV(\'Lev\',21,\'1-\');">Le 21</a>-<a onClick="return mV(\'Lev\',22,\'1-16\');">22:16</a>; <a onClick="return mV(\'Lev\',22,\'17-30\');">22:17-30</a>; <a onClick="return mV(\'Lev\',23,\'1-\');">Le 23</a>f and <a onClick="return mV(\'Lev\',26,\'1-\');">26</a>).<P>(i) <a onClick="return mV(\'Lev\',8,\'1-\');">Leviticus 8</a>, treating of the first seven days of the consecration of the priests: The outline is found in <a onClick="return mV(\'Lev\',8,2);">8:2</a>, namely Aaron, the sacred garments, the anointing oil, the bullock of the sin offering, two rams, unleavened bread (compare <a onClick="return mV(\'Lev\',8,6,7,10,14,18,22,26);">8:6,7ff, 10ff, 14ff, 18ff, 22ff, 26ff</a>).<P>(ii) <a onClick="return mV(\'Lev\',9,\'1-\');">Leviticus 9</a> the first sacrifices of Aaron and his sons on the 8th day (<a onClick="return mV(\'Lev\',9,2,3,4);">9:2-4</a> contain the outline, after the manner of <a onClick="return mV(\'Lev\',8,2);">8:2</a>; compare <a onClick="return mV(\'Lev\',9,7,11);">9:7ff, 11ff</a>, the sin offering and the burnt offering of Aaron, with <a onClick="return mV(\'Lev\',9,2);">9:2</a>; also <a onClick="return mV(\'Lev\',9,\'15-18\');">9:15-18</a>, treating of what the people brought for the sacrifices, with <a onClick="return mV(\'Lev\',9,3);">9:3</A>f; but it is to be noticed that the meal offering and the peace offering (<a onClick="return mV(\'Lev\',9,17,18);">9:17,18</a>) are given in inverted order from that found in <a onClick="return mV(\'Lev\',9,3);">9:3</a>f). Here too we find the number seven, if we add the burnt offering for the morning (<a onClick="return mV(\'Lev\',9,17);">9:17</a>).<P>(iii) <a onClick="return mV(\'Lev\',10,\'1-7\');">10:1-7</a>, the sin of Nadab and Abihu and their punishment by death; (iv) <a onClick="return mV(\'Lev\',10,\'8-20\');">10:8-20</a>, ordinances concerning the priests, occasioned by <a onClick="return mV(\'Lev\',8,\'1-\');">8:1-10:7</a> and provided with a new superscription in <a onClick="return mV(\'Lev\',10,8);">10:8</a>, namely <a onClick="return mV(\'Lev\',10,8);">10:8</a>, dealing with the prohibition of the use of wine and intoxicants; <a onClick="return mV(\'Lev\',10,9);">10:9</a>f; distinction between the holy and the unholy; <a onClick="return mV(\'Lev\',10,\'10-15\');">10:12-15</a>, the eating of the sacred oblations; <a onClick="return mV(\'Lev\',10,\'16-20\');">10:16-20</a>, the treatment of the goat for the sin offering.<P>(c) Laws Concerning the Clean and Unclean (<a onClick="return mV(\'Lev\',11,\'1-\');">Le 11-15</a>):<P>(i) <a onClick="return mV(\'Lev\',11,\'1-\');">Le 11</a>, treating of clean and unclean animals. The outline of the chief contents is found in <a onClick="return mV(\'Lev\',11,46);">11:46</a> with a free transposition of one number. There are accordingly four pieces, namely, <a onClick="return mV(\'Lev\',11,\'2-8\');">11:2-8</a>, quadrupeds; <a onClick="return mV(\'Lev\',11,\'9-12\');">11:9-12</a>, water animals; <a onClick="return mV(\'Lev\',11,\'13-23\');">11:13-23</a>, birds (with an appendix, treating of contact with the unclean, <a onClick="return mV(\'Lev\',11,\'24-28\');">11:24-28</a>, which give a summary of the animals mentioned (see under 1); <a onClick="return mV(\'Lev\',11,\'29-45\');">11:29-45</a>, the small animals upon the earth (again in four subdivisions, namely, (i) <a onClick="return mV(\'Lev\',11,\'29-38\');">11:29-38</a>; (ii) <a onClick="return mV(\'Lev\',11,39);">11:39</a>ff; (iii) <a onClick="return mV(\'Lev\',11,41);">11:41</a>f; (iv) <a onClick="return mV(\'Lev\',11,44);">11:44</a>f).<P>(ii) <a onClick="return mV(\'Lev\',12,\'1-\');">Leviticus 12</a> treats of women in confinement, also in four pieces (<a onClick="return mV(\'Lev\',12,\'2-4\');">12:2-4</a>, birth of a male child; <a onClick="return mV(\'Lev\',12,5);">12:5</a>, birth of a female child; <a onClick="return mV(\'Lev\',12,6);">12:6</a>f; purification ceremony; <a onClick="return mV(\'Lev\',12,8);">12:8</A>, ordinances in case of extreme poverty). These parts are not joined logically, but in a rather external manner.<P>(iii) The passage <a onClick="return mV(\'Lev\',13,\'1-\');">13:1</a>-<a onClick="return mV(\'Lev\',14,\'1-53\');">14:53</a>, containing the laws of leprosy, with the subscription in <a onClick="return mV(\'Lev\',14,54);">14:54</a>ff. (Because seven points are to be enumerated, <a onClick="return mV(\'Lev\',14,55);">14:55</a> (garments and houses), this is not as in its further exposition separated from the other laws and is placed in their midst.) The exposition contains four pieces, namely, <a onClick="return mV(\'Lev\',13,\'1-44\');">13:1-44</a>, leprosy on human beings (with concluding <a onClick="return mV(\'Lev\',13,45);">13:45</a>f), with seven subdivisions, of which the first five longer ones are constructed along fairly parallel lines, and again can be divided into four sub-subdivisions, namely, <a onClick="return mV(\'Lev\',13,\'1-8\');">13:1-8<a onClick="return mV(\'Lev\',10,8);">; <a onClick="return mV(\'Lev\',1,\'9-17\');">1:9-17</A>; <a onClick="return mV(\'Lev\',1,\'18-23\');">1:18-23</a>; <a onClick="return mV(\'Lev\',1,\'24-28\');">1:24-28</a>; <a onClick="return mV(\'Lev\',1,\'29-37\');">1:29-37</a>; <a onClick="return mV(\'Lev\',1,38);">1:38</a>f; <a onClick="return mV(\'Lev\',1,40-44\');">1:40-44</a>. The significance of the number seven for the structure (see (2), (b), i, above) is akin to that found, e.g., in <a onClick="return mV(\'Exd\',24,\'18-\');">Ex 24:18b</a> through <a onClick="return mV(\'Exd\',31,18);">31:18</a> (see <a href="./study/isbe/search.html?string=EXODUS">EXODUS, II,2,(5)</a>); <a onClick="return mV(\'Lev\',8,\'1-\');">Le 8</a>; <a onClick="return mV(\'Lev\',9,\'1-\');">9</a> (see above); <a onClick="return mV(\'Lev\',23,\'1-\');">Le 23</a>; <a onClick="return mV(\'Lev\',25,\'1-\');">25</a>; and <a onClick="return mV(\'Lev\',27,\'1-\');">27</a>; and possibly <a onClick="return mV(\'Lev\',26,\'3-39\');">26:3-13,14-39</a> (see below); finally, the whole Book of Exodus is divided into seven parts (see <a href="./study/isbe/search.html?string=EXODUS">EXODUS, II, 1</a>). <a onClick="return mV(\'Lev\',13,\'47-59\');">13:47-59</a>, leprosy in connection with garments, with four subdivisions, namely <a onClick="return mV(\'Lev\',13,\'47-50\');">13:47-50</a>; <a onClick="return mV(\'Lev\',31,51);">13:51</a>f; <a onClick="return mV(\'Lev\',13,53);">13:53</a>f; <a onClick="return mV(\'Lev\',13,55);">13:55</a>ff. The last subdivision can again be readily separated into four sub-subdivisions, namely, <a onClick="return mV(\'Lev\',13,55);">13:55</a>; <a onClick="return mV(\'Lev\',13,56);">13:56</a>; <a onClick="return mV(\'Lev\',13,57);">13:57</a>; <a onClick="return mV(\'Lev\',13,58);">13:58</a>; <a onClick="return mV(\'Lev\',14,\'1-32\');">14:1-32</a>, purifications (<a onClick="return mV(\'Lev\',14,2);">14:2</a> being a special superscription), with 4 subdivisions, namely,<P>(i) <a onClick="return mV(\'Lev\',14,2,3);">14:2b-3a</a>, the leper before the priest;<P>(ii) <a onClick="return mV(\'Lev\',14,\'3-9\');">14:3b-9</a>, the purification ceremonies on the first seven days, again divided into 4 sub-subdivisions: <a onClick="return mV(\'Lev\',14,3);">14:3b</a>f; <a onClick="return mV(\'Lev\',14,5,6,7);">14:5-7</a>; <a onClick="return mV(\'Lev\',14,8);">14:8</a>; <a onClick="return mV(\'Lev\',14,9);">14:9</a>;<P>(iii) <a onClick="return mV(\'Lev\',14,\'10-20\');">14:10-20</a>, the ceremony of the eighth day (4 sacrifices, namely <a onClick="return mV(\'Lev\',14,\'12-18\');">14:12-18</a>, guilt offering; <a onClick="return mV(\'Lev\',14,19);">14:19a</a>, sin offering; <a onClick="return mV(\'Lev\',14,19);">14:19b</a>, burnt offering; <a onClick="return mV(\'Lev\',14,20);">14:20</a>, meal offering; in the 4 sacrifices (<a onClick="return mV(\'Lev\',5,\'12-\');">5:12</a>-<a onClick="return mV(\'Lev\',6,\'1-7\');">6:7</a>) there are again 4 different actions: <a onClick="return mV(\'Lev\',14,14);">14:14</a>; <a onClick="return mV(\'Lev\',14,15);">14:15</a>f; <a onClick="return mV(\'Lev\',14,17);">14:17</a>; <a onClick="return mV(\'Lev\',14,18);">14:18</a>;<P>(iv) <a onClick="return mV(\'Lev\',14,\'21-32\');">14:21-32</a> (in cases of poverty) <a onClick="return mV(\'Lev\',14,\'33-53\');">14:33-53</a>, leprosy in houses, with four subdivisions: <a onClick="return mV(\'Lev\',14,\'33-35\');">14:33-35</a>; <a onClick="return mV(\'Lev\',14,36,37,38);">14:36-38</a>; <a onClick="return mV(\'Lev\',14,\'39-42\');">14:39-42</a>; <a onClick="return mV(\'Lev\',14,\'43-53\');">14:43-53</a>.<P>(iv) <a onClick="return mV(\'Lev\',15,\'1-\');">Leviticus 15</a>, sickness or natural issues, with 4 subdivisions, namely, <a onClick="return mV(\'Lev\',15,\'1-15\');">15:1-15</a>, checked or running issues together with their purification (<a onClick="return mV(\'Lev\',15,\'3-12\');">15:3-12</A> contain 12 laws: <a onClick="return mV(\'Lev\',15,3);">15:3</A>; <a onClick="return mV(\'Lev\',15,4);">15:4a</A>; <a onClick="return mV(\'Lev\',15,4);">15:4b</A>; <a onClick="return mV(\'Lev\',15,5);">15:5</a>; <a onClick="return mV(\'Lev\',15,6);">15:6</A>; <a onClick="return mV(\'Lev\',15,7);">15:7</A</a>; 15:8</a>; <a onClick="return mV(\'Lev\',15,9);">15:9</a>; <a onClick="return mV(\'Lev\',15,10);">15:10a</a>; <a onClick="return mV(\'Lev\',15,10);">15:10b</a>; <a onClick="return mV(\'Lev\',15,11);">15:11</a>; <a onClick="return mV(\'Lev\',15,12);">15:12</a>); <a onClick="return mV(\'Lev\',15,16,17,18);">15:16-18</A>, issue of seed; <a onClick="return mV(\'Lev\',15,\'19-24\');">15:19-24</a>, periods; <a onClick="return mV(\'Lev\',15,\'25-30\');">15:25-30</a>, other flows of blood and their purification. <a onClick="return mV(\'Lev\',15,\'1-15\');">Le 15:1-15</a> and <a onClick="return mV(\'Lev\',15,16,17,18);">15:16-18</a> refer to men, and <a onClick="return mV(\'Lev\',15,\'19-24\');">15:19-24</a> and <a onClick="return mV(\'Lev\',15,\'25-30\');">15:25-30</a> to women; and in addition to these implied suggestions, as <a onClick="return mV(\'Lev\',15,\'1-15\');">15:1-15</a> and <a onClick="return mV(\'Lev\',15,\'25-30\');">15:25-30</a> to dealing with abnormal issues and their purification ceremonies, <a onClick="return mV(\'Lev\',15,16,17,18);">15:16-18</a> and <a onClick="return mV(\'Lev\',15,\'19-24\');">15:19-24</a> deal with normal issues.<P>(d) The Day of Atonement (<a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a>):<P>See IV, 1, (2), 2, and under <a href="./study/isbe/search.html?string=ATONEMENT,+DAY+OF">ATONEMENT, DAY OF</a>.<P>(e) Uses and significance of the blood of sacrifices (<a onClick="return mV(\'Lev\',17,\'1-\);">Le 17</a>): (i) <a onClick="return mV(\'Lev\',17,\'3-7\);">17:3-7</a>, only one place for killing the Sacrifices and the rejection of all foreign cultures; (ii) <a onClick="return mV(\'Lev\',17,8,9);">17:8,9</a>, only one place for sacrificing; (iii) <a onClick="return mV(\'Lev\',17,\'10-14\);">17:10-14</a>, prohibitive of eating the blood; (iv) <a onClick="return mV(\'Lev\',17,15);">17:15</A>, pertaining to carcasses of animals found dead or which have been torn by wild beasts.<P>Here the form and the contents of the section have been brought into perfect harmony by the author. <a onClick="return mV(\'Lev\',17,3,8,10,13);">Le 17:3ff, 8ff, 10ff, 13ff</a> begin with same words, and each contains a similar formula in reference to the punishment, while logically <a onClick="return mV(\'Lev\',17,10);">17:10ff</a> and <a onClick="return mV(\'Lev\',17,13);">13ff</A> are evidently only subdivisions of the third part in <a onClick="return mV(\'Lev\',17,\'10-14\');">17:10-14</a>, which treats of the prohibition of eating blood. In the fourth division, again, while in substance connected with the rest, there is lacking the formal agreement with the first three divisions.<P>(f) (g) (<a onClick="return mV(\'Lev\',18,\'1-\');">Le 18</a>; <a onClick="return mV(\'Lev\',19,\'1-\');">19</a>; <a onClick="return mV(\'Lev\',20,\'1-\');">20</a>; <a onClick="return mV(\'Lev\',21,\'1-\');">21</a>): These naturally fall each into 2 parts. <a onClick="return mV(\'Lev\',18,\'1-\');">Leviticus 18-20</a> contain<P>(i) <a onClick="return mV(\'Lev\',18,\'1-\');">Le 18</a>f; religious and ethical laws;<P>(ii) <a onClick="return mV(\'Lev\',20,\'1-\');">Le 20</a>, laws dealing with punishments. (f) (i) Religious and ethical laws (<a onClick="return mV(\'Lev\',18,\'1-\');">Le 18</a>f):<P>(a) <a onClick="return mV(\'Lev\',18,\'1-\');">Le 18</a>: Ordinances with reference to marriage and chastity. <a onClick="return mV(\'Lev\',18,\'1-5\');">Le 18:1-5</a>, introductory; <a onClick="return mV(\'Lev\',18,6,7,8);">18:6-18</a>, prohibition of marriage between kindred of blood; <a onClick="return mV(\'Lev\',18,\'19-23\');">18:19-23</a>, prohibition of other sexual sins; <a onClick="return mV(\'Lev\',18,\'24-30\');">18:24-30</a>, warnings.<P>The subdivision can perhaps be divided into 10 subordinate parts, if it is permitted to combine the different degrees of relationship mentioned in <a onClick="return mV(\'Lev\',18,\'12-14\');">Le 18:12-14</a> (namely, <a onClick="return mV(\'Lev\',18,\'7-18\');">18:7,8,9,10,11,12-14,15,16,17,18</a>). Since it, of itself, manifestly consists of 5 ordinances (<a onClick="return mV(\'Lev\',18,\'19-23\');">18:19,20,21,22,23</a>), this whole section, if we are permitted to divide it into 5 commandments (<a onClick="return mV(\'Lev\',18,\'2-5\');">18:2,3a, 3b, 4,5</A>) and also into 5 (<a onClick="return mV(\'Lev\',18,24,\'26-30\');">18:24f; 26-28,29,30a, 30b</A>), would contain 5 X 5 words; but this is uncertain.<P>(b) <a onClick="return mV(\'Lev\',19,\'1-\');">Leviticus 19</a>: various commands of the deepest significance. In order to discover the divisions of this chapter we must note the characteristic formula, "I am Yahweh, your Gods" or a similar expression, which often appears at the beginning and at the end of certain divisions, e.g. in series (1) (9) and (10), but which in the middle series appears in each case only once, and which in all the series is found also at the conclusion.<P>In this way we can compute 10 tetralogues. Thus after the superscription in <a onClick="return mV(\'Lev\',19,2);">19:2</A> containing a summary, we have<P>(i) <a onClick="return mV(\'Lev\',19,3,4);">19:3,4</A> (<a onClick="return mV(\'Lev\',19,3);">19:3a</a>, <a onClick="return mV(\'Lev\',19,3);">3b</a>, <a onClick="return mV(\'Lev\',19,4);">4a</A>, <a onClick="return mV(\'Lev\',19,4);">4b</A>);<P>(ii) <a onClick="return mV(\'Lev\',19,\'5-10\');">19:5-10</A> (<a onClick="return mV(\'Lev\',19,5);">19:5</A>f; <a onClick="return mV(\'Lev\',19,7);">7</a>f; <a onClick="return mV(\'Lev\',19,9);">9</a>,<a onClick="return mV(\'Lev\',19,10);">10</a>);<P>(iii) <a onClick="return mV(\'Lev\',19,11,12);">19:11</a>f (<a onClick="return mV(\'Lev\',19,11);">19:11a</a>, <a onClick="return mV(\'Lev\',19,11);">11b(?)</a>, <a onClick="return mV(\'Lev\',19,11);">11b(?)</A>, <a onClick="return mV(\'Lev\',19,12);">12</A>);<P>(iv) <a onClick="return mV(\'Lev\',19,13,14);">19:13</A>f (<a onClick="return mV(\'Lev\',19,13);">19:13a</a>, <a onClick="return mV(\'Lev\',19,13);">13b</a>, <a onClick="return mV(\'Lev\',19,14);">14a</a>, <a onClick="return mV(\'Lev\',19,14);">14b</a>);<P>(v) <a onClick="return mV(\'Lev\',19,15,16);">19:15</a>f (<a onClick="return mV(\'Lev\',19,15);">15a</a>, <a onClick="return mV(\'Lev\',19,15);">15b</a>, <a onClick="return mV(\'Lev\',19,16);">16a</a>, <a onClick="return mV(\'Lev\',19,16);">16b</a>);<P>(vi) <a onClick="return mV(\'Lev\',19,17,18);">19:17</a>f (<a onClick="return mV(\'Lev\',19,17);">19:17a</a>, <a onClick="return mV(\'Lev\',19,17);">17b</a>, <a onClick="return mV(\'Lev\',19,18);">18a</a>, <a onClick="return mV(\'Lev\',19,18);">18b</a>);<P>(vii) <a onClick="return mV(\'Lev\',19,\'19-25\');">19:19-25</a> (<a onClick="return mV(\'Lev\',19,19);">19:19a</a>, <a onClick="return mV(\'Lev\',19,19);">19b</a>, <a onClick="return mV(\'Lev\',19,20,21,22);">20-22</a>, <a onClick="return mV(\'Lev\',19,23,24,25);">23-25</a>);<P>(viii) <a onClick="return mV(\'Lev\',19,26,27,28);">19:26-28</a> (<a onClick="return mV(\'Lev\',19,26,);">19:26a</A>, <a onClick="return mV(\'Lev\',19,26,);">26b</a>, <a onClick="return mV(\'Lev\',19,27,);">27</a>, <a onClick="return mV(\'Lev\',19,28,);">28</a>),<P>(ix) <a onClick="return mV(\'Lev\',19,\'29-32\');">19:29-32</a> (<a onClick="return mV(\'Lev\',19,29);">19:29</a>, <a onClick="return mV(\'Lev\',19,30);">30</a>, <a onClick="return mV(\'Lev\',19,31);">31</a>, <a onClick="return mV(\'Lev\',19,32);">32</a>);<P>(x) <a onClick="return mV(\'Lev\',19,\'33-36\');">19:33-36</a> (<a onClick="return mV(\'Lev\',19,33);">19:33</a>, <a onClick="return mV(\'Lev\',19,34);">34</a>, <a onClick="return mV(\'Lev\',19,35);">35</a>, <a onClick="return mV(\'Lev\',19,36);">36</a>); <a onClick="return mV(\'Lev\',19,37);">19:37</a> constitutes the conclusion of the whole.<P>(Note that the number ten here is certain in the conviction of the present writer; but he is not quite so sure of the number of subdivisions within the main divisions; we may have to do here with pentalogues and not with tetralogues. If this is the case, then the agreements with <a onClick="return mV(\'Lev\',18,\'1-\');">Le 18</a> would under certain circumstances be even greater.)<P>Possibly groupings of two can yet form a closer union (compare on <a onClick="return mV(\'Exd\',1,\'1-\');">Ex 1:1-18:27</a>; <a onClick="return mV(\'Exd\',21,\'1-\');">21:1-23:33</a>, <a href="./study/isbe/search.html?string=EXODUS">EXODUS, II, 2, (1-4)</a>). At any rate (iii) and (iv) can be summarized under the general heading of defrauding one\'s neighbors; (v) and (vi) under that of observation of the laws; (vii) and (viii) under that of heathen abuses; while (ix) and (x) perhaps intentionally mingle together the religious and cultural and ethical elements, in order thereby already to express that all these things are most intimately connected (but compare also <a onClick="return mV(\'Lev\',19,12,14,17);">Le 19:12,14,17</a>, in the middle sections). In <a onClick="return mV(\'Lev\',19,5,20,23);">19:5ff, 20ff, 23ff</a>, the author develops his subject somewhat more fully.<P>(f ii) Laws dealing with punishments (<a onClick="return mV(\'Lev\',20,\'1-\');">Le 20</a>): The regulations in reference to punishments stand in such close relation to the contents of <a onClick="return mV(\'Lev\',18,\'1-\');">Le 18</a> and to parts of <a onClick="return mV(\'Lev\',19,\'1-\');">Le 19</a>, that it is absolutely incomprehensible how the Critics can assign these three chapters to different authors. Even if certain regulations of <a onClick="return mV(\'Lev\',18,\'1-\');">Le 18</a> are not found here in <a onClick="return mV(\'Lev\',20,7,10,17,18);">Le 20:7,10,17b,18</a>,and even if another order has been followed, this variation, which doubtless also hangs together with a new grouping of the materials, is rather an advantage than a disadvantage for the whole. It is impossible to conceive that a redactor would have altered anything in two entirely parallel and similar texts, or would himself have written a parallel text differing from the other. <a onClick="return mV(\'Lev\',20,\'1-\');">Leviticus 20</a> can probably be divided into 4 parts, namely,<P>(i) <a onClick="return mV(\'Lev\',20,\'1-8\');">20:1-8</a>, punishments for idolatry and witchcraft with a concluding formula, <a onClick="return mV(\'Lev\',20,7);"><a onClick="return mV(\'Lev\',20,7);">20:7</a>f;<P>(ii) <a onClick="return mV(\'Lev\',20,\'9-18\');">20:9-18</a>, punishment of death for ten crimes, all of which, with the exception of the first, are of a sexual nature (<a onClick="return mV(\'Lev\',20,\'9-18\');">20:9-18</a>). It is a question whether the first in the second group (<a onClick="return mV(\'Lev\',20,14);">20:14</a>), i.e. the sixth in the whole series, was intended to be made prominent by the peculiar character of the punishment (burning to death);<P>(iii) <a onClick="return mV(\'Lev\',20,19,20,21);">20:19-21</a>, other sexual sins, with lighter punishments;<P>(iv) <a onClick="return mV(\'Lev\',20,\'22-27\');">20:22-27</a>, with 4 subdivisions (warning, <a onClick="return mV(\'Lev\',20,22);">20:22</a>f; promise, <a onClick="return mV(\'Lev\',20,24);">20:24</a>; emphatic repetitions of two commands already given, <a onClick="return mV(\'Lev\',20,25);">20:25</a>ff; (compare with <a onClick="return mV(\'Lev\',11,44);">11:44</a>ff, and in general with <a onClick="return mV(\'Lev\',11,\'1-\');">Le 11</a>); and <a onClick="return mV(\'Lev\',20,27);">20:27</a> with <a onClick="return mV(\'Lev\',19,26,31);">19:26,31</a>; <a onClick="return mV(\'Lev\',20,6);">20:6</a>). Perfectly certain in this chapter is the fact that the different kinds of punishments are likewise decisive for their order. It is doubtless not to be regarded as accidental that both at the beginning and at the end death by stoning is mentioned.<P>(g) (<a onClick="return mV(\'Lev\',21,\'1-\');">Le 21:1</a>-<a onClick="return mV(\'Lev\',22,33);">22:33</a>):<P>(i) Laws concerning the quality of the priests (<a onClick="return mV(\'Lev\',21,\'1-\');">21:1-<a onClick="return mV(\'Lev\',22,\'1-16\');">22:16</a>); and (ii) concerning sacred oblations (<a onClick="return mV(\'Lev\',22,\'17-30\');">22:17-30</a>) with the subscription <a onClick="return mV(\'Lev\',22,31,32,33);">22:31-33</a>.<P>(g i) Qualities of priests: <a onClick="return mV(\'Lev\',21,\'1-\');">Le 21:1</a>-<a onClick="return mV(\'Lev\',21,\'1-16\',);">22:16</a> in four sections (<a onClick="return mV(\'Lev\',21,1);">21:1</a>ff, <a onClick="return mV(\'Lev\',21,10);">10</a>ff, <a onClick="return mV(\'Lev\',21,16);">16</a>ff; <a onClick="return mV(\'Lev\',22,1);">22:1</a>ff; note also in <a onClick="return mV(\'Lev\',21,18,19,20);">21:18-20</a> the 12 blemishes; in <a onClick="return mV(\'Lev\',22,\'4-8\');">22:4-8</a> the 7 cases of uncleanness). (g ii) Sacred oblations: <a onClick="return mV(\'Lev\',22,\'17-30\');">Le 22:17-30</a> in four sections (<a onClick="return mV(\'Lev\',22,18,19,20);">22:18-20</a>, <a onClick="return mV(\'Lev\',22,\'21-25\');">21-25</a>, <a onClick="return mV(\'Lev\',22,26,27,28);">26-28</a>, <a onClick="return mV(\'Lev\',22,29);">29</a>f).<P>(h) Consecration of seasons, etc. (<a onClick="return mV(\'Lev\',23,\'1-\');">Le 23</a>; <a onClick="return mV(\'Lev\',24,\'1-\');">24</a>):<P>(i) <a onClick="return mV(\'Lev\',23,\'1-\');">Le 23</a>, laws for the feasts (7 sections, namely, <a onClick="return mV(\'Lev\',23,3,4);">23:3,4</a>f; <a onClick="return mV(\'Lev\',23,\'6-14\');">6-14</a>,<a onClick="return mV(\'Lev\',23,\'15-22\');">15-22</a>, <a onClick="return mV(\'Lev\',23,23,24.25\');">23-25</a>, <a onClick="return mV(\'Lev\',23,\'26-32\');">26-32</a>,<a onClick="return mV(\'Lev\',23,\'33-36\');">33-36</a>, with the appendix that in every particular suits the connection, in <a onClick="return mV(\'Lev\',23,39);">23:39</a>ff, added to the feast of the tabernacles);<P>(ii) <a onClick="return mV(\'Lev\',24,\'1-4\');">24:1-4</a>, treating of the sacred candlestick, which represents the moral conduct of the Israelites, and for this reason suits admirably in the connection; as this is true also of<P>(iii) <a onClick="return mV(\'Lev\',24,\'5-9\');">24:5-9</a>, treating of the showbread, which represents the results of the labor of Israel;<P>(iv) <a onClick="return mV(\'Lev\',24,\'10-23\');">24:10-23</a>, containing the report of the punishment of a blasphemer of God and of one who cursed.<P>Probably the example was made of a person who took the name of God in vain at the time which this chapter describes. But possibly there is a still closer connection to be found with that which precedes. The showbread and the candlestick were found in the holy place, which with its utensils pictured the relation of Israel\'s character to their God; while the utensils in the Holy of Holies indicated God\'s relation to His people (compare Hengstenberg, Beitrage, III, 644ff). But since the holy place, in addition to the showbread and the candlestick, contained only the incense altar, which symbolized the prayers of Israel, and as the blasphemer represents the exact opposite of prayer, it is probable that in <a onClick="return mV(\'Lev\',24,10);">24:10</a>ff prayer is indicated by its counterpart. This section consists of 4 parts, namely, <a onClick="return mV(\'Lev\',24,10,11,12);">24:10-12</a>; <a onClick="return mV(\'Lev\',24,13,14);">24:13-14</a>; <a onClick="return mV(\'Lev\',24,\'15-22\');">24:15-22</a> (giving a series of punishments for certain wrongdoings which are more or less closely connected with that found in the text); <a onClick="return mV(\'Lev\',24,23);">24:23</a>.<P>(i) Sabbatic and Jubilee years (<a onClick="return mV(\'Lev\',25,\'1-\');">Le 25</a>): Sabbatic and Jubilee years in 7 sections, namely, <a onClick="return mV(\'Lev\',25,\'1-7\');">25:1-7</a>; <a onClick="return mV(\'Lev\',25,\'8-12\');">25:8-12</a>; <a onClick="return mV(\'Lev\',25,\'13-28\');">25:13-28</a>; <a onClick="return mV(\'Lev\',25,\'29-34\');">25:29-34</a>; <a onClick="return mV(\'Lev\',25,\'35-38\');">25:35-38</a>; <a onClick="return mV(\'Lev\',25,\'39-46\');">25:39-46</a>; <a onClick="return mV(\'Lev\',25,\'47-55\');">25:47-55</a>.<P>(j) Conclusion: Curse and blessing (<a onClick="return mV(\'Lev\',26,\'1-\');">Le 26</a>): The grand concluding chapter, offering a curse and a blessing and containing all the prophetic utterances of later times in a nutshell, namely,<P>(i) <a onClick="return mV(\'Lev\',26,1,2);">26:1-2</a>, repetition of four important demands (<a onClick="return mV(\'Lev\',26,1);">26:1a</a>, <a onClick="return mV(\'Lev\',26,1);">1b</a>, <a onClick="return mV(\'Lev\',26,2);">2a</a>, <a onClick="return mV(\'Lev\',26,2);">2b</a>);<P>(ii) <a onClick="return mV(\'Lev\',26,\'3-13\');">26:3-13</a>, the blessing, possibly to be divided into 7 stages, one more spiritual than the other;<P>(iii) <a onClick="return mV(\'Lev\',26,\'4-39);">26:4-39</a>, the curse, possibly to be divided into seven stages, one more intense than the other (compare also the play on words 7 times repeated, in reference to shabbath, possibly found in <a onClick="return mV(\'Lev\',26,34);">26:34</a>f; and certainly found in <a onClick="return mV(\'Lev\',26,18,21,24,27);">26:18,21,24,27</a>f);<P>(iv) <a onClick="return mV(\'Lev\',26,\'40-45\');">26:40-45</a>, the mercy finally shown by Yahweh for His covenant\'s sake.<P>(k) Appendix: Finally, the appendix in <a onClick="return mV(\'Lev\',27,\'1-\');">Le 27</a>, dealing with vows and tithes, in 7 parts, namely, <a onClick="return mV(\'Lev\',27,\'1-8\');">27:1-8</a>; <a onClick="return mV(\'Lev\',27,\'9-13\');">27:9-13</a>; <a onClick="return mV(\'Lev\',27,14,15);">27:14-15</a>; <a onClick="return mV(\'Lev\',27,\'16-21\');">27:16-21</a>; <a onClick="return mV(\'Lev\',27,26);">27:26</a>f; <a onClick="return mV(\'Lev\',27,28,29);">27:28-29</a>; <a onClick="return mV(\'Lev\',27,\'30-33\');">27:30-33</a>.``1';
isbe[5505]='Leviticus, 2`III. Origin.<P>1. Against the Wellhausen Hypothesis:<P>As in the article <a href="./study/isbe/search.html?string=ATONEMENT,+DAY+OF">ATONEMENT, DAY OF, sec. I, 2, (2)</a>, we took a stand against the modern attempts at splitting up the text, and in III, 1 against theory of the late origin of the whole pericope, we must, after trying under II to prove the unity of the Book of Leviticus, yet examine the modern claim that the book as a whole is the product of later times. Since the entire book is ascribed to the Priestly Code (see II, 1 above), the answer to the question as to the time when it was written will depend on the attitude which we take toward the Wellhausen hypothesis, which insists that the Priestly Code was not published until the time of the exile in 444 BC (<a onClick="return mV(\'Neh\',8,\'1-\');">Ne 8</a>; <a onClick="return mV(\'Neh\',9,\'1-\');">9</a>; <a onClick="return mV(\'Neh\',10,\'1-\');">10</a>).<P>(1) The Argument from Silence.<P>One of the most important proofs for this claim is the "argument from silence" (argumentum e silentio). How careful one must be in making use of this argument can be seen from the fact that, e.g., the high priest with his full title is mentioned but a single time in the entire Book of Leviticus, namely in <a onClick="return mV(\'Lev\',21,10);">21:10</a>; and that the Levites are not mentioned save once (<a onClick="return mV(\'Lev\',25,32);">25:32</a>ff), and then incidentally. As is well known, it is the adherents of the Wellhausen hypothesis themselves who now claim that the bulk of the entire literature of the Old Testament originated in the post-exilic period and long after the year 444 BC. Leaving out of consideration for the present the Books of Chronicles, Ezra and Nehemiah, all of which describe the history of Israel from the standpoint of the Priestly Code (P), we note that this later literature is not any richer in its references to P than is the older literature; and that in those cases where such references are found in this literature assigned to a late period, it is just as difficult to decide whether these passages refer merely to a custom or to a codified set of laws.<P>(2) Attitude of Prophets toward Sacrificial System.<P>A further proof against the pre-exilic origin of the priestly legislation is found in what is claimed to be the hostile attitude of the prophets to the sacrificial system (compare <a onClick="return mV(\'Amo\',5,21);">Am 5:21</a>ff; <a onClick="return mV(\'Amo\',4,4);">4:4</a>f; <a onClick="return mV(\'Hsa\',6,6);">Ho 6:6</a>; <a onClick="return mV(\'Mic\',6,6);">Mic 6:6</a>ff; <a onClick="return mV(\'Isa\',1,11);">Isa 1:11</a>ff; <a onClick="return mV(\'Jer\',6,20);">Jer 6:20</a>; <a onClick="return mV(\'Jer\',7,21);">7:21</a>ff; <a onClick="return mV(\'Psa\',40,6);">Ps 40:6</a>; <a onClick="return mV(\'Psa\',50,8,9);">50:8,9</a>; <a onClick="return mV(\'Psa\',51,16);">51:16</a>f). But this cannot possibly be an absolute antithesis; for in this case, it would be directed also against the Books of the Covenant and, in part, too, against Deuteronomy, which books in <a onClick="return mV(\'Exd\',20,24);">Ex 20:24</a>; <a onClick="return mV(\'Exd\',22,19);">22:19</a>; <a onClick="return mV(\'Exd\',23,18);">23:18</a>; <a onClick="return mV(\'Exd\',34,25);">34:25</a>; <a onClick="return mV(\'Deu\',12,5,11,13,17,26);">De 12:5f; 11,13,17,26</a>; <a onClick="return mV(\'Deu\',15,\'19-23\');">15:19-23</a>; <a onClick="return mV(\'Deu\',16,2,5);">16:2,5</a>f; <a onClick="return mV(\'Deu\',17,1);">17:1</a>; <a onClick="return mV(\'Deu\',18,1,3);">18:1,3</a> also give directions for sacrifices, and which, at least in part, are yet regarded as older writings. Further, these passages under discussion are also, in part, assigned to a later and even a very late period (compare even such cases as <a onClick="return mV(\'Psa\',40,6);">Ps 40:6</a>; <a onClick="return mV(\'Psa\',50,8);">50:8</a>f; <a onClick="return mV(\'Psa\',51,16);">51:16</a>f; <a onClick="return mV(\'Mic\',6,6);">Mic 6:6</a>ff, and in addition also <a onClick="return mV(\'Mal\',1,10);">Mal 1:10</a>), i.e. they are assigned to a time in which, according to the views of the critics, the priestly laws are said to have had their origin or were already regarded as authoritative. As a rule, the prophets make sacrifices, Sabbaths, sacred places and persons a part of their pictures of the future; cf, as far as sacrifices are concerned, e.g. <a onClick="return mV(\'Jer\',17,26);">Jer 17:26</a>; <a onClick="return mV(\'Jer\',31,14);">31:14</a>; <a onClick="return mV(\'Jer\',33,14);">33:14</a>ff. Finally, <a onClick="return mV(\'Lev\',26,31);">Le 26:31</a> shows how, under certain circumstances, even P can declare sacrifices to be useless.<P>(3) The People\'s Disobedience. Further, the transgressions of the Levitical laws in the course of Israel\'s history cannot be regarded as a proof of the non-existence of the priestly legislation in pre-exilic times. This is clear from an analogous case. Idolatry was forbidden by the Books of the Covenant (<a onClick="return mV(\'Exd\',20,\'1-\');">Ex 20</a>; <a onClick="return mV(\'Exd\',21,\'1-\');">21</a>; <a onClick="return mV(\'Exd\',22,\'1-\');">22</a>; <a onClick="return mV(\'Exd\',23,\'1-\');">23</a>; <a onClick="return mV(\'Exd\',24,\'1-\');">24</a>; <a onClick="return mV(\'Exd\',34,\'1-\');">34</a>), which are recognized as ancient documents; but according to <a onClick="return mV(\'2Ki\',22,\'1-\');">2Ki 22</a> the pious king Josiah down to the year 622 BC takes no offense at idolatry. Even after the reformation, which had been inaugurated in consequence of the finding of the Book of the Law in the temple during the reign of Josiah (<a onClick="return mV(\'2Ki\',22,\'1-\');">2Ki 22</a>f), idolatry was again practiced in Israel, as is proved by <a onClick="return mV(\'Eze\',8,\'1-\');">Eze 8</a> and <a onClick="return mV(\'Jer\',44,\'1-\');">Jer 44</a>, notwithstanding that the Books of the Covenant and Deuteronomy already were extant at that time, even according to the views of the critics.<P>But let us pass on to P itself, and not forget that the directions given for the Jubilee Year (<a onClick="return mV(\'Lev\',25,\'1-\');">Le 25</a>), according to Jewish tradition, were never actually observed. According to the reasoning of the critics, this law could not be in existence even in the present day. According to all reports the transgressions of the Divine ordinances began even as early as the Mosaic period; compare <a onClick="return mV(\'Exd\',32,\'1-\');">Ex 32</a> (J, E, golden calf); <a onClick="return mV(\'Amo\',5,25);">Am 5:25</a>; <a onClick="return mV(\'Eze\',20,\'1)-\';">Eze 20</a>; <a onClick="return mV(\'Deu\',12,8);">De 12:8</a> and also <a onClick="return mV(\'Lev\',17,7);">Le 17:7</a> (sacrifice to the Satyrs in Priestly Code). This condition of affairs can readily be understood because the religion of Yahweh does not claim to be an emanation from the spirit of the people, but the result of a revelation from on high. In the light of these facts can we be surprised, that in the times of the Judges, when a great prophetic leader was so often not to be found in Israel, the apostasy was so great and so widespread? But all of these cases of disobedience, that have been demonstrated as actual facts in Israel\'s history, are not able to eliminate the fact that there are many data to prove the existence of a central sanctuary already in the earliest history of the people, which fact presupposes as a matter of course that there were also laws for the cults in existence (see <a href="./study/isbe/search.html?string=EXODUS">EXODUS, III, 5</a>). We must further not forget how the sacrifices of the sons of Samuel (<a onClick="return mV(\'1Sa\',2,11);">1Sa 2:11</a>), notwithstanding all their arbitrary conduct, presupposes such passages as <a onClick="return mV(\'Lev\',7,\'30-32\');">Le 7:30-32</a>; <a onClick="return mV(\'Lev\',10,15);">10:15</a>; <a onClick="return mV(\'Exd\',29,31);">Ex 29:31</a>f; <a onClick="return mV(\'Lev\',8,31);">Le 8:31</a>; <a onClick="return mV(\'Num\',6,19);">Nu 6:19</a>f; <a onClick="return mV(\'Lev\',7,\'23-32\');">Le 7:23-32</a>; or that the high priest, as described in Priestly Code, is already before the year 444 BC as well-known a character as he is after the exile (compare <a href="./study/isbe/search.html?string=EZEKIEL">EZEKIEL, II, 2</a>); or that the question of <a onClick="return mV(\'Hag\',2,11);">Hag 2:11</a>ff takes into consideration a code of cult- laws, and that the answer is given on the basis of <a onClick="return mV(\'Lev\',6,27);">Le 6:27</a>; <a onClick="return mV(\'Num\',19,22);">Nu 19:22</a>.<P>(4) Indiscriminate Sacrificing.<P>To this must be added that the transgressions, to which the critics appeal in proof of their claims, and which they abuse for their own purposes, must in part be interpreted differently from what they are. In the case of sacrificing indiscriminately at any place whatever, and by any person whatever, we have in many cases to deal with extraordinary instances of theophanies (compare <a onClick="return mV(\'Jdg\',2,1);">Jud 2:1</a>ff; <a onClick="return mV(\'Jdg\',6,11);">6:11</a>ff; <a onClick="return mV(\'Jdg\',13,1);">13:1</a>), as these had been foreseen in <a onClick="return mV(\'Exd\',20,24);">Ex 20:24</a>. Even the Book of Deuteronomy does not insist throughout (compare <a onClick="return mV(\'Deu\',16,21);">16:21</a>) that the sacrifices, must be made at one and the same place (compare also PC: <a onClick="return mV(\'Lev\',24,31);">Le 24:31</a>; <a onClick="return mV(\'Jos\',22,\'1-\');">Jos 22</a>). After the rejection of Shiloh, at which the central sanctuary had been deposited, as recorded in <a onClick="return mV(\'1Sa\',4,\'1-\');">1Sa 4</a>, the cultural ordinances of Priestly Code, as we learn from <a onClick="return mV(\'Jer\',7,11);">Jer 7:11</a>ff; <a onClick="return mV(\'Jer\',26,6);">26:6</a>; <a onClick="return mV(\'Psa\',78,59);">Ps 78:59</a>ff, became more or less a dead letter. Even the Books of Chronicles, which throughout record history from the standpoint of the Priestly Code, at this period and down to the dedication of the temple take no offense at the cultural acts of a Solomon in contrast with their attitude toward the conduct of Uzziah (see <a onClick="return mV(\'2Ch\',1,6);">2Ch 1:6</a>; <a onClick="return mV(\'2Ch\',6,\'1-4\');">6:1-4</a>; <a onClick="return mV(\'2Ch\',7,\'1-7\');">7:1-7</a>, as compared with <a onClick="return mV(\'2Ch\',26,16);">26:16</a>ff). In the same way the pious people in the Northern Kingdom, after it had, by Divine consent, been separated from the Southern, could not do otherwise than erect altars for themselves, since they could not participate in the worship of the calves in Bethel and Dan. Further, modern criticism overlooks the fact that what is regular and normal is much less liable to be reported in historical narrative than that which is irregular and abnormal.<P>(5) Deuteronomy and Priestly Code.<P>It is not possible at this place to enter into further details; we accordingly refer only to <a href="./study/isbe/search.html?string=EXODUS,+THE+BOOK+OF,+3-4">EXODUS, III and IV</a>; <a href="./study/isbe/search.html?string=DAY+OF+ATONEMENT">DAY OF ATONEMENT, III</a>, and especially <a href="./study/isbe/search.html?string=EZEKIEL">EZEKIEL, II, 2</a>, where the proof has been furnished that this prophet belongs to a later period than Priestly Code as far as <a onClick="return mV(\'Eze\',40,\'1-\');">Eze 40:1-48:35</a> (containing his picture of the future) in general is concerned, and as far as <a onClick="return mV(\'Eze\',44,4);">Eze 44:4</a>ff (where it is claimed that the prophet first introduces the distinction between priests and Levites) in particular is concerned. All the important problems that are connected with this matter, especially the difficulties which result from the Wellhausen hypothesis, when the questions as to the purpose, the form, the success and the origin of the priestly legislation come under consideration, are discussed in my book, Are the Critics Right? The result of this investigation is all the more noteworthy, as I was myself formerly an adherent of the Wellhausen school, but was forced to the conclusion that this hypothesis is untenable.<P>We have here yet to refer to the one fact that the relation of Deuteronomy (D) and the Priestly Code (P), as far as Leviticus in particular is concerned, justifies the scheme of P followed by D as the historical order, while Wellhausen makes D older than P. <a onClick="return mV(\'Deu\',10,8);">De 10:8</a>f; <a onClick="return mV(\'Deu\',33,8);">33:8</a>ff presuppose more detailed ordinances in reference to the priests such as those which have been given in P. The book of Deuteronomy further takes into account different kinds of sacrifices (compare <a onClick="return mV(\'Deu\',12,5,11,13,17,26);">12:5f; 11,13,17,26</a>; <a onClick="return mV(\'Deu\',15,\'19-23\');">15:19-23</a>; <a onClick="return mV(\'Deu\',17,1);">17:1</a>; <a onClick="return mV(\'Deu\',18,1,3);">18:1,3</A>, such as are described in <a onClick="return mV(\'Lev\',1,\'1-\');">Le 1</a>ff). The law in <a onClick="return mV(\'Deu\',14,\'1-\');">De 14</a> (ordinances with reference to what is clean) agrees almost word for word with <a onClick="return mV(\'Lev\',11,\'1-\');">Le 11</a>, and is in such perfect harmony with the linguistic peculiarities of Priestly Code, that <a onClick="return mV(\'Lev\',11,\'1-\');">Le 11</a> must be regarded as the original, and not vice versa. <a onClick="return mV(\'Deu\',24,8);">De 24:8</a>f refers directly to the injunctions concerning leprosy, as we find these in <a onClick="return mV(\'Lev\',13,\'1-\');">Le 13</a>f; and the Deuteronomic passage is doubtless modeled after that of Lev. <a onClick="return mV(\'Deu\',12,15,22);">De 12:15,22</a>; <a onClick="return mV(\'Deu\',15,22);">15:22</a> cannot be understood at all, except in the light of <a onClick="return mV(\'Lev\',17,13);">Le 17:13</a>. <a onClick="return mV(\'Deu\',26,14);">De 26:14</a>ff again expressly takes into account ideas that have been taken from <a onClick="return mV(\'Lev\',22,3);">Le 22:3</a>ff. As far as the laws dealing with the great feasts in <a onClick="return mV(\'Deu\',16,\'1-\');">De 16</a> are concerned, it is impossible to understand <a onClick="return mV(\'Deu\',16,9);">16:9</a> without <a onClick="return mV(\'Lev\',23,15);">Le 23:15</a>ff, <a onClick="return mV(\'Lev\',23,10);">10</a>f; and the designation "feast of tabernacles" in <a onClick="return mV(\'Deu\',16,13);">De 16:13</a>ff cannot even be understood without a reference to such a law as we find in <a onClick="return mV(\'Lev\',23,39);">Le 23:39</a>ff. The other passages to be discussed on this subject lead us to the following results.<P>2. Connection with Mosaic Period:<P>Even if the Book of Deuteronomy were the product of the 7th century BC, the facts that have been stated above would nevertheless disprove the claim of the Wellhausen hypothesis as to an exilic or post-exilic date for the Priestly Code. But if Deuteronomy, even in its essential and fundamental parts, merely, is Mosaic (compare Are the Critics Right? 1-55), then the Priestly Code which is still older than Deuteronomy must also belong to the Mosaic period.<P>(1) Priestly Code and Desert Conditions.<P>This conclusion is in this point confirmed still further by a series of facts. As Deuteronomy permits the firstborn to be ransomed (<a onClick="return mV(\'Deu\',14,22);">De 14:22</a>), but the Priestly Code demands their consecration in natura (<a onClick="return mV(\'Lev\',27,26);">Le 27:26</a>f; compare <a onClick="return mV(\'Num\',18,15);">Nu 18:15</a>), the latter ordinances could be preferred and enforced only during the wandering in the desert, where the whole nation was in the neighborhood of the sanctuary. The fact that the ordinances dealing with the domestic celebration of the Passover in the private houses on the 14th of Nisan and the holy convocation on the 15th of Nisan at the sanctuary could be carried out only during the wanderings in the desert (compare <a onClick="return mV(\'Exd\',12,3,6);">Ex 12:3ff, 6</a>; <a onClick="return mV(\'Lev\',23,5);">Le 23:5</a>; <a onClick="return mV(\'Num\',28,16);">Nu 28:16</a>; <a onClick="return mV(\'Lev\',27,6);">Le 27:6</a>ff; <a onClick="return mV(\'Num\',28,17);">Nu 28:17</a>ff), and that this was changed in <a onClick="return mV(\'Deu\',16,5);">De 16:5</a>f to correspond to changed conditions, can be seen by reference to <a href="./study/isbe/search.html?string=EXODUS">EXODUS, III, 3</a>. Still more important is a third command in <a onClick="return mV(\'Lev\',17,\'1-\');">Le 17</a> in comparison with <a onClick="return mV(\'Deu\',12,\'1-\');">De 12</a>. The commandment that every animal that is to be slain is to be brought to the central sanctuary can have a purpose only for the Mosaic period, and could not even have been invented at a later period. Because of the entrance of Israel into Canaan, the Book of Deuteronomy changes this ordinance in such a way that from this time on the killing of the animals is permitted at any place (<a onClick="return mV(\'Lev\',12,13,20);">12:13ff, 20ff</a>). The different commands in reference to the carcasses of animals that have died and of those torn to pieces are all dependent on <a onClick="return mV(\'Lev\',17,\'1-\');">Le 17</a>. In <a onClick="return mV(\'Deu\',14,21);">De 14:21</a>, it was possible to forbid the use of such animals absolutely for Israel, because from now on, and in contrast to <a onClick="return mV(\'Lev\',17,\'1-\');">Le 17</a>, the killing of sacrificial animals was permitted at any place (<a onClick="return mV(\'Lev\',17,13);">17:13</a>ff). In <a onClick="return mV(\'Exd\',22,30);">Ex 22:30</a> all use of such meat could be forbidden, because <a onClick="return mV(\'Lev\',17,\'1-\');">Le 17</a>, with its command to bring all blood to the sanctuary, had not yet been given. Leviticus, now, on the other hand, forbids this use only to the priests (<a onClick="return mV(\'Lev\',22,8);">22:8</a>), and sees in this use in the case of the other Israelites only a transitory defilement (compare <a onClick="return mV(\'Lev\',17,15);">Le 17:15</a>; <a onClick="return mV(\'Lev\',11,40);">11:40</a>); and in <a onClick="return mV(\'Lev\',7,24);">7:24</a> forbids only the use of the fat, but not of the meat of these animals; for now, according to <a onClick="return mV(\'Lev\',17,\'1-\');">Le 17:1</a>ff, all the killing is a sacrifice which only those who are clean were permitted to eat and which could not be secured at all times (compare Hoffmann, op. cit., 23f).<P>Our exposition of <a onClick="return mV(\'Lev\',17,\'1-\');">Le 17:1</a>ff is, however, in another respect also of the greatest significance, for in <a onClick="return mV(\'Lev\',17,4,5,6,8);">17:4-6,8</a>f the tent of meeting is presupposed as existing; in <a onClick="return mV(\'Lev\',17,5,8);">17:5,8</a> also different kinds of sacrifices, and in verse <a onClick="return mV(\'Lev\',17,6);">6</a> the priesthood; so that at once further ordinances concerning the tent of meeting, the sacrificial code, the priesthood, such as we find in <a onClick="return mV(\'Exd\',25,\'1-\');">Ex 25</a>ff; <a onClick="return mV(\'Exd\',35,\'1-\');">35</a>; <a onClick="return mV(\'Lev\',1,\'1-\');">Le 1:1-7:38</a>; <a onClick="return mV(\'Exd\',29,\'1-\');">Ex 29</a>; <a onClick="return mV(\'Lev\',8,\'1-\');">Le 8</a>; <a onClick="return mV(\'Lev\',9,\'1-\');">9</a>; <a onClick="return mV(\'Lev\',10,20);">10:21</a>ff, were possible and necessary, and these very laws must probably originate in and date from the Mosaic period. This same conclusion is sustained by the following considerations. For what other source or time could be in harmony with such statements found very often in other parts of Leviticus also, as "into the camp" in <a onClick="return mV(\'Lev\',4,1);">4:11</A>ff; <a onClick="return mV(\'Lev\',6,11);">6:11</a>; <a onClick="return mV(\'Lev\',13,46);">13:46</a>; <a onClick="return mV(\'Lev\',14,3,8);">14:3,8</a> (unconscious contrast to later times); <a onClick="return mV(\'Lev\',14,33,40,41,45,53);">14:33ff, 40,41,45,53</a>; <a onClick="return mV(\'Lev\',16,26,27,28);">16:26-28</a>; <a onClick="return mV(\'Lev\',24,\'10-23\');">24:10-23</a>; or "into the desert," in <a onClick="return mV(\'Lev\',16,10,21);">16:10,21</a>f. In <a onClick="return mV(\'Lev\',6,15,18);">6:15,18</a>; <a onClick="return mV(\'Lev\',6,6);">6:6</a> (compare also <a onClick="return mV(\'Lev\',27,2);">27:2</a>ff), the words "according to thy estimation" are addressed personally to Moses. In <a onClick="return mV(\'Lev\',6,20);">6:20</a> a calculation is based on the day on which Aaron was consecrated to the priesthood, while <a onClick="return mV(\'Lev\',6,22);">6:22</a> is the first that has general coloring. Such hints, which, as it were, have only been accidentally scattered in the body of the laws, and which point to the situation of the lawgiver and of his times, are of especial value for the argument in favor of the Mosaic origin of these laws. Further, we everywhere find that Aaron and his sons are as yet the only incumbents of the priestly office (compare <a onClick="return mV(\'Lev\',1,5,7,8,11);">1:5,7,8,11</a>; <a onClick="return mV(\'Lev\',2,3);">2:3</a>; <a onClick="return mV(\'Lev\',3,13);">3:13</a>; <a onClick="return mV(\'Lev\',6,9,14,16);">6:9,14,16</a>, etc.). All the laws claim to have been given through Moses or Aaron or through both at Mt. Sinai (see I above). And who, in later times, if it was the purpose to magnify the priesthood of Aaron, would have thought of inventing the fact that on the Day of Atonement and on other occasions it was necessary for Aaron to bring a burnt offering and a sin offering for himself (<a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a>; <a onClick="return mV(\'Lev\',8,\'1-\');">8-10</a>; <a onClick="return mV(\'Lev\',6,19);">6:19</a>), or that Moses in his view of a certain cultural act had been mistaken (compare <a onClick="return mV(\'Lev\',10,16);">Le 10:16</a>ff)? The law concerning the Jubilee Year (<a onClick="return mV(\'Lev\',25,\'1-\');">Le 25</a>) presupposes that each tribe is confined in its own district and is not intermingled with the other tribes, a presupposition which was no longer possible after the occupation of Canaan, and is accordingly thinkable only in the Mosaic times. And now let us remember that this fact, when we recall (see II, above) that the unity of the book was proved, is a ground for claiming that the entire book dates from the Mosaic period. As far as Leviticus at least is concerned, there is nothing found in the book that calls for a later date. <a onClick="return mV(\'Lev\',18,24);">Le 18:24</a>ff can be regarded as post-Mosaic only if we translate these verses thoughtlessly, as though the inhabitants of the country were here described as being expelled earlier. On the other hand, in <a onClick="return mV(\'Lev\',18,24);">18:24</a>, just as is the case with the parallel passage, <a onClick="return mV(\'Lev\',20,22);">20:22</a>ff, the idea is, without any doubt, that Israel is not yet in the Holy Land. Accordingly the waw consecutives at this place are to be regarded not as indicating temporal but logical sequences. In the passage <a onClick="return mV(\'Lev\',18,27);">18:27</a>, we further find the archaic form ha\'-el for ha\'-elleh; compare in the Pentateuch <a onClick="return mV(\'Gen\',19,8,25);">Ge 19:8,25</a>; <a onClick="return mV(\'Gen\',26,3,4);">26:3,4</a>; <a onClick="return mV(\'Deu\',4,42);">De 4:42</a>; <a onClick="return mV(\'Deu\',7,22);">7:22</a>; <a onClick="return mV(\'Deu\',19,11);">19:11</a>. Just as little does <a onClick="return mV(\'Lev\',26,\'1-\');">Le 26</a> take us into the exilic period. Only dogmatical prejudices can take offense at prediction of the exile. <a onClick="return mV(\'Lev\',26,\'1-\');">Le 26</a> cannot be regarded as a "prophecy after the event," for the reason, too, that the restoration of the people by God\'s pardon is here promised (compare <a onClick="return mV(\'Lev\',26,40);">26:40</a>ff). And, too, the exile is not the only punishment with which Israel is threatened; and finally as far as Israel is concerned, by the side of the statements concerning their dwelling in one single country (<a onClick="return mV(\'Lev\',26,34,38,41,44);">26:34,38,41,44</a>), it is also said that they are to be scattered among many nations and countries (compare <a onClick="return mV(\'Lev\',26,23,36,39);">26:23,36,39</a>).<P>(2) Unity and Construction Point to Mosaic Origin.<P>If to this we yet add the unity of the thought and of the external construction, looking at the whole matter, we do not see anything that would lead us to accept a post-Mosaic period for this book. Then, too, it is from the outset in itself only probable that Moses gave his people a body of cult-laws and did not leave this matter to chance. We need only think of the great role which among the oriental peoples was assigned to their religious cults. It is indeed nowhere said, in so many words, that Moses wrote even the laws of the Priestly Code. But the references made by Deuteronomy to the Priestly Code; the fact that <a onClick="return mV(\'Num\',33,\'1-\');">Nu 33</a>, which also is credited to Moses, is characterized by the style of Priestly Code; further, that the author of Deuteronomy could write in the style of P (compare <a onClick="return mV(\'Deu\',14,\'1-\');">De 14</a> with <a onClick="return mV(\'Lev\',11,\'1-\');">Le 11</a>); and, per contra, that the author of <a onClick="return mV(\'Lev\',26,\'1-\');">Le 26</a> had the mastery of the style peculiar to Deuteronomy (compare <a onClick="return mV(\'Deu\',28,\'1-\');">De 28</a>)—all this makes it probable that Moses even wrote these things himself; at any rate, no reasons can be cited against this view. Very interesting in connection with the question of the unity of the Pentateuch are the close connecting links between <a onClick="return mV(\'Lev\',18,24);">Le 18:24</a>ff; <a onClick="return mV(\'Lev\',20,22);">20:22</a>, and JE. The question whether Moses in the composition of the book made use of his own notes or of those of others, cannot be decided; but this is an irrelevant matter. What the facts may be in reference to the development of other ordinances, which have taken different forms in the Books of the Covenant and in Priestly Code, or in Deuteronomy and in Priestly Code, and whether the existence of these differences in the cases of particular laws compels us to accept later additions, cannot be discussed at this place. Yet from the outset it is to be emphasized that already in the Mosaic period there could possibly have been reasons for changing some of these laws; especially was this so in the Book of Deuteronomy, just before the people entered the promised land (compare e.g. the laws concerning tithes, <a onClick="return mV(\'Deu\',12,6,17);">De 12:6f; 17ff</a>; <a onClick="return mV(\'Deu\',14,22);">14:22</a>ff; <a onClick="return mV(\'Deu\',26,12);">26:12; <a onClick="return mV(\'Lev\',27,30);">Le 27:30</a>ff; <a onClick="return mV(\'Num\',18,20);">Nu 18:20</a>ff, or the laws concerning contributions for sacrifices, <a onClick="return mV(\'Deu\',18,3);">De 18:3</a>; <a onClick="return mV(\'Lev\',7,29);">Le 7:29</a>ff).<P>Then, too, the decision whether this development took place as early as the time of Moses or not is not to be made dependent on the possibility of our being able to explain the reasons for such changes. We lack both the daily practice in these cultural ordinances, as also the oral instruction which makes these ordinances intelligible. The manner in which in <a onClick="return mV(\'Lev\',1,\'1-\');">Le 1</a>ff the different kinds of sacrifices are introduced sounds as though these were already known to the people and were practiced by them, except in the case of sin and guilt offerings. This is further in harmony with earlier narratives, which already report concerning sacrifices. It is possible that in this way we can also explain a certain relationship between the Jewish sacrificial ritual and that of Babylon (compare Zimmern, Beitrage zur Kenntnis der babylonischen Religion). The ordinances in reference to the clean and the unclean may also have emanated from religious and ethical ideas which are older than Moses\' times. In this matter the thought was decisive, that everything that was impure, everything that suggested death or decay or sin or displeasure to God, should be kept separated and apart from the religion of Yahweh. In all such cases it is not the newness of the laws but their adaptability to the character and spirit of the Yahweh-religion that is to be regarded as the decisive factor.<P>IV. The Significance.<P>1. Positive:<P>(1) The Law Contains God\'s Will.<P>The law contains God\'s will, although in transitory form. In the article <a href="./study/isbe/search.html?string=EZEKIEL">EZEKIEL under II, 2, (3)</a> we have referred to the fact that Leviticism is an important and necessary stage in the development of true religion, and that the entire Old Testament did not advance beyond this stage and was not intended to go beyond it. The leading prophets (<a onClick="return mV(\'Isa\',40,\'1-\');">Isa 40</a>, Jeremiah, Ezekiel), even in their visions of the future, cling to the temple, sacrifices, holy oblations, sacred seasons and persons. Christianity was the first to discard this external shell, after it had ripened the kernel that was concealed in this shell (compare worship in the spirit and in the truth, <a onClick="return mV(\'Jhn\',4,\'20-24\');">Joh 4:20-24</a>). Down to this time, kernel and shell were inseparably united. This must not be forgotten, if we would appreciate the Book of Leviticus properly. It is true that this book to a large extent deals with laws and ordinances, to which we Christians should not and need not return (compare the voice from heaven to Peter, <a onClick="return mV(\'Act\',10,15);">Ac 10:15</a>, "What God hath cleansed, make not thou common," and Paul\'s opposition to all work-righteousness that was based on compliance with these external institutions, e.g. in Romans, Galatians, Colossians, as also his independent attitude over against the Jewish law in those cases where it could not be taken into consideration as the way to salvation; compare <a onClick="return mV(\'Act\',21,17);">Ac 21:17</a>ff; <a onClick="return mV(\'Rom\',14,1);">Ro 14:1</a>ff; <a onClick="return mV(\'1Cr\',9,19);">1Co 9:19</a>ff). But these laws and ordinances were something more than merely external matters, since they contained the highest religious thoughts. We surely should not forget from the outset that <a onClick="return mV(\'Lev\',19,\'1-\');">Le 19</a> contains also the word, "Thou shalt love thy neighbor as thyself" (<a onClick="return mV(\'Lev\',19,18);">19:18</A>), a command which in <a onClick="return mV(\'Lev\',19,33);">19:33</A>f is even made to cover the strangers too, and which by Jesus, next to the absolute love demanded for God, is designated as the chief commandment of the law (<a onClick="return mV(\'Mat\',22,39);">Mt 22:39</a>); and when in <a onClick="return mV(\'Lev\',19,17);">19:17</a>f the hatred of the brother and desire for revenge on him are forbidden, we already seem to breathe atmosphere of Christianity. The entire <a onClick="return mV(\'Lev\',19,\'1-\');">Le 19</a> is, in addition, as it were, a sermon on almost all of the commandments of the Decalogue, the abiding authority of which the Christian, after the example and interpretation of Jesus, will at once recognize. But as the Decalogue itself is found enclosed in the specifically Jewish national shell (compare <a onClick="return mV(\'Exd\',20,2);">Ex 20:2</a>, Exodus out of Egypt; <a onClick="return mV(\'Lev\',20,8);">20:8</a>, Sabbath commandment; <a onClick="return mV(\'Lev\',20,12);">20:12</a>, promise of the holy land; <a onClick="return mV(\'Lev\',20,17);">20:17</a>, slaves), so, too, this is the case in <a onClick="return mV(\'Lev\',19,\'1-\');">Le 19</a> (compare <a onClick="return mV(\'Lev\',19,3,6,20,\'20-25\',29,30,33);">19:3,6ff, 20-22,23-25,29,30,33</a>f). But how little the specifically Levitical ordinances, in the narrower sense of the term, exclude the spiritual factor, and how closely they are interwoven with the deepest of thoughts, can be seen from <a onClick="return mV(\'Lev\',26,\'1-\');">Le 26</a>, according to which all merely external sacrifices, into which formalism naturally the Levitical legal code could degenerate, do not protect from punishment, if the heart remains uncircumcised (<a onClick="return mV(\'Lev\',26,30,41);">26:30f; 41</a>).<P>Above all, there are four leading thoughts which are emphasized forcibly, particularly by the legal system of Priestly Code. In reality all times, all places, all property, all persons are sacred to God. But as it is impossible that this ideal should be realized in view of the imperfections and guilt of man, it was decided that certain particular seasons and places, gifts and persons should be separated from others, and that in these this sacredness should be realized as far as possible, and that these representatives should by their mere existence continually remind the people of God\'s more comprehensive claims, and at the same time arouse and maintain the consciousness that their entire life was to be saturated by the thoughts of a holy God and His demands. From this point of view, none of the particular laws are worthless; and when they are once appreciated in this their central significance, we can understand that each law has its share in the eternal authority of the law (compare <a onClick="return mV(\'Mat\',5,17);">Mt 5:17</a>f). Paul, too, who absolutely rejects the law as a way to salvation expresses no doubt that the law really contains the will of God (<a onClick="return mV(\'Rom\',8,3);">Ro 8:3</a>f); and he declares that it was the purpose of the sending of Jesus, that the demands made upon us by the law should be fulfilled; and in <a onClick="return mV(\'Rom\',13,10);">Ro 13:10</a> he tells us that love is the fulfillment of the law (compare <a onClick="return mV(\'Rom\',13,8);">13:8</a>); and according to <a onClick="return mV(\'Rom\',7,12);">Ro 7:12</a>, it is certain that the law is holy and the commandment is holy, righteous and good.<P>(2) The Law Prepares for the Understanding of Christianity.<P>But the ceremonial law, too, contains not only the demands of God\'s will. It prepares also for the understanding of the work, the person and the mission of Jesus. In <a onClick="return mV(\'Exd\',25,8);">Ex 25:8</a>; <a onClick="return mV(\'Exd\',29,45);">29:45</a>f; <a onClick="return mV(\'Exd\',40,34);">40:34</a>ff the indwelling of God in the tent of meeting is declared, which prophesied the incarnation of God in Christ Jesus (<a onClick="return mV(\'Jhn\',1,14);">Joh 1:14</a>); and then the indwelling of God through the Holy Spirit in the Christian congregation (<a onClick="return mV(\'1Pe\',2,5);">1Pe 2:5</a>; <a onClick="return mV(\'Eph\',4,12);">Eph 4:12</a>) and in the individual (<a onClick="return mV(\'1Cr\',3,16);">1Co 3:16</a>; <a onClick="return mV(\'1Cr\',6,19);">6:19</a>; <a onClick="return mV(\'2Cr\',6,16);">2Co 6:16</a>; <a onClick="return mV(\'Jhn\',14,23);">Joh 14:23</a>). Through the sacrificial system in <a onClick="return mV(\'Lev\',1,\'1-\');">Le 1-7</a>, and the ordinances of the Day of Atonement (<a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a>), we are enabled to understand the character of sin, of grace and of the forgiveness of sin (compare <a href="./study/isbe/search.html?string=ATONEMENT,+DAY+OF">ATONEMENT, DAY OF, sec. II</a>). Let us remember to what extent Jesus and Paul, the Epistle to the Hebrews, and the other New Testament writings operate with Old Testament thoughts, particularly with those of Leviticus (priest-hood, sacrifices, atonement, Passover, signification of blood, etc.), and Paul correctly says that the righteousness of God was prophesied, not only by the prophets, but also by the law (<a onClick="return mV(\'Rom\',3,21);">Ro 3:21</a>).<P>(3) The Law as a Tutor unto Christ.<P>Finally, the ceremonial law too has the purpose to protect Israel from the errors of the heathen, a thought that is especially emphasized in the Law of Holiness (compare <a onClick="return mV(\'Lev\',18,3,14);">Le 18:3,14</a>ff; <a onClick="return mV(\'Lev\',19,26);">19:26</a>ff; <a onClick="return mV(\'Lev\',20,2,22);">20:2ff, 22ff</a>; <a onClick="return mV(\'Lev\',26,1);">26:1</a>) and which is in harmony with the elementary stage of Israel\'s education in the Old Testament, when the people still stood in need of the "tutor...unto Christ" (<a onClick="return mV(\'Gal\',3,23);">Ga 3:23</a>f; <a onClick="return mV(\'Gal\',4,1);">4:1</a>). This already leads us over to the negative side, which Paul particularly emphasizes.<P>2. Negative:<P>The law is in itself holy, and the commandment is holy and righteous and good (<a onClick="return mV(\'Rom\',7,12);">Ro 7:12</a>), but it has lost its power because the flesh of man is sinful (compare <a onClick="return mV(\'Rom\',8,3);">Ro 8:3</a>); and thus it happens that the law is the occasion for sin and leads to a knowledge of sin and to an increase of sin (compare <a onClick="return mV(\'Rom\',3,20);">Ro 3:20</a>; <a onClick="return mV(\'Rom\',4,15);">4:15</a>; <a onClick="return mV(\'Rom\',5,20);">5:20</a>; <a onClick="return mV(\'Rom\',7,13);">7:13</a>); and this shall be brought about according to the purposes of God in order that in upright hearts the desire for forgiveness should arise. It is true that nothing was so well adapted as were the details of the law, to bring to consciousness in the untutored mind that in which man yet came short of the Divine commands. And as far as the removal of the guilt was concerned, nothing was needed except the reference to this in order to make men feel their imperfections (compare <a onClick="return mV(\'Hbr\',7,\'1-\');">Heb 7-10</a>). God merely out of grace was for the time being contented with the blood of goats and of calves as a means for atonement; He was already counting on the forgiveness in Christ (<a onClick="return mV(\'Rom\',3,25);">Ro 3:25</a>). All the sacrifices in <a onClick="return mV(\'Lev\',1,\'1-\');">Le 1-7</a>, e.g., did not make the ritual of the Day of Atonement superfluous (<a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a>); and in this case the very man who brought the sacrifice was also a sinful creature who must first secure the forgiveness of God for himself. Only Jesus, at once the perfect priest and the perfect sacrifice, has achieved the perfect redemption. It accordingly remains a fact that the righteousness which avails before God can be secured only through faith in Jesus Christ, and not through the deeds of the law (Romans and Galatians).<P>The law with its incomplete atonement and with its arousing of the consciousness of sin drives man to Jesus; and this is its negative significance. Jesus, however, who Himself has fulfilled the demands of the law, gives us through His spirit the power, that the law with its demands (1, (1) above) may no longer stand threateningly over against us, but is now written in our hearts. In this way the Old Testament law is fulfilled in its transitory form, and at the same time becomes superfluous, after its eternal contents have been recognized, maintained and surpassed.<P>LITERATURE.<P>Commentaries by Ryssel, Lange, Keil, Strack, Baentsch, Bertholet; especially for the Law of Holiness see Horst, <span class="noTag">Le 17:1-26:46</span> and Ezk; Wurster, Zeitschrift fur alttestamentliche Wissenschaft,1884,112ff; Baentsch, Das Heiligkeitsgesetz; Klostermann, Der Pentateuch, 368ff; Delitzsch, Zeitschrift fur kirch. Wissenschaft und Leben,1880,617ff; Intros to the Old Testament by Baudissin, Strack, Kuenen, Konig, Cornill, Driver, Sellin; Archaeology, by Benzinger, Nowack; History of Israel, by Kohler, Konig, Kittel, Oettli, Klostermann, Stade, Wellhausen; for kindred laws in Babylonia, compare Zimmern, Beitrage zur Kenntnis der babyl. Religion; against the Graf-Wellhausen hypothesis, Moller, Are the Critics Right? (ibid., "Literature"), and article <a href="./study/isbe/search.html?string=EZEKIEL">EZEKIEL</a> in this Encyclopedia; Orr, Orr, The Problem of the Old Testament; Wiener, Wiener, Essays in Pentateuchal Criticism, Wiener, Origin of the Pentateuch; Hoffmann, Die wichtigsten Instanzen gegen die Graf-Wellhausensche Hypothese; Kegel, Wilh. Vatke und die Graf-Wellhausensche Hypothese.``122';

isbe[5507]='Lewd; Lewdness`lud, lud\'-nes (zimmah, mezimmah, nabhluth; poneros, rhadiourgema):<P>1. In the Old Testament:<P>There are three Hebrew words translated "lewd," "lewdness":<P>(1) Zimmah, meaning a "plan," a "purpose," so translated several times and then shading off into "evil plan"; translated also "heinous crime," "wicked purpose or device." It is the most frequent word for "lewdness": <a onClick="return mV(\'Eze\',16,27);">Eze 16:27</a>, "lewd way"; found in <a onClick="return mV(\'Jdg\',20,6);">Jud 20:6</a>; <a onClick="return mV(\'Eze\',16,27,43,58);">Eze 16:27,43,58</a>; <a onClick="return mV(\'Eze\',22,9,11);">22:9,11</a>; <a onClick="return mV(\'Eze\',23,21,27,29,35,\'44-48\',49);">23:21,27,29,35,44-48,49</a>; <a onClick="return mV(\'Eze\',24,13);">24:13</a>; <a onClick="return mV(\'Hsa\',6,9);">Ho 6:9</a>.<P>(2) Mezimmah means a "plan," generally "(evil) machination"; used only in <a onClick="return mV(\'Jer\',11,15);">Jer 11:15</a>, "lewdness."<P>(3) Nabhluth, meaning "disgrace" in reference to females. Found only in <a onClick="return mV(\'Hsa\',2,10);">Ho 2:10</a>; the American Revised Version margin "shame."<P>2. In the New Testament:<P>The word translated "lewd," "lewdness" in the King James Version occurs only twice in the New Testament, and in each instance is more correctly translated in the Revised Version (British and American) by another word:<P>(1) Poneros, found in <a onClick="return mV(\'Act\',17,5);">Ac 17:5</a>, translated in the American Standard Revised Version "vile." The Greek word elsewhere is translated "bad," "evil," "grievous," "harmful," "malicious," "wicked." the King James Version "lewd" gives the wrong impression. The idea of unchastity is not present in the text or context.<P>(2) Rhadiourgema likewise occurs only once, namely, <a onClick="return mV(\'Act\',18,14);">Ac 18:14</a>, and is correctly translated in the Revised Version (British and American) and the American Standard Revised Version "wicked villany." The thought of impurity or lewdness is foreign to the meaning in this connection.``142';
