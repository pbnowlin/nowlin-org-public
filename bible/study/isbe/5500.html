 in the later sense of the holder of an office distinct from and superior to the presbyterate. Episkopoi ("bishops") are mentioned (Sim., ix.27) as "given to hospitality," the description of the episkopos in <a onClick="return mV(\'1Ti\',3,2);">1Ti 3:2</a>, where admittedly bishop = presbyter.<P>VIII. Second Epistle of Clement.<P>1. Nature of Document:<P>This writing is doubly miscalled: it is neither an epistle nor a composition of Clement. Style, thought, and standpoint differ from those of the accepted Ep., and HE, III,38,suggests that the Clementine authorship was not generally recognized. The recent recovery by Bryennios of the previously lost conclusion proves that the writing is a sermon (chapter xix).<P>Antiquity is indicated by (1) the use, as an authority, of the lost heretical Gospel of the Egyptians, which by the time of the Canon Muratori (175 AD) had ceased to be regarded as Scripture by Catholics; (2) the adoption, without Gnostic intention, of phrases which became notably associated, after 150 AD with Gnosticism: "God made male and female: the male is Christ, the female, the church" (chapter xiv).<P>2. Date and Authorship:<P>The date usually assigned is 120-150 AD (Lightfoot, Part I, volume II, 201). The author is a Gentile presbyter; he had "worshipped stocks and stones." The sermon was probably preached at Corinth, for the preacher describes many arriving by sea for the race-course, without mentioning a port, which would be appropriate in a sermon preached to Corinthians.<P>3. Contents:<P>No text is given, but the sermon starts from <a onClick="return mV(\'Isa\',54,1);">Isa 54:1</a>, without express quotation; this chapter had probably been read at the service. The discourse, without great literary merit, is earnest and practical. There are exhortations to repentance and good works, to purity, charity, prayer and fasting, with special reference to coming judgment. The standpoint is that of James. "Be not troubled (so the sermon concludes) because we see the unrighteous with abundance, and God\'s servants in straits. Let us have faith, brethren and sisters. Had God recompensed the righteous speedily, we should have had training not in piety but in bargaining; and our uprightness would be a mere semblance, since our pursuit would be not of godliness but of gain."<P>4. Notabilia:<P>(1) The sermon is the oldest extant in post-New Testament times, and appears to have been read (chapter xix) to a congregation.<P>(2) Sayings of Christ not in our Gospels are quoted:<P>(a) "The Lord, being asked when His kingdom would come, answered: When the two shall be one (i.e. when harmony shall prevail?), and when the outside shall be as the inside (i.e. when men shall be as they seem?); and the male with the female, neither male nor female" (interpreted by this preacher ascetically as discountenancing marriage, presumably because "the time is short," but explained mystically by Clement of Alexandria in Strom., iii.13, as indicating the abolition of all distinctions in God\'s kingdom). Clement assigns the passage to the lost Gospel of the Egyptians.<P>(b) "The Lord saith, ye shall be as lambs among wolves. Peter answered: What if the wolves tear the lambs? Jesus said: Let not the lambs fear the wolves: and ye, also, fear not them which kill you, and can do nothing more to you."<P>(3) No episcopate, apparently, in the post-New Testament sense, existed in the church where this sermon was delivered. Unfaithful men are represented as confessing, "We obeyed not the presbyters when they told us of salvation." Had a bishop in the later sense been head of the community, obedience to his admonitions would surely have been inculcated.<P>(4) The Christology is high; "We ought to think of Christ as of God"; "When we think mean things of Christ, we expect to receive mean things" (chapter i).<P>IX. Apology of Aristides.<P>1. Recovery and Date:<P>Aristides was an Athenian philosopher, who (according to HE, IV, 3) presented an Apology to Hadrian, presumably when the emperor was at Athens (125 AD). After disappearance in the 17th century, a fragment in an Armenian version was discovered in 1878, and the entire Apology in Syriac was found in 1889. It was then found that almost the whole treatise was imbedded anonymously in a Greek medieval romance, Barlaam and Josaphat. The Apology in the Syriac is inscribed to Antoninus; it may have been addressed to both emperors successively, or the real date may be 137, when they were colleagues in the empire.<P>2. Contents:<P>The treatise refers to oppression, imprisonment, and other maltreatment endured by Christians, and pleads for their protection against persecution, because of their true and noble creed, and their pure and benevolent lives. The writer compares the Christian doctrine of Godhead with that of barbarians, Greeks, Egyptians, Jews, and dwells on the elevating influence of Christian belief in Jesus Christ and in a future life. He refers to the abstention of Christians from unchastity, dishonesty and other vices; to their abounding charity and brotherliness which are shown particularly to the widow, the orphan, the poor, the stranger, the oppressed, and even their oppressors. All who become Christians, of however low a station, are brethren. This bright picture has, however, its shadows: "If Christians see that one of their number has died in his sins, over him they weep bitterly as over one about to go into punishment." This frank acknowledgment of some black sheep gives point to his general testimony, "Blessed is the race of Christians above all men."<P>3 Notabilia:<P>(1) A distinct reference to a collection of Christian writings, and especially of Gospels, designated the Gospel, and indicating the existence of a kind of rudimentary New Testament Canon.<P>(2) Similar indication of a rudimentary Apostles\' Creed. Christians are said to believe in God, "the Maker of Heaven and earth, and in Jesus Christ who was born of a Hebrew virgin, who was transfixed by the Jews; he died and was buried; and Christians state that after three days he rose again and ascended into heaven." In this early time the virgin birth was apparently a settled matter—part of the Creed.<P>(3) Aristides describes a familiar custom among poor Christians of fasting two or three days, so as to supply with needful food Christians poorer still (Compare Hermas).<P>(4) The Apology is interesting as the earliest known literary tribute of a philosopher to Christianity, and probably the earliest extant defense of the faith, if the Epistle to Diognetus be not ancient. It is notable also as a treatise on Christian evidence drawn not from miraculous credentials, but from the self-evidencing excellence and effect of Christianity.<P>Finally, it is interesting as the earliest detailed record of harvest reaped at Athens from seed sown by Paul 80 or 90 years before. Athens appeared at first a barren soil; but by and by this church in a university city took the lead, as this treatise and another lost apology by Quadratus show, in the literary defense of the Christian faith. Quadratus is stated in HE IV,3,to have presented his Apology to Hadrian, and is described by Jerome as "a disciple of the apostles." In a fragment preserved in HE, he attests the survival ("to our own day") of some whom Christ had healed.<P>X. Justin Martyr.<P>1. Incidents of Life:<P>Born of pagan parents at Flavia Neapolis (Nablous), in Samaria about 100 AD—a seeker for truth, who, after trying Stoic, Peripatetic, Pythagorean and Platonic philosophies, found in Christ and Christianity the satisfaction of philosophic cravings and spiritual needs. He became a Christian apostle and apologist, wearing still the philosopher\'s mantle in token of continued quest after wisdom, but making it now his life-work, not as presbyter, but as itinerating Christian teacher, to impart to pagan, to Jew and also to heretic the truth which he himself had found and prized. After long Christian service, he suffered martyrdom under Aurelius in 166 AD.<P>2. First Apology:<P>It is addressed to Antoninus and dated 138-48. He approaches the emperor without flattery, and asks judgment after searching inquiry. He answers three charges against Christians:<P>(1) atheism: Justin replies that Christians were atheists only as Socrates was; they disbelieved in so-called gods who were wicked demons or humanly fashioned images; but they worshipped the Father of Righteousness;<P>(2) immorality: Justin admits the existence of pretended Christians who are evil-doers; but Christianity makes the evil good, the licentious chaste, the covetous generous, the revengeful forgiving;<P>(3) disloyalty: this is calumny based on the preaching of Christ\'s kingdom which is spiritual, not temporal.<P>Christians are taught and are wont to pay tribute promptly and to pray for rulers regularly. Justin then sets forth the credibility and excellence of Christianity, adducing,<P>(1) its pure morality as contrasted with vices condoned by heathens,<P>(2) its noble doctrines—immortality, resurrection, future judgment, incarnation,<P>(3) Old Testament prophecy regarding the Divinity and sufferings of the Christ. His reference to the prediction of a virgin bringing forth Emmanuel (chapter xxxiii) shows that in his day the virgin birth was accepted, although Jews understood by virgin (in Isaiah) merely a young woman,<P>(4) foreshadowings of Christian truth by philosophy, referring especially to Plato\'s teaching about the Divine Logos and judgment to come.<P>To refute prevalent calumny Justin describes Sunday service and administration of sacraments in his time. On the Lord\'s Day Christians assembled for worship; prophetic Scriptures and "memoirs" by apostles and their followers were read; prayers and thanksgivings were offered and an address delivered by the "president"; bread and wine were distributed and sent by deacons to those absent; and an offering for charitable purposes was made. "As many as believe what is taught, and undertake to live accordingly, are, after prayer and fast, baptized" (chapters lxv, lxvii).<P>3. Second Apology:<P>This is probably a postscript to the first; Eusebius quotes from both as from one work. After a protest against a recent summary execution of three Christians without proper trial, Justin deals with two popular taunts:<P>(1) "If at death they went to heaven, why did they not commit suicide?": "We do not shrink from death but from opposing God\'s will."<P>(2) "If God is really on the Christians\' side, why does He allow them to be persecuted?": "The world by Divine decree is meanwhile under the dominion of angels who have become demons." Justin here contrasts Christ with Socrates, whom yet he describes as a preacher of the "true but then unknown God" (chapter x): "No one put such faith in Socrates as to die for his convictions." Christ hath won the faith, "not only of philosophers, but of simple folk who through faith can despise death." Justin, however, testifies clearly and warmly to the Christian element by anticipation, in the higher teachings and aspirations of heathen philosophy through an implanted seed of the Divine Logos; and he recognizes thus a pre-advent ministry of the Son of God, not only in the sheltered fold of Judaism, but in the broad open of heathendom.<P>4. Dialogue with Trypho the Jew:<P>This Dialogue indicates the attitude of some cultured Jews of that day to Christianity, and the mode in which their objections to it were met. Trypho argued that Jesus did not fulfill Old Testament prophecy which represented the Messiah as establishing a glorious and everlasting kingdom; whereas Jesus was a humble peasant who died an ignominious death; Justin pleads <a onClick="return mV(\'Isa\',53,\'1-\');">Isa 53</a>. Trypho charges Christianity with treason to theocracy through exalting Jesus to Godhead, thus trenching on the Divine unity, and also through repudiating the perpetual obligation of the Law. Justin, in reply, quotes Genesis, "Let us make man," and also <a onClick="return mV(\'Psa\',45,\'1-\');">Psalms 45</a>, <a onClick="return mV(\'Psa\',72,\'1-\');">72</A>,<a onClick="return mV(\'Psa\',110,\'1-\');">110</a>, with <a onClick="return mV(\'Isa\',7,\'1-\');">Isa 7</a> about Emmanuel. The Mosaic Law was intended to be temporary, and was now superseded by the Law of Christ; moreover, the destruction of Jerusalem rendered complete fulfillment of the Jewish Law impracticable. The disputants part on friendly terms, "I have been particularly pleased with this conference," says Trypho. "If we could confer oftener we should be much helped in reading the Scriptures." "For my part," replies Justin, "I would have wished to repeat our conference daily; but since I am about to set sail, I bid you give all diligence in this struggle after salvation." Of other works ascribed to Justin, two (On the Resurrection and Appeal to the Greeks) may or may not be genuine; the others are spurious.<P>5. Notabilia:<P>(1) Justin\'s Quotations:<P>Bearing of Justin\'s quotations from "memoirs" on the Age of Our Gospels (see <a href="./study/isbe/search.html?string=GOSPELS">GOSPELS</a>).<P>(2) Testimony to Harmony of Apostolic Doctrine.<P>Justin is a disciple of Paul, and a strong anti-Judaist; yet he recognizes thoroughly the Twelve as the true source of Christian teaching, "sent by Christ to teach to all the Word of God" (1 Ap., 39, 49; Dial., 42, 109).<P>(3) Diffusion of Christianity:<P>From personal knowledge as a traveler, Justin testifies to the wide diffusion of Christianity: "No race of men exists among whom prayers are not offered up to the Father through the name of the crucified Jesus (Dial., 117).<P>(4) Authorship of Revelation:<P>"John, one of the apostles, prophesied, by a revelation made to him, that believers would dwell 1,000 years in Jerus" (Dial., 81)—the earliest direct witness to Johannine authorship, by one who had resided at Ephesus.<P>(5) Belief of the Primitive Church in Our Lord\'s True Divinity:<P>Writing in the name of Christians as a body, he declares, "Both Him (the Father) and the Son who came forth from Him we adore" (1 Ap., 5). He speaks also of some "who held that Jesus was a mere man" as a small and heretical minority (Dial., 48). He writes elsewhere (1 Ap., 13) of the Son as the object of worship "in the second place"; but this statement, made long before the Arian Controversy necessitated precision of language, does not invalidate his other testimonies.<P>(6) The Holy Spirit:<P>As to the Holy Spirit, Justin refers to baptism as administered in "the name of Father, Son, and Spirit" (1 Ap., 61), implying the Divinity of the Third Person; although elsewhere he appears to subordinate Him to the Son, as the Son to the Father. He is to be "worshipped in the third order" (1 Ap., 13).<P>(7) Millenarianism:<P>"I and others are assured that there will be a resurrection of the dead and 1,000 years in Jerusalem which will be built, adorned and enlarged" (Dial., 80). He admits, however, that many pure and pious Christians think otherwise.<P>(8) Future punishment: On this subject Justin speaks with two voices. In 1 Ap.,8,he writes of "condemned souls suffering eternal punishment, not for a millennial period only." But in Dial.,5,he introduces an old man who was the immediate means of his conversion as saying that "the wicked shall be punished as long as God shall will them to exist."<P>(9) Angel-worship:<P>In 1 Ap.,6,Justin, when refuting the charge of atheism, writes: "We reverence and worship the Father, and the Son, and the host of other good messengers (or angels), and the Prophetic Spirit." The context, however, shows that this cult does not necessarily amount to what is usually meant by worship, but simply to veneration and homage. The Greek words here, sebomai and proskuneo, are often used in this lower sense; and the train of thought seems to be this: "You call us atheists; the charge is not true, for we not only believe in one God and Father of all, but in one who is preeminently the Son of God, who was sent by God. We believe further in other heavenly messengers from God, a host of angelic spirits; yea we believe in one who is preeminently God\'s Spirit, by whom prophets were inspired. All these are the object in different degrees of our veneration and homage." Undoubtedly, however, the statement is at best unguarded and misleading.<P>(10) Doctrine of the Sacraments:<P>Justin uses "regenerate" as the synonym of "baptized" (1 Ap., 61), but he identifies the two, not as essentially inseparable, but as uniformly associated. As regards the Lord\'s Supper, while emphasizing the ideas of commemoration, communion, and thanksgiving, he in one place speaks of the bread and wine being the flesh and blood of the Incarnate Jesus, "from which, by a transmutation, our flesh and blood are nourished" (1 Ap., 66). These words tend to transubstantiation; but, in the absence of any controversy at the time, may be no more than a strongly figurative representation of a spiritual participation.<P>XI. Epistle to Diognetus.<P>1. Date and Authorship:<P>This short apologetic work is mentioned by no ancient writer, and was unknown until its discovery in 1592 by Henry Stephens in a manuscript which perished in the Strassburg fire of 1870. The manuscript appears to ascribe it to the author of another work (To the Greeks); and this, again, is attributed with some probability on the authority of a Syriac document (600-700 AD) to one Ambrosius, "chief among the Greeks" otherwise unknown (see Birks in DCB, "Ep. to D."). If genuinely ancient, the epistle probably belongs to the Sub-apostolic Age, for it refers to Christianity as "having only now entered the world, not long ago"; and in chapter xi (written, however, by a different hand or at a different time) the author calls himself a "disciple of the apostles." Diognetus was a very common Greek name, so that his identification with the tutor of Marcus Aurelius (130-40 AD) is a mere conjecture. Donaldson (Chr. Lit., II, 142) inclines to the belief that the work was composed by one of the many Greeks who came westward in the 14th century and that the author intended merely to write a "good declamation in the old style." The smart but superficial way in which heathenism and Judaism are dealt with is more befitting a medieval rhetorical exercise than the serious treatment, by a cultured writer, of prevalent religions.<P>2. Contents:<P>The author, after welcoming the inquiry of Diognetus about Christianity, pours contempt on the pagan worship of gods of wood, stone and metal, without any apparent realization that for cultured heathens of that time such images were not objects, but only symbolic media of worship; and he ridicules Mosaic observances without any recognition of their significance as a Divine educative discipline. But when he proceeds (chapters vii through xii) to describe Christianity, the work merits Hefele\'s designation, praestantissima Epistola. Into a world, yea, into human hearts, which had become degenerate and wicked, "God sent no mere servant or angel, but His own Son," and Him, not as a condemning Judge, or fear-inspiring Tyrant, but as a gracious Saviour. To the inquiry, "If Christianity is so precious, why was Christ sent so late?" the author replies: "In order first to bring home to mankind their unworthiness to attain eternal life through their own works" and their incapacity for salvation apart from Him "who is able to save even what it was impossible (formerly) to save." But faith in the Son of God now revealed, would lead to "knowledge of the Father"; knowledge of God to "love of Him who hath first so loved us"; and love of God to "imitation of Him and of His lovingkindness." And wherein consists such imitation? Not in "seeking lordship over those weaker," or in "showing violence toward those below us"; but in "taking on oneself the burden of one\'s neighbor," even as "God took on Himself the burden of our iniquities, and gave His own Son as a ransom for us." "He who in whatsoever he may be superior is ready to benefit another who is deficient; he who, by distributing to the needy what he has received from God, becomes a god to those who receive his benefits: he is an imitator of God."<P>LITERATURE.<P>Lightfoot, Apostolic Fathers, larger and smaller editions; in Clark\'s "Ante-Nicene Libary," Apostolic Fathers, Justin Martyr, and Recently Discovered Additions to Early Christian Literature (American edition, The Ants-Nicene Fathers); Eusebius, HE, particularly McGiffert\'s translation with excellent notes; James Donaldson, Critical History of Christian Literature; Cruttwell, Literary History of Early Christianity; Kruger, History of Early Christian Literature, translation by Gillett; Harnack, Geschichte der altchr. Litt.; Zahn, Geschichte des New Testament Kanons; Forschungen zur Gesch. des New Testament Kanons und der altchr. Lift.; Robinson, Texts and Studies, Aristides; Schaff, Oldest Christian Manual: H.D.M. Spence, Teaching of the Twelve Apostles; Bartlet, article on "Didache" in HDB; Cunningham, Epistle of Barnabas; articles in DCB (Smith and Wace).``30';
isbe[5551]='Litter`lit\'-er (tsabh): (1) Used upon backs of camels for easy riding, made of a wooden frame with light mattress and pillows, also a covering above, supported by upright pieces, sometimes having also side awnings for protection from the sun\'s rays. Mule litters were made with pairs of shafts projecting before and behind, between which the animals were yoked (<a onClick="return mV(\'Isa\',66,20);">Isa 66:20</a>). Litter-wagons (\'eghloth tsabh) are mentioned in <a onClick="return mV(\'Num\',7,3);">Nu 7:3</a>; the horse litter (phorion) is mentioned in 2Macc 9:8; compare <span class="noTag">3:27</a>. (2) mittah, "palanquin" or "litter of Solomon" (<a onClick="return mV(\'Sgs\',3,7);">So 3:7</a>; compare <a onClick="return mV(\'Sgs\',3,9);">So 3:9</a>).`<a href="./study/isbe/search.html?string=PALANQUIN">PALANQUIN</a>`1';
isbe[5552]='Little Genesis``<a href="./study/isbe/search.html?string=BOOK+OF+JUBILEES">BOOK OF JUBILEES</a>`1';
isbe[5553]='Lively; Living`liv\'-li, liv\'-ing (chay; zao): "Living," sometimes "lively," is the translation of chay (often also translated "life"); it denotes all beings possessed of life (<a onClick="return mV(\'Gen\',1,21,24);">Ge 1:21,24</a>; <a onClick="return mV(\'Gen\',2,7,19);">2:7,19</a>; <a onClick="return mV(\'Exd\',21,35);">Ex 21:35</a>, "live"); we have frequently the phrase, "the land of the living" (as contrasted with she\'ol, the abode of the dead), e.g. <a onClick="return mV(\'Job\',28,13);">Job 28:13</a>; <a onClick="return mV(\'Psa\',27,13);">Ps 27:13</a>; <a onClick="return mV(\'Psa\',52,5);">52:5</a>; <a onClick="return mV(\'Isa\',38,11);">Isa 38:11</a>; the characteristically Biblical expression, "the living God," also frequently occurs (<a onClick="return mV(\'Jos\',3,10);">Jos 3:10</a>; <a onClick="return mV(\'1Sa\',17,26,36);">1Sa 17:26,36</a>; <a onClick="return mV(\'2Ki\',19,4);">2Ki 19:4</a>; <a onClick="return mV(\'Psa\',84,2);">Ps 84:2</a>); also frequently in the New Testament as the translation of zao (<a onClick="return mV(\'Mat\',16,16);">Mt 16:16</a>; <a onClick="return mV(\'Mat\',26,63);">26:63</a>; <a onClick="return mV(\'Jhn\',6,57);">Joh 6:57</a>, "the living Father"; <a onClick="return mV(\'Act\',14,15);">Ac 14:15</a>); "lively" in <a onClick="return mV(\'Exd\',1,19);">Ex 1:19</a> (chayeh) and <a onClick="return mV(\'Psa\',38,19);">Ps 38:19</a> denotes fullness of life, vigor; chayyah, "a living being," is mostly confined to Ezekiel, translated "living creatures" (<a onClick="return mV(\'Eze\',1,5,13,14);">1:5,13,14</A>, etc.), also <a onClick="return mV(\'Gen\',1,28);">Ge 1:28</a>; <a onClick="return mV(\'Gen\',8,17);">8:17</a>, "living thing"; "living" is sometimes applied figuratively to that which is not actually alive; thus we have the phrase "living waters" (<a onClick="return mV(\'Jer\',2,13);">Jer 2:13</a>; <a onClick="return mV(\'Jer\',17,13);">17:13</a>; <a onClick="return mV(\'Zec\',14,8);">Zec 14:8</a>, "Living waters shall go out from Jerusalem") in contrast with stagnant waters—waters that can give life; so <a onClick="return mV(\'Jhn\',4,10,11);">Joh 4:10,11</a> (bubbling up from the spring at bottom of the well); <a onClick="return mV(\'Jhn\',7,38);">7:38</a>; <a onClick="return mV(\'Rev\',7,17);">Re 7:17</a> the King James Version; "living bread" (<a onClick="return mV(\'Jhn\',6,51);">Joh 6:51</a>); a new and living way (<a onClick="return mV(\'Hbr\',10,20);">Heb 10:20</a>), perhaps equivalent to "ever-living" in Christ; "living stones" (<a onClick="return mV(\'1Pe\',2,4,5);">1Pe 2:4,5</a>) are those made alive in Christ; a "living hope" (a hope full of life), <a onClick="return mV(\'1Pe\',1,3);">1Pe 1:3</a>; "living" (zao)is sometimes also "manner of life" (<a onClick="return mV(\'Luk\',15,13);">Lu 15:13</a>; <a onClick="return mV(\'Col\',2,20);">Col 2:20</a>); diago, "to lead or go through," is also so translated (<a onClick="return mV(\'Tts\',3,3);">Tit 3:3</a>); bios is "means of life," translated "living" (<a onClick="return mV(\'Mar\',12,44);">Mr 12:44</a>; <a onClick="return mV(\'Luk\',8,43);">Lu 8:43</a>); "living," in this sense, occurs in Apocrypha as the translation of zoe, "Defraud not the poor of his living" (Ecclesiasticus 4:1).<P>The Revised Version (British and American) has "living" for "alive" (<a onClick="return mV(\'Lev\',14,4);">Le 14:4</a>), for "the lively" (<a onClick="return mV(\'Act\',7,38);">Ac 7:38</a>), for "quick" (<a onClick="return mV(\'Hbr\',4,12);">Heb 4:12</a>), for "lively" (<a onClick="return mV(\'1Pe\',1,3);">1Pe 1:3</a>; <a onClick="return mV(\'1Pe\',2,5);">2:5</a>), for "conversation" (<a onClick="return mV(\'1Pe\',1,15);">1Pe 1:15</a>; <a onClick="return mV(\'2Pe\',3,11);">2Pe 3:11</a>); "living creatures" for "beasts" (<a onClick="return mV(\'Rev\',4,6);">Re 4:6</a>; <a onClick="return mV(\'Rev\',5,6);">5:6</a>, etc.); "every living thing" for "all the substance" (<a onClick="return mV(\'Deu\',11,6);">De 11:6</a>); "living things" for "beasts" (<a onClick="return mV(\'Lev\',11,2,47);">Le 11:2,47</a> twice); for "living" (<a onClick="return mV(\'Psa\',58,9);">Ps 58:9</a>), "the green" (thorns under the pots), margin "Wrath shall take them away while living as with a whirlwind"; for "the book of the living" (<a onClick="return mV(\'Psa\',69,28);">Ps 69:28</a>), "the book of life"; for "(I am) he that liveth" (<a onClick="return mV(\'Rev\',1,18);">Re 1:18</a>), "the Living one"; for "living fountains of waters" (<a onClick="return mV(\'Rev\',7,17);">Re 7:17</a>), "fountains of waters of life"; for "trade" (<a onClick="return mV(\'Rev\',18,17);">Re 18:17</a>), "gain their living," margin "work the sea"; for "Son of the living God" (<a onClick="return mV(\'Jhn\',6,69);">Joh 6:69</a>), "the Holy One of God" (emended text).``185';
isbe[5554]='Liver`liv\'-er (qabhedh, derived from a root meaning "to be heavy," being the heaviest of the viscera; Septuagint hepar): The word is usually joined with the Hebrew yothereth (see <a href="./study/isbe/search.html?string=CAUL">CAUL</a>) (<a onClick="return mV(\'Exd\',29,13,22);">Ex 29:13,22</a>; <a onClick="return mV(\'Lev\',9,10,19);">Le 9:10,19</a>) as a special portion set aside for the burnt offering.<P>This represents the large lobe or flap of the liver, Lobos tou hepatos (thus, Septuagint and Josephus, Ant, III, ix,2,(228)). Others, however, interpret it as the membrane which covers the upper part of the liver, sometimes called the "lesser omenturn." Thus, the Vulgate: reticulurn iecoris. It extends from the fissures of the liver to the curve of the stomach. Still others consider it to be the "fatty mass at the opening of the liver, which reaches to the kidneys and becomes visible upon the removal of the lesser omentum or membrane" (Driver and White, Leviticus, 65).<P>As in the scholastic psychology of the Middle Ages, the liver played an important part in the science of Semitic peoples. It was the seat of feeling, and thus became synonymous with temper, disposition, character (compare Assyrian kabittu, "liver", "temper," "character," and Arabic kabid, vulgar kibdi). Thus, Jeremiah expresses his profound grief with the words: "My liver is poured upon the earth, because of the destruction of the daughter of my people" (<a onClick="return mV(\'Lam\',2,11);">La 2:11</a>). The liver is also considered one of the most important and vital parts of the body (compare Virgil, cerebrum, iecur domicilia vitae). A hurt in it is equivalent to death. So we find the fate of a man enticed by the flattering of a loose woman compared to that of the ox that "goeth to the slaughter...till an arrow strike through his liver; as a bird hasteth to the snare, and knoweth not that it is for his life" (<a onClick="return mV(\'Pro\',7,22,23);">Pr 7:22,23</a>; the rest of the verse is obscure as to its meaning).<P>In a few passages of the Old Testament, kabhedh ("liver") and kabhodh ("glory") have been confounded, and we are in uncertainty as to the right translation Several authors, to give but one example, would read kabhedh in <a onClick="return mV(\'Psa\',16,9);">Ps 16:9</a>, for reasons of Hebrew poetical parallelism: "Therefore my heart is glad and my liver (English Versions of the Bible, "glory") rejoiceth." While this is quite possible, it is not easy to decide, as according to Jewish interpretation "my glory" is synonymous with "my soul," which would present as proper a parallelism.<P>The liver has always played an important role in heathen divination, of which we have many examples in old and modern times among the Greeks, Etrurians, Romans and now among African tribes. The prophet Ezekiel gives us a Biblical instance. The king of Babylon, who had been seeking to find out whether he should attack Jerusalem, inquired by shaking "arrows to and fro, he consulted the teraphim, he looked in the liver" (<a onClick="return mV(\'Eze\',21,21);">Eze 21:21 (Hebrew 21:26)</a>; compare Tobit 6:4ff; 8:2).`<a href="./study/isbe/search.html?string=ASTROLOGY">ASTROLOGY</a>; <a href="./study/isbe/search.html?string=DIVINATION">DIVINATION</a>`106';
isbe[5555]='Living Creature`liv\'-ing kre\'-tur:<P>(1) (nephesh chayyah, or nephesh hachayyah (nephesh, "breath" or "living things"; chayyah, "living"; compare Arabic nefs, "breath," chaiy, "living")): In the account of the creation this term is used of aquatic animals (<a onClick="return mV(\'Gen\',1,21);">Ge 1:21</a>), of mammals (<a onClick="return mV(\'Gen\',1,24);">Ge 1:24</a>) and of any animals whatsoever (<a onClick="return mV(\'Gen\',2,19);">Ge 2:19</a>).<P>(2) ([chayyoth], plural of chayyah): The name of the "living creatures" of <a onClick="return mV(\'Eze\',1,\'5-25\');">Eze 1:5-25</a>, which had wings and the faces of a man, a lion, an ox, and an eagle; compare <a onClick="return mV(\'Eze\',10,\'1-22\');">Eze 10:1-22</a>.<P>(3) (zoon, "living thing," "animal"): The four "living creatures" (the King James Version "beasts") of <a onClick="return mV(\'Rev\',4,6);">Re 4:6</a>, etc., the first like a lion, the second like a calf, the third having a face as of a man, and the fourth like an eagle, having each six wings.`<a href="./study/isbe/search.html?string=CREATURE,+LIVING">CREATURE, LIVING</a>`37';
isbe[5556]='Lizard`liz\'-ard: The list of unclean "creeping things" in <a onClick="return mV(\'Lev\',11,29,30);">Le 11:29,30</a> contains eight names, as follows:<P>1. Names:<P class="in15">(1) choledh, English Versions of the Bible "<a href="./study/isbe/search.html?string=WEASEL">WEASEL</a>" (which see);<P class="in15">(2) \'akhbar, English Versions of the Bible "<a href="./study/isbe/search.html?string=MOUSE">MOUSE</a>" (which see);<P class="in15">(3) tsabh, the King James Version "tortoise," the Revised Version (British and American) "<a href="./study/isbe/search.html?string=GREAT+LIZARD">GREAT LIZARD</a>" (which see);<P class="in15">(4) \'anaqah, the King James Version "ferret," the Revised Version (British and American) "<a href="./study/isbe/search.html?string=GECKO">GECKO</a>" (which see);<P class="in15">(5) koach, the King James Version "chameleon," the Revised Version (British and American) "<a href="./study/isbe/search.html?string=LAND-CROCODILE">LAND-CROCODILE</a>" (which see);<P class="in15">(6) leta\'ah, English Versions of the Bible "lizard"; compare Arabic lata\', "to cling to the ground";<P class="in15">(7) chormeT, the King James Version "snail," the Revised Version (British and American) "<a href="./study/isbe/search.html?string=SAND-LIZARD">SAND-LIZARD</a>" (which see);<P class="in15">(8) tinshemeth, the King James Version "mole," the Revised Version (British and American) "<a href="./study/isbe/search.html?string=CHAMELEON">CHAMELEON</a>" (which see). In <a onClick="return mV(\'Pro\',30,28);">Pr 30:28</a>, we find<P class="in15">(9) semamith, the King James Version "spider," the Revised Version (British and American) "lizard."<hr /><P>Since (1), (3), (4), (5), (6) and (7) occur as names of animals only in this passage, and as the philological evidence available is in most cases not very convincing, their determination is difficult and uncertain. the Revised Version margin to "gecko" (<a onClick="return mV(\'Lev\',11,30);">Le 11:30</a>) has "Words of uncertain meaning, but probably denoting four kinds of lizards."<P>2. Lizards of Palestine:<P>Among the many lizards of Palestine, the monitor and thorny-tailed lizard are remarkable for their size, and the chameleon for its striking appearance and habits. On etymological grounds, koach, the King James Version "chameleon," the Revised Version (British and American) "land-crocodile," Septuagint chamaileon, has been taken to be the monitor; tsabh, the King James Version "tortoise," the Revised Version (British and American) "great lizard," Septuagint krokodeilos chersaios, to be the thorny-tailed lizard; and tinshemeth, the King James Version "mole," the Revised Version (British and American) "chameleon," Septuagint aspalax, to be the chameleon. On the same grounds, choledh, English Versions of the Bible "weasel," Septuagint gale, might be the mole-rat.<P>See <a href="./study/isbe/search.html?string=CHAMELEON">CHAMELEON</a>; <a href="./study/isbe/search.html?string=TORTOISE">TORTOISE</a>; <a href="./study/isbe/search.html?string=WEASEL">WEASEL</a>.<P>The commonest lizard of Palestine is the rough-tailed agama, Agama stellio, Arabic chirdaun or chirdaun, which is everywhere in evidence, running about on the ground, rocks or walls, frequently lying still basking in the sun, or bobbing its head up and down in the peculiar manner that it has. The gecko, Ptyodactylus lobatus, is common in houses. By means of adhesive disks on the under sides of its toes, it clings with ease to smooth walls which other lizards cannot scale. Although perfectly harmless, it is believed to be poisonous, and is much feared. It is called abu-brais, "father of leprosy," either on account of its supposed poisonous qualities or because it has a semi-transparent and sickly appearance, being of a whitish-yellow color with darker spots. It utters a little cry, which may be the reason why the Revised Version (British and American) has "gecko" for \'anaqah; the King James Version has "ferret."<P>Various species of the genus Lacerta and its allies, the true lizards, may always be found searching for insects on trees and walls. They are scaly, like all lizards, but are relatively smooth and are prettily colored, and are the most attractive members of the group which are found in the country. They are called by the Arabs saqqaiyeh or shammuseh.<P>The skinks include Scincus officinalis, and allied species. Arabic sa qanqur = Greek skigkos (skinkos). They are smooth, light-colored lizards, and are found in sandy places. They cannot climb, but they run and burrow in the sand with remarkable rapidity. The dried body of Scincus officinalis is an important feature of the primitive oriental materia medica, and may be found in the shops (officinae) of the old-style apothecaries.<P>3. Identifications:<P>Semamith (<a onClick="return mV(\'Pro\',30,28);">Pr 30:28</a>, the King James Version "spider," the Revised Version (British and American) "lizard") is one of the "four things which are little...but...exceeding wise." the Revised Version (British and American) reads:<P class="in15">"The lizard taketh hold with her hands,<br>Yet is she in kings\' palaces."<P>The Septuagint (Septuagint) has kalabotes, which according to Liddell and Scott = askalabotes, "a spotted lizard." There is no other lizard which fits this passage as does the gecko. If Gesenius is correct in deriving semamith from the root samam (compare Arabic samma, "to poison"), we have another reason for making this identification, in which case we must rule out the rendering of the Revised Version margin, "Thou canst seize with thy hands."<P>For none of the names in <a onClick="return mV(\'Lev\',11,29,30);">Le 11:29,30</a> have we as many data for identification as for semamith. For leta\'ah, English Versions of the Bible "lizard," the Septuagint has chalabotes, which is another variant of askalabotes. If we follow the Septuagint, therefore, we should render leta\'ah "gecko." Tristram quotes Bochart as drawing an argument that leta\'ah is "gecko" from the Arabic lata\', "to cling to the ground." This view is at least in accordance with Septuagint. It is of course untenable if \'anaqah is "gecko," but (see <a href="./study/isbe/search.html?string=FERRET">FERRET</a>) the writer thinks it quite possible that \'anaqah may mean the shrew or field-mouse, which is also in agreement with Septuagint. It will not do to follow Septuagint in all cases, but it is certainly safe to do so in the absence of a clear indication to the contrary.<P>There seems to be little evidence available for deciding the identity of chomeT, the King James Version "snail," the Revised Version (British and American) "sand-lizard." Septuagint has saura, and Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) lacerta, both words for lizard. Gesenius refers the word to an obsolete chamaT, "to bow down," "to lie upon the ground." Tristram, NHB, cites Bochart as referring to a word meaning "sand." Hence, perhaps the Revised Version (British and American) "sand-lizard." If by this is meant the skink, there is no inherent improbability in the identification.<P>We have thus more or less tentatively assigned various words of the list to the monitor, the thorny-tailed lizard, the chameleon, the gecko and the skink, but we have done nothing with the rough-tailed agama and the Lacertae, or true lizards, which are the commonest lizards of Palestine, and this fact must be reckoned against the correctness of the assignment. The translation of the Revised Version (British and American) has this to commend it, that it gives two small mammals followed by six lizards, and is therefore to that extent systematic. It is, however, neither guided in all cases by etymological considerations, nor does it follow Septuagint.<P>As none of the etymological arguments is very cogent, the writer can see no harm in consistently following Septuagint, understanding for<P class="in15">(1) gale, weasel or pole-cat; for<P class="in15">(2) mus, mouse; for<P class="in15">(3) krokodeilos chersaios, some large lizard, either the monitor or the thorny-tailed lizard; for<P class="in15">(4) mugale, shrew or field-mouse; for<P class="in15">(5) chamaileon, chameleon; for<P class="in15">(6) chalabotes, gecko; for<P class="in15">(7) saura, a Lacerta or true lizard; for<P class="in15">(8) aspalax, mole-rat.<P>On the other hand, if etymological considerations are to be taken into account and Septuagint abandoned when it conflicts with them we might have<P class="in15">(1) holedh, mole-rat;<P class="in15">(2) \'akhbar, mouse;<P class="in15">(3) tsabh, thorny-tailed lizard;<P class="in15">(4) \'anaqah, field-mouse;<P class="in15">(5) koach, monitor;<P class="in15">(6) leta\'ah, gecko;<P class="in15">(7) chomet, skink;<P class="in15">(8) tinshemeth, chameleon.<P>Neither of these lists has the systematic arrangement of that of the Revised Version (British and American), but we must remember that the Biblical writers were not zoologists, as is seen in the inclusion of the bat among birds (<a onClick="return mV(\'Lev\',11,19);">Le 11:19</a>; <a onClick="return mV(\'Deu\',14,18);">De 14:18</a>), and of the hare and coney among ruminants (<a onClick="return mV(\'Lev\',11,5,6);">Le 11:5,6</a>; <a onClick="return mV(\'Deu\',14,7);">De 14:7</a>).``37';
isbe[5557]='Lo-Ammi`lo-am\'-i (lo\'-\'ammi, "not my people"): The 2nd son and 3rd child of Gomer bath-Diblaim, wife of the prophet Hosea (<a onClick="return mV(\'Hsa\',1,9);">Ho 1:9</a>). An earlier child, a daughter, had been named Lo-ruhamah (lo\'-ruchamah, "uncompassionated"). The names, like those given by Isaiah to his children, are symbolic, and set forth Hosea\'s conviction that Israel has, through sin, forfeited Yahweh\'s compassion, and can no longer claim His protection. Of the bearers of these names nothing further is known; but their symbolism is alluded to in <a onClick="return mV(\'Hsa\',2,1,23);">Ho 2:1,23</a>. This latter passage is quoted by Paul (<a onClick="return mV(\'Rom\',9,25);">Ro 9:25</a>f).`<a href="./study/isbe/search.html?string=HOSEA">HOSEA</a>; <a href="./study/isbe/search.html?string=JEZREEL">JEZREEL</a>`95';
isbe[5558]='Lo-Debar`lo\'-de-bar, lo-de\'-bar (lo dhebhar): A place in Gilead where dwelt Machir, son of Ammiel, who sheltered Mephibosheth, son of Saul, after that monarch\'s death (<a onClick="return mV(\'2Sa\',9,4);">2Sa 9:4</a>), until he was sent for by David. This same Machir met David with supplies when he fled to Gilead from Absalom (<a onClick="return mV(\'2Sa\',17,27);">2Sa 17:27</a>f). Possibly it is the same place as Lidebir in <a onClick="return mV(\'Jos\',13,26);">Jos 13:26</a> (Revised Version margin). No certain identification is possible; but Schumacher (Northern \'Ajlun, 101) found a site with the name Ibdar about 6 1/2 miles east of Umm Qeis, north of the great aqueduct, which may possibly represent the ancient city. Lidebir, at least, seems to be placed on the northern boundary of Gilead. The modern village stands on the southern shoulder of Wady Samar. There is a good spring to the east, a little lower down, while ancient remains are found in the neighborhood.``54';
isbe[5559]='Lo-Ruhamah`lo-roo-ha\'-ma, lo-roo-ha\'-ma.`<a href="./study/isbe/search.html?string=LO+AMMI">LO-AMMI</a>`1';
isbe[5560]='Loaf`lof.`<a href="./study/isbe/search.html?string=BREAD">BREAD</a>`1';
isbe[5561]='Locks`loks<P>(1) tsitsith,<P>(2) pera\';<P>(3) machlaphah,<P>(4) qewutstsah):<hr /><P>See in general the article on <a href="./study/isbe/search.html?string=HAIR">HAIR</a>.<P>(1) The first word, tsitsith, means really a tassel, such as is worn by the Jews on the four corners of the prayer-shawl or Tallith and on the \'arba\' kanephoth (<a onClick="return mV(\'Deu\',22,12);">De 22:12</a>), translated in the New Testament by kraspedon (<a onClick="return mV(\'Mat\',9,20);">Mt 9:20</a>; <a onClick="return mV(\'Mat\',14,36);">14:36</a>; <a onClick="return mV(\'Mat\',23,5);">23:5</a>; <a onClick="return mV(\'Mar\',6,56);">Mr 6:56</a>; <a onClick="return mV(\'Luk\',8,44);">Lu 8:44</a>). Once it is applied to a forelock of hair. The prophet Ezekiel, describing his sensations which accompanied his vision of Jerusalem, says: "He put forth the form of a hand, and took me by a lock of my head; and the Spirit lifted me up between earth and heaven, and brought me in the visions of God to Jerus" (<a onClick="return mV(\'Eze\',8,3);">Eze 8:3</a>).<P>(2) The word pera\' signifies the uncut and disheveled locks of the Nazirite (<a onClick="return mV(\'Num\',6,5);">Nu 6:5</a>) or of the priests, the sons of Zadok (<a onClick="return mV(\'Eze\',44,20);">Eze 44:20</a>).<P>(3) The Book of Judges employs the word machlaphah when speaking of the "seven locks" of Samson (<a onClick="return mV(\'Jdg\',16,13,19);">Jud 16:13,19</a>), which really represent the plaited (etymologically, "interwoven") strands of hair still worn in our days by youthful Bedouin warriors.<P>(4) Qewutstsah (<a onClick="return mV(\'Sgs\',5,2,11);">So 5:2,11</a>) means the luxuriant hair of the Hebrew youth, who was careful of his exterior. It is called bushy (the Revised Version margin "curling") and black as a raven. the King James Version translations also the word tsammah with "locks" (<a onClick="return mV(\'Sgs\',4,1);">So 4:1</a>; <a onClick="return mV(\'Sgs\',6,7);">6:7</a>; <a onClick="return mV(\'Isa\',47,2);">Isa 47:2</a>), but the Revised Version (British and American) has corrected this into "veil," leaving the word "locks" in <a onClick="return mV(\'Sgs\',4,1);">So 4:1</a> margin.``106';
isbe[5562]='Locust`lo\'-kust: The translation of a large number of Hebrew and Greek words:<P>1. Names:<P>(1) \'arbeh from the root rabhah, "to increase" (compare Arabic raba\', "to increase").<P>(2) sal\'am, from obsolete [?] cal\'am, "to swallow down," "to consume."<P>(3) chargol (compare Arabic charjal, "to run to the right or left," charjalat, "a company of horses" or "a swarm of locusts," charjawan, a kind of locust).<P>(4) chaghabh (compare Arabic chajab, "to hide," "to cover").<P>(5) gazam (compare Arabic jazum, " to cut off")<P>(6) yeleq, from the root laqaq "to lick" (compare Arabic laqlaq, "to dart out the tongue" (used of a serpent)).<P>(7) chacil, from the root chacal, "to devour" (compare Arabic chaucal, "crop" (of a bird)).<P>(8) gobh, from the obsolete root gabhah (compare Arabic jabi, "locust," from the root jaba\', "to come out of a hole").<P>(9) gebh, from same root.<P>(10) tselatsal from [?] tsalal (onomatopoetic), "to tinkle," "to ring" (compare Arabic call, "to give a ringing sound" (used of a horse\'s bit); compare also Arabic Tann, used of the sound of a drum or piece of metal, also of the humming of flies).<P>(11) akris (genitive akridos; diminutive akridion, whence Acridium, a genus of locusts).<P>2. Identifications:<P>(1), (2), (3) and (4) constitute the list of clean insects in <a onClick="return mV(\'Lev\',11,21);">Le 11:21</a>f; characterized as "winged creeping things that go upon all fours, which have legs above their feet, wherewith to leap upon the earth." This manifestly refers to jumping insects of the order Orthoptera, such as locusts, grasshoppers and crickets, and is in contrast to the unclean "winged creeping things that go upon all fours," which may be taken to denote running Orthoptera, such as cockroaches, mole-crickets and ear-wigs, as well as insects of other orders.<p>\'Arbeh (1) is uniformly translated "locust" in the Revised Version (British and American). the King James Version has usually "locust," but "grasshopper" in <a onClick="return mV(\'Jdg\',6,5);">Jud 6:5</a>; <a onClick="return mV(\'Jdg\',7,12);">7:12</a>; <a onClick="return mV(\'Job\',39,20);">Job 39:20</a>; <a onClick="return mV(\'Jer\',46,23);">Jer 46:23</a>. Septuagint has usually akris, "locust"; but has brouchos, "wingless locust," in <a onClick="return mV(\'Lev\',11,22);">Le 11:22</a>; <a onClick="return mV(\'1Ki\',8,37);">1Ki 8:37</a> (akris in the parallel passage, <a onClick="return mV(\'2Ch\',6,28);">2Ch 6:28</a>); <a onClick="return mV(\'Nah\',3,15);">Na 3:15</a>; and attelebos, "wingless locust," in <a onClick="return mV(\'Nah\',3,17);">Na 3:17</a>. \'Arbeh occurs (<a onClick="return mV(\'Exd\',10,\'4-19\');">Ex 10:4-19</a>) in the account of the plague of locusts; in the phrase "as locusts for multitude" (<a onClick="return mV(\'Jdg\',6,5);">Jud 6:5</a>; <a onClick="return mV(\'Jdg\',7,12);">7:12</a>); "more than the locusts...innumerable" (<a onClick="return mV(\'Jer\',46,23);">Jer 46:23</a>);<P class="in15">"The locusts have no king,<br>Yet go they forth all of them by bands" (<a onClick="return mV(\'Pro\',30,27);">Pr 30:27</a>).<p>\'Arbeh is referred to as a plague in <a onClick="return mV(\'Deu\',28,38);">De 28:38</a>; <a onClick="return mV(\'1Ki\',8,37);">1Ki 8:37</a>; <a onClick="return mV(\'2Ch\',6,28);">2Ch 6:28</a>; <a onClick="return mV(\'Psa\',78,46);">Ps 78:46</a>; in Joel and in Nahum. These references, together with the fact that it is the most used word, occurring 24 times, warrant us in assuming it to be one of the swarming species, i.e. Pachtylus migratorius or Schistocerca peregrina, which from time to time devastate large regions in the countries bordering on the Mediterranean.<P>Cal\'am (2), English Versions of the Bible "bald locust," occurs only in <a onClick="return mV(\'Lev\',11,22);">Le 11:22</a>. According to Tristram, NBH, the name "bald locust" was given because it is said in the Talmud to have a smooth head. It has been thought to be one of the genus Tryxalis (T. unguiculata or T. nasuta), in which the head is greatly elongated.<P>Chargol (3), the King James Version "beetle," the Revised Version (British and American) "cricket," being one of the leaping insects, cannot be a beetle. It might be a cricket, but comparison with the Arabic (see supra) favors a locust of some sort. The word occurs only in <a onClick="return mV(\'Lev\',11,22);">Le 11:22</a>.<P>See <a href="./study/isbe/search.html?string=BEETLE">BEETLE</a>.<P>Haghabh (4) is one of the clean leaping insects of <a onClick="return mV(\'Lev\',11,22);">Le 11:22</a> (English Versions of the Bible "grasshopper"). The word occurs in four other places, nowhere coupled with the name of another insect. In the report of the spies (<a onClick="return mV(\'Num\',13,33);">Nu 13:33</a>), we have the expression, "We were in our own sight as grasshoppers"; in <a onClick="return mV(\'Ecc\',12,5);">Ec 12:5</a>, "The grasshopper shall be a burden"; in <a onClick="return mV(\'Isa\',40,22);">Isa 40:22</a>, "It is he that sitteth above the circle of the earth, and the inhabitants thereof are as grasshoppers." These three passages distinctly favor the rendering "grasshopper" of the English Versions of the Bible. In the remaining passage (<a onClick="return mV(\'2Ch\',7,13);">2Ch 7:13</a>), ".... if I command the locust (English Versions) to devour the land," the migratory locust seems to be referred to. Doubtless this as well as other words was loosely used. In English there is no sharp distinction between the words "grasshopper" and "locust."<P>The migratory locusts belong to the family Acridiidae, distinguished by short, thick antennae, and by having the organs of hearing at the base of the abdomen. The insects of the family Locustidae are commonly called "grasshoppers," but the same name is applied to those Acridiidae which are not found in swarms. The Locustidae have long, thin antennae, organs of hearing on the tibiae of the front legs, and the females have long ovipositors. It may be noted that the insect known in America as the seventeen-year locust, which occasionally does extensive damage to trees by laying its eggs in the twigs, is a totally different insect, being a Cicada of the order Rhynchota. Species of Cicada are found in Palestine, but are not considered harmful.<P>The Book of Joel is largely occupied with the description of a plague of locusts. Commentators differ as to whether it should be interpreted literally or allegorically (see <a href="./study/isbe/search.html?string=JOEL">JOEL</a>). Four names \'arbeh (1), gazam (5), yeleq (6) and chacil (7), are found in <a onClick="return mV(\'Joe\',1,4);">Joe 1:4</a> and again in <a onClick="return mV(\'Joe\',2,25);">2:25</A>.<P>For the etymology of these names, see 1 above. Gazam (<a onClick="return mV(\'Amo\',4,9);">Am 4:9</a>; <a onClick="return mV(\'Joe\',1,4);">Joe 1:4</a>; <a onClick="return mV(\'Joe\',2,25);">2:25</a>) is in the Revised Version (British and American) uniformly translated "palmer-worm" Septuagint kampe, "caterpillar"). Chacil in the Revised Version (British and American) (<a onClick="return mV(\'1Ki\',8,37);">1Ki 8:37</a>; <a onClick="return mV(\'2Ch\',6,28);">2Ch 6:28</a>; <a onClick="return mV(\'Psa\',78,46);">Ps 78:46</a>; <a onClick="return mV(\'Isa\',23,4);">Isa 23:4</a>; <a onClick="return mV(\'Joe\',1,4);">Joe 1:4</a>; <a onClick="return mV(\'Joe\',2,25);">2:25</a>) is uniformly translated "caterpillar." The Septuagint has indifferently brouchos, "wingless locust," and erusibe, "rust" (of wheat). Yeleq (<a onClick="return mV(\'Psa\',105,34);">Ps 105:34</a>; <a onClick="return mV(\'Jer\',51,14,27);">Jer 51:14,27</a>; <a onClick="return mV(\'Joe\',1,4);">Joe 1:4</a>; <a onClick="return mV(\'Joe\',2,25);">2:25</a>; <a onClick="return mV(\'Nah\',3,15,16);">Na 3:15,16</a>) is everywhere "canker-worm" in the Revised Version (British and American), except in <a onClick="return mV(\'Psa\',105,34);">Ps 105:34</a>, where the American Standard Revised Version has "grasshopper." the King James Version has "caterpillar" in Psalms and Jeremiah and "canker-worm" in Joel and Nahum. Septuagint has indifferently akris and brouchos. "Palmerworm" and "canker-worm" are both Old English terms for caterpillars, which are strictly the larvae of lepidopterous insects, i.e. butterflies and moths.<P>While these four words occur in <a onClick="return mV(\'Joe\',1,4);">Joe 1:4</a> and <a onClick="return mV(\'Joe\',2,25">2:25</a>, a consideration of the book as a whole does not show that the ravages of four different insect pests are referred to, but rather a single one, and that the locust. These words may therefore be regarded as different names of the locust, referring to different stages of development of the insect. It is true that the words do not occur in quite the same order in <a onClick="return mV(\'Joe\',1,4);">1:4</a> and in <a onClick="return mV(\'Joe\',2,25">2:25</a>, but while the former verse indicates a definite succession, the latter does not. If, therefore, all four words refer to the locust, "palmer-worm," "canker-worm," "caterpillar" and the Septuagint erusibe, "rust," are obviously inappropriate.<P>Gobh (8) is found in the difficult passage (<a onClick="return mV(\'Amo\',7,1);">Am 7:1</a>), ".... He formed locusts (the King James Version "grasshoppers," the King James Version margin "green worms," Septuagint akris) in the beginning of the shooting up of the latter growth"; and (<a onClick="return mV(\'Nah\',3,17);">Na 3:17</a>) in ".... thy marshals (are) as the swarms of grasshoppers (Hebrew gobh gobhay; the King James Version "great grasshoppers"), which encamp in the hedges in the cold day, but when the sun ariseth they flee away, and their place is not known where they are." The related gebh (9) occurs but once, in <a onClick="return mV(\'Isa\',33,4);">Isa 33:4</a>, also a disputed passage, "And your spoil shall be gathered as the caterpillar (chacil) gathereth: as locusts (gebhim) leap shall men leap upon it." It is impossible to determine what species is meant, but some kind of locust or grasshopper fits any of these passages.<P>In <a onClick="return mV(\'Deu\',28,42);">De 28:42</a>, "All thy trees and the fruit of thy ground shall the locust (English Versions of the Bible) possess," we have (10) tselatsal, Septuagint erusibe). The same word is translated in <a onClick="return mV(\'2Sa\',6,5);">2Sa 6:5</a> and <a onClick="return mV(\'Psa\',150,5);">Ps 150:5</a> bis "cymbals," in <a onClick="return mV(\'Job\',41,7);">Job 41:7</a> "fish-spears," and in <a onClick="return mV(\'Isa\',18,1);">Isa 18:1</a> "rustling." As stated in 1, above, it is an onomatopoetic word, and in <a onClick="return mV(\'Deu\',28,42);">De 28:42</a> may well refer to the noise of the wings of a flight of locusts.<P>In the New Testament we have (11) akris, "locust," the food of John the Baptist (<a onClick="return mV(\'Mat\',3,4);">Mt 3:4</a>; <a onClick="return mV(\'Mar\',1,6);">Mr 1:6</a>); the same word is used figuratively in <a onClick="return mV(\'Rev\',9,3,7);">Re 9:3,7</a>; and also in the Apocrypha (Judith 2:20; The <span class="noTag">Wisdom of Solomon 16:9</span>; and see 2Esdras 4:24).<P>3. Habits:<P>The swarms of locusts are composed of countless individuals. The statements sometimes made that they darken the sky must not be taken too literally. They do not produce darkness, but their effect may be like that of a thick cloud. Their movements are largely determined by the wind, and while fields that are in their path may be laid waste, others at one side may not be affected. It is possible by vigorous waving to keep a given tract clear of them, but usually enough men cannot be found to protect the fields from their ravages.<P>Large birds have been known to pass through a flight of locusts with open mouths, filling their crops with the insects. Tristram, NHB, relates how he saw the fishes in the Jordan enjoying a similar feast, as the locusts fell into the stream. The female locust, by means of the ovipositor at the end of her abdomen, digs a hole in the ground, and deposits in it a mass of eggs, which are cemented together with a glandular secretion. An effective way of dealing with the locusts is to gather and destroy these egg-masses, and it is customary for the local governments to offer a substantial reward for a measure of eggs. The young before they can fly are frequently swept into pits or ditches dug for the purpose and are burned.<P>The young are of the same general shape as the adult insects, differing in being small, black and wingless. The three distinct stages in the metamorphosis of butterflies and others of the higher insects are not to be distinguished in locusts. They molt about six times, emerging from each molt larger than before. At first there are no wings. After several molts, small and useless wings are found, but it is only after the last molt that the insects are able to fly. In the early molts the tiny black nymphs are found in patches on the ground, hopping out of the way when disturbed. Later they run, until they are able to fly.<P>In all stages they are destructive to vegetation. Some remarkable pictures of their ravages are found in <a onClick="return mV(\'Joe\',1,6,7);">Joe 1:6,7</a>, "For a nation is come up upon my land, strong, and without number; his teeth are the teeth of a lion, and he hath the jaw-teeth of a lioness. He hath laid my vine waste, and barked my figtree: he hath made it clean bare, and cast it away; the branches thereof are made white" (see also <a onClick="return mV(\'Joe\',2,\'2-9\',20);">2:2-9,20</A>).<P>4. Figurative:<P>Locusts are instruments of the wrath of God (<a onClick="return mV(\'Exd\',10,\'4-19\');">Ex 10:4-19</a>; <a onClick="return mV(\'Deu\',28,38,42);">De 28:38,42</a>; <a onClick="return mV(\'2Ch\',7,13);">2Ch 7:13</a>; <a onClick="return mV(\'Psa\',78,46);">Ps 78:46</a>; <a onClick="return mV(\'Psa\',105,34);">105:34</a>; <a onClick="return mV(\'Nah\',3,\'15-17\');">Na 3:15-17</a>; The <span class="noTag">Wisdom of Solomon 16:9</span>; <a onClick="return mV(\'Rev\',9,3);">Re 9:3</a>); they typify an invading army (<a onClick="return mV(\'Jer\',51,14,27);">Jer 51:14,27</a>); they are compared with horses (<a onClick="return mV(\'Joe\',2,4);">Joe 2:4</a>; <a onClick="return mV(\'Rev\',9,7);">Re 9:7</a>); in <a onClick="return mV(\'Job\',39,20);">Job 39:20</a>, Yahweh says of the horse: "Hast thou made him to leap as a locust?" the King James Version "Canst thou make him afraid as a grasshopper?" Locusts are among the "four things which are little upon the earth, but...are exceeding wise" (<a onClick="return mV(\'Pro\',30,27);">Pr 30:27</a>). Like the stars and sands of the sea, locusts are a type of that which cannot be numbered (<a onClick="return mV(\'Jdg\',6,5);">Jud 6:5</a>; <a onClick="return mV(\'Jdg\',7,12);">7:12</a>; <a onClick="return mV(\'Jer\',46,23);">Jer 46:23</a>; Judith 2:20). Grasshoppers are a symbol of insignificance (<a onClick="return mV(\'Num\',13,33);">Nu 13:33</a>; <a onClick="return mV(\'Ecc\',12,5);">Ec 12:5</a>; <a onClick="return mV(\'Isa\',40,22);">Isa 40:22</a>; 2Esdras 4:24).<P>5. Locusts as Food:<P>The Arabs prepare for food the thorax of the locust, which contains the great wing muscles. They pull off the head, which as it comes away brings with it a mass of the viscera, and they remove the abdomen (or "tail"), the legs and the wings. The thoraxes, if not at once eaten, are dried and put away as a store of food for a lean season. The idea of feeding upon locusts when prepared in this way should not be so repellent as the thought of eating the whole insect. In the light of this it is not incredible that the food of John the Baptist should have been "locusts and wild honey" (<a onClick="return mV(\'Mat\',3,4);">Mt 3:4</a>).`<a href="./study/isbe/search.html?string=INSECTS">INSECTS</a>`37';
isbe[5563]='Lod; Lydda`(lodh; Ludda):<P>1. Scriptural Notices:<P>Ono and Lod and the towns thereof are said to have been built by Shemed, a Benjamite (<a onClick="return mV(\'1Ch\',8,12);">1Ch 8:12</a>). The children of Lod, Hadid and One, to the number of 725, returned from Babylon with Zerubbabel (<a onClick="return mV(\'Ezr\',2,33);">Ezr 2:33</a>; <a onClick="return mV(\'Neh\',7,37);">Ne 7:37 (Hebrew 7:21)</a>). The town lay in the Shephelah, perhaps in ge ha-charashim, "the valley of craftsmen" (<a onClick="return mV(\'Neh\',11,35);">Ne 11:35</a>). In the New Testament it appears as Lydda. Here the apostle Peter visited the saints and healed the palsied Arenas (<a onClick="return mV(\'Act\',9,32);">Ac 9:32</a>). Hence he was summoned by messengers from Joppa on the death of Dorcas.<P>2. History from Maccabean Times:<P>The three governments of Aphaerema, Lydda and Ramathaim were added to Judea from the country of Samaria by King Demetrius II (1Macc 11:34). Lydda presided over one of the toparchies under Jerusalem, into which Judea was divided (BJ, III, iii, 5). After the death of Julius Caesar the inhabitants of Lydda and certain other towns, having failed to pay the contributions Cassius demanded, were by him sold into slavery. They were freed by Antony (Ant., XIV, xi, 2; xii, 2). Lydda suffered severely under Cestius Gallus (BJ, II, xix, 1). Along with Jamnia it surrendered to Vespasian (BJ, IV, viii, 1). After the fall of Jerusalem it was noted as a seat of rabbinical learning. The classical name of the city was Diospolis. In the 4th century it was connected with the trade in purple. It became the seat of a bishopric, and the bishop of Lydda was present at the Council of Nicea. At Lydda, in 415 AD, took place the trial of Pelagius for heresy.<P>Under the Moslems it became capital of the province of Filastin but later it was superseded by er-Ramleh, founded by Khalif Suleiman, whither its inhabitants were removed (Ya\'kubi, circa 891 AD). Mukaddasi (circa 985) says that in Lydda "there is a great mosque in which are wont to assemble large numbers of people from the capital (er-Ramleh) and from the villages around. In Lydda, too, is that wonderful church (of George) at the gate of which Christ will slay the antichrist" (quoted by Guy le Strange, Palestine under the Moslems, 493). It was rebuilt by the Crusaders; but was destroyed by Saladin after the Battle of Chattin, 1191 AD. It was again restored; but in 1271 it was sacked by the Mengels, and from this blow it has never recovered.<P>3. Identification and Description:<P>The ancient Lod or Lydda is represented by the modern village of Ludd, on the road to Jerusalem, about 11 miles southeast of Yafa. It is a station on the Jaffa-Jerusalem Railway. It occupies a picturesque hollow in the plain of Sharon, and is surrounded by gardens and orchards, the beauty of which intensifies by contrast the squalor of the village. It was the reputed birthplace of George, and here he is said to have been buried. The one ruin of importance in the place is that of the church which perpetuates his name.<P>The town stood on the great caravan road between Babylon and Egypt, near its intersection with that from Joppa to Jerusalem and the East. Its position on these great arteries of commerce meant trade for the inhabitants. "The manufacture and repair of such requisites for the journey as sacks, saddles and strappings would create the skilled labor in cloth, leather, wood and metal that made the neighborhood once the valley of craftsmen" (Mackie, HDB, under the word). Like many other once prosperous cities on these and similar caravan routes, Lydda suffered from diversion of traffic to the sea; and it may be that for none of them is any great revival now possible.``54';
isbe[5564]='Loddeus`lod-e\'-us (Loddeus; Swete reads Laadaios with Doldaiosas variant in Codex Alexandrinus; the King James Version Daddeus, Saddeus): The captain, who was in the place of the treasury. Ezra sent to him for men who "might execute the priests\' office" (1Esdras 8:46); called "Iddo" in <a onClick="return mV(\'Ezr\',8,17);">Ezr 8:17</a>.``1';
isbe[5565]='Lodge`loj (lin; kataskenoo, etc.): To stay or dwell, temporarily, as for the night (<a onClick="return mV(\'Gen\',32,13,21);">Ge 32:13,21</a>; <a onClick="return mV(\'Num\',22,8);">Nu 22:8</a>; <a onClick="return mV(\'Jos\',2,1);">Jos 2:1</a> the King James Version; <a onClick="return mV(\'Jos\',4,3);">Jos 4:3</a>; <a onClick="return mV(\'Luk\',13,19);">Lu 13:19</a>; <a onClick="return mV(\'Mat\',21,17);">Mt 21:17</a>, aulizomai), or permanently (<a onClick="return mV(\'Rth\',1,16);">Ru 1:16</a>). In <a onClick="return mV(\'Isa\',1,8);">Isa 1:8</a>, "a lodge (melunah) in a garden of cucumbers," the meaning is "hut," "cottage." "Evil thoughts" are said to "lodge" in the wicked (<a onClick="return mV(\'Jer\',4,14);">Jer 4:14</a>).``1';
isbe[5566]='Loft`In <a onClick="return mV(\'1Ki\',17,23);">1Ki 17:23</a>, changed in the Revised Version (British and American) to "chamber."``1';
isbe[5567]='Loftily; Loftiness; Lofty`lof\'-ti-li, lof\'-ti-nes: The first form is only in <a onClick="return mV(\'Psa\',73,8);">Ps 73:8</a>, where it means "haughtily," as if from on high. The second is found only in <a onClick="return mV(\'Jer\',48,29);">Jer 48:29</a>, where the loftiness of Moab also means his haughtiness, his groundless self-conceit.<P>Lofty likewise means \'"haughty," "lifted up" (compare <a onClick="return mV(\'Psa\',131,1);">Ps 131:1</a>; <a onClick="return mV(\'Isa\',2,11);">Isa 2:11</a>; <a onClick="return mV(\'Pro\',30,13);">Pr 30:13</a>). In <a onClick="return mV(\'Isa\',26,5);">Isa 26:5</a> it refers to a self-secure and boastful city. In <a onClick="return mV(\'Isa\',57,15);">57:15</A> it is used in a good sense of God who really is high and supreme. Isaiah uses the word more than all the other sacred writers put together.``1';
isbe[5568]='Log`log, logh, "deepened," "hollowed out" (<a onClick="return mV(\'Lev\',14,\'10-24\');">Le 14:10-24</a>)): The smallest liquid or dry measure of the Hebrews, equal to about 1 pint.`<a href="./study/isbe/search.html?string=WEIGHTS+AND+MEASURES">WEIGHTS AND MEASURES</a>`1';
isbe[5569]='Logia, the`log\'-i-a, (Logia):<P>1. The Word "Logia" and Its History:<P>The word logion, which is a diminutive of logos, was regularly used of Divine utterances. There are examples in the classics, the Septuagint, the writings of Josephus and Philo and in four passages in the New Testament (<a onClick="return mV(\'Act\',7,38);">Ac 7:38</a>; <a onClick="return mV(\'Rom\',3,2);">Ro 3:2</a>; <a onClick="return mV(\'Hbr\',5,12);">Heb 5:12</a>; <a onClick="return mV(\'1Pe\',4,11);">1Pe 4:11</a>) where it is uniformly rendered both in the King James Version and the Revised Version (British and American) "oracles." It is not, therefore, surprising that early Christian writers, who thought of Christ as Divine, applied this term to His sayings also. We find this use, according to the usual interpretation, in the title of the lost work of Papias as preserved by Eusebius, Logion kuriakon exegesis, "Exposition of the Lord\'s Logia" (Historia Ecclesiastica, III, 39), in that writer\'s obscure reference to a Hebrew or Aramaic writing by the apostle Matthew (same place), and in Polycarp\'s Epistle (section symbol 7), "the logia of the Lord." The modern use of the word is twofold:<P>(a) as the name of the document referred to by Papins which may or may not be the Q of recent inquirers;<P>(b) as the name of recently discovered sayings ascribed to Jesus. For the former compare <a href="./study/isbe/search.html?string=GOSPELS">GOSPELS</a>.<P>The latter is theme of this article.<P>2. The Discovery of the Logia:<P>About 9 1/2 miles from the railway station of Beni Mazar, 121 miles from Cairo, a place now called Behnesa marks the site of an ancient city named by the Greeks Oxyrhynchus, from the name of a sacred fish, the modern binni, which had long been known as a great Christian center in early times and was therefore selected by Messrs. Grenfell and Hunt for exploration in behalf of the Egyptian Exploration Fund. They began work on the ruins of the town, January 11,1897,and on the following day discovered a papyrus leaf inscribed with a number of sayings introduced by the formula legei Iesous, "saith Jesus," some of which were at once seen to be quite new. When excavation was resumed in February,1903,a second fragment was discovered, which must have belonged to the same or a similar collection, as the formula "saith Jesus" is employed in exactly the same way, and the sayings exhibit the same mixed character. The first of these two fragments was named by the discoverers logia, but the short preface to the second fragment suggests that the word used in the original title may have been logoi, which is found in <a onClick="return mV(\'Act\',20,35);">Ac 20:35</a> as the title perhaps of a collection of sayings of Jesus used by the apostle Paul. It is convenient, however, to retain logia, at any rate for the present. Other remains of early Christian texts have been found on the same site (compare <a href="./study/isbe/search.html?string=AGRAPHA">AGRAPHA</a>) but none of precisely the same character.<P>3. Description of the Texts:<P>The first fragment, found and published in 1897, afterward referred to as A, is a leaf from a papyrus book measuring in its present state 5 3/4 X 3 3/4 inches and having 42 lines on the two pages. As it is broken at the bottom it is impossible, in the absence of another leaf, to ascertain or even conjecture how much has been lost. At the top right-hand corner of one page are the letters iota, alpha, used as numerals, that <span class="noTag">is</span> 11, and it has been suggested that this, with other characteristics, marks the page as the first of the two. The uncial writing is assigned to the 3rd century, perhaps to the early part of it. The text is fairly complete except at the end of the third logion, for the five following lines, and at the bottom. The second fragment, henceforth referred to as B, found in 1903 and published in 1904, has also 42 lines, or rather parts of lines, but on only one page or column, the Christian text being written on the back of a roll the recto of which contained a survey list. The characters of this, too, are uncial, and the date, like that of A, seems to be also the 3rd century, but perhaps a little later. B is unfortunately very defective, the bit of papyrus being broken vertically throughout, so that several letters are lost at the end of each line, and also horizontally for parts of several lines at the bottom.<P>4. Logia with Canonical Parallels:<P>Seven of these sayings, or logia, inclusive of the preface of B, have or contain canonical parallels, namely:<P>(1) A1, which coincides with the usual text of <a onClick="return mV(\'Luk\',6,42);">Lu 6:42</a>;<P>(2) A5a (according to the editio princeps, 6a), which comes very close to <a onClick="return mV(\'Luk\',4,24);">Lu 4:24</a>;<P>(3) A6 (or 7), a variant of <a onClick="return mV(\'Mat\',5,14);">Mt 5:14</a>;<P>(4) the saying contained in the preface of B which resembles <a onClick="return mV(\'Jhn\',8,52);">Joh 8:52</a>;<P>(5) B2, ll. 7f; "The kingdom of heaven is within you," which reminds us of <a onClick="return mV(\'Luk\',17,21);">Lu 17:21</a>;<P>(6) B3, ll. 4f; "Many that are first shall be last; and the last first," which corresponds to <a onClick="return mV(\'Mar\',10,31);">Mr 10:31</a>; compare <a onClick="return mV(\'Mat\',19,30);">Mt 19:30</a>; <a onClick="return mV(\'Luk\',13,30);">Lu 13:30</a>;<P>(7) B4, ll. 2-5, "That which is hidden from thee shall be revealed to thee: for there is nothing hidden that shall not be made manifest," which is like <a onClick="return mV(\'Mar\',4,22);">Mr 4:22</a> (compare <a onClick="return mV(\'Mat\',10,26);">Mt 10:26</a>; <a onClick="return mV(\'Luk\',12,2);">Lu 12:2</a>).<P>These parallels or partial parallels—for some of them exhibit interesting variations—are, with one exception, of synoptic character.<P>5. New Sayings:<P>The other seven or eight logia, although not without possible echoes of the canonical Gospels in thought and diction, are all non-canonical and with one exception new.<P>Three of them, namely B2 and 3 (apart from the canonical sayings given above) and 5, may be set aside as too uncertain to be of any value. What is preserved of the first ("Who are they that draw you (MS, us) to the kingdom?" etc.) is indeed very tempting, but the restoration of the lost matter is too precarious for any suggestion to be more than an ingenious conjecture. This is seen by comparing the restoration of this logion by the discoverers, Dr. Swete and Dr. C. Taylor, with that proposed by Delssmann (Licht vom Osten1, 329). While the English scholars take helko in the sense of "draw," the German takes it in the sense which it has in the New Testament, "drag," with the result of utter divergence as to the meaning and even the subject of the logion. The logia which remain are undeniably of great interest, although the significance of at least one is exceedingly obscure. The number of the sayings is not certain. Dr. Taylor has shown that in A2 f "and" may couple two distinct utterances brought together by the compiler. If this suggestion is adopted, and if the words after A3 in the editio princeps are regarded as belonging to it and not as the remains of a separate logion, we get the following eight sayings:<P>(1) "Except ye fast to the world (or "from the world"), ye shall in no wise find the kingdom of God" (A2a);<P>(2) "Except ye keep the sabbath (Taylor "sabbatize the sabbath"), ye shall not see the Father" (A2b);<P>(3) "I stood in the midst of the world, and in flesh was I seen of them, and I found all men drunken, and none found I athirst among them" (A3a);<P>(4) "My soul grieveth over the sons of men, because they are blind in their heart and see not their wretchedness and their poverty" (the last clause restored by conjecture) (A3b);<P>(5) "Wherever there are two they are not without God, and where there is one alone I say I am with him (after Blass). Raise the stone and (there) thou shalt find me: cleave the wood (Taylor, "the tree") and there am I" (A4);<P>(6) "A physician does not work cures on them that know him" (A5b);<P>(7) "Thou hearest with one ear but the other thou hast closed" (largely conjectural but almost certain) (A6);<P>(8) "(There is nothing) buried which shall not be raised" (or "known") (B4, 1,5).<P>6. Origin and Character of the Logia:<P>Attempts have been made to trace the collection represented by these fragments (assuming that they belong to the same work) to some lost gospel—the Gospel according to the Egyptians (Harnack, Van Manen), the Gospel of the Ebionites or the Gospel of the Twelve Apostles (Zahn), or the Gospel according to the Hebrews (Batiffol), but without decisive result. That there is a connection of some kind with the last-mentioned apocryphal work is evident from the fact that B1 ("Jesus saith, Let not him who seeks...cease until he find Him; and having found Him, let him be amazed; and being amazed he shall reign, and reigning shall rest") is ascribed by Clement of Alexandria to this writing, but that cannot have been the only source. It was probably one of a number drawn on by the compiler. The latter, so far as B is concerned, represents the sayings as spoken by Jesus to ".... and Thomas." In whatever way the gap is supplied—whether by "Philip," or "Judas" or "the other disciples"—one of the Twelve known as Thomas is clearly referred to as the medium or one of the media of transmission. It is possible that the short preface in which this statement is made belongs not to the whole collection but to a part of it. The whole work may, as Swete suggests (Expository Times, XV, 494), have been entitled "Words of Jesus to the Twelve," and this may have been the portion addressed to Thomas. The other fragment, A, might belong to a section associated with the name of another apostle. In any case the Logia must have formed part of a collection of considerable extent, as we know of material for 24 pages or columns of about 21 or 22 lines each. So far as can be judged the writing was not a gospel in the ordinary sense of that term, but a collection of sayings perhaps bearing considerable resemblance as to the form to the Logia of Matthew mentioned by Papias.<P>The remains of B5, however, show that a saying might be prefaced with introductory matter. Perhaps a short narrative was sometimes appended. The relation to the canonical Gospels cannot be determined with present evidence. The sayings preserved generally exhibit the synoptic type, perhaps more specifically the Lukan type, but Johannine echoes, that is, possible traces of the thought and diction represented in the Fourth Gospel, are not absent (compare A, logia 2f; and preface to B). It seems not improbable that the compiler had our four Gospels before him, but nothing can be proved. There is no distinct sign of heretical influence. The much-debated saying about the wood and the stone (A4b) undoubtedly lends itself to pantheistic teaching, but can be otherwise understood.<P>Under these circumstances the date of the compilation cannot at present be fixed except in a very general way. If our papyri which represent two copies were written, as the discoverers think, in the 3rd century, that fact and the indubitably archaic character of the sayings make it all but certain that the text as arranged is not later than the 2nd century. To what part of the century it is to be assigned is at present undiscoverable. Sanday inclines to about 120 AD, the finders suggest about 140 AD as the terminus ad quem, Zahn dates 160-70 AD, and Dr. Taylor 150-200 AD. Further research may solve these problems, but, with the resources now available, all that can be said is that we have in the Logia of Oxyrhynchus a few glimpses of an early collection of sayings ascribed to Jesus which circulated in Egypt in the 3rd century of great interest and possibly of considerable value, but of completely unknown origin.<P>LITERATURE.<P>Of the extensive literature which has gat
