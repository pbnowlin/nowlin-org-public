isbe[5501]='Levis`le\'-vis (Leuis): 1Esdras 9:14, properly the Levite of <a onClick="return mV(\'Ezr\',10,15);">Ezr 10:15</a>; "Shabbethai the Levite" for "Levis and Sabbateus."``1';

isbe[5503]='Levitical Cities`le-vit\'-i-kal<P><b>I. LEGAL PROVISIONS</b><P class="in15">1. Numbers<P class="in15">2. Deuteronomy<P><b>II. WELLHAUSEN\'S VIEW</b><P><b>III. ALTERNATIVE VIEW AND EVIDENCE</b><P class="in15">1. Traces of the Cities<P class="in15">2. Wellhausen\'s Arguments Answered<P class="in15">3. Van Hoonacker\'s Reply<P class="in15">4. Ezekiel\'s Vision<P class="in15">5. Priestly Cities and Cities in Which Priests Dwell<P><b>LITERATURE</b><hr /><P>I. Legal Provisions.<P>1. Numbers: <a onClick="return mV(\'Num\',35,\'1-8\');">Nu 35:1-8</a> provides that 48 cities should be given to the Levites, each surrounded by a pasturage. The exact details are not quite clear, for in the Hebrew, <a onClick="return mV(\'Num\',35,4);">Nu 35:4</a> would naturally be read as meaning that the pasturage was a radius of 1,000 cubits from the city walls, while <a onClick="return mV(\'Num\',35,5);">35:5</a> makes each city the center of a square, each side of which was 2,000 cubits long. Extant variants in the versions suggest, however, that the text has suffered slightly in transmission. Originally there seems to have been no discrepancy between the two verses, and it may be doubted whether the intent was that the city was always to be in the mathematical center of the patch. The Levites were to have the right of redeeming the houses at any time, and in default of redemption they were to go out in the Jubilee. The field was not to be sold (<a onClick="return mV(\'Lev\',25,32);">Le 25:32</a>f).<P>2. Deuteronomy:<P><a onClick="return mV(\'Deu\',18,8);">De 18:8</a> undoubtedly recognizes patrimonial possessions of the Levites outside the religious capital, and sees no inconsistency with its earlier statement that Levi had no portion or inheritance with Israel (<a onClick="return mV(\'Deu\',18,1);">18:1</A>). The explanation lies in the fact that these cities were not a tribal portion like the territories of the secular tribes. The area occupied by the whole 48 jointly would only have amounted to less than 16 miles.<P>II. Wellhausen\'s View.<P><a onClick="return mV(\'Jos\',21,\'1-\');">Jos 21</a> relates that this command was fulfilled by the allocation of 48 cities, but it is clear that some of those cities were not in fact reduced into possession; see e.g. <a onClick="return mV(\'Jos\',16,10);">Jos 16:10</a>; <a onClick="return mV(\'Jdg\',1,29);">Jud 1:29</a> as to Gezer, and <a onClick="return mV(\'Jdg\',1,27);">Jud 1:27</a> as to Taanach. Wellhausen treats the whole arrangement as fictitious. His main reasons are: (1) that the arrangement is physically impracticable in a mountainous country, and (2) that "there is not a historical trace of the existence of the Levitical cities." Many remained in the hands of the Canaanites till a late period, while others were "important but by no means ecclesiastical towns" (Prolegomena, 160). Two pages later he says that "four of them were demonstrably famous old seats of worship," and conjectures that most, if not all, were ancient sanctuaries. He also regards Ezekiel\'s scheme of a heave offering of land (<a onClick="return mV(\'Eze\',45,\'1-\');">Eze 45</a>) as the origin of the idea. Yet "Jerus and the temple, which, properly speaking, occasioned the whole arrangement, are buried in silence with a diligence which is in the highest degree surprising" (p. 164).<P>III. Alternative View and Evidence.<P>1. Traces of the Cities:<P>In point of fact, there are traces of some of the Levitical cities in the later history. Such are Anathoth (<a onClick="return mV(\'1Ki\',2,26);">1Ki 2:26</a>; <a onClick="return mV(\'Jer\',1,1);">Jer 1:1</a>; <a onClick="return mV(\'Jer\',32,7,8,9);">32:7,8,9</a>), Jattir (<a onClick="return mV(\'2Sa\',20,26);">2Sa 20:26</a>, where, as shown in the article <a href="./study/isbe/search.html?string=PRIESTS+AND+LEVITES">PRIESTS AND LEVITES</a> (which see), Jattirite should be read for the Massoretic Jairite), Beth-shemesh (<a onClick="return mV(\'1Sa\',6,\'13-15\');">1Sa 6:13-15</a>; see <a href="./study/isbe/search.html?string=PRIESTS+AND+LEVITES">PRIESTS AND LEVITES</a> as to the text). (From <a onClick="return mV(\'Amo\',7,17);">Am 7:17</a> it appears that Amaziah of Bethel had land, but we do not know that he was of Levitical descent or where the land was.)<P>2. Wellhausen\'s Arguments Answered:<P>Further, the fact that many other Levitical cities appear to have been centers of worship points to the presence of priests. Was the great high place of Gibeon (<a onClick="return mV(\'1Ki\',3,4);">1Ki 3:4</a>) unserved by priests? It is surely natural to suppose that during the period between the capture of the Ark and its transport to Jerusalem there was a tendency for high places to spring up in cities where there were priests rather than elsewhere; indeed there would probably be a disposition on the part of unemployed priests to go astray in a direction that would prove lucrative.<P>3. Van Hoonacker\'s Reply:<P>With regard to the other objection, Van Hoonacker\'s answer is convincing: "As to the way in which the measurements were to be carried out in the mountainous country of Palestine, the legislator doubtless knew what method was usually employed. Besides, we are free to believe that he only gives these figures as approximate indications" (Sacerdoce levitique, 433).<P>4. Ezekiel\'s Vision:<P>The same writer\'s reply to theory that the idea originated with Ezekiel is wholly admirable. "Strictly we could ask...whether Ezekiel did not found himself on the description of the camp of the Israelites in the desert. It is only too manifest that the division and appointment of the territory as presented in <a onClick="return mV(\'Eze\',48,\'1-\');">Eze 48</a> of the prophet are scarcely inspired by practical necessities, that they have a very pronounced character of ideal vision; and \'as no fancy is pure fancy,\' we ought also to find the elements which are at the basis of Ezekiel\'s vision. The tents of the tribe of Levi ranged around the tabernacle explain themselves in the Priestly Code; we may doubt whether the Levites, deprived of territory (<a onClick="return mV(\'Eze\',44,28);">Eze 44:28</a>) and nevertheless grouped on a common territory, in the conditions described in <a onClick="return mV(\'Eze\',48,\'1-\');">Eze 48</a>, explain themselves with equal facility. A camp is readily conceived on the pattern of a chessboard, but not the country of Canaan. We need not stop there. It is in fact certain that Ezekiel here has in view the protection of the holiness of the temple from all profanation; and in the realm of the ideal, the means are appropriate to the end" (op. cit., 425f).<P>5. Priestly Cities and Cities in Which Priests Dwell:<P>Lastly there runs through Wellhausen\'s discussion the confusion between a city where priests may be dwelling and a priestly city. There were priests in Jerusalem, as there are today in London or Chicago; but none of these three places can be regarded as a priestly city in the same sense as the Levitical cities. Not one of them has ever been a patrimonial city of priests, or could be the origin of such an arrangement.<P>While therefore the whole of the cities mentioned in <a onClick="return mV(\'Jos\',21,\'1-\');">Jos 21</a> were certainly not reduced into possession at the time of the conquest, the Wellhausen theory on this matter cannot be sustained.<P>LITERATURE.<P>J. Wellhausen, Prolegomena, 159-63; A. Van Hoonacker, Sacerdoce levitique, 423-35 (very brilliant and important).``193';
isbe[5504]='Leviticus, 1`le-vit\'-i-kus:<P><b>I. GENERAL DATA</b><P class="in15">1. Name<P class="in15">2. Character of Book<P class="in15">3. Unity of Book: Law of Holiness Examination of Critical Theory<P><b>II. STRUCTURE</b><P class="in15">1. Modern Analyses<P class="in30">(1) Theories of Disintegration<P class="in30">(2) Reasons for Dismemberment<P class="in30">(3) Insufficiency of These Reasons<P class="in15">2. Structure of the Biblical Text<P class="in30">(1) Structure in General<P class="in30">(2) Structure of the Individual Pericopes<P><b>III. ORIGIN</b><P class="in15">1. Against the Wellhausen Hypothesis<P class="in30">(1) The Argument from Silence<P class="in30">(2) Attitude of Prophets toward Sacrificial System<P class="in30">(3) The People\'s Disobedience<P class="in30">(4) Indiscriminate Sacrificing<P class="in30">(5) Deuteronomy and Priestly Code<P class="in15">2. Connection with Mosaic Period<P class="in30">(1) Priestly Code and Desert Conditions<P class="in30">(2) Unity and Construction Point to Mosaic Origin<P><b>IV. THE SIGNIFICANCE</b><P class="in15">1. Positive<P class="in30">(1) The Law Contains God\'s Will<P class="in30">(2) The Law Prepares for the Understanding of Christianity<P class="in30">(3) The Law as a Tutor unto Christ<P class="in15">2. Negative<P><b>LITERATURE</b><hr /><P>I. General Data.<P>1. Name:<P>The third book of the Pentateuch is generally named by the Jews according to the first word, wayyiqra\' (Origen Ouikra, by the Septuagint called according to its contents Leuitikon, or Leueitikon, by the Vulgate, accordingly, "Leviticus" (i.e. Liber), sometimes "Leviticum"). The Jews have also another name taken from its contents, namely, torath kohanim, "Law of the Priests."<P>2. Character of Book:<P>As a matter of fact ordinances pertaining to the priesthood, to the Levitical system, and to the cults constitute a most important part of this book; but specifically religious and ethical commands, as we find them, e.g. in <a onClick="return mV(\'Lev\',18,\'1-\');">Le 18</a>; <a onClick="return mV(\'Lev\',19,\'1-\');">19</a>; <a onClick="return mV(\'Lev\',20,\'1-\');">20</a>, are not wanting; and there are also some historical sections, which, however, are again connected with the matter referring to the cults, namely the consecration of the priests in <a onClick="return mV(\'Lev\',8,\'1-\');">Le 8</a> and <a onClick="return mV(\'Lev\',9,\'1-\');">9</A>, the sin and the punishment of two sons of Aaron, Nadab and Abihu (<a onClick="return mV(\'Lev\',10,1);">10:1</A>ff), and the account of the stoning of a blasphemer (<a onClick="return mV(\'Lev\',24,10);">24:10</A>ff). Of the Levites, on the other hand, the book does not treat at all. They are mentioned only once and that incidentally in <a onClick="return mV(\'Lev\',25,32);">25:32</A>ff. The laws are stated to have been given behar Cinay (<a onClick="return mV(\'Lev\',7,38);">7:38</A>; <a onClick="return mV(\'Lev\',25,1);">25:1</A>; <a onClick="return mV(\'Lev\',26,46);">26:46</A>; <a onClick="return mV(\'Lev\',27,34);">27:34</a>), which expression, on account of <a onClick="return mV(\'Lev\',11,\'1-\');">Le 11</a>, in which Yahweh is described as speaking to Moses out of the tent of meeting, is not to be translated "upon" but "at" Mt. Sinai. The connection of this book with the preceding and following books, i.e. Exodus and Numbers, which is commonly acknowledged as being the case, at least in some sense, leaves for the contents of Leviticus exactly the period of a single month, since the last chronological statement of <a onClick="return mV(\'Exd\',40,17);">Ex 40:17</a> as the time of the erection of the tabernacle mentions the 1st day of the 1st month of the 2nd year of the Exodus, and <a onClick="return mV(\'Num\',1,1);">Nu 1:1</a> takes us to the 1st day of the 2nd month of the same year. Within this time of one month the consecration of the priests fills out 8 days (<a onClick="return mV(\'Lev\',8,33);">Le 8:33</a>; <a onClick="return mV(\'Lev\',9,1);">9:1</a>). A sequence in time is indicated only by <a onClick="return mV(\'Lev\',16,1);">Le 16:1</a>, which directly connects with what is reported in <a onClick="return mV(\'Lev\',10,\'1-\');">Le 10</a> concerning Nadab and Abihu. In the same way the ordinances given in <a onClick="return mV(\'Lev\',10,6);">10:6</a>ff are connected with the events described in <a onClick="return mV(\'Lev\',8,\'1-\');">8:1-10:5</a>. The laws are described as being revelations of Yahweh, generally given to Moses (compare <a onClick="return mV(\'Lev\',1,1);">1:1</A>; <a onClick="return mV(\'Lev\',4,1);">4:1</a>; <a onClick="return mV(\'Lev\',5,14);">5:14</a>; <a onClick="return mV(\'Lev\',6,19,24);">6:19,24 (Hebrew 12,17)</a>; <a onClick="return mV(\'Lev\',7,22,28);">7:22,28</A>, etc.); sometimes to Moses and Aaron (compare <a onClick="return mV(\'Lev\',11,1);">11:1</a>; <a onClick="return mV(\'Lev\',13,1);">13:1</a>; <a onClick="return mV(\'Lev\',14,33);">14:33</a>; <a onClick="return mV(\'Lev\',15,1);">15:1</a>, etc.), and, rarely, to Aaron alone (<a onClick="return mV(\'Lev\',10,8);">10:8</a>). In <a onClick="return mV(\'Lev\',10,21);">10:12</a>ff, Moses gives some directions to the priests, which are based on a former revelation (compare <a onClick="return mV(\'Lev\',6,16);">6:16 (Hebrew 9)</a>ff; <a onClick="return mV(\'Lev\',7,37);">7:37</a>ff). In <a onClick="return mV(\'Lev\',10,16);">10:16</A>ff, we have a difference of opinion between Moses and Aaron, or rather his sons, which was decided on the basis of an independent application of principles given in Leviticus.Most of these commands are to be announced to Israel (<a onClick="return mV(\'Lev\',1,2);">1:2</a>; <a onClick="return mV(\'Lev\',4,2);">4:2</a>; <a onClick="return mV(\'Lev\',7,23,29);">7:23,29</a>; <a onClick="return mV(\'Lev\',9,3);">9:3</a>ff; <a onClick="return mV(\'Lev\',11,2);">11:2</a>; <a onClick="return mV(\'Lev\',12,2);">12:2</a>; <a onClick="return mV(\'Lev\',15,2);">15:2</a>; <a onClick="return mV(\'Lev\',18,2);">18:2</a>, etc.); others to the priests (<a onClick="return mV(\'Lev\',6,9,25);">6:9,25 (Hebrew 2,18)</a>; <a onClick="return mV(\'Lev\',21,2);">21:2</a>; <a onClick="return mV(\'Lev\',22,2);">22:2</a>, etc.); or to the priests and the Israelites (<a onClick="return mV(\'Lev\',17,2);">17:2</a>; <a onClick="return mV(\'Lev\',22,18);">22:18</a>), while the directions in reference to the Day of Atonement, with which Aaron was primarily concerned (<a onClick="return mV(\'Lev\',16,2);">16:2</a>), beginning with <a onClick="return mV(\'Lev\',16,29);">16:29</a>, without a special superscription, are undeniably changed into injunctions addressed to all Israel; compare also <a onClick="return mV(\'Lev\',21,24);">21:24</a> and <a onClick="return mV(\'Lev\',21,2);">21:2</a>. As the Book of Exodus treats of the communion which God offers on His part to Israel and which culminates at last in His dwelling in the tent of meeting (<a onClick="return mV(\'Exd\',40,34);">40:34</a>ff; compare under <a href="./study/isbe/search.html?string=EXODUS">EXODUS, I, 2</a>), the Book of Leviticus contains the ordinances which were to be carried out by the Israelites in religious, ethical and cultural matters, in order to restore and maintain this communion with God, notwithstanding the imperfections and the guilt of the Israelites. And as this book thus with good reason occupies its well established place in the story of the founding and in the earliest history of theocracy, so too even a casual survey and intelligent glance at the contents of the book will show that we have here a well-arranged and organic unity, a conviction which is only confirmed and strengthened by the presentation of the structure of the book in detail (see under II, below).<P>3. Unity of Book: Law of Holiness:<P>As a rule, critics are accustomed first of all to regard <a onClick="return mV(\'Lev\',17,\'1-\');">Le 17:1-25:55</a> or <a onClick="return mV(\'Lev\',26,\')1-\';">26</a> as an independent section, and find in these chapters a legal code that is considered to have existed at one time as a group by itself, before it was united with the other parts.<P>It is indeed true that a series of peculiarities have been found in these chapters of Leviticus. To these peculiarities belongs the frequent repetition of the formula: "I am Yahweh your God" (<a onClick="return mV(\'Lev\',18,2,4);">18:2,4</a>; <a onClick="return mV(\'Lev\',19,2,4);">19:2,4</a>, etc.); or "I am Yahweh" (<a onClick="return mV(\'Lev\',18,5,6,21);">18:5,6,21</a>; <a onClick="return mV(\'Lev\',19,14,16);">19:14,16</a>, etc.), or "I am Yahweh...who hath separated you" (<a onClick="return mV(\'Lev\',20,24);">20:24</a>), or "who sanctifieth you" (<a onClick="return mV(\'Lev\',20,8);">20:8</a>; <a onClick="return mV(\'Lev\',21,8,15,23);">21:8,15,23</a>, etc.). To these peculiarities belong the references in words, or, in fact, to the land of Canaan, into which Israel is to be led (<a onClick="return mV(\'Lev\',18,3,14);">18:3,14</a>ff; <a onClick="return mV(\'Lev\',19,23,29);">19:23ff, 29</a>; <a onClick="return mV(\'Lev\',20,22,23,25);">20:22ff; 23; 25</a>), and also to Egypt, out of which He has led the people (<a onClick="return mV(\'Lev\',18,3);">18:3</a>; <a onClick="return mV(\'Lev\',19,34);">19:34</a>; <a onClick="return mV(\'Lev\',22,33);">22:33</a>; <a onClick="return mV(\'Lev\',26,13,15);">26:13,15</a>, etc.); as, further, the demand for sanctification (<a onClick="return mV(\'Lev\',19,2);">19:2</a>), or the warning against desecration (<a onClick="return mV(\'Lev\',19,12);">19:12</a>; <a onClick="return mV(\'Lev\',21,23);">21:23</a>, etc.), both based on the holiness of Yahweh. In addition, a number of peculiar expressions are repeatedly found in these chapters. Because of their contents these chapters have, since Klostermann, generally been designated by the letter H (i.e. Law of Holiness); or, according to the suggestion of Dillmann, by the letter S (i.e. Sinaitic Law), because, according to <a onClick="return mV(\'Lev\',25,1);">25:1</A>; <a onClick="return mV(\'Lev\',26,46);">26:46</a>, they are said to have been given at Mt. Sinai, and because in certain critical circles it was at one time claimed that these chapters contain old laws from the Mosaic period, although these had been changed in form. These earlier views have apparently now been discarded by the critics entirely.<P>Examination of Critical Theory.<P>We, however, do not believe that it is at all justifiable to separate these laws as a special legal code from the other chapters. In the first place, these peculiarities, even if such are found here more frequently than elsewhere, are not restricted to these chapters exclusively. The Decalogue (<a onClick="return mV(\'Exd\',20,2);">Ex 20:2</a>) begins with the words, "I am Yahweh thy God, who brought thee out of the land of Egypt, out of the house of bondage." <a onClick="return mV(\'Exd\',22,31);">Ex 22:31</a> contains the demand, "Ye shall be holy men unto me." <a onClick="return mV(\'Exd\',29,44,45);">Ex 29:44,45</a> contains a promise that God will dwell in the midst of the Israelites, so that they shall learn that He is Yahweh, their God, who has brought them out of Egypt in order to dwell in their midst as Yahweh, their God (compare, further, <a onClick="return mV(\'Exd\',6,\'6-8\');">Ex 6:6-8</a>; <a onClick="return mV(\'Exd\',31,13);">31:13</a>f; <a onClick="return mV(\'Lev\',10,10,11);">Le 10:10,11</a>; <a onClick="return mV(\'Lev\',11,44);">11:44</a>; <a onClick="return mV(\'Num\',15,\'37-41\');">Nu 15:37-41</a>; <a onClick="return mV(\'Num\',33,52,55);">33:52f; 55f</a>; <a onClick="return mV(\'Deu\',14,2,21);">De 14:2,21</a>). It is a more than risky undertaking to find in these and in other sections scattered remnants of H, especially if these are seen to be indispensable in the connection in which they are found, and when no reason can be given why they should be separated from this collection of laws. Then, too, the differences of opinion on the part of the critics in assigning these different parts to H, do not make us favorably inclined to the whole hypothesis. Hoffmann, especially (Die wichtigsten Instanzen gegen die Graf-Wellhausensche Hypothese, 16ff), has shown how impossible it is to separate H from the other ordinances of the Priestly Code in so radical a manner. In saying this we do not at all wish to deny the peculiar character of these chapters, only we do not believe that <a onClick="return mV(\'Lev\',17,\'1-\');">Le 17</a> can be added or <a onClick="return mV(\'Lev\',26,\'1-\');">Le 26</a> can be taken away from this section; for in <a onClick="return mV(\'Lev\',17,\'1-\');">Le 17</a> all the characteristic peculiarities of the Holiness Law are lacking; and, on the other hand, in <a onClick="return mV(\'Lev\',26,\'1-\');">Le 26</a> the expression "I am Yahweh your God," or a similar one in <a onClick="return mV(\'Lev\',26,12,13,14);">26:12,13,14</A>f; is found. The subscription in <a onClick="return mV(\'Lev\',26,46);">26:46</A> connects <a onClick="return mV(\'Lev\',26,\'1-\');">Le 26</a> with the preceding; and, further, the reference to the Sabbatical year as described in <a onClick="return mV(\'Lev\',25,\'1-\');">Le 25</a>, found in <a onClick="return mV(\'Lev\',34,43);">26:34f,43</A>,is not to be overlooked. Finally, also, other legal codes, such as that in the first Book of the Covenant (<a onClick="return mV(\'Exd\',23,\'20-33\');">Ex 23:20-33</a>) and that of Deuteronomy (<a onClick="return mV(\'Deu\',27,\'11-\');">27:11</A>-<a onClick="return mV(\'Deu\',28,\'1-68\');">28:68</a>) close with the offer of a blessing or a curse.<P>The chapters under consideration (<a onClick="return mV(\'Lev\',18,\'1-\');">Le 18:1-26:46</a>) are most closely connected with each other solely through their contents, which have found expression in a particular form, without these facts being sufficient to justify the claim of their being a separate legal code. For since in <a onClick="return mV(\'Lev\',1,\'1-\');">Le 1-17</a> all those things which separate the Israelites from their God have been considered and bridged over (compare <a onClick="return mV(\'Lev\',1,\'1-\');">Le 1-7</a>, the laws concerning sacrifices; <a onClick="return mV(\'Lev\',8,\'1-\');">Le 8-10</a>, the mediatorship of the priests; <a onClick="return mV(\'Lev\',11,\'1-\');">Le 11-15</a>, the unclean things; <a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a>, the Day of Atonement; <a onClick="return mV(\'Lev\',17,\'1-\');">Le 17</a>, the use made of blood), we find in <a onClick="return mV(\'Lev\',18,\'1-\');">Le 18:1-26:46</a> an account of the God-pleasing conduct, which admits of nothing that desecrates; namely, <a onClick="return mV(\'Lev\',18,\'1-\');">Le 18</a>; <a onClick="return mV(\'Lev\',19,\'1-\');">19</a>; <a onClick="return mV(\'Lev\',20,\'1-\');">20</a> contain laws dealing with marriage and chastity and other matters of a religious, ethical or cultural kind, together with the punishments that follow their transgression; <a onClick="return mV(\'Lev\',21,\'1-\');">Le 21</a>f determine the true character of the priests and of the sacred oblations; <a onClick="return mV(\'Lev\',23,\'1-\');">Le 23</a>f; the consecration of the seasons, of life and death, etc.; <a onClick="return mV(\'Lev\',25,\'1-\');">Le 25</a>, the Sabbath and the Jubilee year; <a onClick="return mV(\'Lev\',26,\'1-\');">Le 26</a> contains the offer of a blessing or a curse. <a onClick="return mV(\'Lev\',1,\'1-\');">Le 1-17</a> have, as it were, a negative character; <a onClick="return mV(\'Lev\',18,\'1-\');">Le 18:1-26:46</a> a positive character. In <a onClick="return mV(\'Lev\',1,\'1-\');">Le 1-17</a> the consciousness of what is unclean, imperfect and guilty is awakened and the possibility of their removal demonstrated; while in <a onClick="return mV(\'Lev\',18,\'1-\');">Le 18:1-26:46</a> the norm of a holy life is set forth. Even if these two parts at certain places show so great a likeness that the occurrence of an interchange of ordinances could be regarded as possible, nevertheless the peculiar character of each part is plainly recognized; and this is also a very essential argument for the view that both parts have one and the same author, who intentionally brought the two parts into closer connection and yet separated the one from the other. On this supposition the peculiarities of <a onClick="return mV(\'Lev\',18,\'1-\');">Le 18:1-26:46</a> are sufficiently explained, and also the positive contents of these chapters and the fact that just these chapters are referred to in pre-exilic literature oftener than is the case with <a onClick="return mV(\'Lev\',1,\'1-\');">Le 1-17</a>, and particularly the close connection between Ezekiel and H is to be regarded as a consequence of the common tendency of both authors and not as the result of their having used a common source (see <a href="./study/isbe/search.html?string=EZEKIEL">EZEKIEL, II, 2</a>). In <a onClick="return mV(\'Lev\',26,46);">Le 26:46</a> we have what is clearly a conclusion, which corresponds to <a onClick="return mV(\'Lev\',25,1);">25:1</a>; <a onClick="return mV(\'Lev\',7,37);">7:37</A>f; <a onClick="return mV(\'Lev\',1,1);">1:1</A>, and accordingly regards <a onClick="return mV(\'Lev\',1,\'1-\');">Le 1:1-26:46</a> as a unity; while <a onClick="return mV(\'Lev\',27,\'1-\');">Le 27</a>, which treats of vows and of tithes, with its separate subscription in <a onClick="return mV(\'Lev\',27,34);">27:34</A>, shows that it is an appendix or a supplement, which is, however, in many ways connected with the rest of the book, so that this addition cannot, without further grounds, be regarded as pointing to another author.<P>II. Structure.<P>1. Modern Analyses:<P>Modern criticism ascribes the entire Book of Leviticus, being a special legal code, to the Priestly Code (P). The questions which arise in connection with this claim will be discussed under III, below. At this point we must first try to awaken a consciousness of the fact, that in this special particular, too, the documentary theory has entered upon the stage of total disintegration; that the reasons assigned for the separation of the sources are constantly becoming more arbitrary and subjective; and that the absurd consequences to which they consistently lead from the very outset arouse distrust as to the correctness of the process. Just as in the historical parts the critics have for long been no longer content with J (Jahwist) and E (Elohist), but have added a J1 and Later additions to J, an E1 and Later additions to E, and as Sievers and Gunkel have gone farther, and in detail have completely shattered both J and E into entirely separate fragments (see <a href="./study/isbe/search.html?string=GENESIS">GENESIS</a>), So the Priestly Code (P), too, is beginning to experience the same fate. It is high time that, for both the historical and the legal sections, the opposite course be taken, and that we turn from the dismemberment to the combination of these documents; that we seek out and emphasize those features which, in form and content, unite the text into a clear unity. For this reason we lay the greatest stress on these in this section, which deals with the structure of the book, and which treats of the matter (1) negatively and (2) positively (see also <a href="./study/isbe/search.html?string=EXODUS">EXODUS, II</a>).<P>(1) Theories of Disintegration.<P>We have already seen in the article <a href="./study/isbe/search.html?string=DAY+OF+ATONEMENT">DAY OF ATONEMENT (I,2,(2))</a> in connection with <a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a> an example of these attempts at dissection, and here still add several examples in order to strengthen the impression on this subject.<P>(a) General Considerations:<P>If we for the present disregard the details, then, according to Bertholet (Kurzer Hand-Kommentar zum Alten Testament), not only <a onClick="return mV(\'Lev\',17,\'1-\');">Le 17:1-26:46</a> (see, above, under I) at one time existed as a separate legal corpus, but also the sacrificial legislation in <a onClick="return mV(\'Lev\',1,\'1-\');">Le 1-7</a>, and also the laws concerning the clean and the unclean in <a onClick="return mV(\'Lev\',11,\'1-\');">Le 11-15</a>. Concerning <a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a> see above. Then, too, <a onClick="return mV(\'Lev\',27,\'1-\');">Le 27</a> is regarded as a supplement and is ascribed to a different author. Finally, the so-called "fundamental document" of P (marked Pg) contained only parts from <a onClick="return mV(\'Lev\',9,\'1-\');">Le 9</a>f (also a few matters from <a onClick="return mV(\'Lev\',8,\'1-\');">Le 8</a>), as also one of the three threads of <a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a>, for <a onClick="return mV(\'Lev\',8,\'1-\');">Le 8-10</a>, it is said, described the consecration of the priests demanded in <a onClick="return mV(\'Exd\',25,\'1-\');">Ex 25</a>ff, which also are regarded as a part of Pg, and <a onClick="return mV(\'Lev\',16,\'1-\');">Le 16:1</a> is claimed to connect again with <a onClick="return mV(\'Lev\',10,\'1-\');">Le 10</a> (compare on this point <a href="./study/isbe/search.html?string=DAY+OF+ATONEMENT">DAY OF ATONEMENT, I, 2</a>). All these separate parts of Leviticus (i.e. <a onClick="return mV(\'Lev\',1,\'1-\');">Le 1:1-27:34</a>) are further divided into a number of more or less independent subparts; thus, e.g., <a onClick="return mV(\'Lev\',1,\'1-\');">Le 1-7</a>, containing the sacrificial laws, are made to consist of two parts, namely, <a onClick="return mV(\'Lev\',1,\'1-\');">Le 1-5</a> and <a onClick="return mV(\'Lev\',6,\'1-\');">Le 6</a>-<a onClick="return mV(\'Lev\',7,\'1-\');">7</a>; or the laws concerning the clean and the unclean in <a onClick="return mV(\'Lev\',11,\'1-\');">Le 11-15</a> are divided into the separate pieces, <a onClick="return mV(\'Lev\',11,\'1-\');">Le 11</a>; <a onClick="return mV(\'Lev\',12,\'1-\');">12</a>; <a onClick="return mV(\'Lev\',13,\'1-46\');">13:1-46</a>; and these are regarded as having existed at one time and in a certain manner independently and separated from each other. But how complicated in detail the composition is considered to be, we can see from <a onClick="return mV(\'Lev\',17,\'1-\');">Le 17:1-26:46</a>.<P>(b) <a onClick="return mV(\'Lev\',17,\'1-\');">Leviticus 17-26</a> Considered in Detail:<P>While Baentsch (Hand-Kommentar zum Alten Testament) accepts, to begin with, three fundamental strata (H1 = <a onClick="return mV(\'Lev\',18,\'1-\');">Le 18</a>; <a onClick="return mV(\'Lev\',19,\'1-\');">19</a>; <a onClick="return mV(\'Lev\',20,\'1-\');">20</a> and certain portions from <a onClick="return mV(\'Lev\',23,\'1-\');">Le 23</a>; <a onClick="return mV(\'Lev\',24,\'1-\');">24</a>; <a onClick="return mV(\'Lev\',25,\'1-\');">25</a>; H2 = <a onClick="return mV(\'Lev\',21,\'1-\');">Le 21</a>f; H3 = <a onClick="return mV(\'Lev\',17,\'1-\');">Le 17</a>), Bertholet, too (op. cit., x), regards the development of these chapters as follows: "In detail we feel justified in separating the following pieces: (i) <a onClick="return mV(\'Lev\',17,3,4,5,\'7-14\');">Le 17:3,4 (5,7a), 8,9,10-14</a>; (ii) <a onClick="return mV(\'Lev\',18,\'7-10\',\'12-20\',22);">18:7-10,12-20,22</a>f; and this united with (iii) <a onClick="return mV(\'Lev\',19,3,11,27,30,31,35,36);">19:3f; 11f; 27f; 30,31,35,36</a>, which was probably done by the author of (iii). The following were inserted by the person who united these parts, namely, <a onClick="return mV(\'Lev\',18,6,\'25-28\',30);">18:6,27,25,26,28,30</A>; (iv) <a onClick="return mV(\'Lev\',19,9,10,\'13-18\',19,29,32);">19:9,10,13-18,19,29,32</A>; (v) <a onClick="return mV(\'Lev\',19,\'5-8\',\'23-26\');">19:5-8,23-26</a>; (vi) <a onClick="return mV(\'Lev\',20,2,6);">20:2(Hebrew 3), 6(Hebrew 27)</a>; (vii) <a onClick="return mV(\'Lev\',20,\'9-21\');">20:9,10-21; 19:20</a>; (viii) <a onClick="return mV(\'Lev\',21,\'1-5\',5,7,\'9-15\',\17-24\');">21:1b-5,7,9-15,17b-24</A>; <a onClick="return mV(\'Lev\',22,3,8,\'10-14\',\'18-25\',\'27-30\');">22:3,8,10-14,18b-25,27-30</a>; (ix) <a onClick="return mV(\'Lev\',30,\'10-20\',\'39-43\');">23:10-20,39-43</a>; (x) <a onClick="return mV(\'Lev\',24,\'15-22\');">24:15-22</a>, except verses <a onClick="return mV(\'Lev\',1,16</a>);">16a(?)b; (xi) <a onClick="return mV(\'Lev\',25,\'2-7\',\'18-22\,\'35-40\',42,47,53,55);">25:2-7 (Hebrew 4), 18-22,35-38,39,40a, 42f; 47,53,55</a>; (xii) <a onClick="return mV(\'Lev\',25,8.9.10,\'13-17\',24);">25:8a, 9b, 10a, 13,14-16,17,24f</a>. In uniting these pieces Rh (the Redactor of the Law of Holiness) seems to have added de suo the following: <a onClick="return mV(\'Lev\',17,5);">17:5 (beginning)</A>; <a onClick="return mV(\'Lev\',18,\'2-5\',21,24,26,29);">18:2b-5,21,24,26a(?), 29</a>; <a onClick="return mV(\'Lev\',19,33,37);">19:33f; 37</a>; <a onClick="return mV(\'Lev\',20,4,7,\'22-26\');">20:4f; 7f; 22-26</a>; <a onClick="return mV(\'Lev\',21,6,8);">21:6,8</a>; <a onClick="return mV(\'Lev\',22,2,9,15,31,32,33);">22:2,9,15f; 31-33</a>; <a onClick="return mV(\'Lev\',23,22);">23:22</a>; <a onClick="return mV(\'Lev\',25,11);">25:11f</a>; <a onClick="return mV(\'Lev\',26,1);">26:1</a>f. At the same time he united with these an older parenetic section, <a onClick="return mV(\'Lev\',26,\'3-45\');">26:3-45</A>, which, by inserting <a onClick="return mV(\'Lev\',26,10,34,\39-43\');">26:10,34f; 39-43</a>, he changed into a concluding address of this small legal code. All the rest that is found in <a onClick="return mV(\'Lev\',17,\'1-\');">Le 17:1-26:46</a> seems to be the result of a revision in the spirit of the Priestly Code (P), not, however, as though originally it all came from the hand of Rp (Redactor P). That he rather added and worked together older pieces from P (which did not belong to Pg) is seen from an analysis of <a onClick="return mV(\'Lev\',23,\'1-\');">Le 23</a>...As far as the time when these parts were worked together is concerned, we have a reliable terminus ad quem in a comparison of <a onClick="return mV(\'Neh\',8,\'14-18\');">Ne 8:14-18</a> with <a onClick="return mV(\'Lev\',23,36,39);">Le 23:36 (P), 39ff (H)</a>. Only we must from the outset remember, that still, after the uniting of these different parts, the marks of the editorial pen are to be noticed in the following <a onClick="return mV(\'Lev\',17,\'1-\');">Le 17:1-26:46</a>, i.e. that after this union a number of additions were yet made to the text. This is sure as far as <a onClick="return mV(\'Lev\',23,\'26-32\');">23:26-32</a> is concerned, and is probable as to <a onClick="return mV(\'Lev\',24,\'1-14\',23);">24:1-9,10-14,23</a>; <a onClick="return mV(\'Lev\',25,32,33,34);">25:32-34</a>; and that this editorial work even went so far as to put sections from P in the place of parts of H can possibly be concluded from <a onClick="return mV(\'Lev\',24,\'1-9\');">24:1-9</a>."<P>(c) Extravagance of Critical Treatment:<P>This is also true of all the other sections, as can be seen by a reference to the books of Bertholet and Baentsch. What should surprise us most, the complicated and external manner in which our Biblical text, which has such a wonderful history back of it, is declared by the critics to have originated, or the keenness of the critics, who, with the ease of child\'s play, are able to detect and trace out this growth and development of the text, and can do more than hear the grass grow? But this amazement is thrust into the ackground when we contemplate what becomes of the Bible text under the manipulations of the critics. The compass of this article makes it impossible to give even as much as a general survey of the often totally divergent and contradictory schemes of Baentsch and Bertholet and others on the distribution of this book among different sources; and still less possible is it to give a criticism of these in detail. But this critical method really condemns itself more thoroughly than any examination of its claims would. All who are not yet entirely hypnotized by the spell of the documentary hypothesis will feel that by this method all genuine scientific research is brought to an end. If the way in which this book originated had been so complicated, it certainly could never have been again reconstructed.<P>(2) Reasons for Dismemberment.<P>We must at this place confine ourselves to mentioning and discussing several typical reasons which are urged in favor of a distribution among different authors.<P>(a) Alleged Repetitions:<P>We find in the parts belonging to P a number of so-called repetitions. In <a onClick="return mV(\'Lev\',1,\'1-7\');">Le 1-7</a> we find a twofold discussion of the five kinds of sacrifices (<a onClick="return mV(\'Lev\',1,\'1-\');">1-5</a>; <a onClick="return mV(\'Lev\',6,1);">6:1</A>ff); in <a onClick="return mV(\'Lev\',20,\'1-\');">Le 20</a> punitive measures are enacted for deeds which had been described already in <a onClick="return mV(\'Lev\',18,\'1-\');">Le 18</a>; in <a onClick="return mV(\'Lev\',19,3,10);">19:3,10</a>; <a onClick="return mV(\'Lev\',23,3);">23:3</a>; <a onClick="return mV(\'Lev\',26,2);">26:2</A> the Sabbath command is intensified; in <a onClick="return mV(\'Lev\',19,5);">19:5</a>ff; <a onClick="return mV(\'Lev\',22,9);">22:29</a>f; we find commands which had been touched upon already in <a onClick="return mV(\'Lev\',7,15);">7:15</a>ff; <a onClick="return mV(\'Lev\',19,9);">19:9</a>f we find almost verbally repeated in <a onClick="return mV(\'Lev\',23,22);">23:22</a>; <a onClick="return mV(\'Lev\',24,2);">24:2</A>ff repeats ordinances concerning the golden candlestick from <a onClick="return mV(\'Exd\',27,20);">Ex 27:20</a>ff, etc. The existence of these repetitions cannot be denied; but is the conclusion drawn from this fact correct? It certainly is possible that one and the same author could have handled the same materials at different places and from different viewpoints, as is the case in <a onClick="return mV(\'Lev\',1,\'1-\');">Le 1-7</a> in regard to the sacrifices. <a onClick="return mV(\'Lev\',18,\'1-\');">Le 18</a> and <a onClick="return mV(\'Lev\',20,\'1-\');">20</a> (misdeeds and punishments) are even necessarily and mutually supplementary. Specially important laws can have been repeated, in order to emphasize and impress them all the more; or they are placed in peculiar relations or in a unique light (compare, e.g., <a onClick="return mV(\'Lev\',24,1);">24:1</a>ff, the command in reference to the golden candlestick in the pericope <a onClick="return mV(\'Lev\',23,\'1-\');">Le 23</a>; <a onClick="return mV(\'Lev\',24,\'1-\');">24</a>; see below). Accordingly, as soon as we can furnish a reason for the repetition, it becomes unobjectionable; and often, when this is not the case, the objections are unremoved if we ascribe the repetitions to a new author, who made the repetition by way of an explanation (see <a href="./study/isbe/search.html?string=EXODUS">EXODUS, II,2,(5)</a>).<P>(b) Separation of Materials:<P>Other reasons will probably be found in uniting or separating materials that are related. That <a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a> is connected with <a onClick="return mV(\'Lev\',8,\'1-\');">Le 8-10</a>, and these connect with <a onClick="return mV(\'Exd\',25,\'1-\');">Ex 25</a>ff, is said to prove that this had been the original order in these sections. But why should materials that are clearly connected be without any reason torn asunder by the insertion of foreign data? Or has the interpolator perhaps had reasons of his own for doing this? Why are not these breaks ascribed to the original author? The sacrificial laws in <a onClick="return mV(\'Lev\',1,\'1-\');">Le 1-7</a> are properly placed before <a onClick="return mV(\'Lev\',8,\'1-\');">Le 8-10</a>, because in these latter chapters the sacrifices are described as already being made (<a onClick="return mV(\'Lev\',9,7,15);">9:7,15</A>, the sin offering; <a onClick="return mV(\'Lev\',9,7,12,16);">9:7,12,16</A>, the burnt offering; <a onClick="return mV(\'Lev\',9,17);">9:17</a>; <a onClick="return mV(\'Lev\',10,12);">10:12</a>, the meal offering; <a onClick="return mV(\'Lev\',9,18);">9:18</A>, the peace offering; <a onClick="return mV(\'Lev\',9,3);">9:3</a>f; all kinds). In the same way <a onClick="return mV(\'Lev\',11,\'1-\');">Le 11-15</a>, through <a onClick="return mV(\'Lev\',15,31);">15:31</A>, are inwardly connected with <a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a>, since these chapters speak of the defiling of the dwelling-place of Yahweh, from which the <a href="./study/isbe/search.html?string=DAY+OF+ATONEMENT">Day of Atonement</a> delivers (<a onClick="return mV(\'Lev\',16,16,33);">16:16f; 33</A>). As a matter of course, the original writer as well as a later redactor could have at times also connected parts in a looser or more external manner. In this way, in <a onClick="return mV(\'Lev\',7,22);">7:22</a>ff, the command not to eat of the fats or of the blood has been joined to the ordinances with reference to the use of the peace offerings in <a onClick="return mV(\'Lev\',7,19);">7:19</a>ff. This again is the case when, in <a onClick="return mV(\'Lev\',2,11,12,13);">Le 2, verses 11-13</a> have been inserted in the list of the different kinds of meal offering; when after the general scheme of sin offerings, according to the hierarchical order and rank in <a onClick="return mV(\'Lev\',4,\'1-\');">Le 4</a>, a number of special cases are mentioned in <a onClick="return mV(\'Lev\',5,1);">5:1</A>ff; and when in <a onClick="return mV(\'Lev\',5,7);">5:7</A>ff commands are given to prevent too great poverty; or when in <a onClick="return mV(\'Lev\',6,19);">6:19</A>ff the priestly meal offerings are found connected with other ordinances with references to the meat offerings in general (<a onClick="return mV(\'Lev\',6,14);">6:14</A>ff); or when the share that belongs to the priest (<a onClick="return mV(\'Lev\',7,8);">7:8</a>ff) is found connected with his claim to the guilt offering (<a onClick="return mV(\'Lev\',7,1);">7:1</a>ff); or the touching of the meat offering by something unclean (<a onClick="return mV(\'Lev\',7,19);">7:19</A>ff) is found connected with the ordinances concerning the peace offerings; or when in <a onClick="return mV(\'Lev\',11,\'1-\');">Le 11</a> the ordinances dealing with the unclean animals gradually pass over into ordinances concerning the touching of these animals, as is already indicated by the subscription <a onClick="return mV(\'Lev\',11,4,6);">11:4,6</A>f (compare with <a onClick="return mV(\'Lev\',11,12);">11:2</A>). Still more would it be natural to unite different parts in other ways also. In this way the ordinances dealing with the character of the sacrifices in <a onClick="return mV(\'Lev\',22,\'17-30\');">22:17-30</A> could, regarded by themselves, be placed also in <a onClick="return mV(\'Lev\',1,\'1-\');">Le 1-7</a>. But in <a onClick="return mV(\'Lev\',22,\'1-\');">Le 22</a> they are also well placed. On the other hand, the character of <a onClick="return mV(\'Lev\',1,\'1-\');">Le 1-7</a> would have become too complicated if they were inserted here. In such matters the author must have freedom of action.<P>(c) Change of Singular and Plural:<P>Further, the frequent change between the singular and the plural in the addresses found in the laws which are given to a body of persons is without further thought used by the critics as a proof of a diversity of authors in the section under consideration (compare <a onClick="return mV(\'Lev\',10,12);">Le 10:12</a>ff; <a onClick="return mV(\'Lev\',19,9,11,15);">19:9,11ff, 15ff</a>, etc.). But how easily this change in numbers can be explained! In case the plural is used, the body of the people are regarded as having been distributed into individuals; and in the case of a more stringent application the plural can at once be converted into the singular, since the author is thinking now only of separate individuals. Naturally, too, the singular is used as soon as the author thinks again rather of the people as a whole. Sometimes the change is made suddenly within one and the same verse or run of thought; and this in itself ought to have banished the thought of a difference of authors in such cases. In the case of an interpolator or redactor, it is from the outset all the more probable that he would have paid more attention to the person used in the addresses than that this would have been done by the original writer, who was completely absorbed by the subject-matter. Besides, such a change in number is frequently found in other connections also; compare in the Book of the Covenant (<a onClick="return mV(\'Exd\',22,\'20-25\',29);">Ex 22:20-25,29</a>f; <a onClick="return mV(\'Exd\',23,9);">23:9</a>; compare <a onClick="return mV(\'Deu\',12,2,13);">De 12:2ff, 13</a>). In regard to these passages, also, the modern critics are accustomed to draw the same conclusion; and in these cases, too, this is hasty. In the same way the change in the laws from the 3rd to the 2nd person can best be explained as the work of the lawgiver himself, before whose mind the persons addressed are more vividly present and who, when speaking in the 2nd person, becomes personal (compare <a onClick="return mV(\'Lev\',2,4);">Le 2:4</a>ff with <a onClick="return mV(\'Lev\',2,1,2,3);">2:1-3</a>, and also <a onClick="return mV(\'Lev\',1,2);">1:2</a>; <a onClick="return mV(\'Lev\',3,17);">3:17</a>; <a onClick="return mV(\'Lev\',6,18,21,25);">6:18,21,25</a>ff).<P>(d) Proofs of Religious Development:<P>A greater importance seemingly must be attributed to the reasons based on a difference in the terminology or on contradictions in the laws, as these appear to lead to a religio-historical development. But the following examples are intended to show how all important it is to be slow in the acceptance of the materials which the critics offer in this connection.<P>(3) Insufficiency of These Reasons.<P>(a) In <a onClick="return mV(\'Lev\',5,\'1-7\');">Le 5:1-7</a>, in the section treating of the sin offering (<a onClick="return mV(\'Lev\',4,\'1-\');">4:1-5:13</A>), we find the word \'asham, which also signifies "guilt offering" (compare <a onClick="return mV(\'Lev\',5,14);">5:14</A>ff; <a onClick="return mV(\'Lev\',7,1);">7:1</a>ff). Accordingly, it is claimed, the author of <a onClick="return mV(\'Lev\',5,\'1-7\');">5:1-7</A> was not yet acquainted with the difference between the two kinds of offerings, and that this part is older than that in <a onClick="return mV(\'Lev\',4,1);">4:1</A>ff; <a onClick="return mV(\'Lev\',5,14);">5:14</A>ff. However, in <a onClick="return mV(\'Lev\',5,1);">5:1</a>ff the word \'asham is evidently used in the sense of "repentance," and does not signify "sin offering" at all; at any rate, already in <a onClick="return mV(\'Lev\',5,6);">5:6</A>f we find the characteristic term chattath to designate the latter, and thus this section appears as entirely in harmony with the connection.<P>(b) Critics find a contradiction in <a onClick="return mV(\'Lev\',6,26);">Le 6:26</a>; <a onClick="return mV(\'Lev\',7,33);">7:33</a>, <a onClick="return mV(\'Lev\',7,7);">7</a>, and in <a onClick="return mV(\'Lev\',6,29);">6:29</a>; <a onClick="return mV(\'Lev\',7,31);">7:31</a>, <a onClick="return mV(\'Lev\',7,6);">6</A>, since in the first case the officiating priest and in the other case the entire college of priests is described as participating in the sacrifice. In reply it is to be said that the first set of passages treat of the individual concrete cases, while the second set speak of the general principle. In <a onClick="return mV(\'Lev\',7,8);">7:8</A>f; however, where the individual officiating priest is actually put in express contrast with all the sons of Aaron, the matter under consideration is a difference in the meal offerings, which, beginning with <a onClick="return mV(\'Lev\',2,\'1-\');">Le 2</a>, could be regarded as known. Why this difference is made in the use of this sacrifice is no longer intelligible to us, as we no longer retain these sacrifices, nor are we in possession of the oral instruction which possibly accompanied the written formulation of these laws; but this is a matter entirely independent of the question as to the author.<P>(c) According to <a onClick="return mV(\'Exd\',29,7);">Ex 29:7</a>; <a onClick="return mV(\'Lev\',4,3,5,16);">Le 4:3,5,16</a>; <a onClick="return mV(\'Lev\',6,20,22);">6:20,22</a>; <a onClick="return mV(\'Lev\',8,12);">8:12</a>; <a onClick="return mV(\'Lev\',16,32);">16:32</a>; <a onClick="return mV(\'Lev\',21,10,12);">21:10,12</a>, the high priest is the only one who is anointed; while, on the other hand, in <a onClick="return mV(\'Exd\',28,41);">Ex 28:41</a>; <a onClick="return mV(\'Exd\',29,21);">29:21</a>; <a onClick="return mV(\'Exd\',30,30);">30:30</a>; <a onClick="return mV(\'Exd\',40,15);">40:15</a>; <a onClick="return mV(\'Lev\',7,36);">Le 7:36</a>; <a onClick="return mV(\'Lev\',10,7);">10:7</a>, all the priests are anointed. But the text as it reads does not make it impossible that there was a double anointing. According to the first set of passages, Aaron is anointed in such a manner that the anointing oil is poured out upon his head (compare especially <a onClick="return mV(\'Exd\',29,7);">Ex 29:7</a> and <a onClick="return mV(\'Lev\',8,12);">Le 8:12</a>). Then, too, he and all his sons are anointed in such a way that a mixture of the oil and of the blood is sprinkled upon them and on their garments (compare especially <a onClick="return mV(\'Exd\',29,21);">Ex 29:21</a> and <a onClick="return mV(\'Lev\',8,30);">Le 8:30</a>). Were we here dealing with a difference in reference to theory and the ranks of the priesthood, as these discussions were current at the time of the exile (see III, below), then surely the victorious party would have seen to it that their views alone would have been reproduced in these laws, and the opposing views would have been suppressed. But now both anointings are found side by side, and even in one and the same chapter!<P>(d) The different punishments prescribed for carnal intercourse with a woman during her periods in <a onClick="return mV(\'Lev\',15,24);">Le 15:24</a> and <a onClick="return mV(\'Lev\',20,18);">20:18</A> are easily explained by the fact that, in the first passage, the periods are spoken of which only set in during the act, and in the second passage, those which had already set in before.<P>(e) As far as the difference in terminology is concerned, it must be remembered that in their claims the critics either overlook that intentional differences may decide the preference for certain words or expressions; or else they ignore the fact that it is possible in almost every section of a writer\'s work to find some expressions which are always, or at least often, peculiar to him; or finally, they in an inexcusable way ignore the freedom of selection which a writer has between different synonyms or his choice in using these.<P>All in all, it must be said that however much we acknowledge the keenness and the industry of the modern critics in clearing up many difficulties, and the fact that they bring up many questions that demand answers, it nevertheless is the fact that they take the matter of solving these problems entirely too easily, by arbitrarily claiming different authors, without taking note of the fact that by doing this the real difficulty is not removed, but is only transferred to another place. What could possibly be accepted as satisfactory in one single instance, namely that through the thoughtlessness of an editor discrepancies in form or matter had found their way into the text, is at once claimed to be the regular mode of solving these difficulties—a procedure that is itself thoughtlessness. On the other hand, the critics overlook the fact that it makes little difference for the religious and the ethical value of these commands, whether logical, systematic, linguistic or aesthetic correctness in all their parts has been attained or not; to which must yet be added, that a failure in the one particular may at the same time be an advantage in the other. In this respect we need recall only the anacoluths of the apostle Paul.<P>2. Structure of the Biblical Text:<P>(1) Structure in General.<P>The most effective antidote against the craze to split up the text in the manner described above will be found in the exposition of all those features which unite this text into one inseparable whole. What we have tried to demonstrate in the articles <a href="./study/isbe/search.html?string=GENESIS">GENESIS</a>; <a href="./study/isbe/search.html?string=EXODUS">EXODUS, II</a>; <a href="./study/isbe/search.html?string=DAY+OF+ATONEMENT">DAY OF ATONEMENT, I, 2</a> (compare also <a href="./study/isbe/search.html?string=EZEKIEL">EZEKIEL, I,2,(2)</a>) can be repeated at this point. The Book of Leviticus shows all the marks of being a well-constructed and organic literary product, which in its fundamental characteristics has already been outlined under I above. And as this was done in the several articles just cited, we can here add further, as a corroborative factor in favor of the acceptance of an inner literary unity of the book, that the division of the book into its logical parts, even down to minute details, is here, as is so often the case elsewhere, not only virtually self-evident in many particulars, but that the use made of typical numbers in many passages in this adjustment of the parts almost forces itself upon our recognition. In other places the same is at least suggested, and can be traced throughout the book without the least violence to the text. The system need not be forced upon the materials. We often find sections but loosely connected with the preceding parts (compare under 1 above) and not united in a strictly logical manner, but which are nevertheless related in thought and association of ideas. In harmony with the division of the Book of Genesis we find at once that the general contents, as mentioned under I above, easily fall into 10 pericopes, and it is seen that these consist of 2 sets each of 5 pericopes together with an appendix.<P>(a) Ten Pericopes in Two Parts:<P>Part I, the separation from God and the removal of this separation: (i) <a onClick="return mV(\'Lev\',1,\'1-\');">Le 1:1-7:38</a>; (ii) <a onClick="return mV(\'Lev\',8,\'1-\');">Le 8:1-10:20</a>; (iii) <a onClick="return mV(\'Lev\',11,\'1-\');">Le 11:1-15:33</a>; (iv) <a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a>; (v) <a onClick="return mV(\'Lev\',17,\'1-\');">Le 17</a>.<P>Part II, the normal conduct of the people of God: (i) <a onClick="return mV(\'Lev\',18,\'1-\');">Le 18</a>; <a onClick="return mV(\'Lev\',19,\'1-\');">19</a>; <a onClick="return mV(\'Lev\',20,\'1-\');">20</a>; (ii) <a onClick="return mV(\'Lev\',21,\'1-\');">Le 21</a>; <a onClick="return mV(\'Lev\',22,\'1-\');">22</a>; (iii) <a onClick="return mV(\'Lev\',23,\'1-\');">Le 23</a>; <a onClick="return mV(\'Lev\',24,\'1-\');">24</a>; (iv) <a onClick="return mV(\'Lev\',25,\'1-\');">Le 25</a>; (v) <a onClick="return mV(\'Lev\',26,\'1-\');">Le 26</a>.<P>Appendix, <a onClick="return mV(\'Lev\',27,\'1-\');">Le 27</a>; compare for the <span class="noTag">number 10</span> the division of <a onClick="return mV(\'Exd\',1,\'8-\');">Ex 1:8-7:7</a>; <a onClick="return mV(\'Exd\',7,\'8-\');">7:8-13:16</a>; <a onClick="return mV(\'Exd\',13,\'17-\');">13:17-18:27</a>; also the Decalogue, <a onClick="return mV(\'Lev\',20,1);">20:1</A>ff; <a onClick="return mV(\'Lev\',21,\'1-\');">21:1-23:19</A>; <a onClick="return mV(\'Lev\',32,\'1-\');">32:1-35:1</A>; and see <a href="./study/isbe/search.html?string=EXODUS">EXODUS, II, 2</a>; and in Leviticus probably <a onClick="return mV(\'Lev\',18,\'6-18\');">18:6-18</a>; <a onClick="return mV(\'Lev\',19,\'9-18\');">19:9-18</A>, and with considerable certainty <a onClick="return mV(\'Lev\',19,\'1-37\');">19:1-37</a> (see below).<P>(b) Correspondence and Connections:<P>I leave out of consideration in this case the question whether an intentional correspondence among the different parts be traced or not, even in their details. Thus, e.g.; when the 2nd pericope (<a onClick="return mV(\'Lev\',8,\'1-\');">Le 8</a>; <a onClick="return mV(\'Lev\',9,\'1-\');">9</a>; <a onClick="return mV(\'Lev\',10,\'1-\');">10</a>; <a onClick="return mV(\'Lev\',21,\'1-\');">21</a>f) treats particularly of the order of the priests, or when the 4th pericope of the 2nd set (<a onClick="return mV(\'Lev\',25,\'1-\');">Le 25</a>) states that the beginning of the Year of Jubilee fell on the 10th day of the 7th month, i.e. on the Day of Atonement as described in <a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a>, in the 4th pericope of the 1st set (compare <a onClick="return mV(\'Lev\',25,9);">25:9</A> with <a onClick="return mV(\'Lev\',16,29);">16:29</A>); or when both sets close with two shorter pericopes, which evidently express high stages of development (<a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a>; <a onClick="return mV(\'Lev\',17,\'1-\');">17</a>, respectively, <a onClick="return mV(\'Lev\',25,\'1-\');">Le 25</a>; <a onClick="return mV(\'Lev\',26,\'1-\');">26</a> treating of the Day of Atonement, of the use made of blood and the purposes of blood for the altar or the Jubilee Year, of the blessing and the curse).<P>And, as far as the order in other respects is concerned, it is throughout to be regarded as founded in the subject-matter itself that <a onClick="return mV(\'Lev\',1,\'1-\');">Le 1-17</a> must precede <a onClick="return mV(\'Lev\',18,\'1-\');">Le 18:1-26:46</a>. First that which separates the people from God must be removed, and then only is a God-pleasing conduct possible. Just as easily, and in agreement with the context, it is possible that the consecration of the priests in <a onClick="return mV(\'Lev\',8,\'1-\');">Le 8-10</a> presupposes the sacrificial torah (<a onClick="return mV(\'Lev\',1,\'1-\');">Le 1-7</a>; compare under 1 above) and follows the latter, and is immediately introduced by the mention made of the installation sacrifices for which otherwise there are no reasons assigned in the concluding formula in <a onClick="return mV(\'Lev\',7,37);">7:37</A> (compare <a onClick="return mV(\'Lev\',8,\'22-32\');">8:22-32</a>). The Day of Atonement (<a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a>), which in <a onClick="return mV(\'Lev\',16,16);">16:16</a>f and <a onClick="return mV(\'Lev\',33,\'1-\');">33</a> is spoken of in connection with the purification of the sanctuary, is in turn introduced by <a onClick="return mV(\'Lev\',11,\'1-\');">Le 11-15</a>, or more particularly by the remark in <a onClick="return mV(\'Lev\',15,31);">15:31</A>, where mention is made of the pollution of the dwelling-place of Yahweh. And on the other hand, the ordinances dealing with the priests (<a onClick="return mV(\'Lev\',8,\'1-\');">Le 8</a>; <a onClick="return mV(\'Lev\',9,\'1-\');">9</a>; <a onClick="return mV(\'Lev\',10,\'1-\');">10</a>) in <a onClick="return mV(\'Lev\',10,10);">10:10</a>, where the command is given to discriminate between what is holy and what is unholy and to teach Israel accordingly, already point to the contents of <a onClick="return mV(\'Lev\',11,\'1-\');">Le 11-15</a>. The sacrifices, with which the first part in <a onClick="return mV(\'Lev\',1,\'1-\');">Le 1-7</a> begins, are taken up again by the conclusion in <a onClick="return mV(\'Lev\',17,\'1-\');">Le 17</a>, in the commandment concerning the blood for the altar. The second part, too, already at the beginning (<a onClick="return mV(\'Lev\',18,\'1-\');">Le 18</a>; <a onClick="return mV(\'Lev\',19,\'1-\');">19</a>; <a onClick="return mV(\'Lev\',20,\'1-\');">20</a>) in its religiously cultural and ethical ordinances, shows in the clearest possible manner what matters it proposes to discuss. In this way the systematic structure of the book is apparent in all particulars.<P>Close connections: comparison with Exodus: And, further, the different pericopes are also so closely Connected among themselves and with the corresponding pericopes in the Books of Exodus and Numbers, that many have thought it necessary to regard them as a special body of laws. But the connection is so close and involves all the details so thoroughly, that all efforts to divide and distribute them after the examples described under 1 above must fail absolutely. We shall now give the proofs for the different pericopes in Leviticus, but in such a manner as to take into consideration also <a onClick="return mV(\'Exd\',25,\'1-\');">Ex 25:1-31:18</a>; <a onClick="return mV(\'Exd\',35,\'1-\');">35</a>ff, treating of the tabernacle and its utensils and the Aaronitic priesthood, which are most intimately connected with Lev. All details in this matter will be left out of consideration.<P>(i) Tabernacle and priesthood: That <a onClick="return mV(\'Lev\',8,\'1-\');">Le 8-10</a> (the consecration of the priests, etc.), together with <a onClick="return mV(\'Exd\',25,\'1-\');">Ex 25</a>ff, constitutes a single whole is accepted on all hands. But the tent of meeting and its utensils, and also the priesthood, both with and without any emphasis on the Aaronitic origin, are presupposed also in almost each one of the other pericopes of Leviticus; compare for <a onClick="return mV(\'Lev\',1,\'1-\');">Le 1-7</a>, e.g., <a onClick="return mV(\'Lev\',1,3,5);">1:3,5</>; <a onClick="return mV(\'Lev\',3,2,8,13);">3:2,8,13</a>; <a onClick="return mV(\'Lev\',4,4,5,7,14,16,18);">4:4,5,7,14,16,18</a>; <a onClick="return mV(\'Lev\',6,26);">6:26</a> (tent of meeting); <a onClick="return mV(\'Lev\',1,5,12);">1:5,12</a>; <a onClick="return mV(\'Lev\',3,5);">3:5</A>; <a onClick="return mV(\'Lev\',4,7,25,30);">4:7,25,30</a>; <a onClick="return mV(\'Lev\',6,12);">6:12</a> (altar of burnt sacrifices); <a onClick="return mV(\'Lev\',4,7,18);">4:7,18</a> (altar of incense sacrifices); <a onClick="return mV(\'Lev\',4,6,17);">4:6,17</A> (veil); <a onClick="return mV(\'Lev\',6,9,19);">6:9,19</A> (court); <a onClick="return mV(\'Lev\',1,5,7,11);">1:5,7,8,11</a>; <a onClick="return mV(\'Lev\',2,2);">2:2</a>; <a onClick="return mV(\'Lev\',3,2,5,8,13);">3:2,5,8,13</a>; <a onClick="return mV(\'Lev\',6,9,14,16,20,25);">6:9,14,16,20,25</a>, etc. (Aaron and his sons as priests); for <a onClick="return mV(\'Lev\',11,\'1-\');">Le 11-15</a> see <a onClick="return mV(\'Lev\',12,4.6);">12:4,6</a>; <a onClick="return mV(\'Lev\',14,11,23);">14:11,23</a>; <a onClick="return mV(\'Lev\',15,14.29.31);">15:14,29,31</a> (sanctuary, tent of meeting, dwelling-place); <a onClick="return mV(\'Lev\',11,1);">11:1</A>; <a onClick="return mV(\'Lev\',12,6);">12:6</A>f; <a onClick="return mV(\'Lev\',13,1);">13:1</a>ff; <a onClick="return mV(\'Lev\',14,2,33);">14:2ff, 33ff</a>; <a onClick="return mV(\'Lev\',15,1);">15:1</a> (priesthood); for <a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a> see verses <a onClick="return mV(\'Lev\',16,2,7,16,20,23,33);">2,7,16f; 20,23,33</a> (sanctuary and Holy of Holies, tent of meeting); <a onClick="return mV(\'Lev\',16,2,12);">16:2,12</a> (veil); <a onClick="return mV(\'Lev\',16,2,13);">16:2,13</a>ff (lid of the Ark of the Covenant); <a onClick="return mV(\'Lev\',16,12,18,20,33);">16:12,18,20,33</a> (altar); <a onClick="return mV(\'Lev\',16,1);">16:1</a>ff (Aaronitic priesthood); for <a onClick="return mV(\'Lev\',17,\'1-\');">Le 17</a> see verses <a onClick="return mV(\'Lev\',17,4,5,6,9);">4-6,9</a> (tent of meeting); <a onClick="return mV(\'Lev\',17,6,11);">17:6,11</a> (altar); <a onClick="return mV(\'Lev\',17,5);">17:5</a> (priesthood); for <a onClick="return mV(\'Lev\',18,\'1-\');">Le 18</a>; <a onClick="return mV(\'Lev\',19,\'1-\');">19</a>; <a onClick="return mV(\'Lev\',20,\'1-\');">20</a> see <a onClick="return mV(\'Lev\',19,30);">19:30</a>, <a onClick="return mV(\'Lev\',19,21);">21</a> (sanctuary of Yahweh, tent of meeting); <a onClick="return mV(\'Lev\',19,22);">19:22</A> (priesthood); for <a onClick="return mV(\'Lev\',21,\'1-\');">Le 21</a>f see <a onClick="return mV(\'Lev\',21,12);">21:12</a> (sanctuary); <a onClick="return mV(\'Lev\',21,23);">21:23</A> (sanctuaries of Yahweh); <a onClick="return mV(\'Lev\',21,23);">21:23</a> (veil, altar); <a onClick="return mV(\'Lev\',21,1,21);">21:1ff, 21</A> (Aaronitic priesthood); for <a onClick="return mV(\'Lev\',23,\'1-\');">Le 23</a>; <a onClick="return mV(\'Lev\',24,\'1-\');">24</a> see <a onClick="return mV(\'Lev\',23,2,4,21,24,27,36);">23:2,4,21,24,27,36</A>f (sanctuary); <a onClick="return mV(\'Lev\',24,1);">24:1</A>ff (candlestick, tent of meeting); <a onClick="return mV(\'Lev\',24,5);">24:5</a>ff (table of showbread); <a onClick="return mV(\'Lev\',23,10,20);">23:10,20</a> (priesthood); <a onClick="return mV(\'Lev\',24,3,9);">24:3,9</a> (Aaronitic priesthood); for <a onClick="return mV(\'Lev\',26,\'1-\');">Le 26</a> see verses <a onClick="return mV(\'Lev\',26,2,11,31);">2,11,31</a> (sanctuary, dwelling-place of Yahweh, sanctuaries); for <a onClick="return mV(\'Lev\',27,\'1-\');">Le 27</a> see verses <a onClick="return mV(\'Lev\',27,10,33);">10,33</a> (sanctuary); <a onClick="return mV(\'Lev\',27,8);">27:8</A>ff (priesthood).<P>(ii) In the same way the sacrificial laws of <a onClick="return mV(\'Lev\',1,\'1-\';">Le 1-7</a> are mentioned in the following pericopes as matters that are well known. For <a onClick="return mV(\'Lev\',8,\'1-\');">Le 8-10</a> see <a onClick="return mV(\'Lev\',9,7,15);">9:7,15</a>(sin offering); <a onClick="return mV(\'Lev\',9,7,12,16);">9:7,12,16</a> (burnt offering); <a onClick="return mV(\'Lev\',9,17);">9:17</A>; <a onClick="return mV(\'Lev\',10,12);">10:12</a> (meal offering); <a onClick="return mV(\'Lev\',9,18);">9:18</a> (peace offering); <a onClick="return mV(\'Lev\',9,3);">9:3</A>f (all together); compare also <a onClick="return mV(\'Exd\',29,14,18,28);">Ex 29:14,18,28</a>. In <a onClick="return mV(\'Lev\',9,21);">Le 9:21</a>; <a onClick="return mV(\'Lev\',10,14);">10:14</a>f (wave-breasts and heave-thigh) direct reference is made to <a onClick="return mV(\'Lev\',7,\'30-36\');">7:30-36</a>. In the same manner <a onClick="return mV(\'Lev\',10,16);">10:16</A>ff presupposes the ordinances dealing with the different ways of offering the sin offerings in <a onClick="return mV(\'Lev\',4,3,13);">4:3ff, 13</A>ff; <a onClick="return mV(\'Lev\',6,\'24-30\');">6:24-30</A>; for <a onClick="return mV(\'Lev\',11,\'1-\');">Le 11-15</a> see <a onClick="return mV(\'Lev\',12,6);">12:6</a>ff; <a onClick="return mV(\'Lev\',14,12);">14:12</a>ff (compare especially <a onClick="return mV(\'Lev\',14,13);">14:13</A> with <a onClick="return mV(\'Lev\',4,24);">4:24</a>); <a onClick="return mV(\'Lev\',14,21);">14:21</a>ff; <a onClick="return mV(\'Lev\',15,14,29);">15:14f; 29f</a>; for <a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a> see verses <a onClick="return mV(\'Lev\',16,3,5,9,11,15,24,27);">3,5f; 9,11,15,24f; 27</a>; for <a onClick="return mV(\'Lev\',17,\'1-\');">Le 17</a> see verses <a onClick="return mV(\'Lev\',17,5,8,11);">5ff, 8,11</a>; for <a onClick="return mV(\'Lev\',18,\'1-\');">Le 18</a>; <a onClick="return mV(\'Lev\',19,\'1-\');">19</a>; <a onClick="return mV(\'Lev\',20,\'1-\');">20</a> see <a onClick="return mV(\'Lev\',19,6,21);">19:6ff, 21f</A> (here is therefore the \'asham found in H, which is claimed to be of a later date); for <a onClick="return mV(\'Lev\',21,\'1-\');">Le 21</a>f see <a onClick="return mV(\'Lev\',21,6,21);">21:6,21f</a>; <a onClick="return mV(\'Lev\',22,17,29);">22:17ff, 29f</A>; for <a onClick="return mV(\'Lev\',23,\'1-\');">Le 23</a>; <a onClick="return mV(\'Lev\',24,\'1-\');">24</a> see <a onClick="return mV(\'Lev\',23,12);">23:12</a>f; <a onClick="return mV(\'Lev\',18,19,27,37);">18:19,27,37</a>; <a onClick="return mV(\'Lev\',24,9);">24:9</a>; for <a onClick="return mV(\'Lev\',26,\'1-\');">Le 26</a> see verses <a onClick="return mV(\'Lev\',26,30);">30</a>f; for <a onClick="return mV(\'Lev\',27,\'1-\');">Le 27</a> compare verses <a onClick="return mV(\'Lev\',27,15,19,27,31);">15,19,27,31</a> with <a onClick="return mV(\'Lev\',5,16);">5:16</a>; <a onClick="return mV(\'Lev\',6,5);">6:5</A>.<P>(iii) Laws on clean and unclean: The laws in reference to the clean and the unclean in <a onClick="return mV(\'Lev\',11,\'1-\');">Le 11-15</a> are also interwoven with the whole book. For <a onClick="return mV(\'Lev\',1,\'1-\');">Le 1-7</a> see <a onClick="return mV(\'Lev\',5,2);">5:2</A>f; <a onClick="return mV(\'Lev\',6,27);">6:27</a>; <a onClick="return mV(\'Lev\',7,19);">7:19</a>ff; for <a onClick="return mV(\'Lev\',8,\'1-\');">Le 8-10</a> see <a onClick="return mV(\'Lev\',10,10);">10:10</A>f; for <a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a> see verses <a onClick="return mV(\'Lev\',16,16,19);">16,19</A>; for <a onClick="return mV(\'Lev\',17,\'1-\');">Le 17</a> see verses <a onClick="return mV(\'Lev\',17,13,15);">13,15</a>f; for <a onClick="return mV(\'Lev\',18,\'1-\');">Le 18</a>; <a onClick="return mV(\'Lev\',19,\'1-\');">19</a>; <a onClick="return mV(\'Lev\',20,\'1-\');">20</a> compare <a onClick="return mV(\'Lev\',20,25);">20:25</a> with <a onClick="return mV(\'Lev\',11,44);">11:44</a>, and in general with <a onClick="return mV(\'Lev\',11,\'1-\');">Le 11</a>; for <a onClick="return mV(\'Lev\',21,\'1-\');">Le 21</a>f see <a onClick="return mV(\'Lev\',21,10);">21:10</a>; <a onClick="return mV(\'Lev\',13,45);">13:45</A>; <a onClick="return mV(\'Lev\',22,3);">22:3</a>ff with <a onClick="return mV(\'Lev\',13,\'1);">Le 13-15</a>; for <a onClick="return mV(\'Lev\',27,1);">Le 27</a> see verses <a onClick="return mV(\'Lev\',27,11);">11</a> and <a onClick="return mV(\'Lev\',27,27);">27</a>, as also <a onClick="return mV(\'Lev\',11,\'1-\');">Le 11</a>.<P>(iv) The laws in reference to the Day of Atonement found in <a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a> are prepared for by those found in <a onClick="return mV(\'Lev\',11,\'1-\');">Le 11-15</a>, namely, in <a onClick="return mV(\'Lev\',14,4,49);">14:4ff, 49ff</a> (the ceremony with the two birds in connection with the purification from leprosy), and in <a onClick="return mV(\'Lev\',15,31);">15:31</a> (compare <a onClick="return mV(\'Lev\',16,16,19);">16:16,19</a>; see above). For <a onClick="return mV(\'Lev\',23,\'1-\');">Le 23</a>; <a onClick="return mV(\'Lev\',24,\'1-\');">24</a> compare <a onClick="return mV(\'Lev\',23,26);">23:26</a>ff with <a onClick="return mV(\'Lev\',16,29);">16:29</a>ff, and for <a onClick="return mV(\'Lev\',25,9);">25:9</a> with <a onClick="return mV(\'Lev\',16,29);">16:29</a> see above; compare also <a onClick="return mV(\'Exd\',30,10);">Ex 30:10</a>.<P>(v) <a onClick="return mV(\'Lev\',17,\'1-\');">Leviticus 17</a> is re-echoed in <a onClick="return mV(\'Lev\',1,\'1-\');">Le 1-7</a> (<a onClick="return mV(\'Lev\',7,26);">7:26</a>f) and in <a onClick="return mV(\'Lev\',18,\'1-\');">Le 18</a>; <a onClick="return mV(\'Lev\',19,\'1-\');">19</a>; <a onClick="return mV(\'Lev\',20,\'1-\');">20</a> (<a onClick="return mV(\'Lev\',19,26);">19:26</a>).<P>(vi) Finally <a onClick="return mV(\'Lev\',25,\'1-\');">Le 25</a> (Year of Rest and Year of Jubilee) is presupposed in <a onClick="return mV(\'Lev\',26,34,43);">Le 26:34f; 43</a> and in <a onClick="return mV(\'Lev\',27,17,23);">Le 27:17ff, 23f</a>.<P>The above, however, by no means exhausts this list of references and similar thoughts, and we have here given only some leading illustrations. What literary tricks must be resorted to when, over against this overwhelming mass of evidence, critics yet insist that the different parts of the book were originally independent writings, especially, too, when the entire tabernacle and utensils of the Aaronitic priesthood, the Day of Atonement, the Year of Jubilee, the whole sacrificial scheme and the laws dealing with the great festivals, the restriction of the slaying of the sacrificial animals to the central sanctuary, are regarded as the products of imagination alone, according to the Wellhausen hypothesis (compare III, below, and see also <a href="./study/isbe/search.html?string=EXODUS">EXODUS, III, 5</a>; <a href="./study/isbe/search.html?string=DAY+OF+ATONEMENT">DAY OF ATONEMENT, III, 1</a>; <a href="./study/isbe/search.html?string=EZEKIEL">EZEKIEL, II, 2</a>). And how little is gained in addition when, as is sometimes done, in a most arbitrary manner, the statements found in <a onClick="return mV(\'Lev\',1,\'1-\');">Le 1-3</a> concerning the tabernacle of revelation ("tent of meeting") and concerning Aaron\'s sons, or concerning Aaron and his sons together, are regarded as later additions. In Leviticus and <a onClick="return mV(\'Exd\',25,\'1-\');">Ex 25</a>ff; <a onClick="return mV(\'Exd\',35,\'1-\');">35</a>ff, everything is so entirely of one and the same character and has so clearly emanated from one and the same spirit, that it is impossible to separate from this product any constituent parts and to unite these into groups that were originally independent, then to split up these still further and to trace the parts to their sources, and even to construct a scheme of religious and historical development on this reconstruction of the sources.<P>(2) Structure of the Individual Pericopes.<P>As the windows and the column capitals of a medieval cathedral are arranged according to different schemes and this divergence is regarded as an enrichment of the structure, thus, too, we find it to be in the structure of the various pericopes of the Book of Leviticus. These latter, too, possess a certain symphony of different tones, but all are rhythmically arranged, and only when united do they produce the entire symphony.<P>(a) The Laws Concerning the Sacrifices (<a onClick="return mV(\'Lev\',1,\'1-\');">Leviticus 1-7</a>):<P>In the first place, the five different kinds of sacrifices in Israel are mentioned in succession twice, in <a onClick="return mV(\'Lev\',1,\'1-\');">Le 1:1-7:21</a>: Part I, <a onClick="return mV(\'Lev\',1,\'1-\');">Le 1-5</a>, namely (i) <a onClick="return mV(\'Lev\',1,\'1-\');">Le 1</a>, burnt offerings; (ii) <a onClick="return mV(\'Lev\',2,\'1-\');">Le 2</a>, meal offering; (iii) <a onClick="return mV(\'Lev\',3,\'1-\');">Le 3</a>, peace offerings; (iv) <a onClick="return mV(\'Lev\',4,\'1-\');">4:1</a>-<a onClick="return mV(\'Lev\',5,\'1-13\');">5:13</a>, sin offering; (v) <a onClick="return mV(\'Lev\',5,\'14-26\');">5:14-26</a>, guilt offering; Part II, <a onClick="return mV(\'Lev\',6,\'1-\');">6:1</a>-<a onClick="return mV(\'Lev\',7,\'1-21\');">7:21</a>, namely<P>(i) <a onClick="return mV(\'Lev\',6,\'8-13\');">6:8-13</a>, burnt offerings;<P>(ii) <a onClick="return mV(\'Lev\',6,\'14-23\');">6:14-23</a>, meal offering;<P>(iii) <a onClick="return mV(\'Lev\',6,\'24-30\');">6:24-30</a>, sin offering;<P>(iv) <a onClick="return mV(\'Lev\',7,\'1-7\');">7:1-7</a> with appendix, <a onClick="return mV(\'Lev\',7,\/8,9,10\');">7:8-10</a>, dealing with that part of the sacrifices which belongs to the priest (see under 1, above), guilt offering;<P>(v) <a onClick="return mV(\'Lev\',7,\'11-21\');">7:11-21</a>, peace offerings.<P>With this is found connected in <a onClick="return mV(\'Lev\',7,\'22-27\');">7:22-27</a> the prohibition of the use of the fat or the blood, and in <a onClick="return mV(\'Lev\',7,\'28-36\');">7:28-36</a>, the laws concerning the wave-breast and the heave-thigh. We have accordingly at once twelve of these laws (compare on <a onClick="return mV(\'Exd\',25,\'1-\');">Ex 25:1-30:10</a> in article on <a href="./study/isbe/search.html?string=EXODUS">EXODUS, II,2,(5)</a> and on <a href="./study/isbe/search.html?string=EZEKIEL">EZEKIEL, I,2,5)</a>). But even apart from this we have no right to ascribe <a onClick="return mV(\'Lev\',1,\'1-\');">Le 1-5</a> and <a onClick="return mV(\'Lev\',6,\'1-\');">6:1</a>-<a onClick="return mV(\'Lev\',7,\'1-21\');">7:21</a>, on the ground that they are duplicates, to different authors.<P>That there is a difference between these two accounts is proved, not only by the fact that the first set of laws from <a onClick="return mV(\'Lev\',1,\'1-\');">Le 1-5</a> is addressed to all the Israelites (compare <a onClick="return mV(\'Lev\',1,2);">1:2</a>; <a onClick="return mV(\'Lev\',4,2);">4:2</a>), and the second set <a onClick="return mV(\'Lev\',6,8);">6:8</a>; <a onClick="return mV(\'Lev\',7,21);">7:21</a> to Aaron and his sons (compare <a onClick="return mV(\'Lev\',6,9,25);">6:9,25</a>); but the second set has also in content a number of altogether different viewpoints as compared with the first set, so that the same author found himself induced or compelled to write both sets. On the other hand, the fact that both have the same author is evident from the very close connection between the two sections. In addition to the fact that both make mention of all five kinds of sacrifices, we can yet compare <a onClick="return mV(\'Lev\',3,5);">3:5</a> with <a onClick="return mV(\'Lev\',6,22);">6:22</a> (fat pieces of the peace offering over the burnt sacrifices upon the pieces of wood); and, further, the express reference of <a onClick="return mV(\'Lev\',6,17);">6:17</a> to <a onClick="return mV(\'Lev\',4,\'1-\');">Le 4</a>, while <a onClick="return mV(\'Lev\',6,30);">6:30</a> presupposes the distinct separation of the sin offering, the blood of which is brought into the tent of meeting, from the other sacrifices, as these are given in <a onClick="return mV(\'Lev\',4,3,13);">4:3ff, 13ff</a> over against <a onClick="return mV(\'Lev\',4,22,27);">4:22ff, 27ff</a>. <a onClick="return mV(\'Lev\',4,\'1-\');">Leviticus 4</a>, with its reference to the peace offerings (<a onClick="return mV(\'Lev\',4,10,26,31,35);">4:10,26,31,35</a>), is again most closely connected with <a onClick="return mV(\'Lev\',3,\'1-\');">Le 3</a>. We must accordingly insist that the whole account is most intimately interwoven. Over against this, the omission within the first set, <a onClick="return mV(\'Lev\',1,\'1-\');">Le 1-5</a>, in <a onClick="return mV(\'Lev\',5,14,15,16);">5:14-16</a>, of the ritual for the peace offering, is sufficiently explained only by the fact that this ritual was to be used in the second set (<a onClick="return mV(\'Lev\',6,\'8-\');">6:8</a>-<a onClick="return mV(\'Lev\',7,\'1-21\');">7:21</a>), and here for the first time only in <a onClick="return mV(\'Lev\',7,\'1-15\');">7:1-15</a>, which fact again speaks for the same author for both sets and against the supposition that they were merely mechanically united by a redactor. The fact that the second set <a onClick="return mV(\'Lev\',6,\'8-\');">6:8</a>-<a onClick="return mV(\'Lev\',7,21);">7:21</a> has a different order from that of <a onClick="return mV(\'Lev\',1,\'1-\');">Le 1-5</a>, by uniting the sin offering immediately with the meal offering (<a onClick="return mV(\'Lev\',6,24);">6:24</a>ff with <a onClick="return mV(\'Lev\',6,\'14-23\');">6:14-23</a>), is probably on account of the similar ordinances in <a onClick="return mV(\'Lev\',7,9);">7:9</a> and <a onClick="return mV(\'Lev\',7,19);">7:19</a> (manner of eating the meal offering and the sin offering). On the other hand, the position of the peace offering at the close of the second set (<a onClick="return mV(\'Lev\',7,11);">7:11</a>ff) furnished the possibility of giving to the piece of the entire pericope embraced in <a onClick="return mV(\'Lev\',7,\'22-36);">7:22-27,28-36</a> a suitable conclusion; since <a onClick="return mV(\'Lev\',7,22);">7:22</a>ff (prohibition of the eating of the fat and the blood), connected with <a onClick="return mV(\'Lev\',7,19);">7:19</a>ff, contained in <a onClick="return mV(\'Lev\',7,28);">7:28</a>ff an ordinance that pertained to the peace offering (heave-breast and wave-thigh). At any rate, these last two pieces are to be regarded separately from the rest, since they are no longer addressed to the priests, as <span class="noTag">is</span> <a onClick="return mV(\'Isa\',6,\'8-\');">6:8</a>-<a onClick="return mV(\'Lev\',7,\'1-21\');">7:21</a
