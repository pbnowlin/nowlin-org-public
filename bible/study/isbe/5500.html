isbe[5510]='Liberal; Liberality; Liberally`lib\'-er-al, lib-er-al\'-i-ti, lib\'-er-al-i: The different forms of the word all refer to one who is generous, bountiful, willing and ready to give and to help. Both the Hebrew words of the Old Testament and the Greek words of the New Testament translated into the English word "liberal" have a deeper and nobler meaning than is generally conveyed by the English word. In <a onClick="return mV(\'Pro\',11,25);">Pr 11:25</a>, the liberal soul (nephesh berakhah) means a soul that carries a blessing. In <a onClick="return mV(\'Isa\',32,5);">Isa 32:5</a>, the American Standard Revised Version has "bountiful" where the King James Version has "liberal," and in <a onClick="return mV(\'Isa\',32,8);">Isa 32:8</a> "noble" takes the place of "liberal" (nadhibh). The principal Greek words are haplotes literally, "simplicity," "sincerity," and charis, "grace," "favor." In <a onClick="return mV(\'1Cr\',16,3);">1Co 16:3</a>, "bounty" substitutes "liberality." It is well to bear in mind that a Biblical liberality can spring only out of a noble soul, and is Godlike in its genesis and spirit.``64';
isbe[5511]='Libertines`lib\'-er-tinz, li-bur\'-tinz (Libertinoi): These were among Stephen\'s opponents: "There arose certain of them that were of the synagogue called (the synagogue) of the Libertines, and of the Cyrenians, and of the Alexandrians, and of them of Cilicia and Asia, disputing with Stephen" (<a onClick="return mV(\'Act\',6,9);">Ac 6:9</a>).have a deeper and nobler meaning than is generally conveyed by the English word. In <a onClick="return mV(\'Pro\',11,25);">Pr 11:25</a>, the liberal soul (nephesh berakhah) means a soul that carries a blessing. In <a onClick="return mV(\'Isa\',32,5);">Isa 32:5</a>, the American Standard Revised Version has "bountiful" where the King James Version has "liberal," and in <a onClick="return mV(\'Isa\',32,8);">Isa 32:8</a> "noble" takes the place of "liberal" (nadhibh). The principal Greek words are haplotes literally, "simplicity," "sincerity," and charis, "grace," "favor." In <a onClick="return mV(\'1Cr\',16,3);">1Co 16:3</a>, "bounty" substitutes "liberality." It is well to bear in mind that a Biblical liberality can spring only out of a noble soul, and is Godlike in its genesis and spirit.<P>1. "Synagogue of the Libertines":<P>How many synagogues are denoted? The answer may aid in the interpretation of "Libertines":<P>(1) The words may be read as denoting one synagogue (Calvin). However<P>(a) the number of worshippers would be extremely large,<P>(b) the bond of union is not obvious,<P>(c) rabbinic tradition speaks of 480 synagogues in Jerusalem.<P>(2) The double ton ("of them") seems to denote two parties, the one consisting "of them that were of the synagogue called (the synagogue) of Libertines and Cyrenians and Alexandrians," the other "of them of Cilicia and Asia", (Winer, Wendt, Holtzmann). But the second ton is dependent on synagogue. "As Cyrenians and Alexandrians both belong to towns...a change of designation would be necessary when the Jews of whole provinces came to be mentioned: this being the case, the article could not but be repeated, without any reference to the ton before" (Alford).<P>(3) There were three synagogues:<P>(a) that of the Libertines,<P>(b) that of the Cyrenians and Alexandrians and<P>(c) that "of them of Cilicia and Asia" (Alford). There is no grammatical reason for this division, but it is based on an interpretation of "Libertines." There were "Libertines," Africans and Asiatics.<P>(4) Each party had a separate synagogue (Schurer, Hausrath). The number of worshippers, their different origin and connections, and the number of synagogues in Jerusalem give weight to this view.<P>2. Interpretation of "Libertines":<P>(1) They are "freedmen," liberated slaves or their descendants. Against this it is held that the Greek equivalent (apeleutheroi) would have been used in this case. However, the Roman designation would be common all over the empire. In what sense were they "freedmen"? Various answers are given:<P>(a) they were freedmen from Jewish servitude (Lightfoot);<P>(b) they were Italian freedmen who had become proselytes;<P>(c) they were "the freedmen of the Romans" (Chrysostom), the descendants of Jewish freedmen at Rome who had been expelled by Tiberius. In 63 BC Pompey had taken prisoners of war to Rome. These, being liberated by those who had acquired them as slaves, formed a colony on the banks of the Tiber (Philo, Legat. ad Caium). Tacitus relates that the senate decreed (19 AD) that a number of Jewish Libertines should be transported to Sardinia, and that the rest should leave Italy, unless they renounced, before a certain day, their profane customs (Ann. ii, 85; see also Josephus, Ant, XVIII, iii, 5). Many would naturally seek refuge in Jerusalem and build there a synagogue.<P>(2) They are an African community. There were two synagogues, one of which was Asiatic. In the other were men from two African towns (Cyrene and Alexandria), therefore the Libertines must have been African also, all forming an African synagogue. Various explanations are given:<P>(a) They were inhabitants of Libertum, a town in Africa proper: an "Episcopus Ecclesiae Catholicae Libertinensis" sat in the Synod of Carthage (411 AD).<P>(b) Some emend the text; Wetstein and Blass, following the Armenian VS, conjecture Libustinon, "of the Libystines." Schulthess reads for "Libertines and Cyrenians" (Libertinon kai Kurenaion) "Libyans, those about Cyrene" (Libuon ton kata Kurenen) (compare <a onClick="return mV(\'Act\',2,10);">Ac 2:10</a>).<P>These emendations are conjectural; the manuscripts read "Libertines." It seems, therefore, that 2, (1) (c) above is the correct interpretation.``78';
isbe[5512]='Liberty`lib\'-er-ti (deror, rachabh; eleutheria): The opposite of servitude or bondage, hence, applicable to captives or slaves set free from oppression (thus deror, <a onClick="return mV(\'Lev\',25,10);">Le 25:10</a>; <a onClick="return mV(\'Isa\',61,1);">Isa 61:1</a>, etc.). Morally, the power which enslaves is sin (<a onClick="return mV(\'Jhn\',8,34);">Joh 8:34</a>), and liberty consists, not simply in external freedom, or in possession of the formal power of choice, but in deliverance from the darkening of the mind, the tyranny of sinful lusts and the enthrallment of the will, induced by a morally corrupt state. In a positive respect, it consists in the possession of holiness, with the will and ability to do what is right and good. Such liberty is possible only in a renewed condition of soul, and cannot exist apart from godliness. Even under the Old Testament godly men could boast of a measure of such liberty (<a onClick="return mV(\'Psa\',119,45);">Ps 119:45</a>, rachabh, "room," "breadth"), but it is the gospel of Christ which bestows it in its fullness, in giving a full and clear knowledge of God, discovering the way of forgiveness, supplying the highest motives to holiness and giving the Holy Spirit to destroy the power of sin and to quicken to righteousness. In implanting a new life in the soul, the gospel lifts the believer out of the sphere of external law, and gives him a sense of freedom in his new filial relation to God. Hence, the New Testament expressions about "the glorious liberty" of God\'s children (<a onClick="return mV(\'Rom\',8,21);">Ro 8:21</a> the King James Version; compare <a onClick="return mV(\'Gal\',2,4);">Ga 2:4</a>; <a onClick="return mV(\'Gal\',5,13);">5:13</a>, etc.), about liberty as resulting from the possession of the Spirit (<a onClick="return mV(\'2Cr\',3,17);">2Co 3:17</a>), about "the perfect law of liberty" (<a onClick="return mV(\'Jam\',1,25);">Jas 1:25</a>). The instrument through which this liberty is imparted is "the truth" (<a onClick="return mV(\'Jhn\',8,32);">Joh 8:32</a>). Christians are earnestly warned not to presume upon, or abuse their liberty in Christ (<a onClick="return mV(\'Gal\',5,13);">Ga 5:13</a>; <a onClick="return mV(\'1Pe\',2,16);">1Pe 2:16</a>).``132';
isbe[5513]='Libnah`lib\'-na (libhnah "whiteness," "transparency," "pavement" (compare <a onClick="return mV(\'Exd\',24,10);">Ex 24:10</a> where libhnath, is translated "paved work" or a "compact foundation"); Lebna):<P>(1) A desert camp of the Israelites between Rimmon-perez and Rissah (<a onClick="return mV(\'Num\',33,20,21);">Nu 33:20,21</a>). Probably the same as Laban (<a onClick="return mV(\'Deu\',1,1);">De 1:1</a>).<P>See <a href="./study/isbe/search.html?string=WANDERINGS+OF+ISRAEL">WANDERINGS OF ISRAEL</a>.<P>(2) A town in the Shephelah of Judah (<a onClick="return mV(\'Jos\',15,42);">Jos 15:42</a>). "Joshua passed from Makkedah, and all Israel with him, unto Libnah, and fought against Libnah: and Yahweh delivered it also, and the king thereof, into the hand of Israel....And Joshua passed from Libnah, and all Israel with him, unto Lachish, and encamped against it, and fought against it" (<a onClick="return mV(\'Jos\',10,\'29-31\');">Jos 10:29-31</a>; <a onClick="return mV(\'Jos\',12,15);">12:15</a>). It was one of the cities given to the "children of Aaron" (<a onClick="return mV(\'Jos\',21,13);">Jos 21:13</a>; <a onClick="return mV(\'1Ch\',6,57);">1Ch 6:57</a>). In the reign of Joram, Libnah joined the Edomites in a revolt against the king of Judah (<a onClick="return mV(\'2Ki\',8,22);">2Ki 8:22</a>; <a onClick="return mV(\'2Ch\',21,10);">2Ch 21:10</a>). In the reign of Hezekiah, Libnah was besieged by Sennacherib (<a onClick="return mV(\'2Ki\',19,8);">2Ki 19:8</a>; <a onClick="return mV(\'Isa\',37,8);">Isa 37:8</a>). The wife of King Josiah was "Hamutal the daughter of Jeremiah of Libnah," she was the mother of Jehoahaz and Zedekiah (<a onClick="return mV(\'2Ki\',23,31);">2Ki 23:31</a>; <a onClick="return mV(\'2Ki\',24,18);">24:18</a>; <a onClick="return mV(\'Jer\',52,1);">Jer 52:1</a>).<P>The site of this important stronghold remains unknown. In the Eusebius, Onomasticon it is described, under the name Lobana or Lobna, as near Eleutheropolis (Beit Jebrin). All the indications point to a site in the southwest of the Shephelah, not very far from Lachish. The Palestine Exploration Fund surveyors suggested (PEF, III, 259) the commanding site \'Arak el Menshiyeh, or rather the white chalky mound 250 ft. high to the north of this village, and Stanley proposed Tell es Cafi. (Both these identifications are due to the interpretation of Libnah as meaning "whiteness.") In the PEFS (1897, Sh XX) Conder suggests a ruin called el Benawy, 10 miles southeast of Lachish.``117';
isbe[5514]='Libni`lib\'-ni (libhni):<P>(1) Son of Gershon (<a onClick="return mV(\'Exd\',6,17);">Ex 6:17</a>; <a onClick="return mV(\'Num\',3,18);">Nu 3:18</a>; <a onClick="return mV(\'1Ch\',6,17,20);">1Ch 6:17,20</a>). Families who traced their descent from Libni are called Libnites (<a onClick="return mV(\'Num\',3,21);">Nu 3:21</a>; <a onClick="return mV(\'Num\',26,58);">26:58</a>).<P>(2) A son of Merari (<a onClick="return mV(\'1Ch\',6,29);">1Ch 6:29</a>).`<a href="./study/isbe/search.html?string=LADAN">LADAN</a>`1';
isbe[5515]='Libnites`lib\'-nits (ha-libhni).`<a href="./study/isbe/search.html?string=LIBNI">LIBNI</a>`1';
isbe[5516]='Libraries`li\'-bra-riz, li\'-brer-iz:<P>1. The Bible a Library<P>2. Mythological and Apocryphal Libraries<P>3. Libraries for the Dead<P>4. Memory Libraries<P>5. Prehistoric and Primitive Libraries<P>6. Mesopotamian Period<P>7. Patriarchal Period<P>8. Egyptian Period<P>9. The Exodus<P>10. Palestine at the Conquest<P>11. Period of the Judges<P>12. Saul to the Maccabees<P>13. New Testament Times<P>14. Bookcases and Buildings<P>LITERATURE<hr /><P>A library is a book or books kept for use, not for sale. A one-book library is just as much a library as a one-cell animal is animal. The earliest libraries, like the earliest plants and animals, were very simple, consisting of a few books or perhaps only a single tablet or manuscript. An archive is a library of official documents not in active use; a registry, a library of going documents.<P>1. The Bible a Library:<P>The Bible is itself a library. During the Middle Ages it was commonly called, first, "The Divine Library," and then, "The Library" (Bibliotheca), in the same exclusive sense as it is now known as "The Book" (Biblia as Latin singular). Even the word "Bible" itself is historically "Library" rather than "Book" (for it was originally the neuter plural Biblia, "The Books"; compare <a onClick="return mV(\'Dan\',9,2);">Da 9:2</a>). The Bible is also a library in that it is an organized collection of books rather than a single work.<P>This fact that the Bible is itself a library is increasingly mentioned of late, especially in Old Testament studies (Kent, Narratives of the Beginnings of Hebrew History,1,"The Old Testament as a Library"; Delitzsch, Babel and Bible,4,"the Old Testament, that small library of books of the most multifarious kind"). Its profound bearing on the theory of the composition and inspiration of the Bible (compare <a href="./study/isbe/search.html?string=BOOK">BOOK</a>) has given the fact new significance and makes an understanding of the nature of a library one of the best tools for the interpretation of the Bible in the face of modern problems. While it is not possible to elaborate this within these limits, it may be said briefly that the logical end of the application of the doctrine of evolution to books and libraries is that the Bible is, like man, the result of natural selection, and is as unique among books as man among the animals. And, whatever may be true of men, in the case of books the formation of a book-library by natural selection tends toward the elimination of error. The more numerous the individuals and the longer the period, the greater the reduction of error, so that the logical inference as to the Bible is that on purely natural grounds it may be, or is, the nearest approximation to inerrancy among books, because of its history as a library. This does not quite lead to the position that the Bible is as unique among books as Jesus Christ among men, but under the doctrine of a creative Providence, it does imply what may be called real superhuman authorship and authority.<P>2. Mythological and Apocryphal Libraries:<P>Somewhat apart from historical libraries, but closely connected with Bible study, are the alleged superhuman libraries, libraries of, or written by, the gods, libraries for the dead and apocryphal libraries. The Vedas are said to have existed as a collection even before the Creator created Himself (Manu 1 21). All religions have their book-gods—Thoth and Seshait, Apollo, Hermes, Minerva, Ida, Bridget, Soma, Brahma, Odin, Kvasir, Ygdrasil and many others. To the ancient Babylonians the whole firmament was a library of "celestial tablets." The mythological ideas often have important bearing on Biblical doctrines, e.g. the Creation, the Word, the Tree of Life, the Book of Life, the Holy Spirit. Apocryphal libraries include the library which Yahweh is alleged to have formed on the 7th day of creation on a mount east of the Garden of Eden, and other libraries ascribed to Enoch, Noah and Seth. See for this the Old Testament pseudepigrapha.<P>3. Libraries for the Dead:<P>Another class of collections of real books, written or gathered for mythological purposes, is what may be called libraries for the dead. It is well known that in most countries of antiquity, at one time or another, and among primitive people like the American Indians, in modern times, it has been the custom to bury with the dead the things which friends thought would be useful in the Elysian fields or happy hunting grounds, or on the way thither—the bow and horse of the warrior, the ushabti servants, children\'s playthings, the models of food objects, and so on. This same motive led also to the burying of books with the dead. For long periods in the history of Egypt every Egyptian of any position was buried with one or more books. These books were not his chance possessions, buried with him as, in some burials, all a man\'s personal belongings are, but books selected for their usefulness to him after death. For the most part these were of the nature of guidebooks to the way to the heavenly world, magic formulas for the opening of doors, instruction as to the right method of progress toward, or introduction into, paradise, etc. These books were afterward gathered together and form what is now known as "the Book of the Dead" and other such books.<P>4. Memory Libraries:<P>In modern times the actor or professional story-teller often has in memory a collection of remembered books which is in effect a library. Among primitive peoples the medicine-man was literally a library of tribal traditions. The priests of India and the minstrels of Greece or of the Middle Ages often had a large repertory. By the prevailing theory of the origin of the books of the Old Testament such memory traditions, transmitted orally, were the chief source of the Hexateuch, but in view of what is now known of the library situation of the time, this must be doubted.<P>5. Prehistoric and Primitive Libraries:<P>In general terms it may be said that when man began not only to make but to keep records, libraries began. Even a memorial stone contains the germ of a mnemonic library. The primitive medicine-man\'s collection of notched message sticks, tallies, quipus or wampum belts is a great advance in complexity on these, and the simplest collection of picture narratives of Hottentot or American Indian, an advance on this. A combination of pictures with signs is still another forward step, and this step is already to be found in the Pyrenean caves of the Stone Age (see <a href="./study/isbe/search.html?string=WRITING">WRITING</a>). Most of these earliest libraries were kept at the sanctuary. The gathering together of books in libraries had its origin in the ideas of<P>(1) preservation,<P>(2) gathering together like books in order to join together their contents, and<P>(3) circulation—the great modern expansion of the idea.<P>The owner of flocks and herds gathers together his lists of cattle or other possessions, his receipts for purchases and record of sales, whether these are recorded on the walls of his cave or on wooden tallies or on knotted cords or on clay tablets gathered in little jars and buried under the floor of his house. Large owners and sovereigns and the temples of Egypt and Assyria gathered large stores of these archival records and with them records of tribute, oracles, etc. As early as 2700 BC we have the account of King Dedkere Isesi, his archival library and his librarian Senezemib. The annals of Thutmose III were preserved in the palace library as well as cut in selections on the walls of the temple. A few years later, and we know that the archival records were kept in a special room in the palace at Amarna—and many of the records themselves were found there. All this was before the year 1300.<P>6. Mesopotamian Period:<P>Bible history through <a onClick="return mV(\'Gen\',10,\'1-\');">Genesis 10</a> covers the whole civilized world, but its main line up to about 2000 BC is almost wholly Mesopotamian. Up to the time of Abram\'s migration from Haran, the history of Biblical libraries and the history of Babylonian and Sumerian libraries are one. Most of the cities mentioned in this period are now known to have had collections of books in those days. At the time when Abram left Haran there were hundreds of collections of written documents in scores of different geographical localities and containing millions of tablets.<P>7. Patriarchal Period:<P>From Abram\'s emigration out of Haran to Jacob\'s emigration to Egypt was, on the face of Biblical data, mainly a time of wandering in Palestine, but this was not wholly nomad nor wholly Palestinian. Whether there were libraries in Palestine at this time or not, the Patriarchs were all in close personal contact with the library lands of Babylonia and Egypt. Abram himself was familiar with both Mesopotamia and Egypt. His son Ishmael married an Egyptian, his son Isaac a Mesopotamian. His grandson Jacob married two wives from between the rivers, and had himself 20 years\' residence in the region. While it does not appear that Isaac lived at any time either in Syria or in Egypt, during most of his life all the members of his nearest family, father, mother, wife, sons\' wives, had had from one to three score years\' life in the mother-country. Whether there were public records in this region at this time is another matter, but it would seem that the whole region during the whole period was under the influence of the Babylonian civilization. It was freely traversed by trading caravans, and the Hittite and Mesopotamian records extend at least a little back into this period.<P>8. Egyptian Period:<P>The Egyptian period of Bible history begins with the immigration of Jacob and his sons, but fringes back to the visit of Abram (<a onClick="return mV(\'Gen\',12,\'10-20\');">Ge 12:10-20</a>), if not to Mizraim of <a onClick="return mV(\'Gen\',10,6);">Ge 10:6</a>. On the other hand, it ends properly with the exodus, but fringes forward through frequent points of contact to the flight of the Virgin and Pentecost. Whether the sojourn was 430 or 215 years, or less, it was a long residence at a time when libraries were very flourishing in Egypt. Already at the time of Abram\'s visit, collections of books, not only of official accounts, but of religious texts, medical texts, annals, and the like, had been common in Egypt for nearly 1,000 years, and had perhaps existed for 1,000 years or more before that.<P>Under the older of the modern datings of the exodus, the period of the sojourn included the times of Thothmes III (Thutmose), and in this reign there are peculiarly interesting records, not only of the existence of temple and palace libraries, but of the nature of their contents. The official recorder of Thothmes III, accompanying him on his campaign in Syria and Palestine, set down each day the events of the day, while he or others also made lists of tribute, spoils, commissary matters, etc. These daily records were deposited in the palace library, as it appears, but a narrative compiled from these and written on a leather roll was deposited in the temple library, and from this roll in turn an abstract was engraved on the walls of the temple, where it remains to this day. This probably gives the library situation of the time in a nutshell:<P>(1) the simple saving of utilitarian documents, often on papyrus or wood tablets,<P>(2) the gathering of books written for information on more durable material,<P>(3) preserving choice books for posterity by a local series of inscriptions.<P>The rolls must have been kept in chests or small boxes, like the box containing the medical papyri of King Neferikere some 1,300 years before, or the "many boxes" at Edfu long after. Many pictures of these book-chests or bookcases are found in the monuments (Birt, Buchrolle, 12, 15ff).<P>Again, the palace library of King Akhnaton (circa 1360 BC) at Amarna, which contained collections of the royal foreign correspondence on clay tablets, has been excavated. Its bricks bear the inscription, "Place of the records of the palace of the king," and some hundreds of tablets from this spot have been recovered.<P>At the time of the exodus there were thus probably libraries in all palaces, temples and record offices, although the temple libraries were by no means confined to sacred writings or the palace to secular. There were also at least archives, or registers, in the royal treasury and in all public departments. Schools for scribes were, it would seem, held in the palace, temple and treasury libraries. There were, therefore, apparently, at this time millions of documents or books, in hundreds of organized collections, which could be called archives or libraries.<P>9. The Exodus:<P>Supposing any exodus at all, Moses and Aaron and all the Hebrew "officers" ("scribes" or writers) under the Egyptian taskmasters (<a onClick="return mV(\'Exd\',5,6,10,14,15,19);">Ex 5:6,10,14,15,19</a>), brought up as they were in the scribal schools, were of course quite familiar with the Egyptian ways of keeping their books. It is not surprising, therefore, to find the first and chief provision which Moses made for the Tabernacle was a book-chest for the preservation of the sacred directions given by Yahweh. It makes little difference whether the account is taken in its final form, divided horizontally into Exodus, Leviticus, Numbers, Deuteronomy and Joshua, or divided perpendicularly into J, E, D, the Priestly Code (P), the fact of the ark and enough of its details are given even in the very oldest sources to show that the authors understood the ark to be a glorified book-chest in or near which were kept written documents: the tables of stone, the inscribed rod, all the testimony given from the mercy-seat which formed its lid, and perhaps the Book of Deuteronomy. The ark is in fact much the size and shape of a portable bookcase, and the Septuagint translation renders the word by the ordinary technical Greek word for the book-chest (kibotos; compare Birt, op. cit., 248-49). It appears also to have been the later Hebrew word for book-chest (compare Jewish Encyclopedia, II, 107ff). At the exodus, whenever that may have been, Moses is alleged to have made the ark the official library, and in it apparently he is thought to have kept the oracles as uttered from time to time and the record of his travels from day to day (as well as the tables of stone), precisely as the scribe of Thutmose recorded his Syrian campaigns from day to day. This record (if it was a record) was in all likelihood on a leather roll, since this became the traditional form of books among the Hebrews, and this too was like the annals of Thutmose. When the tribes separated to north and south, the books may have been either separated or copied, and doubtless they suffered much wear and tear from the harsh times until we find Deuteronomy turning up again in a temple library (<a onClick="return mV(\'2Ki\',22,8);">2Ki 22:8</a>ff; <a onClick="return mV(\'2Ch\',34,14);">2Ch 34:14</a>).<P>The evidence from Egyptian Babylonian, Mitannian, Amorite and Hittite documents shows the existence of official chanceries and by implication of archives throughout the whole region of Syria and Palestine at the time when the "Hebrew" invasion began (Winckler, Tell el-Amarna Tablets).<P>10. Palestine at the Conquest:<P>The Tell el-Amarna Letters and the tablets from the Hittite archives at Boghaz-keui (Winckler, Deutsche Orientalische Gesellschaft Mitt.,1907,<span class="noTag">number 35</span>) include actual letters from the princes, elders and governors of dozens of places, scattered all over this region from Egypt to the land of the Hittites and the Mitannians. These places include among others Jerusalem, Damascus, Tyre, Sidon, Acco, Ashkelon, Gaza, Lachish, Keilah and Aijalon.<P>Remains of two of such archival libraries have been dug up—one at Lachish and one at Taanach near Megiddo, both dating back to the 14th century BC.<P>Whether there were temple libraries as well does not appear so clearly from external evidence but may probably be inferred from the names, Debir and (perhaps) Nebo, as well as from the well-known fact that each of the many city-lands must have had its center of worship. When it was thought that writing did not exist to any extent in Palestine before the time of David, it was the fashion to account for the name of the city of "Kirjath Sepher," the "City of Books," by curious tours de force of conjectural emendation (Sephur for Sepher, Tabor for Debir), but with the recent progress of excavation the possibility of the name has been fully established and the insight of Sayce probably justified.<P>11. Period of the Judges:<P>That the situation at the Conquest continued also during the period of the Judges appears from sundry considerations:<P>(1) The fact that all the surrounding nations, Moabites, Edomites, Amorites, Hittites, Mitannians, etc., were literate nations with public archives.<P>(2) The high state of organization under David requires an evolutionary background.<P>(3) Even the extreme (and quite untenable) theory that the Hebrews were illiterate wild Arab nomads and remained so for a long time would actually demonstrate the matter, for, as has been pertinently observed (Sellin, Einl, 7), many at least of the Canaanite cities were not destroyed or even occupied for a long time, but were surrounded by the Hebrews, and finally occupied and assimilated. It follows, therefore, that the archival system continued, and, under this theory, for a long time, until the Hebrews absorbed the culture of their neighbors—and, by inference, libraries with the rest.<P>(4) Taking the evidence of the documents as they stand, the matter is simple enough; various works were kept in or near the ark. Joshua added to these at least the report of a boundary commission (<a onClick="return mV(\'Jos\',18,9,10);">Jos 18:9,10</a>) which was brought to the sanctuary, and Samuel "laid up" the book that he wrote "before Yahweh," i.e. at the ark. Moreover, the Books of Jasher, the Wars of Yahweh, etc., imply a literature which in turn implies libraries. Whenever or however composed, there is no good reason to distrust their historical existence.<P>(5) Even on the extreme critical hypothesis, "Most of the stories found in the first 8 books of the Old Testament originated before or during the age of song and story (circa 1250-1050)" (Kent, Beginnings, 17).<P>(6) To this may also be added, with all reservations, the mysterious metal ephod which appears only in this period. The ephod seems to have been either<P>(a) a case (BDB, 66) or<P>(b) an instrument for consulting an oracle (BDB, 65). The linen ephod had a pouch for the Urim and Thummim. The metal ephod seems to be distinguished from the image and may have contained the written oracular instructions (torah?) as well as the oracular instruments.<P>(7) The Kenite scribes of Jabez (<a onClick="return mV(\'1Ch\',2,55);">1Ch 2:55</a>); the simple fact that a chance captive from Succoth could write out a list of names and some one at least of the rudest 300 survivals of Gideon\'s 32,000 primitive warriors in those bloody frontier times could read it, the reference to the staff of the muster-master, marshal or scribe, and the "governors" (inscribers), in Deborah\'s Song, point in the same direction.<P>While, therefore, the times were doubtless wild, the political unity very slight, and the unity of worship even less, there is evidence that there were both political and religious libraries throughout the period.<P>12. Saul to the Maccabees:<P>Beginning with the monarchy, the library situation among the Israelites appears more and more clearly to correspond with that of the surrounding nations. The first act the recorded after the choice and proclamation of Saul as king was the writing of a constitution by Samuel and the depositing of this in the sacred archives (<a onClick="return mV(\'1Sa\',10,25);">1Sa 10:25</a>). This document Septuagint biblion) was perhaps one of the documents ("words") of Samuel whose words (<a onClick="return mV(\'1Ch\',29,29);">1Ch 29:29</a>, history, chronicles, acts, book, etc.) seem to have been possibly a register kept by him, perhaps from the time that he succeeded Eli, as later the high-priestly register (day-book) of Johannes Maccabeus was certainly kept from the beginning of his high-priesthood (1Macc 16:24).<P>Whether these "words" of Samuel were equivalent to the technical register or "book of the words of days" or not, such registers were undoubtedly kept from the time of David on, and there is nothing so illuminating as to the actual library conditions of the times as the so-called chronicles, histories or acts—the registers, journals or archives of the time. The roll-register seems to be called in full "the book of the words of days," or with explanatory fullness "book of the records of the words of days," but this appears to be an evolution from "words of days" or even "words," and these forms as well as the abbreviations "book of days" and "book" are used of the same technical work, which is the engrossing in chronological book-form of any series of individual documents—all the documents of a record-office, general or local. The name is used also of histories written up on the basis of these register-books (the Books of Chronicles are in Hebrew, "words of days") but not themselves records. These charter-books, of course, so far as they go, mirror the contents of the archives which they transcribe, and the key to the public-library history of the period, both sacred and royal, as regards contents, at least, is to be found in them, while in turn the key to the understanding of this technical book-form itself lies in the understanding of the "word" as a technical book-form.<P>The "word" in Hebrew is used of books, speeches, sayings, oracles, edicts, reports, formal opinions, agreements, indictments, judicial decisions, stories, records, regulations, sections of a discourse, lines of poetry, whole poems, etc., as well as acts, deeds, "matters," "affairs," events and words in the narrowest sense. It is thus very exactly, as well as literally, translated in the Septuagint by logos, which as a technical book-term (Birt, Antikes Buchwesen, 28, 29) means any distinct composition, long or short, whether a law, an epigram, or a whole complex work. The best English equivalent for this "work-complete-in-itself," in the case of public records, is "document," and in the case of literary matters, it is "work or writing." The "words" of Samuel or David thus are his "acts" or "deeds" in the sense, not of doings, but of the individual documentary records of those doings quite in the modern sense of the "acts and proceedings" of a convention, or the "deeds" to property.<P>In the plural, dibhre and logoi or logia alike mean a collection of documents, works or writings, i.e. "a library." Sometimes this is used in the sense of archives or library, at other times as a book containing these collected works.<P>These collected documents in register-form constituted apparently a continuous series until the time when the Book of Chronicles was written and were extant at that time: the "words" of Samuel, "chronicles" and "last words" of David (<a onClick="return mV(\'1Ch\',23,27);">1Ch 23:27</a>; <a onClick="return mV(\'1Ch\',27,24);">27:24</a>), the "book of the words (acts) of Solomon" (<a onClick="return mV(\'1Ki\',11,41);">1Ki 11:41</a>), the book of the words of days of the kings of Judah, and the book of the words of days of the kings of Israel—the kingdoms after division each having naturally its own records.<P>The general situation during the period as to archival matters is pretty well summarized by Moore in the EB. From the time of Solomon, and more doubtfully from the time of David, he recognizes that "records were doubtless kept in the palace," and that "the temples also doubtless had their records," while there may have been also local records of cities and towns. These records contained probably chief events, treaties, edicts, etc.—probably brief annals "never wrought into narrative memoirs." The temple records contained annals of succession, repairs, changes, etc. (EB, II, 2021-28). The records were, however, probably not brief, but contained treaties, etc., verbatim in full. To this should moreover be added the significant fact that these archives contained not only business records but also various works of a more or less literary character. Those mentioned include letters, prophecies, prayers, and even poems and Wisdom literature. The "words" of the kings of Israel contained prayers, visions and other matter not usually counted archival. The "acts" (words) of Solomon also contained literary or quasi-literary material. According to Josephus the archives of Tyre contained similar material and this was also true of the Amarna archives (circa 1380 BC) and those at Boghazkeui, as well as of the palace archives of Nineveh and the great temple archives of Nippur and Abu Habeh (Sippara). So, too, in Egypt the palace archives of King Neferikere contained medical works and those of Rameses III, at least, magical works, while the temple archives in the time of Thutmose III (Breasted, Ancient Records) contained military annals, and those of Denderah certainly many works of a non-registerial character. The temples of early Greece also contained literary works and secular laws as well as temple archives proper.<P>In short, the palace collections of Israel were no exception to the general rule of antiquity in containing, besides palace archives proper, more or less of religious archives and literary works, while the temple collections contained more or less political records and literary works.<P>This record system in Israel and Judah, as appears from the Old Testament itself, was the system of Persia in Old Testament times. It was the system of the Jews in Maccabean times, of Egypt during this whole period and for centuries before and after, and of Northern Syria likewise at about this time (Zakar-Baal, of Gebal, circa 1113 BC). The Books of Exodus, Leviticus, Numbers and Deuteronomy, whenever written, reveal the same system, Exodus to Numbers being in the form of a register, and Deuteronomy represented as an abstract prepared for engraving on stone, a use which Joshua is said to have made of it. We have, therefore, the same system existing before and after and on all sides geographically.<P>All this neighboring practice points to a system of<P>(1) archival collections,<P>(2) contemporary book registers,<P>(3) contemporary publication by inscription, and, in the light of these, the Old Testament method, from the time of David at least, becomes clear, certainly as to archival collections and registers and hardly less so as to the setting-up of inscriptions in permanent material. Even if D is not earlier than 621 BC, it assumes public inscription long before that time, quite comparable in extent to the inscriptions of Thutmose III or King Mesha of Moab, and, although few long inscriptions have been recovered thus far, there is at least the Siloam inscription (compare also <a onClick="return mV(\'Isa\',30,8);">Isa 30:8</a>; <a onClick="return mV(\'Job\',19,23,24);">Job 19:23,24</a>; <a onClick="return mV(\'Isa\',8,1);">Isa 8:1</a>; <a onClick="return mV(\'Jer\',17,1);">Jer 17:1</a>; also the Decalogue). Each one of these three elements (even the collection of inscriptions in the temple) was, it must be remembered, called in antiquity a "library."<P>The reference to "the books" in Dan (<a onClick="return mV(\'Dan\',9,2);">9:2</a>) may possibly point to or foreshadow the synagogue library.<P>Little weight is generally and properly given to the statement of 2Macc 2:13, that Nehemiah founded a library and gathered into it the writings "about the kings, the prophets and David, and the letters of the kings concerning votive offerings," but it is, as a matter of fact, evident that he, as well as Judas Maccabeus, who is linked with him in the statement, must have done just this.<P>From the time of the Septuagint translated, the idea of the library (bibliotheke) and even the public library ("books of the people," i.e. public records) was familiar enough, the Septuagint itself also, according to Josephus, linking the temple library of Jerusalem with the Alexandrian library through the furnishing of books by the former to the latter for copying.<P>13. New Testament Times:<P>With the Roman conquest and the rise of the Idumeans, naturally the methods developed in accordance with Roman practice. It appears from the frequent references of Josephus that the public records were extensive and contained genealogical records as well as official letters, decrees, etc. The triple method of record continues. It appears, further (Blau, 96; Krauss, III, 179), that there were libraries and even lending libraries in the schools and synagogues, not of Palestine only, but wherever Jews were settled. Josephus and Chrysostom with the Mishna confirm the already very clear inference from Luke\'s account of our Lord\'s teaching in the synagogue that at this time, and probably from the beginning of the synagogue, the books, the manner of their keeping and the ritual of their using were already essentially as in the modern synagogue. The first preaching-places of the Christians were the synagogues, and when churches succeeded these, the church library naturally followed, but whether in Bible times or not is a matter of conjecture; they appear at least in very early churches.<P>Whether the rich secular literature to which Josephus had access was in public or private libraries does not appear directly. It is well known that it was as much a part of Roman public policy in Herod\'s time to found public libraries in the provinces as it was to restore temples. Twenty-four such provincial libraries, chiefly temple libraries, are known.<P>The Roman practice of the time still mixed literary with the archival material, and it is likely therefore that the public records of the Jewish temple had in them both Greek and Latin secular books in considerable quantity, as well as the Greek Apocrypha and a large amount of Aramaic or late Hebrew literature of Talmudic character.<P>14. Bookcases and Buildings:<P>As to the receptacles and places in which the books were kept, we have reference even in the Hebrew period to most of the main forms used among the nations: the wooden box, the clay box or pot, the pouch, and on the other hand, once, the "house of books" so familiar in Egyptian use and apparently referring to an individual chamber or semi-detached building of temple or palace. Most significant, however, is the statement that the books were kept in the palace and temple treasuries or storehouses.<P>The sacred ark (\'aron), whatever it may have originally contained, was looked on when D was written as a sacred wooden book-chest, and the ark in which the teaching priests carried the law about for public reading was in fact likewise a chest.<P>Such chests were common among the Jews later, some with lids and some with side-opening (Jewish Encyclopedia, II, 107-108; Blau, 178). It is tempting to find in D, where the book is to be put "by (the King James Version "in") the side of the ark" (<a onClick="return mV(\'Deu\',31,26);">De 31:26</a>), a chest having both lid and openings in the side, but more likely perhaps D means a separate chest, like the coffer or pouch with the golden mice, which was also put "by the side" (matstsadh) of the ark (<a onClick="return mV(\'1Sa\',6,8);">1Sa 6:8</a>).<P>In the New Testament the "cloak" which Paul left behind at Troas (<a onClick="return mV(\'2Ti\',4,13);">2Ti 4:13</a>) was probably (Wattenb., 614; see also Birt and Gardthausen), if not a wooden "capsa," at least some sort of bookcase or cover.<P>The earthen vessel in which Jeremiah (<a onClick="return mV(\'Jer\',32,14);">32:14</a>) puts the two "books" (translated "deeds"), one sealed and one unsealed, was one of the commonest bookcases of the ancient world. This information has lately been widely reinforced and associated with Biblical history by the discovery of the Elephantine papyri, which were, for the most part, kept in such clay jars (Meyer, Papyrusfund, 15). The word Pentateuch perhaps harks back to a five-roll jar, but more likely to a basket or wooden box with five compartments (Blau, 65; Birt, Buchrolle, 21, 22). It was the collective label of a five-roll case, whether of earthenware, wood or basket work.<P>The pouch or bag bookcase has perhaps its representative in the phylactery (<a onClick="return mV(\'Mat\',23,5);">Mt 23:5</a>), which was a sort of miniature armarium in that each of the four little rolls of its four compartments was technically a "book" (cepher). This name is commonly explained as an amulet guarding against evil spirits, but the term actually occurs in the papyri (Bibliophylax) of the preservation of books.<P>The "house of books" (<a onClick="return mV(\'Ezr\',6,1);">Ezr 6:1</a> margin) or "place of books" is a very close parallel to bibliotheke, by which (in the plural) it is translated in the Septuagint. The phrase was a common term in Egypt for library, perhaps also sometimes for scriptorium or even registry, and it points to a chamber or semi-detached room or building where the book-chests, jars, etc., were kept. That at Edfu is a semi-detached room and contained many such cases.<P>While there is little record of libraries in Biblical times, the very formation of the Canon itself, whether by the higher critical process, or by natural processes of gathering whole literary works, implies the gathering together of books, and the temple libraries common to both Egypt and Assyria-Babylonia are almost inevitably implied wherever there was a temple or sanctuary, whatever may be the facts as to the temple libraries. According to Hilprecht there were certainly such libraries and from very ancient times. The palace library of Assurbani-pal, though itself a discovery of the last times, brings the story down to the times of the written history. For the rest of the story see literature below, especially Dziatzko, Bibliotheken, and the article on "Libraries" in the Encyclopedia Britannica (11th edition).<P>See also <a href="./study/isbe/search.html?string=NINEVEH,+LIBRARY+OF">NINEVEH, LIBRARY OF</a>.<P>In the earlier period at least and including for the Jews the New Testament times, the particular locality in palace or temple seems to have been the treasury. In the Book of Ezra, search for the decree of Cyrus was to be made in the king\'s treasure-house (<a onClick="return mV(\'Ezr\',5,17);">Ezr 5:17</a>), and was made in the "house of books where the treasures were laid up" (<a onClick="return mV(\'Ezr\',6,1);">Ezr 6:1</a> margin). The document was finally found in the palace at Ecbatana—so too in 1Macc 14:49 the archives are placed in the treasury.<P>In New Testament times there had already been a good deal of development in the matter of library buildings. A general type had been evolved which consisted of<P>(1) a colonnade,<P>(2) a lecture-room, a reading-room or assembly room,<P>(3) small rooms for book storage.<P>Such accounts as we have of the Alexandrian libraries, with the excavations at Pergamus, Athens and Rome, reveal the same type—the book-rooms, the colonnade where masters walked or sat and talked with their pupils, the rooms for assembly where the senate or other bodies sometimes sat. In short, as long before in Egypt, whether in palace or temple, the place of teaching was the place of books.<P>It is significant thus that our Lord taught in the Treasury, which in Herod\'s Temple was in the court of the temple proper—probably the porticos under the women\'s gallery, some of the adjoining rooms being used for books. As this was within the barrier which no Gentile could pass, Herod must have had also a library of public records in the outer colonnade.<P>See further, <a href="./study/isbe/search.html?string=NINEVEH,+LIBRARY+OF">NINEVEH, LIBRARY OF</a>.<P>LITERATURE.<P>Ludwig Blau, Studien zum althebraischen Buchwesen, Strassburg i, E,1902,178-80: Sam. Krauss, Talmudische Archaologie, Leipzig,1912,III, 193-98; J.W. Clark, Care of Books, Cambridge, 1901; E. C. Richardson, Biblical Libraries: A Sketch of Library History from 3400 BC to 150 AD. London. Oxford University Press, 1914.<P>See the literature under <a href="./study/isbe/search.html?string=WRITING">WRITING</a>.``147';
