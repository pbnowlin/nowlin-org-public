isbe[5518]='Libya; Libyans`lib\'-i-a, lib\'-i-anz: In the Old Testament the word occurs in the King James Version in <a onClick="return mV(\'2Ch\',12,3);">2Ch 12:3</a>; <a onClick="return mV(\'2Ch\',16,8);">16:8</a>; <a onClick="return mV(\'Nah\',3,9);">Na 3:9</a> for "Lubim" (thus the Revised Version (British and American)). the Revised Version (British and American), however, retains "Libyans" in <a onClick="return mV(\'Dan\',11,43);">Da 11:43</a>. In <a onClick="return mV(\'Jer\',46,9);">Jer 46:9</a>; <a onClick="return mV(\'Eze\',30,5);">Eze 30:5</a>; <a onClick="return mV(\'Eze\',38,5);">38:5</a>, the words are replaced in the Revised Version (British and American) by <a href="./study/isbe/search.html?string=PUT">PUT</a> (which see). In the New Testament the word "Libya" (Libue) occurs, in close connection with <a href="./study/isbe/search.html?string=CYRENE">CYRENE</a> (which see) (<a onClick="return mV(\'Act\',2,10);">Ac 2:10</a>). Greek and Roman writers apply the term to the African continent, generally excluding Egypt.`<a href="./study/isbe/search.html?string=LUBIM">LUBIM</a>`1';
isbe[5519]='Lice`lis (kinnim (<a onClick="return mV(\'Exd\',8,17,18);">Ex 8:17,18</a>; <a onClick="return mV(\'Psa\',105,31);">Ps 105:31</a>), kinnim (<a onClick="return mV(\'Exd\',8,16);">Ex 8:16</a>), kinnam (<a onClick="return mV(\'Exd\',8,17,18);">Ex 8:17,18</a>); Septuagint skniphes (<a onClick="return mV(\'Exd\',8,16,18);">Ex 8:16,18</a>), ton sknipha, once in <a onClick="return mV(\'Exd\',8,18);">Ex 8:18</a>; sknipes (<a onClick="return mV(\'Psa\',105,31);">Ps 105:31</a>); Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) scniphes; according to Liddell and Scott, under the word sknips, Slav. sknipa equals culex): The references, both in Exodus and in Psalms, are all to the plague of "lice." the Revised Version margin suggests "fleas" or "sandflies." The Septuagint rendering would favor "sandflies" or "mosquitoes," between which two insects the Old Testament writers would hardly be expected to discriminate. Mosquitoes belong to the order of Diptera, family Culicidae; the sandfly (Plebotomus papataci) to the family of Simuliidae of the same order. The sandflies are much smaller than mosquitoes, and are nearly noiseless, but give a sharp sting which may leave an unpleasant irritation. They are abundant in the Levant. In Southern Europe they cause the "three-day fever" or "papataci." As stated under <a href="./study/isbe/search.html?string=GNAT">GNAT</a> (which see), there is little ground other than the authority of the Septuagint for deciding between "lice," "fleas," "sand-flies," or "mosquitoes" as translations of kinnim. See also under <a href="./study/isbe/search.html?string=GNAT">GNAT</a> the note on ken, the Revised Version margin "gnat" (<a onClick="return mV(\'Isa\',51,6);">Isa 51:6</a>).``37';
isbe[5520]='Licence`li\'-sens: This word is not found at all in the Revised Version (British and American) (except in Judith 11:14; Ecclesiasticus 15:20; 1Macc 1:13), and twice only in the King James Version (except in 2Macc 4:9), both times in Acts. In <a onClick="return mV(\'Act\',21,40);">Ac 21:40</a> (as translation of epitrepo) the American Standard Revised Version has "leave" where the King James Version has "licence." In <a onClick="return mV(\'Act\',25,16);">Ac 25:16</a>, "opportunity to make his defense" (as translation of topon apologias) takes the place of "have licence to answer for himself."``1';
isbe[5521]='Lidebir`lid\'-e-ber (lidhebhir): For "of Debir" in EV; the Revised Version margin suggests the name "Lidebir" (<a onClick="return mV(\'Jos\',13,26);">Jos 13:26</a>), a city in the territory of Gad. It is probably identical with <a href="./study/isbe/search.html?string=LO-DEBAR">LO-DEBAR</a> (which see).``1';
isbe[5522]='Lie; Lying`li, (sheqer (usually, e.g. <a onClick="return mV(\'Isa\',9,15);">Isa 9:15</a>; <a onClick="return mV(\'Zec\',13,3);">Zec 13:3</a>), or kazabh verb (<a onClick="return mV(\'Job\',34,6);">Job 34:6</a>; <a onClick="return mV(\'Mic\',2,11);">Mic 2:11</a>); pseudos (<a onClick="return mV(\'Jhn\',8,44);">Joh 8:44</a>; <a onClick="return mV(\'Rev\',21,27);">Re 21:27</a>), "to speak falsely," "to fabricate," "to make a false statement"; pseudomai, in <a onClick="return mV(\'Act\',5,3,4);">Ac 5:3,4</a>):<P>1. Lying Defined:<P>In its very essence, a lie is something said with intent to deceive. It is not always a spoken word that is a lie, for a life lived under false pretenses, a hypocritical life, may be a lie equally with a false word (<a onClick="return mV(\'Jer\',23,14);">Jer 23:14</a>). A vain thing, like an idol, may be a lie (<a onClick="return mV(\'Isa\',59,4);">Isa 59:4</a>), as also a false system (<a onClick="return mV(\'Rom\',3,7);">Ro 3:7</a>). Error, as opposed to truth, is a lie (<a onClick="return mV(\'1Jo\',2,21);">1Joh 2:21</a>). The denial of the deity of Jesus Christ is regarded as "the" lie (<a onClick="return mV(\'1Jo\',2,22);">1Joh 2:22</a>).<P>The origin of lies and lying is traced to Satan who is called "a liar, and the father thereof" (<a onClick="return mV(\'Jhn\',8,44);">Joh 8:44</a>; <a onClick="return mV(\'Act\',5,3);">Ac 5:3</a>). Satan\'s dealing with Eve (<a onClick="return mV(\'Gen\',3,\'1-\');">Ge 3</a>) furnishes us with a splendid illustration of the first lie, so far as we have any record of it.<P>2. A Racial Sin:<P>The whole race is guilty of this sin: "The wicked are estranged from the womb: they go astray as soon as they are born, speaking lies" (<a onClick="return mV(\'Psa\',58,3);">Ps 58:3</a>). It is a part of the old Adamic nature, "the old man" (<a onClick="return mV(\'Col\',3,9);">Col 3:9</a>), which the believer in Jesus Christ is called upon to put off. So prominent a factor is it in the experience of the race that among the condensed catalogue of sins, for the commission of which men are finally condemned, the sin of lying finds its place: "All liars shall have their part in the lake which burneth with fire and brimstone" (<a onClick="return mV(\'Rev\',21,8);">Re 21:8</a> the King James Version).<P>3. God\'s Attitude to It:<P>God\'s attitude toward this sin is strongly marked throughout both the Old Testament and New Testament. The righteous are called upon to hate lying (<a onClick="return mV(\'Pro\',13,5);">Pr 13:5</a>), to avoid it (<a onClick="return mV(\'Zep\',3,13);">Ze 3:13</a>), to respect not those who lie, and utterly reject their company (<a onClick="return mV(\'Psa\',40,4);">Ps 40:4</a>; <a onClick="return mV(\'Psa\',101,7);">101:7</a>), to pray to be delivered from it (<a onClick="return mV(\'Psa\',119,29);">Ps 119:29</a>). The wicked are said to love lying (<a onClick="return mV(\'Psa\',52,3);">Ps 52:3</a>), to delight in it (<a onClick="return mV(\'Psa\',62,4);">Ps 62:4</a>), to seek after it (<a onClick="return mV(\'Psa\',4,2);">Ps 4:2</a>), and to give heed to it (<a onClick="return mV(\'Pro\',17,4);">Pr 17:4</a>). Lying leads to worse crimes (<a onClick="return mV(\'Hsa\',4,1,2);">Ho 4:1,2</a>).<P>4. The Penalty:<P>The punishment to be meted out to liars is of the severest kind. They are positively and absolutely excluded from heaven (<a onClick="return mV(\'Rev\',21,27);">Re 21:27</a>; <a onClick="return mV(\'Rev\',22,15);">22:15</a>), and those who are guilty of this sin are cast into the lake of fire (<a onClick="return mV(\'Rev\',21,8);">Re 21:8</a>). We are reminded of the awful fate meted out to Ananias and Sapphira when they lied to God and man (<a onClick="return mV(\'Act\',5,\'1-11\');">Ac 5:1-11</a>). God will "destroy them that speak lies" (<a onClick="return mV(\'Psa\',5,6);">Ps 5:6</a>), and "he that uttereth lies shall not escape" (<a onClick="return mV(\'Pro\',19,5);">Pr 19:5</a>), yea "a sword is upon the liars" (<a onClick="return mV(\'Jer\',50,36);">Jer 50:36</a> the King James Version). The liar is thereby debarred from rendering any true and acceptable worship unto the Lord (<a onClick="return mV(\'Psa\',24,4);">Ps 24:4</a>).<P>The Scriptures abound with illustrations of lying and the results and penalties therefor. A careful study of these illustrations will reveal the subtlety of falsehood. Sometimes a lie is a half-truth, as set forth in the story of Satan\'s temptation of Eve (<a onClick="return mV(\'Gen\',3,\'1-\');">Ge 3</a>). Cain\'s lie (<a onClick="return mV(\'Gen\',4,9);">Ge 4:9</a>) was of the nature of an evasive answer to a direct question. Jacob\'s deception of his father, in order that he might inherit the blessing of the firstborn, was a barefaced and deliberate lie (<a onClick="return mV(\'Gen\',27,19);">Ge 27:19</a>). The answer which Joseph\'s brethren gave to their father when he asked them concerning the welfare of their brother Joseph is an illustration, as well as a revelation, of the depth of the wickedness of hearts that deliberately set themselves to falsify and deceive (<a onClick="return mV(\'Gen\',37,31,32);">Ge 37:31,32</a>). Even good men are sometimes overtaken in a lie, which, of course, is no more excusable in them than in the wicked; indeed, it is more shameful because the righteous are professed followers of the truth (David in <a onClick="return mV(\'1Sa\',21,2);">1Sa 21:2</a>). What more striking example of the heinousness of lying in the sight of God can we have than the fate which befell Gehazi who, in order to satisfy a covetous desire for possessions, misrepresented his master Elisha to Naaman the Syrian whom the prophet had healed of his leprosy: "The leprosy therefore of Naaman shall cleave unto thee, and unto thy seed for ever. And he went out from his presence a leper as white as snow" (<a onClick="return mV(\'2Ki\',5,\'22-27\');">2Ki 5:22-27</a>)? The story of Peter\'s denial of his Lord, and his persistent asseverations that he did not know Him and was not one of His followers, makes us shudder to think that it is possible for a follower of Christ so far to forget himself as not only to lie, but buttress lying with swearing (<a onClick="return mV(\'Mat\',26,72);">Mt 26:72</a>).<P>5. Pseudos United with Other Words:<P>Throughout the Scriptures we find pseudos joined to other words, e.g. "false apostles" (pseudapostolos, <a onClick="return mV(\'2Cr\',11,13);">2Co 11:13</a>), so called probably because a true apostle delivers the message of another, namely, God, while these "false apostles" cared only for self. Such are from Satan, and, like him, they transform themselves into angels of light, and sail under false colors. We read also of "false prophets" (pseudoprophetes, <a onClick="return mV(\'Mat\',7,15);">Mt 7:15</a>; compare <a onClick="return mV(\'Jer\',23,16);">Jer 23:16</a>f), thereby meaning those who falsely claim to bring messages from God and to speak in behalf of God. Mention is made also of "false brethren" (pseudadelphos, <a onClick="return mV(\'2Cr\',11,26);">2Co 11:26</a>), meaning Judaizing teachers, as in <a onClick="return mV(\'Gal\',2,4);">Ga 2:4</a>; "false teachers" (pseudodidaskalos, <a onClick="return mV(\'2Pe\',2,1);">2Pe 2:1</a>), men whose teaching was false and who falsely claimed the teacher\'s office. We read further of "false witnesses" (pseudomartus, <a onClick="return mV(\'Mat\',26,60);">Mt 26:60</a>); by such are meant those who swear falsely, and testify to what they know is not true. So, too, we find mention of the "false Christs" (pseudochristoi, <a onClick="return mV(\'Mat\',24,24);">Mt 24:24</a>; <a onClick="return mV(\'Mar\',13,22);">Mr 13:22</a>). This personage does not so much deny the existence of a Christ, but rather, on the contrary, builds upon the world\'s expectations of such a person, and falsely, arrogantly, blasphemously asserts they he is the Christ promised and foretold. It is the Antichrist who denies that there is a Christ; the false Christ affirms himself to be the Christ. Of course there is a sense in which the man of sin will be both Antichrist and a false Christ.`<a href="./study/isbe/search.html?string=FALSE,+FALSE+SWEARING,+FALSE+WITNESS">FALSE, FALSE SWEARING, FALSE WITNESS</a>; <a href="./study/isbe/search.html?string=FALSE,+CHRISTS">FALSE, CHRISTS</a>; <a href="./study/isbe/search.html?string=FALSE+PROPHETS">FALSE PROPHETS</a>`53';
isbe[5523]='Liers-In-Wait`li-erz-in-wat\' (<a onClick="return mV(\'Jdg\',9,25);">Jud 9:25</a>; <a onClick="return mV(\'Jdg\',16,12);">16:12</a>; <a onClick="return mV(\'Jdg\',20,36);">20:36</a>).`<a href="./study/isbe/search.html?string=AMBUSH">AMBUSH</a>`1';
isbe[5524]='Lieutenant`lu-ten\'-ant, lef-ten\'-ant.`<a href="./study/isbe/search.html?string=SATRAPS">SATRAPS</a>`1';
isbe[5525]='Life`lif (chayyim, nephesh, ruach, chayah; zoe, psuche, bios, pneuma):<P><b>I. THE TERMS</b><P><b>II. THE OLD TESTAMENT TEACHING</b><P class="in15">1. Popular Use of the Term<P class="in15">2. Complexity of the Idea<P><b>III. IN THE APOCRYPHA</b><P><b>IV. IN THE NEW TESTAMENT</b><P class="in15">1. In the Synoptic Gospels<P class="in15">2. In the Fourth Gospel<P class="in15">3. In the Acts of the Apostles<P class="in15">4. In the Writings of Paul<P class="in15">5. In the Writings of John<P class="in15">6. In the Other Books of the New Testament<P><b>LITERATURE</b><hr /><P>I. The Terms.<P>Of the Hebrew terms, chayah is the verb which means "to live," "to have life," or the vital principle, "to continue to live," or "to live prosperously." In the Piel it signifies "to give life, or preserve, or quicken and restore life." The Hiphil is much like the Piel. The noun hayyim generally used in the plural is an abstract noun meaning "life," i.e. the possession of the vital principle with its energies and activities. Nephesh often means "living being" or "creature." Sometimes it has the force of the reflexive "self." At other times it refers to the seat of the soul, the personality, the emotions, the appetites—passions and even mental acts. Frequently it means "life," the "seat of life," and in this way it is used about 171 times in the Old Testament, referring to the principle of vitality in both men and animals. Ruach signifies "wind," "breath," principle or source of vitality, but is never used to signify life proper.<P>II. The Old Testament Teaching.<P>1. Popular Use of the Term:<P>The term "life" is used in the Old Testament in the popular sense. It meant life in the body, the existence and activity of the man in all his parts and energies. It is the person complete, conscious and active. There is no idea of the body being a fetter or prison to the soul; the body was essential to life and the writers had no desire to be separated from it. To them the physical sphere was a necessity, and a man was living when all his activities were performed in the light of God\'s face and favor. The secret and source of life to them was relationship with God. There was nothing good or desirable apart from this relation of fellowship. To overcome or be rid of sin was necessary to life. The real center of gravity in life was in the moral and religious part of man\'s nature. This must be in fellowship with God, the source of all life and activity.<P>2. Complexity of the Idea:<P>The conception of life is very complex. Several meanings are clearly indicated:<P>(1) Very frequently it refers to the vital principle itself, apart from its manifestations (<a onClick="return mV(\'Gen\',2,7);">Ge 2:7</a>). Here it is the breath of life, or the breath from God which contained and communicated the vital principle to man and made him a nephesh or living being (see also <a onClick="return mV(\'Gen\',1,30);">Ge 1:30</a>; <a onClick="return mV(\'Gen\',6,17);">6:17</a>; <a onClick="return mV(\'Gen\',7,22);">7:22</a>; <a onClick="return mV(\'Gen\',45,5);">45:5</a>, etc.).<P>(2) It is used to denote the period of one\'s actual existence, i.e. "lifetime" (<a onClick="return mV(\'Gen\',23,1);">Ge 23:1</a>; <a onClick="return mV(\'Gen\',25,7);">25:7</a>; <a onClick="return mV(\'Gen\',47,9);">47:9</a>; <a onClick="return mV(\'Exd\',6,16,18,20);">Ex 6:16,18,20</a>, etc.).<P>(3) The life is represented as a direct gift from God, and dependent absolutely upon Him for its continuance (<a onClick="return mV(\'Gen\',1,\'11-27\');">Ge 1:11-27</a>; <a onClick="return mV(\'Gen\',2,7);">2:7</a>; <a onClick="return mV(\'Num\',16,22);">Nu 16:22</a>).<P>(4) In a few cases it refers to the conception of children, denoting the time when conception was possible (<a onClick="return mV(\'Gen\',18,10,14);">Ge 18:10,14</a> margin; <a onClick="return mV(\'2Ki\',4,16,17);">2Ki 4:16,17</a> margin).<P>(5) In many cases it refers to the totality of man\'s relationships and activities, all of which make up life (<a onClick="return mV(\'Deu\',32,47);">De 32:47</a>; <a onClick="return mV(\'1Sa\',25,29);">1Sa 25:29</a>; <a onClick="return mV(\'Job\',10,1);">Job 10:1</a>, etc.).<P>(6) In a few instances it is used synonymously with the means of sustaining life (<a onClick="return mV(\'Deu\',24,6);">De 24:6</a>; <a onClick="return mV(\'Pro\',27,27);">Pr 27:27</a>).<P>(7) Many times it is used synonymously with happiness or well-being (<a onClick="return mV(\'Deu\',30,15,19);">De 30:15,19</a>; <a onClick="return mV(\'Ezr\',6,10);">Ezr 6:10</a>; <a onClick="return mV(\'Psa\',16,11);">Ps 16:11</a>; <a onClick="return mV(\'Psa\',30,5);">30:5</a>; <a onClick="return mV(\'Pro\',2,19);">Pr 2:19</a>, and frequently).<P>(8) It is always represented as a very precious gift, and offenses against life were to be severely punished (<a onClick="return mV(\'Gen\',9,4,5);">Ge 9:4,5</a>; <a onClick="return mV(\'Lev\',17,14);">Le 17:14</a>; <a onClick="return mV(\'Lev\',24,17);">24:17</a>).<P>Capital punishment is here specifically enjoined because of the value of the life that has been taken. The lexicon talionis required life for life (<a onClick="return mV(\'Exd\',21,23);">Ex 21:23</a>; <a onClick="return mV(\'Deu\',19,21);">De 19:21</a>); and this even applies to the beast (<a onClick="return mV(\'Lev\',24,18);">Le 24:18</a>). The life was represented as abiding in the blood and therefore the blood must not be eaten, or lightly shed upon the ground (<a onClick="return mV(\'Lev\',17,15);">Le 17:15</a>; <a onClick="return mV(\'Deu\',12,23);">De 12:23</a>). The Decalogue forbids murder or the taking of human life wrongfully (<a onClick="return mV(\'Exd\',20,13);">Ex 20:13</a>; <a onClick="return mV(\'Deu\',5,17);">De 5:17</a>). Garments taken in pledge must not be kept over night, for thereby the owner\'s life might be endangered (<a onClick="return mV(\'Deu\',24,6);">De 24:6</a>). That life was considered precious appears in <a onClick="return mV(\'2Ki\',10,24);">2Ki 10:24</a>; <a onClick="return mV(\'Est\',7,7);">Es 7:7</a>; <a onClick="return mV(\'Job\',2,4);">Job 2:4</a>; <a onClick="return mV(\'Pro\',4,23);">Pr 4:23</a>; <a onClick="return mV(\'Pro\',6,26);">6:26</a>. The essence of sacrifice consisted in the fact that the life (the nephesh) resided in the blood; thus when blood was shed, life was lost (<a onClick="return mV(\'Deu\',12,23);">De 12:23</a>; <a onClick="return mV(\'Lev\',17,11);">Le 17:11</a>). Oppression on the part of judges and rulers was severely condemned because oppression was detrimental to life.<P>(9) Long life was much desired and sought by the Israelites, and under certain conditions this was possible (<a onClick="return mV(\'Psa\',91,16);">Ps 91:16</a>). The longevity of the ante-diluvian patriarchs is a problem by itself (see <a href="./study/isbe/search.html?string=ANTEDILUVIANS">ANTEDILUVIANS</a>). It was one of the greatest of calamities to be cut off in the midst of life (<a onClick="return mV(\'Isa\',38,\'10-12\');">Isa 38:10-12</a>; <a onClick="return mV(\'Isa\',53,8);">53:8</a>); that a good old age was longed for is shown by <a onClick="return mV(\'Exd\',20,12);">Ex 20:12</a>; <a onClick="return mV(\'Psa\',21,4);">Ps 21:4</a>; <a onClick="return mV(\'Psa\',34,12);">34:12</a>; <a onClick="return mV(\'Psa\',61,6);">61:6</a>, etc. This long life was possible to the obedient to parents (<a onClick="return mV(\'Exd\',20,12);">Ex 20:12</a>; <a onClick="return mV(\'Deu\',5,16);">De 5:16</a>), and to those obedient to God (<a onClick="return mV(\'Deu\',4,4);">De 4:4</a>; <a onClick="return mV(\'Pro\',3,1,2);">Pr 3:1,2</a>; <a onClick="return mV(\'Pro\',10,27);">10:27</a>); to the wise (<a onClick="return mV(\'Pro\',3,16);">Pr 3:16</a>; <a onClick="return mV(\'Pro\',9,11);">9:11</a>); to the pure in heart (<a onClick="return mV(\'Psa\',34,\'12-14\');">Ps 34:12-14</a>; <a onClick="return mV(\'Psa\',91,\'1-10\');">91:1-10</a>; <a onClick="return mV(\'Ecc\',3,12,13);">Ec 3:12,13</a>); to those who feared God (<a onClick="return mV(\'Pro\',10,27);">Pr 10:27</a>; <a onClick="return mV(\'Isa\',65,\'18-21\');">Isa 65:18-21</a>; <a onClick="return mV(\'Isa\',38,\'2-5\');">38:2-5</a>, etc.).<P>(10) The possibility of an immortal life is dimly hinted at in the earliest writing, and much more clearly taught in the later. The Tree of Life in the midst of the garden indicated a possible immortality for man upon earth (<a onClick="return mV(\'Gen\',2,9);">Ge 2:9</a>; <a onClick="return mV(\'Gen\',3,22,24);">3:22,24</a>) (see <a href="./study/isbe/search.html?string=TREE+OF+LIFE">TREE OF LIFE</a>).<P>Failing to partake of this and falling into sin by partaking of the "tree of the knowledge of good and evil," they were driven forth from the garden lest they should eat of the tree of life and become immortal beings in their sinful condition. To deprive man of the possibility of making himself immortal while sinful was a blessing to the race; immortality without holiness is a curse rather than a blessing. The way to the tree of life was henceforth guarded by the cherubim and the flame of a sword, so that men could not partake of it in their condition of sin. This, however, did not exclude the possibility of a spiritual immortality in another sphere. Enoch\'s fellowship with God led to a bodily translation; so also Elijah, and several hundred years after their deaths, God called Himself the God of Abraham and Isaac and Jacob, implying that they were really alive then. In <a onClick="return mV(\'Isa\',26,19);">Isa 26:19</a> there is a clear prophecy of a resurrection, and an end of death. <a onClick="return mV(\'Dan\',12,2);">Da 12:2</a> asserts a resurrection of many of the dead, some to everlasting life and some to shame and everlasting contempt. Some of the psalmists firmly believed in the continuity of the life in fellowship with God (<a onClick="return mV(\'Psa\',16,10,11);">Ps 16:10,11</a>; <a onClick="return mV(\'Psa\',17,15);">17:15</a>; <a onClick="return mV(\'Psa\',23,6);">23:6</a>; <a onClick="return mV(\'Psa\',49,15);">49:15</a>; <a onClick="return mV(\'Psa\',73,24,25);">73:24,25</a>). The exact meaning of some of these statements is difficult to understand, yet this much is clear: there was a revolt against death in many pious minds, and a belief that the life of fellowship with God could not end or be broken even by death itself.<P>See <a href="./study/isbe/search.html?string=IMMORTALITY">IMMORTALITY</a>.<P>(11) The fundamental fact in the possession of life was vital relationship with God. Men first lived because God breathed into them the breath of life (<a onClick="return mV(\'Gen\',2,7);">Ge 2:7</a>). Man\'s vital energies are the outflowing of the spirit or vital energies of God, and all activities are dependent upon the vitalizing power from God. When God sends forth His spirit, things are created, and live; when He withdraws that spirit they die (<a onClick="return mV(\'Psa\',104,30);">Ps 104:30</a>). "In his favor is life" (<a onClick="return mV(\'Psa\',30,5);">Ps 30:5</a> the King James Version). He is the fountain of life (<a onClick="return mV(\'Psa\',36,9);">Ps 36:9</a>; <a onClick="return mV(\'Psa\',63,3);">63:3</a>). "All my fountains are in thee" (<a onClick="return mV(\'Psa\',87,7);">Ps 87:7</a>). The secret of Job\'s success and happiness was that the Almighty was with him (<a onClick="return mV(\'Job\',29,2);">Job 29:2</a>). This fellowship brought him health, friends, prosperity and all other blessings. The consciousness of the fellowship with God led men to revolt against the idea of going to Sheol where this fellowship must cease. They felt that such a relationship could not cease, and God would take them out of Sheol.<P>III. In the Apocrypha.<P>A similar conception of life appears here as in the Old Testament. Zoe and peuche are used and occur most frequently in the books of The Wisdom of Solomon and Ecclus. In 1 and 2Esdras the word is little used; 2Esdras 3:5; 16:61 are but a quotation from <a onClick="return mV(\'Gen\',2,7);">Ge 2:7</a>, and refer to the vital principle; 2Esdras 14:30, Tobit, Judith, Ad Esther use it in the same sense also. Wisdom and Ecclesiasticus use it in several senses closely resembling the use in Proverbs (compare Ecclesiasticus 4:12; <a onClick="return mV(\'Pro\',3,18);">Pr 3:18</a>; <a onClick="return mV(\'Pro\',10,16);">10:16</a>). In general there is no additional meaning attached to the word. The Psalms of Solomon refer to everlasting life in <a onClick="return mV(\'Psa\',3,16);">3:16</A>; <a onClick="return mV(\'Psa\',13,10);">13:10</A>; <a onClick="return mV(\'Psa\',14,2,6);">14:2,6</a>.<P>IV. In the New Testament.<P>Of the Greek terms bios is used at times as the equivalent of the Hebrew chayyim. It refers to life extensively, i.e. the period of one\'s existence, a lifetime; also to the means of sustaining life, such as wealth, etc. Psuche is also equivalent to chayyim at times, but very frequently to nephesh and sometimes to ruach. Thus, it means the vital principle, a living being, the immaterial part of man, the seat of the affections, desires and appetites, etc. The term zoe corresponds very closely to chayyim, and means the vital principle, the state of one who is animate, the fullness of activities and relationship both in the physical and spiritual realms.<P>The content of the word zoe is the chief theme of the New Testament. The life is mediated by Jesus Christ. In the Old Testament this life was through fellowship with God, in the New Testament it is through Jesus Christ the Mediator. The Old Testament idea is carried to its completion, its highest development of meaning, being enriched by the supreme teaching and revelation of Jesus Christ. In the New Testament as well as in the Old Testament, the center of gravity in human life is in the moral and religious nature of man.<P>1. In the Synoptic Gospels:<P>The teaching here regarding life naturally links itself with Old Testament ideas and the prevailing conceptions of Judaism. The word is used in the sense of<P>(1) the vital principle, that which gives actual physical existence (<a onClick="return mV(\'Mat\',2,20);">Mt 2:20</a>; <a onClick="return mV(\'Mar\',10,45);">Mr 10:45</a>; <a onClick="return mV(\'Luk\',12,22);">Lu 12:22</a>f; <a onClick="return mV(\'Luk\',14,26);">14:26</a>).<P>(2) It is also the period of one\'s existence, i.e. lifetime (<a onClick="return mV(\'Luk\',1,75);">Lu 1:75</a>; <a onClick="return mV(\'Luk\',16,25);">16:25</a>).<P>(3) Once it may mean the totality of man\'s relationships and activities (<a onClick="return mV(\'Luk\',12,15);">Lu 12:15</a>) which do not consist in abundance of material possessions.<P>(4) Generally it means the real life, the vital connection with the world and God, the sum total of man\'s highest interests. It is called "eternal life" (<a onClick="return mV(\'Mat\',19,29);">Mt 19:29</a>; <a onClick="return mV(\'Mat\',25,46);">25:46</a>). It is called "life" (<a onClick="return mV(\'Mat\',18,8,9);">Mt 18:8,9</a>; <a onClick="return mV(\'Mat\',19,17);">19:17</a>; <a onClick="return mV(\'Mar\',9,43,45,46);">Mr 9:43,45,46</a>). In these passages Jesus seems to imply that it is almost equivalent to "laying up treasures in heaven," or to "entering the kingdom of God." The entering into life and entering the kingdom are practically the same, for the kingdom is that spiritual realm where God controls, where the principles, activities and relationships of heaven prevail, and hence, to enter into these is to enter into "life."<P>(5) The lower life of earthly relationship and activities must be subordinated to the higher and spiritual (<a onClick="return mV(\'Mat\',10,39);">Mt 10:39</a>; <a onClick="return mV(\'Mat\',16,25);">16:25</a>; <a onClick="return mV(\'Luk\',9,24);">Lu 9:24</a>). These merely earthly interests may be very desirable and enjoyable, but whoever would cling to these and make them supreme is in danger of losing the higher. The spiritual being infinitely more valuable should be sought even if the other relationship should be lost entirely.<P>(6) Jesus also speaks of this life as something future, and to be realized at the consummation of the age (<a onClick="return mV(\'Mat\',19,29);">Mt 19:29</a>; <a onClick="return mV(\'Luk\',18,30);">Lu 18:30</a>), or the world to come.<P>This in no wise contradicts the statement that eternal life can be entered upon in this life. As Jesus Himself was in vital relationship with the spiritual world and lived the eternal life, He sought to bring others into the same blessed state. This life was far from being perfect. The perfection could come only at the consummation when all was perfection and then they would enter into the perfect fellowship with God and connection with the spirit-world and its blessed experiences. There is no conflict in His teaching here, no real difficulty, only an illustration of Browning\'s statement, "Man never is but wholly hopes to be." Thus in the synoptists Jesus teaches the reality of the eternal life as a present possession as well as future fruition. The future is but the flowering out and perfection of the present. Without the present bud, there can be no future flower.<P>(7) The conditions which Jesus lays down for entering into this life are faith in Himself as the one Mediator of the life, and the following of Him in a life of obedience. He alone knows the Father and can reveal Him to others (<a onClick="return mV(\'Mat\',11,27);">Mt 11:27</a>). He alone can give true rest and can teach men how to live (<a onClick="return mV(\'Mat\',11,28);">Mt 11:28</a>f). The sure way to this life is: "Follow me." His whole ministry was virtually a prolonged effort to win confidence in Himself as Son and Mediator, to win obedience, and hence, bring men unto these spiritual relationships and activities which constitute the true life.<P>2. In the Fourth Gospel:<P>The fullest and richest teachings regarding life are found here. The greatest word of this Gospel is "life." The author says he wrote the Gospel in order that "ye may have life" (<a onClick="return mV(\'Jhn\',20,31);">Joh 20:31</a>). Most of the teachings recorded, circle around this great word "life." This teaching is in no way distinctive and different from that of the synoptists, but is supplementary, and completes the teaching of Jesus on the subject. The use of the word is not as varied, being concentrated on the one supreme subject.<P>(1) In a few cases it refers only to the vital principle which gives life or produces a lifetime (<a onClick="return mV(\'Jhn\',10,11,\'15-18\');">Joh 10:11,15-18</a>; <a onClick="return mV(\'Jhn\',13,37);">13:37</a>; <a onClick="return mV(\'Jhn\',15,13);">15:13</a>).<P>(2) It represents Jesus the Loges as the origin and means of all life to the world. As the preincarnate Loges He was the source of life to the universe (<a onClick="return mV(\'Jhn\',1,4);">Joh 1:4</a>). As the incarnate Loges He said His life had been derived originally from the Father (<a onClick="return mV(\'Jhn\',5,26);">Joh 5:26</a>; <a onClick="return mV(\'Jhn\',6,57);">6:57</a>; <a onClick="return mV(\'Jhn\',10,18);">10:18</a>). He then was the means of life to men (<a onClick="return mV(\'Jhn\',3,15,16);">Joh 3:15,16</a>; <a onClick="return mV(\'Jhn\',4,14);">4:14</a>; <a onClick="return mV(\'Jhn\',5,21,39,40);">5:21,39,40</a>); and this was the purpose for which He came into the world (<a onClick="return mV(\'Jhn\',6,33,34,51);">Joh 6:33,34,51</a>; <a onClick="return mV(\'Jhn\',10,10);">10:10</a>).<P>(3) The prevailing reference, however, is to those activities which are the expression of fellowship with God and Jesus Christ. These relationships are called "eternal life" (<a onClick="return mV(\'Jhn\',3,15,16,36);">Joh 3:15,16,36</a>; <a onClick="return mV(\'Jhn\',4,14);">4:14</a>, etc.). The nearest approach to a definition of eternal life is found in <a onClick="return mV(\'Jhn\',17,3);">Joh 17:3</a>. Though not a scientific or metaphysical definition, it is nevertheless Jesus\' own description of eternal life, and reveals His conception of it. It is thus more valuable than a formal definition. It is "to know God and Jesus Christ whom He hath sent."<P>This knowledge is vastly more than mere intellectual perception or understanding. It is moral knowledge, it is personal acquaintance, it is fellowship, a contact, if we may so speak, of personality with personality, an inner affinity and sympathy, an experience of similar thoughts, emotions, purposes, motives, desires, an interchange of the heart\'s deepest feelings and experiences. It is a bringing of the whole personality of man into right relationship with the personality of God. This relation is ethical, personal, binding the two together with ties which nothing can separate. It is into this experience that Jesus came to bring men. Such a life Jesus says is satisfying to all who hunger and thirst for it (<a onClick="return mV(\'Jhn\',4,14);">Joh 4:14</a>; <a onClick="return mV(\'Jhn\',6,35);">6:35</a>); it is the source of light to all (<a onClick="return mV(\'Jhn\',1,4);">Joh 1:4</a>; <a onClick="return mV(\'Jhn\',8,12);">8:12</a>); it is indestructible (<a onClick="return mV(\'Jhn\',6,58);">Joh 6:58</a>; <a onClick="return mV(\'Jhn\',11,26);">11:26</a>); it is like a well of water in the soul (<a onClick="return mV(\'Jhn\',4,14);">Joh 4:14</a>); it is procured by personally partaking of those qualities which belong to Jesus (<a onClick="return mV(\'Jhn\',6,53);">Joh 6:53</a>).<P>(4) This life is a present possession and has also a glorious future fruition.<P>(a) To those who exercise faith in Jesus it is a present experience and possession (<a onClick="return mV(\'Jhn\',4,10);">Joh 4:10</a>; <a onClick="return mV(\'Jhn\',5,24,40);">5:24,40</a>). Faith in Him as the Son of God is the psychological means by which persons are brought into this vital relationship with God. Those who exercised the faith immediately experienced this new power and fellowship and exercised the new activities.<P>(b) It has a glorious fruition in the future also (<a onClick="return mV(\'Jhn\',4,36);">Joh 4:36</a>; <a onClick="return mV(\'Jhn\',5,29);">5:29</a>; <a onClick="return mV(\'Jhn\',6,39,44,54);">6:39,44,54</a>). John does not give so much prominence to the eschatological phase of Jesus\' teachings as to the present reality and actual possession of this blessed life.<P>(5) It has been objected that in speaking of the Logos as the source of life John is pursuing a metaphysical line, whereas the life which he so much emphasizes has an ethical basis, and he makes no attempt to reconcile the two. The objection may have force to one who has imbibed the Ritschlian idea of performing the impossible task of eliminating all metaphysics from theology. It will not appeal very strongly to the average Christian. It is a purely academic objection. The ordinary mind will think that if Jesus Christ is the source of ethical and eternal life it is because He possesses something of the essence and being of God, which makes His work for men possible. The metaphysical and the ethical may exist together, may run concurrently, the one being the source and seat of the other. There is no contradiction. Both metaphysics and ethics are a legitimate and necessary exercise of the human mind.<P>3. In the Acts of the Apostles:<P>In His intercessory prayer, <a onClick="return mV(\'Jhn\',17,\'1-\');">John 17</a>, Jesus said His mission was to give eternal life to as many as the Father had given Him (<a onClick="return mV(\'Jhn\',17,2);">17:2</A>). The record in Acts is the carrying out of that purpose. The word "life" is used in several senses:<P>(1) the vital principle or physical life (<a onClick="return mV(\'Act\',17,25);">17:25</a>; <a onClick="return mV(\'Act\',20,10,24);">20:10,24</a>; <a onClick="return mV(\'Act\',27,10,22);">27:10,22</A>);<P>(2) also the sum total of man\'s relationships and activities upon earth (<a onClick="return mV(\'Act\',5,20);">5:20</a>; <a onClick="return mV(\'Act\',26,4);">26:4</A>);<P>(3) Jesus Christ is regarded as the source and principle of life, being called by Peter, "the Prince of life" (<a onClick="return mV(\'Act\',3,15);">3:15</A>). Also the life eternal or everlasting is spoken of with the same significance as in the Gospels (<a onClick="return mV(\'Act\',11,18);">11:18</a>; <a onClick="return mV(\'Act\',13,46,48);">13:46,48</a>).<P>4. In the Writings of Paul:<P>Here also the words for "life" are used in various senses:<P>(1) the vital principle which gives physical vitality and existence (<a onClick="return mV(\'Rom\',8,11,38);">Ro 8:11,38</a>; <a onClick="return mV(\'Rom\',11,15);">11:15</a>; <a onClick="return mV(\'1Cr\',3,22);">1Co 3:22</a>; <a onClick="return mV(\'Phl\',1,20);">Php 1:20</a>; <a onClick="return mV(\'Phl\',2,30);">2:30</a>);<P>(2) the sum total of man\'s relationships and activities (<a onClick="return mV(\'1Cr\',6,3,4);">1Co 6:3,4</a>; <a onClick="return mV(\'1Ti\',2,2);">1Ti 2:2</a>; <a onClick="return mV(\'1Ti\',4,8);">4:8</a>; <a onClick="return mV(\'2Ti\',1,1);">2Ti 1:1</a>; <a onClick="return mV(\'2Ti\',3,10);">3:10</a> the King James Version);<P>(3) those relationships with God and with Christ in the spiritual realm, and the activities arising therefrom which constitute the real and eternal life.<P>This is mediated by Christ (<a onClick="return mV(\'Rom\',5,10);">Ro 5:10</a>). It is in Christ (<a onClick="return mV(\'Rom\',6,11);">Ro 6:11</a>). It is the free gift of God (<a onClick="return mV(\'Rom\',6,23);">Ro 6:23</a>). It is also mediated or imparted to us through the Spirit (<a onClick="return mV(\'Rom\',8,2,6,9,10);">Ro 8:2,6,9,10</a>; <a onClick="return mV(\'2Cr\',2,16);">2Co 2:16</a>; <a onClick="return mV(\'2Cr\',3,6);">3:6</a>; <a onClick="return mV(\'Gal\',6,8);">Ga 6:8</a>). It comes through obedience to the word (<a onClick="return mV(\'Rom\',7,10);">Ro 7:10</a>; <a onClick="return mV(\'Phl\',2,16);">Php 2:16</a>); and through faith (<a onClick="return mV(\'1Ti\',1,16);">1Ti 1:16</a>). It may be apprehended in this life (<a onClick="return mV(\'1Ti\',6,12,19);">1Ti 6:12,19</a>). It is brought to light through the gospel (<a onClick="return mV(\'2Ti\',1,10);">2Ti 1:10</a>). It is a reward to those who by patience in well-doing seek it (<a onClick="return mV(\'Rom\',2,7);">Ro 2:7</a>). It gives conquering power over sin and death (<a onClick="return mV(\'Rom\',5,17,18,21);">Ro 5:17,18,21</a>). It is the end or reward of a sanctified life (<a onClick="return mV(\'Rom\',6,22);">Ro 6:22</a>). It is a present possession and a hope (<a onClick="return mV(\'Tts\',1,2);">Tit 1:2</a>; <a onClick="return mV(\'Tts\',3,7);">3:7</a>). It will be received in all its fullness hereafter (<a onClick="return mV(\'Rom\',2,7);">Ro 2:7</a>; <a onClick="return mV(\'2Cr\',5,4);">2Co 5:4</a>). Thus Paul\'s use of the word substantially agrees with the teaching in the Gospels, and no doubt was largely based upon it.<P>5. In the Writings of John:<P>In the Johannine Epistles and Revelation, the contents of the term "life" are the same as those in the Fourth Gospel. Life in certain passages (<a onClick="return mV(\'1Jo\',3,16);">1Joh 3:16</a>; <a onClick="return mV(\'Rev\',8,9);">Re 8:9</a>; <a onClick="return mV(\'Rev\',11,11);">11:11</a>; <a onClick="return mV(\'Rev\',12,11);">12:11</a>) is mere physical vitality and existence upon earth. The source of life is Christ Himself (<a onClick="return mV(\'1Jo\',1,1);">1Joh 1:1</a>f; <a onClick="return mV(\'1Jo\',5,11,16);">5:11f; 16</a>). The blessed eternal life in Christ is a present possession to all those who are in fellowship with the Father and the Son (<a onClick="return mV(\'1Jo\',5,11,12);">1Joh 5:11,12</a>). Here is an echo of the words of Jesus (<a onClick="return mV(\'Jhn\',17,3);">Joh 17:3</a>) where John describes the life, the eternal life which was with the Father and was manifested unto us. It is virtually fellowship with the Father and with the Son (<a onClick="return mV(\'1Jo\',1,2,4);">1Joh 1:2,4</a>). Life is promised to those who are faithful (<a onClick="return mV(\'Rev\',2,7);">Re 2:7</a>); and the crown of life is promised to those who are faithful unto death (<a onClick="return mV(\'Rev\',2,10);">Re 2:10</a>). The crown of life doubtless refers to the realization of all the glorious possibilities that come through fellowship with God and the Son. The thirsty are invited to come and drink of the water of life freely (<a onClick="return mV(\'Rev\',21,6);">Re 21:6</a>; <a onClick="return mV(\'Rev\',22,17);">22:17</a>). The river of life flows through the streets of the New Jerusalem (<a onClick="return mV(\'Rev\',22,1);">Re 22:1</a>), and the tree of life blooms on its banks, bearing twelve manner of fruit (<a onClick="return mV(\'Rev\',22,2,14);">22:2,14</a>).<P>See <a href="./study/isbe/search.html?string=TREE+OF+LIFE">TREE OF LIFE</a>.<P>6. In the Other Books of the New Testament:<P>The Epistle to the Hebrews speaks of our lifetime or periods of existence upon earth (<a onClick="return mV(\'Hbr\',2,15);">2:15</a>; <a onClick="return mV(\'Hbr\',7,3);">7:3</A>), likewise of the power of an indissoluble life (<a onClick="return mV(\'Hbr\',7,16);">7:16</a>); James promises the crown of life to the faithful (<a onClick="return mV(\'Jam\',1,12);">1:12</a>). This reward is the fullness of life\'s possibilities hereafter. Our lifetime is mentioned in <a onClick="return mV(\'Jam\',4,14);">4:14</a> and represented as brief as a vapor. Peter in <a onClick="return mV(\'1Pe\',3,7);">1Pe 3:7</a> speaks of man and wife as joint-heirs of the grace of life, and of loving life (<a onClick="return mV(\'1Pe\',3,10);">1Pe 3:10</a>), referring to the totality of relationships and activities. The "all things that pertain unto life and godliness" (<a onClick="return mV(\'2Pe\',1,3);">2Pe 1:3</a>) constitute the whole Christian life involving the life eternal.<P>LITERATURE.<P>Articles on "Life" in HDB, DCG, Jewish Encyclopedia; on "Soul," "Spirit," etc., ibid, and in Encyclopedia Brit, EB, Kitto, Smith, Standard, etc.; Laidlaw, Bible Doctrine of Man; Delitzsch, A System of Biblical Psychology; cornms. on the various passages; Davidson, Old Testament Theology; Oehler and Schultz, Old Testament Theology; Stevens, Johannine Theology and Pauline Theology; Holtzmann, New Testament Theology, I, 293ff; G. Dalman, Words of Jesus; Phillips Brooks, More Abundant Life; B.F. Westcott, Historic Faith; F.J.A. Hort, The Way, the Truth, the Life; J.G. Hoare, Life in John\'s Gospels; E. White, Life and Christ; Salmond, The Christian Doctrine of Immortality; R.J. Knowling, Witness of the Epistles and The Testimony of Paul to Christ; commentaries on the various passages; McPherson, "The New Testament View of Life," The Expositor, I, set. v, 72ff; Massie, "Two New Testament Words Denoting Life," The Expositor, II, series iv, 380ff; Schrenk, Die Johannistische Anschauung yom Leben.``146';

isbe[5527]='Lift`To make lofty, to raise up. A very common word in English Versions of the Bible representing a great variety of Hebrew and Greek words, although in the Old Testament used chiefly as the translation of nasa\'. Of none of these words, however, is "lift" used as a technical translation, and "lift" is interchanged freely with its synonyms, especially "exalt" (compare <a onClick="return mV(\'Psa\',75,5);">Ps 75:5</a>; <a onClick="return mV(\'Psa\',89,24);">89:24</a>) and "raise" (compare <a onClick="return mV(\'Ecc\',4,10);">Ec 4:10</a>; <a onClick="return mV(\'2Sa\',12,17);">2Sa 12:17</a>). "Lift" is still perfectly good English, but not in all the senses in which it is used in English Versions of the Bible; e.g. such phrases as "men that lifted up axes upon a thicket" (<a onClick="return mV(\'Psa\',74,5);">Ps 74:5</a>), "lift up thy feet unto the perpetual ruins" (<a onClick="return mV(\'Psa\',74,3);">Ps 74:3</a>, etc.), and even the common "lift up the eyes" or "hands" are distinctly archaic. However, almost all the uses are perfectly clear, and only the following need be noted. "To lift up the head" (<a onClick="return mV(\'Gen\',40,13,19,20);">Ge 40:13,19,20</a>; <a onClick="return mV(\'2Ki\',25,27);">2Ki 25:27</a>; <a onClick="return mV(\'Psa\',3,3);">Ps 3:3</a>; Sirach 11:13; <a onClick="return mV(\'Luk\',21,28);">Lu 21:28</a>) means to raise from a low condition (but on <a onClick="return mV(\'Psa\',24,7,9);">Ps 24:7,9</a> see <a href="./study/isbe/search.html?string=GATE">GATE</a>). To "lift up the horn" (<a onClick="return mV(\'Psa\',75,5);">Ps 75:5</a>) is to assume a confident position, the figure being taken from fighting oxen (see <a href="./study/isbe/search.html?string=HORN">HORN</a>). "Lift up the face" may be meant literally (<a onClick="return mV(\'2Ki\',9,32);">2Ki 9:32</a>), or it may denote the bestowal of favor (<a onClick="return mV(\'Psa\',4,6);">Ps 4:6</a>); it may mean the attitude of a righteous man toward God (<a onClick="return mV(\'Job\',22,26);">Job 22:26</a>), or simply the attitude of a suppliant (<a onClick="return mV(\'Ezr\',9,6);">Ezr 9:6</a>).``48';
isbe[5528]='Light`lit (\'or, ma\'or; phos; many other words):<P>1. Origin of Light<P>2. A Comprehensive Term<P class="in15">(1) Natural Light<P class="in15">(2) Artificial Light<P class="in15">(3) Miraculous Light<P class="in15">(4) Mental, Moral, Spiritual Light<P>3. An Attribute of Holiness<P class="in15">(1) God<P class="in15">(2) Christ<P class="in15">(3) Christians<P class="in15">(4) The Church<P>4. Symbolism<P>5. Expressive Terms<hr /><P>1. Origin of Light:<P>The creation of light was the initial step in the creation of life. "Let there be light" (<a onClick="return mV(\'Gen\',1,3);">Ge 1:3</a>) was the first word of God spoken after His creative Spirit "moved" upon the primary material out of which He created the heavens and the earth, and which lay, until the utterance of that word, in the chaos of darkness and desolation. Something akin, possibly, to the all-pervasive electro-magnetic activity of the aurora borealis penetrated the chaotic night of the world. The ultimate focusing of light (on the 4th day of creation, <a onClick="return mV(\'Gen\',1,14);">Ge 1:14</a>) in suns, stars, and solar systems brought the initial creative process to completion, as the essential condition of all organic life. The origin of light thus finds its explanation in the purpose and very nature of God whom John defines as not only the Author of light but, in an all-inclusive sense, as light itself: "God is light" (<a onClick="return mV(\'1Jo\',1,5);">1Joh 1:5</a>).<P>2. A Comprehensive Term:<P>The word "light" is Divinely rich in its comprehensiveness and meaning. Its material splendor is used throughout the Scriptures as the symbol and synonym of all that is luminous and radiant in the mental, moral and spiritual life of men and angels; while the eternal God, because of His holiness and moral perfection, is pictured as "dwelling in light unapproachable" (<a onClick="return mV(\'1Ti\',6,16);">1Ti 6:16</a>). Every phase of the word, from the original light in the natural world to the spiritual glory of the celestial, is found in Holy Writ.<P>(1) Natural Light.<P>The light of day (<a onClick="return mV(\'Gen\',1,5);">Ge 1:5</a>); of sun, moon and stars; "lights in the firmament" (<a onClick="return mV(\'Gen\',1,\'14-18\');">Ge 1:14-18</a>; <a onClick="return mV(\'Psa\',74,16);">Ps 74:16</a>; <a onClick="return mV(\'Psa\',136,7);">136:7</a>; <a onClick="return mV(\'Psa\',148,3);">148:3</a>; <a onClick="return mV(\'Ecc\',12,2);">Ec 12:2</a>; <a onClick="return mV(\'Rev\',22,5);">Re 22:5</a>). Its characteristics are beauty, radiance, utility. It "rejoiceth the heart" (<a onClick="return mV(\'Pro\',15,30);">Pr 15:30</a>); "Truly the light is sweet" (<a onClick="return mV(\'Ecc\',11,7);">Ec 11:7</a>); without it men stumble and are helpless (<a onClick="return mV(\'Jhn\',11,9,10);">Joh 11:9,10</a>); it is something for which they wait with inexpressible longing (<a onClick="return mV(\'Job\',30,26);">Job 30:26</a>; compare <a onClick="return mV(\'Psa\',130,6);">Ps 130:6</a>). Life, joy, activity and all blessings are dependent upon light.<P>Light and life are almost synonymous to the inhabitants of Palestine, and in the same way darkness and death. Theirs is the land of sunshine. When they go to other lands of clouded skies their only thought is to return to the brightness and sunshine of their native land. In Palestine there is hardly a day in the whole year when the sun does not shine for some part of it, while for five months of the year there is scarcely an interruption of the sunshine. Time is reckoned from sunset to sunset. The day\'s labor closes with the coming of darkness. "Man goeth forth unto his work and to his labor until the evening" (<a onClick="return mV(\'Psa\',104,23);">Ps 104:23</a>).<P>The suddenness of the change from darkness to light with the rising sun and the disappearance of the sun in the evening is more striking than in more northern countries, and it is not strange that in the ancient days there should have arisen a worship of the sun as the giver of light and happiness, and that Job should mention the enticement of sun-worship when he "beheld the sun when it shined, or the moon walking in brightness" (<a onClick="return mV(\'Job\',31,26);">Job 31:26</a>). The severest plague in Egypt next to the slaying of the firstborn was the plague of darkness which fell upon the Egyptians (<a onClick="return mV(\'Exd\',10,23);">Ex 10:23</a>). This love of light finds expression in both Old Testament and New Testament in a very extensive use of the word to express those things which are most to be desired and most helpful to man, and in this connection we find some of the most beautiful figures in the Bible.<P>(2) Artificial Light.<P>When natural light fails, man by discovery or invention provides himself with some temporary substitute, however dim and inadequate. The ancient Hebrews had "oil for the light" (<a onClick="return mV(\'Exd\',25,6);">Ex 25:6</a>; <a onClick="return mV(\'Exd\',35,8);">35:8</a>; <a onClick="return mV(\'Lev\',24,2);">Le 24:2</a>) and lamps (<a onClick="return mV(\'Exd\',35,14);">Ex 35:14</a>; <a onClick="return mV(\'Mat\',5,15);">Mt 5:15</a>). "There were many lights. (lampas) in the upper chamber" at Troas, where Paul preached until midnight (<a onClick="return mV(\'Act\',20,8);">Ac 20:8</a>); so <a onClick="return mV(\'Jer\',25,10);">Jer 25:10</a> the Revised Version (British and American), "light of the lamp;" the King James Version, "candle."<P>(3) Miraculous Light.<P>When the appalling plague of "thick darkness," for three days, enveloped the Egyptians, terrified and rendered them helpless, "all the children of Israel had light in their dwellings" (<a onClick="return mV(\'Exd\',10,23);">Ex 10:23</a>). Whether the darkness was due to a Divinely-ordered natural cause or the light was the natural light of day, the process that preserved the interspersed Israelites from the encompassing darkness was supernatural. Miraculous, also, even though through natural agency, was the "pillar of fire" that gave light to the Israelites escaping from Pharaoh (<a onClick="return mV(\'Exd\',13,21);">Ex 13:21</a>; <a onClick="return mV(\'Exd\',14,20);">14:20</a>; <a onClick="return mV(\'Psa\',78,14);">Ps 78:14</a>), "He led them...all the night with a light of fire." Supernatural was the effulgence at Christ\'s transfiguration that made "his garments...white as the light" (<a onClick="return mV(\'Mat\',17,2);">Mt 17:2</a>). Under the same category Paul classifies \'the great light\' that \'suddenly shone round about him from heaven\' on the way to Damascus (<a onClick="return mV(\'Act\',22,6);">Ac 22:6</a>; compare <a onClick="return mV(\'Act\',9,3);">Ac 9:3</a>). In these rare instances the supernatural light was not only symbolic of an inner spiritual light, but instrumental, in part at least, in revealing or preparing the way for it.<P>(4) Mental, Moral, Spiritual Light.<P>The phenomena of natural light have their counterpart in the inner life of man. Few words lend themselves with such beauty and appropriateness to the experiences, conditions, and radiance of the spiritual life. For this reason the Scriptures use "light" largely in the figurative sense. Borrowed from the natural world, it is, nevertheless, inherently suited to portray spiritual realities. In secular life a distinct line of demarcation is drawn between intellectual and spiritual knowledge and illumination. Education that enlightens the mind may leave the moral man untouched. This distinction rarely obtains in the Bible, which deals with man as a spiritual being and looks upon his faculties as interdependent in their action.<P>(a) A few passages, however, refer to the light that comes chiefly to the intellect or mind through Divine instruction, e.g. <a onClick="return mV(\'Psa\',119,130);">Ps 119:130</a>, "The opening of thy words giveth light"; so <a onClick="return mV(\'Pro\',6,23);">Pr 6:23</a>, "The law is light." Even here the instruction includes moral as well as mental enlightenment.<P>(b) Moral: <a onClick="return mV(\'Job\',24,13,16);">Job 24:13,16</a> has to do exclusively with man\'s moral attitude to truth: "rebel against the light"; "know not the light." <a onClick="return mV(\'Isa\',5,20);">Isa 5:20</a> describes a moral confusion and blindness, which cannot distinguish light from darkness.<P>(c) For the most part, however, light and life go together. It is the product of salvation: "Yahweh is my light and my salvation" (<a onClick="return mV(\'Psa\',27,1);">Ps 27:1</a>). "Light," figuratively used, has to do preeminently with spiritual life, including also the illumination that floods all the faculties of the soul: intellect, conscience, reason, will. In the moral realm the enlightenment of these faculties is dependent wholly on the renewal of the spirit. "In thy light...we see light" (<a onClick="return mV(\'Psa\',36,9);">Ps 36:9</a>); "The life was the light of men" (<a onClick="return mV(\'Jhn\',1,4);">Joh 1:4</a>).<P>Light is an attribute of holiness, and thus a personal quality. It is the outshining of Deity.<P>3. An Attribute of Holiness:<P>(1) God.<P>"God is light, and in him is no darkness at all" (<a onClick="return mV(\'1Jo\',1,5);">1Joh 1:5</a>). Darkness is the universal symbol and condition of sin and death; light the symbol and expression of holiness. "The light of Israel will be for a fire, and his Holy One for a flame" (<a onClick="return mV(\'Isa\',10,17);">Isa 10:17</a>). God, by His presence and grace, is to us a "marvellous light" (<a onClick="return mV(\'1Pe\',2,9);">1Pe 2:9</a>). The glory of His holiness and presence is the "everlasting light" of the redeemed in heaven (<a onClick="return mV(\'Isa\',60,19,20);">Isa 60:19,20</a>; <a onClick="return mV(\'Rev\',21,23,24);">Re 21:23,24</a>; <a onClick="return mV(\'Rev\',22,5);">22:5</a>).<P>(2) Christ.<P>Christ, the eternal Word (logos, <a onClick="return mV(\'Jhn\',1,1);">Joh 1:1</a>), who said "Let there be light" (<a onClick="return mV(\'Gen\',1,3);">Ge 1:3</a>), is Himself the "effulgence of (God\'s) glory" (<a onClick="return mV(\'Hbr\',1,3);">Heb 1:3</a>), "the light which lighteth every man, coming into the world" (<a onClick="return mV(\'Jhn\',1,9);">Joh 1:9</a>) (compare the statements concerning Wisdom in The <span class="noTag">Wisdom of Solomon 7:25f</span> and concerning Christ in <a onClick="return mV(\'Hbr\',1,3);">Heb 1:3</a>; and see <a href="./study/isbe/search.html?string=CREEDS">CREEDS</a>; <a href="./study/isbe/search.html?string=LOGOS">LOGOS</a>; <a href="./study/isbe/search.html?string=JOHANNINE+THEOLOGY">JOHANNINE THEOLOGY</a>; <a href="./study/isbe/search.html?string=WISDOM">WISDOM</a>). As the predicted Messiah, He was to be "for alight of the Gentiles" (<a onClick="return mV(\'Isa\',42,6);">Isa 42:6</a>; <a onClick="return mV(\'Isa\',49,6);">49:6</a>). His birth was the fulfillment of this prophecy (<a onClick="return mV(\'Luk\',2,32);">Lu 2:32</a>). Jesus called Himself "the light of the world" (<a onClick="return mV(\'Jhn\',8,12);">Joh 8:12</a>; <a onClick="return mV(\'Jhn\',9,5);">9:5</a>; <a onClick="return mV(\'Jhn\',12,46);">12:46</a>); As light He was "God...manifest in the flesh (<a onClick="return mV(\'1Ti\',3,16);">1Ti 3:16</a> the King James Version). "The Word was God" (<a onClick="return mV(\'Jhn\',1,1);">Joh 1:1</a>). Jesus as logos is the eternal expression of God as a word is the expression of a thought. In the threefold essence of His being God is Life (zoe) (<a onClick="return mV(\'Jhn\',5,26);">Joh 5:26</a>; <a onClick="return mV(\'Jhn\',6,57);">6:57</a>); God is Love (agape) (<a onClick="return mV(\'1Jo\',4,8);">1Joh 4:8</a>); God is Light (phos) (<a onClick="return mV(\'1Jo\',1,5);">1Joh 1:5</a>). Thus Christ, the logos, manifesting the three aspects of the Divine Nature, is Life, Love and Light, and these three are inseparable and constitute the glory. which the disciples beheld in Him, "glory as of the only begotten from the Father" (<a onClick="return mV(\'Jhn\',1,14);">Joh 1:14</a>). In revealing and giving life, Christ becomes "the light of men" (<a onClick="return mV(\'Jhn\',1,4);">Joh 1:4</a>). God gives "the light of the knowledge of (his) glory in the face of Jesus Christ" (<a onClick="return mV(\'2Cr\',4,6);">2Co 4:6</a>), and this salvation is called "the light of the gospel of the glory of Christ" (<a onClick="return mV(\'2Cr\',4,4);">2Co 4:4</a>). Christ is thus the Teacher, Enlightener ("Christ shall give thee light," <a onClick="return mV(\'Eph\',5,14);">Eph 5:14</a> the King James Version), Guide, Saviour of men.<P>(3) Christians.<P>All who catch and reflect the light of God and of Christ are called "light," "lights."<P>(a) John the Baptist: "a burning and a shining light" (<a onClick="return mV(\'Jhn\',5,35);">Joh 5:35</a> the King James Version). It is significant that this pre-Christian prophet was termed luchnos, while the disciples of the new dispensation are called phos (<a onClick="return mV(\'Mat\',5,14);">Mt 5:14</a>): "Ye are the light of the world."<P>(b) Henceforth Christians and saints were called "children of light" (<a onClick="return mV(\'Luk\',16,8);">Lu 16:8</a>; <a onClick="return mV(\'Jhn\',12,36);">Joh 12:36</a>; <a onClick="return mV(\'Eph\',5,8);">Eph 5:8</a>), and were expected to be "seen as lights in the world" (<a onClick="return mV(\'Phl\',2,15);">Php 2:15</a>).<P>(c) The Jew who possessed the law mistakenly supposed he was "a light of them that are in darkness" (<a onClick="return mV(\'Rom\',2,19);">Ro 2:19</a>).<P>(4) The Church.<P>Zion was to "shine" because her \'light had come\' (<a onClick="return mV(\'Isa\',60,1);">Isa 60:1</a>). The Gentiles were to come to her light (<a onClick="return mV(\'Isa\',60,3);">Isa 60:3</a>). Her mission as the enlightener of the world was symbolized in the ornamentations of her priesthood. The Urim of the high priest\'s breastplate signified light, and the name itself is but the plural form of the Hebrew \'or. It stood for revelation, and thummim for truth. The church of the Christian dispensation was to be even more radiant with the light of God and of Christ. The seven churches of Asia were revealed to John, by the Spirit, as seven golden candlesticks, and her ministers as seven stars, both luminous with the light of the Gospel revelation. In Ephesians, Christ, who is the Light of the world, is the Head of the church, the latter being His body through which His glory is to be manifested to the world, "to make all men see," etc. (<a onClick="return mV(\'Eph\',3,9,10);">Eph 3:9,10</a>). "Unto him be the glory in the church" (<a onClick="return mV(\'Eph\',3,21);">Eph 3:21</a>), the church bringing glory to God, by revealing His glory to men through its reproduction of the life and light of Christ.<P>4. Symbolism:<P>Light symbolizes:<P>(1) the eye, "The light of the body is the eye" (<a onClick="return mV(\'Mat\',6,22);">Mt 6:22</a>, the King James Version; <a onClick="return mV(\'Luk\',11,34);">Lu 11:34</a>);<P>(2) watchfulhess, "Let your lights (the Revised Version (British and American) "lamps") be burning," the figure being taken from the parable of the Virgins;<P>(3) protection, "armor (<a onClick="return mV(\'Rom\',13,12);">Ro 13:12</a>), the garment of a holy and Christ-like life;<P>(4) the sphere of the Christian\'s daily walk, "inheritance of the saints in light" (<a onClick="return mV(\'Col\',1,12);">Col 1:12</a>);<P>(5) heaven, for the inheritance just referred to includes the world above in which "the Lamb is the light thereof"<P>(6) prosperity, relief (<a onClick="return mV(\'Est\',8,16);">Es 8:16</a>; <a onClick="return mV(\'Job\',30,26);">Job 30:26</a>), in contrast with the calamities of the wicked whose "light...shall be put out" (<a onClick="return mV(\'Job\',18,5);">Job 18:5</a>);<P>(7) joy and gladness (<a onClick="return mV(\'Job\',3,20);">Job 3:20</a>; <a onClick="return mV(\'Psa\',97,11);">Ps 97:11</a>; <a onClick="return mV(\'Psa\',112,4);">112:4</a>);<P>(8) God\'s favor, the light of thy countenance" (<a onClick="return mV(\'Psa\',4,6);">Ps 4:6</a>; <a onClick="return mV(\'Psa\',44,3);">44:3</a>; <a onClick="return mV(\'Psa\',89,15);">89:15</a>), and a king\'s favor (<a onClick="return mV(\'Pro\',16,15);">Pr 16:15</a>);<P>(9) life (<a onClick="return mV(\'Psa\',13,3);">Ps 13:3</a>; <a onClick="return mV(\'Psa\',49,19);">49:19</a>; <a onClick="return mV(\'Jhn\',1,4);">Joh 1:4</a>).<P>5. Expressive Terms:<P>Expressive terms are:<P>(1) "fruit of the light" (<a onClick="return mV(\'Eph\',5,9);">Eph 5:9</a>), i.e. goodness, righteousness, truth;<P>(2) "light in the Lord" (<a onClick="return mV(\'Eph\',5,8);">Eph 5:8</a>), indicating the source of light (compare <a onClick="return mV(\'Isa\',2,5);">Isa 2:5</a>);<P>(3) "inheritance of the saints in light" (<a onClick="return mV(\'Col\',1,12);">Col 1:12</a>), a present experience issuing in heaven;<P>(4) "Father of lights" (<a onClick="return mV(\'Jam\',1,17);">Jas 1:17</a>), signifying the Creator of the heavenly bodies;<P>(5) "marvellous light" (<a onClick="return mV(\'1Pe\',2,9);">1Pe 2:9</a>), the light of God\'s presence and fellowship;<P>(6) "Walk in the light" (<a onClick="return mV(\'1Jo\',1,7);">1Joh 1:7</a>), in the light of God\'s teaching and companionship;<P>(7) "abideth in the light" (<a onClick="return mV(\'1Jo\',2,10);">1Joh 2:10</a>), in love, Divine and fraternal;<P>(8) "Light of the glorious gospel of Christ ";" light of the knowledge of the glory of God" (<a onClick="return mV(\'2Cr\',4,4,6);">2Co 4:4,6</a> the King James Version).``139';
isbe[5529]='Light; Lightness`lit\'-nes: "Light" is used in Scripture, as in ordinary speech, in the sense of what is small, slight, trivial, easy; "lightness" with the connotation of vacillation or lasciviousness. Thus in the Old Testament, "a light thing," a small, easy, slight thing (qalal, <a onClick="return mV(\'2Ki\',3,18);">2Ki 3:18</a>; <a onClick="return mV(\'Isa\',49,6);">Isa 49:6</a>; <a onClick="return mV(\'Eze\',8,17);">Eze 8:17</a>; <a onClick="return mV(\'Eze\',22,7);">22:7</a>, in the last case "to treat slightingly"). "Lightness" (qol) occurs in <a onClick="return mV(\'Jer\',3,9);">Jer 3:9</a> ("the lightness of her whoredom"); in <a onClick="return mV(\'Jer\',23,32);">23:32</a>, the Revised Version (British and American) changes "lightness" (a different word) to "vain boasting." In the New Testament the phrase occurs in <a onClick="return mV(\'Mat\',22,5);">Mt 22:5</a>, "made light of it" (ameleo), i.e. "treated it with neglect"; and Paul asks (<a onClick="return mV(\'2Cr\',1,17);">2Co 1:17</a>), "Did I show lightness?" (the Revised Version (British and American) "fickleness"). These examples sufficiently illustrate the meaning.``132';
isbe[5530]='Lightning`lit\'-ning (baraq, chaziz; astrape): Lightning is caused by the discharge of electricity between clouds or between clouds and the earth. In a thunder-storm there is a rapid gathering of particles of moisture into clouds and forming of large drops of rain. This gathers with it electric potential until the surface of the cloud (or the enlarged water particles) is insufficient to carry the charge, and a discharge takes place, producing a brilliant flash of light and the resulting thunder-clap. Thunder-storms are common in Syria and Palestine during the periods of heavy rain in the spring and fall and are often severe. Lightning is usually accompanied by heavy rainfall or by hail, as at the time of the plague of hail (<a onClick="return mV(\'Exd\',9,24);">Ex 9:24</a>).<P>See <a href="./study/isbe/search.html?string=HAIL">HAIL</a>.<P>In the Scriptures it is used:<P>(a) indicating the power of God: The power of God is shown in His command of the forces of Nature, and He is the only one who knows the secrets of Nature: "He made...a way for the lightning" (<a onClick="return mV(\'Job\',28,26);">Job 28:26</a>); "He directeth...his lightning" (<a onClick="return mV(\'Job\',37,3);">Job 37:3</a> the King James Version); "Canst thou send forth lightnings, that they may go?" (<a onClick="return mV(\'Job\',38,35);">Job 38:35</a>); "Ask ye of Yahweh...that maketh lightnings" (<a onClick="return mV(\'Zec\',10,1);">Zec 10:1</a>). See also <a onClick="return mV(\'Psa\',18,14);">Ps 18:14</a>; <a onClick="return mV(\'Psa\',97,4);">97:4</a>; <a onClick="return mV(\'Psa\',135,7);">135:7</a>; <a onClick="return mV(\'Job\',36,32);">Job 36:32</a>; <a onClick="return mV(\'Jer\',10,13);">Jer 10:13</a>;<P>(b) figuratively and poetically: David sings of Yahweh, "He sent...lightnings manifold, and discomfited them" (<a onClick="return mV(\'Psa\',18,14);">Ps 18:14</a>); used for speed: "The chariots...run like the lightnings" (<a onClick="return mV(\'Nah\',2,4);">Na 2:4</a>): "His arrow shall go forth as the lightning" (<a onClick="return mV(\'Zec\',9,14);">Zec 9:14</a>); "The living creatures ran and returned as the appearance of a flash of lightning" (<a onClick="return mV(\'Eze\',1,14);">Eze 1:14</a>). The coming of the kingdom is described by Jesus as the shining of the lightning from one part of heaven to another, even "from the east unto the west" (<a onClick="return mV(\'Mat\',24,27);">Mt 24:27</a>; <a onClick="return mV(\'Luk\',17,24);">Lu 17:24</a>);<P>(c) meaning bright or shining: Daniel in his vision saw a man and "his face (was) as the appearance of lightning" (<a onClick="return mV(\'Dan\',10,6);">Da 10:6</a>). See also <a onClick="return mV(\'Rev\',4,5);">Re 4:5</a>; <a onClick="return mV(\'Rev\',8,5);">8:5</a>; <a onClick="return mV(\'Rev\',16,18);">16:18</a>.``85';
isbe[5531]='Lign-Aloes`lin-al\'-oz, lig-nal\'-oz.`<a href="./study/isbe/search.html?string=ALOES">ALOES</a>`1';
isbe[5532]='Ligure`lig\'-ur (<a onClick="return mV(\'Exd\',28,19);">Ex 28:19</a>; <a onClick="return mV(\'Exd\',39,12);">39:12</a> the King James Version, the Revised Version (British and American) "jacinth").`<a href="./study/isbe/search.html?string=STONES,+PRECIOUS">STONES, PRECIOUS</a>`1';
isbe[5533]='Like; Liken; Likeness; Liking`lik, lik\'-n, lik\'-nes, lik\'-ing:<P>(1) As a noun, "like" in modern English is virtually obsolete, except in the phrase "and the like," which is not found in English Versions of the Bible. "The like," however, occurs in <a onClick="return mV(\'1Ki\',10,20);">1Ki 10:20</a> parallel <a onClick="return mV(\'2Ch\',9,19);">2Ch 9:19</a>; <a onClick="return mV(\'2Ch\',1,12);">2Ch 1:12</a>; <a onClick="return mV(\'Eze\',5,9);">Eze 5:9</a>; <a onClick="return mV(\'Eze\',18,10);">18:10</a> (the Revised Version (British and American) "any one of these things"—the text is uncertain); <a onClick="return mV(\'Eze\',45,25);">45:25</a>; <a onClick="return mV(\'Joe\',2,2);">Joe 2:2</a>; The <span class="noTag">Wisdom of Solomon 16:1</span> (the Revised Version (British and American) "creatures like those"); Sirach 7:12. "His like" is found in <a onClick="return mV(\'Job\',41,33);">Job 41:33</a>; Sirach 13:15; "their like" in Sirach 27:9. "And such like" (<a onClick="return mV(\'Gal\',5,21);">Ga 5:21</a>) is only slightly archaic, but "doeth not such like" (<a onClick="return mV(\'Eze\',18,14);">Eze 18:14</a>) is quite obsolete.<P>(2) As an adjective "like" is common in the King James Version in such combinations as "like manner" (frequently), "like weight" (<a onClick="return mV(\'Exd\',30,34);">Ex 30:34</a>), "like occupation" (<a onClick="return mV(\'Act\',19,25);">Ac 19:25</a>), etc. Modern English would in most cases replace "like" by "the same," as has been done in <a onClick="return mV(\'1Th\',2,14);">1Th 2:14</a> the Revised Version (British and American) (compare <a onClick="return mV(\'Rom\',15,5);">Ro 15:5</a>; <a onClick="return mV(\'Phl\',2,2);">Php 2:2</a>). So the Revised Version (British and American) has modernized the archaic "like precious faith" of <a onClick="return mV(\'2Pe\',1,1);">2Pe 1:1</a> by inserting "a" before "like." The King James Version\'s rendering of <a onClick="return mV(\'1Pe\',3,21);">1Pe 3:21</a>, "the like figure whereunto," could not have been very clear at any time, and the Revised Version (British and American) has revised completely into "after a true likeness" (margin, "in the antitype").<P>(3) As an adverb "like" is used in <a onClick="return mV(\'Jer\',38,9);">Jer 38:9</a>, "He is like to die"; <a onClick="return mV(\'Jon\',1,4);">Jon 1:4</a>, "like to be broken." the Revised Version (British and American) could have used "likely" in these verses. Most common of all the uses of "like" is the quasi-prepositional construction in "He is like a man," etc. This is of course good modern English, but not so when "like" is enlarged (as it usually is in the English Versions of the Bible) into the forms "like to" (<a onClick="return mV(\'Dan\',7,5);">Da 7:5</a>), "like unto" (very common), "like as" (<a onClick="return mV(\'Isa\',26,17);">Isa 26:17</a>, etc.). These forms and the simple "like" are interchanged without much distinction, and the Revised Version (British and American) has attempted little systematizing beyond reducing the occurrences of "like as" (compare <a onClick="return mV(\'Mat\',12,13);">Mt 12:13</a>, and the American Standard Revised Version <a onClick="return mV(\'Isa\',13,4);">Isa 13:4</a>; <a onClick="return mV(\'Jer\',23,29);">Jer 23:29</a>).<P>(4) The verb "like" has two distinct meanings, "be pleased with" and "give pleasure to." The latter sense occurs in <a onClick="return mV(\'Deu\',23,16);">De 23:16</a> (The King James Version, the English Revised Version), "in one of thy gates, where it liketh him best," and in <a onClick="return mV(\'Est\',8,8);">Es 8:8</a>; <a onClick="return mV(\'Amo\',4,5);">Am 4:5</a> the King James Version; Sirach 33:13 (the American Standard Revised Version has "pleaseth" in the three Old Testament passages). The other use of "like" belongs also to modern English, although in a much weakened sense. On account of this weakening, <a onClick="return mV(\'1Ch\',28,4);">1Ch 28:4</a> the King James Version, "liked me to make me king" and <a onClick="return mV(\'Rom\',1,28);">Ro 1:28</a> the King James Version "did not like to retain God," have become in the Revised Version (British and American) "took pleasure in" and "refused to" (margin "did not approve"). It would have been better if <a onClick="return mV(\'Deu\',25,7,8);">De 25:7,8</a>, "like not to take," had been modified also into "hath no wish to take." From this use of "like" is derived liking in the modern sense in The <span class="noTag">Wisdom of Solomon 16:21</span>, tempered itself to every man\'s liking" (the Revised Version (British and American) "choice"). In 1Esdras 4:39, "All men do well like of her works" is a further obsolete use.<P>(5) Liken and "make like" are common. To be noted only is that, in <a onClick="return mV(\'Hbr\',7,3);">Heb 7:3</a>, "made like unto the Son of God," the sense really is "likened to," "presented by the writer with the qualities of." Likeness normally means "a copy of," but in <a onClick="return mV(\'Psa\',17,15);">Ps 17:15</a> it means the actual form itself ("form" in the American Standard Revised Version, the English Revised Version margin); compare <a onClick="return mV(\'Rom\',6,5);">Ro 6:5</a>; <a onClick="return mV(\'Rom\',8,3);">8:3</a>; <a onClick="return mV(\'Phl\',2,7);">Php 2:7</a>, and perhaps <a onClick="return mV(\'Act\',14,11);">Ac 14:11</a>. Closely allied with likeness" is an obsolete use of "liking" (quite distinct from that above) in <a onClick="return mV(\'Job\',39,4);">Job 39:4</a> the King James Version the English Revised Version, "Their young ones are in good liking" <a onClick="return mV(\'Dan\',1,10);">Da 1:10</a>, "see your faces worse liking." The meaning is "appearance," "appearing," and the American Standard Revised Version renders "their young ones become strong," "see your faces worse looking." Likewise varies in meaning from the simple conjunction "and" to a strong adverb, "in exactly the same way." the Revised Version (British and American) has made some attempt to distinguish the various forces (e.g. compare the King James Version with the Revised Version (British and American) in <a onClick="return mV(\'Luk\',22,36);">Lu 22:36</a>; <a onClick="return mV(\'Luk\',15,7);">15:7</a>; <a onClick="return mV(\'Luk\',22,20);">22:20</a>). But complete consistency was not attainable, and in certain instances was neglected deliberately, in order to preserve the familiar wording, as in <a onClick="return mV(\'Luk\',10,37);">Lu 10:37</a>, "Go, and do thou likewise."``48';
isbe[5534]='Likhi`lik\'-hi (liqchi): A descendant of Manasseh (<a onClick="return mV(\'1Ch\',7,19);">1Ch 7:19</a>).``1';
isbe[5535]='Lilith`lil\'-ith, li\'-lith.`<a href="./study/isbe/search.html?string=NIGHT+MONSTER">NIGHT-MONSTER</a>`1';
isbe[5536]='Lily`lil\'-i (shushan (<a onClick="return mV(\'1Ki\',7,19);">1Ki 7:19</a>), shoshannah (<a onClick="return mV(\'2Ch\',4,5);">2Ch 4:5</a>; <a onClick="return mV(\'Sgs\',2,1);">So 2:1</a>f; <a onClick="return mV(\'Hsa\',14,5);">Ho 14:5</a>); plural (<a onClick="return mV(\'Sgs\',2,16);">So 2:16</a>; <a onClick="return mV(\'Sgs\',4,5);">4:5</a>; <a onClick="return mV(\'Sgs\',5,13);">5:13</a>; <a onClick="return mV(\'Sgs\',6,2);">6:2</a>f; <a onClick="return mV(\'Sgs\',7,2);">7:2</a>; Ecclesiasticus 39:14; 50:8); krinon (<a onClick="return mV(\'Mat\',6,28);">Mt 6:28</a>; <a onClick="return mV(\'Luk\',12,27);">Lu 12:27</a>)): The Hebrew is probably a loan word from the Egyptian the original s-sh-n denoting the lotus-flower, Nymphaea lotus. This was probably the model of the architectural ornament, translated "lily-work," which appeared upon the capitals of the columns in the temple porch (<a onClick="return mV(\'1Ki\',7,19);">1Ki 7:19</a>), upon the top of the pillars (<a onClick="return mV(\'1Ki\',7,22);">1Ki 7:22</a>) and upon the turned-back rim of the "molten sea" (<a onClick="return mV(\'1Ki\',7,26);">1Ki 7:26</a>).<P>Botanically the word shoshannah, like the similar modern Arabic Susan, included in all probability a great many flowers, and was used in a way at least as wide as the popular use of the English word "lily." The expression "lily of the valleys" (<a onClick="return mV(\'Sgs\',2,1);">So 2:1</a>) has nothing to do with the plant of that name; the flowers referred to appear to have been associated with the rank herbage of the valley bottoms (<a onClick="return mV(\'Sgs\',4,5);">So 4:5</a>); the expression "His lips are as lilies" (<a onClick="return mV(\'Sgs\',5,13);">So 5:13</a>) might imply a scarlet flower, but more probably in oriental imagery signifies a sweet-scented flower; the sweet scent of the lily is referred to in <span class="noTag">Ecclesiasticus 39:14, and in 50:8</span> we read of "lilies by the rivers of water." The beauty of the blossom is implied in <a onClick="return mV(\'Hsa\',14,5);">Ho 14:5</a>, where Yahweh promises that repentant Israel shall "blossom as the lily." A "heap of wheat set about with lilies" (<a onClick="return mV(\'Sgs\',7,2);">So 7:2</a>) probably refers to the smoothed-out piles of newly threshed wheat on the threshing-floors decorated by a circlet of flowers.<P>The reference of our Lord to the "lilies of the field" is probably, like the Old Testament references, quite a general one.<P>The Hebrew and the Greek very likely include not only any members of the great order Liliaceae, growing in Palestine, e.g. asphodel, squill, hyacinth, ornithogalum ("Star of Bethlehem"), fritillaria, tulip and colocynth, but also the more showy irises ("Tabor lilies" "purple irises," etc.) and the beautiful gladioli of the Natural Order. Irideae and the familiar narcissi of the Natural Order Amaryllideae.<P>In later Jewish literature the lily is very frequently referred to symbolically, and a lotus or lily was commonly pictured on several Jewish coins.``117';
isbe[5537]='Lily-Work`The ornament of the capitals on the bronze pillars, Jachin and Boaz, in front of Solomon\'s temple (<a onClick="return mV(\'1Ki\',7,19);">1Ki 7:19,22</a>).`<a href="./study/isbe/search.html?string=LILY">LILY</a>; <a href="./study/isbe/search.html?string=TEMPLE">TEMPLE</a>; <a href="./study/isbe/search.html?string=JACHIN+AND+BOAZ">JACHIN AND BOAZ</a>`1';
isbe[5538]='Lime`lim<P>(1) sidh; compare Arabic shad, "to plaster";<P>(2) gir; compare Arabic jir, "gypsum" or "quick-lime";<P>(3) \'abene-ghir):<P>Sidh is translated "lime" in <a onClick="return mV(\'Isa\',33,12);">Isa 33:12</a>, "And the peoples shall be as the burnings of lime, as thorns cut down, that are burned in the fire," and in <a onClick="return mV(\'Amo\',2,1);">Am 2:1</a>, "He burned the bones of the king of Edom into lime." It is translated "plaster" in <a onClick="return mV(\'Deu\',27,2);">De 27:2</a>, "Thou shalt set thee up great stones, and plaster them with plaster," also in <a onClick="return mV(\'Deu\',27,4);">De 27:4</a>. Gir is translated "plaster" in <a onClick="return mV(\'Dan\',5,5);">Da 5:5</a>, "wrote...upon the plaster of the wall." In <a onClick="return mV(\'Isa\',27,9);">Isa 27:9</a> we have, "He maketh all the stones of the altar as chalkstones" (\'abhene-ghir).<P>Everywhere in Palestine limestone is at hand which can be converted into lime. The lime-kiln is a thick-walled, cylindrical or conical, roofless structure built of rough stones without mortar, the spaces between the stones being plastered with clay. It is usually built on the side of a hill which is slightly excavated for it, so that the sloping, external wall of the kiln rises much higher from the ground on the lower side than on the upper. The builders leave a passage or tunnel through the base of the thick wall on the lower side. The whole interior is filled with carefully packed fragments of limestone, and large piles of thorny-burner and other shrubs to serve as fuel are gathered about the kiln. The fuel is introduced through the tunnel to the base of the limestone in the kiln, and as the fire rises through the mass of broken limestone a strong draft is created. Relays of men are kept busy supplying fuel day and night. By day a column of black smoke rises from the kiln, and at night the flames may be seen bursting from the top. Several days are required to reduce the sto
