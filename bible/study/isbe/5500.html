isbe[5581]='Lord\'s Prayer, the`(<a onClick="return mV(\'Mat\',6,\'9-13\');">Mt 6:9-13</a>; <a onClick="return mV(\'Luk\',11,\'2-4\');">Lu 11:2-4</a>): Prayer occupied an important place in the life and the teachings of Jesus. He was emphatically a man of prayer, praying frequently in private and in public, and occasionally spending whole nights in communion with His heavenly Father. He often spoke to His disciples on the subject of prayer, cautioning them against ostentation, or urging perseverance, faith and large expectation, and He gave them a model of devotion in the Lord\'s prayer.<P>1. Twofold Form:<P>This prayer is given by the evangelists in two different forms and in two entirely different con nections. In Matthew\'s account the prayer is given as a part of the Sermon on the Mount and in connection with a criticism of the ostentation usual in the prayers of the hypocrites and the heathen. Luke introduces the prayer after the Galilean ministry and represents it as given in response to a request from one of His disciples, "Lord teach us to pray, as John taught his disciples." It gives us, however, no note of time or place, and it is quite possible that the incident which it records took place much earlier. The later form is much shorter than that of Matthew and the common parts differ materially in language.<P>In view of the differences, the reader instinctively inquires whether the prayer was given on two different occasions in these different connections, or the evangelists have presented the same incident in forms derived from different sources, or modified the common source to suit their immediate purposes.<P>If the prayer was given only on one occasion, there is little doubt that Luke preserves the true historical circumstances, though not necessarily the accurate point of time or place, or the exact form of language. Such a request made at the close of the prayer of Jesus would be natural, and the incident bears every mark of reality. On the other hand, it would be reasonable to assume that the author of Matthew\'s source, remembering the incident, incorporated the prayer in the Sermon on the Mount as an illustration of the injunctions concerning prayer.<P>There are many reasons for regarding the Sermon as a collection of sayings spoken on different occasions and summarized for convenience in teaching and memorizing. There is, however, no proof that the prayer was given but once by Jesus. We need not suppose that His disciples were always the same, and we know that He gave instruction in prayer on various occasions. He may have given the model prayer on one occasion spontaneously and at another time on the request of a disciple. It is probable that the two evangelists, using the same or different sources, presented the prayer in such connection as best suited the plan of their narratives. In any case, it is rather remarkable that the prayer is not quoted or directly mentioned anywhere else in the New Testament.<P>2. Arrangement:<P>In addition to the opening salutation, "Our Father who art in heaven," the Lord\'s Prayer consists of six petitions. These are arranged in three equal parts. In the first part, the thought is directed toward God and His great purposes. In the second part, the attention is directed to our condition and wants. The two sets of petitions are closely related, and a line of progress runs through the whole prayer. The petitions of the first part are inseparable, as each includes the one which follows. As the hallowing of God\'s name requires the coming of His kingdom, so the kingdom comes through the doing of His will. Again, the first part calls for the second, for if His will is to be done by us, we must have sustenance, forgiveness and deliverance from evil. If we seek first the glory of God, the end requires our good. While we hallow His name we are sanctified in Him. The doxology of Matthew and our rituals is not found in the leading manuscripts and is generally regarded as an ancient liturgical addition. For this reason it is omitted by the Revised Version (British and American).<P>3. Sources:<P>The sources of the two accounts cannot be known with certainty. It is hardly correct to say that one account is more original than the other. The original was spoken in Aramaic, while both of the reports are certainly based on Greek sources. The general agreement in language, especially in the use of the unique term epiousios shows that they are not independent translations of the Aramaic original.<P>4. Special Expressions:<P>Three expressions of the prayer deserve special notice. The words, "Our Father," are new in the Bible and in the world. When God is called Father in the Old Testament, He is regarded as Father of the nation, not of the individual. Even in the moving prayer of <a onClick="return mV(\'Isa\',63,16);">Isa 63:16</a> (the King James Version), "Doubtless thou art our father," the connection makes clear that the reference is to God in the capacity of Creator. The thought of God as the Father of the individual is first reached in the Apocrypha: "O Lord, Father and Master of my life" (Sirach 23:1; compare The <span class="noTag">Wisdom of Solomon 2:16; 14:3</span>). Here also the notion is veiled in the thought of God as Creator. It was left for Jesus the Son to give us the privilege of calling God "Our Father."<P>Of the adjective epiousion, "daily" or "needful," neither the origin nor the exact meaning is or is likely to be known. Whether it is qualitative or temporal depends on its derivation from epeinai, or epienai. Our translators usually follow the latter, translating "daily." the American Standard Revised Version gives "needful" as a marginal rendering.<P>The phrase apo tou ponerou, is equally ambiguous. Since the adjective may be either masculine or neut., it is impossible to decide whether "from the evil one" or "from the evil" was intended. The probability is in favor of the masculine. The Oriental naturally thought of evil in the concrete, just as we think of it in the abstract. For this reason the Authorized rendering "from evil" is more real to us. The evil deprecated is moral, not physical.<P>5. Purpose: The Lord\'s Prayer was given as a lesson in prayer. As such this simple model surpasses all precepts about prayer. It suggests to the child of God the proper objects of prayer. It supplies suitable forms of language and illustrates the simple and direct manner in which we may trustingly address our heavenly Father. It embraces the elements of all spiritual desire summed up in a few choice sentences. For those who are not able to bring their struggling desires to birth in articulate language it provides an instructive form. To the mature disciple it ever unfolds with richer depths of meaning. Though we learn these words at our mother\'s knee, we need a lifetime to fill them with meaning and all eternity to realize their answer.<P>LITERATURE.<P>The literature of this subject is very extensive. For brief treatment the student will consult the relative sections in the commentaries on the Gospels of Matthew and Luke and in the Lives of Christ and the articles on the Lord\'s Prayer in the several Bible diets. A collection of patristic comment is given by G. Tillmann in his Das Gebet nach der Lehre der Heiligen dargestellt, 2 volumes, Freiburg, 1876. The original comments may be found in any of the standard collections of the Church Fathers.<P>Among historical studies may be mentioned, F.H. Chase, The Lord\'s Prayer in the Early Church, Cambridge,1891,and G. Dalman, Die Worte Jesu, I, Leipzig,1898,English translation, Edinburgh, 1902.<P>Among the numerous interpretative treatments, the following are some of the more important: N. Hall, The Lord\'s Prayer, Edinburgh, 1889; H.J. Van Dyke, The Lord\'s Prayer, New York, 1891; J. Ruskin, Letters to the Clergy on the Lord\'s Prayer and the Church, late edition, New York, 1896; E. Wordsworth, Thoughts on the Lord\'s Prayer, New York, 1898; C.W. Stubbs, Social Teachings of the Lord\'s Prayer, London, 1900; A.B. Bruce, The Training of the Twelve, chapter vi, 4th edition, New York, 1905; L.T. Chamberlain, The True Doctrine of Prayer, New York, 1906; F.M. Williams, Spiritual Instructions on the Lord\'s Prayer, New York, 1907.``121';
isbe[5582]='Lord\'s Supper; (Eucharist), 1`u\'-ka-rist<P><b>GENERAL</b><p><b>I. DEFINITION</b><P><b>II. NEW TESTAMENT SOURCES</b><P class="in15">1. Textual Considerations<P class="in15">2. Narratives Compared<P class="in30">(1) Mark<P class="in30">(2) Matthew<P class="in30">(3) Pauline<P class="in30">(4) Luke<P class="in15">3. Other Pauline Data<P><b>III. PREPARATION FOR THE EUCHARIST</b><P class="in15">1. Miracles of Loaves and Fishes<P class="in15">2. Discourse at Capernaum<P><b>IV. HISTORICAL SETTING OF THE EUCHARIST</b><P class="in15">1. Other Acts and Words of Christ on Eve of the Passion<P class="in15">2. Sacrificial Language of the Institution<P class="in15">3. Sacrificial System of Jewish Dispensation<P class="in15">4. Paschal Background of the Institution of the Eucharist<P><b>V. SEQUENCE OF THE INSTITUTION</b><P class="in15">Points to Be Noted<P><b>VI. THE CHURCH\'S OBSERVATIONS or THE EUCHARIST</b><P class="in15">1. Heavenly Background<P class="in30">(1) Christians a Priestly Race<P class="in30">(2) Christ, the Eternal High Priest<P class="in15">2. Celebrated Each Lord\'s Day<P class="in15">3. Names of the Eucharist<P class="in30">(1) Eucharist<P class="in30">(2) Lord\'s Supper<P class="in30">(3) Breaking of Bread<P class="in30">(4) Communion<P class="in30">(5) Oblation<P><b>VII. POST-APOSTOLIC CHURCH</b><P class="in15">1. Guidance by the Holy Spirit<P class="in15">2. The Early Fathers<P class="in30">(1) Ignatian Epistles<P class="in30">(2) Justin Martyr<P class="in30">(3) Irenaeus<P class="in30">(4) Cyprian<P><b>VIII. LITURGICAL TRADITION</b><P class="in15">1. Outline of Eucharistic Prayer<P class="in15">2. Significance of This for Unity<P><b>LITERATURE</b><hr .<<P>I. Definition.<P>Eucharist.—The distinctive rite of Christian worship, instituted by our Lord Jesus Christ upon the eve of His atoning death, being a religious partaking of bread and wine, which, having been presented before God the Father in thankful memorial of Christ\'s inexhaustible sacrifice, have become (through the sacramental blessing) the communion of the body and blood of Christ (compare <a onClick="return mV(\'Jhn\',6,54);">Joh 6:54</a>; <a onClick="return mV(\'Act\',2,42);">Ac 2:42</a>; <a onClick="return mV(\'Act\',20,7,11);">20:7,11</a>; <a onClick="return mV(\'Rom\',15,16);">Ro 15:16</a>; <a onClick="return mV(\'1Cr\',10,16);">1Co 10:16</a>; <a onClick="return mV(\'1Cr\',11,\'23-26\');">11:23-26</a>).<P>II. New Testament Sources.<P>The New Testament sources of our knowledge of the institution of the Eucharist are fourfold, a brief account thereof being found in each of the Synoptic Gospels and in Paul\'s First Epistle to the Corinthians (<a onClick="return mV(\'Mat\',26,\'26-29\');">Mt 26:26-29</a>; <a onClick="return mV(\'Mar\',14,\'22-25\');">Mr 14:22-25</a>; <a onClick="return mV(\'Luk\',22,\'14-20\');">Lu 22:14-20</a>; <a onClick="return mV(\'1Cr\',11,\'23-26\');">1Co 11:23-26</a>; compare <a onClick="return mV(\'1Cr\',10,16,17);">10:16,17</A>).<P>1. Textual Considerations:<P>The text of these narratives has been found to need little amendment, save the dropping of a word or two, from each account, that had crept in through the tendency of copyists, consciously or unconsciously, to assimilate the details of parallel passages. The genuineness of <a onClick="return mV(\'Luk\',22,19,20);">Lu 22:19,20</a> is absolutely beyond question. Their omission in whole or part, and the alterations in the order of two or three verses in the whole section (<a onClick="return mV(\'Luk\',22,\'14-20\');">22:14-20</A>), characteristic of a very small number of manuscripts, are due to confusion in the minds of a few scribes and translators, between the paschal cup (<a onClick="return mV(\'Luk\',22,17);">22:17</a>) and the eucharistic cup (<a onClick="return mV(\'Luk\',22,20);">22:20</a>), and to their well-meant, but mistaken, attempt to improve upon the text before them.<P>2. Narratives Compared:<P>(1) Mark:<P>The briefest account of the institution of the Eucharist is found in <a onClick="return mV(\'Mar\',14,\'22-24\');">Mr 14:22-24</a>. In it the Eucharist is not sharply distinguished from its setting, the paschal meal: "And as they were eating, he took bread, and when he had blessed, he brake it, and gave to them, and said, Take ye: this is my body. And he took a cup, and when he had given thanks, he gave to them: and they all drank of it. And he said unto them, This is my blood of the covenant, which is poured out for many." This represents a tradition settled within 20 years of the event described.<P>(2) Matthew:<P><a onClick="return mV(\'Mat\',26,\'26-28\');">Mt 26:26-28</a> gives a few touches by way of revision, apparently from one then present. He adds the exhortation "eat" at the giving of the bread, and puts the personal command, "Drink ye all of it," in place of the mere statement, "and they all drank of it." He adds also of the blood that, as "poured out for many," it is "unto remission of sins."<P>(3) Pauline:<P>The Pauline-account, <a onClick="return mV(\'1Cr\',11,\'23-26\');">1Co 11:23-26</a> (the earliest written down, circa 55 AD), was called forth in rebuke of the scandalous profanation of the Eucharist at Corinth. It gives us another tradition independent of; and supplementary to, that of Mark-Matthew. It claims the authority of the Savior as its source, and had been already made known to the Corinthians in the apostle\'s oral teaching. The time of the institution is mentioned as the night of the betrayal. We note of the bread, "This is my body, which is for you," of the cup, "This cup is the new covenant in my blood," and the redoubled command, "This do in remembrance of me."<P>(4) Luke:<P>The narrative given in <a onClick="return mV(\'Luk\',22,\'14-20\');">Lu 22:14-20</a> is the latest (circa 80 AD) of our New Testament records. Luke had taken pains to follow up everything to its source, and had reedited the oral tradition in the light of his historical researches (<a onClick="return mV(\'Luk\',1,2,3);">1:2,3</a>), and thus his account is of the highest value. Writing for a wider circle of readers, he carefully separates and distinguishes the Eucharist from the paschal meal which preceded it, and puts the statement of Christ about not drinking "from henceforth of the fruit of the vine, until the kingdom of God shall come," in its proper place as referring to the paschal cup (compare <a onClick="return mV(\'Mat\',26,29);">Mt 26:29</a>; <a onClick="return mV(\'Mar\',14,25);">Mr 14:25</a>; and <a onClick="return mV(\'Luk\',22,\'15-18\');">Lu 22:15-18</a>). In describing the actual institution of the Eucharist, he gives us an almost verbal identity with the account given by Paul (<a onClick="return mV(\'1Cr\',11,\'23-25\');">1Co 11:23-25</a>).<P>3. Other Pauline Data: We should note the statement appended by Paul to his account of the Institution, wherein he emphasizes the memorial aspect and evidential value of the witness the eucharistic observance would give throughout the ages of the Christian dispensation (<a onClick="return mV(\'1Cr\',11,26);">1Co 11:26</a>). We should also note the fact upon which the apostle bases his rebuke to the profane (Corinthians, namely, the real, though undefined, identity of the bread and wine of the Eucharist with the body and blood of Christ (<a onClick="return mV(\'1Cr\',11,\'27-29\');">1Co 11:27-29</a>); an identity established through the blessing pronounced upon them, so that the bread and cup have come to be the "communion of the body of Christ" and the "communion of the blood of Christ," respectively (<a onClick="return mV(\'1Cr\',10,\'15-17\');">1Co 10:15-17</a>). To receive the Eucharist, and also to partake of sacrifices offered to idols, is utterly incompatible with Christian loyalty. To receive the Eucharist after a gluttonous, winebibbing agape, not recognizing the consecrated elements to be what the Lord Christ called them, is, likewise, a defiance of God. Both acts alike provoke the judgment of God\'s righteous anger (<a onClick="return mV(\'1Cr\',10,21,22);">1Co 10:21,22</a>; <a onClick="return mV(\'1Cr\',11,21,22,27,28,29);">11:21,22,27-29</a>).<P>III. Preparation for the Eucharist.<P>The institution of the Eucharist had been prepared for by Christ through the object-lesson of the feeding of the five thousand (<a onClick="return mV(\'Mat\',14,\'13-21\');">Mt 14:13-21</a>; <a onClick="return mV(\'Mar\',6,\'35-44\');">Mr 6:35-44</a>; <a onClick="return mV(\'Luk\',9,\'12-17\');">Lu 9:12-17</a>; <a onClick="return mV(\'Jhn\',6,\'4-13\');">Joh 6:4-13</a>), which was followed up by the discourse about Himself as the Bread of Life, and about eating His Flesh and drinking His Blood as the nourishment of eternal life.<P>1. Miracles of Loaves and Fishes:<P>This again was clinched by the second object-lesson of the feeding of the four thousand afterward (<a onClick="return mV(\'Mat\',15,\'32-39\');">Mt 15:32-39</a>; <a onClick="return mV(\'Mar\',8,\'1-9\');">Mr 8:1-9</a>). The Lord Christ\'s thanksgiving, and His blessing of the loaves and fishes—acts not elsewhere recorded of Him, except at the institution of the Eucharist, and at the self-revealing meal at Emmaus (<a onClick="return mV(\'Luk\',24,30);">Lu 24:30</a>)—deeply impressed those present, as indicating the source whence came His power to satisfy the hunger of the multitude (compare <a onClick="return mV(\'Mat\',14,19);">Mt 14:19</a>; <a onClick="return mV(\'Mat\',15,36);">15:36</a>; <a onClick="return mV(\'Mar\',6,41);">Mr 6:41</a>; <a onClick="return mV(\'Mar\',8,6);">8:6,7</a>; <a onClick="return mV(\'Luk\',9,16);">Lu 9:16</a>; <a onClick="return mV(\'Jhn\',6,11,23);">Joh 6:11,23</a>).<P>2. Discourse at Capernaum:<P>In the discourse at Capernaum (<a onClick="return mV(\'Jhn\',6,\'26-58\');">Joh 6:26-58</a>) Christ led the thought of His hearers from earthly to heavenly food, from food that perished to the true bread from heaven. He declared Himself to be the living bread, and, further, that it is through eating His flesh and drinking His blood that they shall possess true life in themselves, and be raised by Him at the last day. The difficulties raised by this discourse Christ did not solve at the time. His ascension would but add to them. He asked of His disciples acceptance of His words in faith. Under the administration of the Spirit would these things be realized (<a onClick="return mV(\'Jhn\',6,\'60-69\');">Joh 6:60-69</a>). The institution of the Eucharist, later, gave the clue to these otherwise "hard" words. Today the Eucharist remains as the explanation of this discourse. A hardy mountaineer, e.g. who had read <a onClick="return mV(\'Jhn\',6,\'1-\');">Joh 6</a> many times, could form no notion of its purport. When first privileged to be present at the eucharistic service of the Book of Common Prayer, the meaning of feeding upon Christ\'s flesh and blood forthwith became apparent to him (see The Spirit of Missions, July, 1911, 572-73).<P>IV. Historical Setting of the Eucharist.<P>1. Other Acts and Words of Christ on Eve of the Passion:<P>We should note the setting in which the institution of the Eucharist was placed. Though the Fourth Gospel does not record this, it gives us many otherwise unknown data of the words of Christ spoken upon the eve of His death, in which historically the institution of the Eucharist was set. The symbolic washing of the feet of the disciples (<a onClick="return mV(\'Jhn\',13,\'3-10\');">Joh 13:3-10</a>), the "new" commandment (<a onClick="return mV(\'Jhn\',13,34);">Joh 13:34</a>), Christ as the means of access to the Father (<a onClick="return mV(\'Jhn\',14,6);">Joh 14:6</a>), love for Christ to be shown by keeping His commandments (<a onClick="return mV(\'Jhn\',14,15,21,23,24);">Joh 14:15,21,23,24</a>), the sending of the Paraclete Spirit (<a onClick="return mV(\'Jhn\',14,16,17,26);">Joh 14:16,17,26</a>; <a onClick="return mV(\'Jhn\',15,26);">15:26</a>; <a onClick="return mV(\'Jhn\',16,13,14);">16:13,14</a>), the intimate fellowship of Christ and His disciples, shown in the metaphor of the vine and its branches (<a onClick="return mV(\'Jhn\',15,\'1-9\');">Joh 15:1-9</a>,<a onClick="return mV(\'Jhn\',15,\'13-16\');">13-16</a>)—all these throw their illumination upon the commandment, "This do in remembrance of me" (<a onClick="return mV(\'Luk\',22,19);">Lu 22:19</a>; <a onClick="return mV(\'1Cr\',11,24,25);">1Co 11:24,25</a>). The efficacy of prayer \'in Christ\'s name\' (<a onClick="return mV(\'Jhn\',16,23,24,26,27,28);">Joh 16:23,24,26-28</a>) after His final withdrawal from the midst of His disciples, and His great prayer of self-oblation and intercession for His church throughout time (<a onClick="return mV(\'Jhn\',17,\'1-\');">Joh 17</a>, especially <a onClick="return mV(\'Jhn\',17,\'9-26\');">17:9-26</a>) must not be forgotten in considering, "This is my body which is given for you" (<a onClick="return mV(\'Luk\',22,19);">Lu 22:19</a>), and, "This is my blood of the covenant, which is poured out for many unto remission of sins" (<a onClick="return mV(\'Mat\',26,28);">Mt 26:28</a>).<P>2. Sacrificial Language of the Institution:<P>The sacrificial connotation of many of the words used in the narratives of institution should be noted: e.g. "body," "blood," "covenant," "given," "poured out," "for you," "for many" "unto remission of sins," "memorial" (compare <a onClick="return mV(\'Exd\',24,\'6-8\');">Ex 24:6-8</a>; <a onClick="return mV(\'Lev\',2,2,16);">Le 2:2,9,16</a>; <a onClick="return mV(\'Lev\',4,\'5-7\');">4:5-7</a>,<a onClick="return mV(\'Lev\',4,\'16-18\',34);">16-18,34</a>; <a onClick="return mV(\'Lev\',17,11,14);">17:11,14</a>; <a onClick="return mV(\'Lev\',24,7);">24:7</a>; <a onClick="return mV(\'Num\',10,10);">Nu 10:10</a>; <a onClick="return mV(\'Hbr\',9,\'11-28\');">Heb 9:11-28</a>; <a onClick="return mV(\'Hbr\',10,\'4-10\',19,20);">10:4-10,19,20</a>). The very elements of bread and wine also suggested the idea of sacrifice to those accustomed to their use in the older system of worship (compare <a onClick="return mV(\'Exd\',29,\'38-42\');">Ex 29:38-42</a>; <a onClick="return mV(\'Num\',15,\'4-10\');">Nu 15:4-10</a>; <a onClick="return mV(\'Num\',28,\'1-\');">28</a> and <a onClick="return mV(\'Num\',29,\'1-\');">29</a> passim).<P>3. Sacrificial System of Jewish Dispensation:<P>The general background, moreover, out of which the institution of the Eucharist stands forth, is the sacrificial system of the older dispensation. The chosen people of God, as a priestly race, a holy nation (<a onClick="return mV(\'Exd\',19,5,6);">Ex 19:5,6</a>; <a onClick="return mV(\'Deu\',7,6);">De 7:6</a>), worshipped God with a sequence of offerings, Divinely molded and inspired, which set forth the sovereign majesty and overloading of God, His holiness, and the awe and penitence due from those who would draw nigh unto Him, and their desire for communion with Him.<P>The more immediate background of the Eucharist is the Passover, and that without prejudice as to whether the Lord Christ ate the paschal meal with His disciples before He instituted the Eucharist, as seems most probable (compare <a onClick="return mV(\'Luk\',22,\'7-18\');">Lu 22:7-18</a>), or whether He died upon the day of its observance (see article "Preparation," DCG, II, 409).<P>4. Paschal Background of the Institution of the Eucharist:<P>The Passover was at once a covenant-recalling and a covenant-renewing sacrifice, and the Eucharist, as corresponding to it, was instituted at the time of its yearly observance, and of the immolation of the true paschal lamb, of whose death it interpreted the value and significance (<a onClick="return mV(\'Exd\',12,\'3-28\');">Ex 12:3-28</a>; compare <a onClick="return mV(\'Exd\',13,\'3-10\');">13:3-10</a>; <a onClick="return mV(\'Deu\',16,\'1-8\');">De 16:1-8</a>; <a onClick="return mV(\'1Cr\',5,7);">1Co 5:7</a>; <a onClick="return mV(\'Jhn\',6,51);">Joh 6:51</a>; <a onClick="return mV(\'Jhn\',10,10,11,15,17,18);">10:10,11,15,17,18</a>; <a onClick="return mV(\'Jhn\',15,13);">15:13</a>; <a onClick="return mV(\'Jhn\',17,19);">17:19</a>).<P>V. Sequence of the Institation.<P>Let us put before ourselves clearly the sequence of the Lord Christ\'s acts and words at the institution of the Eucharist ere we proceed to examine the church\'s mode of celebrating this ordinance.<P>Points to Be Noted<P>At the close of the paschal Supper,<P>(1) the Lord Christ "took" the bread and cup, respectively, for use in His new rite;<P>(2) He "gave thanks" over them, constituting them a thank offering to God;<P>(3) He "blessed" them to their new and higher potency;<P>(4) He "gave" them to the apostles (the breaking being a requisite preliminary to distribution of the bread);<P>(5) He bade them "Take, eat," and "Drink ye all of it," respectively;<P>(6) He declared, of the bread, "This is my body given for you," of the cup, "This is my blood of the covenant," or, "This is the new covenant in my blood which is poured out for you," "unto remission of sins";<P>(7) He adds the reiterated command, "This do for my memorial."<P>It is obvious that we are bidden to follow out the same series of acts, and statements, as those of Christ Himself. We should take bread and wine, set them apart by rendering thanks to God over them, presenting them to Him as symbols of Christ\'s body and blood, once for all "given" and "poured out" for us; bless them by asking God\'s blessing upon them (compare <a onClick="return mV(\'Gen\',14,19);">Ge 14:19</a>; <a onClick="return mV(\'Num\',6,\'23-27\');">Nu 6:23-27</a>; <a onClick="return mV(\'Mar\',8,7);">Mr 8:7</a>; <a onClick="return mV(\'Luk\',2,34);">Lu 2:34</a>; <a onClick="return mV(\'Luk\',9,16);">9:16</a>; <a onClick="return mV(\'Luk\',24,50);">24:50</a>); and receive and give them as the body and blood of Christ; for, "the cup of blessing which we bless, is it not a communion of the blood of Christ? The bread which we break, is it not a communion of the body of Christ?" (<a onClick="return mV(\'1Cr\',10,16);">1Co 10:16</a>). It is obvious that we shall not forget, in this connection, the distinction between the natural body of Christ which He took of the Blessed Virgin, and the bread which He held in His hand, and blessed and made to function as His body for our participation and inherence in Him thereby—His sacramental body. The church with her many members united to the Head, and thus to each other, is also called His body mystical (<a onClick="return mV(\'1Cr\',10,17);">1Co 10:17</a>; <a onClick="return mV(\'1Cr\',12,27);">12:27</a>; <a onClick="return mV(\'Eph\',1,22,23);">Eph 1:22,23</a>; <a onClick="return mV(\'Col\',1,24);">Col 1:24</a>).<P>VI. The Church\'s Observance of the Eucharist.<P>1. Heavenly Background:<P>(1) Christians a Priestly Race:<P>We should remember the priestly character of the church of Christ, whose sacrifices are made under the dispensation of the Holy Spirit (<a onClick="return mV(\'1Pe\',2,5,9);">1Pe 2:5,9</a>; <a onClick="return mV(\'Rev\',1,6);">Re 1:6</a>; compare <a onClick="return mV(\'Act\',1,2,8);">Ac 1:2,8</a>); and also the eternal priesthood in the heavens of our risen, ascended and ever-living Lord Christ.<P>(2) Christ the Eternal High Priest:<P>He laid down His life in order to take it again (<a onClick="return mV(\'Jhn\',10,17);">Joh 10:17</a>), and now in the perfection of His glorified human nature, by His very presence in heaven, He is forever the propitiation inexhaustible for our sins (<a onClick="return mV(\'Hbr\',2,\'17-\');">Heb 2:17</a>-<a onClick="return mV(\'Hbr\',3,1,2,3);">3:3</a>; <a onClick="return mV(\'Hbr\',4,\'14-\');">4:14</a>-<a onClick="return mV(\'Hbr\',5,\'1-10\');">5:10</a>; <a onClick="return mV(\'Hbr\',7,\'1-\');">7:1</a>-<a onClick="return mV(\'Hbr\',8,\'1-7\');">8:7</a>; <a onClick="return mV(\'Hbr\',9,\'11-28\');">9:11-28</a>; <a onClick="return mV(\'Hbr\',10,\'1-25\');">10:1-25</a>; compare <a onClick="return mV(\'1Jo\',2,1,2);">1Joh 2:1,2</a>). As the Lamb slain once for all but alive for evermore, the Lord Christ is the focus of the worship of angels and the redeemed (<a onClick="return mV(\'Rev\',1,17,18);">Re 1:17,18</a>; <a onClick="return mV(\'Rev\',5,\'6-14\');">5:6-14</a>; <a onClick="return mV(\'Rev\',7,9,10);">7:9,10</a>), and the Christian disciple has the privilege of feeding upon that eternal Priest and Victim (<a onClick="return mV(\'Hbr\',13,10);">Heb 13:10</a>; <a onClick="return mV(\'1Cr\',10,16);">1Co 10:16</a>).<P>2. Celebrated Each Lord\'s Day:<P>The celebration of the Eucharist was characteristic of the pentecostal church (<a onClick="return mV(\'Act\',2,42);">Ac 2:42</a>), especially upon the Lord\'s Day (<a onClick="return mV(\'Act\',20,7);">Ac 20:7</a>). Its observance was preceded by the agape (<a onClick="return mV(\'1Cr\',11,20,34);">1Co 11:20,34</a>) on the eve (for the circumstances of the institution were closely imitated, and the day was reckoned as beginning at sunset after the Jewish fashion), and thus the Eucharist proper came late into the night, or toward morning (<a onClick="return mV(\'Act\',20,11);">Ac 20:11</a>).<P>3. Names of the Eucharist:<P>(1) Eucharist:<P>The name "Eucharist" is derived from the eucharistesas ("gave thanks") of the institution and was the most widely used term in primitive times, as applied to the whole service, to the consecration of the bread and wine or to the consecrated elements themselves (compare <a onClick="return mV(\'1Cr\',14,16);">1Co 14:16</a>).<P>(2) Lord\'s Supper:<P>It should be noted that the name, "Lord\'s Supper," belongs to the agape rather than to the Eucharist; its popular use is a misnomer of medieval and Reformation times.<P>(3) Breaking of Bread:<P>The term "breaking of bread" (<a onClick="return mV(\'Act\',2,42);">Ac 2:42</a>; <a onClick="return mV(\'Act\',20,7,11);">20:7,11</a>) had little vogue after New Testament times.<P>(4) Communion:<P>"Communion" obviously is derived from <a onClick="return mV(\'1Cr\',10,16);">1Co 10:16</a>.<P>(5) Oblation:<P>In connection with the early and frequent use of the word "oblation" (prosphora) and its cognates, we should note Paul\'s description of his ministry in terms that suggest the rationale of the prayer of consecration, or eucharistic prayer, as we know it in the earliest liturgical tradition: "that I should be a minister of Christ Jesus unto the Gentiles, ministering the gospel of God, that the offering up of the Gentiles might be made acceptable, being sanctified by the Holy Spirit" (<a onClick="return mV(\'Rom\',15,16);">Ro 15:16</a>).<P>VII. Post-Apostolic Church.<P>1. Guidance by the Holy Spirit:<P>The same Spirit who guided the church in the determination of the Canon of the New Testament Scriptures, the same Spirit who guided the church in the working out of her explicit formulation of the Christian doctrine of the Godhead, and of the Christ—that self-same Spirit guided the church in the formation and fashioning of her great eucharistic prayer into its norm in the same 4th century. The historic churches of the East, by their faithful adherence to this norm, have been almost undisturbed by the dissensions and disputes of Western Christendom touching the Eucharist.<P>2. The Early Fathers:<P>The glimpses given us in the earlier Fathers of the Eucharist are in entire accord with the more articulate expression of the church\'s corporate eucharistic worship, which we find in the liturgical documents and writings of the Nicene era.<P>(1) Ignatian Epistles:<P>The Ignatian Epistles show us the Eucharist as the focus of the church\'s life and order, the source of unity and fellowship. The Eucharist consecrated by the prayer of the bishop and church is the Bread of God, the Flesh and Blood of Christ, the communication of love incorruptible and life eternal (compare Ephesians, 5, 13, 10; Trallians, 7, 8; Romans, 7; Philadelphians, 4; Smyrnaeans, 7, 8; Magnesians, 7).<P>(2) Justin Martyr:<P>Justin Martyr tells us that the Eucharist was celebrated on the Lord\'s Day, the day associated with creation and with Christ\'s resurrection. To the celebrant were brought bread and wine mixed with water, who then put up to God, over them, solemn thanksgiving for His lovingkindness in the gifts of food and health and for the redemption wrought by Christ. The oblations of bread and wine are presented to God in memorial of Christ\'s passion, and become Christ\'s body and blood through prayer. The Eucharist is a spiritual sacrifice of praise and thanksgiving commemorative of Christ\'s death; and the consecrated elements the communion of Christ\'s body and blood, by reason of the sacramental character bestowed upon them by the invocation of the Divine blessing (compare 1 Apol., 13, 15, 66, 67; Dial. with Trypho, 41,70, 117).<P>(3) Irenaeus:<P>Irenaeus, also, emphasizes the fact that Christ taught His disciples to offer the new oblation of the New Covenant, to present in thank offering the first-fruits of God\'s creatures—bread and wine—the pure sacrifice prophesied before by Malachi. The Eucharist consecrated by the church, through the invocation of God\'s blessing, is the communion of the body and blood of Christ, just as He pronounced the elements to be at the institution (compare Against Heresies, i.13, 1; iv.17, 5; 18,1-6; 33,1; v.22, 3).<P>(4) Cyprian:<P>Cyprian, too, gives evidence of the same eucharistic belief, and alludes very plainly to the "Lift up your hearts," to the great thanksgiving, and to the prayer of consecration. This last included the rehearsal of what Christ did and said at the institution, the commemoration of His passion, and the invocation of the Holy Spirit (compare Epistle to Caecilius, sections 1, 2, 4, 9, 10, 14, 17; Epistle to Epictetus, sections 2, 4; On the Unity of the Church, I, 17; On the Lord\'s Prayer, section 31; Firmilian to Cyprian, sections 10, 17).<P>VIII. Liturgical Tradition.<P>1. Outline of Eucharistic Prayer:<P>When we proceed to examine the early liturgical remains we find the articulate expression of the church\'s sacrifice following along these lines. After an introductory summons to the worshippers to "lift up their hearts," the great eucharistic prayer goes on to pour forth sublime praises to God for all the blessings of creation, and for the fruits of the earth; aligning the praises of the church with the worship of the heavenly host around the throne of God. The love of God in bringing about the redemption of fallen man through the incarnation, and through the self-oblation of His only Son upon the cross is then recalled in deep thankfulness. The institution of the Eucharist in the night of the betrayal is next related, and then, taking up, and fulfilling the command of Christ (\'Do this for my memorial\') therein recited, most solemn memorial is made before God, with the antitypical elements, of the death and of the victorious resurrection and ascension of the Lord Christ. Then, as still further carrying out this act of obedience, most humble prayer is made to the Eternal Father for the hallowing of the oblations, through the operation of the Holy Spirit, to be the body and blood of Christ, and to be to those who partake of them, for the imparting of remission of sins, and the bestowal of life eternal. To this great act of praise and prayer the solemn "Amen" of the assembled congregation assents, and thereafter the sacramental gifts are received by the faithful present, with another "Amen" from each recipient to whom they are administered.<P>The great eucharistic prayer, as outlined, was the first part of the liturgy to crystallize into written form, and of its component parts the invocation of the Divine blessing upon the elements was probably the first to be written down.<P>2. Significance of This for Unity:<P>Around the simplicity and the depth of such a truly apostolic norm of eucharistic worship, alone, can be gathered into one the now dispersed and divided followers of the Christ, for therein subsist in perfect harmony the Godward and the manward aspects of the memorial He commanded us to make as complementary, not contradictory; and the identity of the consecrated bread and wine with the body and blood of Christ is manifested to be in the realm of their spiritual function and potency.<P>LITERATURE.<P>E.F. Willis, The Worship of the Old Covenant...in Relation to That of the New; Frederic Rendall, Sacrificial Language of the New Testament; Maurice Goguel, L\'eucharistie des origines a Justin Martyr, 105ff; W.B. Frankland, The Early Eucharist (excellent); H.B. Swete, "Eucharistic Belief in the 2nd and 3rd Cents.," Journal of Theological Studies, June,1902,161ff; R.M. Woolley, The Liturgy of the Primitive Church; M. Lepin, L\'idee du sacrifice dans la religion chretienne; W. Milligan, The Ascension and Heavenly Priesthood of our Lord; Thomas Brett, A True Scripture Account of the Nature and benefits of the Holy Eucharist, 1736; id, A Discourse Concerning the Necessity of Discerning the Lord\'s Body in the Holy Communion, 1720; J.R. Milne, Considerations on Eucharistic Worship; id, The Doctrine and Practice of the Eucharist; H.R. Gummey, The Consecration of the Eucharist; A.J. Maclean, Recent Discoveries Illustrating Early Christian Life and Worship; id, The Ancient Church Orders; L. Duchesne, Origines du culte chretien; J.T. Levens, Aspects of the Holy Communion; John Wordsworth, The Holy Communion; F.E. Brightman, Liturgies, Eastern and Western.``70';
isbe[5583]='Lord\'s Supper; (Eucharist), 2`HISTORICAL<p>1. Original Institution<P>2. The Elements<P>3. The Eucharist in the Apostolic Church<P>4. The Eucharist in the Post-apostolic Church<P>5. Rome and the Eucharist<P>6. Luther and the Eucharist<P>7. Zwingli and the Eucharist<P>8. Calvin and the Eucharist<hr /><P>This name of the Lord\'s Supper is derived from eucharistia, the prayer of consecration, and this in turn points back to <a onClick="return mV(\'Mat\',26,27);">Mt 26:27</a>, "And he took a cup, and gave thanks" (eucharistesas). The most common name is "Lord\'s Supper" (deipnon kuriou (<a onClick="return mV(\'1Cr\',11,20);">1Co 11:20</a>)). It is also called "Lord\'s table" (trapeza kuriou (<a onClick="return mV(\'1Cr\',10,21);">1Co 10:21</a> the King James Version)); while the cup is called "the cup of blessing" (poterion tes eulogias (<a onClick="return mV(\'1Cr\',10,16);">1Co 10:16</a>)) and "the cup of the Lord" (poterion kuriou (<a onClick="return mV(\'1Cr\',10,21);">1Co 10:21</a>)). The word koinonia points both to the bread and the cup, whence our common term "communion." In post-apostolic days it became known as leitourgia, a sacred ministration, whence our word "liturgy." It was also named thusia, a sacrifice, and musterion, from its mystic character and perhaps from the fact that it was celebrated only in the closed circle of believers. The Roman Catholic church calls it missa or "mass," from the words congregatio missa est, whereby in post-apostolic times the first part of worship, called the missa cathechumenorum, was closed, and whereby the second part of worship was ushered in, known as the missa fidelium, the sacramental part of worship, only destined for believers.<P>1. Original Institution:<P>The origin of the Eucharist is described in <a onClick="return mV(\'Mat\',26,\'1-\');">Mt 26</a>; <a onClick="return mV(\'Mar\',14,\'1-\');">Mr 14</a>, and <a onClick="return mV(\'Luk\',22,\'1-\');">Lu 22</a>. Paul introduces his simple and comprehensive recital of the origin of the institution—the earliest written record of it—with the words: "For I received of the Lord that which also I delivered unto you" (<a onClick="return mV(\'1Cr\',11,23);">1Co 11:23</a>). A comparison between the Gospels and <a onClick="return mV(\'Exd\',12,\'1-\');">Ex 12</a> indicates a considerable modification of the original Passover ritual in the days of Jesus (see Smith\'s DB, article "Lord\'s Supper"). The composite Gospel-picture of the institution of the Eucharist shows us the Saviour in the deep consciousness of the catastrophe about to overwhelm Him, surrounded by treason on the part of Judas and a strange and total lack of appreciation of the true situation on the part of the other disciples. He had greatly \'desired to eat this passover with them before he suffered\' (<a onClick="return mV(\'Luk\',22,15);">Lu 22:15</a>), and yet they are wholly unresponsive, the chief question apparently in their minds being the old contention of rank and preeminence. Whether or not Judas was present at the eating of the Supper is a moot point, which we will not discuss here. Neither will we touch the question whether or not this Passover-meal was the true Jewish festive meal or an anticipation of it, called pascha only, in allusion to the great feast, which had brought the hundreds of thousands of Jews to Jerusalem (compare <a onClick="return mV(\'Mat\',26,\'1-\');">Mt 26</a>; <a onClick="return mV(\'Mar\',14,\'1-\');">Mr 14</a> with <a onClick="return mV(\'Jhn\',12,1);">Joh 12:1</a>; <a onClick="return mV(\'Jhn\',13,1,2,26);">13:1,2,29</a>; <a onClick="return mV(\'Jhn\',18,28);">18:28</a>; <a onClick="return mV(\'Jhn\',19,14,31);">19:14,31</a>).<P>Both Matthew and Mark leave the exact place of the institution of the Supper in the festive meal indefinite, "as they were eating" (<a onClick="return mV(\'Mat\',26,26);">Mt 26:26</a>; <a onClick="return mV(\'Mar\',14,22);">Mr 14:22</a>); the words of Luke, "after supper" (<a onClick="return mV(\'Luk\',22,20);">22:20</A>), may be a hint in regard to this matter (see <a onClick="return mV(\'Jhn\',13,1);">Joh 13:1</a>; <a onClick="return mV(\'1Cr\',11,25);">1Co 11:25</a>). But the custom of the early church of celebrating the Eucharist after the agape or "love feast" appears to be strong evidence that the original institution was separate from the paschal festival and followed it. The entire subject of the Eucharist has been called in question by the radical German critics, who point to the absence of the whole matter in John and to the omission of the words, "Do this in remembrance of me," in Matthew and Mark. Its occurrence in Luke is ascribed to Paul\'s influence over him and to his familiarity with the story of the institution as described by the apostle. But this position is utterly untenable in the light of the unquestioned fact that the Lord\'s Supper as a fixed part of worship was firmly established from the earliest days of the Christian church. The doctrine of Christ\'s vicarious suffering is nowhere so clearly enunciated as in the words of the institution of the Supper, "This is my body which is given for you" (<a onClick="return mV(\'Luk\',22,19);">Lu 22:19</a>); "This is my blood of the covenant, which is poured out for many unto remission of sins" (<a onClick="return mV(\'Mat\',26,28);">Mt 26:28</a>). Small wonder that those who have utterly done away with the doctrine of the vicarious atonement or of substitution should attack the historicity of the Eucharist and should seek by all means to wipe it from the record.<P>Jesus bids His followers to observe the new institution "in remembrance of" Him. As Dr. Bavinck says, "The Lord\'s Supper is instituted by Christ as a permanent benefit to His church; it is a blessing added to all other blessings to signify and to seal them" (Geref. Dogm., IV, 310).<P>2. The Elements:<P>As to the elements used in the original institution of the Supper, they were bread and wine. The bread of course was the unleavened bread of the Passover, during which feast every trace of leaven was removed (<a onClick="return mV(\'Exd\',12,19);">Ex 12:19</a>). The Eastern church, perhaps influenced by the bitter Ebionite spirit of the Judaizers, later adopted the use of common bread (koinos artos); the Western church used unleavened bread. Protestantism left the matter among the adiaphora.<P>As regards the wine, the matter has been in dispute from the beginning (see Kitto\'s Cyclopaedia of Biblical Literature). The early church always used mixed wine, wine and water, following the Jewish custom. Whether the wine used at the institution of the Lord\'s Supper was fermented or unfermented wine, must of course be determined by the Jewish Passover-customs prevailing at that time. The matter is in dispute and is not easily settled.<P>Modern Jews quite generally use raisin-wine, made by steeping raisins over night in water and expressing the juice the next day for use at the Passover-meal. The ancient Jews, we are told, used for this purpose a thick boiled wine, mixed with water (Mishna, Terumoth, xi). Whether oinos, the word used in the New Testament, stands literally, as the name indicates, for fermented wine, or figuratively for the mixed drinks, well known to ancient and modern Jews, is a debatable matter. As late as the 16th century the Nestorian Christians celebrated communion with raisin-wine, and the same is said of the Indian Christians ("St. Thomas Christians"). The word "new," used by Christ in <a onClick="return mV(\'Mat\',26,29);">Mt 26:29</a>, is believed by some to indicate the character of the wine used by Christ at the institution of the Eucharist, namely, the juice of grapes fresh pressed out (see Clem. Alex., Paed., xi). On the other hand the third Council of Braga explicitly forbade this practice as heretical. It is evident that the whole subject is shrouded in much mystery. Some ancient sects substituted an entirely different element, water and milk, for instance, being used (Epiph., Haer., xlix; Aug., Haer., xxviii). Such customs were utterly condemned by the Council of Braga (675 AD). In general, however, the Christian church, almost from the beginning, seems to have used fermented red wine, either mixed or pure, in the administration of the Eucharist, in order to maintain the correspondence between the symbol and the thing symbolized.<P>3. The Eucharist in the Apostolic Church:<P>Originally the apostolic church celebrated communion at every meeting for worship. They continued steadfastly in the apostle\'s teaching and fellowship, in the breaking of bread and the prayers (<a onClick="return mV(\'Act\',2,42,46);">Ac 2:42,46</a>). Very soon, however, if we may judge from the Acts and the Church Pauline Epistles, its administration was confined to the meeting on the first day of the week. The agape always preceded communion, and at some part of the service the believers, the sexes after the plan of the synagogue being separated, would salute each other with the "holy kiss" (philema hagion) (<a onClick="return mV(\'1Cr\',16,20);">1Co 16:20</a>; <a onClick="return mV(\'2Cr\',13,12);">2Co 13:12</a>). But the introduction of the sacrament, with all its accessories, had evidently occasioned grave abuses at Corinth (<a onClick="return mV(\'1Cr\',11,34);">1Co 11:34</a>). Paul corrects these in unmistakable language. Thus we received our first written record of the institution of the Supper. In Corinth it seems to have been restricted from the beginning to the first day of the week (<a onClick="return mV(\'Act\',20,7);">Ac 20:7</a>; <a onClick="return mV(\'1Cr\',16,2);">1Co 16:2</a>). By a slow transition the deipnon was transferred from the midnight hour to the morning. At least we find that Paul kept it after midnight at Troas (<a onClick="return mV(\'Act\',20,11);">Ac 20:11</a>). It would appear as if the apostle had also partaken of the Lord\'s Supper, together with his Christian companions, on board the ship, toward the close of his fateful trip on the Adriatic (<a onClick="return mV(\'Act\',27,35);">Ac 27:35</a>).<P>4. The Eucharist in the Post-apostolic Church:<P>In the post-apostolic church the Eucharist continued to be celebrated every Lord\'s day. But it separated itself from the preaching of the Word and from prayers, as in the previous period. It was invested with a mystic meaning, something too holy for the common eye, and thus the missa catechumenorum, the open church-meeting, was separated from the missa fidelium, the gathering of believers only, in which the Eucharist was celebrated. Bread, wine, oil, milk, honey, all the ingredients for the agape, from which the elements for the Supper were selected, were furnished by the free-will offerings of the believers. These were solemnly set apart by the officiating bishop with a consecrating prayer, eucharistia, and thus the sacrament obtained the name "Eucharist." The gifts themselves were called prosphorai, "oblations," or thusiai, "sacrifices." The sacrificial conception of the Supper was thus gradually created (Ign., Phil., iv; Smyrna, vii, viii; Justin, Apol., i. 66; Dial., xii. 70; Irenaeus, Adv. Haer., iv. 18,5). The Eucharist once being conceived as a sacrifice, the conception of the officiating bishop as a priest became logically inevitable. The Apostolical Constitutions, xliii (4) gives us a fair idea of the worship of the church, toward the close of the 3rd century. Even at that early day a well-developed ritual had replaced the simplicity of the worship of the apostolic days. In the African and Eastern churches, baptized children were allowed to partake of communion, through the fear engendered by <a onClick="return mV(\'Jhn\',6,53);">Joh 6:53</a>. The regenerative conception of baptism largely influenced this custom. The remnants of the consecrated elements were brought by the deacons to the sick and to imprisoned believers. We have not the space in a brief article like this to enter fully into the development of the doctrinal conception of the Supper as found in the Fathers. Suffice it to say that the symbolical and spiritual concept of the Eucharist, usually defined as the "dynamic" view of the Supper, was advocated by such men as Origen, Eusebius of Caesarea, Basil the Great, Gregory of Nazianzen and others. On the other hand Cyril, Gregory of Nyssa, Chrysostom and John Damascenus developed the "realistic" theory of the Eucharist, and this view again divided itself into the "diophysitic" theory, later called "consubstantiation," and the "monophysitic" theory, later known as "transubstantiation." Augustinns, the great Latin Father, knew nothing of theory of tran-substantiation. He taught that communion carries a blessing only for believers, while to the unbelieving it is a curse, and that the true eating of the body of Christ consists in believing (Serm. Ad Infantes, De Civ., x.6; xxii. 10; Tract. 25 in Joann.). Paschasins Radbert (died 865 AD) was the first fully to formulate the realistic view as the doctrine of the Romish church, and although the dynamic view triumphed for a while, the condemnation of Berengarius of Tours (died 1088 AD) proved that by the middle of the 11th century the realistic view of the Supper had become the generally accepted doctrine of the Eucharist.<P>5. Rome and the Eucharist:<P>The Romish church couches its doctrine of the Eucharist in the word "transubstantiation," which means the conversion of the substance of the elements used in the Eucharist. The word was first used by Hildebert of Tours (died 1134 AD) in a sermon. The doctrine of the Supper was finally fixed, together with the new term, by Pope Innocent III, at the Lateran Council 1215 AD. It was decided that the body and blood of Christ are truly contained in the sacrament of the altar, under the species of bread and wine, the bread being transubstantiated into the body and the wine into the blood of Christ, by the Divine power. This has been the Romish doctrine of the Supper ever since. The bread and wine are changed into the veritable body and blood of Christ, by the words of the institution. By the institution of the Supper, Christ made His disciples priests, wherefore the Eucharist may be administered only by an ordained priest. In the miracle of the sacrament, the "accidents" of the elements—bread and wine—remain, but they are no longer inherent in a subject, the substance in which they inhered being replaced by another. This new substance is the body and blood of Christ, which is hidden from observation under the appearance of the elements. The whole Christ is present in each of these elements, hence, it is not necessary to commune under both forms (sub utraque). In the Romish conception of the Supper communion with Christ is a secondary idea. The main idea is that of the transubstantiation itself, for the Supper is more a sacrifice than a sacrament; thus the mass becomes a sin offering. While it feeds faith, keeps us from mortal sin, wards off temporal punishment, unites believers, it also has a potency for those who are not present, and even for the dead in purgatory. Thus the mass became the very heart and center of the entire Romish cult (Conf. Trid., XIII, 21, 22; Cat. Rom., CXII, c. 4; Bellarm, De Sacr. Euch., I, iv; Moehler, Symb., section 34).<P>6. Luther and the Eucharist:<P>The Reformers rejected the doctrine of transubstantiation, the sacrificial conception of the Eucharist, the adoration of the "host," the withholding of the cup, the efficiency of the Eucharist in behalf of the dead, the entire Romish conception of the sacrament of the Supper. The original position of Luther, that the elements in the Supper were signs and seals of the remission of sins, was soon replaced by the doctrine of "consubstantiation." The bitter controversy with Carlstadt, and especially the failure of the Marburg Conference, drove Luther forever into the camp of the realists. As early as 1524 he had outlined his doctrine against Carlstadt. He placed himself squarely on the realistic conception of the words of the institution, and held that "the body of Christ in accordance with the will and omnipotence of God and its own ubiquity is really and substantially present in, with and under the Supper, even as His Divine nature is in the human as warmth is in the iron. Wherefore the Supper is physically partaken of by those who are unworthy, albeit to their own destruction" (Bavinck, Geref. Dogm., IV, 318). This doctrine has been fully developed by the Lutheran divines, and is till this day the view of the Lutheran church.<P>7. Zwingli and the Eucharist:<P>Zwingli essentially sided with Carlstadt in his controversy with Luther, whom he thereby greatly embittered. He interpreted the words of the institution—"this is"—as signifying "this stands for," "this signifies." This view was fully set forth in a letter to Matthew Alber at Reutlingen in 1524 and was given its final form in his dogmatic tract, Com. de vera et falsa rel. (1525), where he characterizes Luther\'s doctrine as "an opinion not only rustic but even impious and frivolous." The breach was widened by the Marburg Conference of 1529. Reduced to its last analysis, the eucharistic concept of Zwingli is that of a symbolical memorial of the suffering and death of Christ, although Zwingli does not deny that Christ is present to the eye of faith. On the contrary, He is enjoyed through the word and through faith, i.e. in a spiritual way. In the Supper we confess our faith, we express what that faith means to us, and we do it in memory of Christ\'s death (Oper., ii.1, 426; iii.239, 326, 459; iv.51, 68). The Zwinglian view has been consciously or unconsciously adopted by a very large portion of the Protestant church.<P>8. Calvin and the Eucharist:<P>Calvin\'s position on the doctrine of the Eucharist tends rather to the Lutheran than to the Zwinglian view. With Zwingli the sacrament is little more than a sign, with Calvin it is both a sign and a seal. The reality of communion with Christ and the benefits of His death, received by a living faith—all this is common to the Lutheran and the Calvinistic views. The Lord\'s Supper is far more than a mere memorial service, it is a marvelous means of grace as well. Calvin sides with Zwingli in denying all physical, local or substantial presence of Christ in the Eucharist. But he differs from him in making the eucharistic act far more than a confession of faith, and he lays far greater stress than Zwingli on the meaning of its true participation. With Luther he holds that Christ is truly present in the Supper, and he lays stress especially on the mystic union of the believer with Christ. In the Supper both the benefits of Christ\'s death and His glorious person are touched. But Christ does not descend in the Supper to the believer, but the latter ascends to Him in heaven. The central thought of the Calvinistic conception of the Supper is this, that the communicant, through the operation of the Holy Spirit, comes in spiritual contact with the entire person of Christ and that he is thus fed unto life eternal. Every close student of Calvin\'s works will have to admit that his ideas on the subject are somewhat involved and confusing. This is due no doubt to the mediating position he occupied between Luther and Zwingli. But his position as a whole is quite plain. All his followers agree in holding that (1) Christ is only spiritually present in the Supper; (2) that the participation in the benefits of the Supper must therefore be spiritual, although it is real, and (3) that only true communicants, by a living faith, can communicate therein, and that this participation in the atoning death of the Saviour is sealed to us by the use of the ordained signs of the sacrament.<P>Henry E. Dosker<hr /><P><b>LUTHERAN INTERPRETATION</b><p><b>I. THE TERM</b><P class="in15">1. The Derivation and Meaning<P class="in15">2. Synonyms<P><b>II. THE ORDINANCE</b></a><P class="in15">1. Source and Norm of the Doctrine of the Eucharist<P class="in15">2. Interpretation of the Eucharistic Texts<P class="in15">3. Doctrinal Contents of the Eucharistic Passages<P><b>III. DIFFICULTIES</b><P class="in15">1. Question of Possibility<P class="in15">2. The Place of Faith in the Sacrament<P class="in15">3. The Words of the Institution<hr /><P>I. The Term.<P>1. The Derivation and Meaning:<P>"Eucharist" is the anglicized form of the Greek noun eucharistia, which signifies "gratitude," "thanks," or "praise offering." The noun is derived from the verb eucharisteo, which, with the verb eulogeo of kindred meaning in <a onClick="return mV(\'Mat\',26,26,27);">Mt 26:26,27</a>; <a onClick="return mV(\'Mar\',14,22,23);">Mr 14:22,23</a>, is used to describe the action of the Lord in blessing the bread and wine at the institution of the Lord\'s Supper (<a onClick="return mV(\'Luk\',22,19);">Lu 22:19</a>; <a onClick="return mV(\'1Cr\',11,23);">1Co 11:23</a>). When used absolutely, as in these places, it signifies "the offering up of praise that is prompted by nothing else than God Himself and His revealed glory" (Cremer). The blessing of the physical elements was part of the sacramental action at subsequent celebrations of the ordinance (<a onClick="return mV(\'1Cr\',10,16);">1Co 10:16</a>), and thus eucharistia soon (2nd century) came to mean the blessed elements and the entire ordinance in which these were administered.<P>2. Synonyms:<P>Other Scriptural terms for the same ordinance are "Communion" (from koinonia, in the twofold sense indicated in <a onClick="return mV(\'1Cr\',10,16,17);">1Co 10:16,17</a>), "Lord\'s Supper" (kuriakon deipnon (<a onClick="return mV(\'1Cr\',11,20);">1Co 11:20</a>)), "Lord\'s Table" (trapeza kuriou (<a onClick="return mV(\'1Cr\',10,21);">1Co 10:21</a>)), "Breaking of Bread" (klasis tou artou (<a onClick="return mV(\'Act\',2,42);">Ac 2:42</a>)). The literature of the church developed a great many terms which emphasize one or the other feature of the ordinance. Luther, in his Small Catechism, adopts the name "Sacrament of the Altar," because it is administered at the altar. The Lutheran Confessions occasionally employ the term "mass," however, in the original meaning which the early church, not in that which the Roman church, connects with the term ("mass" derived either from missa, "things sent," because the materials for communion were sent to the place of celebration, or from missio, "a sending (away)," because worshippers who were not members, or minors, were dismissed from the service before the celebration of the Eucharist began; but see McClintock and Strong, Cyclop. of Biblical, Theol., and Eccles. Lit., V, 863).<P>II. The Ordinance.<P>1. Source and Norm of the Doctrine of the Eucharist:<P>The "seats of doctrine," i.e. the Scripture texts which must be employed for determining every essential part of the teaching of Scripture regarding the second sacrament of the Christian church, are the words of institution recorded in <a onClick="return mV(\'Mat\',26,\'26-28\');">Mt 26:26-28</a>; <a onClick="return mV(\'Mar\',14,\'22-24\');">Mr 14:22-24</a>; <a onClick="return mV(\'Luk\',22,19,20);">Lu 22:19,20</a>; <a onClick="return mV(\'1Cr\',11,\'23-25\');">1Co 11:23-25</a>. Valuable statements, chiefly concerning the proper use of the sacrament, are found in <a onClick="return mV(\'1Cr\',10,15);">1Co 10:15</a>ff; <a onClick="return mV(\'1Cr\',11,20);">11:20</a>ff. That these texts are disputed is no reason why a doctrine should not be established from them. No doctrine of the Christian religion could be established, if every text of Scripture had to be withdrawn from the argument, so soon as it had become disputed. <a onClick="return mV(\'Jhn\',6,\'32-59\');">Joh 6:32-59</a> does not treat of this ordinance, because<P>(1) the ordinance must be dated from the night of the betrayal, which was considerably after the Lord\'s discourse at Capernaum;<P>(2) because this passage speaks of "eating the flesh," not the body, of the Son of man, and of drinking "his blood," in such a manner that a person\'s eternal salvation is made to depend upon this eating and drinking. If this passage were eucharistic, infants, children, persons in durance among pagans, or temporarily deprived of the ministration of the Christian church, hence, unable to commune, could not be saved.<P>2. Interpretation of the Eucharistic Texts:<P>The exposition of the genuine eucharistic texts of Scripture is governed by the common law of Bible exegesis, namely, that every word and statement of Scripture must be understood in its proper and native sense, unless a plain and urgent reason compels the adoption of a figurative interpretation. The writers who have recorded the institution of the sacrament have given no hint that they wish to be understood figuratively. The solemn occasion—the Eucharist being the expression of the last will or testament of the Lord—forbids the use of figurative language (<a onClick="return mV(\'Gal\',3,15);">Ga 3:15</a>). The fact that a statement of Scripture transcends our natural powers of comprehension does not justify us in giving it a figurative meaning. If this rationalistic principle were to be applied in explaining Scripture, we could not retain a single revealed doctrine. Besides, those who have adopted a figurative interpretation are not agreed where to locate the figure in the words of institution. Some claim that the word touto, others that esti, others that to soma mou contain a figure, while still others would take the institutional words in their proper sense, but understand the entire ordinance figuratively.<P>3. Doctrinal Contents of the Eucharistic Passages:<P>The eucharistic passages contain:<p>(1) a statement fixing the time and occasion of the institution. It was "in the night in which he was betrayed," immediately before the beginning of the passio magna of Christ, and in connection with the celebration of the Jewish Passover (<a onClick="return mV(\'Mat\',26,17);">Mt 26:17</a>). The ordinance which Christ instituted was to take the place of the ancient Passover (<a onClick="return mV(\'1Cr\',5,7);">1Co 5:7</a>, which text Luther aptly renders: "We, too, have a passover, which is Christ crucified for us"). Jewish custom at the time of Christ seems to have allowed some latitude as regards the time for eating the paschal lamb. Thus the difference between John (<a onClick="return mV(\'Jhn\',18,28);">18:28</A>; <a onClick="return mV(\'Jhn\',19,42);">19:42</a>) and the synoptists is overcome. Our Lord was deeply stirred with thoughts of love and affection for His disciples at the time of the institution (<a onClick="return mV(\'Jhn\',13,1);">13:1</a>).<P>(2) An authoritative declaration of Christ, the God-man, fixing the constituent parts of the sacrament, and the essential features of the sacramental act (speciem actus). This declaration names:<P>(a) The elements of the sacrament, which are of two kinds: bread and wine (materia terrena), and the body and blood of the Lord (materia coelestis) (see Ireneus Adv. Haer., iv.34, 363, quoted in Form. Conc. Sol. Decl., Art. VII, <span class="noTag">number 14</span>, 649). There is no law laid down as regards the quality, form, or quantity of the bread (leavened or unleavened, round or oblong, in large loaves, cakes, or in wafer form ready for immediate distribution). Likewise the color and quality of the wine is left undefined. The expression gennema tes ampelou, "fruit of the vine" (<a onClick="return mV(\'Mat\',26,29);">Mt 26:29</a>), sanctions the use of any substance that has grown on the vine, has been pressed from grapes, and has the characteristics of the substance known as wine. That the wine used by the Lord at that season of the year and in accordance with Jewish custom was fermented wine, there can be no doubt (Hodge, Systematic Theol., III, 616). The use of unfermented wine is apt to introduce an element of uncertainty into the sacrament. The heavenly elements are defined thus: "My body, which is given for you," "my blood, which is shed for many." These terms signify the real, substantial, natural body of Christ, and His real, natural blood (Luther: "the true body and blood of our Lord "). Both the earthly and the heavenly elements are really present at the same time in every eucharistic act. To deny either the presence of real bread and wine at any stage during the eucharistic act, as the Roman doctrine of transubstantiation does (against <a onClick="return mV(\'1Cr\',11,26,28);">1Co 11:26,28</a>), or the real presence of the true body and blood of Christ, as reformed teaching does, is not doing justice to Scripture.<P>(b) The relation of the elements to one another: In offering the physical elements to the disciples the Lord employs the locutio exhibitiva, common to every language of men: He names that which is not seen while giving that which is seen. (" Here are your spices," says the grocer delivering the package containing them.) The locutio exhibitiva, except when used by a jester or dishonest person, always states a fact. The bread in the Eucharist is the body of Christ, the wine, likewise, is the blood of Christ. The relation is expressed in <a onClick="return mV(\'1Cr\',10,16,17);">1Co 10:16,17</a> by koinonia, "communion." This term is not the same as metocht, "participation," which would refer to the communicants (Plummer, HDB, III, 149). Koinonia declares a communion of the bread with the body, of the wine with the blood, of Christ. It is impossible to define the mode and manner of this communion of the earthly with the heavenly elements. Such terms as "consubstantiation," "impanation," "invination," are faulty attempts to define the undefinable. All we can assert is, that in a manner incomprehensible to us the body and blood of the Lord are in a sacramental union with the eucharistic bread and wine.<P>(c) The action required, namely, "take, eat"; "take, drink." These words refer to the distribution and reception of the sacramental elements. These are essential, the mode is not, unless one wishes to emphasize, e.g. by the breaking of the bread, the merely symbolical meaning of the entire ordinance. Accordingly, it is also immaterial whether the administrant place the elements into the hands of the communicant, who then conveys them to his mouth, or whether the administrant conveys the elements directly to the mouth of the communicant. The acts of distributing and receiving, however, extend to the entire sacramental substance, i.e. not the bread, or the wine, alone are distributed and received, but "in, with, and under the bread" the body, "in, with, and under the wine" the blood, of Christ. The eating and drinking in the Eucharist is of a peculiar kind. It differs from mere natural eating and drinking of common food, and from spiritual eating and drinking, which is a figurative expression signifying the believing appropriation of the Saviour\'s atoning work, and which can never be "for judgment." In natural eating and drinking there would be only bread and wine, not the body and blood of the Lord; in spiritual eating and drinking there would be only the merits of the Redeemer, not bread and wine. In sacramental eating and drinking both the bread and the body, the wine and the blood, of Christ, are sacramentally received, the earthly elements in a natural, the heavenly in a supernatural, undefinable manner, both, however, orally, and both by every communicant. For, according to <a onClick="return mV(\'1Cr\',11,29);">1Co 11:29</a>, also the unworthy communicant receives the Lord\'s body, and that for his judgment, "not discerning" it (the King James Version).<P>(d) The end and aim of the ordinance: The Lord says: "This do in remembrance of me." Paul says: "As often as ye eat this bread, and drink the cup, ye proclaim the Lord\'s death till he come." These words make the Eucharist an efficient means for strengthening the spiritual union of the disciples with the Lord until His second coming. They are a call for faith on the part of the communicants, and restrict admission to communion to the believing followers of the Lord. Worthy communicants are those who understand the meaning of Christ\'s sacrifice and hope for His return in glory. (Luther: "The sacrament is instituted for us Christians.") The duty of self-exploration enjoined upon communicants further emphasizes the purpose of this ordinance. Self-exploration embraces knowledge and acknowledgment of our sinful state, confidence in the ever-present forgiveness of God for Christ\'s sake, and a sincere purpose to forsake sin and grow in holiness. Accordingly, non-believers, morally irresponsible persons, and persons who lead offensive lives which they will not amend, cannot be admitted to communion (<a onClick="return mV(\'Mat\',7,6);">Mt 7:6</a>). In <a onClick="return mV(\'1Cr\',10,17);">1Co 10:17</a> Paul names another purpose: the strengthening of the bonds of brotherly love and fellowship by means of communion. Hence, unity of faith and active Christian charity are required in those who are to commune together (<a onClick="return mV(\'Mat\',5,23,24);">Mt 5:23,24</a>), and "close communion," not "open, or promiscuous communion" is in accord with the teaching of Scripture. In the absence of any fixed rule as to the frequency of a Christian\'s communing, the above reasons suffice to induce him to commune frequently ("as often as").<P>(3) An authoritative statement of Christ concerning the continued use of the sacrament (exercitium actus): "This do." This means<P>(a) that the action of Christ is to be repeated, i.e., bread and wine should be blessed, distributed and received. The blessing is called the consecration and consists in the reciting of a prayer and the words of the institution. Consecration has no magical effects, it does not produce the sacramental union. On the other hand, it is not a mere meaningless ceremony, but a solemn declaration that in accordance with the will of the Lord, bread and wine are now being separated from their common use, to be devoted to the use which the Lord commanded. It is also a prayer to the Lord to be present in the sacrament;<P>(b) that whenever disciples do as their Lord did, He will connect His body and blood with the earthly substances as He did at the first communion;<P>(c) that besides the blessing of the elements, only the giving, or distribution, and the taking, or reception, of the sacramental elements are proper and essential parts of a sacramental action. A true sacramental action is complete only where these three acts concur: consecration, distribution, reception, and outside of these acts nothing that may be done with the elements possesses the nature of a sacrament or a sacramental action. Offering the consecrated wafer for adoration is no part of the sacrament, but is a form of idolatry (artolatry), because there is no sacramental union except in the act of distributing and receiving the consecrated elements. The withdrawal of the cup from the lay communicants is an unwarranted mutilation of the sacrament (<a onClick="return mV(\'Mat\',26,27);">Mt 26:27</a>; <a onClick="return mV(\'Mar\',14,23);">Mr 14:23</a>). But the grossest perversion of the sacrament, and a standing reproach to the completeness of the atoning sacrifice of the Lord is the offering up of the consecrated elements as an unbloody sacrifice for the sins of the living and the dead, which is being done in the Roman mass (<a onClick="return mV(\'Hbr\',10,14,18);">Heb 10:14,18</a>).<P>III. Difficulties.<P>1. Question of Possibility:<P>"How can these things be?" This question might be raised against every doctrine of Scripture. The union of the natures in the God-man, the imputation of His merit to the believer, the quickening power of the word of Divine grace, the resurrection of the dead, etc., can all be subjected to the same questioning.<P>2. The Place of Faith in the Sacrament:<P>"Has faith no place in this sacrament?" Faith does not create, nor help to create the sacrament, neither the administrant\'s nor the communicant\'s faith. The sacrament is fully constituted in all its parts by the institutional act of the Lord and by His command to continue the observance of it. Man\'s faith cannot make, man\'s unbelief cannot unmake, an ordinance of God. But faith is necessary in order that a communicant may receive the blessings offered in the Eucharist, and testify to his believing relation to the Lord and to his Christian fellowship with the brethren. The sacrament bestows no blessing ex opere operato, i.e. by the mere mechanical performance of the physical act.<P>3. The Words of the Institution:<P>"Are the words of the institution part of the sacred text?" Up to the age of Paulus, they were universally regarded so, and the critical labors of Briggs, P. Gardner, Grafe, Immer, Julicher, etc., which can readily be explained by theological position of these men, lack unity of result and are offset by the labors of Scrivener, Schultzen, R.A. Hoffman, Blass, Beyschlag, etc. Christianity as yet sees no reason for discarding the words of the institution and for discontinuing the Eucharist as a Divine ordinance.<P>W. H. T. Dau<hr /><P><b>ACCORDING TO THE BELIEF AND PRACTICE OF THE CHURCH OF THE BRETHREN (DUNKERS)</b><p><b>I. THE LAST SUPPER WAS NOT THE JEWISH PASSOVER</b><P class="in15">1. Date<P class="in15">2. Doctrinal<P class="in15">3. Tradition<P><b>II. THE PERPETUATION OF THE LAST SUPPER</b><P><b>III. PRACTICE OF THE CHURCH OF THE BRETHREN</b><P><b>IV. THE MEANING AND SIGNIFICANCE OF THE LOVE FEAST</b><P><b>LITERATURE</b><P><hr />The interest of this denomination in the Lord\'s Supper as related to the Passover consists in two points:<P>(1) that the "Lord\'s Supper" was not the Jewish Passover, but was eaten the evening before the Jewish feast; and<P>(2) that this "Last Supper" was intended to be perpetuated. This is perpetuated by the Church of the Brethren under the name of "Love Feast" (see <a href="./study/isbe/search.html?string=AGAPE">AGAPE</a>).<P>I. The Last Supper Was Not the Jewish Passover.<P>1. Date:<P>John gives five distinct intimations of the date:<P>(1)) "Now before the feast of the passover" (Pro de tes heortes tou pascha; <a onClick="return mV(\'Jhn\',13,1);">Joh 13:1</a>). This shows that the washing of the disciples\' feet, and the discourses at the Last Supper were before the Passover.<P>(2) "Buy what things we have need of for the feast" agorason hon chreian echomen eis ten heorten; <a onClick="return mV(\'Jhn\',13,29);">Joh 13:29</a>). This shows that the Supper (daiphon) was not the Passover feast heorten).<P>(3) "They lead Jesus therefore from Caiaphas into the Pretorium; and it was early; and they themselves entered not into the Pretorium, that they might not be defiled, but might eat the passover" (hina phagosin to pascha; <a onClick="return mV(\'Jhn\',18,28);">Joh 18:28</a>). This was after the Supper, early on the day of crucifixion, before the Passover.<P>(4) "Now it was the Preparation of the passover: it was about the sixth hour" (en de paraskeue tou pascha; <a onClick="return mV(\'Jhn\',19,14);">Joh 19:14</a>). This again shows conclusively that the Passover was not yet eaten. Jesus is before Pilate; it is the day of the crucifixion, and after the Last Supper.<P>(5) "The Jews therefore, because it was the Preparation, that the bodies should not remain on the cross upon the sabbath (for the day of that sabbath was a high day)," <a onClick="return mV(\'Jhn\',19,31);">Joh 19:31</a>, etc. Here we have again a reference to the Preparation (paraskeue tou pascha), and also to the Sabbath which, in this case was a "high day" (en gar megale he hemera ekeinou tou sabbatou). This shows that the Passover was eaten on Friday evening after sunset on the 15th of Nisan at the beginning of the Jewish Sabbath. Whenever the Passover fell upon the Sabbath, that Sabbath was a "high day."<P>2. Doctrinal:<P>Christ is our Passover: died at the time the Passover lamb was slain, hence, after the Last Supper.<P>(1) Christ died at the time the Passover lamb was slain on Friday afternoon, the 14th of Nisan, and thus became Our Passover (<a onClick="return mV(\'1Cr\',5,7);">1Co 5:7</a>), "For our passover also hath been sacrificed, even Christ."<P>(2) Jesus, the "Lamb of God" (<a onClick="return mV(\'Jhn\',1,29);">Joh 1:29</a>) corresponds to the Passover lamb (<a onClick="return mV(\'Exd\',12,3);">Ex 12:3</a>). "Without blemish" (<a onClick="return mV(\'Exd\',12,5);">Ex 12:5</a>) = Jesus, "who did no sin" (<a onClick="return mV(\'1Pe\',2,\'22-24\');">1Pe 2:22-24</a>). The blood of a lamb sprinkled upon houses (<a onClick="return mV(\'Exd\',12,7,13);">Ex 12:7,13</a>) corresponds to salvation by the blood of Jesus (<a onClick="return mV(\'1Jo\',1,\'7-9\');">1Joh 1:7-9</a>).<P>(3) Jesus arose the third day and became "the first-fruits of them that are asleep" (<a onClick="return mV(\'1Cr\',15,4,20,23);">1Co 15:4,20,23</a>). The resurrection was on the first day of the week. The sheaf, or first-fruits, was gathered on the 16th of Nisan. Therefore Jesus must have died on Friday the 14th of Nisan, when the Passover lamb was slain; hence, after the Last Supper.<P>3. Tradition:<P>All the early traditions, both Jewish and Christian, agree that Jesus was crucified on the day of Preparation of the Passover, and they distinguish between the Passover and the Last Supper which was eaten the evening before the Jewish feast.<P>II. The Perpetuation of the Last Supper.<P>(1) Since the Last Supper was a new institution, there is no more reason for perpetuating one part than another. It is a unit, and each event of that night has its meaning and place.<P>(2) Jesus commanded the disciples to perpetuate feet-washing (see <a href="./study/isbe/search.html?string=WASHING+OF+FEET">WASHING OF FEET</a>) (<a onClick="return mV(\'Jhn\',13,14,15,17);">Joh 13:14,15,17</a>), and likewise He commanded the Eucharist to be perpetuated as a memorial of Him (<a onClick="return mV(\'1Cr\',11,24,25);">1Co 11
