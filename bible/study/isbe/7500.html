isbe[7568]='Sadducees`sad\'-u-sez (tsadduqim; Saddoukaioi):<P><b>I. INTRODUCTORY</b><P class="in15">1. Name: Rival Etymologies. Probably from Zadok the High Priest<P class="in15">2. Authorities: New Testament, Josephus, Talmud (primary), Church Fathers (secondary)<P><b>II. ORIGIN AND HISTORY</b><P class="in15">1. Early Notices in Josephus: Alleged Relation to Differences between Prophets and Priests<P class="in15">2. Tendencies of Sadducees toward Hellenism as Causing Rise of Chacidhim<P class="in15">3. Favored by Alexander Janneus: Put in the Background by Alexandra Salome<P class="in15">4. From a Political Party, but also Became a Religious Party<P class="in15">5. Fear Roman Interference if Jesus\' Messianic Claims Are Recognized<P class="in15">6. Sadducees Antagonistic to the Apostles: Pharisees More Favorable<P class="in15">7. Fall of Sadducean Party at Outbreak of Jewish War<P><b>III. DOCTRINES OF THE SADDUCEES</b><P class="in15">1. Laid Stress on Ceremonial Exactness<P class="in15">2. Disbelief in the Spiritual World, in a Resurrection, and in Providence: Their Materialism<P class="in15">3. Alleged Belief in Canonicity of the Pentateuch Alone<P class="in15">4. Relation to Epicureanism<P><b>IV. CHARACTER OF SADDUCEES</b><P class="in15">1. Characterized as Rough and Boorish<P class="in15">2. Talmudic Account of the Sadducees<P class="in15">3. Relation to Temple and Worship was a Heathenish One<P class="in15">4. Sadducean Literature<P><b>V. RELATION OF SADDUCEES TO JESUS</b><P class="in15">1. Less Denounced by Jesus than the Pharisees<P class="in15">2. Attitude of Sadducees to Jesus<hr /><P>This prominent Jewish sect, though not so numerous as their opponents, the Pharisees, by their wealth and the priestly descent of many of them had an influence which fully balanced that of their more popular rivals. They were a political party, of priestly and aristocratic tendency, as against the more religious and democratic Pharisees.<P>I. Introductory.<P>1. Name: Rival Etymologies. Probably from Zadok the High Priest:<P>The Talmud form suggests derivation from the name of their founder, but the form in New Testament and Josephus would imply connection with the verb "to be righteous." The probability is, that the name is derived from some person named "Zadok." The most prominent Zadok in history was the Davidic high priest (<a onClick="return mV(\'2Sa\',8,17);">2Sa 8:17</a>; <a onClick="return mV(\'2Sa\',15,24);">15:24</a>; <a onClick="return mV(\'1Ki\',1,35);">1Ki 1:35</a>), from whom all succeeding high priests claimed to descend. It is in harmony with this, that in the New Testament the Sadducees are the party to whom the high priests belonged. On the authority of \'Abhoth de-Rabbi Nathan (circa 1000 AD) another Zadok is asserted to be he from whom the Sadducees received their name. He was a disciple of Antigonus of Socho (circa 250 BC) who taught that love to God should be absolutely disinterested (Pirqe \'Abhoth, i.3). \'Abhoth de-Rabbi Nathan\'s account of the derivation of the Sadduceanism from this teaching is purely an imaginary deduction (Charles Taylor, Sayings of the Jewish Fathers(2), 112). The majority of authoritative writers prefer to derive the name from Zadok, the colleague of Abiathar, the contemporary of David.<P>2. Authorities: New Testament, Josephus, Talmud (primary), Church Fathers (secondary):<P>Our main authorities for the teaching of the Sadducees are the New Testament and Josephus. According to the former, the Sadducees denied the resurrection of the body, and did not believe in angels or spirits (<a onClick="return mV(\'Mat\',22,23);">Mt 22:23</a>; <a onClick="return mV(\'Act\',23,8);">Ac 23:8</a>). More can be learned from Josephus, but his evidence is to be received with caution, as he was a Pharisee and, moreover, had the idea that the Sadducees were to be paralleled with the Epicureans. The Talmud is late. Before even the Mishna was committed to writing (circa 200 AD) the Sadducees had ceased to exist; before the Gemara was completed (circa 700 AD) every valid tradition of their opinions must have vanished. Further, the Talmud is Pharisaic. The Fathers, Origen, Hippolytus, Epiphanius and Jerome, have derived their information from late Pharisaic sources.<P>II. Origin and History.<P>1. Early Notices in Josephus: Alleged Relation to Differences between Prophets and Priests:<P>Josephus describes the Sadducees along with the contemporary sects, the Pharisees and the Essenes (Josephus, Ant, XIII, v, 9; X, vi 2; XVIII, i, 4, 5; BJ, II, viii, 14). His earliest notice of them is after his account of the treaties of Jonathan with the Romans and the Lacedemonians. He indicates his belief that the parties were ancient; but if so, they must have formerly had other names. It has been suggested that the earlier form of the conflict between the Sadducees and Pharisees was opposition between the priests and the prophets. This, however, is not tenable; in the Southern Kingdom there was no such opposition; whatever the state of matters in the Northern Kingdom, it could have had no influence on opinion in Judea and Galilee in the time of our Lord. By others the rivalry is supposed to be inherited from that between the scribes and the priests, but Ezra, the earliest scribe, in the later sense of the term, was a priest with strong sacerdotal sympathies.<P>2. Tendencies of Sadducees toward Hellenism as Causing Rise of Chacidhim:<P>Probably the priestly party only gradually crystallized into the sect of the Sadducees. After the return from the exile, the high priest drew to himself all powers, civil and religious. To the Persian authorities he was as the king of the Jews. The high priest and those about him were the persons who had to do with the heathen supreme government and the heathen nationalities around; this association would tend to lessen their religious fervor, and, by reaction, this roused the zeal of a section of the people for the law. With the Greek domination the power of the high priests at home was increased, but they became still more subservient to their heathen masters, and were the leaders in the Hellenizing movement. They took no part in the Maccabean struggle, which was mainly supported by their opponents the chacidhim, as they were called (the Hasideans of 1Macc 2:42, etc.). When the chacidhim, having lost sympathy with the Maccabeans, sought to reconcile themselves to the priestly party, Alcimus, the legitimate high priest, by his treachery and cruelty soon renewed the breach. The Hasmoneans then were confirmed in the high-priesthood, but were only lukewarmly supported by the chacidhim.<P>3. Favored by Janneus: Put in the Background by Alexandra Salome:<P>The division between the Hasmoneans and the chacidhim, or, as they were now called, Pharisees, culminated in the insult offered by Eleazar to John Hyrcanus, the Hasmonean high priest (Josephus, Ant, XIII, x, 5). Alexander Janneus, the son of Hyrcanus, became a violent partisan of the Sadducees, and crucified large numbers of the Pharisees. Toward the end of his life he fell out of sympathy with the Sadducees, and on his deathbed recommended his wife Alexandra Salome, who as guardian to his sons succeeded him, to favor the Pharisees, which she did. In the conflict between her two sons, John Hyrcanus II and Aristobulus II, the Sadducees took the side of Aristobulus, the younger and abler brother. So long as the contest was between Jews, the Sadducean candidate prevailed. When the Romans were called in, they gave the advantage to Hyrcanus.<P>4. From a Political, Become Also a Religious Party:<P>Thrown into the background by the overthrow of their candidate for the high-priesthood, they soon regained their influence. They allied themselves with the Herodiana who had supported Hyrcanus, but were subservient to Rome. Though they were not theological at first, they became so, to defend their policy against the attacks of the Pharisees. A historic parallel may be found in the Cavaliers of the reign of Charles I, as over against the Puritans.<P>5. Fear Roman Interference if Jesus\' Messianic Claims Are Recognized:<P>The Sadducees at first regarded the struggle between our Lord and the Pharisees as a matter with which they had no concern. It was not until our Lord claimed to be the Messiah, and the excitement of the people consequent on this proved likely to draw the attention of the Roman authorities, that they intervened. Should Tiberius learn that there was widespread among the Jews the belief in the coming of a Jewish king who was to rule the world, and that one had appeared who claimed to be this Messiah, very soon would the quasi-independence enjoyed by the Jews be taken from them, and with this the influence of the Sadducees would depart. An oligarchy is proverbially sensitive to anything that threatens its stability; a priesthood is unmeasured in its vindictiveness; and the Sadducees were a priestly oligarchy. Hence, it is not wonderful that only the death of Jesus would satisfy them.<P>6. Sadducees Antagonistic to the Apostles: Pharisees More Favorable:<P>After the resurrection, the Pharisees became less hostile to the followers of Christ; but the Sadducees maintained their attitude of suspicion and hatred (<a onClick="return mV(\'Act\',4,1);">Ac 4:1</a>). Although a Pharisee, it was as agent of the Sadducean high priest that Paul persecuted the believers. The Sadducees gained complete ascendancy in the Sanhedrin, and later, under the leadership of Annas, or as he is sometimes called by Josephus, Ananus, the high priest, they put James the brother of our Lord to death (Josephus, Ant, XX, ix, 1) with many others, presumably Christians. The Pharisees were against these proceedings; and even sent messengers to meet Albinus who was coming to succeed Festus as governor to entreat him to remove Annas from the highpriesthood.<P>7. The Fall of Sadducean Party at Outbreak of Jewish War:<P>With the outbreak of the Jewish war, the Sadducees with their allies the Herodians were driven into the background by the Zealots, John of Gischala and Simon ben Gioras. Annas and Joshua, also called high priest by Josephus, were both put to death by the Zealots and their Idumean allies (Josephus, BJ, IV, v, 2). With the destruction of the temple and the fall of the Jewish state the Sadducean party disappeared.<P>III. Doctrines of the Sadducees.<P>1. Laid Stress on Ceremonial Exactness:<P>As the sacerdotal party, the Sadducees laid great stress on the ceremonial of sacrifice, and rejected the changes introduced by their opponents unless these found support in the words of the Law.<P>2. Disbelief in the Spiritual World, in a Resurrection, and in Providence: Their Materialism:<P>The most prominent doctrine of the Sadducees was the denial of the immortality of the soul and of the resurrection of the body. The Pharisees believed that Moses had delivered these doctrines to the elders, and that they had in turn handed them on to their successors. The Sadducees rejected all these traditions. From Acts (<a onClick="return mV(\'Act\',23,8);">23:8</a>) we learn that they believed in neither "angel or spirit." As appearances of angels are mentioned in the Law, it is difficult to harmonize their reverence for the Law with this denial. They may have regarded these angelophanies as theophanies. Josephus distinctly asserts (Ant., XVIII, i, 4) that the Sadducees believe that the soul dies with the body. They deny, he says, divine providence (BJ, II, viii, 14). Their theology might be called "religion within the limits of mere sensation."<P>3. Alleged Belief in Canonicity of the Pentateuch Alone:<P>The Fathers, Hippolytus, Origen and Jerome, credit the Sadducees with regarding the Pentateuch as alone canonical (Hipp., Haer., ix.24; Orig., Contra Celsum, i.49; on <a onClick="return mV(\'Mat\',22,\'24-31\');">Mt 22:24-31</a>; Jerome on <a onClick="return mV(\'Mat\',22,31,32);">Mt 22:31,32</a>). This idea may be due to a false identification of the views of the Sadducees with those of the Samaritans. Had they rejected all the rest of Scripture, it is hardly possible that Josephus would have failed to notice this. The Talmud does not mention this among their errors. It is certain that they gave more importance to the Pentateuch than to any other of the books of Scripture. Hence, our Lord, in the passage commented on by Origen and Jerome, appeals to the Law rather than to the Prophets or the Psalms. It follows from the little value they put upon the Prophets that they had no sympathy with the Messianic hopes of the Pharisees.<P>4. Relation to Epicureanism:<P>It need hardly be said that there was no real connection between Sadduceanism and the doctrines of Epicurus. There was a superficial resemblance which was purely accidental. Their favor for Hellenism would give a color to this identification.<P>IV. Character of Sadducees.<P>1. Characterized as Rough and Boorish:<P>Josephus says that while the Pharisees have amiable manners and cultivate concord among all, the Sadducees are "very boorish" (BJ, II, viii, 14). This want of manners is not a characteristic usually associated with an aristocracy, or with supple diplomats, yet it suits what we find in the New Testament. The cruel horseplay indulged in when our Lord was tried before the irregular meeting of the Sanhedrin (<a onClick="return mV(\'Mat\',26,67,68);">Mt 26:67,68</a>), the shout of Ananias at the trial of Paul before the same tribunal to "smite him on the mouth," show them to be rough and overbearing. What Josephus relates of the conduct of Annas (or Ananus) in regard to James, above referred to, agrees with this. Josephus, however, does not always speak in such condemnatory terms of Ananus—in Josephus, Jewish Wars (IV, v, 2) he calls him "a man venerable and most just." Only the violence which, as Josephus relates in the chapter immediately preceding that from which we have quoted, Ananus resorted to against the Zealots better suits the earlier verdict of Josephus than the later. As to their general character Josephus mentions that when the Sadducees became magistrates they conformed their judgments to Pharisaic opinion, otherwise they would not have been tolerated (Ant., XVIII, i, 4).<P>2. Talmudic Account of the Sadducees:<P>As noted above, the Talmud account is untrustworthy, late and Pharisaic. The Gemara from which most of the references are taken was not committed to writing till 7 centuries after Christ—when the traditions concerning the Sadducees, such as had survived, had filtered through 20 generations of Pharisaism. Despite this lengthened time and suspicious medium, there may be some truth in the representations of the Talmudic rabbin. In Pesachim 57a it is said, "Woe\'s me on account of the house of Boothus, woe\'s me on account of their spears; woe\'s me on account of the house of Hanun (Annas), woe\'s me on account of their serpent brood; woe\'s me on account of the house of Kathros, woe\'s me on account of their pen; woe\'s me on account of the house of Ishmael ben Phabi; woe\'s me on account of their fists. They are high priests and their sons are treasurers of the temple, and their sons-in-law, assistant treasurers; and their servants beat the people with sticks." As these are Sadducean names, this passage exhibits Pharisaic tradition as to the habits of the Sadducees.<P>3. Relation to Temple and Worship a Heathenish One:<P>The Sadducean high priests made Hophni and Phinehas too much their models. Annas and his sons had booths in the courts of the temple for the sale of sacrificial requisites, tables for money-changers, as ordinary coins had to be changed into the shekels of the sanctuary. From all these the priests of the high-priestly caste derived profit at the expense of desecrating the temple (Edersheim, Life and Times of Jesus, I, 371ff). They did not, as did the Pharisees, pay spiritual religion the homage of hypocrisy; they were frankly irreligious. While officials of religion, they were devoid of its spirit. This, however, represents their last stage.<P>4. Sadducean Literature:<P>The favor for the memory of John Hyrcanus shown by the writer of 1Maccabees (16:23,24) renders probable Geiger\'s opinion that the author was a Sadducee. He shows the party in its best form: his outlook on life is eminently sane, and his history is trustworthy. He has sympathy with the patriotism of the Hasideans, but none with the religious scruples which led them to desert Judas Maccabeus. That the writer of Ecclesiasticus from his silence as to the national expectation of a Messiah and the hope of a future life was also a Sadducee, is almost certain.<P>V. Relation of Sadducees to Jesus.<P>1. Less Denounced by Jesus than the Pharisees:<P>As the doctrines and practices of the Sadducees were quite alien from the teaching of our Lord and the conduct He enjoined, it is a problem why He did not denounce them more frequently than He did. Indeed He never denounces the Sadducees except along with their opponents the Pharisees; whereas He frequently denounces the Pharisees alone. As His position, both doctrinal and practical, was much nearer that of the Pharisees, it was necessary that He should clearly mark Himself off from them. There was not the same danger of His position being confused with that of the Sadducees. Josephus informs us that the Sadducees had influence with the rich; Jesus drew His adherents chiefly from the poor, from whom also the Pharisees drew. The latter opposed Him all the more that He was sapping their source of strength; hence, He had to defend Himself against them. Further, the Gospels mainly recount our Lord\'s ministry in Galilee, whereas the Sadducees were chiefly to be found in Jerusalem and its neighborhood; hence, there may have been severe denunciations of the Sadducees that have not come down to us.<P>2. Attitude of Sadducees to Jesus:<P>The Sadducees probably regarded Jesus as harmless fanatic who by His denunciations was weakening the influence of the Pharisees. Only when His claim to be the Messiah brought Him within the sphere of practical politics did they desire to intervene. When they did determine to come into conflict with Jesus, they promptly decreed His arrest and death; only the arrest was to be secret, "lest a tumult arise among the people" (<a onClick="return mV(\'Mat\',26,5);">Mt 26:5</a>). In their direct encounter with our Lord in regard to the resurrection (<a onClick="return mV(\'Mat\',22,25);">Mt 22:25</a>ff; <a onClick="return mV(\'Mar\',12,20);">Mr 12:20</a>ff; <a onClick="return mV(\'Luk\',20,29);">Lu 20:29</a>), there is an element of contempt implied in the illustration which they bring, as if till almost the end they failed to take Him seriously.`<a href="./study/isbe/search.html?string=PHARISEES">PHARISEES</a>`173';
isbe[7569]='Sadduk`sad\'-uk (Codex Alexandrinus (Fritzsche), Saddoukos; Codex Vaticanus Saddouloukos; the King James Version Sadduc): The high priest, an ancestor of Ezra (1Esdras 8:2) = "Zadok" in <a onClick="return mV(\'Ezr\',7,2);">Ezr 7:2</a> = "Sadoc" in 2Esdras 1:1.``1';
isbe[7570]='Sadoc`sa\'-dok:<P>(1) (Latin Sadoch): An ancestor of Ezra (2Esdras 1:1) = "Zadok" in <a onClick="return mV(\'Ezr\',7,2);">Ezr 7:2</a> = "Sadduk" in 1Esdras 8:2.<P>(2) (Sadok): A descendant of Zerubbabel and ancestor of Jesus (<a onClick="return mV(\'Mat\',1,14);">Mt 1:14</a>).``1';
isbe[7571]='Saffron`saf\'-run (karkom; krokos): Identical with the Arabic kurqum, the same as za\'faran, "saffron." The source of the true saffron is Crocus sativus (Natural Order, Indaceae), a plant cultivated in Palestine; there are 8 wild varieties in all of which, as in the cultivated species, the orange-colored styles and stigmas yield the yellow dye, saffron. <a onClick="return mV(\'Sgs\',4,14);">So 4:14</a> probably refers to the C. sativus. There is a kind of bastard saffron plant, the Carthamus tinctorius (Natural Order, Compositae), of which the orange-colored flowers yield a dye like saffron.``117';
isbe[7572]='Sail; Sailor`sal, sal\'-er.`<a href="./study/isbe/search.html?string=SHIPS+AND+BOATS">SHIPS AND BOATS</a>`1';
isbe[7573]='Saints`sants: In the King James Version 3 words are thus rendered:<P>(1) qadhosh (in Daniel the same root occurs several times in its Aramaic form, qaddish);<P>(2) chacidh, and<P>(3) hagioi.<P>Of these words (2) has in general the meaning of righteousness or goodness, while (1) and (3) have the meaning of consecration and divine claim and ownership. They are not primarily words of character, like chacidh, but express a relation to God as being set apart for His own. Wherever qadhosh refers to angels, the rendering "holy one" or "holy ones" has been substituted in the Revised Version (British and American) for the King James Version "saint" or "saints," which is the case also in <a onClick="return mV(\'Psa\',106,16);">Ps 106:16</a> margin (compare <a onClick="return mV(\'Psa\',34,9);">34:9</a>), and in <a onClick="return mV(\'1Sa\',2,9);">1Sa 2:9</a>, as the translation of chacidh.<P>While hagioi occurs more frequently in the New Testament than does qadhosh in the Old Testament, yet both are applied with practical uniformity to the company of God\'s people rather than to any individual. Perhaps the rendering "saints" cannot be improved, but it is necessary for the ordinary reader constantly to guard against the idea that New Testament saintship was in any way a result of personal character, and consequently that it implied approval of moral attainment already made. Such a rendering as "consecrate ones," for example, would bring out more clearly the relation to God which is involved, but, besides the fact that it is not a happy translation, it might lead to other errors, for it is not easy to remember that consecration—the setting apart of the individual as one of the company whom God has in a peculiar way as His own—springs not from man, but from God Himself, and that consequently it is in no way something optional, and admits of no degrees of progress, but, on the contrary, is from the beginning absolute duty. It should also be noted that while, as has been said, to be a saint is not directly and primarily to be good but to be set apart by God as His own, yet the godly and holy character ought inevitably and immediately to result. When God consecrates and claims moral beings for Himself and His service, He demands that they should go on to be fit for and worthy of the relation in which He has placed them, and so we read of certain actions as performed "worthily of the saints" (<a onClick="return mV(\'Rom\',16,2);">Ro 16:2</a>) and as such "as becometh saints" (<a onClick="return mV(\'Eph\',5,3);">Eph 5:3</a>). The thought of the holy character of the "saints," which is now so common as almost completely to obscure the real thought of the New Testament writers, already lay in their thinking very close to their conception of saintship as consecration by God to be His own.``51';
isbe[7574]='Sala, Salah`sa\'-la (shelach, "a missile," "petition"; Sala): A son of Arpachshad (the King James Version <a onClick="return mV(\'Gen\',10,24);">Ge 10:24</a>; <a onClick="return mV(\'Gen\',11,13);">11:13</a>ff; <a onClick="return mV(\'1Ch\',1,18,24);">1Ch 1:18,24</a>). <a onClick="return mV(\'Luk\',3,35,36);">Lu 3:35,36</a> follows the Septuagint of <a onClick="return mV(\'Gen\',10,24);">Ge 10:24</a>; <a onClick="return mV(\'Gen\',11,12);">11:12</a> = <a href="./study/isbe/search.html?string=SHELAH">SHELAH</a> (which see).``1';
isbe[7575]='Salamiel`sa-la\'-mi-el (Codex Vaticanus Salamiel; Codex Alexandrinus Samamiel): An ancestor of Judith (Judith 8:1) = the King James Version "Samuel" = "Shelumiel."``1';
isbe[7576]='Salamis`sal\'-a-mis (Salamis):<P>1. Site:<P>A town on the east coast of Cyprus, situated some 3 miles to the north of the medieval and modern Famagusta. It lay near the river Pediaeus, at the eastern extremity of the great plain of the Mesorea, which runs far into the interior of the island toward Nicosia (Lefkosia), the present capital. It possessed a good harbor and was the most populous and flourishing town of Cyprus in the Hellenic and Roman periods, carrying on a vigorous trade with the ports of Cilicia and Syria. Its population was mixed, consisting of Greek and Phoenician elements. The former, however, gave its tone and color to the city, and the chief cult and temple were those of Salaminian Zeus.<P>2. Early History:<P>Tradition represented Salamis as rounded soon after the fall of Troy by Teucer, the prince of Greek archers according to the narrative of the Iliad, who named it after his home, the island of Salamis off the Attic coast. In the 6th century BC it figures as an important Hellenic city, ruled by a line of kings reputed to be descended from Teucer and strengthened by an alliance with Cyrene (Herodotus iv.162). Gorgus, who was on the throne in 498 BC, refused to join the Ionic revolt against Persia, but the townsmen, led by his brother Onesilus, took up arms in the struggle for freedom. A crushing defeat, however, inflicted udder the walls of Salamis, restored the island to its Persian overlords, who reinstated Gorgus as a vassal prince (Herodotus v.103ff). In 449 a Greek fleet under Athenian leadership defeated the Phoenician navy, which was in the service of Persia, off Salamis; but the Athenian withdrawal which followed the battle led to a decided anti-Hellenic reaction, until the able and vigorous rule of the Salaminian prince Euagoras, who was a warm friend of the Athenians (Isocrates, Euag.) and a successful champion of Hellenism. In 306 a second great naval battle was fought off Salamis, in which Demetrius Poliorcetes defeated the forces of Ptolemy I (Soter), king of Egypt. But 11 years later the town came into Ptolemy\'s hands and, with the rest of the island, remained an appanage of the Egyptian kingdom until the incorporation of Cyprus in the Roman Empire (58 BC).<P>3. Visit of the Apostles:<P>When Barnabas and Paul, accompanied by John Mark, set out on their 1st missionary journey, they sailed from Seleucia, the seaport of Antioch, and landed at Salamis, about 130 miles distant, as the harbor nearest to the Syrian coast. There they preached the gospel in the "synagogues of the Jews" (<a onClick="return mV(\'Act\',13,5);">Ac 13:5</a>); the phrase is worth noting as pointing to the existence of several synagogues and thus of a large Jewish community in Salamis. Of work among the Gentiles we hear nothing, nor is any indication given either of the duration of the apostles\' visit or of the success of their mission; but it would seem that after a short stay they proceeded "through the whole island" (<a onClick="return mV(\'Act\',13,6);">Ac 13:6</a> the Revised Version (British and American)) to Paphos. The words seem to imply that they visited all, or at least most, of the towns in which there were Jewish communities. Paul did not return to Salamis, but Barnabas doubtless went there on his 2nd missionary journey (<a onClick="return mV(\'Act\',15,39);">Ac 15:39</a>), and tradition states that he was martyred there in Nero\'s reign, on the site marked by the monastery named after him.<P>4. Later History:<P>In 116 AD the Jews in Cyprus rose in revolt and massacred 240,000 Greeks and Romans. The rising was crushed with the utmost severity by Hadrian. Salamis was almost depopulated, and its destruction was afterward consummated by earthquakes in 332 and 342 AD. It was rebuilt, though on a much smaller scale, by the emperor Constantius II (337-61 AD) under the name Constantia, and became the metropolitan see of the island. The most famous of its bishops was Epiphanius, the staunch opponent of heresy, who held the see from 367 to 403. In 647 the city was finally destroyed by the Saracens. Considerable remains of ancient buildings still remain on the site; an account of the excavations carried on there in 1890 by Messrs. J. A.R. Munro and H.A. Tubbs under the auspices of the Cyprus Exploration Fund will be found in the Journal of Hellenic Studies, XII, 59-198.``176';
isbe[7577]='Salasadai`sal-a-sad\'-a-i (Codex Alexandrinus Salasadai; Codex Vaticanus Sarasadai, Sarisadai): An ancestor of Judith (Judith 8:1).``1';
isbe[7578]='Salathiel`sa-la\'-thi-el:<P>(1) (Salathiel): the King James Version; Greek form of "Shealtiel" (thus the Revised Version (British and American)). The father of Zerubbabel (1Esdras 5:5,48,56; 6:2; <a onClick="return mV(\'Mat\',1,12);">Mt 1:12</a>; <a onClick="return mV(\'Luk\',3,27);">Lu 3:27</a>).<P>(2) Revised Version: Another name of Esdras (2Esdras 3:1, "Salathiel").``1';
isbe[7579]='Sale`sal (mimkar): The word is used:<p>(1) in the sense of the transaction (<a onClick="return mV(\'Lev\',25,50);">Le 25:50</a>);<p>(2) in the sense of the limit of time involved in the transaction (<a onClick="return mV(\'Lev\',25,27);">Le 25:27</a>);<p>(3) in the sense of the price paid in the transaction (<a onClick="return mV(\'Deu\',18,8);">De 18:8</a>), though it may be the same as (1) above.``1';
isbe[7580]='Salecah; Salcah, Salchah`sal\'-e-ka, sal\'-ka (calekhah; Codex Vaticanus Sekchai, Acha, Sela Codex Alexandrinus Elcha, Aselcha, Selcha): This place first appears in <a onClick="return mV(\'Deu\',3,10);">De 3:10</a> as marking the eastern boundary of Bashan. It is named as one of the cities in which Og, king of Bashan, ruled (<a onClick="return mV(\'Jos\',12,5);">Jos 12:5</a>). It must certainly have been included in the portion given to the half-tribe of Manasseh, "all the kingdom of Og king of Bashan," although it is not named among the cities that fell to him (<a onClick="return mV(\'Jos\',13,29);">Jos 13:29</a>). At a later time we are told that Gad dwelt over against the Reubenites in the land of Bashan unto Salecah (<a onClick="return mV(\'1Ch\',5,11);">1Ch 5:11</a>). The boundaries of the tribes probably changed from time to time.<P>The ancient city is represented by the modern Qalkhad, a city in a high and strong position at the southern end of Jebel ed-Druze (the Mountain of Bashan). On a volcanic hill rising some 300 ft. above the town, in what must have been the crater, stands the castle. The view from the battlements, as the present writer can testify, is one of the finest east of the Jordan, including the rich hollow of the Chauran, Mt. Hermon, and all the intervening country to the mountains of Samaria, with vast reaches of the desert to the south and to the east. The old Roman roads are still clearly seen running without curve or deviation across the country to Bozrah and Der\'ah, away to the Southeast over the desert to Kal\'at el-\'Azraq, and eastward to the Persian Gulf. The castle was probably built by the Romans. Restored by the Arabs, it was a place of strength in Crusading times. It has now fallen on evil days. The modern town, containing many ancient houses, lies mainly on the slopes Southeast of the castle. The inhabitants are Druzes, somewhat noted for turbulence.<P>In the recent rising of the Druzes (1911) the place suffered heavily from bombardment by the Turks. For water-supply it is entirely dependent on cisterns filled during the rainy season.``54';
isbe[7581]='Salem (1)`sa\'-lem (shalem; Salem): The name of the city of which Melchizedek was king (<a onClick="return mV(\'Gen\',14,18);">Ge 14:18</a>; <a onClick="return mV(\'Hbr\',7,1,2);">Heb 7:1,2</a>; compare <a onClick="return mV(\'Psa\',76,2);">Ps 76:2</a>).<P>1. Identification and Meaning:<P>To all appearance it lay near "the Vale of Shaveh," described as "the King\'s Vale." The general opinion among the Jews was that Salem was the same as Jerusalem, as stated by Josephus (Ant., I, x, 2), who adds (VII, iii, 2) that it was known as Solyma (Saluma, variants, according to Whiston, Salem and Hierosolyma) in the time of Abraham. It was also reported that the city and its temple were called Solyma by Homer, and he adds that the name in Hebrew means "security." This identification with Jerusalem was accepted by Onkelos and all the Targums, as well as by the early Christians. The Samaritans have always identified Salem with Salim, east of Nablus, but Jewish and Christian tradition is more likely to be correct, supported, as it is, by <a onClick="return mV(\'Psa\',76,2);">Ps 76:2</a>.<P>2. Testimony of Tell el-Amarna Tablets:<P>The testimony of the Tell el-Amarna Letters is apparently negative. Knudtzon\'s number 287 mentions "the land" and "the lands of Urusalim," twice with the prefix for "city"; number 289 likewise has this prefix twice; and number 290 refers to "the city" or "a city of the land Urusalim called Bit-Ninip" Tablets (Beth-Anusat (?)). As there is no prefix of any kind before the element salim, it is not probable that this is the name of either a man (the city\'s founder) or a god (like the Assyrian Sulmanu). The form in Sennacherib\'s inscriptions (compare Taylor Cylinder, III, 50), Ursalimmu, gives the whole as a single word in the nominative, the double "m" implying that the "i" was long. As the Assyrians pronounced "s" as "sh", it is likely that the Urusalimites did the same, hence, the Hebrew yerushalaim, with "sh".`<a href="./study/isbe/search.html?string=JERUSALEM">JERUSALEM</a>`136';
isbe[7582]='Salem (2)`(Salamos; the King James Version Salum): An ancestor of Ezra (1Esdras 8:1) = "Shallum" in <a onClick="return mV(\'Ezr\',7,2);">Ezr 7:2</a> = "Salemas" in 2Esdras 1:1.``1';
isbe[7583]='Salemas`sal\'-e-mas, sa-le\'-mas (Latin Salame; the King James Version Sadamias): An ancestor of Ezra (2Esdras 1:1) = "Shallum" in <a onClick="return mV(\'Ezr\',7,2);">Ezr 7:2</a>; called also "Salem" in 1Esdras 8:1.``1';
isbe[7584]='Salim`sa\'-lim (Saleim): A place evidently well known, since the position of Aenon, the springs where John was baptizing, was defined by reference to it: they were "near to Salim" (<a onClick="return mV(\'Jhn\',3,23);">Joh 3:23</a>). It must be sought on the west of the Jordan, as will be seen from comparison of <a onClick="return mV(\'Jhn\',1,28);">Joh 1:28</a>; <a onClick="return mV(\'Jhn\',3,26);">3:26</a>; <a onClick="return mV(\'Jhn\',10,40);">10:40</a>. Many identifications have been proposed: e.g. that of Alford with Shilhim and Ain in the South of Judah; that of Busching with \'Ain Karim, and that of Barclay, who would place Salim in Wady Suleim near \'Anata, making Aenon the springs in Wady Far\'ah. These are all ruled out by their distance from the district where John is known to have been at work. If there were no other objection to that suggested by Conder (Tent Work, 49f) following Robinson (BR, III, 333) with Salim in the plain east of Nablus, Aenon being \'Ainun in Wady Far\'ah, it would be sufficient to say that this is in the very heart of Samaria, and therefore impossible. In any case the position of Aenon, 6 miles distant, with a high ridge intervening, would hardly be defined by the village of Salim, with the important city of Shechem quite as near, and more easily accessible.<P>Onomasticon places Aenon 8 Roman miles South of Scythopolis (Beisan), near Salumias (Salim) and the Jordan. This points to Tell Ridhghah, on the northern side of which is a shrine known locally as Sheikh Selim. Not far off, by the ruins of Umm el-\'Amdan, there are seven copious fountains which might well be called Aenon, "place of springs."<P>There is reason to believe that this district did not belong to Samaria, but was included in the lands of Scythopolis, which was an important member of the league of ten cities.``54';
isbe[7585]='Salimoth`sal\'-i-moth (Codex Vaticanus Saleimoth; Codex Alexandrinus \'Assalimoth; the latter is due to a wrong division of syllables; the King James Version Assailmoth): The same as "Shelomith" (<a onClick="return mV(\'Ezr\',8,10);">Ezr 8:10</a>). Salimoth, the son of Josaphias, of the family of Banias, and with him 130 men went up to Jerusalem with Ezra (1Esdras 8:36).``1';
isbe[7586]='Sallai`sal\'-a-i, sal\'-i (callay; Salom; Codex Alexandrinus Salo, with variants):<P>(1) Eponym of a Benjamite family which settled at Jerusalem after the return, descendants of "Sallu" (<a onClick="return mV(\'1Ch\',9,7);">1Ch 9:7</a>; <a onClick="return mV(\'Neh\',11,7,8);">Ne 11:7,8</a>); the pedigrees of Sallu differ decidedly in the two passages. Curtis (ICC) suggests that "son of Hodaviah, the son of Hassenuah" (Chronicles) is a corruption or derivation of "Judah the son of Hassenuah" (Nehemiah).<P>(2) Name of a priestly family (<a onClick="return mV(\'Neh\',12,20);">Ne 12:20</a>), called "Sallu" in <a onClick="return mV(\'Neh\',12,7);">Ne 12:7</a>.``1';
isbe[7587]='Sallu`sal\'-u.`<a href="./study/isbe/search.html?string=SALLAI">SALLAI</a>`1';
isbe[7588]='Sallumus`sa-lu\'-mus, sal\'-u-mus Salloumos): One of the porters who had taken "strange wives" (1Esdras 9:25) = "Shallum" in <a onClick="return mV(\'Ezr\',10,24);">Ezr 10:24</a>; called also "Salum" in 1Esdras 5:28.``1';
isbe[7589]='Salma`sal\'-ma.`<a href="./study/isbe/search.html?string=SALMON">SALMON</a>`1';
isbe[7590]='Salmai`sal\'-mi, sal\'-ma-i (salmay; the King James Version, Shalmai (the King James Version in <a onClick="return mV(\'Neh\',7,48);">Ne 7:48</a> is "Shalmai" = <a onClick="return mV(\'Ezr\',2,46);">Ezr 2:46</a>); the Revised Version (British and American) "Salmai"): The eponym of a family of Nethinim, called "Shamlai" in <a onClick="return mV(\'Ezr\',2,46);">Ezr 2:46</a> (Qere, shamlay, Kethibh, shalmay, followed by the King James Version text, "Shalmai"; Codex Vaticanus Samaan; Codex Alexandrinus Selami; <a onClick="return mV(\'Neh\',7,48);">Ne 7:48</a>, Codex Vaticanus Salemei; Codex Alexandrinus Selmei; Codex Sinaiticus Samaei). The name suggests a foreign reign. In 1Esdras 5:30 the corresponding name is "Subai."``1';
isbe[7591]='Salmanasar`sal-ma-na\'-sar (2Esdras 13:40) = <a href="./study/isbe/search.html?string=SHALMANESER">SHALMANESER</a> (which see).``1';
isbe[7592]='Salmon; Salma`sal\'-mon, (salmon, "investiture" (<a onClick="return mV(\'Rth\',4,21);">Ru 4:21</a>), salmah, "clothing" (<a onClick="return mV(\'Rth\',4,20);">Ru 4:20</a>), salma\' (<a onClick="return mV(\'1Ch\',2,11,51,54);">1Ch 2:11,51,54</a>); Salmon):<P>(1) The father of Boaz, the husband of Ruth, and thus the grandfather of Jesse, David\'s father (<a onClick="return mV(\'Rth\',4,20,21);">Ru 4:20,21</a>). He is mentioned in both the genealogies of Jesus (<a onClick="return mV(\'Mat\',1,4,5);">Mt 1:4,5</a>; <a onClick="return mV(\'Luk\',3,32);">Lu 3:32</a>). From <a onClick="return mV(\'Mat\',1,5);">Mt 1:5</a> we learn that he married Rahab, by whom he begat Boaz.<P>(2) In <a onClick="return mV(\'1Ch\',2,51);">1Ch 2:51</a>ff, we read of a Salma, "the father of Beth-lehem," a son of Caleb, the son of Hur. He is also said to be the father of "the Netophathites, Atroth-beth-joab, and half of the Manahathites, the Zorites," and several "families of scribes."`<a href="./study/isbe/search.html?string=ZALMON">ZALMON</a>`78';
isbe[7593]='Salmone`sal-mo\'-ne (Salmone): <a onClick="return mV(\'Act\',27,7);">Ac 27:7</a>.`<a href="./study/isbe/search.html?string=PHOENIX">PHOENIX</a>`1';
isbe[7594]='Saloas`sal\'-o-as (Saloas; the King James Version, Talsus after Lot Thalsas): In 1Esdras 9:22, for "Elasah" of <a onClick="return mV(\'Ezr\',10,22);">Ezr 10:22</a>.``1';
isbe[7595]='Salom`sa\'-lom (Salom):<P>(1) The father of Helkias (Baruch 1:7). Greek form of "Shallum."<P>(2) the King James Version = the Revised Version (British and American) "Salu" (1Macc 2:26).``1';
isbe[7596]='Salome`sa-lo\'-me (Salome):<P>(1) One of the holy women who companied with Jesus in Galilee, and ministered to Him (<a onClick="return mV(\'Mar\',15,40,41);">Mr 15:40,41</a>). She was present at the crucifixion (<a onClick="return mV(\'Mar\',15,40);">Mr 15:40</a>), and was among those who came to the tomb of Jesus on the resurrection morning (<a onClick="return mV(\'Mar\',16,1,2);">Mr 16:1,2</a>). Comparison with <a onClick="return mV(\'Mat\',27,56);">Mt 27:56</a> clearly identifies her with the wife of Zebedee. It is she, therefore, whose ambitious request for her sons James and John is recorded in <a onClick="return mV(\'Mat\',20,\'20-24\');">Mt 20:20-24</a>; <a onClick="return mV(\'Mar\',10,\'35-40\');">Mr 10:35-40</a>. From <a onClick="return mV(\'Jhn\',19,25);">Joh 19:25</a> many infer that she was a sister of Mary, the mother of Jesus (thus Meyer, Luthardt, Alford); others (as Godet) dispute the inference.<P>(2) Salome was the name of the daughter of Herodias who danced before Herod, and obtained as reward the head of John the Baptist (<a onClick="return mV(\'Mat\',14,\'3-11\');">Mt 14:3-11</a>; <a onClick="return mV(\'Mar\',6,\'17-28\');">Mr 6:17-28</a>; compare Josephus, Ant, XVIII, v, 4). She is not named in the Gospels.``132';
isbe[7597]='Salt`solt (melach; halas, hals): Common salt is considered by most authorities as an essential ingredient of our food. Most people intentionally season their cooking with more or less salt for the sake of palatability. Others depend upon the small quantities which naturally exist in water and many foods to furnish the necessary amount of salt for the body. Either too much salt or the lack of it creates undesirable disturbance in the animal system. Men and animals alike instinctively seek for this substance to supplement or improve their regular diet. The ancients appreciated the value of salt for seasoning food (<a onClick="return mV(\'Job\',6,6);">Job 6:6</a>). So necessary was it that they dignified it by making it a requisite part of sacrifices (<a onClick="return mV(\'Lev\',2,13);">Le 2:13</a>; <a onClick="return mV(\'Ezr\',6,9);">Ezr 6:9</a>; <a onClick="return mV(\'Ezr\',7,22);">7:22</a>; <a onClick="return mV(\'Eze\',43,24);">Eze 43:24</a>; <a onClick="return mV(\'Mar\',9,49);">Mr 9:49</a>). In <a onClick="return mV(\'Num\',18,19);">Nu 18:19</a>; <a onClick="return mV(\'2Ch\',13,5);">2Ch 13:5</a>, a "covenant of salt" is mentioned (compare <a onClick="return mV(\'Mar\',9,49);">Mr 9:49</a>). This custom of pledging friendship or confirming a compact by eating food containing salt is still retained among Arabic-speaking people. The Arabic word for "salt" and for a "compact" or "treaty" is the same. Doughty in his travels in Arabia appealed more than once to the superstitious belief of the Arabs in the "salt covenant," to save his life. Once an Arab has received in his tent even his worst enemy and has eaten salt (food) with him, he is bound to protect his guest as long as he remains.<P>The chief source of salt in Palestine is from the extensive deposits near the "sea of salt" (see <a href="./study/isbe/search.html?string=DEAD+SEA">DEAD SEA</a>), where there are literally mountains and valleys of salt (<a onClick="return mV(\'2Sa\',8,13);">2Sa 8:13</a>; <a onClick="return mV(\'2Ki\',14,7);">2Ki 14:7</a>; <a onClick="return mV(\'1Ch\',18,12);">1Ch 18:12</a>; <a onClick="return mV(\'2Ch\',25,11);">2Ch 25:11</a>). On the seacoast the inhabitants frequently gather the sea salt. They fill the rock crevices with sea water and leave it for the hot summer sun to evaporate. After evaporation the salt crystals can be collected. As salt-gathering is a government monopoly in Turkey, the government sends men to pollute the salt which is being surreptitiously crystallized, so as to make it unfit for eating. Another extensive supply comes from the salt lakes in the Syrian desert east of Damascus and toward Palmyra. All native salt is more or less bitter, due to the presence of other salts such as magnesium sulphate.<P>Salt was used not only as a food, but as an antiseptic in medicine. Newborn babes were bathed and salted (<a onClick="return mV(\'Eze\',16,4);">Eze 16:4</a>), a custom still prevailing. The Arabs of the desert consider it so necessary, that in the absence of salt they bathe their infants in camels’ urine. Elisha is said to have healed the waters of Jericho by casting a cruse of salt into the spring (<a onClick="return mV(\'2Ki\',2,20);">2Ki 2:20</a>f). Abimelech sowed the ruins of Shechem with salt to prevent a new city from arising in its place (<a onClick="return mV(\'Jdg\',9,45);">Jdg 9:45</a>). Lot’s wife turned to a pillar of salt (<a onClick="return mV(\'Gen\',19,26);">Ge 19:26</a>).<P>Figurative:<P>Salt is emblematic of loyalty and friendship (see above). A person who has once joined in a "salt covenant" with God and then breaks it is fit only to be cast out (compare <a onClick="return mV(\'Mat\',5,13);">Mt 5:13</a>; <a onClick="return mV(\'Mar\',9,50);">Mr 9:50</a>). Saltness typified barrenness (<a onClick="return mV(\'Deu\',29,23);">De 29:23</a>; <a onClick="return mV(\'Jer\',17,6);">Jer 17:6</a>). James compares the absurdity of the same mouth giving forth blessings and cursings to the impossibility of a fountain yielding both sweet and salt water (<a onClick="return mV(\'Jam\',3,11);">Jas 3:11</a>f).`<a href="./study/isbe/search.html?string=COVENANT+OF+SALT">COVENANT OF SALT</a>`133';
isbe[7598]='Salt Sea``<a href="./study/isbe/search.html?string=DEAD+SEA">DEAD SEA</a>`1';
isbe[7599]='Salt, City of`(\'ir ha-melach; Codex Alexandrinus hai pol(e)is halon): One of the six cities in the wilderness of Judah mentioned between Nibshan and Engedi (<a onClick="return mV(\'Jos\',15,62);">Jos 15:62</a>). The site is very uncertain. The large and important Tell el-Milch (i.e. "the salt hill"), on the route from Hebron to Akaba, is possible.``1';
