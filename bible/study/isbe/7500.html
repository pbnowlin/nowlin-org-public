ed with offenses against God and man that could be estimated by a money value and thus covered by compensation or restitution accompanying the offering. A ram of different degrees of value, and worth at least two shekels, was the usual victim, and it must be accompanied by full restitution with an additional fifth of the value of the damage. The leper and Nazirite could offer he-lambs. The guilt toward God was expiated by the blood poured out, and the guilt toward men by the restitution and fine. The calling of the Servant an \'asham (<a onClick="return mV(\'Isa\',53,10);">Isa 53:10</a>) shows the value attached to this offering.<P>Shelem, shelamim: "peace offering," generally used the plural, shelamim, only once shelem (<a onClick="return mV(\'Amo\',5,22);">Am 5:22</a>). These were sacrifices of friendship expressing or promoting peaceful relations with the Deity, and almost invariably accompanied by a meal or feast, an occasion of great joy. They are sometimes called zebhachim, sometimes zebhach shelamim, and were of different kinds, such as zebhach ha-todhah, "thank offerings," which expressed the gratitude of the giver because of some blessings, zebhach nedhabhah, "free-will offerings," bestowed on the Deity out of a full heart, and zebhach nedher, "votive offerings," which were offered in fulfillment of a vow.<P>Minchah: "meal offering" (the Revised Version), "meat offering" (the King James Version), a gift or presentation, at first applied to both bloody and unbloody offerings (<a onClick="return mV(\'Gen\',4,5);">Ge 4:5</a>), but in Moses\' time confined to cereals, whether raw or roast, ground to flour or baked and mixed with oil and frankincense. These cereals were the produce of man\'s labor with the soil, not fruits, etc., and thus represented the necessities and results of life, if not life itself. They were the invariable accompaniment of animal sacrifices, and in one instance could be substituted for them (see <a href="./study/isbe/search.html?string=SIN+OFFERING">SIN OFFERING</a>). The term minchah describes a gift or token of friendship (<a onClick="return mV(\'Isa\',39,1);">Isa 39:1</a>), an act of homage (<a onClick="return mV(\'1Sa\',10,27);">1Sa 10:27</a>; <a onClick="return mV(\'1Ki\',10,25);">1Ki 10:25</a>), tribute (<a onClick="return mV(\'Jdg\',3,15,17);">Jud 3:15,17</a>f), propitiation to a friend wronged (<a onClick="return mV(\'Gen\',32,13,18);">Ge 32:13,18</a>; <a onClick="return mV(\'Hbr\',14,19);">Heb 14:19</A>)</a>), to procure favor or assistance (<a onClick="return mV(\'Gen\',43,11);">Ge 43:11</a>ff; <a onClick="return mV(\'Hsa\',10,6);">Ho 10:6</a>).<P>Tenuphah: "wave offering," usually the breast, the priest\'s share of the peace offerings, which was waved before the altar by both offerer and priest together (the exact motion is not certain), symbolic of its presentation to Deity and given back by Him to the offerer to be used in the priests\' service.<P>Terumah: "heave offering," something lifted up, or, properly, separated from the rest and given to the service of the Deity. Usually the right shoulder or thigh was thus separated for the priest. The term is applied to products of the soil, or portion of land separated unto the divine service, etc.<P>Qorban: "an oblation," or "offering"; another generic term for all kinds of offerings, animal, vegetable, or even gold and silver. Derived from the verb qarabh, "to draw near," it signifies what is drawn or brought near and given to God.<p>\'Ishsheh: "fire offering," applied to offerings made by fire and usually bloody offerings, but at times to the minchah, the sacred bread and frankincense placed on the tables as a memorial, part of which was burned with the frankincense, the bulk, however, going to the priest. The gift was thus presented through fire to the Deity as a sort of etherealized food.<P>Necekh: "drink offering," or "libation," a liquid offering of wine, rarely water, sometimes of oil, and usually accompanying the \'olah, but often with the peace offerings.<P>Kalil: "whole burnt offering," the entire animal being burned upon the altar. Sometimes used synonymously with \'olah. A technical term among the Carthaginians.<P>Chagh: a "feast," used metaphorically for a sacrificial feast because the meat of the sacrifices constituted the material of the feast.<P>Lebhonah: "frankincense," "incense," used in combination with the meal offerings and burnt offerings and burned also upon the altar in the holy place.<P>See <a href="./study/isbe/search.html?string=INCENSE">INCENSE</a>.<P>Qetorah, qetoreth: "smoke," "odor of sacrifice," or incense ascending as a sweet savor and supposed to be pleasing and acceptable to God.<P>Melach: "salt," used in all sacrifices because of its purifying and preserving qualities.<P>Shemen: "oil," generally olive oil, used with the meal offerings of cakes and wafers, etc.<P>Sacrifice is thus a complex and comprehensive term. In its simplest form it may be defined as "a gift to God." It is a presentation to Deity of some material object, the possession of the offerer, as an act of worship. It may be to attain, restore, maintain or to celebrate friendly relations with the Deity. It is religion in action—in early times, almost the whole of religion—an inseparable accompaniment to all religious exercises. Few or many motives may actuate it. It may be wholly piacular and expiatory, or an Offering of food as a gift to God; it may be practically a bribe, or a prayer, an expression of dependence, obligation and thanksgiving. It may express repentance, faith, adoration, or all of these combined. It was the one and only way of approach to God. Theophrastus defines it as expressing homage, gratitude and need. Hubert and Mauss define it as "a religious act which by the consecration of the victim modifies the moral state of the sacrificer, or of certain material objects which he has in view, i.e., either confers sanctity or removes it and its analogue, impiety."<P>II. Origin and Nature of Sacrifices.<P>The beginnings of sacrifice are hidden in the mysteries of prehistoric life. The earliest narrative in Genesis records the fact, but gives no account of the origin and primary idea. The custom is sanctioned by the sacred writings, and later on the long-established custom was adopted and systematized in the Mosaic Law. The practice was almost universal. The Vedas have their elaborate rituals. Some Semitic peoples, Greeks, Romans, Africans, and Indians of Mexico offered human sacrifices. It is unknown in Australia, but even there something akin to it exists, for some natives offer a portion of a kind of honey, others offer a pebble or a spear to their god. For this practically universal habit of the race, several solutions are offered.<P>1. Theory of a Divine Revelation:<P>One view maintains that God Himself initiated the rite by divine order at the beginnings of human history. Such a theory implies a monotheistic faith on the part of primitive man. This theory was strongly held by many of the Reformed theologians, and was based mainly on the narrative in <a onClick="return mV(\'Gen\',4,4);">Ge 4:4</a>f. Abel offered an acceptable sacrifice, and, according to <a onClick="return mV(\'Hbr\',11,4);">Heb 11:4</a>, this was because of his faith. Faber makes a strong plea as follows: Since faith was what made the sacrifice acceptable to God, this faith must have been based upon a positive enactment of God in the past. Without this divine positive enactment to guarantee its truthfulness, faith, in Abel, would have been superstition. In other words, faith, in order to be truly based and properly directed, must have a revelation from God, a positive expression of the divine will. Fairbairn, in his Typology, goes further and holds that the skins wherewith Adam and Eve were clothed were from animals which had been slain in sacrifices. This is entirely without support in the narrative. The theory of a divine order cannot be maintained on the basis of the Biblical narrative. Moreover, it involves certain assumptions regarding the nature of faith and revelation which are not generally held in this age. A revelation is not necessarily a positive divine command, an external thing, and faith may be just as real and true without such a revelation as with it. That there may have been such a revelation cannot be denied, but it is not a necessary or probable explanation.<P>2. Theories of a Human Origin:<P>(1) The Gift-Theory.<P>By this it is held that sacrifices were originally presents to the deity which the offerer took for granted would be received with pleasure and even gratitude. Good relations would thus be established with the god and favors would be secured. Such motives, while certainly true among many heathen people, were obviously based upon low conceptions of the deity. They were either. Nature-spirits, ancestral ghosts or fetishes which needed what was given, and of course the god was placed under obligations and his favor obtained. Or, the god may have been conceived of as a ruler, a king or chief, as was the custom in the East.<P>Cicero vouches for such a view when he says: "Let not the impious dare to appease the gods with gifts. Let them hearken to Plato, who warns them that there can be no doubt what God\'s disposition to them will be, since even a good man will refuse to accept presents from the wicked" (HDB, IV, 331a). This view of sacrifice prevails in classical literature. Spencer therefore thinks it is self-evident that this was the idea of primitive man. Tylor and Herbert Spencer also find the origin of sacrifices in the idea of a gift, whether to the deity or to dead ancestors, food being placed for them, and this afterward comes to be regarded as a sacrifice. Such a view gives no account of the peculiar value attached to the blood, or to the burnt offerings. It may account for some heathen systems of sacrifice, but can help in no degree in understanding the Biblical sacrifices.<P>(2) The Magic Theory.<P>There are two slightly variant forms of this:<P>(a) that of R.C. Thompson (Semitic Magic, Its Origins and Developments, 175-218), who holds that a sacrificial animal serves as a substitute victim offered to a demon whose activity has brought the offerer into trouble; the aim of the priest is to entice or drive the malignant spirit out of the sick or sinful man into the sacrificial victim where it can be isolated or destroyed;<P>(b) that of L. Marillier, who holds that sacrifice in its origin is essentially a magical rite. The liberation of a magical force by the effusion of the victim\'s blood will bend the god to the will of the man. From this arose under the "cult of the dead" the gift-theory of sacrifice. Men sought to ally themselves with the god in particular by purifying a victim and effecting communion with the god by the application of the blood to the altar, or by the sacrifice of the animal and the contact of the sacrificer with its blood. Such theories give no account of the burnt offerings, meal offerings and sin offerings, disconnect them entirely from any sense of sin or estrangement from God, and divest them of all piacular value. They may account for certain depraved and heathen systems, but not for the Biblical.<P>(3) The Table-Bond Theory.<P>Ably advocated by Wellhausen and W.R. Smith, this view holds that sacrifices were meals which the worshippers and the god shared, partaking of the same food and thus establishing a firmer bond of fellowship between them. Sykes (Nature of Sacrifices, 75) first advocated this, holding that the efficacy of sacrifices "is the fact that eating and drinking were the known and ordinary symbols of friendship and were the usual rites in engaging in covenants and leagues." Thus sacrifices are more than gifts; they are deeds of hospitality which knit god and worshipper together. W.R. Smith has expounded the idea into the notion that the common meal unites physically those who partake of it. Though this view may contain an element of truth in regard to certain Arabian customs, it does not help much to account for Bible sacrifices. As A.B. Davidson says, "It fails utterly to account for the burnt offering, which was one of the earliest, most solemn and at times the most important of all the sacrifices."<P>(4) The Sacramental Communion Theory.<P>This is a modification of the table-bond theory. The basis of it is the totemistic idea of reverencing an animal which is believed to share with man the divine nature. On certain solemn occasions this animal would be sacrificed to furnish a feast. At this meal, according to men\'s savage notions, they literally "ate the god," and thus incorporated into themselves the physical, the intellectual and the moral qualities which characterized the animal. If the divine life dwelt in certain animals, then a part of that precious life would be distributed among all the people (RS2, 313). In some cases the blood is drunk by the worshippers, thus imbibing the life. Sometimes, as in the case of the sacred camel, they devoured the quivering flesh before the animal was really dead, and the entire carcass was eaten up before morning.<P>The brilliant work of W. R. Smith has not been universally accepted. L. Marillier has criticized it along several lines. It is by no means certain that totemism prevailed so largely among Semites and there is no evidence of its existence in Israel. Also, if an original bond of friendship existed between the god and the kin, there is no need to maintain it by such sacrificial rites. There is no clear instance of this having been done. If on the other hand there was no common bond between the god and the people but that of a common meal, it does not appear that the god is a totem god. There is no reason why the animal should have been a totem. In any case, this idea of sacrifice could hardly have been anything but a slow growth, and consequently not the origin of sacrifice. Hubert and Mauss also point out that W. R. Smith is far from having established the historical or the logical connection between the common meal and the other kinds of sacrifices. Under piacula he confuses purification, propitiation and expiations. His attempts to show that purifications of magical character are late and not sacrificial do not succeed. Smith\'s theory is mainly the sacramental, though he does recognize the honorific and piacular element. The theory may be applicable to some of the heathen or savage feasts of the Arabs, but not to the practices of the Hebrews (see Encyclopedia Brit, XXIII, 981).<P>(5) The Homage Theory.<P>This has been advocated by Warburton and F. D. Maurice. The idea is that sacrifices were originally an expression of homage and dependence. Man naturally felt impelled to seek closer communion with God, not so much from a sense of guilt as from a sense of dependence and a desire to show homage and obedience. In giving expression to this, primitive man had recourse to acts rather than words and thoughts. Thus sacrifice was an acted prayer, rather than a prayer in words. It was an expression of his longings and aspirations, his reverence and submission. There is much truth in this view; the elements of prayer—dependence and submission—enter into some sacrifices, the burnt offerings in particular; but it does not account for all kinds of offerings.<P>(6) The Piacular Theory.<P>This holds that sacrifices are fundamentally expiatory or atoning, and the death of the beast is a vicarious expiation of the sins of the offerer. Hubert and Mauss admit that in all sacrifices there are some ideas of purchase or substitution, though these may not have issued from some primitive form. The unifying principle in all sacrifices is that the divine is put in communication with the profane by the intermediary—the victim—which may be piacular or honorific. It is thus a messenger, a means of divination, a means of alimenting the eternal life of the species, a source of magical energy which the rite diffuses over objects in its neighborhood. Westermarck (Origin of Moral Ideas) makes the original idea in sacrifice a piaculum, a substitute for the offerer.<P>This view is the most simple, the most natural, and the only one that can explain certain sacrifices. Man felt himself under liability to punishment or death. The animal was his, it had life, it was of value, and perchance the god would accept that life in place of his. He felt that it would be accepted, and thus the animal was sacrificed. The offerer in a sense gives up part of himself. The beast must be his own; no sacrifice can be made of another person\'s property (<a onClick="return mV(\'2Sa\',24,24);">2Sa 24:24a</a>). The true spirit of sacrifice appears in a willingness to acknowledge God\'s right to what is best and dearest (<a onClick="return mV(\'Gen\',12,\'1-\');">Ge 12</a>).<P>Objection is raised to this by A. B. Davidson (Old Testament Theology), Paterson (HDB, IV, 331) and others, on the ground that such an origin represents too advanced a stage of ethical thought and reflection for primitive man. We question seriously whether this be an advanced stage of moral reflection. On the contrary, it represents a very simple and primitive stage. The feeling that sin of some kind is never absent from human life, and that its true penalty is death, has been inseparable from the human heart\'s sense of sin. What could be more simple and natural than to take an innocent animal and offer it in place of himself, hoping that the Deity would accept it instead? Nor is there much force in Professor Paterson\'s objection that sacrifices were preponderantly joyous in character and therefore could not be offered as an expiation. This joyous character belongs to such sacrifices as peace offerings and thank offerings, but does not belong to the \'olah and others. In most cases the joyous feast followed the killing of the animal by which the expiation was accomplished, and the feast was joyous because atonement had been made. In fact, many sacrifices were of the most solemn character and represented the deepest and most serious emotions of the heart.<P>(7) Originating in Religious Instincts.<P>Neither theory of an objective divine revelation, nor of a human origin will account for the universality and variety of sacrifices. The truth lies in a proper combination of the two. The notion of offering a gift to the Deity arose out of the religious instincts of the human heart, which in an early period had a consciousness of something wrong between itself and God, and that this something would mean death sooner or later. Added to these true instincts was the Omnipresent Spirit to guide men in giving expression. What could be more simple and primitive than to offer something possessing life? Of course the notion originated in simple and childlike ideas of God, and its real motive was not to gratify God by sharing a meal with Him, or to gain His favor by a bribe, but to present Him with something that represented a part of the offerer which might be accepted in his stead. Thus sacrifices became the leading features of the religious life of primitive man. Naturally other ideas would be added, such as a gift of food by fire to the Deity, the peace offerings, etc., to celebrate the friendly relations with God, the thank offerings, the sin offerings, etc., all of which naturally and logically developed from the primitive idea. It might be expected that there would be many corruptions and abuses, that the sense of sin would be obscured or lost among some peoples, and the idea of sacrifice correspondingly degraded. Such has been the case, and as well might we try to understand man at his best by studying the aboriginal tribes of Africa and Australia, or the inmates of asylums and penitentiaries, as to attempt to understand the Bible ideas in sacrifices by studying the cults of those heathen and savage tribes of Semites, etc.<P>III. Classification of Sacrifices.<P>1. Maimonides:<P>Maimonides was among the first to classify them, and he divided them into two kinds:<P>(1) Those on behalf of the whole congregation, fixed by statute, time, number and ritual being specified. This would include burnt, meal and peace offerings with their accompaniments. (2) Those on behalf of the individual, whether by virtue of his connection with the community or as a private person. These would be burnt offerings, sin offerings, and guilt offerings with their accompaniments.<P>2. W. R. Smith and Others:<P>Others, such as W. R. Smith, classify them as: (1) honorific, or designed to render homage, devotion, or adoration, such as burnt, meal and peace offerings; (2) piacular, designed to expiate or make atonement for the errors of the people, i.e. burnt offerings, sin offerings, and guilt offerings; (3) communistic, intended to establish the bond between the god and the worshipper, such as peace offerings.<P>3. Oehler:<P>Oehler divides them into two classes, namely: (1) those which assume that the covenant relation is undisturbed, such as peace offerings; (2) those intended to do away with any disturbance in the relation and to set it right, such as burnt, sin and guilt offerings.<P>4. Paterson and Others:<P>Professor Paterson and others divide them into three: (1) animal sacrifices, burnt offerings, peace offerings, sin offerings, and guilt offerings; (2) vegetable sacrifices, meal offerings, shewbread, etc.; (3) liquid and incense offerings; wine, oil, water, etc.<P>5. H. M. Wiener:<P>H. M. Wiener offers a more suggestive and scientific division (Essays on Pentateuchal Criticism, 200f):<P>(1) customary lay offerings, such as had from time immemorial been offered on rude altars of earth or stone, without priest, used and regulated by Moses and in more or less general use until the exile, namely, burnt offerings, meal offerings, and peace offerings;<P>(2) statutory individual offerings, introduced by Moses, offered by laymen with priestly assistance and at the religious capital, i.e. burnt offerings, peace offerings, meal offerings, sin offerings, and guilt offerings;<P>(3) statutory national offerings introduced by Moses and offered by the priest at the religious capital, namely, burnt, meal, peace and sin offerings.<P>IV. Sacrifices in the Pre-Mosaic Age.<P>Out of the obscure period of origins emerged the dimly lighted period of ancient history. Everywhere sacrifices existed and sometimes abounded as an essential part of religion. The spade of the archaeologist, and the researches of scholars help us understand the pre-Mosaic period.<P>1. In Egypt:<P>In Egypt—probably from the beginning of the 4th millennium BC—there were sacrifices and sacrificial systems. Temples at Abydos, Thebes, On, etc., were great priestly centers with high priests, lower priests, rituals and sacrifices in abundance. Burnt, meal and peace offerings predominated. Oxen, wild goats, pigs, geese were the chief animals offered. Besides these, wine, oil, beer, milk, cakes, grain, ointment, flowers, fruit, vegetables were offered, but not human beings. In these offerings there were many resemblances to the Hebrew gifts, and many significant exceptions. Moses would be somewhat familiar with these practices though not with the details of the ritual. He would appreciate the unifying power of a national religious center. It is inconceivable that in such an age a national leader and organizer like Moses would not take special care to institute such a system.<P>2. In Babylonia:<P>In Babylonia, from the year 3000 BC or thereabouts, according to E. Meyer (Geschichte des Alterthums), there were many centers of worship such as Eridu, Nippur, Agade, Erech, Ur, Nisin, Larsa, Sippar, etc. These and others continued for centuries with elaborate systems of worship, sacrifices, temples, priesthoods, etc. Considerably over 100 temples and sanctuaries are mentioned on inscriptions, and several hundreds in the literature and tablets, so that Babylonia was studded with temples and edifices for the gods. At all these, sacrifices were constantly offered—animal and vegetable. A long list of the offerings of King Gudea includes oxen, sheep, goats, lambs, fish, birds (i.e. eagles and doves), dates, milk, greens (Jastrow, in HDB, V, 580f; under the word). The sacrifices provided an income for the priests, as did the Mosaic system at a later time. It had long passed the stage when it was supposed to furnish a meal for the god. A sacrifice always accompanied a consultation with a priest, and was really an assessment for the services rendered. It was not a voluntary offering or ritualistic observance. The priests on their own behalf offered a daily sacrifice, as in the Mosaic Law, and likewise on special occasions, to insure the good will of the gods they served. It seems certain that in some of the larger centers of worship animals were offered up twice a day, morning and evening. At these sacrifices certain portions were consumed on the altar, the rest belonging to the priest. The similarity of much of this to the Mosaic institutions is obvious. That the culture and civilization of Babylon was known to Egypt and Israel with other nations is shown clearly by the Tell el-Amarna Letters. Special sacrifices on special occasions were offered in Babylonia as in Israel. As Jastrow says, "In the Hebrew codes, both as regards the purely legal portions and those sections dealing with religious ritual, Babylonian methods of legal procedure and of ritual developed in Babylonian temples must be taken into consideration as determining factors." We do not doubt that Moses made use of many elements found in the Egyptian and Babylonian systems, and added to or subtracted from or purified as occasion required. As sacrificial systems and ritual had been in use more than a millennium before Moses, there is absolutely no need to suppose that Israel\'s ritual was a thousand years in developing, and was completed after the exile. To do so is to turn history upside down.<P>3. Nomads and Tribes of Arabia and Syria:<P>Among the nomads and tribes of Arabia and Syria, sacrifices had been common for millenniums before Moses. The researches of Wellhausen and W. R. Smith are valuable here, whatever one may think of their theories. The offerings were usually from the flocks and herds, sometimes from the spoils taken in war which had been appropriated as their own. The occasions were many and various, and the ritual was very simple. A rude altar of earth or stone, or one stone, a sacred spot, the offerer killing the victim and burning all, or perhaps certain parts and eating the remainder with the clan or family, constituted the customary details. Sometimes wild animals were offered. Babylonians, Phoenicians and Arabs offered gazelles, but the Hebrews did not. Arabs would sometimes sacrifice a captive youth, while the Carthaginians chose some of the fairest of the captives for offerings by night. Assyrian kings sometimes sacrificed captive kings. The Canaanites and others constantly sacrificed children, especially the firstborn.<P>4. The Offerings of Cain and Abel:<P>The account of the offerings of Cain and Abel (<a onClick="return mV(\'Gen\',4,4);">Ge 4:4</a>f) shows that the ceremony dates from almost the beginnings of the human race. The custom of offering the firstlings and first-fruits had already begun. Arabian tribes later had a similar custom. Cain\'s offering was cereal and is called minchah, "a gift" or "presentation." The same term is applied to Abel\'s. There is no hint that the bloody sacrifice was in itself better than the unbloody one, but it is shown that sacrifice without a right attitude of heart is not acceptable to God. This same truth is emphasized by the prophets and others, and is needed in this day as much as then. In this case the altars would be of the common kind, and no priest was needed. The sacrifices were an act of worship, adoration, dependence, prayer, and possibly propitiation.<P>5. Of Noah:<P>The sacrifices of Noah followed and celebrated the epochal and awe-inspiring event of leaving the ark and beginning life anew. He offered burnt offerings of all the clean animals (<a onClick="return mV(\'Gen\',8,20);">Ge 8:20</a>). On such a solemn occasion only an \'olah would suffice. The custom of using domestic animals had arisen at this time. The sacrifices expressed adoration, recognition of God\'s power and sovereignty, and a gift to please Him, for it is said He smelled a sweet savor and was pleased. It was an odor of satisfaction or restfulness. Whether or not the idea of expiation was included is difficult to prove.<P>6. Of Abraham:<P>Abraham lived at a time when sacrifices and religion were virtually identical. No mention is made of his offering at Ur or Charan, but on his arrival at Shechem he erected an altar (<a onClick="return mV(\'Gen\',12,7);">Ge 12:7</a>). At Beth-el also (<a onClick="return mV(\'Gen\',12,8);">12:8</a>), and on his return from Egypt he worshipped there (<a onClick="return mV(\'Gen\',13,4);">Ge 13:4</a>). Such sacrifices expressed adoration and prayer and probably propitiation. They constituted worship, which is a complex exercise. At Hebron he built an altar (<a onClick="return mV(\'Gen\',13,18);">Ge 13:18</a>), officiating always as his own priest. In <a onClick="return mV(\'Gen\',15,4);">Ge 15:4</a>ff he offers a "covenant" sacrifice, when the animals were slain, divided, the parts set opposite each other, and prepared for the appearance of the other party to the covenant. The exact idea in the killing of these animals may be difficult to find, but the effect is to give the occasion great solemnity and the highest religious sanction. What was done with the carcasses afterward is not told. That animals were slain for food with no thought of sacrifice is shown by the narrative in chapter 18, where Abraham had a calf slain for the meal. This is opposed to one of the chief tenets of the Wellhausen school, which maintains that all slaughtering of animals was sacrificial until the 7th century BC. In <a onClick="return mV(\'Gen\',22,\'1-\');">Genesis 22</a> Abraham attempts to offer up Isaac as a burnt offering, as was probably the custom of his neighbors. That he attempted it shows that the practice was not shocking to his ethical nature. It tested the strength of his devotion to God, shows the right spirit in sacrifices, and teaches for all time that God does not desire human sacrifice—a beast will do. What God does want is the obedient heart. Abraham continued his worship at Beer-sheba (<a onClick="return mV(\'Gen\',21,33);">Ge 21:33</a>).<P>7. Of Job:<P>Whatever may be the date of the writing of the Book of Job, the saint himself is represented as living in the Patriarchal age. He constantly offered sacrifices on behalf of his children (<a onClick="return mV(\'Job\',1,5);">1:5</a>), "sanctifying" them. His purpose no doubt was to atone for possible sin. The sacrifices were mainly expiatory. This is true also of the sacrifices of his friends (<a onClick="return mV(\'Job\',42,7,8,9);">42:7-9</a>).<P>8. Of Isaac:<P>Isaac seems to have had a permanent altar at Beer-sheba and to have regularly offered sacrifices. Adoration, expiation and supplication would constitute his chief motives (<a onClick="return mV(\'Gen\',26,25);">Ge 26:25</a>).<P>9. Of Jacob:<P>Jacob\'s first recorded sacrifice was the pouring of the oil upon the stone at Beth-el (<a onClick="return mV(\'Gen\',28,18);">Ge 28:18</a>). This was consecration or dedication in recognition of the awe-inspiring presence of the Deity. After his covenant with Laban he offered sacrifices (zebhachim) and they ate bread (<a onClick="return mV(\'Gen\',31,54);">Ge 31:54</a>). At Shechem, Jacob erected an altar (<a onClick="return mV(\'Gen\',33,20);">Ge 33:20</a>). At Beth-el (<a onClick="return mV(\'Gen\',35,7);">Ge 35:7</a>) and at Beer-sheba he offered sacrifices to Isaac\'s God (<a onClick="return mV(\'Gen\',46,1);">Ge 46:1</a>).<P>10. Of Israel in Egypt:<P>While the Israelites were in Egypt they would be accustomed to spring sacrifices and spring feasts, for these had been common among the Arabs and Syrians, etc., for centuries. Nabatean inscriptions testify to this. Egyptian sacrifices have been mentioned (see above). At these spring festivals it was probably customary to offer the firstlings of the flocks (compare <a onClick="return mV(\'Exd\',13,15);">Ex 13:15</a>). At the harvest festivals sacrificial feasts were celebrated. It was to some such feast Moses said Israel as a people wished to go in the wilderness (<a onClick="return mV(\'Exd\',3,18);">Ex 3:18</a>; <a onClick="return mV(\'Exd\',5,3);">5:3</a>ff; <a onClick="return mV(\'Exd\',7,15);">7:16</a>). Pharaoh understood and asked who was to go (<a onClick="return mV(\'Exd\',10,8);">Ex 10:8</a>). Moses demanded flocks and herds for the feast (<a onClick="return mV(\'Exd\',10,9);">Ex 10:9</a>). Pharaoh would keep the flocks, etc. (<a onClick="return mV(\'Exd\',10,24);">Ex 10:24</a>), but Moses said they must offer sacrifices and burnt offerings (<a onClick="return mV(\'Exd\',10,25);">Ex 10:25</a>f).<P>The sacrifice of the Passover soon occurs (<a onClick="return mV(\'Exd\',12,\'3-11\');">Ex 12:3-11</a>). That the Hebrews had been accustomed to sacrifice their own firstborn at this season has no support and is altogether improbable (Frazer, Golden Bough(3), pt. III, 175f). The whole ceremony is very primitive and has retained its primitiveness to the end. The choosing of the lamb or kid, the killing at a certain time, the family gathered in the home, the carcass roasted whole, eaten that night, and the remainder, if any, burned, while the feasters had staff in hand, etc., all this was continued. The blood in this case protected from the Deity, and the whole ceremony was "holy" and only for the circumcised. Frazer in his Golden Bough gives a very different interpretation.<P>11. Of Jethro:<P>As a priest of Midian, Jethro was an expert in sacrificing. On meeting Moses and the people he offered both \'olah and zebhachim and made a feast (<a onClick="return mV(\'Exd\',18,12);">Ex 18:12</a>).<P>12. Summary and Conclusions:<P>From the above it is evident that sacrifices were almost the substance of religion in that ancient world. From hilltops and temples innumerable, the smoke of sacrifices was constantly rising heavenward. Burnt offerings and peace offerings were well known. Moses, in establishing a religion, must have a sacrificial system. He had abundance of materials to choose from, and under divine guidance would adopt such rules and regulations as the pedagogic plans and purposes of God would require in preparing for better things.``146';
isbe[7561]='Sacrifice, in the Old Testament, 2`V. The Mosaic Sacrificial System.<P>1. The Covenant Sacrifice:<P>The fundamental function of Moses\' work was to establish the covenant between Israel and God. This important transaction took place at Sinai and was accompanied by solemn sacrifices. The foundation principle was obedience, not sacrifices (<a onClick="return mV(\'Exd\',19,\'4-8\');">Ex 19:4-8</a>). No mention is made of these at the time, as they were incidental—mere by-laws to the constitution. The center of gravity in Israel\'s religion is now shifted from sacrifices to obedience and loyalty to Yahweh. Sacrifices were helps to that end and without obedience were worthless. This is in exact accordance with <a onClick="return mV(\'Jer\',7,21);">Jer 7:21</a>ff. God did not speak unto the fathers at this time about sacrifices; He did speak about obedience.<P>The covenant having been made, the terms and conditions are laid down by Moses and accepted by the people (<a onClick="return mV(\'Exd\',24,3);">Ex 24:3</a>). The Decalogue and Covenant Code are given, an altar is built, burnt offerings and peace offerings of oxen are slain by young men servants of Moses, not by priests, and blood is sprinkled on the altar (<a onClick="return mV(\'Exd\',24,4);">Ex 24:4</a>). The blood would symbolize the community of life between Yahweh and Israel, and consecrated the altar. The Law was read, the pledge again given, and Moses sprinkled the representatives of the people, consecrating them also (<a onClick="return mV(\'Exd\',24,7);">Ex 24:7</a>f). Ascending the mount, they had a vision of God, held a feast before Him, showing the joys and privileges of the new relationship. The striking feature of these ceremonies is the use of the blood. It is expiatory and consecrating, it is life offered to God, it consecrates the altar and the people: they are now acceptable to God and dare approach Him and feast with Him. There is no idea of God\'s drinking the blood. The entire ritual is far removed from the crass features of common Semitic worship.<P>2. The Common Altars:<P>In the Covenant Code, which the people accepted, the customary altars are not abolished, but regulated (<a onClick="return mV(\'Exd\',20,24);">Ex 20:24</a>). This law expressly applies to the time when they shall be settled in Canaan. \'In the whole place where I cause my name to be remembered,\' etc. (<a onClick="return mV(\'Exd\',20,24);">Ex 20:24</a> margin). No need to change the reading to "in every place where I cause," etc., as the Wellhausen school does for obvious reasons. All the land was eligible. On such rude altars sacrifices were allowed. This same law is implied in <a onClick="return mV(\'Deu\',16,21);">De 16:21</a>, a passage either ignored or explained away by the Wellhausen school (see Wiener, Essays in Pentateuchal Criticism, 200f). Moses commanded Joshua in accordance with it (<a onClick="return mV(\'Deu\',27,5);">De 27:5</a>). Joshua, Gideon, Jephthah, Samuel, Saul, David, Elijah and many others used such altars. There were altars at Shechem (<a onClick="return mV(\'Jos\',24,1,26);">Jos 24:1,26</a>), Mizpah in Gilead (<a onClick="return mV(\'Jdg\',11,11);">Jud 11:11</a>), Gilgal (<a onClick="return mV(\'1Sa\',13,9);">1Sa 13:9</a>). High places were chiefly used until the times of Hezekiah and Josiah, when they were abolished because of their corruptions, etc. All such altars were perfectly legitimate and in fact necessary, until there was a central capital and sanctuary in Jerusalem. The customary burnt offerings and peace offerings with the worshipper officiating were the chief factors. Heathen sacrifices and the use of heathen altars were strictly forbidden (<a onClick="return mV(\'Exd\',22,20);">Ex 22:20</a>; (<a onClick="return mV(\'Hbr\',1,9);">Heb 1:9</a>); <a onClick="return mV(\'Exd\',34,15);">Ex 34:15</a>)<P>3. The Consecration of Aaron and His Sons:<P>The altar used at the consecration of Aaron and his sons was a "horned" or official altar, the central one. The offerings were a bullock, two rams, unleavened bread, etc. (<a onClick="return mV(\'Exd\',29,\'1-4\');">Ex 29:1-4</a>), and were brought to the door of the sanctuary. The ritual consisted of Aaron laying his hand on the bullock\'s head, designating it as his substitute (<a onClick="return mV(\'Exd\',29,10);">Ex 29:10</a>), killing it before the tent of meeting (<a onClick="return mV(\'Exd\',29,11);">Ex 29:11</a>), smearing some blood on the horns of the altar, and pouring the rest at its base (<a onClick="return mV(\'Exd\',29,12);">Ex 29:12</a>). The blood consecrated the altar, the life was given as atonement for sins, the fat parts were burned upon the altar as food for God, and the flesh and remainder were burned without the camp (<a onClick="return mV(\'Exd\',29,13,14);">Ex 29:13,14</a>). This is a sin offering—chatta\'th—the first time the term is used. Probably introduced by Moses, it was intended to be piacular and to "cover" possible sin. One ram was next slain, blood was sprinkled round about the altar, flesh was cut in pieces, washed and piled on the altar, then burned as an offering by fire (\'ishsheh) unto God as a burnt offering, an odor of a sweet savor (<a onClick="return mV(\'Exd\',29,\'15-18\');">Ex 29:15-18</a>). The naive and primitive nature of this idea is apparent. The other ram, the ram of consecration, is slain, blood is smeared on Aaron\'s right ear, thumb and great toe; in the case of his sons likewise. The blood is sprinkled on the altar round about; some upon the garments of Aaron and his sons (<a onClick="return mV(\'Exd\',29,\'19-21\');">Ex 29:19-21</a>). Certain parts are waved before Yahweh along with the bread, and are then burned upon the altar (<a onClick="return mV(\'Exd\',29,\'22-25\');">Ex 29:22-25</a>). The breast is offered as a wave offering (tenuphah), and the right thigh or shoulder as a heave offering (terumah). These portions here first mentioned were the priests\' portion for all time to come, although this particular one went to Moses, since he officiated (<a onClick="return mV(\'Exd\',29,\'26-30\');">Ex 29:26-30</a>). The flesh must be boiled in a holy place, and must be eaten by Aaron and his sons only, and at the sanctuary. What was left till morning must be burned (<a onClick="return mV(\'Exd\',29,\'31-34\');">Ex 29:31-34</a>). Consecrated to a holy service it was dangerous for anyone else to touch it, or the divine wrath would flame forth. The same ceremony on each of the seven days atoned for, cleansed and consecrated the altar to the service of Yahweh, and it was most holy (<a onClick="return mV(\'Exd\',29,\'35-37\');">Ex 29:35-37</a>). The altar of incense is ordered (<a onClick="return mV(\'Exd\',30,1);">Ex 30:1</a>), and Aaron is to put the blood of the sin offering once a year upon its horns to consecrate it.<P>4. Sacrifices before the Golden Calf:<P>When the golden calf was made an altar was erected, burnt offerings and peace offerings were presented. From the latter a feast was made, the people followed the usual habits at such festivals, went to excess and joined in revelry. Moses\' ear quickly detected the nature of the sounds. The covenant was now broken and no sacrifice was available for this sin. Vengeance was executed on 3,000 Israelites. Moses mightily interceded with God. A moral reaction was begun; new tables of the Law were made with more stringent laws against idols and idol worship (<a onClick="return mV(\'Exd\',32,\'1-35\');">Ex 32:1-35</a>).<P>5. The Law of the Burnt Offering (\'Olah):<P>At the setting-up of the tabernacle burnt and meal offerings were sacrificed (<a onClick="return mV(\'Exd\',40,29);">Ex 40:29</a>). The law of the burnt offering is found in <a onClick="return mV(\'Lev\',1,1);">Le 1</a>. Common altars and customary burnt offerings needed no minute regulations, but this ritual was intended primarily for the priest, and was taught to the people as needed. They were for the statutory individual and national offering upon the "horned" altar before the sanctuary. Already the daily burnt offerings of the priests had been provided for (<a onClick="return mV(\'Exd\',29,\'38-42\');">Ex 29:38-42</a>). The burnt offering is here called qorban, "oblation."<P>(1) Ritual for the Offerer (<a onClick="return mV(\'Lev\',1,\'3-17\');">Leviticus 1:3-17</a>).<P>This may have been from the herd or flock or fowls, brought to the tent of meeting; hands were laid (heavily) upon its head designating it as the offerer\'s substitute, it was killed, flayed and cut in pieces. If of the flock, it was to be killed on the north side of the altar; if a fowl, the priest must kill it.<P>(2) Ritual for the Priest (<a onClick="return mV(\'Lev\',1,\'3-17\');">Leviticus 1:3-17</a>).<P>If a bullock or of the flock, the priest was to sprinkle the blood round about the altar, put on the fire, lay the wood and pieces of the carcass, wash the inwards, legs, etc., and burn it all as a sweet savor to God. If a fowl, he must wring the neck, drain out the blood on the side of the altar, cast the crop, filth, etc., among the ashes, rend the wings without dividing the bird and burn the carcass on the altar.<P>(3) General Laws for the Priest.<P>The burnt offering must be continued every morning and every evening (<a onClick="return mV(\'Exd\',29,38);">Ex 29:38</a>f; <a onClick="return mV(\'Num\',28,\'3-8\');">Nu 28:3-8</a>). At the fulfillment of his vow the Nazirite must present it before God and offer it upon the altar through the priest (<a onClick="return mV(\'Num\',6,14,16);">Nu 6:14,16</a>): on the Sabbath, two lambs (<a onClick="return mV(\'Num\',28,9);">Nu 28:9</a>); on the first of the month, two bullocks, one ram and seven lambs (<a onClick="return mV(\'Num\',28,11);">Nu 28:11</a>); on the day of first-fruits, the same (<a onClick="return mV(\'Num\',28,27);">Nu 28:27</a>); on the 1st day of the 7th month, one bullock, one ram, seven lambs (<a onClick="return mV(\'Num\',29,8);">Nu 29:8</a>); on the 15th day, 13 bullocks, two rams, 14 lambs, the number of bullocks diminishing daily until the 7th day, when seven bullocks, two rams, 14 lambs were offered (<a onClick="return mV(\'Num\',29,\'12-34\');">Nu 29:12-34</a>); on the 22nd day of this month one bullock, one ram and seven lambs were offered (<a onClick="return mV(\'Num\',29,35,36);">Nu 29:35,36</a>). Non-Israelites were permitted to offer the \'olah, but no other sacrifices (<a onClick="return mV(\'Lev\',17,8);">Le 17:8</a>; <a onClick="return mV(\'Lev\',22,18,25);">22:18,25</a>).<P>(4) Laws in <a onClick="return mV(\'Deu\',12,6,13,14,27);">Deuteronomy 12:6,13,14,27</a>; <a onClick="return mV(\'Deu\',27,6);">27:6</a>.<P>Anticipating a central sanctuary in the future, the lawgiver counsels the people to bring their offerings there (<a onClick="return mV(\'Deu\',12,6,11);">De 12:6,11</a>); they must be careful not to offer them in any place (<a onClick="return mV(\'Deu\',12,13);">De 12:13</a>), but must patronize the central sanctuary (<a onClick="return mV(\'Deu\',12,14);">De 12:14</a>). In the meantime common altars and customary sacrifices were allowable and generally necessary (<a onClick="return mV(\'Deu\',16,21);">De 16:21</a>; <a onClick="return mV(\'Deu\',27,6);">27:6</a>).<P>6. The Law of the Meal Offering (Minchah):<P>The term "meal offering" is here confined to offerings of flour or meal, etc. (the King James Version "meat-offering"), and was first used at the consecration of Aaron and his sons (<a onClick="return mV(\'Exd\',29,41);">Ex 29:41</a>). These must not be offered on the altar of incense (<a onClick="return mV(\'Exd\',30,9);">Ex 30:9</a>); were used at the completion of the tabernacle (<a onClick="return mV(\'Exd\',40,29);">Ex 40:29</a>); and always with the morning and evening burnt offerings.<P>(1) Ritual for the Offerer (<a onClick="return mV(\'Lev\',2,\'1-16\');">Leviticus 2:1-16</a>).<P>It must be of fine flour, with oil and frankincense added, and brought to the priest; if baked in the oven, unleavened cakes mingled with oil, or wafers and oil; if of the baking pan, fine flour mingled with oil parted into pieces and oil thereon; if of the frying pan, the same ingredients. Leaven and honey must never be used as they quickly become corrupt. Every offering must be seasoned with salt. If of the first-fruits (bikkurim), it should consist of grain in the ear, parched with oil and frankincense upon it.<P>(2) Ritual for the Priest (<a onClick="return mV(\'Lev\',2,\'1-16\');">Leviticus 2:1-16</a>).<P>This required him to take out a handful with the oil and frankincense thereon and burn it as a memorial upon the altar. The remainder was holy and belonged to the priest. Of the cakes, after bringing them to the altar, he was to take a portion, burn it and appropriate the remainder; the same with the first-fruits.<P>(3) General Laws for the Priest (<a onClick="return mV(\'Lev\',6,\'14-18\');">Leviticus 6:14-18 (Hebrew 7-11)</a>, etc.).<P>He might eat his portion without leaven in the holy place. At his anointing Aaron offered his own oblation of fine flour—1/10 of an ephah, one-half in the morning and one-half in the evening. If baked, it must be with oil. This meal offering must all be burnt; none could be eaten. With the sin offerings and guilt offerings every meal offering baked in any way belongs to the priest (<a onClick="return mV(\'Lev\',7,9,10);">Le 7:9,10</a>; <a onClick="return mV(\'Lev\',10,12);">10:12</a>; <a onClick="return mV(\'Num\',18,9);">Nu 18:9</a>). The meal offerings accompanied the other offerings on all important occasions, such as the consecration of Aaron (<a onClick="return mV(\'Lev\',9,4,17);">Le 9:4,17</a>); cleansing of a leper (<a onClick="return mV(\'Lev\',14,10,20,21,31);">Le 14:10,20,21,31</a>); feast of first-fruits (<a onClick="return mV(\'Lev\',23,13);">Le 23:13</a>); Pentecost (<a onClick="return mV(\'Lev\',23,16);">Le 23:16</a>); set feasts (<a onClick="return mV(\'Lev\',23,37);">Le 23:37</a>). Special charge was given to Eleazar to care for the continual meal offerings (<a onClick="return mV(\'Num\',4,16);">Nu 4:16</a>). The Nazirite must offer it (<a onClick="return mV(\'Num\',6,15,17);">Nu 6:15,17</a>). When the tribes presented their offerings, meal offerings were always included (<a onClick="return mV(\'Num\',7,13,19);">Nu 7:13,19</a>, etc.); when the Levites were set apart (<a onClick="return mV(\'Num\',8,8);">Nu 8:8</a>); with vows of freewill offerings (<a onClick="return mV(\'Num\',15,4,6);">Nu 15:4,6</a>); with the sin offerings (<a onClick="return mV(\'Num\',15,24);">Nu 15:24</a>); at all the several seasons (<a onClick="return mV(\'Num\',28,\'5-\');">Nu 28:5</a>-<a onClick="return mV(\'Num\',29,\'1-39\');">29:39</a>). A special form was the "showbread" (bread of memorial). Twelve loaves were to be placed in two rows or heaps of six each on a pure table in the holy place, with frankincense on each pile or row. These were to remain for one week and then to be eaten by the priests. They were an offering of food by fire, though probably only the frankincense was actually burned (<a onClick="return mV(\'Lev\',24,5);">Le 24:5</a>f).<P>7. The Law of the Peace Offering:<P>The peace offerings indicated right relations with God, expressing good-fellowship, gratitude and obligation. The common altars were fitted for their use (<a onClick="return mV(\'Exd\',20,24);">Ex 20:24</a>), as feasts had been thus celebrated from time immemorial. At the feast before God on the Mount, peace offerings provided the food (<a onClick="return mV(\'Exd\',24,5);">Ex 24:5</a>); also before the golden bull (<a onClick="return mV(\'Exd\',32,6);">Ex 32:6</a>). The wave offerings and heave offerings were portions of these.<P>(1) Ritual for the Offerer (<a onClick="return mV(\'Lev\',3,\'1-17\');">Leviticus 3:1-17</a>).<P>The offering might be a bullock, a lamb, or a goat, either male or female, latitude being allowed in this case. The ritual was the same as in the case of the burnt offering (see above).<P>(2) Ritual for the Priest (<a onClick="return mV(\'Lev\',3,\'1-17\');">Leviticus 3:1-17</a>).<P>Blood must be sprinkled on the altar round about, the caul, the liver and the kidneys must be taken away and the fat parts burned on the altar; the fat tail of the lamb must also be burned. These portions were offerings of food by fire to the Deity. The ritual for a goat was the same as for a bullock.<P>(3) General Laws for the Priest (<a onClick="return mV(\'Lev\',6,12);">Leviticus 6:12 (Hebrew 5)</a>; <a onClick="return mV(\'Lev\',7,1);">7:1</a>ff).<P>The fat was to be burned on the altar of burnt offering. If it was a thank offering (zebhach ha-todhah), it must have unleavened cakes with oil, cakes mingled with oil and fine flour soaked. Cakes of leavened bread might be offered, and one cake was to be a heave offering to the priest. The flesh was to be eaten that day, none was to be left till morning (<a onClick="return mV(\'Lev\',22,30);">Le 22:30</a>). If it was a votive offering (zebhach nedher) or a freewill offering (zebhach nedhabhah), it might be eaten on the first and second days, but not on the third day; it should then be an abomination (<a onClick="return mV(\'Lev\',7,18);">Le 7:18</a>f). If eaten then by anyone, that person was to be cut off from the community. Of all peace offerings the wave-breast and heave-thigh belong to the priest (<a onClick="return mV(\'Lev\',7,\'29-34\');">Le 7:29-34</a>), the remainder was to be eaten by the worshippers. At Aaron\'s consecration an ox and a ram were the peace offerings (<a onClick="return mV(\'Lev\',9,4,18,22);">Le 9:4,18,22</a>). The priest\'s portion was to be eaten in a clean place by the priest\'s family (<a onClick="return mV(\'Lev\',10,14);">Le 10:14</a>). When Israel should have a central sanctuary, all were to be brought there (<a onClick="return mV(\'Lev\',17,4,5);">Le 17:4,5</a>). When they had no central place, the common altars would suffice. All peace offerings must be made in an acceptable manner (<a onClick="return mV(\'Lev\',19,5);">Le 19:5</a>). Votive offerings must be perfect (<a onClick="return mV(\'Lev\',22,\'18-22\');">Le 22:18-22</a>), but certain imperfections are allowable in freewill offerings (<a onClick="return mV(\'Lev\',22,23);">Le 22:23</a>). At Pentecost two he-lambs of the first year could be offered as peace offerings (<a onClick="return mV(\'Lev\',23,19);">Le 23:19</a>). The Nazirite at the end of his separation must offer one ram for a peace offering with unleavened bread (<a onClick="return mV(\'Num\',6,14,17);">Nu 6:14,17</a>), and the hair shaved from his head must be burned under the peace offerings (<a onClick="return mV(\'Num\',6,18);">Nu 6:18</a>). This hair was regarded as a thing having life and offered as a sacrifice by other nations. The various tribes brought peace offerings (<a onClick="return mV(\'Num\',7,1);">Numbers 7</a>, passim), and at the feast of trumpets the people were to rejoice and blow trumpets over the peace offerings (<a onClick="return mV(\'Num\',10,10);">Nu 10:10</a>). Some further regulations are given (<a onClick="return mV(\'Num\',15,9);">Nu 15:9</a>f).<P>8. The Law of the Sin Offering:<P>The sin offering was a sacrifice of a special kind, doubtless peculiar to Israel and first mentioned at the consecration of Aaron and his sons. It is not then spoken of as an innovation. It was of special value as an expiatory sacrifice.<P>(1) At the Consecration of Aaron and His Sons (<a onClick="return mV(\'Exd\',29,10);">Exodus 29:10</a>ff).<P>A bullock was killed before the altar, some blood was put upon the horns of the altar by Moses, the rest was poured out at the base. The fat of the inwards was burned upon the altar, the flesh and skin were burned without the camp. Every day during the consecration this was done (<a onClick="return mV(\'Exd\',29,36);">Ex 29:36</a>).<P>(2) The Law of the Sin Offering (<a onClick="return mV(\'Lev\',4,\'1-35\');">Leviticus 4:1-35</a>; 24-30, etc.).<P>(a) The Occasion and Meaning:<P>Specifically to atone for unwitting sins, sins of error (sheghaghah), mistakes or rash acts, unknown at the time, but afterward made known. There were gradations of these for several classes of offenders: the anointed priest (<a onClick="return mV(\'Lev\',4,\'3-12\');">Le 4:3-12</a>), the whole congregation (<a onClick="return mV(\'Lev\',4,\'13-21\');">Le 4:13-21</a>), a ruler (<a onClick="return mV(\'Lev\',4,\'22-26\');">Le 4:22-26</a>), one of the common people (<a onClick="return mV(\'Lev\',4,\'27-35\');">Le 4:27-35</a>), forswearing (<a onClick="return mV(\'Lev\',5,1);">5:1</A>), touching an unclean thing (<a onClick="return mV(\'Lev\',5,2);">Le 5:2</a>) or the uncleanness of man (<a onClick="return mV(\'Lev\',5,3);">Le 5:3</a>), or rashly sweating in ignorance (<a onClick="return mV(\'Lev\',5,4);">Le 5:4</a>). For conscious and willful violations of the Law, no atonement was possible, with some exceptions, for which provision was made in the guilt offerings (see below).<P>(b) Ritual for the Offerer (<a onClick="return mV(\'Lev\',4,\'1-5\',13);">Leviticus 4:1-5,13</a>, etc.):<P>The anointed priest must offer a bullock at the tent of meeting, lay his hands upon it and slay it before Yahweh. The congregation was also required to bring a young bullock before the tent of meeting, the elders were to lay hands upon it and slay it before Yahweh. The ruler must bring a he-goat and do the same. One of the common people might bring a she-goat or lamb and present it in the same manner. If too poor for these, two turtledoves or young pigeons, one for a sin offering and one for burnt offering, would suffice. If too poor for these, the tenth part of an ephah of fine flour without oil or flankincense would suffice.<P>(c) Ritual for the Priest (<a onClick="return mV(\'Lev\',4,\'1-5\',13);">Leviticus 4:1-5,13</a>, etc.):<P>He must bring the bullock\'s blood to the tent of meeting, dip his finger into it and sprinkle blood 7 times before the veil of the sanctuary, and put some on the horns of the altar of incense, but most of the blood must be poured out at the base of the altar. The fat must be burned upon the altar, all the rest of the carcass must be carried to a clean place without the camp and burned. In the case of the whole congregation, the ritual is the same. In the case of a ruler, the blood is to be put upon the horns of the altar of burnt offering, not the altar of incense. In the case of one of the common people, the ritual is similar to that of the ruler. In both the latter cases the carcass belonged to the priest. If a bird, the priest must wring off its head, sprinkle some blood on the side of the altar and pour the rest at the base. Nothing is said of the disposal of the carcass. If of fine flour, the priest must take out a handful and burn it upon the altar, keeping the remainder for himself. The use of fine flour for an expiatory sacrifice is evidently exceptional and intended to be so. Though life was not given, yet necessity of life—that which represented life—was offered.<P>(d) General Laws for the Priest (<a onClick="return mV(\'Lev\',6,\'24-30\');">Leviticus 6:24-30</a>):<P>The sin offering was to be slain in the same place as the burnt offering. It was most holy, and the priest alone might eat what was left of the ram, pigeon or flour, in the holy place. Whatever touched it was to be holy, any garment sprinkled with the blood must be washed in a holy place, earthen vessels used must be broken, and brazen vessels thoroughly scoured and rinsed.<P>(e) Special Uses of the Sin Offering:<P>(i) Consecration of Aaron and His Sons:<P>The consecration of Aaron and his sons (<a onClick="return mV(\'Lev\',8,2,14,15);">Le 8:2,14,15</a>) was similar to that of <a onClick="return mV(\'Lev\',4,11,12);">Le 4:11,12</a>, only Moses was to kill the offering and put the blood on the horns of the altar. On the 8th day a bull-calf was offered (<a onClick="return mV(\'Lev\',9,2);">Le 9:2</a>), and the congregation offered a he-goat (<a onClick="return mV(\'Lev\',9,3);">Le 9:3</a>). In this case Aaron performed the ceremony, as in <a onClick="return mV(\'Lev\',4,11,12);">Le 4:11,12</a>. Moses complained that they had not eaten the flesh of the calf and goat in the sanctuary, since that was requisite when the blood was not brought into the sanctuary (<a onClick="return mV(\'Lev\',10,\'16-20\');">Le 10:16-20</a>).<P>(ii) Purifications from Uncleannesses:<P>Purifications from uncleannesses required after childbirth a young pigeon or turtledove (<a onClick="return mV(\'Lev\',12,\'6-8\');">Le 12:6-8</a>). The leper must bring a guilt offering (a special kind of sin offering), a he-lamb (<a onClick="return mV(\'Lev\',14,\'12-14\',19);">Le 14:12-14,19</a>); if too poor for a lamb, a turtledove or young pigeon (<a onClick="return mV(\'Lev\',14,22,31);">Le 14:22,31</a>). Special use of the blood is required (<a onClick="return mV(\'Lev\',14,25);">Le 14:25</a>). In uncleanness from issues a sin offering of a turtledove or young pigeon must be offered by the priest (<a onClick="return mV(\'Lev\',15,15,30);">Le 15:15,30</a>).<P>(iii) On the Day of Atonement:<P>On the Day of Atonement (<a onClick="return mV(\'Lev\',16,\'1-28\');">Le 16:1-28</a>) Aaron must take a bullock for himself and house, two he-goats for the people, present the goats at the sanctuary, cast losts, one for Yahweh, as a sin offering, the other for Azazel, to be sent into the wilderness. The bullock was killed, sweet incense was burned within the rail, blood was sprinkled on the mercy-seat and before it 7 times. The one he-goat was killed and a similar ceremony was performed. Blood must be put on the horns of the altar and sprinkled 7 times about it. The other goat was presented, hands were laid on it, the sins of all confessed and put upon the goat, and it was sent into the wilderness. The carcass of the bullock and he-goat were burned without the camp. At the feast of first-fruits a he-goat was offered (<a onClick="return mV(\'Lev\',23,19);">Le 23:19</a>).<P>(iv) Other Special Instances:<P>Other special instances were: in the case of defilement, the Nazirite must offer a turtledove or young pigeon on the 8th day after contraction (<a onClick="return mV(\'Num\',6,10);">Nu 6:10</a>); when the days of the separation were fulfilled a ewe-lamb with the other offerings (<a onClick="return mV(\'Num\',6,14);">Nu 6:14</a>) was to be offered; the twelve tribes included in each case a he-goat for sin offering (<a onClick="return mV(\'Num\',7,16);">Nu 7:16</a>); at the consecration of the Levites a young bullock (<a onClick="return mV(\'Num\',8,8,12);">Nu 8:8,12</a>). For unwitting sins of the congregation a he-goat was to be offered (<a onClick="return mV(\'Num\',15,24,25);">Nu 15:24,25</a>). If one person erred, a she-goat was permitted (<a onClick="return mV(\'Num\',15,27);">Nu 15:27</a>). A sin offering was required at the feast of the new moon (<a onClick="return mV(\'Num\',28,15);">28:15</a>), at the Passover (<a onClick="return mV(\'Num\',28,22);">Nu 28:22</a>), at Pentecost (<a onClick="return mV(\'Num\',28,30);">Nu 28:30</a>), on the 1st day of the 7th month (<a onClick="return mV(\'Num\',29,5);">Nu 29:5</a>), and on the 10th, 15th-22nd days (<a onClick="return mV(\'Num\',29,\'10-38\');">Nu 29:10-38</a>). The ceremony of the red heifer (<a onClick="return mV(\'Num\',19,\'1-10\',17);">Nu 19:1-10,17</a>) was a special sin offering for purification purposes only. It was of ancient and primitive origin. The young cow was brought without the camp and was slain before the priest\'s face, blood was sprinkled 7 times before the sanctuary, the entire carcass with cedar wood, hyssop and scarlet was burned, the ashes gathered and laid without the camp in a clean place to be kept for the water of impurity. It was to purify after contact with the dead. In the case of the unknown homicide (<a onClick="return mV(\'Deu\',21,\'1-9\');">De 21:1-9</a>) a young unbroken heifer was brought to a running stream, its neck was broken, the elders washed their hands over the heifer in the presence of the priests, declaring their innocence. Thus the bloodshed was expiated. The action was a judicial one, but essentially vicarious and expiatory and had doubtless a primitive origin.<P>9. The Guilt Offering:<P>The guilt offering (the King James Version "trespass offering") (<a onClick="return mV(\'Lev\',5,14);">Le 5:14-6:7</a>) was a special kind of sin offering, always of a private character and accompanied by a fine. It expressed expiation and restitution. The classes of sin requiring a guilt offering with reparation in money are:<P>(1) a trespass in the holy things done unwittingly;<P>(2) anything which the Law forbade depriving God or the priest of their due;<P>(3) dealing falsely, with a neighbor in a deposit, or pledge, or robbery, or oppression;<P>(4) swearing falsely regarding anything lost;<P>(5) seduction of a betrothed bondmaid (<a onClick="return mV(\'Lev\',19,\'20-22\');">Le 19:20-22</a>).<P>The first two of these are unwitting sins, the others cannot be. The clear statement is made in another place that sins done with a "high hand," i.e. in rebellion against the covenant and its provisions, can have no sacrifice (<a onClick="return mV(\'Num\',15,30);">Nu 15:30</a>). Is this a contradiction, or a later development when it was found that the more stringent law would not work? (See J. M. P. Smith, et al., Atonement, 47 f.) Neither conclusion is probable. These conscious sins are of a kind that will admit of full reparation because against rights of property or in money matters. The sin offering makes atonement toward God, the restitution with the additional one-fifth makes full reparation to man. No such reparation can be made with such sins described as committed with a "high hand." In the case of seduction, rights of property are violated (compare <a onClick="return mV(\'Num\',5,\'5-8\');">Nu 5:5-8</a>; <a onClick="return mV(\'Deu\',22,29);">De 22:29</a>).<P>(1) The Ritual (<a onClick="return mV(\'Lev\',5,\'14-\');">Leviticus 5:14</a>-<a onClick="return mV(\'Lev\',6,\'1-7\');">6:7</a>).<P>A ram proportionate in value to the offense and worth at least two shekels is required. The ritual is probably the same as that of the sin offering, though no mention is made of the laying on of hands, and the blood is not brought into the sanctuary, but sprinkled about the base of the altar, the fat and inside parts being burned, and the flesh eaten by the priests in a holy place.<P>(2) Special Laws: Leper, Nazirite, etc.<P>The leper, when cleansed, on the 8th day must bring a guilt offering of two he-lambs and one ewe-lamb; the priest must wave one he-lamb before Yahweh, kill it, and smear blood on the right ear, thumb and toe of the leper. The guilt offering belongs to the priest (<a onClick="return mV(\'Lev\',14,\'12-20\');">Le 14:12-20</a>). If the leper were too poor for two lambs, one sufficed, with a corresponding meal offering, or one turtle-dove and a young pigeon (<a onClick="return mV(\'Lev\',14,21,22);">Le 14:21,22</a>). The Nazirite, if defiled during his period of separation, must bring a he-lamb for a guilt offering (<a onClick="return mV(\'Num\',6,12);">Nu 6:12</a>). All guilt offerings were the priests\' and most holy (<a onClick="return mV(\'Num\',18,9);">Nu 18:9</a>).<P>10. The Wave Offering:<P>The wave offerings were parts of the peace offerings, and the custom was seemingly initiated at the consecration of Aaron and his sons (<a onClick="return mV(\'Exd\',29,\'24-27\');">Ex 29:24-27</a>), when the breast and bread were waved before Yahweh. <a onClick="return mV(\'Lev\',7,30,34);">Le 7:30,34</a> fixes the law. It must be brought from the peace offerings of the offerer himself. At Aaron\'s consecration Moses put the breast, etc., on Aaron\'s hands and waved them before Yahweh (<a onClick="return mV(\'Lev\',8,27);">Le 8:27</a>). On the 8th day Aaron did the waving (<a onClick="return mV(\'Lev\',9,21);">Le 9:21</a>). The priests were to eat it in a clean place (<a onClick="return mV(\'Lev\',10,14);">Le 10:14</a>f). The leper\'s he-lamb was to be waved by the priest, before being offered (<a onClick="return mV(\'Lev\',14,12);">Le 14:12</a>); the lamb of the guilt offering also (<a onClick="return mV(\'Lev\',14,24);">Le 14:24</a>). At the feast of first-fruits the sheaf must be waved before Yahweh (<a onClick="return mV(\'Lev\',23,10,11,15);">Le 23:10,11,15</a>); two loaves also (<a onClick="return mV(\'Lev\',23,17,20);">Le 23:17,20</a>). Of the Nazirite the priest took the boiled shoulder, a cake and a wafer, put them on the Nazirite\'s hand and waved them before Yahweh (<a onClick="return mV(\'Num\',6,19);">Nu 6:19</a>f).<P>11. The Heave Offering:<P>Heave offerings also are parts of the peace offerings, and refer particularly to what is lifted up, or separated unto the service of Yahweh. They are first mentioned at the consecration of Aaron (<a onClick="return mV(\'Exd\',29,27,28);">Ex 29:27,28</a>). The offering consisted of the right shoulder or thigh and was the fixed due of the priest (<a onClick="return mV(\'Lev\',7,32,34);">Le 7:32,34</a>) One cake of the peace offering must be heaved (<a onClick="return mV(\'Lev\',7,14);">Le 7:14</a>). The offering must be eaten in a clean place (<a onClick="return mV(\'Lev\',7,14);">Le 7:14</a>) by the priest\'s family only (<a onClick="return mV(\'Lev\',10,14,15);">Le 10:14,15</a>). Of the Nazirite\'s offering the heave thigh also went to the priest (<a onClick="return mV(\'Num\',6,20);">Nu 6:20</a>). When the Israelites should come into the promised land to eat bread, they must offer a heave offering of the dough, a cake (<a onClick="return mV(\'Num\',15,19,20,21);">Nu 15:19,20,21</a>). The law is repeated in <a onClick="return mV(\'Num\',18,8,11,19);">Nu 18:8,11,19</a>, and the Levites are to receive a tithe of the heave offerings of the people (<a onClick="return mV(\'Num\',18,24);">Nu 18:24</a>). They were in turn to offer up a tithe of this to the priests (<a onClick="return mV(\'Num\',18,\'26-32\');">Nu 18:26-32</a>). A portion of the spoil of Midian was a heave offering (<a onClick="return mV(\'Num\',31,29,41);">Nu 31:29,41</a>). Deuteronomy commands that all heave offerings be brought to the central sanctuary and eaten there (<a onClick="return mV(\'Deu\',12,6,11);">12:6,11</a>).<P>12. Drink Offerings:<P>Jacob poured oil on the stone he had set up (<a onClick="return mV(\'Gen\',28,18);">Ge 28:18</a>) in honor of the Deity and consecrated the spot. Jacob later (<a onClick="return mV(\'Gen\',35,14);">Ge 35:14</a>) set up a pillar where God had revealed Himself and poured drink offerings and oil upon it. Probably wine was used. Drink offerings accompanied many of the sacrifices (<a onClick="return mV(\'Exd\',29,40,41);">Ex 29:40,41</a>). None could be poured upon the altar of incense (<a onClick="return mV(\'Exd\',30,9);">Ex 30:9</a>). At all set feasts the Drink offerings must be presented (<a onClick="return mV(\'Lev\',23,13,18,37);">Le 23:13,18,37</a>). The Nazirite was not exempt (<a onClick="return mV(\'Num\',6,15,17);">Nu 6:15,17</a>). Wine and oil must accompany all votive and freewill offerings (<a onClick="return mV(\'Num\',15,4,5,7,10,24);">Nu 15:4,5,7,10,24</a>); the continual burnt offering (<a onClick="return mV(\'Num\',28,7,8);">Nu 28:7,8</a>); sabbaths (<a onClick="return mV(\'Num\',28,9,10);">Nu 28:9,10</a>) and all the other set feasts (<a onClick="return mV(\'Num\',28,\'14-31\');">Nu 28:14-31</a>; <a onClick="return mV(\'Num\',29,\'6-39\');">29:6-39</a>, passim). That drink offerings were common among the heathen is shown by <a onClick="return mV(\'Deu\',32,38);">De 32:38</a>.<P>13. Primitive Nature of the Cultus:<P>The cult is thoroughly in keeping with and adapted to the age, and yet an ideal system in many respects. The ethical side is in the background, the external has the emphasis. No sacrifices will avail for a breach of the covenant between God and the people. The people thoroughly believed in the efficacy of the blood. It secured atonement and forgiveness. Their religious life found expression in the sacrifices. God was fed and pleased by the offerings by fire. Many of the customs are ancient and crude, so that it is difficult to imagine how such a primitive system could have been arranged and accepted afterward by the people who had the lofty ethical teachings of the prophets in their hands.<P>VI. Sacrifices in the History of Israel.<P>1. The Situation at Moses\' Death:<P>The tribes were outwardly consolidated, and a religious system was provided. Some of it was for the rulers, much for the people and much for the priests alone. The various laws were given in portions and afterward compiled. No one expected them to be observed until the nation had a capital and central sanctuary. Even then not every detail was always possible. They were not observed to any extent in the wilderness (<a onClick="return mV(\'Amo\',5,25);">Am 5:25</a>), as it was impracticable. Even circumcision was neglected until the wanderers crossed the Jordan (<a onClick="return mV(\'Jos\',5,2);">Jos 5:2</a>). The body of the system was not in full practice for 300 or 400 years. The ritual, as far as it could be observed, served as an educational agency, producing in the minds of the worshippers proper conceptions of the holiness of God, the sinfulness of man, and the proper spirit in approaching God.<P>2. In the Time of Joshua:<P>Lay or common altars were in accordance With <a onClick="return mV(\'Exd\',20,24);">Ex 20:24</a>; <a onClick="return mV(\'Deu\',16,21);">De 16:21</a>; <a onClick="return mV(\'Deu\',27,7);">27:7</a>. In the days of Joshua, the Passover was celebrated (<a onClick="return mV(\'Jos\',5,10);">Jos 5:10</a>f). At Ebal an altar was erected, burnt and peace offerings were presented (<a onClick="return mV(\'Jos\',8,\'30-32\');">Jos 8:30-32</a>). The tabernacle was set up at Shiloh with a horned altar doubtless (<a onClick="return mV(\'Jos\',18,1);">Jos 18:1</a>), and the cult was observed to some extent. Concerning the altar on the east side of the Jordan, see <a href="./study/isbe/search.html?string=ALTAR">ALTAR</a>.<P>3. The Period of the Judges:<P>Canaanitish altars were abundant with their corrupt and licentious cults of the Nature-gods. Israelites with their common altars would naturally use the high places, when possible. The stationary altars of the Canaanites were of course unlawful. The inevitable tendency would be to imitate the worship of the Canaanites. They were rebuked and threatened for this, and, weeping, offered sacrifices at Bochim (<a onClick="return mV(\'Jdg\',2,\'1-5\');">Jud 2:1-5</a>). Gideon rebuilt an altar of Yahweh and offered a bullock as a burnt offering (<a onClick="return mV(\'Jdg\',6,25,26);">Jud 6:25,26</a>). The kid prepared for the angel was not first a sacrifice, but its acceptance as a gift was indicated by its being burned (<a onClick="return mV(\'Jdg\',6,19);">Jud 6:19</a>f). Jephthah offered up his daughter as a burnt offering, believing such a sacrifice well-pleasing to Yahweh (<a onClick="return mV(\'Jdg\',11,31,39);">Jud 11:31,39</a>). Manoah and his wife prepared a kid for a burnt offering, a meal offering accompanying it (<a onClick="return mV(\'Jdg\',13,16);">Jud 13:16</a>f). At the time of the civil war with Benjamin the ark and statutory altar seemed to be at Beth-el, where they offered burnt and peace offerings (<a onClick="return mV(\'Jdg\',20,26);">Jud 20:26</a>). The feasts at Shiloh imply at least peace offerings (<a onClick="return mV(\'Jdg\',21,19);">Jud 21:19</a>).<P>4. Times of Samuel and Saul:<P>Common lay altars and customary sacrifices were still much in use. The official altar with the statutory individual and national offerings appears to be at Shiloh. El-kanah sacrifices and feasts there yearly (<a onClick="return mV(\'1Sa\',1,3);">1Sa 1:3</a>f). Such feasts were joyous and tended to excesses, as drunkenness seemed common (<a onClick="return mV(\'1Sa\',1,13);">1Sa 1:13</a>f). All Israel came thither (<a onClick="return mV(\'1Sa\',2,14);">1Sa 2:14</a>); the priests claimed their portion, seizing it in an unlawful manner before the fat had been burned, or the flesh had been boiled (<a onClick="return mV(\'1Sa\',2,\'13-17\');">1Sa 2:13-17</a>). This shows that such ritual as was prescribed in Leviticus was practiced and considered by the people the only lawful custom. Was it in writing? Why not? Guilt offerings were made by the Philistines when smitten by tumors (<a onClick="return mV(\'1Sa\',6,3,4,8,17);">1Sa 6:3,48,17</a>). There were five golden mice and five golden tumors. Crude as were their ideas of a guilt offering, their actions show familiarity with the concept. Burnt offerings were used on special occasions and in great crises, such as receiving the ark (<a onClick="return mV(\'1Sa\',6,14);">1Sa 6:14</a>f), going to war (<a onClick="return mV(\'1Sa\',7,9);">1Sa 7:9</a>f; <a onClick="return mV(\'1Sa\',13,\'9-12\');">13:9-12</a>), victory (<a onClick="return mV(\'1Sa\',11,15);">1Sa 11:15</a>), etc. Saul met Samuel at a sacrificial feast in a small city (<a onClick="return mV(\'1Sa\',9,12,13);">1Sa 9:12,13</a>) on a high place. At Gilgal there were burnt and peace offerings (<a onClick="return mV(\'1Sa\',10,8);">1Sa 10:8</a>; <a onClick="return mV(\'1Sa\',15,15,21);">15:15,21</a>). Saul offered burnt offerings himself (<a onClick="return mV(\'1Sa\',13,\'9-12\');">1Sa 13:9-12</a>), but his fault was not in offering them himself, but in his haste and disobedience toward Samuel. "To obey is better than sacrifice," etc., says Samuel (<a onClick="return mV(\'1Sa\',15,22);">1Sa 15:22</a>), recognizing the fundamental principle of the covenant and realizing that ceremonies are in themselves worthless without the right spirit. The same truth is reiterated by the prophets later. To prevent the eating of flesh with the blood Saul built a special altar (<a onClick="return mV(\'1Sa\',14,\'32-35\');">1Sa 14:32-35</a>). Family and clan sacrifices and feasts were evidently common (<a onClick="return mV(\'1Sa\',16,\'2-5\');">1Sa 16:2-5</a>).<P>5. Days of David and Solomon:<P>The common altars and those on the high places were still in use. The central sanctuary at Shiloh had been removed, first apparently to Gilgal, then to Nob, and later to Gibeon. David\'s and Saul\'s families kept the feast of the new moon, when peace offerings would be sacrificed (<a onClick="return mV(\'1Sa\',20,5,\'24-29\');">1Sa 20:5,24-29</a>). The sanctuary at Nob had the shewbread upon the table (<a onClick="return mV(\'1Sa\',21,4);">1Sa 21:4</a>) according to <a onClick="return mV(\'Exd\',25,30);">Ex 25:30</a>. When the ark was brought up to Jerusalem, burnt offerings and peace offerings were offered according to the Law (<a onClick="return mV(\'2Sa\',6,17,18);">2Sa 6:17,18</a>; <a onClick="return mV(\'1Ch\',16,2,40);">1Ch 16:2,40</a>). Ahithophel offered private, sacrifices at Shiloh (<a onClick="return mV(\'2Sa\',15,12);">2Sa 15:12</a>). David offered up burnt offerings, meal offerings, and peace offerings when purchasing the threshing-floor of Araunah (<a onClick="return mV(\'1Ch\',21,\'23-26\');">1Ch 21:23-26</a>). The statutory horned altar at this time was at Gibeon (<a onClick="return mV(\'2Ch\',1,6);">2Ch 1:6</a>; <a onClick="return mV(\'1Ch\',21,29);">1Ch 21:29</a>), but was soon removed to Jerusalem (<a onClick="return mV(\'1Ch\',22,1);">1Ch 22:1</a>). In the organized sanctuary and ritual, Levites were appointed for attendance on the shewbread, meal offerings, burnt offerings, morning and evening sacrifices, sabbaths, new moons and set feasts (<a onClick="return mV(\'1Ch\',23,\'28-31\');">1Ch 23:28-31</a>), attempting to carry out the Levitical laws as far as possible. At the dedication of the temple, Solomon offered burnt offerings, meal offerings, and peace offerings in enormous quantities (<a onClick="return mV(\'1Ki\',8,63);">1Ki 8:63</a>; <a onClick="return mV(\'2Ch\',7,\'4-7\');">2Ch 7:4-7</a>); also burnt offerings and peace o
