isbe[7536]='Sabbateus`sab-a-te\'-us (Sabbataios; the King James Version Sabbatheus): One of the three (or rather two, for "Levis" = Levite) "assessors" in the investigation held concerning "foreign wives" (1Esdras 9:14) = "Shabbethai the Levite" in <a onClick="return mV(\'Ezr\',10,15);">Ezr 10:15</a>. He is probably the "Sabateus," one of the Levites who expounded the Law (1Esdras 9:48), and so = the "Shabbethai" in <a onClick="return mV(\'Neh\',8,7);">Ne 8:7</a>.``1';
isbe[7537]='Sabbath`sab\'-ath (shabbath, shabbathon; sabbaton, ta sabbata; the root shabhath in Hebrew means "to desist," "cease," "rest"):<P><b>I. ORIGIN OF THE SABBATH</b><P class="in15">1. The Biblical Account<P class="in15">2. Critical Theories<P><b>II. HISTORY OF THE SABBATH AFTER MOSES</b><P class="in15">1. In the Old Testament<P class="in15">2. In the Inter-Testamental Period<P class="in15">3. Jesus and the Sabbath<P class="in15">4. Paul and the Sabbath<P><b>LITERATURE</b><hr /><P>The Sabbath was the day on which man was to leave off his secular labors and keep a day holy to Yahweh.<P>I. Origin of the Sabbath.<P>1. The Biblical Account:<P>The sketch of creation in <a onClick="return mV(\'Gen\',1,\'1-\');">Ge 1:1</a>-<a onClick="return mV(\'Gen\',2,\'1-3\');">2:3</a> closes with an impressive account of the hallowing of the 7th day, because on it God rested from all the work which He had made creatively. The word "Sabbath" does not occur in the story; but it is recognized by critics of every school that the author (P) means to describe the Sabbath as primeval. In <a onClick="return mV(\'Exd\',20,\'8-11\');">Ex 20:8-11</a> (ascribed to JE) the reason assigned for keeping the 7th day as a holy Sabbath is the fact that Yahweh rested after the six days of creative activity. <a onClick="return mV(\'Exd\',31,17);">Ex 31:17</a> employs a bold figure, and describes Yahweh as refreshing Himself ("catching His breath") after six days of work. The statement that God set apart the 7th day for holy purposes in honor of His own rest after six days of creative activity is boldly challenged by many modern scholars as merely the pious figment of a priestly imagination of the exile. There are so few hints of a weekly Sabbath before Moses, who is comparatively a modern character, that argumentation is almost excluded, and each student will approach the question with the bias of his whole intellectual and spiritual history. There is no distinct mention of the Sabbath in Genesis, though a 7-day period is referred to several times (<a onClick="return mV(\'Gen\',7,4,10);">Ge 7:4,10</a>; <a onClick="return mV(\'Gen\',8,10,12);">8:10,12</a>; <a onClick="return mV(\'Gen\',29,27);">29:27</a>f). The first express mention of the Sabbath is found in <a onClick="return mV(\'Exd\',16,\'21-30\');">Ex 16:21-30</a>, in connection with the giving of the manna. Yahweh taught the people in the wilderness to observe the 7th day as a Sabbath of rest by sending no manna on that day, a double supply being given on the 6th day of the week. Here we have to do with a weekly Sabbath as a day of rest from ordinary secular labor. A little later the Ten Words (Commands) were spoken by Yahweh from Sinai in the hearing of all the people, and were afterward written on the two tables of stone (<a onClick="return mV(\'Exd\',20,\'1-17\');">Ex 20:1-17</a>; <a onClick="return mV(\'Exd\',34,\'1-5\',27);">34:1-5,27</a>f). The Fourth Commandment enjoins upon Israel the observance of the 7th day of the week as a holy day on which no work shall be done by man or beast. Children and servants are to desist from all work, and even the stranger within the gates is required to keep the day holy. The reason assigned is that Yahweh rested on the 7th day and blessed it and hallowed it. There is no hint that the restrictions were meant to guard against the wrath of a jealous and angry deity. The Sabbath was meant to be a blessing to man and not a burden. After the sin in connection with the golden call Yahweh rehearses the chief duties required of Israel, and again announces the law of the Sabbath (<a onClick="return mV(\'Exd\',34,21);">Ex 34:21</a>, ascribed to J). In the Levitical legislation there is frequent mention of the Sabbath (<a onClick="return mV(\'Exd\',31,\'13-16\');">Ex 31:13-16</a>; <a onClick="return mV(\'Exd\',35,2);">35:2</a>f; <a onClick="return mV(\'Lev\',19,3,10);">Le 19:3,10</a>; <a onClick="return mV(\'Lev\',23,3,18);">23:3,18</a>). A willful Sabbath-breaker was put to death (<a onClick="return mV(\'Num\',15,\'32-36\');">Nu 15:32-36</a>). In the Deuteronomic legislation there is equal recognition of the importance and value of the Sabbath (<a onClick="return mV(\'Deu\',5,\'12-15\');">De 5:12-15</a>). Here the reason assigned for the observance of the Sabbath philanthropic and humanitarian: "that thy man-servant and thy maid-servant may rest as well as thou." It is thus manifest that all the Pentateuchal codes, whether proceeding from Moses alone or from many hands in widely different centuries, equally recognize the Sabbath as one of the characteristic institutions of Israel\'s religious and social life. If we cannot point to any observance of the weekly Sabbath prior to Moses, we can at least be sure that this was one of the institutions which he gave to Israel. From the days of Moses until now the holy Sabbath has been kept by devout Israelites.<P>2. Critical Theories:<P>"The older theories of the origin of the Jewish Sabbath (connecting it with Egypt, with the day of Saturn, or in general with the seven planets) have now been almost entirely abandoned (see <a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>, sec. I, 5). The disposition at present is to regard the day as originally a lunar festival, similar to a Bablonian custom (Schrader, Stud. u. Krit., 1874), the rather as the cuneiform documents appear to contain a term sabattu or sabattum, identical in form and meaning with the Hebrew word sabbathon." Thus wrote Professor C. H. Toy in 1899 (JBL, XVIII, 190). In a syllabary (II R, 32, 16a, b) sabattum is said to be equivalent to um nuh libbi, the natural translation of which seemed to be "day of rest of the heart." Schrader, Sayce and others so understood the phrase, and naturally looked upon sabattum as equivalent to the Hebrew Sabbath. But Jensen and others have shown that the phrase should be rendered "day of the appeasement of the mind" (of an offended deity). The reference is to a day of atonement or pacification rather than a day of rest, a day in which one must be careful not to arouse the anger of the god who was supposed to preside over that particular day. Now the term sabattum has been found only 5 or 6 times in the Babylonian inscriptions and in none of them is it connected with the 7th day of a week. There was, however, a sort of institution among the superstitious Babylonians that has been compared with the Hebrew Sabbath. In certain months of the year (Elul, Marcheshvan) the 7th, 14th, 19th, 21st and 28th days were set down as favorable days, or unfavorable days, that is, as days in which the king, the priest and the physician must be careful not to stir up the anger of the deity. On these days the king was not to eat food prepared by fire, not to put on royal dress, not to ride in his chariot, etc. As to the 19th day, it is thought that it was included among the unlucky days because it was the 49th (7 times 7) from the 1st of the preceding month. As there were 30 days in the month, it is evident that we are not dealing with a recurring 7th day in the week, as is the case with the Hebrew Sabbath. Moreover, no proof has been adduced that the term sabattum was ever applied to these dies nefasti or unlucky days. Hence, the assertions of some Assyriologists with regard to the Babylonian origin of the Sabbath must be taken with several grams of salt. Notice must be taken of an ingenious and able paper by Professor M. Jastrow, which was read before the Eleventh International Congress of Orientalists in Paris in 1897, in which the learned author attempts to show that the Hebrew Sabbath was originally a day of propitiation like the Babylonian sabattum (AJT, II, 312-52). He argues that the restrictive measures in the Hebrew laws for the observance of the Sabbath arose from the original conception of the Sabbath as an unfavorable day, a day in which the anger of Yahweh might flash forth against men. Although Jastrow has supported his thesis with many arguments that are cogent, yet the reverent student of the Scriptures will find it difficult to resist the impression that the Old Testament writers without exception thought of the Sabbath not as an unfavorable or unlucky day but rather as a day set apart for the benefit of man. Whatever may have been the attitude of the early Hebrews toward the day which was to become a characteristic institution of Judaism in all ages and in all lands, the organs of revelation throughout the Old Testament enforce the observance of the Sabbath by arguments which lay emphasis upon its beneficent and humanitarian aspects.<P>We must call attention to Meinhold\'s ingenious hypothesis as to the origin of the Sabbath. In 1894 Theophilus G. Pinches discovered a tablet in which the term shapattu is applied to the 15th day of the month. Meinhold argues that shabattu in Babylonian denotes the day of the full moon. Dr. Skinner thus describes Meinhold\'s theory: "He points to the close association of new-moon and Sabbath in nearly all the pre-exilic references (<a onClick="return mV(\'Amo\',8,5);">Am 8:5</a>; <a onClick="return mV(\'Hsa\',2,11);">Ho 2:11</a>; <a onClick="return mV(\'Isa\',1,13);">Isa 1:13</a>; <a onClick="return mV(\'2Ki\',4,23);">2Ki 4:23</a>f); and concludes that in early Israel, as in Babylonia, the Sabbath was the full-moon festival and nothing else. The institution of the weekly Sabbath he traces to a desire to compensate for the loss of the old lunar festivals, when these were abrogated by the Deuteronomic reformation. This innovation he attributes to Ezekiel; but steps toward it are found in the introduction of a weekly day of rest during harvest only (on the ground of <a onClick="return mV(\'Deu\',16,8);">De 16:8</a>f; compare <a onClick="return mV(\'Exd\',34,21);">Ex 34:21</a>), and in the establishment of the sabbatical year (<a onClick="return mV(\'Lev\',25,\'1-\');">Le 25</a>), which he considers to be older than the weekly Sabbath" (ICC on Genesis, p. 39). Dr. Skinner well says that Meinhold\'s theory involves great improbabilities. It is not certain that the Babylonians applied the term sabattu to the 15th day of the month because it was the day of the full moon; and it is by no means certain that the early prophets in Israel identified Sabbath with the festival of the full moon.<P>The wealth of learning and ingenuity expended in the search for the origin of the Sabbath has up to the present yielded small returns.<P>II. History of the Sabbath after Moses.<P>1. In the Old Testament:<P>The early prophets and historians occasionally make mention of the Sabbath. It is sometimes named in connection with the festival of the new moon (<a onClick="return mV(\'2Ki\',4,23);">2Ki 4:23</a>; <a onClick="return mV(\'Amo\',8,5);">Am 8:5</a>; <a onClick="return mV(\'Hsa\',2,11);">Ho 2:11</a>; <a onClick="return mV(\'Isa\',1,13);">Isa 1:13</a>; <a onClick="return mV(\'Eze\',46,3);">Eze 46:3</a>). The prophets found fault with the worship on the Sabbath, because it was not spiritual nor prompted by love and gratitude. The Sabbath is exalted by the great prophets who faced the crisis of the Babylonian exile as one of the most valuable institutions in Israel\'s life. Great promises are attached to faithful observance of the holy day, and confession is made of Israel\'s unfaithfulness in profaning the Sabbath (<a onClick="return mV(\'Jer\',17,\'21-27\');">Jer 17:21-27</a>; <a onClick="return mV(\'Isa\',56,2,4);">Isa 56:2,4</a>; <a onClick="return mV(\'Isa\',58,13);">58:13</a>; <a onClick="return mV(\'Eze\',20,\'12-24\');">Eze 20:12-24</a>). In the Persian period Nehemiah struggled earnestly to make the people of Jerusalem observe the law of the Sabbath (<a onClick="return mV(\'Neh\',10,31);">Ne 10:31</a>; <a onClick="return mV(\'Neh\',13,\'15-22\');">13:15-22</a>).<P>2. In the Inter-Testamental Period:<P>With the development of the synagogue the Sabbath became a day of worship and of study of the Law, as well as a day of cessation from all secular employment. That the pious in Israel carefully observed the Sabbath is clear from the conduct of the Maccabees and their followers, who at first declined to resist the onslaught made by their enemies on the Sabbath (1Macc 2:29-38); but necessity drove the faithful to defend themselves against hostile attack on the Sabbath (1Macc 2:39-41). It was during the period between Ezra and the Christian era that the spirit of Jewish legalism flourished. Innumerable restrictions and rules were formulated for the conduct of life under the Law. Great principles were lost to sight in the mass of petty details. Two entire treatises of the Mishna, Shabbath and \'Erubhin, are devoted to the details of Sabbath observance. The subject is touched upon in other parts of the Mishna; and in the Gemara there are extended discussions, with citations of the often divergent opinions of the rabbis. In the Mishna (Shahbath, vii.2) there are 39 classes of prohibited actions with regard to the Sabbath, and there is much hair-splitting in working out the details. The beginnings of this elaborate definition of actions permitted and actions forbidden are to be found in the centuries immediately preceding the Christian era. The movement was at flood tide during our Lord\'s earthly ministry and continued for centuries afterward, in spite of His frequent and vigorous protests.<P>3. Jesus and the Sabbath:<P>Apart from His claim to be the Messiah, there is no subject on which our Lord came into such sharp conflict with the religious leaders of the Jews as in the matter of Sabbath observance. He set Himself squarely against the current rabbinic restrictions as contrary to the spirit of the original law of the Sabbath. The rabbis seemed to think that the Sabbath was an end in itself, an institution to which the pious Israelite must subject all his personal interests; in other words, that man was made for the Sabbath: man might suffer hardship, but the institution must be preserved inviolate. Jesus, on the contrary, taught that the Sabbath was made for man\'s benefit. If there should arise a conflict between man\'s needs and the letter of the Law, man\'s higher interests and needs must take precedence over the law of the Sabbath (<a onClick="return mV(\'Mat\',12,\'1-14\');">Mt 12:1-14</a>; <a onClick="return mV(\'Mar\',2,23);">Mr 2:23-3:6</a>; <a onClick="return mV(\'Luk\',6,\'1-11\');">Lu 6:1-11</a>; also <a onClick="return mV(\'Jhn\',5,\'1-18\');">Joh 5:1-18</a>; <a onClick="return mV(\'Luk\',13,\'10-17\');">Lu 13:10-17</a>; <a onClick="return mV(\'Luk\',14,\'1-6\');">14:1-6</a>). There is no reason to think that Jesus meant to discredit the Sabbath as an institution. It was His custom to attend worship in the synagogue on the Sabbath (<a onClick="return mV(\'Luk\',4,16);">Lu 4:16</a>). The humane element in the rest day at the end of every week must have appealed to His sympathetic nature. It was the one precept of the Decalogue that was predominantly ceremonial, though it had distinct sociological and moral value. As an institution for the benefit of toiling men and animals, Jesus held the Sabbath in high regard. As the Messiah, He was not subject to its restrictions; He could at any moment assert His lordship over the Sabbath (<a onClick="return mV(\'Mar\',2,28);">Mr 2:28</a>). The institution was not on a par with the great moral precepts, which are unchangeable. It is worthy of note that, while Jesus pushed the moral precepts of the Decalogue into the inner realm of thought and desire, thus making the requirement more difficult and the law more exacting, He fought for a more liberal and lenient interpretation of the law of the Sabbath. Rigorous sabbatarians must look elsewhere for a champion of their views.<P>4. Paul and the Sabbath:<P>The early Christians kept the 7th day as a Sabbath, much after the fashion of other Jews. Gradually the 1st day of the week came to be recognized as the day on which the followers of Jesus would meet for worship. The resurrection of our Lord on that day made it for Christians the most joyous day of all the week. When Gentiles were admitted into the church, the question at once arose whether they should be required to keep the Law of Moses. It is the glory of Paul that he fought for and won freedom for his Gentile fellow-Christians. It is significant of the attitude of the apostles that the decrees of the Council at Jerusalem made no mention of Sabbath observance in the requirements laid upon Gentile Christians (<a onClick="return mV(\'Act\',15,28);">Ac 15:28</a>f). Paul boldly contended that believers in Jesus, whether Jew or Gentile, were set free from the burdens of the Mosaic Law. Even circumcision counted for nothing, now that men were saved by believing in Jesus (<a onClick="return mV(\'Gal\',5,6);">Ga 5:6</a>). Christian liberty as proclaimed by Paul included all days and seasons. A man could observe special days or not, just as his own judgment and conscience might dictate (<a onClick="return mV(\'Rom\',14,5);">Ro 14:5</a>f); but in all such matters one ought to be careful not to put a stumblingblock in a brother\'s way (<a onClick="return mV(\'Rom\',14,13);">Ro 14:13</a>). That Paul contended for personal freedom in respect of the Sabbath is made quite clear in <a onClick="return mV(\'Col\',2,16);">Col 2:16</a>f; where he groups together dietary laws, feast days, new moons and sabbaths. The early Christians brought over into their mode of observing the Lord\'s Day the best elements of the Jewish Sabbath, without its onerous restrictions.)<P>See further <a href="./study/isbe/search.html?string=LORD\'S+DAY">LORD\'S DAY</a>; <a href="./study/isbe/search.html?string=ETHICS+OF+JESUS">ETHICS OF JESUS</a>, I,3,(1).<P>LITERATURE. J. A. Hessey, Sunday, Its Origin, History, and Present Obligation (Bampton Lectures for 1860); Zahn, Geschichte des Sonntags, 1878; Davis, Genesis and Semitic Tradition,1894,23-35; Jastrow, "The Original Character of the Heb Sabbath," AJT, II,1898,312-52; Toy, "The Earliest Form of the Sabbath," JBL, XVIII. 1899, 190-94; W. Lotz, Questionum de historia Sabbati libri duo, 1883; Nowack, Hebr. Arch., II,1894,140ff; Driver, HDB, IV,1902,317-23; ICC, on "Gen," 1911, 35-39; Dillmann, Ex u. Lev3, 1897, 212-16; Edersheim, Life and Times of Jesus the Messiah, II,1883, 51-62, 777-87; Broadus, Commentary on Matthew, 256-61; EB, IV,1903, 4173-80; Gunkel, Gen3, 1910, 114-16; Meinhold, Sabbat u. Woche im Altes Testament, 1905; Beer, Schabbath, 1908.<P>John Richard Samphey<P>III. SEVENTH-DAY ADVENTIST POSITION<P>The views entertained by Seventh-Day Adventists concerning the nature and obligation of the Sabbath may conveniently be presented under three general divisions: (1) what the Bible says concerning the Sabbath; (2) what history says concerning the Sabbath; (3) the significance of the Sabbath.<P>1. What the Bible Says concerning the Sabbath:<P>(1) Old Testament Teaching.<P>In their views concerning the institution and primal obligation of the Sabbath, Seventh-Day Adventists are in harmony with the views held by the early representatives of nearly all the evangelical denominations. The Sabbath is coeval with the finishing of creation, and the main facts connected with establishing it are recorded in <a onClick="return mV(\'Gen\',2,2,3);">Ge 2:2,3</a>. The blessing here placed upon the seventh day distinguishes it from the other days of the week, and the day thus blessed was "sanctified" (King James Version, Revised Version "hallowed") and set apart for man.<P>That the Sabbath thus instituted was well known throughout the Patriarchal age is clearly established both by direct evidence and by necessary inference.<P>"If we had no other passage than this of <a onClick="return mV(\'Gen\',2,3);">Ge 2:3</a>, there would be no difficulty in deducing from it a precept for the universal observance of a Sabbath, or seventh day, to be devoted to God as holy time by all of that race for whom the earth and all things therein were specially prepared. The first men must have known it. The words, \'He hallowed it,\' can have no meaning otherwise. They would be a blank unless in reference to some who were required to keep it holy" (Lange\'s Commentary on <span class="noTag">Ge 2:3</span>, I, 197).<P>"And the day arrived when Moses went to Goshen to see his brethren, that he saw the children of Israel in their burdens and hard labor, and Moses was grieved on their account. And Moses returned to Egypt and came to the house of Pharaoh, and came before the king, and Moses bowed down before the king. And Moses said unto Pharaoh, I pray thee, my lord, I have come to seek a small request from thee, turn not away my face empty; and Pharaoh said unto him, Speak. And Moses said unto Pharaoh, Let there be given unto thy servants the children of Israel who are in Goshen, one day to rest therein from their labor. And the king answered Moses and said, Behold I have lifted up thy face in this thing to grant thy request. And Pharaoh ordered a proclamation to be issued throughout Egypt and Goshen, saying, To you, all the children of Israel, thus says the king, for six days you shall do your work and labor, but on the seventh day you shall rest, and shall not perform any work; thus shall you do in all the days, as the king and Moses the son of Bathia have commanded. And Moses rejoiced at this thing which the king had granted to him, and all the children of Israel did as Moses ordered them. For this thing was from the Lord to the children of Israel, for the Lord had begun to remember the children of Israel to save them for the sake of their fathers. And the Lord was with Moses, and his fame went throughout Egypt. And Moses became great in the eyes of all the Egyptians, and in the eyes of all the children of Israel, seeking good for his people Israel, and speaking words of peace regarding them to the king" (Book of Jashar 70 41-51, published by Noah and Gould, New York, 1840).<P>"Hence, you can see that the Sabbath was before the Law of Moses came, and has existed from the beginning of the world. Especially have the devout, who have preserved the true faith, met together and called upon God on this day" (Luther\'s Works, XXXV, p. 330).<P>"Why should God begin two thousand years after (the creation of the world) to give men a Sabbath upon the reason of His rest from the creation of it, if He had never called man to that commemoration before? And it is certain that the Sabbath was observed at the falling of the manna before the giving of the Law; and let any considering Christian judge ....<P>(1) whether the not falling of manna, or the rest of God after the creation, was like to be the original reason of the Sabbath;<P>(2) and whether, if it had been the first, it would not have been said, Remember to keep holy the Sabbath day; for on six days the manna fell, and not on the seventh; rather than for in six days God created heaven and earth, etc., and rested the seventh day.\' And it is casually added, \'Wherefore the Lord blessed the Sabbath day, and hallowed it.\' Nay, consider whether this annexed reason intimates not that the day on this ground being hallowed before, therefore it was that God sent not down the manna on that day, and that He prhibited the people from seeking it" (Richard Baxter, Practical Works, III,774,edition 1707).<P>That the Sabbath was known to those who came out of Egypt, even before the giving of the Law at Sinai, is shown from the experience with the manna, as recorded in <a onClick="return mV(\'Exd\',16,\'22-30\');">Ex 16:22-30</a>. The double portion on the sixth day, and its preservation, was the constantly recurring miracle which reminded the people of their obligation to observe the Sabbath, and that the Sabbath was a definite day, the seventh day. To the people, first wondering at this remarkable occurrence, Moses said, "This is that which the Lord hath said, To morrow is the rest of the holy sabbath unto the Lord" (<a onClick="return mV(\'Exd\',16,23);">Ex 16:23</a>, King James Version). And to some who went out to gather manna on the seventh day, the Lord administered this rebuke: "How long refuse ye to keep my commandments and my laws?" (<a onClick="return mV(\'Exd\',16,28);">Ex 16:28</a>). All this shows that the Sabbath law was well understood, and that the failure to observe it rendered the people justly subject to Divine reproof.<P>At Sinai, the Sabbath which was instituted at creation, and had been observed during the intervening centuries, was embodied in that formal statement of man\'s duties usually designated as the "Ten Commandments." It is treated as an institution already well known and the command is, "Remember the sabbath day, to keep it holy" (<a onClick="return mV(\'Exd\',20,8);">Ex 20:8</a>). In the 4th commandment the basis of the Sabbath is revealed. It is a memorial of the Creator\'s rest at the close of those six days in which He made "heaven and earth, the sea, and all that in them is." For this reason "Yahweh blessed the sabbath day, and hallowed it." This blessing was not placed upon the day at Sinai, but in the beginning, when "God blessed the seventh day, and hallowed it" (<a onClick="return mV(\'Gen\',2,3);">Ge 2:3</a>).<P>From the very nature of the basis of the Sabbath, as set forth in this commandment, both the institution itself and the definite day of the Sabbath are of a permanent nature. So long as it is true that God created heaven and earth, and all things therein, so long will the Sabbath remain as a memorial of that work; and so long as it is true that this creative work was completed in six days, and that God Himself rested on the seventh day, and was refreshed in the enjoyment of His completed work, so long will it be true that the memorial of that work can properly be celebrated only upon the seventh day of the week.<P>During all the period from the deliverance out of Egypt to the captivity in Babylon, the people of God were distinguished from the nations about them by the worship of the only true God, and the observance of His holy day. The proper observance of the true Sabbath would preserve them from idolatry, being a constant reminder of the one God, the Creator of all things. Even when Jerusalem was suffering from the attacks of the Babylonians, God assured His people, through the prophet Jeremiah, that if they would hallow the Sabbath day, great should be their prosperity, and the city should remain forever (<a onClick="return mV(\'Jer\',17,18);">Jer 17:18</a>). This shows that the spiritual observance of the Sabbath was the supreme test of their right relation to God. In those prophecies of Isaiah, which deal primarily with the restoration from Babylon, remarkable promises were made to those who would observe the Sabbath, as recorded in <a onClick="return mV(\'Isa\',56,\'1-7\');">Isa 56:1-7</a>.<P>(2) New Testament Teaching.<P>From the record found in the four Gospels, it is plain that the Jews during all the previous centuries had preserved a knowledge both of the Sabbath institution and of the definite day.<P>It is equally plain that they had made the Sabbath burdensome by their own rigorous exactions concerning it. And Christ, the Lord of the Sabbath, both by example and by precept, brushed aside these traditions of men that He might reveal the Sabbath of the commandment as God gave it—a blessing and not a burden. A careful reading of the testimony of the evangelists will show that Christ taught the observance of the commandments of God, rather than the traditions of men, and that the charge of Sabbath-breaking was brought against Him for no other reason than that He refused to allow the requirements of man to change the Sabbath, blessed of God, into a merely human institution, grievous in its nature, and enforced upon the people with many and troublesome restrictions.<P>All are agreed that Christ and His disciples observed the seventh-day Sabbath previous to the crucifixion. That His followers had received no intimation of any proposed change at His death, is evident from the recorded fact that on the day when He was in the tomb they rested, "on the sabbath...according to the commandment" (<a onClick="return mV(\'Luk\',23,56);">Lu 23:56</a>); and that they treated the following day, the first day of the week, the same as of old, is further evident, as upon that day they came unto the sepulcher for the purpose of anointing the body of Jesus. In the Book of Acts, which gives a brief history of the work of the disciples in proclaiming the gospel of a risen Saviour, no other Sabbath is recognized than the seventh day, and this is mentioned in the most natural way as the proper designation of a well-known institution (<a onClick="return mV(\'Act\',13,14,27,42);">Ac 13:14,27,42</a>; <a onClick="return mV(\'Act\',16,13);">16:13</a>; <a onClick="return mV(\'Act\',18,4);">18:4</a>).<P>In our Lord\'s great prophecy, in which He foretold the experience of the church between the first and the second advent, He recognized the seventh-day Sabbath as an existing institution at the time of the destruction of Jerusalem (70 AD), when He instructed His disciples, "Pray ye that your flight be not in the winter, neither on a sabbath" (<a onClick="return mV(\'Mat\',24,20);">Mt 24:20</a>). Such instruction given in these words, and at that time, would have been confusing in the extreme, had there been any such thing contemplated as the overthrow of the Sabbath law at the crucifixion, and the substitution of another day upon an entirely different basis.<P>That the original Sabbath is to be observed, not only during the present order of things, but also after the restoration when, according to the vision of the revelator, a new heaven and a new earth will take the place of the heaven and the earth that now are, is clearly intimated in the words of the Lord through the prophet Isaiah: "For as the new heavens and the new earth, which I will make, shall remain before me, saith Yahweh, so shall your seed and your name remain. And it shall come to pass, that from one new moon to another, and from one sabbath to another, shall all flesh come to worship before me, saith Yahweh" (<a onClick="return mV(\'Isa\',66,22,23);">Isa 66:22,23</a>).<P>Seventh-Day Adventists regard the effort to establish the observance of another day than the seventh by using such texts as <a onClick="return mV(\'Jhn\',20,19,26);">Joh 20:19,26</a>; <a onClick="return mV(\'Act\',20,7);">Ac 20:7</a>; <a onClick="return mV(\'1Cr\',16,1,2);">1Co 16:1,2</a>; <a onClick="return mV(\'Rev\',1,10);">Re 1:10</a> as being merely an afterthought, an effort to find warrant for an observance established upon other than Biblical authority. During the last two or three centuries there has been a movement for the restoration of the original seventh-day Sabbath, not as a Jewish, but as a Christian, institution. This work, commenced and carried forward by the Seventh-Day Baptists, has been taken up and pushed with renewed vigor by the Seventh-Day Adventists during the present generation, and the Bible teaching concerning the true Sabbath is now being presented in nearly every country, both civilized and uncivilized, on the face of the earth.<P>2. What History Says about the Sabbath:<P>(1) Josephus.<P>This summary of history must necessarily be brief, and it will be impossible, for lack of space, to quote authorities. From the testimony of Josephus it is clear that the Jews, as a nation, continued to observe the seventh-day Sabbath until their overthrow, when Jerusalem was captured by Titus, 70 AD. As colonies, and individuals, scattered over the face of the earth, the Jews have preserved a knowledge of the original Sabbath, and the definite day, until the present time. They constitute a living testimony for the benefit of all who desire to know the truth of this matter.<P>(2) Church History.<P>According to church history, the seventh-day Sabbath was observed by the early church, and no other day was observed as a Sabbath during the first two or three centuries (see HDB, IV, 322 b).<P>In the oft-repeated letter of Pliny, the Roman governor of Bithynia, to the emperor Trajan, written about 112 AD, there occurs the expression, "a certain stated day," which is usually assumed to mean Sunday. With reference to this matter W.B. Taylor, in Historical Commentaries, chapter i, section 47, makes the following statement: "As the Sabbath day appears to have been quite as commonly observed at this date as the sun\'s day (if not even more so), it is just as probable that this \'stated day\' referred to by Pliny was the 7th day as that it was the 1st day; though the latter is generally taken for granted." "Sunday was distinguished as a day of joy by the circumstances that men did not fast upon it, and that they prayed standing up and not kneeling, as Christ had now been raised from the dead. The festival of Sunday, like all other festivals, was always only a human ordinance, and it was far from the intentions of the apostles to establish a divine command in this respect, far from them, and from the early apostolic church, to transfer the laws of the Sabbath to Sunday. Perhaps at the end of the 2nd century, a false application of this kind had begun to take place; for men appear by that time to have considered laboring on Sunday as a sin" (Tertullian De Orat., c. 23). This quotation is taken from Rose\'s Neander, London, 1831, I, 33f; and is the correct translation from Neander\'s first German edition, Hamburg,1826,I, pt. 2, p. 339. Neander has in his 2nd edition,1842,omitted the second sentence, in which he expressly stated that Sunday was only a human ordinance, but he has added nothing to the contrary. "The Christians in the ancient church very soon distinguished the first day of the week, Sunday; however, not as a Sabbath, but as an assembly day of the church, to study the Word of God together and to celebrate the ordinances one with another: without a shadow of doubt this took place as early as the first part of the 2nd century" (Geschichte des Sonntags, 60).<P>Gradually, however, the first day of the week came into prominence as an added day, but finally by civil and ecclesiastical authority as a required observance. The first legislation on this subject was the famous law of Constantine, enacted 321 AD. The acts of various councils during the 4th and 5th centuries established the observance of the first day of the week by ecclesiastical authority, and in the great apostasy which followed, the rival day obtained the ascendancy. During the centuries which followed, however, there were always witnesses for the true Sabbath, although under great persecution. And thus in various lands, the knowledge of the true Sabbath has been preserved.<P>3. The Significance of the Sabbath:<P>In the creation of the heavens and the earth the foundation of the gospel was laid. At the close of His created work, "God saw everything that he had made, and, behold, it was very good" (<a onClick="return mV(\'Gen\',1,31);">Ge 1:31</a>). The Sabbath was both the sign and the memorial of that creative power which is able to make all things good. But man, made in the image of God, lost that image through sin. In the gospel, provision is made for the restoration of the image of God in the soul of man. The Creator is the Redeemer and redemption is the new creation. Since the Sabbath was the sign of that creative power which worked in Christ, the Word, in the making of the heaven and the earth and all things therein, so it is the sign of that same creative power working through the same eternal Word for the restoration of all things. "Wherefore if any man is in Christ, there is a new creation: the old things are passed away; behold, they are become new" (<a onClick="return mV(\'2Cr\',5,17);">2Co 5:17</a> margin). "For neither is circumcision anything, nor uncircumcision, but a new creation" (<a onClick="return mV(\'Gal\',6,15);">Ga 6:15</a> margin). "For we are his workmanship, created in Christ Jesus for good works, which God afore prepared that we should walk in them" (<a onClick="return mV(\'Eph\',2,10);">Eph 2:10</a>).<P>A concrete illustration of this gospel meaning of the Sabbath is found in the deliverance of Israel from Egypt. The same creative power which wrought in the beginning was exercised in the signs and miracles which preceded their deliverance, and in those miracles, such as the opening of the Red Sea, the giving of the manna, and the water from the rock, which attended the journeyings of the Israelites. In consequence of these manifestations of creative power in their behalf, the children of Israel were instructed to remember in their observance of the Sabbath that they were bondsmen in the land of Egypt. Israel\'s deliverance from Egypt is the type of every man\'s deliverance from sin; and the instruction to Israel concerning the Sabbath shows its true significance in the gospel of salvation from sin, and the new creation in the image of God.<P>Furthermore, the seventh-day Sabbath is the sign of both the divinity and the deity of Christ. God only can create. He through whom this work is wrought must be one with God. To this the Scriptures testify: "In the beginning was the Word,...and the Word was God....All things were made through him; and without him was not anything made that hath been made." But this same Word which was with God, and was God, "became flesh, and dwelt among us" (<a onClick="return mV(\'Jhn\',1,1,3,14);">Joh 1:1,3,14</a>). This is the eternal Son, "in whom we have our redemption through his blood, the forgiveness of our trespasses, according to the riches of his grace" (<a onClick="return mV(\'Eph\',1,7);">Eph 1:7</a>). To the Christian the Sabbath, which was the sign and memorial of that divine power which wrought through the eternal Word in the creation of the heaven and the earth, becomes the sign of the same power working through the same eternal Son to accomplish the new creation, and is thus the sign of both the divinity and the deity of Christ.<P>Inasmuch as the redemptive work finds its chiefest expression in the cross of Christ, the Sabbath, which is the sign of that redemptive work, becomes the sign of the cross.<P>Seventh-Day Adventists teach and practice the observance of the Sabbath, not because they believe in salvation through man\'s effort to keep the law of God, but because they believe in that salvation which alone can be accomplished by the creative power of God working through the eternal Son to create believers anew in Christ Jesus.<P>Seventh-Day Adventists believe, and teach, that the observance of any other day than the seventh as the Sabbath is the sign of that predicted apostasy in which the man of sin would be revealed who would exalt himself above all that is called God, or that is worshipped.<P>Seventh-Day Adventists believe, and teach, that the observance of the true Sabbath in this generation is a part of that gospel work which is to make ready a people prepared for the Lord.``140';
isbe[7538]='Sabbath Day\'s Journey`jur\'-ni (sabbatou hodos): Used only in <a onClick="return mV(\'Act\',1,12);">Ac 1:12</a>, where it designates the distance from Jerusalem to the Mount of Olives, to which Jesus led His disciples on the day of His ascension. The expression comes from rabbinical usage to indicate the distance a Jew might travel on the Sabbath without transgressing the Law, the command against working on that day being interpreted as including travel (see <a onClick="return mV(\'Exd\',16,\'27-30\');">Ex 16:27-30</a>). The limit set by the rabbis to the Sabbath day\'s journey was 2,000 cubits from one\'s house or domicile, which was derived from the statement found in <a onClick="return mV(\'Jos\',3,4);">Jos 3:4</a> that this was the distance between the ark and the people on their march, this being assumed to be the distance between the tents of the people and the tabernacle during the sojourn in the wilderness. Hence, it must have been allowable to travel thus far to attend the worship of the tabernacle. We do not know when this assumption in regard to the Sabbath day\'s journey was made, but it seems to have been in force in the time of Christ. The distance of the Mount of Olives from Jerusalem is stated in Josephus (Ant., XX, viii, 6) to have been five stadia or furlongs and in BJ, V, ii,3,six stadia, the discrepancy being explained by supposing a different point of departure. This would make the distance of the Sabbath day\'s journey from 1,000 to 1,200 yards, the first agreeing very closely with the 2,000 cubits. The rabbis, however, invented a way of increasing this distance without technically infringing the Law, by depositing some food at the 2,000-cubit limit, before the Sabbath, and declaring that spot a temporary domicile. They might then proceed 2,000 cubits from this point without transgressing the Law.<P>And in some cases even this intricacy of preparation was unnecessary. If, for instance, the approach of the Sabbath found one on his journey, the traveler might select some tree or some stone wall at a distance of 2,000 paces and mentally declare this to be his residence for the Sabbath, in which case he was permitted to go the 2,000 paces to the selected tree or wall and also 2,000 paces beyond, but in such a case he must do the work thoroughly and must say: "Let my Sabbath residence be at the trunk of that tree," for if he merely said: "Let my Sabbath residence be under that tree," this would not be sufficient, because the, expression would be too general and indefinite (Tractate \'Erubhin 4:7).<P>Other schemes for extending the distance have been devised, such as regarding the quarter of the town in which one dwells, or the whole town itself, as the domicile, thus allowing one to proceed from any part of the town to a point 2,000 cubits beyond its utmost limits. This was most probably the case with walled towns, at least, and boundary stones have been found in the vicinity of Gaza with inscriptions supposed to mark these limits. The 2,000-cubit limits around the Levitical cities (<a onClick="return mV(\'Num\',35,5);">Nu 35:5</a>) may have suggested the limit of the Sabbath day\'s journey also. The term came to be used as a designation of distance which must have been more or less definite.``138';

isbe[7542]='Sabbath, Second After the First`(sabbaton deuteroproton (<a onClick="return mV(\'Luk\',6,1);">Lu 6:1</a>), literally, "the second-first sabbath," of the Revised Version margin): We will mention only a few of the explanations elicited by this expression.<P>(1) It was the first Sabbath in the second year of a 7-year cycle comprising the period from one Sabbatic year to the other;<P>(2) the first Sabbath after the second day of Passover, i.e. the first of the seven Sabbaths the Hebrews were to "count unto" themselves from "the morrow after the sabbath" (the day after Easter) until Pentecost (<a onClick="return mV(\'Lev\',23,15);">Le 23:15</a>);<P>(3) the first Sabbath in the Jewish ecclesiastical year (about the middle of March), the first Sabbath in the civil year (about the middle of September) being counted as the "first-first" Sabbath;<P>(4) the term deuteroprotos, is a monstrous combination of the words deuteros, "second," and protos, "first," attributable to unskillful attempts at textual emendation on the part of copyists. This supposition would, of course, render unnecessary all other efforts to unravel the knotty problem, and, as a matter of fact, deuteroprotos is omitted by many manuscripts (including Codex Sinaiticus and Codex Vaticanus). To those not feeling inclined to accept this solution we would suggest the first of the above-named explanations as the most natural and probable one.``8';

isbe[7545]='Sabbaths, of Years`sab\'-aths, (shabbethoth shanim; anapauseis eton (<a onClick="return mV(\'Lev\',25,8);">Le 25:8</a>)): The seven sabbatic years preceding the Year of Jubilee.`<a href="./study/isbe/search.html?string=SABBATICAL+YEAR">SABBATICAL YEAR</a>; <a href="./study/isbe/search.html?string=JUBILEE+YEAR">JUBILEE YEAR</a>; <a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>`1';
isbe[7546]='Sabbatical Year`sa-bat\'-ik-al, shenath shabbathon; eniautos anapauseos, "a year of solemn rest"; or shabbath shabbathon; sabbata anapausis, "a sabbath of solemn rest" (<a onClick="return mV(\'Lev\',25,4);">Le 25:4</a>); or shehath ha-shemittah; etos tes apheseos, "the year of release" (<a onClick="return mV(\'Deu\',15,9);">De 15:9</a>; <a onClick="return mV(\'Deu\',31,10);">31:10</a>)):<P>1. Primary Intention:<P>We find the first rudiments of this institution in the so-called Covenant Book (<a onClick="return mV(\'Exd\',21,\'1-\');">Ex 21-23</a>). Its connection with the day of rest (Sabbath) is obvious, although it strikes us as somewhat remarkable that in <a onClick="return mV(\'Exd\',23,\'10-12\');">Ex 23:10-12</a> the regulation regarding the 7th year should precede the statute respecting the 7th day. Still it seems natural that after the allusion in verse 9, "Ye were sojourners in the land of Egypt," the Covenant Book should put in a good word for the poor in Israel (verse 11: "Let it rest and lie fallow, that the poor of thy people may eat"). Even the beasts of the field are remembered (compare <a onClick="return mV(\'Jon\',4,11);">Jon 4:11</a>).<P>We must, therefore, conclude that in this early period of the history of Israel the regulation regarding the 7th year was primarily intended for the relief of the poor and for the awakening of a sense of responsibility in the hearts of those better provided with the means of subsistence. It would be wrong, however, to deny its Sabbatic character, for the text says expressly, "But in the 7th year thou shalt let it rest" (literally, "thou shalt release it"), implying that the land was entitled to a rest because it needed it; it must be released for a time in order to gain fresh strength and insure its future fertility. Two motives, then, present themselves most clearly, one of a social, the other of an economic character, and both are rooted in God\'s dealings with Israel (compare <a onClick="return mV(\'Exd\',21,1);">Ex 21:1</a>).<P>2. Mosaic Legislation Humane:<P>Another evidence of the humane spirit pervading the Mosaic Law may be found in <a onClick="return mV(\'Exd\',21,\'2-6\');">Ex 21:2-6</a> where, in the case of a Hebrew slave, the length of his servitude is limited to six years. The connection with the idea of the Sabbath is evident, but we fail to detect here any reference to the Sabbatical year. It is clear that the 7th year in which a slave might be set free need not necessarily coincide with the Sabbatical year, though it might, of course, The same is true of <a onClick="return mV(\'Deu\',15,\'12-18\');">De 15:12-18</a>; it has nothing to do with the Sabbatical year. On the other hand it is reasonable to assume that the "release" mentioned in <a onClick="return mV(\'Deu\',15,\'1-3\');">De 15:1-3</a> took place in the Sabbatical year; in other words, its scope had been enlarged in later years so as to include the release from pecuniary obligation, i.e. the remission of debts or, at least, their temporary suspension. This means that the children of Israel were now developing from a purely agricultural people to a commercial nation. Still the same spirit of compassion for the poor and those struggling for a living asserts itself as in the earlier period, and it goes without saying that the old regulation concerning the release of the land in the 7th year was still in force (compare <a onClick="return mV(\'Deu\',15,2);">15:2</a>: "because Yahweh\'s release hath been proclaimed").<P>According to <a onClick="return mV(\'Deu\',15,1);">De 15:1</a>, this proclamation occurred at the end of every 7 years, or, rather, during the 7th year; for we must be careful not to strain the expression "at the end" (compare <a onClick="return mV(\'Deu\',15,9);">15:9</a>, where the 7th year is called "the year of release"; it is quite natural to identify this 7th year with the Sabbatical year).<P>Moreover, we are now almost compelled to assert the Sabbatical year by this time had become an institution observed simultaneously all over the country. From the wording of the regulation regarding the 7th year in the Covenant Book we are not certain about this in those early times. But now it is different. "Yahweh\'s release hath been proclaimed."<P>3. General Observance:<P>It was a solemn and general proclamation, the date of which was very likely the day of atonement in the 7th month (the Sabbatical month). The celebration of the Feast of Tabernacles (booths) began five days later and it lasted from the 15th day to the 21st of the 7th month (Tisri). In the Sabbatical year, at that time, the Law was read "before all Israel in their hearing," a fact which tends to prove that the Sabbatical year had become a matter of general and simultaneous observance (compare <a onClick="return mV(\'Deu\',31,\'10-13\');">De 31:10-13</a>). Another lesson may be deduced from this passage: it gives us a hint respecting the use to which the people may have put their leisure time during the 12 months of Sabbatical rest; it may have been a period of religious and probably other instruction.<P>In <a onClick="return mV(\'Lev\',25,\'1-7\');">Le 25:1-7</a> the central idea of the Sabbatical year is unfolded. Although it has been said we should be careful not to look for too much of the ideal and dogmatic in the institutions of the children of Israel, yet we must never lose sight of the religious and educational character even of their ancient legislation.<P>4. Central Idea:<P>One central thought is brought home to them, namely, God is the owner of the soil, and through His grace only the chosen people have come into its possession. Their time, i.e. they themselves, belong to Him: this is the deepest meaning of the day of rest; their land, i.e. their means of subsistence, belong to Him: this reveals to us the innermost significance of the year of rest. It was Yahweh\'s pleasure to call the children of Israel into life, and if they live and work and prosper, they are indebted to His unmerited loving-kindness. They should, therefore, put their absolute trust in Him, never doubt His word or His power, always obey Him and so always receive His unbounded blessings.<P>If we thus put all the emphasis on the religious character of the Sabbatical year, we are in keeping with the idea permeating the Old Testament, namely that the children of Israel are the chosen people of Yahweh. All their agricultural, social, commercial and political relations were to be built upon their divine calling and shaped according to God\'s sovereign will.<P>But did they live up to it? Or, to limit the question to our subject: Did they really observe the Sabbatical year? There are those who hold that the law regarding the Sabbatical year was not observed before the captivity. In order to prove this assertion they point to <a onClick="return mV(\'Lev\',26,34,43);">Le 26:34f; 43</a>; also to <a onClick="return mV(\'2Ch\',36,21);">2Ch 36:21</a>. But all we can gather from these passages is the palpable conclusion that the law regarding the Sabbatical year had not been strictly obeyed, a deficiency which may mar the effect of any law.<P>The possibility of observing the precept respecting the Sabbatical year is demonstrated by the post-exilic history of the Jewish people. Nehemiah registers the solemn fact that the reestablished nation entered into a covenant to keep the law and to maintain the temple worship (<a onClick="return mV(\'Neh\',9,38);">Ne 9:38</a>; <a onClick="return mV(\'Neh\',10,32);">10:32</a>). In <a onClick="return mV(\'Neh\',10,31);">10:31</A> of the last-named chapter he alludes to the 7th year, "that we would forego the 7th year, and the exaction of every debt." We are not sure of the exact meaning of this short allusion; it may refer to the Sabbatical rest of the land and the suspension of debts.<P>For a certainty we know that the Sabbatical year was observed by the Jews at the time of Alexander the Great. When he was petitioned by the Samaritans "that he would remit the tribute of the 7th year to them, because they did not sow therein, he asked who they were that made such a petition"; he was told they were Hebrews, etc. (Josephus, Ant, XI, viii, 6).<P>During Maccabean and Asmonean times the law regarding the Sabbatical year was strictly observed, although it frequently weakened the cause of the Jews (1Macc 6:49,53; Josephus, Ant, XIII, viii, 1; compare Josephus, Jewish Wars, I, ii, 4; Ant, XIV, x, 6; XV, i, 2). Again we may find references to the Sabbatical year in Josephus, Ant, XIV, xvi,2,etc.; Tac. Hist. v.4, etc., all of which testifies to the observance of the Sabbatical year in the Herodian era. The words of Tacitus show the proud Roman\'s estimate of the Jewish character and customs: "For the 7th day they are said to have prescribed rest because this day ended their labors; then, in addition, being allured by their lack of energy, they also spend the 7th year in laziness."`<a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>; <a href="./study/isbe/search.html?string=JUBILEE+YEAR">JUBILEE YEAR</a>`8';
isbe[7547]='Sabbeus`sa-be\'-us (Sabbaias): In 1Esdras 9:32, the same as "Shemaiah" in <a onClick="return mV(\'Ezr\',10,31);">Ezr 10:31</a>.``1';
isbe[7548]='Sabi`sa\'-bi:<P>(1) Codex Alexandrinus Sabei; Codex Vaticanus Tobeis, Fritzache; the King James Version, Sami): Eponym of a family of porters who returned with Zerubbabel (1Esdras 5:28) = "Shobai" in <a onClick="return mV(\'Ezr\',2,42);">Ezr 2:42</a>; <a onClick="return mV(\'Neh\',7,45);">Ne 7:45</a>.<P>(2) The King James Version = the Revised Version (British and American) <a href="./study/isbe/search.html?string=SABIE">SABIE</a> (which see).``1';
isbe[7549]='Sabias`sa-bi\'-as (Sabias, Fritzsche, Asabias; the King James Version Assabias): One of the six "captains over thousands" who supplied the Levites with much cattle for Josiah\'s Passover (1Esdras 1:9) = "Hashabiah" in <a onClick="return mV(\'2Ch\',35,9);">2Ch 35:9</a>.``1';
isbe[7550]='Sabie`sa\'-bi-e (Sabeie, or Sabie; the King James Version Sabi): In 1Esdras 5:34 both the King James Version and the Revised Version (British and American), following Codex Alexandrinus, read "the sons of Phacareth, the sons of Sabie" (the King James Version "Sabi") for the "Pochereth-hazzebaim" of <a onClick="return mV(\'Ezr\',2,57);">Ezr 2:57</a>; <a onClick="return mV(\'Neh\',7,59);">Ne 7:59</a>. Codex Vaticanus reads correctly as one proper name: "Phacareth Sabie."``1';
isbe[7551]='Sabta or Sabtah`sab\'-ta (cabhta\', cabhtah): Third son of Cush (<a onClick="return mV(\'Gen\',10,7);">Ge 10:7</a> = <a onClick="return mV(\'1Ch\',1,9);">1Ch 1:9</a>). A place Sabta is probably to be looked for in South Arabia. Arab geographers give no exact equivalent of the name. Al Bekri (i.65) quotes a line of early poetry in which Dhu \'l Sabta is mentioned, and the context might indicate a situation in Yemamah; but the word is possibly not a proper name. It is usually identified with Saubatha (Ptol., vi.7, 38) or with the Sabota of Pliny (vi.32; xii.32), an old mercantile city in South Arabia celebrated for its trade in frankincense and, according to Ptolemy, possessing 60 temples. It is said also to have been the territory of a king Elisarus, whose name presents a striking resemblance to Dhu \'l-Adhar, one of the "Tubbas" or Himyarite kings of Yemen. Another conjecture is the Saphtha of Ptolemy (vi.7, 30) near the Arabian shore of the Persian Gulf.``63';
isbe[7552]='Sabteca`sab\'te-ka (cabhtekha\'; Sabakatha, Sebethacha; the King James Version Sabtechah): The 5th named of the sons of Cush in the genealogy of <a onClick="return mV(\'Gen\',10,\'5-7\');">Ge 10:5-7</a>. In <a onClick="return mV(\'1Ch\',1,8,9);">1Ch 1:8,9</a> the King James Version reads "Sabtecha," the Revised Version (British and American) "Sabteca." Many conjectures have been made as to the place here indicated. Recently Glazer (Skizze, II, 252) has revived the suggestion of Bochart that it is to be identified with Samydake in Carmania on the East of the Persian Gulf. This seems to rest on nothing more than superficial resemblance of the names; but the phonetic changes involved are difficult. Others have thought of various places in Arabia, toward the Persian Gulf; but the data necessary for any satisfactory decision are not now available.``54';
isbe[7553]='Sacar`sa\'-kar (sakhar):<P>(1) Father of Ahiam, a follower of David (<a onClick="return mV(\'1Ch\',11,35);">1Ch 11:35</a>, Codex Vaticanus Achar; Codex Alexandrinus Sachar = "Sharar" of <a onClick="return mV(\'2Sa\',23,33);">2Sa 23:33</a>; Sharar is favored as the original reading).<P>(2) Eponym of a family of gatekeepers (<a onClick="return mV(\'1Ch\',26,4);">1Ch 26:4</a>).``1';

isbe[7556]='Sacraments`sak\'-ra-ments:<P>1. The Term:<P>The word "sacrament" comes from the Latin sacramentum, which in the classical period of the language was used in two chief senses:<P>(1) as a legal term to denote the sum of money deposited by two parties to a suit which was forfeited by the loser and appropriated to sacred uses;<P>(2) as a military term to designate the oath of obedience taken by newly enlisted soldiers.<P>Whether referring to an oath of obedience or to something set apart for a sacred purpose, it is evident that sacramentum would readily lend itself to describe such ordinances as Baptism and the Lord\'s Supper. In the Greek New Testament, however, there is no word nor even any general idea corresponding to "sacrament," nor does the earliest history of Christianity afford any trace of the application of the term to certain rites of the church. Pliny (circa 112 AD) describes the Christians of Bithynia as "binding themselves by a sacramentum to commit no kind of crime" (Epistles x.97), but scholars are now pretty generally agreed that Pliny here uses the word in its old Roman sense of an oath or solemn obligation, so that its occurrence in this passage is nothing more than an interesting coincidence.<P>It is in the writings of Tertullian (end of 2nd and beginning of 3rd century) that we find the first evidence of the adoption of the word as a technical term to designate Baptism, the Lord\'s Supper, and other rites of the Christian church. This Christian adoption of sacramentum may have been partly occasioned by the evident analogies which the word suggests with Baptism and the Lord\'s Supper; but what appears to have chiefly determined its history in this direction was the fact that in the Old Latin versions (as afterward in the Vulgate) it had been employed to translate the Greek musterion, "a mystery" (e.g. <a onClick="return mV(\'Eph\',5,32);">Eph 5:32</a>; <a onClick="return mV(\'1Ti\',3,16);">1Ti 3:16</a>; <a onClick="return mV(\'Rev\',1,20);">Re 1:20</a>; <a onClick="return mV(\'Rev\',17,7);">17:7</a>)—an association of ideas which was greatly fostered in the early church by the rapidly growing tendency to an assimilation of Christian worship with the mystery-practices of the Greek-Roman world.<P>2. Nature and Number:<P>Though especially employed to denote Baptism and the Lord\'s Supper, the name "sacraments" was for long used so loosely and vaguely that it was applied to facts and doctrines of Christianity as well as to its symbolic rites. Augustine\'s definition of a sacrament as "the visible form of an invisible grace" so far limited its application. But we see how widely even a definition like this might be stretched when we find Hugo of Victor (12th century) enumerating as many as 30 sacraments that had been recognized in the church. The Council of Trent was more exact when it declared that visible forms are sacraments only when they represent an invisible grace and become its channels, and when it sought further to delimit the sacramental area by reenacting (1547) a decision of the Council of Florence (1439), in which for the first time the authority of the church was given to a suggestion of Peter Lombard (12th century) and other schoolmen that the number of the sacraments should be fixed at seven, namely, Baptism, Confirmation, the Eucharist, Penance, Extreme Unction, Orders, and Matrimony—a suggestion which was supported by certain fanciful analogies designed to show that seven was a sacred number.<P>The divergence of the Protestant churches from this definition and scheme was based on the fact that these proceeded on no settled principles. The notion that there are seven sacraments has no New Testament authority, and must be described as purely arbitrary; while the definition of a sacrament is still so vague that anything but an arbitrary selection of particulars is impossible. It is perfectly arbitrary, for example, to place Baptism and the Lord\'s Supper, which were instituted by Christ as ordinances of the church, in the same category with marriage, which rests not on His appointment but on a natural relationship between the sexes that is as old as the human race. While, therefore, the Reformers retained the term "sacrament" as a convenient one to express the general idea that has to be drawn from the characteristics of the rites classed together under this name, they found the distinguishing marks of sacraments<P>(1) in their institution by Christ,<P>(2) in their being enjoined by Him upon His followers,<P>(3) in their being bound up with His word and revelation in such a way that they become "the expressions of divine thoughts, the visible symbols of divine acts."<P>And, since Baptism and the Lord\'s Supper are the only two rites for which such marks can be claimed, it follows that there are only two New Testament sacraments. Their unique place in the original revelation justifies us in separating them from all other rites and ceremonies that may have arisen in the history of the church, since it raises them to the dignity of forming an integral part of the historical gospel. A justification for their being classed together under a common name may be found, again, in the way in which they are associated in the New Testament (<a onClick="return mV(\'Act\',2,41,42);">Ac 2:41,42</a>; <a onClick="return mV(\'1Cr\',10,\'1-4\');">1Co 10:1-4</a>) and also in the analogy which Paul traces between Baptism and the Lord\'s Supper on the one hand, and Circumcision and the Passover—the two most distinctive rites of the Old Covenant—on the other (<a onClick="return mV(\'Col\',2,11);">Col 2:11</a>; <a onClick="return mV(\'1Cr\',5,7);">1Co 5:7</a>; <a onClick="return mV(\'1Cr\',11,26);">11:26</a>).<P>3. Institution by Christ:<P>The assumption made above, that both Baptism and the Lord\'s Supper owe their origin as sacraments of the church to their definite appointment by Christ Himself, has been strongly challenged by some modern critics.<P>(1) In regard to Baptism it has been argued that as <a onClick="return mV(\'Mar\',16,15);">Mr 16:15</a>f occurs in a passage (<a onClick="return mV(\'Mar\',16,\'9-20\');">16:9-20</A>) which textual criticism has shown to have formed no part of the original Gospel, <a onClick="return mV(\'Mat\',28,19);">Mt 28:19</a>, standing by itself, is too slender a foundation to support the belief that the ordinance rests upon an injunction of Jesus, more especially as its statements are inconsistent with the results of historical criticism. These results, it is affirmed, prove that all the narratives of the Forty Days are legendary, that <a onClick="return mV(\'Mat\',28,19);">Mt 28:19</a> in particular only canonizes a later ecclesiastical situation, that its universalism is contrary to the facts of early Christian history, and its Trinitarian formula "foreign to the mouth of Jesus" (see Harnack, History of Dogma, I,79,and the references there given). It is evident, however, that some of these objections rest upon anti-supernatural pre-suppositions that really beg the question at issue, and others on conclusions for which real premises are wanting. Over against them all we have to set the positive and weighty fact that from the earliest days of Christianity Baptism appears as the rite of initiation into the fellowship of the church (<a onClick="return mV(\'Act\',2,38,41);">Ac 2:38,41</a>, et passim), and that even Paul, with all his freedom of thought and spiritual interpretation of the gospel, never questioned its necessity (compare <a onClick="return mV(\'Rom\',6,3);">Ro 6:3</a>ff; <a onClick="return mV(\'1Cr\',12,13);">1Co 12:13</a>; <a onClick="return mV(\'Eph\',4,5);">Eph 4:5</a>). On any other supposition than that of its appointment by our Lord Himself it is difficult to conceive how within the brief space of years between the death of Jesus and the apostle\'s earliest references to the subject, the ordinance should not only have originated but have established itself in so absolute a manner for Jewish and Gentile Christians alike.<P>(2) In the case of the Lord\'s Supper the challenge of its institution by Christ rests mainly upon the fact that the saying, "This do in remembrance of me," is absent from the Mark-Matthew text, and is found only in the Supper-narratives of Paul (<a onClick="return mV(\'1Cr\',11,24,25);">1Co 11:24,25</a>) and his disciple Luke (<a onClick="return mV(\'Luk\',22,19);">Lu 22:19</a>). Upon this circumstance large structures of critical hypothesis have been reared. It has been affirmed that in the upper room Jesus was only holding a farewell supper with His disciples, and that it never occurred to Him to institute a feast of commemoration. It has further been maintained that the views of Jesus regarding the speedy consummation of His kingdom make it impossible that He should have dreamed of instituting a sacrament to commemorate His death. The significance of the feast was eschatological merely; it was a pledge of a glorious future hour in the perfected kingdom of God (see <a onClick="return mV(\'Mat\',26,29);">Mt 26:29</a> and parallels). And theory has even been advanced that the institution of this sacrament as an ordinance of the church designed to commemorate Christ\'s death was due to the initiative of Paul, who is supposed to have been influenced in this direction by what he had seen in Corinth and elsewhere of the mystery-practices of the Greek world.<P>All these hypothetical fabrics fall, of course, to the ground if the underlying assumption that Jesus never said, "This do in remembrance of me," is shown to be unwarrantable. And it is unwarrantable to assume that a saying of Jesus which is vouched for by Paul and Luke cannot be authentic because it does not occur in the corresponding narratives of Matthew and Mark. In these narratives, which are highly compressed in any case, the first two evangelists would seem to have confined themselves to setting down those sayings which formed the essential moments of the Supper and gave its symbolic contents. The command of its repetition they may have regarded as sufficiently embodied and expressed in the universal practice of the church from the earliest days. For as to that practice there is no question (<a onClick="return mV(\'Act\',2,42,46);">Ac 2:42,46</a>; <a onClick="return mV(\'Act\',20,7);">20:7</a>; <a onClick="return mV(\'1Cr\',10,16);">1Co 10:16</a>; <a onClick="return mV(\'1Cr\',11,26);">11:26</a>), and just as little that it rested upon the belief that Christ had enjoined it. "Every assumption of its having originated in the church from the recollection of intercourse with Jesus at table, and the necessity felt for recalling His death, is precluded" (Weizsacker, Apostolic Age, II, 279). That the simple historical supper of Jesus with His disciples in the upper room was converted by Paul into an institution for the Gentile and Jewish churches alike is altogether inconceivable. The primitive church had its bitter controversies, but there is no trace of any controversy as to the origin and institutional character of the Lord\'s Supper.<P>4. Efficacy:<P>In the New Testament the sacraments are presented as means of grace. Forgiveness (<a onClick="return mV(\'Act\',2,38);">Ac 2:38</a>), cleansing (<a onClick="return mV(\'Eph\',5,25);">Eph 5:25</a>f), spiritual quickening (<a onClick="return mV(\'Col\',2,12);">Col 2:12</a>) are associated with Baptism; the Lord\'s Supper is declared to be a participation in the body and blood of Christ (<a onClick="return mV(\'1Cr\',10,16);">1Co 10:16</a>). So far all Christians are agreed; but wide divergence shows itself thereafter. According to the doctrine of the Roman church, sacraments are efficacious ex opere operato, i.e. in virtue of a power inherent in themselves as outward acts whereby they communicate saving benefits to those who receive them without opposing any obstacle. The Reformed doctrine, on the other hand, teaches that their efficacy lies not in themselves as outward acts, but in the blessing of Christ and the operation of His Spirit, and that it is conditioned by faith in the recipient. The traditional Lutheran doctrine agrees with the Reformed in affirming that faith is necessary as the condition of saving benefits in the use of the sacraments, but resembles the Roman teaching in ascribing the efficacy of Baptism and the Lord\'s Supper, not to the attendant working of the Holy Spirit, but to a real inherent and objective virtue resident in them—a virtue, however, which does not lie (as the Roman church says) in the mere elements and actions of the sacraments, but in the power of the divine word which they embody.<P>LITERATURE.<P>Candlish, The Christian Sacraments; Lambert, The Sacraments in the New Testament; Bartlet, Apostolic Age, 495ff; Hodge, Systematic Theology, III, chapter xx.`<a href="./study/isbe/search.html?string=BAPTISM">BAPTISM</a>; <a href="./study/isbe/search.html?string=LORD\'s+supper">LORD\'S SUPPER</a>`94';
isbe[7557]='Sacrifice, Human`hu\'-man: As an expression of religious devotion, human sacrifice has been widespread at certain stages of the race\'s development. The tribes of Western Asia were deeply affected by the practice, probably prior to the settlement of the Hebrews in Palestine, and it continued at least down to the 5th century BC. At times of great calamity, anxiety and danger, parents sacrificed their children as the greatest and most costly offering which they could make to propitiate the anger of the gods and thus secure their favor and help. There is no intimation in the Bible that enemies or captives were sacrificed; only the offering of children by their parents is mentioned. The belief that this offering possessed supreme value is seen in <a onClick="return mV(\'Mic\',6,6);">Mic 6:6</a>f; where the sacrifice of the firstborn is the climax of a series of offerings which, in a rising scale of values, are suggested as a means of propitiating the angry Yahweh. A striking example of the rite as actually practiced is seen in <a onClick="return mV(\'2Ki\',3,27);">2Ki 3:27</a>, where Mesha the king of Moab (made famous by the Moabite Stone), under the stress of a terrible siege, offered his eldest son, the heir-apparent to the throne, as a burnt offering upon the wall of Kir-hareseth. As a matter of fact this horrid act seems to have had the effect of driving off the allies.<P>Human sacrifice was ordinarily resorted to, no doubt, only in times of great distress, but it seems to have been practiced among the old Canaanitish tribes with some frequency (<a onClick="return mV(\'Deu\',12,31);">De 12:31</a>). The Israelites are said to have borrowed it from their Canaanite neighbors (<a onClick="return mV(\'2Ki\',16,3);">2Ki 16:3</a>; <a onClick="return mV(\'2Ch\',28,3);">2Ch 28:3</a>), and as a matter of fact human sacrifices were never offered to Yahweh, but only to various gods of the land. The god who was most frequently worshipped in this way was Moloch or Molech, the god of the Ammonites (<a onClick="return mV(\'2Ki\',23,10);">2Ki 23:10</a>; <a onClick="return mV(\'Lev\',18,21);">Le 18:21</a>; <a onClick="return mV(\'Lev\',20,2);">20:2</a>), but from Jeremiah we learn that the Phoenician god Baal was, at least in the later period of the history, also associated with Molech in receiving this worship (<a onClick="return mV(\'Jer\',19,5);">Jer 19:5</a>; <a onClick="return mV(\'Jer\',31,35);">31:35</a>).<P>As in the case of the Canaanites, the only specific cases of human sacrifice mentioned among the Israelites are those of the royal princes, sons of Ahaz and Manasseh, the two kings of Judah who were most deeply affected by the surrounding heathen practices and who, at the same time, fell into great national distress (<a onClick="return mV(\'2Ki\',16,3);">2Ki 16:3</a>; <a onClick="return mV(\'2Ch\',28,3);">2Ch 28:3</a>; <a onClick="return mV(\'2Ki\',21,6);">2Ki 21:6</a>; <a onClick="return mV(\'2Ch\',33,6);">2Ch 33:6</a>). But it is clear from many general statements that the custom was widespread among the masses of the people as well. It is forbidden in the Mosaic legislation (<a onClick="return mV(\'Lev\',18,21);">Le 18:21</a>; <a onClick="return mV(\'Lev\',20,\'2-5\');">20:2-5</a>; <a onClick="return mV(\'Deu\',18,10);">De 18:10</a>); it is said in <a onClick="return mV(\'2Ki\',17,17);">2Ki 17:17</a> that the sacrifice of sons and daughters was one of the causes of the captivity of the ten tribes. Jeremiah charges the people of the Southern Kingdom with doing the same thing (<a onClick="return mV(\'Jer\',7,31);">Jer 7:31</a>; <a onClick="return mV(\'Jer\',19,5);">19:5</a>; <a onClick="return mV(\'Jer\',31,35);">31:35</a>); with these general statements agree <a onClick="return mV(\'Isa\',57,5);">Isa 57:5</a>; <a onClick="return mV(\'Eze\',16,2);">Eze 16:2</a>f; <a onClick="return mV(\'Eze\',20,31);">20:31</a>; <a onClick="return mV(\'Eze\',23,37);">23:37</a>; <a onClick="return mV(\'Psa\',106,37);">Ps 106:37</a>f. A study of these passages makes it certain that in the period immediately before the captivity of Judah, human sacrifice was by no means confined to the royal family, but was rather common among the people. Daughters as well as sons were sacrificed. It is mentioned only once in connection with the Northern Kingdom, and then only in the summary of the causes of their captivity (<a onClick="return mV(\'2Ki\',17,17);">2Ki 17:17</a>), but the Southern Kingdom in its later years was evidently deeply affected. There were various places where the bloody rite was celebrated (<a onClick="return mV(\'Jer\',19,5);">Jer 19:5</a>), but the special high place, apparently built for the purpose, was in the Valley of Tophet or Hinnom (ge-hinnom, Gehenna) near Jerusalem (<a onClick="return mV(\'2Ch\',28,3);">2Ch 28:3</a>; <a onClick="return mV(\'2Ch\',33,6);">33:6</a>). This great high place, built for the special purpose of human sacrifice (<a onClick="return mV(\'Jer\',7,31);">Jer 7:31</a>; <a onClick="return mV(\'Jer\',32,35);">32:35</a>), was defiled by the good king Josiah in the hope of eradicating the cruel practice (<a onClick="return mV(\'2Ki\',23,10);">2Ki 23:10</a>).<P>The Biblical writers without exception look upon the practice with horror as the supreme point of national and religious apostasy, and a chief cause of national disaster. They usually term the rite "passing through fire," probably being unwilling to use the sacred term "sacrifice" in reference to such a revolting custom. There is no evidence of a continuance of the practice in captivity nor after the return. It is said, however, that the heathen Sepharvites, settled by the Assyrian kings in the depopulated territory of the Northern Kingdom, "burnt their children in the fire to Adrammelech and Anammelech, the gods of Sepharvaim" (<a onClick="return mV(\'2Ki\',17,31);">2Ki 17:31</a>). The practice is not heard of again, and probably rapidly died out. The restored Israelites were not affected by it.`<a href="./study/isbe/search.html?string=SACRIFICE">SACRIFICE</a>`114';
isbe[7558]='Sacrifice, in the New Testament, 1`<b>IN THE NEW TESTAMENT</b><P><b>I. TERMS OF SACRIFICE EPITOMIZED</b><P><b>II. ATTITUDE OF JESUS AND NEW TESTAMENT WRITERS TO THE OLD TESTAMENT SACRIFICIAL SYSTEM</b><P class="in15">1. Jesus\' Attitude<P class="in15">2. Paul\'s Attitude<P class="in15">3. Attitude of the Author of Hebrews<P><b>III. THE SACRIFICIAL IDEA IN THE NEW TESTAMENT</b><P class="in15">1. Teaching of John the Baptist<P class="in15">2. Teaching of Jesus<P class="in15">3. Teaching of Peter<P class="in15">4. Paul\'s Teaching<P class="in15">5. Teaching of Hebrews<P class="in15">6. Johannine Teaching<P><b>IV. RELATION OF CHRIST\'S SACRIFICE TO MAN\'S SALVATION</b><P class="in15">1. Redemption or Deliverance from Curse of Sin<P class="in15">2. Reconciliation<P class="in15">3. Remission of Sins<P class="in15">4. The Cancellation of Guilt<P class="in15">5. Justification or Right Standing with God<P class="in15">6. Cleansing or Sanctification<P class="in15">7. Sonship<P><b>V. HOW CHRIST\'S SACRIFICE PROCURES SALVATION</b><P class="in15">1. Jesus\' Teaching<P class="in15">2. Paul\'s Teaching<P class="in15">3. Teaching of Hebrews<P class="in15">4. Petrine and Johannine Teaching<P><b>VI. RATIONALE OF THE EFFICACY OF CHRIST\'S SACRIFICE</b><P class="in15">1. Jesus\' Teaching<P class="in15">2. Paul\'s Teaching<P class="in15">3. The Teaching in Hebrews<P><b>VII. THE HUMAN CONDITIONS OF APPLICATION</b><P class="in15">1. Universal in Objective Potentiality<P class="in15">2. Efficacious When Subjectively Applied<P><b>VIII. THE CHRISTIAN\'S LIFE THE LIFE OF SACRIFICE</b><P class="in15">1. Consequence of Christ\'s Sacrifice<P class="in15">2. Christ\'s Death the Appeal for Christian\'s Sacrifice<P class="in15">3. Necessary to Fill Out Christ\'s Sacrifice<P class="in15">4. Content of the Christian\'s Sacrifice<P class="in15">5. The Supper as a Sacrifice<P><b>LITERATURE</b><hr /><P>I. Terms of Sacrifice Epitomized.<P>The word "offering" (prosphora) describes the death of
