 Christ, once in Paul (<a onClick="return mV(\'Eph\',5,2);">Eph 5:2</a>); 5 times in Hebrews (<a onClick="return mV(\'Hbr\',10,5,8,10,14,18);">Heb 10:5,8,10,14,18</a>). The verb prosphero, "to offer," is also used, 15 times in Hebrews (<a onClick="return mV(\'Hbr\',5,1,3);">Heb 5:1,3</a>; <a onClick="return mV(\'Hbr\',8,3,4);">8:3,4</a>; <a onClick="return mV(\'Hbr\',9,7,14,25,28);">9:7,14,25,28</a>; <a onClick="return mV(\'Hbr\',10,1,8,11,12);">10:1,8,11,12</a>; <a onClick="return mV(\'Hbr\',11,4);">11:4</a>). The noun prosphora occurs 15 times in the Septuagint, usually as the translation of minchah, "sacrifice." This noun in the New Testament refers to Old Testament sacrifices in <a onClick="return mV(\'Act\',7,42);">Ac 7:42</a>; <a onClick="return mV(\'Act\',21,26);">21:26</a>; to the offering of money in <a onClick="return mV(\'Act\',24,17);">Ac 24:17</a>; <a onClick="return mV(\'Rom\',15,16);">Ro 15:16</a>. The verb anaphero, also occurs 3 times in Hebrews (<a onClick="return mV(\'Hbr\',7,27);">7:27</a>; <a onClick="return mV(\'Hbr\',9,28);">9:28</a>; <a onClick="return mV(\'Hbr\',13,15);">13:15</a>); also in <a onClick="return mV(\'1Pe\',2,5);">1Pe 2:5</a>.<P>The word "sacrifice" (thusia in the Septuagint translates 8 different Hebrew words for various kinds of sacrifice, occurring about 350 times) refers to Christ\'s death, once in Paul (<a onClick="return mV(\'Eph\',5,2);">Eph 5:2</a>) 5 times in Heb (<a onClick="return mV(\'Hbr\',5,1);">5:1</a>; <a onClick="return mV(\'Hbr\',9,23,26);">9:23,26</a>; <a onClick="return mV(\'Hbr\',10,12,26);">10:12,26</a>). It refers several times to Old Testament sacrifice and 5 times to Christian living or giving (<a onClick="return mV(\'Phl\',2,17);">Php 2:17</a>; <a onClick="return mV(\'Phl\',4,18);">4:18</a>; <a onClick="return mV(\'Hbr\',13,15,16);">Heb 13:15,16</a>; <a onClick="return mV(\'1Pe\',2,5);">1Pe 2:5</a>). The verb "to sacrifice" (thuo) is used once by Paul to describe Christ\'s death (<a onClick="return mV(\'1Cr\',5,7);">1Co 5:7</a>).<P>The blood (haima) of Christ is said to secure redemption or salvation, 6 times in Paul (<a onClick="return mV(\'Rom\',3,25);">Ro 3:25</a>; <a onClick="return mV(\'Rom\',5,9);">5:9</a>; <a onClick="return mV(\'1Cr\',10,16);">1Co 10:16</a>; <a onClick="return mV(\'Eph\',1,7);">Eph 1:7</a>; <a onClick="return mV(\'Eph\',2,13);">2:13</a>; <a onClick="return mV(\'Col\',1,20);">Col 1:20</a>); 3 times in Hebrews (<a onClick="return mV(\'Hbr\',9,12,14);">9:12,14</a>; <a onClick="return mV(\'Hbr\',10,19);">10:19</a>; compare also <a onClick="return mV(\'Hbr\',10,29);">10:29</a>); 2 times in 1 Peter (<a onClick="return mV(\'1Pe\',2,2,19);">1:2,19</a>) and 5 times in the Johannine writings (<a onClick="return mV(\'1Jo\',1,7);">1Joh 1:7</a>; <a onClick="return mV(\'1Jo\',5,6,8);">5:6,8</a>; <a onClick="return mV(\'Rev\',1,5);">Re 1:5</a>). Unmistakably this figure of the blood refers to Christ\'s sacrificial death. "In any case the phrase (en to autou haimati, \'in his blood,\' <a onClick="return mV(\'Rom\',3,25);">Ro 3:25</a>) carries with it the idea of sacrificial blood-shedding" (Sanday, Commentary on Epistle to Romans, 91).<P>(lutron, "ransom," the price paid for redeeming, occurring in Septuagint 19 times, meaning the price paid for redeeming the servant (<a onClick="return mV(\'Lev\',25,51,52);">Le 25:51,52</a>); ransom for first-born (<a onClick="return mV(\'Num\',3,46);">Nu 3:46</a>); ransom for the life of the owner of the goring ox (<a onClick="return mV(\'Exd\',21,30);">Ex 21:30</a>, etc.)) occurs in the New Testament only twice (<a onClick="return mV(\'Mat\',20,28);">Mt 20:28</a>; <a onClick="return mV(\'Mar\',10,45);">Mr 10:45</a>). This word is used by Jesus to signify the culmination of His sacrificial life in His sacrificial death.<P>(antilutron, "ransom," a word not found in Septuagint, stronger in meaning than the preceding word) occurs only once in the New Testament (<a onClick="return mV(\'1Ti\',2,6);">1Ti 2:6</a>).<P>(apolutrosis, "redemption," in <a onClick="return mV(\'Exd\',21,8);">Ex 21:8</a>, meaning the ransom paid by a father to redeem his daughter from a cruel master) signifies<P>(1) deliverance from sin by Christ\'s death, 5 times in Paul (<a onClick="return mV(\'Rom\',3,24);">Ro 3:24</a>; <a onClick="return mV(\'1Cr\',1,30);">1Co 1:30</a>; <a onClick="return mV(\'Eph\',1,7,14);">Eph 1:7,14</a>; <a onClick="return mV(\'Col\',1,14);">Col 1:14</a>); once in Hebrews (<a onClick="return mV(\'Hbr\',9,15);">9:15</a>);<P>(2) general deliverance, twice (<a onClick="return mV(\'Luk\',21,28);">Lu 21:28</a>; <a onClick="return mV(\'Hbr\',11,35);">Heb 11:35</a>);<P>(3) the Christian\'s final deliverance, physical and spiritual (<a onClick="return mV(\'Rom\',8,23);">Ro 8:23</a>; <a onClick="return mV(\'Eph\',4,30);">Eph 4:30</a>).<P>The simple word (lutrosis, "redemption," 10 times in Septuagint as the translation of 5 Hebrew words) occurs once for spiritual deliverance (<a onClick="return mV(\'Hbr\',9,12);">Heb 9:12</a>).<P>(exagorazo, "redeem," only once in Septuagint, <a onClick="return mV(\'Dan\',2,8);">Da 2:8</a>) in the New Testament means<P>(1) to deliver from the curse of the law, twice by Paul (<a onClick="return mV(\'Gal\',3,13);">Ga 3:13</a>; <a onClick="return mV(\'Gal\',4,5);">4:5</a>);<P>(2) to use time wisely, twice by Paul (<a onClick="return mV(\'Eph\',5,16);">Eph 5:16</a>; <a onClick="return mV(\'Col\',4,5);">Col 4:5</a>).<P>The simple verb (agorazo, meaning in <a onClick="return mV(\'Lev\',27,19);">Le 27:19</a> to redeem land) occurs twice in Paul (<a onClick="return mV(\'1Cr\',6,20);">1Co 6:20</a>; <a onClick="return mV(\'1Cr\',7,23);">7:23</a>) and means "to redeem" (in a spiritual sense). katallage, "reconciliation," only twice in the Septuagint) means the relation to God into which men are brought by Christ\'s death, 4 times by Paul (<a onClick="return mV(\'Rom\',5,11);">Ro 5:11</a>; <a onClick="return mV(\'Rom\',11,15);">11:15</a>; <a onClick="return mV(\'2Cr\',5,18,19);">2Co 5:18,19</a>).<P>(katallassein, "to reconcile," 4 times in Septuagint (3 times in 2Maccabees)) means to bring men into the state of reconciliation with God, 5 times in Paul (<a onClick="return mV(\'Rom\',5,10);">Ro 5:10</a> twice; <a onClick="return mV(\'2Cr\',5,18,19,20);">2Co 5:18,19,20</a>).<P>The words with the propitiatory idea occur as follows: (hilaskomai, "to propitiate," 12 times in the Septuagint, translated "to forgive") occurs twice (<a onClick="return mV(\'Luk\',18,13);">Lu 18:13</a>; <a onClick="return mV(\'Hbr\',2,17);">Heb 2:17</a>); (hilasmos, 9 times in Septuagint, <a onClick="return mV(\'Num\',5,8);">Nu 5:8</a>; <a onClick="return mV(\'Psa\',129,1,4);">Ps 129 (130):4</a>, etc.; "atonement," "forgiveness") occurs twice in 1Joh (<a onClick="return mV(\'1Jo\',2,2);">2:2</a>; <a onClick="return mV(\'1Jo\',4,10);">4:10</a>); (hilasterion, 24 times in the Septuagint, translates "mercy-seat," where God was gracious and spake to man) translates in the New Testament "propitiation" (<a onClick="return mV(\'Rom\',3,25);">Ro 3:25</a>), "mercy-seat" (<a onClick="return mV(\'Hbr\',9,5);">Heb 9:5</a>).<P>Christ is called "the Lamb," amnos, twice by the Baptist (<a onClick="return mV(\'Jhn\',1,29,36);">Joh 1:29,36</a>); once by Philip applied to Christ from <a onClick="return mV(\'Isa\',53,7);">Isa 53:7</a> (<a onClick="return mV(\'Act\',8,32);">Ac 8:32</a>); and once by Peter (<a onClick="return mV(\'1Pe\',1,19);">1Pe 1:19</a>); arnion, 28 times in Revelation (<a onClick="return mV(\'Rev\',5,6,8,12,13);">5:6,8,12,13</a>; <a onClick="return mV(\'Act\',6,1,16);">6:1,16</A>; <a onClick="return mV(\'Act\',7,9,10,14);">7:9,10,14</A>; <a onClick="return mV(\'Act\',19,7,9);">19:7,9</A>; <a onClick="return mV(\'Act\',21,9,14,22,23,27);">21:9,14,22,23,27</a>; <a onClick="return mV(\'Act\',22,1,3);">22:1,3</a>).<P>The cross (stauros) is used by Paul 10 times to describe the sacrificial death of Christ (<a onClick="return mV(\'1Cr\',1,17,18);">1Co 1:17,18</a>; <a onClick="return mV(\'Gal\',5,11);">Ga 5:11</a>; <a onClick="return mV(\'Gal\',6,12,14);">6:12,14</a>; <a onClick="return mV(\'Eph\',2,16);">Eph 2:16</a>; <a onClick="return mV(\'Phl\',2,8);">Php 2:8</a>; <a onClick="return mV(\'Phl\',3,18);">3:18</a>; <a onClick="return mV(\'1Cr\',1,20);">1Co 1:20</a>; <a onClick="return mV(\'1Cr\',2,14);">2:14</a>) and once by the author of Hebrews (<a onClick="return mV(\'Hbr\',12,2);">12:2</a>). Jesus also 5 times used the figure of the cross to define the life of sacrifice demanded of His disciples and to make His own cross the symbol of sacrifice (<a onClick="return mV(\'Mat\',10,38);">Mt 10:38</a>; <a onClick="return mV(\'Mat\',16,24);">16:24</a>; <a onClick="return mV(\'Mar\',8,34);">Mr 8:34</a>; <a onClick="return mV(\'Luk\',9,23);">Lu 9:23</a>; <a onClick="return mV(\'Luk\',14,27);">14:27</a>, with contexts; compare <a onClick="return mV(\'Jhn\',3,14);">Joh 3:14</a>; <a onClick="return mV(\'Jhn\',12,32);">12:32</a>, etc.).<P>Though it is not our province in this article to discuss the origin and history of sacrifice in the ethnic religions, it must be noted that sacrifice has been a chief element in almost every religion (Jainism and Buddhism being the principal exceptions). The bloody sacrifice, where the idea of propitiation is prominent, is well-nigh universal in the ethnic religions, being found among even the most enlightened peoples like the Greeks and Romans (see article "Expiation and Atonement" in ERE). Whether or not the system of animal sacrifices would have ceased not only in Judaism but also in all the ethnic religions, had not Jesus lived and taught and died, is a question of pure speculation. It must be conceded that the sect of the Jews (Essenes) attaining to the highest ethical standard and living the most unselfish lives of brotherhood and benevolence did not believe in animal sacrifices. But they exerted small influence over the Jewish nation as compared with the Pharisees. It is also to be noted that the prophets Amos, Hosea, Micah and Isaiah exalted the ethical far above the ceremonial; even denounced the sacrifice of animals if not accompanied by personal devotion to righteousness (<a onClick="return mV(\'Amo\',5,21);">Am 5:21</a>ff; <a onClick="return mV(\'Hsa\',6,6);">Ho 6:6</a>; <a onClick="return mV(\'Mic\',6,6);">Mic 6:6</a>ff; <a onClick="return mV(\'Isa\',1,11);">Isa 1:11</a>). The Stoic and Platonic philosophers also attacked the system of animal sacrifices. But these exceptions only accentuate the historical fact that man\'s sense of the necessity of sacrifice to Deity is well-nigh universal. Only the sacrifice of Christ and the destruction of Jerusalem caused a cessation of the daily, weekly, monthly and annual sacrifices among the Jews, and only the knowledge of Christ\'s sacrifice of Himself will finally destroy the last vestige of animal sacrifice.<P>II. Attitude of Jesus and New Testament Writers to the Old Testament Sacrificial System.<P>1. Jesus\' Attitude:<P>Jesus never attacks the sacrificial system. He even takes for granted that the Jews should offer sacrifices (<a onClick="return mV(\'Mat\',5,24);">Mt 5:24</a>). More than that, He accepted the whole sacrificial system, a part of the Old Testament scheme, as of divine origin, and so He commanded the cleansed leper to offer the sacrifice prescribed in the Mosaic code (<a onClick="return mV(\'Mat\',8,4);">Mt 8:4</a>). There is no record that Jesus Himself ever worshipped by offering the regular sacrifices. But He worshipped in the temple, never attacking the sacrificial system as He did the oral law (<a onClick="return mV(\'Mar\',7,6);">Mr 7:6</a>). On the other hand, Jesus undermined the sacrificial system by teaching that the ethical transcends the ceremonial, not only as a general principle, but also in the act of worship (<a onClick="return mV(\'Mat\',5,23,24);">Mt 5:23,24</a>). He endorses Hosea\'s fine ethical epigram, \'God will have mercy and not sacrifice\' (<a onClick="return mV(\'Mat\',9,13);">Mt 9:13</a>; <a onClick="return mV(\'Mat\',12,7);">12:7</a>). He also commends as near the kingdom the scribe who put love to God and man above sacrifice (<a onClick="return mV(\'Mar\',12,33);">Mr 12:33</a>). But Jesus teaches not merely the inferiority of sacrifice to the moral law, but also the discontinuance of sacrifice as a system, when He said, "This is my blood of the covenant, which is poured out for many" (<a onClick="return mV(\'Mar\',14,24);">Mr 14:24</a>; <a onClick="return mV(\'Mat\',26,28);">Mt 26:28</a>; <a onClick="return mV(\'Luk\',22,20);">Lu 22:20</a>). Not only is the ethical superior to the ceremonial, but His sacrifice of Himself is as superior to the sacrifices of the old system as the new covenant is superior to the old.<P>2. Paul\'s Attitude:<P>Paul\'s estimate of the Jewish sacrifices is easily seen, although he does not often refer to them. Once only (<a onClick="return mV(\'Act\',21,26);">Ac 21:26</a>) after his conversion does he offer the Jewish sacrifice, and then as a matter of expediency for winning the Judaistic wing of Christianity to his universal gospel of grace. He regarded the sacrifices of the Old Testament as types of the true sacrifice which Christ made (<a onClick="return mV(\'1Cr\',5,7);">1Co 5:7</a>).<P>3. Attitude of the Author of Hebrews:<P>The author of the Epistle to the Hebrews discusses the Old Testament sacrifices more fully than other New Testament writers. He regards the bloody sacrifices as superior to the unbloody and the yearly sacririce on the Day of Atonement by the high priest as the climax of the Old Testament system. The high priest under the old covenant was the type of Christ under the new. The sacrifices of the old covenant could not take away sin, or produce moral transformation, because of the frailties of men (<a onClick="return mV(\'Hbr\',10,\'1-11\');">10:1-11</a>), shown by the necessity of repeating the offerings (<a onClick="return mV(\'Hbr\',5,2);">5:2</a>), and because God had appointed another high priest, His Son, to supplant those of the old covenant (<a onClick="return mV(\'Hbr\',5,5);">5:5</a>; <a onClick="return mV(\'Hbr\',7,\'1-28\');">7:1-28</A>). The heart of this author\'s teaching is that animal sacrifices cannot possibly atone for sin or produce moral transformation, since they are divinely-appointed only as a type or shadow of the one great sacrifice by Christ (<a onClick="return mV(\'Hbr\',8,7);">8:7</a>; <a onClick="return mV(\'Hbr\',10,1);">10:1</a>).<P>To sum up, the New Testament writers, as well as Jesus, regarded the Old Testament sacrificial system as of divine origin and so obligatory in its day, but imperfect and only a type of Christ\'s sacrifice, and so to be supplanted by His perfect sacrifice.<P>III. The Sacrificial Idea in the New Testament.<P>The one central idea of New Testament writers is that the sacrifice made by Christ on the cross is the final perfect sacrifice for the atonement of sin and the salvation of men, a sacrifice typified in the various sacrifices of the Old Testament, which are in turn abrogated by the operation of the final sacrifice. Only James and Jude among New Testament writers are silent as to the sacrifice of Christ, and they write for practical purposes only.<P>1. Teaching of John the Baptist:<P>The Baptist, it is true, presents Jesus as the coming Judge in the Synoptic Gospels, but in <a onClick="return mV(\'Jhn\',1,29,36);">Joh 1:29,36</a> he refers to Him as "the Lamb of God," in the former passage adding "that taketh away the sin of the world." Westcott (Commentary on John, 20) says: "The title as applied to Christ...conveys the ideas of vicarious suffering, of patient submission, of sacrifice, of redemption, etc." There is scarcely any doubt that the Baptist looked upon the Christ as the one who came to make the great sacrifice for man\'s sins. Professor Burton (Biblical Ideas of Atonement, Burton, Smith and Smith, 107) says that John sees Christ "suffering under the load of human sin." 2. Teaching of Jesus:<P>There are recorded in the Synoptic Gospels two unmistakable references by Jesus to His death as a sacrifice (<a onClick="return mV(\'Mar\',10,45);">Mr 10:45</a> parallel <a onClick="return mV(\'Mat\',20,28);">Mt 20:28</a>; <a onClick="return mV(\'Mar\',14,24);">Mr 14:24</a> parallel <a onClick="return mV(\'Mat\',26,28);">Mt 26:28</a> parallel <a onClick="return mV(\'Luk\',22,20);">Lu 22:20</a>; compare <a onClick="return mV(\'1Cr\',11,25);">1Co 11:25</a>). In the former He declares He came to give His "life a ransom." Thayer (Greek-English Lexicon of the New Testament) says this word means "the price paid for redeeming." Hence, the idea in ransom must be of sacrificial significance. But if there could be any doubt as to the sacrificial import of this passage, there is a clear case of the sacrificial idea in <a onClick="return mV(\'Mar\',14,24);">Mr 14:24</a>. Practically all writers of the New Testament theology, Wendt, Weiss, Stevens, Sheldon and others, hold that Jesus considered the death as the ratification sacrifice of the new covenant, just as the sacrifice offered at Sinai ratified the old covenant (<a onClick="return mV(\'Exd\',24,\'3-8\');">Ex 24:3-8</a>). Ritschl and Beyschlag deny that this passage is sacrificial. But according to most exegetes, Jesus in this reference regarded His death as a sacrifice. The nature of the sacrifice, as Jesus estimated it, is in doubt and is to be discussed later. What we are pressing here is the fact that Jesus regarded His death as a sacrifice. We have to concede the meagerness of material on the sacrificial idea of His death as taught by Jesus. Yet these two references are unquestioned by literary and historical critics. They both occur in Mark, the primitive Gospel (the oldest Gospel record of Jesus\' teachings). The first occurs in two of the Synoptists, the second in all three of them. Luke omits the first for reasons peculiar to his purpose. According to <a onClick="return mV(\'Luk\',24,25);">Lu 24:25</a>, Jesus regarded His sufferings and death as the fulfillment of the Old Testament Scriptures.<P>3. Teaching of Peter:<P>Though the head apostle does not in the early chapters of Acts refer to Christ as the sacrifice for sin, he does imply as much in <a onClick="return mV(\'Acts\',2,36);">2:36</A> (He is Lord and Christ in spite of His crucifixion); <a onClick="return mV(\'Acts\',3,18,19);">3:18,19</a> (He fulfilled the prophecies by suffering, and by means of repentance sins are to be blotted out); <a onClick="return mV(\'Acts\',4,10,11,12);">4:10-12</a> (only in His name is salvation) and in <a onClick="return mV(\'Acts\',5,30,31);">5:30,31</a> (through whose death Israel received remission of sins). In his First Epistle (<a onClick="return mV(\'1Pe\',1,18,19);">1Pe 1:18,19</a>) he expressly declares that we are redeemed by the blood of the spotless Christ, thus giving the sacrificial significance to His death. The same is implied in <a onClick="return mV(\'1Pe\',1,2);">1Pe 1:2</a>; <a onClick="return mV(\'1Pe\',3,18);">3:18</a>.<P>4. Paul\'s Teaching:<P>Paul ascribes saving efficacy to the blood of Christ in <a onClick="return mV(\'Rom\',3,25);">Ro 3:25</a>; <a onClick="return mV(\'Rom\',5,9);">5:9</a>; <a onClick="return mV(\'1Cr\',10,16);">1Co 10:16</a>; <a onClick="return mV(\'Eph\',1,7);">Eph 1:7</a>; <a onClick="return mV(\'Eph\',2,13);">2:13</a>; <a onClick="return mV(\'Col\',1,20);">Col 1:20</a>. He identifies Christ with a sin offering in <a onClick="return mV(\'Rom\',8,3);">Ro 8:3</a>, and perhaps also in <a onClick="return mV(\'2Cr\',5,21);">2Co 5:21</a>, and with the paschal lamb in <a onClick="return mV(\'1Cr\',5,7);">1Co 5:7</a>. In other passages he implies that the death of Christ secured redemption, forgiveness of sins, justification and adoption (<a onClick="return mV(\'Rom\',3,\'24-26\');">Ro 3:24-26</a>; <a onClick="return mV(\'Rom\',5,10,11);">5:10,11</a>; <a onClick="return mV(\'Rom\',8,15,17);">8:15,17</a>, etc.).<P>5. Teaching of Hebrews:<P>The argument of the author of Hebrews to prove the finality of Christianity is that Christ is superior to the Aaronic high priest, being a royal, eternal high priest, after the order of Melchizedek, and offering Himself as the final sacrifice for sin, and for the moral transformation of men (<a onClick="return mV(\'Hbr\',4,14);">4:14</a>; <a onClick="return mV(\'Hbr\',10,18);">10:18</a>).<P>6. Johannine Teaching:<P>In the First Epistle of John (<a onClick="return mV(\'1Jo\',1,7);">1Joh 1:7</a>; <a onClick="return mV(\'1Jo\',2,2);">2:2</a>; <a onClick="return mV(\'1Jo\',5,6,8);">5:6,8</a>) propitiation for sin and cleansing from sin are ascribed to the blood of Christ. In <a onClick="return mV(\'Rev\',1,5);">Re 1:5</a> John ascribes deliverance (not washing or cleansing, according to best manuscripts) from sin, to the blood of Christ. Several times he calls Christ the Lamb, making the sacrificial idea prominent. Once he speaks of Him as the Lamb slain from the foundation of the world (<a onClick="return mV(\'Jhn\',13,8);">13:8</A>).<P>To sum up, all the New Testament writers, except James and Jude, refer to Christ\'s death as the great sacrifice for sin. Jesus Himself regarded His death as such. In the various types of New Testament teaching Christ\'s death is presented<P>(1) as the covenant sacrifice (<a onClick="return mV(\'Mar\',14,24);">Mr 14:24</a> parallel <a onClick="return mV(\'Mat\',26,28);">Mt 26:28</a> parallel <a onClick="return mV(\'Luk\',22,20);">Lu 22:20</a>; <a onClick="return mV(\'Hbr\',9,\'15-22\');">Heb 9:15-22</a>);<P>(2) as the sin offering (<a onClick="return mV(\'Rom\',8,3);">Ro 8:3</a>; <a onClick="return mV(\'2Cr\',5,21);">2Co 5:21</a>; <a onClick="return mV(\'Hbr\',13,11);">Heb 13:11</a>; <a onClick="return mV(\'1Pe\',3,18);">1Pe 3:18</a>);<P>(3) as the offering of the paschal lamb (<a onClick="return mV(\'1Cr\',5,7);">1Co 5:7</a>);<P>(4) as the sacrifice of the Day of Atonement (<a onClick="return mV(\'Hbr\',2,17);">Heb 2:17</a>; <a onClick="return mV(\'Hbr\',9,12);">9:12</a>).<P>IV. Relation of Christ\'s Sacrifice to Man\'s Salvation.<P>The saving benefits specified in the New Testament as resulting from the sacrificial death of Christ are as follows:<P>1. Redemption or Deliverance from Curse of Sin:<P>Redemption or deliverance from the curse of sin: This must be the implication in Jesus\' words, "The Son of man also came...to give his life a ransom for many" (<a onClick="return mV(\'Mar\',10,45);">Mr 10:45</a> parallel <a onClick="return mV(\'Mat\',20,28);">Mt 20:28</a>). Man is a captive in sin, the Father sends His Son to pay the ransom price for the deliverance of the captive, and the Son\'s death is the price paid. Paul also uses the words "redeemed" and "redemption" in the same sense. In the great letters he asserts that we are "justified freely by his grace through the redemption that is in Christ Jesus: whom God set forth to be a propitiation...in his blood" (<a onClick="return mV(\'Rom\',3,24,25);">Ro 3:24,25</a>). Here the apostle traces justification back to redemption as the means for securing it, and redemption back to the "blood" (Christ\'s death) as the cause of its procurement. That is, Christ\'s death secures redemption and redemption procures justification. In Galatians (<a onClick="return mV(\'Gal\',3,13);">3:13</a>), he speaks of being redeemed "from the curse of the law." The law involved man in a curse because he could not keep it. This curse is the penalty of the broken law which the transgressor must bear, unless deliverance from said penalty is somehow secured. Paul represents Christ by His death as securing for sinners deliverance from this curse of the broken law (compare <a onClick="return mV(\'Gal\',4,5);">Ga 4:5</a> for the same thought, though the word "curse" is not used). Paul also emphasizes the same teaching in the Captivity Epistles: "In whom we have our redemption through his blood, the forgiveness of our trespasses" (<a onClick="return mV(\'Eph\',1,7);">Eph 1:7</a>; compare <a onClick="return mV(\'Col\',1,14);">Col 1:14</a>). In the pastoral letters (<a onClick="return mV(\'1Ti\',2,6);">1Ti 2:6</a>) he teaches that Christ gave "himself a ransom for all." This is the only New Testament passage in which occurs the strong word antilutron for "ransom." In his old age the apostle feels more positively than ever before that Christ\'s death is the ransom price of man\'s deliverance from sin.<P>The author of Hebrews asserts that Christ by the sacrifice of Himself "obtained eternal redemption" for man (<a onClick="return mV(\'Hbr\',9,12);">9:12</a>). John says that Christ "loosed (luo) us from our sins by his blood" (<a onClick="return mV(\'Rev\',1,5);">Re 1:5</a>). This idea in John is akin to that of redemption or deliverance by ransom. Peter teaches the same truth in <a onClick="return mV(\'1Pe\',1,19);">1Pe 1:19</a>. So, we see, Jesus and all the New Testament writers regard Christ\'s sacrifice as the procuring cause of human redemption.<P>2. Reconciliation:<P>The idea of reconciliation involves a personal difference between two parties. There is estrangement between God and man. Reconciliation is the restoration of favor between the two parties. Jesus does not utter any direct message on reconciliation, but implies God\'s repugnance at man\'s sin and strained relations between God and the unrepentant sinner (see <a onClick="return mV(\'Luk\',18,13);">Lu 18:13</a>). He puts into the mouth of the praying tax-gatherer the words, \'God be propitious to me\' (see Thayer, Greek-English Lexicon, hilaskomai), but Jesus nowhere asserts that His death secures the reconciliation of God to the sinner. Paul, however, does. "For if, while we were enemies, we were reconciled to God through the death of his Son," etc. (<a onClick="return mV(\'Rom\',5,10);">Ro 5:10</a>). There can be no doubt from this passage that Paul thought of the death of Christ as the procuring cause of reconciliation. In <a onClick="return mV(\'Eph\',2,13,14,18);">Eph 2:13,14,18</a> Paul makes the cross of Christ the means of reconciliation between the hostile races of men. Paul reaches the climax in his conception of the reconciliation wrought by the cross of Christ when he asserts the unifying results of Christ\'s death to be cosmic in extent (<a onClick="return mV(\'Eph\',1,10);">Eph 1:10</a>).<P>The author of Hebrews also implies that Christ\'s death secures reconciliation when he regards this death as the ratification of the "better covenant" (<a onClick="return mV(\'Hbr\',8,6);">8:6</A>ff), and when he plays on the double meaning of the word (diatheke, <a onClick="return mV(\'Hbr\',9,15);">9:15</a>ff), now "covenant" and now "will," "testament." The death of Christ is necessary to secure the ratification of the new covenant which brings God and man into new relations (<a onClick="return mV(\'Hbr\',8,12);">8:12</a>). In <a onClick="return mV(\'Hbr\',2,17);">2:17</a> the author uses a word implying propitiation as wrought by the death of Christ. So the doctrine of reconciliation is also in the Epistle to the Hebrews. John teaches reconciliation with God through Christ our Advocate, but does not expressly connect it with His death as the procuring cause (<a onClick="return mV(\'1Jo\',2,1,2);">1Joh 2:1,2</a>). Peter is likewise silent on this point.<P>3. Remission of Sins:<P>Reconciliation implies that God can forgive; yea, has forgiven. Jesus and the New Testament writers declare the death of Christ to be the basis of God\'s forgiveness. Jesus in instituting the memorial supper said, "This is my blood of the covenant, which is poured out for many unto remission of sins" (<a onClick="return mV(\'Mat\',26,28);">Mt 26:28</a>). It is true Mark and Luke do not record this last phrase, "unto remission of sins." But there is no intimation that this phrase is the result of Matthew\'s theologizing on the purpose of Christ\'s death (see Wendt, Teaching of Jesus, II, 239ff, who claims this phrase is not from Jesus; also Allen in "Mt," ICC, in the place cited.). But Paul leaves no doubt as to the connection between man\'s forgiveness by God and Christ\'s sacrifice for him. This idea is rooted in the great passage on justification (<a onClick="return mV(\'Rom\',3,\'2-\'1);">Ro 3:21-5:21</a>; see especially <a onClick="return mV(\'Rom\',4,7);">4:7</a>); is positively declared in <a onClick="return mV(\'Eph\',1,7);">Eph 1:7</a>; <a onClick="return mV(\'Col\',1,14);">Col 1:14</a>. The author of Heb teaches that the shedding of Christ\'s blood under the new covenant is as necessary to secure forgiveness as the shedding of animal\'s blood under the old. John also implies that forgiveness is based on the blood (<a onClick="return mV(\'1Jo\',1,\'7-9\');">1Joh 1:7-9</a>).<P>4. The Cancellation of Guilt:<P>True reconciliation and forgiveness include the canceling of the offender\'s guilt. Jesus has no direct word on the cancellation of guilt. Paul closes his argument for the universality of human sin by asserting that "all the world may be brought under the judgment of God" (the King James Version "guilty before God," <a onClick="return mV(\'Rom\',3,19);">Ro 3:19</a>). Thayer (Greek-English Lexicon, in the place cited.) says this word "guilty" means "owing satisfaction to God" (liable to punishment by God). But in <a onClick="return mV(\'Rom\',8,1,3);">Ro 8:1,3</a> Paul exclaims, "There is therefore now no condemnation to them that are in Christ Jesus...God, sending his own Son in the likeness of sinful flesh and for sin" (the English Revised Version and the American Revised Version margin "as an offering for sin"). The guilt, or exposure of the sinner to God\'s wrath and so to punishment, is removed by the sin offering which Christ made. This idea is implied by the author of Hebrews (<a onClick="return mV(\'Hbr\',2,15);">2:15</a>), but is not expressed in Peter and John.<P>5. Justification or Right Standing with God:<P>Right standing with God is also implied in the preceding idea. Forgiving sin and canceling guilt are the negative, bringing into right standing with God the positive, aspects of the same transaction. "Him who knew no sin he made to be sin (i.e. the sin offering; so Augustine and other Fathers, Ewald, Ritschl; see Meyer, Commentary, in loc., who denies this meaning) on our behalf; that we might become the righteousness of God in him" (<a onClick="return mV(\'2Cr\',5,21);">2Co 5:21</a>). In this passage Paul makes justification the divine purpose of the sacrificial death of Christ. This thought is elaborated by the apostle in Galatians and Romans, but is not expressed by Jesus, or in Hebrews, in Peter or in John.<P>6. Cleansing or Sanctification:<P>Jesus does not connect our cleansing or sanctification with His death, but with His word (<a onClick="return mV(\'Jhn\',17,17);">Joh 17:17</a>). The substantive "cleansing" (katharismos) is not used by Paul, and the verb "to cleanse" (katharizo) occurs only twice in his later letters (<a onClick="return mV(\'Eph\',5,26);">Eph 5:26</a>; <a onClick="return mV(\'Tts\',2,14);">Tit 2:14</a>). He does use the idea of sanctification, and in <a onClick="return mV(\'Rom\',6,\'1-\');">Ro 6-8</a> teaches that sanctification is a logical consequence of justification which is secured by Christ\'s sacrificial death. In <a onClick="return mV(\'Phl\',3,10,11);">Php 3:10,11</a>, he views Christ\'s death and resurrection as the dynamic of transformation in the new life. The author of Hebrews (<a onClick="return mV(\'Hbr\',1,3);">1:3</a>; <a onClick="return mV(\'Hbr\',9,14,22,23);">9:14,22,23</a>; <a onClick="return mV(\'Hbr\',10,2);">10:2</a>), following his Old Testament figures, uses the idea of cleansing for the whole process of putting away sin, from atonement to sanctification (see Westcott, Commentary, in the place cited.). He makes Christ\'s death the procuring cause of the cleansing. John does the same (<a onClick="return mV(\'1Jo\',1,7);">1Joh 1:7</a>; <a onClick="return mV(\'Rev\',7,14);">Re 7:14</a>).<P>7. Sonship:<P>Divine sonship of the believer is also traced by Paul to the sacrificial death of Christ (<a onClick="return mV(\'Rom\',8,17);">Ro 8:17</a>), though this thought is not found in other New Testament writers.<P>So, we sum up, the whole process of salvation, from reconciliation with God to the adoption of the saved sinner into heaven\'s household, is ascribed, to some extent by Jesus, largely by Paul theologian of the New Testament, and, in varying degrees, by other New Testament writers, to the sacrificial death of Christ. Even Holtzmann (Neutest. Theol., II, 111) admits "It is upon the moment of death that the grounding of salvation is exclusively concentrated."<P>V. How Christ\'s Sacrifice Procures Salvation.<P>It must be conceded that the New Testament writers, much less Jesus, did not discuss this subject from the philosophical point of view. Jesus never philosophizes except incidentally. Paul, the author of He, and John had a philosophy underlying their theology, the first and second dealing most with the sacrificial work of Christ, the last with His person. But Paul and the author of Heb did not write their letters to produce a philosophical system explaining how Christ\'s sacrificial death can and does procure man\'s salvation.<P>1. Jesus\' Teaching:<P>By some it is claimed that the word "ransom" (<a onClick="return mV(\'Mar\',10,45);">Mr 10:45</a>) gives us the key to the philosophy of the atonement as presented by Jesus Himself. But the rules of exegesis are against this supposition. Jesus in the context is teaching His disciples that sacrificial service is greatness. To illustrate the truth He refers to His own example of coming to "minister, and to give his life a ransom for many." That is, Jesus is enforcing a practical principle and not elaborating a theoretical truth. Moreover, the word "ransom" is used metaphorically, and the laws of exegesis forbid us to press the literal meaning of a figure. The figure suggests captivity in sin and deliverance by payment of a price (the death of Christ). But Jesus does not tell us how His sacrificial death can and does pay the price for man\'s redemption from sin. The word "ransom" does give the clue to the development of the vicarious sacrifice elaborated later by Paul. Ritschl (Rechtfertigung und Versohnung, II, 85) does not do the word "ransom" justice when he claims that it merely reproduces the meaning of the Hebrew kopher, "covering as a protection," and that Christ\'s death, like a covering, delivers us by stimulating us to lead the life of sacrificial service as Christ did. Wendt (Lehre Jesu, II, 237; Teaching of Jesus, II, 226f) admits the "ransom"-idea in the word, but says Christ delivers us from bondage to suffering and death, not by His death, but by His teaching which is illustrated by His sacrificial death. Beyschlag (Neutest. Theol., I, 153) thinks Christ\'s death delivers us from worldly ambitions and such sins by showing us the example of Jesus in sacrifice. Weiss (Biblical Theology of the New Testament, I, 101-3) thinks Christ\'s "surrender of His life...avails as a ransom which He gives instead of the many" who were not able to pay the price themselves. He also adds, "The saying regarding the ransom lays emphasis upon the God-pleasing performance of Jesus which secures the salvation," etc.<P>Nor does Jesus\' saying at the Last Supper, "This is my blood of the covenant" (<a onClick="return mV(\'Mar\',14,24);">Mr 14:24</a>) give us unmistakable evidence of how His death saves men. It does teach that sinners on entering the kingdom come into a new covenant relation with God which implies forgiveness of sin and fellowship with God, and that, as the covenant sacrifices at Mt. Sinai (<a onClick="return mV(\'Exd\',24,\'3-8\');">Ex 24:3-8</a>) ratified the legal covenant between God and His people, so the death of Christ as a covenant sacrifice ratifies the covenant of grace between God and lost sinners, by virtue of which covenant God on His part forgives the penitent sinner, and the surrendering sinner on his part presents himself to God for the life of sacrifice. But this statement fails to tell us how God can forgive sin on the basis of a covenant thus ratified by Christ\'s death. Does it mean substitution, that as the animal whose blood ratified the covenant was slain instead of the people, so Christ was slain in the place of sinners? Or does it suggest the immutability of the covenant on the basis of the animal\'s (and so Christ\'s) representing both God and man, and killing signifying loss of life or will to change the covenant (so Westcott, Commentary on Hebrews, 301)? It could scarcely mean that Christ\'s sacrifice was the offering of a perfect, acceptable life to God (Wendt, op. cit., II, 237), or that Christ\'s death is viewed merely as the common meal sacrifice, that God and His people thus enter into a kind of union and communion (so some evolutionists in the study of comparative religion; see Menzies. Hist of Religion, 416ff).<P>2. Paul\'s Teaching:<P>Ritschl and many modern scholars are disposed to reject all philosophy in religion. They say, "Back to Christ." Paul was only a human interpreter of Jesus. But he was a divinely-guided interpreter, and we need his first-hand interpretations of Jesus. What has he to say as to how Christ\'s death saves men?<P>(1) The Words Expressing the Idea of Redemption.<P>See above on the terms of sacrifice. The classical passage containing the idea of redemption is <a onClick="return mV(\'Rom\',3,\'24-26\');">Ro 3:24-26</a>: "Being justified freely by his grace through the redemption that is in Christ Jesus: whom God set forth to be a propitiation, through faith, in his blood, to show his righteousness because of the passing over of the sins done aforetime, in the forbearance of God; for the showing, I say, of his righteousness at this present season: that he might himself be just, and the justifier of him that hath faith in Jesus." A fair interpretation of this passage gives us the following propositions: (a) The believer obtains right standing with God by means of, through the channel of (see Thayer, Greek-English Lexicon, dia, A, III, 2), redemption which is in Christ. (b) This redemption in Christ involves, or is based upon, the divinely-purposed propitiation which Christ made in His death. (c) The design of God in making such a propitiation was the exhibition of His righteousness; i.e., the vindication of that side of His character which demands the punishment of sin, which had not been shown in former generations when His forbearance passed over men\'s sins. See Sanday, Commentary on Romans, in the place cited. The classical passage containing the other word to redeem (exagorazo) is <a onClick="return mV(\'Gal\',3,13);">Ga 3:13</a>: "Christ redeemed us from the curse of the law, having become a curse for us," etc. Professor E. D. Burton (AJT, October, 1907) thinks:<P>(a) Law here means "law legalistically understood."<P>(b) The "curse" was the verdict of the law of pure legalism, "a disclosure to man of his actual status before God on a basis of merit."<P>(c) The redemption meant is that Christ "brought to an end the regime of law...rather than deliverance of individuals through release from penalty."<P>He bases this argument largely on the use of hemas, "us," meaning Jews in antithesis with ethne, the Gentiles (<a onClick="return mV(\'Gal\',3,14);">Ga 3:14</a>). Everett (The Gospel of Paul) thinks that Christ was cursed in that He was "crucified" (the manner not the fact of His death being the curse); that is, as Everett sees it, Christ became ceremonially unclean, and so free from the law. So does His follower by being crucified with Christ become ceremonially unclean and so free from the law. The passage seems to give us the following propositions:<P>(a) Man under law (whether the revealed law of the Old Testament or the moral law) is under a "curse," that is, liable to the penalty which the broken law demands.<P>(b) Christ by His death on the cross became a "curse for us."<P>(c) By means of Christ thus becoming a "curse for us" He delivered us, "not the Jews as a nation, but all of us, Jews and Gentiles, who believed," from the curse incurred by the breaking of the law.<P>Professor Burton admits that the participle genomenos, "becoming," may be a "participle of means" (the article cited above, 643), and so we have "Christ redeemed us from the curse of the law by becoming a curse for us." The passage at least suggests, if it does not declare, that Christ saves us by vicariously enduring the penalty to which we were exposed.<P>(2) The Idea of Reconciliation.<P>Paul uses the phrase "wrath of God" (<a onClick="return mV(\'Rom\',1,18);">Ro 1:18</a>, etc.) to express the attitude of God toward sin, an attitude of displeasure and of grief, of revulsion of holy character which demands the punishment of sin. On the other hand, God loves the sinner; love is the prompting cause of redemption through Christ (<a onClick="return mV(\'Rom\',5,8);">Ro 5:8</a>; <a onClick="return mV(\'Rom\',8,32);">8:32</a>). That is, wrath is love grieving and righteousness revolting because of sin, and both phases may act simultaneously (Simon, Redemption of Man, 216, to the contrary). So Paul says, "God was in Christ reconciling the world unto himself, not reckoning unto them their trespasses" (<a onClick="return mV(\'2Cr\',5,19);">2Co 5:19</a>). Now this word "reconcile" (katallassein) means in the active, "to receive into favor," in the passive, "to be restored to favor" (Thayer). See also Revelation and The Expositor, October, 1909, 600ff, where Professor Estes shows, from Sophocles, Xenophon, Josephus, Septuagint and passages in the New Testament like <a onClick="return mV(\'Mat\',5,24);">Mt 5:24</a>, that the word must mean a change in the attitude of God toward men and not merely a change of men toward God. Practically the same is taught by Meyer (Commentary on 2 Corinthians); Lipsius (Handcomm. zum New Testament); Sanday (Commentary on Romans); Denney (Exegetical Greek Testament on Romans); Lietzmann (Handbuch zum New Testament); Holtzmann (Neutest. Theol.); Weiss (Religion of the New Testament); Pfleiderer (Paulinism); Stevens (Christian Doctrine of Salvation), and in nearly all the great commentaries on Romans and 2 Corinthians, and by all the writers on New Testament theology except Beyschlag.<P>See also <a href="./study/isbe/search.html?string=RECONCILIATION">RECONCILIATION</a>; <a href="./study/isbe/search.html?string=RETRIBUTION">RETRIBUTION</a>.<P>(3) The Idea of Propitiation.<P>Only once (<a onClick="return mV(\'Rom\',3,25);">Ro 3:25</a>) does Paul use the word "propitiation." As saw in (1) above, the redemption in Christ is based upon the propitiation which Christ made in His death. Thayer (Greek-English Lexicon, in the place cited.) says the noun signifies "a means of appeasing, expiating, a propitiation, an expiatory sacrifice." He thinks it has this meaning in <a onClick="return mV(\'Rom\',3,25);">Ro 3:25</a>, but refers it to the "mercy-seat" in <a onClick="return mV(\'Hbr\',9,5);">Heb 9:5</a>. Sanday (Comm. on Romans, 88) regards hilasterion as an adjective meaning "propitiatory." De Wette, Fritzsche, Meyer, Lipsius and many others take it in this sense; Gifford, Vaughan, Liddon, Ritschl think it means "mercy-seat" here as in Hebrews. But with either meaning the blood of Christ is viewed as securing the mercy of God. Propitiation of God is made by the blood of Christ, and because of that men have access to the mercy-seat where shines the glory of God in His forgiveness of man\'s sins.<P>See <a href="./study/isbe/search.html?string=ROMANS,+EPISTLE+TO+THE">ROMANS, EPISTLE TO THE</a>, 9, (3).<P>(4) The Prepositions Huper, and Anti.<P>Paul never uses anti ("for," "instead of," "in place of," so Thayer) to express what Christ\'s sacrifice does for the sinner, but huper ("for one\'s safety or advantage," primarily, but also "in the place of," "instead of," so Thayer). See <a onClick="return mV(\'Rom\',5,8);">Ro 5:8</a>; <a onClick="return mV(\'Rom\',8,32);">8:32</a>; <a onClick="return mV(\'Rom\',14,15);">14:15</a>; <a onClick="return mV(\'1Cr\',11,24);">1Co 11:24</a>; <a onClick="return mV(\'2Cr\',5,15);">2Co 5:15</a>; <a onClick="return mV(\'Gal\',3,13);">Ga 3:13</a>; <a onClick="return mV(\'Eph\',5,2,25);">Eph 5:2,25</a>; <a onClick="return mV(\'1Th\',5,10);">1Th 5:10</a>; <a onClick="return mV(\'1Ti\',2,6);">1Ti 2:6</a>; <a onClick="return mV(\'Tts\',2,14);">Tit 2:14</a>. It is to be noted that in <a onClick="return mV(\'1Ti\',2,6);">1Ti 2:6</a> Paul uses antilutron, "ransom," compounded with the preposition anti, but follows it with huper, which may suggest that huper is here used in the sense of anti, "in the place of."<P>Summing up Paul\'s teaching as to how Christ\'s sacrifice saves:<P>(a) The propitiatory sacrifice does not "soften God, or assuage the anger of God" (as Bushnell claims the advocates of the satisfaction theories assert, Vicarious Sacrifice, 486). God is already willing to save men, His love makes the propitiatory sacrifice (<a onClick="return mV(\'Rom\',5,8);">Ro 5:8</a>). God\'s love makes the sacrifice, not the sacrifice His willingness to save.<P>(b) But man by breaking God\'s law had come under the curse, the penalty of the broken law (<a onClick="return mV(\'Gal\',3,13);">Ga 3:13</a>), and so was under God\'s wrath (<a onClick="return mV(\'Rom\',1,18);">Ro 1:18</a>), i.e. man\'s sin exposed him to punishment, while at the same time God\'s love for the sinner was grieved.<P>(c) Christ by His sacrificial death made it possible for God to show His righteousness and love at the same time; i.e. that He did punish sin, but did love the sinner and wish to save him (<a onClick="return mV(\'Rom\',3,25,26);">Ro 3:25,26</a>; <a onClick="return mV(\'Rom\',5,8);">5:8</a>).<P>(d) Christ, who was sinless, suffered vicariously for sinful men. His death was not due to His sins but those of men (<a onClick="return mV(\'2Cr\',5,21);">2Co 5:21</a>).<P>(e) His death, followed by His resurrection which marked Him off as the sinless Son of God, and so appointed the Saviour of men (<a onClick="return mV(\'Rom\',1,4);">Ro 1:4</a>), was designed by God to bring men into right relation with God (<a onClick="return mV(\'Rom\',3,26);">Ro 3:26</a>; <a onClick="return mV(\'2Cr\',5,21);">2Co 5:21</a>).<P>So, we may say, Paul explained the relation of Christ\'s death to the sinner\'s spiritual life by thinking of a transfer of the sinner\'s "curse" to Christ, which He bore on the cross, and of God\'s righteousness through Christ (<a onClick="return mV(\'Phl\',3,9);">Php 3:9</a>) to the sinner by faith in Christ. But we must not press this vicarious idea too far into a system of philosophy of the atonement and claim that the system is the teaching of Paul. The quantitative, commercial idea of transfer is not in Paul\'s mind. The language of redemption, propitiation, ransom, is largely figurative. We must feel the spiritual truth of a qualitative transfer of sin from man to Christ and of righteousness from Christ to man, and rest the matter there, so far as Paul\'s teaching goes. Beyond this our conclusions as to substitution as the method of atonement are results of philosophizing on Paul\'s teaching.<P>3. Teaching of Hebrews:<P>The author of Hebrews adds nothing to Paul\'s teaching respecting the method whereby Christ\'s sacrifice operates in saving men. His purpose to produce an apology showing forth the superior efficacy of Christ\'s high-priestly sacrifice over that of the Aaronic priesthood fixes his first thought on the efficacy of the sacrifice rather than on its mode of operation. He does use the words "redemption" (<a onClick="return mV(\'Hbr\',9,12);">9:12</a>; compare <a onClick="return mV(\'Hbr\',9,15);">9:15</A>), "propitiate" (<a onClick="return mV(\'Hbr\',2,17);">2:17</A>), and emphasizes the opening up of the heavenly holy of holies by the high-priestly sacrifice of Christ (the way of access to the very presence of God by Christ\'s death, <a onClick="return mV(\'Hbr\',10,19,20);">10:19,20</A>), which gives us data for forming a system based on a real propitiation for sin and reconciliation of God similar to the Pauline teaching formulated above.<P>4. Petrine and Johannine Teaching:<P>Peter asserts that Christ suffered vicariously (<a onClick="return mV(\'1Pe\',2,\'22-24\');">1Pe 2:22-24</a>), who, although He "did no sin," "his own self bare our sins in his body upon the tree"; who "suffered for sins once, the righteous for (huper, not anti) the unrighteous" (<a onClick="return mV(\'1Pe\',3,18);">1Pe 3:18</a>). But Peter goes no farther than Paul (perhaps not so far) in elaborating how Jesus\' vicarious suffering saves the sinner. The Johannine writings contain the propitiatory idea (<a onClick="return mV(\'1Jo\',2,2);">1Joh 2:2</a>; <a onClick="return mV(\'1Jo\',4,10);">4:10</a>), although John writes to emphasize the incarnation and not the work of the Incarnate One (<a onClick="return mV(\'Jhn\',1,\'1-18\');">Joh 1:1-18</a>; <a onClick="return mV(\'1Jo\',4,2,3);">1Joh 4:2,3</a>).<P>To sum up the New Testament teachings on the mode or operation: Jesus asserts His vicarious suffering (<a onClick="return mV(\'Mar\',10,45);">Mr 10:45</a>; compare <a onClick="return mV(\'Jhn\',10,11);">Joh 10:11</a>) and hints at the mode of its operation by using the "ransom" figure. Paul, Peter and John teach that Christ\'s sacrifice was vicarious, and all but Peter suggest the idea of propitiation as to the mode of its operation. There is no direct discussion of what propitiation means.``194';
isbe[7559]='Sacrifice, in the New Testament, 2`VI. Rationale of the Efficacy of Christ\'s Sacrifice.<P>1. Jesus\' Teaching:<P>Jesus emphasizes His voluntary spirit in making the sacrifice. "The Son of man also came...to give his life a ransom." The sacrifice was voluntary, not compulsory. God did not force Him to lay down His life; He chose to do so (compare <a onClick="return mV(\'Jhn\',10,11);">Joh 10:11</a>). But Jesus gives us no philosophy on this or any other element in His sacrifice as being the ground of its efficacy.<P>2. Paul\'s Teaching:<P>Paul also emphasizes the voluntary gift of Christ (<a onClick="return mV(\'Gal\',2,20);">Ga 2:20</a>), but he urges rather the dignity of Him who makes the sacrifice as a ground of its efficacy. It is the sacrifice of God\'s Son, shown to be such in His resurrection (<a onClick="return mV(\'Rom\',1,4);">Ro 1:4</a>; <a onClick="return mV(\'Rom\',4,25);">4:25</a>). It was no ordinary man but the sinless Son who gave "himself" (<a onClick="return mV(\'Gal\',2,20);">Ga 2:20</a>). It was not merely a dying Christ but the Son who rose again "in power" (<a onClick="return mV(\'Rom\',1,4);">Ro 1:4</a>), who secures our "justification" (<a onClick="return mV(\'Rom\',4,25);">Ro 4:25</a>; <a onClick="return mV(\'1Cr\',15,3,4,17);">1Co 15:3,4,17</a>). Paul also emphasizes the sinless life and character of Jesus as a ground of efficacy in Christ\'s sacrifice, "who knew no sin" in His life experience (<a onClick="return mV(\'2Cr\',5,21);">2Co 5:21</a>).<P>3. The Teaching in Hebrews:<P>The author of Hebrews, most of all New Testament writers, elaborates the grounds of efficacy in Christ\'s sacrifice.<P>(1) It was a personal not an animal sacrifice (<a onClick="return mV(\'Hbr\',9,12,13,14);">9:12-14</a>; <a onClick="return mV(\'Hbr\',9,26);">9:26</a>, "sacrifice of himself"; <a onClick="return mV(\'Hbr\',10,4);">10:4</a>).<P>(2) It was the sacrifice of the Son of God (<a onClick="return mV(\'Hbr\',3,5);">3:5</a>).<P>(3) It was a royal person who made the sacrifice (<a onClick="return mV(\'Hbr\',6,20);">6:20b</a>; <a onClick="return mV(\'Hbr\',7,1);">7:1</a>, "after the order of Melchizedek...king of Salem").<P>(4) It was a sinless person (<a onClick="return mV(\'Hbr\',7,26,27);">7:26,27</a>; <a onClick="return mV(\'Hbr\',9,14);">9:14</a>; <a onClick="return mV(\'Hbr\',10,10,12);">10:10,12</a>). Westcott, Commentary on Hebrews, 298, well says, "It becomes necessary, therefore, in order to gain a complete view of the Sacrifice of Christ, to combine with the crowning act upon the Cross His fulfillment of the will of God from first to last, the Sacrifice of Life with the Sacrifice of Death."<P>(5) It was an eternal person (<a onClick="return mV(\'Hbr\',6,20);">6:20</a>, "for ever"; <a onClick="return mV(\'Hbr\',7,16);">7:16</a>, "after the power of an endless (margin "indissoluble") life").<P>The author of Hebrews reaches the climax of his argument for the superior efficacy of Christ\'s sacrifice when he represents Him as entering the holy of holies in the very presence of God to complete the offering for man\'s sin (<a onClick="return mV(\'Hbr\',8,1,2);">8:1,2</a>; <a onClick="return mV(\'Hbr\',9,11,12,24);">9:11,12,24</A>).<P>Peter and John do not discuss the ground of efficacy, and so add nothing to our conclusions above. The efficacy of the sacrifice is suggested by describing the glory of the person (<a onClick="return mV(\'1Pe\',1,19);">1Pe 1:19</a>; <a onClick="return mV(\'1Pe\',2,22,23);">2:22,23</a>; <a onClick="return mV(\'1Jo\',1,7);">1Joh 1:7</a>; <a onClick="return mV(\'1Jo\',2,2);">2:2</a>).<P>To sum up our conclusion as to the efficacy of Christ\'s sacrifice: Jesus and the leading New Testament writers intimate that the efficacy of His sacrifice centers in His personality. Jesus, Peter and John do not discuss the subject directly. Paul, though discussing it more extensively, does not do so fully, but the author of Heb centers and culminates his argument for the finality of Christianity, in the superior efficacy of Christ\'s sacrifice, which is grounded in His personality, divine, royal, sinless, eternal (see Menegoz, Theol. de l\'Ep. aux Hebreux). It is easy to see, from the position taken by the author of He, how Anselm in Cur Deus Homo developed his theory of satisfaction, according to which the Divinity in Christ gave His atoning sacrifice its priceless worth in God\'s eyes.<P>VII. The Human Conditions of Application.<P>1. Universal in Objective Potentiality:<P>The sacrificial death of Christ is universal in its objective potentiality, according to Jesus (<a onClick="return mV(\'Luk\',24,47);">Lu 24:47</a>, "unto all the nations"); according to Paul (<a onClick="return mV(\'Rom\',1,5);">Ro 1:5</a>; <a onClick="return mV(\'Rom\',5,18);">5:18</a>; <a onClick="return mV(\'Rom\',11,32);">11:32</a>; <a onClick="return mV(\'2Cr\',5,14,15);">2Co 5:14,15</a>; <a onClick="return mV(\'Gal\',3,14);">Ga 3:14</a>); according to the author of Hebrews (<a onClick="return mV(\'Hbr\',2,9);">2:9</a>, "taste of death for every man"); according to John (<a onClick="return mV(\'1Jo\',2,2);">1Joh 2:2</a>, "propitiation...for the whole world").<P>2. Efficacious When Subjectively Applied:<P>But the objective redemption to be efficacious must be subjectively applied. The blood of Christ is the universally efficacious remedy for the sin-sick souls of men, but each man must make the subjective application. How is the application made? And the threefold answer is, by repentance, by faith, and by obedience.<P>(1) By Repentance.<P>The Baptist and Jesus emphasized repentance (change of mind first of all, then change of relation and of life) as the condition of entrance into the kingdom and of enjoyment of the Messianic salvation (<a onClick="return mV(\'Mat\',3,2);">Mt 3:2</a>; <a onClick="return mV(\'Mar\',1,15);">Mr 1:15</a>). Peter preached repentance at Pentecost and immediately after as a means of obtaining forgiveness (<a onClick="return mV(\'Act\',2,38);">Ac 2:38</a>; <a onClick="return mV(\'Act\',3,19);">3:19</a>, etc.). Paul, although emphasizing faith, also stressed repentance as an element in the human condition of salvation (<a onClick="return mV(\'Act\',20,21);">Ac 20:21</a>; <a onClick="return mV(\'Rom\',2,4);">Ro 2:4</a>, etc.). John (<a onClick="return mV(\'Rev\',2,\'1-\');">Re 2</a>; <a onClick="return mV(\'Rev\',3,\'1-\');">3</a>, passim) emphasizes repentance, though not stressing it as a means of receiving the benefits of redemption.<P>(2) By Faith.<P>Jesus connected faith with repentance (<a onClick="return mV(\'Mar\',1,15);">Mr 1:15</a>) as the condition of receiving the Messianic salvation. Paul makes faith the all-inclusive means of applying the work of Christ. The gospel is "the power of God unto salvation to every one that believeth" (<a onClick="return mV(\'Rom\',1,16);">Ro 1:16</a>); "whom God set forth to be a propitiation, through faith" (<a onClick="return mV(\'Rom\',3,25);">Ro 3:25</a>); "faith (not works) is reckoned for righteousness" (<a onClick="return mV(\'Rom\',4,5);">Ro 4:5</a>); "justified by faith" (<a onClick="return mV(\'Rom\',5,1);">Ro 5:1</a>). In Galatians, the letters to the Corinthians, in the Captivity and the Pastoral Epistles he emphasizes faith as the sole condition of receiving salvation. But what kind of faith is it that appropriates the saving benefit of Christ\'s death? Not historical or intellectual but "heart" faith (<a onClick="return mV(\'Rom\',10,10);">Ro 10:10</a>). To Paul "heart" meant the seat or essence of the whole personality, and so faith which applies the redemption Christ is the personal commitment of one\'s self to Christ as Saviour and Lord (<a onClick="return mV(\'2Cr\',5,15);">2Co 5:15</a>). See Thayer, Greek-English Lexicon, pisteuo, 1, b, gamma, for a particular discussion of the meaning of faith in this sense. The author of Heb discusses especially faith as a conquering power, but also implies that it is the condition of entrance upon the life of spiritual rest and fellowship (chapters 3 and 4, passim). Peter (<a onClick="return mV(\'1Pe\',1,9);">1Pe 1:9</a>) and John (<a onClick="return mV(\'1Jo\',3,23);">1Joh 3:23</a>; <a onClick="return mV(\'1Jo\',4,16);">4:16</a>; <a onClick="return mV(\'1Jo\',5,1,5);">5:1,5</a>, etc.) also regard faith as a means of applying the saving benefits of Christ\'s death.<P>(3) By Obedience in Sacrificial Service.<P>Jesus said, "If any man would come after me, let him deny himself, and take up his cross, and follow me" (<a onClick="return mV(\'Mar\',8,34);">Mr 8:34</a>). Here He lays down two elements in the conditions of discipleship, denying one\'s self and taking up his cross. The former means the renunciation of self as the center of thought, faith, hope and life. The latter means the life of sacrifice. Jesus was stressing this truth when He uttered that incomparable saying, "The Son of man came not to be ministered unto, but to minister, and to give his life a ransom for many" (<a onClick="return mV(\'Mar\',10,45);">Mr 10:45</a> parallel <a onClick="return mV(\'Mat\',20,28);">Mt 20:28</a>). Paul also emphasizes this phase of the human condition of salvation when he shows how sanctification grows spontaneously out of justification (<a onClick="return mV(\'Rom\',6,8);">Ro 6:8</a>) and when he says that what "avails" is "faith working through love" (<a onClick="return mV(\'Gal\',5,6);">Ga 5:6</a>). The author of Hebrews says, "He became unto all them that obey him the author (Greek aitios, "cause") of eternal salvation" (<a onClick="return mV(\'Hbr\',5,9);">5:9</A>). Peter and John, the latter especially, emphasize the keeping of His commandments, the life of service, as the means of appropriating to the fullest the saving benefits of Christ\'s death. The theologians in classrooms and preachers in the pulpits have failed to emphasize this aspect of "saving faith" as did Jesus, Paul, the author of He, and John. in the New Testament salvation is a process as well as an instantaneous act on the part of God, and the process is carried on by means of obedience, the life of service, which appropriates by faith the dynamic of Christ\'s sacrifice.<P>VIII. The Christian\'s Life the Life of Sacrifice.<P>This discussion of the faith that "obeys" leads to the consideration of that climactic thought of New Testament writers, namely, that the Christian\'s life is sacrificial living based on Christ\'s sacrifice for him. We note in outline the following:<P>The Christian\'s life of sacrifice is the logical consequence of Christ\'s sacrificial death. The Christ who sacrificed Himself for the believer is now continuing the sacrifice in the believer\'s life (<a onClick="return mV(\'Gal\',1,20);">Ga 1:20</a>; <a onClick="return mV(\'Phl\',1,21);">Php 1:21</a>).<P>1. Consequence of Christ\'s Sacrifice:<P>Paul was crucified when Christ was crucified (in a bold mystic figure), and the life of Christ which sacrificed itself on the cross and perpetuates itself in resurrection power now operates as a mighty dynamic for the apostle\'s moral and spiritual transformation (<a onClick="return mV(\'Phl\',3,10,11);">Php 3:10,11</a>). It is to be noted, Jesus also emphasized this kind of living, though not so expressly connecting the believer\'s sacrificial life with His sacrificial death (see <a onClick="return mV(\'Mar\',8,34);">Mr 8:34</a>f).<P>2. Christ\'s Death the Appeal for a Christian\'s Sacrifice:<P>Christ\'s sacrificial death becomes the persuasive appeal for the Christian\'s sacrificial life, "Because we thus judge, that one died for all, therefore all died; and he died for all, that they that live should no longer live unto themselves, but unto him who for their sakes died and rose again" (<a onClick="return mV(\'2Cr\',5,14,15);">2Co 5:14,15</a>). Because He died for us we should live for Him. But what is the appeal which Christ\'s sacrificial death makes to the saved sinner? "The love of Christ constraineth us" (<a onClick="return mV(\'2Cr\',5,14);">2Co 5:14</a>). Christ\'s death on the cross exhibits His love, unspeakable, unthinkable love, for it was love for His "enemies" (<a onClick="return mV(\'Rom\',5,10);">Ro 5:10</a>), and that matchless love kindles love in the forgiven sinner\'s heart. He is willing to do anything, even to die, for his Saviour who died for him (<a onClick="return mV(\'Act\',21,13);">Ac 21:13</a>; <a onClick="return mV(\'Phl\',1,29,30);">Php 1:29,30</a>). It is a greater privilege for the saved sinner to suffer for Christ than it is to believe on Him. Peter (<a onClick="return mV(\'1Pe\',3,17,18);">1Pe 3:17,18</a>), the author of Hebrews (<a onClick="return mV(\'Hbr\',12,\'1-\');">12</a>; <a onClick="return mV(\'Hbr\',13,13);">13:13</A>) and John (<a onClick="return mV(\'1Jo\',3,16);">1Joh 3:16</a>; <a onClick="return mV(\'1Jo\',4,\'16-19\');">4:16-19</a>) emphasize this truth.<P>3. Necessary to Fill Out Christ\'s Sacrifice:<P>The Christian\'s sacrifice is necessary to fill out Christ\'s sacrifice. "Now I rejoice in my sufferings for your sake, and fill up on my part that which is lacking of the afflictions of Christ in my flesh for his body\'s sake, which is the church" (<a onClick="return mV(\'Col\',1,24);">Col 1:24</a>). Roman Catholic exegetes have made the apostle teach that the sufferings of the saints, along with Christ\'s sufferings, have atoning efficacy. But Paul nowhere intimates that his sufferings avail for putting away sins. We may hold with Weiss (Comm. on the New Testament) that Paul longed to experience in his life the perfect sacrificial spirit as Christ did; or with Alford (in loc.) that he wished to suffer his part of Christ\'s sufferings to be endured by him through His church; or, as it seems to us, he longed to make effective by his ministry of sacrificial service to as many others as possible the sacrificial death of Christ. Christ\'s sacrifice avails in saving men only when Christians sacrifice their lives in making known this sacrifice of Christ.<P>4. Content of the Christian\'s Sacrifice:<P>(1) The Christian is to present his personality (<a onClick="return mV(\'Rom\',15,16);">Ro 15:16</a>). Paul commends the Macedonians for "first" giving "their own selves to the Lord" (<a onClick="return mV(\'2Cr\',8,5);">2Co 8:5</a>).<P>(2) Christians must present their "bodies a living sacrifice, holy, acceptable to God" (<a onClick="return mV(\'Rom\',12,1);">Ro 12:1</a>). In the old system of sacrifices the animals were offered as dead; Christians are to offer their bodies, all their members with their powers, to God a "living sacrifice," i.e. a sacrifice which operates in lives of holiness and service (see also <a onClick="return mV(\'Rom\',6,13,19);">Ro 6:13,19</a>).<P>(3) Christians must offer their money or earthly possessions to God. Paul speaks of the gift from the church at Philippi as "a sacrifice acceptable, well-pleasing to God" (<a onClick="return mV(\'Phl\',4,18);">Php 4:18</a>). This gift was to the apostle a beautiful expression of the sacrificial spirit imparted to them because they had the "mind" of Christ who "emptied himself,...becoming obedient even unto death, yea, the death of the cross" (<a onClick="return mV(\'Phl\',2,\'5-8\');">Php 2:5-8</a>). The author of Hebrews (<a onClick="return mV(\'Hbr\',13,16);">13:16</a>) exhorts his readers, "But to do good and to communicate forget not: for with such sacrifices God is well pleased."<P>(4) The general exercise of all our gifts and graces is viewed by Peter as sacrificial living (<a onClick="return mV(\'1Pe\',2,5);">1Pe 2:5</a>): "Ye also, as living stones, are built up a spiritual house, to be a holy priesthood, to offer up spiritual sacrifices" etc. All Christians are priests and daily offer up their burnt offerings acceptable to God, if they \'suffer as Christians\' (<a onClick="return mV(\'1Pe\',2,20);">1Pe 2:20</a>; <a onClick="return mV(\'1Pe\',3,18);">3:18</a>) in the exercise of their graces and powers.<P>But how do these sacrifices of the Christian affect him and God? The New Testament writers never hint that our sacrifices propitiate God, or so win His favor that He will or can on account of our sacrifices forgive our sins. They are "well-pleasing" to Him a "sweet odor"; that is, they win His approval of our lives thus lived according to the standard which Christ gives us. Their influence on us is the increase of our spiritual efficiency and power and finally a greater capacity for enjoying spiritual blessings in heaven (<a onClick="return mV(\'1Cr\',3,14);">1Co 3:14</a>).<P>5. The Supper as a Sacrifice:<P>Some scholars (Roman Catholic, Episcopalian, etc.) regard the memorial supper as a kind of sacrifice which the Christian offers in worship. Neither Jesus, Paul, the author of Hebrews, Peter, or John, ever hints that in eating the bread and drinking the wine the Christian offers a sacrifice to God in Christ. Paul teaches that in partaking of the Supper we "proclaim the Lord\'s death till he come" (<a onClick="return mV(\'1Cr\',11,26);">1Co 11:26</a>). That is, instead of offering a sacrifice ourselves to God, in partaking of the Supper we proclaim the offering of Christ\'s sacrifice for us. Milligan argues that as Christ in heaven perpetually offers Himself for us, so we on earth, in the Supper, offer ourselves to Him (Heavenly Priesthood, 266). Even Cave (Spiritual Doctrine of Sacrifice, 439) maintains, "In a certain loose sense the Lord\'s Supper may be called a sacrifice." See the above books for the argument supporting this position.<P>To sum up our conclusions on sacrifice in the New Testament:<P>(1) Jesus and New Testament writers regard the Old Testament sacrificial system as from God, but imperfect, the various sacrifices serving only as types of the one great sacrifice which Christ made.<P>(2) All the writers, except James and Jude, with Jesus, emphasize the sacrificial idea, Jesus less, giving only two hints of His sacrificial death (in the Synoptic Gospels), the author of Heb putting the climactic emphasis on Christ\'s sacrifice as the sacrifice of atonement.<P>(3) As to the relation of Christ\'s sacrifice to man\'s salvation, the latter is the achievement of the former, so expressed only twice by Jesus, but emphatically so declared by Paul, the author of Heb, Peter, and John (Paul and Heb laying most emphasis on this point).<P>(4) As to how Christ\'s sacrifice saves men, Jesus, the author of He, Peter and John suggest the idea of propitiation, while Paul emphatically teaches that man is under a curse, exposed to the displeasure of God, and that Christ\'s sacrifice secured the reconciliation of God by vindicating His righteousness in punishing sin and His love in saving sinners. Jesus and the leading New Testament writers agree that Christ saves men through His vicarious suffering.<P>(5) As to the rational basis of efficacy in Christ\'s sacrifice, there is no direct discussion in the New Testament except by the author of Hebrews who grounds its final, eternal efficacy in Christ\'s personality, divine, royal, sinless and eternal.<P>(6) As to the conditions of applying Christ\'s sacrifice, repentance and faith, which lives and fruits in obedience and sacrificial living, are recognized by Jesus and all the leading New Testament writers as the means of appropriating the benefits of Christ\'s sacrifice.<P>(7) By Jesus, Paul, the author of He, Peter and John the Christian life is viewed as the life of sacrifice. Christ\'s death is at once the cause, motive, measure, and the dynamic of the Christian\'s sacrificial life.<P>LITERATURE.<P>In addition to the great comms.—ICC, Allen on "Mt," Gould on "Mk," Sanday-Headlam on "Rom"; Westcott on the Gospel and Epistles of John, and on the Hebrews; Davidson, Delitzsch and Meyer on Hebrews; Meyer on 2 Corinthians; Lightfoot and Abbott on Colossians; and the standard authors of the Biblical Theology of the New Testament, Weiss, Beyschlag, Bovon, Stevens, Sheldon—see the following special works: Cave, Scriptural Doctrine of Sacrifice, Edinburgh, 1890; Simon, Redemption of Man, 1886; G. Milligan, The Theology of the Epistle to the Hebrews, Edinburgh, 1899; Milligan, The Ascension and Heavenly Priesthood of our Lord, London, 1908; W.P. Du Bose, High-Priesthood and Sacrifice; Everett, The Gospel of Paul, Boston, 1893; Burton, Smith, and Smith, Biblical Ideas of Atonement, Chicago, 1909; Denney, The Death of Christ: Its Place and Interpretation in the New Testament, London, 1902; Denney, The Atonement and the Modern Mind, London, 1903; Ritschl, Rechtfertigung und Versohnung (Justification and Reconciliation), Bonn, 1895-1902, English translations of the Bible, 1900; Menegoz, Theol. del\'Ep. aux Hebreux; article "Blood," Hastings, Encyclopedia of Religion and Ethics, by H. Wheeler Robinson; article "Communion with Deity," ibid., by Nathan Soderblom; article "Communion with Deity" (Christian), ibid., by Darwell Stone and D. C. Simpson; article "Expiation and Atonement," ibid., by W. A. Brown (Christian viewpoint), S. R. Driver (Hebrew), H. Loewe (Jewish); article "Redemption from the Curse of the Law," in AJT, October,1907,by Professor E. D. Burton; article "Some Thoughts as to the Effects of the Death of Christ," in Revelation and The Expositor, October, 1909.``194';
isbe[7560]='Sacrifice, in the Old Testament, 1`sak\'-ri-fis, sak\'-ri-fiz:<P><b>IN THE OLD TESTAMENT</b><P><b>I. TERMS AND DEFINITIONS</b><P><b>II. ORIGIN AND NATURE OF SACRIFICES</b><P class="in15">1. Theory of a Divine Revelation<P class="in15">2. Theories of a Human Origin<P class="in30">(1) The Gift-Theory<P class="in30">(2) The Magic Theory<P class="in30">(3) The Table-Bond Theory<P class="in30">(4) The Sacramental Communion Theory<P class="in30">(5) The Homage Theory<P class="in30">(6) The Piacular Theory<P class="in30">(7) Originating Religious Instincts<P><b>III. CLASSIFICATION OF SACRIFICES</b><P class="in15">1. Maimonides<P class="in15">2. W.R. Smith and Others<P class="in15">3. Oehler<P class="in15">4. Paterson and Others<P class="in15">5. H.M. Wiener<P><b>IV. SACRIFICES IN THE PRE-MOSAIC AGE</b><P class="in15">1. In Egypt<P class="in15">2. In Babylonia<P class="in15">3. Nomads and Tribes of Arabia and Syria<P class="in15">4. The Offerings of Cain and Abel<P class="in15">5. Of Noah<P class="in15">6. Of Abraham<P class="in15">7. Of Job<P class="in15">8. Of Isaac<P class="in15">9. Of Jacob<P class="in15">10. Of Israel in Egypt<P class="in15">11. Of Jethro<P class="in15">12. Summary and Conclusions<P><b>V. THE MOSAIC SACRIFICIAL SYSTEM</b><P class="in15">1. The Covenant Sacrifice<P class="in15">2. The Common Altars<P class="in15">3. The Consecration of Aaron and His Sons<P class="in15">4. Sacrifices before the Golden Calf<P class="in15">5. The Law of the Burnt Offering (\'Olah)<P class="in30">(1) Ritual for the Offerer (<a onClick="return mV(\'Lev\',1,\'3-17\');">Leviticus 1:3-17</a>)<P class="in30">(2) Ritual for the Priest (<a onClick="return mV(\'Lev\',1,\'3-17\');">Leviticus 1:3-17</a>)<P class="in30">(3) General Laws for the Priest<P class="in30">(4) Laws in <a onClick="return mV(\'Deu\',12,6,13,14,27);">Deuteronomy 12:6,13,14,27</a>; <a onClick="return mV(\'Deu\',27,6);">27:6</a><P class="in15">6. The Law of the Meal Offering (Minchah)<P class="in30">(1) Ritual for the Offerer (<a onClick="return mV(\'Lev\',2,\'1-16\');">Leviticus 2:1-16</a>)<P class="in30">(2) Ritual for the Priest (<a onClick="return mV(\'Lev\',2,\'1-16\');">Leviticus 2:1-16</a>)<P class="in30">(3) General Laws for the Priest (<a onClick="return mV(\'Lev\',6,\'14-18\');">Leviticus 6:14-18 (Hebrew 7-11)</a>, etc.)<P class="in15">7. The Law of the Peace Offering<P class="in30">(1) Ritual for the Offerer (<a onClick="return mV(\'Lev\',3,\'1-17\');">Leviticus 3:1-17</a>)<P class="in30">(2) Ritual for the Priest (<a onClick="return mV(\'Lev\',3,\'1-17\');">Leviticus 3:1-17</a>)<P class="in30">(3) General Laws for the Priest (<a onClick="return mV(\'Lev\',6,12);">Leviticus 6:12 (Hebrew 5)</a>; <a onClick="return mV(\'Lev\',7,1);">7:1</a>ff)<P class="in15">8. The Law of the Sin Offering<P class="in30">(1) At the Consecration of Aaron and His Sons (<a onClick="return mV(\'Exd\',29,10);">Exodus 29:10</a>ff)<P class="in30">(2) The Law of the Sin Offering (<a onClick="return mV(\'Lev\',4,\'1-35\');">Leviticus 4:1-35</a>; <a onClick="return mV(\'Lev\',24,\'1-\');">24-30</A>, etc.)<P class="in45">(a) The Occasion and Meaning<P class="in45">(b) Ritual for the Offerer (<a onClick="return mV(\'Lev\',4,\'1-5\',13);">Leviticus 4:1-5,13</a>, etc.)<P class="in45">(c) Ritual for the Priest (<a onClick="return mV(\'Lev\',4,\'1-5\',13);">Leviticus 4:1-5,13</a>, etc.)<P class="in45">(d) General Laws for the Priest (<a onClick="return mV(\'Lev\',6,\'24-30\');">Leviticus 6:24-30</a>)<P class="in45">(e) Special Uses of the Sin Offering<P class="in60">(i) Consecration of Aaron and His Sons<P class="in60">(ii) Purifications from Uncleanness<P class="in60">(iii) On the Day of Atonement<P class="in60">(iv) Other Special Instances<P class="in15">9. The Guilt Offering<P class="in30">(1) The Ritual (<a onClick="return mV(\'Lev\',5,14);">Leviticus 5:14-6:7</a>)<P class="in30">(2) Special Laws: Leper, Nazirite, etc.<P class="in15">10. The Wave Offering<P class="in15">11. The Heave Offering<P class="in15">12. Drink Offerings<P class="in15">13. Primitive Nature of the Cult<P><b>VI. SACRIFICES IN THE HISTORY OF ISRAEL</b><P class="in15">1. The Situation at Moses\' Death<P class="in15">2. In the Time of Joshua<P class="in15">3. The Period of the Judges<P class="in15">4. Times of Samuel and Saul<P class="in15">5. Days of David and Solomon<P class="in15">6. In the Northern Kingdom<P class="in15">7. In the Southern Kingdom to the Exile<P class="in15">8. In the Exilic and Post-exilic Periods<P class="in15">9. A Temple and Sacrifices at Elephantine<P class="in15">10. Human Sacrifices in Israel\'s History<P class="in15">11. Certain Heathen Sacrifices<P><b>VII. THE PROPHETS AND SACRIFICES</b><P><b>VIII. SACRIFICE IN THE "WRITINGS"</b><P class="in15">1. Proverbs<P class="in15">2. The Psalms<P><b>IX. THE IDEA AND EFFICACY OF SACRIFICES</b><P class="in15">1. A Gift of Food to the Deity<P class="in15">2. Expression of Adoration and Devotion, etc.<P class="in15">3. Means of Purification from Uncleanness<P class="in15">4. Means of Consecration to Divine Service<P class="in15">5. Means of Establishing a Community of Life between Worshipper and God<P class="in15">6. View of Ritschl<P class="in15">7. The Sacramental View<P class="in15">8. Symbol or Expression of Prayer<P class="in15">9. View of Kautzsch<P class="in15">10. Vicarious Expiation Theory; Objections<P class="in15">11. Typology of Sacrifice<P><b>LITERATURE</b><hr /><P>I. Terms and Definitions.<P>zebhach, "sacrifice"; \'olah, "burnt offering"; chata\'ah, chatta\'th, "sin offering"; \'asham, "guilt" or "trespass offering": shelem, shelamim, "peace offerings"; minchah, "offering," "present"; zebhach shelamim, "sacrifice of peace offerings"; zebhach ha-todhah, "thank offerings"; zebhach nedhabhah, "free-will offerings"; zebhach nedher, "votive offerings"; tenuphah, "wave offering"; terumah, "heave offering"; qorban, "oblation," "gift"; \'ishsheh, "fire offering"; necekh, "drink offering"; kalil, "whole burnt offering"; chagh, "feast"; lebhonah, "frankincense"; qetorah, qetoreth, "odor," "incense"; melach, "salt"; shemen, "oil":<P>Zebhach: a "slaughtered animal," a "sacrifice," general term for animals used in sacrifice, including burnt offerings, peace offerings, thank offerings, and all sacrifices offered to the Deity and eaten at the festivals. More particularly it refers to the flesh eaten by the worshippers after the fat parts had been burned on the altar and the priest had received his portion.<P>\'Olah: a "burnt offering," sometimes whole burnt offering. Derived from the verb \'alah, "to go up." It may mean "that which goes up to the altar" (Knobel, Wellhausen, Nowack, etc.), or "that which goes up in smoke to the sky" (Bahr, Delitzsch, Dillmann, etc.); sometimes used synonymously with kalil (which see). The term applies to beast or fowl when entirely consumed upon the altar, the hide of the beast being taken by the priest. This was perhaps the most solemn of the sacrifices, and symbolized worship in the full sense, i.e. adoration, devotion, dedication, supplication, and at times expiation.<P>Chota\'ah, chatta\'th: a "sin offering," a special kind, first mentioned in the Mosaic legislation. It is essentially expiatory, intended to restore covenant relations with the Deity. The special features were:<P>(1) the blood must be sprinkled before the sanctuary, put upon the horns of the altar of incense and poured out at the base of the altar of burnt offering;<P>(2) the flesh was holy, not to be touched by worshipper, but eaten by the priest only. The special ritual of the Day of Atonement centers around the sin offering.<p>\'Asham: "guilt offering," "trespass offering" (King James Version; in <a onClick="return mV(\'Isa\',53,10);">Isa 53:10</a>, the King James Version and the Revised Version (British and American) "an offering for sin," the American Revised Version margin "trespass offering"). A special kind of sin offering introduced in the Mosaic Law and concern
