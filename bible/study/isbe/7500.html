isbe = [];

isbe[7501]='Royal City``<a href="./study/isbe/search.html?string=ROYAL">ROYAL</a>`1';
isbe[7502]='Ruby`roo\'-bi.`<a href="./study/isbe/search.html?string=STONES,+PRECIOUS">STONES, PRECIOUS</a>`1';
isbe[7503]='Rudder; Rudder-Bands`rud\'-er.`<a href="./study/isbe/search.html?string=SHIPS+AND+BOATS">SHIPS AND BOATS</a>`1';
isbe[7504]='Ruddy`rud\'-i (\'adhmoni (<a onClick="return mV(\'1Sa\',16,12);">1Sa 16:12</a>; <a onClick="return mV(\'1Sa\',17,42);">17:42</a>; <a onClick="return mV(\'Gen\',25,25);">Ge 25:25</a> the Revised Version margin), \'adhom (<a onClick="return mV(\'Sgs\',5,10);">So 5:10</a>); verbs \'adham (<a onClick="return mV(\'Lam\',4,7);">La 4:7</a>), and eruthriao, "to blush" (Ad Es 15:5)): "Ruddy" is the form taken by the adjective "red" when used as a term of praise of the human skin, and this is its use in the Bible (the Hebrew and Greek words are all usual words for "red" or "to be red"). The dark-skinned Hebrews found great beauty in a clear complexion.``1';
isbe[7505]='Rude`rood: Not "impolite" in English Versions of the Bible (except perhaps 2Macc 12:14), but "untrained," "ignorant"; compare the modern phrase, "a rude drawing." So Sirach 8:4 (apaideutos) and <a onClick="return mV(\'2Cr\',11,6);">2Co 11:6</a> (idiotes, \'though I lack technical training in rhetoric\'); compare the King James Version and the Revised Version margin Sirach 21:24.``1';
isbe[7506]='Rudiments`roo\'-di-ments (stoicheia, plural of stoicheion (<a onClick="return mV(\'Gal\',4,3,9);">Ga 4:3,9</a>; <a onClick="return mV(\'Col\',2,8,20);">Col 2:8,20</a>; <a onClick="return mV(\'Hbr\',5,12);">Heb 5:12</a>; <a onClick="return mV(\'2Pe\',3,10,12);">2Pe 3:10,12</a>)): This word occurs 7 times in the New Testament, and the King James Version translates it in three different ways. In the two passages in Galatians, and in the two in 2 Peter, it is rendered "elements." In the two passages in Colossians, it is translated "rudiments." In He it is rendered "first principles."<P>1. Etymological Meaning:<P>The etymological meaning of the word is, that which belongs to a row or rank, hence any first thing, an element, first principle. It denotes, specially<P>(1) the letters of the alphabet, the spoken sounds, as the elements of speech;<P>(2) the material elements of the universe, the physical atoms of which the world is composed;<P>(3) the heavenly bodies;<P>(4) the elements, rudiments, fundamental principles of any art, science or discipline; compare the phrase, "the a, b, c."<P>2. Use of Term in the New Testament:<P>(1) The New Testament use of the word, where it always occurs in the plural, is as follows: In <a onClick="return mV(\'2Pe\',3,10,12);">2Pe 3:10,12</a>, "The elements shall be dissolved with fervent heat," that is, the physical elements of the world and of the heavens are to be consumed, or subjected to change, by means of fire. In <a onClick="return mV(\'Hbr\',5,12);">Heb 5:12</a>, the King James Version "Ye have need that one teach you again which be the first principles of the oracles of God." This means that the Hebrew Christians had not made the advance expected, in grace and in the knowledge of God, but were in need of instruction in the elementary truths of the Christian faith.<P>(2) The Pauline use of the term is in Galatians and Colossians; see references as above. In <a onClick="return mV(\'Gal\',4,3,9);">Ga 4:3,9</a> the King James Version Paul writes, "When we were children, (we) were in bondage under the elements of the world"; "How turn ye again to the weak and beggarly elements, whereunto ye desire again to be in bondage?" The apostle here means the ceremonial precepts of the worship of the Jews. These requirements involved much and protracted difficulty in their observance; they were "a yoke...which neither our fathers nor we were able to bear" (<a onClick="return mV(\'Act\',15,10);">Ac 15:10</a>). Yet the Galatian converts were tuning back again to these legal ordinances, and desired to be in bondage to them. These elements were "of the world," they had reference to material and not to spiritual things, they were formal and sensuous. They were "weak," for they had no power to rescue man from condemnation, and they could not save him from sin. They were "beggarly," for they brought no endowment of the heavenly riches. By these epithets Paul signifies that rites, ordinances, sacrifices, observance of days and seasons belonged to the elementary stages of the Jewish religion, which had now attained its end and purpose in the coming of Christ and His work. These things were necessary at the time they were divinely instituted, but the time had come when they were no longer required. They contained and conveyed an elementary knowledge, and were intended, from the first, to lead to an advance in the moral and spiritual life, which is now revealed in Christ.<P>It has been thought by some that what is meant by "elements" or "rudiments" in Galatians and Colossians is the physical elements, presided over by angels, and that this is in some way connected with the worship of angels, to which Paul refers in <a onClick="return mV(\'Col\',2,18);">Col 2:18</a>. The Jews believed that there were, angels of fire and of the wind, and of the other physical elements. The apostle therefore wished to show the foolishness of the worship of angels and of the heavenly bodies which they were supposed to control.<P>This latter meaning of the term is a possible, but not a probable one. The interpretation, already first given, which understands "elements" to mean the ordinances of Jewish legalism, is most in harmony with the gospel and with the teaching of Paul. "This is probably the correct interpretation, both as simpler in itself and as suiting the context better. Paul seems to be dwelling still on the rudimentary character of the law, as fitted for an earlier stage in the world\'s history" (Lightfoot, Commentary on Galatians, 167).<P>In <a onClick="return mV(\'Col\',2,8);">Col 2:8</a> the King James Version Paul writes, "Beware lest any man spoil you...after the rudiments of the world, and not after Christ"; and in <a onClick="return mV(\'Col\',2,20);">Col 2:20</a>, the King James Version "Wherefore if ye be dead with Christ from the rudiments of the world, why...are ye subject to ordinances?" The meaning of the term here is the elements of religious training, the ceremonial precepts of the Jewish Law. In Colossians and Galatians the meaning is that the systems of the false teachers, both in Colosse and in Galatia, laid stress on Jewish ritual, ceremonial law and ascetic observances—things of this world, belonging to the visible sphere, things elementary, and intended, so far as the Jewish Law is concerned, simply as a preparation for the coming of Christ. Such were the rudiments of the world, so far as their source was Jewish. On their heathen side they were still more decidedly anti-Christian. Both of these tendencies, Jewish and heathen, were "not according to Christ." For Christ Himself who atoned for sin, and who now lives and reigns, delivers believers from all such methods, as well as from the need of them.``155';
isbe[7507]='Rue`roo (peganon): One of the plants mentioned in <a onClick="return mV(\'Luk\',11,42);">Lu 11:42</a> as subject to tithe: in the parallel passage, <a onClick="return mV(\'Mat\',23,23);">Mt 23:23</a>, anise and cummin are mentioned. Ruta graveolens (Natural Order, Rutaceae) is the official rue, and a very similar species, R. chalepensis, is indigenous. Rue is a small shrub growing 2 to 4 ft. high with a heavy odor, disagreeable to Westerners, but a favorite with Orientals. A sprig of rue is often fixed on a child\'s cap or clothes as a kind of charm.``1';
isbe[7508]='Rufus`roo\'-fus (Rhouphos): The name is mentioned twice:<P>(1) Simon of Cyrene, who was compelled to bear the cross of Jesus, is "the father of Alexander and Rufus" (<a onClick="return mV(\'Mar\',15,21);">Mr 15:21</a>);<P>(2) Paul sends greetings to Roman Christians, "Rufus the chosen in the Lord, and his mother and mine" (<a onClick="return mV(\'Rom\',16,13);">Ro 16:13</a>).<P>Rufus was well known among those for whom Mark primarily wrote his Gospel, and according to tradition this was the Christian community at Rome. There seems no reason to doubt, therefore, that the Rufus of Mark and the Rufus of Paul are the same person. The name, meaning "red," "reddish," was, however, one of the commonest of slave names; the identification of these two is therefore merely a conjecture. The Rufus whom Paul greets is "the chosen in the Lord," i.e. "that choice Christian" (Denhey). Since all Christians are "chosen," this title must express some distinction. The mother of Rufus had played the mother\'s part to Paul on some occasion of which we are ignorant, hence the phrase "his mother and mine" (compare <a onClick="return mV(\'Mar\',10,30);">Mr 10:30</a>).``78';
isbe[7509]='Rug`rug: Alternative rendering of a word (semikhah) in <a onClick="return mV(\'Jdg\',4,18);">Jud 4:18</a> the Revised Version (British and American), "mantle" the King James Version. The translation is doubtful; Oxford Hebrew Lexicon; see Brown, Driver, and Briggs gives "rug or thick coverlet (?)."``1';
isbe[7510]='Ruhamah`roo-ha\'-ma, roo-ha\'-ma: See <a href="./study/isbe/search.html?string=LO-RUHAMAH">LO-RUHAMAH</a>, the symbolical name of Hosea\'s daughter (<a onClick="return mV(\'Hsa\',1,6,8);">Ho 1:6,8</a>).``1';
isbe[7511]='Ruin`roo\'-in (haricah, etc.; rhegma): "Ruin," the translation of haricah (<a onClick="return mV(\'Amo\',9,11);">Am 9:11</a>; compare <a onClick="return mV(\'Act\',15,16);">Ac 15:16</a>, where the Revised Version (British and American) Greek text, ta katestrammena), and of a number of other Hebrew words: in <a onClick="return mV(\'Luk\',6,49);">Lu 6:49</a> rhegma, "breakage," is used both in a literal sense (<a onClick="return mV(\'Isa\',23,13);">Isa 23:13</a>; <a onClick="return mV(\'Isa\',25,2);">25:2</a>, of fallen buildings; <a onClick="return mV(\'Eze\',27,27);">Eze 27:27</a>; <a onClick="return mV(\'Eze\',31,13);">31:13</a>, of a state or people; <a onClick="return mV(\'Luk\',6,49);">Lu 6:49</a>, of a house, etc.) and with a moral significance (<a onClick="return mV(\'Pro\',26,28);">Pr 26:28</a>). the Revised Version margin correctly renders mikhshol in <a onClick="return mV(\'Eze\',18,30);">Eze 18:30</a> "stumblingblock" (the King James Version "ruin"), and the Revised Version (British and American) in <a onClick="return mV(\'Eze\',21,15);">Eze 21:15</a> "stumblings" (the King James Version "ruins"). The Revised Version (British and American) has "ruins" for the King James Version "desolations" in <a onClick="return mV(\'Ezr\',9,9);">Ezr 9:9</a>, margin "waste places"; <a onClick="return mV(\'Psa\',74,3);">Ps 74:3</a>; "in their ruins" for "with their mattocks" (<a onClick="return mV(\'2Ch\',34,6);">2Ch 34:6</a>, margin "\' with their axes.\' The Hebrew is obscure"); "midst of the ruin" for "desolation" (<a onClick="return mV(\'Job\',30,14);">Job 30:14</a>); "their ruin" for "their wickedness" (<a onClick="return mV(\'Pro\',21,12);">Pr 21:12</a>). "Ruinous" is the translation of mappalah (<a onClick="return mV(\'Isa\',17,1);">Isa 17:1</a>) and of natsah (<a onClick="return mV(\'2Ki\',19,25);">2Ki 19:25</a>; <a onClick="return mV(\'Isa\',37,26);">Isa 37:26</a>).``185';
isbe[7512]='Ruler`rool\'-er:<P>1. In the Old Testament:<P>(1) moshel, "ruler," "prince," "master" (tyrant), applied to Joseph in Egypt (<a onClick="return mV(\'Gen\',45,8);">Ge 45:8</a>; compare <a onClick="return mV(\'Psa\',105,21);">Ps 105:21</a>); to the Philistines (<a onClick="return mV(\'Jdg\',15,11);">Jud 15:11</a>); to David\'s descendants, the future kings of Israel (<a onClick="return mV(\'2Ch\',7,18);">2Ch 7:18</a>; compare <a onClick="return mV(\'Jer\',33,26);">Jer 33:26</a>); to Pharaoh (<a onClick="return mV(\'Psa\',105,20);">Ps 105:20</a>); to a wicked prince, a tyrant (<a onClick="return mV(\'Pro\',28,15);">Pr 28:15</a>; compare <a onClick="return mV(\'Isa\',14,5);">Isa 14:5</a>; <a onClick="return mV(\'Isa\',49,7);">49:7</a>); to theocratic king, the Messiah (<a onClick="return mV(\'Mic\',5,2);">Mic 5:2</a>); it is often used in general (<a onClick="return mV(\'Pro\',6,7);">Pr 6:7</a>; <a onClick="return mV(\'Pro\',23,1);">23:1</a>; <a onClick="return mV(\'Pro\',29,12);">29:12</a>; <a onClick="return mV(\'Ecc\',10,4);">Ec 10:4</a>; <a onClick="return mV(\'Isa\',16,1);">Isa 16:1</a>, etc.).<P>(2) naghidh, "leader," "noble" (nobles), "prince." In a number of instances the Revised Version (British and American) renders it "prince," where the King James Version has ruler (<a onClick="return mV(\'1Sa\',25,30);">1Sa 25:30</a>; <a onClick="return mV(\'2Sa\',6,21);">2Sa 6:21</a>; <a onClick="return mV(\'1Ki\',1,35);">1Ki 1:35</a>, etc.). It is used of Azrikam having charge of the palace of King Ahaz (<a onClick="return mV(\'2Ch\',28,7);">2Ch 28:7</a>, "governor" of the house, the King James Version); of Azariah (Seraiah, <a onClick="return mV(\'Neh\',11,11);">Ne 11:11</a>), who is called the "ruler of the house of God" (<a onClick="return mV(\'1Ch\',9,11);">1Ch 9:11</a>; compare <a onClick="return mV(\'2Ch\',31,13);">2Ch 31:13</a>); he was the leader of a division or group of priests. In <a onClick="return mV(\'2Ch\',35,8);">2Ch 35:8</a> the names of three others are given (Hilkiah, Zechariah and Jehiel).<P>(3) nasi, "prince" (so <a onClick="return mV(\'Num\',13,2);">Nu 13:2</a>, the King James Version "ruler"); generally speaking, the nasi\' is one of the public authorities (<a onClick="return mV(\'Exd\',22,28);">Ex 22:28</a>); the rulers of the congregation (<a onClick="return mV(\'Exd\',16,22);">Ex 16:22</a>; compare <a onClick="return mV(\'Exd\',34,41);">34:31</A>); "The rulers brought the onyx stones" (<a onClick="return mV(\'Exd\',35,27);">Ex 35:27</a>), as it was to be expected from men of their social standing and financial ability: "when a ruler (the head of a tribe or tribal division) sinneth" (<a onClick="return mV(\'Lev\',4,22);">Le 4:22</a>).<P>(4) caghan, the representative of a king or a prince; a vice-regent; a governor; then, in the times of Ezra and Nehemiah, a leader or principal of the people of Jerusalem under the general supervision of these two men. The English Versions of the Bible renders it "ruler" (<a onClick="return mV(\'Eze\',23,12,23);">Eze 23:12,23</a>), "deputy" (<a onClick="return mV(\'Jer\',51,23,28,57);">Jer 51:23,28,57</a>), and, in most cases, "ruler" with "deputy" in margin (<a onClick="return mV(\'Ezr\',9,2);">Ezr 9:2</a>; <a onClick="return mV(\'Neh\',2,16);">Ne 2:16</a>; <a onClick="return mV(\'Neh\',4,14,19);">4:14,19</a>; <a onClick="return mV(\'Neh\',5,7,17);">5:7,17</a>; <a onClick="return mV(\'Neh\',7,5);">7:5</a>; <a onClick="return mV(\'Neh\',12,40);">12:40</a>; <a onClick="return mV(\'Neh\',13,11);">13:11</a>; <a onClick="return mV(\'Isa\',41,25);">Isa 41:25</a>; <a onClick="return mV(\'Eze\',23,6);">Eze 23:6</a>) always used in plural<P>(5) qatsin, "a judge" or "magistrate" (<a onClick="return mV(\'Isa\',1,10);">Isa 1:10</a>; <a onClick="return mV(\'Isa\',3,6);">3:6,7</a>; <a onClick="return mV(\'Isa\',22,3);">22:3</a>; <a onClick="return mV(\'Mic\',3,1,9);">Mic 3:1,9</a>); "a military chief" (<a onClick="return mV(\'Jos\',10,24);">Jos 10:24</a>).<P>(6) rodheh, one having dominion: "There is little Benjamin their ruler" (<a onClick="return mV(\'Psa\',68,27);">Ps 68:27</a>); the meaning is obscure; still we may point to the facts that Saul, the first one to conquer the heathen (<a onClick="return mV(\'1Sa\',14,47);">1Sa 14:47</a>f), came of this the smallest of all the tribes, and that within its boundaries the temple of Yahweh was erected.<P>(7) rozen, a "dignitary," a "prince." "The kings of the earth set themselves, and the rulers take counsel together, against Yahweh" (<a onClick="return mV(\'Psa\',2,2);">Ps 2:2</a>); in the New Testament the word is rendered archontes (<a onClick="return mV(\'Act\',4,26);">Ac 4:26</a>).<P>(8) sar, "chief," "head"; prince, king; a nobleman having judicial or other power; a royal officer. The Revised Version (British and American) renders it frequently "prince": "rulers over my cattle" ("head-shepherds," <a onClick="return mV(\'Gen\',47,6);">Ge 47:6</a>); "rulers of thousands, rulers of hundreds," etc. (<a onClick="return mV(\'Exd\',18,21);">Ex 18:21</a>); they had to be men of good character because they were endowed with judicial power (<a onClick="return mV(\'Exd\',18,22);">Ex 18:22</a>); in <a onClick="return mV(\'Deu\',1,15);">De 1:15</a> the rendering of English Versions of the Bible is captains," etc.; they were military leaders. "Zebul the ruler of the city" (of Shechem, <a onClick="return mV(\'Jdg\',9,30);">Jud 9:30</a>), meaning "governor" (compare <a onClick="return mV(\'1Ki\',22,26);">1Ki 22:26</a>; <a onClick="return mV(\'2Ki\',23,8);">2Ki 23:8</a>); "rulers (or captains; compare <a onClick="return mV(\'1Ki\',16,9);">1Ki 16:9</a>) of his (Solomon\'s) chariots" (<a onClick="return mV(\'1Ki\',9,22);">1Ki 9:22</a>); the rulers of Jezreel (<a onClick="return mV(\'2Ki\',10,1);">2Ki 10:1</a>) were, presumably, the ruler of the palace of the king and the ruler of the city of Samaria (compare <a onClick="return mV(\'2Ki\',10,5);">2Ki 10:5</a>). It is difficult to explain why they should be called the rulers of Jezreel; both Septuagint and Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) omit the word; "the rulers of the substance which was king David\'s" (<a onClick="return mV(\'1Ch\',27,31);">1Ch 27:31</a>) overseers of the royal domain; "The rulers were behind all the house of Judah" (<a onClick="return mV(\'Neh\',4,16);">Ne 4:16</a>), the officers were ready to assume active command in case of an attack.<P>(9), (10) shilton, "a commander," "an officer": "the rulers of the provinces" (<a onClick="return mV(\'Dan\',3,2);">Da 3:2</a>f); shallit, "a person in power," "a potentate" (<a onClick="return mV(\'Dan\',2,10);">Da 2:10</a>); there seems to be little doubt that the Aramaic term is used as an adjective (compare the Revised Version margin); in <a onClick="return mV(\'Dan\',5,7);">Da 5:7</a> occurs the verb shelat, "to have dominion," "he shall rule as the third in rank" (compare <a onClick="return mV(\'Dan\',5,16,29);">5:16,29</a>).<P>(11) maghen, "shield": "Her rulers (shields) dearly love shame" (<a onClick="return mV(\'Hsa\',4,18);">Ho 4:18</a>). Perhaps we ought to read (with Septuagint) migge\'onam, "their glory," and to translate it "they love shame more than their glory"; they would rather have a good (!) time than a good name.<P>2. In the Apocrypha:<P>(1) archon, used of the "rulers" of the Spartans (1Macc 14:20) and, in a general sense, of the priest Mattathias (1Macc 2:17). the King James Version has the word also in a general sense in Sirach 41:18 (the Revised Version (British and American) "mighty man").<P>(2) hegoumenos, "one leading the way." A quite general term, Sirach 10:2 (ruler of a city); 17:17 (of Gentile nations); 46:18 (of the Tyrians). Also 2:17 the King James Version (the Revised Version (British and American) "he that ruleth"), and Sirach 32:1 the Revised Version (British and American) ("ruler of a feast," the King James Version "master").<P>(3) hoi megistanes, a rare word found only in the plural, for "rulers of the congregation" (Sirach 33:18). The same word in <a onClick="return mV(\'Mar\',6,21);">Mr 6:21</a> is translated "lords."<P>(4) 2Macc 4:27 the King James Version for eparchos (the Revised Version (British and American) "governor").<P>(5) The King James Version inserts the word without Greek equivalent in 1Macc 6:14; 11:57; 2Macc 13:2.<P>3. In the New Testament:<P>(1) archon, "a person in authority," "a magistrate" "a judge," "a prince"; a councilor, a member of the supreme council of the Jews; a man of influence. "There came a ruler" (<a onClick="return mV(\'Mat\',9,18);">Mt 9:18</a>), meaning a ruler of the synagogue (compare <a onClick="return mV(\'Mar\',5,22);">Mr 5:22</a>; <a onClick="return mV(\'Luk\',8,41);">Lu 8:41</a>); see (2) below; "one of the rulers of the Pharisees" (<a onClick="return mV(\'Luk\',14,1);">Lu 14:1</a>), perhaps a member of the Jewish council belonging, at the same time, to the Pharisees, or, more probably, one of the leading Pharisees; "the chief priests and the rulers" (<a onClick="return mV(\'Luk\',23,13,15);">Lu 23:13,15</a>; <a onClick="return mV(\'Luk\',24,20);">24:20</a>; compare <a onClick="return mV(\'Jhn\',3,1);">Joh 3:1</a>; <a onClick="return mV(\'Jhn\',7,26,48);">7:26,48</a>; <a onClick="return mV(\'Jhn\',12,42);">12:42</a>; <a onClick="return mV(\'Act\',3,17);">Ac 3:17</a>; <a onClick="return mV(\'Act\',4,5,8);">4:5,8</a>; <a onClick="return mV(\'Act\',13,27);">13:27</a>; <a onClick="return mV(\'Act\',14,5);">14:5</a>); the rulers were, with the chief priests and the scribes, members of the Sanhedrin, either of two councils of the Jews (the Great and the Lesser); they were lay-members (elders); "before the rulers" (<a onClick="return mV(\'Act\',16,19);">Ac 16:19</a>), the police magistrates (praetores, "praetors") of the city of Philippi; "Thou shalt not speak evil of a ruler of thy people" (<a onClick="return mV(\'Act\',23,5);">Ac 23:5</a>; compare <a onClick="return mV(\'Exd\',22,28);">Ex 22:28</a>, nasi\'; see 1, (3) above), a magistrate, a person in authority (compare <a onClick="return mV(\'Act\',7,27,35);">Ac 7:27,35</a>; <a onClick="return mV(\'Rom\',13,3);">Ro 13:3</a>, the public authorities); "the rulers of this world" (<a onClick="return mV(\'1Cr\',2,6,8);">1Co 2:6,8</a>), persons being mentally superior to their fellow-men, and so having great influence in shaping their opinions and directing their actions.<P>(2) archisundgogos, "ruler of the synagogue." He was the presiding officer of a board of elders, who had charge of the synagogue. Sometimes they, also, were given the same name (compare "one of the rulers of the synagogue," <a onClick="return mV(\'Mar\',5,22,35);">Mr 5:22,35</a>; <a onClick="return mV(\'Luk\',8,41,49);">Lu 8:41,49</a>; in <a onClick="return mV(\'Mat\',9,18);">Mt 9:18</a> Jairus is simply called archon); the ruler mentioned in <a onClick="return mV(\'Luk\',13,14);">Lu 13:14</a> was, of course, the president of the board (compare <a onClick="return mV(\'Act\',18,17);">Ac 18:17</a>, Sosthenes), while in <a onClick="return mV(\'Act\',13,15);">Ac 13:15</a> the phrase "rulers of the synagogue" simply signifies the board. It was a deliberative body, but at the same time responsible for the maintenance of good order in the synagogue and the orthodoxy of its members; having, therefore, disciplinary power, they were authorized to reprimand, and even to excommunicate, the guilty ones (compare <a onClick="return mV(\'Jhn\',9,22);">Joh 9:22</a>; <a onClick="return mV(\'Jhn\',12,42);">12:42</a>; <a onClick="return mV(\'Jhn\',16,2);">16:2</a>).<P>(3) architriklinos, the ruler ("<A href="./study/isbe/search.html?string=STEWARD">steward</a>," the Revised Version margin) of the feast (<a onClick="return mV(\'Jhn\',2,8,9);">Joh 2:8,9</a>). See separate article.<P>(4) kosmokrator, a "world-ruler" (<a onClick="return mV(\'Eph\',6,12);">Eph 6:12</a>). The angels of the devil (<a onClick="return mV(\'Mat\',25,41);">Mt 25:41</a>; <a onClick="return mV(\'Mat\',12,45);">12:45</a>) or Satan, the prince of this world (<a onClick="return mV(\'Jhn\',12,31);">Joh 12:31</a>), participate in his power; they are his tools, their sphere of action being "this darkness," i.e. the morally corrupt state of our present existence.<P>(5) politarches; the prefect of a city (<a onClick="return mV(\'Act\',17,6,8);">Ac 17:6,8</a>). Luke being the only one of the Biblical authors to hand down to us this word, it is a noteworthy fact that, in relatively modern times, a Greek inscription Was discovered containing this very word and, moreover, having reference to the city of Thessalonica (AJT, 1898, II, 598-643). Here it was where Paul and Silas preached the gospel so successfully that the Jews, "being moved with jealousy," caused Jason and certain brethren to be dragged before the rulers of the city (epi tous politarchas). These magistrates suffered themselves to be made the tools of the unscrupulous Jews by demanding and getting security from Jason and the rest.``8';
isbe[7513]='Ruler of the Feast`(architriklinos; the King James Version governor): The word occurs in the New Testament in the account of the wedding feast in Cana of Galilee (<a onClick="return mV(\'Jhn\',2,8,9);">Joh 2:8,9</a>). According to Ecclesiasticus (32:1) it was customary to appoint a "master of the ceremonies" from among the invited guests. It was his duty to determine the places of the guests, to see that the ordinary rules of etiquette were observed, etc., and generally to supervise the arrangements. The Revised Version margin "steward" is possible if the "governor of the feast" meant the "head waiter" (Merx renders "head servant of the feast"), and not one of the guests appointed for the purpose. But the context is in favor of the view that the person in question was one of the prominent guests—an intimate friend or relative of the host.`<a href="./study/isbe/search.html?string=RULER">RULER</a>`103';
isbe[7514]='Ruler of the Synagogue``<a href="./study/isbe/search.html?string=RULER">RULER</a>`1';
isbe[7515]='Rulers of the City``<a href="./study/isbe/search.html?string=RULER">RULER</a>`1';
isbe[7516]='Rumah`roo\'-ma (rumah; Codex Vaticanus Rhouma; Codex Alexandrinus Rhuma): To this place belonged Pedaiah whose daughter Zebudah (the Revised Version (British and American) "Zebidah") entered the harem of Josiah, king of Judah, and became the mother of Jehoiakim (<a onClick="return mV(\'2Ki\',23,36);">2Ki 23:36</a>). Josephus (Ant., X, v, 2) calls the place Abouma, but this is an obvious clerical error for Arouma. This suggests a possible identification with Arumah (<a onClick="return mV(\'Jdg\',9,41);">Jud 9:41</a>), which lay not far from Shechem. Another possible identification is with the Rumah mentioned by Josephus (BJ, III, vii, 21) in Galilee (compare Neubauer, Geog. du Talmud, 203), which may be identical with the modern Khirbet Rumeh, about 3 miles north of Seffuriyeh. Some, however, would identify Rumah with Dumah of <a onClick="return mV(\'Jos\',15,52);">Jos 15:52</a>, where the substitution of "r" for "d" is supported by the Septuagint (Rheuma), possibly represented by the modern Domeh, about 13 miles Southeast of Beit Jibrin. This of course was in the territory of Judah, and no question of jus connubium is involved, such as might arise in the case of a Galilean site.``54';
isbe[7517]='Rump`rump: the King James Version uses this word as translation of \'alyah (<a onClick="return mV(\'Exd\',29,22);">Ex 29:22</a>; <a onClick="return mV(\'Lev\',3,9);">Le 3:9</a>; <a onClick="return mV(\'Lev\',7,3);">7:3</a>; <a onClick="return mV(\'Lev\',8,25);">8:25</a>; <a onClick="return mV(\'Lev\',9,19);">9:19</a>), where the Revised Version (British and American) correctly renders "fat tail." Reference is here had to the broad tail of the Syrian sheep, which occasionally weighs as much as 20 lbs., and is considered one of the daintiest portions of mutton. It was one of those portions of the peace and trespass offering which were not eaten by the priest or the sacrificer, but which with other choice portions were waved before the Lord and wholly burnt on the altar as a sweet savor unto Yahweh.``1';
isbe[7518]='Runagate`run\'-a-gat: A runaway: "The runagates continue in scarceness" (<a onClick="return mV(\'Psa\',68,6);">Ps 68:6</a>, Prayer Book Version, the Revised Version (British and American) "The rebellious dwell in a parched land").``1';
isbe[7519]='Runner`run\'-er.`<a href="./study/isbe/search.html?string=GAMES">GAMES</a>`1';
isbe[7520]='Rush`(1) (gome\'; papuros, "bulrushes," margin "papyrus" (<a onClick="return mV(\'Exd\',2,3);">Ex 2:3</a>); "rush," margin "papyrus" (<a onClick="return mV(\'Job\',8,11);">Job 8:11</a>); "papyrus," the King James Version "rush" (<a onClick="return mV(\'Isa\',18,2);">Isa 18:2</a>); "rushes" (<a onClick="return mV(\'Isa\',35,7);">Isa 35:7</a>)): This is almost certainly the famous papyrus, Cyperus papyrus (Natural Order, Cyperaceae), known in Arabic as babir (whence comes our word "paper"). This plant, the finest of the sedges, flourishes plentifully in Upper Egypt; in Palestine there is a great mass of it growing in the marsh to the north of Lake Huleh, and it also occurs on the Lake of Galilee and the Jordan. Light boats of plaited papyrus have been used on the Nile from ancient times and are mentioned by many writers (compare <a onClick="return mV(\'Exd\',2,3);">Ex 2:3</a>; <a onClick="return mV(\'Isa\',18,2);">Isa 18:2</a>).<P>(2) (\'aghmon, "rope," margin "Hebrew \'a rope of rushes,\' " the King James Version "hook" (<a onClick="return mV(\'Job\',41,2);">Job 41:2</a>): "(burning) rushes," the King James Version "caldron" (<a onClick="return mV(\'Job\',41,20);">Job 41:20</a>); "rush," the King James Version "bulrush" (<a onClick="return mV(\'Isa\',58,5);">Isa 58:5</a>); "rush" in <a onClick="return mV(\'Isa\',9,14);">Isa 9:14</a>; <a onClick="return mV(\'Isa\',19,15);">19:15</a>, used of the humble and lowly folk as contrasted with the "palm branch," the highest class): The word \'aghmon comes from \'agham, meaning a marsh (see <a href="./study/isbe/search.html?string=POOL">POOL</a>), being transferred from the place of the things growing there. The word doubtless includes not only the rushes—of which there are several kinds in Palestine—but also members of the sedge family, the Cyperaceae.`<a href="./study/isbe/search.html?string=REED">REED</a>`117';
isbe[7521]='Rust`rust (chel\'ah; brosis): Strictly speaking rust is the red oxide of iron formed by the corrosion of that metal, but by extension it has come to mean corrosion produced on any metal. Chel\'ah is translated "rust" in <a onClick="return mV(\'Eze\',24,11,12);">Eze 24:11,12</a>. This rendering is probably based on <a onClick="return mV(\'Eze\',24,11);">24:11</a>. Copper caldrons are still used in Bible lands. Such vessels must be constantly watched when on the fire to guard against the possibility of their becoming dry. If this should happen the contents, whatever they may be, and the vessel itself will be injured. The copper of the caldron oxidizes and scales off in black or brownish scales, or rust. ios, was used in Greek to denote the corroding of metals. In <a onClick="return mV(\'Jam\',5,3);">Jas 5:3</a> occurs, "Your gold and your silver are rusted; and their rust...shall eat your flesh as fire." The writers must have had in mind the actions of chemicals upon these metals which formed some such compound as the caustic silver nitrate.<P>Brosis, literally, "eating," which occurs in <a onClick="return mV(\'Mat\',6,19,20);">Mt 6:19,20</a>, may refer to the diseases which attack such vegetation as wheat, grapes, cucumbers, etc. In no country is the saying "where moth and rust consume" (<a onClick="return mV(\'Mat\',6,19);">Mt 6:19</a>) more true than in Syria. Any metal subject to corrosion seems to rust faster in that country than anywhere else. There are also many rusting fungi which the people have not learned to destroy and which do much damage to the crops.`<a href="./study/isbe/search.html?string=SCUM">SCUM</a>`133';
isbe[7522]='Ruth`rooth (ruth; Rhouth): The name Ruth is found in the Old Testament only in the book which is so entitled. It is a contraction for re\'uth perhaps signifying "comrade," "companion" (feminine; compare <a onClick="return mV(\'Exd\',11,2);">Ex 11:2</a>, "every woman of her neighbor"). OHL, 946, explains the word as an abstract noun = "friendship." The Book of Ruth details the history of the one decisive episode owing to which Ruth became an ancestress of David and of the royal house of Judah. From this point of view its peculiar interest lies in the close friendship or alliance between Israel and Moab, which rendered such a connection possible. Not improbably also there is an allusion to this in the name itself.<P>1. History:<P>The history lies in the period of the Judges (<a onClick="return mV(\'Rth\',1,1);">Ru 1:1</a>), at the close of a great famine in the land of Israel. Elimelech, a native of Bethlehem, had, with his wife Naomi and two sons, taken refuge in Moab from the famine. There, after an interval of time which is not more precisely defined, he died (<a onClick="return mV(\'Rth\',1,3);">Ru 1:3</a>), and his two sons, having married women of Moab, in the course of a further ten years also died, and left Orpah and Ruth widows (<a onClick="return mV(\'Rth\',1,5);">Ru 1:5</a>). Naomi then decided to return to Palestine, and her two daughters-in-law accompanied her on her way (<a onClick="return mV(\'Rth\',1,7);">Ru 1:7</a>). Orpah, however, turned back and only Ruth remained with Naomi, journeying with her to Bethlehem, where they arrived "in the beginning of barley harvest" (<a onClick="return mV(\'Rth\',1,22);">Ru 1:22</a>). The piety and fidelity of Ruth are thus early exhibited in the course of the narrative, in that she refused to abandon her mother-in-law, although thrice exhorted to do so by Naomi herself, on account of her own great age and the better prospects for Ruth in her own country. Orpah yielded to persuasion, and returned to Moab; but Ruth remained with Naomi.<P>At Bethlehem Ruth employed herself in gleaning in the field during the harvest and was noticed by Boaz, the owner of the field, a near kinsman of her father-in-law Elimelech. Boaz gave her permission to glean as long as the harvest continued; and told her that he had heard of her filial conduct toward her mother-in-law. Moreover, he directed the reapers to make intentional provision for her by dropping in her way grain from their bundles (<a onClick="return mV(\'Rth\',2,15);">Ru 2:15</a>f). She was thus able to return to Naomi in the evening with a whole ephah of barley (<a onClick="return mV(\'Rth\',2,17);">Ru 2:17</a>). In answer to questioning she explained that her success in gleaning was due to the good-will of Boaz, and the orders that he had given. She remained accordingly and gleaned with his maidens throughout the barley and wheat harvest, making her home with her mother-in-law (<a onClick="return mV(\'Rth\',2,23);">Ru 2:23</a>). Naomi was anxious for the remarriage of Ruth, both for her sake and to secure compliance with the usage and law of Israel; and sent her to Boaz to recall to him his duty as near kinsman of her late husband Elimelech (<a onClick="return mV(\'Rth\',3,1);">Ru 3:1</a>f). Boaz acknowledged the claim and promised to take Ruth in marriage, failing fulfillment of the legal duty of another whose relationship was nearer than that of Boaz himself (<a onClick="return mV(\'Rth\',3,\'8-13\');">Ru 3:8-13</a>). Naomi was confident that Boaz would fulfill his promise, and advised Ruth to wait in patience.<P>Boaz then adopted the customary and legal measures to obtain a decision. He summoned the near kinsman before ten elders at the gate of the city, related to him the circumstances of Naomi\'s return, with her desire that Ruth should be married and settled with her father-in-law\'s land as her marriage-portion, and called upon him to declare his intentions. The near kinsman, whose name and degree of relationship are not stated, declared his inability to undertake the charge, which he renounced in legal form in favor of Boaz according to ancient custom in Israel (<a onClick="return mV(\'Rth\',4,6);">Ru 4:6</a>). Boaz accepted the charge thus transferred to him, the elders and bystanders bearing witness and pronouncing a formal blessing upon the union of Boaz and Ruth (<a onClick="return mV(\'Rth\',4,\'9-12\');">4:9-12</A>). Upon the birth of a son in due course the women of the city congratulated Naomi, in that the continuance of her family and house was now assured, and the latter became the child\'s nurse. The name of Obed was given to the boy; and Obed through his son Jesse became the grandfather of David (compare <a onClick="return mV(\'Mat\',1,5,6);">Mt 1:5,6</a>; <a onClick="return mV(\'Luk\',3,31,32);">Lu 3:31,32</a>).<P>2. Interest and Importance of the Narrative:<P>Thus, the life and history of Ruth are important in the eyes of the narrator because she forms a link in the ancestry of the greatest king of Israel. From a more modern point of view the narrative is a simple idyllic history, showing how the faithful loving service of Ruth to her mother-in-law met with its due reward in the restored happiness of a peaceful and prosperous home-life for herself. Incidentally are illustrated also ancient marriage customs of Israel, which in the time of the writer had long since become obsolete. The narrative is brief and told without affectation of style, and on that account will never lose its interest. It has preserved moreover the memory of an incident, the national significance of which may have passed away, but to which value will always be attached for its simplicity and natural grace.`<a href="./study/isbe/search.html?string=RUTH,+THE+BOOK+OF">RUTH, THE BOOK OF</a>`65';
isbe[7523]='Ruth, the Book of`1. Order in the Canon:<P>The place which the Book of Ruth occupies in the order of the books of the English Bible is not that of the Hebrew Canon. There it is one of the five meghilloth or Rolls, which were ordered to be read in the synagogue on 5 special occasions or festivals during the year.<P>In printed editions of the Old Testament the megilloth are usually arranged in the order: Canticles, Ruth, Lamentations, Ecclesiates, Esther. Ruth occupied the second position because the book was appointed to be read at the Feast of Weeks which was the second of the 5 special days. In Hebrew manuscripts, however, the order varies considerably. In Spanish manuscripts generally, and in one at least of the German school cited by Dr. Ginsburg (Introduction to the Hebrew Bible, London,1897,4), Ruth precedes Canticles; and in the former Ecclesiastes is placed before Lamentations. The meghilloth constitute the second portion of the kethubhim or Haigographa, the third great division of the books of the Hebrew Scriptures. The Talmud, however, dissociates Ruth altogether from the remaining meghilloth, and places it first among the Hagiographa, before the Book of Psalms. By the Greek translators the book was removed from the position which it held in the Hebrew Canon, and because it described events contemporaneous with the Judges, was attached as a kind of appendix to the latter work. This sequence was adopted in the Vulgate, and so has passed into all modern Bibles.<P>2. Authorship and Purpose:<P>The book is written without name of author, and there is no direct indication of its date. Its aim is to record an event of interest and importance in the family history of David, and incidentally to illustrate ancient custom and marriage law. There is no ground for supposing, as has been suggested, that the writer had a polemical purpose in view, and desired to show that the strict and stern action taken by Ezra and Nehemiah after the return in forbidding mixed marriages was not justifled by precedent. The narrative is simple and direct, and the preservation of the tradition which it records of the descent of Israel\'s royal house from a Moabite ancestress was probably due in the first instance to oral communication for some considerable time before it was committed to writing. The Book of 1 Samuel also indicates a close relation between David and Moab, when during the period of his outlawry the future king confided his father and mother to the care of the king of Moab (<a onClick="return mV(\'1Sa\',22,3);">1Sa 22:3</a>f), and so far supports the truth of the tradition which is embodied in the Book of Ruth.<P>3. Date of Composition:<P>With regard to the date at which the narrative was committed to writing, it is evident from the position of the Book of Ruth in the Hebrew Canon that the date of its composition is subsequent to the close of the great period of the "earlier prophets." Otherwise it would have found a natural place, as was assigned to it in the Greek Bible, together with the Book of Judges and other historical writings, in the second division of the Hebrew Scriptures. In the opening words of the book also, "It came to pass in the days when the judges judged" (<a onClick="return mV(\'Rth\',1,1);">Ru 1:1</a>), the writer appears to look back to the period of the Judges as to a comparatively distant epoch. The character of the diction is pure and chaste; but has been supposed in certain details, as in the presence of so-called Aramaisms, to betray a late origin. The reference to the observance of marriage customs and their sanctions "in former time in Israel" (<a onClick="return mV(\'Rth\',4,7);">Ru 4:7</a>) does not necessarily imply that the composition of Ruth was later than that of Deuteronomy, in which the laws arid rights of the succession are enjoined, or that the writer of the former work was acquainted with the latter in its existing form. Slight differences of detail in the procedure would seem to suggest the contrary. On the other hand, the motive of the book in the exhibition of the ancestry of David\'s house would have lost its significance and raison d\'etre with the death or disappearance of the last ruler of David\'s line in the early period of the return from Babylon (compare <a onClick="return mV(\'Zec\',4,9);">Zec 4:9</a>). The most probable date therefore for the composition of the book would be in the later days of the exile, or immediately after the return. There is no clue to the authorship. The last four verses, giving the genealogy from Perez to David (compare <a onClick="return mV(\'1Ch\',2,\'4-15\');">1Ch 2:4-15</a>; <a onClick="return mV(\'Mat\',1,\'3-6\');">Mt 1:3-6</a>; <a onClick="return mV(\'Luk\',3,\'31-33\');">Lu 3:31-33</a>), are generally recognized as a later addition.<P>4. Ethical Teaching:<P>The ethical value of the Book of Ruth is considerable, as setting forth an example of stedfast filial piety. The action of Ruth in refusing to desert her mother-in-law and persevering in accompanying her to her own land meets with its due reward in the prosperity and happiness which become hers, and in the honor which she receives as ancestress of the royal house of David. The writer desires to show in the person and example of Ruth that a sincere and generous regard for the claims of duty and affection leads to prosperity and honor; and at the same time that the principles and recompense of righteous dealing are not dependent upon race, but are as valid for a Moabitess as for a Jew. There is no distinctive doctrine taught in the book. It is primarily historical, recording a decisive incident in the origin of David\'s house; and in the second place ethical, indicating and enforcing in a well-known example the advantage and importance of right dealing and the observance of the dictates of filial duty. For detailed contents see preceding article.<P>LITERATURE. English commentaries upon the Book of Ruth are naturally not numerous. Compare G. W. Thatcher, "Judges and Ruth," in (New) Century Bible; R.A. Watson, in Expositor\'s Bible; the most recent critical commentary. is by L. B. Wolfenson in AJSL, XXVII (July, 1911), 285ff, who defends the early date of the book. See also the relevant articles in Jewish Encyclopedia, HDB, EB, and Driver, LOT,6,454ff.``65';

isbe[7525]='Sabachthani`sat-bak\'-tha-ne.`<a href="./study/isbe/search.html?string=ELI,+ELI,+LAMA,+SABACHTHANI">ELI, ELI, LAMA, SABACHTHANI</a>`1';
isbe[7526]='Sabaco; Sabakon`sab\'-a-ko, sab\'-a-kon.`<a href="./study/isbe/search.html?string=SO">SO</a>`1';
isbe[7527]='Sabaeans`sa-be\'-anz (shebha\'im (<a onClick="return mV(\'Joe\',3,8);">Joe 3:8</a> the King James Version), cebha\'-im; Sabaeim, Sebaeim (<a onClick="return mV(\'Isa\',45,14);">Isa 45:14</a>); read cabha\'im, but rendered as though from cabha\', "to imbibe," hence, "drunkards"; oinomenoi, "wine-drunken" (<a onClick="return mV(\'Eze\',23,42);">Eze 23:42</a> the King James Version)):<P>1. Forms of the Word:<P>"Sabaeans" is also the translation of the name of the country itself (shebha\') in <a onClick="return mV(\'Job\',1,15);">Job 1:15</a>; <a onClick="return mV(\'Job\',6,19);">6:19</a>. This last, which is the root of shebha\'im, is regarded by Arabists as coming from that root with the meaning of "to take captive," though seba\'a, "he raided" (compare <a onClick="return mV(\'Job\',1,15);">Job 1:15</a>), has also been suggested.<P>2. Two Different Races:<P>As Sheba is said in <a onClick="return mV(\'Gen\',10,7);">Ge 10:7</a>; <a onClick="return mV(\'Gen\',10,28);">10:28</a>; and <a onClick="return mV(\'Gen\',25,3);">25:3</A> respectively to have been<P>(1) a son of Raamah, the 4th son of Cush;<P>(2) the 10th son of Joktan, son of Eber;<P>(3) the 1st son of Jokshan, 2nd son of Abraham and Keturah, at least two nationalities of this name are implied. The former were identified by Josephus (Ant., II, x, 2) with the tall people of Saba in Upper Egypt, described by him as a city of Ethiopia, which Moses, when in the service of the Egyptians, besieged and captured.<P>3. Semitic Sabeans and Their Commerce:<P>It is the Semitic Sabeans, however, who are the best known, and the two genealogies attributed to them (Joktan-Eber and Jokshan-Abraham) seem to imply two settlements in the land regarded as that of their origin. As Ezekiel (<a onClick="return mV(\'Eze\',27,23);">27:23</a>) mentions Haran (Hirran), Canneh (Kannah), and Eden (Aden) as being connected with Sheba, and these three places are known to have been in Southern Arabia, their Semitic parentage is undoubted. The Sabeans are described as being exporters of gold (<a onClick="return mV(\'Isa\',60,6);">Isa 60:6</a>; <a onClick="return mV(\'Psa\',72,15);">Ps 72:15</a>), precious stones (<a onClick="return mV(\'Eze\',27,23);">Eze 27:23</a>), perfumes (<a onClick="return mV(\'Jer\',6,20);">Jer 6:20</a>; Isaiah and Ezekiel), and if the rendering "Sabaeans" for <a onClick="return mV(\'Joe\',3,8);">Joe 3 (4):8</a> be correct, the Sebaim, "a nation far off," dealt in slaves.`<a href="./study/isbe/search.html?string=SEBA">SEBA</a>; <a href="./study/isbe/search.html?string=SHEBA">SHEBA</a>; <a href="./study/isbe/search.html?string=TABLE+OF+NATIONS">TABLE OF NATIONS</a>`136';
isbe[7528]='Sabanneus`sab-a-ne\'-us (Codex Vaticanus Sabannaious; Codex Alexandrinus Bannaious; the King James Version Bannaia, following the Aldine): One of the sons of Asom who had married strange wives (1Esdras 9:33) = "Zabad" in <a onClick="return mV(\'Ezr\',10,33);">Ezr 10:33</a>.``1';
isbe[7529]='Sabannus`sa-ban\'-nus (Sabannos; the King James Version Sabban): The father of Moeth, one of the Levites to whom the silver and gold were delivered (1Esdras 8:63). "Moeth the son of Sabannus" stands in the position of "Noadiah the son of Binnui," in <a onClick="return mV(\'Ezr\',8,33);">Ezr 8:33</a>.``1';

isbe[7532]='Sabateus`sab-a-te\'-us (Codex Alexandrinus Sabbataias; Codex Vaticanus Abtaios; the King James Version Sabateas): One of the Levites who "taught the law of the Lord" to the multitude (1Esdras 9:48) = "Shabbethai" in <a onClick="return mV(\'Neh\',8,7);">Ne 8:7</a>.``1';
isbe[7533]='Sabathus`sab\'-a-thus (Sabathos; the King James Version Sabatus): An Israelite who put away his "strange wife" (1Esdras 9:28) = "Zabad" in <a onClick="return mV(\'Ezr\',10,27);">Ezr 10:27</a>.``1';
