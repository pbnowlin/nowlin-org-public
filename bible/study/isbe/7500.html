fferings with incense triennially (<a onClick="return mV(\'1Ki\',9,25);">1Ki 9:25</a>). The ritual at the regular seasons, daily, sabbaths, new moons, set feasts, etc., was observed according to the Levitical Law (<a onClick="return mV(\'2Ch\',2,4);">2Ch 2:4</a>; <a onClick="return mV(\'2Ch\',8,13);">8:13</a>). Was it written?<P>6. In the Northern Kingdom:<P>The golden calf worship was carried on at Dan and Beth-el, with priests, altars and ritual (<a onClick="return mV(\'1Ki\',12,27);">1Ki 12:27</a>f). The high places were in use, but very corrupt (<a onClick="return mV(\'1Ki\',13,2);">1Ki 13:2</a>). A common altar was in use on Mt. Carmel (<a onClick="return mV(\'1Ki\',18,30,32);">1Ki 18:30,32</a>). Many others were known as Yahweh\'s altars (<a onClick="return mV(\'1Ki\',19,10);">1Ki 19:10</a>). The system was in full swing in Amos\' time (<a onClick="return mV(\'Amo\',4,4,5);">Am 4:4,5</a>) at Beth-el and Gilgal and probably at Beer-sheba (<a onClick="return mV(\'Amo\',5,5);">Am 5:5</a>). Amos bitterly satirizes the hollow, insincere worship, but does not condemn the common altars and sacrifices, as these were legitimate. With Hosea the situation is worse, the cult has been "canonized," priests have been fed on the sin or sin offerings of the people, and the kingdom soon perished because of its corruption.<P>The high places were still in use and not denounced yet by the prophets (<a onClick="return mV(\'1Ki\',3,2);">1Ki 3:2</a>; <a onClick="return mV(\'2Ki\',14,4);">2Ki 14:4</a>; <a onClick="return mV(\'2Ki\',15,4,35);">15:4,35</a>). Worship was not fully centralized, though tending in that direction. In the days of Abijah the temple cult was in full operation according to Moses\' Law (<a onClick="return mV(\'2Ch\',13,10);">2Ch 13:10</a>f). Asa removed many strange altars and high places because of their corruption (<a onClick="return mV(\'2Ch\',14,3);">2Ch 14:3</a>), but not all (<a onClick="return mV(\'2Ch\',15,17);">2Ch 15:17</a>; <a onClick="return mV(\'2Ch\',20,33);">20:33</a>).<P>7. In the Southern Kingdom to the Exile:<P>In the days of Jehoiada priests and Levites were on duty according to Moses (<a onClick="return mV(\'2Ch\',23,18);">2Ch 23:18</a>; <a onClick="return mV(\'2Ch\',24,14);">24:14</a>; <a onClick="return mV(\'2Ki\',12,\'4-16\');">2Ki 12:4-16</a>). Sin and guilt offerings were in sufficient numbers to be mentioned, but the money went to the priests. Kautzsch (HDB, V) and Paterson (HDB, IV), with others, think these offerings were only fines and altogether different from those of <a onClick="return mV(\'Lev\',4,\'1-\');">Le 4</a>; <a onClick="return mV(\'Lev\',5,\'1-\');">5</a>. Such a statement is wholly gratuitous. The guilt offerings must be accompanied by fines, but not necessarily the sin offerings. The passage speaks of both as perfectly familiar and of long standing, but details are lacking and there can be no certainty in the matter, except that it proves nothing regarding a ritual of sin and guilt offerings existent or non-existent at that time. Kautzsch\'s and Paterson\'s motives are obvious. Having reversed the history and put the ritual law late, they must needs make adjustments in the records to have them agree. In the days of Ahaz, the regular offerings were observed for priests, kings and people (<a onClick="return mV(\'2Ki\',16,\'13-15\');">2Ki 16:13-15</a>). Hezekiah destroyed many high places (<a onClick="return mV(\'2Ki\',18,4);">2Ki 18:4</a>). When repairing the temple, many sin offerings were presented to expiate the terrible sins of the previous reigns and the desecration of the temple (<a onClick="return mV(\'2Ch\',29,\'21-24\');">2Ch 29:21-24</a>); and so, also, burnt offerings (<a onClick="return mV(\'2Ch\',29,27);">2Ch 29:27</a>f), peace offerings and thank offerings, etc., in large number (<a onClick="return mV(\'2Ch\',29,\'31-35\');">2Ch 29:31-35</a>; compare <a onClick="return mV(\'Isa\',1,\'10-17\');">Isa 1:10-17</a>). The Passover was celebrated with peace offerings (<a onClick="return mV(\'2Ch\',30,1,2,15,22);">2Ch 30:1,2,15,22</a>), oblations and tithes (<a onClick="return mV(\'2Ch\',31,12);">2Ch 31:12</a>); courses of Levites were established (<a onClick="return mV(\'2Ch\',31,2);">2Ch 31:2</a>), and the king\'s portion (<a onClick="return mV(\'2Ch\',31,3);">2Ch 31:3</a>). All the common altars were abolished as far as possible, and worship centralized in Jerusalem (<a onClick="return mV(\'2Ch\',32,12);">2Ch 32:12</a>). Reversed by Manasseh (<a onClick="return mV(\'2Ch\',33,3);">2Ch 33:3</a>f), the high places were again used (<a onClick="return mV(\'2Ch\',33,17);">2Ch 33:17</a>). Josiah purged Jerusalem (<a onClick="return mV(\'2Ch\',34,3);">2Ch 34:3</a>), and on the discovery of the Book of the Law, with its rule regarding a central sanctuary, that law was rigidly enforced (<a onClick="return mV(\'2Ch\',35,\'6-14\');">2Ch 35:6-14</a>). The reformation under Josiah did not change the hearts of the people, and the rule followed in spite of all the efforts of Jeremiah and other prophets.<P>8. In the Exilic and Post-exilic Periods:<P>That the cult was entirely suspended in Jerusalem from 586 to 536 BC seems certain. There is no support for G. F. Moore\'s statement (EB, IV) that an altar was soon rebuilt and sacrificing was carried on with scarcely a break. On the return of the exiles an altar was soon built and the continual burnt offerings began (<a onClick="return mV(\'Ezr\',3,2);">Ezr 3:2</a>f), and likewise at the Feast of Tabernacles, new moons and set feasts (<a onClick="return mV(\'Ezr\',3,\'4-7\');">Ezr 3:4-7</a>). Darius decreed that the Israelites should be given what was needed for the sacrifices (<a onClick="return mV(\'Ezr\',6,9);">Ezr 6:9</a>f). The band under Ezra offered many sin offerings on their return (<a onClick="return mV(\'Ezr\',8,35);">8:35</a>). At the dedication of the temple many burnt and sin offerings were made for all the tribes (<a onClick="return mV(\'Ezr\',6,17);">6:17</a>). Those who had married foreign wives offered guilt offerings (<a onClick="return mV(\'Ezr\',10,19);">10:19</A>). The firman of Artaxerxes provided money for bullocks, rams, lambs, with meal offerings and drink offerings (<a onClick="return mV(\'Ezr\',7,17);">7:17</A>). Under Nehemiah and after the formal acceptance of the Law, a more complete effort was made to observe it. The shewbread, continual burnt and meal offerings, sabbaths, new moons, set feasts, sin offerings, first-fruits, firstlings, first-fruits of dough, heave offerings of all trees, wine and oil, etc., were carefully attended to (<a onClick="return mV(\'Neh\',10,\'33-37\');">Ne 10:33-37</a>) and were in full force later (<a onClick="return mV(\'Neh\',13,5,9);">Ne 13:5,9</a>). There is no hint of innovation, only a thoroughgoing attempt to observe laws that had been somewhat neglected.<P>9. A Temple and Sacrifices at Elephantine:<P>At the time of Nehemiah and probably two or three centuries previous, there existed a temple on the island of Elephantine in the Nile. It was built by a Jewish military colony, and a system of sacrifices was observed. Just how far they copied the laws of Moses, and what were their ideas of a central sanctuary are uncertain.<P>Several Semitic tribes or nations practiced human sacrifices. It was common among the Canaanites, as is shown by the excavations at Gezer, Taanach, etc. They seemed to offer children in sacrifice at the laying of cornerstones of houses and other such occasions.<P>10. Human Sacrifices in Israel\'s History:<P>Among the Carthaginians, Phoenicians, Greeks, and Romans human sacrifices were all too common. The custom was not unknown to the Israelites. Abraham felt called upon to offer up Isaac, but was stopped in the act, and a lesson was given for all time. The abominable practice is forbidden by Moses (<a onClick="return mV(\'Lev\',18,21);">Le 18:21</a>), where it is spoken of as a passing through the fire to Moloch, referring to Moabite and Ammonitish practices. Anyone practicing it was to be stoned (<a onClick="return mV(\'Lev\',20,\'2-5\');">Le 20:2-5</a>; <a onClick="return mV(\'Deu\',12,31);">De 12:31</a>; <a onClick="return mV(\'Deu\',18,10);">18:10</a>). The rash vow of Jephthah resulted in the immolation of his daughter, but the incident is recorded as something extraordinary (<a onClick="return mV(\'Jdg\',11,31);">Jud 11:31</a>f). The execution of Zebah and Zalmunna is a case of blood revenge, not sacrifice (<a onClick="return mV(\'Jdg\',8,18);">Jud 8:18</a>). Nor is the slaughter of Agag in any sense a sacrifice (<a onClick="return mV(\'1Sa\',15,32);">1Sa 15:32</a>f). The death of Saul\'s sons because of his breach of covenant with the Gibeonites was an expiatory sacrifice, to atone for the father\'s perfidy (<a onClick="return mV(\'2Sa\',21,9);">2Sa 21:9</a>). The Moabite king in desperation offered up his firstborn and heir to appease the anger of Chemosh, and the effect was startling to the Israelites (<a onClick="return mV(\'2Ki\',3,27);">2Ki 3:27</a>). Ahaz practiced the abomination in times of trouble (<a onClick="return mV(\'2Ki\',16,3);">2Ki 16:3</a>). Such sacrifices were intended to secure favor with the Deity or appease His wrath. Hiel\'s firstborn and youngest sons were probably sacrificed at the rebuilding or fortifying of Jericho (<a onClick="return mV(\'1Ki\',16,34);">1Ki 16:34</a>; compare <a onClick="return mV(\'Jos\',6,26);">Jos 6:26</a>). Manasseh practiced the custom (<a onClick="return mV(\'2Ki\',21,6);">2Ki 21:6</a>), but it was stopped by Josiah (<a onClick="return mV(\'2Ki\',23,10);">2Ki 23:10</a>). Micah\'s words were probably applicable to those times of Ahaz or Manasseh, when they thought to obtain God\'s favor by costly gifts apart from ethical conditions (<a onClick="return mV(\'Mic\',6,\'6-8\');">Mic 6:6-8</a>). Isaiah refers to a heathen custom practiced by Israel of slaying the children in secret places (<a onClick="return mV(\'Isa\',57,5);">Isa 57:5</a>), and Jeremiah represents it as practiced in his time (<a onClick="return mV(\'Jer\',7,31);">Jer 7:31</a>; <a onClick="return mV(\'Jer\',19,5);">19:5</a>). Ezekiel denounces the same practice (<a onClick="return mV(\'Eze\',16,20,21);">Eze 16:20,21</a>; <a onClick="return mV(\'Eze\',23,37);">23:37</a>).<P>11. Certain Heathen Sacrifices:<P>Heathen sacrifices are hinted at in the later books, such as swine, a mouse, a horse, a dog (<a onClick="return mV(\'Isa\',65,4);">Isa 65:4</a>; <a onClick="return mV(\'Isa\',66,3,17);">66:3,17</a>; <a onClick="return mV(\'Eze\',8,10);">Eze 8:10</a>; <a onClick="return mV(\'2Ki\',23,11);">2Ki 23:11</a>). All such animals were unclean to the Hebrews, and the practice had its roots in some form of primitive totemism which survived in those heathen cults. They were little practiced among the Israelites.<P>See <a href="./study/isbe/search.html?string=TOTEMISM">TOTEMISM</a>.<P>VII. The Prophets and Sacrifices.<P>The prophets were reformers, not innovators. Their emphasis was on the ethical, rather than the ritual. They based their teachings on the fundamentals of the covenant, not the incidentals. They accepted sacrifices as part of the religious life, but would give them their right place. They accepted the law regarding common altars, and Samuel, David and Elijah used these altars. They also endorsed the movement toward a central sanctuary, but it is the abuse of the cult that they condemned, rather than its use. They combated the heathenish idea that all God needed was gifts, lavish gifts, and would condone any sin if only they bestowed abundance of gifts. They demanded an inward religion, morality, justice, righteousness, in short, an ethical religion. They preached an ethical God, rather than the profane, debasing and almost blasphemous idea of God which prevailed in their times. They reminded the people of the covenant at Sinai, the foundation principle of which was obedience and loyalty to Yahweh. If Joel is early, the cult is in full practice, as he deplores the cutting-off of the meal offering, or minchah, and the netsekh or drink offering, through the devastation of the locusts. He does not mention the burnt offerings, etc., as these would not be cut off by the locusts (<a onClick="return mV(\'Joe\',1,7,13);">Joe 1:7,13</a>; <a onClick="return mV(\'Joe\',2,14);">2:14</a>). Joel emphasized the need for a genuine repentance, telling them to rend their hearts and not their garments (<a onClick="return mV(\'Joe\',2,13);">2:13</A>).<P>Amos condemns the cult at Beth-el and Gilgal, and sarcastically bids them go on transgressing (<a onClick="return mV(\'Amo\',4,4-5);">4:4,5</A>), mentions burnt offerings, peace offerings, thank offerings, and freewill offerings (<a onClick="return mV(\'Amo\',4,4);">4:4</a>f; <a onClick="return mV(\'Amo\',5,22);">5:22</A>), reminds them of the fact that they did not offer sacrifices in the wilderness (<a onClick="return mV(\'Amo\',5,25);">5:25</A>), but demands rather righteousness and justice. There is nothing here against the Mosaic origin of the laws.<P>In Hosea\'s time the hollow externalism of the cult had become worse, while vice, falsehood, murder, oppression, etc., were rampant. He utters an epoch-making sentence when he says, "I desire mercy, and not sacrifice," etc. (<a onClick="return mV(\'Hsa\',6,6);">Ho 6:6</a>). This is no sweeping renunciation of sacrifices, as such; it is only putting the emphasis in the right place. Such sacrifices as Hosea speaks of were worse than worthless. It is somewhat extravagant for Kautzsch to say, "It is perfectly futile to read out of <a onClick="return mV(\'Hsa\',6,6);">Ho 6:6</a> anything else than a categorical rejection of sacrifices." Hosea recognizes their place in religion, and deplores the loss during exile (<a onClick="return mV(\'Hsa\',3,4);">3:4</A>). The corrupt cults he condemns (<a onClick="return mV(\'Hsa\',4,13);">4:13</A>f), for they are as bad as the Canaanitish cults (<a onClick="return mV(\'Hsa\',4,9);">4:9</A>). Yahweh will spurn them (<a onClick="return mV(\'Hsa\',8,13);">8:13</A>; <a onClick="return mV(\'Hsa\',9,4);">9:4</A>). The defection of the nation began early (<a onClick="return mV(\'Hsa\',11,2);">11:2</A>), and they have multiplied altars (<a onClick="return mV(\'Hsa\',12,11);">12:11</A>; <a onClick="return mV(\'Hsa\',13,2);">13:2</a>). He predicts the time when they shall render as bullocks the "calves" of their lips (<a onClick="return mV(\'Hsa\',14,2);">14:2</A> the King James Version).<P>Micah is as emphatic. The sacrifices were more costly in his day, in order the more surely to purchase the favor of the Deity. Human sacrifices were in vogue, but Micah says God requires them "to do justly, and to love kindness, and to walk humbly with thy God" (<a onClick="return mV(\'Mic\',6,8);">6:8</A>). This does not in the least affect sacrifices of the right kind and with the right spirit.<P>Isaiah faces the same situation. There are multitudes of sacrifices, burnt offerings, blood of bullocks and goats, oblations, sweet incense, beasts, etc., but no justice, morality, love, truth or goodness. Thus their sacrifices, etc., are an abomination, though right in themselves (<a onClick="return mV(\'Isa\',1,\'11-17\');">1:11-17</a>; <a onClick="return mV(\'Isa\',3,4);">61:8</a>). The same is true of all pious performances today. It is probable that Isaiah worshipped in the temple (<a onClick="return mV(\'Isa\',6,1,6);">6:1,6</a>). In his eschatological vision there is freedom to offer sacrifices in Egypt (<a onClick="return mV(\'Isa\',19,19,21);">19:19,21</a>). The people are to worship in the holy mountain (<a onClick="return mV(\'Isa\',27,13);">27:13</a>). Ariel must let the feasts come around (<a onClick="return mV(\'Isa\',29,1);">29:1</A>).<P>Jeremiah maintains the same attitude. Your "frankincense from Sheba, and the sweet cane," burnt offerings and sacrifices are not pleasing to God (<a onClick="return mV(\'Jer\',6,20);">6:20</a>; <a onClick="return mV(\'Jer\',14,12);">14:12</a>). They made the temple a den of robbers, in the streets they baked cakes to the Queen of heaven, etc. He speaks sarcastically, saying, "Add your burnt-offerings unto your sacrifices, and eat ye flesh. For I spake not unto your fathers...concerning...sacrifices: but...commanded...saying, Hearken unto my voice," etc. (<a onClick="return mV(\'Jer\',7,21,22,23);">7:21-23</a>). This was literally true, as we have seen above; the covenant was not based on sacrifices but on obedience. Such a statement does not deny the institution of sacrifices for those within the covenant who are obedient. It is no "subterfuge," as Kautzsch calls it, "to say that the prophets never polemize against sacrifice per se, but only against offerings presented hypocritically, without repentance and a right disposition, with blood-stained hands; against the opera operata of the carnally-minded, half-heathen mass of the people." This is exactly what they do, and they are in perfect harmony with the covenant constitution and with their own ethical and spiritual functions. Kautzsch can make such an extravagant assertion only by ignoring the fact that Jeremiah himself in predicting the future age of righteousness and blessedness makes sacrifice an important factor (<a onClick="return mV(\'Jer\',33,11,18);">33:11,18</a>). Picturing possible prosperity and glory, Jeremiah speaks of burnt offerings and meal offerings, frankincense, thank offerings, etc., being brought into the house of Yahweh (<a onClick="return mV(\'Jer\',17,26);">17:26</a>). (We are aware of the harsh and arbitrary transference of this passage to a later time.)<P>Ezekiel is called by Kautzsch "the founder of the Levitical system." He is said to have preserved the fragment of the ritual that was broken up in the exile. But his references to the burnt offerings, sin offerings, and trespass offerings presuppose familiarity with them (<a onClick="return mV(\'Eze\',40,\'38-42\');">40:38-42</a>).<P>He assigns the north and south chambers for the meal, sin and trespass offerings (<a onClick="return mV(\'Eze\',42,13);">Eze 42:13</a>). The cleansing of the altar requires a bullock and he-goat for a sin offering, with burnt and peace offerings with a ritual similar to <a onClick="return mV(\'Lev\',8,1);">Le 8:1</a>f (<a onClick="return mV(\'Eze\',43,\'18-27\');">Eze 43:18-27</a>). The Levites are to be ministers and slay burnt offerings and sacrifice for the people (<a onClick="return mV(\'Eze\',44,11);">Eze 44:11</a>). The priest must offer his sin offering before he ministers in the sanctuary (<a onClick="return mV(\'Eze\',44,27);">Eze 44:27</a>). They are to eat the meal, sin, and trespass offerings as in <a onClick="return mV(\'Eze\',44,29);">Eze 44:29</a>. In <a onClick="return mV(\'Eze\',45,\'1-\');">Ezekiel 45</a>, the people are to give the wheat, barley, oil and lambs for meal, burnt and peace offerings, while the prince shall give the meal, burnt and drink offerings for the feasts, the new moons, sabbaths and appointed feasts. He is to prepare them to make atonement (<a onClick="return mV(\'Eze\',45,\'13-17\');">45:13-17</a>). In cleansing the sanctuary the Levitical ritual is followed with added details (<a onClick="return mV(\'Eze\',45,\'18-20\');">45:18-20</A>). The Passover requires the burnt offerings, sin offerings, and meal offerings with an extra amount of cereal. The priests prepare the prince\'s burnt offerings and peace offerings (<a onClick="return mV(\'Eze\',46,2,3,4,6,\'9-12\');">46:2-4,6,9-12</a>) for the sabbaths, new moons, etc. The daily burnt offerings (<a onClick="return mV(\'Eze\',46,\'13-15\');">46:13-15</A>) must have a sixth instead of a tenth part of an ephah, as in <a onClick="return mV(\'Lev\',1,\'1-\');">Leviticus 1</a>. The sin and guilt offerings are to be boiled in a certain place, and the meal offering baked (<a onClick="return mV(\'Lev\',1,20,26);">1:20,26</a>). Ezekiel varies from the Levitical Law in the quantity of the meal offering, picturing the ritual in a more ideal situation than Moses. The people are all righteous, with new hearts, the Spirit in them enabling them to keep the Law (<a onClick="return mV(\'Eze\',36,26);">36:26</A>f), and yet he institutes an elaborate ritual of purification for them. Does this seem to indicate that the prophets would abolish sacrifices entirely? It is strange reasoning which makes the prophets denounce the whole sacrificial system, when one of the greatest among them seeks to conserve an elaborate cult for the blessed age in the future.<P>In the second part of Isaiah, God declares that He has not been honored by the people with burnt offerings and meal offerings, etc., and that He has not burdened them with such offerings, but that He is wearied with their sins (<a onClick="return mV(\'Isa\',43,23);">43:23</a>f). Those foreigners who respect the covenant shall offer acceptable sacrifices (<a onClick="return mV(\'Isa\',56,7);">56:7</A>) in the blessed age to come. The Servant of Yahweh is to be a guilt offering (<a onClick="return mV(\'Isa\',53,10);">53:10</A>) to expiate the sins of Israel. Sacrifice is here for the first time lifted out of the animal to the human sphere, thus forging the link between the Old Testament and the New Testament. In the glorious age to come there are to be priests and Levites, new moons, sabbaths and worship in Jerusalem (<a onClick="return mV(\'Isa\',66,21,23);">66:21,23</A>).<P>Daniel speaks of the meal offering being caused to cease in the midst of the week (<a onClick="return mV(\'Dan\',9,27);">9:27</A>).<P>Zechariah pictures the golden age to come when all nations shall go up to Jerusalem to keep the Feast of Tabernacles, which implies sacrifices. Pots are used, and all the worshippers shall use them in the ritual (<a onClick="return mV(\'Zec\',14,\'16-21\');">14:16-21</A>).<P>In Malachi\'s age the ritual was in practice, but grossly abused. They offered polluted bread (<a onClick="return mV(\'Mal\',1,7);">1:7</a>), blind, lame and sick animals (<a onClick="return mV(\'Mal\',1,13);">1:13</A>f). Yahweh has the same attitude toward these as toward those in the times of Amos, Hosea, and Isaiah (<a onClick="return mV(\'Mal\',1,10);">Mal 1:10</a>f). The Gentiles offer better ones (<a onClick="return mV(\'Mal\',1,11);">Mal 1:11</a>). The Israelites covered the altar of Yahweh with tears by their hypocritical, non-ethical actions (<a onClick="return mV(\'Mal\',2,13);">Mal 2:13</a>). They robbed God in withholding tithes and heave offerings (<a onClick="return mV(\'Mal\',3,8);">Mal 3:8</a>). It is the abuse of the cult that is denounced here, as in all the other Prophets.<P>A special use of the term "sacrifice" is made by Zephaniah (<a onClick="return mV(\'Zep\',1,7);">1:7</a>f), applying it to the destruction of Israel by Yahweh. Bozrah and Edom are to be victims (<a onClick="return mV(\'Isa\',34,6);">Isa 34:6</a>); also Gog and Magog (<a onClick="return mV(\'Eze\',39,17,19);">Eze 39:17,19</a>).<P>In summing up the general attitude of the prophets toward sacrifices, even G. F. Moore in Encyclopedia Biblica admits: "It is not probable that the prophets distinctly entertained the idea of a religion without a cult, a purely spiritual worship. Sacrifice may well have seemed to them the natural expression of homage and gratitude." He might have added, "and of atonement for sin, and full fellowship with God."``146';
isbe[7562]='Sacrifice, in the Old Testament, 3`VIII. Sacrifice in the "Writings."<P>1. Proverbs:<P>Dates are very uncertain here. The Psalms and Proverbs extend from David and Solomon into the Persian period. The sages take the same attitude as the prophets. They enjoin the sacrifice of first-fruits (<a onClick="return mV(\'Pro\',3,9);">Pr 3:9</a>). A feast usually follows a sacrifice of peace offerings (<a onClick="return mV(\'Pro\',7,14);">7:14</a>). The trespass offering (?) has no meaning to fools (<a onClick="return mV(\'Pro\',14,9);">14:9</a>), and the sacrifices of the wicked are an abomination to God (<a onClick="return mV(\'Pro\',15,8);">15:8</a>; <a onClick="return mV(\'Pro\',21,27);">21:27</a>). Righteousness and justice are more acceptable to Yahweh than sacrifices (<a onClick="return mV(\'Pro\',21,3);">21:3</A>), yet to them sacrifices are a regular part of worship. Qoheleth speaks of sacrifices as quite the custom, and deprecates the offerings of fools (<a onClick="return mV(\'Ecc\',5,1);">Ec 5:1</a>; <a onClick="return mV(\'Ecc\',9,2);">9:2</a>).<P>2. The Psalms:<P>The Psalmist admonishes the faithful to offer the sacrifices of righteousness, i.e. sacrifices offered in the right spirit (<a onClick="return mV(\'Psa\',4,5);">Ps 4:5</a>). The drink offerings of idolaters are well known (<a onClick="return mV(\'Psa\',16,4);">Ps 16:4</a>). Prayer is made for the acceptance of sacrifices (<a onClick="return mV(\'Psa\',20,3);">Ps 20:3</a>). It is a coveted privilege to offer them (<a onClick="return mV(\'Psa\',27,6);">Ps 27:6</a>; <a onClick="return mV(\'Psa\',84,\'1-4\');">84:1-4</a>). The true relation between sacrifice and obedience is expressed in <a onClick="return mV(\'Psa\',40,\'6-8\');">Ps 40:6-8</a>. As in <a onClick="return mV(\'Jer\',7,21);">Jer 7:21</a>f; the emphasis is laid on obedience, without which sacrifices are worthless and repugnant to God. They are not the important thing in Israel\'s religion, for that religion could exist without them as in the wilderness and exile. The teaching corresponds exactly with that of the prophets and is probably late. <a onClick="return mV(\'Psa\',50,\'1-\');">Ps 50</a> is even more emphatic. The Psalmist knows that sacrifices are in the covenant regulations (<a onClick="return mV(\'Psa\',50,5);">50:5</A>), but repudiates the idea of giving anything to God or of feeding Him (<a onClick="return mV(\'Psa\',50,12,13);">50:12,13</a>). Everything belongs to Him, He is not hungry, He would scorn the idea of drinking the blood of goats, etc. The idea of the cult being of any real value to God is scouted. Yet in the next verse the reader is admonished to offer sacrifices of thanksgiving and pay vows (<a onClick="return mV(\'Psa\',50,14);">50:14</A>). The sacrifices that express worship, penitence, prayer, thanksgiving and faith are acceptable. The penitent Psalmist speaks in similar terms. Sacrifices as such are no delight to God, the real sacrifice is a broken heart (<a onClick="return mV(\'Psa\',51,16);">51:16</A>f). When the heart is right, then, as an expression of true-heartedness, devotion, repentance and faith, burnt offerings are highly acceptable (<a onClick="return mV(\'Psa\',51,19);">51:19</a>). Another Psalmist promises a freewill offering to God (<a onClick="return mV(\'Psa\',54,6);">54:6</a>; <a onClick="return mV(\'Psa\',66,13,15);">66:13,15</a>). Sacrifices of thanksgiving are advised (<a onClick="return mV(\'Psa\',96,8);">96:8</a>; <a onClick="return mV(\'Psa\',107,22);">107:22</a>; <a onClick="return mV(\'Psa\',118,27);">118:27</a>) and promised (<a onClick="return mV(\'Psa\',116,17);">116:17</a>). Prayer is likened to the evening sacrifice (<a onClick="return mV(\'Psa\',141,2);">141:2</a>).<P>IX. The Idea and Efficacy of Sacrifices.<P>That the Hebrews thoroughly believed in the efficacy of sacrifices is without doubt. What ideas they entertained regarding them is not so clear. No single theory can account for all the facts. The unbloody sacrifices were regarded as food for the Deity, or a pleasant odor, in one instance, taking the place of a bloody offering (see above). The bloody offerings present some difficulties, and hence, many different views.<P>1. A Gift of Food to the Deity:<P>Included under the head of gifts of food to the Deity would be the meal and peace offerings, in so far as they were consumed by fire, the burnt offerings and the shewbread, etc. They were fire-food, the fire-distilled essence or etherealized food for God which gave Him pleasure and disposed Him favorably toward the offerer. They were intended either to appease wrath, to win favor, or to express thanks and gratitude for favors experienced. The earlier and more naive idea was probably to win the favor of the Deity by a gift. Later, other ideas were expressed in the offerings.<P>2. Expression of Adoration and Devotion, etc.:<P>The burnt offering best gave expression to the sentiments of adoration and devotion, though they may not be excluded from the meal and peace offerings. In other words, sacrifice meant worship, which is a complex exercise of the soul. Such was Abraham\'s attempted sacrifice of Isaac. The daily burnt offerings were intended to represent an unbroken course of adoration and devotion, to keep the right relations with the Deity. On particular occasions, special offerings were made to insure this relation which was specially needed at that time.<P>3. Means of Purification from Uncleanness:<P>The burnt and sin offerings were the principal kinds used for the purpose of purification; water being used in case of uncleanness from contact with the dead. There were three classes of uncleanness:<P>(1) those inseparable from the sex functions of men and women;<P>(2) those resulting from contact with a corpse;<P>(3) the case of recovery from leprosy.<P>Purification ceremonies were the condition of such persons enjoying the social and religious life of the community. Why they should require a sin offering when most of them occurred in the regular course of nature and could not be guarded against, can be understood only as we consider that these offenses were the effects of sin, or the weaknesses of the fleshly nature, due to sin. Such uncleannesses made the subject unfit for society, and that unfitness was an offense to God and required a piacular offering.<P>4. Means of Consecration to Divine Service:<P>Consecration was of men and things. The ceremonies at the sealing of the covenant and the consecration of the Levites and of Aaron and his sons have been mentioned. The altar and furniture of the tabernacle were consecrated by the blood of the sin offering. This blood being the means of expiation, it cleansed from all defilement caused by human hands, etc. The sprinkling and smearing of the blood consecrated them to the service of God. The blood being holy, it sanctified all it touched (compare <a onClick="return mV(\'Eze\',45,19);">Eze 45:19</a>f).<P>5. Means of Establishing a Community of Life between Worshipper and God:<P>In other words, it is a kind of sacral communion. The blood is the sacred cement between man and God. This is possible only because it contains the life and is appropriated by God as a symbol of the communion into which He enters with the offerer. This blood "covers" all sin and defilement in man, permits him to enter God\'s presence and attests the communion with Him. This is the view of Schultz, and partly that of Kautzsch, in regard to earlier ideas of sacrifice. Such a view may have been held by certain peoples in primitive times, but it does not do justice to the Levitical system.<P>6. View of Ritschl:<P>The view of Ritschl is that sacrifices served as a form of self-protection from God whose presence meant destruction to a weak creature. Thus, sacrifices have no moral value and no relation to sin and defilement. They have relation only to man\'s creaturely weakness which is in danger of destruction as it approaches the presence of God. God\'s presence necessarily meant death to the creature without reference to his holiness, etc. Such a view banishes all real sense of sin, all ethical values, and furnishes no proper motives. It gives a false idea of the character of God, and is entirely out of accord with the sacred record.<P>7. The Sacramental View:<P>That sacrifices were really a sacrament has been advocated by many. According to some theologians, the sacrifices were signs of spiritual realities, not only representing but sealing and applying spiritual blessings, and their efficacy was proportionate to the faith of the offerer. By some Roman Catholic theologians it is held that the Passover was especially of a sacramental character, corresponding to the Lord\'s Supper. The purificatory rites corresponded to penance and the consecrating sacrifices to the sacrament of ordination. Bahr says that the acceptance of the sacrifice by Yahweh and His gift of sanctification to the worshippers give to the sacrifice the character of a sacramental act. Cave also speaks of them as having a sacramental significance, while refuting the position of Bahr. Though there may be a slight element of truth in some of these ideas, it is not the idea expressed in the cult, and seems to read into the ritual theology of theologians themselves. This view is closely allied to a phase of the following view (see Paterson, HDB, IV).<P>8. Symbol or Expression of Prayer:<P>That it is a symbol or expression of prayer is held by Maurice and to some extent by Schultz. Thus, the sacrifices are supposed to be symbols of the religious sentiment, which are the conditions of acceptance with God. The victim serves as an index of what is in the worshipper\'s heart, and its virtue is exhausted when it is presented to God. Thus, it may express spiritual aspiration or supplication, hatred of sin and surrender to God with confession and supplication. Bahr holds that a valuable and unblemished victim is selected as symbolical of the excellence and purity to which the offerer aspires, the death is necessary to procure life which may be offered to God, and the sprinkling of the blood is the presentation to God of the life still resident in the blood. Schultz thinks that the sin offering was distinctively purifying. "Hence, the real ground of purification is that God accepts the sacrifice and thereby enters into communion with the sinner, granting him actual pardon, and that man in this offering enjoined by God as the embodied prayer of a penitent expresses his confession, his regrets and his petition for forgiveness." While there is an element of truth in this, and it is particularly applicable to the burnt offering, it does not embrace all the facts. It represents the views of the prophets and psalmists more than that of the Levitical code.<P>9. View of Kautzsch:<P>Kautzsch holds that the efficacy of sacrifices consists in this: "God has connected the accomplishment of atonement with the obedient discharge of the sacrificial prescriptions; whoever fulfils these and gets the priest to perform the atoning usages, is forgiven. The ritual, especially the presenting of the blood, is the indispensable condition of atonement, but it is not synonymous. Forgiveness of sin flows from the grace of God as taught by the prophets, only with them it is unnecessary, but with the Priestly Code it is necessary." Thus Kautzsch teaches a fundamental contradiction between the prophets and the Law, which is utterly wrong and is made necessary by first turning the history upside down and making the Priestly Code a hideous anachronism. He says, "That the process of atonement is connected with the presenting of blood, explains itself naturally as a powerful after-influence of primitive sacrificial usages, in which the presenting of blood had a different meaning. It is a symbolic (not real) satisfaction, as through the animal\'s life symbolic expression is given to the fact that the sinner\'s life is forfeited to God. But the main idea is that God has commanded it" (HDB, V, 721a). The half-truths in these statements will be obvious to most readers.<P>10. Vicarious Expiation Theory; Objections:<P>The theory that sacrifices were a vicarious expiation of sin and defilement, by a victim whose life is forfeited instead of the sinner\'s, is the only one that will complete the Levitical idea of sacrifices. This of course applies especially to the sin offering. While there is an element of truth in the gift-theory, the prayer and sacramental theories and others, including that of Kautzsch, the idea of a vicarious suffering is necessary to complete the conception. Oehler recognizes the force of the prayer-theory, but advances to the idea that in sacrifices man places the life of a pure, innocent, sacrificial animal between himself and God, because he is unable to approach God on account of his sinfulness and impurity. Thus it becomes a kopher for him, to cover his sin. This is not a punishment inflicted on the animal, although in the case of uncertain homicide it is (<a onClick="return mV(\'Deu\',21,\'1-9\');">De 21:1-9</a>). The law does not lay the emphasis upon the slaughter, but on the shedding of the blood and the sprinkling of it on certain articles. The slaughter is of course presupposed. The altar is not regarded as a place of execution, it is the means for "covering" the sins of the covenant people, a gracious ordinance of God and well-pleasing to Him. But the gift can please God only as the gift of one who has given himself up to Him; therefore the ritual must represent this self-surrender, the life of the clean and guiltless animal in place of the impure and sinful soul of the offerer, and this pure soul, coming in between the offerer and the Holy God, lets Him see at the altar a pure life by which the impure life is covered. In the same way the pure element serves to cover the pollutions of the sanctuary and the altar, etc. Its meaning is specific, it is the self-sacrifice of the offerer vicariously accomplished. This self-sacrifice necessarily involves suffering and punishment, which is inflicted on the beast to which the guilt and sin are imputed, not imparted (see Oehler, Old Testament Theology, 278f).<P>Objections have been raised by Dillmann, Kautzsch, and others on the ground that it could not have been vicarious because sacrifices were not allowed for sins which merited death, but only for venial transgressions (<a onClick="return mV(\'Num\',15,30);">Nu 15:30</a>). Certainly, but the entire sacrificial system was for those who were in the covenant, who did not commit sins that merited death, and was never intended as a penal substitute, because the sins of those in the covenant were not of a penal nature. The sacrifices were "to cover" the sin and defilement of the offerer, not the deserved death-penalty of one who broke the covenant. Again, they object, a cereal offering may atone, and this excludes a penal substitute. But sacrifices were not strictly penal, and the cereal was distinctly an exception in case of the very poor, and the exception proves the rule. In any case it represented the self-sacrifice of the offerer, and that was the important thing. Further, the victim was slain by the offerer and not by the priest, whereas it should have been put to death by God\'s representative. This carries no weight whatever, as the essential thing was a sacrifice, and priests were not necessary for that. A more serious objection is that in the case of penal substitution, by which the sin and guilt are transferred to the animal, the flesh of that animal is regarded as most holy and to be eaten by the priests only, whereas it would necessarily be regarded as laden with guilt and curse, and hence, polluted and unfit for use. This is a pure assumption. In the first place, the substitution was not strictly penal, and, secondly, there is no hint that actual pollution is conveyed to the flesh of the animal or to the blood. Even if it were so, the shedding of the blood would expiate the sin and guilt, wipe out the pollution, and the flesh would be in no way affected. On the contrary, the flesh, having been the vehicle for the blood which has accomplished such a sacred and meritorious service, would necessarily be regarded as most holy. All the animal would be holy, rather than polluted, since it had performed such a holy service. Kautzsch\'s objection thus appears puerile. The ritual of the Day of Atonement presents all these features. It is distinctly stated that the high priest confesses the iniquities of the children of Israel over the scapegoat, and that the goat carries this guilt away to the desert. Its blood is not shed, it is wholly unclean, and the man leading it away is unclean. This is undeniably a vicarious act. In the case of the other goat, a sin offering, the sin and guilt are imputed to it, but the life is taken and thus the expiation is made and the flesh of the victim used in such a holy service is most holy.<P>That this view of a vicarious expiation was generally accepted is evident on every hand. There was no need of a theoretical explanation in the cult; it was self-evident; as Holtzmann says, "the most external indeed, but also the simplest and most generally intelligible and the readiest answer to the nature of expiation" (New Testament Theology, I, 68). This view is amply corroborated by the researches of S. I. Curtiss in his Primitive Semitic Religion of Today. By searching questions he found that the fundamental idea of bloody sacrifices was that the victim took the place of the man, redeemed him, or atoned for him as a substitute. The "bursting forth of the blood" was the essential thing (see pp. 218f).<P>11. Typology of Sacrifice:<P>The typology of sacrifice has been much discussed. There can be no question that, from the standpoint of the New Testament, many of the sacrifices were typical. They pre-figured, and designedly so, the great sacrifice of Christ. Thus they could not really take away sin; they were in that sense unreal. But the question is, were they typical to the people of Israel? Did Moses and the priests and prophets and people understand that they were merely figures, adumbrations of the true Sacrifice to come, which alone could take away sin? Did they understand that their Messiah was to be sacrificed, His blood shed, to make an atonement for them, and render their divinely-given means of atonement all unreal? The answer must be an emphatic "No." There is no hint that their minds were directed to think of the Coming One as their sacrifice, foreshadowed by their offerings. That was the one thing the nation could not and would not understand, and to this day the cross is their chief stumblingblock. The statement that the Servant is to be a guilt offering (<a onClick="return mV(\'Isa\',53,10);">Isa 53:10</a>) is the nearest approach to it, but this is far from saying that the whole sacrificial system was understood as foreshadowing that event. The great prophets all speak of a sacrificial system in full vogue in the Messianic age.<P>We prefer to regard the sacrificial system as great religious educational system, adapted to the capacity of the people at that age, intended to develop right conceptions of sin, proper appreciation of the holiness of God, correct ideas of how to approach God, a familiarity with the idea of sacrifice as the fundamental thing in redemption, life, and service to God and man.<P>LITERATURE.<P>Only a Selection Is Attempted:<P>Articles in Encyclopedia Brit, 11th edition; Encyclopedia Biblica (G. F. Moore); HDB (Paterson); RE and Sch-Herz (Orelli); Jewish Encyclopedia; McClintock and Strong, etc.; Murray\'s Bible Dict.; Standard BD, etc. Kautzsch, Jastrow and Wiedermann in HDB; article on "Comparative Religion" in Sch-Herz; Old Testament Theologies of Oehler, Dillmann, Smend, Schultz, Davidson, Koenig, etc.<P>On Sacrifices in General:<P>Wellhausen, Reste des arabischen Heidenthums; W. R. Smith, Religion of the Semites; J. G. Frazer, Golden Bough, II, III; E. B. Tylor, Primitive Culture; E. Westermarck, Origin of Moral Ideas; H. Hubert et Mauss, Annee sociologique, II; L. Marillier, Revue de l\'histoire des religions, XXXVI, 208; S. I. Curtiss, Primitive Semitic Religion of Today.<P>Biblical Sacrifices:<P>F. Bahr, Symbolik des Mosdischen Kultus; J. H. Kurtz, Der alttestamentliche Opfercultus; A. Stewart, The Mosaic Sacrifices; J. G. Murphy, Sacrifice as Set Forth in Scripture; A. Cave, Scriptural Doctrine of Sacrifice; F. Maurice, The Doctrine of Sacrifice; J. M. P. Smith, Biblical Doctrine of Atonement. See also: Schultz, AJT, 1900, 257ff; Smoller, Studien und Kritiken, 1891; Wiener, Essays in Pentateuchal Criticism; Pentateuchal Studies; Driver, ERE, VI.``146';
