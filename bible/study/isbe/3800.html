ical, external thing. It is equivalent to the righteous and just will of Yahweh. These passages are sufficient to prove the ethical significance of the word kabhodh, but it may be worth while to quote one more passage and this time from <a onClick="return mV(\'Psa\',97,\'1-\');">Ps 97</a> with its wonderful description of the blessings of the righteous rule of Yahweh. It is stated in <a onClick="return mV(\'Psa\',97,6);">97:6</A> that "the heavens declare his righteousness, and all the peoples have seen his glory." His righteousness may include, as Kirkpatrick suggests, "His faithfulness to His people and His sovereign justice in the punishment of all," or it may refer only to the former of these qualities; but in any case, it is a moral act, and by it the peoples recognize the glory of Yahweh as the supreme moral ruler.<P>IV. In Apocrypha and New Testament.<P>"Glory" in the apocryphal books and in the New Testament is almost exclusively the translation of the Greek noun doxa. In all these writings the Old Testament usage seems to be the most important, and it seems to be the fact, if one may judge from the Septuagint and from the original Hebrew of Sir, that the Greek noun doxa, in the great majority of cases, represents the Hebrew kabhodh, so that the underlying thought is Hebrew, even though the words may be Greek<P>1. In the Apocrypha:<P>(1) As Applied to External Things.<P>It will be perhaps a little more convenient to deal with the usage of the Apocrypha separately, following essentially the order that has been adopted for the Old Testament discussion of kabhodh, and bearing in mind that the usage of Sir has been discussed under the Old Testament. The use of the word "glory" to describe the honor, reputation and splendor which belong to men is quite common. In this sense 1Esdras 1:33 refers to the glory of Josiah, while in The <span class="noTag">Wisdom of Solomon 10:14</a> the perpetual glory given by The Wisdom of Solomon to Joseph must be interpreted in the same way. In 2Macc 5:16,20 glory refers to the beautification and adornment of the temple in a sense like that of tiph\'arah in <a onClick="return mV(\'Isa\',60,7);">Isa 60:7</a>. In Judith 15:9 "glory" is the translation of the Greek gauriama, and indicates that Judith is the pride of Israel.<P>(2) As Applied to God.<P>But the most significant use of doxa in the Apocrypha is that in which it refers to the light and splendor which are regarded as the invariable accompaniments of God. The reference may be to the historic manifestation of God in glory at Mt. Sinai, as in 2Esdras 3:19, or to the manifestation of God in Israel, which is to be the especial characteristic of the Messianic kingdom. In 1Esdras 5:61 songs sung to the praise of the Lord, "because his goodness and his glory are forever in all Israel," are based upon the hope that Yahweh is about to establish the Messianic kingdom among the people who have bound themselves to obey His law. In several passages in 2Esdras the reference seems to be not to the Messianic kingdom in the historical sense, but rather to that kingdom of God which the saints are to inherit after death. This is clearly the thought in 2Esdras 2:36 and in 7:52; also in 8:51 where the context shows clearly that the reference is to the glory of Paradise, which is the heritage of all those who are like Ezra in their devotion to Yahweh (compare also 2Esdras 10:50).<P>But most frequently in the Apocrypha, in a sense which approximates that of the New Testament, the word "glory" refers to the blaze of light and splendor which is the essential expression of the holy majesty of Yahweh. The prayer of Manasseh refers to the unbearable majesty of the glory of Yahweh; while 2Esdras 8:30, trusting in Yahweh\'s glory is equivalent to trusting in Yahweh Himself; and in 16:53 the oath "before God and his glory" is simply before the Lord God Himself. The same thought is expressed in Tobit 12:15; 13:14; The <span class="noTag">Wisdom of Solomon 7:25</span>. In the So of Three Children, verses 31,33, the glory of Yahweh refers to His self-manifestation in His heavenly kingdom, and this is undoubtedly the significance in the frequently recurring doxologies, "Thine is the glory forever."<P>2. In the New Testament:<P>(1) As Applied to Men.<P>In the New Testament, much the same variety of usage is to be noted as in the Old Testament and the Apocrypha, and it is not easy to trace the exact relationship and order of the various meanings. The ordinary classical use of the word in the sense of "opinion," "judgment," "view," occurs in Hellenistic Greek only in 4Macc 5:17 (18) on the authority of Thayer.<P>It is perhaps as convenient to follow generally the order adopted in the preceding discussion. In some places the word refers to the manifestations and insignia of rank and power, as in the familiar phrase, "Solomon in all his glory" (<a onClick="return mV(\'Mat\',6,29);">Mt 6:29</a>), or the glory of the kingdoms of the world (<a onClick="return mV(\'Mat\',4,8);">Mt 4:8</a>), or the glory of the kings and nations of the earth which shall be brought into the heavenly city (<a onClick="return mV(\'Rev\',21,24,26);">Re 21:24, 26</a>). Doxa also defines the praise, honor and dignity of men. This is the meaning in <a onClick="return mV(\'Jhn\',5,41,44);">Joh 5:41, 44</a>, where Christ distinguishes between His accusers and Himself in that He receives not glory from men, while they receive glory one of another (compare also <a onClick="return mV(\'Jhn\',7,18);">Joh 7:18</a>). In <a onClick="return mV(\'Eph\',3,13);">Eph 3:13</a>, Paul declares that his tribulations for those to whom he is writing are a glory or distinction to them, while in <a onClick="return mV(\'1Th\',2,20);">1Th 2:20</a> he declares that the Thessalonian Christians are his glory and joy.<P>(2) As applied to God.<P>Closely related to this usage is the employment of the word to ascribe honor and praise to God; see <a onClick="return mV(\'Luk\',17,18);">Lu 17:18</a>, where only the stranger returned to give glory to God; or <a onClick="return mV(\'Jhn\',9,24);">Joh 9:24</a>, where the man who had been born blind is bidden to give glory to God; or the phrase "to the glory of God" in <a onClick="return mV(\'Rom\',15,7);">Ro 15:7</a>, where the meaning is to secure the honor and praise of God among men. Similar is the use in the frequently recurring doxologies such as, "Glory to God in the highest," "to him," that is, to God, "be glory," etc.<P>While the foregoing meanings are frequently illustrated in the New Testament, it is undoubtedly true that the characteristic use of the word doxa in the New Testament is in the sense of brightness, brilliance, splendor; and first of all, in the literal sense, referring to the brightness of the heavenly bodies, as in <a onClick="return mV(\'1Cr\',15,40);">1Co 15:40</a>f; or to the supernatural brightness which overcame Saul of Tarsus on the road to Damascus (<a onClick="return mV(\'Act\',22,11);">Ac 22:11</a>).<P>(3) As Applied to the Saints.<P>But the most common use of the word is to describe the brilliance which is the characteristic of all persons who share in the heavenly glory. Moses, Elijah and Jesus Himself have this glory on the Mountain of Transfiguration (<a onClick="return mV(\'Luk\',9,31);">Lu 9:31</a>f). It was the same glory which gave the angel who came out of heaven power to lighten the earth (<a onClick="return mV(\'Rev\',18,1);">Re 18:1</a>), and also which shone about the shepherds when the angel appeared unto them (<a onClick="return mV(\'Luk\',2,9);">Lu 2:9</a>). Paul refers to this glory, when he speaks of the face of Moses as it appeared after God had spoken with him (<a onClick="return mV(\'2Cr\',3,7);">2Co 3:7</a>f). And as in the case of Moses, so here, the source of this glory is God Himself, who is the God of glory (<a onClick="return mV(\'Act\',7,2);">Ac 7:2</a>, and frequently).<P>(4) As Applied to the Messianic Kingdom.<P>It is also used to describe the ideal Messianic kingdom of the future. It is applied to Christ to describe His royal majesty when He comes to set up His kingdom. So James and John ask to sit, one on His right hand and one on His left in His glory (<a onClick="return mV(\'Mar\',10,37);">Mr 10:37</a>). Christ is to appear in glory with the angels (<a onClick="return mV(\'Mat\',16,27);">Mt 16:27</a> and often), for His condition in the coming age as it was before the incarnation is a condition of glory (<a onClick="return mV(\'Luk\',24,26);">Lu 24:26</a>; <a onClick="return mV(\'Jhn\',17,5,22,24);">Joh 17:5, 22, 24</a>). But not merely the Messiah, but also all His followers shall share in the glory of the Messianic kingdom. This use is so common that it is scarcely necessary to illustrate it by reference. This glory is to be revealed to all Christians in the future (<a onClick="return mV(\'Rom\',8,18,21);">Ro 8:18, 21</a>; <a onClick="return mV(\'Rom\',9,23);">9:23</a>; compare also <a onClick="return mV(\'1Cr\',2,7);">1Co 2:7</a>; <a onClick="return mV(\'2Cr\',4,17);">2Co 4:17</a>).<P>3. Its Ethical Significance:<P>In all these cases it has a distinctly ethical signification, for it is the term which is used to describe the essential nature, the perfection of the Deity, and is shared by others because they are made partakers of the Divine nature. So Paul refers to "the glory of the incorruptible God" (<a onClick="return mV(\'Rom\',1,23);">Ro 1:23</a>; compare also <a onClick="return mV(\'Eph\',1,17);">Eph 1:17</a>f; and often). And the essential nature of Christ comes to be described in the same way. He has glory as of the only begotten of the Father (<a onClick="return mV(\'Jhn\',1,14);">Joh 1:14</a>); he shows His glory in the performance of miracles (<a onClick="return mV(\'Jhn\',2,11);">Joh 2:11</a>); and like the Father, He is the Lord of glory (<a onClick="return mV(\'1Cr\',2,8);">1Co 2:8</a>).<P>As a verb in the Old Testament the most common signification of the word "glory" is, to make one\'s boast in or of anything, usually of the pious glorying in Yahweh (Yahweh), but occasionally with some other reference, as in <a onClick="return mV(\'Jer\',9,23);">Jer 9:23</a> of man glorying in his riches, might or wisdom. In all these cases it represents the Hebrew hith-hallel. In <a onClick="return mV(\'Exd\',8,9);">Ex 8:9</a> the phrase, "Have thou this glory over me," is the translation of the Hebrew hith-pa\'er, and means take to thyself the honor or distinction as regards me. In <a onClick="return mV(\'2Ki\',14,10);">2Ki 14:10</a> it translates the Hebrew hik-kabhedh, "honor thyself," i.e. be satisfied with the home which you have already attained.<P>In the Apocryphal books it means either "glorify thyself," the middle voice of the verb doxazo, as in Sirach 3:10, where the original Hebrew has hith-kabbedh, or "to exult," "boast over," as in Judith 9:7, where it represents the Greek gauroomai; or "to boast," "take pride in," where it represents, as it does usually in the New Testament, the Greek kauchaomai (Sirach 17:9; 24:1; 38:25; 39:8; 48:4, in the second and fourth of which cases it represents the Hebrew hith-pa\'er).<P>In the New Testament the verb is used 3 times in James, and several times in the Epistles of Paul, and everywhere is used to translate the verb kauchaomai, or, in two cases in James, the same verb is compounded with the preposition kata. In all these cases the meaning is "to take pride in," "to congratulate oneself," upon anything.<P>In this connection attention may be called to the use of the noun "glorying," once or twice rendered "to glory," where the meaning is either the occasion or ground of glorying, or sometimes the act of glorying. The original has kauchema or kauchesis. This usage occurs in <a onClick="return mV(\'Jam\',4,16);">Jas 4:16</a>; <a onClick="return mV(\'Hbr\',3,6);">Heb 3:6</a>, and several times in the Epistles of Paul.<P>LITERATURE.<P>In addition to the commentaries and works on Biblical theology among which, Briggs, ICC on the Psalms, Scribner, N.Y.,1906,especially the note in I,66,67; and Weiss, Biblical Theology of the New Testament, English translation, T. and S. Clark, Edinburgh, 1882-83, may be mentioned especially, the chief works on the subject are von Gall, Die Herrlichkeit Gottes, Giessen, 1900; and Caspari, Die Bedeutungen der Wortsippe k-b-d im Hebraeischen, Leipzig, 1908. The discussions by G. B. Gray and J. Massie in HDB, II, are valuable, and also the brief but significant article by Zenos in the Standard Bible Dictionary, Funk and Wagnalls, N.Y., 1909.``13';

isbe[3838]='Glutton; Gluttonous`glut\'-\'-n, glut\'-\'-n-us (zalal, "to be lavish"; phagos): "Glutton" (from glut, to swallow greedily) is the translation of zolel from zalal, "to shake or pour out," "to be lavish, a squanderer." In <a onClick="return mV(\'Deu\',21,20);">De 21:20</a>, "This our son...is a glutton, and a drunkard," the word may mean a squanderer or prodigal; the English Revised Version has "a riotous liver." In <a onClick="return mV(\'Pro\',23,21);">Pr 23:21</a>, "For the drunkard and the glutton shall come to poverty" (following zole bhasar, "squanderers of flesh," the Revised Version (British and American) "gluttonous eaters of flesh"), "glutton" in the usual sense is intended; "a man gluttonous," "a gluttonous man" (the Revised Version) (phagos, "an eater," "a glutton") was a term applied to Christ in His freedom from asceticism (<a onClick="return mV(\'Mat\',11,19);">Mt 11:19</a>; <a onClick="return mV(\'Luk\',7,34);">Lu 7:34</a>).<P>The Revised Version has "idle gluttons" (margin Greek, "bellies") for "slow bellies" (<a onClick="return mV(\'Tts\',1,12);">Tit 1:12</a>); "gluttonous" "gluttons," for "riotous" (<a onClick="return mV(\'Pro\',23,20);">Pr 23:20</a>; <a onClick="return mV(\'Pro\',28,7);">28:7</a>).``185';
isbe[3839]='Gnash`nash (charaq; brugmos): "Gnash" is used of grinding or striking together the teeth in rage, pain or misery of disappointment. In the Old Testament it is the translation of charak, a mimetic word, and represents for the most part rage, anger, hatred (<a onClick="return mV(\'Job\',16,9);">Job 16:9</a>, "He gnasheth upon me with his teeth," the Revised Version (British and American) "hath gnashed upon me"; <a onClick="return mV(\'Psa\',35,16);">Ps 35:16</a>; <a onClick="return mV(\'Psa\',37,12);">37:12</a>; <a onClick="return mV(\'Psa\',112,10);">112:10</a>, grief; <a onClick="return mV(\'Lam\',2,16);">La 2:16</a>, contempt or derision); brucho, "to gnash the teeth in rage," indicates anger, rage, Septuagint for charaq (<a onClick="return mV(\'Act\',7,54);">Ac 7:54</a>, of Stephen, "They gnashed on him with their teeth"). The several instances of brugmos, "gnashing," in the Gospels seem to express disappointment rather than anger (<a onClick="return mV(\'Mat\',8,12);">Mt 8:12</a>,"there shall be wailing and gnashing of teeth," the Revised Version (British and American) "the weeping and the gnashing of teeth"; <a onClick="return mV(\'Mat\',13,42,50);">Mt 13:42, 50</a>; <a onClick="return mV(\'Mat\',22,13);">22:13</a>; <a onClick="return mV(\'Mat\',24,51);">24:51</a>; <a onClick="return mV(\'Mat\',25,30);">25:30</a>; <a onClick="return mV(\'Luk\',13,28);">Lu 13:28</a>—a vivid representation of the misery of disappointed expectations; compare Ecclesiasticus 30:10, "lest thou shalt gnash thy teeth in the end," gomphiazo, "to have the teeth set on edge"); trizo (<a onClick="return mV(\'Mar\',9,18);">Mr 9:18</a>), which means "to give out a creaking, grating sound," "to screak," is used in the New Testament (in the above instance only) to mean "to grate or gnash with the teeth," indicating the effect of a paroxysm, the Revised Version (British and American) "grindeth his teeth."``185';
isbe[3840]='Gnat`nat (in English Versions of the Bible, only in <a onClick="return mV(\'Mat\',23,24);">Mt 23:24</a>, konops. In <a onClick="return mV(\'Exd\',8,16);">Ex 8:16</a>, for English Versions of the Bible "lice," one of the plagues of Egypt, kinnim, kinniym, or kinnam, we find in the Revised Version, margin "sand flies" or "fleas" (Gesenius "gnat"; Mandelkern "culex"). For kemo ken (<a onClick="return mV(\'Isa\',51,6);">Isa 51:6</a>), English Versions of the Bible "in like manner," Septuagint hosper tauta, Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) sicut haec, the Revised Version, margin has "like gnats" since ken, elsewhere "thus," may here be taken to be a singular of the form kinnim, which occurs in <a onClick="return mV(\'Exd\',8,\'1-\');">Ex 8</a>): In the New Testament passage, the difference between the King James Version and the Revised Version (British and American) should be noted. "Strain at a gnat, and swallow a camel" is changed to "strain out the gnat and swallow the camel," the reference being to the inconsistency of the Jewish religious leaders in taking extraordinary pains in some things, as in the preparation of food, while leaving weightier matters unattended to.<P>In <a onClick="return mV(\'Isa\',51,6);">Isa 51:6</a>, the suggestion of the Revised Version, margin, "They that dwell therein shall die like gnats," seems a decided improvement on the "shall die in like manner" of English Versions of the Bible, especially as ken, "thus" (see supra), is a repetition of kemo, whose meaning is practically the same, "in like manner" being the rendering in English Versions of the Bible of kemo ken.<P>As to the creatures, kinnim, of the Egyptian plague, there is little choice between "lice" of English Versions of the Bible and the others suggested, except as we may be influenced by the Septuagint rendering, skniphes, which may mean "gnats" or "mosquitoes."`<a href="./study/isbe/search.html?string=FLEA">FLEA</a>; <a href="./study/isbe/search.html?string=LICE">LICE</a>`37';
isbe[3841]='Gnosticism`nos\'-ti-siz\'-m:<P><b>I. GENERAL DEFINITION</b><P><b>II. SOURCES OF GNOSTICISM</b><P class="in15">1. Alexandrian Philosophy<P class="in15">2. Zoroastrianism<P><b>III. NATURE OF GNOSTICISM</b><P class="in15">Chief Points<P><b>IV. GNOSTICISM IN THE CHRISTIAN CHURCH</b><P class="in15">1. Colossians<P class="in15">2. 1 Corinthians: "Knowledge" at Corinth<P class="in15">3. Pastoral Epistles<P class="in15">4. 1 John<P class="in30">(1) Gnostic Claims<P class="in30">(2) Its Loveless Nature<P class="in30">(3) Docetism<P class="in30">(4) The Antichrist<P class="in30">(5) Its Antinomian Side<P class="in15">5. "To Know the Depths," Revelation<P><b>V. THE CHRISTIAN ANTITHESIS</b><P class="in15">1. God and the World<P class="in30">How Did the World Originate?<P class="in15">2. Evil<P class="in30">(1) Christian Doctrine of Sin<P class="in30">(2) Sin and the Moral Law<P class="in15">3. Christ and Redemption<P class="in15">4. Asceticism and Antinomianism<P><b>VI. HARNACK\'S VIEW OF GNOSTICISM</b><P><b>VII. INFLUENCE AND DEVELOPMENT OF GNOSTICISM</b><P class="in15">1. Not a Heresy of the Humbler Classes<P class="in15">2. Cerinthus: His Teaching<P class="in15">3. The Gospel of John<P class="in15">4. Various Sects<P class="in30">(1) The Ophites<P class="in30">(2) Valentinus<P class="in30">(3) Basilides<P class="in30">(4) Saturninus<P class="in30">(5) Marcion<P class="in15">5. Relation to the Old Testament<P class="in15">6. The Christian Verities<P class="in15">7. Influence on Theology<P class="in15">8. Truth Underlying Docetism<P><b>VIII. MODERN GNOSTICISM</b><P><b>LITERATURE</b><hr /><P>Gnosticism—except perhaps in <a onClick="return mV(\'1Ti\',6,20);">1Ti 6:20</a>, where Paul warns Timothy against "the gnosis, which is falsely so called"—is not directly alluded to in the New Testament. Nevertheless its leaven was actually working, as will immediately be seen, and constituted a most serious peril in the apostolic church. "That strange, obscure movement, partly intellectual, partly fanatical...in the 2nd century spread with the swiftness of an epidemic over the church from Syria to Gaul" (Law, The Tests of Life, 26). It is therefore of high importance to gain a right conception of the nature of this potent anti-Christian influence. This is not easy. The difficulty in dealing with Gnosticism is that it was not a homogeneous system of either religion or philosophy, but embraced many widely diversified sects holding opinions drawn from a great variety of sources. "The infinitely varied shapes assumed by the systems render it almost impossible to classify them, or even to give an account of their leading ideas, which shall not be open to objection. We might as well try to classify the products of a tropical jungle, or the shapes and hues of the sunset clouds, which change under our view as we look at them" (Orr, The Progress of Dogma, 58).<P>I. General Definition.<P>On the general definition of Gnosticism a few authorities may be cited. "Gnosticism," says Dr. Gwatkin, "may be provisionally described as a number of schools of philosophy, oriental in general character, but taking in the idea of a redemption through Christ, and further modified in different sects by a third element, which may be Judaism, Hellenism, or Christianity...the Gnostics took over only the idea of a redemption through Christ, not the full Christian doctrine, for they made it rather a redemption of the philosophers from matter, than a redemption of mankind from sin" (Early Church History to AD 313, II, 20).<P>Dr. Orr writes, "Gnosticism may be described generally as the fantastic product of the blending of certain Christian ideas—particularly that of redemption through Christ—with speculation and imaginings derived from a medley of sources (Greek, Jewish, Parsic; philosophies; religions, theosophies, mysteries) in a period when the human mind was in a kind of ferment, and when opinions of every sort were jumbled together in an unimaginable welter. It involves, as the name denotes, a claim to \'knowledge,\' knowledge of a kind of which the ordinary believer was incapable, and in the possession of which \'salvation\' in the full sense consisted. This knowledge of which the Gnostic boasted, related to the subjects ordinarily treated of in religious philosophy; Gnosticism was a species of religious philosophy" (The Early Church, 71).<P>Neander has described Gnosticism as "the first notable attempt to introduce into Christianity the existing elements of mental culture, and to render it more complete on the hitherto rather neglected side of theoretical knowledge; it was an attempt of the mind of the ancient world in its yearning after knowledge, and in its dissatisfaction with the present, to bring within its grasp and to appropriate the treasures of this kind which christianity presented" (Antignostikus, Intro, 199).<P>Gnosticism accordingly comprehends in itself many previously existing tendencies; it is an amalgam into which quite a number of different elements have been fused. A heretical system of thought, at once subtle, speculative and elaborate, it endeavored to introduce into Christianity a so-called higher knowledge, which was grounded partly on the philosophic creed in which Greeks and Romans had taken refuge consequent on the gradual decay and breaking-up of their own religions, partly, as will be shown, on the philosophies of Plato and of Philo, and still more on the philosophies and theosophies and religions of the East, especially those of Persia and of India.<P>"For a long time the pagan beliefs had ceased to be taken seriously by thoughtful men and had been displaced by various creeds derived from philosophical speculation. These in themselves were abstract and unsatisfying, but had been partly vitalized by union with theosophies of the East. An attempt was made on the part of this philosophical religion to effect an alliance with Christianity. A section of the church was dissatisfied with the simplicity of the gospel, and sought to advance to something higher by adopting the current speculations...The late books of the New Testament are all occupied, more or less, with this movement, which was the more dangerous as it threatened the church from within" (Professor E. Scott, The Apologetic of the New Testament, 14).<P>Gnosticism, though usually regarded as a heresy, was not really such: it was not the perverting of Christian truth; it came, rather, from outside. Having worked its way into the Christian church, it was then heretical. "Although it became a corrupting influence within the church, it was an alien by birth. While the church yet sojourned within the pale of Judaism, it enjoyed immunity from this plague; but as soon as it broke through these narrow bounds, it found itself in a world where the decaying religions and philosophies of the West were in acute fermentation under the influence of a new and powerful leaven from the East; while the infusion of Christianity itself into this fermenting mass only added to the bewildering multiplicity of Gnostic sects and systems it brought forth" (Law, The Tests of Life, 26).<P>II. Sources of Gnosticism.<P>Mansel (in his work on The Gnostic Heresies, 32) sums up the principal sources of Gnosticism in these three, Platonism, the Persian religion, and the Buddhism of India. To Platonism it owed much of its philosophical form and tendencies. From the Dualism of the Per religion it derived its speculations regarding the origin of evil, and much of what it taught about emanations. To Buddhism, he thinks, it owed the doctrine of the antagonism between matter and spirit, and the unreality of derived existence—the germ of Docetism. Mansel also holds that there is the possibility that Gnosticism derived certain of its features from the Kabbala (qabbalah), or secret teaching of the Jews in the two books, the Cepher yetsirah, or Book of Creation, and the Zohar, or Book of Light. An influence of Buddhism on Gnosticism, however, may safely be doubted, as there is no reason to believe that the knowledge of Buddhist doctrine had so early penetrated into the West. The Jewish works named by Mansel are really products of the Middle Ages (Westcott, Introduction to the Study of the Gospels, 144-45). The other sources named were really influential. We notice two—the Alexandrian philosophy and the Parsic dualism.<P>1. Alexandrian Philosophy:<P>Alexandrian philosophy endeavored to unite Greek philosophy and Hebrew religion. Philo, the great Jewish commentator of Alexandria, had tried to interpret the ancient Jewish Scriptures by the aid of the Greek philosophy, to expound the Old Testament in terms of Plato\'s thought and to discover allegorical meanings where none were intended. In Philo\'s teaching there is a sharp line drawn between God and the material world: with him God cannot exert any action upon the world of matter, except through intermediate agency, the Jewish angels and the heathen demons. Philo has much to say in regard to the Logos. His utterances on this subject may be compared with what is said of the attributes of "Wisdom" in chapter <a onClick="return mV(\'Pro\',8,\'1-\');">8</a> of the Book of Proverbs, and also with the Logos or "Word" of the Gospel of John. With Philo, the Logos is the power of God, or the Divine reason endowed with energy, and embracing within itself all subordinate powers. The Logos is impersonal in its relations to God; and herein is one huge difference between Philo\'s conception and that in the gospel. Philo teaches that the Logos is the only firstborn of God, the chief of the angels, the viceroy of God, and representative of man.<P>See <a href="study/isbe/search.html?string=LOGOS">LOGOS</a>.<P>According to Philo the creation of the universe was a gradual molding out of matter; hence, arises evil. He also teaches the preexistence of the soul, which is now imprisoned in the flesh. The wise man, therefore, will break the thralldom of the flesh, and will rise by a sort of ecstasy to the immediate vision of God. It will be seen how much of this teaching was assimilated by the various Gnostic sects.<P>2. Zoroastrianism:<P>The Zoroastrian or Persian system was based on the assumption that there existed two original and independent powers of good and evil, of light and darkness, Ormuzd (Ahura-Mazda), the wise Lord, and Ahriman (Angra-Mainyu), the wicked spirit. These powers were believed to be equal, and each supreme in his own domain. The earth, which was created by Ormuzd, became the battlefield of the two powers. Ahriman led away the first man and woman from their allegiance to Ormuzd, and so all evils result to mankind.<P>"In oriental (Persian) dualism," says Professor Bousset, "it is within this material world that the good and the evil powers are at war, and this world beneath the stars is by no means conceived as entirely subject to evil. Gnosticism has combined the two, the Greek opposition between spirit and matter, and the sharp Zoroastrian dualism, which, where the Greek mind conceived of a higher and a lower world, saw instead two hostile worlds standing in contrast to each other like light and darkness. And out of the combination of these two dualisms arose the teaching of Gnosticism with its thoroughgoing pessimism and its fundamental asceticism" ("Gnosticism," in Encyclopedia Brit, 11th edition, XII, 154).<P>III. Nature of Gnosticism.<P>"Gnosticism," says Dr. Gwatkin, "is Christianity perverted by learning and speculation" (Early Church History 73). The intellectual pride of the Gnostics refined away the gospel into a philosophy. The clue to the understanding of Gnosticism is given in the word from which it is derived—gnosis, "knowledge." Gnosticism puts knowledge in the place which can only rightly be occupied by Christian faith. To the Gnostic the great question was not the intensely practical one, "What must I do to be saved from sin?" but "What is the origin of evil?" "How is the primitive order of the universe to be restored?" In the knowledge of these and of similar questions, and in the answers given to these questions, there was redemption, as the Gnostic understood it.<P>"These little Gnostic sects and groups all lived in the conviction that they possessed a secret and mysterious knowledge, in no way accessible to those outside, which was not to be proved or propagated, but believed in by the initiated, and anxiously guarded as a secret. This knowledge of theirs was not based on reflection or scientific inquiry and proof, but on revelation. It was derived directly from the times of primitive Christianity, from the Saviour Himself and His disciples and friends, with whom they claimed to be connected by a secret tradition, or else from later prophets, of whom many sects boasted. It was laid down in wonderful mystic writings, which were in the possession of the various circles.<P>"In short, Gnosticism in all its various sections, its form and its character, falls under the category of mystic religions, which were so characteristic of the religious life of decadent antiquity. In Gnosticism, as in the other mystic religions, we find the same contrast of the initiated and the uninitiated, the same loose organization, the same kind of petty sectarianism and mystery-mongering. All alike boast a mystic revelation and a deeply veiled wisdom" (Bousset, op. cit., 153).<P>Chief Points in Gnosticism:<P>The questions, therefore, with which Gnosticism concerned itself were those of the relation of the finite and the infinite, the origin of the world and of evil, the cause, meaning, purpose and destiny of all things, the reason of the difference in the capacities and in the lot in life of individual men, the method of salvation. The following may be regarded as the chief points in the characteristics of the Gnostic systems:<P>(1). A claim on the part of the initiated to a special knowledge of the truth, a tendency to regard knowledge as superior to faith, and as the special possession of the more enlightened, for ordinary Christians did not possess this secret and higher doctrine.<P>(2) The essential separation of matter and spirit, the former of these being essentially evil, and the source from which all evil has arisen.<P>(3) An attempt at the solution of the problems of creation and of the origin of evil by the conception of a Demiurge, i.e. a Creator or Artificer of the world as distinct from the Supreme Deity, and also by means of emanations extending between God and the visible universe. It should be observed that this conception merely concealed the difficulties of the problem, and did not solve them.<P>(4) A denial of the true humanity of Christ, a docetic Christology, (which looked upon the earthly life of Christ and especially on His sufferings on the cross as unreal.<P>(5) The denial of the personality of the Supreme God, and the denial also of the free will of man.<P>(6) The teaching, on the one hand, of asceticism as the means of attaining to spiritual communion with God, and, on the other hand, of an indifference which led directly to licentiousness.<P>(7) A syncretistic tendency which combined certain more or less misunderstood Christian doctrines, various elements from oriental and Jewish and other sources.<P>(8) The Scriptures of the Old Testament were ascribed to the Demiurge or inferior Creator of the world, who was the God of the Jews, but not the true God. Some of these characteristic ideas are more obvious in one, and some of them in others of the Gnostic systems. The relation of these ideas to Christian facts and doctrines is dealt with more particularly below.<P>IV. Gnosticism in the Christian Church.<P>In the New Testament and the Apostolic Age.<P>The germ of Gnosticism in the Christian church made its appearance in the apostolic age, and is referred to by Paul in several of his epistles, notably in that to the Colossians and in the Pastoral Epistles. It is also referred to by the apostles Peter and Jude; references to it are found, besides, in the Apocalypse, the First Epistle of John and the Gospel of John.<P>1. Colossians:<P>In col a great deal is said regarding a false teaching, an insidious theosophist doctrine, the teachers of which were alienating the Christians in Colosse from the gospel, and were disseminating their speculations, which led to the worship of angels in contrast to the worship of Christ, to esoteric exclusiveness wholly opposed to the universality of the gospel, and to an asceticism injurious to Christian freedom, and derogatory to the human body as indwelt by the Holy Ghost. These tenets are identical with the more fully developed Gnosticism of the generation succeeding that of the apostles; and at the root of the Colossian false teaching there lay the same error which the Gnostic mind had no way of meeting, namely, that there could be no connection between the highest spiritual agency, that is God, and gross corporeal matter.<P>From this theoretical basis arose another error—that as sin is inherent in the material substance of the body, therefore the only way by which perfection can be reached is to punish the body by asceticism, so that through the infliction of pain and the mortification of the flesh the region of pure spirit may be reached, and thus man may be etherealized and become like God. This ascetic tendency is wonderfully widespread; it reappears century after century, and shows itself in many forms of religion, not merely in distorted forms of Christianity, but in the Hindu religions, in Buddhism and elsewhere. In the Epistle to the Colossians, accordingly, there are definite references to ascetic practices which were inculcated by the false teachers at Colosse. The very terms which they employed have been preserved, "Touch not," "Taste not," "Handle not." It was in this way that these teachers had "at their own hand" invented a worship different from that of the Christian faith, which endeavored to attain the deliverance of the soul by "the neglecting of the body" (<a onClick="return mV(\'Col\',2,21,23);">Col 2:21, 23</a> the King James Version). These Gnostic teachers showed these tendencies still more boldly when Paul wrote his First Epistle to Timothy (see below), for he describes them as "forbidding to marry, and commanding to abstain from meats" (<a onClick="return mV(\'1Ti\',4,3);">1Ti 4:3</a>). These ascetic practices were afterward taught by various Gnostic sects, the Encratites, the followers of Saturninus, and others.<P>These tendencies in the Colossian church Paul set himself to correct in his epistle. The method which he adopts is not so much to demolish error, as to establish the contrary truth, setting before the Colossians the person and work of Christ, Christ the Creator, Christ in whom there dwells not merely some or even much of the fullness of God, but all the fullness of the Godhead bodily; Christ the God of providence, the Upholder of all things, in whom matter and all creatures and all events "consist" and have their being; Christ the Reconciler who has reconciled us unto God through the blood of the cross. In view of truths like these, Colossian error and all other forms of Gnosticism crumble into decay and vanish.<P>See <a href="study/isbe/search.html?string=COLOSSIANS,+EPISTLE+TO+THE">COLOSSIANS, EPISTLE TO THE</a>.<P>2. 1 Corinthians: "Knowledge" at Corinth:<P>The Epistle to the Colossians is the first of the Pauline Epistles in which distinctively Gnostic teaching is found in its attack upon the Christian faith. But from incidental notices in epistles of Paul written at an earlier period, it can be seen how congenial was the soil into which Gnostic teaching was about to fall. For even in Corinth when Paul wrote his First Epistle to the church there, there had been a claim on the part of some that they possessed "knowledge," as if others were destitute of it, a claim which the apostle refuses to admit, and meets with stern resistance. They thought themselves "wise," they were given to disputing, they professed that they "all had knowledge" (<a onClick="return mV(\'1Cr\',8,1);">1Co 8:1</a>), nay, they could "know all mysteries and all knowledge" (<a onClick="return mV(\'1Cr\',13,2);">1Co 13:2</a>); but this knowledge did not edify them, did not build them up, it only puffed them up (<a onClick="return mV(\'1Cr\',8,1);">1Co 8:1</a>); it did not make them sympathetic or tender-hearted toward the weak (<a onClick="return mV(\'1Cr\',8,\'7-11\');">1Co 8:7-11</a>).<P>3. Pastoral Epistles:<P>In <a onClick="return mV(\'1Ti\',6,20,21);">1Ti 6:20-21</a> Paul speaks of the "knowledge (the gnosis) which is falsely so called; which some professing have erred concerning the faith." In other places in that epistle reference is made to tenets which are exactly those of Gnosticism. In <a onClick="return mV(\'1Ti\',1,4);">1:4</A> the apostle speaks of "fables and endless genealogies, which minister questionings, rather than a dispensation of God which is in faith." Philo had given a great impetus to an allegorizing interpretation of the Old Testament. His writings were well known and were popular in many of the Jewish schools. These fanciful interpretations would hinder the growth of the Christian church; and this allegorizing of Scripture, joined to the teaching of the genealogies of the eons, would leave no place for a Redeemer. In <a onClick="return mV(\'1Ti\',4,3);">4:3</a>, as already noted, Paul describes ascetic practices which were regarded by their votaries as most meritorious. To abstain from marriage and from various kinds of food was the teaching of the Essenes and also of the Gnostics. This ascetic teaching was unnatural, as contrary to the constitution of the world, as that has been arranged by a holy and wise Creator, and it is also subversive of Christian liberty. Nothing can be esteemed common or unclean without throwing a reproach upon the Creator.<P>Antinomian Development.<P>But another and contrary result also followed from the principles of the sinfulness of matter and of redemption as deliverance from the flesh, namely, that there was an easier way of relief, by treating the soul and the body as separate entities which have nothing in common. Let the soul go its way on the wings of spiritual thought, while the body may indulge its fleshly desires. For, so it was held, as body and soul are entirely distinct in their nature, the spiritual cannot be defiled by anything, however carnal and gross, that the body can do. This was the antinomian development of Gnosticism. Many traces of this are apparent in the Pastoral Epistles and in 2 Peter and Jude. The Gnostics, against whom Paul warns Timothy, were "lovers of self, lovers of money, boastful, haughty, rollers, disobedient to parents, unthankful, unholy, without natural affection, implacable, slanderers, without self-control, fierce, no lovers of good, traitors, headstrong, puffed-up, lovers of pleasure rather than lovers of God; holding a form of godliness, but having denied the power thereof" (<a onClick="return mV(\'2Ti\',3,2,3,4);">2Ti 3:2-4</a>). Such, too, is the testimony borne regarding them by Ignatius (Law, The Tests of Life, 30):("they give no heed to love, caring not for the widow, the orphan or the afflicted, neither for those who are in bonds, nor for those who are released from bonds, neither for the hungry nor the thirsty." Such persons professed that they knew God, but by their works they denied Him; they were "abominable, and disobedient, and unto every good work reprobate" (<a onClick="return mV(\'Tts\',1,16);">Tit 1:16</a>). They enticed others into sins of impurity (<a onClick="return mV(\'2Ti\',3,5,6);">2Ti 3:5-6</a>). They allured others through the lusts of the flesh; and the means by which they succeeded in doing this was that they spoke great swelling words of vanity, and the end was that in their destroying of others they themselves also were surely destroyed (<a onClick="return mV(\'2Pe\',2,12,18);">2Pe 2:12, 18</a>). They were ungodly men, turning the grace of God into lasciviousness and denying our only Master and Lord, Jesus Christ; they gave themselves up to the sins of the flesh, and ran riotously after error in hope of a gain in money; they were sensual men, not having the Spirit (<a onClick="return mV(\'Jud\',1,4,8,11,19);">Jude 1:4, 8, 11, 19</a>) The entire Epistle of Jude is directed against this antinomian and licentious development of Gnosticism, and against its terrible permission of an unholy life (see below on the Book of Revelation).<P>4. 1 John:<P>In the First Epistle of John there is a distinct polemical purpose. There is no book of the New Testament which is more purposeful in its attack of error. There is "the spirit of error" (<a onClick="return mV(\'1Jo\',4,6);">1Joh 4:6</a>), opposing the Spirit of truth. "Many false prophets are gone out into the world" (<a onClick="return mV(\'1Jo\',4,1);">1Joh 4:1</a>), and this from the church itself, "They went out from us, but they were not of us" (<a onClick="return mV(\'1Jo\',2,19);">1Joh 2:19</a>); and these false prophets are distinctly named "the antichrist" (<a onClick="return mV(\'1Jo\',2,22);">1Joh 2:22</a>) and "the liar" (same place), and "the deceiver and the antichrist" (<a onClick="return mV(\'2Jo\',1,7);">2Joh 1:7</a>). This peril, against which the apostle writes, and from which he seeks to defend the church, was Gnosticism, as is proved by what is said again and again in the epistle of the characteristics of this insidious and deadly teaching.<P>(1) Gnostic Claims.<P>The Gnostic claim to knowledge throws light upon many passages in this epistle. John refers to his opponents\' using such phrases as "I know God," "I abide in Christ," "I am in the light." These lofty claims were made by persons who did not love their brethren on earth, who did not walk in Christ\'s footsteps, and who were destitute of love. The apostle therefore describes these lofty claims as false, because those who made them possessed neither love nor obedience.<P>In contrast to these Gnostic claims—for those who made them were no other than the early Gnostics—John shows how the Christ of history is the Christ of experience: for those to whom he is writing know Christ, who is from the beginning, and they know the Father. "We know him that is true, and we are in him that is true, even in his Son Jesus Christ. This is the true God and eternal life" (<a onClick="return mV(\'1Jo\',5,20);">1Joh 5:20</a>). This knowledge of God and communion with Him are attained, not by Gnostic speculation, but by the obedience of faith, the outcome of which is brotherly love and a life in which the Christian walks even as Christ did (<a onClick="return mV(\'1Jo\',2,6);">1Joh 2:6</a>). And thus also obedience and brotherly love are the test of the profession which any man may make that he knows God. "Every one also that doeth righteousness is begotten of him," (<a onClick="return mV(\'1Jo\',2,29);">1Joh 2:29</a>); "Whosoever doeth not righteousness is not of God, neither he that loveth not his brother" (<a onClick="return mV(\'1Jo\',3,10);">1Joh 3:10</a>).<P>(2) Its Loveless Nature.<P>Gnosticism was distinguished by an unethical, loveless intellectualism. This seems to be the explanation of the false teaching against which this epistle is directed. The apostle describes the dry head-knowledge which left the heart and life untouched by love, and which led men, while they professed to love God, nevertheless to remain destitute of love to their fellow-men. They did not fold their human brethren to their hearts, they were dead to the fact that where pity dwells, the love of God dwells also. In Gnosticism knowledge was in itself the supreme end and purpose of life, the sum of highest good to which a man could attain, the crown of life. The system was loveless to the core.<P>(3) Docetism.<P>Now, when the attempt was made to amalgamate these Gnostic ideas with the Christian faith, the inevitable result was Docetism. Just because God cannot have any immediate contact with matter, therefore the incarnation of Almighty God in the person of the Lord Jesus Christ is inconceivable. From this position it is, of course, only a step to deny that the incarnation and the true human life of Christ ever took place at all.<P>(4) The Antichrist.<P>The Antichrist of the First Epistle of John is docetic Gnosticism. The soul of the apostle rushes onward, with glowing zeal for the honor of his Master whom Gnosticism dishonored, to identify personally the historical Jesus with the Divine Being, "the Son of God," "the Word of Life," "the Christ." "Who is the liar but he that denieth that Jesus is the Christ? This is the antichrist, even he that denieth the Father and the Son. Whosoever denieth the Son, the same hath not the Father: he that confesseth the Son hath the Father also" (<a onClick="return mV(\'1Jo\',2,22,22);">1Joh 2:22-23</a>). It should be noted that the last clause in <a onClick="return mV(\'1Jo\',2,23);">1Joh 2:23</a>, which is printed in italics in the King James Version, is restored in the Revised Version (British and American) to its rightful position in the original text. "Every spirit that confesseth that Jesus Christ is come in the flesh is of God: and every spirit that confesseth not Jesus is not of God: and this is the spirit of the antichrist, whereof ye have heard that it cometh; and now it is in the world already" (<a onClick="return mV(\'1Jo\',4,2,3);">1Joh 4:2-3</a>).<P>(5) Its Antinomian Side.<P>The antinomian side of Gnosticism is not so directly referred to in the First Epistle of John as Docetism is; but evidences are manifest that the apostle had it clearly before him. "Little children," he writes, "let no man lead you astray: he that doeth righteousness is righteous, even as he is righteous: he that doeth sin is of the devil" (<a onClick="return mV(\'1Jo\',3,7,8);">1Joh 3:7-8</a>). And these were the methods by which those deceivers endeavored to lead the members of the church astray. They alleged that sin was a thing indifferent in itself. It made no difference to the spiritual man whether he sinned with his body or not. It is for this reason that the apostle, in opposing those teachers, insists that "sin is lawlessness" (<a onClick="return mV(\'1Jo\',3,4);">1Joh 3:4</a>); "All unrighteousness is sin" (<a onClick="return mV(\'1Jo\',5,17);">1Joh 5:17</a>); "Whosoever is begotten of God doeth no sin" (<a onClick="return mV(\'1Jo\',3,9);">1Joh 3:9</a>); "In this the children of God are manifest, and the children of the devil: whosoever doeth not righteousness is not of God, neither he that loveth not his brother" (<a onClick="return mV(\'1Jo\',3,10);">1Joh 3:10</a>). The whole passage presupposes, as familiar to its readers, a doctrine of moral indifferentism, according to which the status of the \'spiritual\' man is not to be tested by the commonplace facts of moral conduct" (The Tests of Life, 34).<P>See <a href="study/isbe/search.html?string=JOHN,+THE+EPISTLES+OF">JOHN, THE EPISTLES OF</a>.<P>5. "To Know the Depths": Revelation:<P>As time advanced, and the later books of the New Testament were written, Gnosticism assumed more of its distinctive peculiarities. "Those who had knowledge" regarded themselves as a superior order of believers. One of their phrases was "to know the depths" (<a onClick="return mV(\'Rev\',2,24);">Re 2:24</a> the King James Version), and this was valued far more highly than love and obedience. "From this language, we may, I think, infer the existence of an Ophite sect, boasting of its peculiar gnosis, before the date of the Apocalypse" (Mansel, The Gnostic Heresies, 105). The claim of the Ophites was that they alone knew "the depths." "Yes," is the apostle\'s reply to claims of this kind, "yes, the depths, but not of God, the depths of Satan"; for such is a just description of a teaching which ascribed the origin and the working of evil to God. It is in the light of Gnostic teaching of this sort that the meaning can be seen of the same apostle\'s language in his First Epistle, "And this is the message which we have heard from him and announce unto you, that God is light, and in him is no darkness at all" (<a onClick="return mV(\'1Jo\',1,5);">1Joh 1:5</a>).<P>The Nicolaitans.<P>In the Epistles to the Seven Churches in the Apocalypse there are other references to Gnosticism. Who the Nicolaitans were (<a onClick="return mV(\'Rev\',2,6,15);">Re 2:6, 15</a>) is not absolutely certain; but it is not unlikely that they were so called because of their having assumed the name of "Nicolaus, a proselyte of Antioch" (<a onClick="return mV(\'Act\',6,5);">Ac 6:5</a>). The first step to the reception of Gentile believers into the Christian church on an equal footing with the Jews may have been the appointment of Nicolaus as one of the first deacons, for the facts that he was a native of Antioch and a proselyte, show that he had been a heathen by birth. And it is noteworthy to find such a person appointed to office in the church at so very early a period, even before the conversion of the apostle Paul. The Nicolaitans therefore may have distorted in an antinomian sense the doctrine taught by Nicolaus, who in all probability proclaimed the liberty of the gospel, as his fellow-deacon, Stephen, did (<a onClick="return mV(\'Act\',7,\'1-\');">Ac 7</a> throughout). But the liberty claimed by the Nicolaitans was liberty to sin. They are mentioned in the Epistle to Ephesus, and their deeds are characterized as deeds which Christ hates (<a onClick="return mV(\'Rev\',2,6);">Re 2:6</a>). Their name occurs again in the Epistle to Pergamum, and there also their doctrine is described as a doctrine which the Lord hates (<a onClick="return mV(\'Rev\',2,15);">Re 2:15</a>). Their teaching was one of licentiousness—eating things sacrifical to idols, and committing fornication (<a onClick="return mV(\'Rev\',2,14);">Re 2:14</a>). Again in the Epistle to Thyatira, the Gnostics are spoken of as practicing the same evil courses, and as holding a doctrine of "the depths of Satan" (<a onClick="return mV(\'Rev\',2,20,21,24);">Re 2:20-21, 24</a> the King James Version)—see above. The persons mentioned in the Epistle to Philadelphia were also evidently Gnostics. They are described as being "of the synagogue of Satan" (<a onClick="return mV(\'Rev\',3,9);">Re 3:9</a>).<P>"In the language of Jude, as in that of Peter, which it closely imitates, we may clearly discern a reference to the Gnostic sect of the Nicolaitans mentioned by name in Revelation. The comparison in all these passages, of the error condemned with that of Balaam, is decisive as to the identity of the persons intended. The other characteristics noted by Peter are also repeated by Jude—their denial of the Lord, their profligate lives, their contempt of government, and evil speaking of dignities and of things that they know not, their pollution of the feasts of charity, their great swelling words. The antinomian, no less than the ascetic side of Gnosticism, seems by this time to have fully manifested itself" (Mansel, The Gnostic Heresies, 71).<P>V. The Christian Antithesis.<P>The principal points of contrast between Gnosticism and Christian teaching in regard to leading doctrines will now be apparent, and can be briefly summarized.<P>1. God and the World:<P>According to the Gnostics, God is thought of as the ultimate, nameless, unknowable Being, of whom they speak as the "Abyss." He is perfect, but the material world is alien to the Divine nature. How then does it come to exist at all? What is the source of its imperfections and evils?<P>How Did the World Originate?<P>The Gnostic answer is that the pleroma or fullness of the Deity (see <a href="study/isbe/search.html?string=FULLNESS">FULLNESS</a>) could flow out in no other way than in emanations or eons or angels, all of which are necessarily imperfect, the highest of these emanations or eons or angels being more spiritual than the grade immediately below it. Of these eons there is a gradation so numerous, that at length the lowest of them is almost wholly corporeal, the spiritual element having been gradually diminished or eliminated, until at last the world of man and of matter is reached, the abode of evil. In this way the gulf is bridged between God and the world of mankind. The highest eons approximate closely to the Divine nature, so spiritual are they and so nearly free from matter. These form the highest hierarchy of angels, and these as well as many other grades of the angelic host are to be worshipped.<P>In opposition to this view, Christian faith worships God as the free self-sufficient Creator, infinitely good and wise and powerful and holy, the Author of all things, and affirms creation as an incomprehensible fact revealed to faith, and which rises above the grasp of the understanding. "By faith we understand that the worlds have been framed by the word of God, so that what is seen hath not been made out of things which do appear" (<a onClick="return mV(\'Hbr\',11,3);">Heb 11:3</a> the King James Version).<P>2. Evil:<P>The doctrine of evil follows directly from the above account of the relation of God to the world. According to Gnosticism the manifestation of God is possible only through self-limitation on His part, for in His essence God is the unfathomable Abyss. Through this Divine self-limitation are evolved, first, the Divine powers or attributes, which previously were hidden in the Abyss of His being. These Divine powers (the pleroma) become the principles of all further developments of life. Life continues to be unfolded in such a way that its successive grades sink farther and farther from the purity of God, the life is feebler the nearer they come to matter, with which, at length, they blend. Such, according to Gnosticism, is the origin of evil.<P>Whenever men are not content with acknowledging evil to be the act of their own free will, which has chosen to forsake its absolute dependence upon God; whenever they go beyond this and seek for another origin of evil, then one of two results follows. They either limit the holiness of God, and find the cause of evil in God Himself, thus annihilating all distinction between good and evil—which is Pantheism; or they limit the power of God by granting the existence of an eternal evil power beyond the control of God—which is Dualism. In avoiding Pantheism, Gnosticism accepted the dualistic solution, ascribing to evil an eternal self-subsistent nature, which is to make it absolute as God Himself is. As absolute self-subsistence can be affirmed of none but God, the eternally self-subsistent evil of Dualism must be God, which it cannot possibly be, because it is not good. Here is the self-contradiction on which Gnosticism was wrecked.<P>(1) The Christian Doctrine of Sin.<P>Directly contrary to this is the Christian doctrine, according to which evil is the refusal of the creature-will to lean absolutely and utterly on God, upon His care and love and upholding grace. Sin is that which ought not to be; it has no right to exist at all; it is defiance of God; it is moral transgression; its magnitude cannot be exaggerated. If it could, it would dethrone God. It has defied His righteousness and wisdom and holiness and even His grace. Sin therefore is dealt with by God in two ways, either by direct punishment or by redemption, in which provision is made for its removal by its being borne by the Lamb of God who taketh away the sin of the world.<P>The Gnostic idea of the origin of evil follows at once from, and is inseparably involved in, their dualistic interpretation of nature. The question "What is sin?" is no mere academic or philosophical discussion, in which one opinion may be as good as another. "Everything in Christianity is connected more or less directly with the great facts of Sin and Redemption; and the plan of Redemption, which is the essence of Christianity, cannot be rightly understood until the doctrine of Sin be adequately recognized and established. Here, certainly, if anywhere, Christian theology must fight pro aris et focis" (Julius Muller, quoted in Dr. Orr\'s Sin as a Problem of Today, 6).<P>(2) Sin and the Moral Law.<P>The universality of sin, its persistence, its gravity, its power to destroy and to deprave—these are facts which can hardly be exaggerated. To view sin aright, it is impossible to leave out of sight its relation to moral law, to God, and to His kingdom. Sin is the transgression of moral law; it is transgression also against a holy God, of whose character and will moral law is a transcript or reflection. "Sin is transgression against God, the substitution of the creature-will for the will of the Creator; revolt of the creature-will from God" (Sin as a Problem of Today, 7). It is the resolve of the will to make itself independent of God and to renounce His authority. Sin is self-will, false independence, freedom which ends in bondage and misery.<P>But in Gnosticism sin is something quite different; it is not the act and the disposition of the human will in rebellion against God; it is only a physical fact or quality inherent in the body and in matter everywhere. Redemption therefore does not consist in the work of Christ for us on the cross, and the applying of the benefits of that work by the Holy Spirit of God in the renewal of the moral nature of man. Redemption is simply each man\'s efforts to secure emancipation from the flesh—from physical evil.<P>3. Christ and Redemption:<P>It is easily seen that a system of this kind had no need of Christ and leaves no place for redemption in the Christian sense of that term. Redemption in this scheme of thought is not deliverance from sin, it is not removal of guilt and renewing of the mind. It is something quite different, and consists in the restoration of the cosmic order and illumination of the mind of the select few through knowledge. Christ is not the Saviour who saves His people from their sins, and who gives them unceasingly, through union with Himself, deliverance from the power of sin. He is only one of the eons, the highest of them. He is an originated being, and not God. There is thus no place in Gnosticism either for the creation of the universe by God, or for the incarnation and work of Christ. Once grant that matter is essentially evil, and there is excluded the possibility of Christ\'s having assumed a true human nature, simply for the one reason that the world and human nature are originally and necessarily evil. Thus, as already seen, we are landed in Docetism.<P>The Christology of the Gnostics accordingly assumed one of two types. "One class of early Gnostics separated the spiritual being Christ from the man Jesus; they supposed that the Christ entered Jesus at the time of His baptism, and left Him at the moment of His crucifixion. Thus the Christ was neither born as a man nor suffered as a man. In this way they obviated the difficulty, insuperable to the Gnostic mind, of conceiving the connection between the highest spiritual agency and gross corporeal matter, which was involved in the Catholic doctrine of the Incarnation and Passion, and which Gnostics of another type more effectually set aside by the doctrine of Docetism, i.e. by assuming that the human body of our Lord was only a phantom body, and not real flesh and blood. Irenaeus represents the former class as teaching that \'Jesus was the receptacle of the Christ,\' and that the Christ \'descended upon Him from heaven in the form of a dove, and after He had declared to mankind the nameless Father, entered again into the pleroma imperceptibly and invisibly.\' Here no names are given. But in another passage he ascribes precisely the same doctrine, without however naming the pleroma, to Cerinthus" (Lightfoot, Col, 264). How strenuously this doctrine was combated in apostolic circles has already been shown in speaking of John\'s First Epistle.<P>4. Asecticism and Antinomianism:<P>The necessary consequence of the Gnostic theory in an ascetic morality which passed over by sure steps into antinomian license has likewise been fully illustrated in the foregoing, and need not be further enlarged on. The whole has its root in a false intellectualism, to which the gospel in its inculcation of humility, faith and dependence upon God\'s Spirit for guidance into truth is, in its inmost principle, opposed.<P>VI. Harnack\'s View of Gnosticism.<P>Harnack\'s view of Gnosticism differs from that now given in laying the chief emphasis on its Judeo-Hellenistic side. He describes well how, when Christianity appeared, an extensive spiritualizing or allegorizing of the Old Testament had already taken place. "This spiritualizing was the result of a philosophic view of religion, and this philosophic view was the outcome of a lasting influence of Greek philosophy, and of the Greek spirit generally, upon Judaism. In consequence of this view, all facts and sayings of the Old Testament in which one could not find his way, were allegorized. Nothing was what it seemed, but was only the symbol of something invisible. The history of the Old Testament was here sublimated to a history of the emancipation of reason from passion" (History of Dogma, I, 223). This allegorical interpretation disclosed to the mature mind a wealth of relations, of hints and of intuitions from the Old Testament, which to the uninitiated was only a dry record of fact. This view of the Old Testament gave its readers a strange interest, which proceeded to transfer their ancient Jewish hopes into the world of Greek philosophy, and transformed the result into a metaphysic. When these thinkers entered the Christian church, Christian hopes and terms were added to the already existing Judaic-Greek-Alexandrian compound, and such was Gnosticism. It represented the acute secularizing or Hellenizing of Christianity. The Gnostics "are therefore those Christians, who, in a swift advance, attempted to capture Christianity for Hellenic culture, and Hellenic culture for Christianity, and who gave up the Old Testament in order to facilitate the conclusion of the covenant between the two powers and make it possible to assert the absoluteness of Christianity" (p. 227).<P>Harnack indeed grants that there were other elements in Gnosticism, but he strongly asserts that the Greek element was the predominating one. In this he seems to us to be in error. Laying the chief emphasis on Hellenism, he fails to give the due and preponderating place to eastern dualism. As already seen, an eastern dualistic theosophy is the chief element in Gnosticism. This eastern source is also acknowledged by Harnack, but only as if it were subsidiary to Hellenism. As he regards it, "Gnosticism was an acute Hellenizing of Christianity" (p. 230).<P>In regard to the fundamental philosophic doctrines of Gnosticism, the indefinable nature of the Divine primeval Being, the sinfulness of matter, the fullness of God in eons, the Demiurge, etc., Harnack agrees generally with other writers, and adds, "All these are ideas for which we find the way prepared in the philosophy of the time, anticipated by Philo, and represented in neo-Platonism as the great final result of Greek philosophy" (p. 233).<P>VII. Influence and Development of Gnosticism.<P>Gnosticism is peculiarly the heresy of the 2nd century, and in itself a proof of the extent to which a knowledge of the Christian faith had, at that early period, penetrated in literary and philosophical circles. Though it is true that Christianity at first influenced chiefly the humbler classes, yet it was not among these persons that the various Gnostic heresies arose.<P>1. Not a Heresy of the Humbler Classes:<P>Gnosticism "was a product which did not spring up spontaneously in the minds of the mechanics and slaves and women and children, whom most, like Celsus, suppose to have formed the bulk of the Christian communities, but could only have taken its rise in minds of a more cultured and speculative cast. This, indeed, was its claim—to be a religion of gnosis (knowledge), for the more highly trained or elite. It could only exist at all, therefore, as the result of a Christian ferment which had entered these speculative circles, and was there powerfully at work. Baur rightly appreciates the situation, when he says: \'Gnosticism gives the clearest proof that Christianity had now come to be one of the most important factors in the history of the time, and it shows especially what a mighty power of attraction the new Christian principles possessed for the highest intellectual life then to be found either in the pagan or in the Jewish world.\' Above all, these systems are a striking witness to the impression produced on the heathen mind by the great Christian idea of redemption. \'When the Gnostic systems,\' says Neander, \'describe the movement which was produced in the kingdom of the Demiurge by the appearance of Christ as the manifestation of a new and mighty principle which had entered the precincts of this lower world, they give us to understand how powerful was the impression which the contemplation of the life of Christ and His influence on humanity, had left on the minds of the founders of these systems, making all earlier institutions seem to them as nothing in comparison with Christianity.\' We must beware, therefore, of underestimating either the extent or the intensity of this great intellectual ferment set up by the gospel in the heart of heathenism" (Orr, Neglected Factors, etc., 196).<P>2. Cerinthus: His Teaching:<P>The earliest of the Gnostics known to us by name is Cerinthus, the antagonist of the apostle John. It seems to be beyond reasonable doubt that these two encountered each other at Ephesus. Irenaeus relates on the authority of those who heard the story from Polycarp how the apostle and Cerinthus met in the public baths in that city. When John discovered that Cerinthus was in the same building with him, he instantly left, exclaiming that he could not remain while Cerinthus, the enemy of God and of man, was there. From the accounts which have been preserved of Cerinthus and of his teaching, it can be gathered that he taught that the world was created not by the Supreme God, but by an inferior power, and that he also taught a docetic theory of the Incarnation. Caius of Rome, a disciple of Irenaeus, records that Cerinthus held that there would be a millennium of unrestrained sensuality. Dionysius of Alexandria (circa 260 AD) more than confirms this. "Thus so far as they go, the historical data harmonize with the internal evidence of the Epistle (of John) itself, in giving the impression that the different tendencies it combats are such as were naturally combined in one consistently developed Gnostic system, and that the object of its polemic is, throughout, one and the same" (The Tests of Life, 37).<P>As regards the Gospel of John there is the testimony of Irenaeus, that it was written to oppose that form of Gnosticism which was taught by Cerinthus, and, before him, by the Nicolaitans. The nature of that heresy may be stated in the words of Irenaeus himself:<P>"A certain Cerinthus," he says, "in Asia, taught that the world was not made by the Supreme God, but by some power altogether separate and distinct from that Sovereign Power which is over the universe, and one ignorant of the God who is over all things. He taught, moreover, that Jesus was not born of a virgin (for this seemed to him to be impossible), but was the son of Joseph and Mary, born after the manner of other men; though preeminent above other men in justice and prudence and wisdom; and that after His baptism the Christ, in the form of a dove, descended upon Him from that Sovereign Power which is over all things; and that He then announced the unknown Father and wrought miracles; but that, at the end, the Christ departed again from Jesus, and that Jesus suffered and was raised from the dead, while the Christ continued impassible, as a spiritual being" (Mansel, The Gnostic Heresies, 74).<P>3. The Gospel of John:<P>Such a passage as <a onClick="return mV(\'Jhn\',19,34,35);">Joh 19:34-35</a> seems to refer to docetic Gnosticism, and to be a personal protest against it. After describing the piercing of Christ\'s side by the soldier\'s spear, and how "straightway there came out blood and water," the apostle adds, "And he that hath seen hath borne witness, and his witness is true: and he knoweth that he saith true, that ye also may believe." There are many other passages which seem to be directed against Docetism, e.g. "The Word became flesh, and dwelt among us (and we beheld his glory)" (<a onClick="return mV(\'Jhn\',1,14);">1:14</A>); "Jesus therefore, being wearied with his journey, sat thus by the well" (<a onClick="return mV(\'Jhn\',4,6);">4:6</A>); "Reach hither thy finger, and see my hands; and reach hither thy hand, and put it into my side: and be not faithless, but believing" (<a onClick="return mV(\'Jhn\',20,27);">20:27</a>).<P>Cerinthus seems to have taught that the religion of Christ was identical with undiluted Mosaism, including even circumcision and the earthly kingdom of the future. The Cerinthian theory, however, was held under various forms by its adherents, some teachers holding that the God of the Old Testament was, at the best, a subordinate angel of limited power, wisdom and goodness, and that the creation of the world was very imperfect. Others went so far as to identify the God of the Old Testament with Satan. The ethic of systems such as these was antinomian, sometimes even going the length of libertinism.<P>Generally, the forms under which Gnosticism appeared varied greatly in different periods. Some went farther than others from the Christian faith.<P>4. Various Sects:<P>Some communities, such as the Encratites, laid the greatest stress on the necessity for asceticism; other communities were wholly docetic; the Carpocratians taught the philosophy and communism of Plato. One of these teachers, Epiphanes, was honored as a god, and this sect crowned the image of Jesus along with those of Pythagoras, Plato and Aristotle. Further, there were impostors of all varieties: magicians, soothsayers, jugglers, deceivers and hypocrites, "who appeared using mighty words with a host of unintelligible formulas and taking up with scandalous ceremonies in order to rob men of their money" (Harnack, op. cit., 239), and even for viler purposes.<P>(1) The Ophites.<P>Gnosticism, before reaching its full development, is chiefly represented by the Ophite sects or systems. These were so named from the word ophis, "serpent," to which they paid honor as the symbol of intelligence. They held that the Creator of the world was an ignorant and imperfect being, Ialdaboth, the Son of Chaos; and that it was a meritorious act when the serpent persuaded Adam and Eve to disobey him, There were several of the Ophite sects, such as the Cainites, who reversed all the standards of moral judgment, choosing as their heroes the persons whom the Bible condemned, such as Cain, the men of Sodom, Esau and Korah.<P>(2) Valentinus.<P>By the time of Justin Martyr (circa 150 AD), Gnosticism had become divided into a variety of sects and schools, Valentinians, Basilideans, Saturninians and Marcionites. In the Valentinian system, Christ and the Holy Spirit were two eons. The Valentinians granted that ordinary Christians were better than the heathen, and that they might look forward to a kind of salvation; even now ordinary Christians occupied a middle position, better than the "hylic" or "psychic," but inferior to the "pneumatic" or "spiritual," as the Gnostics termed themselves.<P>(3) Basilides.<P>The Basilideans take their name from Basilides of Alexandria, a man of powerful intellect. He and his son Isidore taught this system, which was afterward considerably modified for the purpose of popular apprehension. The world is continuously evolved from a pansperma or "seed of the world," in which all things were originally potentially contained. It is ruled by two great Archons, who yet subserve the designs of the Supreme. There are no eons, but the highest "light" descends through the successive spheres till it rests on Jesus of Nazareth. The process is complete when the Divine element ("sonship") is all drawn out and restored to God; oblivion then falls on lower intelligences. Many fine sayings are attributed to Basilides, e.g. "I will say anything rather than doubt the goodness of Providence" (Orr, The Early Church, 75).<P>(4) Saturninus.<P>The Saturninians were so called from Saturninus, said to be a disciple of Menander, who in turn is said to have been a disciple of Simon Magus. The system of Saturninus is marked both by a strong dualism and by a gloomy asceticism. He is also reported to have been one of the founders of the Encratite heresy, which condemned marriage. Tatian, Justin Martyr\'s disciple, became a member of this Gnostic sect, holding, it is alleged, the usual theory of eons, and that there was a Demiurge, who was not the Supreme God.<P>(5) Marcion.<P>Marcion, a native of Pontus, taught in Rome circa 140-55 AD. His system differs much from ordinary Gnostic theories, except that he absolutely distinguished between the God of the Old Testament, who is regarded as merely great, harsh, rigorous, and the good God of the New Testament, who is wholly love. He also held to the usual Gnostic dualism and docetism. Marcion\'s system has been described as an overstrained Paulinism, as he lays the stress on faith, not on knowledge. Marcion was the author of a book called the Anthitheses, which contrasted the Old Testament with the New Testament. He also drew up a canon of Scripture, which contained only one gospel, namely, Luke in a mutilated state, and ten Epistles of Paul. Marcion was a rigorous ascetic. In the Lord\'s Supper he allowed only water to be used instead of wine. The Marcionites refused baptism to married persons. This sect or "church" endured for several centuries.<P>5. Relation to the Old Testament:<P>"All the Gnostic systems had one feature in common, namely, that they regarded the Old Testament and the New Testament as revelations of two different Gods, and considered the mission of Christ to proceed from a higher power than the God of the Jewish religion, who was identified with the Demiurge, or Maker of the world. But under this common assumption there was room for two very opposite estimates of the older revelation and of the God whom it reveals. Some of the Gnostic sects regarded the Demiurge as being altogether alien from and opposed to the Supreme God; others considered him merely as a subordinate power, inferior but not hostile to the Supreme God, and acting before the coming of a more perfect revelation, as his unconscious organ" (Mansel, The Gnostic Heresies, 45). "There can be no doubt that the Gnostic propaganda was seriously hindered by the inability to organize and discipline churches, which is characteristic of all philosophic systems of religion" (Harnack, History of Dogma, I, 252). "From about 210 they ceased to be a factor of the historical development, though the church of Constantine and Theodosius was alone really able to suppress them" (ibid., 251).<P>6. The Christian Verities:<P>In contrast to Gnosticism the Christian church held fast to these great facts, that Jesus Christ is the Son of God, preexistent before the Incarnation, and manifest in the flesh and crucified for us men and for our salvation; that He rose from the dead; that the Old Testament is a true revelation of the one supreme and holy God, the Creator of all things. Dualism, the eternity of matter and its inherent evil, as well as Docetism and oriental mythologies were accordingly rejected as contrary to the Christian faith.<P>7. Influence on Theology:<P>During the period of the prevalence of Gnosticism there took place the earlier developments of Christian theology. Gnosticism gave a powerful impetus to the formation of a New Testament canon of Scripture; and to the shaping of the earliest creed.<P>See <a href="study/isbe/search.html?string=APOSTLES\'+CREED.">APOSTLES\' CREED</a>.<P>8. Truth Underlying Docetism:<P>In the revulsion from Gnosticism and Docetism it should not be forgotten that there is truth to be found even amid the errors of these systems. Docetism was an over-statement of a great truth, an over-statement so large as to destroy the true humanity of our Lord. But the truth in Docetism is that the eternal Christ touches and appeals to and has a definite relationship to and actually influences every human heart; and also, that, to the Christian believer, Christ is more and does more than this; Christ dwells in the believer\'s heart by faith, "Christ in you, the hope of glory" (<a onClick="return mV(\'Col\',1,27);">Col 1:27</a>). "Docetism was not all folly. Rather we may regard it as one primitive form of the assertion of that mystical element which has never been wanting to Christianity from the first days until now, and we may be sure, never will be wanting to it" (Sanday, Christologies Ancient and Modern, 9).<P>VIII. Modern Gnosticism.<P>Gnosticism in its ancient form has passed away, but it is interesting to observe how its spirit reappears from time to time in modern days. Gnosticism, as already seen, is not one aspect of thought alone, but many. And in one form or another it is seen again and again. For example, the modern denial of the virgin birth of our Lord is that form of Gnosticism which taught that the man Jesus became Christ only at His baptism, when the Holy Spirit descended upon Him from heaven.<P>Phases of Gnostic teaching are reproduced in modern pantheistic philosophies and other forms of religious doctrine, which hold that there has been no objective atonement and no resurrection of Christ from the dead. "Basilides with his powerful speculative grasp and all-embracing evolutionary process might be termed the Hegel of the movement; Valentinus with
