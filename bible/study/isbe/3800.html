his robe of fantasy and triple fall and redemption was its Schelling; Marcion with his severe practical bent, his doctrine of faith, and his antitheses of the just God and the good, might without straining be termed its Ritschl" (Orr, The Progress of Dogma, 59).<P>"Fichte said, \'There were no external realities at all, they were the mere objectivity of the subject or creations of the inward eye\'; after Fichte came Schelling, and Schelling said, \'Then this creating eye is God\'s own eye\'; and after Schelling came Hegel, and Hegel said that \'God and man are one, and God all men, and all men God, and the whole universe God eternally thinking in the process of development,\' and that or something like it is Hegelianism. I feel in studying this philosophy, as Baron Humboldt says he felt, when he experienced the first shock of an earthquake. I feel a dreadful sense of restlessness and insecurity. The ground seems to give way beneath, and the earth and the heaven to dissolve, the universe becomes a dream, a myth" (W.B. Robertson, D.D., Martin Luther, German Student Life, etc., 138).<P>"Philosophy," says Mansel, "striving after a first principle which shall be one and simple and unconditioned and incapable of all further analysis in thought, is naturally tempted to soar above that complex combination of attributes which is implied in our conception of personality, and in endeavoring to simplify and purify our representation of the Divine nature, ends by depriving it of every attribute which can make God the object of any religious feeling or the source of any moral obligation" (The Gnostic Heresies, 11). God is no longer the author and source of goodness and truth and moral law, but the mind is occupied with the metaphysical relation between God and the world, as absolute and relative, cause and effect, principle and consequence, and God becomes identical with the world.<P>It is easily seen how teaching of this sort strikes at the root of all religion and morality. The personality of God, the personality and free will of man, the existence of moral evil, the incarnation of our Lord Jesus Christ, the redemption which He accomplished for the world, His resurrection, the whole significance of His person and His work—all is denied. This is the spirit and the meaning of Gnosticism.<P>Dr. Gwatkin sums up the matter thus: "Gnosticism undermined Christian monotheism by its distinction of the Creator from the Supreme, Christian morals by its opposition of the philosopher to the unlearned, Christian practice by its separation of knowledge from action; and it cut away the very basis of the gospel whenever it explained away its history. In every case it had got hold of truth on one side—the reality of evil in the world, the function of knowledge in religion, the difference between the letter and the spirit; but fragments of truth are not enough for a gospel, which is false if all truth is not summed up in Christ. Therefore, there could be no peace between the Gnostic illuminati and the Christian churches" (Early Church History, II, 68). LITERATURE.<P>Uhlhorn, The Conflict of Christianity with Heathenism; Neander, Church History, Antignostikus; Reuss, History of Christian Theology in the Apostolic Age; Lightfoot, Notes on Epistles of Paul, Colossians, Philippians; Gwatkin, Early Church History to 313 AD, II; W. Bousset, article "Gnosticism," Encyclopedia Brit, 11th edition; Harnack, History of Dogma, I (English translation); Orr, Neglected Factors in the Study of the Early Progress of Christianity, Sin as a Problem of Today, The Progress of Dogma, The Early Church; Mansel, The Gnostic Heresies; Robert Law, B.D., The Tests of Life.``155';
isbe[3842]='Go`(halakh, yalakh, bo\', yatsa\'; ago, hupago, anabaino, erchomi, aperchomai, poreuomai): "Go" ("went," etc.) occurs very frequently in the English Bible, and is the translation of a great many different Hebrew and Greek terms. As the word implies movement of all kinds, physical and mental, it has naturally many applications.<P>1. In the Old Testament:<P>In the Old Testament halakh and yalakh are among the commonest words, meaning "to go" in its original sense of "to walk," but also in the most varied senses, according to the verbal conjugations, etc., the preposition attached, and the words in connection with which the terms stand; halakh and yalakh are often used figuratively (translated "to walk," etc.) for to live, to pursue a way of life, e.g. "to walk ever in his ways" (<a onClick="return mV(\'Deu\',19,9);">De 19:9</a>; compare <a onClick="return mV(\'Psa\',15,2);">Ps 15:2</a>; <a onClick="return mV(\'Psa\',89,30);">89:30</a>; <a onClick="return mV(\'1Ki\',2,3);">1Ki 2:3</a>; <a onClick="return mV(\'1Ki\',3,3);">3:3</a>, etc.); to die, "He departed (Hebrew "went") without being desired" (<a onClick="return mV(\'2Ch\',21,20);">2Ch 21:20</a>); bo\', properly "to go in," "to enter" (e.g. <a onClick="return mV(\'Gen\',7,9);">Ge 7:9</a>), is very common, and yatsa\', "to go or come out," also occurs frequently; yatsa\', has frequently the meaning "to go forth," e.g. <a onClick="return mV(\'Gen\',8,7);">Ge 8:7</a>, "He sent forth a raven, and it went forth." Other frequent words are yaradh, "to go down" (<a onClick="return mV(\'Gen\',11,7);">Ge 11:7</a>, etc.); \'alah, "to go or come up" (<a onClick="return mV(\'Gen\',2,6);">Ge 2:6</a>, etc.; <a onClick="return mV(\'Isa\',15,5);">Isa 15:5</a>, "go it up," the King James Version); used also figuratively, e.g. "to rise up or excel" "Thou excellest them all" (<a onClick="return mV(\'Pro\',31,29);">Pr 31:29</a>), "to come up on the nears," to be remembered, "The former things shall not be remembered, nor come into mind" (<a onClick="return mV(\'Isa\',65,17);">Isa 65:17</a>; compare <a onClick="return mV(\'Jer\',3,16);">Jer 3:16</a>); \'abhar, "to go or pass over," "to cross" (<a onClick="return mV(\'Gen\',41,46);">Ge 41:46</a>, etc.), also used figuratively "to pass away," e.g. "as chaff that passeth away" (<a onClick="return mV(\'Isa\',29,5);">Isa 29:5</a>), \'passeth by transgression\' (<a onClick="return mV(\'Mic\',7,18);">Mic 7:18</a>); shubh, "to go again" (<a onClick="return mV(\'Gen\',43,2);">Ge 43:2</a>, etc.); satah and cur, "to go aside," occur several times with the meaning of wrongdoing (e.g. <a onClick="return mV(\'Num\',5,12);">Nu 5:12</a>; <a onClick="return mV(\'Deu\',28,14);">De 28:14</a>, the Revised Version (British and American) "turn aside"); nasa\', "to remove" (<a onClick="return mV(\'Exd\',14,15);">Ex 14:15</a>), "Speak unto the children of Israel that they go forward" (<a onClick="return mV(\'Exd\',14,19);">Ex 14:19</a> "removed"; <a onClick="return mV(\'Num\',2,24);">Nu 2:24</a> etc.); \'azal (Aramaic), "to go away or about" (<a onClick="return mV(\'Ezr\',4,23);">Ezr 4:23</a>; <a onClick="return mV(\'Dan\',2,17);">Da 2:17</a>, etc.). Many other words occur only once or twice, e.g. \'arach, "to travel" Job (<a onClick="return mV(\'Job\',34,8);">34:8</a>); \'ashar, "to go straight or right" (<a onClick="return mV(\'Pro\',4,14);">Pr 4:14</a>; <a onClick="return mV(\'Pro\',9,6);">9:6</a>, the Revised Version (British and American) "walk"); darakh, "to tread" (<a onClick="return mV(\'Isa\',59,8);">Isa 59:8</a>); dadhah, "to go softly" (<a onClick="return mV(\'Psa\',42,4);">Ps 42:4</a>; <a onClick="return mV(\'Isa\',38,15);">Isa 38:15</a>, the Revised Version, margin "as in solemn procession"); raghal, "to stir" "to move" "I taught Enhraim to go" (<a onClick="return mV(\'Hsa\',11,3);">Ho 11:3</a>, the Revised Version (British and American) "to walk").<P>The obsolete expression "go to" (derived from Tyndale) is the translation of yahabh in <a onClick="return mV(\'Gen\',11,3,4,7);">Ge 11:3-4, 7</a>; <a onClick="return mV(\'Gen\',38,16);">38:16</a>; <a onClick="return mV(\'Exd\',1,10);">Ex 1:10</a>, "come on," the Revised Version (British and American) "come"; of bo\' (<a onClick="return mV(\'2Ki\',5,5);">2Ki 5:5</a> the Revised Version (British and American)), "go now"; na\' (<a onClick="return mV(\'Jdg\',7,3);">Jud 7:3</a>; <a onClick="return mV(\'Isa\',5,5);">Isa 5:5</a>; <a onClick="return mV(\'Jer\',18,11);">Jer 18:11</a>, omitted in the Revised Version (British and American)).<P>2. In the New Testament:<P>In the New Testament anabaino is "to go up" (<a onClick="return mV(\'Mat\',3,16);">Mt 3:16</a>; <a onClick="return mV(\'Mat\',5,1);">5:1</a>, etc.); erchomai, "to go on" (<a onClick="return mV(\'Mat\',12,9);">Mt 12:9</a>, etc.); aperchomai, "to go off or away" (<a onClick="return mV(\'Mat\',2,22);">Mt 2:22</a>; <a onClick="return mV(\'Mat\',4,24);">4:24</a>, etc.); poreuomai, "to go or pass on" (<a onClick="return mV(\'Mat\',2,8,20);">Mt 2:8, 20</a>, etc.); hupago, "to go away" (<a onClick="return mV(\'Mat\',5,41);">Mt 5:41</a>; <a onClick="return mV(\'Mat\',8,32);">8:32</a>, etc.). We have also other combinations with different shades of meaning, e.g. huperbaino, "to go over or beyond" (<a onClick="return mV(\'1Th\',4,6);">1Th 4:6</a>); eiserchomai, "to go into" (<a onClick="return mV(\'Mat\',7,13);">Mt 7:13</a>; <a onClick="return mV(\'Mat\',15,11);">15:11</a>, etc.); proporeuomai, "to go before" (<a onClick="return mV(\'Luk\',1,76);">Lu 1:76</a>; <a onClick="return mV(\'Act\',7,40);">Ac 7:40</a>), and other forms; ago (agomen), "Let us go" (<a onClick="return mV(\'Mat\',26,46);">Mt 26:46</a>; <a onClick="return mV(\'Jhn\',14,31);">Joh 14:31</a>, etc.); age is rendered "go to" (<a onClick="return mV(\'Jam\',4,13);">Jas 4:13</a>; <a onClick="return mV(\'Jam\',5,1);">5:1</a>), the Revised Version (British and American) "come."<P>"Go about (to)" the King James Version is the translation of zeteo, "to seek," in <a onClick="return mV(\'Jhn\',7,19);">Joh 7:19</a>, "Why go ye about to kill me?" the Revised Version (British and American) "Why seek ye?" and <a onClick="return mV(\'Rom\',10,3);">Ro 10:3</a>; of peirazo, "to try," "attempt" (<a onClick="return mV(\'Act\',24,6);">Ac 24:6</a>, the Revised Version (British and American) "assayed"), and of peiraomai (<a onClick="return mV(\'Act\',26,21);">26:21</A>, the Revised Version (British and American) "assayed"), of epicheireo "to lay hands on" (<a onClick="return mV(\'Act\',9,29);">Ac 9:29</a>), which remains in the English Revised Version unchanged, the American Standard Revised Version "seeking"; "to let go" is the translation of apoluo "to loose off" or "away" (<a onClick="return mV(\'Luk\',14,4);">Lu 14:4</a>, etc.), "to go astray," of planao (<a onClick="return mV(\'Mat\',18,12);">Mt 18:12</a>, etc.).<P>Various other words occurring singly are translated by forms of "go," e.g. phero, "to bear on," the King James Version "Let us go on unto perfection" (<a onClick="return mV(\'Hbr\',6,1);">Heb 6:1</a>, see below); epiduo, "to go in upon," "Let not the sun go down upon your wrath" (<a onClick="return mV(\'Eph\',4,26);">Eph 4:26</a>).<P>Among the many changes in the Revised Version (British and American) are the following: For "go," <a onClick="return mV(\'Exd\',4,26);">Ex 4:26</a>, "alone"; <a onClick="return mV(\'Lev\',9,7);">Le 9:7</a>, "draw near"; <a onClick="return mV(\'Num\',2,31);">Nu 2:31</a>, "set forth"; 16:46, "carry it"; <a onClick="return mV(\'Isa\',11,15);">Isa 11:15</a>; <a onClick="return mV(\'Isa\',27,4);">27:4</a>, "march"; <a onClick="return mV(\'Mat\',11,4);">Mt 11:4</a>; <a onClick="return mV(\'Jhn\',8,11);">Joh 8:11</a>, "Go your way"; <a onClick="return mV(\'Luk\',17,7);">Lu 17:7</a>, "Come straightway"; <a onClick="return mV(\'Luk\',18,25);">18:25</A>, "enter in"; <a onClick="return mV(\'Jhn\',21,3);">Joh 21:3b</a>, "come." "Go" is substituted for "pass" (<a onClick="return mV(\'Exd\',12,12);">Ex 12:12</a>), "came" (<a onClick="return mV(\'Exd\',13,4);">Ex 13:4</a>), "away" (<a onClick="return mV(\'Exd\',19,24);">Ex 19:24</a>), "be put" (<a onClick="return mV(\'Lev\',6,12);">Le 6:12</a>), "enter" (<a onClick="return mV(\'Job\',34,23);">Job 34:23</a>), "return" (<a onClick="return mV(\'Ecc\',1,7);">Ec 1:7</a>), "come" (<a onClick="return mV(\'Mic\',4,2);">Mic 4:2</a>; compare <a onClick="return mV(\'Zec\',14,18,19);">Zec 14:18-19</a>), "should be cast" (<a onClick="return mV(\'Mat\',5,30);">Mt 5:30</a>); "if I go up" for "I will come up" (<a onClick="return mV(\'Exd\',33,5);">Ex 33:5</a>); "make to go forth" for "bring forth" (<a onClick="return mV(\'Psa\',37,6);">Ps 37:6</a>); "let them go" for "gave them up" (<a onClick="return mV(\'Psa\',81,12);">Ps 81:12</a>). For the phrase, "go a whoring," the American Standard Revised Version has "play the harlot" (<a onClick="return mV(\'Exd\',34,15);">Ex 34:15</a>f; etc., "commit fornication"); for "go about even now" (<a onClick="return mV(\'Deu\',31,21);">De 31:21</a>, the American Standard Revised Version), "frame this day"; for "go well" (<a onClick="return mV(\'Pro\',30,29);">Pr 30:29</a>), "are stately in their march"; for "suffer us to go" (<a onClick="return mV(\'Mat\',8,31);">Mt 8:31</a>), "send us" (a different text); for "not to think of men above that which is written" (<a onClick="return mV(\'1Cr\',4,6);">1Co 4:6</a>), "not (to go) beyond the things which are written"; for "that no man go beyond" (<a onClick="return mV(\'1Th\',4,6);">1Th 4:6</a>), "transgress," margin "overreach"; for "Let us go on unto perfection" (<a onClick="return mV(\'Hbr\',6,1);">Heb 6:1</a>), the English Revised Version "and press," the American Standard Revised Version "Let us press on unto perfection."``185';
isbe[3843]='Goad`god (dorebhan, malmadh; kentron): The goad used by the Syrian farmer is usually a straight branch of oak or other strong wood from which the bark has been stripped, and which has at one end a pointed spike and at the other a flat chisel-shaped iron. The pointed end is to prod the oxen while plowing. The flattened iron at the other end is to scrape off the earth which clogs the plowshare. The ancient goad was probably similar to this instrument. It could do villainous work in the hands of an experienced fighter (<a onClick="return mV(\'Jdg\',3,31);">Jud 3:31</a>). If <a onClick="return mV(\'1Sa\',13,21);">1Sa 13:21</a> is correctly translated, the goads were kept sharpened by files.<P>Figurative: "The words of the wise are as goads" (<a onClick="return mV(\'Ecc\',12,11);">Ec 12:11</a>). The only reference to goads in the New Testament is the familiar passage, "It is hard for thee to kick against the goad" (<a onClick="return mV(\'Act\',26,14);">Ac 26:14</a>). It was as useless for Saul to keep on in the wrong way as for a fractious ox to attempt to leave the furrow. He would surely be brought back with a prick of the goad.``133';
isbe[3844]='Goah; Goath`go\'-a, go\'-ath (go\'ah; the King James Version; Septuagint reads ex eklekton lithon): A place named in describing the boundaries of Jerusalem as restored in the "days to come" (<a onClick="return mV(\'Jer\',31,39);">Jer 31:39</a>). If Gareb is the northeast hill, then probably Goah is to be identified with the northwest hill, which is called by Josephus "the camp of the Assyrians" (BJ, V, vii, 3; xii, 2).`<a href="./study/isbe/search.html?string=JERUSALEM,+1">JERUSALEM</a>`1';
isbe[3845]='Goat`got:<P>1. Names:<P>The common generic word for "goat" is \'ez (compare Arabic \'anz, "she-goat"; aix), used often for "she-goat" (<a onClick="return mV(\'Gen\',15,9);">Ge 15:9</a>; <a onClick="return mV(\'Num\',15,27);">Nu 15:27</a>), also with gedhi, "kid," as gedhi \'izzim, "kid of the goats" (<a onClick="return mV(\'Gen\',38,17);">Ge 38:17</a>), also with sa\'ir, "he-goat," as se\'ir \'izzim, "kid of the goats" or "he-goat," or translated simply "kids," as in <a onClick="return mV(\'1Ki\',20,27);">1Ki 20:27</a>, "The children of Israel encamped before them like two little flocks of kids." Next, frequently used is sa\'ir, literally, "hairy" (compare Arabic sha\'r, "hair"; cher, "hedgehog"; Latin hircus, "goat"; hirtus, "hairy"; also German Haar; English "hair"), like \'ez and \'attudh used of goats for offerings. The goat which is sent into the wilderness bearing the sins of the people is sa\'ir (<a onClick="return mV(\'Lev\',16,\'7-22\');">Le 16:7-22</a>). The same name is used of devils (<a onClick="return mV(\'Lev\',17,7);">Le 17:7</a>; <a onClick="return mV(\'2Ch\',11,15);">2Ch 11:15</a>, the Revised Version (British and American) "he-goats") and of satyrs (<a onClick="return mV(\'Isa\',13,21);">Isa 13:21</a>; <a onClick="return mV(\'Isa\',34,14);">34:14</a>, the Revised Version, margin "he-goats," the American Standard Revised Version "wild goats"). Compare also se\'irath \'izzim, "a female from the flock" (<a onClick="return mV(\'Lev\',4,28);">Le 4:28</a>; <a onClick="return mV(\'Lev\',5,6);">5:6</a>). The male or leader of the flock is \'attudh; Arabic \'atud, "yearling he-goat"; figuratively "chief ones" (<a onClick="return mV(\'Isa\',14,9);">Isa 14:9</a>; compare <a onClick="return mV(\'Jer\',50,8);">Jer 50:8</a>). A later word for "he-goat," used also figuratively, is tsaphir (<a onClick="return mV(\'2Ch\',29,21);">2Ch 29:21</a>; <a onClick="return mV(\'Ezr\',8,35);">Ezr 8:35</a>; <a onClick="return mV(\'Dan\',8,5,8,21);">Da 8:5, 8, 21</a>). In <a onClick="return mV(\'Pro\',30,31);">Pr 30:31</a>, one of the four things "which are stately in going" is the he-goat, tayish (Arabic tais, "he-goat"), also mentioned in <a onClick="return mV(\'Gen\',30,35);">Ge 30:35</a>; <a onClick="return mV(\'Gen\',32,14);">32:14</a> among the possessions of Laban and Jacob, and in <a onClick="return mV(\'2Ch\',17,11);">2Ch 17:11</a> among the animals given as tribute by the Arabians to Jehoshaphat. In <a onClick="return mV(\'Hbr\',9,12,13,19);">Heb 9:12-13, 19</a>; <a onClick="return mV(\'Hbr\',10,4);">10:4</a>, we have tragos, the ordinary Greek word for "goat"; in <a onClick="return mV(\'Mat\',25,32,33);">Mt 25:32-33</a>, eriphos, and its diminutive eriphion; in <a onClick="return mV(\'Hbr\',11,37);">Heb 11:37</a> derma aigeion, "goatskin," from aix (see supra). "Kid" is gedhi (compare En-gedi (<a onClick="return mV(\'1Sa\',23,29);">1Sa 23:29</a>), etc.), feminine gedhiyah (<a onClick="return mV(\'Sgs\',1,8);">So 1:8</a>), but also \'ez, gedhi \'izzim, se\'-ir \'izzim, se\'ir \'izzim, se\'irath \'izzim, bene \'izzim, and eriphos. There remain ya\'el (<a onClick="return mV(\'1Sa\',24,2);">1Sa 24:2</a>; <a onClick="return mV(\'Job\',39,1);">Job 39:1</a>; <a onClick="return mV(\'Psa\',104,18);">Ps 104:18</a>), English Versions of the Bible "wild goat"; ya\'alah (<a onClick="return mV(\'Pro\',5,19);">Pr 5:19</a>), the King James Version "roe," the Revised Version (British and American) "doe"; \'aqqo (<a onClick="return mV(\'Deu\',14,5);">De 14:5</a>), English Versions of the Bible "wild goat"; and zemer (<a onClick="return mV(\'Deu\',14,5);">De 14:5</a>), English Versions of the Bible "chamois."<P>2. Wild Goats:<P>The original of our domestic goats is believed to be the Persian wild goat or pasang, Capra aegagrus, which inhabits some of the Greek islands, Asia Minor, Syria, Mesopotamia, Persia, Afghanistan, and Northwestern India. It is called wa\'l (compare Hebrew ya\'el) by the Arabs, who in the north apply the same name to its near relative, the Sinaitic ibex, Capra beden. The last, doubtless the "wild goat" (ya\'el) of the Bible, inhabits Southern Palestine, Arabia, Sinai, and Eastern Egypt, and within its range is uniformly called beden by the Arabs. It is thought by the writer that the "chamois" (zemer) of <a onClick="return mV(\'Deu\',14,5);">De 14:5</a> may be the Persian wild goat. The word occurs only in this passage in the list of clean animals. See <a href="study/isbe/search.html?string=CHAMOIS">CHAMOIS</a>; <a href="study/isbe/search.html?string=DEER">DEER</a>; <a href="study/isbe/search.html?string=ZOOLOGY">ZOOLOGY</a>. Wild goats are found only in Southern Europe, southwestern Asia, and northeastern Africa. They include the well-known, but now nearly extinct, Alpine ibex, steinbok, or bouquetin, the markhor, and the Himalayan ibex, which has enormous horns. The so-called Rocky Mountain goat is not properly a goat, but is an animal intermediate between goats and antelopes.<P>3. Domestic Goats:<P>Domestic goats differ greatly among themselves in the color and length of their hair, in the size and shape of their ears, and in the size and shape of their horns, which are usually larger in the males, but in some breeds may be absent in both sexes. A very constant feature in both wild and domestic goats is the bearded chin of the male. The goats of Palestine and Syria are usually black (<a onClick="return mV(\'Sgs\',4,1);">So 4:1</a>), though sometimes partly or entirely white or brown. Their hair is usually long, hanging down from their bodies. The horns are commonly curved outward and backward, but in one very handsome breed they extend nearly outward with slight but graceful curves, sometimes attaining a span of 2 ft. or more in the old males. The profile of the face is distinctly convex. They are herded in the largest numbers in the mountainous or hilly districts, and vie with their wild congeners in climbing into apparently impossible places. They feed not only on herbs, but also on shrubs and small trees, to which they are most destructive. They are largely responsible for the deforested condition of Judea and Lebanon. They reach up the trees to the height of a man, holding themselves nearly or quite erect, and even walk out on low branches.<P>4. Economy:<P>Apart from the ancient use in sacrifice, which still survives among Moslems, goats are most valuable animals. Their flesh is eaten, and may be had when neither mutton nor beef can be found. Their milk is drunk and made into cheese and semn, a sort of clarified butter much used in cooking. Their hair is woven into tents (<a onClick="return mV(\'Sgs\',1,5);">So 1:5</a>), carpets, cloaks, sacks, slings, and various camel, horse and mule trappings. Their skins are made into bottles (no\'dh; Greek askos; Arabic qirbeh) for water, oil, semn, and other liquids (compare also <a onClick="return mV(\'Hbr\',11,37);">Heb 11:37</a>).<P>5. Religious and Figurative:<P>Just as the kid was often slaughtered for an honored guest (<a onClick="return mV(\'Jdg\',6,19);">Jud 6:19</a>; <a onClick="return mV(\'Jdg\',13,19);">13:19</a>), so the kid or goat was frequently taken for sacrifice (<a onClick="return mV(\'Lev\',4,23);">Le 4:23</a>; <a onClick="return mV(\'Lev\',9,15);">9:15</a>; <a onClick="return mV(\'Lev\',16,7);">16:7</a>; <a onClick="return mV(\'Num\',15,24);">Nu 15:24</a>; <a onClick="return mV(\'Ezr\',8,35);">Ezr 8:35</a>; <a onClick="return mV(\'Eze\',45,23);">Eze 45:23</a>; <a onClick="return mV(\'Hbr\',9,12);">Heb 9:12</a>). A goat was one of the clean animals (seh \'izzim, <a onClick="return mV(\'Deu\',14,4);">De 14:4</a>). In Daniel, the powerful king out of the West is typified as a goat with a single horn (<a onClick="return mV(\'Dan\',8,5);">8:5</a>). One of the older goats is the leader of the flock. In some parts of the country the goatherd makes different ones leaders by turns, the leader being trained to keep near the goat-herd and not to eat so long as he wears the bell. In <a onClick="return mV(\'Isa\',14,9);">Isa 14:9</a>, ".... stirreth up the dead for thee, even all the chief ones of the earth," the word translated "chief ones" is \'attudh, "he-goat." Again, in <a onClick="return mV(\'Jer\',50,8);">Jer 50:8</a>, we have "Go forth out of the land of the Chaldeans, and be as the he-goats before the flocks." In <a onClick="return mV(\'Mat\',25,32);">Mt 25:32</a>, in the scene of the last judgment, we find "He shall separate them one from another, as the shepherd separateth the sheep from the goats." It is not infrequent to find a flock including both goats and sheep grazing over the mountains, but they are usually folded separately.``37';
isbe[3846]='Goats\' Hair` (\'ez): The word for she-goat is used elliptically to mean goats\' hair, which was used in the tabernacle furnishings in the form of curtains (<a onClick="return mV(\'Exd\',26,7);">Ex 26:7</a>; <a onClick="return mV(\'Exd\',36,14);">36:14</a>). Goats\' hair was probably used in the Midianite and Israelite camps in much the same way as in the Bedouin camps today (compare <a onClick="return mV(\'Num\',31,20);">Nu 31:20</a>). The tents, tent ropes and rugs are made of spun goats\' hair. The provision sacks which hold wheat, rice, etc., and the saddlebags are made of the same material. A strip of the cloth rolled up furnishes a bolster for the head while sleeping (compare <a onClick="return mV(\'1Sa\',19,13,16);">1Sa 19:13, 16</a>). Goats\' hair cloth is admirably suited to stand the hard usage of a frequently shifting encampment. The children of Israel appreciated its utility, even for the tabernacle, where to the modern critical eye it would have looked out of place, matched against scarlet and fine linen (<a onClick="return mV(\'Exd\',25,4);">Ex 25:4</a>; <a onClick="return mV(\'Exd\',35,6,26);">35:6, 26</a>). The fact that goats\' hair was used is good indication of the comparative crudeness of the tabernacle, when contrasted with present-day furnishings.`<a href="./study/isbe/search.html?string=HAIR">HAIR</a>; <a href="./study/isbe/search.html?string=WEAVING">WEAVING</a>`133';
isbe[3847]='Goatskins`got\'-skinz (en aigeiois dermasin): Such skins are mentioned only once (<a onClick="return mV(\'Hbr\',11,37);">Heb 11:37</a>), where the wearing of goatskins, indicating extreme poverty, is referred to, by implication, as the possible lot of the faithful Christian, even as it had been of others. Ascetics of different religions, especially of the Moslem sects, are frequently seen going about Syria and Palestine today, clad in sheepskins or goatskins, a sign of their renunciation of all things worldly.``1';
isbe[3848]='Gob`gob (gobh): A place mentioned in <a onClick="return mV(\'2Sa\',21,18);">2Sa 21:18</a>f as the scene of two of David\'s battles with the Philistines. The name appears here only. In the parallel passage, <a onClick="return mV(\'1Ch\',20,4);">1Ch 20:4</a>, it is called Gezer (compare Ant, VII, xii, 2). Certain texts read "Nob" for "Gob," while Syriac and Septuagint read "Gath." The latter is probably correct.``1';
isbe[3849]='Goblet`gob\'-let (\'aggan): A bowl or basin (<a onClick="return mV(\'Sgs\',7,2);">So 7:2</a>), the only place where the word is used. \'Aggan is used in the plural in <a onClick="return mV(\'Exd\',24,6);">Ex 24:6</a> and <a onClick="return mV(\'Isa\',22,24);">Isa 22:24</a>, and is translated "basins" and "cups." These "basins" were used to hold the blood of the sacrifices and must have been of moderate size. The "cups" were bowl-shaped vessels and belonged evidently to the smaller class of vessels used in a house.``1';
isbe[3850]='God, 1`god (\'Elohim, \'El, [\'Elyon], Shadday, Yahweh; Theos):<P><b>I. INTRODUCTION TO THE GENERAL IDEA</b><P>1. The Idea in Experience and in Thought<P>2. Definition of the Idea<P>3. The Knowledge of God<P>4. Ethnic Ideas of God<P class="in15">(1) Animism<P class="in15">(2) Fetishism<P class="in15">(3) Idolatry<P class="in15">(4) Polytheism<P class="in15">(5) Henotheism<P class="in15">(6) Pantheism<P class="in15">(7) Deism<P class="in15">(8) Semitic Monolatry<P class="in15">(9) Monotheism<P><b>II. THE IDEA OF GOD IN THE OLD TESTAMENT</b><P>1. The Course of Its Development<P>2. Forms of Its Manifestation<P class="in15">(1) The Face or Countenance of God<P class="in15">(2) The Voice and Word of God<P class="in15">(3) The Glory of God<P class="in15">(4) The Angel of God<P class="in15">(5) The Spirit of God<P class="in15">(6) The Name of God<P class="in15">(7) Occasional Forms<P>3. The Names of God<P class="in15">(1) Generic<P class="in15">(2) Attributive<P class="in15">(3) Yahweh<P>4. Pre-prophetic Conceptions of God<P class="in15">(1) Yahweh Alone Is the God of Israel<p class="in30">(a) His Early Worship<p class="in30">(b) Popular Religion<p class="in30">(c) Polytheistic Tendencies<p class="in60">(i) Coordination<p class="in60">(ii) Assimilation<p class="in60">(iii) Disintegration<p class="in30">(d) No Hebrew Goddesses<p class="in30">(e) Human Sacrifices<P class="in15">(2) Nature and Character of Yahweh<p class="in30">(a) A God of War<p class="in30">(b) His Relation to Nature<P class="in15">(3) Most Distinctive Characteristics of Yahweh<p class="in30">(a) Personality<p class="in30">(b) Law and Judgment<P>5. The Idea of God in the Prophetic Period<P class="in15">(1) Righteousness<P class="in15">(2) Holiness<P class="in15">(3) Universality<P class="in15">(4) Unity<P class="in15">(5) Creator and Lord<P class="in15">(6) Compassion and Love<P>6. The Idea of God in Post-exilic Judaism<P class="in15">(1) New Conditions<P class="in15">(2) Divine Attributes<P class="in15">(3) Surviving Limitations<p class="in30">(a) Disappearing Anthropomorphism<p class="in30">(b) Localization<p class="in30">(c) Favoritism<p class="in30">(d) Ceremonial Legalism<P class="in15">(4) Tendencies to Abstractness<p class="in30">(a) Transcendence<p class="in30">(b) Skepticism<p class="in30">(c) Immanence<P class="in15">(5) Logos, Memra\', and Angels<P><b>III. THE IDEA OF GOD IN THE NEW TESTAMENT</b><P>1. Dependence on the Old Testament<P>2. Gentile Influence<P>3. Absence of Theistic Proofs<P>4. Fatherhood of God<P class="in15">(1) In the Teaching of Jesus Christ<p class="in30">(a) Its Relation to Himself<p class="in30">(b) To Believers<p class="in30">(c) To All Men<P class="in15">(2) In Apostolic Teaching<p class="in30">(a) Father of Jesus Christ<p class="in30">(b) Our Father<p class="in30">(c) Universal Father<P>5. God Is King<P class="in15">(1) The Kingdom of God<P class="in15">(2) Its King<p class="in30">(a) God<P class="in30">(b) Christ<p class="in30">(c) Their Relation<P class="in15">(3) Apostolic Teaching<P>6. Moral Attributes<P class="in15">(1) Personality<P class="in15">(2) Love<P class="in15">(3) Righteousness and Holiness<P>7. Metaphysical Attributes<P>8. The Unity of God<P class="in15">(1) The Divinity of Christ<P class="in15">(2) The Holy Spirit<P class="in15">(3) The Church\'s Problem<P><b>LITERATURE</b><hr /><P>I. Introduction to the General Idea.<P>1. The Idea in Experience and in Thought:<P>Religion gives the idea of God, theology construes and organizes its content, and philosophy establishes its relation to the whole of man\'s experience. The logical order of treating it might appear to be, first, to establish its truth by philosophical proofs; secondly, to develop its content into theological propositions; and finally, to observe its development and action in religion. Such has been the more usual order of treatment. But the actual history of the idea has been quite the reverse. Men had the idea of God, and it had proved a creative factor in history, long before reflection upon it issued in its systematic expression as a doctrine. Moreover, men had enunciated the doctrine before they attempted or even felt any need to define its relation to reality. And the logic of history is the truer philosophy. To arrive at the truth of any idea, man must begin with some portion of experience, define its content, relate it to the whole of experience, and so determine its degree of reality.<P>Religion is as universal as man, and every religion involves some idea of God. Of the various philosophical ideas of God, each has its counterpart and antecedent in some actual religion. Pantheism is the philosophy of the religious consciousness of India. Deism had prevailed for centuries as an actual attitude of men to God, in China, in Judaism and in Islam, before it found expression as a rational theory in the philosophy of the 18th century Theism is but the attempt to define in general terms the Christian conception of God, and of His relation to the world. If pluralism claims a place among the systems of philosophy, it can appeal to the religious consciousness of that large portion of mankind that has hitherto adhered to polytheism.<P>But all religions do not issue in speculative reconstructions of their content. It is true in a sense that all religion is an unconscious philosophy, because it is the reaction of the whole mind, including the intellect, upon the world of its experience, and, therefore, every idea of God involves some kind of an explanation of the world. But conscious reflection upon their own content emerges only in a few of the more highly developed religions. Brahmanism, Buddhism, Judaism, Islam and Christianity are the only religions that have produced great systems of thought, exhibiting their content in a speculative and rational form. The religions of Greece and Rome were unable to survive the reflective period. They produced no theology which could ally itself to a philosophy, and Greek philosophy was from the beginning to a great extent the denial and supersession of Greek religion.<P>Biblical literature nearly all represents the spontaneous experience of religion, and contains comparatively little reflection upon that experience. In the Old Testament it is only in Second Isaiah, in the Wisdom literature and in a few Psalms that the human mind may be seen turning back upon itself to ask the meaning of its practical feelings and beliefs. Even here nothing appears of the nature of a philosophy of Theism or of religion, no theology, no organic definition and no ideal reconstruction of the idea of God. It never occurred to any Old Testament writer to offer a proof of the existence of God, or that anyone should need it. Their concern was to bring men to a right relation with God, and they propounded right views of God only in so far as it was necessary for their practical purpose. Even the fool who "hath said in his heart, There is no God" (<a onClick="return mV(\'Psa\',14,1);">Ps 14:1</a>; <a onClick="return mV(\'Psa\',53,1);">53:1</a>), and the wicked nations "that forget God" (<a onClick="return mV(\'Psa\',9,17);">Ps 9:17</a>) are no theoretical atheists, but wicked and corrupt men, who, in conduct and life, neglect or reject the presence of God.<P>The New Testament contains more theology, more reflection upon the inward content of the idea of God, and upon its cosmic significance; but here also, no system appears, no coherent and rounded-off doctrine, still less any philosophical construction of the idea on the basis of experience as a whole. The task of exhibiting the Biblical idea of God is, therefore, not that of setting together a number of texts, or of writing the history of a theology, but rather of interpreting the central factor in the life of the Hebrew and Christian communities.<P>2. Definition of the Idea:<P>Logically and historically the Biblical idea stands related to a number of other ideas. Attempts have been made to find a definition of so general a nature as to comprehend them all. The older theologians assumed the Christian standpoint, and put into their definitions the conclusions of Christian doctrine and philosophy. Thus, Melanchthon: "God is a spiritual essence, intelligent, eternal, true, good, pure, just, merciful, most free and of infinite power and wisdom." Thomasius more briefly defines God as "the absolute personality." These definitions take no account of the existence of lower religions and ideas of God, nor do they convey much of the concreteness and nearness of God revealed in Christ. A similar recent definition, put forward, however, avowedly of the Christian conception, is that of Professor W. N. Clarke: "God is the personal Spirit, perfectly good, who in holy love creates, sustains and orders all" (Outline of Christian Theology, 66). The rise of comparative religion has shown that "while all religions involve a conscious relation to a being called God, the Divine Being is in different religions conceived in the most different ways; as one and as many, as natural and as spiritual, as like to and manifested in almost every object in the heavens above or earth beneath, in mountains and trees, in animals and men; or, on the contrary, as being incapable of being represented by any finite image whatsoever; and, again, as the God of a family, of a nation, or of humanity" (E. Caird, Evolution of Religion, I, 62). Attempts have therefore been made to find a new kind of definition, such as would include under one category all the ideas of God possessed by the human race. A typical instance of this kind of definition is that of Professor W. Adams Brown: "A god in the religious sense is an unseen being, real or supposed, to whom an individual or a social group is united by voluntary ties of reverence and service" (Christian Theology in Outline, 30). Many similar definitions are given: "A supersensible being or beings" (Lotze, Asia Minor Fairbairn); "a higher power" (Allan Menzies); "spiritual beings" (E.B. Tylor); "a power not ourselves making for righteousness" (Matthew Arnold). This class of definition suffers from a twofold defect. It says too much to include the ideas of the lower religions, and too little to suggest those of the higher. It is not all gods that are "unseen" or "supersensible," or "making for righteousness," but all these qualities may be shared by other beings than gods, and they do not connote that which is essential in the higher ideas of God. Dr. E. Caird, looking for a definition in a germinative principle of the genesis of religion, defines God "as the unity which is presupposed in the difference of the self and not-self, and within which they act and re-act on each other" (op. cit., I,40,64). This principle admittedly finds its full realization only in the highest religion, and it may be doubted whether it does justice to the transcendent personality and the love of God as revealed in Jesus Christ. In the lower religions it appears only in fragmentary forms, and it can only be detected in them at all after it has been revealed in the absolute religion. Although this definition may be neither adequate nor true, its method recognizes that there can be only one true idea and definition of God, and yet that all other ideas are more or less true elements of it and approximations to it. The Biblical idea does not stand alone like an island in mid-ocean, but is rather the center of light which radiates out in other religions with varying degrees of purity.<P>It is not the purpose of this article to deal with the problem of the philosophy of religion, but to give an account of the idea of God at certain stages of its development, and within a limited area of thought. The absence of a final definition will present no practical difficulty, because the denotation of the term God is clear enough; it includes everything that is or has been an object of worship; it is its connotation that remains a problem for speculation.<P>3. The Knowledge of God:<P>A third class of definition demands some attention, because it raises a new question, that of the knowledge or truth of any idea whatsoever. Herbert Spencer\'s definition may be taken as representative: God is the unknown and unknowable cause of the universe, "an inscrutable power manifested to us through all phenomena" (First Principles, V, 31). This means that there can be no definition of the idea of God, because we can have no idea of Him, no knowledge "in the strict sense of knowing." For the present purpose it might suffice for an answer that ideas of God actually exist; that they can be defined and are more definable, because fuller and more complex, the higher they rise in the scale of religions; that they can be gathered from the folklore and traditions of the lower races, and from the sacred books and creeds of the higher religions. But Spencer\'s view means that, in so far as the ideas are definable, they are not true. The more we define, the more fictitious becomes our subject-matter. While nothing is more certain than that God exists, His being is to human thought utterly mysterious and inscrutable. The variety of ideas might seem to support this view. But variety of ideas has been held of every subject that is known, as witness the progress of science. The variety proves nothing.<P>And the complete abstraction of thought from existence cannot be maintained. Spencer himself does not succeed in doing it. He says a great many things about the "unknowable" which implies an extensive knowledge of Him. The traditional proofs of the "existence" of God have misled the Agnostics. But existence is meaningless except for thought, and a noumenon or first cause that lies hidden in impenetrable mystery behind phenomena cannot be conceived even as a fiction. Spencer\'s idea of the Infinite and Absolute are contradictory and unthinkable. An Infinite that stood outside all that is known would not be infinite, and an Absolute out of all relation could not even be imagined. If there is any truth at all in the idea of the Absolute, it must be true to human experience and thought; and the true Infinite must include within itself every possible and actual perfection. In truth, every idea of God that has lived in religion refutes Agnosticism, because they all qualify and interpret experience, and the only question is as to the degree of their adequacy and truth.<P>A brief enumeration of the leading ideas of God that have lived in religion will serve to place the Biblical idea in its true perspective.<P>4. Ethnic Ideas of God:<P>(1) Animism:<P>Animism is the name of a theory which explains the lowest (and perhaps the earliest) forms of religion, and also the principle of all religion, as the belief in the universal presence of spiritual beings which "are held to affect or control the events of the material world, and man\'s life here and hereafter; and, it being considered that they hold intercourse with men, and receive pleasure or displeasure from human actions, the belief in their existence leads naturally, and, it might almost be said, inevitably, sooner or later, to active reverence and propitiation" (E.B. Tylor, Primitive Culture, I, 426-27). According to this view, the world is full of disembodied spirits, regarded as similar to man\'s soul, and any or all of these may be treated as gods.<P>(2) Fetishism:<P>Fetishism is sometimes used in a general sense for "the view that the fruits of the earth and things in general are divine, or animated by powerful spirits" (J.G. Frazer, Adonis, Attis, Osiris, 234); or it may be used in a more particular sense of the belief that spirits "take up their abode, either temporarily or permanently, in some object,...and this object, as endowed with higher power, is then worshipped" (Tiele, Outlines of the History of Religion, 9).<P>(3) Idolatry:<P>Idolatry is a term of still more definite significance. It means that the object is at least selected, as being the permanent habitation or symbol of the deity; and, generally, it is marked by some degree of human workmanship, designed to enable it the more adequately to represent the deity. It is not to be supposed that men ever worship mere "stocks and stones," but they address their worship to objects, whether fetishes or idols, as being the abodes or images of their god. It is a natural and common idea that the spirit has a form similar to the visible object in which it dwells. Paul reflected the heathen idea accurately when he said, "We ought not to think that the Godhead is like unto gold, or silver, or stone, graven by art and device of man" (<a onClick="return mV(\'Act\',17,29);">Ac 17:29</a>).<P>(4) Polytheism:<P>The belief in many gods, and the worship of them, is an attitude of soul compatible with Animism, Fetishism, and Idolatry, or it may be independent of them all. The term Polytheism is more usually employed to designate the worship of a limited number of well-defined deities, whether regarded as pure disembodied spirits, or as residing in the greater objects of Nature, such as planets or mountains, or as symbolized by images "graven by art and device of man." In ancient Greece or modern India the great gods are well defined, named and numerable, and it is clearly understood that, though they may be symbolized by images, they dwell apart in a spiritual realm above the rest of the world.<P>(5) Henotheism:<P>There is, however, a tendency, both in individuals and in communities, even where many gods are believed to exist, to set one god above the others, and consequently to confine worship to that god alone. "The monotheistic tendency exists among all peoples, after they have reached a certain level of culture. There is a difference in the degree in which this tendency is emphasized, but whether we turn to Babylonia, Egypt, India, China, or Greece, there are distinct traces of a trend toward concentrating the varied manifestations of Divine powers in a single source" (Jastrow, The Study of Religion, 76). This attitude of mind has been called Henotheism or Monolatry—the worship of one God combined with the belief in the existence of many. This tendency may be governed by metaphysical, or by ethical and personal motives, either by the monistic demands of reason, or by personal attachment to one political or moral rule.<P>(6) Pantheism:<P>Where the former principle predominates, Polytheism merges into Pantheism, as is the case in India, where Brahma is not only the supreme, but the sole, being, and all other gods are but forms of his manifestation. But, in India, the vanquished gods have had a very complete revenge upon their vanquisher, for Brahma has become so abstract and remote that worship is mainly given to the other gods, who are forms of his manifestation. Monolatry has been reversed, and modern Hinduism were better described as the belief in one God accompanied by the worship of many.<P>(7) Deism:<P>The monistic tendency, by a less thorough application of it, may take the opposite turn toward Deism, and yet produce similar religious conditions. The Supreme Being, who is the ultimate reality and power of the universe, may be conceived in so vague and abstract a manner, may be so remote from the world, that it becomes a practical necessity to interpose between Him and men a number of subordinate and nearer beings as objects of worship. In ancient Greece, Necessity, in China, Tien or Heaven, were the Supreme Beings; but a multiplicity of lower gods were the actual objects of worship. The angels of Zoroastrianism, Judaism and Islam and the saints of Romanism illustrate the same tendency. Pantheism and Deism, though they have had considerable vogue as philosophical theories, have proved unstable and impossible as religions, for they have invariably reverted to some kind of polytheism and idolatry, which seems to indicate that they are false processes of the monistic tendency.<P>(8) Semitic Monolatry:<P>The monistic tendency of reason may enlist in its aid many minor causes, such as tribal isolation or national aggrandizement. It is held that many Sere tribes were monolatrists for either or both of these reasons; but the exigencies of intertribal relations in war and commerce soon neutralized their effects, and merged the tribal gods into a territorial pantheon.<P>(9) Monotheism:<P>Monotheism, ethical and personal: One further principle may combine with Monism so as to bring about a stable Monotheism, that is the conception of God as standing in moral relations with man. Whenever man reflects upon conduct as moral, he recognizes that there can be only one moral standard and authority, and when God is identified with that moral authority, He inevitably comes to be recognized as supreme and unique. The belief in the existence of other beings called gods may survive for a while; but they are divested of all the attributes of deity when they are seen to be inferior or opposed to the God who rules in conscience. Not only are they not worshipped, but their worship by others comes to be regarded as immoral and wicked. The ethical factor in the monistic conception of God safeguards it from diverging into Pantheism or Deism and thus reverting into Polytheism. For the ethical idea of God necessarily involves His personality, His transcendence as distinct from the world and above it, and also His intimate and permanent relation with man. If He rules in conscience, He can neither be merged in dead nature or abstract being, nor be removed beyond the heavens and the angel host. A thoroughly moralized conception of God emerges first in the Old Testament where it is the prevailing type of thought.``145';
isbe[3851]='God, 2`II. The Idea of God in the Old Testament.<P>1. Course of Its Development:<P>Any attempt to write the whole history of the idea of God in the Old Testament would require a preliminary study of the literary and historical character of the documents, which lies beyond the scope of this article and the province of the writer. Yet the Old Testament contains no systematic statement of the doctrine of God, or even a series of statements that need only to be collected into a consistent conception. The Old Testament is the record of a rich and varied life, extending over more than a thousand years, and the ideas that ruled and inspired that life must be largely inferred from the deeds and institutions in which it was realized; nor was it stationary or all at one level. Nothing is more obvious than that revelation in the Old Testament has been progressive, and that the idea of God it conveys has undergone a development. Certain well-marked stages of the development can be easily recognized, without entering upon any detailed criticism. There can be no serious question that the age of the Exodus, as centering around the personality of Moses, witnessed an important new departure in Hebrew religion. The most ancient traditions declare (perhaps not unanimously) that God was then first known to Israel under the personal name Yahweh (Yahweh (YHWH) is the correct form of the word, Yahweh being a composite of the consonants of Yahweh and the vowels of \'adhonay, or lord. Yahweh is retained here as the more familiar form). The Hebrew people came to regard Him as their Deliverer from Egypt, as their war god who assured them the conquest of Canaan, and He, therefore, became their king, who ruled over their destinies in their new heritage. But the settlement of Yahweh in Canaan, like that of His people, was challenged by the native gods and their peoples. In the 9th century we see the war against Yahweh carried into His own camp, and Baal-worship attempting to set itself up within Israel. His prophets therefore assert the sole right of Yahweh to the worship of His people, and the great prophets of the 8th century base that right upon His moral transcendence. Thus they at once reveal new depths of His moral nature, and set His uniqueness and supremacy on higher grounds. During the exile and afterward, Israel\'s outlook broadens by contact with the greater world, and it draws out the logical implications of ethical monotheism into a theology at once more universalistic and abstract. Three fairly well-defined periods thus emerge, corresponding to three stages in the development of the Old Testament idea of God: the pre-prophetic period governed by the Mosaic conception, the prophetic period during which ethical monotheism is firmly established, and the post-exilic period with the rise of abstract monotheism. But even in taking these large and obvious divisions, it is necessary to bear in mind the philosopher\'s maxim, that "things are not cut off with a hatchet." The most characteristic ideas of each period may be described within their period; but it should not be assumed that they are altogether absent from other periods; and, in particular, it should not be supposed that ideas, and the life they represent, did not exist before they emerged in the clear witness of history. Mosaism had undoubtedly its antecedents in the life of Israel; but any attempt to define them leads straight into a very morass of conjectures and hypotheses, archaeological, critical and philosophical; and any results that are thus obtained are contributions to comparative religion rather than to theology.<P>2. Forms of the Manifestation of God:<P>Religious experience must always have had an inward and subjective aspect, but it is a long and difficult process to translate the objective language of ordinary life for the uses of subjective experience. "Men look outward before they look inward." Hence, we find that men express their consciousness of God in the earliest periods in language borrowed from the visible and objective world. It does not follow that they thought of God in a sensuous way, because they speak of Him in the language of the senses, which alone was available for them. On the other hand, thought is never entirely independent of language, and the degree in which men using sensuous language may think of spiritual facts varies with different persons.<P>(1) The Face or Countenance of God:<P>The face or countenance (panim) of God is a natural expression for His presence. The place where God is seen is called Peniel, the face of God (<a onClick="return mV(\'Gen\',32,30);">Ge 32:30</a>). The face of Yahweh is His people\'s blessing (<a onClick="return mV(\'Num\',6,25);">Nu 6:25</a>). With His face (the Revised Version (British and American) "presence") He brought Israel out of Egypt, and His face (the Revised Version (British and American) "presence") goes with them to Canaan (<a onClick="return mV(\'Exd\',33,14);">Ex 33:14</a>). To be alienated from God is to be hid from His face (<a onClick="return mV(\'Gen\',4,14);">Ge 4:14</a>), or God hides His face (<a onClick="return mV(\'Deu\',31,17,18);">De 31:17-18</a>; <a onClick="return mV(\'Deu\',32,20);">32:20</a>). In contrast with this idea it is said elsewhere that man cannot see the face of God and live (<a onClick="return mV(\'Exd\',33,20);">Ex 33:20</a>; compare <a onClick="return mV(\'Deu\',5,24);">De 5:24</a>; <a onClick="return mV(\'Jdg\',6,22);">Jud 6:22</a>; <a onClick="return mV(\'Jdg\',13,22);">13:22</a>). In these later passages, "face" stands for the entire being of God, as distinguished from what man may know of Him. This phrase and its cognates enshrine also that fear of God, which shrinks from His majesty even while approaching Him, which enters into all worship.<P>(2) The Voice and Word of God:<P>The voice (qol) and word (dabhar) of God are forms under which His communion with man is conceived from the earliest days to the latest. The idea ranges from that of inarticulate utterance (<a onClick="return mV(\'1Ki\',19,12);">1Ki 19:12</a>) to the declaration of the entire law of conduct (<a onClick="return mV(\'Deu\',5,\'22-24\');">De 5:22-24</a>), to the message of the prophet (<a onClick="return mV(\'Isa\',2,1);">Isa 2:1</a>; <a onClick="return mV(\'Jer\',1,2);">Jer 1:2</a>), and the personification of the whole counsel and action of God (<a onClick="return mV(\'Psa\',105,19);">Ps 105:19</a>; <a onClick="return mV(\'Psa\',147,18,19);">147:18-19</a>; <a onClick="return mV(\'Hsa\',6,5);">Ho 6:5</a>; <a onClick="return mV(\'Isa\',40,8);">Isa 40:8</a>).<P>(3) The Glory of God:<P>The glory (kabhodh) of God is both a peculiar physical phenomenon and the manifestation of God in His works and providence. In certain passages in Exodus, ascribed to the Priestly Code, the glory is a bright light, "like devouring fire" (<a onClick="return mV(\'Exd\',24,17);">24:17</A>); it fills and consecrates the tabernacle (<a onClick="return mV(\'Exd\',29,43);">29:43</a>; <a onClick="return mV(\'Exd\',40,34,35);">40:34,35</a>); and it is reflected as beams of light in the face of Moses (<a onClick="return mV(\'Exd\',34,29);">34:29</a>). In Ezekiel, it is a frequent term for the prophet\'s vision, a brightness like the appearance of a rainbow (<a onClick="return mV(\'Eze\',1,28);">1:28</a>; <a onClick="return mV(\'Eze\',10,4);">10:4</a>; <a onClick="return mV(\'Eze\',43,2);">43:2</a>). In another place, it is identified with all the manifested goodness of God and is accompanied with the proclamation of His name (<a onClick="return mV(\'Exd\',33,\'17-23\');">Ex 33:17-23</a>). Two passages in Isaiah seem to combine under this term the idea of a physical manifestation with that of God\'s effectual presence in the world (<a onClick="return mV(\'Isa\',3,8);">3:8</a>; <a onClick="return mV(\'Isa\',6,3);">6:3</a>). God\'s presence in creation and history is often expressed in the Psalms as His glory (<a onClick="return mV(\'Psa\',19,1);">Ps 19:1</a>; <a onClick="return mV(\'Psa\',57,5,11);">57:5, 11</a>; <a onClick="return mV(\'Psa\',63,2);">63:2</a>; <a onClick="return mV(\'Psa\',97,6);">97:6</a>). Many scholars hold that the idea is found in Isaiah in its earliest form, and that the physical meaning is quite late. It would, however, be contrary to all analogy, if such phenomena as rainbow and lightning had not first impressed-the primitive mind as manifestations of God.<P>See <a href="study/isbe/search.html?string=GLORY">GLORY</a>.<P>(4) The Angel of God:<P>The angel (mal\'akh) of God or of Yahweh is a frequent mode of God\'s manifestation of Himself in human form, and for occasional purposes. It is a primitive conception, and its exact relation to God, or its likeness to man, is nowhere fixed. In many passages, it is assumed that God and His angel are the same being, and the names are used synonymously (as in <a onClick="return mV(\'Gen\',16,7);">Ge 16:7</a>ff; <a onClick="return mV(\'Gen\',22,15,16);">22:15,16</a>; <a onClick="return mV(\'Exd\',3,2,4);">Ex 3:2, 4</a>; <a onClick="return mV(\'Jdg\',2,4,5);">Jud 2:4-5</a>); in other passages the idea blurs into varying degrees of differentiation (<a onClick="return mV(\'Gen\',18,\'1-\');">Ge 18</a>; <a onClick="return mV(\'Gen\',24,40);">24:40</a>; <a onClick="return mV(\'Exd\',23,21);">Ex 23:21</a>; <a onClick="return mV(\'Exd\',33,2,3);">33:2-3</a>; <a onClick="return mV(\'Jdg\',13,8,9);">Jud 13:8-9</a>). But everywhere, it fully represents God as speaking or acting for the time being; and it is to be distinguished from the subordinate and intermediate beings of later angelology. Its identification with the Messiah and the Logos is only true in the sense that these later terms are more definite expressions of the idea of revelation, which the angel represented for primitive thought.<P>(5) The Spirit of God:<P>The spirit (ruach) of God in the earlier period is a form of His activity, as it moves warrior and prophet to act and to speak (<a onClick="return mV(\'Jdg\',6,34);">Jud 6:34</a>; <a onClick="return mV(\'Jdg\',13,25);">13:25</a>; <a onClick="return mV(\'1Sa\',10,10);">1Sa 10:10</a>), and it is in the prophetic period that it becomes the organ of the communication of God\'s thoughts to men.<P>See <a href="study/isbe/search.html?string=HOLY+SPIRIT,+1">HOLY SPIRIT</a>.<P>(6) The Name of God:<P>The name (shem) of God is the most comprehensive and frequent expression in the Old Testament for His self-manifestation, for His person as it may be known to men. The name is something visible or audible which represents God to men, and which, therefore, may be said to do His deeds, and to stand in His place, in relation to men. God reveals Himself by making known or proclaiming His name (<a onClick="return mV(\'Exd\',6,3);">Ex 6:3</a>; <a onClick="return mV(\'Exd\',33,19);">33:19</a>; <a onClick="return mV(\'Exd\',34,5,6);">34:5-6</a>). His servants derive their authority from His name (<a onClick="return mV(\'Exd\',3,13,15);">Ex 3:13, 15</a>; <a onClick="return mV(\'1Sa\',17,45);">1Sa 17:45</a>). To worship God is to call upon His name (<a onClick="return mV(\'Gen\',12,8);">Ge 12:8</a>; <a onClick="return mV(\'Gen\',13,4);">13:4</a>; <a onClick="return mV(\'Gen\',21,33);">21:33</a>; <a onClick="return mV(\'Gen\',26,25);">26:25</a>; <a onClick="return mV(\'1Ki\',18,\'24-26\');">1Ki 18:24-26</a>), to fear it (<a onClick="return mV(\'Deu\',28,58);">De 28:58</a>), to praise it (<a onClick="return mV(\'2Sa\',22,50);">2Sa 22:50</a>; <a onClick="return mV(\'Psa\',7,17);">Ps 7:17</a>; <a onClick="return mV(\'Psa\',54,6);">54:6</a>), to glorify it (<a onClick="return mV(\'Psa\',86,9);">Ps 86:9</a>). It is wickedness to take God\'s name in vain (<a onClick="return mV(\'Exd\',20,7);">Ex 20:7</a>), or to profane and blaspheme it (<a onClick="return mV(\'Lev\',8,21);">Le 8:21</a>; <a onClick="return mV(\'Lev\',24,16);">24:16</a>). God\'s dwelling-place is the place where He chooses "to cause his name to dwell" (<a onClick="return mV(\'2Sa\',7,13);">2Sa 7:13</a>; <a onClick="return mV(\'1Ki\',3,2);">1Ki 3:2</a>; <a onClick="return mV(\'1Ki\',5,3);">5:3, 5</a>; <a onClick="return mV(\'1Ki\',8,\'16-19\');">8:16-19</a>; <a onClick="return mV(\'1Ki\',18,32);">18:32</a>; <a onClick="return mV(\'Deu\',12,11,21);">De 12:11, 21</a>). God\'s name defends His people (<a onClick="return mV(\'Psa\',20,1);">Ps 20:1</a>; <a onClick="return mV(\'Isa\',30,27);">Isa 30:27</a>). For His name\'s sake He will not forsake them (<a onClick="return mV(\'1Sa\',12,22);">1Sa 12:22</a>), and if they perish, His name cannot remain (<a onClick="return mV(\'Jos\',7,9);">Jos 7:9</a>). God is known by different names, as expressing various forms of His self-manifestation (<a onClick="return mV(\'Gen\',16,13);">Ge 16:13</a>; <a onClick="return mV(\'Gen\',17,1);">17:1</a>; <a onClick="return mV(\'Exd\',3,6);">Ex 3:6</a>; <a onClick="return mV(\'Exd\',34,6);">34:6</a>). The name even confers its revelation-value upon the angel (<a onClick="return mV(\'Exd\',23,\'20-23\');">Ex 23:20-23</a>). All God\'s names are, therefore, significant for the revelation of His being.<P>(7) Occasional Forms:<P>In addition to these more or less fixed forms, God also appears in a variety of exceptional or occasional forms. In <a onClick="return mV(\'Num\',12,\'6-8\');">Nu 12:6-8</a>, it is said that Moses, unlike others, used to see the form (temunah) of Yahweh. Fire smoke and cloud are frequent forms or symbols of God\'s presence (e.g. <a onClick="return mV(\'Gen\',15,17);">Ge 15:17</a>; <a onClick="return mV(\'Exd\',3,\'2-4\');">Ex 3:2-4</a>; <a onClick="return mV(\'Exd\',19,18);">19:18</a>; <a onClick="return mV(\'Exd\',24,17);">24:17</a>), and notably "the pillar of cloud by day, and the pillar of fire by night" (<a onClick="return mV(\'Exd\',13,21);">Ex 13:21</a>f). According to later ideas, the cloud rested upon the tabernacle (<a onClick="return mV(\'Exd\',40,34);">Ex 40:34</a>), and in it God appeared upon the ark (<a onClick="return mV(\'Lev\',16,2);">Le 16:2</a>). Extraordinary occurrences or miracles are, in the early period, frequent signs of the power of God (<a onClick="return mV(\'Exd\',7,\'1-\');">Ex 7</a>ff; <a onClick="return mV(\'1Ki\',17,\'1-\');">1Ki 17</a>).<P>The questions of the objectivity of any or all of these forms, and of their relation to the whole Divine essence raise large problems. Old Testament thought had advanced beyond the naive identification of God with natural phenomena, but we should not read into its figurative language the metaphysical distinctions of a Greek-Christian theology.<P>3. The Names of God:<P>All the names of God were originally significant of His character, but the derivations, and therefore the original meanings, of several have been lost, and new meanings have been sought for them.<P>(1) Generic:<P>One of the oldest and most widely distributed terms for Deity known to the human race is \'El, with its derivations \'Elim, \'Elohim, and \'Eloah. Like theos, Dens and God, it is a generic term, including every member of the class deity. It may even denote a position of honor and authority among men. Moses was \'Elohim to Pharaoh (<a onClick="return mV(\'Exd\',7,1);">Ex 7:1</a>) and to Aaron (<a onClick="return mV(\'Exd\',4,16);">Ex 4:16</a>; compare <a onClick="return mV(\'Jdg\',5,8);">Jud 5:8</a>; <a onClick="return mV(\'1Sa\',2,25);">1Sa 2:25</a>; <a onClick="return mV(\'Exd\',21,5,6);">Ex 21:5-6</a>; <a onClick="return mV(\'Exd\',22,7);">22:7</a>ff; <a onClick="return mV(\'Psa\',58,11);">Ps 58:11</a>; <a onClick="return mV(\'Psa\',82,1);">82:1</a>). It is, therefore, a general term expressing majesty and authority, and it only came to be used as a proper name for Israel\'s God in the later period of abstract monotheism when the old proper name Yahweh was held to be too sacred to be uttered. The meaning of the root \'El, and the exact relation to it, and to one another, of \'Elohim and \'Eloah, lie in complete obscurity. By far the most frequent form used by Old Testament writers is the plural \'Elohiym, but they use it regularly with singular verbs and adjectives to denote a singular idea. Several explanations have been offered of this usage of a plural term to denote a singular idea—that it expresses the fullness and manifoldness of the Divine nature, or that it is a plural of majesty used in the manner of royal persons, or even that it is an early intimation of the Trinity; other cognate expressions are found in <a onClick="return mV(\'Gen\',1,26);">Ge 1:26</a>; <a onClick="return mV(\'Gen\',3,22);">3:22</a>; <a onClick="return mV(\'1Ki\',22,19);">1Ki 22:19</a>f; <a onClick="return mV(\'Isa\',6,8);">Isa 6:8</a>. These theories are, perhaps, too ingenious to have occurred to the early Hebrew mind, and a more likely explanation is, that they are survivals in language of a polytheistic stage of thought. In the Old Testament they signify only the general notion of Deity.<P>(2) Attributive:<P>To distinguish the God of Israel as supreme from others of the class \'Elohim, certain qualifying appellations are often added. \'El \'Elyon designates the God of Israel as the highest, the most high, among the \'Elohim (<a onClick="return mV(\'Gen\',14,\'18-20\');">Ge 14:18-20</a>); so do Yahweh \'Elyon (<a onClick="return mV(\'Psa\',7,17);">Ps 7:17</a>) and \'Elyon alone, often in Psalms and in <a onClick="return mV(\'Isa\',14,14);">Isa 14:14</a>.<p>\'El Shadday, or Shadday alone, is a similar term which on the strength of some tradition is translated "God Almighty"; but its derivation and meaning are quite unknown. According to <a onClick="return mV(\'Exd\',6,3);">Ex 6:3</a> it was the usual name for God in patriarchal times, but other traditions in the Pentateuch seem to have no knowledge of this.<P>Another way of designating God was by His relation to His worshippers, as God of Abraham, Isaac and Jacob (<a onClick="return mV(\'Gen\',24,12);">Ge 24:12</a>; <a onClick="return mV(\'Exd\',3,6);">Ex 3:6</a>), of Shem (<a onClick="return mV(\'Gen\',9,26);">Ge 9:26</a>), of the Hebrews (<a onClick="return mV(\'Exd\',3,18);">Ex 3:18</a>), and of Israel (<a onClick="return mV(\'Gen\',33,20);">Ge 33:20</a>).<P>Other names used to express the power and majesty of God are tsur, "Rock" (<a onClick="return mV(\'Deu\',32,18);">De 32:18</a>; <a onClick="return mV(\'Isa\',30,29);">Isa 30:29</a>), \'ªbhir (construct from \'abhir), "the Strong One" (<a onClick="return mV(\'Gen\',49,24);">Ge 49:24</a>; <a onClick="return mV(\'Isa\',1,24);">Isa 1:24</a>; <a onClick="return mV(\'Psa\',132,2);">Ps 132:2</a>); melekh, "King"; \'adhon, "lord," and \'adhonay, "my lord" (<a onClick="return mV(\'Exd\',23,17);">Ex 23:17</a>; <a onClick="return mV(\'Isa\',10,16,33);">Isa 10:16, 33</a>; <a onClick="return mV(\'Gen\',18,27);">Ge 18:27</a>; <a onClick="return mV(\'Isa\',6,1);">Isa 6:1</a>). Also ba\'al, "proprietor" or "master," may be inferred as a designation once in use, from its appearance in such Hebrew proper names as Jerubbaal and Ishbaal. The last three names describe God as a Master to whom man stands in the relation of a servant, and they tended to fall into disuse as the necessity arose to differentiate the worship of Yahweh from that of the gods of surrounding nations.<P>A term of uncertain meaning is Yahweh or \'Elohim tsebha\'oth, "Yahweh" or "God of hosts." In Hebrew usage "host" might mean an army of men, or the stars and the angels—which, apart or in conjunction, made up the host of heaven. God of Hosts in early times meant the war god who led the armies of Israel (<a onClick="return mV(\'1Sa\',4,4);">1Sa 4:4</a>; <a onClick="return mV(\'2Sa\',7,8);">2Sa 7:8</a>). In <a onClick="return mV(\'1Sa\',17,45);">1Sa 17:45</a> this title stands in parallelism with "the God of the armies of Israel." So all Israel is called the host of Yahweh (<a onClick="return mV(\'Exd\',12,41);">Ex 12:41</a>). In the Prophets, where the term has become a regular appellation, it stands in relation to every form of the power and majesty, physical and moral, of God (e.g. <a onClick="return mV(\'Isa\',2,12);">Isa 2:12</a>; <a onClick="return mV(\'Isa\',6,3,5);">6:3, 5</a>; <a onClick="return mV(\'Isa\',10,23,33);">10:23, 33</a>). It stands in parallelism with Isaiah\'s peculiar title, the Holy One of Israel (<a onClick="return mV(\'Isa\',5,16,24);">Isa 5:16, 24</a>). It has, therefore, been thought that it refers to the host of heaven. In the Prophets it is practically a proper name. Its original meaning may well have been forgotten or dropped, but it does not follow that a new special significance was attached to the word "hosts." The general meaning of the whole term is well expressed by the Septuagint translation, kurios pantokrator, "Lord Omnipotent."<P>(3) Yahweh (Yahweh).<P>This is the personal proper name par excellence of Israel\'s God, even as Chemosh was that of the god of Moab, and Dagon that of the god of the Philistines. The original meaning and derivation of the word are unknown. The variety of modern theories shows that, etymologically, several derivations are possible, but that the meanings attached to any one of them have to be imported and imposed upon the word. They add nothing to our knowledge. The Hebrews themselves connected the word with hayah, "to be." In <a onClick="return mV(\'Exd\',3,14);">Ex 3:14</a> Yahweh is explained as equivalent to \'ehyeh, which is a short form of \'ehyeh \'asher \'ehyeh, translated in the Revised Version (British and American) "I am that I am." This has been supposed to mean "self-existence," and to represent God as the Absolute. Such an idea, however, would be a metaphysical abstraction, not only impossible to the time at which the name originated, but alien to the Hebrew mind at any time. And the imperfect \'ehyeh is more accurately translated "I will be what I will be," a Semitic idiom meaning, "I will be all that is necessary as the occasion will arise," a familiar Old Testament idea (compare <a onClick="return mV(\'Isa\',7,4,9);">Isa 7:4, 9</a>; <a onClick="return mV(\'Psa\',23,\'1-\');">Ps 23</a>). This name was in use from the earliest historical times till after the exile. It is found in the most ancient literature. According to <a onClick="return mV(\'Exd\',3,13);">Ex 3:13</a>f; and especially <a onClick="return mV(\'Exd\',6,2,3);">6:2,3</a>, it was first introduced by Moses, and was the medium of a new revelation of the God of their fathers to the children of Israel. But in parts of Genesis it is represented as being in use from the earliest times. Theories that derive it from Egypt or Assyria, or that would connect it etymologically with Jove or Zeus, are supported by no evidence. We have to be content either to say that Yahweh was the tribal God of Israel from time immemorial, or to accept a theory that is practically identical with that of Exodus—that it was adopted through Moses from the Midianite tribe into which he married. The Kenites, the tribe of Midianites related to Moses, dwelt in the neighborhood of Sinai, and attached themselves to Israel (<a onClick="return mV(\'Jdg\',1,16);">Jud 1:16</a>; <a onClick="return mV(\'Jdg\',4,11);">4:11</a>). A few passages suggest that Sinai was the original home of Yahweh (<a onClick="return mV(\'Jdg\',5,4,5);">Jud 5:4-5</a>; <a onClick="return mV(\'Deu\',33,2);">De 33:2</a>). But there is no direct evidence bearing upon the origin of the worship of Yahweh: to us He is known only as the God of Israel.<P>4. Pre-prophetic Conceptions of Yahweh:<P>(1) Yahweh alone the God of Israel.<P>Hebrew theology consists essentially of the doctrine of Yahweh and its implications. The teachers and leaders of the people at all times worship and enjoin the worship of Yahweh alone. "It stands out as a prominent and incontrovertible fact, that down to the reign of Ahab...no prominent man in Israel, with the doubtful exception of Solomon, known by name and held up for condemnation, worshipped any other god but Yahweh. In every national and tribal crisis, in all times of danger and of war, it is Yahweh and Yahweh alone who is invoked to give victory and deliverance" (Montefiore, Hibbert Lectures (3), 21). This is more evident in what is, without doubt, very early literature, even than in later writings (e.g. <a onClick="return mV(\'Jdg\',5,\'1-\');">Jud 5</a>; <a onClick="return mV(\'Deu\',33,\'1-\');">De 33</a>; <a onClick="return mV(\'1Sa\',4,\'1-\');">1Sa 4-6</a>). The isolation of the desert was more favorable to the integrity of Yahweh\'s sole worship than the neighborhood of powerful peoples who worshipped many other gods. Yet that early religion of Yahweh can be called monotheistic only in the light of the end it realized, for in the course of its development it had to overcome many limitations.<P>(a) His Early Worship:<P>The early worship of Yahweh did not exclude belief in the existence of other gods. As other nations believed in the existence of Yahweh (<a onClick="return mV(\'1Sa\',4,8);">1Sa 4:8</a>; <a onClick="return mV(\'2Ki\',17,27);">2Ki 17:27</a>), so Israel did not doubt the reality of other gods (<a onClick="return mV(\'Jdg\',11,24);">Jud 11:24</a>; <a onClick="return mV(\'Num\',21,29);">Nu 21:29</a>; <a onClick="return mV(\'Mic\',4,5);">Mic 4:5</a>). This limitation involved two others: Yahweh is the God of Israel only; with them alone He makes a <a href="study/isbe/search.html?string=COVENANT">COVENANT</a> (which see) (<a onClick="return mV(\'Gen\',15,18);">Ge 15:18</a>; <a onClick="return mV(\'Exd\',6,4,5);">Ex 6:4-5</a>; <a onClick="return mV(\'2Ki\',17,34,35);">2Ki 17:34-35</a>), and their worship only He seeks (<a onClick="return mV(\'Deu\',4,\'32-37\');">De 4:32-37</a>; <a onClick="return mV(\'Deu\',32,9);">32:9</a>; <a onClick="return mV(\'Amo\',3,2);">Am 3:2</a>). Therefore, He works, and can be worshipped only within a certain geographical area. He may have been associated with His original home in Sinai long after the settlement in Canaan (<a onClick="return mV(\'Jdg\',5,4);">Jud 5:4</a>; <a onClick="return mV(\'Deu\',33,2);">De 33:2</a>; <a onClick="return mV(\'1Ki\',19,8,9);">1Ki 19:8-9</a>), but gradually His home and that of His people became identical (<a onClick="return mV(\'1Sa\',26,19);">1Sa 26:19</a>; <a onClick="return mV(\'Hsa\',9,3);">Ho 9:3</a>; <a onClick="return mV(\'Isa\',14,2,25);">Isa 14:2, 25</a>). Even after the deportation of the ten tribes, Canaan remains Yahweh\'s land (<a onClick="return mV(\'2Ki\',17,\'24-28\');">2Ki 17:24-28</a>). Early Israelites are, therefore, more properly described as Monolatrists or Henotheists than as Monotheists. It is characteristic of the religion of Israel (in contrast with, e.g. Greek thought) that it arrived at absolute Monotheism along the line of moral and religious experience, rather than that of rational inference. Even while they shared the common Semitic belief in the reality of other gods, Yahweh alone had for them "the value of God."<P>(b) Popular Religion:<P>It is necessary to distinguish between the teaching of the religious leaders and the belief and practice of the people generally. The presence of a higher religion never wholly excludes superstitious practices. The use of Teraphim (<a onClick="return mV(\'Gen\',31,30);">Ge 31:30</a>; <a onClick="return mV(\'1Sa\',19,13,16);">1Sa 19:13, 16</a>; <a onClick="return mV(\'Hsa\',3,4);">Ho 3:4</a>), Ephod (<a onClick="return mV(\'Jdg\',18,\'17-20\');">Jud 18:17-20</a>; <a onClick="return mV(\'1Sa\',23,6,9);">1Sa 23:6, 9</a>; <a onClick="return mV(\'1Sa\',30,7);">30:7</a>), Urim and Thummim (<a onClick="return mV(\'1Sa\',28,6);">1Sa 28:6</a>; <a onClick="return mV(\'1Sa\',14,40);">14:40</a>, Septuagint), for the purposes of magic and divination, to obtain oracles from Yahweh, was quite common in Israel. Necromancy was practiced early and late (<a onClick="return mV(\'1Sa\',28,7);">1Sa 28:7</a>ff; <a onClick="return mV(\'Isa\',8,19);">Isa 8:19</a>; <a onClick="return mV(\'Deu\',18,10,11);">De 18:10-11</a>). Sorcery and witchcraft were not unknown, but were condemned by the religious leaders (<a onClick="return mV(\'1Sa\',28,3);">1Sa 28:3</a>). The burial places of ancestors were held in great veneration (<a onClick="return mV(\'Gen\',35,20);">Ge 35:20</a>; <a onClick="return mV(\'Gen\',50,13);">50:13</a>; <a onClick="return mV(\'Jos\',24,30);">Jos 24:30</a>). But these facts do not prove that Hebrew religion was animistic and polytheistic, any more than similar phenomena in Christian lands would justify such an inference about Christianity.<P>(c) Polytheistic Tendencies:<P>Yet the worship of Yahweh maintained and developed its monotheistic principle only by overcoming several hostile tendencies. The Baal-worship of the Canaanites and the cults of other neighboring tribes proved a strong attraction to the mass of Israelites (<a onClick="return mV(\'Jdg\',2,13);">Jud 2:13</a>; <a onClick="return mV(\'Jdg\',3,7);">3:7</a>; <a onClick="return mV(\'Jdg\',8,33);">8:33</a>; <a onClick="return mV(\'Jdg\',10,10);">10:10</a>; <a onClick="return mV(\'1Sa\',8,8);">1Sa 8:8</a>; <a onClick="return mV(\'1Sa\',12,10);">12:10</a>; <a onClick="return mV(\'1Ki\',11,5,33);">1Ki 11:5, 33</a>; <a onClick="return mV(\'Hsa\',2,5,17);">Ho 2:5, 17</a>; <a onClick="return mV(\'Eze\',20,\'1-\');">Eze 20</a>; <a onClick="return mV(\'Exd\',20,5);">Ex 20:5</a>; <a onClick="return mV(\'Exd\',22,20);">22:20</a>; <a onClick="return mV(\'Exd\',34,16,17);">34:16-17</a>). Under the conditions of life in Canaan, the sole worship of Yahweh was in danger of modification by three tendencies, coordination, assimilation, and disintegration.<P>(i) Coordination:<P>When the people had settled down in peaceful relations with their neighbors, and began to have commercial and diplomatic transactions with them, it was inevitable that they should render their neighbor\'s gods some degree of reverence and worship. Courtesy and friendship demanded as much (compare <a onClick="return mV(\'2Ki\',5,18);">2Ki 5:18</a>). When Solomon had contracted many foreign a
