isbe = [];

isbe[3801]='Gilboa, Mount`gil-bo\'-a (har hagilboa, "Mount of the Gilboa"): Unless we should read "Gilboa" for "Gilead" in <a onClick="return mV(\'Jdg\',7,3);">Jud 7:3</a> (see <a href="study/isbe/search.html?string=GILEAD+(2)">GILEAD, 2</a>) this mountain is mentioned in Scripture only in connection with the last conflict of Saul with the Philistines, and his disastrous defeat (<a onClick="return mV(\'1Sa\',28,4);">1Sa 28:4</a>; <a onClick="return mV(\'1Sa\',31,1,8);">31:1, 8</a>; <a onClick="return mV(\'2Sa\',1,6,21);">2Sa 1:6, 21</a>; <a onClick="return mV(\'2Sa\',21,12);">21:12</a>; <a onClick="return mV(\'1Ch\',10,1,8);">1Ch 10:1, 8</a>). If Zer\'in be identical with Jezreel—a point upon which Professor R.A.S. Macalister has recently cast some doubt—Saul must have occupied the slopes on the northwest side of the mountain, near "the fountain which is in Jezreel" (<a onClick="return mV(\'1Sa\',29,1);">1Sa 29:1</a>). The Philistines attacked from the plain, and the battle went sore against the men of Israel, who broke and fled; and in the flight Jonathan, Abinadab and Malchi-shua, sons of Saul, were slain. Rather than be taken by his lifelong foes, Saul fell upon his sword and died (<a onClick="return mV(\'1Sa\',31,1);">1Sa 31:1</a>).<P>The modern name of the mountain is Jebel Faqu\'a. It rises on the eastern edge of the plain of Esdraelon, and, running from Zer\'in to the southeast, it then sweeps southward to join the Samarian uplands. It presents an imposing appearance from the plain, but the highest point, Sheikh Burqan, is not more than 1,696 ft. above sea level. In the higher reaches the range is rugged and barren; but vegetation is plentiful on the lower slopes, especially to the west. The Kishon takes its rise on the mountain. Under the northern cliffs rises \'Ain Jalud, possibly identical with <a href="study/isbe/search.html?string=HAROD,+WELL+OF">HAROD, WELL OF</a>, which see. In Jelbun, a village on the western declivity, there is perhaps an echo of the old name.``54';
isbe[3802]='Gilead (1)`gil\'-e-ad (ha-gil\'adh, "the Gilead"): The name is explained in <a onClick="return mV(\'Gen\',31,46);">Ge 31:46</a>ff, <a onClick="return mV(\'Gen\',31,51);">51</a>, as derived from Hebrew gal, "a cairn," and \'edh, "witness," agreeing in meaning with the Aramaic yegharsahadhutha\'. The Arabic jilead means "rough," "rugged."<P>(1) A city named in <a onClick="return mV(\'Hsa\',6,8);">Ho 6:8</a>; <a onClick="return mV(\'Hsa\',12,11);">12:11</a>, possibly to be identified with Gilead near to Mizpah (<a onClick="return mV(\'Jdg\',10,17);">Jud 10:17</a>). If this is correct, the ancient city may be represented by the modern Jil\'ad, a ruin about 5 miles north of es-Salt.<P>(2) A mountain named in <a onClick="return mV(\'Jdg\',7,3);">Jud 7:3</a>. Gideon, ordered to reduce the number of men who were with him, commanded all who were "fearful and trembling" to "return and depart from Mt. Gilead." the Revised Version, margin reads "return and go round about from Mt. Gilead." Gideon and his army lay to the south of the plain of Jezreel on the lower slopes of Gilboa. It has been suggested (Studer, Comm., at the place) that, as the Midianites lay between the men of the northern tribes and their homes, they were told to cross the Jordan, make a detour through Gilead, and thus avoid the enemy. Possibly, however, we should read Gilboa for Gilead; or part of the mountain may have borne the name of Gilead. The last suggestion is favored by the presence of a strong spring under the northern declivity of Gilboa, nearly 2 miles from Zer\'in, possibly to be identified with the Well of Harod. In the modern name, \'Ain Jalud, there may be an echo of the ancient Gilead.<P>(3) The name is applied generally to the mountain mass lying between the Yarmuk on the north, and Wady Chesban on the south; the Jordan being the boundary on the west, while on the east it marched with the desert.<P>1. The Land of Gilead:<P>Mount Gilead—literally, "Mount of the Gilead"—may refer to some particular height which we have now no means of identifying (<a onClick="return mV(\'Gen\',31,23);">Ge 31:23</a>). The name Jebel Jil\'ad is still, indeed, applied to a mountain south of Nahr ez-Zerqa and north of es-Salt; but this does not meet the necessities of the passage as it stands. The same expression in <a onClick="return mV(\'Deu\',3,12);">De 3:12</a> obviously stands for the whole country. This is probably true also in <a onClick="return mV(\'Sgs\',4,1);">So 4:1</a>. The name Gilead is sometimes used to denote the whole country east of the Jordan (<a onClick="return mV(\'Gen\',37,25);">Ge 37:25</a>; <a onClick="return mV(\'Jos\',22,9);">Jos 22:9</a>; <a onClick="return mV(\'2Sa\',2,9);">2Sa 2:9</a>, etc.). Again, along with Bashan, it indicates the land east of Jordan, as distinguished from the Moab plateau (<a onClick="return mV(\'Deu\',3,10);">De 3:10</a>; <a onClick="return mV(\'Jos\',13,11);">Jos 13:11</a>; <a onClick="return mV(\'2Ki\',10,33);">2Ki 10:33</a>).<P>2.Bashan:<P>In the north Gilead bordered upon Geshur and Maacah (<a onClick="return mV(\'Jos\',13,11,13);">Jos 13:11, 13</a>); and here the natural boundary would be formed by the deep gorge of the Yarmuk and Wady esh-Shellaleh. In pre-Israelite times the Jabbok (Nahr ez-Zerqa), which cuts the country in two, divided the kingdom of Sihon from that of Og (<a onClick="return mV(\'Deu\',3,16);">De 3:16</a>; <a onClick="return mV(\'Jos\',12,2);">Jos 12:2</a>). The frontiers between the tribes of Reuben, Gad and Manasseh cannot be indicated with any certainty. Probably they varied at different times (compare <a onClick="return mV(\'Jos\',13,24);">Jos 13:24</a>ff; <a onClick="return mV(\'1Ch\',5,8,9,11,16);">1Ch 5:8-9, 11, 16</a>). It greatly increases the difficulty that so many of the cities named are still unidentified. But in any case it is clear that the bulk of Gilead fell to Gad, so that Gilead might stand for Gad (<a onClick="return mV(\'Jdg\',5,17);">Jud 5:17</a>). <a href="study/isbe/search.html?string=HAVVOTH-JAIR">HAVVOTH-JAIR</a> (which see), "the villages of Jair," lay in Gilead (<a onClick="return mV(\'Jdg\',10,4);">Jud 10:4</a>). The modern division of the country follows the natural features. From the Yarmuk to Nahr ez-Zerqa is the district of \'Ajlun; and from the Zerqa to the Arnon is el-Belqa.<P>3. Geology:<P>The geological formation is the same as that of Western Palestine, but the underlying sandstone, which does not appear west of the Jordan, forms the base slopes of the chain of Moab and Gilead, and is traceable as far as the Jabbok. It is covered in part by the more recent white marls which form the curious peaks of the foothills immediately above the Jordan valley; but reaches above them to an elevation of 1,000 ft. above the Mediterranean on the south, and forms the bed of the Buqei\'a basin farther east, and 1,000 ft. higher. Above this lies the hard, impervious dolomite limestone which appears in \'the rugged hills round\' the Jabbok and in Jebel \'Ajlun, rising on an average 1,500 ft. above the sandstone and forming the bed of the copious springs. It also dips toward the Jordan valley, and the water from the surface of the plateau, sinking down to the surface of their formation, bursts out of the hill slopes on the west in perennial brooks. It was from the ruggedness of this hard limestone that Gilead obtained its name. Above this again is the white chalk of the desert plateau, the same as that found in Samaria and Lower Galilee, with bands of flint or chert in contorted layers, or strewn in pebbles on the surface. Where this formation is deep the country is bare and arid, supplied by cisterns and deep wells. Thus the plateau becomes desert, while the hill slopes abound in streams and springs; and for this reason Western Gilead is a fertile country, and Eastern Gilead is a wilderness (Conder, DB, under the word).<P>4. Mountains:<P>The uplands of Gilead may be described as the crumpling of the edge of the great eastern plateau ere it plunges into the Ghor. The average height of the range is about 4,000 ft. above the Jordan valley, or 3,000 ft. above the Mediterranean. The greatest height is toward the south, where it culminates in Jebel Osh\'a (3,597 ft.), to the north of es-Salt. This mountain commands a most spacious view. To the east of it lies the hollow (an old lake bottom) of el-Buqei\'a, fully 1,500 ft. lower. In the north we have Jebel Hakart (3,408 ft.) W, of Reimun. Almost as high (3,430 ft.) is Jebei Kafkafah, about 12 miles to the northeast. A striking point (2,700 ft.) fully 2 miles northwest of \'Ajlun, is crowned by Qal\'at er-Rabad, whence again a view of extraordinary extent is gained.<P>5. Streams and Products:<P>The Yarmuk and the Zerqa (see <a href="study/isbe/search.html?string=JABBOK">JABBOK</A> are the main streams, but almost every valley has its perennial brook. While not so rich as the volcanic loam in the North and in and the south, the soil of Gilead amply repays the labor of the husbandman. Of flowers the most plentiful are the phlox, the cistus and the narcissus. Hawthorn, mastic and arbutus abound, while many a glen and slope is shady with shaggy oak woods, and, in the higher reaches, with pines. The streams are fringed with oleander. The monotony of the stony plateau is broken by clumps of the hardy white broom. In the lower ground are found the tamarisk and the lotus, with many a waving cane-brake. The scenery is more beautiful and picturesque than that of any other district of Palestine. The soil is not now cultivated to any great extent; but it furnishes ample pasture for many flocks and herds (<a onClick="return mV(\'Sgs\',6,5);">So 6:5</a>).<P>The Ishmaelites from Gilead (<a onClick="return mV(\'Gen\',37,25);">Ge 37:25</a>) were carrying "spicery and balm and myrrh." From old time Gilead was famed for its <a href="study/isbe/search.html?string=BALM">BALM</A> (which see). The lot, translated "myrrh" in the above passage, was probably the gum produced by the Cistus ladaniferus, a flower which still abounds in Gilead.<P>6. History:<P>After the conquest, as we have seen, Gilead passed mainly into the hands of Gad. An Ammonite attack was repulsed by the prowess of Jephthah (<a onClick="return mV(\'Jdg\',11,1);">Jud 11:1</a>); and the spite of the Ephraimites was terribly punished (<a onClick="return mV(\'Jdg\',12,1);">Jud 12:1</a>). Gilead at first favored the cause of Ishbosheth (<a onClick="return mV(\'2Sa\',2,9);">2Sa 2:9</a>), but after the murder of that prince the Gileadites came with the rest of Israel to David (<a onClick="return mV(\'2Sa\',5,1);">2Sa 5:1</a>). By the conquest of the fortress Rabbah, which the Ammonites had continued to hold, the land passed finally under the power of David (<a onClick="return mV(\'2Sa\',12,26);">2Sa 12:26</a>). David fled to Mahanaim from Absalom, and that rebel prince perished in one of the forests of Gilead (<a onClick="return mV(\'2Sa\',17,24);">2Sa 17:24</a>; <a onClick="return mV(\'2Sa\',18,6);">18:6</a>). Joab\'s census included Gilead (<a onClick="return mV(\'2Sa\',24,6);">2Sa 24:6</a>). Solomon had two commissariat districts in Gilead (<a onClick="return mV(\'1Ki\',4,13);">1Ki 4:13</a>f; <a onClick="return mV(\'1Ki\',4,19);">19</a>). Before Ramoth-gilead, which he sought to win back from the Syrians who had captured it, Ahab received his death wound (<a onClick="return mV(\'1Ki\',22,1);">1Ki 22:1</a>). The Syrians asserted their supremacy in Gilead (<a onClick="return mV(\'2Ki\',10,32);">2Ki 10:32</a>f) where Moab and Israel had contended with varying fortune (M S). At length Tiglath-pileser overran the country and transported many of the inhabitants (<a onClick="return mV(\'2Ki\',15,29);">2Ki 15:29</a>). This seems to have led to a reconquest of the land by heathenism, and return to Gilead was promised to Israel (<a onClick="return mV(\'Zec\',10,10);">Zec 10:10</a>).<P>At a later time the Jewish residents in Gilead were exposed to danger from their heathen neighbors. On their behalf Judas Maccabeus invaded the country and met with striking success (1Macc 5:9ff). Alexander Janneus, who had subdued Gilead, was forced to yield it again to the king of Arabia (Ant., XIII, xiv, 2; BJ, I, iv, 3). During the Roman period, especially in the 2nd and 3rd centuries AD, the land enjoyed great prosperity. Then were built such cities as Gadara and Gerasa, which are still imposing, even in ruins. The appearance of the Moslem armies was the signal for its decay. Attempts were made to recover it for Christianity by Baldwin I (1118 AD) and Baldwin II (1121 AD); and the Crusaders left their mark in such strong-holds as Kal\'at er-Rabad and the castle at es-Salt. With the reassertion of Moslem supremacy a curtain falls over the history of the district; and only in comparatively recent times has it again become known to travelers. The surveys directed by the Palestine Exploration Fund, in so far as they have been carried out, are invaluable. North of the Jabbok are many villages, and a fair amount of cultivation. Es Salt is the only village of any importance in the south. It is famous for its raisins. Its spacious uplands, its wooded and well-watered valleys have been for centuries the pasture-land of the nomads.<P>LITERATURE.<P>Useful information will be found in Merrill, east of the Jordan; Oliphant, Land of Gilead; Thomson, LB; and especially in Conder, Heth and Moab, and in Memoirs of the Survey of Eastern Palestine``54';
isbe[3803]='Gilead (2)`(gil\'adh):<P>(1) A son of Machir, grandson of Manasseh (<a onClick="return mV(\'Num\',26,29,30);">Nu 26:29-30</a>).<P>(2) The father of Jephthah (<a onClick="return mV(\'Jdg\',11,1,2);">Jud 11:1-2</a>).<P>(3) A Gadite, the son of Michael (<a onClick="return mV(\'1Ch\',5,14);">1Ch 5:14</a>).``1';
isbe[3804]='Gilead, Balm of``<a href="./study/isbe/search.html?string=BALM+OF+GILEAD">BALM OF GILEAD</a>`1';
isbe[3805]='Gilead, Mount``<a href="./study/isbe/search.html?string=GILEAD">GILEAD</a>`1';
isbe[3806]='Gileadites`gil\'-e-ad-its:<P>(1) A branch of the tribe of Manasseh (<a onClick="return mV(\'Num\',26,29);">Nu 26:29</a>).<P>(2) Natives of the district of Gilead (<a onClick="return mV(\'Jdg\',10,3);">Jud 10:3</a>; <a onClick="return mV(\'Jdg\',11,1);">11:1</a>, etc.).``1';
isbe[3807]='Gilgal`gil\'-gal (gilgal, "circle"; Galgala): The article is always with the name except in <a onClick="return mV(\'Jos\',5,9);">Jos 5:9</a>. There are three places to which the name is attached:<P>(1) The first camp of Israel after crossing the Jordan (<a onClick="return mV(\'Jos\',4,19);">Jos 4:19</a>; <a onClick="return mV(\'Jos\',5,9,10);">5:9-10</a>; <a onClick="return mV(\'Jos\',9,6);">9:6</a>; <a onClick="return mV(\'Jos\',10,7);">10:7</a>; <a onClick="return mV(\'Jos\',14,6);">14:6</a>; <a onClick="return mV(\'Jos\',15,7);">15:7</a>; <a onClick="return mV(\'Deu\',11,30);">De 11:30</a>). According to <a onClick="return mV(\'Jos\',15,7);">Jos 15:7</a> it lay to the north of the valley of Achor, which formed the border between Judah and Benjamin. Here 12 memorial stones taken from the bed of the river were set up by Joshua, after the miraculous crossing of the Jordan; and here (<a onClick="return mV(\'Jos\',5,5);">Jos 5:5</a>) the people were circumcised preparatory to their possession of the land, when it is said in Joshua, with a play upon the word, "This day have I rolled away the reproach of Egypt from off you." Whereupon the Passover was celebrated (<a onClick="return mV(\'Jos\',5,10);">Jos 5:10</a>) and the manna ceased (<a onClick="return mV(\'Jos\',5,12);">Jos 5:12</a>). To Gilgal the ark returned every day after having compassed the city of Jericho during its siege (<a onClick="return mV(\'Jos\',6,11);">Jos 6:11</a>). Hither the Gibeonites came to make their treaty (<a onClick="return mV(\'Jos\',9,3);">Jos 9:3</a>), and again (<a onClick="return mV(\'Jos\',10,6);">Jos 10:6</a>) to ask aid against the Amorites. Gilgal was still the headquarters of the Israelites after the battle with the Amorites (<a onClick="return mV(\'Jos\',10,15);">Jos 10:15</a>); again after Joshua\'s extensive victorious campaign in the hill country of Judea extending to Kadesh-barnea and Gaza (<a onClick="return mV(\'Jos\',10,15);">Jos 10:15</a>); and still later upon his return from the great battle at the Waters of Merom (<a onClick="return mV(\'Jos\',14,6);">Jos 14:6</a>). At the conclusion of the conquest (<a onClick="return mV(\'Jos\',18,1);">Jos 18:1</a>), the headquarters were transferred to Shiloh on the summit of the mountain ridge to the west.<P>Gilgal reappears frequently in subsequent history. Samuel (<a onClick="return mV(\'1Sa\',7,16);">1Sa 7:16</a>) made it one of the three places where he annually held circuit court, the other places being Bethel and Mizpah. The Septuagint text adds that these were holy places. The place continued as one of special resort for sacrifices (<a onClick="return mV(\'1Sa\',10,8);">1Sa 10:8</a>; <a onClick="return mV(\'1Sa\',13,8,9,10);">13:8-10</a>; <a onClick="return mV(\'1Sa\',15,21);">15:21</a>), while it was here that Samuel hewed Agag to pieces before the Lord (<a onClick="return mV(\'1Sa\',15,33);">1Sa 15:33</a>), and that Saul was both crowned (<a onClick="return mV(\'1Sa\',11,14,15);">1Sa 11:14-15</a>) and rejected as king. It was at Gilgal, also (<a onClick="return mV(\'2Sa\',19,15);">2Sa 19:15</a>), that the people assembled to welcome David as he returned from his exile beyond Jordan during Absalom\'s rebellion. The early prophets refer to Gilgal as a center of idolatry in their day (<a onClick="return mV(\'Hsa\',4,15);">Ho 4:15</a>; <a onClick="return mV(\'Hsa\',9,15);">9:15</a>; <a onClick="return mV(\'Hsa\',12,11);">12:11</a>; <a onClick="return mV(\'Amo\',4,4);">Am 4:4</a>; <a onClick="return mV(\'Amo\',5,5);">5:5</a>). Micah (<a onClick="return mV(\'Amo\',6,5);">6:5</a>) represents Gilgal as at the other end of the Dead Sea from Shittim.<P>In 1874 Conder recognized the name Gilgal as surviving in Barker Jiljuilieh, a pool beside a tamarisk tree 3 miles east of old Jericho. The pool measures 100 ft. by 84, and is surrounded with a wall of roughly hewn stones. North of the pool Bliss discovered lines of masonry 300 yds. long, representing probably the foundations of an ancient monastery. South of the pool there are numerous mounds scattered over an area of one-third of a square mile, the largest being 50 feet in diameter, and 10 feet in height. On excavation some pottery and glass were found. These ruins are probably those of early Christian occupation, and according to Conder there is nothing against their marking the original site. Up to the Middle Ages the 12 stones of Joshua were referred to by tradition.<P>(2) According to <a onClick="return mV(\'2Ki\',2,1);">2Ki 2:1</a>; <a onClick="return mV(\'2Ki\',4,38);">4:38</a>, Elisha for a time made his headquarters at Gilgal, a place in the mountains not far from Bethel identified by Conder as Jiljilia, standing on a high hill on the north side of the Wady el-Jib. It is lower than Bethel, but the phrase in <a onClick="return mV(\'2Ki\',2,2);">2Ki 2:2</a>, "they went down to Beth-el," may refer to their initial descent into the wady. It could not have been said that they went down from Gilgal to Bethel in the Jordan valley. The place seems to be referred to in <a onClick="return mV(\'Neh\',12,29);">Neh 12:29</a> as Beth-gilgal.<P>(3) Gilgal of the nations: In <a onClick="return mV(\'Jos\',12,23);">Jos 12:23</a> Gilgal is mentioned as a royal city associated with Dor, evidently upon the maritime plain. Dor is identified with Tantura, while Conder identifies this Gilgal with Jiljuilieh, 30 miles south of Dor and 4 miles north of Anti-patris.``198';
isbe[3808]='Giloh`gi\'-lo (giloh): A town in the hill country of Judah mentioned along with Jattir, Socoh, Debir, Eshtemoa, etc. (<a onClick="return mV(\'Jos\',15,51);">Jos 15:51</a>). Ahithophel came from here (<a onClick="return mV(\'2Sa\',15,12);">2Sa 15:12</a>) and is called the Gilonite (<a onClick="return mV(\'2Sa\',23,34);">2Sa 23:34</a>). Driver infers from this last that the original form was Gilon, not Giloh. Probably the ruins Kb. Jala, in the hills 3 miles northwest of Hulhul, mark the site (PEF, III,313,Sh XXI).``1';
isbe[3809]='Gilonite`gi\'-lo-nit.`<a href="./study/isbe/search.html?string=GILOH">GILOH</a>`1';
isbe[3810]='Gimel`ge\'-mel, gim\'-el ("g"): The 3rd letter of the Hebrew alphabet, and used as such to designate the 3rd part of <a onClick="return mV(\'Psa\',119,\'17-24\');">Ps 119</a>; transliterated in this Encyclopedia with the dagesh as "g", and without the dagesh as "gh" (aspirated "g"). It came also to be used for the number three (3), and with the dieresis for 3,000.`<a href="./study/isbe/search.html?string=ALPHABET">ALPHABET</a>`1';
isbe[3811]='Gimzo`gim\'-zo (gimzo; Gamzo): A town of Judah on the border of the Philistine plain, captured by the Philistines in the days of Ahaz (<a onClick="return mV(\'2Ch\',28,18);">2Ch 28:18</a>). It is the modern Jimzu, a small mud village about 3 1/2 miles southeast of Ludd (Lydda), on the old mule road from there to Jerusalem (Robinson, BR, II, 248-49; SWP, Il, 297).``1';
isbe[3812]='Gin`jin (moqesh, pach): A noose of hair or wire for snaring wild birds alive. There are over half a dozen traps and net devices indicated by different terms in the Bible. The gin was of horse-hair for small birds and wire for larger ones. It is mentioned in <a onClick="return mV(\'Amo\',3,5);">Am 3:5</a>: "Can a bird fall in a snare upon the earth, where no gin is set for him? shall a snare spring up from the ground, and have taken nothing at all?" Job writing in mental and physical discomfort on the ash heap included all methods mentioned in one outburst:<P>"For he is cast into a net by his own feet.<br>And he walketh upon the toils.<br>A gin shall take him by the heel,<br>And a snare shall lay hold on him,<br>A noose is hid for him in the ground.<br>And a trap for him in the way" (<a onClick="return mV(\'Job\',18,8);">Job 18:8</a>).``167';
isbe[3813]='Ginath`gi\'-nath (ginath): Father of Tibni, the unsuccessful rival of Omri (<a onClick="return mV(\'1Ki\',16,21,22);">1Ki 16:21-22</a>).``1';
isbe[3814]='Ginnethoi; Ginnethon`gin-e-tho\'-i, gin\'-e-thon (the King James Version Ginnetho), (ginnethoy, and ginnethon): The head of a priestly family. Ginnethoi (Ginnetho) is found in <a onClick="return mV(\'Neh\',12,4);">Ne 12:4</a>, and Ginnethon in <a onClick="return mV(\'Neh\',10,6);">10:6</a>; <a onClick="return mV(\'Neh\',12,16);">12:16</a>.``1';
isbe[3815]='Girdle`gur\'-d\'-l.`<a href="./study/isbe/search.html?string=ARMOR; ARMS">ARMOR</a>; <a href="./study/isbe/search.html?string=DRESS">DRESS</a>`1';
isbe[3816]='Girgashite`gur\'-ga-shit (girgashi; Gergesaios; also punctuated (?) Girgasite (<a onClick="return mV(\'Gen\',10,16);">Ge 10:16</a> the King James Version)): A son of (the land of) Canaan (<a onClick="return mV(\'Gen\',10,16);">Ge 10:16</a>), and accordingly enumerated along with the Canaanite\' in the list of tribes or nationalities inhabiting that country (<a onClick="return mV(\'Gen\',15,21);">Ge 15:21</a>; <a onClick="return mV(\'Deu\',7,1);">De 7:1</a>; <a onClick="return mV(\'Jos\',3,10);">Jos 3:10</a>; <a onClick="return mV(\'Jos\',24,11);">24:11</a>; <a onClick="return mV(\'Neh\',9,8);">Ne 9:8</a>). It has been supposed that the name survived in that of "the Gergesenes," the King James Version (the Revised Version (British and American) "the Gadarenes"), of <a onClick="return mV(\'Mat\',8,28);">Mt 8:28</a>, on the east side of the Sea of Galilee; Josephus (Ant., I, vi, 2), however, states that nothing was known about it. The inscriptions of the Egyptian king, Ramses II, mention the Qarqish who sent help to the Hittites in their war with Egypt; but Qarqish was more probably in Asia Minor than in Syria. Pinches (The Old Testament in the Light of the Historical Records, 324) would identify the Girgashites with the Kirkishati of an Assyrian tablet; the latter people, however, seem to have lived to the east of the Tigris, and it may be that, as in the case of the Hittites, a colony of the Qarqish, from Asia Minor, was established in Palestine.``157';
isbe[3817]='Girl`gurl: Twice in the Old Testament as the rendering of yaldah (<a onClick="return mV(\'Joe\',3,3);">Joe 3:3</a>; <a onClick="return mV(\'Zec\',8,5);">Zec 8:5</a>), in both cases in association with boys. Same word rendered "damsel" in <a onClick="return mV(\'Gen\',34,4);">Ge 34:4</a>.`<a href="./study/isbe/search.html?string=DAUGHTER">DAUGHTER</a>; <a href="./study/isbe/search.html?string=MAID;+MAIDEN">MAID, MAIDEN</a>`1';
isbe[3818]='Girzites`gur\'-zits.`<a href="./study/isbe/search.html?string=GIZRITES">GIZRITES</a>`1';
isbe[3819]='Gishpa`gish\'-pa (the King James Version Gispa; gishpa\'): An officer of the Nethinim (<a onClick="return mV(\'Neh\',11,21);">Ne 11:21</a>). A comparison with <a onClick="return mV(\'Ezr\',2,43);">Ezr 2:43</a> makes it probable that he is to be identified with Hasupha, and quite possible that this word is a corruption of Hasupha.``1';
isbe[3820]='Gittah-Hepher`git-a-he\'-fer (gittah chepher): the King James Version (<a onClick="return mV(\'Jos\',19,13);">Jos 19:13</a>) for Gath-hepher. Gittah is correctly Gath with the Hebrew letter, he ("h") locale, meaning "toward Gath."``1';
isbe[3821]='Gittaim`git\'-a-im (gittayim): The town to which the Beerothites tied, and where they lived as gerim, or protected strangers (<a onClick="return mV(\'2Sa\',4,3);">2Sa 4:3</a>). The place need not have been beyond the boundaries of Benjamin, so it may be identical with Gittaim of <a onClick="return mV(\'Neh\',11,33);">Ne 11:33</a>, which was occupied by Benjamites after the exile. It is named with Hazor and Ramah; but so far the site has not been discovered.``1';
isbe[3822]='Gittites`git\'-its (gittim, plural of gittiy): The inhabitants of Gath. They are mentioned along with the inhabitants of the other chief Philistine cities in <a onClick="return mV(\'Jos\',13,3);">Jos 13:3</a>. It would seem that numbers of them emigrated to Judah, for we find 600 of them acting as a bodyguard to David with Ittai at their head (<a onClick="return mV(\'2Sa\',15,18);">2Sa 15:18</a>ff; <a onClick="return mV(\'2Sa\',18,2);">18:2</a>). Obed-edom, to whom David entrusted the ark when he was frustrated in bringing it into the city of David, was a Gittite (<a onClick="return mV(\'2Sa\',6,11);">2Sa 6:11</a>f; <a onClick="return mV(\'1Ch\',13,13);">1Ch 13:13</a>). The Gittites seem to have been remarkable for their great stature (<a onClick="return mV(\'2Sa\',21,19);">2Sa 21:19</a>; <a onClick="return mV(\'1Ch\',20,5);">1Ch 20:5</a>).``1';
isbe[3823]='Gittith`git\'-ith.`<a href="./study/isbe/search.html?string=MUSIC">MUSIC</a>; <a href="./study/isbe/search.html?string=PSALMS">PSALMS</a>`1';
isbe[3824]='Give`(nathan, yahabh, sum; didomi): "Give" is a very common word in the Old Testament. It is most frequently the translation of nathan, "to give" (<a onClick="return mV(\'Gen\',1,29);">Ge 1:29</a>; <a onClick="return mV(\'Gen\',3,6);">3:6</a>; <a onClick="return mV(\'Exd\',2,9);">Ex 2:9</a>; <a onClick="return mV(\'Deu\',18,\'1-\');">De 18</a>; <a onClick="return mV(\'Deu\',20,\'1-\');">20</A>, etc., over 800 instances); nathan is also translated "to give up" (<a onClick="return mV(\'Deu\',23,14);">De 23:14</a>; <a onClick="return mV(\'Isa\',43,6);">Isa 43:6</a>; <a onClick="return mV(\'Hsa\',11,8);">Ho 11:8</a>); of yahabh, "to give" (<a onClick="return mV(\'Gen\',30,1);">Ge 30:1</a>; <a onClick="return mV(\'1Ch\',16,28);">1Ch 16:28</a> the King James Version). In <a onClick="return mV(\'Psa\',55,22);">Ps 55:22</a> we have the perfect with suffix, "Cast thy burden upon Yahweh," margin "what he hath given thee"; elsewhere it is the imperative "Give!" (the King James Version in Genesis, "Go to"); sum, "to put," "place" (<a onClick="return mV(\'Num\',6,26);">Nu 6:26</a>; <a onClick="return mV(\'Pro\',8,29);">Pr 8:29</a>); rum, "to lift up," "exalt" (<a onClick="return mV(\'2Ch\',30,24);">2Ch 30:24</a>; <a onClick="return mV(\'2Ch\',35,7,8,9);">35:7-9</a>, "to give to"); shubh, "to cause to turn back" (<a onClick="return mV(\'Lev\',25,51,52);">Le 25:51-52</a>; <a onClick="return mV(\'2Ki\',17,3);">2Ki 17:3</a>, "to give again"); various other words are in single instances translated "give."<P>In the New Testament, the common word is didomi, "to give" (<a onClick="return mV(\'Mat\',4,9);">Mt 4:9</a>; <a onClick="return mV(\'Jhn\',1,12);">Joh 1:12</a>; <a onClick="return mV(\'Rev\',1,1);">Re 1:1</a>; <a onClick="return mV(\'Rev\',21,6);">21:6</a>, etc.); we have also apodidomi, "to give away (from one\'s self)" (<a onClick="return mV(\'Mat\',12,36);">Mt 12:36</a>; <a onClick="return mV(\'Luk\',16,2);">Lu 16:2</a>; <a onClick="return mV(\'Act\',4,33);">Ac 4:33</a>; <a onClick="return mV(\'Act\',19,40);">19:40</a>; <a onClick="return mV(\'Rev\',22,12);">Re 22:12</a>); diadidomi, "to give throughout" (<a onClick="return mV(\'Rev\',17,13);">Re 17:13</a>); epididomi, "to give upon or besides" (<a onClick="return mV(\'Mat\',7,9,10);">Mt 7:9-10</a>; <a onClick="return mV(\'Jhn\',13,26);">Joh 13:26</a>); metadidomi, "to give a share" (<a onClick="return mV(\'Rom\',12,8);">Ro 12:8</a>); paradidomi, "to give over to" (<a onClick="return mV(\'Rom\',1,28);">Ro 1:28</a>; <a onClick="return mV(\'1Cr\',13,3);">1Co 13:3</a>; <a onClick="return mV(\'Gal\',2,20);">Ga 2:20</a>, etc.); prodidomi, "to give forth or foremost" (<a onClick="return mV(\'Rom\',11,35);">Ro 11:35</a>); aponemo, "to apportion" (<a onClick="return mV(\'1Pe\',3,7);">1Pe 3:7</a>); doreomai, "to give as a gift" (<a onClick="return mV(\'Mar\',15,45);">Mr 15:45</a>, the Revised Version (British and American) "granted"; <a onClick="return mV(\'2Pe\',1,3,4);">2Pe 1:3-4</a> the King James Version); martureo, "to give testimony or witness" (<a onClick="return mV(\'1Jo\',5,10);">1Joh 5:10</a>); pareisphero, "to bring forward therewith" (<a onClick="return mV(\'2Pe\',1,5);">2Pe 1:5</a>); parecho, "to hold near by" (<a onClick="return mV(\'Col\',4,1);">Col 4:1</a>; <a onClick="return mV(\'1Ti\',6,17);">1Ti 6:17</a>); kataphero, "to bear against or down" (<a onClick="return mV(\'Act\',26,10);">Ac 26:10</a>); charizomai, "to grant as a favor" (<a onClick="return mV(\'Luk\',7,21);">Lu 7:21</a>; <a onClick="return mV(\'Act\',27,24);">Ac 27:24</a>; <a onClick="return mV(\'Rom\',8,32);">Ro 8:32</a>; <a onClick="return mV(\'Gal\',3,18);">Ga 3:18</a>; <a onClick="return mV(\'Phl\',2,9);">Php 2:9</a>; <a onClick="return mV(\'Phm\',1,22);">Phm 1:22</a> the King James Version). A few other words mostly occurring singly are translated "give."<P>Of the many changes in the Revised Version (British and American), the following are among the most important: for "Thou hast also given me the necks of mine enemies," "Thou hast also made mine enemies turn their backs unto me" (<a onClick="return mV(\'2Sa\',22,41);">2Sa 22:41</a>; <a onClick="return mV(\'Psa\',18,40);">Ps 18:40</a>); for "He that made him can make his sword to approach unto him" (<a onClick="return mV(\'Job\',40,19);">Job 40:19</a>), the American Standard Revised Version has "He only that made him giveth him his sword," the English Revised Version, margin "furnished"; for "hasten after another god" (<a onClick="return mV(\'Psa\',16,4);">Ps 16:4</a>), the American Standard Revised Version has "give gifts for" (ERVm); for "give" (<a onClick="return mV(\'Psa\',29,1,2);">Ps 29:1-2</a>, etc.), the American Standard Revised Version has "ascribe"; for "give myself unto wine" (<a onClick="return mV(\'Ecc\',2,3);">Ec 2:3</a>), "cheer my flesh with wine"; for "giveth his life" (<a onClick="return mV(\'Jhn\',10,11);">Joh 10:11</a>), "layeth down"; "given" is supplied (<a onClick="return mV(\'Act\',19,2);">Ac 19:2</a>), where we read instead of "We have not so much as heard whether there be any Holy Ghost," "We did not so much as hear whether the Holy Spirit was given," margin "there is a Holy Spirit"; for Christ shall give thee light" (<a onClick="return mV(\'Eph\',5,14);">Eph 5:14</a>), "Christ shall shine upon thee"; for "give in charge" (<a onClick="return mV(\'1Ti\',5,7);">1Ti 5:7</a>), "command"; for "not given to wine" (<a onClick="return mV(\'1Ti\',3,3);">1Ti 3:3</a>; <a onClick="return mV(\'Tts\',1,7);">Tit 1:7</a>), "no brawler," margin "not quarrelsome over wine"; for "she that liveth in pleasure" (<a onClick="return mV(\'1Ti\',5,6);">1Ti 5:6</a>), "giveth herself to"; for "All scripture is given by inspiration of God" (<a onClick="return mV(\'2Ti\',3,16);">2Ti 3:16</a>), "Every scripture inspired of God," margin "Every scripture is inspired of God"; for "given to filthy lucre" (<a onClick="return mV(\'Tts\',1,7);">Tit 1:7</a>), "greedy of"; in <a onClick="return mV(\'Hbr\',2,16);">Heb 2:16</a>, the American Standard Revised Version has "For verily not of angels doth he give help," margin "For verily not of angels doth he take hold, but he taketh hold," etc. (compare <a onClick="return mV(\'Isa\',41,9);">Isa 41:9</a>; Ecclesiasticus 4:11; 8:9 (in the Greek) the English Revised Version, "not of angels doth he take hold") (the idea is that of taking hold of to lift up or help); in Ecclesiasticus 13:15 for "giving thanks to his name," the Revised Version (British and American) reads "make confession to his name"; for "giving all diligent" (<a onClick="return mV(\'2Pe\',1,5);">2Pe 1:5</a>), "adding."<P>The prominence of "give" in the Bible reminds us that God is the great Giver (<a onClick="return mV(\'Jam\',1,5);">Jas 1:5</a>), and of the words of the Lord Jesus, "It is more blessed to give than to receive" (<a onClick="return mV(\'Act\',20,35);">Ac 20:35</a>), "Freely ye received, freely give" (<a onClick="return mV(\'Mat\',10,8);">Mt 10:8</a>).``185';
isbe[3825]='Gizonite`gi\'-zon-it: This gentilic name in <a onClick="return mV(\'1Ch\',11,34);">1Ch 11:34</a>, "Hashem the Gizonite," is probably an error for "Gunite" (compare <a onClick="return mV(\'Num\',26,48);">Nu 26:48</a>), and the passage should be corrected, after <a onClick="return mV(\'2Sa\',23,32);">2Sa 23:32</a>, into "Jashen the Gunite."``1';
isbe[3826]='Gizrites`giz\'-rits (gizri (Kethibh); the King James Version Gezrites): Inhabitants of <a href="study/isbe/search.html?string=GEZER">GEZER</A>, (which see). The Qere reads girzi, Girzites (<a onClick="return mV(\'1Sa\',27,8);">1Sa 27:8</a>).``1';
isbe[3827]='Glad Tidings`ti\'-dingz (euaggelizo): "Glad-tidings" occurs in the King James Version in the translation of the verb euaggelizo, "to tell good news" (<a onClick="return mV(\'Luk\',1,19);">Lu 1:19</a>; <a onClick="return mV(\'Luk\',8,1);">8:1</a>; <a onClick="return mV(\'Act\',13,32);">Ac 13:32</a>; <a onClick="return mV(\'Rom\',10,15);">Ro 10:15</a>); in each instance, except the last, the Revised Version (British and American) translations "good tidings." The verb is also very frequently translated in the King James Version "to preach the gospel," the original meaning of which word (god-spell) is "good news or tidings" (<a onClick="return mV(\'Mat\',11,5);">Mt 11:5</a>; <a onClick="return mV(\'Luk\',4,18);">Lu 4:18</a>; <a onClick="return mV(\'Luk\',7,22);">7:22</a>; <a onClick="return mV(\'Luk\',9,6);">9:6</a>; <a onClick="return mV(\'Luk\',20,1);">20:1</a>); in the first two passages the Revised Version (British and American) substitutes "good tidings," margin "the gospel"; in the last two instances "the gospel" is retained, the American Revised Version, margin "good tidings"—the gospel or good tidings being the announcement of the near approach of the promised, long-looked-for salvation and kingdom of God; in <a onClick="return mV(\'Rom\',1,15);">Ro 1:15</a>; <a onClick="return mV(\'Rom\',15,20);">15:20</a>; <a onClick="return mV(\'1Cr\',1,17);">1Co 1:17</a>, etc., the King James Version has "the gospel," namely, that of God\'s reconciliation of the world to Himself in Christ; the Revised Version (British and American) in some passages substitutes "good tidings," or gives this in the margin; but "glad tidings" stands only in <a onClick="return mV(\'Rom\',10,15);">Ro 10:15</a>.``185';
isbe[3828]='Glass`glas (zekhukhith; hualos):<P>1. History:<P>Glass is of great antiquity. The story of its discovery by accident, as related by Pliny (NH, xxxvi.65), is apocryphal, but it was natural for the Greeks and Romans to ascribe it to the Phoenicians, since they were the producers of the article as known to them. The Egyptian monuments have revealed to us the manufacture in a time so remote that it must have preceded that of the Phoenicians. A representation of glass-blowing on monuments of the Old Empire, as formerly supposed, is now regarded as doubtful, but undoubted examples of glazed pottery of that age exist. A fragment of blue glass has been found inscribed with the name of Antef III, of the XIth Dynasty, dating from 2000 or more BC (Davis, Ancient Egypt, 324). The oldest dated bottle, or vase, is one bearing the name of Thothmes III, 1500 or more BC, and numerous examples occur of later date. The close connection between Egypt and Syria from the time of Thothmes on must have made glass known in the latter country, and the Phoenicians, so apt in all lines of trade and manufacture, naturally seized on glass-making as a most profitable art and they became very proficient in it. The earliest glass was not very transparent, since they did not know how to free the materials used from impurities. It had a greenish or purplish tinge, and a large part of the examples we have of Phoenician glass exhibit this. But we have many examples of blue, red and yellow varieties which were purposely colored, and others quite opaque and of a whitish color, resembling porcelain (Perrot and Chipiez, Art in Ancient Phoenicia and Its Dependencies). But both they and the Egyptians made excellent transparent glass also, and decorated it with brilliant coloring on the surface (ib; Beni Hasan, Archeol. Survey of Egypt, Pt IV). Layard (Nineveh and Babylon) mentions a vase of transparent glass bearing the name of Sargon (522-505 BC), and glass was early known to the Babylonians.<P>2. Manufacture:<P>Phoenicia was the great center, and the quantities found in tombs of Syria and Palestine go to confirm the statement that this was one of the great industries of this people, to which ancient authors testify (Strabo, Geog.; Pliny, NH). Josephus refers to the sand of the Belus as that from which glass was made (BJ, II, x, 2). It seems to have been especially adapted for the purpose, but there are other places on the coast where plenty of suitable sand could be obtained. The potash required was obtained by burning certain marine and other plants, and saltpeter, or niter, was also employed. The manufacture began centuries BC on this coast, and in the 12th century AD a factory is mentioned as still being worked at Tyre, and the manufacture was later carried on at Hebron, even down to recent times (Perrot and Chipiez).<P>Both the Egyptians and Phoenicians gained such proficiency in making transparent and colored glass that they imitated precious stones with such skill as to deceive the unwary. Necklaces are found composed of a mixture of real brilliants and glass imitations. Cut glass was manufactured in Egypt as early as the XVIIIth Dynasty, and diamonds were made use of in the article. Glass composed of different colors in the same piece was made by placing layers of glass wire, of different colors, one above the other and then fusing them so that they became united in a solid mass without intermingling. Colored designs on the surface were produced by tracing the patterns, while the glass was still warm and plastic, deep enough to receive the threads of colored glass which were imbedded in them. The whole was heated again sufficiently to fuse the threads and attach them to the body. The surface was then made even by polishing. By this process vessels and ornaments of very beautiful design were produced. Many of the specimens, as found, are covered by an exquisite iridescence which is due wholly to the decomposition of the surface by chemical action, from lying buried for centuries in the soil which thus acts upon it. This is often lost in handling by the scaling off of the outer surface.<P>Glass, in the strict sense, is rarely mentioned in Scripture, but it was certainly known to the Hebrews, and occurs in <a onClick="return mV(\'Job\',28,17);">Job 28:17</a> (translated "crystal" in the King James Version). Bottles, cups and other vessels in glass must have been in use to some extent. The wine cup of <a onClick="return mV(\'Pro\',23,31);">Pr 23:31</a> and the bottle for tears mentioned in <a onClick="return mV(\'Psa\',56,8);">Ps 56:8</a> were most likely of glass. Tear bottles are found in great quantities in the tombs throughout the land and were undoubtedly connected with funeral rites, the mourners collecting their tears and placing them in these bottles to be buried with the dead. As mourners were hired for the purpose, the number of these bottles would indicate the extent to which the deceased was honored. These were, of course, small, some quite diminutive (see illustration), as also were the vials or pots to contain the ointment for the eyebrows and eyelashes, used to heighten the beauty of the women, which was probably a custom among the Hebrews as well as their neighbors. Rings, bracelets and anklets of glass are very common and were doubtless worn by the Hebrew women (see <a onClick="return mV(\'Isa\',3,18);">Isa 3:18</a>f). In the New Testament the Greek hualos occurs in <a onClick="return mV(\'Rev\',21,18,21);">Re 21:18, 21</a>, and the adjective derived from it hualinos in <a onClick="return mV(\'Rev\',4,6);">4:6</a> and <a onClick="return mV(\'Rev\',15,2);">15:2</a>. In the other passages, where in the King James Version "glass" occurs, the reference is to "looking-glass," or mirror, which was not made of glass, but of bronze, and polished so as to reflect the light similar to glass. The Hebrew word for this is gillayon (<a onClick="return mV(\'Isa\',3,23);">Isa 3:23</a>), or mar\'ah (<a onClick="return mV(\'Exd\',38,8);">Ex 38:8</a>), and the Greek esoptron (<a onClick="return mV(\'1Cr\',13,12);">1Co 13:12</a>; <a onClick="return mV(\'Jam\',1,23);">Jas 1:23</a>; compare The <span class="noTag">Wisdom of Solomon 7:26</span>; Sirach 12:11).<P>The composition of the Phoenician glass varies considerably. The analysis shows that, besides the ordinary constituents of silica, lime, lead, potash or soda, other elements are found, some being used for the purpose of coloring, such as manganese to give the purplish or violet hue, cobalt for blue, copper for red, etc. The articles illustrated above are of ordinary transparent glass with an iridescent surface, caused by decomposition, as mentioned above, indicated by the scaly appearance. Nos. 1, 4 and 5 are tear bottles, no. 4 being only 1 3/4 inches in height; nos. 2 and 3 are ointment vases which were used for the ointment with which ladies were accustomed to color their eyebrows and eyelashes to enhance their beauty. This custom still prevails in the East. The small ladle by the side of the larger vase is of bronze, used in applying the ointment. This vase is double and 6 3/4 inches high, ornamented with glass wire wound upon it while plastic. The larger vases (nos. 6 and 7) are about 6 inches in height. The hand-mirror ("looking-glass" the King James Version) is bronze, and had originally a polished surface, but is now corroded.``138';
isbe[3829]='Glass, Sea of`(thalassa hualine; <a onClick="return mV(\'Rev\',4,6);">Re 4:6</a>; <a onClick="return mV(\'Rev\',15,2);">15:2</a>): In the vision of heaven in these two apocalyptic passages a "glassy sea" is seen before the throne of God. The pure translucency of the sea is indicated in the former reference by the words, "like unto crystal"; and the fiery element that may symbolize the energy of the Divine holiness is suggested in the latter passage by the trait, "mingled with fire." On the margin of this sea—on the inner side—stood the victorious saints, with harps, singing the song of Moses and of the Lamb (<a onClick="return mV(\'Rev\',15,\'2-4\');">Re 15:2-4</a>). The imagery here points to a relation with the triumphal song in <a onClick="return mV(\'Exd\',15,\'1-\');">Ex 15</a>, after the deliverance from Pharaoh at the Red Sea. It is not easy to define the symbolism precisely. The sea, reflecting in its crystalline depths the purity and holiness of the Divine character and administration, speaks at the same time of difficulties surmounted, victory obtained and safety assured, the after-glow of the Divine judgments by which this result has been secured still illuminating the glassy expanse that has been crossed.``132';
isbe[3830]='Gleaning`glen\'-ing (laqat, \'alal): The custom of allowing the poor to follow the reapers in the field and glean the fallen spears of grain is strikingly illustrated in the story of Ruth (<a onClick="return mV(\'Rth\',2,\'2-23\');">Ru 2:2-23</a>). This custom had back of it one of the early agricultural laws of the Hebrews (<a onClick="return mV(\'Lev\',19,9);">Le 19:9</a>; <a onClick="return mV(\'Lev\',23,22);">23:22</a>; <a onClick="return mV(\'Deu\',24,\'19-21\');">De 24:19-21</a>). Breaking this law was a punishable offense. The generosity of the master of the crop determined the value of the gleanings, as the story of Ruth well illustrates (<a onClick="return mV(\'Rth\',2,16);">Ru 2:16</a>). A reaper could easily impose upon the master by leaving too much for the gleaners, who might be his own children. The old Levitical law no longer holds in the land, but the custom of allowing the poor to glean in the grain fields and vineyards is still practiced by generous landlords in Syria. The writer has seen the reapers, even when they exercised considerable care, drop from their hands frequent spears of wheat. When the reapers have been hirelings they have carelessly left bunches of wheat standing behind rocks or near the boundary walls. The owner usually sends one of his boy or girl helpers to glean these. If he is of a generous disposition, he allows some needy woman to follow after the reapers and benefit by their carelessness. It is the custom in some districts, after the main crop of grapes has been gathered, to remove the watchman and allow free access to the vineyards for gleaning the last grapes.<P>Gideon touched the local pride of the men of Ephraim when he declared that the glory of their conquest surpassed his, as the gleanings of their vineyards did the whole crop of Abiezer (<a onClick="return mV(\'Jdg\',8,2);">Jud 8:2</a>). Gleaned is used of a captured enemy in <a onClick="return mV(\'Jdg\',20,45);">Jud 20:45</a>.<P>Figurative: Israel, because of her wickedness, will be utterly destroyed, even to a thorough gleaning and destruction of those who first escape (<a onClick="return mV(\'Jer\',6,9);">Jer 6:9</a>). The same picture of complete annihilation is given in <a onClick="return mV(\'Jer\',49,9,10);">Jer 49:9-10</a>.``133';
isbe[3831]='Glede`gled (ra\'ah; gups): A member of the hawk species. It is given among the list of abominations in <a onClick="return mV(\'Deu\',14,13);">De 14:13</a>, but not in the Leviticus list (<a onClick="return mV(\'Lev\',11,14);">Le 11:14</a>). The kite is substituted. The Arabs might have called one of the buzzards the glede. In England, where specimens of most of these birds appear in migration, the glede is synonymous with kite, and was given the name from glide, to emphasize a gliding motion in flight. <!-- See illustration, p. 1235.-->``1';
isbe[3832]='Glistering`glis\'-ter-ing (pukh, "dye" (spec. "stibium"), "fair colors"; stilbonta): "\'Glistering stones\' (<a onClick="return mV(\'1Ch\',29,2);">1Ch 29:2</a>) is better<P>than the \'inlaid\' of the Revised Version (British and American); for some kind of colored, brilliant stone seems meant" (HDB, II, 182); compare <a onClick="return mV(\'Isa\',54,11);">Isa 54:11</a> Revised Version, margin. The term is employed in <a onClick="return mV(\'Mar\',9,3);">Mr 9:3</a> to denote the white, lustrous appearance of Christ\'s garments at the transfiguration. It occurs nowhere else in the New Testament. For once the Divine effulgence shone through the veil of the humiliation (compare <a onClick="return mV(\'Jhn\',1,14);">Joh 1:14</a>).``1';
isbe[3833]='Glitter; Glittering`glit\'-er, glit\'-er-ing (baraq, "lightning"): The word is used in sense of "glittering" in the Old Testament with "sword," "spear" (<a onClick="return mV(\'Deu\',32,41);">De 32:41</a>; <a onClick="return mV(\'Job\',20,25);">Job 20:25</a>; <a onClick="return mV(\'Eze\',21,10,28);">Eze 21:10, 28</a>; <a onClick="return mV(\'Nah\',3,3);">Na 3:3</a>; <a onClick="return mV(\'Hab\',3,11);">Hab 3:11</a>). In <a onClick="return mV(\'Eze\',21,10);">Eze 21:10</a> the Revised Version (British and American) changes "glitter" to "as lightning," and in <a onClick="return mV(\'Deu\',32,41);">De 32:41</a> the Revised Version, margin gives, "the lightning of my sword." In <a onClick="return mV(\'Job\',39,23);">Job 39:23</a>, where the word is different (lahabh), the Revised Version (British and American) has "flashing."``1';
isbe[3834]='Glorify`glo\'-ri-fi: The English word is the equivalent of a number of Hebrew and Greek words whose essential significance is discussed more fully under the word <a href="study/isbe/search.html?string=GLORY">GLORY</A> (which see). The word "glorious" in the phrases "make or render glorious" is used most frequently as a translation of verbs in the original, rather than of genuine adjectives In dealing with the verb it will be sufficient to indicate the following most important uses.<P>(1) Men may glorify God, that is, give to Him the worship and reverence which are His due (<a onClick="return mV(\'Isa\',24,15);">Isa 24:15</a>; <a onClick="return mV(\'Isa\',25,3);">25:3</a>; <a onClick="return mV(\'Psa\',22,23);">Ps 22:23</a>; <a onClick="return mV(\'Dan\',5,23);">Da 5:23</a>; Sirach 43:30; <a onClick="return mV(\'Mat\',5,16);">Mt 5:16</a>, and generally in the Synoptic Gospels and in some other passages of the New Testament).<P>(2) God, Yahweh (Yahweh), glorifies His people, His house, and in the New Testament, His Son, manifesting His approval of them and His interest in them, by His interposition on their behalf (<a onClick="return mV(\'Isa\',55,5);">Isa 55:5</a>; <a onClick="return mV(\'Jer\',30,19);">Jer 30:19</a>; The <span class="noTag">Wisdom of Solomon 18:8</span>; Sirach 45:3; <a onClick="return mV(\'Jhn\',7,39);">Joh 7:39</a>, and often in the Fourth Gospel).<P>(3) By a usage which is practically confined to the Old Testament, Yahweh glorifies Himself, that is, secures the recognition of His honor and majesty, by His direction of the course of history, or by His interposition in history, either the history of His own people or of the world at large (<a onClick="return mV(\'Lev\',10,3);">Le 10:3</a>; <a onClick="return mV(\'Isa\',26,15);">Isa 26:15</a>; <a onClick="return mV(\'Eze\',28,22);">Eze 28:22</a>; <a onClick="return mV(\'Hag\',1,8);">Hag 1:8</a>).``13';
isbe[3835]='Glorious`glo\'-ri-us: The adjective "glorious" is used in the majority of cases as the translation of one of the nouns which are fully discussed in the article <a href="study/isbe/search.html?string=GLORY">GLORY</A>, and the general meaning is the same, for the glorious objects or persons have the quality which is described by the word "glory," that is, they are honorable, dignified, powerful, distinguished, splendid, beautiful or radiant. It is worthy of note that in many passages in the New Testament where the King James Version has "glorious," the Revised Version (British and American) has the noun "glory." So among others in <a onClick="return mV(\'Rom\',8,21);">Ro 8:21</a>, the King James Version has "glorious liberty," the Revised Version (British and American) "liberty of the glory of the sons of God." The obsolete use of the word glorious in the sense of "boastful," "vain-glorious," "eager for glory," as it is used in Wycliffe, Tyndale and Bacon, and once or twice in Shakespeare, as in Cymbeline, I,7,in the first speech of Imogen, "Most miserable is the desire that\'s glorious," and in Gower\'s Prologue to Pericles, 1,9, "The purchase of it is to make men glorious" occurs at least once in the apocryphal books, Additions to <span class="noTag">Esther 16:4</a> the King James Version, "but also lifted up with the glorious words of lewd persons."``13';
isbe[3836]='Glory`glo\'-ri (substantive):<P><b>I. METHOD OF TREATMENT</b><P><b>II. GENERAL USE OF THE TERM</b><P class="in15">1. As Applied to External Things<P class="in15">2. As Applied to Yahweh<P><b>III. THE USES OF KABHODH</b><P class="in15">1. Material Wealth<P class="in15">2. Human Dignity and Majesty<P class="in15">3. "My Soul": the Self<P class="in15">4. Self-Manifestation of God (Yahweh)<P class="in30">(1) <span class="noTag">Exodus 23:18</span>ff<P class="in30">(2) <span class="noTag">Isaiah 6</span>><P class="in30">(3) <span class="noTag">Psalms 19:1</span><P class="in30">(4) Sinai and the Temple<P class="in30">(5) Ezekiel\'s Visions<P class="in30">(6) Messianic Ideal<P class="in30">(7) Its Ethical Content<P><b>IV. IN THE APOCRYPHA AND THE NEW TESTAMENT</b><P class="in15">1. In the Apocrypha:<P class="in30">(1) As Applied to External Things<P class="in30">(2) As Applied to God<P class="in15">2. In the New Testament:<P class="in30">(1) As Applied to Men<P class="in30">(2) As Applied to God<P class="in30">(3) As Applied to the Saints<P class="in30">(4) As Applied to the Messianic Kingdom<P class="in15">3. Its Ethical Significance<P><b>LITERATURE</b><hr /><P>I. Method of Treatment.<P>In this article we deal, first, with a group of words, translated "glory" in the English Versions of the Bible, and in which the ideas of size, rarity, beauty and adornment are prominent, the emphasis being laid in the first instance in each case upon some external physical characteristic which attracts the attention, and makes the object described by the word significant or prominent.<P>These are (\'addereth) perhaps to be connected with the Assyrian root \'adaru, meaning "wide," "great"; (hadhar, hadharah), perhaps with root-meaning of "brightness"; (hodh), with essentially the same meaning of "brightness," "light"; (Tehar), <a onClick="return mV(\'Psa\',89,44);">Ps 89:44</a>, translated "glory" in the King James Version, in the Revised Version (British and American) rendered "brightness"; (yeqara\'), an Aramaic root meaning "rare"; (tiph\'arah), with the root-meaning of "beauty "; and finally (tsebhi), perhaps on the basis of the Assyrian cabu, meaning "desire," "desirable."<P>Secondly, this article will discuss the most common and characteristic word for "glory" in the Old Testament, the Hebrew (kabhodh) including the special phrase "the glory of God" or "the glory of Yahweh." In dealing with the Old Testament usage, attention will also be called to the original Hebrew of the Book of Ecclesiasticus or Wisdom of Jesus, the Son of Sirach, cited in this article as Sir. Thirdly, with the Greek word (doxa) in the Apocrypha and in the New Testament. The nouns kauchema, kauchesis, translated "glory" or "glorying" in the New Testament, will be dealt with in the concluding paragraphs in which the use of the word glory as a verb will briefly be discussed. It will be possible within the limits of this article to give only the main outlines of the subject as illustrated by a few of the most significant references. The lexicons and the commentaries must be consulted for the details.<P>II. General Use of the Term.<P>In the first group, as has already been stated, the ideas of beauty, majesty and splendor are prominent. And these qualities are predicated first of all, of things. David determines to make the temple which Solomon is to build "a house of fame and of glory" (<a onClick="return mV(\'1Ch\',22,5);">1Ch 22:5</a>).<P>1. As Applied to External Things:<P>Then, and more commonly, glory belongs to men, and especially to men of prominence, like kings. This glory may consist in wealth, power, portion, or even in the inherent majesty and dignity of character of its possessor. The reference is most frequently, however, to the external manifestations. Physical power is suggested in <a onClick="return mV(\'Deu\',33,17);">De 33:17</a>, where "glory" of the King James Version is replaced by "majesty" in the Revised Version (British and American). The king\'s glory consists in the multitude of his people (<a onClick="return mV(\'Pro\',14,28);">Pr 14:28</a>). The glory and the pomp of the rebellious people shall descend into Sheol (<a onClick="return mV(\'Isa\',5,14);">Isa 5:14</a>). Here the reference is clearly to those external things upon which the people depend, and the possession of which is the ground of their confidence.<P>2. As Applied to Yahweh:<P>But chiefly glory is the possesion and characteristic of Yahweh, and is given by Him to His people or to anything which is connected with Him. In <a onClick="return mV(\'Isa\',60,7);">Isa 60:7</a> the Lord promises to glorify the house of His glory, and the meaning is clearly that He will impart to His house something of the beauty and majesty which belong to Him. Glory is one of the qualities which are distinctive of Yahweh (<a onClick="return mV(\'1Ch\',29,11);">1Ch 29:11</a>); and Isaiah, in one of his earliest utterances, uses the word "glory" to describe Yahweh\'s self-manifestation in judgment to bring to naught the pride and power of men (<a onClick="return mV(\'Isa\',2,10,19,21);">Isa 2:10, 19, 21</a>). The use of the word in <a onClick="return mV(\'Psa\',78,61);">Ps 78:61</a> is not quite certain. The most natural interpretation would perhaps be to refer it to the ark as the symbol of the presence of Yahweh, but in view of the parallel word "strength," it is perhaps better to interpret glory as meaning power, and to suppose that the Psalmist means that Yahweh allowed His power to be temporarily obscured, and Himself to be seemingly humiliated on account of the sin of His people.<P>III. The Uses of Kabhodh.<P>The use and significance of kabhodh in the Old Testament and in Sirach: The fundamental idea of this root seems to be "weight," "heaviness," and hence in its primary uses it conveys the idea of some external, physical manifestation of dignity, preeminence or majesty. At least three uses may be distinguished: (1) It defines the wealth or other material possesions which give honor or distinction to a person; (2) the majesty, dignity, splendor or honor of a person; (3) most important of all, it describes the form in which Yahweh (Yahweh) reveals Himself or is the sign and manifestation of His presence.<P>1. Material Wealth:<P>In <a onClick="return mV(\'Gen\',31,1);">Ge 31:1</a> (margin "wealth") it describes the flocks and herds which Jacob has acquired; in <a onClick="return mV(\'Psa\',49,16);">Ps 49:16</a>f; as the parallelism indicates, it refers to the wealth of the sinner; and in <a onClick="return mV(\'Isa\',10,3);">Isa 10:3</a> it is said that in the day of desolation the heartless plunderers of the poor shall not know where to leave their ill-gotten gain. This idea is also probably to be found in <a onClick="return mV(\'Hag\',2,7);">Hag 2:7</a>, where the parallelism seems to indicate that the glory with which Yahweh will fill the house is the treasure which He will bring into it. See also Sirach 9:11, where the glory of the sinner which is not to be envied is probably his wealth.<P>2. Human Dignity and Majesty:<P>It describes the majesty and dignity or honor of men due to their adornment or to their position. In <a onClick="return mV(\'Gen\',45,13);">Ge 45:13</a>, Joseph bids his brethren tell their father of his glory in Egypt; according to <a onClick="return mV(\'Exd\',28,40);">Ex 28:40</a>, the priestly garments are intended for the glorification of their wearers; in <a onClick="return mV(\'1Sa\',4,21);">1Sa 4:21</a>f; the loss of the ark means, for Israel, the loss of her glory, that which gave her distinction from, and preeminence over, her neighbors; in <a onClick="return mV(\'Isa\',22,23);">Isa 22:23</a> it is said that Eliakim is to be a throne of glory, i.e. the source and manifestation of the splendor and dignity of his father\'s house; in <a onClick="return mV(\'Job\',19,9);">Job 19:9</a> the complaint that God has stripped him of his glory must be taken to refer to his dignity and honor. Reference may also be made to the numerous passages in which the glory of Israel and other nations describes their dignity, majesty or distinction; so we hear of the glory of Ephraim (<a onClick="return mV(\'Hsa\',9,11);">Ho 9:11</a>), of Moab (<a onClick="return mV(\'Isa\',16,14);">Isa 16:14</a>), of Kedar (<a onClick="return mV(\'Isa\',21,16);">Isa 21:16</a>). This use is quite common in Sir. Sirach 3:10f states that the glory of man comes from the honor of his father; the possessor of wisdom shall inherit glory (4:13; 37:26); note also 4:21 with its reference to "a shame that is glory and grace," and 49:5 where the forfeited independence of Judah is described by the terms "power" and "glory."<P>3. "My Soul": the Self:<P>Closely related to this use of kabhodh to describe the majesty of men is the group of passages in which the phrase "my glory," in parallelism with nephesh, "soul," "self," or some similar expression, means the man himself in his most characteristic nature. In the blessing of Jacob (<a onClick="return mV(\'Gen\',49,6);">Ge 49:6</a>) we read, "Unto their assembly, my glory, be not thou united." Other passages are <a onClick="return mV(\'Psa\',4,2);">Ps 4:2</a>; <a onClick="return mV(\'Psa\',7,5);">7:5</a>; <a onClick="return mV(\'Psa\',16,9);">16:9</a>; <a onClick="return mV(\'Psa\',30,12);">30:12</a>; <a onClick="return mV(\'Psa\',57,8);">57:8</a>; <a onClick="return mV(\'Psa\',108,1);">108:1</a> and perhaps <a onClick="return mV(\'Job\',29,20);">Job 29:20</a>. Some recent interpreters, partly because of the Septuagint rendering in <a onClick="return mV(\'Gen\',49,6);">Ge 49:6</a> (ta hepata mou), "my liver," and partly because of the Assyrian root, kabittu, meaning "temper" or "heart" (see Delitzsch, Assyrisches Handwortebuch, 317a), would read in all these passages kabhedh, literally, "liver" as in <a onClick="return mV(\'Lam\',2,11);">La 2:11</a>, and interpret the figure as referring to the emotions as the expression of the self. The arguments in favor of the change are not without weight. Of course on either interpretation the language is highly figurative. It hardly seems necessary to change the reading, especially as the Septuagint renders the passages in the Psalms and in Job by doxa, the ordinary Greek rendering for kabhodh, and it does not seem improbable that in poetry the word kabhodh might be used to describe the man himself indicating that man as such is honorable and glorious, possibly because as in <a onClick="return mV(\'Psa\',8,1);">Ps 8:1</a>, he is thought of as having been crowned by his Creator with glory and honor.<P>Before leaving this use of kabhodh it is necessary to call attention to the fact that in a few cases it is used to describe things, perhaps because these things are thought of as practically personified. The "glory of the forest" (<a onClick="return mV(\'Isa\',10,18);">Isa 10:18</a>) is clearly a personification, referring to the majestic force of the Assyrians. We may probably assume a personification also in the case of the glory of Lebanon in <a onClick="return mV(\'Isa\',35,2);">Isa 35:2</a>; <a onClick="return mV(\'Isa\',60,13);">60:13</a>, and the nature of the parable in <a onClick="return mV(\'Eze\',31,\'1-\');">Eze 31</a> makes it probable that personification is intended in <a onClick="return mV(\'Eze\',31,18);">31:18</a>.<P>4. Self-manfiestation of God (Yahweh):<P>But unquestionably the most important use of the word kabhodh is its employment either with the following gen. God or Yahweh, or absolutely, to describe the method or the circumstances of the self-manifestation of God. In discussing this subject we shall deal first of all with the use of the term as connected with actual or historical manifestations of the Deity, and then with its use to describe the characteristic features of the ideal state of the future, or, otherwise stated, the Messianic kingdom.<P>(1) <a onClick="return mV(\'Exd\',23,18);">Exodus 23:18</a>ff.<P>The significance of the phrase in its earliest occurrence is by no means clear. Notwithstanding the uncertainty as to the exact documentary connection of the famous passage in <a onClick="return mV(\'Exd\',33,18);">Ex 33:18</a>ff, it seems quite certain that we may claim that this is the earliest historical reference that the Old Testament contains to the glory of Yahweh. "And he (Moses) said, Show me, I pray thee, thy glory. And he (Yahweh) said Thou canst not see my face;...and it shall come to pass, while my glory passeth by, that I will put thee in a cleft of the rock, and will cover thee with my hand until I have passed by: and I will take away my hand, and thou shalt see my back; but my face shall not be seen." The passage in its present form bears unmistakable evidences of the editorial hand, due perhaps, as Baentsch (Hand-kommentar zum Altes Testament, "Exodus-Leviticus-Numbers," 279) suggests, to a desire to transform the primitive, concrete, physical theophany into a revelation of the ethical glory of God, but in its basis it belongs to the Jahwist (Jahwist) and is therefore the earliest literary reference to the glory of God in the Old Testament. The glory of Yahweh is clearly a physical manifestation, a form with hands and rear parts, of which Moses is permitted to catch only a passing glimpse, but the implication is clear that he actually does see Yahweh with his physical eyes.<P>It seems not improbable that in its original form it was related that Moses saw the glory, i.e., the form of Yahweh, and thus that we are to find in this narrative the source for the statement in <a onClick="return mV(\'Num\',12,8);">Nu 12:8</a>, that he (Moses) will behold (or perhaps better rendering the tense as a frequentative), beholds the form of Yahweh (see also the description in <a onClick="return mV(\'Exd\',24,\'9-11\');">Ex 24:9-11</a>). The mention of the cloud (<a onClick="return mV(\'Exd\',34,5);">Ex 34:5</a>) as the accompaniment of the manifestation of Yahweh suggests that the form of Yahweh was thought of as being outlined in cloud and flame, and that Yahweh was originally thought of as manifesting Himself in connection with meteorological or more probably volcanic phenomena.<P>(2) <a onClick="return mV(\'Isa\',6,\'1-\');">Isaiah 6</a>.<P>Later the glory of Yahweh and the form of Yahweh are no longer identical terms, but the glory is still the physical manifestation of the Divine presence. This is clear from Isaiah\'s account of his great inaugural vision. The prophet sees the enthroned Yahweh with His skirts filling the temple. There is no indication of what it was that he saw or how he recognized that it was Yahweh. The attendant seraphim in addition to the solemn "Holy, Holy, Holy" declare that "the whole earth is full of his glory."<P>Unquestionably His glory is here regarded as something visible, something, a part of which at least, Isaiah sees. The glory as such has no ethical significance except in so far as it is the method of manifestation of one who is undoubtedly an ethical being. The phraseology suggests that the skirts which fill the temple and the glory which fills the whole earth refer to the phenomena of fire and smoke. Some think that the smoke is caused by the clouds of incense that would fill the temple in connection with the sacrificial observances. But in view of Isaiah\'s horror of these observances, this interpretation is very questionable. A more probable interpretation connects the clouds and gloom with the phenomena of a great storm, and even possibly of an earthquake, for it seems highly plausible that the call of Isaiah in the year of the death of King Uzziah coincided with the great earthquake in the days of Uzziah referred to in <a onClick="return mV(\'Zec\',14,5);">Zec 14:5</a>. (It seems at least probable that the references to the darkness and light in <a onClick="return mV(\'Zec\',14,6);">Zec 14:6</a>f may have their origin in the phenomena attendant upon this earthquake. It is probable that the earthquake by which the prophecy of Amos is dated (<a onClick="return mV(\'Amo\',1,1);">Am 1:1</a>) is also this same historic earthquake.) The clouds and fire attendant upon this storm or earthquake become the media by which the glory of Yahweh is made known to the youthful prophet, and this glory partly reveals and partly conceals the presence of Yahweh of which, through, and in part by means of, these phenomena, Isaiah is made so vividly conscious.<P>(3) <a onClick="return mV(\'Psa\',19,1);">Psalms 19:1</a>.<P>This conception of Isaiah that the glory of Yahweh fills the earth is closely related to the thought of <a onClick="return mV(\'Psa\',19,1);">Ps 19:1</a> that "the heavens declare the glory of God; and the firmament showeth his handiwork," the difference being that in the psalm Yahweh\'s glory is manifested in the ordinary rather than in the extraordinary phenomena. Parallel thoughts may be found in <a onClick="return mV(\'Psa\',8,1);">Ps 8:1</a>; <a onClick="return mV(\'Psa\',57,5);">57:5</a>; <a onClick="return mV(\'Psa\',108,5);">108:5</a>; <a onClick="return mV(\'Psa\',113,4);">113:4</a>. In <a onClick="return mV(\'Psa\',29,1,2,3,9);">Ps 29:1-3, 9</a>, as in Isaiah, the glory of Yahweh is revealed in the extraordinary physical phenomena which the psalm describes. Glory here is a purely external, meteorological thing and is the manifestation of the presence of Yahweh, no matter whether the psalm is regarded, as it usually is, as a description of a thunderstorm, or whether with von Gall and others it is taken as a description of the phenomena which accompany the inauguration of the Messianic kingdom (see <a onClick="return mV(\'Joe\',2,30);">Joe 2:30</a>f the English Revised Version).<P>(4) Sinai and the Temple.<P><a onClick="return mV(\'Deu\',5,24);">De 5:24</a> indicates that in theophany at the time of the giving of the law, the glory and the greatness of Yahweh. consisted in the fire and thick darkness which enveloped the mountain, and out of which Yahweh spoke to the people. Essentially the same idea is expressed in the account of the dedication of Solomon\'s temple (<a onClick="return mV(\'1Ki\',8,10);">1Ki 8:10</a>f; <a onClick="return mV(\'2Ch\',5,14);">2Ch 5:14</a>). The cloud which filled the house of Yahweh, preventing the priests from ministering, is identified with the glory of Yahweh which filled the house. It is noteworthy that in <a onClick="return mV(\'2Ch\',7,\'1-3\');">2Ch 7:1-3</a> the glory of Yahweh which fills the house manifests itself in the form of the cloud of smoke from the sacrifices which were consumed by the fire coming down from heaven.<P>(5) Ezekiel\'s Visions.<P>Perhaps the most elaborate description of the glory of Yahweh to be found in the Old Testament is that given by Ezekiel in the various accounts of his visions. It is not easy to interpret his conception, but it seems clear that he does not identify the glory with the stormy clouds, the fire, the cherubim and the chariots. "The appearance of the likeness of the glory of Yahweh" (<a onClick="return mV(\'Eze\',1,28);">Eze 1:28</a>) is not applied to all the phenomena which have been described in the preceding verses, but only to the likeness of form which looked like a man above the sapphire throne ((<a onClick="return mV(\'Eze\',1,26);">1:26</a>). The same idea is indicated in (<a onClick="return mV(\'Eze\',9,3);">9:3</a> which states that "the glory of the God of Israel was gone up from the cherub, whereupon it was"; that is, the glory is something peculiar to Yahweh, and is not quite identical with the phenomena which accompany it. This is true of all his visions. The glory of Yahweh manifests itself with all the accompaniments which he describes with such richness of imagery, but the accompaniments are not the glory. For other descriptions of the glory of Yahweh in Ezekiel, see <a onClick="return mV(\'Eze\',3,12,23);">3:12, 23</A>; <a onClick="return mV(\'Eze\',8,4);">8:4</a>; <a onClick="return mV(\'Eze\',10,4,18);">10:4,18</a>ff; <a onClick="return mV(\'Eze\',11,22);">11:22</a> f.<P>Very similar to this conception of Ezekiel is that given in those passages of the Pentateuch which are usually assigned to the Priestly Code. When the children of Israel murmured against Moses and Aaron on account of the lack of food, the glory of Yahweh appeared in the cloud as they "looked toward the wilderness" (<a onClick="return mV(\'Exd\',16,7,10);">Ex 16:7, 10</a>; compare <a onClick="return mV(\'Exd\',24,16);">Ex 24:16</a>). And just as in Ezekiel, the glory is distinguished from its attendant circumstances; for after the completion of the Tent of Meeting, the cloud covers the tent, and the glory of Yahweh fills the tabernacle (<a onClick="return mV(\'Exd\',40,34);">Ex 40:34</a>f; see also <a onClick="return mV(\'Lev\',9,6,23);">Le 9:6, 23</a>; <a onClick="return mV(\'Num\',14,21);">Nu 14:21</a>; <a onClick="return mV(\'Num\',16,19,42);">16:19, 42</a>; <a onClick="return mV(\'Num\',20,6);">20:6</a>). The same thought is suggested in the references in Sirach 17:13; 45:3.<P>(6) Messianic Ideal.<P>These passages just cited stand on the border between the historical and the ideal descriptions of the glory of Yahweh, for whatever may be one\'s views as to the historical worth of P\'s account of the Exodus and the wilderness sojourn, all must agree in seeing in it really the program or constitution for the ideal state of the future. And in this state the distinguishing characteristic is to be the manifest presence of Yahweh in His sanctuary, and this manifestation is the glory. This is the view of Ezekiel, for whom the essential action in the establishment of the new community is the return of the glory of Yahweh to the house of Yahweh (<a onClick="return mV(\'Eze\',43,2,4,5);">Eze 43:2, 4-5</a>; <a onClick="return mV(\'Eze\',44,4);">44:4</a>). The same thought is expressed very clearly in <a onClick="return mV(\'Isa\',4,5);">Isa 4:5</a>f; which may be rendered on the basis of a slight rearrangement and regrouping of the original, \'And Yahweh will create over...Mt. Zion..., a cloud and smoke by day, and the shining of a flaming fire by night; for over everything the glory (of Yahweh) shall be a canopy and a pavilion, and it shall serve as a shelter from the heat, and a refuge and a covert from the storm and the rain.\' This translation has the advantage that it furnishes an intelligible and characteristic conclusion to the description of the Messianic age which the chapter contains. <a onClick="return mV(\'Isa\',11,10);">Isa 11:10</a>, reading with the Revised Version, margin, "and his resting-place shall be glory," has the same thought, for it is clearly the glory of Yahweh that is manifested in the resting-place of the root of Jesse, and this resting-place can be none other than Mt. Zion (compare also <a onClick="return mV(\'Isa\',24,23);">Isa 24:23</a>).<P>The Psalms and Deuteronomy-Isaiah have many passages in which this phase of the thought is brought out. For both books the restoration of the people from captivity is to be accompanied by, or, perhaps better, itself is, a revelation of the glory of Yahweh (<a onClick="return mV(\'Isa\',40,5);">Isa 40:5</a>). The children of Israel have been created for the glory of Yahweh, and hence they must be restored that His glory may be made manifest (<a onClick="return mV(\'Isa\',43,7);">Isa 43:7</a>). The light of the restored community is to be the glory of Yahweh (<a onClick="return mV(\'Isa\',60,1);">Isa 60:1</a>f). The presence of Yahweh brings grace and glory (<a onClick="return mV(\'Psa\',84,11);">Ps 84:11</a>), and His salvation of those that fear Him causes glory to dwell in the land (<a onClick="return mV(\'Psa\',85,9);">Ps 85:9</a>). To these and many similar passages in Isaiah and the Psalms may also be added Sirach 36:14, which refers probably to the manifestation of God in glory in the Messianic kingdom.<P>(7) Its Ethical Content.<P>But these passages make it quite evident that "glory" is not always used in the external, literally or figuratively physical sense. It comes to have an ethical significance, and this because, like the holiness with which it is associated in <a onClick="return mV(\'Isa\',6,\'-\'1);">Isa 6</a>, it is connected with Yahweh, who is more and more exclusively viewed as an ethical being. As holiness gradually loses its physical sense of aloofness, apartness, and comes to describe moral purity, so glory, because it is an attribute or expression of Yahweh, comes to have a moral sense. This transformation, as we have seen, is already being made in the present text of <a onClick="return mV(\'Exd\',33,18,20);">Ex 33:18, 20</a>, and the connection with holiness in <a onClick="return mV(\'Isa\',6,\'1-\');">Isa 6</a> makes it almost certain that Isaiah gave the word an ethical connotation. So the God of glory of <a onClick="return mV(\'Psa\',29,3);">Ps 29:3</a> suggests a moral quality because Yahweh is a moral being. All doubt on this matter disappears when we find the word "glory" used as the term for the essential nature of Yahweh, as we have already found it to be used of man. In <a onClick="return mV(\'Isa\',42,8);">Isa 42:8</a>, "I am Yahweh, that is my name; and my glory will I not give to another," the meaning would seem to be, my essential character and power, that is, my glory, I will not share with other gods (compare also <a onClick="return mV(\'Isa\',48,11);">Isa 48:11</a>). And in <a onClick="return mV(\'Isa\',58,8);">Isa 58:8</a> the glory must be taken in a figurative sense and refer to Yahweh Himself in His saving grace, who attends His people in advance and in the rear. It hardly seems possible to deny the ethical sense in <a onClick="return mV(\'Eze\',39,21);">Eze 39:21</a>, where the manifestation of the glory of Yahweh comes as a result of the execution of His purposes of justice and righteousness upon His people. And in <a onClick="return mV(\'Hab\',2,14);">Hab 2:14</a>, the glory of Yahweh which is to be known throughout the earth cannot be limited to any phys
