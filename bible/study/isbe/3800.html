passage quoted above from <a onClick="return mV(\'Gal\',5,22);">Ga 5:22</a>, "goodness" is one of the fruits of the indwelling Spirit of God, and in that from <a onClick="return mV(\'Eph\',5,9);">Eph 5:9</a> it is described as being, along with righteousness and truth, "the fruit of the light" which Christians had been "made" in Christ. Here, as elsewhere, we are reminded that the Christian life in its truth is likeness to God, the source and perfection of all good. <a onClick="return mV(\'2Th\',1,11);">2Th 1:11</a> regards God Himself as expressing His goodness in and through us.`<a href="./study/isbe/search.html?string=GOOD">GOOD</a>; <a href="./study/isbe/search.html?string=GOOD,+CHIEF">GOOD, CHIEF</a>`185';
isbe[3888]='Goods`goodz (rekhush, Tubh; ta huparchonta): In the Old Testament rekhush ("substance") is most frequently translated "goods," as in <a onClick="return mV(\'Gen\',14,11,12,16,21);">Ge 14:11-12, 16, 21</a>, etc.; Tubh is also 3 times so translated in the King James Version (<a onClick="return mV(\'Gen\',24,10);">Ge 24:10</a>, the Revised Version (British and American) "goodly things," margin "all the goods"; <a onClick="return mV(\'Neh\',9,25);">Ne 9:25</a>, the Revised Version (British and American) "good things"; <a onClick="return mV(\'Job\',20,21);">Job 20:21</a>, the Revised Version (British and American) "prosperity"). Other words, are \'on (<a onClick="return mV(\'Job\',20,10);">Job 20:10</a>, the Revised Version (British and American) "wealth"); Chayil ("force," <a onClick="return mV(\'Num\',31,9);">Nu 31:9</a>; <a onClick="return mV(\'Zep\',1,13);">Ze 1:13</a>, the Revised Version (British and American) "wealth"); Tobh (<a onClick="return mV(\'Deu\',28,11);">De 28:11</a>, the Revised Version (British and American) "for good"; <a onClick="return mV(\'Ecc\',5,11);">Ec 5:11</a>); mela\'khah ("work," <a onClick="return mV(\'Exd\',22,8,11);">Ex 22:8, 11</a>); nikhcin (Aramaic "riches," <a onClick="return mV(\'Ezr\',6,8);">Ezr 6:8</a>; <a onClick="return mV(\'Ezr\',7,26);">7:26</a>); Qinyan, "getting" (<a onClick="return mV(\'Eze\',38,12);">Eze 38:12</a>f). We have ta huparchonta (literally, "the things existing") in <a onClick="return mV(\'Mat\',24,47);">Mt 24:47</a>, "ruler over all his goods," the Revised Version (British and American) "all that he hath," etc. Agathos is translated "goods" in <a onClick="return mV(\'Luk\',12,18);">Lu 12:18</a>f; skeuos ("instrument") in <a onClick="return mV(\'Mat\',12,29);">Mt 12:29</a>; <a onClick="return mV(\'Mar\',3,27);">Mr 3:27</a>; ta sa ("the things belonging to thee") in <a onClick="return mV(\'Luk\',6,30);">Lu 6:30</a>; ousia ("substance") in <a onClick="return mV(\'Luk\',15,12);">Lu 15:12</a>, the Revised Version (British and American) "substance"; huparxis ("existence," "substance") in <a onClick="return mV(\'Act\',2,45);">Ac 2:45</a>; plouteo ("to be rich") in <a onClick="return mV(\'Rev\',3,17);">Re 3:17</a>, the Revised Version (British and American) "have gotten riches." In the Revised Version (British and American) "goods" stands instead of "carriage" (<a onClick="return mV(\'Jdg\',18,21);">Jud 18:21</a>), of "stuff" (<a onClick="return mV(\'Luk\',17,31);">Lu 17:31</a>), of "good" (<a onClick="return mV(\'1Jo\',3,17);">1Joh 3:17</a>). "Goods" was used in the sense of "possessions" generally; frequently in this sense in Apocrypha (1Esdras 6:32); ta huparchonta (Tobit 1:20); Ecclesiasticus 5:1, "Set not thy heart upon thy goods" (chrema), etc.``185';
isbe[3889]='Gopher Wood`go\'-fer wood (\'atse ghopher): The wood from which Noah\'s ark was made (<a onClick="return mV(\'Gen\',6,14);">Ge 6:14</a>). Gopher is a word unknown elsewhere in Hebrew or allied languages. Lagarde considered that it was connected with gophrith, meaning "brimstone," or "pitch," while others connect it with kopher, also meaning "pitch"; hence, along both lines, we reach the probability of some resinous wood, and pine, cedar, and cypress have all had their supporters. A more probable explanation is that which connects gopher with the modern Arabic kufa, a name given to the boats made of interwoven willow branches and palm leaves with a coating of bitumen outside, used today on the rivers and canals of Mesopotamia. In the Gilgamesh story of the flood it is specially mentioned that Noah daubed his ark both inside and out with a kind of bitumen.`<a href="./study/isbe/search.html?string=DELUGE+OF+NOAH">DELUGE OF NOAH</a>`117';
isbe[3890]='Gore`gor (naghach): "Gore" occurs only three times in the King James Version, namely, <a onClick="return mV(\'Exd\',21,28,31);">Ex 21:28, 31</a> bis, "if an ox gore a man or a woman," etc.; in <a onClick="return mV(\'Exd\',21,29,32,36);">21:29,32,36</a>, the King James Version has "push" (with his horn), the Revised Version (British and American) "gore." The same verb in Piel and HithpaeI is elsewhere translated "push" and "pushing" (<a onClick="return mV(\'Deu\',33,17);">De 33:17</a>, "He shall push the peoples," the Revised Version, margin "gore"; <a onClick="return mV(\'1Ki\',22,11);">1Ki 22:11</a>; <a onClick="return mV(\'Psa\',44,5);">Ps 44:5</a>; <a onClick="return mV(\'Eze\',34,21);">Eze 34:21</a>; <a onClick="return mV(\'Dan\',8,4);">Da 8:4</a>; <a onClick="return mV(\'Dan\',11,40);">11:40</a>, the Revised Version (British and American) "contend," margin "Hebrew push at," as an ox pushes with his horns so should the king fight—a fitting description of warfare).``1';
isbe[3891]='Gorgeous; Gorgeously`gor\'-jus, gor\'-jus-li (mikhlol; lampros): Mikhlol occurs twice in the Old Testament, translated in the King James Version and the Revised Version (British and American) "most gorgeously" (<a onClick="return mV(\'Eze\',23,12);">Eze 23:12</a>); in <a onClick="return mV(\'Eze\',38,4);">Eze 38:4</a>, the King James Version translates "all sorts" (of armor), the Revised Version (British and American) "clothed in full armor." Lampros ("shining," "bright"), is only once translated "gorgeous" (<a onClick="return mV(\'Luk\',23,11);">Lu 23:11</a>); "Herod...arrayed him in a gorgeous robe," the Revised Version (British and American) "gorgeous apparel." We have also in <a onClick="return mV(\'Luk\',7,25);">Lu 7:25</a>, "They that are gorgeously appareled (endoxos, "splendid," "glorious")...are in kings\' courts." They were scarcely to be looked for among the prophets, or in the new community of Jesus.``185';
isbe[3892]='Gorget`gor\'-jet: Appears only once in the King James Version (<a onClick="return mV(\'1Sa\',17,6);">1Sa 17:6</a>), being placed in the margin as an alternative to "target (of brass)" in the description of the armor worn by Goliath of Gath. The Hebrew word thus translated (kidhon) really means a "javelin," and is so rendered in the Revised Version (British and American) and the American Standard Revised Version here and in <a onClick="return mV(\'1Sa\',17,45);">1Sa 17:45</a> ("Thou comest to me with a sword, and with a spear, and with a javelin"). See <a href="study/isbe/search.html?string=ARMOR;+ARMOR">ARMOR</a>, sec. I,4,(3). Gorget, though so rarely used in Scripture and now displaced in our revised versions, occurs not infrequently and in various senses in English literature. In the meaning of "a piece of armor for the gorge or throat" which seems to have been in the mind of King James\'s translators, it is found in early English writers and down to recent times.<p>Spenser has it in Faerie Queene, IV, iii, 12:<P class="in15">"His weasand-pipe it through his gorget cleft";<P>Scott, Marmion, V, ii:<P class="in15">"Their brigantines and gorgets light";<P>and Prescott, Ferdinand and Isabella, III, 47: <P class="in15">"The gorget gave way and the sword entered his throat."``128';
isbe[3893]='Gorgias`gor\'-ji-as (Gorgias): A general in the service of Antiochus Epiphanes (1Macc 3:38; 2Macc 8:9). Lysias, who had been left as regent during the absence of Antiochus in Persia, appointed Gorgias to take the command against Judea in 166 BC. In 1Macc 4:1-24 is recorded a night attack by Gorgias with 5,000 foot and 1,000 horse upon the camp of Judas Maccabeus in the neighborhood of Emmaus, in which Judas was completely victorious. The victory was all the more striking as the force of Judas was considerably smaller in number and had "not armor nor swords to their minds" (1Macc 4:6). Later on (164 BC) he held a garrison in Jamnia, and gained a victory over the forces of Joseph and Azarias who, envying the glory of Judas and Jonathan, in direct disobedience to the orders of Judas, attacked Gorgias and were defeated.<P>Jamnia as given in Josephus, Ant, XII, viii,6,is probably the correct reading for Idumaea in 2Macc 12:32. The doings of Gorgias in 2Macc are recorded with some confusion. He was regarded with special hostility by the Jews. In 2Macc 12:35 he is described as "the accursed man."``79';
isbe[3894]='Gortyna`gor-ti\'-na (Gortunai): A city in Crete, next in importance to Gnossus. It is mentioned in 1Macc 15:23.`<a href="./study/isbe/search.html?string=CRETE">CRETE</a>`1';
isbe[3895]='Goshen (1)`go\'-shen (goshen; Gesem):<P>1. Meaning of Name:<P>The region where the Hebrews dwelt in Egypt. If the Septuagint reading Gesem be correct, the word, which in its Hebrew form has no known meaning, may mean "cultivated"—comparing the Arabic root jashima, "to labor." Egyptologists have suggested a connection with the Egyptian word qas, meaning "inundated land" because Goshen was apparently the same region, called by the Greeks the "Arabian nome," which had its capital at Phakousa representing the Egyptian Pa-qas (Brugsch, Geog., I, 298), the name of a town, with the determinative for "pouring forth." Van der Hardt, indeed, more than a century ago (see Sayce, Higher Criticism, 235), supposed the two words to be connected. Dr. Naville in 1887 found the word as denoting the vicinity of Pi-sopt (now Saft el Henneh), 6 miles east of Zagazig—in the form Q-s-m. He concludes that this was the site of Phakousa, but the latter is usually placed at Tell el Faqus, about 15 miles south of <a href="study/isbe/search.html?string=ZOAN">ZOAN</a> (which see), and this appears to be the situation of the "City of Arabia" which Silvia, about 385 AD, identifies with Gesse or Goshen; for she reached it in her journey from Heroopolis, through Goshen to Tathnis or Taphnis (Daphnai), and to Pelusium.<P>2. Situation:<P>It is generally agreed that Goshen was the region east of the Bubastic branch of the Nile; and in <a onClick="return mV(\'Psa\',78,12,43);">Ps 78:12, 43</a>, it seems to be clearly identified with the "field (or pastoral plain) of Zoan," which was probably also the "land of Rameses" mentioned (<a onClick="return mV(\'Gen\',47,11);">Ge 47:11</a>) as possessed by Jacob\'s family (see <a href="study/isbe/search.html?string=RAAMSES">RAAMSES</a>; <a href="study/isbe/search.html?string=ZOAN">ZOAN</a>). Where first mentioned (<a onClick="return mV(\'Gen\',45,10);">Ge 45:10</a>), Goshen is promised by Joseph to Jacob as a land fit for flocks, and the Septuagint here reads, "Gesem of Arabia," probably referring to the Arabian nome which took its name from the "desert" which defended the east border of Egypt. In the second notice (<a onClick="return mV(\'Gen\',46,28);">Ge 46:28</a>f), the boundary of the land of Goshen, where Joseph met his father, is called in the Septuagint Heroo(n)-polis, and also (<a onClick="return mV(\'Gen\',46,28);">Ge 46:28</a>) "the land of Ramesse(s)"; so that in the 3rd century BC Goshen seems to have been identified with the whole region of the Arabian nome, as far south as Heroopolis which (see <a href="study/isbe/search.html?string=PITHOM">PITHOM</a>) lay in Wady Tumeilat. Goshen included pastoral lands (<a onClick="return mV(\'Gen\',46,34);">Ge 46:34</a>; <a onClick="return mV(\'Gen\',47,1,4,6,27);">47:1, 4, 6, 27</a>; <a onClick="return mV(\'Gen\',50,8);">50:8</a>) and was still inhabited by the Hebrews at the time of the Exodus (<a onClick="return mV(\'Exd\',8,22);">Ex 8:22</a>; <a onClick="return mV(\'Exd\',9,26);">9:26</a>), after which it is unnoticed in the Old Testament. The name, however, applied to other places which were probably "cultivated" lands, including a region in the south of Palestine (<a onClick="return mV(\'Jos\',10,41);">Jos 10:41</a>; <a onClick="return mV(\'Jos\',11,16);">11:16</a>), "all the country of Goshen Septuagint Gosom), even unto Gibeon," and a city of Judah (<a onClick="return mV(\'Jos\',15,51);">Jos 15:51</a>) in the mountains near Beersheba. These notices seem to show that the word is not of Egyptian origin.<P>3. Description:<P>The region thus very clearly indicated was not of any great extent, having an area of only about 900 square miles, including two very different districts. The western half, immediately east of the Bubastic branch of the Nile, stretches from Zoan to Bubastis (at both of which cities records of the Hyksos ruler Apepi have been found), or a distance of about 35 miles north and south. This region is an irrigated plain which is still considered to include some of the best land in Egypt. The description of the land of Rameses (see <a href="study/isbe/search.html?string=RAAMSES">RAAMSES</a>), in the 14th century BC, shows its fertility; and Silvia says that the land of Goshen was 16 miles from Heroopolis, and that she traveled for two days in it "through vineyards, and balsam plantations, and orchards, and tilled fields, and gardens." The region narrows from about 15 miles near the seashore to about 10 miles between Zagazig and Tell el Kebir on the southeast of this, a sandy and gravelly desert lies between the Nile plain and the Suez Canal, broadening southward from near Daphnai (Tell Defeneh) to Wady Tumeilat, where it <span class="noTag">is</span> 40 miles across east and west. South of this valley an equally waterless desert stretches to Suez, and from the Bitter Lakes on the east to the vicinity of Heliopolis (southeast of Cairo) on the west. Thus, Wady Tumeilat, which is fertilized by the Nile waters (see <a href="study/isbe/search.html?string=PI-HAHIROTH">PI-HAHIROTH</a>), and contains villages and corn fields, is the only natural route for a people driving with their flocks and herds by which the vicinity of the Red Sea can be reached, the road leading from the south end of the "field of Zoan" near Bubastis, and 40 miles eastward to the "edge of the wilderness" (see <a href="study/isbe/search.html?string=ETHAM">ETHAM</a>) and the head of the Bitter Lakes. This physical conformation is important in relation to the route of the Israelites (see <a href="study/isbe/search.html?string=EXODUS">EXODUS</a>); and Wady Tumeilat may very possibly be intended to be included in Goshen, as the Septuagint translators supposed.``28';
isbe[3896]='Goshen (2)`go\'-shen (goshen):<P>(1) Mentioned as a country (\'erets) in the south of Judah distinct from the "hill country," the Negeb and the Shephelah (<a onClick="return mV(\'Jos\',10,41);">Jos 10:41</a>; <a onClick="return mV(\'Jos\',11,16);">11:16</a>). Unidentified.<P>(2) A town in the southwest part of the hill country of Judah (<a onClick="return mV(\'Jos\',15,51);">Jos 15:51</a>), very probably connected in some way with the district (1).`<a href="./study/isbe/search.html?string=GOSHEN+1">GOSHEN 1</a>`1';
isbe[3897]='Gospel`gos\'-pel (to euaggelion): The word gospel is derived from the Anglo-Saxon word which meant "the story concerning God." In the New Testament the Greek word euaggelion, means "good news." It proclaims tidings of deliverance. The word sometimes stands for the record of the life of our Lord (<a onClick="return mV(\'Mar\',1,1);">Mr 1:1</a>), embracing all His teachings, as in <a onClick="return mV(\'Act\',20,24);">Ac 20:24</a>. But the word "gospel" now has a peculiar use, and describes primarily the message which Christianity announces. "Good news" is its significance. It means a gift from God. It is the proclamation of the forgiveness of sins and sonship with God restored through Christ. It means remission of sins and reconciliation with God. The gospel is not only a message of salvation, but also the instrument through which the Holy Spirit works (<a onClick="return mV(\'Rom\',1,16);">Ro 1:16</a>).<P>The gospel differs from the law in being known entirely from revelation. It is proclaimed in all its fullness in the revelation given in the New Testament. It is also found, although obscurely, in the Old Testament. It begins with the prophecy concerning the \'seed of the woman\' (<a onClick="return mV(\'Gen\',3,15);">Ge 3:15</a>), and the promise concerning Abraham, in whom all the nations should be blessed (<a onClick="return mV(\'Gen\',12,3);">Ge 12:3</a>; <a onClick="return mV(\'Gen\',15,5);">15:5</a>) and is also indicated in <a onClick="return mV(\'Act\',10,43);">Ac 10:43</a> and in the argument in <a onClick="return mV(\'Rom\',4,\'1-\');">Ro 4</a>.<P>In the New Testament the gospel never means simply a book, but rather the message which Christ and His apostles announced. In some places it is called "the gospel of God," as, for example, <a onClick="return mV(\'Rom\',1,1);">Ro 1:1</a>; <a onClick="return mV(\'1Th\',2,2,9);">1Th 2:2, 9</a>; <a onClick="return mV(\'1Ti\',1,11);">1Ti 1:11</a>. In others it is called "the gospel of Christ" (<a onClick="return mV(\'Mar\',1,1);">Mr 1:1</a>; <a onClick="return mV(\'Rom\',1,16);">Ro 1:16</a>; <a onClick="return mV(\'Rom\',15,19);">15:19</a>; <a onClick="return mV(\'1Cr\',9,12,18);">1Co 9:12, 18</a>; <a onClick="return mV(\'Gal\',1,7);">Ga 1:7</a>). In another it is called "the gospel of the grace of God" (<a onClick="return mV(\'Act\',20,24);">Ac 20:24</a>); in another "the gospel of peace" (<a onClick="return mV(\'Eph\',6,15);">Eph 6:15</a>); in another "the gospel of your salvation" (<a onClick="return mV(\'Eph\',1,13);">Eph 1:13</a>); and in yet another "the glorious gospel" (<a onClick="return mV(\'2Cr\',4,4);">2Co 4:4</a> the King James Version). The gospel is Christ: He is the subject of it, the object of it, and the life of it. It was preached by Him (<a onClick="return mV(\'Mat\',4,23);">Mt 4:23</a>; <a onClick="return mV(\'Mat\',11,5);">11:5</a>; <a onClick="return mV(\'Mar\',1,14);">Mr 1:14</a>; <a onClick="return mV(\'Luk\',4,18);">Lu 4:18</a> margin), by the apostles (<a onClick="return mV(\'Act\',16,10);">Ac 16:10</a>; <a onClick="return mV(\'Rom\',1,15);">Ro 1:15</a>; <a onClick="return mV(\'Rom\',2,16);">2:16</a>; <a onClick="return mV(\'1Cr\',9,16);">1Co 9:16</a>) and by the evangelists (<a onClick="return mV(\'Act\',8,25);">Ac 8:25</a>).<P>We must note the clear antithesis between the law and the gospel. The distinction between the two is important because, as Luther indicates, it contains the substance of all Christian doctrine. "By the law," says he, "nothing else is meant than God\'s word and command, directing what to do and what to leave undone, and requiring of us obedience of works. But the gospel is such doctrine of the word of God that neither requires our works nor commands us to do anything, but announces the offered grace of the forgiveness of sin and eternal salvation. Here we do nothing, but only receive what is offered through the word." The gospel, then, is the message of God, the teaching of Christianity, the redemption in and by Jesus Christ, the only begotten Son of God, offered to all mankind. And as the gospel is bound up in the life of Christ, His biography and the record of His works, and the proclamation of what He has to offer, are all gathered into this single word, of which no better definition can be given than that of Melanchthon: "The gospel is the gratuitous promise of the remission of sins for Christ\'s sake." To hold tenaciously that in this gospel we have a supernatural revelation is in perfect consistency with the spirit of scientific inquiry. The gospel, as the whole message and doctrine of salvation, and as chiefly efficacious for contrition, faith, justification, renewal and sanctification, deals with facts of revelation and experience.``9';
