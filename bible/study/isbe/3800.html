"return mV(\'2Cr\',6,14);">2Co 6:14</a>). It is coupled with goodness and truth as the fruit of the light (<a onClick="return mV(\'Eph\',5,9);">Eph 5:9</a>; compare <a onClick="return mV(\'1Ti\',6,11);">1Ti 6:11</a>; <a onClick="return mV(\'2Ti\',2,22);">2Ti 2:22</a>). It implies a rule or standard of conduct, which in effect is one with the life of love and holiness. It is brought home to men by the conviction of the Holy Spirit (<a onClick="return mV(\'Jhn\',16,8);">Joh 16:8</a>). In its origin it is the righteousness of God (<a onClick="return mV(\'Mat\',6,33);">Mt 6:33</a>; compare <a onClick="return mV(\'Jhn\',17,25);">Joh 17:25</a>). In Paul\'s theology, "the righteousness of God through faith in Jesus Christ unto all them that believe" (<a onClick="return mV(\'Rom\',3,22);">Ro 3:22</a>) is the act of God, out of free grace, declaring and treating the sinner as righteous, that he thereby may become righteous, even as "we love, because he first loved us" (<a onClick="return mV(\'1Jo\',4,19);">1Joh 4:19</a>). The whole character of God, then, whether we call it love, holiness or righteousness, is revealed in His work of salvation, wherein He goes forth to men in love and mercy, that they may be made citizens of His kingdom, heirs of His righteousness, and participators in His love.<P>7. Metaphysical Attributes:<P>The abstract being of God and His metaphysical attributes are implied, but not defined, in the New Testament. His infinity, omnipotence and omniscience are not enunciated in terms, but they are postulated in the whole scheme of salvation which He is carrying to completion. He is Lord of heaven and earth (<a onClick="return mV(\'Mat\',11,25);">Mt 11:25</a>). The forces of Nature are at His command (<a onClick="return mV(\'Mat\',5,45);">Mt 5:45</a>; <a onClick="return mV(\'Mat\',6,30);">6:30</a>). He can answer every prayer and satisfy every need (<a onClick="return mV(\'Mat\',7,\'7-12\');">Mt 7:7-12</a>). All things are possible to Him (<a onClick="return mV(\'Mar\',10,27);">Mr 10:27</a>; <a onClick="return mV(\'Mar\',14,36);">14:36</a>). He created all things (<a onClick="return mV(\'Eph\',3,9);">Eph 3:9</a>). All earthly powers are derived from Him (<a onClick="return mV(\'Rom\',13,1);">Ro 13:1</a>). By His power, He raised Christ from the dead and subjected to Him "all rule, and authority, and power, and dominion" in heaven and on earth (<a onClick="return mV(\'Eph\',1,20,21);">Eph 1:20-21</a>; compare <a onClick="return mV(\'Mat\',28,18);">Mt 28:18</a>). Every power and condition of existence are subordinated to the might of His love unto His saints (<a onClick="return mV(\'Rom\',8,38,39);">Ro 8:38-39</a>). Neither time nor place can limit Him: He is the eternal God (<a onClick="return mV(\'Rom\',16,26);">Ro 16:26</a>). His knowledge is as infinite as His power; He knows what the Son and the angels know not (<a onClick="return mV(\'Mar\',13,32);">Mr 13:32</a>). He knows the hearts of men (<a onClick="return mV(\'Luk\',16,15);">Lu 16:15</a>) and all their needs (<a onClick="return mV(\'Mat\',6,8,32);">Mt 6:8, 32</a>). His knowledge is especially manifested in His wisdom by which He works out His purpose of salvation, "the manifold wisdom of God, according to the eternal purpose which he purposed in Christ Jesus our Lord" (<a onClick="return mV(\'Eph\',3,10,11);">Eph 3:10-11</a>). The teaching of the New Testament implies that all perfections of power, condition and being cohere in God, and are revealed in His love. They are not developed or established on metaphysical grounds, but they flow out of His perfect fatherhood. Earthly fathers do what good they can for their children, but the Heavenly Father does all things for the best for His children—"to them that love God all things work together for good"—because He is restricted by no limits of power, will or wisdom (<a onClick="return mV(\'Mat\',7,11);">Mt 7:11</a>; <a onClick="return mV(\'Rom\',8,28);">Ro 8:28</a>).<P>8. The Unity of God:<P>It is both assumed through the New Testament and stated categorically that God is one (<a onClick="return mV(\'Mar\',12,29);">Mr 12:29</a>; <a onClick="return mV(\'Rom\',3,30);">Ro 3:30</a>; <a onClick="return mV(\'Eph\',4,6);">Eph 4:6</a>). No truth had sunk more deeply into the Hebrew mind by this time than the unity of God.<P>(1) The Divinity of Christ:<P>Yet it is obvious from what has been written, that Jesus Christ claimed a power, authority and position so unique that they can only be adequately described by calling Him God; and the apostolic church both in worship and in doctrine accorded Him that honor. All that they knew of God as now fully and finally revealed was summed up in His person, "for in him dwelleth all the fullness of the Godhead bodily" (<a onClick="return mV(\'Col\',2,9);">Col 2:9</a>). If they did not call Him God, they recognized and named Him everything that God meant for them.<P>(2) The Holy Spirit:<P>Moreover, the Holy Spirit is a third term that represents a Divine person in the experience, thought and language of Christ and His disciples. In the Johannine account of Christ\'s teaching, it is probable that the Holy Spirit is identified with the risen Lord Himself (<a onClick="return mV(\'Jhn\',14,16,17);">Joh 14:16-17</a>; compare <a onClick="return mV(\'Jhn\',14,18);">Joh 14:18</a>), and Paul seems also to identify them in at least one passage: "the Lord is the Spirit" (<a onClick="return mV(\'2Cr\',3,17);">2Co 3:17</a>). But in other places the three names are ranged side by side as representing three distinct persons (<a onClick="return mV(\'Mat\',28,19);">Mt 28:19</a>; <a onClick="return mV(\'2Cr\',13,14);">2Co 13:14</a>; <a onClick="return mV(\'Eph\',4,\'4-6\');">Eph 4:4-6</a>).<P>(3) The Church\'s Problem:<P>But how does the unity of God cohere with the Divine status of the Son and the distinct subsistence of the Holy Spirit? Jesus Christ affirmed a unity between Himself and the Father (<a onClick="return mV(\'Jhn\',10,30);">Joh 10:30</a>), a unity, too, which might be realized in a wider sphere, where the Father, the Son and believers should form one society (<a onClick="return mV(\'Jhn\',17,21,23);">Joh 17:21, 23</a>), but He reveals no category which would construe the unity of the Godhead in a manifoldness of manifestation. The experience of the first Christians as a rule found Christ so entirely sufficient to all their religious needs, so filled with all the fullness of God, that the tremendous problem which had arisen for thought did not trouble them. Paul expresses his conception of the relation of Christ to God under the figure of the image. Christ "is the image of the invisible God, the firstborn of all creation" (<a onClick="return mV(\'Col\',1,15);">Col 1:15</a>; <a onClick="return mV(\'2Cr\',4,4);">2Co 4:4</a>). Another writer employs a similar metaphor. Christ is "the effulgence of (God\'s) glory, and the very image of his substance" (<a onClick="return mV(\'Hbr\',1,3);">Heb 1:3</a>). But these figures do not carry us beyond the fact, abundantly evident elsewhere, that Christ in all things represented God because He participated in His being. In the prologue to the Fourth Gospel, the doctrine of the Word is developed for the same purpose. The eternal Reason of God who was ever with Him, and of Him, issues forth as revealed thought, or spoken word, in the person of Jesus Christ, who therefore is the eternal Word of God incarnate. So far and no farther the New Testament goes. Jesus Christ is God revealed; we know nothing of God, but that which is manifest in Him. His love, holiness, righteousness and purpose of grace, ordering and guiding all things to realize the ends of His fatherly love, all this we know in and through Jesus Christ. The Holy Spirit takes of Christ\'s and declares it to men (<a onClick="return mV(\'Jhn\',16,14);">Joh 16:14</a>). The problems of the coordination of the One with the Three, of personality with the plurality of consciousness, of the Infinite with the finite, and of the Eternal God with the Word made flesh, were left over for the church to solve. The Holy Spirit was given to teach it all things and guide it into all the truth (<a onClick="return mV(\'Jhn\',16,13);">Joh 16:13</a>). "And lo, I am with you always, even unto the end of the world" (<a onClick="return mV(\'Mat\',28,20);">Mt 28:20</a>).<P>LITERATURE.<P>Harris The Philosophical Basis of Theism; God the Creator and Lord of All; Flint, Theism; Orr, The Christian View of God and the World; E. Caird, The Evolution of Religion; James Ward, The Realm of Ends; Fairbairn, The Philosophy of the Christian Religion; W.N. Clarke, The Christian Doctrine of God; Adeney, The Christian Conception of God; Rocholl, Der Christliche Gottesbegriff; O. Holtzmann, Der Christliche Gottesglaube, seine Vorgeschichte und Urgeschichte; G. Wobbernim, Der Christliche Gottesglaube in seinem Verhaltnis zur heutigen Philosophie und Naturwissenschaft; Kostlin, article "Gott" in See Hauck-Herzog, Realencyklopadie fur protestantische Theologie und Kirche; R. S. Candlish, Crawford and Scott-Lidgett, books on The Fatherhood of God: Old Testament Theologies by Oehler, Schultz and Davidson; New Testament Theologies by Schmid, B. Weiss, Beyschlag, Holtzmann and Stevens; Wendt, The Teaching of Jesus; sections in systems of Christian Doctrine by Schleiermacher, Darner, Nitzsch, Martensen, Thomasius, Hodge, etc.`<a href="./study/isbe/search.html?string=JESUS+CHRIST,+1+OUTLINE">JESUS CHRIST</a>; <a href="./study/isbe/search.html?string=HOLY+SPIRIT,+1">HOLY SPIRIT</a>; <a href="./study/isbe/search.html?string=TRINITY,+1">TRINITY</a>`145';
isbe[3853]='God, Children of``<a href="./study/isbe/search.html?string=CHILDREN+OF+GOD">CHILDREN OF GOD</a>`1';
isbe[3854]='God, Image of`In <a onClick="return mV(\'Gen\',1,26,27);">Ge 1:26-27</a>, the truth is declared that God created man in His own "image" (tselem), after His "likeness" (demuth). The two ideas denote the same thing—resemblance to God. The like conception of man, tacit or avowed, underlies all revelation. It is given in <a onClick="return mV(\'Gen\',9,6);">Ge 9:6</a> as the ground of the prohibition of the shedding of man\'s blood; is echoed in <a onClick="return mV(\'Psa\',8,\'1-\);">Ps 8</a>; is reiterated frequently in the New Testament (<a onClick="return mV(\'1Cr\',11,7);">1Co 11:7</a>; <a onClick="return mV(\'Eph\',4,24);">Eph 4:24</a>; <a onClick="return mV(\'Col\',3,10);">Col 3:10</a>; <a onClick="return mV(\'Isa\',3,9);">Isa 3:9</a>). The nature of this image of God in man is discussed in other articles—see especially <a href="study/isbe/search.html?string=ANTHROPOLOGY">ANTHROPOLOGY</a>. It lies in the nature of the case that the "image" does not consist in bodily form; it can only reside in spiritual qualities, in man\'s mental and moral attributes as a self-conscious, rational, personal agent, capable of self-determination and obedience to moral law. This gives man his position of lordship in creation, and invests his being with the sanctity of personality. The image of God, defaced, but not entirely lost through sin, is restored in yet more perfect form in the redemption of Christ. See the full discussion in the writer\'s work, God\'s Image in Man and Its Defacement; see also Dr. J. Laidlaw, The Bible Doctrine of Man.``132';
isbe[3855]='God, Names of`<p><b>I. INTRODUCTORY</b><P class="in15">1. The Phrase "His Name"<P class="in15">2. Classification.<P><b>II. PERSONAL NAMES OF GOD IN THE OLD TESTAMENT</b><P class="in15">1. \'Elohim<P class="in15">2. \'El<P class="in15">3. \'Eloah<P class="in15">4. \'Adhon, \'Adhonay<P class="in15">5. Yahweh (Yahweh)<P class="in15">6. Tsur (Rock)<P class="in15">7. Ka\'dhosh<P class="in15">8. Shadday<P><b>III. DESCRIPTIVE NAMES OF GOD IN THE OLD TESTAMENT</b><P class="in15">1. \'Abhir<P class="in15">2. \'El-\'Elohe-Yisra\'el<P class="in15">3. \'Elyon<P class="in15">4. Gibbor<P class="in15">5. \'El-ro\'i<P class="in15">6. Tsaddiq<P class="in15">7. Qanna\'<P class="in15">8. Yahweh Tsebha\'oth<P class="in15">9. "I Am That I Am"<P><b>IV. NEW TESTAMENT NAMES OF GOD</b><P class="in15">1. God<P class="in15">2. Lord<P class="in15">3. Descriptive and Figurative Names<P><b>LITERATURE</b><hr /><P>I. Introduction:<P>To an extent beyond the appreciation of modern and western minds the people of Biblical times and lands valued the name of the person. They always gave to it symbolical or character meaning.<P>While our modern names are almost exclusively designatory, and intended merely for identification, the Biblical names were also descriptive, and often prophetic. Religious significance nearly always inhered in the name, a parent relating his child to the Deity, or declaring its consecration to the Deity, by joining the name of the Deity with the service which the child should render, or perhaps commemorating in a name the favor of God in the gracious gift of the child, e.g. Nathaniel ("gift of God"); Samuel ("heard of God"); Adonijah ("Yahweh is my Lord"), etc. It seems to us strange that at its birth, the life and character of a child should be forecast by its parents in a name; and this unique custom has been regarded by an unsympathetic criticism as evidence of the origin of such names and their attendant narratives long subsequent to the completed life itself; such names, for example, as Abraham, Sarah, etc. But that this was actually done, and that it was regarded as a matter of course, is proved by the name given to Our Lord at His birth: "Thou shalt call his name Jesus; for it is he that shall save his people" (<a onClick="return mV(\'Mat\',1,21);">Mt 1:21</a>). It is not unlikely that the giving of a character name represented the parents\' purpose and fidelity in the child\'s training, resulting necessarily in giving to the child\'s life that very direction, which the name indicated. A child\'s name, therefore, became both a prayer and a consecration, and its realization in character became often a necessary psychological effect. Great honor or dishonor was attached to a name. The Old Testament writings contain many and varied instances of this. Sometimes contempt for certain reprobate men would be most expressively indicated by a change of name, e.g. the change of Esh-baal, "man of Baal," to Ish-bosheth, "man of shame" (<a onClick="return mV(\'2Sa\',2,8);">2Sa 2:8</a>), and the omission of Yahweh from the name of the apostate king, Ahaz (<a onClick="return mV(\'2Ki\',15,38);">2Ki 15:38</a>, etc.). The name of the last king of Judah was most expressively changed by Nebuchadnezzar from Mattaniah to Zedekiah, to assure his fidelity to his overlord who made him king (<a onClick="return mV(\'2Ki\',24,17);">2Ki 24:17</a>).<P>See <a href="study/isbe/search.html?string=NAMES,+PROPER">NAMES, PROPER</a>.<P>1. The Phrase "His Name":<P>Since the Scriptures of the Old Testament and New Testament are essentially for purposes of revelation, and since the Hebrews laid such store by names, we should confidently expect them to make the Divine name a medium of revelation of the first importance. People accustomed by long usage to significant character indications in their own names, necessarily would regard the names of the Deity as expressive of His nature. The very phrase "name of Yahweh," or "His name," as applied to the Deity in Biblical usage, is most interesting and suggestive, sometimes expressing comprehensively His revelation in Nature (<a onClick="return mV(\'Psa\',8,1);">Ps 8:1</a>; compare <a onClick="return mV(\'Psa\',138,2);">138:2</a>); or marking the place of His worship, where men will call upon His name (<a onClick="return mV(\'Deu\',12,5);">De 12:5</a>); or used as a synonym of His various attributes, e.g. faithfulness (<a onClick="return mV(\'Isa\',48,9);">Isa 48:9</a>), grace (<a onClick="return mV(\'Psa\',23,3);">Ps 23:3</a>), His honor (<a onClick="return mV(\'Psa\',79,9);">Ps 79:9</a>), etc. "Accordingly, since the name of God denotes this God Himself as He is revealed, and as He desires to be known by His creatures, when it is said that God will make a name for Himself by His mighty deeds, or that the new world of the future shall be unto Him for a name, we can easily understand that the name of God is often synonymous with the glory of God, and that the expressions for both are combined in the utmost variety of ways, or used alternately" (Schultz, Old Testament Theology, English translation, I, 124-25; compare <a onClick="return mV(\'Psa\',72,19);">Ps 72:19</a>; <a onClick="return mV(\'Isa\',63,14);">Isa 63:14</a>; also Davidson, Old Testament Theol., 37-38).<P>2. Classification:<P>From the important place which the Divine name occupies in revelation, we would expect frequency of occurrence and diversity of form; and this is just that which we find to be true. The many forms or varieties of the name will be considered under the following heads:<P>(1) Absolute or Personal Names,<P>(2) Attributive, or Qualifying Names, and<P>(3) Names of God in the New Testament. Naturally and in course of time attributive names tend to crystallize through frequent use and devotional regard into personal names; e.g. the attributive adjective qadhosh, "holy," becomes the personal, transcendental name for Deity in Job and Isaiah. For fuller details of each name reference may be made to separate articles.<P>II. Absolute or Personal Names of God in the Old Testament:<P>1. \'Elohim:<P>The first form of the Divine name in the Bible is \'Elohim, ordinarily translated "God" (<a onClick="return mV(\'Gen\',1,1);">Ge 1:1</a>). This is the most frequently used name in the Old Testament, as its equivalent theos, is in the New Testament, occurring in Genesis alone approximately 200 times. It is one of a group of kindred words, to which belong also \'El and \'Eloah.<p>(1) Its form is plural, but the construction is uniformly singular, i.e. it governs a singular verb or adjective, unless used of heathen divinities (<a onClick="return mV(\'Psa\',96,5);">Ps 96:5</a>; <a onClick="return mV(\'Psa\',97,7);">97:7</a>). It is characteristic of Hebrew that extension, magnitude and dignity, as well as actual multiplicity, are expressed by the plural. It is not reasonable, therefore, to assume that plurality of form indicates primitive Semitic polytheism. On the contrary, historic Hebrew is unquestionably and uniformly monotheistic.<P>(2) The derivation is quite uncertain. Gesenius, Ewald and others find its origin in \'ul, "to be strong," from which also are derived \'ayil, "ram," and \'elah, "terebinth"; it is then an expanded plural form of \'el; others trace it to \'alah, "to terrify," and the singular form is found in the infrequent \'eloah, which occurs chiefly in poetical books; BDB inclines to the derivation from \'alah, "to be strong," as the root of the three forms, \'El, \'Eloah and \'Elohim, although admitting that the whole question is involved in uncertainty (for full statement see BDB, under the word...); a somewhat fanciful suggestion is the Arabic root \'ul, "to be in front," from which comes the meaning "leader"; and still more fanciful is the suggested connection with the preposition \'el, signifying God as the "goal" of man\'s life and aspiration. The origin must always lie in doubt, since the derivation is prehistoric, and the name, with its kindred words \'El and \'Eloah, is common to Semitic languages and religions and beyond the range of Hebrew records.<P>(3) It is the reasonable conclusion that the meaning is "might" or "power"; that it is common to Semitic language; that the form is plural to express majesty or "all-mightiness," and that it is a generic, rather than a specific personal, name for Deity, as is indicated by its application to those who represent the Deity (<a onClick="return mV(\'Jdg\',5,8);">Jud 5:8</a>; <a onClick="return mV(\'Psa\',82,1);">Ps 82:1</a>) or who are in His presence (<a onClick="return mV(\'1Sa\',28,13);">1Sa 28:13</a>).<P>2. \'Eloah:<P>The singular form of the preceding name, \'Eloah, is confined in its use almost exclusively to poetry, or to poetic expression, being characteristic of the Book of Job, occurring oftener in that book than in all other parts of the Old Testament. It is, in fact, found in Job oftener than the elsewhere more ordinary plural \'Elohim. For derivation and meaning see above under 1 (2). Compare also the Aramaic form, \'elah, found frequently in Ezra and Daniel.<P>3. \'El:<P>In the group of Semitic languages, the most common word for Deity is El (\'el), represented by the Babylonian ilu and the Arabic \'Allah. It is found throughout the Old Testament, but oftener in Job and Psalms than in all the other books. It occurs seldom in the historical books, and not at all in Lev. The same variety of derivations is attributed to it as to <a href="study/isbe/search.html?string=ELOHIM">ELOHIM</a> (which see), most probable of which is \'ul, "to be strong." BDB interprets \'ul as meaning "to be in front," from which came \'ayil, "ram" the one in front of the flock, and \'elah, the prominent "terebinth," deriving [\'El] from \'alah, "to be strong." It occurs in many of the more ancient names; and, like [\'Elohim], it is used of pagan gods. It is frequently combined with nouns or adjectives to express the Divine name with reference to particular attributes or phases of His being, as \'El \'Elyon, \'El-Ro\'i, etc. (see below under III, "Attributive Names").<P>4. \'Adhon, \'Adhonay:<P>An attributive name, which in prehistoric Hebrew had already passed over into a generic name of God, is \'Adhon, \'Adhonay, the latter formed from the former, being the construct plural, \'adhone, with the 1st person ending -ay, which has been lengthened to ay and so retained as characteristic of the proper name and distinguishing it from the possessive "my Lord." The King James Version does not distinguish, but renders both as possessive, "my Lord" (<a onClick="return mV(\'Jdg\',6,15);">Jud 6:15</a>; <a onClick="return mV(\'Jdg\',13,8);">13:8</a>), and as personal name (<a onClick="return mV(\'Psa\',2,4);">Ps 2:4</a>); the Revised Version (British and American) also, in <a onClick="return mV(\'Psa\',16,2);">Ps 16:2</a>, is in doubt, giving "my Lord," possessive, in text and "the Lord" in the margin. \'Adhonay, as a name of Deity, emphasizes His sovereignty (<a onClick="return mV(\'Psa\',2,4);">Ps 2:4</a>; <a onClick="return mV(\'Isa\',7,7);">Isa 7:7</a>), and corresponds closely to Kurios of the New Testament. It is frequently combined with Yahweh (<a onClick="return mV(\'Gen\',15,8);">Ge 15:8</a>; <a onClick="return mV(\'Isa\',7,7);">Isa 7:7</a>, etc.) and with \'Elohim (<a onClick="return mV(\'Psa\',86,12);">Ps 86:12</a>). Its most significant service in Massoretic Text is the use of its vowels to point the unpronounceable tetragrammaton YHWH, indicating that the word "\'Adhonay" should be spoken aloud instead of "Yah-weh." This combination of vowels and consonants gives the transliteration "Yahweh," adopted by the American Standard Revised Version, while the other English Versions of the Bible, since Coverdale, represents the combination by the capitals LORD. Septuagint represents it by Kurios.<P>5. Yahweh (Yahweh):<P>The name most distinctive of God as the God of Israel is (Yahweh, a combination of the tetragrammaton (YHWH) with the vowels of \'Adhonay, transliterated as Yehowah, but read aloud by the Hebrews \'adhonay). While both derivation and meaning are lost to us in the uncertainties of its ante-Biblical origin, the following inferences seem to be justified by the facts:<P>(1) This name was common to religions other than Israel\'s, according to Friedr. Delitzsch, Hommel, Winckler, and Guthe (EB, under the word), having been found in Babylonian inscriptions. Ammonite, Arabic and Egyptian names appear also to contain it (compare Davidson, Old Testament Theol., 52f); but while, like \'Elohim, it was common to primitive Semitic religion, it became Israel\'s distinctive name for the Deity.<P>(2) It was, therefore, not first made known at the call of Moses (<a onClick="return mV(\'Exd\',3,\'13-16\');">Ex 3:13-16</a>; <a onClick="return mV(\'Exd\',6,\'2-8\');">6:2-8</a>), but, being already known, was at that time given a larger revelation and interpretation: God, to be known to Israel henceforth under the name "Yahweh" and in its fuller significance, was the One sending Moses to deliver Israel; "when I shall say unto them, The God of your fathers hath sent me unto you; and they shall say to me, What is his name? what shall I say unto them? And God said...I WILL BE THAT I WILL BE...say...I WILL BE hath sent me" (<a onClick="return mV(\'Exd\',3,13,14);">Ex 3:13-14</a> margin). The name is assumed as known in the narrative of Genesis; it also occurs in pre-Mosaic names (<a onClick="return mV(\'Exd\',6,20);">Ex 6:20</a>; <a onClick="return mV(\'1Ch\',2,25);">1Ch 2:25</a>; <a onClick="return mV(\'1Ch\',7,8);">7:8</a>).<P>(3) The derivation is from the archaic chawah, "to be," better "to become," in Biblical Hebrew hayah; this archaic use of w for y appears also in derivatives of the similar chayah, "to live," e.g. chawwah in <a onClick="return mV(\'Gen\',3,20);">Ge 3:20</a>.<P>(4) It is evident from the interpretative passages (<a onClick="return mV(\'Exd\',3,\'1-\');">Ex 3</a>; <a onClick="return mV(\'Exd\',6,\'1-\');">6</a>) that the form is the fut. of the simple stem (Qal) and not future of the causative (Hiph\'il) stem in the sense "giver of life"—an idea not borne out by any of the occurrences of the word. The fanciful theory that the word is a combination of the future, present and perfect tenses of the verb, signifying "the One who will be, is, and was," is not to be taken seriously (Stier, etc., in Oehler\'s Old Testament Theology, in the place cited.).<P>(5) The meaning may with some confidence be inferred from Origen\'s transliteration, Iao, the form in Samaritan, Iabe, the form as combined in Old Testament names, and the evident signification in <a onClick="return mV(\'Exd\',3,\'1-\');">Ex 3</a> and other passages, to be that of the simple future, yahweh, "he will be." It does not express causation, nor existence in a metaphysical sense, but the covenant promise of the Divine presence, both at the immediate time and in the Messianic age of the future. And thus it became bound up with the Messianic hope, as in the phrase, "the Day of Yahweh," and consequently both it and the Septuagint translation Kurios were applied by the New Testament as titles of Christ.<P>(6) It is the personal name of God, as distinguished from such generic or essential names as \'El, \'Elohim, Shadday, etc. Characteristic of the Old Testament is its insistence on the possible knowledge of God as a person; and Yahweh is His name as a person. It is illogical, certainly, that the later Hebrews should have shrunk from its pronunciation, in view of the appropriateness of the name and of the Old Testament insistence on the personality of God, who as a person has this name. The American Standard Revised Version quite correctly adopts the transliteration "Yahweh" to emphasize its significance and purpose as a personal name of God revealed.<P>6. Tsur (Rock):<P>Five times in the "Song" of Moses (<a onClick="return mV(\'Deu\',32,4,15,18,30,31);">De 32:4, 15, 18, 30, 31</a>) the word tsur, "Rock," is used as a title of God. It occurs also in the Psalms, Isaiah and poetical passages of other books, and also in proper names, Elizur, Zuriel, etc. Once in the King James Version (<a onClick="return mV(\'Isa\',44,8);">Isa 44:8</a>) it is translated "God," but "Rock" in the American Standard Revised Version and the American Revised Version, margin. The effort to interpret this title as indicating the animistic origin of Old Testament religion is unnecessary and a pure product of the imagination. It is customary for both Old Testament and New Testament writers to use descriptive names of God: "rock," "fortress," "shield," "light," "bread," etc., and is in harmony with all the rich figurativeness of the Scriptures; the use of the article in many of the cases cited further corroborates the view that the word is intended to be a descriptive title, not the name of a Nature-deity. It presents the idea of God as steadfast: "The appellation of God as tsur, \'rock,\' \'safe retreat,\' in Deuteronomy refers to this" (Oehler, Old Testament Theology). It often occurs, in a most striking figure, with the pers. suffix as "my rock," "their rock," to express confidence (<a onClick="return mV(\'Psa\',28,1);">Ps 28:1</a>).<P>7. Kadhosh:<P>The name (qadhosh, "holy") is found frequently in Isaiah and Psalms, and occasionally in the other prophets. It is characteristic of Isaiah, being found 32 times in that book. It occurs often in the phrase qedhosh yisra\'el, "Holy One of Israel." The derivation and meaning remain in doubt, but the customary and most probable derivation is from qadhash, "to be separate," which best explains its use both of man and of the Deity. When used of God it signifies: (1) His transcendence, His separateness above all other beings, His aloneness as compared to other gods; (2) His peculiar relation to His people Israel unto whom He separated Himself, as He did not unto other nations. In the former sense Isaiah used it of His sole deity (<a onClick="return mV(\'Isa\',40,25);">40:25</A>), in the latter of His peculiar and unchanging covenant-relation to Israel (<a onClick="return mV(\'Isa\',43,3);">43:3</A>; <a onClick="return mV(\'Isa\',78,17);">48:17</A>), strikingly, expressed in the phrase "Holy One of Israel." Qadhosh was rather attributive than personal, but became personal in the use of such absolute theists as Job and Isaiah. It expresses essential Deity, rather than personal revelation.<P>8. Shadday:<P>In the patriarchal literature, and in Job particularly, where it is put into the mouths of the patriarchs, this name appears sometimes in the compound \'el shadday, sometimes alone. While its root meaning also is uncertain, the suggested derivation from shadhadh, "to destroy," "to terrify," seems most probable, signifying the God who is manifested by the terribleness of His mighty acts. "The Storm God," from shadha\', "to pour out," has been suggested, but is improbable; and even more so the fanciful she, and day, meaning "who is sufficient." Its use in patriarchal days marks an advance over looser Semitic conceptions to the stricter monotheistic idea of almightiness, and is in accord with the early consciousness of Deity in race or individual as a God of awe, or even terror. Its monotheistic character is in harmony with its use in the Abrahamic times, and is further corroborated by its parallel in Septuagint and New Testament, pantokrator, "all-powerful."<P>III. Descriptive Names of God in the Old Testament:<P>It is often difficult to distinguish between the personal and the attributive names of God, the two divisions necessarily shading into each other. Some of the preceding are really attributive, made personal by usage. The following are the most prominent descriptive or attributive names.<P>1. \'Abhir:<P>This name (\'abhir), translated in English Versions of the Bible "Mighty One," is always combined with Israel or Jacob; its root is \'abhar, "to be strong" from which is derived the word \'ebher, "pinion," used of the strong wing of the eagle (<a onClick="return mV(\'Isa\',40,31);">Isa 40:31</a>), figuratively of God in <a onClick="return mV(\'Deu\',32,11);">De 32:11</a>. It occurs in Jacob\'s blessing (<a onClick="return mV(\'Gen\',49,24);">Ge 49:24</a>), in a prayer for the sanctuary (<a onClick="return mV(\'Psa\',132,2,5);">Ps 132:2, 5</a>), and in Isaiah (<a onClick="return mV(\'Isa\',1,24);">1:24</a>; <a onClick="return mV(\'Isa\',49,26);">49:26</A>; <a onClick="return mV(\'Isa\',60,16);">60:16</A>), to express the assurance of the Divine strength in behalf of the oppressed in Israel (<a onClick="return mV(\'Isa\',1,24);">Isa 1:24</a>), or in behalf of Israel against his oppressors; it is interesting to note that this name was first used by Jacob himself.<P>2. \'El-\'Elohe-Israel:<P>The name \'El is combined with a number of descriptive adjectives to represent God in His various attributes; and these by usage have become names or titles of God. For the remarkable phrase <a href="study/isbe/search.html?string=EL-ELOHE-ISRAEL">\'EL-\'ELOHE-ISRAEL</A> (<a onClick="return mV(\'Gen\',33,20);">Ge 33:20</a>), see separate article<P>3. \'Elyon:<P>This name (\'elyon, "highest") is a derivative of \'alah, "to go up." It is used of persons or things to indicate their elevation or exaltation: of Israel, favored above other nations (<a onClick="return mV(\'Deu\',26,19);">De 26:19</a>), of the aqueduct of "the upper pool" (<a onClick="return mV(\'Isa\',7,3);">Isa 7:3</a>), etc. This indicates that its meaning when applied to God is the "Exalted One," who is lifted far above all gods and men. It occurs alone (<a onClick="return mV(\'Deu\',32,8);">De 32:8</a>; <a onClick="return mV(\'Psa\',18,13);">Ps 18:13</a>), or in combination with other names of God, most frequently with El (<a onClick="return mV(\'Gen\',14,18);">Ge 14:18</a>; <a onClick="return mV(\'Psa\',78,35);">Ps 78:35</a>), but also with Yahweh (<a onClick="return mV(\'Psa\',7,17);">Ps 7:17</a>; <a onClick="return mV(\'Psa\',97,9);">97:9</a>), or with Elohim (<a onClick="return mV(\'Psa\',56,2);">Ps 56:2</a> the King James Version; <a onClick="return mV(\'Psa\',78,56);">Ps 78:56</a>). Its early use (<a onClick="return mV(\'Gen\',14,18);">Ge 14:18</a>f) points to a high conception of Deity, an unquestioned monotheism in the beginnings of Hebrew history.<P>4. Gibbor:<P>The ancient Hebrews were in constant struggle for their land and their liberties, a struggle most intense and patriotic in the heroic days of Saul and David, and in which there was developed a band of men whose great deeds entitled them to the honorable title "mighty men" of valor (gibborim). These were the knights of David\'s "Round Table." In like manner the Hebrew thought of his God as fighting for him, and easily then this title was applied to God as the Mighty Man of war, occurring in David\'s psalm of the Ark\'s Triumphant Entry (<a onClick="return mV(\'Psa\',24,8);">Ps 24:8</a>), in the allegory of the Messiah-King (<a onClick="return mV(\'Psa\',45,3);">Ps 45:3</a>), either alone or combined with El (<a onClick="return mV(\'Isa\',9,6);">Isa 9:6</a>; <a onClick="return mV(\'Jer\',32,18);">Jer 32:18</a>), and sometimes with Yahweh (<a onClick="return mV(\'Isa\',42,13);">Isa 42:13</a>).<P>5. \'El-Ro\'i:<P>When Hagar was fleeing from Sarah\'s persecutions, Yahweh spoke to her in the wilderness of Shur, words of promise and cheer. Whereupon "she called the name of Yahweh that spake unto her, Thou art El roi" (<a onClick="return mV(\'Gen\',16,13);">Ge 16:13</a> margin). In the text the word ro\'i, deriv. of ra\'ah, "to see," is translated "that seeth," literally, "of sight." This is the only occurrence of this title in the Old Testament.<P>6. Tsaddiq:<P>One of the covenant attributes of God, His righteousness, is spoken of so often that it passes from adjective to substantive, from attribute to name, and He is called "Righteous" (tsaddiq), or "the Righteous One." The word is never transliterated but always translated in English Versions of the Bible, although it might just as properly be considered a Divine name as \'Elyon or Qadhosh. The root tsadhaq, "to be straight" or "right," signifies fidelity to a standard, and is used of God\'s fidelity to His own nature and to His covenant-promise (<a onClick="return mV(\'Isa\',41,10);">Isa 41:10</a>; <a onClick="return mV(\'Isa\',42,6);">42:6</a>; compare <a onClick="return mV(\'Hsa\',2,19);">Ho 2:19</a>); it occurs alone (<a onClick="return mV(\'Psa\',34,17);">Ps 34:17</a>), with El (<a onClick="return mV(\'Deu\',32,4);">De 32:4</a>), with Elohim (<a onClick="return mV(\'Ezr\',9,15);">Ezr 9:15</a>; <a onClick="return mV(\'Psa\',7,9);">Ps 7:9</a>; <a onClick="return mV(\'Psa\',116,5);">116:5</a>), but most frequently with Yahweh (<a onClick="return mV(\'Psa\',129,4);">Ps 129:4</a>, etc.). In <a onClick="return mV(\'Exd\',9,27);">Ex 9:27</a> Pharaoh, in acknowledging his sin against Yahweh, calls Him \'Yahweh the Righteous,\' using the article. The suggestive combination, "Yahweh our Righteousness," is the name given to David\'s "righteous Branch" (<a onClick="return mV(\'Jer\',23,6);">Jer 23:6</a>) and properly should be taken as a proper noun—the name of the Messiah-King.<P>7. Kanna:<P>Frequently in the Pentateuch, most often in the 3 versions of the Commandments (<a onClick="return mV(\'Exd\',20,5);">Ex 20:5</a>; <a onClick="return mV(\'Exd\',34,14);">34:14</a>; <a onClick="return mV(\'Deu\',5,9);">De 5:9</a>), God is given the title "Jealous" (qanna\'), most specifically in the phrase "Yahweh, whose name is Jealous" (<a onClick="return mV(\'Exd\',34,14);">Ex 34:14</a>). This word, however, did not bear the evil meaning now associated with it in our usage, but rather signified "righteous zeal," Yahweh\'s zeal for His own name or glory (compare <a onClick="return mV(\'Isa\',9,7);">Isa 9:7</a>, "the zeal of Yahweh," qin\'ah; also <a onClick="return mV(\'Zec\',1,14);">Zec 1:14</a>; <a onClick="return mV(\'Zec\',8,2);">8:2</a>).<P>8. Yahweh Tsebha\'-oth:<P>Connected with the personal and covenant name Yahweh, there is found frequently the word Sabaoth (tsebha\'oth, "hosts"). Invariably in the Old Testament it is translated "hosts" (<a onClick="return mV(\'Isa\',1,9);">Isa 1:9</a>; <a onClick="return mV(\'Psa\',46,7,11);">Ps 46:7, 11</a>, etc.), but in the New Testament it is transliterated twice, both in the Greek and English (<a onClick="return mV(\'Rom\',9,29);">Ro 9:29</a>; <a onClick="return mV(\'Jam\',5,4);">Jas 5:4</a>). The passage in Roman is a quotation from <a onClick="return mV(\'Isa\',1,9);">Isa 1:9</a> through Septuagint, which does not translate, but transliterates the Hebrew. Origin and meaning are uncertain. It is used of heavenly bodies and earthly forces (<a onClick="return mV(\'Gen\',2,1);">Ge 2:1</a>); of the army of Israel (<a onClick="return mV(\'2Sa\',8,16);">2Sa 8:16</a>); of the Heavenly beings (<a onClick="return mV(\'Psa\',103,21);">Ps 103:21</a>; <a onClick="return mV(\'Psa\',148,2);">148:2</a>; <a onClick="return mV(\'Dan\',4,35);">Da 4:35</a>). It is probable that the title is intended to include all created agencies and beings, of which Yahweh is maker and leader.<P>9. "I Am That I Am":<P>When God appeared to Moses at Sinai, commissioning him to deliver Israel; Moses, being well aware of the difficulty of impressing the people, asked by what name of God he should speak to them: "They shall say to me, What is his name?" Then "God said unto Moses, I AM THAT I AM...say...I AM hath sent me unto you" (<a onClick="return mV(\'Exd\',3,14);">Ex 3:14</a>). The name of the Deity given here is similar to Yahweh except that the form is not 3rd person future, as in the usual form, but the 1st person (\'ehyeh), since God is here speaking of Himself. The optional reading in the American Revised Version, margin is much to be preferred: "I WILL BE THAT I WILL BE," indicating His covenant pledge to be with and for Israel in all the ages to follow. For further explanation see above, II, 5.<P>IV. New Testament Names of God.<P>The variety of names which characterizes the Old Testament is lacking in the New Testament, where we are all but limited to two names, each of which corresponds to several in the Old Testament. The most frequent is the name "God" (Theos) occurring over 1,000 times, and corresponding to El, Elohim, etc., of the Old Testament.<P>1. God:<P>It may, as [\'Elohim], be used by accommodation of heathen gods; but in its true sense it expresses essential Deity, and as expressive of such it is applied to Christ as to the Father (<a onClick="return mV(\'Jhn\',20,28);">Joh 20:28</a>; <a onClick="return mV(\'Rom\',9,5);">Ro 9:5</a>).<P>2. Lord:<P>Five times "Lord" is a translation of despotes (<a onClick="return mV(\'Luk\',2,29);">Lu 2:29</a>; <a onClick="return mV(\'Act\',4,24);">Ac 4:24</a>; <a onClick="return mV(\'2Pe\',2,1);">2Pe 2:1</a> the King James Version; <a onClick="return mV(\'Jud\',1,4);">Jude 1:4</a>; <a onClick="return mV(\'Rev\',6,10);">Re 6:10</a> the King James Version). In each case there is evident emphasis on sovereignty and correspondence to the \'Adhon of the Old Testament. The most common Greek word for Lord is Kurios, representing both Yahweh and \'Adhonai of the Old Testament, and occurring upwards of 600 times. Its use for Yahweh was in the spirit of both the Hebrew scribes, who pointed the consonants of the covenant name with the vowels of Adhonay, the title of dominion, and of the Septuagint, which rendered this combination as Kurios. Consequently quotations from the Old Testament in which Yahweh occurs are rendered by Kurios. It is applied to Christ equally with the Father and the Spirit, showing that the Messianic hopes conveyed by the name Yahweh were for New Testament writers fulfilled in Jesus Christ; and that in Him the long hoped for appearance of Yahweh was realized.<P>3. Descriptive and Figurative Names:<P>As in the Old Testament, so in the New Testament various attributive, descriptive or figurative names are found, often corresponding to those in the Old Testament. Some of these are: The "Highest" or "Most High" hupsistos), found in this sense only in Luke (<a onClick="return mV(\'Luk\',1,32,35,76);">1:32,35,76</a>; <a onClick="return mV(\'Luk\',2,14);">2:14</a>, etc.), and equivalent to \'Elyon (see III,3,above); "Almighty," Pantokrator (<a onClick="return mV(\'2Cr\',6,18);">2Co 6:18</a>; <a onClick="return mV(\'Rev\',1,8);">Re 1:8</a>, etc.), corresponding to Shadday (see II, 8 above; see also <a href="study/isbe/search.html?string=ALMIGHTY">ALMIGHTY</a>); "Father," as in the Lord\'s Prayer, and elsewhere (<a onClick="return mV(\'Mat\',6,9);">Mt 6:9</a>; <a onClick="return mV(\'Mat\',11,25);">11:25</a>; <a onClick="return mV(\'Jhn\',17,25);">Joh 17:25</a>; <a onClick="return mV(\'2Cr\',6,18);">2Co 6:18</a>); "King" (<a onClick="return mV(\'1Ti\',1,17);">1Ti 1:17</a>); "King of kings" (<a onClick="return mV(\'1Ti\',6,15);">1Ti 6:15</a>); "King of kings," "Lord of lords" (<a onClick="return mV(\'Rev\',17,14);">Re 17:14</a>; <a onClick="return mV(\'Rev\',19,16);">19:16</a>); "Potentate" (<a onClick="return mV(\'1Ti\',6,15);">1Ti 6:15</a>); "Master" (Kurios, <a onClick="return mV(\'Eph\',6,9);">Eph 6:9</a>; <a onClick="return mV(\'2Pe\',2,1);">2Pe 2:1</a>; <a onClick="return mV(\'Rev\',6,10);">Re 6:10</a>); "Shepherd," "Bishop" (<a onClick="return mV(\'1Pe\',2,25);">1Pe 2:25</a>).<P>LITERATURE.<P>Theology of Old Testament by various authors: Oehler, Schultz, Davidson; Delitzsch, Psychology of the Old Testament; H.P. Smith, "Theophorous Names of OT" in Old Testament and Semitic Studies; Gray, HPN; "God" in HDB and EB.``109';

isbe[3857]='God, Strange`stranj: The word "strange," as used in this connection in the Old Testament, refers to the fact that the god or gods do not belong to Israel, but are the gods which are worshipped by other families or nations. In several cases a more exact translation would give us the "gods of the stranger" or foreigner. So in <a onClick="return mV(\'Gen\',35,2,4);">Ge 35:2, 4</a>; <a onClick="return mV(\'Jos\',24,2);">Jos 24:2</a>; <a onClick="return mV(\'Jdg\',10,16);">Jud 10:16</a>; <a onClick="return mV(\'Deu\',31,16);">De 31:16</a>; <a onClick="return mV(\'Deu\',32,12);">32:12</a>, etc. In a few passages like <a onClick="return mV(\'Deu\',32,16);">De 32:16</a>; <a onClick="return mV(\'Psa\',44,20);">Ps 44:20</a>; <a onClick="return mV(\'Psa\',81,9);">81:9</a>; <a onClick="return mV(\'Isa\',43,12);">Isa 43:12</a>, the word is an adjective, but the idea is the same: the gods are those which are worshipped by other peoples and hence are forbidden to Israel, which is under obligation to worship Yahweh alone (compare 2Esdras 1:6).<P>In the New Testament the phrase occurs only once, in the account of Paul\'s experiences in Athens (<a onClick="return mV(\'Act\',17,18);">Ac 17:18</a>), when some of his auditors said, "He seemeth to be a setter forth of strange gods" (xena daimonia). Here the thought is clearly that by his preaching of Jesus he was regarded as introducing a new divinity, that is one who was strange or foreign to the Athenians and of whom they had never heard before. Like the Romans of this period the Athenians were doubtless interested in, and more or less favorable to, the numerous new cults which were coming to their attention as the result of the constant intercourse with the Orient.`<a href="./study/isbe/search.html?string=SONS+OF+GOD">SONS OF GOD</a>`13';

isbe[3860]='Goddess`god\'-es (\'elohim, thea): There is no separate word for "goddess" in the Old Testament. In the only instance in which the word occurs in English Versions of the Bible (<a onClick="return mV(\'1Ki\',11,5,33);">1Ki 11:5, 33</a>), the gender is determined by the noun—"Ashtoreth, the god (goddess) of the Sidonians." In the New Testament the term is applied to Diana of Ephesus (<a onClick="return mV(\'Act\',19,27,35,37);">Ac 19:27, 35, 37</a>).``1';
isbe[3861]='Godhead`god\'-hed: The word "Godhead" is a simple doublet of the less frequently occurring "Godhood." Both forms stand side by side in the Ancren Riwle (about 1225 AD), and both have survived until today, though not in equally common use. They are representatives of a large class of abstract substantives, formed with the suffix "-head" or "-hood", most of which formerly occurred in both forms almost indifferently, though the majority of them survive only, or very preponderatingly (except in Scottish speech), in the form -hood. The two suffixes appear in Middle English as "-hede" and "-hod", and presuppose in the Anglo-Saxon which lies behind them a feminine "haeda" (which is not actually known) by the side of the masculine had. The Anglo-Saxon word "was originally a distinct substantive, meaning \'person, personality, sex, condition, quality, rank\' "(Bradley, in A New English Dict. on a Historical Basis, under the word "-hood"), but its use as a suffix early superseded its separate employment. At first "-hede" appears to have been appropriated to adjectives, "-hod" to substantives; but, this distinction breaking down and the forms coming into indiscriminate use, "-hede" grew obsolete, and remains in common use only in one or two special forms, such as "Godhead," "maidenhead" (Bradley, as cited, under the word "-head").<P>The general elimination of the forms in -head has been followed by a fading consciousness, in the case of the few surviving instances in this form, of the qualitative sense inherent in the suffix. The words accordingly show a tendency to become simple denotatives. Thus, "the Godhead" is frequently employed merely as a somewhat strong synonym of "God" although usually with more or less emphasis upon that in God which makes Him God. One of its established usages is to denote the Divine essence as such, in distinction from the three "hypostases" or "persons" which share its common possession in the doctrine of the Trinity. This usage is old: Bradley (op. cit.) is able to adduce instances from the 13th century. In this usage the word has long held the rank of a technical term, e.g. the Thirty-Nine Articles of the Church of England, 1571, Art. I: "And in the unity of this Godhead, there be three persons" (compare the Irish Articles of 1615, and the Westminster Confession, II, 3); Westminster Shorter Catechism, Q. 6: "There are three persons in the Godhead." Pursuant to the fading of the qualitative sense of the word, there has arisen a tendency, when the qualitative consciousness is vivid, to revive the obsolescent "Godhood," to take its place; and this tendency naturally shows itself especially when the contrast with humanity is expressed. Carlyle, for example (French Revolution, III, Book vi, chapter iv, section 1), speaking of the posthumous reaction against Marat, writes: "Shorter godhood had no divine man"; and Phillips Brooks (Sermons, XIII, 237) speaks of Christ bridging the gulf "between the Godhood and the manhood." "Godhood" seems, indeed, always to have had a tendency to appear in such contrasts, as if the qualitative consciousness were more active in it than in "Godhead." Thus, it seems formerly to have suggested itself almost as inevitably to designate the Divine nature of Christ, as "Godhead" did to designate the common Divine essence of the Trinity. Bradley cites instances from 1563 down. The fundamental meaning of "Godhead" is, nevertheless, no less than that of "Godhood," the state, dignity, condition, quality, of a god, or, as monotheists would say, of God. As manhood is that which makes a man a man, and childhood that which makes a child a child, so Godhead is that which makes God, God. When we ascribe Godhead to a being, therefore, we affirm that all that enters into the idea of God belongs to Him. "Godhead" is thus the Saxon equivalent of the Latin "Divinity," or, as it is now becoming more usual to say, "Deity." Like these terms it is rendered concrete by prefixing the article to it. As "the Divinity," "the Deity," so also "the Godhead" is only another way of saying "God," except that when we say "the Divinity," "the Deity," "the Godhead," we are saying "God" more abstractly and more qualitatively, that is with more emphasis, or at least with a more lively consciousness, of the constitutive qualities which make God the kind of being we call "God."<P>The word "Godhead" occurs in the King James Version only 3 times (<a onClick="return mV(\'Act\',17,29);">Ac 17:29</a>; <a onClick="return mV(\'Rom\',1,20);">Ro 1:20</a>; <a onClick="return mV(\'Col\',2,9);">Col 2:9</a>), and oddly enough it translates in these 3 passages, 3 different, though closely related, Greek words, to theion theiotes, theotes.<P>To theion means "that which is Divine," concretely, or, shortly, "the Deity." Among the Greeks it was in constant use in the sense of "the Divine Being," and particularly as a general term to designate the Deity apart from reference to a particular god. It is used by Paul (<a onClick="return mV(\'Act\',17,29);">Ac 17:29</a>) in an address made to a heathen audience, and is inserted into a context in which it is flanked by the simple term "God" (ho Theos) on both sides. It is obviously deliberately chosen in order to throw up into emphasis the qualitative idea of God; and this emphasis is still further heightened by the direct contrast into which it is brought with the term "man." "Being, then, the offspring of God, we ought not to think that it is to gold or silver or stone graven by art and device of man that the Godhead is like." In an effort to bring out this qualitative emphasis, the Revised Version, margin suggests that we might substitute for "the Godhead" here the periphrastic rendering, "that which is Divine." But this seems both clumsy and ineffective for its purpose. From the philological standpoint, "the Godhead" is very fair equivalent for to theion, differing as it does from the simple "God" precisely by its qualitative emphasis. It may be doubted, however, whether in the partial loss by "Godhead" of its qualitative force in its current usage, one of its synonyms, "the Divinity" (which is the rendering here of the Rhemish version) or "the Deity," would not better convey Paul\'s emphasis to modern readers.<P>Neither of these terms, "Divinity," "Deity," occurs anywhere in the King James Version, and "Deity" does not occur in the Revised Version (British and American) either; but the Revised Version (British and American) (following the Rhemish version) substitutes "Dignity" for "Godhead" in <a onClick="return mV(\'Rom\',1,20);">Ro 1:20</a>. Of the two, "Dignity" was originally of the broader connotation; in the days of heathendom it was applicable to all grades of Divine beings. "Deity" was introduced by the Christian Fathers for the express purpose of providing a stronger word by means of which the uniqueness of the Christians\' God should be emphasized. Perhaps "Divinity" retains even in its English usage something of its traditional weaker connotation, although, of course, in a monotheistic consciousness the two terms coalesce in meaning. There exists a tendency to insist, therefore, on the "Deity" of Christ, rather than his mere "Divinity," in the feeling that "Divinity" might lend itself to the notion that Christ possessed but a secondary or reduced grade of Divine quality. In <a onClick="return mV(\'Act\',17,29);">Ac 17:29</a> Paul is not discriminating between grades of Divinity, but is preaching monotheism. In this context, then, to theion does not lump together "all that is called God or is worshipped," and declare that all that is in any sense Divine should be esteemed beyond the power of material things worthily to represent. Paul has the idea of God at its height before his mind, and having quickened his hearers\' sense of God\'s exaltation by his elevated description of Him, he demands of them whether this Deity can be fitly represented by any art of man working in dead stuff. He uses the term to theion, rather than ho theos, not merely in courteous adoption of his hearers\' own language, but because of its qualitative emphasis. On the whole, the best English translation of it would probably be "the Deity." "The Godhead" has ceased to be sufficiently qualitative: "the Godhood" is not sufficiently current: "the Divine" is not sufficiently personal: "the Divinity" is perhaps not sufficiently strong: "Deity" without the article loses too much of its personal reference to compensate for the gain in qualitativeness: "the Deity" alone seems fairly to reproduce the apostle\'s thought.<P>The Greek term in <a onClick="return mV(\'Rom\',1,20);">Ro 1:20</a> is theiotes, which again, as a term of quality, is not unfairly rendered by "Godhead." What Paul says here is that "the everlasting power and Godhead" of God "are clearly perceived by means of His works." By "Godhead" he clearly means the whole of that by which God is constituted what we mean by "God." By coupling the word with "power," Paul no doubt intimates that his mind is resting especially upon those qualities which enter most intimately into and constitute the exaltation of God; but we must beware of limiting the connotation of the term—all of God\'s attributes are glorious. The context shows that the thought of the apostle was moving on much the same lines as in <a onClick="return mV(\'Act\',17,29);">Ac 17:29</a>; here, too, the contrast which determines the emphasis is with "corruptible man," and along with him, with the lower creatures in general (<a onClick="return mV(\'Rom\',1,23);">Ro 1:23</a>). How could man think of the Godhead under such similitudes—the Godhead, so clearly manifested in its glory by its works! The substitution for "Godhead" here of its synonym "Divinity" by the Revised Version (British and American) is doubtless due in part to a desire to give distinctive renderings to distinct terms, and in part to a wish to emphasize, more strongly than "Godhead" in its modern usage emphasizes, the qualitative implication which is so strong in theiotes. Perhaps, however, the substitution is not altogether felicitous. "Divinity," in its contrast with "Deity," may have a certain weakness of connotation clinging to it, which would unsuit it to represent theiotes here. It is quite true that the two terms, "Divinity" and "Deity," are the representatives in Latin Patristic writers respectively of the Greek theiotes and theotes. Augustine (The City of God, VII, 1; compare X, 1) tells us that "Deity" was coined by Christian writers as a more accurate rendering of the Greek theotes than the current "Divinity." But it does not follow that because "Deity" more accurately renders theotes, therefore "Divinity" is always the best rendering of theiotes. The stress laid by the Greek Fathers on the employment of theotes to express the "Deity" of the Persons of the Trinity was in sequence to attempts which were being made to ascribe to the Son and the Spirit a reduced "Divinity"; and it was the need the Latin Fathers felt in the same interests which led them to coin "Deity" as a more accurate rendering, as they say, of theotes. Meanwhile theiotes and "Divinity" had done service in the two languages, the former as practically, and the latter as absolutely, the only term in use to express the idea of "Deity." Theotes is very rare in classical Greek, "Deity" non-existent in classical Latin. To represent theiotes uniformly by "Divinity," if any reduced connotation at all clings to "Divinity," would therefore be to represent it often very inadequately. And that is the case in the present passage. What Paul says is clearly made known by God\'s works, is His everlasting power and all the other everlasting attributes which form His Godhead and constitute His glory.<P>It is theotes which occurs in <a onClick="return mV(\'Col\',2,9);">Col 2:9</a>. Here Paul declares that "all the fullness of the Godhead" dwells in Christ "bodily." The phrase "fullness of the Godhead" is an especially emphatic one. It means everything without exception which goes to make up the Godhead, the totality of all that enters into the conception of Godhood. All this, says Paul, dwells in Christ "bodily," that is after such a fashion as to be manifested in connection with a bodily organism. This is the distinction of Christ: in the Father and in the Spirit the whole plenitude of the Godhead dwells also, but not "bodily"; in them it is not manifested in connection with a bodily life. It is the incarnation which Paul has in mind; and he tells us that in the incarnate Son, the fullness of the Godhead dwells. The term chosen to express the Godhead here is the strongest and the most unambiguously decisive which the language affords. Theiotes may mean all that theotes can mean; on monotheistic lips it does mean just what theotes means; but theotes must mean the utmost that either term can mean. The distinction is, not that theotes refers to the essence and theiotes to the attributes; we cannot separate the essence and the attributes. Where the essence is, there the attributes are; they are merely the determinants of the essence. And where the attributes are, there the essence is; it is merely the thing, of the kind of which they are the determinants. The distinction is that theotes emphasizes that it is the highest stretch of Divinity which is in question, while theiotes might possibly be taken as referring to Deity at a lower level. It it not merely such divinity as is shared by all the gods many and lords many of the heathen world, to which "heroes" might aspire, and "demons" attain, all the plenitude of which dwells in Christ as incarnate; but that Deity which is peculiar to the high gods; or, since Paul is writing out of a monotheistic consciousness, that Deity which is the Supreme God alone. All the fullness of supreme Deity dwells in Christ bodily. There is nothing in the God who is over all which is not in Christ. Probably no better rendering of this idea is afforded by our modern English than the term "Godhead," in which the qualitative notion still lurks, though somewhat obscured behind the individualizing implication, and which in any event emphasizes precisely what Paul wishes here to assert—that all that enters into the conception of God, and makes God what we mean by the term "God," dwells in Christ, and is manifested in Him in connection with a bodily organism.``187';
isbe[3862]='Godless`god\'-les: This word is not found in the text of the King James Version. It is found, however, in Apocrypha (2Macc 7:34, "O godless (the Revised Version (British and American) "unholy") man"). the Revised Version (British and American) substitutes the word "godless" for the word "hypocrite" in the following passages: <a onClick="return mV(\'Job\',8,13);">Job 8:13</a>; <a onClick="return mV(\'Job\',13,16);">13:16</a>; <a onClick="return mV(\'Job\',15,34);">15:34</a>; <a onClick="return mV(\'Job\',17,8);">17:8</a>; <a onClick="return mV(\'Job\',20,5);">20:5</a>; <a onClick="return mV(\'Job\',27,8);">27:8</a>; <a onClick="return mV(\'Job\',34,30);">34:30</a>; <a onClick="return mV(\'Job\',36,13);">36:13</a>; <a onClick="return mV(\'Pro\',11,9);">Pr 11:9</a>; <a onClick="return mV(\'Isa\',33,14);">Isa 33:14</a>. The Revised Version (British and American) does not seem to be consistent in carrying out the idea of "godless" for "hypocrite," for in <a onClick="return mV(\'Isa\',9,17);">Isa 9:17</a>; <a onClick="return mV(\'Isa\',10,6);">10:6</a>; <a onClick="return mV(\'Psa\',35,16);">Ps 35:16</a> this same Hebrew word chaneph is translated "profane." The principal idea lying at the root of the word is that of pollution and profanity; a condition of not merely being without God but assuming an attitude of open and blatant opposition toward God. The godless man is not merely the atheistic, unbelieving or even irreligious, but the openly impious, wicked and profane man. Indeed it can hardly be rightly claimed that the idea of hypocrisy is involved in the meaning of the word, for the "godless" man is not the one who professes one thing and lives another, but the one who openly avows not only his disbelief in, but his open opposition to, God. Doubtless the idea of pollution and defilement is also to be included in the definition of this word; see <a onClick="return mV(\'Jer\',3,9);">Jer 3:9</a>; <a onClick="return mV(\'Num\',35,33);">Nu 35:33</a>; <a onClick="return mV(\'Dan\',11,31);">Da 11:31</a>.``53';
isbe[3863]='Godliness; Godly`god\'-li-nes, god\'-li (eusebeia, eusebes, eusebos): In the Old Testament the word rendered "godly" in <a onClick="return mV(\'Psa\',4,3);">Ps 4:3</a>; <a onClick="return mV(\'Psa\',32,6);">32:6</a> (chacidh) is literally, "kind," then "pious" (the Revised Version, margin renders it in the former passage, "one that he favoreth"). Sometimes in both the Old Testament and the New Testament a periphrasis is employed, "of God," "according to God" (e.g. "godly sorrow," <a onClick="return mV(\'2Cr\',7,10);">2Co 7:10</a>). Godliness, as denoting character and conduct determined by the principle of love or fear of God in the heart, is the summing up of genuine religion. There can be no true religion without it: only a dead "form" (<a onClick="return mV(\'2Ti\',3,5);">2Ti 3:5</a>). The term is a favorite one in the Pastoral Epistles. The incarnation is "the mystery of godliness" (<a onClick="return mV(\'1Ti\',3,16);">1Ti 3:16</a>).``132';
isbe[3864]='Gods` (\'elohim; theoi):<P><b>I. IN THE OLD TESTAMENT</b><P class="in15">1. Superhuman Beings (God and Angels)<P class="in15">2. Judges, Rulers<P class="in15">3. Gods of the Nations<P class="in15">4. Superiority of Yahweh to Other Gods<P class="in15">5. Regulations Regarding the Gods of the Nations<P class="in15">6. Israel\'s Tendency to Idolatry<P><b>II. IN THE APOCRYPHA</b><P><b>III. IN THE NEW TESTAMENT</b><hr /><P>The Hebrew plural \'elohim is generally known as the plural of "majesty" and is the ordinary name for God. The meaning of the plural seems to be "plenitude of powers." It denotes the fullness of those attributes of power which belonged to the Divine Being. Thus it is usually translated in the singular, "God," when referring to the God of Israel. When reference is made to the gods of the other nations the word is translated in the plural, "gods." The heathen nations usually had a plurality of gods. Among the Semites it was customary for one nation or tribe to have its own particular god. Often there were many tribes, or families, or communities, in one nation, each having a particular god. Thus, even among Semites a nation may have many gods and be polytheistic. Among the other nations, Iranian, Hamitic, etc., there were always a number of deities, sometimes a multitude. There are many references to these in the Old Testament. In a few cases where the plural is used, the singular would be better, e.g. <a onClick="return mV(\'Gen\',3,5);">Ge 3:5</a> the King James Version; <a onClick="return mV(\'Exd\',32,4,8,23);">Ex 32:4, 8, 23</a>; <a onClick="return mV(\'Rth\',1,15);">Ru 1:15</a> the King James Version; <a onClick="return mV(\'Jdg\',17,5);">Jud 17:5</a>; <a onClick="return mV(\'Jdg\',18,24);">18:24</a>; <a onClick="return mV(\'1Sa\',17,43);">1Sa 17:43</a>. This, however, might be disputed.<P>I. In the Old Testament.<P>1. Superhuman Beings (God and Angels):<P>The following are the more important usages of the word in the Old Testament: The translation of <a onClick="return mV(\'Psa\',8,5);">Ps 8:5</a> is disputed. The Septuagint and the King James Version translate it "angels," the Revised Version (British and American) and the American Standard Revised Version, "God," with "angels" in the margin. The Epistle to the Hebrews has the word "angels." This seems to be more in keeping with the Old Testament ideas of the relation between God, men and angels. <a onClick="return mV(\'Gen\',1,26);">Ge 1:26</a> has the plural "us," but it is not certain to whom it refers, most probably to the angels or mighty ones which surrounded the throne of God as servants or counselors; compare <a onClick="return mV(\'Job\',38,7);">Job 38:7</a>, and see <a href="study/isbe/search.html?string=SONS+OF+GOD">SONS OF GOD</a>. In <a onClick="return mV(\'Psa\',97,7);">Ps 97:7</a> the expression "worship him, all ye gods," may possibly refer to the gods of the nations, but more probably to the angels or mighty ones.<P>2. Judges, Rulers:<P>Judges, rulers, are regarded "either as Divine representatives at sacred places, or as reflecting Divine majesty and power" (see BDB, under the word). <a onClick="return mV(\'Exd\',21,6);">Ex 21:6</a> might better be translated as in the margin, "the judges." These were men appointed to represent God and adjudicate on important matters of law. Septuagint has "Criterion of God." In <a onClick="return mV(\'Exd\',22,8);">Ex 22:8</a> the word is used in the same sense, and <a onClick="return mV(\'Exd\',22,9);">22:9</A> would also be better translated "the judges"; <a onClick="return mV(\'Exd\',22,28);">22:28</a> likewise. See also <a onClick="return mV(\'1Sa\',2,25);">1Sa 2:25</a>; <a onClick="return mV(\'Psa\',82,1,6);">Ps 82:1, 6</a>, where the reference is to those who act as judges.<P>3. Gods of the Nations:<P>(1) The ancestors of Israel "beyond the River" had their gods (<a onClick="return mV(\'Jos\',24,14);">Jos 24:14</a>f). While there is no mention of idolatry before the Deluge, the ancestors and kindred of Abraham were idolaters. Ur of the Chaldees was the center for the worship of Sin, the Moon-god. Many others were worshipped in the various cities of Babylon.<P>See <a href="study/isbe/search.html?string=BABYLONIA">BABYLONIA</a>.<P>(2) The gods of Laban and his family (<a onClick="return mV(\'Gen\',31,30,32);">Ge 31:30, 32</a>; <a onClick="return mV(\'Gen\',35,2,4);">35:2, 4</a>) were household gods or teraphim, and were stolen by Rachel and carried off in her flight with Jacob.<P>See <a href="study/isbe/search.html?string=TERAPHIM">TERAPHIM</a>.<P>(3) Gods of Egypt: For many centuries before the time of Abraham there had been numerous objects of worship in Egypt. Many of these were animals, birds and natural objects. Horus, the hawk, was one of the earliest of all. The cat, the bull, etc., were worshipped at times. The plagues of Egypt were specially directed against these wretched deities (<a onClick="return mV(\'Num\',33,4);">Nu 33:4</a>; <a onClick="return mV(\'Exd\',12,12);">Ex 12:12</a>). Yahweh took vengeance on all the gods of Egypt. These terrible events showed that "Yahweh is greater than all gods" (<a onClick="return mV(\'Exd\',18,11);">Ex 18:11</a>). He redeemed His people from the nations and its gods (<a onClick="return mV(\'2Sa\',7,23);">2Sa 7:23</a>). Jeremiah predicted the time when Yahweh should destroy the gods of Egypt (<a onClick="return mV(\'Jer\',43,12);">Jer 43:12</a>f; <a onClick="return mV(\'Jer\',46,25);">46:25</A>).<P>(4) Of the gods of the Amorites (<a onClick="return mV(\'Jdg\',6,10);">Jud 6:10</a>) no names are given, but they probably were the same as the gods of the Canaanites.<P>(5) The gods of the Canaanites were Nature-gods, and their worship was that of the productive and chiefly reproductive powers of Nature. Their service was perhaps the most immoral and degrading of all. The high places and altars of the different Baals, Ashtoreths, etc., were numerous throughout Canaan. These deities were always represented by images and Moses makes frequent reference to them with warnings against this seductive worship (<a onClick="return mV(\'Deu\',7,25);">De 7:25</a>; <a onClick="return mV(\'Deu\',12,3,10,31);">12:3, 10, 31</a>; <a onClick="return mV(\'Deu\',13,7);">13:7</a>; <a onClick="return mV(\'Deu\',20,18);">20:18</a>; <a onClick="return mV(\'Deu\',29,18);">29:18</a>; <a onClick="return mV(\'Deu\',32,16);">32:16</a>, etc.).<P>See also <a href="study/isbe/search.html?string=IDOLATRY">IDOLATRY</a>; <a href="study/isbe/search.html?string=BAAL">BAAL</a>; <a href="study/isbe/search.html?string=ASHTORETH">ASHTORETH</a>; <a href="study/isbe/search.html?string=ASHERAH">ASHERAH</a>, etc.<P>(6) Gods of the Philistines: The champion Goliath cursed David by his gods (<a onClick="return mV(\'1Sa\',17,43);">1Sa 17:43</a>). Perhaps it would be better rendered "god." Saul\'s and his son\'s armor was put into the house of their gods (<a onClick="return mV(\'1Ch\',10,10);">1Ch 10:10</a>).<P>See also <a href="study/isbe/search.html?string=DAGON">DAGON</a>; <a href="study/isbe/search.html?string=BAALZEBUB">BAALZEBUB</a>.<P>(7) The two golden calves erected by Jeroboam at Dan and Bethel to keep the people from going to Jerusalem to worship are called gods (<a onClick="return mV(\'1Ki\',12,28);">1Ki 12:28</a>; <a onClick="return mV(\'2Ch\',13,8);">2Ch 13:8</a>f).<P>See <a href="study/isbe/search.html?string=CALF,+GOLDEN">CALF, GOLDEN</a>.<P>(8) The gods of Damascus: Ben-hadad was accustomed to worship in the house of the god Rimmon (<a onClick="return mV(\'2Ki\',5,18);">2Ki 5:18</a>). No other names are mentioned, but from <a onClick="return mV(\'2Ch\',28,23);">2Ch 28:23</a> it is clear that there were many gods in Syria.<P>See <a href="study/isbe/search.html?string=RIMMON">RIMMON</a>.<P>(9) Solomon\'s many wives worshipped their own gods, and he provided the means for their worship. Chief among these were Chemosh of Moab and Molech of Ammon (<a onClick="return mV(\'1Ki\',11,2,4,8);">1Ki 11:2, 4, 8</a>).<P>See <a href="study/isbe/search.html?string=CHEMOSH">CHEMOSH</a>; <a href="study/isbe/search.html?string=MOLECH">MOLECH</a>.<P>(10) The mixed peoples transplanted into Samaria by Sargon had their various gods and mingled their service with that of Yahweh, after being taught by a priest of Yahweh. The names of some of these gods were <a href="study/isbe/search.html?string=SUCCOTH-BENOTH">SUCCOTH-BENOTH</A>, <a href="study/isbe/search.html?string=NERGAL">Nergal</a>, <a href="study/isbe/search.html?string=ASHIMA">Ashima</A>, <a href="study/isbe/search.html?string=NIBHAZ">Nibhaz</a>, <a href="study/isbe/search.html?string=TARTAK">Tartak</a>, <a href="study/isbe/search.html?string=ADRAMMELECH">Adrammelech (<a onClick="return mV(\'2Ki\',17,29,30,31,33);">2Ki 17:29-31, 33</a>). See separate articles.<P>(11) Of the gods of Seir, which were brought to Jerusalem by Amaziah, the names are not given (<a onClick="return mV(\'2Ch\',25,14);">2Ch 25:14</a>).<P>(12) The gods of the nations conquered by Sennacherib and his fathers, namely, Hamoth, <a href="study/isbe/search.html?string=ARPAD">Arpad</a>, <a href="study/isbe/search.html?string=SEPHARVAIM">Sepharvaim</a>, <a href="study/isbe/search.html?string=HENA">Hena</A>, <a href="study/isbe/search.html?string=IVVAH">Ivvah</A> (<a onClick="return mV(\'2Ki\',18,\'33-35\');">2Ki 18:33-35</a>; <a onClick="return mV(\'2Ki\',19,13);">19:13</a>). Also those conquered by Sennacherib\'s fathers, <a href="study/isbe/search.html?string=GOZAN">Gozan</A>, <a href="study/isbe/search.html?string=HARAN+(2)">Haran</a>, <a href="study/isbe/search.html?string=REZEPH">Rezeph</a>, Eden or <a href="study/isbe/search.html?string=TELASSAR">Telassar</a> (<a onClick="return mV(\'2Ki\',19,12);">2Ki 19:12</a>; <a onClick="return mV(\'Isa\',36,18,19,20);">Isa 36:18-20</a>; <a onClick="return mV(\'2Ch\',32,13);">2Ch 32:13</a>f).<P>(13) Gods of Moab are mentioned in <a onClick="return mV(\'Rth\',1,15);">Ru 1:15</a>; <a onClick="return mV(\'1Ki\',11,1,7);">1Ki 11:1, 7</a>. Possibly <a onClick="return mV(\'Rth\',1,15);">Ru 1:15</a> should be translated "god."<P>See <a href="study/isbe/search.html?string=CHEMOSH">CHEMOSH</a>.<P>(14) Gods of Babylon: The graven images of her gods referred to in <a onClick="return mV(\'Isa\',21,9);">Isa 21:9</a>; <a onClick="return mV(\'Isa\',42,17);">42:17</a>; <a href="study/isbe/search.html?string=BEL">Bel</a> and <a href="study/isbe/search.html?string=NEBO">Nebo</a> mentioned in <a onClick="return mV(\'Isa\',46,1);">Isa 46:1</a>; other gods of silver and gold (<a onClick="return mV(\'Ezr\',1,7);">Ezr 1:7</a>; <a onClick="return mV(\'Dan\',4,8,9,18);">Da 4:8-9, 18</a>; <a onClick="return mV(\'Dan\',5,4,11,14,23);">5:4, 11, 14, 23</a>).<P>(15) Nineveh\'s gods are merely referred to in <a onClick="return mV(\'Nah\',1,14);">Na 1:14</a>. Sennacherib was worshipping in the house of <a href="study/isbe/search.html?string=NISROCH">Nisroch</A> his god when slain by his sons (<a onClick="return mV(\'2Ki\',19,37);">2Ki 19:37</a>).<P>(16) The coastlands or borders and peninsulas of the Aegean Sea had numerous idol gods, shrines and devotees. Isaiah challenges them to prove that they are gods (<a onClick="return mV(\'Isa\',41,22);">Isa 41:22</a>f).<P>Yahweh was "greater than all gods" (<a onClick="return mV(\'Exd\',15,11);">Ex 15:11</a>; <a onClick="return mV(\'Exd\',18,11);">18:11</a>); "God of gods, and Lord of lords" (<a onClick="return mV(\'Deu\',10,14,17);">De 10:14, 17</a>); "The Mighty One" (<a onClick="return mV(\'Jos\',22,22);">Jos 22:22</a>); "to be feared above all gods" (<a onClick="return mV(\'1Ch\',16,25);">1Ch 16:25</a>; <a onClick="return mV(\'2Ch\',2,5);">2Ch 2:5</a>; <a onClick="return mV(\'Psa\',96,4);">Ps 96:4</a>f);<P>4. Superiority of Yahweh to Other Gods:<P>"King above all gods" (<a onClick="return mV(\'Psa\',95,3);">Ps 95:3</a>; <a onClick="return mV(\'Psa\',97,7,9);">97:7, 9</a>; <a onClick="return mV(\'Psa\',86,8);">86:8</a>; <a onClick="return mV(\'Psa\',135,5);">135:5</a>; <a onClick="return mV(\'Psa\',136,2);">136:2</a>; <a onClick="return mV(\'Psa\',138,1);">138:1</a>; <a onClick="return mV(\'Jer\',10,11);">Jer 10:11</a>; <a onClick="return mV(\'Zep\',2,11);">Ze 2:11</a>; <a onClick="return mV(\'Dan\',2,18,47);">Da 2:18, 47</a>). Jeremiah advances so far toward a pure and well-defined monotheism that he speaks of all other gods as "not gods." They have no existence to him (<a onClick="return mV(\'Jer\',2,11);">Jer 2:11</a>; <a onClick="return mV(\'Jer\',5,7);">5:7</a>; <a onClick="return mV(\'Jer\',16,20);">16:20</a>). A similar position is taken in <a onClick="return mV(\'Isa\',41,\'1-\');">Isa 41</a>; <a onClick="return mV(\'Isa\',43,\'1-\');">43</a>, etc.<P>5. Regulations Regarding the Gods of the Nations:<P>The laws of Moses give no uncertain sound concerning them. The Decalogue begins: "Thou shalt have no other gods before me." Whatever may be the exact meaning of this, it is perfectly clear that Israel was to have nothing to do with any God but Yahweh (<a onClick="return mV(\'Exd\',20,3);">Ex 20:3</a>; <a onClick="return mV(\'Deu\',5,7);">De 5:7</a>). No images shall be made of them (<a onClick="return mV(\'Exd\',20,4,23);">Ex 20:4, 23</a>; <a onClick="return mV(\'Exd\',34,17);">34:17</a>; <a onClick="return mV(\'Lev\',19,4);">Le 19:4</a>; <a onClick="return mV(\'Deu\',5,8);">De 5:8</a>f). No mention shall be made of them (<a onClick="return mV(\'Exd\',23,13);">Ex 23:13</a>; <a onClick="return mV(\'Jos\',23,7);">Jos 23:7</a>). They are not to be worshipped but destroyed (<a onClick="return mV(\'Exd\',23,24);">Ex 23:24</a>). They are to make no covenant with the people or their gods would be a snare to them (<a onClick="return mV(\'Exd\',23,32);">Ex 23:32</a>; <a onClick="return mV(\'Deu\',6,14);">De 6:14</a>; <a onClick="return mV(\'Deu\',7,4,25);">7:4, 25</a>). A curse will follow any defection from Yahweh to them (<a onClick="return mV(\'Deu\',11,28);">De 11:28</a>; <a onClick="return mV(\'Deu\',28,14);">28:14</a>ff; <a onClick="return mV(\'Deu\',12,3,10);">12:3,10</A>; <a onClick="return mV(\'Deu\',13,7);">13:7</A>; <a onClick="return mV(\'Deu\',20,18);">20:18</a>; <a onClick="return mV(\'Deu\',29,17);">29:17</a>). These gods are an abomination to Yahweh (<a onClick="return mV(\'Deu\',12,31);">De 12:31</a>; <a onClick="return mV(\'Deu\',20,18);">20:18</a>; <a onClick="return mV(\'Deu\',29,17);">29:17</a>; <a onClick="return mV(\'Deu\',32,37);">32:37</a>; <a onClick="return mV(\'Eze\',7,20);">Eze 7:20</a>; <a onClick="return mV(\'1Ki\',11,5);">1Ki 11:5</a>; <a onClick="return mV(\'2Ki\',23,13);">2Ki 23:13</a>). They are to be as foreign gods to Israel (<a onClick="return mV(\'1Sa\',7,3);">1Sa 7:3</a>f; <a onClick="return mV(\'Jos\',24,20,23);">Jos 24:20, 23</a>; <a onClick="return mV(\'Jdg\',10,16);">Jud 10:16</a>; <a onClick="return mV(\'2Ch\',14,3);">2Ch 14:3</a>; <a onClick="return mV(\'2Ch\',33,15);">33:15</a>).<P>6. Israel\'s Tendency to Idolatry:<P>The constant tendency of Israel to go after other gods was first made manifest at Sinai (<a onClick="return mV(\'Exd\',32,1,4,8,23,31);">Ex 32:1, 4, 8, 23, 31</a>; <a onClick="return mV(\'Exd\',34,15);">34:15</a>). Hosea says (<a onClick="return mV(\'Hsa\',11,12);">11:2</a>), "The more the prophets called them, the more they went from them." Ezekiel declares (<a onClick="return mV(\'Eze\',16,3);">16:3</A>), "The Amorite was thy father, and thy mother was a Hittite," referring doubtless to the idolatrous taint in the blood of Israel. The tendency manifested itself also at Baal-peor where Israel was led into the licentious rites of the Moabites (<a onClick="return mV(\'Num\',25,2);">Nu 25:2</a>f). Moses saw the taint in the blood, foresaw the danger and repeatedly warned them (<a onClick="return mV(\'Deu\',17,3);">De 17:3</a>; <a onClick="return mV(\'Deu\',18,20);">18:20</a>; <a onClick="return mV(\'Deu\',29,26);">29:26</a>; <a onClick="return mV(\'Deu\',30,17);">30:17</a>; <a onClick="return mV(\'Deu\',31,18);">31:18</a>). Perhaps th
