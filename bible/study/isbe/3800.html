e most striking passages in Deuteronomy are chapters <a onClick="return mV(\'Deu\',13,\'1-\');">13</A>; <a onClick="return mV(\'Deu\',28,\'1-\');">28</a>; <a onClick="return mV(\'Deu\',30,\'1-\');">30</a>, where are pictured the consequences of going after other gods. Joshua also warns them (<a onClick="return mV(\'Jos\',23,7);">23:7</a>), and the history of the period of the Judges is the story of their periodical defection from Yahweh and the punishment resulting therefrom (<a onClick="return mV(\'Jdg\',2,12,17,19);">Jud 2:12, 17, 19</a>; <a onClick="return mV(\'Jdg\',5,8);">5:8</a>; <a onClick="return mV(\'Jdg\',10,6);">10:6</a>f; <a onClick="return mV(\'1Sa\',8,8);">1Sa 8:8</a>). Solomon himself gave an impetus in that direction (<a onClick="return mV(\'1Ki\',11,\'5-8\');">1Ki 11:5-8</a>). After the disruption, the religion of the Northern Kingdom became very corrupt (<a onClick="return mV(\'1Ki\',14,9);">1Ki 14:9</a>; <a onClick="return mV(\'2Ch\',13,8);">2Ch 13:8</a>f). The golden calves of Jeroboam opened the door for an inrush of idols and other gods. Ahab\'s marriage to Jezebel threatened to wipe out Yahweh-worship and substitute Baal-worship, and, but for the powerful ministry of Elijah and Elisha, might have effected such a result. Partly checked for a time, the evil broke out in other forms, and even the preaching of Amos and Hosea failed to turn the tide of idolatry. The result was the destruction of the kingdom (<a onClick="return mV(\'2Ki\',17,7);">2Ki 17:7</a>ff; <a onClick="return mV(\'Jer\',3,\'6-8\');">Jer 3:6-8</a>; <a onClick="return mV(\'1Ch\',5,25);">1Ch 5:25</a>). The Southern Kingdom fared better. Other gods were countenanced by Rehoboam, Abijah, Athaliah, Jehoram, Ahaz, Amon, Manasseh, Jehoiakim, etc. Reform movements were attempted by Asa, Jehoshaphat, Hezekiah and Josiah, but did not wholly avail. In the reign of Manasseh the nation plunged into the worship of other gods. The ministries of Isaiah, Jeremiah, etc., availed not to stop the tide (<a onClick="return mV(\'2Ch\',34,25);">2Ch 34:25</a>; <a onClick="return mV(\'Jer\',11,13);">Jer 11:13</a>; <a onClick="return mV(\'Jer\',5,19);">5:19</a>; <a onClick="return mV(\'2Ki\',22,17);">2Ki 22:17</a>; <a onClick="return mV(\'Jer\',1,16);">Jer 1:16</a>; <a onClick="return mV(\'Jer\',19,4);">19:4</a>; <a onClick="return mV(\'Jer\',7,6);">7:6</a>; <a onClick="return mV(\'Jer\',13,10);">13:10</a>; <a onClick="return mV(\'Jer\',16,11);">16:11</a>; <a onClick="return mV(\'Jer\',44,5,8);">44:5, 8</a>). The nation was carried into exile because of its going after other gods (<a onClick="return mV(\'2Ki\',22,17);">2Ki 22:17</a>; <a onClick="return mV(\'Deu\',29,25);">De 29:25</a>f). The captivity had its desired effect. The Israel that returned and perpetuated the nation never again lapsed into the worship of other gods.<P>II. In the Apocrypha.<P>The Apocrypha reiterates much of the Old Testament teaching: the defection of Israel (2Esdras 1:6); the gods of the nations (Judith 3:8; 8:18); the gods which their fathers worshipped (Judith 5:7f); the sin of Israel (<span class="noTag">Additions to Esther 14:7</span>). The Book of The Wisdom of Solomon refers to the "creatures which they supposed to be gods" (<span class="noTag">12:27; 13:2,3,10; 15:15</span>). Mention is made of the gods of Babylon (Baruch 1:22; 6:6-57 passim; Bel and the Dragon 1:27).<P>III. In the New Testament.<P>The expression "gods" occurs in six places in the New Testament:<P>(1) Jesus, in reply to the Pharisees, who questioned His right to call Himself the son of God, quoted <a onClick="return mV(\'Psa\',82,6);">Ps 82:6</a>: "I said, Ye are gods." He argues from this that if God Himself called them gods to whom the word of God came, i.e. the judges who acted as representatives of God in a judicial capacity, could not He who had been sanctified and sent into the world justly call Himself the Son of God? It was an argumentum ad hominem (<a onClick="return mV(\'Jhn\',10,\'34-37\');">Joh 10:34-37</a>).<P>(2) When Paul and Barnabas preached the gospel in Lystra they healed a certain man who had been a cripple from birth. The Lycaonians, seeing the miracle, cried out in their own dialect, "The gods are come down to us in the likeness of men. And they called Barnabas, Jupiter; and Paul, Mercury" (<a onClick="return mV(\'Act\',14,11);">Ac 14:11</a>f). Their ascription of deity to the apostles in such times shows their familiarity with the Greek pantheon.<P>(3) As Paul preached Jesus and the resurrection at Athens the people said he seemed to be a setter forth of strange gods. The conception of only one God seemed to be wholly foreign to them (<a onClick="return mV(\'Act\',17,18);">Ac 17:18</a>).<P>(4) In <a onClick="return mV(\'1Cr\',8,5);">1Co 8:5</a> Paul speaks of "gods many, and lords many," but the context shows that he did not believe in the existence of any god but one; "We know that no idol is anything in the world."<P>(5) While at Ephesus, Paul was said to have "persuaded and turned away much people, saying that they are no gods, that are made with hands" (<a onClick="return mV(\'Act\',19,26);">Ac 19:26</a>).<P>(6) The Galatians had been "in bondage to them that by nature are no gods" (<a onClick="return mV(\'Gal\',4,8);">Ga 4:8</a>). Indirect references are also found in <a onClick="return mV(\'Act\',17,16);">Ac 17:16</a>, where Paul observed the city full of idols. Likewise in <a onClick="return mV(\'Rom\',1,22);">Ro 1:22</a>f; <a onClick="return mV(\'Rom\',1,25);">25</a>ff. Paul refers to the numerous gods of the heathen world. These were idols, birds, four-footed beasts and creeping things. The results of this degrading worship are shown in the verse following.`<a href="./study/isbe/search.html?string=IDOLATRY">IDOLATRY</a>; <a href="./study/isbe/search.html?string=GOD+NAMES+OF">GOD, NAMES OF</a>`146';
isbe[3865]='Godspeed`god\'-sped (chairo): "Godspeed" occurs only in <a onClick="return mV(\'2Jo\',1,10,11);">2Joh 1:10-11</a> the King James Version as the translation of chairein, the infin. of chairo, and is rendered in the Revised Version (British and American) "greeting." It means "rejoice," "be of good cheer," "be it well with thee"; chaire, chairete, chairein, were common forms of greeting, expressive of good-will and desire for the person\'s prosperity, translated in the Gospels, "Hail!" "All Hail!" (<a onClick="return mV(\'Mat\',26,49);">Mt 26:49</a>; <a onClick="return mV(\'Mat\',27,29);">27:29</a>; <a onClick="return mV(\'Mat\',28,9);">28:9</a>, etc.); chairein is the Septuagint for shalom (<a onClick="return mV(\'Isa\',48,22);">Isa 48:22</a>; <a onClick="return mV(\'Isa\',57,21);">57:21</a>; compare 2Macc 1:10). "Godspeed" first appears in Tyndale\'s version; Wycliffe had "heil!" Rheims "God save you."<P>In the passage cited Christians are forbidden thus to salute false teachers who might come to them. The injunction does not imply any breach of charity, since it would not be right to wish anyone success in advocating what was believed to be false and harmful. We should be sincere in our greetings; formal courtesy must yield to truth, still courteously, however, and in the spirit of love.``185';
isbe[3866]='Goel`go\'-el (go\'el, "redeemer"): Goel is the participle of the Hebrew word gal\'al ("to deliver," "to redeem") which aside from its common usage is frequently employed in connection with Hebrew law, where it is the technical term applied to a person who as the nearest relative of another is placed under certain obligations to him.<P>(1) If a Jew because of poverty had been obliged to sell himself to a wealthy "stranger or sojourner," it became the duty of his relatives to redeem him. Compare <a onClick="return mV(\'Lev\',25,47);">Le 25:47</a>ff and the article <a href="study/isbe/search.html?string=JUBILEE">JUBILEE</a>.<P>(2) The same duty fell upon the nearest kinsman, if his brother, being poor, had been forced to sell some of his property. Compare <a onClick="return mV(\'Lev\',25,23);">Le 25:23</a>ff; <a onClick="return mV(\'Rth\',4,4);">Ru 4:4</a>ff, and the article <a href="study/isbe/search.html?string=JUBILEE">JUBILEE</a>.<P>(3) It also devolved upon the nearest relative to marry the childless widow of his brother (<a onClick="return mV(\'Rth\',3,13);">Ru 3:13</a>; Tobit 3:17).<P>(4) In <a onClick="return mV(\'Num\',5,5);">Nu 5:5</a>ff a law is stated which demands that restitution be made to the nearest relative, and after him to the priest, if the injured party has died (<a onClick="return mV(\'Lev\',6,1);">Le 6:1</a>).<P>(5) The law of blood-revenge (Blut-Rache) made it the sacred duty of the nearest relative to avenge the blood of his kinsman. He was called the go\'el ha-dam, "the avenger of blood." This law was based upon the command given in <a onClick="return mV(\'Gen\',9,5);">Ge 9:5</a> f: "Whoso sheddeth man\'s blood, by man shall his blood be shed," and was carried out even if an animal had killed a man; in this case, however, the payment of a ransom was permitted (<a onClick="return mV(\'Exd\',21,28);">Ex 21:28</a>). A clear distinction was made between an accidental and a deliberate murder. In both cases the murderer could find refuge at the altar of the sanctuary; if, however, the investigation revealed presumptuous manslaughter, he was taken from the altar to be put to death (<a onClick="return mV(\'Exd\',21,12);">Ex 21:12</a>ff; <a onClick="return mV(\'1Ki\',1,50);">1Ki 1:50</a>; <a onClick="return mV(\'1Ki\',2,28);">2:28</a>). In <a onClick="return mV(\'Num\',35,9);">Nu 35:9</a>ff definite regulations as to the duties of the Goel are given. Six cities were to be appointed as "cities of refuge," three on each side of the Jordan. The congregation has judgment over the murderer. There must be more than one witness to convict a man. If he is found guilty, he is delivered to the Goel; if murder was committed by accident he is permitted to live within the border of the city of refuge; in case the manslayer leaves this city before the death of the high priest, the avenger of blood has a right to slay him. After the death of the high priest the murderer may return to his own city. Ransom cannot be given for the life of a murderer; no expiation can be made for a murder but by the blood of the murderer (<a onClick="return mV(\'Deu\',19,4);">De 19:4</a>ff; <a onClick="return mV(\'Jos\',20,\'1-\');">Jos 20</a>; <a onClick="return mV(\'2Sa\',14,6);">2Sa 14:6</a>). According to the law the children of a murderer could not be held responsible for the crime of their father (<a onClick="return mV(\'Deu\',24,16);">De 24:16</a>; <a onClick="return mV(\'2Ki\',14,6);">2Ki 14:6</a>), but see <a onClick="return mV(\'2Sa\',21,1);">2Sa 21:1</a>ff. The order in which the nearest relative was considered the Goel is given in <a onClick="return mV(\'Lev\',25,48);">Le 25:48</a> f: first a brother, then an uncle or an uncle\'s son, and after them any other near relative. This order was observed in connection with (1) above, but probably also in the other cases except (4).<P>For the figurative use of Goel ("redeemer") see <a onClick="return mV(\'Psa\',119,154);">Ps 119:154</a>; <a onClick="return mV(\'Pro\',23,11);">Pr 23:11</a>; <a onClick="return mV(\'Job\',19,25);">Job 19:25</a>; <a onClick="return mV(\'Isa\',41,14);">Isa 41:14</a>.`<a href="./study/isbe/search.html?string=AVENGE">AVENGE</a>; <a href="./study/isbe/search.html?string=MURDER">MURDER</a>; <a href="./study/isbe/search.html?string=REFUGE,+CITIES+OF">REFUGE, CITIES OF</a>`16';
isbe[3867]='Gog`gog (gogh; Goug):<P>(1) A son of Joel, and descendant of the tribe of Reuben (<a onClick="return mV(\'1Ch\',5,4);">1Ch 5:4</a>).<P>(2) The prince of Rosh, Meshech and Tubal (<a onClick="return mV(\'Eze\',38,2);">Eze 38:2</a>f; <a onClick="return mV(\'Eze\',39,\'1-16\');">39:1-16</A>). His territory was known as the land of Magog, and he was the chief of those northern hordes who were to make a final onslaught upon Israel while enjoying the blessings of the Messianic age. He has been identified with Gagi, ruler of Sakhi, mentioned by Ashurbanipal, but Professor Sayce thinks the Hebrew name corresponds more closely to Gyges, the Lydian king, the Gugu of the cuneiform inscriptions. According to Ezekiel\'s account Gog\'s army included in its numbers Persia, Cush, Put, Gomer or the Cimmerians, and Togarmah, from the extreme north. They are represented as a vast mixed horde from the far-off parts of the north, the limits of the horizon, completely armed and equipped for war. They were to come upon the mountains of Israel and cover the land like a cloud. Their purpose is plunder, for the people of Israel are rich and dwell in towns and villages without walls. His coming, which had been prophesied by the seers of Israel, shall be accompanied by a theophany and great convulsions in Nature. A panic shall seize the hosts of Gog, rain, hailstones, pestilence, fire and brimstone shall consume them. Their bodies shall be food for the birds, their weapons shall serve as firewood for seven years and their bones shall be buried east of the Jordan in Hamon-gog and thus not defile the holy land. The fulfillment of this strange prophecy can never be literal. In general it seems to refer to the last and desperate attempts of a dying heathenism to overturn the true religion of Yahweh, or make capital out of it, profiting by its great advantages.<P>(3) In <a onClick="return mV(\'Rev\',20,7);">Re 20:7</a> Satan is let loose and goes to the four corners of the earth, Gog and Magog, to muster his hosts for the final struggle against God. In Ezekiel the invasion of Gog occurs during the Messianic age, while in Revelation it occurs just at the close of the millennium. In Ezekiel, Gog and Magog are gathered by Yahweh for their destruction; in Revelation they are gathered by Satan. In both cases the number is vast, the destruction is by supernatural means, and is complete and final.`<a href="./study/isbe/search.html?string=MAGOG">MAGOG</a>`146';
isbe[3868]='Goiim`goi\'-yim (goyim): This word, rendered in the King James Version "nations," "heathen," "Gentiles," is commonly translated simply "nations" in the Revised Version (British and American). In <a onClick="return mV(\'Gen\',14,1);">Ge 14:1</a> where the King James Version has "Tidal, king of nations," the Revised Version (British and American) retains in the text the Hebrew "Goiim" as a proper name. Some identify with Gutium. The Hebrew word is similarly retained in <a onClick="return mV(\'Jos\',12,23);">Jos 12:23</a>.``1';
isbe[3869]='Going; Goings`go\'-ing, go\'-ingz: Besides, occasionally, forms of the common words for "go" (see Go), for "going" and "goings," the Hebrew has \'ashshur (\'ashur, \'ashur), "step," motsa\', totsa\'oth, "goings out," "outgoings." The word "goings" is sometimes used literally, as in <a onClick="return mV(\'Num\',33,2);">Nu 33:2</a>, "Moses wrote their goings out" (Hebrew motsa\')." Going up," ma\'aleh, is in many passages rendered in the Revised Version (British and American) (as in <a onClick="return mV(\'Num\',34,4);">Nu 34:4</a>; <a onClick="return mV(\'2Sa\',15,30);">2Sa 15:30</a> the King James Version) "ascent," as e.g. <a onClick="return mV(\'Jos\',15,7);">Jos 15:7</a>; <a onClick="return mV(\'Jdg\',1,36);">Jud 1:36</a>; <a onClick="return mV(\'Neh\',12,37);">Ne 12:37</a> (the American Standard Revised Version only). In <a onClick="return mV(\'Eze\',44,5);">Eze 44:5</a>, the American Standard Revised Version substitutes "egress" (way out or place of exit) for "going forth." "The goings out (place of exit; hence, boundary) of it" (<a onClick="return mV(\'Num\',34,4,5,9,12);">Nu 34:4-5, 9, 12</a> the King James Version) occurs frequently. The verbal forms bo\', mabho\', also me\'al (<a onClick="return mV(\'Dan\',6,14);">Dan 6:14</a>), are used of the sunset, "the going down of the sun." Thus <a onClick="return mV(\'Jos\',8,29);">Jos 8:29</a> the Revised Version (British and American), the King James Version "as soon as the sun was down."<P>In the New Testament, the Revised Version (British and American) substitutes "going out" for "gone out" (sbennumi) (<a onClick="return mV(\'Mat\',25,8);">Mt 25:8</a>); "going up" for "ascending" (<a onClick="return mV(\'Luk\',19,28);">Lu 19:28</a>); "going in" for "coming in" (<a onClick="return mV(\'Act\',9,28);">Ac 9:28</a>); "going about" for "wandering" (<a onClick="return mV(\'1Ti\',5,13);">1Ti 5:13</a>); "seeking" for "going about" (<a onClick="return mV(\'Rom\',10,3);">Ro 10:3</a>).<P>Metaphorically: "Goings" is used for a man\'s ways or conduct (<a onClick="return mV(\'Psa\',17,5);">Ps 17:5</a>, the Revised Version (British and American) "steps"; <a onClick="return mV(\'Psa\',40,2);">Ps 40:2</a>; <a onClick="return mV(\'Pro\',14,15);">Pr 14:15</a>, etc.). In <a onClick="return mV(\'Psa\',17,5);">Ps 17:5</a> "Hold up my goings in thy paths, that my footsteps slip not" becomes in the Revised Version (British and American) "My steps have held fast to thy paths, my feet have not slipped"; <a onClick="return mV(\'Pro\',5,21);">Pr 5:21</a>, "He pondereth all his goings," is in the Revised Version (British and American) "He maketh level all his paths," in "weigheth carefully"; conversely, in <a onClick="return mV(\'Psa\',37,23);">Ps 37:23</a>, the Revised Version (British and American) has "goings" for "steps"; in <a onClick="return mV(\'Jam\',1,11);">Jas 1:11</a> "goings" for "ways." In the important prophetic passage, <a onClick="return mV(\'Mic\',5,2);">Mic 5:2</a>, it is said of the Ruler from Bethlehem, "whose goings forth have been from of old, from everlasting," the Revised Version (British and American) "are from of old, from everlasting," margin "from ancient days." Of God it is said in <a onClick="return mV(\'Hab\',3,6);">Hab 3:6</a> "His ways are everlasting," the Revised Version (British and American) "His goings were as of old," margin "His ways are everlasting."``185';
isbe[3870]='Golan; Gaulonitis`go\'-lan (golan), (Gaulanitis): Golan was a city in the territory allotted to Manasseh in Bashan, the most northerly of the three cities of refuge east of the Jordan (<a onClick="return mV(\'Deu\',4,43);">De 4:43</a>; <a onClick="return mV(\'Jos\',20,8);">Jos 20:8</a>); assigned with its "suburbs" to the Gershonite Levites (<a onClick="return mV(\'Jos\',21,27);">Jos 21:27</a>; <a onClick="return mV(\'1Ch\',6,71);">1Ch 6:71</a>). It must have been a great and important city in its day; but the site cannot now be determined with any certainty. It was known to Josephus (Ant., XIII, xv, 3). Near Golan Alexander was ambushed by Obodas, king of the Arabians; and his army, crowded together in a narrow and deep valley, was broken in pieces by the multitude of camels (BJ, I, iv, 4). This incident is located at Gadara in Ant, XIII, xiii, 5. Later, Golan was destroyed by Alexander. It had already given its name to a large district, Gaulonitis (BJ, III, iii,1,5; IV, i, 1). It formed the eastern boundary of Galilee. It was part of the tetrarchy of Philip (Ant., XVII, viii, 1; XVIII, iv, 6). The city was known to Eusebius as "a large village," giving its name to the surrounding country (Onomasticon, under the word Gaulon). This country must have corresponded roughly with the modern Jaulan, in which the ancient name is preserved. The boundaries of the province today are Mt. Hermon on the north, Jordan and the Sea of Galilee on the west, Wady Yarmuk on the south, and Nahr \'Allan on the east. This plateau, which in the north is about 3,000 ft. high, slopes gradually southward to a height of about 1,000 ft. It is entirely volcanic, and there are many cone-like peaks of extinct volcanoes, especially toward the north It affords good pasturage, and has long been a favorite summer grazing-ground of the nomads. Traces of ancient forests remain, but for the most part today it is treeless. To the east of the Sea of Galilee the soil is deep and rich. Splendid crops of wheat are grown here, and olives flourish in the hollows. The country is furrowed by deep valleys that carry the water southwestward into the Sea of Galilee. This region has not yet been subjected to thorough examination, but many important ruins have been found, which tell of a plentiful and prosperous population in times long past. The best description of these, and of the region generally, will be found in Schumacher\'s The Jaulan, and Across the Jordan. To him also we owe the excellent maps which carry us eastward to the province of el-Chauran.<P>Schumacher inclines to the belief that the ancient Golan may be represented by Sahm el-Jaulan, a large village fully 4 miles east of Nahr \'Allan, and 4 miles southeast of Tsil. The extensive ruins probably date from early in the Christian era. The buildings are of stone, many of them of Spacious dimensions, while the streets are wide and straight. The inhabitants number not more than 280. The surrounding soil is rich and well watered, bearing excellent crops. The present writer, after personal examination, corroborates Dr. Schumacher\'s description. Standing in the open country, it would be seen from afar; and it was easily accessible from all directions.``54';
isbe[3871]='Gold`gold (zahabh; chrusos):<P>1. Terms:<P>No metal has been more frequently mentioned in Old Testament writings than gold, and none has had more terms applied to it. Among these terms the one most used is zahabh. The Arabic equivalent, dhahab, is still the common name for gold throughout Palestine, Syria and Egypt. With zahabh frequently occur other words which, translated, mean "pure" (<a onClick="return mV(\'Exd\',25,11);">Ex 25:11</a>), "refined" (<a onClick="return mV(\'1Ch\',28,18);">1Ch 28:18</a>), "finest" (<a onClick="return mV(\'1Ki\',10,18);">1Ki 10:18</a>), "beaten" (<a onClick="return mV(\'1Ki\',10,17);">1Ki 10:17</a>), "Ophir" (<a onClick="return mV(\'Psa\',45,9);">Ps 45:9</a>).<P>Other terms occurring are: paz, "fine gold" (<a onClick="return mV(\'Job\',28,17);">Job 28:17</a>; <a onClick="return mV(\'Psa\',19,10);">Ps 19:10</a>; <a onClick="return mV(\'Psa\',21,3);">21:3</a>; <a onClick="return mV(\'Psa\',119,127);">119:127</a>; <a onClick="return mV(\'Pro\',8,19);">Pr 8:19</a>; <a onClick="return mV(\'Sgs\',5,11,15);">So 5:11,15</a>; <a onClick="return mV(\'Isa\',13,12);">Isa 13:12</a>; <a onClick="return mV(\'Lam\',4,2);">La 4:2</a>); charuts (<a onClick="return mV(\'Psa\',68,13);">Ps 68:13</a>; <a onClick="return mV(\'Pro\',3,14);">Pr 3:14</a>; <a onClick="return mV(\'Pro\',8,10,19);">8:10, 19</a>; <a onClick="return mV(\'Pro\',16,16);">16:16</a>; <a onClick="return mV(\'Zec\',9,3);">Zec 9:3</a>); kethem, literally, "carved out" (<a onClick="return mV(\'Job\',28,16,19);">Job 28:16, 19</a>; <a onClick="return mV(\'Job\',31,24);">31:24</a>; <a onClick="return mV(\'Pro\',25,12);">Pr 25:12</a>; <a onClick="return mV(\'Lam\',4,1);">La 4:1</a>; <a onClick="return mV(\'Dan\',10,5);">Da 10:5</a>); ceghor (<a onClick="return mV(\'1Ki\',6,20);">1Ki 6:20</a>; <a onClick="return mV(\'1Ki\',7,50);">7:50</a>; <a onClick="return mV(\'Job\',28,15);">Job 28:15</a>); betser (in the King James Version only: <a onClick="return mV(\'Job\',22,24);">Job 22:24</a>; the Revised Version (British and American) "treasure").<P>2. Sources:<P>Sources definitely mentioned in the Old Testament are: Havilah (<a onClick="return mV(\'Gen\',2,11,12);">Ge 2:11-12</a>); Ophir (<a onClick="return mV(\'1Ki\',9,28);">1Ki 9:28</a>; <a onClick="return mV(\'1Ki\',10,11);">10:11</a>; <a onClick="return mV(\'1Ki\',22,48);">22:48</a>; <a onClick="return mV(\'1Ch\',29,4);">1Ch 29:4</a>; <a onClick="return mV(\'2Ch\',8,18);">2Ch 8:18</a>; <a onClick="return mV(\'2Ch\',9,10);">9:10</a>; <a onClick="return mV(\'Job\',22,24);">Job 22:24</a>; <a onClick="return mV(\'Job\',28,16);">28:16</a>; <a onClick="return mV(\'Psa\',45,9);">Ps 45:9</a>; <a onClick="return mV(\'Isa\',13,12);">Isa 13:12</a>); Sheba (<a onClick="return mV(\'1Ki\',10,2,10);">1Ki 10:2-10</a>; <a onClick="return mV(\'2Ch\',9,1,9);">2Ch 9:1, 9</a>; <a onClick="return mV(\'Psa\',72,15);">Ps 72:15</a>; <a onClick="return mV(\'Isa\',60,6);">Isa 60:6</a>; <a onClick="return mV(\'Eze\',27,22);">Eze 27:22</a>; <a onClick="return mV(\'Eze\',38,13);">38:13</a>); Arabia (<a onClick="return mV(\'2Ch\',9,14);">2Ch 9:14</a>). We are not justified in locating any of these places too definitely. They probably all refer to some region of Arabia.<P>The late origin of the geological formation of Palestine and Syria precludes the possibility of gold being found in any quantities (see <a href="study/isbe/search.html?string=METALS">METALS</a>), so that the large quantities of gold used by the children of Israel in constructing their holy places was not the product of mines in the country, but was from the spoil taken from the inhabitants of the land (<a onClick="return mV(\'Num\',31,52);">Nu 31:52</a>), or brought with them from Egypt (<a onClick="return mV(\'Exd\',3,22);">Ex 3:22</a>). This gold was probably mined in Egypt or India (possibly Arabia), and brought by the great caravan routes through Arabia to Syria, or by sea in the ships of Tyre (<a onClick="return mV(\'1Ki\',10,11,22);">1Ki 10:11, 22</a>; <a onClick="return mV(\'Eze\',27,21,22);">Eze 27:21-22</a>). There is no doubt about the Egyptian sources. The old workings in the gold-bearing veins of the Egyptian desert and the ruins of the buildings connected with the mining and refining of the precious metal still remain. This region is being reopened with the prospect of its becoming a source of part of the world\'s supply. It might be inferred from the extensive spoils in gold taken from the Midianites (£100,000 HDB, under the word) that their country (Northwestern Arabia) produced gold. It is more likely that the Midianites had, in turn, captured most of it from other weaker nations. The tradition that Northwestern Arabia is rich in gold still persists. Every year Moslem pilgrims, returning from Mecca by the Damascus route, bring with them specimens of what is supposed to be gold ore. They secure it from the Arabs at the stopping-places along the route. Samples analyzed by the writer have been iron pyrites only. No gold-bearing rock has yet appeared. Whether these specimens come from the mines mentioned by Burton (The Land of Midian Revisited) is a question.<P>3. Forms:<P>Gold formed a part of every household treasure (<a onClick="return mV(\'Gen\',13,2);">Ge 13:2</a>; <a onClick="return mV(\'Gen\',24,35);">24:35</a>; <a onClick="return mV(\'Deu\',8,13);">De 8:13</a>; <a onClick="return mV(\'Deu\',17,17);">17:17</a>; <a onClick="return mV(\'Jos\',22,8);">Jos 22:8</a>; <a onClick="return mV(\'Eze\',28,4);">Eze 28:4</a>). It was probably treasured (a) in the form of nuggets (<a onClick="return mV(\'Job\',28,6);">Job 28:6</a> the Revised Version, margin), (b) in regularly or irregularly shaped slabs or bars (<a onClick="return mV(\'Num\',7,14,20,84,86);">Nu 7:14, 20, 84, 86</a>; <a onClick="return mV(\'Jos\',7,21,24);">Jos 7:21, 24</a>; <a onClick="return mV(\'2Ki\',5,5);">2Ki 5:5</a>), and (c) in the form of dust (<a onClick="return mV(\'Job\',28,6);">Job 28:6</a>). A specimen of yellow dust, which the owner claimed to have taken from an ancient jar, unearthed in the vicinity of the Hauran, was once brought to the writer\'s laboratory. On examination it was found to contain iron pyrites and metallic gold in finely divided state. It was probably part of an ancient household treasure. A common practice was to make gold into jewelry with the dual purpose of ornamentation and of treasuring it. This custom still prevails, especially among the Moslems, who do not let out their money at interest. A poor woman will save her small coins until she has enough to buy a gold bracelet. This she will wear or put away against the day of need (compare <a onClick="return mV(\'Gen\',24,22,53);">Ge 24:22, 53</a>). It was weight and not beauty which was noted in the jewels (<a onClick="return mV(\'Exd\',3,22);">Ex 3:22</a>; <a onClick="return mV(\'Exd\',11,2);">11:2</a>; <a onClick="return mV(\'Exd\',12,35);">12:35</a>). Gold coinage was unknown in the early Old Testament times.<P>4. Uses:<P>(1) The use of gold as the most convenient way of treasuring wealth is mentioned above.<P>(2) Jewelry took many forms: armlets (<a onClick="return mV(\'Num\',31,50);">Nu 31:50</a>), bracelets (<a onClick="return mV(\'Gen\',24,22);">Ge 24:22</a>), chains (<a onClick="return mV(\'Gen\',41,42);">Ge 41:42</a>), crescents (<a onClick="return mV(\'Jdg\',8,26);">Jud 8:26</a>), crowns (<a onClick="return mV(\'2Sa\',12,30);">2Sa 12:30</a>; <a onClick="return mV(\'1Ch\',20,2);">1Ch 20:2</a>), earrings (<a onClick="return mV(\'Exd\',32,2,3);">Ex 32:2-3</a>; <a onClick="return mV(\'Num\',31,50);">Nu 31:50</a>; <a onClick="return mV(\'Jdg\',8,24,26);">Jud 8:24, 26</a>), rings (<a onClick="return mV(\'Gen\',24,22);">Ge 24:22</a>; <a onClick="return mV(\'Gen\',41,42);">41:42</a>; <a onClick="return mV(\'Jam\',2,2);">Jas 2:2</a>).<P>(3) Making and decorating objects in connection with places of worship: In the description of the building of the ark and the tabernacle in <a onClick="return mV(\'Exd\',25,\'1-\');">Ex 25</a>ff, we read of the lavish use of gold in overlaying wood and metals, and in shaping candlesticks, dishes, spoons, flagons, bowls, snuffers, curtain clasps, hooks, etc. (one estimate of the value of gold used is £90,000; see HDB). In <a onClick="return mV(\'1Ki\',6,\'1-\');">1Ki 6</a>ff; <a onClick="return mV(\'1Ch\',28,\'1-\');">1Ch 28</a>f; <a onClick="return mV(\'2Ch\',1,\'1-\');">2Ch 1</a>ff are records of still more extensive use of gold in building the temple.<P>(4) Idols were made of gold (<a onClick="return mV(\'Exd\',20,23);">Ex 20:23</a>; <a onClick="return mV(\'Exd\',32,4);">32:4</a>; <a onClick="return mV(\'Deu\',7,25);">De 7:25</a>; <a onClick="return mV(\'Deu\',29,17);">29:17</a>; <a onClick="return mV(\'1Ki\',12,28);">1Ki 12:28</a>; <a onClick="return mV(\'Psa\',115,4);">Ps 115:4</a>; <a onClick="return mV(\'Psa\',135,15);">135:15</a>; <a onClick="return mV(\'Isa\',30,22);">Isa 30:22</a>; <a onClick="return mV(\'Rev\',9,20);">Re 9:20</a>).<P>(5) Gold was used for lavish display. Among the fabulous luxuries of Solomon\'s court were his gold drinking-vessels (<a onClick="return mV(\'1Ki\',10,21);">1Ki 10:21</a>), a throne of ivory overlaid with gold (<a onClick="return mV(\'1Ki\',10,18);">1Ki 10:18</a>), and golden chariot trimmings (<a onClick="return mV(\'1Ch\',28,18);">1Ch 28:18</a>). Sacred treasure saved from votive offerings or portions dedicated from booty were principally gold (<a onClick="return mV(\'Exd\',25,36);">Ex 25:36</a>; <a onClick="return mV(\'Num\',7,14,20,84,86);">Nu 7:14, 20, 84, 86</a>; <a onClick="return mV(\'Num\',31,50,52,54);">31:50, 52, 54</a>; <a onClick="return mV(\'Jos\',6,19,24);">Jos 6:19, 24</a>; <a onClick="return mV(\'1Sa\',6,8,11,15);">1Sa 6:8, 11, 15</a>; <a onClick="return mV(\'2Sa\',8,11);">2Sa 8:11</a>; <a onClick="return mV(\'1Ch\',18,7,10,11);">1Ch 18:7, 10-11</a>; <a onClick="return mV(\'1Ch\',22,14,16);">22:14, 16</a>; <a onClick="return mV(\'Mat\',23,17);">Mt 23:17</a>). This treasure was the spoil most sought after by the enemy. It was paid to them as tribute (<a onClick="return mV(\'1Ki\',15,15);">1Ki 15:15</a>; <a onClick="return mV(\'2Ki\',12,18);">2Ki 12:18</a>; <a onClick="return mV(\'2Ki\',14,14);">14:14</a>; <a onClick="return mV(\'2Ki\',16,8);">16:8</a>; <a onClick="return mV(\'2Ki\',18,\'14-16\');">18:14-16</a>; <a onClick="return mV(\'2Ki\',23,33,35);">23:33, 35</a>), or taken as plunder (<a onClick="return mV(\'2Ki\',24,13);">2Ki 24:13</a>; <a onClick="return mV(\'2Ki\',25,15,35);">25:35</a>).<P>5. Figurative:<P>Gold is used to symbolize earthly riches (<a onClick="return mV(\'Job\',3,15);">Job 3:15</a>; <a onClick="return mV(\'Job\',22,24);">22:24</a>; <a onClick="return mV(\'Isa\',2,7);">Isa 2:7</a>; <a onClick="return mV(\'Mat\',10,9);">Mt 10:9</a>; <a onClick="return mV(\'Act\',3,6);">Ac 3:6</a>; <a onClick="return mV(\'Act\',20,33);">20:33</a>; <a onClick="return mV(\'Rev\',18,12);">Re 18:12</a>). Finer than gold, which, physically speaking, is considered non-perishable, typifies incorruptibility (<a onClick="return mV(\'Act\',17,29);">Ac 17:29</a>; <a onClick="return mV(\'1Pe\',1,7,18);">1Pe 1:7, 18</a>; <a onClick="return mV(\'1Pe\',3,3);">3:3</a>; <a onClick="return mV(\'Jam\',5,3);">Jas 5:3</a>). Refining of gold is a figure for great purity or a test of stedfastness (<a onClick="return mV(\'Job\',23,10);">Job 23:10</a>; <a onClick="return mV(\'Pro\',17,3);">Pr 17:3</a>; <a onClick="return mV(\'Isa\',1,25);">Isa 1:25</a>; <a onClick="return mV(\'Mal\',3,2);">Mal 3:2</a>; <a onClick="return mV(\'1Pe\',1,7);">1Pe 1:7</a>; <a onClick="return mV(\'Rev\',3,18);">Re 3:18</a>). Gold was the most valuable of metals. It stood for anything of great value (<a onClick="return mV(\'Pro\',3,14);">Pr 3:14</a>; <a onClick="return mV(\'Pro\',8,10,19);">8:10, 19</a>; <a onClick="return mV(\'Pro\',16,16,22);">16:16, 22</a>; <a onClick="return mV(\'Pro\',25,12);">25:12</a>), hence was most worthy for use in worshipping Yahweh (<a onClick="return mV(\'Exd\',25,\'1-\');">Ex 25</a>ff; <a onClick="return mV(\'Rev\',1,12,13,20);">Re 1:12-13, 20</a>, etc.), and the adornment of angels (<a onClick="return mV(\'Rev\',15,6);">Re 15:6</a>) or saints (<a onClick="return mV(\'Psa\',45,13);">Ps 45:13</a>). The head was called golden as being the most precious part of the body (<a onClick="return mV(\'Sgs\',5,11);">So 5:11</a>; <a onClick="return mV(\'Dan\',2,38);">Da 2:38</a>; compare "the golden bowl," <a onClick="return mV(\'Ecc\',12,6);">Ec 12:6</a>). "The golden city" meant Babylon (<a onClick="return mV(\'Isa\',14,4);">Isa 14:4</a>), as did also "the golden cup," sensuality (<a onClick="return mV(\'Jer\',51,7);">Jer 51:7</a>). A crown of gold was synonymous with royal honor (<a onClick="return mV(\'Est\',2,17);">Es 2:17</a>; <a onClick="return mV(\'Est\',6,8);">6:8</a>; <a onClick="return mV(\'Job\',19,9);">Job 19:9</a>; <a onClick="return mV(\'Rev\',4,4);">Re 4:4</a>; <a onClick="return mV(\'Rev\',14,14);">14:14</a>). Wearing of gold typified lavish adornment and worldly luxury (<a onClick="return mV(\'Jer\',4,30);">Jer 4:30</a>; <a onClick="return mV(\'Jer\',10,4);">10:4</a>; <a onClick="return mV(\'1Ti\',2,9);">1Ti 2:9</a>; <a onClick="return mV(\'1Pe\',3,3);">1Pe 3:3</a>; <a onClick="return mV(\'Rev\',17,4);">Re 17:4</a>). Comparing men to gold suggested their nobility (<a onClick="return mV(\'Lam\',4,1,2);">La 4:1, 2</a>; <a onClick="return mV(\'2Ti\',2,20);">2Ti 2:20</a>).``133';
isbe[3872]='Golden Calf`gold\'-\'-n: Probably a representation of the sun in Taurus.`<a href="./study/isbe/search.html?string=ASTROLOGY">ASTROLOGY</a>; <a href="./study/isbe/search.html?string=CALF,+GOLDEN">CALF, GOLDEN</a>`1';
isbe[3873]='Golden City`gold\'-\'-n: The translation "golden city" (<a onClick="return mV(\'Isa\',14,4);">Isa 14:4</a>) is an attempt to render the received text (madhhebhah), but can hardly be justified. Almost all the ancient versions read (marhebhah), a word which connotes unrest and insolence, fitting the context well.``1';
isbe[3874]='Golden Number`gold\'-\'-n num\'-ber: Used in the regulation of the ecclesiastical calendar, in the "Metonic cycle" of 19 years, which almost exactly reconciles the natural month and the solar year.`<a href="./study/isbe/search.html?string=ASTRONOMY,+i">ASTRONOMY</a>`1';
isbe[3875]='Goldsmith`gold\'-smith (tsreph): Goldsmiths are first mentioned in connection with the building of the tabernacle (<a onClick="return mV(\'Exd\',31,4);">Ex 31:4</a>; <a onClick="return mV(\'Exd\',36,1);">36:1</a>). Later, goldsmiths\' guilds are mentioned (<a onClick="return mV(\'Neh\',3,8,32);">Ne 3:8, 32</a>). The art of refining gold and shaping it into objects was probably introduced into Palestine from Phoenicia (see <a href="study/isbe/search.html?string=CRAFTS">CRAFTS</a>). Examples of gold work from the earliest Egyptian periods are so numerous in the museums of the world that we do not have to draw on our imaginations to appreciate the wonderful skill of the ancient goldsmiths. their designs and methods were those later used by the Jews. The goldsmiths\' art was divided into<P>(1) the refining of the impure gold (<a onClick="return mV(\'Job\',28,1);">Job 28:1</a>; <a onClick="return mV(\'Pro\',17,3);">Pr 17:3</a>; <a onClick="return mV(\'Pro\',25,4);">25:4</a>; <a onClick="return mV(\'Pro\',27,21);">27:21</a>; <a onClick="return mV(\'Isa\',1,25);">Isa 1:25</a>; <a onClick="return mV(\'Mal\',3,3);">Mal 3:3</a>);<P>(2) shaping of objects,<P>(a) casting idols (<a onClick="return mV(\'Num\',33,52);">Nu 33:52</a>; <a onClick="return mV(\'Hsa\',13,2);">Ho 13:2</a>),<P>(b) making graven images (<a onClick="return mV(\'2Ch\',34,3,4);">2Ch 34:3-4</a>; <a onClick="return mV(\'Jer\',10,14);">Jer 10:14</a>; <a onClick="return mV(\'Nah\',1,14);">Na 1:14</a>),<P>(c) the making of beaten or turned work (<a onClick="return mV(\'Exd\',25,18);">Ex 25:18</a>),<P>(d) plating or overlaying (<a onClick="return mV(\'Exd\',25,11);">Ex 25:11</a>; <a onClick="return mV(\'1Ki\',6,20);">1Ki 6:20</a>),<P>(e) soldering (<a onClick="return mV(\'Isa\',41,7);">Isa 41:7</a>),<P>(f) making of wire (<a onClick="return mV(\'Exd\',28,6);">Ex 28:6</a>; <a onClick="return mV(\'Exd\',39,3);">39:3</a>).<P>Most of these processes are carried on in Bible lands today. In Damascus there is a goldsmiths\' quarter where the refining, casting and beating of gold are still carried on, probably in much the same way as in Solomon\'s time. Jews are found among the goldsmiths. In Beirut, it is a Jew who is especially skilled in making refiners\' pots. Daily, one can see the gold being refined, cast into lumps, beaten on an anvil, rolled between rollers into thin sheets, cut into narrow strips (wire), and wound on bobbins ready for the weaver. are houses in Damascus and Aleppo still possessing beautiful gold overlaid work on wooden walls and ceilings, the work of goldsmiths of several centuries ago. grazing-ground of the nomads. Traces of ancient forests remain, but for the most part today it is treeless. To the east of the Sea of Galilee the soil is deep and rich. Splendid crops of wheat are grown here, and olives flourish in the hollows. The country is furrowed by deep valleys that carry the water southwestward into the Sea of Galilee. This region has not yet been subjected to thorough examination, but many important ruins have been found, which tell of a plentiful and prosperous population in times long past. The best description of these, and of the region generally, will be found in Schumacher\'s The Jaulan, and Across the Jordan. To him also we owe the excellent maps which carry us eastward to the province of el-Chauran.``133';
isbe[3876]='Golgotha`gol\'-go-tha (Golgotha, from "a skull"): In three references (<a onClick="return mV(\'Mat\',27,33);">Mt 27:33</a>; <a onClick="return mV(\'Mar\',15,22);">Mr 15:22</a>; <a onClick="return mV(\'Jhn\',19,17);">Joh 19:17</a>) it is interpreted to mean kraniou topos, "the place of a skull." In <a onClick="return mV(\'Luk\',23,33);">Lu 23:33</a> the King James Version it is called "Calvary," but in the Revised Version (British and American) simply "The skull." From the New Testament we may gather that it was outside the city (<a onClick="return mV(\'Hbr\',13,12);">Heb 13:12</a>), but close to it (<a onClick="return mV(\'Jhn\',19,20);">Joh 19:20</a>), apparently near some public thoroughfare (<a onClick="return mV(\'Mat\',27,39);">Mt 27:39</a>), coming from the country (<a onClick="return mV(\'Mar\',15,21);">Mr 15:21</a>). was a spot visible, from some points, from afar (<a onClick="return mV(\'Mar\',15,40);">Mr 15:40</a>; <a onClick="return mV(\'Luk\',23,49);">Lu 23:49</a>).<P>1. The Name:<P>Four reasons have been suggested for the name Golgotha or "skull":<P>(1) That it was a spot where skulls were to be found lying about and probably, therefore, a public place of execution. This tradition apparently originates with Jerome (346-420 AD), who refers to (3), to condemn it, and says that "outside the city and without the gate there are places wherein the heads of condemned criminals are cut off and which have obtained the name of Calvary—that is, of the beheaded." This view has been adopted by several later writers. Against it may be urged that there is no shadow of evidence that there was any special place for Jewish executions in the 1st century, and that, if there were, the corpses could have been allowed burial (<a onClick="return mV(\'Mat\',27,58);">Mt 27:58</a>; <a onClick="return mV(\'Jhn\',19,38);">Joh 19:38</a>), in conformity with Jewish law (<a onClick="return mV(\'Deu\',21,23);">De 21:23</a>) and with normal custom (Josephus, BJ, IV, v, 2).<P>(2) That the name was due to the skull-like shape of the hill—a modern popular view. No early or Greek writer suggests such an idea, and there is no evidence from the Gospels that the Crucifixion occurred on a raised place at all. Indeed Epiphanius (4th century) expressly says: "There is nothing to be seen on the place resembling this name; for it is not situated upon a height that it should be called (the place) of a skull, answering to the place of the head in the human body." It is true that the tradition embodied in the name Mons Calvary appears as early as the 4th century, and is materialized in the traditional site of the Crucifixion in the church of the Holy Sepulcher, but that the hill was skull-like in form is quite a modern idea. Guthe combines (2) and (3) and considers that a natural skull-like elevation came to be considered, by some folklore ideas, to be the skull of the first man. One of the strangest ideas is that of the late General Gordon, who thought that the resemblance to a skull lay in the contours of the ground as laid down in the ordinance survey map of Jerusalem.<P>(3) That the name is due to an ancient pre-Christian tradition that the skull of Adam was found there. The first mention of this is by Origen (185-253 AD), who himself lived in Jerusalem 20 years. He writes: "I have received a tradition to the effect that the body of Adam, the first man, was buried upon the spot where Christ was crucified," etc. This tradition was afterward referred to by Athanasius, Epiphanius, Basil of Caesarea, Chrysostom and other later writers. The tomb and skull of Adam, still pointed out in an excavated chamber below the traditional Calvary, marks the survival of this tradition on the spot. This is by far the most ancient explanation of the name Golgotha and, in spite of the absurdity of the original tradition about Adam, is probably the true one.<P>(4) The highly improbable theory that the Capitolium of AElia Capitolina (the name given by Hadrian to his new Jerusalem) stood where the Church of the Holy Sepulcher now is, and gave rise to the name Golgotha, is one which involves the idea that the site first received the name Golgotha in the 2nd century, and that all the references in the Gospels were inserted then. This is only mentioned to be dismissed as incompatible with history and common sense.<P>2. The Site:<P>With regard to the position of the site of the Crucifixion (with which is bound up the site of the Tomb) the New Testament gives us no indication whatever; indeed, by those who abandon tradition, sites have been suggested on all sides of the city—and west, Two views hold the field today:<P>(1) that the site of the Crucifixion, or at any rate that of the Tomb itself, is included within the precincts of the Church of the Holy Sepulcher; and<P>(2) that a prominent, rounded, grassy hill above the so-called "Grotto of Jeremiah," northeast of the Modern Damascus Gate, has at least a very high probability of being the true site. It is impossible here to go into the whole question, which requires minute and long elaboration, but excellent review of the whole evidence may be consulted in "Golgotha and the Holy Sepulcher," by the late Sir Charles W. Wilson, of PEF. Here only a few points can be touched upon.<P>(1) For the traditional view it may be said that it seems highly improbable that so sacred a spot as this, particularly the empty tomb, could have been entirely forgotten. Although it is true that Jews and Christians were driven out of Jerusalem after the second great revolt (130-33 AD), yet GentileChristians were free to return, and there was no break long enough to account for a site like this being entirely lost. Indeed there are traditions that this site was deliberately defiled by pagan buildings to annoy the Christians. Eusebius, at the time of Constantine, writes as if it were well known that a Temple of Aphrodite lay over the tomb.<P>He gives an account of the discovery of the spots still venerated as the Golgotha and the Tomb, and of the erection of churches in connection with them (Life of Constantine, III, 25-40). From the time of Constantine there has been no break in the reverence paid to these places. Of the earlier evidence Sir C. Wilson admits (loc. cit.) that "the tradition is so precarious and the evidence is undoubtedly so unsatisfactory as to raise serious doubts."<P>The topographical difficulties are dealt with in the <a href="study/isbe/search.html?string=JERUSALEM,+1">JERUSALEM</a>. It is difficult for the visitor to Jerusalem sufficiently to realize that the center of gravity of the city has much changed; once it was on the Hill Ophel, and the southern slopes, now bare, were in Christ\'s time crammed with houses; in later times, from the 4th century, it was the Church of the Holy Sepulcher round which the city tended to center. There is no insurmountable difficulty in believing that the site of the Crucifixion may be where tradition points out. As Sir C. Wilson says at the end of his book, "No objection urged against the sites (i.e. Golgotha and the Tomb) is of such a convincing nature that it need disturb the minds of those who accept, in all good faith, the authenticity of the places which are hallowed by the prayers of countless pilgrims since the days of Constantine" (loc. cit.).<P>(2) The so-called "Skull Hill" or "Green Hill" appears to have appealed first to Otto Thenius (1842), but has received its greatest support through the advocacy of the late Col. Conder and of the late Dr. Selah Merrill, U.S.A. consul at Jerusalem. The arguments for this site are mainly:<P>(a) its conspicuous and elevated position—a position which must impress every reverent pilgrim as strikingly suitable for an imaginary reconstruction of the scene. The very greenness of the hill—it is the first green spot in the neighborhood of the city—may influence the subconsciousness of those who have been brought up from childhood to think of the "green hill far away," as the popular hymn puts it. When, however, we consider the question historically, there is not the slightest reason to expect that the crucifixion of Jesus, one of many hundreds, should have been dramatically located in a setting so consonant with the importance with which the world has since learned to regard the event. There is no evidence whatever that the crucifixion was on a hill, much less on such a conspicuous place.<P>(b) The supposed resemblance to a human skull strikes many people, but it may be stated without hesitation that the most arresting points of the resemblance, the "eyeholes" and the rounded top, are not ancient; the former are due to artificial excavations going back perhaps a couple of centuries. Probably the whole formation of the hill, the sharp scarp to the south and the 10 or more feet of earth accumulated on the summit are both entirely new conditions since New Testament times.<P>(c) The nearness of the city walls and the great north road which make the site so appropriate today are quite different conditions from those in New Testament times. It is only if the present north wall can be proved to be on the line of the second wall that the argument holds good. On this see <a href="study/isbe/search.html?string=JERUSALEM,+1">JERUSALEM</a>.<P>(d) An argument has been based upon a supposed tradition that this spot was the Jewish place of stoning. This so-called tradition is worthless, and not a trace of it can be found outside interested circles, and even if it were the "place of stoning," it would be no argument for its being "Golgotha." To the Oriental, with his great respect for traditional sites, the church of the Holy Sepulcher, covering at once the Tomb, the Calvary, and other sacred spots, will probably always appeal as the appropriate spot: to the western tourist who wishes to visualize in the environs of Jerusalem in an appropriate setting the great world\'s tragedy, such a site as this "Skull Hill" must always make the greater appeal to his imagination, and both may find religious satisfaction in their ideas; but cold reason, reviewing the pro\'s and con\'s, is obliged to say "not proven" to both, with perhaps an admission of the stronger case for the traditional spot.``117';
isbe[3877]='Goliath`go-li\'-ath (golyath; Goliath):<P>(1) The giant of Gath, and champion of the Philistine army (<a onClick="return mV(\'1Sa\',17,\'4-23\');">1Sa 17:4-23</a>; <a onClick="return mV(\'1Sa\',21,9);">21:9</a>; <a onClick="return mV(\'1Sa\',22,10);">22:10</a>; <a onClick="return mV(\'2Sa\',21,19);">2Sa 21:19</a>; <a onClick="return mV(\'1Ch\',20,5);">1Ch 20:5</a>). He defied the armies of Israel, challenging anyone to meet him in single combat while the two armies faced each other at Ephesdammim. He was slain by the youthful David. Goliath was almost certainly not of Philistine blood, but belonged to one of the races of giants, or aboriginal tribes, such as the Anakim, Avvim, Rephaim, etc. The Avvim had lived at Philistia, and most probably the giant was of that race. His size was most extraordinary. If a cubit was about 21 inches, he was over 11 feet in height; if about 18 inches, he was over 9 feet in height. The enormous weight of his armor would seem to require the larger cubit. This height probably included his full length in armor, helmet and all. In either case he is the largest man known to history. His sword was wielded by David to slay him and afterward carried about in his wanderings, so it could not have been excessively heavy. The story of his encounter with David is graphic, and the boasts of the two champions were perfectly in keeping with single combats in the Orient.<P>(2) The Goliath of <a onClick="return mV(\'2Sa\',21,19);">2Sa 21:19</a> is another person, and quite probably a son of the first Goliath. He was slain by Elhanan, one of David\'s mighty men. The person mentioned in <a onClick="return mV(\'1Ch\',20,5);">1Ch 20:5</a> is called Lachmi, but this is almost certainly due to a corruption of the text. "The brother of Goliath" is the younger Goliath and probably a son of the greater Goliath, who had four sons, giants, one of them having 24 fingers and toes.`<a href="./study/isbe/search.html?string=ELHANAN">ELHANAN</a>; <a href="./study/isbe/search.html?string=LAHMI">LAHMI</a>`146';
isbe[3878]='Gomer (1)`go\'-mer (gomer): Given in <a onClick="return mV(\'Gen\',10,2);">Ge 10:2</a>f; <a onClick="return mV(\'1Ch\',1,5);">1Ch 1:5</a>f as a son of Japheth. The name evidently designates the people called Gimirra by the Assyrians, Kimmerians by the Greeks. They were a barbaric horde of Aryans who in the 7th century BC left their abode in what is now Southern Russia and poured. through the Caucasus into western Asia, causing serious trouble to the Assyrians and other nations. One division moved eastward toward Media, another westward, where they conquered Cappadocia and made it their special abode. They fought also in other parts of Asia Minor, conquering some portions. The Armenian name for Cappadocia, Gamir, has come from this people. In <a onClick="return mV(\'Eze\',38,6);">Eze 38:6</a> Gomer is mentioned as one of the northern nations.``12';
isbe[3879]='Gomer (2)`go\'-mer (gomer; Gamer): Wife of Hosea. Hosea married Gomer according to Divine appointment, and this was the beginning of God\'s word to him (<a onClick="return mV(\'Hsa\',1,3);">Ho 1:3</a>; <a onClick="return mV(\'Hsa\',3,\'1-4\');">3:1-4</a>). She was to be a wife of whoredom and they were to have children of whoredom. This need not mean that at the time of marriage she was thus depraved, but she had the evil taint in her blood, had inherited immoral instincts. These soon manifested themselves, and the unfaithful, depraved wife of the prophet went deeper into sin. She seems to have left him and become the slave of her paramour (<a onClick="return mV(\'Hsa\',3,1);">Ho 3:1</a>). Hosea is now commanded by Yahweh to buy her back, paying the price of the ordinary slave. The prophet keeps her in confinement and without a husband for some time. This experience of the prophet was typical of Israel\'s unfaithfulness, of Israel\'s exile, and of God bringing her back after the punishment of the exile.`<a href="./study/isbe/search.html?string=HOSEA">HOSEA</a>`146';
isbe[3880]='Gomorrah`go-mor\'-a (\'amorah; Septuagint and New Testament Gomorra, or Gomorra; Arabic Ghamara, "to overwhelm with water"): One of the <a href="study/isbe/search.html?string=CITIES+OF+THE+PLAIN;+CICCAR">CITIES OF THE PLAIN</a> (which see) destroyed by fire from heaven in the time of Abraham and Lot (<a onClick="return mV(\'Gen\',19,\'23-29\');">Ge 19:23-29</a>). It was located probably in the plain south of the Dead Sea, now covered with water. See <a href="study/isbe/search.html?string=ARABAH">ARABAH</a>; <a href="study/isbe/search.html?string=CITIES+OF+THE+PLAIN;+CICCAR">CITIES OF THE PLAIN</a>; <a href="study/isbe/search.html?string=DEAD+SEA,+THE">DEAD SEA</a>. De Saulcy, however, with others who place the Cities of the Plain at the north end of the Dead Sea, fixes upon Khumran (or Gumran), marked on the Survey Map of Palestine north of Ras Feshkeh, where there are ruins about a mile from the Dead Sea. But there is nothing to support this view except the faint resemblance of the name and the inconclusive arguments placing the Cities of the Plain at that end of the sea.``198';
isbe[3881]='Good`good (Tobh, Tubh, yatabh; agathos, agathon, kalos, kalon): In English "good" is used in various senses, most of which are represented in the Bible.<P>(1) In the Old Testament the commonest word is Tobh, occurring very frequently and translated in a great variety of ways. Of the different shades of meaning, which frequently run into each other, the following may be distinguished:<P>(a) Possessing desirable qualities, beneficial, agreeable, e.g. "good for food" (<a onClick="return mV(\'Gen\',2,9);">Ge 2:9</a>); "We will do thee good" (<a onClick="return mV(\'Num\',10,29);">Nu 10:29</a>); Who will show us any good?" (<a onClick="return mV(\'Psa\',4,6);">Ps 4:6</a>); "good tidings of good" (<a onClick="return mV(\'Isa\',52,7);">Isa 52:7</a>).<P>(b) Moral excellence, piety: "to know good and evil" (<a onClick="return mV(\'Gen\',3,22);">Ge 3:22</a>); "that which is right and good" (<a onClick="return mV(\'Deu\',6,18);">De 6:18</a>; <a onClick="return mV(\'1Sa\',12,23);">1Sa 12:23</a>); "good and bad" (<a onClick="return mV(\'1Ki\',3,9);">1Ki 3:9</a>, the Revised Version (British and American) "evil"); "Depart from evil and do good" (<a onClick="return mV(\'Psa\',37,27);">Ps 37:27</a>); "a good man" (<a onClick="return mV(\'Pro\',12,2);">Pr 12:2</a>); compare <a onClick="return mV(\'Isa\',5,20);">Isa 5:20</a>; <a onClick="return mV(\'Mic\',6,8);">Mic 6:8</a>, etc.<P>(c) Kind, benevolent: "The men were very good unto us" (<a onClick="return mV(\'1Sa\',25,15);">1Sa 25:15</a>); "Give thanks unto Yahweh; for he is good" (<a onClick="return mV(\'1Ch\',16,34);">1Ch 16:34</a>); "the good Yahweh" (<a onClick="return mV(\'2Ch\',30,18);">2Ch 30:18</a>); "God is good to Israel" (<a onClick="return mV(\'Psa\',73,1);">Ps 73:1</a>); "Yahweh is good to all" (<a onClick="return mV(\'Psa\',145,9);">Ps 145:9</a>), etc.<P>(d) Serviceable, adequate, sufficient: "saw the light that it was good" (<a onClick="return mV(\'Gen\',1,4,10,12);">Ge 1:4, 10, 12</a>; etc.); "not good that the man should be alone" (<a onClick="return mV(\'Gen\',2,18);">Ge 2:18</a>); in the frequent phrase, "if it seem good" (<a onClick="return mV(\'1Ch\',13,2);">1Ch 13:2</a>; <a onClick="return mV(\'Est\',5,4);">Es 5:4</a>, etc.), sometimes rendered, "if it please" (<a onClick="return mV(\'Neh\',2,5,7);">Ne 2:5, 7</a>; <a onClick="return mV(\'Est\',1,19);">Es 1:19</a>, etc.).<P>(e) Not small or deficient (full, complete): "a good old age" (<a onClick="return mV(\'Gen\',15,15);">Ge 15:15</a>; <a onClick="return mV(\'Gen\',25,8);">25:8</a>); "a good dowry" (<a onClick="return mV(\'Gen\',30,20);">Ge 30:20</a>); "good ears," "years," "kine" (<a onClick="return mV(\'Gen\',41,24,26,35);">Ge 41:24, 26, 35</a>); "good understanding" (<a onClick="return mV(\'1Sa\',25,3);">1Sa 25:3</a>); "good trees—"land" (<a onClick="return mV(\'2Ki\',3,19,25);">2Ki 3:19, 25</a>), etc.<p>(f) Not blemished, fair, honorable: "tender and good" (<a onClick="return mV(\'Gen\',18,7);">Ge 18:7</a>); "good kids" (<a onClick="return mV(\'Gen\',27,9);">Ge 27:9</a>); "good report" (<a onClick="return mV(\'1Sa\',2,24);">1Sa 2:24</a>; compare <a onClick="return mV(\'2Ki\',20,3);">2Ki 20:3</a>; <a onClick="return mV(\'Jer\',24,2);">Jer 24:2</a>); and the renderings "fair" (<a onClick="return mV(\'Gen\',26,7);">Ge 26:7</a>, etc.), "beautiful" (<a onClick="return mV(\'2Sa\',11,2);">2Sa 11:2</a>), "pleasant" (<a onClick="return mV(\'2Ki\',2,19);">2Ki 2:19</a>), etc.<P>(g) Pleasure-giving, happy: "glad of heart" (<a onClick="return mV(\'1Ki\',8,66);">1Ki 8:66</a>; <a onClick="return mV(\'Est\',5,9);">Es 5:9</a>); sometimes in the King James Version and the Revised Version (British and American) translated "merry" (<a onClick="return mV(\'Jdg\',16,25);">Jud 16:25</a>; <a onClick="return mV(\'1Sa\',25,36);">1Sa 25:36</a>; <a onClick="return mV(\'2Sa\',13,28);">2Sa 13:28</a>; <a onClick="return mV(\'Pro\',15,15);">Pr 15:15</a>, the Revised Version (British and American) "cheerful"), etc.<P>Changes that may be noted in the Revised Version (British and American) are such as, "good" for "ready" (<a onClick="return mV(\'Isa\',41,7);">Isa 41:7</a>); "I have no good beyond thee" for "My goodness extendeth not to thee" (<a onClick="return mV(\'Psa\',16,2);">Ps 16:2</a>); "goodly" for "good" (<a onClick="return mV(\'Psa\',45,1);">Ps 45:1</a>); "good" for "goodness" (<a onClick="return mV(\'Psa\',107,9);">Ps 107:9</a>); "good" for "well" (<a onClick="return mV(\'Zec\',8,15);">Zec 8:15</a>).<P>Tubh means something good, e.g. "the good of the land" (<a onClick="return mV(\'Gen\',45,18,20);">Ge 45:18, 20</a>; <a onClick="return mV(\'Deu\',6,11);">De 6:11</a>; <a onClick="return mV(\'Job\',21,16);">Job 21:16</a>, the Revised Version (British and American) "prosperity").<P>Yatabh, "to do good," occurs several times, as, "I will surely do thee good" (<a onClick="return mV(\'Gen\',32,12);">Ge 32:12</a>); "to do good" (<a onClick="return mV(\'Lev\',5,4);">Le 5:4</a>); "Make your ways and your doings good," the Revised Version (British and American) "amend" (<a onClick="return mV(\'Jer\',18,11);">Jer 18:11</a>; <a onClick="return mV(\'Zep\',1,12);">Ze 1:12</a>, etc.). Numerous other Hebrew words are rendered "good" in various verbal connections and otherwise, as "to bring good tidings" (<a onClick="return mV(\'2Sa\',4,10);">2Sa 4:10</a>; <a onClick="return mV(\'Isa\',40,9);">Isa 40:9</a>, etc.); "take good heed" (<a onClick="return mV(\'Deu\',2,4);">De 2:4</a>; <a onClick="return mV(\'Deu\',4,15);">4:15</a>; <a onClick="return mV(\'Jos\',23,11);">Jos 23:11</a>); "make good" (<a onClick="return mV(\'Exd\',21,34);">Ex 21:34</a>), etc.; "good will" (ratson, <a onClick="return mV(\'Deu\',33,16);">De 33:16</a>; <a onClick="return mV(\'Mal\',2,13);">Mal 2:13</a>); "what good?" the Revised Version (British and American) "what advantages?" (kishron, <a onClick="return mV(\'Ecc\',5,11);">Ec 5:11</a>); "good for nothing," the Revised Version (British and American) "profitable" (tsaleah, <a onClick="return mV(\'Jer\',13,10);">Jer 13:10</a>), etc. In <a onClick="return mV(\'Jer\',18,4);">Jer 18:4</a>, "as seemed good to the potter," the word is yahsar, which means literally, "right."<P>(2) In the New Testament the words most frequently translated "good" are agathos and kalos. The former, agathos, denotes good as a quality, physical or moral. Thus, "He maketh his sun to rise on the evil and the good" (<a onClick="return mV(\'Mat\',5,45);">Mt 5:45</a>); "good gifts" (<a onClick="return mV(\'Mat\',7,11);">Mt 7:11</a>); "Good Master (the Revised Version (British and American) "Teacher")...Why callest thou me good? none is good save one" (<a onClick="return mV(\'Mar\',10,17);">Mr 10:17</a>f; <a onClick="return mV(\'Luk\',18,18);">Lu 18:18</a>f; compare <a onClick="return mV(\'Mat\',19,16);">Mt 19:16</a>f); "they that have done good" (<a onClick="return mV(\'Jhn\',5,29);">Joh 5:29</a>). Sometimes it is equivalent to "kind" (thus <a onClick="return mV(\'Tts\',2,5);">Tit 2:5</a> the Revised Version (British and American)); to agathon is "that which is good" (<a onClick="return mV(\'Luk\',6,45);">Lu 6:45</a>; <a onClick="return mV(\'Rom\',7,13);">Ro 7:13</a>; <a onClick="return mV(\'1Th\',5,15);">1Th 5:15</a>; <a onClick="return mV(\'1Pe\',3,13);">1Pe 3:13</a>), etc.; "that which is honest," the Revised Version (British and American) "honorable "(<a onClick="return mV(\'2Cr\',13,7);">2Co 13:7</a>); "meet" (<a onClick="return mV(\'Mat\',15,26);">Mt 15:26</a>; <a onClick="return mV(\'Mar\',7,27);">Mr 7:27</a>); "worthy," the Revised Version (British and American) "honorable" (<a onClick="return mV(\'Jam\',2,7);">Jas 2:7</a>); agathon is "a good thing," as "good things to them that ask him" (<a onClick="return mV(\'Mat\',7,11);">Mt 7:11</a>); Can any good thing come out of Nazareth?" (<a onClick="return mV(\'Jhn\',1,46);">Joh 1:46</a>), etc.; agathoergeo (<a onClick="return mV(\'1Ti\',6,18);">1Ti 6:18</a>), and agathopoieo (<a onClick="return mV(\'Mar\',3,4);">Mr 3:4</a>; <a onClick="return mV(\'Act\',14,17);">Ac 14:17</a>), etc., "to do good."<P>Kalos is properly, "beautiful," "pleasing," "useful," "noble," "worthy" in a moral sense, e.g. "that they may see your good works" (<a onClick="return mV(\'Mat\',5,16);">Mt 5:16</a>); "She hath wrought a good work on me" (<a onClick="return mV(\'Mat\',26,10);">Mt 26:10</a>; <a onClick="return mV(\'Mar\',14,6);">Mr 14:6)</a>; "the good shepherd" (<a onClick="return mV(\'Jhn\',10,11,14);">Joh 10:11, 14</a>); "Many good works have I showed you" (<a onClick="return mV(\'Jhn\',10,32);">Joh 10:32</a>); "good and acceptable before God" (<a onClick="return mV(\'1Ti\',5,4);">1Ti 5:4</a>; the Revised Version (British and American) omits "good"); "the good fight" (<a onClick="return mV(\'2Ti\',4,7);">2Ti 4:7</a>); "good works" (<a onClick="return mV(\'Tts\',2,7);">Tit 2:7</a>); "the good word of God" (<a onClick="return mV(\'Hbr\',6,5);">Heb 6:5</a>). But it is often practically equivalent to agathos, e.g. "good fruit" (<a onClick="return mV(\'Mat\',3,10);">Mt 3:10</a>); "good ground" (<a onClick="return mV(\'Mat\',13,23);">Mt 13:23</a>); "good seed" (<a onClick="return mV(\'Mat\',13,24);">Mt 13:24</a>); but the idea of useful may underlie such expressions; to kalon is properly "that which is beautiful." It occurs in <a onClick="return mV(\'Rom\',7,18,21);">Ro 7:18, 21</a>; <a onClick="return mV(\'1Th\',5,21);">1Th 5:21</a>, "Hold fast that which is good." In <a onClick="return mV(\'Rom\',7,\'1-\');">Ro 7</a> it seems to be used interchangeably with to agathon. In <a onClick="return mV(\'Rom\',5,7);">Ro 5:7</a>, "the good man" (ho agathos) is distinguished from "a righteous man" (dikaios): "For the good man some one would even dare to die" (compare <a onClick="return mV(\'Rom\',7,16);">Ro 7:16</a>; <a onClick="return mV(\'Hbr\',5,14);">Heb 5:14</a>; <a onClick="return mV(\'Jam\',4,17);">Jas 4:17</a>); kalos, "well," "pleasantly," is translated "good" (<a onClick="return mV(\'Luk\',6,27);">Lu 6:27</a>; <a onClick="return mV(\'Jam\',2,3);">Jas 2:3</a>); kalodidaskalos (<a onClick="return mV(\'Tts\',2,3);">Tit 2:3</a>), "teachers of good things," the Revised Version (British and American) "of that which is good."<P>"Good" occurs in the rendering of many other Greek words and phrases, as eudokia, "good pleasure" (<a onClick="return mV(\'Eph\',1,9);">Eph 1:9</a>); "good will" (<a onClick="return mV(\'Luk\',2,14);">Lu 2:14</a>; <a onClick="return mV(\'Phl\',1,15);">Php 1:15</a>); sumphero, "to bear together," "not good to marry" (<a onClick="return mV(\'Mat\',19,10);">Mt 19:10</a>), the Revised Version (British and American) "expedient"; philagathos, "a lover of good" (<a onClick="return mV(\'Tts\',1,8);">Tit 1:8</a>); chrestologia, "good words" (<a onClick="return mV(\'Rom\',16,18);">Ro 16:18</a>, the Revised Version (British and American) "smooth speech," etc.).<P>The following changes in the Revised Version (British and American) may be noted. In <a onClick="return mV(\'Luk\',2,14);">Lu 2:14</a> for "men of good will" (eudokia) the Revised Version (British and American) reads "in whom he is well pleased," margin "good pleasure among men, Greek men of good pleasure." The meaning is "men to whom God is drawing nigh in goodwill or acceptance"; compare <a onClick="return mV(\'Luk\',4,19);">Lu 4:19</a>, "the acceptable year of the Lord"; <a onClick="return mV(\'Luk\',4,43);">4:43</A>, "Preach the good tidings of the kingdom of God." In <a onClick="return mV(\'Mat\',11,5);">Mt 11:5</a>; <a onClick="return mV(\'Luk\',4,43);">Lu 4:43</a>; <a onClick="return mV(\'Luk\',7,22);">7:22</a>; <a onClick="return mV(\'1Pe\',1,25);">1Pe 1:25</a> and (American Standard Revised Version) <a onClick="return mV(\'Rev\',14,6);">Re 14:6</a> "the gospel" is changed into "good tidings." In <a onClick="return mV(\'Mat\',18,8);">Mt 18:8</a>f; <a onClick="return mV(\'Mar\',9,43,45,47);">Mr 9:43, 45, 47</a>; <a onClick="return mV(\'Luk\',5,39);">Lu 5:39</a>, good is substituted for "better"; on the last passage in notes "Many authorities read \'better\' "; in <a onClick="return mV(\'1Cr\',9,15);">1Co 9:15</a> "good...rather" for "better"; "good" is substituted in <a onClick="return mV(\'Luk\',1,19);">Lu 1:19</a>; <a onClick="return mV(\'Luk\',8,1);">8:1</a> and <a onClick="return mV(\'Act\',13,32);">Ac 13:32</a> for "glad"; in <a onClick="return mV(\'Act\',6,3);">Ac 6:3</a> for "honest"; in <a onClick="return mV(\'Hbr\',13,9);">Heb 13:9</a> for "a good thing." In <a onClick="return mV(\'2Th\',1,11);">2Th 1:11</a>, all the good pleasure of his goodness" becomes "every desire of goodness" (m "Gr good pleasure of goodness"); in <a onClick="return mV(\'1Ti\',3,2);">1Ti 3:2</a>, "good" (kosmios) becomes "orderly." There are many other instances of like changes.`<a href="./study/isbe/search.html?string=GOODNESS">GOODNESS</a>; <a href="./study/isbe/search.html?string=GOOD,+CHIEF">GOOD, CHIEF</a>`185';
isbe[3882]='Good, Chief`What this consisted in was greatly discussed in ancient philosophy. Varro enumerated 288 answers to the question. By Plato "the good" was identified with God.<P>In the Old Testament while the "good" of the nation consisted in earthly well-being or prosperity (<a onClick="return mV(\'Deu\',28,\'1-\');">De 28</a> etc.), that of the individual was to be found only in God Himself (<a onClick="return mV(\'Psa\',16,2);">Ps 16:2</a> the Revised Version (British and American), "I have no good beyond thee"; <a onClick="return mV(\'Psa\',41,\'1-5\');">Ps 41:1-5</a>; <a onClick="return mV(\'Psa\',43,5);">43:5</a>; <a onClick="return mV(\'Psa\',73,\'25-28\');">73:25-28</a>; <a onClick="return mV(\'Jer\',31,33);">Jer 31:33</a>f; <a onClick="return mV(\'Hab\',3,\'17-19\');">Hab 3:17-19</a>). This implied godly conduct (<a onClick="return mV(\'Mic\',6,8);">Mic 6:8</a>, etc.), and led to the experience described as "blessedness" (<a onClick="return mV(\'Psa\',1,\'1-\');">Ps 1</a>, etc.; <a onClick="return mV(\'Jer\',17,7);">Jer 17:7</a>, etc.). It is the "Wisdom" extolled in <a onClick="return mV(\'Pro\',1,20);">Pr 1:20</a>; <a onClick="return mV(\'Pro\',8,1);">8:1</a>f (compare Ecclesiasticus 1:1f; 5:1f), elsewhere described as "the fear of Yahweh." That God alone can be the true "good" of man is implied in the fact that man was created in the image of God (<a onClick="return mV(\'Gen\',1,27);">Ge 1:27</a>).<P>In the New Testament the true "good" is placed by Jesus in "the kingdom of God" (<a onClick="return mV(\'Mat\',6,33);">Mt 6:33</a>; <a onClick="return mV(\'Mat\',13,44);">13:44</a>f; etc.). This means nothing earthly merely (<a onClick="return mV(\'Mat\',6,19);">Mt 6:19</a>), but heavenly and eternal. It implies the Old Testament conception that God is the true "good"; for to seek the Kingdom supremely means whole-hearted devotion to God as our heavenly Father and to His righteousness. It was also spoken of by Jesus, as sonship to the heavenly Father (<a onClick="return mV(\'Mat\',5,45);">Mt 5:45</a>, etc.). This "good" is not something merely to be given to men, but must be sought after and won through taking up a right attitude toward God and our fellows, cherishing the Love that God is, and acting it out in kindness and righteousness, in resemblance to our God and Father (<a onClick="return mV(\'Mat\',5,\'43-48\');">Mt 5:43-48</a>; here <a onClick="return mV(\'Gen\',1,27);">Ge 1:27</a> is implied).<P>In some of the epistles Christ is represented as the true "good" (<a onClick="return mV(\'Phl\',3,8);">Php 3:8</a>f; <a onClick="return mV(\'Col\',3,\'1-4\',11);">Col 3:1-4, 11</a>). This is because in Him God was manifested in His Truth and Grace; in Him "the Kingdom" was present; through His cross the world is so reconciled to God that men can find acceptance and rest in Him as their "good"; Christ Himself in the Spirit is our Life; in Him we have "God with us." Having God as our "good," nothing but good, in the truest and highest sense, can come to us. Even the most seemingly adverse things are turned into good "to them that love God" (<a onClick="return mV(\'Rom\',8,28);">Ro 8:28</a>).<P>Our true "good" is found thus in God even in this present life; but its fullness can be realized only in the eternal life beyond. Placing our "good" in God leads to such life in devotion to the "good" that God is, as tends to bring all that is best to this present world. It is men\'s failure to do this that is the source of our misery (<a onClick="return mV(\'Jer\',2,13);">Jer 2:13</a>, etc.). The ultimate ideal is that God shall be "all in all" (<a onClick="return mV(\'1Cr\',15,28);">1Co 15:28</a>).``185';
isbe[3883]='Goodliness`good\'-li-nes: This word is found in <a onClick="return mV(\'Isa\',40,6);">Isa 40:6</a> as the translation of checedh, commonly translated "mercy," "kindness," etc.: "All flesh is grass, and all the goodliness (beauty, charm, comeliness) thereof is as the flower of the field." The rendering is retained by the English Revised Version and the American Standard Revised Version as appropriate in this place; checedh is frequently translated goodness.\' In <a onClick="return mV(\'Isa\',40,6);">Isa 40:6</a> Septuagint has doxa, "glory" (so also <a onClick="return mV(\'1Pe\',1,24);">1Pe 1:24</a>), which also fitly expresses the idea of the passage.``1';
isbe[3884]='Goodly`good\'-li Tobh; kalos, lampros): In the Old Testament various words are translated "goodly," the most of them occurring only once; Tobh (the common word for "good") is several times translated "goodly," chiefly in the sense of form or appearance e.g "a goodley child" (<a onClick="return mV(\'Exd\',2,2);">Ex 2:2</a>); "that goodly mountain" (<a onClick="return mV(\'Deu\',3,25);">De 3:25</a>); yapheh ("fair") is similarly translated in <a onClick="return mV(\'Gen\',39,6);">Ge 39:6</a>, the Revised Version (British and American) "comely," and mar\'oh in <a onClick="return mV(\'2Sa\',23,21);">2Sa 23:21</a>. Other words, such as \'addir imply excellence, honor, etc., e.g. <a onClick="return mV(\'Eze\',17,23);">Eze 17:23</a>, "bear fruit, and be a goodly cedar"; hodh, "his goodly horse" (<a onClick="return mV(\'Zec\',10,3);">Zec 10:3</a>); others imply beauty, ornament, such as peer "goodly bonnets," the Revised Version (British and American) "headtires" (<a onClick="return mV(\'Exd\',39,28);">Ex 39:28</a>); shaphar ("bright," "fair"), "a goodly heritage" (<a onClick="return mV(\'Psa\',16,6);">Ps 16:6</a>); once \'El ("God of might") is employed, the Revised Version (British and American) "cedars of God," margin "goodly cedars" (<a onClick="return mV(\'Psa\',80,10);">Ps 80:10</a>); renanim ("joyous soundings or shoutings") is translated in <a onClick="return mV(\'Job\',39,13);">Job 39:13</a> "goodly wings," probably from the sound made in flying or flapping; the English Revised Version has "The wing of the ostrich rejoiceth," the American Standard Revised Version (wings) "wave proudly." For "goodly castles" (<a onClick="return mV(\'Num\',31,10);">Nu 31:10</a>) the Revised Version (British and American) has "encampments"; "goodly vessels" (<a onClick="return mV(\'2Ch\',32,27);">2Ch 32:27</a>) for "pleasant jewels"; "goodly" is substituted for "good" (<a onClick="return mV(\'Psa\',45,1);">Ps 45:1</a>; <a onClick="return mV(\'Sgs\',1,3);">So 1:3</a>); "goodly things" for "all the goods" (<a onClick="return mV(\'Gen\',24,10);">Ge 24:10</a>); "goodly frame," the American Standard Revised Version for "comely proportion" (<a onClick="return mV(\'Job\',41,12);">Job 41:12</a>).<P>In the New Testament kalos ("beautiful") is translated "goodly" in <a onClick="return mV(\'Mat\',13,45);">Mt 13:45</a>, "goodly pearls" and <a onClick="return mV(\'Luk\',21,5);">Lu 21:5</a> "goodly stones"; lampros ("bright") in <a onClick="return mV(\'Jam\',2,2);">Jas 2:2</a>, "goodly apparel," the Revised Version (British and American) "fine clothing," and <a onClick="return mV(\'Rev\',18,14);">Re 18:14</a>, "dainty and goodly" the Revised Version (British and American) "dainty and sumptuous." In <a onClick="return mV(\'Hbr\',11,23);">Heb 11:23</a>, the Revised Version (British and American) substitutes "goodly" for "proper."<P>"Goodly" occurs in Apocrypha, 1Esdras 4:18; Judith 8:7 (horaios); 2Macc 9:16, "goodly gifts," kallistos, the Revised Version (British and American) "goodliest."``185';
isbe[3885]='Goodly Trees`(peri\'ets hadhar, "the fruit (the King James Version "boughs") of goodly (= beautiful or noble) trees"): One of the four species of plants used in the Feast of Tabernacles (<a onClick="return mV(\'Lev\',23,40);">Le 23:40</a>). In the Talmud (Cukkdh 35a) this is explained to be the citron (Citrus medica) known in Hebrew as \'ethrogh. This tradition is ancient, at least as old as the Maccabees. Josephus (Ant., XIII, xiii, 5) records that Alexander Janneus, while serving at the altar during this feast, was pelted by the infuriated Jews with citrons. This fruit also figures on coins of this period. It is probable that the citron tree (Malum Persica) was imported from Babylon by Jews returning from the captivity. A citron is now carried in the synagogue by every orthodox Jew in one hand, and the lalabh (of myrtle, willow, and palm branch) in the other, on each day of the Feast of Tabernacles.<P>Originally the "goodly trees" had a much more generic sense, and the term is so interpreted by the Septuagint and Vulgate (Jerome\'s Latin Bible, 390-405 A.D.)`<a href="./study/isbe/search.html?string=FEASTS+AND+FASTS">FEASTS AND FASTS</a>; <a href="./study/isbe/search.html?string=BOOTHS,+FEAST+OF">BOOTH</a>`117';
isbe[3886]='Goodman`good\'-man (\'ish; oikodespotes): The word occurs once in the Old Testament and is a translation of the ordinary word for "man," \'ish (<a onClick="return mV(\'Pro\',7,19);">Pr 7:19</a>). "The goodman is not at home," so the King James Version and the Revised Version (British and American), but the American Standard Revised Version, more correctly, "The man is not at home"; i.e. the husband is not at home; the Geneva and Douay versions have "My husband is not at home": so Wycliffe; while the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) has "There is not a man in her house." In the New Testament "goodman" is a translation of oikodespotes. This word occurs 12 times in the Synoptists, and nowhere else. the King James Version and the Revised Version (British and American) have 3 translations of the word, the American Standard Revised Version 2. In 4 places the King James Version has "goodman" while the American Standard Revised Version has "householder" or "\'master of the house" (<a onClick="return mV(\'Mat\',20,11);">Mt 20:11</a>; <a onClick="return mV(\'Mat\',24,43);">24:43</a>; <a onClick="return mV(\'Luk\',12,39);">Lu 12:39</a>; <a onClick="return mV(\'Luk\',22,11);">22:11</a>). In all the other places, it is translated "householder" or "master of the house." the Revised Version (British and American) retains "goodman" in <a onClick="return mV(\'Mar\',14,14);">Mr 14:14</a> and <a onClick="return mV(\'Luk\',22,11);">Lu 22:11</a>. The word liteerally means "master of the house," or "husband." The adjective is a mark of respect, and is used somewhat as our word "Mr.," an appellative of respect or civility. Relationship by marriage was distinguished by this epithet, as "good-father," "good-sister," both in England and Scotland. Later the adjective lost its distinguishing force and was swallowed up in the word.``146';
isbe[3887]='Goodness`good\'-nes: This word in the Old Testament is the translation of Tobh (<a onClick="return mV(\'Exd\',18,9);">Ex 18:9</a>; <a onClick="return mV(\'Psa\',16,2);">Ps 16:2</a>, the Revised Version (British and American) "good"; <a onClick="return mV(\'Psa\',23,6);">23:6</a>), etc.; of Tubh (<a onClick="return mV(\'Exd\',33,19);">Ex 33:19</a>; <a onClick="return mV(\'Psa\',31,19);">Ps 31:19</a>; <a onClick="return mV(\'Jer\',31,14);">Jer 31:14</a>; <a onClick="return mV(\'Hsa\',3,5);">Ho 3:5</a>), etc.; of checedh (<a onClick="return mV(\'Exd\',34,6);">Ex 34:6</a>), "abundant in goodness," the English Revised Version "plenteous in mercy," the American Standard Revised Version "abundant in loving kindness"; "The goodness of God endureth continually," the Revised Version (British and American) "mercy," the American Standard Revised Version "loving kindness" (<a onClick="return mV(\'Psa\',52,1);">Ps 52:1</a>), etc.<P>In the New Testament it is the translation of chrestotes ("usefulness," benignity); "the riches of his goodness" (<a onClick="return mV(\'Rom\',2,4);">Ro 2:4</a>; <a onClick="return mV(\'Rom\',11,22);">11:22</a>, thrice); of chrestos ("useful," "benign," "kind," in <a onClick="return mV(\'Luk\',6,35);">Lu 6:35</a>); "The goodness of God leadeth thee to repentance" (<a onClick="return mV(\'Rom\',2,4);">Ro 2:4</a>); of agathosune (found only in the New Testament and Septuagint and writings based thereon), "full of goodness." (<a onClick="return mV(\'Rom\',15,14);">Ro 15:14</a>); "gentleness, goodness, faith" (<a onClick="return mV(\'Gal\',5,22);">Ga 5:22</a>); "in all goodness and righteousness and truth" (<a onClick="return mV(\'Eph\',5,9);">Eph 5:9</a>); "all the good pleasure of his goodness," the Revised Version (British and American) "every desire of goodness." (<a onClick="return mV(\'2Th\',1,11);">2Th 1:11</a>).<P>The thought of God as good and the prominence given to "good" and "goodness" are distinctive features of the Bible. In the
