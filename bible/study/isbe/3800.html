lliances by marriage, he was also bound to admit foreign worship into Jerusalem (<a onClick="return mV(\'1Ki\',11,5);">1Ki 11:5</a>). But Ahab was the first king who tried to set up the worship of Baal, side by side with that of Yahweh, as the national religion (<a onClick="return mV(\'1Ki\',18,19);">1Ki 18:19</a>). Elijah\'s stand and Jehu\'s revolution gave its death blow to Baal-worship and vindicated the sole right of Yahweh to Israel\'s allegiance. The prophet was defending the old religion and Ahab was the innovator; but the conflict and its issue brought the monotheistic principle to a new and higher level. The supreme temptation and the choice transformed what had been a natural monolatry into a conscious and moral adherence to Yahweh alone (<a onClick="return mV(\'1Ki\',18,21,39);">1Ki 18:21, 39</a>).<P>(ii) Assimilation:<P>But to repudiate the name of Baal was not necessarily to be rid of the influence of Baal-worship. The ideas of the heathen religions survived in a more subtle way in the worship of Yahweh Himself. The change from the nomad life of the desert to the agricultural conditions of Canaan involved some change in religion. Yahweh, the God of flocks and wars, had to be recognized as the God of the vintage and the harvest. That this development occurred is manifest in the character of the great religious festivals. "Three times thou shalt keep a feast unto me in the year. The feast of unleavened bread shalt thou keep...and the feast of harvest, the first-fruits of thy labors, which thou sowest in the field: and the feast of ingathering, at the end of the year, when thou gatherest in thy labors out of the field" (<a onClick="return mV(\'Exd\',23,\'14-16\');">Ex 23:14-16</a>). The second and the third obviously, and the first probably, were agricultural feasts, which could have no meaning in the desert. Israel and Yahweh together took possession of Canaan. To doubt that would be to admit the claims of the Baal-worship; but to assert it also involved some danger, because it was to assert certain similarities between Yahweh and the Baalim. When those similarities were embodied in the national festivals, they loomed very large in the eyes and minds of the mass of the people (W.R. Smith, Prophets of Israel, 49-57). The danger was that Israel should regard Yahweh, like the Baals of the country, as a Nature-god, and, by local necessity, a national god, who gave His people the produce of the land and, protected them from their enemies, and in return received frown them such gifts and sacrifices as corresponded to His nature. From the appearance in Israel, and among Yahweh worshippers, of such names as Jerub-baal, Esh-baal (son of Saul) and Beeliada (son of David, <a onClick="return mV(\'1Ch\',14,7);">1Ch 14:7</a>), it has been inferred that Yahweh was called Baal, and there is ample evidence that His worship was assimilated to that of the Canaanite Baalim. The bulls raised by Jeroboam (<a onClick="return mV(\'1Ki\',12,26);">1Ki 12:26</a>) were symbols of Yahweh, and in Judah the Canaanite worship was imitated down to the time of Asa (<a onClick="return mV(\'1Ki\',14,\'22-24\');">1Ki 14:22-24</a>; <a onClick="return mV(\'1Ki\',15,12,13);">15:12-13</a>). Against this tendency above all, the great prophets of the 8th century contended. Israel worshipped Yahweh as if He were one of the Baalim, and Hosea calls it Baal-worship (<a onClick="return mV(\'Hsa\',2,8,12,13);">Ho 2:8, 12-13</a>; compare <a onClick="return mV(\'Amo\',2,8);">Am 2:8</a>; <a onClick="return mV(\'Isa\',1,\'10-15\');">Isa 1:10-15</a>).<P>(iii) Disintegration:<P>And where Yahweh was conceived as one of the Baalim or Masters of the land, He became, like them, subject to disintegration into a number of local deities. This was probably the gravamen of Jeroboam\'s sin in the eyes of the "Deuteronomic" historian. In setting up separate sanctuaries, he divided the worship, and, in effect, the godhead of Yahweh. The localization and naturalization of Yahweh, as well as His assimilation to the Baals, all went together, so that we read that even in Judah the number of gods was according to its cities (<a onClick="return mV(\'Jer\',2,28);">Jer 2:28</a>; <a onClick="return mV(\'Jer\',11,13);">11:13</a>). The vindication of Yahweh\'s moral supremacy and spiritual unity demanded, among other things, the unification of His worship in Jerusalem (<a onClick="return mV(\'2Ki\',23,\'1-\');">2Ki 23</a>).<P>(d) No Hebrew Goddesses:<P>In one respect the religion of Yahweh successfully resisted the influence of the heathen cults. At no time was Yahweh associated with a goddess. Although the corrupt sensual practices that formed a large part of heathen worship also entered into Israel\'s worship (see <a href="study/isbe/search.html?string=ASHERAH">ASHERAH</a>), it never penetrated so far as to modify in this respect the idea of Yahweh.<P>(e) Human Sacrifices:<P>It is a difficult question how far human sacrifices at any time found place in the worship of Yahweh. The outstanding instance is that of Jephthah\'s daughter, which, though not condemned, is certainly regarded as exceptional (<a onClick="return mV(\'Jdg\',11,\'30-40\');">Jud 11:30-40</a>). Perhaps it is rightly regarded as a unique survival. Then the story of the sacrifice of Isaac, while reminiscent of an older practice, represents a more advanced view. Human sacrifice though not demanded, is not abhorrent to Yahweh (<a onClick="return mV(\'Gen\',22,\'1-\');">Ge 22</a>). A further stage is represented where Ahaz\' sacrifice of his son is condemned as an "abomination of the nations" (<a onClick="return mV(\'2Ki\',16,3);">2Ki 16:3</a>). The sacrifice of children is emphatically condemned by the prophets as a late and foreign innovation which Yahweh had not commanded (<a onClick="return mV(\'Jer\',7,31);">Jer 7:31</a>; <a onClick="return mV(\'Eze\',16,20);">Eze 16:20</a>). Other cases, such as the execution of the chiefs of Shittim (<a onClick="return mV(\'Num\',25,4);">Nu 25:4</a>), and of Saul\'s sons "before Yahweh" (<a onClick="return mV(\'2Sa\',21,9);">2Sa 21:9</a>), and the cherem or ban, by which whole communities were devoted to destruction (<a onClick="return mV(\'Jdg\',21,10);">Jud 21:10</a>; <a onClick="return mV(\'1Sa\',15,\'1-\');">1Sa 15</a>), while they show a very inadequate idea of the sacredness of human life, are not sacrifices, nor were they demanded by Yahweh\'s worship. They were survivals of savage customs connected with tribal unity, which the higher morality of Yahweh\'s religion had not yet abolished.<P>(2) The Nature and Character of Yahweh:<P>The nature and character of Yahweh are manifested in His activities. The Old Testament makes no statements about the essence of God; we are left to infer it from His action in Nature and history and from His dealing with man.<P>(a) A God of War:<P>In this period, His activity is predominantly martial. As Israel\'s Deliverer from Egypt, "Yahweh is a man of war" (<a onClick="return mV(\'Exd\',15,3);">Ex 15:3</a>). An ancient account of Israel\'s journey to Canaan is called "the book of the Wars of Yahweh" (<a onClick="return mV(\'Num\',21,14);">Nu 21:14</a>). By conquest in war He gave His people their land (<a onClick="return mV(\'Jdg\',5,\'1-\');">Jud 5</a>; <a onClick="return mV(\'2Sa\',5,24);">2Sa 5:24</a>; <a onClick="return mV(\'Deu\',33,27);">De 33:27</a>). He is, therefore, more concerned with men and nations, with the moral, than with the physical world.<P>(b) His Relation to Nature:<P>Even His activity in Nature is first connected with His martial character. Earth, stars and rivers come to His battle (<a onClick="return mV(\'Jdg\',5,4,20,21);">Jud 5:4, 20-21</a>). The forces of Nature do the bidding of Israel\'s Deliverer from Egypt (<a onClick="return mV(\'Exd\',8,\'1-\');">Ex 8-10</a>; <a onClick="return mV(\'Exd\',14,21);">14:21</a>). He causes sun and moon to stand while He delivers up the Amorites (<a onClick="return mV(\'Jos\',10,12);">Jos 10:12</a>). Later, He employs the forces of Nature to chastise His people for infidelity and sin (<a onClick="return mV(\'2Sa\',24,15);">2Sa 24:15</a>; <a onClick="return mV(\'1Ki\',17,1);">1Ki 17:1</a>). Amos declares that His moral rule extends to other nations and that it determines their destinies. In harmony with this idea, great catastrophes like the Deluge (<a onClick="return mV(\'Gen\',7,\'1-\');">Ge 7</a>) and the overthrow of the Cities of the Plain (<a onClick="return mV(\'Gen\',19,\'1-\');">Ge 19</a>) are ascribed to His moral will. In the same pragmatic manner the oldest creation narrative describes Him creating man, and as much of the world as He needed (<a onClick="return mV(\'Gen\',2,\'1-\');">Ge 2</a>), but as yet the idea of a universal cause had not emerged, because the idea of a universe had not been formed. He acts as one of great, but limited, power and knowledge (<a onClick="return mV(\'Gen\',11,\'5-8\');">Ge 11:5-8</a>; <a onClick="return mV(\'Gen\',18,20);">18:20</a>). The more universal conception of <a onClick="return mV(\'Gen\',1,\'1-\');">Ge 1</a> belongs to the same stratum of thought as Second Isaiah. At every stage of the Old Testament the metaphysical perfections of Yahweh follow as an inference from His ethical preeminence.<P>(3) The Most Distinctive Characteristic of Yahweh:<P>The most distinctive characteristic of Yahweh, which finally rendered Him and His religion absolutely unique, was the moral factor. In saying that Yahweh was a moral God, it is meant that He acted by free choice, in conformity with ends which He set to Himself, and which He also imposed upon His worshippers as their law of conduct.<P>(a) Personality:<P>The most essential condition of a moral nature is found in His vivid personality, which at every stage of His self-revelation shines forth with an intensity that might be called aggressive. Divine personality and spirituality are never expressly asserted or defined in the Old Testament; but nowhere in the history of religion are they more clearly asserted. The modes of their expression are, however, qualified by anthropomorphisms, by limitations, moral and physical. Yahweh\'s jealousy (<a onClick="return mV(\'Exd\',20,5);">Ex 20:5</a>; <a onClick="return mV(\'Deu\',5,9);">De 5:9</a>; <a onClick="return mV(\'Deu\',6,15);">6:15</a>), His wrath and anger (<a onClick="return mV(\'Exd\',32,\'10-12\');">Ex 32:10-12</a>; <a onClick="return mV(\'Deu\',7,4);">De 7:4</a>) and His inviolable holiness (<a onClick="return mV(\'Exd\',19,21,22);">Ex 19:21-22</a>; <a onClick="return mV(\'1Sa\',6,19);">1Sa 6:19</a>; <a onClick="return mV(\'2Sa\',6,7);">2Sa 6:7</a>) appear sometimes to be irrational and immoral; but they are the assertion of His individual nature, of His self-consciousness as He distinguishes Himself from all else, in the moral language of the time, and are the conditions of His having any moral nature whatsoever. Likewise, He dwells in a place and moves from it (<a onClick="return mV(\'Jdg\',5,5);">Jud 5:5</a>); men may see Him in visible form (<a onClick="return mV(\'Exd\',24,10);">Ex 24:10</a>; <a onClick="return mV(\'Num\',12,8);">Nu 12:8</a>); He is always represented as having organs like those of the human body, arms, hands, feet, mouth, eyes and ears. By such sensuous and figurative language alone was it possible for a personal God to make Himself known to men.<P>(b) Law and Judgment:<P>The content of Yahweh\'s moral nature as revealed in the Old Testament developed with the growth of moral ideas. Though His activity is most prominently martial, it is most permanently judicial, and is exercised through judges, priests and prophets. Torah and mishpaT, "law" and "judgment," from the time of Moses onward, stand, the one for a body of customs that should determine men\'s relations to one another, and the other for the decision of individual cases in accordance with those customs, and both were regarded as issuing from Yahweh. The people came to Moses "to inquire of God" when they had a matter in dispute, and he "judged between a man and his neighbor, and made them know the statutes of God, and his laws" (<a onClick="return mV(\'Exd\',18,15,16);">Ex 18:15-16</a>). The judges appear mostly as leaders in war; but it is clear, as their name indicates, that they also gave judgments as between the people (<a onClick="return mV(\'Jdg\',3,10);">Jud 3:10</a>; <a onClick="return mV(\'Jdg\',4,4);">4:4</a>; <a onClick="return mV(\'Jdg\',10,2,3);">10:2-3</a>; <a onClick="return mV(\'1Sa\',7,16);">1Sa 7:16</a>). The earliest literary prophets assume the existence of a law which priest and prophet had neglected to administer rightly (<a onClick="return mV(\'Hsa\',4,6);">Ho 4:6</a>; <a onClick="return mV(\'Hsa\',8,1,12);">8:1, 12</a>; <a onClick="return mV(\'Amo\',2,4);">Am 2:4</a>). This implied that Yahweh was thought of as actuated and acting by a consistent moral principle, which He also imposed on His people. Their morality may have varied much at different periods, but there is no reason to doubt that the Decalogue, and the moral teaching it involved, emanated substantially from Moses. "He taught them that Yahveh, if a stern, and often wrathful, Deity, was also a God of justice and purity. Linking the moral life to the religious idea, he may have taught them too that murder and theft, adultery and false witness, were abhorred and forbidden by their God" (Montefiore, Hibbert Lectures3, 49). The moral teaching of the Old Testament effected the transition from the national and collective to the individual and personal relation with Yahweh. The most fundamental defect of Hebrew morality was that its application was confined within Israel itself and did little to determine the relation of the Israelites to people of other nations; and this limitation was bound up with henotheism, the idea that Yahweh was God of Israel alone. "The consequence of this national conception of Yahweh was that there was no religious and moral bond regulating the conduct of the Hebrews with men of other nations. Conduct which between fellow-Hebrews was offensive in Yahweh\'s eyes was inoffensive when practiced by a Hebrew toward one who was not a Hebrew (<a onClick="return mV(\'Deu\',23,19);">De 23:19</a>f)...In the latter case they were governed purely by considerations of expediency. This ethical limitation is the real explanation of the \'spoiling of the Egyptians\' "(<a onClick="return mV(\'Exd\',11,2,3);">Ex 11:2-3</a>) (G. Buchanan Gray, The Divine Discipline of Israel, 46, 48).<P>The first line of advance in the teaching of the prophets was to expand and deepen the moral demands of Yahweh. So they removed at once the ethical and theological limitations of the earlier view. But they were conscious that they were only developing elements already latent in the character and law of Yahweh.<P>5. The Idea of God in the Prophetic Period:<P>Two conditions called forth and determined the message of the 8th-century prophets—the degradation of morality and religion at home and the growing danger to Israel and Judah from the all-victorious Assyrian. With one voice the prophets declare and condemn the moral and social iniquity of Israel and Judah (<a onClick="return mV(\'Hsa\',4,1);">Ho 4:1</a>; <a onClick="return mV(\'Amo\',4,1);">Am 4:1</a>; <a onClick="return mV(\'Isa\',1,\'21-23\');">Isa 1:21-23</a>). The worship of Yahweh had been assimilated to the heathen religions around (<a onClick="return mV(\'Amo\',2,8);">Am 2:8</a>; <a onClick="return mV(\'Hsa\',3,1);">Ho 3:1</a>; <a onClick="return mV(\'Isa\',30,22);">Isa 30:22</a>). A time of prosperity had produced luxury, license and an easy security, depending upon the external bonds and ceremonies of religion. In the threatening attitude of Assyria, the prophets see the complement of Israel\'s unfaithfulness and sin, this the cause and that the instruments of Yahweh\'s anger (<a onClick="return mV(\'Isa\',10,5);">Isa 10:5-6</a>).<P>(1) Righteousness:<P>These circumstances forced into first prominence the righteousness of Yahweh. It was an original attribute that had appeared even in His most martial acts (<a onClick="return mV(\'Jdg\',5,4);">Jud 5:4</a>; <a onClick="return mV(\'1Sa\',12,7);">1Sa 12:7</a>). But the prophet\'s interpretation of Israel\'s history revealed its content on a larger scale. Yahweh was not like the gods of the heathen, bound to the purposes and fortunes of His people. Their relation was not a natural bond, but a covenant of grace which He freely bestowed upon them, and He demanded as its condition, loyalty to Himself and obedience to His law. Impending calamities were not, as the naturalistic conception implied, due to the impotence of Yahweh against the Assyrian gods (<a onClick="return mV(\'Isa\',31,1);">Isa 31:1</a>), but the judgment of God, whereby He applied impartially to the conduct of His people a standard of righteousness, which He both had in Himself and declared in judgment upon them. The prophets did not at first so much transform the idea of righteousness, as assert its application as between the people and Yahweh. But in doing that they also rejected the external views of its realization. It consists not in unlimited gifts or in the costliest oblations. "What doth Yahweh require of thee, but to do justly, and to love kindness, and to walk humbly with thy God?" (<a onClick="return mV(\'Mic\',6,8);">Mic 6:8</a>). And it tends to become of universal application. Yahweh will deal as a righteous judge with all nations, including Israel, and Israel as the covenant people bears the greater responsibility (<a onClick="return mV(\'Amo\',1,\'1-\');">Am 1-3</a>). And a righteous judge that metes out even justice to all nations will deal similarly with individuals. The ministry of the prophets produced a vivid consciousness of the personal and individual relation of men to God. The prophets themselves were not members of a class, no order or school or profession, but men impelled by an inner and individual call of God, often against their inclination, to proclaim an unpopular message (<a onClick="return mV(\'Amo\',7,14,15);">Am 7:14-15</a>; <a onClick="return mV(\'Isa\',6,\'1-\');">Isa 6</a>; <a onClick="return mV(\'Jer\',1,\'6-9\');">Jer 1:6-9</a>; <a onClick="return mV(\'Eze\',3,14);">Eze 3:14</a>). Jeremiah and Ezekiel in terms denounced the old idea of collective responsibility (<a onClick="return mV(\'Jer\',31,29);">Jer 31:29</a>ff; <a onClick="return mV(\'Eze\',18,\'1-\');">Eze 18</a>). Thus in the prophets\' application of the idea of righteousness to their time, two of the limitations adhering to the idea of God, at least in popular religion hitherto, were transcended. Yahweh\'s rule is no longer limited to Israel, nor concerned only with the nation as a collective whole, but He deals impartially with every individual and nation alike. Other limitations also disappear. His anger and wrath, that once appeared irrational and unjust, now become the intensity of His righteousness. Nor is it merely forensic and retributive righteousness. It is rather a moral end, a chief good, which He may realize by loving-kindness and mercy and forgiveness as much as by punishment. Hebrew thought knows no opposition between God\'s righteousness and His goodness, between justice and mercy. The covenant of righteousness is like the relation of husband to wife, of father to child, one of loving-kindness and everlasting love (<a onClick="return mV(\'Hsa\',3,1);">Ho 3:1</a>; <a onClick="return mV(\'Hsa\',11,4);">11:4</a>; <a onClick="return mV(\'Isa\',1,18);">Isa 1:18</a>; <a onClick="return mV(\'Isa\',30,18);">30:18</a>; <a onClick="return mV(\'Mic\',7,18);">Mic 7:18</a>; <a onClick="return mV(\'Isa\',43,4);">Isa 43:4</a>; <a onClick="return mV(\'Isa\',54,8);">54:8</a>; <a onClick="return mV(\'Jer\',31,3);">Jer 31:3</a>ff, <a onClick="return mV(\'Jer\',31,34);">34</a>; <a onClick="return mV(\'Jer\',9,24);">9:24</A>). The stirring events which showed Yahweh\'s independence of Israel revealed the fullness of grace that was always latent in His relation to His people (<a onClick="return mV(\'Gen\',33,11);">Ge 33:11</a>; <a onClick="return mV(\'2Sa\',24,14);">2Sa 24:14</a>). It was enshrined in the Decalogue (<a onClick="return mV(\'Exd\',20,6);">Ex 20:6</a>), and proclaimed with incomparable grandeur in what may be the most ancient Mosaic tradition: "Yah, Yahweh, a God merciful and gracious, slow to anger and abundant in lovingkindness and truth; keeping lovingkindness for thousands, forgiving iniquity and transgression and sin" (<a onClick="return mV(\'Exd\',34,6,7);">Ex 34:6-7</a>).<P>(2) Holiness:<P>The holiness of Yahweh in the Prophets came to have a meaning closely akin to His righteousness. As an idea more distinctly religious and more exclusively applied to God, it was subject to greater changes of meaning with the development or degradation of religion. It was applied to anything withdrawn from common use to the service of religion—utensils, places, seasons, animals and men. Originally it was so far from the moral meaning it now has that it was used of the "sacred" prostitutes who ministered to the licentiousness of Canaanitish worship (<a onClick="return mV(\'Deu\',23,18);">De 23:18</a>). Whether or not the root-idea of the word was "separateness," there is no doubt that it is applied to Yahweh in the Old Testament to express his separateness from men and his sublimity above them. It was not always a moral quality in Yahweh; for He might be unapproachable because of His mere power and terror (<a onClick="return mV(\'1Sa\',6,20);">1Sa 6:20</a>; <a onClick="return mV(\'Isa\',8,13);">Isa 8:13</a>). But in the Prophets, and especially in Isaiah, it acquires a distinctly moral meaning. In his vision Isaiah hears Yahweh proclaimed as "holy, holy, holy," and he is filled with the sense of his own sin and of that of Israel (<a onClick="return mV(\'Isa\',6,\'1-\');">Isa 6</a>; compare <a onClick="return mV(\'Isa\',1,4);">Isa 1:4</a>; <a onClick="return mV(\'Amo\',2,7);">Am 2:7</a>). But even here the term conveys more than moral perfection. Yahweh is already "the high and lofty One that inhabiteth eternity, whose name is Holy" (<a onClick="return mV(\'Isa\',57,15);">Isa 57:15</a>). It expresses the full Divinity of Yahweh in His uniqueness and self-existence (<a onClick="return mV(\'1Sa\',2,2);">1Sa 2:2</a>; <a onClick="return mV(\'Amo\',4,2);">Am 4:2</a>; <a onClick="return mV(\'Hsa\',11,9);">Ho 11:9</a>). It would therefore seem to stand in antithesis to righteousness, as expressing those qualities of God, metaphysical and moral, by which He is distinguished and separated from men, while righteousness involves those moral activities and relations which man may share with God. But in the Prophets, God\'s entire being is moral and His whole activity is righteous. The meanings of the terms, though not identical, coincide; God\'s holiness is realized in righteousness. "God the Holy One is sanctified in righteousness" (<a onClick="return mV(\'Isa\',5,16);">Isa 5:16</a>). So Isaiah\'s peculiar phrase, "the Holy One of Israel," brings God in His most exalted being into a relation of knowledge and moral reciprocity with Israel.<P>(3) Universality:<P>The moralizing of righteousness and holiness universalized Deity.—From Amos downward Yahweh\'s moral rule, and therefore His absolute power, were recognized as extending over all the nations surrounding Israel, and the great world-power of Assyria is but the rod of His anger and the instrument of His righteousness (<a onClick="return mV(\'Amo\',1,\'1-\');">Am 1-2</a>; <a onClick="return mV(\'Isa\',10,5);">Isa 10:5</a>; <a onClick="return mV(\'Isa\',13,5);">13:5</a>ff; <a onClick="return mV(\'Isa\',19,1);">19:1</a>). Idolatrous and polytheistic worship of all kinds are condemned. The full inference of Monotheism was only a gradual process, even with the prophets. It is not clear that the 8th-century prophets all denied the existence of other gods, though Isaiah\'s term for them, \'elilim ("things of nought," "no-gods"), points in that direction. At least the monotheistic process had set in. And Yahweh\'s control over other nations was not exercised merely from Israel\'s point of view. The issue of the judgment upon the two great powers of Egypt and Assyria was to be their conversion to the religion of Yahweh (<a onClick="return mV(\'Isa\',19,24,25);">Isa 19:24-25</a>; compare <a onClick="return mV(\'Isa\',2,\'2-4\');">Isa 2:2-4</a>; <a onClick="return mV(\'Mic\',4,\'1-3\');">Mic 4:1-3</a>). Yet Hebrew universalism never went beyond the idea that all nations should find their share in Yahweh through Israel (<a onClick="return mV(\'Zec\',8,23);">Zec 8:23</a>). The nations from the ends of the earth shall come to Yahweh and declare that their fathers\' gods were "lies, even vanity and things wherein there is no profit" (<a onClick="return mV(\'Jer\',16,19);">Jer 16:19</a>). It is stated categorically that "Yahweh he is God in heaven above and upon the earth beneath; there is none else" (<a onClick="return mV(\'Deu\',4,39);">De 4:39</a>).<P>(4) Unity:<P>The unity of God was the leading idea of Josiah\'s reformation. Jerusalem was cleansed of every accretion of Baal-worship and of other heathen religions that had established themselves by the side of the worship of Yahweh (<a onClick="return mV(\'2Ki\',23,\'4-8\',\'10-14\');">2Ki 23:4-8, 10-14</a>). The semi-heathen worship of Yahweh in many local shrines, which tended to disintegrate His unity, was swept away (<a onClick="return mV(\'2Ki\',23,8,9);">2Ki 23:8-9</a>). The reform was extended to the Northern Kingdom (<a onClick="return mV(\'2Ki\',23,\'15-20\');">2Ki 23:15-20</a>), so that Jerusalem should be the sole habitation of Yahweh on earth, and His worship there alone should be the symbol of unity to the whole Hebrew race.<P>But the monotheistic doctrine is first fully and consciously stated in Second Isaiah. There is no God but Yahweh: other gods are merely graven images, and their worshippers commit the absurdity of worshipping the work of their own hands (<a onClick="return mV(\'Isa\',42,8);">Isa 42:8</a>; <a onClick="return mV(\'Isa\',44,\'8-20\');">44:8-20</a>). Yahweh manifests His deity in His absolute sovereignty of the world, both of Nature and history. The prophet had seen the rise and fall of Assyria, the coming of Cyrus, the deportation and return of Judah\'s exiles, as incidents in the training of Israel for her world-mission to be "a light of the Gentiles" and Yahweh\'s "salvation unto the end of the earth" (<a onClick="return mV(\'Isa\',42,\'1-7\');">Isa 42:1-7</a>; <a onClick="return mV(\'Isa\',49,\'1-6\');">49:1-6</a>). Israel\'s world-mission, and the ordering of historical movements to the grand final purpose of universal salvation (<a onClick="return mV(\'Isa\',45,23);">Isa 45:23</a>), is the philosophy of history complementary to the doctrine of God\'s unity and universal sovereignty.<P>(5) Creator and Lord:<P>A further inference is that He is Creator and Lord of the physical universe. Israel\'s call and mission is from Yahweh who "created the heavens, and stretched them forth; he that spread abroad the earth and that which cometh out of it; he that giveth breath unto the people upon it, and spirit to them that walk therein" (<a onClick="return mV(\'Isa\',42,5);">Isa 42:5</a>; compare <a onClick="return mV(\'Isa\',40,12,26);">Isa 40:12, 26</a>; <a onClick="return mV(\'Isa\',44,24);">44:24</a>; <a onClick="return mV(\'Isa\',45,18);">45:18</a>; <a onClick="return mV(\'Gen\',1,\'1-\');">Ge 1</a>). All the essential factors of Monotheism are here at last exhibited, not in abstract metaphysical terms, but as practical motives of religious life. His counsel and action are His own (<a onClick="return mV(\'Isa\',40,13);">Isa 40:13</a>) Nothing is hid from Him; and the future like the past is known to Him (<a onClick="return mV(\'Isa\',40,27);">Isa 40:27</a>; <a onClick="return mV(\'Isa\',42,9);">42:9</a>; <a onClick="return mV(\'Isa\',44,8);">44:8</a>; <a onClick="return mV(\'Isa\',48,6);">48:6</a>). Notwithstanding His special association with the temple in Jerusalem, He is "the high and lofty One that inhabiteth eternity"; the heaven is His throne, and no house or place can contain Him (<a onClick="return mV(\'Isa\',57,15);">Isa 57:15</a>; <a onClick="return mV(\'Isa\',66,1);">66:1</a>). No force of history or Nature can withstand His purpose (<a onClick="return mV(\'Isa\',41,\'17-20\');">Isa 41:17-20</a>; <a onClick="return mV(\'Isa\',42,13);">42:13</a>; <a onClick="return mV(\'Isa\',43,13);">43:13</a>). He is "the First and the Last," an "Everlasting God" (<a onClick="return mV(\'Isa\',40,28);">Isa 40:28</a>; <a onClick="return mV(\'Isa\',41,4);">41:4</a>; <a onClick="return mV(\'Isa\',48,12);">48:12</a>). Nothing can be likened to Him or compared with Him (<a onClick="return mV(\'Isa\',46,5);">Isa 46:5</a>). As the heavens are higher than the earth, so His thoughts and ways transcend those of men (<a onClick="return mV(\'Isa\',55,8,9);">Isa 55:8-9</a>). But anthropomorphic and anthropopathic expressions still abound. Eyes, mouth, ears, nostrils, hands, arms and face are His; He is a man of war (<a onClick="return mV(\'Isa\',42,13);">Isa 42:13</a>; <a onClick="return mV(\'Isa\',63,1);">63:1</a>); He cries like a travailing woman (<a onClick="return mV(\'Isa\',42,14);">Isa 42:14</a>), and feeds His flock like a shepherd (<a onClick="return mV(\'Isa\',40,11);">Isa 40:11</a>). Thus, alone could the prophet express His full concrete Divinity.<P>(6) His compassion and love are expressed in a variety of ways that lead up directly to the New Testament doctrine of Divine Fatherhood. He folds Israel in His arms as a shepherd his lambs (<a onClick="return mV(\'Isa\',40,11);">Isa 40:11</a>). Her scattered children are His sons and daughters whom He redeems and restores (<a onClick="return mV(\'Isa\',43,\'5-7\');">Isa 43:5-7</a>). In wrath for a moment He hides His face, but His mercy and kindness are everlasting (<a onClick="return mV(\'Isa\',54,8);">Isa 54:8</a>). Greater than a mother\'s tenderness is Yahweh\'s love for Israel (<a onClick="return mV(\'Isa\',49,15);">Isa 49:15</a>; <a onClick="return mV(\'Isa\',66,13);">66:13</a>). "It would be easy to find in the prophet proof-texts for everything which theology asserts regarding God, with the exception perhaps that He is a spirit, by which is meant that He is a particular kind of substance" (A.B. Davidson in Skinner, Isaiah, II, xxix). But in truth the spirituality and personality of God are more adequately expressed in the living human language of the prophet than in the dead abstractions of metaphysics.<P>6. Idea of God in Post-exilic Judaism:<P>Monotheism appears in this period as established beyond question, and in the double sense that Yahweh the God of Israel is one Being, and that beside Him there is no other God. He alone is God of all the earth, and all other beings stand at an infinite distance from Him (<a onClick="return mV(\'Psa\',18,31);">Ps 18:31</a>; <a onClick="return mV(\'Psa\',24,1);">24:1</a>ff; <a onClick="return mV(\'Psa\',115,3);">115:3</A>). The generic name God is frequently applied to Him, and the tendency appears to avoid the particular and proper name Yahweh (see especially <a onClick="return mV(\'Psa\',73,\'1-\');">Psalms 73-89</a>; Job; Ecclesiastes).<P>(1) New Conditions.<P>Nothing essentially new appears, but the teaching of the prophets is developed under new influences. And what then was enforced by the few has now become the creed of the many. The teaching of the prophets had been enforced by the experiences of the exile. Israel had been punished for her sins of idolatry, and the faithful among the exiles had learned that Yahweh\'s rule extended over many lands and nations. The foreign influences had been more favorable to Monotheism. The gods of Canaan and even of Assyria and Babylonia had been overthrown, and their peoples had given place to the Persians, who, in the religion of Zarathushtra, had advanced nearer to a pure Monotheism than any Gentile race had done; for although they posited two principles of being, the Good and the Evil, they worshipped only Ahura-Mazda, the Good. When Persia gave way to Greece, the more cultured Greek, the Greek who had ideas to disseminate, and who established schools at Antioch or Alexandria, was a pure Monotheist.<P>(2) Divine Attributes.<P>Although we do not yet find anything like a dogmatic account of God\'s attributes, the larger outlook upon the universe and the deeper reflection upon man\'s individual experience have produced more comprehensive and far-reaching ideas of God\'s being and activity. (a) Faith rests upon His eternity and unchangeablehess (<a onClick="return mV(\'Psa\',90,1);">Ps 90:1-2</a>; <a onClick="return mV(\'Psa\',102,27);">102:27</a>). His omniscience and omnipresence are expressed with every possible fullness (<a onClick="return mV(\'Psa\',139,\'1-\');">Ps 139</a>; <a onClick="return mV(\'Job\',26,6);">Job 26:6</a>). His almighty power is at once the confidence of piety, and the rebuke of blasphemy or frowardness (<a onClick="return mV(\'Psa\',74,\'12-17\');">Ps 74:12-17</a>; <a onClick="return mV(\'Psa\',104,\'1-\');">104</a> et passim; <a onClick="return mV(\'Job\',36,\'1-\');">Job 36</a>; <a onClick="return mV(\'Job\',37,\'1-\');">37</a> et passim; Ecclesiasticus 16:17ff). (b) His most exalted and comprehensive attribute is His holiness; by it He swears as by Himself (<a onClick="return mV(\'Psa\',89,35);">Ps 89:35</a>); it expresses His majesty (<a onClick="return mV(\'Psa\',99,3,5,9);">Ps 99:3, 5, 9</A>) and His supreme power (<a onClick="return mV(\'Psa\',60,6);">Ps 60:6</a>).(c) His righteousness marks all His acts in relation to Israel and the nations around her (<a onClick="return mV(\'Psa\',119,\'137-144\');">Ps 119:137-144</a>; <a onClick="return mV(\'Psa\',129,4);">129:4</a>). (d) That both holiness and righteousness were conceived as moral qualities is reflected in the profound sense of sin which the pious knew (<a onClick="return mV(\'Psa\',51,\'1-\');">Ps 51</a>) and revealed in the moral demands associated with them; truth, honesty and fidelity are the qualities of those who shall dwell in God\'s holy hill (<a onClick="return mV(\'Psa\',15,\'1-\');">Ps 15</a>); purity, diligence, kindliness, honesty, humility and wisdom are the marks of the righteous man (<a onClick="return mV(\'Pro\',10,\'1-\');">Pr 10</a>-<a onClick="return mV(\'Pro\',11,\'1-\');">11</a>). (e) In Job and Proverbs wisdom stands forth as the preeminent quality of the ideal man, combining in itself all moral and intellectual excellences, and wisdom comes from God (<a onClick="return mV(\'Pro\',2,6);">Pr 2:6</a>); it is a quality of His nature (<a onClick="return mV(\'Pro\',8,22);">Pr 8:22</a>) and a mode of His activity (<a onClick="return mV(\'Pro\',3,19);">Pr 3:19</a>; <a onClick="return mV(\'Psa\',104,24);">Ps 104:24</a>). In the Hellenistic circles of Alexandria, wisdom was transformed into a philosophical conception, which is at once the principle of God\'s sell-revelation and of His creative activity. Philo identifies it with His master-conception, the Logos. "Both Logos and Wisdom mean for Him the reason and mind of God, His image impressed upon the universe, His agent of creation and providence, the mediator through which He communicates Himself to man and the world, and His law imposed upon both the moral and physical universe" (Mansfield Essays, 296). In the Book of Wisdom it is represented as proceeding from God, "a breath of the power of God, and a clear effulgence of the glory of the Almighty...an unspotted mirror of the working of God, and an image of his goodness" (7:25,26). In man, it is the author of knowledge, virtue and piety, and in the world it has been the guide and arbiter of its destiny from the beginning (chapters 10-12). (f) But in the more purely Hebrew literature of this period, the moral attribute of God that comes into greatest prominence is His beneficence. Goodness and mercy, faithfulness and loving-kindness, forgiveness and redemption are His willing gifts to Israel. "Like as a father pitieth his children, so Yahweh pitieth them that fear him" (<a onClick="return mV(\'Psa\',103,13);">Ps 103:13</a>; <a onClick="return mV(\'Psa\',145,8);">145:8</a>; <a onClick="return mV(\'Psa\',103,8);">103:8</a>; Ecclesiasticus 2:11). To say that God is loving and like a father goes far on the way to the doctrine that He is Love and Father, but not the whole way; for as yet His mercy and grace are manifested only in individual acts, and they are not the natural and necessary outflow of His nature. All these ideas of God meant less for the Jewish than for the Christian mind, because they were yet held subject to several limitations.<P>(3) Surviving Limitations.<P>(a) Disappearing Anthropomorphism:<P>We have evidence of a changed attitude toward anthropomorphisms. God no longer walks on earth, or works under human limitation. Where His eyes or ears or face or hands are spoken of, they are clearly figurative expressions. His activities are universal and invisible, and He dwells on high forevermore. Yet anthropomorphic limitations are not wholly overcome. The idea that He sleeps, though not to be taken literally, implies a defect of His power (<a onClick="return mV(\'Psa\',44,23);">Ps 44:23</a>).<P>(b) Localization:<P>In the metaphysical attributes, the chief limitation was the idea that God\'s dwelling-place on earth was on Mt. Zion in Jerusalem. He was no longer confined within Palestine; His throne is in heaven (<a onClick="return mV(\'Psa\',11,4);">Ps 11:4</a>; <a onClick="return mV(\'Psa\',103,19);">103:19</a>), and His glory above the heavens (<a onClick="return mV(\'Psa\',113,4);">Ps 113:4</a>); but<P class="in15">"In Judah is God known:<P class="in15">His name is great in Israel.<P class="in15">In Salem also is his tabernacle,<P class="in15">And his dwelling-place in Zion"<P class="in15">(<a onClick="return mV(\'Psa\',76,1,2);">Ps 76:1-2</a>; <a onClick="return mV(\'Psa\',110,2);">110:2</a>; compare Ecclesiasticus 24:8ff).<P>That these are no figures of speech is manifested in the yearning of the pious for the temple, and their despair in separation from it (<a onClick="return mV(\'Psa\',42,\'1-\');">Pss 42</a>; <a onClick="return mV(\'Psa\',43,\'1-\');">43</a>; compare <a onClick="return mV(\'Psa\',122,\'1-\');">122</A>).<P>(c) Favoritism:<P>This involved a moral limitation, the sense of God\'s favoritism toward Israel, which sometimes developed into an easy self-righteousness that had no moral basis. God\'s action in the world was determined by His favor toward Israel, and His loving acts were confined within the bounds of a narrow nationalism. Other nations are wicked and sinners, adversaries and oppressors, upon whom God is called to execute savage vengeance (<a onClick="return mV(\'Psa\',109,\'1-\');">Ps 109</a>; <a onClick="return mV(\'Psa\',137,\'7-9\');">137:7-9</a>). Yet Israel did not wholly forget that it was the servant of Yahweh to proclaim His name among the nations (<a onClick="return mV(\'Psa\',96,2,3);">Ps 96:2-3</a>). Yahweh is good to all, and His tender mercies are over all His works (<a onClick="return mV(\'Psa\',145,9);">Ps 145:9</a>; Ecclesiasticus 18:13; compare <a onClick="return mV(\'Psa\',104,14);">Ps 104:14</a>; <a onClick="return mV(\'Zec\',14,16);">Zec 14:16</a>, and the Book of Jonah, which is a rebuke to Jewish particularism).<P>(d) Ceremonial Legalism:<P>God\'s holiness in the hands of the priests tended to become a material and formal quality, which fulfilled itself in established ceremonial, and His righteousness in the hands of the scribes tended to become an external law whose demands were satisfied by a mechanical obedience of works. This external conception of righteousness reacted upon the conception of God\'s government of the world. From the earliest times the Hebrew mind had associated suffering with the punishment of sin, and blessedness with the reward of virtue. In the post-exilic age the relation came to be thought of as one of strict correspondence between righteousness and reward and between sin and punishment. Righteousness, both in man and God, was not so much a moral state as a measurable sum of acts, in the one case, of obedience, and in the other, of reward or retribution. Conversely, every calamity and evil that befell men came to be regarded as the direct and equivalent penalty of a sin they had committed. The Book of Job is a somewhat inconclusive protest against this prevalent view.<P>These were the tendencies that ultimately matured into the narrow externalism of the scribes and Pharisees of our Lord\'s time, which had substituted for the personal knowledge and service of God a system of mechanical acts of worship and conduct.<P>(4) Tendencies to Abstractness:<P>Behind these defective ideas of God\'s attributes stood a more radical defect of the whole religious conception. The purification of the religion of Israel from Polytheism and idolatry, the affirmation of the unity of God and of His spirituality, required His complete separation from the manifoldness of visible existence. It was the only way, until the more adequate idea of a personal or spiritual unity, that embraced the manifold in itself, was developed. But it was an unstable conception, which tended on the one hand to empty the unity of all reality, and on the other to replace it by a new multiplicity which was not a unity. Both tendencies appear in post-exilic Judaism.<P>(a) Transcendence:<P>The first effect of distinguishing too sharply between God and all created being was to set Him above and apart from all the world. This tendency had already appeared in Ezekiel, whose visions were rather symbols of God\'s presence than actual experiences of God. In Daniel even the visions appear only in dreams. The growth of the Canon of sacred literature as the final record of the law of God, and the rise of the scribes as its professional interpreters, signified that God need not, and would not, speak face to face with man again; and the stricter organization of the priesthood and its sacrificial acts in Jerusalem tended to shut men generally out from access to God, and to reduce worship into a mechanical performance. A symptom of this fact was the disuse of the personal name Yahweh and the substitution for it of more general and abstract terms like God and Lord.<P>(b) Skepticism:<P>Not only an exaggerated awe, but also an element of skepticism, entered into the disuse of the proper name, a sense of the inadequacy of any name. In the Wisdom literature, God\'s incomprehensibility and remoteness appear for the first time as a conscious search after Him and a difficulty to find Him (<a onClick="return mV(\'Job\',16,\'18-21\');">Job 16:18-21</a>; <a onClick="return mV(\'Job\',23,3,8,9);">23:3, 8-9</a>; <a onClick="return mV(\'Pro\',30,\'2-4\');">Pr 30:2-4</a>). Even the doctrine of immortality developed with the sense of God\'s present remoteness and the hope of His future nearness (<a onClick="return mV(\'Psa\',17,15);">Ps 17:15</a>; <a onClick="return mV(\'Job\',19,25);">Job 19:25</a>). But Jewish theology was no cold Epicureanism or rationalistic Deism. Men\'s religious experiences apprehended God more intimately than their theology professed.<P>(c) Immanence:<P>By a "happy inconsistency" (Montefiore) they affirmed His immanence both in Nature (<a onClick="return mV(\'Psa\',104,\'1-\');">Ps 104</a>; The <span class="noTag">Wisdom of Solomon 8:1; 12:1,2</span>) and in man\'s inner experience (<a onClick="return mV(\'Pro\',15,3,11);">Pr 15:3, 11</a>; <a onClick="return mV(\'1Ch\',28,9);">1Ch 28:9</a>; <a onClick="return mV(\'1Ch\',29,17,18);">29:17-18</a>). Yet that transcendence was the dominating thought is manifest, most of all, in the formulation of a number of mediating conceptions, which, while they connected God and the world, also revealed the gulf that separated them.<P>(5) Logos, Memra\' and Angels:<P>This process of abstraction had gone farthest in Alexandria, where Jewish thought had so far assimilated Platonic philosophy, that Philo and Wisdom conceive God as pure being who could not Himself come into any contact with the material and created world. His action and revelation are therefore mediated by His Powers, His Logos and His Wisdom, which, as personified or hypostatized attributes, become His vicegerents on earth. But in Palestine, too many mediating agencies grew up between God and man. The memra\', or word of God, was not unlike Philo\'s Logos. The deified law partly corresponded to Alexandrian Wisdom. The Messiah had already appeared in the Prophets, and now in some circles He was expected as the mediator of God\'s special favor to Israel. The most important and significant innovation in this connection was the doctrine of angels. It was not entirely new, and Babylonian and Persian influences may have contributed to its development; but its chief cause lay in the general scheme of thought. Angels became intermediaries of revelation (<a onClick="return mV(\'Zec\',1,9,12,19);">Zec 1:9, 12, 19</a>; <a onClick="return mV(\'Zec\',3,1);">3:1</a>), the instruments of God\'s help (<a onClick="return mV(\'Dan\',3,28);">Da 3:28</a>; 2Macc 11:6), and of His punishment (Baruch 21:23). The ancient gods of the nations became their patron angels (<a onClick="return mV(\'Dan\',10,\'13-20\');">Dan 10:13-20</a>); but Israel\'s hatred of their Gentile enemies often led to their transforming the latter\'s deities into demons. Incidentally a temporary solution of the problem of evil was thus found, by shifting all responsibility for evil from Yahweh to the demons. The unity and supremacy of God were maintained by the doubtful method of delegating His manifold, and especially His contradictory, activities to subordinate and partially to hostile spirits, which involved a new Polytheism. The problem of the One and the Many in ultimate reality cannot be solved by merely separating them. Hebrew Monotheism was unstable; it maintained its own truth even partially by affirming contradictories, and it contained in itself the demand for a further development. The few pluralistic phrases in the Old Testament (as <a onClick="return mV(\'Gen\',1,26);">Ge 1:26</a>; <a onClick="return mV(\'Gen\',3,22);">3:22</a>; <a onClick="return mV(\'Gen\',11,7);">11:7</a>; <a onClick="return mV(\'Isa\',6,8);">Isa 6:8</a>, and \'Elohim) are not adumbrations of the Trinity, but only philological survivals. But the Messianic hope was an open confession of the incompleteness of the Old Testament revelation of God.``145';
isbe[3852]='God, 3`III. The Idea of God in the New Testament.<P>1. Dependence on the Old Testament:<P>The whole of the New Testament presupposes and rests upon the Old Testament. Jesus Christ and His disciples inherited the idea of God revealed in the Old Testament, as it survived in the purer strata of Jewish religion. So much was it to them and their contemporaries a matter of course, that it never occurred to them to proclaim or enforce the idea of God. Nor did they consciously feel the need of amending or changing it. They sought to correct some fallacious deductions made by later Judaism, and, unconsciously, they dropped the cruder anthropomorphisms and limitations of the Old Testament idea. But their point of departure was always the higher teaching of the prophets and Psalms, and their conscious endeavor in presenting God to men was to fulfill the Law and the Prophets (<a onClick="return mV(\'Mat\',5,17);">Mt 5:17</a>). All the worthier ideas concerning God evolved in the Old Testament reappear in the New Testament. He is One, supreme, living, personal and spiritual, holy, righteous and merciful. His power and knowledge are all-sufficient, and He is not limited in time or place. Nor can it be said that any distinctly new attributes are ascribed to God in the New Testament. Yet there is a difference. The conception and all its factors are placed in a new relation to man and the universe, whereby their meaning is transformed, enhanced and enriched. The last trace of particularism, with its tendency to Polytheism, disappears. God can no longer bear a proper name to associate Him with Israel, or to distinguish Him from other gods, for He is the God of all the earth, who is no respecter of persons or nations. Two new elements entered men\'s religious thought and gradually lifted its whole content to a new plane—Jesus Christ\'s experience and manifestation of the Divine Fatherhood, and the growing conviction of the church that Christ Himself was God and the full and final revelation of God.<P>2. Gentile Influence:<P>Greek thought may also have influenced New Testament thought, but in a comparatively insignificant and subordinate way. Its content was not taken over bodily as was that of Hebrew thought, and it did not influence the fountain head of New Testament ideas. It did not color the mind and teaching of Jesus Christ. It affected the form rather than matter of New Testament teaching. It appears in the clear-cut distinction between flesh and spirit, mind and body, which emerges in Paul\'s Epistles, and so it helped to define more accurately the spirituality of God. The idea of the Logos in John, and the kindred idea of Christ as the image of God in Paul and He, owe something to the influence of the Platonic and Stoic schools. As this is the constructive concept employed in the New Testament to define the religious significance of Christ and His essential relation to God, it modifies the idea of God itself, by introducing a distinction within the unity into its innermost meaning.<P>3. Absence of Theistic Proofs:<P>Philosophy never appears in the New Testament on its own account, but only as subservient to Christian experience. In the New Testament as in the Old Testament, the existence of God is taken for granted as the universal basis of all life and thought. Only in three passages of Paul\'s, addressed to heathen audiences, do we find anything approaching a natural theology, and these are concerned rather with defining the nature of God, than with proving His existence. When the people of Lystra would have worshipped Paul and Barnabas as heathen gods, the apostle protests that God is not like men, and bases His majesty upon His creatorship of all things (<a onClick="return mV(\'Act\',14,15);">Ac 14:15</a>). He urges the same argument at Athens, and appeals for its confirmation to the evidences of man\'s need of God which he had found in Athens itself (<a onClick="return mV(\'Act\',17,\'23-31\');">Ac 17:23-31</a>). The same natural witness of the soul, face to face with the universe, is again in Romans made the ground of universal responsibility to God (<a onClick="return mV(\'Act\',1,\'18-21\');">Ac 1:18-21</a>). No formal proof of God\'s existence is offered in the New Testament. Nor are the metaphysical attributes of God, His infinity, omnipotence and omniscience, as defined in systematic theology, at all set forth in the New Testament. The ground for these deductions is provided in the religious experience that finds God in Christ all-sufficient.<P>4. Fatherhood of God:<P>The fundamental and central idea about God in New Testament teaching is His Fatherhood, and it determines all that follows. In some sense the idea was not unknown to heathen religions. Greeks and Romans acknowledged Father Zeus or Jupiter as the creator and preserver of Nature, and as standing in some special relation to men. In the Old Testament the idea appears frequently, and has a richer content. Not only is God the creator and preserver of Israel, but He deals with her as a father with his child. "Like as a father pitieth his children, so Yahweh pitieth them that fear Him" (<a onClick="return mV(\'Psa\',103,13);">Ps 103:13</a>; compare <a onClick="return mV(\'Deu\',1,31);">De 1:31</a>; <a onClick="return mV(\'Jer\',3,4,19);">Jer 3:4, 19</a>; <a onClick="return mV(\'Jer\',31,20);">31:20</a>; <a onClick="return mV(\'Isa\',63,16);">Isa 63:16</a>; <a onClick="return mV(\'Hsa\',11,1);">Ho 11:1</a>; <a onClick="return mV(\'Mal\',3,17);">Mal 3:17</a>). Even His chastisements are "as a man chasteneth his son" (<a onClick="return mV(\'Deu\',8,5);">De 8:5</a>; <a onClick="return mV(\'Isa\',64,8);">Isa 64:8</a>). The same idea is expressed under the figure of a mother\'s tender care (<a onClick="return mV(\'Isa\',49,15);">Isa 49:15</a>; <a onClick="return mV(\'Isa\',66,13);">66:13</a>; <a onClick="return mV(\'Psa\',27,10);">Ps 27:10</a>), and it is embedded in the covenant relation. But in the Old Testament the idea does not occupy the central and determinative position it has in New Testament, and it is always limited to Israel.<P>(1) In the Teaching of Jesus Christ:<P>God is preeminently the Father. It is his customary term for the Supreme Being, and it is noteworthy that Jesus\' usage has never been quite naturalized. We still say "God" where Jesus would have said "the Father." He meant that the essential nature of God, and His relation to men, is best expressed by the attitude and relation of a father to his children; but God is Father in an infinitely higher and more perfect degree than any man. He is "good" and "perfect," the heavenly Father, in contrast with men, who, even as fathers, are evil (<a onClick="return mV(\'Mat\',5,48);">Mt 5:48</a>; <a onClick="return mV(\'Mat\',7,11);">7:11</a>). What in them is an ideal imperfectly and intermittently realized, is in Him completely fulfilled. Christ thought not of the physical relation of origin and derivation, but of the personal relation of love and care which a father bestows upon his children. The former relation is indeed implied, for the Father is ever working in the world (<a onClick="return mV(\'Jhn\',5,17);">Joh 5:17</a>), and all things lie in His power (<a onClick="return mV(\'Luk\',22,42);">Lu 22:42</a>). By His preserving power, the least as well as the greatest creature lives (<a onClick="return mV(\'Mat\',6,26);">Mt 6:26</a>; <a onClick="return mV(\'Mat\',10,29);">10:29</a>). But it is not the fact of God\'s creative, preserving and governing power, so much as the manner of it, that Christ emphasizes. He is absolutely good in all His actions and relations (<a onClick="return mV(\'Mat\',7,11);">Mt 7:11</a>; <a onClick="return mV(\'Mar\',10,18);">Mr 10:18</a>). To Him men and beasts turn for all they need, and in Him they find safety, rest and peace (<a onClick="return mV(\'Mat\',6,26,32);">Mt 6:26, 32</a>; <a onClick="return mV(\'Mat\',7,11);">7:11</a>). His goodness goes forth spontaneously and alights upon all living things, even upon the unjust and His enemies (<a onClick="return mV(\'Mat\',5,45);">Mt 5:45</a>). He rewards the obedient (<a onClick="return mV(\'Mat\',6,1);">Mt 6:1</a>; <a onClick="return mV(\'Mat\',7,21);">7:21</a>), forgives the disobedient (<a onClick="return mV(\'Mat\',6,14);">Mt 6:14</a>; compare <a onClick="return mV(\'Mat\',18,35);">Mt 18:35</a>) and restores the prodigal (<a onClick="return mV(\'Luk\',15,11);">Lu 15:11</a>)." Fatherhood is love, original and underived, anticipating and undeserved, forgiving and educating, communicating and drawing to his heart" (Beyschlag, New Testament Theology, I, 82). To the Father, therefore, should men pray for all good things (<a onClick="return mV(\'Mat\',6,9);">Mt 6:9</a>), and He is the ideal of all perfection, to which they should seek to attain (<a onClick="return mV(\'Mat\',5,48);">Mt 5:48</a>). Such is the general character of God as expressed in His Fatherhood, but it is realized in different ways by those who stand to Him in different relations.<P>(a) Its Relation to Himself:<P>Jesus Christ knows the Father as no one else does, and is related to Him in a unique manner. The idea is central in His teaching, because the fact is fundamental in His experience. On His first personal appearance in history He declares that He must be about His Father\'s business (<a onClick="return mV(\'Luk\',2,49);">Lu 2:49</a>), and at the last He commends His spirit into His Father\'s hands. Throughout His life, His filial consciousness is perfect and unbroken. "I and the Father are one" (<a onClick="return mV(\'Jhn\',10,30);">Joh 10:30</a>). As He knows the Father, so the Father knows and acknowledges Him. At the opening of His ministry, and again at its climax in the transfiguration, the Father bears witness to His perfect sonship (<a onClick="return mV(\'Mar\',1,11);">Mr 1:11</a>; <a onClick="return mV(\'Mar\',9,7);">9:7</a>). It was a relation of mutual love and confidence, unalloyed and infinite. "The Father loveth the Son, and hath given all things into his hand" (<a onClick="return mV(\'Jhn\',3,35);">Joh 3:35</a>; <a onClick="return mV(\'Jhn\',5,20);">5:20</a>). The Father sent the Son into the world, and entrusted Him with his message and power (<a onClick="return mV(\'Mat\',11,27);">Mt 11:27</a>). He gave Him those who believed in Him, to receive His word (<a onClick="return mV(\'Jhn\',6,37,44,45);">Joh 6:37, 44-45</a>; <a onClick="return mV(\'Jhn\',17,6,8);">17:6, 8</a>). He does the works and speaks the words of the Father who sent Him (<a onClick="return mV(\'Jhn\',5,36);">Joh 5:36</a>; <a onClick="return mV(\'Jhn\',8,18,29);">8:18, 29</a>; <a onClick="return mV(\'Jhn\',14,24);">14:24</a>). His dependence upon the Father, and His trust in Him are equally complete (<a onClick="return mV(\'Jhn\',11,41);">Joh 11:41</a>; <a onClick="return mV(\'Jhn\',12,27);">12:27</a>f; <a onClick="return mV(\'Jhn\',17,\'1-\');">17</A>). In this perfect union of Christ. with God, unclouded by sin, unbroken by infidelity, God first became for a human life on earth all that He could and would become. Christ\'s filial consciousness was in fact and experience the full and final revelation of God. "No one knoweth the Son, save the Father; neither doth any know the Father, save the Son, and he to whomsoever the Son willeth to reveal him" (<a onClick="return mV(\'Mat\',11,27);">Mt 11:27</a>). Not only can we see in Christ what perfect sonship is, but in His filial consciousness the Father Himself is so completely reflected that we may know the perfect Father also. "He that hath seen me hath seen the Father" (<a onClick="return mV(\'Jhn\',14,9);">Joh 14:9</a>; compare <a onClick="return mV(\'Jhn\',8,19);">Joh 8:19</a>). Nay, it is more than a reflection: so completely is the mind and will of Christ identified with that of the Father, that they interpenetrate, and the words and works of the Father shine out through Christ. "The words that I say unto you I speak not from myself: but the Father abiding in me doeth his works. Believe me that I am in the Father, and the Father in me" (<a onClick="return mV(\'Jhn\',14,10,11);">Joh 14:10-11</a>). As the Father, so is the Son, for men to honor or to hate (<a onClick="return mV(\'Jhn\',5,23);">Joh 5:23</a>; <a onClick="return mV(\'Jhn\',15,23);">15:23</a>). In the last day, when He comes to execute the judgment which the Father has entrusted to Him, He shall come in the glory of the Father (<a onClick="return mV(\'Mat\',16,27);">Mt 16:27</a>; <a onClick="return mV(\'Mar\',8,38);">Mr 8:38</a>; <a onClick="return mV(\'Luk\',9,26);">Lu 9:26</a>). In all this Jesus is aware that His relation to the Father is unique. What in Him is original and realized, in others can only be an ideal to be gradually realized by His communication. "I am the way, and the truth, and the life: no one cometh unto the Father, but by me" (<a onClick="return mV(\'Jhn\',14,6);">Joh 14:6</a>). He is, therefore, rightly called the "only begotten son" (<a onClick="return mV(\'Jhn\',3,16);">Joh 3:16</a>), and His contemporaries believed that He made Himself equal to God (<a onClick="return mV(\'Jhn\',5,18);">Joh 5:18</a>).<P>(b) To Believers:<P>Through Christ, His disciples and hearers, too, may know God as their Father. He speaks of "your Father," "your heavenly Father." To them as individuals, it means a personal relation; He is "thy Father" (<a onClick="return mV(\'Mat\',6,4,18);">Mt 6:4, 18</a>). Their whole conduct should be determined by the consciousness of the Father\'s intimate presence (<a onClick="return mV(\'Mat\',6,1,4);">Mt 6:1, 4</a>). To do His will is the ideal of life (<a onClick="return mV(\'Mat\',7,21);">Mt 7:21</a>; <a onClick="return mV(\'Mat\',12,50);">12:50</a>). More explicitly, it is to act as He does, to love and forgive as He loves and forgives (<a onClick="return mV(\'Mat\',5,45);">Mt 5:45</a>); and, finally, to be perfect as He is perfect (<a onClick="return mV(\'Mat\',5,48);">Mt 5:48</a>). Thus do men become sons of their Father who is in heaven. Their peace and safety lay in their knowledge of His constant and all-sufficient care (<a onClick="return mV(\'Mat\',6,26,32);">Mt 6:26, 32</a>). The ultimate goal of men\'s relation to Christ is that through Him they should come to a relation with the Father like His relation both to the Father and to them, wherein Father, Son, and believers form a social unity (<a onClick="return mV(\'Jhn\',14,21);">Joh 14:21</a>; <a onClick="return mV(\'Jhn\',17,23);">17:23</a>; compare <a onClick="return mV(\'Jhn\',17,21);">Joh 17:21</a>).<P>(c) To All Men:<P>While God\'s fatherhood is thus realized and revealed, originally and fully in Christ, derivatively and partially in believers, it also has significance for all men. Every man is born a child of God and heir of His kingdom (<a onClick="return mV(\'Luk\',18,16);">Lu 18:16</a>). During childhood, aIl men are objects of His fatherly love and care (<a onClick="return mV(\'Mat\',18,10);">Mt 18:10</a>), and it is not His will that one of them should perish (<a onClick="return mV(\'Mat\',18,14);">Mt 18:14</a>). Even if they become His enemies, He still bestows His beneficence upon the evil and the unjust (<a onClick="return mV(\'Mat\',5,44,45);">Mt 5:44-45</a>; <a onClick="return mV(\'Luk\',6,35);">Lu 6:35</a>). The prodigal son may become unworthy to be called a son, but the father always remains a father. Men may become so far unfaithful that in them the fatherhood is no longer manifest and that their inner spirits own not God, but the devil, as their father (<a onClick="return mV(\'Jhn\',8,\'42-44\');">Joh 8:42-44</a>). So their filial relation to God may be broken, but His nature and attitude are not changed. He is the Father absolutely, and as Father is He perfect (<a onClick="return mV(\'Mat\',5,48);">Mt 5:48</a>). The essential and universal Divine Fatherhood finds its eternal and continual object in the only begotten Son who is in the bosom of the Father. As a relation with men, it is qualified by their attitude to God; while some by faithlessness make it of no avail, others by obedience become in the reality of their experience sons of their Father in heaven.<P>See <a href="study/isbe/search.html?string=CHILDREN+OF+GOD">CHILDREN OF GOD</a>.<P>(2) In Apostolic Teaching:<P>In the apostolic teaching, although the Fatherhood of God is not so prominently or so abundantly exhibited as it was by Jesus Christ, it lies at the root of the whole system of salvation there presented. Paul\'s central doctrine of justification by faith is but the scholastic form of the parable of the Prodigal Son. John\'s one idea, that God is love, is but an abstract statement of His fatherhood. In complete accord with Christ\'s teaching, that only through Himself men know the Father and come to Him, the whole apostolic system of grace is mediated through Christ the Son of God, sent because "God so loved the world" (<a onClick="return mV(\'Jhn\',3,16);">Joh 3:16</a>), that through His death men might be reconciled to God (<a onClick="return mV(\'Rom\',5,10);">Ro 5:10</a>; <a onClick="return mV(\'Rom\',8,3);">8:3</a>). He speaks to men through the Son who is the effulgence of His glory, and the very image of His substance (<a onClick="return mV(\'Hbr\',1,2,3);">Heb 1:2-3</a>). The central position assigned to Christ involves the central position of the Fatherhood.<P>As in the teaching of Jesus, so in that of the apostles, we distinguish three different relationships in which the fatherhood is realized in varying degrees:<P>(a) Father of Jesus Christ:<P>Primarily He is the God and Father of our Lord Jesus Christ (<a onClick="return mV(\'Rom\',15,6);">Ro 15:6</a>; <a onClick="return mV(\'2Cr\',1,3);">2Co 1:3</a>). As such He is the source of every spiritual blessing in the heavenly places in Christ (<a onClick="return mV(\'Eph\',1,3);">Eph 1:3</a>). Through Christ we have access unto the Father (<a onClick="return mV(\'Eph\',2,18);">Eph 2:18</a>).<P>(b) Our Father:<P>He is, therefore, God our Father (<a onClick="return mV(\'Rom\',1,7);">Ro 1:7</a>; <a onClick="return mV(\'1Cr\',1,3);">1Co 1:3</a>). Believers are sons of God through faith in Christ Jesus (<a onClick="return mV(\'Gal\',3,26);">Ga 3:26</a>). "For as many as are led by the Spirit of God, these are sons of God" (<a onClick="return mV(\'Rom\',8,14);">Ro 8:14</a>). These receive the spirit of adoption whereby they cry, Abba, Father (<a onClick="return mV(\'Rom\',8,15);">Ro 8:15</a>; <a onClick="return mV(\'Gal\',4,6);">Ga 4:6</a>). The figure of adoption has sometimes been understood as implying the denial of man\'s natural sonship and God\'s essential Fatherhood, but that would be pressing the figure beyond Paul\'s purpose.<P>(c) Universal Father:<P>The apostles\' teaching, like Christ\'s, is that man in sin cannot possess the filial consciousness or know God as Father; but God, in His attitude to man, is always and essentially Father. In the sense of creaturehood and dependence, man in any condition is a son of God (<a onClick="return mV(\'Act\',17,28);">Ac 17:28</a>). And to speak of any other natural sonship which is not also morally realized is meaningless. From God\'s standpoint, man even in his sin is a possible son, in the personal and moral sense; and the whole process and power of his awakening to the realization of his sonship issues from the fatherly love of God, who sent His Son and gave the Spirit (<a onClick="return mV(\'Rom\',5,5);">Ro 5:5, 8</a>). He is "the Father" absolutely, "one God and Father of all, who is over all, and through all, and in all. But unto each one of us was the grace given according to the measure of the gift of Christ" (<a onClick="return mV(\'Eph\',4,6,7);">Eph 4:6-7</a>).<P>5. God is King:<P>After the Divine Fatherhood, the kingdom of God (Mark and Luke) or of heaven (Matthew) is the next ruling conception in the teaching of Jesus. As the doctrine of the Fatherhood sets forth the individual relation of men to God, that of the kingdom defines their collective and social condition, as determined by the rule of the Father.<P>(1) The Kingdom of God:<P>Christ adopted and transformed the Old Testament idea of Yahweh\'s rule into an inner and spiritual principle of His gospel, without, however, quite detaching it from the external and apocalyptic thought of His time. He adopts the Jewish idea in so far as it involves the enforcing of God\'s rule; and in the immediate future He anticipates such a reorganization of social conditions in the manifestation of God\'s reign over men and Nature, as will ultimately amount to a regeneration of all things in accordance with the will of God (<a onClick="return mV(\'Mar\',9,1);">Mr 9:1</a>; <a onClick="return mV(\'Mar\',13,30);">13:30</a>; <a onClick="return mV(\'Mat\',16,28);">Mt 16:28</a>; <a onClick="return mV(\'Mat\',19,28);">19:28</a>). But He eliminated the particularism and favoritism toward the Jews, as well as the non-moral, easy optimism as to their destiny in the kingdom, which obtained in contemporary thought. The blessings of the kingdom are moral and spiritual in their nature, and the conditions of entrance into it are moral too (<a onClick="return mV(\'Mat\',8,11);">Mt 8:11</a>; <a onClick="return mV(\'Mat\',21,31,43);">21:31, 43</a>; <a onClick="return mV(\'Mat\',23,37);">23:37-38</a>; <a onClick="return mV(\'Luk\',13,29);">Lu 13:29</a>). They are humility, hunger and thirst after righteousness, and the love of mercy, purity and peace (<a onClick="return mV(\'Mat\',5,\'3-10\');">Mt 5:3-10</a>; <a onClick="return mV(\'Mat\',18,1,3);">18:1, 3</a>; compare <a onClick="return mV(\'Mat\',20,\'26-28\');">Mt 20:26-28</a>; <a onClick="return mV(\'Mat\',25,34);">25:34</a>; <a onClick="return mV(\'Mat\',7,21);">7:21</a>; <a onClick="return mV(\'Jhn\',3,3);">Joh 3:3</a>; <a onClick="return mV(\'Luk\',17,20,21);">Lu 17:20-21</a>). The king of such a kingdom is, therefore, righteous, loving and gracious toward all men; He governs by the inner communion of spirit with spirit and by the loving coordination of the will of His subjects with his own will.<P>(2) Its King:<P>But who is the king?<P>(a) God:<P>Generally in Mark and Luke, and sometimes in Matthew, it is called the kingdom of God. In several parables, the Father takes the place of king, and it is the Father that gives the kingdom (<a onClick="return mV(\'Luk\',12,32);">Lu 12:32</a>). God the Father is therefore the King, and we are entitled to argue from Jesus\' teaching concerning the kingdom to His idea of God. The will of God is the law of the kingdom, and the ideal of the kingdom is, therefore, the character of God.<P>(b) Christ:<P>But in some passages Christ reveals the consciousness of his own Kingship. He approves Peter\'s confession of his Messiahship, which involves Kingship (<a onClick="return mV(\'Mat\',16,16);">Mt 16:16</a>). He speaks of a time in the immediate future when men shall see "the Son of man coming in his kingdom" (<a onClick="return mV(\'Mat\',16,28);">Mt 16:28</a>). As judge of all men, He designates Himself king (<a onClick="return mV(\'Mat\',25,34);">Mt 25:34</a>; <a onClick="return mV(\'Luk\',19,38);">Lu 19:38</a>). He accepts the title king from Pilate (<a onClick="return mV(\'Mat\',27,11,12);">Mt 27:11-12</a>; <a onClick="return mV(\'Mar\',15,2);">Mr 15:2</a>; <a onClick="return mV(\'Luk\',23,3);">Lu 23:3</a>; <a onClick="return mV(\'Jhn\',18,37);">Joh 18:37</a>), and claims a kingdom which is not of this world (<a onClick="return mV(\'Jhn\',18,36);">Joh 18:36</a>). His disciples look to Him for the restoration of the kingdom (<a onClick="return mV(\'Act\',1,6);">Ac 1:6</a>). His kingdom, like that of God, is inner, moral and spiritual.<P>(c) Their Relation:<P>But there can be only one moral kingdom, and only one supreme authority in the spiritual realm. The coordination of the two kingships must be found in their relation to the Fatherhood. The two ideas are not antithetical or even independent. They may have been separate and even opposed as Christ found them, but He used them as two points of apperception in the minds of His hearers, by which He communicated to them His one idea of God, as the Father who ruled a spiritual kingdom by love and righteousness, and ordered Nature and history to fulfill His purpose of grace. Men\'s prayer should be that the Father\'s kingdom may come (<a onClick="return mV(\'Mat\',6,9,10);">Mt 6:9-10</a>). They enter the kingdom by doing the Father\'s will (<a onClick="return mV(\'Mat\',7,21);">Mt 7:21</a>). It is their Father\'s good pleasure to give them the kingdom (<a onClick="return mV(\'Luk\',12,32);">Lu 12:32</a>). The Fatherhood is primary, but it carries with it authority, government, law and order, care and provision, to set up and organize a kingdom reflecting a Father\'s love and expressing His will.<P>And as Christ is the revealer and mediator of the Fatherhood, He also is the messenger and bearer of the kingdom. In his person, preaching and works, the kingdom is present to men (<a onClick="return mV(\'Mat\',4,17,23);">Mt 4:17, 23</a>; <a onClick="return mV(\'Mat\',12,28);">12:28</a>), and as its king He claims men\'s allegiance and obedience (<a onClick="return mV(\'Mat\',11,28,29);">Mt 11:28-29</a>). His sonship constitutes His relation to the kingdom. As son He obeys the Father, depends upon Him, represents Him to men, and is one with Him. And in virtue of this relation, He is the messenger of the kingdom and its principle, and at the same time He shares with the Father its authority and Kingship.<P>(3) Apostolic Teaching:<P>In the apostolic writings, the emphasis upon the elements of kingship, authority, law and righteousness is greater than in the gospels. The kingdom is related to God (<a onClick="return mV(\'Col\',4,11);">Col 4:11</a>; <a onClick="return mV(\'1Th\',2,12);">1Th 2:12</a>; <a onClick="return mV(\'2Th\',1,5);">2Th 1:5</a>), and to Christ (<a onClick="return mV(\'Col\',1,13);">Col 1:13</a>; <a onClick="return mV(\'2Ti\',4,1,18);">2Ti 4:1, 18</a>; <a onClick="return mV(\'2Pe\',1,11);">2Pe 1:11</a>), and to both together (<a onClick="return mV(\'Eph\',5,5);">Eph 5:5</a>; compare <a onClick="return mV(\'1Cr\',15,24);">1Co 15:24</a>). The phrase "the kingdom of the Son of his love" sums up the idea of the joint kingship, based upon the relation of Father and Son.<P>6. Moral Attributes:<P>The nature and character of God are summed up in the twofold relation of Father and King in which He stands to men, and any abstract statements that may be made about Him, any attributes that may be ascribed to Him, are deductions from His royal Fatherhood.<P>(1) Personality:<P>That a father and king is a person needs not to be argued, and it is almost tautology to say that a person is a spirit. Christ relates directly the spirituality of God to His Fatherhood. "The true worshippers shall worship the Father in spirit and truth: for such doth the Father seek to be his worshippers. God is Spirit" (<a onClick="return mV(\'Jhn\',4,23,24);">Joh 4:23-24</a> margin). Figurative expressions denoting the same truth are the Johannine phrases, \'God is life\' (<a onClick="return mV(\'1Jo\',5,20);">1Joh 5:20</a>), and "God is light" (<a onClick="return mV(\'1Jo\',1,5);">1Joh 1:5</a>).<P>(2) Love:<P>Love is the most characteristic attribute of Fatherhood. It is the abstract term that most fully expresses the concrete character of God as Father. In John\'s theology, it is used to sum up all God\'s perfections in one general formula. God is love, and where no love is, there can be no knowledge of God and no realization of Him (<a onClick="return mV(\'1Jo\',4,8),16;">1Joh 4:8, 16</a>). With one exception (<a onClick="return mV(\'Luk\',11,42);">Lu 11:42</a>), the phrase "the love of God" appears in the teaching of Jesus only as it is represented in the Fourth Gospel. There it expresses the bond of union and communion, issuing from God, that holds together the whole spiritual society, God, Christ and believers (<a onClick="return mV(\'Jhn\',10,\'1-\');">Joh 10</a>; <a onClick="return mV(\'Jhn\',14,21);">14:21</a>). Christ\'s mission was that of revelation, rather than of interpretation, and what in person and act He represents before men as the living Father, the apostles describe as almighty and universal love. They saw and realized this love first in the Son, and especially in His sacrificial death. It is "the love of God, which is in Christ Jesus our Lord" (<a onClick="return mV(\'Rom\',8,39);">Ro 8:39</a>). "God commendeth his own love toward us, in that, while we were yet sinners, Christ died for us" (<a onClick="return mV(\'Rom\',5,8);">Ro 5:8</a>; compare <a onClick="return mV(\'Eph\',2,4);">Eph 2:4</a>). Love was fully made known in Christ\'s death (<a onClick="return mV(\'1Jo\',3,16);">1Joh 3:16</a>). The whole process of the incarnation and death of Christ was also a sacrifice of God\'s and the one supreme manifestation of His nature as love (<a onClick="return mV(\'1Jo\',4,9,10);">1Joh 4:9-10</a>; compare <a onClick="return mV(\'Jhn\',3,16);">Joh 3:16</a>). The love of God is His fatherly relation to Christ extended to men through Christ. By the Father\'s love bestowed upon us, we are called children of God (<a onClick="return mV(\'1Jo\',3,1);">1Joh 3:1</a>). Love is not only an emotion of tenderness and beneficence which bestows on men the greatest gifts, but a relation to God which constitutes their entire law of life. It imposes upon men the highest moral demands, and communicates to them the moral energy by which alone they can be met. It is law and grace combined. The love of God is perfected only in those who keep the word of Jesus Christ the Righteous (<a onClick="return mV(\'1Jo\',2,5);">1Joh 2:5</a>). "For this is the love of God, that we keep his commandments" (<a onClick="return mV(\'1Jo\',5,3);">1Joh 5:3</a>). It is manifested especially in brotherly love (<a onClick="return mV(\'1Jo\',4,12,20);">1Joh 4:12, 20</a>). It cannot dwell with worldliness (<a onClick="return mV(\'1Jo\',2,15);">1Joh 2:15</a>) or callous selfishness (<a onClick="return mV(\'1Jo\',3,17);">1Joh 3:17</a>). Man derives it from God as he is made the son of God, begotten of Him (<a onClick="return mV(\'1Jo\',4,7);">1Joh 4:7</a>).<P>(3) Righteousness and Holiness:<P>Righteousness and holiness were familiar ideas to Jesus and His disciples, as elements in the Divine character. They were current in the thought of their time, and they stood foremost in the Old Testament conception. They were therefore adopted in their entirety in the New Testament, but they stand in a different context. They are coordinated with and even subordinated to, the idea of love. As kingship stands to fatherhood, so righteousness and holiness stand to love.<P>(a) Once we find the phrase "Holy Father" spoken by Jesus (<a onClick="return mV(\'Jhn\',17,11);">Joh 17:11</a>; compare <a onClick="return mV(\'1Pe\',1,15,16);">1Pe 1:15-16</a>). But generally the idea of holiness is associated with God in His activity through the Holy Spirit, which renews, enlightens, purifies and cleanses the lives of men. Every vestige of artificial, ceremonial, non-moral meaning disappears from the idea of holiness in the New Testament. The sense of separation remains only as separation from sin. So Christ as high priest is "holy, guileless, undefiled, separated from sinners" (<a onClick="return mV(\'Hbr\',7,26);">Heb 7:26</a>). Where it dwells, no uncleanness must be (<a onClick="return mV(\'1Cr\',6,19);">1Co 6:19</a>). Holiness is not a legal or abstract morality, but a life made pure and noble by the love of God shed abroad in men\'s hearts (<a onClick="return mV(\'Rom\',5,5);">Ro 5:5</a>). "The kingdom of God is...righteousness and peace and joy in the Holy Spirit" (<a onClick="return mV(\'Rom\',14,17);">Ro 14:17</a>).<P>(b) Righteousness as a quality of character is practically identical with holiness in the New Testament. It is opposed to sin (<a onClick="return mV(\'Rom\',6,13,20);">Ro 6:13, 20</a>) and iniquity (<a onClick=
