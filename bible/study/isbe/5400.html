isbe = [];

isbe[5401]='Lake`lak (limne): The word is used (<a onClick="return mV(\'Luk\',5,1,2);">Lu 5:1,2</a>; <a onClick="return mV(\'Luk\',8,22,23,33);">8:22,23,33</a>) of the Lake of Gennesaret or Sea of Galilee, and (<a onClick="return mV(\'Rev\',19,20);">Re 19:20</a>; <a onClick="return mV(\'Rev\',20,10,14,15);">20:10,14,15</a>; <a onClick="return mV(\'Rev\',21,8);">21:8</a>) of the "lake of fire and brimstone." Lakes are not abundant in Syria and Palestine. The Dead Sea, which might be called a lake, is in most places in English Versions of the Bible called the Salt Sea. It is called by the Arabs Bachr Lut, Sea of Lot. It is a question whether the Waters of Merom (<a onClick="return mV(\'Jos\',11,5,7);">Jos 11:5,7</a>) can be identified with the Chuleh, a marshy lake in the course of the Upper Jordan, north of the Sea of Galilee. East of Damascus on the edge of the desert there are saltish lakes in which the water of the rivers of Damascus (see <a onClick="return mV(\'2Ki\',5,12);">2Ki 5:12</a>) is gathered and evaporates. In the Lebanon west of Ba\'albek is the small Lake Yammuneh, which is fed by copious springs, but whose water disappears in the latter part of the summer, being drained off by subterranean channels. The Lake of Kums on the Orontes is artificial, though ancient. On the lower Orontes is the Lake of Antioch.``37';
isbe[5402]='Lake of Fire`(limne tou puros): Found in <a onClick="return mV(\'Rev\',19,20);">Re 19:20</a>; <a onClick="return mV(\'Rev\',20,10,14,15);">20:10,14(bis), 15</a>. <a onClick="return mV(\'Rev\',21,8);">Re 21:8</a> has "the lake that burneth with fire and brimstone." The brimstone in connection with "the lake of fire" occurs also in <a onClick="return mV(\'Rev\',19,20);">Re 19:20</a> and <a onClick="return mV(\'Rev\',20,\'1-\');">20</A>, the latter being a backward reference to the former passage. In <a onClick="return mV(\'Rev\',20,14);">Re 20:14</a> the words, "This is the second death, even the lake of fire" are either a gloss originally intended to elucidate <a onClick="return mV(\'Rev\',20,15);">20:15</a> through a reference to <a onClick="return mV(\'Rev\',20,6);">20:6</A>, or, if part of the text, formed originally the close of <a onClick="return mV(\'Rev\',20,15);">20:15</A>, whence they became displaced on account of the identity of the words once immediately preceding them in <a onClick="return mV(\'Rev\',20,15);">20:15</A> with the words now preceding them in <a onClick="return mV(\'Rev\',20,14);">20:14</a>. The "lake of fire" can be called "the second death" only with reference to the lost among men (<a onClick="return mV(\'Rev\',20,15);">20:15</a>), not with reference to death and Hades (<a onClick="return mV(\'Rev\',20,14);">20:14</a>). In all the above references "the lake of fire" appears as a place of punishment, of perpetual torment, not of annihilation (<a onClick="return mV(\'Rev\',20,10);">20:10</a>). The beast (<a onClick="return mV(\'Rev\',19,20);">19:20</a>); the pseudo-prophet (<a onClick="return mV(\'Rev\',19,20);">19:20</a>; <a onClick="return mV(\'Rev\',20,10);">20:10</a>); the devil (<a onClick="return mV(\'Rev\',20,10);">20:10</a>); the wicked of varying description (<a onClick="return mV(\'Rev\',20,15);">20:15</a>; <a onClick="return mV(\'Rev\',21,8);">21:8</A></a>), are cast into it. When the same is affirmed of death and Hades (<a onClick="return mV(\'Rev\',20,14);">20:14</a>), it is doubtful whether this is meant as a mere figure for the cessation of these two evils personified, or has a more realistic background in the existence of two demon-powers so named (compare <a onClick="return mV(\'Isa\',25,8);">Isa 25:8</a>; <a onClick="return mV(\'1Cr\',15,26,54);">1Co 15:26,54</a>ff; 2Esdras 7:31). The Scriptural source for the conception of "the lake of fire" lies in <a onClick="return mV(\'Gen\',19,24);">Ge 19:24</a>, where already the fire and the brimstone occur together, while the locality of the catastrophe described is the neighborhood of the Dead Sea. The association of the Dead Sea with this fearful judgment of God, together with the desolate appearance of the place, rendered it a striking figure for the scene of eschatological retribution. The two other Old Testament passages which have "fire and brimstone" (<a onClick="return mV(\'Psa\',11,6);">Ps 11:6</a>; <a onClick="return mV(\'Eze\',38,22);">Eze 38:22</a>) are dependent on the Gen passage, with which they have the figure of "raining" in common. In <a onClick="return mV(\'Rev\',21,8);">Re 21:8</a>, "their part" seems to allude to <a onClick="return mV(\'Psa\',11,6);">Ps 11:6</a>, "the portion of their cup." In Enoch 67:4ff the Dead Sea appears as the place of punishment for evil spirits. Of late it has been proposed to derive "the lake of fire" from "the stream of fire" which destroys the enemies of Ahura in the Zoroastrian eschatology; so Bousset, Die Offenbarung Johannis,1906, 433, 434. But the figures of a stream and a lake are different; compare 2Esdras 13:9-11, where a stream of fire proceeds from the mouth of the Messiah for the destruction of His enemies. Besides, the Persian fire is, in part, a fire of purification, and not of destruction only (Bousset, 442), and even in the apocalyptic Book of Enoch, the fires of purification and of punishment are not confounded (compare Enoch 67:4 with 90:20). The Old Testament fully explains the entire conception.``182';
isbe[5403]='Lake of Gennesaret`ge-nes\'-a-ret.`<a href="./study/isbe/search.html?string=GALILEE,+SEA+OF">GALILEE, SEA OF</a>`1';
isbe[5404]='Lakkum`lak\'-um (laqqum; the King James Version, Lakum): An unidentified town on the border of Naphtali, named with Adami, Nekeb and Jabneel, apparently nearer the Jordan (<a onClick="return mV(\'Jos\',19,33);">Jos 19:33</a>).``1';
isbe[5405]='Lama``<a href="./study/isbe/search.html?string=ELI,+ELI,+LAMA,+SABACHTHANI">ELI, ELI, LAMA, SABACHTHANI</a>`1';
isbe[5406]='Lamb`lam:<P>(1) The most used word is kebhes, "a young ram"; compare Arabic kebsh, "ram"; often of sacrifices; (feminine) kabhsah, or kibchsah, "ewe lamb" (<a onClick="return mV(\'2Sa\',12,3);">2Sa 12:3</a>); by transposition kesebh, and feminine kisbah (<a onClick="return mV(\'Gen\',30,40);">Ge 30:40</a>; <a onClick="return mV(\'Lev\',3,7);">Le 3:7</a>; <a onClick="return mV(\'Lev\',5,6);">5:6</a>).<P>(2) kar, "lamb" (<a onClick="return mV(\'Deu\',32,14);">De 32:14</a>; <a onClick="return mV(\'1Sa\',15,9);">1Sa 15:9</a>; <a onClick="return mV(\'2Ki\',3,4);">2Ki 3:4</a>).<P>(3) seh, "one" of the flock (<a onClick="return mV(\'Gen\',22,7);">Ge 22:7</a>; <a onClick="return mV(\'Lev\',5,7);">Le 5:7</a>).<P>(4) tso\'n, "sheep," "goats," "flock"; compare Arabic da\'n, "sheep" (<a onClick="return mV(\'Exd\',12,21);">Ex 12:21</a>); and ben tso\'n (<a onClick="return mV(\'Psa\',114,4);">Ps 114:4</a>).<P>(5) Taleh, "young lamb"; compare Arabic Tali, "young lamb"; and Tela\'im (<a onClick="return mV(\'1Sa\',7,9);">1Sa 7:9</a>; <a onClick="return mV(\'Isa\',40,11);">Isa 40:11</a>; <a onClick="return mV(\'Isa\',65,25);">65:25</a>).<P>(6) \'immerin (<a onClick="return mV(\'Ezr\',6,9,17);">Ezr 6:9,17</a>; <a onClick="return mV(\'Ezr\',7,17);">7:17</a>).<P>(7) arnas, accusative plural (<a onClick="return mV(\'Luk\',10,3);">Lu 10:3</a>); diminutive arnion (<a onClick="return mV(\'Jhn\',21,15);">Joh 21:15</a>; <a onClick="return mV(\'Rev\',5,6);">Re 5:6</a>, etc.).<P>(8) amnos (<a onClick="return mV(\'Jhn\',1,29,36);">Joh 1:29,36</a>; <a onClick="return mV(\'Act\',8,32);">Ac 8:32</a>; <a onClick="return mV(\'1Pe\',1,19);">1Pe 1:19</a>).`<a href="./study/isbe/search.html?string=SHEEP">SHEEP</a>`37';
isbe[5407]='Lamb of God`(ho amnos tou theou): This is a title specially bestowed upon our Lord by John the Baptist (<a onClick="return mV(\'Jhn\',1,\'29-36\');">Joh 1:29-36</a>), "Behold, the Lamb of God, that taketh away the sin of the world!" In Testament of the Twelve Patriarchs an apocryphal book, probably of the 2nd century—we have the term used for the Messiah, "Honor Judah and Levi, for from them shall arise for you the Lamb of God, saving all nations by grace." But the term does not seem to have been of any general use until it received its distinctly Christian significance. It has been generally understood as referring to the prophetic language of <a onClick="return mV(\'Jer\',11,19);">Jer 11:19</a>, and <a onClick="return mV(\'Isa\',53,7);">Isa 53:7</a>.<P>1. Sacrificial Sense of the Term:<P>It is far more probable, however, that the true source of the expression is to be found in the important place which the "lamb" occupies in the sacrifices, especially of the Priestly Code. In these there was the lamb of the daily morning and evening sacrifice. How familiar this would be to the Baptist, being a member of a priestly family! On the Sabbath the number of the offerings was doubled, and at some of the great festivals a still larger number were laid upon the altar (see <a onClick="return mV(\'Exd\',29,38);">Ex 29:38</a>; <a onClick="return mV(\'Num\',28,3,9,13);">Nu 28:3,9,13</a>). The lamb of the Passover would also occupy a large place in the mind of a devout Israelite, and, as the Passover was not far off, it is quite possible that John may have referred to this as well as to other suggested ideas connected with the lamb. The sacrificial significance of the term seems to be far more probable than the mere comparison of the character of our Lord with meekness and gentleness, as suggested by the words of the prophets, although these contain much more than the mere reference to character (see below). That this became the clearly defined conception of apostolic teaching is clear from passages in Paul and Peter (<a onClick="return mV(\'1Cr\',5,7);">1Co 5:7</a>; <a onClick="return mV(\'1Pe\',1,18);">1Pe 1:18</a>f). In the Book of Revelation the reference to the Lamb occurs 27 times. The word here used differs from that in John. The amnos of the Gospel has become the arnion of the Apocalypse, a diminutive form suggestive of affection. This is the word used by our Lord in His rebuke and forgiveness of Peter (<a onClick="return mV(\'Jhn\',21,15);">Joh 21:15</a>), and is peculiarly touched therefore with an added meaning of pathetic tenderness. Westcott, in his Commentary on <a onClick="return mV(\'Jhn\',1,29);">Joh 1:29</a>, refers to the conjecture that there may have been flocks of lambs passing by on their way to Jerusalem to be used at the feast. This is possible, but fanciful. As applied to Christ, the term certainly suggests the meekness and gentleness of our Lord\'s nature and work, but could not have been used by John without containing some reference to the place which the lamb bore in the Judaic ritualism.<P>2. As Variously Understood:<P>The significance of the Baptist\'s words has been variously understood. Origen, Cyril, Chrysostom, among the ancients, Lucke, DeWette, Meyer, Ewald, Alford, among the moderns, refer it to <a onClick="return mV(\'Isa\',53,7);">Isa 53:7</a>; Grotius, Bengel, Hengstenberg, to the paschal lamb; Baumgarten-Crusius, etc., to the sin offering; Lange strongly urges the influence of the passage in <a onClick="return mV(\'Isa\',53,\'1-\');">Isa 53</a>, and refers to John\'s description of his own mission under the influence of the second part of Isaiah, in which he is supported by Schaff. The importance of the Isaiah-thought is found in <a onClick="return mV(\'Mat\',8,17);">Mt 8:17</a>; <a onClick="return mV(\'Act\',8,32);">Ac 8:32</a>; <a onClick="return mV(\'1Pe\',2,\'22-25\');">1Pe 2:22-25</a>.<P>3. As Set Forth by Isaiah:<P>It is to be observed that the Septuagint in <a onClick="return mV(\'Isa\',53,7);">Isa 53:7</a> translates the Hebrew word for sheep (seh), by the Greek word for lamb. In <a onClick="return mV(\'Isa\',53,10);">53:10</a>, the prophet\'s "suffering one" is said to have made "his soul an offering for Isaiah sin," and in <a onClick="return mV(\'Isa\',53,4);">53:4</A> "he hath borne our griefs," where bearing involves the conception of sin offering, and as possessing justifying power, the idea of "\'taking away." John indeed uses not the Septuagint word (pherein), but (airein), and some have maintained that this simply means "put away" or "support," or "endure." But this surely loses the suggestion of the associated term "lamb," which John could not have employed without some reference to its sacrificial and therefore expiatory force. What Lange calls a "germ perception" of atonement must certainly have been in the Baptist\'s mind, especially when we recall the Isaiah-passages, even though there may not have been any complete dogmatic conception of the full relation of the death of Christ to the salvation of a world. Even the idea of the bearing of the curse of sin may not be excluded, for it was impossible for an Israelite like John, and especially with his surroundings, to have forgotten the significance of the paschal lamb, both in its memorial of the judgment of Egypt, as well as of the deliverance of Israel. Notwithstanding every effort to take out of this striking phrase its deeper meanings, which involve most probably the combination of all the sources above described, it must ever remain one of the richest mines of evangelical thought. It occupies, in the doctrine of atonement, a position analogous to that brief word of the Lord, "God is a Spirit" (<a onClick="return mV(\'Jhn\',4,24);">Joh 4:24</a>), in relation to the doctrine of God.<P>The Lamb is defined as "of God," that is, of Divine providing. See <a onClick="return mV(\'Isa\',53,\'1-\');">Isa 53</a>; <a onClick="return mV(\'Rev\',5,6);">Re 5:6</a>; <a onClick="return mV(\'Rev\',13,8);">13:8</a>. Its emphatic and appointed office is indicated by the definite article, and whether we refer the conception to a specific sacrifice or to the general place of a lamb in the sacrificial institution, they all, as being appointed by and specially set apart for God, suggest the close relation of our Lord to the Divine Being, and particularly to His expiatory sacrifice.``14';
isbe[5408]='Lame`lam (piceach, nakheh; cholos):<P>(1) The condition of being unable or imperfectly able to walk, which unfitted any descendant of Aaron so afflicted for service in the priesthood (<a onClick="return mV(\'Lev\',21,18);">Le 21:18</a>), and rendered an animal unsuitable for sacrifice (<a onClick="return mV(\'Deu\',15,21);">De 15:21</a>). The offering of animals so blemished was one of the sins with which Malachi charges the negligent Jews of his time (<a onClick="return mV(\'Mal\',1,\'8-13\');">Mal 1:8-13</a>).<P>(2) Those who suffered from lameness, such as Mephibosheth, whose limbs were injured by a fall in childhood (<a onClick="return mV(\'2Sa\',4,4);">2Sa 4:4</a>; <a onClick="return mV(\'2Sa\',9,3);">9:3</a>). In the prophetic description of the completeness of the victory of the returning Israelites, it is predicted that the lame shall be made whole and shall leap like a hart (<a onClick="return mV(\'Jer\',3,18);">Jer 3:18</a>; <a onClick="return mV(\'Isa\',35,6);">Isa 35:6</a>). The unfitness of the lame for warfare gives point to the promise that the lame shall take the prey (<a onClick="return mV(\'Isa\',33,23);">Isa 33:23</a>). Job in his graphic description of his helpfulness to the weak before his calamity says, "And feet was I to the lame" (<a onClick="return mV(\'Job\',29,15);">Job 29:15</a>). The inequality of the legs of the lame is used in <a onClick="return mV(\'Pro\',26,7);">Pr 26:7</a> as a similitude of the ineptness with which a fool uses a parable.<P>In the enigmatical and probably corrupt passage describing David\'s capture of Jerusalem, the lame and blind are mentioned twice. In <a onClick="return mV(\'2Sa\',5,6);">2Sa 5:6</a> it was a taunt on the part of the Jebusites that even a garrison of cripples would suffice to keep out the Israelites. The allusion in <a onClick="return mV(\'2Sa\',5,8);">5:8</a> may be read, "Whosoever smiteth the Jebusites let him...slay both the lame and blind, which hate David\'s soul" as it is in Septuagint. The Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) says, "David had offered a reward on that day to the man who should smite the Jebusite and reach the water pipes of the houses, and remove the blind and lame who hated David\'s soul." It is possible, however, that Budde\'s emendation is more correct and that it is a threat against the indiscriminate slaughter of the Jebusites: "Whoso slayeth a Jebusite shall bring his neck into peril; the lame and blind are not hated of David\'s soul." The proverbial saying quoted in <a onClick="return mV(\'2Sa\',5,8);">5:8</A> cannot be correct as rendered in the King James Version, for we read in <a onClick="return mV(\'Mat\',21,14);">Mt 21:14</a> that the lame came to our Lord in the temple and were healed.<P>The healing of the lame by our Lord is recorded in <a onClick="return mV(\'Mat\',11,5);">Mt 11:5</a>; <a onClick="return mV(\'Mat\',15,30,31);">15:30,31</a>; <a onClick="return mV(\'Mat\',21,14);">21:14</a>; <a onClick="return mV(\'Luk\',7,22);">Lu 7:22</a>; <a onClick="return mV(\'Luk\',14,13);">14:13</a>. For the apostolic miracles of healing the lame, see <a href="./study/isbe/search.html?string=CRIPPLE">CRIPPLE</a>. In <a onClick="return mV(\'Hbr\',12,13);">Heb 12:13</a> the Christians are counseled to courage under chastisement, lest their despair should cause that which is lame to be "turned out of the way."``107';
isbe[5409]='Lamech`la\'-mek (lemekh; Lamech, "a strong youth"?):<P>(1) The name is first mentioned in <a onClick="return mV(\'Gen\',4,\'18-24\');">Ge 4:18-24</a>. Here Lamech, the son of Methushael, is named as the last of the descendants of Cain. He was the father of Jabel, Jubal, Tubal-cain, and Naamah. As the husband of two wives, namely, Adah and Zillah, he furnishes the first recorded instance of polygamy. It is very instructive to note that this "father of polygamy" at once becomes the first blustering tyrant and a braggadocio; we are fully permitted to draw this conclusion from his so-called "swordlay" (<a onClick="return mV(\'Gen\',4,23);">Ge 4:23</a>f). He does not put his trust in God, but in the weapons and implements invented by his sons, or rather these instruments, enhancing the physical and material powers of man, are his God. He glories in them and misconstrues the Divine kindness which insured to Cain freedom from the revenge of his fellow-men.<P>(2) Another Lamech. is mentioned in <a onClick="return mV(\'Gen\',5,25,28);">Ge 5:25,28</a> (compare <a onClick="return mV(\'1Ch\',1,3);">1Ch 1:3</a>; <a onClick="return mV(\'Luk\',3,36);">Lu 3:36</a>), the son of Methuselah and the father of Noah. His words (<a onClick="return mV(\'Gen\',5,29);">Ge 5:29</a>) show the great difference between this descendant of Seth and the descendant of Cain. While the one is stimulated to a song of defiance by the worldly inventions of his sons, the other, in prophetical mood, expresses his sure belief in the coming of better times, and calmly and prayerfully awaits the period of comfort and rest which he expected to be ushered in by his son Noah.``8';
isbe[5410]='Lamedh`la\'-meth: The 12th letter of Hebrew alphabet; transliterated in this Encyclopedia as "1". It came also to be used for the <span class="noTag">number 30</span>.`<a href="./study/isbe/search.html?string=ALPHABET">ALPHABET</a>`1';
isbe[5411]='Lament`la-ment\'.`<a href="./study/isbe/search.html?string=MUSIC">MUSIC</a>`1';
isbe[5412]='Lamentation`lam-en-ta\'-shun.`<a href="./study/isbe/search.html?string=BURIAL">BURIAL</a>`1';
isbe[5413]='Lamentations, Book of`lam-en-ta\'-shunz, —The Lamentations of Jeremiah:<P>1. Name:<P>This is a collective name which tradition has given to 5 elegies found in the Hebrew Canon that lament the fate of destroyed Jerusalem. The rabbis call this little book \'Ekhah ("how"), according to the word of lament with which it begins, or qinoth. On the basis of the latter term the Septuagint calls it threnoi, or Latin Threni, or "Lamentations."<P>2. Form:<P>The little book consists of 5 lamentations, each one forming the contents of a chapter. The first 4 are marked by the acrostic use of the alphabet. In addition, the qinah ("elegy") meter is found in these hymns, in which a longer line (3 or 4 accents) is followed by a shorter (2 or 3 accents). In <a onClick="return mV(\'Lam\',1,\'1-\');">La 1</a> and <a onClick="return mV(\'Lam\',2,\'1-\');">2</a> the acrostic letters begin three such double lines; in <a onClick="return mV(\'Lam\',4,\'1);">La 4</a>, however, two double lines. In <a onClick="return mV(\'Lam\',3,\'1-\');">La 3</a> a letter controls three pairs, but is repeated at the beginning of each line. In <a onClick="return mV(\'Lam\',5,\'1-\');">La 5</a> the alphabet is wanting; but in this case too the number of pairs of lines agrees with the number of letters in the Hebrew alphabet, i.e. 22. In <a onClick="return mV(\'Lam\',2,\'1-\');">La 2</a>; <a onClick="return mV(\'Lam\',3,\'1-\');">3</a> and <a onClick="return mV(\'Lam\',4,\'1-\');">4</A>, the letter \'ayin (\') follows pe (p), as is the case in <a onClick="return mV(\'Psa\',34,\'1-\');">Ps 34</a>. <a onClick="return mV(\'Lam\',1,\'1-\');">Lamentations 1</a>, however, follows the usual order.<P>3. Contents:<P>These 5 hymns all refer to the great national catastrophe that overtook the Jews and in particular the capital city, Jerusalem, through the Chaldeans, 587-586 BC. The sufferings and the anxieties of the city, the destruction of the sanctuary, the cruelty and taunts of the enemies of Israel, especially the Edomites, the disgrace that befell the king and his nobles, priests and prophets, and that, too, not without their own guilt, the devastation and ruin of the country—all this is described, and appeal is made to the mercy of God. A careful sequence of thought cannot be expected in the lyrical feeling and in the alphabetical form. Repetitions are found in large numbers, but each one of these hymns emphasizes some special feature of the calamity. <a onClick="return mV(\'Lam\',3,\'1-\');">Lamentations 3</a> is unique, as in it one person describes his own peculiar sufferings in connection with the general calamity, and then too in the name of the others begins a psalm of repentance. This person did not suffer so severely because he was an exceptional sinner, but because of the unrighteousness of his people. These hymns were not written during the siege, but later, at a time when the people still vividly remembered the sufferings and the anxieties of that time and when the impression made on them by the fall of Jerusalem was still as powerful as ever.<P>4. Author:<P>Who is the author of these hymns? Jewish tradition is unanimous in saying that it was Jeremiah. The hymns themselves are found anonymously in the Hebrew text, while the Septuagint has in one an additional statement, the Hebrew style of which would lead us to conclude that it was found in the original from which the version was made. This statement reads: "And it came to pass, after Israel had been taken away captive and Jerusalem had been laid waste, that Jeremiah sat weeping, and uttered this lamentation over Jerusalem and said." The Targum also states that Jeremiah was the author. The rabbis and the church Fathers have no doubts on the subject. Jerome (compare on <a onClick="return mV(\'Zec\',12,11);">Zec 12:11</a>) thinks that <a onClick="return mV(\'2Ch\',35,25);">2Ch 35:25</a> refers to these hymns. The same is said by Josephus (Ant., X, v, 1). If this were the case, then the writer of Chronicles would have regarded Lamentations as having been written because of the death of Josiah. But this misunderstanding is not to be ascribed to him. It was easily possible that he was acquainted with lamentations of such a nature, but which afterward were lost. At all events, Jeremiah was by nature adapted to the composition of such elegies, as is proved by his book of prophecies.<P>Only in modern times has the authorship of these hymns by Jeremiah been seriously called into question; and it is now denied by most critics. For this they give formal and material reasons: The language of these lamentations shows many similarities to the discourses of Jeremiah, but at the same time also many differences. The claim that the alphabetical scheme is not worthy of Jeremiah is a prejudice caused by the taste of our times. Hebrew poets had evidently been making use of such methods for a long time, as it helps materially in memorizing. At the time of the first acute suffering on account of the destruction of Jerusalem, in fact, he would probably not have made use of it. But. we have in this book a collection of lamentations\' written some time after this great catastrophe. The claim has also been made that the views of Jeremiah and those of the composer or the composers of these poems differ materially. It is said that Jeremiah emphasizes much more strongly the guilt of the people as the cause of the calamity than is done in these hymns, which lament the fate of the people and find the cause of it in the sins of the fathers (<a onClick="return mV(\'Lam\',5,7);">La 5:7</a>), something that Jeremiah is said not to accept (<a onClick="return mV(\'Jer\',31,29);">Jer 31:29</a>f). However, the guilt of the people and the resultant wrath of God are often brought out in these hymns; and Jeremiah does not deny (31:29f) that there is anything like inherited guilt. He declares rather that in the blessed future things would be different in this respect. Then, too, we are not to forget that if Jeremiah is the author of these patriotic hymns, he does not speak in them as the prophet and the appointed accuser of his people, but that he is at last permitted to speak as he humanly feels, although there is no lack of prophetical reminiscences (of <a onClick="return mV(\'Lam\',4,21);">La 4:21</a>f). In these hymns he speaks out of the heart that loves his Jerusalem and his people, and he utters the priestly prayer of intercession, which he was not allowed to do when announcing the judgment over Israel. The fact that he also evinces great reverence for the unfortunate king and his Divinely given hereditary dignity (<a onClick="return mV(\'Lam\',4,20);">La 4:20</a>), although as a prophet he had been compelled to pronounce judgment over him, would not be unthinkable in Jeremiah, who had shown warm sympathies also for Jehoiachim (<a onClick="return mV(\'Jer\',22,24,28);">22:24,28</A>). A radical difference of sentiment between the two authors is not to be found. On the other hand, a serious difficulty arises if we claim that Jeremiah was not the author of Lamentations in the denunciations of Lamentations over the prophets of Jerusalem (<a onClick="return mV(\'Lam\',2,14);">2:14</a>; <a onClick="return mV(\'Lam\',4,13);">4:13</A>). How could the great prophet of the Destruction be so ignored if he himself were not the author of these sentiments? If he was himself the author we can easily understand this omission. In his book of prophecies he has spoken exactly the same way about the prophets. To this must be added, that <a onClick="return mV(\'Lam\',3,\'1-\');">La 3</a> forces us to regard Jeremiah as the author, because of the personal sufferings that are here described. Compare especially <a onClick="return mV(\'Lam\',3,14,37,53,61,63);">La 3:14,37f; 53ff, 61,63</a>. What other person was during the period of this catastrophe the cynosure of all eyes as was the prophet, especially, too, because he was guiltless? The claim that here, not an individual, but the personified nation is introduced as speaking, is altogether improbable, and in some passages absolutely impossible (<a onClick="return mV(\'Lam\',3,14,48);">La 3:14,48</a>).<P>This little book must accordingly be closely connected with the person of Jeremiah. If he himself is the author, he must have composed it in his old age, when he had time and opportunity to live over again all the sufferings of his people and of himself. It is, however, more probable, especially because of the language of the poems, that his disciples put this book in the present shape of uniform sentential utterances, basing this on the manner of lamentations common to Jeremiah. In this way the origin of Lamentaions 3 can be understood, which cannot artificially be shaped as his sayings, as in this case the personal feature would be more distinctly expressed. It was probably compiled. from a number of his utterances.<P>In the Hebrew Canon this book is found in the third division, called kethabhim, or Sacred Writings, together with the Psalms. However, the Septuagint adds this book to Jeremiah, or rather, to the Book of Baruch, found next after Jerusalem. The Hebrews count it among the 5 meghilloth, or Rolls, which were read on prominent anniversary days. The day for the Lamentation was the 9th of Abib, the day of the burning of the temple. In the Roman Catholic church it is read on the last three days of Holy Week.<P>LITERATURE.<P>Comms. of Thenius, Ewald, Nagelsbach, Gerlach, Keil, Cheyne, Oettli, Lohr, Budde; article by Robertson Smith on "Lamentations" in EB.``131';
isbe[5414]='Lamp; Lampstand`lamp\'-stand (nir, ner, lappidh, Phoenician lampadh, whence lampas; luchnos is also used): Ner or nir is properly "light" or "a light-giving thing," hence, "lamp," and is so rendered in the Revised Version (British and American), but often "candle" in the King James Version. Its use in connection with the tabernacle and the temple (<a onClick="return mV(\'Exd\',25,37);">Ex 25:37</a>ff; <a onClick="return mV(\'2Ch\',4,20);">2Ch 4:20</a>f), where oil was employed for light (<a onClick="return mV(\'Exd\',35,14);">Ex 35:14</a>; <a onClick="return mV(\'Lev\',24,2);">Le 24:2</a>), shows that this is its proper meaning. Lappidh is properly "a torch" and is thus rendered generally in the Revised Version (British and American), but "lamp" in <a onClick="return mV(\'Isa\',62,1);">Isa 62:1</a>, where it is used as a simile. the King James Version renders it "lamp" usually, but "torch" in <a onClick="return mV(\'Nah\',2,3);">Na 2:3</a>f; <a onClick="return mV(\'Zec\',12,6);">Zec 12:6</a>. In <a onClick="return mV(\'Job\',12,5);">Job 12:5</a> the Revised Version (British and American) renders it "for misfortune," regarding it as composed of the noun pidh, and the preposition l-. Lampas in Greek corresponds to it, but luchnos is also rendered in the Revised Version (British and American) "lamp," while the King James Version gives "candle," as in <a onClick="return mV(\'Mat\',5,15);">Mt 5:15</a> and corresponding passages in the other Gospels.<P>1. Forms and History:<P>Lamps were in use in very remote times, though we have few allusions to them in the early history of Egypt. There are indications that they were used there. Niches for lamps are found in the tombs of Tell el-Amarna (Archaeological Survey of Egypt, Tell el-Amarna Letters, Part IV, 14). Lampstands are also represented (ibid., Part III, 7). Torches were of course used before lamps, and are mentioned in Genesis (<a onClick="return mV(\'Gen\',15,17);">15:17</a> the Revised Version (British and American)), but clay lamps were used in Canaan by the Amorites before the Israelites took possession. The excavations in Palestine have furnished thousands of specimens, and have enabled us to trace the development from about 2000 BC onward. The exploration carried out at Lachish (Tell Hesy) and Gezer (Tell Jezer) by the Palestine Exploration Fund has given ample material for the purpose, and the numerous examples from tombs all over Palestine and Syria have supplied a great variety of forms.<P>2. Figurative Use:<P>"Lamp" is used in the sense of a guide in <a onClick="return mV(\'Psa\',119,105);">Ps 119:105</a>; <a onClick="return mV(\'Pro\',6,23);">Pr 6:23</a>, and for the spirit, which is called the lamp of Yahweh in man (<a onClick="return mV(\'Pro\',20,27);">Pr 20:27</a>), and it of course often signifies the light itself. It is used also for the son who is to succeed and represent his father (<a onClick="return mV(\'1Ki\',15,4);">1Ki 15:4</a>), and it perhaps is employed in this sense in the phrase, "The lamp of the wicked shall be put out" (<a onClick="return mV(\'Job\',21,17);">Job 21:17</a>; <a onClick="return mV(\'Pro\',13,9);">Pr 13:9</a>; and perhaps <a onClick="return mV(\'Job\',18,6);">Job 18:6</a>).<P>The early Canaanite or Amorite lamp was a shallow, saucer-like bowl with rounded bottom and vertical rim, slightly pointed or pinched on one side where the lighted end of the wick was placed. This form continued into Jewish times, but was gradually changed until the spout was formed by drawing the rim of the sides together, forming a narrow open channel, the remainder of the rim being rolled outward and flattened, the bottom being also flattened. This was the early Hebrew pattern and persisted for centuries. The open bowl was gradually closed in, first at the spout, where the rim of one side was lapped over the other, and finally the whole surface was closed with only an orifice in the center for receiving the oil, and at the same time the spout was lengthened. This transformation is seen in lamps of the Seleucid period, or from around 300 BC. These lamps have usually a circular foot and sometimes a string-hole on one side. The next development was a circular bowl with a somewhat shorter spout, sometimes being only a bulge in the rim, so that the orifice for the wick falls in the rim, the orifice for filling being quite small at the bottom of a saucer-like depression in the center of the bowl. There is sometimes a loop handle affixed on the side opposite to the spout. Sometimes the handle is horizontal, but commonly vertical. This form is called Roman, and the bowl is often ornamented with mythological human or animal figures (Fig. 5). Other forms are elongated, having numerous wick holes (Fig. 6). The mythological and animal forms were rejected by the Jews as contrary to their traditions, and they made lamps with various other designs on the bowl, such as vine leaves, cups, scrolls, etc. (Figs. 7-11). One very marked Jewish design is the seven-branched candlestick (<a onClick="return mV(\'Exd\',25,32);">Ex 25:32</a>) of the temple (Fig. 12). The lamps of the parable of the Ten Virgins were probably similar to these (<a onClick="return mV(\'Mat\',25,1);">Mt 25:1</a>). The latest form of the clay lamp was what is called Byzantine, the bowl of which has a large orifice in the center and tapers gradually to the spout (Fig. 13); they are ornamented commonly with a palm branch between the central orifice and the wickhole, or with a cross. Sometimes there is an inscription on the margin (Fig. 13). The words on this read Phos ku(riou) pheni pasin Kale,"the light of the Lord shines to all (beautifully?)." Others read, "The Lord is my light"; "beautiful light," etc. These inscriptions determine the period as being Christian. In Roman times, and earlier also, bronze was much used for the finer lamps, often with covers for the orifice and sometimes with chain and ring for hanging. Very elaborate designs in this material occur.<P>These terra-cotta lamps are found in the tombs and burial places throughout Palestine and Syria, and they were evidently deposited there in connection with the funeral rites. Very few are found in Canaanite tombs, but they become numerous in later times and especially in the early Christian centuries. The symbolism in their use for funeral purposes is indicated by the inscriptions above mentioned (see PEFS, 1904, 326ff; Explorations in Palestine, by Bliss. Maclister and Wunsch, 4to, published by the Palestine Exploration Fund). These lamps were used by the peasants of the country down to recent times, when petroleum has superseded olive oil for lighting. The writer has seen lamps of the Jewish and Roman period with surface blackened with recent usage. Olive oil was commonly used, but terebinth oil also (Thomson, LB, III, 472).``138';

isbe[5417]='Land`(1) \'erets;<P>(2) \'adhamah;<P>(3) sadheh,<P>"a piece of land";<P>(4) ge, "earth";<P>(5) agros, "field";<P>(6) chora, "region";<P>(7) chorion, diminutive of chora;<P>(8) xeros, "dry land";<P>(9) \'ezrach, "native" the King James Version "born in the land," "born among you," the Revised Version (British and American) "home-born" (<a onClick="return mV(\'Lev\',19,34);">Le 19:34</a>; <a onClick="return mV(\'Lev\',14,16);">14:16</a>; <a onClick="return mV(\'Num\',15,30);">Nu 15:30</a>); "like a green tree in its native soil" (<a onClick="return mV(\'Psa\',37,35);">Ps 37:35</a>)):<p>\'Erets occurs hundreds of times and is used in much the same way as \'adhamah, which also occurs often: e.g. "land of Egypt," \'erets mitsrayim (<a onClick="return mV(\'Gen\',13,10);">Ge 13:10</a>), and \'adhmath mitsrayim (<a onClick="return mV(\'Gen\',47,20);">Ge 47:20</a>). The other words occur less often, and are used in the senses indicated above.`<a href="./study/isbe/search.html?string=COUNTRY">COUNTRY</a>; <a href="./study/isbe/search.html?string=EARTH">EARTH</a>`37';
isbe[5418]='Land-Crocodile`(Revised Version (British and American))<P>land-crok\'-o-dil (koach; Septuagint chamaileon, <a onClick="return mV(\'Lev\',11,30);">Le 11:30</a>; the King James Version Chameleon): Koach is found only here, meaning an animal, the fifth in the list of unclean "creeping things." Elsewhere is it translated "strength" or "power," and it has been thought that here is meant the desert monitor, Varanus griseus, a gigantic lizard, which is common in Egypt and Palestine, and which attains the length of 4 ft. "Chameleon," which the King James Version has here, is used by the Revised Version (British and American) for tinshemeth (the King James Version "mole"), the eighth in the list of unclean "creeping things" (compare nasham, "to breathe"; translated "swan" in <a onClick="return mV(\'Lev\',11,18);">Le 11:18</a> margin). While it is by no means certain what animal is meant, there could be no objection to "monitor" or "desert monitor." "Land-crocodile" is objectionable because it is not a recognized name of any animal.`<a href="./study/isbe/search.html?string=CHAMELEON">CHAMELEON</a>; <a href="./study/isbe/search.html?string=LIZARD">LIZARD</a>`37';

isbe[5420]='Landmark`land\'-mark (gebhul, literally, "boundary"): The boundary may have been marked, as at present, simply by a furrow or stone. The iniquity of removing a landmark is frequently insisted on (<a onClick="return mV(\'Deu\',19,14);">De 19:14</a>; <a onClick="return mV(\'Deu\',27,17);">27:17</a>; <a onClick="return mV(\'Pro\',22,28);">Pr 22:28</a>; <a onClick="return mV(\'Pro\',23,10);">23:10</a>; <a onClick="return mV(\'Job\',24,2);">Job 24:2</a> gebhulah), its removal being equivalent to theft.``1';
isbe[5421]='Lane`lan (rhume): An alley or bypath of a city. Occurs once in <a onClick="return mV(\'Luk\',14,21);">Lu 14:21</a>, "Go out quickly into the streets and lanes of the city"; elsewhere translated "street," e.g. <a onClick="return mV(\'Mat\',6,2);">Mt 6:2</a>; <a onClick="return mV(\'Act\',9,11);">Ac 9:11</a>; Ecclesiasticus 9:7; Tobit 13:18.``1';
isbe[5422]='Language of the New Testament`lan\'-gwaj (Greek).<P>See <a href="./study/isbe/search.html?string=ARAMAIC+LANGUAGE">ARAMAIC LANGUAGE</a> also:<P><b>I. THE VERNACULAR "KOINE" THE LANGUAGE OF THE NEW TESTAMENT</b><P class="in15">1. The Old Point of View<P class="in15">2. The Revolution<P class="in15">3. The Proof of the New Position<P class="in30">(1) The Papyri<P class="in30">(2) The Ostraka<P class="in30">(3) The Inscriptions<P class="in30">(4) Modern Greek<P class="in30">(5) Historical and Comparative Grammar<P class="in15">4. Characteristics of the Vernacular "Koine"<P><b>II. LITERARY ELEMENTS IN THE NEW TESTAMENT</b><P><b>III. THE SEMITIC INFLUENCE</b><P><b>IV. INDIVIDUAL PECULIARITIES OF THE NEW TESTAMENT WRITERS</b><P><b>V. THE "KOINE" GREEK SPOKEN BY JESUS</b><P><b>LITERATURE</b><hr /><P>I. The Vernacular "Koine" the Language of the New Testament.<P>1. The Old Point of View:<P>The ghost of the old Purist controversy is now laid to rest for good and all. The story of that episode has interest chiefly for the historian of language and of the vagaries of the human intellect. See Winer-Thayer, Grammar of the Idiom of the New Testament,1869,12-19, and Schmiedel\'s Winer, sectopm 2, for a sketch of this once furious strife. In the 17th century various scholars tried to prove that the Greek of the New Testament was on a paragraph with the literary Attic of the classic period. But the Hebraists won the victory over them and sought to show that it was Hebraic Greek, a special variety, if not dialect, a Biblical Greek The 4th edition of Cremer\'s Biblico-Theological Lexicon of New Testament Greek (translated by W. Urwick, 1892) quotes, with approval, Rothe\'s remark (Dogmatik,1863, 238):<P>"We may appropriately speak of a language of the Holy Ghost. For in the Bible it is evident that the Holy Spirit has been at work, moulding for itself a distinctively religious mode of expression out of the language of the country which it has chosen as its sphere, and transforming the linguistic elements which it found ready to hand, and even conceptions already existing, into a shape and form appropriate to itself and all its own." Cremer adds: "We have a very clear and striking proof of this in New Testament Greek."<P>This was only twenty years ago and fairly represented the opinion of that day. Hatch in 1889 (Essays in Biblical Greek, 34) held that with most of the New Testament words the key lay in the Septuagint. But Winer (Winer-Thayer, 20) had long ago seen that the vernacular koine was "the special foundation of the diction of the New Testament," though he still admitted "a Jewish-Greek, which native Greeks did not entirely understand" (p. 27). He did not see the practical identity of New Testament Greek with the vernacular koine—("common" Greek), nor did Schmiedel in the 8. Auflage of Winer (I. Theil; II. Theil, erstes Heft, 1894-97). In the second edition of his Grammar of New Testament Greek (English translation by Thackeray,1905, 2), Blass sees the dawn of the new day, though his book was first written before it came. Viteau (Etude sur le grec du Nouveau Testament, I, Le verbe,1893,II, Le sujet, 1896) occupies wholly the old position of a Judaic Greek. An extreme instance of that view is seen in Guillemard\'s Hebraisms in the Greek Testament (1879).<P>2. The Revolution:<P>A turn toward the truth comes with H. A. A. Kennedy\'s Sources of the New Testament Greek (1895). He finds the explanation of the vocabulary of both the Septuagint and the New Testament to be the vernacular which he traces back to Aristophanes. It is a good exercise to read Westcott\'s discussion of the "Language of the NT" in DB, III (1888), and then turn to Moulton, "Language of the New Testament," in the 1-vol HDB. Westcott says: "The chief peculiarities of the syntax of the New Testament lie in the reproduction of Hebrew forms." Moulton remarks: "There is no reason to believe that any New Testament writer who ever lived in Palestine learned Greek only as a foreign language when he went abroad." Still better is it to read Moulton, "New Testament Greek in the Light of Modern Discovery" in Cambridge Biblical Essays (1909, 461-505); Deissmann, Light from the Ancient East (1911); or Angus, "The koine, the Language of the New Testament," Princeton Review, January,1910,42-92. The revolution has come to stay. It is now clear that the Greek of the New Testament is not a jargon nor a patois. In all essential respects it is just the vernacular koine of the 1st century AD, the lingua franca of the Greek-Roman empire, the legacy of Alexander the Great\'s conquest of the East. This world-speech was at bottom the late Attic vernacular with dialectical and provincial influences. It was not a decaying tongue, but a virile speech admirably adapted to the service of the many peoples of the time. The able article in volume III of HDB on the "Language of the New Testament" by Dr. J. H. Thayer appeared in 1900, and illustrates how quickly an encyclopedia article may become out of date. There is a wealth of knowledge here displayed, as one would expect, but Thayer still speaks of "this species of Greek," "this peculiar idiom,...Jewish Greek," though he sees that its basis is "the common or spoken Greek." The last topic discussed by him is "Problems." He little thought that the biggest "problem" so near solution was the character of the language itself. It was Adolph Deissmann, then of Heidelberg, now of Berlin, who opened the new era in the knowledge of the language of the New Testament. His Bibelstudien (zumeist aus den Papyri und Inschriften zur Geschichte der Sprache, des Schrifttums und der Religion des hellenistischen Judentums und des Urchristentums) appeared in 1895. In this epoch-making volume he proved conclusively from the papyri and the inscriptions that many of the seeming Hebraisms in the Septuagint and the New Testament were common idioms in the vernacular koine. He boldly claimed that the bulk of the Hebraisms were falsely so termed, except in the case of translating Greek from the Hebrew or Aramaic or in "perfect" Hebraisms, genuine Greek usage made more common by reason of similarity to the Semitic idiom. In 1897 he produced Neue Bibelstudien, sprachgeschichtliche Beitrage zumeist aus den Papyri und Inschriften zur Erklarung des Neuen Testaments.<P>In 1901 (2nd edition in 1903) these two volumes were translated as one by A. Grieve under the title Bible Studies. Deissmann\'s other volumes have confirmed his thesis. The most important are New Light on the New Testament (1907), The Philology of the Greek Bible (1908), Licht vom Osten (1908), Light from the Ancient East (translation by Strachan, 1910), Paul in the Light of Social and Religious History (1912). In Light from the Ancient East, Deissmann illustrates the New Testament language with much detail from the papyri, ostraka and inscriptions. He is now at work on a new lexicon of the New Testament which will make use of the fresh knowledge from these sources.<P>The otherwise helpful work of E. Preuschen, Vollstandiges griechisch-deutsches Handworterbuch zu den Schriften des Neuen Testaments und der ubrigen urchristlichen Literatur (1908-10), fails to utilize the papyri and inscriptions while drawing on the Septuagint and the New Testament Apocrypha and other early Christian literature. But this has been done by Ebeling in his Griechisch-deutsches Worterbuch zum New Testament, 1913. The next step was made by A. Thumb, the great philologian, in his Griechische Sprache im Zeitalter des Hellenismus; Beitrage zur Geschichte und Beurteilung der "koine," 1901, in which the real character of the koine was for the first time properly set forth.<P>Winer and Blass had both lamented the need of a grammar of the koine, and that demand still exists, but Thumb went a long way toward supplying it in this volume. It is to be hoped that he will yet prepare a grammar of the koine. Thumb\'s interests cover the whole range of comparative philology, but he has added in this field "Die Forschungen fiber die hellenistische Sprache in den Jahren 1896-1901," Archiv fur Papyrusforschung, II, 396f; "Prinzipienfragen der Koina-Forschung," Neue Jahrb. fur das kl. Alt., 1906; "Die sprachgeschichtliche Stellung des biblischen Griechisch," Theologische Rundschau, V, 85-99.<P>The other most important name to add is that of J. Hope Moulton, who has the credit of being the first to apply the new knowledge directly to the New Testament Greek His Grammar of New Testament Greek, I, Prolegomena (1906, 2nd edition,1906,3rd edition,1908,German translation in 1911, Einleitung in die Sprache des New Testament) is a brilliant piece of work and relates the Greek of the New Testament in careful detail to the vernacular koine, and shows that in all important points it is the common Greek of the time and not a Hebraic Greek. Moulton probably pressed his point too far in certain respects in his zeal against Hebraisms, but the essential position of Deissmann and Moulton is undoubtedly sound.<P>Moulton had previously published the bulk of this material as "Grammatical Notes from the Papyri," The Expositor,1901,271-82; 1903, 104-21, 423-39; The Classical Review,1901,31-37, 434-41; 1904, 106-12, 151-55; "Characteristics of New Testament Greek, " The Expositor, 1904.<P>In 1909 appeared his essay, Greek in the Light of Modern Discovery (see above). Since 1908, The Expositor has had a series of papers by J.H. Moulton and George Milligan called "Lexical Notes from the Papyri," which are very useful on the lexical side of the language. Thus the study is fairly launched on its new career. In 1900, A.T. Robertson produced a Syllabus on the New Testament Greek Syntax from the standpoint of comparative philology, which was rewritten in 1908, with the added viewpoint of the papyri researches, as A Short Grammar of the Greek New Testament (2nd edition,1909,3rd edition, 1912; translations in Italian in 1910, German and French in 1911, Dutch in 1912). In October,1909,S. Angus published a good article in the Harvard Theological Review on "Modern Methods in New Testament Philology," followed in January,1910,by another in the Princeton Review on "The koine, the Language of the New Testament." The new knowledge appears also in Jakob Wackernagel, "Die griechische Sprache" (pp. 291-318, 2nd edition, of Die griechische und lateinische Literatur und Sprache, 1907). L. Radermachcr has set forth very ably "die sprachlichen Vorgange in ihrem Zusammenhang," in his Neutestamentliche Grammatik: Das Griechisch des Neuen Testaments im Zusammenhang mit der Volkssprache. It is in reality the background of the New Testament Greek and is a splendid preparation for the study of the Greek New Testament. A full discussion of the new knowledge in grammatical detail has been prepared by A.T. Robertson under the title A Grammar of the Greek New Testament in the Light of Historical Research. Moulton and Schmiedel are planning also to complete their works.<P>3. The Proof of the New Position:<P>The proof of the new position is drawn from several sources:<P>(1) The Papyri.<P>These rolls have lain in the museums of the world many years and attracted little attention. For lists of the chief collections of the papyri see Moulton, Prolegomena, 259-62; Milligan, Selections from the Greek Papyri, xi, xii; Mayser, Grammatik der griechischen Papyri aus der Ptolemaerzeit; Lautund Wortlehre, vii-x; Deissmann, Light from the Ancient East, 20-41; Robertson, Grammar of the Greek New Testament, Bibliography. New volumes of papyri as a result of recent explorations in Egypt are published each year. See <a href="./study/isbe/search.html?string=PAPYRUS">PAPYRUS</a>, and in the other encyclopedias under the word. Most of the papyri discovered belong to the period of the koine (the first three centuries BC and AD in round numbers), and with great wealth of illustration they show the life of the common people of the time, whether in Egypt or Herculaneum (the two chief regions represented). There are various degrees of culture shown, as can be seen in any of the large volumes of Grenfell and Hunt, or in the handbooks of Lietzmann, Griechische Papyri (1905), and of Milligan, Greek Papyri (1910). They come from the scrap-heaps of the long ago, and are mainly receipts, contracts, letters of business or love, military documents, etc. They show all grades of culture, from the illiterate with phonetic spelling to the man of the schools. But we have here the language of life, not of the books. In a most startling way one notes the similarities of vocabulary, forms, and syntax between the language of the papyri of the 1st century AD and that of the New Testament books. As early as 1778, F.W. Sturz, made use of the Charta Borgiana, "the first papyrus ever brought to Europe" (Deissmann, Light from the Ancient East, 39), and in 1841 Thiersch likewise saw the value of the papyri for the philology of the Septuagint. But the matter was not pressed. Lightfoot threw out a hint about the value of letters of the people, which was not followed till Deissmann saw the point; compare Moulton, Prol., 242. It is not necessary here to illustrate the matter at length. Deissmann takes up in detail the "Biblical" words in Thayer\'s Lexicon, and has no difficulty in finding most of them in the papyri (or inscriptions). Thus plerophoreo, is shown to be common in the papyri. See Deissmann, Bible Studies and Light from the Ancient East, for extensive lists. The papyri show also the same meanings for many words once thought peculiar to the Bible or the New Testament. An instance is seen in the official sense of presbuteros, in the papyri, 5 ho presbuteros les komes (Pap. Lugd. A 35f), "without doubt an official designation" (Deissmann, Bible Studies, 155). So adelphos, for members of the community, anastrophe, for manner of life, antilempsis, "help," leitourgia, "public service," paroikos, "sojourner," etc. (Deissmann, Light from the Ancient East, 107). R. Helbing (Grammatik der Septuaginta, 1908) and H. John Thackeray (A Grammar of the Old Testament in Greek according to the Septuagint, 1909) have applied the new knowledge to the language of the Septuagint, and it has been discussed with much ability in the first volumes. The use of the papyri for grammatical purposes is made easier by the excellent volume of E. Mayser, Grammatik der griechischen Papyri aus der Ptolemaerzeit; Laut- und Wortlehre (1906), though his "Syntax," is still a desideratum. Useful also is G. Cronert, Memoria Graeca Herculanensis (1903).<P>(2) The Ostraka.<P>The literature on this subject is still small in bulk. In 1899 Ulrich Wilcken published Griechische Ostraka aus Aegypten und Nubien, and in 1902 W.E. Crum produced his book of Christian ostraka called Coptic Ostraca from the Collections of the Egypt Exploration Fund, the Cairo Museum, and Others. This was followed in 1905 by H.R. Hall\'s Coptic and Greek Texts of the Christian Period from Ostraka, Stelae, etc. These broken pieces of pottery were used by the lowest classes as writing material. It was very widely used because it was so very cheap. Wilcken has done more than anyone else to collect and decipher the ostraka. Deissmann (Light from the Ancient East, 46) notes that Cleanthes the Stoic "wrote on ostraka or on leather" because too poor to buy papyrus. So he quotes the apology of a Christian for using potsherd for a letter: "Excuse me that I cannot find papyrus as I am in the country" (Crum, Coptic Ostraca, 55). The use of apecho, on an ostrakon for a receipt in full, illustrates well the frequent use of this word in the New Testament (Deissmann, Light from the Ancient East, 111).<P>(3) The Inscriptions.<P>Here caution must be used since many of the inscriptions give, not the vernacular, but the literary language. The official (legal and military) decrees often appear in very formal style. But a number do preserve the vernacular idiom and often have the advantage of being dated. These inscriptions are chiefly on stone, but some are on metal and there are a few wax tablets. The material is vast and is constantly growing. See list of the chief collections in Deissmann\'s Light from the Ancient East, 10-20. Boeckh is the great name here. As early as 1779 Walch (Observationes in Matt. ex graecis inscriptionibus) made use of Greek inscriptions for New Testament exegesis, and R.A. Lipsius says that his father (K.H.A. Lipsius, author of Grammatische Untersuchungen uber die biblische Gracitat) "contemplated a large grammar of the Greek Bible in which he would have availed himself of the discoveries in modern epigraphy" (Deissmann, Light, etc., 15). Schmiedel has made good use of the inscriptions so far in his revision of Winer; H.A.A. Kennedy (Sources of New Testament Greek, 1895), H. Anz (Subsidia ad Cogn., etc., 1894), R. Helbing (Grammatik der Septuaginta, 1908), J. Psichari (Essai sur le Grec de la Septante, 1908), H. John Thackeray (A Grammar of the Old Testament in Greek according to the Septuagint, 1909), and R. Meister (Prol. zu einer Grammatik der Septuaginta, 1907) turned to good account the inscriptions for the linguistic problems of the Septuagint, as indeed Hatch (Essays in Biblical Greek, 1889) had already done. W. Dittenberger added some valuable "Grammatica et orthographica" to his Orientis Graeci Inscriptiones Selectae (2 volumes,1903, 1905). See also E. L. Hicks and G. F. Hill, Greek Historical Inscriptions (1901), and Hicks\'s paper "On Some Political Terms Employed in the New Testament," Classical Review,1887,4ff, 42ff. W. M. Ramsay\'s Cities and Bishoprics of Phrygia (2 volumes,1895, 1897) and his other works show keen insight in the use of the inscriptions. Deissmann\'s Bible Studies (1895, 1901) applied the knowledge of the inscriptions to the Septuagint and to the New Testament. In his Light from the Ancient East (1910) copious use is made of the inscriptions for New Testament study. Moulton (Prol.,1906,258f; for lists) is alive to the value of the inscriptions for New Testament grammar, as indeed was Blass (Grammatik des neutestamentlichen Griechisch, 1896) before him.<P>Compare further, G. Thieme, Die Inschriften von Magnesia am Maander und das Neue Testament (1906); T. Nageli, Der Wortschatz des Apostels Paulus (1905), and J. Rouffiac, Recherches sur les caracteres du Grec dans le New Testament d\'apres les Inscr. de Priene (1911). Special treatises or phases of the grammar of the inscriptions appear in Meisterhans-Schwyzer, Grammatik der attischen Inschriften (1900); Nachmanson, Laute und Formen der magnetischen Inschriften (1896); Schweizer, Grammatik der pergamenischen Inschriften (1898).<P>Moulton and Milligan have drawn freely also on the inscriptions for their "Lexical Studies" running in The Expositor (1908 and the years following). The value of the inscriptions for the Greek of the New Testament is shown at every turn. For instance, prototokos, is no longer a "Biblical" word. It appears in a metrical inscription (undated) of Trachonitis on a tomb of a pagan "high priest" and "friend of the gods" (Deissmann, Light, etc., 88); compare Kaibel, Epigrammata Graeca, etc., number 460. Even agape, occurs on a pagan inscription of Pisidia (Papers of the American School of Classical Studies at Athens, 2, 57). See, further, W.H.P. Hatch\'s "Some Illustrations of New Testament Usage from Greek Inscriptions of Asia Minor," Journal of Biblical Literature,1908,134-146.<P>(4) Modern Greek.<P>As early as 1834 Heilmeier saw that the modern Greek vernacular went back to the koine (Moulton, Prologoumena, 29), but it is only in recent years that it was clearly seen that the modern Greek of the schools and usually in the newspapers is artificial, and not the real vernacular of today. Mullach\'s work (Grammatik der griechischen Vulgarsprache, 1856) was deficient in this respect. But Jannaris\' Historical Greek Grammar (1897) carries the history of the vernacular Greek along with the literary style. Hatzidakis, Einleitung in die neugriechische Grammatik,1892,clears the air very much and connects the modern Greek with the New Testament. But it is to Thumb that we are indebted for the best knowledge of the vernacular (he demotike) as opposed to the literary language (he kathareuousa) of today. Mitsotakis (Praktische Grammatik, 1891) had treated both together, though Wied (Die Kunst, die neugriechische Volksprache) gave only the vernacular. But Wied is only elementary. Thumb alone has given an adequate treatment of the modern Greek vernacular, showing its unity and historical contact with the vernacular koine (Handbuch der neugriechischen Volkssprache, 1895; Thumb-Angus, Handbook of Modern Greek Vernacular, 1912). Thus one can see the living stream of the New Testament speech as it has come on down through the ages. It is impossible to overestimate the importance of modern Greek vernacular in the knowledge of New Testament Greek. The disappearance of the optative, the vanishing of the infinitive before hina, and itacism are but instances of many others which are luminous in the light of the modern Greek vernacular. See Psichari, Essais de grammaire historique neo-grecque (1886-89).<P>(5) Historical and Comparative Grammar.<P>From this source the koine gets a new dignity. It will take one too far afield to sketch here the linguistic revolution wrought since the publication of, and partly caused by, Bopp\'s Vergleichende Grammatik (1857), following Sir William Jones\' discovery of Sanskrit. The great work of Brugmann and Delbruck (Grundriss der vergleichenden Grammatik der indogermanischen Sprachen, I-V, 1892-1909) marks the climax of the present development, though many workers have won distinction in this field. The point to accent here is that by means of comparative philology the Greek language is seen in its proper relations with other languages of the Indo-Germanic family, and the right interpretation of case, preposition, mode, tense, voice, etc., is made possible. The old traditional empiricism is relegated to the scrap-heap, and a new grammatical science consonant with the facts has taken its place. See Delbruck, Introduction to the Study of Language (1882), Giles, Short Manual of Comparative Philology (1901), for a resume of the facts. Wright, Comparative Grammar of the Greek Language (1912), applies the new learning to the Greek tongue. The progress in classical scholarship is well shown by Sandys in his History of Classical Scholarship (I-III, 1906-8) and by Gudeman, Geschichte der klass. Philologie, 2. Aufl, 1909. Innumerable monographs have enriched the literature of this subject. It is now feasible to see the Greek language as a whole, and grasp its historical unity. Seen in this light the koine is not a dying tongue or a corrupt dialect. It is a normal and natural evolution of the Greek dialects into a world-speech when Alexander\'s conquests made it possible. The vernacular koine which has developed into the modern Greek vernacular was itself the direct descendant of the Attic vernacular which had its roots in the vernacular of the earlier dialects. The dialectical developments are closely sketched by Thumb, Handbuch der griechischen Dialekte (1909), and by Buck, Introduction to the Study of Greek Dialects (1910), not to mention the older works of Hoffmann, Meister, etc. Jannaris has undertaken in his Historical Greek Grammar (1897) to sketch and interpret the facts of the Greek tongue throughout its long career, both in its literary and vernacular aspects. He has succeeded remarkably well on the whole, though not quite seeing the truth about the modern Greek vernacular. Schanz is seeking to lay the foundation for still better work by his Beitrage zur historischen Syntax der griechischen Sprache (1882 and the years following). But the New Testament student must be open to all the new light from this region, and it is very great. See, further, Dieterich, Untersuchungen zur Geschichte der griech. Sprache von der hellen. Zeit (1898).<P>4. Characteristics of the Vernacular "Koine":<P>As already indicated, the Greek of the New Testament is in the main just the vernacular koine of the 1st century AD, though Greek as used by men of ability and varying degrees of culture. The most striking difference between the vernacular koine and the literary Attic is seen in the vocabulary. The writers in the literary koine show more likeness to the classic Attic, but even they reveal the changes due to the intervening centuries. There was, of course, no violent break. The changes came gradually and naturally. It is mainly at this point that Deissmann has done such brilliant work in his Bible Studies and other books. He has taken the lists of "Biblical" and "ecclesiastical" words, as given by Cremer and Thayer, and has shown from the papyri, ostraka, inscriptions, or koine writers that they are not peculiar to the Bible, but belong to the current speech of the time. The proof is so overwhelming and extensive that it cannot be given here. Some words have not yet been found in the non-Biblical koine, but they may be any day. Some few words, of course, belong to the very nature of Christianity christianos, for instance), but apostolos, baptismos, paroikos, sunagoge, and hundreds of others can no longer be listed as "Biblical." New meanings come to old words also. Compare daimonion. It is interesting to note that the New Testament shows many of the words found in Aristophanes, who caught up the vernacular of his day. The koine uses more words from the lower strata of society. Aristotle likewise has many words common in the koine, since he stands at the parting of the ways between the old dialects and the new koine of Alexander\'s conquests. The koine develops a fondness for compound and even double compound (sesquipedalian) words; compare, for instance, anekdiegetos; aneklaletos; anexereunetos; antapokrinomai; oikodespotes; oligopsuchos; prosanapleroo; sunantilambanomai; huperentugchano; chrusodaktulios, etc. The use of diminutives is also noteworthy in the koine as in the modern Greek: compare thugatrion; klinarion; korasion; kunarion; onarion; opsarion; ploiarion; otion, etc. The formation of words by juxtaposition is very common as in plerophoreo, cheiro-graphon. In phonetics it is to be noticed that "ei", "oi", "ee", "eei", "u", "i" all had the value of "ee" in "feet." This itacism was apparent in the early koine. So ai = e and o and oo were not sharply distinguished. The Attic tt became ss, except in a few instances, like elatto, kreitton. The tendency toward de-aspiration (compare Ionic) was manifest; compare eph\' helpidi, for the reverse process. Elision is less frequent than in Attic, but assimilation is carried farther. The variable final consonants "n" (nu) and "s" (sigma) are used generally before consonants. We find "-ei-" for "-iei-" as in pein. outheis, and metheis, are common till 100 BC, when they gradually disappear before oudeis, and medeis. In general there is less sense of rhythm and more simplicity and clearness. Some of the subtle refinements of form and syntax of the classic did not survive in the koine vernacular. In accidence only a few points may be noted. In substantives the Ionic "-res" is frequent. The Attic second declension vanishes. In the third declension forms like nuktan, show assimilation to the first. Both charin, and charita, occur. Contraction is sometimes absent (compare Ionic) as in oreon. Adjectives show forms like asphalen, and indeclinable pleres, appears, and pan, for panta (compare megan), dusi, for duoin. The dual is gone. Even the dual pronouns hekateros, and poteros, are rare. tis, is occasionally used like hostis. hos ean, is more frequent than hos an, in the 1st century AD. The two conjugations blend more and more into one, as the -mi forms vanish. There is some confusion in the use of -ao and -eo verbs, and new presents occur like apoktenno, optano, steko. The forms ginomai, ginosko, are the rule now. There is much increase in aorists like escha, and imperfects like eicha. The form -osan (eichosan, eschosan) occasionally appears. Quite frequent is a perfect like dedokan, and the augment is often absent in the plu-perfect as in dedokei. Per contra, a double augment occurs in apekateste, and a treble augment in eneochthesan. The temporal augment is often absent with diphthong as in oikodomethe. The koine Greek has -tosan, not -nton. In syntax the tendency is toward simplicity, to short sentences, the paratactic construction, and the sparing use of particles. The vernacular koine avoids both the bombast of Asianism and the artificiality of Atticism. There is, indeed, more freedom in violating the rules of concord as to gender, number, and case. The nominativus pendens is common. The comparative does duty often for the superlative adjective, and the superlative generally has the elative sense. The accusative is increasingly common with verbs. The line between transitive and intransitive verbs is not a hard-and-fast one. The growth in the use of prepositions both with nouns and in composition is quite noticeable, but some of the older prepositions, like amphi, are vanishing. The cases used with various prepositions are changing. The instrumental use of en, is very common. Many new adverbial and prepositional phrases have developed. The optative is nearly dead and the infinitive (apart from the use of tou, en to, eis to, with the infinitive) is decaying before hina. The future participle is rare. me, begins to encroach on ou, with infinitives and participles. The periphrastic conjugation is specially common. The direct discourse is more frequent than the indirect. The non-final use of hina, is quite noticeable. There are, besides, dialectical and provincial peculiarities, but these do not destroy the real unity of the vernacular koine any more than do individual traits of separate writers.<P>II. Literary Elements in the New Testament.<P>Deissmann (Light from the Ancient East, 245) is disposed to deny any literary quality to the New Testament books save the Epistle to the Hebrews. "The Epistle to the Hebrews shows us Christianity preparing for a flight from its native levels into the higher region of culture, and we are conscious of the beginnings of a Christian world-literature." He speaks of it also as "a work which seems to hang in the background like an intruder among the New Testament company of popular books." One feels that this is an extreme position and cannot be justified by the facts. It is true that Peter and John were agrammatoi kai idiotai (<a onClick="return mV(\'Act\',4,13);">Ac 4:13</a>), and not men of the schools, but this was certainly not the case with Luke and Paul who were men of literary culture in the truest sense. Luke and Paul were not Atticists, but that artificial idiom did not represent the best type of culture. Deissmann admits that the New Testament has become literature, but, outside of He, he denies any literary quality in its composition. Paul, for instance, wrote only "letters," not "epistles." But Romans and Ephesians confront us. See Milligan, Greek Papyri, xxxi, for a protest against the sweeping statement of Deissmann on this point. One need not go to the extreme of Blass, "Die rhythmische Komposition des Hebr. Brides," Theol. Studien und Kritik,1902,420-61; Die Rythmen der asiatischen und romischen Kunstprosa,1905,to find in Hebrews and Paul\'s writings illustrations of the artificial rules of the Asianists. There is undoubtedly rhythm in Paul\'s eloquent passages (compare <a onClick="return mV(\'1Cr\',13,\'1-\');">1Co 13</a>; <a onClick="return mV(\'1Cr\',15,\'1-\');">15</a>), but it is the natural poetic quality of a soul aflame with high passions, not conformity to rules of rhetoric. To deny literary quality to Luke and Paul is to give a narrow meaning to the word "literary" and to be the victim of a theory. Christianity did make use of the vernacular koine, the wonderful world-speech so providentially at hand. But the personal equation figured here as always. Men of culture differ in their conversation from illiterate men and more nearly approximate literary style. It is just in Luke, Paul, and the author of He that we discover the literary flavor of men of ability and of culture, though free from artificiality and pedantry. The eloquence of He is that of passion, not of the art of Asianism. Indeed, the Gospels all show literary skill in the use of material and in beauty of language. The Gospel of John has the rare elevation and dignity of the highest type of mind. There is no Atticistic tendency in the New Testament as in Josephus, Ant. There is no posing for the present or for posterity. It is the language of life, the vernacular in the main, but rising at times from the very force of passion to high plateaus of emotion and imagination and poetic grace from the pens of men of real ability, and in some instances of high culture.<P>III. The Semitic Influence.<P>It is no longer possible to explain every variation in the New Testament from the classic Attic by the term Hebraism. That easy solution has disappeared. Sooth to say, when the true character of the vernacular koine is understood, there is not very much left to explain. The New Testament Greek as a rule is just normal koine. Milligan (Greek Papyri, xxx) admits on the part of Moulton "an overtendency to minimize" the "presence of undoubted Hebraisms, both in language and grammar." That is true, and is due to his strong reaction against the old theory of so many Hebraisms. The Semiticisms (Hebraisms and Aramaisms) are very natural results of the fact that the vernacular koine was used by Jews who read the Hebrew Bible and the Septuagint translation, and who also spoke Aramaic as their native tongue. The Septuagint, as translation of Greek, directly from the Hebrew (or Aramaic), has a much greater number of these Semiticisms. See Swete, An Introduction to the Old Testament in Greek (1900), for the salient facts. Thackeray in his Grammar of the Old Testament in Greek (1909) shows "the koine—the basis of Septuagint Greek" in section 3, and in section 4 discusses "the Semitic element in Septuagint Greek." The matter varies in different parts of the Septuagint, but in all parts the Semitic influence goes far beyond what it is in the New Testament. In the New Testament we have free composition in Greek, except in certain portions of the Gospels and Acts where Aramaic originals (oral or written) lie beyond the Greek text. So in particular <a onClick="return mV(\'Luk\',1,\'1-\');">Lu 1</a>, the words of Jesus in <a onClick="return mV(\'Luk\',2,\'1-\');">Lu 2</a>, and the <a onClick="return mV(\'Act\',1,\'1-\');">opening chapters of Acts</A>. See Dalman, Words of Jesus (1902), and J.T. Marshall, "The Aramaic Gospel," The Expositor, Ser. IV volumes II-VIII; see also <a href="./study/isbe/search.html?string=ARAMAIC">ARAMAIC</a> supra. There is, to some extent, translation-Gr, as in the Septuagint. The quotations from the Old Testament are either from the Hebrew original, or, as most frequently, from the Septuagint. In either case we have translation-Greek again. These two classes cover the more obvious Semiticisms if we add Hebrew names (persons and places) and other transliterations like abbadon, allelouia. The Greek of the Septuagint does not, of course, give a true picture of the Greek spoken by the Jews in Alexandria or in Palestine. But the constant reading of the Septuagint was bound to leave its impress on the style of the people (compare the King James Version and the English language). The surprise, in fact, is not the number of Semiticisms, but, all things considered, the fewness of them. Luke, just because he was a Gentile and so noted the Hebraisms in the Septuagint, shows rather more of them than the other New Testament writers: compare prosetheto triton pempsai (<a onClick="return mV(\'Luk\',20,12);">Lu 20:12</a>). Some of the points of style so common in the Septuagint find occasional parallel in the papyri or inscriptions, like blepon blepo, chara chairo, ov...hon...auton. Others are more obviously imitations of the Hebrew style, as in areskein enopion tinos, rather than areskein tini. But there is a certain dignity and elevation of style so characteristic of the Hebrew Old Testament that reappears in the New Testament. The frequent use of kai, in parts of the New Testament reminds one of the Septuagint and the Hebrew waw ("w"). There is, besides, an indefinable tone in the New Testament that is found in the Old Testament. Swete (Apocalypse of John, cxx) laments the tendency to depreciate unduly the presence of Hebraisms in the New Testament. The pendulum may have swung too far away from the truth. It will strike the level, but we shall never again be able to fill our grammars and commentaries with explanations of so many peculiar Hebraisms in the New Testament. On the whole the Greek New Testament is standard vernacular koine.<P>IV. Individual Peculiarities of the New Testament Writers.<P>There is not space for an extended discussion of this topic. The fact itself calls for emphasis, for there is a wide range in style between Mark\'s Gospel and Hebrews, 1 Peter and Romans, Luke\'s Gospel and the Apocalypse. There are no Atticists found in the New Testament (compare 4Macc in the Septuagint and Jos), but there are the less literary writings (Matthew, Mark, the Johannine books, the other catholic epistles) and the more literary writings (Luke\'s writings, Paul\'s Epistles, and Hebrews). But even so, no hard-and-fast line can be drawn. Moulton, Cambridge Biblical Essays,484,thinks 2 Peter more like the Atticistic writings, "though certainly the Atticists would have scorned to own a book so full of \'solecisms.\'" Moulton assumes that 2 Peter is pseudepigraphic, and does not credit the notion that the crude "Babu" Greek, to use Abbott\'s term, may be Peter\'s own uncorrected style (compare <a onClick="return mV(\'Act\',4,13);">Ac 4:13</a>), while 1 Peter may have the smoothing effect of Silvanus\' hand (compare <a onClick="return mV(\'1Pe\',5,12);">1Pe 5:12</a>). A similar explanation is open concerning the grammatical lapses of the Apocalypse, since John is also called agrammatos, in <a onClick="return mV(\'Act\',4,13);">Ac 4:13</a>, whereas the Gospel of John may have had the revision of the elders of Ephesus (compare <a onClick="return mV(\'Jhn\',21,24);">Joh 21:24</a>). But whatever the explanation, there is no doubt of the wide divergences style between different books and groups of books in the New Testament list. The Lukan, Johannine, Petrine, Pauline groups stand apart, but with cleavages within each group. Harnack (Luke the Physician, 1907; The Sayings of Jesus, 1908; The Acts of the Apostles, 1909; The Date of the Acts of the Apostles, 1911) has accepted and strengthened the contention of Hawkins (Horae Synopticae, 2nd edition, 1909) and of Hobart (Medical Language of Luke, 1882) that the medical terms in the Gospel of Luke and of Acts show that the books were written by the same writer and that a physician, and so Luke. The diversities in style here and there are chiefly due to the sources of information used. Even in the Pauline books, which form so well-marked a collection, striking diversities of language and style appear. But these letters cover a period of some 15 years of intense activity and mental and spiritual development, and treat a great variety of topics. They properly reflect the changing phases of Paul\'s preaching of the cross of Christ in different places and under varying circumstances and confronting ever fresh problems. The plays of Shakespeare offer a useful parallel. Even in Paul\'s old age, in the Pastoral Epistles the stamp of Paul\'s spirit is admitted by those who admit only Pauline fragments; compare J. Weiss, Beitrage zur Paulinschen Rhetorik (1897). The style is indeed the man, but style is also the function of the subject, and style varie
