isbe[5436]='Last Time, Times`(kairos eschatos, chronos eschatos (also plural), eschaton tou chronou, hora eschate): In the King James Version this phrase occurs in <a onClick="return mV(\'1Pe\',1,5);">1Pe 1:5</a>; <a onClick="return mV(\'1Pe\',1,20);">1:20</a> (plural); <a onClick="return mV(\'1Jo\',2,18);">1Joh 2:18</a>; <a onClick="return mV(\'Jud\',1,18);">Jude 1:18</a>. The Revised Version (British and American) has, in <a onClick="return mV(\'1Pe\',1,20);">1Pe 1:20</a>, "at the end of the times," and in <a onClick="return mV(\'1Jo\',2,18);">1Joh 2:18</a>, "the last hour," in closer adherence to the Greek. The conception is closely allied to that of "the last day," and, like this, has its root in the Old Testament conception of "the end of days." In the Old Testament this designates the entire eschatological period as that which the present course of the world is to issue into, and not, as might be assumed, the closing section of history. It is equivalent to what was later called "the coming aeon" (see <a href="./study/isbe/search.html?string=ESCHATOLOGY+OF+THE+NEW+TESTAMENT">ESCHATOLOGY OF THE NEW TESTAMENT</a>). In the New Testament, on the other hand, the phrase "the last time" does mark the concluding section of the present world-period, of the present aeon. In three of the New Testament passages the consciousness expresses itself that these "last times" have arrived, and that the period extending from the appearance or the resurrection of Christ until His Second Coming is the closing part of the present age, that the writer and readers are living in "the last times." In one passage (<a onClick="return mV(\'1Pe\',1,5);">1Pe 1:5</a>) "the last time" is projected farther forward into the future, so that it comes to mean the time immediately preceding the reappearance of Christ. Both usages can be readily explained. The days of the Messiah were to the Old Testament writers part of the future world, although to the later Jewish chiliasm they appeared as lying this side of it, because differing from the world to come in their earthly and temporal character. To the early Christians the days of the Messiah appeared more closely assimilated in character to the future world, so that no reason existed on this score for not including them in the latter. Still it was also realized that the Messiah in His first appearance had not brought the full realization of the coming world, and that only His return from heaven would consummate the kingdom of God. Accordingly, the days in which they lived assumed to them the character of an intermediate period, marked off on the one hand from the previous development by the appearance of the Messiah, but equally marked off from the coming eon by His reappearance in glory. From a formal point of view the representation resembles the Jewish chiliastic scheme, but with a twofold substantial difference:<P>(a) the chiliastic scheme restricts the Messiah and His work to the last days, and does not carry Him over into the coming world, whereas to the Christian the coming world, no less than the last days, is thoroughly Messianic;<P>(b) to the Jewish point of view both the days of the Messiah and the coming world lie in the future, whereas to the Christian the former have already arrived.<P>It remained possible, however, from the Christian point of view to distinguish within the last times themselves between the immediate present and the future conclusion of this period, and this is done in <a onClick="return mV(\'1Pe\',1,5);">1Pe 1:5</a>. Also in <a onClick="return mV(\'1Jo\',2,18);">1Joh 2:18</a> the inference that "the last hour" has come is not drawn from the presence of the Messiah, but from the appearance of the anti-Christian power, so that here also a more contracted conception of the last stage of history reveals itself, only not as future (<a onClick="return mV(\'1Pe\',1,5);">1Pe 1:5</a>), but as present (hence, "hour" not "time").`<a href="./study/isbe/search.html?string=ESCHATOLOGY+OF+THE+NEW+TESTAMENT">ESCHATOLOGY OF THE NEW TESTAMENT</a>`182';
isbe[5437]='Lasthenes`las\'-the-nez (Lasthenes): A highly placed official under King Demetrius II, Nicator. He is called the king\'s "kinsman" (the King James Version "cousin") and "father" (1Macc 11:31,32; Josephus, Ant, XIII, iv, 9), but these are to be taken as court titles rather than as denoting blood-relationship. According to Josephus (Ant., XIII, iv, 3) he was a native of Crete, and raised an army for the king when he made his first descent upon the coast, and rendered him ultimately successful in wresting the throne of Syria from Alexander Balas (1Macc 10:67; Ant, XIII, iv, 3). The letter addressed to Lasthenes indicates that he was probably prime minister or grand vizier of the kingdom.``79';
isbe[5438]='Latchet`lach\'-et (serokh; himas): Leather thong used for tying on sandals (see <a onClick="return mV(\'Gen\',14,23);">Ge 14:23</a>; <a onClick="return mV(\'Mar\',1,7);">Mr 1:7</a> parallel). The stooping to untie the dusty shoe-latchet was esteemed by Orientals a service that was at once petty and defiling, and was usually assigned to menials.``1';
isbe[5439]='Latin`lat\'-in: Was the official language of the Roman Empire as Greek was that of commerce. In Palestine Aramaic was the vernacular in the rural districts and remoter towns, while in the leading towns both Greek and Aramaic were spoken. These facts furnish the explanation of the use of all three tongues in the inscription on the cross of Christ (<a onClick="return mV(\'Mat\',27,37);">Mt 27:37</a>; <a onClick="return mV(\'Mar\',15,26);">Mr 15:26</a>; <a onClick="return mV(\'Luk\',23,38);">Lu 23:38</a>; <a onClick="return mV(\'Jhn\',19,19);">Joh 19:19</a>). Thus the charge was written in the legal language, and was technically regular as well as recognizable by all classes of the people. The term "Latin" occurs in the New Testament only in <a onClick="return mV(\'Jhn\',19,20);">Joh 19:20</a>, Rhomaisti, and in <a onClick="return mV(\'Luk\',23,38);">Lu 23:38</a>, Rhomaikois (grammasin), according to Codices Sinaiticus, A, D, and N. It is probable that Tertullus made his plea against Paul before Felix (<a onClick="return mV(\'Act\',24,\'1-\');">Ac 24</a>) in Latin, though Greek was allowed in such provincial courts by grace of the judge. It is probable also that Paul knew and spoke Latin; compare W.M. Ramsay, Pauline and Other Studies,1906,65, and A. Souter, "Did Paul Speak Latin?" The Expositor, April, 1911. The vernacular Latin had its own history and development with great influence on the ecclesiastical terminology of the West. See W. Bury, "The Holy Latin Tongue," Dublin Review, April,1906,and Ronsch, Itala und Vulgata, 1874, 480f. There is no doubt of the mutual influence of Greek and Latin on each other in the later centuries. See W. Schulze, Graeca Latina, 1891; Viereck, Sermo Graecus, 1888.<P>It is doubtful if the Latin syntax is clearly perceptible in the koine (see <a href="./study/isbe/search.html?string=LANGUAGE+OF+THE+NEW+TESTAMENT">LANGUAGE OF THE NEW TESTAMENT</a>).<P>Deissmann (Light from the Ancient East, 117f) finds ergasian didomi (operam dare) in an xyrhynchus papyrus letter of the vulgar type from 2nd century BC (compare <a onClick="return mV(\'Luk\',12,58);">Lu 12:58</a>). A lead tablet in Amorgus has krino to dikaion (compare <a onClick="return mV(\'Luk\',12,57);">Lu 12:57</a>). The papyri (2nd century AD) give sunairo logon (compare <a onClick="return mV(\'Mat\',18,23);">Mt 18:23</a>f). Moulton (Expositor, February, 1903, 115) shows that to hikanon poiein (satisfacere), is as old as Polybius. Even sumbouilion lambanien (concilium capere), may go with the rest like su opes (<a onClick="return mV(\'Mat\',27,4);">Mt 27:4</a>), for videris (Thayer). Moulton (Prol., 21) and Thumb (Griechische Sprache, 121) consider the whole matter of syntactical Latinisms in the New Testament inconclusive. But see also C. Wessely, "Die lateinischen Elemente in der Gracitat d. agypt. Papyrusurkunden," Wien. Stud., 24; Laforcade. Influence du Latin sur le Grec. 83-158.<P>There are Latin words in the New Testament: In particular Latin proper names like Aquila, Cornelius, Claudia, Clemens, Crescens, Crispus, Fortunatus, Julia, Junia, etc., even among the Christians in the New Testament besides Agrippa, Augustus, Caesar, Claudius, Felix, Festus, Gallio, Julius, etc.<P>Besides we find in the New Testament current Latin commercial, financial, and official terms like assarion (as), denarion (denarius), kenturion (centurio), kenos (census), kodrantes (quadrans), kolonia (colonia), koustodia (custodia), legeon (legio), lention (linteum), libertinos (libertinus), litra (litra), makellon (macellum), membrana (membrana), milion (mille), modios (modius), xestes (sextarius), praitorion (praetorium), sikarios (sicarius), simikinthion (semicinctium), soudarion (sudarium), spekoulator (speculator), taberna (taberna), titlos (titulus), phelones (paenula), phoron (forum), phragellion (flagellum), phragelloo (flagello), chartes (charta?), choros (chorus).<P>Then we meet such adjectives as Herodianoi, Philippesioi, Christianoi, which are made after the Latin model. Mark\'s Gospel shows more of these Latin words outside of proper names (compare <a onClick="return mV(\'Rom\',16,\'1-\');">Ro 16</a>), as is natural if his Gospel were indeed written in Rome.<P>See also <a href="./study/isbe/search.html?string=LATIN+VERSION,+THE+OLD">LATIN VERSION, THE OLD</a>.<P>LITERATURE.<P>Besides the literature already mentioned see Schurer, Jewish People in the Time of Christ, Div II, volume I, 43ff; Krauss, Griechische und lateinische Lehnworter im Talmud (1898, 1899); Hoole, Classical Element in the New Testament (1888); Jannaris, Historical Greek Grammar (1897); W. Schmid, Atticismus, etc. (1887-97); Kapp, Latinismis merito ac falso susceptis (1726); Georgi, De Latinismis N T (1733); Draeger, Historische Syntax der lat. Sprache (1878-81); Pfister, Vulgarlatein und Vulgargriechisch (Rh. Mus., 1912, 195-208).``150';
isbe[5440]='Latin Version, the Old`1. The Motive of Translation<P>2. Multiplicity of Latin Translations in the 4th Century<P>3. The Latin Bible before Jerome<P>4. First Used in North Africa<P>5. Cyprian\'s Bible<P>6. Tertullian\'s Bible<P>7. Possible Eastern Origin of Old Latin<P>8. Classification of Old Latin Manuscripts<P>9. Individual Characteristics<P>10. Value of Old Latin for Textual Criticism<P>LITERATURE<hr /><P>1. The Motive of Translation:<P>The claim of Christianity to be the one true religion has carried with it from the beginning the obligation to make its Holy Scriptures, containing the Divine message of salvation and life eternal, known to all mankind. Accordingly, wherever the first Christian evangelists carried the gospel beyond the limits of the Greek-speaking world, one of the first requirements of their work was to give the newly evangelized peoples the record of God\'s revelation of Himself in their mother tongue. It was through the Septuagint translation of the Old Testament that the great truths of revelation first became known to the Greek and Roman world. It is generally agreed that, as Christianity spread, the Syriac and the Latin versions were the first to be produced; and translations of the Gospels, and of other books of the Old and New Testament in Greek, were in all probability to be found in these languages before the close of the 2nd century.<P>2. Multiplicity of Latin Translations in the 4th Century:<P>Of the earliest translators of the Bible into Latin no record has survived. Notwithstanding the careful investigations of scholars in recent years, there are still many questions relating to the origin of the Latin Bible to which only tentative and provisional answers can be given. It is therefore more convenient to begin a study of its history with Jerome toward the close of the 4th century and the commission entrusted to him by Pope Damasus to produce a standard Latin version, the execution of which gave to Christendom the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) (see <a href="./study/isbe/search.html?string=VULGATE">VULGATE</a>). The need for such a version was clamant. There existed by this time a multiplicity of translations differing from one another, and there was none possessed of commanding authority to which appeal might be made in case of necessity. It was the consideration of the chaotic condition of the existing translations, with their divergences and variations, which moved Damasus to commission Jerome to his task and Jerome to undertake it. We learn particulars from the letter of Jerome in 383 transmitting to his patron the first installment of his revision, the Gospels. "Thou compellest me," he writes, "to make a new work out of an old so that after so many copies of the Scriptures have been dispersed throughout the whole world I am as it were to occupy the post of arbiter, and seeing they differ from one another am to determine which of them are in agreement with the original Greek." Anticipating attacks from critics, he says, further: "If they maintain that confidence is to be reposed in the Latin exemplars, let them answer which, for there are almost as many copies of translations as manuscripts. But if the truth is to be sought from the majority, why not rather go back to the Greek original, and correct the blunders which have been made by incompetent translators, made worse rather than better by the presumption of unskillful correctors, and added to or altered by careless scribes?" Accordingly, he hands to the Pontiff the four Gospels to begin with after a careful comparison of old Greek manuscripts.<P>From Jerome\'s contemporary, Augustine, we obtain a similar picture. "Translators from Hebrew into Greek," he says (De Doctrina Christiana, ii.11), "can be numbered, but Latin translators by no means. For whenever, in the first ages of the faith, a Greek manuscript came into the hands of anyone who had also a little skill in both languages, he made bold to translate it forthwith." In the same context he mentions "an innumerable variety of Latin translators," "a crowd of translators." His advice to readers is to give a preference to the Itala, "which is more faithful in its renderings and more intelligible in its sense." What the Itala is, has been greatly discussed. Formerly it was taken to be a summary designation of all the versions before Jerome\'s time. But Professor Burkitt (Texts and Studies, IV) strongly urges the view that by this term Augustine designates Jerome\'s Vulgate, which he might quite well have known and preferred to any of the earlier translations. However this may be, whereas before Jerome there were those numerous translations, of which he and Augustine complain, after Jerome there is the one preeminent and commanding work, produced by him, which in course of time drove all others out of the field, the great Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) edition, as it came to be called, of the complete Latin Bible.<P>3. The Latin Bible before Jerome:<P>We are here concerned with the subject of the Latin Bible before the time of Jerome. The manuscripts which have survived from the earlier period are known by the general designation of Old Latin. When we ask where these first translations came into existence, we discover a somewhat surprising fact. It was not at Rome, as we might have expected, that they were first required. The language of Christian Rome was mainly Greek, down to the 3rd century. Paul wrote the Epistle to the Romans in Greek. When Clement of Rome in the last decade of the 1st century wrote an epistle in the name of the Roman church to the Corinthians, he wrote in Greek Justin Martyr, and the heretic Marcion, alike wrote from Rome in Greek. Out of 15 bishops who presided over the Roman. See down to the close of the 2nd century, only four have Latin names. Even the pagan emperor Marcus Aurelius wrote his Meditations in Greek If there were Christians in Rome at that period whose only language was Latin, they were not sufficiently numerous to be provided with Christian literature; at least none has survived.<P>4. First Used in North Africa:<P>It is from North Africa that the earliest Latin literature of the church has come down to us. The church of North Africa early received a baptism of blood, and could point to an illustrious roll of martyrs. It had also a distinguished list of Latin authors, whose Latin might sometimes be rude and mixed with foreign idioms, but had a power and a fire derived from the truths which it set forth. One of the most eminent of these Africans was Cyprian, bishop of Carthage, who won the martyr\'s crown in 257. His genuine works consist of a number of short treatises, or tracts, and numerous letters, all teeming with Scripture quotations. It is certain that he employed a version then and there in use, and it is agreed that "his quotations are carefully made and thus afford trustworthy standards of African Old Latin in a very early though still not the earliest stage" (Hort, Introduction to the New Testament in Greek, 78).<P>5. Cyprian\'s Bible:<P>Critical investigation has made it clear that the version used by Cyprian survives in a fragmentary copy of Mark and Matthew, now at Turin in North Italy, called Codex Bobbiensis (k), and in the fragments of the Apocalypse and Acts contained in a palimpsest at Paris called Codex Floriacensis (h). It has been found that another MS, Codex Palatinus (e) at Vienna, has a text closely akin to that exhibited in Cyprian, although there are traces of mixture in it. The text of these manuscripts, together with the quotations of the so-called Speculum Augustini (m), is known among scholars as African Old Latin. Another manuscript with an interesting history, Codex Colbertinus (c) contains also a valuable African element, but in many parts of the Gospels it sides also with what is called the European Old Latin more than with k or e. Codex Bobbiensis (k) has been edited with a learned introduction in the late Bishop John Wordsworth\'s Old Latin Biblical Texts, the relation of k to Cyprian as well as to other Old Latin texts being the subject of an elaborate investigation by Professor Sanday. That Cyprian, who was not acquainted with Greek, had a written version before him which is here identified is certain, and thus the illustrious bishop and martyr gives us a fixed point in the history of the Latin Bible a century and a half earlier than Jerome.<P>6. Tertullian\'s Bible:<P>We proceed half a century nearer to the fountainhead of the African Bible when we take up the testimony of Tertullian who flourished toward the close of the 2nd century. He differed from Cyprian in being a competent Greek scholar. He was thus able to translate for himself as he made his quotations from the Septuagint or the Greek New Testament, and is thus for us by no means so safe a witness to the character or existence of a standard version. Professor Zahn (GK, I, 60) maintains with considerable plausibility that before 210-240 AD there was no Latin Bible, and that Tertullian with his knowledge of Greek just translated as he went along. In this contention, Zahn is not supported by many scholars, and the view generally is that while Tertullian\'s knowledge of Greek is a disturbing element, his writings, with the copious quotations from both Old Testament and New Testament, do testify to the existence of a version which had already been for some time in circulation and use. Who the African Wycliffe or Tyndale was who produced that version has not been recorded, and it may in fact have been the work of several hands, the result, as Bishop Westcott puts it, of the spontaneous efforts of African Christians (Canon of the NT7, 263).<P>7. Possible Eastern Origin of Old Latin:<P>Although the evidence has, up to the present time, been regarded as favoring the African origin of the first Latin translation of the Bible, recent investigation into what is called the Western text of the New Testament has yielded results pointing elsewhere. It is clear from a comparison that the Western type of text has close affinity with the Syriac witnesses originating in the eastern provinces of the empire. The close textual relation disclosed between the Latin and the Syriac versions has led some authorities to believe that, after all, the earliest Latin version may have been made in the East, and possibly at Antioch. But this is one of the problems awaiting the discovery of fresh material and fuller investigation for its solution.<P>8. Classification of Old Latin Manuscripts:<P>We have already noticed the African group, so designated from its connection with the great African Fathers, Tertullian and especially Cyprian, and comprising k, e, and to some extent h and m. The antiquity of the text here represented is attested by these African Fathers.<P>When we come down to the 4th century we find in Western Europe, and especially in North Italy, a second type of text, which is designated European, the precise relation of which to the African has not been clearly ascertained. Is this an independent text which has arisen on the soil of Italy, or is it a text derived by alteration and revision of the African as it traveled northward and westward? This group consists of the Codex Vercellensis (a) and Codex Vcronensis (b) of the 4th or 5th century at Vercelli and Verona respectively, and there may be included also the Codex Vindobonensis (i) of the 7th century at Vienna. These give the Gospels, and a gives for John the text as it was read by the 4th-century Father, Lucifer of Cagliari in Sardinia. The Latin of the Greek-Latin manuscript D (Codex Bezae) is known as d, and much of Irenaeus are classed with this group.<P>Still later, Professor Hort says from the middle of the 4th century, a third type, called Italic from its more restricted range, is found. It is represented by Codex Brixianus (f) of the 6th century, now at Brescia, and Codex Monacensis (q) of the 7th century, at Munich. This text is probably a modified form of the European, produced by revision which has brought it more into accord with the Greek, and has given it a smoother Lot aspect. The group has received this name because the text found in many of Augustine\'s writings is the same, and as he expressed a preference for the Itala, the group was designated accordingly. Recent investigation tends to show that we must be careful how we use Augustine as an Old Latin authority, and that the Itala may be, not a pre-Vulgate text, but rather Jerome\'s Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) This, however, is still uncertain; the fact remains that as far as the Gospels are concerned, f and q represent the type of text most used by Jerome.<P>9. Individual Characteristics:<P>That all these groups, comprising in all 38 codices, go back to one original is not impossible. Still there may have been at first local VSS, and then an official version formed out of them. When Jerome\'s revision took hold of the church, the Old Latin representatives for the most part dropped out of notice. Some of them, however, held their ground and continued to be copied down to the 12th and even the 13th century Codex C (Ephraemi) is an example of this; it is a manuscript of the 12th century, but as Professor Burkitt has pointed out (Texts and Studies, IV, "Old Latin," 11) "it came from Languedoc, the country of the Albigenses. Only among heretics isolated from the rest of Western Christianity could an Old Latin text have been written at so late a period." An instance of an Old Latin text copied in the 13th century is the Gigas Holmiensis, quoted as Gig, now at Stockholm, and so called from its great size. It contains the Acts and the Apocalypse of the Old Latin and the rest of the New Testament according to the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) It has to be borne in mind that in the early centuries complete Bibles were unknown. Each group of books, Gospels, Acts and Catholic Epistles, Pauline Epistles, and Revelation for the New Testament, and Pentateuch, Historical Books, Psalms and Prophets for the Old Testament, has to be regarded separately. It is interesting, also, to note that when Jerome revised, or even retranslated from the Septuagint, Tobit and Judith of the Apocrypha, the greater number of these books, the Wisdom, Ecclesiasticus, 1 and 2Maccabees, and Baruch were left unrevised, and were simply added to the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) from the Old Latin version.<P>10. Value of Old Latin for Textual Criticism:<P>These Old Latin translations going back in their earliest forms to nearly the middle of the 2nd century are very early witnesses to the Greek text from which they were made. They are the more valuable inasmuch as they are manifestly very literal translations. Our great uncial manuscripts reach no farther back than the 4th century, whereas in the Old Latin we have evidence—indirect indeed and requiring to be cautiously used—reaching back to the 2nd century. The text of these manuscripts is neither dated nor localized, whereas the evidence of these VSS, coming from a particular province of the church, and being used by Fathers whose period is definitely known, enables us to judge of the type of Greek text then and there in use. In this connection, too, it is noteworthy that while the variations of which Jerome and Augustine complained were largely due to the blunders, or natural mistakes, of copyists, they did sometimes represent various readings in the Greek originals.<P>LITERATURE.<P>Wordsworth and White, Old Latin Biblical Texts, 4 volumes; F.C. Burkitt, "The Old Latin and the Itala," Texts and Studies, IV; "Old Latin VSS" by H.A.A. Kennedy in Hastings, Dictionary of the Bible (five volumes); "Bibelubersetzungen, Lateinische" by Fritzsche-Nestle in PRE3; Intros to Textual Criticism of the New Testament by Scrivener, Gregory, Nestle, and Lake.``128';

isbe[5443]='Laud`lod: A verb meaning "to praise," used in <a onClick="return mV(\'Rom\',15,11);">Ro 15:11</a> the King James Version, and <a onClick="return mV(\'Psa\',117,1);">Ps 117:1</a>; <a onClick="return mV(\'Psa\',145,4);">145:4</a>. The Revised Version (British and American) either should have avoided the word altogether or else should have used it much more extensively—preferably the latter, as the word is not obsolete in liturgical English.``1';
isbe[5444]='Laughing-Stock`laf\'-ing-stok: Something set up to be laughed at; thrice in the Revised Version (British and American) the translation of sechoq, "laughter," etc. (<a onClick="return mV(\'Job\',12,4);">Job 12:4</a> twice; <a onClick="return mV(\'Jer\',20,7);">Jer 20:7</a>; compare <a onClick="return mV(\'Jer\',48,26,27,39);">Jer 48:26,27,39</a>; <a onClick="return mV(\'Lam\',3,14);">La 3:14</a>).`<a href="./study/isbe/search.html?string=MOCK,+MOCKING">MOCK, MOCKING</a>`1';
isbe[5445]='Laughter`laf\'-ter (chaq, tsachaq, "to laugh," sechoq, "laughter"; gelao, katagelao):<P>(1) Laughter as the expression of gladness, pleasurable surprise, is the translation of tsachaq (<a onClick="return mV(\'Gen\',17,17);">Ge 17:17</a>; <a onClick="return mV(\'Gen\',18,12,13,15);">18:12,13,15</a>; <a onClick="return mV(\'Gen\',21,6);">21:6</a>), which, however, should perhaps be "laugh at me," not "with me," as the King James Version and the Revised Version (British and American) (so Delitzsch and others; see also Hastings in HDB), not in the sense of derision, but of surprise and pleasure. In the same verse for "God hath made me to laugh," the Revised Version (British and American) gives in margin, "hath prepared laughter for me," and this gave his name to the son, the promise of whose birth evoked the laughter (Yitschaq, Isaac); gelao (<a onClick="return mV(\'Luk\',6,21,25);">Lu 6:21,25</a>) has the same meaning of gladness and rejoicing; sechoq, "laughter," has also this sense (<a onClick="return mV(\'Job\',8,21);">Job 8:21</a>; <a onClick="return mV(\'Psa\',126,2);">Ps 126:2</a>). It is, however, "laughed to scorn" in <a onClick="return mV(\'Job\',12,4);">Job 12:4</a>; the Revised Version (British and American) "laughing-stock"; so <a onClick="return mV(\'Jer\',20,7);">Jer 20:7</a>; compare <a onClick="return mV(\'Jer\',48,26,27,39);">48:26,27,39</a>; <a onClick="return mV(\'Lam\',3,14);">La 3:14</a>, "derision."<P>(2) Sachaq is used (except <a onClick="return mV(\'Job\',29,24);">Job 29:24</a>; <a onClick="return mV(\'Ecc\',3,4);">Ec 3:4</a>) in the sense of the laughter of defiance, or derision (<a onClick="return mV(\'Job\',5,22);">Job 5:22</a>; <a onClick="return mV(\'Job\',41,29);">41:29</a>); in Piel it is often translated "play," "playing," "merry"<P>(3) La\'agh is "to scorn" "to laugh to scorn" (<a onClick="return mV(\'2Ki\',19,21);">2Ki 19:21</a>; <a onClick="return mV(\'Neh\',2,19);">Ne 2:19</a>); sachaq has also this sense (<a onClick="return mV(\'2Ch\',30,10);">2Ch 30:10</a>); tsechoq (<a onClick="return mV(\'Eze\',23,32);">Eze 23:32</a>); sechoq (<a onClick="return mV(\'Job\',12,4);">Job 12:4</a>); katagelao (<a onClick="return mV(\'Mat\',9,24);">Mt 9:24</a>; <a onClick="return mV(\'Mar\',5,40);">Mr 5:40</a>; <a onClick="return mV(\'Luk\',8,53);">Lu 8:53</a>); the simple gelao occurs only in <a onClick="return mV(\'Luk\',6,21,25);">Lu 6:21,25</a>; see above. Katagelao is found in Judith 12:12, "laugh to scorn" (Ecclesiasticus 7:11; 20:17; 1Macc 10:70, the Revised Version (British and American) "derision").<P>For "laugh" (<a onClick="return mV(\'Job\',9,23);">Job 9:23</a>) the Revised Version (British and American) has "mock"; for "mocked of his neighbor" and "laughed to scorn" (<a onClick="return mV(\'Job\',12,4);">Job 12:4</a>) "laughing-stock"; for "shall rejoice in time to come" (<a onClick="return mV(\'Pro\',31,25);">Pr 31:25</a>), "laugheth at the time to come"; "laughter" for "laughing" (<a onClick="return mV(\'Job\',8,21);">Job 8:21</a>).``185';

isbe[5447]='Laver`la\'-ver (kiyor):<P>1. In the Tabernacle:<P>Every priest in attendance on the altar of Yahweh was required to wash his hands and his feet before entering upon his official duties (<a onClick="return mV(\'Exd\',30,19);">Ex 30:19</a>). To this end a laver was ordered to be made as part of the tabernacle equipment (<a onClick="return mV(\'Exd\',30,\'17-21\');">Ex 30:17-21</a>; <a onClick="return mV(\'Exd\',38,8);">38:8</a>). Its composition was of brass (bronze), and it consisted of two parts, the bowl and its pedestal or foot (<a onClick="return mV(\'Exd\',30,18);">Ex 30:18</a>, etc.). This first laver was a small one, and was made of the hand mirrors of the women in attendance upon the altar (<a onClick="return mV(\'Exd\',38,8);">Ex 38:8</a>). Its place was between the altar and the tabernacle (<a onClick="return mV(\'Exd\',40,30);">Ex 40:30</a>).<P>See <a href="./study/isbe/search.html?string=TABERNACLE">TABERNACLE</a>.<P>2. In the Temple:<P>The difficulty as to the washing of parts of the sacrificial carcasses was overcome, in the temple of Solomon, by the construction of "10 lavers" and a "molten sea" (<a onClick="return mV(\'1Ki\',7,\'23-37\');">1Ki 7:23-37</a>; <a onClick="return mV(\'2Ch\',4,\'2-6\');">2Ch 4:2-6</a>; see <a href="./study/isbe/search.html?string=TEMPLE">TEMPLE</a>; <a href="./study/isbe/search.html?string=SEA,+THE+MOLTEN">SEA, THE MOLTEN</a>). We learn from <a onClick="return mV(\'2Ch\',4,6);">2Ch 4:6</a> that the "sea" was for the priests to wash in—therefore took the place of the laver in the tabernacle—and the lavers were used as baths for portions of the burnt offerings. The lavers themselves were artistic works of unusual merit for that age. Like that in the tabernacle, each had its own stand or base, which was cast in a separate piece from the laver. These bases rested on wheels which allowed of the laver being moved from one part of the court to another without being turned about. Five stood on the north and five on the south side of the temple. They were ornamented with "lions, oxen, and cherubim," and on a lower level, with a series of wreaths or festoons of flowers (<a onClick="return mV(\'1Ki\',7,\'27-37\');">1Ki 7:27-37</a>). In modern speech, the lavers may be described as so many circular open tanks for the storage of water. Each laver contained 40 baths (about 320 gals.) of water. Its height was 5 cubits, the locomotive machinery being 3 cubits in height, and the depth of the bowl or tank, judging from its capacity, about 2 cubits. The last we hear of the lavers, apart from their bases, is that the idolatrous king Ahaz cut off the border of the bases, and removed the bases from them (<a onClick="return mV(\'2Ki\',16,17);">2Ki 16:17</a>). During the reign of Jehoiakim, Jeremiah foretold that the molten sea and the bases (there being then no lavers) should be carried to Babylon (<a onClick="return mV(\'Jer\',27,19);">Jer 27:19</a>). A few years later it is recorded that the bases were broken up, and the brass of which they were made was carried away (<a onClick="return mV(\'Jer\',52,17);">Jer 52:17</a>).<P>3. The Laver in the New Testament:<P>The Greek word (loutron) occurs twice in the New Testament. In <a onClick="return mV(\'Eph\',5,26);">Eph 5:26</a>, Paul says that Christ gave Himself for the church "that he might sanctify it having cleansed it by the washing (Greek "laver") of water with the word"; and in <a onClick="return mV(\'Tts\',3,5);">Tit 3:5</a> he says that we are saved "through the washing (Greek "laver") of regeneration and renewing of the Holy Spirit." In these passages the reference is to the constant physical purity demanded of the Jewish priests when in attendance upon the temple. Christians are "a holy priesthood," and are cleansed not by water only, but, in the former passage, "with the word" (compare <a onClick="return mV(\'Jhn\',15,3);">Joh 15:3</a>); in the latter, by the "renewing of the Holy Spirit" (compare <a onClick="return mV(\'Eze\',36,25);">Eze 36:25</a>; <a onClick="return mV(\'Jhn\',3,5);">Joh 3:5</a>). The feet-washing mentioned by Jesus is emblematic of the same thing (<a onClick="return mV(\'Jhn\',13,10);">Joh 13:10</a>).``17';
isbe[5448]='Law in the New Testament`lo<P>The Term "Law"<P>Austin\'s Definition of Law<P><b>I. LAW IN THE GOSPELS</b><P class="in15">1. The Law in the Teaching of Christ<P class="in30">(1) Authority of the Law Upheld in the Sermon on the Mount<P class="in45">(a) Christ and Tradition<P class="in45">(b) Sin of Murder<P class="in45">(c) Adultery and Divorce<P class="in45">(d) Oaths<P class="in45">(e) Retaliation<P class="in45">(f) Love to Neighbors—Love of Enemies<P class="in30">(2) Other References to the Law in the Teaching of Christ<P class="in45">(a) Traditions of the Elders and the 5th Commandment<P class="in45">(b) Christ\'s Answer to the Young Ruler<P class="in45">(c) Christ\'s Answer to the Lawyer<P class="in45">(d) References in the Fourth Gospel<P class="in15">2. The Law in Relation to the Life of Christ<P class="in30">(1) In His Infancy<P class="in30">(2) In His Ministry<P class="in15">3. The Law in Relation to the Death of Christ<P class="in30">(1) Christ Charged with Blasphemy under the Jewish Law<P class="in30">(2) Christ Charged with Treason under the Roman Law<P class="in15">4. How Christ Fulfilled the Law in All Its Parts<P><b>II. LAW IN THE ACTS OF THE APOSTLES</b><P class="in15">1. Stephen\'s Witness<P class="in15">2. Practice of Peter and Paul<P class="in15">3. Allusions to the Roman Law<P><b>III. LAW IN THE EPISTLES</b><P class="in15">1. In Romans<P class="in15">2. In Galatians<P class="in15">3. In the Other Pauline Epistles<<P class="in15">4. In the Epistle to the Hebrews<P class="in15">5. In the Epistle of James<P class="in15">6. In the Epistles of Peter and John<P><b>LITERATURE</b><hr /><P>The Term "Law":<P>The Greek word for "law" is nomos, derived from nemo, "to divide," "distribute," "apportion," and generally meant anything established, anything received by usage, a custom, usage, law; in the New Testament a command, law.<P>Austin\'s Definition of Law:<P>It may not be amiss to note the definition of law given by a celebrated authority in jurisprudence, the late Mr. John Austin: "A law, in the most general and comprehensive acceptation in which the term, in its literal meaning, is employed, may be said to be a rule laid down for the guidance of an intelligent being, by an intelligent being having power over him." Under this comprehensive statement, he classifies "laws set by God to His human creatures, and laws set by men to men." After analyzing the three ideas, command as the expression of a particular desire; duty or obligation, signifying that one is bound or obliged by the command to pursue a certain course of conduct, and sanction, indicating the evil likely to be incurred by disobedience, he thus summarizes: "The ideas or notions comprehended by the term command are the following:<P>(1) a wish or desire conceived by a rational being that another rational being shall do or forbear;<P>(2) an evil to proceed from the former and to be incurred by the latter in case the latter comply not with the wish;<P>(3) an expression or intimation of the wish by words or other signs."<P>This definition makes it clear that the term "laws of nature" can be used only in a metaphorical sense, the metaphorical application being suggested as Austin shows by the fact that uniformity or stability of conduct is one of the ordinary consequences of a law proper, consequently, "Wherever we observe a uniform order of events, or a uniform order of coexisting phenomena, we are prone to impute that order to a law set by its author, though the case presents us with nothing that can be likened to a sanction or a duty." As used in the New Testament it will be found generally that the term "law" bears the sense indicated by Austin, and includes "command," "duty" and "sanction."<P>I. Law in the Gospels.<P>Naturally we first turn to the Gospels, where the word "law" always refers to the Mosaic law, although it has different applications. That law was really threefold: the Moral Law, as summed up in the Decalogue, the Ceremonial Law, prescribing the ritual and all the typical enactments, and what might be called the Civil or Political Law, that relating to the people in their national, political life. The distinction is not closely observed, though sometimes the reference emphasizes one aspect, sometimes another, but generally the whole Law without any discrimination is contemplated. Sometimes the Law means the whole Old Testament Scriptures, as in <a onClick="return mV(\'Jhn\',10,34);">Joh 10:34</a>; <a onClick="return mV(\'Jhn\',12,34);">12:34</a>; <a onClick="return mV(\'Jhn\',15,25);">15:25</a>. At other times the Law means the Pentateuch, as in <a onClick="return mV(\'Luk\',24,44);">Lu 24:44</a>.<P>1. The Law in the Teaching of Christ:<P>The Law frequently appears in the teaching of Christ. In the Sermon on the Mount He refers most specifically and fully to it. It is frequently asserted that He there exposes the imperfection of the Law and sets His own authority against its authority. But this seems to be a superficial and an untenable view. Christ indeed affirms very definitely the authority of the Law: "Think not that I came to destroy the law or the prophets" (<a onClick="return mV(\'Mat\',5,17);">Mt 5:17</a>). Here the term would seem to mean the whole of the Pentateuch "I came not to destroy, but to fulfil. For verily I say unto you, Till heaven and earth pass away, one jot or one tittle shall in no wise pass away from the law, till all things be accomplished" (<a onClick="return mV(\'Mat\',5,17,18);">Mt 5:17,18</a>). A similar utterance is recorded in <a onClick="return mV(\'Luk\',16,17);">Lu 16:17</a>: "It is easier for heaven and earth to pass away, than for one tittle of the law to fall."<P>(1) Authority of the Law Upheld in the Sermon on the Mount.<P>The perfection and permanence of the Law as well as its authority are thus indicated, and the following verse in Matthew still further emphasizes the authority, while showing that now the Lord is speaking specifically of the moral law of the Decalogue: "Whosoever therefore shall break one of these least commandments, and shall teach men so, shall be called least in the kingdom of heaven: but whosoever shall do and teach them, he shall be called great in the kingdom of heaven" (<a onClick="return mV(\'Mat\',5,19);">5:19</a>). These impressive sentences should be borne in mind in considering, the utterances that follow, in which there seems a contrast between the Law and His own teaching, and from which has been drawn the inference that He condemns and practically abrogates the Law. What Jesus really does is to bring out the fullness of meaning that is in the Law, and to show its spirituality and the wideness of its reach. He declares that the righteousness of His disciples must exceed the righteousness of the scribes and Pharisees (<a onClick="return mV(\'Mat\',5,20);">Mt 5:20</a>). Their righteousness consisted largely in a punctilious observance of the external requirements of the Law; the disciples must yield heart obedience to the inner spirit of the Law, its external and internal requirements.<P>(a) Christ and Tradition:<P>Jesus then proceeds to point out the contrast, not so much between His own teaching and that of the Law, as between His interpretation of the Law and the interpretation of other teachers: "Ye have heard that it was said by them of old time" (the King James Version), "to them of old time" the Revised Version (British and American) (<a onClick="return mV(\'Mat\',5,21);">Mt 5:21</a>). Either rendering is grammatically allowable, but in either case it is evidently not the original utterance of Moses, but the traditional interpretation, which He had in view "Ye have heard that it was said"; Christ\'s usual way of quoting the Old Testament is, "It is written" or some other formula pointing to the written Word; and as He has just referred to the written Law as a whole, it would be strange if He should now use the formula "It was said" in reference to the particular precepts. Evidently He means what was said by the Jewish teachers.<P>(b) Sin of Murder:<P>This is further confirmed by the citations: "Thou shalt not kill; and whosoever shall kill shall be in danger of the judgment." The second clause is not found in the Pentateuch as a distinct statement, but it is clearly the generalization of the teachers. Christ does not set Himself in opposition to Moses; rather does He enjoin obedience to the precepts of the scribes when, sitting in Moses\' seat, they truly expound the Law (<a onClick="return mV(\'Mat\',23,\'1-8\');">Mt 23:1-8</a>). But these teachers had so expounded the command as if it only referred to the act of murder; so Christ shows the full and true spiritual meaning of it: "But I say unto you, that every one who is angry with his brother shall be in danger of the judgment" (<a onClick="return mV(\'Mat\',5,22);">Mt 5:22</a>).<P>See <a href="./study/isbe/search.html?string=MURDER">MURDER</a>.<P>(c) Adultery and Divorce:<P>Again, "Ye have heard that it was said, Thou shalt not commit adultery" (<a onClick="return mV(\'Mat\',5,27);">Mt 5:27</a>). The traditional teaching confined this mainly to the outward act, \'But I say unto you,\' says Christ, \'that adultery pertains even to the lustful thought\' (<a onClick="return mV(\'Mat\',5,28);">Mt 5:28</a>). In dealing with this matter He passes to the law of divorce which was one of the civil enactments, and did not stand on the same level with the moral precept against committing adultery, nay, the very carrying out of the civil provision might lead to a real breach of the moral precept, and in the interests of the precept itself, in the very desire to uphold the authority of the moral law, Christ pronounces against divorce on any ground, save that of fornication. Later on, as recorded in <a onClick="return mV(\'Mat\',19,\'3-9\');">Mt 19:3-9</a>, He was questioned about this same law of divorce, and again He condemns the light way in which divorce was treated by the Jews, and affirms strongly the sanctity of the marriage institution, showing that it was antecedent to the Mosaic code—was from the beginning, and derived its binding force from the Divine pronouncement in <a onClick="return mV(\'Gen\',2,24);">Ge 2:24</a>, rounded upon the nature of things; while as to the Mosaic law of divorce, lie declares that it was permitted on account of the hardness of their hearts, but that no other cause than fornication was sufficient to dissolve the marriage tie. This civil enactment, justified originally on account of the inability of the people to rise to the true moral ideal of the Decalogue, Christ claims authority to transcend, but in doing so He vindicates and upholds the law which said, "Thou shalt not commit adultery."<P>See <a href="./study/isbe/search.html?string=DIVORCE">DIVORCE</a>.<P>(d) Oaths:<P>The next precept Jesus cites is one partly civil and partly ritual, concerning the taking of oaths. The words are not found in the Pentateuch as a definite enactment; they are rather a gathering up of several utterances (<a onClick="return mV(\'Lev\',19,12);">Le 19:12</a>; <a onClick="return mV(\'Num\',30,2);">Nu 30:2</a>; <a onClick="return mV(\'Deu\',23,21);">De 23:21</a>), and again the form of the citation suggests that it is the rabbinical interpretation that is in question. But the kind of swearing allowed by the law was the very opposite of ordinary profane swearing. It was intended, indeed, to guard the 3rd commandment against taking the name of Yahweh in vain. Christ in condemning the flippant oaths allowed by the rabbis was really asserting the authority of that 3rd command; lie was enforcing its spirituality and claiming the reverence due to the Divine name. Into the question how far the words of Christ bear upon oath-taking in a court of law we need not enter. His own response to the adjuration of the high priest when practically put upon His oath (<a onClick="return mV(\'Mat\',26,63,64);">Mt 26:63,64</a>) and other instances (<a onClick="return mV(\'Rom\',1,9);">Ro 1:9</a>; <a onClick="return mV(\'2Cr\',1,23);">2Co 1:23</a>; <a onClick="return mV(\'Gal\',1,20);">Ga 1:20</a>; <a onClick="return mV(\'Phl\',1,8);">Php 1:8</a>; <a onClick="return mV(\'1Th\',2,5);">1Th 2:5</a>; <a onClick="return mV(\'Hbr\',6,16,17);">Heb 6:16,17</a>; <a onClick="return mV(\'Rev\',10,5,6);">Re 10:5,6</a>) would tend to show that such solemn appeals to God are not embraced in Christ\'s prohibition: "Swear not at all"; but undoubtedly the ideal speech is that of the simple asseveration, the "Yes" or "No" of the man, who, conscious that he speaks in the presence of God, reckons his word inviolable, needing no strengthening epithet, though as between man and man an oath may be necessary for confirmation and an end of strife.<P>See <a href="./study/isbe/search.html?string=OATH">OATH</a>.<P>(e) Retaliation:<P>He next touches upon the "law of retaliation": "an eye for an eye" (<a onClick="return mV(\'Mat\',5,38);">Mt 5:38</a>), and consistently with our understanding of the other sayings, we think that here Christ is dealing with the traditional interpretation which admitted of personal revenge, of men taking the law into their own hands and revenging themselves. Such a practice Christ utterly condemns, and inculcates instead gentleness and forbearance, the outcome of love even toward enemies. This law, indeed, finds place among the Mosaic provisions, but it appears there, not as allowing personal spite to gratify itself in its own way, but as a political enactment to be carried out by the magistrates and so to discountenance private revenge. Christ shows that the spirit of His gospel received by His people would supersede the necessity for these. requirements of the civil code; although His words are not to be interpreted quite literally, for He himself when smitten on the one cheek did not turn the other to the smiter (<a onClick="return mV(\'Jhn\',18,22,23);">Joh 18:22,23</a>), and the principle of the law of retaliation still holds good in the legislative procedure of all civilized nations, and according to the New Testament teaching, will find place even in the Divine procedure in the day of judgment.<P>See also <a href="./study/isbe/search.html?string=PUNISHMENT">PUNISHMENT</a>.<P>(f) Love to Neighbors—Love of Enemies:<P>The last saying mentioned in the Sermon clearly reveals its rabbinical character: "Thou shalt love thy neighbor, and hate thine enemy" (<a onClick="return mV(\'Mat\',5,43);">Mt 5:43</a>). The first part is indeed the injunction of the Law, the second part is an unwarrantable addition to it. It is only this part that Christ virtually condemns when He says, "But I say unto you, Love your enemies" (<a onClick="return mV(\'Mat\',5,44);">Mt 5:44</a>). That the interpretation of these teachers was unwarrantable may be seen from many passages in the Pentateuch, the Prophets and the Psalms, which set forth the more spiritual aspect of the Law\'s requirement; and as to this particular precept, we need only refer to <a onClick="return mV(\'Pro\',25,21,22);">Pr 25:21,22</a>, "If thine enemy be hungry, give him bread to eat." Christ while condemning the addition unfolds the spiritual import of the command itself, for the love of neighbor rightly interpreted involves love of enemies; and so on another occasion (<a onClick="return mV(\'Luk\',10,\'25-37\');">Lu 10:25-37</a>) He answers the lawyer\'s question, "Who is my neighbor?" by the parable of the Good Samaritan, showing that everyone in need is our neighbor.<P>See also <a href="./study/isbe/search.html?string=FORGIVENESS">FORGIVENESS</a>; <a href="./study/isbe/search.html?string=WRATH">WRATH</a>.<P>The last reference in the Sermon on the Mount to the Law fully bears out the idea that Christ really upheld the authority while elucidating the spirituality of the Law, for He declares that the principle embodied in the "Golden Rule" is a deduction from, is, indeed, the essence of, "the law and the prophets" (<a onClick="return mV(\'Mat\',7,12);">Mt 7:12</a>).<P>(2) Other References to the Law in the Teaching of Christ.<P>We can only glance at the other references to the Law in the teaching of Christ. In <a onClick="return mV(\'Mat\',11,13);">Mt 11:13</a>, "For all the prophets and the law prophesied until John," the Law in its teaching capacity is in view, and perhaps the whole of the Pentateuch is meant. In <a onClick="return mV(\'Mat\',12,\'1-8\');">Mt 12:1-8</a>, in rebutting the charge brought against His disciples of breaking the Sabbath, He cites the case of David and his men eating the showbread, which it was not lawful for any but the priests to partake of; and of the priests doing work on the Sabbath day which in other men would be a breach of the Law; from which He deduces the conclusion that the ritual laws may be set aside under stress of necessity and for a higher good. In that same chapter (<a onClick="return mV(\'Mat\',12,\'10-13\');">12:10-13</a>) He indicates the lawfulness of healing—doing good—on the Sabbath day.<P>(a) Traditions of the Elders and the 5th Commandment:<P>In <a onClick="return mV(\'Mat\',15,\'1-6\');">Mt 15:1-6</a> we have the account of the Pharisees complaining that the disciples transgressed the traditions of the elders by eating with unwashed hands. Jesus retorts upon them with the question: "Why do ye also transgress the commandment of God because of your tradition?" citing the specific case of the 5th commandment which was evaded and virtually broken by their ingenious distinction of qorban. This is a very instructive incident in its bearing upon the point which we have sought to enforce—that it was the traditional interpretation and not the Law itself which Jesus condemned or corrected.<P>(b) Christ\'s Answer to the Young Ruler:<P>To the young ruler (<a onClick="return mV(\'Mat\',15,\'16-22\');">Mt 19:16-22</A>) He presents the commandments as the rule of life, obedience to which is the door to eternal life, especially emphasizing the manward aspect of the Law\'s claims. The young man, professing to have kept them all, shows that he has not grasped the spirituality of their requirements, and it is further to test him that Christ calls upon him to make the "great renunciation" which, after all, is not in itself an additional command so much as the unfolding of the spiritual and far-reaching character of the command, "Love thy neighbor as thyself."<P>(c) Christ\'s Answer to the Lawyer:<P>To the lawyer who asks Him which is the great commandment in the Law, He answers by giving him the sum of the whole moral law. "Thou shalt love the Lord thy God with all thy heart, and with all thy soul, and with all thy mind. This is the great and first commandment. And a second like unto it is this, Thou shalt love thy neighbor as thyself" (<a onClick="return mV(\'Mat\',22,\'35-39\');">Mt 22:35-39</a>). In Mark\'s report (<a onClick="return mV(\'Mar\',12,31);">Mr 12:31</a>), He adds, "There is none other commandment greater than these," and in that of Matthew He says, "On these two commandments the whole law hangeth, and the prophets" (<a onClick="return mV(\'Mat\',22,40);">Mt 22:40</a>); both utterances showing the high estimation in which He held the Law.<P>(d) References in the Fourth Gospel:<P>In His discussion with the Jews, recorded in <a onClick="return mV(\'Jhn\',7,\'1-\');">Joh 7</a>, He charges them with failure to keep the Law: "Did not Moses give you the law, and yet none of you doeth the law?" (<a onClick="return mV(\'Jhn\',7,19);">7:19</A>). And referring to the healing of the impotent man on the Sabbath day, a deed which had roused their ire, He shows how one law may conflict with another. Moses had enjoined circumcision, and sometimes the time for circumcising would fall on the Sabbath day. Yet with all their reverence for the Sabbath day, they would, in order to keep the law of circumcision, perform the rite on the Sabbath day, and so, He argues, it is unreasonable to complain of Him because on the Sabbath day He had fulfilled the higher law of doing good, healing a poor sufferer. In none of all Christ\'s utterances is there any slight thrown upon the Law itself; it is always held up as the standard of right and its authority vindicated.<P>2. The Law in Relation to the Life of Christ:<P>The passages we have considered show the place of the Law in the teaching of Christ, but we also find that He had to sustain a practical relation to that Law. Born under the Law, becoming part of a nation which honored and venerated the Law, every part of whose life was externally regulated by it, the life of Jesus Christ could not fail to be affected by that Law. We note its operation:<P>(1) In His Infancy.<P>On the eighth day He was circumcised (<a onClick="return mV(\'Luk\',2,21);">Lu 2:21</a>), thus being recognized as a member of the covenant nation, partaking of its privileges, assuming its responsibilities. Then, according to the ritual law of purification, He is presented in the temple to the Lord (<a onClick="return mV(\'Luk\',2,\'22-24\');">Lu 2:22-24</a>), while His mother offers the sacrifice enjoined in the "law of the Lord," the sacrifice she brings pathetically witnessing to her poverty, "a pair of turtle doves, or two young pigeons" being the alternative allowed to those who were not able to provide a lamb (<a onClick="return mV(\'Lev\',12,\'1-\');">Le 12</a>). The Divine approval is set upon this consecrating act, for it is while it is being done concerning Him after "the custom of the law" (<a onClick="return mV(\'Luk\',2,27);">Lu 2:27</a>), that the Spirit of God comes upon Simeon and prompts the great prophecy which links all the Messianic hopes with the Baby of Bethlehem.<P>Again, according to the Law His parents go up to the Passover feast when the wondrous child has reached His 12th year, the age when a youthful Jew assumed legal responsibility, becoming "a son of the Law," and so Jesus participates in the festal observances, and His deep interest in all that concerns the temple-worship and the teaching of the Law is shown by His absorption in the conversation of the doctors, whose questions He answers so intelligently, while questioning them in turn, and filling them with astonishment at His understanding (<a onClick="return mV(\'Luk\',2,\'42-47\');">Lu 2:42-47</a>).<P>(2) In His Ministry.<P>In His ministry He ever honors the Law. He reads it in the synagogue. He heals the leper by His sovereign touch and word, but He bids him go and show himself to the priest and offer the gift that Moses commanded (<a onClick="return mV(\'Mat\',8,4);">Mt 8:4</a>). And again, when the lepers appeal to Him, His response which implies the healing is, "Go and show yourselves unto the priests" (<a onClick="return mV(\'Luk\',17,14);">Lu 17:14</a>). He drives out of the temple those that defile it (<a onClick="return mV(\'Mat\',21,12,13);">Mt 21:12,13</a>; <a onClick="return mV(\'Jhn\',2,\'15-17\');">Joh 2:15-17</a>), because of His zeal for the honor of His Father\'s house, and so, while showing His authority, emphasizes the sanctity of the temple and its services. So, while claiming to be the Son in the Father\'s house, and therefore above the injunctions laid upon the servants and strangers, He nevertheless pays the temple-tax exacted from every son of Israel (<a onClick="return mV(\'Mat\',17,\'24-27\');">Mt 17:24-27</a>). He attends the various feasts during His ministry, and when the shadows of death are gathering round Him, He takes special pains to observe the Passover with His disciples. Thus to the ceremonial law He renders continuous obedience, the motto of His life practically being His great utterance to the Baptist: "Suffer it now: for thus it becometh us to fulfill all righteousness" (<a onClick="return mV(\'Mat\',3,15);">Mt 3:15</a>). If He obeyed the ceremonial law, unquestionably He obeyed the moral law. His keenest-eyed enemies could find no fault in Him in regard to His moral conduct. His absolute sinlesshess attests the translation of the moral law into actual life.<P>3. The Law in Relation to the Death of Christ:<P>We enter not upon theological question as to the relation of the death of Christ to the penal inflictions of the Law Divinely enforced on behalf of sinners—that touches the doctrine of the Atonement—we only note the fact that His death was brought about in professed accordance with the Law. The chief priests, in hatred, sent officers to take Him, but overawed by His matchless eloquence, these officers returned empty-handed. In their chagrin, the chief priests can only say that the people who follow Him now not the Law and are cursed (<a onClick="return mV(\'Jhn\',7,49);">Joh 7:49</a>). Nicodemus, on this occasion, ventures to remonstrate: "Doth our law judge a man, except it first hear from himself?" (<a onClick="return mV(\'Jhn\',7,51);">Joh 7:51</a>). This sound legal principle these men are bent on disregarding; their one desire is to put an end to the life of this man, who has aroused their jealousy and hatred, and at last when they get Him into their hands, they strain the forms of the Law to accomplish their purpose. There is no real charge that can be brought against Him. They dare not bring up the plea that He broke the Sabbath, for again and again He has answered their cavils on that score. He has broken no law; all they can do is to bribe false witnesses to testify something to His discredit. The trumpery charge, founded upon a distorted reminiscence of His utterance about destroying the temple, threatens to break down.<P>(1) Christ Charged with Blasphemy under the Jewish Law.<P>Then the high priest adjures Him to say upon oath whether or not He claims to be the Christ, the Son of the Living God. Such a claim would assuredly, if unfounded, be blasphemy, and according to the Law, be punishable by death. On a previous occasion the Jews threatened to stone Him for this—to them—blasphemous claim. Now when Jesus calmly avows that He is the Son of God, the high priest, rending his clothes, declares that no further proof is needed. He has confessed to the blasphemy, and unanimously the council votes Him worthy of death (<a onClick="return mV(\'Mat\',26,\'1-\');">Mt 26</a>; <a onClick="return mV(\'Mar\',14,\'1-\');">Mr 14</a>; <a onClick="return mV(\'Luk\',22,\'1-\');">Lu 22</a>). If Jesus Christ were not what He claimed to be, then the priests were right in holding Him guilty of blasphemy; it never occurred to them to consider whether the claim after all might not be true.<P>(2) Christ Charged with Treason under the Roman Law.<P>Not only is the Jewish law invoked to accomplish His death, but also the Roman law. On one other occasion Christ had come into touch with the law of Rome, namely, when asked the ensnaring question by the Herodians as to the lawfulness of giving tribute to Caesar (<a onClick="return mV(\'Mat\',22,17);">Mt 22:17</a>; <a onClick="return mV(\'Mar\',12,14);">Mr 12:14</a>; <a onClick="return mV(\'Luk\',20,22);">Lu 20:22</a>). Now the Jews need the Roman governor\'s authorization for the death penalty, and Jesus must be tried before him. The charge cannot now be blasphemy—the Roman law will have nothing to say to that—and so they trump up a charge of treason against Caesar.<P>In preferring it, they practically renounce their Messianic hopes. The charge, however, breaks down before the Roman tribunal, and only by playing on the weakness of Pilate do they gain their end, and the Roman law decrees His death, while leaving the Jews to see to the carrying out of the sentence. In this the evangelist sees the fulfillment of Christ\'s words concerning the manner of His death, for stoning would have been the Jewish form of the death penalty, not crucifixion.<P>See <a href="./study/isbe/search.html?string=JESUS+CHRIST,+3">JESUS CHRIST, III, E), ii, 3, 4</a>.<P>4. How Christ Fulfilled the Law in All Its Parts:<P>Looking at the whole testimony of the Gospels, we can see how it was that Christ fulfilled the Law. He fulfilled the moral law by obeying, by bringing out its fullness of meaning, by showing its intense spirituality, and He established it on a surer basis than ever as the eternal law of righteousness. He fulfilled the ceremonial and typical law, not only by conforming to its requirements, but by realizing its spiritual significance. He filled up the shadowy outlines of the types, and, thus fulfilled, they pass away, and it is no longer necessary for us to observe the Passover or slay the daily lamb: we have the substance in Christ. He also cleared the Law from the traditional excrescences which had gathered round it under the hands of the rabbis. He showed that the ceremonial distinction between meats clean and unclean was no longer necessary, but showed the importance of true spiritual purity (<a onClick="return mV(\'Mat\',15,11);">Mt 15:11</a>; <a onClick="return mV(\'Mar\',7,\'18-23\');">Mr 7:18-23</a>). He taught His disciples those great principles when, after His resurrection, "beginning from Moses and from all the prophets, he interpreted to them in all the scriptures the things concerning himself" (<a onClick="return mV(\'Luk\',24,27);">Lu 24:27</a>). And as He opened their mind that they might understand the Scriptures, He declared, "These are my words which I spake unto you, while I was yet with you, that all things must needs be fulfilled, which are written in the law of Moses, and the prophets, and the psalms, concerning me" (<a onClick="return mV(\'Luk\',24,44);">Lu 24:44</a>). John sums this up in his pregnant phrase, "The law was given through Moses; grace and truth came through Jesus Christ" (<a onClick="return mV(\'Jhn\',1,17);">Joh 1:17</a>). The grace was in contrast to the condemnation of the moral law, the truth was the antithesis to the shadowy outline of the types and ceremonies.<P>II. Law in the Acts of the Apostles.<P>Without considering questions of authenticity and historicity in relation to this book which professes to be the earliest church history, we briefly note the place of the Law therein indicated. In the book we have an account of the transition from Judaism to fully developed Christianity, and the Law comes into view in various ways. The disciples, like other Jews, observe the feast of Pentecost, and even after the descent of the Spirit, they frequent the temple and observe the hours of prayer.<P>1. Stephen\'s Witness:<P>The full-orbed gospel proclaimed by Stephen arouses the suspicion and enmity of the stricter sects of the Jews, who accuse him before the council of speaking blasphemous words against the holy place and the Law. But this was the testimony of suborned witnesses, having doubtless its foundation in the fact that Stephen\'s teaching emphasized the grace of the gospel. Stephen\'s own defense honors the Law as given by Moses, "who received living oracles" (<a onClick="return mV(\'Act\',7,38);">Ac 7:38</a>), shows how disloyal the people had been, and closes by charging them not only with rejecting and slaying the Righteous One, but of failing to keep the Law "as it was ordained by angels" (<a onClick="return mV(\'Act\',7,53);">Ac 7:53</a>).<P>2. Practice of Peter and Paul:<P>Peter\'s strict observance of the ceremonial law is shown in connection with his vision which teaches him that the grace of God may pass beyond the Jewish pale (<a onClick="return mV(\'Act\',10,\'1-\');">Ac 10</a>). Paul\'s preaching emphasizes the fulfilling the Scriptures, Law and Prophecy, by Jesus Christ. The gist of his message, as given in his first reported sermon, is, "By him everyone that believeth is justified from all things, from which ye could not be justified by the law of Moses" (<a onClick="return mV(\'Act\',13,38);">Ac 13:38</a>f). The conversion of the Gentiles brings up the question of their relation to the ceremonial law, specifically to circumcision. The decision of the council at Jerusalem treats circumcision as unnecessary for the Gentiles, and only enjoins, in relation to the Mosaic ritual, abstinence from things strangled and from blood (<a onClick="return mV(\'Act\',15,\'1-\');">Ac 15</a>). The after-course of events would show that this provision was for the time of transition. Paul, though strongly opposed to the idea of imposing circumcision on the Gentiles, nevertheless without inconsistency and as a concession to Jewish feeling, circumcises Timothy (<a onClick="return mV(\'Act\',16,3);">Ac 16:3</a>), and himself fulfills the ceremonial enactments in connection with the taking of a vow (<a onClick="return mV(\'Act\',18,18);">Ac 18:18</a>). He also, following the advice of James, who wished him to conciliate the myriads of believing Jews who were zealous for the Law, and to show them the falseness of the charge that he taught the Jews among the Gentiles "to forsake Moses" (apostasy from Moses), took upon him the ceremonial duty of purifying the "four men that have a vow on them" (<a onClick="return mV(\'Act\',21,\'20-26\');">Ac 21:20-26</a>). This involved the offering of sacrifices, and the fact that Paul could do so shows that for the Jews the sacrificial system still remained in force. The sequel to the transaction might raise the question whether, after all, the procedure was a wise one; it certainly did not fulfill the expectations of James. Later on, in his defense before Felix, Paul claims to be loyal to the Jewish faith, worshipping in the temple, and "believing all things which are according to the law, and which are written in the prophets" (<a onClick="return mV(\'Act\',24,\'11-14\');">Ac 24:11-14</a>); and in his address to the Jewish leaders in Rome, he declares that he has "done nothing against the people, or the customs of our fathers" (<a onClick="return mV(\'Act\',28,17);">Ac 28:17</a>), and he seeks to persuade them concerning Jesus, "both from the law of Moses and from the prophets" (<a onClick="return mV(\'Act\',28,23);">Ac 28:23</a>).<P>3. Allusions to the Roman Law:<P>In the Acts we find several allusions to law other than Jewish. In <a onClick="return mV(\'Act\',16,\'1-\');">Ac 16</a> Paul comes into collision with the Roman law. Beaten and imprisoned by the magistrates of Philippi, he is afterward offered the opportunity of quietly slipping away, but standing on his dignity as a Roman citizen, he demands that the magistrates themselves, who had violated the law by publicly beating uncondemned Romans, should come and set them free. This same right as a Roman citizen Paul again asserts when about to be scourged by the command of the centurion (<a onClick="return mV(\'Act\',22,25);">Ac 22:25</a>), and his protest is successful in averting the indignity. His trial before Felix and Festus well illustrates the procedure under the Roman law, and his appeal, as a Roman citizen, to Caesar had important results in his life.<P>III. Law in the Epistles.<P>The word is used both with and without the article, but though in some cases the substantive without the article refers to law in general, yet in many other places it undoubtedly refers to the Law of Moses. Perhaps, as has been suggested, it is that, where it does refer to the Mosaic Law, the word without the article points to that law, not so much as Mosaic, but in its quality as law. But speaking generally, the word with and without the article is used in reference to the Law of Moses.<P>1. In Romans:<P>(1) Law as a Standard.<P>In Romans Paul has much to say about law, and in the main it is the moral law that he has in view. In this great epistle, written to people at the center of the famous legal system of Rome, many of them Jews versed in the law of Moses and others Gentiles familiar with the idea of law, its nature, its scope and its sway, he first speaks of the Law as a standard, want of conformity to which brings condemnation. He shows that the Gentiles who had not the standard of the revealed Law nevertheless had a law, the law of Nature, a law written upon their heart and conscience. Roman jurisprudence was familiar with the conception of a law of Nature, which became a law of nations (jus gentium), so that certain principles could be assumed as obtaining among those who had not the knowledge of the Roman code; and in accordance with these principles, the dealings between Romans and barbarians could be regulated. Paul\'s conception is somewhat similar, but is applied to the spiritual relations of man and God.<P>(2) Gentiles Condemned by the Law of Nature.<P>But the Gentiles, not having lived up to the light of that law, are condemned. They have violated the dictates of their own conscience. And the Jews, with the fuller light of their revealed law, have equally failed. In this connection Paul incidentally lays down the great principle that "Not the hearers of the law are just before God, but the doers of the law shall be justified" (<a onClick="return mV(\'Rom\',2,13);">Ro 2:13</a>). His great aim, in the epistle, is to show that justification is by faith, but he here asserts that if anyone would have justification through law, then he must keep that law in all its details. The Law will pronounce the doer of it justified, but the mere hearing of the Law without doing it will only increase the condemnation. "As many as have sinned without the law shall also perish without the law: and as many as have sinned under the law shall be judged by the law" (<a onClick="return mV(\'Rom\',2,12);">Ro 2:12</a>). Paul does not pronounce upon the question whether a Gentile may be saved by following the light of Nature; he rather emphasizes the negative side that those who have failed shall perish; they have light enough to condemn, is his point.<P>(3) All Men under Condemnation.<P>Having proved that both Jews and Gentiles are under sin, he closes his great indictment with the statement: "Now we know that what things soever the law saith, it speaketh to them that are under the law; that every mouth may be stopped, and all the world may be brought under the judgment of God" (<a onClick="return mV(\'Rom\',3,19);">Ro 3:19</a>). Thus the Law shuts up into condemnation. It is impossible for any sinner to be justified "by the works of the law"; the Law not only condemns but "through the law cometh the knowledge of sin" (<a onClick="return mV(\'Rom\',3,20);">Ro 3:20</a>). It shows how far short men have come of God\'s requirements. It is a mirror in which the sinner sees his defilement, but the mirror cannot cleanse, though it shows the need of cleansing.<P>(4) The Redeeming Work of Christ Providing Righteousness Apart from the Law.<P>Then setting forth the great redemption of Jesus Christ, the apostle shows that it provides what the Law had failed to provide, a righteousness which can satisfy the requirements of the Law; a righteousness that is indeed "apart from the law," apart from all men\'s attempts to keep the Law, but is nevertheless in deepest harmony with the principles of the Law, and has been witnessed "by the law and the prophets" (<a onClick="return mV(\'Rom\',3,21);">Ro 3:21</a>). (In this passage the "law" seems to mean the Pentateuch, and in <a onClick="return mV(\'Rom\',3,19);">Ro 3:19</a>, in view of the preceding citations from the Psalms, it appears to mean the whole Old Testament Scriptures.) Since the righteousness secured by Christ comes upon the sinner through faith, manifestly the works of the Law can have nothing to do with our obtaining of it. But so far is faith-righteousness from undermining the Law, that Paul claims that through faith the Law is established (<a onClick="return mV(\'Rom\',3,31);">Ro 3:31</a>).<P>(5) Abraham\'s Blessings Came Not through the Law.<P>Proceeding to show that his idea of justification by faith was no new thing, that the Old Testament saint had enjoyed it, he particularly shows that Abraham, even in his uncircumcised state, received the blessing through faith; and the great promise to him and his seed did not come through the Law, but on the principle of faith.<P>(6) Law Worketh Wrath and Intensifieth the Evil of Sin.<P>Indeed, so far from blessing coming to sinners by way of the Law, the "law worketh wrath" (<a onClick="return mV(\'Rom\',4,15);">Ro 4:15</a>); not wrath in men against the Law\'s restrictions as some have argued, but the holy wrath of God so frequently mentioned by the apostle in this epistle. The Law worketh wrath, inasmuch as when disobeyed it brings on the sinner the Divine disapproval, condemnation; it enhances the guilt of sin, and so intensifies the Divine wrath against it; and it, in a sense, provokes to sin: the sinful nature rebels against the restrictions imposed by the Law, and the very fact of a thing being forbidden arouses the desire for it. This seems what he means in a subsequent passage (<a onClick="return mV(\'Rom\',5,20);">Ro 5:20</a>), "And the law came in besides, that the trespass might abound"; as if the very multiplying of restrictions intensified the tendency to sin, brought out the evil in human nature, showed the utter vileness of the sinful heart and the terrible nature of sin, and thus made the need for salvation appear the greater, the very desperateness of the disease showing the need for the remedy and creating the desire for it; the abounding of sin preparing the way for the super-abounding of grace. That the presence of Law enhances the evil of sin is further shown by the statement, "But where there is no law, neither is there transgression" (<a onClick="return mV(\'Rom\',4,15);">Ro 4:15</a>); transgression—parabasis—the crossing of the boundary, is, in the strict sense, only possible under law. But there may be sin apart from a revealed law, as he has already proved in the 2nd chapter.<P>(7) Law in the Light of the Parallel between Adam and Christ.<P>In <a onClick="return mV(\'Rom\',5,\'1-\');">Romans 5</a>, dealing with the parallel between Adam and Christ he says: "For until the law sin was in the world; but sin is not imputed when there is no law" (<a onClick="return mV(\'Rom\',5,13);">5:13</a>). He cannot mean that men were not held responsible for their sin, or that sin was not in any sense reckoned to their account, for he has in that 2nd chapter proved the opposite; but sin was not so imputed to them as to bring upon them the punishment of death, which they nevertheless did suffer, and that is traced by him to the sin of Adam. These, he says, had not sinned after the likeness of Adam\'s transgression (<a onClick="return mV(\'Rom\',5,14);">5:14</a>); they had not transgressed a positive command as he did, although they had undoubtedly violated the law of conscience, and knew that they were sinners. In drawing out the parallel between Adam and Christ, he plainly indicates that as Adam\'s transgression of law brought condemnation on the race, so Christ\'s obedience to the Law brings justification.<P>(8) Law and Righteousness.<P>So far he may be said to have spoken of the Law in regard to the sinner; and it is mainly the Law in its judicial aspect, the Law in relation to righteousness. The Law reveals righteousness, the Law demands righteousness, the Law condemns for unrighteousness. Redemption is a working out of righteousness. The Law witnesses to the perfect righteousness of Christ. The righteousness secured by Christ meets all the requirements of the Law, while gloriously transcending it. The righteous penalty of the Law has been borne by Christ; the righteous requirements of the Law have been fulfilled by Christ. That perfect righteousness secured apart from the Law, but satisfying to the Law, comes to men not through their relation to the Law, but through faith. Now he proceeds to consider the Law in relation to the saint.<P>(9) The Saint and the Law.<P>The believer justified through Christ has died with Christ. The "old man"—the sinful nature—has been crucified with Christ; the condemning power of the Law has terminated in the death of Christ, and through the death of the believer with Christ he has freedom from the condemnation of the Law. "He that hath died is justified from sin" (<a onClick="retu
