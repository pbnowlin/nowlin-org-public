s with different periods of a man\'s life. E.A. Abbott has made an excellent discussion of the Johannine Vocabulary (1905) and of Johannine Grammar (1906), but special grammars of each writer are hardly to be expected or desired. But Nageli has begun a study of Paul\'s vocabulary in his Wortschatz des Apostels Paulus (1905). The Gospel of Matthew shows very little of that Hebraism that one would expect from the general purpose and tone of the book. It is possible, of course, that the supposed original was in Aramaic, or, if in Greek, of a more Hebraistic type. Whether the present Greek of Matthew made use of Mark\'s Gospel and a collection of Logia (Q), we do not know. Certainly Mark\'s Gospel is written in colloquial koine with little evidence of the culture of the schools. Mark is a faithful reporter and does his work with rare simplicity and vividness. He reveals clearly the Aramaic background of Christ\'s teaching. The writings of James and Jude do not show that only Greek was spoken in the home at Nazareth, nor that they used only Aramaic. These two epistles are evidently free compositions in Greek with much of the freshness of imagery so manifest in the parables of Jesus Himself. This brief sketch does not do justice to the richness and variety of language in the books of the New Testament.<P>V. The "Koine" Spoken by Jesus.<P>See <a href="./study/isbe/search.html?string=ARAMAIC+LANGUAGE">ARAMAIC LANGUAGE</a> for proof that Jesus spoke that language as the vernacular of the people of Palestine. But Christ spoke the koine also, so that the New Testament is not an idiom that was unknown to the Master. Gwilliam (1-vol HDB, "Language of Christ") does still deny that Jesus spoke Greek, while Roberts takes the other extreme in his book, Greek the Language of Christ and His Apostles (1888). Per contra again, Julicher considers it impossible to suppose that Jesus used Greek (art. "Hellenism" in EB). J. E. H. Thomson, "The Language of Palestine during the Time of our Lord" (Temple, Bible Dictionary) argues convincingly that Palestine was bi-lingual and that Jesus knew and spoke Greek as well as Aramaic Peter evidently spoke in Greek on the Day of Pentecost and was understood by all. Paul was understood in Jerusalem when he spoke in Greek (<a onClick="return mV(\'Act\',21,37);">Ac 21:37</a>). Jesus taught in Decapolis, a Greek region, in the region of Tyre and Sidon (Greek again). Galilee itself was largely inhabited by Gentiles who spoke Greek. At the time of the Sermon on the Mount, we read that people were present from Decapolis and Perea, besides the mixed multitude from Galilee, Judea, and Jerusalem (<a onClick="return mV(\'Mat\',4,25);">Mt 4:25</a>; <a onClick="return mV(\'Luk\',6,17);">Lu 6:17</a>). Thomson proves also that in Matthew\'s Gospel the quotation from the Old Testament in the words of Jesus is from the Septuagint, while Matthew\'s own quotations are from the Hebrew. The case seems clear. It is not possible to say always when Jesus spoke Greek and when Aramaic. That would depend on the audience. But it is practically certain that Christ Himself knew and spoke at will the vernacular koine, and thus had this linguistic bond with the great world of that era and with lovers of the Greek Testament today.<P>LITERATURE.<P>The literature on this subject is very extensive. The most important volumes have been mentioned in the discussion above.``150';
isbe[5423]='Languages of the Old Testament`lan\'-gwaj-es<P><b>I. THE SEMITIC LANGUAGES</b><P class="in15">1. Members of Semitic Family<P class="in15">2. The Name Hebrew<P class="in15">3. Old Hebrew Literature<P><b>II. HISTORY OF THE HEBREW LANGUAGE</b><P class="in15">1. Oldest Form of Language<P class="in15">2. The Hebrew of the Old Testament<P class="in15">3. Its Uniformity<P class="in15">4. The Cause Thereof<P class="in15">5. Differences Due to Age<P class="in15">6. Differences of Style<P class="in15">7. Foreign Influences<P class="in15">8. Poetry and Prose<P class="in15">9. Home of the Hebrew Language<P class="in15">10. Its Antiquity<P class="in15">11. When Hebrew Became a Dead Language<P><b>III. CHIEF CHARACTERISTICS OF HEBREW</b><P class="in15">1. Characteristic Sounds<P class="in15">2. Letters Representing Two Sounds<P class="in15">3. Consonants Representing Vowels<P class="in15">4. The Syllable<P class="in15">5. Three-Letter Roots<P class="in15">6. Conjugations or Derived Stems<P class="in15">7. Absence of Tenses<P class="in15">8. The Pronouns<P class="in15">9. Formation of Nouns<P class="in15">10. Internal Inflexion<P class="in15">11. Syntax of the Verb<P class="in15">12. Syntax of the Noun<P class="in15">13. Poverty of Adjectives<P><b>IV. BIBLICAL ARAMAIC</b><P class="in15">1. Aramaic Portions of the Old Testament<P class="in15">2. Phonology<P class="in15">3. Grammar<P class="in15">4. Syntax<P class="in15">5. Aramaic More Decadent than Hebrew<P><b>V. LITERARY CHARACTERISTICS OF THE SEMITES</b><P class="in15">1. Concrete and Abstract<P class="in15">2. View of Nature<P class="in15">3. Pictorial Imagination<P class="in15">4. Prose and Poetry<P class="in15">5. Hebrew Easy of Translation<P><b>LITERATURE</b><hr /><P>There were only two languages employed in the archetypes of the Old Testament books (apart from an Egyptian or Persian or Greek word here and there), namely, Hebrew and Biblical Aramaic, both of which belong to the great family of languages known as Semitic.<P>I. The Semitic Languages.<P>The languages spoken in southwestern Asia during the historical period dealt with in the Bible have been named Shemitic, after the son of Noah from whom the majority of peoples speaking these languages—Arabs, Hebrews, Arameans and Assyrians (<a onClick="return mV(\'Gen\',10,21);">Ge 10:21</a>)—were descended. To show, however, that the description does not fit exactly the thing described—the Elamites and Lydians having probably not spoken a Shemitic language, and the Canaanites, including Phoenicians, with the colonists descended from those at Carthage and elsewhere in the Mediterranean coast lands, as well as the Abyssinians (Ethiopians), who did, being reckoned descendants of Ham (<a onClick="return mV(\'Gen\',9,18);">Ge 9:18</a>; <a onClick="return mV(\'Gen\',10,6);">10:6</a>)—the word is now generally written "Semitic," a term introduced by Eichhorn (1787). These languages were spoken from the Caspian Sea to the south of Arabia, and from the Mediterranean to the valley of the Tigris.<P>1. Members of Semitic Family:<P>The following list shows the chief members of this family:<P>(1) South Semitic or Arabic:<P>Including the language of the Sabean (Himyaritic) inscriptions, as well as Ge\'ez or Ethiopic. Arabic is now spoken from the Caucasus to Zanzibar, and from the East Indies to the Atlantic.<P>(2) Middle Semitic or Canaanitish:<P>Including Hebrew, old and new, Phoenician, with Punic, and Moabite (language of MS).<P>(3) North Semitic or Aramaic:<P>Including<P>(a) East Aramaic or Syrian (language of Syrian Christians), language of Babylonian Talmud, Mandean;<P>(b) West or Palestinian Aramaic of the Targums, Palestinian Talmud (Gemara), Biblical Aramaic ("Chaldee"), Samaritan, language of Nabatean inscriptions.<P>(4) East Semitic:<P>Language of Assyria-Babylonian inscriptions.<P>2. The Name Hebrew:<P>With the exception of a few chapters and fragments mentioned below, the Old Testament is written entirely in Hebrew. In the Old Testament itself this language is called "the Jews\' "(<a onClick="return mV(\'2Ki\',18,26,28);">2Ki 18:26,28</a>). In <a onClick="return mV(\'Isa\',19,18);">Isa 19:18</a> it is called poetically, what in fact it was, "the language (Hebrew "lip") of Canaan." In the appendix to the Septuagint of Job it is called Syriac; and in the introduction to Ecclesiasticus it is for the first time—that is, in 130 BC—named Hebrew. The term Hebrew in the New Testament denotes the language of the Old Testament in <a onClick="return mV(\'Rev\',9,11);">Re 9:11</a>, but in <a onClick="return mV(\'Jhn\',5,2);">Joh 5:2</a>; <a onClick="return mV(\'Jhn\',19,13,17);">19:13,17</a> this term means the vernacular Aramaic. In other passages it is doubtful which is meant. Josephus uses the same name for both. From the time of the Targums, Hebrew is called "the sacred tongue" in contrast to the Aramaic of everyday use. The language of the Old Testament is called Old Hebrew in contrast to the New Hebrew of the Mishna, the rabbinic, the Spanish poetry, etc.<P>3. Old Hebrew Literature: Of Old Hebrew the remains are contained almost entirely in the Old Testament. A few inscriptions have been recovered, i.e., the Siloam Inscriptions, a Hebrew calendar, a large number of ostraka from Samaria, a score of pre-exilic seals, and coins of the Maccabees and of the time of Vespasian and Hadrian.<P>LITERATURE.<P>E. Renan, Histoire generale et systeme compare des langues semitiques; F. Hommel, Die semit. Volker u. Sprachen; the comparative grammars of Wright and Brockelmann; CIS; article "Semitic Languages" in Encyclopedia Brit, and Murray\'s Illustrated Bible Dictionary.<P>II. History of the Hebrew Language.<P>Hebrew as it appears to us in the Old Testament is in a state of decadence corresponding to the present position of spoken Arabic. In the earliest period it no doubt resembled the classical Arabic of the 7th and following centuries. The variations found between the various strata of the language occurring in the Old Testament are slight compared with the difference between modern and ancient Arabic.<P>1. Oldest Form of Language:<P>Hebrew was no doubt originally a highly inflected language, like classical Arabic. The noun had three cases, nominative, genitive, and accusative, ending in -um\', -im, -am, respectively, as in the Sabean inscriptions. Both verbs and nouns had three numbers (singular, dual and plural) and two genders, masculine and feminine In the noun the dual and plural had two cases. The dual and 2nd and 3rd person plural and 2nd person singular feminine of the imperfect of the verb ended in nun. In certain positions the "m" of the endings -um, -im, -am in the noun was dropped. The verb had three moods, indicative, subjunctive, and jussive, ending in -u, -a, and-,respectively; as well as many forms or stems, each of which had an active and passive voice.<P>2. The Hebrew of the Old Testament:<P>In the Hebrew of the Old Testament most of these inflexions have disappeared. Of the three cases of the noun only the accusative -am has survived in a few adverbial forms, such as \'omnam, "truly." The dual has entirely disappeared from the verb, and also from the noun, with the exception of things that occur in pairs, such as hand, eye, which have no plural. The nom. case of the dual and plural of the noun has disappeared, and the oblique case is used for both. Except in cases of poetic archaism the final nun of the verb has been lost, and, as the final vowels have fallen away in verbs, as well as in nouns, the result is that the jussive forms serve for indicative and subjunctive also. Many of the forms or stems have fallen into desuetude, and the passive forms of two alone are used.<P>3. Its Uniformity:<P>One of the most remarkable facts connected with the Hebrew of the Old Testament is that although that literature extends through a period of over 1,000 years, there is almost no difference between the language of the oldest parts and that of the latest. This phenomenon is susceptible of several explanations. In the first place, nearly the whole of the Old Testament literature is religious in character, and as such the earliest writings would become the model for the later, just as the Koran—the first prose work composed in Arabic which has survived—has become the pattern for all future compositions. The same was true for many centuries of the influence of Aristophanes and Euripides upon the language of educated Greeks, and, it is said, of the influence of Confucius upon that of the learned Chinese.<P>4. The Cause Thereof:<P>But a chief cause is probably the fact that the Semitic languages do not vary with time, but with place. The Arabic vocabulary used in Morocco differs from that of Egypt, but the Arabic words used in each of these countries have remained the same for centuries—in fact, since Arabic began to be spoken in them. Similarly, the slight differences which are found in the various parts of the Old Testament are to be ascribed, not to a difference of date, but to the fact that some writers belonged to the Southern Kingdom, some to the Northern, some wrote in Palestine, some in Babylonia (compare <a onClick="return mV(\'Neh\',13,23,24);">Ne 13:23,24</a>; <a onClick="return mV(\'Jdg\',12,6);">Jud 12:6</a>; <a onClick="return mV(\'Jdg\',18,3);">18:3</a>).<P>5. Differences Due to Age:<P>The Old Testament literature falls into two main periods: that composed before and during the Babylonian exile, and that which falls after the exile. But even between these two periods the differences of language are comparatively slight, so that it is often difficult or impossible to say on linguistic grounds alone whether a particular chapter is pre-exilic or post-exilic, and scholars of the first rank often hold the most contrary opinions on these points. For instance, Dillmann places the so-called Document P (Priestly Code) before Document D (Deuteronomic Code) in the regal period, whereas most critics date D about 621 and P about 444 BC.<P>6. Differences of Style:<P>It is needless to add that the various writers differ from one another in point of style, but these variations are infinitesimal compared with those of Greek and Latin authors, and are due, as has been said above, largely to locality and environment. Thus the style of Hosea is quite different from that of his contemporary Amos, and that of Deutero-Isaiah shows very distinctly the mark of its place of composition.<P>7. Foreign Influences:<P>A much more potent factor in modifying the language was the influence of foreign languages upon Hebrew, especially in respect to vocabulary. The earliest of these was probably Egyptian but of much greater importance was Assyrian, from which Hebrew gained a large number of loan words. It is well known that the Babylonian script was used for commercial purposes throughout southwestern Asia, even before the Hebrews entered Canaan (see <a href="./study/isbe/search.html?string=TEXT+AND+MANUSCRIPTS+OF+THE+NEW+ TESTAMENT">TEXT AND MANUSCRIPTS OF THE NEW TESTAMENT</a>; <a href="./study/isbe/search.html?string=TEXT+OF+THE+OLD+TESTAMENT">TEXT OF THE OLD TESTAMENT</a>), but the influence of Babylon upon Palestine seems to have been greatly exaggerated. The main point of contact is in the mythology, which may have been common to both peoples. In the later, especially post-exilic stages of the language, many Aramaisms are found in respect to syntax as well as vocabulary; and in later phases still, Persian and even Greek words are found.<P>8. Poetry and Prose:<P>As in other languages, so in Hebrew, the vocabulary of the poetical literature differs from that of the prose writers. In Hebrew, however, there is not the hard-and-fast distinction between these two which obtains in the classics. Whenever prose becomes elevated by the importation of feeling, it falls into a natural rhythm which in Hebrew constitutes poetry. Thus most of the so-called prophetical books are poetical in form. Another mark of poetry is a return to archaic grammatical forms, especially the restoration of the final nun in the verb.<P>9. Home of the Hebrew Language:<P>The form of Semitic which was indigenous in the land of Canaan is sometimes called Middle Semitic. Before the Israelites entered the country, it was the language of the Canaanites from whom the Hebrews took it over. That Hebrew was not the language of Abraham before his migration appears from the fact that he is called an Aramean (<a onClick="return mV(\'Deu\',26,5);">De 26:5</a>), and that Laban\'s native language was Aramaic (<a onClick="return mV(\'Gen\',31,47);">Ge 31:47</a>). A further point is that the word "Sea" is used for the west and "Negeb" for the south, indicating Palestine as the home of the language (so <a onClick="return mV(\'Isa\',19,18);">Isa 19:18</a>).<P>10. Its Antiquity:<P>As the aboriginal inhabitants of the land of Canaan were not Semites, we cannot infer the existence of the Hebrew language any earlier than the first immigrations of Semites into Palestine, that is, during the third millennium BC. It would thus be a much younger member of the Semitic family than Assyrian-Babylonian, which exhibits all the marks of great antiquity long before the Hebrew language is met with.<P>11. When Hebrew Became a Dead Language:<P>The Babylonian exile sounded the death-knell of the Hebrew language. The educated classes were deported to Babylon or fled to Egypt, and those who remained were not slow to adopt the language used by their conquerors. The old Hebrew became a literary and sacred tongue, the language of everyday life being probably Aramaic. Whatever may be the exact meaning of <a onClick="return mV(\'Neh\',8,8);">Ne 8:8</a>, it proves that the people of that time had extreme difficulty in understanding classical Hebrew when it was read to them. Yet for the purpose of religion, the old language continued to be employed for several centuries. For patriotic reasons it was used by the Maccabees, and by Bar Cochba (135 AD).<P>LITERATURE.<P>Gesenius, Geschichte der hebr. Sprache und Schrift; Bertheau, "Hebr. Sprache" in RE, 2nd edition; see also "Literature" in the following section.<P>III. Chief Characteristics of Hebrew.<P>The special marks which particularly distinguish a language may be found in its alphabet, in its mode of inflection, or in its syntax.<P>1. Characteristic Sounds:<P>The Hebrew alphabet is characterized by the large number of guttural sounds which it contains, and these are not mere palatals like the Scotch or German chapter, but true throat sounds, such as are not found in the Aryan languages. Hence, when the Phoenician alphabet passed over into Greece, these unpronounceable sounds, " \' "(\' ayin), "ch" (cheth), "h" (he), "\' " (\'aleph) were changed into vowels, A, E, H, O. In Hebrew the guttural letters predominate. "In the Hebrew dictionaries the four gutturals occupy considerably more than a fourth part of the volume; the remaining eighteen letters occupying considerably less than three-fourths." Besides the guttural, there are three strong consonants "m" (mem), "q" (qoph), and "ts" (tsade), which are sounded with compression of the larynx, and are quite different from our "t," "k" and "s." In Greek, the first was softened into a "th" (theta), the other two were dropped as letters but retained as numerals.<P>2. Letters Representing Two Sounds:<P>Though the Hebrew alphabet comprises no more than 22 letters, these represent some 30 different sounds, for the 6 letters b, g, d, k, p and t, when they fall immediately after a vowel, are pronounced bh(v), gh, dh, kh, ph (f) and th. Moreover, the gutturals "ch" (cheth) and " \' "(\' ayin) each represent two distinct sounds, which are still in use in Arabic. The letter "h" is sometimes sounded at the end of a word as at the beginning.<P>3. Consonants Representing Vowels:<P>A peculiarity of the Hebrew alphabet is that the letters are all consonants. Four of these, however, were very early used to represent vowel and diphthong sounds, namely, "\'", "h", "w" and "y". So long as Hebrew was a spoken language no other symbols than these 22 letters were used. It was not until the 7th century AD at the earliest that the well-known elaborate system of signs to represent the vowels and other sounds was invented (see <a href="./study/isbe/search.html?string=TEXT+AND+MANUSCRIPTS+OF+THE+NEW+TESTAMENT">TEXT AND MANUSCRIPTS OF THE NEW TESTAMENT</a>; <a href="./study/isbe/search.html?string=TEXT+OF+THE+OLD+TESTAMENT">TEXT OF THE OLD TESTAMENT</a>).<P>4. The Syllable:<P>A feature of the Hebrew language is that no word or syllable may begin with a vowel: every syllable begins with a consonant. This is also true of the other Semitic languages, except Assyrian-Babylonian. When in the course of word-formation a syllable would begin with a vowel, the slight consonant\' (\'aleph) is prefixed. Moreover, more than two consonants may not stand without vowels intervening, as in the English word "strength." At most, two consonants may begin a syllable, and even so a slight vowel is sounded between them, as qero\'. A word may end in two consonants without vowels, as \'amart, but no word or syllable ends in more than two.<P>5. Three-Letter Roots:<P>The outstanding feature of the Semitic family of languages is the root, consisting of three consonants. Practically, the triliteral root is universal. There are a few roots with more than three letters, but many of the quadriliteral roots are formed by reduplication, as kabkab in Arabic. Many attempts have been made to reduce three-letter stems to two-letter by taking the factors common to several roots of identical meaning. Thus duwm, damah, damam, "to be still," seem all to come from a root d-m. It is more probable, however, that the root is always triliteral, but may appear in various forms.<P>6. Conjugations or Derived Stems:<P>From these triliteral roots all parts of the verbs are formed. The root, which, it ought to be stated, is not the infinitive, but the 3rd singular masculine perfect active, expresses the simple idea without qualification, as shabhar, "he broke." The idea of intensity is obtained by doubling the middle stem letter, as shibber, "he broke in fragments"; the passive is expressed by the u-vowel in the first place and the a-vowel in the last, as shubbar, "it was broken in fragments." The reflexive sense prefixes an "n" to the simple root, or a "t" (taw) to the intensive, but the former of these is often used as a passive, as nishbar, "it was broken," hithqaddesh, "he sanctified himself." The causative meaning is given by prefixing the letter "h", as malakh, "he was king," himlikh, "he caused (one) to be king." A somewhat similar method of verb building is found outside the Semitic language, for example, in Turkish. In some of these Semitic languages the number of formations is very numerous. In Hebrew also there are traces of stems other than those generally in use.<P>7. Absence of Tenses:<P>There are no tenses in Hebrew, in our sense of the word. There are two states, usually called tenses, the perfect and the imperfect. In the first the action is regarded as accomplished, whether in the past or future, as shabhar, "he broke," "he has broken," "he will have broken," or (in prophetic narrative) "he will break"; in the second, the action is regarded as uncompleted, "he will break," "he was breaking," "he is breaking," etc. The present is often expressed by the participle.<P>8. The Pronouns:<P>The different persons, singular and plural, are expressed by affixing to the perfect, and by prefixing to the imperfect, fragments of the personal pronouns, as shabharti, "I broke," shabharnu, "we broke," nishbor, "we will break," and so on. The fragments which are added to the perfect to express the nominative of the pronouns are, with some modification, especially the change of "t" into "k", added to the verb to express the accusative, and to the noun to express the genitive; for example, shabharta, "you broke," shebharekha, "he broke you," bethekha, "your house"; capharnu, "we counted," cepharanu, "he counted us," ciphrenu, "our book."<P>9. Formation of Nouns:<P>The same principles are followed in regard to the noun as to the verb. Many nouns consist solely of the three stem-letters articulated with one or with two vowels, except that monosyllables generally become dissyllabic, owing to the difficulty of pronouncing two vowelless consonants together: thus, melekh, "king," cepher, "book," goren, "threshingfloor" (instead of malk, ciphr, gorn), dabhar, "a word or thing," qarobh, "near." Nouns denoting place, instrument, etc., are often formed by prefixing the letter "m" to the root, as mishpat, "justice" from shaphat, "he judged," mazlegh, "a fork." Intensity is, given to the root idea, as in the verb, by doubling the middle consonant: thus, choresh "working," charash (for charrash), "workman"; gonebh, "stealing," gannabh, "a thief." Similarly, words denoting incurable physical defects, \'illem, "dumb," \'iwwer, "blind," cheresh (for chirresh), "deaf and dumb." The feminine of nouns, as of the 3rd person of verbs, is formed by adding the letter "t", which when final is softened to "h", gebhirah, "queen-mother," "mistress," but gebhirtekh, "your mistress."<P>10. Internal Inflexion:<P>The inflexion of both verbs and nouns is accompanied by a constant lengthening or shortening of the vowels of the word, and this according to two opposite lines. In verbs with vowel-affixes the penultimate vowel disappears, as halakh, "he went," halekhu, "they went"; in the noun the ante-penultimate vowel disappears, as dabhar, "a word," plural debharim. As the vowel system, as stated above, is very late, the vocalization cannot be accepted as that of the living tongue. It represents rather the cantillation of the synagogue; and for this purpose, accents, which had a musical as well as an interpunctional value, have been added.<P>11. Syntax of the Verb:<P>Hebrew syntax is remarkable for its simplicity. Simple sentences predominate and are usually connected by the conjunction "and." Subordinate sentences are comparatively rare, but descriptive and temporal clauses are not uncommon. In the main narrative, the predicates are placed at the beginning of the sentence, first simply in the root form (3rd singular masculine), and then only when the subject has been mentioned does the predicate agree with it. Descriptive and temporal clauses may be recognized by their having the subject at the beginning (e.g. <a onClick="return mV(\'Gen\',1,2);">Ge 1:2</a>). A curious turn is given to the narrative by the fact that in the main sentences, if the first verb is perfect, those which follow are imperfect, and vice versa, the conjunction which coordinates them receiving a peculiar vocalization—that of the definite article. In the English Bible, descriptive and temporal clauses are often rendered as if they were parts of the main sentence, for example, in the first verses of Genesis of which the literal translation is somewhat as follows: "At the beginning of God\'s creating heaven and earth, when the earth was without form and void, and God\'s spirit (or, a great wind) moved upon the face of the water, God said, Let there be light." It will thus be seen that the structure of Hebrew narrative is not so simple as it appears.<P>12. Syntax of the Noun:<P>In the Semitic languages, compound words do not occur, but this deficiency is made up by what is called the construct state. The old rule, that the second of two nouns which depend on one another is put in the genitive, becomes, in Hebrew, the first of two such nouns is put in the construct state. The noun in the construct state loses the definite article, and all its vowels are made as short as possible, just as if it were the beginning of a long word: for example, ha-bayith, "the house," but beth ha-melekh, "the house of the king," "the palace"; dabhar, "a word," but dibhere ruach, "words of wind," "windy words."<P>13. Poverty of Adjectives:<P>The Hebrew language is very poor in adjectives, but this is made up for by a special use of the construct state just mentioned. Thus to express magnitude the word "God" is added in the gen. case, as in the example above (<a onClick="return mV(\'Gen\',1,2);">Ge 1:2</a>), "a mighty wind" = a wind of God; <a onClick="return mV(\'Psa\',36,6);">Ps 36:6</a>, "the lofty mountains" = the mountains of God (<span class="noTag">so</span> <a onClick="return mV(\'Psa\',68,15);">68:15</A>); <a onClick="return mV(\'Psa\',80,10);">80:10</a>, "goodly cedars" = cedars of God; so "a holy man" = a man of God; "the sacred box" = the ark of God, and so on; compare in the New Testament, <a onClick="return mV(\'Mat\',27,54);">Mt 27:54</a>, "the son of God" = <a onClick="return mV(\'Luk\',23,47);">Lu 23:47</a>, "a righteous (man)." Matthew was thinking in Aramaic, Luke in Greek. A similar use is made of other words, e.g. "stubborn" = hard of neck; "impudent" = hard of face; "extensive" = broad of hands; "miserable" = bitter of soul.<P>LITERATURE.<P>The articles on the Hebrew Language in Schenkel\'s Bibel-Lexikon, 1875, by Noldeke; in Encyclopedia Brit, 9th edition, by Robertson Smith; 11th edition by Noldeke; in the Imperial Bible Dict., 1866, by T. H. Weir; also those in HDB, EB.<P>Grammars:<P>A. B. Davidson\'s Elementary Heb Grammar and Syntax; Gesenius, Heb Grammar, English translation by Cowley, 2nd edition.<P>Dictionaries:<P>Brown, Briggs and Driver, Hebrew and English Lexicon; Gesenius, Handworterbuch, 15th edition; Feyerabend, Hebrew-English Pocket Dictionary; Breslau, English and Hebrew Dictionary.<P>IV. Biblical Aramaic.<P>1. Aramaic Portions of the Old Testament:<P>The Aramaic portions of the Old Testament are the following: <a onClick="return mV(\'Ezr\',4,\'8-\');">Ezr 4:8-6:18</a>; <a onClick="return mV(\'Ezr\',7,\'11-26\');">7:11-26</a>; <a onClick="return mV(\'Dan\',2,\'4-\');">Da 2:4-7:28</a>; <a onClick="return mV(\'Gen\',31,47);">Ge 31:47</a> (two words); <a onClick="return mV(\'Jer\',10,11);">Jer 10:11</a>. The language in which they are written used to be called Chaldee, but is now generally known simply as Biblical Aramaic. It represents a further declension from classical Semitic as compared with the Hebrew. The following are the principal points in which Biblical Aramaic differs from Hebrew.<P>2. Phonology:<P>The accent is placed on the last syllable, the first vowel disappearing, e.g. \'abhadh for Hebrew \'abhadh. It is curious that the same feature is found in Algerene and Moroccan Arabic: thus qacr becomes qcar. Dentals take the place of sibilants: dehabh for zahabh; telath for shalosh. The strong Hebrew "ts" (tsade) frequently becomes " \' "(\' ayin), and Hebrew " \' "(\' ayin) becomes "\' " (\'aleph): thus, \'ar\'a\' for \'erets; \'uq for tsuq.<P>3. Grammar:<P>In Hebrew the definite article is the prefix hal (ha-); in Aramaic the affix a\'; the latter, however, has almost lost its force. The dual is even more sparingly used than in Hebrew. The passive forms of verbs and those beginning with nun ("n") are practically wanting; the passive or reflexive forms are made by prefixing the letter "t" to the corresponding active forms, and that much more regularly than in Hebrew, there being three active and three passive forms.<P>4. Syntax:<P>In regard to syntax there is to be noted the frequent use of the participle instead of a finite verb, as in Hebrew; the disuse of the conjunction "and" with the vocalization of the article; and the disuse of the construct state in nouns, instead of which a circumlocution with the relative di is employed, e.g. tselem di dhehabh, "an image of gold." The same periphrasis is found also in West African Arabic.<P>5. Aramaic More Decadent than Hebrew:<P>It will thus be seen that if Hebrew represents a decadent form of an original classical language which was very similar to classical Arabic, Biblical Arabic stands on a still lower level. It is not to be supposed that Hebrew passed into Aramaic, though on the analogy of Arabic that view is not untenable. Rather, the different Semitic languages became fixed at different epochs. Arabic as a literary language crystallized almost at the source; Hebrew and the spoken Arabic of the East far down the stream; and Aramaic and Moroccan Arabic farthest down of all.<P>LITERATURE.<P>Kautzsch, Grammatik; Strack, Abriss des bibl. Aramaisch; Marti, Bibl. aram. Sprache; the articles on "Aramaic" or "Chaldee" in the Biblical Dicts. cited under III, and article <a href="./study/isbe/search.html?string=ARAMAIC+LANGUAGE">ARAMAIC LANGUAGE</a> in this Encyclopedia; the Hebrew text of Ezra, Nehemiah, Daniel, edition by Baer. Hebrew Dictionaries. generally include Biblical Aramaic.<P>V. Literary Characteristics of the Semites.<P>1. Concrete and Abstract:<P>The thinking of the Hebrews, like that of other Semites, was done, not in the abstract, but in the concrete. Thus, we find the material put for the immaterial, the expression for the thought, the instrument for the action, the action for the feeling. This mode of expression frequently gives rise to striking anthropomorphisms. Thus we have the eye for watchfulness or care (<a onClick="return mV(\'Psa\',33,18);">Ps 33:18</a>); the long hand for far-reaching powers (<a onClick="return mV(\'Isa\',59,1);">Isa 59:1</a>); broken teeth for defeated malice (<a onClick="return mV(\'Psa\',3,7);">Ps 3:7</a>); the sword for slaughter (<a onClick="return mV(\'Psa\',78,62);">Ps 78:62</a>); haughty eyes for superciliousness (<a onClick="return mV(\'Pro\',6,17);">Pr 6:17</a>); to say in the heart for to think (<a onClick="return mV(\'Psa\',10,6);">Ps 10:6</a>). It would be an interesting study to examine to what extent these expressions have been taken over from Hebrew into English.<P>2. View of Nature:<P>The Hebrew does not know the distinction between animate and inanimate Nature. All Nature is animate (<a onClick="return mV(\'Psa\',104,29);">Ps 104:29</a>). The little hills rejoice (<a onClick="return mV(\'Psa\',65,12);">Ps 65:12</a>); the mountains skip (<a onClick="return mV(\'Psa\',114,4);">Ps 114:4</a>); the trees clap their hands (<a onClick="return mV(\'Isa\',55,12);">Isa 55:12</a>); even the stones may cry out (<a onClick="return mV(\'Luk\',19,40);">Lu 19:40</a>). Such expressions are not to be taken as mere poetical figures of speech; they are meant quite literally. All Nature is one: man is merely a part of Nature (<a onClick="return mV(\'Psa\',104,23);">Ps 104:23</a>), even if he be the highest part (<a onClick="return mV(\'Psa\',8,5);">Ps 8:5</a>). Hence, perhaps, it arises that there is no neuter gender in the Semitic languages.<P>3. Pictorial Imagination:<P>The highly imaginative nature of the Hebrew comes into play when he is recounting past events or writing history. To his mind\'s eye all past events are present. He sees history taking place before his eyes as in a picture. Thus the perfect may generally be translated by the English past tense with "have," the imperfect by the English present tense with "is" or "is going to." In livelier style the participle is used: "They are entering the city, and behold Samuel is coming out to meet them" (<a onClick="return mV(\'1Sa\',9,14);">1Sa 9:14</a>). Hence, the oratio recta is always used in preference to the oratio obliqua. Moreover, the historian writes exactly as the professional story-teller narrates. Hence, he is always repeating himself and returning upon his own words (<a onClick="return mV(\'1Sa\',5,1,2);">1Sa 5:1,2</a>).<P>4. Prose and Poetry:<P>A result of the above facts is that there is no hard-and-fast distinction in Hebrew between prose and poetry. Neither is there in Hebrew, or in the Semitic language generally, epic or dramatic poetry, because their prose possesses these qualities in a greater degree than does the poetry of other races. All Hebrew poetry is lyric or didactic. In it there is no rhyme nor meter. The nearest approach to meter is what is called the qinah strophe, in which each verse consists of two parallel members, each member having five words divided into three and then two. The best example of this is to be found in <a onClick="return mV(\'Psa\',19,\'7-9\');">Ps 19:7-9</a>, and also in the Book of <a href="./study/isbe/search.html?string=LAMENTATIONS">LAMENTATIONS</a> (which see), from which the verse has received its name.<P>5. Hebrew Easy of Translation:<P>From the above description it may be inferred that the language of the Old Testament is one extremely easy of translation into foreign tongues without loss of meaning or rhythm, though it would be extremely difficult to render any modern language into classical Hebrew. Hence, the Psalms, for example, are as fine in their German or English versions as they are in the original. Where the Old Testament has been translated into the language of the country, it has become a classic. The English Bible is as important for the study of the English language as are the plays of Shakespeare.<P>LITERATURE.<P>In addition to the articles cited under III, Herder. The Spirit of Hebrew Poetry, translation by J. Marsh, 1833; Ed. Konig, Stilistik, Rhetorik, Poetik in Bezug auf die bibl. Litt. komparativisch dargestellt, 1900; the same author\'s brochure on the "Style of Scripture" in HDB, volume V; J. F. McCurdy on the "Semites" in the same volume; J. Kennedy, Hebrew Synonyms.``189';
isbe[5424]='Lantern`lan\'-tern (phanos, phaino, "to give light"): Lanterns were carried by the mob which arrested Jesus in Gethsemane (<a onClick="return mV(\'Jhn\',18,3);">Joh 18:3</a>, probably better "torches"). The word "lantern" in the time of early versions had a much wider significance than now. The Romans, however, had lanterns in the times of Christ, made by use of translucent skins, bladders, or thin plates of horn.``1';
isbe[5425]='Laodicea`la-od-i-se\'-a (Laodikia): A city of Asia Minor situated in the Lycos valley in the province of Phrygia, and the home of one of the Seven Churches of Revelation (<a onClick="return mV(\'Rev\',1,11);">1:11</A>). Distinguished from several other cities of that name by the appellation Ad Lycum, it was founded by Antiochus II (261-246 BC) of Syria, who named it for his wife Laodike, and who populated it with Syrians and with Jews who were transplanted from Babylonia to the cities of Phrygia and Lydia. Though Laodicea stood on the great highway at the junction of several important routes, it was a place of little consequence until the Roman province of Asia was formed in 190 BC. It then suddenly became a great and wealthy center of industry, famous specially for the fine black wool of its sheep and for the Phrygian powder for the eyes, which was manufactured there (compare <a onClick="return mV(\'Rev\',3,18);">Re 3:18</a>). In the vicinity was the temple of Men Karou and a renowned school of medicine. In the year 60 AD, the city was almost entirely destroyed by an earthquake, but so wealthy were its citizens that they rejected the proffered aid of Rome, and quickly rebuilt it at their own expense (compare <a onClick="return mV(\'Rev\',3,17);">Re 3:17</a>). It was a city of great wealth, with extensive banking operations (compare <a onClick="return mV(\'Rev\',3,18);">Re 3:18</a>). Little is known of the early history of Christianity there; Timothy, Mark and Epaphras (<a onClick="return mV(\'Col\',1,7);">Col 1:7</a>) seem to have been the first to introduce it. However, Laodicea was early the chief bishopric of Phrygia, and about 166 AD Sagaris, its bishop, was martyred. In 1071 the city was taken by the Seljuks; in 1119 it was recovered to the Christians by John Comnenus, and in the 13th century it fell finally into the hands of the Turks.<P>The ruins, now called Eski Hissar, or old castle, lie near the modern Gonjelli on the railroad, and they have long served as a quarry to the builders of the neighboring town of Denizli. Among them nothing from before the Roman period has appeared. One of the two Roman theaters is remarkably well preserved, and there may still be seen the stadium, a colonnade, the aqueduct which brought the water across the valley to the city by an inverted siphon of stone pipes, a large necropolis, and the ruins of three early Christian churches.``7';
isbe[5426]='Laodiceans, Epistle to the`la-od-i-se\'-anz, (en te Laodikeon ekklesia...ten ek Laodikias, "in the church of the Laodiceans...the epistle from Laodicea," <a onClick="return mV(\'Col\',4,16);">Col 4:16</a>):<P><b>I. EXPLANATIONS OF PAUL\'S STATEMENT</b><P class="in15">1. Written by the Laodiceans?<P class="in15">2. Written by Paul from Laodicea?<P class="in15">3. An Epistle Addressed to the Laodiceans<P><b>II. EVIDENCE FAVORING EPISTLE TO EPHESIANS</b><P class="in15">1. Marcion\'s Opinion<P class="in15">2. References in Ephesians and Other Epistles<P class="in15">3. Ephesian Church Jewish in Origin<P class="in15">4. Ephesians and Colossians, Sister Epistles<P class="in15">5. Recapitulation<P><b>III. LAODICEA DISPLACED BY EPHESUS</b><P class="in15">1. A Circular Epistle<P class="in15">2. Proof from Biblical Prologues<P><b>IV. REASON FOR SUCH AN EPISTLE</b><hr /><P>Paul here writes to the Colossians, "And when this epistle hath been read among you, cause that it be read also in the church of the Laodiceans; and that ye also read the epistle from Laodicea." What was or what is this epistle?<P>I. Explanations of Paul\'s Statement.<P>The words used by the apostle may mean:<P>(1) a letter written by the Laodiceans;<P>(2) an epistle written by Paul from Laodicea;<P>(3) an epistle written to the Laodiceans, and to be procured from them by the Colossians.<P>1. Written by the Laodiceans?:<P>The words may mean a letter written by the Laodiceans. But here it is sufficient to refer to the fact that Paul enjoins the Colossians to procure and to read "the epistle from Laodicea." How could a command of this kind be given in reference to an epistle written by third parties? How could Paul know that a copy of it had been made by the Laodiceans before sending it off? How could he tell that the Laodiceans would be willing to give away a copy of it? The suppositions involved by this hypothesis are incredible. Besides, the context regards the Epistle to the Colossians, and "that from Laodicea," as companion epistles, of which the two churches are to make an interchange, so that each church is directed to read both.<P>2. Written by Paul from Laodicea?:<P>Or, the words may refer to an epistle written by Paul from Laodicea. And it has been suggested that the epistle of which we are in search may be 1 Timothy, 1 Thessalonians, 2 Thessalonians, or Galatians. But in the case of these epistles, the probability is that every one of them was written elsewhere than from Laodicea. At the time when Paul wrote to Colosse, he was a prisoner in Rome, and for this reason alone, it was impossible that he could, at any recent date, have written any epistle from Laodicea. But his own statement (<a onClick="return mV(\'Col\',2,1);">Col 2:1</a>) is that those in Laodicea had not seen his face in the flesh. As he had never been in Laodicea, he could, not have written any epistle from that city.<P>3. An Epistle Addressed to the Laodiceans:<P>A third possibility is a letter written:<P>(1) not by Paul, but by some other person. But the whole tone of the passage does not favor this suggestion in the least;<P>(2) by Paul, but that the epistle is lost; this is the ordinary interpretation;<P>(3) the apocryphal Latin epistle. "To the Laodiceans."<P>This spurious epistle is a mere compilation clumsily put together; it has no marks of authenticity. Lightfoot (Col, 282) gives its general character thus: it "is a cento of Pauline phrases strung together without any definite connection or any clear object. They are taken chiefly from the Epistle to the Philippians, but here and there one is borrowed elsewhere, e.g. from the Epistle to the Galatians. Of course, it closes with an injunction to the Laodiceans to exchange epistles with the Colossians. The apostle\'s injunction in <a onClick="return mV(\'Col\',4,16);">Col 4:16</a> suggested the forgery, and such currency as it ever attained was due to the support which that passage was supposed to give to it. Unlike most forgeries, it had no ulterior aim. It has no doctrinal peculiarities. It is quite harmless, so far as falsity and stupidity combined can ever be regarded as harmless" (Lightfoot, in the work quoted 282).<P>See <a href="./study/isbe/search.html?string=APOCRYPHAL+EPISTLES">APOCRYPHAL EPISTLES</a>.<P>(4) The only other alternative is that "the epistle from Laodicea" is an epistle to the Laodiceans from Paul himself, which he directs the Colossians to procure from Laodicea. There seems to be not only a high degree of probability, but proof, that the epistle from Laodicea is the epistle known as the Epistle to the Ephesians. Paul therefore had written an epistle to Laodicea, a city which he had twice already mentioned in the Epistle to the Colossians, "For I would have you know how greatly I strive for you, and for them at Laodicea" (<a onClick="return mV(\'Col\',2,1);">Col 2:1</a>): "Salute the brethren that are in Laodicea, and Nymphas, and the church that is in their house" (<a onClick="return mV(\'Col\',4,15);">Col 4:15</a>). Accepting <a onClick="return mV(\'Col\',4,16);">Col 4:16</a> to mean that he wrote to Laodicea at the same time as he wrote to Colosse, what has become of the former ep.? Do we know nothing more of it now than is contained in this reference to it in Colossians? The fact that it was, by Paul\'s express command, to be communicated to at least the two churches in Colosse and Laodicea, would make its disappearance and loss very strange.<P>II. Evidence Favoring Epistle to Ephesians.<P>But is there any warrant for concluding that it is lost at all? A statement of the facts of the case seems to show that the epistle which Paul wrote to the Laodiceans is extant, but only under another title. The lines of evidence which seem to show that the so-called Epistle to the Ephesians is in reality the epistle written by Paul to the Laodiceans are these:<P>It is well known that the words "at Ephesus" (<a onClick="return mV(\'Eph\',1,1);">Eph 1:1</a>) in the inscription of the epistle are very doubtful. The Revised Version (British and American) reads in the margin, "Some very ancient authorites omit \'at Ephesus.\'" Among the authorities which omit "at Ephesus" are the Vatican and Sinaitic manuscripts, the best and most ancient authorities existing.<P>1. Marcion\'s Opinion:<P>Tertullian asserts that the heretics, i.e. Marcion, had altered the title, "the Epistle to the Ephesians," to "the Epistle to the Laodiceans." But this accusation does not carry with it any doctrinal or heretical charge against Marcion in this respect. "It is not likely," says Moule (Eph, 25), "that Marcion was guilty here, where the change would have served no dogmatic purpose." And the fact that at that very early period, the first half of the 2nd century, it was openly suggested that the destination of the epistle was Laodicea, is certainly entitled to weight, especially in view of the other fact already mentioned, which is of no less importance, that "at Ephesus" is omitted in the two great manuscripts, the Vatican and the Sinaitic.<P>2. References in Ephesians and Other Epistles:<P>The "Epistle to the Ephesians" could not be, primarily at least, addressed to Ephesus, because Paul speaks of his readers as persons in regard to whose conversion from heathenism to the faith of Christ he had just recently heard: "For this cause I also, having heard of the faith in the Lord Jesus which is among you, and the love which ye show toward all the saints, cease not to give thanks for you, making mention of you in my prayers" (<a onClick="return mV(\'Eph\',1,15);">Eph 1:15</a>f). These words could not well be used in regard to the church at Ephesus, which Paul himself had founded, and in reference to persons among whom he had lived for three years, and where he even knew personally "every one" of the Christians (<a onClick="return mV(\'Act\',20,31);">Ac 20:31</a>).<P>And in <a onClick="return mV(\'Eph\',3,1);">Eph 3:1</a>f the King James Version, he writes: "For this cause I, Paul, the prisoner of Jesus Christ for you Gentiles, if ye have heard of the dispensation of the grace of God which is given me to you-ward." But how could he ever doubt that the elders of the church in Ephesus (<a onClick="return mV(\'Act\',20,17);">Ac 20:17</a>), as well as the members of that important church, were ignorant of the fact that a dispensation of the grace of God had been given to him? The inquiry, whether his readers had heard of the one great fact on which his ministry was based, could not apply in any degree to the Christians in Ephesus. The apostle and the Ephesians had a clear and intimate mutual knowledge. They knew him and valued him and loved him well. When he bade the elders of the church farewell, they all fell on his neck and kissed him (<a onClick="return mV(\'Act\',20,37);">Ac 20:37</a>).<P>Clearly therefore the statement that he had just recently heard of their conversion, and his inquiry whether they had heard that a dispensation of the grace of God had been entrusted to him, do not and cannot describe the members of the church in Ephesus. "It is plain," writes Moule (Eph, 26), "that the epistle does not bear an Ephesian destination on the face of it."<P>In the Epistle to the Corinthians there are many local references, as well as allusions to the apostle\'s work in Corinth. In the Epistle to the Galatians there are also many references to his work among the people of the churches in Galatia. The same is the case in the Epistle to the Philippians, several names being mentioned of persons known to the apostle. In the two Epistles to the Thessalonians, references also occur to his work among them.<P>Turning to the Epistle to the Colossians, and to that to the Romans—Colossae and Rome being cities which he had not visited previous to his writing to the churches there—he knows several persons in Colosse; and in the case of the Epistle to the Romans, he mentions by name no fewer than twenty-six persons in that city.<P>How is it then that in "the Epistle to the Ephesians" there are no references at all to the three years which he spent in Ephesus? And how also is there no mention of any one of the members of the church or of the elders whom he knew so intimately and so affectionately? "Ephesians" is inexplicable on the ordinary assumption that Ephesus was the city to which the epistle was addressed. The other theory, that the epistle was a circular one, sent in the first instance to Laodicea, involves no such difficulty.<P>3. Ephesian Church Jewish in Origin:<P>Another indication in regard to the primary destination of the epistle is in the words, "ye, the Gentiles in the flesh, who are called Uncircumcision by that which is called Circumcision, in the flesh, made by hands; that ye were at that time separate from Christ, alienated from the commonwealth of Israel, and strangers from the covenants of the promise, having no hope and without God in the world" (<a onClick="return mV(\'Eph\',2,11,12);">Eph 2:11,12</a>). Do these words describe the church in Ephesus? Was the church there Gentile in its origin? Very far from this, for as a matter of fact it began by Paul preaching the gospel to the Jews, as is narrated at length by Luke in <a onClick="return mV(\'Act\',18,\'1-\');">Ac 18</a>. Then in <a onClick="return mV(\'Act\',19,\'1-\');">Ac 19</a>, Paul comes again to Ephesus, where he went into the synagogue and spake boldly for the space of three months, but when divers were hardened and believed not, but spake evil of the Way before the multitude, he separated the disciples, disputing daily in the school of one Tyrannus.<P>Here, therefore, is definite proof that the church in Ephesus was not Gentile in its origin. It was distinctly Jewish, but a Gentile element had also been received into it. Now the church to which Paul writes "the Epistle to the Ephesians" was not Jewish at all. He does not speak to his readers in any other way than "you Gentiles."<P>4. Ephesians and Colossians Sister Epistles:<P>But an important consideration is that the "Epistle to the Ephesians" was written by Paul at the same sitting almost as that to the Colossians. These two are sister epistles, and these along with the Epistle to Philemon were written and sent off at the same time, Onesimus and Tychicus carrying the Epistle to the Colossians (<a onClick="return mV(\'Col\',4,7,8,9);">Col 4:7,8,9</a>), Onesimus being the bearer of that to Philem, while Tychicus in addition to carrying the Colossian epistle was also the messenger who carried "the Epistle to the Ephesians" (<a onClick="return mV(\'Eph\',6,21);">Eph 6:21</a>).<P>A close scrutiny of Colossians and "Ephesians" shows, to an extent without a parallel elsewhere in the epistles of the New Testament, a remarkable similarity of phraseology. There are only two verses in the whole of Colossians to which there is no parallel in "Ephesians." The same words are used, while the thought is so varied and so rich, that the one epistle is in no sense a copy or repetition of the other (see list of parallelisms, etc., in Paul\'s Epistles to Colosse and Laodicea, T. and T. Clark, Edinburgh). Both epistles come warm and instinct with life from the full heart of the great apostle who had not, up to that time, visited either city, but on whom, none the less, there came daily the care of all the churches.<P>5. Recapitulation:<P>To recapitulate:<P>(1) The words "at Ephesus" in the inscription of the epistle are wanting in the two oldest and best manuscripts.<P>(2) Paul speaks of his readers as persons of whose conversion to Christ he knew only by report. Similarly he speaks of them as knowing only by hearsay of his commission as an apostle of Christ. Also, though he had lived in Ephesus for three years, this epistle does not contain a single salutation.<P>(3) He speaks of his readers as forming a church exclusively of the Gentiles. But the church in Ephesus, so far from being exclusively gentile, was actually Jewish in origin.<P>(4) "Ephesians" was written at the same sitting as Colossians, and the same messenger, Tychicus, carried them both.<P>Therefore as the epistle was not, and could not be, addressed to Ephesus, the conclusion is that it was addressed to some church, and that it was not a treatise sent to the Christian church generally. The words of the first verse of the ep., "to the saints that are," proves that the name of the place to which it was addressed is all that is lost from the manuscripts, but that the name of the city was there originally, as the epistle came from Paul\'s hand.<P>Now Paul wrote an epistle to Laodicea at the same time as he wrote to Colosse. He dispatched both epistles by Tychicus. The thought and feeling and even the diction of the two epistles are such that no other explanation is possible but that they came warm from the heart of the same writer at the same time. On all these grounds the conclusion seems inevitable that the Epistle to Laodicea is not lost at all, but that it is identical with the so-called "Epistle to the Ephesians."<P>III. Laodicea Displaced by Ephesus.<P>1. A Circular Epistle:<P>How then did Ephesus displace Laodicea? It is explained at once if theory is adopted that the epistle was a "circular" one addressed not to Laodicea only, but to other cities. We know e.g. that the apostle orders it to be taken to the church in Colosse and read there. So also it might have been sent to other cities, such as Hierapolis (<a onClick="return mV(\'Col\',4,13);">Col 4:13</a>) and Ephesus. Hence, if the church in Laodicea were not careful to see that the epistle was returned to them, by those churches to whom they had sent it, it can easily be understood how a copyist in any of those cities might leave out the words "in Laodicea," as not agreeing with the name of the city where the manuscript actually was at the time. As copies were multiplied, the words "in Ephesus" would be suggested, as the name of the chief city of Asia, from which province the epistle had come to the knowledge of the whole Christian church, and to which, in point of fact, Paul had sent it. The feeling would be natural, that it was in keeping with the fitness of things, that Paul, who had rounded the church in Ephesus, should have written an epistle to the church there.<P>2. Proof from Biblical Prologues:<P>In an article upon "Marcion and the Canon" by Professor J. Rendel Harris, LL.D., in the The Expository Times, June,1907,there is reference to the Revue Benedictine for January of that year, which contained a remarkable article by de Bruyne, entitled "Biblical Prologues of Marcionite Origin," in which the writer succeeded in showing that a very widely spread series of prefaces to the Pauline Epistles, which occur in certain Latin Bibles, must have been taken from a Marcionite Bible. Professor Rendel Harris adds that the prefaces in question may go back to Marcion himself, for in any case the Marcionite hand, from which they come, antedates the Latin tradition in which the prologues are imbedded. "It is clear from Tertullian\'s polemic against Marcion, that the Pauline Epistles stood in the following order in the Marcionite Canon: Galatians, 1 and 2 Corinthians, Romans, 1 and 2 Thessalonians, then Ephesians (which Marcion calls by the name of the Epistle to the Laodiceans), Colossians, Philippians, and Philemon....Let us turn to the prologues that are current in Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) and other manuscripts for Ephesians and Colossains: the Ephesian prologue runs as follows: \'Ephesii sunt Asiani. Hi accepto verbo veritatis perstiterunt in fide. Ho conlaudat apostolus, scribens eis a Roma de carcere!\' When, however, we turn to the Colossian prologue, we find that it opens as follows: \'Colossenses et hi sicut Laodicenses sunt Asiani. Et ipsi praeventi erant a pseudapostolis, nec ad hos accessit apostolus sed et hos per epistolam recorrigit,\' etc.<P>"From this it is clear that originally the prologue to the Laodiceans preceded the prologue to Colossians, and that the<P>Ephesian prologue is a substitute for the Laodicean prologue, which can be partly reconstructed from the references to it in the Colossian prologue. We can see that it had a statement that the Laodiceans belonged to Asia Minor, that they had been under the influence of false apostles, and had never been visited by Paul, who corrects their error by an epistle ....<P>"We have now shown that the original Canon had \'Laodiceans, Colossians.\' It is interesting to observe how some Latin manuscripts naively admit this: \'You must know that the epistle which we have as that written to the Ephesians, the heretics, and especially the Marcionites, entitle the Epistle to the Laodiceans.\'"<P>IV. Reason for Such an Epistle.<P>Assuming therefore that the "Epistle to the Ephesians" is the epistle which Paul wrote to the Laodiceans, various questions arise, such as, Why did he write to the church there? What was there in the state of the church in Laodicea to call for an epistle from him? Was there any heresy there, like the false teaching which existed in the neighboring church in Colosse?<P>The answer to such questions is that though we do not possess much information, yet these churches in the province of Asia had many things in common. They had originated at the same time, during the two whole years of Paul\'s residence in Ephesus. They were composed of men of the same races, and speaking the same languages. They were subject to the same influences of doctrinal error. The errors into which any one church fell could not fail to affect the others also. These churches were permeated to a large extent by the same ideas, derived both from the current philosophy and from their ancestral heathen religions. They would, therefore, one and all, require the same apostolic instruction and exhortation. This epistle, accordingly, bears a close resemblance to the Epistle to the Colossians, just for the reason that the circumstances of the church in Laodicea were similar to those of the church in Colosse; and also, that the thoughts which filled Paul\'s heart as he wrote to Colosse were adapted, in the first place, to counteract the false teaching in Colosse, but they are also the foundation of all Christian experience, and the very life of all Christian truth and doctrine. These are the great thoughts of Christ the Creator of all things, Christ the Upholder of all things, Christ the Reconciler of all things. Such thoughts filling Paul\'s heart would naturally find expression in language bearing a close resemblance to that in which he had just written to Colosse.<P>It is no more astonishing that Paul should have written to Laodicea, than that he also wrote to Colosse, which was probably the least important of all the cities and churches mentioned in the apostle\'s work and career. Neither is it any more to be wondered at that he should have written so profound an epistle as that to "the Ephesians," than that he should also have given directions that it be sent on to Colosse and read there; for this reason, that the exposition of Christ\'s great love to the church and of His giving Himself for it—the doctrine of the grace of God—is the very corrective required by the errors of the false teachers at Colosse, and is also the groundwork of Christian truth and experience for all agesú<P>NOTE: A very remarkable circumstance in regard to the apocryphal Epistle to the Laodiceans is mentioned by Nestle in the preface to his edition of the Latin New Testament, published in Stuttgart in 1906. He writes that "the Epistle to the Laodiceans was for a thousand years part of very many Latin Bibles, and obtained a place in pre-Lutheran German Bibles, together with Jerome\'s Epistle to Damasus."``155';
isbe[5427]='Lap`The word is the translation of three different Hebrew expressions: cheq (<a onClick="return mV(\'Pro\',16,33);">Pr 16:33</a>), beghedh (<a onClick="return mV(\'2Ki\',4,39);">2Ki 4:39</a>), and chotsen (<a onClick="return mV(\'Neh\',5,13);">Ne 5:13</a>, besides chatsen, <a onClick="return mV(\'Psa\',129,7);">Ps 129:7</a>). In all these passages the meaning is that of a part of oriental clothing, probably the folds of the garment covering the bosom or lap of a person. The flowing garments of Orientals invite the use of the same, on the part of speakers, in driving home certain truths enunciated by impressive gesticulation. Every reader of Roman history recalls the impressive incident of Quintus Fabius Maximus (Cunctator), who, in 219 BC, was ambassador of Rome to Carthage, and who, before the city council, holding the folds of his toga in the shape of a closed pouch, declared that he held enclosed in the same both peace and war, whichever the Carthaginians should desire to choose. When the Carthaginians clamored for war, he opened the folds of his garment and said: "Then you shall have war!" Very much like it, Nehemiah, when pleading for united efforts for the improvement of social order, addressed the priests of Jerusalem to get a pledge of their cooperation: "Also I shook out my lap (chotsen), and said, So God shake out every man from his house, and from his labor, that performeth not this promise; even thus be he shaken out, and emptied" (<a onClick="return mV(\'Neh\',5,13);">Ne 5:13</a>).<P>In English Versions of the Bible the verb "to lap" is found, which has no etymological connection with the above-mentioned nouns. It is in Hebrew laqaq and refers to the loud licking up of water by dogs (<a onClick="return mV(\'1Ki\',21,19);">1Ki 21:19</a>; <a onClick="return mV(\'1Ki\',22,38);">22:38</a> the King James Version), and in the story of Gideon\'s battle against the Midianites, of his 300 warriors (<a onClick="return mV(\'Jdg\',7,5);">Jud 7:5</a>).``106';
isbe[5428]='Lappidoth`lap\'-i-doth, -doth (lappidhoth, "flames," "torches"; the King James Version, Lapidoth): Deborah\'s husband (<a onClick="return mV(\'Jdg\',4,4);">Jud 4:4</a>). The Hebrew name is a feminine plural like Jeremoth (<a onClick="return mV(\'1Ch\',7,8);">1Ch 7:8</a>), Naboth (<a onClick="return mV(\'1Ki\',21,1);">1Ki 21:1</a>). The plural is probably intensive. Jewish interpreters have identified Lappidoth ("flames") with Barak ("lightning"). Some have taken the words rendered "wife of Lappidoth" (\'esheth lappidhoth) as a description of Deborah, and have translated them, "woman of lights," i.e. maker of wicks for the sanctuary; or "woman of flames," referring to her prophetic zeal. These explanations are more interesting than probable.``95';
isbe[5429]='Lapwing`lap\'-wing (dukhiphath; epops): A translation used in early VSS, now universally admitted to be incorrect. The lapwing had a crest, and resembled in size and color the hoopoe (Upupa epops). It appears in the lists of abominations only (<a onClick="return mV(\'Lev\',11,19);">Le 11:19</a> the King James Version and <a onClick="return mV(\'Deu\',14,18);">De 14:18</a> the King James Version, the Revised Version (British and American) <a href="./study/isbe/search.html?string=HOOPOE">HOOPOE</a>, which see). The lapwing is a plover, and its flesh and eggs are delicious food.``1';
isbe[5430]='Lasciviousness`la-siv\'-i-us-nes (aselgeia, "licentiousness," "wantonness," "unbridled lust," "shamelessness," "outrageousness"):<P>1. Sources:<P>Etymologists assign three probable sources of aselgeia, namely:<P>(1) from a compound of the alpha privitive (negation) and Selge, a Pisidian city whose inhabitants according to Thayer (New Testament Lexicon) "excelled in strictness of morals," but, according to Trench, a place whose people "were infamous for their vices";<P>(2) from a compound of "a" intense, and salagein, "to raise a disturbance or noise";<P>(3) from a compound of the alpha privitive a- and selgo, or thelgo, "exciting disgust or displeasure." It evidently means conduct and character that is unbecoming, indecent, unrestrainedly shameless.<P>2. As Used in the New Testament:<P>Mark uses it in <a onClick="return mV(\'Mar\',7,22);">7:22</A> with uncertainty as to the vice meant. Paul (<a onClick="return mV(\'2Cr\',12,21);">2Co 12:21</a>) classes it with uncleanness and fornication as sins to be repented of; also (<a onClick="return mV(\'Gal\',5,19);">Ga 5:19</a>; compare The <span class="noTag">Wisdom of Solomon 14:26</span>, "wantonness") puts it in the same catalogue with other works of the flesh; and (<a onClick="return mV(\'Eph\',4,19);">Eph 4:19</a>) he refers to some aged ones so covetous, that they made trade of themselves by giving "themselves up to lasciviousness." The same word is translated "wantonness" in <a onClick="return mV(\'Rom\',13,13);">Ro 13:13</a>, meaning wanton manner, filthy words, unchaste movements of the body. Peter (<a onClick="return mV(\'1Pe\',4,3);">1Pe 4:3</a>) mentions those who "walked in lasciviousness, lusts, winebibbings, revellings, carousings, and abominable idolatries." He speaks (<a onClick="return mV(\'2Pe\',2,2);">2Pe 2:2</a>) of "lascivious doings" (the King James Version "pernicious ways"); (<a onClick="return mV(\'2Pe\',2,7);">2Pe 2:7</a>) "lascivious life" (the King James Version "filthy conversation"); and (<a onClick="return mV(\'2Pe\',2,18);">2Pe 2:18</a>) of "lasciviousness" (the King James Version "wantonness"), as a means "to entice in the lusts of the flesh." <a onClick="return mV(\'Jud\',1,4);">Jude 1:4</a> probably does not refer to any form of sensuality in using the word descriptive of "ungodly men" who perverted the faith of some and denied our only Master.``142';
isbe[5431]='Lasea`la-se\'-a (Lasaia): A town on the south coast of Crete, 5 miles east of Fair Havens (<a onClick="return mV(\'Act\',27,8);">Ac 27:8</a>). The ruins were examined in 1856 by G. Brown (see Code of Hammurabi (St. P), chapter xxiii, 640). If Paul\'s ship was detained long at this anchorage, it would be necessary to purchase stores from Lasea; and this in addition to the inconvenience of the roadstead (see <a href="./study/isbe/search.html?string=FAIR+HAVENS">FAIR HAVENS</a>) would probably explain the captain\'s reluctance to winter there.``1';
isbe[5432]='Lasha`la\'-sha (lasha\'): A place named on the southern boundary of the Canaanites along with Gomorrah, Adnah and Zeboiim (<a onClick="return mV(\'Gen\',10,19);">Ge 10:19</a>). Eusebius, Onomasticon identifies it with the hot springs at Callirrhoe in Wady Zerqa Ma\'in, on the east of the Dead Sea; in this agreeing with Targum Jerusalem. This position, however, seems too far to the north, and possibly the site should be sought on the west of the Arabah. The absence of the article (compare <a onClick="return mV(\'Jos\',15,2);">Jos 15:2</a>) prevents identification with the promontory el-Lisan, which runs into the sea from the eastern shore. Wellhausen (Comp. des Hexateuch., 15) thinks we should read lesham, since the Hebrew letters, "m" (mem) and " \' "(\' ayin), are like each other in their Palmyrene form. We should then have indicated the boundary from Gaza to the Dead Sea, and then from the Dead Sea to Leshem, i.e. Dan. This is very precarious. No identification is possible.``54';
isbe[5433]='Lassharon`la-sha\'-ron, la-shar\'-on (lashsharon or la-sharon, the King James Version Sharon): A royal city of the Canaanites taken by Joshua, named with Aphek (<a onClick="return mV(\'Jos\',12,18);">Jos 12:18</a>). Possibly we should here follow the reading of Septuagint (Codex Vaticanus), "the king of Aphek in Sharon." Eusebius, Onomasticon (s.v. "Saron") mentions a region between Mt. Tabor and the Lake of Tiberias called Sarona. This is probably represented by the ancient site Sarona, on the plateau 6 1/2 miles southwest 2 of Tiberias. If Massoretic Text is correct, this may be the place intended.``1';
