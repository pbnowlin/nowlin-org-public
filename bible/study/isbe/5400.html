isbe[5462]='Leah`le\'-a (le\'ah; Leia, "weary," "dull"(?), "wild cow"): Rachel\'s sister, and the elder daughter of Laban (<a onClick="return mV(\'Gen\',29,16);">Ge 29:16</a>). We are told that her eyes were "tender" rakkoth). Gesenius renders it "weak," Septuagint astheneis; accordingly, she was weak-eyed, but by no means "blear-eyed" (compare Vulgate). Her eyes were lacking that luster which always and everywhere is looked upon as a conspicuous part of female beauty. Josephus (Ant., I, xix, 7) says of her, ten opsin ouk euprepe, which may safely be rendered, "she was of no comely countenance."<P>Leah became the wife of Jacob by a ruse on the part of her father, taking advantage of the oriental custom of heavily veiling the prospective bride. When taken to task by his irate son-in-law, Laban excused himself by stating it was against the rule of the place "to give the younger before the first-born" (<a onClick="return mV(\'Gen\',29,\'21-26\');">Ge 29:21-26</a>). Although Rachel was plainly preferred by Jacob to Leah, still the latter bore him six sons: Reuben, Simeon, Levi, Judah (<a onClick="return mV(\'Gen\',29,31);">Ge 29:31</a>), Issachar, Zebulun, and a daughter, Dinah (<a onClick="return mV(\'Gen\',30,\'17-21\');">Ge 30:17-21</a>). Up to this time Rachel had not been blessed with children of her own. Thus the lesson is brought home to us that Yahweh has a special and kindly regard for the lowly and despised, provided they learn, through their troubles and afflictions, to look to Him for help and success. It seems that homely Leah was a person of deep-rooted piety and therefore better suited to become instrumental in carrying out the plans of Yahweh than her handsome, but worldly-minded, sister Rachel.<P>When Jacob decided to return to the "land of his fathers," both of his wives were ready to accompany him (<a onClick="return mV(\'Gen\',31,4,14);">Ge 31:4,14</a>). Before they reached the end of their journey their courage was sorely tried at the time of the meeting between Jacob and his brother Esau. Although Leah was placed between the handmaids in the front, and Rachel with her son Joseph in the rear, she still cannot have derived much comfort from her position. We may well imagine her feeling of relief when she saw Esau and his 400 men returning to Seir (<a onClick="return mV(\'Gen\',33,2,16);">Ge 33:2,16</a>).<P>According to <a onClick="return mV(\'Gen\',49,31);">Ge 49:31</a>, Leah was buried at Machpelah. We cannot know for a certainty that she died before Jacob\'s going down to Egypt, though it is very likely. If she went down with her husband and died in Egypt, he had her body sent to the family burying-place. <a onClick="return mV(\'Rth\',4,11);">Ru 4:11</a> discloses the fact that her memory was not forgotten by future generations. When Boaz took Ruth for a wife the witnesses exclaimed, "Yahweh make the woman that is come into thy house like Rachel and like Leah, which two did build the house of Israel."``8';
isbe[5463]='Leannoth`le-an\'-oth (<a onClick="return mV(\'Psa\',88,\'1-\');">Ps 88, title</a>).`<a href="./study/isbe/search.html?string=PSALMS">PSALMS</a>`1';
isbe[5464]='Leaping`lep\'-ing.`<a href="./study/isbe/search.html?string=GAMES">GAMES</a>`1';
isbe[5465]='Leasing`lez\'-ing (kazabh "to devise," "to fabricate," hence, "to lie"; occurs but twice in the King James Version (<a onClick="return mV(\'Psa\',4,2);">Ps 4:2</a>, the Revised Version (British and American) "falsehood"; <a onClick="return mV(\'Psa\',5,6);">5:6</A>, the Revised Version (British and American) "lies"); the Hebrew word is translated "liars" (<a onClick="return mV(\'Psa\',116,11);">Ps 116:11</a>); "lie" or deceive (<a onClick="return mV(\'Job\',6,28);">Job 6:28</a>)): The idea of treachery, lying, and deceit, lies at the root of this word. Joab\'s conduct is a good illustration of the meaning (<a onClick="return mV(\'2Sa\',3,27);">2Sa 3:27</a>; <a onClick="return mV(\'2Sa\',20,\'8-10\');">20:8-10</a>). In <a onClick="return mV(\'Psa\',5,6);">Ps 5:6</a> David is referring to the cunning, treachery, and falsehood of his adversaries; compare <a onClick="return mV(\'2Sa\',13,28);">2Sa 13:28</a>; <a onClick="return mV(\'2Sa\',15,\'7-9\');">15:7-9</a>. Doubtless David had a special person in mind as being guilty of "leasing," probably Ahithophel.``53';
isbe[5466]='Leather`leth\'-er.`<a href="./study/isbe/search.html?string=SKIN">SKIN</a>; <a href="./study/isbe/search.html?string=GIRDLE">GIRDLE</a>; <a href="./study/isbe/search.html?string=TANNER">TANNER</a>`1';
isbe[5467]='Leaven`lev\'-n (se\'or, chamets; zume; Latin fermentum): The nomadic ancestors of the Hebrews, like the Bedouin of today, probably made their bread without leaven; but leaven came to play a great part in their bread-making, their law and ritual, and their religious teaching (see <a onClick="return mV(\'Exd\',12,15,19);">Ex 12:15,19</a>; <a onClick="return mV(\'Exd\',13,7);">13:7</a>; <a onClick="return mV(\'Lev\',2,11);">Le 2:11</a>; <a onClick="return mV(\'Deu\',16,4);">De 16:4</a>; <a onClick="return mV(\'Mat\',13,33);">Mt 13:33</a>; <a onClick="return mV(\'Mat\',16,\'6-12\');">16:6-12</a>; <a onClick="return mV(\'Mar\',8,15);">Mr 8:15</a>f; <a onClick="return mV(\'Luk\',12,1);">Lu 12:1</a>; <a onClick="return mV(\'Luk\',13,21);">13:21</a>).<P>(1) In Bread-Making.<P>The form of leaven used in bread-making and the method of using it were simple and definite. The "leaven" consisted always, so far as the evidence goes, of a piece of fermented dough kept over from a former baking. There is no trace of the use of other sorts of leaven, such as the lees of wine or those mentioned by Pliny (NH, xviii. 26). The lump of dough thus preserved was either dissolved in water in the kneading-trough before the flour was added, or was "hid" in the flour (the King James Version "meal") and kneaded along with it, as was the case mentioned in the parable (<a onClick="return mV(\'Mat\',13,33);">Mt 13:33</a>). The bread thus made was known as "leavened," as distinguished from "unleavened" bread (<a onClick="return mV(\'Exd\',12,15);">Ex 12:15</a>, etc.).<P>See <a href="./study/isbe/search.html?string=BREAD">BREAD</a>.<P>(2) In Law and Ritual.<P>The ritual prohibition of leaven during "the feast of unleavened bread" including the Passover (<a onClick="return mV(\'Exd\',23,15);">Ex 23:15</a>, etc.) is a matter inviting restudy. For the historical explanation given in the Scriptures, see especially <a onClick="return mV(\'Exd\',12,\'34-39\');">Ex 12:34-39</a>; <a onClick="return mV(\'Exd\',13,3);">13:3</a>ff; <a onClick="return mV(\'Deu\',16,3);">De 16:3</a>. The antiquity of the prohibition is witnessed by its occurrence in the earliest legislation (<a onClick="return mV(\'Exd\',23,18);">Ex 23:18</a>; <a onClick="return mV(\'Exd\',34,25);">34:25</a>). A natural reason for the prohibition, like that of the similar exclusion of honey, is sought on the ground that fermentation implied a process of corruption. Plutarch voices this ancient view of the matter when he speaks of it as "itself the offspring of corruption, and corrupting the mass of dough with which it is mixed." Fermentatum is used in Persius (Sat., i.24) for "corruption." For this reason doubtless it was excluded also from the offerings placed upon the altar of Yahweh, cakes made from flour without leaven, and these only, being allowed. The regulation name for these "unleavened cakes" was matstsoth (<a onClick="return mV(\'Lev\',10,12);">Le 10:12</a>). Two exceptions to this rule should be noted (<a onClick="return mV(\'Lev\',7,13);">Le 7:13</a>; compare <a onClick="return mV(\'Amo\',4,5);">Am 4:5</a>): "leavened bread" was an accompaniment of the thank offering as leavened loaves were used also in the wave offering of <a onClick="return mV(\'Lev\',23,17);">Le 23:17</a>. Rabbinical writers regularly use leaven as a symbol of evil (Lightfoot).<P>(3) In Teaching.<P>The figurative uses of leaven in the New Testament, no less than with the rabbins, reflect the ancient view of it as "corrupt and corrupting," in parts at least, e.g. <a onClick="return mV(\'Mat\',16,6);">Mt 16:6</a> parallel, and especially the proverbial saying twice quoted by Paul, "A little leaven leaveneth the whole lump" (<a onClick="return mV(\'1Cr\',5,6);">1Co 5:6</a>f; <a onClick="return mV(\'Gal\',5,9);">Ga 5:9</a>). But as Jesus used it in <a onClick="return mV(\'Mat\',13,33);">Mt 13:33</a>, "The kingdom of heaven is like unto leaven," it is clearly the hidden, silent, mysterious but all-pervading and transforming action of the leaven in the measures of flour that is the point of the comparison.<P>LITERATURE.<P>Nowack, Hebrew Arch., II, 145f; Talmud, Berakhoth, 17a; Lightfoot, Hor. Hebrew. on <a onClick="return mV(\'Mat\',16,6);">Mt 16:6</a>.``47';
isbe[5468]='Lebana`le-ba\'-na, leb\'-a-na (lebhana\'), or family of returning exiles (<a onClick="return mV(\'Ezr\',2,45);">Ezr 2:45</a>; <a onClick="return mV(\'Neh\',7,48);">Ne 7:48</a>; compare 1Es 5:29).``1';
isbe[5469]='Lebanon`leb\'-a-non (lebanon; Septuagint Libanos; Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) Libanus):<P>1. Name:<P>Derived from the root labhen, "to be white," probably from the snow which covers its summits the greater part of the year. "White mountains" are found in almost every country. The light color of the upper limestone may, however, form a sufficient reason for the name. In prose the article is usually connected with the name. In poetry it is more often without the article. In the Septuagint, however, the article is generally present both in prose and poetry.<P>2. General Description:<P>The Lebanon range proper borders the east coast of the Mediterranean, for a distance of 100 miles, running north-northeast and south-southwest from the mouth of the Litany river, the classic Leontes (which enters the sea a little north of Tyre), to the mouth of the Eleuthurus (Nahr el-Kebir), a few miles north of Tripolis. This river comes through a depression between Lebanon and the Nuseiriyeh mountains, known as "the entrance to Hamath," and connects with a caravan route to the Euphrates through Palmyra. For a considerable distance north of the Litany, the mountain summits average from 4,000 to 6,000 ft. in height, and the range is more or less dissected by short streams which enter the Mediterranean. Most prominent of these is the Nahr ez-Zaherany, which, after running 25 or 30 miles in a southerly direction through the center of the range, like the Litany, turns abruptly west opposite Mt. Hermon, reaching the sea between Tyre and Sidon. In roughly parallel courses Nahr el-\'Awleh and Nahr Damur descend to the sea between Sidon and Beyrout, and Nahr Beyrout just north of the city. Throughout this district the mountain recesses are more or less wooded. Opposite Beyrout the range rises in Jebel Sannin to an elevation of 8,560 ft. Thirty miles farther northeast the summit is reached in Jebel Mukhmal, at an elevation of 10,225 ft., with several others of nearly the same height. An amphitheater here opens to the west, in which is sheltered the most frequented cedar grove, and from which emerges the Nahr Qadisha ("sacred stream") which enters the Mediterranean at Tripolis. Snow is found upon these summits throughout the year (<a onClick="return mV(\'Jer\',18,14);">Jer 18:14</a>), while formerly the level area between them furnished the snow fields from which a glacier descended several miles into the headwaters of the Qadisha, reaching a level of about 5,000 ft. The glacier deposited in this amphitheater a terminal moraine covering several square miles, which at its front, near Bsherreh, <span clas="noTag">is</span> 1,000 ft. in thickness. It is on this that the grove of cedars referred to is growing.<P>The view from this summit reveals the geographical features of the region in a most satisfactory manner. Toward the east lies Coele-Syria (the modern Buka), 7,000 ft. below the summit, bordered on the eastern side by the mountain wall of Anti-Lebanon, corresponding to the cliffs of Moab east of the Jordan valley, opposite Judea. This depression in fact is but a continuation of the great geological fault so conspicuous in the Jordan valley (see <a href="./study/isbe/search.html?string=ARABAH">ARABAH</a>). As one looks down into this valley, Ba\'albek appears at the base of Anti-Lebanon, only 20 miles away. The valley is here about 10 miles wide, and forms the watershed between the Orontes and the Litany. To the northeast the valley of the Orontes is soon obscured by intervening peaks, but to the southwest the valley of the Litany closes up only where the glistering peak of Mt. Hermon pierces the sky, as the river turns abruptly toward the sea 40 miles distant. Toward the west, the blue waters of the Mediterranean, only 25 miles distant as the crow flies, show themselves at intervals through the gorges cut by the rapid streams which have furrowed the western flanks of the mountain (<a onClick="return mV(\'Sgs\',4,15);">So 4:15</a>); 3,500 ft. beneath is the amphitheater many square miles in area, filled with the terminal moraine from which the Qadisha river emerges, and on which the grove of cedars (compare <a onClick="return mV(\'1Ki\',4,33);">1Ki 4:33</a>; <a onClick="return mV(\'Psa\',92,12);">Ps 92:12</a>; <a onClick="return mV(\'Hsa\',14,5);">Ho 14:5</a>) appears as a green spot in the center. Onward to the west the river gorge winds its way amid numerous picturesque village sites and terraced fields, every foot of which is cultivated by a frugal and industrious people. To the traveler who has made the diagonal journey from Beirut to the cedars, memory fills in innumerable details which are concealed from vision at any one time. He has crossed Nahr el-Kelb ("Dog River"), near its mouth, where he has seen Egyptian and Assyrian inscriptions dating from the time of Sennacherib\'s invasion. Ascending this river, after passing numerous villages surrounded by mulberry and olive groves, vineyards, and fields of wheat, and pausing to study the ruins of a temple dating from Roman times, and having crossed a natural bridge at Jisr el-Hagar with a span of 120 ft., rising 75 ft. above the stream, he arrives, at the end of the second day, at the ruins of the famous temple of Venus destroyed by the order of Constantine on account of the impurity of the rites celebrated in it. Here, too, is a famous spring, typical of many others which gush forth on either side of the Lebanon range from beneath the thick deposits of limestone which everywhere crown its summit. The flow of water is enormous, and at certain seasons of the year is colored red with a mineral matter which the ancients regarded with mysterious reverence (see LB, III, 244). The lower part of the amphitheater is covered with verdure and a scanty growth of pine and walnut trees, but the upper part merges in the barren cliffs which lie above the snow line. Onward, alternately through upturned limestone strata, left by erosion in fantastic forms, and through barren areas of red sandstone, where the cedars of Lebanon would flourish if protected from the depredations of man and his domestic animals, he crosses by turns at higher and higher levels the headwaters of the Ibrahim, Fedar, Jozeh, Byblus and the Botrys rivers, and at length reaches, on the fourth day, the Qadisha, 5 miles below the cedars of Lebanon. Viewed from the Mediterranean the Lebanon range presents a continuous undulating outline of light-colored limestone peaks, the whole rising so abruptly from the sea that through most of the distance there is barely room for a road along the shore, while in places even that is prevented by rocky promontories projecting boldly into the sea. The only harbors of importance are at Beyrout and Tripolis, and these are only partially protected, being open to the northwest. The eastern face of the range falling down into Coele-Syria is very abrupt, with no foothills and but one or two important valleys.<P>3. Geology:<P>Geologically considered, the Lebanon consists of three conformable strata of rock thrown up in an anticline with its steepest face to the east. The lowest of these are several thousand ft. thick, consisting of hard limestone containing few fossils, the most characteristic of which is Cidaris glandaria, from which the formation has been named Glandarian limestone. In its foldings this has been elevated in places to a height of 5,000 ft. Through erosion it is exposed in numerous places, where it presents picturesque castellated columns, whose bluish-gray sides are beautifully fluted by atmospheric agencies. The second formation consists of several hundred feet of red-colored sandstone alternating with soft limestone and clay deposits, occasionally containing a poor quality of bituminous coal, with pyrites and efflorescent salts. It is this that occasionally colors the water of the spring at Adonis. The characteristic fossil is Trigonia syriaca. Altogether this formation attains a thickness of 1,000 ft., and it is on its exposed surfaces that the most of the Lebanon pines are found. It contains also many signs of volcanic action. The third formation consists of hippurite limestone, a cretaceous formation, in some places almost wholly composed of fragments of the fossils from which it derives its name. This formation appears on all the highest summits, where in most cases it is nearly horizontal, and in places attains a thickness of 5,000 ft. Between the summits of the range and the foothills this formation has been almost wholly carried away by erosion, thus exposing the underlying formations. Cretaceous strata of still later age are found at low levels near the sea, which in places are covered by small deposits of Tertiary limestone, and by a porous sandstone of the Pleistocene age.<P>4. Scenery:<P>The scenery of the western slopes of Lebanon is most varied, magnificent, and beautiful, and well calculated, as indeed it did to impress the imagination of the Hebrew poets. Originally it was heavily covered with forests of pine, oak and cedar; but these have for the most part long since disappeared, except in the valley of Nahr Ibrahim, which is still thickly wooded with pine, oak and plane trees. Of the cedars there remain, besides the grove at the head of the Qadisha, only two or three, and they are of less importance. Every available spot on the western flanks of the Lebanon is cultivated, being sown with wheat or planted with the vine, the olive, the mulberry and the walnut. Irrigation is extensively practiced. When we let the eye range from the snowy summits of the mountain over all that lies between them and the orange groves of Sidon on the seashore, we understand why the Arabs say that "Lebanon bears winter on its head, spring on its shoulders, autumn in its lap, while summer lies at its feet."<P>In the more desolate places jackals, hyenas, wolves, and panthers are still found (compare <a onClick="return mV(\'2Ki\',14,9);">2Ki 14:9</a>).<P>5. History:<P>The original inhabitants of Lebanon were Hivites and Gebalites (<a onClick="return mV(\'Jdg\',3,3);">Jud 3:3</a>; <a onClick="return mV(\'Jos\',13,5,6);">Jos 13:5,6</a>). The whole mountain range was assigned to the Israelites, but was never conquered by them. It seemed generally to have been subject to the Phoenicians. At present it is occupied by various sects of Christians and Mohammedans, of whom the Maronites, Druzes and Orthodox Greeks are most active and prominent. Since 1860 the region has been under the protection of European powers with a Christian governor. No exact figures are available, but the population at present numbers probably about 275,000.<P>Ruins of ancient temples are numerous throughout Lebanon. Bacon estimates that within a radius of 20 miles of Ba\'albek there are 15 ruined sun-temples, the grandeur and beauty of which would have made them famous but for the surpassing splendor of Ba\'albek.<P>6. Anti-Lebanon:<P>Anti-Libanus (Judith 1:7; <a onClick="return mV(\'Jos\',13,5);">Jos 13:5</a>; <a onClick="return mV(\'Sgs\',7,4);">So 7:4</a>) is an extension northward of the great mountain system facing on the east the great geological fault most conspicuous in the valley of the Jordan (see <a href="./study/isbe/search.html?string=JORDAN,+VALLEY+OF">JORDAN, VALLEY OF</a>), extending from the Gulf of Akabah to Antioch on the Orontes River. The system begins at the Barada River just north of Mt. Hermon, and, running parallel to Mt. Lebanon for 65 miles, terminates at Chums, the "entering in of Hamath." The highest points of the range reach an elevation of over 8,000 ft. Eastward the range merges into the plateau of the great Syrian desert. South of Ba\'albek the Yahfufah, a stream of considerable importance, empties into the Litany, while the Barada (the "Abana" of Scripture), rising in the same plateau, flows eastward to Damascus, its volume being greatly increased by fountains coming in from the base of the dissected plateau.<P>LITERATURE.<P>The geographical and geological descriptions are largely obtained by the writer from an extended excursion through the region in the company of Professor Day of the Protestant College at Beirut, whose knowledge of the region is most intimate and comprehensive. For more detailed information see Robinson, BRP2, II, 435ff, 493; G. A. Smith, HGHL, 45ff; Burton and Drake, Unexplored Syria; Benjamin W. Bacon, and G.F. Wright in Records of the Past, 1906, V, 67-83, 195-204; Baedeker-Socin, Palestine.``198';
isbe[5470]='Lebaoth`le-ba\'-oth, -oth (lebha\'oth): An unidentified city in the south of the territory of Judah (<a onClick="return mV(\'Jos\',15,32);">Jos 15:32</a>). It is the same as Bethlebaoth of <a onClick="return mV(\'Jos\',19,6);">Jos 19:6</a>, which, by a clerical error appears in <a onClick="return mV(\'1Ch\',4,31);">1Ch 4:31</a> as "Beth-biri."``1';
isbe[5471]='Lebbaeus`le-be\'-us (Lebbaios): Mentioned in <a onClick="return mV(\'Mat\',10,3);">Mt 10:3</a> the King James Version as "Lebbaeus, whose surname was Thaddaeus" (the Revised Version (British and American) omits); one of the twelve apostles.`<a href="./study/isbe/search.html?string=THADDAEUS">THADDAEUS</a>`1';
isbe[5472]='Lebonah`le-bo\'-na (lebhonah): A place on the great north road between Shiloh and Shechem (<a onClick="return mV(\'Jdg\',21,19);">Jud 21:19</a>). It is represented by the modern Khan el-Lubban, about 3 miles west-northwest of Seilun ("Shiloh"), on the way to Nablus. It is a wretched village lying on the slope of a hill, with many rock tombs in the vicinity.``1';
isbe[5473]='Lecah`le\'-ka (lekhah): A descendant of Judah (<a onClick="return mV(\'1Ch\',4,21);">1Ch 4:21</a>).``1';
isbe[5474]='Ledge`lej (shalabh): The word in the sense of side-projection is used in <a onClick="return mV(\'1Ki\',7,28,29);">1Ki 7:28,29</a> in connection with the bases of Solomon\'s Molten Sea (see <a href="./study/isbe/search.html?string=SEA,+THE+MOLTEN">SEA, THE MOLTEN</a>); in <a onClick="return mV(\'1Ki\',7,35,36);">7:35,36</a>, where the King James Version uses the same word, the Revised Version (British and American) has "stay" (yadh, literally, "hand"). The Revised Version (British and American) likewise has "ledge" (round) for the King James Version "compass" (karkobh) in the description of the altar in <a onClick="return mV(\'Exd\',27,5);">Ex 27:5</a>; <a onClick="return mV(\'Exd\',38,4);">38:4</a> (see <a href="./study/isbe/search.html?string=ALTAR">ALTAR</a>), and the American Standard Revised Version substitutes "ledge" for "settle" (\'azarah) in <a onClick="return mV(\'Eze\',43,14,17,20);">Eze 43:14,17,20</a>; <a onClick="return mV(\'Eze\',45,19);">45:19</a>.`<a href="./study/isbe/search.html?string=TEMPLE">TEMPLE</a>`1';
isbe[5475]='Leeks`leks (chatsir; ta prasa): This word, elsewhere translated "grass," is in <a onClick="return mV(\'Num\',11,5);">Nu 11:5</a> rendered "leeks" in all the ancient VSS, on account of its association with garlic and onions; such a use of the word occurs in the Talmud The leek (Allium porrum) is much grown today in Palestine, while in ancient Egypt this vegetable was renowned.``1';
isbe[5476]='Lees`lez.`<a href="./study/isbe/search.html?string=WINE">WINE</a>`1';
isbe[5477]='Left`left (sama\'l, "to go to the left," "to turn to the left," semo\'l, "the left hand," sema\'li, "belonging to the left," "situated on the left"; aristeros, and euphemistically euonumos, literally, "having a good name," "of good omen"): The words are chiefly used in orientation with or without the addition of the word "hand." So Abraham says to Lot: "If thou wilt take the left hand (semo\'l), then I will go to the right; or if thou take the right hand, then I will go to the left (sama\'l)" (<a onClick="return mV(\'Gen\',13,9);">Ge 13:9</a>). Frequently in Hebrew idiom the right hand and the left are mentioned together in order to express the idea "everywhere," "anywhere," "altogether" (<a onClick="return mV(\'Gen\',24,49);">Ge 24:49</a>; <a onClick="return mV(\'Exd\',14,22,29);">Ex 14:22,29</a>; <a onClick="return mV(\'Num\',22,26);">Nu 22:26</a>; <a onClick="return mV(\'Deu\',2,27);">De 2:27</a>; <a onClick="return mV(\'Deu\',5,32);">5:32</a>; <a onClick="return mV(\'2Cr\',6,7);">2Co 6:7</a>). In the geographical sense the left is synonymous with north (<a onClick="return mV(\'Gen\',14,15);">Ge 14:15</a>; <a onClick="return mV(\'Jos\',19,27);">Jos 19:27</a>; <a onClick="return mV(\'Eze\',16,46);">Eze 16:46</a>; <a onClick="return mV(\'Act\',21,3);">Ac 21:3</a>). While the left hand is considered as weaker than the right (see <a href="./study/isbe/search.html?string=LEFTHANDED">LEFTHANDED</a>), it is the hand which holds the bow (<a onClick="return mV(\'Eze\',39,3);">Eze 39:3</a>). The left hand is the side from which bad omens come, and therefore less lucky and less honored than the right hand (see <a href="./study/isbe/search.html?string=HAND">HAND</a>, note).``106';
isbe[5478]='Lefthanded`left\'-hand-ed (\'itter yadh-yamin; Septuagint amphoterodexios, i.e. "ambidextrous"): The Hebrew presents a combination of words signifying literally, a man whose right hand is impeded or lame, who therefore uses the left hand instead, or one who by habit prefers the use of the left hand, where others use the right. It is interesting to note that in both instances, where the expression occurs in the Scripture, it refers to individuals belonging to the tribe of Benjamin (which name itself signifies "a son of the right hand"!). The first is Ehud, son of Gera, who killed Eglon, king of Moab, and thereby delivered Israel from paying tribute to the Moabites (<a onClick="return mV(\'Jdg\',3,15);">Jud 3:15</a>). The other instance is that of the 700 selected Benjamites, who, though lefthanded, "could sling stones at a hair-breadth, and not miss" (<a onClick="return mV(\'Jdg\',20,16);">Jud 20:16</a>; of <a onClick="return mV(\'1Ch\',12,2);">1Ch 12:2</a>).``106';
isbe[5479]='Leg`(1) shoq, Aramaic shoq;<P>(2) kara\', dual kera\'ayim;<P>(3) reghel; skelos; the King James Version translates also shobhel, and tse\'adhah, with "leg," but mistakenly):<P>(1) The first Hebrew word (shoq) denotes the upper leg, and is therefore synonymous with <a href="./study/isbe/search.html?string=THIGH">THIGH</a> (which see). It expresses metaphorically the muscular strength, and the pride of the runner. "He taketh no pleasure in the legs of a man" (<a onClick="return mV(\'Psa\',147,10);">Ps 147:10</a>). "His legs are as pillars of marble, set upon sockets of fine gold" (<a onClick="return mV(\'Sgs\',5,15);">So 5:15</a>). If the legs have lost their strength as in the lame or the Beri-beri patient, they become a metaphor for anything useless, inefficient or disappointing: "The legs of the lame hang loose; so is a parable in the mouth of fools" (<a onClick="return mV(\'Pro\',26,7);">Pr 26:7</a>). The Aramaic form is found in the description of the image of Nebuchadnezzar, "its legs of iron" (<a onClick="return mV(\'Dan\',2,33);">Da 2:33</a>).<P>(2) Kara\', dual kera\'ayim, the "leg," "respecting the legs," mentioned as a portion of the paschal lamb (<a onClick="return mV(\'Exd\',12,9);">Ex 12:9</a>), or, usually, in connection with the head and the inwards, as a sacrificial portion (<a onClick="return mV(\'Exd\',29,17);">Ex 29:17</a>; <a onClick="return mV(\'Lev\',1,9,13);">Le 1:9,13</a>; <a onClick="return mV(\'Amo\',3,12);">Am 3:12</a>). The word designates also the legs of leaping insects of the orthopterous family, locusts, etc., which were permitted as food to the Israelites (<a onClick="return mV(\'Lev\',11,21);">Le 11:21</a>). (3) Reghel, literally, "<a href="./study/isbe/search.html?string=FOOT">foot</a>" (which see), found in this sense only once: "He (Goliath) had greaves of brass upon his legs" (<a onClick="return mV(\'1Sa\',17,6);">1Sa 17:6</a>).<P>Two passages of wrong translation in the King James Version have been corrected by the Revised Version (British and American). The virgin daughter of Babylon is addressed: "Make bare the leg, uncover the thigh" (<a onClick="return mV(\'Isa\',47,2);">Isa 47:2</a>), the Revised Version (British and American) renders: "Strip off the train (shobhel), uncover the leg," the idea being that the gentle maid, who has been brought up in affluence and luxury, will have to don the attire of a slave girl and do menial work, for which her former garments are unsuited. The other passage is in <a onClick="return mV(\'Isa\',3,20);">Isa 3:20</a>, where the King James Version reads: "the bonnets, and the ornaments of the legs," the Revised Version (British and American) corrects: "the headtires (ts\'adhah), and the ankle chains."<P>In the New Testament the word "leg" is found only in connection with the breaking of the legs of the persons crucified with the Saviour (<a onClick="return mV(\'Jhn\',19,31,32,33);">Joh 19:31,32,33</a>). We know from Roman and Greek authors that this was done as a coup de grace to shorten the miseries of criminals condemned to die on the cross. The practice bore the technical name of skelokopia, Latin crurifragium. The verb skelokopein ("to break the legs"), is found in the apocryphal Gospel of Peter (<a onClick="return mV(\'1Pe\',4,14);">1Pe 4:14</a>), where it is distinctly stated that the legs of Jesus were not broken, that His sufferings on the cross might be extended, while the two malefactors crucified with Him were mercifully dispatched in this way. The crurifragium consisted of some strokes with a heavy club or mallet, which always materially hastened the death of the sufferer, and often caused it almost immediately.<P>Edersheim, in LTJM, II, 613, suggests that the breaking of legs was an additional punishment, and that it was always followed by a coup de grace, the perforatio or percussio sub alas, a stroke with sword or lance into the side. This, however, is not borne out by any classical information which is known to me, and is contradicted by the statement of the evangelist that Jesus received the percussio, while the malefactors endured the crurifragium. Compare on this subject, especially for parallels from classical authors, Sepp, Das Leben Jesu, VII, 441, and Keim, Jesus von Nazara (English translation), VI, 253,note 3.``106';
isbe[5480]='Legion`le\'-jun.`<a href="./study/isbe/search.html?string=ARMY">ARMY</a>; <a href="./study/isbe/search.html?string=ARMY,+ROMAN">ARMY, ROMAN</a>`1';
isbe[5481]='Legislation, of Sanctity`lej-is-la\'-shun.`<a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>`1';
isbe[5482]='Lehabim`le-ha\'-bim (lehdbhim): Named in <a onClick="return mV(\'Gen\',10,13);">Ge 10:13</a>; <a onClick="return mV(\'1Ch\',1,11);">1Ch 1:11</a> as descendants of Mizraim. They are probably to be identified with the <a href="./study/isbe/search.html?string=LUBIM">LUBIM</a> (which see), and the one word may be a corruption of the other.``1';
isbe[5483]='Lehi`le\'-hi.`<a href="./study/isbe/search.html?string=RAMATH+LEHI">RAMATH-LEHI</a>`1';
isbe[5484]='Lemuel`lem\'-u-el (lemu\'el, or lemo\'-el): A king whose words, an "oracle (taught him by his mother)," are given in <a onClick="return mV(\'Pro\',31,\'1-9\');">Pr 31:1-9</a>; and possibly the succeeding acrostic poem (<a onClick="return mV(\'Pro\',31,\'10-31\');">31:10-31</A>) is from the same source. Instead of translating the word after this name as "oracle" some propose to leave it as a proper name, translating "king of Massa," and referring for his kingdom to Massa (<a onClick="return mV(\'Gen\',25,14);">Ge 25:14</a>), one of the sons of Ishmael, supposedly head of a tribe or sheikh of a country. It is to be noted, however, that the words of Agur in the previous chapter are similarly called massa\', "oracle" with not so clear a reason for referring it to a country. See for a suggested reason for retaining the meaning "oracle" in both places, <a href="./study/isbe/search.html?string=PROVERBS,+THE+BOOK+OF">PROVERBS, THE BOOK OF, II, 6</a>.``66';
isbe[5485]='Lend, Loan`lon: The translation of 7 Hebrew and 2 Greek vbs.:<P>1. Lexical Usages:<P>In the Old Testament: lawah, "to join," "cause to join," "lend" (<a onClick="return mV(\'Exd\',22,25);">Ex 22:25</a>; <a onClick="return mV(\'Deu\',28,12,44);">De 28:12,44</a>; <a onClick="return mV(\'Psa\',37,26);">Ps 37:26</a>; <a onClick="return mV(\'Pro\',19,17);">Pr 19:17</a>); nashah, "to bite," "lend" (<a onClick="return mV(\'Deu\',24,11);">De 24:11</a>; <a onClick="return mV(\'Jer\',15,10);">Jer 15:10</a>); nashah (same root as last, though different verb stem, Hiphil), "to cause to bite," "lend on usury" (<a onClick="return mV(\'Deu\',15,2);">De 15:2</a>; <a onClick="return mV(\'Deu\',24,10);">24:10</a>); nashakh, "to bite," "lend" "(cause to lend) on usury" (<a onClick="return mV(\'Deu\',23,19,20);">De 23:19,20</a>); nathan, "to give" (<a onClick="return mV(\'Lev\',25,37);">Le 25:37</a>, the Revised Version (British and American) "to give"); \'abhat (Hiphil), "to cause to borrow," "to lend" (<a onClick="return mV(\'Deu\',15,6,8);">De 15:6,8</a>); sha\'al (Hiphil), "to cause to ask," "to lend" (<a onClick="return mV(\'Exd\',12,36);">Ex 12:36</a>, the Revised Version (British and American) "ask"; <a onClick="return mV(\'1Sa\',1,27);">1Sa 1:27</a>). In Septuagint daneizo, danizo, "to lend," translates lawah, and \'abat in above passages and in <a onClick="return mV(\'Neh\',5,4);">Ne 5:4</a>; <a onClick="return mV(\'Pro\',22,7);">Pr 22:7</a>, and <a onClick="return mV(\'Isa\',24,2);">Isa 24:2</a>; kichrao, also translations lawah and sha\'al (<a onClick="return mV(\'Psa\',112,5);">Ps 112:5</a>; <a onClick="return mV(\'Pro\',13,11);">Pr 13:11</a>); daneion(-ion), "loan," occurs in <a onClick="return mV(\'Deu\',15,8,10);">De 15:8,10</a>; <a onClick="return mV(\'Deu\',24,11);">24:11</a>; 4Macc 2:8. In the New Testament "lend" translations two Greek verbs, daneizo, "to lend money" (<a onClick="return mV(\'Luk\',6,34,35);">Lu 6:34,35</a>, usually in commercial sense); kichremi, "to lend (as a friendly act)" (<a onClick="return mV(\'Luk\',11,5);">Lu 11:5</a>).The substantive "loan," she\'elah, occurs only once in the Old Testament (<a onClick="return mV(\'1Sa\',2,20);">1Sa 2:20</a> the King James Version and the English Revised Version), not at all in the New Testament.<P>2. History of Lending in the Bible and Apocrypha:<P>(1) Lending on interest to the poor is prohibited in the code in <a onClick="return mV(\'Exd\',22,25);">Ex 22:25</a>.<p>(2) In the code in <a onClick="return mV(\'Deu\',15,\'1-6\');">De 15:1-6</a>; <a onClick="return mV(\'Deu\',23,19,20);">23:19,20</a>; <a onClick="return mV(\'Deu\',24,10,11);">24:10,11</a>; <a onClick="return mV(\'Deu\',28,12,44);">28:12,44</a>, borrowing and lending are taken for granted as existing in Israel, but the creditor is required to release his Hebrew brother as debtor in the 7th year (either the cancellation of the loan (so in Jewish literature and early Christian scholars) or suspension of payment that year (so most modern scholars)), though he may exact payment from a foreigner. Israel may lend, and will be able to lend, because of Yahweh\'s blessing, to other nations, but must not borrow from them. A pledge, or security, must not be taken in person by the creditor from the house of the debtor, nor kept overnight, if the debtor be poor.<p>(3) The code in <a onClick="return mV(\'Lev\',25,\'35-38\');">Le 25:35-38</a> requires that the Israelite receive no interest from his poor brother, because of the goodness of Yahweh to Israel.<p>(4) Notwithstanding the prohibition of the early laws against lending on interest or usury, the same seems to have become common in Israel before the exile (<a onClick="return mV(\'Isa\',24,2);">Isa 24:2</a>; <a onClick="return mV(\'Jer\',15,10);">Jer 15:10</a>), was practiced on the return, and was an evil to be corrected by Nehemiah (<a onClick="return mV(\'Neh\',5,7,10);">Ne 5:7,10</a>).<p>(5) According to <a onClick="return mV(\'Psa\',37,26);">Ps 37:26</a>; <a onClick="return mV(\'Psa\',112,5);">112:5</a>; <a onClick="return mV(\'Pro\',19,17);">Pr 19:17</a>, lending to the needy was regarded as a mark of the pious Hebrew, but no interest is to be charged.<p>(6) According to Apocrypha (The <span class="noTag">Wisdom of Solomon 15:16</span>; Sirach 8:12; 18:33; 20:15,29; 4Macc 2:8), borrowing is discouraged, and lending is exalted as a mark of the merciful man.<p>(7) Jesus teaches that His followers should lend, even to enemies, to men from whom they have no reasonable hope of expecting anything in return, because thus to do is to be like the Most High (<a onClick="return mV(\'Luk\',6,34,35);">Lu 6:34,35</a>). He did not discuss lending for commercial purposes, and so does not necessarily forbid it.<P>LITERATURE.<P>See Driver on <a onClick="return mV(\'Deu\',15,\'1-6\');">De 15:1-6</a>; Benzinger, Hebrew Archaeology, (1894), 350f; Oehler, Old Testament Theology,150,10; Plummer on <a onClick="return mV(\'Luk\',6,34,35);">Lu 6:34,35</a>.``194';
isbe[5486]='Lentils`len\'-tilz (\'adhashim; phakos; <a onClick="return mV(\'Gen\',25,34);">Ge 25:34</a>; <a onClick="return mV(\'2Sa\',17,28);">2Sa 17:28</a>; <a onClick="return mV(\'2Sa\',23,11);">23:11</a>; <a onClick="return mV(\'Eze\',4,9);">Eze 4:9</a>; the King James Version Lentiles): These are undoubtedly identical with the Arabic \'adas, a small, reddish bean, the product of Ervum lens, a dwarf leguminous plant, half a foot high, which is extensively cultivated in Palestine as a summer crop. The flour is highly nutritious, and the well-known food, Revalenta arabica, is simply one form, specially prepared; \'adas are highly esteemed in Palestine, and are used in soup and as a "pottage" known as mujedderah. This last is of a reddish-brown color and is without doubt the "pottage" of <a onClick="return mV(\'Gen\',25,34);">Ge 25:34</a>. Lentils were part of the provisions brought to David when fleeing from Absalom (<a onClick="return mV(\'2Sa\',17,28);">2Sa 17:28</a>) and were used in the making of the bread for the prophet Ezekiel (<a onClick="return mV(\'Eze\',4,9);">4:9</a>). In a "plot of ground full of lentils," Shammah, one of David\'s "mighty men," stood and defended it and slew the marauding Philistines (<a onClick="return mV(\'2Sa\',23,11,12);">2Sa 23:11,12</a>).``117';
isbe[5487]='Leopard`lep\'-erd (1) namer (<a onClick="return mV(\'Sgs\',4,8);">So 4:8</a>; <a onClick="return mV(\'Isa\',11,6);">Isa 11:6</a>; <a onClick="return mV(\'Jer\',5,6);">Jer 5:6</a>; <a onClick="return mV(\'Jer\',13,23);">13:23</a>; <a onClick="return mV(\'Hsa\',13,7);">Ho 13:7</a>; <a onClick="return mV(\'Hab\',1,8);">Hab 1:8</a>); compare Arabic nimr, "leopard." (2) Chaldaic nemar (<a onClick="return mV(\'Dan\',7,6);">Da 7:6</a>). (3) pardalis (<a onClick="return mV(\'Rev\',13,2);">Re 13:2</a>; Ecclesiasticus 28:23); compare nimrim Nimrim (<a onClick="return mV(\'Isa\',15,6);">Isa 15:6</a>; <a onClick="return mV(\'Jer\',48,34);">Jer 48:34</a>), nimrah, Nimrah (<a onClick="return mV(\'Num\',32,3);">Nu 32:3</a>), and beth-nimrah, Beth-nimrah (<a onClick="return mV(\'Num\',32,36);">Nu 32:36</a>; <a onClick="return mV(\'Jos\',13,27);">Jos 13:27</a>)): The leopard is found throughout Africa and ranges through Southern Asia from Asia Minor to Japan, being absent from Siberia and Central Asia. Its range is much the same as that of the lion, which latter, however, does not extend so far to the east. Like other animals of wide range, it has local varieties, but these shade into each other imperceptibly, and the one specific name, Felis pardus, includes all. Leopards live in some of the valleys east and south of the Dead Sea, and in the mountains of Sinai and northwestern Arabia. They have but rarely been seen of recent years in Lebanon or the more settled portions of Palestine. So far as can be judged from skins which are available for comparison, the leopard of Palestine is rather light in color, and is not as large as. some found in Africa or India. It is not certain that the place-names, <a href="./study/isbe/search.html?string=NIMRIM">NIMRIM</a>, <a href="./study/isbe/search.html?string=NIMRAH">NIMRAH</a>, and <a href="./study/isbe/search.html?string=BETH-NIMRAH">BETH-NIMRAH</a> (which see), have to do with namer, "leopard," but their location is in Moab, where leopards are well known, even at the present day. One of the valleys entering the Dead Sea from the east, south of the Arnon, is called Wadi-en-Numeir ("valley of the little leopard"; numeir, diminutive of nimr).<P>In the Bible "leopard" occurs mainly in figurative expressions, as a large and fierce beast. The leopard is mentioned with the lion and bear in <a onClick="return mV(\'Dan\',7,6);">Da 7:6</a>; <a onClick="return mV(\'Hsa\',13,7);">Ho 13:7</a>; <a onClick="return mV(\'Rev\',13,2);">Re 13:2</a>; with the lion, wolf and bear in <a onClick="return mV(\'Isa\',11,6);">Isa 11:6</a>; with the lion and wolf in <a onClick="return mV(\'Jer\',5,6);">Jer 5:6</a>; with the lion alone in Ecclesiasticus 28:23; with the wolf alone in <a onClick="return mV(\'Hab\',1,8);">Hab 1:8</a>. The leopard is smaller than the lion and the tiger, but is more active than either. Its swiftness is referred to in <a onClick="return mV(\'Hab\',1,8);">Hab 1:8</a>: "Their horses also (of the Chaldeans) are swifter than leopards." The spots of the leopard are referred to in <a onClick="return mV(\'Jer\',13,23);">Jer 13:23</a>: "Can the Ethiopian change his skin, or the leopard his spots?"<P>The Greek pardalis, and panther, were both applied to the leopard. "Panther" is sometimes used of large leopards, while in America, with its corrupt form "painter," it is one of the names applied to the cougar or puma, Felis concolor, which, as the specific name implies, is not spotted like the leopard, or striped like the tiger.``37';
isbe[5488]='Leper; Leprosy`lep\'-er, lep\'-ro-si (tsara\'ath; lepra): A slowly progressing and intractable disease characterized by subcutaneous nodules (Hebrew se\'eth; Septuagint oule; the King James Version "rising"), scabs or cuticular crusts (Hebrew cappachath; Septuagint semasia) and white shining spots appearing to be deeper than the skin (Hebrew bahereth; Septuagint telaugema). Other signs are<P>(1) that the hairs of the affected part turn white and<P>(2) that later there is a growth of "quick raw flesh."<P>This disease in an especial manner rendered its victims unclean; even contact with a leper defiled whoever touched him, so while the cure of other diseases is called healing, that of leprosy is called cleansing (except in the case of Miriam (<a onClick="return mV(\'Num\',12,13);">Nu 12:13</a>) and that of the Samaritan (<a onClick="return mV(\'Luk\',17,15);">Lu 17:15</a>) where the word "heal" is used in reference to leprosy). The disease is described in the Papyrus Ebers as ukhedu (the Coptic name for leprosy is tseht). It is also mentioned in ancient Indian and Japanese history. Hippocrates calls it "the Phoenician disease," and Galen names it "elephantiasis." In Europe it was little known until imported by the returning soldiers of Pompey\'s army after his Syrian campaign in 61 BC; but after that date it is described by Soranus, Aretaeus and other classic authors.<P>1. Old Testament Instances:<P>The first Old Testament mention of this disease is as a sign given by God to Moses (<a onClick="return mV(\'Exd\',4,6);">Ex 4:6</a> (Jahwist)), which may be the basis of the story in Josephus\' Apion, I, 31,that Moses was expelled from Heliopolis on account of his being a leper (see also I, 26 and Ant, III, xi, 4). The second case is that of Miriam (<a onClick="return mV(\'Num\',12,10);">Nu 12:10</a>), where the disease is graphically described (EP2). In <a onClick="return mV(\'Deu\',24,8);">De 24:8</a> there is a reference to the oral tradition concerning the treatment of lepers, without any details, but in <a onClick="return mV(\'Lev\',13,\'1-\');">Le 13</a>; <a onClick="return mV(\'Lev\',14,\'1-\');">14</a> (Priestly Code) the rules for the recognition of the disease, the preliminary quarantine periods and the ceremonial methods of cleansing are given at length. It is worthy of note that neither here nor elsewhere is there any mention of treatment or remedy; and Jehoram\'s ejaculation implies the belief that its cure could be accomplished only by miracle (<a onClick="return mV(\'2Ki\',5,7);">2Ki 5:7</a>).<P>The case of Naaman (<a onClick="return mV(\'2Ki\',5,1);">2Ki 5:1</a>) shows that lepers were not isolated and excluded from society among the Syrians. The leprosy of Gehazi (<a onClick="return mV(\'2Ki\',5,27);">2Ki 5:27</a>) is said to have been the transference of that of Naaman, but, as the incubation period is long, it must have been miraculously inflicted on him. The four lepers of Samaria of <a onClick="return mV(\'2Ki\',7,3);">2Ki 7:3</a> had been excluded from the city and were outside the gate.<P>The leprous stroke inflicted on Uzziah (<a onClick="return mV(\'2Ki\',15,5);">2Ki 15:5</a>; <a onClick="return mV(\'2Ch\',26,23);">2Ch 26:23</a>) for his unwarrantable assumption of the priestly office began in his forehead, a form of the disease peculiarly unclean (<a onClick="return mV(\'Lev\',13,\'43-46\');">Le 13:43-46</a>) and requiring the banishment and isolation of the leper. It is remarkable that there is no reference to this disease in the prophetical writings, or in the Hagiographa.<P>2. Leprosy in the New Testament:<P>In the New Testament, cleansing of the lepers is mentioned as a specific portion of our Lord\'s work of healing, and was included in the commission given to the apostles. There are few individual cases specially described, only the ten of <a onClick="return mV(\'Luk\',17,12);">Lu 17:12</a>, and the leper whom our Lord touched (<a onClick="return mV(\'Mat\',8,2);">Mt 8:2</a>; <a onClick="return mV(\'Mar\',1,40);">Mr 1:40</a>; <a onClick="return mV(\'Luk\',5,12);">Lu 5:12</a>), but it is probable that these are only a few out of many such incidents. Simon the leper (<a onClick="return mV(\'Mat\',26,6);">Mt 26:6</a>; <a onClick="return mV(\'Mar\',14,3);">Mr 14:3</a>) may have been one of those cured by the Lord.<P>3. Nature and Locality of the Disease:<P>The disease is a zymotic affection produced by a microbe discovered by Hansen in 1871. It is contagious, although not very readily communicated by casual contact; in one form it is attended with anesthesia of the parts affected, and this, which is the commonest variety now met with in the East, is slower in its course than those forms in which nodular growths are the most prominent features, in which parts of the limbs often drop off. At present there are many lepers to be seen at the gates of the cities in Palestine. It is likewise prevalent in other eastern lands, India, China, and Japan. Cases are also to be seen in most of the Mediterranean lands and in Norway, as well as in parts of Africa and the West Indies and in South America. In former times it was occasionally met with in Britain, and in most of the older English cities there were leper houses, often called "lazarets" from the mistaken notion that the eczematous or varicose ulcers of Lazarus were leprous (<a onClick="return mV(\'Luk\',16,20);">Lu 16:20</a>). Between 1096 and 1472, 112 such leper houses were founded in England. Of this disease King Robert Bruce of Scotland died. There was special medieval legislation excluding lepers from churches and forbidding them to wander from district to district. Leprosy has been sometimes confounded with other diseases; indeed the Greek physicians used the name lepra for the scaly skin disease now called psoriasis. In the priestly legislation there was one form of disease (<a onClick="return mV(\'Lev\',13,13);">Le 13:13</a>) in which the whiteness covers all the body, and in this condition the patient was pronounced to be clean. This was probably psoriasis, for leprosy does not, until a very late stage, cover all the body, and when it does so, it is not white. It has been surmised that Naaman\'s disease was of this kind. Freckled spots (Hebrew bohaq), which were to be distinguished from true leprosy (<a onClick="return mV(\'Lev\',13,39);">Le 13:39</a>), were either spots of herpes or of some other non-contagious skin disease. The modern Arabic word of the same sound is the name of a form of eczema. the Revised Version (British and American) reads for freckled spot "tetter," an old English word from a root implying itchiness (see Hamlet, I, v, 71).<P>The homiletic use of leprosy as a type of sin is not Biblical. The only Scriptural reference which might approach this is <a onClick="return mV(\'Psa\',51,7);">Ps 51:7</a>, but this refers to <a onClick="return mV(\'Num\',19,18);">Nu 19:18</a> rather than to the cleansing of the leper. The Fathers regarded leprosy as typical of heresy rather than of moral offenses. (See Rabanus Maurus, Allegoria, under the word "Lepra.")<P>(1) Leprosy in Garments.<P>The occurrence of certain greenish or reddish stains in the substance of woolen or linen fabrics or in articles made of leather is described in <a onClick="return mV(\'Lev\',13,47);">Le 13:47</a>ff, and when these stains spread, or, after washing, do not change their color, they are pronounced to be due to a fretting leprosy (tsara\'ath mam\'ereth), and such garments are to be burnt. As among the fellahin articles of clothing are worn for years and are often hereditary, it is little wonder that they become affected by vegetable as well as animal parasites, and that which is here referred to is probably some form of mildew, such as Penicillium or mold-fungus. The destruction of such garments is a useful sanitary precaution. Possibly this sort of decaying garment was in Job\'s mind when he compares himself to a "rotten thing that consumeth, like a garment that is moth-eaten" (<a onClick="return mV(\'Job\',13,28);">Job 13:28</a>); see also <a onClick="return mV(\'Jud\',1,23);">Jude 1:23</a>, "the garment spotted (espilomenon) by the flesh."<P>(2) Leprosy in the House (<a onClick="return mV(\'Lev\',14,34);">Le 14:34</a>).<P>The occurrence of "hollow streaks, greenish or reddish," in the plaster of a house is regarded as evidence that the wall is affected with leprosy, and when such is observed the occupant first clears his house of furniture, for if the discoloration be pronounced leprous, all in the home would become unclean and must be destroyed. Then he asks the priest to inspect it. The test is first, that the stain is in the substance of the wall, and, second, that it is spreading. In case these conditions are fulfilled, it is pronounced to be leprosy and the affected part of the wall is taken down, its stones cast outside the city, its plaster scraped off and also cast outside the city; new stones are then built in and the house is newly plastered. Should the stain recur in the new wall, then the whole house is condemned and must be destroyed and its materials cast outside the city. The description is that of infection by some fungus attacking whatever organic material is in the mud plaster by which the wall is covered. If in woodwork, it might be the dry rot (Merulius lacrimans), but this is not likely to spread except where there is wood or other organic matter. It might be the efflorescence of mural salt (calcium nitrate), which forms fiocculent masses when decomposing nitrogenous material is in contact with lime; but that is generally white, not green or reddish. Considering the uncleanly condition of the houses of the ordinary fellah, it is little wonder that such fungus growths may develop in their walls, and in such cases destruction of the house and its materials is a sanitary necessity.<P>4. The Legal Attitude:<P>It should be observed here that the attitude of the Law toward the person, garment or house suspected of leprosy is that if the disease be really present they are to be declared unclean and there is no means provided for cure, and in the case of the garment or house, they are to be destroyed. If, on the other hand, the disease be proved to be absent, this freedom from the disease has to be declared by a ceremonial purification. This is in reality not the ritual for cleansing the leper, for the Torah provides none such, but the ritual for declaring him ceremonially free from the suspicion of having the disease. This gives a peculiar and added force to the words, "The lepers are cleansed," as a testimony to our Lord\'s Divine mission.``107';
isbe[5489]='Leshem`le\'-shem.`<a href="./study/isbe/search.html?string=LAISH">LAISH</a>`1';
isbe[5490]='Lessau`les\'-o (Lessaou; the King James Version Dessau): A place mentioned only in 2Macc 14:16 as the scene of a battle between Nicanor and the Jews. "Dessau" of the King James Version arises from confusion of the captical Greek letters, Lambda ("L") with Delta ("D"). The place may be identical with <a href="./study/isbe/search.html?string=ADASA">ADASA</a> (which see).``1';
isbe[5491]='Let`(katecho): Usually in the sense of "permit" (Anglo-Saxon, leetan), but also in Old English with meaning of "hinder" (Anglo-Saxon, lettan). This latter sense is found in <a onClick="return mV(\'2Th\',2,7);">2Th 2:7</a> the King James Version, "Only he who now letteth will let," where the Revised Version (British and American) has, "Only there is one that restraineth now."``1';
isbe[5492]='Lethech`le\'-thek (lethekh): A liquid measure equivalent to half a homer (<a onClick="return mV(\'Hsa\',3,2);">Ho 3:2</a> margin) and containing about 5 1/2 bushels.`<a href="./study/isbe/search.html?string=WEIGHTS+AND+MEASURES">WEIGHTS AND MEASURES</a>`1';

isbe[5495]='Letushim`le-too\'-shim, le-tu\'-shim (letushim): A Dedanite tribe in North Arabia (<a onClick="return mV(\'Gen\',25,3);">Ge 25:3</a>). With it are connected the <a href="./study/isbe/search.html?string=ASSHURIM">ASSHURIM</a> and <a href="./study/isbe/search.html?string=LEUMMIM">LEUMMIM</a> (which see).``1';

isbe[5497]='Levi (1)`le\'-vi (Lewi; Leui; Westcott and Hort, The New Testament in Greek Leuei):<P>(1) The 3rd son of Jacob by Leah. See separate article.<P>(2) (3) Two ancestors of Jesus in Luke\'s genealogy (<a onClick="return mV(\'Luk\',3,24,29);">Lu 3:24,29</a>).<P>(4) The apostle Matthew.`<a href="./study/isbe/search.html?string=MATTHEW">MATTHEW</a>`1';
isbe[5498]='Levi (2)`(Lewi; Leuei): The third of Leah\'s sons born to Jacob in Paddan-aram (<a onClick="return mV(\'Gen\',29,34);">Ge 29:34</a>). In this passage the name is connected with the verb lawah, "to adhere," or "be joined to," Leah expressing assurance that with the birth of this third son, her husband might be drawn closer to her in the bonds of conjugal affection. There is a play upon the name in <a onClick="return mV(\'Num\',18,2,4);">Nu 18:2,4</a>, where direction is given that the tribe of Levi be "joined unto" Aaron in the ministries of the sanctuary. The etymology here suggested is simple and reasonable. The grounds on which some modern scholars reject it are purely conjectural. It is asserted, e.g., that the name is adjectival, not nominal, describing one who attaches himself; and this is used to support theory that the Levites were those who joined the Semitic people when they left Egypt to return to Palestine, who therefore were probably Egyptians. Others think it may be a gentilic form le\'ah, "wild cow" (Wellhausen, Prolegomena, 146; Stade, Stade, Geschichte des Volkes Israel, 152); and this is held to be the more probable, as pointing to early totem worship!<P>Levi shared with Simeon the infamy incurred at Shechem by the treacherous slaughter of the Shechemites (<a onClick="return mV(\'Gen\',34,\'1-\');">Ge 34</a>). Jacob\'s displeasure was expressed at the time (<a onClick="return mV(\'Gen\',34,3);">Ge 34:3</a>), and the memory was still bitter to him in his last days (<a onClick="return mV(\'Gen\',49,5);">Ge 49:5</a>f). The fate predicted for the descendants of Simeon and Levi (<a onClick="return mV(\'Gen\',49,7);">Ge 49:7</a>), in the case of the latter on account of the tribe\'s stedfast loyalty in a period of stern testing, was changed to a blessing (<a onClick="return mV(\'Exd\',32,26);">Ex 32:26</a>). In later literature the action condemned by Jacob is mentioned with approval (Judith 9:2ff). Levi was involved in his brothers\' guilt with regard to Joseph (<a onClick="return mV(\'Gen\',37,\'1-\');">Ge 37</a>), and shared their experiences in Egypt before Joseph made himself known (<a onClick="return mV(\'Gen\',42,\'1-\');">Ge 42</a>; <a onClick="return mV(\'Gen\',43,\'1-\');">43</A>; <a onClick="return mV(\'Gen\',44,\'1-\');">44</a>; <a onClick="return mV(\'Gen\',45,\'1-\');">45</a>). Three sons, Gershon, Kohath, and Merari, were born to him in Canaan, and went down with the caravan to Egypt (<a onClick="return mV(\'Gen\',46,11);">Ge 46:11</a>). Nothing further is known of the personal history of this patriarch. He died and found sepulture in Egypt. For the tribal history and possessions, see <a href="./study/isbe/search.html?string=PRIESTS+AND+LEVITES">PRIESTS AND LEVITES</a>.``54';
isbe[5499]='Leviathan`le-vi\'-a-than (liwyathan (<a onClick="return mV(\'Job\',41,\'1-34\');">Job 41:1-34</a>), from lawah, "to fold"; compare Arabic name of the wry neck, Iynx torquilla, abu-luwa, from kindred lawa, "to bend"):<P>(1) The word "leviathan" also occurs in <a onClick="return mV(\'Isa\',27,1);">Isa 27:1</a>, where it is characterized as "the swift serpent...the crooked serpent"; in <a onClick="return mV(\'Psa\',104,26);">Ps 104:26</a>, where a marine monster is indicated; also in <a onClick="return mV(\'Psa\',74,14);">Ps 74:14</a> and <a onClick="return mV(\'Job\',3,8);">Job 3:8</a>. The description in <a onClick="return mV(\'Job\',41,\'1-\');">Job 41</a> has been thought by some to refer to the whale, but while the whale suits better the expressions denoting great strength, the words apply best on the whole to the crocodile. Moreover, the whale is very seldom found in the Mediterranean, while the crocodile is abundant in the Nile, and has been known to occur in at least one river of Palestine, the Zarqa, north of Jaffa. For a discussion of the behemoth and leviathan as mythical creatures, see EB, under the word "Behemoth" and "Leviathan." The points in the description which may well apply to the crocodile are the great invulnerability, the strong and close scales, the limbs and the teeth. It must be admitted that there are many expressions which a modern scientist would not use with reference to the crocodile, but the Book of Job is neither modern nor scientific, but poetical and ancient.`<a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>`37';
