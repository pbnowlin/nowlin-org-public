rn mV(\'Rom\',6,7);">Ro 6:7</a>). But though in one aspect the believer is dead, in another he is alive. He dies with Christ, but he rises spiritually with Him, and thus spiritually alive he is "to yield," "to present" his "members as instruments of righteousness unto God" (<a onClick="return mV(\'Rom\',6,13);">Ro 6:13</a>), and for his comfort he is assured that in this new sphere of life sin shall not have power to bring him under the condemnation of the Law—"Sin shall not have dominion over you: for ye are not under law, but under grace" (<a onClick="return mV(\'Rom\',6,14);">Ro 6:14</a>). His relationship to the Law has been altered through his union with Christ, and this fact the apostle proceeds to illustrate. He enounces the principle that "the law hath dominion over a man for so long a time as he liveth" (<a onClick="return mV(\'Rom\',7,1);">Ro 7:1</a>). Death dissolves all legal objections. The believer, spiritually dead, is not under the dominion of the Law.<P>(10) Illustrated by the Law of the Husband.<P>The specific case is then given of a married woman bound by law to her husband, but freed from that law through his death, and in the application, he says, "Wherefore, my brethren, ye also were made dead to the law through the body of Christ" (<a onClick="return mV(\'Rom\',7,4);">Ro 7:4</a>). If the Law in this metaphorical description is the husband while the soul is the wife, as has been most generally understood by commentators, then the application is based on the general thought of death dissolving the legal obligation, the death of the husband involves the death of the woman as a wife, and so he can speak of the death of the believer rather than of the death of the Law. Another explanation of the metaphor is that the old sinful state is the husband to which the ego, the personality, was bound by the Law, but that the sinful state being brought to death through Christ, the personality is free to enter into union with Christ. Whatever view is adopted, the leading thought of the apostle is clear, that through the death of Christ the believer is free from the Law: "But now we have been discharged from the law, having died to that wherein we were held" (<a onClick="return mV(\'Rom\',7,6);">Ro 7:6</a>).<P>(11) The Purity and Perfection of the Law in Its Own Sphere.<P>The question is then raised, "Is the law sin?" (<a onClick="return mV(\'Rom\',7,7);">Ro 7:7</a>). The thought is repudiated as unthinkable, but he goes on to show how the law was related to sin, giving from his own experience the exemplification of what he had stated in the 3rd chapter, that by the Law is the knowledge of sin. The Law revealed his sin; the Law aroused the opposition of his nature, and through the working of sin under the prohibition of the Law, he found the tendency to be death. Nevertheless, there is no doubt in his mind that the Law is not responsible for the sin, the Law is not in any manner to be blamed, "The law is holy, and the commandment holy, and righteous, and good" (<a onClick="return mV(\'Rom\',7,12);">Ro 7:12</a>). Sin in the light of the holy Law is shown to be exceeding sinful, and the Law itself is known to be spiritual.<P>We need not deal with the difficult passage that follows concerning the inner conflict. There has always been much discussion as to whether this is a conflict in the soul of the unregenerate man or of the regenerate—we believe it is in the regenerate, setting forth the experience of the believer—but whatever view is taken, it is clear that the law cannot bring deliverance; the higher part of man\'s nature, or the regenerate nature according to the interpretation one adopts, may "consent unto the law that it is good" (<a onClick="return mV(\'Rom\',7,16);">Ro 7:16</a>), may even "delight in the law of God" (<a onClick="return mV(\'Rom\',7,22);">Ro 7:22</a>); but there is another law at work, the law of sin in the members, and the working of this law means captivity and wretchedness from which deliverance can only come through Jesus Christ (<a onClick="return mV(\'Rom\',7,\'23-25\');">Ro 7:23-25</a>). The word "law" in these verses is used in the sense of principle, "the law of my mind," "the law of sin," "the law in my members"; but over against all is the law of God.<P>(12) Freedom from the Penal Claims of the Law.<P>The description of the Law as holy, righteous and good, as spiritual, as the object of delight to a true heart, is enough to show that the deliverance which the Christian enjoys is freedom from the penal claims and condemning power of the Law. This is borne out by the exulting conclusion: "There is therefore now no condemnation to them that are in Christ Jesus" (<a onClick="return mV(\'Rom\',8,1);">Ro 8:1</a>). The Law\'s claims, satisfied by Christ, no longer press upon those who are in Him. When the apostle adds, "For the law of the Spirit of life in Christ Jesus made me free from the law of sin and of death" (<a onClick="return mV(\'Rom\',8,2);">Ro 8:2</a>), he is using "law" in the general sense as a principle or power of producing ordered action, and "the law of the Spirit of life" may be taken to mean the method of the Spirit\'s working, and indeed may well be a way of describing the gospel itself—the new law, through which the Spirit operates. The other phrase, "law of sin and death," is not to be taken as meaning the Law of Moses, but the law, the principle of sin producing death mentioned in the previous chapter, unless we think of it as the holy Law which gives the knowledge of sin and brings the condemnation of death. The failure of the Law to produce a satisfactory result is definitely attributed to the weakness of the flesh, which is in effect reflecting the statement of the previous chapter, but all that the Law could not accomplish is accomplished through the work of Christ. In Christ sin is condemned, and in those who are brought into union with Him the righteousness of the Law is fulfilled.<P>(13) The Law Remains as a Rule of Life for the Believer.<P>Thus, the Law is not abrogated. It remains as the standard of righteousness, the "rule of life" for believers. The utmost holiness to which they can attain under the influence of the Holy Spirit, is still the "righteousness" which the Law requires. That the apostle\'s teaching is far removed from Antinomianism is shown, not only by all that he says in these chapters about the believer\'s new life of absolute spiritual service, but by the specific statement in <a onClick="return mV(\'Rom\',13,\'8-10\');">Ro 13:8-10</a>, which at once prescribes the commandments as rules of life (in <a onClick="return mV(\'Eph\',6,2);">Eph 6:2</a> he cites and enforces the 5th commandment) and shows how true obedience is possible. "Owe no man anything, save to love one another: for he that loveth his neighbor hath fulfilled the law." Then, after specifying several of the commands, he declares that these and all other commands are "summed up in this word, namely, Thou shalt love thy neighbor as thyself." The man in Christ has found the true principle of obedience. He has entered into the true spirit of the holy law. That is all summed up in love, and he having received the love of Christ, living in His love, sees the Law not as a stern taskmaster condemning, but as a bright vision alluring. He indeed sees the Law embodied in Christ, and the imitation of Christ involves obedience to the Law, but he fulfills the Law not simply as a standard outside, but as a living principle within. Acting according to the dictates of the love begotten at the cross, his life is conformed to the image of Christ, and in so far is conformed to the Law—"Love therefore is the fulfillment of the law." In <a onClick="return mV(\'Rom\',13,\'1-7\');">Ro 13:1-7</a>, though the word "law" does not occur, Paul indicates the relation of the Christian to the Roman law, to the sovereignty of Rome in general, showing that "the powers that be are ordained of God" and that in the ideal they are reflections of Divine authority, and as such are to be obeyed.<P>2. In Galatians:<P>In the Epistle to the Galatians, Paul has also a great deal to say about the Law, but as we have dealt so fully with the conception given in Romans, we can only briefly note the teaching of the Galatian Epistle.<P>(1) Law in Relation to Grace and Spiritual Liberty.<P>In general, we may say that as the Law in relation to righteousness was the prominent feature in Romans, in Galatians it is the Law in relation to grace and spiritual liberty, and while it was almost exclusively the moral law that Paul had in view in Romans, in Galatians it is rather the Law of Moses in its entirety, with special emphasis upon the ceremonial. He introduces the subject by referring to the episode at Antioch, when he had to rebuke Peter for his "dissimulation" (<a onClick="return mV(\'Gal\',2,13);">2:13</a>). He shows the inconsistency of those who knew that they had been "justified by faith in Christ, and not by the works of the law" (<a onClick="return mV(\'Gal\',2,16);">2:16</a>), compelling the GentileChristians to live according to the Law, and sums up with the striking statement, "For I through the law died unto the law, that I might live unto God" (<a onClick="return mV(\'Gal\',2,19);">2:19</A>). The Law in revealing his sin and pronouncing condemnation, drove him to Christ for justification. Crucified with Christ he has entered into such vital union with Christ that his whole self-life is dominated by the Christ-life: "It is no longer I that live, but Christ liveth in me" (<a onClick="return mV(\'Gal\',2,20);">2:20</a>). Here we have the same line of thought as in Romans; then Paul goes on to show that all the blessings of grace which these Christians enjoy have come to them not by way of the Law, but "by the hearing of faith" (<a onClick="return mV(\'Gal\',3,\'2-5\');">3:2-5</a>). Again, citing the case of Abraham as an instance of justification by faith, he shows how utterly opposed the Law is to the grace that brings salvation, "For as many as are of the works of the law are under a curse" (<a onClick="return mV(\'Gal\',3,10);">3:10</A>), but in gracious contrast, "Christ redeemed us from the curse of the law" (<a onClick="return mV(\'Gal\',3,13);">3:13</a>), having Himself borne the curse, and so the blessing of Abraham can come upon the Gentiles through faith (<a onClick="return mV(\'Gal\',3,18);">3:18</a>).<P>(2) The Function of the Law Not to Give Life, but to Guide Life<P>As in Romans, he shows that the promise of the inheritance was apart from the Law, was given 430 years before the Law was promulgated, and answers the question as to the purpose of the Law, by saying, "It was added because of transgressions" (<a onClick="return mV(\'Gal\',3,19);">Ga 3:19</a>), the thought already noted in Romans. Yet the Law was not in its nature opposed to the promise. If any law could have given life, "could make alive," then so perfect was the Law of Moses that it would have served the purpose; "Verily, righteousness would have been of the law" (<a onClick="return mV(\'Gal\',3,21);">Ga 3:21</a>). The Law was never meant to give life to those who had it not. "He that doeth them shall live in them" (<a onClick="return mV(\'Gal\',3,12);">Ga 3:12</a>), but the doing implies the possession of life, and the Law only guarantees the continuance of life while it is perfectly obeyed. Law controls life, but cannot confer life. It regulates life, but cannot restore life. It may impel to righteousness, but it cannot impart righteousness.<P>(3) The Law Our Schoolmaster.<P>The Law, he shows, was our schoolmaster, our pedagogue, "to bring us unto Christ" (<a onClick="return mV(\'Gal\',3,24);">Ga 3:24</a>). The Grecian youth was under the charge of a pedagogue during his minority, one part of the pedagogue\'s duty being to take the boy, unwilling enough sometimes, to school. In the sense already shown in Romanans, the moral law by showing us our sinfulness leads us to Christ; but here we may take the Law as a whole, including all the ceremonial and typical observances which were designed to lead the people to Christ.<P>(4) The Bondage of the Law.<P>But while there was undoubtedly much of privilege for the people under the Mosaic dispensation, there was also something of bondage. And so Paul says, "We were kept in ward under the law" (<a onClick="return mV(\'Gal\',3,23);">Ga 3:23</a>), and in the next chapter, he speaks of the child, though heir to a great estate, being "under guardians and stewards until the day appointed of the father" (<a onClick="return mV(\'Gal\',4,2);">Ga 4:2</a>), which seems to be the same thought as under the pedagogue, and this he calls a state of "bondage" (<a onClick="return mV(\'Gal\',4,3);">Ga 4:3</a>). The Law guarded and tutored and restrained; the great typical observances, though foreshadowing the grace of the gospel, were yet, in their details, irksome and burdensome, and the mass of rules as to every part of the Jew\'s conduct proved to be, speaking after the present-day manner, a system of red tape. Little was left to the free, spontaneous action of the spirit; the whole course of the Jew from the cradle to the grave was carefully marked out.<P>(5) Sonship and Its Freedom from the Law\'s Restrictions.<P>But in the fullness of time "God sent forth his Son, born of a woman, born under the law, that he might redeem them that were under the law, that we might receive the adoption of sons" (<a onClick="return mV(\'Gal\',4,4);">Ga 4:4</a>f). The gospel of the grace of God embodied in Christ shows its gracious character in that it not only answers the requirements of the moral law and removes its condemnation; fulfills, and by fulfilling abrogates the typical observer of the ceremonial law, but also abolishes all the directions and restrictions given to the Jews as a separate people, and brings its subjects into a condition of liberty where the renewed spirit under the mighty love of Christ can act spontaneously, the great principles of the moral law remaining as its guide, while the minute rules needed for the infancy of the race are no longer appropriate for the "sons of God, through faith, in Christ Jesus" (<a onClick="return mV(\'Gal\',3,26);">Ga 3:26</a>). And so Paul warns these Christians against turning back to the "weak and beggarly rudiments" and observing "months, and seasons, and years" (<a onClick="return mV(\'Gal\',4,9,10);">Ga 4:9,10</a>).<P>3. In the Other Pauline Epistles:<P>In the remaining Epistles of Paul, little is said of the Law, and we need only indicate the connections in which the word occurs. In <a onClick="return mV(\'1Cr\',7,39);">1Co 7:39</a> there is a reference to the wife being "bound by the law as long as her husband liveth" (the King James Version). The word "law," however, is omitted from the critical texts and from the Revised Version (British and American). In the same epistle (<a onClick="return mV(\'1Cr\',9,8,9);">1Co 9:8,9</a>; <a onClick="return mV(\'1Cr\',14,21,34);">14:21,34</a>) the word is used of the Pentateuch or the Scriptures as a whole. In <a onClick="return mV(\'1Cr\',9,20);">1Co 9:20</a> Paul refers to his practice of seeking to win men to Christ by accommodating himself to their standpoint, "to them that are under the law, as under the law"; and in <a onClick="return mV(\'1Cr\',15,56);">15:56</a> occurs the pregnant statement, an echo of Romans, "The power of sin is the law." In 2 Corinthians the word does not occur, though the legal system is referred to as the ministration of death, in contrast to the gospel ministration of the Spirit (<a onClick="return mV(\'2Cr\',3,\'1-\');">2 Corintians 3</a>). The word "law" is once used in <a onClick="return mV(\'Eph\',2,15);">Eph 2:15</a>, in reference to the work of Christ not only producing harmony between God and man, but between Jew and Gentile: "abolished in his flesh the enmity, even the law of commandments contained in ordinances," also spoken of as "the middle wall of partition," and referring especially to the ceremonial enactments.<P>In <a onClick="return mV(\'Phl\',3,5,6,9);">Php 3:5,6,9</a> we have the fine autobiographical passage wherein we see the self-righteous Pharisee reckoning himself "blameless" in the eye of the Law, until convinced of his sin, and led to find in Christ the righteousness "which is through faith," instead of his own righteousness "which is of the law" (<a onClick="return mV(\'Phl\',3,9);">3:9</a>). The word does not occur in Col, but the thought is found of the spiritual circumcision in contrast to the physical, the blotting out through the work of the cross, of the bond written in ordinances and the consequent deliverance of the believer from the bondage of ceremonial observances (<a onClick="return mV(\'Col\',2,\'11-17\');">2:11-17</a>), those being affirmed to be "a shadow of the things to come," Christ being the glorious substance. In <a onClick="return mV(\'1Ti\',1,8,9);">1Ti 1:8,9</a>, we have the two pregnant statements that "the law is good, if a man use it lawfully," and that "law is not made for a righteous man, but for the lawless."<P>4. In the Epistle to the Hebrews:<P>The word "law" occurs 14 times in this epistle, and a great deal of attention is given to the subject, but it is generally the law in its ceremonial and typical aspect that is in question. It is not necessary to look at the matter in detail, but simply to indicate the line of teaching.<P>(1) Harmony with the Pauline Teaching.<P>The ancient doubt as to the authorship of the epistle seems today to have crystallized into certainty, albeit the grounds for a conclusion are no stronger than formerly, but in the desire to prove the non-Pauline authorship, too much emphasis is perhaps laid upon the supposed un-Pauline character of the teaching. There is, after all, profound harmony between the teaching of the Pauline Epistles and the teaching of He, and the harmony applies to this matter of the Law. While Paul, as we have seen, gives prominence in Romans to the moral law, in Galatians and elsewhere he deals with the ceremonial law, in much the same way, though not so fully, as the writer to the Hebrews. Such utterances as, "Our Passover also hath been sacrificed, even Christ" (<a onClick="return mV(\'1Cr\',5,7);">1Co 5:7</a>); "The rock was Christ"; "Now these things were our examples" (types of us) (<a onClick="return mV(\'1Cr\',10,\'4-6\');">1Co 10:4-6</a>); "Which are a shadow of the things to come; but the body is Christ\'s" (<a onClick="return mV(\'Col\',2,17);">Col 2:17</a>) are exactly in line with the teaching of Hebrews.<P>(2) The Law Transcended by the Gospel.<P>The author shows how the Law, which was a word spoken through angels, is transcended by the gospel, which has been spoken by the Lord of the angels, and so demands greater reverence (<a onClick="return mV(\'Hbr\',2,\'2-4\');">Heb 2:2-4</a>), and all through the epistle it is the transcendent glory of the gospel dispensation introduced by Christ and ascribed to Him, which is made to shine before us.<P>(3) Law of Priesthood.<P>The author deals specifically in <a onClick="return mV(\'Hbr\',7,\'1-\');">Hebrews 7</a> and <a onClick="return mV(\'Hbr\',8,\'1-\');">8</a> with the law of priesthood, showing that Christ\'s Priesthood, "after the order of Melchisedek," surpasses in glory that of the Aaronic priesthood under the law; not only surpasses but supersedes it; the imperfect gives place to the perfect; the shadowy to the real; the earthly to the heavenly; the temporal to the eternal. And as Paul justifies his doctrine of justification apart from the deeds of the Law by reference to the Old Testament teaching, so here the writer finds in the Old Testament prediction of the New Covenant, the basis for all his reasoning, and in his reference to the description of the New Covenant, he is at one with Paul in regard to the moral law, seeing it as now written on the heart, and becoming an internal power, rather than an external precept.<P>See <a href="./study/isbe/search.html?string=NEW+COVENANT">NEW COVENANT</a>.<P>(4) The Law of the Sanctuary and the Sacrifices.<P>He next deals with the law of the sanctuary, and in connection therewith considers the law of the sacrifices (<a onClick="return mV(\'Hbr\',9,\'1-\');">Hebrews 9</a>-<a onClick="return mV(\'Hbr\',10,\'1-\');">10</a>), and in the same way shows that Christ makes good all that the tabernacle and its services typified, that His one, all-perfect eternal sacrifice takes the place of the many imperfect temporary sacrifices offered under the Law. At the best the Law had "a shadow of the good things to come" (<a onClick="return mV(\'Hbr\',10,1);">Heb 10:1</a>). The shadow was useful for the time being, the people were greatly privileged in having it, it directed them to the great Figure who cast the shadow. The whole ceremonial system was really a system of grace at the heart of it; in spite of its external rubrics which might well be abused, it made provision for satisfying for the time the breaches of the law; the sacrifices themselves could not take away sin, but periodical forgiveness was conveyed through them, by virtue of their relation to the Coming One. Now the great sacrifice having been offered, eternal redemption is secured, perfect forgiveness obtained, free access into the heavenly Holy Place assured, and the eternal inheritance provided. The Substance of all the shadows has appeared, the shadows pass away, and the great truth indicated by Christ Himself is now fully made known through His Spirit-taught servants. Christ, who "is the end of the law (the moral law) unto righteousness to every one that believeth" (<a onClick="return mV(\'Rom\',10,4);">Ro 10:4</a>), is also the end of the ceremonial law, the full realization of all its types and shadows.<P>5. In the Epistle of James:<P>James mentions the "law" 10 times in his epistle, and in each case it is the moral law. The influence of the Sermon on the Mount is seen throughout the epistle, and some distinct echoes of it are heard, as e.g. the injunction, "Swear not (at all)" (<a onClick="return mV(\'Jam\',5,12);">5:12</a>). James has nothing but good to say of the Law, and that fact in the light of the influence of the Sermon on the Mount is enough to show that Christ, in that wonderful discourse, did not disparage the Law, far less abrogate it, but rather exalted and reinforced it. James taught by Christ exalts the Law, glorifies it, in fact seems almost to identify it with the gospel, for in <a onClick="return mV(\'Jam\',1,\'1-\');">James 1</a>, when speaking of the Word and the importance of hearing and doing it, he in the same breath speaks of looking into "the perfect law, the law of liberty" (<a onClick="return mV(\'Jam\',1,25);">1:25</a>). And indeed, it is just possible, as some think, that he means the gospel by the epithet, although it seems better to take it as the Law translated in the gospel, the Law looked at in its spirituality, as the guide of the Christian man who has entered into the spirit of it.<P>Even in the Old Testament, as <a onClick="return mV(\'Psa\',19,\'1-\');">Psalms 19</a> and <a onClick="return mV(\'Psa\',119,\'1-\');">119</a> specifically show, it was possible for spiritually-minded men to see the beauty of the Law and find delight in its precepts. In <a onClick="return mV(\'Jam\',2,8);">James 2:8</a> he speaks of the "royal law," and that here he does mean the Mosaic Law is beyond doubt, since he cites the particular requirement, "Thou shalt love thy neighbor as thyself," in this agreeing with his Master and with Paul, finding in love of neighbor the sum of the Law and its true fulfillment. Respect of persons, he affirms, is a breach of this "royal law," and leads to those indulging in it being "convicted" by the law of transgression (<a onClick="return mV(\'Jam\',2,19);">2:9</a>). He then affirms the solidarity of the Law, so that a breach of it in one particular is a breach of the whole, and makes a man "guilty of all" (<a onClick="return mV(\'Jam\',2,10);">2:10</a>), a far-reaching principle which Paul had also indicated when quoting in Galatians the words, "Cursed is every one who continueth not in all things that are written in the book of the law, to do them" (<a onClick="return mV(\'Gal\',3,10);">Ga 3:10</a>), and when in <a onClick="return mV(\'Rom\',7,\'1-\');">Ro 7</a> he showed that the conviction that he had broken the 10th commandment made him realize that he had broken the whole Law. James then exhorts his readers to speak and act as those who are to be judged by "a law of liberty" (<a onClick="return mV(\'Jam\',2,12);">2:12</A>), so that he sets no limit to the range of that law. Finally, in <a onClick="return mV(\'Jam\',4,11);">4:11</a>, he warns them by implication against speaking against the Law or judging the Law, that is, to assume the place of judge instead of "doer of the law." James could not have used such language unless he had a profound conviction of the perfection of the Law. And it is the perfection of the Law as a rule of life for spiritual men redeemed from its condemnation that James considers it, and so we can call it the perfect law, the law of liberty, the Royal Law.<P>6. In the Epistles of Peter and John:<P>In the Epistles of Peter and John, the word "law" does not occur, but Peter shows that the holiness of God remains as in the Pentateuch the standard of life, and the example of Christ shows the way (<a onClick="return mV(\'1Pe\',2,21);">1Pe 2:21</a>), while in the church is found the spiritual realization of the sanctuary, priesthood and sacrifices of the old economy (<a onClick="return mV(\'1Pe\',2,\'5-9\');">1Pe 2:5-9</a>). Peter has one reference to the Roman law, enjoining upon his readers obedience to it in the political sphere. John enjoins the keeping of the commandments, these being apparently the commandments of Christ (<a onClick="return mV(\'1Jo\',2,3,4);">1Joh 2:3,4</a>; <a onClick="return mV(\'1Jo\',5,2);">5:2</a>), and the test of keeping the commandments is love of the brethren, while hatred of a brother is, as in the Sermon on the Mount, murder. All sin is "lawlessness" (<a onClick="return mV(\'1Jo\',3,4);">1Joh 3:4</a>), and the sum of all law-keeping is love of God and love of the brethren, and so the summary of the old Law is echoed and endorsed.<P>LITERATURE.<P>Chiefly the works on New Testament theology (Weiss, Beyschlag, Schmid, etc.), and on Christian ethics (Martensen, Dorner, Harless, etc.), with commentaries on Pauline Epistles (Romans, etc.); Ritschl, Entstehung der altk. Kirche (2nd edition); Zahn, Das Gesetz Gottes nach der Lehre und der Erfahrung des Apostels Paulus; J. Denney, in HDB.``110';
isbe[5449]='Law in the Old Testament`<b>I. TERMS USED</b><P class="in15">1. Torah ("Law")<P class="in15">2. Synonyms of Torah<P class="in30">(1) Mitswah ("Command")<P class="in30">(2) \'Edhah ("Witness," "Testimony")<P class="in30">(3) Mishpatim ("Judgments")<P class="in30">(4) Chuqqim ("Statutes")<P class="in30">(5) Piqqudhim ("Precepts")<P><b>II. THE WRITTEN RECORD OF THE LAW</b><P class="in15">1. The Critical Dating of the Laws<P class="in15">2. Groups of Laws in P (the Priestly Code)<P class="in15">3. The Book of the Covenant<P class="in30">(1) Judgments. Compared with Code of Hammurabi<P class="in30">(2) Basis of Law of Covenant. Earlier Customs<P class="in15">4. The Book of the Law of <a onClick="return mV(\'Deu\',31,\'1-\');">Deuteronomy 31</a><P class="in15">5. The Law of Holiness<P class="in15">6. The Final Compilation<P><b>III. THE GENERAL CHARACTER AND DESIGN OF THE LAW</b><P class="in15">1. The Civil Law<P class="in30">(1) Servants and the Poor<P class="in30">(2) Punishments<P class="in30">(3) Marriage<P class="in30">(4) Sabbaths and Feasts<P class="in15">2. The Ceremonial Law<P class="in30">(1) Origin of Sacrifice<P class="in30">(2) The Levitical Ritual<P class="in30">(3) The Law Truly a Torah<P><b>IV. THE PASSING AWAY OF THE LAW</b><P><b>LITERATURE</b><hr /><P>Law, at least as custom, certainly existed among the Hebrews in the times before Moses, as appears from numerous allusions to it, both in matters civil and ceremonial, in the earlier Scriptures. But we have no distinct account of such law, either as to its full contents or its enactment. Law in the Old Testament practically means the Law promulgated by Moses (having its roots no doubt in this earlier law or custom), with sundry later modifications or additions, rules as to which have been inserted in the record of the Mosaic law.<P>The following are matters of pre-Mosaic law or custom to which allusion is made in Genesis and Exodus: the offering of sacrifice and the use of altars (Genesis, passim); the religious use of pillars (<a onClick="return mV(\'Gen\',28,18);">Ge 28:18</a>); purification for sacrifice (<a onClick="return mV(\'Gen\',35,2);">Ge 35:2</a>); tithes (<a onClick="return mV(\'Gen\',14,20);">Ge 14:20</a>; <a onClick="return mV(\'Gen\',28,22);">28:22</a>); circumcision (<a onClick="return mV(\'Gen\',17,10);">Ge 17:10</a>; <a onClick="return mV(\'Exd\',4,25);">Ex 4:25</a>f); inquiry at a sanctuary (<a onClick="return mV(\'Gen\',25,22);">Ge 25:22</a>); sacred feasts (<a onClick="return mV(\'Exd\',5,1);">Ex 5:1</a>, etc.); priests (<a onClick="return mV(\'Exd\',19,22);">Ex 19:22</a>); sacred oaths (<a onClick="return mV(\'Gen\',14,22);">Ge 14:22</a>); marriage customs (<a onClick="return mV(\'Gen\',16,\'1-\');">Ge 16</a>; <a onClick="return mV(\'Gen\',24,\'1-\');">24</a>; <a onClick="return mV(\'Gen\',25,6);">25:6</a>; <a onClick="return mV(\'Gen\',29,\'16-30\');">29:16-30</a>); birthright (<a onClick="return mV(\'Gen\',25,\'31-34\');">Ge 25:31-34</a>); elders (<a onClick="return mV(\'Gen\',24,2);">Ge 24:2</a>; <a onClick="return mV(\'Gen\',50,7);">50:7</a>; <a onClick="return mV(\'Exd\',3,16);">Ex 3:16</a>); homicide (<a onClick="return mV(\'Gen\',9,6);">Ge 9:6</a>), etc. We proceed at once to the Law of Moses.<P>I. Terms Used.<P>The Hebrew word rendered "law" in our Bibles is torah. Other synonymous words either denote (as indeed does torah itself) aspects under which the Law may be regarded, or different classes of law.<P>1. Torah ("Law"):<P>Torah is from horah, the Hiphil of yarah. The root meaning is "to throw"; hence, in Hiphil the word means "to point out" (as by throwing out the hand), and so "to direct"; and torah is "direction." Torah may be simply "human direction," as the "law of thy mother" in <a onClick="return mV(\'Pro\',1,8);">Pr 1:8</a>; but most often in the Old Testament it is the Divine law. In the singular it often means a law, the plural being used in the same sense; but more frequently torah in the singular is the general body of Divinely given law. The word tells nothing as to the way in which the Law, or any part of it, was first given; it simply points out the general purpose of the Law, namely, that it was for the guidance of God\'s people in the various matters to which it relates. This shows that the end of the Law lay beyond the mere obedience to such and such rules, that end being instruction in the knowledge of God and of men\'s relation to Him, and guidance in living as the children of such a God as He revealed Himself to be. This is dwelt upon in the later Scriptures, notably in <a onClick="return mV(\'Psa\',19,\'1-\');">Ps 19</a> and <a onClick="return mV(\'Psa\',119,\'1-\');">Ps 119</a>.<P>In the completed Canon of the Old Testament, torah technically denotes the Pentateuch (<a onClick="return mV(\'Luk\',24,44);">Lu 24:44</a>) as being that division of the Old Testament Scriptures which contains the text of the Law, and its history down to the death of Moses, the great lawgiver.<P>2. Synonyms of Torah:<P>(1) Mitswah ("Command")<P>Mitswah, "command" (or, in the plural, "commands"), is a term applied to the Law as indicating that it is a charge laid upon men as the expression of God\'s will, and therefore that it must be obeyed.<P>(2) \'Edhah ("Witness," "Testimony")<P>\'Edhah, "witness" or "testimony" (in plural "testimonies"), is a designation of God\'s law as testifying the principles of His dealings with His people. So the ark of the covenant is called the "ark of the testimony" (<a onClick="return mV(\'Exd\',25,22);">Ex 25:22</a>), as containing "the testimony" (<a onClick="return mV(\'Exd\',25,16);">Ex 25:16</a>), i.e. the tables of the Law upon which the covenant was based. The above terms are general, applying to the torah at large; the two next following are of more restricted application.<P>(3) Mishpatim ("Judgments")<P>Mishpatim, "judgments": Mishpat in the singular sometimes means judgment in an abstract sense, as in <a onClick="return mV(\'Gen\',18,19);">Ge 18:19</a>; <a onClick="return mV(\'Deu\',32,4);">De 32:4</a>; sometimes the act of judging, as in <a onClick="return mV(\'Deu\',16,18,19);">De 16:18,19</a>; <a onClick="return mV(\'Deu\',17,9);">17:9</a>; <a onClick="return mV(\'Deu\',24,17);">24:17</a>. But "judgments" (in the plural) is a term constantly used in connection with, and distinction from, statutes, to indicate laws of a particular kind, namely, laws which, though forming part of the torah by virtue of Divine sanction, originated in decisions of judges upon cases brought before them for judgment. See further below.<P>(4) Chuqqim ("Statutes")<P>Chuqqim, "statutes" (literally, "laws engraven"), are laws immediately enacted by a lawgiver. "Judgments and statutes" together comprise the whole law (<a onClick="return mV(\'Lev\',18,4);">Le 18:4</a>; <a onClick="return mV(\'Deu\',4,1,8);">De 4:1,8</a> the King James Version). So also we now distinguish between consuetudinary and statute law.<P>(5) Piqqudhim ("Precepts")<P>Piqqudhim, "precepts": This term is found only in the Psalms. It seems to mean rules or counsels provided to suit the various circumstances in which men may be placed. The term may perhaps be meant to apply both to the rules of the actual torah, and to others found, e.g. in the writings of prophets and "wise men."<P>II. The Written Record of the Law.<P>The enactment of the Law and its committal to writing must be distinguished. With regard to the former, it is distinctly stated (<a onClick="return mV(\'Jhn\',1,17);">Joh 1:17</a>) that "the law was given through Moses"; and though this does not necessarily imply that every regulation found in the Pentateuch is his, a large number of the laws are expressly ascribed to him. As regards the latter, we are distinctly told that Moses wrote certain laws or collections of laws (<a onClick="return mV(\'Exd\',17,14);">Ex 17:14</a>; <a onClick="return mV(\'Exd\',24,4,7);">24:4,7</a>; <a onClick="return mV(\'Deu\',31,9);">De 31:9</a>). These, however, form only a portion of the whole legislation; and therefore, whether the remaining portions were written by Moses, or—if not by him—when and by whom, is a legitimate matter of inquiry.<P>It is not necessary here to discuss the large question of the literary history of the Pentateuch, but it must briefly be touched upon. The Pentateuch certainly appears to have reached its present form by the gradual piecing together of diverse materials. Deuteronomy (D) being a separate composition, a distinction would seem to have been clearly established by critical examination between a number of paragraphs in the remaining books which apparently must once have formed a narrative by themselves, and other paragraphs, partly narrative but chiefly legislative and statistical, which appear to have been subsequently added. Without endorsing any of the critical theories as to the relation of these, one to the other, or as to the dates of their composition, we may, in a general way, accept the analysis, and adopt the well-known symbol JE (Jahwist-Elohim) to distinguish the former, and P (Priestly Code) the latter. Confining ourselves to their legislative contents, we find in JE a short but very important body of law, the Law of the Covenant, stated in full in <a onClick="return mV(\'Exd\',20,\'1-\');">Ex 20-23</a>, and repeated as to a portion of it in <a onClick="return mV(\'Exd\',34,\'10-28\');">Ex 34:10-28</a>. All the rest of the legislation is contained in P and Deuteronomy.<P>1. The Critical Dating of the Laws:<P>We are distinctly told in Exodus that the law contained in <a onClick="return mV(\'Exd\',20,\'1-\');">Ex 20-23</a> was given through Moses. Rejecting this statement, critics of the school of Wellhausen affirm that its true date must be placed considerably later than the time of Joshua. They maintain that previous to their conquest of Canaan the Israelites were mere nomads, ignorant of agriculture, the practice of which, as well as their culture in general, they first learned from the conquered Canaanites. Therefore (so they argue), as the law of <a onClick="return mV(\'Exd\',20,\'1-\');">Ex 20-23</a> presupposes the practice of agriculture, it cannot have been promulgated until some time in the period of the Judges at the earliest; they place it indeed in the early period of the monarchy. All this, however, is mere assumption, support for which is claimed in some passages in which a shepherd life is spoken of, but with utter disregard of others which show that both in the patriarchal period and in Egypt the Israelites also cultivated land. See B.D. Eerdmans, "Have the Hebrews Been Nomads?" The Expositor, August and October, 1908. It can indeed be shown that this law was throughout in harmony with what must have been the customs and conceptions of the Israelites at the age of the exodus (Rule, Old Testament Institutions). Professor Eerdmans in his Alttestamentliche Studien, Part III (1910), vigorously defends the Mosaic origin of the Book of the Covenant.<P>The same critics bring down the date of the legislation of Deuteronomy to the time of Josiah, or at most a few years earlier. They affirm (wrongly) that the chief object of Josiah\'s reformation narrated in <a onClick="return mV(\'2Ki\',23,\'1-\');">2Ki 23</a> was the centralization of worship at the temple in Jerusalem. They rightly attribute the zeal which carried the reform through to the discovery of the "Book of the Law" (<a onClick="return mV(\'2Ki\',22,8);">22:8</A>). Then arguing that the frequent previous practice of worship at high places implied the non-existence of any law to the contrary, they conclude that the rule of <a onClick="return mV(\'Deu\',12,\'1-\');">De 12</a> was a rule recently laid down by the temple priesthood, and written in a book in Moses\' name, this new book being what was "found in the house of Yahweh." But this argument is altogether unsound: its grave difficulties are well set out in Moller\'s Are the Critics Right? And here again careful study vindicates the Mosaic character of the law of Deuteronomy as a whole and of <a onClick="return mV(\'Deu\',12,\'1-\');">De 12</a> in particular. M. Edouard Naville in La decouverte de la loi sous le roi Josias propounds a theory which he supports by a most interesting argument: that the book found was a foundation deposit, which must therefore have been built over by masonry at the erection of the temple by Solomon.<P>Equally unsound, however plausible, are the arguments which would make the framing of the Levitical ritual the work of the age of Ezra. The difficulties created by this theory are far greater than those which it is intended to remove. On this also see Moller, Are the Critics Right?<P>Rejecting these theories, it will be assumed in the present article that the various laws are of the dates ascribed to them in the Pentateuch; that whatever may be said as to the date of some "of the laws," all which are therein ascribed to Moses are truly so ascribed.<P>2. Groups of Laws in P (the Priestly Code):<P>The laws in P are arranged for the most part in groups, with which narrative is sometimes intermingled. These e.g. are some of the groups: <a onClick="return mV(\'Exd\',25,\'1-\');">Ex 25-31</a>; <a onClick="return mV(\'Lev\',1,\'1-\');">Le 1-7</a>; <a onClick="return mV(\'Lev\',11,\'1-\');">11-15</a>; <a onClick="return mV(\'Num\',1,\'1-\');">Nu 1-4</a>, etc. The structure and probable history of these groups are very interesting. That many of them must have undergone interpolation appears certain from the following considerations. Each of the groups, and often one or more paragraphs within a group, is headed by a recurring formula, "Yahweh spake unto Moses (or unto Aaron, or unto Moses and Aaron), saying." We might at first expect that the contents of each group or paragraph so headed would consist solely of what Yahweh had said unto Moses or Aaron, but this is not always so. Not infrequently some direction is found within such a paragraph which cannot have been spoken to Moses, but must have come into force at some later date. Unless then we reject the statement of the formula, unless we are prepared to say that Yahweh did not speak unto Moses, we can only conclude that these later directions were at some time inserted by an editor into paragraphs which originally contained Mosaic laws only. That this should have been done would be perfectly natural, when we consider that the purpose of such an editor would be not only to preserve (as has been done) the record of the original Law, but to present a manual of law complete for the use of his age, a manual (to use a modern phrase) made complete to date.<P>That the passages in question were indeed interpolations appears not only from the fact that their removal rids the text of what otherwise would be grave discrepancies, but because the passages in question sometimes disturb the sequence of the context. Moreover, by thus distinguishing between laws promulgated (as stated) by Moses, and laws to which the formula of statement was not intended to apply, we arrive at the following important result. It is that the former laws can all be shown to be in harmony one with another and with the historical data of the Mosaic age; while the introduction of the later rules is also seen to be what would naturally follow by way of adaptation to the circumstances of later times, and the gradual unfolding of Divine purpose.<P>It would be much too long a task here to work this out in detail: it has been attempted by the writer of this article in Old Testament Institutions, Their Origin and Development. Two instances, however, may be mentioned.<P>Instances of interpolation—In <a onClick="return mV(\'Exd\',12,43);">Ex 12:43</a>ff (English Revised Version) we read, "This is the ordinance of the passover: there shall no alien eat thereof; but every man\'s servant that is bought for money, when thou hast circumcised him, then shall he eat thereof. A sojourner and a hired servant shall not eat thereof." This was the original Mosaic rule introduced by the formula in <a onClick="return mV(\'Exd\',12,43);">12:43</A>. But in <a onClick="return mV(\'Exd\',12,48,49);">12:48,49</A> it is said that sojourners (when circumcised) may eat of the passover. This was plainly a relaxation of later date, made in accordance with the principle which is enlarged upon in <a onClick="return mV(\'Isa\',56,\'3-8\');">Isa 56:3-8</a>.<P>According to <a onClick="return mV(\'Lev\',23,34,\'39-42\');">Le 23:34,39a,40-42</a>, the Feast of Tabernacles was a feast of seven days only. This was the Mosaic rule as appears from the formula in <a onClick="return mV(\'Lev\',23,33);">23:33</a>, and in certain other passages. But as a development in the feast\'s observance, an eighth day was subsequently added, and therefore insertions to that effect were made here at <a onClick="return mV(\'Lev\',23,36);">23:36</A> and <a onClick="return mV(\'Lev\',23,39);">39b</A>. The introduction of this additional day would be in keeping with that elaboration in the observance of the "set feasts" which we find in <a onClick="return mV(\'Num\',28,\'1-\');">Nu 28</a> and <a onClick="return mV(\'Num\',29,\'1-\');">29</a>, as compared with the simpler observance of the same days ordered in <a onClick="return mV(\'Lev\',23,\'1-\');">Le 23</a>. Here again the formula in <a onClick="return mV(\'Num\',28,1);">Nu 28:1</a> plainly covered a few verses immediately following, but not the whole content of the two chapters.<P>Premising then the existence in writing from an early age of numerous groups of Mosaic laws and their subsequent interpolation, the ultimate compilation of these groups together with other matter and their arrangement in the order in which we now find them must have been the work, perhaps indeed of the interpolator, but in any case of some late editor. These numerous groups do not, however, make up the whole legislative contents of the Pentateuch; for a very large portion of these contents consists of three distinct books of law, which we must now examine. These were the "Book of the Covenant," the "Book of the Law" of <a onClick="return mV(\'Deu\',31,26);">De 31:26</a>, and the so-called "Law of Holiness."<P>3. The Book of the Covenant:<P>This book, expressly so named (<a onClick="return mV(\'Exd\',24,7);">Ex 24:7</a>), is stated to have been written by Moses (<a onClick="return mV(\'Exd\',24,3,4);">24:3,4</a>). It must have comprised the contents of <a onClick="return mV(\'Exd\',20,\'1-\');">Ex 20-23</a>. The making of the covenant at Sinai, led up to by the revealing words of <a onClick="return mV(\'Exd\',3,\'12-17\');">Ex 3:12-17</a>; <a onClick="return mV(\'Exd\',6,\'2-8\');">6:2-8</a>; <a onClick="return mV(\'Exd\',19,\'3-6\');">19:3-6</a>, was a transaction of the very first importance in the religious history of Israel. God\'s revelation of Himself to Israel being very largely, indeed chiefly, a revelation of His moral attributes (<a onClick="return mV(\'Exd\',34,6,7);">Ex 34:6,7</a>), could only be effectively apprehended by a people who were morally fitted to receive it. Hence, it was that Israel as a nation was now placed by God in a stated relation to Himself by means of a covenant, the condition upon which the covenant was based being, on His people\'s part, their obedience to a given law. This was the law contained in the "Book of the Covenant."<P>It consisted of "words of Yahweh" and "Judgments" (<a onClick="return mV(\'Exd\',24,3);">Ex 24:3</a> the King James Version). The latter are contained in <a onClick="return mV(\'Exd\',21,1);">Ex 21:1</A>-<a onClick="return mV(\'Exd\',22,\'1-17\');">22:17</a>; the former in <a onClick="return mV(\'Exd\',20,\'1-\');">Exodus 20</a>, in the remaining portion of <a onClick="return mV(\'Exd\',22,\'1-\');">Exodus 22</a>, and <a onClick="return mV(\'Exd\',23,\'1-\');">Exodus 23</a>. The "judgments" (the American Standard Revised Version "ordinances") relate entirely to matters of right between man and man; the "words of Yahweh" relate partly to these and partly to duties distinctively religious.<P>(1) Judgments. Compared with Code of Hammurabi.<P>The "judgments" appear to be taken from older consuetudinary law; not necessarily comprising the whole of that law, but so much of it as it pleased God now to stamp with His express sanction and to embody in this Covenant Law. They may well be compared with those contained in the so-called Code of Hammurabi, king of Babylon, who is thought to have been the Amraphel of <a onClick="return mV(\'Gen\',14,\'1-\');">Ge 14</a>. These are called "the judgments of righteousness which Hammurabi the mighty king confirmed." The resemblances in form and in subject between the two sets of "judgments" are very striking. All alike have the same structure, beginning with a hypothetical clause, "if so and so," and then giving the rule applicable in the third person. All alike relate entirely to civil, as distinguished from religious, matters, to rights and duties between man and man. All seem to have had a similar origin in judgments passed in the first place on causes brought before judges for decision: both sets therefore represent consuetudinary law.<P>(2) Basis of Law of Covenant. Earlier Customs.<P>It is remarkable that, alike in matters of right between man and man, and in matters relating directly to the service of God, the Law of the Covenant did little (if anything) more than give a new and Divinely attested sanction to requirements which, being already familiar, appealed to the general conscience of the community. If, indeed, in the "words of Yahweh" there was any tightening of accustomed moral or (more particularly) religious requirements, e.g. in the first and second commandments of the Decalogue, it would seem to have been by way of enforcing convictions which must have been already gaining hold upon the minds of at least the more thoughtful of the people, and that in large measure through the lessons impressed upon them by the events of their recent history. In no other Way could the Law of the Covenant have appealed to their conscience, and so formed a foundation on which the covenant could be securely based.<P>As in the "judgments" we have a ratification of old consuetudinary law; as again in the second table of the Decalogue we have moral rules in accordance with a standard of moral right—no doubt already acknowledged—very similar indeed to that of the "negative confession" in the Egyptian Book of the Dead; so in the more especially religious rules of the Law of the Covenant we find, not new rules or an establishment of new institutions, but a new sanction of what was already old. These "words of Yahweh" assume the rendering of service to Yahweh: they do not enjoin it as if it were a new thing, but they enjoin that the Israelites shall not add to His service also the service of other gods (<a onClick="return mV(\'Exd\',20,3);">Ex 20:3</a>; <a onClick="return mV(\'Exd\',23,24);">23:24</a>). They assume the observance of the three "feasts," they enjoin that these shall be kept to Yahweh—"unto me," i.e. "unto me only" (<a onClick="return mV(\'Exd\',23,14,17);">Ex 23:14,17</a>). They assume the making of certain offerings to Yahweh, they enjoin that these shall be made liberally—"of the first," i.e. of the best—and without delay (<a onClick="return mV(\'Exd\',22,29);">Ex 22:29</a>f). They assume the rendering of worship by sacrifice, and the existence of an accustomed ritual, and therefore they do not lay down any scheme of ritual, but they give a few directions designed to guard against idolatry, or any practices tending either to irreverence or to low and false conceptions of God (<a onClick="return mV(\'Exd\',20,\'4-6\');">Ex 20:4-6</a>,<a onClick="return mV(\'Exd\',20,\'23-26\');">23-26</a>; <a onClick="return mV(\'Exd\',22,31);">22:31</a>; <a onClick="return mV(\'Exd\',23,18);">23:18</a>f). While insisting upon the observance of the three "feasts," spoken of as already accustomed, it is remarkable that they contain no command to keep the Passover, which as an annual observance was not yet an accustomed thing.<P>This absence of ritual directions is indeed very noticeable. It was in the counsel of God that He would in the near future establish a reconstituted ritual, based upon what was already traditional, but containing certain new elements, and so framed as more and more to foster spiritual conceptions of God and a higher ideal of holiness. This however was as yet a thing of the future. No mention therefore was made of it in the Law of the Covenant; that law was so restricted as that it should at once appeal to the general conscience of the people, and so be a true test of their desire to do what was right. This would be the firm basis on which to build yet higher things. It is impossible to estimate the true character of the subsequent legislation, i.e. of what in bulk is by far the larger part of the torah—except by first grasping the true character and motive of the Covenant, and the Covenant Law.<P>See also <a href="./study/isbe/search.html?string=COVENANT,+BOOK+OF+THE">COVENANT, BOOK OF THE</a>; <a href="./study/isbe/search.html?string=PENTATEUCH">PENTATEUCH</a>.<P>4. The Book of the Law of <a onClick="return mV(\'Deu\',31,\'1-\');">Deuteronomy 31</a>:<P>Immediately after the making of the Covenant, Moses was called up into the mount, and there received instructions for the erection of the tabernacle, these being followed in due course by the rules of the reconstituted ceremonial of which the tabernacle was to be the home. All these for the present we must pass over.<P>Having arrived on the east of the Jordan, Moses, now at the close of his career, addressed discourses to the people, in which he earnestly exhorted them to live up to the high calling with which God had called them, in the land of which they were about to take possession. To this end he embodied in his discourse a statement of the Law by which they were to live. And then, as almost his last public act, he wrote "the words of this law in a book," and directed that the book should be placed "by the side of the ark of the covenant" (<a onClick="return mV(\'Deu\',31,\'24-26\');">De 31:24-26</a>). What now was this book? Was it Deuteronomy, in whole or in part? The most reasonable answer to this question is that the book actually written by Moses comprised at least the contents of <a onClick="return mV(\'Deu\',5,\'1-\');">De 5-26</a> and <a onClick="return mV(\'Deu\',28,\'1-\');">28</a>. Whether the whole or any parts of the remaining contents of Deuteronomy also formed part of this book, or were subsequently added to it, the whole being brought by a process of editing to our present Deuteronomy, is again a legitimate matter of inquiry.<P>Characteristics of Deuteronomy.<P>Regarding <a onClick="return mV(\'Deu\',5,\'1-\');">De 5-26</a> and <a onClick="return mV(\'Deu\',28,\'1-\');">28</a> (with or without parts of other chapters) as the "book" of <a onClick="return mV(\'Deu\',31,\'24-26\');">De 31:24-26</a>, we find that it is a manual of instruction for the people at large—it is not a priest\'s manual. It deals with matters of morals, and of religion in its general principles, but only subordinately with matters of ritual: it warns against perils of idolatry and superstitious corruptions, common in the service of other gods, but which might by no means be mixed up with Yahweh\'s seryice: it insists upon righteous conduct between man and man, and very strongly inculcates humanity toward the poor and the dependent: it enjoins upon those in authority the impartial maintenance of right, as also fairness, moderation and mercy, in the administration of law and the infliction of punishment: it sets forth the fear of God as the guide of His people\'s actions, and the love of God in response to His mercy toward them. It does not lay down any scheme of ritual, though it gives rules (<a onClick="return mV(\'Deu\',4,\'3-21\');">De 4:3-21</a>) as to things which might not be eaten as unclean; it also gives directions as to the disposal of tithes (<a onClick="return mV(\'Deu\',14,\'22-29\');">De 14:22-29</a>; <a onClick="return mV(\'Deu\',26,12);">26:12</a>); it enlarges upon the direction in the Law of the Covenant for the observance of the three "feasts," adding to this the observance of the Passover (<a onClick="return mV(\'Deu\',16,\'1-\');">De 16</a>); it lays down a law (expressed conditionally) restricting to one sanctuary the offering of at least the more solemn sacrifices (<a onClick="return mV(\'Deu\',12,\'1-\');">De 12</a>); and it frequently inculcates liberality toward the Levites, both on account of the sacred services rendered by them, their dispersal among the tribes, and the precarious character of their livelihood. Like the Law of the Covenant it assumes the existence of an accustomed ceremonial, and it is remarkable that when there is occasion to do so it makes use of phraseology (<a onClick="return mV(\'Deu\',12,\'1-\');">De 12</a>) similar to that of the ritual laws of Moses in Leviticus and Numbers.<P>It is quite possible that some interpolations may have been made in the text of <a onClick="return mV(\'Deu\',5,\'1-\');">Deuteronomy 5-26</a>, but not on any sufficient scale to affect the general character of the original book. This "Book of the Law" then was an expansion of the Law of the Covenant, enforcing its principles, giving directions in greater detail for carrying them out, and setting them in a framework of exhortation, warning and encouragement. Thus, its relation to the covenant is indicated by <a onClick="return mV(\'Deu\',26,\'16-19\');">De 26:16-19</a>; <a onClick="return mV(\'Deu\',29,1);">29:1</a>. This is that "book of the Law of Moses" of which frequent mention is made in the Books of Kings, Chronicles, Ezra and Nehemiah.<P>5. The Law of Holiness:<P>In marked contrast to the numerous rules, sometimes intermingled with narrative, which we find in <a onClick="return mV(\'Exd\',25,\'1-\');">Ex 25-40</a>; <a onClick="return mV(\'Lev\',1,\'1-\');">Le 1-16</a>, and throughout Numbers, we have in <a onClick="return mV(\'Lev\',17,\'1-\');">Le 17-26</a> a collection of laws which evidently was once a book by itself. This, from its constant insistence upon holiness as a motive of conduct, has been called "the Law of Holiness." Though it contains many laws stated to have been spoken by Yahweh to Moses, we are not told by whom it was written, and therefore its authorship and date are a fair subject of inquiry. In its general design it bears much resemblance to the Law of the Covenant, and the Book of the Law contained in Deuteronomy. As in them, and especially in the latter, the laws are set up in a parenetic framework, the whole closing with promise of reward for obedience and a threat of punishment for disobedience (compare <a onClick="return mV(\'Exd\',23,\'20-33\');">Ex 23:20-33</a>; <a onClick="return mV(\'Lev\',26,\'1-\');">Le 26</a>; <a onClick="return mV(\'Deu\',28,\'1-\');">De 28</a>). Like them it deals much with moral duties: <a onClick="return mV(\'Lev\',19,\'1-\');">Le 19</a> and <a onClick="return mV(\'Lev\',20,\'1-\');">20</a> are practically an expansion of the Decalogue; but it deals also more than they do with ceremonial. With regard to both it sets forth as the motive of obedience the rule, "Be ye holy, for I am holy."<P>A Clue as to Date<P>A clue to its date is to be found in its conception of cleanness. The idea found in the Prophets and the New Testament that moral wrongdoing renders unclean must be based upon some earlier conception, namely, upon the Old Testament conception of ritual uncleanness. Now ritual uncleanness was originally physical uncleanness only; the idea of moral right or wrong did not enter into it at all: this is perfectly clear from the whole contents of <a onClick="return mV(\'Lev\',11,\'1-\');">Le 11-15</a>. On the other hand we find the idea of moral cleanness and uncleanness fully formed in the Psalms, Proverbs, and in the Prophets, including the earlier prophets, Amos, Hosea, and Isaiah. In H (the Law of Holiness, <a onClick="return mV(\'Lev\',17,\'1-\');">Le 17-26</a>) we find an intermediate conception. We find that whereas in <a onClick="return mV(\'Lev\',11,\'1-\');">Le 11-15</a> sexual acts which were lawful rendered unclean equally with those which were unlawful, in H, adultery and incest are denounced as rendering specially unclean, the idea being that their technical uncleanness became more intensely unclean through their immorality (<a onClick="return mV(\'Lev\',18,\'24-30\');">Le 18:24-30</a>). Similarly, converse with familiar spirits and wizards, which probably involved physical defilement (perhaps through the ingredients used in charms), is mentioned as specially causing defilement, probably as such technical defilement would be intensified by the unlawfulness of dealing with familiar spirits and wizards at all (<a onClick="return mV(\'Lev\',19,31);">Le 19:31</a>). Sins, however, which did not in themselves entail physical uncleanness, such e.g. as injustice, are not mentioned in H as rendering unclean, though they are so regarded in the Prophets. First, then, we have ritual uncleanness, which is physical only in the rules of <a onClick="return mV(\'Lev\',11,\'1-\');">Le 11-15</a> (Mosaic rules undoubtedly embodying a pre-Mosaic conception); lastly, we have moral wrong in itself rendering unclean, in the Psalms and the Prophets; intermediately we have the transitional conception in H. The date therefore of the Law of Holiness may be Mosaic, but must be considerably earlier than the earliest of the writing prophets.<P>6. The Final Compilation:<P>The remaining groups of Mosaic laws would appear to have been extant in their original form (i.e. without interpolation), no doubt in the custody of the priesthood for probably a very considerable time, it may have been for centuries, before their final compilation in their present form. The arrangement of these groups as they now stand, before and after H and with narrative intermingled, is by no means haphazard, as it might at first appear.<P>(1) Exodus.<P>As the directions for the erection of the tabernacle with the purpose of its several parts were given to Moses immediately after the making of the covenant, they follow the account of it immediately. Thus Exodus contains the history of the covenant-making, of what led up to it, and of what immediately followed it, namely, the provision of the home for the covenant-worship.<P>(2) Leviticus.<P>This book follows with the rules of that worship; not indeed with all its details, but with an account of all that was essential to it. First (in <a onClick="return mV(\'Lev\',1,\'1-\');">Le 1-7</a>) we have the law of sacrifice, including what was so especially peculiar to the covenant-worship, the law of the sin offering. Then in <a onClick="return mV(\'Lev\',8,\'1-\');">Le 8-10</a> we have the consecration of the tabernacle and its contents, the consecration of its priests and the inauguration of the newly prescribed system of worship. Then in <a onClick="return mV(\'Lev\',11,\'1-\');">Le 11-15</a> we have the rules for purification from ritual uncleanness, without which it would have been impossible for this system of covenant-worship to be carried on. Then there follows in <a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a> the account of the ceremonies of the Day of Atonement, the crown and completion of the whole. Thus in these 16 chapters we have an account of the essentials of the newly instituted covenant-worship. And then immediately we have in the Law of Holiness the great motive that underlay both this ceremonial law and the preceding moral and religious law of the Book of the Covenant, namely, the principle that God\'s people must be holy, because He is holy. The emphasizing of this principle in H thus closes this whole statement of law, as its first enunciation had introduced it in <a onClick="return mV(\'Exd\',19,6);">Ex 19:6</a>.<P>(3) Numbers.<P>The purpose of Numbers is supplementary. <a onClick="return mV(\'Num\',1,\'1-\');">Nu 1-6</a>, containing the numbering and ordering of the tribes and rules as to the representative Levitical ministry, sets forth the corporate character of Israel\'s service of God. The Israelites were not to be a mere aggregation of tribes, but a single nation, the bond of their union being the covenant with God. The camp itself, ordered and carefully guarded against pollution, was to be a symbol of this holy unity. <a onClick="return mV(\'Num\',7,\'1-\');">Num 7-10</a> narrate the remaining occurrences at Sinai, including (<a onClick="return mV(\'Num\',9,\'1-14\');">9:1-14</A>) the important account of the first commemorative Passover. The remaining chapters contain, alternately, a narrative of events following the departure from Sinai and groups of laws usually in some way connected with the events narrated, but all of them supplementary to the more essential laws already recorded.<P>(4) Deuteronomy.<P>As a separate work and based upon sayings and doings at the very close of the 40 years, Deuteronomy naturally follows last.<P>III. The General Character and Design of the Law. Both in civil matters and in ceremonial the Law had to deal with men who lived in a comparatively early age of human history. Its rules were necessarily adapted in both departments to the standards of the age. At the same time they inculcated principles, the working out of which would by degrees bring about a great advance in men\'s conceptions both of what is true and of what is right.<P>1. The Civil Law:<P>As J.B. Mozley says (Lectures on the Old Testament), "The morality of a progressive revelation is not the morality with which it starts but that with which it concludes"; yet the excellence of the Old Testament Law is evident, not only in its great underlying principles, but in the suitability of its individual rules to promote moral advance.<P>(1) Servants and the Poor.<P>We have already noted the similarity between the "judgments" of <a onClick="return mV(\'Exd\',20,\'1-\');">Ex 20</a> and <a onClick="return mV(\'Exd\',21,\'1-\');">21</a> and the "judgments" of Hammurabi, in respect to form and subject. Notwithstanding the practical wisdom found in many of the latter, there is in one matter a marked contrast in spirit between them and the former, for while both the Law of the Covenant and its enlargement in Deuteronomy guarded the interest of and secured justice, and mercy too, to slaves and the poor, the laws of Hammurabi were framed rather in the interests of the well-to-do. Compare (e.g.) with the rule as to a runaway slave in <a onClick="return mV(\'Deu\',23,15);">De 23:15</a>f; the following (Code of Hammurabi, section symbol 16): "If a man has harbored in his house a manservant or a maidservant fugitive from the palace, or a poor man, and has not produced them at the demand of the commandant, the owner of that house shall be put to death." The Law indeed permitted slavery, an institution universal in the ancient world, but it made provisions which must very greatly have mitigated its hardship. It was enjoined, both in Exodus and in Deuteronomy, that after six years\' service a Hebrew manservant should "go out free for nothing," unless he himself preferred to remain in servitude (<a onClick="return mV(\'Exd\',21,\'2-6\');">Ex 21:2-6</a>; <a onClick="return mV(\'Deu\',15,\'12-18\');">De 15:12-18</a>). The rule in <a onClick="return mV(\'Exd\',21,\'7-11\');">Ex 21:7-11</a> as to women servants was not exactly the same, but it nevertheless guarded their interests, while Hebrew women servants were afterward included in the rule of <a onClick="return mV(\'Deu\',15,12);">De 15:12</a>. A still greater amelioration was brought in by a later rule connected with the law of the Jubilee as set out in <a onClick="return mV(\'Lev\',25,\'39-55\');">Le 25:39-55</a>. Again, though servitude was permitted on account of debt, or as a rescue from poverty (<a onClick="return mV(\'Exd\',21,2,7);">Ex 21:2,7</a>; <a onClick="return mV(\'Deu\',15,12);">De 15:12</a>), manstealing was a capital offense (<a onClick="return mV(\'Exd\',21,16);">Ex 21:16</a>).<P>(2) Punishments.<P>The rule of <a onClick="return mV(\'Exd\',21,\'22-25\');">Ex 21:22-25</a> ("eye for eye," etc.; compare <a onClick="return mV(\'Lev\',24,19,20);">Le 24:19,20</a>; <a onClick="return mV(\'Deu\',19,\'16-19\');">De 19:16-19</a>) sounds harsh to us, but while the justice it sanctioned was rough and ready according to the age, it put a restraint on vindictiveness. The punishment might be so much, but no more: and the same spirit of restraint in punishment is seen in the rule as to flogging (<a onClick="return mV(\'Deu\',25,2);">De 25:2</a>f). Similarly the rule that murder was to be avenged by "the avenger of blood," a rule under the circumstances of the age both necessary and salutary, was protected from abuse by the appointment of places of refuge, the rule with respect to which was designed to prepare the way for a better system (see <a onClick="return mV(\'Exd\',21,\'12-14\');">Ex 21:12-14</a>; <a onClick="return mV(\'Num\',35,\'9-24\');">Nu 35:9-24</a>; <a onClick="return mV(\'Deu\',19,\'1-13\');">De 19:1-13</a>).<P>(3) Marriage.<P>The marriage customs of the Mosaic age permitted polygamy and concubinage, marriage by purchase or by capture in war, slave-marriage, and divorce. The Law allowed the continuance of these customs, but did not originate them; on the contrary, its provisions were designed to restrict the old license, giving protection to the weaker party, the woman, limiting as far as possible the evils of the traditional system, a system which could not suddenly be changed, and preparing the way for a better. Consider the effect of the following rules: as to slave-wives (<a onClick="return mV(\'Exd\',21,\'7-11\');">Ex 21:7-11</a>); captives of war (<a onClick="return mV(\'Deu\',21,\'10-14\');">De 21:10-14</a>); plurality of wives (<a onClick="return mV(\'Deu\',21,\'15-17\');">De 21:15-17</a>); adultery (<a onClick="return mV(\'Exd\',20,14,17);">Ex 20:14,17</a>; <a onClick="return mV(\'Deu\',22,22);">De 22:22</a>); fornication (<a onClick="return mV(\'Deu\',22,\'23-29\');">De 22:23-29</a>; <a onClick="return mV(\'Deu\',23,17,18);">23:17,18</a>; <a onClick="return mV(\'Lev\',21,19);">Le 21:19</a>); divorce (<a onClick="return mV(\'Deu\',24,\'1-4\');">De 24:1-4</a>); Levirate marriage (<a onClick="return mV(\'Deu\',25,\'5-10\');">De 25:5-10</a>); incest (<a onClick="return mV(\'Lev\',18,\'6-18\');">Le 18:6-18</a>); marriage of priests (<a onClick="return mV(\'Lev\',21,7,\'10-15\');">Le 21:7,10-15</a>); royal polygamy (<a onClick="return mV(\'Deu\',17,17);">De 17:17</a>).<P>(4) Sabbaths and Feasts.<P>The law as to these, though partly ceremonial, yet served social ends. The Sabbath day gave to all, and particularly to servants and the poor, and domestic cattle too, a needful respite from daily toil; it also served men\'s spiritual welfare, and did honor to God (<a onClick="return mV(\'Exd\',23,12);">Ex 23:12</a>; <a onClick="return mV(\'Deu\',5,14,15);">De 5:14,15</a>; <a onClick="return mV(\'Exd\',31,\'12-17\');">Ex 31:12-17</a>). The seventh year\'s rest to the land—it also "a sabbath of solemn rest, a sabbath unto Yahweh"—was for the land\'s recuperation, but it served also to safeguard common rights at perhaps a time of transition as to customs of land tenure: connected with it also there were rules as to release of slaves and relief of debtors (<a onClick="return mV(\'Exd\',23,\'9-11\');">Ex 23:9-11</a>; <a onClick="return mV(\'Lev\',25,\'2-7\');">Le 25:2-7</a>; <a onClick="return mV(\'Deu\',15,\'1-18\');">De 15:1-18</a>). The observance of the Sabbath year as a rest to the land seems to have fallen into disuse, perhaps as early as some 500 years before the Babylonian captivity (<a onClick="return mV(\'2Ch\',36,21);">2Ch 36:21</a>), and it is probable that the Jubilee (the design of which seems to have been to adjust conflicting rights under new customs of land tenure and in the relation of employer to employed) was instituted to take its place (<a onClick="return mV(\'Lev\',25,\'1-\');">Le 25</a>). The law as to the annual feasts insured both the social advantages of festive gatherings of the people, and their sanctification by the worship of God, and the public recognition of His hand in matters agricultural and political, which were either the occasion of, or connected with, these gatherings. Considerate liberality to the poor and dependent was, on these occasions, especially enjoined (<a onClick="return mV(\'Exd\',23,\'14-17\');">Ex 23:14-17</a>; <a onClick="return mV(\'Deu\',16,\'1-17\');">De 16:1-17</a>; <a onClick="return mV(\'Deu\',12,12,18,19);">12:12,18,19</a>).<P>2. The Ceremonial Law:<P>We have already noted that the conception of sin as uncleanness, rendering the sinner therefore unfit for the presence of God, must have been an outgrowth from the earlier conception of purely ritual (physical) uncleanness. This development, and an accompanying sense of the heinousness of sin and of its need of atonement by sacrifice, were undoubtedly brought about by the gradual working of the law of the sin offering (<a onClick="return mV(\'Lev\',4,\'1-\');">Le 4:1</a>-<a onClick="return mV(\'Lev\',5\'1-13\');">5:13</a>; <a onClick="return mV(\'Lev\',12,\'1-\');">12-15</A>; <a onClick="return mV(\'Lev\',16,\'1-\');">16</a>). Similarly the rules as to guilt offerings (<a onClick="return mV(\'Lev\',5,\'14-\');">Le 5:14</a>-<a onClick="return mV(\'Lev\',6,\'1-7\');">6:7</a>) must by degrees have led to a true conception of repentance, as including both the seeking of atonement through sacrifice and restitution for wrong committed. The sin offering was, however, a peculiarly Mosaic institution, marking a development in the sacrificial system. The only sacrifices of which we have any trace in pre-Mosaic times were meal and drink offerings, whole burnt offerings and sacrifices (or, to use the Levitical term, peace offerings).<P>(1) Origin of Sacrifice.<P>We read of the offering of sacrifice all through the patriarchal history, and farther back even than Noah in the story of Cain and Abel; and there can be no doubt that the Levitical scheme of sacrifice was based upon, and a development (under Divine ordering) of, the sacrificial system already traditional among the Hebrews. Sacrifice was undoubtedly of Divine origin; yet we have no account, or even hint, of any formal institution of sacrifice. The sacrifices of Cain and Abel are spoken of in a way that leaves the impression that they were offered spontaneously, and the most probable assumption would seem to be that the very first offering of sacrifice was the outcome of a spontaneous desire (Divinely implanted, we may be sure) in early men to render service to the higher Being of whose relation to themselves they were, if ever so dimly, conscious.<P>Prehistoric research has not yet been able to present to us a distinct picture of primitive men; and even if the results of anthropology were more certain than they can yet claim to be, what in this connection we are concerned in is the conceptions, not of early men everywhere, but of the early ancestors of the Hob race. However infantile their ideas may have been and probably were, there may well have been far more of elementary truth in them—in simple ideas Divinely implanted—than students of anthropology have any knowledge of. Sooner or later early men did make offerings to God; and as the Mosaic sacrificial system was certainly based upon the patriarchal, so we may fairly assume that the ideas underlying the latter were an outgrowth from those which underlay the sacrifice of the patriarch\'s own still earlier ancestors.<P>It is well observed by Dr. A.B. Davidson (Old Testament Theology, p. 315) that the sacrifices of Cain and Abel are called a minchah or present; and this idea of sacrifice as a gift to God most easily accounts for the facts with which we have to deal in the history of Old Testament sacrifice. When early men first made offerings to God, they probably did so in the spirit of young children who give gifts to older persons without knowing whether, or in what way, the gifts will be of any use to them. They simply give in affection what is of value in their own eyes. The one only thing of prime value to the earliest men must have been food; hence, offerings to God were everywhere in the first place offerings of food. But here a difficulty must soon have arisen, for men must have become convinced very soon that the Divine Being did not feed upon the food offered, at least in men\'s way of feeding. Ultimately, among the Israelites, the idea of His actual feeding became eliminated altogether (<a onClick="return mV(\'Psa\',50,13,14);">Ps 50:13,14</a>), but in the meantime the difficulty seems to have been met by the assumption that the Divine Being consumed an inner essence of food; and this being supposed to be set free by fire, food offered in sacrifice came to be burnt in order to fit it to become the food of God. This certainly appears from <a onClick="return mV(\'Lev\',3,11,16);">Le 3:11,16</a> (compare <a onClick="return mV(\'Lev\',21,6,8,17,21);">Le 21:6,8,17,21</a>).<P>Coming, however, to animal as distinguished from vegetable sacrifice, we do not find that its origin can be accounted for as at the first being an offering of food. We learn from <a onClick="return mV(\'Lev\',17,\'10-14\');">Le 17:10-14</a> that the essential part of animal sacrifice was the offering of the blood, and that blood was offered because blood was life. The idea that life can be given by giving blood lay at the root of a custom which must have been well-nigh universal in primitive times, that of blood covenanting (see H. Clay Trumbull, Blood Covenant). In this, two persons would give each to the other of his own blood, drawn from the living vein. Persons united in blood covenant were supposed, by the commingling of their blood, to become actual sharers of one life. To give to another of one\'s own blood was to give one\'s own life, i.e. one\'s own self, with all the dedication of love and service which that would imply. Now a similar idea would seem to have lain at the root of the primitive offering of blood to God: it was the offering of the life of the offerer.<P>In the very first blood offerings it is probable that the blood offered was the blood of the offerer, and that there was no infliction of death—only in this way the dedication of life. The dedicatory rite of circumcision may have been a survival of sacrifice in this its earliest form; so also what is narrated in <a onClick="return mV(\'1Ki\',18,28);">1Ki 18:28</a>. When, however, the blood offered had come to be the blood of a substitute, and that a substitute animal, the sacrifice would come (no doubt soon) to include the slaughter of the animal and further the consumption, in whole or in part, of its carcass by fire as an offering of food.<P>(2) The Levitical Ritual.<P>Whether the above theory be accepted or not, in so far as animal sacrifice became an offering of food, it would stand in line with vegetable sacrifice; but in both the excellence of the Levitical ritual stood in this, that while it was framed for a people whose conceptions were in a stage of transition, it was yet adaptable to higher conceptions, and fitted to become at length symbolical of purely spiritual truth. It was through the teaching, not only of prophets but of the Lcvitical ritual itself, and while it was still in full force, that the words of <a onClick="return mV(\'Psa\',50,13,14);">Ps 50:13,14</a> were uttered: "Will I eat the flesh of bulls, or drink the blood of goats? Offer unto God the sacrifice of thanksgiving; and pay thy vows unto the Most High." The Levitical ritual, as respects animal sacrifice in particular, was so framed as, on the one hand, to keep alive the idea of sacrifice as the offering of life, not of death, of
