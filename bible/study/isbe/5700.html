isbe[5787]='Manslayer`man\'-sla-er (meratstseach, from ratsach (<a onClick="return mV(\'Num\',35,6,12);">Nu 35:6,12</a>); androphonos (<a onClick="return mV(\'1Ti\',1,9);">1Ti 1:9</a>)): A term employed with reference to both premeditated and accidental or justifiable killing. In the latter case, an asylum was granted (<a onClick="return mV(\'Num\',35,6,12);">Nu 35:6,12</a>) until the death of the high priest, after which the slayer was allowed to "return into the land of his possession" (<a onClick="return mV(\'Num\',35,28);">Nu 35:28</a>). The cases in which the manslayer was to be held clearly immune from the punishment imposed on willful killing were:<P>(1) death by a blow in a sudden quarrel (<a onClick="return mV(\'Num\',35,22);">Nu 35:22</a>);<P>(2) death by anything thrown at random (<a onClick="return mV(\'Num\',35,22,23);">Nu 35:22,23</a>);<P>(3) death by the blade of an axe flying from the handle (<a onClick="return mV(\'Deu\',19,5);">De 19:5</a>).<P>Among the cases in which one would be held responsible for the death of another, is to be counted the neglectful act of building a house without a parapet (<a onClick="return mV(\'Deu\',22,8);">De 22:8</a>).<P>Manslaughter, as a modern legal term, is employed to distinguish unpremeditated killing from coldblooded murder, but formerly (2Esdras 1:26) it was used in a more general sense.`<a href="./study/isbe/search.html?string=MURDER">MURDER</a>`77';
isbe[5788]='Manstealing`man\'-stel-ing.`<a href="./study/isbe/search.html?string=PUNISHMENT">PUNISHMENT</a>`1';
isbe[5789]='Mantelet`man\'-tel-et, man\'-t\'-l-et, mant\'-let (<a onClick="return mV(\'Nah\',2,5);">Na 2:5</a>).`<a href="./study/isbe/search.html?string=SIEGE">SIEGE</a>`1';
isbe[5790]='Mantle`man\'-t\'-l: Used 5 times of Elijah\'s mantle (\'addereth, <a onClick="return mV(\'1Ki\',19,18,19);">1Ki 19:18,19</a>; <a onClick="return mV(\'2Ki\',2,8,13,18);">2Ki 2:8,13,14</a>), which was probably of hair. Found in plural once (<a onClick="return mV(\'Isa\',3,22);">Isa 3:22</a>), where it (ma\'ataphoth) is an upper wide tunic with sleeves (kethoneth).`<a href="./study/isbe/search.html?string=DRESS">DRESS</a>; <a href="./study/isbe/search.html?string=KERCHIEF">KERCHIEF</a>`1';
isbe[5791]='Manuscripts`man\'-u-skripts: In the broadest sense manuscripts include all handwritten records as distinguished from printed records. In a narrower sense they are handwritten codices, rolls and folded documents, as distinguished from printed books on the one hand and inscriptions, or engraved documents, on the other. More loosely, but commonly, the term is used as synonym of the codex.<P>The Hebrew and Greek manuscripts of the Old Testament and New Testament, respectively, form the primary sources for establishing the text or true original words of the respective authors. The subordinate sources, versions and quotations have also their text problem, and manuscripts of the versions and of the church Fathers, and other ancient writers who refer to Biblical matters, play the same part in establishing the true words of the version or the writer that the Hebrew and Greek manuscripts play in establishing the original of Scripture. For discussion of the textual aspects, see the articles on <a href="./study/isbe/search.html?string=TEXT+AND+MANUSCRIPTS+OF+THE+NEW+TESTAMENT">TEXT AND MANUSCRIPTS OF THE NEW TESTAMENT</a>; <a href="./study/isbe/search.html?string=TEXT+OF+THE+OLD+TESTAMENT">TEXT OF THE OLD TESTAMENT</a>, on <a href="./study/isbe/search.html?string=VERSIONS">VERSIONS</a>, and especially the <a href="./study/isbe/search.html?string=SEPTUAGINT">SEPTUAGINT</a>. For the material, writing instruments, form of manuscripts, etc., see <a href="./study/isbe/search.html?string=BOOK">BOOK</a>; and especially the literature under <a href="./study/isbe/search.html?string=WRITING">WRITING</a>.``147';
isbe[5792]='Manuscripts of the New Testament``<a href="./study/isbe/search.html?string=TEXT+AND+MANUSCRIPTS+OF+THE+NEW+TESTAMENT">TEXT AND MANUSCRIPTS OF THE NEW TESTAMENT</a>`1';
isbe[5793]='Manuscripts of the Old Testament``<a href="./study/isbe/search.html?string=LANGUAGES+OF+THE+OLD+TESTAMENT">LANGUAGES OF THE OLD TESTAMENT</a>`1';
isbe[5794]='Maoch`ma\'-ok (ma\'okh, "oppressed," "bruised"): The same as Maacah (<a onClick="return mV(\'1Ki\',2,39);">1Ki 2:39</a>). The father of that Achish, king of Gath, with whom David and his 600 sojourned under fear of Saul\'s treachery (<a onClick="return mV(\'1Sa\',27,2);">1Sa 27:2</a>).``1';
isbe[5795]='Maon; Maonites`ma\'-on, ma\'-on-its, ma-o\'-nits (ma\'on; Septuagint: Codex Vaticanus Maor, Maan; Codex Alexandrinus Maon):<P>(1) A town in the mountain of Judah named along with Carmel and Ziph (<a onClick="return mV(\'Jos\',15,55);">Jos 15:55</a>). It appears again as the home of Nabal, the great flockmaster (<a onClick="return mV(\'1Sa\',25,2);">1Sa 25:2</a>). In the genealogical list of <a onClick="return mV(\'1Ch\',2,\'1-\');">1Ch 2</a>, Maon stands as the "son" of Shammai and the "father" of Beth-zur (<a onClick="return mV(\'1Ch\',2,44,45);">2:44,45</A>). This evidently means that Shammai was the founder of Maon. About a mile south of el-Karmil, the ancient Carmel, lies Tell Ma\'in. This may be confidently identified with Maon, the radicals of the names being the same. It suits the requirements of the narratives in other respects, being near to Carmel, while the surrounding wilderness is still used as the wide pasture land for multitudinous flocks. In this district, the wilderness of Maon, David was hiding when his whereabouts was betrayed to Saul by the men of Ziph (<a onClick="return mV(\'1Sa\',23,24);">1Sa 23:24</a>f), and only a timely raid by the Philistines delivered him out of that monarch\'s hands (<a onClick="return mV(\'1Sa\',23,27);">1Sa 23:27</a>).<P>(2) (Madiam): Maon is named along with the Zidonians and Amalek as having at some time, not mentioned, oppressed Israel (<a onClick="return mV(\'Jdg\',10,12);">Jud 10:12</a>). The Septuagint "Midian" has been accepted by some scholars as restoring the original text, since, otherwise, the Midianites remain unmentioned. But the Maonites are evidently identical with the Meunim of <a onClick="return mV(\'1Ch\',4,41);">1Ch 4:41</a> (Revised Version), the pastoral people destroyed by Hezekiah. In <a onClick="return mV(\'2Ch\',20,1);">2Ch 20:1</a> the King James Version, instead of "other beside the Ammonites" we must read "some of the Meunim," as associated with the Ammonites in the battle with Jehoshaphat. Against them also Uzziah was helped of God (<a onClick="return mV(\'2Ch\',26,7);">2Ch 26:7</a>). They are included among the inhabitants of Mt. Seir (<a onClick="return mV(\'2Ch\',20,10,23);">2Ch 20:10,23</a>), so that an Edomite tribe is intended. It is natural to connect them with Ma\'an, a place on the great pilgrimage road, and now a station on the Damascus-Hejaz Railway, to the southeast of Petra. It undoubtedly represents an ancient stronghold.<P>The Maonites appear in the lists of those who returned from exile (<a onClick="return mV(\'Ezr\',2,50);">Ezr 2:50</a>, the King James Version "Mehunim," the Revised Version (British and American) "Meunim"; <a onClick="return mV(\'Neh\',7,52);">Ne 7:52</a>, "Meunim"). These may possibly be the descendants of prisoners taken in the wars of Jehoshaphat and Uzziah, to whom menial tasks may have been appointed in the temple services.``54';
isbe[5796]='Mar`mar: "To mar" means "to destroy," "to disfigure," "to damage." <a onClick="return mV(\'Job\',30,13);">Job 30:13</a>, "They mar my path" (the Revised Version margin "they break up"); <a onClick="return mV(\'Nah\',2,2);">Na 2:2</a>, "and destroyed their vine" (the King James Version "and marred their vine"); compare <a onClick="return mV(\'Lev\',19,27);">Le 19:27</a>; <a onClick="return mV(\'2Ki\',3,19);">2Ki 3:19</a>; <a onClick="return mV(\'Isa\',52,14);">Isa 52:14</a>; <a onClick="return mV(\'Jer\',13,9);">Jer 13:9</a>.``1';
isbe[5797]='Mara`ma\'-ra, mar\'-a (marah, "bitter"): The term which Naomi applies to herself on her return from Moab to her native country (<a onClick="return mV(\'Rth\',1,20);">Ru 1:20</a>). Changed beyond recognition, she creates astonishment among her former acquaintances, who ask, "Is this Naomi?" She replies, "Call me not Naomi" (i.e. "pleasant" or "sweet"), but "call me Mara" (i.e. "bitter"). In the light of her bitter experience, and her present pitiable plight, the old name has become peculiarly inappropriate.``1';
isbe[5798]='Marah`ma\'-ra, mar\'-a (marah, "bitter"): The first camp of the Israelites after the passage of the Red Sea (<a onClick="return mV(\'Exd\',15,23);">Ex 15:23</a>; <a onClick="return mV(\'Num\',33,8);">Nu 33:8</a>f). The name is derived from the bitterness of the brackish water. Moses cast a tree into the waters which were thus made sweet (<a onClick="return mV(\'Exd\',15,23);">Ex 15:23</a>).`<a href="./study/isbe/search.html?string=WANDERINGS+OF+ISRAEL">WANDERINGS OF ISRAEL</a>`1';
isbe[5799]='Maralah`mar\'-a-la (mar\'alah; Septuagint: Codex Vaticanus Maragelda; Codex Alexandrinus Marila): A place on the western border of Zebulun (<a onClick="return mV(\'Jos\',19,11);">Jos 19:11</a>). Peshitta renders Ramath ta\'le\', "height of the fox." It is not identified.``1';
isbe[5800]='Maranatha`mar-a-nath\'-a, mar-an-a\'-tha (from Aramaic words, marana\' \'athah, "Our Lord cometh, or will come"; according to some, "has come"; to others, "Come!" an invitation for his speedy reappearance (compare <a onClick="return mV(\'Rev\',22,20);">Re 22:20</a>); maranatha, or maran atha): Used in connection with anathema, "accursed" (<a onClick="return mV(\'1Cr\',16,22);">1Co 16:22</a>), but has no necessary connection therewith. It was used by early Christians to add solemn emphasis to previous statement, injunction or adjuration, and seems to have become a sort of watchword; possibly forming part of an early liturgy.``1';
