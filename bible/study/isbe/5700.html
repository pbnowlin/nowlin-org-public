 5:19-24</a>). He has reference to that sinful nature in man which is as old as the individual, as old as the race of which he is a member, which must be graciously renovated according to that gospel which he preached to Corinthians, Colossians, Ephesians, Romans and all the world.<P>See <a href="./study/isbe/search.html?string=OLD+MAN">OLD MAN</a>; <a href="./study/isbe/search.html?string=MAN">MAN, I, 3</a>.<P>2. The Outward Man:<P>The apostle also establishes a contrast between "the inward man" and "the outward man." "Though our outward man is decaying, yet our inward man is renewed day by day" (<a onClick="return mV(\'2Cr\',4,16);">2Co 4:16</a>). Now what sort of man is the "outward man" as contrasted with the "inward man"? In Greek, the exo-anthropos is set over against the eso-anthropos.<P>See <a href="./study/isbe/search.html?string=OUTWARD+MAN">OUTWARD MAN</a>.<P>"The contrast here drawn between the \'outward\' and the \'inward man,\' though illustrated by the contrast in <a onClick="return mV(\'Rom\',7,22);">Ro 7:22</a> between the \'law in the members\' and \'the inner man,\' and in <a onClick="return mV(\'Eph\',4,22);">Eph 4:22</a>; <a onClick="return mV(\'Col\',3,9);">Col 3:9</a> between \'the old man\' and \'the new man\' is not precisely the same. Those contrasts relate to the difference between the sensual and the moral nature, \'the flesh\' and \'the spirit\'; this to the difference between the material and the spiritual nature" (Stanley, in the place cited.).<P>"The outward man" is the body, and "the inward man" is the soul, or immaterial principle in the human make-up. As the body is wasted by the afflictions of life, the soul is renewed; what is death to the body is life to the soul; as afflictions depotentiate man\'s physical organism, they impotentiate man\'s spiritual principle. That is, the afflictions of life, culminating in death itself, have diametrically opposite effects upon the body and upon the soul. They kill the one; they quicken the other.<P>"The inward man" is the whole human nature as renewed and indwelt and dominated by the Spirit of God as interpenetrated by the spirit of grace. As the one is broken down by the adverse dispensations of life, the other is upbuilt by the sanctifying discipline of the Spirit.<P>3. The Carnal Man:<P>There is another Pauline antithesis which it is necessary for us to interpret in order to understand what he means by the "natural man." It is the distinction which he draws between the "carnal mind" and the "spiritual mind." The critical reference is <a onClick="return mV(\'Rom\',8,\'1-14\');">Ro 8:1-14</a>. In this place the "carnal mind" is identified with the "law of death," and the "spiritual mind" is identified with the "law of the Spirit." These two "laws" are two principles and codes: the one makes man to be at "enmity against God" and leads to "death"; the other makes him the friend of God, and conducts to "life and peace." The word "carnal" connotes all that is fallen and sinful and unregenerate in man\'s nature. In its gross sense the "carnal" signifies that which is contrary to nature, or nature expressing itself in low and bestial forms of sin.<P>4. The Natural Man:<P>The "natural man" is the "old man," the "outward man," the "carnal man"—man as he is by nature, as he is firstborn, contra-distinguished to man as he is changed by the Spirit, as he is second-born or regenerated. There. is an "old" life, an "outward" life, a "carnal" life, a "natural" life, as contrasted with the "new" life, the "inward" life, the "spiritual" life, the "gracious" life. The "natural man" is a bold and vivid personification of that depraved nature which we inherit from Adam fallen, the source and seat of all actual and personal transgressions.<P>II. Theological Meaning.<P>We know what we mean by the nature of the lion, by the nature of the lamb. We are using perfectly comprehensible language when we speak of the lion as naturally fierce, and of the lamb when we say he is naturally gentle. We have reference to the dominant dispositions of these animals, that resultant of their qualities which defines their character and spontaneity. So we are perfectly plain when we say that man is naturally sinful. We are but saying that sinfulness is to man what fierceness is to the lion, what gentleness is to the lamb. The "natural man" is a figure of speech for that sinful human nature, common to us all. It is equivalent to the theological phrases: the "sinful inclination," the "evil disposition," the "apostate will," "original sin," "native depravity." It manifests itself in the understanding as blindness, in the heart as hardness, in the will as obstinacy.`<a href="./study/isbe/search.html?string=MAN">MAN</a>`188';
isbe[5755]='Man, Old``<a href="./study/isbe/search.html?string=MAN">MAN</a>; <a href="./study/isbe/search.html?string=OLD+MAN">OLD MAN</a>`1';
isbe[5756]='Man, Outward``<a href="./study/isbe/search.html?string=MAN,+NATURAL">MAN, NATURAL</a>; <a href="./study/isbe/search.html?string=OUTWARD+MAN">OUTWARD MAN</a>`1';
isbe[5757]='Man, Son of``<a href="./study/isbe/search.html?string=SON+OF+MAN">SON OF MAN</a>`1';
isbe[5758]='Man-Child`man\'-child (American Standard Revised Version; "man child," the English Revised Version; not in the King James Version; mashtin beqir): The expression is used with the meaning of "male," but is found only in the description of the extermination of a whole family, where it is employed to express every male descendant of any age. It occurs in <a onClick="return mV(\'1Sa\',25,22,34);">1Sa 25:22,34</a>; <a onClick="return mV(\'1Ki\',14,10);">1Ki 14:10</a>; <a onClick="return mV(\'1Ki\',16,11);">16:11</a>; <a onClick="return mV(\'1Ki\',21,21);">21:21</a>; <a onClick="return mV(\'2Ki\',9,8);">2Ki 9:8</a>.``1';
isbe[5759]='Man; New`(neos anthropos or kainos anthropos): Generally described, the "new man" is man as he becomes under the transforming power of the Holy Spirit, contrasted with man as he is by nature. The phrase has (1) its Biblical, and (2) its theological, meanings.<P>I. Biblical Meaning.<P>There are four Biblical contrasts which must be considered as opposites:<P>(1) the "old man" (palaios anthropos) and the "new man" (neos anthropos or kainos anthropos);<P>(2) the "outward man" (exoanthropos) and the "inward man" (esoanthropos);<P>(3) the "carnal man" (sarkikos anthropos) and the "spiritual man" (pneumatikos anthropos);<P>(4) the "natural man" (psuchikos anthropos) and the "spiritual man" (pneunatikos anthropos).<P>These are not four different sorts of men, but four different sorts of man. Take up these antitheses in their reverse order, so as to arrive at some clear and impressive conception of what the Biblical writer means by the "new man."<P>1. The Spiritual Man:<P>The "spiritual man" is a designation given in opposition to the "carnal man" and to the "natural man" (<a onClick="return mV(\'Rom\',8,\'1-14\');">Ro 8:1-14</a>; <a onClick="return mV(\'1Cr\',2,15);">1Co 2:15</a>; <a onClick="return mV(\'1Cr\',3,1,3,4);">3:1,3,4</a>; <a onClick="return mV(\'1Cr\',2,14);">2:14</a>; <a onClick="return mV(\'1Cr\',3,11);">3:11</a>; <a onClick="return mV(\'1Cr\',14,37);">14:37</a>; <a onClick="return mV(\'1Cr\',15,46);">15:46</a>; <a onClick="return mV(\'Gal\',6,1);">Ga 6:1</a>; <a onClick="return mV(\'Eph\',2,3);">Eph 2:3</a>). All three of these terms are personifications of human nature. The "carnal man" is human nature viewed as ruled and dominated by sensual appetites and fleshly desires—as energized by those impulses which have close association with the bodily affections. The "natural man" is human nature ruled and dominated by unsanctified reason—those higher powers of the soul not yet influenced by Divine grace. The "spiritual man" is this same human nature after it has been seized upon and interpenetrated and determined by the Holy Spirit. The word "spiritual" is sometimes used in a poetic and idealistic sense, as when we speak of the spirituality of beauty; sometimes in a metaphysical sense, as when we speak of the spirituality of the soul; but in its prevalent Biblical and evangelical sense it is an adjective with the Holy Spirit as its noun-form. The spiritual life is that life of which the Holy Spirit is the author and preserver; and the "spiritual man" is that nature or character in man which the Holy Spirit originates, preserves, determines, disciplines, sanctifies and glorifies.<P>2. The Inward Man:<P>The "inward man" is a designation of human nature viewed as internally and centrally regenerated, as contrasted with the "outward man" (<a onClick="return mV(\'2Cr\',4,16);">2Co 4:16</a>; <a onClick="return mV(\'Rom\',7,22);">Ro 7:22</a>; <a onClick="return mV(\'Eph\',3,16);">Eph 3:16</a>). See <a href="./study/isbe/search.html?string=MAN,+OUTWARD">MAN, OUTWARD</a>. This phrase indicates the whole human nature conceived as affected from within—in the secret, inside, and true springs of activity—by the Holy Spirit of God. Such a change—regeneration—is not superficial, but a change in the inner central self; not a mere external reformation, but an internal transformation. Grace operates not from the circumference toward the center, but from the center toward the circumference, of life. The product is a man renovated in his "inward parts," changed in the dynamic center of his heart.<P>3. The New Man:<P>The "new man" is an appellation yielded by the contrasted idea of the "old man" (<a onClick="return mV(\'Rom\',6,6);">Ro 6:6</a>; <a onClick="return mV(\'Eph\',4,22);">Eph 4:22</a>; <a onClick="return mV(\'Col\',3,9);">Col 3:9</a>; <a onClick="return mV(\'Eph\',2,15);">Eph 2:15</a>; <a onClick="return mV(\'Eph\',4,24);">4:24</a>; <a onClick="return mV(\'Col\',3,10);">Col 3:10</a>). The "old" is "corrupt" and expresses itself in evil "deeds"; the "new" possesses the "image of God" and is marked by "knowledge," "righteousness," and "holiness." There are two Greek words for "new"—neos and kainos. The former means new in the sense of young, as the new-born child is a young thing; the latter means "new" in the sense of renovated, as when the house which has been rebuilt is called a new house. The converted man is "new" (neo-anthropos) in the sense that he is a "babe in Christ," and "new" (kaino-anthropos) in the sense that his moral nature is renovated and built over again.<P>In the New Testament there are 5 different verbs used to express the action put forth in making the "old man" a "new man."<P>(1) In <a onClick="return mV(\'Eph\',2,10);">Eph 2:10</a> and <a onClick="return mV(\'Eph\',4,24);">4:24</A>, he is said to be "created" (ktizo), and in <a onClick="return mV(\'2Cr\',5,17);">2Co 5:17</a> the product is called a "new creature" (kaine kisis), a renovated creature. Out of the "old man" the Holy Spirit has created the "new man."<P>(2) In <a onClick="return mV(\'1Pe\',1,3,13);">1Pe 1:3,13</a> and elsewhere, he is said to be "begotten again" (anagennao), and the product is a "babe in Christ" (<a onClick="return mV(\'1Cr\',3,1);">1Co 3:1</a>). The "old man" thus becomes the "new man" by a spiritual begetting: his paternity is assigned to the Holy Ghost.<P>(3) In <a onClick="return mV(\'Eph\',2,5);">Eph 2:5</a> and elsewhere, he is said to be \'quickened\' (zoopoieo), and the product is represented as a creature which has been made "alive from the dead" (<a onClick="return mV(\'Rom\',6,13);">Ro 6:13</a>). The "old man," being \'dead in trespasses and sins\' (<a onClick="return mV(\'Eph\',2,1);">Eph 2:1</a>), is brought forth from his sin-grave by a spiritual resurrection.<P>(4) In <a onClick="return mV(\'Eph\',4,23);">Eph 4:23</a> he is represented as being made "young" (ananeoo), and the product is a child of the Spirit at the commencement of his religious experience. The "old man," dating his history back to the fall in Eden, has become, through the Spirit, a young man in Christ Jesus.<P>(5) In <a onClick="return mV(\'2Cr\',4,16);">2Co 4:16</a> and in <a onClick="return mV(\'Rom\',12,2);">Ro 12:2</a>, he is said to be \'renovated\' (anakainoo). The "old man" is renovated into the "new man." Sinful human nature is taken by the Spirit and morally recast.<P>II. Theological Meaning.<P>The "new man" is the converted, regenerated man. The phrase has its significance for the great theological doctrine of regeneration as it expands into the broad work of sanctification. Is the sinner dead? Regeneration is a new life. Is holiness non-existent in him? Regeneration is a new creation. Is he born in sin? Regeneration is a new birth. Is he determined by his fallen, depraved nature? Regeneration is a spiritual determination. Is he the subject of carnal appetites? Regeneration is a holy appetency. Is he thought of as the old sinful man? Regeneration is a new man. Is the sinful mind blind? Regeneration is a new understanding. Is the heart stony? Regeneration is a heart of flesh. Is the conscience seared? Regeneration is a good conscience. Is the will impotent? Regeneration is a new impotentiation. The regenerated man is a man with a new governing disposition—a "new man," an "inward man," a "spiritual man."<P>(1) The "New Man"—the Regenerate Man—Is Not a Theological Transubstantiation:<P>A being whose substance has been supernaturally converted into some other sort of substance.<P>(2) He Is Not a Scientific Transmutation:<P>A species of one kind which has been naturally evolved into a species of another kind.<P>(3) He Is Not a Metaphysical Reconstruction:<P>Being with a new mental equipment.<P>(4) He Is an Evangelical Convert:<P>An "old man" with a new regnant moral disposition, an "outward man" with a new inward fons et origo of moral life; a "natural man" with a new renovated spiritual heart.`<a href="./study/isbe/search.html?string=MAN,+NATURAL">MAN, NATURAL</a>; <a href="./study/isbe/search.html?string=REGENERATION">REGENERATION</a>`188';
isbe[5760]='Manaen`man\'-a-en (Manaen, Greek form of Hebrew name "Menahem," meaning "consoler"): Manaen is mentioned, with Barnabas, Saul and others, in <a onClick="return mV(\'Act\',13,1);">Ac 13:1</a>, as one of the "prophets and teachers" in the recently rounded Gentile church at Antioch, at the time when Barnabas and Saul were "separated" by Divine call for their missionary service. He is further described as "the foster-brother (suntrophos) of Herod the tetrarch" (i.e. Herod Antipas (see <a href="./study/isbe/search.html?string=HEROD">HEROD</a>)). He was probably brought up and educated with this Herod and his brother Archelaus. An earlier glimpse of Christian influence in Herod\'s court is afforded by Joanna, the wife of Herod\'s steward Chuzas, among the holy women who ministered to Jesus (<a onClick="return mV(\'Luk\',8,3);">Lu 8:3</a>). Manaen may have been related to the older Manaen, the Essene, who, Josephus tells us, foretold the greatness of Herod the Great, and was afterward treated by Herod as his friend (Ant., XV, x, 5). His position in the church at Antioch was evidently an influential one, whether he himself ranked among the "prophets," or perhaps only among the "teachers."``132';
isbe[5761]='Manahath`man\'-a-hath (manachath; Machanathi):<P>(1) A place to which certain Benjamites, victims, apparently, of intra-tribal jealousy, were carried captive (<a onClick="return mV(\'1Ch\',8,6);">1Ch 8:6</a>). Of this town the Manahathites were probably natives. It is possibly denoted by Manocho which Septuagint adds to the list of towns in Judah (<a onClick="return mV(\'Jos\',15,59);">Jos 15:59</a>). This place is named along with Bether (Bittir). The name seems to be preserved in that of Malicha, a large village not far from Bittir, southwest of Jerusalem. The change of "l" to "n", and vice versa, is not uncommon. The same place may be intended by Menuhah (<a onClick="return mV(\'Jdg\',20,43);">Jud 20:43</a> the Revised Version margin), where the King James Version reads "with ease," and the Revised Version (British and American) "at their resting-place."<P>(2) One of the sons of Shobal, the son of Seir the Horite (<a onClick="return mV(\'Gen\',36,23);">Ge 36:23</a>; <a onClick="return mV(\'1Ch\',1,40);">1Ch 1:40</a>), the "name-father" of one of the ancient tribes in Mt. Seir, afterward subdued and incorporated in Edom.``54';
isbe[5762]='Manahathites`man\'-a-hath-its (menuchoth (<a onClick="return mV(\'1Ch\',2,52);">1Ch 2:52</a>), manachti (<a onClick="return mV(\'1Ch\',2,54);">1Ch 2:54</a>); Septuagint: Codex Vaticanus Monaio; Codex Alexandrinus Ammanith (<a onClick="return mV(\'1Ch\',2,52);">1Ch 2:52</a>); Codex Vaticanus Malathei; Codex Alexandrinus Manath, (<a onClick="return mV(\'1Ch\',2,54);">1Ch 2:54</a>); the King James Version, Manahethites): These men were the inhabitants of Manahath. They were descendants of Caleb, one-half being the progeny of Shobal, and the other of Salma. In <a onClick="return mV(\'1Ch\',2,52);">1Ch 2:52</a> the Revised Version (British and American) transliterates "Menuhoth," but Manahathites is preferable.``1';
isbe[5763]='Manahethites`man-a-he\'-thits, ma-na\'-heth-its.`<a href="./study/isbe/search.html?string=MANAHATHITES">MANAHATHITES</a>`1';
isbe[5764]='Manasseas`man-a-se\'-as (Manasseas): One of those who had married "strange wives" (1Esdras 9:31); "Manasseh" of <a onClick="return mV(\'Ezr\',10,30);">Ezr 10:30</a>.``1';
isbe[5765]='Manasseh (1)`ma-nas\'-e (menashsheh, "causing to forget"; compare <a onClick="return mV(\'Gen\',41,51);">Ge 41:51</a>; Man(n)asse):<P>(1) The firstborn of Joseph by Asenath, daughter of Poti-phera, priest of On. See next article [<A href="./study/isbe/search.html?string=MANASSEH+(2)">Manasseh (2)</a>].<P>(2) The tribe named from Manasseh, half of which, with Gad and Reuben, occupied the east of Jordan (<a onClick="return mV(\'Num\',27,1);">Nu 27:1</a>, etc.). See next article [<A href="./study/isbe/search.html?string=MANASSEH+(2)">Manasseh (2)</a>].<P>(3) The "Manasseh" of <a onClick="return mV(\'Jdg\',18,30,31);">Jud 18:30,31</a> the King James Version is really an intentional mistake for the name Moses. A small nun ("n"), a Hebrew letter, has been inserted over and between the first and second Hebrew letters in the word Moses, thus maNesheh for mosheh. The reason for this is that the individual in question is mentioned as priest of a brazen image at Dan. His proper name was Moses. It was felt to be a disgrace that such a one bearing that honored name should keep it intact. The insertion of the nun hides the disgrace and, moreover, gives to the person a name already too familiar with idolatrous practices; for King Manasseh\'s 55 years of sovereignty were thus disgraced.<P>(4) King of Judah. See separate article [<A href="./study/isbe/search.html?string=MANASSEH (3)">Manasseh (3)</a>].<P>(5) Son of <a href="./study/isbe/search.html?string=PAHATH-MOAB">PAHATH-MOAB</a> (which see), who had married a foreign wife (<a onClick="return mV(\'Ezr\',10,30);">Ezr 10:30</a>). Manaseas in 1Esdras 9:31.<P>(6) The Manasses of 1Esdras 9:33. A layman of the family of Hashum, who put away his foreign wife at Ezra\'s order (<a onClick="return mV(\'Ezr\',10,33);">Ezr 10:33</a>).<P>In the Revised Version (British and American) of <a onClick="return mV(\'Mat\',1,10);">Mt 1:10</a> and <a onClick="return mV(\'Rev\',7,6);">Re 7:6</a> the spelling "Manasseh" is given for the King James Version "Manasses." The latter is the spelling of the husband of Judith (Judith 8:2,7; 10:3; 16:22,23,24); of a person named in the last words of Tobit and otherwise unknown (Tobit 14:10), and also the name given to a remarkable prayer probably referred to in <a onClick="return mV(\'2Ch\',33,18);">2Ch 33:18</a>, which Manasseh (4) is said to have uttered at the end of his long, unsatisfactory life. See <a href="./study/isbe/search.html?string=MANASSES,+THE+PRAYER+OF">MANASSES, THE PRAYER OF</a>. In <a onClick="return mV(\'Jdg\',12,4);">Jud 12:4</a>, the Revised Version (British and American) reads "Manasseh" for the King James Version "Manassites."``186';
isbe[5766]='Manasseh (2)`1. Son of Joseph:<P>Following the Biblical account of Manasseh (patriarch, tribe, and territory) we find that he was the eider of Joseph\'s two sons by Asenath, the daughter of Poti-phera, priest of On (<a onClick="return mV(\'Gen\',41,51);">Ge 41:51</a>). The birth of a son marked the climax of Joseph\'s happiness after the long bitterness of his experience. In the joy of the moment, the dark years past could be forgotten; therefore he called the name of the firstborn Manasseh ("causing to forget"), for, said he, God hath made me to forget all my toil. When Jacob was near his end, Joseph brought his two sons to his father who blessed them. Himself the younger son who had received the blessing of the firstborn, Jacob preferred Ephraim, the second son of Joseph, to Manasseh his elder brother, thus indicating the relative positions of their descendants (<a onClick="return mV(\'Gen\',48,\'1-\');">Ge 48</a>). Before Joseph died he saw the children of Machir the son of Manasseh (<a onClick="return mV(\'Gen\',50,23);">Ge 50:23</a>). Machir was born to Manasseh by his concubine, an Aramitess (<a onClick="return mV(\'1Ch\',7,14);">1Ch 7:14</a>). Whether he married Maacah before leaving for Egypt is not said. She was the sister of Huppim and Shuppim. Of Manasseh\'s personal life no details are recorded in Scripture. Acccording to Jewish tradition he became steward of his father\'s house, and acted as interpreter between Joseph and his brethren.<P>2. The Tribes in the Wilderness and Portion in Palestine:<P>At the beginning of the desert march the number of Manasseh\'s men of war is given at 32,200 (<a onClick="return mV(\'Num\',1,34);">Nu 1:34</a>f). At the 2nd census they had increased to 52,700 (<a onClick="return mV(\'Num\',26,34);">Nu 26:34</a>). Their position in the wilderness was with the tribe of Benjamin, by the standard of the tribe of Ephraim, on the west of the tabernacle. According to Targum Pseudojon, the standard was the figure of a boy, with the inscription "The cloud of Yahweh rested on them until they went forth out of the camp." At Sinai the prince of the tribe was Gamaliel, son of Pedahzur (<a onClick="return mV(\'Num\',2,20);">Nu 2:20</a>). The tribe was represented among the spies by Gaddi, son of Susi (<a onClick="return mV(\'Num\',13,11);">Nu 13:11</a>, where the name "tribe of Joseph" seems to be used as an alternative). At the census in the plains of Moab, Manasseh is named before Ephraim, and appears as much the stronger tribe (<a onClick="return mV(\'Num\',26,28);">Nu 26:28</a>). The main military exploits in the conquest of Eastern Palestine were performed by Manassites. Machir, son of Manasseh, conquered the Amorites and Gilead (<a onClick="return mV(\'Num\',32,39);">Nu 32:39</a>). Jair, son of Manasseh, took all the region of Argob, containing three score cities; these he called by his own name, "Havvoth-jair" (<a onClick="return mV(\'Num\',32,41);">Nu 32:41</a>; <a onClick="return mV(\'Deu\',3,4,14);">De 3:4,14</a>). Nobah captured Kenath and the villages thereof (<a onClick="return mV(\'Num\',32,42);">Nu 32:42</a>; <a onClick="return mV(\'Jos\',17,1,5);">Jos 17:1,5</a>). Land for half the tribe was thus provided, their territory stretching from the northern boundary of Gad to an undetermined frontier in the north, marching with Geshur and Maacah on the west, and with the desert on the east. The warriors of this half-tribe passed over with those of Reuben and Gad before the host of Israel, and took their share in the conquest of Western Palestine (<a onClick="return mV(\'Jos\',22,\'1-\');">Jos 22</a>). They helped to raise the great altar in the Jordan valley, which so nearly led to disastrous consequences (<a onClick="return mV(\'Jos\',22,10);">Jos 22:10</a>). Golan, the city of refuge, lay within their territory.<P>The possession of Ephraim and Manasseh west of the Jordan appears to have been undivided at first (<a onClick="return mV(\'Jos\',17,16);">Jos 17:16</a>). The portion which ultimately fell to Manasseh marched with Ephraim on the south, with Asher and Issachar on the north, running out to the sea on the west, and falling into the Jordan valley on the east (<a onClick="return mV(\'Jos\',17,7);">Jos 17:7</a>). The long dwindling slopes to westward and the fiat reaches of the plain included much excellent soil. Within the territory of Issachar and Asher, Beth-shean, Ibleam, Dor, Endor, Taanach and Megiddo, with their villages, were assigned to Manasseh. Perhaps the men of the West lacked the energy and enterprise of their Eastern brethren. They failed, in any case, to expel the Canaanites from these cities, and for long this grim chain of fortresses seemed to mock the strength of Israel (<a onClick="return mV(\'Jos\',17,11);">Jos 17:11</a>)<P>Ten cities west of the Jordan, in the portion of Manasseh, were given to the Levites, and 13 in the eastern portion (<a onClick="return mV(\'Jos\',21,5,6);">Jos 21:5,6</a>).<P>Manasseh took part in the glorious conflict with the host of Sisera (<a onClick="return mV(\'Jdg\',5,14);">Jud 5:14</a>). Two famous judges, Gideon and Jephthah, belonged to this tribe. The men of the half-tribe east of Jordan were noted for skill and valor as warriors (<a onClick="return mV(\'1Ch\',5,18,23);">1Ch 5:18,23</a>f). Some men of Manasseh had joined David before the battle of Gilboa (<a onClick="return mV(\'1Ch\',12,19);">1Ch 12:19</a>).<P>3. Its Place in Later History:<P>Others, all mighty men of valor, and captains in the host, fell to him on the way to Ziklag, and helped him against the band of rovers (<a onClick="return mV(\'1Ch\',12,20);">1Ch 12:20</a>). From the half-tribe west of the Jordan 18,000 men, expressed by name, came to David at Hebron to make him king (<a onClick="return mV(\'1Ch\',12,31);">1Ch 12:31</a>); while those who came from the East numbered, along with the men of Reuben and Gad, 120,000 (<a onClick="return mV(\'1Ch\',12,37);">1Ch 12:37</a>). David organized the eastern tribes under 2,700 overseers for every matter pertaining to God and for the affairs of the king (<a onClick="return mV(\'1Ch\',26,32);">1Ch 26:32</a>). The rulers of Manasseh were, in the west, Joel, son of Pedaiah, and in the east, Iddo, son of Zechariah (<a onClick="return mV(\'1Ch\',27,20,21);">1Ch 27:20,21</a>). Divers of Manasseh humbled themselves and came to Jerusalem at the invitation of Hezekiah to celebrate the Passover (<a onClick="return mV(\'2Ch\',30,11);">2Ch 30:11</a>). Although not cleansed according to the purification of the sanctuary, they ate the Passover. Pardon was successfully sought for them by the king, because they set their hearts to seek God (<a onClick="return mV(\'2Ch\',30,18);">2Ch 30:18</a>).<P>Of the eastern half-tribe it is said that they went a-whoring after the gods of the land, and in consequence they were overwhelmed and expatriated by Pul and Tiglath-pileser, kings of Assyria (<a onClick="return mV(\'1Ch\',5,25);">1Ch 5:25</a>f). Reference to the idolatries of the western half-tribe are also found in <a onClick="return mV(\'2Ch\',31,1);">2Ch 31:1</a>; <a onClick="return mV(\'2Ch\',34,6);">34:6</a>.<P>There is a portion for Manasseh in Ezekiel\'s ideal picture (<a onClick="return mV(\'Eze\',48,4);">Eze 48:4</a>), and the tribe appears in the list in Revelation (<a onClick="return mV(\'Rev\',7,6);">7:6</a>). The genealogies in <a onClick="return mV(\'Jos\',17,1);">Jos 17:1</a>ff; <a onClick="return mV(\'Num\',26,\'28-34\');">Nu 26:28-34</a>; <a onClick="return mV(\'1Ch\',2,\'21-23\');">1Ch 2:21-23</a>; <a onClick="return mV(\'1Ch\',7,\'14-19\');">7:14-19</a> have fallen into confusion. As they stand, they are mutually contradictory, and it is impossible to harmonize them.<P>The theories of certain modern scholars who reject the Biblical account are themselves beset with difficulties: e.g. the name is derived from the Arabic, nasa, "to injure a tendon of the leg." Manasseh, the Piel part., would thus be the name of a supernatural being, of whom the infliction of such an injury was characteristic. It is not clear which of the wrestlers at the Jabbok suffered the injury. As Jacob is said to have prevailed with gods and men, the suggestion is that it was his antagonist who was lamed. "It would appear therefore that in the original story the epithet Manasseh was a fitting title of Jacob himself, which might be borne by his worshippers, as in the case of Gad" (EB, under the word, para. 4).<P>It is assumed that the mention of Machir in <a onClick="return mV(\'Jdg\',5,14);">Jud 5:14</a> definitely locates the Manassites at that time on the west of the Jordan. The raids by members of the tribe on Eastern Palestine must therefore have taken place long after the days of Moses. The reasoning is precarious. After the mention of Reuben (<a onClick="return mV(\'Jdg\',5,15,16);">5:15,16</a>), Gilead (<a onClick="return mV(\'Jdg\',5,17);">5:17</A>) may refer to Gad. It would be strange if this warlike tribe were passed over (Guthe). Machir, then probably the strongest clan, stands for the whole tribe, and may be supposed to indicate particularly the noted fighters of the eastern half.<P>In dealing with the genealogies, "the difficult name" Zelophehad must be got rid of. Among the suggestions made is one by Dr. Cheyne, which first supposes the existence of a name Salhad, and then makes Zelophehad a corruption of this.<P>The genealogies certainly present difficulties, but otherwise the narrative is intelligible and self-consistent without resort to such questionable expedients as those referred to above.``54';
isbe[5767]='Manasseh (3)`A king of Judah, son and successor of Hezekiah; reigned 55 years (<a onClick="return mV(\'2Ki\',21,1);">2Ki 21:1</a>; <a onClick="return mV(\'2Ch\',33,1);">2Ch 33:1</a>), from circa 685 onward. His was one of the few royal names not compounded with the name of Yahweh (his son Amon\'s was the only other if, as an Assyrian inscription gives it, the full name of Ahaz was Jehoahaz or Ahaziah); but it was no heathen name like Amon, but identical with that of the elder son of Joseph. Born within Hezekiah\'s added 15 years, years of trembling faith and tender hope (compare <a onClick="return mV(\'Isa\',38,15);">Isa 38:15</a>f), his name may perhaps memorialize the father\'s sacred feelings; the name of his mother Hephzibah too was used long afterward as the symbol of the happy union of the land with its loyal sons (<a onClick="return mV(\'Isa\',62,4);">Isa 62:4</a>). All this, however, was long forgotten in the memory of Manasseh\'s apostate career.<P>I. Sources of His Life.<P>The history (<a onClick="return mV(\'2Ki\',1,\'1-\');">2Ki 1-18</a>) refers for "the rest of his acts" to "the book of the chronicles of the kings of Judah," but the body of the account, instead of reading like state annals, is almost entirely a censure of his idolatrous reign in the spirit of the prophets and of the Deuteronomic strain of literature. The parallel history (<a onClick="return mV(\'2Ch\',33,\'1-20\');">2Ch 33:1-20</a>) puts "the rest of his acts" "among the acts of the kings of Israel," and mentions his prayer (a prayer ascribed to him is in the Apocrypha) and "the words of the seers that spoke to him in the name of Yahweh." This history of Chronicles mentions his captive journey to Babylon and his repentance (<a onClick="return mV(\'2Ch\',33,\'10-13\');">2Ch 33:10-13</a>), also his building operations in Jerusalem and his resumption of Yahweh-worship (<a onClick="return mV(\'2Ch\',33,\'14-17\');">2Ch 33:14-17</a>), which the earlier source lacks. From these sources, which it is not the business of this article either to verify or question, the estimate of his reign is to be deduced.<P>II. Character of His Reign.<P>1. Political Situation:<P>During his reign, Assyria, principally under Esar-haddon and Assur-banipal, was at the height of its arrogance and power; and his long reign was the peaceful and uneventful life of a willing vassal, contented to count as tributary king in an illustrious world-empire, hospitable to all its religious and cultural ideas, and ready to take his part in its military and other enterprises. The two mentions of his name in Assyrian inscriptions (see G.A. Smith, Jerusalem, II, 182) both represent him in this tributary light. His journey to Babylon mentioned in <a onClick="return mV(\'2Ch\',33,11);">2Ch 33:11</a> need not have been the penalty of rebellion; more likely it was such an enforced act of allegiance as was perhaps imposed on all provincial rulers who had incurred or would avert suspicion of disloyalty. Nor was his fortification of Jerusalem after his return less necessary against domestic than foreign aggression; the more so, indeed, as in so long and undisturbed a reign his capital, which was now practically synonymous with his realm (Esar-haddon calls him "king of the city of Judah"), became increasingly an important center of wealth and commercial prosperity. Of the specific events of his reign, however, other than religious, less is known than of almost any other.<P>2. Reactionary Idolatry:<P>That the wholesale idolatry by which his reign is mainly distinguished was of a reactionary and indeed conservative nature may be understood alike from what it sought to maintain and from what it had to react against. On the one side was the tremendous wave of ritual and mechanical heathen cults which, proceeding from the world-centers of culture and civilization (compare <a onClick="return mV(\'Isa\',2,\'6-8\');">Isa 2:6-8</a>), was drawing all the tributary lands, Judah with the rest, into its almost irresistible sweep. Manasseh, it would seem, met this not in the temper of an amateur, as had his grandfather Ahaz, but in the temper of a fanatic. Everything old and new that came to his purview was of momentous religious value—except only the simple and austere demands of prophetic insight. He restored the debasing cults of the aboriginal Nature-worship which his father had suppressed, thus making Judah revert to the sterile Baal-cults of Ahab; but his blind credence in the black arts so prevalent in all the surrounding nations, imported the elaborate worship of the heavenly bodies from Babylon, invading even the temple-courts with its numerous rites and altars; even went to the horrid extreme of human sacrifice, making an institution of what Ahaz had tried as a desperate expedient. All this, which to the matured prophetic sense was headlong wickedness, was the mark of a desperately earnest soul, seeking blindly in this wholesale way to propitiate the mysterious Divine powers, his nation\'s God among them, who seemed so to have the world\'s affairs in their inscrutable control. On the other side, there confronted him the prophetic voice of a religion which decried all insincere ritual (\'wickedness and worship,\' <a onClick="return mV(\'Isa\',1,13);">Isa 1:13</a>), made straight demands on heart and conscience, and had already vindicated itself in the faith which had wrought the deliverance of 701. It was the fight of the decadent formal against the uprising spiritual; and, as in all such struggles, it would grasp at any expedient save the one plain duty of yielding the heart to repentance and trust.<P>3. Persecution:<P>Meanwhile, the saving intelligence and integrity of Israel, though still the secret of the lowly, was making itself felt in the spiritual movement that Isaiah had labored to promote; through the permeating influence of literature and education the "remnant" was becoming a power to be reckoned with. It is in the nature of things that such an innovating movement must encounter persecution; the significant thing is that already there was so much to persecute. Persecution is as truly the offspring of fear as of fanaticism. Manasseh\'s persecution of the prophets and their adherents (tradition has it that the aged Isaiah was one of his victims) was from their point of view an enormity of wickedness. To us the analysis is not quite so simple; it looks also like the antipathy of an inveterate formal order to a vital movement that it cannot understand. The vested interests of almost universal heathenism must needs die hard, and "much innocent blood" was its desperate price before it would yield the upper hand. To say this of Manasseh\'s murderous zeal is not to justify it; it is merely to concede its sadly mistaken sincerity. It may well have seemed to him that a nation\'s piety was at stake, as if a world\'s religious culture were in peril.<P>4. Return to Better Mind:<P>The Chronicler, less austere in tone than the earlier historian, preserves for us the story that, like Saul of Tarsus after him, Manasseh got his eyes open to the truer meaning of things; that after his humiliation and repentance in Babylon he "knew that Yahweh he was God" (<a onClick="return mV(\'2Ch\',33,\'10-13\');">2Ch 33:10-13</a>). He had the opportunity to see a despotic idolatry, its evils with its splendors, in its own home; a first-fruit of the thing that the Hebrew exiles were afterward to realize. On his return, accordingly, he removed the altars that had encroached upon the sacred precincts of the temple, and restored the ritual of the Yahweh-service, without, however, removing the high places. It would seem to have been merely the concession of Yahweh\'s right to a specific cult of His own, with perhaps a mitigation of the more offensive extremes of exotic worship, while the toleration of the various fashionable forms remained much as before. But this in itself was something, was much; it gave Yahweh His chance, so to say, among rivals; and the growing spiritual fiber of the heart of Israel could be trusted to do the rest. It helps us also the better to understand the situation when, only two years after Manasseh\'s death, Josiah came to the throne, and to understand why he and his people were so ready to accept the religious sanity of the Deuteronomic law. He did not succeed, after all, in committing his nation to the wholesale sway of heathenism. Manasseh\'s reactionary reign was indeed not without its good fruits; the crisis of religious syncretism and externalism was met and passed.``66';
isbe[5768]='Manasses`ma-nas\'-ez (Manasses; Codex Vaticanus Manasse):<P>(1) One who had married a "strange wife" (1Esdras 9:33) equals "Manasseh" of <a onClick="return mV(\'Ezr\',10,33);">Ezr 10:33</a>.<P>(2) The wealthy husband of Judith; died of sunstroke when employed at the barley harvest (Judith 8:2f; 7; 10:3; 16:22ff).<P>(3) A person mentioned in Tobit 14:10, who "gave alms, and escaped the snare of death." It must be admitted that Manasses here is an awkward reading and apparently interrupts the sense, which would run more smoothly if Manasses were omitted or Achiacharus read. There is great variety of text in this verse. Codex Sinaiticus (followed by Fritzsche, Libri apoc. vet. Test Greek, 1871) reads en to poiesai me eleemosunen exelthen, where Manasses is omitted and Achiacharus is understood as the subject. Itala and Syriac go a step further and read Achiacharus as subject. But Codex Vaticanus (followed by Swete, the King James Version and the Revised Version (British and American)) reads Manasses, which must be the correct reading on the principle of being the most difficult. Explanations have been offered<P>(1) that Manasses is simply the Hebrew name for Achiacharus, it not being uncommon for a Jew to have a Greek and a Hebrew name;<P>(2) that on reading Amon, Manasses was inserted for Achiacharus according to <a onClick="return mV(\'2Ch\',33,22);">2Ch 33:22</a>ff;<P>(3) that Manasses here is an incorrect reading for Nasbas (Tobit 11:18), identified by Grotius with Achiacharus: "It seems impossible at present to arrive at a satisfactory explanation" (Fuller, Speaker\'s Commentary).<P>There is as great uncertainty as to the person who conspired against Manasses: Aman, in Codex Alexandrinus, followed by the King James Version and the Revised Version (British and American), who is by some identified with the Haman of Esther and Achiacharus with Mordecai; Adam, in Codex Vaticanus, followed by Swete; Itala Nadab; Syriac Ahab (Acab).<P>(4) A king of Judah (<a onClick="return mV(\'Mat\',1,10);">Mt 1:10</a> the King James Version, Greek form, the Revised Version (British and American) "Manasseh"), whose prayer forms one of the apocryphal books.<P>See <a href="./study/isbe/search.html?string=MANASSES,+THE+PRAYER+OF">MANASSES, THE PRAYER OF</a>.<P>(5) The elder son of Joseph (<a onClick="return mV(\'Rev\',7,6);">Re 7:6</a>, the King James Version Greek form, the Revised Version (British and American) "Manasseh").``5';
isbe[5769]='Manasses, the Prayer of`1. Name<P>2. Canonicity and Position<P>3. Contents<P>4. Original Language<P>5. Authenticity<P>6. Author and Motive<P>7. Date<P>8. Text and Versions<P class="in15">(1) Greek<P class="in15">(2) Latin<P>LITERATURE<hr /><P>The Prayer of Manasses purports to be, and may in reality be, the prayer of that king mentioned in <a onClick="return mV(\'2Ch\',33,13,18);">2Ch 33:13,18</a> f.<P>1. Name:<P>In Cod.<P>A. it is called simply "A Prayer of Manasses," in the London Polyglot "A Prayer of Manasses, King of the Jews." Its title in the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) is "A Prayer of Manasses, King of Judah, when He Was Held Captive in Babylon." In Baxter\'s Apocrypha, Greek and English this Prayer appears at the end with the heading "A Prayer of Manasses, son of Ezekias" (equals Hezekiah).<P>2. Canonicity and Position:<P>The Greek church is the only one which has consistently reckoned this Prayer as a part of its Bible. Up to the time of the Council of Trent (1545-1563 AD), it formed a part of the Vulgate, but by that council it was relegated with 3 and 4 (1 and 2) Esdras to the appendix (which included uncanonical scriptures), "lest they should become wholly lost, since they are occasionally, cited by the Fathers and are found in printed copies. Yet it is wholly absent from the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) of Sixtus V, though it is in the Appendix of the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) of Clement VIII. Its position varies in manuscripts, versions and printed editions of the Septuagint. It is most frequently found among the odes or canticles following the Psalter, as in Codices Alexandrinus, T (the Zurich Psalter) and in Ludolf\'s Ethiopic Psalter. In Swete\'s Septuagint the Psalter of Solomon followed by the odes (Odai), of which The Prayer of Manasseh is the 8th, appear as an Appendix after 4 Maccabees in volume III. It was placed after 2 Chronicles in the original Vulgate, but in the Romanist Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) it stands first, followed by 3 and 4 (1 and 2) Esdras in the apocryphal Appendix. It is found in all manuscripts of the Armenian Bible, where, as in Swete\'s Septuagint, it is one of many odes. Though not included in Coverdale\'s Bible or the Geneva VS, it was retained (at the close of the Apocrypha) in Luther\'s translation, in Mathew\'s Bible and in the Bishops\' Bible, whence it passed into our English Versions of the Bible.<P>3. Contents:<P>According to <a onClick="return mV(\'2Ch\',33,\'1-\');">2Ch 33</a> (compare <a onClick="return mV(\'2Ki\',21,\'1-\');">2Ki 21</a>) Manasseh was exiled by the Assyrians to Babylon as a punishment for his sins. There he became penitent and earnestly prayed to God for pardon and deliverance. God answered his prayer and restored him to Jerusalem and to the throne. Though the prayer is mentioned in <a onClick="return mV(\'2Ch\',33,13,18);">2Ch 33:13,18</a>f; it is not given, but this lack has been supplied in the The Prayer of Manasseh of the Apocrypha. After an opening invocation to the God of Abraham, Isaac, Judah and their righteous seed, the Creator of all things, most high, yet compassionate, who has ordained repentance, not for perfect ones like the patriarchs who did not need it, but for the like of the person praying, there follows a confession of sin couched for the most part in general terms, a prayer for pardon and a vow to praise God forever if this prayer is answered.<P>4. Original Language:<P>The bulk of scholars (Fritzsche, Reuss, Schurer, Ryssel, etc.) agree that this Prayer was composed in Greek. The Greek recension is written in a free, flowing and somewhat rhetorical style, and it reads like an original work, not like a translation. Though there are some Hebraisms, they are not more numerous or striking than usually meet us in Hellenistic Greek. It is of some importance also that, although Jewish tradition adds largely to the legends about Manasseh, it has never supplied a Hebrew version of the Prayer (see <a href="./study/isbe/search.html?string=VERSIONS">VERSIONS</a>; <a href="./study/isbe/search.html?string=TEXT+OF+THE+OLD+TESTAMENT">TEXT OF THE OLD TESTAMENT</a>). On the other hand, Ewald (Hist. Isr, I, 186; IV, 217, note 5, German edition, IV, 217f), Furst (Gesch. der bibl. Lit., II, 399), Budde (ZAW,1892,39ff), Ball (Speaker\'s Apocrypha) and others argue for a Hebrew original, perhaps existing in the source named of <a onClick="return mV(\'2Ch\',33,18);">2Ch 33:18</a>f (see Ryssel in Kautzsch, Die Apocrypha des Altes Testament, 167).<P>5. Authenticity:<P>Have we here the authentic prayer of Manasseh offered under the circumstances described in <a onClick="return mV(\'2Ch\',33,\'1-\');">2Ch 33</a>? Ewald and the other scholars named (see foregoing section), who think the Prayer was composed in Hebrew, say that we have probably here a Greek rendering of the Hebrew original which the Chronicler saw in his source. Ball, on the other hand, though not greatly opposed to this view, is more convinced that the Hebrew original is to be sought in a haggadic narrative concerning Manasseh. Even if we accept the view of Ewald or of Ball, we still desiderate evidence that this Hebrew original is the very prayer offered by the king in Babylon. But the arguments for a Greek original are fairly conclusive. Many Old Testament scholars regard the narrative of the captivity, prayer and penitence of Manasseh as a fiction of the Chronicler\'s imagination, to whom it seemed highly improper that this wicked king should escape the punishment (exile) which he richly deserved. So De Wette (Einleitung), Graf (Stud. u. Krit.,1859,467-94, and Gesch. Bucher des Altes Testament, 174) and Noldeke (Schenkel\'s Bibelwerk, "Manasse"). Nothing corresponding to it occurs in the more literal narrative of <a onClick="return mV(\'2Ki\',21,\'1-\');">2Ki 21</a>, an argument which, however, has but little weight. Recent discoveries of cuneiform inscriptions have taken off the edge of the most important objections to the historicity of this part of Chronicles. See Ball (op. cit., 361ff) and Bissell (Lange\'s Apocrypha, 468). The likeliest supposition is that the author of the Prayer was an Alexandrian Jew who, with <a onClick="return mV(\'2Ch\',33,\'1-\');">2Ch 33</a> before him, desired to compose such a prayer as Manasseh was likely to offer under the supposed circumstances. This prayer, written in excellent Alexandrian Greek, is, as Fritzsche points out, an addition to <a onClick="return mV(\'2Ch\',33,\'1-\');">2Ch 33</a>, corresponding to the prayers of Mordecai and Esther added to the canonical Esther (<span class="noTag">Additions to Esther 13:8-14:19</span>), and also to the prayer of Azarias (The Song of the Three Children (Azariah) 1:2-22) and the Song of the Three Young Men (The Song of the Three Children (Azariah) 1:29-68) appended to the canonical Book of Daniel.<P>6. The Author and His Motive:<P>That the author was an Alexandrian Jew is made probable by the (Greek) language he employs and by the sentiments he expresses. It is strange to find Swete (Expository Times, II, 38f) defending the Christian authorship of this Prayer. What purpose could the writer seek to realize in the composition and publication of the penitential psalm? In the absence of definite knowledge, one may with Reuss (Das Altes Testament, VI, 436f) suppose that the Jewish nation was at the time given up to great unfaithfulness to God and to gross moral corruption. The lesson of the Prayer is that God will accept the penitent, whatever his sins, and remove from the nation its load of sufferings, if only it turns to God.<P>7. Date:<P>Ewald and Furst (op. cit.) hold that the prayer is at least as old as the Book of Chronicles (300 BC), since it is distinctly mentioned, they say, in <a onClick="return mV(\'2Ch\',33,13,18);">2Ch 33:13,18</a>f. But the original form was, as seen (compare 4 above), Greek, not Hebrew. Moreover, the teaching of the Prayer is post-Biblical. The patriarchs are idealized to the extent that they are thought perfect and therefore not needing forgiveness (<span class="noTag">33:8</a>); their merits avail for the sinful and undeserving (<span class="noTag">33:1</a>) (see Weber, Jud. Theologie, 292). The expressions "God of the Just" (<span class="noTag">33:8</a>), "God of those who repent" (<span class="noTag">33:13</a>), belong to comparatively late Judaism. A period about the beginning of the Christian era or (Fritzsche) slightly earlier would suit the character (language and teaching) of the Prayer. The similarity between the doctrines implied in The Prayer of Manasseh and those taught in apocryphal writings of the time confirms this conclusion. There is no need with Bertholdt to bring down the writing to the 2nd or 3rd century AD. Fabricius (Liber Tobit, etc., 208) dates the Prayer in the 4th or 5th century AD, because, in his opinion, its author is the same as that of the Apostolical Constitutions which has that date. But the source of this part of the Apostolical Constitutions is the Didaskalia (3rd century), and moreover both these treatises are of Christian origin, the Prayer being the work of an Alexandrian Jew.<P>8. Text and Versions:<P>(1) Greek:<P>The Greek text occurs in Codices Alexandrinus, T (Psalterium Turicence 262, Parsons). Swete (<a href="./study/isbe/search.html?string=OLD+TESTAMENT">OLD TESTAMENT</a> in Greek, III, 802-4) gives the text of Codex Alexandrinus with the variations of T. It is omitted from the bulk of ancient manuscripts and editions of the Septuagint, as also from several modern editions (Tischendorf, etc.). Nestle (Septuaginta Studien,1899,3) holds that the Greek text of Codices Alexandrinus, T, etc., has been taken from the Apostolical Constitutions or from the Didaskalia. The common view is that it was extracted by the latter from the Septuagint.<P>(2) Latin:<P>The Latin text in Sabatier (Bib. Sac. Latin, III, 1038) is not by Jerome, nor is it in the manner of the Old Latin; its date is later.<P>LITERATURE.<P>The outstanding literature has been cited in the foregoing article. Reference may be made to Howorth ("Some Unconventional Views on the Text of the Bible," PSBA, XXXI, 89ff: he argues that the narrative concerning Manasseh, including the Prayer in the Apostolical Constitutions, represents a portion of the true Septuagint of <a onClick="return mV(\'2Ch\',33,1);">2Ch 33</a>).``33';
isbe[5770]='Manassites`ma-nas\'-its (menashshi; ho Manasse): Members of the tribe of Manasseh (<a onClick="return mV(\'Deu\',4,43);">De 4:43</a>; <a onClick="return mV(\'Jdg\',12,4);">Jud 12:4</a> the King James Version; <a onClick="return mV(\'2Ki\',10,33);">2Ki 10:33</a>).``1';
isbe[5771]='Mandrakes`man\'-draks (dudha\'im; mandragoras (<a onClick="return mV(\'Gen\',30,14);">Ge 30:14</a>f; <a onClick="return mV(\'Sgs\',7,13);">So 7:13</a>); the marginal reading "love apples" is due to the supposed connection of dudha\'im with dodhim, "love"): Mandrakes are the fruit of the Mandragora officinarum, a member of the Solanaceae or potato order, closely allied to the Atropa belladonna. It is a common plant all over Palestine, flourishing particularly in the spring and ripening about the time of the wheat harvest (<a onClick="return mV(\'Gen\',30,14);">Ge 30:14</a>). The plant has a rosette of handsome dark leaves, dark purple flowers and orange, tomato-like fruit. The root is long and branched; to pull it up is still considered unlucky (compare Josephus, BJ, VII, vi, 3). The fruit is called in Arabic baid el-jinn, the "eggs of the jinn"; they have a narcotic smell and sweetish taste, but are too poisonous to be used as food. They are still used in folklore medicine in Palestine. The plant was well known as an aphrodisiac by the ancients (<a onClick="return mV(\'Sgs\',7,13);">So 7:13</a>).``117';
isbe[5772]='Maneh; Mina`man\'-e, or mi\'-na (maneh; mna, "pound" (English Versions of the Bible)): A weight containing 50 shekels, according to Hebrew usage, but which varied according to the standard adopted. Estimated on the Phoenician, or commercial, standard, it was equal to 11,200 grains, or about 2 lbs. troy, or about 1,6 lbs. avoirdupois. This is probably the weight intended in <a onClick="return mV(\'1Ki\',10,17);">1Ki 10:17</a>; <a onClick="return mV(\'Ezr\',2,69);">Ezr 2:69</a> and <a onClick="return mV(\'Neh\',7,71);">Ne 7:71</a>f (see <a href="./study/isbe/search.html?string=WEIGHTS+AND+MEASURES">WEIGHTS AND MEASURES</a>). When used in a monetary sense, the maneh of silver was worth about 6 pounds 17 shillings, or $34 (in 1915); the gold maneh was equal to about 102 pounds 10 shillings, or $510 (in 1915).``138';
isbe[5773]='Manes`ma\'-nez (Manes): One of those who put away their "strange wives" (1Esdras 9:21). It represents the two names Maaseiah and Elijah of the parallel <a onClick="return mV(\'Ezr\',10,21);">Ezr 10:21</a>. The real equivalent is probably Maaseiah, Elijah being dropped. the Revised Version margin and the King James Version margin give Harim of <a onClick="return mV(\'Ezr\',10,21);">Ezr 10:21</a> as identical—apparently incorrectly, for the words "and of the sons of Harim" (<a onClick="return mV(\'Ezr\',10,21);">Ezr 10:21</a>) are simply omitted. the King James Version blunders strangely here in reading Eanes after a misprint Eanes (for Manes) in the Aldine edition.``1';
isbe[5774]='Manger`man\'-jer (phatne): Properly the place in a stall or stable where the food of cattle is placed (in the Old Testament "crib" (<a onClick="return mV(\'Job\',39,9);">Job 39:9</a>; <a onClick="return mV(\'Pro\',14,4);">Pr 14:4</a>; <a onClick="return mV(\'Isa\',1,3);">Isa 1:3</a>)); thus also, apparently, in the narrative of the nativity in <a onClick="return mV(\'Luk\',2,7,12,16);">Lu 2:7,12,16</a>. In Septuagint, the Greek word, representing different Hebrew words, has also the extended meaning of "stall" (<a onClick="return mV(\'2Ch\',32,28);">2Ch 32:28</a>; <a onClick="return mV(\'Hab\',3,17);">Hab 3:17</a>); thus also in <a onClick="return mV(\'Luk\',13,15);">Lu 13:15</a>, where the Revised Version margin has "manger." Old tradition says that Jesus was born in a cave in the neighborhood of Bethlehem; even so, a place for food for cattle may have been cut in the side of the rock.``132';
isbe[5775]='Mani`ma\'-ni (Mani): Head of a family (1Esdras 9:30) equals "Bani" in <a onClick="return mV(\'Ezr\',10,29);">Ezr 10:29</a>, the form which appears in 1Esdras 5:12.``1';
isbe[5776]='Manifest; Manifestation`man\'-i-fest, man-i-fes-ta\'-shun (phaneroo, phaneros): "To manifest" is generally the translation of phaneroo, "to make apparent" (<a onClick="return mV(\'Mar\',4,22);">Mr 4:22</a>; <a onClick="return mV(\'Jhn\',17,6);">Joh 17:6</a>; <a onClick="return mV(\'Rom\',3,21);">Ro 3:21</a>; <a onClick="return mV(\'1Ti\',3,16);">1Ti 3:16</a>, "God was manifest in the flesh," the Revised Version (British and American) "manifested"; <a onClick="return mV(\'1Jo\',1,2);">1Joh 1:2</a> twice, etc.); also of phaneros, "manifest" (<a onClick="return mV(\'Act\',4,16);">Ac 4:16</a>; <a onClick="return mV(\'Rom\',1,19);">Ro 1:19</a>; <a onClick="return mV(\'1Cr\',3,13);">1Co 3:13</a>; <a onClick="return mV(\'1Jo\',3,10);">1Joh 3:10</a>, etc.); "to make manifest" (phaneroo) (<a onClick="return mV(\'Jhn\',1,31);">Joh 1:31</a>; <a onClick="return mV(\'Rom\',16,26);">Ro 16:26</a>); of emphanizo, "to make fully manifest" (<a onClick="return mV(\'Jhn\',14,21);">Joh 14:21</a>f); of emphanes, "fully manifest" (<a onClick="return mV(\'Rom\',10,20);">Ro 10:20</a>); of delos, "evident," translated "manifest" (<a onClick="return mV(\'1Cr\',15,27);">1Co 15:27</a>, the Revised Version (British and American) "evident"); of ekdelos, "very evident" (<a onClick="return mV(\'2Ti\',3,9);">2Ti 3:9</a>, the Revised Version (British and American) "evident"); of prodelos, "evident beforehand" (<a onClick="return mV(\'1Ti\',5,25);">1Ti 5:25</a>, the Revised Version (British and American) "evident"); of aphanes, is "not manifest" (<a onClick="return mV(\'Hbr\',4,13);">Heb 4:13</a>, "There is no creature that is not manifest in his sight"); "manifest," occurs once in the Old Testament as the translation of barar, "to clear," "to purify" (<a onClick="return mV(\'Ecc\',3,18);">Ec 3:18</a>, the Revised Version (British and American) "prove"); of phaneros (2Macc 3:28, the Revised Version (British and American) "manifestly").<P>Manifestation is the translation of apokalupsis, "uncovering" (<a onClick="return mV(\'Rom\',8,19);">Ro 8:19</a>, "the manifestation of the sons of God," the Revised Version (British and American) "revealing"); of phanerosis, "manifestation" (<a onClick="return mV(\'1Cr\',12,7);">1Co 12:7</a>; <a onClick="return mV(\'2Cr\',4,2);">2Co 4:2</a>).<P>The Revised Version (British and American) has "manifest" for "shew" (<a onClick="return mV(\'Jhn\',7,4);">Joh 7:4</a>); "was manifested" for "appeared" (<a onClick="return mV(\'Mar\',16,12,14);">Mr 16:12,14</a>); "was manifested to the," for "shewed himself to his" (<a onClick="return mV(\'Jhn\',21,14);">Joh 21:14</a>); "be made manifest" for "appear" (<a onClick="return mV(\'2Cr\',5,10);">2Co 5:10</a>; <a onClick="return mV(\'2Cr\',7,12);">7:12</a>; <a onClick="return mV(\'Rev\',3,18);">Re 3:18</a>); "became manifest" for "was made known" (<a onClick="return mV(\'Act\',7,13);">Ac 7:13</a>); "gave him to be made manifest" for "shewed him openly" (<a onClick="return mV(\'Act\',10,40);">Ac 10:40</a>); "He who was manifested" for "God was manifest" (<a onClick="return mV(\'1Ti\',3,16);">1Ti 3:16</a>) (margin "The word "God," in place of "He who," rests on no sufficient ancient evidence. Some ancient authorities read which"); "is not yet made manifest" for "doth not yet appear" (<a onClick="return mV(\'1Jo\',3,2);">1Joh 3:2</a>); "by the manifestation" for "with the brightness" (<a onClick="return mV(\'2Th\',2,8);">2Th 2:8</a>) "be manifested" for "appear" (<a onClick="return mV(\'Col\',3,4);">Col 3:4</a> twice; <a onClick="return mV(\'1Pe\',5,4);">1Pe 5:4</a>); "if he shall be manifested" for "when he shall appear" (<a onClick="return mV(\'1Jo\',2,28);">1Joh 2:28</a>; <a onClick="return mV(\'1Jo\',3,2);">3:2</a>), etc.``185';
isbe[5777]='Manifestly`man\'-i-fest-li (mar\'eh, "(in) personal presence"): Has the meaning of "by direct vision," as in <a onClick="return mV(\'1Cr\',13,12);">1Co 13:12</a>, "face to face," stating positively (<a onClick="return mV(\'Num\',12,8);">Nu 12:8</a>) what the next clause states negatively, namely, "not in dark speeches." "Apparently" of the King James Version is ambiguous.``1';
isbe[5778]='Manifold`man\'-i-fold (rabh; poikilos): "Manifold," which occurs only a few times, is in the Old Testament the translation of rabh, "many," "abundant" (<a onClick="return mV(\'Neh\',9,19,27);">Ne 9:19,27</a>; <a onClick="return mV(\'Amo\',5,12);">Am 5:12</a>, where it is equivalent to "many"), and of rabhabh, "to multiply," "to increase" (<a onClick="return mV(\'Psa\',104,24);">Ps 104:24</a>, "O Yahweh, how manifold are thy works"); poikilos, properly, "many colored," "spotted," "variegated," is translated "manifold": <a onClick="return mV(\'1Pe\',1,6);">1Pe 1:6</a> margin, "manifold temptations"; <a onClick="return mV(\'1Pe\',4,10);">4:10</A>, "manifold grace," suggests variety, diverseness; polupoikilos has this meaning more intensely (<a onClick="return mV(\'Eph\',3,10);">Eph 3:10</a>, "the manifold wisdom of God"). With this may be compared a fine passage in The <span class="noTag">Wisdom of Solomon 7:22</span>, where it is said that in Wisdom there is "an understanding spirit, holy, one only (the Revised Version (British and American) "alone in kind," margin "Greek: sole-born"), manifold (polumeres)." In like manner, pollaplasion, "manifold more" (<a onClick="return mV(\'Luk\',18,30);">Lu 18:30</a>), indicates the varied elements of the reward of him who is faithful to Christ. In Ecclesiasticus 51:3, we have "manifold afflictions" (pleion).``185';
isbe[5779]='Manius; Titus`ma\'-ni-us, ti\'-tus (Tito Manios, Codex Alexandrinus, Codex Venetus, and the Syriac; Manlios, Swete following Codex Alexandrinus; Manilius, Itala and Vulgate, the King James Version, Manlius): Titus Manius and Quintus Memmius were the legates of the Romans who carried a letter unto the Jewish people consenting to the favorable terms which Lysias, the captain of Antiochus, granted to the Jews after his defeat, 163 BC (2Macc 11:34). That the letter is spurious appears from the facts<P>(1) that it is dated in the 148th year of the Seleucidian era adopted by the Jews and not, after the Roman fashion, according to consulates;<P>(2) that it is also dated the same day as that of Eupator—the 15th of the month Xanthicus;<P>(3) that the Jews had as yet no dealings with the Romans; Judas first heard of the fame of the Romans a year or two years later (1Macc 8:1ff), after the death of Nicanor (1Macc 7:47);<P>(4) that no such names are found among the Roman legati mentioned by Polybius as sent to the East.<P>If Manius is not altogether a fabrication, it is difficult to decide exactly who he is. The reading fluctuates between "Manius" and "Manlius." About the same time a T. Manlius Torquatus was sent by the Romans on an embassy to Egypt to settle a quarrel between Philometor and Euergetes II Physc. on (Polyb. xxxi. 18; Livy xliii.11), but not to Syria, and his colleague was Cn. Merula. Perhaps Manius Sergius is intended, who with C. Sulpicius was sent to investigate the state of Greece and to see what Antiochus Epiphanes and Eumanes were doing (165 BC) (Polyb. xxxi.9). But no such name as Titus Manius or Manlius is otherwise found as legate to Asia with a colleague Quintus Memmius.`<a href="./study/isbe/search.html?string=MEMMIUS">MEMMIUS</a>`5';
isbe[5780]='Mankind`man-kind\':In <a onClick="return mV(\'Lev\',18,22);">Le 18:22</a>; <a onClick="return mV(\'Lev\',20,13);">20:13</a>, the term is applied to men, as distinguished from women; in <a onClick="return mV(\'Job\',12,10);">Job 12:10</a>, to the human race; in <a onClick="return mV(\'Jam\',3,7);">Jas 3:7</a>, to the human nature.``1';
isbe[5781]='Manlius, Titus`man\'-li-us.`<a href="./study/isbe/search.html?string=MANIUS,+TITUS">MANIUS, TITUS</a>`1';
isbe[5782]='Manna`man\'-a (man; manna): The Hebrew man is probably derived, as Ebers suggests, from the Egyptian mennu, "food." In <a onClick="return mV(\'Exd\',16,15);">Ex 16:15</a>, we have a suggested source of the name, "They said one to another, What is it?" i.e. manhu, which also means, "It is manna" (see margin).<P>1. Old Testament References:<P>This substance is described as occurring in flakes or small round grains, literally, "hoax frost"; it fell with the dew (<a onClick="return mV(\'Num\',11,9);">Nu 11:9</a>) and appeared when the dew left the ground (<a onClick="return mV(\'Exd\',16,14);">Ex 16:14</a>); "It was like coriander seed, white; and the taste of it was like wafers made with honey" (<a onClick="return mV(\'Exd\',16,31);">Ex 16:31</a>). In <a onClick="return mV(\'Num\',11,8);">Nu 11:8</a>, its taste is described "as the taste of fresh oil," margin "cakes baked with oil." "And the children of Israel did eat the manna forty years, until they came...unto the borders of the land of Canaan" (<a onClick="return mV(\'Exd\',16,35);">Ex 16:35</a>). It ceased the day after they ate the produce of the land, unleavened cakes and parched grain, in the plains of Jericho (<a onClick="return mV(\'Jos\',5,\'10-12\');">Jos 5:10-12</a>). Although an important article of diet, it was by no means the sole one as seems implied in <a onClick="return mV(\'Num\',21,15);">Nu 21:15</a>; there are plenty of references (e.g. <a onClick="return mV(\'Exd\',17,3);">Ex 17:3</a>; <a onClick="return mV(\'Exd\',24,5);">24:5</a>; <a onClick="return mV(\'Exd\',34,3);">34:3</a>; <a onClick="return mV(\'Lev\',8,2,26,31);">Le 8:2,26,31</a>; <a onClick="return mV(\'Lev\',9,4);">9:4</a>; <a onClick="return mV(\'Lev\',10,12);">10:12</a>; <a onClick="return mV(\'Lev\',24,5);">24:5</a>; <a onClick="return mV(\'Num\',7,13,19);">Nu 7:13,19</a>f; etc.) which show that they had other food besides. The food was gathered every morning, "every man according to his eating: and when the sun waxed hot, it melted" (<a onClick="return mV(\'Exd\',16,21);">Ex 16:21</a>); a portion of the previous day\'s gathering bred worms and stank if kept (<a onClick="return mV(\'Exd\',16,20);">Ex 16:20</a>); on the 6th day a double amount was gathered, the Sabbath portion being miraculously preserved (<a onClick="return mV(\'Exd\',16,\'22-27\');">Ex 16:22-27</a>). A pot—a golden one (<a onClick="return mV(\'Hbr\',9,4);">Heb 9:4</a>)—with an omer of manna was "laid up before Yahweh" in the tabernacle (<a onClick="return mV(\'Exd\',16,33);">Ex 16:33</a>). Manna is referred to in <a onClick="return mV(\'Neh\',9,20);">Ne 9:20</a>. It is described poetically as "food from heaven" and "bread of the mighty" (<a onClick="return mV(\'Psa\',78,24);">Ps 78:24</a>f); as "bread of heaven" (<a onClick="return mV(\'Psa\',105,40);">Ps 105:40</a>); and as "angels\' bread" (2Esdras 1:19; The <span class="noTag">Wisdom of Solomon 16:20</span>).<P>2. New Testament References:<P>In <a onClick="return mV(\'Jhn\',6,\'31-63\');">Joh 6:31-63</a>, our Lord frequently refers to "the manna" or "bread from heaven" as typical of Himself. Paul (<a onClick="return mV(\'1Cr\',10,3);">1Co 10:3</a>) refers to it as "spiritual food," and in <a onClick="return mV(\'Rev\',2,17);">Re 2:17</a> we read, "To him that overcometh, to him will I give of the hidden manna."<P>Manna, as might be expected, figures largely in rabbinical literature. It was, it is said, adapted to the taste of each individual who could by wishing taste in the manna anything he desired (compare The <span class="noTag">Wisdom of Solomon 16:21</span>). Manna is reserved as the future food of the righteous (compare <a onClick="return mV(\'Rev\',2,17);">Re 2:17</a>), for which purpose it is ground in a mill situated in the third heaven (Chag 12b; Tan. Beshallach 22).<P>3. Natural Explanations:<P>No substance is known which in any degree satisfies all the requirements of the Scriptural references, but several travelers in the wilderness have reported phenomena which suggest some of the features of the miraculous manna.<P>(1) In the Peninsula of Sinai, on the route of the children of Israel, a species of tamarisk, named in consequence by Ebers Tammaris mannifera, is found to exude a sweet, honey-like substance where its bark is pierced by an insect, Gossyparia mannifera. It collects upon the twigs and falls to the ground. The Arabs who gather it to sell to pilgrims call it mann-es-sama, "heavenly manna"; it is white at first but turns yellow; in the early morning it is of the consistency of wax but when the sun is hot it disappears. This substance occurs only after mid-summer and for a month or two at most.<P>(2) A second proposal is to identify manna with a lichen—Lecanora esculenta and allied species—which grows in the Arabian and other deserts upon the limestone. The older masses become detached and are rolled about by the wind. When swept together by sudden rain storms in the rainy season they may collect in large heaps. This lichen has been used by the Arabs in time of need for making bread. It is a quite reasonable form of nourishment in the desert, especially when eaten with the sugary manna from the trees.``117';
isbe[5783]='Manner; Manners`man\'-er, man\'-erz (dabhar, derekh, mishpaT; ethos, houtos):<P>1. As Used in the Old Testament:<P>"Manner" (probably from manus, "the hand," mode of handling things, or acting) is in the Bible in general equivalent<P>(1) to way, custom, habit, etc.,<P>(2) to kind or sort.<P>There are some special senses, however, and archaic usages. It is frequently the translation of dabhar, "speaking," "word," "thing" (<a onClick="return mV(\'Gen\',18,25);">Ge 18:25</a>, "That be far from thee to do after this manner" (i.e. in this way); <a onClick="return mV(\'Gen\',32,19);">Ge 32:19</a>, "On this manner shall ye speak unto Esau" (in this way); <a onClick="return mV(\'Gen\',39,19);">Ge 39:19</a>, "After this manner (in this way) did thy servant to me"; <a onClick="return mV(\'Exd\',22,9);">Ex 22:9</a>, "every manner of trespass" (every kind, sort, or way); <a onClick="return mV(\'Deu\',15,2);">De 15:2</a>; <a onClick="return mV(\'1Sa\',17,27,30);">1Sa 17:27,30</a> bis); also of derekh, "way" (<a onClick="return mV(\'Gen\',19,31);">Ge 19:31</a>, "after the manner of all the earth (way); <a onClick="return mV(\'1Sa\',21,5);">1Sa 21:5</a> the King James Version "(the bread) is in a manner common"; "manner" here might be taken as equivalent to "way" or "measure," but the passage is a difficult one and the text uncertain; the Revised Version (British and American) omits "manner," and in the text makes the reference to be to the journey, not to the bread, but in the margin it has "common (bread)"; <a onClick="return mV(\'Isa\',10,24,26);">Isa 10:24,26</a>, after the manner of Egypt" (after the way or fate of Egypt); so also <a onClick="return mV(\'Amo\',4,10);">Am 4:10</a>; <a onClick="return mV(\'Amo\',8,14);">8:14</a>, the manner of Beer-sheba liveth" the Revised Version (British and American) "the way," margin "manner, the reference here being to the religious way, or manner of worship); of mishpat, "judgment," "ordinance," hence, also "manner" or "custom" (<a onClick="return mV(\'Gen\',40,13);">Ge 40:13</a>; <a onClick="return mV(\'Exd\',21,9);">Ex 21:9</a>; <a onClick="return mV(\'2Ki\',1,7);">2Ki 1:7</a>, "what manner of man" (sort or kind); <a onClick="return mV(\'2Ki\',17,26);">2Ki 17:26</a> the King James Version; <a onClick="return mV(\'1Ch\',24,19);">1Ch 24:19</a>; <a onClick="return mV(\'Eze\',11,12);">Eze 11:12</a>, "after the manners (the Revised Version (British and American) "ordinances") of the nations"); torah, "instruction," "law," is also translated "manner" (<a onClick="return mV(\'2Sa\',7,19);">2Sa 7:19</a>, "(is) this the manner (margin "law") of man, O Lord God?" the Revised Version (British and American) "and this (too) after the manner of men, O Lord Yahweh," margin "and is this the law of man, O Lord Yahweh?"). Other words are: \'orach, "path," "custom" (<a onClick="return mV(\'Gen\',18,11);">Ge 18:11</a>); dobher, "leading," "pasture" (compare "sheep-walk," "sheep-fold"); <a onClick="return mV(\'Isa\',5,17);">Isa 5:17</a>, "Then shall the lambs feed after their manner," the Revised Version (British and American) "as in their pasture" (in <a onClick="return mV(\'Mic\',2,12);">Mic 2:12</a>, the same word is translated the King James Version "fold," the Revised Version (British and American) "pasture"); demuth, "likeness" (<a onClick="return mV(\'Eze\',23,15);">Eze 23:15</a>); dath, "law," "sentence" (<a onClick="return mV(\'Est\',2,12);">Es 2:12</a>); chuqqah, "statute," "custom" (<a onClick="return mV(\'Lev\',20,23);">Le 20:23</a>) in the King James Version. In <a onClick="return mV(\'Num\',5,13);">Nu 5:13</a> "with the manner" is supplied to "taken" (in adultery). "Manner" here is an old law-French phrase, "a thief taken with the mainour"—that is, with the thing stolen upon him in manu (in his hand) (Blackstone, Comm., IV, xxiii), the Revised Version (British and American) "in the act" (compare <a onClick="return mV(\'Jhn\',8,4);">Joh 8:4</a> "in the very act"); gam, "also" is translated (<a onClick="return mV(\'1Sa\',19,24);">1Sa 19:24</a>) "in like manner," the Revised Version (British and American) "also."<P>2. As Used in the Apocrypha:<P>In Apocrypha, 2Macc 4:13 the King James Version, we have "increase of heathenish manners," the Revised Version (British and American) "an extreme of Greek fashions"; 2Macc 6:9, the "manners of the Gentiles," the Revised Version (British and American) "the Greek rites"; in 2Esdras 9:19, the King James Version and the Revised Version (British and American), "manners" appears in the sense of "morals"; compare <a onClick="return mV(\'1Cr\',15,33);">1Co 15:33</a>, the Revised Version (British and American) "Evil companionships corrupt good morals."<P>3. As Used in the New Testament:<P>In the New Testament various words and phrases are rendered by "manner"; we have ethos, "custom," "usage," "manner" (<a onClick="return mV(\'Jhn\',19,40);">Joh 19:40</a>; <a onClick="return mV(\'Act\',15,1);">Ac 15:1</a>, the Revised Version (British and American) "custom"); kata to eiothos (<a onClick="return mV(\'Luk\',4,16);">Lu 4:16</a>, the Revised Version (British and American) "as his custom was"); tropos a "turning," "manner," "way" (<a onClick="return mV(\'Jud\',1,7);">Jude 1:7</a>); hon tropon, "in which manner" (<a onClick="return mV(\'Act\',1,11);">Ac 1:11</a>); houtos, "thus," "so," "accordingly," is "after this manner," "in like manner" (<a onClick="return mV(\'Mat\',6,9);">Mt 6:9</a>; <a onClick="return mV(\'Mar\',13,29);">Mr 13:29</a> the King James Version); in <a onClick="return mV(\'Act\',15,23);">Ac 15:23</a>, "after this manner" stands in the King James Version for "by their hands," the Revised Version (British and American) "thus"; pos (<a onClick="return mV(\'Act\',20,18);">Ac 20:18</a>), "after what manner"; agoge, "course of life" (<a onClick="return mV(\'2Ti\',3,10);">2Ti 3:10</a>, the Revised Version (British and American) "conduct"); biosis, "mode of life" (<a onClick="return mV(\'Act\',26,4);">Ac 26:4</a>); in <a onClick="return mV(\'1Cr\',15,33);">1Co 15:33</a>, we have manners in the moral sense, "Evil communications corrupt good manners," the American Standard Revised Version "Evil companionships corrupt good morals." <a onClick="return mV(\'Act\',13,18);">Ac 13:18</a> is interesting because of diversities of rendering; the King James Version has "suffered he their manners in the wilderness," margin "etropophoresen, perhaps for etrophophoresen, bore, or fed them as a nurse beareth or feedeth her child, <a onClick="return mV(\'Deu\',1,31);">De 1:31</a> (2Macc 7:27) according to Septuagint, and so Chrysostom"; the English Revised Version text, same as the King James Version margin "Many ancient authorities read \'bear he them as a nursing father in the wilderness.\' See <a onClick="return mV(\'Deu\',1,31);">De 1:31</a>"; the American Standard Revised Version (text) "as a nursing-father bare he them in the wilderness," margin "Many ancient authorities read \'Suffered he their manners in the wilderness.\' See <a onClick="return mV(\'Deu\',9,7);">De 9:7</a>." The Greek words differ only by a single letter, and authorities are pretty equally divided.<P>Among other changes the Revised Version (British and American) has frequently "ordinance" for "manner" (<a onClick="return mV(\'Lev\',5,10);">Le 5:10</a>, etc.) and "custom" (<a onClick="return mV(\'Rth\',4,7);">Ru 4:7</a>; <a onClick="return mV(\'Jhn\',19,40);">Joh 19:40</a>; <a onClick="return mV(\'Hbr\',10,25);">Heb 10:25</a>, etc.); "manner of" is introduced (<a onClick="return mV(\'1Sa\',4,8);">1Sa 4:8</a>, etc.); "manner of" and "manner" omitted (<a onClick="return mV(\'Gen\',25,23);">Ge 25:23</a>; <a onClick="return mV(\'Exd\',35,29);">Ex 35:29</a>, etc.); "what manner of house" for "where is the house" (<a onClick="return mV(\'Isa\',66,1);">Isa 66:1</a>); "manner of life" for "conversation" (<a onClick="return mV(\'Gal\',1,13);">Ga 1:13</a>; <a onClick="return mV(\'Eph\',4,22);">Eph 4:22</a>); "after the manner of men" for "as a man" (<a onClick="return mV(\'Rom\',3,5);">Ro 3:5</a>; <a onClick="return mV(\'1Cr\',9,8);">1Co 9:8</a>); "how to inquire concerning these things" (<a onClick="return mV(\'Act\',25,20);">Ac 25:20</a>) for "of such manner of questions"; "in an unworthy manner," the American Standard Revised Version, for "unworthily" (<a onClick="return mV(\'1Cr\',11,27);">1Co 11:27</a>); "who" for "what manner of man" (<a onClick="return mV(\'Mar\',4,41);">Mr 4:41</a>; <a onClick="return mV(\'Luk\',8,25);">Lu 8:25</a>, "who then is this?"); in <a onClick="return mV(\'Luk\',9,55);">Lu 9:55</a>, "Ye know not what manner of spirit ye are of" is omitted, with the margin "Some ancient authorities add and said, Ye know not what manner of spirit ye are of."``185';
isbe[5784]='Manoah`ma-no\'-a (manoach, "rest"): A man of Zorah and of the family of the Danites. Manoah was the father of Samson, and his life-story is but imperfectly told in the history of the conception, birth and early life of his son. No children had been born to Manoah and his wife, and the latter was considered barren (<a onClick="return mV(\'Jdg\',13,2);">Jud 13:2</a>). Finally it was revealed to her by an angel of the Lord that she would conceive and bear a child. She was cautioned against strong drink and "unclean" food, for her child was to be born and reared a Nazirite to the end that he might save Israel out of the hands of the Philistines (<a onClick="return mV(\'Jdg\',13,\'3-5\');">Jud 13:3-5</a>). That Manoah was a devout man seems certain in view of the fact that, upon hearing of the angel\'s visit, he offered a prayer for the angel\'s return, in order that he and his wife might be instructed as to the proper care of the child to be born (<a onClick="return mV(\'Jdg\',13,8);">Jud 13:8</a>). The request was granted and the angel repeated the visit and the instructions (<a onClick="return mV(\'Jdg\',13,\'9-13\');">Jud 13:9-13</a>). Manoah with true hospitality would have the guest remain and partake of food. The angel refused, but commanded a sacrifice unto Yahweh. When Manoah had prepared the sacrifice and lit it on the altar, the angel ascended in the flame from the altar and appeared no more (<a onClick="return mV(\'Jdg\',13,\'15-21\');">Jud 13:15-21</a>). The child was born according to the promise and was named Samson. Manoah and his wife appear twice in the narrative of Samson\'s early life—once as they protestingly accompanied him to sue for the hand of a Philistine woman of Timnah in marriage, and again when they went with him to Timnab for the wedding.<P>Josephus richly embellishes this Scriptural narrative concerning Manoah, but offers no further light upon the occupation or character of Manoah. At the death of Samson, his brothers went down to Gaza and brought back the body and buried it by the side of Manoah in the family tomb near Zorah (<a onClick="return mV(\'Jdg\',16,31);">Jud 16:31</a>). In Samson Agonistes Milton gains dramatic effect by having Manoah survive Samson and in deep sorrow assist at his burial.``158';
isbe[5785]='Manservant`man\'sur-vant (\'ebhedh): A male slave; usually coupled with maidservant or female slave (<a onClick="return mV(\'Gen\',12,16);">Ge 12:16</a>; <a onClick="return mV(\'Exd\',20,10);">Ex 20:10</a>; <a onClick="return mV(\'1Sa\',8,16);">1Sa 8:16</a>; <a onClick="return mV(\'Job\',31,13);">Job 31:13</a>; <a onClick="return mV(\'Luk\',12,45);">Lu 12:45</a>).`<a href="./study/isbe/search.html?string=SERVANT">SERVANT</a>; <a href="./study/isbe/search.html?string=SLAVE">SLAVE</a>`1';
isbe[5786]='Mansion`man\'-shun (mone, "abode"): In <a onClick="return mV(\'Jhn\',14,2);">Joh 14:2</a>, the word is used in the plural: "In my Father\'s house are many mansions," the Revised Version margin "abiding places." The ideas conveyed are those of abundance of room, and permanence of habitation, in the heavenly world.``1';
