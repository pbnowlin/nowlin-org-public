<script type="text/javascript">
isbe = [];

isbe[5701]='Mahavite`ma\'-ha-vit (machawim, "villagers"): The description given to Eliel, one of David\'s warrior guard (<a onClick="return mV(\'1Ch\',11,46);">1Ch 11:46</a>), perhaps to distinguish him from the Eliel in the next verse. Massoretic Text is very obscure here.``1';
isbe[5702]='Mahazioth`ma-ha\'-iz-oth, ma-ha\'-zi-oth (machazi\'oth "visions"): One of the 14 sons of Heman the Kohathite in the temple choir. "He was leader of the 23rd course of musicians whose function was to blow the horns" (<a onClick="return mV(\'1Ch\',25,4,30);">1Ch 25:4,30</a>).``1';
isbe[5703]='Maher-Shalal-Hash-Baz`ma\'-her-shal\'-al-hash\'-baz (maher shalal chash baz, "the spoil speedeth; the prey hasteth"): Asymbolic name given to Isaiah\'s son to signify the sharp destruction of Rezin and Pekah by the Assyrian power (<a onClick="return mV(\'Isa\',8,1,3);">Isa 8:1,3</a>). Compare the Greek idea of Nemesis.``1';
isbe[5704]='Mahlah`ma\'-la (machlah "sickness" or "song," etymology doubtful):<P>(1) Eldest of Zelophehad\'s 5 daughters (<a onClick="return mV(\'Num\',26,33);">Nu 26:33</a>; <a onClick="return mV(\'Num\',27,1);">27:1</a>). As Zelophehad, grandson of Manasseh, had no sons, the daughters successfully claimed their father\'s inheritance. The law was altered in their favor on condition that they married into their father\'s tribe. They agreed and married their cousins (<a onClick="return mV(\'Num\',36,11);">Nu 36:11</a>). The whole chapter should be read and compared with <a onClick="return mV(\'Jos\',17,3);">Jos 17:3</a>ff, because the decision became a precedent.<P>(2) Another (the King James Version "Mahalah"), same Hebrew name as above, daughter of Hammoleketh, grand-daughter of Manasseh (<a onClick="return mV(\'1Ch\',7,18);">1Ch 7:18</a>).``186';
isbe[5705]='Mahli`ma\'-li (machli, "a sick or weak one"\'):<P>(1) A son of Merari (<a onClick="return mV(\'Exd\',6,19);">Ex 6:19</a>, the King James Version Mahali; <a onClick="return mV(\'Num\',3,20);">Nu 3:20</a>), grandson of Levi and founder of the Levitical family of <a href="./study/isbe/search.html?string=MAHLITES">MAHLITES</a> (which see).<P>(2) A son of Mushi, Mahli\'s brother, bears the same name (<a onClick="return mV(\'1Ch\',6,47);">1Ch 6:47</a>; <a onClick="return mV(\'1Ch\',23,23);">23:23</a>; <a onClick="return mV(\'1Ch\',24,30);">24:30</a>). Compare <a onClick="return mV(\'Ezr\',8,18);">Ezr 8:18</a> and 1Esdras 8:47.``1';
isbe[5706]='Mahlites`ma\'-lits (machli): Descendants of Mahli, son of Merari (<a onClick="return mV(\'Num\',3,33);">Nu 3:33</a>; <a onClick="return mV(\'Num\',26,58);">26:58</a>). These Mahlites appear to have followed the example of the daughters of Zelophehad, mutatis mutandis. (See <a href="./study/isbe/search.html?string=MAHLAH">MAHLAH</a>; had the name become the description of a practice?) They married the daughters of their uncle Eleazar (<a onClick="return mV(\'1Ch\',23,21,22);">1Ch 23:21,22</a>).``1';
isbe[5707]='Mahlon`ma\'-lon (machlon, "invalid"): Ruth\'s first husband (<a onClick="return mV(\'Rth\',1,2,5);">Ru 1:2,5</a>; <a onClick="return mV(\'Rth\',4,9,10);">4:9,10</A>). In the latter passage is further evidence of the unwillingness to allow a family connection or inheritance to drop (see <a href="./study/isbe/search.html?string=MAHLAH">MAHLAH</a>; <a href="./study/isbe/search.html?string=MAHLI">MAHLI</a>). Note that David\'s descent and that of his "Greater Son" come through Ruth and Boaz (<a onClick="return mV(\'Rth\',4,22);">Ru 4:22</a>).``1';
isbe[5708]='Mahol`ma\'-hol (machol, "dance"; compare bene-machol, "sons of dance"): The father of the 4 sages reputed next in wisdom to Solomon (<a onClick="return mV(\'1Ki\',4,31);">1Ki 4:31</a>). Their names were Ethan, Heman, Chalcol, Darda.``1';
isbe[5709]='Mahseiah`ma-se\'-ya, ma-si\'-a (machceyah, "Yah a refuge"): Grandfather of Baruch (<a onClick="return mV(\'Jer\',32,12);">Jer 32:12</a>) and of Seraiah (<a onClick="return mV(\'Jer\',51,59);">Jer 51:59</a>). The name (not to be confused with <a href="./study/isbe/search.html?string=MAASEIAH">MAASEIAH</a> (which see) as the King James Version has done even in the above passages) is spelt "<a href="./study/isbe/search.html?string=MAASEAS">Maaseas</a>" (which see) in Baruch 1:1.``1';
isbe[5710]='Maiannas`mi-an\'-as (Maiannas; the King James Version Maianeas): One of the Levites who taught the law for Esdras (1Esdras 9:48) = <a href="./study/isbe/search.html?string=MAASEIAH">MAASEIAH</a> (which see) in <a onClick="return mV(\'Neh\',8,7);">Ne 8:7</a>.``1';
isbe[5711]='Maid; Maiden`mad, mad\'-\'n: Used in the King James Version in the sense of a girl or young female; of an unmarried woman or virgin, and of a female servant or handmaid. Thus, it translates several Hebrew words:<P>(1) The more generic word is na\'arah, "girl," feminine form of the common na\'ar, "boy" (<a onClick="return mV(\'1Sa\',9,11);">1Sa 9:11</a>; <a onClick="return mV(\'2Ki\',5,2,4);">2Ki 5:2,4</a>; <a onClick="return mV(\'Est\',2,4,7);">Es 2:4,7</a>ff; <a onClick="return mV(\'Job\',41,5);">Job 41:5</a>; <a onClick="return mV(\'Amo\',2,7);">Am 2:7</a>) In several places masculine form na\'ar, with feminine form of verb rendered "damsel" (<a onClick="return mV(\'Gen\',24,14,16,28,55);">Ge 24:14,16,28,55</a>; <a onClick="return mV(\'Gen\',34,3,12);">34:3,12</a>; <a onClick="return mV(\'Deu\',22,15);">De 22:15</a>); compare he pais (<a onClick="return mV(\'Luk\',8,51,54);">Lu 8:51,54</a>); see also paidiske, diminutive (Sirach 41:22; <a onClick="return mV(\'Mar\',14,66,69);">Mr 14:66,69</a>; <a onClick="return mV(\'Luk\',12,45);">Lu 12:45</a>; korasion, Septuagint for na\'arah, "maid," in <a onClick="return mV(\'Mat\',9,24);">Mt 9:24</a>f with <a onClick="return mV(\'Job\',6,12);">Job 6:12</a>f; Susanna verses 15,19).<P>(2) The Hebrew \'almah, also rendered "maid," refers to a woman of marriageable age (<a onClick="return mV(\'Exd\',2,8);">Ex 2:8</a>; <a onClick="return mV(\'Pro\',30,19);">Pr 30:19</a>), whether married or not, whether a virgin or not. The same word is translated "virgin" in several places (<a onClick="return mV(\'Gen\',24,43);">Ge 24:43</a> the King James Version; <a onClick="return mV(\'Sgs\',1,3);">So 1:3</a>; <a onClick="return mV(\'Sgs\',6,8);">6:8</a>; <a onClick="return mV(\'Isa\',7,14);">Isa 7:14</a>).<P>(3) The word bethulah, a common Hebrew word for "virgin," a chaste woman Septuagint parthenos), is frequently rendered "maid" and "maiden" (<a onClick="return mV(\'Exd\',22,16);">Ex 22:16</a>; <a onClick="return mV(\'Jdg\',19,24);">Jud 19:24</a>; <a onClick="return mV(\'2Ch\',36,17);">2Ch 36:17</a>; <a onClick="return mV(\'Psa\',78,63);">Ps 78:63</a>; <a onClick="return mV(\'Psa\',148,12);">148:12</a>; <a onClick="return mV(\'Jer\',51,22);">Jer 51:22</a>; <a onClick="return mV(\'Lam\',5,11);">La 5:11</a>; <a onClick="return mV(\'Eze\',9,6);">Eze 9:6</a>; <a onClick="return mV(\'Eze\',44,22);">44:22</a>; <a onClick="return mV(\'Zec\',9,17);">Zec 9:17</a>; compare <a onClick="return mV(\'Deu\',22,14,17);">De 22:14,17</a>, having "the marks (tokens) of virginity"); bethulim, rendered "maid." See <a href="./study/isbe/search.html?string=VIRGIN">VIRGIN</a>.<P>(4) Two Hebrew words covering the idea of service, handmaid, handmaiden, and in numerous passages so rendered:<P>(a) \'amah, translated "maid" (<a onClick="return mV(\'Gen\',30,3);">Ge 30:3</a>; <a onClick="return mV(\'Exd\',2,5);">Ex 2:5</a>; <a onClick="return mV(\'Exd\',21,20,26);">21:20,26</a>; <a onClick="return mV(\'Lev\',25,6);">Le 25:6</a>; <a onClick="return mV(\'Ezr\',2,65);">Ezr 2:65</a>; <a onClick="return mV(\'Job\',19,15);">Job 19:15</a>; <a onClick="return mV(\'Nah\',2,7);">Na 2:7</a>);<P>(b) shiphchah, "a family servant," "a handmaid," so rendered in numerous passages ("maid," "maiden," <a onClick="return mV(\'Gen\',16,2);">Ge 16:2</a>ff; <a onClick="return mV(\'Gen\',29,24,29);">29:24,29</a>; <a onClick="return mV(\'Gen\',30,7,9,10,12,18);">30:7,9,10,12,18</a>; <a onClick="return mV(\'Isa\',24,2);">Isa 24:2</a>; <a onClick="return mV(\'Psa\',123,2);">Ps 123:2</a>; <a onClick="return mV(\'Ecc\',2,7);">Ec 2:7</a>). In the King James Version they are variously translated "maid," "handmaid," etc.<P>(5) The rather rare word habra, "favorite slave," is rendered "maid" in Judith 10:2,5; 13:9; 16:23; <span class="noTag">Additions to Esther 15:2,7</span>.<P>(6) doule, "female slave," in the King James Version Judith 12:49 (the Revised Version (British and American) "servant").<P>Maidservant means simply a female slave in the different positions which such a woman naturally occupies. They were the property of their masters; sometimes held the position of concubines (<a onClick="return mV(\'Gen\',31,33);">Ge 31:33</a>); daughters might be sold by their fathers into this condition (<a onClick="return mV(\'Exd\',21,7);">Ex 21:7</a>). It is regrettable that no uniform translation was adopted in the King James Version. And in the Revised Version (British and American) compare Tobit 3:7; Judith 10:10; Sirach 41:22.<P>"Maidservants" replaces "maidens" of the King James Version in <a onClick="return mV(\'Luk\',12,45);">Lu 12:45</a>. Compare <a onClick="return mV(\'Job\',31,13);">Job 31:13</a>.``137';
isbe[5712]='Mail`mal.`<a href="./study/isbe/search.html?string=ARMOR">ARMOR</a>`1';
isbe[5713]='Maimed`mam\'-d (charuts; kullos, anaperos): The condition of being mutilated or rendered imperfect as the result of accident, in contrast to congenital malformation. An animal thus affected was declared to be unfit to be offered in sacrifice as a peace offering (<a onClick="return mV(\'Lev\',22,22);">Le 22:22</a>); although under certain conditions a congenitally deformed animal might be accepted as a free-will offering, apparently the offering of a maimed animal was always prohibited (<a onClick="return mV(\'Lev\',22,23,24);">Le 22:23,24</a>). The use of such animals in sacrifice was one of the charges brought against the Jews of his time by Malachi (<a onClick="return mV(\'Mal\',1,\'8-14\');">1:8-14</a>). The word is also used to denote those who were so mutilated. Among those made whole by our Lord in Galilee were the maimed as well as the halt (<a onClick="return mV(\'Mat\',15,30);">Mt 15:30</a>).<P>Figuratively the casting off of any evil habit or distracting condition which interferes with the spiritual life is called "maiming" (<a onClick="return mV(\'Mat\',18,8);">Mt 18:8</a>; <a onClick="return mV(\'Mar\',9,43);">Mr 9:43</a>); with this may be taken the lesson in <a onClick="return mV(\'Mat\',19,12);">Mt 19:12</a>. In these passages "maimed" (kullos) is used of injuries of the upper limb, and cholos of those affecting the feet, rendering one halt. Hippocrates, however, uses kullos for a deformation of the legs in which the knees are bent so far outward as to render the patient lame; while he applies the term cholos as a generic name for any distortion, and in one place uses it to describe a mutilation of the head (Prorrhetica, 83). The maimed and the halt are among the outcasts who are to be brought into the gospel feast according to the parable (<a onClick="return mV(\'Luk\',14,\'13-21\');">Lu 14:13-21</a>).``107';
isbe[5714]='Mainsall`man\'-sal.`<a href="./study/isbe/search.html?string=SHIPS+AND+BOATS">SHIPS AND BOATS</a>`1';
isbe[5715]='Makaz`ma\'-kaz (maqats): One of the cities of the 2nd of the 12 districts or prefectures which supplied victuals for Solomon (<a onClick="return mV(\'1Ki\',4,9);">1Ki 4:9</a>). It is associated with Shaalbim, Beth-shemesh and Elon-beth-hanan, all three probably identical with cities mentioned (<a onClick="return mV(\'Jos\',19,41,42);">Jos 19:41,42</a>) as on the border of Dan. Cheyne (EB, II, col. 2906) suggests that Makaz may be identical with <a href="./study/isbe/search.html?string=MEJARGON">MEJARGON</a> (which see) in the latter list.``1';
isbe[5716]='Make, Maker`mak, mak\'-er (\'asah, nathan, sum; poieo, tithemi, kathistemi):<P>1. As Used in the Old Testament:<P>"Make" is a frequently used word, meaning "to create," "construct," "cause," "constitute," etc., and represents different Hebrew words. It is very often in the King James Version<P>(1) the translation of \'asah, "to do," "make," etc., usually\' in the sense of constructing, effecting. In <a onClick="return mV(\'Gen\',1,7,16,25,31);">Ge 1:7,16,25,31</a>, etc., it is used of the creation; of the creation of man in the likeness of God (<a onClick="return mV(\'Gen\',5,1);">5:1</a>); of the ark (<a onClick="return mV(\'Gen\',6,14);">6:14</A>); of a feast (<a onClick="return mV(\'Gen\',21,8);">21:8</A>); of the tabernacle and all the things belonging to it (<a onClick="return mV(\'Exd\',25,8);">Ex 25:8</a>, etc.); of idols (<a onClick="return mV(\'Isa\',2,8);">Isa 2:8</a>; <a onClick="return mV(\'Jer\',2,28);">Jer 2:28</a>, etc.);<P>(2) of nathan (literally, "to give"), chiefly in the sense of constituting, appointing, causing; of a covenant (<a onClick="return mV(\'Gen\',9,12);">Ge 9:12</a>; <a onClick="return mV(\'Gen\',17,2);">17:2</a>); of Abraham as the father of many nations, etc. (<a onClick="return mV(\'Gen\',17,5,6);">Ge 17:5,6</a>); of Ishmael as a great nation (<a onClick="return mV(\'Gen\',17,20);">Ge 17:20</a>); of Moses as a god to Pharaoh (<a onClick="return mV(\'Exd\',7,1);">Ex 7:1</a>); of judges and officers (<a onClick="return mV(\'Deu\',16,18);">De 16:18</a>); of laws (<a onClick="return mV(\'Lev\',26,46);">Le 26:46</a>, etc.); it has the meaning of "to cause" (<a onClick="return mV(\'Exd\',18,16);">Ex 18:16</a>; <a onClick="return mV(\'Exd\',23,27);">23:27</a>; <a onClick="return mV(\'Num\',5,21);">Nu 5:21</a>; <a onClick="return mV(\'1Sa\',9,22);">1Sa 9:22</a>; <a onClick="return mV(\'Psa\',106,46);">Ps 106:46</a>);<P>(3) sum, "to set," "put," "lay," has a similar significance: of Abraham\'s seed (<a onClick="return mV(\'Gen\',13,16);">Ge 13:16</a>; <a onClick="return mV(\'Gen\',32,12);">32:12</a>); Joseph lord of all Egypt (<a onClick="return mV(\'Gen\',45,9);">Ge 45:9</a>; compare <a onClick="return mV(\'Exd\',2,14);">Ex 2:14</a>; <a onClick="return mV(\'Deu\',1,13);">De 1:13</a>; <a onClick="return mV(\'Deu\',10,22);">10:22</a>);<P>(4) shith, with same meaning, occurs (<a onClick="return mV(\'2Sa\',22,12);">2Sa 22:12</a>, "He made darkness pavilions round about him"; <a onClick="return mV(\'1Ki\',11,34);">1Ki 11:34</a>; <a onClick="return mV(\'Psa\',18,11);">Ps 18:11</a>; <a onClick="return mV(\'Psa\',21,6);">21:6</a>).<P>Other words are \'abhadh (Aramaic); "to make," "do," (<a onClick="return mV(\'Jer\',10,11);">Jer 10:11</a>; <a onClick="return mV(\'Dan\',3,1);">Da 3:1</a>); \'amadh, "to set up" (<a onClick="return mV(\'2Ch\',11,22);">2Ch 11:22</a>; <a onClick="return mV(\'2Ch\',25,5);">25:5</a>; <a onClick="return mV(\'Neh\',10,32);">Ne 10:32</a>); \'atsabh, "to labor," etc. (<a onClick="return mV(\'Job\',10,8);">Job 10:8</a>, the King James Version margin "took pains about me"); banah, "to build up" (<a onClick="return mV(\'Gen\',2,22);">Ge 2:22</a>; <a onClick="return mV(\'1Ki\',22,39);">1Ki 22:39</a>); bara\', "to prepare," "create" (<a onClick="return mV(\'Num\',16,30);">Nu 16:30</a>; <a onClick="return mV(\'Psa\',89,47);">Ps 89:47</a>); yatsagh, "to set up" (<a onClick="return mV(\'Job\',17,6);">Job 17:6</a>; <a onClick="return mV(\'Jer\',51,34);">Jer 51:34</a>); yatsar, "to form," "constitute" (<a onClick="return mV(\'Psa\',74,17);">Ps 74:17</a>; <a onClick="return mV(\'Psa\',104,26);">104:26</a>); pa\'al, "to work," "make" (<a onClick="return mV(\'Exd\',15,17);">Ex 15:17</a>; <a onClick="return mV(\'Psa\',7,15);">Ps 7:15</a>); words with special meanings are: paqadh, "to give a charge" (<a onClick="return mV(\'1Ki\',11,28);">1Ki 11:28</a>; <a onClick="return mV(\'2Ki\',25,23);">2Ki 25:23</a>); karath, "to cut," or "prepare", "to make a convent or league" (<a onClick="return mV(\'Gen\',15,18);">Ge 15:18</a>; <a onClick="return mV(\'Exd\',24,8);">Ex 24:8</a>; <a onClick="return mV(\'Jos\',9,16);">Jos 9:16</a>); qashar, "to bind together," "to make a conspiracy" (<a onClick="return mV(\'2Ki\',12,20);">2Ki 12:20</a>; <a onClick="return mV(\'2Ki\',14,19);">14:19</a>); parats, "to break forth," "to make a breach" (<a onClick="return mV(\'2Sa\',6,8);">2Sa 6:8</a>; <a onClick="return mV(\'1Ch\',13,11);">1Ch 13:11</a>; <a onClick="return mV(\'1Ch\',15,13);">15:13</a>); labhen, "to make brick" (<a onClick="return mV(\'Gen\',11,3);">Ge 11:3</a>); labhabh (denominative of lebhibhah), "to make cakes" (<a onClick="return mV(\'2Sa\',13,6,8);">2Sa 13:6,8</a>); malakh, "to make a king" (<a onClick="return mV(\'1Sa\',8,22);">1Sa 8:22</a>; <a onClick="return mV(\'1Sa\',12,1);">12:1</a>); among obsolete and archaic words and phrases may be mentioned, "What makest thou in this place?" (<a onClick="return mV(\'Jdg\',18,3);">Jud 18:3</a>), the Revised Version (British and American) "doest"; "made" for "pretend" (<a onClick="return mV(\'2Sa\',13,5,6);">2Sa 13:5,6</a>), the Revised Version (British and American) "feign," "feigned"; "made as if" (<a onClick="return mV(\'Jos\',8,15);">Jos 8:15</a>; <a onClick="return mV(\'Jos\',9,4);">9:4</a>), so the Revised Version (British and American); "make for him" (<a onClick="return mV(\'Eze\',17,17);">Eze 17:17</a>), the Revised Version (British and American) "help him"; "make mention" (<a onClick="return mV(\'Jer\',4,16);">Jer 4:16</a>); "make mention of" (<a onClick="return mV(\'Gen\',40,14);">Ge 40:14</a>; <a onClick="return mV(\'Psa\',87,4);">Ps 87:4</a>); "make account" (<a onClick="return mV(\'Psa\',144,3);">Ps 144:3</a>); "make an end" (<a onClick="return mV(\'Jdg\',3,18);">Jud 3:18</a>; <a onClick="return mV(\'Jdg\',15,17);">15:17</a>); "make an end" is also "to bring to nought," "to destroy" (<a onClick="return mV(\'Isa\',38,12);">Isa 38:12</a>); "make riddance" (<a onClick="return mV(\'Lev\',23,22);">Le 23:22</a>), the Revised Version (British and American) "wholly reap." In 1Macc 16:22, we have "to make him away" as translation of apolesai auton, the Revised Version (British and American) "destroy."<P>Maker is the translation of \'asah (<a onClick="return mV(\'Job\',4,17);">Job 4:17</a>; <a onClick="return mV(\'Psa\',95,6);">Ps 95:6</a>), of yatsar (<a onClick="return mV(\'Isa\',45,9,11);">Isa 45:9,11</a>; <a onClick="return mV(\'Hab\',2,18);">Hab 2:18</a> twice), of charash, "graver" (<a onClick="return mV(\'Isa\',45,16);">Isa 45:16</a>), of pa\'al (<a onClick="return mV(\'Job\',36,3);">Job 36:3</a>; <a onClick="return mV(\'Isa\',1,31);">Isa 1:31</a>, or po\'al).<P>2. As Used in the New Testament:<P>In the New Testament the chief word for "make" is poieo, "to do," "make," etc. (<a onClick="return mV(\'Mat\',3,3);">Mt 3:3</a>; <a onClick="return mV(\'Jhn\',2,16);">Joh 2:16</a>; <a onClick="return mV(\'Jhn\',5,15);">5:15</a>); of kathistemi, "to set down," "to appoint" (<a onClick="return mV(\'Mat\',24,45,47);">Mt 24:45,47</a>; <a onClick="return mV(\'Rom\',5,19);">Ro 5:19</a>); of tithemi, "to set," "lay" (<a onClick="return mV(\'Mat\',22,44);">Mt 22:44</a>; <a onClick="return mV(\'Mar\',12,36);">Mr 12:36</a>); of diatithemi, "to set or lay throughout" (<a onClick="return mV(\'Act\',3,25);">Ac 3:25</a>; <a onClick="return mV(\'Hbr\',8,10);">Heb 8:10</a>; <a onClick="return mV(\'Hbr\',10,16);">10:16</a>); of didomi, "to give" (<a onClick="return mV(\'2Th\',3,9);">2Th 3:9</a>; <a onClick="return mV(\'Rev\',3,9);">Re 3:9</a>); of eimi, "to be" (<a onClick="return mV(\'Mar\',12,42);">Mr 12:42</a>); of epiteleo "to complete" (<a onClick="return mV(\'Hbr\',8,5);">Heb 8:5</a>; <a onClick="return mV(\'Gal\',3,3);">Ga 3:3</a>, "make perfect," the Revised Version margin "make an end"); of Kataskeuazo, "to prepare thoroughly" (<a onClick="return mV(\'Hbr\',9,2);">Heb 9:2</a>, the Revised Version (British and American) "prepared"); of ktizo, "to make" "found" (<a onClick="return mV(\'Eph\',2,15);">Eph 2:15</a>); of plerophoreo, "to bear "on fully" (<a onClick="return mV(\'2Ti\',4,5);">2Ti 4:5</a>, "make full proof of thy ministry," the Revised Version (British and American) "fulfil"); doxazo "to make honorable or glorious" (<a onClick="return mV(\'2Cr\',3,10);">2Co 3:10</a>); of peritrepo (eis manian), "to turn round to raving" (<a onClick="return mV(\'Act\',26,24);">Ac 26:24</a>, "doth make thee mad," the Revised Version (British and American) "is turning thee mad," margin "Greek: turneth thee to madness"); of emporeuomai, "to traffic," "cheat" (<a onClick="return mV(\'2Pe\',2,3);">2Pe 2:3</a> "make merchandise of you"); of eirenopoieo, "to make peace" (<a onClick="return mV(\'Col\',1,20);">Col 1:20</a>); of sumballo, "to throw together" (<a onClick="return mV(\'Luk\',14,31);">Lu 14:31</a>; "to make war," the Revised Version (British and American) "goeth to encounter"); "made" is frequently the translation of ginomai, "to become," "begin to be" (<a onClick="return mV(\'Mat\',4,3);">Mt 4:3</a>; <a onClick="return mV(\'Mat\',9,16);">9:16</a>; <a onClick="return mV(\'Mar\',2,21,27);">Mr 2:21,27</a>; <a onClick="return mV(\'Jhn\',1,3,10);">Joh 1:3 (thrice), 10</a>,"The world was made through him," <a onClick="return mV(\'Jhn\',1,14);">1:14</A>, "The word was made flesh," the Revised Version (British and American) "became flesh"; <a onClick="return mV(\'Jhn\',2,9);">2:9</a>, water "made wine," the Revised Version (British and American) "now become wine," margin "that it had become"; <a onClick="return mV(\'Jhn\',8,33);">8:33</A>, "made free"\' <a onClick="return mV(\'Rom\',1,3);">Ro 1:3</a>, Revised Version "born" <a onClick="return mV(\'Gal\',3,13);">Ga 3:13</a>, the Revised Version (British and American) "having become a curse for us"; <a onClick="return mV(\'Gal\',4,4);">4:4</A>, the Revised Version (British and American) "born of a woman," etc.; <a onClick="return mV(\'Phl\',2,7);">Php 2:7</a>, "was made in the likeness of men," the Revised Version margin "Greek: becoming in"; <a onClick="return mV(\'1Pe\',2,7);">1Pe 2:7</a>, etc.).<P>In addition to the changes in the Revised Version (British and American) already noted may be mentioned, for "maketh collops" (<a onClick="return mV(\'Job\',15,27);">Job 15:27</a>) "gathered fat"; for "set us in the way of his steps" (<a onClick="return mV(\'Psa\',85,13);">Ps 85:13</a>), "make his footsteps a way to walk in"; for "did more grievously afflict her" (<a onClick="return mV(\'Isa\',9,1);">Isa 9:1</a>), "hath made it glorious"; for "shall make him of quick understanding" (<a onClick="return mV(\'Isa\',11,3);">Isa 11:3</a>), \'his delight shall be in"; for "make sluices and ponds for fish" (<a onClick="return mV(\'Isa\',19,10);">Isa 19:10</a>), "they that work for hire," margin "or make dams "; for "ye that make mention of the Lord" (<a onClick="return mV(\'Isa\',62,6);">Isa 62:6</a>), "ye that are Yahweh\'s remembrancers"; for "he shall confirm the covenant" (<a onClick="return mV(\'Dan\',9,27);">Da 9:27</a>), "he shall make a firm covenant"; for "maketh my way perfect" (<a onClick="return mV(\'2Sa\',22,33);">2Sa 22:33</a>), "guideth the perfect in his way" (see margin); for "the desire of a man is his kindness" (<a onClick="return mV(\'Pro\',19,22);">Pr 19:22</a>), "that which maketh a man to be desired"; for, "maketh intercession" (<a onClick="return mV(\'Rom\',11,2);">Ro 11:2</a>), "pleadeth"; for hath made us accepted" (<a onClick="return mV(\'Eph\',1,6);">Eph 1:6</a>), "freely bestowed on us," margin "wherewith he endued us"; for "made himself of no reputation" (<a onClick="return mV(\'Phl\',2,7);">Php 2:7</a>), "emptied himself"; for "spoil you" (<a onClick="return mV(\'Col\',2,8);">Col 2:8</a>), "maketh spoil of you"; for "is the enemy of God" (<a onClick="return mV(\'Jam\',4,4);">Jas 4:4</a>), "maketh himself"; for "worketh abomination or (maketh) a lie" (<a onClick="return mV(\'Rev\',21,27);">Re 21:27</a>), "maketh (margin "doeth") an abomination and a lie"; we have "become" for "made" (<a onClick="return mV(\'Mat\',4,3);">Mt 4:3</a>; <a onClick="return mV(\'Luk\',3,5);">Lu 3:5</a>; <a onClick="return mV(\'Luk\',4,3);">4:3</a>), "became" (<a onClick="return mV(\'Rom\',10,20);">Ro 10:20</a>; <a onClick="return mV(\'1Cr\',15,45);">1Co 15:45</a>, bis); "becoming in" for "being made" (<a onClick="return mV(\'Phl\',2,7);">Php 2:7</a> margin).``185';
isbe[5717]='Makebates`mik\'-bats: This is the plural of the word makebate, which means "one who stirs up strife." It occurs only in the King James Version margin of <a onClick="return mV(\'2Ti\',3,3);">2Ti 3:3</a> and <a onClick="return mV(\'Tts\',2,3);">Tit 2:3</a> as an alternative translation of diaboloi, which the King James Version renders "false accusers," and the Revised Version (British and American) "slanderers."``1';
isbe[5718]='Maked`ma\'-ked (Maked, Makeb): A strong city east of the Jordan, not yet identified. It is named along with Bosor, Alema and Casphor (1Macc 5:26). In 1Macc 5:36, the King James Version reads "Maged."``1';
isbe[5719]='Maker`ma\'-ker.`<a href="./study/isbe/search.html?string=MAKE">MAKE</a>`1';
isbe[5720]='Makheloth`mak-he\'-loth, mak-he\'-loth (maqheloth, "assemblies"): A desert camp of the Israelites between Haradah and Tahath (<a onClick="return mV(\'Num\',33,25,26);">Nu 33:25,26</a>).`<a href="./study/isbe/search.html?string=WANDERINGS+OF+ISRAEL">WANDERINGS OF ISRAEL</a>`1';
isbe[5721]='Makkedah`ma-ke\'-da (maqqedhah; Makeda): A Canaanite royal city which Joshua captured, utterly destroying the inhabitants, and doing to the king as he had done unto the king of Jericho (<a onClick="return mV(\'Jos\',10,28);">Jos 10:28</a>; <a onClick="return mV(\'Jos\',12,16);">12:16</a>). It lay in the Shephelah of Judah (<a onClick="return mV(\'Jos\',15,41);">Jos 15:41</a>). It was brought into prominence by the flight thither of the 5 kings of the Amorites who, having united their forces for the destruction of Gibeon, were themselves defeated and pursued by Joshua (<a onClick="return mV(\'Jos\',10,\'1-\');">chapter 10</a>). Seeing their danger, the men of Gibeon sent to the camp at Gilgal beseeching Joshua to save and help them. That energetic commander marched all night with his full strength, fell upon the allies at Gibeon, slew them with a great slaughter, chased the fugitives down the valley by way of Beth-horon, and smote them unto Azekah and unto Makkedah. It was during this memorable pursuit that in response to Joshua\'s appeal:<P class="in15">"Sun, stand thou still upon Gibeon;<br>And thou, Moon, in the valley of Aijalon," <p>the sun stayed in the midst of heaven, and hasted not to go down a whole day, until the nation had avenged themselves of their enemies.<P>The 5 kings sought refuge in the cave at Makkedah, where, by Joshua\'s orders, they were blocked in with great stones, until the slaughter of the fugitives should be completed. Then the royal prisoners were brought out, and, after the chiefs of Israel had set their feet upon their necks, Joshua slew them and hanged them on five trees until sunset. This is an illustration of the old practice of impaling enemies after death. The bodies were then cast into the cave where they had sought to hide, and great stones were rolled against the entrance.<P>The flight of the allies was past Beth-boron and Azekah to Makkedah. Azekah is not identified, but it is named with Gederoth, Beth-dagon, and Naamah (<a onClick="return mV(\'Jos\',15,41);">Jos 15:41</a>). These are probably represented by Qatrah, Dajan and Na\'aneh, so that in this district Makkedah may be sought. The officers of the Palestine Exploration Fund agree in suggesting el-Mughdr, "the cave," on the northern bank of Wady es-Surar, about 4 miles from the sand dunes on the shore. There are traces of old quarrying and many rock-cut tombs with loculi. "The village stands on a sort of promontory stretching into the valley...divided into three plateaus; on the lower of these to the south is the modern village, el-Mughar, built in front of the caves which are cut out of the sandstone" (Warren). In no other place in the neighborhood are caves found. The narrative, however, speaks not of caves, but of "the cave," as of one which was notable. On the other hand the events narrated may have lent distinction to some particular cave among the many. "The cave" would therefore be that associated with the fate of the 5 kings. No certainty is possible.``54';
isbe[5722]='Maktesh, the`mak\'-tesh, (ha-makhtesh, "the mortar"; compare <a onClick="return mV(\'Jdg\',15,19);">Jud 15:19</a>, "the mortar," English Versions of the Bible "hollow place that is in Lehi"): A quarter of Jerusalem so named, it is supposed, on account of the configuration of the ground and associated (<a onClick="return mV(\'Zep\',1,10,11);">Ze 1:10,11</a>) with the "fish gate" and <a href="./study/isbe/search.html?string=MISHNEH">MISHNEH</a> (which see) or "second quarter." Most authorities think it was in the northern part of the city, and many consider that the name was derived from the hollowed-out form of that part of the Tyropeon just N. of the walls, where foreign merchants congregated; others have suggested a hollow farther west, now occupied by the muristan and the three long bazaars.``117';
isbe[5723]='Malachi`mal\'-a-ki:<P>1. Name of the Prophet<P>2. The Prophet\'s Times<P>3. Contents<P>4. Style<P>5. Message<P>LITERATURE<hr /><P>1. Name of the Prophet:<P>The last book of the Old Testament. Nothing is known of the person of Malachi. Because his name does not occur elsewhere, some scholars indeed doubt whether "Malachi" is intended to be the personal name of the prophet. But none of the other prophetic books of the Old Testament is anonymous. The form mal\'akhi, signifies "my messenger"; it occurs again in <a onClick="return mV(\'Mal\',3,1);">3:1</a>; compare <a onClick="return mV(\'Mal\',2,7);">2:7</A>. But this form of itself would hardly be appropriate as a proper name without some additional syllable such as Yah, whence mal\'akhiah, i.e. "messenger of Yahweh." Haggai, in fact, is expressly designated "messenger of Yahweh" (<a onClick="return mV(\'Hag\',1,13);">Hag 1:13</a>). Besides, the superscriptions prefixed to the book, in both the Septuagint and the Vulgate, warrant the supposition that Malachi\'s full name ended with the syllable -yah. At the same time the Septuagint translates the last clause of <a onClick="return mV(\'Mal\',1,1);">Mal 1:1</a>, "by the hand of his messenger," and the Targum reads, "by the hand of my angel, whose name is called Ezra the scribe." Jerome likewise testifies that the Jews of his day ascribed this last book of prophecy to Ezra (V. Praef. in duodecim Prophetas). But if Ezra\'s name was originally associated with the book, it would hardly have been dropped by the collectors of the prophetic Canon who, lived only a century or two subsequent to Ezra\'s time. Certain traditions ascribe the book to Zerubbabel and Nehemiah; others, still, to Malachi, whom they designate as a Levite and a member of the "Great Synagogue." Certain modern scholars, however, on the basis of the similarity of the title (<a onClick="return mV(\'Mal\',1,1);">1:1</a>) to <a onClick="return mV(\'Zec\',9,1);">Zec 9:1</a>; <a onClick="return mV(\'Zec\',12,1);">12:1</a>, declare it to be anonymous; but this is a rash conclusion without any substantial proof other than supposition. The best explanation is that of Professor G.G. Cameron, who suggests that the termination of the word "Malachi" is adjectival, and equivalent to the Latin angelicus, signifying "one charged with a message or mission" (a missionary). The term would thus be an official title; and the thought would not be unsuitable to one whose message closed the prophetical Canon of the Old Testament, and whose mission in behalf of the church was so sacred in character (1-vol HDB).<P>2. The Prophet\'s Times:<P>Opinions vary as to the prophet\'s exact date, but nearly all scholars are agreed that Malachi prophesied during the Persian period, and after the reconstruction and dedication of the second temple in 516 BC (compare <a onClick="return mV(\'Mal\',1,10);">Mal 1:10</a>; <a onClick="return mV(\'Mal\',3,1,10);">3:1,10</a>). The prophet speaks of the people\'s governor" (Hebrew pechah, <a onClick="return mV(\'Mal\',1,8);">Mal 1:8</a>), as do Haggai and Nehemiah (<a onClick="return mV(\'Hag\',1,1);">Hag 1:1</a>; <a onClick="return mV(\'Neh\',5,14);">Ne 5:14</a>; <a onClick="return mV(\'Neh\',12,26);">12:26</a>). The social conditions portrayed are unquestionably those also of the period of the Restoration. More specifically, Malachi probably lived and labored during the times of Ezra and Nehemiah. Serious abuses had crept into Jewish life; the priests had become lax and degenerate, defective and inferior sacrifices were allowed to be offered upon the temple altar, the people were neglecting their tithes, divorce was common and God\'s covenant was forgotten and ignored; just such abuses as we know from the Book of Nehemiah were common in his day (compare <a onClick="return mV(\'Neh\',3,5);">Ne 3:5</a>; <a onClick="return mV(\'Neh\',5,\'1-13\');">5:1-13</a>). Yet, it is doubtful whether Malachi preached during Nehemiah\'s active governorship; for in <a onClick="return mV(\'Mal\',1,8);">Mal 1:8</a> it is implied that gifts might be offered to the "governor," whereas Nehemiah tells us that he declined all such (<a onClick="return mV(\'Neh\',5,15,18);">Ne 5:15,18</a>). On the other hand, the abuses which Malachi attacked correspond so exactly with those which Nehemiah found on his 2nd visit to Jerusalem in 432 BC (<a onClick="return mV(\'Neh\',13,7);">Ne 13:7</a>) that it seems reasonably certain that he prophesied shortly before that date, i.e. between 445 and 432 BC. As Dr. J.M.P. Smith says, The Book of Malachi fits the situation amid which Nehemiah worked as snugly as a bone fits its socket" (ICC, 7). That the prophet should exhort the people to remember the law of Moses, which was publicly read by Ezra in the year 444 BC, is in perfect agreement with this conclusion, despite the fact that Stade, Cornill and Kautzsch argue for a date prior to the time of Ezra. On the other hand, Nagelsbach, Kohler, Orelli, Reuss and Volck rightly place the book in the period between the two visits of Nehemiah (445-432 BC).<P>3. Contents:<P>The book, in the main, is composed of two extended polemics against the priests (<a onClick="return mV(\'Mal\',1,\'6-\');">Mal 1:6</a>-<a onClick="return mV(\'Mal\',2,\'1-9\');">2:9</a>) and the people (<a onClick="return mV(\'Mal\',2,\'10-\');">Mal 2:10-4:3</a>), opening with a clear, sharp statement of the prophet\'s chief thesis that Yahweh still loves Israel (<a onClick="return mV(\'Mal\',1,\'2-5\');">Mal 1:2-5</a>), and closing with an exhortation to remember the Law of Moses (<a onClick="return mV(\'Mal\',4,\'4-6\');">Mal 4:4-6</a>). After the title or superscription (<a onClick="return mV(\'Mal\',1,1);">Mal 1:1</a>) the prophecy falls naturally into seven divisions:<P>(1) <a onClick="return mV(\'Mal\',1,\'2-5\');">Malachi 1:2-5</a>, in which Malachi shows that Yahweh still loves Israel because their lot stands in such marked contrast to Edom\'s. They were temporarily disciplined; Edom was forever punished.<P>(2) <a onClick="return mV(\'Mal\',1,\'6-\');">Malachi 1:6</a>-<a onClick="return mV(\'Mal\',2,\'1-9\');">2:9</a>, a denunciation of the priests, the Levites, who have become neglectful of their sacerdotal office, indifferent to the Law, and unmindful of their covenant relationship to Yahweh.<P>(3) <a onClick="return mV(\'Mal\',2,\'10-16\');">Malachi 2:10-16</a>, against idolatry and divorce. Some interpret this section metaphorically of Judah as having abandoned the religion of his youth (<a onClick="return mV(\'Mal\',2,11);">2:11</a>). But idolatry and divorce were closely related. The people are obviously rebuked for literally putting away their own Jewish wives in order to contract marriage with foreigners (<a onClick="return mV(\'Mal\',2,15);">2:15</a>). Such marriages, the prophet declares, are not only a form of idolatry (<a onClick="return mV(\'Mal\',2,11);">2:11</a>), but a violation of Yahweh\'s intention to preserve to Himself a "godly seed" (<a onClick="return mV(\'Mal\',2,15);">2:15</a>).<P>(4) <a onClick="return mV(\'Mal\',2,\'17-\');">Malachi 2:17</a>-<a onClick="return mV(\'Mal\',3,\'1-6\');">3:6</a>, an announcement of coming judgment. Men are beginning to doubt whether there is longer a God of justice (<a onClick="return mV(\'Mal\',2,17);">2:17</a>). Malachi replies that the Lord whom the people seek will suddenly come, both to purify the sons of Levi and to purge the land of sinners in general. The nation, however, will not be utterly consumed (<a onClick="return mV(\'Mal\',3,6);">3:6</a>).<P>(5) <a onClick="return mV(\'Mal\',3,\'7-12\');">Malachi 3:7-12</a>, in which the prophet pauses to give another concrete example of the people\'s sins: they have failed to pay their tithes and other dues. Accordingly, drought, locusts, and famine have ensued. Let these be paid and the nation will again prosper, and their land will become "a delightsome land."<P>(6) <a onClick="return mV(\'Mal\',3,\'13-\');">Malachi 3:13</a>-<a onClick="return mV(\'Mal\',4,1,2,3);">4:3</a>, a second section addressed to the doubters of the prophet\'s age. In <a onClick="return mV(\'Mal\',2,17);">2:17</a>, they had said, "Where is the God of justice?" They now murmur: "It is vain to serve God; and what profit is it that we have kept his charge?" The wicked and the good alike prosper (<a onClick="return mV(\'Mal\',3,14,15);">3:14,15</a>). But, the prophet replies, Yahweh knows them that are His, and a book of remembrance is being kept; for a day of judgment is coming when the good and the evil will be distinguished; those who work iniquity will be exterminated, while those who do righteously will triumph.<P>(7) <a onClick="return mV(\'Mal\',4,\'4-6\');">Malachi 4:4-6</a>, a concluding exhortation to obey the Mosaic Law; with a promise that Elijah the prophet will first come to avert, if possible, the threatened judgment by reconciling the hearts of the nation to one another, i.e. to reconcile the ideals of the old to those of the young, and vice versa.<P>4. Style:<P>Malachi was content to write prose. His Hebrew is clear and forceful and direct; sometimes almost rhythmical. His figures are as numerous as should be expected in the brief remnants of his sermons which have come down to us, and in every case they are chaste and beautiful (<a onClick="return mV(\'Mal\',1,6);">1:6</A>; <a onClick="return mV(\'Mal\',3,2,3,17);">3:2,3,17</A>; <a onClick="return mV(\'Mal\',4,1,2,3);">4:1-3</A>). His statements are bold and correspondingly effective. The most original feature in his style is the lecture-like method which characterizes his book throughout; more particularly that of question and answer. His style is that of the scribes. It is known as the didactic-dialectic method, consisting first of an assertion or charge, then a fancied objection raised by his hearers, and finally the prophet\'s refutation of their objection. Eight distinct examples of this peculiarity are to be found in his book, each one containing the same clause in Hebrew, "Yet ye say" (<a onClick="return mV(\'Mal\',1,2,6,7);">1:2,6,7</a>; <a onClick="return mV(\'Mal\',2,14,17);">2:14,17</A>; <a onClick="return mV(\'Mal\',3,7,8,13);">3:7,8,13</a>). This debating style is especially characteristic of Malachi. Ewald called it "the dialogistic" method. Malachi shows the influence of the schools (compare his use of "also" and "again" in <a onClick="return mV(\'Mal\',1,13);">1:13</A>; <a onClick="return mV(\'Mal\',2,13);">2:13</a>, which is equivalent to our "firstly," "secondly," etc.).<P>5. Message:<P>Malachi\'s message has a permanent value for us as well as an immediate value for his own time. He was an intense patriot, and accordingly his message was clean-cut and severe. His primary aim was to encourage a disheartened people who were still looking for Haggai\'s and Zechariah\'s optimistic predictions to be fulfilled. Among the lessons of abiding value are the following:<P>(1) That ritual is an important element in religion, but not as an end in itself. Tithes and offerings are necessary, but only as the expression of sincere moral and deeply spiritual life (<a onClick="return mV(\'Mal\',1,11);">Mal 1:11</a>).<P>(2) That a cheap religion avails nothing, and that sacrifices given grudgingly are displeasing to God. Better a temple closed than filled with such worshippers (<a onClick="return mV(\'Mal\',1,\'8-10\');">Mal 1:8-10</a>).<P>(3) That divorce and intermarriage with heathen idolaters thwarts the purpose of God in securing to Himself a peculiar people, whose family life is sacred because it is the nursery of a "godly seed" (<a onClick="return mV(\'Mal\',2,15);">Mal 2:15</a>).<P>(4) That there is eternal discipline in the Law. Malachi places the greatest emphasis upon the necessity of keeping the Mosaic Law. The priests, he says, are the custodians and expounders of the Law. At their mouth the people should seek knowledge. "To undervalue the Law is easy; to appraise it is a much harder task" (Welch). With Malachi, no less than with Christ Himself, not one jot or tittle should ever pass away or become obsolete.<P>LITERATURE.<P>Driver, "Minor Prophets," II, NewCentury Bible (1906); G. A. Smith, "The Book of the Twelve Prophets," Expositor\'s Bible (1898); Dods, Post-Exilian Prophets: "Hag," "Zec," "Mal"; "Handbooks for Bible Classes"; J. M. P. Smith, ICC (1912). Among the numerous other commentaries on Malachi may be mentioned: Eiselen (1907), Marti (1903), Nowack (1903), Orelli (1908), Wellhausen (1898), Van Hoonacker (1908) and Isopeocul (1908). The various Introductions to the Old Testament should also be consulted, notably those by Driver (1910), Strack (1906), Wildeboer (1903), Gautier (1906), Cornill (1907), Konig (1893); and the articles entitled "Malachi" in the various Dicts. and Bible Encs: e.g. in Encyclopedia Biblica (1902), by C. O. Torrey; in HDB (1901), by A. O. Welch; in 1-vol HDB (1909), by G. G. Cameron; and RE (1905), by Volck.``152';
isbe[5724]='Malachy`mal\'-a-ki: Another form of the name of the prophet "<a href="./study/isbe/search.html?string=MALACHI">Malachi</a>" (which see), found in the Revised Version (British and American) and the King James Version of 2Esdras 1:40.``1';
isbe[5725]='Malcam`mal\'-kam (malkam, "their king"; the King James Version Maleham):<P>(1) A chief of the Benjamites, son of Shaharaim (<a onClick="return mV(\'1Ch\',8,9);">1Ch 8:9</a>).<P>(2) The name of an idol as well as the possessive pronominal form of melekh, "king" (<a onClick="return mV(\'2Sa\',12,30);">2Sa 12:30</a> the Revised Version margin; <a onClick="return mV(\'Jer\',49,1,3);">Jer 49:1,3</a> Septuagint Melchol); <a onClick="return mV(\'Zep\',1,5);">Ze 1:5</a>). In <a onClick="return mV(\'Amo\',1,15);">Am 1:15</a> it appears to be best translated "their king," as in both the King James Version and the Revised Version (British and American). Only a careful examination of the context can determine whether the word is the proper name of the idol (Moloch) or the 3rd personal possessive pronoun for king. The idol is also spelt "Milcom" and "Molech."``1';
isbe[5726]='Malchi-Shua`mal-ki-shoo\'-a (malkishua\', "my king saves"): One of the sons of Saul (<a onClick="return mV(\'1Sa\',14,49);">1Sa 14:49</a>; <a onClick="return mV(\'1Sa\',31,2);">31:2</a>, the King James Version "Melchishua"; <a onClick="return mV(\'1Ch\',8,33);">1Ch 8:33</a>; <a onClick="return mV(\'1Ch\',9,39);">9:39</a>). He was slain by the Philistines with his brothers at the battle of Gilboa (<a onClick="return mV(\'1Ch\',10,2);">1Ch 10:2</a>; <a onClick="return mV(\'1Sa\',31,2);">1Sa 31:2</a>).``1';
isbe[5727]='Malchiah`mal-ki\'-a.`<a href="./study/isbe/search.html?string=MALCHIJAH">MALCHIJAH</a>`1';
isbe[5728]='Malchiel`mal\'-ki-el (malki\'el, "God is king"): Grandson of Asher (<a onClick="return mV(\'Gen\',46,17);">Ge 46:17</a>; <a onClick="return mV(\'Num\',26,45);">Nu 26:45</a>; <a onClick="return mV(\'1Ch\',7,31);">1Ch 7:31</a>).``1';
isbe[5729]='Malchielites`mal\'-ki-el-its (malki\'eli): Descendants of Malchiel (<a onClick="return mV(\'Num\',26,45);">Nu 26:45</a>).``1';
isbe[5730]='Malchijah`mal-ki\'-ja (malkiyah, "Yah is king"; Melcheias, with variants):<P>(1) A Levite, descendant of Gershom, of those whom David set over the "service of sting" in the worship (<a onClick="return mV(\'1Ch\',6,40);">1Ch 6:40</a>).<P>(2) The head of the 5th course of priests (<a onClick="return mV(\'1Ch\',24,9);">1Ch 24:9</a>).<P>(3) One of the laymen who had taken "strange wives" during the exile (<a onClick="return mV(\'Ezr\',10,25);">Ezr 10:25</a>); the "Melchias" of 1Esdras 9:26.<P>(4) Another of the same name (<a onClick="return mV(\'Ezr\',10,25);">Ezr 10:25</a>; two in same verse). Called "Asibias" in 1Esdras 9:26.<P>(5) Another under the same offense, son of Harim (<a onClick="return mV(\'Ezr\',10,31);">Ezr 10:31</a>). "Melchias" in 1Esdras 9:32.<P>(6) One of the "repairers" who helped with the "tower of the furnaces" (<a onClick="return mV(\'Neh\',3,11);">Ne 3:11</a>).<P>(7) Son of Rechab ruler of Beth-haccerem, repairer of the dung gate (<a onClick="return mV(\'Neh\',3,14);">Ne 3:14</a>).<P>(8) A goldsmith who helped in building the walls of Jerusalem (<a onClick="return mV(\'Neh\',3,31);">Ne 3:31</a>).<P>(9) One of those at Ezra\'s left hand when he read the law (though possibly one of the above (<a onClick="return mV(\'Neh\',8,4);">Ne 8:4</a>)). In 1Esdras 9:44 "Melchias."<P>(10) One of the covenant signatories (<a onClick="return mV(\'Neh\',10,3);">Ne 10:3</a>).<P>(11) The father of Pashhur (<a onClick="return mV(\'Neh\',11,12);">Ne 11:12</a>; <a onClick="return mV(\'Jer\',21,1);">Jer 21:1</a>; <a onClick="return mV(\'Jer\',38,1);">38:1</a>).<P>(12) A priest, a singer at the dedication of the walls of Jerusalem under Ezra and Nehemiah (<a onClick="return mV(\'Neh\',12,42);">Ne 12:42</a>).<P>(13) (malkiyahu as above with u ending): Son of Ham-melech (or, as <a onClick="return mV(\'1Ki\',22,26);">1Ki 22:26</a>; <a onClick="return mV(\'2Ch\',28,7);">2Ch 28:7</a> translate it, "king\'s son"). Jeremiah was cast into his dungeon or pit (<a onClick="return mV(\'Jer\',38,6);">Jer 38:6</a>).<P>The King James Version spells "Malchiah" or "Malchijah" indifferently with "Melchiah" in <a onClick="return mV(\'Jer\',21,1);">Jer 21:1</a>; the English Revised Version has "Malchiah" in <a onClick="return mV(\'Jer\',21,1);">Jer 21:1</a>; <a onClick="return mV(\'Jer\',38,1,6);">38:1,6</a>, elsewhere "Malchijah"; the American Standard Revised Version has "Malchijah" throughout.``186';
isbe[5731]='Malchiram`mal-ki\'-ram (malkiram, "uplifted king"): Son of Jeconiah, descendant of David (<a onClick="return mV(\'1Ch\',3,18);">1Ch 3:18</a>).``1';
isbe[5732]='Malchus`mal\'-kus (Malchos, from melekh, i.e. "counselor" or "king"): The name of the servant of the high priest Caiaphas whose right ear was smitten off by Simon Peter at the arrest of Jesus in the Garden of Gethsemane (compare <a onClick="return mV(\'Mat\',26,51);">Mt 26:51</a>; <a onClick="return mV(\'Mar\',14,47);">Mr 14:47</a>; <a onClick="return mV(\'Luk\',22,50);">Lu 22:50</a>; <a onClick="return mV(\'Jhn\',18,10);">Joh 18:10</a>). It is noteworthy that Luke "the physician" alone gives an account of the healing of the wound (<a onClick="return mV(\'Luk\',22,51);">Lu 22:51</a>). As Jesus "touched his ear, and healed him," the ear was not entirely severed from the head. The words of Jesus, "Suffer ye thus far," may have been addressed either to the disciples, i.e. "Suffer ye that I thus far show kindness to my captors," or to those about to bind him, i.e. asking a short respite to heal Malchus. They were not addressed directly to Peter, as the Greek form is plural, whereas in <a onClick="return mV(\'Mat\',26,52);">Mt 26:52</a>; <a onClick="return mV(\'Jhn\',18,11);">Joh 18:11</a>, where, immediately after the smiting of Malchus, Jesus does address Peter, the singular form is used; nor do the words of Jesus there refer to the healing but to the action of his disciple. A kinsman of Malchus, also a servant of the high priest, was one of those who put the questions which made Peter deny Jesus (<a onClick="return mV(\'Jhn\',18,26);">Joh 18:26</a>).``88';
isbe[5733]='Male`mal<P>(1) zakhar, zakhar, zakhur (the root means "to stand out," "to be prominent," here a physiological differentiation of the sex, as neqebhah, "<a href="./study/isbe/search.html?string=female">female</a>," which see);<P>(2) \'ish literally, "man";<P>(3) by circumlocution, only in the Books of Samuel and Kings, mashtin beqir; ouron pros toichon, which the Revised Version (British and American) euphemistically renders "man-child" (<a onClick="return mV(\'1Sa\',25,22,34);">1Sa 25:22,34</a>; <a onClick="return mV(\'1Ki\',14,10);">1Ki 14:10</a>)):<P>Gesenius has rightly pointed out that this phrase designates young boys, who do not as yet wear clothes, of whom the above description is accurate, while it does not apply in the case of adults, even in the modern Orient. We know this from the statement of Herodotus ii.35, relating to Egypt, and from <a onClick="return mV(\'Jdg\',3,24);">Jud 3:24</a>; <a onClick="return mV(\'1Sa\',24,3);">1Sa 24:3</a>. The Greek translates these words with arsen, arrhen, while 1Macc 5:28,51 has the adjective arsenikos.<P>The above words (the phrase mashtin beqir excepted) are used promiscuously of animals and men, e.g. "Of every clean beast thou shalt take to thee seven and seven, the male (\'ish) and his female, of the birds also of the heavens, seven and seven, male (zakhar) and female" (<a onClick="return mV(\'Gen\',7,2,3);">Ge 7:2,3</a>). A careful distinction was made in the use of male and female animals in the rules concerning sacrifice; in some offerings none but males were allowed, in others females were permitted along with the males (<a onClick="return mV(\'Lev\',3,6);">Le 3:6</a>). The same distinction was made in the valuation of the different sexes (<a onClick="return mV(\'Gen\',32,14,15);">Ge 32:14,15</a>; <a onClick="return mV(\'Lev\',27,5);">Le 27:5</a>). Certain priestly portions were permitted to the Levites or the male descendants of Aaron for food, while women were not permitted to partake of the same (<a onClick="return mV(\'Num\',18,10,11);">Nu 18:10,11</a>).<P>As a rule Jewish parents (as is now common in the Orient) preferred male children to daughters. This is seen from the desire for male progeny (<a onClick="return mV(\'1Sa\',1,\'8-18\');">1Sa 1:8-18</a>) and from the ransom paid for firstborn sons to Yahweh (<a onClick="return mV(\'Exd\',13,12);">Ex 13:12</a>; <a onClick="return mV(\'Luk\',2,23);">Lu 2:23</a>). It was reserved to the New Testament to proclaim the equality of the sexes, as it does of races and conditions of men: "There can be neither Jew nor Greek, there can be neither bond nor free, there can be no male and female; for ye all are one man in Christ Jesus" (<a onClick="return mV(\'Gal\',3,28);">Ga 3:28</a>).<P>See <a href="./study/isbe/search.html?string=WOMAN">WOMAN</a>.<P>Among the prominent sins of oriental peoples, "the abominations of the nations which Yahweh drove out before the children of Israel" was one of the most heinous character, that of sodomy, against which God\'s people are repeatedly warned. The Greek expression for the devotee of this vice is a compound noun, arsenokoites, literally, "he who lies with man," the abuser of himself with mankind, the sodomite (<a onClick="return mV(\'1Cr\',6,9);">1Co 6:9</a>), while the Hebrew qadhesh, literally means the (male) devotee of lascivious and licentious idolatry (<a onClick="return mV(\'Deu\',23,17);">De 23:17</a>; <a onClick="return mV(\'1Ki\',14,24);">1Ki 14:24</a>; <a onClick="return mV(\'1Ki\',15,12);">15:12</a>; <a onClick="return mV(\'1Ki\',22,46);">22:46</a>; <a onClick="return mV(\'2Ki\',23,7);">2Ki 23:7</a>; <a onClick="return mV(\'Job\',36,14);">Job 36:14</a>).``106';
isbe[5734]='Malefactor`mal-e-fak\'-ter (kakopoios, "a bad doer," i.e. "evildoer," "criminal"; kakourgos, "a wrongdoer"): The former occurs in <a onClick="return mV(\'Jhn\',18,30);">Joh 18:30</a> the King James Version, the latter, which is the stronger term, in <a onClick="return mV(\'Luk\',23,32,39);">Lu 23:32,39</a>. The former describes the subject as doing or making evil, the latter as creating or originating the bad, and hence, designates the more energetic, aggressive, initiating type of criminality.``1';
isbe[5735]='Maleleel`ma-le\'-le-el, mal\'-e-lel (Maleleel, the King James Version): Greek form of "Mahalalel" (<a onClick="return mV(\'Luk\',3,37);">Lu 3:37</a>); the Revised Version (British and American) "Mahalaleel."``1';
isbe[5736]='Malice, Malignity`mal\'-is, ma-lig\'-ni-ti (kakia, poneros, kakoetheia): "Malice," now used in the sense of deliberate ill-will, by its derivation means badness, or wickedness generally, and was so used in Older English. In the Apocrypha it is the translation of kakia, "evil," "badness" (The <span class="noTag">Wisdom of Solomon 12:10,20; 16:14; 2Macc 4:50</span>, the Revised Version (British and American) "wickedness"); in Ecclesiasticus 27:30; 28:7, we have "malice" in the more restricted sense as the translation of menis, "confirmed anger." In the New Testament "malice" and "maliciousness" are the translation of kakia (<a onClick="return mV(\'Rom\',1,29);">Ro 1:29</a>; <a onClick="return mV(\'1Cr\',5,8);">1Co 5:8</a>; <a onClick="return mV(\'1Cr\',14,20);">14:20</a>; <a onClick="return mV(\'Col\',3,8);">Col 3:8</a>); malicious is the translation of poneros, "evil" (<a onClick="return mV(\'3Jo\',1,10);">3Joh 1:10</a>, the Revised Version (British and American) "wicked"); it also occurs in <span class="noTag">Additions to Esther 13:4,7, verse 4</span>, "malignant"; The <span class="noTag">Wisdom of Solomon 1:4</span>, the Revised Version (British and American) that deviseth evil"; 2Macc 5:23; malignity occurs in <a onClick="return mV(\'Rom\',1,29);">Ro 1:29</a> as the translation of kakoetheia, "evil disposition"; "maliciously," Susanna verses 43,62; 2Macc 14:11, the Revised Version (British and American) "having ill will."``185';
isbe[5737]='Mallos`mal\'-os,`<a href="./study/isbe/search.html?string=MALLUS">MALLUS</a>`1';
isbe[5738]='Mallothi`mal\'-o-thi, ma-lo\'-thi (mallothi, "my discourse"): Son of Heman, a Kohathite singer (<a onClick="return mV(\'1Ch\',6,33);">1Ch 6:33</a>; <a onClick="return mV(\'1Ch\',25,4);">25:4</a>). The song service in the house of the Lord was apportioned by David and the captains of the host to the 3 families of Asaph, Heman, and Jeduthun (<a onClick="return mV(\'1Ch\',25,1);">1Ch 25:1</a>). Their place in the "courses" was, however, settled by "lot" (<a onClick="return mV(\'1Ch\',25,8,9);">1Ch 25:8,9</a>). Mallothi was one of Heman\'s 17 children—14 sons and 3 daughters (<a onClick="return mV(\'1Ch\',25,5);">1Ch 25:5</a>)—and was chief of the 19th course of twelve singers into which the temple choir was divided (<a onClick="return mV(\'1Ch\',25,26);">1Ch 25:26</a>).``186';
isbe[5739]='Mallows`mal\'-oz.`<a href="./study/isbe/search.html?string=SALT+WORT">SALT-WORT</a>`1';
isbe[5740]='Malluch`mal\'-uk (mallukh, "counsellor"):<P>(1) A Levite of the sons of Merari, ancestor of Ethan the singer (<a onClick="return mV(\'1Ch\',6,44);">1Ch 6:44</a>; compare <a onClick="return mV(\'1Ch\',6,29);">6:29</a>).<P>(2) Son of Bani, among those who had foreign wives (<a onClick="return mV(\'Ezr\',10,29);">Ezr 10:29</a>). He is a descendant of Judah (<a onClick="return mV(\'1Ch\',9,4);">1Ch 9:4</a>) and is the Mamuchus of 1Esdras 9:30.<P>(3) A descendant of Harim, who married a foreign wife (<a onClick="return mV(\'Ezr\',10,32);">Ezr 10:32</a>).<P>(4) (5) Two who sealed the covenant with Nehemiah (<a onClick="return mV(\'Neh\',10,4,27);">Ne 10:4,27</a>).<P>(6) Possibly the same as (4). One of the priests who returned with Zerubbabel (<a onClick="return mV(\'Neh\',12,2);">Ne 12:2</a>). Doubtless the Melicu of verse <a onClick="return mV(\'Neh\',12,14);">14</A>\'s margin.``186';
isbe[5741]='Malluchi`mal\'-u-ki (mallukhi, "my counselor"): A family of priests that came over with Zerubbabel (<a onClick="return mV(\'Neh\',10,4);">Ne 10:4</a>; <a onClick="return mV(\'Neh\',12,14);">12:14</a>). May be the patronymic <a href="./study/isbe/search.html?string=MALLUCH">MALLUCH, (4)</a> (which see).``1';
isbe[5742]='Mallus`mal\'-us (Mallos; the King James Version, Mallos): A city in Cilicia, the inhabitants of which along with those of Tarsus, revolted from Antiochus Epiphanes in protest against his action in giving them to his concubine, Antiochis (2Macc 4:30). The ancient name was Marlos. The river Pyramos divides about 10 miles from the sea, one branch flowing to the west, the other to the east of the low range of hills along the coast on which stands Kara-Tash. Mallus stood on a height (Strabo, 675) to the east of the western arm, a short distance from the shore. The site is a little west of Kara-Tash, where inscriptions of Antiocheia and Mallus have been found. Tarsus lay about 35 miles to the northwest. The two cities were rivals in trade. The position of Mallus with her harbor on the shore gave her really no advantage over Tarsus, with her river navigable to the city walls. The fine wagon road over the mountain by way of the Cilician Gates opened for her easy access to the interior, compared with that furnished for Mallus by the old caravan track to the north by way of Adana. This sufficiently explains the greater prosperity of the former city.``54';
isbe[5743]='Malobathron`mal-o-bath\'-ron: the Revised Version margin suggests that this translation may be right instead of Bether in the phrase hare bether (<a onClick="return mV(\'Sgs\',2,17);">So 2:17</a>). But this spice never grew wild in Palestine, and so could hardly have given its name to a mountain, or mountain range. The name Bether ought therefore to be retained, notwithstanding Wellhausen (Prol. 2, 415). The spice is the leaf of the Cassia lignea tree.``1';
isbe[5744]='Maltanneus`mal-ta-ne\'-us (Maltannaios, Codex Vaticanus and Swete; Altannaios, Codex Alexandrinus and Fritzsche—the "M" being perhaps dropped because of the final "M" in the preceding word; the King James Version Altaneus): One of the sons of Asom who put away his "strange wife" (1Esdras 9:33) = "Mattenai" in <a onClick="return mV(\'Ezr\',10,33);">Ezr 10:33</a>.``1';
isbe[5745]='Mamaias`ma-ma\'-yas.`<a href="./study/isbe/search.html?string=SAMAIAS">SAMAIAS</a>`1';
isbe[5746]='Mamdai`mam\'-da-i, mam\'-di (LXX: Codex Vaticanus Mamdai; Codex Alexandrinus Mandai): One of those who consented to put away their "strange wives" at Esdras\' order (1Esdras 9:34) = the King James Version "Mabdai" = "Benaiah" in <a onClick="return mV(\'Ezr\',10,35);">Ezr 10:35</a>.``1';
isbe[5747]='Mammon`mam\'-un (Mamonas): A common Aramaic word (mamon) for riches, used in <a onClick="return mV(\'Mat\',6,24);">Mt 6:24</a> and in <a onClick="return mV(\'Luk\',16,9,11,13);">Lu 16:9,11,13</a>. In these passages mammon merely means wealth, and is called "unrighteous," because the abuse of riches is more frequent than their right use. In <a onClick="return mV(\'Luk\',16,13);">Lu 16:13</a> there is doubtless personification, but there is no proof that there was in New Testament times a Syrian deity called Mammon. The application of the term in Matthew is apparent and requires no comment. In Luke, however, since the statement, "Make to yourselves friends out of the mammon of unrighteousness," follows as a comment on the parable of the Unjust Steward, there is danger of the inference that Jesus approved the dishonest conduct of the steward and advised His disciples to imitate his example. On the contrary, the statement is added more as a corrective against this inference than as an application. \'Do not infer,\' He says, that honesty in the use of money is a matter of indifference. He that is unfaithful in little is unfaithful in much. So if you are not wise in the use of earthly treasure how can you hope to be entrusted with heavenly treasure?\' The commendation is in the matter of foresight, not in the method. The steward tried to serve two masters, his lord and his lord\'s creditors, but the thing could not be done, as the sequel shows. Neither can men serve both God and riches exalted as an object of slavish servitude. Wealth, Jesus teaches, does not really belong to men, but as stewards they may use wealth prudently unto their eternal advantage. Instead of serving God and mammon alike we may serve God by the use of wealth, and thus lay up treasures for ourselves in heaven. Again, the parable is not to be interpreted as teaching that the wrong of dishonest gain may be atoned for by charity. Jesus is not dealing with the question of reparation. The object is to point out how one may best use wealth, tainted or otherwise, with a view to the future.``121';
isbe[5748]='Mamnitanemus`mam-ni-ta-ne\'-mus (Mamnitanaimos; Codex Vaticanus Mamtitanaimos; the King James Version, Mamnitanaimus): 1Esdras 9:34, where it represents the two names Mattaniah and Mattenai in the parallel <a onClick="return mV(\'Ezr\',10,37);">Ezr 10:37</a>, which probably represent only one person. It must be a corruption of these names. The Aldine gives a still more corrupt form, Mamnimatanaimos.``1';
isbe[5749]='Mamre`mam\'-re (mamre\'; Septuagint Mambre):<P>(1) In <a onClick="return mV(\'Gen\',14,24);">Ge 14:24</a> Mamre is mentioned as the name of one of Abraham\'s allies, who in <a onClick="return mV(\'Gen\',14,13);">14:13</a> is described as the Amorite, brother of Eschcol and Aner.<P>1. Biblical Data:<P>The name of the grove of trees is evidently considered as derived from this sheikh or chieftain. The "oaks" ("terebinths") of Mamre where Abram pitched his tent (<a onClick="return mV(\'Gen\',14,13);">Ge 14:13</a>; <a onClick="return mV(\'Gen\',18,1);">18:1</a>) are described (<a onClick="return mV(\'Gen\',13,18);">Ge 13:18</a>) as "in Hebron." Later on <a href="./study/isbe/search.html?string=MACHPELAH">MACHPELAH</a> (which see) is described as "before," i.e. "to the east of Mamre" (<a onClick="return mV(\'Gen\',23,17);">Ge 23:17</a>; <a onClick="return mV(\'Gen\',25,9);">25:9</a>; <a onClick="return mV(\'Gen\',49,30);">49:30</a>; <a onClick="return mV(\'Gen\',50,13);">50:13</a>), and Mamre is identified with Hebron itself (<a onClick="return mV(\'Gen\',23,19);">Ge 23:19</a>).<P>2. Traditional Sites:<P>While Mamre has always been looked for in the vicinity of Hebron, the traditions have varied greatly, determined apparently by the presence of a suitable tree. The one site which has a claim on grounds other than tradition is that called Khirbet and \'Ain Nimreh (literally, the "ruin" and "spring" of "the leopard"), about 1/2 mile north-northwest of modern Hebron. The word Nimreh may be a survival of the ancient Mamre, the name, as often happens, being assimilated by a familiar word. The site is a possible one, but, beyond this, the name has not much to commend it.<P>Tradition has centered round three different sites at various periods:<P>(1) The modern tradition points to a magnificent oak (Quercus ilex, Arabic Sindian), 1 1/2 miles west-northwest of the modern city, as the terebinth of Abraham; its trunk has a girth of 32 ft. It is now in a dying condition, but when Robinson visited it (BR, II,72,81) it was in fine condition; he mentions a Mohammedan tradition that this was "Abraham\'s oak." Since then the site had been bought by the Russians, a hospice and church have been erected, and the tradition, though of no antiquity, has become crystallized.<P>(2) The second tradition, which flourished from the 16th century down to the commencement of the 19th century, pointed to the hill of Deir el Arba\'in (see <a href="./study/isbe/search.html?string=HEBRON">HEBRON</a>) as that of Mamre, relying especially, no doubt, in its inception on the identity of Mamre and Hebron (<a onClick="return mV(\'Gen\',23,19);">Ge 23:19</a>). A magnificent terebinth which stood there was pointed out as that of Abraham. The site agrees well with the statement that the cave of Machpelah was "before," i.e. to the east of Mamre (<a onClick="return mV(\'Gen\',23,17);">Ge 23:17</a>, etc.).<P>(3) The third and much older tradition, mentioned in several Christian writers, refers to a great terebinth which once stood in an enclosure some 2 miles north of Hebron, near the road to Jerusalem. It is practically certain that the site of this enclosure is the strange Ramet el-Khalil. This is an enclosure some 214 ft. long and 162 ft. wide. The enclosing walls are made of extremely fine and massive masonry and are 6 ft. thick; the stones are very well laid and the jointing is very fine, but the building was evidently never completed. In one corner is a well—Bir el-Khalil—lined with beautiful ashlar masonry, cut to the curve of the circumference.<P>It is probable that this enclosure surrounded a magnificent terebinth; if so, it was at this spot that before the days of Constantine a great annual fair was held, attended by Jews, Christians and heathen who united a pay honor to the sacred tree, while the well was on the same occasion illuminated, and offerings were made to it. Similar customs survive today at several shrines in Palestine. Constantine suppressed these "superstitions," and built a church in the neighborhood, probably the so-called "Abraham\'s house," Beit Ibrahim of today. The tree which stood here is apparently that mentioned by Josephus (BJ, IV, ix, 7) as having continued "since the creation of the world." At this enclosure, too, Jewish women and children were sold at auction after the suppression of the revolt of Bar Cochba. Whatever the origin of the veneration paid to this terebinth—now long centuries dead and gone—early Christian tradition associated it with Abraham and located Mamre here. This tradition is mentioned by Jerome (4th century), by Eucherius (6th century), by Areulphus (700 AD) and by Benjamin of Tudela (1163 AD). Among the modern Jews it is looked upon as the site of "Abraham\'s oak." It is probable that the view that Abraham was connected with this tree is one attached to it much later than its original sanctity; it was originally one of the many "holy trees" of the land venerated by primitive Semitic religions feeling, and the nearness of Hebron caused the Bible story to be attached to it. Judging from the Bible data, it appears to be too far from Hebron and Machpelah to suit the conditions; the site of Mamre must have been nearer to Deir el Arba\'in, but it has probably been entirely lost since very early times.<P>For a very good discussion about Mamre see Mambre by Le R. P. Abel des Freres Precheurs in the Conferences de Saint Etienne, 1909-10 (Paris).<P>(2) An Amorite chief, owner of the "oaks" mentioned above (<a onClick="return mV(\'Gen\',14,13,14);">Ge 14:13,14</a>).``117';
isbe[5750]='Mamuchus`ma-mu\'-kus (Mamouchos): One of those who put away their "strange wives" (1Esdras 9:30); identical with "Malluch" in <a onClick="return mV(\'Ezr\',10,29);">Ezr 10:29</a>.``1';
isbe[5751]='Man``<a href="./study/isbe/search.html?string=ANTHROPOLOGY">ANTHROPOLOGY</a>`1';
isbe[5752]='Man of Sin`(ho anthropos tes hamartias; many ancient authorities read, "man of lawlessness," anomias):<P>1. The Pauline Description:<P>The name occurs in Paul\'s remarkable announcement in <a onClick="return mV(\'2Th\',2,\'3-10\');">2Th 2:3-10</a> of the manifestation of a colossal anti-Christian power prior to the advent, which some of the Thessalonians had been misled into thinking of as immediately impending (<a onClick="return mV(\'2Th\',2,2);">2:2</A>). That "day of the Lord," the apostle declares, will not come till, as he had previously taught them (<a onClick="return mV(\'2Th\',2,5);">2:5</A>), there has first been a great apostasy and the revelation of "the man of sin" (or "of lawlessness"; compare <a onClick="return mV(\'2Th\',2,8);">2:8</a>), named also "the son of perdition" (<a onClick="return mV(\'2Th\',2,3);">2:3</a>). This "lawless one" (<a onClick="return mV(\'2Th\',2,8);">2:8</a>) would exalt himself above all that is called God, or is an object of worship; he would sit in the temple of God, setting himself forth as God (<a onClick="return mV(\'2Th\',2,4);">2:4</a>). For the time another power restrained his manifestation; when that was removed, he would be revealed (<a onClick="return mV(\'2Th\',2,6,7);">2:6,7</a>). Then "the mystery of lawlessness," which was already working, would attain its full development (<a onClick="return mV(\'2Th\',2,7,8);">2:7,8</a>). The coming of this "man of sin," in the power of Satan, would be with lying wonders and all deceit of unrighteousness, whereby many would be deceived to their destruction (<a onClick="return mV(\'2Th\',2,9,10);">2:9,10</a>). But only for a season (<a onClick="return mV(\'2Th\',2,6);">2:6</A>). Jesus would slay (or consume) him with the breath of His mouth (compare <a onClick="return mV(\'Isa\',11,4);">Isa 11:4</a>), and bring him to nought by the manifestation of His coming (<a onClick="return mV(\'2Th\',2,8);">2Th 2:8</a>).<P>2. The Varying Interpretations:<P>Innumerable are theories and speculations to which this Pauline passage has given rise a very full account of these may be seen in the essay on "The Man of Sin" appended to Dr. J. Eadie\'s posthumous Commentary on Thessalonians, and in Lunemann\'s Commentary, 222ff, English translation).<P>(1) There is the view, favored by "moderns," that the passage contains no genuine prediction (Paul "could not know" the future), but represents a speculation of the apostle\'s own, based on <a onClick="return mV(\'Dan\',8,23);">Da 8:23</a>ff; <a onClick="return mV(\'Dan\',11,36);">11:36</a>ff, and on current ideas of Antichrist (see <a href="./study/isbe/search.html?string=ANTICHRIST">ANTICHRIST</a>; <a href="./study/isbe/search.html?string=BELIAL">BELIAL</a>; compare Bousset, Der Antichrist, 93ff, etc.). This view will not satisfy those who believe in the reality of Paul\'s apostleship and inspiration.<P>(2) Some connect the description with Caligula, Nero, or other of the Roman emperors. Caligula, indeed, ordered supplication to be made to himself as the supreme god and wished to set up his statue in the temple of Jerusalem (Suet. Calig. xxii.33; Josephus, Ant, XVIII, viii). But this was long before Paul\'s visit to Thessalonica, and the acts of such a madman could not furnish the basis of a prediction so elaborate and important as the present (compare Lunemann and Bousset).<P>(3) The favorite Protestant interpretation refers the prediction to the papacy, in whom, it is contended, many of the blasphemous features of Paul\'s representation are unmistakably realized. The "temple of God" is here understood to be the church; the restraining power the Roman empire; "the man of sin" not an individual, but the personification of an institution or system. It is cult, however, to resist the impression that the apostle regards "the mystery of lawlessness" as culminating in an individual—a personal Antichrist—and in any case the representation outstrips everything that can be conceived of as even nominally Christian.<P>(4) There remains the view held by most of the Fathers, and in recent times widely adopted, that "the man of sin" of this passage is an individual in whom, previous to the advent, sin will embody itself in its most lawless and God-denying form. The attempts to identify this individual with historical characters may be set aside; but the idea is not thereby invalidated. The difficulty is that the apostle evidently conceives of the manifestation of the "man of sin" as taking place, certainly not immediately, but at no very remote period—not 2,000 years later—and as connected directly with the final advent of Christ, and the judgment on the wicked (compare <a onClick="return mV(\'2Th\',1,\'7-9\');">2Th 1:7-9</a>), without apparently any reference to a "millennial" period, either before or after.<P>It seems safest, in view of the difficulties of the passage, to confine one\'s self to the general idea it embodies, leaving details to be interpreted by the actual fulfillment.<P>3. The Essential Idea:<P>There is much support in Scripture—not least in Christ\'s own teaching (compare <a onClick="return mV(\'Mat\',13,30,\'37-43\');">Mt 13:30,37-43</a>; <a onClick="return mV(\'Mat\',24,\'11-14\');">24:11-14</a>; <a onClick="return mV(\'Luk\',18,8);">Lu 18:8</a>)—for the belief that before the final triumph of Christ\'s kingdom there will be a period of great tribulation, of decay of faith, of apostasy, of culmination of both good and evil ("Let both grow together until the harvest," <a onClick="return mV(\'Mat\',13,30);">Mt 13:30</a>), with the seeming triumph for the time of the evil over the good. There will be a crisis-time—sharp, severe, and terminated by a decisive interposition of the Son of Man ("the manifestation of his coming," the Revised Version margin "Gr presence"), in what precise form may be left undetermined. Civil law and government—the existing bulwark against anarchy (in Paul\'s time represented by the Roman power)—will be swept away by the rising tide of evil, and lawlessness will prevail. It may be that impiety will concentrate itself, as the passage says, in some individual head; or this may belong to the form of the apostle\'s apprehension in a case where "times and seasons" were not yet fully revealed: an apprehension to be enlarged by subsequent revelations (see <a href="./study/isbe/search.html?string=REVELATION+OF+JOHN">REVELATION OF JOHN</a>), or left to be corrected by the actual course of God\'s providence. The kernel of the prediction is not, any more than in the Old Testament prophecies, dependent on its literal realization in every detail. Neither does the final manifestation of evil exclude partial and anticipatory realizations, embodying many of the features of the prophecy.<P>See <a href="./study/isbe/search.html?string=THESSALONIANS,+THE+SECOND+EPISTLE+OF+PAUL+TO+THE">THESSALONIANS, THE SECOND EPISTLE OF PAUL TO THE, III</a>.``132';
isbe[5753]='Man of War``<a href="./study/isbe/search.html?string=WAR">WAR</a>`1';
isbe[5754]='Man, Natural`nat\'-u-ral, nach\'-u-ral (psuchikos anthropos): Man as he is by nature, contrasted with man as he becomes by grace. This phrase is exclusively Pauline.<P>I. Biblical Meaning.<P>The classical passage in which it occurs is <a onClick="return mV(\'1Cr\',2,14);">1Co 2:14</a> King James Version: "But the natural man receiveth not the things of the Spirit of God: for they are foolishness unto him: neither can he know them, because they are spiritually discerned." In his anthropology Paul uses four groups of descriptive adjectives in contrasted pairs:<P>(1) the old man and the new man (<a onClick="return mV(\'Rom\',6,6);">Ro 6:6</a>; <a onClick="return mV(\'Eph\',4,22);">Eph 4:22</a>; <a onClick="return mV(\'Col\',3,9);">Col 3:9</a>; <a onClick="return mV(\'Eph\',2,15);">Eph 2:15</a>; <a onClick="return mV(\'Eph\',4,24);">4:24</a>; <a onClick="return mV(\'Col\',3,10);">Col 3:10</a>);<P>(2) the outward man and the inward man (<a onClick="return mV(\'2Cr\',4,16);">2Co 4:16</a>; <a onClick="return mV(\'Rom\',7,22);">Ro 7:22</a>; <a onClick="return mV(\'Eph\',3,16);">Eph 3:16</a>);<P>(3) the carnal man and the spiritual man (<a onClick="return mV(\'Rom\',8,\'1-14\');">Ro 8:1-14</a>; <a onClick="return mV(\'1Cr\',3,1,3,4);">1Co 3:1,3,4</a>);<P>(4) the natural man and the spiritual man (<a onClick="return mV(\'2Cr\',2,14);">2Co 2:14</a>; <a onClick="return mV(\'2Cr\',3,3,4);">3:3,4</a>; <a onClick="return mV(\'Eph\',2,3);">Eph 2:3</a>; <a onClick="return mV(\'1Cr\',2,15);">1Co 2:15</a>; <a onClick="return mV(\'1Cr\',3,1);">3:1</a>; <a onClick="return mV(\'1Cr\',14,37);">14:37</a>; <a onClick="return mV(\'1Cr\',15,46);">15:46</a>; <a onClick="return mV(\'Gal\',6,1);">Ga 6:1</a>).<P>A study of these passages will show that the adjectives "old," "outward," "carnal," and "natural" describe man, from different points of view, prior to his conversion; while the adjectives "new," "inward" and "spiritual" describe him, from different points of view, after his conversion. To elucidate the meaning, the expositor must respect these antitheses and let the contrasted words throw light and meaning upon each other.<P>1. The Old Man:<P>The "old man" is the "natural man" considered chronologically—prior to that operation of the Holy Spirit by which he is renovated into the "new man."<P>The old house is the house as it was before it was remodeled; an old garment is the garment as it was before it was re-fashioned; and the "old man" is man as he was before he was regenerated and sanctified by the grace of the Spirit. "Our old man is crucified with him, that the body of sin might be destroyed, that henceforth we should not serve sin" (<a onClick="return mV(\'Rom\',6,6);">Ro 6:6</a> the King James Version). Here the "old man" is called the "body of sin," as the physical organism is called the body of the soul or spirit, and is to be "crucified" and "destroyed," in order that man may no longer be the "servant of sin." "Put off concerning the former conversation the old man, which is corrupt....Put on the new man, which after God is created in righteousness and true holiness" (<a onClick="return mV(\'Eph\',4,22,24);">Eph 4:22,24</a> the King James Version). Here the "old man" is said to be "corrupt," and we are called upon to "put it off." The figure is that of putting off old clothes which are unclean, and putting on those garments which have come from the wash clean and snowy white. We have the same idea, in different language and with a slightly different imagery.<P>When Paul calls the "natural man" the "old man," and describes it as the "body of sin" which is "corrupt" in its nature and "deeds," and tells us that it must be "crucified" and "destroyed" and "put off" in order that we may "not serve sin," but may have "righteousness" and "true holiness" and "knowledge" and the "image" of God, we get some conception of the moral meaning which he is endeavoring to convey by these contrasts (<a onClick="return mV(\'Gal\',5,\'19-24\');">Ga
