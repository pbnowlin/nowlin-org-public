isbe[8176]='Silver`sil\'-ver (keceph; argurion, arguros): Silver was known in the earliest historic times. Specimens of early Egyptian and Babylonian silver work testify to the skill of the ancient silversmiths. In Palestine, silver objects have been found antedating the occupation of the land by the Hebrews. This metal was used for making all kinds of ornamental objects. In the mound of Gezer were found bowls, vases, ladles, hairpins, rings and bracelets of silver. The rings and settings for scarabs or seals were commonly of this metal. The first mention of silver in the Bible is in <a onClick="return mV(\'Gen\',13,2);">Ge 13:2</a>, where it says that Abraham was rich in cattle, in silver and gold. At that time it was commonly used in exchange in the form of bars or other shapes. Coins of that metal were of a much later date (<a onClick="return mV(\'Gen\',20,16);">Ge 20:16</a>; <a onClick="return mV(\'Gen\',23,15);">23:15</a>; <a onClick="return mV(\'Gen\',24,53);">24:53</a>; <a onClick="return mV(\'Gen\',37,28);">37:28</a>, etc.). Booty was collected in silver (<a onClick="return mV(\'Jos\',6,19);">Jos 6:19</a>); tribute was paid in the same (<a onClick="return mV(\'1Ki\',15,19);">1Ki 15:19</a>). It was also used for jewelry (<a onClick="return mV(\'Gen\',44,2);">Ge 44:2</a>). The Children of Israel systematically despoiled the Egyptians of their silver before the exodus (<a onClick="return mV(\'Exd\',3,22);">Ex 3:22</a>; <a onClick="return mV(\'Exd\',11,2);">11:2</a>; <a onClick="return mV(\'Exd\',12,35);">12:35</a>, etc.). <a onClick="return mV(\'Exd\',20,23);">Ex 20:23</a> implies that idols were made of it. It was largely used in the fittings of the tabernacle (<a onClick="return mV(\'Exd\',26,\'1-\');">Ex 26</a>) and later of the temple (<a onClick="return mV(\'2Ch\',2,\'1-\');">2Ch 2</a>).<P>It is likely that the ancient supply of silver came from the mountains of Asia Minor where it is still found in abundance associated with lead as argentiferous galena, and with copper sulfide. The Turkish government mines this silver on shares with the natives. The Sinaitic peninsula probably also furnished some silver. Later Phoenician ships brought quantities of it from Greece and Spain. The Arabian sources are doubtful (<a onClick="return mV(\'2Ch\',9,14);">2Ch 9:14</a>). Although silver does not tarnish readily in the air, it does corrode badly in the limestone soil of Palestine and Syria. This probably partly accounts for the small number of objects of this metal found. On the site of the ancient jewelers\' shops of Tyre the writer found objects of gold, bronze, lead, iron, but none of silver.<P>Figurative:<P>Silver to be as stones in Jerusalem (<a onClick="return mV(\'1Ki\',10,27);">1Ki 10:27</a>) typified great abundance (compare <a onClick="return mV(\'Job\',3,15);">Job 3:15</a>; <a onClick="return mV(\'Job\',22,25);">22:25</a>; <a onClick="return mV(\'Job\',27,16);">27:16</a>; also <a onClick="return mV(\'Isa\',60,17);">Isa 60:17</a>; <a onClick="return mV(\'Zec\',9,3);">Zec 9:3</a>). The trying of men\'s hearts was compared to the refining of silver (<a onClick="return mV(\'Psa\',66,10);">Ps 66:10</a>; <a onClick="return mV(\'Isa\',48,10);">Isa 48:10</a>). Yahweh\'s words were as pure as silver refined seven times (<a onClick="return mV(\'Psa\',12,6);">Ps 12:6</a>). The gaining of understanding is better than the gaining of silver (<a onClick="return mV(\'Pro\',3,14);">Pr 3:14</a>; compare <a onClick="return mV(\'Pro\',8,19);">Pr 8:19</a>; <a onClick="return mV(\'Pro\',10,20);">10:20</a>; <a onClick="return mV(\'Pro\',16,16);">16:16</a>; <a onClick="return mV(\'Pro\',22,1);">22:1</a>; <a onClick="return mV(\'Pro\',25,11);">25:11</a>). Silver become dross denoted deterioration (<a onClick="return mV(\'Isa\',1,22);">Isa 1:22</a>; <a onClick="return mV(\'Jer\',6,30);">Jer 6:30</a>). Breast and arms of silver was interpreted by Daniel to mean the inferior kingdom to follow Nebuchadnezzar\'s (<a onClick="return mV(\'Dan\',2,32,39);">Da 2:32,39</a>).<P>In the New Testament, reference should be made especially to <a onClick="return mV(\'Act\',19,24);">Ac 19:24</a>; <a onClick="return mV(\'Jam\',5,3);">Jas 5:3</a>; <a onClick="return mV(\'Rev\',18,12);">Re 18:12</a>.``133';
isbe[8177]='Silverling`sil\'-ver-ling (\'eleph kecheph (<a onClick="return mV(\'Isa\',7,23);">Isa 7:23</a>)): \'A thousand of silver\' means a thousand shekels.`<a href="./study/isbe/search.html?string=PIECE+OF+SILVER">PIECE OF SILVER</a>`1';
isbe[8178]='Silversmith`sil\'-ver-smith (argurokopos): Mentioned only once (<a onClick="return mV(\'Act\',19,24);">Ac 19:24</a>), where reference is made to Demetrius, a leading member of the silversmiths\' guild of Ephesus.``1';
isbe[8179]='Simalcue`si-mal-ku\'-e: the King James Version = the Revised Version (British and American) <a href="./study/isbe/search.html?string=IMALCUE">IMALCUE</a> (which see).``1';
isbe[8180]='Simeon (1)`sim\'-e-on (shim\'on; Sumeon; the Hebrew root is from shama\', "to hear" (<a onClick="return mV(\'Gen\',29,33);">Ge 29:33</a>); some modern scholars (Hitzig, W. R. Smith, Stade, etc.) derive it from Arabic sima\', "the offspring of the hyena and female wolf"): In <a onClick="return mV(\'Gen\',29,33);">Ge 29:33</a>; <a onClick="return mV(\'Gen\',30,\'18-21\');">30:18-21</a>; <a onClick="return mV(\'Gen\',35,23);">35:23</a>, Simeon is given as full brother to Reuben, Levi, Judah, Issachar and Zebulun, the son of Leah; and in <a onClick="return mV(\'Gen\',34,25);">Ge 34:25</a>; <a onClick="return mV(\'Gen\',49,5);">49:5</a> as the brother of Levi and Dinah. He was left as a hostage in Egypt by orders of Joseph (<a onClick="return mV(\'Gen\',42,24);">Ge 42:24</a>; <a onClick="return mV(\'Gen\',43,23);">43:23</a>).<P>1. The Patriarch: Biblical Data:<P>In the "blessing" of the dying Jacob, Simeon and Levi are linked together:<P class="in15">"Simeon and Levi are brethren;<br>Weapons of violence are their swords.<br>O my soul, come not thou into their council;<br>Unto their assembly, my glory, be not thou united;<br>For in their anger they slew a man,<br>And in their self-will they hocked an ox.<br>Cursed be their anger, for it was fierce;<br>And their wrath, for it was cruel:<br>I will divide them in Jacob,<br>And scatter them in Israel" (<a onClick="return mV(\'Gen\',49,\'5-7\');">Ge 49:5-7</a>).<P>Whatever view may be taken of the events of <a onClick="return mV(\'Gen\',34,25);">Ge 34:25</a> (and some would see in it "a tradition of the settlement of Jacob which belongs to a cycle quite independent of the descent into Egypt and the Exodus" (see S. A. Cook, Encyclopedia Brit, article "Simeon")), it is clear that we have here a reference to it and the suggestion that the subsequent history of the tribe, and its eventual absorption in Judah, was the result of violence. In the same way the priestly Levites became distributed throughout the other tribes without any tribal inheritance of their own (<a onClick="return mV(\'Deu\',18,1);">De 18:1</a>; <a onClick="return mV(\'Jos\',13,14);">Jos 13:14</a>). From the mention (<a onClick="return mV(\'Gen\',46,10);">Ge 46:10</a>; <a onClick="return mV(\'Exd\',6,15);">Ex 6:15</a>) of Shaul as being the son of a Canaanite woman, it may be supposed that the tribe was a mixed one.<P>In the "blessing of Moses" (<a onClick="return mV(\'Deu\',33,\'1-\');">De 33</a>) Simeon is not mentioned at all in the Hebrew text, although in some manuscripts of the Septuagint the latter half of <a onClick="return mV(\'Deu\',33,6);">De 33:6</a> is made to apply to him: "Let Simeon be a small company." The history of the tribe is scanty and raises many problems. Of the many theories advanced to meet them it cannot be said that any one answers all difficulties.<P>2. The Tribe in Scripture:<P>In the wilderness of Sinai the Simeonites camped beside the Reubenites (<a onClick="return mV(\'Num\',2,12);">Nu 2:12</a>; <a onClick="return mV(\'Num\',10,19);">10:19</a>); it was Zimri, a member of one of the leading families of this tribe, who was slain by Phinehas in the affair of Baal-peor (<a onClick="return mV(\'Num\',25,14);">Nu 25:14</a>). The statistics in <a onClick="return mV(\'Num\',1,22);">Nu 1:22</a>f; where the Simeonites are given as 59,300, compared with the 2nd census (<a onClick="return mV(\'Num\',26,14);">Nu 26:14</a>), where the numbers are 22,200, indicate a diminishing tribe. Some have connected this with the sin of Zimri.<P>At the recital of the law at Mt. Gerizim, Simeon is mentioned first among those that were to respond to the blessings (<a onClick="return mV(\'Deu\',27,12);">De 27:12</a>). In the conquest of Canaan "Judah said unto Simeon his brother, Come up with me into my lot, that we may fight against the Canaanites; and I likewise will go with thee into thy lot. So Simeon went with him" (<a onClick="return mV(\'Jdg\',1,3);">Jud 1:3</a>; compare <a onClick="return mV(\'Jdg\',1,17);">Jud 1:17</a>). (Many scholars find in <a onClick="return mV(\'Gen\',34,\'1-\');">Ge 34</a> a tribal attempt on the part of the Simeonites to gain possession of Shechem; if this is so, Judah did not assist, and the utter failure may have been a cause of Simeon\'s subsequent dependence upon, and final absorption in, Judah.) In <a onClick="return mV(\'Jdg\',4,\'1-\');">Jud 4</a> and <a onClick="return mV(\'Jdg\',5,\'1-\');">5</a> Simeon is never mentioned. In the settlement of the land there is no account of how Simeon established himself in his territory (except the scanty reference in <a onClick="return mV(\'Jdg\',1,3);">Jud 1:3</a>), but "their inheritance was in the midst of the inheritance of the children of Judah" (<a onClick="return mV(\'Jos\',19,1);">Jos 19:1</a>); this is accounted for (<a onClick="return mV(\'Jos\',19,9);">Jos 19:9</a>), "for the portion of the children of Judah was too much for them." Nevertheless we find there the very cities which are apportioned to Simeon, allotted to Judah (<a onClick="return mV(\'Jos\',15,\'21-32\');">Jos 15:21-32</a>; compare <a onClick="return mV(\'Neh\',11,\'26-29\');">Ne 11:26-29</a>). It is suggested (in <a onClick="return mV(\'1Ch\',4,31);">1Ch 4:31</a>) that the independent possession of these cities ceased in the time of David. David sent spoil to several Simeonite towns (<a onClick="return mV(\'1Sa\',30,26);">1Sa 30:26</a>f), and in <a onClick="return mV(\'1Ch\',12,25);">1Ch 12:25</a> it is recorded that 7,100 Simeonite warriors came to David in Hebron. In <a onClick="return mV(\'1Ch\',27,16);">1Ch 27:16</a> we have mention of a ruler of the Simeonites, Shephatiah, son of Maacah.<P>In <a onClick="return mV(\'1Ch\',4,39);">1Ch 4:39</a>f mention is made of certain isolated exploits of Simeonites at <a href="./study/isbe/search.html?string=GEDOR">GEDOR</a> (which see), against the <a href="./study/isbe/search.html?string=MEUNIM">MEUNIM</a> (which see), and at Mt. <a href="./study/isbe/search.html?string=SEIR">SEIR</a> (which see). Later references associate certain Simeonites with the Northern Kingdom (<a onClick="return mV(\'2Ch\',15,9);">2Ch 15:9</a>; <a onClick="return mV(\'2Ch\',34,6);">34:6</a>), and tradition has come to view them as one of the ten tribes (compare <a onClick="return mV(\'Eze\',48,24,25,33);">Eze 48:24,25,33</a>; <a onClick="return mV(\'Rev\',7,7);">Re 7:7</a>), although all the history of them we have is bound up with Judah and the Southern Kingdom. There is no mention of the return of any Simeonites after the captivity; their cities fall to Judah (<a onClick="return mV(\'Neh\',11,26);">Ne 11:26</a>f).<P>3. References in Egyptian and Assyrian Inscriptions:<P>It has been supposed by many authorities that the name Shim\'an occurs in the list of places plundered by Thothmes III (see Petrie, Hist, II, 104; also Hommel, Ancient Hebrew Tradition, 268; Sayce, Early Hebrew Traditions, 392). In the 7th century we have a doubtful reference in an inscription of Esar-haddon relating his Egyptian campaign when a city Ap-ku is mentioned as in the country of Sa-me-n(a), which may possibly be a reference to Simeon. The survival of the name so late, if true, is strange, in the light of what we gather from the Bible about the tribe. (For discussion of both of these inscriptions, with references to the lit., see EB, coll. 4528-30.)<P>4. The Territory of Simeon:<P>The cities of Simeon as given in <a onClick="return mV(\'Jos\',19,\'2-6\');">Jos 19:2-6</a> and <a onClick="return mV(\'1Ch\',4,28,31);">1Ch 4:28,31</a> are (the names in parentheses are variations in the latter reference): <A href="./study/isbe/search.html?string=BEERSHEBA">Beer-sheba</A>, <A href="./study/isbe/search.html?string=MOLADAH">Moladah</a>, <A href="./study/isbe/search.html?string=HAZAR">Hazar-shual</a>, <A href="./study/isbe/search.html?string=BALAH">Balah (Bilhah)</a>, <A href="./study/isbe/search.html?string=AZEM">Azem (the King James Version) (Ezem)</a>, <A href="./study/isbe/search.html?string=ELTOLAD">Eltolad (Tolad)</a>, <A href="./study/isbe/search.html?string=BETHUEL+(2)">Bethuel</a>, <A href="./study/isbe/search.html?string=HORMAH">Hormah</A>, <A href="./study/isbe/search.html?string=ZIKLAG">Ziklag</a>, <A href="./study/isbe/search.html?string=BETH-MARCABOTH">Beth-Marcaboth</a>, <A href="./study/isbe/search.html?string=HAZAR">Hazar-susah (Hazar Susim)</a>, <A href="./study/isbe/search.html?string=BETH-LEBAOTH">Beth-lebaoth (Beth-biri)</A>, <A href="./study/isbe/search.html?string=SHARUHEN">Sharuhen (Shaaraim) (Etam)</A>, <A href="./study/isbe/search.html?string=AIN+(2)">Ain Rimmon</a>, <A href="./study/isbe/search.html?string=ETHER">Ether (Tochen)</a>, <A href="./study/isbe/search.html?string=ASHAN">Ashan</A>—in all, 16 cities in Joshua and 17 cities in 1 Chronicles. Ashan (<a onClick="return mV(\'1Ch\',6,59);">1Ch 6:59</a>) is the only one assigned to the priests. It is written wrongly as "Ain" in <a onClick="return mV(\'Jos\',21,16);">Jos 21:16</a>. All the above cities, with certain variations in form, and with the exception of Etam in <a onClick="return mV(\'1Ch\',4,32);">1Ch 4:32</a>, which is probably a mistake, occur in the list of the cities of Judah (<a onClick="return mV(\'Jos\',15,\'26-32\',42);">Jos 15:26-32,42</a>). Ziklag is mentioned (<a onClick="return mV(\'1Sa\',27,6);">1Sa 27:6</a>) as being the private property of the kings of Judah from the days of David, who received it from Achish, king of Gath.<P>For the situation of these cities, so far as is known, see separate articles under their names. It is clear that they were all situated in the southwestern part of Palestine, and that Simeon had no definite territorial boundaries, but isolated cities, with their villages, among those of the people of Judah.``117';
isbe[8181]='Simeon (2)`(shim\'on; Sumeon):<P>(1) The 2nd son of Jacob by Leah (see separate article [<A href="./study/isbe/search.html?string=SIMEON+(1)">Simeon (1)</a>]).<P>(2) Great-grandfather of Judas Maccabeus (1Macc 2:1).<P>(3) A man in Jerusalem described as "righteous and devout, looking for the consolation of Israel." When the infant Jesus was brought into the Temple, he took Him into his arms and blessed God in words which are famous as the Nunc dimittis. Simeon bestowed his blessing on the wondering father and mother (<a onClick="return mV(\'Luk\',2,25,34);">Lu 2:25,34</a>). Legend has made him the son of Hillel and father of Gamaliel I, but this has no historical basis.<P>(4) An ancestor of Jesus (<a onClick="return mV(\'Luk\',3,30);">Lu 3:30</a>); the Revised Version (British and American) "Symeon."<P>(5) The Revised Version (British and American) "Symeon": one of the prophets and teachers in the Christian community at Antioch. He is also called Niger, which was the Gentile name he had assumed, Symeon being Hebrew. He was among those who set apart Paul and Barnabas for their missionary work (<a onClick="return mV(\'Act\',13,1,2);">Ac 13:1,2</a>). Nothing more is known of him.<P>(6) The Revised Version (British and American) "Symeon": the Hebrew name of Simon Peter (<a onClick="return mV(\'Act\',15,14);">Ac 15:14</a>).``78';
isbe[8182]='Simeon (Niger)`ni\'-jer): The King James Version in <a onClick="return mV(\'Act\',13,1);">Ac 13:1</a>, the Revised Version (British and American) "<a href="./study/isbe/search.html?string=SYMEON">Symeon</a>" (which see).``1';
isbe[8183]='Simeonites`sim\'-e-on-its.`<a href="./study/isbe/search.html?string=SIMEON">SIMEON</a>`1';
isbe[8184]='Similitude`si-mil\'-i-tud: In the King James Version means either "an exact facsimile" (<a onClick="return mV(\'Psa\',106,20);">Ps 106:20</a> the King James Version, the Revised Version (British and American) "likeness"; <a onClick="return mV(\'Rom\',5,14);">Ro 5:14</a>, etc.), or else "the form itself" (<a onClick="return mV(\'Num\',12,8);">Nu 12:8</a>; <a onClick="return mV(\'Deu\',4,12,15,16);">De 4:12,15,16</a> for temunah, "form" (so the Revised Version (British and American))); compare <a href="./study/isbe/search.html?string=LIKENESS">LIKENESS</a>. the English Revised Version has retained the word in <a onClick="return mV(\'2Ch\',4,3);">2Ch 4:3</a>; <a onClick="return mV(\'Dan\',10,16);">Da 10:16</a> (the American Standard Revised Version "likeness"), while the English Revised Version and the American Standard Revised Version have used "similitudes" in <a onClick="return mV(\'Hsa\',12,10);">Ho 12:10</a> (damah, "be like"). The meaning is "I have inspired the prophets to speak parables."``1';
isbe[8185]='Simon (1)`(Simon, Greek form of <a href="./study/isbe/search.html?string=SIMEON">SIMEON</a> (which see)): The persons of the name of Simon mentioned in the Apocrypha are:<P>(1) Simon the Maccabean (Hasmonean), surnamed <a href="./study/isbe/search.html?string=THASSI">THASSI</a> (which see), the 2nd son of Mattathias and elder brother of Judas Maccabeus. On his deathbed, Mattathias commended Simon as a "man of counsel" to be a "father" to his brethren (1Macc 2:65), and a "man of counsel" he proved himself. But it was not till after the death of Judas and the capture of Jonathan that he played the chief role. Dispatched by Judas with a force to the relief of the Jews in Galilee he fought with great success (1Macc 5:17ff; Josephus, Ant, XII, viii, 1f). We find him next taking revenge along with Jonathan on the "children of Jambri" (1Macc 9:33ff), and cooperating in the successful campaign around Bethbasi against Bacchides (circa 156 BC) (1Macc 9:62ff), and in the campaign against Apollonius (1Macc 10:74ff). In the conflict between Tryphon and Demetrius II, Simon was appointed by Antiochus VI "captain from the Ladder of Tyre unto the borders of Egypt" (1Macc 11:59). After the capture of Jonathan at Ptolemais by Tryphon, Simon became acknowledged leader of his party. He thwarted Tryphon in his attempts upon Jerusalem, in revenge for which the latter murdered Jonathan (1Macc 13:23). Simon then took the side of Demetrius on condition of immunity for Judea, and so \'in the 170th year\' (143-142 BC) \'the yoke of the heathen was taken away from Israel\' (1Macc 13:41). Simon applied himself to rebuild the strongholds of Judea, reduced Gazara, captured the Acra (citadel) and made Joppa a seaport. He showed his wisdom most of all in his internal administration: "He sought the good of his country"; commerce and agriculture revived; lawlessness was suppressed and "the land had rest all the days of Simon (1Macc 14:4ff). His power was acknowledged by Sparta and Rome (1Macc 14:16ff). In 141 BC he was appointed by the nation leader, high priest and captain "for ever, until there should arise a faithful prophet" (1Macc 14:41ff), and thus the Hasmonean dynasty was founded. A new chronological era began with the first year of his administration, and he minted his own coins. A few years later Simon again meddled in Syrian politics (139 BC), this time at the entreaty of Antiochus VII (Sidetes) in his contest against Tryphon; when, however, Antiochus was assured of success, he refused the help of Simon and sent Cendebaeus against Judea. Judas and John, sons of Simon, defeated the invaders near Modin (137-136 BC). In 135 BC Simon met his death by treachery. Ptolemy the son of Abubus, Simon\'s own son-in-law, determined to secure supreme power for himself and, in order to accomplish this, to assassinate the whole family of Simon. He accordingly invited Simon and his sons to a banquet in the stronghold of Dok near Jericho, where he treacherously murdered Simon with his two sons Mattathias and Judas. The other son, John Hyrcanus, governor of Gazara, received intimation of the plot and saved himself to become the head of the Hasmonean dynasty. "The significance of Simon\'s administration consists in this, that he completed the work of Jonathan and left the Jewish people absolutely independent of Syria" (Schurer).<P>See <a href="./study/isbe/search.html?string=MACCABAEUS">MACCABAEUS, II, 4</a>.<P>(2) Simon I, the high priest, son of Onias I, whom he succeeded circa 300 BC. He was one of the last of the Great Synagogue, and to him is attributed the saying, "On three things the world depends—the Law, Worship and the showing of kindness." According to Josephus (Ant., XII, ii, 5) this Simon was called "the Just" (ho dikaios), "on account of his piety and his benevolent disposition toward his countrymen."<P>Many authorities (Herzfeld, Derenbourg, Stanley, Cheyne) assert that Josephus is wrong in attaching this epithet to Simon I instead of Simon II, and Schurer is not certain on this question. But the Talmud passage which Derenbourg cites means the opposite of what he takes it, namely, it is intended to show how splendid and holy were the days of Simeon (ha-tsaddiq) compared with the later days. Besides, Josephus is more likely to have known the truth on this matter than these later authorities. The same uncertainty obtains as to whether the eulogium in Sirach 50:1ff of "the great priest" refers to Simon I or Simon II. Schurer and others refer it to Simon II. It is more likely to refer to the Simon who was famous as "the Just," and consequently to Simon I. Besides we know of no achievements of Simon II to entitle him to such praise. The building operations mentioned would suit the time of Simon I better, as Ptolemy captured Jerusalem and probably caused considerable destruction. The Talmud states that this Simon (and not Jaddua) met Alexander the Great.<P>(3) Simon II, high priest, son of Onias II and grandson of Simon I and father of Onias III, flourished about the end of the 3rd century BC, and was succeeded by his son Onias III circa 198 BC. Josephus says that this Simon in the conflict of the sons of Joseph sided with the elder sons against Hyrcanus the younger. Schurer (probably incorrectly) thinks he is the Simon praised in Sirach 50:1ff. See (2) above (3Macc 2:1; Josephus, Ant, XII, iv, 10).<P>(4) Simon, a Benjamite, guardian of the temple, who, having quarreled with the high priest Onias III, informed Apollonius of the untold sums of money in the temple treasury. Apollonius laid the matter before the king Seleucus IV, who sent Heliodorus to remove the money. An apparition prevented Heliodorus from accomplishing his task (2Macc 3:4ff). It is further recorded, that Simon continued his opposition to Onias. He is spoken of as brother of the renegade Menelaus (2Macc 4:23). Of his end we know nothing.<P>(5) Simon Chosameus (Codex Vaticanus (and Swete) Chosamaos; Codex Alexandrinus Chosomaios), one of the sons of Annas who had married "strange wives" (1Esdras 9:32). Simon apparently = "Shimeon" (shim\'on) of the sons of Harim (<a onClick="return mV(\'Ezr\',10,31);">Ezr 10:31</a>); Chosameus is probably a corruption standing in the place of, but not resembling, any of the three names: Benjamin, Malluch, Shemaraiah, which Esdras omits from the Ezra list.``5';
isbe[8186]='Simon (2)`si\'-mon (Simon):<P>(1) Simon Peter.<P>See <a href="./study/isbe/search.html?string=SIMON+PETER">PETER (SIMON)</A>.<P>(2) Another of the Twelve, Simon "the Cananean" (<a onClick="return mV(\'Mat\',10,4);">Mt 10:4</a>; <a onClick="return mV(\'Mar\',3,18);">Mr 3:18</a>), "the Zealot" (<a onClick="return mV(\'Luk\',6,15);">Lu 6:15</a>; <a onClick="return mV(\'Act\',1,13);">Ac 1:13</a>).<P>See <a href="./study/isbe/search.html?string=CANANAEAN">CANANAEAN</A>.<P>(3) One of the brethren of Jesus (<a onClick="return mV(\'Mat\',13,55);">Mt 13:55</a>; <a onClick="return mV(\'Mar\',6,3);">Mr 6:3</a>).<P>See <a href="./study/isbe/search.html?string=BRETHREN+OF+THE+LORD">BRETHREN OF THE LORD</A>.<P>(4) "The leper" in Bethany, in whose house a woman poured a cruse of precious ointment over the head of Jesus (<a onClick="return mV(\'Mat\',26,6);">Mt 26:6</a>; <a onClick="return mV(\'Mar\',14,3);">Mr 14:3</a>). He had perhaps been healed by Jesus; in that case his ungracious behavior was not consistent with due gratitude. However he was healed, the title referred to his condition in the past, as lepers were ostracized by law.<P>(5) A Pharisee in whose house a woman, "a sinner," wet the feet of Jesus with her tears, and anointed them with ointment (<a onClick="return mV(\'Luk\',7,36);">Lu 7:36</a>). By some he is identified with (4), this being regarded as Luke\'s version of the incident recorded in <a onClick="return mV(\'Mat\',26,\'1-\');">Mt 26</a> and <a onClick="return mV(\'Mar\',14,\'1-\');">Mr 14</a>. Others as strongly deny this view.<P>For discussion see <a href="./study/isbe/search.html?string=MARY">MARY, IV</A>.<P>(6) A man of Cyrene, who was compelled to carry the cross of Jesus (<a onClick="return mV(\'Mat\',27,32);">Mt 27:32</a>; <a onClick="return mV(\'Mar\',15,21);">Mr 15:21</a>; <a onClick="return mV(\'Luk\',23,26);">Lu 23:26</a>). Mark calls him "the father of Alexander and Rufus," well-known members of the church at (probably) Rome (compare <a onClick="return mV(\'Act\',19,33);">Ac 19:33</a>; <a onClick="return mV(\'Rom\',16,13);">Ro 16:13</a>).<P>See <a href="./study/isbe/search.html?string=CYRENIAN">CYRENIAN</A>.<P>The father of Judas Iscariot (<a onClick="return mV(\'Jhn\',6,71);">Joh 6:71</a>; <a onClick="return mV(\'Jhn\',12,4);">12:4</a> the King James Version, the Revised Version (British and American) omits; <a onClick="return mV(\'Jhn\',13,2,26);">Joh 13:2,26</a>).<P>(8) Simon Magus (<a onClick="return mV(\'Act\',8,9);">Ac 8:9</a>). See separate article [<A href="./study/isbe/search.html?string=Simon+Magus">Simon Magus</a>].<P>(9) Simon, the tanner, with whom Peter lodged at Joppa. His house was by the seaside outside the city wall, because of its ceremonial uncleanness to a Jew, and also for reasons of sanitation (<a onClick="return mV(\'Act\',9,43);">Ac 9:43</a>).``78';
isbe[8187]='Simon Magus`ma\'-gus (Simon, Greek form of Hebrew shim\'on; Gesenius gives the meaning of the Hebrew word as "hearing with acceptance"; it is formed from [?] shama\', "to hear"):<P>1. Simon, a Magician<P>2. Simon and the Apostles<P class="in15">(1) Simon and Philip<P class="in15">(2) Simon and Peter John<P>3. The Magicians and the Gospel<P>4. Testimony of Early Christian Writers<P>5. Sources of Legendary History<P>6. Traditions of His Death<P>7. The Simoniani<P>8. Was Simon the Originator of Gnosticism?<hr /><P>1. Simon, a Magician:<P>The name or term "Magus" is not given to him in the New Testament, but is justly used to designate or particularize him on account of the incident recorded in <a onClick="return mV(\'Act\',8,\'9-24\');">Ac 8:9-24</a>, for though the word "Magus" does not occur, yet in <a onClick="return mV(\'Act\',8,9);">8:9</A> the present participle mageuon is used, and is translated, both in the King James Version and in the Revised Version (British and American), "used sorcery." Simon accordingly was a sorcerer, he "bewitched the people of Samaria" (the King James Version). In <a onClick="return mV(\'Act\',8,11);">Ac 8:11</a> it is also said that "of long time he had amazed" them "with his sorceries" (magiais). The claim, given out by himself, was that he "was some great one"; and this claim was acknowledged by the Samaritans, for previous to the introduction of the gospel into Samaria, "they all gave heed (to him), from the least to the greatest, saying, This man is that power of God which is called Great" (<a onClick="return mV(\'Act\',8,10);">8:10</A>).<P>2. Simon and the Apostles:<P>(1) Simon and Philip:<P>It so happened, however, that Philip the deacon and evangelist went down from Jerusalem to Samaria, and "proclaimed unto them the Christ" (<a onClick="return mV(\'Act\',8,5);">Ac 8:5</a>); and as the result of the proclamation of the gospel, many were gathered into the Christian church. Many miracles also were performed by Philip, sick persons cured, and demons cast out; and Simon fell under the influence of all these things, both of the preaching and of "the signs." So great was the impression now made upon Simon that he "believed" (<a onClick="return mV(\'Act\',8,13);">Ac 8:13</a>). This means, at least, that he saw that Philip was able in the name of Jesus Christ to display powers greater than anything he himself was acquainted with: Philip\'s power was greater by far than Simon\'s. He therefore came forward as one of the new converts, and was baptized. After his baptism he continued with Philip. The signs which accompanied the introduction of the gospel into this city did not cease, and Simon seeing them "was amazed." The word denoting Simon\'s amazement at the "signs" wrought by Philip is the same as that used to express how the people of Samaria had been amazed at Simon\'s sorceries. It is an indication of the nature of the faith which he possessed in the gospel—wondering amazement at a new phenomenon not yet understood, not repentance or trust in Christ.<P>(2) Simon and Peter and John:<P>News having reached Jerusalem of the events which had occurred in Samaria, the apostles sent Peter and John to establish the work there. These two apostles prayed for the converts that they might receive the Holy Ghost, which they had not yet received. And when they had laid their hands upon the converts, the Spirit was given to them. At this early period in the history of the church the Holy Ghost was bestowed in a visible manner which showed itself in such miraculous gifts as are described in <a onClick="return mV(\'Act\',2,\'1-\');">Ac 2</a>. Simon saw what had taken place, and then, instead of joining the company of those who had truly repented and trusted Christ, he came forward with the same amazement as he had previously shown, and offered money to Peter and John, if they would impart to him the power of giving the Holy Spirit to others. Peter instantly rebuked this bold and ungodly request, and did so with such sterness as to cause Simon to ask that the judgment threatened by the apostle might not fall upon him.<P>Such is the unenviable history of Simon Magus, as it is recorded in the New Testament. Later centuries have shown their estimation of the heinousness of Simon\'s sin by employing his name to indicate the crime of buying or selling price a spiritual office for a price in money—"simony."<P>3. The Magicians and the Gospel:<P>It is not strange to find the gospel brought into direct conflict with magicians, for in the 1st and 2nd centuries there were a multitude of such persons who pretended to possess supernatural powers by which they endeavored to deceive men. They flattered the sinful inclinations of the human heart, and fell in with men\'s current ways of thinking, and required no self-renunciation at all. For these reasons the magicians found a ready belief on the part of many. The emperor Tiberius, in his later years, had a host of magicians in constant attendance upon him. Elymas, with whom Paul came in contact in Cyprus "was with the deputy of the country, Sergius Paulus, a prudent man" (<a onClick="return mV(\'Act\',13,7);">Ac 13:7</a> the King James Version). Elymas was one of those magicians, and he endeavored to turn away the deputy from the faith. Luke expressly calls this man "magus", Elymas the magus (<a onClick="return mV(\'Act\',13,6,8);">Ac 13:6,8</a> margin).<P>The influence of such persons presented an obstacle to the progress of the Christian faith, which had to force its way through the delusions with which these sorcerers had surrounded the hearts of those whom they deceived. When the gospel came in contact with these magicians and with their works, it was necessary that there should be striking facts, works of supernatural power strongly appealing to men\'s outward senses, in order to bring them out of the bewilderment and deception in which they were involved, and to make them able to receive the impression of spiritual truth. Such miracles were wrought both in Cyprus and in Samaria, the spheres of influence of the magicians Elymas and Simon. These divine works first arrested men\'s attention, and then dispelled the delusive influence of the sorcerers.<P>4. Testimony of Early Christian Writers:<P>(1) The history of Simon Magus does not close with what is narrated in the Acts, for the early Christian writers have much to say in regard to him.<P>Justin Martyr, himself a Samaritan, states that Simon Magus was a "Samaritan from the village called Gitton." Justin also relates that, in the time of Claudius Caesar, Simon was worshipped as a god at Rome on account of his magical powers, and that a statue had been erected to him, on the island in the river Tiber, with the inscription Simoni Deo Sancto, that is, "To Simon the sacred god." Curiously enough, in the year 1574, a stone which appears to have served as a pedestal of a statue, was dug up in the Tiber at the spot described by Justin; and on it were inscribed the words Semoni Sanco Deo Fidio Sacrum, that is, the stone then discovered was dedicated to the god Semo Sancus, the Sabine Hercules. This antiquarian find makes it probable that Jstin was mistaken in what he said about a statue having been erected in honor of Simon Magus. "It is incredible that the folly should ever be carried to such an extent as that a statue should be erected, and the senate should pass a decree enrolling Simon Magus among the deos Romanos" (Neander, Church History, II, 123). The inscription found in 1574 shows the source of the error into which Justin had fallen.<P>There are many stories told by some of the early Christian writers regarding Simon Magus, but they are full of legend and fable: some of them are improbable in the extreme and border on the impossible.<P>(2) Jerome, who professes to quote from writings of Simon, represents him as employing these words in reference to himself, "I am the Word of God, I am the Comforter, I am Almighty, I am all there is of God" (Mansel, The Gnostic Heresies, 82). Irenaeus (Mansel, ibid., 82) writes regarding him: "Simon, having purchased a certain woman named Helena, who had been a prostitute in the city of Tyre, carried her about with him, and said that she was the first conception of his mind, the mother of all things, by whom, in the beginning, he conceived the thought of making the angels and archangels; for that this conception proceeded forth from him, and knowing her father\'s wishes, she descended to the lower world, and produced the angels and powers; by whom also he said that this world was made. But after she had produced them, she was detained by them through envy, since they were unwilling to be considered the offspring of any other being; for he himself was entirely unknown by them; but his conception was detained by those powers and angels which were put forth from her, and suffered every insult from them that she might not return upward to her father; and this went so far that she was even confined within a human body, and for ages passed into other female bodies, as if from one vessel into another. He said also that she was that Helen, on whose account the Trojan war was fought...and that after passing from one body to another, and constantly meeting with insult, at last she became a public prostitute, and that this was the lost sheep. On this account he himself came, that he might first of all reclaim her and free her from her chains, and then give salvation to men through the knowledge of himself. For since the angels ruled the world badly, because one of them desired the chief place, he had come down for the restoration of all things, and had descended, being changed in figure, and made like to principalities and powers and angels, so that he appeared among men as a man, and was thought to have suffered in Judea, though he did not suffer....Furthermore he said that the prophets uttered their prophecies under the inspiration of those angels who framed the world; for which reason they who rest their hope on him and his Helena no longer cared for them, but as free men could act as they pleased, for that men are saved by his (i.e. Simon\'s) grace, and not according to their own just works, for that no acts were just by nature, but by accident, according to the rules established by the angels, who made the world, and who attempt by these precepts to bring men into bondage. For this reason he promised that the world should be released, and those who are his set at liberty from the government of those who made the world."<P>5. Sources of Legendary History:<P>The chief sources of the legendary history of Simon Magus are the collection of writings known as The Clementines (see <a href="./study/isbe/search.html?string=LITERATURE,+SUB-APOSTOLIC">LITERATURE, SUB-APOSTOLIC</A>; <a href="./study/isbe/search.html?string=PETER,+THE+FIRST+EPISTLE+OF">PETER, THE FIRST EPISTLE OF</A>; <a href="./study/isbe/search.html?string=PETER,+THE+SECOND+EPISTLE+OF">PETER, THE SECOND EPISTLE OF</A>). What is there said of him is, that he studied at Alexandria, and that he had been, along with the heresiarch Dositheus, a disciple of John the Baptist. He became also a disciple of Dositheus, and afterward his successor. The Clementines comprise (1) The Homilies, (2) The Recognitions, and (3) The Epitome. These three are cognate works, and in part are identical. The date of The Homilies may be placed about 160 AD. The contents comprise a supposed letter from the apostle Peter to the apostle James, along with other matter. Then follow the homilies, of which there are twenty. These record the supposed travels of Clement, a Roman citizen. Clement meets with Barnabas and with Peter. Then there is narrated a discussion between Peter and Simon Magus. This disputation lasts for three days, Simon maintaining that there are two gods, and that the God of the Old Testament is an imperfect being. Simon Magus withdraws to Tyre and then to Sidon. Peter follows Simon from place to place, counteracting his sorceries, and instructing the people. At Laodicea a second disputation takes place between the apostle and Simon on the same subjects.<P>The Homilies are not a Christian protest against Gnosticism, but merely that of one Gnostic school or sect against another, the Ebionite against the Marcionite. The Deity of Christ is denied, and He is regarded as one of the Jewish prophets.<P>In the legends Simon is represented as constantly opposing Peter, who ultimately discredits and vanquishes him. These legends occur in more forms than one, the earlier form selecting Antioch as the place where Simon was discomfited by the apostle and where he also died, while the later tradition chooses Rome for these events.<P>6. Traditions of His Death:<P>One tradition tells how the magician ordered his followers to bury him in a grave, promising that if this were done, he would rise again on the third day. They did as he wished and buried him; but this was the end of him, for he did not rise again.<P>Simon is said to have met his death at Rome, after an encounter with the apostle Peter. During this his final controversy with the apostle, Simon had raised himself in the air by the help of evil spirits, and in answer to the prayer of Peter and Paul he was dashed to the ground and killed.<P>According to another form of this tradition, Simon proposed to give the Roman emperor a proof of his power by flying off to God. He succeeded, it is said, in flying for a certain distance over Rome, but in answer to the prayer of Peter he fell and broke one of his legs. This tradition accounts for his end by saying that the people stoned him to death.<P>7. The Simoniani:<P>The Simoniani, the Simonians or followers of Simon, were an eclectic sect, who seem, at one time, to have adopted tenets and opinions derived from paganism, at another, from Judaism and the beliefs of the Samaritans, and at another still, from Christianity. Sometimes they seem to have been ascetics; at others they are wild scoffers at moral law. They regarded Simon Magus as their Christ, or at least as a form of manifestation of the redeeming Christ, who had manifested Himself also in Jesus. The Simonians were one of the minor Gnostic sects and were carried far away both from the doctrine and from the ethical spirit of the Christian faith.<P>Origen denies that the followers of Simon were Christians in any sense. The words of Origen are, "It escapes the notice of Celsus that the Simonians do not in any way acknowledge Jesus as the Son of God, but they call Simon the Power of God." In the time of Origen the followers of Simon had dwindled in number to such a degree that he writes, "I do not think it possible to find that all the followers of Simon in the whole world are more than thirty: and perhaps I have said more than there really are" (Contra Celsus, i.57, quoted by Alford, Greek New Testament, <a onClick="return mV(\'Act\',8,9);">Ac 8:9</a>).<P>8. Was Simon the Originator of Gnosticism?:<P>Irenaeus also has much to say regarding Simon and his followers. He makes the legendary Simon identical with the magician of <a onClick="return mV(\'Act\',8,\'1-\');">Ac 8</a>, makes him also the first in the list which he gives of heretics, and also says that it was from him that Gnosticism sprang. The account which he gives of the Simonians shows that by the time when Irenaeus lived, their system had developed into Gnosticism; but this fact does not justify Irenaeus in the assertion that Simon of <a onClick="return mV(\'Act\',8,\'1-\');">Ac 8</a> is the originator of the Gnostic system. The early Christian writers took this view, and regarded Simon Magus as the founder of Gnosticism. Perhaps they were right, "but from the very little authentic information we possess, it is impossible to ascertain how far he was identified with their tenets" (Alford, New Testament, II, 86). In the midst of the various legends regarding Simon, it may be that there is a substratum of fact, of such a nature that future investigation and discovery will justify these early Christian writers in their judgment, and will show that Simon Magus is not to be overlooked as one of the sources from which Gnosticism sprang. The exact origin of Gnosticism is certainly difficult to trace, but there is little or no indication that it arose from the incidents narrated in <a onClick="return mV(\'Act\',8,\'1-\');">Ac 8</a>. It cannot be denied that a connection is possible, and may have existed between the two, that is between Simon Magus and some of the Gnostic heresies; but the facts of history show widespread tendencies at work, during and even before the Apostolic age, which amply account for the rise of Gnosticism. These are found e.g. in the Alexandrian philosophy, and in the tenets of the false teachers at Colosse and in other places. These philosophical and theosophical ideas commingled with the influences of Zoroastrianism from Persia, and of Buddhism from India, and these tendencies and influences, taken in conjunction, were the sources of the various heresies known by the name of Gnosticism.`<a href="./study/isbe/search.html?string=GNOSTICISM">GNOSTICISM</a>`155';
isbe[8188]='Simon Peter``<a href="./study/isbe/search.html?string=PETER,+SIMON">PETER, SIMON</a>`1';
isbe[8189]='Simon the Canaanite; Simon the Cananaean; Simon the Zealot`(Simon Kananaios; kanna\'i, "the Jealous (or Zealous) One"): One of the Twelve Apostles. This Simon was also named "the Canaanite" (<a onClick="return mV(\'Mat\',10,4);">Mt 10:4</a>; <a onClick="return mV(\'Mar\',3,18);">Mr 3:18</a> the King James Version) or "the Cananean" (<a onClick="return mV(\'Mat\',10,4);">Mt 10:4</a>; <a onClick="return mV(\'Mar\',3,18);">Mr 3:18</a> the Revised Version (British and American)) or "Zelotes" (<a onClick="return mV(\'Luk\',6,15);">Lu 6:15</a>; <a onClick="return mV(\'Act\',1,13);">Ac 1:13</a> the King James Version) or "the Zealot" (<a onClick="return mV(\'Luk\',6,15);">Lu 6:15</a>; <a onClick="return mV(\'Act\',1,13);">Ac 1:13</a> the Revised Version (British and American)).<P>According to the "Gospel of the Ebionites" or "Gospel of the Twelve Apostles" (of the 2nd century and mentioned by Origen) Simon received his call to the apostleship along with Andrew and Peter, the sons of Zebedee, Thaddaeus and Judas Iscariot at the Sea of Tiberias (compare <a onClick="return mV(\'Mat\',4,\'18-22\');">Mt 4:18-22</a>; see also Hennecke, Neutestamentliche Apokryphen, 24-27).<P>Although Simon, like the majority of the apostles, was probably a Galilean, the designation "Cananaean" is regarded as of political rather than of geographical significance (compare Luke\'s rendering). The Zealots were a faction, headed by Judas of Galilee, who "in the days of the enrollment" (compare <a onClick="return mV(\'Act\',5,37);">Ac 5:37</a>; <a onClick="return mV(\'Luk\',2,1,2);">Lu 2:1,2</a>) bitterly opposed the threatened increase of taxation at the census of Quirinius, and would have hastened by the sword the fulfillment of Messianic prophecy.<P>Simon has been identified with Simon the brother of Jesus (<a onClick="return mV(\'Mar\',6,3);">Mr 6:3</a>; <a onClick="return mV(\'Mat\',13,55);">Mt 13:55</a>), but there also are reasons in favor of identifying him with Nathanael.<P>Thus (1) all the arguments adduced in favor of the Bartholomew-Nathanael identification (see <a href="./study/isbe/search.html?string=NATHANAEL">NATHANAEL</A>) can equally be applied to that of Simon-Nathanael, except the second. But the second is of no account, since the Philip-Bartholomew connection in the Synoptists occurs merely in the apostolic lists, while in John it is narrative. Further, in the Synoptists, Philip is connected in the narrative, not with Bartholomew but with Andrew.<P>(2) The identity is definitely stated in the Genealogies of the Twelve Apostles (see <a href="./study/isbe/search.html?string=NATHANAEL">NATHANAEL</A>). Further, the "Preaching of Simon, son of Cleopas" (compare Budge, II, 70ff) has the heading "The preaching of the blessed Simon, the son of Cleopas, who was surnamed Judas, which is interpreted Nathanael, who became bishop of Jerusalem after James the brother of our Lord." Eusebius (Historia Ecclesiastica, III, xi, 32; IV, xxii) also refers to a Simon who succeeded James as bishop of Jerusalem and suffered martyrdom under Trajan; and Hegesippus, whom Eusebius professes to quote, calls this Simon a son of Cleopas.<P>(3) The invitation of Philip to Nathanael (compare <a onClick="return mV(\'Jhn\',1,45);">Joh 1:45</a>) was one which would naturally be addressed to a follower of the Zealots, who based their cause on the fulfillment of Messianic prophecy.<P>(4) As Alpheus, the father of James, is generally regarded as the same as Clopas or Cleopas (see <a href="./study/isbe/search.html?string=JAMES">JAMES</A>), this identification of the above Simon Nathanael, son of Cleopas, with Simon Zelotes would shed light on the reason of the juxtaposition of James son of Alpheus and Simon Zelotes in the apostolic lists of Luke and Acts, i.e. they were brothers.``88';
isbe[8190]='Simple`sim\'-p\'l: In the Old Testament the uniform tranlation of the Hebrew word pethi (root pathah, "be open"). Like the English word "simple" (etymologically "of one fold"), the Hebrew pethi is used sometimes in a good sense, i.e. "open-minded" (<a onClick="return mV(\'Psa\',19,7);">Ps 19:7</a>; <a onClick="return mV(\'Psa\',116,6);">116:6</a>; <a onClick="return mV(\'Psa\',119,130);">119:130</a>, possibly in all three cases the sense is neutral rather than positively good), and sometimes in a bad sense (<a onClick="return mV(\'Pro\',7,7);">Pr 7:7</a>, parallel to "destitute of understanding"; <a onClick="return mV(\'Pro\',8,5);">Pr 8:5</a>, parallel to "fools" (blockheads); <a onClick="return mV(\'Pro\',14,15);">Pr 14:15</a>, opposed to prudent). The fundamental idea of pethi seems to be open to influence, i.e. easily influenced. That one open to influence should as a rule be classed with the irreligious is one of many instances in which language is an unwilling witness to the miasmatic moral atmosphere in which we live. The line between moral weakness and moral turpitude, between negative goodness (if indeed such a thing be conceivable) and positive badness, is soon passed.<P>In the New Testament the word "simple" is found only in <a onClick="return mV(\'Rom\',16,18,19);">Ro 16:18,19</a> the King James Version. In the first of these passages it is used to translate akakos (the Revised Version (British and American) "innocent"). In <a onClick="return mV(\'Hbr\',7,26);">Heb 7:26</a> the King James Version the same word is rendered "harmless," the rendering of the Revised Version (British and American) in this instance being "guileless." This would suit <a onClick="return mV(\'Rom\',16,18);">Ro 16:18</a> better than "innocent." Guilelessness is not a synonym for gullibility; but the guileless are frequently the prey of designing men. In <a onClick="return mV(\'Rom\',16,19);">Ro 16:19</a> the word translated "simple" is akeraios, literally, "unmixed," "sincere" (Trench and Godet; Young, erroneously "hornless" and so "harmless"). "Uncontaminated" seems to be the idea of the apostle. He would have those to whom he wrote "wise as regards good" and not ignorant as regards evil—for that would be impossible, even if desirable—but without that kind of knowledge of evil that comes from engaging in it, as we say, mixing themselves up with it, unalloyed with evil.``116';
isbe[8191]='Simplicity`sim-plis\'-i-ti (pethayyuth; haplotes): The words in the Old Testament commonly translated "simplicity" are pethi, "simple" (<a onClick="return mV(\'Pro\',1,22);">Pr 1:22</a>), pethayyuth, "simplicity" (<a onClick="return mV(\'Pro\',9,13);">9:13</A> margin), tom, "completeness," "integrity" (<a onClick="return mV(\'2Sa\',15,11);">2Sa 15:11</a>), "They went in their simplicity." In the New Testament, haplotes, "singleness of mind," "simplicity," occurs in <a onClick="return mV(\'Rom\',12,8);">Ro 12:8</a>, "He that giveth let him do it with simplicity," the Revised Version (British and American) "liberality," margin "Greek: \'singleness\'";<a onClick="return mV(\'2Cr\',1,12);">2Co 1:12</a>, "in simplicit and godly sincerity," the Revised Version (British and American) (with corrected text) "in holiness and sincerity of God"; <a onClick="return mV(\'2Cr\',11,3);">2Co 11:3</a>, "the simplicity that is in Christ," the Revised Version (British and American) (with corrected text) "the simplicity and the purity that is toward Christ"; compare <a onClick="return mV(\'Eph\',6,5);">Eph 6:5</a>; <a onClick="return mV(\'Col\',3,22);">Col 3:22</a>, where the translation is "singleness" In The <span class="noTag">Wisdom of Solomon 1:1</span> we have, "Think ye of the Lord with a good mind (the King James Version "heart"), and in singleness (the King James Version "simplicity") of heart seek ye him" (haplotes). our Lord also speaks (<a onClick="return mV(\'Mat\',6,22);">Mt 6:22</a>; <a onClick="return mV(\'Luk\',11,34);">Lu 11:34</a>) of the "single eye" (haplous), and James (<a onClick="return mV(\'Jam\',1,5);">1:5</a>) applies haplos, "simply," "directly," without after-thought (the King James Version and the Revised Version (British and American) "liberally") to God, who had been described by Plato (Rep. ii.382 E) as being perfectly simple (haplous) and true, both in word and deed. In such "simplicity"—openness, sincerity, freedom from double-mindedness—man most resembles God and is most open to His visitation and blessing.``185';
isbe[8192]='Simri`sim\'-ri.`<a href="./study/isbe/search.html?string=SHIMRI">SHIMRI</a>`1';
isbe[8193]='Sin (1)`(chatta\'th, "a missing," \'awon, "perversity]" pesha\', "transgression," ra\', "evil," etc.; hamartano, "miss the mark," parabasis, "transgression" with a suggestion of violence, adikia, "injustice," "unrighteousness"):<P>1. Sin as Disobedience<P>2. Affects the Inner Life<P>3. Involves All Men<P>4. The Story of the Fall<P>5. The Freedom of Man<P>6. A Transgression against Light<P>7. Inwardness of the Moral Law<P class="in15">(1) Prophets<P class="in15">(2) Paul<P class="in15">(3) Jesus<P>8. Sin a Positive Force<P>9. Heredity<P>10. Environment<P>11. Redemption<P>12. Life in Christ<P>13. Repentance<P>14. Forgiveness<P>LITERATURE<hr /><P>1. Sin as Disobedience:<P>A fairly exact definition of sin based on Biblical data would be that sin is the transgression of the law of God (<a onClick="return mV(\'1Jo\',3,4);">1Joh 3:4</a>). Ordinarily, sin is defined simply as "the transgression of the law," but the idea of God is so completely the essential conception of the entire Biblical revelation that we can best define sin as disobedience to the law of God. It will be seen that primarily sin is an act, but from the very beginning it has been known that acts have effects, not only in the outward world of things and persons, but also upon him who commits the act.<P>2. Affects the Inner Life:<P>Hence, we find throughout the Scriptures a growing emphasis on the idea of the sinful act as not only a fact in itself, but also as a revelation of an evil disposition on the part of him who commits the act (<a onClick="return mV(\'Gen\',6,5);">Ge 6:5</a>).<P>3. Involves All Men:<P>Then also there is the further idea that deeds which so profoundly affect the inner life of an individual in some way have an effect in transmitting evil tendencies to the descendants of a sinful individual (<a onClick="return mV(\'Psa\',51,5,6);">Ps 51:5,6</a>; <a onClick="return mV(\'Eph\',2,3);">Eph 2:3</a>). See <a href="./study/isbe/search.html?string=HEREDITY">HEREDITY</A>; <a href="./study/isbe/search.html?string=TRADITION">TRADITION</A>. Hence, we reach shortly the conception, not only that sin is profoundly inner in its consequences, but that its effects reach outward also to an extent which practically involves the race. Around these various items of doctrine differing systems of theology have sprung up.<P>4. The Story of the Fall:<P>Students of all schools are agreed that we have in the Old Testament story of the fall of Adam an eternally true account of the way sin comes into the world (<a onClick="return mV(\'Gen\',3,\'1-6\');">Ge 3:1-6</a>). The question is not so much as to the literal historic matter-of-factness of the narrative, as to its essentially psychological truthfulness. The essential thought of the narrative is that both Adam and Eve disobeyed an express command of God. The seductiveness of temptation is nowhere more forcefully stated than in this narrative. The fruit of the tree is pleasant to look upon; it is good to eat; it is to be desired to make one wise; moreover, the tempter moves upon the woman by the method of the half truth (see <a href="./study/isbe/search.html?string=ADAM+IN+THE+OLD+TESTAMENT">ADAM IN THE OLD TESTAMENT</A>). God had said that disobedience to the command would bring death; the tempter urged that disobedience would not bring death, implying that the command of God had meant that death would immediately follow the eating of the forbidden fruit. In the story the various avenues of approach of sin to the human heart are graphically suggested, but after the seductiveness of evil has thus been set forth, the fact remains that both transgressors knew they were transgressing (<a onClick="return mV(\'Gen\',3,2);">Ge 3:2</a>f). Of course, the story is told in simple, naive fashion, but its perennial spiritual truth is at once apparent. There has been much progress in religious thinking concerning sin during the Christian ages, but the progress has not been away from this central conception of willful disobedience to the law of God.<P>5. The Freedom of Man:<P>In this early Biblical account there is implicit the thought of the freedom of man. The idea of transgression has sometimes been interpreted in such wise as to do away with this freedom. An unbiased reading of the Scriptures would, with the possible exception of some passages which designedly lay stress on the power of God (<a onClick="return mV(\'Rom\',8,29,30);">Ro 8:29,30</a>), produce on the mind the impression that freedom is essential to sin. Certainly there is nothing in the account of the Old Testament or New Testament narratives to warrant the conception that men are born into sin by forces over which they have no control. The argument of the tempter with the woman is an argument aimed at her will. By easy steps, indeed, she moves toward the transgression, but the transgression is a transgression and nothing else. Of course, the evil deed is at once followed by attempts on the part of the transgressors to explain themselves, but the futility of the explanations is part of the point of the narrative. In all discussion of the problem of freedom as relating to sin, we must remember that the Biblical revelation is from first to last busy with the thought of the righteousness and justice and love of God (<a onClick="return mV(\'Gen\',6,9);">Ge 6:9</a> tells us that because of justice or righteousness, Noah walked with God). Unless we accept the doctrine that God is Himself not free, a doctrine which is nowhere implied in the Scripture, we must insist that the condemnation of men as sinful, when they have not had freedom to be otherwise than sinful, is out of harmony with the Biblical revelation of the character of God. Of course this does not mean that a man is free in all things. Freedom is limited in various ways, but we must retain enough of freedom in our thought of the constitution of men to make possible our holding fast to the Biblical idea of sin as transgression. Some who take the Biblical narrative as literal historical fact maintain that all men sinned in Adam (see <a href="./study/isbe/search.html?string=IMPUTATION">IMPUTATION</A>, III, 1). Adam may have been free to sin or not to sin, but, "in his fall we sinned all." We shall mention the hereditary influences of sin in a later paragraph; here it is sufficient to say that even if the first man had not sinned, there is nothing in our thought of the nature of man to make it impossible to believe that the sinful course of human history could have been initiated by some descendant of the first man far down the line.<P>6. A Transgression against Light:<P>The progress of the Biblical teaching concerning sin also would seem to imply that the transgression of the law must be a transgression committed against the light (<a onClick="return mV(\'Act\',17,30);">Ac 17:30</a>; <a onClick="return mV(\'1Ti\',1,13);">1Ti 1:13</a>). To be sinful in any full sense of the word, a man must know that the course which he is adopting is an evil course. This does not necessarily mean a full realization of the evil of the course. It is a fact, both of Biblical revelation and of revelation of all times, that men who commit sin do not realize the full evil of their deeds until after the sin has been committed (<a onClick="return mV(\'2Sa\',12,\'1-13\');">2Sa 12:1-13</a>). This is partly because the consequences of sin do not declare themselves until after the deed has been committed; partly also because of the remorse of the conscience; and partly from the humiliation at being discovered; but in some sense there must be a realization of the evil of a course to make the adoption of the course sinful. E.g. in estimating the moral worth of Biblical characters, especially those of earlier times, we must keep in mind the standards of the times in which they lived. These standards were partly set by the customs of the social group, but the customs were, in many cases, made sacred by the claim of divine sanction. Hence, we find Biblical characters giving themselves readily to polygamy and warfare. The Scriptures themselves, however, throw light upon this problem. They refer to early times as times of ignorance, an ignorance which God Himself was willing to overlook (<a onClick="return mV(\'Act\',17,30);">Ac 17:30</a>). Even so ripe a moral consciousness as that of Paul felt that there was ground for forgiveness toward a course which he himself later considered evil, because in that earlier course he had acted ignorantly (<a onClick="return mV(\'Act\',26,9);">Ac 26:9</a>; <a onClick="return mV(\'1Ti\',1,13);">1Ti 1:13</a>).<P>7. Inwardness of the Moral Law:<P>The Biblical narratives, too, show us the passage over from sin conceived of as the violation of external commands to sin conceived of as an unwillingness to keep the commandments in the depths of the inner life. The course of Biblical history is one long protest against conceiving of sin in an external fashion.<P>(1) Prophets.<P>In the sources of light which are to help men discern good from evil, increasing stress is laid upon inner moral insight (compare <a onClick="return mV(\'Isa\',58,5);">Isa 58:5</a>f; <a onClick="return mV(\'Hsa\',6,\'1-7\');">Ho 6:1-7</a>). The power of the prophets was in their direct moral insight and the fervor with which they made these insights real to the mass of the people. Of course it was necessary that the spirit of the prophets be given body and form in carefully articulated law. The progress of the Hebrews from the insight of the seer to the statute of the lawmaker was not different from such progress in any other nations. It is easy to see, however, how the hardening of moral precepts into formal codes, absolutely necessary as that task was, led to an externalizing of the thought of sin. The man who did not keep the formal law was a sinner. On such basis there grew up the artificial systems which came to their culmination in the New Testament times in Pharisaism. On the other hand, a fresh insight by a new prophet might be in violation of the Law, considered in its literal aspects. It might be necessary for a prophet to attack outright some additions to the Law. We regard as a high-water mark of Old Testament moral utterances the word of Micah that the Lord requires men to do justly and to love mercy and to walk humbly with Him (<a onClick="return mV(\'Mic\',6,8);">6:8</A>). At the time this word was uttered, the people were giving themselves up to multitudes of sacrifices. Many of these sacrifices called for the heaviest sufferings on the part of the worshippers. It would seem that an obligation to sacrifice the firstborn was beginning to be taught in order that the Hebrews might not be behind the neighboring heathen nations in observances of religious codes. The simple direct word of Micah must have seemed heresy to many of its first hearers. The outcome, however, of this conflict between the inner and the outer in the thought of transgression was finally to deepen the springs of the inner life. The extremes of externalism led to a break with moral realities which tended to become apparent to the most ordinary observer. The invective of Jesus against New Testament Pharisaism took its force largely from the fact that Jesus gave clear utterance to what everyone knew. Those who thought of religion as external gave themselves to formal keeping of the commandments and allowed the inner life to run riot as it would (<a onClick="return mV(\'Mat\',23,23);">Mt 23:23</a>, et al.).<P>(2) Paul.<P>With the more serious-minded the keeping of the Law became more and more a matter of the inner spirit. There were some who, like Paul, found it impossible to keep the Law and find peace of conscience (<a onClick="return mV(\'Rom\',7,\'1-\');">Ro 7</a>). It was this very impossibility which forced some, like Paul, to understand that after all, sin or righteousness must be judged by the inner disposition. It was this which led to the search for a conception of a God who looks chiefly at the heart and judges men by the inner motive.<P>(3) Jesus.<P>In the teaching of Jesus the emphasis upon the inner spirit as the essential factor in the moral life came to its climax. Jesus honored the Law, but He pushed the keeping of the Law back from the mere performance of externals to the inner stirrings of motives. It is not merely the actual commission of adultery, for example, that is sin: it is the lustful desire which leads to the evil glance; it is not merely the actual killing of the man that is murder; it is the spirit of hatred which makes the thought of murder welcome (<a onClick="return mV(\'Mat\',5,21,27);">Mt 5:21,27</a>). Paul caught the spirit of Jesus and carried the thought of Jesus out into more elaborate and formal statements. There is a law of the inner life with which man should bind himself, and this law is the law of Christ\'s life itself (<a onClick="return mV(\'Rom\',8,\'1-4\');">Ro 8:1-4</a>). While both Jesus and Paul recognized the place of the formal codes in the moral life of individuals and societies, they wrought a great service for righteousness in setting on high the obligations upon the inner spirit. The follower of Christ is to guard the inmost thoughts of his heart. The commandments are not always precepts which can be given articulated statement; they are rather instincts and intuitions and glimpses which must be followed, even when we cannot give them full statement.<P>8. Sin a Positive Force:<P>From this standpoint we are able to discern something of the force of the Biblical teaching as to whether sin is to be looked upon as negative or positive. Very often sin is defined as the mere absence of goodness. The man who sins is one who does not keep the Law. This, however, is hardly the full Biblical conception. Of course, the man who does not keep the Law is regarded as a sinner, but the idea transgression is very often that of a positive refusal to keep the commandment and a breaking of the commandment. Two courses are set before men, one good, the other evil. The evil course is, in a sense, something positive in itself. The evil man does not stand still; he moves as truly as the good man moves; he becomes a positive force for evil. In all our discussions we must keep clearly in mind the truth that evil is not something existing in and by itself. The Scriptures deal with evil men, and the evil men are as positive as their natures permit them to be. In this sense of the word sin does run a course of positive destruction. In the thought, e.g., of the writer who describes the conditions which, in his belief, made necessary the Flood, we have a positive state of evil contaminating almost the whole world (<a onClick="return mV(\'Gen\',6,11);">Ge 6:11</a>). It would be absurd to characterize the world in the midst of which Noah lived as merely a negative world. The world was positively set toward evil. And so, in later writings, Paul\'s thought of Roman society is of a world of sinful men moving with increasing velocity toward the destruction of themselves and of all around them through doing evil. It is impossible to believe that <a onClick="return mV(\'Rom\',1,\'1-\');">Romans 1</a> conceives of sin merely in negative terms. We repeat, we do not do full justice to the Biblical conception when we speak of sin merely in negative terms. If we may be permitted to use a present-day illustration, we may say that in the Biblical thought sinful men are like the destructive forces in the world of Nature which must be removed before there can be peace and health for human life. For example, science today has much to say concerning germs of diseases which prove destructive to human life. A large part of modern scientific effort has been to rid the world of these germs, or at least to cleanse human surroundings from their contaminating touch. The man who sterilizes the human environment so that these forces cannot touch men does in one sense a merely negative work; in another sense, however, his work makes possible the positive development of the forces which make for health.<P>9. Heredity:<P>It is from this thought of the positiveness of sin that we are to approach the problem of the hereditary transmission of evil. The Biblical teaching has often been misinterpreted at this point. Apart from certain passages, especially those of Paul, which set forth the practically universal contamination of sin (e.g. <a onClick="return mV(\'Rom\',5,18);">Ro 5:18</a>, etc.), there is nothing in the Scriptures to suggest the idea that men are born into the world under a weight of guilt. We hold fast to the idea of God as a God of justice and love. There is no way of reconciling these attributes with the condemnation of human souls before these souls have themselves transgressed. Of course much theological teaching moves on the assumption that the tendencies to evil are so great that the souls will necessarily trangress, but we must keep clearly in mind the difference between a tendency to evil and the actual commission of evil. Modern scientific research reinforces the conception that the children of sinful parents, whose sins have been such as to impress their lives throughout, will very soon manifest symptoms of evil tendency. Even in this case, however, we must distinguish between the psychological and moral. The child may be given a wrong tendency from birth, not only by hereditary transmission, but by the imitation of sinful parents; yet the question of the child\'s own personal responsibility is altogether another matter. Modern society has come to recognize something of the force of this distinction. In dealing with extreme cases of this kind, the question of the personal guilt of the child is not raised. The attempt is to throw round about the child an environment that will correct the abnormal tendency. But there can be little gainsaying the fact that the presence of sin in the life of the parent may go as far as to mark the life of the child with the sinful tendency.<P>10. Environment:<P>The positive force of sinful life also appears in the effect of sin upon the environment of men. It is not necessary for us to believe that all the physical universe was cursed by the Almighty because of man\'s sin, in order to hold that there is a curse upon the world because of the presence of sinful men. Men have sinfully despoiled the world for their own selfish purposes. They have wasted its resources. They have turned forces which ought to have made for good into the channels of evil. In their contacts with one another also, evil men furnish an evil environment. If the employer of 100 men be himself evil, he is to a great extent the evil environment of those 100 men. The curse of his evil is upon them. So with the relations of men in larger social groups: the forces of state-life which are intended to work for good can be made to work for evil. So far has this gone that some earnest minds have thought of the material and social realms as necessarily and inherently evil. In other days this led to retreats from the world in monasteries and in solitary cells. In our present time the same thought is back of much of the pessimist idea that the world itself is like a sinking ship, absolutely doomed. The most we can hope for is to save individuals here and there from imminent destruction. Yet a more Biblical conception keeps clear of all this. The material forces of the world—apart from certain massive physical necessities (e.g. earthquakes, storms, floods, whirlwinds, fires, etc.), whose presence does more to furnish the conditions of moral growth than to discourage that growth—are what men cause them to be. Social forces are nothing apart from the men who are themselves the forces. No one can deny that evil men can use physical forces for evil purposes, and that evil men can make bad social forces, but both these forces can be used for good as well as for evil. "The whole creation groaneth and travaileth in pain" waiting for the redemption at the hands of the sons of God (<a onClick="return mV(\'Rom\',8,\'19-23\');">Ro 8:19-23</a>).<P>11. Redemption:<P>In the thought of Jesus, righteousness is life. Jesus came that men might have life (<a onClick="return mV(\'Jhn\',10,10);">Joh 10:10</a>). It must follow therefore that in His thought sin is death, or rather it is the positive course of transgression which makes toward death (<a onClick="return mV(\'Jhn\',5,24);">Joh 5:24</a>). But man is to cease to do evil and to learn to do well. He is to face about and walk in a different direction; he is to be born from above (<a onClick="return mV(\'Jhn\',3,3);">Joh 3:3</a>), and surrender himself to the forces which beat upon him from above rather than to those which surge upon him from below (<a onClick="return mV(\'Rom\',12,2);">Ro 12:2</a>). From the realization of the positiveness both of sin and of righteousness, we see the need of a positive force which is to bring men from sin to righteousness (<a onClick="return mV(\'Jhn\',3,\'3-8\');">Joh 3:3-8</a>).<P>Of course, in what we have said of the positive nature of sin we would not deny that there are multitudes of men whose evil consists in their passive acquiescence in a low moral state. Multitudes of men may not be lost, in the sense that they are breaking the more obvious of the commandments. They are lost, in the sense that they are drifting about, or that they are existing in a condition of inertness with no great interest in high spiritual ideals. But the problem even here is to find a force strong enough and positive enough to bring such persons to themselves and to God. In any case the Scriptures lay stress upon the seriousness of the problem constituted by sin. The Bible is centered on redemption. Redemption from sin is thought of as carrying with it redemption from all other calamities. If the kingdom of God and of His righteousness can be seized, all other things will follow with the seizure (<a onClick="return mV(\'Mat\',6,33);">Mt 6:33</a>). The work of Christ is set before us as chiefly a work of redemption from sin. A keen student once observed that almost all failures to take an adequate view of the person of Christ can be traced to a failure to realize adequately the seriousness of sin. The problem of changing the course of something so positive as a life set toward sin is a problem which may well tax the resources of the Almighty. Lives cannot be transformed merely by precept. The only effective force is the force of a divine life which will reach and save human lives.<P>See <a href="./study/isbe/search.html?string=REDEMPTION">REDEMPTION</A>.<P>12. Life in Christ:<P>We are thus in a position to see something of the positiveness of the life that must be in Christ if He is to be a Saviour from sin. That positiveness must be powerful enough to make men feel that in some real sense God Himself has come to their rescue (<a onClick="return mV(\'Rom\',8,\'32-39\');">Ro 8:32-39</a>). For the problem of salvation from sin is manifold. Sin long persisted in begets evil habits, and the habits must be broken. Sin lays the conscience under a load of distress, for which the only relief is a sense of forgiveness. Sin blights and paralyzes the faculties to such a degree that only the mightiest of tonic forces can bring back health and strength. And the problem is often more serious than this. The presence of evil in the world is so serious in the sight of a Holy God that He Himself, because of His very holiness, must be under stupendous obligation to aid us to the utmost for the redemption of men. Out of the thought of the disturbance which sin makes even in the heart of God, we see something of the reason for the doctrine that in the cross of Christ God was discharging a debt to Himself and to the whole world; for the insistence also that in the cross there is opened up a fountain of life, which, if accepted by sinful men, will heal and restore them.<P>13. Repentance:<P>It is with this seriousness of sin before us that we must think of forgiveness from sin. We can understand very readily that sin can be forgiven only on condition that men seek forgiveness in the name of the highest manifestation of holiness which they have known. For those who have heard the preaching of the cross and have seen something of the real meaning of that preaching, the way to forgiveness is in the name of the cross. In the name of a holiness which men would make their own, if they could; in the name of an ideal of holy love which men of themselves cannot reach, but which they forever strive after, they seek forgiveness. But the forgiveness is to be taken seriously. In both the Old Testament and New Testament repentance is not merely a changed attitude of mind. It is an attitude which shows its sincerity by willingness to do everything possible to undo the evil which the sinner has wrought (<a onClick="return mV(\'Luk\',19,8);">Lu 19:8</a>). If there is any consequence of the sinner\'s own sin which the sinner can himself make right, the sinner must in himself genuinely repent and make that consequence right. In one sense repentance is not altogether something done once for all. The seductiveness of sin is so great that there is need of humble and continuous watching. While anything like a morbid introspection is unscriptural, constant alertness to keep to the straight and narrow path is everywhere enjoined as an obligation (<a onClick="return mV(\'Gal\',6,1);">Ga 6:1</a>).<P>14. Forgiveness:<P>There is nothing in the Scriptures which will warrant the idea that forgiveness is to be conceived of in such fashion as would teach that the consequences of sin can be easily and quickly eliminated. Change in the attitude of a sinner necessarily means change in the attitude of God. The sinner and God, however, are persons, and the Scriptures always speak of the problem of sin after a completely personal fashion. The changed attitude affects the personal standing of the sinner in the sight of God. But God is the perso
