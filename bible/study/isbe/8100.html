n who creates and carries on a moral universe. In carrying on that universe He must keep moral considerations in their proper place as the constitutional principles of the universe. While the father welcomes back the prodigal to the restored personal relations with himself, he cannot, in the full sense, blot out the fact that the prodigal has been a prodigal. The personal forgiveness may be complete, but the elimination of the consequences of the evil life is possible only through the long lines of healing set at work. The man who has sinned against his body can find restoration from the consequences of the sin only in the forces which make for bodily healing. So also with the mind and will. The mind which has thought evil must be cured of its tendency to think evil. To be sure the curative processes may come almost instantly through the upheaval of a great experience, but on the other hand, the curative processes may have to work through long years (see <a href="./study/isbe/search.html?string=SANCTIFICATION">SANCTIFICATION</A>). The will which has been given to sin may feel the stirrings of sin after the life of forgiveness has begun. All this is a manifestation, not only of the power of sin, but of the constitutional morality of the universe. Forgiveness must not be interpreted in such terms as to make the transgression of the Law of God in any sense a light or trivial offense. But, on the other hand, we must not set limits to the curative powers of the cross of God. With the removal of the power which makes for evil the possibility of development in real human experience is before the life (see <a href="./study/isbe/search.html?string=FORGIVENESS">FORGIVENESS</A>). The word of the Master is that He "came that they may have life, and may have it abundantly" (<a onClick="return mV(\'Jhn\',10,10);">Joh 10:10</a>). Sin is serious, because it thwarts life. Sin is given so large a place in the thought of the Biblical writers simply because it blocks the channel of that movement toward the fullest life which the Scriptures teach is the aim of God in placing men in the world. God is conceived of as the Father in Heaven. Sin has a deeply disturbing effect in restraining the relations between the Father and the sons and of preventing the proper development of the life of the sons.<P>Tennant, Origin and Propagation of Sin; Hyde, Sin and Its Forgiveness; chapter on "Incarnation and Atonement" in Bowne\'s Studies in Christianity; Stevens, Christian Doctrine of Salvation; Clarke, Christian Doctrine of God; various treatises on Systematic Theology.`<a href="./study/isbe/search.html?string=ETHICS">ETHICS</a>; <a href="./study/isbe/search.html?string=ETHICS+OF+JESUS">ETHICS OF JESUS</a>; <a href="./study/isbe/search.html?string=GUILT">GUILT</a>; <a href="./study/isbe/search.html?string=JOHANNINE+THEOLOGY">JOHANNINE THEOLOGY</a>; <a href="./study/isbe/search.html?string=PAUL,+THE+APOSTLE">PAUL, THE APOSTLE</a>; <a href="./study/isbe/search.html?string=PAULINE+THEOLOGY">PAULINE THEOLOGY</a>; <a href="./study/isbe/search.html?string=REDEMPTION">REDEMPTION</a>`112';
isbe[8194]='Sin (2)`sin (cin, "clay or mud"; Suene, Codex Alexandrinus Tanis): A city of Egypt mentioned only in <a onClick="return mV(\'Eze\',30,15,16);">Eze 30:15,16</a>. This seems to be a pure Semitic name. The ancient Egyptian name, if the place ever had one such, is unknown. Pelusium (Greek Pelousion) also meant "the clayey or muddy town." The Pelusiac mouth of the Nile was "the muddy mouth," and the modern Arabic name of this mouth has the same significance. These facts make it practically certain that the Vulgate (Jerome\'s Latin Bible, 390-405 A.Dis correct in identifying Sin with Pelusium. But although Pelusium appears very frequently in ancient history, its exact location is still not entirely certain. The list of cities mentioned in Ezekiel in connection with Sin furnishes no clue to its location. From other historical notices it seems to have been a frontier city. Rameses II built a wall from Sin to Heliopolis, probably by the aid of Hebrew slaves (Diodorus Siculus; compare Budge, History of Egypt, V, 90), to protect the eastern frontier. Sin was a meeting-place of Egypt with her enemies who came to attack her, many great battles being fought at or near this place. Sennacherib and Cambyses both fought Egypt near Pelusium (Herodotus ii.141; iii.10-13). Antiochus IV defeated the Egyptians here (Budge, VIII, 25), and the Romans under Gabinius defeated the Egyptians in the same neighborhood. Pelusium was also accessible from the sea, or was very near a seaport, for Pompey after the disaster at Pharsalia fled into Egypt, sailing for Pelusium. These historical notices of Pelusium make its usual identification with the ruins near el-Kantara, a station on the Suez Canal 29 miles south of Port Said, most probable. "Sin, the stronghold of Egypt," in the words of Ezekiel (<a onClick="return mV(\'Eze\',30,15);">30:15</a>), would thus refer to its inaccessibility because of swamps which served as impassable moats. The wall on the south and the sea on the north also protected it on either flank.``93';
