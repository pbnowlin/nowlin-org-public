isbe[8150]='Sick; Sickness`sik, sik\'-nes (chalah (<a onClick="return mV(\'Gen\',48,1);">Ge 48:1</a>, etc.), choli (<a onClick="return mV(\'Deu\',28,61);">De 28:61</a>, etc.), tachalu\' (<a onClick="return mV(\'Deu\',29,21);">De 29:21</a>, etc.), machalah (<a onClick="return mV(\'Exd\',23,25);">Ex 23:25</a>, etc.), daweh (<a onClick="return mV(\'Lev\',15,33);">Le 15:33</a>, etc.), \'anash (<a onClick="return mV(\'2Sa\',12,15);">2Sa 12:15</a>, etc.); astheneo (<a onClick="return mV(\'Mat\',10,8);">Mt 10:8</a>, etc.; compare 2Ma 9:22), kakos echon (<a onClick="return mV(\'Luk\',7,2);">Lu 7:2</a>), kakos echontas (<a onClick="return mV(\'Mat\',4,24);">Mt 4:24</a>, etc.), arrhostos (Sirach 7:35; <a onClick="return mV(\'Mat\',14,14);">Mt 14:14</a>, etc.), arrhostema (Sirach 10:10, etc.), with various cognates, kamno (<a onClick="return mV(\'Jam\',5,15);">Jas 5:15</a>); Latin morbus (2Esdras 8:31)): Compared with the number of deaths recorded in the historical books of the Bible the instances in which diseases are mentioned are few. "Sick" and "sickness" (including "disease," etc.) are the translations of 6 Hebrew and 9 Greek words and occur 56 times in the Old Testament and 57 times in the New Testament. The number of references in the latter is significant as showing how much the healing of the sick was characteristic of the Lord\'s ministry. The diseases specified are varied. Of infantile sickness there is an instance in Bath-sheba\'s child (<a onClick="return mV(\'2Sa\',12,15);">2Sa 12:15</a>), whose disease is termed \'anash, not improbably trismus nascentium, a common disease in Palestine. Among adolescents there are recorded the unspecified sickness of Abijah (<a onClick="return mV(\'1Ki\',14,1);">1Ki 14:1</a>), of the widow\'s son at Zarephath (<a onClick="return mV(\'1Ki\',17,17);">1Ki 17:17</a>), the sunstroke of the Shunammite\'s son (<a onClick="return mV(\'2Ki\',4,19);">2Ki 4:19</a>), the epileptic boy (<a onClick="return mV(\'Mat\',17,15);">Mt 17:15</a>), Jairus\' daughter (<a onClick="return mV(\'Mat\',9,18);">Mt 9:18</a>), and the nobleman\'s son (<a onClick="return mV(\'Jhn\',4,46);">Joh 4:46</a>). At the other extreme of life Jacob\'s death was preceded by sickness (<a onClick="return mV(\'Gen\',48,1);">Ge 48:1</a>). Sickness resulted from accident (Ahaziah, <a onClick="return mV(\'2Ki\',1,2);">2Ki 1:2</a>), wounds (Joram, <a onClick="return mV(\'2Ki\',8,29);">2Ki 8:29</a>), from the violence of passion (Amnon, <a onClick="return mV(\'2Sa\',13,2);">2Sa 13:2</a>), or mental emotion (<a onClick="return mV(\'Dan\',8,27);">Da 8:27</a>); see also in this connection <a onClick="return mV(\'Sgs\',2,5);">So 2:5</a>; <a onClick="return mV(\'Sgs\',5,8);">5:8</a>. Sickness the result of drunkenness is mentioned (<a onClick="return mV(\'Hsa\',7,5);">Ho 7:5</a>), and as a consequence of famine (<a onClick="return mV(\'Jer\',14,18);">Jer 14:18</a>) or violence (<a onClick="return mV(\'Mic\',6,13);">Mic 6:13</a>). Daweh or periodic sickness is referred to (<a onClick="return mV(\'Lev\',15,33);">Le 15:33</a>; <a onClick="return mV(\'Lev\',20,18);">20:18</a>), and an extreme case is that of <a onClick="return mV(\'Luk\',8,43);">Lu 8:43</a>.<P>In some examples the nature of the disease is specified, as Asa\'s disease in his feet (<a onClick="return mV(\'1Ki\',15,23);">1Ki 15:23</a>), for which he sought the aid of physicians in vain (<a onClick="return mV(\'2Ch\',16,12);">2Ch 16:12</a>). Hezekiah and Job suffered from sore boils, Jehoram from some severe dysenteric attack (<a onClick="return mV(\'2Ch\',21,19);">2Ch 21:19</a>), as did Antiochus Epiphanes (2Macc 9:5). Probably the sudden and fatal disease of Herod was similar, as in both cases there is reference to the presence of worms (compare <a onClick="return mV(\'Act\',12,23);">Ac 12:23</a> and 2Macc 9:9). The disease of Publius\' father was also dysentery (<a onClick="return mV(\'Act\',28,8);">Ac 28:8</a>). Other diseases specified are paralysis (<a onClick="return mV(\'Mat\',8,6);">Mt 8:6</a>; <a onClick="return mV(\'Mat\',9,2);">9:2</a>), and fever (<a onClick="return mV(\'Mat\',8,14);">Mt 8:14</a>). Not improbably the sudden illness of the young Egyptian at Ziklag (<a onClick="return mV(\'1Sa\',30,11);">1Sa 30:11</a>), and the illness of Ben-hadad which weakened him so that he could not resist the violence of Hazael, were also the common Palestine fever (<a onClick="return mV(\'2Ki\',8,15);">2Ki 8:15</a>) of whose symptoms and effects there is a graphic description in <a onClick="return mV(\'Psa\',38,\'1-\');">Ps 38</a>. Unspecified fatal illnesses were those of Elisha (<a onClick="return mV(\'2Ki\',13,14);">2Ki 13:14</a>), Lazarus (<a onClick="return mV(\'Jhn\',11,1);">Joh 11:1</a>), Tabitha (<a onClick="return mV(\'Act\',9,37);">Ac 9:37</a>). In the language of the Bible, leprosy is spoken of as a defilement to be cleansed, rather than as a disease to be cured.<P>The proverb concerning the sick quoted by the Lord at Capernaum (<a onClick="return mV(\'Mar\',2,17);">Mr 2:17</a>) has come down to us in several forms in apocryphal and rabbinical writings (Babha\' Qamma\' 26:13; Sanhedhrin 176), but is nowhere so terse as in the form in which He expresses it. The Lord performed His healing of the sick by His word or touch, and one of the most emphatic charges which He gave to His disciples when sending them out was to heal the sick. One of the methods used by them, the anointing with oil, is mentioned in <a onClick="return mV(\'Mar\',6,13);">Mr 6:13</a> and enjoined by James (<a onClick="return mV(\'Jam\',5,15);">5:15</a>). In later times the anointing which was at first used as a remedial agent became a ceremonial in preparation for death, one of the seven sacraments of the Roman church (Aquinas, Summa Theologia suppl. ad Piii. 29).<P>The duty of visiting the sick is referred to in <a onClick="return mV(\'Eze\',34,4,16);">Eze 34:4,16</a>, and by the Lord in the description of the Judgment scene (<a onClick="return mV(\'Mat\',25,36,43);">Mt 25:36,43</a>). It is inculcated in several of the rabbinical tracts. "He that visits the sick lengthens his life, he who refrains shortens it," says Rabbi Ischanan in Nedharim 29. In Shulchan \'Arukh, Yoreh De\'ah there is a chapter devoted to this duty, which is regarded as incumbent on the Jew, even though the sick person be a Gentile (Gittin 61a). The church\'s duty to the sick, so long neglected, has, within the last century, been recognized in the mission field, and has proved, in heathen lands, to be the most important of all pioneer agressive methods.<P>While we find that the apostles freely exercised their gifts of healing, it is noteworthy that we read of the sickness of two of Paul\'s companions, Epaphroditus (<a onClick="return mV(\'Phl\',2,26);">Php 2:26</a>) and Trophimus (<a onClick="return mV(\'2Ti\',4,20);">2Ti 4:20</a>), for whose recovery he seems to have used no other means than prayer.`<a href="./study/isbe/search.html?string=DISEASE">DISEASE</a>`107';
isbe[8151]='Sickle`sik\'-\'l (chermesh (<a onClick="return mV(\'Deu\',16,9);">De 16:9</a>; <a onClick="return mV(\'Deu\',23,25);">23:25</a>), maggal; compare Arabic minjal (<a onClick="return mV(\'Jer\',50,16);">Jer 50:16</a>; <a onClick="return mV(\'Joe\',3,13);">Joe 3:13</a>); drepanon (<a onClick="return mV(\'Mar\',4,29);">Mr 4:29</a>; <a onClick="return mV(\'Rev\',14,\'14-19\');">Re 14:14-19</a>)): Although the ancients pulled much of their grain by hand, we know that they also used sickles. The form of this instrument varied, as is evidenced by the Egyptian sculptures. The earliest sickle was probably of wood, shaped like the modern scythe, although much smaller, with the cutting edge made of sharp flints set into the wood. Sickle flints were found at Tel el-Chesy. Crescent-shaped iron sickles were found in the same mound. In Palestine and Syria the sickle varies in size. It is usually made wholly of iron or steel and shaped much like the instrument used in western lands. The smaller-sized sickles are used both for pruning and for reaping.``133';
isbe[8152]='Sicyon`sish\'-i-on (Sikuon, Sukuon, Sukion): Mentioned in 1Macc 15:23 in the list of countries and cities to which Lucius the Roman consul (probably Lucius Calpurnius Piso, 139 BC) wrote, asking them to be friendly to the Jews. The Jewish dispersion had already taken place, and Jews were living in most of the seaports and cities of Asia Minor, Greece and Egypt (compare Sib Or 3:271, circa 140 BC, and Philo).<P>Sicyon was situated 18 miles west of Corinth on the south side of the Gulf of Corinth. Its antiquity and ancient importance are seen by its coins still extant, dating from the 5th century. Though not as important as Corinth in its sea trade, the burning of that city in 143 BC, and the favor shown to Sicyon by the Roman authorities in adding to its territory and assigning to it the direction of the Isthmian games, increased its wealth and influence for a time.``78';
isbe[8153]='Siddim, Vale of`sid\'-im, (\'emeq ha-siddim; Septuagint he pharangx (or koilas) he haluke): The place mentioned in <a onClick="return mV(\'Gen\',14,\'3-8\');">Ge 14:3-8</a> as being the scene of encounter between Chedorlaomer and his allies with the kings of Sodom, Gomorrah, Admah, Zeboiim and Zoar. In <a onClick="return mV(\'Gen\',14,3);">14:3</a> it is identified with the Salt Sea, and in <a onClick="return mV(\'Gen\',14,10);">14:10</A> it is said to have been full of slime pits ("bitumen").<P>According to the traditional view, the Vale of Siddim was at the southern end of the Dead Sea. But in recent years a number of eminent authorities have maintained that it was at the northern end of the Dead Sea, in the vicinity of Jericho. Their argument has mainly been drawn from incidental references in the scene (<a onClick="return mV(\'Gen\',13,\'1-13\');">Ge 13:1-13</a>) describing the parting of Lot and Abram, and again in the account of Moses\' vision from Pisgah (<a onClick="return mV(\'Deu\',34,3);">De 34:3</a>).<P>In the account of Abram and Lot, it is said that from Bethel they saw "all the Plain of the Jordan, that it was well watered everywhere, before Yahweh destroyed Sodom and Gomorrah." The word here translated "plain" means "circle," and well describes the view which one has of the plain about Jericho from Bethel as he looks down the valley past Ai. But it seems to go beyond the text to assume that the Vale of Siddim was within that circle of vision, for it is said in <a onClick="return mV(\'Gen\',13,12);">Ge 13:12</a> simply that Lot dwelt "in the cities of the Plain, and moved his tent as far as Sodom." In the vision of Moses, likewise, we have a very general and condensed description, in which it is said that he was shown "the Plain of the valley of Jericho, the city of palm-trees, unto Zoar," which, as we learn from <a onClick="return mV(\'Gen\',19,22);">Ge 19:22</a>, was not far from the Vale of Siddim. It is true that from the traditional site of Pisgah the south end of the Dead Sea could not be seen. But we are by no means sure that the traditional site of Pisgah is the true one, or that the import of this language should be restricted to the points which are actually within range of vision.<P>The tendency at the present time is to return to the traditional view that the Vale of Siddim was at the south end of the Dead Sea. This is supported by the fact that Jebel Usdum, the salt mountain at the southwest corner of the Dead Sea, still bears the name of Sodom, Usdum being simply another form of the word. A still stronger argument, however, is drawn from the general topographical and geological conditions. In the first place, Zoar, to which Lot is said to have fled, was not far away. The most natural site for it is near the mouth of the Wady Kerak, which comes down from Moab into the southern end of the Dead Sea (see <a href="./study/isbe/search.html?string=ZOAR">ZOAR</a>); and this city was ever afterward spoken of as a Moabite city, which would not have been the case if it had been at the north end of the sea. It is notable in <a onClick="return mV(\'Jos\',13,\'15-21\');">Jos 13:15-21</a>, where the cities given to Reuben are enumerated, that, though the slopes of Pisgah are mentioned, Zoar is not mentioned.<P>In <a onClick="return mV(\'Gen\',14,\'1-\');">Ge 14</a>, where the battle between Amraphel and his allies with Sodom and the other cities of the plain is described, the south end of the Dead Sea comes in logical order in the progress of their campaign, and special mention is made of the slime or bitumen pits which occurred in the valley, and evidently played an important part in the outcome of the battle.<P>At the south end of the Dead Sea there is an extensive circle or plain which is better supplied with water for irrigation than is the region about Jericho, and which, on the supposition of slight geological changes, may have been extremely fertile in ancient times; while there are many indications of such fertility in the ruins that have been described by travelers about the mouth of the Kerak and other localities nearby. The description, therefore, of the fertility of the region in the Vale of Siddim may well have applied to this region at the time of Lot\'s entrance into it.<P>There are very persistent traditions that great topographical changes took place around the south end of the Dead Sea in connection with the destruction of Sodom and Gomorrah, while the opinion has been universally prevalent among the earlier historical writers that the site of Sodom and Gomorrah is beneath the waters of the Dead Sea.<P>Geological investigations, so far from disproving these traditions, render them altogether possible and credible. There is a remarkable contrast between the depths of the north end of the Dead Sea and of the south end. Near the north end the depth descends to 1,300 ft., whereas for many miles out from the south end it is very shallow, so that at low water a ford exists, and is occasionally used, from the north end of the salt mountain across to el-Lisan.<P>The precipitous salt cliffs of Jebel Usdum which border the southwest corner of the Dead Sea would indicate that, in comparatively recent times, there had been abrupt subsidence of a good many feet in the bottom of the Dead Sea at that end.<P>Such subsidences of limited areas and in connection with earthquakes are by no means uncommon. In 1819 an area of 2,000 square miles about the delta of the Indus sank beneath the level of the sea, so that the tops of the houses were barely seen above the water. A smaller area in the delta of the Selenga River sank during the last century beneath the waters of Lake Baikal. Professor R.S. Tarr of Cornell University has recently described the effect of an earthquake on the shores of Alaska, in which there was a change of level of 47 ft.<P>More probably (see <a href="./study/isbe/search.html?string=ARABAH">ARABAH</a>; <a href="./study/isbe/search.html?string=DEAD+SEA">DEAD SEA</a>) there has been a rise in the waters of the Dead Sea since Abraham\'s time, caused by the encroachment upon the original area of evaporation by the deltas which have been pushed into the main part of the depression by the Jordan, and various smaller streams descending from the highlands on either side. In consequence of these encroachments, the equilibrium between precipitation and evaporation could be maintained only by a rise in the water causing it to spread over the shallow shelf at the south end, thus covering a large part of the Vale of Siddim with the shoal water now found between el-Lisan and Jebel Usdum.``198';
isbe[8154]='Side`si\'-de (Side): An ancient town of Pamphylia, occupying a triangular promontory on the coast. It was one of the towns to which a letter favorable to the Jews was sent by the Roman consul Lucius (1Macc 15:23). The town seems to have been of considerable antiquity, for it had existed long before it fell into the possession of Alexander the Great, and for a time it was the metropolis of Pamphylia. Off the coast the fleet of Antiochus was defeated by the Rhodians. During the 1st century, Side was noted as one of the chief ports of pirates who disposed of much of their booty there. The ruins of the city, which are now very extensive, bear the name Eski Adalia, but among them there are no occupied houses. The two harbors protected by a sea wall may still be traced, but they are now filled with sand. The wall on the land side of the city was provided with a gate which was protected with round towers; the walls themselves are of Greek-Roman type. Within the walls the more important of the remains are three theaters near the harbors, and streets with covered porticoes leading from the city gate to the harbors. Without the walls, the street leading to the city gate is lined with sarcophagi, and among the shrubbery of the neighboring fields are traces of many buildings and of an aqueduct.``7';
isbe[8155]='Sides`sidz (yarekhah, "thigh," "flank"): the Revised Version (British and American) substitutes "innermost parts" for the King James Version "sides" in <a onClick="return mV(\'Jon\',1,5);">Jon 1:5</a>; compare <a onClick="return mV(\'1Sa\',24,3);">1Sa 24:3</a>.``1';
isbe[8156]='Sidon (1)`si\'-don (tsidhon): The oldest son of Canaan (<a onClick="return mV(\'Gen\',10,15);">Ge 10:15</a>).``1';
isbe[8157]='Sidon (2)`si\'-don (tsidhon; Sidon; the King James Version, Sidon and Zidon; the Revised Version (British and American) <a href="./study/isbe/search.html?string=SIDON">SIDON</a> only):<P>1. Location and Distinction:<P>One of the oldest Phoenician cities, situated on a narrow plain between the range of Lebanon and the sea, in latitude 33 degrees 34 minutes nearly. The plain is well watered and fertile, about 10 miles long, extending from a little north of Sarepta to the Bostrenus (Nahr el-\'Auly). The ancient city was situated near the northern end of the plain, surrounded with a strong wall. It possessed two harbors, the northern one about 500 yds. long by 200 wide, well protected by little islets and a breakwater, and a southern about 600 by 400 yards, surrounded on three sides by land, but open to the west, and thus exposed in bad weather. The date of the founding of the city is unknown, but we find it mentioned in the Tell el-Amarna Letters in the 14th century BC, and in <a onClick="return mV(\'Gen\',10,19);">Ge 10:19</a> it is the chief city of the Canaanites, and Joshua (<a onClick="return mV(\'Jos\',11,8);">Jos 11:8</a>) calls it Great Sidon. It led all the Phoenician cities in its early development of maritime affairs, its sailors being the first to launch out into the open sea out of sight of land and to sail by night, guiding themselves by the stars. They were the first to come into contact with the Greeks and we find the mention of them several times in Homer, while other Phoenician towns are not noticed. Sidon became early distinguished for its manufactures and the skill of its artisans, such as beautiful metal-work in silver and bronze and textile fabrics embroidered and dyed with the famous purple dye which became known as Tyrian, but which was earlier produced at Sidon. Notices of these choice articles are found in Homer, both in the Iliad and the Odyssey. Sidon had a monarchical form of government, as did all the Phoenician towns, but it also held a sort of hegemony over those to the south as far as the limit of Phoenicia. It likewise made one attempt to establish an inland colony at Laish or Dan, near the headwaters of the Jordan, but this ended in disaster (<a onClick="return mV(\'Jdg\',18,7,27,28);">Jud 18:7,27,28</a>). The attempt was not renewed, but many colonies were established over-sea. Citium, in Cyprus, was one of the earliest.<P>2. Historical:<P>(1) The independence of Sidon was lost when the kings of the XVIIIth and XIXth Dynasties of Egypt added Palestine and Syria to their dominions (1580-1205 BC). The kings of Sidon were allowed to remain on the throne as long as they paid tribute, and perhaps still exercised authority over the towns that had before been subject to them. When the power of Egypt declined under Amenhotep IV (1375-1358), the king of Sidon seems to have thrown off the yoke, as appears from the Tell el-Amarna Letters. Rib-addi of Gebal writes to the king of Egypt that Zimrida, king of Sidon, had joined the enemy, but Zimrida himself claims, in the letters he wrote, to be loyal, declaring that the town belonging to him had been taken by the Khabiri (Tab. 147). Sidon, with the other towns, eventually became independent of Egypt, and she retained the hegemony of the southern towns and perhaps added Dor, claimed by the Philistines, to her dominion. This may have been the reason for the war that took place about the middle of the 12th century BC, in which the Philistines took and plundered Sidon, whose inhabitants fled to Tyre and gave the latter a great impetus. Sidon, however, recovered from the disaster and became powerful again. The Book of Judges claims that Israel was oppressed by Sidon (<a onClick="return mV(\'Jdg\',10,12);">10:12</A>), but it is probable Sidon stands here for Phoenicia in general, as being the chief town.<P>(2) Sidon submitted to the Assyrian kings as did the Phoenician cities generally, but revolted against Sennacherib and again under Esar-haddon. The latter destroyed a large part of the city and carried off most of the inhabitants, replacing them by captives from Babylon and Elam, and renamed it Ir-Esar-had-don ("City of Esar-haddon"). The settlers readily mingled with the Phoenicians, and Sidon rose to power again when Assyria fell, was besieged by Nebuchadnezzar at the time of his siege of Jerusalem and Tyre, and was taken, having lost about half of its inhabitants by plague. The fall of Babylon gave another short period of independence, but the Persians gained control without difficulty, and Sidon was prominent in the Persian period as the leading naval power among the Phoenicians who aided their suzerain in his attacks upon Greece. In 351 BC, Sidon rebelled under Tabnit II (Tennes), and called in the aid of Greek mercenaries to the number of 10,000; but Ochus, the Persian king, marched against him with a force of 300,000 infantry and 30,000 horse, which so frightened Tabnit that he betrayed the city to save his own life. But the citizens, learning of the treachery, first burned their fleet and then their houses, perishing with their wives and children rather than fall into the hands of Ochus, who butchered all whom he seized, Tabnit among them. It is said that 40,000 perished in the flames. A list of the kings of Sidon in the Persian period has been recovered from the inscriptions and the coins, but the dates of their reigns are not accurately known. The dynasty of the known kings begins with Esmunazar I, followed by Tabnit I, Amastoreth; Esmunazar II, Strato I (Bodastart), Tabnit II (Tennes) and Strato II. Inscriptions from the temple of Esmun recently discovered give the name of a Bodastart and a son Yatonmelik, but whether the first is one of the Stratos above mentioned or a third is uncertain; also whether the son ever reigned or not. As Bodastart calls himself the grandson of Esmunazar, he is probably Strato I who reigned about 374-363 BC, and hence, his grandfather, Esmunazar I, must have reigned in 400 BC or earlier. Strato II was on the throne when Alexander took possession of Phoenicia and made no resistance to him, and even aided him in the siege of Tyre, which shows that Sidon had recovered after the terrible disaster it suffered in the time of Ochus. It perhaps looked upon the advance of Alexander with content as its avenger. The destruction of Tyre increased the importance of Sidon, and after the death of Alexander it became attached to the kingdom of the Ptolemies and remained so until the victory of Antiochus III over Scopas (198 BC), when it passed to the Seleucids and from them to the Romans, who granted it a degree of autonomy with native magistrates and a council, and it was allowed to coin money in bronze.<P>3. New Testament Mention:<P>Sidon comes into view several times in the New Testament; first when Christ passed into the borders of Tyre and Sidon and healed the daughter of the Syro-phoenician woman (<a onClick="return mV(\'Mar\',7,\'24-30\');">Mr 7:24-30</a>); also when Herod Agrippa I received a delegation from Tyre and Sidon at Caesarea (<a onClick="return mV(\'Act\',12,20);">Ac 12:20</a>), where it appears to have been outside his jurisdiction. Paul, on his way to Rome, was permitted to visit some friends at Sidon (<a onClick="return mV(\'Act\',27,3);">Ac 27:3</a>). See also <a onClick="return mV(\'Mat\',11,21);">Mt 11:21</a>f and <a onClick="return mV(\'Mar\',3,8);">Mr 3:8</a>.<P>It was noted for its school of philosophy under Augustus and Tiberius, its inhabitants being largely Greek; and when Berytus was destroyed by an earthquake in 551, its great law school was removed to Sidon. It was not of great importance during the Crusades, being far surpassed by Acre, and in modern times it is a small town of some 15,000.`<a href="./study/isbe/search.html?string=PHOENICIA">PHOENICIA</a>`138';
isbe[8158]='Sidonians`si-do\'-ni-anz: Natives or inhabitants of Sidon (<a onClick="return mV(\'Deu\',3,9);">De 3:9</a>; <a onClick="return mV(\'Jos\',13,4,6);">Jos 13:4,6</a>; <a onClick="return mV(\'Jdg\',3,3);">Jud 3:3</a>; <a onClick="return mV(\'1Ki\',5,6);">1Ki 5:6</a>).``1';
isbe[8159]='Siege`sej (matsor (<a onClick="return mV(\'Deu\',28,52,53);">De 28:52,53</a>; <a onClick="return mV(\'1Ki\',15,27);">1Ki 15:27</a>; <a onClick="return mV(\'2Ki\',25,2);">2Ki 25:2</a>; <a onClick="return mV(\'Isa\',29,3);">Isa 29:3</a>; <a onClick="return mV(\'Eze\',4,2);">Eze 4:2</a>); "to be besieged," "to suffer siege," ba-matsor bo\' (<a onClick="return mV(\'Deu\',20,19);">De 20:19</a>; <a onClick="return mV(\'2Ki\',24,10);">2Ki 24:10</a>; <a onClick="return mV(\'2Ki\',25,2);">25:2</a>)):<P>1. In Early Hebrew History<P>2. In the Monarchy<P>3. Preliminaries to Siege<P>4. Siege Operations: Attack<P class="in15">(1) Investment of City<P class="in15">(2) Line of Circumvallation<P class="in15">(3) Mound, or Earthworks<P class="in15">(4) Battering-Rams<P class="in15">(5) Storming of Walls and Rushing of Breach<P>5. Siege Operations: Defense<P>6. Raising of Siege<P>7. Horrors of Siege and Capture<P>8. Siege in the New Testament<P>LITERATURE<hr /><P>1. In Early Hebrew History:<P>In early Hebrew history, siege operations are not described and can have been little known. Although the Israelites had acquired a certain degree of military discipline in the wilderness, when they entered Canaan they had no experience of the operations of a siege and were without the engines of war necessary for the purpose. Jericho, with its strongly fortified wall, was indeed formally invested—it "was straitly shut up because of the children of Israel: none went out, and none came in" (<a onClick="return mV(\'Jos\',6,1);">Jos 6:1</a>)—but it fell into their hands without a siege. Other cities seem to have yielded after pitched battles, or to have been taken by assault. Many of the Canaanite fortresses, like Gezer (<a onClick="return mV(\'2Sa\',5,25);">2Sa 5:25</a>; <a onClick="return mV(\'Jos\',16,10);">Jos 16:10</a>), Taanach and Megiddo (<a onClick="return mV(\'Jdg\',1,27);">Jud 1:27</a>), remained unreduced. Jerusalem was captured by the men of Judah (<a onClick="return mV(\'Jdg\',1,8);">Jud 1:8</a>), but the fort of Jebus remained unconquered till the time of David (<a onClick="return mV(\'2Sa\',5,6);">2Sa 5:6</a>).<P>2. In the Monarchy:<P>In the days of the monarchy more is heard of siege operations. At the siege of Rabbath-Ammon Joab seems to have deprived the city of its water-supply and rendered it untenable (<a onClick="return mV(\'2Sa\',11,1);">2Sa 11:1</a>; <a onClick="return mV(\'2Sa\',12,27);">12:27</a>). At Abel of Beth-maacah siege operations are described in which Joab distinguished himself (<a onClick="return mV(\'2Sa\',20,15);">2Sa 20:15</a>). David and Solomon, and, after the disruption of the kingdom, Rehoboam and Jeroboam built fortresses which ere long became the scene of siege operations. The war between Judah and Israel in the days of Nadab, Baasha, and Elah was, for the most part, a war of sieges. It was while besieging Gibbethon that Nadab, the son of Jeroboam, was slain by Baasha (<a onClick="return mV(\'1Ki\',15,27);">1Ki 15:27</a>), and, 27 years after, while the army of Israel was still investing the same place, the soldiery chose their commander Omri to be king over Israel (<a onClick="return mV(\'1Ki\',16,16);">1Ki 16:16</a>). From the Egyptians, the Syrians, the Assyrians, and the Chaldeans, with whom they came into relations in later times as allies or as enemies, the people of the Southern and of the Northern Kingdoms learned much regarding the art, both of attack and of defense of fortified places.<P>3. Preliminaries to Siege:<P>It was an instruction of the Deuteronomic Law that before a city was invested for a long siege, it should be summoned to capitulate (<a onClick="return mV(\'Deu\',20,10);">De 20:10</a>; compare <a onClick="return mV(\'2Sa\',20,18);">2Sa 20:18</a>; <a onClick="return mV(\'2Ki\',18,17);">2Ki 18:17</a>). If the offer of peace be declined, then the siege is to be proceeded with, and if the city be captured, all the male population is to be put to death, and the women and children reserved as a prey for the captors. To this humane reservation the cities of the Canaanites were to be an exception: their inhabitants were to be wholly exterminated (<a onClick="return mV(\'Deu\',20,\'16-18\');">De 20:16-18</a>).<P>The same law prescribed that there should be no unnecessary destruction of fruit trees in the prosecution of a long siege. Trees not yielding fruit for human sustenance might be cut down: "And thou shalt build bulwarks (matsor, "siegeworks") against the city that maketh war with thee, until it fall" (<a onClick="return mV(\'Deu\',20,19,20);">De 20:19,20</a>). This instruction to have regard to the fruit trees around a hostile city seems to have been more honored in the breach than in the observance, even in Israel. When the allied kings of Israel, Judah, and Edom were invading Moab and had instruction to "smite every fortified city," the prophet Elisha bade them also "fell every good tree, and stop all fountains of water, and mar every good piece of land with stones" (<a onClick="return mV(\'2Ki\',3,19,25);">2Ki 3:19,25</a>). When the assault of Jerusalem by the Chaldeans was imminent, Yahweh commanded the cutting down of the trees (<a onClick="return mV(\'Jer\',6,6);">Jer 6:6</a>). In Arabian warfare, we are told, the destruction of the enemy\'s palm groves was a favorite exploit (Robertson Smith, OTJC2, 369), and the Assyrians when they captured a city had no compunction in destroying its plantations (Inscription of Shalmaneser II on Black Obelisk).<P>4. Siege Operations: Attack:<P>From passages in the Prophets, upon which much light has been thrown by the ancient monuments of Assyria and Chaldea, we gain a very clear idea of the siege works directed against a city by Assyrian or Chaldean invaders. The siege of Lachish (<a onClick="return mV(\'2Ki\',18,13,14);">2Ki 18:13,14</a>; <a onClick="return mV(\'Isa\',36,1,2);">Isa 36:1,2</a>) by Sennacherib is the subject of a series of magnificent reliefs from the mound of Koyunjik (Layard, Monuments of Nineveh, lI, plates 20, 21, 22). The downfall of Nineveh as predicted in Nahum s prophecy lets us see the siege operations proceeding with striking realism (see Der Untergang Ninivehs by A. Jeremias and Colonel Billerbeck). Nowhere, however, are the incidents of a siege—the gathering of hostile forces, the slaughter of peaceful inhabitants in the country around, the raising of siegeworks, the setting of engines of war against the walls, the demolition of the towers, the breach in the principal wall, the rush of men and the clatter of horses\' hoofs through the streets, the slaughter, the pillage, the destruction of walls and houses—more fully and faithfully recorded than by Ezekiel when predicting the capture of Tyre by Nebuchadrezzar (<a onClick="return mV(\'Eze\',26,\'7-12\');">Eze 26:7-12</a>). The siege of Tyre lasted 13 years, and Ezekiel tells how every head was made bald and every shoulder worn by the hard service of the besiegers (<a onClick="return mV(\'Eze\',29,18);">Eze 29:18</a>). There were various ways in which an invading army might deal with a fortified city so as to secure its possession. Terms might be offered to secure a capitulation (<a onClick="return mV(\'1Ki\',20,1);">1Ki 20:1</a>ff; <a onClick="return mV(\'2Ki\',18,14);">2Ki 18:14</a>). An attempt might be made to reduce the city by starvation (<a onClick="return mV(\'2Ki\',6,24);">2Ki 6:24</a>ff; <a onClick="return mV(\'2Ki\',17,5);">2Ki 17:5</a>). The city might be invested and captured by assault and storm, as Lachish was by Sennacherib (<a onClick="return mV(\'2Ki\',18,13);">2Ki 18:13</a>; <a onClick="return mV(\'2Ki\',19,8);">19:8</a>; see Layard, op cit., II, plates 20-24). The chief operations of the besiegers were as follows:<P>(1) Investment of City:<P>There was the investment of the city by the besieging army. It was sometimes necessary to establish a fortified camp, like that of Sennacherib at Lachish to guard against sorties by the defenders. Of the siege of Jerusalem we read that Nebuchadrezzar came, "he and all his army, against Jerusalem, and encamped against it" (<a onClick="return mV(\'Jer\',52,4);">Jer 52:4</a>; compare <a onClick="return mV(\'2Ki\',25,1);">2Ki 25:1</a>). From the commencement of the siege, slingers and archers were posted where they could keep the defenders engaged; and it is to this that reference is made when Jeremiah says: "Call together the archers against Babylon, all them that bend the bow; encamp against her round about; let none thereof escape" (<a onClick="return mV(\'Jer\',50,29);">Jer 50:29</a>).<P>(2) Line of Circumvallation:<P>There was next the drawing of a line of circumvallation (day\'eq) with detached forts round about the walls. These forts were towers manned by archers, or they were used as stations from which to discharge missiles (<a onClick="return mV(\'Jer\',52,4);">Jer 52:4</a>; <a onClick="return mV(\'Eze\',17,17);">Eze 17:17</a>). In this connection the word "munition" in the King James Version and the English Revised Version (matsor) in <a onClick="return mV(\'Nah\',1,1);">Na 1:1</a> disappears in the American Standard Revised Version and is replaced by "fortress."<P>(3) Mound or Earthworks:<P>Following upon this was the mound (colelah), or earthworks, built up to the height of the walls, so as to command the streets of the city, and strike terror into the besieged. From the mound thus erected the besiegers were able to batter the upper and weaker part of the city wall (<a onClick="return mV(\'2Sa\',20,15);">2Sa 20:15</a>; <a onClick="return mV(\'Isa\',37,33);">Isa 37:33</a>; <a onClick="return mV(\'Jer\',6,6);">Jer 6:6</a>; <a onClick="return mV(\'Eze\',4,2);">Eze 4:2</a>; <a onClick="return mV(\'Dan\',11,15);">Da 11:15</a>; <a onClick="return mV(\'Lam\',4,18);">La 4:18</a>). If, however, the town, or fortress, was built upon an eminence, an inclined plane reaching to the height of the eminence might be formed of earth or stones, or trees, and the besiegers would be able to bring their engines to the foot of the walls. This road was even covered with bricks, forming a kind of paved way, up which the ponderous machines could be drawn without difficulty. To such roads there are references in Scripture (<a onClick="return mV(\'Job\',19,12);">Job 19:12</a>; <a onClick="return mV(\'Isa\',29,3);">Isa 29:3</a>, "siege works"; compare Layard, Nineveh and Its Remains, II, 366f). In the case of Tyre this mound, or way of approach, was a dam thrown across the narrow strait to obtain access to the walls (<a onClick="return mV(\'Eze\',26,8);">Eze 26:8</a>). Very often, too, there was a trench, sometimes filled with water, at the foot of the wall, which had to be dealt with previous to an assault.<P>(4) Battering-Rams:<P>The earthworks having been thrown up, and approaches to the walls secured, it was possible to set and to work the battering-rams (karim) which were to be employed in breaching the walls (<a onClick="return mV(\'Eze\',4,2);">Eze 4:2</a>), or in bursting open the gates (<a onClick="return mV(\'Eze\',21,22);">Eze 21:22</a>). The battering-rams were of different kinds. On Assyrian monuments they are found joined to movable towers holding warriors and armed men, or, in other cases, joined to a stationary tower constructed on the spot. When the men who are detailed to work the ram get it into play, with its heavy beams of planks fastened together and the great mass of metal forming its head, they can hardly fail to make an impression, and gradually, by the constantly repeated shocks, a breach is opened and the besiegers are able to rush in and bear down the defenders. It is to the shelter furnished by these towers that the prophet Nahum refers (<a onClick="return mV(\'Nah\',2,5);">2:5</A>) when he says,"the mantelet is prepared," and that Isaiah points when he declares that the king of Assyria "shall not come unto this city, nor shoot an arrow there, neither shall he come before it with shield (maghen), nor cast up a mound against it" (<a onClick="return mV(\'Isa\',37,33);">Isa 37:33</a>). Ezekiel has the same figure when, describing the siege of Tyre by Nebuchadrezzar, he declares that he shall "cast up a mound" against her, and "raise up the buckler," the buckler (qinnah) being like the Roman testudo, or roof of shields, under cover of which the besiegers carried on operations (<a onClick="return mV(\'Eze\',26,8);">Eze 26:8</a>; Colonel Billerbeck (op. cit., 178) is doubtful whether this device was known to the Assyrians). Under the shelter of their movable towers the besiegers could push forward mines, an operation known as part of siegecraft from a high antiquity (see <a onClick="return mV(\'2Sa\',20,15);">2Sa 20:15</a>, where the American Revised Version margin and the English Revised Version margin give "undermined" as an alternative to "battered"; tunneling was well known in antiquity, as the Siloam tunnel shows).<P>(5) Storming of Walls and Rushing of Breach:<P>The culminating operation would be the storming of the walls, the rushing of the breach. Scaling-ladders were employed to cross the encircling trench or ditch (<a onClick="return mV(\'Pro\',21,22);">Pr 21:22</a>); and Joel in his powerful description of the army of locusts which had devastated the land says that they "climb the wall like men of war" (<a onClick="return mV(\'Joe\',2,7);">Joe 2:7</a>). Attempts were made to set fire to the gates and to break them open with axes (<a onClick="return mV(\'Jdg\',9,52);">Jud 9:52</a>; compare <a onClick="return mV(\'Neh\',1,3);">Ne 1:3</a>; <a onClick="return mV(\'Neh\',2,3);">2:3</a>; <a onClick="return mV(\'Eze\',26,9);">Eze 26:9</a>). Jeremiah tells of the breach that was made in the city when Jerusalem was captured (<a onClick="return mV(\'Jer\',39,2);">Jer 39:2</a>). The breaches in the wall of Samaria are referred to by Amos (<a onClick="return mV(\'Amo\',4,3);">4:3</a>), who pictures the women rushing forth headlong like a herd of kine with hooks and fishhooks in their nostrils.<P>5. Siege Operations: Defense: While the besiegers employed this variety of means of attack, the besieged were equally ingenious and active in maintaining the defense. All sorts of obstructions were placed in the way of the besieging army. Springs and cisterns likely to afford supplies of water to the invaders were carefully covered up, or drained off into the city. Where possible, trenches were filled with water to make them impassable. As the siege-works of the enemy approached the main wall, it was usual to build inner fortifications, and for this purpose houses were pulled down to provide the needful space and also to supply building materials (<a onClick="return mV(\'Isa\',22,10);">Isa 22:10</a>). Slingers placed upon the walls hurled stones upon the advancing enemy, and archers from loopholes and protected battlements discharged arrows against the warriors in their movable towers. Sorties were made to damage the siege-works of the enemy and to prevent the battering-rams from being placed in position. To counteract the assaults of the battering-rams, sacks of chaff were let down like a ship\'s fender in front of the place where the engine operated—a contrivance countered again by poles with scythes upon them which cut off the sacks (Josephus, BJ, III, vii, 20). So, too, the defenders, by dropping a doubled chain or rope from the battlements, caught the ram and broke the force of its blows. Attempts were made to destroy the ram also by fire. In the great bas-relief of the siege of Lachish an inhabitant is seen hurling a lighted torch from the wall; and it was a common device to pour boiling water or oil from the wall upon the assailants. Missiles, too, were thrown with deadly effect from the battlements by the defenders, and it was by a piece of a millstone thrown by a woman that Abimelech met his death at Thebez (<a onClick="return mV(\'Jdg\',9,53);">Jud 9:53</a>). While Uzziah of Judah furnished his soldiers with shields and spears and helmets and coats of mail and bows and slingstones, he also "made in Jerusalem engines, invented by skillful men, to be on the towers and upon the battlements, wherewith to shoot arrows and great stones" (<a onClick="return mV(\'2Ch\',26,15);">2Ch 26:15</a>). The Jews had, for the defense of Jerusalem against the army of Titus, engines which they had taken from the Twelfth Legion at Beth-horon which seem to have had a range of 1,200 ft. Many ingenious devices are described by Josephus as employed by himself when conducting the defense of Jotapata in Galilee against Vespasian and the forces of Rome (BJ, III, vii).<P>6. Raising of Siege:<P>When Nahash king of the Ammonites laid siege to Jabesh-gilead in the opening days of the reign of Saul, the terms of peace offered to the inhabitants were so humiliating and cruel that they sought a respite of seven days and appealed to Saul in their distress. When the newly chosen king heard of their desperate condition he assembled a great army, scattered the Ammonites, and raised the siege of Jabesh-gilead, thus earning the lasting gratitude of the inhabitants (<a onClick="return mV(\'1Sa\',11,\'1-\');">1Sa 11</a>; compare <a onClick="return mV(\'1Sa\',31,12,13);">1Sa 31:12,13</a>). When Zedekiah of Judah found himself besieged in Jerusalem by the Chaldean army under Nebuzaradan, he sent intelligence to Pharaoh Hophra who crossed the frontier with his army to attack the Chaldeans and obliged them to desist from the siege. The Chaldeans withdrew for the moment from the walls of Jerusalem and offered battle to Pharaoh Hophra and his host, but the courage of the Egyptian king failed him and he retired in haste without encountering the Chaldeans in a pitched battle. The siege was prosecuted to the bitter end, and Jerusalem was captured and completely overthrown (<a onClick="return mV(\'2Ki\',25,1);">2Ki 25:1</a>; <a onClick="return mV(\'Jer\',37,\'3-10\');">Jer 37:3-10</a>; <a onClick="return mV(\'Eze\',17,17);">Eze 17:17</a>).<P>7. Horrors of Siege and Capture:<P>In the ancient law of Israel "siege" is classed with drought and pestilence and exile as punishments with which Yahweh would visit His people for their disobedience (<a onClick="return mV(\'Deu\',28,\'49-57\');">De 28:49-57</a>). Of the horrors there described they had again and again bitter experience. At the siege of Samaria by Ben-hadad II, so terrible were the straits to which the besieged were reduced that they cooked and ate their own children (<a onClick="return mV(\'2Ki\',6,28);">2Ki 6:28</a>). In the siege of Jerusalem by the Chaldeans, which ended in the overthrow of the city and the destruction of the Temple, the sufferings of the inhabitants from hunger and disease were incredible (<a onClick="return mV(\'2Ki\',25,3);">2Ki 25:3</a>; <a onClick="return mV(\'Jer\',32,24);">Jer 32:24</a>; <a onClick="return mV(\'Lam\',2,20);">La 2:20</a>; <a onClick="return mV(\'Lam\',4,\'8-10\');">4:8-10</a>). The horrors of siege have, perhaps, reached their climax in the account given by Josephus of the tragedy of Masada. To escape capture by the Romans, ten men were chosen by lot from among the occupants of the fortress, 960 in number, including combatants and non-combatants, men, women and children, to slay the rest. From these ten one was similarly chosen to slay the survivors, and he, having accomplished his awful task, ran his sword into his own body (Josephus, BJ, VII, ix, 1). While all the inhabitants of a city under siege suffered the famine of bread and the thirst for water, the combatants ran the risk of impalement and other forms of torture to which prisoners in Assyrian and Chaldean and Roman warfare were subjected.<P>The horrors attending the siege of a city were only surpassed by the barbarities perpetrated at its capture. The emptying of a city by its capture is likened to the hurling of a stone from a sling (<a onClick="return mV(\'Jer\',10,17,18);">Jer 10:17,18</a>). Deportation of the whole of the inhabitants often followed (<a onClick="return mV(\'2Ki\',17,6);">2Ki 17:6</a>; <a onClick="return mV(\'2Ki\',24,14);">24:14</a>). Not only were the inhabitants of the captured city deported, but their gods were carried off with them and the idols broken in pieces. This is predicted or recorded of Babylon (<a onClick="return mV(\'Isa\',21,9);">Isa 21:9</a>; <a onClick="return mV(\'Isa\',46,1);">46:1</a>; <a onClick="return mV(\'Jer\',50,2);">Jer 50:2</a>), of Egypt (<a onClick="return mV(\'Jer\',43,12);">Jer 43:12</a>), of Samaria (<a onClick="return mV(\'Hsa\',10,6);">Ho 10:6</a>). Indiscriminate slaughter followed the entrance of the assailants, and the city was usually given over to the flames (<a onClick="return mV(\'Jer\',39,8,9);">Jer 39:8,9</a>; <a onClick="return mV(\'Lam\',4,18);">La 4:18</a>). "Cities without number," says Shalmaneser II in one of his inscriptions, "I wrecked, razed, burned with fire." Houses were destroyed and women dishonored (<a onClick="return mV(\'Zec\',14,2);">Zec 14:2</a>). When Darius took Babylon, he impaled three thousand prisoners (Herodotus iii.159). The Scythians scalped and flayed their enemies and used their skins for horse trappings (ibid., iv.64). The Assyrian sculptures show prisoners subjected to horrible tortures, or carried away into slavery. The captured Zedekiah had his eyes put out after he had seen his own sons cruelly put to death (<a onClick="return mV(\'2Ki\',25,7);">2Ki 25:7</a>). It is only employing the imagery familiar to Assyrian warfare when Isaiah represents Yahweh as saying to Sennacherib: "Therefore will I put my hook in thy nose, and my bridle in thy lips, and I will turn thee back by the way by which thou camest" (<a onClick="return mV(\'Isa\',37,29);">Isa 37:29</a>). Anticipating the savage barbarities that would follow the capture of Samaria by the Assyrians, Hosea foresees the infants being dashed to pieces and the women with child being ripped up (<a onClick="return mV(\'Hsa\',10,14);">Ho 10:14</a>; <a onClick="return mV(\'Hsa\',13,16);">13:16</a>; compare <a onClick="return mV(\'Amo\',1,13);">Am 1:13</a>). The prophet Nahum predicting the overthrow of Nineveh recalls how at the capture of No-amon (Egyptian Thebes) by the Assyrian conqueror, Ashurbanipal, "her young children also were dashed in pieces at the head of all the streets; and they cast lots for her honorable men, and all her great men were bound in chains" (<a onClick="return mV(\'Nah\',3,10);">Na 3:10</a>).<P>8. Siege in the New Testament:<P>The only. explicit reference to siege operations in the New Testament is our Lord\'s prediction of the complete destruction of Jerusalem when He wept over its coming doom: "For the days shall come upon thee, when thine enemies shall cast up a bank (charax, the King James Version, quite incorrectly, "trench") about thee, and compass thee round, and keep thee in on every side, and shall dash thee to the ground, and thy children within thee; and they shall not leave in thee one stone upon another" (<a onClick="return mV(\'Luk\',19,43,44);">Lu 19:43,44</a>). The order and particulars of the siege are in accordance with the accounts of siege operations in the Old Testament. How completely the prediction was fulfilled we see from Josephus (BJ, V, vi, 10).<P>Figurative:<P>In Paul\'s Epistles there are figures taken from siege operations. In <a onClick="return mV(\'2Cr\',10,4);">2Co 10:4</a> we have "the casting down of strongholds," where the Greek word kathairesis, from kathairein, is the regular word used in Septuagint for the reduction of a fortress (<a onClick="return mV(\'Pro\',21,22);">Pr 21:22</a>; <a onClick="return mV(\'Lam\',2,2);">La 2:2</a>; 1Ma 5:65). In <a onClick="return mV(\'Eph\',6,16);">Eph 6:16</a> there is allusion to siege-works, for the subtle temptations of Satan are set forth as the flaming darts hurled by the besiegers of a fortress which the Christian soldier is to quench with the shield of faith.<P>LITERATURE.<P>Nowack, Hebraische Archaeologie, 71; Benzinger, "Kriegswesen" in Herzog3; Billerbeck and A. Jeremias, Der Untergang Ninivehs; Billerbeck, Der Festungsbau im alten Orient.``128';

isbe[8162]='Sign`sin (\'oth "a sign" "mark" mopheth, "wonder"\' semeion, "a sign," "signal," "mark"): A mark by which persons or things are distinguished and made known. In Scripture used generally of an address to the senses to attest the existence of supersensible and therefore divine power. Thus the plagues of Egypt were "signs" of divine displeasure against the Egyptians (<a onClick="return mV(\'Exd\',4,8);">Ex 4:8</a>ff; <a onClick="return mV(\'Jos\',24,17);">Jos 24:17</a>, and often); and the miracles of Jesus were "signs" to attest His unique relationship with God (<a onClick="return mV(\'Mat\',12,38);">Mt 12:38</a>; <a onClick="return mV(\'Jhn\',2,18);">Joh 2:18</a>; <a onClick="return mV(\'Act\',2,22);">Ac 2:22</a>). Naturally, therefore, both in the Old Testament and the New Testament, "signs" are assimilated to the miraculous, and prevailingly associated with immediate divine interference. The popular belief in this manner of communication between the visible and the invisible worlds has always been, and is now, widespread. So-called "natural" explanations, however ingenious or cogent, fail with the great majority of people to explain anything. Wesley and Spurgeon were as firm believers in the validity of such methods of intercourse between man and God as were Moses and Gideon, Peter and John.<P>The faith that walks by signs is not by any means to be lightly esteemed. It has been allied with the highest nobility of character and with the most signal achievement. Moses accepted the leadership of his people in response to a succession of signs: e.g. the burning bush, the rod which became a serpent, the leprous hand, etc. (<a onClick="return mV(\'Exd\',3,\'1-\');">Ex 3</a>; <a onClick="return mV(\'Exd\',4,\'1-\');">4</a>); so, too, did Gideon, who was not above making proof of God in the sign of the fleece of wool (<a onClick="return mV(\'Jdg\',6,\'36-40\');">Jud 6:36-40</a>). In the training of the Twelve, Jesus did not disdain the use of signs (<a onClick="return mV(\'Luk\',5,\'1-11\');">Lu 5:1-11</a>, and often); and the visions by which Peter and Paul were led to the evangelization of the Gentiles were interpreted by them as signs of the divine purpose (<a onClick="return mV(\'Act\',10,\'1-\');">Ac 10</a>; <a onClick="return mV(\'Act\',16,\'1-\');">16</a>).<P>The sacramental use of the sign dates from the earliest period, and the character of the sign is as diverse as the occasion. The rainbow furnishes radiant suggestion of God\'s overarching love and assurance that the waters shall no more become a flood to destroy the earth (<a onClick="return mV(\'Gen\',9,13);">Ge 9:13</a>; compare <a onClick="return mV(\'Gen\',4,15);">Ge 4:15</a>); the Feast of Unleavened Bread is a reminder of God\'s care in bringing His people out of bondage (<a onClick="return mV(\'Exd\',13,3);">Ex 13:3</a>); the Sabbath is an oft-recurring proclamation of God\'s gracious thought for the well-being of man (<a onClick="return mV(\'Exd\',31,13);">Ex 31:13</a>; <a onClick="return mV(\'Eze\',20,12);">Eze 20:12</a>); the brazen serpent, an early foreshadowing of the cross, perpetuates the imperishable promise of forgiveness and redemption (<a onClick="return mV(\'Num\',21,9);">Nu 21:9</a>); circumcision is made the seal of the special covenant under which Israel became a people set apart (<a onClick="return mV(\'Gen\',17,11);">Ge 17:11</a>); baptism, the Christian equivalent of circumcision, becomes the sign and seal of the dedicated life and the mark of those avowedly seeking to share in the blessedness of the Kingdom of God (<a onClick="return mV(\'Luk\',3,\'12-14\');">Lu 3:12-14</a>; <a onClick="return mV(\'Act\',2,41);">Ac 2:41</a>, and often); bread and wine, a symbol of the spiritual manna by which soul and body are preserved unto everlasting life, is the hallowed memorial of the Lord\'s death until His coming again (<a onClick="return mV(\'Luk\',22,\'14-20\');">Lu 22:14-20</a>; <a onClick="return mV(\'1Cr\',11,\'23-28\');">1Co 11:23-28</a>). Most common of all were the local altars and mounds consecrated in simple and sincere fashion to a belief in God\'s ruling and overruling providence (<a onClick="return mV(\'Jos\',4,\'1-10\');">Jos 4:1-10</a>).<P>Signs were offered in proof of the divine commission of prophet (<a onClick="return mV(\'Isa\',20,3);">Isa 20:3</a>) and apostle (<a onClick="return mV(\'2Cr\',12,12);">2Co 12:12</a>), and of the Messiah Himself (<a onClick="return mV(\'Jhn\',20,30);">Joh 20:30</a>; <a onClick="return mV(\'Act\',2,22);">Ac 2:22</a>); and they were submitted in demonstration of the divine character of their message (<a onClick="return mV(\'2Ki\',20,9);">2Ki 20:9</a>; <a onClick="return mV(\'Isa\',38,1);">Isa 38:1</a>; <a onClick="return mV(\'Act\',3,\'1-16\');">Ac 3:1-16</a>). By anticipation the child to be born of a young woman (<a onClick="return mV(\'Isa\',7,\'10-16\');">Isa 7:10-16</a>; compare <a onClick="return mV(\'Luk\',2,12);">Lu 2:12</a>) is to certify the prophet\'s pledge of a deliverer for a captive people.<P>See <a href="./study/isbe/search.html?string=UPPERCASE">IMMANUEL</a>.<P>With increase of faith the necessity for signs will gradually decrease. Jesus hints at this (<a onClick="return mV(\'Jhn\',4,48);">Joh 4:48</a>), as does also Paul (<a onClick="return mV(\'1Cr\',1,22);">1Co 1:22</a>). Nevertheless "signs," in the sense of displays of miraculous powers, are to accompany the faith of believers (<a onClick="return mV(\'Mar\',16,17);">Mr 16:17</a>f), usher in and forthwith characterize the dispensation of the Holy Spirit, and mark the consummation of the ages (<a onClick="return mV(\'Rev\',15,1);">Re 15:1</a>).<P>See also <a href="./study/isbe/search.html?string=MIRACLE">MIRACLE</a>.<P>For "sign" of a ship (parasemos, "ensign," <a onClick="return mV(\'Act\',28,11);">Ac 28:11</a>).<P>See <a href="./study/isbe/search.html?string=DIOSCURI">DIOSCURI</a>; <a href="./study/isbe/search.html?string=SHIPS+AND+BOATS">SHIPS AND BOATS, III, 2</a>.``168';

isbe[8166]='Sihon`si\'-hon (cichon): King of the Amorites, who vainly opposed Israel on their journey from Egypt to Palestine, and who is frequently mentioned in the historical books and in the Psalms because of his prominence and as a warning for those who rise against Yahweh and His people (<a onClick="return mV(\'Num\',21,21);">Nu 21:21</a>, and often; <a onClick="return mV(\'Deu\',1,4);">De 1:4</a>; <a onClick="return mV(\'Deu\',31,4);">31:4</a>; <a onClick="return mV(\'Jos\',2,10);">Jos 2:10</a>; <a onClick="return mV(\'Jdg\',11,19,20,21);">Jud 11:19,20,21</a>; <a onClick="return mV(\'1Ki\',4,19);">1Ki 4:19</a>; <a onClick="return mV(\'Neh\',9,22);">Ne 9:22</a>; <a onClick="return mV(\'Psa\',135,11);">Ps 135:11</a>; <a onClick="return mV(\'Psa\',136,19);">136:19</a>; <a onClick="return mV(\'Jer\',48,45);">Jer 48:45</a>).``1';
isbe[8167]='Sihor`si\'-hor.`<a href="./study/isbe/search.html?string=SHIHOR">SHIHOR</a>`1';
isbe[8168]='Sihor-Libnath`si\'-hor-lib\'-nath.`<a href="./study/isbe/search.html?string=SHIHOR-LIBNATH">SHIHOR-LIBNATH</a>`1';
isbe[8169]='Silas`si\'-las (Silas, probably contraction for Silouanos; the Hebrew equivalents suggested are shalish, "Tertius," or shelach (<a onClick="return mV(\'Gen\',10,24);">Ge 10:24</a>) (Knowling), or sha\'ul = "asked" (Zahn)): The Silas of Acts is generally identified with the Silvaus of the Epistles. His identification with Titus has also been suggested, based on <a onClick="return mV(\'2Cr\',1,19);">2Co 1:19</a>; <a onClick="return mV(\'2Cr\',8,23);">8:23</a>, but this is very improbable (compare Knowling, Expositor\'s Greek Test., II, 326). Silas, who was probably a Roman citizen (compare <a onClick="return mV(\'Act\',16,37);">Ac 16:37</a>), accompanied Paul during the greater part of his 2nd missionary journey (<a onClick="return mV(\'Act\',15,\'1-\');">Ac 15-18</a>). At the meeting of the Christian community under James at Jerusalem, which decided that circumcision should not be obligatory in the case of Gentile believers, Silas and Judas Barsabas were appointed along with Paul and Barnabas to convey to the churches in Antioch and Syria and Cilicia the epistle informing them of this decision. As "leading men among the brethren" at Jerusalem, and therefore more officially representative of the Jerusalem church than Paul and Barnabas, Silas and Judas were further commissioned to confirm the contents of the letter by "word of mouth." On arrival at Antioch, the epistle was delivered, and Judas and Silas, "being themselves also prophets, exhorted the brethren with many words, and confirmed them." Their mission being thus completed, the four were "dismissed in peace from the brethren unto those that had sent them forth" (Revised Version), or "unto the apostles" (the King James Version) (<a onClick="return mV(\'Act\',15,\'22-33\');">Ac 15:22-33</a>).<P>Different readings now render the immediate movements of Silas somewhat obscure; <a onClick="return mV(\'Act\',15,33);">Ac 15:33</a> would imply that he returned to Jerusalem. But some texts proceed in <a onClick="return mV(\'Act\',15,33);">15:34</A>, "Notwithstanding it pleased Silas to abide there still," and others add "and Judas alone proceeded." Of this, the first half is accepted by the King James Version. The principal texts however reject the whole verse and are followed in this by the Revised Version (British and American). It is held by some that he remained in Antioch till chosen by Paul (<a onClick="return mV(\'Act\',15,40);">Ac 15:40</a>). Others maintain that he returned to Jerusalem where John Mark then was (compare <a onClick="return mV(\'Act\',13,13);">Ac 13:13</a>); and that either during the interval of "some days" (<a onClick="return mV(\'Act\',15,36);">Ac 15:36</a>), when the events described in <a onClick="return mV(\'Gal\',2,11);">Ga 2:11</a>ff took place (Wendt), he returned to Antioch along with Peter, or that he and John Mark were summoned thither by Paul and Barnabas, subsequent to their dispute regarding Mark. (For fuller discussion, see Knowling, Expositor\'s Greek Test., II, 330, 332-35.)<P>Upon Barnabas\' separation from Paul, Silas was chosen by Paul in his place, and the two missionaries, "after being commended by the brethren (at Antioch) to the grace of the Lord," proceeded on their journey (<a onClick="return mV(\'Act\',15,\'33-40\');">Ac 15:33-40</a> margin). Passing through Syria, Cilicia, Galatia, Phrygia and Mysia, where they delivered the decree of the Jerusalem council and strengthened the churches, and were joined by Timothy, they eventually reached Troas (<a onClick="return mV(\'Act\',15,\'41-\');">Ac 15:41</a>-<a onClick="return mV(\'Act\',16,\'1-8\');">16:8</a>). Indications are given that at this city Luke also became one of their party (compare also the apocryphal "Acts of Paul," where this is definitely stated; Budge, Contendings of the Apostles, II, 544).<P>Upon the call of the Macedonian, the missionary band set sail for Greece, and after touching at Samothrace, they landed at Neapolis (<a onClick="return mV(\'Act\',16,\'9-11\');">Ac 16:9-11</a>). At Philippi, Lydia, a seller of purple, was converted, and with her they made their abode; but the exorcism of an evil spirit from a sorceress brought upon Silas and Paul the enmity of her masters, whose source of gain was thus destroyed. On being charged before the magistrates with causing a breach of the peace and preaching false doctrine, their garments were rent off them and they were scourged and imprisoned. In no way dismayed, they prayed and sang hymns to God, and an earthquake in the middle of the night secured them a miraculous release. The magistrates, on learning that the two prisoners whom they had so maltreated were Roman citizens, came in person and besought them to depart out of the city (<a onClick="return mV(\'Act\',16,\'12-39\');">Ac 16:12-39</a>). After a short visit to the house of Lydia, where they held an interview with the brethren, they departed for Thessalonica, leaving Luke behind (compare Knowling, op. cit., 354-55). There they made many converts, especially among the Greeks, but upon the house of Jason, their host, being attacked by hostile Jews, they were compelled to escape by night to Berea (<a onClick="return mV(\'Act\',16,40);">Ac 16:40-17:10</a>). There they received a better hearing from the Jews, but the enmity of the Thessalonian Jews still pursued them, and Paul was conducted for safety to Athens, Silas and Timothy being left behind. On his arrival, he dispatched an urgent message back to Bercea for Silas and Timothy to rejoin him at that city (<a onClick="return mV(\'Act\',17,\'11-15\');">Ac 17:11-15</a>). The narrative of Acts implies, however, that Paul had left Athens and had reached Corinth before he was overtaken by his two followers (<a onClick="return mV(\'Act\',18,5);">18:5</A>). Knowling (op. cit., 363-64) suggests that they may have actually met at Athens, and that Timothy was then sent to Thessalonica (compare <a onClick="return mV(\'1Th\',3,1,2);">1Th 3:1,2</a>), and Silas to Philippi (compare <a onClick="return mV(\'Phl\',4,15);">Php 4:15</a>), and that the three came together again at Corinth. The arrival of Silas and Timothy at that city is probably referred to in <a onClick="return mV(\'2Cr\',11,9);">2Co 11:9</a>. It is implied in <a onClick="return mV(\'Act\',18,18);">Ac 18:18</a> that Silas did not leave Corinth at the same time as Paul, but no further definite reference is made to him in the narrative of the 2nd missionary journey.<P>Assuming his identity with Silvanus, he is mentioned along with Paul and Timothy in <a onClick="return mV(\'2Cr\',1,19);">2Co 1:19</a> as having preached Christ among the Corinthians (compare <a onClick="return mV(\'Act\',18,5);">Ac 18:5</a>). In <a onClick="return mV(\'1Th\',1,1);">1Th 1:1</a>, and <a onClick="return mV(\'2Th\',1,1);">2Th 1:1</a>, the same three send greetings to the church at Thessalonica (compare <a onClick="return mV(\'Act\',17,\'1-9\');">Ac 17:1-9</a>). In <a onClick="return mV(\'1Pe\',5,12);">1Pe 5:12</a> he is mentioned as a "faithful brother" and the bearer of that letter to the churches of the Dispersion (compare on this last Knowling, op. cit., 331-32). The theory which assigns He to the authorship of Silas is untenable.``88';
isbe[8170]='Silence`si\'-lens: Five Hebrew roots, with various derivatives, and two Greek words are thus translated. The word is used literally for dumbness, interrupted speech, as in <a onClick="return mV(\'Lam\',2,10);">La 2:10</a>; <a onClick="return mV(\'Psa\',32,3);">Ps 32:3</a>; <a onClick="return mV(\'Ecc\',3,7);">Ec 3:7</a>; <a onClick="return mV(\'Amo\',5,13);">Am 5:13</a>; <a onClick="return mV(\'Act\',15,12);">Ac 15:12</a>; <a onClick="return mV(\'1Cr\',14,28);">1Co 14:28</a>; <a onClick="return mV(\'1Ti\',2,11,12);">1Ti 2:11,12</a> the King James Version (the American Standard Revised Version "quietness"); <a onClick="return mV(\'Rev\',8,1);">Re 8:1</a>, or figuratively of the unanswered prayers of the believer (<a onClick="return mV(\'Psa\',83,1);">Ps 83:1</a>; <a onClick="return mV(\'Psa\',35,22);">35:22</a>; <a onClick="return mV(\'Jer\',8,14);">Jer 8:14</a>); of awe in the presence of the Divine Majesty (<a onClick="return mV(\'Isa\',41,1);">Isa 41:1</a>; <a onClick="return mV(\'Zec\',2,13);">Zec 2:13</a>), or of death (<a onClick="return mV(\'1Sa\',2,9);">1Sa 2:9</a>; <a onClick="return mV(\'Psa\',94,17);">Ps 94:17</a>; <a onClick="return mV(\'Psa\',115,17);">115:17</a>).``1';
isbe[8171]='Silk; Silkworm`silk\'-wurm (1) meshi (<a onClick="return mV(\'Eze\',16,10,13);">Eze 16:10,13</a>), perhaps from mashah, "to draw" "to extract" compare Arabic masa\' of same meaning; Septuagint trichapton, "woven of hair"; (2) serikon (<a onClick="return mV(\'Rev\',18,12);">Re 18:12</a>); (3) shesh; compare Arabic shash, a thin cotton material; (4) buts; compare Arabic \'abyad, "white," from bad; (5) bussos, "fine linen," later used of cotton and silk): The only undoubted reference to silk in the Bible is the passage cited from Revelation, where it is mentioned among the merchandise of Babylon. Serikon, "silk," is from Ser, the Greek name of China, whence silk was first obtained. The equivalent Latin sericum occurs frequently in classical authors, and is found in the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) (<a onClick="return mV(\'Est\',8,15);">Es 8:15</a>) for buts, "fine linen." For buts, bussos, and shesh English Versions of the Bible has nearly always "fine linen," but for shesh in <a onClick="return mV(\'Pro\',31,22);">Pr 31:22</a>, the King James Version has "silk," and in <a onClick="return mV(\'Gen\',41,42);">Ge 41:42</a> and <a onClick="return mV(\'Exd\',25,4);">Ex 25:4</a>, the King James Version margin has "silk" and the Revised Version margin has "cotton."<P>There can be little doubt of the correctness of English Versions of the Bible "silk" for meshi in <a onClick="return mV(\'Eze\',16,10);">Eze 16:10</a>, "I girded thee about with fine linen (shesh), and\' covered thee with silk (meshi)," and in the similar passage, <a onClick="return mV(\'Eze\',16,13);">Eze 16:13</a>.<P>Silk is produced by all Lepidoptera, butterflies and moths, but it is of great economic importance only in the Chinese silkworm, Bombyx mori, whose larva, a yellowish-white caterpillar from 2 to 3 in. long, feeds on the leaves of the mulberry (Morus). A pair of large glands on the two sides of the stomach secrete a viscous fluid, which is conveyed by ducts to an orifice under the mouth. On issuing into the air, the fine stream is hardened into the silk fiber, which the caterpillar spins into a cocoon. Within the cocoon the caterpillar is presently transformed into the chrysalis or pupa. The cocoons from which silk is to be spun are subjected to heat which kills the pupae and prevents them from being transformed into the perfect insects or moths, which would otherwise damage the cocoons as they made their exit.<P>The raising of silkworms, and the spinning and weaving of silk are now important industries in Syria, though the insect was unknown in Bible times. It was introduced to the Mediterranean region from China a few centuries after Christ. Coarse silk is produced from the Chinese oak silk-moth, Saturnia pernyi, and from the Japanese oak silk-moth, Saturnia yama-mai. The largest moth of Syria and Palestine is Saturnia pyri, from which silk has also been spun, but not commercially.`<a href="./study/isbe/search.html?string=LINEN">LINEN</a>; <a href="./study/isbe/search.html?string=FINE">FINE</a>; <a href="./study/isbe/search.html?string=WEAVING">WEAVING</a>`37';
isbe[8172]='Silla`sil\'-a (cilla\'; Codex Vaticanus Galla; Codex Alexandrinus Gaallad): Joash was assassinated by his servants "at the house of Millo, on the way that goeth down to Silla" (<a onClick="return mV(\'2Ki\',12,20);">2Ki 12:20</a>). Wherever Beth-millo stood, Silla was evidently in the valley below it; but nothing is known of what it was or where it stood.``1';
isbe[8173]='Siloam, Towerin``<a href="./study/isbe/search.html?string=JERUSALEM">JERUSALEM</a>; <a href="./study/isbe/search.html?string=SILOAM">SILOAM</a>`1';
isbe[8174]='Siloam; Siloah; Shelah; Shiloah`si-lo\'-am, si-lo\'-am, si-lo\'-a, she\'-la, shi-lo\'-a:<P>(1) me ha-shiloach (shiloach or shilloach is a passive form and means "sent" or "conducted") "the waters of (the) Shiloah" (<a onClick="return mV(\'Isa\',8,6);">Isa 8:6</a>).<P>(2) berekhath ha-shelach, "the pool of (the) Shelah" (the King James Version "Siloah") (<a onClick="return mV(\'Neh\',3,15);">Ne 3:15</a>).<P>(3) ten kolumbethran tou (or ton) Siloam, "the pool of Siloam" (<a onClick="return mV(\'Jhn\',9,7);">Joh 9:7</a>).<P>(4) ho purgos en to Siloam, "the tower in Siloam" (<a onClick="return mV(\'Luk\',13,4);">Lu 13:4</a>).<P>1. The Modern Silwan:<P>Although the name is chiefly used in the Old Testament and Josephus as the name of certain "waters," the surviving name today, Silwan, is that of a fairly prosperous village which extends along the steep east side of the Kidron valley from a little north of the "Virgin\'s Fountain" as far as Bir Eyyub. The greater part of the village, the older and better built section, belongs to Moslem fellahin who cultivate the well-watered gardens in the valley and on the hill slopes opposite, but a southern part has recently been built in an extremely primitive manner by Yemen Jews, immigrants from South Arabia, and still farther south, in the commencement of the Wady en Nar, is the wretched settlement of the lepers. How long the site of Silwan has been occupied it is impossible to say. The village is mentioned in the 10th century by the Arab writer Muqaddasi. The numerous rock cuttings, steps, houses, caves, etc., some of which have at times served as chapels, show that the site has been much inhabited in the past, and at one period at least by hermits. The mention of "those eighteen, upon whom the tower in Siloam fell, and killed them" (<a onClick="return mV(\'Luk\',13,4);">Lu 13:4</a>) certainly suggests that there was a settlement there in New Testament times, although some writers consider that this may have reference to some tower on the city walls near the Pool of Siloam.<P>2. The Siloam Aqueduct:<P>Opposite to the main part of Silwan is the "Virgin\'s Fount," ancient <a href="./study/isbe/search.html?string=GIHON">GIHON</a> (which see), whose waters are practically monopolized by the villagers. It is the waters of this spring which are referred to in <a onClick="return mV(\'Isa\',8,5,6);">Isa 8:5,6</a>: "Forasmuch as this people have refused the waters of Shiloah that go softly,...now therefore, behold, the Lord bringeth up upon them the waters of the River."<P>The contrast between the little stream flowing from the Gihon and the great Euphrates is used as a figure of the vast difference between the apparent strength of the little kingdom of Judah and the House of David on the one hand, and the might of "Rezin and Remaliah\'s son" and "all his glory." Although it is quite probable that in those days there was an open streamlet in the valley, yet the meaning of Shiloah, "sent" or "conducted," rather implies some kind of artificial channel, and there is also archaeological evidence that some at least of the waters of Gihon were even at that time conducted by a rock-cut aqueduct along the side of the Kidron valley (see <a href="./study/isbe/search.html?string=JERUSALEM">JERUSALEM, VII, 5</A>). It was not, however, till the days of Hezekiah that the great tunnel aqueduct, Siloam\'s most famous work, was made (<a onClick="return mV(\'2Ki\',20,20);">2Ki 20:20</a>): "Hezekiah also stopped the upper spring of the waters of Gihon, and brought them, straight down on the west side of the City of David" (<a onClick="return mV(\'2Ch\',32,30);">2Ch 32:30</a>); "They stopped all the fountains, and the brook (nachal) that flowed through the midst of the land, saying, Why should the kings of Assyria come, and find much water?" (<a onClick="return mV(\'2Ch\',32,4);">2Ch 32:4</a>; Ecclesiasticus 48:17). Probably the exit of the water at Gihon was entirely covered up and the water flowed through the 1,700 ft. of tunnel and merged in the pool made for it (now known as the Birket Silwan) near the mouth of the Tyropceon valley. This extraordinary winding aqueduct along which the waters of the "Virgin\'s Fount" still flow is described in <a href="./study/isbe/search.html?string=JERUSALEM">JERUSALEM, VII, 4</a> (which see). The lower end of this tunnel which now emerges under a modern arch has long been known as \'Ain Silwan, the "Fountain of Siloam," and indeed, until the rediscovery of the tunnel connecting this with the Virgin\'s Fount (a fact known to some in the 13th century, but by no means generally known until the last century), it was thought this was simply a spring. So many springs all over Palestine issue from artificial tunnels—it is indeed the rule in Judea—that the mistake is natural. Josephus gives no hint that he knew of so great a work as this of Hezekiah\'s, and in the 5th century a church was erected, probably by the empress Eudoxia, at this spot, with the high altar over the sacred "spring." The only pilgrim who mentions this church is Antonius Martyr (circa 570), and after its destruction, probably by the Persians in 614, it was entirely lost sight of until excavated by Messrs. Bliss and Dickie. It is a church of extraordinary architectural features; the floor of the center aisle is still visible.<P>3. The "Pool of Siloam":<P>The water from the Siloam aqueduct, emerging at \'Ain Silwan, flows today into a narrow shallow pool, approached by a steep flight of modern steps; from the southern extremity of this pool the water crosses under the modern road by means of an aqueduct, and after traversing a deeply cut rock channel below the scarped cliffs on the north side of el-Wad, it crosses under the main road up the Kidron and enters a number of channels of irrigation distributed among the gardens of the people of Silwan. The water here, as at its origin, is brackish and impregnated with sewage.<P>The modern Birket es-Silwan is but a poor survivor of the fine pool which once was here. Bliss showed by his excavations at the site that once there was a great rock-cut pool, 71 ft. north and south, by 75 ft. east and west, which may, in part at least, have been the work of Hezekiah (<a onClick="return mV(\'2Ki\',20,20);">2Ki 20:20</a>), approached by a splendid flight of steps along its west side. The pool was surrounded by an arcade 12 ft. wide and 22 1/2 ft. high, and was divided by a central arcade, to make in all probability a pool for men and another for women. These buildings were probably Herodian, if not earlier, and therefore this, we may reasonably picture, was the condition of the pool at the time of the incident in <a onClick="return mV(\'Jhn\',9,7);">Joh 9:7</a>, when Jesus sent the blind man to "wash in the pool of Siloam."<P>This pool is also probably the Pool of Shelah described in <a onClick="return mV(\'Neh\',3,15);">Ne 3:15</a> as lying between the Fountain Gate and the King\'s Garden. It may also be the "king\'s pool" of <a onClick="return mV(\'Neh\',2,14);">Ne 2:14</a>. If we were in any doubt regarding the position of the pool of Siloam, the explicit statement of Josephus (BJ, V, iv, 1) that the fountain of Siloam, which he says was a plentiful spring of sweet water, was at the mouth of the Tyropoeon would make us sure.<P>4. The Birket el Chamra:<P>A little below this pool, at the very mouth of el-Wad, is a dry pool, now a vegetable garden, known as Birket el Chamra ("the red pool"). For many years the sewage of Jerusalem found its way to this spot, but when in 1904 an ancient city sewer was rediscovered (see PEFS, 1904, 392-94), the sewage was diverted and the site was sold to the Greek convent which surrounded it with a wall. Although this is no longer a pool, there is no doubt but that hereabouts there existed a pool because the great and massive dam which Bliss excavated here (see <a href="./study/isbe/search.html?string=JERUSALEM">JERUSALEM, VI, 5</a>) had clearly been made originally to support a large body of water. It is commonly supposed that the original pool here was older than the Birket Silwan, having been fed by an aqueduct which was constructed from Gihon along the side of the Kidron valley before Hezekiah\'s great tunnel. If this is correct (and excavations are needed here to confirm this theory), then this may be the "lower pool" referred to in <a onClick="return mV(\'Isa\',22,9);">Isa 22:9</a>, the waters of which Hezekiah "stopped," and perhaps, too, that described in the same passage as the "old pool."<P>5. The Siloam Aqueduct:<P>The earliest known Hebrew inscription of any length was accidentally discovered near the lower end of the Siloam aqueduct in 1880, and reported by Dr. Schick. It was inscribed upon a rock-smoothed surface about 27 in. square, some 15 ft. from the mouth of the aqueduct; it was about 3 ft. above the bottom of the channel on the east side. The inscription consisted of six lines in archaic Hebrew, and has been translated by Professor Sayce as follows:<P>(1) Behold the excavation. Now this (is) the history of the tunnel: while the excavators were still lifting up<P>(2) The pick toward each other, and while there were yet three cubits (to be broken through)...the voice of the one called<P>(3) To his neighbor, for there was an (?) excess in the rock on the right. They rose up...they struck on the west of the<P>(4) Excavation; the excavators struck, each to meet the other, pick to pick. And there flowed<P>(5) The waters from their outlet to the pool for a thousand, two hundred cubits; and (?)<P>(6) Of a cubit, was the height of the rock over the head of the excavators ....<P>It is only a roughly scratched inscription of the nature of a graffito; the flowing nature of the writing is fully explained by Dr. Reissner\'s recent discovery of ostraca at Samaria written with pen and ink. It is not an official inscription, and consequently there is no kingly name and no date, but the prevalent view that it was made by the work people who carried out Hezekiah\'s great work (<a onClick="return mV(\'2Ki\',20,20);">2Ki 20:20</a>) is now further confirmed by the character of the Hebrew in the ostraca which Reissner dates as of the time of Ahab.<P>Unfortunately this priceless monument of antiquity was violently removed from its place by some miscreants. The fragments have been collected and are now pieced together in the Constantinople museum. Fortunately several excellent "squeezes" as well as transcriptions were made before the inscription was broken up, so that the damage done is to be regretted rather on sentimental than on literary grounds.``117';
isbe[8175]='Silvanus`sil-va\'-nus (Silouanos (<a onClick="return mV(\'2Cr\',1,19);">2Co 1:19</a>)).`<a href="./study/isbe/search.html?string=SILAS">SILAS</a>`1';
