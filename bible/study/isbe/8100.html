isbe = [];

isbe[8101]='Shochoh`sho\'-ko (sokhoh, Codex Vaticanus Sokchoth; Codex Alexandrinus Okcho): This in <a onClick="return mV(\'1Sa\',17,1);">1Sa 17:1</a> the King James Version is a variant of <a href="./study/isbe/search.html?string=SOCOH">SOCOH</a> (which see).``1';
isbe[8102]='Shoe; Shoe-Latchet`shoo, shoo\'-lach-et (na\'al, literally, "that which is fastened," with denominative verb na\'al, "to provide with shoes" (<a onClick="return mV(\'2Ch\',28,15);">2Ch 28:15</a>; <a onClick="return mV(\'Eze\',16,10);">Eze 16:10</a>); hupodema (Sirach 46:19; <a onClick="return mV(\'Mat\',3,11);">Mt 3:11</a>, etc.), from the verb hupodeo (<a onClick="return mV(\'Mar\',6,9);">Mr 6:9</a>; <a onClick="return mV(\'Eph\',6,15);">Eph 6:15</a>), "to bind under," sandalion, "sandal" (Judith 10:4; 16:9; <a onClick="return mV(\'Mar\',6,9);">Mr 6:9</a>; <a onClick="return mV(\'Act\',12,8);">Ac 12:8</a>); the King James Version, the Revised Version margin also have "shoe" for min\'al, "bar" (so the Revised Version (British and American) text) in <a onClick="return mV(\'Deu\',33,25);">De 33:25</a>; the "latchet" is either serokh, "twisted thing" (<a onClick="return mV(\'Gen\',14,23);">Ge 14:23</a>; <a onClick="return mV(\'Isa\',5,27);">Isa 5:27</a>), or himas, "leather thong" (<a onClick="return mV(\'Mar\',1,7);">Mr 1:7</a>; <a onClick="return mV(\'Luk\',3,16);">Lu 3:16</a>; <a onClick="return mV(\'Jhn\',1,27);">Joh 1:27</a>)): The na\'al was a simple piece of leather tied on the foot with the serokh, so easy of construction that its low cost was proverbial (<a onClick="return mV(\'Amo\',2,6);">Am 2:6</a>; <a onClick="return mV(\'Amo\',8,6);">8:6</a>; Sir 46:19; compare <a onClick="return mV(\'Gen\',14,23);">Ge 14:23</a>), and to be without it was a sign of extreme poverty (<a onClick="return mV(\'2Ch\',28,15);">2Ch 28:15</a>; <a onClick="return mV(\'Isa\',20,2);">Isa 20:2</a>). Women, however, might have ornamental sandals (<a onClick="return mV(\'Sgs\',7,1);">So 7:1</a>; Jdt 16:9), and Ezekiel names "sealskin" (<a onClick="return mV(\'Eze\',16,10);">16:10</a>) as a particularly luxurious material, but the omission of sandals from the list of <a onClick="return mV(\'Isa\',3,\'18-23\');">Isa 3:18-23</a> shows that they were not commonly made articles of great expense. The hupodema was likewise properly a sandal, but the word was also used to denote a shoe that covered the foot. The contrast between hupodema in <a onClick="return mV(\'Mat\',10,10);">Mt 10:10</a> and sandalion in <a onClick="return mV(\'Mar\',6,9);">Mr 6:9</a> seems to show that this meaning is not unknown in the New Testament, the "shoe" being regarded as an article of luxury (compare <a onClick="return mV(\'Luk\',15,22);">Lu 15:22</a>). But in <a onClick="return mV(\'Mat\',3,11);">Mt 3:11</a> and parallel\'s, only the sandal can be meant.<P>Sandals were not worn indoors, so that putting them on was a sign of readiness for activity (<a onClick="return mV(\'Exd\',12,11);">Ex 12:11</a>; <a onClick="return mV(\'Act\',12,8);">Ac 12:8</a>; <a onClick="return mV(\'Eph\',6,15);">Eph 6:15</a>), the more wealthy having them brought (<a onClick="return mV(\'Mat\',3,11);">Mt 3:11</a>) and fastened (<a onClick="return mV(\'Mar\',1,7);">Mr 1:7</a> and parallel\'s) by slaves. When one entered a house they were removed; all the more, naturally, on entering a sanctuary (<a onClick="return mV(\'Exd\',3,5);">Ex 3:5</a>; <a onClick="return mV(\'Jos\',5,15);">Jos 5:15</a>; <a onClick="return mV(\'Act\',7,33);">Ac 7:33</a>). Mourners, however, did not wear them even out of doors, as a sign of grief (<a onClick="return mV(\'Eze\',24,17,23);">Eze 24:17,23</a>), perhaps for the same reason that other duties of the toilet were neglected (<a onClick="return mV(\'2Sa\',12,20);">2Sa 12:20</a>, etc.). A single long journey wore out a pair of sandals (<a onClick="return mV(\'Jos\',9,5,13);">Jos 9:5,13</a>), and the preservation of "the latchet of their shoes" from being broken (<a onClick="return mV(\'Isa\',5,27);">Isa 5:27</a>) would require almost miraculous help.<P><a onClick="return mV(\'Rth\',4,7);">Ru 4:7</a>f states as a "custom in former times in Israel," that when any bargain was closed "a man drew off his shoe, and gave it to his neighbor." This was of course simply a special form of earnest-money, used in all transactions. In <a onClick="return mV(\'Deu\',25,9);">De 25:9</a>f the custom appears in a different light. If a man refused to perform his duty to his deceased brother\'s wife, the elders of the city were to remove his shoe and disgrace him publicly, "And his name shall be called in Israel, The house of him that hath his shoe loosed." The removal of the shoe is apparently connected with the rite in <a onClick="return mV(\'Rth\',4,7);">Ru 4:7</a> as a renunciation of the man\'s privilege. But the general custom seems to have become obsolete, for the removal of the shoe is now a reproach. The meaning of <a onClick="return mV(\'Psa\',60,8);">Ps 60:8</a> parallel <a onClick="return mV(\'Psa\',108,9);">108:9</a>, "Upon (margin "unto") Edom will I cast my shoe," is uncertain. \'al, may mean either "upon" or "unto." If the former, some (otherwise unsubstantiated) custom of asserting ownership of land may be meant. If the latter, the meaning is "Edom I will treat as a slave," to whom the shoes are cast on entering a house.``48';
isbe[8103]='Shoham`sho\'-ham (shoham, "onyx"; Codex Vaticanus Isoam; Codex Alexandrinus Issoam): One of the sons of Merari (<a onClick="return mV(\'1Ch\',24,27);">1Ch 24:27</a>).``1';
isbe[8104]='Shomer`sho\'-mer (shomer):<P>(1) The father of one of the conspirators who killed Joash (<a onClick="return mV(\'2Ki\',12,21);">2Ki 12:21</a>).<P>See <a href="./study/isbe/search.html?string=SHIMEATH">SHIMEATH</a>.<P>(2) One of the sons of Heber of the tribe of Asher (<a onClick="return mV(\'1Ch\',7,32);">1Ch 7:32</a>).<P>See <a href="./study/isbe/search.html?string=SHEMER">SHEMER</a>.``1';
isbe[8105]='Shophach`sho\'-fak.`<a href="./study/isbe/search.html?string=SHOBACH">SHOBACH</a>`1';
isbe[8106]='Shophan`sho\'-fan (shophan).`<a href="./study/isbe/search.html?string=ATROTH-SHOPHAN">ATROTH-SHOPHAN</a>`1';
isbe[8107]='Shore`shor:<P>(1) choph, always of the Mediterranean, variously translated "haven," "beach," "shore," "sea-shore," "coast," "sea coast" (<a onClick="return mV(\'Gen\',49,13);">Ge 49:13</a>; <a onClick="return mV(\'Deu\',1,7);">De 1:7</a>; <a onClick="return mV(\'Jos\',9,1);">Jos 9:1</a>; <a onClick="return mV(\'Jdg\',5,17);">Jud 5:17</a>; <a onClick="return mV(\'Jer\',47,7);">Jer 47:7</a>; <a onClick="return mV(\'Eze\',25,16);">Eze 25:16</a>).<P>(2) saphah, literally, "lip"; compare Arabic shafat, "lip"; of the sand upon the seashore, a figure of multitude (<a onClick="return mV(\'Gen\',22,17);">Ge 22:17</a>; <a onClick="return mV(\'Exd\',14,30);">Ex 14:30</a>; <a onClick="return mV(\'Jos\',11,4);">Jos 11:4</a>; <a onClick="return mV(\'Jdg\',7,12);">Jud 7:12</a>; <a onClick="return mV(\'1Sa\',13,5);">1Sa 13:5</a>; <a onClick="return mV(\'1Ki\',4,29);">1Ki 4:29</a>); the shore of the Red Sea or Gulf of \'Aqabah by Ezion-geber (<a onClick="return mV(\'1Ki\',9,26);">1Ki 9:26</a>; <a onClick="return mV(\'2Ch\',8,17);">2Ch 8:17</a>); the brink of the River Nile (<a onClick="return mV(\'Gen\',41,3,17);">Ge 41:3,17</a>); the edge (the King James Version "brink") of the valley of Arnon (<a onClick="return mV(\'Deu\',2,36);">De 2:36</a>).<P>(3) qatseh, literally, "end," "extremity," the uttermost part (the King James Version "shore") of the Salt Sea (<a onClick="return mV(\'Jos\',15,2);">Jos 15:2</a>); qetsh ha-\'arets, "the end of the earth" (<a onClick="return mV(\'Psa\',46,9);">Ps 46:9</a>); compare Arabic \'aqaci-l-\'ard, "the uttermost parts of the earth."<P>(4) cheilos, literally, "lip," "as the sand which is by the seashore" (<a onClick="return mV(\'Hbr\',11,12);">Heb 11:12</a>).<P>(5) aigialos, the beach (the King James Version "shore") of the Sea of Galilee (<a onClick="return mV(\'Mat\',13,2,48);">Mt 13:2,48</a>; <a onClick="return mV(\'Jhn\',21,4);">Joh 21:4</a>); of the Mediterranean (<a onClick="return mV(\'Act\',21,5);">Ac 21:5</a>; <a onClick="return mV(\'Act\',27,39,40);">27:39,40</a>).<P>(6) asson parelegonto ten Kreten, doubtful reading, "sailed along Crete, close in shore" (the King James Version "sailed along by Crete") (<a onClick="return mV(\'Act\',27,13);">Ac 27:13</a>).`<a href="./study/isbe/search.html?string=COAST">COAST</a>; <a href="./study/isbe/search.html?string=HAVEN">HAVEN</a>; <a href="./study/isbe/search.html?string=SAND">SAND</a>`37';
isbe[8108]='Shorten`shor\'-t\'-n: The Hebrew word qatsar and the Greek koloboo literally indicate abbreviation of time or space (<a onClick="return mV(\'Psa\',89,45);">Ps 89:45</a>; <a onClick="return mV(\'Pro\',10,27);">Pr 10:27</a>; <a onClick="return mV(\'Eze\',42,5);">Eze 42:5</a>); figuratively they point to limitation of power or of suffering (<a onClick="return mV(\'Num\',11,23);">Nu 11:23</a>; <a onClick="return mV(\'Isa\',50,2);">Isa 50:2</a>; <a onClick="return mV(\'Isa\',59,1);">59:1</a>; <a onClick="return mV(\'Mat\',24,22);">Mt 24:22</a>; <a onClick="return mV(\'Mar\',13,20);">Mr 13:20</a>).``1';
isbe[8109]='Shoshannim Eduth`sho-shan\'-im e\'-duth.`<a href="./study/isbe/search.html?string=SONG">SONG</a>; <a href="./study/isbe/search.html?string=PSALMS">PSALMS</a>`1';
isbe[8110]='Shoulder`shol\'-der (shekhem, katheph, zeroa\' or zerowa\', or zero\'ah, shoq; omos, brachion (Sirach 7:31 only)): The meanings of the Hebrew words are rather varied. The first (shekhem) has perhaps the widest application. It is used for the part of the body on which heavy loads are carried (<a onClick="return mV(\'Gen\',21,14);">Ge 21:14</a>; <a onClick="return mV(\'Gen\',24,15,45);">24:15,45</a>; <a onClick="return mV(\'Exd\',12,34);">Ex 12:34</a>; <a onClick="return mV(\'Jos\',4,5);">Jos 4:5</a>; <a onClick="return mV(\'Jdg\',9,48);">Jud 9:48</a>). King Saul\'s impressive personality is thus described: "There was not among the children of Israel a goodlier person than he: from his shoulders and upward he was higher than any of the people" (<a onClick="return mV(\'1Sa\',9,2);">1Sa 9:2</a>; <a onClick="return mV(\'1Sa\',10,23);">10:23</a>). To carry loads on the shoulder or to have "a staff on the shoulder" is expressive of subjection and servitude, yea, of oppression and cruel punishment, and the removal of such burdens or of the rod of the oppressor connotes delivery and freedom (<a onClick="return mV(\'Isa\',9,4);">Isa 9:4</a>; <a onClick="return mV(\'Isa\',14,25);">14:25</a>).<P>Figuratively:<P>The shoulders also bear responsibility and power. Thus it is said of King Messiah, that "the government shall be upon his shoulder" (<a onClick="return mV(\'Isa\',9,6);">Isa 9:6</a>) and "the key of the house of David will I lay upon his shoulder; and he shall open, and none shall shut; and he shall shut, and none shall open" (<a onClick="return mV(\'Isa\',22,22);">Isa 22:22</a>). Job declares that he will refute all accusations of unlawful conduct made against him, in the words: "Oh...that I had the indictment which mine adversary hath written! Surely I would carry it upon my shoulder" (<a onClick="return mV(\'Job\',31,35);">Job 31:35</a>f).<P>The Hebrew word katheph comes very close in meaning to the above, though it is occasionally used in the sense of arm-piece and shoulder-piece of a garment. Like Hebrew shekhem, it is used to describe the part of the body accustomed to carry loads. On it the Levites carried the implements of the sanctuary (<a onClick="return mV(\'Num\',7,9);">Nu 7:9</a>; <a onClick="return mV(\'1Ch\',15,15);">1Ch 15:15</a>; <a onClick="return mV(\'2Ch\',35,3);">2Ch 35:3</a>). Oriental mothers and fathers carried their children on the shoulder astride (<a onClick="return mV(\'Isa\',49,22);">Isa 49:22</a>; compare <a onClick="return mV(\'Isa\',60,4);">Isa 60:4</a>); thus also the little bundle of the poor is borne (<a onClick="return mV(\'Eze\',12,6,7,12);">Eze 12:6,7,12</a>). The loaded shoulder is likely to be "worn" or chafed under the burden (<a onClick="return mV(\'Eze\',29,18);">Eze 29:18</a>). In the two passages of the New Testament in which we find the Greek equivalent of shoulder (omos, fairly common in Apocrypha), it corresponds most closely with this use (<a onClick="return mV(\'Mat\',23,4);">Mt 23:4</a>; <a onClick="return mV(\'Luk\',15,5);">Lu 15:5</a>). Of the shoulders of animals the word katheph is used in <a onClick="return mV(\'Eze\',34,21);">Eze 34:21</a> (of sheep, where, however, men are intended) and in <a onClick="return mV(\'Isa\',30,6);">Isa 30:6</a> (of asses).<P>Stubborn opposition and unwillingness is expressed by "withdrew the shoulder" (<a onClick="return mV(\'Neh\',9,29);">Ne 9:29</a>), or "pulled away the shoulder" (<a onClick="return mV(\'Zec\',7,11);">Zec 7:11</a>), where the marginal rendering is "they gave (or "turned") a stubborn shoulder." Contrast "bow the shoulder," i.e. "submit" (Baruch 2:21). Compare "stiffnecked"; see <a href="./study/isbe/search.html?string=NECK">NECK</A>. Somewhat difficult for the understanding of Occidentals is the poetical passage in the blessing of Moses: "Of Benjamin he said, The beloved of Yahweh shall dwell in safety by him; he covereth him all the day long, and he dwelleth between his shoulders" (<a onClick="return mV(\'Deu\',33,12);">De 33:12</a>). The "shoulders" refer here to the mountain saddles and proclivities of the territory of Benjamin between which Jerusalem, the beloved of Yahweh, which belonged to Judah, lay nestling close upon the confines of the neighboring tribe, or even built in part on ground belonging to Benjamin.<P>Much less frequently than the above-mentioned words. we find zeroa\', zero\'ah, which is used of the "boiled shoulder of the ram" which was a wave offering at the consecration of a Nazirite (<a onClick="return mV(\'Num\',6,19);">Nu 6:19</a>) and of one of the priestly portions of the sacrifice (<a onClick="return mV(\'Deu\',18,3);">De 18:3</a>). In Sirach 7:31 this portion is called brachion, properly "arm," but both the King James Version and the Revised Version (British and American) translate "shoulder." Regarding the wave and heave offerings see <a href="./study/isbe/search.html?string=SACRIFICE">SACRIFICE</A>. the King James Version frequently translates Hebrew shoq, literally, "leg," "thigh" (which see) by "shoulder," which the Revised Version (British and American) occasionally retains in the margin (e.g. <a onClick="return mV(\'Num\',6,20);">Nu 6:20</a>).``106';
isbe[8111]='Shoulder-Blade`shol\'der-blad (shikhmah): "Then let my shoulder (kathephi) fall from the shoulder-blade (shikhmah), and mine arm (zeroa\' be broken from the bone (qaneh)" (<a onClick="return mV(\'Job\',31,22);">Job 31:22</a>). The Hebrew word is the feminine form of shekhem (see <a href="./study/isbe/search.html?string=SHOULDER">SHOULDER</a>). It is found only in this passage.``1';
isbe[8112]='Shoulder-Piece`shol\'-der-pes (katheph): The word designates the two straps or pieces of cloth which passed from the back of the ephod (see <a href="./study/isbe/search.html?string=EPHOD">EPHOD</a>) of the high priest over the shoulder and were fastened at the front. These shoulder-pieces seem to have been made of a precious texture of linen (or byssos) with threads of gold, blue, purple and scarlet, to which two onyx (or beryl) stones were attached bearing the names of six tribes of Israel each. These are called the "stones of memorial" (<a onClick="return mV(\'Exd\',39,18);">Ex 39:18</a>). On these straps there were also fastened the plaited or woven bands ("wreathed chains") from which, by means of two golden rings, the breastplate was suspended. It is by no means clear from the descriptions (<a onClick="return mV(\'Exd\',28,7,12,25);">Ex 28:7,12,25</a>; <a onClick="return mV(\'Exd\',39,4,7,18,20);">39:4,7,18,20</a>) how we have to imagine the form and attachment of these shoulder-pieces. It has been thought that the ephod might be of Egyptian origin, which is not very probable, though V. Ancessi, Annales de philosophie chretienne, 1872, 45ff, reproduces some representations from the great work of Lepsius, Denkmaler, where costly royal garments have two shoulder straps, like the ephod. Usually Egyptian garments have no shoulder strap, or at most one.``106';
isbe[8113]='Shovel`shuv\'-l:<P>(1) rachath, is a wooden shovel used on the threshing-floor for winnowing the grain (<a onClick="return mV(\'Isa\',30,24);">Isa 30:24</a>).<P>(2) ya\', is used in various passages to indicate some instrument employed to carry away ashes from the altar (<a onClick="return mV(\'Exd\',27,3);">Ex 27:3</a>; <a onClick="return mV(\'Exd\',38,3);">38:3</a>; <a onClick="return mV(\'Num\',4,14);">Nu 4:14</a>; <a onClick="return mV(\'1Ki\',7,40,45);">1Ki 7:40,45</a>; <a onClick="return mV(\'2Ki\',25,14);">2Ki 25:14</a>; <a onClick="return mV(\'2Ch\',4,11,16);">2Ch 4:11,16</a>; <a onClick="return mV(\'Jer\',52,18);">Jer 52:18</a>). It was very likely a small shovel like those used in connection with modern fireplaces for cleaning away the ashes (compare Hebrew ya\'ah, "to sweep away") or for carrying live coals to start a new fire.<P>(3) yathedh (<a onClick="return mV(\'Deu\',23,13);">De 23:13</a> the Revised Version margin)``133';
isbe[8114]='Show`sho.`<a href="./study/isbe/search.html?string=SHEW">SHEW</a>`1';
isbe[8115]='Showbread`sho\'-bred.`<a href="./study/isbe/search.html?string=SHEWBREAD">SHEWBREAD</a>`1';
isbe[8116]='Showbread, Table of``<a href="./study/isbe/search.html?string=SHEWBREAD,+TABLE+OF">SHEWBREAD, TABLE OF</a>`1';
isbe[8117]='Shower`shou\'-er:<P>(1) rebhibhim, a plural form apparently denoting gentle rain, usually used figuratively, as in <a onClick="return mV(\'Deu\',32,2);">De 32:2</a>; <a onClick="return mV(\'Psa\',72,6);">Ps 72:6</a>; <a onClick="return mV(\'Mic\',5,7);">Mic 5:7</a>.<P>(2) geshem, used of gentle rain in <a onClick="return mV(\'Job\',37,6);">Job 37:6</a>: "shower of rain," the King James Version "small rain"; used of the flood in <a onClick="return mV(\'Gen\',7,12);">Ge 7:12</a>. Figuratively, of blessing, "showers of blessing" (<a onClick="return mV(\'Eze\',34,26);">Eze 34:26</a>); of destruction: "There shall be an overflowing shower in mine anger, and great hailstones in wrath to consume it" (<a onClick="return mV(\'Eze\',13,13);">Eze 13:13</a>).<P>(3) zerem, usually storm or tempest (compare <a onClick="return mV(\'Isa\',4,6);">Isa 4:6</a>; <a onClick="return mV(\'Isa\',28,2);">28:2</a>): "They are wet with the showers of the mountain" (<a onClick="return mV(\'Job\',24,8);">Job 24:8</a>).<P>(4) ombros (<a onClick="return mV(\'Luk\',12,54);">Lu 12:54</a>), Rain is unknown in Palestine in the long summer of 5 or 6 months. A few showers usually fall in September, succeeded by fine weather for some weeks before the beginning of the heavy and long-continued winter rains.``37';
isbe[8118]='Shrine`shrin (naos): In <a onClick="return mV(\'Act\',19,24);">Ac 19:24</a> small models of temples for Diana.``1';
isbe[8119]='Shroud`shroud (choresh, "bough"): Winding-sheet for the dead. See <a href="./study/isbe/search.html?string=BURIAL">BURIAL</A>. Used in the King James Version, the English Revised Version <a onClick="return mV(\'Eze\',31,3);">Eze 31:3</a> in the rare old sense of "shelter," "covering." the American Standard Revised Version has "a forest-like shade" choresh, "wood," "wooded height") (<a onClick="return mV(\'Isa\',17,9);">Isa 17:9</a>, etc.). Compare Milton, Comus, 147.``1';
isbe[8120]='Shrub`shrub (siach (<a onClick="return mV(\'Gen\',21,15);">Ge 21:15</a>)).`<a href="./study/isbe/search.html?string=BUSH">BUSH</a>`1';
isbe[8121]='Shua; Shuah`shoo\'-a:<P>(1) (shua\' "prosperity"): A Canaanite whose daughter Judah took to wife (<a onClick="return mV(\'Gen\',38,2,12);">Ge 38:2,12</a>; <a onClick="return mV(\'1Ch\',2,3);">1Ch 2:3</a>).<P>See <a href="./study/isbe/search.html?string=BATHSHUA">BATHSHUA</a>.<P>(2) (shu\'-a”, "prosperity"): Daughter of Heber, an Asherite (<a onClick="return mV(\'1Ch\',7,32);">1Ch 7:32</a>).<P>(3) (shuach, "depression"): A son of Keturah by Abraham (<a onClick="return mV(\'Gen\',25,2);">Ge 25:2</a>; <a onClick="return mV(\'1Ch\',1,32);">1Ch 1:32</a>), and his posterity.<P>See <a href="./study/isbe/search.html?string=BILDAD">BILDAD</a>.<P>(4) A brother of Caleb (<a onClick="return mV(\'1Ch\',4,11);">1Ch 4:11</a>).<P>See <a href="./study/isbe/search.html?string=SHUHAH">SHUHAH</a>.``1';
isbe[8122]='Shual`shoo\'-al (shu\'al): An Asherite (<a onClick="return mV(\'1Ch\',7,36);">1Ch 7:36</a>).``1';
isbe[8123]='Shual, Land of`(\'erets shu\'al; he Sogal): From their encampment at Michmash the Philistines sent out marauding bands, one going westward toward Beth-horon, another eastward, "the way of the border that looketh down upon the valley of Zeboim." The pass to the south was held against them by Israel. The third party therefore went northward, turning "unto the way that leadeth to Ophrah, unto the land of Shual" (<a onClick="return mV(\'1Sa\',13,17);">1Sa 13:17</a>f). Ophrah is probably identical with et-taiyibeh, a village which lies some 5 miles east of Beitin (Bethel). It is in this district therefore that the land of Shual must be sought, but no definite identification is possible.``54';
isbe[8124]='Shubael`shoo\'ba-el, shoo-ba\'-el (shubha\'el):<P>(1) A Levite, son of Amram (<a onClick="return mV(\'1Ch\',24,20);">1Ch 24:20</a>); one of the leaders of song in the temple (<a onClick="return mV(\'1Ch\',25,20);">1Ch 25:20</a>).<P>See <a href="./study/isbe/search.html?string=SHEBUEL">SHEBUEL</a>; Gray, HPN, 310.<P>(2) A son of Heman (<a onClick="return mV(\'1Ch\',25,4);">1Ch 25:4</a>).<P>See <a href="./study/isbe/search.html?string=SHEBUEL">SHEBUEL</a>.``1';
isbe[8125]='Shuhah`shoo\'-ha (shuchah, "depression"): A brother of Caleb (<a onClick="return mV(\'1Ch\',4,11);">1Ch 4:11</a>).``1';
isbe[8126]='Shuham`shoo\'-ham (shucham): Son of Dan, ancestor of the Shuhamites (<a onClick="return mV(\'Num\',26,42);">Nu 26:42</a>f). In <a onClick="return mV(\'Gen\',46,23);">Ge 46:23</a> called "Hushim."``1';
isbe[8127]='Shuhite`shoo\'-hit (shuchi): Cognomen of Bildad, one of Job\'s friends (<a onClick="return mV(\'Job\',2,11);">Job 2:11</a>; <a onClick="return mV(\'Job\',8,1);">8:1</a>; <a onClick="return mV(\'Job\',18,1);">18:1</a>; <a onClick="return mV(\'Job\',25,1);">25:1</a>; <a onClick="return mV(\'Job\',42,9);">42:9</a>). The place referred to cannot be definitely located.`<a href="./study/isbe/search.html?string=BILDAD">BILDAD</a>; <a href="./study/isbe/search.html?string=SHUAH">SHUAH</a>`1';

isbe[8129]='Shumathites`shoo\'-math-its (shumathi): One of the families of Kiriath-jearim (<a onClick="return mV(\'1Ch\',2,53);">1Ch 2:53</a>).``1';
isbe[8130]='Shunammite`shoo\'-na-mit (shunammith, shunammith; Codex Vaticanus Somaneitis; Codex Alexandrinus Soumanites): Applied to natives of Shunem.<P>(1) Abishag, who was brought to minister to the aged king David, love for whom led Adonijah to his doom (<a onClick="return mV(\'1Ki\',1,3,15);">1Ki 1:3,15</a>; <a onClick="return mV(\'1Ki\',2,17);">2:17</a>, etc.).<P>(2) The woman, name unknown, whose son Elisha raised from the dead (<a onClick="return mV(\'2Ki\',4,12);">2Ki 4:12</a>, etc.). Later when apparently she had become a widow, after seven years\' absence on account of famine, in the land of the Philistines, she returned to find her property in the hands of others. Elisha\'s intervention secured its restoration (<a onClick="return mV(\'2Ki\',8,\'1-6\');">2Ki 8:1-6</a>).<P>(3) The Shulammite (<a onClick="return mV(\'Sgs\',6,13);">So 6:13</a>). In this name there is the exchange of "l" for "n" which is common.``54';
isbe[8131]='Shunem`shoo\'-nem (shunem; Codex Vaticanus Sounan; Codex Alexandrinus Sounam): A town in the territory of Issachar named with Jezreel and Chesulloth (<a onClick="return mV(\'Jos\',19,18);">Jos 19:18</a>). Before the battle of Gilboa the Philistines pitched their camp here. They and the army of Saul, stationed on Gilboa, were in full view of each other (<a onClick="return mV(\'1Sa\',28,4);">1Sa 28:4</a>). It was the scene of the touching story recorded in <a onClick="return mV(\'2Ki\',4,\'8-37\');">2Ki 4:8-37</a>, in which the prophet Elisha raises to life the son of his Shunammite benefactress. Eusebius (Onomasticon) describes it as a village called Sulem, 5 Roman miles south of Mt. Tabor. This points to the modern Solam, a village surrounded by cactus hedges and orchards on the lower southwestern slope of Jebel ed-Duchy ("Hill of Moreh"). It commands an uninterrupted view across the plain of Esdraelon to Mt. Carmel, which is about 15 miles distant. It also looks far across the valley of Jezreel to the slopes of Gilboa on the south. It therefore meets satisfactorily the conditions of Joshua and 1 Samuel. A question has, however, been raised as to its identity with the Shunem of <a onClick="return mV(\'2Ki\',4,\'1-\');">2Ki 4</a>. Elisha\'s home was in Samaria. Apparently Carmel was one of his favorite haunts. If he passed Shunem "continually" (<a onClick="return mV(\'2Ki\',4,9);">2Ki 4:9</a>), going to and coming from the mountain, it involved a very long detour if this were the village visited. It would seem more natural to identify the Shunem of Elisha with the Sanim of Eusebius, Onomasticon, which is said to be in the territory of Sebaste (Samaria), in the region of Akrabatta: or perhaps with Salim, fully a mile north of Taanach, as nearer the line of travel between Samaria and Carmel.<P>There is, however, nothing to show that Elisha\'s visits to Shunem were paid on his journeys between Samaria and Carmel. It may have been his custom to visit certain cities on circuit, on business calling for his personal attention, e.g. in connection with the "schools of the prophets." Materials do not exist on which any certain conclusion can rest. Both Solam Salim are on the edge of the splendid grain fields of Esdraelon (<a onClick="return mV(\'2Ki\',4,18);">2Ki 4:18</a>).``54';

isbe[8133]='Shupham; Shuphamites`shoo\'-fam, shoo\'-fam-its.`<a href="./study/isbe/search.html?string=SHEPHUPHAM">SHEPHUPHAM</a>`1';
isbe[8134]='Shuppim`shup\'-im (shuppim):<P>(1) One of the descendants of Benjamin (<a onClick="return mV(\'1Ch\',7,12,15);">1Ch 7:12,15</a>).<P>(2) One of the porters in the temple (<a onClick="return mV(\'1Ch\',26,16);">1Ch 26:16</a>).`<a href="./study/isbe/search.html?string=MUPPIM">MUPPIM</a>; <a href="./study/isbe/search.html?string=SHEPHUPHAM">SHEPHUPHAM</a>`1';
isbe[8135]='Shur`shur, shoor (shur; Sour): The name of a desert east of the Gulf of Suez. The word means a "wall," and may probably refer to the mountain wall of the Tih plateau as visible from the shore plains. In <a onClick="return mV(\'Gen\',16,7);">Ge 16:7</a> Hagar at Kadesh (\'Ain Qadis) (see <a onClick="return mV(\'Gen\',16,14);">16:14</a>) is said to have been "in the way to Shur." Abraham also lived "between Kadesh and Shur" (<a onClick="return mV(\'Gen\',20,1);">Ge 20:1</a>). The position of Shur is defined (<a onClick="return mV(\'Gen\',25,18);">Ge 25:18</a>) as being "opposite Egypt on the way to Assyria." After crossing the Red Sea (<a onClick="return mV(\'Exd\',15,4);">Ex 15:4</a>) the Hebrews entered the desert of Shur (<a onClick="return mV(\'Exd\',15,22);">Ex 15:22</a>), which extended southward a distance of three days\' journey. It is again noticed (<a onClick="return mV(\'1Sa\',15,7);">1Sa 15:7</a>) as being opposite Egypt, and (<a onClick="return mV(\'1Sa\',27,8);">1Sa 27:8</a>) as near Egypt. There is thus no doubt of its situation, on the east of the Red Sea, and of the Bitter Lakes.<P>Brugsch, however, proposed to regard Shur ("the wall") as equivalent to the Egyptian anbu ("wall"), the name of a fortification of some kind apparently near Kantarah (see <a href="./study/isbe/search.html?string=MIGDOL">MIGDOL (2)</A>), probably barring the entrance to Egypt on the road from Pelusium to Zoan. The extent of this "wall" is unknown, but Brugsch connects it with the wall mentioned by Diodorus Siculus (i.4) who wrote about 8 BC, and who attributed it to Sesostris (probably Rameses II) who defended "the east side of Egypt against the irruptions of the Syrians and Arabians, by a wall drawn from Pelusium through the deserts as far as to Heliopolis, for a space of 1,500 furlongs." Heliopolis lies 90 miles (not 188) southwest of Pelusium: this wall, if it existed at all, would have run on the edge of the desert which extends north of Wady Tumeilat from Kantarah to Tell el-Kebir; but this line, on the borders of Goshen, is evidently much too far west to have any connection with the desert of Shur east of the Gulf of Suez. See Budge, Hist. Egypt, 90; Brugsch, Egypt under the Pharaohs, abridged edition, 320.``28';
isbe[8136]='Shushan`shoo\'-shan (shushan; Sousan, Sousa):<P>1. Position, Eytmology and Forms of Its Name:<P>This city, the Susu or Susan of the Babylonians, and the native (Elamite) Susun, is the modern Shush (Sus) in Southwestern Persia, a series of ruin-mounds on the banks of the river Kerkha. The ancient etymologies ("city of lilies" or "of horses") are probably worthless, as an etymology in the language of the place would rather be expected. Sayce therefore connects the name with sassa, meaning "former," and pointing to some such meaning as "the old" city. It is frequently mentioned in the Babylonian inscriptions of the 3rd millennium BC, and is expressed by the characters for the goddess Ishtar and for "cedar," implying that it was regarded as the place of the "divine grove" (see 5, below). In later days, the Assyrians substituted for the second character, that having the value of ses, possibly indicating its pronunciation. Radau (Early Babylonian History, 236) identifies Shushan (Susa) with the Sasa of the Babylonian king Kuri-galzu (14th century BC, if the first of the name), who dedicates to the Babylonian goddess Ninlil an inscription of a certain Siatu, who had, at an earlier date, dedicated it to Ishtar for the life of the Babylonian king Dungi (circa 2500 BC).<P>2. The Ruins:<P>The surface still covered with ruins is about 2,000 hectares (4,940 acres), though this is but a fraction compared with the ancient extent of the city, which is estimated to have been between 12,000 and 15,000 hectares (29,640-37,000 acres). Though considerable, the extent of Susa was small compared with Nineveh and Babylon. The ruins are divided by the French explorers into four tracts:<P>(1) The Citadel-mound (west), of the Achemenian period (5th century BC), circa 1,476 by 820 ft., dominating the plain (height circa 124 ft.).<P>(2) The Royal City on the east of the Citadel, composed of two parts: the Apadana (Northeast), and a nearly triangular tract extending to the east and the south. This contains the remains of the palace of Darius and his successors, and occupies rather more than 123 acres. The palace proper and the throne-room were separated from the rest of the official buildings.<P>(3) The City, occupied by artisans, merchants, etc.<P>(4) The district on the right bank, similarly inhabited. This in ancient times extended into all the lower plain, between the Shaour and the Kerkha. Besides these, there were many isolated ruins, and the suburbs contained a number of villages and separate constructions.<P>3. The "Royal City," "The Citadel," and the Ruins Therein:<P>Most of the constructions at Susa are of the Persian period. In the northern part of the Royal City lie the remains of the Apadana, the only great monument of which remains were found on the level. The principal portion consisted of a great hall of columns, known as the throne-room of Artaxeres Mnemon. It replaced an earlier structure by Darius, which was destroyed by fire in the time of Artaxerxes I. The columns apparently had capitals of the style common in Persia—the foreparts of two bulls kneeling back to back. In the Citadel a palace built by Xerxes seems to have existed, the base of one of his columns having been found there. Bricks bearing the inscriptions of early Elamite kings, and the foundations of older walls, testify to the antiquity of the occupation of this part. According to the explorers, this was the portion of the city reserved for the temples.<P>4. The Monuments Discovered:<P>The number of important antiquities found on the site is considerable. Among the finds may be mentioned the triumphal stele of Naram-Sin, king of Agade (3rd-4th millennium BC); the statuettes of the Babylonian king Dungi (circa 2360 BC); the reliefs and inscriptions of the Elamite king Ba(?)-sa-Susinak (circa 2340 BC); the obelisk inscribed with the laws of Hammurabi of Babylon; the bronze bas-relief of the Elamite king Sutruk-Nahhunte (circa 1120 BC), who carried off from Babylonia the stelae of Naram-Sin and Hammurabi above mentioned, together with numerous other Babylonian monuments; the stele of Adda-hamiti-In-Susnak, of a much later date, together with numerous other objects of art and inscriptions—a most precious archaeological find.<P>5. Assur-bani-apli\'s Description of the City:<P>Shushan passed through many serious crises, one of the severest being its capture and destruction by the armies of the Assyrian king Assur-bani-apli about 640 BC. According to his account, the ziqqurat or temple-tower of Susa was built of enameled brick imitating lapis-lazuli, and was adorned with pinnacles of bright bronze. The god of the city was Susinak, who dwelt in a secret place, and none ever saw the form of his divinity. Lagamaru (Laomer) and five other of the city\'s deities were adored only by kings, and their images, with those of 12 more (worshipped by the people), were carried off as spoil to Assyria. Winged bulls and genii adorned Susa\'s temples, and figures of wild bulls protected the entrances to their shrines. Other noteworthy things were the sacred groves into which no stranger was allowed to enter, and the burial-places of the Elamite kings. After recovering from the blow inflicted by the Assyrians, Shushan ultimately regained its old importance, and, as the summer residence of the Persian kings, became<P>the home of Ahasuerus and Queen Esther (<a onClick="return mV(\'Neh\',1,1);">Ne 1:1</a>; <a onClick="return mV(\'Est\',1,2,5);">Es 1:2,5</a>; <a onClick="return mV(\'Est\',2,3);">2:3</a>; <a onClick="return mV(\'Est\',3,15);">3:15</a>; <a onClick="return mV(\'Est\',9,11);">9:11</a>ff; <a onClick="return mV(\'Dan\',8,2);">Da 8:2</a>; Additions to <span class="noTag">Esther 11:3</span>).<P>LITERATURE.<P>See Perrot et Chipiez, Histoire de l\'art dans l\'antiquite, volume V, Perse, 1890; de Morgan, Delegation en Perse (Memoires),1900,etc.; Histoire et travaux de la delegation en Perse, 1905; article "Elamites" in Hastings ERE; article <a href="./study/isbe/search.html?string=ELAM">ELAM</a> in this work.``136';
