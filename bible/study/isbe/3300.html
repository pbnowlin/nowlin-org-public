isbe[3358]='Fall`fol (vb.): The idea of falling is most frequently expressed in Hebrew by naphal, but also by many other words; in Greek by pipto, and its compounds. The uses of the word in Scripture are very varied. There is the literal falling by descent; the falling of the countenance in sorrow, shame, anger, etc. (<a onClick="return mV(\'Gen\',4,5,6);">Ge 4:5-6</a>); the falling in battle (<a onClick="return mV(\'Gen\',14,10);">Ge 14:10</a>; <a onClick="return mV(\'Num\',14,3);">Nu 14:3</a>, etc.); the falling into trouble, etc. (<a onClick="return mV(\'Pro\',24,16,17);">Pr 24:16-17</a>); prostration in supplication and reverence (<a onClick="return mV(\'Gen\',17,3);">Ge 17:3</a>; <a onClick="return mV(\'Num\',14,5);">Nu 14:5</a>, etc.); falling of the Spirit of Yahweh (<a onClick="return mV(\'Eze\',11,5);">Eze 11:5</a>; compare <a onClick="return mV(\'Eze\',3,24);">3:24</a>; <a onClick="return mV(\'Eze\',8,1);">8:1</a>); of apostasy (<a onClick="return mV(\'2Th\',2,3);">2Th 2:3</a>; <a onClick="return mV(\'Hbr\',6,6);">Heb 6:6</a>; <a onClick="return mV(\'Jud\',1,24);">Jude 1:24</a>), etc. the Revised Version (British and American) frequently changes "fall" of the King James Version into other words or phrases, as "stumble" (<a onClick="return mV(\'Lev\',26,37);">Le 26:37</a>; <a onClick="return mV(\'Psa\',64,8);">Ps 64:8</a>; <a onClick="return mV(\'2Pe\',1,10);">2Pe 1:10</a>, etc.), "fade" (<a onClick="return mV(\'Isa\',33,4);">Isa 33:4</a>), etc.; in <a onClick="return mV(\'Act\',27,\'1-\');">Ac 27</a>, the Revised Version (British and American) reads "be cast ashore on rocky ground" for "have fallen upon rocks" (<a onClick="return mV(\'Act\',27,29);">Ac 27:29</a>), "perish" for "fall" (<a onClick="return mV(\'Act\',27,34);">Ac 27:34</a>), "lighting upon" for "falling into" (<a onClick="return mV(\'Act\',27,41);">Ac 27:41</a>).``185';
isbe[3359]='Fall, the`fol:<P>1. Meaning of <span class="noTag">Genesis 3</span><P>2. <span class="noTag">Genesis 3</span> in the Old and New Testaments<P>3. The Fall and the Theory of Evolution<P>4. The Character of the Fall<hr /><P>The question concerning the origin, the age and the written record of the history of the Fall in <a onClick="return mV(\'Gen\',3,\'1-\');">Ge 3</a> need not be discussed here. For in the first place, science can never reach to the oldest origins and the ultimate destinies of humanity, and historical and critical inquiry will never be able to prove either the veracity or the unveracity of this history. And in the second place, exactly as it now lies before us, this history has already formed for centuries a portion of holy Scripture, an indispensable element in the organism of the revelation of salvation, and as such has been accepted in faith by the Hebrew congregation (Jewish people), by Christ, by the apostles, and by the whole Christian church.<P>1. Meaning of <span class="noTag">Genesis 3</span>:<P>That <a onClick="return mV(\'Gen\',3,\'1-\');">Ge 3</a> gives us an account of the fall of man, of the loss of his primitive innocence and of the misery, particularly death, to which he has since been subjected, cannot reasonably be denied. The opinion of the Ophites, Kant, Schiller, Hegel, etc., that <a onClick="return mV(\'Gen\',3,\'1-\');">Ge 3</a> relates the awakening of man to self-consciousness and personality (see <a href="./study/isbe/search.html?string=ADAM+IN+THE+OLD+TESTAMENT">ADAM IN THE OLD TESTAMENT</a>), and therefore does not tell us of a fall, but a marked progression, is disputed by the name which the forbidden tree bears, as indicating to man not merely a tree of knowledge in the ordinary way, but quite specially a tree of knowledge of good and evil.<P><a onClick="return mV(\'Gen\',3,\'1-\');">Ge 3</a> is not in the least meant to relate to us how man obtained the idea of his nakedness and sexual passions, and from a state of childlike innocence changed in this respect to manlike maturity (Eerdman\'s De Beteekenis van het Paradijsverhaal, Theologisch Tijdschrift,1905,485-511). For according to Genesis, man was created full-grown, received a wife immediately as helpmeet, and at the same time saw himself allotted the task of multiplying and replenishing the earth. Moreover, the idea that sexual desire is something sinful and deserves punishment was entirely foreign to ancient Israel.<P>Finally, the interpretation of Wellhausen (Geschichte Israels,1878,344) cannot be accepted, that man in <a onClick="return mV(\'Gen\',3,\'1-\');">Ge 3</a> should obtain "die intellektuelle Welterkenntniss, die metaphysische Erkenntniss der Dinge in ihrem Zusammenhange, ihrem Werth oder Unwerth, ihrem Nutzen oder Schaden" ("the intellectual knowledge of the world, the metaphysical knowledge of things in their connection, their worth or unworth, their utility or hurtfulness"). For in the first place, according to Genesis, this was man\'s peculiar province from the beginning; he received indeed the vocation to subdue the earth, to keep and till the ground, to give the animals their names. And in the second place, the acquiring of this knowledge among the Israelites, who esteemed practical wisdom so highly, is difficult to represent as a fall, or as a punishment deserved for disobedience.<P>There is no other explanation possible of <a onClick="return mV(\'Gen\',3,\'1-\');">Ge 3</a> than that it is the narration of a fall, which consists in the transgression of an explicit command of God, thus bearing a moral significance, and therefore followed by repentance, shame, fear and punishment. The context of the chapter places this interpretation beyond all doubt, for before his fall man is represented as a creature made after God\'s image and receiving paradise as a dwelling-place, and after the fall he is sent into a rough world, is condemned to a life of labor and sorrow, and increases more and more in sin until the judgment of the Flood.<P>2. <span class="noTag">Genesis 3</span> in the Old and the New Testaments:<P>It is indeed remarkable how very seldom the Old Testament refers to this history of the Fall. This is not a sufficient reason for pronouncing it of later origin, for the same peculiarity presents itself at the time when, according to all criticism, it was recorded in literature. Prophets, Psalms, Proverbs never quote it; at the most, allusions may be found to it in <a onClick="return mV(\'Hsa\',6,7);">Ho 6:7</a> and <a onClick="return mV(\'Ecc\',7,29);">Ec 7:29</a>; and even Jesus and His apostles in the New Testament very seldom appeal to <a onClick="return mV(\'Gen\',3,\'1-\');">Ge 3</a> (<a onClick="return mV(\'Jhn\',8,44);">Joh 8:44</a>; <a onClick="return mV(\'Rom\',5,12);">Ro 5:12</a>; <a onClick="return mV(\'1Cr\',15,22);">1Co 15:22</a>; <a onClick="return mV(\'2Cr\',11,3);">2Co 11:3</a>; <a onClick="return mV(\'1Ti\',2,14);">1Ti 2:14</a>). But it may be considered that the Prophets, Psalms and Proverbs only mention special facts of the past by way of exception, that the apostles even hardly ever quote the words and deeds of Jesus, and that all lived at a time when revelation itself was still proceeding and did not lie before them as a complete whole. With us it is quite a different matter; we are in a certain sense outside revelation, make it a subject of our study and meditation, try to discover the unity which holds all its parts together, and devote our special interest to Adam as a figure and counterpart of Christ. The creation and fall of man occupy therefore a much broader place in the province of our thoughts than they did among the writers of the books of the Old and New Testaments.<P>Nevertheless, the Fall is the silent hypothesis of the whole Biblical doctrine of sin and redemption; it does not rest only on a few vague passages, but forms an indispensable element in the revelation of salvation. The whole contemplation of man and humanity, of Nature and history, of ethical and physical evil, of redemption and the way in which to obtain it, is connected in Scripture with a Fall, such as <a onClick="return mV(\'Gen\',3,\'1-\');">Ge 3</a> relates to us. Sin, for example, is common to all men (<a onClick="return mV(\'1Ki\',8,46);">1Ki 8:46</a>; <a onClick="return mV(\'Psa\',14,3);">Ps 14:3</a>; <a onClick="return mV(\'Psa\',130,3);">130:3</a>; <a onClick="return mV(\'Psa\',143,2);">143:2</a>), and to every man from his conception (<a onClick="return mV(\'Gen\',6,5);">Ge 6:5</a>; <a onClick="return mV(\'Gen\',8,21);">8:21</a>; <a onClick="return mV(\'Job\',14,4);">Job 14:4</a>; <a onClick="return mV(\'Psa\',51,7);">Ps 51:7</a>). It arouses God\'s anger and deserves all kinds of punishment, not only of an ethical but of a physical nature (<a onClick="return mV(\'Gen\',3,\'14-19\');">Ge 3:14-19</a>; <a onClick="return mV(\'Gen\',4,14);">4:14</a>; <a onClick="return mV(\'Gen\',6,7,13);">6:7,13</a>; <a onClick="return mV(\'Gen\',11,8);">11:8</a>; <a onClick="return mV(\'Lev\',26,14);">Le 26:14</a>f; <a onClick="return mV(\'Deu\',28,15);">De 28:15</a>; <a onClick="return mV(\'Psa\',90,7);">Ps 90:7</a>, etc.); the whole of Scripture proceeds from the thought that sin and death are connected in the closest degree, as are also obedience and life. In the new heaven and new earth all suffering ceases with sin (<a onClick="return mV(\'Rev\',21,4);">Re 21:4</a>). Therefore redemption is possible only in the way of forgiveness (<a onClick="return mV(\'Psa\',32,1);">Ps 32:1</a>; <a onClick="return mV(\'Isa\',43,25);">Isa 43:25</a>, etc.), and circumcision of the heart (<a onClick="return mV(\'Deu\',10,16);">De 10:16</a>; <a onClick="return mV(\'Deu\',30,16);">30:16</a>; <a onClick="return mV(\'Jer\',4,4);">Jer 4:4</a>), and this includes, further, life, joy, peace, salvation. When Paul in <a onClick="return mV(\'Rom\',5,12);">Ro 5:12</a>; <a onClick="return mV(\'1Cr\',15,22);">1Co 15:22</a> indicates Adam as the origin of sin and death, and Christ as the source of righteousness and life, he develops no ideas which are contrary to the organism of revelation or which might be neglected without loss; he merely combines and formulates the data which are explicitly or silently contained in it.<P>3. The Fall and the Theory of Evolution:<P>Tradition does little toward the confirmation and elucidation of the Biblical narrative of the Fall. The study of mythology is still too little advanced to determine the ideal or historical value which may be contained in the legend of a Golden Age, in many people\'s obsequious honoring of the serpent, in the equally widespread belief in a tree of life. The Babylonian representation also (a seal on which a man and woman, seated, are figured as plucking fruit from a tree, while a serpent curls up behind the woman as if whispering in her ear), which G. Smith, Lenormant and Friedrich Delitzsch compare with the Paradise narrative, shows no similarity on nearer view (A. Jeremias, Das Altes Testament im Lichte des alten Orients2, Leipzig,1906,203). Indirectly, however, a very powerful witness for the fall of man is furnished by the whole empirical condition of the world and humanity. For a world, such as we know it, full of unrighteousness and sorrow, cannot be explained without the acceptance of such a fact. He who holds fast to the witness of Scripture and conscience to sin as sin (as anomia) cannot deduce it from creation, but must accept the conclusion that it began with a transgression of God\'s command and thus with a deed of the will. Pythagoras, Plato, Kant, Schelling, Baader have all understood and acknowledged this with more or less clearness. He who denies the Fall must explain sin as a necessity which has its origin in the Creation, in the nature of things, and therefore in God Himself; he justifies man but accuses God, misrepresents the character of sin and makes it everlasting and indefeasible. For if there has not been a fall into sin, there is no redemption of sin possible; sin then loses its merely ethical significance, becomes a trait of the nature of man, and is inexterminable.<P>This comes out, in later years, in the many endeavors to unite the Fall with the doctrine of evolution (compare Tennant, The Origin and Propagation of Sin2, 1905; A. S. Peake, Christianity: Its Nature and Its Truth, 1908; W. E. Orchard, Modern Theories of Sin, 1909; Francis J. Hall, Evolution and the Fall, 1910). All these endeavors lead to setting on one side the objective standard of sin, which is the law of God, and determining the nature and importance of sin subjectively by the feeling of guilt, which in its turn again depends on the knowledge of and the love for the moral ideal, and itself forms an important factor in moral progress. It is true that the strength of all these endeavors is drawn from theory of the descent of man from the animal. But as to this theory, it is worthy of notice:<P>(1) that it is up to the present day a hypothesis, and is proved by no single observation, whether direct or indirect;<P>(2) that the fossils of prehistoric men, found in Germany, Belgium, France and elsewhere have demonstrated the low degree of culture in which these men have lived, but in no sense their dissimilarity with mankind of today (W. Branca, Der Stand unserer Kenntnisse vom fossilen Menschen, Leipzig, 1910);<P>(3) that the uncivilized and prehistoric man may be as little identified with the first man as the unjustly so-called nature-people and children under age;<P>(4) that the oldest history of the human race, which has become known through the discoveries at Babylon in the last century, was not that of a state of barbarism, but of high and rich culture (D. Gath Whitley, "What was the Primitive Condition of Man?" Princeton Theol. Review, October, 1906; J. Orr, God\'s Image in Man, 1906);<P>(5) that the acceptance of theory of descent as a universal and unlimited rule leads to the denial of the unity of the human race, in a physical and also in an intellectual, moral and religious sense. For it may be possible, even in the school of Darwin, to maintain the unity of the human race so long a time as tradition exercises its influence on the habit of mind; but theory itself undermines its foundation and marks it as an arbitrary opinion. From the standpoint of evolution, there is not only no reason to hold to the "of one blood" of <a onClick="return mV(\'Act\',17,26);">Ac 17:26</a> the King James Version, but there has never even been a first man; the transition from animal to man was so slow and successive, that the essential distinction fails to be seen. And with the effacing of this boundary, the unity of the moral ideal, of religion, of the laws of thought and of truth, fails also; theory of evolution expels the absolute everywhere and leads necessarily to psychologism, relativism, pragmatism and even to pluralism, which is literally polytheism in a religious sense. The unity of the human race, on the other hand, as it is taught in holy Scripture, is not an indifferent physical question, but an important intellectual, moral and religious one; it is a "postulate" of the whole history of civilization, and expressly or silently accepted by nearly all historians. And conscience bears witness to it, in so far as all men show the work of the moral law written in their hearts, and their thoughts accuse or excuse one another (<a onClick="return mV(\'Rom\',2,15);">Ro 2:15</a>); it shows back to the Fall as an "Urthatsache der Geschichte."<P>4. The Character of the Fall:<P>What the condition and history of the human race could hardly lead us to imagine, holy Scripture relates to us as a tragic fact in its first pages. The first man was created by God after His own image, not therefore in brutish unconsciousness or childlike naivete, but in a state of bodily and spiritual maturity, with understanding and reason, with knowledge and speech, with knowledge especially of God and His law. Then was given to him moreover a command not to eat of the tree of knowledge of good and evil. This command was not contained in the moral law as such; it was not a natural but a positive commandment; it rested entirely and only on God\'s will and must be obeyed exclusively for this reason. It placed before man the choice, whether he would be faithful and obedient to God\'s word and would leave to Him alone the decision as to what is good or evil, or whether he would reserve to himself the right arbitrarily to decide what is good or evil. Thus the question was: Shall theonomy or autonomy be the way to happiness? On this account also the tree was called the tree of knowledge of good and evil. It did not bear this name in the sense that man might obtain from it the empirical knowledge of good and evil, for by his transgression he in truth lost the empirical knowledge of good. But the tree was so named, because man, by eating of it and so transgressing God\'s commandment, arrogated to himself "die Fahigkeit zur selbstandigen Wahl der Mittel, durch die man sein Gluck schaffen will": "the capacity of independent choice of the means by which he would attain his happiness" (Koberle, Sunde und Gnade im relig. Leben des Volkes Israel bis auf Christenrum,1905,64). Theonomy, as obedience to God from free love, includes as such the idea and the possibility of autonomy, therefore that of antinomy also.<P>But it is the free act and therefore the guilt of man that has changed the possibility into reality. For the mind, there remains here an insoluble problem, as much in the question, why God allowed this Fall to take place, as in the other, how man, created in the likeness of God, could and did fall. There is a great deal of truth in the often-expressed thought, that we can give no account of the origin of sin, because it is not logical, and does not result as a conclusion drawn from two premises. But facts are brutal. What seems logically impossible often exists in reality. The laws of moral life are different from those of thought and from those also of mechanical nature. The narrative in <a onClick="return mV(\'Gen\',3,\'1-\');">Ge 3</a>, in any case, is psychologically faithful in the highest degree. For the same way as it appears there in the first man, it repeatedly takes place among ourselves (<a onClick="return mV(\'Jam\',1,14,15);">Jas 1:14-15</a>). Furthermore we ought to allow God to justify Himself. The course of revelation discovers to faith how, through all the ages, He holds sin in its entire development in His own almighty hands, and works through grace for a consummation in which, in the dispensation of the fullness of times, He will gather together in one all things in Christ (<a onClick="return mV(\'Eph\',1,10);">Eph 1:10</a>). (J. Orr, Sin as a Problem of Today, London, 1910.)``10';

isbe[3361]='Fallow`fal\'-o (damam): Damam is translated only once in the sense of "fallow" (<a onClick="return mV(\'Exd\',23,11);">Ex 23:11</a>). The law required that the Israelites allow their ground to lie fallow one year in, seven. the King James Version is (<a onClick="return mV(\'Deu\',14,5);">De 14:5</a>) nir, and is translated "fallow" in its more obsolete sense of "tilled ground" in the King James Version (<a onClick="return mV(\'Jer\',4,3);">Jer 4:3</a>; <a onClick="return mV(\'Hsa\',10,12);">Ho 10:12</a>).``1';

isbe[3366]='Fame`fam (shem, shema\'; akoe, pheme): "Fame" has the twofold meaning, (1) of report or rumor, (2) of renown or reputation (in the Old Testament it is not always easy to distinguish the two senses). "Fame," shema\', "fame," "rumor," "reports" (<a onClick="return mV(\'Num\',14,15);">Nu 14:15</a>; <a onClick="return mV(\'Job\',28,22);">Job 28:22</a>, the Revised Version (British and American) "rumor") probably means "report"; but in <a onClick="return mV(\'1Ki\',10,1);">1Ki 10:1</a>; <a onClick="return mV(\'2Ch\',9,1);">2Ch 9:1</a>; <a onClick="return mV(\'Isa\',66,19);">Isa 66:19</a>, it is most probably "renown," or "reputation"; shemu\'ah (<a onClick="return mV(\'1Ki\',10,7);">1Ki 10:7</a>; <a onClick="return mV(\'2Ch\',9,6);">2Ch 9:6</a>) may have either meaning; shoma\' (<a onClick="return mV(\'Jos\',6,27);">Jos 6:27</a>; <a onClick="return mV(\'Jos\',9,9);">9:9</a>; <a onClick="return mV(\'Est\',9,4);">Es 9:4</a>) seems to mean "fame" in the sense of reputation; but in <a onClick="return mV(\'Jer\',6,24);">Jer 6:24</a> (as the American Standard Revised Version) "report"; shem, "name," has the sense of reputation (<a onClick="return mV(\'1Ki\',4,31);">1Ki 4:31</a>; <a onClick="return mV(\'1Ch\',14,17);">1Ch 14:17</a>; <a onClick="return mV(\'1Ch\',22,5);">22:5</a>; <a onClick="return mV(\'Zep\',3,19);">Ze 3:19</a>, the Revised Version (British and American) "name"); qol, "voice," is report (<a onClick="return mV(\'Gen\',45,16);">Ge 45:16</a>, the American Standard Revised Version "report"). In the New Testament akoe, "hearing," is "report," so the Revised Version (British and American) (<a onClick="return mV(\'Mat\',4,24);">Mt 4:24</a>; <a onClick="return mV(\'Mat\',14,1);">14:1</a>; <a onClick="return mV(\'Mar\',1,28);">Mr 1:28</a>); pheme, "word," "rumor," is report, fame in this sense (<a onClick="return mV(\'Mat\',9,26);">Mt 9:26</a>; <a onClick="return mV(\'Luk\',4,14);">Lu 4:14</a>); echos, "a sound," "noise" (<a onClick="return mV(\'Luk\',4,37);">Lu 4:37</a>, the Revised Version (British and American) "rumor"), and logos, "word" (<a onClick="return mV(\'Luk\',5,15);">Lu 5:15</a>, the Revised Version (British and American) "report") have the same meaning; diaphemizo, "to say throughout," "to report publicly" (<a onClick="return mV(\'Mat\',9,31);">Mt 9:31</a>, "they...spread abroad his fame"), seems to imply fame in the sense of reputation.<P>In 1Macc 3:26, we have "fame" in the sense of reputation, "His fame (onoma, the Revised Version (British and American) "name") came near even to the king"; so <span class="noTag">3:41</a>, "heard the fame of them."<P>ERV has "fame" for "report" (shema\'), <a onClick="return mV(\'Jer\',50,43);">Jer 50:43</a>.``185';
isbe[3367]='Familiar`fa-mil\'-yar: Is found as an adjective qualifying "friend" and "spirit."<P>(1) Used, in a number of Old Testament passages, of spirits which were supposed to come at the call of one who had power over them. \'obh, literally, something "hollow"; compare \'obh, "bottle" (<a onClick="return mV(\'Job\',32,19);">Job 32:19</a> the King James Version); because the voice of the spirit might have been supposed to come from the one possessed, as from a bottle, or because of the hollow sound which characterized the utterance, as out of the ground (<a onClick="return mV(\'Isa\',29,4);">Isa 29:4</a>); or, as some have conjectured, akin to \'ubh, "return" (nekromantis). Probably called "familiar" because it was regarded as a servant (famulus), belonging to the family (familiaris), who might be summoned to do the commands of the one possessing it. The practice of consulting familiar spirits was forbidden by the Mosaic law (<a onClick="return mV(\'Lev\',19,31);">Le 19:31</a>; <a onClick="return mV(\'Lev\',20,6,27);">20:6,27</a>; <a onClick="return mV(\'Deu\',18,11);">De 18:11</a>). King Saul put this away early in his reign, but consulted the witch of Endor, who "had a familiar spirit" (<a onClick="return mV(\'1Sa\',28,3,7,8,9);">1Sa 28:3,7-9</a>; <a onClick="return mV(\'1Ch\',10,13);">1Ch 10:13</a>). King Manasseh fell into the same sin (<a onClick="return mV(\'2Ki\',21,6);">2Ki 21:6</a>; <a onClick="return mV(\'2Ch\',33,6);">2Ch 33:6</a>); but Josiah put those who dealt with familiar spirits out of the land (<a onClick="return mV(\'2Ki\',23,24);">2Ki 23:24</a>).<P>It seems probable, however, that the practice prevailed more or less among the people till the exile (<a onClick="return mV(\'Isa\',8,19);">Isa 8:19</a>; <a onClick="return mV(\'Isa\',19,3);">19:3</a>). See "Divination by the \'Ob" in The Expositor T, IX, 157; <a href="./study/isbe/search.html?string=ASTROLOGY">ASTROLOGY, 1</a>; <a href="./study/isbe/search.html?string=COMMUNION+WITH+DEMONS">COMMUNION WITH DEMONS</a>.<P>(2) "Familiars," "familiar friend," from yadha\', "to know," hence, "acquaintance," one intimately attached (<a onClick="return mV(\'Job\',19,14);">Job 19:14</a>); but more frequently of \'enosh shalom, "man of (my or thy) peace," that is, one to whom the salutation of peace is given (<a onClick="return mV(\'Psa\',41,9);">Ps 41:9</a>; <a onClick="return mV(\'Jer\',20,10);">Jer 20:10</a>; <a onClick="return mV(\'Jer\',38,22);">38:22</a>; also in <a onClick="return mV(\'Oba\',1,7);">Ob 1:7</a>, rendered "the men that were at peace with thee").``137';
isbe[3368]='Family`fam\'-i-li (mishpachah, bayith; patria):<P>1. The Foundation<P>2. Monogamy, the Ideal Relation<P>3. Equality of the Sexes<P>4. Polygamy<P>5. The Commandments and the Family (5th Commandment)<P>6. The Commandments and the Family (7th Commandment)<P>7. The Commandments and the Family (10th Commandment)<P>8. Primitive Monogamic Ideal<P>9. Reforms of Ezra and Nehemiah<P>10. The New Testament<P>11. The Teaching of Jesus<P>12. The Teaching of Paul<P>13. Modern Dangers<P>LITERATURE<hr /><P>1. The Foundation:<P>The Bible is the world\'s great teacher of monogamy—the union for life of one man and one woman in marriage as the basis of the family. Whatever may be said about the time of the writing of the books of the Bible, or of parts of them, the testimony of the whole is incontrovertibly to the point that marriage springs from the choice of one man and one woman of each other for a permanent family relation. Over and through the whole of the Bible this ideal is dominant. There may be instances shown here and there of violation of this rule. But such cases are to be regarded as contrary to the underlying principle of marriage—known even at the time of their occurrence to be antagonistic to the principle.<P>There may be times when moral principle is violated in high places and perhaps over wide reaches in society. The Bible shows that there were such times in the history of man. But it is undeniable that its tone toward such lapses of men and of society is not one of condonation but one of regret and disapproval. The disasters consequent are faithfully set forth. The feeling that finds expression in its whole history is that in such cases there had been violation of the ideal of right in the sex relation. The ideal of monogamic relation is put in the forefront of the history of man.<P>2. Monogamy, the Ideal Relation:<P>The race is introduced synthetically as a species in the incoming of life. "And God created man in his own image, in the image of God created he him; male and female created he them" (<a onClick="return mV(\'Gen\',1,27);">Ge 1:27</a>). But with the first particularization of the relation of the sexes to each other the great charter of monogamy was laid down so clearly that Jesus was content to quote it, when with His limitless ethical scrutiny He explained the marriage relation. "And the man said (when the woman was brought to him), This is now bone of my bones, and flesh of my flesh: she shall be called Woman, because she was taken out of Man. Therefore shall a man leave his father and his mother, and shall cleave unto his wife: and they shall be one flesh" (<a onClick="return mV(\'Gen\',2,23,24);">Ge 2:23-24</a>). It is well to pause and look at the grammatical number of the nouns: "a man," "his wife." The words of the charter hold the sexes to monogamy. The subsequent words make marriage life-lasting. "They twain shall be one flesh." A dualism becomes an individualism. So said Christ: "Wherefore they are no more twain but one flesh" (<a onClick="return mV(\'Mat\',19,6);">Mt 19:6</a> the King James Version). Nothing but death separates a man from his own flesh. Nothing but life-monogamy can find place in the language of this charter.<P>There is much in the setting of this charter in the account given in Gen that is suggestive of the fine sentiment which we know has always gone along with love and marriage. That this account should have held the place in history that it has had adds testimony to the fine perception of sentiment and the strong grasp on principle out of which it came.<P>3. Equality of the Sexes:<P>Eve, "the mother of all living," comes out as distinctly as Adam on the canvas in the portraiture of the first pair. She is the feminine representative—\'ishshah—of the race, as Adam is the masculine—\'ish (<a onClick="return mV(\'Gen\',2,23);">Ge 2:23</a>). The personality of Eve is as complete as that of Adam. She is a rational and accountable creature, as Adam is. In primitive intellectual and moral transactions she has share on equality with Adam, and is equally involved in their results. Different physical consequences fall on her for "transgression," because she is "woman," "the mother of all living" (<a onClick="return mV(\'Gen\',3,16);">Ge 3:16</a>). But Adam does not escape retribution for sin, and it may be questioned whether its burden did not fall hardest on him (<a onClick="return mV(\'Gen\',3,18,19);">Ge 3:18-19</a>), for motherhood has its joy as well as its pain, in the companionship of new-born child-life; but the wrestler for subsistence from a reluctant earth must bear his hardship alone. It cannot but be that much of the primitive conjugal love survived the fall.<P>4. Polygamy:<P>According to the record, monogamy seems long to have survived the departure from Eden. It is not till many generations after that event that we find a case of polygamy—that of Lamech (<a onClick="return mV(\'Gen\',4,\'19-24\');">Ge 4:19-24</a>). Lamech is said to have had "two wives." The special mention of "two" seems to show that man had not yet wandered far away from monogamy. The indications seem to be that as the race multiplied and went out over the face of the earth they forgot the original kinship and exhibited all manner of barbarities in social relations. Lamech was a polygamist, but he was also a quarrelsome homicide: "I have slain a man for wounding me, and a young man for bruising me" (<a onClick="return mV(\'Gen\',4,23);">Ge 4:23</a>). If such acts and dispositions as are disclosed in the case of Lamech become common, it will certainly not be a long while before the only apt description of the condition of society must be that upon which we come in <a onClick="return mV(\'Gen\',6,5);">Gen. 6:5</a>: "And Yahweh saw that the wickedness of man was great in the earth, and that every imagination of the thoughts of his heart was only evil continually." Out of such condition will come war and slavery, and polygamy—and come they did. It is a straight road from <a onClick="return mV(\'Gen\',6,5);">Ge 6:5</a> to "The Koran, tribute or the sword," and the polygamy of Mohammedans.<P>5. The Commandments and the Family (5th Commandment):<P>The commandments (<a onClick="return mV(\'Exd\',20,12);">Ex 20:12</a>; <a onClick="return mV(\'Deu\',5,16);">De 5:16</a>) are a succinct summary of the supreme moral relations and duties of man. The first four pertain to our relationship to God. The six following concern human relations. Of these six, three have considerations of the family involved in them. Commandments do not come to people ignorant of the subjects to which they relate. A commandment to cover an unknown moral relation is an absurdity. The text of the Fifth Commandment is, "Honor thy father and thy mother." This refers to the relation of children to parents. This commandment could scarcely have arisen when polygamy was a common practice, certainly never from promiscuity. The equality of father and mother is stamped on its face. That idea never could have had strength and solemnity enough, except in a prevailing condition of monogamy, to entitle the command in which it appeared to rank with the important subjects covered by the other commands. Before the gaze of the children to whom this commandment came, the family stood in monogamic honor—the mother a head of the family as well as the father. There is no question about the position of the mother in this commandment. She stands out as clear as Sinai itself. There is no cloud on her majesty. Such honor as goes to the father goes to the mother. She is no chattel, no property, no inferior being, but the mother; no subordinate to the father, but his equal in rank and entitled to equal reverence with him. The commandment would not and could not have so pictured the mother had she been one of the inmates of a harem.<P>6. The Commandments and the Family (7th Commandment):<P>The Seventh Commandment (<a onClick="return mV(\'Exd\',20,14);">Ex 20:14</a>; <a onClick="return mV(\'Deu\',5,18);">De 5:18</a>) gives the family. It secures the home. It says that whatever children are born to the race shall be born in a home and of the home—shall be family-born. The terms adultery and fornication have now become synonymous. Under the influence of polygamous practices a distinction was made in respect to unlawful sex union as to whether one or both of the parties thereto were married or not, or whether one or both were single. Such distinction will not hold in morals. All or any sex union out of marriage is barred by the family idea. Outside of that all sex union is sin.<P>While it is true that in the laws of Israel sex sin outside the family relation was treated as a subject by itself, yet when we remember how early in life marriage came in those ancient days, and that betrothal in childhood was deemed as sacred as marriage itself, we see that even then the sweep of the commandment was well-nigh universal and over what a broad range it protected the family. The family is the primal eldest institution of man—the greatest and the holiest. Over this institution this commandment stands sentry. It prevents men from breaking up in complete individual isolation, from reverting to solitary savagery. Think to what a child is born outside of the family relation! Then think of all children being so born, and you have the picture of a low plane of animalism from which all trace of the moral responsibility of fatherhood has disappeared, and where even motherhood will be reduced to simple care during the short period of helpless infancy, to such care as belongs to animal instinct. Put up now the idea that marriage shall be universal and that the children born in marriage shall belong genuinely to it, and you have a new heaven and a new earth ia the sex relations of the race of man.<P>7. The Commandments and the Family (10th Commandment):<P>The Tenth Commandment seems almost out of place on the list of the commandments. All the others enjoin specific acts. This tenth seems to be a foregleam of the Savior\'s method—going to the thoughts and intents of the heart. It is an attempt at regulation in man. It goes beyond outward acts and deals with the spirit. Its purpose seems not regulation of man in society but in himself. So far as it has outward relation it seems to apply primarily to the rights of property. We have at common law the expression, "rights of persons; and rights of things," i.e. to property. But the list of things enumerated in the commandment comprises the things most common to family life: house, servants, animals. One is forbidden not only to take but even to desire such things. They are necessary to family life. In this list of things belonging to a neighbor that a man is forbidden to desire occurs the term "wife." To first thought it may seem strange that she should be listed with property in house and chattels. But it may not be very singular. One of woman\'s greatest blessings to man is helpfulness. Eve, the mother of all living, came as a helpmeet for Adam. Sarah is mistress of domestic operations. A wife quick of thought, accurate in judgment and deft of hand is usually the key to a man\'s material prosperity. As such help a man\'s desire might stray to his neighbor\'s wife as well as to his cattle. Even on this lower plane she is still a constituent element of the family. Here the thought of sex is scarcely discernible. Covetousness unlimited in the accumulation of property is what comes under ban. To treat of that matter would lead too far astray.<P>See <a href="./study/isbe/search.html?string=COVETOUSNESS">COVETOUSNESS</a>.<P>It is well to remember in taking leave of the commandments that half of those pertaining to human relations hold the family plainly in view. This is as it should be. The race is divided equally between male and female, and their relations to each other, we might expect, would call for half of the directions devoted to the whole.<P>8. Primitive Monogamic Ideal:<P>The laws against adultery and incest (<a onClick="return mV(\'Lev\',20,\'1-\');">Le 20</a> and the like) may seem barbarously severe. Be it so; that fact would show they were carried along by a people tremendously in earnest about the integrity of the family. Beneath pioneer severity is usually a solemn principle. That the children of Israel had a tough grasp on the primitive monogamic ideal is not only apparent in all their history, but it comes out clear in what they held as history before their own began. Mr. Gladstone said the tenth chapter of Genesis is the best document of ancient ethnography known to man. But it is made up on family lines. It is a record of the settlement of heads of families as they went forth on the face of the earth. The common statement for the sons of Noah as they filed out over the lands of which they took possession is, \'these are the sons of...after their families, after their tongues, in their lands, in their nations.\' Mr. Gladstone called attention to the fact that modern philology verifies this classification of the nations which rests on outgrowth from families.<P>9. Reforms of Ezra and Nehemiah:<P>Turning now to a very distant point in history—the return of the Jews from captivity in Babylon—we find in Ezra and Nehemiah the most critical regard for genealogy. The effort to establish "pure blood" was fairly a fanaticism and might even be charged with injustice. Yet this effort was ratified by the people—sufferers in degraded name though many of them must have been. This could never have been done had not the monogamic family idea rested in their hearts as just and right. Nehemiah (<a onClick="return mV(\'Neh\',13,26);">13:26</a>) unsparingly condemned the mighty Solomon for his polygamy, and Israel upproved the censure.<P>10. The New Testament<P>When we come to the times of the New Testament, contemporaneous polygamy in Jewish society was dead. Wherever New Testament influences have gone, contemporaneous polygamy has ceased to be.<P>There has been in the United States by Mormonism a belated attempt to revive that crime against the family. But it has had its bad day, and, if it lives at all, it is under the ban of social sentiment and is a crime by law. Consecutive polygamy still exists in nations that are called Christian by the permission of divorce laws. But the tide of Christian sentiment is setting strongly against it, and it takes no special clearness of vision to see that it must go to extinction along with polygamy contemporaneous.<P>Jesus reaffirmed the original charter of the monogamic family (<a onClick="return mV(\'Mat\',19,\'1-12\');">Mt 19:1-12</a>; <a onClick="return mV(\'Mar\',10,\'2-12\');">Mr 10:2-12</a>). It is to be noticed that He affirmed the indissolubility of the family not only against the parties thereto but against the power of society.<P>See <a href="./study/isbe/search.html?string=DIVORCE">DIVORCE</a>.<P>11. The Teaching of Jesus:<P>At first sight it seems a little strange that Jesus said so little about the family. But as we reflect on the nature of His mission we shall catch the explanation of His silence. He said, "Think not that I came to destroy the law or the prophets: I came not to destroy, but to fulfill" (<a onClick="return mV(\'Mat\',5,17);">Mt 5:17</a>), that is, to fill out, to expound and expand. He also said, "For the Son of man is come to save that which was lost" (<a onClick="return mV(\'Mat\',18,11);">Mt 18:11</a> the King James Version), and, "I came not to call the righteous, but sinners" (<a onClick="return mV(\'Mat\',9,13);">Mt 9:13</a>), that is, to rectify what was wrong. To what was right He gave the right of way—let it go on in its own course. When the law was right, He said, not one jot or tittle of it should fail (<a onClick="return mV(\'Mat\',5,18);">Mt 5:18</a>). With regard to the family, He held the old charter written in the heart of man, before it was burned in brick or committed to manuscript, was right. It was comprehensive, would and ought to stand. So He stood by that, and that sufficed His purpose. Christ did not try to regulate the family so much as to regulate the persons who entered into family life. This may explain why we have no utterance from Him in regard to the conduct and duties of children toward parents. Still stood the ancient statute, "Honor thy father and thy mother." He came not to destroy but to fulfill that. That still indicated the right relation of children to parents. If a child had asked about his relation to his parents, Christ would doubtless have referred him to that commandment, as He did other inquirers about duties to the commandments that cover so large a part of the ethical realm.<P>12. The Teaching of Paul:<P>Paul, who particularizes so much in explanation of duties in all relations, scarcely gets beyond the old commandment, "Honor thy father and thy mother," when he says, "Children, obey your parents in all things, for this is well-pleasing in the Lord." It has always been well-pleasing in the Lord. To be sure there was new inspiration to obedience from the new revelation of duty which came to them in Christ, but the duty was enforced by the Fifth Commandment, and that was copied from the deeper revelation in the heart of man.<P>13. Modern Dangers:<P>In modern society the two great foes of the family are Divorce and Migration. Families no longer live a continuous life together. We have less family life than the old pastoral nomads. They had to keep together for several generations in order to protect their lives and their flocks and herds. So arose the clan, the tribe and the nation. Family influence can be detected through them. Modern Industries are very much localized. We should easily think that families would be under their controlling influence. But they are not; the industries are localized, the workers are becoming rovers. When trouble comes in an industry, a workman\'s first resort is to try somewhere else. Cheapness of transportation gives him the opportunity he desires. So with a satchel he goes hunting, much as a barbarian roams the forest for game, alone. He may take his family or leave it behind. He may be separated from his family for months or years—possibly abandon it forever. A very common cause of divorce is abandonment of family by its male head.<P>In fact, those engaged in a great deal of legitimate industry are looking out for a better place quite as much as to develop the capacities of business in their own locations. The signs over places of business are few that carry the same name in town or city for a generation. Moving is perhaps more the order of the day than movement. The families are few that can be found in the same place for a quarter of a century. The wealthy cannot stay in the same house six months at a time. They have a house in the city for the winter and one in the country for the summer, and then forsake both and fly over the sea, perhaps to remain for years—traveling. How can family ties survive under such migratory life? Society supersedes the family.<P>Even education is subject to this malign influence. At their most impressive age, when they need family influence most around them, children are sent away to prepare for or to enter upon higher courses of education. This fits them for something else than life in the family from which they sprang and they rarely return to it. We may not be able to check this drift, but we ought to see its tendency to degrade the estimate of the value of the family.<P>LITERATURE.<P>Wolsey, Divorce, Scribners; Publications of the National Divorce Reform League; Reports State and National, ad rem; Peabody, Jesus Christ and the Social Question, chapter iii; Caverno, Divorce, Midland Publishing Co., Madison, Wis.; The Ten Words, Pilgrim Press, Boston.``22';
