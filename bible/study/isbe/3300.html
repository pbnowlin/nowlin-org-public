isbe[3370]='Famine`fam\'-in (ra\'abh; limos):<P>1. Natural Causes<P>2. Famines Mentioned<P>3. Divine Relations<P>4. Figurative Uses<hr /><P>The common Old Testament word for "famine" is ra\'abh; re\'abhon also occurs (<a onClick="return mV(\'Gen\',42,19,33);">Ge 42:19,33</a>; <a onClick="return mV(\'Psa\',37,19);">Ps 37:19</a>), and kaphan (<a onClick="return mV(\'Job\',5,22);">Job 5:22</a>; <a onClick="return mV(\'Job\',30,3);">30:3</a>), all meaning "hunger" and "famine"; in the New Testament the word is limos, meaning primarily "failure," "want of food."<P>1. Natural Causes:<P>In early times, especially in lands dependent on their own productions, famines were not infrequent. They were generally caused by local irregularities of the rainfall, by destructive hail storms (<a onClick="return mV(\'Exd\',9,23,31,32);">Ex 9:23,31,32</a>), by ravages of insects (<a onClick="return mV(\'Exd\',10,15);">Ex 10:15</a>; <a onClick="return mV(\'Joe\',1,4);">Joe 1:4</a>) and by enemies (<a onClick="return mV(\'Deu\',28,51);">De 28:51</a>); in a city a famine might be caused by a siege (<a onClick="return mV(\'2Ki\',6,25);">2Ki 6:25</a>); pestilence often followed in its wake, and the suffering was great.<P>2. Famines Mentioned:<P>Famines are recorded in the time of Abraham (<a onClick="return mV(\'Gen\',12,10);">Ge 12:10</a>, etc.), of Isaac (<a onClick="return mV(\'Gen\',26,1);">Ge 26:1</a>), of Jacob, when Joseph was in Egypt—seven years of famine even in Egypt after seven of plenty (<a onClick="return mV(\'Gen\',41,54);">Ge 41:54</a>), which also affected Canaan (<a onClick="return mV(\'Gen\',42,1);">Ge 42:1</a>), and, indeed, "was over all the face of the earth" (<a onClick="return mV(\'Gen\',41,56);">Ge 41:56</a>); in the time of the Judges (<a onClick="return mV(\'Rth\',1,1);">Ru 1:1</a>), of David, for three years (<a onClick="return mV(\'2Sa\',21,1);">2Sa 21:1</a>), of Ahab and Elijah (<a onClick="return mV(\'1Ki\',17,1);">1Ki 17:1</a>; <a onClick="return mV(\'1Ki\',18,2);">18:2</a>; Ecclesiasticus 48:2,3), of Elisha (<a onClick="return mV(\'2Ki\',4,38);">2Ki 4:38</a>), during the siege of Samaria (<a onClick="return mV(\'2Ki\',6,25);">2Ki 6:25</a>), the seven years foretold by Elisha (<a onClick="return mV(\'2Ki\',8,1);">2Ki 8:1</a>), in the reign of Zedekiah in Jerusalem when besieged by Nebuchadnezzar (<a onClick="return mV(\'2Ki\',25,3);">2Ki 25:3</a>; <a onClick="return mV(\'Jer\',52,6);">Jer 52:6</a>; compare <a onClick="return mV(\'Jer\',14,1);">14:1</a>), its great severity is referred to (<a onClick="return mV(\'Lam\',5,10);">La 5:10</a>; Baruch 2:25); a "dearth" is also mentioned after the return from Captivity (<a onClick="return mV(\'Neh\',5,3);">Ne 5:3</a>); when the city was besieged by Antiochus Eupator (1Macc 6:54), after the death of Judas (1Macc 9:24), when Jerusalem was besieged by Simon (1Macc 13:49), in the time of Claudius (<a onClick="return mV(\'Act\',11,28);">Ac 11:28</a>, in his reign there were frequent famines, one of which in 45 AD severely affected Palestine; Josephus, Ant, XX, v); Christ predicted "famines...in divers places" as characterizing the end of the age (<a onClick="return mV(\'Mat\',24,7);">Mt 24:7</a>; <a onClick="return mV(\'Mar\',13,8);">Mr 13:8</a>; <a onClick="return mV(\'Luk\',21,11);">Lu 21:11</a>); in the siege of Jerusalem by Titus a terrible famine raged, the consequences of which to the people have never been surpassed.<P>3. Divine Relations:<P>Famines are frequently said to be sent as punishments sometimes threatened as such (<a onClick="return mV(\'Lev\',26,19);">Le 26:19</a>f; <a onClick="return mV(\'Deu\',28,\'49-51\');">De 28:49-51</a>; <a onClick="return mV(\'2Ki\',8,1);">2Ki 8:1</a>; <a onClick="return mV(\'Psa\',105,16);">Ps 105:16</a>; <a onClick="return mV(\'Isa\',14,30);">Isa 14:30</a>; <a onClick="return mV(\'Isa\',51,19);">51:19</a>; <a onClick="return mV(\'Jer\',14,12,15);">Jer 14:12,15</a>; <a onClick="return mV(\'Jer\',18,21);">18:21</a>, etc.; <a onClick="return mV(\'Eze\',5,16);">Eze 5:16</a>, etc.; <a onClick="return mV(\'Amo\',8,11);">Am 8:11</a>; 2Esdras 15:5,49; 16:19; Tobit 4:13; Ecclesiasticus 39:29; 40:9).<P>The righteous or godly should be preserved by God in time of famine (<a onClick="return mV(\'Job\',5,20);">Job 5:20</a>, "In famine he will redeem thee from death"; <a onClick="return mV(\'Psa\',33,19);">Ps 33:19</a>, "to keep them alive in famine"; <a onClick="return mV(\'Psa\',37,19);">37:19</a>, "In the days of famine they shall be satisfied"); this was a special mark of the Divine favor and power.<P>4. Figurative Uses:<P>A famine is used by Amos to indicate the absence of Divine communications as a punishment that should come on the people, a "famine...of hearing the words of Yahweh" (<a onClick="return mV(\'Amo\',8,11);">8:11</a>; compare <a onClick="return mV(\'1Sa\',3,1);">1Sa 3:1</a>; <a onClick="return mV(\'1Sa\',28,6);">28:6</a>; <a onClick="return mV(\'2Ch\',15,3);">2Ch 15:3</a>; <a onClick="return mV(\'Eze\',7,26);">Eze 7:26</a>; <a onClick="return mV(\'Mic\',3,6);">Mic 3:6</a>); by Zephaniah of the destruction of heathen deities (<a onClick="return mV(\'Zep\',2,11);">2:11</a>).<P>The Revised Version (British and American) has "dearth" for "famine" (<a onClick="return mV(\'Job\',5,22);">Job 5:22</a>); "famine" for "dearth" (<a onClick="return mV(\'Gen\',41,54);">Ge 41:54</a>; <a onClick="return mV(\'2Ch\',6,28);">2Ch 6:28</a>; <a onClick="return mV(\'Act\',7,11);">Ac 7:11</a>; <a onClick="return mV(\'Act\',11,28);">11:28</a>); for "hunger" (<a onClick="return mV(\'Jer\',38,9);">Jer 38:9</a>; <a onClick="return mV(\'Eze\',34,29);">Eze 34:29</a>; <a onClick="return mV(\'Rev\',6,8);">Re 6:8</a>); "famines" for "famines and pestilences" (<a onClick="return mV(\'Mat\',24,7);">Mt 24:7</a>), "famines and troubles" (<a onClick="return mV(\'Mar\',13,8);">Mr 13:8</a>), revised texts.``185';
isbe[3371]='Famish`fam\'-ish ra\'ebh, razah): "To famish" as a transitive verb is the translation of ra\'ebh, "to hunger" (<a onClick="return mV(\'Gen\',41,55);">Ge 41:55</a>): "All the land of Egypt was famished"; of ra\'abh, "hunger" (<a onClick="return mV(\'Isa\',5,13);">Isa 5:13</a>), "Their honorable men are famished," margin "Hebrew their glory are men of famine"; of razah, "to make lean," "famish" (<a onClick="return mV(\'Zep\',2,11);">Ze 2:11</a>), "For he will famish all the gods of the earth"; it is intransitive as the translation of ra\'ebh (<a onClick="return mV(\'Pro\',10,3);">Pr 10:3</a>), "Yahweh will not suffer the soul of the righteous to famish."``1';
isbe[3372]='Fan, Fanner`fan\'-er: The word "fan" occurs 3 times only in the American Standard Revised Version (<a onClick="return mV(\'Jer\',15,7);">Jer 15:7</a>; <a onClick="return mV(\'Mat\',3,12);">Mt 3:12</a>; <a onClick="return mV(\'Luk\',3,17);">Lu 3:17</a>). In <a onClick="return mV(\'Isa\',30,24);">Isa 30:24</a> mizreh is translated "fork," which is a much better translation if the instrument referred to was shaped like the winnowing fork used by the Syrian farmer today and still so called. In <a onClick="return mV(\'Isa\',41,16);">Isa 41:16</a>; <a onClick="return mV(\'Jer\',4,11);">Jer 4:11</a>; <a onClick="return mV(\'Jer\',15,7);">15:7</a>, the verb zarah is rendered "winnow" in the American Standard Revised Version. In <a onClick="return mV(\'Jer\',51,2);">Jer 51:2</a>, the Revised Version (British and American) substitutes "strangers" for "fanners."``1';
isbe[3373]='Fancy`fan\'-si (phantazo, "to cause to appear," "show"): In Ecclesiasticus 34:5, "And the heart fancieth, as a woman\'s in travail" (compare The <span class="noTag">Wisdom of Solomon 6:16</span>; <a onClick="return mV(\'Hbr\',12,21);">Heb 12:21</a>).``1';
isbe[3374]='Far House`The marginal explanation in the Revised Version (British and American) of Beth-merhak (beth ha-merchaq, "house of distance"), which is given in the text of <a onClick="return mV(\'2Sa\',15,17);">2Sa 15:17</a> instead of "a place that was far off."`<a href="./study/isbe/search.html?string=BETH+MERHAK">BETH-MERHAK</a>`1';
isbe[3375]='Far; Farther`far, far\'-ther: "Far" (adj.), distant, remote; (advb.) widely removed, is most frequently in the Old Testament the translation of rachoq, and in the New Testament of makran, but also of other Hebrew and Greek words. The word chalilah, an exclamation of abhorrence or aversion Septuagint me genoito; see <a href="./study/isbe/search.html?string=FORBID">FORBID</a>), is rendered "far from me," "far from thee," etc. (<a onClick="return mV(\'Gen\',18,25);">Ge 18:25</a>; <a onClick="return mV(\'1Sa\',2,30);">1Sa 2:30</a>; <a onClick="return mV(\'1Sa\',20,9);">20:9</a>; <a onClick="return mV(\'1Sa\',22,15);">22:15</a>; <a onClick="return mV(\'2Sa\',20,20);">2Sa 20:20</a>; <a onClick="return mV(\'2Sa\',23,17);">23:17</a>; <a onClick="return mV(\'Job\',34,10);">Job 34:10</a>). Besides its literal sense, distance in a spiritual sense is expressed by "far," as "Salvation is far from the wicked" (<a onClick="return mV(\'Psa\',119,155);">Ps 119:155</a>; compare <a onClick="return mV(\'Pro\',15,29);">Pr 15:29</a>), "far from righteousness" (<a onClick="return mV(\'Isa\',46,12);">Isa 46:12</a>), "not far from the kingdom of God" (<a onClick="return mV(\'Mar\',12,34);">Mr 12:34</a>), etc. For "far" the Revised Version (British and American) has "aloof" in <a onClick="return mV(\'Job\',30,10);">Job 30:10</a>; in several places the word in the King James Version is omitted (<a onClick="return mV(\'Jdg\',9,17);">Jud 9:17</a>; <a onClick="return mV(\'Psa\',27,9);">Ps 27:9</a>; <a onClick="return mV(\'Isa\',19,6);">Isa 19:6</a>; <a onClick="return mV(\'Isa\',26,15);">26:15</a>; <a onClick="return mV(\'Mar\',13,34);">Mr 13:34</a>); "a far country" is changed to "another" (<a onClick="return mV(\'Mat\',21,33);">Mt 21:33</a>; <a onClick="return mV(\'Mat\',25,14);">25:14</a>; <a onClick="return mV(\'Mar\',13,34);">Mr 13:34</a>), etc. For "God forbid" the Revised Version (British and American) has "far be it," "far be it from me" (<a onClick="return mV(\'Gal\',6,14);">Ga 6:14</a>; in the American Standard Revised Version, <a onClick="return mV(\'Gen\',44,7,17);">Ge 44:7,17</a>; <a onClick="return mV(\'1Sa\',12,23);">1Sa 12:23</a>; <a onClick="return mV(\'Job\',27,5);">Job 27:5</a>, etc.).<P>The comparative "farther" occurs only once in the Old Testament (<a onClick="return mV(\'Ecc\',8,17);">Ec 8:17</a>), and thrice in the New Testament (<a onClick="return mV(\'Mat\',26,39);">Mt 26:39</a>; <a onClick="return mV(\'Mar\',1,19);">Mr 1:19</a>; <a onClick="return mV(\'Mar\',10,1);">10:1</a>), and in each case is replaced in the Revised Version (British and American) by another word or phrase. The Revised Version (British and American), on the other hand, has "its farthest height" for "the height of his border" (<a onClick="return mV(\'Isa\',37,24);">Isa 37:24</a>), and "his farthest lodging-place" for "the lodgings of his borders" (<a onClick="return mV(\'2Ki\',19,23);">2Ki 19:23</a>).``185';
isbe[3376]='Fare`far: Occurs twice in the Old Testament as the translation of two Hebrew words, shalom, "peace," "prosperity," "completeness" (<a onClick="return mV(\'1Sa\',17,18);">1Sa 17:18</a>), found in the section on David\'s family history omitted by the Septuagint translators, and sakhar, "hire," "reward," Septuagint naulon, "passage-money," "fare" (<a onClick="return mV(\'Jon\',1,3);">Jon 1:3</a>). In Hebrew both words are substantives; in English the former is a verb meaning "to go," or "get on as to circumstances" (Century Dict.), the latter, a substantive meaning the price which Jonah paid for a sea-voyage to Tarshish.<P>In Apocrypha the English verb "fare" helps in the translation of three Greek words, kakoo, "fare evil" (the Revised Version (British and American) "fare ill"), Sirach 3:26; elattoo, "fare worse" (the Revised Version (British and American) "suffer loss"), Sirach 32:24; rhonnumi, "be strong," "prosper," in 2 pers. (singular) imperat. (err(h)oso) or plural (err(h)osthe) as a farewell salutation, or at the close of a letter, or to describe the welfare (usually physical or social) of a friend (2Macc 9:20; 11:21,28, etc.). Compare <a onClick="return mV(\'Act\',15,29);">Ac 15:29</a>; <a onClick="return mV(\'Act\',23,30);">23:30</a> margin.<P>In the New Testament the English verb "fare," in addition to its occurrence in the word "<a href="./study/isbe/search.html?string=FAREWELL">farewell</a>" (which see), occurs only once (<a onClick="return mV(\'Luk\',16,19);">Lu 16:19</a>), where it is said that the rich man "fared sumptuously every day" (the Revised Version, margin "living in mirth and splendor every day").<P>The Greek is euphrainomai, "be merry," and occurs 14 times in the New Testament, 10 in a good sense (<a onClick="return mV(\'Luk\',15,23,24,29,32);">Lu 15:23,24,29,32</a>, all referring to the merry-making over the return of the lost son; <a onClick="return mV(\'Act\',2,26);">Ac 2:26</a>, translation of Hebrew samach, "be glad"; <a onClick="return mV(\'Rom\',15,10);">Ro 15:10</a>, translation of Hebrew ranah, "to sing"; <a onClick="return mV(\'2Cr\',2,2);">2Co 2:2</a>; <a onClick="return mV(\'Gal\',4,27);">Ga 4:27</a>, translation of Hebrew ranah, "to sing"; <a onClick="return mV(\'Rev\',12,12);">Re 12:12</a>; <a onClick="return mV(\'Rev\',18,20);">18:20</a>); 4 in a bad, or less favorable, sense (<a onClick="return mV(\'Luk\',12,19);">Lu 12:19</a>; <a onClick="return mV(\'Luk\',16,19);">16:19</a>; <a onClick="return mV(\'Act\',7,41);">Ac 7:41</a>; <a onClick="return mV(\'Rev\',11,10);">Re 11:10</a>). The Greek word is variously translated in the New Testament, "be merry," "make merry," "be glad," "rejoice," "make glad," and only once "fare" (<a onClick="return mV(\'Luk\',16,19);">Lu 16:19</a>). In the last passage it means the general physical and material welfare of the rich man (so the Geneva (1560), the Bishops\' and Rhemish Bibles, the Revised Version (British and American) (1881), and not simply partaking of rich food so Vulgate, Wyclif, Coverdale, Cranmer, Geneva (1557) and the King James Version). Luther translates <a onClick="return mV(\'Luk\',16,19);">Lu 16:19</a>, "lebte alle Tage herrlich und in Freuden"; Weizsacker, "genoss sein Leben alle Tage in Glanze"; Ostervald, "se traitoit bien et magnifiquement"; Oltremare, "faisait brillante chere"; Segond, "menait joyeuse et brillante vie"; Weymouth, "enjoyed a splendid banquet every day," all of which virtually agree with the view taken by us as to meaning of "fare." The lampros, "sumptuously," shows that the rich man\'s manner of living was "brilliant," "magnificent." the Revised Version (British and American) has "fare" for "do" (<a onClick="return mV(\'Act\',15,36);">Ac 15:36</a>), "fared" for "did" (<a onClick="return mV(\'2Sa\',11,7);">2Sa 11:7</a>), "hath fared" for "was" (<a onClick="return mV(\'Gen\',30,29);">Ge 30:29</a>).``194';
isbe[3377]='Farewell`far-wel\' (chairo), Fare ye, or thou, well: Originally a wish at parting for those faring forth (traveling):<P>(1) As a parting wish at the close of a letter it represents the Greek err(h)oso, "Be strong," imperative of rhonnumi, "to make strong" (<a onClick="return mV(\'Act\',15,29);">Ac 15:29</a>; <a onClick="return mV(\'Act\',23,30);">23:30</a> the King James Version; see the Revised Version, margin; 2Macc 11:21); once chairete (imperative of chairo), "Rejoice!" (<a onClick="return mV(\'2Cr\',13,11);">2Co 13:11</a>, the Revised Version, margin "Rejoice: be perfected").<P>(2) As equivalent to our saying "good-bye," it represents the Greek apotassomai, "to separate one\'s self," "to take leave," "to bid farewell" (<a onClick="return mV(\'Luk\',9,61);">Lu 9:61</a>, "to bid farewell to them that are at my house"; <a onClick="return mV(\'Act\',18,21);">Ac 18:21</a>, "bade them farewell," the Revised Version (British and American) "taking his leave of them").`<a href="./study/isbe/search.html?string=FARE">FARE</a>; <a href="./study/isbe/search.html?string=GREETING">GREETING</a>`185';
isbe[3378]='Farm`farm: <a onClick="return mV(\'Mat\',22,5);">Mt 22:5</a> is the only passage where agros, has been rendered "farm." In the many other passages where the same word occurs it is rendered "field" or "piece of ground." Farms such as the Occidental is accustomed to see, namely, isolated dwellings with their groups of outbuildings, surrounded by walls or hedges and overlooking the planted fields, were probably unknown in Palestine. For protection against wild beasts and Arab marauders everyone lived in a village and went out to his fields, located perhaps miles away, only as occasion required.``133';
isbe[3379]='Farthing`far\'-thing: The rendering of two words in the Greek of the New Testament, assarion, and kodrantes, Latin quadrans. The assarion was the tenth part of the denarius, and hence in value about one penny or two centuries The quadrans was the fourth part of the Roman as, and worth only about three mills, or less than the English farthing, and is the only term rendered farthing by the American Standard Revised Version. It occurs in <a onClick="return mV(\'Mat\',5,26);">Mt 5:26</a> and <a onClick="return mV(\'Mar\',12,42);">Mr 12:42</a>, while assarion, which occurs in <a onClick="return mV(\'Mat\',10,29);">Mt 10:29</a> and <a onClick="return mV(\'Luk\',12,6);">Lu 12:6</a>, is rendered "penny" by the American Standard Revised Version.``1';
isbe[3380]='Fashion`fash\'-un (mishpat; schema, the make, pattern, shape, manner or appearance of a thing (from Latin faction-em, "a making," through Old French fatson, fachon)): In the Old Testament the noun "fashion" represents 3 Hebrew words:<P>(1) Mishpat = literally, "judgment," hence, judicial sentence, right, custom, manner; usually translated "judgment" (very frequent), but also a few times "sentence," "cause," "charge," and more frequently "manner" (nearly 40 times in the King James Version). In 3 passages it is translated "fashion," in the sense of style, shape, make, in each case of a building or part of a building (<a onClick="return mV(\'Exd\',26,30);">Ex 26:30</a>; <a onClick="return mV(\'1Ki\',6,38);">1Ki 6:38</a>; <a onClick="return mV(\'Eze\',42,11);">Eze 42:11</a>).<P>(2) Tekhunah = literally, "arrangement," "adjustment" (compare takhan, "to set right," "adjust," from kun, hekhin, "to set up," "establish"); <a onClick="return mV(\'Eze\',43,11);">Eze 43:11</a>, "the form of the house, and the fashion thereof." A cognate word in the preceding verse is translated "pattern" (the Revised Version, margin "sum").<P>(3) Demuth = "resemblance" (from damah, "to be similar"), generally translated "likeness" in English Versions of the Bible, but "fashion" in <a onClick="return mV(\'2Ki\',16,10);">2Ki 16:10</a>, where it means pattern or model. The verb "to fashion" stands for<P class="in15">(a) yatsar, "to form," "fashion" (<a onClick="return mV(\'Psa\',33,15);">Ps 33:15</a>; <a onClick="return mV(\'Psa\',139,16);">139:16</a> the King James Version; <a onClick="return mV(\'Isa\',22,11);">Isa 22:11</a> the King James Version; <a onClick="return mV(\'Isa\',44,12);">Isa 44:12</a>; <a onClick="return mV(\'Isa\',45,9);">45:9</a>);<P class="in15">(b) \'asah, "to work," "make," "form" (<a onClick="return mV(\'Job\',10,8);">Job 10:8</a>);<P class="in15">(c) kun, "to set up," "establish," "prepare" (<a onClick="return mV(\'Job\',31,15);">Job 31:15</a>; <a onClick="return mV(\'Psa\',119,73);">Ps 119:73</a>; <a onClick="return mV(\'Eze\',16,7);">Eze 16:7</a>);<P>(d) tsur, "to bind up together," "compress" (<a onClick="return mV(\'Exd\',32,4);">Ex 32:4</a>, of Aaron fashioning the golden calf out of the golden rings).<P>In the New Testament, the noun represents 5 Greek words:<P>(1) Of these, the most interesting is schema, "figure," "shape," "fashion" (from schein, aorist of echein, "to have," compare Latin habitus, from habeo, "I have"). Schema denotes a transient, external semblance or fashion, and so it may be distinguished from its synonym morphe, which denotes the essential intrinsic form of a thing, expressing its real nature. (See Lightfoot, Detached Note on <a onClick="return mV(\'Phl\',2,\'1-\');">Php 2</a>; Trench, New Testament Syn., 252ff; Gifford, Incarnation, 22ff. The distinction is rejected by Meyer, on <a onClick="return mV(\'Rom\',12,2);">Ro 12:2</a>, and by others.) In the New Testament, the noun schema occurs but twice: <a onClick="return mV(\'1Cr\',7,31);">1Co 7:31</a>, "The fashion of this world passeth away," where there seems to be an allusion to theatrical scenes, which are in their very nature transitory (compare 2Macc 4:13); and <a onClick="return mV(\'Phl\',2,8);">Php 2:8</a>, "being found in fashion as a man," i.e. having the outward figure and bearing of a man, such marks of human nature as strike the senses (contrast morphe Theou, "form of God," <a onClick="return mV(\'Phl\',2,6);">Php 2:6</a>, and morphe doulou, "form of servant," <a onClick="return mV(\'Phl\',2,7);">2:7</a>, which describe Christ\'s real inner nature). The word schema is found in compound verbs in the following passages: <a onClick="return mV(\'Rom\',12,2);">Ro 12:2</a>, "Be not fashioned (sunschematizesthe) according to this world: but be ye transformed (metamorphousthe) by the renewing of your mind" (so the Revised Version (British and American)), paraphrased by Sanday and Headlam, "Do not adopt the external and fleeting fashion of this world, but be ye transformed in your inmost nature" (Comm. in the place cited.); <a onClick="return mV(\'2Cr\',11,13);">2Co 11:13</a>f; metaschematizomai, the King James Version "transformed," better the Revised Version (British and American) "fashioned," the reference being to "the fictitious, illusory transformation whereby evil assumes the mask of good" (Lightfoot, Commentary on Phil, 131); <a onClick="return mV(\'1Pe\',1,14);">1Pe 1:14</a>, "not fashioning yourselves according to your former lusts," paraphrased by Lightfoot, "not falling in with the capricious guidance of the passions" (same place). In <a onClick="return mV(\'Phl\',3,21);">Php 3:21</a>, the adjective summorphos is translated "fashioned" in the King James Version, but better "conformed" as in Revised Version (British and American).<P>(2) Eidos, eidos, literally, "thing seen," "external appearance," "shape," is translated "fashion" in <a onClick="return mV(\'Luk\',9,29);">Lu 9:29</a>, of the glorified appearance of the transfigured Christ.<P>(3) prosopon, literally, "face," hence, look, appearance, <a onClick="return mV(\'Jam\',1,11);">Jas 1:11</a>, "The grace of the fashion of it perisheth."<P>(4) tupos, type, model, translated "fashion" in <a onClick="return mV(\'Act\',7,44);">Ac 7:44</a> the King James Version (the Revised Version (British and American) "figure"), the Greek word being taken from the Septuagint of the quoted passage, <a onClick="return mV(\'Exd\',25,40);">Ex 25:40</a>. The same phrase, kata ton tupon, in the parallel passage, <a onClick="return mV(\'Hbr\',8,5);">Heb 8:5</a>, is translated "according to the pattern."<P>(5) In one instance the phrase "on this fashion," "in this manner," represents the Greek adverb houtos, "thus" (<a onClick="return mV(\'Mar\',2,12);">Mr 2:12</a>).``49';
isbe[3381]='Fast; Fasting`fast, fast\'-ing (tsum; \'innah nephesh, "afflict soul or self," i.e. practice self-denial; nesteia, nesteuein): It is necessary to get rid of some modern notions associated with fasting before we can form a correct idea of its origin and significance in the ancient world. For instance, in the case of many ailments the dieting of the patient is an essential part of the remedy. But we may readily assume that originally fasting was not based on the salutary influence which it exercised on the health of the subject. Considerations of therapeutics played no part in the institution. The theory that fasting, like many other ancient customs, had a religious origin, is in favor with scholars, but we must not assume a religious origin for all practices which in process of time came to be associated with religion.<P>Many customs, purely secular in their origin, have gradually obtained a religious significance, just as purely religious customs have been dissociated from religion. It is also possible and, in the light of some usages, probable, that different motives operated in the association of fasting, as of some other customs, with religion. Scholars have been too ready to assume that the original significance of fasting was the same in all countries and among all nations. Robertson Smith in his Religion of the Semites advanced and defended theory that fasting was merely a mode of preparation for the tribal meal in which sacrifice originated, and came to be considered at a later stage as part of the sacrificial act. This hypothesis apparently accounts for the otherwise strange fact that both fasting and feasting are religious acts, but it does not give a satisfactory explanation of the constant association of fasting with the "wearing of sackcloth," the "putting of ashes on the head," and other similar customs. It is obvious that very different motives operated in the institution of fasting and of feasting religious observances.<P>It is a matter of common observation and experience that great distress causes loss of appetite and therefore occasions abstinence from food. Hannah, who was greatly distressed on account of her childlessness, "wept, and did not eat" (<a onClick="return mV(\'1Sa\',1,7);">1Sa 1:7</a>). Violent anger produces the same effect (<a onClick="return mV(\'1Sa\',20,34);">1Sa 20:34</a>). According to <a onClick="return mV(\'1Ki\',21,4);">1Ki 21:4</a>, Ahab, "heavy and displeased" on account of Naboth\'s refusal to part with his estate, sulked and "would eat no bread." Fasting, originally the natural expression of grief, became the customary mode of proving to others the inner emotion of sorrow. David demonstrated his grief at Abner\'s death (<a onClick="return mV(\'2Sa\',3,35);">2Sa 3:35</a>) by fasting, just as the Psalmist indicated his sympathy with his adversaries\' sorry plight in the same way (<a onClick="return mV(\'Psa\',35,13);">Ps 35:13</a>). In such passages as <a onClick="return mV(\'Ezr\',10,6);">Ezr 10:6</a>; <a onClick="return mV(\'Est\',4,3);">Es 4:3</a>, it is not clear whether fasting is used in its religious significance or simply as a natural expression of sorrow (compare also <a onClick="return mV(\'Luk\',5,33);">Lu 5:33</a> and see below). This view explains the association of fasting with the mourning customs of antiquity (compare <a onClick="return mV(\'1Sa\',31,13);">1Sa 31:13</a>; <a onClick="return mV(\'2Sa\',1,12);">2Sa 1:12</a>). As fasting was a perfectly natural and human expression and evidence of the subject\'s grief, it readily claimed a place among those religious customs whose main object was the pacification of the anger of God, or the excital of His compassion. Any and every act that would manifest the distressful state of the suppliant would appeal to the Deity and move Him to pity. The interesting incident recorded in <a onClick="return mV(\'2Sa\',12,\'16-23\');">2Sa 12:16-23</a> suggests the twofold significance of fasting as a religious act or a mode of appealing to the Deity and as a funeral custom. David defends his fasting before and not after the child\'s death on the ground that while the child was alive David\'s prayer might be answered. His fasting was intended to make his petition effectual (compare also <a onClick="return mV(\'1Ki\',21,27);">1Ki 21:27</a>; <a onClick="return mV(\'Ezr\',8,21);">Ezr 8:21</a>; <a onClick="return mV(\'Est\',4,16);">Es 4:16</a>). Occasionally fasting was proclaimed on a national scale, e.g. in case of war (<a onClick="return mV(\'Jdg\',20,26);">Jud 20:26</a>; <a onClick="return mV(\'2Ch\',20,3);">2Ch 20:3</a>) or of pestilence (<a onClick="return mV(\'Joe\',1,13);">Joe 1:13</a>f). Fasting having thus become a recognized mode of seeking Divine favor and protection, it was natural that it should be associated with confession of sin, as indisputable evidence of penitence or sorrow for sin.<P>Fasting might be partial, i.e. abstinence from certain kinds of food, or total, i.e. abstinence from all food as well as from washing, anointing, sleeping. It might be of shorter or longer duration, e.g. for one day, from sunrise to sunset (<a onClick="return mV(\'Jdg\',20,26);">Jud 20:26</a>; <a onClick="return mV(\'1Sa\',14,24);">1Sa 14:24</a>; <a onClick="return mV(\'2Sa\',1,12);">2Sa 1:12</a>; <a onClick="return mV(\'2Sa\',3,35);">3:35</a>). In <a onClick="return mV(\'1Sa\',31,13);">1Sa 31:13</a> allusion is made to a seven days\' fast, while Daniel abstained from "pleasant bread," flesh, wine and anointing for three weeks (<a onClick="return mV(\'Dan\',10,3);">Da 10:3</a>). Moses (<a onClick="return mV(\'Exd\',34,28);">Ex 34:28</a>) and Elijah (<a onClick="return mV(\'1Ki\',19,8);">1Ki 19:8</a>) fasted for 40 days. It is probable that these last three references presuppose a totally different conception of the significance of fasting. It is obvious that dreams made a deep impression on primitive man. They were communications from the departed members of the family. At a later stage they were looked upon as revelations from God. During sleep there is total abstinence from food. It was easy to draw the inference that fasting might fit the person to receive these communications from the world of spirits (<a onClick="return mV(\'Dan\',10,2);">Da 10:2</a>). The close connection between fasting and insight—intellectual and spiritual—between simple living and high thinking is universally recognized.<P>LITERATURE.<P>Nowack, Hebadische Archaologie; Benzinger, Hebadische Archaologie; Robertson Smith, Religion of the Semites.`<a href="./study/isbe/search.html?string=ABSTINENCE">ABSTINENCE</a>; <a href="./study/isbe/search.html?string=FEASTS+AND+FASTS">FEASTS AND FASTS</a>`103';
isbe[3382]='Fasts and Feasts``<a href="./study/isbe/search.html?string=FEASTS+AND+FASTS">FEASTS AND FASTS</a>`1';
isbe[3383]='Fat`(chelebh, chelebh): The layer of subcutaneous fat and the compact suet surrounding the viscera and imbedded in the entrails, which, like the blood, was forbidden as food in the Mosaic code (<a onClick="return mV(\'Lev\',3,17);">Le 3:17</a>). It was to be sacrificed to God by being burnt upon the altar (<a onClick="return mV(\'Lev\',3,16);">Le 3:16</a>; <a onClick="return mV(\'Lev\',7,30);">7: 30</a>). This had to be done on the very day on which a beast had been slaughtered, to remove temptation from the Israelite to use it otherwise (<a onClick="return mV(\'Exd\',23,18);">Ex 23:18</a>). The law was probably a sanitary restriction, for, at an early date, leprosy, scrofula and disfiguring cutaneous diseases were thought to be caused by the use of fat as food. It was, moreover, an important pedagogical provision teaching the idea of self-denial, and the maxim that the richest and best meat of the edible animal belonged to Yahweh.<P>The expression "fat" is often used in figurative senses, e.g. abundant, exuberant, lusty, fertile, robust, outwardly successful (<a onClick="return mV(\'Deu\',32,15);">De 32:15</a>; <a onClick="return mV(\'Psa\',92,14);">Ps 92:14</a> the King James Version; <a onClick="return mV(\'Psa\',119,70);">Ps 119:70</a>; <a onClick="return mV(\'Pro\',11,25);">Pr 11:25</a>; <a onClick="return mV(\'Pro\',13,4);">13:4</a>, etc.).`<a href="./study/isbe/search.html?string=FATLING">FATLING</a>; <a href="./study/isbe/search.html?string=FOWL+FATTED">FOWL, FATTED</a>`106';
isbe[3384]='Fat (Vat)`<a href="./study/isbe/search.html?string=WINE;+WINE+PRESS">WINE; WINE PRESS, II.</a>``1';
isbe[3385]='Father`fa\'-ther (Anglo-Saxon, Foeder; German, Vater; Hebrew \'abh, etymology uncertain, found in many cognate languages; Greek pater, from root pa, "nourisher," "protector," "upholder"):<P>1. Immediate Male Ancestor:<P>Immediate male ancestor. The father in the Hebrew family, as in the Roman, had supreme rights over his children, could dispose of his daughter in marriage (<a onClick="return mV(\'Gen\',29,\'1-\');">Ge 29</a>), arrange his son\'s marriage (<a onClick="return mV(\'Gen\',24,\'1-\');">Ge 24</a>), sell his children (<a onClick="return mV(\'Exd\',21,7);">Ex 21:7</a>), but not his daughter to a stranger (<a onClick="return mV(\'Neh\',5,5);">Ne 5:5</a>), had power of life and death, as in the case of Isaac (<a onClick="return mV(\'Gen\',22,\'1-\');">Ge 22</a>), Jephthah\'s daughter (<a onClick="return mV(\'Jdg\',11,34);">Jud 11:34</a>), the sacrificing of his children to Molech (<a onClick="return mV(\'Lev\',18,21);">Le 18:21</a>; <a onClick="return mV(\'Lev\',20,\'3-5\');">20:3-5</a>), etc. Respect, reverence and affection for fathers (and equally for mothers) is most tenderly, explicitly and sternly prescribed from the earliest times (<a onClick="return mV(\'Exd\',20,12);">Ex 20:12</a>; <a onClick="return mV(\'Lev\',19,3);">Le 19:3</a>; <a onClick="return mV(\'Deu\',5,16);">De 5:16</a>; <a onClick="return mV(\'Mic\',7,6);">Mic 7:6</a>; <a onClick="return mV(\'Eze\',22,7);">Eze 22:7</a>, etc.). A symmetrical and beautiful picture of the duties and character of the ideal human father may be built up from the Old Testament, with added and enlarged touches from the New Testament. He loves (<a onClick="return mV(\'Gen\',37,4);">Ge 37:4</a>); commands (<a onClick="return mV(\'Gen\',50,16);">Ge 50:16</a>; <a onClick="return mV(\'Pro\',6,20);">Pr 6:20</a>); instructs (<a onClick="return mV(\'Pro\',1,8);">Pr 1:8</a>, etc.); guides, encourages, warns (<a onClick="return mV(\'Jer\',3,4);">Jer 3:4</a>; <a onClick="return mV(\'1Th\',2,11);">1Th 2:11</a>); trains (<a onClick="return mV(\'Hsa\',11,3);">Ho 11:3</a>); rebukes (<a onClick="return mV(\'Gen\',34,30);">Ge 34:30</a>); restrains (Eli, by contrast, <a onClick="return mV(\'1Sa\',3,13);">1Sa 3:13</a>); punishes (<a onClick="return mV(\'Deu\',21,18);">De 21:18</a>); chastens (<a onClick="return mV(\'Pro\',3,12);">Pr 3:12</a>; <a onClick="return mV(\'Deu\',8,5);">De 8:5</a>); nourishes (<a onClick="return mV(\'Isa\',1,2);">Isa 1:2</a>); delights in his son (<a onClick="return mV(\'Pro\',3,12);">Pr 3:12</a>), and in his son\'s wisdom (<a onClick="return mV(\'Pro\',10,1);">Pr 10:1</a>); is deeply pained by his folly (<a onClick="return mV(\'Pro\',17,25);">Pr 17:25</a>); he is considerate of his children\'s needs and requests (<a onClick="return mV(\'Mat\',7,10);">Mt 7:10</a>); considerate of their burdens, or sins (<a onClick="return mV(\'Mal\',3,17);">Mal 3:17</a>, "As a man spareth his own son"); tenderly familiar (<a onClick="return mV(\'Luk\',11,7);">Lu 11:7</a>, "with me in bed"); considerately self-restrained (<a onClick="return mV(\'Eph\',6,4);">Eph 6:4</a>, "Provoke not your children to wrath"); having in view the highest ends (ibid., "Nurture them in the chastening and admonition of the Lord"); pitiful (<a onClick="return mV(\'Psa\',103,13);">Ps 103:13</a>, "as a father pitieth his children"); the last human friend (but one) to desert the child (<a onClick="return mV(\'Psa\',27,10);">Ps 27:10</a>: "When (a thing to the psalmist incredible) my father and my mother forsake me, then Yahweh will take me up").<P>2. Ancestors, Immediate or Remote:<P>(a) Ancestor, immediate or remote: <a onClick="return mV(\'Gen\',28,13);">Ge 28:13</a>, "Abraham thy father" (grandfather); <a onClick="return mV(\'1Ki\',22,50);">1Ki 22:50</a>, "Jehoshaphat...David his father"; <a onClick="return mV(\'Jer\',35,6);">Jer 35:6</a>, "Jonadab, the son of Rechab, our father"; <a onClick="return mV(\'Dan\',5,11);">Da 5:11</a>, "Nebuchadnezzar thy father" (personal or official ancestor); <a onClick="return mV(\'Gen\',15,15);">Ge 15:15</a>, "Go to thy fathers in peace" (and so (in the plural) in over 500 passages). The expressions "slept with his fathers," "go down to his fathers," "buried with his fathers," "gathered to his fathers," are self-explanatory euphemisms.<P>(b) The founders of the (Hebrew) race, specifically the patriarchs:\' <a onClick="return mV(\'Rom\',9,5);">Ro 9:5</a>, "whose are the fathers," considered here also as in a sense the religious ancestors of all believers.<P>(c) Progenitors of clans, i.e. (Revised Version (British and American)) "fathers\' houses": <a onClick="return mV(\'Exd\',6,14);">Ex 6:14</a>; <a onClick="return mV(\'1Ch\',27,1);">1Ch 27:1</a>, etc.<P>(d) Gods as progenitors of men: <a onClick="return mV(\'Jer\',2,27);">Jer 2:27</a>, "Who say to a stock, thou art my father."<P>3. Figurative and Derived Uses:<P>(a) A spiritual ancestor, one who has infused his own spirit into others, whether good, as Abraham, the father of the faithful, <a onClick="return mV(\'Rom\',4,11);">Ro 4:11</a>; or bad, as <a onClick="return mV(\'Jhn\',8,44);">Joh 8:44</a>, "Ye are of your father the devil."<P>(b) Indicating closest resemblance, kinship, affinity: <a onClick="return mV(\'Job\',17,14);">Job 17:14</a>, "If I have said to corruption, Thou art my father."<P>(c) A source: <a onClick="return mV(\'Eph\',1,17);">Eph 1:17</a>, "Father of glory"; <a onClick="return mV(\'Job\',38,28);">Job 38:28</a>, "Hath the rain a father?"<P>(d) Creator: <a onClick="return mV(\'Jam\',1,17);">Jas 1:17</a>, "the Father of lights."<P>(e) The inventor or originator of an art or mode of life: <a onClick="return mV(\'Gen\',4,20);">Ge 4:20</a>, "father of such as dwell in tents" (a hint here of hereditary occupations? Probably not).<P>(f) One who exhibits the fatherly characteristics: <a onClick="return mV(\'Psa\',68,5);">Ps 68:5</a>, "a father of the fatherless."<P>(g) One who occupies a position of counsel, care, or control (frequently applied by sultans to their prime ministers): <a onClick="return mV(\'Gen\',45,8);">Ge 45:8</a>, "a father to Pharaoh"; <a onClick="return mV(\'Jdg\',17,10);">Jud 17:10</a>, "Be unto me a father and a priest."<P>(h) A revered or honored superior: <a onClick="return mV(\'2Ki\',5,13);">2Ki 5:13</a>, "My father, if the prophet had bid thee"; but especially applied to prophets: <a onClick="return mV(\'2Ki\',2,12);">2Ki 2:12</a>, "My father, my father!" also to elderly and venerable men: <a onClick="return mV(\'1Jo\',2,13);">1Joh 2:13</a>, "I write unto you, fathers"; hence also, with perhaps an outlook on (2) (a), deceased early Christians: <a onClick="return mV(\'2Pe\',3,4);">2Pe 3:4</a>, "from the day that the fathers fell asleep." An ecclesiastical title, condemned (in principle) by our Lord: <a onClick="return mV(\'Mat\',23,9);">Mt 23:9</a>, "Call no man your father on the earth"; but applied, under the power of the Spirit, to members of the Sanhedrin (probably) by Stephen: <a onClick="return mV(\'Act\',7,2);">Ac 7:2</a>; and by Paul: <a onClick="return mV(\'Act\',22,2);">22:1</a>, but the latter, perhaps also the former, may simply refer to the elderly among his hearers. Christ\'s condemnation is clearly of the praise-seeking or obsequious spirit, rather than of a particular custom.<P>"Father," used by Mary of Joseph, in relation to Jesus, equals "putative father," a necessary reserve at a time when the virgin birth could not yet be proclaimed (<a onClick="return mV(\'Luk\',2,49);">Lu 2:49</a>). But note Jesus\' answer: "my Father\'s house."``31';
isbe[3386]='Father\'s House`(beth \'abh, beth \'abhoth): Father\'s house in the Old Testament is<P>(1) a dwelling, the family home (<a onClick="return mV(\'Gen\',12,1);">Ge 12:1</a>; <a onClick="return mV(\'Gen\',31,14,30);">31:14,30</a>; <a onClick="return mV(\'Gen\',38,11);">38:11</a>; <a onClick="return mV(\'1Sa\',18,2);">1Sa 18:2</a>);<P>(2) a family or household (<a onClick="return mV(\'Gen\',41,51);">Ge 41:51</a>; <a onClick="return mV(\'Gen\',46,31);">46:31</a>; <a onClick="return mV(\'Exd\',12,3);">Ex 12:3</a>, the Revised Version (British and American) "fathers\' houses");<P>(3) the group of households, of several of which the "family\' or "clan" was constituted, aggregations of which formed the "tribe," generally "fathers\' houses" (<a onClick="return mV(\'Num\',1,18,20);">Nu 1:18,20</a>; <a onClick="return mV(\'Num\',17,2);">17:2</a>; <a onClick="return mV(\'Ezr\',2,59);">Ezr 2:59</a>; <a onClick="return mV(\'Neh\',10,34);">Ne 10:34</a>, etc.);<P>(4) the "family" (clan), mishpachah, "fathers\' houses" (<a onClick="return mV(\'Exd\',6,14);">Ex 6:14</a>f; <a onClick="return mV(\'Num\',3,20);">Nu 3:20</a>);<P>(5) the tribe, "fathers\' house," "houses" (<a onClick="return mV(\'Num\',7,2);">Nu 7:2</a>; <a onClick="return mV(\'Num\',17,\'1-3\');">17:1-3</a>, etc.).<P>In the New Testament "father\'s house" (oikos tou patros) occurs in the sense of dwelling, house (<a onClick="return mV(\'Luk\',16,27);">Lu 16:27</a>; compare <a onClick="return mV(\'Luk\',16,4);">16:4</a>). our Lord also uses the phrase<P>(1) of the earthly temple-dwelling of God at Jerusalem (<a onClick="return mV(\'Jhn\',2,16);">Joh 2:16</a>, "Make not my Father\'s house a house of merchandise"; compare <a onClick="return mV(\'Psa\',11,4);">Ps 11:4</a>; <a onClick="return mV(\'Isa\',63,15);">Isa 63:15</a>);<P>(2) of heaven as the abode of God and His children (<a onClick="return mV(\'Jhn\',14,2);">Joh 14:2</a>, "In my Father\'s house are many mansions," the Revised Version, margin "abiding places," oikia "house," "dwelling," also household, family; compare <a onClick="return mV(\'Psa\',33,13);">Ps 33:13</a>; <a onClick="return mV(\'Isa\',63,15);">Isa 63:15</a>; <a onClick="return mV(\'Mat\',6,9);">Mt 6:9</a>). The phrase occurs also (<a onClick="return mV(\'Act\',7,20);">Ac 7:20</a>) of Moses, "nourished...in his father\'s house" (oikos).<P>Revised Version has "father\'s hquse" for "principal household" (<a onClick="return mV(\'1Ch\',24,6);">1Ch 24:6</a>), "heads of the fathers\' houses" for "chief fathers" (<a onClick="return mV(\'Num\',31,26);">Nu 31:26</a>; <a onClick="return mV(\'Num\',32,28);">32:28</a>; <a onClick="return mV(\'Num\',36,1);">36:1</a>; <a onClick="return mV(\'1Ch\',9,34);">1Ch 9:34</a>, etc.); "one prince of a father\'s house," for "each of" (<a onClick="return mV(\'Jos\',22,14);">Jos 22:14</a>); "the heads of the fathers\' (houses)" for "the chief of the fathers," and "the fathers\' houses of the chief," for "the principal fathers" (<a onClick="return mV(\'1Ch\',24,31);">1Ch 24:31</a>).``185';
isbe[3387]='Father, God the`In the Christian religion God is conceived of as "Father," "Our Father...in heaven" (<a onClick="return mV(\'Mat\',6,9,14,26);">Mt 6:9,14,26</a>, etc.), "the God and Father of the Lord Jesus" (<a onClick="return mV(\'2Cr\',11,31);">2Co 11:31</a>, etc.). The tenderness of relation and wealth of love and grace embraced in this profound designation are peculiar to Christ\'s gospel. Pagan religions also could speak of God as "Father" (Zeus Pater), and in the general sense of Creator God has a universal fatherly relation to the world (<a onClick="return mV(\'Act\',17,\'24-28\');">Ac 17:24-28</a>). In the Old Testament God was revealed as Father to the chosen nation (<a onClick="return mV(\'Exd\',4,22);">Ex 4:22</a>), and to the special representative of the nation, the king (<a onClick="return mV(\'2Sa\',7,14);">2Sa 7:14</a>), while fatherly love is declared to be the image of His pity for those who fear Him (<a onClick="return mV(\'Psa\',103,13);">Ps 103:13</a>). In the gospel of Jesus alone is this Fatherhood revealed to be of the very essence of the Godhead, and to have respect to the individual. Here, however, there is need for great discrimination. To reach the heart of the truth of the Divine Fatherhood it is necessary to begin, not with man, but with the Godhead itself, in whose eternal depths is found the spring of that Fatherly love that reveals itself in time. It is first of all in relation to the eternal Son—before all time—that the meaning of Fatherhood in God is made clear (<a onClick="return mV(\'Jhn\',1,18);">Joh 1:18</a>). In "God the Father" we have a name pointing to that relation which the first Person in the adorable Trinity sustains to "Son" and "Holy Spirit"—also Divine (<a onClick="return mV(\'Mat\',28,19);">Mt 28:19</a>). From this eternal fountain-head flow the relations of God as Father<P class="in15">(1) to the world by creation;<P class="in15">(2) to believers by grace.<P>Man as created was designed by affinity of nature for sonship to God. The realization of this—his true creature-destiny—was frustrated by sin, and can now only be restored by redemption. Hence, the place of sonship in the gospel, as an unspeakable privilege (<a onClick="return mV(\'1Jo\',3,1);">1Joh 3:1</a>), obtained by grace, through regeneration (<a onClick="return mV(\'Jhn\',1,12,13);">Joh 1:12-13</a>), and adoption (<a onClick="return mV(\'Rom\',8,14,19);">Ro 8:14,19</a>). In this relation of nearness and privilege to the Father in the kingdom of His Son (<a onClick="return mV(\'Col\',1,13);">Col 1:13</a>), believers are "sons of God" in a sense true of no others. It is a relation, not of nature, but of grace. Fatherhood is now the determinative fact in God\'s relation to them (<a onClick="return mV(\'Eph\',3,14);">Eph 3:14</a>). It is an error, nevertheless, to speak of fatherhood as if the whole character of God was therein sufficiently expressed. God is Father, but equally fundamental is His relation to His world as its Moral Ruler and Judge. From eternity to eternity the holy God must pronounce Himself against sin (<a onClick="return mV(\'Rom\',1,18);">Ro 1:18</a>); and His fatherly grace cannot avert judgment where the heart remains hard and impenitent (<a onClick="return mV(\'Rom\',2,\'1-9\');">Ro 2:1-9</a>).`<a href="./study/isbe/search.html?string=GOD,+1">GOD</a>; <a href="./study/isbe/search.html?string=CHILDREN+OF+GOD">CHILDREN OF GOD</a>; <a href="./study/isbe/search.html?string=TRINITY,+1">TRINITY</a>`132';
isbe[3388]='Father-In-Law`fa\'-ther-in-lo.`<a href="./study/isbe/search.html?string=RELATIONSHIPS,+FAMILY">RELATIONSHIPS, FAMILY</a>`1';
isbe[3389]='Fatherless`fa\'-ther-les (yathom; orphanos): The fatherless are frequently mentioned in the Old Testament, generally in association with the widow and the stranger, as typical instances of the unprotected and necessitous, who are, specially subject to oppression, and also to God\'s special protection. Great philanthropic regard is bestowed on this class throughout. In early legislation there is a special clause to guard them against affliction (<a onClick="return mV(\'Exd\',22,\'22-24\');">Ex 22:22-24</a>). They have a still more prominent place in the Deuteronomic legislation, which gives instructions that a charitable fund be formed out of the tithe, once every three years, for the relief of the destitute (<a onClick="return mV(\'Deu\',14,28,29);">De 14:28-29</a>; <a onClick="return mV(\'Deu\',26,\'12-14\');">26:12-14</a>), and that gleanings be left in the cornfield, the olive garden, and the vineyard for the benefit of this class (<a onClick="return mV(\'Deu\',24,\'19-22\');">De 24:19-22</a>; compare <a onClick="return mV(\'Lev\',19,9);">Le 19:9</a>f; <a onClick="return mV(\'Lev\',23,22);">23:22</a>, where, however, the "fatherless" are not specially mentioned). The Deuteronomist declares that God is on their side (<a onClick="return mV(\'Deu\',10,18);">De 10:18</a>), and strongly condemns those who would oppress them (<a onClick="return mV(\'Deu\',24,17);">De 24:17</a>; <a onClick="return mV(\'Deu\',27,19);">27:19</a>). The prophets and psalmists are equally emphatic in pleading for mercy and justice to the fatherless, and in declaring that God is their special guardian (<a onClick="return mV(\'Isa\',1,17);">Isa 1:17</a>; <a onClick="return mV(\'Jer\',7,6);">Jer 7:6</a>; <a onClick="return mV(\'Jer\',22,3);">22:3</a>; <a onClick="return mV(\'Hsa\',14,3);">Ho 14:3</a>; <a onClick="return mV(\'Zec\',7,10);">Zec 7:10</a>; <a onClick="return mV(\'Psa\',10,14);">Ps 10:14</a>; <a onClick="return mV(\'Psa\',68,5);">68:5</a>; <a onClick="return mV(\'Psa\',82,3);">82:3</a>; <a onClick="return mV(\'Psa\',146,9);">146:9</a>; compare <a onClick="return mV(\'Pro\',23,10);">Pr 23:10</a>). Oppressing the fatherless is frequently mentioned as a typical act of cruelty and injustice (compare <a onClick="return mV(\'Job\',6,27);">Job 6:27</a>; <a onClick="return mV(\'Job\',22,9);">22:9</a>; <a onClick="return mV(\'Job\',24,3,9);">24:3,9</a>; <a onClick="return mV(\'Job\',29,12);">29:12</a>f; <a onClick="return mV(\'Job\',31,16,17,21);">31:16,17,21</a>; <a onClick="return mV(\'Psa\',94,6);">Ps 94:6</a>; <a onClick="return mV(\'Isa\',1,23);">Isa 1:23</a>; <a onClick="return mV(\'Isa\',10,2);">10:2</a>; <a onClick="return mV(\'Jer\',5,28);">Jer 5:28</a>; <a onClick="return mV(\'Eze\',22,7);">Eze 22:7</a>; <a onClick="return mV(\'Mal\',3,5);">Mal 3:5</a>). Here we have instances of the prophetic passion for righteousness and compassion for the helpless, inspired by a profound sense of the value of human life. Passages in the Apocrypha reflect the same spirit (2Esdras 2:20; Ecclesiasticus 4:10).<P>In the New Testament the word "fatherless" occurs but once, where James declares, in the spirit of the Old Testament prophets, that true religious ritual consists in visitation of the fatherless and widows and in moral purity (<a onClick="return mV(\'Jam\',1,27);">Jas 1:27</a>). Here the word for "fatherless" is orphanos ("bereft," "orphaned"), which is the Septuagint translation of the Old Testament yathom. In the New Testament the Greek word is found besides only in <a onClick="return mV(\'Jhn\',14,18);">Joh 14:18</a>, where it means destitute of a teacher or guide (compare <a onClick="return mV(\'Lam\',5,3);">La 5:3</a>).``49';
