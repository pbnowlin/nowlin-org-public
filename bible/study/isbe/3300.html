isbe[3301]='Exorcism; Exorcist`ek\'-sor-siz\'-m, ek\'-sor-sist (Exorkistes, from exorkizo, "to adjure" (<a onClick="return mV(\'Mat\',26,63);">Mt 26:63</a>)):<P>1. Definition:<P>One who expels demons by the use of magical formulas. In the strict etymological sense there is no exorcism in the Bible. The term "exorcists" is used once (<a onClick="return mV(\'Act\',19,13);">Ac 19:13</a>) in a way to discredit the professional exorcists familiarly known both among Jews and Gentiles.<P>2. Method of Expelling Demons in the New Testament:<P>The method of Jesus in dealing with demoniacs was not that of the exorcists. While it is said (<a onClick="return mV(\'Mat\',8,16);">Mt 8:16</a>) that He "cast out the spirits with a word," it is abundantly clear that the word in question was not ritualistic but authoritative. In <a onClick="return mV(\'Luk\',4,35);">Lu 4:35</a> we have a typical sentence uttered by our Lord in the performance of His cures: "Hold thy peace, and come out of him." In <a onClick="return mV(\'Mar\',9,29);">Mr 9:29</a> we have Christ\'s own emphasis upon the ethical element in dealing with these mysterious maladies: "This kind can come out by nothing, save by prayer." In <a onClick="return mV(\'Mat\',12,28);">Mt 12:28</a> Jesus gives His own explanation of the method and power used in His cures: "But if I by the Spirit of God cast out demons, then is the kingdom of God come upon you."<P>In <a onClick="return mV(\'Luk\',9,1);">Lu 9:1</a> the terms "authority" and "power" are used in such a way as to show the belief of the evangelists that to cure demon-possession an actual power from God, together with the right to use it, was necessary. This group of passages gives the New Testament philosophy of this dread mystery and its cure. The demons are personal evil powers afflicting human life in their opposition to God. It is beyond man unaided to obtain deliverance from them. It is the function of Christ as the redeemer of mankind to deliver men from this as well as other ills due to sin. Miraculous cures of the same kind as those performed by Christ Himself were accomplished by His disciples in His name (<a onClick="return mV(\'Mar\',16,17);">Mr 16:17</a>). The power attributed to "His name" supplies us with the opportunity for a most enlightening comparison and contrast.<P>3. Exorcism in Ethnic and Jewish Writings:<P>Exorcism among ancient and primitive peoples rests largely upon faith in the power of magical formulas, ordinarily compounded of the names of deities and pronounced in connection with exorcistic rites, upon the bodies of the afflicted. The words themselves are supposed to have power over the demons, and the mere recital of the correct list of names is supposed to be efficacious.<P>Attention should be called again to the incantation texts of the Babylonians and Assyrians (see, for translations and full exposition of texts, Rogers, Religion of Babylonia and Assyria, 146ff). In this direction the absurdities and cruelties of superstition have carried men to extreme lengths. In the case of Josephus we are amazed to see how even in the case of an educated man the most abject superstition controls his views of such subjects. In Ant, VIII, v, in speaking of the wisdom of Solomon, he says that "God enabled him to learn that skill which expels demons, which is a science useful and sanitative to him." He also describes, in the same connection, a cure which he alleges to have seen, "in the presence of Vespasian and his sons," performed in accordance with methods of incantation ascribed to Solomon. A ring to which was attached a kind of root mentioned by Solomon was placed at the nostrils of the demoniac and the demon was drawn out through the nostrils. The proof that exorcism had actually taken place was given in the overturning of a basin placed nearby.<P>The absurdities of this narrative are more than equaled by the story of exorcism told in the Book of Tobit (see Lunge, Apocrypha, 151-53) where the liver and heart of a fish, miraculously caught, are burned upon the ashes of incense, and the resulting smoke drives away a demon. This whole story is well worthy of careful reading for the light it throws upon the unrestrained working of the imagination upon such matters.<P>In the rabbinical writers the very limit of diseased morbidness is reached in the long and repulsive details, which they give of methods used in exorcism (see Whitehouse, HDB, article "Demon," I, 592b; compare 593b; Edersheim, Life and Times of Jesus the Messiah, II, 775-76).<P>4. Contrasts of New Testament and Popular Methods with Demons:<P>In most striking contrast with this stand the Biblical narratives. The very point of connection which we have noted is also the point of contrast. The mighty and efficacious word with which Jesus rebuked and controlled demons was no exorcistic formula spoken by rote, but His own living word of holy power. "In the name of Jesus" did not mean that the sacred name formally uttered possessed magical power to effectuate a cure. The ancient Semitic formula, "in the name of," given a deep ethical meaning in the Old Testament, had a still deeper meaning in the New Testament. The proper and helpful use of it meant a reliance upon the presence and living power of Christ from whom alone power to do any mighty work comes (<a onClick="return mV(\'Jhn\',15,5);">Joh 15:5</a>).<P>This fundamental difference between the ideas and methods of Jesus and His disciples and current conceptions and usages becomes the more striking when we remember that the lower range of ideas and practices actually prevailed among the people with whom the Lord and His followers were associated. The famous passage (<a onClick="return mV(\'Mat\',12,24);">Mt 12:24</a> and parallel) in which the Pharisees attribute to demoniacal influence the cures wrought by Jesus upon the demonized, usually studied with reference to our Lord\'s word about the unforgivable sin, is also remarkable for the idea concerning demons which it expresses. The idea which evidently underlies the accusation against Jesus was that the natural way to obtain control over demons is by obtaining, through magic, power over the ruler of demons. In reply to this Jesus maintains that since the demons are evil they can be controlled only by opposition to them in the power of God.<P>It is most suggestive that we have in <a onClick="return mV(\'Act\',19,13);">Ac 19:13</a>ff a clear exposition, in connection with exorcism, of just the point here insisted upon. According to this narrative a group of wandering professional Jewish exorcists, witnessing the cures accomplished by Paul, attempted to do the same by the ritualistic use of the name of Jesus. They failed ignominiously because, according to the narrative, they lacked faith in the living Christ by whose power such miracles of healing were wrought, although they were letter-perfect in the use of the formula. This narrative shows clearly what the New Testament understanding of the expression "in my name" implied in the way of faith and obedience.<P>Here as elsewhere, the chastened mental restraint under which the New Testament was composed, the high spiritual and ethical results of the intimacy of the disciples with Jesus, are clearly manifest.<P>Our Lord and His disciples dealt with the demoniacs as they dealt with all other sufferers from the malign, enslaving and wasting power of sin, with the tenderness of an illimitable sympathy, and the firmness and effectiveness of those to whom were granted in abundant measure the presence and power of God.``169';
isbe[3302]='Expect; Expectation`eks-pekt\', eks-pek-ta\'-shun:<P>Of the three Greek words, translated in the New Testament by "expect," prosdokao, meaning to look forward toward what will probably occur, whether in hope or dread (<a onClick="return mV(\'Act\',3,5);">Ac 3:5</a>; <a onClick="return mV(\'Luk\',3,15);">Lu 3:15</a>), is not as intense as ekdechomai (<a onClick="return mV(\'Hbr\',10,13);">Heb 10:13</a>), meaning to wait for that of the realization of which one is assured ("as the husbandman waits for the processes of Nature (<a onClick="return mV(\'Jam\',5,7);">Jas 5:7</a>), and the patriarchs for the Divine promise," Westcott), or as vivid as the noun apokaradokia (<a onClick="return mV(\'Rom\',8,19);">Ro 8:19</a>; <a onClick="return mV(\'Phl\',1,20);">Php 1:20</a>, "earnest expectation"), which describes the stretching forth of the head toward an object that is anticipated (see Ellicott on <a onClick="return mV(\'Phl\',1,20);">Php 1:20</a>). In the Old Testament "expectation" always means that which is expected, as <a onClick="return mV(\'Pro\',10,28);">Pr 10:28</a>, "The expectation of the wicked shall perish."``84';
isbe[3303]='Expectation, Messianic`mes-i-an\'-ik.`<a href="./study/isbe/search.html?string=CHRISTS,+FALSE">CHRISTS, FALSE</a>; <a href="./study/isbe/search.html?string=ESCHATOLOGY+OF+THE+OLD+TESTAMENT">ESCHATOLOGY OF THE OLD TESTAMENT</a>; <a href="./study/isbe/search.html?string=JESUS+CHRIST">JESUS CHRIST</a>; <a href="./study/isbe/search.html?string=MESSIAH">MESSIAH</a>`1';
isbe[3304]='Expedient`eks-pe\'-di-ent (sumphero):<P>The Greek word translated "expedient" (sumphero) means literally, "to bear or bring together"; with a personal reference, "to be well or profitable." In the New Testament it never means "profitable" or "convenient" as opposed to what is strictly right. It is translated "expedient" (<a onClick="return mV(\'Jhn\',11,50);">Joh 11:50</a>, "it is expedient for us," the Revised Version (British and American) "for you"; <a onClick="return mV(\'Jhn\',16,7);">Joh 16:7</a>, "It is expedient for you that I go away," i.e. "profitable," "for your good," <a onClick="return mV(\'Jhn\',18,14);">18:14; <a onClick="return mV(\'1Cr\',6,12);">1Co 6:12</a>; <a onClick="return mV(\'1Cr\',10,23);">10:23</a>; <a onClick="return mV(\'2Cr\',8,10);">2Co 8:10</a>; <a onClick="return mV(\'2Cr\',12,1);">12:1</a>). In <a onClick="return mV(\'Mat\',19,10);">Mt 19:10</a>, instead of "not good to marry," the Revised Version (British and American) has "not expedient." The modern sense of "expediency" as "hastening" or "acceleration," is not found in the New Testament, any more than its bad sense of "mere convenience." "Nothing but the right can ever be expedient" (Whately).``185';
isbe[3305]='Experience`eks-pe\'-ri-ens:<P>This word is employed 3 times. In <a onClick="return mV(\'Gen\',30,27);">Ge 30:27</a> the King James Version, Laban says, to Jacob, "I have learned by experience (the Revised Version (British and American) "divined") that Yahweh hath blessed me for thy sake." Here it translates the Hebrew nachash, "to observe diligently," as when one examines the entrails of a bird or animal for the purpose of divination. In <a onClick="return mV(\'Ecc\',1,16);">Ec 1:16</a>, the writer says, "I have gotten me great wisdom...; my heart hath had great experience of wisdom and knowledge." Here the Hebrew (ra\'ah) means "hath seen abundantly," and the idea seems to be that of a wide outlook combined with actual trial of the things discovered or known.<P>In <a onClick="return mV(\'Rom\',5,4);">Ro 5:4</a> the King James Version, the Greek word dokime (the American Standard Revised Version more correctly "approvedness"), means the proof or testing of a thing. We rejoice in tribulation because it works out or produces patience, while the latter develops an experience of God, i.e. it brings out as a proved fact His power and love toward us in our preservation in and deliverance from trial.<P>Thus it is seen the Bible use of the word is not different from the ordinary, which means "the sum of practical wisdom taught by the events and observations of life," or, to go a little farther, the personal and practical acquaintance with what is so taught. <a onClick="return mV(\'Hbr\',5,13);">Heb 5:13</a> gives a good practical example. the King James Version says, "Every one that useth milk is unskillful (apeiros) in the word of righteousness: for he is a babe," while the Revised Version (British and American) renders "unskilful" by "without experience of." The thought is that he who fails to search out the deep things of the word of God is so lacking in the exercise of his spiritual senses as to be unable really to know truth from error.``69';
isbe[3306]='Experiment`eks-per\'-i-ment (dokime, "approvedness," "tried character"):<P>"The experiment of this ministration" (<a onClick="return mV(\'2Cr\',9,13);">2Co 9:13</a> the King James Version, the Revised Version (British and American) "the proving of you by his ministration"), i.e. the sincerity of their Christian profession was evidenced by their liberal contribution.``1';
isbe[3307]='Expiation`eks-pi-a\'-shun:<P>This word represents no Hebrew or Greek word not rendered also by "atonement." In <a onClick="return mV(\'Num\',8,7);">Nu 8:7</a> it is employed in the Revised Version (British and American) to translate chatath and in <a onClick="return mV(\'Deu\',32,43);">De 32:43</a>, kipper. This version also employs "expiate" in the margin of several passages, eg. <a onClick="return mV(\'Psa\',65,3);">Ps 65:3</a>; <a onClick="return mV(\'Psa\',79,9);">79:9</a>. Always its use in English Versions of the Bible is somewhat more narrow and specific than "atonement" and has especial reference to specific uncleanness or sin.`<a href="./study/isbe/search.html?string=ATONEMENT">ATONEMENT</a>; <a href="./study/isbe/search.html?string=SACRIFICE">SACRIFICE</a>; <a href="./study/isbe/search.html?string=PROPITIATION">PROPITIATION</a>`1';
isbe[3308]='Exposure, to Wild Beasts`eks-po\'-zhur.`<a href="./study/isbe/search.html?string=PUNISHMENTS">PUNISHMENTS</a>`1';
isbe[3309]='Express`eks-pres\':<P>In the King James Version of <a onClick="return mV(\'Hbr\',1,3);">Heb 1:3</a> "express" has the meaning "exactly resembling the original," as the impress of a seal resembles the figure engraved upon the seal. Thus "express image" in the verse referred to is a good translation (Greek charakter, literally, "engraving" and hence, "impression"); the Revised Version (British and American) "the very image."``1';
isbe[3310]='Exquisite`eks\'-kwi-sit (akribes):<P>The Greek word means "accurate" "searched out," equivalent to exquisitus from which "exquisite" is derived. It also means in argument "close," "subtle." In Ecclesiasticus 18:29, we have, "They poured forth exquisite parables," the Revised Version (British and American) "apt proverbs," and 19:25, the King James Version and the Revised Version (British and American)<P>"There is an exquisite subtleity, and the same is unjust."``1';
isbe[3311]='Extinct`eks-tinkt\':<P>In <a onClick="return mV(\'Job\',17,1);">Job 17:1</a>, "My days are extinct" (za\'akh (in Niphal)) and in <a onClick="return mV(\'Isa\',43,17);">Isa 43:17</a>, "They are extinct" (da\'akh), the word "extinct" should be recognized as a form of the participle, equivalent to "extinguished," so that in both passages an action, not merely a state, is indicated.``1';
isbe[3312]='Extortion`eks-tor\'-shun:<P>This particular word occurs twice in King James Version: <a onClick="return mV(\'Eze\',22,12);">Eze 22:12</a> (\'osheq), and <a onClick="return mV(\'Mat\',23,25);">Mt 23:25</a> (harpage), and indicates that one who is an extortioner is guilty of snatching away from another by strife, greed and oppression that which does not lawfully belong to him. The element of covetousness and usury is involved in the meaning of this word; for it is greedily gotten gain. The publicans were considered as being specially guilty of this sin; this is clear from the Pharisee\'s deprecatory remark: "I am not...an extortioner.... as this publican" (<a onClick="return mV(\'Luk\',18,11);">Lu 18:11</a>). Paul classes extortion (pleonexia, literally, "over-reaching") among a category of the grossest crimes known to humanity (<a onClick="return mV(\'1Cr\',5,10,11);">1Co 5:10,11</a>); indeed, so grievous is it that it closes the door of heaven in the face of the one guilty of it (<a onClick="return mV(\'1Cr\',6,10);">1Co 6:10</a>).``53';
isbe[3313]='Extreme; Extremity`eks-trem\', eks-trem\'-i-ti We have the adjective "extreme" in 2Esdras 5:14, "extreme fear," the Revised Version (British and American) "trembling"; in Wisdom 12:27, "extreme (terma) damnation," the Revised Version (British and American) "the last end of condemnation"; in 2Macc 7:42, "extreme (huperballousas) tortures," the Revised Version (British and American) "exceeding barbarities"; in Ecclesiasticus 42:8 it is used as an adverb, "the extreme aged" (eschatogeros), the Revised Version (British and American) "of extreme old age." Extremity: pash; Septuagint paraptoma, occurs only in <a onClick="return mV(\'Job\',35,15);">Job 35:15</a> the King James Version, the Revised Version (British and American) "arrogance," and akme in 2Macc 1:7.``1';
isbe[3314]='Eye`i (\'ayin; ophthalmos):<P>(1) The physical organ of sight, "the lamp of the body" (<a onClick="return mV(\'Mat\',6,22);">Mt 6:22</a>), one of the chief channels of information for man. A cruel custom therefore sanctioned among heathen nations the putting out of the eyes of an enemy or a rival, because thus his power was most effectually shattered (<a onClick="return mV(\'Jdg\',16,21);">Jud 16:21</a>; <a onClick="return mV(\'2Ki\',25,7);">2Ki 25:7</a>; <a onClick="return mV(\'Jer\',39,7);">Jer 39:7</a>). Such blinding or putting out of the "right eye" was also considered a deep humiliation, as it robbed the victim of his beauty, and made him unfit to take his part in war (<a onClick="return mV(\'1Sa\',11,2);">1Sa 11:2</a>; <a onClick="return mV(\'Zec\',11,17);">Zec 11:17</a>).<P>The eye, to be useful, was to be "single," i.e. not giving a double or uncertain vision (<a onClick="return mV(\'Mat\',6,22);">Mt 6:22</a>; <a onClick="return mV(\'Luk\',11,34);">Lu 11:34</a>). Eyes may grow dim with sorrow and tears (<a onClick="return mV(\'Job\',17,7);">Job 17:7</a>), they may "waste away with griefs" (<a onClick="return mV(\'Psa\',6,7);">Ps 6:7</a>; <a onClick="return mV(\'Psa\',31,9);">31:9</a>; <a onClick="return mV(\'Psa\',88,9);">88:9</a>). They may "pour down" (<a onClick="return mV(\'Lam\',3,49);">La 3:49</a>), "run down with water" (<a onClick="return mV(\'Lam\',1,16);">La 1:16</a>; <a onClick="return mV(\'Lam\',3,48);">3:48</a>). Eyes may "wink" in derision (<a onClick="return mV(\'Psa\',35,19);">Ps 35:19</a>; <a onClick="return mV(\'Pro\',6,13);">Pr 6:13</a>; <a onClick="return mV(\'Pro\',10,10);">10:10</a>; compare also <a onClick="return mV(\'Pro\',16,30);">Pr 16:30</a>; <a onClick="return mV(\'Pro\',30,17);">30:17</a>), and the harlot takes the lustling "with her eyelids" (<a onClick="return mV(\'Pro\',6,25);">Pr 6:25</a>). To \'lift up the eyes\' (<a onClick="return mV(\'Gen\',13,10);">Ge 13:10</a> et passim) means to look up or around for information and often for help; to \'turn away the eye\' or \'hide the eyes\' indicates carelessness and lack of sympathy (<a onClick="return mV(\'Pro\',28,27);">Pr 28:27</a>); to \'cast about the eyes,\' so that they "are in the ends of the earth" (<a onClick="return mV(\'Pro\',17,24);">Pr 17:24</a>) is synonymous with the silly curiosity of a fool, and with the lack of attention of him who is everywhere but at his work. In the execution of justice the "eye shall not pity," i.e. not be deflected from the dictates of the law by favorable or unfavorable impressions (<a onClick="return mV(\'Deu\',19,13);">De 19:13</a> et passim), nor spare (<a onClick="return mV(\'Eze\',5,11);">Eze 5:11</a> et passim), and the lexicon talionis demanded "life for life, eye for eye, tooth for tooth, hand for hand, foot for foot" (<a onClick="return mV(\'Exd\',21,24);">Ex 21:24</a>; <a onClick="return mV(\'Deu\',19,21);">De 19:21</a>).<P>(2) Figurative: The eye of the heart or mind, the organ of spiritual perception, which may be enlightened or opened (<a onClick="return mV(\'Psa\',119,18);">Ps 119:18</a>). This is done by the law of God (<a onClick="return mV(\'Psa\',19,8);">19:8</a>) or by the spirit of God (<a onClick="return mV(\'Eph\',1,18);">Eph 1:18</a>), or it may be "darkened" and "holden" (<a onClick="return mV(\'Luk\',24,16);">Lu 24:16</a>; compare <a onClick="return mV(\'Mat\',13,13);">Mt 13:13</a>; <a onClick="return mV(\'2Cr\',4,4);">2Co 4:4</a>).<P>(3) The eye as an index of the mind and disposition of man. The Bible speaks of the "good" margin, or "bountiful" eye, i.e. the kindly, disposition (<a onClick="return mV(\'Pro\',22,9);">Pr 22:9</a>); of "proud", "haughty", "lofty eyes" (<a onClick="return mV(\'Psa\',18,27);">Ps 18:27</a>; <a onClick="return mV(\'Psa\',131,1);">131:1</a>; <a onClick="return mV(\'Pro\',6,17);">Pr 6:17</a>); of the "lowly eyes" of the humble (<a onClick="return mV(\'Job\',22,29);">Job 22:29</a> margin; compare also <a onClick="return mV(\'Luk\',18,13);">Lu 18:13</a>); of "adulterous eyes", "eyes which play the harlot" (<a onClick="return mV(\'Eze\',6,9);">Eze 6:9</a>, in the sense of idolatrous inclinations; <a onClick="return mV(\'2Pe\',2,14);">2Pe 2:14</a>). Rage or anger is shown by the "sharpening" of the eyes (<a onClick="return mV(\'Job\',16,9);">Job 16:9</a>).<P>(4) The eyes of God, as well as the "seven eyes" of the Lamb (<a onClick="return mV(\'Rev\',5,6);">Re 5:6</a>) and the \'many eyes\' of the four living creatures of the Apocalypse (<a onClick="return mV(\'Rev\',4,6);">Re 4:6</a>; also <a onClick="return mV(\'Eze\',1,18);">Eze 1:18</a>; <a onClick="return mV(\'Eze\',10,12);">10:12</a>) are figurative expressions for the omniscience of God (compare <a onClick="return mV(\'Hbr\',4,13);">Heb 4:13</a>; <a onClick="return mV(\'Psa\',139,16);">Ps 139:16</a>) and of His watchfulness and loving care (<a onClick="return mV(\'Jer\',32,19);">Jer 32:19</a>). As the human eye may, with the slightest glance or motion, give an indication, a command, so God is able to "guide" or "counsel" His obedient child "with his eye" (<a onClick="return mV(\'Psa\',32,8);">Ps 32:8</a>).<P>(5) Three Hebrew expressions are translated by "apple of the eye":<P>(a) \'ishon, literally, "the little man," which probably means the "pupil of the eye," it being the part of the eye in which the close onlooker may see his image reflected en miniature. Several oriental languages have very similar expressions (<a onClick="return mV(\'Deu\',32,10);">De 32:10</a>; <a onClick="return mV(\'Psa\',17,8);">Ps 17:8</a>; <a onClick="return mV(\'Pro\',7,2);">Pr 7:2</a>).<P>(b) babhah, literally, "the gate of the eye" (<a onClick="return mV(\'Zec\',2,8);">Zec 2:8</a>).<P>(c) bath-\'ayin, literally, "the daughter of the eye" (<a onClick="return mV(\'Psa\',17,8);">Ps 17:8</a>; <a onClick="return mV(\'Lam\',2,18);">La 2:18</a>).<P>All these three phrases seem to indicate the pupil rather than the "apple of the eye," and designate the most sensitive part of the eye, which we protect with the greatest care. Thus the Scriptures declare, for our great comfort, that God will protect and care for those that are His own.<P>To eye (\'awan, "to watch closely," "to look maliciously at"): "Saul eyed David from that day and forward" (<a onClick="return mV(\'1Sa\',18,9);">1Sa 18:9</a>).`<a href="./study/isbe/search.html?string=ENVY">ENVY</a>; <a href="./study/isbe/search.html?string=EVIL+EYE">EVIL EYE</a>`106';
isbe[3315]='Eyelid`i\'-lid: Eyes and eyelids in Hebrew are sometimes used synonymously, as in the parallelism of <a onClick="return mV(\'Pro\',4,25);">Pr 4:25</a> (compare <a onClick="return mV(\'Pro\',6,4);">6:4</a>; <a onClick="return mV(\'Pro\',30,13);">30:13</a>):<P>"Let thine eyes look right on, <p>And let thine eyelids look straight before thee."<P>(Compare <a onClick="return mV(\'Job\',41,18);">Job 41:18</a>; <a onClick="return mV(\'Psa\',11,4);">Ps 11:4</a>; <a onClick="return mV(\'Jer\',9,18);">Jer 9:18</a>.) The alluring power of the wanton woman is conceived of as centered in her eyes (<a onClick="return mV(\'Pro\',6,25);">Pr 6:25</a>; <a onClick="return mV(\'Isa\',3,16);">Isa 3:16</a>): "Neither let her take thee with her eyelids." Painting the eyelids was resorted to to intensify the beauty, <a href="./study/isbe/search.html?string=ANTIMONY">antimony</a> (which see) being used for darkening the lashes (<a onClick="return mV(\'2Ki\',9,30);">2Ki 9:30</a>; <a onClick="return mV(\'Jer\',4,30);">Jer 4:30</a>; <a onClick="return mV(\'Eze\',23,40);">Eze 23:40</a>).``47';
isbe[3316]='Eyepaint`i\'-pant.`<a href="./study/isbe/search.html?string=ANTIMONY">ANTIMONY</a>; <a href="./study/isbe/search.html?string=EYELID">EYELID</a>; <a href="./study/isbe/search.html?string=KEREN+HAPPUCH">KEREN-HAPPUCH</a>`1';
isbe[3317]='Eyes, Blinding of the`blind\'-ing.`<a href="./study/isbe/search.html?string=EYE">EYE</a>; <a href="./study/isbe/search.html?string=PUNISHMENTS">PUNISHMENTS</a>`1';
isbe[3318]='Eyes, Covering, of the`kuv\'-er-ing:<P>In <a onClick="return mV(\'Gen\',20,16);">Ge 20:16</a>, means forgetfulness of the past, a willingness to overlook the wrong to which Sarah had been exposed.``1';
isbe[3319]='Eyes, Diseases of the`di-zez\'-is:<P>Blindness, defects of sight and diseases of the eye are frequently mentioned in the Scriptures, but usually in general terms. It is probable that in the period covered by the Bible, ophthalmia was as common in Palestine and Egypt as it is now. See <a href="./study/isbe/search.html?string=BLINDNESS">BLINDNESS</A>. The commonest of the diseases at present is the purulent conjunctivitis which is a highly infectious malady affecting people of all ages, but especially children, and whose germs are carried from eye to eye by the flies, which are allowed to walk freely over the diseased eyes. This is one of the most disgusting sights in a Palestine village, but I have been told by mothers that it is esteemed unlucky to drive off the flies. In this manner the disease is propagated. The number of persons in any Palestine village whose eyes are more or less blemished by disease is on this account phenomenally large.<P>Blindness incapacitated a man from serving in the priesthood (<a onClick="return mV(\'Lev\',21,16,18);">Le 21:16,18</a>); even a blemish of the eye was regarded as a disqualification (<a onClick="return mV(\'Lev\',21,20);">Le 21:20</a>).<P>The cases in the New Testament of persons blind from their birth (as <a onClick="return mV(\'Jhn\',9,1);">Joh 9:1</a>) were probably the results of this ophthalmia, but may have been due to congenital malformation. The interesting psychological record of the difficulty of interpreting the new visual sensations by the blind man healed by our Lord (<a onClick="return mV(\'Mar\',8,22);">Mr 8:22</a>) indicates that it was probably not a case of congenital blindness, as the evangelist uses the word apokatestathe ("restored"), but he had been so long blind that he had lost the power of appreciating the sense-impressions. This condition has been often discussed as a psycho-physical problem since the days of Molyneux and Locke (Essay on the Human Understanding, II,9,8).<P>The blindness of Paul was probably a temporary paralysis of the retina from the shock of a dazzling light accentuated by the intense emotion which accompanied his vision on the road to Damascus. The "scales" mentioned in <a onClick="return mV(\'Act\',9,18);">Ac 9:18</a> were not material, but his sight was restored as if (hosei) scales had fallen from his eyes. How far this left his eyes weak we do not know, but from his inability to recognize the high priest (<a onClick="return mV(\'Act\',23,5);">Ac 23:5</a>) and from his employing an amanuensis for transcribing his epistles (<a onClick="return mV(\'Rom\',16,22);">Ro 16:22</a>), as well as from his writing in characters of large size (pelikos; <a onClick="return mV(\'Gal\',6,11);">Ga 6:11</a>), it is probable that his vision was defective, and this it has been conjectured was the "thorn in the flesh" of <a onClick="return mV(\'2Cr\',12,7);">2Co 12:7</a>.<P>Senile blindness, the result either of cataract or retinal degeneration, is mentioned in the cases of Isaac (<a onClick="return mV(\'Gen\',27,1);">Ge 27:1</a>), Jacob (<a onClick="return mV(\'Gen\',48,10);">Ge 48:10</a>) and Eli (<a onClick="return mV(\'1Sa\',4,15);">1Sa 4:15</a>). The frequency of such senile dimness of sight made the case of Moses the more remarkable that at the age of 120 his eye was not dim (<a onClick="return mV(\'Deu\',34,7);">De 34:7</a>).<P>Tobit\'s blindness, caused by the irritation of the sparrow\'s dung (Tobit 2:10), was a traumatic conjunctivitis which left an opacity. It is not said that the whiteness was itself sufficiently large to destroy vision. There was with it probably a considerable amount of conjunctival thickening, and it is possible that the remedy might have removed this. It certainly could not remove a cicatricial white spot of the nature of an albugo. The conjecture of a recent commentator that the gall, by coloring the spot, made the eye look as if sight was restored when it really was not, seems ludicrously inept. In any case the historical accuracy of the narrative is so problematical that explanation is unnecessary.`<a href="./study/isbe/search.html?string=BLINDNESS">BLINDNESS</a>`107';
isbe[3320]='Eyes, Tender``<a href="./study/isbe/search.html?string=BLINDNESS">BLINDNESS</a>`1';
isbe[3321]='Eyesalve`i\'-sav (kollourion; collyrium; <a onClick="return mV(\'Rev\',3,18);">Re 3:18</a>):<P>A Phrygian powder mentioned by Galen, for which the medical school of Laodicea seems to have been famous (see Ramsay, The Letters to the Seven Churches of Asia), but the figurative reference is to the restoring of spiritual vision.``1';
isbe[3322]='Eyeservice`i\'-sur-vis (ophthalmodouleia):<P>A term coined by Paul to express the conduct of slaves, who work only when they are watched, and whose motive, therefore, is not fidelity to duty, but either to avoid punishment or to gain reward from their masters (<a onClick="return mV(\'Eph\',6,6);">Eph 6:6</a>; <a onClick="return mV(\'Col\',3,22);">Col 3:22</a>). "A vice which slavery everywhere creates and exhibits. Hence, the need for drivers and overseers" (Eadie).``1';
isbe[3323]='Ezar`e\'-zar.`<a href="./study/isbe/search.html?string=EZER">EZER</a>`1';
isbe[3324]='Ezbai`ez\'-ba-i, ez\'-bi (\'ezbay, "shining," "blooming"; Azobai):<P>One of David\'s "mighty men" (<a onClick="return mV(\'1Ch\',11,37);">1Ch 11:37</a>; compare <a onClick="return mV(\'2Sa\',23,35);">2Sa 23:35</a> margin).``1';
isbe[3325]='Ezbon`ez\'-bon:<P>(1) (\'etsbon; Peshitta, \'etsba\'on; Septuagint Thasoban): A son of Gad (<a onClick="return mV(\'Gen\',46,16);">Ge 46:16</a>) = Ozni of <a onClick="return mV(\'Num\',26,16);">Nu 26:16</a> (see <a href="./study/isbe/search.html?string=OZNI">OZNI</A>).<P>(2) (\'etsbon; Septuagint Asebon): In <a onClick="return mV(\'1Ch\',7,7);">1Ch 7:7</a> is said to be a grandson of Benjamin. Curtis (Ch., 148) holds that the genealogical table there is that of Zebulun and not Benjamin, and says that Ezbon suggests Ibzan (<a onClick="return mV(\'Jdg\',12,\'8-10\');">Jud 12:8-10</a>), a minor judge of Bethlehem of Zebulun (Moore, Judges, 310).``1';
isbe[3326]='Ezechias; Ezecias`ez-e-ki\'-as, ez-e-si\'-as.`<a href="./study/isbe/search.html?string=EZEKIAS">EZEKIAS</a>`1';
isbe[3327]='Ezekias`ez-e-ki\'-as (Ezekias):<P>(1) the King James Version Greek form of Hezekiah (thus, the Revised Version (British and American); <a onClick="return mV(\'Mat\',1,9,10);">Mt 1:9,10</a>). A king of Judah.<P>(2) the King James Version Ezechiad (1Esdras 9:14), called Jahzeiah in <a onClick="return mV(\'Ezr\',10,15);">Ezr 10:15</a>.<P>(3) the King James Version Ezecias (1Esdras 9:43), called Hilkiah in <a onClick="return mV(\'Neh\',8,4);">Ne 8:4</a>.``1';
isbe[3328]='Ezekiel, 1`e-ze\'-ki-el:<P>Contents <p><b>I. THE PROPHET AND HIS BOOK</b><P>1. The Person of Ezekiel Name, Captivity and Trials<P>2. The Book<p class="in15">(1) Its Genuineness<p class="in15">(2) Its Structure<p class="in15">(3) Relation to Jeremiah<p class="in15">(4) Fate of the Book and Its Place in the Canon<P><b>II. SIGNIFICANCE OF EZEKIEL IN ISRAEL\'S RELIGIOUS HISTORY</b><P>1. Formal Characteristics of Ezekiel<p class="in15">(1) Visions<p class="in15">(2) Symbolical Acts<p class="in15">(3) Allegories<p class="in15">(4) Lamentations<P>2. Ezekiel and the Levitical System<p class="in15">(1) <span class="noTag">Ezekiel 44:4</span>ff: Theory That the Distinction of Priests and Levites Was Introduced by Ezekiel<p class="in30">(a) The Biblical Facts<p class="in30">(b) Modern Interpretation of This Passage<p class="in30">(c) Examination of Theory<p class="in60">(i) Not Tenable for Pre-exilic Period<p class="in60">(ii) Not Sustained by Ezekiel<p class="in60">(iii) Not Supported by Development after Ezekiel<p class="in30">(d) The True Solution<p class="in15">(2) <span clas="noTag">Ezekiel 40-48</span>: Priority Claimed for Ezekiel as against the Priestly Codex<p class="in30">(a) Sketch of the Modern View<p class="in30">(b) One-Sidedness of This View<p class="in30">(c) Impossibility That Ezekiel Preceded P<p class="in30">(d) Correct Interpretation of Passage<p class="in15">(3) Ezekiel\'s Leviticism<p>3. Ezekiel and the Messianic Idea<p>4. Ezekiel and Apocalyptic Literature<p>5. Ezekiel\'s Conception of God<hr /><P>I. The Prophet and His Book.<P>1. The Person of Ezekiel:<P>The name yehezqe\'l, signifies "God strengthens." The Septuagint employed the form Iezekiel, from which the Vulgate (Jerome\'s Latin Bible, 390-405 AD.) took its "Ezechiel" and Luther "Hesekiel." In <a onClick="return mV(\'Eze\',1,3);">Eze 1:3</a> the prophet is said to be the son of a certain Buzi, and that he was a priest. This combination of the priestly and prophetic offices is not accidental at a time when the priests began to come more and more into the foreground. Thus, too, Jeremiah (<a onClick="return mV(\'Jer\',1,1);">1:1</a>) and Zechariah (<a onClick="return mV(\'Zec\',1,1);">1:1</a>); compare <a onClick="return mV(\'Ezr\',5,1);">Ezr 5:1</a>; <a onClick="return mV(\'Ezr\',6,14);">6:14</a>; <a onClick="return mV(\'Neh\',12,4,16);">Ne 12:4,16</a>, and my article "Zechariah" in Murray\'s Illustrated Bible Dictionary) were priests and prophets; and in <a onClick="return mV(\'Zec\',7,3);">Zec 7:3</a> a question in reference to fasting is put to both priests and prophets at the same time. And still more than in the case of Zechariah and Jeremiah, the priestly descent makes itself felt in the case of Ezekiel. We here already draw attention to his Levitical tendencies, which appear particularly prominent in <a onClick="return mV(\'Eze\',40,\'1-\');">Eze 40</a>; <a onClick="return mV(\'Eze\',46,\'1-\');">Eze 46</a> (see under II, 2 below), and to the high-priestly character of his picture of the Messiah (<a onClick="return mV(\'Eze\',21,25);">21:25</a>f; <a onClick="return mV(\'Eze\',45,22);">45:22</a>; see II, 3 below).<P>We find Ezekiel in Tel-abib (<a onClick="return mV(\'Eze\',3,15);">3:15</a>) at the river Chebar (<a onClick="return mV(\'Eze\',1,1,3);">1:1,3</a>; <a onClick="return mV(\'Eze\',3,15);">3:15</a>) on a Euphrates canal near Nippur, where the American expedition found the archives of a great business house, "Murashu and Sons." The prophet had been taken into exile in 597 BC. This event so deeply affected the fate of the people and his personal relations that Ezekiel dates his prophecies from this event. They begin with the 5th year of this date, in which year through the appearance of the Divine glory (compare II, 1 below) he had been consecrated to the prophetic office (<a onClick="return mV(\'Eze\',1,2);">1:2</a>) and continued to the 27th year (<a onClick="return mV(\'Eze\',29,17);">29:17</a>), i.e. from 593 to 571 BC. The book gives us an idea of the external conditions of the exiles. The expressions "prison," "bound," which are applied to the exiles, easily create a false impression, or at any rate a one-sided idea. These terms surely to a great extent are used figuratively. Because the Jews had lost their country, their capital city, their temple, their service and their independence as a nation, their condition was under all circumstances lamentable, and could be compared with the fate of prisoners and those in fetters.<P>The external conditions in themselves, however, seem rather to have been generally tolerable. The people live in their own houses (<a onClick="return mV(\'Jer\',29,5);">Jer 29:5</a>). Ezekiel himself is probably the owner of a house (<a onClick="return mV(\'Eze\',3,24);">Eze 3:24</a>; <a onClick="return mV(\'Eze\',8,1);">8:1</a>). They have also retained their organization, for their elders visit the prophet repeatedly (<a onClick="return mV(\'Eze\',8,1);">Eze 8:1</a>; <a onClick="return mV(\'Eze\',14,1);">14:1</a>; <a onClick="return mV(\'Eze\',20,1);">20:1</a>). This makes it clear why later comparatively few made use of the permission to return to their country. The inscriptions found in the business house at Nippur contain also a goodly number of Jewish names, which shows how the Jews are becoming settled and taking part in the business life of the country.<P>Ezekiel was living in most happy wedlock. Now God reveals to him on a certain night that his wife, "the desire of his eye," is to die through a sudden sickness. On the evening of the following day she is already dead. But he is not permitted to weep or lament over her, for he is to serve as a sign that Jerusalem is to be destroyed without wailing or lamentation (<a onClick="return mV(\'Eze\',24,15);">24:15</a>ff). Thus in his case too, as it was with Hosea, the personal fate of the prophet is most impressively interwoven with his official activity.<P>The question at what age Ezekiel had left Jerusalem has been answered in different ways. From his intimate acquaintance with the priestly institutions and with the temple service, as this appears particularly in chapters 40 to 48, the conclusion is drawn that he himself must have officiated in the temple. Yet, the knowledge on his part can be amply explained if he only in a general way had been personally acquainted with the temple, with the law and the study of the Torah. We accept that he was already taken into exile at the age of 25 years, and in his 30th year was called to his prophetic office; and in doing this we come close to the statement of Josephus, according to which Ezekiel had come to Babylon in his youth. At any rate the remarkable statement in the beginning of his book, "in the 30th year," by the side of which we find the customary dating, "in the 5th year" (<a onClick="return mV(\'Eze\',1,1,2);">1:1,2</a>), can still find its best explanation when referred to the age of the prophet. We must also remember that the 30th year had a special significance for the tribe of Levi (<a onClick="return mV(\'Num\',4:3,23,30,39);">Nu 4:3,23,30,39</a>), and that later on, and surely not accidentally, both Jesus and John the Baptist began their public activity at this age (<a onClick="return mV(\'Luk\',3,23);">Lu 3:23</a>).<P>It is indeed true that the attempt has been made to interpret this statement of Ezekiel on the basis of an era of Nabopolassar, but there is practically nothing further known of this era; and in addition there would be a disagreement here, since Nabopolassar ruled from 625 on, and his 30th year would not harmonize with the year 593 as determined by <a onClick="return mV(\'Eze\',1,2);">Eze 1:2</a>. Just as little can be said for explaining these 30 years as so many years after the discovery of the book of the law in 623, in the reign of Josiah (<a onClick="return mV(\'2Ki\',22,1);">2Ki 22</a>f). For this case too there is not the slightest hint that this event had been made the beginning of a new era, and, in addition, the statement in <a onClick="return mV(\'Eze\',1,1);">Eze 1:1</a>, without further reference to this event, would be unthinkable.<P>As in the case of the majority of the prophets, legends have also grown around the person of Ezekiel. He is reported to have been the teacher of Pythagoras, or a servant of Jeremiah, or a martyr, and is said to have been buried in the tomb of Shem and Arphaxad. He indeed did stand in close relationship to Jeremiah (see 2, 3 below). Since the publication of Klostermann\'s essay in the Studien und Kritiken,1877,it has been customary, on the basis of <a onClick="return mV(\'Eze\',3,14);">Eze 3:14</a>f; <a onClick="return mV(\'Eze\',3,26);">26</A>f; <a onClick="return mV(\'Eze\',4,4);">4:4</a>ff; <a onClick="return mV(\'Eze\',24,27);">24:27</a>, to regard Ezekiel as subject to catalepsy (compare the belief often entertained that Paul was an epileptic). Even if his condition, in which he lay speechless or motionless, has some similarity with certain forms of catalepsy or kindred diseases, i.e. a temporary suspension of the power of locomotion or of speech; yet in the case of Ezekiel we never find that he is describing a disease, but his unique condition occurs only at the express command of God (<a onClick="return mV(\'Eze\',3,24);">3:24</A>ff; <a onClick="return mV(\'Eze\',24,25);">24:25</a>ff); and this on account of the stubbornness of the house of Israel (<a onClick="return mV(\'Eze\',3,26);">3:26</a>). This latter expression which occurs with such frequency (compare <a onClick="return mV(\'Eze\',2,5);">2:5</a>ff; <a onClick="return mV(\'Eze\',3,9,27);">3:9,27</a>, etc.) induces to the consideration of the reception which the prophet met at the hand of his contemporaries.<P>He lives in the midst of briars and thorns and dwells among scorpions (<a onClick="return mV(\'Eze\',2,6);">2:6</A>). Israel has a mind harder than a rock, firmer than adamant (<a onClick="return mV(\'Eze\',3,8);">3:8</a>f). "Is he not a speaker of parables?" is cast up to him by his contemporaries, and he complains to God on this account (<a onClick="return mV(\'Eze\',20,49);">20:49</a>); and God in turn sums up the impression which Ezekiel has made on them in the words (<a onClick="return mV(\'Eze\',33,32);">33:32</a>): "Thou art unto them as a very lovely song of one that hath a pleasant voice, and can play well on an instrument; for they hear thy words, but they do them not." They consequently estimate him according to his aesthetic side (compare II,1,below), but that is all.<P>2. The Book:<P>(1) Its Genuineness.<P>When compared with almost every other prophetic book, we are particularly favorably situated in dealing with the genuineness of the Book of Ezekiel (compare my work, Die messianische Erwartung der vorexilischen Propheten, zugleich ein Protest gegen moderne Textzersplitterung), as this is practically not at all called into question, and efforts to prove a complicated composition of the book are scarcely made.<P>Both the efforts of Zunz, made long ago (compare Zeitschrift der deutsch-morgenlandishchen Gesellschaft,1873,and Die gottesdienstlichen Vortrage der Juden), and of Seinecke (Geschichte des Volkes Israel, II, 1ff) to prove a Persian or even a Greek period as the time of the composition of the book; as also the later attempt of Kroetzmann, in his Commentary on Ezekiel, to show that there are two recensions of the book, have found no favor. The claim that <a onClick="return mV(\'Eze\',40,\'1-\');">Eze 40</a>; <a onClick="return mV(\'Eze\',48,\'1-\');">Eze 48</a> were written by a pupil of Ezekiel was made as a timid suggestion by Volz, but, judging from the tendency of criticism, the origin of these chapters will probably yet become the subject of serious debate. But in general the conviction obtains that the book is characterized by such unity that we can only accept or reject it as a whole, but that for its rejection there is not the least substantial ground. This leads us to the contents.<P>(2) Its Structure.<P>The parts of the book are in general very transparent. First of all the book is divided into halves by the announcement of the fall of Jerusalem in <a onClick="return mV(\'Eze\',33,\'1-\');">Eze 33</a>; of which parts the first predominantly deals with punishments and threats; the other with comfort and encouragement. Possibly it is these two parts of the book that Josephus has in mind when he says (Ant., X) that Ezekiel had written two books. That the introduction of prophecies of redemption after those of threats in other prophetical books also is often a matter of importance, and that the right appreciation of this fact is a significant factor in the struggle against the attacks made on the genuineness of these books has been demonstrated by me in my book, Die messianische Erwartung der vorexilischen Prophelen (compare 39-40 for the case of Amos; 62ff, 136f; for the case of Hosea; 197ff for <span class="noTag");>Isa 7-12</span>ff for Micah; see also my article in Murray\'s Illustrated Bible Dictionary). Down to the time when Jerusalem fell, Ezekiel was compelled to antagonize the hopes, which were supported by false prophets, that God would not suffer this calamity. Over against this, Ezekiel persistently and emphatically points to this fact, that the apostasy had been too great for God not to bring about this catastrophe. There is scarcely a violation of a single command—religious, moral or cultural—which the prophet is not compelled to charge against the people in the three sections, <a onClick="return mV(\'Eze\',3,16);">3:16</a>ff; <a onClick="return mV(\'Eze\',8,1);">8:1</a>ff; <a onClick="return mV(\'Eze\',20,1);">20:1</a>ff, until in <a onClick="return mV(\'Eze\',24,1);">24:1</a>ff, on the 10th day of the 10th month of the 9th year (589 BC) the destruction of Jerusalem was symbolized by the vision of the boiling pot with the piece of meat in it, and the unlamented destruction of the city was prefigured by the unmourned and sudden death of his wife (see 1 above). After the five sections of this subdivision I, referring to Israel—each one of which subdivisions is introduced by a new dating, and thereby separated from the others and chronologically arranged (<a onClick="return mV(\'Eze\',1,1);">1:1</a>ff, with the consecration of the prophet immediately following it; <a onClick="return mV(\'Eze\',3,16);">3:16</a>ff; <a onClick="return mV(\'Eze\',8,1);">8:1</a>ff; <a onClick="return mV(\'Eze\',20,1);">20:1</a>ff; <a onClick="return mV(\'Eze\',24,1);">24:1</a>ff)—there follow as a second subdivision the seven oracles against the Ammonites (<a onClick="return mV(\'Eze\',25,1);">25:1</a>ff); the Moabites (<a onClick="return mV(\'Eze\',25,8);">25:8</a>ff); the Edomites (<a onClick="return mV(\'Eze\',25,12);">25:12</a>ff); the Philistines (<a onClick="return mV(\'Eze\',25,15);">25:15</a>ff); Tyre (<a onClick="return mV(\'Eze\',26,1);">26:1</a>ff); Sidon (<a onClick="return mV(\'Eze\',28,20);">28:20</a>ff); Egypt (<a onClick="return mV(\'Eze\',29,1);">29:1</a>ff), evidently arranged from a geographical point of view.<P>The most extensive are those against Tyre and the group of oracles against Egypt, both provided with separate dates (compare <a onClick="return mV(\'Eze\',26,\'1-\');">26:1-29:1</a>; <a onClick="return mV(\'Eze\',30,20);">30:20</a>; <a onClick="return mV(\'Eze\',31,1);">31:1</a>; <a onClick="return mV(\'Eze\',32,1,17);">32:1,17</a>). The supplement in reference to Tyre (<a onClick="return mV(\'Eze\',29,17);">29:17</a>ff) is the latest dated oracle of Ezekiel (from the year 571 BC), and is found here, at a suitable place, because it is connected with a threat against Egypt (<a onClick="return mV(\'Eze\',40,\'1-\');">Eze 40</a>; <a onClick="return mV(\'Eze\',48,\'1-\');">Eze 48</a> date from the year 573 according to <a onClick="return mV(\'Eze\',40,1);">Eze 40:1</a>). The number seven evidently does not occur accidentally, since in other threats of this kind a typical number appears to have been purposely chosen, thus: <a onClick="return mV(\'Isa\',13,\'1-\');">Isa 13-22</a>, i.e. ten; <a onClick="return mV(\'Jer\',46,\'1-\');">Jer 46</a>; <a onClick="return mV(\'Jer\',51,\'1-\');">Jer 51</a>, also ten; which fact again under the circumstances is an important argument in repelling attacks on the genuineness of the book.<P>Probably the five parts of the first subdivision, and the seven of the second, supplement each other, making a total of twelve (compare the analogous structure of <a onClick="return mV(\'Exd\',25,1);">Ex 25:1</a>; <a onClick="return mV(\'Exd\',30,10);">30:10</a> under <a href="./study/isbe/search.html?string=EXODUS">EXODUS</a>, and probably the chiastic structure of <a onClick="return mV(\'Eze\',34,\'1-\');">Eze 34</a>, with 7 and 5 pieces; see below). The oracles against the foreign countries are not only in point of time to be placed between <a onClick="return mV(\'Eze\',24,\'1-\');">Eze 24</a> and <a onClick="return mV(\'Eze\',33,21);">33:21</a>, but also, as concerns contents, help splendidly to solve the difficulty suggested by chapter <a onClick="return mV(\'Eze\',24,\'1-\');">24</a>, and in this way satisfactorily fill the gap thus made. The arrival of the news of the fall of Jerusalem, in 586 BC (compare <a onClick="return mV(\'Eze\',33,21);">33:21</a>ff), which had already been foretold in chapter <a onClick="return mV(\'Eze\',24,\'1-\');">24</a>, introduced by the mighty watchman\'s cry to repentance (<a onClick="return mV(\'Eze\',33,1);">33:1</a>ff), and followed by a reproof of the superficial reception of the prophetic word (see 1 above), concludes the first chief part of the book.<P>The second part also naturally fails into two subdivisions, of which the first contains the development of the nearer and more remote future, as to its inner character and its historical course (<span class="noTag">Eze 34-39</span>):<P>(1) the true shepherd of Israel (<a onClick="return mV(\'Eze\',34,\'1-\');">Eze 34</a>);<P>(2) the future fate of Edom (<a onClick="return mV(\'Eze\',35,\'1-\');">Eze 35</a>);<P>(3) Israel\'s deliverance from the disgrace of the shameful treatment by the heathen, which falls back upon the latter again (<a onClick="return mV(\'Eze\',36,\'1-15\');">Eze 36:1-15</a>);<P>(4) the desecration of the name of Yahweh by Israel and the sanctification by Yahweh (<a onClick="return mV(\'Eze\',36,\'15-38\');">Eze 36:15-38</a>);<P>(5) the revival of the Israelite nation (<a onClick="return mV(\'Eze\',37,\'1-14\');">Eze 37:1-14</a>);<P>(6) the reunion of the separated kingdoms, Judah and Israel (<a onClick="return mV(\'Eze\',37,\'15-28\');">Eze 37:15-28</a>);<P>(7) the overthrow of the terrible Gentile power of the north (<a onClick="return mV(\'Eze\',38,\'1-\');">Eze 38</a>f).<P>The second subdivision (<span class="noTag">Eze 40-48</span>) contains the reconstruction of the external affairs of the people in a vision, on the birthday of 573, "in the beginning of the year" (beginning of a jubilee year? (<a onClick="return mV(\'Lev\',25,10);">Le 25:10</a>); compare also <a href="./study/isbe/search.html?string=ATONEMENT,+DAY+OF">DAY OF ATONEMENT</a>). After the explanatory introduction (<a onClick="return mV(\'Eze\',40,\'1-4\');">Eze 40:1-4</a>), there follow five pericopes:<P>(1) directions with reference to the temple (compare the subscription <a onClick="return mV(\'Eze\',43,12);">Eze 43:12</a>) (<span class="noTag">Eze 40:5-43:12</span>);<P>(2) the altar (<span class="noTag">Eze 43:13-46:24</span>);<P>(3) the wonderful fountain of the temple, on the banks of which the trees bear fruit every month (<a onClick="return mV(\'Eze\',47,\'1-12\');">Eze 47:1-12</a>);<P>(4) the boundaries of the land and its division among the twelve tribes of Israel (<a onClick="return mV(\'Eze\',47,\'13-\');">Eze 47:13</a> - <a onClick="return mV(\'Eze\',48,\'1-29\');">48:29</a>);<P>(5) the size of the holy city and the names of its twelve gates (<a onClick="return mV(\'Eze\',48,\'30-35\');">Eze 48:30-35</a>).<P>In (3) to (5) the prominence of the number twelve is clear. Perhaps we can also divide (1) and (2) each into twelve pieces:<P>(1) would be <a onClick="return mV(\'Eze\',40,5);">Eze 40:5</a>ff, <a onClick="return mV(\'Eze\',40,17);">17</A>ff, <a onClick="return mV(\'Eze\',40,28);">28</a>ff, <a onClick="return mV(\'Eze\',40,39);">39</a>ff, <a onClick="return mV(\'Eze\',48,5);">48</a>ff; <a onClick="return mV(\'Eze\',41,1);">41:1</a>ff, <a onClick="return mV(\'Eze\',41,5);">5</a>ff, <a onClick="return mV(\'Eze\',41,12);">12</a>ff, <a onClick="return mV(\'Eze\',41,15);">15</a>ff; <a onClick="return mV(\'Eze\',42,1);">42:1</a>ff, <a onClick="return mV(\'Eze\',42,15);">15</a>ff; <a onClick="return mV(\'Eze\',43,1);">43:1</a>ff; <P>for (2) it would be <a onClick="return mV(\'Eze\',43,13);">43:13</a>ff, <a onClick="return mV(\'Eze\',43,18);">18</a>ff; <a onClick="return mV(\'Eze\',44,1);">44:1</>ff, <a onClick="return mV(\'Eze\',44,4);">4</a>ff, <a onClick="return mV(\'Eze\',44,15);">15</a>ff; <a onClick="return mV(\'Eze\',45,1);">45:1</a>ff, <a onClick="return mV(\'Eze\',45,9);">9</a>ff, <a onClick="return mV(\'Eze\',45,13);">13</a>ff, <a onClick="return mV(\'Eze\',45,18);">18</a>ff; <a onClick="return mV(\'Eze\',46,1);">46:1</a>ff, <a onClick="return mV(\'Eze\',46,16);">16</a>ff, <a onClick="return mV(\'Eze\',46,19);">19</a>ff.<P>At any rate the entire second chief part, <span class="noTag">Eze 34-48</span>, contains predictions of deliverance. The people down to 586 were confident, so that Ezekiel was compelled to rebuke them. After the taking of Jerusalem a change took place in both respects. Now the people are despairing, and this is just the right time for the prophet to preach deliverance. The most important separate prophecies will be mentioned and examined in another connection (II below).<P>The transparent structure of the whole book suggests the idea that the author did not extend the composition over a long period, but wrote it, so to say, at one stretch, which of course does not make it impossible that the separate prophecies were put into written form immediately after their reception, but rather presupposes this. When the prophet wrote they were only woven together into a single uniform book (compare also <a href="./study/isbe/search.html?string=EXODUS">EXODUS, IV,1,2</a>).<P>(3) Relation to Jeremiah.<P>As Elijah and Elisha, or Amos and Hosea, or Isaiah and Micah, or Haggai and Zechariah, so too Jeremiah and Ezekiel constitute a prophetic couple (compare 1 above); compare e.g. in later time the sending out of the disciples of Jesus, two by two (<a onClick="return mV(\'Luk\',10,1);">Lu 10:1</a>), the relation of Peter and John in <a onClick="return mV(\'Act\',3,\'1-\');">Ac 3</a>ff; of Paul and Barnabas in <a onClick="return mV(\'Act\',13,\'1-\');">Ac 13</a>ff; of Luther and Melanchthon, Calvin and Zwingli. Both prophets prophesy about the same time; both are of priestly descent (compare 1 above), both witness the overthrow of the Jewish nation, and with their prophecies accompany the fate of the Jewish state down to the catastrophe and beyond that, rebuking, threatening, warning, admonishing, and also comforting and encouraging. <p>In matters of detail, too, these two prophets often show the greatest similarity, as in the threat against the unfaithful shepherds (<a onClick="return mV(\'Eze\',34,2);">Eze 34:2</a>ff; <a onClick="return mV(\'Jer\',23,1);">Jer 23:1</a>ff); in putting into one class the Northern and the Southern Kingdom and condemning both, although the prediction is also made that they shall eventually be united and pardoned (<a onClick="return mV(\'Eze\',23,\'1-\');">Eze 23</a>; <a onClick="return mV(\'Eze\',16,\'1-\');">16</a>; <a onClick="return mV(\'Jer\',3,6);">Jer 3:6</a>ff; <a onClick="return mV(\'Eze\',37,15);">Eze 37:15</a>ff; <a onClick="return mV(\'Jer\',3,\'14-18\');">Jer 3:14-18</a>; <a onClick="return mV(\'Jer\',23,5);">23:5</a>f; <a onClick="return mV(\'Jer\',30,\'1-\');">30</a>f); in the individualizing of religion (compare the fact that both reject the common saying: "The fathers have eaten sour grapes, and the children\'s teeth are set on edge," <a onClick="return mV(\'Eze\',18,2);">Eze 18:2</a>; <a onClick="return mV(\'Jer\',31,29);">Jer 31:29</a>); in their inwardness (<a onClick="return mV(\'Eze\',36,25);">Eze 36:25</a>ff; <a onClick="return mV(\'Jer\',24,7);">Jer 24:7</a>; <a onClick="return mV(\'Jer\',31,\'27-34\');">31:27-34</a>; <a onClick="return mV(\'Jer\',32,39);">32:39</a>; <a onClick="return mV(\'Jer\',33,8);">33:8</a>); in their comparisons of the coming judgment with a boiling pot (<a onClick="return mV(\'Eze\',24,1);">Eze 24:1</a>ff; <a onClick="return mV(\'Jer\',1,13);">Jer 1:13</a>ff); and finally, in their representation of the Messiah as the priest-king (see 1 above; namely, in <a onClick="return mV(\'Eze\',21,25);">Eze 21:25</a>f; <a onClick="return mV(\'Eze\',45,22);">45:22</a>; compare <a onClick="return mV(\'Jer\',30,21);">Jer 30:21</a>; <a onClick="return mV(\'Jer\',33,17);">33:17</a>ff; see II,3,and my work Messianische Erwartung, 320ff, 354ff). Neither is to be considered independently of the other, since the prophetical writings, apparently, received canonical authority soon after and perhaps immediately after they were written (compare the expression "the former prophets" in <a onClick="return mV(\'Zec\',1,4);">Zec 1:4</a>; <a onClick="return mV(\'Zec\',7,7,12);">7:7, 12</a>, also the constantly increasing number of citations from earlier prophets in the later prophets, and the understanding of the "exact succession of the prophets" down to Artaxerxes in Josephus, CAp, I, 8), it is possible that Ezekiel, with his waw consecutivum, with which the book begins, is to be understood as desiring to connect with the somewhat older Jeremiah (compare a similar relation of Jonah to Obadiah; see my articles "Canon of the OT" and "Jonah" in Murray\'s Illustrated Bible Dictionary).<P>(4) Fate of the Book and Its Place in the Canon.<P>With Jeremiah and Ezekiel, many Hebrew manuscripts, especially those of the German and French Jews, begin the series of "later prophets," and thus these books are found before Isaiah; while the Massorah and the manuscripts of the Spanish Jews, according to the age and the size of the books, have the order, Isaiah, Jeremiah, Ezekiel. The text of the book is, in part, quite corrupt, and in this way the interpretation of the book, not easy in itself, is made considerably more difficult. Jerome, Ad Paul., writes that the beginning and the end of the book contained many dark passages; that these parts, like the beginning of Genesis, were not permitted to be read by the Jews before these had reached their 30th year. During the time when the schools of Hillel and Shammai flourished, Ezekiel belonged to those books which some wanted "to hide," the others being Proverbs, Ecclesiastes, Esther and Canticles. In these discussions the question at issue was not the reception of the book into the Canon, which was rather presupposed, nor again any effort to exclude them from the Canon again, which thought could not be reconciled with the high estimate in which it is known that Esther was held, but it was the exclusion of these books from public reading in the Divine service, which project failed. The reasons for this proposal are not to be sought in any doubt as to their authenticity, but in reference to their contents (compare my article "Canon of the Old Testament," in Murray\'s Illustrated Bible Dictionary). Possibly, too, one reason was to be found in the desire to avoid the profanation of the most sacred vision in the beginning of the book, as Zunz suggests. There is no doubt, however, that the difference of this book from the Torah was a reason that made it inadvisable to read it in public. It was hoped that these contradictions would be solved by Elijah when he should return. But finally, rabbinical research, after having used up three hundred cans of oil, succeeded in finding the solution. These contradictions, as a matter of fact, have not yet been removed, and have in modern times contributed to the production of a very radical theory in criticism, as will be shown immediately under II, 2.<p><a href="file:./study/isbe/3300.html?toc=3329">Continues next article...[<a href="./study/isbe/search.html?string=EZEKIEL, 2">Ezekiel, 2</a>]``122';
isbe[3329]='Ezekiel, 2`II. Significance of Ezekiel in Israel\'s Religious History.<P>Under the first head we will consider the formal characteristics and significance of the book; and the examination of its contents will form the subject under the next four divisions.<P>1. Formal Characteristics of Ezekiel:<P>It is not correct to regard Ezekiel merely as a writer, as it is becoming more and more customary to do. Passages like <a onClick="return mV(\'Eze\',3,10);">3:10</a>f; <a onClick="return mV(\'Eze\',14,4);">14:4</a>ff; <a onClick="return mV(\'Eze\',20,1);">20:1</a>ff, <a onClick="return mV(\'Eze\',20,27);">27</a>; <a onClick="return mV(\'Eze\',24,18);">24:18</a>ff; <a onClick="return mV(\'Eze\',43,10);">43:10</a>f show that just as the other prophets did, he too proclaimed by word of mouth the revelations of God he had received. However, he had access only to a portion of the people. It was indeed for him even more important than it had been for the earlier prophets to provide for the wider circulation and permanent influence of his message by putting it into written form. We will, at this point, examine his book first of all from its formal and its aesthetic side. To do this it is very difficult, in a short sketch, to give even a general impression of the practically inexhaustible riches of the means at his command for the expression of his thoughts.<P>(1) Visions.<P>Thus, a number of visions at once attract our attention. In the beginning of his work there appears to him the Divine throne-chariot, which comes from the north as a storm, as a great cloud and a fire rolled together. This chariot is borne by the four living creatures in the form of men, with the countenances of a man, of a lion, of an ox and of an eagle, representing the whole living creation. It will be remembered that these figures have passed over into the Revelation of John (<a onClick="return mV(\'Rev\',4,7);">Re 4:7</a>), and later were regarded as the symbols of the four evangelists. In <a onClick="return mV(\'Eze\',10,\'1-\');">Eze 10</a>f this throne-chariot in the vision leaves the portal of the temple going toward the east, returning again in the prediction of deliverance in <a onClick="return mV(\'Eze\',43,\'1-\');">Eze 43</a>. Moreover, the entire last nine chapters are to be interpreted as a vision (compare <a onClick="return mV(\'Eze\',40,2);">40:2</a>). We must not forget, finally, the revivification of the Israelite nation in <a onClick="return mV(\'Eze\',37,\'1-\');">Eze 37</a>, represented in the picture of a field full of dead bones, which are again united, covered with skin, and receive new life through the ruach (word of two meanings, "wind" and "spirit").<P>As a rule the visions of Ezekiel, like those of Zechariah (compare my article "Zechariah" in Murray\'s Illustrated Bible Dictionary), are not regarded as actual experiences, but only as literary forms. When it is given as a reason for this that the number of visions are too great and too complicated, and therefore too difficult of presentation, to be real experiences, we must declare this to be an altogether too unsafe, subjective and irrelevant rule to apply in the matter. However, correct the facts mentioned are in themselves they do not compel us to draw this conclusion. Not only is it uncertain how many visions may be experiences (compare eg. the five visions in <a onClick="return mV(\'Amo\',7,\'1-\');">Am 7</a>ff, which are generally regarded as actual experiences), but it is also absolutely impossible to prove such an a priori claim with reference to the impossibility and the unreality of processes which are not accessible to us by our own experience. As these visions, one and all, are, from the religious and ethical sides, up to the standards of Old Testament prophecy, and as, further, they are entirely unique in character, and as, finally, there is nothing to show that they are only literary forms, we must hold to the conviction that the visions are actual experiences.<P>(2) Symbolical Acts.<P>Then we find in Ezekiel, also, a large number of symbolical acts. According to Divine command Ezekiel sketches the city of Jerusalem and its siege on a tile (<a onClick="return mV(\'Eze\',4,1);">4:1</a>ff); or he lies bound on his left side, as an atonement, 390 days, and 40 days on his right side, according to the number of years of the guilt of Israel and Judah (<a onClick="return mV(\'Eze\',4,4);">4:4</a>ff). During the 390 days the condition of the people in exile is symbolized by a small quantity of food daily of the weight of only 20 shekels, and unclean, being baked on human or cattle dung, and a small quantity of water, which serves as food and drink of the prophet (<a onClick="return mV(\'Eze\',4,9);">4:9</a>ff).<P>By means of his beard and the hair of his head, which he shaves off and in part burns, in part strikes with the sword, and in part scatters to the wind, and only the very smallest portion of which he ties together in the hem of his garment, he pictures how the people shall be decimated so that only a small remnant shall remain (<a onClick="return mV(\'Eze\',5,1);">Eze 5:1</a>ff). In <a onClick="return mV(\'Eze\',12,\'1-\');">Eze 12</a>, he prepares articles necessary for marching and departs in the darkness. Just so Israel will go into captivity and its king will not see the country into which he goes (compare the blinding of Zedekiah, <a onClick="return mV(\'2Ki\',25,7);">2Ki 25:7</a>). In <a onClick="return mV(\'Eze\',37,15);">Eze 37:15</a>ff, he unites two different sticks into one, with inscriptions referring to the two kingdoms, and these picture the future union of Israel and Judah. It is perhaps an open question whether or not some of these symbolical actions, which would be difficult to carry out in actuality, are not perhaps to be interpreted as visions; thus, eg. the distributing the wine of wrath to all the nations, in <a onClick="return mV(\'Jer\',25,15);">Jer 25:15</a>, can in all probability not be understood in any other way. But, at any rate, it appears to us that here, too, the acceptance of a mere literary form is both unnecessary and unsatisfactory, and considering the religio-ethical character of Ezekiel, not permissible.<P>(3) Allegories.<P>In regard to the numerous allegories, attention need be drawn only to the picture of the two unfaithful sisters, Oholah and Oholibah (i.e. Samaria and Jerusalem), whose relation to Yahweh as well as their infidelity is portrayed in a manner that is actually offensive to over-sensitive minds (<a onClick="return mV(\'Eze\',23,\'1-\');">Eze 23</a>; compare <a onClick="return mV(\'Eze\',16,\'1-\');">Eze 16</a>). In <a onClick="return mV(\'Eze\',17,\'1-\');">Eze 17</a>, Zedekiah is represented under the image of a grapevine, which the great eagle (i.e. the king of Babylon) has appointed, which, however, turns to another great eagle (king of Egypt), and because of this infidelity shall be rooted out, until God, eventually, causes a new tree to grow out of a tender branch.<P>(4) Lamentations.<P>Of the lamentations, we mention the following: according to <a onClick="return mV(\'Eze\',19,\'1-\');">Eze 19</a>, a lioness rears young lions, one after the other, but one after the other is caught in a trap and led away by nose-rings. The ones meant are Jehoahaz and certainly Jehoiachin. The lion mother, who before was like a grapevine, is banished (Zedekiah). Another lamentation is spoken over Tyre, which is compared to a proud ship (compare <a onClick="return mV(\'Eze\',27,1);">Eze 27:1</a>ff); also over the king of Tyre, who is hurled down from the mountain of the gods (<a onClick="return mV(\'Eze\',28,\'11-19\');">Eze 28:11-19</a>); and over Pharaoh of Egypt, who is pictured as a crocodile in the sea (<a onClick="return mV(\'Eze\',32,1);">Eze 32:1</a>ff).<P>That his contemporaries knew how to appreciate the prophet at least from the aesthetic side, we saw above (I, 1). What impression does Ezekiel make upon us today, from this point of view? He is declared to be "too intellectual for a poet"; "fantastic"; "vividness in him finds a substitute in strengthening and repetition"; "he has no poetical talent"; "he is the most monotonous prose writer among the prophets." These and similar opinions are heard. In matters of taste there is no disputing; but there is food for reflection in the story handed down that Frederick yon Schiller was accustomed to read Ezekiel, chiefly on account of his magnificent descriptions, and that he himself wanted to learn Hebrew in order to be able to enjoy the book in the original. And Herder, with his undeniable and undenied fine appreciation of the poetry of many nations, calls Ezekiel "the Aeschylus and the Shakespeare of the Hebrews" (compare Lange\'s Commentary on Ezekiel, 519).<P>2. Ezekiel and the Levitical System:<P>(1) <a onClick="return mV(\'Eze\',44,4);">Ezekiel 44:4</a>ff: Theory That the Distinction of Priests and Levites Was Introduced by Ezekiel.<P>(a) The Biblical Facts:<P>In the vision of the reconstruction of the external relations of the people in the future (<a onClick="return mV(\'Eze\',40,\'1-\');">Eze 40</a>; <a onClick="return mV(\'Eze\',48,\'1-\');">48</a>), in the second pericope, which treats of the cult (43:13-46:24; compare I,2,2), it is claimed that Ezekiel, at the command of Yahweh, reproaches the Israelites that they engage in their room strangers, uncircumcised in heart and uncircumcised in flesh, to take charge of the service of Yahweh in the sanctuary, instead of doing this service themselves, and thus desecrate the temple (<a onClick="return mV(\'Eze\',44,\'4-8\');">44:4-8</a>). From now on the Levites, who hitherto have been participating in the service of the idols on the high places and had become for Israel an occasion for guilt, are to attend to this work. They are degraded from the priesthood as a punishment of their guilt, and are to render the above-mentioned service in the temple (<a onClick="return mV(\'Eze\',44,9);">Eze 44:9</a>ff), while only those Levitical priests, the sons of Zadok, who had been rendering their services in the sanctuary in the proper way, while Israel was going astray, are to be permitted to perform priestly functions (<a onClick="return mV(\'Eze\',44,15);">Eze 44:15</a>ff).<P>(b) Modern Interpretation of This Passage:<P>The modern interpretation of this passage (<a onClick="return mV(\'Eze\',44,4);">Eze 44:4</a>ff) is regarded as one of the most important proofs for the Wellhausen hypothesis. Down to the 7th century BC it is claimed that there are no signs that a distinction was made between the persons who had charge of the cults in Israel, and this is held to be proved by the history of the preceding period and by the Book of Deuteronomy, placed by the critics in this time. It is said that Ezekiel is the first to change this, and in this passage introduces the distinction between priests and the lower order of Levites, which difference is then presupposed by the Priestly Code. According to this view, the high priest of the Priestly Code, too, would not yet be known to Ezekiel, and would not yet exist in his time. More fully expressed, the development would have to be thought as follows: the Book of Deuteronomy, which abolished the service on the high places, and had introduced the concentration of the cults, had in a humane way provided for the deposed priests who had been serving on the high places, and, in <a onClick="return mV(\'Eze\',18,6);">18:6</a>ff, had expressly permitted them to perform their work in Jerusalem, as did all of their brethren of their tribe, and to enjoy the same income as these. While all the other Deuteronomic commands had in principle been recognized, this ordinance alone had met with opposition: for in <a onClick="return mV(\'2Ki\',23,9);">2Ki 23:9</a> we are expressly told that the priests of the high places were not permitted to go up to Jerusalem. Ezekiel now, according to Wellhausen\'s statement, "hangs over the logic of the facts a moral mantle," by representing the deposition of the priests of the high places as a punishment for the fact that they were priests of the high places, although they had held this position in the past by virtue of legal right.<P>It is indeed true, it is said, that these priests did not submit to such a representation of the case and such treatment. The violent contentions which are said to have arisen in consequence are thought to have their outcome expressed in <a onClick="return mV(\'Num\',16,\'1-\');">Nu 16</a>f (the rebellion of Korah, the budding staff of Aaron). The Priestly Code, however, continued to adhere to the distinction once it had been introduced, and had become a fact already at the return in 538 BC (compare <a onClick="return mV(\'Ezr\',2,36);">Ezr 2:36</a>ff), even if it was found impossible to limit the priesthood to the Zadokites, and if it was decided to make an honorable office out of the degraded position of the Levites as given by Ezekiel. The fact that, according to <a onClick="return mV(\'Ezr\',2,\'36-39\');">Ezr 2:36-39</a>, in the year 538 BC, already 4,289 priests, but according to verse <a onClick="return mV(\'Ezr\',2,40);">40</a>, only 74 Levites, returned, is also regarded as proving how dissatisfied the degraded priests of the high places had been with the new position, created by Ezekiel, to which they had been assigned. With the introduction of the P Codex in 444 BC, which made a distinction between high priest, priests and Levites within the tribe of Levi, this development reached an end for the time being. While Deuteronomy speaks of the "Levitical priests," which expression is regarded as confirming the original identity of the priests and the Levites, it is claimed that since the days of Ezekiel, priests and Levites constitute two sharply distinguished classes.<P>(c) Examination of Theory:<P>Both the exegesis of <a onClick="return mV(\'Eze\',44,4);">Eze 44:4</a>ff and the whole superstructure are in every direction indefensible and cannot be maintained (compare also my work, Are the Critics Right? 30ff, 124ff, 196ff).<P>(i) Not Tenable for Preexilic Period:<P>Proof that the hypothesis cannot be maintained for the preexilic period. The claim that down to the 7th century BC there did not exist in Israel any distinction among the persons engaged in the public cults is in itself an absurdity, but has in addition against it the express testimony of history. In preexilic times the high priest is expressly mentioned in <a onClick="return mV(\'2Ki\',12,9);">2Ki 12:9</a>ff; <a onClick="return mV(\'2Ki\',22,4,8);">22:4,8</a>; <a onClick="return mV(\'2Ki\',23,4);">23:4</a>. Accordingly he cannot have been a product of the post-exilic period. The rank of an Eli (<a onClick="return mV(\'1Sa\',1,\'1-\');">1Sa 1</a>ff), Ahimelech (<a onClick="return mV(\'1Sa\',21,\'1-\');">1Sa 21</a>f), Abiathar (<a onClick="return mV(\'1Ki\',2,26);">1Ki 2:26</a>f), Zadok (<a onClick="return mV(\'1Ki\',2,35);">1Ki 2:35</a>), is vastly above that of an ordinary priest. The fact that the expression "high priest" does not happen to occur here is all the less to be pressed, as the term is found even in the Priestly Code only in <a onClick="return mV(\'Lev\',21,10);">Le 21:10</a>; <a onClick="return mV(\'Num\',35,\'25-28\');">Nu 35:25-28</a>. From <a onClick="return mV(\'Deu\',10,6);">De 10:6</a>; <a onClick="return mV(\'Jos\',24,33);">Jos 24:33</a>; <a onClick="return mV(\'Jdg\',20,28);">Jud 20:28</a>, we learn that the office of high priest was transmitted from Aaron to his son, Eleazar, and then to his son, Phinehas (compare also <a onClick="return mV(\'Num\',25,11);">Nu 25:11</a>). Before the time of Eli, according to <a onClick="return mV(\'1Ch\',24,3);">1Ch 24:3</a>, it had passed over to the line of the other surviving son of Aaron, that of Ithamar, but, according to <a onClick="return mV(\'1Ki\',2,26);">1Ki 2:26</a>f; <a onClick="return mV(\'1Ki\',2,35);">35</a>, at the deposition of Abiathar and the appointment of Zadok, it returned again to the line of Eleazar (compare <a onClick="return mV(\'1Sa\',2,27,28,35);">1Sa 2:27,28,35</a>f with <a onClick="return mV(\'1Ch\',24,3);">1Ch 24:3</a>). Distinctions within the tribe are also expressly presupposed by <a onClick="return mV(\'Jer\',20,1);">Jer 20:1</a>; <a onClick="return mV(\'Jer\',29,25);">29:25</a>f; <a onClick="return mV(\'Jer\',29,29);">29</a>; <a onClick="return mV(\'Jer\',52,24);">52:24</a>; <a onClick="return mV(\'2Ki\',25,18);">2Ki 25:18</a>. In the same way Levites are expressly mentioned in history (compare <a onClick="return mV(\'Jdg\',17,\'1-\');">Jud 17</a>f; <a onClick="return mV(\'Jdg\',19,\'1-\');">19</a>; <a onClick="return mV(\'Jdg\',20,\'1-\');">20</a>; <a onClick="return mV(\'Jdg\',21,\'1-\');">21</a>; <a onClick="return mV(\'1Sa\',6,15);">1Sa 6:15</a>; <a onClick="return mV(\'2Sa\',15,24);">2Sa 15:24</a>; <a onClick="return mV(\'1Ki\',8,3);">1Ki 8:3</a>ff). This very division of the priestly tribe into three parts possibly suggested the three parts of the temple of Solomon (the holy of holies, the holy place, the forecourt). According to all this, it is not possible that this distinction is not found in Deuteronomy, especially if this book was not written until the 7th century BC and throughout took into consideration the actual condition of affairs at that time, as is generally claimed. But this difference is found in Deuteronomy, the false dating of which we can here ignore, and is probably suggested by it; for, if this were not the case, then the addition of the words "the whole tribe of Levi" to the words "Levitical priests" in <a onClick="return mV(\'Deu\',18,1);">De 18:1</a> would be tautology. But as it is, both expressions already refer to what follows: namely, <a onClick="return mV(\'Deu\',18,\'3-5\');">18:3-5</a> to the priests and <a onClick="return mV(\'Deu\',18,6);">18:6</a>ff to the rest of the Levites. In the same way, the Levites are in <a onClick="return mV(\'Deu\',18,12,12,18);">12:12,18</a>f
