emiah seems an insufficient reason upon which to base the denial of the claim that Ezra may have been the author.<P>The facts that there is unevenness in the treatment of the history, and that there are long periods on which the narrator is silent, do not militate against the authorship of Ezra nor do they imply a date long after his age; for the author is perfectly consistent in his purpose to stick to the object and plan which he had in view for himself, that is, to give an account of the reestablishment of the Israelite people and of their Divinely given institutions. That he has omitted other matters-does not imply that he was ignorant of them.<P>7. Languages:<P>The language of the books is Hebrew, except <a onClick="return mV(\'Ezr\',4,\'7-\');">Ezr 4:7-6:18</a> and <a onClick="return mV(\'Ezr\',7,\'12-26\');">7:12-26</a>, which is written in Aramaic. The Hebrew closely resembles that of Daniel, Haggai and Chronicles, much more so than it does that of Ecclesiasticus, which was written probably about 180 BC. The Aramaic (formerly called Chaldee) is very much like that of the Egyptian papyri which are dated in the 5th century BC. It closely resembles also the Aramaic in Daniel.<P>8. Historicity:<P>Neither language nor style can be assigned as a ground for asserting a date later than the 5th century BC as the time of the composition of the book. A much stronger reason against placing the final redaction of the books at so early a time is the mention of a Jaddua among the high priests in <a onClick="return mV(\'Neh\',12,11,22);">Ne 12:11,22</a>, it being assumed that this is the same Jaddua whom Josephus mentions (Ant., XI, viii, 4) as having filled the high-priestly office in the time of Alexander the Great. In view of the fact that Josephus is the only source of information as to the period between 400 and 300 BC, it seems unfair to accept what he says as to the existence of this Jaddua, while rejecting substantially all the rest of the same chapter in Josephus which tells about Sanballat, Manasseh and Alexander\'s meeting with Jaddua. Inasmuch as the Sachau papyri, written in the 17th year of Darius Nothus, that is, in 410-408 BC, mention the sons of Sanballat the governor of Samaria, the Sanballat who was their father must have lived about 450 BC. The same papyrus mentions Jehohanan (Johnnan of <a onClick="return mV(\'Neh\',12,22);">Ne 12:22</a>) as the high priest of the temple at Jerusalem, and Bagohi (Bagoas) was the Persian governor of Jerusalem in 410-408 BC. Since, according to <a onClick="return mV(\'Neh\',13,6);">Ne 13:6</a>, Nehemiah was governor in 434-433 BC, the 32nd year of Artaxerxes, Bagoas would be perhaps his immediate successor. If we are to put any confidence in the story of Josephus, then there must have been at least two Sanballats, and probably two Jadduas, and at two different times a son of a high priest must have married a daughter of a Sanballat. While this is not impossible, it seems better to suppose that Josephus has confused matters beyond any possibility of disentanglement, and we might be justified in throwing over entirely his account of a Sanballat, a Manasseh, and a Jaddua as living in the year 330 BC, when Alexander conquered Syria. As far, of course, as the Jaddua of <a onClick="return mV(\'Neh\',12,11,22);">Ne 12:11,22</a> is concerned, he may well have been high priest as early as 406 BC, and have continued to serve till 330 BC. On the other hand, another of the same name, probably a grandson, may, for all we know to the contrary, have been high priest in 330 BC. In view of the numerous Oniases, Simons, and Johns who served in that position between 600 and 150 BC, and in view, further, of our almost absolute lack of information as to the history of this period, it will be a bold man who will dare to deny, on the ground of the Jaddua of Josephus, that Ezra-Nehemiah might have been written as early as 4OO BC.<P>The objection against the books having been composed in the Persian period, based upon the use of the titles of the kings of Persia, is fully answered by the fact that the same titles as those used in these books are found to have been used by the Persian kings themselves. (See the articles of the present writer in the Presbyterian Reformed Review for 1905-6.) The "Darius the Persian" of <a onClick="return mV(\'Neh\',12,22);">Ne 12:22</a> is shown by the Sachau papyri to have been Darius Notbus, as Keil long ago suggested. The author may have called him "the Persian" to distinguish him from Darius the Mede. At any rate, it is best for us to remember that our inability to explain why the author called him by this title does not prove that he did not do so. Of all the Dariuses known to history, any one might have been called "the Persian," except Darius the Mede, because all but he were Persians. The assertion that a king of Persia could only have been called a Persian "after the Persian period was past" involves, on the one hand, the assumption of such thorough knowledge of the possibilities of the usus loquendi of that time, and, on the other hand, such real ignorance of the usage of all times in such matters, as well as of the usage of the Persian and Babylonian monuments of the Persian era, as almost to cause one to believe that it can scarcely have been seriously made. (See the writer\'s articles cited above.) Josephus, it is true, apparently confuses in his account Darius II and Darius III.<P>The phrase "the days of Nehemiah" (<a onClick="return mV(\'Neh\',12,26);">Ne 12:26</a>) certainly implied that the final redactor "looked back upon them as past." But there is no intimation as to how long they were past. According to <a onClick="return mV(\'Neh\',5,14);">Ne 5:14</a>, Nehemiah returned to Babylon in the 32nd year of Artaxerxes, that is, in 434 BC. As Bagoas was already governor of Jerusalem, and Johnnan high priest in 408 BC, a writer living about 400 BC can very well have referred to what happened "in the days of Joiakim...and in the days of Nehemiah the governor, and of Ezra the priest and the scribe" as having occurred "in the days of Zerubbabel, and in the days of Nehemiah" (<a onClick="return mV(\'Neh\',12,47);">Ne 12:47</a>). From all we know it appears that these were the only Jews who were ever governors of Jerusalem under the Persian domination. Certainly Bagoas is not a Hebrew name any more than Sanballat, and it looks as if on the death of Nehemiah his place as governor of Jerusalem had been filled by a native Persian just as the governorship of Samaria was held by Sanballat, a Cuthean. If we can trust Josephus, Bagoas treated the Jews with harshness and even desecrated the temple itself (Ant., XI, vii, 1). Already, then, in 405 BC, any patriotic and pious Israelite may have justly looked back upon the days of their native governors with longing and pride, and have written with appropriate eulogy of the days of Zerubbabel, Nehemiah and Ezra—the time of his people\'s semi-independence and of the glorious and unforgetable restoration of the temple and city, just as we today refer to the time of Bismarck, Victoria, or Lincoln (compare <a onClick="return mV(\'1Ch\',13,3);">1Ch 13:3</a>). Waiving the discussion of the probability of Ezra\'s having called himself "a ready scribe in the law of Moses," and one who had prepared his heart to seek the law of the Lord, etc., it certainly cannot be denied that someone writing in 405 BC may have employed the language here used. There is not the slightest proof that any of Ezra-Nehemiah is unhistorical, nor the least indication that all of it may not have been written as early as 405 BC. The section <a onClick="return mV(\'Ezr\',4,\'1-6\');">Ezr 4:1-6</a> presents difficulties of date and composition. The section may have been misplaced. It may be episodical. It may be explained, as suggested by Klostermann, as having been inserted here as a sort of resume which is later expanded. But however explained, it is a literary rather than a historical or linguistic problem which it presents, and may safely be left for solution to those who think that everything in literature whose purpose or meaning they cannot perceive is therefore inexplicable.<P>In conclusion, we Would say in the words of Professor Cornill, that since Ed. Meyer\'s demonstration of the authenticity of the documents in <a onClick="return mV(\'Ezr\',4,\'1-\');">Ezr 4-7</a>, the hypercritical reconstruction of the books "has lost all claim to serious consideration, and we may rest assured that in Ezra-Nehemiah we have every reason to recognize an essentially trustworthy recital of the events narrated therein."<P>9. Text:<P>The most thorough investigation of the text of Ezra-Nehemiah has been made by Professor A. Klostermann, his results being published in the 3rd German edition of RE. After an examination of the Arabic, Syriac, Greek and Latin versions and a comparison of them with the Hebrew Massoretic Text, he comes to the conclusion that our Hebrew text as a whole is of more value than that represented by the versions. The writer of this article has noted a wonderful accuracy in the transmission of the Aramaic part of Ezra, the spelling or writing of the words resembling in many of the smallest particulars that of the Aramaic papyri of Elephantine, which date from the 5th century BC.<P>LITERATURE.<P>Commentaries and Introductions: A, Introductions: Sayce, Introduction to Ezra, Nehemiah, Esther; Angus-Suen, The Cyclopedic Hand-Book to the Bible; Rarnu, Introduction to the Old Testament; Keil, Old Testament Intro. B, Commentaries: Keil, Ezra, Nehemiah, and Esther; Rawlinson, in the Speaker\'s Comm., and in the Pulpit Commentary; and in Ezra and Nehemiah ("Men of the Bible" series); Lange\'s Comm.; Meyer, Entstehung des Judenthums; OTJC2; RE2.``196';
isbe[3340]='Ezrahite`ez\'-ra-hit (\'ezrachi; Asebon):<P>Found in <a onClick="return mV(\'1Ki\',4,31);">1Ki 4:31</a>; <a onClick="return mV(\'Psa\',88,1);">Psalm 88</a>; <a onClick="return mV(\'Psa\',89,1);">Psalm 89, titles</a>; from which it appears that the word is a patronymic for Ethan and Heman. It may be derived from Zerah, instead of Ezrah, seeing that there were an Ethan and a Heman who were descendants of Zerah, head of a Judahite family (<a onClick="return mV(\'1Ch\',2,6);">1Ch 2:6</a>).<P>There were also an Ethan and a Heman who were Levites (<a onClick="return mV(\'1Ch\',15,17);">1Ch 15:17</a>).``1';
isbe[3341]='Ezri`ez\'-ri (\'ezri, "my help"; Ezrai, or Ezdri):<P>"Ezri, the son of Chelub," appointed by David to be superintendent of agriculture (<a onClick="return mV(\'1Ch\',27,26);">1Ch 27:26</a>).``1';
isbe[3342]='Ezril`ez\'-ril (Ezril, the King James Version Esril):<P>One who had married a foreign wife (1Esdras 9:34); called Azarel in <a onClick="return mV(\'Ezr\',10,41);">Ezr 10:41</a>.``1';
isbe[3343]='Fable`fa\'-b\'-l (muthos):<P>(1) Primitive man conceives of the objects around him as possessing his own characteristics. Consequently in his stories, beasts, trees, rocks, etc., think, talk and act exactly as if they were human beings. Of course, but little advance in knowledge was needed to put an end to this mode of thought, but the form of story-telling developed by it persisted and is found in the folk-tales of all nations. More particularly, the archaic form of story was used for the purpose of moral instruction, and when so used is termed the fable. Modern definitions distinguish it from the parable<P>(a) by its use of characters of lower intelligence than man (although reasoning and speaking like men), and<P>(b) by its lesson for this life only. But, while these distinctions serve some practical purpose in distinguishing (say) the fables of Aesop from the parables of Christ, they are of little value to the student of folk-lore. For fable, parable, allegory, etc., are all evolutions from a common stock, and they tend to blend with each other.<P>See <a href="./study/isbe/search.html?string=ALLEGORY">ALLEGORY</a>; <a href="./study/isbe/search.html?string=PARABLE">PARABLE</a>.<P>(2) The Semitic mind is peculiarly prone to allegorical expression, and a modern Arabian storyteller will invent a fable or a parable as readily as he will talk. And we may be entirely certain that the very scanty appearance of fables in the Old Testament is due only to the character of its material and not at all to an absence of fables from the mouths of the Jews of old. Only two examples have reached us. In <a onClick="return mV(\'Jdg\',9,\'7-15\');">Jud 9:7-15</a> Jotham mocks the choice of AbimeItch as king with the fable of the trees that could find no tree that would accept the trouble of the kingship except the worthless bramble. And in <a onClick="return mV(\'2Ki\',14,9);">2Ki 14:9</a> Jehoash ridicules the pretensions of Amaziah with the story of the thistle that wished to make a royal alliance with the cedar. Yet that the distinction between fable and allegory, etc., is artificial is seen in <a onClick="return mV(\'Isa\',5,1,2);">Isa 5:1-2</a>, where the vineyard is assumed to possess a deliberate will to be perverse.<P>(3) In the New Testament, "fable" is found in <a onClick="return mV(\'1Ti\',1,4);">1Ti 1:4</a>; <a onClick="return mV(\'1Ti\',4,7);">4:7</a>; <a onClick="return mV(\'2Ti\',4,4);">2Ti 4:4</a>; <a onClick="return mV(\'Tts\',1,14);">Tit 1:14</a>; <a onClick="return mV(\'2Pe\',1,16);">2Pe 1:16</a>, as the translation of muthos ("myth"). The sense here differs entirely from that discussed above, and "fable" means a (religious) story that has no connection with reality—contrasted with the knowledge of an eyewitness in <a onClick="return mV(\'2Pe\',1,16);">2Pe 1:16</a>. The exact nature of these "fables" is of course something out of our knowledge, but the mention in connection with them of "endless genealogies" in <a onClick="return mV(\'1Ti\',1,4);">1Ti 1:4</a> points with high probability to some form of Gnostic speculation that interposed a chain of eons between God and the world. In some of the Gnostic systems that we know, these chains are described with a prolixity so interminable (the Pistis Sophia is the best example) as to justify well the phrase "old wives\' fables" in <a onClick="return mV(\'1Ti\',4,7);">1Ti 4:7</a>. But that these passages have Gnostic reference need not tell against the Pauline authorship of the Pastorals, as a fairly well developed "Gnosticism" is recognizable in a passage as early as <a onClick="return mV(\'Col\',2,\'1-\');">Col 2</a>, and as the description of the fables as Jewish in <a onClick="return mV(\'Tts\',1,14);">Tit 1:14</a> (compare <a onClick="return mV(\'Tts\',3,9);">Tit 3:9</a>) is against 2nd-century references. But for details the commentaries on the Pastoral Epistles must be consulted. It is worth noting that in <a onClick="return mV(\'2Ti\',4,4);">2Ti 4:4</a> the adoption of these fables is said to be the result of dabbling in the dubious. This manner of losing one\'s hold on reality is, unfortunately, something not confined to the apostolic age.``48';
isbe[3344]='Face`fas: In Hebrew the translation of three expressions:<P>(1) panim<P>(2) \'ayin, literally, "eye" and<P>(3) \'aph, literally, "nose," "nostril," already noted under the word <a href="./study/isbe/search.html?string=COUNTENANCE">COUNTENANCE</a>, which see.<P>The first and second of these words are used synonymously, even in metaphorical expressions, as, for example in the phrase "the face of the earth," where panim is used (<a onClick="return mV(\'Deu\',6,15);">De 6:15</a> et passim) and \'ayin (<a onClick="return mV(\'Num\',22,5);">Nu 22:5</a> et passim). The third expression preserves more clearly its original meaning. It is generally used in the phrases "to bow one\'s self to the earth," "to fall on one\'s face," where the nose actually touched the ground. Often "my face," "thy face" is mere oriental circumlocution for the personal pronoun "I," "me," "thou," "thee." "In thy face" means "in thy presence;" and is often so translated. A very large number of idiomatic Hebrew expressions have been introduced into our language through the medium of the Bible translation. We notice the most important of these phrases.<P>"To seek the face" is to seek an audience with a prince or with God, to seek favor (<a onClick="return mV(\'Psa\',24,6);">Ps 24:6</a>; <a onClick="return mV(\'Psa\',27,8);">27:8</a>; <a onClick="return mV(\'Psa\',105,4);">105:4</a>; <a onClick="return mV(\'Pro\',7,15);">Pr 7:15</a>; <a onClick="return mV(\'Hsa\',5,15);">Ho 5:15</a>; compare <a onClick="return mV(\'Pro\',29,26);">Pr 29:26</a>, where the Revised Version (British and American) translates "Many seek the ruler\'s favor," literally, many seek the face (Hebrew pene) of a ruler).<P>If God "hides his face" He withdraws His presence, His favor (<a onClick="return mV(\'Deu\',32,20);">De 32:20</a>; <a onClick="return mV(\'Job\',34,29);">Job 34:29</a>; <a onClick="return mV(\'Psa\',13,1);">Ps 13:1</a>; <a onClick="return mV(\'Psa\',30,7);">30:7</a>; <a onClick="return mV(\'Psa\',143,7);">143:7</a>; <a onClick="return mV(\'Isa\',54,8);">Isa 54:8</a>; <a onClick="return mV(\'Jer\',33,5);">Jer 33:5</a>; <a onClick="return mV(\'Eze\',39,23,24);">Eze 39:23-24</a>; <a onClick="return mV(\'Mic\',3,4);">Mic 3:4</a>). Such withdrawal of the presence of God is to be understood as a consequence of man\'s personal disobedience, not as a wrathful denial of God\'s favor (<a onClick="return mV(\'Isa\',59,2);">Isa 59:2</a>). God is asked to "hide his face," i.e. to disregard or overlook (<a onClick="return mV(\'Psa\',51,9);">Ps 51:9</a>; compare <a onClick="return mV(\'Psa\',10,11);">Ps 10:11</a>). This is also the idea of the prayer: "Cast me not away from thy presence" (literally, "face," <a onClick="return mV(\'Psa\',51,11);">Ps 51:11</a>), and of the promise: "The upright shall dwell in thy presence" (literally, "face," <a onClick="return mV(\'Psa\',140,13);">Ps 140:13</a>). If used of men, "to hide the face" expresses humility and reverence before an exalted presence (<a onClick="return mV(\'Exd\',3,6);">Ex 3:6</a>; <a onClick="return mV(\'Isa\',6,2);">Isa 6:2</a>); similarly Elijah "wrapped his face in his mantle" when God passed by (<a onClick="return mV(\'1Ki\',19,13);">1Ki 19:13</a>). The "covering of the face" is a sign of mourning (<a onClick="return mV(\'2Sa\',19,4);">2Sa 19:4</a> = <a onClick="return mV(\'Eze\',12,6,12);">Eze 12:6,12</a>); a "face covered with fatness" is synonymous with prosperity and arrogance (<a onClick="return mV(\'Job\',15,27);">Job 15:27</a>); to have one\'s face covered by another person is a sign of hopeless doom, as if one were already dead. This was done to Human, when judgment had been pronounced over him (<a onClick="return mV(\'Est\',7,8);">Es 7:8</a>).<P>"To turn away one\'s face" is a sign of insulting indifference or contempt (<a onClick="return mV(\'2Ch\',29,6);">2Ch 29:6</a>; <a onClick="return mV(\'Eze\',14,6);">Eze 14:6</a>; Sirach 4:4; compare <a onClick="return mV(\'Jer\',2,27);">Jer 2:27</a>; <a onClick="return mV(\'Jer\',18,17);">18:17</a>; <a onClick="return mV(\'Jer\',32,33);">32:33</a>); on the part of God an averted face is synonymous with rejection (<a onClick="return mV(\'Psa\',13,1);">Ps 13:1</a>; <a onClick="return mV(\'Psa\',27,9);">27:9</a>; <a onClick="return mV(\'Psa\',88,14);">88:14</a>).<P>"To harden the face" means to harden one\'s self against any sort of appeal (<a onClick="return mV(\'Pro\',21,29);">Pr 21:29</a>; <a onClick="return mV(\'Isa\',50,7);">Isa 50:7</a>; <a onClick="return mV(\'Jer\',5,3);">Jer 5:3</a>; compare <a onClick="return mV(\'Eze\',3,9);">Eze 3:9</a>).<P>See also <a href="./study/isbe/search.html?string=SPIT;+SPITTLE">SPIT</a>.<P>In this connection we also mention the phrase "to respect persons," literally, to "recognize the face" (<a onClick="return mV(\'Lev\',19,15);">Le 19:15</a>, or, slightly different in expression, <a onClick="return mV(\'Deu\',1,17);">De 1:17</a>; <a onClick="return mV(\'Deu\',16,19);">16:19</a>; <a onClick="return mV(\'Pro\',24,\'1-\');">Pr 24</a>; <a onClick="return mV(\'Pro\',23,\'1-\');">23</a>; <a onClick="return mV(\'Pro\',28,21);">28:21</a>), in the sense of unjustly favoring a person, or requiting him with undue evil. Compare also the Hebrew hadhar (<a onClick="return mV(\'Exd\',23,3);">Ex 23:3</a> the King James Version), "to countenance" (see under the word).<P>The "showbread" meant literally, "bread of the face," "of the presence," Hebrew lechem panim; Greek artoi enopioi, artoi tes protheseos.``106';
isbe[3345]='Fact`Lit. "a deed."<P>The word occurs only in the heading of the chapter, <a onClick="return mV(\'2Ki\',10,\'1-\');">2Ki 10</a> the King James Version, "Jehu excuseth the fact by the prophecy of Elijah," and in 2Macc 4:36, with reference to the murder of Onias, "certain of the Greeks that abhorred the fact (the deed) also" (summisoponerounton, literally, "hating wickedness together with (others))," the Revised Version (British and American) "the Greeks also joining with them in hatred of the wickedness."``1';
isbe[3346]='Fade`fad (nabhel; maraino): "To fade" is in the Old Testament the translation of nabhel, "to droop or wither," figuratively, "to fade," or "pass way" (<a onClick="return mV(\'Psa\',18,45);">Ps 18:45</a>; <a onClick="return mV(\'Isa\',1,30);">Isa 1:30</a>; <a onClick="return mV(\'Isa\',24,4);">24:4</a>; <a onClick="return mV(\'Isa\',28,1,4);">28:1,4</a>; <a onClick="return mV(\'Isa\',40,7,8);">40:7-8</a>); once it is the translation of balal "to well up," "to overflow"; perhaps from nabhal (<a onClick="return mV(\'Isa\',64,6);">Isa 64:6</a>, "We all do fade as a leaf"); in the New Testament of maraino, "to come to wither or to fade away" (<a onClick="return mV(\'Jam\',1,11);">Jas 1:11</a>, "So also shall the rich man fade away in his ways," the Revised Version (British and American) "in his goings"); compare The <span class="noTag">Wisdom of Solomon 2:8</span>, "Let us crown ourselves with rosebuds, before they be withered" (maraino); amardntinos (amaranth), "unfading," occurs in <a onClick="return mV(\'1Pe\',5,4);">1Pe 5:4</a>, "the crown of glory that fadeth not away," and amarantos (<a onClick="return mV(\'1Pe\',1,4);">1Pe 1:4</a>), "an inheritance...that fadeth not away"; compare The <span class="noTag">Wisdom of Solomon 6:12</span>, "Wisdom is glorious (the Revised Version (British and American) "radiant"), and fadeth not away."<P>For "fade" (<a onClick="return mV(\'Eze\',47,12);">Eze 47:12</a>), the Revised Version (British and American) has "wither"; for "fall" "falleth" "falling" (<a onClick="return mV(\'Isa\',34,4);">Isa 34:4</a>), "fade," "fadeth," "fading".``185';
isbe[3347]='Fail`fal (kalah, karath; ekleipo): "Fail" is both intransitive, "to fall short," "be wanting," and trans, "to be wanting to."<P>Of the many words translated "fail" in the Old Testament, kalah is the most frequent, meaning "to be consumed," "ended" (<a onClick="return mV(\'Job\',11,20);">Job 11:20</a>; <a onClick="return mV(\'Job\',17,5);">17:5</a>; <a onClick="return mV(\'Psa\',69,3);">Ps 69:3</a>; <a onClick="return mV(\'Psa\',71,9);">71:9</a>, etc.; <a onClick="return mV(\'Pro\',22,8);">Pr 22:8</a>; <a onClick="return mV(\'Isa\',15,6);">Isa 15:6</a>, etc.; <a onClick="return mV(\'Jer\',14,6);">Jer 14:6</a>; <a onClick="return mV(\'Lam\',2,11);">La 2:11</a>; <a onClick="return mV(\'Lam\',3,22);">3:22</a>; <a onClick="return mV(\'Lam\',4,17);">4:17</a>); it is the translation of karath, "to be cut off" (<a onClick="return mV(\'2Sa\',3,29);">2Sa 3:29</a>, of failure in succession; so <a onClick="return mV(\'1Ki\',2,4);">1Ki 2:4</a>, etc.); \'adhar, "to marshal," "to be missed" or "lacking" (<a onClick="return mV(\'Isa\',34,16);">Isa 34:16</a> the King James Version; <a onClick="return mV(\'Isa\',40,26);">Isa 40:26</a> the King James Version; <a onClick="return mV(\'Isa\',59,15);">Isa 59:15</a> the King James Version; <a onClick="return mV(\'Zep\',3,5);">Ze 3:5</a>); of raphah, "to become faint" or "to make feeble" (<a onClick="return mV(\'Deu\',31,6,8);">De 31:6,8</a>; "I will not fail thee, nor forsake thee," <a onClick="return mV(\'Jos\',1,5);">Jos 1:5</a>; <a onClick="return mV(\'1Ch\',28,20);">1Ch 28:20</a>); of\'-abhadh, "to perish," "be lost" (<a onClick="return mV(\'Psa\',142,4);">Ps 142:4</a>, "Refuge hath failed me"; <a onClick="return mV(\'Eze\',12,22);">Eze 12:22</a>, "Every vision faileth"). Many other Hebrew words are translated "fail," "faileth," for the most part in single instances.<P>In the New Testament, ekleipo, "to leave out" or "off," is thrice rendered "fail" (<a onClick="return mV(\'Luk\',16,9);">Lu 16:9</a> "when it shall fail"; <a onClick="return mV(\'Luk\',22,32);">Lu 22:32</a>, "that thy faith fail not"; <a onClick="return mV(\'Hbr\',1,12);">Heb 1:12</a>, "Thy years shall not fail"); ekpipto, "to fall off or away" (<a onClick="return mV(\'1Cr\',13,8);">1Co 13:8</a>, "Charity (the Revised Version (British and American) "love") never faileth"); katargeo, "to make useless" (<a onClick="return mV(\'1Cr\',13,8);">1Co 13:8</a> the King James Version, "Whether prophecies, they shall fail"); hustereo, "to be behind," "to lack" (<a onClick="return mV(\'Hbr\',12,15);">Heb 12:15</a> the King James Version); apopsucho, "to swoon away," "failing" (<a onClick="return mV(\'Luk\',21,26);">Lu 21:26</a> the King James Version).<P>The Revised Version (British and American) has "fail," in a new translation of <a onClick="return mV(\'Jer\',18,14);">Jer 18:14</a>, for "fall" (<a onClick="return mV(\'Lam\',1,14);">La 1:14</a>, margin "stumble"); "his hand fail" for "fallen in decay" (<a onClick="return mV(\'Lev\',25,35);">Le 25:35</a>); "I will in no wise fail thee" for "I will never leave thee" (<a onClick="return mV(\'Hbr\',13,5);">Heb 13:5</a>; compare <a onClick="return mV(\'Deu\',31,6);">De 31:6</a>; <a onClick="return mV(\'Jos\',1,5);">Jos 1:5</a>); "failed to enter" for "entered not" (<a onClick="return mV(\'Hbr\',4,6);">Heb 4:6</a>); "faileth" (American Standard Revised Version) for "ceaseth" (<a onClick="return mV(\'Psa\',49,8);">Ps 49:8</a>), the English Revised Version "must be let alone for ever"; "failing" for "was darkened" (<a onClick="return mV(\'Luk\',23,45);">Lu 23:45</a>); for "fail" (<a onClick="return mV(\'Ezr\',4,22);">Ezr 4:22</a>), "be slack," "be missing" (<a onClick="return mV(\'Isa\',34,16);">Isa 34:16</a>); "falleth short of" (<a onClick="return mV(\'Hbr\',12,15);">Heb 12:15</a>, maqrgin, "falleth bacf from"); for "failed," "was all spent" (<a onClick="return mV(\'Gen\',47,15);">Ge 47:15</a>); "wholly" (<a onClick="return mV(\'Jos\',3,16);">Jos 3:16</a>); "fail (in looking)" (<a onClick="return mV(\'Lam\',4,17);">La 4:17</a>); for "faileth," "is lacking" (<a onClick="return mV(\'Isa\',40,26);">Isa 40:26</a>; <a onClick="return mV(\'Isa\',59,15);">59:15</a>); for "men\'s hearts failing them" (<a onClick="return mV(\'Luk\',21,26);">Lu 21:26</a>), "men fainting," margin "expiring."``185';
isbe[3348]='Fain`fan (advb.): Occurs twice in English Versions of the Bible, in the sense of "gladly":<P>(1) in <a onClick="return mV(\'Job\',27,22);">Job 27:22</a> as the rendering of barach, "to flee with haste" (from anything), "He would fain flee out of his hand," literally, as in in of the King James Version, "in fleeing he would flee";<P>(2) in <a onClick="return mV(\'Luk\',15,16);">Lu 15:16</a>, as the translation of epithumeo, "to fix the mind or desire on," "He would fain have filled his belly with the husks which the swine did eat." the Revised Version (British and American) adds two instances:<P>(1) <a onClick="return mV(\'Luk\',13,31);">Lu 13:31</a>, "Herod would fain kill thee";<P>(2) <a onClick="return mV(\'Act\',26,28);">Ac 26:28</a>, "Thou wouldest fain make me a Christian."`<a href="./study/isbe/search.html?string=ALMOST">ALMOST</a>`1';
isbe[3349]='Faint`fant (\'ayeph, \'uph, ya\'aph, \'alaph, ataph, dawway, yaghea\', macac, rakhakh, paghar, kahah; ekluo, ekkakeo, kamno): The Hebrew vocabulary for the depressing physical conditions and mental emotions which are rendered in the King James Version by the English words "faint," "fainthess," and other compounds of that stem, is, as will be seen above, wide and varied in derivation. The 11 Hebrew and 3 Greek words and their derivatives are used in 62 passages in the King James Version to express these conditions.<P>\'Ayeph is used to express the exhaustion from fatigue and hunger in the case of Esau (<a onClick="return mV(\'Gen\',25,29,30);">Ge 25:29-30</a>). This and its variants come from a root which primarily means "to cover or conceal," therefore "to be dark or obscure," and so, figuratively, "to be faint or depressed." Israel\'s helpless state when harassed by Amalek (<a onClick="return mV(\'Deu\',25,18);">De 25:18</a>) and the plight of Gideon\'s weary force when they sought in vain for help at Succoth (<a onClick="return mV(\'Jdg\',8,4);">Jud 8:4</a>) are described by the same word. Isaiah also uses it to picture the disappointed and unsatisfied appetite of the thirsty man awakening from his dream of refreshment (<a onClick="return mV(\'Isa\',29,8);">Isa 29:8</a>). In <a onClick="return mV(\'2Sa\',16,14);">2Sa 16:14</a>, \'ayephim is probably a proper name of a place (Revised Version, margin).<P>\'Uph in <a onClick="return mV(\'1Sa\',14,\'28-31\');">1Sa 14:28-31</a> describes the exhaustion of Saul\'s host in pursuit of the Philistines after the battle of Michmash. The same word expresses the failure of David\'s strength when in conflict with the same foes, which led to his imminent peril and to the consequent refusal of the commander of his army to allow him to take part personally in the combat (<a onClick="return mV(\'2Sa\',21,15);">2Sa 21:15</a>).<P>Ya\'-aph is used by Ziba when he brought refreshments to David\'s men on the flight from Absalom (<a onClick="return mV(\'2Sa\',16,2);">2Sa 16:2</a>); see also its use in <a onClick="return mV(\'Isa\',40,28);">Isa 40:28</a>. Cognate verbal forms occur in <a onClick="return mV(\'Isa\',40,30,31);">Isa 40:30-31</a>; <a onClick="return mV(\'Jer\',2,24);">Jer 2:24</a>; <a onClick="return mV(\'Jer\',51,58,64);">51:58,64</a>; <a onClick="return mV(\'Hab\',2,13);">Hab 2:13</a>, as also in <a onClick="return mV(\'Jdg\',8,15);">Jud 8:15</a>, meaning in all cases the faintness or exhaustion of fatigue or weariness.<P>\'Alpah expresses the faintness from thirst in <a onClick="return mV(\'Amo\',8,13);">Am 8:13</a>, or from the heat of the sun (<a onClick="return mV(\'Jon\',4,8);">Jon 4:8</a>), and figuratively, the despondency which was the result of the captivity (<a onClick="return mV(\'Isa\',51,20);">Isa 51:20</a>). Ezekiel uses it allegorically as describing the withering of the trees for grief at the death of the Assyrian kings (<a onClick="return mV(\'Eze\',31,15);">Eze 31:15</a>).<P>\'ATaph is the weariness of the wanderers in the desert (<a onClick="return mV(\'Psa\',107,5);">Ps 107:5</a>), the faintness from hunger (<a onClick="return mV(\'Lam\',2,19);">La 2:19</a>), or the despondency of Jonah dispelled by his remembrance of God\'s mercies (<a onClick="return mV(\'Jon\',2,7);">Jon 2:7</a>).<P>Dawway, from a root which signifies the sickness produced by exhaustion from loss of blood, is used in <a onClick="return mV(\'Isa\',1,5);">Isa 1:5</a> for the faintness of heart, the result of remorse for sin, and in <a onClick="return mV(\'Jer\',8,18);">Jer 8:18</a> for the prophet\'s sorrow for the sins of Israel. A cognate form expresses his sorrow on account of the judgments of God which were incurred as punishments for the national backsliding (<a onClick="return mV(\'Lam\',1,13);">La 1:13-12</a>; <a onClick="return mV(\'Lam\',5,17);">5:17</a>).<P>Macac, literally, "dissolving or melting," is applied to the contagious fear which the example of a cowardly soldier produces among his comrades (<a onClick="return mV(\'Deu\',20,8);">De 20:8</a>, the Revised Version (British and American) "melt"). In the remarkable passage in <a onClick="return mV(\'Isa\',10,18);">Isa 10:18</a>, in which God pronounces the doom of Assyria when his purposes of chastisement on Israel have been fulfilled, the collapse of Assyria is said to be "as when a standard-bearer fainteth." For this the Revised Version, margin substitutes "as when a sick man pineth away," which is probably the correct rendering. The word macac may mean either a sick man, or else something glittering and seen from afar, such as a standard, but the former sense is more intelligible and suggestive in the context. The rarely used verbal form cognate to macac is used on account of its assonance. Yaghea\' (yagha\'), which is usually translated "grieved" or "tormented" or "fatigued," is rendered as "fainted" in <a onClick="return mV(\'Jer\',45,3);">Jer 45:3</a>. This passage, "I fainted in my sighing" the King James Version, is in Hebrew the same as that which reads, "I am weary with my groaning" in <a onClick="return mV(\'Psa\',6,6);">Ps 6:6</a>, and is similarly rendered in the Revised Version (British and American).<P>Rakhakh, like macac, primarily signifies "to melt" or "to become soft," and is used in prophetic exhortations in which the people are encouraged not to be panic-stricken in the presence of enemies (<a onClick="return mV(\'Deu\',20,3);">De 20:3</a>, and also <a onClick="return mV(\'Jer\',51,46);">Jer 51:46</a>; <a onClick="return mV(\'Isa\',7,4);">Isa 7:4</a>). Another related word, morekh, in the sense of despair and utter loss of courage, is used in expressing the consequences of God\'s wrath against Israel (<a onClick="return mV(\'Lev\',26,36);">Le 26:36</a>). In its literal sense it signifies "blandness," as of the words of a hypocritical enemy (<a onClick="return mV(\'Psa\',55,21);">Ps 55:21</a>).<P>Paghar is the prostration of utter fatigue whereby one is unable to raise himself or to proceed on a journey, as were some of David\'s little band (<a onClick="return mV(\'1Sa\',30,\'10-21\');">1Sa 30:10-21</a>). A cognate word describes the prostration of amazement and incredulity with which Jacob heard of Joseph\'s condition in Egypt (<a onClick="return mV(\'Gen\',45,26);">Ge 45:26</a>).<P>Kahah, the pining of earnest, longing desire, is translated "fainteth" in <a onClick="return mV(\'Psa\',84,2);">Ps 84:2</a>; <a onClick="return mV(\'Psa\',119,81);">119:81</a>; elsewhere it is rendered by words expressing wasting or languishing. The panic in Canaan due to famine is expressed (<a onClick="return mV(\'Gen\',47,13);">Ge 47:13</a>) by the word lahah, which implies a state of frenzy.<P>The only records of actual fainting are<P>(1) Daniel, in <a onClick="return mV(\'Dan\',8,27);">Da 8:27</a>, where the word used is the Niphal of the verb hayah, literally, "became," meaning that he became weak;<P>(2) swooning is mentioned in Additions to <a onClick="return mV(\'Est\',5,\'7-14\');">Esther 5:7-14</a>.<P>In the New Testament "faint" is used in the sense of physical exhaustion (<a onClick="return mV(\'Mat\',9,36);">Mt 9:36</a> the King James Version; <a onClick="return mV(\'Mat\',15,32);">Mt 15:32</a>; <a onClick="return mV(\'Mar\',8,3);">Mr 8:3</a>), where it is part of the verb ekluo, "to relax." Otherwise it is used figuratively of discouragement of spirit. The same verb is used in <a onClick="return mV(\'Gal\',6,9);">Ga 6:9</a>; <a onClick="return mV(\'Hbr\',12,3,5);">Heb 12:3,5</a>; but in <a onClick="return mV(\'Luk\',18,1);">Lu 18:1</a>; <a onClick="return mV(\'2Cr\',4,\'1-16\');">2Co 4:1-16</a>; <a onClick="return mV(\'Eph\',3,13);">Eph 3:13</a> it is part of the verb ekkakeo (according to some authorities egkakeo, pronounced enkakeo, meaning "to be faint-hearted" or "to be culpably negligent"). In <a onClick="return mV(\'Rev\',2,3);">Re 2:3</a> it is kopiao, literally, "to be tired."``107';
isbe[3350]='Fair`far: The word translated in the King James Version from 9 Hebrew and 4 Greek expressions has nowhere in the Bible the modern sense of "blond," "fair-skinned." The translation of <a onClick="return mV(\'Isa\',54,11);">Isa 54:11</a>, "fair colors," refers to the cosmetic use of pukh, stibium, antimony powder, with which black margins were painted around the eyelids, so as to make the eyes appear large and dark. The stones of rebuilt Jerusalem, beautifully laid in their black mortar, are compared with such eyes. We can distinguish the following varieties of meaning:<P>(1) Beautiful, attractive, Tobh, yaphah, yapheh; Aramaic shappir; Septuagint kalos; in the New Testament asteios. This latter word is in both places where it is found used of Moses (<a onClick="return mV(\'Act\',7,20);">Ac 7:20</a>; <a onClick="return mV(\'Hbr\',11,23);">Heb 11:23</a>, the Revised Version (British and American) "goodly"), and means literally, town bred (as opposed to boorish), polite, polished in manners, urbane, then nice, pretty.<P>(2) Pure, free of defilement, the Revised Version (British and American) "clean," Tahor (<a onClick="return mV(\'Zec\',3,5);">Zec 3:5</a>).<P>(3) "Fair speech," plausible, persuasive (leqah, <a onClick="return mV(\'Pro\',7,21);">Pr 7:21</a>; eulalos, Sirach 6:5; compare eulogia, <a onClick="return mV(\'Rom\',16,18);">Ro 16:18</a>).<P>(4) Making a fine display (euprosopein, <a onClick="return mV(\'Gal\',6,12);">Ga 6:12</a>, "to make a fair show").<P>(5) Good (of weather) (zahabh, "golden," "clear," <a onClick="return mV(\'Job\',37,22);">Job 37:22</a>, the Revised Version (British and American) "golden splendor"); eudia (<a onClick="return mV(\'Mat\',16,2);">Mt 16:2</a>).``106';
isbe[3351]='Fair Havens`far ha\'-v\'-nz (Kaloi Limenes): A roadstead on the south coast of Crete, about 5 miles east of Cape Matala, the most southerly point of the island. The harbor is formed by a bay, open to the east, and sheltered on the southwest by two small islands. Here Paul waited for a considerable time (<a onClick="return mV(\'Act\',27,9);">Ac 27:9</a>); but while it afforded good anchorage and a shelter from north and northwest winds, "the haven was not commodious to winter in" (<a onClick="return mV(\'Act\',27,8,12);">Ac 27:8,12</a>).`<a href="./study/isbe/search.html?string=CRETE">CRETE</a>`1';
isbe[3352]='Fairs`farz: Found only 5 times in the King James Version (<a onClick="return mV(\'Eze\',27,12,14,16,19,27);">Eze 27:12,14,16,19,27</a>), apparently incorrect translation of \'izzabhon, according to modern Hebraists (though Gesenius gives "fair" as one of its meanings). The Septuagint translates the Hebrew of the above five passages by two different words, agora, "market-place" (<a onClick="return mV(\'Eze\',27,12,14,16,19);">Eze 27:12,14,16,19</a>), and misthos, "hire," "pay" (<a onClick="return mV(\'Eze\',27,27,33);">Eze 27:27,33</a>). The King James Version follows the Wyclif version in <a onClick="return mV(\'Eze\',27,12);">Eze 27:12</a> and the Geneva version throughout, although it properly translates "wares" in <a onClick="return mV(\'Eze\',27,33);">Eze 27:33</a>. the Revised Version (British and American) gives "<a href="./study/isbe/search.html?string=WARES">wares</a>" (which see) throughout.``1';
isbe[3353]='Faith`fath:<P>1. Etymology<P>2. Meaning: a Divergency<P>3. Faith in the Sense of Creed<P>4. A Leading Passage Explained<P>5. Remarks<P>6. Conclusion<hr /><P>In the Old Testament (the King James Version) the word occurs only twice: <a onClick="return mV(\'Deu\',32,20);">De 32:20</a> (\'emun); <a onClick="return mV(\'Hab\',2,4);">Hab 2:4</a> (\'emunah). In the latter the Revised Version (British and American) places in the margin the alternative rendering, "faithfulness." In the New Testament it is of very frequent occurrence, always representing pistis, with one exception in the King James Version (not the Revised Version (British and American)), <a onClick="return mV(\'Hbr\',10,23);">Heb 10:23</a>, where it represents elpis, "hope."<P>1. Etymology:<P>The history of the English word is rather interesting than important; use and contexts, alike for it and its Hebrew and Greek parallels, are the surest guides to meaning. But we may note that it occurs in the form "feyth," in Havelok the Dane (13th century); that it is akin to fides and this again to the Sanskrit root bhidh, "to unite," "to bind." It is worth while to recall this primeval suggestion of the spiritual work of faith, as that which, on man\'s side, unites him to God for salvation.<P>2. Meaning: a Divergency:<P>Studying the word "faith" in the light of use and contexts, we find a bifurcation of significance in the Bible. We may word distinguish the two senses as the passive and the active; on the one side, "fidelity," "trustworthiness"; and "faith," "trust," on the other. In <a onClick="return mV(\'Gal\',5,22);">Ga 5:22</a>, for example, context makes it clear that "fidelity" is in view, as a quality congruous with the associated graces. (the Revised Version (British and American) accordingly renders pistis there by "faithfulness.") Again, <a onClick="return mV(\'Rom\',3,3);">Ro 3:3</a> the King James Version, "the faith of God," by the nature of the case, means His fidelity to promise. But in the overwhelming majority of cases, "faith," as rendering pistis, means "reliance," "trust." To illustrate would be to quote many scores of passages. It may be enough here to call attention to the recorded use of the by our Lord. Of about twenty passages in the Gospels where pistis occurs as coming from His lips, only one (<a onClick="return mV(\'Mat\',23,23);">Mt 23:23</a>) presents it in the apparent sense of "fidelity." All the others conspicuously demand the sense of "reliance," "trust." The same is true of the apostolic writings. In them, with rarest exceptions, the words "reliance," "trust," precisely fit the context as alternatives to "faith."<p>3. Faith in the Sense of Creed:<P>Another line of meaning is traceable in a very few passages, where pistis, "faith," appears in the sense of "creed," the truth, or body of truth, which is trusted, or which justifies trust. The most important of such places is the paragraph <a onClick="return mV(\'Jam\',2,\'14-26\');">Jas 2:14-26</a>, where an apparent contradiction to some great Pauline dicta perplexes many readers. The riddle is solved by observing that the writer uses "faith" in the sense of creed, orthodox "belief." This is clear from <a onClick="return mV(\'Jam\',2,19);">Jas 2:19</a>, where the "faith." in question is illustrated: "Thou believest that God is one." This is the credal confession of the orthodox Jew (the shema\'; see <a onClick="return mV(\'Deu\',6,4);">De 6:4</a>), taken as a passport to salvation. Briefly, James presses the futility of creed without life, Paul the necessity of reliance in order to receive "life and peace."<P>4. A Leading Passage Explained:<P>It is important to notice that <a onClick="return mV(\'Hbr\',11,1);">Heb 11:1</a> is no exception to the rule that "faith" normally means "reliance," "trust." There "Faith is the substance (or possibly, in the light of recent inquiries into the type of Greek used by New Testament writers, "the guaranty") of things hoped for, the evidence (or "convincing proof") of things not seen." This is sometimes interpreted as if faith, in the writer\'s view, were, so to speak, a faculty of second sight, a mysterious intuition into the spiritual world. But the chapter amply shows that the faith illustrated, e. g. by Abraham, Moses, Rahab, was simply reliance upon a God known to be trustworthy. Such reliance enabled the believer to treat the future as present and the invisible as seen. In short, the phrase here, "faith is the evidence," etc., is parallel in form to our familiar saying, "Knowledge is power."<P>5. Remarks:<P>A few detached remarks may be added: (a) The history of the use of the Greek pistis is instructive. In the Septuagint it normally, if not always, bears the "passive" sense "fidelity," "good faith," while in classical Greek it not rarely bears the active sense, "trust." In the koine, the type of Greek universally common at the Christian era, it seems to have adopted the active meaning as the ruling one only just in time, so to speak, to provide it for the utterance of Him whose supreme message was "reliance," and who passed that message on to His apostles. Through their lips and pens "faith," in that sense, became the supreme watchword of Christianity.<P>6. Conclusion:<P>In conclusion, without trespassing on the ground of other articles, we call the reader\'s attention, for his Scriptural studies, to the central place of faith in Christianity, and its significance. As being, in its true idea, a reliance as simple as possible upon the word, power, love, of Another, it is precisely that which, on man\'s side, adjusts him to the living and merciful presence and action of a trusted God. In its nature, not by any mere arbitrary arrangement, it is his one possible receptive attitude, that in which he brings nothing, so that he may receive all. Thus "faith" is our side of union with Christ. And thus it is our means of possessing all His benefits, pardon, justification, purification, life, peace, glory.<P>As a comment on our exposition of the ruling meaning of "faith" in Scripture, we may note that this precisely corresponds to its meaning in common life, where, for once that the word means anything else, it means "reliance" a hundred times. Such correspondence between religious terms (in Scripture) and the meaning of the same words in common life, will be found to be invariable.`<a href="./study/isbe/search.html?string=JUSTIFICATION">JUSTIFICATION</a>`46';
isbe[3354]='Faithful Sayings`sa\'-inz (pistos ho logos): "This is a faithful saying and worthy of all acceptation" (the King James Version). These words form a striking formula which is found—with slight variations—only in the Pastoral Epistles, in <a onClick="return mV(\'1Ti\',1,15);">1Ti 1:15</a>; <a onClick="return mV(\'1Ti\',3,1);">3:1</a>; <a onClick="return mV(\'1Ti\',4,9);">4:9</a>; <a onClick="return mV(\'2Ti\',2,11);">2Ti 2:11</a>; <a onClick="return mV(\'Tts\',3,8);">Tit 3:8</a>. A similar expression occurs in <a onClick="return mV(\'Rev\',21,5);">Re 21:5</a> and <a onClick="return mV(\'Rev\',22,6);">Re 22:6</a> (the King James Version), "These sayings are faithful and true."<P>The Five "Sayings."<P>Paul\'s faithful sayings are thus five in number, and "were no doubt rehearsed constantly in the assemblies, till they became well-known watchwords in the various churches scattered over the Mediterranean-washed provinces of the Roman empire" (Ellicott, New Testament Commentary on <a onClick="return mV(\'1Ti\',1,15);">1Ti 1:15</a>).<P>1. The First "Saying":<P>The first of the faithful sayings speaks of the pre-existence of Christ, of His coming into the world, and the purpose why He came is distinctly stated—to save the lost, irrespective of race or nationality, sinners who, apart from Christ, are without God and without hope.<P>2. The Second "Saying":<P>The second of the faithful sayings refers to the work of being a minister of the gospel, a work then so full of danger and always full of difficulty. The office in question is honorable and Christlike, and, in those early days, it meant stern and ceaseless work, grave and constant danger. This faithful saying would act as a call to young men to offer themselves for the work of proclaiming the gospel to the world, and of witnessing for Christ.<P>3. The Third "Saying":<P>The third saying is that godliness has an influence that is world-wide; it consists, not merely in holiness and in that fellowship and communion with God which is the very life of the soul; it is also an active force which springs from "the love of Christ constraining us," and manifests itself in love toward all our fellow-men, for they are God\'s creatures. Godliness transfigures every rank and condition of life. It has the promise of the life that now is: to those who seek the kingdom of God first, all other things will be added. And it has the promise of the life that is to come, the rich prospect of eternal blessedness with Christ. Compare with this saying the remarkable words in <a onClick="return mV(\'Tts\',1,2);">Tit 1:2</a>, "in hope of eternal life, which God, who cannot lie, promised before times eternal." Godliness gives all gladness here, and future glory too. This is a faithful saying.<P>4. The Fourth "Saying":<P>The fourth of the faithful sayings speaks of the Christian believer\'s union with Christ, and of the blessedness of that union. The Christian is "dead with Christ," he "suffers with Christ." But the union with Christ is eternal, "We shall also live with him;...we shall also reign with him" in life that is fadeless, endless and full of glory. Surely then, no one will draw back, for "if we deny him," "if we believe not," "he also will deny us," for "he abideth faithful, he cannot deny himself."<P>5. The Fifth "Saying":<P>The fifth and last of the faithful sayings speaks of our former unconverted state, "for we also once were foolish, disobedient, deceived, serving divers lusts and pleasures. But...the kindness and love of God...toward man appeared, not by works which we did ourselves, but according to his mercy he saved us." Blessedness is now the Christian\'s lot, and this is the result not of our works: we owe it all to the tender love of God, to His Divine pity, to His redeeming grace. Yes, this is a faithful saying.``155';
isbe[3355]='Faithful; Faithfulness`fath\'-fool, fath\'-fool-nes:<p>1. Faithfulness of God in the Old Testament<P>2. Faithfulness of God in the New Testament<P>LITERATURE<P>Faithfulness is a quality or attribute applied in the Scripture to both God and man. This article is limited to the consideration of the Scripture teaching concerning the meaning of faithfulness in its application to God.<P>Faithfulness is one of the characteristics of God\'s ethical nature. It denotes the firmness or constancy of God in His relations with men, especially with His people. It is, accordingly, one aspect of God\'s truth and of His unchangeableness. God is true not only because He is really God in contrast to all that is not God, and because He realizes the idea of Godhead, but also because He is constant or faithful in keeping His promises, and therefore is worthy of trust (see <a href="./study/isbe/search.html?string=TRUTH">TRUTH</a>). God, likewise, is unchangeable in His ethical nature. This unchangeableness the Scripture often connects with God\'s goodness and mercy, and also with His constancy in reference to His covenant promises, and this is what the Old Testament means by the Faithfulness of God (see <a href="./study/isbe/search.html?string=UNCHANGEABLENESS">UNCHANGEABLENESS</a>).<P>1. Faithfulfulness of God in the Old Testament:<P>In the Old Testament this attribute is ascribed to God in passages where the Hebrew words denoting faithfulness do not occur. It is implied in the covenant name Yahweh as unfolded in <a onClick="return mV(\'Exd\',3,\'13-15\');">Ex 3:13-15</a>, which not only expresses God\'s self-existence and unchangeableness, but, as the context indicates, puts God\'s immutability in special relation to His gracious promises, thus denoting God\'s unchangeable faithfulness which is emphasized in the Old Testament to awaken trust in God (<a onClick="return mV(\'Deu\',7,9);">De 7:9</a>; <a onClick="return mV(\'Psa\',36,5);">Ps 36:5 (Hebrew 6)</a>; <a onClick="return mV(\'Isa\',11,5);">Isa 11:5</a>; <a onClick="return mV(\'Hsa\',12,6,9);">Ho 12:6,9</a>). (For fuller remarks on the name Yahweh in <a onClick="return mV(\'Exd\',3,\'13-15\');">Ex 3:13-15</a>, see article <a href="./study/isbe/search.html?string=UNCHANGEABLENESS">UNCHANGEABLENESS</a>.) It is, moreover, God\'s faithfulness as well as His immutability which is implied in those passages where God is called a rock, as being the secure object of religious trust (<a onClick="return mV(\'Deu\',32,4,15);">De 32:4, 15</a>; <a onClick="return mV(\'Psa\',18,2);">Ps 18:2 (Hebrew 3)</a>; <a onClick="return mV(\'Psa\',42,9);">42:9 (Hebrew 10)</a>; <a onClick="return mV(\'Isa\',17,10);">Isa 17:10</a>, etc.). This same attribute is also implied where God reveals Himself to Moses and to Israel as the God of Abraham, Isaac and Jacob, and their fathers\' God (<a onClick="return mV(\'Exd\',3,6,15,16);">Ex 3:6,15,16</a>). The truth concerning God here taught is not simply that He stood in a gracious relation to the Patriarchs, but that He is faithful to His gracious promise to their fathers, and that what He was to them He will continue to be to Moses and to Israel. This is the fundamental idea in the Old Testament concerning the faithfulness of God.<P>This can be seen also from the Hebrew words which are used to express this quality of God\'s nature and activity. These words are ne\'eman, the Niphal participle of the verb \'aman used as an adjective—"faithful"—and the nouns \'emeth and \'emunah—"faithfulness." The verbal stem \'aman means "to be secure or firm." In the Qal it denotes the firmness of that which supports something, being used in the participle of a nurse who carries a child (<a onClick="return mV(\'Num\',11,12);">Nu 11:12</a>; <a onClick="return mV(\'2Sa\',4,4);">2Sa 4:4</a>; <a onClick="return mV(\'Isa\',49,23);">Isa 49:23</a>). In the Niphal it denotes the firmness of that which is supported, for example, a child which is carried (<a onClick="return mV(\'Isa\',60,4);">Isa 60:4</a>); a well-founded house (<a onClick="return mV(\'1Sa\',2,35);">1Sa 2:35</a>; <a onClick="return mV(\'1Sa\',25,28);">25:28</a>); a wall which firmly holds a nail (<a onClick="return mV(\'Isa\',22,23,25);">Isa 22:23,25</a>); a kingdom firmly established (<a onClick="return mV(\'2Sa\',7,16);">2Sa 7:16</a>); persons secure in political station (<a onClick="return mV(\'Isa\',7,9);">Isa 7:9</a>); a heart which is faithful (<a onClick="return mV(\'Neh\',9,8);">Ne 9:8</a>). Hence, in the Niphal the verb comes to have the meaning of being true in the sense of the agreement of words and assertions with reality; for example, of words and revelations (<a onClick="return mV(\'Gen\',42,20);">Ge 42:20</a>; <a onClick="return mV(\'Hsa\',5,9);">Ho 5:9</a>); and of persons (<a onClick="return mV(\'Isa\',8,2);">Isa 8:2</a>; <a onClick="return mV(\'Jer\',42,5);">Jer 42:5</a>). It has also the meaning of being faithful, being applied to men in <a onClick="return mV(\'Num\',12,7);">Nu 12:7</a>; <a onClick="return mV(\'Psa\',101,6);">Ps 101:6</a>; <a onClick="return mV(\'Neh\',13,13);">Ne 13:13</a>, etc. In this sense the term is applied to the covenant-keeping Yahweh to express the truth that He is firm or constant, that is, faithful in regard to His covenant promises, and will surely fulfill them (<a onClick="return mV(\'Deu\',7,9);">De 7:9</a>; <a onClick="return mV(\'Isa\',49,7);">Isa 49:7</a>; and possibly <a onClick="return mV(\'Hsa\',11,12);">Ho 11:12 (Hebrew 12:1)</a>).<P>A similar use is made of the nouns \'emeth and \'emunah. Apart from the instances where \'emeth denotes the idea of truth or the correspondence of words and ideas with reality, and the instances where it denotes the agreement of acts and words with the inner disposition, that is, sincerity, it is also used to denote the idea of faithfulness as above defined. As regards the noun \'emunah, apart from a few passages where it is doubtful whether it means truth or faithfulness, it usually denotes the latter idea. Both these nouns, then, are used to signify the idea of faithfulness, that is, constancy or firmness, especially in the fulfillment of all obligations. In this sense these words are not only applied to men, but also to God to express the idea that He is always faithful to His covenant promises. It is this attribute of God which the Psalmist declares (<a onClick="return mV(\'Psa\',40,10);">Ps 40:10 (Hebrew 11)</a>), and the greatness of which he affirms by saying that God\'s faithfulness reacheth to the clouds (<a onClick="return mV(\'Psa\',36,5);">Ps 36:5 (Hebrew 6)</a>). It is this which he makes the object of praise (<a onClick="return mV(\'Psa\',89,1,2);">Ps 89:1-2 (Hebrew 2,3)</a>; <a onClick="return mV(\'Psa\',92,2);">Ps 92:2 (Hebrew 3)</a>); and which he says should be praised and reverenced by all men (<a onClick="return mV(\'Psa\',89,5,8);">Ps 89:5,8 (Hebrew 6,9)</a>). And even this faithfulness is itself characterized by constancy, if we may so speak, for the Psalmist says that it endures to all generations (<a onClick="return mV(\'Psa\',100,5);">Ps 100:5</a>). Being thus a characteristic of God, it also characterizes His salvation, and becomes the basis of confidence that God will hear prayer (<a onClick="return mV(\'Psa\',143,1);">Ps 143:1</a>). It thus becomes the security of the religious man (<a onClick="return mV(\'Psa\',91,4);">Ps 91:4</a>); and the source of God\'s help to His people (<a onClick="return mV(\'Psa\',31,5);">Ps 31:5 (Hebrew 6)</a>). Accordingly in the teaching of prophecy, the salvation of the covenant people rests upon no claim or merit of their own, but solely upon Yahweh\'s mercy, grace and faithfulness. When Israel incurred God\'s judgments, it might have appeared as if His promise was to fail, but, so far from this being true, as Yahweh, He is faithful to His word of promise which stands forever (<a onClick="return mV(\'Isa\',40,8);">Isa 40:8</a>). Even from eternity His counsels are characterized by faithfulness and truth (<a onClick="return mV(\'Isa\',25,1);">Isa 25:1</a>); and this is not because of Israel\'s faithfulness, but it is for His own sake that Yahweh blotteth out their transgressions (<a onClick="return mV(\'Isa\',43,\'22-25\');">Isa 43:22-25</a>; <a onClick="return mV(\'Mic\',7,\'18-20\');">Mic 7:18-20</a>). It is, moreover, this same characteristic of Yahweh which is asserted in many cases where the Hebrew words \'emeth and \'emunah are translated by the word "truth" in the King James Version. In <a onClick="return mV(\'Exd\',34,6);">Ex 34:6</a> it is God\'s faithfulness (\'emeth) which is referred to, since it evidently signifies His constancy from generation to generation; and in <a onClick="return mV(\'Deu\',32,4);">De 32:4</a> it is also God\'s faithfulness (\'emunah) which is mentioned, since it is contrasted with the faithlessness of Israel. The same is true of \'emeth in <a onClick="return mV(\'Mic\',7,20);">Mic 7:20</a>; <a onClick="return mV(\'Psa\',31,5);">Ps 31:5 (Hebrew 6)</a>); <a onClick="return mV(\'Psa\',91,4);">91:4</A>; <a onClick="return mV(\'Psa\',146,6);">146:6</a>. This is also true of the numerous instances where God\'s mercy and truth (\'emeth) are combined, His mercy being the source of His gracious promises, and His truth the faithfulness with which He certainly fulfills them (<a onClick="return mV(\'Psa\',25,10);">Ps 25:10</a>; <a onClick="return mV(\'Psa\',57,3);">57:3 (Hebrew 4)</a>; <a onClick="return mV(\'Psa\',61,7);">61:7 (Hebrew 8)</a>; <a onClick="return mV(\'Psa\',85,10);">85:10 (Hebrew 11)</a>; <a onClick="return mV(\'Psa\',86,15);">86:15</a>). And since the covenant-keeping Yahweh is faithful, faithfulness comes also to be a characteristic of the New Covenant which is everlasting (<a onClick="return mV(\'Psa\',89,28);">Ps 89:28 (Hebrew 29)</a>; compare also for a similar thought, <a onClick="return mV(\'Isa\',54,8);">Isa 54:8</a>ff; <a onClick="return mV(\'Jer\',31,35);">Jer 31:35</a>ff; <a onClick="return mV(\'Hsa\',2,19);">Ho 2:19</a>f; <a onClick="return mV(\'Eze\',16,60);">Eze 16:60</a>ff.<P>It is in this connection, moreover, that God\'s faithfulness is closely related to His righteousness in the Old Testament. In the second half of the prophecy of Isaiah and in many of the psalms, righteousness is ascribed to God because He comes to help and save His people. Thus righteousness as a quality parallel with grace, mercy and faithfulness is ascribed to God (<a onClick="return mV(\'Isa\',41,10);">Isa 41:10</a>; <a onClick="return mV(\'Isa\',42,6);">42:6</a>; <a onClick="return mV(\'Isa\',45,13,19,21);">45:13,19,21</a>; <a onClick="return mV(\'Isa\',63,1);">63:1</a>). It appears in these places to widen out from its exclusively judicial or forensic association and to become a quality of God as Saviour of His people. Accordingly this attribute of God is appealed to in the Psalms as the basis of hope for salvation and deliverance (<a onClick="return mV(\'Psa\',31,1);">Ps 31:1 (Hebrew 2)</a>; <a onClick="return mV(\'Psa\',35,24);">35:24</a>; <a onClick="return mV(\'Psa\',71,2);">71:2</A>; <a onClick="return mV(\'Psa\',143,11);">143:11</A>). Hence, this attribute is associated with God\'s mercy and grace (<a onClick="return mV(\'Psa\',36,5);">Ps 36:5 (Hebrew 6)</a>; <a onClick="return mV(\'Psa\',36,9);">36:9 (Hebrew 10)</a>; <a onClick="return mV(\'Psa\',89,14);">89:14 (Hebrew 15)</a>); also with His faithfulness (<a onClick="return mV(\'Zec\',8,8);">Zec 8:8</a>; <a onClick="return mV(\'Psa\',36,6);">Ps 36:6 (Hebrew 7)</a>; <a onClick="return mV(\'Psa\',40,10);">Ps 40:10 (Hebrew 11)</a>; <a onClick="return mV(\'Psa\',88,11,12);">88:11,12 (Hebrew 12,13)</a>; <a onClick="return mV(\'Psa\',89,14);">89:14 (Hebrew 15)</a>; <a onClick="return mV(\'Psa\',96,13);">96:13</a>; <a onClick="return mV(\'Psa\',119,137,142);">119:137,142</a>; <a onClick="return mV(\'Psa\',143,1);">143:1</a>). Accordingly the Old Testament conception of the righteousness of God has been practically identified with His covenant faithfulness, by such writers as Kautzsch, Riehm and Smend, Ritschl\'s definition of it being very much the same. Moreover, Ritschl, following Diestel, denied that the idea of distributive and retributive justice is ascribed to God in the Old Testament. In regard to this latter point, it should be remarked in passing that this denial that the judicial or forensic idea of righteousness is ascribed to God in the Old Testament breaks down, not only in view of the fact that the Old Testament does ascribe this attribute to God in many ways, but also in view of the fact that in a number of passages the idea of retribution is specifically referred to the righteousness of God (see <a href="./study/isbe/search.html?string=RIGHTEOUSNESS">RIGHTEOUSNESS</a>; compare against Diestel and Ritschl, Dalman, Die richterliche Gerechtigkeit im Alten Testament).<P>That which concerns us, however, in regard to this close relation between righteousness and faithfulness is to observe that this should not be pressed to the extent of the identification of righteousness with covenant faithfulness in these passages in the Psalms and the second half of Isaiah. The idea seems to be that Israel has sinned and has no claim upon Yahweh, finding her only hope of deliverance in His mercy and faithfulness. But this very fact that Yahweh is merciful and faithful becomes, as it were, Israel\'s claim, or rather the ground of Israel\'s hope of deliverance from her enemies. Hence, in the recognition of this claim of His people, God is said to be righteous in manifesting His mercy and faithfulness, so that His righteousness, no less than His mercy and faithfulness, becomes the ground of His people\'s hope. Righteousness is thus closely related in these cases to faithfulness, but it is not identified with it, nor has it in all cases lost entirely its forensic tone. This seems to be, in general, the meaning of righteousness in the Psalms and the second half of Isaiah, with which may also be compared <a onClick="return mV(\'Mic\',6,9);">Mic 6:9</a>; <a onClick="return mV(\'Zec\',8,8);">Zec 8:8</a>.<P>The emphasis which this attribute of God has in the Old Testament is determined by the fact that throughout the whole of the Old Testament the covenant relation of Yahweh to His people is founded solely in God\'s grace, and not on any merit of theirs. If this covenant relation had been based on any claim of Israel, faithfulness on God\'s part might have been taken for granted. But since Yahweh\'s covenant relation with Israel and His promises of salvation spring solely from, and depend wholly upon, the grace of God, that which gave firm assurance that the past experience of God\'s grace would continue in the future was this immutable faithfulness of Yahweh. By it the experience of the fathers was given a religious value for Israel from generation to generation. And even as the faithfulness of God bridged over the past and the present, so also it constituted the connecting link between the present and the future, becoming thus the firm basis of Israel\'s hope; compare <a onClick="return mV(\'Psa\',89,\'1-\');">Ps 89</a> which sets forth the faithfulness of God in its greatness, its firmness as the basis of the covenant and the ground it affords of hope for future help from Yahweh, and for hope that His covenant shall endure forever. When God\'s people departed from Him all the more emphasis was put upon His faithfulness, so that the only hope of His wayward people lay not only in His grace and mercy but also in His faithfulness, which stands in marked contrast with the faithlessness and inconstancy of His people. This is probably the meaning of the difficult verse <a onClick="return mV(\'Hsa\',11,12);">Ho 11:12 (Hebrew 12:1)</a>.<P>2. Faithfulness of God in the New Testament:<P>In the New Testament teaching concerning the faithfulness of God the same idea of faithfulness to His gracious promises is emphasized and held up as the object of a confident trust in God. This idea is usually expressed by the adjective pistos, and once by the noun pistis, which more frequently has the active sense of faith or trust.<P>An attempt has been made by Wendt (SK, 1883, 511f; Teaching of Jesus, English translation, I, 259f) to interpret the words aletheia and alethes in many instances, especially in the Johannine writings, as denoting faithfulness and rectitude, after the analogy of the Septuagint rendering eleos kai aletheia for the Hebrew phrase "mercy and truth," in which truth is equivalent to faithfulness. But the most that could be inferred from the fact that the Septuagint uses the word aletheia to translate the Hebrew word \'emeth, and in about one-half the cases where \'emunah occurs, would be that those Greek words might have been prepared for such a use in the New Testament. But while it is true that there is one usage of these words in John\'s writings in an ethical sense apparently based on the Old Testament use of \'emeth and \'emunah, the Greek words do not have this meaning when employed to denote a characteristic of God. Neither is the adjective alethinos so used.<P>In the Epistles of Paul the word aletheia occurs quite frequently to denote the truth revealed by God to man through reason and conscience, and to denote the doctrinal content of the gospel. In two passages, however, the words alethes and aletheia seem to signify the faithfulness of God (<a onClick="return mV(\'Rom\',3,4,7);">Ro 3:4,7</a>; <a onClick="return mV(\'Rom\',15,8);">15:8</a>). In the former passage Paul is contrasting the faithfulness of God with the faithlessness of men, the word alethes, <a onClick="return mV(\'Rom\',3,4);">3:4</a>, and aletheia, <a onClick="return mV(\'Rom\',3,7);">3:7</a>, apparently denoting the same Divine characteristic as the word pistis, <a onClick="return mV(\'Rom\',3,3);">3:3</a>. In the latter passage (<a onClick="return mV(\'Rom\',15,8);">Ro 15:8</a>), the vindication of God\'s covenant faithfulness, through the realization of His promises to the fathers, is declared to have been the purpose of the ministry of Jesus Christ to the Jews.<P>This faithfulness of God to His covenant promises is frequently emphasized by Paul, the words he employs being the noun pistis (once) and the adjective: pistos. The noun pistis is used once by Paul in this sense (<a onClick="return mV(\'Rom\',3,3);">Ro 3:3</a>). In this place Paul is arguing that the unbelief of the Jews cannot make void God\'s faithfulness. Both Jew and Gentile, the apostle had said, are on the same footing as regards justification. Nevertheless the Jews had one great advantage in that they were the people to whom the revelation of God\'s gracious promises had been committed. These promises will certainly be fulfilled, notwithstanding the fact that some of the Jews were unfaithful, because the fulfillment of these promises depends not on human conduct but on the faithfulness of God, which cannot be made void by human faithlessness and unbelief. And to the supposition that man\'s faithlessness could make of none effect God\'s faithfulness, Paul replies \'let God be faithful (alethes) and every man a liar\' (<a onClick="return mV(\'Rom\',3,4);">Ro 3:4</a>), by which Paul means to say that in the fulfillment of God\'s promises, in spite of the fact that men are faithless, the faithfulness of God will be abundantly vindicated, even though thereby every man should be proven untrue and faithless. And not only so, but human faithlessness will give an opportunity for a manifestation of the faithfulness (aletheia) of God, abounding to His glory (<a onClick="return mV(\'Rom\',3,7);">Ro 3:7</a>). God\'s faithfulness here is His unchangeable constancy and fidelity to His covenant promises; and it is this fidelity to His promises, or the fact that God\'s gracious gifts and election are without any change of mind on His part, which gave to Paul the assurance that all Israel should finally be saved (<a onClick="return mV(\'Rom\',11,\'25-29\');">Ro 11:25-29</a>). Moreover this covenant faithfulness of God is grounded in His very nature, so that Paul\'s hope of eternal life rests on the fact that God who cannot lie promised it before the world began (<a onClick="return mV(\'Tts\',1,2);">Tit 1:2</a>); and the certainty that God will abide faithful notwithstanding human faithlessness rests on the fact that God cannot deny Himself (<a onClick="return mV(\'2Ti\',2,13);">2Ti 2:13</a>). It is because God is faithful that His promises in Christ are yea and amen (<a onClick="return mV(\'2Cr\',1,18,20);">2Co 1:18,20</a>). This attribute of God, moreover, is the basis of Paul\'s confident assurance that God will preserve the Christian in temptation (<a onClick="return mV(\'1Cr\',10,13);">1Co 10:13</a>); and establish him and preserve him from evil (<a onClick="return mV(\'2Th\',3,3);">2Th 3:3</a>). And since God is faithful and His gracious promises trustworthy, this characteristic attaches to the "faithful sayings" in the Pastoral Epistles which sum up the gospel, making them worthy of trust and acceptance (<a onClick="return mV(\'1Ti\',1,15);">1Ti 1:15</a>; <a onClick="return mV(\'1Ti\',4,9);">4:9</a>; <a onClick="return mV(\'Tts\',3,8);">Tit 3:8</a>).<P>This faithfulness of God in the sense of fidelity to His promises is set forth as the object of sure trust and hope by the writer of the Epistle to the Hebrews. It was the basis of Sarah\'s faith that she would bear a child when she was past age (<a onClick="return mV(\'Hbr\',11,11);">Heb 11:11</a>); and it is because God is faithful to His promise in Christ that we can draw nigh to Him with full assurance of faith, holding fast without wavering the profession of hope (<a onClick="return mV(\'Hbr\',10,23);">Heb 10:23</a>).<P>John also ascribes this attribute to God. Since one of the most precious of God\'s promises through Christ is the pardon of sin through the "blood of Jesus Christ," John says that God\'s faithfulness, as well as His righteousness, is manifested in the forgiveness of sin (<a onClick="return mV(\'1Jo\',1,9);">1Joh 1:9</a>).<P>The faithfulness of God is viewed from a slightly different point by Peter when he tells his readers that those who suffer as Christians and in accordance with God\'s will should "commit their soul\'s in well-doing unto a faithful Creator" (<a onClick="return mV(\'1Pe\',4,19);">1Pe 4:19</a>). The quality of faithfulness, which in the Scripture is more frequently ascribed to God in His relation to man as gracious Saviour, and as the ground of hope in His gracious promises, is here applied by Peter to God in His relation to man as his Creator, and is made the ground of comfort under persecution and suffering. The omission of the article before the words "faithful Creator" makes emphatic that this is a characteristic of God as Creator, and the position of the words in the sentence throws great emphasis on this attribute of God as the basis of comfort under suffering. It is as if Peter would say to suffering Christians, "You suffer not by chance but in accordance with God\'s will; He, the almighty Creator, made you, and since your suffering is in accordance with His will, you ought to trust yourselves to Him who as your Creator is faithful." It is, of course, Christians who are to derive this comfort, but the faithfulness of God is extended here to cover all His relations to His people, and to pledge all His attributes in their behalf.<P>This attribute is also ascribed to Christ in the New Testament. Where Jesus is called a faithful high priest, the idea expressed is His fidelity to His obligations to God and to His saving work (<a onClick="return mV(\'Hbr\',2,17);">Heb 2:17</a>; <a onClick="return mV(\'Hbr\',3,2,6);">3:2,6</a>). But when in the Book of Revelation Jesus Christ is called the "faithful witness" or absolutely the "Faithful and True," it is clear that the quality of faithfulness, in the most absolute sense in which it is characteristic of God in contrast with human changeableness, is ascribed to Christ (<a onClick="return mV(\'Rev\',1,5);">Re 1:5</a>; <a onClick="return mV(\'Rev\',3,14);">3:14</a>; <a onClick="return mV(\'Rev\',19,11);">19:11</a>). This is especially clear in the last-named passage. The heavens themselves open to disclose the glorified Christ, and He appears not only as a victorious warrior whose name is faithful and true, but also as the one in whom these attributes have their highest realization, and of whom they are so characteristic as to become the name of the exalted Lord. This clearly implies the Deity of Jesus.<P>In summing up the Scripture teaching concerning God\'s faithfulness, three things are noteworthy. In the first place, this characteristic of God is usually connected with His gracious promises of salvation, and is one of those attributes which make God the firm and secure object of religious trust. As is the case with all the Scripture teaching concerning God, it is the religious value of His faithfulness which is made prominent. In the second place, the so-called moral attributes, of which this is one, are essential in order to constitute God the object of religion, along with the so-called incommunicable attributes such as Omnipotence, Omnipresence and Unchangeableness. Take away either class of attributes from God, and He ceases to be God, the object of religious veneration and trust. And in the third place, while these moral attributes, to which faithfulness belongs, have been called "communicable," to distinguish them from the "incommunicable" attributes which distinguish God from all that is finite, it should never be forgotten that, according to the Scripture, God is faithful in such an absolute sense as to contrast Him with men who are faithful only in a relative sense, and who appear as changeable and faithless in comparison with the faithfulness of God.<P>LITERATURE.<P>Besides the Commentaries on the appropriate passages, see Oehler, Theology of the Old Testament, English translation, 95,112f 505: Dillmann, Handbuch der alttest. Theol., 268-76, 269-70; Schlatter, Der Glaube im New Testament, 21-22, 259-60. In the works on New Testament theology this subject is treated under the sections on the truthfulness of God.<P>On the relation of God\'s truth and faithfulness, see Wendt, Der Gebrauch der Worter, und im New Testament, SK,1883,511f; Stanton, article "Truth," in HDB, IV, 816f; and the above-mentioned work of Schlatter. On the relation of the faithfulness to the righteousness of God, see Diestel, "Die Idee der Gerechtigkeit vorzuglich im Altes Testament," Jahrbucher fur deutsche Theologie, 1860, 173f; Kautzsch, Ueber die Derivate des Stammes im Altes Testament Sprachgebrauch; Riehm, Altes Testament Theol., 271f; Smend, Alttest. Religionsgeschichte, 363f; Ritschl, Justification and Reconciliation; Dalman, Die richterliche Gerechtigkeit im Altes Testament; and the above-mentioned Old Testament Theologies of Dillmann and Oehler.`<a href="./study/isbe/search.html?string=RIGHTEOUSNESS">RIGHTEOUSNESS</a>; <a href="./study/isbe/search.html?string=TRUTH">TRUTH</a>; <a href="./study/isbe/search.html?string=UNCHANGEABLENESS">UNCHANGEABLENESS</a>`72';
isbe[3356]='Faithless`fath\'-les: The translation of apistos, "without faith," having the sense of "unbelieving," "disbelieving." Jesus upbraids the people, "O faithless and perverse generation!" (<a onClick="return mV(\'Mat\',17,17);">Mt 17:17</a>; <a onClick="return mV(\'Mar\',9,19);">Mr 9:19</a>; <a onClick="return mV(\'Luk\',9,41);">Lu 9:41</a>); He says to Thomas, "Be not faithless, but believing" (<a onClick="return mV(\'Jhn\',20,27);">Joh 20:27</a>); the Revised Version (British and American) adds, "If we are faithless," instead of "believe not" (<a onClick="return mV(\'2Ti\',2,13);">2Ti 2:13</a>); compare <a onClick="return mV(\'1Cr\',7,\'12-15\');">1Co 7:12-15</a>; <a onClick="return mV(\'1Cr\',10,27);">10:27</a>; <a onClick="return mV(\'1Cr\',14,22,24);">14:22,24</a>, etc.; <a onClick="return mV(\'Tts\',1,15);">Tit 1:15</a>. In <a onClick="return mV(\'Luk\',12,46);">Lu 12:46</a> apistos has the sense of "unfaithful," so the Revised Version (British and American); perhaps also <a onClick="return mV(\'Rev\',21,8);">Re 21:8</a>, "unbelieving."``1';
isbe[3357]='Falcon`fo\'-k\'-n, fol\'-k\'-n, fal\'-kun: The Hebrews did not know the word. Their bird corresponding to our falcon, in all probability, was one of the smaller kestrels covered by the word nets, which seemed to cover all lesser birds of prey that we include in the hawk family. That some of our many divisions of species were known to them is indicated by the phrase "after its kind." The word occurs in the Revised Version (British and American) in <a onClick="return mV(\'Job\',28,7);">Job 28:7</a>, to translation \'ayyah, Greek gups (compare <a onClick="return mV(\'Lev\',11,14);">Le 11:14</a>; <a onClick="return mV(\'Deu\',14,13);">De 14:13</a>):<P class="in15">"That path no bird of prey knoweth,<br>Neither hath the falcon\'s eye seen it."<P>This substitutes "falcon" for "vulture" in the King James Version. The change weakens the force of the lines. All ornithologists know that eagles, vultures and the large hawks have such range of vision that they at once descend from heights at which we cannot see them to take prey on earth or food placed to tempt them. The falcons and sparrow hawks are small members of the family, some of which feed on little birds, some on insects. They are not celebrated for greater range of vision than other birds of the same location and feeding habits. The strength of these lines lay in the fact that if the path to the mine were so well concealed that the piercing eye of the vulture failed to find it, then it was perfectly hidden indeed.``167';
