; <a onClick="return mV(\'Deu\',14,27,29);">14:27,29</a>; <a onClick="return mV(\'Deu\',16,11,14);">16:11,14</a> the objects of charity, while <a onClick="return mV(\'Deu\',18,3);">18:3</a>ff prescribes a fixed and not insignificant income for the priests. Then, finally, such general statements as are found in <a onClick="return mV(\'Deu\',10,8);">10:8</a>; <a onClick="return mV(\'Deu\',18,2);">18:2</a>ff; <a onClick="return mV(\'Deu\',33,8);">33:8</a>ff, not only demand such specific directions as are found only in the Priestly Code (P), but in <a onClick="return mV(\'Deu\',10,9);">10:9</a>; <a onClick="return mV(\'Deu\',18,2);">18:2</a> there is a direct reference to <a onClick="return mV(\'Num\',18,20,24);">Nu 18:20,24</a> (from P). On the other hand, Deuteronomy, in harmony with its general tendency of impressing upon Israel in the spirit of pastoral exhortation the chief demands of the law, does not find it necessary, in every instance, to mention the distinctions that existed in the tribe of Levi.<P>In <a onClick="return mV(\'Num\',18,7);">Nu 18:7</a> we have in P even an analogon to <a onClick="return mV(\'Deu\',10,8);">De 10:8</a>; <a onClick="return mV(\'Deu\',33,8);">33:8</a>ff; since here, too, no distinction is made between priests and high priests separately, but the whole priestly service is mentioned in a summary manner (compare further <a onClick="return mV(\'Lev\',6,22);">Le 6:22</a> in comparison with <a onClick="return mV(\'Lev\',6,25);">6:25</a>; <a onClick="return mV(\'Num\',35,\'1-\');">Nu 35</a> in comparison with <a onClick="return mV(\'Jos\',21,\'1-\');">Jos 21</a>). That Deuteronomy cannot say "Aaron and his sons," as P does, is certainly self-evident, because Aaron was no longer living at the time when the addresses of Deuteronomy were delivered. And how the expression "Levitical priests," which Deuteronomy uses for the expression found in the Priestly Code (P), and which was entirely suitable, because under all circumstances the priests were of the tribe of Levi, is to be understood as excluding the subordinate members of the cults-officers belonging to the same tribe, is altogether incomprehensible (compare the emphasis put on the Levitical priesthood in P itself, as found in <a onClick="return mV(\'Num\',17,\'1-\');">Nu 17</a>; <a onClick="return mV(\'Jos\',21,4,10);">Jos 21:4,10</a>ff). So are other passages which originated at a time after the introduction by Ezekiel, or, according to the critics, are claimed to have been introduced then (compare <a onClick="return mV(\'Mal\',2,1);">Mal 2:1</a>ff, <a onClick="return mV(\'Mal\',2,4,8);">4,8</a>; <a onClick="return mV(\'Mal\',3,3);">3:3</a>; <a onClick="return mV(\'Jer\',33,18);">Jer 33:18</a>; <a onClick="return mV(\'Isa\',66,21);">Isa 66:21</a>; <a onClick="return mV(\'2Ch\',5,5);">2Ch 5:5</a>; <a onClick="return mV(\'2Ch\',23,18);">23:18</a>; <a onClick="return mV(\'2Ch\',29,4);">29:4</a>ff; <a onClick="return mV(\'2Ch\',30,27);">30:27</a>), and even in Ezekiel (<a onClick="return mV(\'Eze\',44,15);">44:15</a>). The claims that Deuteronomy is more humane in its treatment of the priests who had engaged in the worship in high places (compare eg. <a onClick="return mV(\'2Ki\',22,\'1-\');">2Ki 22</a>f) cannot at all be reconciled with <a onClick="return mV(\'Deu\',13,\'1-\');">De 13</a>, which directs that death is to be the punishment for such idolatry. If, notwithstanding this, it is still claimed that <a onClick="return mV(\'Deu\',18,6);">De 18:6</a>ff allows the priests of the high places to serve in Jerusalem, then it is incomprehensible how in <a onClick="return mV(\'2Ki\',23,9);">2Ki 23:9</a> these men did not appeal directly to Deuteronomy in vindication of their rights over against all hindrances, since Deuteronomy was regarded as the absolute norm in carrying out the cult tradition.<P>(ii) Not Sustained by Ezekiel:<P>Examination of the hypothesis on the basis of Ezekiel: No less unfavorable to the view of the critics must the judgment be when we examine it in the light of the contents of Ezekiel itself. The prophet presupposes a double service in the sanctuary, a lower service which, in the future, the degraded priests of the high places are to perform and which, in the past, had been performed in an unlawful manner by strangers (<a onClick="return mV(\'Eze\',44,\'6-9\');">44:6-9</a>), and a higher service, which had been performed by the Zadokites, the priests at the central sanctuary, in the proper way at the time when the other priests had gone astray, which service was for this reason to be entrusted to them alone in the future (compare, also, <a onClick="return mV(\'Eze\',40,45,46);">40:45,46</a>; <a onClick="return mV(\'Eze\',43,19);">43:19</a>). Since in <a onClick="return mV(\'Eze\',44,6);">44:6</a>ff the sharpest rebukes are cast up to Israel (according to the reading of the Septuagint, which here uses the second person, even the charge of having broken the covenant), because they had permitted the lower service to be performed by uncircumcised aliens, it is absolutely impossible that Ezekiel should have been the first to introduce the distinction between higher and lower service, but he presupposes this distinction as something well known, and, also, that the lower service has been regulated by Divine ordinances. As we have such ordinances clearly given only in <a onClick="return mV(\'Num\',18,2);">Nu 18:2</a>ff (from P) it is in itself natural and almost necessary that Ezekiel has reference to these very ordinances, but these very ordinances direct that the Levites are to have charge of this lower service. This is confirmed by <a onClick="return mV(\'Eze\',48,12);">Eze 48:12</a>f; where the designation "Levites" in contradistinction from the priests is a fixed and recognized term for the lower cult officials. For Ezekiel has not at all said that he would from now on call these temple-servants simply by the name "Levites," but, rather, he simply presupposes the terminology of P as known and makes use of it. He would, too, scarcely have selected this expression to designate a condition of punishment, since the term "Levites" is recognized on all hands to be an honorable title in the sacred Scriptures. And when he, in addition, designates the Zadokites as "Levitical priests" (<a onClick="return mV(\'Eze\',44,15);">Eze 44:15</a>), this only shows anew that Ezekiel in his designation of the lower temple-servants only made use of the terminology introduced by P.<P>But, on the representation of the critics, the whole attitude ascribed to Ezekiel cannot be upheld. It is maintained that a prophet filled with the highest religious and ethical thoughts has been guilty of an action that, from an ethical point of view, is to be most sharply condemned. The prophet is made to write reproaches against the people of Israel for something they could not help (<a onClick="return mV(\'Eze\',44,6);">Eze 44:6</a>), and he is made to degrade and punish the priests of the high places, who also had acted in good faith and were doing what they had a right to do (<a onClick="return mV(\'Eze\',44,9);">Eze 44:9</a>ff; compare "the moral mantle" which, according to Wellhausen, "he threw over the logic of facts"). Ezekiel is accordingly regarded here as a bad man; but at the same time he would also be a stupid man. How could he expect to succeed in such an uncouth and transparent trick? If success had attended the effort to exclude from the service in Jerusalem the priests of the high places according to <a onClick="return mV(\'2Ki\',23,9);">2Ki 23:9</a>, and notwithstanding <a onClick="return mV(\'Deu\',18,6);">De 18:6</a>ff, which according to what has been said under (a) is most improbable, then this would through the action of Ezekiel again have been made a matter of uncertainty. Or, was it expected that they would suffer themselves to be upraided and punished without protesting if they had done no wrong? Finally, too, the prophet would have belonged to that class whose good fortune is greater than their common sense. This leads us to the following:<P>(iii) Not Supported by Development after Ezekiel:<P>Examination of the development after the time of Ezekiel: Ezekiel\'s success is altogether incomprehensible, if now the distinction between priests and Levites has, at once, been introduced and at the return from captivity, in the year 538 (<a onClick="return mV(\'Ezr\',2,36);">Ezr 2:36</a>), certainly was a fact. It is true that we at once meet with a host of difficulties. Why do only 74 Levites return according to <a onClick="return mV(\'Ezr\',2,40);">Ezr 2:40</a> if their degradation from the ranks of the priesthood through Ezekiel had not preceded? asks the Wellhausen school. Why did any Levites, at all, return, if they had been so disgraced? is our question. But, how is it at all possible that so many priests could return (4,289 among 42,360 exiles, or more than one-tenth of the whole number; compare <a onClick="return mV(\'Ezr\',2,\'36-38\');">Ezr 2:36-38</a> with verse <a onClick="return mV(\'Ezr\',2,64;">64</a>; but many more than one-tenth if women are included in the 42,360), if, since the times of Ezekiel, there were none other than Zadokite priests? In examining the writers claimed as the authors of the Priestly Code (P), all those difficulties recur again which are found in the case of Ezekiel himself. That <a onClick="return mV(\'Num\',16,\'1-\');">Nu 16</a>f indicates and reflects the opposition of the degraded is nothing but an unproved assertion; but if they had revolted, which was probable enough, then there would have been no worse and more foolish means than to change the degraded position of the Levites according to Ezekiel into the honorable position assigned them in the Priestly Code (P). This would only have made the matter worse. The Levites would again have been able to claim their old rights and they would have acquired the strongest weapons for their opposition. The fact that Ezekiel\'s restoration of the priesthood to the Zadokites would have been ignored by the Priestly Code (P), as also the descent of Aaron through Eleazar and Ithamar, according to the account of the Priestly Code (P), that is, that in reality also others were admitted to the priesthood, would only have the effect of making those who still were excluded all the more rebellious, who could appeal to each case of such an admission as a precedent and accordingly as a violation of the principle. What possible purpose the authors of P could have had in the creation of those products of imagination, Nadab and Abihu, and the portrayal of the terrible fate of these sons of Aaron (<a onClick="return mV(\'Lev\',10,\'1-\');">Le 10</a>) remains incomprehensible (compare the purposeless and constructive imagination in the description of the details of the Ark of the Covenant, which stands in no connection with the tendency of P; see <a href="./study/isbe/search.html?string=EXODUS">EXODUS, III, 5</a>). Nor can it be understood why the creators of the Priestly Code would have had assigned other duties to the Levites than Ezekiel had done; the slaying of the burnt offerings and the sacrifices (<a onClick="return mV(\'Eze\',44,11);">44:11</a>) and the cooking of the latter (<a onClick="return mV(\'Eze\',46,24);">46:24</a>) is lacking in the Priestly Code (P), in which document the transportation of the imaginary tabernacle would have exhausted the duties of the priests (<a onClick="return mV(\'Num\',4,\'1-\');">Nu 4</a>), while in other respects, their services would be described only in such general notices as in <a onClick="return mV(\'Num\',8,23);">Nu 8:23</a>ff; <a onClick="return mV(\'Num\',18,2);">18:2</a>ff (compare for this reason the very credible account in Chronicles, which through <a onClick="return mV(\'Eze\',44,11);">Eze 44:11</a>; <a onClick="return mV(\'Eze\',46,24);">46:24</a> only becomes all the more trustworthy, where we are told of the enlargement of the duties of the Levites already by David in <a onClick="return mV(\'1Ch\',23,25);">1Ch 23:25</a>ff). In short, the critical views offer one monstrosity after another, and each greater than its predecessor. We will only mention further that, if the critics are right in this matter, then of the directions found in <a onClick="return mV(\'Eze\',40,\'1-\');">Eze 40</a>; <a onClick="return mV(\'Eze\',48,\'1-\');">48</a> nothing else has ever been carried out in reality, even when these chapters are correctly understood (see 2 (d) below), and at first nothing was intended to be carried out, so that it would be all the more surprising if this one feature of the program of Ezekiel had alone been picked out and had been carried out with an inexplicable haste, and that too at a time when the whole cult was not at all observed (573, according to <a onClick="return mV(\'Eze\',40,1);">40:1</a>).<P>(d) The True Solution:<P>The text as it reads in <a onClick="return mV(\'Eze\',44,9);">Eze 44:9</a>ff actually does speak of a degradation. If the matter involved only a mere putting back into the status quo ante, of the Levites, who on the high places, contrary to the law, had usurped the prerogatives of the higher priestly offices, as this could easily be understood, then the expression in <a onClick="return mV(\'Eze\',44,10,12);">Eze 44:10, 12</a>, "They shall bear their iniquity," would lose much of its significance. On the other hand, the whole matter finds its explanation if, in the first place, the lower order of Levites did not put a high estimate on their office, so that they transferred their service to aliens (<a onClick="return mV(\'Eze\',44,6);">44:6</a>ff), and if, in the second place, by those Levites who departed from Yahweh, when Israel was going astray, not all the Levites are to be understood, but only a certain group of priests, who by these words were for themselves and their contemporaries clearly enough designated: namely, the descendants of Aaron through Ithamar and Eleazar in so far as they were not Zadokites, that is, had not officiated at the central sanctuary. The non-Zadokite priests had permitted themselves to be misled to officiate in the idolatry in the services of the high places, and for this reason were for the future to be degraded to the already existing lower order of the Levites.<P>The fact that in the ranks of lower participants in the cults, already in the days of David, according to Chronicles, a still further division had taken place (<a onClick="return mV(\'1Ch\',23,\'1-\');">1Ch 23-26</a>), so that by the side of the Levites in the most narrow sense of the word, also the singers and the gate watchmen were Levites of a lower rank (<a onClick="return mV(\'Neh\',12,\'44-47\');">Ne 12:44-47</a>; <a onClick="return mV(\'Neh\',13,10);">13:10</a>), is again in itself entirely credible, and, in addition, is made very probable by <a onClick="return mV(\'Ezr\',2,40);">Ezr 2:40</a>ff. This too at once increases the small number of Levites who returned from the exile from 74 to 341. In comparison to the number of priests (4,289) the number yet remains a small one, but from <a onClick="return mV(\'Eze\',44,6);">Eze 44:6</a>ff we learn further that the Levites also before the days of Ezekiel had not appreciated their office, for then they would not have given it over to aliens. In this way not only does everything become clear and intelligible, but the weapon which was to serve for the defense of the Wellhausen school has in every respect been turned against these critics. The historical order can only be: first, the Priestly Code, and after that Ezekiel; never vice versa.<P>(2) <span class="noTag">Ezekiel 40-48</span>: Priority claimed for Ezekiel as against the Priest Codex<P>(a) Sketch of the modern view:<P>The entire vision of what the external condition of affairs would be in the future in <a onClick="return mV(\'Eze\',40,\'1-\');">Eze 40-48</a>, and not only what is particularly stated in <a onClick="return mV(\'Eze\',44,4);">44:4</a>ff, is made a part of Israel\'s religious development in accordance with the scheme of the Wellhausen school. For this hypothesis, this section is one of the chief arguments, besides the opposition which it claims exists on the part of the prophets against the sacrifices, in addition to the proof taken from the history of the people and from the comparison of the different collections of laws with each other. In <a onClick="return mV(\'Eze\',40,\'1-\');">Eze 40</a>; <a onClick="return mV(\'Eze\',48,\'1-\');">48</a> many things are different from what they are in the Priestly Code, and in Ezekiel much is lacking that is found in P. How now would a prophet dare to change the legislation in P? Hence, P is regarded as later than Eze. This is, briefly, the logic of the Wellhausen school.<P>(b) One-Sidedness of This View:<P>If we first state the facts in the case and complete the observations of the modern school, the picture will at once assume quite a different form and the conclusions drawn will in their consequences prove very embarrassing. It is a fact that in Ezekiel the high priest so prominent in P is lacking. No mention is made of the equipment of the holy of holies, and in the holy place the table of the shewbread and the candlesticks, old utensils that are mentioned in the tabernacle of the Priestly Code (P), and in part play an important role there. But the differences in Ezekiel are not found only in comparison with the Priestly Code (P), but just as much, too, in features which belong to the legislation of Deuteronomy, as also of the Book of the Covenant, accepted at all hands as preexilic (<a onClick="return mV(\'Exd\',21,\'1-\');">Ex 21-23</a>; <a onClick="return mV(\'Exd\',34,\'1-\');">34</a>). Thus there is lacking in <a onClick="return mV(\'Eze\',40,\'1-\');">Eze 40-48</a> not only the tithes of P (<a onClick="return mV(\'Lev\',27,\'30-33\');">Le 27:30-33</a>), also the laws with reference to the firstborn from P (<a onClick="return mV(\'Lev\',27,26);">Le 27:26</a>f; <a onClick="return mV(\'Num\',18,15);">Nu 18:15</a>f), the ordinances with reference to the portions of the redemption sacrifice to be given to the priests from P (<a onClick="return mV(\'Lev\',7,31);">Le 7:31</a>), but equally the ordinance with reference to the tithes, firstborn and sacrificial gifts from Deuteronomy (compare <a onClick="return mV(\'Deu\',14,22);">14:22</a>ff; <a onClick="return mV(\'Deu\',26,12);">26:12</a>ff; <a onClick="return mV(\'Deu\',14,\'23-26\');">14:23-26</a>; <a onClick="return mV(\'Deu\',15,\'19-23\');">15:19-23</a>; <a onClick="return mV(\'Deu\',18,3);">18:3</a>). The feast of weeks is wanting, which is demanded not only by P in <a onClick="return mV(\'Lev\',23,15);">Le 23:15</a>ff; <a onClick="return mV(\'Num\',28,26);">Nu 28:26</a>ff, but also by the older legislation (<a onClick="return mV(\'Exd\',23,16);">Ex 23:16</a>; <a onClick="return mV(\'Exd\',34,22);">34:22</a>; <a onClick="return mV(\'Deu\',16,9);">De 16:9</a>); and in the place of the three parallel feasts demanded everywhere, only the Passover and the Feast of the Tabernacles are prescribed (<a onClick="return mV(\'Eze\',45,21);">Eze 45:21</a>). Thus too the direction with regard, e.g. to the Day of Atonement in <a onClick="return mV(\'Eze\',45,18);">Eze 45:18</a>ff is different in regard to number, time and ritual from P in <a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a>, etc. (compare <a href="./study/isbe/search.html?string=ATONEMENT,+DAY+OF">DAY OF ATONEMENT, sec. I, 1</a>), but also the command found in <a onClick="return mV(\'Exd\',20,26);">Ex 20:26</a> (from E) that it was not permitted to ascend on steps to the altar of Yahweh is overthrown by <a onClick="return mV(\'Eze\',43,17);">Eze 43:17</a>. And, according to what has been described under (1), criticism itself accepts (although without reason) that Ezekiel had changed the commandment of <a onClick="return mV(\'Deu\',18,6);">De 18:6</a>ff, according to which all the Levites in Jerusalem could perform priestly service, so that he not only forbade this, as did <a onClick="return mV(\'2Ki\',23,9);">2Ki 23:9</a>, but that he also degraded these priests of the high places as a punishment and reduced them to a lower service.<P>As is the case in reference to the law, Ezekiel also disagrees with the facts of history. He changes the dimensions of the Solomonic temple entirely (<a onClick="return mV(\'Eze\',40,\'5-\');">40:5-42:20</a>); he gives an entirely different distribution of the Holy Land (<a onClick="return mV(\'Eze\',47,\'13-\');">47:13</a> - <a onClick="return mV(\'Eze\',48,\'1-29\');">48:29</a>) from that which was carried out in actual history. What sheer arbitrariness and short-sightedness it would be, to pick out of this condition of affairs only those features in which he differs from the Priestly Code (P), in order, for this reason, to force the composition of the Priestly Code into the postexilic period, and at the same time to close one\'s eyes to the necessary conclusion that if this principle of interpretation is correct, then the Book of the Covenant and Deuteronomy, the temple and the migration into Canaan must also be post-exilic. "The prophet is not allowed to change the Priestly Code (P)," we are told; but as a matter of fact he has changed P no more than he changed the older laws and history. Hence, the claim is false. And then, too, P is not to be regarded as unchangeable. Even the writer of Chronicles, who writes from the standpoint of the Priestly Code (P), has changed P; for he narrates in <a onClick="return mV(\'1Ch\',23,24,27);">1Ch 23:24, 27</a> that the age of the Levites since the time of David had been reduced from 30 or 25 years (<a onClick="return mV(\'Num\',4,3,23,30,35);">Nu 4:3,23,30,35</a>; <a onClick="return mV(\'Num\',8,23);">8:23</a>) to 20 years (compare also the participation of the Levites in the burnt sacrifices and the Passover under Hezekiah (<a onClick="return mV(\'2Ch\',29,34);">2Ch 29:34</a>; <a onClick="return mV(\'2Ch\',30,17,19);">30:17,19</a>)), and in P itself, according to <a onClick="return mV(\'Num\',9,\'6-12\');">Nu 9:6-12</a>, the observation of the Passover after the regular time was permitted, and in general if such changes and adaptations of the law on the part of Ezekiel could not be demonstrated elsewhere, the difficulties for the advocates of the Wellhausen hypothesis would be exactly as great as they are for the adherents of the Biblical views, only that the problem would be inverted to explain how the author of P could have ventured to deviate so far from the will of God as this had been revealed to Ezekiel.<P>(c) Impossibility That Ezekiel Preceded P:<P>While the description of the temple in <a onClick="return mV(\'Eze\',40,5);">40:5</a>ff and of the future dwelling-places of the people (<a onClick="return mV(\'Eze\',47,\'13-\');">47:13</a>ff) is comparatively complete, it is the very legislation of the ritual in <a onClick="return mV(\'Eze\',43,\'13-\');">43:13-46:24</a>, in which it is maintained that the authors of P followed the precedent of the prophet, that is in itself so full of omissions in Ezekiel, that it could not possibly have been a first sketch, but must presuppose the Priestly Code (P), if it is not to be regarded as suspended in the air. Ezekiel presupposes not only burnt offerings, peace offerings and food offerings, but also sin offerings (<a onClick="return mV(\'Eze\',40,39);">40:39</a>; <a onClick="return mV(\'Eze\',42,13);">42:13</a>; <a onClick="return mV(\'Eze\',43,19,21,22,25);">43:19,21,22,25</a>; <a onClick="return mV(\'Eze\',44,27,29);">44:27,29</a>; <a onClick="return mV(\'Eze\',46,20);">46:20</a>). Ezekiel is indeed the first and the only prophet who mentioned sin offerings, just as the guilt offerings are found outside of Ezekiel only in <a onClick="return mV(\'Isa\',53,10);">Isa 53:10</a>. But this reference is of such a kind that he presupposes on the part of his readers an acquaintance also with these two kinds of sacrifices; hence, it is, in itself, a natural conclusion, that the sacrificial legislation of the Priestly Code (P), that is, chiefly <a onClick="return mV(\'Lev\',1,\'1-\');">Le 1 to 7</a>, is older, and as the guilt offerings and the sin offerings are prescribed only by the Priestly Code (P), and in <a onClick="return mV(\'Lev\',4,\'1-\');">Le 4</a>f appear to be emphasized anew, this conclusion becomes a necessity.<P>If this is not the case then Ezekiel is without any foundation. In the same way the injunctions with reference to what is clean and unclean are presupposed as known in <a onClick="return mV(\'Eze\',44,23,25);">44:23,25</a>f (compare <a onClick="return mV(\'Eze\',22,26);">22:26</a>). How long the uncleanness described in <a onClick="return mV(\'Eze\',22,26);">22:26</a> continued can be seen only from <a onClick="return mV(\'Num\',19,11);">Nu 19:11</a>ff. Since in <a onClick="return mV(\'Eze\',22,26);">Eze 22:26</a> there is presupposed a definitely fixed Torah or Law, which it is possible to violate, then it is only natural to conclude that such commands existed before the days of Ezekiel, especially such as are found in <a onClick="return mV(\'Lev\',11,\'1-\');">Le 11-15</a>. In the same way the general character of the ordinances (<a onClick="return mV(\'Eze\',44,30);">Eze 44:30 a</a>), concerning the tithes due to the cult officials, demand such further developments as are found especially in <a onClick="return mV(\'Num\',18,\'1-\');">Nu 18</a> in P. The high priests, too, although Ezekiel makes no mention of them, belong to the period earlier than Ezekiel, as was proved under (1). If there had been no high priest before the days of Ezekiel, it would have been a perfect mystery, in addition, how he would be found after 520 BC (<a onClick="return mV(\'Hag\',1,1);">Hag 1:1</a>; <a onClick="return mV(\'Zec\',3,8);">Zec 3:8</a>; <a onClick="return mV(\'Zec\',6,10);">6:10</a>), without a word having been mentioned of the establishment of such an important institution. In addition, if the office had been created just at this time, this would make it very uncomfortable for the contentions of the Wellhausen school, since the other ordinances of P were introduced only in 444 BC, and should here be regarded as innovating.<P>That Ezekiel presupposed the ordinances of P in reference to the cult officials has been demonstrated under (1). Accordingly, there yet remains to be discussed the universally recognized relationship that exists between Ezekiel and the so-called Law of Holiness (H) in <a onClick="return mV(\'Lev\',17,\'1-\');">Le 17-26</a> (compare <a href="./study/isbe/search.html?string=LEVITICUS">LEVITICUS</a>), which is so great, that for a time Ezekiel was regarded as the author or the editor of this law, a view which, however, has been dropped, because a number of the peculiarities of Ezekiel do not admit of its acceptance. The more advanced critics then went farther, and claimed that the Law of Holiness (H), <a onClick="return mV(\'Lev\',17,\'1-\);">Le 17-26</a> is later than Ezekiel, which is the only possible and defensible position. For practical reasons we here examine, in addition to <a onClick="return mV(\'Eze\',40,\'1-\');">Eze 40-48</a>, also the older parts of the book. Especially do we take into consideration, in addition to chapter <a onClick="return mV(\'Eze\',44,\'1-\');">44</a>, also chapters <a onClick="return mV(\'Eze\',18,\'1-\');">18</a>; <a onClick="return mV(\'Eze\',20,\'1-\');">20</a> and <a onClick="return mV(\'Eze\',22,\'1-\');">22</a>; but in the end the contents of H are suggested by the entire Book of Ezekiel. Especially <a onClick="return mV(\'Lev\',26,\'1-\');">Le 26</a> has been very fully used by Ezekiel; compare for the details, Driver\'s Introduction to the Old Testament; or, Hoffmann, Die wichtigsten Instanzen gegen die Graf-Wellhausensche Hypothese. That Ezekiel could not be the earlier of the two can be concluded as far as P in general is concerned, and for H in particular, especially from this, that Ezkekiel is just as closely connected with Deuteronomy and Jeremiah, as with P; while, on the other hand, in the passage in question, P is connected only with Ezekiel, while the expressions which Ezekiel has in common with Deuteronomy and those Ezekiel has in common with Jeremiah are not found in P (compare the exceedingly interesting and instructive proof in Hoffmann, op. cit.). Equally striking is the proof of Kohler, Biblische Geschichte, III, 154ff, who shows that the contents of the Torah (Law) presupposed and recognized by Jeremiah and Ezekiel as dating from the Mosaic period, take into consideration not only the Books of the Covenant (<a onClick="return mV(\'Exd\',21,\'1-\');">Ex 21</a>ff; <a onClick="return mV(\'Exd\',34,\'1-\');">34</a>) and Deuteronomy, but especially P in general and H in particular. Further, if we place P in a later period, it would be incomprehensible that this body of laws, in which the systematic feature is so important, can differ from the still more systematic ordinances of Ezekiel, and thus become more unsystematic. Thus the sacrifices on the Passover and the Feast of Tabernacles are in number of the same kind in <a onClick="return mV(\'Eze\',45,21);">Eze 45:21</a>ff; but not so in P in <a onClick="return mV(\'Num\',28,16);">Nu 28:16</a>ff; <a onClick="return mV(\'Num\',29,12);">29:12</a>ff. In the same way in the food offerings on the feasts as far as oxen, rams, lambs, and the amount of oil to be given are concerned, there is everywhere the proper proportion in <a onClick="return mV(\'Eze\',45,\'18-\');">Eze 45:18</a> - <a onClick="return mV(\'Eze\',46,\'1-15\');">46:15</a>, while in <a onClick="return mV(\'Num\',28,\'1-\');">Nu 28</a> this is regulated according to a different principle. Then in Ezekiel are found in the description of the sanctuary (<a onClick="return mV(\'Eze\',42,\'15-20\');">42:15-20</a>; <a onClick="return mV(\'Eze\',45,2);">45:2</a>), of the inner and outer courts (<a onClick="return mV(\'Eze\',40,23,27,47);">40:23,27,47</a>; compare also <a onClick="return mV(\'Eze\',40,19);">40:19</a>; <a onClick="return mV(\'Eze\',48,16);">48:16</a>f), square figures in places where they are not found in the tabernacle according to P. To this must be added that no other ordinances of Ezekiel would be carried out in actual practice. Even the ordinances in <a onClick="return mV(\'Eze\',44,4);">44:4</a>ff, according to the views of the critics, would be changed in the Priestly Code (P), in so far as the establishment and work of the lower cult officials and the enlargement of the powers of the higher cult officials are concerned (compare (1)). The Day of Atonement, whose roots are said to be found in <a onClick="return mV(\'Eze\',45,18);">Eze 45:18</a>ff, would be materially changed in number, length and ritual (compare <a href="./study/isbe/search.html?string=ATONEMENT,+DAY+OF">ATONEMENT, DAY OF, sec. I, 1 and III, 1</a>). When the Israelites returned from captivity, they did not think at all of building the temple or the tabernacle in accordance with Ezekiel\'s scheme, or dividing the land according to the directions of his book (both of these subjects have great prominence in <a onClick="return mV(\'Eze\',40,\'1-\');">Eze 40-48</a>; compare <a onClick="return mV(\'Eze\',40,\'5-\');">40:5-43:12</a>; <a onClick="return mV(\'Eze\',47,\'13-\');">47:13</a> - <a onClick="return mV(\'Eze\',48,\'1-29\');">48:29</a>), or of harmonizing Ezekiel with the Priestly Code (P), or of carrying out the latter practically. The Wellhausen hypothesis is then in conflict with all ritual legislation, whether real or constructed by Wellhausen himself.<P>(d) Correct Interpretation of Passage<P><a onClick="return mV(\'Eze\',40,\'1-\');">Eze 40-48</a>: These chapters dare not be made a part of the development of the law in the Old Testament. Ezekiel\'s was not a program that was under all circumstances to be carried out or even could be carried out, for it presupposes conditions that were beyond the control of Israel. For in <a onClick="return mV(\'Eze\',40,2);">40:2</a>ff, a new geographical or geological situation is presupposed, which the country up to this time did not possess (compare the "very high mountain," <a onClick="return mV(\'Eze\',40,2);">40:2</a>), and the same is true in <a onClick="return mV(\'Eze\',47,1);">47:1</a>ff in reference to the miraculous temple fountain with its equally miraculous powers, and in <a onClick="return mV(\'Eze\',47,13);">47:13</a>ff in the division of the land. Only after these changes had been effected in the character of the localities by Yahweh, and Yahweh should again have entered the holy city according to <a onClick="return mV(\'Eze\',43,1);">43:1</a> if, would it be possible to carry out also the other injunctions. It is impossible, either, to interpret these chapters as an allegory. This interpretation is out of the question on account of a large number of directions and measurements. It is, however, true that the whole is an ideal scheme, which portrays to the eye the continuation of the kingdom of God, and represents symbolically the presence of Yahweh, which sanctifies all around about it and creates for itself a suitable outward form. This is particularly apparent in the new name which is assigned to Jerusalem, namely, "Yahweh at that place," or the conclusion of this section and at the same time of the entire book. This, finally, leads us to a brief account of the views presented.<P>(3) Ezekiel\'s Leviticism.<P>In (1) and (2) above, it has been shown that Ezekiel was not the starting-point of Leviticism in Israel: it rather represents the extreme development of this tendency. It was in harmony with the elementary stage of the Old Testament to give the thoughts and demands of God, not in a purely abstract form, but to clothe them in objective and external materials, in order to prepare and educate Israel to understand Christianity. (The negative side of Leviticism, which is not to be overlooked by the side of the positive, is discussed in the article <a href="./study/isbe/search.html?string=LEVITICUS">LEVITICUS</a>) It is a matter of utmost importance for the correct understanding of the Old Testament, that we recognize that the prophets too throughout think Levitically; in their discourses, too, sacred trees, sacrifices, times, persons, tithes, play a most important role, notwithstanding all the spiritualization of religion on their part; and where it is thought possible to show an absolute opposition on the part of the prophets to the Levitical system, namely, in the matter of sacrifices, a close consideration, but especially, too, the analogy of the other external institutions, shows that we have in these cases only a relative antithesis (compare Are the Critics Right? 99ff; Messianische Erwartung der vorexilischen Propheten, 333ff). Thus e.g. Jeremiah who, in <a onClick="return mV(\'Jer\',6,20);">6:20</a>; <a onClick="return mV(\'Jer\',7,21);">7:21</a>ff, engages as sharply as possible in polemics against the sacrificial system, and in <a onClick="return mV(\'Jer\',31,31);">31:31</a>ff, in the passage treating of the new covenant, spiritualizes religion as much as possible, has assigned to sacrifices a place in his predictions of the future (compare <a onClick="return mV(\'Jer\',17,19);">17:19</a>ff, <a onClick="return mV(\'Jer\',26,\'1-\');">26</a>; <a onClick="return mV(\'Jer\',31,14);">31:14</a>; <a onClick="return mV(\'Jer\',33,18);">33:18</a>), just as the abiding-place and the revelation of God for this prophet too, are always found connected with the Holy Land, Jerusalem or Zion (compare <a onClick="return mV(\'Jer\',3,17);">3:17</a>; <a onClick="return mV(\'Jer\',12,15);">12:15</a>; <a onClick="return mV(\'Jer\',30,18);">30:18</a>; <a onClick="return mV(\'Jer\',31,16,11,12);">31:6,11,12</a>; <a onClick="return mV(\'Jer\',32,36);">32:36</a>ff; <a onClick="return mV(\'Jer\',33,9);">33:9</a>). That in this the ultimate development of the kingdom of God has not yet been reached, but that the entire Old Testament contains only a preliminary stage, cannot be too sharply emphasized. In so far Ezekiel, in whose book Leviticism appears in its most developed state, more than others, shares in the limitations of the Old Testament. But just as little can it be denied that the Levitical system was really one stage, and that, too, an important and indispensable stage in the development of the kingdom of God; and that in this system, the question at issue is not only that of a change of a religion into a stereotyped formalism or externalism, which is the case if this system loses its contents, but the fact that it contained a valuable kernel which ripened in this shell, but would not have ripened if this shell had been prematurely discarded. The external conditions, their harmonious arrangement, the ceremonial ordinances, keeping clean from external pollution, are indeed only forms; but in them valuable contents succeed in finding their expression; through these Israel learned to understand these contents. The kernel could not be given without the shell nor the contents without the form, until in Christianity the time came when the form was to be broken and the shell discarded. This significance of the Levitical system becomes more evident in Ezekiel than is the case, e.g. in the Priestly Code (P), where indeed a few passages like <a onClick="return mV(\'Exd\',25,8);">Ex 25:8</a>; <a onClick="return mV(\'Exd\',29,45);">29:45</a>ff; <a onClick="return mV(\'Exd\',40,34);">40:34</a>ff; <a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a>; <a onClick="return mV(\'Lev\',19,18);">19:18</a>; <a onClick="return mV(\'Lev\',26,31,41);">26:31, 41</a> clearly show in what sense the entire legislation is to be understood; but the mere fact that there are so few of these passages makes it easy to overlook them; while in Ezekiel, in addition to the purely Levitical utterances, and in part more closely connected with these, the entire work is saturated with the emphasis put on the highest religious and ethical thoughts, so that both must be in the closest harmony with each other (compare on this subject also Ezekiel\'s conception of God under 5 below). That Ezekiel and the Law of Holiness stand in such close relations to each other is not to be explained from this, that Ezekiel is in any way to be connected with the composition of the law in <a onClick="return mV(\'Lev\',17,\'1-\');">Le 17-26</a>, but on the ground of the tendency common to both. The fact that Ezekiel shows a special liking for these chapters in P does not, accordingly, justify the conclusion that <a onClick="return mV(\'Lev\',17,\'1-\');">Le 17</a>ff ever existed as a separate legal codex. We must in this connection not forget the close connection of the prophets with the rest of P mentioned under (2) above (compare <a href="./study/isbe/search.html?string=LEVITICUS">LEVITICUS</a>). We close this part of the discussion with the statement that Ezekiel constructed his system on the basis of the Levitical ordinance, but as priest-prophet (compare under I, 1) utilized this material independently and freely.<P>3. Ezekiel and the Messianic Idea:<P>Chs 40-48 treat of the future, and furnish us the transition to another matter, in which Ezekiel by modern theology has been forced into a wrong light, namely, in regard to the Messianic idea. After the critics had, as a matter of fact, eliminated from the entire preexilic prophetical writings nearly all of the passages speaking of the Messiah on the ground that they were not genuine (e.g. <a onClick="return mV(\'Amo\',9,8);">Am 9:8</a>ff; <a onClick="return mV(\'Hsa\',1,10,11);">Ho 1:10,11</a>; <a onClick="return mV(\'Hsa\',3,5);">3:5</a>; <a onClick="return mV(\'Mic\',2,12);">Mic 2:12</a>f; <a onClick="return mV(\'Mic\',4,\'1-\');">4</a>f; <a onClick="return mV(\'Isa\',4,\'2-6\');">Isa 4:2-6</a>; <a onClick="return mV(\'Isa\',7,14);">7:14</a>; <a onClick="return mV(\'Isa\',9,\'1-7\');">9:1-7</a>; <a onClick="return mV(\'Isa\',11,\'1-10\');">11:1-10</a>, etc.), Marti and Volz have now completed this task. While the former declared as not genuine all the Messianic predictions down to Deutero-Isaiah, the latter has, in his work, Die vorexilische Jahwe-Prophetic und der Messias, halted at Ezekiel, but for this works up the entire material into a uniform fundamental conception with pronounced characteristics. He declares that prophecy and the Messianic idea are two mutually exclusive phenomena, by regarding the Messiah as a purely political and national fact, but the prophetic expectation of the future as something purely religious. Ezekiel he regards as the first prophet with whose views on other matters the Messianic idea indeed did not harmonize, but who, nevertheless, yielded to the tendencies of his times and to the general national feelings, and submitted to the influence of the false prophets, who had created the carnal national expectation of a Messiah and constantly fed this, and accordingly received into his book the Messiah passages in <a onClick="return mV(\'Eze\',22,\'22-24\');">17:22-24</a>; <a onClick="return mV(\'Eze\',21,25);">21:25</a>f; <a onClick="return mV(\'Eze\',34,23);">34:23</a>f; <a onClick="return mV(\'Eze\',37,22,24,25);">37:22,24,25</A>. But this too is, all in all, simply a monstrous assumption. It is exegetically incorrect to regard the Messiah merely as a political, national and particularistic person, whenever the religious and ethical and universalistic characteristics of the Messiah are portrayed by prophecy; and it is also incorrect to regard prophecy as abstractly religious, when the national and external side of the kingdom of God is ignored. It is impossible to eliminate the different Messianic passages preceding the time of Ezekiel, as these are proved to be genuine by their contents and form, their close connection with the context, the structure of the prophetic writings, and by the mutual relation of these passages to each other. But we must here refer to our book, Die messianische Erwartung der vorexilischen Propheten. We draw attention to this only because since the publication of Gressmann\'s book, Der Ursprung der israelitisch-judischen Eschatologie, the critics have begun to be a little less skeptical in reference to the genuine character of the Messianic passages in the older prophetical writings. We here point to the fact, that the positive contentions of Volz, which ascribe to Ezekiel the introduction of the Messianic idea out of the popular faith, are exceedingly inconsiderate. The different passages mentioned above, which in Ezekiel speak of the Messiah, can scarcely be said to add any new features to the picture of the Messiah as it is found in earlier literature (of one exception to this we will speak later). If the Messiah was not yet portrayed in the earlier prophetic literature, then Ezekiel had the less occasion to introduce this new feature, if this feature did not harmonize with his other views, as Volz claims. And, if this is only a mistake, it is yet a fact that in Ezekiel the Messianic idea is not relatively a prominent feature; he, as it were, only recalls the pictures known from the predictions of the earlier prophets; he accepts these pictures as revealed truth, because they, in his conviction, evidently originated in the development of prophecy. Compare for the idea that the Messiah is to come forth from small origins and from a lowly station <a onClick="return mV(\'Eze\',17,\'22-24\');">Eze 17:22-24</a>; <a onClick="return mV(\'Isa\',10,33,34);">Isa 10:33,34</a>; <a onClick="return mV(\'Isa\',11,1);">11:1</a>; <a onClick="return mV(\'Mic\',5,1);">Mic 5:1</a>ff. <a onClick="return mV(\'Eze\',21,32);">Eze 21:32</a> only hints at the general expectation of a Messiah; <a onClick="return mV(\'Eze\',34,23);">Eze 34:23</a>f; <a onClick="return mV(\'Eze\',37,22,24,25);">37:22,24,25</a> connect especially with the promises given to David in <a onClick="return mV(\'2Sa\',7,\'1-\');">2Sa 7</a>. Then the reunion of the two kingdoms into one scepter is found also in <a onClick="return mV(\'Amo\',9,11);">Am 9:11</a>; <a onClick="return mV(\'Hsa\',2,2);">Ho 2:2</a>; <a onClick="return mV(\'Hsa\',3,5);">3:5</a>; <a onClick="return mV(\'Isa\',8,\'23-\');">Isa 8:23</a>- <a onClick="return mV(\'Isa\',9,1);">9:1</a>; <a onClick="return mV(\'Mic\',5,2);">Mic 5:2</a>; <a onClick="return mV(\'Jer\',3,18);">Jer 3:18</a>; <a onClick="return mV(\'Jer\',23,5);">23:5</a>f; <a onClick="return mV(\'1Ki\',11,39);">1Ki 11:39</a>; the blessing of Nature, <a onClick="return mV(\'Isa\',11,\'6-8\');">Isa 11:6-8</a>; <a onClick="return mV(\'Amo\',9,13);">Am 9:13</a>ff; <a onClick="return mV(\'Hsa\',2,20);">Ho 2:20</a>ff; <a onClick="return mV(\'Hsa\',14,6);">14:6</a>ff. At all events the Messianic expectations of Ezekiel exhibit too few peculiar features and are too little prominent in the body of his prophecies to justify the belief that he was the first prophet to have introduced this so important Messianic figure. On the other hand, let us remember too that Ezekiel opposes the national feelings as sharply as possible by representing the entire past history of Israel as an unbroken chain of heathenish abominations (<a onClick="return mV(\'Eze\',1,\'1-\');">Eze 1-24</a>; <a onClick="return mV(\'Eze\',33,\'1-\');">33</a>, especially <a onClick="return mV(\'Eze\',16,\'1-\');">16</a> and <a onClick="return mV(\'Eze\',23,\'1-\');">23</a>), and remember it was just he who like Jeremiah saw his most bitter opponents in the false prophets (<a onClick="return mV(\'Eze\',13,1);">Eze 13:1</a>ff; <a onClick="return mV(\'Eze\',14,9);">14:9</a>; <a onClick="return mV(\'Eze\',22,28);">22:28</a>), and that in the most pronounced antithesis to these he proclaimed before the fall of Jerusalem that this fall would and must come. And now it is claimed that he borrowed his Messianic idea from these very people, although this Messianic conception is everywhere represented as being a Divine revelation and not a natural product of the popular consciousness. A greater blunder in theological thought could scarcely be imagined.<P>In one point, however, we do find in Ezekiel a further development of the Messianic idea, namely, that in His work, in addition to His characteristics as a king, the Messiah has also those of a high priest, as this is shown at the same period by Jeremiah (see under I,1,and 2, 3; compare later <a onClick="return mV(\'Zec\',3,\'1-\');">Zec 3</a>f; and possibly <a onClick="return mV(\'Zec\',6,9);">6:9</a>ff). The mitsnepheth, which the Messiah bears according to <a onClick="return mV(\'Eze\',21,26);">Eze 21:26</a>, is in other connections always the mitre of the high priest (compare <a onClick="return mV(\'Exd\',29,6);">Ex 29:6</a>; <a onClick="return mV(\'Exd\',39,28,31);">39:28,31</a>; see above II,2,1a and 2c). At the Passover feast, at least, the prince conducts a purification through a bullock for a sin offering, which, through the fact that this is done for himself and for the entire people of the land, reminds us of the ceremony of the high priest on the day of atonement (<a onClick="return mV(\'Eze\',45,22);">Eze 45:22</a>; <a onClick="return mV(\'Lev\',16,17,24,33);">Le 16:17,24,33</a>; compare <a href="./study/isbe/search.html?string=ATONEMENT,+DAY+OF">DAY OF ATONEMENT, I,1</a>,and Messianische Erwartung der vorexilischen Propheten, 356ff). Over against the current view, we finally emphasize the fact that Ezekiel\'s expectations of a Messianic feature are not confined to Israel, but like those of Isaiah (<a onClick="return mV(\'Isa\',2,2);">2:2</a>ff; <a onClick="return mV(\'Isa\',11,10);">11:10</a>; <a onClick="return mV(\'Mic\',5,3,6);">Mic 5:3,6</a>) and of other prophets are universal in their scope (compare <a onClick="return mV(\'Eze\',17,23);">Eze 17:23</a>; <a onClick="return mV(\'Eze\',16,53,61);">16:53,61</a>; <a onClick="return mV(\'Eze\',34,26);">34:26</a>).<P>4. Ezekiel and Apocalyptic Literature:<P>Ezekiel is also, finally, regarded as the creator of apocalyptic literature, which in prophetic garment sought to satisfy the curiosity of the people and picture the details of the last times. In this connection the critics have in mind especially <a onClick="return mV(\'Eze\',38,\'1-\');">Eze 38</a>; <a onClick="return mV(\'Eze\',39,\'1-\');">39</a>, that magnificent picture of the final onslaught of the nations under Gog and Magog, which will end with the certain victory of the Divine cause and the terrible overthrow of the enemies of Yahweh. On the mountains of Israel the hosts will fall (<a onClick="return mV(\'Eze\',39,4);">39:4</a>); seven years it will be possible to kindle fires with the weapons of the enemies (<a onClick="return mV(\'Eze\',39,9);">39:9</a>); it takes seven months to bury the dead (<a onClick="return mV(\'Eze\',39,12);">39:12</a>); a great feast is prepared for the birds (<a onClick="return mV(\'Eze\',39,17);">39:17</a>ff).<P>In reply to this there are two things to be said. First of all Ezekiel is not the creator of these thoughts. There is a whole list of passages in the Prophets that already before his time picture how matters will be after and beyond the Messianic age (compare <a onClick="return mV(\'Mic\',2,12);">Mic 2:12 b</a>f; <a onClick="return mV(\'Mic\',4,11);">4:11</a>f; <a onClick="return mV(\'Mic\',5,4);">5:4</a>f; <a onClick="return mV(\'Mic\',5,7,20);">7,20</a>; <a onClick="return mV(\'Joe\',3,2,12);">Joe 3:2,12</a>f; <a onClick="return mV(\'Isa\',11,4);">Isa 11:4</a>; <a onClick="return mV(\'Isa\',28,6);">28:6</a>; <a onClick="return mV(\'Hsa\',2,2);">Ho 2:2</a>). These are, however, all regarded by the critics as not genuine, or as the product of a later period, but they forget in this to observe that Ezekiel in these passages refers to older prophets (<a onClick="return mV(\'Eze\',38,17);">38:17</a>; <a onClick="return mV(\'Eze\',39,8);">39:8</a>), and thus they saw off the branch upon which he sits. In regard, however, to painting the fullest details of the picture, Ezekiel is equaled by none of his predecessors. In this matter, too, he represents the highest point of development, in which he is followed by <a onClick="return mV(\'Zec\',12,\'1-\');">Zec 12</a>; <a onClick="return mV(\'Zec\',13,7);">13:7</a>ff; <a onClick="return mV(\'Zec\',14,1);">14:1</a>ff, and Daniel, and with direct dependence on <a onClick="return mV(\'Eze\',38,\'1-\');">Eze 38</a>f by the Apocalypse of John (<a onClick="return mV(\'Rev\',19,17);">Re 19:17</a>). On the other hand, Ezekiel is entirely different from the later Jewish apocalyptic literature. The latter borrowed the prophetic form but possesses neither the Divine contents nor the Divine inspiration of the prophet. For this reason the apocalyptic literature appears anonymously or under a pseudonym. Ezekiel, however, openly places his name over his prophecies. In Ezekiel the eschatology is a part of his prophetic mission, and as he in his thoughts throughout remains within the bounds of the religious and ethical ideals of prophecy, this feature, too, of his work is to be regarded as a Divine revelation in a form in harmony with the Old Testament stage of the development of the kingdom of God. We are here indeed considering a matter in connection with which it is especially difficult to determine how much in reality belongs to the eternally valid contents, and how much to the temporary forms. Here too, as is the case in the exegesis of <a onClick="return mV(\'Eze\',40,\'1-\');">Eze 40-48</a>, Christian theology will vacillate between the extremes of spiritualism and realism, one extreme constantly correcting the other, and in this way constantly approaching the correct middle course, until at some time in the future we will reach the full truth in the matter.<P>5. Ezekiel\'s Conception of God:<P>A prophet who, from the aesthetic side, enjoyed the highest appreciation of a Schiller and a Herder (see 1 above), who has brought the Leviticism of the Old Testament to the highest stage of development (compare 2 above), who in his portrait of the Messiah has introduced the high-priestly characteristics (compare 3 above), who in eschatology developed new features and laid the foundation for the development that followed in later times (compare 4 above), can scarcely with any right or reason be termed a "secondary character among the prophets." This fact becomes all the more sure when we now finally examine the conception of God as taught in Ezekiel. In grandeur and variety of thought, in this respect only, Isaiah and Moses can be compared with Ezekiel. Already in the visions, we are struck by the sublimity of God as there pictured, especially in the opening vision, where He appears as the absolute ruler of all creation, over which He sits enthroned (compare II,1,above). He is constantly called "the Lord Yahweh," over against whom the prophet is at all times only "the son of man." More than fifty times it is said that the purpose of the prophecy was that the heathen nations, as well as the Israelites, shall by His judgments and His promises recognize that He is Yahweh.<P>On this side Ezekiel stands in an especially close relation to the description of the exodus from Egypt (compare <a onClick="return mV(\'Exd\',7,5,17);">Ex 7:5,17</a>; <a onClick="return mV(\'Exd\',8,10,22);">8:10,22</a>; <a onClick="return mV(\'Exd\',9,14,29,30);">9:14,29,30</a>; <a onClick="return mV(\'Exd\',10,2);">10:2</a>; <a onClick="return mV(\'Exd\',11,7);">11:7</a>; <a onClick="return mV(\'Exd\',14,4);">14:4,18</a>, and see <a href="./study/isbe/search.html?string=EXODUS">EXODUS, II,2,</a> on <a onClick="return mV(\'Exd\',7,\'8-\');">7:8-13:16</a>). Above everything Yahweh\'s honor must be defended (<a onClick="return mV(\'Eze\',36,23,32);">Eze 36:23,32</a>). Here again there is a place where the evolutionist hypothesis of the development of the idea of God is thoroughly put to shame. For in the preprophetic times it is claimed that God is, in the Old Testament, merely placed by the side of other gods and was regarded only as the God of Israel, with which He was indissolubly connected, because His existence had depended on the existence of the nation. As a proof, reference is made to the defense of His honor; and now we find the same thought in Ezekiel, in whose case it is impossible that any doubt as to his absolute monotheism can any longer arise (compare my Entwicklung der Gottesidee in vorexilischer Zeit, 138ff 152ff). The sublimity of this conception of God also appears in its universality. He is declared to be punishing the nations (compare <a onClick="return mV(\'Eze\',25,\'1-\');">Eze 25</a>ff; <a onClick="return mV(\'Eze\',35,\'1-\');">35</a>f); He uses them for His purposes (compare <a onClick="return mV(\'Eze\',38,\'1-\');">Eze 38</a>f; <a onClick="return mV(\'Eze\',17,\'1-\');">17</a>; <a onClick="return mV(\'Eze\',19,\'1-\');">19</a>; <a onClick="return mV(\'Eze\',24,\'1-\');">24</a>; <a onClick="return mV(\'Eze\',33,\'1-\');">33</a>); He intends to give them salvation (<a onClick="return mV(\'Eze\',17,\'1-\');">Eze 17</a>; <a onClick="return mV(\'Eze\',23,\'1-\');">23</a>; <a onClick="return mV(\'Eze\',16,53,61);">16:53,61</a>; <a onClick="return mV(\'Eze\',34,26);">34:26</a>; compare 3 above).<P>Most of all, Ezekiel\'s conception of God, according to the preceding sketch, reminds us of that of Calvin. By the exalted character of God we find also a second feature. On the one side we find the holy God; on the other, sinful man. The entire development of the people is from the beginning a wrong one. Ezekiel\'s thoughts are to be regarded as those for days of penance when he, on the one hand, emphasizes the great guilt of the people as such (compare <a onClick="return mV(\'Eze\',16,\'1-\');">Eze 16</a> and <a onClick="return mV(\'Eze\',23,\'1-\');">23</a>), and by the side of this maintains the principle that each one must be punished on account of his own sins (<a onClick="return mV(\'Eze\',18,2);">Eze 18:2</a>), so that the individual cannot excuse himself, and the individual cannot be freed through the guilt of the people as a totality. But now comes the highest conception. The exalted and holy God comes to be a God of love. What is it but love, that He does not reject His people forever, but promises them a future (compare <a onClick="return mV(\'Eze\',34,\'1-\');">Eze 34-48</a>, in which also the divided kingdoms are to be reunited, <a onClick="return mV(\'Eze\',37,15);">37:15</a>ff)? As Exodus finds its culmination point in the indwelling of God among His people, which He promised in <a onClick="return mV(\'Exd\',25,\'1-\');">Ex 25</a>ff (<a onClick="return mV(\'Exd\',25,8);">25:8</a>; <a onClick="return mV(\'Exd\',29,45);">29:45</a>f), but seems to have become a matter of doubt again in <a onClick="return mV(\'Exd\',32,\'1-\');">Ex 32</a>ff through the apostasy of the people, and nevertheless is finally realized in <a onClick="return mV(\'Exd\',35,\'1-\');">Ex 35</a>ff (<a onClick="return mV(\'Exd\',40,34);">40:34</a>ff), thus too in <a onClick="return mV(\'Eze\',10,\'1-\');">Eze 10</a>f; Yahweh leaves the city, but in <a onClick="return mV(\'Exd\',43,1);">43:1</a>ff He again returns, and now the name of the city is "Yahweh is there" (<a onClick="return mV(\'Exd\',48,35);">48:35</a>). But as every single member participates in the sin and the punishment of the people, so too he takes part in the deliverance. Ezekiel is indeed, as little as is Jeremiah, the creator of individualism, which he has often been declared to be. Against this claim, e.g. the character of the patriarchs can be appealed to. But a deeper conception of individualism has actually been brought about by Jeremiah and Ezekiel. The national organization as such was for the present dissolved. Accordingly, these prophets have now to deal more with the individual (compare 1,2,3, above). Ezekiel is actually the pastor of those in exile. He has been appointed the watchman of the house of Israel (<a onClick="return mV(\'Exd\',3,16);">3:16</a>ff and <a onClick="return mV(\'Exd\',33,1);">33:1</a>ff). He can bear the responsibility for the individual souls (compare also <a onClick="return mV(\'Eze\',18,\'1-\');">Eze 18</a>). The wicked man who dies without having been warned is demanded from his hand by God. Yahweh does not wish the death of the sinner, but that he should repent and live. Here such a clear mirror is given, that before it conscientious Christian preachers must all feel ashamed. Yahweh is the gracious God, who does not treat men simply according to the principle of retaliation, else what would become of man? God rather desires to bestow all things out of free grace; he that repents shall live. This is the highest ideal of the prophet, and with it we close.<P>The Feast of Weeks, the Pentecost of the Israelites, Ezekiel does not mention (compare II,2,2b, above). This festival has come to be one of higher importance since on Pentecost the Holy Spirit was poured out, and this Spirit Ezekiel knows. Besides, such passages as <a onClick="return mV(\'Jer\',32,15);">Jer 32:15</a>; <a onClick="return mV(\'Jer\',44,\'1-6\');">44:1-6</a>; <a onClick="return mV(\'Psa\',51,12);">Ps 51:12</a>ff; <a onClick="return mV(\'Joe\',2,28);">Joe 2:28</a>ff; <a onClick="return mV(\'Jer\',31,31);">Jer 31:31</a>ff, it is Ezekiel which contains the clearest predictions of Pentecost. It is the Spirit who in <a onClick="return mV(\'Eze\',37,\'1-\');">Eze 37</a> awakens to new life the dead bones of Israel.<P>And in <a onClick="return mV(\'Eze\',36,\'25-28\');">Eze 36:25-28</a> we read: "And I will sprinkle clean water upon you, and ye shall be clean: from all your filthiness, and from all your idols, will I cleanse you. A new heart also will I give you, and a new spirit will I put within you; and I will take away the stony heart out of your flesh, and I will give you a heart of flesh. And I will put my Spirit within you, and cause you to walk in my statutes, and ye shall keep mine ordinances, and do them. And ye shall dwell in the land that I gave to your fathers; and ye shall be my people, and I will be your God."<P>LITERATURE.<P>Comm. of Keil, Havernick, Hengstenberg, von Orelli, Smend, Bertholet, Kraetzschmar. For the Messianic Prophecies, the works of von Orelli, Riehm, Delitzsch, Hengstenberg. Compare also Volz, Die vorexilische Jahwe-Prophetie und der Messias; Moller, Die messianische Erwartung der vorexilischen Propheten, zugleich ein Protest gegen moderne Textzersplitterung; Cornill, The Prophet Ezekiel; Klostermann, Studien und Kritken, 1877. Introductions of Kuenen, Strack, Baudissin, Konig, Cornill, Driver. Histories of Israel, by Kohler, Konig, Kittel, Klostermann, Oettli, Stade, Wellhausen. Bible Lexicons, see under "Ezekiel."<P>Against the Graf-Wellhausen Hypothesis, Moller, Are the Critics Right? In this Encyclopedia, for further literature compare also the article <a href="./study/isbe/search.html?string=LEVITICUS">LEVITICUS</a>: Orr, Orr, The Problem of the Old Testament; Wiener, Essays in Pentateuchal Criticism, and The Origin of the Pentateuch; Hoffmann, Die wichtigsten Instanzen gegen die Graf-Wellhausensche Hypothese; Kegel, Wilhelm Vatke u. die Graf-Wellhausensche Hypothese; Zunz, Die gottesdienstlichen Vortrage der Juden; Seinecke, Geschichte des Volkes Israel, II.``122';
isbe[3330]='Ezel`e\'-zel (ha-\'azel; Septuagint para to ergab ekeino):<P>As it stands, the narrative in <a onClick="return mV(\'1Sa\',20,19);">1Sa 20:19</a> records the tryst of Jonathan with David at the stone Ezel. The name occurs only here. There is general agreement that the text is corrupt, but there is no agreement as to how it should be restored. The Septuagint reads "this mound" (the Revised Version (British and American), margin), or "yonder cairn"; and in <a onClick="return mV(\'1Sa\',20,41);">1Sa 20:41</a> instead of "out of a place toward the south" it reads "from beside the mound" or "cairn." Dr. Cheyne suggests "yonder juniper tree" (Encyclopaedia Biblica, under the word).``1';
isbe[3331]='Ezem`e\'-zem (\'etsem, "bone"; Boosal, Boasom):<P>A city in the extreme south of Judah, assigned to Simeon.<P>Some identify it with Azmon (<a onClick="return mV(\'Jos\',15,29);">Jos 15:29</a>; <a onClick="return mV(\'Jos\',19,3);">19:3</a>; <a onClick="return mV(\'1Ch\',4,29);">1Ch 4:29</a>).``1';
isbe[3332]='Ezer`e\'-zer (\'ezer, "help"):<P>(1) A Horite chief (<a onClick="return mV(\'Gen\',36,21);">Ge 36:21</a>; <a onClick="return mV(\'1Ch\',1,38);">1Ch 1:38</a>).<P>(2) A Judahite (<a onClick="return mV(\'1Ch\',4,4);">1Ch 4:4</a>).<P>(3) An Ephraimite, slain by men of Gath (<a onClick="return mV(\'1Ch\',7,21);">1Ch 7:21</a>).<P>(4) A Gadite who followed David while in exile on account of the wrath of Saul (<a onClick="return mV(\'1Ch\',12,9);">1Ch 12:9</a>).<P>(5) One of those who under direction of Nehemiah repaired the wall of Jerusalem (<a onClick="return mV(\'Neh\',3,19);">Ne 3:19</a>).<P>(6) A musician in one of the great companies appointed by Nehemiah to give thanks at the dedication of the wall of Jerusalem (<a onClick="return mV(\'Neh\',12,42);">Ne 12:42</a>).``1';
isbe[3333]='Ezerias`ez-e-ri\'-as (Ezerias):<p>1Esdras 8:1 the King James Version, the Revised Version (British and American) "Zechrias," the Azariah of <a onClick="return mV(\'Ezr\',7,1);">Ezr 7:1</a>.``1';
isbe[3334]='Ezias`e-zi\'-as:<P>the Revised Version (British and American)<P><a href="./study/isbe/search.html?string=OZIAS">OZIAS</a> (which see).``1';
isbe[3335]='Ezion-Geber`e-zi-on-ge\'-ber (\'etsyon gebher; Gasion Gaber):<P>Always mentioned along with Elath ("Eziongaber," <a onClick="return mV(\'Num\',33,35);">Nu 33:35</a>f the King James Version). When the children of Israel left "the way of the Arabah," having come from the Northwest, they seem to have turned to the Northeast from the neighborhood of \'Aqaba, passing up by Wady el-Ithm toward the eastern desert (<a onClick="return mV(\'Deu\',2,8);">De 2:8</a>). Elath and Ezion-geber were evidently not far apart. They are named together again in connection with the maritime enterprises of Solomon and Jehoshaphat (<a onClick="return mV(\'1Ki\',9,26);">1Ki 9:26</a>, etc.). They therefore both lay on the shore of the sea. No trace of Ezion-geber is to be found on the present coast line. It is probable, however, that in ancient times the sea covered a considerable stretch of the mud flats at the south end of Wady el-\'Arabah, and the site of Ezion-geber may be sought near the spring \'Ain el-Ghudyan, about 15 miles north of the present head of the Gulf of \'Aqaba.``54';
isbe[3336]='Eznite`ez-\'nit (\'etsni or \'etsno).`<a href="./study/isbe/search.html?string=ADINO">ADINO</a>`1';
isbe[3337]='Ezora`e-zo\'-ra (Ezora, the King James Version Ozora):<P>He and his six sons "gave their hands to put away their strange wives" (1Esdras 9:20,34 = "Machnadebai" of <a onClick="return mV(\'Ezr\',10,40);">Ezr 10:40</a>).``1';
isbe[3338]='Ezra`ez\'-ra (Aramaic or Chaldee, \'ezra\', "help"; a hypocoristicon, or shortened form of Azariah, "Yahweh has helped." The Hebrew spells the name \'ezrah, as in <a onClick="return mV(\'1Ch\',4,17);">1Ch 4:17</a>, or uses the Aramaic spelling of the name, as in <a onClick="return mV(\'Ezr\',7,1);">Ezr 7:1</a>. The Greek form is Esdras):<P>(1) A priest who returned with Zerubbabel from Babylon (<a onClick="return mV(\'Neh\',12,1);">Ne 12:1</a>). In <a onClick="return mV(\'Neh\',10,2);">Ne 10:2</a>, Azariah, the full form of the name, is found.<P>(2) A descendant of Judah and father of Jethro and other sons (<a onClick="return mV(\'1Ch\',4,17);">1Ch 4:17</a>).<P>(3) The distinguished priest who is the hero of the Book of Ezra and co-worker with Nehemiah.<P>1. Family:<P>The genealogy of Ezra is given in <a onClick="return mV(\'Ezr\',7,\'1-6\');">Ezr 7:1-6</a>, where it appears that he was the son of Seraiah, the son of Azariah, the son of Hilkiah, the son of Shallum, the son of Ahitub, the son of Amariah, the son of Azariah, the son of Meraioth, the son of Zerahiah, the son of Uzzi, the son of Bukki, the son of Abishua, the son of Phinehas, the son of Eleazar, the son of Aaron, the high priest. Since Seraiah, according to the Book of Kings, was killed by Nebuchadrezzar at Riblah (<a onClick="return mV(\'2Ki\',25,\'18-21\');">2Ki 25:18-21</a>), and since he was the father of Jehozadak, the high priest who was carried into captivity by Nebuchadrezzar (<a onClick="return mV(\'1Ch\',6,14,15);">1Ch 6:14,15; (Hebrew 5:14)</a>, etc. in 588 BC, and since the return under Ezra took place in 458 BC, the word "son" must be used in <a onClick="return mV(\'Ezr\',7,2);">Ezr 7:2</a> in the sense of descendant. Since, moreover, Joshua, or Jeshua, the high priest, who returned from Babylon with Zerubbabel, was the son of Jehozadak and the grandson of Seraiah, Ezra was probably the great-grandson or great-great-grandson of Seraiah. Inasmuch as Jehozadak is never mentioned as one of his forefathers, Ezra was probably not descended from Jehozadak, but from a younger brother. He would thus not be a high priest, though he was of high-priestly descent as far as Seraiah. For the sake of shortening the list of names, six names are omitted in <a onClick="return mV(\'Ezr\',7,\'2-7\');">Ezr 7:2-7</a> between Azariah and Meraioth, and one between Shallum and Ahitub from the corresponding list found in <a onClick="return mV(\'1Ch\',6,\'4-14\');">1Ch 6:4-14 (Hebrew 5:30-40)</a>.<P>Being a priest by birth, it is to be supposed that Ezra would have performed the ordinary functions of a member of his order, if he had been born and had lived in Palestine.<P>2. Occupation:<P>Jos, indeed, says that he was high priest of his brethren in Babylon, a statement that in view of the revelation of the Elephantine papyri may not be without a foundation in fact. According to the Scriptures and Jewish tradition, however, Ezra was pre-eminently a scribe, and especially a scribe of the law of Moses. He is called "a ready scribe in the law of Moses," a "scribe of the words of the commandments of Yahweh, and of his statutes to Israel," "the scribe of the law of the God of heaven." As early as the time of Jeremiah (compare <a onClick="return mV(\'Jer\',8,8);">Jer 8:8</a>), "scribe" had already attained the meaning of one learned in the Scriptures, one who had made the written law a subject of investigation. Ezra is the first who is called by the title of "the scribe," the title by which Artaxerxes designates him in his letter of instructions in <a onClick="return mV(\'Ezr\',7,6,11);">Ezr 7:6,11</a>.<P>3. His Commission:<P>In the 7th year of Artaxerxes I (459-458 BC) Ezra requested permission of the king to go up to Jerusalem; for "Ezra had set his heart to seek the law of Yahweh, and to do it, and to teach in Israel statutes and ordinances." Artaxerxes granted his request, and gave him a letter permitting as many of the people of Israel and of the priests and Levites as so desired to accompany him to Jerusalem, and commissioning him to inquire concerning Judah and Jerusalem, and to carry a gift of money from the king and his counselors, and all the money to be found in the province of Babylon, and the freewill offerings of the people and priests, with which to buy offerings to offer upon the altar of the house of God which was in Jerusalem. He was commissioned also to carry vessels for the service of the house of God, and to do at the expense of the royal treasury whatever was needful for the house of God. The king decreed, moreover, that the treasurers of the king should assist Ezra with a tribute of wheat, wine, oil and salt, and that they should impose no tribute, custom or toll upon any of those employed in the service of the house of God. Moreover, Ezra was authorized to appoint judges to judge the people according to the law of God and the law of the king, and to inflict punishments upon all who would not obey these laws. Ascribing this marvelous letter of the king to the lovingkindness of his God, and strengthened by this evidence of God\'s power, Ezra proceeded to gather together out of Israel the chief men and teachers and ministers of the house to go up with him to Jerusalem. He gathered these men in camp at Casiphia, on the river Ahava. Here he proclaimed a time of fasting and prayer, that God might prosper their journey (<a onClick="return mV(\'Ezr\',8,\'15-23\');">Ezr 8:15-23</a>). Then, having delivered the treasures into the hands of the priests, the assembled company departed for Jerusalem, where by the help of God they arrived in safety, delivered over the money and gifts by number and weight, offered burnt offerings and sin offerings, delivered the king\'s commissions and furthered the people and the house of God.<P>Shortly after Ezra\'s arrival at Jerusalem, the princes accused the people, the priests, and the Levites of having intermarried with the peoples of the land, even asserting that the princes and rulers had been leaders in the trespass. Upon hearing this, Ezra was confounded, rent his garments, plucked off his hair, fell upon his knees and prayed a prayer of confession, weeping and casting himself down before the house of God. While he prayed the people assembled and wept, acknowledged their sin and promised to do according to the law. The whole people were then assembled in counsel, and in spite of some opposition the strange wives were put away.<P>In <a onClick="return mV(\'Neh\',8,\'1-\');">Ne 8</a>, Ezra appears again upon the scene at the Feast of Tabernacles as the chief scribe of the law of Moses, the leader of the priests and Levites who read and explained the law to the people. On his advice the people ceased from their mourning and celebrated the festival according to the law of Moses with joy and thanksgiving and giving of gifts, dwelling also in booths in commemoration of the manner of their fathers\' sojourning while in the wilderness.<P>4. Traditions:<P>The traditions with regard to Ezra found in Josephus and in the Talmud are so discrepant that it is impossible to place reliance upon any of their statements which are not found also in the canonical Scriptures.``196';
isbe[3339]='Ezra-Nehemiah`Contents<P>1. Name.<P>2. Object<P>3. Plan<P>4. Unity<P>5. Sources<P>6. Literary Character<P>7. Languages<P>8. Historicity<P>9. Text<P>LITERATURE<hr /><P>1. Name:<P>The books of Ezra and Nehemiah, by whomsoever written, are properly so named according to analogy from the principal persons mentioned in them. In the Hebrew Bibles, the former is headed simply, Ezra, and the latter, Nehemiah. The two books are counted in the Talmud, in Josephus, and in the Canon of Melito, 171 AD, as one, and are so treated also in the subscription of the Massoretic Text, which reads: "The totality of the verses of Ezra and Nehemiah is 688, and its sign is \'Remember, Yahweh, the reproach of thy servants,\' and its two parts (are at the sentence) \'unto the ascent of the corner\' (<a onClick="return mV(\'Neh\',3,31);">Ne 3:31</a>) and its chapters (sedharayw) are ten, and its sign is \'Upon a high mountain get thee up, O thou that announcest good tidings to Zion.\'" In the Septuagint, Ezra-Nehemiah is called Esdras B, while an apocryphal Book of Ezra is called Esdras A (see below). In the catalogues of the Old Testament writings handed down to us by the Fathers (Origen, Cyril, Melito, Jerome and the Council of Laodicea) our Ezra is called 1 Ezra; Nehemiah, 2 Ezra; the apocryphal Greek Ezra, 3 Ezra; and an apocalyptic book, falsely called a book of Ezra, is denominated 4 Ezra.<P>2. Object:<P>The object of the books is to show that God fulfilled His promise, or prophecy, to restore His exiled people to their inheritance, through the instrumentality on the one hand of the great heathen monarchs, Cyrus, Darius and Artaxerxes, and on the other hand by stirring up the spirit of such great men among the chosen people as Joshua and Zerubbabel, Haggai and Zechariah, and Ezra and Nehemiah, through whom the altar, the temple, the houses and walls of Jerusalem, and finally the worship and ceremony of the Jewish people were reestablished, the people being separated from foreign admixtures, customs and idolatry, and their religious observances purified and fixed for all time.<P>3. Plan:<P>The object of the work justifies the selection and arrangement of the material and the plan pursued by the composer, or composers; all matter being stringently excluded which does not bear directly upon the purpose in view. However much we may wish that other historical records had been included, it is not proper to criticize the work because of these omissions, nor is it fair to argue that the writer was ignorant of what he has not seen fit to record.<P>4. Unity:<P>The unity of the combined work is shown by the fact that they have the same common object, the same plan, and a similarity of language and style; that they treat, for the most part, of the same period of time; and that Ezra is one of the most prominent persons in both. It is not fair to deny the essential unity on the ground that the list of priests and others found in <a onClick="return mV(\'Ezr\',2,\'1-\');">Ezr 2</a> is repeated in <a onClick="return mV(\'Neh\',7,\'1-\');">Ne 7</a>; for there is no doubt that Ezra was the compiler of parts at least of the book called after him, and that Nehemiah also was the original writer of parts of the book that bears his name. Whoever was the final editor of the whole work, he has simply retained the two almost identical lists in their appropriate places in the documents which lay before him.<P>5. Sources:<P>The Books of Ezra and Nehemiah are a compilation of genealogical lists, letters and edicts, memoirs and chronicles. We cannot be certain as to who was the composer of either or both books. Many think that Ezra compiled both the books out of preexisting materials, adding parts of his own composition. Others, suppose that Ezra wrote the book named after him, while Nehemiah composed the Book of Nehemiah. Others, again, are of the opinion that neither Ezra nor Nehemiah, but some other unknown editor, most probably the compiler of the Books of Chronicles, put together the Books of Ezra and Nehemiah, using largely the memoirs of the two great men who are the principal persons in the records. While there is still much difference of opinion as to who was the final redactor, there is a general agreement as to the composite character of the whole, and that the person who wrote the parts that bind together the original sources was the same as he who wrote the canonical Books of Chronicles.<P>6. Literary Character:<P>The diversified character of the style, languages and other literary peculiarities of the books is accounted for by the large number and the variety of sources. From the style and contents of the first chapter it has been argued with great plausibility that it was written by Daniel; for similar reasons it has been argued that the portion of Ezra from 3:2 to 4:22 inclusive was written by Haggai the prophet. All admit that the parts of Ezra and Nehemiah in which the 1st person is employed were written by Ezra and Nehemiah respectively. As to who it was who added the other connecting portions there is and must always be great doubt arising from the fact that the author is not mentioned. The style points to the same hand as that which composed the Book of Chronicles. Those who believe that Ezra compiled the Book of Chronicles will believe that he most probably composed also the Books of Ezra and Nehemiah. The principal objection to his authorship arises from the inexplicable change from the 1st to the 3rd person occurring in both Ezra and Nehemiah. Inasmuch as the 3rd person is the proper form to use in the best style of Biblical historical composition; inasmuch as Herodotus, Thucydides and Xenophon often employ it in their histories; inasmuch as some of the Bah monuments mingle the 1st and 3rd persons in the same document; and finally, inasmuch as the prophets and psalmists of Israel likewise interchange the persons in what is for us often an unaccountable manner: this characteristic of the style of Ezra-Neh
