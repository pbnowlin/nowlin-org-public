isbe[3391]='Fathom`fath\'-um (orguia): The literal meaning is the length of the outstretched arms, and it was regarded as equal to 4 cubits, or about 6 feet. (<a onClick="return mV(\'Act\',27,28);">Ac 27:28</a>).`<a href="./study/isbe/search.html?string=WEIGHTS+AND+MEASURES">WEIGHTS AND MEASURES</a>`1';
isbe[3392]='Fatling; Fatted``<a href="./study/isbe/search.html?string=CALF">CALF</a>`1';
isbe[3393]='Fatness`fat\'-nes (deshen; piotes):<P>1. Literal:<P>The translation of deshen (<a onClick="return mV(\'Jdg\',9,9);">Jud 9:9</a>, "But the olive-tree said unto them, Should I leave my fatness?"; <a onClick="return mV(\'Job\',36,16);">Job 36:16</a> (of food)), "full of fatness"; of chelebh, "fat," "the best part," "the marrow" (<a onClick="return mV(\'Job\',15,27);">Job 15:27</a>; <a onClick="return mV(\'Psa\',73,7);">Ps 73:7</a>; <a onClick="return mV(\'Isa\',34,6,7);">Isa 34:6-7</a>); of mishman, "fathess," "fertility" (<a onClick="return mV(\'Gen\',27,28);">Ge 27:28</a>, "the fatness of the earth"; <a onClick="return mV(\'Isa\',17,4);">Isa 17:4</a>, "the fatness of his flesh"); of shemen, "fatness," "oil" (<a onClick="return mV(\'Psa\',109,24);">Ps 109:24</a>); of piotes, "fat," "fatness" (<a onClick="return mV(\'Rom\',11,17);">Ro 11:17</a>, "partaker...of the root of the fatness of the olive tree").<P>2. Figurative:<P>"Fatness" is used figuratively for the richness of God\'s goodness; as such it is the translation of deshen ("They shall be abundantly satisfied (margin "Hebrew watered") with the fatness of thy house" (<a onClick="return mV(\'Psa\',36,8);">Ps 36:8</a>); "Thy paths drop fatness" (<a onClick="return mV(\'Psa\',65,11);">Ps 65:11</a>; compare <a onClick="return mV(\'Isa\',55,2);">Isa 55:2</a>; <a onClick="return mV(\'Jer\',31,14);">Jer 31:14</a>).<P>"With fatness" is supplied, <a onClick="return mV(\'Deu\',32,15);">De 32:15</a> the King James Version, "covered with fatness"; the Revised Version (British and American) has "become sleek"; for "The yoke shall be destroyed because of the anointing" (<a onClick="return mV(\'Isa\',10,27);">Isa 10:27</a>) the American Standard Revised Version has "by reason of fatness," margin "Hebrew oil"; the English Revised Version as the King James Version, with margin as the American Standard Revised Version; the text is believed to be corrupt; Septuagint has "from your shoulders."``185';
isbe[3394]='Fauchion`fo\'-shun.`<a href="./study/isbe/search.html?string=SCIMITAR">SCIMITAR</a>`1';
isbe[3395]='Fault`folt (chata\'; aitia, memphomai): Implies defect, of less moral weight than crime or sin. It is the translation of chata\', "error," "failure," "sin" (<a onClick="return mV(\'Exd\',5,16);">Ex 5:16</a>); of cheT\', same meaning (<a onClick="return mV(\'Gen\',41,9);">Ge 41:9</a>, "I do remember my faults this day"); of \'awon, "perversity," "iniquity" (<a onClick="return mV(\'2Sa\',3,8);">2Sa 3:8</a>; <a onClick="return mV(\'Psa\',59,4);">Ps 59:4</a>); of rish\'ah, "wrongness," "wickedness" (<a onClick="return mV(\'Deu\',25,2);">De 25:2</a>, the Revised Version (British and American) "wickedness"); of shechath (Aramaic) "corruption" (<a onClick="return mV(\'Dan\',6,4);">Da 6:4</a> twice); me\'umah, "anything" (<a onClick="return mV(\'1Sa\',29,3);">1Sa 29:3</a>, "no fault in him," literally, "not anything"); of aitia, "cause," "case," "guilt," (<a onClick="return mV(\'Jhn\',18,38);">Joh 18:38</a>; <a onClick="return mV(\'Jhn\',19,4,6);">19:4,6</a>; Pilate of Jesus, "I find no fault in him," the Revised Version (British and American) "no crime"; the same word is rendered "accusation," i.e. \'legal cause for prosecution,\' <a onClick="return mV(\'Mat\',27,37);">Mt 27:37</a>; <a onClick="return mV(\'Mar\',15,26);">Mr 15:26</a>; compare <a onClick="return mV(\'Act\',25,18,27);">Ac 25:18,27</a>); of aition, same meaning (<a onClick="return mV(\'Luk\',23,4,14);">Lu 23:4,14</a>; <a onClick="return mV(\'Luk\',23,22);">23:22</a>, aition thanatou "cause of death"); of hettema, "a worse condition," "defect" (<a onClick="return mV(\'1Cr\',6,7);">1Co 6:7</a>, the Revised Version (British and American) "a defect," margin "a loss to you"); of paraptoma, "a falling aside" (<a onClick="return mV(\'Gal\',6,1);">Ga 6:1</a>, "If a man be overtaken in fault," the Revised Version (British and American) "in any trespass," margin "by"; <a onClick="return mV(\'Jam\',5,16);">Jas 5:16</a>, "Confess your faults one to another," the Revised Version (British and American) "Confess therefore your sins one to another"); hamartano, "to miss," "err," "sin," is translated "your faults" (<a onClick="return mV(\'1Pe\',2,20);">1Pe 2:20</a> the Revised Version (British and American), "when ye sin"); memphomai, "to blame," is translated "to find fault" (<a onClick="return mV(\'Mar\',7,2);">Mr 7:2</a> omitted the Revised Version (British and American); <a onClick="return mV(\'Rom\',9,19);">Ro 9:19</a>; <a onClick="return mV(\'Hbr\',8,8);">Heb 8:8</a>); elegcho, "to convict," "to tell one\'s fault" (<a onClick="return mV(\'Mat\',18,15);">Mt 18:15</a>, the Revised Version (British and American) "show him his fault"); amomos, "without blemish," "spotless," is translated "without fault" (<a onClick="return mV(\'Rev\',14,5);">Re 14:5</a>, the Revised Version (British and American) "without blemish," "faultless"; <a onClick="return mV(\'Jud\',1,24);">Jude 1:24</a>, "able to present you faultless," the Revised Version (British and American) "without blemish"); amemptos, "blameless," "without reproach" (<a onClick="return mV(\'Hbr\',8,7);">Heb 8:7</a>, "for if that first covenant had been faultless"). "Faulty" is the translation of \'ashem, "guilty" (<a onClick="return mV(\'2Sa\',14,13);">2Sa 14:13</a>, "as one which is faulty," the Revised Version (British and American) "guilty"); of \'asham, "to be or become guilty" (<a onClick="return mV(\'Hsa\',10,2);">Ho 10:2</a>, Revised Version "guilty").``185';
isbe[3396]='Favor`fa\'-ver (chen, ratson, with other Hebrew words; charis): Means generally good will, acceptance, and the benefits flowing from these; in older usage it meant also the countenance, hence, appearance. Alternating in English Versions of the Bible with "grace," it is used chiefly of man, but sometimes also of God (<a onClick="return mV(\'Gen\',18,3);">Ge 18:3</a>; <a onClick="return mV(\'Gen\',30,27);">30:27</a>; <a onClick="return mV(\'Gen\',39,21);">39:21</a>; <a onClick="return mV(\'Exd\',3,21);">Ex 3:21</a>; <a onClick="return mV(\'2Sa\',15,25);">2Sa 15:25</a>, "in the eyes of Yahweh," etc.). It is used perhaps in the sense of "countenance" in <a onClick="return mV(\'Pro\',31,30);">Pr 31:30</a>, "Favor is deceitful, and beauty is vain" (the King James Version), where for "favor" the Revised Version (British and American) has "grace"; the reference is to external appearance. "Favored" is used in the sense of "appearance" in the phrase "well-favored" (<a onClick="return mV(\'Gen\',29,17);">Ge 29:17</a>; <a onClick="return mV(\'Gen\',39,6);">39:6</a>; <a onClick="return mV(\'Gen\',41,2,4);">41:2,4</a>); conversely, "ill-favored" (<a onClick="return mV(\'Gen\',41,3,4);">Ge 41:3-4</a>). For "favor" the Revised Version (British and American) has "have pity on" (<a onClick="return mV(\'Psa\',109,12);">Ps 109:12</a>), "good will" (<a onClick="return mV(\'Pro\',14,9);">Pr 14:9</a>), "peace" (<a onClick="return mV(\'Sgs\',8,10);">So 8:10</a>); the English Revised Version "grace" (<a onClick="return mV(\'Rth\',2,13);">Ru 2:13</a>), the American Standard Revised Version "kindness" (<a onClick="return mV(\'Est\',2,17);">Es 2:17</a>; <a onClick="return mV(\'Dan\',1,9);">Da 1:9</a>), etc. In the American Standard Revised Version "the acceptable year of the Lord" (<a onClick="return mV(\'Isa\',61,2);">Isa 61:2</a>) is changed Into "the year of Yahweh\'s favor"; "Do I now persuade men" (<a onClick="return mV(\'Gal\',1,10);">Ga 1:10</a>) into, "Am I now seeking the favor of men," and there are other the Revised Version (British and American) changes.``185';
isbe[3397]='Fawn`fon.`<a href="./study/isbe/search.html?string=DEER">DEER</a>`1';
isbe[3398]='Fear`fer (yir\'ah, yare\'; phobos, phobeo):<P>Terms, etc.:<P>"Fear" is the translation of many words in the Old Testament; the chief are: yir\'ah, "fear," "terror," "reverence," "awe," most often "the fear of God," "fear of Yahweh" (<a onClick="return mV(\'Gen\',20,11);">Ge 20:11</a>; <a onClick="return mV(\'2Ch\',19,9);">2Ch 19:9</a>, etc.); also of "fear" generally (<a onClick="return mV(\'Job\',22,4);">Job 22:4</a>; <a onClick="return mV(\'Isa\',7,25);">Isa 7:25</a>; <a onClick="return mV(\'Eze\',30,13);">Eze 30:13</a>, etc.); yare\', "to be afraid," "to fear," "to reverence" (<a onClick="return mV(\'Gen\',15,1);">Ge 15:1</a>; <a onClick="return mV(\'Lev\',19,3,14);">Le 19:3,14</a>; <a onClick="return mV(\'Deu\',6,2);">De 6:2</a>, etc.); pachadh, "fear," "terror," "dread" (<a onClick="return mV(\'Gen\',31,42,53);">Ge 31:42,53</a>; <a onClick="return mV(\'Deu\',11,25);">De 11:25</a>; <a onClick="return mV(\'1Sa\',11,7);">1Sa 11:7</a> the King James Version; <a onClick="return mV(\'Job\',4,14);">Job 4:14</a>; <a onClick="return mV(\'Isa\',2,10);">Isa 2:10</a> the King James Version, etc.).<P>"Fearful" (timid) is the translation of yare\' (<a onClick="return mV(\'Deu\',20,8);">De 20:8</a>; <a onClick="return mV(\'Jdg\',7,3);">Jud 7:3</a>); "to be feared," yare\' (<a onClick="return mV(\'Exd\',15,11);">Ex 15:11</a>; <a onClick="return mV(\'Deu\',28,58);">De 28:58</a>; compare <a onClick="return mV(\'Psa\',130,4);">Ps 130:4</a>); in <a onClick="return mV(\'Isa\',35,4);">Isa 35:4</a>, it is the translation of mahar, "hasty," "them that are of a fearful heart," margin "Hebrew hasty"; perhaps, ready to flee (for fear).<P>"Fearfully" (<a onClick="return mV(\'Psa\',139,14);">Ps 139:14</a>): yare\', "I am fearfully (and) wonderfully made," so the Revised Version (British and American); "and" is not in the text, so that "fearfully" may be equivalent to "extremely," to an awesome degree; compare <a onClick="return mV(\'Psa\',65,5);">Ps 65:5</a>, "by terrible things...in righteousness"; <a onClick="return mV(\'Psa\',66,3);">66:3</a>, "How terrible are thy works (yare\' "fearful"); the Septuagint, Peshitta, Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) have "Thou art fearfully wonderful."<P>"Fearfulness" occurs In <a onClick="return mV(\'Psa\',55,5);">Ps 55:5</a> (yir\'ah); <a onClick="return mV(\'Isa\',21,4);">Isa 21:4</a> (pallatsuth), the Revised Version (British and American) "horror"; <a onClick="return mV(\'Isa\',33,14);">Isa 33:14</a> (re\'adhah, "trembling"), "Fearfulness hath surprised the hypocrites," the Revised Version (British and American) "Trembling hath seized the godless ones."<P>In the New Testament the chief words are phobos, "fear," "terror," "affright" (<a onClick="return mV(\'Mat\',14,26);">Mt 14:26</a>; <a onClick="return mV(\'Mat\',28,4,8);">28:4,8</a>; <a onClick="return mV(\'Luk\',21,26);">Lu 21:26</a>; <a onClick="return mV(\'1Jo\',4,18);">1Joh 4:18</a>, etc.), and phobeo, "to put in fear" (both used of ordinary fear) (<a onClick="return mV(\'Mat\',1,20);">Mt 1:20</a>; <a onClick="return mV(\'Mat\',10,26);">10:26</a>; <a onClick="return mV(\'Mat\',28,5);">28:5</a>; <a onClick="return mV(\'2Cr\',12,20);">2Co 12:20</a>, etc.); of the fear of God, the noun (<a onClick="return mV(\'Rom\',3,18);">Ro 3:18</a>; <a onClick="return mV(\'2Cr\',7,1);">2Co 7:1</a>), the verb (<a onClick="return mV(\'Luk\',18,4);">Lu 18:4</a>; <a onClick="return mV(\'Luk\',23,40);">23:40</a>, etc.); deilia, "timidity," "fear," occurs in <a onClick="return mV(\'2Ti\',1,7);">2Ti 1:7</a>, "God hath not given us the spirit of fear," the Revised Version (British and American) "a spirit of fearfulness"; ekphobos, "frightened out (of one\'s senses)," "greatly terrified" (<a onClick="return mV(\'Hbr\',12,21);">Heb 12:21</a>; compare <a onClick="return mV(\'Deu\',9,19);">De 9:19</a>; The <span class="noTag">Wisdom of Solomon 17:9</span> the King James Version); apo tes eulabeias is translated (<a onClick="return mV(\'Hbr\',5,7);">Heb 5:7</a>) "(of Christ) who was heard in that he feared," the Revised Version (British and American) "having been heard for his godly fear"; so all the Greek commentators; eulabeia, properly, "caution," "circumspection," is used in the New Testament for godly fear (<a onClick="return mV(\'Hbr\',12,28);">Heb 12:28</a>, the Revised Version (British and American) "reverence and awe," margin as the King James Version); compare eulabes (<a onClick="return mV(\'Luk\',2,25);">Lu 2:25</a>; <a onClick="return mV(\'Act\',2,5);">Ac 2:5</a>; <a onClick="return mV(\'Act\',8,2);">8:2</a>); eulabeomai, "to act with caution" (<a onClick="return mV(\'Act\',23,10);">Ac 23:10</a>). Deilos, "fearful," "timid," occurs in <a onClick="return mV(\'Mat\',8,26);">Mt 8:26</a>; <a onClick="return mV(\'Mar\',4,40);">Mr 4:40</a>; <a onClick="return mV(\'Rev\',21,8);">Re 21:8</a>, "Their part shall be...the second death"; phoberos, "fearful," "terrible" (<a onClick="return mV(\'Hbr\',10,27,31);">Heb 10:27,31</a>); phobetron, "something fearful," "a terrible sign or portent" (<a onClick="return mV(\'Luk\',21,11);">Lu 21:11</a>, Revised Version (British and American) "terrors").<P>Fear is a natural and, in its purpose, beneficent feeling, arising in the presence or anticipation of danger, and moving to its avoidance; it is also awakened in the presence of superiors and of striking manifestations of power, etc., taking the form of awe or reverence. Fear has been said to be the source of religion, but religion can never have originated from fear alone, since men are impelled to draw nigh with expectation to the object of worship.<P>"Fear" is certainly a prominent element in Old Testament religion; the "fear of God" or of Yahweh, "the fear of the Lord," is indeed synonymous with religion itself (<a onClick="return mV(\'Psa\',34,11);">Ps 34:11</a>; <a onClick="return mV(\'Pro\',1,7);">Pr 1:7</a>; <a onClick="return mV(\'Isa\',11,2,3);">Isa 11:2-3</a>; <a onClick="return mV(\'Jer\',2,19);">Jer 2:19</a>; <a onClick="return mV(\'Ecc\',12,13);">Ec 12:13</a>, "the whole duty of man," the Revised Version, margin "the duty of all men"). But although the element of dread, or of "fear" in its lower sense, is not always absent and is sometimes prominent in the earlier stages especially, though not exclusively (<a onClick="return mV(\'Exd\',23,27);">Ex 23:27</a>, \'emah; <a onClick="return mV(\'1Sa\',11,7);">1Sa 11:7</a>; <a onClick="return mV(\'2Ch\',20,29);">2Ch 20:29</a>; <a onClick="return mV(\'Psa\',119,120);">Ps 119:120</a>; <a onClick="return mV(\'Isa\',2,10,19,21);">Isa 2:10,19,21</a>), it is more the feeling of reverent regard for their God, tempered with awe and fear of the punishment of disobedience. As such it is a sentiment commanded and to be cherished toward Yahweh (<a onClick="return mV(\'Exd\',20,20);">Ex 20:20</a>; <a onClick="return mV(\'Deu\',6,13);">De 6:13</a>; <a onClick="return mV(\'Jos\',4,24);">Jos 4:24</a>; <a onClick="return mV(\'1Sa\',12,24);">1Sa 12:24</a>; <a onClick="return mV(\'Job\',6,14);">Job 6:14</a>; <a onClick="return mV(\'Psa\',33,8);">Ps 33:8</a>; <a onClick="return mV(\'Psa\',34,9);">34:9</a>; <a onClick="return mV(\'Pro\',23,17);">Pr 23:17</a>; <a onClick="return mV(\'Ecc\',5,7);">Ec 5:7</a>, etc.). It is an essential element in the worship and service of Yahweh (<a onClick="return mV(\'2Ki\',17,\'1-\');">2Ki 17</a> often; <a onClick="return mV(\'Psa\',2,11);">Ps 2:11</a>, etc.); it is a Divine qualification of the Messiah (<a onClick="return mV(\'Isa\',11,2,3);">Isa 11:2,3</a>). This "fear of Yahweh" is manifested in keeping God\'s commandments, walking in His ways, doing His will, avoiding sin, etc. (<a onClick="return mV(\'Exd\',20,20);">Ex 20:20</a>; <a onClick="return mV(\'Deu\',6,13,14);">De 6:13-14</a>; <a onClick="return mV(\'2Sa\',23,3);">2Sa 23:3</a>; <a onClick="return mV(\'Psa\',34,4,9);">Ps 34:4,9</a> parallel <a onClick="return mV(\'Pro\',8,13);">Pr 8:13</a>; <a onClick="return mV(\'Pro\',16,6);">16:6</a>). It is the true wisdom (<a onClick="return mV(\'Job\',28,28);">Job 28:28</a>; <a onClick="return mV(\'Psa\',25,14);">Ps 25:14</a>; <a onClick="return mV(\'Pro\',1,7);">Pr 1:7</a>; <a onClick="return mV(\'Pro\',15,33);">15:33</a>); it gives life (<a onClick="return mV(\'Pro\',10,27);">Pr 10:27</a>, etc.), blessedness (<a onClick="return mV(\'Psa\',128,1,4);">Ps 128:1,4</a>), sufficiency (<a onClick="return mV(\'Psa\',34,9);">Ps 34:9</a>), Divine friendship (<a onClick="return mV(\'Psa\',25,14);">Ps 25:14</a>), protection (<a onClick="return mV(\'Psa\',34,7);">Ps 34:7</a>), deliverance (<a onClick="return mV(\'Psa\',85,9);">Ps 85:9</a>), forgiveness (<a onClick="return mV(\'Psa\',130,4);">Ps 130:4</a>). In <a onClick="return mV(\'Psa\',90,11);">Ps 90:11</a> the King James Version has "According to thy fear so is thy wrath," the Revised Version (British and American) "and thy wrath according to the fear that is due unto thee"; the meaning probably is "thy wrath is in proportion to thy fear."<P>The "fear of the Lord" is a frequent phrase in Apocrypha, and is highly exalted, e.g. Ecclesiasticus 1:11-30; the idea of it became gradually more and more elevated; in <span class="noTag">2:15,16</span> it is joined with the love of God.<P>"Fear" is the natural consequence of sin (<a onClick="return mV(\'Gen\',3,10);">Ge 3:10</a>; <a onClick="return mV(\'Gen\',4,13,14);">4:13-14</a>; <a onClick="return mV(\'Pro\',28,1);">Pr 28:1</a>); it comes as a punishment (<a onClick="return mV(\'Deu\',28,25,28);">De 28:25,28</a>). The fear of man and of evils are dangers to be avoided, from which the fear of God delivers (<a onClick="return mV(\'Num\',14,9);">Nu 14:9</a>; <a onClick="return mV(\'Num\',21,34);">21:34</a>; <a onClick="return mV(\'Psa\',23,4);">Ps 23:4</a>; <a onClick="return mV(\'Psa\',31,14);">31:14</a>, etc.).<P>"Fear" sometimes stands for the object of fear (<a onClick="return mV(\'Pro\',10,24);">Pr 10:24</a>; <a onClick="return mV(\'Isa\',66,4);">Isa 66:4</a>); for the object of worship (<a onClick="return mV(\'Gen\',31,42,53);">Ge 31:42,53</a>, "the God of Abraham, and the Fear of Isaac," pachadh).<P>In the New Testament dread, or fear of God in the lower sense, is removed; He is revealed as the loving and forgiving Father, who gives to men the spirit of sonship (<a onClick="return mV(\'Rom\',8,15);">Ro 8:15</a>; <a onClick="return mV(\'2Ti\',1,7);">2Ti 1:7</a>; <a onClick="return mV(\'1Jo\',4,18);">1Joh 4:18</a>); we are invited even to come "with boldness unto the throne of grace," with confidence, assurance (parrhesia), which, however, may have its literal meaning of free "utterance" (<a onClick="return mV(\'Hbr\',4,16);">Heb 4:16</a>; <a onClick="return mV(\'Hbr\',10,19);">10:19</a>); but there remains a filial fear and sense of awe and of the greatness of the issues involved (<a onClick="return mV(\'Rom\',11,20);">Ro 11:20</a>; <a onClick="return mV(\'Eph\',5,21);">Eph 5:21</a>, the Revised Version (British and American) "of Christ"; <a onClick="return mV(\'1Ti\',5,20);">1Ti 5:20</a>; <a onClick="return mV(\'Hbr\',4,1);">Heb 4:1</a>); all other fears should be dismissed (<a onClick="return mV(\'Mat\',8,26);">Mt 8:26</a>; <a onClick="return mV(\'Mat\',10,\'26-28\',31);">10:26-28,31</a>; <a onClick="return mV(\'Luk\',12,32);">Lu 12:32</a>); in <a onClick="return mV(\'Mat\',10,28);">Mt 10:28</a>; <a onClick="return mV(\'Luk\',12,5);">Lu 12:5</a>, "fear" is used in the sense of "stand in awe of," so perhaps <a onClick="return mV(\'Luk\',23,40);">Lu 23:40</a>; to "fear God" is sometimes used in the New Testament as equivalent to religion (<a onClick="return mV(\'Luk\',18,4);">Lu 18:4</a>; <a onClick="return mV(\'Act\',10,2,35);">Ac 10:2,35</a>; <a onClick="return mV(\'Act\',13,16,26);">13:16,26</a>, used of proselytes); in <a onClick="return mV(\'Hbr\',10,27);">Heb 10:27</a>, it is said that if Christ be willfully rejected, nothing remains but "a fearful looking for (the Revised Version (British and American) "expectation") of judgment," and <a onClick="return mV(\'Hbr\',10,31);">10:31</a>, "It is a fearful thing to fall into the hands of the living God," in which places "fearful" means "terrible," something well to be feared. the Revised Version (British and American) gives frequently a more literal rendering of the words translated "fear."``185';
isbe[3399]='Feasts and Fasts`fests (mo\'edh, "an appointed day" or "an assembling," chagh, from chaghagh, "to dance" or possibly "to make a pilgrimage"; tsom, "fast," ta\'anith, "a day of affliction"):<P><b>I. PRE-EXILIC</b><P class="in15">A) Annual<P class="in30">1. Passover, 15th-22d Nican<P class="in30">2. Pentecost, 6th Ciwan) Pilgrimage<P class="in30">3. Tabernacles, 15th-22d Tishri) Festivals<P class="in30">4. Shemini \'Atsereth, 23d Tishri<P class="in30">5. New Year, Feast of Trumpets, 1st Tishri<P class="in30">6. Atonement, 10th Tishri<P class="in15">B) Periodic<P class="in30">1. Weekly Sabbath<P class="in30">2. New Moon<P class="in30">3. Sabbath Year<P class="in30">4. Jubilee Year<P><b>II. POST-EXILIC</b><P class="in30">1. Feast of Dedication, 25th Kiclew<P class="in30">2. Fast of Esther, 13th \'Adhar<P class="in30">3. Feast of Purim, 14th \'Adhar<P class="in30">4. Fast of the Fourth Month, 17th Tammuz<P class="in30">5. Fast of the Fifth Month, 9th \'Abh<P class="in30">6. Fast of the Seventh Month, 3rd Tishri<P class="in30">7. Fast of the Tenth Month, 10th Tebheth<P class="in30">8. Feast of Acra, 23d Iyar<P class="in30">9. Feast of Nicanor, 18th \'Adhar<P class="in30">10. Feast of Woodcarrying, Midsummer Day, 15th \'Abh<P class="in30">11. New Year for Trees, 15th shebhat<P class="in30">12. Bi-weekly Fasts, Mondays and Thursdays after Festivals<P class="in30">13. Second Days of Festivals Instituted<P class="in30">14. New Modes of Observing Old Festivals Instituted<hr /><P>The Nature of the Hebrew Festivals:<P>The Hebrews had an abundance of holidays, some based, according to their tradition, on agriculture and the natural changes of times and seasons, some on historical events connected with the national or religious life of Israel, and still others simply on immemorial custom. in most instances two or more of these bases coexist, and the emphasis on the natural, the agricultural, the national, or the religious phase will vary with different writers, different context, or different times. Any classification of these feasts and fasts on the basis of original significance must therefore be imperfect.<P>We should rather classify them as preexilic and post-exilic, because the period of the Babylonian captivity marks a complete change, not only in the kinds of festivals instituted from time to time, but also in the manner of celebrating the old.<P>I. Pre-exilic.<P>The pre-exilic list includes the three pilgrimage festivals, the Passover week, Pentecost, and the Feast of Tabernacles, together with the Eighth Day of Assembly at the conclusion of the last of these feasts, and New Year and Atonement Days, the weekly Sabbath and the New Moon.<P>1. Observances Common to All:<P>The preexilic festivals were "holy convocations" (<a onClick="return mV(\'Lev\',23,\'1-\');">Le 23</a>; <a onClick="return mV(\'Num\',28,\'1-\');">Nu 28</a>). Special sacrifices were offered on them in addition to the daily offerings. These sacrifices, however, varied according to the character of the festival (<a onClick="return mV(\'Num\',28,\'1-\');">Nu 28</a>; <a onClick="return mV(\'Num\',29,\'1-\');">29</a>). On all of them trumpets (chatsotseroth) were blown while the burnt offerings and the peace-offerings were being sacrificed (<a onClick="return mV(\'Num\',10,10);">Nu 10:10</a>). They were all likened to the weekly Sabbath as days of rest, on which there must be complete suspension of all ordinary work (<a onClick="return mV(\'Lev\',16,29);">Le 16:29</a>; <a onClick="return mV(\'Lev\',23,7,8,21,24,25,28,35,36);">23:7,8,21,24,25,28,35,36</a>).<P>2. Significance of the Festivals:<P>The three pilgrimage festivals were known by that name because on them the Israelites gathered at Jerusalem to give thanks for their doubly joyful character. They were of agricultural significance as well as commemorative of national events. Thus, the Passover is connected with the barley harvest; at the same time it is the zeman cheruth, recalling the Exodus from Egypt (<a onClick="return mV(\'Exd\',12,6);">Ex 12:6</a>; <a onClick="return mV(\'Lev\',23,5,8);">Le 23:5,8</a>; <a onClick="return mV(\'Num\',28,\'16-25\');">Nu 28:16-25</a>; <a onClick="return mV(\'Deu\',16,\'1-8\');">De 16:1-8</a>).<P>Pentecost has an agricultural phase as chagh habikkurim, the celebration of the wheat harvest; it has a religious phase as zeman mattan Thorah in the Jewish liturgy, based on the rabbinical calculation which makes it the day of the giving of the Law, and this religious side has so completely overshadowed the agricultural that among modern Jews the Pentecost has become "confirmation day" (<a onClick="return mV(\'Exd\',34,26);">Ex 34:26</a>; <a onClick="return mV(\'Lev\',23,\'10-14\');">Le 23:10-14</a>; <a onClick="return mV(\'Num\',28,\'26-31\');">Nu 28:26-31</a>).<P>The Feast of Tabernacles is at once the general harvest festival, chagh he-\'aciph, and the anniversary of the beginnings of the wanderings in the wilderness (<a onClick="return mV(\'Exd\',23,16);">Ex 23:16</a>; <a onClick="return mV(\'Lev\',23,33);">Le 23:33</a>ff; <a onClick="return mV(\'Deu\',16,\'13-15\');">De 16:13-15</a>). The Eighth Day of Assembly immediately following the last day of Tabernacles (<a onClick="return mV(\'Lev\',23,36);">Le 23:36</a>; <a onClick="return mV(\'Num\',29,35);">Nu 29:35</a>ff; <a onClick="return mV(\'Jhn\',7,37);">Joh 7:37</a>) and closing the long cycle of Tishri festivals seems to have been merely a final day of rejoicing before the pilgrims returned to their homes.<P>New Year (<a onClick="return mV(\'Lev\',23,\'23-25\');">Le 23:23-25</a>; <a onClick="return mV(\'Num\',29,\'1-6\');">Nu 29:1-6</a>) and the Day of Atonement (<a onClick="return mV(\'Lev\',16,1);">Le 16:1</a>ff; <a onClick="return mV(\'Lev\',23,\'26-32\');">23:26-32</a>; <a onClick="return mV(\'Num\',29,\'7-11\');">Nu 29:7-11</a>) marked the turning of the year; primarily, perhaps, in the natural phenomena of Palestine, but also in the inner life of the nation and the individual. Hence, the religious significance of these days as days of judgment, penitence and forgiveness soon overshadowed any other significance they may have had. The temple ritual for these days, which is minutely described in the Old Testament and in the Talmud, was the most elaborate and impressive of the year. At the same time Atonement Day was socially an important day of rejoicing.<P>In addition to these annual festivals the pre-exilic Hebrews celebrated the Sabbath (<a onClick="return mV(\'Num\',28,9,10);">Nu 28:9,10</a>; <a onClick="return mV(\'Lev\',23,\'1-3\');">Le 23:1-3</a>) and the New Moon (<a onClick="return mV(\'Num\',10,10);">Nu 10:10</a>; <a onClick="return mV(\'Num\',28,\'11-15\');">28:11-15</a>). By analogy to the weekly Sabbath, every seventh year was a Sabbath Year (<a onClick="return mV(\'Exd\',23,11);">Ex 23:11</a>; <a onClick="return mV(\'Lev\',25,\'1-7\');">Le 25:1-7</a>; <a onClick="return mV(\'Deu\',15,1);">De 15:1</a>), and every cycle of seven Sabbath years was closed with a Jubilee Year (<a onClick="return mV(\'Lev\',25,\'8-18\');">Le 25:8-18</a>) somewhat after the analogy of the seven weeks counted before Pentecost.<P>For further details of all of these preexilic festivals see the separate articles.<P>II. Post-exilic.<P>In post-exilic times important historical events were made the basis for the institution of new fasts and feasts. When the first temple was destroyed and the people were carried into captivity, "the sacrifice of the body and one\'s own fat and blood" were substituted for that of animals (see Talmud, Berakhoth 17a). With such a view of their importance, fasts of all sorts were as a matter of course rapidly multiplied. (Note that the Day of Atonement was the only pre-exilic fast.) Of these post-exilic fasts and feasts, the Feast of Dedication (1Macc 4:52-59; <a onClick="return mV(\'Jhn\',10,22);">Joh 10:22</a>; Mishna, Ta\'anith 2 10; Mo\'edh Qaton 3 9; Josephus, Ant, XII, vii; Apion, II, xxxix) and the Feast of Purim (<a onClick="return mV(\'Est\',3,7);">Es 3:7</a>; <a onClick="return mV(\'Est\',9,24);">9:24</a>ff; 2Macc 15:36); and the fasts of the fourth (<a onClick="return mV(\'Zec\',8,19);">Zec 8:19</a>; <a onClick="return mV(\'Jer\',39,\'1-\');">Jer 39</a>; <a onClick="return mV(\'Jer\',52,\'1-\');">52</a>; Mishna, Ta\'anith 4 6), the fifth (<a onClick="return mV(\'Zec\',7,3,4);">Zec 7:3,4</a>; <a onClick="return mV(\'Zec\',8,19);">8:19</a>; Ta\'anith 4 6), the seventh (<a onClick="return mV(\'Zec\',7,5);">Zec 7:5</a>; <a onClick="return mV(\'Zec\',8,19);">8:19</a>; <a onClick="return mV(\'Jer\',41,1);">Jer 41:1</a>; <a onClick="return mV(\'2Ki\',25,25);">2Ki 25:25</a>; Cedher \'Olam Rabba\' 26; Meghillath Ta\'anith c. 12), the tenth months (<a onClick="return mV(\'Zec\',8,19);">Zec 8:19</a>; <a onClick="return mV(\'2Ki\',25,\'1-\');">2Ki 25</a>), and the Fast of Esther (<a onClick="return mV(\'Est\',4,16);">Es 4:16</a>f; <a onClick="return mV(\'Est\',9,31);">9:31</a>) have been preserved by Jewish tradition to this day. (The Feast of Dedication, the Feast of Purim and the Fast of Esther are described in separate articles.)<P>Significance:<P>The fasts of the fourth, fifth, seventh and tenth months are based on historical incidents connected with one or more national calamities. In several instances the rabbis have by close figuring been able to connect with the dates of the fasts as well as the feasts other important national events than those for which the days were primarily instituted. Not less than four incidents are connected with the fasts of the fourth month (17th of Tammuz):<P>(a) on this day the Israelites made the golden calf;<P>(b) Moses broke the tables of law;<P>(c) the daily sacrifices ceased for want of cattle when the city was closely besieged prior to the destruction of Jerusalem; and<P>(d) on this day Jerusalem was stormed by Nebuchadnezzar.<P>The fast of the fifth month (9th day of \'Abh) receives its significance from the fact that the First Temple was destroyed upon this day by Nebuchadnezzar, and the Second Temple on the same day of the year by Titus. In addition it is said that on this day Yahweh decreed that those who left Egypt should not enter the land of promise; the day is also the anniversary of the capture of the city of Bether by the Emperor Hadrian. The fast of the seventh month (the 3rd day of Tishri) commemorates the murder of Gedaliah at Mizpah. That of the tenth month (10th day of Tebheth) commemorates the beginning of the siege of Jerusalem by Nebuchadnezzar.<P>Other fasts and feasts no doubt were instituted on similar occasions and received a local or temporary observance, for example, the Feast of Acra (1Macc 13:50-52; compare 1:33), to celebrate the recapture of Acra ("the citadel") on the 23rd of \'Iyar 141 BC, and the Feast of Nicanor, in celebration of the victory over Nicanor on the 13th day of \'Adhar 160 BC (1Macc 7:49).<P>Several other festivals are mentioned in the Talmud and other post-Biblical writings which may have been of even greater antiquity. The Feast of Woodcarrying (Midsummer Day: <a onClick="return mV(\'Neh\',10,34);">Ne 10:34</a>; Josephus, BJ, II, vii, 6; Meghillath Ta\'anith c.v, p. 32, Mishna, Ta\'anith 4 8a), for example, is referred to as the greatest day of rejoicing of the Hebrews, ranking with Atonement Day. It was principally a picnic day to which a religious touch was given by making it the woodgatherers\' festival for the Temple. A New Year for trees is mentioned in the Talmud (Ro\'sh ha-Shdnah 1 1). The pious, according both to the Jewish tradition and the New Testament, observed many private or semi-public fasts, such as the Mondays, Thursdays and following Monday after Nisan and Tishri (the festival months: <a onClick="return mV(\'Luk\',18,12);">Lu 18:12</a>; <a onClick="return mV(\'Mat\',9,14);">Mt 9:14</a>; <a onClick="return mV(\'Mat\',6,16);">6:16</a>; <a onClick="return mV(\'Mar\',2,18);">Mr 2:18</a>; <a onClick="return mV(\'Luk\',5,33);">Lu 5:33</a>; <a onClick="return mV(\'Act\',10,30);">Ac 10:30</a>; Meghillah 31a; Ta\'anith 12a; Bdbha\' Qama\' 8 2). The day before Passover was a fast day for the firstborn (Copherim 21 3).<P>In post-Biblical times the Jews outside of Palestine doubled each of the following days: the opening and closing day of Passover and Tabernacles and Pentecost, because of the capheq, or doubt as to the proper day to be observed, growing out of the delays in the transmission of the official decree of the Sanhedhrin in each season. Differences in hours of sunrise and sunset between Palestine and other countries may have had something to do at least with the perpetuation of the custom. New Year\'s Day seems to have been doubled from time immemorial, the forty-eight hours counting as one "long day."<P>Many new modes of observance appear in post-exilic times in connection with the old established festivals, especially in the high festival season of Tishri. Thus the cimchath beth ha-sho\'ebhah, "water drawing festival," was celebrated during the week of Tabernacles with popular games and dances in which even the elders took part, and the streets were so brilliantly illuminated with torches that scarcely an eye was closed in Jerusalem during that week (Talmud, Chullin).<P>The last day of Tabernacles was known in Talmudic times as yom chibbut \'arabhoth, from the custom of beating willow branches, a custom clearly antedating the various symbolical explanations offered for it. Its festivities were connected with the dismantling of the booth. In later times the day was known as hosha\'na\' rabba\', from the liturgical passages beginning with the word hosha\'na\', recited throughout the feast and "gathered" on that day. The day after Tabernacles has been made cimchath Torah, the Feast of the Law, from the custom of ending on that day the cycle of fifty-two weekly portions read in the synagogues.<P>In general it may be said that although the actual observance has changed from time to time to meet new conditions, the synagogal calendar of today is made up of the same festivals as those observed in New Testament times.``80';
