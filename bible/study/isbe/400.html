anite name of Urimelech is now in the Louvre. Numerous Amorites were settled in Ur and other Babylonian cities, chiefly for the purpose of trade. They seem to have enjoyed the same rights and privileges as the native Babylonians. Some of them were commercial travelers, but we hear also of the heads of the great firms making journeys to the Mediterranean coast.<P>In an inscription found near Diarbekir and dedicated to Khammu-rabi by Ibirum (= Eber), the governor of the district, the only title given to the Babylonian monarch is "king of the Amorites," where instead of Amurru the Sumerian Martu (Hebrew moreh) is used. The great-grandson of Khammu-rabi still calls himself "king of the widespread land of the Amorites," but two generations later Babylonia was invaded by the Hittites, the Amorite dynasty came to an end, and there was once more a "king of the Amorites" who was not also king of Babylonia.<P>The Amorite kingdom continued to exist down to the time of the Israelite invasion of Palestine, and mention is made of it in the Egyptian records as well as in the cuneiform Tell el-Amarna Letters, and the Hittite archives recently discovered at Boghaz-keui, the site of the Hittite capital in Cappadocia. The Egyptian conquest of Canaan by the kings of the XVIIIth Dynasty had put an end to the effective government of that country by the Amorite princes, but their rule still extended eastward to the borders of Babylonia, while its southern limits coincided approximately with what was afterward the northern frontier of Naphtali. The Amorite kings, however, became, at all events in name, the vassals of the Egyptian Pharaoh. When the Egyptian empire began to break up, under the "heretic king" Amenhotep IV, at the end of the XVIIIth Dynasty (1400 BC), the Amorite princes naturally turned to their more powerful neighbors in the north. One of the letters in the Tell el-Amarna correspondence is from the Pharaoh to his Amorite vassal Aziru the son of Ebed-Asherah, accusing him of rebellion and threatening him with punishment.<P>Eventually Aziru found it advisable to go over openly to the Hittites, and pay the Hittite government an annual tribute of 300 shekels of gold. From that time forward the Amorite kingdom was a dependency of the Hittite empire, which, on the strength of this, claimed dominion over Palestine as far as the Egyptian frontier. The second successor of Aziru was Abi-Amurru (or Abi-Hadad), whose successor bore, in addition to a Semitic name, the Mitannian name of Bentesinas. Bente-sinas was dethroned by the Hittite King Muttallis and imprisoned in Cappadocia, where he seems to have met the Hittite prince Khattu-sil, who on the death of his brother Muttallis seized the crown and restored Bente-sinas to his kingdom. Bente-sinas married the daughter of Khattu-sil, while his own daughter was wedded to the son of his Hittite suzerain, and an agreement was made that the succession to the Amorite throne should be confined to her descendants. Two or three generations later the Hittite empire was destroyed by an invasion of "northern barbarians," the Phrygians, probably, of Greek history, who marched southward, through Palestine, against Egypt, carrying with them "the king of the Amorites." The invaders, however, were defeated and practically exterminated by Ramses III of the XXth Egyptian Dynasty (1200 BC). The Amorite king, captured on this occasion by the Egyptians, was probably the immediate predecessor of the Sihon of the Old Testament.<P>3. Sihon\'s Conquest:<P>Egyptian influence in Canaan had finally ceased with the invasion of Egypt by the Libyans and peoples of the Aegean in the fifth year of Meneptah, the successor of Ramses II, at the time of the Israelite Exodus. Though the invaders were repulsed, the Egyptian garrisons had to be withdrawn from the cities of Southern Palestine, where their place was taken by the Philistines who thus blocked the way from Egypt to the north. The Amorites, in the name of their distant Hittite suzerains, were accordingly able to overrun the old Egyptian provinces on the east side of the Jordan; the Amorite chieftain Og possessed himself of Bashan (<a onClick="return mV(\'Deu\',3,8);">De 3:8</a>), and Sihon, "king of the Amorites," conquered the northern part of Moab.<P>The conquest must have been recent at the time of the Israelite invasion, as the Amorite song of triumph is quoted in <a onClick="return mV(\'Num\',21,\'27-29\');">Nu 21:27-29</a>, and adapted to the overthrow of Sihon himself by the Israelites. \'Woe unto thee,\' it reads, \'O Moab; thou art undone, O people of Chemosh! (Chemosh) hath given thy sons who escaped (the battle) and thy daughters into captivity to Sihon king of the Amorites.\' The flame that had thus consumed Heshbon, it is further declared, shall spread southward through Moab, while Heshbon itself is rebuilt and made the capital of the conqueror: "Come to Heshbon, that the city of Sihon (like the city of David, <a onClick="return mV(\'2Sa\',5,9);">2Sa 5:9</a>) may be rebuilt and restored. For the fire has spread from Heshbon, the flame from the capital of Sihon, devouring as far as Moab (reading \'adh with the Septuagint instead of \'ar), and swallowing up (reading bale\'ah with the Septuagint) the high places of Arnon." The Israelite invasion, however, prevented the expected conquest of Southern Moab from taking place.<P>4. Disappearance of the Amorite Kingdom:<P>After the fall of Sihon the Amorite kingdom disappears. The Syrians of Zobah, of Hamath and of Damascus take its place, while with the rise of Assyria the "Amorites" cease to be the representatives in contemporary literature of the inhabitants of western Asia. At one time their power had extended to the Babylonian frontier, and Bente-sinas was summoned to Cappadocia by his Hittite overlord to answer a charge made by the Babylonian ambassadors of his having raided Northern Babylonia. The Amorite king urged, however, that the raid was merely an attempt to recover a debt of 30 talents of silver.<P>5. Physical Characteristics of the Amorites:<P>In <a onClick="return mV(\'Num\',13,29);">Nu 13:29</a> the Amorites are described as mountaineers, and in harmony with this, according to Professor Petrie\'s notes, the Egyptian artists represent them with fair complexions, blue eyes and light hair. It would, therefore, seem that they belonged to the Libyan race of Northern Africa rather than to the Semitic stock. In western Asia, however, they were mixed with other racial elements derived from the subject populations, and as they spoke a Semitic language one of the most important of these elements would have been the Semites. In its general sense, moreover, the name "Amorite" included in the Babylonian period all the settled and civilized peoples west of the Euphrates to whatever race they might belong.<P>LITERATURE.<P>Hugo Winckler, Mitteilungen der deutschen Orient-Gesellschaft (1907), No. 35, Berlin; Sayce, The Races of the Old Testament, Religious Tract Soc., 1890.``157';
isbe[481]='Amos (1)`a\'-mos (\'amoc, "burdensome" or "burden-bearer"; Amos):<P><b>I. THE PROPHET</b><P class="in15">1. Name<P class="in15">2. Native Place<P class="in15">3. Personal History<P class="in15">4. His Preparation<P class="in30">(1) Knowledge of God<P class="in30">(2) Acquaintance with History of His People<P class="in60"> Personal Travel<P class="in60"> Scenery of His Home<P class="in30">5. His Mission<P class="in30">6. Date<P><b>II. THE BOOK</b><P class="in15">1. Its Divisions<P class="in15">2. Its Outlook<P class="in15">3. Value of the Book<P class="in30">(1) As a Picture of the Social Condition<P class="in30">(2) As Picture of the Religious Condition<P class="in30">(3) Testimony to History<P class="in30">(4) Testimony to the Law<P class="in60">(a) The Ritual<P class="in60">(b) Ethical Teaching<P class="in30">(5) The Prophetic Order<P class="in30">(6) The Prophetic Religion<P><b>LITERATURE</b><hr /><P>I. The Prophet.<P>1. Name:<P>Amos is the prophet whose book stands third among the "Twelve" in the Hebrew canon. No other person bearing the same name is mentioned in the Old Testament, the name of the father of the prophet Isaiah being written differently (\'amots). There is an Amos mentioned in the genealogical series <a onClick="return mV(\'Luk\',3,25);">Lu 3:25</a>, but he is otherwise unknown, and we do not know how his name would have been written in Hebrew. Of the signification of the prophet\'s name all that can be said is that a verb with the same root letters, in the sense of to load or to carry a load, is not uncommon in the language.<P>2. Native Place:<P>Tekoa, the native place of Amos, was situated at a distance of 5 miles south from Bethlehem, from which it is visible, and 10 miles from Jerusalem, on a hill 2,700 ft. high, overlooking the wilderness of Judah. It was made a "city for defense" by Rehoboam (<a onClick="return mV(\'2Ch\',11,6);">2Ch 11:6</a>), and may have in fact received its name from its remote and exposed position, for the stem of which the word is a derivative is of frequent occurrence in the sense of sounding an alarm with the trumpet: e. g. "Blow the trumpet in Tekoa, and set up a sign of fire in Beth-haccerem" (<a onClick="return mV(\'Jer\',6,1);">Jer 6:1</a> the King James Version). The same word is also used to signify the setting up of a tent by striking in the tent- pegs; and Jerome states that there was no village beyond Tekoa in his time. The name has survived, and the neighborhood is at the present day the pasture-ground for large flocks of sheep and goats. From the high ground on which the modern village stands one looks down on the bare undulating hills of one of the bleakest districts of Palestine, "the waste howling wilderness," which must have suggested some of the startling imagery of the prophet\'s addresses. The place may have had—as is not seldom the case with towns or villages—a reputation for a special quality of its inhabitants; for it was from Tekoa that Joab fetched the "wise woman" who by a feigned story effected the reconciliation of David with his banished son Absalom (<a onClick="return mV(\'2Sa\',14,\'1-\');">2Sa 14</a>). There are traces in the Book of Amos of a shrewdness and mother-wit which are not so conspicuous in other prophetical books.<P>3. Personal History:<P>The particulars of a personal kind which are noted in the book are few but suggestive. Amos was not a prophet or the son of a prophet, he tells us (<a onClick="return mV(\'Amo\',7,14);">Am 7:14</a>), i.e. he did not belong to the professional class which frequented the so-called schools of the prophets. He was "among the herdsmen of Tekoa" (<a onClick="return mV(\'Amo\',1,1);">1:1</a>), the word here used being found only once in another place (<a onClick="return mV(\'2Ki\',3,4);">2Ki 3:4</a>) and applied to Mesha, king of Moab. It seems to refer to a special breed of sheep, somewhat ungainly in appearance but producing, an abundant fleece. In <a onClick="return mV(\'Amo\',7,14);">Am 7:14</a> the word rendered "herdman" is different, and denotes an owner of cattle, though some, from the Septuagint rendering, think that the word should be the same as in <a onClick="return mV(\'Amo\',1,1);">Am 1:1</a>. He was also "a dresser of sycomore-trees" (<a onClick="return mV(\'Amo\',7,14);">Am 7:14</a>). The word rendered "dresser" (Revised Version) or "gatherer" (the King James Version) occurs only here, and from the rendering of the Septuagint (knizon) it is conjectured that there is reference to a squeezing or nipping of the sycamore fig to make it more palatable or to accelerate its ripening, though such a usage is not known in Palestine at the present day.<P>4. His Preparation:<P>Nothing is said as to any special preparation of the prophet for his work: "The Lord took me from following the flock, and the Lord said unto me, Go, prophesy unto my people Israel" (<a onClick="return mV(\'Amo\',7,15);">Am 7:15</a>, the English Revised Version). In these words he puts himself in line with all the prophets who, in various modes of expression, claim a direct revelation from God. But the mention of the prophetic call in association with the mention of his worldly calling is significant. There was no period interposed between the one and the other, no cessation of husbandry to prepare for the work of prophesying. The husbandman was prepared for this task, and when God\'s time came he took it up. What was that preparation? Even if we suppose that the call was a momentary event, the man must have been ready to receive it, equipped for its performance. And, looking at the way in which he accomplished it, as exhibited in his book, we can see that there was a preparation, both internal and external, of a very thorough and effective character.<P>(1) Knowledge of God.<P>First of all, he has no doubt or uncertainty as to the character of the God in whose name he is called to speak. The God of Amos is one whose sway is boundless (<a onClick="return mV(\'Amo\',9,2);">Am 9:2</a> f.), whose power is infinite (<a onClick="return mV(\'Amo\',8,9);">Am 8:9</a> f.), not only controlling the forces of Nature (<a onClick="return mV(\'Amo\',4,\'1\');">Am 4</a>; <a onClick="return mV(\'Amo\',5,8);">5:8</a> f.) but guiding the movements and destinies of nations (<a onClick="return mV(\'Amo\',6,1);">Am 6:1</a> f., <a onClick="return mV(\'Amo\',6,14);">6:14</a>; <a onClick="return mV(\'Amo\',9,7);">9:7</a> f.). Moreover, He is righteous in all His ways, dealing with nations on moral principles (<a onClick="return mV(\'Amo\',1,3);">Am 1:3</a>ff; <a onClick="return mV(\'Amo\',2,1);">2:1</a> f.); and, though particularly favorable to Israel, yet making that very choice of them as a people a ground for visiting them with sterner retribution for their sins (<a onClick="return mV(\'Amo\',3,2);">Am 3:2</a>). In common with all the prophets, Amos gives no explanation of how he came to know God and to form this conception of His character. It was not by searching that they found out God. It is assumed that God is and that He is such a Being; and this knowledge, as it could come only from God, is regarded as undisputed and undisputable. The call to speak in God\'s name may have come suddenly, but the prophet\'s conception of the character of the God who called him is no new or sudden revelation but a firm and well-established conviction.<P>(2) Acquaintance with History of His People.<P>Then his book shows not only that he was well acquainted with the history and traditions of his nation, which he takes for granted as well known to his hearers, but that he had reflected upon these things and realized their significance. We infer that he had breathed an atmosphere of religion, as there is nothing to indicate that, in his acquaintance with the religious facts of his nation, he differed from those among whom he dwelt, although the call to go forth and enforce them came to him in a special way.<P>(3) Personal Travel.<P>It has been conjectured that Amos had acquired by personal travel the accurate acquaintance which he shows in his graphic delineations of contemporary life and conditions; and it may have been the case that, as a wool-merchant or flock-master, he had visited the towns mentioned and frequented the various markets to which the people were attracted.<P>(4) Scenery of His Home.<P>Nor must we overlook another factor in his preparation: the scenery in which he had his home and the occupations of his daily life. The landscape was one to make a solemn impression on a reflective mind: the extensive desert, the shimmering waters of the Dead Sea, the high wall of the distant hills of Moab, over all which were thrown the varying light and shade. The silent life of the desert, as with such scenes ever before him, he tended his flock or defended them from the ravages of wild beasts, would to one whose thoughts were full of God nourish that exalted view of the Divine Majesty which we find in his book, and furnish the imagery in which his thoughts are set (<a onClick="return mV(\'Amo\',1,2);">Am 1:2</a>; <a onClick="return mV(\'Amo\',3,4);">3:4</a> f.; <a onClick="return mV(\'Amo\',4,13);">4:13</a>; <a onClick="return mV(\'Amo\',5,8);">5:8</a>; <a onClick="return mV(\'Amo\',9,5);">9:5</a> f.). As he is taken from following the flock, he comes before us using the language and figures of his daily life (<a onClick="return mV(\'Amo\',3,12);">Am 3:12</a>), but there runs through all the note of one who has seen God\'s working in all Nature and His presence in every phenomenon. Rustic he may be, but there is no rudeness or rusticity in his style, which is one of natural and impassioned eloquence, ordered and regular as coming from a mind which was responsive to the orderly working of God in Nature around him. There is an aroma of the free air of the desert about his words; but the prophet lives in an ampler ether and breathes a purer air; all things in Nature and on the field of history are seen in a Divine light and measured by a Divine standard.<P>5. His Mission:<P>Thus, prepared in the solitudes of the extreme south of Judah, he was called to go and prophesy unto the people of Israel, and appears at Bethel the capital of the Northern Kingdom. It may be that, in the prosecution of his worldly calling, he had seen and been impressed by the conditions of life and religion in those parts. No reason is given for his mission to the northern capital, but the reason is not far to seek. It is the manner of the prophets to appear where they are most needed; and the Northern Kingdom about that time had come victorious out of war, and had reached its culmination of wealth and power, with the attendant results of luxury and excess, while the Southern Kingdom had been enjoying a period of outward tranquillity and domestic content.<P>6. Date:<P>The date of the prophet Amos can approximately be fixed from the statement in the first verse that his activity fell "in the days of Uzziah king of Judah, and in the days of Jeroboam the son of Joash king of Israel, two years before the earthquake." Both these monarchs had long reigns, that of Uzziah extending from 779 to 740 BC and that of Jeroboam II from 783 to 743 BC. If we look at the years when they were concurrently reigning, and bear in mind that, toward the end of Uzziah\'s reign, Jotham acted as co-regent, we may safely place the date of Amos at about the year 760 BC. In a country in which earthquakes are not uncommon the one here mentioned must have been of unusual severity, for the memory of it was long preserved (<a onClick="return mV(\'Zec\',14,5);">Zec 14:5</a>). How long he exercised his ministry we are not told. In all probability the book is the deposit of a series of addresses delivered from time to time till his plain speaking drew upon him the resentment of the authorities, and he was ordered to leave the country (<a onClick="return mV(\'Amo\',7,10);">Am 7:10</a> f.). We can only conjecture that, some time afterward, he withdrew to his native place and put down in writing a condensed record of the discourses he had delivered.<P>II. The Book.<P>We can distinguish with more than ordinary certainty the outlines of the individual addresses, and the arrangement of the book is clear and simple. The text, also, has been on the whole faithfully preserved; and though in a few places critics profess to find the traces of later editorial hands, these conclusions rest mainly on subjective grounds, and will be estimated differently by different minds.<P>1. Its Divisions:<P>The book falls naturally into three parts, recognizable by certain recurring formulas and general literary features.<P>(1) The first section, which is clearly recognizable, embraces <a onClick="return mV(\'Amo\',1,\'1-\');">Am 1</a> and <a onClick="return mV(\'Amo\',2,\'1-\');">2</a>. Here, after the title and designation of the prophet in <a onClick="return mV(\'Amo\',1,1);">Am 1:1</a>, there is a solemn proclamation of Divine authority for the prophet\'s words. "Yahweh will roar from Zion, and utter his voice from Jerusalem" (verse <a onClick="return mV(\'Amo\',1,2);">2</a>). This is notable in one who throughout the book recognizes God\'s power as world-wide and His operation as extensive as creation; and it should be a caution in view, on the one hand, of the assertion that the temple at Jerusalem was not more sacred than any of the numerous "high places" throughout the land, and, on the other hand, the superficial manner in which some writers speak of the Hebrew notion of a Deity whose dwelling-place was restricted to one locality beyond which His influence was not felt. For this God, who has His dwelling-place in Zion, now through the mouth of the prophet denounces in succession the surrounding nations, and this mainly not for offenses committed against the chosen people but for moral offenses against one another and for breaches of a law binding on humanity. It will be observed that the nations denounced are not named in geographical order, and the prophet exhibits remarkable rhetorical skill in the order of selection. The interest and sympathy of the hearers is secured by the fixing of the attention on the enormities of guilt in their neighbors, and curiosity is kept awake by the uncertainty as to where the next stroke of the prophetic whip will fall. Beginning with the more distant and alien peoples of Damascus, Gaza and Tyre, he wheels round to the nearer and kindred peoples of Edom, Ammon and Moab, till he rests for a moment on the brother tribe of Judah, and thus, having relentlessly drawn the net around Israel by the enumeration of seven peoples, he swoops down upon the Northern Kingdom to which his message is to be particularly addressed.<P>(2) The second section embraces <a onClick="return mV(\'Amo\',3,\'1-\');">Am 3 to 6</a>, and consists apparently of a series of discourses, each introduced by the formula: "Hear this word" (<a onClick="return mV(\'Amo\',3,1);">Am 3:1</a>; <a onClick="return mV(\'Amo\',4,1);">4:1</a>; <a onClick="return mV(\'Amo\',5,1);">5:1</a>), and another introduced by a comprehensive: "Woe to them that are at ease in Zion, and to them that are secure in the mountain of Samaria" (<a onClick="return mV(\'Amo\',6,1);">Am 6:1</a>). The divisions here are not so clearly marked. It will be observed e. g. that there is another "Woe" at <a onClick="return mV(\'Amo\',5,18);">Am 5:18</a>; and in chapter <a onClick="return mV(\'Amo\',4,\'1-\');">4</a>, though the address at the outset is directed to the luxurious women of Samaria, from <a onClick="return mV(\'Amo\',4,4);">4:4</a> onward the words have a wider reference. Accordingly some would divide this section into a larger number of subsections; and some, indeed, have described the whole book as a collection of ill-arranged fragments. But, while it is not necessary to suppose that the written book is an exact reproduction of the spoken addresses, and while the division into chapters has no authority, yet we must allow for some latitude in the details which an impassioned speaker would introduce into his discourses, and for transitions and connections of thought which may not be apparent on the surface.<P>(3) The third section has some well-marked characteristics, although it is even less uniform than the preceding. The outstanding feature is the phrase, "Thus the Lord Yahweh showed me" (<a onClick="return mV(\'Amo\',7,1,4,7);">Am 7:1, 4, 7</a>; <a onClick="return mV(\'Amo\',8,1);">8:1</a>) varied at <a onClick="return mV(\'Amo\',9,1);">Am 9:1</a> by the words, "I saw the Lord standing beside the altar." We have thus a series of "visions" bearing upon, and interpreted as applying to, the condition of Israel. It is in the course of one of these, when the prophet comes to the words, "I will rise against the house of Jeroboam with the sword" (<a onClick="return mV(\'Amo\',7,9);">Am 7:9</a>) that the interposition of Amaziah, the priest of Bethel, is recorded, with the prophet\'s noble reply as to his Divine call, and his rebuke and denunciation of the priest, ending with a prophetic announcement of the downfall and captivity of Israel (<a onClick="return mV(\'Amo\',7,\'14-17\');">Am 7:14-17</a>).<P>2. Its Outlook:<P>If the discourses are put down in chronological order of their delivery, it would appear that Amos did not immediately take his departure, since more visions follow this episode, and there is a special appropriateness in the intervention of Amaziah just at the point where it is recorded. As to the closing passage of this section (<a onClick="return mV(\'Amo\',9,\'11-15\');">Am 9:11-15</a>) which gives a bright prospect of the future, there is a class of critics who are inclined to reject it just on this account as inconsistent with the severe denunciatory tone of the rest of the book. It is quite possible, however, that the prophet himself (and no succeeding later editor) may have added the passage when he came to write down his addresses. There is no reason to believe that any of the prophets—harsh though their words were—believed that the God of Israel would make a full end of His people in captivity: on the contrary, their assurance of God\'s faithfulness to His promise, and the deep-seated conviction that right would ultimately prevail, lead us to expect even in the sternest or earliest of the prophets the hope of a future glory—that hope which grew brighter and brighter as the nation\'s outlook grew darker, and attained intensity and clearness in the Messianic hope which sustained them in the darkest days of exile. It is difficult to believe that any of the prophets were prophets of despair, or to conceive how they could have prophesied at all unless they had a firm faith in the ultimate triumph of the good.<P>3. Value of the Book:<P>The Book of Amos is particularly valuable from the fact that he is certainly one of the earliest prophets whose writings have come down to us. It is, like the Book of Hosea which belongs to about the same time, a contemporaneous document of a period of great significance in the history of Israel, and not only gives graphic sketches or illuminating hints of the life and religious condition of the people, but furnishes a trustworthy standard for estimating the value of some other books whose dates are not so precisely determined, a definite starting-point for tracing the course of Israel\'s history.<P>(1) As a Picture of the Social Condition.<P>The book is valuable as embodying a contemporary picture of society and the condition of religion. From the abuses which the prophet denounces and the lifelike sketches he draws of the scenes amid which he moved, taken along with what we know otherwise of the historical movements of the period, we are able to form a fairly adequate estimate of the condition of the age and the country. During the reign of Jeroboam II the kingdom of Israel, after having been greatly reduced during preceding reigns, rose to a degree of extent and influence unexampled since the days of Solomon (<a onClick="return mV(\'2Ki\',14,25);">2Ki 14:25</a>); and we are not astonished to read in the Book of Amos the haughty words which he puts into the mouth of the people of his time when they spoke of Israel as the "chief of the nations" a first-class power in modern language, and boasted of the "horns" by which they had attained that eminence (<a onClick="return mV(\'Amo\',6,1,13);">Am 6:1, 13</a>).<P>But success in war, if it encouraged this boastful spirit, brought also inevitable evils in its train. Victory, as we know from the Assyrian monuments, meant plunder; for king after king recounts how much spoil he had taken, how many prisoners he had carried away; and we must assume that wars among smaller states would be conducted on the same methods. In such wars, success meant an extension of territory and increase of wealth, while defeat entailed the reverse. But it is to be remembered that, in an agricultural country and in a society constituted as that of Israel was, the result of war to one class of the population was to a great extent disastrous, whatever was the issue, and success, when it was achieved, brought evils in its train which even aggravated their condition. The peasant, required to take up arms for offense or defense, was taken away from the labors of the field which, in the best event, were for a time neglected, and, in the worst, were wasted and rendered unproductive. And then, when victory was secured, the spoils were liable to fall into the hands of the nobles and leaders, those "called with a name" (<a onClick="return mV(\'Amo\',6,1);">Am 6:1</a>), while the peasant returned to his wasted or neglected fields without much substantial resource with which to begin life again. The wealth secured by the men of strong hand led to the increase of luxury in its possessors, and became actually the means of still further adding to the embarrassment of the poor, who were dependent on the rich for the means of earning their livelihood. The situation would be aggravated under a feeble or corrupt government, such as was certainly that of Jeroboam\'s successors. The condition prevails in modern eastern countries, even under comparatively wise and just administration; and that it was the state of matters prevailing in the time of Amos is abundantly clear from his book.<P>The opening denunciation of Israel for oppression of the poor and for earth-hunger (<a onClick="return mV(\'Amo\',2,6,7);">Am 2:6-7</a>) is re-echoed and amplified in the succeeding chapters (<a onClick="return mV(\'Amo\',3,9,10);">Am 3:9-10</a>; <a onClick="return mV(\'Amo\',4,1);">4:1</a>; <a onClick="return mV(\'Amo\',5,11,12);">5:11-12</a>; <a onClick="return mV(\'Amo\',8,\'4-6\');">8:4-6</a>); and the luxury of the rich, who battened on the misfortune of their poorer brethren, is castigated in biting irony in such passages as <a onClick="return mV(\'Amo\',6,\'3-6\');">Am 6:3-6</a>. Specially noticeable in this connection is the contemptuous reference to the luxurious women, the "kine of Bashan" (<a onClick="return mV(\'Amo\',4,1);">Am 4:1</a>), whose extravagances are maintained by the oppression of the poor. The situation, in short, was one that has found striking parallels in modern despotic countries in the East, where the people are divided into two classes, the powerful rich, rich because powerful and powerful because rich, and, the poor oppressed, men who have no helper, no "back" in the common eastern phrase, dependent on the rich and influential and tending to greater poverty under greedy patrons.<P>(2) As a Picture of the Religious Condition.<P>In such a social atmosphere, which poisoned the elementary virtues, religion of a vital kind could not flourish; and there are plain indications in the words of Amos of the low condition to which it had sunk. There was, indeed, as we gather from ins addresses, no lack of outward attention to the forms of worship; but these forms were of so corrupted a character and associated with so much practical godlessness and even immorality, that instead of raising the national character it tended to its greater degradation. The people prided themselves in what they regarded the worship of the national God, thinking that so long as they honored Him with costly offerings and a gorgeous ritual, they were pleasing Him and secure in His protection. Bethel, Dan, Gilgal, Beersheba, and we know not how many other places were resorted to in pilgrimage by crowds of worshippers. With all the accompaniments of ceremonious ritual which the newly found wealth put in their power, with offerings more than the legally prescribed or customary (<a onClick="return mV(\'Amo\',4,4,5);">Am 4:4-5</a>) the service of these sanctuaries was maintained; but even these offerings were made at the expense of the poor (<a onClick="return mV(\'Amo\',5,11);">Am 5:11</a>), the prevailing luxury forced its way even to the precincts of the altars (<a onClick="return mV(\'Amo\',2,8);">Am 2:8</a>), and justice and mercy were conspicuously absent from the religious life. The people seemed to have settled down to a complacent optimism, nourished no doubt by national prosperity, and, though there had not been wanting reminders of the sovereignty of a righteous God, in convulsions of Nature—drought, famine, pestilence and earthquake (<a onClick="return mV(\'Amo\',4,\'6-11\');">Am 4:6-11</a>)—these had been of no avail to awaken the sleeping conscience. They put the evil day far from them (<a onClick="return mV(\'Amo\',6,3);">Am 6:3</a>), for Yahweh was their national God and "the day of the Lord," the good time coming (<a onClick="return mV(\'Amo\',5,18);">Am 5:18</a>), when God would come to their help, was more in their mind than the imperative duty of returning to Him (<a onClick="return mV(\'Amo\',4,6,8);">Am 4:6, 8</a>, etc.).<P>(3) Testimony to History.<P>The book is valuable for the confirmation it gives of the historical statements of other books, particularly for the references it contains to the earlier history contained in the Pentateuch. And here we must distinguish between references to, or quotations from, books, and statements or hints or indications of historical events which may or may not have been written in books or accessible to the prophet and his hearers. Opinions differ as to the date of composition of the books which record the earlier history, and the oldest Biblical writers are not in the habit of saying from what sources they drew their information or whether they are quoting from books. We can hardly believe that in the time of Amos copies of existing books or writings would be in the hands of the mass of the people, even if the power to read them was general. In such circumstances, if we find a prophet like Amos in the compass of a small book referring to outstanding events and stages of the past history as matters known to all his hearers and unquestionable, our confidence in the veracity of the books in which these facts are recorded is greatly increased, and it becomes a matter of comparatively less importance at what date these books were composed.<P>Now it is remarkable how many allusions, more or less precise, to antecedent history are found in the compass of this small book; and the significance of them lies not in the actual number of references, but in the kind of reference and the implications involved in the individual references. That is to say, each reference is not to be taken as an isolated testimony to some single event in question, but involves a great deal more than is expressed, and is intelligible only when other facts or incidents are taken into consideration. Thus e. g. the reference to the overthrow of Sodom and Gomorrah (<a onClick="return mV(\'Amo\',4,11);">Am 4:11</a>) is only intelligible on the supposition that the story of that catastrophe was a matter of common knowledge; and it would be a carping criticism to argue that the destruction of other cities of the plain at the same time and the whole story of Lot were unknown in the days of Amos because they are not mentioned here in detail. So, when we have in one passage a reference to the house of Isaac (<a onClick="return mV(\'Amo\',7,16);">Am 7:16</a>), in another to the house of Jacob (<a onClick="return mV(\'Amo\',3,13);">Am 3:13</a>), in another to the house of Joseph (<a onClick="return mV(\'Amo\',5,6);">Am 5:6</a>) and in another to the enmity between Jacob and Esau (<a onClick="return mV(\'Amo\',1,11);">Am 1:11</a>), we cannot take these as detached notices, but must supply the links which the prophet\'s words would suggest to his hearers. In other words, such slight notices, just because they are incidental and brief, imply a familiarity with a connected patriarchal history such as is found in the Book of Genesis. Again, the prophet\'s references to the "whole family" of the "children of Israel" whom the Lord "brought up out of the land of Egypt" (<a onClick="return mV(\'Amo\',3,1);">Am 3:1</a>), to the Divine leading of the people "forty years in the wilderness, to possess the land of the Amorite" (<a onClick="return mV(\'Amo\',2,10);">Am 2:10</a>) are not odds and ends of popular story but links in a chain of national history. It seems to be on the strength of these and similar references in the Books of Amos and Hosea, whose dates are known, that critics have agreed to fix the date of the earliest historical portions of the Pentateuch as they understand them, namely, the parts designated as Jahwist and Elohist, in the 8th and 9th centuries BC, i.e. at or shortly before the time of these prophets. It may be left to the unbiased judgment of the reader to say whether the references look like references to a newly composed document, or whether it is not more probable that, in an age when written documents were necessarily few and not accessible to the multitude, these references are appeals to things well fixed in the national memory, a memory extending back to the things themselves. Or, if the prophet\'s words are to be taken as sufficient proof of the existence of written sources, the fact that the matters are assumed as well known would rather encourage the conclusion that the written sources in question go back to a much earlier period, since the matters contained in them had by this time become matters of universal knowledge.<P>(4) Testimony to the Law.<P>(a) The Ritual.<P>And what about those other elements of the Pentateuch of a legal and ritual character which bulk so prominently in those books? The question whether the Book of Amos indicates an acquaintance with these or not is important because it is to a great extent on the silence of prophetical and historical writers that critics of a certain school relegate these legalistic portions of the Pentateuch to a late date. Now at the outset it is obvious to ask what we have a reasonable right to expect. We have to bear in mind what was the condition of the people whom Amos addressed, and the purpose and aim of his mission to the Northern Kingdom. It is to be remembered that, as we are told in the Book of Kings (<a onClick="return mV(\'1Ki\',12,25);">1Ki 12:25</a> f.), Jeroboam I deliberately sought to make a breach between the worship of Jerusalem and that of his own kingdom, while persuading his people that the worship of Yahweh was being maintained. The schism occurred some 170 years before the time of Amos and it is not probable that the worship and ritual of the Northern Kingdom tended in that interval to greater purity or greater conformity to what had been the authoritative practice of the undivided kingdom at the temple of Jerusalem. When, therefore, Amos, in face of the corrupt worship combined with elaborate ritual which prevailed around him, declares that God hates and despises their feasts and takes no delight in their solemn assemblies (<a onClick="return mV(\'Amo\',5,21);">Am 5:21</a>), we are not justified in pressing his words, as is sometimes done, into a sweeping condemnation of all ritual. On the contrary, seeing that, in the very same connection (<a onClick="return mV(\'Amo\',5,22);">Am 5:22</a>), he specifies burnt offerings and meal offerings and peace offerings, and, in another passage (<a onClick="return mV(\'Amo\',4,4,5);">Am 4:4-5</a>), daily sacrifices and tithes, sacrifices of thanksgiving and free-will offerings, it is natural to infer that by these terms which are familiar in the Pentateuch he is referring to those statutory observances which were part of the national worship of united Israel, but had been overlaid with corruption and become destitute of spiritual value as practiced in the Northern Kingdom. So we may take his allusions to the new moon and the Sabbath (<a onClick="return mV(\'Amo\',8,5);">Am 8:5</a>) as seasons of special sacredness and universally sanctioned. Having condemned in such scornful and sweeping terms the worship that he saw going on around him, what was Amos to gum by entering into minute ritual prescriptions or defining the precise duties and perquisites of priests and Levites; and having condemned the pilgrimages to the shrines of Bethel, Gilgal, Beersheba, Samaria and Dan (<a onClick="return mV(\'Amo\',4,4);">Am 4:4</a>; <a onClick="return mV(\'Amo\',5,5);">5:5</a>; <a onClick="return mV(\'Amo\',8,14);">8:14</a>), what was he to gain by quoting the law of Deut as to a central sanctuary? And had one of his hearers, like the woman of Samaria of a later day, attempted to draw him into a discussion of the relative merits of the two temples, we can conceive him answering in the spirit of the great Teacher: "Ye worship ye know not what: we know what we worship" (<a onClick="return mV(\'Jhn\',4,22);">Joh 4:22</a> the King James Version). A regulation of the form was of no avail while the whole spirit of the observance was corrupt; the soul of religion was dead, and the prophet had a higher duty than to dress out the carcass.<P>At the root of the corruption of the religion lay a rottenness of moral sense; and from beginning to end Amos insists on the necessity of a pure and righteous life. In this connection his appeals are in striking agreement with the specially ethical demands of the law books, and in phraseology so much resemble them as to warrant the conclusion that the requirements of the law on these subjects were known and acknowledged. Thus his denunciations of those who oppress the poor (<a onClick="return mV(\'Amo\',2,7);">Am 2:7</a>; <a onClick="return mV(\'Amo\',4,1);">4:1</a>; <a onClick="return mV(\'Amo\',8,4);">8:4</a>) are quite in the spirit and style of <a onClick="return mV(\'Exd\',22,21,22);">Ex 22:21-22</a>; <a onClick="return mV(\'Exd\',23,9);">23:9</a>; his references to the perversion of justice and taking bribes (<a onClick="return mV(\'Amo\',2,6);">Am 2:6</a>; <a onClick="return mV(\'Amo\',5,7,10);">5:7, 10</a> f., <a onClick="return mV(\'Amo\',6,12);">6:12</a>) are rhetorical enforcements of the prohibitions of the law in <a onClick="return mV(\'Exd\',23,\'6-8\');">Ex 23:6-8</a>; when he reproves those that "lay themselves down beside every altar upon clothes taken in pledge" (<a onClick="return mV(\'Amo\',2,8);">Am 2:8</a>) we hear an echo of the command: "If thou at all take thy neighbor\'s garment to pledge, thou shalt restore it unto him before the sun goeth down" (<a onClick="return mV(\'Exd\',22,26);">Ex 22:26</a>); and when he denounces those making "the ephah small, and the shekel great, and dealing falsely with balances of deceit" (<a onClick="return mV(\'Amo\',8,5);">Am 8:5</a>) his words are in close agreement with the law, "Ye shall do no unrighteousness in judgment, in mete-yard, in weights, or in measure. Just balances, just weight, a just ephah, and a just hin shall ye have" (<a onClick="return mV(\'Lev\',19,35,36);">Le 19:35-36</a>, the King James Version).<P>(b) Ethical Teaching.<P>As a preacher of righteousness, Amos affirms and resists upon those ethical parts of the law which are its vital elements, and which lie at the foundation of all prophecy; and it is remarkable how even in phraseology he agrees with the most ethical book of the Pentateuch, Deuteronomy. He does not, indeed, like his contemporary Hosea, dwell on the love of God as Deuteronomy does; but, of sterner mould, in almost the very words of Deuteronomy, emphasizes the keeping of God\'s commandments, and denounces those who despise the law (compare <a onClick="return mV(\'Amo\',2,4);">Am 2:4</a> with <a onClick="return mV(\'Deu\',17,19);">De 17:19</a>). Among verbal coincidences have been noticed the combinations "oppress" "crush" (<a onClick="return mV(\'Amo\',4,1);">Am 4:1</a>; <a onClick="return mV(\'Deu\',28,33);">De 28:33</a>), "blasting" and "mildew" (<a onClick="return mV(\'Amo\',4,9);">Am 4:9</a>; <a onClick="return mV(\'Deu\',28,22);">De 28:22</a>), and "gall" and "wormwood" (<a onClick="return mV(\'Amo\',6,12);">Am 6:12</a>; <a onClick="return mV(\'Deu\',29,18);">De 29:18</a>).<P>Compare also <a onClick="return mV(\'Amo\',9,8);">Am 9:8</a> with <a onClick="return mV(\'Deu\',6,15);">De 6:15</a>, and note the predilection for the same word to "destroy" common to both books (compare <a onClick="return mV(\'Amo\',2,9);">Am 2:9</a> with <a onClick="return mV(\'Deu\',2,22);">De 2:22</a>). In view of all of which it seems an extraordinary statement to make that "the silence of Amos with reference to the centralization of worship, on which Deuteronomy is so explicit, alone seems sufficient to outweigh any linguistic similarity that can be discovered" (H. G. Mitchell, Amos, an Essay in Exegesis, 185).<P>(5) The Prophetic Order.<P>As Amos is without doubt one of the earliest writing prophets, his book is invaluable as an example of what prophecy was in ancient Israel. And one thing cannot fail to impress the reader at the very outset: namely, that he makes no claim to be the first or among the first of the line, or that he is exercising some new and hitherto unheard-of function. He begins by boldly speaking in God\'s name, assuming that even the people of the Northern Kingdom were familiar with that kind of address. Nay, he goes farther and states in unequivocal terms that "the Lord God will do nothing, but he revealeth his secret unto his servants the prophets" (<a onClick="return mV(\'Amo\',3,7);">Am 3:7</a>, the King James Version).<P>We need not search farther for a definition of the prophet as understood by him and other Old Testament writers: the prophet is one to whom God reveals His will, and who comes forward to declare that will and purpose to man. A great deal has been made of the words of Amaziah the priest of Bethel (<a onClick="return mV(\'Amo\',7,12);">Am 7:12</a>), as if they proved that the prophet in those times was regarded as a wandering rhetorician, earning his bread by reciting his speeches; and it has been inferred from the words of Amos himself that the prophets of his day were so disreputable a class that he disdained to be named along with them (<a onClick="return mV(\'Amo\',7,14);">Am 7:14</a>). But all this is fanciful. Even if we admit that there were men calling themselves prophets who prophesied for hire (<a onClick="return mV(\'Mic\',3,5,11);">Mic 3:5, 11</a>), it cannot be assumed that the expression here to "eat bread" has that meaning; for in other passages it seems simply to signify to lead a quiet or ordinary life, to go about one\'s daily business (see <a onClick="return mV(\'Exd\',24,11);">Ex 24:11</a>; <a onClick="return mV(\'Jer\',22,15);">Jer 22:15</a>). In any case we are not to take the estimate of a man like Amaziah or a godless populace in preference to the conception of Amos himself and his account of his call. It was not by man or by any college of prophets but by Yahweh Himself that he was appointed, and by whatever name he might be called, the summons was "Go, prophesy unto my people Israel" (<a onClick="return mV(\'Amo\',7,15);">Am 7:15</a>). There is no trace here of the "prophets becoming conscious of a distinction between themselves and the professional nebhi\'im, who were apt simply to echo the patriotic and nationalistic sentiments of the people, and in reality differed but little from the soothsayers and diviners of Semitic heathenism" (Ottley, The Religion of Israel, 90). Whoever the "professional nebhi\'im" may have been in his day, or whatever he thought of them if they existed, Amos tells us nothing; but he ranges himself with men to whom Yahweh has spoken in truth (<a onClick="return mV(\'Amo\',3,7,8);">Am 3:7-8</a>), and indicates that there had been a succession of such men (<a onClick="return mV(\'Amo\',2,11);">Am 2:11</a>), faithful amid the prevailing corruption though tempted to be unfaithful (<a onClick="return mV(\'Amo\',2,12);">Am 2:12</a>); in short he gives us to understand that the "prophetic order" goes back to a period long before his day and has its roots in the true and original religion of Israel.<P>(6) The Prophetic Religion.<P>Finally, from the Book of Amos we may learn what the prophetic religion was. Here again there is no indication of rudimentary crudeness of conception, or of painful struggling upward from the plane of naturalism or belief in a merely tribal God. The God in whose name Amos speaks has control over all the forces of Nature (<a onClick="return mV(\'Amo\',4,6);">Am 4:6</a> f.; <a onClick="return mV(\'Amo\',5,8,9);">5:8-9</a>), rules the destinies of nations (<a onClick="return mV(\'Amo\',6,2,14);">Am 6:2, 14</a>; <a onClick="return mV(\'Amo\',9,\'2-6\');">9:2-6</a>), searches the thoughts of the heart (<a onClick="return mV(\'Amo\',4,13);">Am 4:13</a>), is inflexible in righteousness and deals with nations and with men on equal justice (<a onClick="return mV(\'Amo\',1,\'1-\');">Am 1</a>; <a onClick="return mV(\'Amo\',2,\'1-\');">2</a>; <a onClick="return mV(\'Amo\',1,7);">9:7</a>), and is most severe to the people who have received the highest privileges (<a onClick="return mV(\'Amo\',3,2);">Am 3:2</a>). And this is the God by whose name his hearers call themselves, whose claims they cannot deny, whose dealings with them from old time are well known and acknowledged (<a onClick="return mV(\'Amo\',2,11);">Am 2:11</a>), whose laws they have broken (<a onClick="return mV(\'Amo\',2,4);">Am 2:4</a>; <a onClick="return mV(\'Amo\',3,10);">3:10</a>) and for whose just judgment they are warned to prepare (<a onClick="return mV(\'Amo\',4,12);">Am 4:12</a>). All this the prophet enforces faithfully and sternly; not a voice is raised in the circle of his hearers to dispute his words; all that Amaziah the priest can do is to urge the prophet to abstain from unwelcome words in Bethel, because it is the king\'s sanctuary and a royal house; the only inference is that the people felt the truth and justice of the prophet\'s words. The "prophetic religion" does not begin with Amos.<P>LITERATURE.<P>W. R. Harper, "Amos and Hosea," in the ICC; S. R. Driver, "Joe and Amos" in Cambridge Bible for Schools and Colleges; H. G. Mitchell, Amos, an Essay in Exegesis (Boston); A. B. Davidson, two articles in The Expositor, 3rd ser, V, VI (1887); W. R. Smith, The Prophets of Israel; G. A. Smith, "The Book of the Twelve Prophets," in Expositor\'s Bible; J. J. P. Valeton, Amos und Hosea (1894); C. von Orelli, Die zwolf kleinen Propheten, 3. Aufl. (1908) and ET; Nowack, "Die kleinen Propheten," in Hand-commentar zum Altes Testament; Marti, "Das Dodekapropheton erklart," in Kurzer Hand-Commentar zum Altes Testament.``151';
isbe[482]='Amos (2)`a\'-mos (Amos): An ancestor of Jesus in Luke\'s genealogy, the eighth before Joseph, the husband of Mary (<a onClick="return mV(\'Luk\',3,25);">Lu 3:25</a>).``1';
isbe[483]='Amoz`a\'-moz (amots, "strong"): The father of Isaiah the prophet (<a onClick="return mV(\'2Ki\',19,2,20);">2Ki 19:2, 20</a>; <a onClick="return mV(\'2Ki\',20,1);">20:1</a>; <a onClick="return mV(\'2Ch\',26,22);">2Ch 26:22</a>; <a onClick="return mV(\'2Ch\',32,20,32);">32:20, 32</a>; <a onClick="return mV(\'Isa\',1,1);">Isa 1:1</a>; <a onClick="return mV(\'Isa\',2,1);">2:1</a>; <a onClick="return mV(\'Isa\',13,1);">13:1</a>; <a onClick="return mV(\'Isa\',20,2);">20:2</a>; <a onClick="return mV(\'Isa\',37,2,21);">37:2, 21</a>; <a onClick="return mV(\'Isa\',38,1);">38:1</a>).``1';
isbe[484]='Amphipolis`am-fip\'-o-lis (Amphipolis): A town in Macedonia, situated on the eastern bank of the Strymon (modern Struma or Karasu) some three miles from its mouth, near the point where it flows out of Lake Prasias or Cercinitis. It lay on a terraced hill, protected on the north, west and south by the river, on the east by a wall (Thuc. iv.102), while its harbor-town of Eion lay on the coast close to the river\'s mouth. The name is derived either from its being nearly surrounded by the stream or from its being conspicuous on every side, a fact to which Thucydides draws attention (in the place cited). It was at first called Ennea Hodoi, Nine Ways, a name which suggests its importance both strategically and commercially. It guarded the main route from Thrace into Macedonia and later became an important station on the Via Egnatia, the great Roman road from Dyrrhachium on the Adriatic to the Hebrus (Maritza), and it was the center of a fertile district producing wine, oil, figs and timber in abundance and enriched by gold and silver mines and considerable manufactures, especially of woolen stuffs. In 497 BC Aristagoras, ex-despot of Miletus, tried to settle there, and a second vain attempt was made in 465-464 by the Athenians, who succeeded in founding a colony there in 437 under the leadership of Hagnon. The population, however, was too mixed to allow of strong Athenian sympathies, and in 424 the town fell away to the Spartan leader Brasidas and defied all the subsequent attempts of the Athenians to recover it. It passed under the protectorate of Perdiccas and Philip of Macedon, and the latter finally made himself master of it in 358. On the Roman partition of Macedonia after the battle of Pydna (168 BC) Amphipolis was made a free city and capital of Macedonia Prima. Paul and Silas passed through it on their way from Philippi to Thessalonica, but the narrative seems to preclude a long stay (<a onClick="return mV(\'Act\',17,1);">Ac 17:1</a>). The place was called Popolia in the Middle Ages, while in modern times the village of Neochori (Turkish, Yenikeui) marks the site (Leake, Northern Greece, III, 181 f., Cousinery, Macedoine, I, 100 f., 122 f.; Heuzey et Daumet, Mission archeol. de Macedoine, 165 f.).``176';
isbe[485]='Amplias`am\'-pli-as (Textus Receptus Amplias), the King James Version form: a contraction of <a href="./study/isbe/search.html?string=AMPLIATUS">AMPLIATUS</a> (thus, the Revised Version (British and American); which see).``1';
isbe[486]='Ampliatus`am-pli-a\'-tus (Ampliatos, Codex Sinaiticus, A, B, F, Ampliatus; Amplias, D, E, L, P, the Revised Version (British and American) form; the King James Version Amplias): The name of a member of the Christian community at Rome, to whom Paul sent greetings (<a onClick="return mV(\'Rom\',16,8);">Ro 16:8</a>). He is designated "my beloved in the Lord." It is a common name and is found in inscriptions connected with the imperial household. The name is found twice in the cemetery of Domitilla. The earlier inscription is over a cell which belongs to the end of the 1st century or the beginning of the 2nd century. The bearer of this name was probably a member of her household and conspicuous in the early Christian church in Rome.``1';
isbe[487]='Amram`am\'-ram (\'amram, "people exalted"):<P>(1) Father of Aaron, Moses and Miriam (<a onClick="return mV(\'Exd\',6,20);">Ex 6:20</a>; <a onClick="return mV(\'Num\',26,59);">Nu 26:59</a>; <a onClick="return mV(\'1Ch\',6,3);">1Ch 6:3</a>; <a onClick="return mV(\'1Ch\',23,13);">23:13</a>); and a son of Kohath, the son of Levi (<a onClick="return mV(\'Exd\',6,18);">Ex 6:18</a>; <a onClick="return mV(\'Num\',3,19);">Nu 3:19</a>, etc.). It is not certain that he was literally the son of Kohath, but rather his descendant, since there were ten generations from Joseph to Joshua (<a onClick="return mV(\'1Ch\',7,\'20-27\');">1Ch 7:20-27</a>), while only four are actually mentioned from Levi to Moses for the corresponding period. Moreover the Kohathites at the time of the Exodus numbered 8,600 (<a onClick="return mV(\'Num\',3,28);">Nu 3:28</a>), which would therefore have been an impossibility if only two generations had lived. It seems best to regard Amram as a descendant of Kohath, and his wife Jochebed as a "daughter of Levi" in a general sense.<P>(2) One of the Bani, who in the days of Ezra had taken a foreign wife (<a onClick="return mV(\'Ezr\',10,34);">Ezr 10:34</a>).<P>(3) In <a onClick="return mV(\'1Ch\',1,41);">1Ch 1:41</a> (the King James Version) for the properly read <a href="./study/isbe/search.html?string=HAMRAN">HAMRAN</a> of the Revised Version (British and American) (chamran), a Horite, who in <a onClick="return mV(\'Gen\',36,26);">Ge 36:26</a> is called <a href="./study/isbe/search.html?string=HEMDAN">HEMDAN</a> (which see).``109';
isbe[488]='Amramites`am\'-ram-its (\'amrami): The descendants of Amram, one of the Levitical families mentioned in <a onClick="return mV(\'Num\',3,27);">Nu 3:27</a> and <a onClick="return mV(\'1Ch\',26,23);">1Ch 26:23</a>, who had the charge of the tabernacle proper, guarding the ark, table, candlestick, etc., called in <a onClick="return mV(\'1Ch\',26,22);">1Ch 26:22</a> "the treasures of the house of Yahweh."``1';
isbe[489]='Amraphel`am\'-ra-fel, am-ra\'-fel (\'amraphel, or, perhaps better, \'ameraphel).<P>1. The Expedition Against Sodom and Gomorrah:<P>This name, which is identified with that of the renowned Babylonian king <a href="./study/isbe/search.html?string=HAMMURABI">Hammurabi</a> (which see), is only found in <a onClick="return mV(\'Gen\',14,1,9);">Ge 14:1,9</a>, where he is mentioned as the king of Shinar (Babylonia), who fought against the cities of the plain, in alliance with Arioch king of Ellasar, Chedorlaomer king of Elam, and Tidal king of Nations (the Revised Version (British and American) <a href="./study/isbe/search.html?string=GOIIM">GOIIM</a>). The narrative which follows is very circumstantial. From it we learn, that Bera king of Sodom, Birsha king of Gomorrah, Shinab king of Admah, Shemeber king of Zeboiim, and the king of Bela or Zoar, had served Chedorlaomer for 12 years, rebelled in the 13th, and in the 14th year Chedorlaomer, with the kings enumerated, fought with and defeated them in the vale of Siddim, which is described as being the Salt Sea. Previous to this engagement, however, the Elamites and their allies had attacked the Rephaim (Onkelos: "giants") in Ashtaroth-karnaim, the Zuzim (O: "mighty ones," "heroes") in Ham (O: Chamta\'), the Emim (O: "terrible ones") in Shaveh-kiriathaim, and the Horites in their Mount Seir, by the Desert. These having been rendered powerless to aid the revolted vassals, they returned and came to Enmishpat, or Kadesh, attacked the country of the Amalekites, and the Amorites dwelling in Hazazontamar (<a onClick="return mV(\'Gen\',14,\'2-7\');">Ge 14:2-7</a>).<P>2. The Preparation and the Attack:<P>At this juncture the kings of the cities of the plain came out against them, and opposed them with their battle-array in the vale of Siddim. The result of the fight was, that the kings of Sodom and Gomorrah, with their allies, fled, and fell among the bitumen-pits of which the place was full, whilst those who got away took refuge in the mountain. All the goods and food (the camp-equipment and supplies) of the kings of the plain were captured by Chedorlaomer and his allies, who then continued their march (to their own lands) (<a onClick="return mV(\'Gen\',14,\'8-11\');">Ge 14:8-11</a>).<P>3. Abraham\'s Rescue of Lot:<P>Among the captives, however, was Lot, Abram\'s nephew, who dwelt in Sodom. A fugitive, having escaped, went and announced the result of the engagement to Abram, who was at that time living by Mamre\'s oak plantation. The patriarch immediately marched forth with his trained men, and pursued them to Dan, where he divided his forces, attacked the Elamite-Babylonian army by night, and having put them to flight, pursued them again to Hobah, on the left (or north) of Damascus. The result of this sudden onslaught was that he rescued Lot, with the women and people, and recaptured Lot\'s goods, which the allies of Amraphel had carried off (<a onClick="return mV(\'Gen\',14,\'12-16\');">Ge 14:12-16</a>).<P>4. Difficulties of the Identification of Amraphel:<P>There is no doubt that the identification of Amraphel with the Hammurabi of the Babylonian inscriptions is the best that has yet been proposed, and though there are certain difficulties therein, these may turn out to be apparent rather than real, when we know more of Babylonian history. The "l" at the end of Amraphel (which has also "ph" instead of "p" or "b") as well as the fact that the expedition itself has not yet been recognized among the campaigns of Hammurabi, must be acknowledged as two points hard to explain, though they may ultimately be solved by further research.<P>5. Historical Agreements:<P>It is noteworthy, however, that in the first verse of <a onClick="return mV(\'Gen\',14,1);">Ge 14</a> Amraphel is mentioned first, which, if he be really the Babylonian Hammurabi, is easily comprehensible, for his renown to all appearance exceeded that of Chedorlaomer, his suzerain. In <a onClick="return mV(\'Gen\',14,4,5);">14:4 and 5</a>, however, it is Chedorlaomer alone who is referred to, and he heads the list of eastern kings in verse <a onClick="return mV(\'Gen\',14,9);">9</a>, where Tidal comes next (a quite natural order, if Goiim be the Babylonian Gute, i.e. the Medes). Next in order comes Amraphel, king of Babylonia and suzerain of Arioch of Ellasar (Eri-Aku of Larsa), whose name closes the list. It may also be suggested, that Amraphel led a Babylonian force against Sodom, as the ally of Chedorlaomer, before he became king, and was simply crown prince. In that case, like Belshazzar, he was called "king" by anticipation. For further details see <a href="./study/isbe/search.html?string=ARIOCH">ARIOCH</a> and <a href="./study/isbe/search.html?string=CHEDORLAOMER">CHEDORLAOMER</a>, and compare <a href="./study/isbe/search.html?string=ERI-AKU">ERI-AKU</a> and <a href="./study/isbe/search.html?string=HAMMURABI">HAMMURABI</a>; for the history of Babylonia during Hammurabi\'s period, see that article.``136';
isbe[490]='Amulet`am\'-u-let (qemia, lechashim, mezuzah, tephillin, tsitsith; phulakterion): Modern scholars are of opinion that our English word amulet comes from the Latin amuletum, used by Pliny (Naturalis Historia, xxviii, 28; xxx, 2, etc.), and other Latin writers; but no etymology for the Latin word has been discovered. The present writer thinks the root exists in the Arabic himlat, "something carried" (see Dozy, Supplement aux Dictionnaires Arabes, I, 327), though there is no known example of the use of the Arabic word in a magical sense. Originally "amulet" denoted any object supposed to have the power of removing or warding noxious influences believed to be due to evil spirits, etc., such as the evil eye, etc. But in the common usage it stands for an object worn on the body, generally hung from the neck, as a remedy or preservative against evil influences of a mystic kind. The word "amulet" occurs once in the Revised Version (British and American) (<a onClick="return mV(\'Isa\',3,20);">Isa 3:20</a>) but not at all in the King James Version.<P>1. Classes of Amulets:<P>The substances out of which amulets have been made and the forms which they have taken have been various.<P>(1) The commonest have consisted of Amulets of pieces of stone or metal, strips of parchment with or without inscriptions from sacred writings (Bible, Koran, etc.). The earliest Egyptian amulets known are pieces of green schist of various shapes--animal, etc. These were placed on the breast of a deceased person in order to secure a safe passage to the under-world. When a piece of stone is selected as an amulet it is always portable and generally of some striking figure or shape (the human face, etc.). The use of such a stone for this purpose is really a survival of animism.<P>(2) Gems, rings, etc. It has been largely held that all ornaments worn on the person were originally amulets.<P>(3) Certain herbs and animal preparations; the roots of certain plants have been considered very potent as remedies and preservatives.<P>The practice of wearing amulets existed in the ancient world among all peoples, but especially among Orientals; and it can be traced among most modern nations, especially among peoples of backward civilization. Nor is it wholly absent from peoples of the most advanced civilization of today, the English, Americans, etc. Though the word charm (see <a href="./study/isbe/search.html?string=CHARM">CHARM</a>) has a distinct meaning, it is often inseparably connected with amulets, for it is in many cases the incantation or charm inscribed on the amulet that gives the latter its significance. As distinguished from talisman an amulet is believed to have negative results, as a means of protection: a talisman is thought to be the means of securing for the wearer some positive boon.<P>2. Amulets in the Bible:<P>Though there is no word in the Hebrew or Greek Scriptures denoting "amulet," the thing itself is manifestly implied in many parts of the Bible. But it is remarkable that the general teaching of the Bible and especially that of the Old Testament prophets and of the New Testament writers is wholly and strongly opposed to such things.<P>(1) The Old Testament.<P>The golden ear-rings, worn by the wives and sons and daughters of the Israelites, out of which the molten calf was made (<a onClick="return mV(\'Exd\',32,2);">Ex 32:2</a> f.), were undoubtedly amulets. What other function could they be made to serve in the simple life of the desert? That the women\'s ornaments condemned in <a onClick="return mV(\'Isa\',3,\'16-26\');">Isa 3:16-26</a> were of the same character is made exceedingly likely by an examination of some of the terms employed. We read of moonlets and sunlets (verse 18), i.e. moon and sun-shaped amulets.<P>The former in the shape of crescents are worn by Arab girls of our own time. The "ear-drops," "nose-rings," "arm chains" and "foot chains" were all used as a protection to the part of the body implied, and the strong words with which their employment is condemned are only intelligible if their function as counter charms is borne in mind. In <a onClick="return mV(\'Isa\',3,20);">Isa 3:20</a> we read of lechashim rendered "ear-rings" (the King James Version) and "amulets" (Revised Version (British and American)). The Hebrew word seems to be cognate with the word for "serpent" (nechashim; "l" and "r" often interchange), and meant probably in the first instance an amulet against a serpent bite (see Magic, Divination, and Demonology among the Hebrews and Their Neighbours, by the present writer, 50f; 81; compare <a onClick="return mV(\'Jer\',8,7);">Jer 8:7</a>; <a onClick="return mV(\'Ecc\',10,11);">Ec 10:11</a>; <a onClick="return mV(\'Psa\',58,5);">Ps 58:5</a>). Crescent-shaped amulets were worn by animals as well as human beings, as <a onClick="return mV(\'Jdg\',8,21,26);">Jud 8:21, 26</a> shows.<P>At Bethel, Jacob burned not only the idols ("strange gods") but also the ear-rings, the latter being as much opposed to Yahwism as the former, on account of their heathen origin and import.<P>In <a onClick="return mV(\'Pro\',17,8);">Pr 17:8</a> the Hebrew words rendered "a precious stone" (Hebrew "a stone conferring favor") mean without question a stone amulet treasured on account of its supposed magical efficacy. It is said in <a onClick="return mV(\'Pro\',1,9);">Pr 1:9</a> that wisdom will be such a defense to the one who has it as the head amulet is to the head and that of the neck to the neck. The words rendered in the Revised Version (British and American) "a chaplet of grace unto thy head" mean literally, "something bound to the head conferring favor," the one word for the latter clause being identical with that so rendered above (chen). The Talmudic word for an amulet (qemia\') denotes something tied or bound (to the person).<P>We have reference to the custom of wearing amulets in <a onClick="return mV(\'Pro\',6,21);">Pr 6:21</a> where the reader is urged to "bind them (i.e. the admonitions of father and mother)...upon thy heart" and to "tie them about thy neck"—words implying a condemnation of the practice of trusting to the defense of mere material objects.<P>Underneath the garments of warriors slain in the Maccabean wars amulets were found in the shape apparently of idols worshipped by their neighbors (2Macc 12:40). It is strange but true that like other nations of antiquity the Jews attached more importance to amulets obtained from other nations than to those of native growth. It is probable that the signet ring referred to in <a onClick="return mV(\'Sgs\',8,6);">So 8:6</a>; <a onClick="return mV(\'Jer\',22,24);">Jer 22:24</a>; <a onClick="return mV(\'Hag\',2,23);">Hag 2:23</a> was an amulet. It was worn on the heart or on the arm.<P>(2) The Phylacteries and the Mezuzah.<P>There is no distract reference to these in the Old Testament. The Hebrew technical term for the former (tephillin) does not occur in Biblical. Hebrew, and although the Hebrew word mezuzah does occur over a dozen times its sense is invariably "door-(or "gate-") post" and not the amulet put on the door-post which in later Hebrew the word denotes.<P>It is quite certain that the practice of wearing phylacteries has no Biblical support, for a correct exegesis and a proper understanding of the context put it beyond dispute that the words in <a onClick="return mV(\'Exd\',13,9,16);">Ex 13:9, 16</a>; <a onClick="return mV(\'Deu\',6,8);">De 6:8</a> f.; <a onClick="return mV(\'Deu\',11,18,19,20);">11:18-20</a> have reference to the exhortations in the foregoing verses: "Thou shalt bind them (the commands previously mentioned) for a sign upon thy hand, and they shall be for frontiers between thy eyes. And thou shalt write them upon, the door-posts of thy house, and upon thy gates" (<a onClick="return mV(\'Deu\',6,8);">De 6:8</a> f.). The only possible sense of these words is that they were to hold the precepts referred to before their minds constantly as if they were inscribed on their arms, held in front of their eyes, and written on the door-posts or gate- posts which they daily passed. That the language in <a onClick="return mV(\'Exd\',13,9,16);">Ex 13:9, 16</a> does not command the use of phylacteries is obvious, and that the same is true of <a onClick="return mV(\'Pro\',3,3);">Pr 3:3</a>; <a onClick="return mV(\'Pro\',6,21);">6:21</a>; <a onClick="return mV(\'Pro\',7,3);">7:3</a> where similar words are used is still more certain. Yet, though none of the passages enjoin the use of phylacteries or of the mezuzah, they may all contain allusions to both practices as if the sense were, "Thou shalt keep constantly before thee my words and look to them for safety and not to the phylacteries worn on head and arm by the heathen." If, however, phylacteries were in use among the Jews thus early, it is strange that there is not in the Old Testament a single instance in which the practice of wearing phylacteries is mentioned. Josephus, however, seems to refer to this practice (Ant., IV, viii, 13), and it is frequently spoken of in the Mishna (Berakhoth, i, etc.). It is a striking and significant fact that the Apocrypha is wholly silent as to the three signs of Judaism, phylacteries, the mezuzah and the tsitsith (or tassel attached to the corner of the prayer garment called Tallith; compare <a onClick="return mV(\'Mat\',9,20);">Mt 9:20</a>; <a onClick="return mV(\'Mat\',14,36);">14:36</a> the King James Version where "hem of the garment" is inaccurate and misleading).<P>It is quite evident that phylacteries have a magical origin. This is suggested by the Greek name phulakterion (whence the English name) which in the 1st century of our era denoted a counter charm or defense (phulasso, "to protect") against evil influences. No scholar now explains the Greek word as denoting a means of leading people to keep (phulasso) the law. The Hebrew name tephillin (= "prayers") meets us first in post-Bib. Hebrew, and carries with it the later view that phylacteries are used during prayer in harmony with the prayers or other formulas over the amulet to make it effective (see Budge, Egyptian Magic, 27).<P>See more fully under <a href="./study/isbe/search.html?string=CHARM">CHARM</a>.<P>LITERATURE.<P>In addition to the literature given in the course of the foregoing article, the following may be mentioned. On the general subject see the great works of Tyler (Early History of Mankind, Primitive Culture) and Frazer, Golden Bough; also the series of articles under "Charms and Amulets" in Hastings\' Encyclopedia of Religion and Ethics and the excellent article "Amulet" in the corresponding German work, Die Religion in Geschichte und Gegenwart. See further the article "Amulet" in Jewish Encyclopedia, and on Egyptian amulets, Budge, Egyptian Magic, 25 f.``33';
isbe[491]='Amzi`am\'-zi (\'amtsi, "my strength"):<P>(1) A Levite of the family of Merari (<a onClick="return mV(\'1Ch\',6,46);">1Ch 6:46</a>).<P>(2) A priest of the family of Adaiah in the second temple. His father\'s name was Zechariah (<a onClick="return mV(\'Neh\',11,12);">Ne 11:12</a>).``1';
isbe[492]='Anab`a\'-nab (\'anabh, "grapes"; Codex Vaticanus, Anon or Anob): Mentioned in the list of cities which fell to Judah (<a onClick="return mV(\'Jos\',15,50);">Jos 15:50</a>). In the list it follows Debir, from which it was a short distance to the southwest. It lay about twelve males to the southwest of Hebron. It was a city of the Anakim, from whom Joshua took it (<a onClick="return mV(\'Jos\',11,21);">Jos 11:21</a>). Its site is now known as the rum \'Anab.``1';
isbe[493]='Anael`an\'-a-el (Anael): A brother of Tobit mentioned once only (Tobit 1:21) as the father of Achiacharus, who was an official in Nineveh under Esar-haddon.``1';
isbe[494]='Anah`a\'-na (\'anah, meaning uncertain; a Horite clan-name (<a onClick="return mV(\'Gen\',36,\'1-\');">Ge 36</a>)):<P>(1) Mother of Aholibamah, one of the wives of Esau and daughter of Zibeon (compare <a onClick="return mV(\'Gen\',36,2,14,18,25);">Ge 36:2, 14, 18, 25</a>). The Septuagint, the Samaritan Pentateuch, and the Peshitta read "son," identifying this Anah with <span class="noTag">number</span> 3 (see below); <a onClick="return mV(\'Gen\',36,2);">Ge 36:2</a>, read (ha-chori), for (ha-chiwwi).<P>(2) Son of Seir, the Horite, and brother of Zibeon; one of the chiefs of the land of Edom (compare <a onClick="return mV(\'Gen\',36,20,21);">Ge 36:20-21</a> = <a onClick="return mV(\'1Ch\',1,38);">1Ch 1:38</a>). Seir is elsewhere the name of the land (compare <a onClick="return mV(\'Gen\',14,6);">Ge 14:6</a>; <a onClick="return mV(\'Isa\',21,11);">Isa 21:11</a>); but here the country is personified and becomes the mythical ancestor of the tribes inhabiting it.<P>(3) Son of Zibeon, "This is Anah who found the hot springs in the wilderness" (compare <a onClick="return mV(\'Gen\',36,24);">Ge 36:24</a> = <a onClick="return mV(\'1Ch\',1,40,41);">1Ch 1:40-41</a>)<P>The word ha-yemim, occurs only in this passage and is probably corrupt. Ball (Sacred Books of the Old Testament, Genesis, critical note 93) suggests that it is a corruption of we-hemam (compare <a onClick="return mV(\'Gen\',36,22);">Ge 36:22</a>) in an earlier verse. Jerome, in his commentary on <a onClick="return mV(\'Gen\',36,24);">Ge 36:24</a>, assembles the following definitions of the word gathered from Jewish sources.<P class="in15">(1) "seas" as though yammim;<P class="in15">(2) "hot springs" as though hammim;<P class="in15">(3) a species of ass, yemim;<P class="in15">(4) "mules."<P>This last explanation was the one most frequently met with in Jewish lit; the tradition ran that Anah was the first to breed the mule, thus bringing into existence an unnatural species. As a punishment, God created the deadly water-snake, through the union of the common viper with the Libyan lizard (compare Ge Rabbah 82 15, Yer. Ber 1 12b; Babylonian Pes 54a, Ginzberg, Monatschrift, XLII, 538-39).<P>The descent of Anah is thus represented in the three ways pointed out above as the text stands. If, however, we accept the reading ben, for bath, in the first case, Aholibamah will then be an unnamed daughter of the Anah of <a onClick="return mV(\'Gen\',36,24);">Ge 36:24</a>, not the Aholibamah, daughter of Anah of <a onClick="return mV(\'Gen\',36,25);">36:25</a> (for the Anah of this verse is evidently the one of <a onClick="return mV(\'Gen\',36,20);">36:20</a>, not the Anah of <a onClick="return mV(\'Gen\',36,24);">36:24</a>). Another view is that the words, "the daughter of Zibeon," are a gloss, inserted by one who mistakenly identified the Anah of <a onClick="return mV(\'Gen\',36,25);">36:25</a> with the Anah of <a onClick="return mV(\'Gen\',36,24);">36:24</a>; in this event, Aholibamah, the daughter of Anah, will be the one mentioned in <a onClick="return mV(\'Gen\',36,25);">36:25</a>. The difference between (2) and (3) is to be explained on the basis of a twofold tradition. Anah was originally a sub-clan of the clan known as Zibeon, and both were "sons of Seir"—i.e. Horites.``197';
isbe[495]='Anaharath`a-na\'-ha-rath (\'ana-charath, meaning unknown): A place which fell to the tribe of Issachar in the division of the land (<a onClick="return mV(\'Jos\',19,19);">Jos 19:19</a>). Located in the valley of Jezreel toward the east, the name and site being preserved as the modern en-Na\'-ura. BDB is wrong in assigning it to the tribe of Naphtali.``1';
isbe[496]='Anaiah`an-a-i\'-a, a-ni\'-a (\'anayah, "Yah has answered"):<P>(1) a Levite who assisted Ezra in reading the law to the people (<a onClick="return mV(\'Neh\',8,4);">Ne 8:4</a>), perhaps the person called Ananias in Esdras 9:43.<P>(2) One of those who sealed the covenant (<a onClick="return mV(\'Neh\',10,22);">Ne 10:22</a>). He may have been the same as Anaiah (1).``1';
isbe[497]='Anak`an\'-nak`<a href="./study/isbe/search.html?string=ANAKIM">ANAKIM</a>`1';
isbe[498]='Anakim`an\'-a-kim (\'anaqim; Enakim, or Enakeim; also called "sons of Anak" (<a onClick="return mV(\'Num\',13,33);">Nu 13:33</a>), and "sons of the Anakim" (<a onClick="return mV(\'Deu\',1,28);">De 1:28</a>)): The spies (<a onClick="return mV(\'Num\',13,33);">Nu 13:33</a>) compared them to the Nephilim or "giants" of <a onClick="return mV(\'Gen\',6,4);">Ge 6:4</a>, and according to <a onClick="return mV(\'Deu\',2,11);">De 2:11</a> they were reckoned among the <a href="./study/isbe/search.html?string=REPHAIM">REPHAIM</a> (which see). In <a onClick="return mV(\'Num\',13,22);">Nu 13:22</a> the chiefs of Hebron are said to be descendants of Anak, while "the father of Anak" is stated in Joshua (<a onClick="return mV(\'Jos\',15,13);">15:13</a>; <a onClick="return mV(\'Num\',21,11);">21:11</a>) to be Arba after whom Hebron was called "the city of Arba." Joshua "cut off the Anakim...from Hebron, from Debir, from Anab,...and from all the hill-country of Israel," remnants of them being left in the Philistine cities of Gaza, Gath and Ashdod (<a onClick="return mV(\'Jos\',11,21,22);">Jos 11:21-22</a>). As compared with the Israelites, they were tall like giants (<a onClick="return mV(\'Num\',13,33);">Nu 13:33</a>), and it would therefore seem that the "giant" Goliath and his family were of their race.<P>At Hebron, at the time of the Israelite conquest, we may gather that they formed the body-guard of the Amorite king (see <a onClick="return mV(\'Jos\',10,5);">Jos 10:5</a>) under their three leaders Sheshai, Ahiman and Talmai (<a onClick="return mV(\'Num\',13,22);">Nu 13:22</a>; <a onClick="return mV(\'Jos\',15,14);">Jos 15:14</a>; <a onClick="return mV(\'Jdg\',1,20);">Jud 1:20</a>). Tell el-Amarna Letters show that the Canaanite princes were accustomed to surround themselves with bodyguards of foreign mercenaries. It appears probable that the Anakim came from the Aegean like the Philistines, to whom they may have been related. The name Anak is a masculine corresponding with a feminine which we meet with in the name of the goddess Onka, who according to the Greek writers, Stephanus of Byzantium and Hesychius, was the "Phoen," i.e. Syrian equivalent of Athena. Anket or Anukit was also the name of the goddess worshipped by the Egyptians at the First Cataract. In the name Ahi-man it is possible that "-man" denotes a non-Semitic deity.``157';
isbe[499]='Anamim`an\'-a-mim (\'anamim): Descendants of Mizraim (<a onClick="return mV(\'Gen\',10,13);">Ge 10:13</a>; <a onClick="return mV(\'1Ch\',1,11);">1Ch 1:11</a>).`<a href="./study/isbe/search.html?string=TABLE+OF+NATIONS">TABLE OF NATIONS</a>`1';
isbe[500]='Anammelech`a-nam\'-e-lek (\'anammelekh = Assyrian Anu-malik, "Anu is the prince"): A Babylonian (?) deity worshipped by the Sepharvites in Samaria, after being transported there by Sargon. The worship of Adrammelech (who is mentioned with Anammelech) and Anammelech is accompanied by the sacrifice of children by fire: "The Sepharvites burnt their children in the fire to Adrammelech and Anammelech, the gods of Sepharvaim" (<a onClick="return mV(\'2Ki\',17,31);">2Ki 17:31</a>). This passage presents two grave difficulties. First, there is no evidence in cuneiform literature that would point to the presence of human sacrifice, by fire or otherwise, as part of the ritual; nor has it been shown that the sculptures or bas-reliefs deny this thesis.<P>Much depends upon the identification of "Sepharvaim"; if, as some scholars hold, Sepharvaim and Sippar are one and the same cities, the two deities referred to are Babylonian. But there are several strong objections to this theory. It has been suggested that Sepharvaim (Septuagint, seppharin, sepphareimi) is rather identical with "Shabara\'in," a city mentioned in the Babylonian Chronicle as having been destroyed by Shalmaneser IV. As Sepharvaim and Arpad and Hamath are grouped together (<a onClick="return mV(\'2Ki\',17,24);">2Ki 17:24</a>; <a onClick="return mV(\'2Ki\',18,34);">18:34</a>) in two passages, it is probable that Sepharvaim is a Syriac city. Sepharvaim may then be another form of "Shabara\'in," which, in turn, is the Assyrian form of Sibraim (<a onClick="return mV(\'Eze\',47,16);">Eze 47:16</a>), a city in the neighborhood of Damascus (of Halevy, ZA, II, 401ff). One objection to this last is the necessity for representing "c" by "sh"; this is not necessarily insurmountable, however. Then, the attempt to find an Assyrian etymology for the two god-names falls to the ground. Besides, the custom of sacrifice by fire was prevalent in Syria. Secondly, the god that was worshipped at Sippar was neither Adrammelech nor Anammelech but Samas. It is improbable, as some would urge, that Adrammelech is a secondary title of the tutelary god of Sippar; then it would have to be shown that Anu enjoyed special reverence in this city which was especially consecrated to the worship of the Sun-god. (For "Anu" see <a href="./study/isbe/search.html?string=ASSYRIA">ASSYRIA</a>.) It may be that the text is corrupt.`<a href="./study/isbe/search.html?string=ADRAMMELECH">ADRAMMELECH</a>`197';
