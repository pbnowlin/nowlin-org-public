isbe = [];

isbe[401]='Allon`al\'-on (\'allon, "oak"):<P>(1) A town in the tribe of Naphtali in Northern Palestine (<a onClick="return mV(\'Jos\',19,33);">Jos 19:33</a>), according to the King James Version, which follows some Hebrew texts. It is better however to read with the Revised Version (British and American), "oak" (\'elon), rather than as proper noun.<P>(2) A prominent descendant of the tribe of Simeon (<a onClick="return mV(\'1Ch\',4,37);">1Ch 4:37</a>).<P>(3) the Revised Version (British and American) for Allom of the King James Version in 1Esdras 5:34 (which see).``1';
isbe[402]='Allon-Bacuth`al\'-on-ba\'-kuth (\'allon bakhuth; the King James Version transliterates Allon-bachuth, al-on-bak\'uth, "oak of weeping"): The burial place of Deborah, the nurse of Rebekah (<a onClick="return mV(\'Gen\',35,8);">Ge 35:8</a>); it appears from the narrative that she made her home with Jacob, who had returned from Paddan-aram, and was sojourning at the time at Bethel, in the vicinity of which was the "oak of weeping," under which she was buried.``1';
isbe[403]='Allow; Allowance`a-lou\', a-lou\'-ans: The verb "to allow" is used in the King James Version to translate four different Greek words:<P>(1) suneudokeo, "to approve together" (with others) (the Revised Version (British and American) "consent unto"), <a onClick="return mV(\'Luk\',11,48);">Lu 11:48</a>.<P>(2) prosdechomai, "to receive to oneself," "admit" (the Revised Version (British and American) "look for," margin "accept"); <a onClick="return mV(\'Act\',24,15);">Ac 24:15</a>.<P>(3) ginosko, "to know," "recognize": "That which I do, I allow not" (the Revised Version (British and American) "I know not"), i.e. "I do not understand what I am doing, my conduct is inexplicable to me" (Grimm-Thayer); <a onClick="return mV(\'Rom\',7,15);">Ro 7:15</a>.<P>(4) dokimazo, "to prove," "approve." "Happy is he that condemneth not himself in the thing which he alloweth" (the Revised Version (British and American) "approveth," i.e. in practice), i.e. who is not troubled with scruples; <a onClick="return mV(\'Rom\',14,22);">Ro 14:22</a>. Thus the Revised Version (British and American) has removed the verb "allow" in each case in which it occurs in the King James Version, it being somewhat ambiguous in meaning (its original sense, as derived from Latin allocare, "to place," "assign," "grant," being influenced by another word, Latin allaudare, "to praise"). The noun "allowance" occurs in the sense of quantity of food allowed, in <a onClick="return mV(\'2Ki\',25,30);">2Ki 25:30</a> (King James Version, the Revised Version (British and American)) and the parallel passage <a onClick="return mV(\'Jer\',52,34);">Jer 52:34</a> (RV; "diet" in the King James Version).``49';
isbe[404]='Alloy`a-loi\' (bedhil): In <a onClick="return mV(\'Isa\',1,25);">Isa 1:25</a> the Revised Version, margin; translated "tin" in the text. Elsewhere in both versions bedhil is translated <a href="./study/isbe/search.html?string=TIN">TIN</a> (which see).``1';
isbe[405]='Allure`a-lur\' (pathah, "to persuade," "woo," "entice"; deleazo, "to entrap," "lay a bait"):<P>(1) "I will allure her, and bring her into the wilderness" (<a onClick="return mV(\'Hsa\',2,14);">Ho 2:14</a>), with evident reference to the Assyrian invasion and the devastation of the land, followed up by the Exile. Thus would Yahweh entice Israel to repent by gentle punishment; then would follow her restoration and the outpouring of His love (<a onClick="return mV(\'Hsa\',2,14);">Ho 2:14</a> f.).<P>(2) "They allure through the lusts of the flesh" (<a onClick="return mV(\'2Pe\',2,18);">2Pe 2:18</a>, the Revised Version (British and American) "entice"). Wicked men allure to destruction; God (as above) allures to punishment, repentance and restoration.``91';
isbe[406]='Almighty`ol-mit’-i:<P>(1) (shaddai [<a onClick="return mV(\'Gen\',17,\'1-\');">Ge 17:1</a>]): Found in the Old Testament forty-eight times, most of these in the Book of Job; it occurs either alone or in combination with ‘el, "God"). The root meaning is uncertain.<P>(2) (pantokrator), the exclusive translation of this Greek word in the New Testament, found principally in Revelation (nine times), once besides (<a onClick="return mV(\'2Cr\',6,18);">2Co 6:18</a>). Its occurrence in the Apocrypha is frequent.`<a href="./study/isbe/search.html?string=GOD+NAMES+OF">GOD, NAMES OF</a>`1';
isbe[407]='Almodad`al-mo\'-dad (\'almodhadh, "the beloved," or, "God is beloved"): The first mentioned of the thirteen sons of Joktan (<a onClick="return mV(\'Gen\',10,\'25-29\');">Ge 10:25-29</a>; <a onClick="return mV(\'1Ch\',1,\'19-23\');">1Ch 1:19-23</a>). A south Arabian name, and pointing to a south Arabian tribe.`<a href="./study/isbe/search.html?string=ABIMAEL">ABIMAEL</a>`1';
isbe[408]='Almon`al\'-mon (\'almon, "hidden"): A Levitical city in the tribe of Benjamin (<a onClick="return mV(\'Jos\',21,18);">Jos 21:18</a>), the same as "Allemeth" the Revised Version (British and American), "Alemeth" the King James Version, of <a onClick="return mV(\'1Ch\',6,60);">1Ch 6:60</a> (which see).``1';
isbe[409]='Almon-Diblathaim`al\'-mon-dib-la-tha\'-im (\'almon dibhlathayim, "Almon of the double cake of figs"): A station in the wilderness journeyings of the Israelites, located in Moab between Diban-gad and the mountains of Abarim (<a onClick="return mV(\'Num\',33,46,47);">Nu 33:46-47</a>). It was near the end of the forty years\' wanderings. The name was probably given because the location was like two lumps of pressed figs. In both occurrences the word has the accusative ending of direction, and should properly be read: "Almon toward Diblathaim." It was probably the same place as Beth-diblathaim of <a onClick="return mV(\'Jer\',48,22);">Jer 48:22</a>, mentioned in the prophet\'s oracle against Moab.``1';
isbe[410]='Almond`a\'-mund: (1) shaqedh, <a onClick="return mV(\'Gen\',43,11);">Ge 43:11</a>; <a onClick="return mV(\'Num\',17,8);">Nu 17:8</a>, etc. The word shaked comes from a Hebrew root meaning to "watch" or "wait." In <a onClick="return mV(\'Jer\',1,11,12);">Jer 1:11-12</a> there is a play on the word, "And I said, I see a rod of an almond-tree (shaqedh). Then said Yahweh unto me, Thou hast well seen: for I will watch (shoqedh) over my word to perform it." (2) luz; the King James Version hazel, <a onClick="return mV(\'Gen\',30,37);">Ge 30:37</a>; lauz is the modern Arabic name for "almond"—Luz was the old name of <a href="./study/isbe/search.html?string=BETHEL">BETHEL</a> (which see).<P>1. Almond Tree:<P>The almond tree is mentioned in <a onClick="return mV(\'Ecc\',12,5);">Ec 12:5</a>, where in the description of old age it says "the almond-tree shall blossom." The reference is probably to the white hair of age. An almond tree in full bloom upon a distant hillside has a certain likeness to a head of white hair.<P>2. A Rod of Almond:<P>A rod of almond is referred to <a onClick="return mV(\'Gen\',30,37);">Ge 30:37</a>, where "Jacob took him rods of fresh poplar, and of the almond (luz) and of the plane-tree; and peeled white streaks in them" as a means of securing "ring-streaked, speckled, and spotted" lambs and goats—a proceeding founded doubtless upon some ancient folklore. Aaron\'s rod that budded (<a onClick="return mV(\'Num\',17,2,3);">Nu 17:2-3</a>) was an almond rod. Also see <a onClick="return mV(\'Jer\',1,11);">Jer 1:11</a> referred to above.<P>3. The Blossoms:<P>The blossoms of the almond are mentioned <a onClick="return mV(\'Exd\',25,33);">Ex 25:33</a> f.; <a onClick="return mV(\'Exd\',37,19);">37:19</a>f; etc. "Cups made like almond-blossoms in one branch, a knop (i.e. knob) and a flower," is the description given of parts of the sacred candlesticks. It is doubtful exactly what was intended—the most probable is, as Dillmann has suggested, that the cup was modeled after the calyx of the almond flower. See <a href="./study/isbe/search.html?string=CANDLESTICK">CANDLESTICK</a>.<P>4. The Fruit:<P>Israel directed his sons (<a onClick="return mV(\'Gen\',43,11);">Ge 43:11</a>) to carry almonds as part of their present to Joseph in Egypt. Palestine is a land where the almond flourishes, whereas in Egypt it would appear to have been uncommon. Almonds are today esteemed a delicacy; they are eaten salted or beaten into a pulp with sugar like the familiar German Marzipan.<P>The almond is Amygdalus communis (N.O. Rosaceae), a tree very similar to the peach. The common variety grows to the height of 25 feet and produces an abundant blossom which appears before the leaves; In Palestine this is fully out at the end of January or beginning of February; it is the harbinger of spring. This early blossoming is supposed to be the origin of the name shaqedh which contains the idea of "early." The masses of almond trees in full bloom in some parts of Palestine make a very beautiful and striking sight. The bloom of some varieties is almost pure white, from a little distance, in other parts the delicate pink, always present at the inner part of the petals, is diffused enough to give a pink blush to the whole blossom. The fruit is a drupe with a dry fibrous or woody husk which splits into two halves as the fruit ripens. The common wild variety grows a kernel which is bitter from the presence of a substance called amygdalon, which yields in its turn prussic (hydrocyanic) acid. Young trees are grafted with cuttings from the sweet variety or are budded with apricot, peach or plum.``117';
isbe[411]='Almost`ol\'-most (en oligo): In <a onClick="return mV(\'Act\',26,28);">Ac 26:28</a> the Greek en oligo does not mean "almost," although scholars have for centuries translated the clause "Almost thou persuadest me to become a Christian." The revisers saw clearly the errors of their predecessors, so far as the signification of the first two words is concerned; but their explanation of the sentence is also erroneous; for the Greek cannot mean "With but little persuasion thou wouldst fain make me a Christian." Paul\'s reply proves that en oligo must be taken with the last word poiesai, not with peitheis, since he takes up Agrippa\'s en oligo, couples it with en megalo and continues with genesthai which is the regular passive of poiesai (compare Lysias xii. 71 with 72). And the idea of "Christian" is also taken up and repeated in hopoios kai ego eimi.<P>An investigation of the usage of en oligo shows that it was never used in the sense of "almost." <P>The phrase occurs first in the Hymn to Hermes, 240, and here it is evidently an abbreviated expression for the Homeric oligo eni choro (M 423). Compare K 161, P 394. But it was used for both time and place, with the substantive expressed or understood (Thuc. i.93.1; iii.66.3; iv.26.3; iv.55.3; ii.84.3; ii.86.5; iv.96.3; v.112; vii.67.3; vii.87.1; Pind. Pyth. viii.131; Eur. Suppl. 1126; Hel. 771; Isoc. iv.83; Dem. lviii.60; iii.18). These uses persist from Homer far down into the post-classical literature (Plut. Per. 159 F; Coriol. 217 F; Mar. 427 A; Crass. 547 C; Polyb. x.18; Appian, Mithrad. 330; Themistius xi.143 C; Eustath. II.B, p.339.18). In the New Testament the phrase occurs also in <a onClick="return mV(\'Eph\',3,3);">Eph 3:3</a>. Here too the common versions are incorrect. The clause in which the phrase occurs means simply, "as I said a little while ago"—the addition of en oligo merely indicates that the interval indicated by pro is short, an idea which would have been expressed in classical Greek by the simple dative, oligo and the adverb proteron (Ar. Thesm. 578; Aeschin. i. 2,26,72, 165; ii. 77, 147). Only a short while before Paul had expressed practically the same thought (<a onClick="return mV(\'Eph\',3,3);">Eph 3:3</a>) and in almost identical language.<P>Consequently, en oligo, in the New Testament, means "a little," and is equivalent to oligos which occurs in <a onClick="return mV(\'2Pe\',2,18);">2Pe 2:18</a>. In classical writers the idea would have been expressed by oligon, or kat\' oligon. So en oligo, which originally signified "in a little space" (or time), comes to mean simply "a little (bit)," ein bischen, but is never equivalent to oligou ("within a little") in any period of the language. The King James translators disregarded the real significance of poiesai, or adopted the reading of the inferior manuscripts (genesthai), so as to make the rest of the sentence harmonize with their translation of the first two words; and the revisers force the last two words into an impossible service, since the object of poiesai of which Christianon is the lucrative predicate, must be a third person, but certainly not Agrippa. Some scholars are of the opinion that the thought is: "You are trying to persuade me so as to make me a Christian." This is, indeed, the Spanish version; but examples show that the infinitive after peithein was used in a different sense. The best manuscript reads <span class="noTag">pitheis</span>. This might, of course, stand for peitheis. But mepitheis may point to an original mepipotheis. Compare <a onClick="return mV(\'Jam\',4,5);">Jas 4:5</a> and <a onClick="return mV(\'2Cr\',5,2);">2Co 5:2</a>, Plato Leg. 855 E. If these contentions be correct, the verb means simply "earnestly desire," and not "persuade."<P>Compare Herod. v.93; Plato Protag. 329 D; Aesch. Persian. 542; Soph. Phil. 534; Eur. H.F. 1408; I.T. 542; Cycl. 68; Ion 1432, Ar. Lys. 605, tou dei; ti potheis; Agrippa is asking, "What do you want, Paul? What are you trying to do? Make me a Christian?" The implication in Paul\'s reply is that he is very desirous indeed of making him a Christian. And this interpretation harmonizes with the scene. The apostle\'s business at this juncture is not to convert heathen to Christianity; for he is in chains before Agrippa, Berenice, Festus and prominent men of Caesarea, meta polles phantasias (<a onClick="return mV(\'Act\',26,23);">Ac 26:23</a>), to answer the charges brought against him by the Jews. But he holds forth at length and with such ardor that the Roman king says (though not necessarily in irony): "You seem to be anxious to make me a Christian in small measure." And Paul responds: "both small and great."<P>All the manuscripts, except Sinaiticus, have peitheis (Alexandrinus PEITHE). Several read genesthai (instead of poiesai). Wetstenius (Amsterdam 1752) and Knapp (Halle 1829) follow these manuscripts. So most of the old translates: Coverdale (1535), "Thou persuadest me in a parte to become a Christen"; Biblia Sacra (Paris 1745) "In modico suades me C. fieri"; a Latin MS, 14th century, now in Lane Semitic., Cincinnati; Rosenmueller\'s Scholia (1829), "Parum abest quin mihi persuadeas ut fiam"; Stier und Theile\'s Polyglotten Bibel (1849), Tregelles (1857- 1879, with Jerome\'s version); Edouard Reuss, Histoire apostolique (Paris 1876), "Tu vas me persuader bientot de devenir Chretien." The translation of Queen Elizabeth\'s Bible is "Somewhat thou bryngeste me in minde for to become Chryste." Wycliffe renders "In litil thing thou councelist me for to be maad a Christen man." Erasmus takes en oligo in the sense of "a little."<P>Calvin\'s rendering, "Thou writ make me a Christian in a moment," has been adopted in various countries (Wetstenius, Kuinoel, Neander, de Wette, Lange, Robinson, Hackett, Conybeare). The older scholars generally hold to "almost" (Valla, Luther, Beza, Grotius, Castalio, Du Veil, Bengel, Stier). Some interpret the phrase "with little labor" (Oecumenius, Olshausen, Baumgarten, Meyer, Lechler). Neander maintains that if we adopt the readings en megalo in Paul\'s answer, Agrippa\'s words must be explained "with a few reasons" ("which will not cost you much trouble"). Meyer-Wendt (Kritisch-exegetisches Handbuch uber die Apostelgeschichte) translates "mit Weregem imnerredest du mich Christ zu werden." Meyer himself conceives the words to have been spoken sarcastically. Se Classical Review, XXII, 238-41.``71';
isbe[412]='Alms; Almsgiving`ams, ams-giv\'-ing:<P>The English word "alms" is an abridged form of the Greek word, eleemosune (compare "eleemosynary"), appearing in gradually reduced forms in German Almosen, Wyclif\'s Almesse, Scotch Aw\'mons, and our alms.<P>The later Jews often used "righteousness" tsedhaqah as meaning alms, that being in their view the foremost righteousness. (Compare our modern use of "charity" to denote almsgiving.) This use is seen in the Talmud and in the frequent translations of the Hebrew word for "righteousness" (tsedhaqah) by "alms" (eleemosune) in the Septuagint, though nothing warranting this is found in the Hebrew Old Testament, or in the true text of the New Testament. This notion of righteousness as alms being well-nigh universal among Jews in Jesus\' day, and spreading even among Christians, accounts for "alms" in <a onClick="return mV(\'Mat\',6,\'1-\');">Mt 6:1</a>, where the true text has "righteousness": "Take heed that ye do not your righteousness before men, to be seen of them" (the Revised Version (British and American) with Codex Vaticanus, Codex Sinaiticus, Codex Bezae, the Latin versions, etc.). The oriental versions which generally read "alms" may be accounted for on the supposition that "alms" was first written on the margin as explaining the supposed meaning of "righteousness," and then, as according with this accepted oriental idea, was substituted for it in the text by the copyists.<P>Dikaiosune and eleemosune are both used in the Septuagint to translate chesedh, "kindness," and are also both used to translate tsedhaqah, "justice." Almsgiving was regarded not merely as a plain evidence of righteousness in general but also as an act of justice, a just debt owing to the needy. "No one refuses directly," Mackie says, hence, possibly, Christ\'s teaching in <a onClick="return mV(\'Luk\',11,41);">Lu 11:41</a>, "Let your righteousness (charity) be from within," "Give your hearts to almsgiving."<P>In the course of time the impulse and command to give alms in a true human way, out of pity, such as is found expressed in <a onClick="return mV(\'Deu\',15,11);">De 15:11</a> the King James Version, "Thou shalt open thine hand wide unto thy brother, to thy poor, and to thy needy, in thy land," gave place to a formal, meritorious" practice, possessing, like sacrifice, as men came to think, the power of atoning for man\'s sins, and redeeming him from calamity and death. For instance, <a onClick="return mV(\'Pro\',11,4);">Pr 11:4</a> (compare <a onClick="return mV(\'Pro\',16,6);">Pr 16:6</a>; <a onClick="return mV(\'Pro\',16,21);">21:3</a>) was expounded: "Water will quench blazing fire; so doth almsgiving make atonement for sins" (Ecclesiasticus 3:30). "Lay up alms in thy storehouse; it shall deliver thee from affliction" (Ecclesiasticus 29:12). The story of Tobit is especially in point: it is simply a lesson on almsgiving and its redeeming powers: "Alms delivers from death and will purge away all sin" (Tobit 1:3,16; 2:14; 4:7-11; 12:8,9. Compare Sirach 29:11 f.). Kindred teaching abounds in the Talmud: "Alms-giving is more excellent than all offerings," is "equal to the whole law," will "deliver from the condemnation of hell," will "make one perfectly righteous," etc. According to Rabbi Assi, "Almsgiving is a powerful paraclete between the Israelites and their Father in heaven, it brings the time of redemption nigh (Babha\' Bathra\' Talmud 10a).<P>The Roman Catholics, holding the Books of Tobit and Sirach to be canonical, find in them proof-texts for their doctrine of almsgiving, and likewise attach great value to the gifts to the poor as atoning for sins. Protestants, by a natural reaction, have failed to hold always at its true value what was and is an important Christian duty (see <a onClick="return mV(\'Luk\',12,33);">Lu 12:33</a> the King James Version, and, compare <a onClick="return mV(\'Mat\',6,\'19-24\');">Mt 6:19-24</a>: "Sell that ye have and give alms," etc.). It seems to have been so regarded and kept up in the Christian communities until the beginning of the 4th century (Apos Const II 36; Cyprian, De Opera and Eleemos. xiv).<P>The teaching of Jesus on the subject is important, first, as bearing upon Jewish ideas and practices, and second, as bearing upon present-day Christian ideas and practices.<P>This teaching appears most conspicuously in the Sermon on the Mount. While showing what is required of the subjects of the Messianic reign, He avowedly sets forth a higher and more spiritual morality than that which was taught and practiced by the scribes and Pharisees: "Except your righteousness shall exceed the righteousness of the scribes and Pharisees, ye shall in no wise enter into the kingdom of heaven" (<a onClick="return mV(\'Mat\',5,20);">Mt 5:20</a>). There, too, He lays down the general principle embodied in the words of <a onClick="return mV(\'Mat\',6,\'1-\');">Mt 6:1</a>: "Take heed that ye do not your righteousness before men, to be seen of them," and illustrates it by applying it to the three exercises most valued among the Jews (commended together in Tobit 12:8), namely, almsgiving (<a onClick="return mV(\'Mat\',6,2,4);">Mt 6:2, 4</a>), prayer (<a onClick="return mV(\'Mat\',6,\'5-15\');">Mt 6:5-15</a>), and fasting (<a onClick="return mV(\'Mat\',6,\'16-18\');">Mt 6:16-18</a>). Jewish writers claim that these are "the three cardinal disciplines which the synagogue transmitted to the Christian church and the Mohammedan mosque" (compare Koran, Sura 2 40, 104; 9 54).<P>Clearly what Jesus here forbids in general is not publicity in performing good deeds, which is often necessary and proper, but ostentatious publicity, for the purpose of attracting attention. (The Greek conveys distinctly this idea of purpose, and the verb for "to be seen" is the one from which comes our word "theater.")<P>Jewish writers, as also Greek and Roman philosophers, have many notable maxims upon the beauty and importance of being unostentatious in virtue, especially in deeds of benevolence. The Essenes had their treasury in a chamber of their own in the temple that both the giving and the taking should be unobserved (Mishnah, Sheq., v.6). Rabbi Eleazer said, "Alms-giving should be done in secret and not before men, for he who gives before men is a sinner, and God shall bring also the good deed before his judgment" (B.B. 9a; compare <a onClick="return mV(\'Ecc\',12,14);">Ec 12:14</a>).<P>In applying this principle to almsgiving Jesus teaches His disciple: "When ... thou doest alms, sound not a trumpet before thee, as the hypocrites do" (<a onClick="return mV(\'Mat\',6,2);">Mt 6:2</a>). The conjecture of Calvin, followed by Stier and others, and mentioned as early as Euthymius, that it was a practice among Jews for an ostentatious almsgiver literally to sound a trumpet, or cause a trumpet to be sounded before him, in public places to summon the needy is without foundation (Lightfoot); as is also the notion, made current by the rabbis and accepted by Edersheim (The Temple, etc., 26), that by "sounding a trumpet" Jesus was alluding to the trumpet-like receptacles of brass in the temple treasury.<P>There is no proof that these were found "in the synagogues," or "in the streets." "Sound a trumpet," according to the Greek commentators, and the best modern authorities, is merely a figurative expression common to many languages, for self-parade—efforts to attract notice and win applause (compare our vulgar English saying about "blowing your own horn"). The contrast with the common practice instituted by Jesus is the significant thing: "But when thou doest alms"—"thou" is emphatic by position in the Greek—"let not thy left hand know what thy right hand doeth," etc., i.e. "So far from trumpeting your almsgiving before the public, do not even let it be known to yourself." Jesus here, Calvin well says, "silently glances at a kind of folly which prevails everywhere among men, that they think they have lost their pares if there have not been many spectators of their virtues." (The traditional saying of Mohammed, "In almsgiving, the left hand should not know what the right has given," is evidently borrowed from this saying of Jesus.) It is worthy of note that, despite popular practice, to give alms with right motives, and only to those who were worthy to receive, was a matter of special solicitude and instruction with the best among Jews as well as among Christians. The words of the Psalmist, "Blessed is he that considereth the poor," are construed to be an admonition to "take personal interest in him and not simply give him alms" (Lev. R. xxxiv). "When thou wilt do good, know to whom thou doest it. Give unto the good and help not the sinner" (Ecclesiasticus 12:1-6; compare Didache 1:5,6). "He that gives a free offering should give with a well-meaning eye" (Yer. B.D. 4 11). Jesus\' words concerning the "single" and the "evil" eye (compare <a onClick="return mV(\'Luk\',11,\'34-36\');">Lu 11:34-36</a>), and Paul\'s teaching, "God loveth a cheerful giver" (<a onClick="return mV(\'2Cr\',9,\'7-9\');">2Co 9:7-9</a>) have their counterparts in Jewish teaching. Rabbi Eleazer, referring to <a onClick="return mV(\'Hsa\',10,12);">Ho 10:12</a>, taught this high doctrine. "The kindness displayed in the giving of alms decides the final reward" (Suk. 49b). Other kindred teaching in a way anticipated Jesus\' supreme lesson, "that thine alms may be in secret: and thy Father who seeth in secret shall recompense thee" (<a onClick="return mV(\'Mat\',6,4);">Mt 6:4</a>).<P>LITERATURE.<P>Commentaries at the place Rabbinical literature in point. D. Cassel, Die Armenverwaltung des alten Israel, 1887.``47';
isbe[413]='Almug or Algum`al\'-gum, (\'algummim (<a onClick="return mV(\'2Ch\',2,8);">2Ch 2:8</a>; <a onClick="return mV(\'2Ch\',9,10);">9:10</a>f); (\'almuggim, <a onClick="return mV(\'1Ki\',10,11);">1Ki 10:11</a>f)): It is generally supposed that these two names refer to one kind of tree, the consonants being transposed as is not uncommon in Semitic words. Solomon sent to Hiram, king of Tyre, saying, "Send me also cedar-trees, fir-trees, and algum-trees, out of Lebanon" (<a onClick="return mV(\'2Ch\',2,8);">2Ch 2:8</a>). In <a onClick="return mV(\'1Ki\',10,11);">1Ki 10:11</a> it is said that the navy of Hiram "that brought gold from Ophir, brought in from Ophir great plenty of almug-trees and precious stones." In the parallel passage in <a onClick="return mV(\'2Ch\',9,10);">2Ch 9:10</a> it is said that "algum-trees and precious stones" were brought. From this wood "the king made...pillars for the house of Yahweh, and for the king\'s house, harps also and psalteries for the singers: there came no such almug-trees, nor were seen, unto this day" (<a onClick="return mV(\'1Ki\',10,12);">1Ki 10:12</a>). The wood was evidently very precious and apparently came from East Asia—unless we suppose from <a onClick="return mV(\'2Ch\',2,8);">2Ch 2:8</a> that it actually grew on Lebanon, which is highly improbable; it was evidently a fine, close grained wood, suitable for carving. Tradition says that this was the famous sandal wood, which was in ancient times put to similar uses in India and was all through the ages highly prized for its color, fragrance, durability and texture. It is the wood of a tree, Pterocar pussantalinus (N.D. Santalaceae), which grows to a height of 25 to 30 feet; it is a native of the mountains of Malabar.``117';
isbe[414]='Alnathan`al\'-na-than (Alnathan, "God has given," the Revised Version (British and American) <a href="./study/isbe/search.html?string=ELNATHAN">ELNATHAN</a>): Apocryphal name of a person (1Esdras 8:44) corresponding to Elnathan of <a onClick="return mV(\'Ezr\',8,16);">Ezr 8:16</a>. He was one of the learned men summoned by Ezra, as he was beginning his journey to Jerusalem, and sent to Iddo to ask for ministers for the house of Yahweh.``1';
isbe[415]='Aloes; Lignaloes`al\'-oz, lin-al\'-oz, lig-nal\'-oz (\'ahalim, <a onClick="return mV(\'Num\',24,6);">Nu 24:6</a>, translation "lign-aloes" (= lignum aloes, "wood of aloes"), <a onClick="return mV(\'Pro\',7,17);">Pr 7:17</a>; \'ahaloth, <a onClick="return mV(\'Psa\',45,8);">Ps 45:8</a>; <a onClick="return mV(\'Sgs\',4,14);">So 4:14</a>; aloe, <a onClick="return mV(\'Jhn\',19,39);">Joh 19:39</a>): Mentioned as a substance for perfuming garments (<a onClick="return mV(\'Psa\',45,8);">Ps 45:8</a>) and beds (<a onClick="return mV(\'Pro\',7,17);">Pr 7:17</a>). In <a onClick="return mV(\'Sgs\',4,14);">So 4:14</a>, it occurs in a list of the most precious spices. The most memorable use of aloes as a spice is in <a onClick="return mV(\'Jhn\',19,39);">Joh 19:39</a>: "There came also Nicodemus, he who at the first came to him at night, bringing a mixture of myrrh and aloes, about a hundred pounds." This was an immense quantity and if the aloes bore any large proportion to the myrrh the mixture must have been purchased at a very high cost. The most difficult mention of aloes is the earliest where (<a onClick="return mV(\'Num\',24,5,6);">Nu 24:5-6</a>) Balaam in his blessing on Israel exclaims— "How goodly are thy tents, O Jacob, Thy tabernacles, O Israel! As valleys are they spread forth, As gardens by the river-side, As lign-aloes which Yahweh hath planted, As cedar-trees beside the waters." As the aloes in question grow in East Asia it is difficult to see how Balaam could have come to speak of them as living trees. Post (HDB, I, 69) suggests that they may possibly have been growing at that time in the Jordan valley; this is both improbable and unnecessary. Balaam need have had no actual tree in his mind\'s eye but may have mentioned the aloe as a tree famous over the Orient for its preciousness. That the reference is poetical rather than literal may be supposed by the expression in the next verse "cedar-trees beside the waters"—a situation very unnatural for the high-mountain-loving cedar. Yet another explanation is that the Hebrew has been altered and that \'elim, "terebinths" instead of \'ahalim, "aloes" stood in the original text. The aloe wood of the Bible is eaglewood—so misnamed by the Portuguese who confused the Malay name for it (agora) with the Latin aquila, "eagle"—a product of certain trees of the Natural Order Aquilariaceae, growing in Southeast Asia The two most valued varieties are Aquilaria malaccensis and Aloes agallocha—both fine spreading trees. The resin, which gives the fragrant quality to the wood, is formed almost entirely in the heart wood; logs are buried, the outer part decays while the inner, saturated with the resin, forms the "eagle wood" or "aloe wood" of commerce; "aloes" being the same wood in a finely powdered condition. To the Arabs this wood is known as \'ud. It shows a beautiful graining and takes a high polish.<P>These aloes must be clearly distinguished from the well-known medicinal aloes, of ancient fame. This is a resin from Aloes socatrina, and allied species, of the Natural Order Liliaceae, originally from the island of Socotra, but now from Barbados, the Cape of Good Hope and other places. The "American aloe" (Agave americana) which today is cultivated in many parts of Palestine, is also quite distinct from the Biblical plant.``117';
isbe[416]='Aloft`a-loft\' (epano): Only in 1Esdras 8:92. Meaning obscure. The statement following a confession of sin means probably that Israel in penitence returning to the Lord, is exultant in the assurance of His forgiveness, and encouraged in efforts at reformation.``1';
isbe[417]='Along`a-long’:Corresponding to two different Hebrew words, <a onClick="return mV(\'Jdg\',9,25);">Jdg 9:25</a>; <a onClick="return mV(\'1Sa\',6,12);">1Sa 6:12</a>; <a onClick="return mV(\'Jer\',41,6);">Jer 41:6</a>, joined with "come" and "go," vividly describes a course that is taken—it emphasizes its directness and immediateness. In <a onClick="return mV(\'Jdg\',7,12);">Jdg 7:12</a>, "lay along in the valley," probably means "all the length" or "at length."``1';
isbe[418]='Aloth`a\'-loth (\'aloth): So found in the King James Version and the Revised Version, margin in <a onClick="return mV(\'1Ki\',4,16);">1Ki 4:16</a>, where the Revised Version (British and American) has <a href="./study/isbe/search.html?string=BEALOTH">BEALOTH</A> (be\'aloth). A town, or district in Northern Palestine, together with Asher under Baana, one of Solomon\'s twelve civil officers. Conder identifies with the ruin \'Alia, near Achzib. There was another Bealoth in Southern Palestine (<a onClick="return mV(\'Jos\',15,24);">Jos 15:24</a>). The difference in the form of the word in the King James Version and the Revised Version (British and American) is due to interpretation of the initial "b" as the preposition "in" in the former, and as part of the word itself in the latter.``1';
isbe[419]='Alpha and Omega`al\'-fa, o\'-me-ga, o-me\'-ga (Alpha and Omega = A and O): The first and last letters of the Greek alphabet, hence, symbolically, "beginning and end"; in Revelation "The Eternal One" in <a onClick="return mV(\'Rev\',1,8);">Re 1:8</a> of the Father, in <a onClick="return mV(\'Rev\',21,6);">Re 21:6</a> and <a onClick="return mV(\'Rev\',22,13);">Re 22:13</a> of the Son. Compare Theodoret, Eusebius, Historia Ecclesiastica, iv. 8: "We used alpha down to omega, i.e. all." A similar expression is found in Latin (Martial, v.26). Compare Aretas (Cramer\'s Catenae Graecae in New Testament) on <a onClick="return mV(\'Rev\',1,8);">Re 1:8</a> and Tertullian (Monog, 5): "So also two Greek letters, the first and last, did the Lord put on Himself, symbols of the beginning and the end meeting in Him, in order that just as alpha rolls on to omega and omega returns again to alpha, so He might show that both the evolution of the beginning to the end is in Him and again the return of the end to the beginning." Cyprian, Testim, ii.1; vi.22, iii.100, Paulinus of Nola Carm. xix.645; xxx.89; Prudentius, Cathem., ix.10-12. In Patristic and later literature the phrase is regularly applied to the Son. God blesses Israel from \'aleph to taw (<a onClick="return mV(\'Lev\',26,\'3-13\');">Le 26:3-13</a>), but curses from waw to mem (<a onClick="return mV(\'Lev\',26,\'14-43\');">Le 26:14-43</a>). So Abraham observed the whole law from \'aleph to taw. Consequently, "Alpha and Omega" may be a Greek rendering of the Hebrew phrase, which expressed among the later Jews the whole extent of a thing.``71';
isbe[420]='Alphabet`al\'-fa-bet.<P>1. Definition:<P>An alphabet is a list of the elementary sounds used in any language. More strictly speaking it is that particular series, commonly known as the Phoenician or Canaanite alphabet, which was in use in the region of Palestine about 1000 BC, and which is the ancestor of nearly all modern written alphabets whether Semitic or European. It is the alphabet therefore of Old Testament Hebrew and Aramaic and New Testament Greek, of the superscription of Caesar and the Latin inscription on the cross, as well as of English through the Greek and Latin. It is an interesting fact, with many practical bearings on text and exegesis, that three sets of letters so very unlike in appearance as Hebrew, Greek and modern English should be the same in origin and alike in nature. Although the earliest surviving inscriptions must be a good deal later than the separation between the Greek and Hebrew, the records in each are more like one another than either is like its own modern printed form.<P>The characteristics of an alphabet are<P>(1) the analysis of sounds into single letters rather than syllables or images,<P>(2) the fixed order of succession in the letters,<P>(3) the signs for the sounds, whether names or written symbols. Of these the analysis into single letters, instead of whole words or syllables, is the characteristic element. The order of the letters may vary, as that of the Sanskrit does from the European, and yet the list remain not only alphabetic but the "same" alphabet, i.e. each sound represented by a similar name or written character. On the face of it, therefore, it might be imagined that the Egyptian and Babylonian, the Cypriote, the Minoan and other forms earlier than the Canaanite which are known or suspected to have had phonetic systems, may have had lists of these forms arranged in a fixed order, but these lists were not alphabetic until the final analysis into individual letters.<P>2. Name:<P>The name alphabet comes from the fist two letters of the Greek, alpha beta, just as the old English name for the alphabet, abc or abece, is simply the first three letters of the English alphabet, and thus is merely an abbreviation for the whole alphabet. It appears that the Greeks also used the first and last letters of the alphabet (alpha and omega) as the Jews did the first and last, or the first, middle and last letters of their alphabet, as abbreviation for the whole and in the same sense that in English one says "a to izzard." Alpha and beta are themselves derived from the Semitic names for the same letters (\'aleph, beth) and have no meaning in the Greek.<P>3. Invention:<P>The question of the invention of this alphabet differs from the question of the origin of the written forms of the letters with which it is often confused, and relates to the recognition of the individual letters. Alphabetical language whether written or spoken, inward or outward, is distinguished from the pictographic, hieroglyphic, and syllabic stages by this analysis into individual sounds or letters. It begins with the picture, passes to the ideogram and syllable, and from the syllable to the letter. This is best seen in writing, but it is equally true in speech. At the letter stage the alphabet begins. It is alleged by some that another stage, a consonantal writing, between syllabic and alphabetic writing, should be recognized. This would deny to the Phoenician the character of a true alphabet since, as in all Semitic languages, the vowels were in ancient times not written at all. Some go so far as to speak of it as syllabic in character, but on the other hand it may be said with equal pertinence that various syllabaries are nearly alphabetic. When a syllabic writing is reduced, as was the case with the Egyptian, the Cypriote and others, to a point where a character represents uniformly a certain consonant and a certain vowel, the vocal analysis has been made and the essential alphabet begun, although it was only later that men discovered that the consonant common to several syllables might be expressed to advantage in writing by one unvarying sign, and later still that the vowels too might be distinguished to advantage.<P>4. Origin of the Letters:<P>Few modern questions are changing shape so rapidly as that of the historical predecessor of the Canaanite or Phoenician alphabet. For a long time it was thought that De Rouge had solved the problem by tracing the letters to the Egyptian hieratic. This is the view of most of the popular literature of the present time, but is wholly surrendered by most workers in the field now, in spite of the fact that the latest studies in hieratic show a still greater resemblance in forms (Moller, Hierat. Palaographie, 1909). Winckler and others have claimed derivation from the Cuneiform, Praetorius from the Cypriote, Sayce gets at least three letters from the Hittite, while Evans and others incline to believe that the Minoan was the direct source of the alphabet, introduced from Crete into Palestine by the Philistines who were Cretans, or at least that the two are from a common ancestor, which is also the ancestor of many other of the Mediterranean alphabets.<P>Some, like Evans and Mosso, even suggest that, perhaps through the Minoan, the letter forms may be traced to the pictographs of the neolithic era in the caves of Europe. There is, in fact, an extraordinary resemblance between some of the letters of the Phoenician alphabet and some of the conventionalized signs of the neolithic age, and it may not be too fantastic to imagine that these early signs are the historic ancestors of the written alphabetical characters, but that they were in any sense alphabetical themselves is impossible if the invention of the alphabet was historical as here supposed, and is unlike from any point of view. If in fact the Paestos disk dates from before 1600 BC, and if Dr. Hempl\'s resolution of it into Ionic Greek is sound, we have another possible source or stock of characters from which the inventor of the alphabet may have chosen (Harper\'s Magazine, January, 1911).<P>5. Number of Letters:<P>The ideal written alphabet contains a separate character for each sound used in any or every language. Practically in most languages the alphabet falls a good deal short of the number of recognized sounds to be expressed in that language and in pronouncing dictionaries they have to be analyzed into say a broad, a short, a open, etc., by adding diacritical marks. "In educated English without regarding finer distinctions" (Edmonds, Comparative Philology, 45) about 50 sounds are commonly used, but Murray distinguishes at least 96, and the number sometimes used or which maybe used is much greater, the possible number of vowel sounds alone being as many as 72. Moreover the individual letters differ in sound in different individuals, and even in the same individual in successive utterances of what would be called the same letter or the same sound. It is alleged that the average sound of the a for example, is never the same in any two languages; the a in "father," even, is never the same in any two individuals, and that the same individual, even, never pronounces it twice so exactly in the same fashion that the difference may not be detected by sound photography.<P>The written alphabet is always thus less than the number of sounds used. The Phoenician and the Semitic alphabets generally had 22 letters, but they omitted the vowels. English has 26, of which many have two or more sounds.<P>6. Names of the Letters:<P>The names of the Greek alphabet are derived from the Semitic names and are meaningless in the Greek, while in the Semitic it has been pretty clearly shown that they signify for the most part some object or idea of which the earliest form of the written letter was a picture, as eg. \'aleph, the ox. The forms of the letters are apparently derived from pictures of the ox, house, etc., made linear and finally reduced to a purely conventional sign which was itself reduced to the simplest writing motion. All this has been boldly denied by Mr. Pilcher (PSBA, XXVI (1904), 168-73; XXVII (1905), 65-68), and the original forms declared to be geometric; but he does not seem to have made many converts, although he has started up rival claimants to his invention.<P>The names of the letters at least seem to indicate the Semitic origin of the alphabet, since the majority of them are the Semitic names for the objects which gave name to the letter, and the picture of which gives form to the written letter.<P>Following is Sayce\'s list (PSBA, XXXII (1910), 215-22) with some variants:<P>(1) \'aleph = ox;<P>(2) beth = house (tent);<P>(3) gimel = camel;<P>(4) daleth = door;<P>(5) he = house;<P>(6) waw = nail (Evans, tent peg);<P>(7) zayin = weapon;<P>(8) cheth = fence;<P>(9) Teth = cake of bread (Lidzbarski, a package);<P>(10) yodh = hand;<P>(11) kaph = palm of hand;<P>(12) lamedh = ox-goad;<P>(13) mem = water flowing;<P>(14) nun = fish;<P>(15) camekh = ?;<P>(16) \'ayin = eye;<P>(17) pe = mouth;<P>(18) tsadhe = trap (others, hook or nose or steps),<P>(19) qoph = cage (Evans says picture is an outline head and Lidzbarski, a helmet);<P>(20) resh = head;<P>(21) shin = tooth (not teeth);<P>(22) taw = mark. Not all of these meanings are, however, generally accepted (compare also Noldeke, Beitrage Strassb. (1904), 124-36; Lidzbarski, Ephemeris, II, 125-39).<P>7. Order of Letters:<P>The order of the letters differs more or less in different languages, but it is in the main the same in all the Semitic and Western alphabets derived from the Phoenician alphabet and this is roughly the order of the English alphabet. This order is, however, full of minor variations even among the Western alphabets and in the Indian languages the letters are entirely regrouped on a different principle.<P>The conventional order of the Semitic alphabet may be traced with some certainty in the Biblical books to as early as the 6th century BC, even accepting the dates of a radical higher criticism, for there are more than a dozen passages in the Old Testament composed on the principle of the alphabetical acrostic (<a onClick="return mV(\'Psa\',111,\'1-\');">Pss 111</a>; <a onClick="return mV(\'Psa\',112,\'1-\');">112</a>; <a onClick="return mV(\'Psa\',119,\'1-\');">119</a>; <a onClick="return mV(\'Pro\',31,\'10-31\');">Pr 31:10-31</a>; <a onClick="return mV(\'Lam\',1,\'1-\');">La 1</a>; <a onClick="return mV(\'Lam\',2,\'1-\');">2</a>; <a onClick="return mV(\'Lam\',3,\'1-\');">3</a>; <a onClick="return mV(\'Lam\',4,\'1-\');">4</a>, etc.) and the oldest of these are of this period (see <a href="./study/isbe/search.html?string=ACROSTIC">ACROSTIC</a>). The Formello abecedarium, if it is in fact from the 7th century BC, carries the known order back a century farther still and shows it prevailing in Italy as well as Palestine. Moreover, there are those who still consider some of the alphabetical psalms older even than this.<P>It must be noted, however, that while the order is in general fixed, there are local and temporary differences. In several cases eg. the order of the sixteenth and seventeenth letters of the alphabet is inverted in the alphabetical acrostics, and this would seem to point to a time or place where pe, \'ayin, was the accepted order. It happens that the inversion occurs in both the passages which are counted earliest by the modern critics (G. B. Gray in HDB2, 8). Mr. Sayce too has recently altered or restored the order by relegating the original camekh to a place after shin, while Mr. Pilcher has quite reconstructed the original order on a geometrical basis, to his own taste at least, as brd; hvg; mnl; szt.<P>A certain grouping together of signs according to the relationship of the objects which they represent has often been noticed, and Sayce (PSBA, XXXII (1910), 215-22) thinks that he has (after having put camekh in its right place) reduced the whole matter to a sequence of pairs of things which belong together: ox-house, camel-tent door, house-nail, weapon-fence (city wall), bread-hand, open hand-arm with goad, water-fish, eye-mouth, trap-cage, head- tooth, camekh, taw. This arranging he thinks was done by someone who knew that \'aluph was the West Semitic for "leader" and taw was the Cretan sign for ending—an Amorite therefore in touch with the Philistines. The final word on order seems not yet to have been spoken.<P>8. The Earliest Texts:<P>The chief North Semitic texts are<P>(1) Moabite stone (circa 850 BC);<P>(2) inscriptions of Zkr, Zenjirli, etc. (circa 800 BC);<P>(3) Baal-Lebanon inscription (circa 750 BC);<P>(4) Siloam inscription (circa 700 BC);<P>(5) Harvard Samaritan ostraca (time of Ahab?);<P>(6) Gezer tablet;<P>(7) various weights and seals before 600 BC. The striking fact about the earliest inscriptions is that however remote geographically, there is on the whole so little difference in the forms of the letters. This is particularly true of the North Semitic inscriptions and tends to the inference that the invention was after all not so long before the surviving inscriptions. While the total amount of the earliest Palestine inscriptions is not even yet very large, the recent discovery of the Samaritan ostraca, the Gezer tablet, and various minor inscriptions, is at least pointing to a general use of Semitic writing in Palestine at least as early as the 9th century BC.<P>9. Changes in Letter Forms:<P>The tendency of letters to change form in consequence of changed environment is not peculiar to alphabetical writing but is characteristic of the transmission of all sorts of writing. The morphology of alphabetical writing has however its own history. The best source for studying this on the Semitic side is Lidzbarski\'s Handbuch (see below), and on the Greek side the best first source is E. S. Roberts, Introduction to Greek Epigraphy (Cambr.). The best synoptical statement of the Semitic is found in the admirable tables in the Jewish Encyclopedia, V, i, 449-53. For the later evolution of both Greek and Latin alphabets, E. M. Thompson\'s Introduction to Greek and Latin Paleography, Oxford,1912,is far the best Introduction. In this he takes account of the great finds of papyri which have so revolutionized the study of the forms of Greek letters around the beginning of the Christian era, since his first Handbook was published. (See articles on <a href="./study/isbe/search.html?string=TESTAMENT,+OLD,+TEXT+OF+THE">the text of Old Testament</A> and <a href="./study/isbe/search.html?string=Testament,+New,+Text+and+Manuscripts+of+the">New Testament</A>.)<P>In the Hebrew, the old Phoenician alphabet of the early inscriptions had in the New Testament times given way to the square Aramaic characters of the modern Hebrew which possibly came into use as early as the time of Ezra. The most comprehensive modern brief conspectus covering both Hebrew and Greek is that reproduced in this article from the little manual of Specht. See also <a href="./study/isbe/search.html?string=WRITING">WRITING</a>.<P>LITERATURE.<P>Isaac Taylor\'s Alphabet (2nd ed., 1899) is still useful for orientation, and his article in the HDB likewise, but Edward Clodd\'s little Story of the Alphabet (New York, 1907), taken with Faulmann\'s Geschichte der Schrift and Buch der Schrift, is better for general purposes. For scientific purposes see the bibliography prefixed to Lidzbarski\'s Handbuch der nordsemitischen Epigraphik (1898, 2 vols) and his Ephemeris passim to date, Evans\' Scripta minoa, Oxf.,1909,and the literature of the article <a href="./study/isbe/search.html?string=WRITING">WRITING</a> in this Encyclopedia. See also C. G. Ball, "Origin of the Phoenician Alphabet," Proceedings of the Society of Biblical Archaeology, XV, 392-408; E. J. Pilcher, "The Origin of the Alphabet," PSBA, XXVI (1904), 168-73; Franz Praetorius, "The Origin of the Canaanite Alphabet," Smithsonian Rep. (1907), 595-604; S. A. Cook, "The Old Hebrew Alphabet and the Gezer Tablet," PEFS (1909), 284-309. For Bible class work, H. N. Skinner\'s Story of the Letters and Figures (Chicago, 1905) is very admirably adapted to the purpose.``147';
isbe[421]='Alphaeus`al-fe\'-us (Alphaios; Westcott and Hort, The New Testament in Greek, Halphaios):<P>(1) The father of the second James in the list of the apostles (<a onClick="return mV(\'Mat\',10,3);">Mt 10:3</a>; <a onClick="return mV(\'Mar\',3,18);">Mr 3:18</a>; <a onClick="return mV(\'Luk\',6,15);">Lu 6:15</a>; <a onClick="return mV(\'Act\',1,13);">Ac 1:13</a>).<P>(2) The father of Levi, the publican (<a onClick="return mV(\'Mar\',2,14);">Mr 2:14</a>). Levi is designated as Matthew in the Gospel of Matthew <a onClick="return mV(\'Mat\',9,9);">Mt 9:9</a>. There is no other reference to this Alpheus.<P>Some writers, notably Weiss, identify the father of Levi with the father of the second James. He says that James and Levi were undoubtedly brothers; but that seems improbable. If they were brothers they would quite likely be associated as are James and John, Andrew and Peter. Chrysostom says James and Levi had both been tax-gatherers before they became followers of Jesus. This tradition would not lend much weight as proof that they were brothers, for it might arise through identifying the two names, and the western manuscripts do identify them and read James instead of Levi in <a onClick="return mV(\'Mar\',2,14);">Mr 2:14</a>. This, however, is undoubtedly a corruption of the text. If it had been the original it would be difficult to explain the substitution of an unknown Levi for James who is well known. Many writers identify Alpheus, the father of the second James, with Clopas of <a onClick="return mV(\'Jhn\',19,25);">Joh 19:25</a>. This had early become a tradition, and Chrysostom believed they were the same person. This identity rests on four suppositions, all of which are doubtful:<P>(a) That the Mary of Clopas was the same as the Mary who was the mother of the second James. There is a difference of opinion as to whether "Mary of Clopas" should be understood to be the wife of Clopas or the daughter of Clopas, but the former is more probable. We know from <a onClick="return mV(\'Mat\',27,56);">Mt 27:56</a> and <a onClick="return mV(\'Mar\',15,40);">Mr 15:40</a> that there was a James who was the son of Mary, and that this Mary belonged to that little group of women that was near Jesus it the time of the crucifixion. It is quite likely that this Mary is the one referred to in <a onClick="return mV(\'Jhn\',19,25);">Joh 19:25</a>. That would make James, the son of Mary of <a onClick="return mV(\'Mat\',27,56);">Mt 27:56</a>, the son of Mary of Clopas. But Mary was such a common name In the New Testament that this supposition cannot be proven.<P>(b) That the James, who was the son of Mary, was the same person as the James, the son of Alpheus. Granting the supposition under (a), this would not prove the identity of Clopas and Alpheus unless this supposition can also be proven, but it seems impossible to either prove it or disprove it.<P>(c) That Alpheus and Clopas are different variations of a common original, and that the variation has arisen from different pronunciations of the first letter ("ch") of the Aramaic original. There are good scholars who both support and deny this theory.<P>(d) That Clopas had two names as was common at that time; but there is nothing to either substantiate or disprove this theory. See <a href="./study/isbe/search.html?string=CLOPAS">CLOPAS</a>.<P>It seems impossible to determine absolutely whether or not Alpheus, the father of the second James, and Clopas of <a onClick="return mV(\'Jhn\',19,25);">Joh 19:25</a> are the same person, but it is quite probable that they are.``62';
isbe[422]='Also`ol\'-so: In the Greek kai, when it is equivalent to "also" or "even," is always placed before the word or phrase which it is intended to emphasize (e.g. <a onClick="return mV(\'Act\',12,3);">Ac 12:3</a>; <a onClick="return mV(\'1Jo\',4,21);">1Joh 4:21</a>). <a onClick="return mV(\'Mat\',6,14);">Mt 6:14</a> should therefore read, "Your heavenly Father will forgive you also"; <a onClick="return mV(\'Luk\',6,13);">Lu 6:13</a>, "Whom also he named apostles"; <a onClick="return mV(\'Hbr\',8,6);">Heb 8:6</a>, "The mediator of a better covenant also"; and <a onClick="return mV(\'1Th\',4,14);">1Th 4:14</a>, \'If we believe that Jesus died and rose again, so also (we believe that) those who are fallen asleep in Jesus, God will bring with Him.\'``1';
isbe[423]='Altaneus`al-ta-ne\'-us.`<a href="./study/isbe/search.html?string=MALTANNEUS">MALTANNEUS</a>`1';
isbe[424]='Altar`ol’-ter (mizbeach, literally, "place of slaughter or sacrifice," from zabhach, which is found in both senses; bomos, (only in <a onClick="return mV(\'Act\',17,23);">Ac 17:23</a>), thusiasterion):<P><b>I. CLASSIFICATION OF HEBREW ALTARS</b><P class="in15">Importance of the Distinction<P><b>II. LAY ALTARS</b><P class="in15">1. Pre-Mosaic<P class="in15">2. In the Mosaic Age<P class="in15">3. Dangers of the Custom<P class="in15">4. The Mosaic Provisions<P><b>III. HORNED ALTARS OF BURNT OFFERING</b><P class="in15">1. The Tabernacle Altar<P class="in15">2. The Altar of <a onClick="return mV(\'Jos\',22,\'1-\');">Jos 22</a><P class="in15">3. The Altar till Solomon<P class="in15">4. The Horned Altar in Use<P class="in15">5. The Temple of Solomon<P class="in15">6. The Altar of Ahaz<P class="in15">7. Ezekiel<P class="in15">8. The Post-exilic Altar<P class="in15">9. Idolatrous and Unlawful Altars<P class="in15">10. The Horns<P><b>IV. ALTARS OF INCENSE</b><P><b>V. RECENT ARCHAEOLOGICAL MATERIALS</b><P class="in15">1. A Gezer Altar<P class="in15">2. The Taanach Altar of Incense<P><b>LITERATURE</b><hr /><P><b>A. CRITICAL</b><P>I. Classification of Hebrew Altars.<P>Before considering the Biblical texts attention must be drawn to the fact that these texts know of at least two kinds of altars which were so different in appearance that no contemporary could possibly confuse them. The first was an altar consisting of earth or unhewn stones. It had no fixed shape, but varied with the materials. It might consist of a rock (<a onClick="return mV(\'Jdg\',13,19);">Jdg 13:19</a>) or a single large stone (<a onClick="return mV(\'1Sa\',14,\'33-35\');">1Sa 14:33-35</a>) or again a number of stones (<a onClick="return mV(\'1Ki\',18,31);">1Ki 18:31</a> f.). It could have no horns, nor it would be impossible to give the stone horns without hewing it, nor would a heap of earth lend itself to the formation of horns. It could have no regular pattern for the same reason. On the other hand we meet with a group of passages that refer to altars of quite a different type. We read of horns, of fixed measurements, of a particular pattern, of bronze as the material. To bring home the difference more rapidly illustrations of the two types are given side by side. The first figure represents a cairn altar such as was in use in some other ancient religions. The second is a conjectural restoration of Hebrew altars of burnt offering and incense of the second kind.<P>Importance of the Distinction:<P>Both these might be and were called altars, but it is so evident that this common designation could not have caused any eye-witness to confuse the two that in reading the Bible we must carefully examine each text in turn and see to which kind the author is referring. Endless confusion has been caused, even in our own time, by the failure to note this distinction, and the reader can hope to make sense of the Biblical laws and narratives only if he be very careful to picture to himself in every case the exact object to which his text refers. For the sake of clearness different terms will be adopted in this article to denote the two kinds of altars. The first will be termed "lay altars" since, as will be seen, the Law permitted any layman to offer certain sacrifices at an altar of earth or unhewn stone without the assistance of a priest, while the second while be styled "horned altars," owing to their possession of horns which, as already pointed out, could not exist in a lay altar that conformed with the provisions of the law.<P>II. Lay Altars.<P>1. Pre-Mosaic:<P>In Genesis we often read of the erection of altars, e.g. <a onClick="return mV(\'Gen\',8,20);">Ge 8:20</a>; <a onClick="return mV(\'Gen\',12,7);">12:7</a>; <a onClick="return mV(\'Gen\',13,4);">13:4</a>. Though no details are given we are able to infer their general character with considerable precision. In reading the accounts it is sometimes evident that we are dealing with some rough improvised structure. For example, when Abraham builds the altar for the sacrifice of Isaac in <a onClick="return mV(\'Gen\',22,\'1-\');">Ge 22</a> it cannot be supposed that he used metal or wrought stone. When Jacob makes a covenant with Laban a heap of stones is thrown up "and they did eat there by the heap" (<a onClick="return mV(\'Gen\',31,46);">31:46</a>). This heap is not expressly termed an altar, but if this covenant be compared with later covenants it will be seen that in these its place is taken by an altar of the lay type (SBL, chapter 2), and it is reasonable to suppose that this heap was in fact used as an altar (compare <a onClick="return mV(\'Gen\',31,54);">Ge 31:54</a>). A further consideration is provided by the fact that the Arabs had a custom of using any stone as an altar for the nonce, and certainly such altars are found in the Mosaic and post-Mosaic history. We may therefore feel sure that the altars of Gensis were of the general type represented by Fig. 1 and were totally unlike the altars of Fig. 2.<P>2. In the Mosaic Age:<P>Thus Moses found a custom by which the Israelite threw up rude altars of the materials most easily obtained in the field and offered sacrificial worship to God on sundry occasions. That the custom was not peculiar to the Israelites is shown by such instances as that of Balaam (<a onClick="return mV(\'Num\',23,1);">Nu 23:1</a>, etc.). Probably we may take the narrative of Jethro’s sacrifice as a fair example of the occasions on which such altars were used, for it cannot be supposed that Aaron and all the elders of Israel were openly committing an unlawful act when they ate bread with Moses’ father-in-law before God (<a onClick="return mV(\'Exd\',18,12);">Ex 18:12</a>). Again, the narrative in which we see Moses building an altar for the purposes of a covenant probably exemplifies a custom that was in use for other covenants that did not fall to be narrated (<a onClick="return mV(\'Exd\',24,4);">Ex 24:4</a> f.).<P>3. Dangers of the Custom:<P>But a custom of erecting altars might easily lend itself to abuses. Thus archaeology has shown us one altar—though of a much later date—which is adorned with faces, a practice that was quite contrary to the Mosaic ideas of preserving a perfectly imageless worship. Other possible abuses were suggested by the current practices of the Canaanites or are explained by the terms of the laws.<P>See <a href="./study/isbe/search.html?string=HIGH+PLACE">HIGH PLACE</a>.<P>4. The Mosaic Provisions:<P>Accordingly Moses regulated these lay altars. Leaving the occasion of their erection and use to be determined by custom he promulgated the following laws: "An altar of earth mayest thou make unto me, and mayest sacrifice thereon thy burnt offerings and thy peace offerings, thy sheep, and thine oxen; in all the place where I record my name I will come unto thee and I will bless thee. And if thou make me an altar of stone, thou shalt not build it of hewn stones; for if thou lift thy tool upon it, thou hast polluted it. Neither mayest thou go up by steps unto mine altar," etc. (<a onClick="return mV(\'Exd\',20,\'24-26\');">Ex 20:24-26</a>; so correct English Versions of the Bible). Several remarks must be made on this law.<P>It is a law for laymen, not priests. This is proved by the second person singular and also by the reason given for the prohibition of steps—since the priests were differently garbed. It applies "in all the place where I record my name," not, as the ordinary rendering has it, "in every place." This latter is quite unintelligible: it is usually explained as meaning places hallowed by theophanies, but there are plenty of instances in the history of lay sacrifices where no theophany can be postulated; see e.g. <a onClick="return mV(\'Gen\',31,54);">Ge 31:54</a>; <a onClick="return mV(\'1Sa\',20,6,29);">1Sa 20:6, 29</a> (EPC, 185 f.). "All the place" refers to the territory of Israel for the time being. When Naaman desired to cease sacrificing to any deity save the God of Israel he was confronted by the problem of deciding how he could sacrifice to Him outside this "place." He solved it by asking for two mules’ burden of the earth of the "place" (<a onClick="return mV(\'2Ki\',5,17);">2Ki 5:17</a>). Lastly, as already noticed, this law excludes the possibility of giving the altars horns or causing them to conform to any given pattern, since the stone could not be wrought One other law must be noticed in this connection: <a onClick="return mV(\'Deu\',16,21);">De 16:21</a> f.: ‘Thou shalt not plant thee an ‘asherah of any kind of tree beside the altar of the Lord thy God, which thou shalt make thee. Neither shalt thou set thee up a pillar, which the Lord thy God hateth.’ Here again the reference is probably to the lay altars, not to the religious capital which was under the control of the priests.<P>III. Horned Altars of Burnt Offering.<P>1. The Tabernacle Altar:<P>In <a onClick="return mV(\'Exd\',27,\'1-8\');">Ex 27:1-8</a> (compare <a onClick="return mV(\'Exd\',38,\'1-7\');">Ex 38:1-7</a>) a command is given to construct for the Tabernacle an altar of shittim wood covered with bronze. It was to be five cubits long by five broad and three high. The four corners were to have horns of one piece with it. A network of bronze was to reach halfway up the altar to a ledge. In some way that is defined only by reference to what was shown to Moses in the Mount the altar was to be hollow with planks, and it was to be equipped with rings and staves for facility of transport. The precise construction cannot be determined, and it is useless to speculate where the instructions are so plainly governed by what was seen by Moses in the Mount; but certain features that are important for the elucidation of the Bible texts emerge clearly. The altar is rectangular, presenting at the top a square surface with horns at the four corners. The more important material used is bronze, and the whole construction was as unlike that of the ordinary lay altar as possible. The use of this altar in the ritual of the Tabernacle falls under the heading <a href="./study/isbe/search.html?string=SACRIFICE">SACRIFICE</a>. Here we must notice that It was served by priests. Whenever we find references to the horns of an altar or to its pattern we see that the writer is speaking of an altar of this general type. Thus, a criminal seeking asylum fled to an altar of this type, as appears from the horns which are mentioned in the two historical instances and also from such expressions as coming down or going up. See <a href="./study/isbe/search.html?string=ASYLUM">ASYLUM</a>.<P>2. The Altar of <a onClick="return mV(\'Jos\',22,\'1-\');">Jos 22</a>:<P>We read in <a onClick="return mV(\'Jos\',22,9);">Jos 22:9</a>f. that the children of Reuben and the children of Gad built an altar. In <a onClick="return mV(\'Jos\',22,28);">22:28</a> we find them saying, "Be hold the pattern of the altar," etc. This is decisive as to the meaning, for the lay altar had no pattern. Accordingly in its general shape this altar must have conformed to the type of the Tabernacle altar. It was probably not made of the same materials, for the word "build" is continually used in connection with it, and this word would scarcely be appropriate for working metal: nor again was it necessarily of the same size, but it was of the same pattern: and it was designed to serve as a witness that the descendants of the men who built it had a portion in the Lord. It seems to follow that the pattern of the Tabernacle altar was distinctive and unlike the heathen altars in general use in Palestine and this appears to be confirmed by modern excavations which have revealed high places with altars quite unlike those contemplated by the Pentateuch. See <a href="./study/isbe/search.html?string=HIGH+PLACE">HIGH PLACE</a>.<P>3. The Altar till Solomon:<P>In the subsequent history till the erection of Solomon’s Temple attention need only be directed to the fact that a horned altar existed while the Ark was still housed in a tent. This is important for two reasons. It shows a historical period in which a horned altar existed at the religious capital side by side with a number of lay altars all over the country, and it negatives the suggestion of G. A. Smith (Jerusalem, II, 64) that the bare rock ec-Cakhra was used by Solomon as the altar, since the unhewn rock obviously could not provide a horned altar such as we find as early as <a onClick="return mV(\'1Ki\',1,\'50-53\');">1Ki 1:50-53</a>.<P>4. The Horned Altar in Use:<P>Note too that we read here of bringing down from the altar, and this expression implies elevation. Further in <a onClick="return mV(\'1Ki\',9,25);">1Ki 9:25</a> we hear that Solomon was in the habit of offering on the altar which he had built, and this again proves that he had built an altar and did not merely use the temple rock. (See also Watson in PEFS (January, 1910), 15 f., in reply to Smith.)<P>5. The Temple of Solomon:<P>For the reasons just given it is certain that Solomon used an altar of the horned type, but we have no account of the construction in Kings. According to a note preserved in the Septuagint but not in the Hebrew, Solomon enlarged the altar erected by David on Araunah’s threshing-floor (<a onClick="return mV(\'2Sa\',24,25);">2Sa 24:25</a>), but this notice is of very doubtful historical value and may be merely a glossator’s guess. According to <a onClick="return mV(\'2Ch\',4,1);">2Ch 4:1</a> the altar was made of bronze and was twenty cubits by twenty by ten. The Chronicler’s dimensions are doubted by many, but the statement of the material is confirmed by <a onClick="return mV(\'1Ki\',8,64);">1Ki 8:64</a>; <a onClick="return mV(\'2Ki\',16,\'10-15\');">2Ki 16:10-15</a>. From the latter passage it appears that an altar of bronze had been in use till the time of Ahaz.<P>6. The Altar of Ahaz:<P>This king saw an altar in Damascus of a different pattern and had a great altar made for the temple on its model. As the text contrasts the great altar with the altar of bronze, we may refer that the altar of Ahaz was not made of bronze. Whether either or both of these altars had steps (compare <a onClick="return mV(\'Eze\',43,17);">Eze 43:17</a>) or were approached by a slope as in Fig. 2 cannot be determined with certainty. It may be noted that in <a onClick="return mV(\'Isa\',27,9);">Isa 27:9</a> we read of the stones of the altar in a passage the reference of which is uncertain.<P>7. Ezekiel:<P>Ezekiel also gives a description of an altar (<a onClick="return mV(\'Eze\',43,\'13-17\');">Eze 43:13-17</a>), but there is nothing to show whether it is purely ideal or represents the altar of Solomon or that of Ahaz, and modern writers take different views. In the vision it stood before the house (<a onClick="return mV(\'Eze\',40,47);">Eze 40:47</a>). In addition he describes an altar or table of wood (<a onClick="return mV(\'Eze\',41,22);">Eze 41:22</a>). This of course could only be a table, not in any sense an altar. See <a href="./study/isbe/search.html?string=TABLE">TABLE</a>.<P>8. The Post-exilic Altar:<P><a onClick="return mV(\'Ezr\',3,2);">Ezr 3:2</a>f. tells of the setting up of the altar by Zerubbabel and his contemporaries. No information as to its shape, etc., can be extracted from this notice. We read of a defilement of the temple altar in 1Macc 1:54. This was made of stones (<a onClick="return mV(\'Exd\',20,\'24-26\');">Ex 20:24-26</a> having at this date been applied to the temple altar contrary to its original intent) and a fresh altar of whole stones was constructed (1Macc 4:44-49). Presumably this altar had no horns.<P>9. Idolatrous and Unlawful Altars:<P>It is clear from the historical and prophetical books that in both kingdoms a number of unlawful altars were in use. The distinction which has been drawn between lay altars and horned altars helps to make these passages easy to understand. Thus when Amos in speaking of Bethel writes, "The horns of the altar shall be cut off," we see that he is not thinking of lay altars which could have no horns (<a onClick="return mV(\'Amo\',3,14);">Am 3:14</a>). Again Hosea’s "Because Ephraim hath multiplied altars ‘to sin,’ altars have been to him ‘for sin’"(<a onClick="return mV(\'Hsa\',8,11);">Ho 8:11</a>, compare <a onClick="return mV(\'Hsa\',10,\'1-8\');">Ho 10:1-8</a>; <a onClick="return mV(\'Hsa\',12,11);">12:11</a> (12)), is not in contradiction to <a onClick="return mV(\'Exd\',20,\'24-26\');">Ex 20:24-26</a> because the prophet is not speaking of lay altars. The high places of Jeroboam (<a onClick="return mV(\'1Ki\',12,\'28-33\');">1Ki 12:28-33</a>) were clearly unlawful and their altars were unlawful altars of the horned type. Such cases must be clearly distinguished from the lay altars of Saul and others.<P>10. The Horns:<P>The origin of the horns is unknown, though there are many theories. Fugitives caught hold of them (<a onClick="return mV(\'1Ki\',1,50,51);">1Ki 1:50-51</a>), and victims could be tied to them (<a onClick="return mV(\'Psa\',118,27);">Ps 118:27</a>).<P>IV. Altars of Incense.<P><a onClick="return mV(\'Exd\',30,\'1-10\');">Ex 30:1-10</a> contains the commands for the construction and use of an altar of incense. The material was shittim wood, the dimensions one cubit by one by two, and it also had horns. Its top and sides were overlaid with gold and it was surrounded by a crown or rim of gold. For facility of transport it had golden rings and staves. It stood before the veil in front of the ark.<P>Solomon also constructed an altar of incense (<a onClick="return mV(\'1Ki\',6,20);">1Ki 6:20</a>; <a onClick="return mV(\'1Ki\',7,48);">7:48</a>; <a onClick="return mV(\'1Ch\',28,18);">1Ch 28:18</a>), cedar replacing shittim wood. The altar of incense reappears in 1Macc 1:21; 4:49.<P>V. Recent Archaeological Materials.<P>Recently several altars have been revealed by excavations. They throw light on the Bible chiefly by showing what is forbidden. See especially <a href="./study/isbe/search.html?string=HIGH+PLACE">HIGH PLACE</a>.<P>1. A Gezer Altar:<P>Fig. 3 represents an altar found at Gezer built into the foundation of a wall dating about 600 BC. Mr. Macalister describes it in the following words: "It is a four-sided block of limestone, 1 ft. 3 inches high. The top and bottom are approximately 10 1//2 and 9 inches square respectively; but these are only the average dimensions of the sides, which are not regularly cut. The angles are prolonged upward for an additional 1 1/2 inches as rounded knobs—no doubt the ‘horns’ of the altar. The top is very slightly concave so as to hold perhaps an eighth of a pint of liquid" (PEFS (July, 1907), 196f). The size suggests an altar of incense rather than an altar of burnt offering, but in view of the general resemblance between the Tabernacle altars of burnt offering and incense, this is a fact of minor importance. On the other hand, the shape, pattern and material are of great interest. That the altar violates in principle the law of <a onClick="return mV(\'Exd\',20,25);">Ex 20:25</a> forbidding the dressing of the stones is obvious, though that passage does not apply in terms to altars of incense, but certainly the appearance of the block does recall in a general way the altars of the other type—the horned altars. Like them it is four-sided with a square top, and like them it has knobs or horns at each corner. Possibly it was formed in general imitation of the Temple altars. Other altars in Canaanite high places exemplify by their appearance the practices prohibited by the Pentateuch. See for illustrations H. Vincent, Canaan d’apres l’exploration recente; R. Kittel, Studien zur hebraischen Archaologie und Religions-Geschichte; S. R. Driver, Modern Research as Illustrating the Bible.<P>2. The Taanach Altar of Incense:<P>Importance attaches to a terra cotta altar of incense found by Sellin at Taanach, because its height and dimensions at the base recall the altar of Ex. "It was just 3 ft. high, and in shape roughly like a truncated pyramid, the four sides at the bottom being each 18 inches long, and the whole ending at the top in a bowl a foot in diameter....The altar is hollow....Professor Sellin places the date of the altar at about 700 BC....An incense-altar of exactly the same shape...but of much smaller size...has been found quite recently at Gezer in debris of about 1000-600 BC" (Driver, Modern Research, etc., 85). These discoveries supply a grim comment on theories of those critics who maintain that incense was not used by the Hebrews before the time of Jeremiah. The form of the altar itself is as contrary to the principles of the Pentateuch law as any thing could be.<P>On altar furniture see <a href="./study/isbe/search.html?string=POT">POT</a>; <a href="./study/isbe/search.html?string=SHOVEL">SHOVEL</a>; <a href="./study/isbe/search.html?string=BASIN">BASIN</a>; <a href="./study/isbe/search.html?string=FLESH-HOOK">FLESH-HOOK</a>; <a href="./study/isbe/search.html?string=FIREPAN">FIREPAN</a>. On the site, <a href="./study/isbe/search.html?string=TEMPLE">TEMPLE</a>, and generally, <a href="./study/isbe/search.html?string=ARIEL">ARIEL</a>; <a href="./study/isbe/search.html?string=SACRIFICE">SACRIFICE</a>; <a href="./study/isbe/search.html?string=SANCTUARY">SANCTUARY</a>; <a href="./study/isbe/search.html?string=TABERNACLE">TABERNACLE</a>; <a href="./study/isbe/search.html?string=HIGH+PLACE">HIGH PLACE</a>.<P>LITERATURE.<P>R. Kittel, Studien zur hebraischen Archaologie und Religions-Geschichte, I and II; Hastings, Encyclopedia of Religion and Ethics; Murray, Illustrated Bible Dictionary; EB, under the word "Altar"; EPC, chapter 6. The discussions in the ordinary works of reference must be used with caution for the reason given in I above.<P>Harold M. Wiener<P><b>I. IN WORSHIP: TABERNACLE AND TEMPLES</b><P class="in15">1. Patriarchal Altars<P class="in15">2. Sacred Sites<P class="in15">3. Pre-Tabernacle Altars<p><b>II. THE ALTAR OF BURNT OFFERING; BRAZEN ALTAR</b><P class="in15">1. Altar before the Tabernacle<P class="in15">2. Its History<P class="in15">3. Altar of Solomon’s Temple<P class="in15">4. Altar of Ezekiel’s Temple<P class="in15">5. Altar of Second Temple<P class="in15">6. Altar of Herod’s Temple<P><b>III. THE ALTAR OF INCENSE (GOLDEN ALTAR)</b><P class="in15">1. In the Tabernacle<P class="in15">2. Mode of Burning Incense<P class="in15">3. In Solomon’s Temple and Later<P class="in15">4. In Herod’s Temple<P class="in15">5. Symbolism of Incense Burning<P><b>B. IN WORSHIP</b><P>I. In Worship: Tabernacle and Temples.<P>In the literature of the Bible, sacrifices are prior to altars, and altars prior to sacred buildings. Their first mention is in the case of the altar built by Noah after the Flood (<a onClick="return mV(\'Gen\',8,20);">Ge 8:20</a>).<P>1. Patriarchal Altars:<P>The next is the altar built at the place of Shechem, by which Abraham formally took possession, on behalf of his descendants, of the whole land of Canaan (<a onClick="return mV(\'Gen\',12,7);">Ge 12:7</a>). A second altar was built between Bethel and Ai (<a onClick="return mV(\'Gen\',12,8);">Ge 12:8</a>). To this the patriarch returned on his way from Egypt (<a onClick="return mV(\'Gen\',13,4);">Ge 13:4</a>). His next place of sacrifice was Hebron (<a onClick="return mV(\'Gen\',13,18);">Ge 13:18</a>); and tradition still professes to show the place where his altar stood. A subsequent altar was built on the top of a mountain in the land of Moriah for the sacrifice of Isaac (<a onClick="return mV(\'Gen\',22,9);">Ge 22:9</a>).<P>2. Sacred Sites:<P>Each of these four spots was the scene of some special revelation of Yahweh; possibly to the third of them (Hebron) we may attribute the memorable vision and covenant of <a onClick="return mV(\'Gen\',15,\'1-\');">Ge 15</a>. These sites became, in after years, the most venerated and coveted perquisites of the nation, and fights for their possession largely determined its history. To them Isaac added an altar at
