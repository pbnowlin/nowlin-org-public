Beersheba (<a onClick="return mV(\'Gen\',26,25);">Ge 26:25</a>), probably a re-erection, on the same site, of an altar built by Abraham, whose home for many years was at Beersheba. Jacob built no new altars, but again and again repaired those at Shechem and Bethel. On one occasion he offered a sacrifice on one of the mountains of Gilead, but without mention of an altar (<a onClick="return mV(\'Gen\',31,54);">Ge 31:54</a>). There were thus four or five spots in Canaan associated at once with the worship of Yahweh, and the name of their great ancestor, which to Hebrews did not lose their sanctity by the passage of time, namely, Shechem, Bethel, Hebron, Moriah and Beersheba.<P>3. Pre-Tabernacle Altars:<P>The earliest provision for an altar as a portion of a fixed establishment of religion is found in <a onClick="return mV(\'Exd\',20,\'24-26\');">Ex 20:24-26</a>, immediately after the promulgation of the Decalogue. Altars are commanded to be made of earth or of unhewn stone, yet so as to have, not steps, but only slopes for ascent to the same—the injunction implying that they stood on some elevation (see <a href="./study/isbe/search.html?string=ALTAR">ALTAR</a>, sec A, above). Before the arrival at Sinai, during the war with Amalek, Moses had built an emergency altar, to which he gave the name Yahweh-Nissi (<a onClick="return mV(\'Exd\',17,15);">Ex 17:15</a>). This was probably only a memorial altar (compare the altar ‘Ed in <a onClick="return mV(\'Jos\',22,21);">Jos 22:21</a> f.). At Sinai took place the great crisis in Israel’s national history. It was required that the covenant about to be made with Yahweh should be ratified with sacrificial blood; but before Moses could sprinkle the Book of the Covenant and the people who covenanted (<a onClick="return mV(\'Exd\',24,6);">Ex 24:6</a>; compare <a onClick="return mV(\'Hbr\',9,19);">He 9:19</a>), it was necessary that an altar should be built for the sacrificial act. This was done "under the mount," where, beside the altar, were reared twelve pillars, emblematic of the twelve tribes of Israel (<a onClick="return mV(\'Exd\',24,4);">Ex 24:4</a>). In connection with the tabernacle and the successive temples there were two altars—the Altar of Burnt Offering (the altar by preeminence, <a onClick="return mV(\'Eze\',43,13);">Eze 43:13</a>), and the Altar of Incense. Of these it is now necessary to speak more particularly.<P>II. The Altar of Burnt Offering (The Brazen Altar)<P>(mizbach ha-‘olah), (mizbach ha-nechosheth).—(By "brass" throughout understand "bronze.")<P>1. Altar before the Tabernacle:<P>The altar which stood before the tabernacle was a portable box constructed of acacia wood and covered on the outside with plates of brass (<a onClick="return mV(\'Exd\',27,1);">Ex 27:1</a> f.). "Hollow with planks," is its definition (<a onClick="return mV(\'Exd\',27,8);">Ex 27:8</a>). It was five cubits long, five cubits broad, and three cubits high; on the ordinary reckoning, about 7 1/2 ft. on the horizontal square, and 4 1/2 ft. in height (possibly less; see <a href="./study/isbe/search.html?string=CUBIT">CUBIT</a>). On the "grating of network of brass" described as around and half-way up the altar (verses <a onClick="return mV(\'Exd\',27,4,5);">4,5</a>), see <a href="./study/isbe/search.html?string=GRATING">GRATING</a>. Into the corners of this grating, on two sides, rings were riveted, into which the staves were inserted by which the Ark was borne (see <a href="./study/isbe/search.html?string=STAVES">STAVES</a>). For its corner projections, see <a href="./study/isbe/search.html?string=HORNS+OF+THE+ALTAR">HORNS OF THE ALTAR</a>. The prohibition of steps in <a onClick="return mV(\'Exd\',20,26);">Ex 20:26</a> and the analogy of later altars suggest that this small altar before the tabernacle was made to stand on a base or platform, led up to by a slope of earth. The right of sanctuary is mentioned in <a onClick="return mV(\'Exd\',21,14);">Ex 21:14</a>. For the utensils connected with the altar, see <a href="./study/isbe/search.html?string=PAN">PAN</a>; <a href="./study/isbe/search.html?string=SHOVEL">SHOVEL</a>; <a href="./study/isbe/search.html?string=BASIN">BASIN</a>; <a href="./study/isbe/search.html?string=FLESH-HOOK">FLESH-HOOK</a>; <a href="./study/isbe/search.html?string=CENSER">CENSER</a>. All these utensils were made of brass.<P>2. Its History:<P>The history of the altar before the tabernacle was that of the tabernacle itself, as the two were not parted during its continuance (see <a href="./study/isbe/search.html?string=TABERNACLE">TABERNACLE</a>). Their abolition did not take place till Solomon’s temple was ready for use, when the great high place at Gibeon (<a onClick="return mV(\'1Ki\',3,4);">1Ki 3:4</a>) was dismantled, and the tabernacle and its holy vessels were brought to the new temple (<a onClick="return mV(\'1Ki\',8,4);">1Ki 8:4</a>). Another altar had meanwhile been raised by David before the tabernacle he had made on Zion, into which the Ark of the Covenant was moved (<a onClick="return mV(\'1Ch\',15,1);">1Ch 15:1</a>; <a onClick="return mV(\'1Ch\',16,1);">16:1</a>). This would be a duplicate of that at Gibeon, and would share its supersession at the erection of the first temple.<P>3. Altar of Solomon’s Temple:<P>In Solomon’s temple the altar was considerably enlarged, as was to be expected from the greater size of the building before which it stood. We are indebted to the Chronicler for its exact dimensions (<a onClick="return mV(\'2Ch\',4,1);">2Ch 4:1</a>). It formed a square of twenty cubits, with an elevation of ten cubits (30 x 30 x 15 ft.; or somewhat less). It is described as "an altar of brass" (<a onClick="return mV(\'2Ch\',4,1);">2Ch 4:1</a>), or "brazen altar" (<a onClick="return mV(\'1Ki\',8,64);">1Ki 8:64</a>; <a onClick="return mV(\'2Ch\',7,7);">2Ch 7:7</a>; compare <a onClick="return mV(\'2Ki\',16,14);">2Ki 16:14</a>), either as being, like its predecessors, encased in brass, or, as others think, made wholly of brass. It was not meant to be portable, but that the altar itself was movable is shown by the fact of Ahaz having it removed (<a onClick="return mV(\'2Ki\',16,14);">2Ki 16:14</a>). Further details of its structure are not given. The altar stood in "the middle of the court that was before the house," but proved too small to receive the gifts on the day of the temple’s dedication (<a onClick="return mV(\'1Ki\',8,64);">1Ki 8:64</a>; <a onClick="return mV(\'2Ch\',7,7);">2Ch 7:7</a>). It remained, however, the center of Israelite worship for 2 1/2 centuries, till Ahaz removed it from the forefront of the house, and placed it on the northern side of is Damascene altar (<a onClick="return mV(\'2Ki\',16,14);">2Ki 16:14</a>). This indignity was repaired by Hezekiah (compare <a onClick="return mV(\'2Ki\',18,22);">2Ki 18:22</a>), and the altar assumed its old place in the temple service till its destruction by Nebuchadnezzar in 586 BC.<P>4. Altar of Ezekiel’s Temple:<P>The altar of Ezekiel’s ideal temple was, as planned, a most elaborate structure, the cubit used for this purpose being that of "a cubit and an handbreadth" (<a onClick="return mV(\'Eze\',43,13);">Eze 43:13</a>), or the large cubit of history (see CUBIT). The paragraph describing it (<a onClick="return mV(\'Eze\',43,\'13-17\');">Eze 43:13-17</a>) is very specific, though uncertainty rests on the meaning of some of the details. The altar consisted of four stages lying one above another, gradually diminishing in size till the hearth was reached upon which the fire was literal. This was a square of twelve cubits (18 ft.), from the corners of which 4 horns projected upward (<a onClick="return mV(\'Eze\',43,15);">Eze 43:15</a>). The base or lowest stage was one cubit in height, and had a border round about, half a cubit high (<a onClick="return mV(\'Eze\',43,13);">Eze 43:13</a>); the remaining stages were two, four, and four cubits high respectively (<a onClick="return mV(\'Eze\',43,14,15);">Eze 43:14-15</a>); the horns may have measured another cubit (thus, the Septuagint). Each stage was marked by the inlet of one cubit (<a onClick="return mV(\'Eze\',43,13,14);">Eze 43:13-14</a>). The basement was thus, apparently, a square of eighteen cubits or 27 ft. The word "bottom" (literally, "bosom") in Ezekiel’s description is variously interpreted, some regarding it as a "drain" for carrying off the sacrificial blood, others identifying it with the "basement." On its eastern face the altar had steps looking toward the east (<a onClick="return mV(\'Eze\',43,17);">Eze 43:17</a>)—a departure from the earlier practice (for the reason of this, compare Perowne’s article "Altar" in Smith, Dictionary of the Bible).<P>5. Altar of Second Temple:<P>Of the altar of the second temple no measurements are given. It is told only that it was built prior to the temple, and was set upon its base (<a onClick="return mV(\'Ezr\',3,3);">Ezr 3:3</a>), presumably on the Cakhra stone—the ancient site.<P>6. Altar of Herod’s Temple:<P>In Herod’s temple a difficulty is found in harmonizing the accounts of the Mishna and Josephus as to the size of the altar. The latter gives it as a square of fifty cubits (BJ, V, v, 6). The key to the solution probably lies in distinguishing between the structure of the altar proper (thirty-two cubits square), and a platform of larger area (fifty cubits square = 75 ft.) on which it stood. When it is remembered that the Cakhra stone <span class="noTag">is</span> 56 ft in length and 42 ft. in width, it is easy to see that it might form a portion of a platform built up above and around it to a level of this size. The altar, like that of Ezekiel’s plan, was built in diminishing stages; in the Mishna, one of one cubit, and three of five cubits in height, the topmost stage measuring twenty-six cubits square, or, with deduction of a cubit for the officiating priests, twenty-four cubits. Josephus, on the other hand, gives the height at fifteen cubits. The altar, as before, had four horns. Both Josephus and the Mishna state that the altar was built of unhewn stones. The ascent, thirty-two cubits long and sixteen broad, likewise of unhewn stone, was on the south side. See further, TEMPLE, HEROD’S. It is of this altar that the words were spoken, "Leave there thy gift before the altar, and go thy way, first be reconciled to thy brother, and then come and offer thy gift" (<a onClick="return mV(\'Mat\',5,24);">Mt 5:24</a>).<P>III. The Altar of Incense (Golden Altar)<P>(mizbach ha-qetoreth), (mizbach ha-zahabh).<P>1. In the Tabernacle:<P>This was a diminutive table of acacia overlaid with gold, the upper surface of which was a square of one cubit, and its height two cubits, with an elevated cornice or crown around its top (<a onClick="return mV(\'Exd\',30,2);">Ex 30:2</a> f.). Like the great altar of burnt offering, it was in the category of "most holy" things (<a onClick="return mV(\'Exd\',30,10);">Ex 30:10</a>); a distinction which gave it a right to a place in the inner room of the cella or holy of holies. Hence, in <a onClick="return mV(\'1Ki\',6,22);">1Ki 6:22</a>, it is said to "belong to the oracle," and in <a onClick="return mV(\'Hbr\',9,4);">Heb 9:4</a> that chamber is said to have the "altar of incense." It did not, however, actually stand there, but in the outer chamber, "before the veil" (<a onClick="return mV(\'Exd\',40,26);">Ex 40:26</a>). The reason for this departure from the strict rule of temple ritual was that sweet incense was to be burnt daily upon it at the offering of every daily sacrifice, the lamps being then lit and extinguished (compare <a onClick="return mV(\'Num\',28,3);">Nu 28:3</a>f; <a onClick="return mV(\'Exd\',30,7,8);">Ex 30:7-8</a>), so that a cloud of smoke might fill the inner chamber at the moment when the sacrificial blood was sprinkled (see <a href="./study/isbe/search.html?string=MERCY-SEAT">MERCY-SEAT</a>). To have burnt this incense within the veil would have required repeated entries into the holy of holies, which entries were forbidden (<a onClick="return mV(\'Lev\',16,2);">Le 16:2</a>). The altar thus stood immediately without the veil, and the smoke of the incense burnt upon it entered the inner chamber by the openings above the veil. For the material construction which admitted of this, see <a href="./study/isbe/search.html?string=HOLY+PLACE">HOLY PLACE</a>.<P>For other uses of the altar of incense see <a href="./study/isbe/search.html?string=HORNS+OF+THE+ALTAR">HORNS OF THE ALTAR</a>, where it is shown that at the time of the offerings of special sin offerings and on the day of the annual fast its horns were sprinkled with blood. This, with the offering of incense upon it, were its only uses, as neither meal offerings might be laid upon it, nor libations of drink offerings poured thereon (<a onClick="return mV(\'Exd\',30,9);">Ex 30:9</a>). The Tamiyd, or standing sacrifice for Israel, was a whole burnt offering of a lamb offered twice daily with its meal offering, accompanied with a service of incense.<P>2. Mode of Burning Incense:<P>It is probable that the censers in use at the time of the construction of this altar and after were in shape like a spoon or ladle (see <a href="./study/isbe/search.html?string=SHEWBREAD+TABLE+OF">SHEWBREAD, TABLE OF</a>), which, when filled with live coals from the great altar, were carried within the sanctuary and laid upon the altar of incense (<a onClick="return mV(\'Lev\',16,12);">Le 16:12</a>). The incense-sticks, broken small, were then placed upon the coals. The narrative of the deaths of Aaron’s sons, Nadab and Abihu, is thus made intelligible, the fire in their censers not having been taken from the great altar.<P>3. In Solomon’s Temple and Later:<P>The original small altar made by Moses was superseded by one made by Solomon. This was made of cedar wood, overlaid with gold (<a onClick="return mV(\'1Ki\',6,20,22);">1Ki 6:20, 22</a>; <a onClick="return mV(\'1Ki\',7,48);">7:48</a>; <a onClick="return mV(\'1Ki\',9,25);">9:25</a>; <a onClick="return mV(\'2Ch\',4,19);">2Ch 4:19</a>); hence, was called the "golden altar." This was among "all the vessels of the house of God, great and small," which Nebuchadnezzar took to Babylon (<a onClick="return mV(\'2Ch\',36,18);">2Ch 36:18</a>). As a consequence, when Ezekiel drew plans for a new temple, he gave it an incense altar made wholly of wood and of larger dimensions than before (<a onClick="return mV(\'Eze\',41,22);">Eze 41:22</a>). It had a height of three cubits and a top of two cubits square. There was an incense altar likewise in the second temple. It was this altar, probably plated with gold, which Antiochus Epiphanes removed (1Macc 1:21), and which was restored by Judas Maccabeus (1Macc 4:49). (On critical doubts as to the existence of the golden altar in the first and second temples, compare POT, 323.)<P>4. In Herod’s Temple:<P>That the Herodian temple also had its altar of incense we know from the incident of Zacharias having a vision there of "an angel...standing on the right side of the altar of incense" when he went into the temple of the Lord to burn incense (<a onClick="return mV(\'Luk\',1,11);">Lu 1:11</a>). No representation of such an altar appears on the arch of Titus, though it is mentioned by Josephus (BJ, V, v, 5). It was probably melted down by John during the course of the siege (V, xiii, 6).<P>5. Symbolism of Incense Burning:<P>In the apocalypse of John, no temple was in the restored heaven and earth (<a onClick="return mV(\'Rev\',21,22);">Re 21:22</a>), but in the earlier part of the vision was a temple (<a onClick="return mV(\'Rev\',14,17);">Re 14:17</a>; <a onClick="return mV(\'Rev\',15,6);">15:6</a>) with an altar and a censer (<a onClick="return mV(\'Rev\',8,3);">Re 8:3</a>). It is described as "the golden altar which was before the throne," and, with the smoke of its incense, there went up before God the prayers of the saints. This imagery is in harmony with the statement of Luke that as the priests burnt incense, "the whole multitude of the people were praying without at the hour of incense" (<a onClick="return mV(\'Luk\',1,10);">Lu 1:10</a>). Both history and prophecy thus attest the abiding truth that salvation is by sacrificial blood, and is made available to men through the prayers of saints and sinners offered by a great High Priest.``17';
isbe[425]='Altogether`ol-too-geth\'-er: Representing five Hebrew and three Greek originals, which variously signify<P>(1) "together"; i.e. all, e.g. \'all men, high and low, weighed together in God\'s balance are lighter than vanity\' (<a onClick="return mV(\'Psa\',62,9);">Ps 62:9</a>); so also <a onClick="return mV(\'Psa\',53,3);">Ps 53:3</a>; <a onClick="return mV(\'Jer\',10,8);">Jer 10:8</a>.<P>(2) "all": so the Revised Version (British and American), <a onClick="return mV(\'Isa\',10,8);">Isa 10:8</a>: "Are not my princes all of them kings?"<P>(3) "with one accord have broken the yoke"; so the Revised Version (British and American), <a onClick="return mV(\'Jer\',5,5);">Jer 5:5</a>.<P>(4) "completely," "entirely," "fully": "so as not to destroy him altogether" (<a onClick="return mV(\'2Ch\',12,12);">2Ch 12:12</a>; compare <a onClick="return mV(\'Gen\',18,21);">Ge 18:21</a>; <a onClick="return mV(\'Exd\',11,1);">Ex 11:1</a>; <a onClick="return mV(\'Psa\',39,5);">Ps 39:5</a>; <a onClick="return mV(\'Jer\',30,11);">Jer 30:11</a> the King James Version; compare the Revised Version (British and American)).<P>(5) "wholly": "altogether born in sins," <a onClick="return mV(\'Jhn\',9,34);">Joh 9:34</a>.<P>(6) In <a onClick="return mV(\'1Cr\',5,10);">1Co 5:10</a> the Revised Version (British and American) rendered "at all"; <a onClick="return mV(\'1Cr\',9,10);">1Co 9:10</a> "assuredly."<P>(7) A passage of classic difficulty to translators is <a onClick="return mV(\'Act\',26,29);">Ac 26:29</a>, where "altogether" in the Revised Version (British and American) is rendered "with much," Greek en megalo (en pollo). See <a href="./study/isbe/search.html?string=ALMOST">ALMOST</a>. Many of the instances where "altogether" occurs in the King James Version become "together" in the Revised Version (British and American). Used as an adjective in <a onClick="return mV(\'Psa\',39,5);">Ps 39:5</a> ("altogether vanity").``139';
isbe[426]='Alush`a\'-lush (\'alush): A desert camp of the Israelites between Dophkah and Rephidim (<a onClick="return mV(\'Num\',33,13,14);">Nu 33:13,14</a>). The situation is not certainly known.`<a href="./study/isbe/search.html?string=WANDERINGS+OF+ISRAEL">WANDERINGS OF ISRAEL</a>`1';
isbe[427]='Alvah`al\'-va (\'alwah): A chief (the King James Version duke) of Edom (<a onClick="return mV(\'Gen\',36,40);">Ge 36:40</a>), called "Aliah" in <a onClick="return mV(\'1Ch\',1,51);">1Ch 1:51</a>. Probably the same as Alvan, or Ahan, son of Shobal son of Seir (<a onClick="return mV(\'Gen\',36,23);">Ge 36:23</a>; <a onClick="return mV(\'1Ch\',1,40);">1Ch 1:40</a>).``1';
isbe[428]='Alvan`al\'-van (\'alwan, "tall"?): A son of Shobal, the Horite (<a onClick="return mV(\'Gen\',36,23);">Ge 36:23</a>). In <a onClick="return mV(\'1Ch\',1,40);">1Ch 1:40</a> the name is written Alian, Septuagint Olam. It is probably the same as Alvah of <a onClick="return mV(\'Gen\',36,23);">Ge 36:23</a>, which appears in <a onClick="return mV(\'1Ch\',1,51);">1Ch 1:51</a> as Aliah.``1';
isbe[429]='Alway; Always`ol\'-way, ol\'-waz (archaic and poetic): Properly applied to acts or states perpetually occurring, but not necessarily continuous. In Hebrew, most frequently, tamiydh. In Greek dia pantos, ordinarily expresses continuity. In <a onClick="return mV(\'Mat\',28,20);">Mt 28:20</a> "alway" the King James Version, the Revised Version (British and American) "always," translation Greek pasas tas hemeras, "all the days," corresponding to the Hebrew idiom similarly rendered in <a onClick="return mV(\'Deu\',5,29);">De 5:29</a>; <a onClick="return mV(\'Deu\',6,24);">6:24</a>; <a onClick="return mV(\'Deu\',11,1);">11:1</a>; <a onClick="return mV(\'Deu\',28,33);">28:33</a>; <a onClick="return mV(\'1Ki\',11,36);">1Ki 11:36</a>, etc. Greek aei in <a onClick="return mV(\'Act\',7,51);">Ac 7:51</a>; <a onClick="return mV(\'2Cr\',6,10);">2Co 6:10</a>; <a onClick="return mV(\'1Pe\',3,15);">1Pe 3:15</a>, means "at every and any time."``1';
isbe[430]='Amad`a\'-mad (\'am\'adh): A town in Northern Palestine, which fell to the tribe of Asher in the division of the land (<a onClick="return mV(\'Jos\',19,26);">Jos 19:26</a>). The modern ruin \'Amud near Accho may be the site.``1';
isbe[431]='Amadatha; Amadathus`a-mad\'-a-tha, a-mad\'-a-thus (Additions to Es 12:6).`<a href="./study/isbe/search.html?string=AMAN">AMAN</a>; <a href="./study/isbe/search.html?string=HAMMEDATHA">HAMMEDATHA</a>`1';
isbe[432]='Amain`a-man\' (translated from the Greek eis phugen hormesan, "they rushed to flight"): The word is composed of the prefix "a" and the word "main," meaning "force." The expression is used by Milton, Parker, et al., but in Biblical literature found only in 2Macc 12:22 where used to describe the flight of Timotheus and his army after he suffered defeat at the hands of Judas Maccabee ("They fled amain," i.e. violently and suddenly).``1';
isbe[433]='Amal`a\'-mal (\'amal, "toiler"): A son of Helem of the tribe of Asher (<a onClick="return mV(\'1Ch\',7,35);">1Ch 7:35</a>).``1';
isbe[434]='Amalek`am\'-a-lek (\'amaleq): The son, by his concubine Timna, of Eliphaz, the eldest son of Esau. He was one of the chiefs (the King James Version dukes) of Edom (<a onClick="return mV(\'Gen\',36,12,16);">Ge 36:12, 16</a>).`<a href="./study/isbe/search.html?string=AMALEKITE">AMALEKITE</a>`1';
isbe[435]='Amalek; Amalekite`am\'-a-lek, a-mal\'-e-kit, am\'-a-lek-it (\'amaleq, \'amaleqi): A tribe dwelling originally in the region south of Judah, the wilderness of et-Tih where the Israelites came into conflict with them. They were nomads as a people dwelling in that tract would naturally be. When they joined the Midianites to invade Israel they came "with their cattle and their tents" (<a onClick="return mV(\'Jdg\',6,\'3-5\');">Jud 6:3-5</a>). They are not to be identified with the descendants of Esau (<a onClick="return mV(\'Gen\',36,12,16);">Ge 36:12, 16</a>) because they are mentioned earlier, in the account of the invasion of Chedorlaomer (<a onClick="return mV(\'Gen\',14,7);">Ge 14:7</a>) and in Balaam\'s prophecy (<a onClick="return mV(\'Num\',24,20);">Nu 24:20</a>) Amalek is called "the first of the nations," which seems to refer to an early existence. We are uncertain of their origin, for they do not appear in the list of nations found in <a onClick="return mV(\'Gen\',10,\'1-\');">Ge 10</a>. They do not seem to have had any relationship with the tribes of Israel, save as, we may surmise, some of the descendants of Esau were incorporated into the tribe. It is probable that they were of Semitic stock though we have no proof of it.<P>The first contact with Israel was at Rephidim, in the wilderness of Sinai, where they made an unprovoked attack and were defeated after a desperate conflict (<a onClick="return mV(\'Exd\',17,\'8-13\');">Ex 17:8-13</a>; <a onClick="return mV(\'Deu\',25,17,18);">De 25:17-18</a>). On account of this they were placed under the ban and Israel was commanded to exterminate them (<a onClick="return mV(\'Deu\',25,19);">De 25:19</a>; <a onClick="return mV(\'1Sa\',15,2,3);">1Sa 15:2-3</a>). The next encounter of the two peoples was when the Israelites attempted to enter Canaan from the west of the Dead Sea. The spies had reported that the Amalekites were to be found in the south, in connection with the Hittites, Jebusites and Amorites (<a onClick="return mV(\'Num\',13,29);">Nu 13:29</a>). The Israelites at first refused to advance, but later determined to do so contrary to the will of God and the command of Moses. They were met by Amalek and the Canaanites and completely defeated (<a onClick="return mV(\'Num\',14,\'39-45\');">Nu 14:39-45</a>). Amalek is next found among the allies of Moab in their attack upon Israel in the days of Eglon (<a onClick="return mV(\'Jdg\',3,13);">Jud 3:13</a>). They were also associated with the Midianites in their raids upon Israel (<a onClick="return mV(\'Jdg\',6,3);">Jud 6:3</a>), and they seemed to have gained a foothold in Ephraim, or at least a branch of them, in the hill country (<a onClick="return mV(\'Jdg\',5,14);">Jud 5:14</a>; <a onClick="return mV(\'Jdg\',12,15);">12:15</a>), but it is evident that the great body of them still remained in their old habitat, for when Saul made war upon them he drove them toward Shur in the wilderness toward Egypt (<a onClick="return mV(\'1Sa\',15,\'1-9\');">1Sa 15:1-9</a>). David also found them in the same region (<a onClick="return mV(\'1Sa\',27,8);">1Sa 27:8</a>; <a onClick="return mV(\'1Sa\',30,1);">30:1</a>). After this they seem to have declined, and we find, in the days of Hezekiah, only a remnant of them who were smitten by the Simeonites at Mount Seir (<a onClick="return mV(\'1Ch\',4,\'41-43\');">1Ch 4:41-43</a>). They are once mentioned in Psalms in connection with other inveterate enemies of Israel (<a onClick="return mV(\'Psa\',83,7);">Ps 83:7</a>). The hatred Inspired by the Amalekites is reflected in the passages already mentioned which required their utter destruction. Their attack upon them when they were just escaped from Egypt and while they were struggling through the wilderness made a deep impression upon the Israelites which they never forgot, and the wrath of David upon the messenger who brought him news of the death of Saul and Jonathan, declaring himself to be the slayer of Saul, was no doubt accentuated by his being an Amalekite (<a onClick="return mV(\'2Sa\',1,\'1-16\');">2Sa 1:1-16</a>).``138';
isbe[436]='Amam`a\'-mam (\'amam): An unidentified town in Southern Palestine, which fell to Judah In the allotment of the land; occurs only in <a onClick="return mV(\'Jos\',15,26);">Jos 15:26</a>.``1';
isbe[437]='Aman`a\'-man (Aman; Codex Vaticanus reads Adam): Tobit 14:10; Additions to <span class="noTag">Esther 12:6; 16:10,17</span>, probably in each case for Haman, the arch-enemy of the Jews in the canonical Book of Esther (compare <a onClick="return mV(\'Est\',3,1);">Es 3:1</a> with <span class="noTag">Additions to Esther 12:6</span>). In <span class="noTag">Additions to Esther (16:10)</span> Aman is represented as a Macedonian, in all other points corresponding to the Haman of the Book of Esther.``1';
isbe[438]='Amana`a-ma\'-na, (\'amanah): A mountain mentioned in <a onClick="return mV(\'Sgs\',4,8);">So 4:8</a> along with Lebanon, Senir and Hermon. The name probably means the "firm," or "constant." "From the top of Amana" is mistranslated by the Septuagint apo arches pisteos. The Amana is most naturally sought in the Anti-Lebanon, near the course of the river Abana, or Amana (see <a href="./study/isbe/search.html?string=ABANAH">ABANAH</a>). Another possible identification is with Mt. Amanus in the extreme north of Syria.``1';
isbe[439]='Amariah`am-a-ri\'-a (\'amaryah and \'amaryahu, "the Lord has said"; compare HPN,180,285).<P>(1) A Levite in the line of Aaron-Eleazar; a son of Meraioth and grandfather of Zadok (<a onClick="return mV(\'1Ch\',6,7,52);">1Ch 6:7, 52</a>) who lived in David\'s time. Compare Zadok (<a onClick="return mV(\'2Sa\',15,27);">2Sa 15:27</a>, etc.) also Ant, VIII, i, 3 and X, viii, 6.<P>(2) A Levite in the line of Kohath-Hebron referred to in <a onClick="return mV(\'1Ch\',23,19);">1Ch 23:19</a> and <a onClick="return mV(\'1Ch\',24,23);">24:23</a> at the time when David divided the Levites into courses.<P>(3) A Levite in the line of Aaron-Eleazar; a son of Azariah who "executed the priest\'s office in the house that Solomon built" (<a onClick="return mV(\'1Ch\',6,10);">1Ch 6:10</a> f.). Compare <a onClick="return mV(\'Ezr\',7,3);">Ezr 7:3</a> where in the abbreviated list this Amariah is mentioned as an ancestor of Ezra. See <a href="./study/isbe/search.html?string=AMARIAS">AMARIAS</a> (1Esdras 8:2; 2Esdras 1:2) and number (4) of this article<P>(4) Chief priest and judge "in all matters of Yahweh" appointed by Jehoshaphat (<a onClick="return mV(\'2Ch\',19,11);">2Ch 19:11</a>). Possibly identical with Amariah, number (3).<P>(5) A descendant of Judah in the line of Perez and an ancestor of Ataiah who lived in Jerusalem after the Babylonian exile (<a onClick="return mV(\'Neh\',11,4);">Ne 11:4</a>). Compare Imri (<a onClick="return mV(\'1Ch\',9,4);">1Ch 9:4</a>) and number (7) of this article, which Amariah seems to be of the same family,<P>(6) A Levite and an assistant of Kore who was appointed by Hezekiah to distributed the "oblations of Yahweh" to their brethren (<a onClick="return mV(\'2Ch\',31,15);">2Ch 31:15</a>).<P>(7) A son of Bani who had married a foreign woman (<a onClick="return mV(\'Ezr\',10,42);">Ezr 10:42</a>). See number (5) of this article<P>(8) A priest who with Nehemiah sealed the covenant (<a onClick="return mV(\'Neh\',10,3);">Ne 10:3</a>); he had returned to Jerusalem with Zerubbabel (<a onClick="return mV(\'Neh\',12,2);">Ne 12:2</a>) and was the father of Jehohanan (compare Hanani, <a onClick="return mV(\'Ezr\',10,20);">Ezr 10:20</a>), priest at the time of Joiakim (<a onClick="return mV(\'Neh\',12,13);">Ne 12:13</a>). Compare Immer (<a onClick="return mV(\'Ezr\',2,37);">Ezr 2:37</a>; <a onClick="return mV(\'Ezr\',10,20);">10:20</a>; <a onClick="return mV(\'Neh\',7,40);">Ne 7:40</a>) and also Emmeruth (the King James Version "Meruth," 1Esdras 5:24).<P>(9) An ancestor of Zephaniah, the prophet (<a onClick="return mV(\'Zep\',1,1);">Ze 1:1</a>).``16';
isbe[440]='Amarias`am-a-ri\'-as (A, Amarias; B, Amartheias) = Amariah <span class="noTag">number</span> 3</a>: An ancestor of Ezra (1Esdras 8:2; 2Esdras 1:2).``1';
isbe[441]='Amarna, Tell El-`tel-el-a-mar\'-na.`<a href="./study/isbe/search.html?string=TELL+EL+AMARNA">TELL EL-AMARNA</a>`1';
isbe[442]='Amasa`a-ma\'-sa (\'amasa\', or read \'ammishai, i.e. \'am yishai, "people of Jesse"): The form \'amasa\', is based upon a mistaken etymology (from =\' amac "to burden").<P>(1) According to <a onClick="return mV(\'2Sa\',17,25);">2Sa 17:25</a>, Amasa is the son of Abigail, the sister of Zeruiah and David, and Ithra, an Israelite; but another source, <a onClick="return mV(\'1Ch\',2,17);">1Ch 2:17</a>, calls his father Jether the Ishmaelite. He was a nephew of David and a cousin of Absalom, who made him commander of the army of rebellion. When the uprising had been quelled, David, in order to conciliate Amasa, promised him the position held by Joab; the latter had fallen from favor (<a onClick="return mV(\'2Sa\',19,13);">2Sa 19:13</a>f). When a new revolt broke out under Sheba, the son of Bichri (<a onClick="return mV(\'2Sa\',20,\'1-\');">2Sa 20</a>), Amasa was entrusted with the task of assembling the men of Judah. But Joab was eager for revenge upon the man who had obtained the office of command that he coveted. When Amasa met Joab at Gibeon, the latter murdered him while pretending to salute (<a onClick="return mV(\'2Sa\',20,\'8-10\');">2Sa 20:8-10</a>; <a onClick="return mV(\'1Ki\',2,5);">1Ki 2:5</a>).<P>(2) Son of Hadlai, of the Bene \'Ephrayim ("Children of Ephraim"), who, obeying the words of the prophet Oded, refused to consider as captives the Judeans who had been taken from Ahaz, king of Judah, by the victorious Israelites under the leadership of Pekah (<a onClick="return mV(\'2Ch\',28,12);">2Ch 28:12</a>).``197';
isbe[443]='Amasai`a-ma\'-si (\'amasay, perhaps rather to be read \'ammishay; so Wellhausen, IJG, II,24,n.2):<P>(1) A name in the genealogy of Kohath, son of Elkanah, a Levite of the Kohathite family (compare <a onClick="return mV(\'1Ch\',6,25);">1Ch 6:25</a>; <a onClick="return mV(\'2Ch\',29,12);">2Ch 29:12</a>).<P>(2) Chief of the captains who met David at Ziklag and tendered him their allegiance. Some have identified him with Amasa and others with Abishai, who is called Abshai in <a onClick="return mV(\'1Ch\',11,20);">1Ch 11:20</a> m (compare <a onClick="return mV(\'1Ch\',18,12);">1Ch 18:12</a>). The difficulty is that neither Amasa nor Abishai occupied the rank of the chief of thirty according to the lists in <a onClick="return mV(\'2Sa\',23,\'1-\');">2Sa 23</a> and <a onClick="return mV(\'1Ch\',11,\'1-\');">1Ch 11</a>, the rank to which David is supposed to have appointed into (compare <a onClick="return mV(\'1Ch\',12,18);">1Ch 12:18</a>).<P>(3) One of the trumpet-blowing priests who greeted David when he brought back the Ark of the Covenant (compare <a onClick="return mV(\'1Ch\',15,24);">1Ch 15:24</a>).``1';
isbe[444]='Amashsai`a-mash\'-si \'amashcay, probably a textual error for \'amashay; the ("s") implies a reading \'-M-C-Y, based on a mistaken derivation from\'-M-C. The original reading may have been \'ammishay; compare <a href="./study/isbe/search.html?string=AMASAI">AMASAI</a>): Amashsai is a priestly name in the post-exilic list of inhabitants of Jerusalem (<a onClick="return mV(\'Neh\',11,13);">Ne 11:13</a>; Maasai, <a onClick="return mV(\'1Ch\',9,12);">1Ch 9:12</a>); the reading in Chronicles is ma\'asay, the King James Version "Maasiai," the Revised Version (British and American) "Maasai."``1';
isbe[445]='Amasiah`am-a-si\'-a (\'amacyah, "Yah bears"): One of the captains of Jehoshaphat (compare <a onClick="return mV(\'2Ch\',17,16);">2Ch 17:16</a>).``1';
isbe[446]='Amath; Amathis`a\'-math, am\'-a-this (1Macc 12:25).`<a href="./study/isbe/search.html?string=HAMATH">HAMATH</a>`1';
isbe[447]='Amatheis`am-a-the\'-is.`<a href="./study/isbe/search.html?string=EMATHEIS">EMATHEIS</a>`1';
isbe[448]='Amazed`a-mazd\':A term which illustrates the difficulty of expressing in one English word the wide range of startled emotion, wonder, astonishment, awe, covered, in the Old Testament, by four Hebrew words and in the New Testament by as many Greek words. Its Scripture originals range in meaning from amazement accompanied with terror and trembling to an astonishment full of perplexity, wonder, awe and joyous surprise. It is the word especially used to show the effect of Christ\'s miracles, teaching, character and Divine personality on those who saw and heard Him, and were made conscious of His supernatural power (<a onClick="return mV(\'Mat\',12,23);">Mt 12:23</a>: "All the multitudes were amazed"). The miracles of Pentecost and the Holy Spirit\'s bestowal of the gift of tongues produced the same universal wonder (<a onClick="return mV(\'Act\',2,7);">Ac 2:7</a>: "They were all amazed and marveled").``139';
isbe[449]='Amaziah`am-a-zi\'-a (\'amatsyah, \'amatsyahu, "Yahweh is mighty"; <a onClick="return mV(\'2Ki\',14,\'1-20\');">2Ki 14:1-20</a>; <a onClick="return mV(\'2Ch\',25,\'1-\');">2Ch 25</a>). Son of Jehoash, and tenth king of Judah. Amaziah had a peaceable accession at the age of 25. A depleted treasury, a despoiled palace and temple, and a discouraged people were among the consequences of his father\'s war with Hazael, king of Syria. When settled on the throne, Amaziah brought to justice the men who had assassinated his father. Amaziah verbal citation of <a onClick="return mV(\'Deu\',24,16);">De 24:16</a> in <a onClick="return mV(\'2Ki\',14,6);">2Ki 14:6</a>, forbidding the punishment of children for a father\'s offense, shows that the laws of this book were then known, and were recognized as authoritative, and, in theory, as governing the nation. His accession may be dated circa 812 (some put later).<P>1. The Edomite War:<P>The young king\'s plan for the rehabilitation of his people was the restoration of the kingdom\'s military prestige, so severely lowered in his father\'s reign. A militia army, composed of all the young men above 20 years of age, was first organized and placed upon a war footing (<a onClick="return mV(\'2Ch\',25,5);">2Ch 25:5</a>; the number given, 300,000, is not a reliable one). Even this not being considered a large enough force to effect the project, 100 talents of silver were sent to engage mercenary troops for the expedition from Israel. When these came, a man of God strongly dissuaded the king from relying on them (<a onClick="return mV(\'2Ch\',25,7);">2Ch 25:7</a> f.). When this was communicated to the soldiers, and they were sent back unemployed, it roused them to "fierce anger" (<a onClick="return mV(\'2Ch\',25,10);">2Ch 25:10</a>).<P>2. Its Occasion:<P>Amaziah\'s purpose in making these extensive preparations for war, in a time of profound peace, is clear to the southeast of Judah lay the Edomite state, with its capital at Petra. For many years Edom had been subject to Jehoshaphat, and a Hebrew "deputy" had governed it (<a onClick="return mV(\'1Ki\',22,47);">1Ki 22:47</a>). In the reign of his son and successor, Jehoram, a confederacy of Philistines, Arabians and Edomites took Libnah and made a raid on Jerusalem. A band of these penetrated the palace, which they plundered, abducted some women, and murdered all the young princes but the youngest (<a onClick="return mV(\'2Ch\',21,17);">2Ch 21:17</a>; <a onClick="return mV(\'2Ch\',22,1);">22:1</a>). The public commotion and distress caused by such an event may be seen reflected in the short oracle of the prophet Obadiah, uttered against Edom, if, with some, Obadiah\'s date is put thus early<P>3. The Victory in the Valley of Salt:<P>From that time "Edom...made a king over themselves" (<a onClick="return mV(\'2Ch\',21,8);">2Ch 21:8</a>), and for fifty years following were practically independent. It was this blot on Jerusalem and the good name of Judah that Amaziah determined to wipe out. The army of retaliation went forward, and after a battle in the Valley of Salt, south of the Dead Sea, in which they were the victors, moved on to Petra. This city lies in a hollow, shut in by mountains, and approached only by a narrow ravine, through which a stream of water flows. Amaziah took it "by storm" (such is Ewald\'s rendering of "by war," in <a onClick="return mV(\'2Ki\',14,7);">2Ki 14:7</a>). Great execution was done, many of the captives being thrown from the rock, the face of which is now covered with rock-cut tombs of the Greek-Roman age.<P>4. Apostasy and Its Punishment:<P>The campaign was thus entirely successful, but had evil results. Flushed with victory, Amaziah brought back the gods of Edom, and paid them worship. For this act of apostasy, he was warned of approaching destruction (<a onClick="return mV(\'2Ch\',25,\'14-17\');">2Ch 25:14-17</a>). Disquieting news soon came relating to the conduct of the troops sent back to Samaria. From Beth-horon in the south to the border of the northern state they had looted the villages and killed some of the country people who had attempted to defend their property (<a onClick="return mV(\'2Ch\',25,13);">2Ch 25:13</a>). To Amaziah\'s demand for reparation, Jehoash\'s answer was the contemptuous one of the well-known parable of the Thistle and the Cedar.<P>5. Battle of Beth-shemesh:<P>War was now inevitable. The kings "looked one another in the face," in the valley of Beth-shemesh, where there is a level space, suitable to the movements of infantry. Judah was utterly routed, and the king himself taken prisoner. There being no treasures in the lately despoiled capital, Jehoash contented himself with taking hostages for future good behavior, and with breaking down 400 cubits of the wall of Jerusalem at the northwest corner of the defense (<a onClick="return mV(\'2Ki\',14,13,14);">2Ki 14:13-14</a>; <a onClick="return mV(\'2Ch\',25,\'22-24\');">2Ch 25:22-24</a>).<P>6. Closing Years and Tragical End:<P>Amaziah\'s career as a soldier was now closed. He outlived Jehoash of Israel "fifteen years" (<a onClick="return mV(\'2Ki\',14,17);">2Ki 14:17</a>). His later years were spent in seclusion and dread, and had a tragical ending. The reason for his unpopularity is not far to seek. The responsibility for the war with Jehoash is by the inspired writer placed upon the shoulders of Amaziah (<a onClick="return mV(\'2Ki\',14,\'9-11\');">2Ki 14:9-11</a>). It was he who "would not hear." The quarrel between the kings was one which it was not beyond the power of diplomacy to remedy, but no brotherly attempt to heal the breach was made by either king. When the results of the war appeared, it could not be but that the author of the war should be called upon to answer for them. So deep was his disgrace and so profound the sense of national humiliation, that a party in the state determined on Amaziah\'s removal, so soon as there was another to take his place. The age of majority among the Hebrew kings was 16, and when Amaziah\'s son was of this age, the conspiracy against his life grew so strong and open that he fled to Lachish. Here he was followed and killed; his body being insultingly carried to Jerusalem on horses, and not conveyed in a litter or coffin (<a onClick="return mV(\'2Ki\',14,19,20);">2Ki 14:19-20</a>; <a onClick="return mV(\'2Ch\',25,27,28);">2Ch 25:27-28</a>). He was 54 years old and had reigned for 29 years. The Chronicler (<a onClick="return mV(\'2Ch\',26,1);">2Ch 26:1</a>) hardly conceals the popular rejoicings at the exchange of sovereigns, when Uzziah became king.<P>In <a onClick="return mV(\'2Ch\',25,28);">2Ch 25:28</a> is a copyist\'s error by which we read "in the city of Judah," instead of "in the city of David," as in the corresponding passage in Kings. The singular postscript to the record of Amaziah in <a onClick="return mV(\'2Ki\',14,22);">2Ki 14:22</a> is intended to mark the fact that while the port of Elath on the Red Sea fell before the arms, in turn, of Amaziah and of his son Uzziah, it was the latter who restored it to Judah, as a part of its territory. Amaziah is mentioned in the royal genealogy of <a onClick="return mV(\'1Ch\',3,12);">1Ch 3:12</a>, but not in that of <a onClick="return mV(\'Mat\',1,\'1-\');">Mt 1</a>. There is a leap here from Jehoram to Uzziah, Ahaziah, Jehoash and Amaziah being omitted.``17';
isbe[450]='Ambassador`am-bas\'-a-dor (mal\'akh, "messenger"; \'luts, "interpreter"; tsir, "to go"; hence a messenger; presbeuo, "to act as an ambassador," literally, to be older): An ambassador is an official representative of a king or government, as of Pharaoh (<a onClick="return mV(\'Isa\',30,4);">Isa 30:4</a>); of the princes of Babylon (<a onClick="return mV(\'2Ch\',32,31);">2Ch 32:31</a>); of Neco, king of Egypt (<a onClick="return mV(\'2Ch\',35,21);">2Ch 35:21</a>); of the messengers of peace sent by Hezekiah, king of Judah, to Sennacherib, king of Assyria (<a onClick="return mV(\'Isa\',33,7);">Isa 33:7</a>). The same Hebrew term is used of the messengers sent by Jacob to Esau (<a onClick="return mV(\'Gen\',32,3);">Ge 32:3</a>); by Moses to the king of Edom (<a onClick="return mV(\'Num\',20,14);">Nu 20:14</a>). For abundant illustration consult "Messenger" (mal\'akh) in any concordance. See <a href="./study/isbe/search.html?string=CONCORDANCE">CONCORDANCE</a>. The inhabitants of Gibeon made themselves pretended ambassadors to Joshua in order to secure by deceit the protection of a treaty ("covenant") (<a onClick="return mV(\'Jos\',9,4);">Jos 9:4</a>).<P>In the New Testament the term is used in a figurative sense. As the imprisoned representative of Christ at Rome Paul calls himself "an ambassador in chains" (<a onClick="return mV(\'Eph\',6,20);">Eph 6:20</a>); and in <a onClick="return mV(\'2Cr\',5,20);">2Co 5:20</a> includes, with himself, all ministers of the gospel, as "ambassadors...on behalf of Christ," commissioned by Him as their sovereign Lord, with the ministry of reconciling the world to God. The Bible contains no finer characterization of the exalted and spiritual nature of the minister\'s vocation as the representative of Jesus Christ, the King of kings, and Saviour of the world.``139';
isbe[451]='Ambassage`am\'-ba-saj (presbeia, "an embassy," a body of ambassadors on the message entrusted to them): Twice used by Christ<P>(1) in the parable of the Pounds, of the citizens who hated the nobleman and sent an ambassage, refusing to have him reign over them, thus illustrating those who willfully rejected His own spiritual sovereignty and kingdom (<a onClick="return mV(\'Luk\',19,14);">Lu 19:14</a>);<P>(2) of a weak king who sends to a stronger an ambassage to ask conditions of peace (<a onClick="return mV(\'Luk\',14,32);">Lu 14:32</a>). Not used elsewhere in the Bible.``1';
isbe[452]='Amber`am\'-ber.`<a href="./study/isbe/search.html?string=STONES+PRECIOUS">STONES, PRECIOUS</a>`1';
isbe[453]='Ambitious`am-bish\'-us (philotimeomai, "to be strongly desirous," "strive earnestly," "make it one\'s aim"): Given as a marginal reading in <a onClick="return mV(\'Rom\',15,20);">Ro 15:20</a> ("being ambitious to bring good tidings"), <a onClick="return mV(\'2Cr\',5,9);">2Co 5:9</a> ("We are ambitious, whether at home or absent, to be well-pleasing unto him"), and <a onClick="return mV(\'1Th\',4,11);">1Th 4:11</a> ("that ye be ambitious to be quiet").``1';
isbe[454]='Ambush`am\'-boosh (\'arabh, "to set an ambush"; ma\'arabh, "an ambush"): A military stratagem in which a body of men are placed in concealment to surprise an enemy unawares, or to attack a point when temporarily undefended. This stratagem was employed successfully by Joshua at Ai (<a onClick="return mV(\'Jos\',8,\'1-\');">Jos 8</a>). Jeremiah calls upon the Medes to "set up a standard against the walls of Babylon, make the watch strong, set the watchmen, prepare the ambushes" (<a onClick="return mV(\'Jer\',51,12);">Jer 51:12</a>).``1';
isbe[455]='Ambushment`am\'-boosh-ment (as above) has now disappeared in <a onClick="return mV(\'2Ch\',20,22);">2Ch 20:22</a>, where the Revised Version (British and American) gives for "ambushment" "liers-in-wait." It still remains in <a onClick="return mV(\'2Ch\',13,13);">2Ch 13:13</a> where both the King James Version and the Revised Version (British and American) render the Hebrew noun "ambushment."``1';
isbe[456]='Amen`a-men\' (in ritual speech and in singing a-men\', a\'men) (\'amen; amen, = "truly," "verily"): Is derived from the reflexive form of a verb meaning "to be firm," or "to prop." It occurs twice as a noun in <a onClick="return mV(\'Isa\',65,16);">Isa 65:16</a>, where we have (the King James Version, the Revised Version (British and American)) "God of truth." This rendering implies the pointing \'omen or \'emun i.e. "truth," or "faithfulness," a reading actually suggested by Cheyne and adopted by others. "Amen" is generally used as an adverb of assent or confirmation—fiat, "so let it be." In <a onClick="return mV(\'Jer\',28,6);">Jer 28:6</a> the prophet endorses with it the words of Hananiah. Amen is employed when an individual or the whole nation confirms a covenant or oath recited in their presence (<a onClick="return mV(\'Num\',5,22);">Nu 5:22</a>; <a onClick="return mV(\'Deu\',27,15);">De 27:15</a> f.; <a onClick="return mV(\'Neh\',5,13);">Ne 5:13</a>, etc.). It also occurs at the close of a psalm or book of psalms, or of a prayer.<P>That "Amen" was appended to the doxology in the early church is evident both from Paul and Rev, and here again it took the form of a response by the hearers. The ritual of the installation of the Lamb (<a onClick="return mV(\'Rev\',5,\'6-14\');">Re 5:6-14</a>) concludes with the Amen of the four beasts, and the four and twenty elders. It is also spoken after "Yea: I come quickly" (<a onClick="return mV(\'Rev\',22,20);">Re 22:20</a>). And that Revelation reflects the practice of the church on earth, and not merely of an ideal, ascended community in heaven, may be concluded from <a onClick="return mV(\'1Cr\',14,16);">1Co 14:16</a>, whence we gather that the lay brethren were expected to say "Amen" to the address. (See Weizsacker\'s The Apostolic Age of the Christian Church, English translation, II, 289.)``120';
isbe[457]='Amerce`a-murs\': Found in the King James Version only in <a onClick="return mV(\'Deu\',22,19);">De 22:19</a>, "And they shall amerce him in an hundred shekels of silver." Amerce is a legal term derived from the French (a = "at"; merci = "mercy," i.e. literally, "at the mercy" (of the court)). Here it is used of the imposing of a fine, according to the Law of Moses, upon the man who has been proven by the Elders to have brought a false charge against the virginity of the maid he has married by saying to the father, "I found not thy daughter a maid."``1';
isbe[458]='American Revised Version`a-mer\'-i-kan re-vizd\' vur\'-shun.<P>1. History:<P>On July 7,1870,it was moved in the Lower House of the Convocation of Canterbury that in the work of revision the cooperation of American divines be invited. This resolution was assented to, and on December 7,1871,the arrangements were completed. Under the general presidency of Dr. Philip Schaff, an Old Testament Company of fifteen scholars was formed, with Dr. W. H. Green as chairman, and a New Testament Company of sixteen members (including Dr. Schaff), with Dr. T. D. Woolsey as chairman. Work was begun on October 4,1872,and took the form of offering criticisms on the successive portions of the English revision as they were received. These criticisms of the American Companies were duly considered by the English Companies during the second revision and the decisions were again sent to America for criticism. The replies received were once more given consideration and, finally, the unadopted readings for which the American Companies professed deliberate preference were printed as appendices to the two Testaments as published in 1881 and 1885. These lists, however, were not regarded by the American Companies as satisfactory. In the first place, it became evident that the English Companies, on account of their instructions and for other reasons, were not willing to make changes of a certain class. Consequently the American Companies insisted on only such readings as seemed to have a real chance of being accepted. And, in the second place, the English presses hurried the last part of the work and were unwilling to allow enough time for adequate thoroughness in the preparation of the lists. But it was hoped that the first published edition of the English Revised Version would not be considered definitive and that in the future such American proposals as had stood the test of public discussion might be incorporated into the text. This hope was disappointed—the English Companies disbanded as soon as their revision was finished and their work stood as final. As a result the American Companies resolved to continue their organization. They were pledged not to issue or endorse any new revision within fourteen years after the publication of the English Revised Version, and so it was not until 1900 that the American Standard Revised Version New Testament was published. The whole Bible was issued in the following year.<P>2. Differences from English Revised Version:<P>As the complete editions of the American Standard Revised Version give a full list of the changes made, only the more prominent need be mentioned here. A few of the readings printed in the appendices to the English Revised Version were abandoned, but many new ones were introduced, including some that had been adopted while the English work was in progress but which had not been pressed. (See above.) Still, in general appearance, the American Standard Revised Version differs but slightly from the English. The most important addition is found in the page-headings. Some changes have been made in shortening the titles of the New Testament books. The printing of poetical passages in poetical form has been carried through more consistently. The paragraphs have been altered in some cases and (especially in the Old Testament) shortened. The punctuation has been simplified, especially by the more frequent use of the semi-colon. The removal of obsolete words ("magnifical," "neesings," etc.) has been effected fairly thoroughly, obsolete constructions ("jealous over," etc.) have been modernized, particularly by the use of "who" or "that" (instead of "which") for persons and "its" (instead of "his") for things. In the Old Testament "Yahweh" has been introduced systematically for the proper Hebrew word, as has "Sheol" ("Hades" in the New Testament). Certain passages too literally rendered in the English Revised Version ("reins," "by the hand of," etc.) are given in modern terms. In the New Testament, the substitution of "Holy Spirit" for "Holy Ghost" was completed throughout (in the English Revised Version it is made in some twenty places), "demons" substituted for "devils," "Teacher" for "Master," and "try" for "tempt" when there is no direct reference to wrongdoing. And so on.<P>3. Criticism:<P>It may be questioned whether the differences between the two Revisions are great enough to counterbalance the annoyance and confusion resulting from the existence of two standard versions in the same language. But, accepting the American Standard Revised Version as an accomplished fact, and acknowledging a few demerits that it has or may be thought to have in comparison with the English Revised Version (a bit of pedantry in <a onClick="return mV(\'Psa\',148,12);">Ps 148:12</a> or renderings of disputed passages such as <a onClick="return mV(\'Psa\',24,6);">Ps 24:6</a>), these demerits are altogether outweighed by the superiorities—with one exception. In the Psalter, when used liturgically, the repetition of the word "Yahweh" becomes wearisome and the English Revised Version which retains "The Lord" is much preferable. Most to be regretted in the American Standard Revised Version is its extreme conservatism in the readings of the original texts. In the Old Testament the number of marginal variants was actually reduced. In the New Testament, only trivial changes are made from the so-called Revisers\' Greek Text, although this text did not represent the best scholarly opinion even in 1881, while in 1900 it was almost universally abandoned (Today—in 1914—it is obsolete.) It is very unfortunate that the American Revisers did not improve on the example of their English brethren and continue their sessions after the publication of their version, for it is only by the successive revisions of published work that a really satisfactory result can be attained.<P>4. Apocrypha:<P>No American Standard Revised Version Apocrypha was attempted, a particularly unfortunate fact, as the necessity for the study of the Apocrypha has become imperative and the English Revised Version Apocrypha is not a particularly good piece of work. However, copies of the American Standard Revised Version can now be obtained with the English Revised Version Apocrypha included.`<a href="./study/isbe/search.html?string=ENGLISH+VERSIONS">ENGLISH VERSIONS</a>`48';
isbe[459]='Amethyst`am\'-e-thist`<a href="./study/isbe/search.html?string=STONES+PRECIOUS">STONES, PRECIOUS</a>`1';
isbe[460]='Ami`a\'-mi, a\'-me (\'ami): Ancestor of a family among "Solomon\'s servants" in the Return (<a onClick="return mV(\'Ezr\',2,57);">Ezr 2:57</a>); the same as Amon in <a onClick="return mV(\'Neh\',7,59);">Ne 7:59</a>.``1';
isbe[461]='Amiable`a\'-mi-a-b\'-l (yedhidh, "beloved"): Applied to the tabernacle or tent of meeting "How amiable ("lovely" the Revised Version, margin) are thy tabernacles" (<a onClick="return mV(\'Psa\',84,1);">Ps 84:1</a>), the plural having reference to the subdivisions and appurtenances of the sanctuary (compare <a onClick="return mV(\'Psa\',68,35);">Ps 68:35</a>). The adjective is rendered "amiable" in the sense of the French amiable, lovely; but the usage of the Hebrew word requires it to be understood as meaning "dear," "beloved." Compare "so amiable a prospect" (Sir T. Herbert), "They keep their churches so cleanly and amiable" (Howell, 1644). "What made the tabernacle of Moses lovely was not the outside, which was very mean, but what was within" (John Gill).`<a href="./study/isbe/search.html?string=TABERNACLE">TABERNACLE</a>`91';
isbe[462]='Aminadab`a-min\'-a-dab (Aminadab): the King James Version: Greek form of <a href="./study/isbe/search.html?string=AMMINADAB">Amminadab</a> (which see). Thus the Revised Version (British and American) (<a onClick="return mV(\'Mat\',1,4);">Mt 1:4</a>; <a onClick="return mV(\'Luk\',3,33);">Lu 3:33</a>).``1';
isbe[463]='Amiss`a-mis\':There are two words translated "amiss" in the New Testament, atopos, referring to that which is improper or harmful (<a onClick="return mV(\'Luk\',23,41);">Lu 23:41</a>; <a onClick="return mV(\'Act\',28,6);">Ac 28:6</a>), while kakos, refers to that which is evil in the sense of a disaster, then to that which is wicked, morally wrong. This latter is the use of it in <a onClick="return mV(\'Jam\',4,3);">Jas 4:3</a>. The purpose of the prayer is evil, it is therefore amiss and cannot be granted (compare <a onClick="return mV(\'2Ch\',6,37);">2Ch 6:37</a> f.).``1';
isbe[464]='Amittai`a-mit\'-i (\'amittay, "faithful"): The father of the prophet Jonah. He was from Gath-hepher in Zebulun (<a onClick="return mV(\'2Ki\',14,25);">2Ki 14:25</a>; <a onClick="return mV(\'Jon\',1,1);">Jon 1:1</a>).``1';
isbe[465]='Ammah`am\'-a (\'ammah, "mother" or "beginning"): A hill in the territory of Benjamin (<a onClick="return mV(\'2Sa\',2,24);">2Sa 2:24</a>), where Joab and Abishai halted at nightfall in their pursuit of Abner and his forces after their victory over him in the battle of Gibeon. It "lieth before Giah by the way of the wilderness of Gibeon"; but the exact location has not been identified. The same Hebrew word appears as the second part of Metheg-ammah in <a onClick="return mV(\'2Sa\',8,1);">2Sa 8:1</a> the King James Version, but rendered "mother city" in the Revised Version (British and American), probably however not the same place as in <a onClick="return mV(\'2Sa\',2,24);">2Sa 2:24</a>.``1';
isbe[466]='Ammi`am\'-i (\'ammi, "my people"): A symbolic name given to Israel by Hosea (<a onClick="return mV(\'Hsa\',2,1);">Ho 2:1</a>; <a onClick="return mV(\'Hsa\',2,3);">2:3</a> in Hebrew text), descriptive of Israel in the state of restoration, and in contrast to sinful and rejected Israel, represented by Hosea\'s son, who was called Lo-ammi, "not my people," when born to the prophet (<a onClick="return mV(\'Hsa\',1,9,10);">Ho 1:9-10</a>). This restoration to the Divine favor is more fully described in <a onClick="return mV(\'Hsa\',2,21);">Ho 2:21, 23</a> in words quoted by Paul (<a onClick="return mV(\'Rom\',9,25,26);">Ro 9:25-26</a>). The use of such figurative and descriptive names is frequent in the Old Testament; compare <a onClick="return mV(\'Isa\',62,4,12);">Isa 62:4, 12</a>.``1';
isbe[467]='Ammidioi; Ammidoi`a-mid\'-i-oi, am\'-i-doi (the King James Version Ammidioi, (also with aspirate); occurring only in 1Esdras 5:20): One of the families returning from the Babylonian Captivity in the First Return, under Zerubbabel, in 537 BC. This name is not found in the corresponding lists of the canonical books, <a onClick="return mV(\'Ezr\',2,\'1-\');">Ezr 2</a> and <a onClick="return mV(\'Neh\',7,\'1-\');">Ne 7</a>. Their identity is uncertain.``1';
isbe[468]='Ammiel`am\'-i-el (\'ammi\'el, "my kinsman is God"; (Ameiel)): A name borne by four men in the Old Testament.<P>(1) One of the twelve spies sent into Canaan by Moses; son of Gemalli, of the tribe of Dan (<a onClick="return mV(\'Num\',13,12);">Nu 13:12</a>).<P>(2) A Benjamite, the father of Machir, a friend of David, living at Lodebar in Gilead (<a onClick="return mV(\'2Sa\',9,4,5);">2Sa 9:4-5</a>; <a onClick="return mV(\'2Sa\',17,27);">17:27</a>).<P>(3) Father of Bathshua (or Bathsheba), one of David\'s wives, who was mother of Solomon (<a onClick="return mV(\'1Ch\',3,5);">1Ch 3:5</a>). In the parallel passage, <a onClick="return mV(\'2Sa\',11,3);">2Sa 11:3</a>, by transposition of the two parts of the name, he is called Eliam, meaning "my God is a kinsman."<P>(4) The sixth son of Obed-edom, a Levite, one of the doorkeepers of the tabernacle of God in David\'s life-time (<a onClick="return mV(\'1Ch\',26,5);">1Ch 26:5</a>).``109';
isbe[469]='Ammihud`a-mi\'-hud (\'ammihudh, "my kinsman is glorious"; variously in the Septuagint, Emioud or Semioud or Amioud): The name of several Old Testament persons.<P>(1) Father of Elishama, who in the wilderness was head of the tribe of Ephraim (<a onClick="return mV(\'Num\',1,10);">Nu 1:10</a>; <a onClick="return mV(\'Num\',2,18);">2:18</a>; <a onClick="return mV(\'Num\',7,48,53);">7:48, 53</a>; <a onClick="return mV(\'Num\',10,22);">10:22</a>; <a onClick="return mV(\'1Ch\',7,26);">1Ch 7:26</a>).<P>(2) Father of Shemuel, who was appointed by Moses from the tribe of Simeon to divide the land among the tribes after they should have entered Canaan (<a onClick="return mV(\'Num\',34,20);">Nu 34:20</a>).<P>(3) Father of Pedahel, who was appointed from the tribe of Naphtali for the same purpose as the Ammihud of (2) (<a onClick="return mV(\'Num\',34,28);">Nu 34:28</a>).<P>(4) In the King James Version and the Revised Version, margin for the Ammihur (\'ammichur,"my kinsman is noble"), who was father of Talmai of Geshur, a little Aramaic kingdom east of the Lebanon mountains, to whom Absalom fled after the murder of his brother Amnon. The weight of evidence seems to favor the reading Ammichur (<a onClick="return mV(\'2Sa\',13,37);">2Sa 13:37</a>).<P>(5) A descendant of Judah through the line of Perez (<a onClick="return mV(\'1Ch\',9,4);">1Ch 9:4</a>).``109';
isbe[470]='Ammihur`a-mi\'-hur (the King James Version and the Revised Version, margin; \'ammichur, "my kinsman is noble"; Emioud). See <a href="./study/isbe/search.html?string=AMMIHUD">AMMIHUD</a> (4).``1';
isbe[471]='Amminadab`a-min\'-a-dab (\'amminadhabh = "my people (or my kinsman) is generous or noble"): Three persons bearing this name are mentioned in the Old Testament.<P>(1) In <a onClick="return mV(\'Rth\',4,19,20);">Ru 4:19-20</a> and <a onClick="return mV(\'1Ch\',2,10);">1Ch 2:10</a> Amminadab is referred to as one of David\'s ancestors. He was the great- grandson of Perez, a son of Judah (<a onClick="return mV(\'Gen\',38,29);">Ge 38:29</a>; <a onClick="return mV(\'Gen\',46,12);">46:12</a>) and the great-grandfather of Boaz, who again was the great- grandfather of David. Aaron\'s wife, Elisheba, was a daughter of Amminadab (<a onClick="return mV(\'Exd\',6,23);">Ex 6:23</a>), while one of the sons, namely, Nahshon, occupied an important position in the Judah-clan (<a onClick="return mV(\'Num\',1,7);">Nu 1:7</a>; <a onClick="return mV(\'Num\',2,3);">2:3</a>; <a onClick="return mV(\'Num\',7,12);">7:12</a>; <a onClick="return mV(\'Num\',10,14);">10:14</a>).<P>(2) In the first Book of Chronicles (<a onClick="return mV(\'1Ch\',6,22);">1Ch 6:22</a>) Amminadab is mentioned as a son of Kohath (and therefore a grandson of Levi) and the father of Korah. But in other genealogical passages (<a onClick="return mV(\'Exd\',6,18);">Ex 6:18</a>; <a onClick="return mV(\'Num\',3,19);">Nu 3:19</a>; <a onClick="return mV(\'1Ch\',6,2);">1Ch 6:2</a>) the sons of Kohath are Amram, Izhar, Hebron and Uzziel, and in two places (<a onClick="return mV(\'Exd\',6,21);">Ex 6:21</a>; <a onClick="return mV(\'1Ch\',6,38);">1Ch 6:38</a>) Izhar is mentioned as the father of Korah.<P>(3) According to <a onClick="return mV(\'1Ch\',15,10,11);">1Ch 15:10-11</a> Amminadab was the name of a priest who took part in the removal of the ark to Jerusalem. He was the son of Uzziel, and therefore a nephew of Amminadab, son of Kohath (= Izhar).``103';
isbe[472]='Amminadib`a-min\'-a-dib (\'amminadhibh): The name occurs in the King James Version and the Revised Version, margin only in one passage (<a onClick="return mV(\'Sgs\',6,12);">So 6:12</a>, "the chariots of Amminadib"). In King James Version margin and the Revised Version (British and American) text, however, it is not regarded as a proper name, and the clause is rendered, "among the chariots of my princely people." Interpretations widely vary`<a href="./study/isbe/search.html?string=COMMENTARIES">COMMENTARIES</a>`1';
isbe[473]='Ammishaddai`am-i-shad\'-i, am-i-shad-a\'-i (\'ammishadday, "Shaddai is my kinsman"): The father of Ahiezer, a Danite captain or "head of his fathers\' house," during the wilderness journey (<a onClick="return mV(\'Num\',1,12);">Nu 1:12</a>; <a onClick="return mV(\'Num\',2,25);">2:25</a>, etc.).``1';
isbe[474]='Ammizabad`a-miz\'-a-bad (\'ammizabhadh, "my kinsman has made a present"): The son of Benaiah, one of David\'s captains for the third month (<a onClick="return mV(\'1Ch\',27,6);">1Ch 27:6</a>).``1';
isbe[475]='Ammon; Ammonites`am\'-on, am\'-on-its (\'ammon; \'ammonim):<P>The Hebrew tradition makes this tribe descendants of Lot and hence related to the Israelites (<a onClick="return mV(\'Gen\',19,38);">Ge 19:38</a>). This is reflected in the name usually employed in Old Testament to designate them, Ben \'Ammi, Bene \'Ammon, "son of my people," "children of my people," i.e. relatives. Hence we find that the Israelites are commanded to avoid conflict with them on their march to the Promised Land (<a onClick="return mV(\'Deu\',2,19);">De 2:19</a>). Their dwelling-place was on the east of the Dead Sea and the Jordan, between the Arnon and the Jabbok, but, before the advance of the Hebrews, they had been dispossessed of a portion of their land by the Amorites, who founded, along the east side of the Jordan and the Dead Sea, the kingdom of Sihon (<a onClick="return mV(\'Num\',21,\'21-31\');">Nu 21:21-31</a>).<P>We know from the records of Egypt, especially Tell el-Amarna Letters, the approximate date of the Amorite invasion (14th and 13th centuries, BC). They were pressed on the north by the Hittites who forced them upon the tribes of the south, and some of them settled east of the Jordan. Thus, Israel helped Ammonites by destroying their old enemies, and this makes their conduct at a later period the more reprehensible. In the days of Jephthah they oppressed the Israelites east of the Jordan, claiming that the latter had deprived them of their territory when they came from Egypt, whereas it was the possessions of the Amorites they took (<a onClick="return mV(\'Jdg\',11,\'1-28\');">Jud 11:1-28</a>). They were defeated, but their hostility did not cease, and their conduct toward the Israelites was particularly shameful, as in the days of Saul (<a onClick="return mV(\'1Sa\',11,\'1-\');">1Sa 11</a>) and of David (<a onClick="return mV(\'2Sa\',10,\'1-\');">2Sa 10</a>). This may account for the cruel treatment meted out to them in the war that followed (<a onClick="return mV(\'2Sa\',12,\'26-31\');">2Sa 12:26-31</a>).<P>They seem to have been completely subdued by David and their capital was taken, and we find a better spirit manifested afterward, for Nahash of Rabbah showed kindness to him when a fugitive (<a onClick="return mV(\'2Sa\',17,\'27-29\');">2Sa 17:27-29</a>). Their country came into the possession of Jeroboam, on the division of the kingdom, and when the Syrians of Damascus deprived the kingdom of Israel of their possessions east of the Jordan, the Ammonites became subjects of Benhadad, and we find a contingent of 1,000 of them serving as allies of that king in the great battle of the Syrians with the Assyrians at Qarqar (854 BC) in the reign of Shalmaneser II. They may have regained their old territory when Tiglath-pileser carried off the Israelites east of the Jordan into captivity (<a onClick="return mV(\'2Ki\',15,29);">2Ki 15:29</a>; <a onClick="return mV(\'1Ch\',5,26);">1Ch 5:26</a>). Their hostility to both kingdoms, Judah and Israel, was often manifested. In the days of Jehoshaphat they joined with the Moabites in an attack upon him, but met with disaster (<a onClick="return mV(\'2Ch\',20,\'1-\');">2Ch 20</a>). They paid tribute to Jotham (<a onClick="return mV(\'2Ch\',27,5);">2Ch 27:5</a>). After submitting to Tiglath-pileser they were generally tributary to Assyria, but we have mention of their joining In the general uprising that took place under Sennacherib; but they submitted and we find them tributary in the reign of Esarhaddon.<P>Their hostility to Judah is shown in their joining the Chaldeans to destroy it (<a onClick="return mV(\'2Ki\',24,2);">2Ki 24:2</a>). Their cruelty is denounced by the prophet <a onClick="return mV(\'Amo\',1,13);">Am 1:13</a>, and their destruction by <a onClick="return mV(\'Jer\',49,\'1-6\');">Jer 49:1-6</a>; <a onClick="return mV(\'Eze\',21,\'28-32\');">Eze 21:28-32</a>; <a onClick="return mV(\'Zep\',2,8,9);">Ze 2:8-9</a>. Their murder of Gedaliah (<a onClick="return mV(\'2Ki\',25,\'22-26\');">2Ki 25:22-26</a>; <a onClick="return mV(\'Jer\',40,14);">Jer 40:14</a>) was a dastardly act. Tobiah the Ammonites united with Sanballat to oppose Nehemiah (<a onClick="return mV(\'Neh\',4,\'1-\');">Ne 4</a>), and their opposition to the Jews did not cease with the establishment of the latter in Judea.<P>They joined the Syrians in their wars with the Maccabees and were defeated by Judas (1 Mac 5:6). Their religion was a degrading and cruel superstition. Their chief god was Molech, or Moloch, to whom they offered human sacrifices (<a onClick="return mV(\'1Ki\',11,7);">1Ki 11:7</a>) against which Israel was especially warned (<a onClick="return mV(\'Lev\',20,\'2-5\');">Le 20:2-5</a>). This worship was common to other tribes for we find it mentioned among the Phoenicians.``138';
isbe[476]='Ammonitess`am-on-i\'-tes, a-mon\'-i-tes (\'ammonith): A woman of the Ammonites, Naamah, the mother of Rehoboam (<a onClick="return mV(\'1Ki\',14,21,31);">1Ki 14:21, 31</a>; <a onClick="return mV(\'2Ch\',12,13);">2Ch 12:13</a>; <a onClick="return mV(\'2Ch\',24,26);">24:26</a>).``1';
isbe[477]='Amnon`am\'-non (\'amnon, "faithful"; compare \'aminon, <a onClick="return mV(\'2Sa\',13,20);">2Sa 13:20</a>, which is probably a diminutive. Wellhausen (IJG, II, 24, note 2) resolves \'amiynown into \'immi, and nun, "my mother is the serpent"; compare <a href="./study/isbe/search.html?string=NUN">NUN</a>):<p>(1) The eldest son of David and Ahinoam, the Jezreelites (compare <a onClick="return mV(\'2Sa\',3,2);">2Sa 3:2</a>). As the crown prince and heir presumptive to the throne, he was intensely hated by Absalom, who was, therefore, doubly eager to revenge the outrage committed by Amnon upon his sister Tamar (<a onClick="return mV(\'2Sa\',3,2);">2Sa 3:2</a>; <a onClick="return mV(\'2Sa\',13,1);">13:1</a> f., <a onClick="return mV(\'1Ch\',3,1);">1Ch 3:1</a>).<p>(2) A name in the genealogy of Judah (<a onClick="return mV(\'1Ch\',4,20);">1Ch 4:20</a>).``1';
isbe[478]='Amok`a\'-mok (\'amoq, "deep"): A chief priest who came to Jerusalem with Zerubbabel (<a onClick="return mV(\'Neh\',12,7);">Ne 12:7</a>) and the forefather of Eber, who was priest in the days of Joiakim (<a onClick="return mV(\'Neh\',12,20);">Ne 12:20</a>).``1';
isbe[479]='Amon`a\'-mon (\'amon): A name identical with that of the Egyptian local deity of Thebes (No); compare <a onClick="return mV(\'Jer\',46,25);">Jer 46:25</a>. The foreign name given to a Hebrew prince is remarkable, as is also the fact that it is one of the two or three royal names of Judah not compounded with the name of Yahweh. See <a href="./study/isbe/search.html?string=MANASSEH">MANASSEH</a>. It seems to reflect the sentiment which his fanatical father sought to make prevail that Yahweh had no longer any more claim to identification with the realm than had other deities.<P>(1) A king of Judah, son and successor of Manasseh; reigned two years and was assassinated in his own palace by the officials of his household. The story of his reign is told briefly in <a onClick="return mV(\'2Ki\',21,\'19-26\');">2Ki 21:19-26</a>, and still more briefly, though in identical terms, so far as they go, in <a onClick="return mV(\'2Ch\',33,\'21-25\');">2Ch 33:21-25</a>. His short reign was merely incidental in the history of Judah; just long enough to reveal the traits and tendencies which directly or indirectly led to his death. It was merely a weaker continuation of the regime of his idolatrous father, though without the fanaticism which gave the father positive character, and without the touch of piety which, if the Chronicler\'s account is correct, tempered the father\'s later years.<P>If the assassination was the initial act of a revolution the latter was immediately suppressed by "the people of the land," who put to death the conspirators and placed Amon\'s eight-year-old son Josiah on the throne. In the view of the present writer the motive of the affair was probably connected with the perpetuity of the Davidic dynasty, which, having survived so long according to prophetic prediction (compare <a onClick="return mV(\'2Sa\',7,16);">2Sa 7:16</a>; <a onClick="return mV(\'Psa\',89,36,37);">Ps 89:36-37</a>), was an essential guarantee of Yahweh\'s favor. Manasseh\'s foreign sympathies, however, had loosened the hold of Yahweh on the officials of his court; so that, instead of being the loyal center of devotion to Israel\'s religious and national idea, the royal household was but a hotbed of worldly ambitions, and all the more for Manasseh\'s prosperous reign, so long immune from any stroke of Divine judgment.<P>It is natural that, seeing the insignificance of Amon\'s administration, some ambitious clique, imitating the policy that had frequently succeeded in the Northern Kingdom, should strike for the throne. They had reckoned, however, without estimating the inbred Davidic loyalty of the body of the people. It was a blow at one of their most cherished tenets, committing the nation both politically and religiously to utter uncertainty. That this impulsive act of the people was in the line of the purer religious movement which was ripening in Israel does not prove that the spiritually-minded "remnant" was minded to violence and conspiracy, it merely shows what a stern and sterling fiber of loyalty still existed, seasoned and confirmed by trial below the corrupting cults and fashions of the ruling classes. In the tragedy of Amon\'s reign, in short, we get a glimpse of the basis of sound principle that lay at the common heart of Israel.<P>(2) A governor of Samaria (<a onClick="return mV(\'1Ki\',22,26);">1Ki 22:26</a>); the one to whom the prophet Micaiah was committed as a prisoner by King Ahab, after the prophet had disputed the predictions of the court prophets and foretold the king\'s death in battle.<P>(3) The head of the "children of Solomon\'s servants" (<a onClick="return mV(\'Neh\',7,59);">Ne 7:59</a>) who returned from captivity; reckoned along with the Nethinim, or temple slaves. Called also Ami (<a onClick="return mV(\'Ezr\',2,57);">Ezr 2:57</a>).``66';
isbe[480]='Amorites`am\'-o-rits; Amorites (\'emori, always in the singular like the Babylonian Amurru from which it is taken; Amorraioi):<P>1. Varying Use of the Name Explained<P>2. The Amorite Kingdom<P>3. Sihon\'s Conquest<P>4. Disappearance of the Amorite Kingdom<P>5. Physical Characteristics of the Amorites<P>The name Amorite is used in the Old Testament to denote<P class="in15">(1) the inhabitants of Palestine generally,<P class="in15">(2) the population of the hills as opposed to the plain, and<P class="in15">(3) a specific people under a king of their own. Thus<P>(1) we hear of them on the west shore of the Dead Sea (<a onClick="return mV(\'Gen\',14,7);">Ge 14:7</a>), at Hebron (<a onClick="return mV(\'Gen\',14,13);">Ge 14:13</a>), and Shechem (<a onClick="return mV(\'Gen\',48,22);">Ge 48:22</a>), in Gilead and Bashan (<a onClick="return mV(\'Deu\',3,10);">De 3:10</a>) and under Hermon (<a onClick="return mV(\'Deu\',3,8);">De 3:8</a>; <a onClick="return mV(\'Deu\',4,48);">4:48</a>). They are named instead of the Canaanites as the inhabitants of Palestine whom the Israelites were required to exterminate (<a onClick="return mV(\'Gen\',15,16);">Ge 15:16</a>; <a onClick="return mV(\'Deu\',20,17);">De 20:17</a>; <a onClick="return mV(\'Jdg\',6,10);">Jud 6:10</a>; <a onClick="return mV(\'1Sa\',7,14);">1Sa 7:14</a>; <a onClick="return mV(\'1Ki\',21,26);">1Ki 21:26</a>; <a onClick="return mV(\'2Ki\',21,11);">2Ki 21:11</a>); the older population of Judah is called Amorite in <a onClick="return mV(\'Jos\',10,5,6);">Jos 10:5-6</a>, in conformity with which Ezekiel (<a onClick="return mV(\'Exe\',16,3);">16:3</a>) states that Jerusalem had an Amorite father; and the Gibeonites are said to have been "of the remnant of the Amorites" (<a onClick="return mV(\'2Sa\',21,2);">2Sa 21:2</a>). On the other hand<P>(2), in <a onClick="return mV(\'Num\',13,29);">Nu 13:29</a> the Amorites are described as dwelling in the mountains like the Hittites and Jebusites of Jerusalem, while the Amalekites or Bedouins lived in the south and the Canaanites on the seacoast and in the valley of the Jordan. Lastly<p>(3) we hear of Sihon, "king of the Amorites," who had conquered the northern half of Moab (<a onClick="return mV(\'Num\',21,\'21-31\');">Nu 21:21-31</a>; <a onClick="return mV(\'Deu\',2,\'26-35\');">De 2:26-35</a>).<P>1. Varying Use of the Name Explained:<P>Assyriological discovery has explained the varying use of the name. The Hebrew form of it is a transliteration of the Babylonian Amurru, which was both sing. and plural. In the age of Abraham the Amurru were the dominant people in western Asia; hence Syria and Palestine were called by the Babylonians "the land of the Amorites." In the Assyrian period this was replaced by "land of the Hittites," the Hittites in the Mosaic age having made themselves masters of Syria and Canaan. The use of the name "Amorite" in its general sense belongs to the Babylonian period of oriental history.<P>2. The Amorite Kingdom:<P>The Amorite kingdom was of great antiquity. About 2500 BC it embraced the larger part of Mesopotamia and Syria, with its capital probably at Harran, and a few centuries later Northern Babylonia was occupied by an "Amorite" dynasty of kings who traced theft descent from Samu or Sumu (the Biblical Shem), and made Babylon their capital. To this dynasty belonged Khammu-rabi, the Amraphel of <a onClick="return mV(\'Gen\',14,1);">Ge 14:1</a>. In the astrological documents of the period frequent reference is made to "the king of the Amorites." This king of the Amorites was subject to Babylonia in the age of the dynasty of Ur, two or three centuries before the birth of Abraham He claimed suzerainty over a number of "Amorite" kinglets, among whom those of Khana on the Euphrates, near the mouth of the Khabur, may be named, since in the Abrahamic age one of them was called Khammu-rapikh and another Isarlim or Israel. A payment of a cadastral survey made at this time by a Babylonian governor with the Cana
