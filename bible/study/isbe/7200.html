isbe[7201]='Queen`kwen: The Bible applies this term:<P>(1) To the wife of a king ("queen consort") (malkah). In the Book of Esther it is the title given to Vashti (<a onClick="return mV(\'Est\',1,9);">1:9</a>) and Esther (<a onClick="return mV(\'Est\',2,22);">2:22</a>); compare <a onClick="return mV(\'Sgs\',6,8);">So 6:8</a>f. Another Hebrew word for queen consort is gebhirah, literally "mistress" (compare <a onClick="return mV(\'1Ki\',11,19);">1Ki 11:19</a>, the wife of Pharaoh; <a onClick="return mV(\'2Ki\',10,13);">2Ki 10:13</a>, "the children of the king and the children of the queen"). In <a onClick="return mV(\'Neh\',2,6);">Ne 2:6</a> and <a onClick="return mV(\'Psa\',45,9);">Ps 45:9</a> we find the expression sheghal, which some trace back to shaghal, "to ravish," a rather doubtful derivation. Still another term is sarah, literally, "princess" (<a onClick="return mV(\'Isa\',49,23);">Isa 49:23</a>). The Septuagint sometimes uses the word basilissa; compare <a onClick="return mV(\'Psa\',45,9);">Ps 45:9</a>.<P>(2) To a female ruler or sovereign ("queen regnant"). The only instances are those of the queen (malkah) of Sheba (<a onClick="return mV(\'1Ki\',10,\'1-13\');">1Ki 10:1-13</a>; compare <a onClick="return mV(\'2Ch\',9,\'1-12\');">2Ch 9:1-12</a>) and of Candace, the queen (basilissa) of the Ethiopians (<a onClick="return mV(\'Act\',8,27);">Ac 8:27</a>). In <a onClick="return mV(\'Mat\',12,42);">Mt 12:42</a> (compare <a onClick="return mV(\'Luk\',11,31);">Lu 11:31</a>) Christ refers to the queen of the south (basilissa notou), meaning, of course, the queen of Sheba.<P>(3) To a heathen deity, melekheth ha-shamayim, "the queen of heaven" (<a onClick="return mV(\'Jer\',7,18);">Jer 7:18</a>; <a onClick="return mV(\'Jer\',44,17);">44:17</a>).<P>(4) Metaphorically, to the city of Babylon (Rome) (<a onClick="return mV(\'Rev\',18,7);">Re 18:7</a>): an expression denoting sovereign contempt and imaginary dignity and power.`<a href="./study/isbe/search.html?string=QUEEN+OF+HEAVEN">QUEEN OF HEAVEN</a>`8';
isbe[7202]='Queen Mother`(gebhirah, literally, "mistress," then a female ruler, and sometimes simply the wife of a king ("queen," <a onClick="return mV(\'1Ki\',11,19);">1Ki 11:19</a>); in <a onClick="return mV(\'Dan\',5,10);">Da 5:10</a> the term malketha\' "queen," really means the mother of the king): It stands to reason that among a people whose rulers are polygamists the mother of the new king or chief at once becomes a person of great consequence. The records of the Books of Kings prove it. The gebhirah, or queen mother, occupied a position of high social and political importance; she took rank almost with the king. When Bath-sheba, the mother of Solomon, desired "to speak unto him for Adonijah," her son "rose up to meet her, and bowed himself unto her, and sat down on his throne, and caused a throne to be set for the king\'s mother; and she sat on his right hand" (<a onClick="return mV(\'1Ki\',2,19);">1Ki 2:19</a>). And again, in <a onClick="return mV(\'2Ki\',24,15);">2Ki 24:15</a>, it is expressly stated that Nebuchadnezzar carried away the king\'s mother into captivity; Jeremiah calls her gebhirah (<a onClick="return mV(\'Jer\',29,2);">29:2</A>). The king was Jehoiachin (Jeconiah, <a onClick="return mV(\'Jer\',29,2);">Jer 29:2</a>), and his mother\'s name was Nehushta (<a onClick="return mV(\'2Ki\',24,8);">2Ki 24:8</a>). This was the royal pair whose impending doom the prophet was told to forecast (<a onClick="return mV(\'Jer\',13,18);">Jer 13:18</a>). Here again the queen mother is mentioned with the king, thus emphasizing her exalted position. Now we understand why Asa removed Maacah his (grand?)mother from being queen (queen mother), as we are told in <a onClick="return mV(\'1Ki\',15,13);">1Ki 15:13</a> (compare <a onClick="return mV(\'2Ch\',15,16);">2Ch 15:16</a>). She had used her powerful influence to further the cause of idolatry. In this connection Athaliah\'s coup d\'etat may be briefly mentioned. After the violent death of her son Ahaziah (<a onClick="return mV(\'2Ki\',9,27);">2Ki 9:27</a>), she usurped the royal power and reigned for some time in her own name (<a onClick="return mV(\'2Ki\',11,3);">2Ki 11:3</a>; compare <a onClick="return mV(\'2Ch\',22,12);">2Ch 22:12</a>). This was, of course, a revolutionary undertaking, being a radical departure from the usual traditions.<P>And finally, the political importance of the gebhirah is illustrated by the fact that in the Books of Kings, with two exceptions, the names of the Jewish kings are recorded together with those of their respective mothers; they are as follows: Naamah, the Ammonitess, the mother of Rehoboam (<a onClick="return mV(\'1Ki\',14,21);">1Ki 14:21</a>; compare <a onClick="return mV(\'1Ki\',14,31);">14:31</A>, and <a onClick="return mV(\'2Ch\',12,13);">2Ch 12:13</a>); Maacah, the daughter of Abishalom (<a onClick="return mV(\'1Ki\',15,2);">1Ki 15:2</a>) or Absalom (<a onClick="return mV(\'2Ch\',11,20);">2Ch 11:20</a>) the mother of Abijah; Maacah, the daughter of Abishalom, the mother (grandmother?) of Asa (<a onClick="return mV(\'1Ki\',15,10);">1Ki 15:10</a>; compare <a onClick="return mV(\'2Ch\',15,16);">2Ch 15:16</a>); Azubah, the daughter of Shilhi, the mother of Jehoshaphat (<a onClick="return mV(\'1Ki\',22,42);">1Ki 22:42</a>; compare <a onClick="return mV(\'2Ch\',20,31);">2Ch 20:31</a>); Athaliah, the grand-daughter of Omri, the mother of Ahaziah (<a onClick="return mV(\'2Ki\',8,26);">2Ki 8:26</a>; compare <a onClick="return mV(\'2Ch\',22,2);">2Ch 22:2</a>); Zibiah of Beersheba, the mother of Jehoash (<a onClick="return mV(\'2Ki\',12,1);">2Ki 12:1</a>; compare <a onClick="return mV(\'2Ch\',24,1);">2Ch 24:1</a>); Jehoaddin (Jehoaddan, <a onClick="return mV(\'2Ch\',25,1);">2Ch 25:1</a>) of Jerusalem, the mother of Amaziah (<a onClick="return mV(\'2Ki\',14,2);">2Ki 14:2</a>); Jecoliah (Jechiliah, <a onClick="return mV(\'2Ch\',26,3);">2Ch 26:3</a>) of Jerusalem, the mother of Azariah (<a onClick="return mV(\'2Ki\',15,2);">2Ki 15:2</a>) or Uzziah (<a onClick="return mV(\'2Ki\',15,13,30);">2Ki 15:13,30</a>, etc.; compare <a onClick="return mV(\'2Ch\',26,3);">2Ch 26:3</a>); Jerusha (Jerushah, <a onClick="return mV(\'2Ch\',27,1);">2Ch 27:1</a>), the daughter of Zadok, the mother of Jotham (<a onClick="return mV(\'2Ki\',15,33);">2Ki 15:33</a>); Abi (Abijah, <a onClick="return mV(\'2Ch\',29,1);">2Ch 29:1</a>), the daughter of Zechariah, the mother of Hezekiah (<a onClick="return mV(\'2Ki\',18,2);">2Ki 18:2</a>); Hephzibah, the mother of Manasseh (<a onClick="return mV(\'2Ki\',21,1);">2Ki 21:1</a>); Meshullemeth, the daughter of Haruz of Jotbah, the mother of Amon (<a onClick="return mV(\'2Ki\',21,19);">2Ki 21:19</a>); Jedidah, the daughter of Adaiah of Bozkath, the mother of Josiah (<a onClick="return mV(\'2Ki\',22,1);">2Ki 22:1</a>); Hamutal, the daughter of Jeremiah of Libnah, the mother of Jehoahaz (<a onClick="return mV(\'2Ki\',23,31);">2Ki 23:31</a>); Zebidah, the daughter of Pedaiah of Rumah, the mother of Jehoiakim (<a onClick="return mV(\'2Ki\',23,36);">2Ki 23:36</a>); Nehushta, the daughter of Elnathan of Jerusalem, the mother of Jehoiachin (<a onClick="return mV(\'2Ki\',24,8);">2Ki 24:8</a>); Hamutal (Hamital), the daughter of Jeremiah of Libnah, the mother Of Zedekiah (<a onClick="return mV(\'2Ki\',24,18);">2Ki 24:18</a>). The exceptions are Jehoram and Ahaz.``8';
isbe[7203]='Queen of Heaven`(melekheth ha-shamayim, although there is another reading, mele\'kheth, "worship" or "goddess"): Occurs only in two passages: <a onClick="return mV(\'Jer\',7,18);">Jer 7:18</a>; <a onClick="return mV(\'Jer\',44,\'17-19\',25);">44:17-19,25</a>, where the prophet denounces the wrath of God upon the inhabitants of Judah and Jerusalem who have given themselves up to the worship of the host of heaven. This is no doubt a part of the astral worship which is found largely developed among the Jews in the later period of their history in Canaan. It is first mentioned in <a onClick="return mV(\'2Ki\',17,16);">2Ki 17:16</a> as practiced by the men of the Northern Kingdom when Samaria had fallen and the ten tribes were being carried away into captivity. Moses is represented as warning the Israelites against the worship of the sun and moon and stars and all the host of heaven, practiced by the people of Canaan (<a onClick="return mV(\'Deu\',4,19);">De 4:19</a>; <a onClick="return mV(\'Deu\',17,3);">17:3</a>) and the existence of such worship among the Canaanites and neighboring nations is attested from an early period (compare <a onClick="return mV(\'Job\',31,\'26-28\');">Job 31:26-28</a>). The worship of the heavenly bodies was widely spread in the East and in Arabia; and the Babylonian pantheon was full of astral deities, where each divinity corresponded either to an astral phenomenon or to some circumstance or occurrence in Nature which is connected with the course of the stars (Jeremias, The Old Testament in the Light of the Ancient East, I, 100). From the prophets we gather that before the exile the worship of the host of heaven had become established among all classes and in all the towns of Israel (Jer ubi supra; <a onClick="return mV(\'Eze\',8,16);">Eze 8:16</a>). In that worship the queen of heaven had a conspicuous place; and if, as seems probable from the cakes which were offered, she is to be identified with the Assyrian Ishtar and the Canaanite Astarte, the worship itself was of a grossly immoral and debasing character. That this Ishtar cult was of great antiquity and widely spread in ancient Babylonia may be seen from the symbols of it found in recent excavations (see Nippur, II, 236). How far the astral theorists like Winckler and Jeremias are entitled to link up with this worship the mourning for Josiah, the lamentations over Tammuz, the story of Jephthah\'s daughter, and even—the narrative of the misfortunes and the exaltation of Joseph, is questionable. But that the people of Judah in the days before the exile had given themselves over to the worst and vilest forms of heathen worship and incurred the grievous displeasure of Yahweh is made clear by the denunciation of the worship of the queen of heaven by Jeremiah.``128';
isbe[7204]='Queen of Sheba`she\'-ba (<a onClick="return mV(\'1Ki\',10,\'1-13\');">1Ki 10:1-13</a>; <a onClick="return mV(\'2Ch\',9,\'1-12\');">2Ch 9:1-12</a>, called in <a onClick="return mV(\'Mat\',12,42);">Mt 12:42</a>; <a onClick="return mV(\'Luk\',11,31);">Lu 11:31</a>, "the queen of the south" (basilissa notou)):<P>1. Old Testament Accounts:<P>The two Old Testament accounts of the coming of the queen of Sheba (see <a href="./study/isbe/search.html?string=SHEBA">SHEBA</a>) to Solomon differ slightly from one another, and, of the two, that in 1 Kings is the older. (1) The words "concerning the name of Yahweh" (<a onClick="return mV(\'1Ki\',10,1);">1Ki 10:1</a>) are lacking in 2 Chronicles; while the Septuagint in 1 Kings has "and the name of Yahweh," apparently a correction of the Massoretic Text. (2) For <a onClick="return mV(\'1Ki\',10,9);">1Ki 10:9</a>, "because Yahweh loved Israel for ever," <a onClick="return mV(\'2Ch\',9,8);">2Ch 9:8</a> has "because thy God loved Israel, to establish them for ever"; the Septuagint in 1 Kings has "because Yahweh loved Israel, to establish it forever." (3) In the last verse of each account we find another difference: <a onClick="return mV(\'2Ch\',9,12);">2Ch 9:12</a> says that Solomon gave to the queen all her desire, "besides that which she had brought unto the king." i.e. according to some, besides the equivalent of what she had brought to him; <a onClick="return mV(\'1Ki\',10,13);">1Ki 10:13</a> margin has" besides that which he gave her according to the hand of king Solomon," i.e. besides gifts commensurate with his own wealth and power (SBOT), or besides gifts which he gave her qua king.<P>2. The Narrative:<P>The narrative tells of the queen of Sheba, on hearing of Solomon\'s great wisdom, coming to test him with perplexing questions or riddles (compare <a onClick="return mV(\'Jdg\',14,12);">Jud 14:12</a>). She brought presents to the king, and interviewed him: "And when the queen of Sheba had seen all the wisdom of Solomon, and the house that he had built" (i.e. the palace, not the temple) as well as its arrangements, "and his burnt-offering which he offered in the house of Yahweh (so read and translate with the Revised Version margin in <a onClick="return mV(\'1Ki\',10,5);">1Ki 10:5</a>, and also in <a onClick="return mV(\'2Ch\',9,4);">2Ch 9:4</a>); there was no more spirit in her": the half of Solomon\'s wisdom had not been told her. "Happy," she said to him, "are thy wives (so read with Septuagint, Syriac and Old Latin versions), happy are these thy servants." She then exchanged gifts with him and returned to her own land.<P>The narrative is a complement of that in <a onClick="return mV(\'1Ki\',3,\'16-28\');">1Ki 3:16-28</a>, where the king\'s justice is exemplified; here his wisdom.<P>3. Employed by Jesus:<P>The narrative is referred to by Jesus in <a onClick="return mV(\'Mat\',12,42);">Mt 12:42</a>; <a onClick="return mV(\'Luk\',11,31);">Lu 11:31</a>, where He refuses to accede to the request of the scribes and Pharisees for a sign from Him. He tells them that no sign will be given them except that of Jonah, whose sign was his preaching, one that proved sufficient to the Ninevites; and \'behold something greater than Jonah is here.\' The men of Nineveh will be a living condemnation of them "in the judgment" (compare <a onClick="return mV(\'Luk\',16,31);">Lu 16:31</a>); and so will the "queen of the south" who came from the ends of the earth after hearing of Solomon\'s wisdom, \'and behold something greater than Solomon is here.\' The only sign to be given is that of the wisdom of Jesus, a wisdom far greater than that of Solomon (see D. Smith, Days of His Flesh, 176ff).<P>4. Eastern Literature:<P>Eastern literature has much to say about the queen of Sheba. The Arabs called her Bilqis. Abyssinian legend declares that she came from Ethiopia, her name being Maqeda, and that she had a son by Solomon. See Delitzsch, Iris, 116-27; ZDMG, X, 19f; J Pr T, VI, 524ff (1880). Gressmann (in Schriften des Altes Testament, II, 1,203) has further references to Wilhelm Hertz, Gesammelte Abhandlungen,1905,413ff; Bezold, Kebra Nagast,1905,and also ZDMG, 60, 666ff. For the Mohammedan story, see Koran xxvii, with notes in Sale\'s translation.``149';
isbe[7205]='Quench`kwench, kwensh: Where the word is used of fire or of thirst it has the usual meaning: "to allay," "to extinguish," "to suppress," "to cool." In the Old Testament it is frequently applied to the affections and passions (see <a onClick="return mV(\'2Ki\',22,17);">2Ki 22:17</a>; <a onClick="return mV(\'Sgs\',8,7);">So 8:7</a>; <a onClick="return mV(\'Isa\',42,3);">Isa 42:3</a>; <a onClick="return mV(\'Jer\',4,4);">Jer 4:4</a>; <a onClick="return mV(\'Jer\',21,12);">21:12</a>). Quenching the coal or the light of Israel may mean slaying a dear one or a brilliant leader. In the New Testament it is also used figuratively, as in <a onClick="return mV(\'Eph\',6,16);">Eph 6:16</a> the shield of faith quenches the fiery darts of the evil one. In <a onClick="return mV(\'Mar\',9,48);">Mr 9:48</a>, sbennumi, and its derivative are applied with reference to Gehenna (translated "hell"). The same word is also used of resisting the gifts of the Holy Spirit in <a onClick="return mV(\'1Th\',5,19);">1Th 5:19</a>.``64';
isbe[7206]='Question`kwes\'-chun: The noun for dabhar, "word," in <a onClick="return mV(\'1Ki\',10,3);">1Ki 10:3</a> parallel <a onClick="return mV(\'2Ch\',9,2);">2Ch 9:2</a>, with "hard question" for chidhah, "dark saying," "riddle," in <a onClick="return mV(\'1Ki\',10,1);">1Ki 10:1</a> parallel <a onClick="return mV(\'2Ch\',9,1);">2Ch 9:1</a>. In the New Testament for zetema, the synonym zetesis (and <a onClick="return mV(\'1Ti\',1,4);">1Ti 1:4</a>, ekzetesis), being rendered "questionings" by the Revised Version (British and American) (the King James Version does not distinguish). In <a onClick="return mV(\'Mar\',11,29);">Mr 11:29</a> for logos, "word" (so the Revised Version margin). The verb in the sense "ask a question" in <a onClick="return mV(\'2Ch\',31,9);">2Ch 31:9</a> for darash, and <a onClick="return mV(\'Luk\',2,46);">Lu 2:46</a>; <a onClick="return mV(\'Luk\',23,9);">23:9</a> for eperotao (compare the American Standard Revised Version, the English Revised Version margin <a onClick="return mV(\'Jhn\',16,23);">Joh 16:23</a>). Elsewhere the verb is for suzeteo, "dispute" (<a onClick="return mV(\'Mar\',1,27);">Mr 1:27</a>, etc.; compare <a onClick="return mV(\'Act\',6,9);">Ac 6:9</a>; <a onClick="return mV(\'Act\',9,29);">9:29</a>). "Called in question," <a onClick="return mV(\'Act\',19,40);">Ac 19:40</a> the King James Version, represents egkaleo, "call into court," but in <a onClick="return mV(\'Act\',23,6);">Ac 23:6</a>; <a onClick="return mV(\'Act\',24,21);">24:21</a>, "I am called in question" is for krinomai, "I am being judged."``48';
isbe[7207]='Quick; Quicken`kwik, kwik\'-\'n: Translates in the King James Version four different words:<P>(1) chayah,<P>(2) michyah,<P>(3) ruach, and<P>(4) zao.<P>Of these words (1) and (4) had simply the sense of life, and this idea was in 1611 adequately given, by the word "quick," although this sense of the word has long been somewhat obscured. As the translation of ruach (<a onClick="return mV(\'Isa\',11,3);">Isa 11:3</a>) "quick" as found in the King James Version signified "acute." In this passage the Revised Version (British and American) substitutes "delight" for "quick understanding." In <a onClick="return mV(\'Lev\',13,10,24);">Le 13:10,24</a> the Revised Version (British and American) retains the rendering "quick," although originally the word michyah must in some way have involved the conception of life, which no longer belongs to the English word "quick." It is not clear exactly in what sense the flesh in the sore or scar was thought of as living, especially as it was plainly regarded as in an unhealthy condition. Possibly the condition under consideration resembled what is sometimes idiomatically styled in English "proud flesh," and was thought of as a peculiar manifestation of life.<P>To quicken also means a reviving, a refreshing, an increasing of life (<a onClick="return mV(\'Psa\',71,20);">Ps 71:20</a>; <a onClick="return mV(\'Psa\',85,6);">85:6</a>; <a onClick="return mV(\'Psa\',119,37,40,88);">119:37,40,88</a>; <a onClick="return mV(\'Isa\',57,10);">Isa 57:10</a>). It often has reference to the resurrection from the dead (<a onClick="return mV(\'1Cr\',15,36);">1Co 15:36</a>) and is so used in many places in the King James Version. Where it refers to the giving of spiritual life the American Standard Revised Version has changed it in every case (<a onClick="return mV(\'Eph\',2,1,5);">Eph 2:1,5</a>; <a onClick="return mV(\'Col\',2,13);">Col 2:13</a>; compare <a onClick="return mV(\'Jhn\',5,21);">Joh 5:21</a>).``51';
isbe[7208]='Quicksands`kwik\'-sandz.`<a href="./study/isbe/search.html?string=SYRTIS">SYRTIS</a>`1';
isbe[7209]='Quiet`kwi\'-et: Verb or adjective only in English Versions of the Bible, "quietness" being used for the noun. No special Hebrew or Greek words are represented, but in the Old Testament usually for some form or derivative of shaqat, "be undisturbed" (<a onClick="return mV(\'Jdg\',18,7);">Jud 18:7</a>; compare <a onClick="return mV(\'Pro\',1,33);">Pr 1:33</a>, sha\'ar, "to loll," "be at ease"; <a onClick="return mV(\'Ecc\',9,17);">Ec 9:17</a>, nachath, "quiet," "be set on"). For "them that are quiet in the land", in <a onClick="return mV(\'Psa\',35,20);">Ps 35:20</a>, see <a href="./study/isbe/search.html?string=MEEKNESS">MEEKNESS</a>; <a href="./study/isbe/search.html?string=POOR">POOR</a>. For "quiet prince in <a onClick="return mV(\'Jer\',51,59);">Jer 51:59</a>, the Revised Version (British and American) substitutes "chief chamberlain," margin "quartermaster." "Jacob was a quiet (tam, "gentle") man" (<a onClick="return mV(\'Gen\',25,27);">Ge 25:27</a>, the King James Version "plain"). In the New Testament, it is the translation of hesuchazo, "to refrain from gossip or meddlesomehess": "that ye study to be quiet": (<a onClick="return mV(\'1Th\',4,11);">1Th 4:11</a>), and of hesuchios, "gentle": "a meek and quiet spirit" (<a onClick="return mV(\'1Pe\',3,4);">1Pe 3:4</a>; compare <a onClick="return mV(\'1Ti\',2,2);">1Ti 2:2</a>).``91';
isbe[7210]='Quintus Memmius`kwin\'-tus mem\'-us.`<a href="./study/isbe/search.html?string=MEMMIUS,+QUINTUS">MEMMIUS, QUINTUS</a>`1';
isbe[7211]='Quirinius`kwi-rin\'-i-us.`<a href="./study/isbe/search.html?string=CHRONOLOGY+OF+THE+NEW+TESTAMENT">CHRONOLOGY OF THE NEW TESTAMENT</a>; <a href="./study/isbe/search.html?string=LUKE,+THE+GOSPEL+OF">LUKE, THE GOSPEL OF</a>`1';
isbe[7212]='Quit`kwit: Same derivation as "quiet," so that "to be quit" (<a onClick="return mV(\'Exd\',21,19,28);">Ex 21:19,28</a>; <a onClick="return mV(\'Jos\',2,20);">Jos 2:20</a> the King James Version) is "to be relieved of responsibility," naqah, naqi, "guiltless" (so the Revised Version (British and American) <a onClick="return mV(\'Jos\',2,20);">Jos 2:20</a>). Hence, "to quit one\'s self" means "to be freed by discharging a duty." The phrase in English Versions of the Bible, however, is a gloss for in <a onClick="return mV(\'1Sa\',4,9);">1Sa 4:9</a> it is used for hayah, "to be," while in <a onClick="return mV(\'1Cr\',16,13);">1Co 16:13</a> andrizomai, means "to behave like a man."``1';
isbe[7213]='Quiver`kwiv\'-er (ashpah, teli; pharetra (Sirach 26:12)): A case or sheath for carrying arrows, a part of the ordinary equipment of the warrior, both foot-soldier and charioteer (<a onClick="return mV(\'Job\',39,23);">Job 39:23</a>; <a onClick="return mV(\'Isa\',22,6);">Isa 22:6</a>), and also of the huntsman (<a onClick="return mV(\'Gen\',27,3);">Ge 27:3</a>). Figuratively of a group in passages where children (<a onClick="return mV(\'Psa\',127,5);">Ps 127:5</a>) or prophets of Yahweh (<a onClick="return mV(\'Isa\',49,2);">Isa 49:2</a>) are spoken of as arrows. Arrows are called bene \'ashpah, "sons of the quiver" (<a onClick="return mV(\'Lam\',3,13);">La 3:13</a>). By identifying the arrows with the death they produce, the quiver is likened to an open grave (<a onClick="return mV(\'Jer\',5,16);">Jer 5:16</a>).``1';
isbe[7214]='Quotations in the New Testament`kwo-ta\'-shunz,<P><b>I. INTRODUCTORY</b><P class="in15">Limitation of the Discussion<P><b>II. CONSTRUCTIVE PRINCIPLES OF NEW TESTAMENT QUOTATION</b><P class="in15">1. Unity of the Two Dispensations<P class="in15">2. Biblical Movement Planned from the Beginning<P class="in15">3. The Old Testament Accepted as Authoritative<P class="in15">4. Issue Involved in Foregoing Principles of Reference<P><b>III. TYPICAL INSTANCES OF NEW TESTAMENT QUOTATION</b><P class="in15">1. Introductory Formulas<P class="in15">2. Unity of the Two Dispensations<P class="in15">3. Prevision of Christianity in the Old Testament<P class="in15">4. Argumentative Quotations<P class="in15">5. Catena of Passages, Illustrating Principles of Quotation<P><b>LITERATURE</b><hr /><P>I. Introductory.<P>Limitation of the Discussion:<P>There are, all told, approximately 300 direct quotations from the Old Testament in the New Testament. The presence of so many citations, each of one of which involves an interpretation of the passage given a new context in quotation, opens many avenues of discussion and propounds many difficult and far-reaching problems. In every separate instance, in the long list of New Testament quotations, the principle of accommodation (see <a href="./study/isbe/search.html?string=ACCOMMODATION">ACCOMMODATION</a>) in some form is involved and, consequently, the question of historical and exegetical accuracy is unavoidably raised. In the present article we shall concentrate attention upon that which is of far greater importance than the question whether the writer is incidentally correct, according to modern scientific principles, in any specific citation. This more important and vital issue we take to be the general, guiding principles adopted by the New Testament writers in their use of the book of the older covenant. A review of these principles, together with certain outstanding and typical instances in which these principles are used and applied, will form the substance of the discussion.<P>II. Constructive Principles of New Testament Quotation.<P>1. Unity of the Two Dispensations:<P>In the first place, the New Testament writers regard the Christian religion as having its roots in the Old Testament. From the call of Abraham to the founding and expansion of the Christian church the men of the New Testament recognize a single organic movement. In their use of the ancient oracles in new setting they constantly and confidently rely upon the unity of the two dispensations, that recorded in the Old Testament and that in which they themselves were participants. Such a unity, taking for granted its existence, would remove to a degree the very distinction implied in the terms Old and New Testaments, and would involve a definite and organic relationship of all the books to each other. There are no longer two separate groups of books standing apart from each other and having bonds of union only within the group, but, on the contrary, two related sub-groups outwardly corresponding to contrasted phases of the historical movement, but inwardly conformed to the deep-lying principles which make the entire movement one. According to this idea the Book of Genesis is as really related to the Gospel of Matthew as it is to the Book of Exodus. On the surface, and historically speaking, the Book of Genesis leads immediately to the Book of Exodus, which is its companion volume and complement, but go more deeply into Genesis and just as really and just as directly it leads to Matthew, which is also its fellow and complement. And so throughout. The unifying medium is, of course, the history which is one in that it involves the same organic principles applied to successive areas of human experience. The books of the Bible are, therefore, like any group of books on a common subject, phases of each other, contrasted and yet intimately cognate. In quoting from the Old Testament the New Testament writers were simply obeying an impulse common to all thoughtful writers and accounting for all quotations, seeking for diversified expression of the same truths.<P>2. Biblical Movement Planned from the Beginning:<P>The second great constructive principle of New Testament quotation, and manifestly in close harmony with the first one, is that the movement from Abraham to Christ was not only organically one, but that it was from the beginning planned and prepared for. The Bible is one because the history out of which it grew is one. The history is one because God is in the history and God is one. According to the writers of the New Testament in this history as a whole we have the unfolding of an all-embracing plan of God, stretching out into the remotest future and coming to its culmination in the person and the kingdom of the Messiah. They maintain also that this plan was disclosed in part beforehand, by way of anticipation and preparation, in order that men might intelligently cooperate with God in the fulfillment of His purpose. This is the idea involved in prophecy and its fulfillment, and in the closely related idea of promise and its realization. One mind, one will, and one central purpose are operating throughout the entire history which is, on the divine side, the fulfillment of a plan complete in thought before it takes shape in events. On the basis of this conception, of the foreseen plan of God and its gradual revelation to men through messages of hope and warning set in the key of the great future and pointing the way thither, the greater part of the structure of New Testament quotation is reared.<P>3. The Old Testament Accepted as Authoritative:<P>A third principle which really involves a combination of the other two and is prominently brought forward in the use of quotation for purposes of argument is the recognition and acceptance of the Old Testament as authoritative, a real Word of God, in form occasional, but essentially applicable to all experiences, and hence, good for all time. It is evident that the belief in the continued authority of the Scripture of the old covenant over the men of the new, rests upon the unity of the two dispensations and the acceptance of the same divine mind and will as operating throughout all outward and historical changes. This is admirably expressed by Paul when he speaks of \'the mystery of his will, according to his good pleasure which he purposed in him unto an economy of the fullness of the periods, to sum up all things in Christ\' (<a onClick="return mV(\'Eph\',1,9,10);">Eph 1:9,10</a>), and by the author of He when he says: \'God, having of old spoken unto the fathers in the prophets by various portions and in various ways, hath at the end of these days spoken unto us in his Son\' (<a onClick="return mV(\'Eph\',1,1,2);">Eph 1:1,2</a>).<P>4. Issue Involved in Foregoing Principles of Reference:<P>The justification of these accepted principles of reference on the part of the New Testament writers lies beyond the scope of the present discussion. It is sufficient to emphasize the fact that any detailed discussion of New Testament quotations seriatim is meaningless and futile except upon the basis of an explicit and consistent determination of these antecedent questions. To the present writer the validity of these principles is beyond question. The denial of any one of the three involves one in difficulties of interpretation, both critical and historical, from which there is no escape. It is to be noted, therefore, that the establishment of the principles, in accordance with which the New Testament writers quote, carries with it in a general way the justification of their usage.<P>III. Typical Instances of New Testament Quotation.<P>1. Introductory Formulas:<P>With these constructive principles in mind we are prepared to pass in review typical instances in which general principles are embodied. At this point we shall be greatly assisted in the analysis and distribution of the complex material before us by giving careful heed to the formulas, more or less fixed and uniform, by which the writers introduce quotations and indicate their sense of the value and significance of that which is quoted. While these formulas exhibit certain verbal variations, they are practically reducible to three, which correspond with substantial accuracy to the three constructive principles already noted: the unity of the Old Testament and New Testament; the prevision of the New Testament in the Old Testament; the authority of the Old Testament as the Word of God intended for all time.<P>2. Unity of the Two Dispensations:<P>The unity of the two dispensations is asserted in all those passages introduced by a formula, in which fulfillment is asserted as a fact, and in which the operation of identical principles in two or more separate events in the field of history is implied. A suggestive example is in <a onClick="return mV(\'Mat\',13,14);">Mt 13:14</a>, where our Lord asserts, in connection with the parable of the Sower, that in the unbelief of the people of His day "the prophecy of Isaiah" is fulfilled. The prophetic words here quoted (<a onClick="return mV(\'Isa\',6,9,10);">Isa 6:9,10</a>) are not predictive in any immediate sense, but are susceptible of repeated application and realization because of the general principle which they contain. They apply to the prophet\'s own day; they also apply—and in that sense are fulfilled—to the time of Jesus, and by a legitimate extension of meaning, to stubborn unbelief in any age (compare <a onClick="return mV(\'Jhn\',6,45);">Joh 6:45</a>).<P>Another passage in which the same formula is used in a very exceptional way clearly sets forth the fundamental principle upon which this usage rests. <a onClick="return mV(\'Jam\',2,23);">Jas 2:23</a> asserts that the justification of Abraham in the offering of Isaac "fulfilled" the passage which affirms that his belief was counted to him for righteousness (<a onClick="return mV(\'Gen\',15,6);">Ge 15:6</a>). This passage is not predictive in any sense, nor is there in the narrative any hint of a connection between the passage and the episode on Mt. Moriah. This use of the formula of fulfillment by James involves the principle that any event which realizes the meaning and truth of a Scriptural statement fulfils it. A vast number of quotations in the New Testament come under this head. Persons, events, doctrines, illustrate and confirm, or embody and concretely realize, principles which are taught in the Old Testament or implied in its history. We are warned by this passage and many others like it against a too rigid and literal interpretation of any formula implying fulfillment. While it may certainly be intended to imply literal prediction and an equally literal fulfillment, it may, on the contrary, be intended to intimate nothing more than a harmony of principle, fitting the passage to the person or event with which it is connected. In this connection it is to be remembered that a harmony of principle may extend all the way from a comparatively superficial illustrative resemblance to a profound assonance of thought. Not a few Old Testament quotations were made for purposes of illustration and literary embellishment. Herein lies the significance of Matthew\'s use (<a onClick="return mV(\'Mat\',2,17);">Mt 2:17</a>f) of <a onClick="return mV(\'Jer\',31,15);">Jer 31:15</a>. A glance at this quoted passage indicates that it is a figurative and poetic expression in which Rachel (already for many years in her tomb) is represented as weeping for her exiled children and refusing to be comforted except by their return. There is no strictly predictive element in the passage, save only the promise of return, which is not used by Matthew. Its applicability to the massacre of the children of Bethlehem lies in its poetical appositeness, and there alone. Once again the voice of wailing motherhood is heard in Israel. The tender and beautiful imagery is applicable in this sense and is used with true insight, but with no intention of justifying a claim of prediction and fulfillment in the literal sense.<P>3. Prevision of Christianity in the Old Testament:<P>The prevision of events in the life of Jesus and in the history of Christianity is involved in all the quotations in which a necessary connection between the passage as predictive and the event is asserted, or in which a prophet is said to have been speaking or writing concerning the event or person in question. An examination of the Old Testament without reference to its use in the New Testament seems to justify the conclusion that its bearing upon the future may be particularized under four heads, which in turn, with sufficient accuracy and exhaustiveness will classify the pertinent New Testament quotations.<P>(1) The prophetic teaching of Israel embodied not only in the messages of the prophets, but also in laws, institutions, and rites, has a twofold dispensational application. Reference is made here only to those explicit references to a future era of especial blessing. For example, in <a onClick="return mV(\'Act\',2,17);">Ac 2:17</a>ff Peter interprets the Pentecostal experience in the terms of prophecy, referring to Joel (<a onClick="return mV(\'Joe\',2,28);">2:28</A>ff), who promises an outpouring of God\'s Spirit in a "great and notable day" of the Lord. The promise through Joel is an undeniable prediction (every promise is such), which in a measure would be fulfilled in any exceptional manifestation of God\'s Spirit among men. The only question which can possibly be raised in connection with Peter\'s use of this passage is whether the Pentecostal outpouring was the climactic realization of the promise: that is, the establishment of the era of blessing foretold by the prophet. Later in the same book (<a onClick="return mV(\'Act\',3,\'20-26\');">3:20-26</A>) the same apostle sweeps the whole field of prophecy as centering in certain promises fulfilled in Christ and the Christian community.<P>He gives two instances: the prophet like Moses (<a onClick="return mV(\'Deu\',18,15);">De 18:15</a>) and the promised inclusive blessing through Abraham (<a onClick="return mV(\'Gen\',12,3);">Ge 12:3</a>). He also includes (<a onClick="return mV(\'Act\',3,26);">Ac 3:26</a>) a hint of the Servant passages of Isaiah. This identification of the New Testament movement through two specific predictive promises is wholly justified by the prophetic character of Jesus, the range and richness of the blessings brought from Abraham through Him, and by the fact elsewhere emphasized that no other has measured up to the standard of the ideal servant. Negatively, it may be urged that if these promises were not fulfilled in Christ, history affords no possibility of discovering any fulfillment measurably adequate, either in the past or future. In <a onClick="return mV(\'Hbr\',8,\'8-12\');">Hebrews 8:8-12</a> reference is made to the promise of a new covenant in Jeremiah (<a onClick="return mV(\'Jer\',31,31);">31:31</a>ff) as a justification for believing that the Old Testament dispensation was not complete in itself and that in its very constitution it pointed forward to Christianity as its fulfillment. Combining this passage with that quoted above (<a onClick="return mV(\'Act\',2,17);">Ac 2:17</a>) taken from Joel, the strength of the case for this use of the Old Testament is at once seen. Distinctively Jeremiah\'s "new covenant" was to be inward and gracious rather than outward and legal. The promise through Joel is an awakening of prophecy through the free outpouring of God\'s Spirit. The distinctive feature of the gospel is its idea of justification by faith, through grace revealed in Christ and imparted by the Holy Spirit given according to promise at Pentecost. The "new covenant" foretold by Jeremiah was established at Pentecost through the outpouring of the Spirit promised through Joel. To deny this as fulfillment is to nullify the meaning of Christian history and to erase both promises from the page of credible prophecy.<P>(2) Contemporary persons or institutions are sometimes interpreted, not in the terms of present actuality, but on the basis of the ideal not revealed or realized until the coming of Christ. One striking example of this method is to be found in the so-called "Immanuel passage" (<a onClick="return mV(\'Mat\',1,23);">Mt 1:23</a>, quoting <a onClick="return mV(\'Isa\',7,14);">Isa 7:14</a>). Undoubtedly the message of the prophet to Ahaz had an immediate and contemporary significance. But, like many another notable prophetic message it is set in the key of the Messianic King whose unworthy predecessor Ahaz was. "The Messiah comes, but the willfulness of Ahaz has rendered His reign impossible" (G. A. Smith, "Isa," Expositor\'s Bible, I, 134).<P>In <a onClick="return mV(\'Act\',2,\'24-36\');">Ac 2:24-36</a>, passages representative of many others quoted, both the resurrection and ascension of Jesus are interpreted in the light of two quotations from the Psalms (<a onClick="return mV(\'Psa\',16,8);">16:8</a>ff; <a onClick="return mV(\'Psa\',110,1);">110:1</a>) as predetermined and therefore certain events in the plan and purpose of God. In both instances the argument is that the promises nominally made to David, or claimed by him, were couched in terms too vast to find fulfillment in his own experience, but were spoken of the greater King who was to come and in whose experience alone they were realized. In the former instance, a triumph over death was anticipated with assurance which not the Psalmist but only Christ attained; in the latter a royal ascendancy was promised that only Christ\'s ascension to the place of power could satisfy. An examination of the passages shows that Peter\'s interpretation is justified not merely by the wording of the promises, which point to a fullness of experience not realized by any Old Testament man, but still more clearly by the descriptive titles which identify the person who is the subject of the experience. In the first instance he is spoken of as Yahweh\'s "Holy One," in the second as "My Lord." The triumph over death which the speaker anticipates is grounded in a unity of purpose and will with God—a holiness which was ideal and still unrealized until Christ came. The logic of the psalm is: God\'s "Holy One" must not see corruption. The logic of history is: Christ is God\'s Holy One and He did not see corruption. The principle that triumph over death is the logical issue of holiness found its justification and proof not directly in the experience of the singer who first glimpsed it as a truth, but in the career of Christ who first realized it as a fact.<P>NOTE—The argument here is not affected if one accepts the variant reading "Holy Ones" for the preceding passage.<P>The second passage is particularly interesting because our Lord Himself first pointed out its implications as to the place and work of the Messiah. Such a passage as this entire psalm (<a onClick="return mV(\'Psa\',110,\'1-\');">Ps 110</a>) would have been impossible had not the powers and responsibilities of the Davidic King been keyed from the beginning at the Messianic level. The logic here is the same as in <a onClick="return mV(\'Psa\',16,\'1-\');">Ps 16</a>. The Messianic kingdom over all nations awaited the coming of the true Messianic King. The long-delayed triumph followed hard upon the coming of the long-expected King (compare <a onClick="return mV(\'Psa\',2,1,2);">Ps 2:1,2</a>; <a onClick="return mV(\'Act\',13,\'32-34\');">Ac 13:32-34</a>).<P>The same principle is involved in our Lord\'s use of the Servant passage (<a onClick="return mV(\'Isa\',61,1);">Isa 61:1</a>) in His sermon at Nazareth. Here the issue as to Messianic prophecy is fairly joined at the center. It is central because it occurs in the Lord\'s own teaching and also because it concerns, not any external or incidental happenings in the life of Jesus, but the whole trend and movement of prophetic thought, together with the entire meaning and interpretation of His career.<P>Interpreted altogether apart from the New Testament, the passage has an unmistakable bearing upon the future. As one of the series concerned with the Servant (<a onClick="return mV(\'Isa\',42,1);">Isa 42:1</a>), the quoted passage focuses attention upon the mission of Israel to the world, still to be carried out. "Ye are my witnesses, saith Yahweh, and my servant whom I have chosen" (<a onClick="return mV(\'Isa\',43,10);">Isa 43:10</a>), "Yet now hear, O Jacob my servant, and Israel, whom I have chosen" (<a onClick="return mV(\'Isa\',44,1);">Isa 44:1</a>). It also involves the entire scope and meaning of the prophetic office through which Yahweh\'s will was made known to Israel and through Israel to the world. Both these considerations sweep out into the prophet\'s future and both point unerringly to Christ as the historical fulfillment of Israel\'s mission and as the actual realization of the ideal and ministry of prophethood. The very ambiguity of the reference in this chapter (<a onClick="return mV(\'Isa\',61,\'1-\');">Isaiah 61</a>), whether to the Servant or to the prophet, and the questions raised as to whether Israel idealized is referred to or some person or personification, serve to make more clear and unmistakable the central fact that only in Christ is the conception embodied in the entire series of passages altogether realized. It thus becomes for sober thought a distinct revelation and portraiture in advance of what Jesus was in His person and work.<P>(3) In the course of Israel\'s training to receive the Messiah, certain external items were given as bearing upon the identification of Him when He should come. We shall instance three items, closely related to each other, and each intensely interesting in itself. These three items are<P>(a) His sonship to David (<a onClick="return mV(\'Act\',2,30,31);">Ac 2:30,31</a>),<P>(b) His birth from a Virgin (<a onClick="return mV(\'Mat\',1,22);">Mt 1:22</a>f),<P>(c) His birth at Bethlehem (<a onClick="return mV(\'Mat\',2,5);">Mt 2:5</a>).<P>Objection is offered at once to the interpretation of these Old Testament passages as predictive, and to the alleged fulfillments in the life of Jesus, on the ground mainly that being definite events (compare <a onClick="return mV(\'Mat\',2,15);">Mt 2:15</a>) they are not included within the legitimate scope of prediction; and, secondarily, that being items of this external kind it would be an easy matter to invent fulfillments. It may be granted at once that incidents of this kind could be indefinitely multiplied by fabricating coincidences, but the fact remains that, in the absence of any visible check upon invention, very few such instances are alleged by New Testament writers. Furthermore, there are suggestive variations between the events recorded and the natural interpretations of the Old Testament passages connected with them; that is, the fuifilments arrive by such devious routes as to make it difficult to suppose them to be due to the imaginative stimulation of the passages. For example, the birth at Bethlehem was brought about by circumstances not at all to the liking of Jewish patriots; and was obscured to contemporaries by the previous and subsequent residence at Nazareth. The kinship of Jesus to the house of David was made adoptive (unless Mary was of that house) by the virgin birth. The interpretation of <a onClick="return mV(\'Isa\',7,14);">Isa 7:14</a> as intimating a virgin birth was not compulsory to one familiar with the Hebrew text of the passage and would have been thought of in that connection only by one assured of the fact. The virgin birth (see <a href="./study/isbe/search.html?string=IMMANUEL">IMMANUEL</a>; <a href="./study/isbe/search.html?string=VIRGIN+BIRTH">VIRGIN BIRTH</a>) is not an etymological but a providential commentary on <a onClick="return mV(\'Isa\',7,14);">Isa 7:14</a>. One other consideration of primary importance remains. In the one point where the identification of Jesus with the Messiah by His followers can be tested most severely, they are most completely triumphant. It would be comparatively easy to invent incidents suggested by Old Testament prophecies, and to take dignities and titles wholesale from the same source—but given all these, to find one capable of realizing and fulfilling the expectations so aroused is the chief problem. Here fabrication is impossible. And here too the New Testament meets and answers the challenge of truth. In view of these considerations it is safe to assert that even in matters of historical detail the career of Jesus was foreseen and predicted. Such passages belong to the philosophy of preparation as a whole and should be studied in that connection.<P>(4) In certain instances the original passage and its reappearance in quotation indicate a process New Testament which is continuous throughout all history. For example, the use of <a onClick="return mV(\'Zec\',13,7);">Zec 13:7</a> (<a onClick="return mV(\'Mar\',14,27);">Mr 14:27</a>) suggests a deeper view of the connection between prophecy and history, immediate and more remote, than we are often aware of. On the face of them such passages as those concerning the Smitten Shepherd and the scattered sheep are predictions, and the life of Christ stands as fulfillment. It simply cannot be contended that such passages as these do not find fulfillment and explanation in the career of Jesus as nowhere else in the history. Nevertheless, the connection is far deeper than mere foresight of an isolated event and its occurrence. We may well say that, in a sense, the event is foreseen because it is already a fact. The allegory of the Smitten Shepherd is, as has well been said, "a summary of the history of Israel." But it is more than that. The relationship of God with Israel, which involved a dealing of divine grace with men, their rejection of it and the consequent vicarious immolation of the Divine Friend and Shepherd, which came to its climax in the tragedy of the cross, was established in all essential factors in the early days. Therefore, Christ can say, as the outcome of the profoundest insight into the meaning of history, \'That which concerneth me hath fulfillment\' (compare <a onClick="return mV(\'Luk\',24,44);">Lu 24:44</a>). He was more deeply concerned in the doings of an earlier time than being there foreseen. In a real sense, "the Lamb" was "slain from the foundation of the world," (<a onClick="return mV(\'Rev\',13,8);">Re 13:8</a>). In this allegory of the rejected Shepherd and in the successive delineations of the Servant passages, we have the portrait of the Christ as He was—not merely as He was to be. In these quotations deep answers to deep. The only satisfactory interpretation of the tragedy of the cross is that in accordance with principles long operative in human history, "it must needs be." The only satisfactory interpretation of the passages cited is that they disclose the actual operation of the forces which in their culmination issued in the tragedy of the cross. This brings the passages in the original and in quotation into the framework of the same course of events. Peter in his sermon in Solomon\'s porch thus sums up the whole process: "But the things which God foreshowed by the mouth of all the prophets, that his Christ should suffer, he thus fulfilled" (<a onClick="return mV(\'Act\',3,18);">Ac 3:18</a>).<P>4. Argumentative Quotations:<P>The argumentative use of the Old Testament involves exactly the same principles which have been dealt with in the foregoing discussion. These principles coalesce in the conception of the Old Testament as authoritative.<P>(1) Throughout the New Testament, in the teaching of our Lord Himself and in the apostolic writings, a clear-cut distinction is drawn between the temporary and permanent offices of the Old Testament. It is recognized that in essential principles the Old Testament is for all time, while in its outward form and in its actualization of underlying and essential truths it is preliminary and preparatory. There are different dispensations, but one economy. Whenever our Lord uses the Old Testament for purposes of argument (see <a onClick="return mV(\'Mat\',4,4,7);">Mt 4:4,7</a>; <a onClick="return mV(\'Mat\',12,17);">12:17</a>ff; <a onClick="return mV(\'Mat\',19,18);">19:18</a>f; <a onClick="return mV(\'Mar\',10,19);">Mr 10:19</a>; <a onClick="return mV(\'Luk\',19,46);">Lu 19:46</a>) it is on the basis of essential truth which is permanent and unchanging (<a onClick="return mV(\'Mat\',5,\'17-19\');">Mt 5:17-19</a>). On the other hand, He never hesitates to annul that which had a merely temporary or preliminary value (<a onClick="return mV(\'Mat\',5,21,33,38);">Mt 5:21,33,38</a>; compare by way of contrast <a onClick="return mV(\'Mat\',5,27);">Mt 5:27</a>). He came not to destroy, but to fulfil, but fulfillment implies a new era—a new and higher stage in the delivery of truth.<P>(2) In like manner Paul and the other New Testament writers argue on the basis of an identity of principle which binds the two eras together. Paul contends for three great principles, the Messiahship of Jesus, justification by faith, the inclusion of the Gentiles in the plan of salvation (the doctrine of election is a detail of this last argument; see <a onClick="return mV(\'Rom\',9,7,9,12,13,15,17);">Ro 9:7,9,12,13,15,17</a>). We shall consider typical examples of Paul\'s use of the Old Testament in argumentation. Choice has been made of those which have provoked adverse criticism. Among these is the use of <a onClick="return mV(\'Gen\',13,15);">Ge 13:15</a>; <a onClick="return mV(\'Gen\',17,8);">17:8</a> in <a onClick="return mV(\'Gal\',3,16);">Ga 3:16</a>. This is a leading example of Paul\'s alleged "rabbinical" method: "He saith not, And to seeds, as of many; but as of one, And to thy seed, which is Christ." The Hebrew word "seed" as applied to offspring (zera\') is singular. This, of course, means that a man\'s descendants are looked upon as organically one, inasmuch as they continue his life. The word would apply to any one of the family, but only by virtue of his belonging to the family. Etymologically Paul\'s argument would apply to Isaac as well as to Jesus—provided only the promise is looked upon as being fulfilled in him. But the promise which was fulfilled in Isaac, was fulfilled in a larger way in Israel as a whole, and was fulfilled in the largest way of all in Christ. The use of the singular word indicates that Abraham\'s children were looked upon as one in him—they are also one in Christ. The true children of Abraham are such in Christ. Historically the argument is fully justified. "The personality of Christ is in some sense coextensive with the fulfillment of the promise to Abraham" (Beet). "Christ is the organ of fulfillment" (Meyer).<P>The classical passage in the discussion of justification based upon an Old Testament quotation is <a onClick="return mV(\'Rom\',1,17);">Ro 1:17</a>, quoting <a onClick="return mV(\'Hab\',2,4);">Hab 2:4</a>. The quoted passage seems to fail the argument because the literal translation would appear to be that "the righteous shall live by their faithfulness." A deeper view, however, amply justifies the quotation; first, because the stedfasthess demanded by the prophet is a persistent trust in God in view of the delay of the promised vision; second, the deepest principle common to the Old Testament and New Testament is that stability of character has its root in trust in Yahweh (<a onClick="return mV(\'Isa\',28,16);">Isa 28:16</a>; compare <a onClick="return mV(\'Isa\',26,\'1-3\');">Isa 26:1-3</a>). Nothing could be more foreign to the thought of the Old Testament than that a man could be righteous without trust in God.<P>One further quotation argumentatively used by Paul may fitly close this section of our discussion. In <a onClick="return mV(\'Rom\',11,26);">Ro 11:26,27</a> he quotes <a onClick="return mV(\'Isa\',59,20,21);">Isa 59:20,21</a> as indicating the divine purpose to include the Gentiles within the scope of salvation. This passage is doubly significant because it is attacked by Kuenen (Prophets and Prophecy in Israel) on the ground that it is uncritically taken from the Septuagint version which in this instance does not correctly represent the Hebrew text. It may be remarked that a large percentage of the New Testament quotations are taken from the Septuagint. (For estimates of the number see Johnson, Quotations of the New Testament, chapter i.) This prevalent habit is amply justifiable by, and in large consideration of, the fact that the New Testament was written for the purpose of being read and understood by those to whom the Septuagint was often the only version available, and the familiarity of that version was ample compensation for any slight loss in verbal accuracy. The only reasonable qualification of this general statement is that we should call in question any deviation which is depended upon for a point in argument. Kuenen, the severest critic of the New Testament writers in this particular, alleges very few instances, and Professor Johnson has satisfactorily dealt with these in detail (as above). In the case immediately before us the deviations in the version used by Paul do not in the least modify, in the way of strengthening, the reference to the Gentiles (beginning in <a onClick="return mV(\'Rom\',11,19);">Ro 11:19</a> and continuing throughout) which is the point upon which Paul is laying stress. It is not too much to say that Paul\'s argument would be unimpaired had he used the Hebrew text, upon which our the Revised Version (British and American) rests (compare <a onClick="return mV(\'Hbr\',2,\'6-8\');">Heb 2:6-8</a>). In general, it may be premised that no stringent rule of verbal accuracy should be considered binding upon writers who address a popular audience beyond that which guards the substantial cogency of their argument. From the fair application of this reasonable rule the New Testament writers have nothing to fear.<P>For the most part the New Testament writers confine their quotations to the Old Testament. In a single instance an extracanonical saying of Jesus (<a onClick="return mV(\'Act\',20,35);">Ac 20:35</a>), and, in at least two instances (<a onClick="return mV(\'Jud\',1,9,14);">Jude 1:9,14</a>), non-canonical books are referred to. In addition to this Paul uses in the letter to Titus (<a onClick="return mV(\'Tts\',1,12);">1:12</a>) and in his sermon at Athens (<a onClick="return mV(\'Act\',17,28);">Ac 17:28</a>) lines from native poets to illustrate and enforce his discussion (see <a href="./study/isbe/search.html?string=POETRY,+NEW+TESTAMENT">POETRY, NEW TESTAMENT</a>). In these latter instances the difference in usage from his ordinary habit of quoting authoritative Scripture is sufficiently obvious. In the case of the saying attributed to Christ, it is enough to say that it is so obviously Christlike that we need not hesitate to accept it as genuine, while in the case of Jude nothing is made to depend upon the quotations except certain accepted Christian truths (see Plummer, Expositor\'s Bible. "James and Jude," 434f).<P>5. Catena of Passages Illustrating Principles of Quotation:<P>(1) Based on Unity of Dispensations.<P><a onClick="return mV(\'Mat\',2,18);">Mt 2:18</a>; <a onClick="return mV(\'Mat\',13,14);">13:14</a>; <a onClick="return mV(\'Mat\',27,9);">27:9</a>; <a onClick="return mV(\'Mar\',7,6);">Mr 7:6</a>; <a onClick="return mV(\'Luk\',4,21);">Lu 4:21</a>; <a onClick="return mV(\'Luk\',20,17);">20:17</a>; <a onClick="return mV(\'Jhn\',4,37);">Joh 4:37</a>; <a onClick="return mV(\'Jhn\',6,45);">6:45</a>; <a onClick="return mV(\'Jhn\',7,38);">7:38</a>; <a onClick="return mV(\'Jhn\',12,14);">12:14</a>f; <a onClick="return mV(\'Act\',2,31,39);">Ac 2:31,39</a>; <a onClick="return mV(\'Act\',3,25);">3:25</a>; <a onClick="return mV(\'Act\',4,25);">4:25</a>; <a onClick="return mV(\'Act\',8,23,32);">8:23,32</a>f; <a onClick="return mV(\'Act\',13,22,32,33,34);">13:22,32,33,34</a>; <a onClick="return mV(\'Act\',28,26,27);">28:26,27</A>; <a onClick="return mV(\'1Cr\',15,54,55);">1Co 15:54,55</a>; <a onClick="return mV(\'Hbr\',8,\'8-12\');">Heb 8:8-12</a>; <a onClick="return mV(\'Jam\',2,23);">Jas 2:23</a>.<P>(2) Based on Prevision.<P><a onClick="return mV(\'Mat\',1,22);">Mt 1:22</a>; <a onClick="return mV(\'Mat\',2,5,15);">2:5,15</a>; <a onClick="return mV(\'Mat\',4,14);">4:14</a>; <a onClick="return mV(\'Mat\',8,17);">8:17</a>; <a onClick="return mV(\'Mat\',12,17);">12:17</a>; <a onClick="return mV(\'Mat\',13,35);">13:35</a>; <a onClick="return mV(\'Mat\',26,31);">26:31</a>; <a onClick="return mV(\'Mar\',14,27);">Mr 14:27</a>; <a onClick="return mV(\'Luk\',22,37);">Lu 22:37</a>; <a onClick="return mV(\'Jhn\',7,38,42);">Joh 7:38,42</a>; <a onClick="return mV(\'Jhn\',12,38,40,49);">12:38,40,49</a>; <a onClick="return mV(\'Jhn\',13,18);">13:18</a>; <a onClick="return mV(\'Jhn\',15,25);">15:25</a>; <a onClick="return mV(\'Jhn\',19,24,28,36);">19:24,28,36</a>; <a onClick="return mV(\'Jhn\',20,9);">20:9</a>; <a onClick="return mV(\'Act\',1,20);">Ac 1:20</a>; <a onClick="return mV(\'Act\',2,\'25-28\');">2:25-28</a>; <a onClick="return mV(\'Act\',3,25);">3:25</a>; <a onClick="return mV(\'Act\',4,11,25,26);">4:11,25,26</a>; <a onClick="return mV(\'Act\',13,\'32-34\');">13:32-34</a>.<P>(3) Based on Authority of the Old Testament.<P><a onClick="return mV(\'Mat\',4,4);">Mt 4:4</a>; <a onClick="return mV(\'Mat\',5,38,43);">5:38,43</a>; <a onClick="return mV(\'Mat\',9,13);">9:13</a>; <a onClick="return mV(\'Mat\',19,4,18);">19:4,18</a>; <a onClick="return mV(\'Mat\',21,1,3,16,42);">21:1,3,16,42</a>; <a onClick="return mV(\'Mat\',22,24,31,32,43);">22:24,31,32,43</a>; <a onClick="return mV(\'Mar\',4,12);">Mr 4:12</a>; <a onClick="return mV(\'Mar\',7,10);">7:10</a>; <a onClick="return mV(\'Mar\',10,19);">10:19</a>; <a onClick="return mV(\'Mar\',11,17);">11:17</a>; <a onClick="return mV(\'Mar\',12,19);">12:19</a>; <a onClick="return mV(\'Luk\',2,22,23);">Lu 2:22,23</a>; <a onClick="return mV(\'Luk\',4,10);">4:10</a>; <a onClick="return mV(\'Luk\',19,46);">19:46</a>; <a onClick="return mV(\'Act\',15,16,17);">Ac 15:16,17</a>; <a onClick="return mV(\'Rom\',1,17);">Ro 1:17</a>; <a onClick="return mV(\'Rom\',4,3,7,8);">4:3,7,8</a>; <a onClick="return mV(\'Rom\',9,25,26);">9:25,26</a>; <a onClick="return mV(\'Rom\',10,5,6,8,11,13,16);">10:5,6,8,11,13,16</a>; <a onClick="return mV(\'Rom\',12,19);">12:19</a>; <a onClick="return mV(\'Rom\',15,21);">15:21</a>; <a onClick="return mV(\'1Cr\',1,19);">1Co 1:19</a> (identity of principle); <a onClick="return mV(\'1Cr\',1,31);">1:31</A>; <a onClick="return mV(\'1Cr\',15,45);">15:45</a>; <a onClick="return mV(\'2Cr\',4,13);">2Co 4:13</a>; <a onClick="return mV(\'2Cr\',6,2,16);">6:2,16</a>; <a onClick="return mV(\'2Cr\',8,15);">8:15</a>; <a onClick="return mV(\'Gal\',3,6,8,\'10-13\',16);">Ga 3:6,8,10,11,12,13,16</a>; <a onClick="return mV(\'Gal\',4,27);">4:27</a>; <a onClick="return mV(\'Eph\',4,8);">Eph 4:8</a>; <a onClick="return mV(\'Eph\',6,2);">6:2</a>; <a onClick="return mV(\'1Ti\',5,18);">1Ti 5:18</a>.<P>See also <a href="./study/isbe/search.html?string=CHRONICLES,+BOOKS+OF">CHRONICLES, BOOKS OF, 5, 7, 10</a>.<P>LITERATURE.<P>The literature is voluminous. Beside the standard commentaries and dictionaries, the reader will do well to consult C. H. Toy, Quotations in the New Testament; Franklin Johnson, Quotations of the New Testament; Cambridge Biblical Essays ("Our Lord\'s Use of the Old Testament" by McNeile); Westcott, Introduction to the Study of the New Testament, Appendix A.``169';
isbe[7215]='Raama`ra\'-a-ma (ra\'ma\'): Thus spelled only in <a onClick="return mV(\'1Ch\',1,9);">1Ch 1:9</a>; elsewhere "Raamah" (ra\'mah). A son of Cush and father of Sheba and Dedan (<a onClick="return mV(\'Gen\',10,7);">Ge 10:7</a> = <a onClick="return mV(\'1Ch\',1,9);">1Ch 1:9</a>). In Ezekiel\'s lament over Tyre (<a onClick="return mV(\'Eze\',27,22);">Eze 27:22</a>) the tribe of Raamah is mentioned along with Sheba as a mercantile people who provided the inhabitants of Tyre with spices, precious stones and gold. It has generally been identified with Regina, mentioned by Ptolemy and Steph. Byzantr. as a city in Southeastern Arabia on the shores of the Persian Gulf. The Septuagint (Rhegma) itself supposes this site. But the Arabic name of the city here indicated is spelled with a "g" and so gives rise to a phonological difficulty. A more probable identification has been found in the Sabean ra\'mah in Southwestern Arabia near Me\'in in the north of Marib. Me\'in was the capital of the old Minaean kingdom.``63';
isbe[7216]='Raamiah`ra-a-mi\'-a (ra\'amyah; Codex Vaticanus Naamia; Codex Alexandrinus, Rheelma): One of the leading men who returned with Zerubbabel from captivity (<a onClick="return mV(\'Neh\',7,7);">Ne 7:7</a>). In the corresponding passage in <a onClick="return mV(\'Ezr\',2,2);">Ezr 2:2</a>, where the same list is named, a slight variation in form is given. "Reelaiah" is the name found in this passage. Doubtless, one is a corruption of the other. Both have the same root meaning.s generally been identified with Regina, mentioned by Ptolemy and Steph. Byzantr. as a city in Southeastern Arabia on the shores of the Persian Gulf. The Septuagint (Rhegma) itself supposes this site. But the Arabic name of the city here indicated is spelled with a "g" and so gives rise to a phonological difficulty. A more probable identification has been found in the Sabean ra\'mah in Southwestern Arabia near Me\'in in the north of Marib. Me\'in was the capital of the old Minaean kingdom.``1';
isbe[7217]='Raamses; Rameses`ra-am\'-sez, ram\'-e-sez (<a onClick="return mV(\'Exd\',1,11);">Ex 1:11</a>), (<a onClick="return mV(\'Gen\',47,11);">Ge 47:11</a>; <a onClick="return mV(\'Exd\',12,37);">Ex 12:37</a>; <a onClick="return mV(\'Num\',33,3,5);">Nu 33:3,5</a>) (ra\'mecec, ra\'amcec; Rhamesse; Egyptian Ra-messu, "Ra created him" (or "it")):<P>1. The Meaning of "Store-Cities":<P>One of the two "settlements" (mickenoth) built, or "built up," by the Hebrews for the Pharaoh, the other being Pithom, to which the Septuagint adds a third, namely, "On which is Heliopolis," a town near Cairo (<a onClick="return mV(\'Exd\',1,11);">Ex 1:11</a>). The Hebrew term mickenoth comes from a root meaning "to settle down" (Arabic sakan, "settlement," Assyrian sakanu or shakanu, "to set"), but it is rendered "strong cities" in Septuagint, "treasure cities" in the King James Version, and (incorrectly) "store-cities" in the Revised Version: The "land of Rameses," where Jacob and his sons settled, was apparently the "field of Zoan" (see <a href="./study/isbe/search.html?string=ZOAN">ZOAN</a>), thus lying in the Delta east of the Bubastic branch of the Nile.<P>2. The Meaning of the Name:<P>It is often assumed that no city called Rameses would have existed before the time of Rameses II, or the 14th century BC, though even before Rameses I the name occurs as that of a brother of Horemhib under the XVIIIth Dynasty. The usual translation "Child of Ra" is grammatically incorrect in Egyptian and as Ra was an ancient name for the "sun" it seems possible that a town may have borne the title "Ra created it" very early. The mention of Rameses in Genesis (<a onClick="return mV(\'Gen\',47,11);">47:11</A>) is often regarded as an anachronism, since no scholar has supposed that Jacob lived as late as the time of Rameses II. This would equally apply to the other notices, and at most would serve to mark the age of the passages in the Pentateuch where Rameses is mentioned, but even this cannot be thought to be proved (see <a href="./study/isbe/search.html?string=EXODUS">EXODUS</a>). According to De Rouge (see Pierret, Vocab. Hieroglyph.,1875, 143) there were at least three towns in Lower Egypt that bore the name Pa Rames-ses ("city of Rameses"); but Brugsch supposes that the place mentioned in the Old Testament was Zoan, to which Rameses II gave this name when making it his capital in the Delta. Dr. Budge takes the same view, while Dr. Naville and others suppose that the site of Raamses has still to be found.<P>3. Situation:<P>There appears to have been no certain tradition preserving the site, for though Silvia (about 385 AD) was told that it lay 4 miles from the town of Arabia (see <a href="./study/isbe/search.html?string=GOSHEN">GOSHEN</a>), she found no traces of such a place. Brugsch ("A New City of Rameses, 1876," Aegyptische Zeitschrift, 69) places one such city in the southern part of Memphis itself. Goodwin (Rec. of Past, Old Series, VI, 11) gives an Egyptian letter describing the "city of Rameses-Miamun," which appears to be Zoan, since it was on the seacoast. It was a very prosperous city when this letter was written, and a pa-khennu or "palace city." It had canals full of fish, lakes swarming with birds, fields of lentils, melons, wheat, onions and sesame, gardens of vines, almonds and figs. Ships entered its harbor; the lotus and papyrus grew in its waters. The inhabitants greeted Rameses II with garlands of flowers. Besides wine and mead, of the "conqueror\'s city," beer was brought to the harbor from the Kati (in Cilicia), and oil from the "Lake Sagabi." There is no reason to suppose that Zoan was less prosperous in the early Hyksos age, when the Hebrews dwelt in its plain, whatever be the conclusion as to the date when the city Rameses received that name. The description above given agrees with the Old Testament account of the possession given by Joseph to his family "in the best of the land, in the land of Rameses" (<a onClick="return mV(\'Gen\',47,11);">Ge 47:11</a>).``28';
isbe[7218]='Rab-Mag`rab\'-mag (rabh-magh; Septuagint has it as a proper noun, Rhabamath): The name of one of the Babylonian princes who were present at the destruction of Jerusalem by Nebuchadnezzar, during the reign of Zedekiah, king of Judah (<a onClick="return mV(\'Jer\',39,3,13);">Jer 39:3,13</a>). The word is a compound, the two parts seemingly being in apposition and signifying tautologically the same thing. The last syllable or section of the word, magh, was the designation among the Medes, Persians and Babylonians for priests and wise men. Its original significance was "great" or "powerful"; Greek megas, Latin magis, magnus. The first syllable, rabh, expresses practically the same idea, that of greatness, or abundance in size, quantity, or power. Thus it might be interpreted the "allwise" or "all-powerful" prince, the chief magician or physician. It is, therefore, a title and not a name, and is accordingly put in appositive relations to the proper name just preceding, as "Nergal-sharezer, the Rab-mag," translated fully, "Nergal-sharezer the chief prince or magician."<P>In harmony with the commonly accepted view, the proper rendering of the text should be, "All the princes of the king of Babylon came in, and sat in the middle gate, to wit, Nergal-sharezer, Samgarnebo, Sarsechim, (the) Rab-saris, Nergal-sharezer, (the) Rab-mag" (<a onClick="return mV(\'Jer\',39,3);">Jer 39:3</a>); and "so Nebuzaradan the captain of the guard sent, and Nebushazban, (the) Rab-saris, and Nergal-sharezer, (the) Rab-mag, and all the chief officers of the king of Babylon" (<a onClick="return mV(\'Jer\',39,13);">Jer 39:13</a>).`<a href="./study/isbe/search.html?string=NERGAL+SHAREZER">NERGAL-SHAREZER</a>`25';
isbe[7219]='Rab-Saris`rab\'-sa-ris (rabh-caric): As with Rab-mag, which is not regarded as a name, but a title, so this is to be regarded as a descriptive title for the person whose name precedes it (see <a href="./study/isbe/search.html?string=RAB-MAG">RAB-MAG</a>). The first part, rabh, signifies "great" or "chief," the second, caric, is the title for eunuch or chamberlain. The translation then would be chief eunuch or the chief of the eunuchs (or chamberlains).<P>The oriental custom was for the king to surround himself with a number of eunuchs, who performed varied kinds of services, both menial and dignified. They usually had charge of his harem; sometimes they occupied court positions. Frequently they superintended the education of the youth. The term itself was sometimes used to designate persons in places of trust who were not emasculated. The above title describes the highest or chief in rank of these eunuchs.<P>The full title is used 3 times, once in connection with the titles of other important officers who were sent by the king of Assyria with a large army to demand the surrender of Jerusalem. The passage would be translated properly, \'And the king of Assyria sent the Tartan and the Rab-saris (the chief eunuch) and the Rabshakeh from Lachish to king Hezekiah\' (<a onClick="return mV(\'2Ki\',18,17);">2Ki 18:17</a>). Again, it refers to a Babylonian whose real name was Sarsechim, who with the other Babylonian princes sat in the middle gate during the capture of Jerusalem. This event is described as having occurred in the 11th year of Zedekiah, king of Judah (<a onClick="return mV(\'Jer\',39,3);">Jer 39:3</a>). The third use is in connection with the name Nebushazban, who, with the other chief officers of the king of Babylon, sent and took Jeremiah out of the court of the guard and committed him to Gedaliah, who was to take him home to dwell with his own people (<a onClick="return mV(\'Jer\',39,13);">Jer 39:13</a>).<P>Thus, it is seen that based upon this accepted theory the three titles would be in their connections as follows:<P>(1) simply "the chief eunuch,"<P>(2) Sarsechim, the Rab-saris (or chief eunuch), and<P>(3) Nebushazban, the Rab-saris (or chief eunuch).`<a href="./study/isbe/search.html?string=ASSYRIA">ASSYRIA</a>; <a href="./study/isbe/search.html?string=EUNUCH">EUNUCH</a>`25';
isbe[7220]='Rabbah`rab\'-a:<P>(1) (rabbah; Rhabba, Rhabbath, Rhabban. The full name is rabbath bene \'ammon; he akra ton huion Ammon, Rhabbath huion Ammon, "Rabbah of the children of Ammon"): This alone of the cities of the Ammonites is mentioned in Scripture, so we may take it as the most important. It is first named in connection with the "bed" or sarcophagus of Og, king of Bashan, which was said to be found here (<a onClick="return mV(\'Deu\',3,11);">De 3:11</a>). It lay east of the territory assigned to Gad (<a onClick="return mV(\'Jos\',13,25);">Jos 13:25</a>). Whatever may have been its history in the interval, it does not appear again in Scripture till the time of David. This monarch sent an embassy of sympathy to King Hanun when his father Nahash died. The kindness was met by wanton insult, which led to the outbreak of war. The Ammonites, strengthened by Aramean allies, were defeated by the Israelites under Joab, and took refuge in Rabbah. After David\'s defeat of the Arameans at Helam a year later, the Ammonites were exposed alone to the full-force of Israel, the ark of the covenant being carried with the troops. The country was ravaged and siege was laid to Rabbah. It was during this siege that Uriah the Hittite by David\'s orders was exposed "in the forefront of the hottest battle" (<a onClick="return mV(\'2Sa\',11,15);">2Sa 11:15</a>), where, treacherously deserted by his comrades, he was slain. How long the siege lasted we do not know; probably some years; but the end was in sight when Joab captured "the city of waters" (<a onClick="return mV(\'2Sa\',12,27);">2Sa 12:27</a>). This may mean that he had secured control of the water supply. In the preceding verse he calls it the "royal city." By the chivalry of his general, David was enabled in person to enjoy the honor of taking the city. Among the booty secured was the crown of Melcom, the god of the Ammonites. Such of the inhabitants as survived he treated with great severity (<a onClick="return mV(\'2Sa\',12,\'26-31\');">2Sa 12:26-31</a>; <a onClick="return mV(\'1Ch\',20,1);">1Ch 20:1</a>).<P>In the utterances of the prophets against Ammon, Rabbah stands for the people, as their most important, or perhaps their only important, city (<a onClick="return mV(\'Jer\',49,2,3);">Jer 49:2,3</a>; <a onClick="return mV(\'Eze\',21,20);">Eze 21:20</a>; <a onClick="return mV(\'Eze\',25,5);">25:5</a>; <a onClick="return mV(\'Amo\',1,14);">Am 1:14</a>). <a onClick="return mV(\'Jer\',49,4);">Jer 49:4</a> speaks of the "flowing valley"—a reference perhaps to the abundance of water and fruitfulness—and the treasures in which she gloried. <a onClick="return mV(\'Eze\',21,21);">Eze 21:21</a> represents the king of Babylon at "the head of the two ways" deciding by means of the divining arrows whether he should march against Jerusalem or against Rabbah. Amos seems to have been impressed with the palaces of Rabbah.<P>The city retained its importance in later times. It was captured by Ptolemy Philadelphus (285-247 BC), who called it Philadelphia. It was a member of the league of ten cities. Antiochus the Great captured it by means of treachery (Polyb. v.71). Josephus (BJ, III, iii, 3) names it as lying east of Peraea. In the 4th century AD, it ranked with Bostra and Gerasa as one of the great fortified cities of Coele-Syria (Ritter, Erdkunde, XV, ii, 1154f). It became the seat of a bishop. Abulfeda (1321 AD) says that Rabbah was in ruins at the time of the Moslem conquest.<P>Rabbah is represented by the modern \'Amman, a ruined site with extensive remains, chiefly from Roman times, some 14 miles northeast of Heshbon, and about 22 miles east of the Jordan. It lies on the northern bank of Wady \'Amman, a tributary of the upper Jabbok, in a well-watered and fruitful valley. Possibly the stream which rises here may be "the waters" referred to in <a onClick="return mV(\'2Sa\',12,27);">2Sa 12:27</a>. Ancient Rabbah may have stood on the hill now occupied by the citadel, a position easy of defense because of its precipitous sides. The outer walls of the citadel appear to be very old; but it is quite impossible to say that anything Ammonite is now above ground. The citadel is connected by means of an underground passage with a large cistern or tank to the north, whence probably it drew its watersupply. This may be the passage mentioned in the account of the capture of the city by Antiochus. "It is," says Conder (Heth and Moab, 158), "one of the finest Roman towns in Syria, with baths, a theater, and an odeum, as well as several large private masonry tombs built in the valley probably in the 2nd century. The fortress on the hill, now surrounding a considerable temple, is also probably of this same date. The church with two chapels farther north, and perhaps some of the tombs, must belong to a later age, perhaps the 4th century. The fine mosque and the fine Moslem building on the citadel hill cannot be earlier than the 7th, and are perhaps as late as the 11th century; and we have thus relics of every building epoch except the Crusading, of which there appears to be no indication."<P>The place is now occupied by Arabs and Circassians who profit by the riches of the soil. It is brought into contact with the outside world by means of the Damascus-Hejaz Railway, which has a station here.<P>(2) (ha-rabbah; Codex Vaticanus Sotheba; Codex Alexandrinus Arebba): An unidentified city of Judah named along with Kiriath-jearim (<a onClick="return mV(\'Jos\',15,60);">Jos 15:60</a>).``54';
isbe[7221]='Rabbi`rab\'-i, rab\'-i (rabbi; rhabbi, or rhabbei): A term used by the Jews of their religious teachers as a title of respect, from rabh, "great," so "my great one" (compare Latin magister), once of masters of slaves, but later of teachers (<a onClick="return mV(\'Mat\',23,7);">Mt 23:7</a>); therefore translated by didaskalos, "teacher" (<a onClick="return mV(\'Mat\',23,8);">Mt 23:8</a>; <a onClick="return mV(\'Jhn\',1,38);">Joh 1:38</a>; compare <a onClick="return mV(\'Jhn\',1,49);">Joh 1:49</a>). In the King James Version frequently rendered "Master" (<a onClick="return mV(\'Mat\',26,25,49);">Mt 26:25,49</a>; <a onClick="return mV(\'Mar\',9,5);">Mr 9:5</a>; <a onClick="return mV(\'Mar\',11,21);">11:21</a>; <a onClick="return mV(\'Mar\',14,45);">14:45</a>; <a onClick="return mV(\'Jhn\',4,31);">Joh 4:31</a>; <a onClick="return mV(\'Jhn\',9,2);">9:2</a>; <a onClick="return mV(\'Jhn\',11,8);">11:8</a>). John the Baptist (<a onClick="return mV(\'Jhn\',3,26);">Joh 3:26</a>), as well as Christ, is addressed with the title (<a onClick="return mV(\'Jhn\',1,49);">Joh 1:49</a>; <a onClick="return mV(\'Jhn\',6,25);">6:25</a>), both by disciples and others. Jesus forbade its use among His followers (<a onClick="return mV(\'Mat\',23,8);">Mt 23:8</a>). Later (Galilean) form of same, <a href="./study/isbe/search.html?string=RABBONI">RABBONI</a> (which see).`<a href="./study/isbe/search.html?string=TALMUD">TALMUD</a>`137';
isbe[7222]='Rabbith`rab\'-ith (ha-rabbith; Codex Vaticanus Dabeiron; Codex Alexandrinus Rhabboth): A town in the territory of Issachar (<a onClick="return mV(\'Jos\',19,20);">Jos 19:20</a>) which is probably represented today by Raba, a village in the southern part of the Gilboa range and north of Ibzaq. The "ha" is, of course, the definite article.``1';
isbe[7223]='Rabble`rab\'-l: This word is not found in the King James Version. the Revised Version (British and American) has it once as the translation of agoraios (literally, "lounger in the market place"), in <a onClick="return mV(\'Act\',17,5);">Ac 17:5</a>, where it replaces "baser sort" of the King James Version. It has the common meaning of an unruly, lawless set who are ready to join a mob.``1';
