covering for sin. The ransom for the deliverance of the sinner was to be by sacrifice. Both the typical testimony of the Law and the prophetic testimony gave prominence to the thought of redemption. The Coming One was to be a Redeemer. Redemption was to be the great work of the Messiah. The people seem to have looked for the redemption of the soul to God alone through the observance of their appointed ritual, while redemption, in the more general sense of deliverance from all enemies and troubles, they linked with the advent of the Messiah. It required a spiritual vision to see that the two things would coincide, that the Messiah would effect redemption in all its phases and fullness by means of ransom, of sacrifice, of expiation.<P>Jesus appeared as the Messiah in whom all the old economy was to be fulfilled. He knew perfectly the meaning of the typical and prophetic testimony; and with that fully in view, knowing that His death was to fulfill the Old Testament types and accomplish its brightest prophetic anticipations, He deliberately uses this term lutron to describe it (<a onClick="return mV(\'Mat\',20,28);">Mt 20:28</a>); in speaking of His death as a ransom, He also regarded it as a sacrifice, an expiatory offering. The strong preposition used intensifies the idea of ransom and expiation, even to the point of substitution. It is anti, "instead of," and the idea of exchange, equivalence, substitution cannot be removed from it. In <a onClick="return mV(\'Num\',3,45);">Nu 3:45</a>, "Take the Levites instead of all the first-born," the Septuagint uses anti, which, like the English "instead of," exactly represents the Hebrew tachath; and all three convey most unmistakably the idea of substitution. And as the Levites were to be substituted for the firstborn, so for the surplus of the firstborn the "ransom money" was to be substituted, that idea, however, being clearly enough indicated by the use of the genitive. Indeed the simpler way of describing a ransom would be with the genitive, the ransom of many; or as our version renders, "a ransom for many"; but just because the ransom here is not simply a money payment, but is the actual sacrifice of the life, the substitution of His soul for many, He is appropriately said "to give his soul a ransom instead of many." The Kingdom of God which Christ proclaimed was so diverse in character from that which Salome and her sons anticipated that, so far from appearing in dazzling splendor, with distinguished places of power for eager aspirants, it was to be a spiritual home for redeemed sinners. Men held captive by sin needed to be ransomed that they might be free to become subjects of the Kingdom, and so the ransom work, the sufferings and death of Christ, must lie at the very foundation of that Kingdom. The need of ransom supposes life forfeited; the ransom paid secures life and liberty; the life which Christ gives comes through His ransoming death.<P>3. The Psalms and Job:<P>Besides the passages in the Pentateuch which we have noted, special mention should be made of the two great passages which bear so closely upon the need of spiritual redemption, and come into line with this great utterance of Christ. <a onClick="return mV(\'Psa\',49,7,8);">Ps 49:7,8</a>, "None of them can by any means redeem (padhah; lutroo) his brother, nor give to God a ransom (kopher; exilasma) for him (for the redemption of their life is costly, and it faileth forever)." (The Hebrew gives pidhyon for "redemption"; the Greek has "the price of the redemption of his soul.") No human power or skill, no forfeit in money or service or life can avail to ransom any soul from the doom entailed by sin. But in <a onClick="return mV(\'Psa\',49,15);">Ps 49:15</a> the triumphant hope is expressed, "But God will redeem (padhah; lutroo) my soul from the power of Sheol." In <a onClick="return mV(\'Job\',33,24);">Job 33:24</a>, "Deliver him from going down to the pit, I have found a ransom": God is the speaker, and whatever may be the particular exegesis of the passage in its original application, it surely contains an anticipation of the gospel redemption. This divine eureka is explained in the light of Christ\'s utterance; it finds its realization through the cross: "I have found a ransom," for "the Son of Man" has given "his soul a ransom for many."<P>4. Apostolic Teaching:<P>This great utterance of the Saviour may well be considered as the germ of all the apostolic teaching concerning redemption, but it is not for us to show its unfolding beyond noting that in apostolic thought the redemption was always connected with the death, the sacrifice of Christ.<P>Thus, Paul (<a onClick="return mV(\'Eph\',1,7);">Eph 1:7</a>), "In whom we have our redemption through his blood." Thus Peter (<a onClick="return mV(\'1Pe\',1,18,19);">1Pe 1:18,19</a>), "Ye were redeemed, not with corruptible things...but with precious blood, as of a lamb without blemish and without spot, even the blood of Christ." So in <a onClick="return mV(\'Hbr\',9,12);">Heb 9:12</a> it is shown that Christ "through his own blood, entered in once for all into the holy place, having obtained eternal redemption"; and in the Apocalypse (<a onClick="return mV(\'Rev\',5,9);">Re 5:9</a>) the song is, "Thou wast slain, and didst purchase unto God with thy blood men of every tribe," etc. In all but the last of these passages there is an echo of the very word used by Christ, apolutrosis and lutrosis, both being connected with lutron. In <a onClick="return mV(\'1Ti\',2,5,6);">1Ti 2:5,6</a> Paul has a still closer verbal coincidence when he says, "Christ Jesus, who gave himself a ransom for all" (antilutron). The word used in the Apocalypse is agorazo, to buy in the open market, and is frequently used of the redeeming work of Christ (<a onClick="return mV(\'Rev\',14,3,4);">Re 14:3,4</a>; <a onClick="return mV(\'2Pe\',2,1);">2Pe 2:1</a>; <a onClick="return mV(\'1Cr\',6,20);">1Co 6:20</a>; <a onClick="return mV(\'1Cr\',7,23);">7:23</a>). In the two places where Paul uses it he adds the means of purchase: "Ye were bought with a price," which from his point of view would be equivalent to ransom. In the passage in <a onClick="return mV(\'Gal\',3,13);">Ga 3:13</a>; <a onClick="return mV(\'Gal\',4,5);">4:5</a>, Paul uses the compound exagorazo, which is equivalent to "redeem, buy off, deliver by paying the price."<P>5. To Whom Was the Ransom Paid?:<P>The question "Who receives the ransom?" is not directly raised in Scripture, but it is one that not unnaturally occurs to the mind, and theologians have answered it in varying ways.<P>(1) Not to Satan.<P>The idea entertained by some of the Fathers (Irenaeus, Origen) that the ransom was given to Satan, who is conceived of as having through the sin of man a righteous claim upon him, which Christ recognizes and meets, is grotesque, and not in any way countenanced by Scripture.<P>(2) To Divine Justice.<P>But in repudiating it, there is no need to go so far as to deny that there is anything answering to a real ransoming transaction. All that we have said goes to show that, in no mere figure of speech, but in tremendous reality, Christ gave "his life a ransom," and if our mind demands an answer to the question to whom the ransom was paid, it does not seem at all unreasonable to think of the justice of God, or God in His character of Moral Governor, as requiring and receiving it. In all that Scripture asserts about propitiation, sacrifice, reconciliation in relation to the work of Christ, it is implied that there is wrath to be averted, someone to be appeased or satisfied, and while it may be enough simply to think of the effects of Christ\'s redeeming work in setting us free from the penal claims of the Law—the just doom of sin—it does not seem going beyond the spirit of Scripture to draw the logical inference that the ransom price was paid to the Guardian of that holy law, the Administrator of eternal justice. "Christ redeemed us from the curse of the law, having become a curse for us" (<a onClick="return mV(\'Gal\',3,13);">Ga 3:13</a>). This essential, fundamental phase of redemption is what theologians, with good Scripture warrant, have called redemption by blood, or by price, as distinguished from the practical outcome of the work of Christ in the life which is redemption by power.<P>(a) Redemption by Price:<P>As to Satan\'s claims, Christ by paying the ransom price, having secured the right to redeem, exercises His power on behalf of the believing sinner. He does not recognize the right of Satan. He is the "strong man" holding his captives lawfully, and Christ the "stronger than he" overcomes him and spoils him, and sets his captives free (<a onClick="return mV(\'Luk\',11,21,22);">Lu 11:21,22</a>). In one sense men may be said to have sold themselves to Satan, but they had no right to sell, nor he to buy, and Christ ignores that transaction and brings "to nought him that had the power of death, that is, the devil" (<a onClick="return mV(\'Hbr\',2,14);">Heb 2:14</a>), and so is able to "deliver all them who through fear of death were all their lifetime subject to bondage" (<a onClick="return mV(\'Hbr\',2,15);">Heb 2:15</a>).<P>(b) Redemption by Power:<P>Many of the Old Testament passages about the redemption wrought on behalf of God\'s people illustrate this redemption by power, and the redemption by power is always founded on the redemption by price; the release follows the ransom. In the case of Israel, there was first the redemption by blood—the sprinkled blood of the Paschal Lamb which sheltered from the destroying angel (<a onClick="return mV(\'Exd\',12,\'1-\');">Ex 12</a>)—and then followed the redemption by power, when by strength of hand Yahweh brought His people out from Egypt (<a onClick="return mV(\'Exd\',13,14);">Ex 13:14</a>), and in His mercy led forth the people which He had redeemed (<a onClick="return mV(\'Exd\',15,13);">Ex 15:13</a>).<P>So under the Gospel when "he hath visited and wrought redemption for his people" (<a onClick="return mV(\'Luk\',1,68);">Lu 1:68</a>), He can "grant unto us that we being delivered out of the hand of our enemies should serve him without fear" (<a onClick="return mV(\'Luk\',1,74);">Lu 1:74</a>). It is because we have in Him our redemption through His blood that we can be delivered out of the power of darkness (<a onClick="return mV(\'Col\',1,13,14);">Col 1:13,14</a>).<P>LITERATURE.<P>See works on New Testament Theology (Weiss, Schmid, Stevens, etc.); articles in Hastings, Dictionary of the Bible (five volumes); Hastings, Dictionary of Christ and the Gospels. Archibald M\'Caig`<a href="./study/isbe/search.html?string=REDEEMER,+REDEMPTION">REDEEMER, REDEMPTION</a>`1';
isbe[7283]='Rape`rap.`<a href="./study/isbe/search.html?string=CRIMES">CRIMES</a>; <a href="./study/isbe/search.html?string=PUNISHMENTS">PUNISHMENTS</a>`1';
isbe[7284]='Rapha, Raphah`ra\'-fa (rapha\'):<P>(1) In the Revised Version margin these names are substituted for "the giant" in <a onClick="return mV(\'1Ch\',20,4,6,8);">1Ch 20:4,6,8</a> and in <a onClick="return mV(\'2Sa\',21,16,18,20,22);">2Sa 21:16,18,20,22</a>. The latter passage states that certain champions of the Philistines who were slain by David\'s warriors had been born to the raphah in Gath. The text is corrupt; Raphah is probably an eponym. Originally the name of one of the Philistines who was of the body "Rephaites" stood in the text. The plural of this word, or at least a plural of this stem, is <a href="./study/isbe/search.html?string=REPHAIM">REPHAIM</a> (which see).<P>(2) Raphah (the King James Version "Rapha"), a descendant of Saul (<a onClick="return mV(\'1Ch\',8,37);">1Ch 8:37</a>).`<a href="./study/isbe/search.html?string=REPHAIAH">REPHAIAH</a>`197';
isbe[7285]='Raphael`ra\'-a-el, ra\'-fa-el (repha\'el, from rapha\' \'el, "God has healed"; Rhaphael): The name of the angel who, as Azarias, guides Tobias to <a href="./study/isbe/search.html?string=ECBATANA">ECBATANA</a> and <a href="./study/isbe/search.html?string=RAGES">RAGES</a> (which see). The purpose of his mission is, in accordance with his name, to cure Tobit of blindness, and to deliver Sarah, the daughter of Raguel, from the power of the evil spirit Asmodaeus (Tobit 3:8; 12:14). Later, in addition, when he reveals himself (Tobit 12:15), he declares that he is "one of the seven holy angels, which present the prayers of the saints, and go in before the glory of the Holy One." These seven angels are derived, according to Dr. Kohut, from the seven Am-shaspands (Amesha-spentas) of Zoroastrianism (compare <a onClick="return mV(\'Rev\',4,5);">Re 4:5</a>). At the head of the elaborate angelology of the Enoch books there are "four presences," and Raphael is one of them (En 40:9; 54:6). In the first of these passages Raphael is the healer; in the second, he with Michael, Gabriel and Phanuel lead the wicked away to punishment. These four presences seem related to the four "living creatures" of Ezekiel (<a onClick="return mV(\'Eze\',1,5);">1:5</a>) and of the Apocalypse (<a onClick="return mV(\'Rev\',4,6);">Re 4:6</a>). While this is the general representation of Raphael\'s position in Enoch, in <span class="noTag">20:3</span> he is named among the angels who "watch," whose number according to the Greek text is seven. Raphael shared in the function assigned to the archangels, in the Oracula Sibyllina, of leading souls to the judgment seat of God (II, 215, Alexandre\'s text). He occupies a prominent place in Jewish medieval writings; he with Michael and Gabriel cured Abraham (Yoma\' 37a); according to the book Zohar, Raphael conveyed to Adam a book containing 72 kinds of wisdom in 670 writings. The painters of the Renaissance frequently depicted Raphael.``173';
isbe[7286]='Raphaim`raf\'-a-im, ra-fa\'-im (Codex Vaticanus omits; Codex Sinaiticus and Codex Alexandrinus have Rhapha(e)in): An ancestor of Judith (Judith 8:1).``1';
isbe[7287]='Raphon`ra\'-fon (Rhapheion): The place where in his campaign east of Jordan Judas inflicted disastrous defeat on the host of Timotheus, the fugitives fleeing for refuge to the temple at Carnaim (1Macc 5:37ff; Ant, XII, viii, 4). The same place is doubtless referred to by Pliny as "Raphana" (NH, v.16). It may possibly be represented by the modern Rafeh, on the east of the pilgrimage road, about 17 miles north of Der\'ah, and 11 miles northeast of Tell el-\'Ash\'ary. It is a mile and a half north of Wady Kanawat, which would thus be the "brook" mentioned in the narrative. It is perhaps far enough away from Carnaim, if this is rightly placed at Tell el-\'Ash\'ary.``54';
isbe[7288]='Raphu`ra\'-fu (raphu\', "one healed"): The father of Palti, the spy selected from the tribe of Benjamin (<a onClick="return mV(\'Num\',13,9);">Nu 13:9</a>).``1';
isbe[7289]='Rasses`ras\'-ez (Rhaasseis, Codex Alexandrinus and Codex Vaticanus, Rhasseis; Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) Tharsis; Old Latin Thiras et Rasis): The children of Rasses are mentioned with Put, Lud and the children of Ishmael as having been subdued by Holofernes (Judith 2:23).<P>Their identity is a matter of conjecture only. Some think Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) Tharsis (= Tarsus) is meant, others Rosh (<a onClick="return mV(\'Eze\',38,2,3);">Eze 38:2,3</a>; <a onClick="return mV(\'Eze\',39,1);">39:1</a>), others Rhosos, a mountain range and city south from Anunus, on the Gulf of Issus. Most probably a district, not a town, is named, situated in the eastern part of Asia Minor.``78';
isbe[7290]='Rathumus`ra-thu\'-mus (Rhathumos): One of those who joined in writing a letter to protest to Artaxerxes against the Jews (1Esdras 2:16ff). In 1Esdras 2:17 he is styled "story-writer," the Revised Version margin "recorder" (ho ta prospiptonta sc. (graphon) = "Rehum the chancellor" of <a onClick="return mV(\'Ezr\',4,8);">Ezr 4:8</a>, Rathumus being a Greek form of Rehum. In 1Esdras 2:16 his title appears as an independent proper name, <a href="./study/isbe/search.html?string=BEELTETHMUS">BEELTETHMUS</a> (which see) (here the King James Version margin gives "Bahumus," a misprint), and in 1Esdras 2:25 R. and Beeltethmus are given as distinct persons.``1';
isbe[7291]='Raven`ra\'-vn (\'orebh; korax; Latin Corvus corax): A large family of the smaller birds of prey belonging to the genus Corvus corax. A bird of such universal distribution that it is known from Iceland to Japan, all over Asia, Europe and Africa, but almost extinct and not of general distribution in our own country. In no land is it more numerous than in Palestine In general appearance it resembles the crow, but is much larger, being almost two feet long, of a glossy black, with whiskers around the beak, and rather stiff-pointed neck feathers. A bird exhibiting as much intelligence as any, and of a saucy, impudent disposition, it has been an object of interest from the beginning. It has been able to speak sentences of a few words when carefully taught, and by its uncanny acts has made itself a bird surrounded by superstition, myth, fable, and is connected with the religious rites of many nations. It is partially a carrion feeder, if offal or bodies are fresh; it also eats the young of other birds and very small animals and seeds, berries and fruit, having as varied a diet as any bird. It is noisy, with a loud, rough, emphatic cry, and its young are clamorous feeding time.<P>Aristotle wrote that ravens drove their young from their location and forced them to care for themselves from the time they left the nest. This is doubtful. Bird habits and characteristics change only with slow ages of evolution. Our ravens of today are, to all intents, the same birds as those of Palestine in the time of Moses, and ours follow the young afield for several days and feed them until the cawing, flapping youngsters appear larger than the parents. In Pliny\'s day, ravens had been taught to speak, and as an instance of their cunning he records that in time of drought a raven found a bucket containing a little water beside a grave and raised it to drinking level by dropping in stones.<P>Palestine has at least 8 different species of ravens. This bird was the first sent out by Noah in an effort to discover if the flood were abating (<a onClick="return mV(\'Gen\',8,\'6-8\');">Ge 8:6-8</a>). Because it partially fed on carrion it was included among the abominations (see <a onClick="return mV(\'Lev\',11,15);">Le 11:15</a>; <a onClick="return mV(\'Deu\',14,14);">De 14:14</a>). On <a onClick="return mV(\'1Ki\',17,\'4-6\');">1Ki 17:4-6</a>, see <a href="./study/isbe/search.html?string=ELIJAH">ELIJAH</a> and the present writer\'s Birds of the Bible, 401-3. Among the marvels of creation and providence in <a onClick="return mV(\'Job\',38,41);">Job 38:41</a>, we have this mention of the raven,<P class="in15">"Who provideth for the raven his prey,<br>When his young ones cry unto God,<br>And wander for lack of food?"<P>The answer to this question is in <a onClick="return mV(\'Psa\',147,9);">Ps 147:9</a>:<P class="in15">"He giveth to the beast his food,<br>And to the young ravens which cry."<P>Both these quotations point out the fact that the young are peculiarly noisy. In <a onClick="return mV(\'Pro\',30,17);">Pr 30:17</a> it is indicated that the ravens, as well as eagles, vultures and hawks, found the eye of prey the vulnerable point, and so attacked it first. The Hebrew \'orebh means "black," and for this reason was applied to the raven, so the reference to the locks of the bridegroom in the So of Solomon becomes clear (<a onClick="return mV(\'Sgs\',5,11);">So 5:11</a>). The raven is one of the birds indicated to prey upon the ruins of Edom (<a onClick="return mV(\'Isa\',34,11);">Isa 34:11</a>). The last reference is found in <a onClick="return mV(\'Luk\',12,24);">Lu 12:24</a>: "Consider the ravens, that they sow not, neither reap; which have no store-chamber nor barn; and God feedeth them." This could have been said of any wild bird with equal truth.``167';
isbe[7292]='Raven; Ravin`rav\'-n, rav\'-in: "Raven" (verb) is from "rapine," "violent plundering, used for Taraph, in <a onClick="return mV(\'Gen\',49,27);">Ge 49:27</a>; <a onClick="return mV(\'Psa\',22,13);">Ps 22:13</a>; <a onClick="return mV(\'Eze\',22,25,27);">Eze 22:25,27</a>, while "ravin" (noun) is the object ravened, in <a onClick="return mV(\'Nah\',2,12);">Na 2:12</a> the torn carcasses (Terephah). So "ravenous bird" (<a onClick="return mV(\'Isa\',46,11);">Isa 46:11</a>; <a onClick="return mV(\'Eze\',39,4);">Eze 39:4</a>) is a bird of prey (not a "hungry bird"), \'ayit, literally, "a screecher." "Ravenous beast" in <a onClick="return mV(\'Isa\',35,9);">Isa 35:9</a> is for parits, "violent one." In the New Testament harpax, "rapacious," is translated "ravening" in <a onClick="return mV(\'Mat\',7,15);">Mt 7:15</a>, while for the cognate harpage (<a onClick="return mV(\'Luk\',11,39);">Lu 11:39</a>), the King James Version gives "ravening," the Revised Version (British and American) "extortion."``1';
isbe[7293]='Razis`ra\'-zis (Rhazeis): "An elder of Jerusalem," "lover of his countrymen," and for his good will toward them called "father of the Jews," accused before the Syrian general Nicanor as an opponent of Hellenism. In order to escape falling into the hands of Nicanor\'s soldiers he committed suicide with the greatest determination in a rather revolting manner (2Macc 14:37ff), in his death calling upon "the Lord of life" in the hope of a resurrection. His suicide—contrary to Jewish sentiment—was regarded with approbation by the author of 2Macc (14:42,43).``1';
isbe[7294]='Razor`ra\'-zer (ta\'ar, "knife" (<a onClick="return mV(\'Num\',6,5);">Nu 6:5</a>; <a onClick="return mV(\'Psa\',52,2);">Ps 52:2</a>; <a onClick="return mV(\'Isa\',7,20);">Isa 7:20</a>; <a onClick="return mV(\'Eze\',5,1);">Eze 5:1</a>), morah, "razor" (<a onClick="return mV(\'Jdg\',13,5);">Jud 13:5</a>; <a onClick="return mV(\'Jdg\',16,17);">16:17</a>; <a onClick="return mV(\'1Sa\',1,11);">1Sa 1:11</a>)).`<a href="./study/isbe/search.html?string=BARBER">BARBER</a>; <a href="./study/isbe/search.html?string=HAIR">HAIR</a>`1';
isbe[7295]='Reading`red\'-ing (miqra\'; anagnosis): As a noun occurs once in the Old Testament (<a onClick="return mV(\'Neh\',3,8);">Ne 3:8</a>) and 3 times in the New Testament (<a onClick="return mV(\'Act\',13,15);">Ac 13:15</a>; <a onClick="return mV(\'2Cr\',3,14);">2Co 3:14</a>; <a onClick="return mV(\'1Ti\',4,13);">1Ti 4:13</a>), each time with reference to the public reading of the Divine Law. The verb "to read" (qara\'; anaginosko) occurs frequently both in the Old Testament and in the New Testament: (1) often in the sense of reading aloud to others, especially of the public reading of God\'s Law or of prophecy, as by Moses (<a onClick="return mV(\'Exd\',24,7);">Ex 24:7</a>), Ezra (<a onClick="return mV(\'Neh\',8,3,18);">Ne 8:3,18</a>), Jesus in the synagogue at Nazareth (<a onClick="return mV(\'Luk\',4,16);">Lu 4:16</a>), of the regular reading of the Law and the Prophets in the synagogues (<a onClick="return mV(\'Act\',13,27);">Ac 13:27</a>; <a onClick="return mV(\'Act\',15,21);">15:21</a>), and of the reading of apostolic epistles in the Christian church (<a onClick="return mV(\'Col\',4,16);">Col 4:16</a>; <a onClick="return mV(\'1Th\',5,27);">1Th 5:27</a>); (2) also in the sense of reading to one\'s self, whether the divine word in Law or prophecy (<a onClick="return mV(\'Deu\',17,19);">De 17:19</a>; <a onClick="return mV(\'Act\',8,\'28-30\');">Ac 8:28-30</a>, etc.), or such things as private letters (<a onClick="return mV(\'2Ki\',5,7);">2Ki 5:7</a>; <a onClick="return mV(\'2Ki\',19,14);">19:14</a>; <a onClick="return mV(\'Act\',23,34);">Ac 23:34</a>, etc.).``49';
isbe[7296]='Ready`red\'-i (mahir): Occurs twice in the sense of apt, skillful (<a onClick="return mV(\'Ezr\',7,6);">Ezr 7:6</a>; <a onClick="return mV(\'Psa\',45,1);">Ps 45:1</a>). the Revised Version (British and American) gives "ready" for "fit" (<a onClick="return mV(\'Pro\',24,27);">Pr 24:27</a>), for "asketh" (<a onClick="return mV(\'Mic\',7,3);">Mic 7:3</a>), for "prepared" (<a onClick="return mV(\'Mar\',14,15);">Mr 14:15</a>), for "not be negligent" (<a onClick="return mV(\'2Pe\',1,12);">2Pe 1:12</a>).``1';
isbe[7297]='Reaiah`re-a\'-ya, re-i\'-a (re\'ayah, "Yah has seen"; Septuagint: Codex Vaticanus, Rhada, A, Rheia):<P>(1) The eponym of a Calebite family (<a onClick="return mV(\'1Ch\',4,2);">1Ch 4:2</a>). The word "Reaiah" should probably be substituted for "Haroeh" in <a onClick="return mV(\'1Ch\',2,52);">1Ch 2:52</a>, but both forms may be corruptions.<P>(2) A Reubenite (<a onClick="return mV(\'1Ch\',5,5);">1Ch 5:5</a>, the King James Version "Reaia").<P>See <a href="./study/isbe/search.html?string=JOEL">JOEL</a>.<P>(3) The family name of a company of Nethinim (<a onClick="return mV(\'Ezr\',2,47);">Ezr 2:47</a>; <a onClick="return mV(\'Neh\',7,50);">Ne 7:50</a> 1Es 5:31).``1';
isbe[7298]='Reaping`rep\'-ing (qatsar; therizo): Reaping in ancient times, as at present, consisted in either pulling up the grain by the roots or cutting it with a sickle (see <a href="./study/isbe/search.html?string=SICKLE">SICKLE</a>), and then binding the stalks into bundles to be carried to the threshing-floor. If the Egyptian sculptures are true to life, reaping was sometimes divided into two operations, the heads of grain and the stalks being reaped separately. In Palestine and Syria both pulling and cutting are still practiced, the former when the ground is stony and the spears scarce. Even where the sickle is used, much of the grain comes up by the roots, owing to the toughness of the dried stalks or the dullness of the sickle. The reaper sometimes wears pieces of cane on the fingers of the hand which gathers the grain in order to protect them from injury by the sharp grasses or the sickle. There were definite laws established by the Hebrews in regard to reaping (<a onClick="return mV(\'Lev\',19,9);">Le 19:9</a>; <a onClick="return mV(\'Lev\',23,10);">23:10</a>; <a onClick="return mV(\'Lev\',25,5,11);">25:5,11</a>; <a onClick="return mV(\'Deu\',16,9);">De 16:9</a>). Samuel mentions the task of reaping the harvest as one of the requirements which would be made by the king for whom the people were clamoring (<a onClick="return mV(\'1Sa\',8,12);">1Sa 8:12</a>).<P>Figurative:<P>The certainty of the consequences of good and evil doing were often typified by the sowing and the reaping of harvests (<a onClick="return mV(\'Job\',4,8);">Job 4:8</a>; <a onClick="return mV(\'Pro\',22,8);">Pr 22:8</a>; <a onClick="return mV(\'Hsa\',8,7);">Ho 8:7</a>; <a onClick="return mV(\'Hsa\',10,12,13);">10:12,13</a>; <a onClick="return mV(\'2Cr\',9,6);">2Co 9:6</a>; <a onClick="return mV(\'Gal\',6,7,8);">Ga 6:7,8</a>). "They that sow in tears shall reap in joy" is found in the liberated captives\' song (<a onClick="return mV(\'Psa\',126,5);">Ps 126:5</a>). "He that regardeth the clouds shall not reap," i.e. a lack of faith in God\'s care will be punished (<a onClick="return mV(\'Ecc\',11,4);">Ec 11:4</a>); compare also the lesson of trust drawn from the birds (<a onClick="return mV(\'Mat\',6,26);">Mt 6:26</a>; <a onClick="return mV(\'Luk\',12,24);">Lu 12:24</a>). Sowing and not reaping the harvest is mentioned as a punishment for disobedience (<a onClick="return mV(\'Job\',31,8);">Job 31:8</a>; <a onClick="return mV(\'Jer\',12,13);">Jer 12:13</a>; <a onClick="return mV(\'Mic\',6,15);">Mic 6:15</a>). Reaping where he sowed not, showed the injustice of the landlord (<a onClick="return mV(\'Mat\',25,26);">Mt 25:26</a>), as did also the withholding of the reapers\' wages (<a onClick="return mV(\'Jam\',5,4);">Jas 5:4</a>). In God\'s Kingdom there is a division of labor: "He that soweth and he that reapeth may rejoice together" (<a onClick="return mV(\'Jhn\',4,\'36-38\');">Joh 4:36-38</a>). In John\'s vision he saw an angel reap the earth (<a onClick="return mV(\'Rev\',14,15,16);">Re 14:15,16</a>).`<a href="./study/isbe/search.html?string=AGRICULTURE">AGRICULTURE</a>; <a href="./study/isbe/search.html?string=GLEANING">GLEANING</a>`133';
isbe[7299]='Rearward`rer\'-word (\'acaph, "to gather," <a onClick="return mV(\'Num\',10,25);">Nu 10:25</a>; <a onClick="return mV(\'Jos\',6,9);">Jos 6:9</a> (the King James Version margin "gathering host"); <a onClick="return mV(\'Isa\',52,12);">Isa 52:12</a>).`<a href="./study/isbe/search.html?string=ARMY">ARMY</a>; <a href="./study/isbe/search.html?string=DAN,+TRIBE+OF">DAN, TRIBE OF</a>; <a href="./study/isbe/search.html?string=WAR">WAR</a>`1';
isbe[7300]='Reason; Reasonable; Reasoning`re\'-z\'n, re\'-z\'n-a-b\'l, re\'-z\'n-ing (yakhach, etc.; logos, dialogizomai, -ismos, etc.): "Reason" with related terms, has a diversity of meanings, representing a large number of Hebrew and Greek words and phrases. In the sense of "cause" or "occasion" it stands in <a onClick="return mV(\'1Ki\',9,15);">1Ki 9:15</a> for dabhar, "a word" (the Revised Version margin "account"), but in most cases renders prepositional forms as "from," "with," "because of," "for the sake," etc. As the ground or argument for anything, it is the translation of ta\'am (<a onClick="return mV(\'Pro\',26,16);">Pr 26:16</a>, the Revised Version margin "answers discreetly"), of yakhach, as in <a onClick="return mV(\'Isa\',1,18);">Isa 1:18</a>, "Come now, and let us reason together" (compare <a onClick="return mV(\'Job\',13,3);">Job 13:3</a>; <a onClick="return mV(\'Job\',15,3);">15:3</a>); in <a onClick="return mV(\'1Sa\',12,7);">1Sa 12:7</a>, the word is shaphat, the Revised Version (British and American) "that I may plead," etc. The principal Greek words for "reason," "reasoning," are those given above. The Christian believer is to be ready to give a reason (logos) for the hope that is in him (<a onClick="return mV(\'1Pe\',3,15);">1Pe 3:15</a> the King James Version). "Reason" as a human faculty or in the abstract sense appears in Apocrypha in <span class="noTag">The Wisdom of Solomon 17:12</span> (logismos); Ecclesiasticus 37:16, "Let reason (logos) go before every enterprise," the Revised Version (British and American) "be the beginning of every work." In <a onClick="return mV(\'Act\',18,14);">Ac 18:14</a>, "reason would" is literally, kata logon, "according to reason"; in <a onClick="return mV(\'Rom\',12,1);">Ro 12:1</a>, for "reasonable (logikos) service," the Revised Version (British and American) has "spiritual," and in the margin "Greek \'belonging to the reason.\' " In the Revised Version (British and American) "reason," etc., occurs much oftener than in the King James Version (compare <a onClick="return mV(\'Lev\',17,11);">Le 17:11</a>; <a onClick="return mV(\'Deu\',28,47);">De 28:47</a>; <a onClick="return mV(\'Jdg\',5,22);">Jud 5:22</a>; <a onClick="return mV(\'Job\',20,2);">Job 20:2</a>; <a onClick="return mV(\'Job\',23,7);">23:7</a>, etc.; <a onClick="return mV(\'Luk\',3,15);">Lu 3:15</a>; <a onClick="return mV(\'Luk\',12,17);">12:17</a>; <a onClick="return mV(\'Act\',17,17);">Ac 17:17</a>, etc.).``185';
