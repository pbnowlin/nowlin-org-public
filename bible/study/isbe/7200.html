isbe[7224]='Rabboni`rab-o\'-ni, rab-o\'-ni (rhabboni, "my great master" (<a onClick="return mV(\'Mar\',10,51);">Mr 10:51</a>); rhabbouni (Westcott-Hort rhabbounei), (<a onClick="return mV(\'Jhn\',20,16);">Joh 20:16</a>)).of agoraios (literally, "lounger in the market place"), in <a onClick="return mV(\'Act\',17,5);">Ac 17:5</a>, where it replaces "baser sort" of the King James Version. It has the common meaning of an unruly, lawless set who are ready to join a mob.`<a href="./study/isbe/search.html?string=RABBI">RABBI</a>`1';
isbe[7225]='Rabshakeh`rab\'-sha-ke, rab-sha\'-ke (rabhshaqeh): A compound word, the first part, rabh, indicating "head" or "chief" (see <a href="./study/isbe/search.html?string=RAB-MAG">RAB-MAG</a>; <a href="./study/isbe/search.html?string=RAB-SARIS">RAB-SARIS</a>). The second part, which in the Aramaic, probably meant "cupbearer," had in this connection and elsewhere, according to later discoveries, an extended significance, and meant chief officer, i.e. chief of the heads or captains.<P>Rabshakeh was one of the officers sent by Sennacherib, the king of Assyria, with the Tartan and the Rabsaris to demand the surrender of Jerusalem, which was under siege by the Assyrian army (<a onClick="return mV(\'2Ki\',18,17,19,26,27,28,37);">2Ki 18:17,19,26,27,28,37</a>; <a onClick="return mV(\'2Ki\',19,4,8);">19:4,8</a>; <a onClick="return mV(\'Isa\',36,2,4,11,12,13,22);">Isa 36:2,4,11,12,13,22</a>; <a onClick="return mV(\'Isa\',37,4,8);">37:4,8</a>). The three officers named went from Lachish to Jerusalem and appeared by the conduit of the upper pool. Having called upon King Hezekiah, his representatives Eliakim, the son of Hilkiah, Shebnah, the scribe, and Joah, the recorder, appeared. Rabshakeh sent through them a message to the king in which he represented himself as the spokesman for the king of Assyria. He derided King Hezekiah in an insolent fashion in representing his trust in Egypt as a bruised reed which would pierce the hand. Likewise his confidence in Yahweh was vain, for He also would be unable to deliver them. Then the officers of the king replied, requesting him to speak in the Syrian language-which they understood, and not in the Jews\' language which the people on the wall understood. This he refused to do, speaking still more loudly in order that they might hear and be persuaded. By bribery and appeal, by promise and by deception he exhorted them to turn traitor to Hezekiah and surrender to him. The people, however, true to the command of Hezekiah (<a onClick="return mV(\'2Ki\',18,36);">2Ki 18:36</a>), "held their peace, and answered him not a word." Afterward Rabshakeh returned and "found the king of Assyria warring against Libnah". (<a onClick="return mV(\'2Ki\',19,8);">2Ki 19:8</a>). From this description it is inferred that Rabshakeh was a man of considerable literary attainment, being able, in all probability, to speak in three languages. He had, in addition to his official power, dauntless courage, an insolent spirit and a characteristic oriental disregard for veracity.``25';
isbe[7226]='Raca`ra\'-ka, ra-ka\' (rhaka, Westcott and Hort, The New Testament in Greek with Codices Sinaiticus (corrected), Vaticanus, Codex E, etc.; rhacha, Tischendorf with Codices Sinaiticus (original hand) and Bezae; Aramaic reqa\', from req, "empty"): Vain or worthless fellow; a term of contempt used by the Jews in the time of Christ. In the Bible, it occurs in <a onClick="return mV(\'Mat\',5,22);">Mt 5:22</a> only, but John Lightfoot gives a number of instances of the use of the word by Jewish writers (Hot. Hebrew., edition by Gandell, Oxford,1859,II, 108). Chrysostom (who was acquainted with Syriac as spoken in the neighborhood of Antioch) says it was equivalent to the Greek su, "thou," used contemptuously instead of a man\'s name. Jerome rendered it inanis aut vacuus absque cerebro. It is generally explained as expressing contempt for a man\'s intellectual capacity (= "you simpleton!"), while more (translated "thou fool"), in the same verse is taken to refer to a man\'s moral and religious character (= "you rascal!" "you impious fellow!"). Thus we have three stages of anger, with three corresponding grades of punishment:<P>(1) the inner feeling of anger (orgizomenos), to be punished by the local or provincial court (te krisei, "the judgment");<P>(2) anger breaking forth into an expression of scorn (Raca), to be punished by the Sanhedrin (to sunedrio, "the council");<P>(3) anger culminating in abusive and defamatory language (More), to be punished by the fire of Gehenna.<P>This view, of a double climax, which has been held by foremost English and Gor. commentators, seems to give the passage symmetry and gradation. But it is rejected among others by T. K. Cheyne, who, following J. P. Peters, rearranges the text by transferring the clause "and whosoever shall say to his brother, Raca, shall be in danger of the council" to the end of the preceding verse (Encyclopaedia Biblica, IV, cols. 4001f). There certainly does not seem to be trustworthy external evidence to prove that the terms "the judgment," "the council," "the Gehenna of fire" stand to each other in a relation of gradation, as lower and higher legal courts, or would be so understood by Christ\'s hearers. What is beyond dispute is that Christ condemns the use of disparaging and insulting epithets as a supreme offense against the law of humanity, which belongs to the same category as murder itself. It should be added, however, that it is the underlying feeling and not the verbal expression as such that constitutes the sin. Hence, our Lord can, without any real inconsistency, address two of His followers as "foolish men" (<a onClick="return mV(\'Luk\',24,25);">Lu 24:25</a>, anoetoi, practically equivalent to Raca, as is also James\'s expression, "O vain man," <a onClick="return mV(\'Jam\',2,20);">Jas 2:20</a>).``49';
isbe[7227]='Racal`ra\'-kal (rakhal, "trader"): A place in Judah, enumerated among "the places where David himself and his men were wont to haunt," to the elders of which he sent a share of his spoils (<a onClick="return mV(\'1Sa\',30,29);">1Sa 30:29</a>). The Septuagint reading "Carmel" has been adopted, by many, because of the similarity of the words in Hebrew (rakal and karmel) and because there was a Carmel in the neighborhood of Hebron (<a onClick="return mV(\'Jos\',15,55);">Jos 15:55</a>; <a onClick="return mV(\'1Sa\',15,12);">1Sa 15:12</a>), which figures in the story of David\'s adventures when pursued by Saul (<a onClick="return mV(\'1Sa\',25,\'1-\');">1Sa 25</a>) in a manner that makes it improbable that he would overlook the place in his good fortune (the King James Version "Rachal").``81';
isbe[7228]='Race`ras (merox; agon, dromos).`<a href="./study/isbe/search.html?string=GAMES">GAMES</a>`1';
isbe[7229]='Races`ras\'-iz.`<a href="./study/isbe/search.html?string=TABLE+OF+NATIONS">TABLE OF NATIONS</a>`1';
isbe[7230]='Rachab`ra\'-kab (Rhachab): the King James Version; Greek form of "Rahab" (thus <a onClick="return mV(\'Mat\',1,5);">Mt 1:5</a> the Revised Version (British and American)).``1';
isbe[7231]='Rachal`ra\'-kal.`<a href="./study/isbe/search.html?string=RACAL">RACAL</a>`1';
isbe[7232]='Rachel`ra\'-chel (rachel, "ewe"; Rhachel (<a onClick="return mV(\'Gen\',29,6);">Ge 29:6</a>; <a onClick="return mV(\'Jer\',31,15);">Jer 31:15</a>, the King James Version "Rahel")):<P>1. Biography:<P>An ancestress of Israel, wife of Jacob, mother of Joseph and Benjamin. Rachel was the younger daughter of Laban, the Aramean, the brother of Jacob\'s mother; so Rachel and Jacob were cousins. They met for the first time upon the arrival of Jacob at Haran, when attracted by her beauty he immediately fell in love with her, winning her love by his chivalrous act related in <a onClick="return mV(\'Gen\',29,10);">Ge 29:10</a>ff. According to the custom of the times Jacob contracted with Laban for her possession, agreeing to serve him 7 years as the stipulated price (<a onClick="return mV(\'Gen\',29,\'17-20\');">29:17-20</A>). But when the time had passed, Laban deceived Jacob by giving him Leah instead of Rachel. When Jacob protested, Laban gave him Rachel also, on condition that Jacob serve 7 years more (<a onClick="return mV(\'Gen\',29,\'21-29\');">29:21-29</a>). To her great dismay "Rachel was barren" (<a onClick="return mV(\'Gen\',29,30,31);">Ge 29:30,31</a>), while Leah had children. Rachel, envious of her sister, complained to Jacob, who reminded her that children are the gift of God. Then Rachel resorted to the expedient once employed by Sarah under similar circumstances (<a onClick="return mV(\'Gen\',16,2);">16:2</A>ff); she bade Jacob take her handmaid Bilhah, as a concubine, to "obtain children by her" (<a onClick="return mV(\'Gen\',30,3);">30:3</a>). Dan and Naphtali were the offspring of this union. The evil of polygamy is apparent from the dismal rivalry arising between the two sisters, each seeking by means of children to win the heart of Jacob. In her eagerness to become a mother of children, Rachel bargained with Leah for the mandrakes, or love-apples of her son Reuben, but all to no avail (<a onClick="return mV(\'Gen\',30,14);">Ge 30:14</a>). Finally God heard her prayer and granted her her heart\'s desire, and she gave birth to her firstborn whom she named Joseph (<a onClick="return mV(\'Gen\',30,\'22-24\');">Ge 30:22-24</a>).<P>Some years after this, when Jacob fled from Laban with his wives, the episode of theft of the teraphim of Laban by Rachel, related in <a onClick="return mV(\'Gen\',31,19,34,35);">Ge 31:19,34,35</a>, occurred. She hoped by securing the household gods of her father to bring prosperity to her own new household. Though she succeeded by her cunning in concealing them from Laban, Jacob later, upon discovering them, had them put away (<a onClick="return mV(\'Gen\',35,2,3,4);">35:2-4</A>). In spite of all, she continued to be the favorite of Jacob, as is clearly evidenced by <a onClick="return mV(\'Gen\',33,2);">33:2</A>, where we are told that he assigned to her the place of greatest safety, and by his preference for Joseph, her son. After the arrival in Canaan, while they were on the way from Beth-el to Ephrath, i.e. Bethlehem, Rachel gave birth to her second son, Benjamin, and died (<a onClick="return mV(\'Gen\',35,16);">35:16</A>ff).<P>2. Character:<P>In a marked manner Rachel\'s character shows the traits of her family, cunning and covetousness, so evident in Laban, Rebekah and Jacob. Though a believer in the true God (<a onClick="return mV(\'Gen\',30,6),8,22;">Ge 30:6,8,22</a>), she was yet given to the superstitions of her country, the worshipping of the teraphim, etc. (<a onClick="return mV(\'Gen\',31,19);">Ge 31:19</a>). The futility of her efforts in resorting to self-help and superstitious expedients, the love and stronger faith of her husband (<a onClick="return mV(\'Gen\',35,\'2-4\');">Ge 35:2-4</a>), were the providential means of purifying her character. Her memory lived on in Israel long after she died. In <a onClick="return mV(\'Rth\',4,11);">Ru 4:11</a>, the names of Rachel and Leah occur in the nuptial benediction as the foundresses of the house of Israel.``1';
isbe[7233]='Rachel\'s Tomb`(matstsebheth qebhurath rachel): In <a onClick="return mV(\'Gen\',35,20);">Ge 35:20</a> we read: "Jacob set up a pillar upon her grave: the same is the Pillar of Rachel\'s grave unto this day," i.e. the time of the writer. Though the pillar, i.e sepulchral monument, has long disappeared, the spot is marked until this day, and Christians, Jews and Mohammedans unite in honoring it. The present tomb, which, apparently, is not older than the 15th century, is built in the style of the small-domed buildings raised by Moslems in honor of their saints. It is a rough structure of four square walls, each about 23 ft. long and 20 ft. high; the dome rising 10 ft. higher is used by Mohammedans for prayer, while on Fridays the Jews make supplication before the empty tomb within. It is doubtful, but probable, that it marks the exact spot where Rachel was buried. There are, apparently, two traditions as to the location of the place. The oldest tradition, based upon <a onClick="return mV(\'Gen\',35,\'16-20\');">Ge 35:16-20</a>; <a onClick="return mV(\'Gen\',48,7);">48:7</a>, points to a place one mile north of Bethlehem and 4 miles from Jerusalem. <a onClick="return mV(\'Mat\',2,18);">Mt 2:18</a> speaks for this place, since the evangelist, reporting the slaughter of the innocents of Bethlehem, represents Rachel as weeping for her children from her neighboring grave. But according to <a onClick="return mV(\'1Sa\',10,2);">1Sa 10:2</a>ff, which apparently represents another tradition, the place of Rachel\'s grave was on the "border of Benjamin," near Beth-el, about 10 miles north of Jerusalem, at another unknown Ephrath. This location, some believe, is corroborated by <a onClick="return mV(\'Jer\',31,15);">Jer 31:15</a>, where the prophet, in relating the leading away of the people of Ramah, which was in Benjamin, into captivity, introduces Rachel the mother of that tribe as bewailing the fate of her descendants. Those that believe this northern location to be the place of Rachel\'s grave take the words, "the same is Beth-lehem," in <a onClick="return mV(\'Gen\',35,19);">Ge 35:19</a>; <a onClick="return mV(\'Gen\',48,7);">48:7</a>, to be an incorrect gloss; but that is a mere assumption lacking sufficient proof.<P>Mr. Nathan Strauss, of New York City, has purchased the land surrounding Rachel\'s grave for the purpose of erecting a Jewish university in the Holy Land.``141';
isbe[7234]='Raddai`rad\'-a-i, ra-da\'-i (radday, "beating down"(?)): The 5th of the 7 sons of Jesse, father of David, according to <a onClick="return mV(\'1Ch\',2,14);">1Ch 2:14</a> Septuagint, Codex Alexdrinus, "Rhaddai"; Lucian, "Rhedai"; others, "Zaddai".epulchral monument, has long disappeared, the spot is marked until this day, and Christians, Jews and Mohammedans unite in honoring it. The present tomb, which, apparently, is not older than the 15th century, is built in the style of the small-domed buildings raised by Moslems in honor of their saints. It is a rough structure of four square walls, each about 23 ft. long and 20 ft. high; the dome rising 10 ft. higher is used by Mohammedans for prayer, while on Fridays the Jews make supplication before the empty tomb within. It is doubtful, but probable, that it marks the exact spot where Rachel was buried. There are, apparently, two traditions as to the location of the place. The oldest tradition, based upon <a onClick="return mV(\'Gen\',35,\'16-20\');">Ge 35:16-20</a>; <a onClick="return mV(\'Gen\',48,7);">48:7</a>, points to a place one mile north of Bethlehem and 4 miles from Jerusalem. <a onClick="return mV(\'Mat\',2,18);">Mt 2:18</a> speaks for this place, since the evangelist, reporting the slaughter of the innocents of Bethlehem, represents Rachel as weeping for her children from her neighboring grave. But according to <a onClick="return mV(\'1Sa\',10,2);">1Sa 10:2</a>ff, which apparently represents another tradition, the place of Rachel\'s grave was on the "border of Benjamin," near Beth-el, about 10 miles north of Jerusalem, at another unknown Ephrath. This location, some believe, is corroborated by <a onClick="return mV(\'Jer\',31,15);">Jer 31:15</a>, where the prophet, in relating the leading away of the people of Ramah, which was in Benjamin, into captivity, introduces Rachel the mother of that tribe as bewailing the fate of her descendants. Those that believe this northern location to be the place of Rachel\'s grave take the words, "the same is Beth-lehem," in <a onClick="return mV(\'Gen\',35,19);">Ge 35:19</a>; <a onClick="return mV(\'Gen\',48,7);">48:7</a>, to be an incorrect gloss; but that is a mere assumption lacking sufficient proof.o, following J. P. Peters, rearranges the text by transferring the clause "and whosoever shall say to his brother, Raca, shall be in danger of the council" to the end of the preceding verse (Encyclopaedia Biblica, IV, cols. 4001f). There certainly does not seem to be trustworthy external evidence to prove that the terms "the judgment," "the council," "the Gehenna of fire" stand to each other in a relation of gradation, as lower and higher legal courts, or would be so understood by Christ\'s hearers. What is beyond dispute is that Christ condemns the use of disparaging and insulting epithets as a supreme offense against the law of humanity, which belongs to the same category as murder itself. It should be added, however, that it is the underlying feeling and not the verbal expression as such that constitutes the sin. Hence, our Lord can, without any real inconsistency, address two of His followers as "foolish men" (<a onClick="return mV(\'Luk\',24,25);">Lu 24:25</a>, anoetoi, practically equivalent to Raca, as is also James\'s expression, "O vain man," <a onClick="return mV(\'Jam\',2,20);">Jas 2:20</a>).``1';
isbe[7235]='Radiant`ra\'-di-ant (nahar, "to sparkle" i.e. (figurative) be cheerful; hence (from the sheen of a running stream), to flow, i.e. (figurative) assemble; flow (together), be lightened): the American Standard Revised Version substitutes the active "radiant" for the passive "were lightened" in <a onClick="return mV(\'Psa\',34,5);">Ps 34:5</a>; <a onClick="return mV(\'Isa\',60,5);">Isa 60:5</a> (English Revised Version, the King James Version "flow together"). As the earth and moon, both being dark, face a common sun and lighten each other, they are not only lightened, but radiant. So with the believers, "They looked unto him (Yahweh), and were radiant." Thus nahar combines the two ideas of being lightened and flowing together. This appears, also, in a different connection, in <a onClick="return mV(\'Isa\',60,5);">Isa 60:5</a>, "Then thou shalt see and be radiant." "It is liquid light—light that ripples and sparkles and runs across the face;...the light which a face catches from sparkling water" (G.A. Smith, Isaiah, II, 430).``91';

isbe[7237]='Rafter`raf\'-ter (<a onClick="return mV(\'Sgs\',1,17);">So 1:17</a>).`<a href="./study/isbe/search.html?string=GALLERY">GALLERY</a>; <a href="./study/isbe/search.html?string=HOUSE">HOUSE</a>`1';
isbe[7238]='Rag`Plural in <a onClick="return mV(\'Pro\',23,21);">Pr 23:21</a>, "Drowsiness will clothe a man with rags" (qera\'im "torn garment"; compare <a onClick="return mV(\'1Ki\',11,30);">1Ki 11:30</a>), and figuratively in <a onClick="return mV(\'Isa\',64,6);">Isa 64:6</a> the King James Version, "All our righteousnesses are as filthy rags," in the sense of "tattered clothing" (beghedh, the Revised Version (British and American) "garment"). In <a onClick="return mV(\'Jer\',38,11,12);">Jer 38:11,12</a> the American Standard Revised Version translates cechabhah, as "rag" (the King James Version, the English Revised Version "old cast clout"), while the King James Version, the English Revised Version use "rotten rag" for melach (the American Standard Revised Version "worn-out garment"). Both cechabhah and melach mean "worn out."``1';
isbe[7239]='Ragau`ra\'-go (Rhagau (Westcott-Hort): the King James Version; Greek form of "Reu" (thus, the Revised Version (British and American)) (<a onClick="return mV(\'Luk\',3,35);">Lu 3:35</a>).``1';
isbe[7240]='Rages; Ragau`ra\'-jez, ra\'-go<P>1. Location:<P>("Rages," Tobit 1:14; 4:1,20; 5:5; 6:9,12; 9:2; "Ragau," Judith 1:5,15; Rhagai, Rhaga, Rhage, Rhagau; in Darius\' Behistun Inscriptions, II,71,72, Raga, a province; in Avesta, Vend. I,15,Ragha, city and province; perhaps, "the excellent"): In Eastern Media, one forced march from Caspian Gates, 11 days\' journey from Ecbatana, 5 1/2 miles south of present Tehran; the capital of the province of the same name, though by Ptolemy called Rhagiana.<P>2. History:<P>(1) Ancient.<P>A very ancient city, the traditional birthplace of Zoroaster (Zarathustra; Pahlavi Vendidad, Zad sparad XVI,12,and Dabistan i Mazahib). In Yasna XIX,18,of the Avesta, it is thus mentioned: "The Zoroastrian, four-chief-possessing Ragha, hers are the royal chiefs, both the house-chief, the village-chief, and the town-chief: Zoroaster is the fourth." In Vend. I, 15: "As the tenth, the best of both districts and cities, I, who am Ahura Mazda, did create Ragha, which possesses the three classes," i.e. fire-priests, charioteers, husbandmen. Later it was the religious center of magism. A large colony of captive Israelites settled there. Destroyed in Alexander\'s time, it was rebuilt by Seleucus Nicator (circa 300 BC), who named it Europos. Later, Arsaces restored it and named it Arsacia.<P>(2) Medieval.<P>In the early Middle Ages Ragha, then called Rai, was a great literary and often political center with a large population. It was the birthplace of Harun\'al Rashid (763 AD). It was seized and plundered (1029 AD) by Sultan Machmud, but became Tughril\'s capital. In the Vis o Roman (circa 1048 AD) it is an important place, 10 days journey across the Kavir desert from Merv. It was a small provincial town in about 1220 AD. It was sacked by Mongols in 1220 AD and entirely destroyed under Ghazan Khan circa 1295. A Zoroastrian community lived there in 1278 AD, one of whom composed the Zardtusht-Namah. (3) Present Condition.<P>Near the ruins there now stands the village of Shah Abdu\'l \'Acim, connected with Tehran by the only railway in Persia (opened in 1888).<P>LITERATURE<P>Ptolemy, Diodorus Siculus, Pliny, Strabo; Ibnu\'l Athir, Jami\'ut Tawarikh, Tarikh i Jahan-gusha Yaqut; Justi, Iranisches Namenbuch; E.G. Browne, Literary Hist of Persia; modern travelers.``175';
isbe[7241]='Raguel (1)`ra-gu\'-el, rag\'-u-el (Rhagouel): "The friend of God," of Ecbatana, the husband of Edna, father of Sarah, and father-in-law of Tobias (Tobit 3:7,17; 6:10; 7:2f; 14:12). In Tobit 7:2 he is called cousin of Tobit, and in Tobit 6:10 the King James Version he is erroneously represented as "cousin" of Tobias = "kinsman" in the Revised Version (British and American). In Enoch 20:4 Raguel appears as one of the archangels, perhaps by confusion for Raphael (Tobit 3:17). Another form of the name is <a href="./study/isbe/search.html?string=REUEL">REUEL</a> (which see). one of whom composed the Zardtusht-Namah.``1';
isbe[7242]='Raguel (2)`ra-gu\'-el, rag\'-u-el (re\'u\'-el; Septuagint: Rhagouel): The Midianite chothen, i.e. either father-in-law or brother-in-law of Moses (<a onClick="return mV(\'Num\',10,29);">Nu 10:29</a> the King James Version, the Revised Version (British and American) "Reuel"), the father of Hobab, called a Kenite, who is likewise described as a chothen of Moses (<a onClick="return mV(\'Jdg\',4,11);">Jud 4:11</a>). See <a href="./study/isbe/search.html?string=RELATIONSHIPS,+FAMILY">RELATIONSHIPS, FAMILY</a>. Moses\' wife\'s father is called re\'u\'el in <a onClick="return mV(\'Exd\',2,18);">Ex 2:18</a> where Lucian reads "Iothor" and English Versions of the Bible "Reuel," which transliteration is adopted in the Revised Version (British and American) in <a onClick="return mV(\'Num\',10,29);">Nu 10:29</a> also. In other passages the chothen of Moses is called "Jether" or "Jethro." Among the harmonizations suggested the following are worthy of consideration:<P>(a) that all are names or perhaps titles of one man (Rashi);<P>(b) that Reuel was the father of Hobab and Jethro, that Jethro was the father-in-law of Moses, and that the word "father" is used for grandfather in <a onClick="return mV(\'Exd\',2,18);">Ex 2:18</a>;<P>(c) that Reuel was the father-in-law and Jethro and Hobab brothers-in-law;<P>(d) that either Reuel or Hobab is to be identified with Jethro.<P>None of these views is free from difficulty, nor is the view of those who would give Jethro as the name in the Elohist (E) and Reuel as that in the Jahwist (Jahwist) and (J-E).`<a href="./study/isbe/search.html?string=REUEL">REUEL</a>`81';
isbe[7243]='Rahab`ra\'-hab:<P>(1) (rachabh, "broad"; in Josephus, Ant, V, i,2,7, Rhachab; <a onClick="return mV(\'Hbr\',11,31);">Heb 11:31</a> and <a onClick="return mV(\'Jam\',2,25);">Jas 2:25</a>, Rhaab): A zonah, that is either a "harlot," or, according to some, an "innkeeper" in Jericho; the Septuagint porne, "harlot"). The two spies sent by Joshua from Shittim came into her house and lodged there (<a onClick="return mV(\'Jos\',2,1);">Jos 2:1</a>). She refused to betray them to the king of Jericho, and when he demanded them, she hid them on the roof of her house with stalks of flax that she had laid in order to dry. She pretended that they had escaped before the shutting of the gate, and threw their pursuers off their track. She then told the spies of the fear that the coming of the Israelites had caused in the minds of the Canaanites—"Our hearts did melt...for Yahweh your God, he is God in heaven above, and on earth beneath"—and asked that the men promise to spare her father, mother, brothers and sisters, and all that they had. They promised her to spare them provided they would remain in her house and provided she would keep their business secret. Thereupon she let them down by a cord through the window, her house being built upon the town wall, and gave them directions to make good their escape (<a onClick="return mV(\'Jos\',2,\'1-24\');">Jos 2:1-24</a>). True to their promise, the Israelites under Joshua spared Rahab and her family (<a onClick="return mV(\'Jos\',6,16);">Jos 6:16</a> the King James Version); "And," says the author of Joshua, "she dwelleth in Israel even unto this day." Her story appealed strongly to the imagination of the people of later times. <a onClick="return mV(\'Hbr\',11,31);">Heb 11:31</a> speaks of her as having been saved by faith; James, on the other hand, in demonstrating that a man is justified by works and not by faith only, curiously chooses the same example (<a onClick="return mV(\'Jam\',2,25);">Jas 2:25</a>). Jewish tradition has been kindly disposed toward Rahab; one hypothesis goes so far as to make her the wife of Joshua himself (Jewish Encyclopedia, under the word). Naturally then the other translation of zonah, deriving it from zun, "to feed," instead of zanah, "to be a harlot," has been preferred by some of the commentators.<P>(2) (Rhachab): Josephus, Ant, V,1,2,7,so spells the name of (1) Septuagint and New Testament contra). The wife of Salmon and mother of Booz (Boaz) according to the genealogy in <a onClick="return mV(\'Mat\',1,5);">Mt 1:5</a>. Query, whether there was a tradition identifying (1) and (2); see Lightfoot, Horae Hob on <a onClick="return mV(\'Mat\',1,5);">Mt 1:5</a>.<P>(3) (rahabh, literally, "storm," "arrogance"): A mythical sea-monster, probably referred to in several passages where the word is translated as a common noun "pride" (<a onClick="return mV(\'Job\',9,13);">Job 9:13</a>), "the proud" (<a onClick="return mV(\'Job\',26,12);">Job 26:12</a>; compare <a onClick="return mV(\'Psa\',89,10);">Ps 89:10</a>). It is used in parallelism with tannin, "the dragon" (<a onClick="return mV(\'Isa\',51,9);">Isa 51:9</a>). It is most familiar as an emblem of Egypt, \'the boaster that sitteth still\' (<a onClick="return mV(\'Isa\',30,7);">Isa 30:7</a>; <a onClick="return mV(\'Psa\',87,4);">Ps 87:4</a>; compare <a onClick="return mV(\'Psa\',89,10);">Ps 89:10</a>). The Talmud in Babha\' Bathra\' speaks of rahabh as sar ha-yam, "master of the sea."`<a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>`81';
isbe[7244]='Raham`ra\'-ham (racham, "pity," "love"): Son of Shema, and father of Jorkeam (<a onClick="return mV(\'1Ch\',2,44);">1Ch 2:44</a>).``1';
isbe[7245]='Rahel`ra\'-hel (<a onClick="return mV(\'Jer\',31,15);">Jer 31:15</a> the King James Version).`<a href="./study/isbe/search.html?string=RACHEL">RACHEL</a>`1';
isbe[7246]='Raid`rad (<a onClick="return mV(\'1Sa\',27,10);">1Sa 27:10</a>).`<a href="./study/isbe/search.html?string=WAR">WAR</a>`1';
isbe[7247]='Rail; Railing; Railer,`ral, ral\'-ing, ral\'-er: To "rail" on (in modern usage "against") anyone is to use insolent or reproachful language toward one. It occurs in the Old Testament as the translation of charaph (<a onClick="return mV(\'2Ch\',32,17);">2Ch 32:17</a>, "letters to rail on Yahweh"), and of \'it (<a onClick="return mV(\'1Sa\',25,14);">1Sa 25:14</a>, of Nabal, "he railed at them," the English Revised Version "flew upon them," margin "railed on"). In the New Testament "to rail" is the translation of blasphemeo (<a onClick="return mV(\'Mar\',15,29);">Mr 15:29</a>; <a onClick="return mV(\'Luk\',23,39);">Lu 23:39</a>; "railing," <a onClick="return mV(\'1Ti\',6,4);">1Ti 6:4</a>; <a onClick="return mV(\'2Pe\',2,11);">2Pe 2:11</a>; <a onClick="return mV(\'Jud\',1,9);">Jude 1:9</a>). The word loidoria, rendered railing" in <a onClick="return mV(\'1Pe\',3,9);">1Pe 3:9</a> the King James Version, is in the Revised Version (British and American) "reviling," and loidoros, "railor," in <a onClick="return mV(\'1Cr\',5,11);">1Co 5:11</a> is in the Revised Version (British and American) "reviler."`<a href="./study/isbe/search.html?string=RACA">RACA</a>`185';
isbe[7248]='Raiment`ra\'-ment.`<a href="./study/isbe/search.html?string=DRESS">DRESS</a>`1';
isbe[7249]='Raiment, Soft`(malakos): In <a onClick="return mV(\'Mat\',11,8);">Mt 11:8</a> English Versions of the Bible, where Jesus, speaking of John the Baptist, asks "What went ye out to see? a man clothed in soft raiment?" where "raiment," though implied, is not expressed in the best text, but was probably added from <a onClick="return mV(\'Luk\',7,25);">Lu 7:25</a> parallel. It is equivalent to "elegant clothing," such as courtiers wore, as shown by the words following, "Behold, they that wear soft raiment are in kings\' houses." John had bravely refused to play courtier and had gone to prison for it. In the early days of Herod the Great some scribes who attached themselves to him laid aside their usual plain clothing and wore the gorgeous raiment of courtiers (Jost, in Plumptre).``47';
isbe[7250]='Rain`ran (matar, Arabic (?), matar, "rain" geshem, "heavy rain" moreh, "early rain," yoreh, "former rain," malqosh, "latter rain"; brecho, huetos):<P>1. Water-Supply in Egypt and Palestine:<P>In Egypt there is little or no rainfall, the water for vegetation being supplied in great abundance by the river Nile; but in Syria and Palestine there are no large rivers, and the people have to depend entirely on the fall of rain for water for themselves, their animals and their fields. The children of Israel when in Egypt were promised by Yahweh a land which "drinketh water of the rain of heaven" (<a onClick="return mV(\'Deu\',11,11);">De 11:11</a>). Springs and fountains are found in most of the valleys, but the flow of the springs depends directly on the fall of rain or snow in the mountains.<P>2. Importance of Rain in Season:<P>The cultivation of the land in Palestine is practically dry farming in most of the districts, but even then some water is necessary, so that there may be moisture in the soil. In the summer months there is no rain, so that the rains of the spring and fall seasons are absolutely essential for starting and maturing the crops. The lack of this rain in the proper time has often been the cause of complete failure of the harvest. A small difference in the amount of these seasonal rains makes a large difference in the possibility of growing various crops without irrigation. Ellsworth Huntington has insisted on this point with great care in his very important work, Palestine and Its Transformation. The promise of prosperity is given in the assurance of "rain in due season" (<a onClick="return mV(\'Lev\',26,4);">Le 26:4</a> the King James Version). The withholding of rain according to the prophecy of Elijah (<a onClick="return mV(\'1Ki\',17,1);">1Ki 17:1</a>) caused the mountain streams to dry up (<a onClick="return mV(\'1Ki\',17,7);">1Ki 17:7</a>), and certain famine ensued. A glimpse of the terrible suffering for lack of water at that time is given us. The people were uncertain of another meal (<a onClick="return mV(\'1Ki\',17,12);">1Ki 17:12</a>), and the animals were perishing (<a onClick="return mV(\'1Ki\',18,5);">1Ki 18:5</a>).<P>3. Amount of Rainfall:<P>Palestine and Syria are on the borderland between the sea and the desert, and besides are so mountainous, that they not only have a great range of rainfall in different years, but a great variation in different parts of the country.<P>The amount of rain on the western slopes is comparable with that in England and America, varying from 25 to 40 inches per annum, but it falls mostly in the four winter months, when the downpour is often very heavy, giving oftentimes from 12 to 16 inches in a month. On the eastern slopes it is much less, varying from 8 to 20 inches per annum. The highest amount falls in the mountains of Lebanon where it averages about 50 inches. In Beirut the yearly average <span class="noTag" is</span> 35,87 inches. As we go south from Syria, the amount decreases (Haifa 27,75, Jaffa 22,39, Gaze 17,61), while in the Sinaitic Peninsula there is little or none. Going from west to east the change is much more sudden, owing to the mountains which stop the clouds. In Damascus the average is less than 10 inches. In Jerusalem the average for 50 years <span class="noTag">is</span> 26,16 in., and the range is from 13,19 in 1870 to 41,62 in 1897. The yearly records as given by J. Glaisher and A. Datzi in Palestine Exploration Fund Quarterly from 1861 to 1910, 50 years, are given in the accompanying table.``1';
isbe[7251]='Rainbow`ran\'-bo (qesheth, translated "a bow"; iris, "rainbow"): As most of the rainfall in Palestine is in the form of short heavy showers it is often accompanied by the rainbow. Most beautiful double bows are often seen, and occasionally the moon is bright enough to produce the bow. It is rather remarkable that there are so few references to the rainbow in the Bible. The Hebrew qesheth is the ordinary word for a bow, there being no special word for rainbow.<P>The interpretation of the significance of the bow in the sky is given at the close of the story of the flood, where it is called "the token of the covenant" of Yahweh with Noah that there should be no more flood: "I do set my bow in the cloud,...and the waters shall no more become a flood to destroy all flesh" (<a onClick="return mV(\'Gen\',9,13,15);">Ge 9:13,15</a>). This addition to the story of the flood is not found in other mythical accounts. The foundation for the interpretation of the bow in this way seems to be that while His bow is hung in the sky God must be at peace with His people. The glory of God is likened to "the appearance of the bow that is in the cloud in the day of rain" (<a onClick="return mV(\'Eze\',1,28);">Eze 1:28</a>). The rainbow forms a striking part of the vision in <a onClick="return mV(\'Rev\',4,3);">Re 4:3</a>: "And there was a rainbow round about the throne."``85';
isbe[7252]='Rainfall in Jerusalem in Inches`Year Amount<P>1861 27.30"<P>1862 21.86"<P>1863 26.54"<P>1864 15.51"<P>1865 18.19"<P>1866 18.55"<P>1867 29.42"<P>1868 29.10"<P>1869 18.61"<P>1870 13.19"<P>1871 23.17"<P>1872 22.26"<P>1873 22.72"<P>1874 29.75"<P>1875 27.01"<P>1876 14.41"<P>1877 26.00"<P>1878 32.21"<P>1879 18.04"<P>1880 32.11"<P>1881 16.50"<P>1882 26.72"<P>1883 31.92" 1884 23.16"<P>1885 29.47"<P>1886 31.69"<P>1887 29.81"<P>1888 37.79"<P>1889 13.16"<P>1890 35.51"<P>1891 34.72"<P>1892 31.23"<P>1893 30.54"<P>1894 35.38"<P>1895 23.15"<P>1896 32.90"<P>1897 41.62"<P>1898 28.66"<P>1899 22.43"<P>1900 21.20"<P>1901 17.42"<P>1902 25.51"<P>1903 18.04"<P>1904 34.48"<P>1905 34.22"<P>1906 28.14"<P>1907 27.22"<P>1908 31.87"<P>1909 21.13"<P>1910 24.64"<P>The amount of rainfall in ancient times was probably about the same as in present times, though it may have been distributed somewhat differently through the year, as suggested by Huntington. Conder maintains that the present amount would have been sufficient to support the ancient cities (Tent-Work in Palestine). Trees are without doubt fewer now, but meteorologists agree that trees do not produce rain.<P>4. Dry and Rainy Seasons;<P>The rainfall is largely on the western slopes of the mountains facing the sea, while on the eastern slopes there is very little. The moisture-laden air comes up from the sea with the west and southwest wind. When these currents strike the hills they are thrown higher up into the cooler strata, and the moisture condenses to form clouds and rain which increases on the higher levels. Having passed the ridge of the hills, the currents descend on the other side to warmer levels, where the moisture is easily held in the form of vapor so that no rain falls and few clouds are seen, except in the cold mid-winter months.<P>The summer months are practically rainless, with very few clouds appearing in the sky. From May 1 to the middle of October one can be sure of no rain; "The winter is past; the rain is over" (<a onClick="return mV(\'Sgs\',2,11);">So 2:11</a>), so many sleep on the roofs of the houses or in tents of leaves and branches in the fields and vineyards throughout the summer. The continuous hot droughts make the people appreciate the springs and fountains of fresh running water and the cool shade of rock and tree.<P>The rainy season from October to May may be divided into three parts, the former, the winter, and the latter rains, and they are often referred to under these names in the Old Testament.<P>The "former rains" are the showers of October and the first part of November. They soften the parched ground so that the winter grain may be sown before the heavy continuous rains set in. The main bulk of the rain falls in the months of December, January and February. Although in these months the rains are frequent and heavy, a dark, foggy day is seldom seen. The "latter rains" of April are the most highly appreciated, because they ripen the fruit and stay the drought of summer. They were considered a special blessing: Yahweh "will come...as the latter rain that watereth the earth" (<a onClick="return mV(\'Hsa\',6,3);">Ho 6:3</a>); "They opened their mouth wide as for the latter rain" (<a onClick="return mV(\'Job\',29,23);">Job 29:23</a>); and as a reason for worshipping Yahweh who sent them, "Let us now fear Yahweh our God, that giveth rain, both the former and the latter, in its season" (<a onClick="return mV(\'Jer\',5,24);">Jer 5:24</a>).<P>The rain storms always come from the sea with a west or southwest wind. The east wind is a hot wind and the "north wind driveth away rain" (<a onClick="return mV(\'Pro\',25,23);">Pr 25:23</a>, the King James Version). "Fair weather cometh out of the north" (<a onClick="return mV(\'Job\',37,22);">Job 37:22</a>, the King James Version).<P>5. Biblical Uses:<P>The Psalmist recognizes that the "showers that water the earth" (<a onClick="return mV(\'Psa\',72,6);">Ps 72:6</a>) are among the choicest blessings from the hand of Yahweh: "The early rain covereth it with blessings" (<a onClick="return mV(\'Psa\',84,6);">Ps 84:6</a>). The severest punishment of Yahweh was to withhold the rain, as in the time of Ahab and Elijah, when the usual rain did not fall for three years (<a onClick="return mV(\'1Ki\',17,\'1-\');">1Ki 17</a>); "the anger of Yahweh be kindled against you, and he shut up the heavens, so that there shall be no rain, and the land shall not yield its fruit; and ye perish quickly" (<a onClick="return mV(\'Deu\',11,17);">De 11:17</a>). Too much rain is also a punishment, as witness the flood (<a onClick="return mV(\'Gen\',7,4);">Ge 7:4</a>) and the plague of rain and hail (<a onClick="return mV(\'Ezr\',10,9);">Ezr 10:9</a>). Sending of rain was a reward for worship and obedience: "Yahweh will open unto thee his good treasure, the heavens, to give the rain of thy land in its season, and to bless all the work of thy hand" (<a onClick="return mV(\'Deu\',28,12);">De 28:12</a>). Yahweh controls the elements and commands the rain: "He made a decree for the rain" (<a onClick="return mV(\'Job\',28,26);">Job 28:26</a>); "For he saith to the snow, Fall thou on the earth; likewise to the shower of rain" (<a onClick="return mV(\'Job\',37,6);">Job 37:6</a>). <p>LITERATURE<P>Palestine Exploration Fund Quarterly; meteorological observations from the Dead Sea, Jerusalem, Jaffa and Tiberias; various observers; Zeitschrift des deutschen Paldstina-Vereins; H. Hilderscheid, Die Niederschlagsverhdltnisse Paldstinas in alter and neuer Zeit; C. R. Conder, Tent-Work in Palestine; Edward Hull, Mount Seir, Sinai and Western Palestine; Ellsworth Huntington, Palestine and Its Transformation; bulletin of the Syrian Protestant College Observatory, Meteorological Observations in Beirut and Syria.``85';
isbe[7253]='Raise`raz: "To raise" in the Old Testament is most frequently the translation of the Hiphil form of qum, "to cause to arise," e.g. raising up seed (<a onClick="return mV(\'Gen\',38,8);">Ge 38:8</a>), a prophet (<a onClick="return mV(\'Deu\',18,18);">De 18:18</a>), judges (<a onClick="return mV(\'Jdg\',2,16,18);">Jud 2:16,18</a>), etc.; also of \'ur, "to awake," "stir up" (<a onClick="return mV(\'Ezr\',1,5);">Ezr 1:5</a> the King James Version; <a onClick="return mV(\'Isa\',41,2);">Isa 41:2</a>, etc.), with other words. In the New Testament the chief words are egeiro, "to awaken," "arouse" (<a onClick="return mV(\'Mat\',3,9);">Mt 3:9</a>; <a onClick="return mV(\'Luk\',1,69);">Lu 1:69</a>; <a onClick="return mV(\'Luk\',3,8);">3:8</a>, etc.), frequently of raising the dead; and anistemi (<a onClick="return mV(\'Mat\',22,24);">Mt 22:24</a>; <a onClick="return mV(\'Jhn\',6,39);">Joh 6:39</a>, etc.; <a onClick="return mV(\'Act\',2,24);">Ac 2:24</a> (30 the King James Version), etc.), with compounds of the former. Among the Revised Version (British and American) changes may be noted, "to stir the fire" for "from raising" (<a onClick="return mV(\'Hsa\',7,4);">Ho 7:4</a>); "raiseth high his gate" for "exalteth his gate" (<a onClick="return mV(\'Pro\',17,19);">Pr 17:19</a>); the American Standard Revised Version, "can it be raised from the roots thereof" for "pluck it up by the roots thereof" (<a onClick="return mV(\'Eze\',17,9);">Eze 17:9</a> the King James Version and the English Revised Version); "raised up" for "rise again" (<a onClick="return mV(\'Mat\',20,19);">Mt 20:19</a>; compare <a onClick="return mV(\'Mat\',26,32);">Mt 26:32</a>; <a onClick="return mV(\'Rom\',8,34);">Ro 8:34</a>; <a onClick="return mV(\'Col\',3,1);">Col 3:1</a>).``185';
isbe[7254]='Raisin-Cakes`ra\'-z\'-n-kaks: the Revised Version (British and American) gives this rendering for the King James Version "foundations" in <a onClick="return mV(\'Isa\',16,7);">Isa 16:7</a> (Hebrew \'ashishah from \'ashash, "to found," "make firm," "press"). The trade in these would cease through the desolation of the vineyards. For the King James Version "flagons of wine" in <a onClick="return mV(\'Hsa\',3,1);">Ho 3:1</a>, the Revised Version (British and American) gives "cakes of raisins," such as were offered to the gods of the land, the givers of the grape (compare <a onClick="return mV(\'Sgs\',2,5);">So 2:5</a>). See next article [<A href="./study/isbe/search.html?string=RAISINS">RAISINS</a>].``1';
isbe[7255]='Raisins`ra\'-z\'-nz:<P>(1) cimmuqim; staphides, translated "dried grapes," <a onClick="return mV(\'Num\',6,3);">Nu 6:3</a>; mentioned in all other references as a portable food for a march or journey. Abigail supplied David with "a hundred clusters of raisins," among other things, in the wilderness of Paran (<a onClick="return mV(\'1Sa\',25,18);">1Sa 25:18</a>); David gave two clusters of raisins to a starving Egyptian slave of the Amalekites at Besor (<a onClick="return mV(\'1Sa\',30,12);">1Sa 30:12</a>); raisins formed part of the provision brought to David at Hebron for his army (<a onClick="return mV(\'1Ch\',12,40);">1Ch 12:40</a>); Ziba supplied David, when flying from Absalom, with a hundred clusters of raisins (<a onClick="return mV(\'2Sa\',16,1);">2Sa 16:1</a>).<P>(2) \'ashishah, something "pressed together," hence, a "cake." In <a onClick="return mV(\'Hsa\',3,1);">Ho 3:1</a>, mention is made of \'ashishe \'anabhim (pemmata meta staphidos), "cakes of raisins": "Yahweh loveth the children of Israel, though they turn unto other gods, and love (margin "or them that love") cakes of raisins." These are supposed to have been cakes of dried, compressed grapes offered to false gods. Gratz considers that the Hebrew words are a corruption of \'asherim and chammanim ("sun images"). Compare <a onClick="return mV(\'Isa\',17,8);">Isa 17:8</a>; <a onClick="return mV(\'Isa\',27,9);">27:9</a>. In other passages "cakes" stands alone without "raisins," but the translation "cakes of raisins" is given in <a onClick="return mV(\'2Sa\',6,19);">2Sa 6:19</a>; <a onClick="return mV(\'1Ch\',16,3);">1Ch 16:3</a>; <a onClick="return mV(\'Sgs\',2,5);">So 2:5</a> (the King James Version "flagons"); <a onClick="return mV(\'Isa\',16,7);">Isa 16:7</a> margin "foundations."<P>Raisins are today, as of old, prepared in considerable quantities in Palestine, especially at es-Salt, east of the Jordan. The bunches of grapes are dipped in a strong solution of potash before being dried.``117';
isbe[7256]='Rakem`ra\'-kem (raqem, the pausal form of reqem): The eponym of a clan of Machir (<a onClick="return mV(\'1Ch\',7,16);">1Ch 7:16</a>).`<a href="./study/isbe/search.html?string=REKEM">REKEM</a>`1';
isbe[7257]='Rakkath`rak\'-ath (raqqath; Codex Vaticanus Omathadaketh; Codex Alexandrinus Rhekkath): The Greek is obviously the result of confusing the two names Rakkath and Hammath, taking "r" in the former for "d". Rakkath was one of the fortified cities in Naphtali (<a onClick="return mV(\'Jos\',19,35);">Jos 19:35</a>). It is named between Hammath and Chinnereth. Hammath is identified with the hot baths to the south of Tiberias. There are traces of ancient fortifications here. The rabbis think that Tiberias was built on the site of Rakkath. Certain it is that Herod\'s town was built upon an ancient site, the graves of the old inhabitants being disturbed in digging the new foundations (Neubauer, Geog. du Talmud, 208).``54';
isbe[7258]='Rakkon`rak\'-on (ha-raqqon; Hierakon).`<a href="./study/isbe/search.html?string=ME+JARKON">ME-JARKON</a>`1';
isbe[7259]='Ram (1)`ram (ram, "high," "exalted"):<P>(1) An ancestor of David (<a onClick="return mV(\'Rth\',4,19);">Ru 4:19</a> (Arran); <a onClick="return mV(\'Mat\',1,3,4);">Mt 1:3,4</a> (Aram); in <a onClick="return mV(\'1Ch\',2,9);">1Ch 2:9</a> he is called the "brother," but in 2:25, the "son of Jerahmeel" (compare <a onClick="return mV(\'1Ch\',2,27);">2:27</A>). Ram as the son of Hezron appears more likely than Ram the son of Jerahmeel, since, according to the narratives of 1 and 2 Samuel, David cannot have been a Jerahmeelite.<P>(2) Name of Elihu\'s family (<a onClick="return mV(\'Job\',32,2);">Job 32:2</a>). It is an open question as to whether Ram should be taken as a purely fictitious name, invented by the author of the Elihu speeches, or whether it is that of some obscure Arab tribe. In <a onClick="return mV(\'Gen\',22,21);">Ge 22:21</a> Aram is a nephew of Buz (compare Elihu the Buzite), and the conjecture was at one time advanced that Ram was a contraction of Aram; but this theory is no longer held to be tenable. The suggestion that the initial "a" (the Hebrew letter, \'aleph) has been changed by a scribal error into "h" (the Hebrew letter, he) is more acceptable. Rashi, the rabbinical commentator, takes the quaint position that Ram is identical with Abraham.``197';
isbe[7260]='Ram (2)`ram:<P>(1) The ordinary word is \'ayil, which is remarkably near to \'ayyal, "deer" (compare Latin caper, capra, "goat," and capreolus, "wild goat" or "roe-buck"; also Greek dorkas, "roe-buck" or "gazelle").<P>(2) dekhar, literally, "male" (<a onClick="return mV(\'Ezr\',6,9,17);">Ezr 6:9,17</a>; <a onClick="return mV(\'Ezr\',7,17);">7:17</a>).<P>(3) kar, "battering ram" (<a onClick="return mV(\'Eze\',4,2);">Eze 4:2</a>; <a onClick="return mV(\'Eze\',21,22);">21:22</a>); elsewhere "lamb" (<a onClick="return mV(\'Deu\',32,14);">De 32:14</a>, etc.).<P>(4) \'attudh, properly "he-goat" ("ram," <a onClick="return mV(\'Gen\',31,10,12);">Ge 31:10,12</a> the King James Version).`<a href="./study/isbe/search.html?string=SHEEP">SHEEP</a>`1';
isbe[7261]='Ram\'s Horn``<a href="./study/isbe/search.html?string=MUSIC">MUSIC</a>`1';
isbe[7262]='Ram, Battering``<a href="./study/isbe/search.html?string=SIEGE">SIEGE</a>`1';
isbe[7263]='Rama`ra\'-ma (Rhama): the King James Version; Greek form of <a href="./study/isbe/search.html?string=RAMAH">RAMAH</a> (which see) (<a onClick="return mV(\'Mat\',2,18);">Mt 2:18</a>).``1';
isbe[7264]='Ramah`ra\'-ma (ha-ramah, without the definite article only in <a onClick="return mV(\'Neh\',11,33);">Ne 11:33</a>; <a onClick="return mV(\'Jer\',31,15);">Jer 31:15</a>): The name denotes height, from root rum, "to be high," and the towns to which it applied seem all to have stood on elevated sites.<P>(1) Codex Vaticanus Arael; Codex Alexandrinus Rhama: A fenced city in the lot assigned to Naphtali (<a onClick="return mV(\'Jos\',19,36);">Jos 19:36</a>). Only in this passage is the place referred to. It is probably identical with the modern er-Rameh, a large Christian village on the highway from Cafed to the coast, about 8 miles west-southwest of that city. To the north rises the mountain range which forms the southern boundary of Upper Galilee. In the valley to the south there is much rich land cultivated by the villagers. The olives grown here are very fine, and fruitful vineyards cover many of the surrounding slopes. No remains of antiquity are to be seen above ground; but the site is one likely to have been occupied in ancient times.<P>(2) Rhama: A city that is mentioned only once, on the boundary of Asher (<a onClick="return mV(\'Jos\',19,29);">Jos 19:29</a>). The line of the boundary cannot be followed with certainty; but perhaps we may identify Ramah with the modern Ramiyeh, a village situated on a hill which rises in the midst of a hollow, some 13 miles southeast of Tyre, and 12 miles east of the Ladder of Tyre. To the southwest is a marshy lake which dries up in summer. Traces of antiquity are found in the cisterns, a large reservoir and many sarcophagi. To the west is the high hill Belat, with ancient ruins, and remains of a temple of which several columns are still in situ.<P>(3) Codex Vaticanus Rhama; Codex Alexandrinus Iama, and other forms: A city in the territory of Benjamin named between Gibeon and Beeroth (<a onClick="return mV(\'Jos\',18,25);">Jos 18:25</a>). The Levite thought of it as a possible resting-place for himself and his concubine on their northward journey (<a onClick="return mV(\'Jdg\',19,13);">Jud 19:13</a>). The palm tree of Deborah was between this and Bethel (<a onClick="return mV(\'Jdg\',4,5);">Jud 4:5</a>). Baasha, king of Samaria, sought to fortify Ramah against Asa, king of Judah. The latter frustrated the attempt, and carried off the materials which Bassha had collected, and with them fortified against him Geba of Benjamin and Mizpah (<a onClick="return mV(\'1Ki\',15,17);">1Ki 15:17</a>; <a onClick="return mV(\'2Ch\',16,5);">2Ch 16:5</a>). Here the captain of Nebuchadnezzar\'s guard released Jeremiah after he had been carried in bonds from Jerusalem (<a onClick="return mV(\'Jer\',40,1);">Jer 40:1</a>). It figures in Isaiah\'s picture of the Assyrians\' approach (<a onClick="return mV(\'Isa\',10,29);">Isa 10:29</a>). It is named by Hosea in connection with Gibeah (<a onClick="return mV(\'Hsa\',5,8);">5:8</a>), and is mentioned as being reoccupied after the exile (<a onClick="return mV(\'Ezr\',2,26);">Ezr 2:26</a>; <a onClick="return mV(\'Neh\',7,30);">Ne 7:30</a>). It was near the traditional tomb of Rachel (<a onClick="return mV(\'Jer\',31,15);">Jer 31:15</a>; compare <a onClick="return mV(\'1Sa\',10,2);">1Sa 10:2</a>; <a onClick="return mV(\'Mat\',2,18);">Mt 2:18</a>, the King James Version "Rama").<P>From the passages cited we gather that Ramah lay some distance to the north of Gibeah, and not far from Gibeon and Beeroth. The first is identified with Tell el-Ful, about 3 miles north of Jerusalem. Two miles farther north is er-Ram. Gibeon (el-Jib) is about 3 miles west of er-Ram, and Beeroth (el-Bireh) is about 4 miles to the north. Eusebius, Onomasticon places Ramah 6 Roman miles north of Jerusalem; while Josephus (Ant., VIII, xii, 3) says it lay 40 furlongs from the city. All this points definitely to identification with er-Ram. The modern village crowns a high limestone hill to the south of the road, a position of great strength. West of the village is an ancient reservoir. In the hill are cisterns, and a good well to the south.<P>(4) Aramathaim: The home of Elkanah and Hannah, and the birthplace of Samuel (<a onClick="return mV(\'1Sa\',1,19);">1Sa 1:19</a>; <a onClick="return mV(\'1Sa\',2,11);">2:11</a>, etc.). In <a onClick="return mV(\'1Sa\',1,1);">1Sa 1:1</a> it is called "Ramathaim-zophim" (ha-ramathayim-tsophim). The phrase as it stands is grammatically incorrect, and suggests tampering with the text. It might possibly be translated "Ramathaim of the Zuphites." It was in Mt. Ephraim, within accessible distance of Shiloh, whither Samuel\'s parents went up from year to year to worship and to sacrifice (<a onClick="return mV(\'1Sa\',1,3);">1:3</A>). From Ramah as a center Samuel went on circuit annually, to judge Israel, to Bethel, Gilgal and Mizpah (<a onClick="return mV(\'1Sa\',7,6);">7:16</A>f). It is very probable that this is the city in which, guided by his servant, Saul first made the acquaintance of Samuel (<a onClick="return mV(\'1Sa\',9,6,10);">9:6,10</A>), where there was a high place (<a onClick="return mV(\'1Sa\',9,12);">9:12</A>). Hither at all events came the elders of Israel with their demand that a king should be set over them (<a onClick="return mV(\'1Sa\',8,4);">8:4</A>f). After his final break with Saul, Samuel retired in sorrow to Ramah (<a onClick="return mV(\'1Sa\',15,34);">15:34</A>f). Here, in Naioth, David found asylum with Samuel from the mad king (<a onClick="return mV(\'1Sa\',19,18);">19:18</A>, etc.), and hence, he fled on his ill-starred visit to Nob (<a onClick="return mV(\'1Sa\',20,1);">20:1</A>). In his native city the dust of the dead Samuel was laid (<a onClick="return mV(\'1Sa\',25,1);">25:1</a>; <a onClick="return mV(\'1Sa\',28,3);">28:3</A>). In 1Macc 11:34 it is named as one of the three toparchies along with Aphaerema and Lydda, which were added to Judea from the country of Samaria in 145 BC. Eusebius, Onomasticon places it near Diospolis (Euseb.) in the district of Timnah (Jerome).<P>There are two serious rivals for the honor of representing the ancient Ramah.<P>(a) Beit Rima, a village occupying a height 13 miles east-northeast of Lydda (Diospolis), 12 miles west of Shiloh, and about the same distance northwest of Bethel. This identification has the support of G. A. Smith (Historical Geography of the Holy Land, 254), and Buhl (Geographic des Alten Palestina, 170).<P>(b) Ramallah, a large and prosperous village occupying a lofty position with ancient remains. It commands a wide prospect, especially to the west. It lies about 8 miles north of Jerusalem, 3 west of Bethel, and 12 southwest of Shiloh. The name meaning "the height" or "high place of God" may be reminiscent of the high place in the city where Saul found Samuel. In other respects it agrees very well with the Biblical data.<P>Claims have also been advanced on behalf of Ramleh, a village 2 miles southwest of Lydda, in the plain of Sharon. This, however, is out of the question, as the place did not exist before Arab times. Others support identification with Neby Samwil, which more probably represents the ancient <a href="./study/isbe/search.html?string=MIZPAH">MIZPAH</a> (which see).<P>(5) Ramah of the South, the King James Version "Ramath of the South": Ramath is the construct form of Ramah (<a onClick="return mV(\'Jos\',19,8);">Jos 19:8</a>) (ra\'math neghebh; Bameth kata liba). A city in that part of the territory of Judah which was allotted to Simeon. It stands here in apposition to Baalath-beer, and is probably a second name for the same place. It seems to correspond also with "Ramoth (plural) of the South" (<a onClick="return mV(\'1Sa\',30,27);">1Sa 30:27</a>), a place to which David sent a share of the spoil taken from the Amalekites. In this passage Septuagint retains the singular form, Rhama notou. Identification has been suggested with Qubbet el-Baul, about 37 miles south of Hebron; and with Kurnub a little farther south. There is no substantial ground for either identification.<P>(6) Codex Vaticanus Rhemmoth; Codex Alexandrinus Rhamoth: Ramah in <a onClick="return mV(\'2Ki\',8,29);">2Ki 8:29</a>; <a onClick="return mV(\'2Ch\',22,6);">2Ch 22:6</a>, is a contraction of Ramoth-gilead.``54';
isbe[7265]='Ramath of the South`ra\'-math, (<a onClick="return mV(\'Jos\',19,8);">Jos 19:8</a> the King James Version).`<a href="./study/isbe/search.html?string=RAMAH">RAMAH</a>`1';
isbe[7266]='Ramath-Lehi`ra\'-math-le\'-hi (ramath lechi, "the hill" or "height of Lehi"; Anairesis siagonos): So the place is said to have been called where Samson threw away the jaw-bone of an ass, with which he had slain 1,000 Philistines (<a onClick="return mV(\'Jdg\',15,17);">Jud 15:17</a>). The Septuagint seems to have supposed that the name referred to the "heaving" or throwing up of the jaw-bone. The Hebrew, however, corresponds to the form used in other placenames, such as Ramath-mizpeh, and must be read as "Ramah of Lehi." The name Lehi may have been given because of some real or imagined likeness in the place to the shape of a jaw-bone (<a onClick="return mV(\'Jdg\',15,9,14,19);">Jud 15:9,14,19</a>). It may have been in Wady es-Sarar, not far from Zorah and Timnath; but the available data do not permit of certain identification.`<a href="./study/isbe/search.html?string=JAWBONE">JAWBONE</a>; <a href="./study/isbe/search.html?string=LEHI">LEHI</a>`54';
isbe[7267]='Ramath-Mizpeh`ra\'-math-miz\'-pe (ramath ha-mitspeh; Codex Vaticanus Araboth kata ten Massepha, Codex Alexandrinus Ramoth kata ten Maspha: A place mentioned in <a onClick="return mV(\'Jos\',13,26);">Jos 13:26</a> in a statement of the boundary of Gad, between Heshbon and Betonim. It may possibly be identical with <a href="./study/isbe/search.html?string=MIZPAH">MIZPAH, (1)</a>.``1';
isbe[7268]='Ramathaim-Zophim`ra-ma-tha\'-im-zo\'-fim.`<a href="./study/isbe/search.html?string=RAMAH">RAMAH</a>`1';
isbe[7269]='Ramathaim; Ramathem`ra-ma-tha\'-im, ram\'-a-them (1Macc 11:34; the King James Version).`<a href="./study/isbe/search.html?string=RAMAH">RAMAH</a>`1';
isbe[7270]='Ramathite`ra\'-math-it (ha-ramathi; Codex Vaticanus ho ek Rhael; Codex Alexandrinus ho Rhamathaios): So Shimei is called who was set by David over the vineyards (<a onClick="return mV(\'1Ch\',27,27);">1Ch 27:27</a>). There is nothing to show to which Ramah he belonged.``1';
isbe[7271]='Rameses`ram\'-e-sez, ra-me\'-sez.`<a href="./study/isbe/search.html?string=RAAMSES">RAAMSES</a>`1';
isbe[7272]='Ramiah`ra-mi\'-a (ramyah, "Yah has loosened" or "Yah is high"): One of the Israelites, of the sons of Parosh, mentioned in the register of those who had offended in the matter of foreign marriages (<a onClick="return mV(\'Ezr\',10,25);">Ezr 10:25</a>). The form of the name in 1Esdras (9:26), "Hiermas," presupposes a Hebrew form yeremyah or possibly yirmeyah = "Jeremiah."``1';
isbe[7273]='Ramoth (1)`ra\'-moth:<P>(1) ra\'moth; he Rhamoth: A city in the territory of Issachar assigned to the Gershonite Levitea (<a onClick="return mV(\'1Ch\',6,73);">1Ch 6:73</a>), mentioned between Daberath and Anem. It seems to correspond to "Remeth" in <a onClick="return mV(\'Jos\',19,21);">Jos 19:21</a>, and to "Jarmuth" in <a onClick="return mV(\'Jos\',21,29);">21:29</A>, and is possibly identical with er-Rameh about 11 miles southwest of Jenin.<P>(2) Ramoth of the South.<P>(3) Ramoth in Gilead.`<a href="./study/isbe/search.html?string=RAMAH">RAMAH</a>; <a href="./study/isbe/search.html?string=RAMOTH+GILEAD">RAMOTH-GILEAD</a>`1';
isbe[7274]='Ramoth (2)`ra\'-moth (ramoth, Qere for yeremoth (<a onClick="return mV(\'Ezr\',10,29);">Ezr 10:29</a> the King James Version); the Revised Version margin Kethibh makes the name similar to those in <a onClick="return mV(\'Ezr\',10,26,27);">Ezr 10:26,27</a>): One of the offenders in the matter of foreign marriages. The English Revised Version and the American Standard Revised Version, adopting Kethibh, read <a href="./study/isbe/search.html?string=JEREMOTH">JEREMOTH</a> (which see).``1';
isbe[7275]='Ramoth (3)`(<a onClick="return mV(\'Job\',28,18);">Job 28:18</a> King James Version margin).`<a href="./study/isbe/search.html?string=STONES,+PRECIOUS">STONES, PRECIOUS</a>`1';
isbe[7276]='Ramoth-Gilead`ra\'-moth-gil\'-e-ad (ramoth gil\'adh; Codex Vaticanus Rhemmath Galadd; Codex Alexandrinus Rhammoth, and other forms): A great and strong city east of the Jordan in the territory of Gad, which played an important part in the wars of Israel. It is first mentioned in connection with the appointment of the Cities of Refuge (<a onClick="return mV(\'Deu\',4,43);">De 4:43</a>; <a onClick="return mV(\'Jos\',20,8);">Jos 20:8</a>). It was assigned to the Merarite Levites (<a onClick="return mV(\'Jos\',21,38);">Jos 21:38</a>; <a onClick="return mV(\'1Ch\',6,80);">1Ch 6:80</a>). In these four passages it is called "Ramoth in Gilead" (ramoth ba-gil\'adh). This form is given wrongly by the King James Version in <a onClick="return mV(\'1Ki\',22,3);">1Ki 22:3</a>. In all other places the form "Ramoth-gilead" is used.e to the shape of a jaw-bone (<a onClick="return mV(\'Jdg\',15,9,14,19);">Jud 15:9,14,19</a>). It may have been in Wady es-Sarar, not far from Zorah and Timnath; but the available data do not permit of certain identification.<P>1. History:<P>Here Ben-geber was placed in charge of one of Solomon\'s administrative districts (<a onClick="return mV(\'1Ki\',4,13);">1Ki 4:13</a>), which included Havvoth-jair and "the region of Argob, which is in Bashan." The city was taken from Omri by the Syrians under Ben-hadad I (Ant., VIII, xv, 3ff), and even after the defeat of Ben-hadad at Aphek they remained masters of this fortress. In order to recover it for Israel Ahab invited Jehoshaphat of Judah to accompany him in a campaign. Despite the discouragement of Micalab, the royal pair set out on the disastrous enterprise. In their attack on the city Ahab fought in disguise, but was mortally wounded by an arrow from a bow drawn "at a venture" (<a onClick="return mV(\'1Ki\',22,\'1-40\');">1Ki 22:1-40</a>; <a onClick="return mV(\'2Ch\',18,\'1-\');">2Ch 18</a>). The attempt was renewed by Ahab\'s son Joram; but his father\'s ill fortune followed him, and, heavily wounded, he retired for healing to Jezreel (<a onClick="return mV(\'2Ki\',8,28);">2Ki 8:28</a>ff; <a onClick="return mV(\'2Ch\',22,5);">2Ch 22:5</a>f). During the king\'s absence from the camp at Ramoth-gilead Jehu was there anointed king of Israel by Elisha (<a onClick="return mV(\'2Ki\',9,1);">2Ki 9:1</a>ff; <a onClick="return mV(\'2Ch\',22,7);">2Ch 22:7</a>). He proved a swift instrument of vengeance against the doomed house of Ahab. According to Josephus (Ant., IX, vi, 1) the city was taken before Joram\'s departure. This is confirmed by <a onClick="return mV(\'2Ki\',9,14);">2Ki 9:14</a>ff. The place is not mentioned again, unless, indeed, it be identical with "Mizpeh" in 1Macc 5:35.<P>2. Identification:<P>It is just possible that Ramoth-gilead corresponds to <a href="./study/isbe/search.html?string=MIZPAH">MIZPAH, (1)</a>, and to <a href="./study/isbe/search.html?string=RAMATH-MIZPEH">RAMATH-MIZPEH</a>. The spot where Laban and Jacob parted is called both Galeed and Mizpah. Ramath may become Ramoth, as we see in the case of Ramah of the South.<P>Merrill identifies the city with Jerash, the splendid ruins of which lie in Wady ed-Deir, north of the Jabbok. He quotes the Bah Talmud (Makkoth 9b) as placing the Cities of Refuge in pairs, so that those on the east of the Jordan are opposite those on the west Shechem, being the middle one of the three west of the Jordan, should have Ramorb-gilead nearly opposite to it on the east, and this would place its site at Gerasa, the modern Jerash (Hastings Dictionary of the Bible, under the word). But the words of the Talmud must not be interpreted too strictly. It seems very probable that Golan lay far south of a line drawn due east from Qedes (Kedesh-naphtali). No remains have been discovered at Jerash older than Greek- Roman times, although the presence of a fine perennial spring makes occupation in antiquity probable. The place could be approached by chariots along Wady \'Ajlun, and the country adjoining was not unsuitable for chariot evolutions.<P>Conder and others have suggested Reimun, an ancient site to the west of Jerash. The absence of any source of good water-supply is practically fatal to this identification. Buhl (Geographic des Alten Palestina, 261ff) favors el-Jil\'ad, a ruined site on a hill south of the Jabbok; see <a href="./study/isbe/search.html?string=GILEAD">GILEAD, (1)</a>. Eusebius and Jerome (Onomasticon, under the word) contradict each other, the former placing Ramoth-gilead 15 miles west, and the latter 15 miles east of Philadelphia. It is clear, however, that this is a mere slip on Jerome\'s part, as both say it is near the Jabbok. Many have identified it with es-Salt, which is indeed 15 miles west of \'Amman (Philadelphia), but it <span class="noTag">is</span> 10 miles south of the Jabbok, and so can hardly be described as near that river. It is also no place for chariot warfare. The case against identification with Ramoth-gilead is conclusively stated by G.A. Cooke in Driver\'s Deuteronomy, xx.<P>In suggesting these sites sufficient attention has not been given to what is said in <a onClick="return mV(\'1Ki\',4,\'1-\');">1Ki 4</a>. The authority of the king\'s officer in Ramoth-gilead extended over the land of Argob in Bashan, as well as over the towns of Jair in Gilead. A situation therefore to the north of Mahanaim must be sought. Guthe would find it at er-Remtheh, on the pilgrim road, about 10 miles south of Mezerib (compare Smith, Historical Geography of the Holy Land, 586ff). Cheyne\'s suggestion of Salkhad, away on the crest of the mountain of Bashan, is out of the question. Caleb Hauser (Palestine Exploration Fund Statement,1906,304f) argues in favor of Beit Ras, over 11 miles southeast of Gadara, a position commanding all Northern Gilead and as favorably situated as Jerash for chariot warfare and communication with the west of Jordan. "Here we have the heights of Northern Gilead. Ramoth, Capitolias, and Beit Ras are in their respective languages idiomatic equivalents. It is improbable that a large city like Capitolins should have superseded anything but a very important city of earlier times." We must be content to leave the question open meantime.``54';
isbe[7277]='Rampart`ram\'-part (<a onClick="return mV(\'Lam\',2,8);">La 2:8</a>; <a onClick="return mV(\'Nah\',3,8);">Na 3:8</a>).`<a href="./study/isbe/search.html?string=FORTIFICATION">FORTIFICATION</a>`1';
isbe[7278]='Rams\' Skins`The skin of the sheep, roughly tanned with all the wool on, is the common winter jacket of the shepherd or peasant, the ram\'s being considered especially desirable (compare <a onClick="return mV(\'Hbr\',11,37);">Heb 11:37</a>). Hence, the appropriateness of these skins in the covering of the tabernacle (<a onClick="return mV(\'Exd\',25,5);">Ex 25:5</a>, etc.).`<a href="./study/isbe/search.html?string=TABERNACLE">TABERNACLE</a>; <a href="./study/isbe/search.html?string=DYE,+DYEING">DYE, DYEING</a>`1';
isbe[7279]='Range`ranj: "Range" and "rank" have the same derivation, and in the sense of a "row" (of men, etc.) they were formerly interchangeable. "Range" with this meaning is found in <a onClick="return mV(\'2Ki\',11,8,15);">2Ki 11:8,15</a> the King James Version parallel <a onClick="return mV(\'2Ch\',23,14);">2Ch 23:14</a> (the Revised Version (British and American) "rank"; sedherah, "row"). Hence, "to range" is "to set in a line" (Judith 2:16; 2Macc 12:20, diatasso) or "to move in a line" or, simply, "to roam," whence "a ranging bear" (<a onClick="return mV(\'Pro\',28,15);">Pr 28:15</a>; shaqaq, "run to and fro"). A cooking "range" is a stove on which pots, etc., can be set in a row, but the kirayim of <a onClick="return mV(\'Lev\',11,35);">Le 11:35</a> is a much more primitive affair, composed, probably, of two plates (kirayim is a dual). In <a onClick="return mV(\'Job\',39,8);">Job 39:8</a> "range of the mountains" is good modern use, but ythr, should be pointed yathur (not yethur as in Massoretic Text) and connected with tur, "search." So translate. "He searcheth out the mountains as his pasture."``48';
isbe[7280]='Rank`rank:<P>(1) \'orach, used in <a onClick="return mV(\'Joe\',2,7);">Joe 2:7</a> of the advance of the locust army which marched in perfect order and in straight lines, none crossing the other\'s track.<P>(2) ma\'arakhah, "battle array" (<a onClick="return mV(\'1Ch\',12,38);">1Ch 12:38</a> the King James Version; compare <a onClick="return mV(\'1Sa\',4,16);">1Sa 4:16</a>; <a onClick="return mV(\'1Sa\',17,22,48);">17:22,48</a>).`<a href="./study/isbe/search.html?string=ARMY">ARMY</a>`1';
isbe[7281]='Ranks`ranks (prasid, "a square plot of ground," "a garden-bed"): "They sat down in ranks" (<a onClick="return mV(\'Mar\',6,40);">Mr 6:40</a>); the several reclining ranks formed, as it were, separate plots or "garden-beds."``1';
isbe[7282]='Ransom`ran\'-sum (the noun occurs in the English Bible 12 times (<a onClick="return mV(\'Exd\',21,30);">Ex 21:30</a> the King James Version pidhyon; <a onClick="return mV(\'Exd\',30,12);">Ex 30:12</a>; <a onClick="return mV(\'Job\',33,24);">Job 33:24</a>; <a onClick="return mV(\'Job\',36,18);">36:18</a>; <a onClick="return mV(\'Pro\',6,35);">Pr 6:35</a>; <a onClick="return mV(\'Pro\',13,8);">13:8</a>; <a onClick="return mV(\'Pro\',21,18);">21:18</a>; <a onClick="return mV(\'Isa\',43,3);">Isa 43:3</a>, kopher; <a onClick="return mV(\'Mat\',20,28);">Mt 20:28</a>; <a onClick="return mV(\'Mar\',10,45);">Mr 10:45</a>, lutron; <a onClick="return mV(\'1Ti\',2,6);">1Ti 2:6</a>, antilutron); the verbal form occurs 4 times (<a onClick="return mV(\'Isa\',35,10);">Isa 35:10</a>; <a onClick="return mV(\'Hsa\',13,14);">Ho 13:14</a>, padhah; <a onClick="return mV(\'Isa\',51,10);">Isa 51:10</a> the King James Version; <a onClick="return mV(\'Jer\',31,11);">Jer 31:11</a>, ga\'al; these two Hebrew verbs are generally rendered in other passages by the English "redeem"))<P>1. Usage by Christ<P>2. Old Testament Usage—the Law<P class="in15">(1) General Cases<P class="in15">(2) Redemption Money—the Firstborn<P class="in15">(3) Connection with Sacrifice<P class="in15">(4) Typical Reference to the Messiah<P>3. The Psalms and Job<P>4. Apostolic Teaching<P>5. To Whom Was the Ransom Paid?<P class="in15">(1) Not to Satan<P class="in15">(2) To Divine Justice<P class="in30">(a) Redemption by Price<P class="in30">(b) Redemption by Power<P>LITERATURE<hr /><P>1. Usage by Christ:<P>The supremely important instance is the utterance of the Lord Jesus Christ as reported by Matthew and Mark (<a onClick="return mV(\'Mat\',20,28);">Mt 20:28</a>; <a onClick="return mV(\'Mar\',10,45);">Mr 10:45</a>), and in looking at it we shall be able, by way of illustration, to glance at the Old Testament passages. The context refers to the dispute among the disciples concerning position in the Kingdom, with their misconception of the true nature of Christ\'s Kingdom. Christ makes use of the occasion to set forth the great law of service as determining the place of honor in that Kingdom, and illustrates and enforces it by showing that its greatest exemplification is to be found in His own mission: "For the Son of man also came not to be ministered unto, but to minister" (<a onClick="return mV(\'Mar\',10,45);">Mr 10:45</a>). His ministry, however, was to pass into the great act of sacrifice, of which all other acts of self-sacrifice on the part of His people would be but a faint reflection—"and to give his life (soul) a ransom for many" (same place). He thus gives a very clear intimation of the purpose and meaning of His death; the clearest of all the intimations reported by the synoptists. The word He uses bears a well-established meaning, and is accurately rendered by our word "ransom," a price paid to secure the freedom of a slave or to set free from liabilities and charges, and generally the deliverance from calamity by paying the forfeit. The familiar verb luo, "to loose," "to set free," is the root, then lutron, that which secures the freedom, the payment or forfeit; thence come the cognate verb lutroo, "to set free upon payment of a ransom," "to redeem"; lutrosis, "the actual setting free," "the redemption," and lutrotes, "the redeemer." The favorite New Testament word for "redemption" is the compound form, apolutrosis.<P>2. Old Testament Usage—the Law:<P>The word lutron was common in Greek classical literature, constantly bearing the sense of "ransom price," and was frequently connected with ritual usage, with sacrifice and expiation. But for the full explanation of our Lord\'s great thought we have to look to the Old Testament usage. The two leading Hebrew verbs translated in our version by "redeem," are generally rendered in the Septuagint by lutroo, and derivatives of these words conveying the idea of the actual price paid are translated by this very word lutron.<P>(1) General Cases.<P>In <a onClick="return mV(\'Exd\',21,30);">Ex 21:30</a> we have the law concerning the case of the person killed by an ox; the ox was to be killed and the owner of it was also liable to death but the proviso was made, "If there be laid on him a sum of money, then he shall give for the ransom of his life whatsoever is laid upon him" (the King James Version). The Hebrew for "sum of money" is kopher, literally, "atonement" (the Revised Version (British and American) "ransom"); the word for "ransom" (the Revised Version (British and American) "redemption") is pidhyon (from padhah); the Septuagint renders both by lutron (rather by the plural form lutra). In <a onClick="return mV(\'Lev\',25,\'1-\');">Le 25</a>, among the directions in relation to the Jubilee, we have the provision (<a onClick="return mV(\'Lev\',25,23);">25:23</A>) that the land was not to be sold "in perpetuity," but where any portion has been sold, opportunity is to be given for re-purchase: "Ye shall grant a redemption for the land" (<a onClick="return mV(\'Lev\',25,24);">25:24</A>). The Hebrew is ge\'ullah, a derivative of ga\'al, the Septuagint lutra. In <a onClick="return mV(\'Lev\',25,25,26);">25:25,26</A>, the case is mentioned of a man who through poverty has sold part of his land; if a near kinsman is able to redeem it he shall do so; if there is no one to act this brotherly part, and the man himself is able to redeem it, then a certain scale of price is arranged. In the Hebrew it is again ga\'al that is used with the cognate go\'el for "kinsman." The last clause rendered in the King James Version, "and himself be able to redeem it" (in the Revised Version (British and American) "and he be waxed rich and find sufficient to redeem it"), is literally, "and his hand shall acquire and he find sufficient for its redemption"; the Septuagint has the verb lutroo in the first part, and renders the clause pretty literally, "and there be furnished to his hand and there be found with him the sufficient price (lutra) of it." In <a onClick="return mV(\'Lev\',25,51,52);">Le 25:51,52</a>, in reference to the redemption of the Jew sold into slavery, we have twice in the Hebrew the word ge\'ullah, rendered in English accurately "the pricen of his redemption"; and by Septuagint with equal accuracy, in both cases, lutra, "the ransom-price." In <a onClick="return mV(\'Lev\',27,31);">Le 27:31</a> the King James Version, the phrase "if a man will at all redeem aught of his tithes" is intended to represent the emphatic Hebrew idiom, "if a man redeeming will redeem," which is rendered by Septuagint ean de lutrotai lutro anthropos.<P>(2) Redemption Money—the Firstborn.<P>But perhaps the most important passage is the law concerning the half-shekel to be paid by every Israelite from 20 years old and upward when a census was taken. It was to be the same for rich and poor, and it was called "atonement money," "to make atonement for their souls." In the opening words of the law, as given in <a onClick="return mV(\'Exd\',30,12);">Ex 30:12</a> (the King James Version), we read "Then shall they give every man a ransom for his soul unto the Lord"—the Hebrew kopher; the Septuagint rendering is lutra tes psuches autou, "a ransom price for his soul." All the people were thus considered as doomed and needing atonement, and it is significant that this atonement money paid at the first census furnished the silver for the sockets of the tabernacle boards, intimating that the typical tabernacle was built upon atonement. The same thought, that the people\'s lives were forfeited, comes out in the provision for the consecration of the Levites, recorded in full in <a onClick="return mV(\'Num\',3,\'40-51\');">Nu 3:40-51</a>. The firstborn represented the people. God claimed all the firstborn as forfeited to Himself, teaching that Israel deserved the same punishment as the Egyptians, and was only spared by the grace of Yahweh, and in virtue of the sprinkled blood. Now He takes to Himself for His services the Levites as the equivalent of the firstborn, and when it was found that the number of the firstborn exceeded the number of the Levites, equivalence was maintained by ransoming at a certain price the surplus of the firstborn males. In the Septuagint account, lutra occurs 4 times, twice for the phrase "those to be redeemed," and twice for "redemption money." Thus the idea of ransom for the forfeited life became familiar to the people as educated by the typical system, and redemption expressed the sum total of their hopes for the future, however faulty might be their conception of the nature of that redemption.<P>(3) Connection with Sacrifice.<P>It is also clear in the typical teaching that sacrifice and ransom were closely related. Even in classical Greek, as we have noted, the two conceptions were connected, and it is not surprising to find it so in the Old Testament. Kopher, we have seen, is literally, "atonement" and comes from kaphar, literally, "to cover," and thence by covering to make atonement, or to cover by making atonement; and so it is in the Piel form, the most common and technical Hebrew word for making atonement, or expiation, or propitiation, and is frequently rendered in the Greek by hilaskomai, often too by the compound exilaskomai. In <a onClick="return mV(\'Exd\',21,30);">Ex 21:30</a>, kopher, we noted, is used interchangeably with pidhyon, both being represented in the Septuagint by lutra, and so in <a onClick="return mV(\'Exd\',30,12);">Ex 30:12</a>; <a onClick="return mV(\'Num\',35,31,32);">Nu 35:31,32</a>; the Hebrew kopher is lutra in the Greek. In the latter place, where it is twice stated that no satisfaction shall be taken for the life of a murderer, the Hebrew is kopher, the Septuagint has lutra; the Revised Version (British and American) has "ransom;" the King James Version has "satisfaction."<P>(4) Typical Reference to the Messiah.<P>Sacrifice was thus linked with ransom. Sacrifice was the divinely-appointed
