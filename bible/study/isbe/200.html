<script type="text/javascript">
isbe = [];

isbe[201]='Adithaim`ad-i-tha\'-im (\'adhithayim "double ornament, passage, or prey"): A city in "the lowland" (Shephelah, not as the King James Version "valley") of Judah (<a onClick="return mV(\'Jos\',15,36);">Jos 15:36</a>). Site unknown, but possibly same as <a href="./study/isbe/search.html?string=ADIDA">ADIDA</a> (which see).``1';
isbe[202]='Adjuration`ad-ju-ra\'-shun: The act of requiring or taking a solemn oath. In a time of military peril Saul adjured the people (\'alah, "to take oath") and they took oath by saying "Amen" (<a onClick="return mV(\'1Sa\',14,24);">1Sa 14:24</a>). When Joshua pronounced a ban on Jericho (<a onClick="return mV(\'Jos\',6,26);">Jos 6:26</a>) he completed it with an oath (shabha\', "to cause to swear"). Often used in the sense of a solemn charge without the administration of an oath (<a onClick="return mV(\'1Ki\',22,16);">1Ki 22:16</a>; <a onClick="return mV(\'2Ch\',18,15);">2Ch 18:15</a>; <a onClick="return mV(\'Sgs\',2,7);">So 2:7</a>; <a onClick="return mV(\'Sgs\',5,8,9);">5:8-9</a>; <a onClick="return mV(\'1Th\',5,27);">1Th 5:27</a>). With reference to the withholding of testimony, see <a onClick="return mV(\'Lev\',5,1);">Le 5:1</a> and <a onClick="return mV(\'Pro\',29,24);">Pr 29:24</a>. The high priest sought to put Jesus under oath (exorkizo, "to force to an oath," <a onClick="return mV(\'Mat\',26,63);">Mt 26:63</a>). Adjure also means to solemnly implore (horkizo) as when the man with an unclean spirit appealed to Jesus: "I adjure thee by God, torment me not" (<a onClick="return mV(\'Mar\',5,7);">Mr 5:7</a>); or seven sons of Sceva, exorcists, sought in the name of Jesus to expel demons (<a onClick="return mV(\'Act\',19,13);">Ac 19:13</a>).<P>(1) The exacting of an oath has, from time immemorial, been a customary procedure in conferring civil and ecclesiastical office and in taking legal testimony. Though often allowed to become painfully trivial and a travesty on its inherent solemnity, the taking of an official oath or the swearing of witnesses is still considered essential to the moral integrity of government, secular or spiritual. False sweating, under solemn oath, constitutes the guilt and heinousness of perjury. The universality of oath-taking is humanity\'s tribute, whether pagan or Christian, to the sacredness of truth.<P>(2) Civilized nations administer oaths under three heads: political, ecclesiastical, legal. The sovereign of England receives the crown only as he or she responds affirmatively to the solemn adjuration of the archbishop or bishop: "Will you solemnly promise and swear to govern," etc., closing with the affirmation, "So help me God." A fundamental conviction of civilized nations was expressed by Lycurgus: "An oath is the bond that keeps the state together." It is the most solemn appeal to the inviolability of the human conscience, and the sacredness of a vow as witnessed both by God and men.`<a href="./study/isbe/search.html?string=OATH">OATH</a>`139';
isbe[203]='Adlai`ad\'-la-i, ad\'-li (\'adhlay; Septuagint Adli and Adai, "lax, weary"): The father of Shaphat, an overseer of David\'s herds in the lowlands (<a onClick="return mV(\'1Ch\',27,29);">1Ch 27:29</a>).``1';
isbe[204]='Admah`ad\'-ma (\'adhmah): From a root signifying red; one of the Cities of the Plain (Ciccar) (<a onClick="return mV(\'Gen\',10,19);">Ge 10:19</a>; <a onClick="return mV(\'Gen\',14,2,8);">14:2, 8</a>; <a onClick="return mV(\'Deu\',29,23);">De 29:23</a>; <a onClick="return mV(\'Hsa\',11,8);">Ho 11:8</a>) upon which Abraham and Lot looked from the heights of Bethel; destroyed with Sodom and Gomorrah. Conder tentatively identifies it with the City of Adam referred to in <a onClick="return mV(\'Jos\',3,16);">Jos 3:16</a>, and thinks that perhaps the name may be preserved in that of Damieh Ford, near the mouth of the river Jabbok; but that point could not have been in view from Bethel.`<a href="./study/isbe/search.html?string=VALE+OF+SIDDIM">VALE OF SIDDIM</a>`1';
isbe[205]='Admatha`ad\'-ma-tha, ad-ma\'-tha (\'adhmatha\'): One of "the seven princes of Persia and Media, who saw the king\'s face, and sat first in the kingdom" (<a onClick="return mV(\'Est\',1,14);">Es 1:14</a>); compare <a onClick="return mV(\'2Ki\',25,19);">2Ki 25:19</a>; <a onClick="return mV(\'Ezr\',7,14);">Ezr 7:14</a>. The Septuagint gives only three names.``1';
isbe[206]='Admin`ad\'-min.`<a href="./study/isbe/search.html?string=ARNI">ARNI</a>`1';
isbe[207]='Administer, Administration`ad-min\'-is-ter ad-min-is-tra\'-shun diakoneo, diakonia: Terms used in the King James Version in <a onClick="return mV(\'1Cr\',12,5);">1Co 12:5</a>; <a onClick="return mV(\'2Cr\',8,19,20);">2Co 8:19-20</a>; <a onClick="return mV(\'2Cr\',9,12);">2Co 9:12</a> respectively, and replaced in the Revised Version (British and American) by "minister" and "ministration." The root idea of both words is "service," hence to supply, or conduct or attend to anything; the performance of official duty, the conduct of affairs, the various forms of spiritual or social service. "Minister," used either of an act or of an office, is the term that best represents the apostolic thought and ideal.``139';
isbe[208]='Admiration`ad-mi-ra\'-shun (thauma, "a marvel" or "wonder"; thaumazo, "to wonder"): A term thrice used in the King James Version in the New Testament, to express a wonder that includes approval, high esteem; replaced in the Revised Version (British and American) by three renderings better suited to convey the various kinds of surprise, wonder, admiration, expressed, by this fertile word: namely, in <a onClick="return mV(\'2Th\',1,10);">2Th 1:10</a>, "to be admired," reads in the Revised Version (British and American) "to be marveled at"; in <a onClick="return mV(\'Jud\',1,16);">Jude 1:16</a> "having men\'s persons in admiration" is rendered "showing respect of persons"; in <a onClick="return mV(\'Rev\',17,6);">Re 17:6</a> "wondered with great admiration" is replaced by "with a great wonder." The Greek original is used frequently in the New Testament, especially in the Gospels, to express marvel and wonder at the supernatural works of Jesus.``139';
isbe[209]='Adna`ad\'-na (\'adhna\', "pleasure"; Aidaine):<P>(1) An Israelite in Ezra\'s time who, having married a foreign wife, divorced her. He belonged to Pahath-moab (<a onClick="return mV(\'Ezr\',10,30);">Ezr 10:30</a>).<P>(2) A priest of the family of Harum, during the high-priesthood of Joiakim son of Jethua (<a onClick="return mV(\'Neh\',12,\'12-15\');">Ne 12:12-15</a>).``1';
isbe[210]='Adnah`ad\'-na (\'adhnach, "pleasure"; Edna):<P>(1) A warrior of the tribe of Manasseh, who deserted Saul and joined David\'s forces at Ziklag (<a onClick="return mV(\'1Ch\',12,20,21);">1Ch 12:20-21</a>)<P>(2) An officer of high rank, perhaps the commander-in-chief of Jehoshaphat\'s army (<a onClick="return mV(\'2Ch\',17,14);">2Ch 17:14</a>). Here the spelling in Hebrew is \'adhnah.``1';
isbe[211]='Ado`a-doo\':Found only in <a onClick="return mV(\'Mar\',5,39);">Mr 5:39</a> King James Version: "Why make ye this ado and weep?" Here "make ado" is used to translate the Greek verb thorubeomai (compare <a onClick="return mV(\'Mat\',9,23);">Mt 9:23</a> the King James Version, where it is likewise rendered "making a noise"). "Ado" as a substantive is Old English for "trouble" or "fuss," used only in the sing.; and in the early English versions it combined well with the verb "make," as here, to translate the Greek word rendered elsewhere "causing an uproar," or "tumult," "making a noise," etc. (see <a onClick="return mV(\'Act\',17,5);">Ac 17:5</a>; <a onClick="return mV(\'Act\',20,10);">20:10</a>). Compare Shakespeare, Romeo and Juliet, III,4,"We\'ll keep no great ado; —a friend or two."``47';
isbe[212]='Adonai`a-do\'-ni, ad-o-na\'-i (\'adhonay): A Divine name, translated "Lord," and signifying, from its derivation, "sovereignty." Its vowels are found in the Massoretic Text with the unpronounceable tetragrammaton YHWH; and when the Hebrew reader came to these letters, he always substituted in pronunciation the word "\' adhonay." Its vowels combined with the tetragrammaton form the word "Yahweh (Yahweh)."`<a href="./study/isbe/search.html?string=GOD,+NAMES+OF">GOD, NAMES OF</a>`1';
isbe[213]='Adoni-Zedek`a-do-ni-ze\'-dek (\'adhonitsedheq, "lord of righteousness"): King of Jerusalem at the time of the conquest of Canaan (<a onClick="return mV(\'Jos\',10,1);">Jos 10:1</a>). When he heard of the fall of Ai and the submission of the Gibeonites, he entered into a league with four other kings to resist Joshua and Israel, and to punish Gibeon (<a onClick="return mV(\'Jos\',10,3,4);">Jos 10:3-4</a>), but was overthrown by Joshua in a memorable battle (<a onClick="return mV(\'Jos\',10,\'12-14\');">Jos 10:12-14</a>). Adoni-zedek and his four allies were shut up in a cave, while the battle lasted, and afterward were taken out by Joshua\'s order, put to death and hanged on trees (<a onClick="return mV(\'Jos\',10,\'22-27\');">Jos 10:22-27</a>). It is noticeable that the name is almost the equivalent of Melchizedek, malkitsedheq, "king of righteousness," who was ruler of Jerusalem in the time of Abraham.``109';
isbe[214]='Adonibezek`a-do-ni-be\'-zek (\'adhonibhezeq "lord of Bezek"): Lord of a town, Bezek, in Southern Palestine, whom the tribes of Judah and Simeon overthrew. Adonibezek fled when his men were defeated, but was captured, and was punished for his cruelty in cutting off the thumbs and great toes of seventy kings by a similar mutilation. Being brought to Jerusalem, he died there (<a onClick="return mV(\'Jdg\',1,\'5-7\');">Jud 1:5-7</a>). This not to be confused with Adonizedek, as in the Septuagint. This is quite another name.``1';
isbe[215]='Adonijah`ad-o-ni’-ja (’adhoniyahu or ‘adhoniyah, "my lord is Yahweh"):<P>(1) The son of David and Haggith, the forth of David’s sons, born in Hebron after David became king of Judah, principally known for his attempt to become king instead of Solomon (<a onClick="return mV(\'2Sa\',3,4);">2Sa 3:4</a>; <a onClick="return mV(\'1Ch\',3,2);">1Ch 3:2</a>; <a onClick="return mV(\'1Ki\',1,\'1-\');">1Ki 1</a>; <a onClick="return mV(\'1Ki\',2,\'1-\');">2</a>. The record gives no details concerning Chileab, the son of David and Abigail. Leaving him out, Adonijah was the oldest living son of David, after the death of Amnon and Absalom.<P>In treating the record it has been needlessly obscured by neglecting or distorting the time data. It says that the rebellion of Absalom broke out "at an end of forty years" (<a onClick="return mV(\'2Sa\',15,7);">2Sa 15:7</a>). The natural meaning is not forty years after the last-mentioned preceding date, but at the close of the fortieth calendar year of the reign of David. Since David reigned 40 1/2 years (<a onClick="return mV(\'2Sa\',5,4,5);">2Sa 5:4-5</a>), the close of his fortieth calendar year was the beginning of has last year. That the date intended was at the beginning of a vernal year is confirmed by the references to the season (<a onClick="return mV(\'2Sa\',17,19,28);">2Sa 17:19, 28</a>). Instead of giving this number Josephus says that 4 years had elapsed since the last preceding date, which is very likely correct.<P>Many considerations show that the outbreak cannot have occurred much earlier than the fortieth year of David; for Amnon and Absalom were born after David’s reign began, and were men with establishments of their own before Amnon’s offense against Tamar, and after that the record, if we accept the numeral of Josephus, accounts for 2 plus 3 plus 2 plus 4, that is, for 11 years (<a onClick="return mV(\'2Sa\',13,23,38);">2Sa 13:23, 38</a>; <a onClick="return mV(\'2Sa\',14,28);">14:28</a>; Ant, VII, ix, 1). In the year following David’s fortieth year there was ample room for the rebellions of Absalom and of Sheba, the illness of David, the attempt of Adonijah, and the beginning of the reign of Solomon. All things confirm the number forty as giving the date of the outbreak. The common assumption that the forty is to be reduced to four, on the basis of the number in Josephus, is contrary to the evidence.<P>On this view of the chronology all the events fall into line. David’s idea of making Solomon king was connected with his temple-building idea. This is implied in Kings, and presented somewhat in full in Chronicles. The preparations described in Chronicles (<a onClick="return mV(\'1Ch\',22,\'1-\');">1Ch 22-29</a>) seem to have culminated in David’s fortieth year (<a onClick="return mV(\'1Ch\',26,31);">1Ch 26:31</a>). David’s policy was not altogether popular with the nation. His assembly (<a onClick="return mV(\'1Ch\',28,1);">1Ch 28:1</a>) is mostly made up of sarim and other appointed officials, the hereditary Israelite "princes" and "elders" being conspicuous by their absence. The outbreak under Absalom was mainly a matter of skillful manipulation; the hearts of the people were really with David. And yet the party of Absalom was distinctly a legitimist party. It believed in the succession of the eldest son, and it objected to many things in the temple-building policy. Joab and Abiathar and others sympathized with this party, but they remained with David out of personal loyalty to him.<P>The Absalom campaign began early in the calendar year. There is no reason to think that it lasted more than a few weeks. Later in the year a few weeks are enough time to allow for the campaign against Sheba. Joab must have been more or less alienated from David by David’s appointment of Amasa to supersede him. Then came David’s serious illness. Abishag was brought in, not to "attend upon David during has declining years," but to put her vitality at has disposal during a few weeks. Joab and Abiathar did not believe that David would ever do business again. Their personal loyalty to him no longer restrained them from following their own ideas, even though these were contrary to his wishes.<P>The narrative does not represent that Nathan and Bathsheba influenced David to interfere in behalf of Solomon; it represents that they succeeded in arousing him from has torpor, so that he carried out his own wishes and intentions. Perhaps resting in bed had done something for him. The treatment by Abishag had not been unsuccessful. And now a supreme appeal to his mind proved sufficient to arouse him. He became himself again, and acted with has usual vigor and wisdom.<P>Adonijah is described as a handsome and showy man, but his conduct does not give us a high opinion of his capabilities. He had no real command of the respect of the guests who shouted "Live King Adonijah." When they heard that Solomon had been crowned, they "were afraid, and rose up, and went every man his way." Adonijah made has submission, but afterward attempted to engage in intrigues, and was put to death.<P>(2) One of the Levites sent out by Jehoshaphat, in his third year, with the Book of the Law, to give instruction in Judah (<a onClick="return mV(\'2Ch\',17,8);">2Ch 17:8</a>).<P>(3) One of the names given, under the heading "the chiefs of the people," of those who sealed the covenant along with Nehemiah (<a onClick="return mV(\'Neh\',10,16);">Ne 10:16</a>).``11';
isbe[216]='Adonikam`ad-o-ni\'-kam (\'adhoniqam, "my lord has risen up"): The name of a family of the returning exiles (<a onClick="return mV(\'Ezr\',2,13);">Ezr 2:13</a>; <a onClick="return mV(\'Neh\',7,18);">Ne 7:18</a>). "The sons of Adonikam," men and women and children, numbered 666 according to the list as given in Ezra, but 667 according to the copy in Nehemiah. Either included among these or in addition to them was the contingent that came with Ezra, "Ehphalet, Jeuel, and Shemaiah, and with them 60 males" (<a onClick="return mV(\'Ezr\',8,13);">Ezr 8:13</a>).``1';
isbe[217]='Adoniram`ad-o-ni\'-ram (\'adhoniram, "my lord is exalted"): An official of Solomon (<a onClick="return mV(\'1Ki\',4,6);">1Ki 4:6</a>; <a onClick="return mV(\'1Ki\',5,14);">5:14</a>). Near the close of the reign of David, and at the opening of the reign of Rehoboam, the same office was held by Adoram (<a onClick="return mV(\'2Sa\',20,24);">2Sa 20:24</a>; <a onClick="return mV(\'1Ki\',12,18);">1Ki 12:18</a>).<P>The name Adoram seems to be a contraction of Adoniram, and doubtless the same person held the office in all the three reigns. The name also appears as Hadoram (<a onClick="return mV(\'2Ch\',10,18);">2Ch 10:18</a>). In the King James Version and the Revised Version (British and American) the office is variantly described as "over the tribute," which is misleading, and "over the levy," which is correct, though obscure. In the American Standard Revised Version it is uniformly "over the men subject to taskwork." Adoniram was at the head of the department of forced labor for the government. The record is to the effect that peoples conquered by Israel, except the Canaanites, were to be spared, subject to the obligation to forced labor on the public works (<a onClick="return mV(\'Deu\',20,11);">De 20:11</a>); that this law was actually extended to the Canaanites (<a onClick="return mV(\'Jos\',16,10);">Jos 16:10</a>; <a onClick="return mV(\'Jos\',17,13);">17:13</a>; <a onClick="return mV(\'Jdg\',1,28);">Jud 1:28</a>f.); that David, in his preparations for the temple, organized and handed over to Solomon a service of forced labor (<a onClick="return mV(\'1Ch\',22,2,15);">1Ch 22:2, 15</a>, etc.); that under Solomon this service was elaborately maintained (<a onClick="return mV(\'1Ki\',5,13);">1Ki 5:13</a>f.; <a onClick="return mV(\'1Ki\',9,15);">9:15</a>f.; <a onClick="return mV(\'2Ch\',8,7);">2Ch 8:7</a>f.).<P>It was not for the temple only, but for all Solomon\'s numerous building enterprises. In theory men of Israelite blood were free from this burden, but practically they found it a burden and a grievance. At the accession of Rehoboam they protested against it (<a onClick="return mV(\'1Ki\',12,1);">1Ki 12</a>; <a onClick="return mV(\'2Ch\',10,1);">2Ch 10</a>). Nothing in the account is more indicative of Rehoboam\'s utter lack of good judgment than his sending his veteran superintendent of the forced labor department to confer with the people. The murder of Adoniram, and the ignominious flight of Rehoboam, were natural consequences.``11';
isbe[218]='Adonis`a-do\'-nis: A name for the Babylonian god <a href="./study/isbe/search.html?string=TAMMUZ">TAMMUZ</a>, which see. The word occurs only in the English Revised Version, margin of <a onClick="return mV(\'Isa\',17,10);">Isa 17:10</a>, where for "pleasant plants" is read "plantings of Adonis." The the American Standard Revised Version rightly omits this marginal suggestion.``1';
isbe[219]='Adoption`a-dop\'-shun (huiothesia, "placing as a son"):</p><p><b>I. THE GENERAL LEGAL IDEA</b><P class="in15">1. In the Old Testament <P class="in15">2. Greek <P class="in15">3. Roman<P><b>II. PAUL\'S DOCTRINE</b><P class="in15">1. In Galatians as Liberty <P class="in15">2. In Romans as Deliverance from Debt<P><b>III. THE CHRISTIAN EXPERIENCE</b><P class="in15">1. In Relation to Justification <P class="in15">2. In Relation to Sanctification <P class="in15">3. In Relation to Regeneration<P><b>IV. AS GOD\'S ACT</b><P class="in15">1. Divine Fatherhood<P class="in15">2. Its Cosmic Range<hr /> This term appears first in New Testament, and only in the epistles of Paul (<a onClick="return mV(\'Gal\',4,5);">Ga 4:5</a>; <a onClick="return mV(\'Rom\',8,15,23);">Ro 8:15, 23</a>; <a onClick="return mV(\'Rom\',9,4);">9:4</a>; <a onClick="return mV(\'Eph\',1,5);">Eph 1:5</a>) who may have coined it out of a familiar Greek phrase of identical meaning. It indicated generally the legal process by which a man might bring into his family, and endow with the status and privileges of a son, one who was not by nature his son or of his kindred.<P>I. The General Legal Idea.<P>The custom prevailed among Greeks, Romans and other ancient peoples, but it does not appear in Jewish law.<P>1. In the Old Testament:<P>Three cases of adoption are mentioned: of Moses (<a onClick="return mV(\'Exd\',2,10);">Ex 2:10</a>), Genubath (<a onClick="return mV(\'1Ki\',11,20);">1Ki 11:20</a>) and Esther (<a onClick="return mV(\'Est\',2,7,15);">Es 2:7, 15</a>), but it is remarkable that they all occur outside of Palestine—in Egypt and Persia, where the practice of adoption prevailed. Likewise the idea appears in the New Testament only in the epistles of Paul, which were addressed to churches outside Palestine. The motive and initiative of adoption always lay with the adoptive father, who thus supplied his lack of natural offspring and satisfied the claims of affection and religion, and the desire to exercise paternal authority or to perpetuate his family. The process and conditions of adoption varied with different peoples. Among oriental nations it was extended to slaves (as Moses) who thereby gained their freedom, but in Greece and Rome it was, with rare exceptions, limited to citizens.<P>2. Greek:<P>In Greece a man might during his lifetime, or by will, to take effect after his death, adopt any male citizen into the privileges of his son, but with the invariable condition that the adopted son accepted the legal obligations and religious duties of a real son.<P>3. Roman:<P>In Rome the unique nature of paternal authority (patria potestas), by which a son was held in his father\'s power, almost as a slave was owned by his master, gave a peculiar character to the process of adoption. For the adoption of a person free from paternal authority (sui juris), the process and effect were practically the same in Rome as in Greece (adrogatio). In a more specific sense, adoption proper (adoptio) was the process by which a person was transferred from his natural father\'s power into that of his adoptive father, and it consisted in a fictitious sale of the son, and his surrender by the natural to the adoptive father.<P>II. Paul\'s Doctrine.<P>As a Roman citizen the apostle would naturally know of the Roman custom, but in the cosmopolitan city of Tarsus, and again on his travels, he would become equally familiar with the corresponding customs of other nations. He employed the idea metaphorically much in the manner of Christ\'s parables, and, as in their case, there is danger of pressing the analogy too far in its details. It is not clear that he had any specific form of adoption in mind when illustrating his teaching by the general idea. Under this figure he teaches that God, by the manifestation of His grace in Christ, brings men into the relation of sons to Himself, and communicates to them the experience of sonship.<P>1. In Galatians as Liberty:<P>In Galatians, Paul emphasizes especially the liberty enjoyed by those who live by faith, in contrast to the bondage under which men are held, who guide their lives by legal ceremonies and ordinances, as the Galatians were prone to do (<a onClick="return mV(\'Gal\',5,1);">Ga 5:1</a>). The contrast between law and faith is first set forth on the field of history, as a contrast between both the pre-Christian and the Christian economies (<a onClick="return mV(\'Gal\',3,23,24);">Ga 3:23-24</a>), although in another passage he carries the idea of adoption back into the covenant relation of God with Israel (<a onClick="return mV(\'Rom\',9,4);">Ro 9:4</a>). But here the historical antithesis is reproduced in the contrast between men who now choose to live under law and those who live by faith. Three figures seem to commingle in the description of man\'s condition under legal bondage—that of a slave, that of a minor under guardians appointed by his father\'s will, and that of a Roman son under the patria potestas (<a onClick="return mV(\'Gal\',4,\'1-3\');">Ga 4:1-3</a>). The process of liberation is first of all one of redemption or buying out (Greek exagorasei) (<a onClick="return mV(\'Gal\',4,5);">Ga 4:5</a>). This term in itself applies equally well to the slave who is redeemed from bondage, and the Roman son whose adoptive father buys him out of the authority of his natural father. But in the latter case the condition of the son is not materially altered by the process: he only exchanges one paternal authority for another. If Paul for a moment thought of the process in terms of ordinary Roman adoption, the resulting condition of the son he conceives in terms of the more free and gracious Greek or Jewish family life. Or he may have thought of the rarer case of adoption from conditions of slavery into the status of sonship. The redemption is only a precondition of adoption, which follows upon faith, and is accompanied by the sending of "the Spirit of his Son into our hearts, crying, Abba, Father," and then all bondage is done away (<a onClick="return mV(\'Gal\',4,\'5-7\');">Ga 4:5-7</a>).<P>2. In Romans as Deliverance from Debt:<P>In <a onClick="return mV(\'Rom\',8,\'12-17\');">Ro 8:12-17</a> the idea of obligation or debt is coupled with that of liberty. Man is thought of as at one time under the authority and power of the flesh (<a onClick="return mV(\'Rom\',8,5);">Ro 8:5</a>), but when the Spirit of Christ comes to dwell in him, he is no longer a debtor to the flesh but to the Spirit (<a onClick="return mV(\'Rom\',8,12,13);">Ro 8:12-13</a>), and debt or obligation to the Spirit is itself liberty. As in Galatians, man thus passes from a state of bondage into a state of sonship which is also a state of liberty. "For as many as are led by the Spirit of God, these (and these only) are sons of God" (<a onClick="return mV(\'Rom\',8,14);">Ro 8:14</a>). The spirit of adoption or sonship stands in diametrical opposition to the spirit of bondage (<a onClick="return mV(\'Rom\',8,15);">Ro 8:15</a>). And the Spirit to which we are debtors and by which we are led, at once awakens and confirms the experience of sonship within us (<a onClick="return mV(\'Rom\',8,16);">Ro 8:16</a>). In both places, Paul conveys under this figure, the idea of man as passing from a state of alienation from God and of bondage under law and sin, into that relation with God of mutual confidence and love, of unity of thought and will, which should characterize the ideal family, and in which all restraint, compulsion and fear have passed away.<P>III. The Christian Experience.<P>As a fact of Christian experience, the adoption is the recognition and affirmation by man of his sonship toward God. It follows upon faith in Christ, by which man becomes so united with Christ that his filial spirit enters into him, and takes possession of his consciousness, so that he knows and greets God as Christ does (compare <a onClick="return mV(\'Mar\',14,36);">Mr 14:36</a>).<P>1. In Relation to Justification: It is an aspect of the same experience that Paul describes elsewhere, under another legal metaphor, as justification by faith. According to the latter, God declares the sinner righteous and treats him as such, admits into to the experience of forgiveness, reconciliation and peace (<a onClick="return mV(\'Rom\',5,1);">Ro 5:1</a>). In all this the relation of father and son is undoubtedly involved, but in adoption it is emphatically expressed. It is not only that the prodigal son is welcomed home, glad to confess that he is not worthy to be called a son, and willing to be made as one of the hired servants, but he is embraced and restored to be a son as before. The point of each metaphor is, that justification is the act of a merciful Judge setting the prisoner free, but adoption is the act of a generous father, taking a son to his bosom and endowing him with liberty, favor and a heritage.<P>2. In Relation to Sanctification:<P>Besides, justification is the beginning of a process which needs for its completion a progressive course of sanctification by the aid of the Holy Spirit, but adoption is coextensive with sanctification. The sons of God are those led by the Spirit of God (<a onClick="return mV(\'Rom\',8,14);">Ro 8:14</a>); and the same spirit of God gives the experience of sonship. Sanctification describes the process of general cleansing and growth as an abstract process, but adoption includes it as a concrete relation to God, as loyalty, obedience, and fellowship with an ever-loving Father.<P>3. In Relation to Regeneration:<P>Some have identified adoption with regeneration, and therefore many Fathers and Roman Catholic theologians have identified it with baptismal regeneration, thereby excluding the essential fact of conscious sonship. The new birth and adoption are certainly aspects of the same totality of experience, but they belong to different systems of thought, and to identify them is to invite confusion. The new birth defines especially the origin and moral quality of the Christian experience as an abstract fact, but adoption expresses a concrete relation of man to God. Nor does Paul here raise the question of man\'s natural and original condition. It is pressing the analogy too far to infer from this doctrine of adoption that man is by nature not God\'s son. It would contradict Paul\'s teaching elsewhere (e.g. <a onClick="return mV(\'Act\',17,28);">Ac 17:28</a>), and he should not be convicted of inconsistency on the application of a metaphor. He conceives man outside Christ as morally an alien and a stranger from God, and the change wrought by faith in Christ makes him morally a son and conscious of his sonship; but naturally he is always a potential son because God is always a real father.<P>IV. As God\'s Act.<P>Adoption as God\'s act is an eternal process of His gracious love, for He "fore-ordained us unto adoption as sons through Jesus Christ unto himself, according to the good pleasure of his will" (<a onClick="return mV(\'Eph\',1,5);">Eph 1:5</a>).<P>1. Divine Fatherhood:<P>The motive and impulse of Fatherhood which result in adoption were eternally real and active in God. In some sense He had bestowed the adoption upon Israel (<a onClick="return mV(\'Rom\',9,4);">Ro 9:4</a>). "Israel is my son, my first-born" (<a onClick="return mV(\'Exd\',4,22);">Ex 4:22</a>; compare <a onClick="return mV(\'Deu\',14,1);">De 14:1</a>; <a onClick="return mV(\'Deu\',32,6);">32:6</a>; <a onClick="return mV(\'Jer\',31,9);">Jer 31:9</a>; <a onClick="return mV(\'Hsa\',11,1);">Ho 11:1</a>). God could not reveal Himself at all without revealing something of His Fatherhood, but the whole revelation was as yet partial and prophetic. When "God sent forth his Son" to redeem them that were under the law," it became possible for men to receive the adoption; for to those who are willing to receive it, He sent the Spirit of the eternal Son to testify in their hearts that they are sons of God, and to give them confidence and utterance to enable them to call God their Father (<a onClick="return mV(\'Gal\',4,5,6);">Ga 4:5-6</a>; <a onClick="return mV(\'Rom\',8,15);">Ro 8:15</a>).<P>2. Its Cosmic Range:<P>But this experience also is incomplete, and looks forward to a fuller adoption in the response, not only of man\'s spirit, but of the whole creation, including man\'s body, to the Fatherhood of God (<a onClick="return mV(\'Rom\',8,23);">Ro 8:23</a>). Every filial spirit now groans, because it finds itself imprisoned in a body subjected to vanity, but it awaits a redemption of the body, perhaps in the resurrection, or in some final consummation, when the whole material creation shall be transformed into a fitting environment for the sons of God, the creation itself delivered from the bondage of corruption into the liberty of the glory of the children of God (<a onClick="return mV(\'Rom\',8,21);">Ro 8:21</a>). Then will adoption be complete, when man\'s whole personality shall be in harmony with the spirit of sonship, and the whole universe favorable to its perseverance in a state of blessedness.<P>LITERATURE:<P>Lightfoot, Galatians; Sanday, Romans; Lidgett, Fatherhood of God; Ritschl, Justification and Reconciliation.`<a href="./study/isbe/search.html?string=CHILDREN+OF+GOD">CHILDREN OF GOD</a>`145';
isbe[220]='Ador; Adora`a\'-dor, a-do\'-ra (Adora): In Idumaea, mentioned in Ant, XIII, ix, 1 as one of the cities captured by Hyrcanus, and referred to in 1Macc 13:20.`<a href="./study/isbe/search.html?string=ADORAIM">ADORAIM</a>`1';

isbe[221]='Adoraim`ad-o-ra\'-im (\'adhorayim, "a pair of knolls," perhaps): One of several cities in Judah that were fortified by Rehoboam (<a onClick="return mV(\'2Ch\',11,9);">2Ch 11:9</a>). The name appears in Josephus and in 1Macc as Adora or Dora or Dor. Its location is indicated in general by that of the other cities which the record in Chronicles groups with it. Common consent identifies it with Dura, about five miles west by south of Hebron.``1';
isbe[222]='Adoram`a-do\'-ram.`<a href="./study/isbe/search.html?string=ADONIRAM">ADONIRAM</a>`1';
isbe[223]='Adoration`ad-o-ra\'-shun: Though this word never occurs in English Versions, it represents aspects of worship which are very prominent in the Bible.<P>I. Etymology.<P>The word is derived from Latin adorare = <P>(1) "to speak to,"<P>(2) "to beseech," "entreat,"<P>(3) "to do homage," "to worship"; from the Latin, os (oris), mouth.<P>Some have supposed that the root os points to the Roman practice of applying the hand to the mouth, i.e. kissing the hand to (a person or thing), as a token of homage.<P>II. Meaning.<P>Adoration is intense admiration culminating in reverence and worship, together with the outward acts and attitudes which accompany such reverence. It thus includes both the subjective sentiments, or feelings of the soul, in the presence of some superior object or person, and the appropriate physical expressions of such sentiments in outward acts of homage or of worship. In its widest sense it includes reverence to beings other than God, especially to monarchs, who in oriental countries were regarded with feelings of awe. But it finds its highest expression in religion. Adoration is perhaps the highest type of worship, involving the reverent and rapt contemplation of the Divine perfections and prerogatives, the acknowledgment of them in words of praise, together with the visible symbols and postures that express the adoring attitude of the creature in the presence of his Creator. It is the expression of the soul\'s mystical realization of God\'s presence in His transcendent greatness, holiness and lovingkindness. As a form of prayer, adoration is to be distinguished from other forms, such as petition, thanksgiving, confession and intercession.<P>III. Outward Postures.<P>In the Old Testament and New Testament, these are similar to those which prevailed in all oriental countries, as amply illustrated by the monuments of Egypt and Assyria, and by the customs still in use among the nations of the East. The chief attitudes referred to in the Bible are the following:<P>1. Prostration:<P>Among the Orientals, especially Persians, prostration (i.e. falling upon the knees, then gradually inclining the body, until the forehead touched the ground) was common as an expression of profound reverence and humility before a superior or a benefactor. It was practiced in the worship of Yahweh (<a onClick="return mV(\'Gen\',17,3);">Ge 17:3</a>; <a onClick="return mV(\'Num\',16,45);">Nu 16:45</a>; <a onClick="return mV(\'Mat\',26,39);">Mt 26:39</a>, Jesus in Gethsemane; <a onClick="return mV(\'Rev\',1,17);">Re 1:17</a>), and of idols (<a onClick="return mV(\'2Ki\',5,18);">2Ki 5:18</a>; <a onClick="return mV(\'Dan\',3,5,6);">Da 3:5-6</a>), but was by no means confined to religious exercises. It was the formal method of supplicating or doing obeisance to a superior (eg <a onClick="return mV(\'1Sa\',25,23);">1Sa 25:23</a>f.; <a onClick="return mV(\'2Ki\',4,37);">2Ki 4:37</a>; <a onClick="return mV(\'Est\',8,3);">Es 8:3</a>; <a onClick="return mV(\'Mar\',5,22);">Mr 5:22</a>; <a onClick="return mV(\'Jhn\',11,32);">Joh 11:32</a>).<P>2. Kneeling:<P>A substitute for prostration was kneeling, a common attitude in worship, frequently mentioned in Old Testament and New Testament (eg <a onClick="return mV(\'1Ki\',8,54);">1Ki 8:54</a>; <a onClick="return mV(\'Ezr\',9,5);">Ezr 9:5</a>; <a onClick="return mV(\'Psa\',95,6);">Ps 95:6</a>; <a onClick="return mV(\'Isa\',45,23);">Isa 45:23</a>; <a onClick="return mV(\'Luk\',22,41);">Lu 22:41</a>, Christ in Gethsemane; <a onClick="return mV(\'Act\',7,60);">Ac 7:60</a>; <a onClick="return mV(\'Eph\',3,14);">Eph 3:14</a>). The same attitude was sometimes adopted in paying homage to a fellow-creature, as in <a onClick="return mV(\'2Ki\',1,13);">2Ki 1:13</a>. "Sitting" as an attitude of prayer (only <a onClick="return mV(\'2Sa\',7,18);">2Sa 7:18</a> parallel <a onClick="return mV(\'1Ch\',17,16);">1Ch 17:16</a>) was probably a form of kneeling, as in Mahometan worship.<P>3. Standing:<P>This was the most usual posture in prayer, like that of modern Jews in public worship. Abraham "stood before Yahweh (Yahweh)" when he interceded for Sodom (<a onClick="return mV(\'Gen\',18,22);">Ge 18:22</a>). Compare <a onClick="return mV(\'1Sa\',1,26);">1Sa 1:26</a>. The Pharisee in the parable "stood and prayed" (<a onClick="return mV(\'Luk\',18,11);">Lu 18:11</a>), and the hypocrites are said to "pray standing in the synagogues, and in the corners of the streets" (<a onClick="return mV(\'Mat\',6,5);">Mt 6:5</a> the King James Version).<P>4. The Hands:<P>The above postures were accompanied by various attitudes of the hands, which were either lifted up toward heaven (<a onClick="return mV(\'Psa\',63,4);">Ps 63:4</a>; <a onClick="return mV(\'1Ti\',2,8);">1Ti 2:8</a>), or outspread (<a onClick="return mV(\'Exd\',9,29);">Ex 9:29</a>; <a onClick="return mV(\'Ezr\',9,5);">Ezr 9:5</a>; <a onClick="return mV(\'Isa\',1,15);">Isa 1:15</a>), or both (<a onClick="return mV(\'1Ki\',8,54);">1Ki 8:54</a>).<P>5. Kiss of Adoration:<P>The heathen practice of kissing hands to the heavenly bodies as a sign of adoration is referred to in <a onClick="return mV(\'Job\',31,27);">Job 31:27</a>, and of kissing the idol in <a onClick="return mV(\'1Ki\',19,18);">1Ki 19:18</a>; <a onClick="return mV(\'Hsa\',13,2);">Ho 13:2</a>. The kiss of homage is mentioned in <a onClick="return mV(\'Psa\',2,12);">Ps 2:12</a>, if the text there be correct. Kissing hands to the object of adoration was customary among the Romans (Pliny xxviii.5). The New Testament word for "worship" (proskuneo) literally means to kiss (the hand) to (one).<P>See also <a href="./study/isbe/search.html?string=ATTITUDES">ATTITUDES</a>.<P>IV. Objects of Adoration.<P>The only adequate object of adoration is the Supreme Being. He only who is the sum of all perfections can fully satisfy man\'s instincts of reverence, and elicit the complete homage of his soul.<P>1. Fellow-Creatures:<P>Yet, as already suggested, the crude beginnings of religious adoration are to be found in the respect paid to created beings regarded as possessing superior claims and powers, especially to kings and rulers. As instances we may mention the woman of Tekoa falling on her face to do obeisance to king David (<a onClick="return mV(\'2Sa\',14,4);">2Sa 14:4</a>), and the king\'s servants bowing down to do reverence to Haman (<a onClick="return mV(\'Est\',3,2);">Es 3:2</a>). Compare <a onClick="return mV(\'Rth\',2,10);">Ru 2:10</a>; <a onClick="return mV(\'1Sa\',20,41);">1Sa 20:41</a>; <a onClick="return mV(\'2Sa\',1,2);">2Sa 1:2</a>; <a onClick="return mV(\'2Sa\',14,22);">14:22</a>.<P>2. Material Objects:<P>On a higher plane, as involving some recognition of divinity, is the homage paid to august and mysterious objects in Nature, or to phenomena in the physical world which were supposed to have some divine significance. To give reverence to material objects themselves is condemned as idolatry throughout the Old Testament. Such an example is the case with the worship of "the host of heaven" (the heavenly bodies) sometimes practiced by the Hebrews (<a onClick="return mV(\'2Ki\',17,16);">2Ki 17:16</a>; <a onClick="return mV(\'2Ki\',21,3,5);">21:3, 5</a>). So Job protests that he never proved false to God by kissing hands to the sun and moon in token of adoration (<a onClick="return mV(\'Job\',31,\'26-28\');">Job 31:26-28</a>). We have reference in the Old Testament to acts of homage paid to an idol or an image, such as falling down before it (<a onClick="return mV(\'Isa\',44,15,17,19);">Isa 44:15,17,19</a>; <a onClick="return mV(\'Dan\',3,7);">Da 3:7</a>), or kissing it (<a onClick="return mV(\'1Ki\',19,18);">1Ki 19:18</a>; <a onClick="return mV(\'Hsa\',13,2);">Ho 13:2</a>). All such practices are condemned in uncompromising terms. But when material things produce a reverential attitude, not to themselves, but to the Deity whose presence they symbolize, then they are regarded as legitimate aids to devotion; eg. fire as a manifestation of the Divine presence is described as causing the spectator to perform acts of reverence (eg. <a onClick="return mV(\'Exd\',3,2,5);">Ex 3:2,5</a>; <a onClick="return mV(\'Lev\',9,24);">Le 9:24</a>; <a onClick="return mV(\'1Ki\',18,38);">1Ki 18:38</a>f.). In these instances, it was Yahweh Himself that was worshipped, not the fire which revealed Him. The sacred writers are moved to religious adoration by the contemplation of the glories of Nature. To them, "the heavens declare the glory of God, and the firmament sheweth his handiwork." (Compare especially the "nature Psalms" <a onClick="return mV(\'Psa\',8,\'1-\');">Ps 8</a>; <a onClick="return mV(\'Psa\',19,\'1-\');">19</a>; <a onClick="return mV(\'Psa\',29,\'1-\');">29</a>; <a onClick="return mV(\'Psa\',104,\'1-\');">104</a>.)<P>3. Angels:<P>On a still higher plane is the adoration practiced in the presence of supernatural agents of the Divine will. When an angel of God appeared, men fell instinctively before him in reverence and awe (eg. <a onClick="return mV(\'Gen\',18,2);">Ge 18:2</a>; <a onClick="return mV(\'Gen\',19,1);">19:1</a>; <a onClick="return mV(\'Num\',22,31);">Nu 22:31</a>; <a onClick="return mV(\'Jdg\',13,20);">Jud 13:20</a>; <a onClick="return mV(\'Luk\',24,4,5);">Lu 24:4-5</a>). This was not to worship the creature instead of the Creator, for the angel was regarded, not as a distract individual having an existence and character of his own, but as a theophany, a self-manifestation of God.<P>4. The Deity:<P>The highest form of adoration is that which is directed immediately to God Himself, His kingly attributes and spiritual excellencies being so apprehended by the soul that it is filled with rapture and praise, and is moved to do Him reverence. A classical instance is the vision that initiated Isaiah into the prophetic office, when he was so possessed with the sovereignty and sublimity of God that he was filled with wonder and self-abasement (<a onClick="return mV(\'Isa\',6,\'1-5\');">Isa 6:1-5</a>). In the Old Testament, the literature of adoration reaches its high-water mark in the Psalms (compare especially the group <a onClick="return mV(\'Psa\',95,\'1-\');">Psalms 95-100</a>), where the ineffable majesty, power and holiness of God are set forth in lofty strains. In the New Testament, adoration of the Deity finds its most rapturous expression in Rev, where the vision of God calls forth a chorus of praise addressed to the thrice-holy God (<a onClick="return mV(\'Rev\',4,\'8-11\');">4:8-11</a>; <a onClick="return mV(\'Psa\',7,11,12);">7:11-12</a>), with whom is associated the Redeemer-Lamb.<P>5. Jesus Christ:<P>How far is Jesus regarded in the New Testament as an object of adoration, seeing that adoration is befitting only to God? During our Lord\'s lifetime He was often the object of worship (<a onClick="return mV(\'Mat\',2,11);">Mt 2:11</a>; <a onClick="return mV(\'Mat\',8,2);">8:2</a>; <a onClick="return mV(\'Mat\',9,18);">9:18</a>; <a onClick="return mV(\'Mat\',14,33);">14:33</a>; <a onClick="return mV(\'Mat\',15,25);">15:25</a>; <a onClick="return mV(\'Mat\',20,20);">20:20</a>; <a onClick="return mV(\'Mat\',28,9,17);">28:9, 17</a>; <a onClick="return mV(\'Mar\',5,6);">Mr 5:6</a>; <a onClick="return mV(\'Jhn\',9,38);">Joh 9:38</a>). Some ambiguity, however, belongs to the Greek word proskunein, for while it is the usual word for "worshipping" God (eg. <a onClick="return mV(\'Jhn\',4,24);">Joh 4:24</a>), in some contexts it means no more than paying homage to a person of superior rank by kneeling or prostration, just as the unmerciful servant is said to have \'fallen down and worshipped\' his master the king (<a onClick="return mV(\'Mat\',18,26);">Mt 18:26</a>), and as Josephus speaks of the Jewish high priests as proskunoumenoi (BJ, IV, v, 2). On the other hand, it certainly implies a consciousness, on the part of those who paid this respect to Jesus, and of Jesus Himself, of a very exceptional superiority in His person, for the same homage was refused by Peter, when offered to him by Cornelius, on the ground that he himself also was a man (<a onClick="return mV(\'Act\',10,25);">Ac 10:25</a>f.), and even by the angel before whom John prostrated himself, on the ground that God alone was to be "worshipped" (<a onClick="return mV(\'Rev\',22,8,9);">Re 22:8-9</a>).<P>Yet Jesus never repudiated such tokens of respect. But whatever about the "days of His flesh," there is no doubt that after the ascension Christ became to the church the object of adoration as Divine, and the homage paid to Him was indistinguishable in character from that paid to God. This is proved not only by isolated passages, but still more by the whole tone of the Acts and epistles in relation to Him. This adoration reaches its highest expression in <a onClick="return mV(\'Rev\',5,\'9-14\');">Re 5:9-14</a>, where the Redeemer-Lamb who shares the throne of God is the subject of an outburst of adoring praise on the part of the angelic hosts. In <a onClick="return mV(\'Rev\',4,\'8-11\');">Re 4:8-11</a> the hymn of adoration is addressed to the Lord God Almighty, the Creator; here it is addressed to the Lamb on the ground of His redeeming work. In Revelation the adoration of Him "who sitteth on the throne" and that of "the Lamb" flow together into one stream of ecstatic praise (compare <a onClick="return mV(\'Rev\',7,\'9-11\');">Re 7:9-11</a>).``49';
isbe[224]='Adorn`a-dorn\' (kosmeo): Has as its primary meaning "to arrange," "to put In order," "to decorate." It is used with reference to the manner in which Christian women were urged to dress. This was a vital question in the early church, and both Paul and Peter give advice on the subject (<a onClick="return mV(\'1Ti\',2,9);">1Ti 2:9</a>; <a onClick="return mV(\'1Pe\',3,3);">1Pe 3:3</a>).<P>Figurative: In <a onClick="return mV(\'Mat\',12,44);">Mt 12:44</a> the King James Version the word is translated "garnish" and is used in a figurative sense. It describes accurately the condition of the Jewish nation. Even though they have swept out idolatry and have adorned the life with much ceremony and endless religious prescriptions yet the evil spirit can say, "I will return to my house." This same thing has repeatedly been done by individuals and nations when reforms have been instituted, but Christ was not enthroned and the heart or nation was still dominated by evil. It is used also in a figurative sense with reference to the graces of the Christian life. When we remember how very highly Orientals esteem the adornment of the body, its use here becomes very forceful. It is this that makes <a onClick="return mV(\'Psa\',45,13);">Ps 45:13</a> of special significance as to the beauty and glory of the church as she is presented to God. See also <a onClick="return mV(\'Pro\',1,9);">Pr 1:9</a>; <a onClick="return mV(\'Pro\',4,9);">4:9</a>; <a onClick="return mV(\'Isa\',61,10);">Isa 61:10</a>; <a onClick="return mV(\'1Pe\',3,4,5);">1Pe 3:4-5</a>. Consecration to God, the indwelling of His Spirit, righteousness, a meek and quiet spirit—these are the true adornments of the life. All these passages carry with them the idea of joy, the satisfaction that should be ours in these possessions.`<a href="./study/isbe/search.html?string=DRESS">DRESS</a>`87';
isbe[225]='Adra`a\'-dra. See <a href="./study/isbe/search.html?string=ARAD">ARAD (city).``1';
isbe[226]='Adrammelech and Anammelech`a-dram\'-el-ek and a-nam\'-el-ek (\'adhrammelekh and \'anammelekh, apparently, according to Assyrian usage, "Adar is prince," "Anu is prince." By Palestinian usage it would be "Adar is king," "Anu is king"):<P>(1) The names given by the Israelite narrator to the god or gods imported into the Samaritan land by the men of Sepharvaim whom the king of Assyria had settled there (<a onClick="return mV(\'2Ki\',17,31);">2Ki 17:31</a>). In the Babylonian pantheon Anu, the god of heaven, is one of the three chief gods, and Adar, otherwise known as Ninib, is a solar god. Concerning the statements in this verse in Kings, archaeologists differ in some important points, and it is a case in which a suspended judgment may be becoming in one who is not an expert. But at least a portion of the alleged difficulties have arisen from failures to get the point of view of the Israelite narrator. He is writing from a time considerably later than the establishment of the institutions of which he speaks—late enough to render the phrase "unto this day" suitable (<a onClick="return mV(\'2Ki\',17,34);">2Ki 17:34</a>), late enough so that words and usages may have undergone modification. He is describing a mixture of religions which he evidently regards as deserving of contempt and ridicule, even apart from the falsity of the religions included in it. This mixture he describes as containing ingredients of three kinds—first, the imported religions of the imported peoples; second, the local high-place religions (<a onClick="return mV(\'2Ki\',17,32);">2Ki 17:32</a>, etc.), and third, the Yahweh religion of Northern Israel (not that of Jerusalem). It is not likely that he thought that they practiced any cult in its purity. They contaminated the religion of Yahweh by introducing Canaanitish usages into it, and they are likely to have done the same with the ancestral religions which they brought with them. The proper names may be correct as representing Palestine usage, even if they differ somewhat from the proper Babylonian usage. The writer says that they "burnt their children in the fire to Adrammelech," but this does not necessarily prove that he thought that they brought this practice from Babylonia; his idea may be that they corrupted even their own false cult by introducing into it this horrible Canaanitish rite. In considering the bearings of the evidence of the monuments on the case, considerations of this kind should not be neglected.<P>(2) The name of a son of Sennacherib king of Assyria—one of the two who slew him and escaped, indirectly leading to the accession of Esar-haddon (<a onClick="return mV(\'2Ki\',19,37);">2Ki 19:37</a>; <a onClick="return mV(\'Isa\',37,38);">Isa 37:38</a>). Mention of the incident is found on the monuments, and traces of the name appear in the writings of Abydenus and Poly-histor.``11';
isbe[227]='Adramyttium`ad-ra-mit\'-i-um (Adramuttion; for other forms see Thayer\'s lexicon): An ancient city of Mysia in the Roman Province of Asia. The only reference in the New Testament to it is in <a onClick="return mV(\'Act\',27,2);">Ac 27:2</a> which says that Paul, while being taken a prisoner from Caesarea to Rome, embarked upon a ship belonging to Adramyttium.<P>The city, with a good harbor, stood at the head of the Gulf of Adramyttium facing the island of Lesbos, and at the base of Mt. Ida. Its early history is obscure. While some authors fancy that it was the Pedasus of Homer, others suppose that it was founded by Adramys, the brother of the wealthy Croesus; probably a small Athenian colony existed there long before the time of Adramys. When Pergamus became the capital of Asia, Adramyttium grew to be a city of considerable importance, and the metropolis of the Northwest part of the province. There the assizes were held. The coins which the peasants pick up in the surrounding fields, and which are frequently aids in determining the location and history of the cities of Asia Minor, were struck at Adramyttium as late as the 3rd century AD, and sometimes in connection with Ephesus. Upon them the effigies of Castor and Pollux appear, showing that Adramyttium was the seat of worship of these deities.<P>The ancient city with its harbor has entirely disappeared, but on a hill, somewhat farther inland, is a village of about one thousand houses bearing the name Edremid, a corruption of the ancient name Adramys. The miserable wooden huts occupied by Greek fishermen and by Turks are surrounded by vineyards and olive trees, hence the chief trade is in olive oil, raisins and timber. In ancient times Adramyttium was noted for a special ointment which was prepared there (Pliny, NH, xiii.2.5).``7';
isbe[228]='Adria`a\'-dri-a (Westcott-Hort: ho Hadrias or ho Adrias): In Greek Adrias (Polybios i.2.4), Adriatike Thalassa (Strabo iv.204), and Adriatikon Pelagos (Ptolemy iii.15.2), and in Latin Adriaticum mare (Livy xl.57.7), Adrianum mare (Cicero in Pisonem 38), Adriaticus sinus (Livy x.2.4), and Mare superurn (Cicero ad Att. 9.5.1). The Adriatic Sea is a name derived from the old Etruscan city Atria, situated near the mouth of the Po (Livy v.33.7; Strabo v.214). At first the name Adria was only applied to the most northern part of the sea. But after the development of the Syracusan colonies on the Italian and Illyrian coasts the application of the term was gradually extended southward, so as to reach Mons Garganus (the Abruzzi), and later the Strait of Hydruntum (Ptolemy iii.1.1; Polybios vii.19.2). But finally the name embraced the Ionian Sea as well, and we find it employed to denote the Gulf of Tarentum (Servius Aen xi.540), the Sicilian Sea (Pausanias v. 25), and even the waters between Crete and Malta (Orosius i.2.90). Procopius considers Malta as lying at the western extremity of the Adriatic Sea (i.14). After leaving Crete the vessel in which the apostle Paul was sailing under military escort was "driven to and fro in the sea of Adria" fourteen days (<a onClick="return mV(\'Act\',27,27);">Ac 27:27</a>) before it approached the shore of Malta. We may compare this with the shipwreck of Josephus in "the middle of the Adria" where he was picked up by a ship sailing from Cyrene to Puteoli (Josephus, Vita, 3).``3';
isbe[229]='Adriel`a\'-dri-el (\'adhri\'el, "my help is God"): The son of Barzillai the Meholathite, to whom Merab the daughter of King Saul was married when she should have been given to David (<a onClick="return mV(\'1Sa\',18,19);">1Sa 18:19</a>; <a onClick="return mV(\'2Sa\',21,8);">2Sa 21:8</a>). "Michal" in <a onClick="return mV(\'2Sa\',21,8);">2Sa 21:8</a> is a textual error easily accounted for Adriel and Merab had five sons, whom David handed over to the blood vengeance of the men of Gibeon. The name Adriel seems to be Aramaic, the equivalent of the Hebrew name Azriel.``1';
isbe[230]='Aduel`a-du\'-el (Adouel): An ancestor of Tobit (Tobit 1:1).``1';
isbe[231]='Adullam`a-dul\'-am (\'adhullam):<P>(1) A city, with dependencies, and in ancient times having a king, mentioned five times in the Old Testament, each time in a list with other cities (<a onClick="return mV(\'Jos\',12,15);">Jos 12:15</a>; <a onClick="return mV(\'Jos\',15,35);">15:35</a>; <a onClick="return mV(\'2Ch\',11,7);">2Ch 11:7</a>; <a onClick="return mV(\'Mic\',1,15);">Mic 1:15</a>; <a onClick="return mV(\'Neh\',11,30);">Ne 11:30</a>). In the list of 31 kings whom Joshua smote, Adullam follows Hormah, Arad, Libnah, and precedes Makkedah. Among the 14 Judahite cities of the first group in "the lowland" Adullam is mentioned between Jarmuth and Socoh. In the list of 15 cities fortified by Rehoboam it appears between Socoh and Gath. Micah gives what may be a list of cities concerned in some Assyrian approach to Jerusalem; it begins with Gath, includes Lachish, and ends with Mareshah and Adullam. And Adullam is still in the same company in the list in Nehemiah of the cities "and their villages" where the men of Judah then dwelt. In the time of the patriarchs it was a place to which men "went down" from the central mountain ridge (<a onClick="return mV(\'Gen\',38,1);">Ge 38:1</a>). Judas Maccabeus found it still existing as a city (2Macc 12:38). Common opinion identifies Adullam with the ruin \'Aid-el-Ma, 13 miles west-southwest from Bethlehem (see HGHL, 229f.). This is in spite of the testimony of the Onomasticon, which, it is alleged, confuses Adullam with Eglon. Presumably the city gave its name to the cave of Adullam, the cave being near the city.<P>(2) The cave of Adullam, David\'s headquarters during a part of the time when he was a fugitive from Saul (<a onClick="return mV(\'1Sa\',22,1);">1Sa 22:1</a>; <a onClick="return mV(\'2Sa\',23,13);">2Sa 23:13</a>; <a onClick="return mV(\'1Ch\',11,15);">1Ch 11:15</a>). Sufficient care has not been exercised in reading the Bible statements on this subject. To begin with, Hebrew syntax permits of the use of the word "cave" collectively; it may denote a group or a region of caves; it is not shut up to the meaning that there was one immense cave in which David and his 400 men all found accommodations at once. All reasonings based on this notion are futile.<P>Further, by the most natural syntax of <a onClick="return mV(\'2Sa\',23,\'13-17\');">2Sa 23:13-17</a> (duplicated with unimportant variations in <a onClick="return mV(\'1Ch\',11,\'15-19\');">1Ch 11:15-19</a>), that passage describes two different events, and does not connect the cave of Adullam with the second of these. "And three of the thirty chief men went down, and came to David in the harvest time unto the cave of Adullam; and the troop of the Philistines was encamped in the valley of Rephaim. And David was then in the stronghold; and the garrison of the Philistines was then in Beth-lehem. And David longed, and said, Oh that one would give me water," etc. Concerning these three seniors among David\'s "mighty men" it is narrated, first, that they were David\'s comrades in a certain battle, a battle which the Chronicler identifies with Pas-dammim, where David slew Goliath; second, that they joined David at the cave of Adullam, presumably during the time when he was hiding from Saul; third, that at a later time, when the Philistines were in the valley of Rephaim (compare <a onClick="return mV(\'2Sa\',5,18);">2Sa 5:18</a>), and David was "in the stronghold" (Josephus says "at Jerusalem," Ant, VII, xii, 4), these men broke through the Philistine lines and brought him water from the home well of Bethlehem.<P>The cave of Adullam, like the city, was "down" from the central ridge (<a onClick="return mV(\'1Sa\',22,1);">1Sa 22:1</a>; <a onClick="return mV(\'2Sa\',23,13);">2Sa 23:13</a>). The city was in Judah; and David and his men were in Judah (<a onClick="return mV(\'1Sa\',23,3);">1Sa 23:3</a>) at a time when, apparently, the cave was their headquarters. Gad\'s advice to David to return to Judah (<a onClick="return mV(\'1Sa\',22,3,5);">1Sa 22:3, 5</a>) was given at a time when he had left the cave of Adullam. If the current identification of \'Aid-el-Ma as Adullam is correct, the cave of Adullam is probably the cave region which has been found in that vicinity.<P>It has been objected that this location is too far from Bethlehem for David\'s men to have brought the water from there. To this it is replied that thirteen or fourteen miles is not an excessive distance for three exceptionally vigorous men to go and return; and a yet stronger reply is found in the consideration just mentioned, that the place from which the men went for the water was not the cave of Adullam. The one argument for the tradition to the effect that Chariton\'s cave, a few miles southeast of Bethlehem, is Adullam, is the larger size of this cave, as compared with those near \'Aid-el-Ma We have already seen that this has no force.<P>In our current speech "cave of Adullam" suggests an aggregation of ill-assorted and disreputable men. This is not justified by the Bible record. David\'s men included his numerous and respectable kinsmen, and the representative of the priesthood, and some of David\'s military companions, and some men who afterward held high office in Israel. Even those who are described as being in distress and debt and bitter of soul were doubtless, many of them, persons who had suffered at the hands of Saul on account of their friendship for David. Doubtless they included mere adventurers in their number; but the Scriptural details and the circumstances alike indicate that they were mainly homogeneous, and that most of them were worthy citizens.``11';
isbe[232]='Adullamite`a-dul\'-am-it: The gentilic adjective of <a href="./study/isbe/search.html?string=ADULLAM">ADULLAM</A>, which see. It is used only of Judah\'s friend Hirah (<a onClick="return mV(\'Gen\',38,1,12,20);">Ge 38:1, 12, 20</a>).``1';
isbe[233]='Adultery`a-dul\'-ter-i: In Scripture designates sexual intercourse of a man, whether married or unmarried, with a married woman.<P>1. Its Punishment:<P>It is categorically prohibited in the Decalogue (seventh commandment, <a onClick="return mV(\'Exd\',20,14);">Ex 20:14</a>; <a onClick="return mV(\'Deu\',5,18);">De 5:18</a>): "Thou shalt not commit adultery." In more specific language we read: "And thou shalt not lie carnally with thy neighbor\'s wife, to defile thyself with her" (<a onClick="return mV(\'Lev\',18,20);">Le 18:20</a>). The penalty is death for both guilty parties: "And the man that committeth adultery with another man\'s wife, even he that committeth adultery with his neighbor\'s wife, the adulterer and the adulteress shall surely be put to death" (<a onClick="return mV(\'Lev\',20,10);">Le 20:10</a>). The manner of death is not particularized; according to the rabbis (Siphra\' at the place; Sanhedhrin 52b) it is strangulation. It would seem that in the days of Jesus the manner of death was interpreted to mean stoning ("Now in the law Moses commanded us to stone such," <a onClick="return mV(\'Jhn\',8,5);">Joh 8:5</a>, said of the woman taken in adultery). Nevertheless, it may be said that in the case in question the woman may have been a virgin betrothed unto a husband, the law (in <a onClick="return mV(\'Deu\',22,23);">De 22:23</a>f.) providing that such a person together with her paramour be stoned to death (contrast <a onClick="return mV(\'Deu\',22,22);">De 22:22</a>, where a woman married to a husband is spoken of and the manner of death is again left general). <a onClick="return mV(\'Eze\',16,40);">Eze 16:40</a> (compare <a onClick="return mV(\'Eze\',23,47);">23:47</a>) equally mentions stoning as the penalty of the adulteress; but it couples to her sin also that of shedding blood; hence, the rabbinic interpretation is not necessarily disputed by the prophet. Of course it may also be assumed that a difference of custom may have obtained at different times and that the progress was in the line of leniency, strangulation being regarded as a more humane form of execution than stoning.<P>2. Trial by Ordeal:<P>The guilty persons become amenable to the death penalty only when taken "in the very act" (<a onClick="return mV(\'Jhn\',8,4);">Joh 8:4</a>). The difficulty of obtaining direct legal evidence is adverted to by the rabbis (see Makkoth 7a). In the case of a mere suspicion on the part of the husband, not substantiated by legal evidence, the woman is compelled by the law (<a onClick="return mV(\'Num\',5,\'11-30\');">Nu 5:11-30</a>) to submit to an ordeal, or God\'s judgment, which consists in her drinking the water of bitterness, that is, water from the holy basin mingled with dust from the floor of the sanctuary and with the washed-off ink of a writing containing the oath which the woman has been made to repeat. The water is named bitter with reference to its effects in the case of the woman\'s guilt; on the other hand, when no ill effects follow, the woman is proved innocent and the husband\'s jealousy unsubstantiated. According to the Mishna (Sotah 9) this ordeal of the woman suspected of adultery was abolished by Johanan ben Zaccai (after 70 AD), on the ground that the men of his generation were not above the suspicion of impurity.<P>See article <a href="./study/isbe/search.html?string=BITTER,+BITTERNESS">BITTER, BITTERNESS</a>.<P>3. A Heinous Crime:<P>Adultery was regarded as a heinous crime (<a onClick="return mV(\'Job\',31,11);">Job 31:11</a>). The prophets and teachers in Israel repeatedly upbraid the men and women of their generations for their looseness in morals which did not shrink from adulterous connections. Naturally where luxurious habits of life were indulged in, particularly in the large cities, a tone of levity set in: in the dark of the evening, men, with their features masked, waited at their neighbors\' doors (<a onClick="return mV(\'Job\',24,15);">Job 24:15</a>; <a onClick="return mV(\'Job\',31,9);">31:9</a>; compare <a onClick="return mV(\'Pro\',7,1);">Pr 7:1</a>), and women forgetful of their God\'s covenant broke faith with the husbands of their youth (<a onClick="return mV(\'Pro\',2,17);">Pr 2:17</a>). The prophet Nathan confronted David after his sin with Bathsheba, the wife of Uriah, with his stern rebuke ("Thou art the man," <a onClick="return mV(\'2Sa\',12,7);">2Sa 12:7</a>); the penitential psalm (<a onClick="return mV(\'Psa\',51,\'1-\');">Ps 51</a>)—"Miserere"—was sung by the royal bard as a prayer for divine pardon. Promiscuous intercourse with their neighbors\' wives is laid by Jeremiah at the door of the false prophets of his day (<a onClick="return mV(\'Jer\',23,10,14);">Jer 23:10, 14</a>; <a onClick="return mV(\'Jer\',29,23);">29:23</a>).<P>4. Penal and Moral Distinctions:<P>While penal law takes only cognizance of adulterous relations, it is needless to say that the moral law discountenances all manner of illicit intercourse and all manner of unchastity in man and woman. While the phrases "harlotry," "commit harlotry," in Scripture denote the breach of wedlock (on the part of a woman), in the rabbinical writings a clear distinction is made on the legal side between adultery and fornication. The latter is condemned morally in no uncertain terms; the seventh commandment is made to include all manner of fornication. The eye and the heart are the two intermediaries of sin (Palestinian Talmud, Berakhoth 6b). A sinful thought is as wicked as a sinful act (Niddah 13b and elsewhere). Job makes a covenant with his eyes lest he look upon a virgin (<a onClick="return mV(\'Job\',31,1);">31:1</a>). And so Jesus who came "not to destroy, but to fulfill" (<a onClick="return mV(\'Mat\',5,17);">Mt 5:17</a>), in full agreement with the ethical and religious teaching of Judaism, makes the intent of the seventh commandment explicit when he declares that "every one that looketh on a woman to lust after her hath committed adultery with her already In his heart" (<a onClick="return mV(\'Mat\',5,28);">Mt 5:28</a>). And in the spirit of Hosea (<a onClick="return mV(\'Hsa\',4,15);">Hos 4:15</a>) and Johanan ben Zaccai (see above) Jesus has but scorn for those that are ready judicially to condemn though they be themselves not free from sin! "He that is without sin among you, let him first cast a stone at her" (<a onClick="return mV(\'Jhn\',8,7);">Joh 8:7</a>). Whereas society is in need of the death penalty to secure the inviolability of the home life, Jesus bids the erring woman go her way and sin no more. How readily His word might be taken by the unspiritual to imply the condoning of woman\'s peccability is evidenced by the fact that the whole section (<a onClick="return mV(\'Jhn\',7,\'53-\');">Joh 7:53</a>-<a onClick="return mV(\'Jhn\',8,\'1-11\');">8:11</a>) is omitted by "most ancient authorities" (see Augustine\'s remark).<P>5. A Ground of Divorce:<P>Adultery as a ground of divorce. —The meaning of the expression "some unseemly thing" (<a onClick="return mV(\'Deu\',24,1);">De 24:1</a>) being unclear, there was great variety of opinion among the rabbis as to the grounds upon which a husband may divorce his wife. While the school of Hillel legally at least allowed any trivial reason as a ground for divorce, the stricter interpretation which limited it to adultery alone obtained in the school of Shammai. Jesus coincided with the stricter view (see <a onClick="return mV(\'Mat\',5,32);">Mt 5:32</a>; <a onClick="return mV(\'Mat\',19,9);">19:9</a>, and commentaries). From a moral point of view, divorce was discountenanced by the rabbis likewise, save of course for that one ground which indeed makes the continued relations between husband and wife a moral impossibility.`<a href="./study/isbe/search.html?string=CRIMES">CRIMES</a>; <a href="./study/isbe/search.html?string=DIVORCE+IN+THE+NEW+TESTAMENT">DIVORCE IN THE NEW TESTAMENT</a>; <a href="./study/isbe/search.html?string=DIVORCE+IN+THE+OLD+TESTAMENT">DIVORCE IN THE OLD TESTAMENT</a>`115';
isbe[234]='Adummim`a-dum\'-im (\'adhummim, perhaps "red spots"): "The ascent of Adummim" is one of the numerous landmarks mentioned in defining the northern border of Judah westward from the mouth of the Jordan to Jerusalem, and in defining the southern border of Benjamin eastward from Jerusalem to the mouth of the Jordan (<a onClick="return mV(\'Jos\',15,7);">Jos 15:7</a>; <a onClick="return mV(\'Jos\',18,17);">18:17</a>). It is identified with the gorge part of the road from Jericho up to Jerusalem. Its present name is Tala\'at-ed-Dumm, "ascent of blood." The stone is marked by "curious red streaks," a phenomenon which probably accounts for both the ancient and the modern names, and for other similar names which have been applied to the locality. It is the scene of our Saviour\'s story of the Good Samaritan, and tradition of course locates the inn to which the Samaritan brought the wounded man (see HGHL, 265).``11';
isbe[235]='Advantage`ad-van\'-taj (cakhan): In <a onClick="return mV(\'Job\',35,3);">Job 35:3</a> is interpreted in succeeding clause as "profit." In <a onClick="return mV(\'Rom\',3,1);">Ro 3:1</a> perissos, is likewise interpreted by a paraphrase in the next sentence. the Revised Version (British and American) prefers to render pleonekteo by "take advantage," where the King James Version has "defraud" (<a onClick="return mV(\'2Cr\',7,2);">2Co 7:2</a>), or "make gain of" (<a onClick="return mV(\'2Cr\',12,17);">2Co 12:17</a>; compare <a onClick="return mV(\'2Cr\',2,11);">2Co 2:11</a>). In <a onClick="return mV(\'Jud\',1,16);">Jude 1:16</a> "advantage" (opheleia) means "profit."``1';
isbe[236]='Advent`ad\'-vent.`<a href="./study/isbe/search.html?string=INCARNATION">INCARNATION</a>; <a href="./study/isbe/search.html?string=MILLENNIUM,+POSTMILLENNIAL+VIEW">MILLENNIUM, POSTMILLENNIAL VIEW</a>; <a href="./study/isbe/search.html?string=MILLENNIUM">MILLENNIUM</a>, <a href="./study/isbe/search.html?string=MILLENNIUM,+PREMILLENNIAL VIEW">PREMILLENNIAL VIEW</a>; <a href="./study/isbe/search.html?string=PAROUSIA">PAROUSIA</a>`1';
isbe[237]='Adventure`ad-ven’-tur: "To risk," "to dare," referring always to an undertaking attended with some peril (<a onClick="return mV(\'Jdg\',9,17);">Jdg 9:17</a>: "My father adventured his life"). Compare <a onClick="return mV(\'Deu\',28,56);">De 28:56</a>. So also <a onClick="return mV(\'Ecc\',5,14);">Ec 5:14</a>: "Riches perish by evil adventure." Only once in New Testament for didomi (<a onClick="return mV(\'Act\',19,31);">Ac 19:31</a>), where Paul’s friends beg him "not to adventure himself (archaic for "venture") into theater."``1';
isbe[238]='Adversary`ad\'-ver-sa-ri, ad\'-ver-sa-ri: This word (in the singular or plural) is used in the Old Testament to render different Hebrew words. In thirty-two cases the word corresponds to the noun tsar, or the verb tsarar. This noun is the ordinary word for "foe" or "adversary." In twelve passages the Hebrew word, of which "adversary" is the translation, is satan = noun or satan = verb. This stem means "to oppose," or "thwart" anyone in his purpose or claims.<P>The angel of Yahweh was satan to Balaam (<a onClick="return mV(\'Num\',22,22);">Nu 22:22</a>). The word often denotes a political adversary (<a onClick="return mV(\'1Ki\',11,14,23,25);">1Ki 11:14, 23, 25</a>). In four cases (namely, Prologue to Job; <a onClick="return mV(\'Zec\',3,1,2);">Zec 3:1-2</a>; <a onClick="return mV(\'1Ch\',21,1);">1Ch 21:1</a>; <a onClick="return mV(\'Psa\',109,6);">Ps 109:6</a>) the King James Version retains Satan as the rendering. But it is only in 1 Chronicles that the word is used without the article, that is, strictly as a proper name. The Septuagint gives diabolos, as the rendering, and both in Job and Zechariah, Satan is portrayed as the "false accuser." In two cases "adversary" represents two Hebrew expressions which mean the "opponent in a suit" or "controversy" (<a onClick="return mV(\'Job\',31,35);">Job 31:35</a>; <a onClick="return mV(\'Isa\',50,8);">Isa 50:8</a>).<P>In the New Testament "adversary" represents:<P>(1) antikeimenoi, the participle of a verb which means "to be set over against," "to be opposed" (<a onClick="return mV(\'Luk\',13,17);">Lu 13:17</a>; <a onClick="return mV(\'Phl\',2,8);">Php 2:8</a>).<P>(2) antidikos, "opponent in a lawsuit," "prosecutor" (<a onClick="return mV(\'Mat\',5,25);">Mt 5:25</a>; <a onClick="return mV(\'Luk\',12,58);">Lu 12:58</a>; <a onClick="return mV(\'Luk\',18,3);">18:3</a>; <a onClick="return mV(\'1Pe\',5,8);">1Pe 5:8</a>).<P>According to the last passage the devil is the "accuser" or "prosecutor" of believers, but according to another writer they have an "advocate" or "counselor for the defense" with the Father (<a onClick="return mV(\'1Jo\',2,1);">1Jo 2:1</a>). In one passage (<a onClick="return mV(\'Hbr\',10,27);">Heb 10:27</a>) "adversary" represents a Greek word, hupenantios, which means "set over against," "contrary to"—a word used in classical Greek and in the Septuagint.``103';
isbe[239]='Adversity`ad-vur\'-si-ti: In the Revised Version (British and American) exclusively an Old Testament term, expressing the various forms of distress and evil conveyed by four Hebrew words: tsela\', "a halting" or "fall"; tsarah, "straits" "distress," "affliction"; tsar, "straitness," "affliction"; ra\', "bad," "evil," "harmful." These words cover the whole range of misfortunes caused by enemies, poverty, sorrow and trouble. "Adversity," which occurs once in the King James Version in New Testament (<a onClick="return mV(\'Hbr\',13,3);">Heb 13:3</a>: kakouchoumenos, "ill-treated") is displaced in the Revised Version (British and American) by the literal rendering which illustrates or interprets a common phase of adversity.``139';
isbe[240]='Advertise`ad\'-ver-tiz: This word is found twice in the Old Testament: In <a onClick="return mV(\'Num\',24,14);">Nu 24:14</a> (from Hebrew, ya\'ats, "to advise") Balsam advises Balak of the future of Israel and its influence upon his kingdom ("I will advertise thee"). In the King James Version <a onClick="return mV(\'Rth\',4,4);">Ru 4:4</a> (from galah \'ozen, "to uncover the ear," "to reveal") Boaz in speaking to the nearer kinsman of Ruth: "I thought to advertise thee" (the Revised Version, margin "uncover thine ear").``1';
isbe[241]='Advice; Advise; Advisement`ad-vis’, ad-viz’, ad-viz’-ment: Aside from their regular meaning these words are peculiarly employed as follows:<P>(1) Advice’ In <a onClick="return mV(\'2Sa\',19,43);">2Sa 19:43</a> (from, dabhar, "word") the meaning is equal to "request" (the Revised Version, margin "were we not the first to speak of bringing back"). In <a onClick="return mV(\'1Sa\',25,33);">1Sa 25:33</a> the King James Version (from, Ta‘am, "taste," "reason") "advice" is equal to "sagacity" (the Revised Version (British and American) "blessed be thy discretion"). In <a onClick="return mV(\'2Ch\',25,17);">2Ch 25:17</a> (from ya‘ac, "to give or take counsel") the meaning seems to be "to consult with oneself"; compare also <a onClick="return mV(\'Jdg\',19,30);">Jdg 19:30</a> the King James Version (the Revised Version (British and American) "take counsel").<P>(2) Advise: In <a onClick="return mV(\'2Sa\',24,13);">2Sa 24:13</a> the King James Version (from yadha, "to know") "to advise" means "to advise oneself," i.e. "to consider" (the Revised Version (British and American) "advise thee") Compare also <a onClick="return mV(\'1Ch\',21,12);">1Ch 21:12</a> the King James Version (the Revised Version (British and American) "consider" from, ra’ah, "to see") and <a onClick="return mV(\'Pro\',13,10);">Pr 13:10</a> where "well- advised" is the same as "considerate" (from ya‘ac; see <a onClick="return mV(\'2Ch\',25,17);">2Ch 25:17</a>).<P>(3) Advisement (antiquated): Found once in the Old Testament in <a onClick="return mV(\'1Ch\',12,19);">1Ch 12:19</a> (from ‘etsah, "counsel"), where "upon advisement" means "upon deliberation." Compare 2Macc 14:20 the King James Version (the Revised Version (British and American) "when these proposals had been long considered").``16';
isbe[242]='Advocate`ad\'-vo-kat (parakletos): Found in <a onClick="return mV(\'1Jo\',2,1);">1Joh 2:1</a>, "If any man sin, we have an Advocate with the Father, Jesus Christ the righteous." The Greek word has several shades of meaning:<P>(1) a legal advocate;<P>(2) an intercessor,<P>(3) a helper generally.<P>In the passage before us the first and second meanings are included. Christ in heaven intercedes for Christians who sin upon earth. The next verse declares that He is the "propitiation for our sins" and it is His propitiatory work which lies at the basis of His intercession. The margins of the Revised Version (British and American) and the American Standard Revised Version give as alternative readings Comforter, Helper, Greek Paraclete. Beyond doubt however, "advocate" is the correct translation in the passage in the epistle. The same Greek word also occurs in the Gospel of John (<a onClick="return mV(\'Jhn\',14,16,26);">Joh 14:16, 26</a>; <a onClick="return mV(\'Jhn\',15,26);">15:26</a>; <a onClick="return mV(\'Jhn\',16,7);">16:7</a>) referring not to Christ but to the Holy Spirit, to whom Christ refers as "another comforter" whom He will send from the Father. In the Gospel various functions are ascribed to the Spirit in relation to believers and unbelievers. The word in the Gospel is inadequately translated "Comforter." The Spirit according to these passages, is more than Comforter and more than Advocate.`<a href="./study/isbe/search.html?string=PARACLETE">PARACLETE</a>; <a href="./study/isbe/search.html?string=COMFORTER">COMFORTER</a>; <a href="./study/isbe/search.html?string=HOLY+SPIRIT">HOLY SPIRIT</a>`127';
isbe[243]='Adytum`ad\'-i-tum (Latin from Greek aduton, adjective adutos, "not to be entered"): Applied to the innermost sanctuary or chambers in ancient temples, and to secret places which were open only to priests: hence, also to the Holy of Holies in the Jewish temple.`<a href="./study/isbe/search.html?string=TEMPLE">TEMPLE</a>`1';
isbe[244]='Aedias`a-e-di\'-as (Aedeias). Mentioned in 1Esdras 9:27, being one of those who agreed to divorce their alien wives. This name is supposed to be a corruption of the Greek Helia, there being no Hebrew equivalent for it, and in <a onClick="return mV(\'Ezr\',10,26);">Ezr 10:26</a>, the name occurs in the correct form as Elijah (\'eliyah = "God is Yahweh").``1';
isbe[245]='Aelia`e\'-li-a.`<a href="./study/isbe/search.html?string=JERUSALEM">JERUSALEM</a>`1';
isbe[246]='Aeneas`e-ne\'-as (\'Aineas): A paralytic at Lydda, who, after he "had kept his bed eight years," was miraculously healed by Peter (<a onClick="return mV(\'Act\',9,33,34);">Ac 9:33-34</a>).``1';
