isbe[247]='Aenon`e’-non (Ainon): The place where John was baptizing "because there was much water there" (<a onClick="return mV(\'Jhn\',3,23);">Joh 3:23</a>). It was on the west side of the Jordan, the place where John baptized at the first being on the east (<a onClick="return mV(\'Jhn\',1,28);">Joh 1:28</a>; <a onClick="return mV(\'Jhn\',3,26);">3:26</a>; <a onClick="return mV(\'Jhn\',10,40);">10:40</a>). We may be sure it was not in Samaritan territory. Eusebius, Onomasticon locates it 8 Roman miles south of Scythopolis (Beisan), this stretch of land on the west of the Jordan being then, not under Samaria, but under Scythopolis. Its position is defined by nearness to Salim. Various identifications have been suggested, the most probable being the springs near Umm el-‘Amdan, which exactly suit the position indicated by Eusebius, Onomasticon.`<a href="./study/isbe/search.html?string=SALIM">SALIM</a>`54';
isbe[248]='Aeon`e\'-on: This word originally meant "duration," "dispensation." In the philosophy of Plato and Aristotle the word is aion, from which this word is transliterated. In the Gnostic philosophy it has a special meaning and is there used to solve the problem of the world order. In the infinite separation between God and the world, it was taught, there must of necessity be mediating powers. These powers are the eons and are the successive emanations from God from eternity. They are spiritual, existing as distinct entities. They constituted the Divine fullness or the Divine Pleroma. The name was applied to these beings for two reasons: because they were thought to partake of the eternal existence of God and because they were supposed to govern the various ages. The idea of the eons in various forms may be found in nearly all oriental philosophy that attempted to deal with the problem of the world order. It appears in the writings of Philo, in Shintoism, in the old Zoroastrian religion.`<a href="./study/isbe/search.html?string=GNOSTICISM">GNOSTICISM</a>`87';
isbe[249]='Aesora`e\'-so-ra, the King James Version Esora, e-so\'-ra (Aisora): A town in the borders of Samaria, mentioned in connection with Beth-boron and Jericho (Judith 4:4), and from this association we judge that it was in the eastern part of Samaria.``1';
isbe[250]='Affect; Affection`a-fekt\', a-fek\'-shun: The literal meaning of "affect" is to act upon (Latin ad, "to," "upon," facio, "to do"). It has various shades of meaning, and occurs in the following senses in the English Bible:<P>(1) In its literal sense: <a onClick="return mV(\'Lam\',3,51);">La 3:51</a>, "Mine eye affecteth my soul"<P>(2) In the sense of "to endeavor after," "desire," "court": <a onClick="return mV(\'Gal\',4,17);">Ga 4:17</a>, "They zealously affect (the Revised Version (British and American) "seek") you...that ye may affect (the Revised Version (British and American) "seek") them," i.e. they earnestly court your favor, that you may court theirs. Paul means that the proselytizing zeal of the Judaizers was rooted in personal ambition. The past part. "affected" (the Revised Version (British and American) "sought") has the same meaning in <a onClick="return mV(\'Gal\',4,18);">Ga 4:18</a>. The same Greek word (zeloo) is translated "desire earnestly" in the Revised Version (British and American) (<a onClick="return mV(\'1Cr\',12,31);">1Co 12:31</a>; <a onClick="return mV(\'1Cr\',14,1,39);">14:1, 39</a>). "Affect" has a similar meaning in Ecclesiasticus 13:11.<P>(3) In the passive, it occurs in the sense of "to be disposed," in a neutral sense, with an adverb to characterize the nature of the disposition: <a onClick="return mV(\'Act\',14,2);">Ac 14:2</a>, "evil affected against the brethren" So also 2Macc 4:21; 13:26.<P>"Affection" occurs in the following senses:<P>(1) In the literal sense: the state of having one\'s feelings acted upon or affected in some way; bent or disposition of mind, in a neutral sense (the nature of the affection, whether good or bad, needing further description in the context). So <a onClick="return mV(\'Col\',3,2);">Col 3:2</a>, "Set your affection (the Revised Version (British and American) "mind") on things above"; <a onClick="return mV(\'Col\',3,5);">Col 3:5</a>, "inordinate affection" (here "affection" by itself is neutral; the addition of the adjective makes it equivalent to "passion" in an evil sense, as in the Revised Version (British and American)).<P>(2) In a good sense: tender feeling, warm attachment, good will; the word in itself carrying a good meaning apart from the context. <a onClick="return mV(\'1Ch\',29,3);">1Ch 29:3</a>, "because I have set my affection on the house of my God"; <a onClick="return mV(\'Rom\',1,31);">Ro 1:31</a>; <a onClick="return mV(\'2Ti\',3,3);">2Ti 3:3</a>, "without natural affection", <a onClick="return mV(\'2Cr\',6,12);">2Co 6:12</a> "Ye are straitened in your own affections" (lit. "bowels," regarded as the seat of kindly feelings, compare Eng "heart") So <a onClick="return mV(\'2Cr\',7,15);">2Co 7:15</a>.<P>(3) In an evil sense in the plural = passions. <a onClick="return mV(\'Gal\',5,24);">Ga 5:24</a>, the flesh, with the affections (the Revised Version (British and American) "passions") and "lusts"; <a onClick="return mV(\'Rom\',1,26);">Ro 1:26</a>, "God gave them unto vile affections" (the Revised Version (British and American) "passions").<P>"Affectioned" occurs once, in a neutral sense: <a onClick="return mV(\'Rom\',12,10);">Ro 12:10</a>, "affectioned (i.e. "disposed") one to another" In <a onClick="return mV(\'1Th\',2,8);">1Th 2:8</a>, we have "affectionately," in a good sense.``49';
isbe[251]='Affinity`a-fin\'-i-ti (chathan "to join one-self"): This term is used three times in the Old Testament:<P>(1) in <a onClick="return mV(\'1Ki\',3,1);">1Ki 3:1</a>, where we read that "Solomon made affinity with Pharaoh King of Egypt",<P>(2) in <a onClick="return mV(\'2Ch\',18,1);">2Ch 18:1</a>, where it is stated that Jehoshaphat "joined affinity with Ahab," and<P>(3) in <a onClick="return mV(\'Ezr\',9,14);">Ezr 9:14</a>, where it is asked "Shall we...join in affinity with the peoples that do these abominations?" The Hebrew word thus rendered in the above three passages refers in each case to marriage alliances rather than to family or political relationships.`<a href="./study/isbe/search.html?string=MARRIAGE">MARRIAGE</a>; <a href="./study/isbe/search.html?string=FAMILY">FAMILY</a>`34';
isbe[252]='Affirm; Affirmatives`a-fur\'-ma-tivs (diischurizomai). The verb "affirm" occurs in several passages of the New Testament in the sense of "assert" <a onClick="return mV(\'Luk\',22,59);">Lu 22:59</a>; <a onClick="return mV(\'Act\',12,15);">Ac 12:15</a>; <a onClick="return mV(\'Act\',25,19);">25:19</a> pha-sko; <a onClick="return mV(\'Rom\',3,8);">Ro 3:8</a> phemi; <a onClick="return mV(\'1Ti\',1,7);">1Ti 1:7</a>; <a onClick="return mV(\'Tts\',3,8);">Titus 3:8</a> diabebaioomai. The Hebrew does not employ affirmative particles, but gives a positive reply by either repeating the word in question or by substituting the first person in the reply for the second person in the question, or by employing the formula: "Thou hast said" or "Thou hast rightly said." The Saviour used this idiom (su eipas) when answering Judas and Caiaphas (<a onClick="return mV(\'Mat\',26,25,64);">Mt 26:25, 64</a>). A peculiar elegance occasionally attaches to the interpretation of the Scriptures because of their use of an affirmative and a negative together, rendering the sense more emphatic; sometimes the negative occurs first, as in <a onClick="return mV(\'Psa\',118,17);">Ps 118:17</a>: "I shall not die, but live"; sometimes the affirmative precedes, as in <a onClick="return mV(\'Psa\',88,1);">Isa 88:1</a>: "Thou shalt die, and not live" <a onClick="return mV(\'Jhn\',1,20);">Joh 1:20</a> is made peculiarly emphatic because of the negative placed between two affirmatives: "And he confessed, and denied not; and he confessed, I am not the Christ."``77';
isbe[253]='Affliction`a-flik\'-shun: Represents no fewer than 11 Hebrew words in the Old Testament, and 3 Greek words in the New Testament, of which the most common are (oni), (thlipsis). It is used<P>(1) actively = that which causes or tends to cause bodily pain or mental distress, as "the bread of affliction" (<a onClick="return mV(\'Deu\',16,3);">De 16:3</a>; <a onClick="return mV(\'2Ch\',18,26);">2Ch 18:26</a>); often in plural, as "Many are the afflictions of the righteous" (<a onClick="return mV(\'Psa\',34,19);">Ps 34:19</a>);<P>(2) passively = the state of being in pain or trouble, as "to visit the fatherless and widows in their affliction" (<a onClick="return mV(\'Jam\',1,27);">Jas 1:27</a>).<P>The following are the chief forms of affliction referred to:<P>(1) Individual affliction, especially sickness, poverty, the oppression of the weak by the strong and rich, perverted justice.<P>(2) National. A great place is given in the Old Testament to affliction as a national experience, due to calamities, such as war, invasion, conquest by foreign peoples, exile. These form the background of much of the prophetic writings, and largely determine their tone and character.<P>(3) In the New Testament the chief form of affliction is that due to the fierce antagonism manifested to the religion of Jesus, resulting in persecution.<P>I. The Source of Affliction.<P>1. God:<P>The Hebrew mind did not dwell on secondary causes, but attributed everything, even afflictions, directly to the great First Cause and Author of all things: "Shall evil befall a city, and Yahweh hath not done it?" (<a onClick="return mV(\'Amo\',3,6);">Am 3:6</a>); "I form the light, and create darkness; I make peace, and create evil (i.e. calamity); I am Yahweh, that doeth all these things" (<a onClick="return mV(\'Isa\',45,7);">Isa 45:7</a>) Thus, all things, including calamity, were referred to the Divine operation. The Hebrew when afflicted did not doubt the universal sovereignty of God; yet, while assuming this sovereignty, he was sometimes tempted to accuse Him of indifference, neglect or forgetfulness. Compare Job passim; <a onClick="return mV(\'Isa\',40,27);">Isa 40:27</a>; <a onClick="return mV(\'Isa\',49,14);">49:14</a>; <a onClick="return mV(\'Eze\',8,12);">Eze 8:12</a>; <a onClick="return mV(\'Eze\',9,9);">9:9</a>.<P>2. Evil Agents:<P>Yet there are traces of a dualism which assigns a certain vague limit to God\'s absolute sovereignty, by referring affliction to an evil agency acting in quasi-independence of God. There could, however, never be more than a tendency in this direction, for a strict dualism was incompatible with the standpoint of Jewish monotheism. Thus Saul\'s mental affliction is attributed to an "evil spirit," which is yet said to be "from Yahweh" (<a onClick="return mV(\'1Sa\',16,14);">1Sa 16:14</a>; <a onClick="return mV(\'1Sa\',18,10);">18:10</a>; <a onClick="return mV(\'1Sa\',19,9);">19:9</a>); and the fall of Ahab is said by Micaiah to be due to the "lying spirit" which enticed him to his doom, in obedience to God\'s command (<a onClick="return mV(\'1Ki\',22,\'20-22\');">1Ki 22:20-22</a>). In the prologue of Job, Job\'s calamities are ascribed to the Satan, but even he receives his word of command from God, and is responsible to Him, like the other "sons of God" who surround the heavenly throne. He is thus "included in the Divine will and in the circle of Divine providence" (Schultz). After the prologue, the Satan is left out of account, and Job\'s misfortunes are attributed directly to the Divine causality. In later Judaism, the tendency to trace the origin of evil, physical and moral, to wicked spirits became more marked, probably because of the influence of Persian dualism. In New Testament times, physical and mental maladies were thought to be due to the agency of evil spirits called demons, whose prince was Beelzebub or Satan (<a onClick="return mV(\'Mar\',1,23);">Mr 1:23</a>f.; <a onClick="return mV(\'Mar\',3,22);">Mr 3:22</a>f.; <a onClick="return mV(\'Mar\',5,2);">Mr 5:2</a>f.; <a onClick="return mV(\'Mat\',9,32);">Mt 9:32</a>f., etc.). Christ gave His assent to this belief (compare the woman under infirmity, "whom Satan hath bound," <a onClick="return mV(\'Luk\',13,16);">Lu 13:16</a>). Paul attributed his bodily affliction to an evil angel sent by Satan (<a onClick="return mV(\'2Cr\',12,7);">2Co 12:7</a>), though he recognized that the evil agent was subordinate to God\'s purpose of grace, and was the means of moral discipline (<a onClick="return mV(\'1Cr\',12,7,9);">1Co 12:7, 9</a>). Thus, while the evil spirits were regarded as malicious authors of physical maladies, they were not, in a strictly dualistic fashion, thought to act in complete independence; rather, they had a certain place assigned to them in the Divine Providence.<P>II. Meaning and Purpose of Affliction.<P>Why did God afflict men? How is suffering to be explained consistently with the goodness and justice of God? This was an acute problem which weighed heavily upon the Hebrew mind, especially in the later, more reflective, period. We can only briefly indicate the chief factors which the Scriptures contribute to the solution of the problem. We begin with the Old Testament.<P>1. Punitive or Retributive:<P>The traditional view in early Hebrew theology was that afflictions were the result of the Divine law of retribution, by which sin was invariably followed by adequate punishment. Every misfortune was a proof of sin on the part of the sufferer. Thus Job\'s "friends" sought to convince him that his great sufferings were due to his sinfulness. This is generally the standpoint of the historians of Israel, who regarded national calamities as a mark of the Divine displeasure on account of the people\'s sins. But this naive belief, though it contains an important element of truth, could not pass uncontested. The logic of facts would suffice to prove that it was inadequate to cover all cases; eg. Jeremiah\'s sufferings were due, not to sin, but to his faithfulness to his prophetic vocation. So the "suffering servant" in Isaiah. Job, too, in spite of his many woes, was firm in the conviction of his own integrity. To prove the inadequacy of the penal view is a main purpose of the Book of Job. A common modification of the traditional view was, that the sorrows of the pious and the prosperity of the wicked were only of brief duration; in the course of time, things would adjust themselves aright (eg. <a onClick="return mV(\'Job\',20,5);">Job 20:5</a>f.; <a onClick="return mV(\'Psa\',73,\'3-20\');">Ps 73:3-20</a>). But even granting time for the law of retribution to work itself out, experience contradicts the view that a man\'s fortune or misfortune is an infallible proof of his moral quality.<P>2. Probational:<P>The thought is often expressed that afflictions are meant to test the character or faith of the sufferer. This idea is especially prominent in Job. God allowed the Satan to test the reality of Job\'s piety by over-whelming him with disease and misfortunes (2). Throughout the poem Job maintains that he has stood the test (eg. <a onClick="return mV(\'Job\',23,\'10-12\');">Job 23:10-12</a>). Compare <a onClick="return mV(\'Deu\',8,2,16);">De 8:2, 16</a>; <a onClick="return mV(\'Psa\',66,10);">Ps 66:10</a>f.; <a onClick="return mV(\'Psa\',17,3);">Ps 17:3</a>; <a onClick="return mV(\'Isa\',48,10);">Isa 48:10</a>; <a onClick="return mV(\'Jer\',9,7);">Jer 9:7</a>; <a onClick="return mV(\'Pro\',17,3);">Pr 17:3</a>.<P>3. Disciplinary and Purificatory:<P>For those who are able to stand the test, suffering has a purificatory or disciplinary value.<P>(1) The thought of affliction as a discipline or form of Divine teaching is found in Job, especially in the speeches of Elihu, who insists that tribulation is intended as a method of instruction to save man from the pride and presumption that issue in destruction (<a onClick="return mV(\'Job\',33,\'14-30\');">Job 33:14-30</a>; <a onClick="return mV(\'Job\',36,\'8-10\',15);">36:8-10, 15</a> the Revised Version (British and American)). The same conception is found in <a onClick="return mV(\'Psa\',94,12);">Ps 94:12</a>; <a onClick="return mV(\'Psa\',119,67,71);">119:67, 71</a>.<P>(2) The purificatory function of trials is taught in such passages as <a onClick="return mV(\'Isa\',1,25);">Isa 1:25</a>; <a onClick="return mV(\'Zec\',13,9);">Zec 13:9</a>; <a onClick="return mV(\'Mal\',3,2,3);">Mal 3:2-3</a>, where the process of refining metals in fire and smelting out the dross is the metaphor used.<P>4. Vicarious and Redemptive:<P>The above are not fully adequate to explain the mystery of the afflictions of the godly. The profoundest contribution in the Old Testament to a solution of the problem is the idea of the vicarious and redemptive significance of pain and sorrow. The author of Job did not touch this rich vein of thought in dealing with the afflictions of his hero. This was done by the author of the Second Isaiah. The classical passage is <a onClick="return mV(\'Isa\',53,\'1-12\');">Isa 53:1-12</a>, which deals with the woes of the oppressed and afflicted Servant of God with profound spiritual insight. It makes no difference to the meaning of the afflictions whether we understand by the Servant the whole Hebrew nation, or the pious section of it, or an individual member of it, and whether the speakers in <a onClick="return mV(\'Isa\',53,\'1-\');">Isa 53</a> are the Jewish nation or the heathen. The significant point here is the value and meaning ascribed to the Servant\'s sufferings. The speakers had once believed (in accordance with the traditional view) that the Servant suffered because God was angry with him and had stricken him. Now they confess that his sorrows were due, not to his own sin but to theirs (<a onClick="return mV(\'Isa\',53,\'4-6\',8);">Isa 53:4-6, 8</a>). His sufferings were not only vicarious (the punishment of their sin falling upon him), but redemptive in their effect (peace and health coming to them as a result of his chastisement). Moreover, it was not only redemptive, but expiatory ("his soul guilt-offering," <a onClick="return mV(\'Isa\',53,10);">Isa 53:10</a>)—a remarkable adumbration of the Christian doctrine of atonement.<P>5. The New Testament:<P>So far we have dealt only with Old Testament teaching on the meaning and purpose of affliction. The New Testament makes no new contribution to the solution of the problem, but repeats and greatly deepens the points of view already found in the Old Testament.<P>(1) There is a recognition throughout the New Testament of the law of retribution (<a onClick="return mV(\'Gal\',6,7);">Ga 6:7</a>). Yet Jesus repudiates the popular view of the invariable connection between misfortune and moral evil (<a onClick="return mV(\'Jhn\',9,2);">Joh 9:2</a>f.). It is clear that He had risen above the conception of God\'s relation to man as merely retributive (<a onClick="return mV(\'Mat\',5,45);">Mt 5:45</a>, sunshine and rain for evil men as well as for the good). His followers would suffer tribulation even more than unbelievers, owing to the hostile reaction of the evil world, similar to that which afflicted Christ Himself (<a onClick="return mV(\'Mat\',5,10);">Mt 5:10</a>f.; <a onClick="return mV(\'Mat\',10,\'16-25\');">10:16-25</a>; <a onClick="return mV(\'Jhn\',15,\'18-20\');">Joh 15:18-20</a>; <a onClick="return mV(\'Jhn\',16,33);">16:33</a>). Similarly the Acts and the epistles frequently refer to the sufferings of Christians (eg. <a onClick="return mV(\'Act\',14,22);">Ac 14:22</a>; <a onClick="return mV(\'2Cr\',4,\'8-11\');">2Co 4:8-11</a>; <a onClick="return mV(\'Col\',1,24);">Col 1:24</a>; <a onClick="return mV(\'Hbr\',10,32);">He 10:32</a>; <a onClick="return mV(\'1Pe\',4,13);">1Pe 4:13</a>; <a onClick="return mV(\'Rev\',7,14);">Re 7:14</a>). Hence afflictions must have some other than a purely punitive purpose.<P>(2) They are probational, affording a test by which the spurious may be separated from the genuine members of the Christian church (<a onClick="return mV(\'Jam\',1,3,12);">Jas 1:3, 12</a>; <a onClick="return mV(\'1Pe\',1,7);">1Pe 1:7</a>; <a onClick="return mV(\'1Pe\',4,17);">4:17</a>), and<P>(3) a means of discipline, calculated to purify and train the character (<a onClick="return mV(\'Rom\',5,3);">Ro 5:3</a>; <a onClick="return mV(\'2Cr\',12,7,9);">2Co 12:7, 9</a>; <a onClick="return mV(\'Jam\',1,3);">Jas 1:3</a>).<P>(4) The idea of vicarious and redemptive suffering gets a far deeper significance in the New Testament than in the Old Testament, and finds concrete realization in a historical person, Jesus Christ. That which is foreshadowed in Second-Isa becomes in the New Testament a central, pervasive and creative thought. A unique place in the Divine purpose is given to the passion of Christ. Yet in a sense, His followers partake of His vicarious sufferings, and "fill up.... that which is lacking of the afflictions of Christ" (<a onClick="return mV(\'Col\',1,24);">Col 1:24</a>; compare <a onClick="return mV(\'Phl\',3,10);">Php 3:10</a>; <a onClick="return mV(\'1Pe\',4,13);">1Pe 4:13</a>). Here, surely is a profound thought which may throw a flood of light on the deep mystery of human affliction. The cross of Christ furnishes the key to the meaning of sorrow as the greatest redemptive force in the universe.<P>III. Endurance of Affliction.<P>The Scriptures abound in words of consolation and exhortation adapted to encourage the afflicted. Two main considerations may be mentioned.<P>(1) The thought of the beneficent sovereignty of God "Yahweh reigneth; let the earth rejoice," even though "clouds and darkness are round about him" (<a onClick="return mV(\'Psa\',97,1,2);">Ps 97:1-2</a>); "All things work together for good to them that love God" (<a onClick="return mV(\'Rom\',8,28);">Ro 8:28</a> the King James Version). Since love is on the throne of the universe, we may rest assured that all things are meant for our good.<P>(2) The thought that tribulation is of brief duration, in comparison with the Joy that shall follow (<a onClick="return mV(\'Psa\',30,5);">Ps 30:5</a>; <a onClick="return mV(\'Isa\',54,7);">Isa 54:7</a>f.; <a onClick="return mV(\'Jhn\',16,22);">Joh 16:22</a>); a thought which culminates in the hope of immortality. This hope is in the Old Testament only beginning to dawn, and gives but a faint and flickering light, except in moments of rare exaltation and insight, when the thought of a perfect future blessedness seemed to offer a solution of the enigmas of life (<a onClick="return mV(\'Job\',19,\'25-27\');">Job 19:25-27</a>; <a onClick="return mV(\'Psa\',37,\'1-\');">Psalms 37</a>; <a onClick="return mV(\'Psa\',49,\'1-\');">49</a>; <a onClick="return mV(\'Psa\',73,\'1-\');">73</a>). But in the New Testament it is a postulate of faith, and by it the Christian is able to fortify himself in affliction, remembering that his affliction is light and momentary compared with the "far more exceeding and eternal weight of glory" which is to issue out of it (<a onClick="return mV(\'2Cr\',4,17);">2Co 4:17</a> the King James Version; compare <a onClick="return mV(\'Mat\',5,12);">Mt 5:12</a>; <a onClick="return mV(\'Rom\',8,18);">Ro 8:18</a>). Akin to this is the comfort derived from the thought of the near approach of Christ\'s second coming (<a onClick="return mV(\'Jam\',5,7,8);">Jas 5:7-8</a>). In view of such truths as these, the Bible encourages the pious in trouble to show the spirit of patience (<a onClick="return mV(\'Psa\',37,7);">Ps 37:7</a>; <a onClick="return mV(\'Luk\',21,19);">Lu 21:19</a>; <a onClick="return mV(\'Rom\',12,12);">Ro 12:12</a>; <a onClick="return mV(\'Jam\',1,3,4);">Jas 1:3-4</a>; <a onClick="return mV(\'Jam\',5,\'7-11\');">5:7-11</a>; <a onClick="return mV(\'1Pe\',2,20);">1Pe 2:20</a>), and even the spirit of positive joy in tribulation (<a onClick="return mV(\'Mat\',5,11);">Mt 5:11</a>f.; <a onClick="return mV(\'Rom\',5,3);">Ro 5:3</a>; <a onClick="return mV(\'2Cr\',12,10);">2Co 12:10</a>; <a onClick="return mV(\'Jam\',1,2,12);">Jas 1:2, 12</a>; <a onClick="return mV(\'1Pe\',4,13);">1Pe 4:13</a>). In the New Testament emphasis is laid on the example of Jesus in patient endurance in suffering (<a onClick="return mV(\'Jhn\',16,33);">Joh 16:33</a>; <a onClick="return mV(\'Jam\',5,\'7-11\');">Jas 5:7-11</a>; <a onClick="return mV(\'1Pe\',2,\'19-23\');">1Pe 2:19-23</a>; <a onClick="return mV(\'1Pe\',3,17);">3:17</a>f.). Above all, the Scriptures recommend the afflicted to take refuge in the supreme blessedness of fellowship with God, and of trust in His love, by which they may enter into a deep peace that is undisturbed by the trials and problems of life (<a onClick="return mV(\'Psa\',73,\'23-28\');">Ps 73:23-28</a>; <a onClick="return mV(\'Isa\',26,3,4);">Isa 26:3-4</a>; <a onClick="return mV(\'Jhn\',14,1,27);">Joh 14:1, 27</a>; <a onClick="return mV(\'Phl\',4,7);">Php 4:7</a>; et passim).``49';
isbe[254]='Affright`a-frit’: Designates a state of terror occasioned by some unexpected and startling occurrence; not as strong as "amazed," which refers more to the stupor resulting from fright. In the New Testament most frequently for emphobos (<a onClick="return mV(\'Luk\',24,37);">Lu 24:37</a>; <a onClick="return mV(\'Act\',10,4);">Ac 10:4</a>; <a onClick="return mV(\'Rev\',11,13);">Re 11:13</a>). The Revised Version (British and American) uses it also for pturomenoi of <a onClick="return mV(\'Phl\',1,28);">Php 1:28</a>, a word "properly used of scared horses" (Ellicott).``1';
isbe[255]='Afoot`a-foot\' (pezeuo, "to go on foot"): By walking from Troas to Assos Paul avoided the tedious voyage round Cape Lectum (<a onClick="return mV(\'Act\',20,13);">Ac 20:13</a> the King James Version; compare <a onClick="return mV(\'Mar\',6,33);">Mr 6:33</a>).``1';
isbe[256]='Afore`a-for’: Archaic for "before" of time, or "formerly"; frequently occurs as compound, as in "aforetime," "aforehand," etc.; in the New Testament most commonly for the Greek prefix, pro, in compound words (<a onClick="return mV(\'Rom\',1,2);">Ro 1:2</a>; <a onClick="return mV(\'Rom\',15,4);">15:4</a>); at other times, for Greek adverb pote, "at some time," "once" (<a onClick="return mV(\'Jhn\',9,13);">Joh 9:13</a>; <a onClick="return mV(\'1Pe\',3,5);">1Pe 3:5</a>; <a onClick="return mV(\'Col\',3,7);">Col 3:7</a>).``1';
isbe[257]='Afresh`a-fresh’: Only in <a onClick="return mV(\'Hbr\',6,6);">Heb 6:6</a>, "seeing they crucify to themselves the Son of God afresh," where it stands for the prefix of the Greek anastaurountas. It has been disputed whether in this word ana has the reiterative force ("again," "anew"). In classical Greek anastauroo has always the simple sense of "to crucify," (ie. "to rinse up on a cross," ana being merely "up"). So some would render it here (eg. Cremer, Lexicon of New Testament Greek). Against this it is argued<P>(1) that the classical writers had no occasion for the idea of crucifying anew (compare Winer, De verb. Comp., etc., Pt III, 9f., Leipzig, 1843);<P>(2) that in many compounds ana signifies both "up" and "again," as in anablepo, which means "to recover sight" as well as "to look up";<P>(3) that the rendering "crucify afresh" suits the context;<P>(4) that the Greek expositors (eg. Chrysostom) take it so without questioning. (So also Bleek, Lunemann, Alford, Westcott; compare the Vulgate’s rursum crucifigentes.)``1';
isbe[258]='Africa`af\'-ri-ka: The name of this tract, as a continent, does not occur in the Bible, and it was only in later days known as one of the quarters of the world, under the name of Libya—that portion opposite the coast of Greece and west of Egypt.<P>1. Africa as Known to the Ancients:<P>Naturally the most considerable part of Africa known to the Hebrews was Egypt itself, but Libya is regarded as being referred to under the names of Lehabim and Lubim (Ludim) (<a onClick="return mV(\'Gen\',10,13);">Ge 10:13</a>; <a onClick="return mV(\'2Ch\',12,3);">2Ch 12:3</a>)—words indicating, as often with the Semites, not the country itself, but its inhabitants. Other portions of Africa known to the Hebrews were Cush or Ethiopia, and Put, whose inhabitants they regarded as belonging to the Hamitic stock. Canaan, also Cushite and therefore Hamitic, naturally did not belong to the African continent, showing that the divisions of then known world into "quarters" (Europe, Asia, Africa) had not taken place when the Table of the Nations (<a onClick="return mV(\'Gen\',10,1);">Ge 10:1</a>f.) was drawn up—indeed, these division were not apparently thought of until many centuries later. The Casluhim and the Naphtuhim (<a onClick="return mV(\'Gen\',10,13,14);">Ge 10:13-14</a>) were in all probability African peoples, though their position is in general regarded as uncertain. For the Hebrews, to all appearance, the southernmost point of Africa was Cush or Ethiopia, called by the Assyrians and Babylonians Kusu and Meluhha (Meroe), which included the district now known as the Sudan, or Black region. The sons of Cush, and also those of his firstborn, Sheba, were all Arabian tribes, nominally under the domain of Mizraim or Egypt, and on this account classed with the descendants of Ham.<P>2. The Cushites and the Negroes:<P>It will thus be seen that the Negro districts were practically unknown to the ancient Hebrews, though men and women of Negro race must have come within their ken. It seems doubtful, therefore, whether there be, in the Bible, any reference to that race, either collectively or individually, the word Cushite standing, not for Negro, but for Ethiopian. This term is applied to Moses\' (first) wife (<a onClick="return mV(\'Num\',12,1);">Nu 12:1</a>), and it will probably be generally admitted, that the great Hebrew lawgiver is not likely to have espoused a Negro woman. The Ethiopian eunuch converted by Philip the Evangelist (<a onClick="return mV(\'Act\',8,26);">Ac 8:26</a>f.) was an official of Meroe, and an educated man, for he could read the Old Testament in the Greek(septuagint) version. Commerce must have revealed to the Hebrews the whereabouts of the various peoples of Africa with whom they came into contact, and they acquired a personal knowledge of Egypt when the 12 tribes were in bondage there. During this period, it may be supposed, they saw from time to time visitors from the south—people who are not mentioned in the sacred books of the Old Testament because the Hebrews, as a nation, never came into contact with them. Apart from Egypt, the history of the portion of Africa known to the Hebrews was a chequered one, as it came successively under Egypt, Phoenicia, Greek and Roman civilization. That it was not overrun, or even influenced, by the barbarous tribes of the south, is due to the fact that the Mediterranean tract is isolated from the central (and southern) portion of that continent by the Sahara.<P>3. Hebrew Tradition:<P>In the Talmud it is related that Alexander penetrated Africa on Libyan asses to find a race of women, with whom he had conversation, and from whom, as he afterward confessed, being a fool, he learned wisdom—a legend suggesting some possible tradition of the Amazons of Dahomey. But even in the Talmud it is mainly the nearer (Northeast) portion of Africa which is referred to, the Africans, who had the reputation of being flat-footed, being associated with the Canaanites.`<a href="./study/isbe/search.html?string=CUSH">CUSH</a>; <a href="./study/isbe/search.html?string=ETHIOPIA">ETHIOPIA</a>; <a href="./study/isbe/search.html?string=MIZRAIM">MIZRAIM</a>`136';
isbe[259]='After; Afterward`aft\'-er, aft\'-er-werd: The fundamental thought, in which all shades of meaning unite, is that of succession either in time or place. This succession may be immediate or remote. A very common adaptation of this conception the use of "after" to denote "according to," "after the manner of," or "in the order of," as in <a onClick="return mV(\'Gen\',1,26);">Ge 1:26</a>; <a onClick="return mV(\'Eph\',4,24);">Eph 4:24</a>; <a onClick="return mV(\'Luk\',1,59);">Lu 1:59</a>; <a onClick="return mV(\'Rom\',5,14);">Ro 5:14</a>; <a onClick="return mV(\'Hbr\',4,11);">Heb 4:11</a> (the Revised Version, margin "unto"), and in many passages where the Greek uses the preposition kata, as <a onClick="return mV(\'Mat\',23,3);">Mt 23:3</a>; <a onClick="return mV(\'Rom\',8,4);">Ro 8:4</a>; <a onClick="return mV(\'1Cr\',1,26);">1Co 1:26</a>, etc. "In proportion to": <a onClick="return mV(\'Psa\',28,4);">Ps 28:4</a>; compare <a onClick="return mV(\'Psa\',90,15);">Ps 90:15</a>.<P>It sometimes correctly translates a peculiar Greek idiom of the preposition dia, with the genitive case, indicating time elapsed, as <a onClick="return mV(\'Mar\',2,1);">Mr 2:1</a>, literally, "through some days," "after some days had passed"; compare <a onClick="return mV(\'Act\',24,17);">Ac 24:17</a>. While the Greek is expressed by a variety of words, the Hebrew uses \'achar for both preposition and adverb.``84';
isbe[260]='Afternoon`af-ter-noon’ (netoth ha-yom, "the declining of the day"; <a onClick="return mV(\'Jdg\',19,8);">Jdg 19:8</a> the King James Version): The expression kechom ha-yom, "in the heat of the day" (<a onClick="return mV(\'Gen\',18,1);">Ge 18:1</a>) refers to the early afternoon when the sun is a little past its zenith, its rays still being very strong. The phrase le-ruach ha-yom, "in the cool of the day" (<a onClick="return mV(\'Gen\',3,8);">Ge 3:8</a>) is in contrast to the last phrase and points to the late afternoon; in the Orient a cooling breeze arises at this period of the day, and it is then that much of the day’s business is transacted.`<a href="./study/isbe/search.html?string=DAY">DAY</a>`1';
isbe[261]='Agaba`ag\'-a-ba: A fortress in Judea. The first of 22 "strong places" which by its commander Galestus was given over to Aristobulus, the son of Alexander Janneus and Alexandra, when he (his mother, the queen, being dangerously ill) attempted to get control of the Judean government (Ant., XIII, xvi, 5).``1';
isbe[262]='Agabus`ag\'-a-bus (Agabos): A Christian prophet of Jerusalem, twice mentioned in Acts.<P>(1) In <a onClick="return mV(\'Act\',11,27);">Ac 11:27</a>f., we find him at Antioch foretelling "a great famine over all the world," "which," adds the historian, "came to pass in the days of Claudius." This visit of Agabus to Antioch took place in the winter of 43-44 AD, and was the means of urging the Antiochian Christians to send relief to the brethren in Judea by the hands of Barnabas and Saul. Two points should be noted.<P>(a) The gift of prophet\'s here takes the form of prediction. The prophet\'s chief function was to reveal moral and spiritual truth, to "forth-tell" rather than to "foretell"; but the interpretation of God\'s message sometimes took the form of predicting events.<P>(b) The phrase "over all the world" (practically synonymous with the Roman Empire) must be regarded as a rhetorical exaggeration if strictly interpreted as pointing to a general and simultaneous famine. But there is ample evidence of severe periodical famines in various localities in the reign of Claudius (eg. Suet Claud. 18; Tac. Ann. xii.43), and of a great dearth in Judea under the procurators Cuspius Fadus and Tiberius Alexander, 44-48 AD (Ant., XX, ii, 6; v, 2), which probably reached its climax circa 46 AD.<P>(2) In <a onClick="return mV(\'Act\',21,10);">Ac 21:10</a>f. we find Agabus at Caesarea warning Paul, by a vivid symbolic action (after the manner of Old Testament prophets; compare <a onClick="return mV(\'Jer\',13,1);">Jer 13:1</a>f.; <a onClick="return mV(\'Eze\',3,\'1-\');">Eze 3</a>; <a onClick="return mV(\'Eze\',4,\'1-\');">4</a>) of the imprisonment and suffering he would undergo if he proceeded to Jerusalem.<P>(3) In late tradition Agabus is included in lists of the seventy disciples of Christ.``49';
isbe[263]='Agade`ag\'-a-de: Ancient name for Akkad (or <a href="./study/isbe/search.html?string=ACCAD">ACCAD</a>, which see), one of the chief cities of Babylonia (<a onClick="return mV(\'Gen\',10,10);">Ge 10:10</a>), and the capital city of Sargon, who lived and ruled in Babylonia circa 3500 BC. Together with Shunir it formed part of one of the royal titles: "kings of Shunir (Sumer) and Accad."``1';
isbe[264]='Agag`a\'-gag (\'aghagh, or \'aghagh, meaning unknown, possibly "violent," BDB): A name, or title, applied to the king of the Amalekites, like Abimelech in Philistia and Pharaoh in Egypt. It is used of two of these kings:<P>(1) A king of Amalek, mentioned by Balaam (<a onClick="return mV(\'Num\',24,7);">Nu 24:7</a>) in his blessing of Israel;<P>(2) A later king, in the days of King Saul (<a onClick="return mV(\'1Sa\',15,\'1-\');">1Sa 15</a>). Saul was sent with his army to destroy the Amalekites, who had so violently opposed Israel in the Wilderness. He disregarded the Divine command, sparing the best of the spoil, and saving Agag the king alive (<a onClick="return mV(\'1Sa\',15,8,9);">1Sa 15:8-9</a>). After rebuking Saul, Samuel had Agag put to death for all the atrocities committed by himself and his nation (<a onClick="return mV(\'1Sa\',15,32,33);">1Sa 15:32-33</a>).``109';
isbe[265]='Agagite`a\'-gag-it, (\'aghaghi, from, \'aghagh, "a member of the house of Agag"): A title of opprobrium given to Haman (<a onClick="return mV(\'Est\',3,1,10);">Es 3:1, 10</a>; <a onClick="return mV(\'Est\',8,3,5);">8:3, 5</a>; <a onClick="return mV(\'Est\',9,24);">9:24</a>). Jewish tradition always assigned the arch-enemies of Israel membership in the house of Amalek, the hereditary foe of the nation. Compare Ant, XI, vi, 5. The word Agag has properly been taken by Delitzsch as related to the Assyrian agagu, "to be powerful," "vehement," "angry." In the Greek parts of Esther, Haman is termed a Macedonian (<a onClick="return mV(\'Est\',12:6);">Es 12:6</a>; <a onClick="return mV(\'Est\',16:10);">16:10</a>). The name Haman is probably of Elamitic origin. Oppert\'s attempt to connect the term "Agagite" with "Agaz," a Median tribe mentioned by Sargon, has found no supporters.`<a href="./study/isbe/search.html?string=AGAG">AGAG</a>`197';
isbe[266]='Again`a-gen’: Advb. denoting repetition; in New Testament, generally for palin, "back," "once more." Occasionally, it has the force of a connective, synonymous with "moreover," as in <a onClick="return mV(\'Rom\',15,10);">Ro 15:10</a>f.; <a onClick="return mV(\'1Cr\',3,20);">1Co 3:20</a>, etc. The expression "born again" of the King James Version, <a onClick="return mV(\'Jhn\',3,3,7);">Joh 3:3,7</a>; <a onClick="return mV(\'1Pe\',1,23);">1Pe 1:23</a>, translating the Greek "anothen" and "ana" in composition, becomes in the Revised Version (British and American) "anew," i.e. "over again." As these particles mean "from above" and "up," their use as indicating repetition is sometimes disputed, but without further foundation than that "again" does not exhaust the meaning.``1';
isbe[267]='Again; Born``<a href="./study/isbe/search.html?string=REGENERATION">REGENERATION</a>`1';
isbe[268]='Against`a-genst’ (kata; enantion; pros): Preposition expressing contrast. When used of direction, equivalent to "toward" (<a onClick="return mV(\'Mat\',10,35);">Mt 10:35</a>; <a onClick="return mV(\'Mat\',12,14);">12:14</a>, etc.); when of position, meaning "opposite," "facing," "in front of" (<a onClick="return mV(\'1Ki\',7,5);">1Ki 7:5</a>; <a onClick="return mV(\'Gen\',15,10);">Ge 15:10</a>; <a onClick="return mV(\'Rom\',8,31);">Ro 8:31</a>); when of action, "opposed to" (<a onClick="return mV(\'Mat\',5,11);">Mt 5:11</a>; <a onClick="return mV(\'Mat\',26,59);">26:59</a>; <a onClick="return mV(\'1Cr\',4,6);">1Co 4:6</a>); "in resistance to" (<a onClick="return mV(\'Hbr\',12,4);">Heb 12:4</a>); "provision for" (Greek eis, literally, "unto, toward" (<a onClick="return mV(\'1Ti\',6,19);">1Ti 6:19</a>). Sometimes also applied to what breaks an established order as "customs" (<a onClick="return mV(\'Act\',28,17);">Ac 28:17</a>), "nature" (<a onClick="return mV(\'Rom\',1,26);">Ro 1:26</a>). Peculiar shades of meaning may be traced by careful examination of the variety of prepositions in Hebrew and Greek employed in the Scriptures, that are translated into English by this one word.``84';
isbe[269]='Agape`ag\'-a-pe (agape).<P>1. The Name and the Thing:<P>The name Agape or "love-feast," as an expression denoting the brotherly common meals of the early church, though of constant use and in the post-canonical literature from the time of Ignatius onward, is found in the New Testament only in <a onClick="return mV(\'Jud\',1,12);">Jude 1:12</a> and in <a onClick="return mV(\'2Pe\',2,13);">2Pe 2:13</a> according to a very doubtful reading. For the existence of the Christian common meal, however, we have abundant New Testament evidence. The"breaking of bread" practiced by the primitive community in Jerusalem according to <a onClick="return mV(\'Act\',2,42,46);">Ac 2:42, 46</a> must certainly be interpreted in the light of Pauline usage (<a onClick="return mV(\'1Cr\',10,16);">1Co 10:16</a>; <a onClick="return mV(\'1Cr\',11,24);">11:24</a>) as referring to the ceremonial act of the Lord\'s Supper. But the added clause in <a onClick="return mV(\'Act\',2,46);">2:46</a>, "they took there food with gladness and singleness of heart," implies that a social meal was connected in some way with this ceremonial act. Paul\'s references to the abuses that had sprung up in the Corinthian church at the meetings for the observance of the Lord\'s Supper (<a onClick="return mV(\'1Cr\',11,\'20-22\',33,34);">1Co 11:20-22, 33-34</a>) make it evident that in Corinth as in Jerusalem the celebration of the rite was associated with participation in a meal of a more general character. And in one of the "we" sections of Acts (<a onClick="return mV(\'Act\',20,11);">20:11</a>) where Luke is giving personal testimony as to the manner in which the Lord\'s Supper was observed by Paul in a church of his own founding, we find the breaking of bread associated with and yet distinguished from an eating of food, in a manner which makes it natural to conclude that in Troas, as in Jerusalem and Corinth, Christians when they met together on the first day of the week were accustomed to partake of a common meal. The fact that the name Agape or love-feast used in <a onClick="return mV(\'Jud\',1,12);">Jude 1:12</a> (Revised Version) is found early in the 2nd century and often afterward as a technical expression for the religious common meals of the church puts the meaning of Jude\'s reference beyond doubt.<P>2. Origin of the Agape:<P>So far as the Jerusalem community was concerned, the common meal appears to have sprung out of the koinonia or communion that characterized the first days of the Christian church (compare <a onClick="return mV(\'Act\',1,14);">Ac 1:14</a>; <a onClick="return mV(\'Act\',2,1);">2:1</a> etc.). The religious meals familiar to Jews—the Passover being the great type—would make it natural In Jerusalem to give expression by means of table fellowship to the sense of brotherhood, and the community of goods practiced by the infant church (<a onClick="return mV(\'Act\',2,44);">Ac 2:44</a>; <a onClick="return mV(\'Act\',4,32);">4:32</a>) would readily take the particular form of a common table at which the wants of the poor were supplied out of the abundance of the rich (<a onClick="return mV(\'Act\',6,1);">Ac 6:1</a>f.). The presence of the Agape in the Greek church of Corinth was no doubt due to the initiative of Paul, who would hand on the observances associated with the Lord\'s Supper just as he had received them from the earlier disciples; but participation in a social meal would commend itself very easily to men familiar with the common meals that formed a regular part of the procedure at meetings of those religious clubs and associations which were so numerous at that time throughout the Greek-Roman world.<P>3. Relation to the Eucharist:<P>In the opinion of the great majority of scholars the Agape was a meal at which not only bread and wine but all kinds of viands were used, a meal which had the double purpose of satisfying hunger and thirst and giving expression to the sense of Christian brotherhood. At the end of this feast, bread and wine were taken according to the Lord\'s command, and after thanksgiving to God were eaten and drunk in remembrance of Christ and as a special means of communion with the Lord Himself and through Him with one another. The Agape was thus related to the Eucharist as Christ\'s last Passover to the Christian rite which He grafted upon it. It preceded and led up to the Eucharist, and was quite distinct from it. In opposition to this view it has been strongly urged by some modern critical scholars that in the apostolic age the Lord\'s Supper was not distinguished from the Agape, but that the Agape itself from beginning to end was the Lord\'s Supper which was held in memory of Jesus. It seems fatal to such an idea, however, that while Paul makes it quite evident that bread and wine were the only elements of the memorial rite instituted by Jesus (<a onClick="return mV(\'1Cr\',11,\'23-29\');">1Co 11:23-29</a>), the abuses which had come to prevail at the social gatherings of the Corinthian church would have been impossible in the case of a meal consisting only of bread and wine (compare <a onClick="return mV(\'1Cr\',11,21,33);">1Co 11:21, 33</a>f.) Moreover, unless the Eucharist in the apostolic age had been discriminated from the common meal, it would be difficult to explain how at a later period the two could be found diverging from each other so completely.<P>4. Separation from the Eucharist:<P>In the Didache (circa 100 AD) there is no sign as yet of any separation. The direction that the second Eucharistic prayer should be offered "after being filled" (x.1) appears to imply that a regular meal had immediately preceded the observance of the sacrament. In the Ignatian Epistles (circa 110 AD) the Lord\'s Supper and the Agape are still found in combination (Ad Smyrn viii.2). It has sometimes been assumed that Pliny\'s letter to Trajan (circa 112 AD) proves that the separation had already taken place, for he speaks of two meetings of the Christians in Bithynia, one before the dawn at which they bound themselves by a "sacramentum" or oath to do no kind of crime, and another at a later hour when they partook of food of an ordinary and harmless character (Ep x.96). But as the word "sacramentum" cannot be taken here as necessarily or even probably referring to the Lord\'s Supper, the evidence of this passage is of little weight. When we come to Justin Martyr (circa 150 AD) we find that in his account of church worship he does not mention the Agape at all, but speaks of the Eucharist as following a service which consisted of the reading of Scripture, prayers and exhortation (Apol, lxvii); so that by his time the separation must have taken place. Tertullian (circa 200 AD) testifies to the continued existence of the Agape (Apol, 39), but shows clearly that in the church of the West the Eucharist was no longer associated with it (De Corona, 3). In the East the connection appears to have been longer maintained (see Bigg, Christian Platonists of Alexandria, 102f.), but by and by the severance became universal; and though the Agape continued for long to maintain itself as a social function of the church, it gradually passed out of existence or was preserved only as a feast of charity for the poor.<P>5. Reasons for the Separation:<P>Various influences appear to have cooperated in this direction. Trajan\'s enforcement of the old law against clubs may have had something to do with it (compare Pliny as above), but a stronger influence probably came from the rise of a popular suspicion that the evening meals of the church were scenes of licentious revelry and even of crime. The actual abuses which already meet us in the apostolic age (<a onClick="return mV(\'1Cr\',11,20);">1Co 11:20</a>f.; <a onClick="return mV(\'Jud\',1,12);">Jude 1:12</a>), and which would tend to multiply as the church grew in numbers and came into closer contact with the heathen world, might suggest the advisability of separating the two observances. But the strongest influence of all would come from the growth of the ceremonial and sacerdotal spirit by which Christ\'s simple institution was slowly turned into a mysterious priestly sacrifice. To Christ Himself it had seemed natural and fitting to institute the Supper at the close of a social meal. But when this memorial Supper had been transformed into a repetition of the sacrifice of Calvary by the action of the ministering priest, the ascetic idea became natural that the Eucharist ought to be received fasting, and that it would be sacrilegious to link it on to the observances of an ordinary social meal.<P>LITERATURE:<P>Zahn, art "Agapen" in Hauck-Herzog, Realencyklopadie; Keating, Agape and Eucharist; Schaff, The Oldest Church Manual, chapter xviii; Lambert, Sacraments in the New Testament, Lect viii; Weizsacker, The Apostolic Age, etc., I. 52f..``94';
isbe[270]='Agar`a\'-gar (Agar). Found once in the Apocrypha in the Greek (Baruch 3:23) probably for the Old Testament Hagar, mother of Ishmael, whose children are mentioned with the merchants of Meran (Midian) and Teman. In <a onClick="return mV(\'1Ch\',5,10);">1Ch 5:10</a> the "Hagarites" the King James Version, are located east of Gilead, and In the days of Saul were at war with the tribe of Reuben. See also <a onClick="return mV(\'1Ch\',5,19);">1Ch 5:19-20</a> and <a onClick="return mV(\'1Ch\',27,31);">1Ch 27:31</a>. In <a onClick="return mV(\'Psa\',83,6);">Ps 83:6</a> the name of the same people is Hagarenes.``1';
isbe[271]='Agarenes`ag-a-renz’: Baruch 3:23 the King James Version. In the Old Testament the word is <a href="./study/isbe/search.html?string=HAGARENES">HAGARENES</a> (which see).`<a href="./study/isbe/search.html?string=AGAR">AGAR</a>`1';
isbe[272]='Agate`ag\'-at.`<a href="./study/isbe/search.html?string=STONES,+PRECIOUS">STONES, PRECIOUS</a>`1';
isbe[273]='Age`aj: A period of time or a dispensation. In the above sense the word occurs only once in the King James Version, in the sing, as the translation of dor, which means, properly, a "revolution" or "round of time," "a period," "an age" or "generation of man\'s life"; almost invariable translated "generation," "generations" (<a onClick="return mV(\'Job\',8,8);">Job 8:8</a>), "Inquire, I pray thee, of the former age"); we have the plural as the translation of aion, properly "duration," "the course or flow of time," "an age or period of the world," "the world" (<a onClick="return mV(\'Eph\',2,7);">Eph 2:7</a>, "in the ages to come"; <a onClick="return mV(\'Col\',1,26);">Col 1:26</a>, "the mystery which hath been hid from ages and from generations," the English Revised Version, "from all ages," etc., the American Revised Version, margin, of geneai, "generations" (<a onClick="return mV(\'Eph\',3,5);">Eph 3:5</a> "generations," <a onClick="return mV(\'Eph\',3,21);">Eph 3:21</a>, "unto all generations for ever and ever," Greek margin, "all the generations of the age of the ages"). "Ages is given in margin of the King James Version (<a onClick="return mV(\'Psa\',145,13);">Ps 145:13</a>; <a onClick="return mV(\'Isa\',26,4);">Isa 26:4</a>, "the rock of ages").<P>We have "age" in the above sense (2Esdras 3:18; Tobit 14:5; aion) "ages," aion (1Esdras 4:40 (of Truth) "she is the strength," etc., "of all ages"), genea, the Revised Version (British and American), "generation" (The <span class="noTag">Wisdom of Solomon 7:27</span>; 1Macc 2:61); Ecclesiasticus 24:33, eis geneas aionon, "generations of ages"; The <span class="noTag">Wisdom of Solomon 14:6</span>, "generations\' (geneseos).<P>Revised Version has "age" for "world" (<a onClick="return mV(\'Hbr\',6,5);">Heb 6:5</a>); "ages" for "worlds" (the Revised Version, margin <a onClick="return mV(\'Hbr\',1,2);">Heb 1:2</a>; the American Revised Version, margin; compare <a onClick="return mV(\'1Ti\',1,17);">1Ti 1:17</a>) (margin, "unto the ages of the ages"), "ages" for "world" (<a onClick="return mV(\'1Cr\',10,11);">1Co 10:11</a>; <a onClick="return mV(\'Hbr\',9,26);">Heb 9:26</a>). the English Revised Version has "all ages" for "the beginning of the world "(<a onClick="return mV(\'Eph\',3,9);">Eph 3:9</a>, the American Standard Revised Version "for ages"); "king of the ages" for "king of saints" (<a onClick="return mV(\'Rev\',15,3);">Re 15:3</a>, corrected text; margin, many ancient authorities read "nations"; <a onClick="return mV(\'Jer\',10,7);">Jer 10:7</a>).`<a href="./study/isbe/search.html?string=EVERLASTING">EVERLASTING</a>`185';
isbe[274]='Age; Old Age`In individual lives (cheledh; helikia): We have scarcely any word in the Old Testament or New Testament which denotes "age" in the familiar modern sense; the nearest in the Old Testament is perhaps heledh, "life," "lifetime," and in the New Testament helikia, "full age," "manhood," but which is rendered stature in <a onClick="return mV(\'Mat\',6,27);">Mt 6:27</a>, etc., the King James Version; cheledh occurs (<a onClick="return mV(\'Job\',11,17);">Job 11:17</a>), "Thine age shall be clearer than the noonday," the Revised Version (British and American) "(thy) life"; <a onClick="return mV(\'Psa\',39,5);">Ps 39:5</a>, "Mine age is as nothing before thee," the American Standard Revised Version, "my life-time"); we have helikia (<a onClick="return mV(\'Jhn\',9,21,23);">Joh 9:21,23</a>), "He is of age"; <a onClick="return mV(\'Hbr\',11,11);">Heb 11:11</a> "past age," <a onClick="return mV(\'Luk\',2,52);">Lu 2:52</a>, "Jesus increased in wisdom and age," so the Revised Version, margin, King James Version margin, <a onClick="return mV(\'Eph\',4,13);">Eph 4:13</a>); yom, day, (days) is used in the Old Testament to express "age" (<a onClick="return mV(\'Gen\',47,28);">Ge 47:28</a>), the whole age of Jacob," the King James Version, "the days of the years of his life"; but it occurs mostly in connection with old age); ben, "son" (<a onClick="return mV(\'Num\',8,25);">Nu 8:25</a>; <a onClick="return mV(\'1Ch\',23,3,24);">1Ch 23:3, 24</a>); kelah, "to be complete," is translated "full age" (<a onClick="return mV(\'Job\',5,26);">Job 5:26</a>); teleios, "complete" (<a onClick="return mV(\'Hbr\',5,14);">Heb 5:14</a>), the Revised Version (British and American), full-grown men, margin, perfect", dor, a revolution," "a period" is translated "age" <a onClick="return mV(\'Isa\',38,12);">Isa 38:12</a>, "Mine age is departed and removed from me as a shepherd\'s tent," the American Standard Revised Version, "My dwelling is removed, and is carried away from me as a shepherd\'s tent," the English Revised Version, "mine age," margin, "or habitation"; Delitzsch, "my home"; compare <a onClick="return mV(\'Psa\',49,19,20);">Ps 49:19-20</a>; <a onClick="return mV(\'2Cr\',5,8);">2Co 5:8</a>. In New Testament we have etos, "year" (<a onClick="return mV(\'Mar\',5,42);">Mr 5:42</a>), the Revised Version British and American, "old"; <a onClick="return mV(\'Luk\',2,37);">Lu 2:37</a>; <a onClick="return mV(\'Luk\',3,23);">3:23</a>, "Jesus...about 30 years of age". "Old age," "aged," are the translation of various words, zaqen zaqan, "the chin," "the beard", perhaps to have the chin sharp or hanging down, often translated "elders," "old man," etc. <a onClick="return mV(\'2Sa\',19,32);">2Sa 19:32</a>; <a onClick="return mV(\'Job\',12,20);">Job 12:20</a>; <a onClick="return mV(\'Job\',32,9);">32:9</a>; <a onClick="return mV(\'Jer\',6,11);">Jer 6:11</a>.<P>In New Testament we have presbutes, "aged," "advanced in days" (<a onClick="return mV(\'Tts\',2,2);">Titus 2:2</a>; <a onClick="return mV(\'Phm\',1,9);">Phm 1:9</a>); presbutis, "aged woman" (<a onClick="return mV(\'Tts\',2,3);">Titus 2:3</a>); probebekos en hemerais, advanced in days" (<a onClick="return mV(\'Luk\',2,36);">Lu 2:36</a>); geras, "old age" (<a onClick="return mV(\'Luk\',1,36);">Lu 1:36</a>).<P>Revised Version has "old" for "the age of" (<a onClick="return mV(\'1Ch\',23,3);">1Ch 23:3</a>), "own age" for "sort" (<a onClick="return mV(\'Dan\',1,10);">Da 1:10</a>); "aged" for "ancients" (<a onClick="return mV(\'Psa\',119,100);">Ps 119:100</a>), for "ancient" (<a onClick="return mV(\'Isa\',47,6);">Isa 47:6</a>); for "old" (<a onClick="return mV(\'Hbr\',8,13);">Heb 8:13</a>); "aged men" for "the ancients" (<a onClick="return mV(\'Job\',12,12);">Job 12:12</a>); for "aged" (<a onClick="return mV(\'Job\',12,20);">Job 12:20</a>), "elders."<P>Regard for Old Age:<P>(1) Among the Hebrews (and Orientals generally) old age was held in honor, and respect was required for the aged (<a onClick="return mV(\'Lev\',19,32);">Le 19:32</a>), "Thou shalt rise up before the hoary head, and honor the face of the old man"; a mark of the low estate of the nation was that "The faces of elders were not honored"; "The elders have ceased from the gate" (<a onClick="return mV(\'Lam\',5,12,14);">La 5:12, 14</a>). Compare <a onClick="return mV(\'Job\',29,8);">Job 29:8</a> (as showing the exceptionally high regard for Job). See also The <span class="noTag">Wisdom of Solomon 2:10</span>; Ecclesiasticus 8:6.<P>(2) Old age was greatly desired and its attainment regarded as a Divine blessing (<a onClick="return mV(\'Gen\',15,15);">Ge 15:15</a>; <a onClick="return mV(\'Exd\',20,12);">Ex 20:12</a>, "that thy days may be long in the land"; <a onClick="return mV(\'Job\',5,26);">Job 5:26</a>; <a onClick="return mV(\'Psa\',91,16);">Ps 91:16</a>, "With long life will I satisfy him"; <a onClick="return mV(\'Psa\',92,14);">Ps 92:14</a>; compare <a onClick="return mV(\'Isa\',65,20);">Isa 65:20</a>; <a onClick="return mV(\'Zec\',8,4);">Zec 8:4</a>; <a onClick="return mV(\'1Sa\',2,32);">1Sa 2:32</a>).<P>(3) A Divine assurance is given, "Even to old age I am he, and even to hoar hairs will I carry you" (<a onClick="return mV(\'Isa\',46,4);">Isa 46:4</a>); hence it was looked forward to in faith and hope (<a onClick="return mV(\'Psa\',71,9,18);">Ps 71:9, 18</a>).<P>(4) Superior wisdom was believed to belong to the aged (<a onClick="return mV(\'Job\',12,20);">Job 12:20</a>; <a onClick="return mV(\'Job\',15,10);">15:10</a>; <a onClick="return mV(\'Job\',32,7,9);">32:7, 9</a>; compare <a onClick="return mV(\'1Ki\',12,8);">1Ki 12:8</a>); hence positions of guidance and authority were given to them, as the terms "elders," "presbyters" and (Arabic) "sheik" indicate.``185';
isbe[275]='Agee`a’-ge (aghe’, "fugitive"): A Hararite, father of Shammah, one of David’s "three mighty men" (<a onClick="return mV(\'2Sa\',23,11);">2Sa 23:11</a>). In <a onClick="return mV(\'1Ch\',11,34);">1Ch 11:34</a> we read of one "Jonathan the son of Shagee the Hararite." The parallel in <a onClick="return mV(\'2Sa\',23,32,33);">2Sa 23:32-33</a> reads "Jonathan, Shammah the Hararite." If we read "Jonathan (son of) Shammah," then Agee is the grandfather of Jonathan. Some, however, think <a onClick="return mV(\'1Ch\',11,34);">1Ch 11:34</a> to be correct, and read "Shagee" for "Agee" in <a onClick="return mV(\'2Sa\',23,11);">2Sa 23:11</a>, and for "Shammah" in <a onClick="return mV(\'2Sa\',23,33);">2Sa 23:33</a>. This makes Jonathan and Shammah brothers.``1';
isbe[276]='Ages, Rock of`Applied to Yahweh as an encouragement for trust (<a onClick="return mV(\'Isa\',26,4);">Isa 26:4</a> the Revised Version, margin; the King James Version "everlasting strength").``1';
isbe[277]='Aggaba`a-ga\'-ba (Aggaba, and Agraba; the King James Version, Graba) = Hagabah (<a onClick="return mV(\'Ezr\',2,45);">Ezr 2:45</a>) and Hagaba (<a onClick="return mV(\'Neh\',7,48);">Ne 7:48</a>): The descendants of Abraham (temple-servants) returned with Zerubbabel to Jerusalem (1Esdras 5:29).`<a href="./study/isbe/search.html?string=ACCABA">ACCABA</a>`1';
isbe[278]='Aggaeus`a-ge\'-us (Aggaios; the King James Version Aggeus). Haggai, one of the Minor Prophets. Abraham prophesied in the second year of the reign of Darius (compare <a onClick="return mV(\'Ezr\',4,24);">Ezr 4:24</a>; <a onClick="return mV(\'Ezr\',5,1);">5:1</a>) with Zacharias in Jerusalem (1Esdras 6:1; 7:3) In 2Esdras 1:40 he is mentioned as one who with others shall be given as "leader to the nation from the east."``1';
isbe[279]='Agia`a\'-gi-a (Agia; the King James Version Hagia) = Hattil (<a onClick="return mV(\'Ezr\',2,57);">Ezr 2:57</a>; <a onClick="return mV(\'Neh\',7,59);">Ne 7:59</a>): The descendants of Abraham (sons of the servants of Solomon) returned with Zerubbabel to Jerusalem (1Esdras 5:34).``1';
isbe[280]='Agone`a-gon’: In the King James Version of <a onClick="return mV(\'1Sa\',30,13);">1Sa 30:13</a>. Old past participle of "to go." the Revised Version (British and American) has "ago," namely, "three days ago," literally, "the third day."``1';
isbe[281]='Agony`ag\'-o-ni (agonia; Vulgate agonia):<P>A word occurring only once in the New Testament (<a onClick="return mV(\'Luk\',22,44);">Lu 22:44</a>), and used to describe the climax of the mysterious soul-conflict and unspeakable suffering of our Lord in the garden at Gethsemane. The term is derived from the Greek agon "contest" and this in turn from the Greek ago "to drive or lead," as in a chariot race. Its root idea is the struggle and pain of the severest athletic contest or conflict. The wrestling of the athlete has its counterpart in the wrestling of the suffering soul of the Saviour in the garden. At the beginning of this struggle He speaks of His soul being exceeding sorrowful even unto death, and this tumult of emotion culminated in the agony. All that can be suggested by the exhausting struggles and sufferings of charioteers, runners, wrestlers and gladiators, in Grecian and Roman amphitheaters, is summed up in the pain and death-struggle of this solitary word "agony." The word was rendered by Wyclif (1382) "maad in agonye" Tyndale (1534) and following translators use an agony." The record of Jesus\' suffering in Gethsemane, in the Synoptic Gospels (<a onClick="return mV(\'Mat\',26,\'36-46\');">Mt 26:36-46</a>; <a onClick="return mV(\'Mar\',14,\'32-42\');">Mr 14:32-42</a>; <a onClick="return mV(\'Luk\',22,\'39-46\');">Lu 22:39-46</a>, and also in <a onClick="return mV(\'Hbr\',5,7,8);">He 5:7-8</a>) indicates that it was threefold:<P>1. Physical:<P>The agony of His soul wrought its pain on His body, until "his sweat became as it were great drops of blood falling down upon the ground" (<a onClick="return mV(\'Luk\',22,44);">Lu 22:44</a>, omitted by some ancient authorities). He offered His prayers and supplications "with strong crying and tears" (<a onClick="return mV(\'Hbr\',5,7);">He 5:7</a>). The intensity of His struggle so distressed and weakened Him that Luke says "there appeared unto him an angel from heaven, strengthening him." The threefold record of the evangelists conveys the idea of the intensest physical pain. As the wire carries the electric current, so every nerve in Jesus\' physical being felt the anguish of His sensitive soul as He took upon Himself the burden of the world\'s sin and moral evil.<P>2. Mental:<P>The crisis of Jesus\' career as Messiah and Redeemer came in Gethsemane. The moral issue of His atoning work was intelligently and voluntarily met here. The Gospels exhaust language in attempting to portray the stress and struggle of this conflict. "My soul is exceeding sorrowful even unto death." "Being in an agony he prayed more earnestly, saying, Father, if it be possible, let this cup pass away from me." The mental clearness of Christ\'s vision of humanity\'s moral guilt and the energy of will necessary to meet the issue and take "this cup" of being the world\'s sin-bearer, indicate the awful sorrow and anguish of His supernatural conflict. It is divinely significant that the word "agony" appears but once in all Scripture. This solitary word records a solitary experience. Only One ever compassed the whole range of the world\'s sorrow and pain, anguish and agony. The shame of criminal arrest in the garden and of subsequent condemnation and death as a malefactor had to His innocent soul the horror of humanity\'s entire and ageless guilt. The mental and moral anguish of Jesus in Gethsemane interprets the meaning of Paul\'s description of the atonement, "Him who knew no sin he made to be sin on our behalf" (<a onClick="return mV(\'2Cr\',5,21);">2Co 5:21</a>).<P>3. Spiritual:<P>The agony of Jesus was supremely within the realm of His spirit. The effect of sin in separating the human soul from God was fathomed by the suffering Saviour in the fathomless mystery of His supernatural sorrow. Undoubtedly the anguish of Gethsemane surpassed the physical torture of Calvary. The whole conflict was wrought out here. Jesus\' filial spirit, under the burden of the world\'s guilt, felt isolated from the Father. This awful, momentary seclusion from His Father\'s face constituted the "cup" which He prayed might pass from Him, and the "agony" of soul, experienced again on the cross, when He felt that God had forsaken Him.<P>No theory of the atonement can do justice to the threefold anguish of Jesus in Gethsemane and on Calvary, or to the entire trend of Scripture, that does not include the substitutionary element in His voluntary sacrifice, as stated by the prophet: "Yahweh hath laid on him the iniquity of us all," <a onClick="return mV(\'Isa\',53,6);">Isa 53:6</a>; and by His apostles "who was delivered up for our trespasses," <a onClick="return mV(\'Rom\',4,25);">Ro 4:25</a>; "who his own self bare our sins," <a onClick="return mV(\'1Pe\',2,24);">1Pe 2:24</a>.<P>The word "agony" also occurs in 2Macc 3:14,16,21 the King James Version (the Revised Version (British and American) "distress") in describing the distress of the people at the attempt of Heliodorus to despoil the treasury of the temple in the days of Onias.``139';
isbe[282]='Agrapha`ag’-ra-fa (agrapha).<P>1. The Term and Its History:<P>The word agraphos of which agrapha is the neuter plural is met with in classical Greek and in Greek papyri in its primary sense of "unwritten," "unrecorded." In early Christian literature, especially in the writings of Clement of Alexandria, it was used of oral tradition; and in this sense it was revived by Koerner in a Leipzig Program issued in 1776 under the title De sermonibus Christi agraphois. For some time it was restricted to sayings of Christ not recorded in the Gospels and believed to have reached the sources in which they are found by means of oral tradition. As however graphe, the noun with which agrapha is connected, can have not only the general meaning "writing," but the special meaning "Scripture," the, adjective could signify not only "oral" but also uncanonical or "non-canonical"; and it was employed by Resch in the latter sense in the 1st edition of his great work on the subject which appeared in German in 1889 under the title, Agrapha: Extra-canonical Gospel Fragments. The term was now also extended so as to include narratives as well as sayings. In the second edition (also in German) it is further widened so as to embrace all extra-canonical sayings or passages connected with the Bible. The new title runs: Agrapha Extra-canonical Fragments of Scripture; and the volume contains a first collection of Old Testament agrapha. The term is still however used most frequently of non-canonical sayings ascribed to Jesus, and to the consideration of these this article will mainly be devoted.<P>2. Extent of Material:<P>Of the 361 agrapha and apocrypha given by Resch about 160 are directly ascribed to Christ. About 30 others can be added from Christian and Jewish sources and about 80 sayings found in Muhammadan literature (Expository Times, V, 59, 107, 177f., 503f., 561,etc.). The last-mentioned group, although not entirely without interest, may largely be disregarded as it is highly improbable that it represents early tradition. The others come from a variety of sources: the New Testament outside of the Gospels, Gospel manuscripts and VSS, Apocryphal Gospels and an early collection of sayings of Jesus, liturgical texts, patristic and medieval literature and the Talmud.<P>3. Sayings to Be Excluded:<P>Many of these sayings have no claim to be regarded as independent agrapha. At least five classes come under this category.<P>(1) Some are mere parallels or variants, for instance: "Pray and be not weary," which is evidently connected with <a onClick="return mV(\'Luk\',18,1);">Lu 18:1</a>; and the saying in the Talmud: "I, the Gospel, did not come to take away from the law of Moses but to add to the law of Moses have I come" (Shab 116b) which is clearly a variant of <a onClick="return mV(\'Mat\',5,17);">Mt 5:17</a>.<P>(2) Some sayings are made up of two or more canonical texts. "I chose you before the world was," for example, is a combination of <a onClick="return mV(\'Jhn\',15,19);">Joh 15:19</a> and <a onClick="return mV(\'Eph\',1,4);">Eph 1:4</a>; and "Abide in my love and I will give you eternal life" of <a onClick="return mV(\'Jhn\',8,31);">Joh 8:31</a> and <a onClick="return mV(\'Jhn\',10,28);">Joh 10:28</a>.<P>(3) Misquotation or loose quotation accounts for a number of alleged agrapha. "Sodom is justified more than thou" seems to be really from <a onClick="return mV(\'Eze\',16,53);">Eze 16:53</a> and its context. "Let not the sun go down upon your wrath" is of apostolic not evangelic origin (<a onClick="return mV(\'Eph\',4,26);">Eph 4:26</a>). "Anger destroys even the prudent" comes from Septuagint of <a onClick="return mV(\'Pro\',15,1);">Pr 15:1</a>.<P>(4) Some sayings must be rejected because they cannot be traced to an early source, for instance, the fine saying: "Be brave in war, and fight with the old serpent, and ye shall receive eternal life," which is first met with in a text of the 12th century<P>(5) Several sayings are suspicious by reason of their source or their character. The reference to "my mother the Holy Spirit," in one of them, has no warrant in the acknowledged teaching of Christ and comes from a source of uncertain value, the Gospel according to the Hebrews. Pantheistic sayings such as "I am thou and thou art I, and wherever thou art I am"; "You are I and I am you"; and perhaps the famous saying: "Raise the stone and thou wilt find me; cleave the wood and there am I," as well as the sayings reported by Epiphanius from the Gospel of the Ebionites seem to breathe an atmosphere different from that of the canonical Gospels.<P>4. Sayings in New Testament:<P>When all the sayings belonging to these five classes, and a few others of liturgical origin, have been deducted there remain about thirty-five which are worthy of mention and in some cases of careful consideration. Some are dealt with in the article <a href="./study/isbe/search.html?string=LOGIA">LOGIA</a> (which see). The others, which are given here, are numbered consecutively to facilitate reference. The best authenticated are of course those found in the New Testament outside of the Gospels. These are<P>(1) the great saying cited by Paul at Miletus: "It is more blessed to give than to receive" (<a onClick="return mV(\'Act\',20,35);">Ac 20:35</a>);<P>(2) the words used in the institution of the Eucharist preserved only in <a onClick="return mV(\'1Cr\',11,24);">1Co 11:24</a>f.;<P>(3) the promise of the baptism of the Spirit (<a onClick="return mV(\'Act\',1,5);">Ac 1:5</a>; <a onClick="return mV(\'Act\',1,11);">11:16</a>); and<P>(4) the answer to the question: "Dost thou at this time restore the kingdom to Israel?" (<a onClick="return mV(\'Act\',1,7);">Ac 1:7</a>f.). Less certain are<P>(5) the description of the Second Advent, said to be "by the word of the Lord" (<a onClick="return mV(\'1Th\',4,15);">1Th 4:15</a>f.); and<P>(6) the promise of the crown of life to them that love God (<a onClick="return mV(\'Jam\',1,12);">Jas 1:12</a>).<P>5. Sayings in Manuscripts and Versions:<P>Of considerable interest are some additions, in manuscripts of the Gospels and versions. One of the most remarkable<P>(7) is the comment of Jesus on a man’s working on the Sabbath day inserted after <a onClick="return mV(\'Luk\',6,4);">Lu 6:4</a> in Codex Bezae (D) and the Freer manuscript recently discovered in Egypt: "If thou knowest what thou doest, O man, blessed art thou, but if thou knowest not, thou art accursed and a transgressor of the law." Another<P>(8) also found in D and in several other authorities is appended to <a onClick="return mV(\'Mat\',20,28);">Mt 20:28</a>: "But ye seek ye from little to increase and from greater to be less." In the Curetonian Syriac the latter clause runs: "and not from greater to be less." The new saying is noteworthy but obscure. A third passage<P>(9) of less value but still of interest is an insertion in the longer ending of Mark, between <a onClick="return mV(\'Mar\',16,14);">16:14</a> and <a onClick="return mV(\'Mar\',16,15);">16:15</a>, which was referred to by Jerome as present in codices in his day but has now been met with in Greek for the first time in the above-mentioned Freer MS. (For facsimile see American Journal of Archaeology, 1908.) In reply to a complaint of the disciples about the opposition of Satan and their request: "Therefore reveal thy righteousness even now," Jesus is reported to have said: "The limit of the years of the authority of Satan is fulfilled, but other dreadful things are approaching, and in behalf of those who had sinned was I delivered unto death in order that they might return to the truth and might sin no longer, that they might inherit the spiritual and incorruptible glory of righteousness in heaven." This alleged utterance of the risen Lord is most probably of secondary character (compare Gregory, Das Freer Logion; Swete, Two New Gospel Fragments).<P>6. Sayings from the Fathers, etc.:<P>Apocryphal and patristic literature supplies some notable sayings. The first place must be given<P>(10) to the great saying which in its shortest form consists of only three words: "Be ("become," "show yourselves to be") approved money-changers." Resch (Agrapha<sup>2</sup>, number 87) gives 69 references, at least 19 of which date from the 2nd and 3rd centuries, although they represent only a few authorities, all Egyptian. The saying seems to have circulated widely in the early church and may be genuine. Other early sayings of interest or value, from these sources, must be given without comment.<P>(11) "The heavenly Father willeth the repentance of the sinner rather than his punishment" (Justin Martyr).<P>(12) "That which is weak shall be saved by that which is strong" (circa 300 AD).<P>(13) "Come out from bonds ye who will" (Clement of Alexandria).<P>(14) "Be thou saved and thy soul" (Theodotus in id).<P>(15) "Blessed are they who mourn for the perdition of unbelievers" (Didaskalia).<P>(16) "He who is near me is near the fire; he who is far from me is far from the kingdom" (Origen).<P>(17) "He who has not been tempted has not been approved" (Didaskalia, etc.).<P>(18) He who makes sad a brother’s spirit is one of the greatest of criminals" (Ev Heb).<P>(19) "Never be glad except when ye have seen your brother in love" (same place).<P>(20) "Let not him who seeks cease...until he find, and when he finds he shall be astonished; astonished he shall reach the kingdom, and when he has reached the kingdom he shall rest" (Clement of Alexandria and Logia of Oxyrhynchus).<P>(21) In a fragment of a Gospel found by Grenfell and Hunt at Oxyrhynchus (O Papyri number 655) is the following non-canonical passage in a canonical context: "He Himself will give you clothing. His disciples say unto Him: When wilt thou be manifest to us and when shall we see thee? He saith: When ye shall be stripped and not be ashamed." The saying or apocryphon exhibits considerable likeness to a saying cited by Clement of Alexandria from the Gospel according to the Egyptians, but the difference is great enough to make original identity doubtful. Another fragment found by the same explorers on the same site (O Papyri number 840) preserves two agrapha or apocrypha which though clearly secondary are very curious.<P>The first (22) is the concluding portion of a saying about the punishment of evil-doers: "Before a man does wrong he makes all manner of subtle excuses. But give heed lest you also suffer the same things as they for the evil-doers among men receive not their due among the living (Greek zois) only but also await punishment and much torment." Professor Swete (Two New Gospel Fragments), accents zoois as the plural of zoon and thus finds a contrast between the fate of animals and that of human beings.<P>The second saying (23) is a rather lengthy reply to the complaint of a Pharisaic stickler for outward purity. The most interesting part of it as edited by Swete runs as follows: "Woe to you blind who see not.... But I and my disciples who thou sayest have not been dipped have dipped in the waters of eternal life which come down from God out of heaven." All these texts from Oxyrhynchus probably date from the 2nd century. Other Egypt sources, the so-called Coptic Apocryphal Gospels (Texts and Studies Camb. IV,2,1896), contain several sayings which are of interest as coming from the same religious environment. The following three are the most remarkable.<P>(24) "Repent, for it is better that a man find a cup of water in the age that is coming than all the riches of this world" (130).<P>(25) "Better is a single footstep in My Father’s house than all the wealth of this world" (130f.).<P>(26) "Now therefore have faith in the love of My Father; for faith is the end of all things" (176). As in the case of the Logia these sayings are found in association with canonical sayings and parallels. Since the Logan may well have numbered scores, if not hundreds, it is at least possible that these Coptic sayings may have been taken from the missing portions of this collection, or a recension of it, and therefore they are not unworthy of notice as conceivably early agrapha. To these sayings of Christian derivation may be added<P>(27) one Muhammadan saying, that inscribed in Arabic on the chief gateway of the city Futteypore Sikri built by Akbar: "The world is but a bridge, over which you must pass, but must not linger to build your dwelling" (In the Himalayas by Miss Gordon Cumming, cited by Griffenhoofe, The Unwritten Sayings of Christ, 128).<P>7. Result:<P>Although the number of agrapha purporting to be sayings of Jesus which have been collected by scholars seems at first sight imposing, those which have anything like a strong claim to acceptance on the ground of early and reliable source and internal character are disappointingly few. Of those given above <a onClick="return mV(\'Num\',1,\'1-\');">Numbers 1-4</a>; <a onClick="return mV(\'Num\',7,\'1-\');">7</a>; <a onClick="return mV(\'Num\',8,\'1-\');">8</a>; <a onClick="return mV(\'Num\',10,\'1-\');">10</a> which have mostly early attestation clearly take precedence of the rest. <a onClick="return mV(\'Num\',11,\'1-\');">Numbers 11-20</a> are early enough and good enough to merit respectful consideration. Still the proportion of genuine, or possibly genuine, material is very small. Ropes is probably not far from the truth when he remarks that "the writers of the Synoptic Gospels did their work so well that only stray bits here and there, and these but of small value, were left for the gleaners." On the other hand it is not necessary to follow Wellhausen in rejecting the agrapha in toto. Recent discoveries have shown that they are the remains of a considerable body of extra-canonical sayings which circulated more or less in Christian circles, especially in Egypt, in the early centuries, and the possible presence in what we possess of a sentence or two actually spoken by Jesus fully justifies research.<P>8. Other Agrapha:<P>The second edition of th
