e work of Resch includes 17 agrapha from manuscripts of Acts and 1 John most of which are from Codex Bezae (D), 31 apostolic apocrypha, and 66 agrapha and apocrypha connected with the Old Testament. 19 of the latter are largely taken from pseudepigrapha, a pseudo-Ezekiel for instance These agrapha some of which are really textual variants are of inferior interest and value.<P>LITERATURE.<P>The chief authorities are the German book of the American scholar J. H. Ropes, Die Spruche Jesu, die in den kanonischen Evangelien nicht uberliefert sind, and his article "Agrapha in HDB (extra vol); and the often-mentioned work of Resch. The former has great critical value, and the latter, especially in the 2nd edition, is a veritable thesaurus of material. For a full survey of the literature up to 1905 see that work, pp. 14-17. There is much criticism in Bauer’s Das Leben Jesu im Zeitalter der neutestamentlichen Apokryphen, chapter vii. Among smaller works special mention may be made of Prebendary Blomfield’s Twenty-Five Agrapha (1900); and the book of Griffenhoofe, the title of which is given above. There are recent articles on the subject in HDB (1909), "Unwritten Sayings," and DCG, "Sayings (Unwritten)"; Am. Journal of Archaeology, XII (1908), 49-55; H. A. Sanders, New manuscripts from Egypt; also ib, XIII (1909), 130.`<a href="./study/isbe/search.html?string=LOGIA">LOGIA</a>`162';
isbe[283]='Agrarian Laws`a-gra’-ri-an loz: <p>1. The Sabbath Year <p>2. The Jubilee <p>3. Its Object <p>4. The Legal Rules <p>5. Ideas and Circumstances of the Legislation <p>6. Form of the Legislation <p>7. Its Operation and Extension <p>8. Other Laws Affecting the Land<hr /> <p>The Mosaic provisions on this subject form one of the most characteristic and interesting portions of the legislation. The main institutions are two, namely, the Sabbath year and the jubilee, and they are closely linked together.<P>1. The Sabbath Year:<P>In every seventh year the land was to lie fallow "that the poor of thy people may eat: and what they leave the beast of the field shall eat" (<a onClick="return mV(\'Exd\',23,10);">Ex 23:10</a>f.; compare <a onClick="return mV(\'Lev\',25,\'2-7\');">Le 25:2-7</a>). ‘And the Sabbath of the land shall be for food for you; for thee, and for thy servant, and for thy maid, and for thy hired servant and for thy stranger that sojourn with thee; but for thy cattle, and for the beasts that are in thy land, shall all the increase thereof be for food’ (<a onClick="return mV(\'Lev\',25,6);">Le 25:6</a>f.). This has been quoted at length because the rendering of English Versions of the Bible is misleading. "The Sabbath of the land" does not mean that the natural increase thereof is to be eaten by the Israelite peasant. That interpretation is excluded by <a onClick="return mV(\'Lev\',25,\'3-5\',20,21,22);">Le 25:3-5, 20-22</a>. What is intended is clearly shown by the latter of these two passages, "I will command my blessing upon you in the sixth year." The principle on which the manna had been provided for Sabbaths was to apply to the harvest of the sixth year, and this is the import of the phrase.<P>2. The Jubilee:<P>After "seven sabbaths of years, even forty and tone years" a trumpet was to be blown throughout the land on the tenth day of the seventh month (i.e. the Day of Atonement) and the fiftieth year was to be hallowed and celebrated as a "jubilee." No agricultural work of any kind was to be performed, but "ye may (so correct EVV) eat the increase thereof out of the field" (<a onClick="return mV(\'Lev\',25,12);">Le 25:12</a>). God would so bless the land in the sixth year that it would bring forth enough for the Sabbath year, the ensuing jubilee and the subsequent period to the harvest of the ninth year (<a onClick="return mV(\'Lev\',25,\'20-22\');">Le 25:20-22</a>).<P>3. Its Object:<P>In addition to being a period in which the land was left fallow, the jubilee was intended to meet the economic evils that befell peasants in ancient societies. Wars or unfavorable seasons would soon reduce a farmer to a condition in which he would have to borrow. But money is rarely to be had without interest and security, and in early communities the rates of interest were very high indeed, while the only security the farmer could offer would consist of his land and the persons of himself and his children. Hence we find insolvency giving rise to the alienation of land and to slavery all over the world—sometimes with the retention of civil rights (as in Rome and Israel), at others in a more unalloyed form. The jubilee aims at both these evils. It is provided that in that year the peasants who had lost their full freedom through insolvency should be free (see Wiener, Studies in Biblical Law, 5f.) and all lands that had been sold should return to the original owner or his family. "And the land shall not be sold in perpetuity; for the land is mine: for ye are strangers and sojourners with me" (<a onClick="return mV(\'Lev\',25,23);">Lev 25:23</a>). To this theory there are parallels elsewhere, e.g. in Togoland (Heinrici, Zeitschrift fur vergleichende Rechtswissenschaft, XI, 138).<P>4. The Legal Rules:<P><a onClick="return mV(\'Lev\',25,\'1-\');">Le 25</a> containing the land laws gives effect to this view by enacting that when an Israelite was compelled to part with his land there was to be a "redemption" of land, and that in default of redemption the land should return to its original owner in the jubilee year. This "redemption" covers two ideas—a right of preemption by the next of kin the first instance, and if that were not exercised, a right on the part of the original owner to buy back the land before the jubilee (<a onClick="return mV(\'Lev\',25,\'24-28\');">Le 25:24-28</a>). The theory did not apply to houses in walled cities. Those might be redeemed within a year of sale: in default the property passed for ever and was unaffected by the jubilee (<a onClick="return mV(\'Lev\',25,29);">Le 25:29</a>f.). Villages were reckoned as country (<a onClick="return mV(\'Lev\',25,31);">Le 25:31</a>). The Levitical cities were subject to the rules of land, not of walled cities (<a onClick="return mV(\'Lev\',25,32);">Le 25:32</a>f.; read with the Vulgate in the American Revised Version, margin, "if they have not been redeemed" in <a onClick="return mV(\'Lev\',25,32);">Le 25:32</a>), and their fields were not to be sold (<a onClick="return mV(\'Lev\',25,34);">Le 25:34</a>). All sales of lands to which the Jubilee applied were to be made on the basis of the number of crops (<a onClick="return mV(\'Lev\',25,14);">Le 25:14</a>f.); in fact, what was sold was not the property itself but the usufruct (i.e. the right of using, reaping, etc.) till the year of the jubilee. Similarly with the laws of <a onClick="return mV(\'Lev\',27,\'16-25\');">Le 27:16-25</a>, where the general principle is that if a field be sanctified the value shall be estimated according to the number of years to the Jubilee. Unfortunately the text is corrupt and it is impossible to make out the exact circumstances in which no further redemption was allowed (<a onClick="return mV(\'Lev\',27,20);">Le 27:20</a>).<P>5. Ideas and Circumstances of the Legislation:<P>"The land laws are the product of many independent ideas and circumstances....First such a system as that expounded in the 25th chapter of Leviticus could only be put forward by one who had to work on what is so very rare in history—a clean slate. In other words, the system of land tenure here laid down could only be introduced in this way by men who had no preexisting system to reckon with. Secondly, there is (mutatis mutandis) a marked resemblance between the provisions of Leviticus and the system introduced in Egypt by Joseph (<a onClick="return mV(\'Gen\',47,\'1-\');">Ge 47</a>). The land is the Lord’s as it is Pharaoh’s; but the towns which are built on that land are not subject to the same theory or the same rules. Perhaps the explanation is that Joseph’s measures had affected only those who gained their living by agriculture, i.e. the dwellers in the country. Thirdly, the system shows the enormous power that the conception of family solidarity possessed in the Mosaic age....And fourthly, the enactment is inspired and illuminated by the humanitarian and religious convictions to which reference has already been made" (Journal of Transactions of the Victoria Institute, XLI, 160). Undoubtedly the most striking feature of the enactment is to be found in these religious convictions with the absolute reliance on constant Divine intervention to secure the working of the law (<a onClick="return mV(\'Gen\',47,20);">Ge 47:20</a>f.).<P>6. Form of the Legislation:<P><a onClick="return mV(\'Lev\',26,\'1-\');">Le 26</a> shows clearly that this legislation was conceived as the terms of a covenant made between God and the children of Israel, and it appears from <a onClick="return mV(\'Lev\',26,\'42-45\');">Le 26:42-45</a> that this of the covenant was regarded as being connected with the covenants with the patriarchs though it is also a covenant made with the generation that came forth from Egypt. The land was originally promised to Abraham in a covenant (<a onClick="return mV(\'Gen\',17,\'1-\');">Ge 17</a>) and it would seem that these laws are regarded as attaching to that covenant which had been renewed with his descendants. Indeed the laws appear to be presented as terms of the sworn agreement (covenant) under which God was about to give Israel the possession of Canaan.<P>7. Its Operation and Extension:<P>As respects the operation of these laws we have no information as to the observance of any fallow years before the Exile: <a onClick="return mV(\'2Ch\',36,21);">2Ch 36:21</a> is rather unfavorable, but so obviously echoes <a onClick="return mV(\'Lev\',26,43);">Le 26:43</a> that it scarcely seems to be meant as a historical statement. But traces are to be found of the operation of other parts of the system. <a onClick="return mV(\'Rth\',4,\'1\');">Ru 4</a> shows us the law of redemption working, but with two notable extensions. Widows have acquired a right of property in their husbands’ estates, and when the next of kin refuses to redeem, the right passes to the kinsman who is nearest in succession. Neither of these cases is contemplated by the Pentateuch: both appear to be fresh applications of the Levitical law which, like all other legislations, had to be adapted to meet new sets of facts as they arose. Similarly <a onClick="return mV(\'Jer\',32,\'1-\');">Jer 32</a> illustrates the law of preemption, but here a small difficulty arises, for <a onClick="return mV(\'Lev\',25,34);">Le 25:34</a> forbids the sale of the suburbs of the Levitical cities. Probably however this refers only to sale outside the family and not as here to the nearest kinsman and heir presumptive. Similarly Ezekiel twice refers to the jubilee (<a onClick="return mV(\'Eze\',7,12);">Eze 7:12</a>f. and <a onClick="return mV(\'Eze\',46,17);">Eze 46:17</a>) in terms that seem to show that he knew it as an existing institution (see SBL, 96; Churchman, May,1906,292). Historical traces of the Levitical cities are mentioned in the article <a href="./study/isbe/search.html?string=LEVITICAL+CITIES">LEVITICAL CITIES</a>. It should be added that under the monarchy a rule seems to have been introduced that derelict lands fell to the king (see <a onClick="return mV(\'2Sa\',9,9);">2Sa 9:9</a>; <a onClick="return mV(\'1Ki\',21,16);">1Ki 21:16</a>; <a onClick="return mV(\'2Ki\',8,3,6);">2Ki 8:3, 6</a>).<P>In later times there are several references to the fallow of the Sabbatical year (1Macc 6:49,53; Ant, XIII, viii,1,XIV, x,6,etc.).<P>8. Other Laws Affecting the Land:<P>In addition to these laws Moses enacted provisions favoring gleaning, on which see <a href="./study/isbe/search.html?string=POOR">POOR</a>. He also prohibited sowing a field or vineyard with two kinds of seed (<a onClick="return mV(\'Lev\',19,19);">Le 19:19</a>; <a onClick="return mV(\'Deu\',22,9);">De 22:9</a>) and prescribed that for three years the fruit of trees should not be eaten, while in the fourth it should be holy, and in the fifth it was to be available for ordinary purposes (<a onClick="return mV(\'Lev\',19,23);">Le 19:23</a>f.).``193';
isbe[284]='Agree`a-gre\' (sumphoneo, "to be of the same mind," "to come to a mutual understanding"): This is the sense of the word in <a onClick="return mV(\'Mat\',20,2);">Mt 20:2</a>; <a onClick="return mV(\'Jhn\',9,22);">Joh 9:22</a>, and other passages. In <a onClick="return mV(\'Mar\',14,56);">Mr 14:56</a> the word is isos and has the thought not only that their words did not agree, but also that the testimony was not in agreement with or equal to what the law required in such a case. The thought of being equal occurs also in <a onClick="return mV(\'1Jo\',5,8);">1Joh 5:8</a>.<P>The figurative use of the word in <a onClick="return mV(\'Mat\',18,19);">Mt 18:19</a> makes it of special interest. The word there is sumphoneo, from which comes our word symphony, meaning a harmonious blending. This agreement therefore is complete. Three persons are introduced: two human beings and the Father. They are in perfect agreement on the subject or purpose under consideration. It is therefore an inward unity produced by the Holy Spirit leading the two into such an agreement with the Father. There will follow then, as a matter of course, what is promised in <a onClick="return mV(\'Mat\',18,19,20);">Mt 18:19-20</a>. In <a onClick="return mV(\'Act\',5,9);">Ac 5:9</a> it sets forth the justice of Peter in dealing in the same manner in both cases. Ananias and Sapphira were in perfect agreement and equally guilty (<a onClick="return mV(\'Luk\',5,36);">Lu 5:36</a>; <a onClick="return mV(\'Act\',15,15);">Ac 15:15</a>).``87';
isbe[285]='Agriculture`ag\'-ri-kul-tur, ag\'-ri-kul-chur:<P><b>I. DEVELOPMENT OF AGRICULTURE</b><P><b>II. CLIMATIC CONDITIONS AND FERTILITY</b><P><b>III. AGRICULTURAL PURSUITS</b><P class="in15">1. Growing of Grain<P class="in30">(1) Plowing and Sowing<P class="in30">(2) Reaping<P class="in30">(3) Threshing<P class="in15">2. Care of Vineyards<P class="in15">3. Raising of Flocks<hr /><P>I. Development of Agriculture.<P>One may witness in Syria and Palestine today the various stages of social progress through which the people of Bible times passed in which the development of their agriculture played an important part. To the east the sons of Ishmael still wander in tribes from place to place, depending upon their animals for food and raiment, unless by a raid they can secure the fruits of the soil from the peoples, mostly of their own blood, who have given up wandering and are supporting themselves by tilling the ground. It is only a short step from this frontier life to the more protected territory toward the Mediterranean, where in comparatively peaceful surroundings, the wanderers become stationary. If the land which they have come to possess is barren and waterless, they become impoverished physically and spiritually, but if they have chosen the rarer spots where underground streams burst forth into valleys covered with alluvial deposits (<a onClick="return mV(\'Exd\',3,8);">Ex 3:8</a>), they prosper and there springs up the more complicated community life with its servants, hirelings, gardeners, etc. A division of labor ensues. Some leave the soil for the crafts and professions but still depend upon their farmer neighbors for theft sustenance. (<a onClick="return mV(\'1Ki\',5,11);">1Ki 5:11</a>.) Such was the variety of life of the people among whom Jesus lived, and of their ancestors, and of the inhabitants of the land long before the children of Israel came to take possession of it. Bible history deals with the Hebrews at a period when a large proportion of that people were engaged in agrarian pursuits, hence we find its pages filled with references to agricultural occupations.<P>II. Climatic Conditions and Fertility.<P>With climatic conditions and fertility so varied, the mode of cultivation, seedtime and harvest differed even in closely adjacent territory. On the coastal plains and in the low Jordan valley the soil was usually rich and the season was early, whereas the mountainous regions and high interior plains the planting and reaping times were from two weeks to a month later. To make use of the soil on the hillsides, terracing was frequently necessary.<P>Examples of these old terraces still exist. On the unwatered plains the crops could be grown only In the winter and spring, i.e. during the rainy season. These districts dried up in May or June and remained fallow during the rainless summer. The same was true of the hilly regions and valleys except where water from a stream could be diverted from its channel and spread over the fields. In such districts crops could be grown irrespective of the seasons. See <a href="./study/isbe/search.html?string=IRRIGATION">IRRIGATION</a>.<P>III. Agricultural Pursuits.<P>To appreciate the many references in the Bible to agricultural pursuits and the frequent allusions of our Lord to the fields and their products, we must remember how different were the surroundings of the farmers of that day from those among which most of us live or with which we are acquainted. What knowledge we have of these pursuits is drawn from such references as disclose methods bearing a close similarity to those of the present day. The strong tendency to resist change which is everywhere manifest throughout the country and the survival of ancient descriptive words in the language of today further confirm our belief that we now witness in this country the identical operations which were used two thousand or more years ago. It would be strange if there were not a variety of ways by which the same object was accomplished when we remember that the Hebrew people benefited by the experience of the Egyptians, of the Babylonians, of the inhabitants of the land of their adoption, as well as of its late European conquerors. For this reason the drawings found on the Egyptian monuments, depicting agricultural scenes, help us to explain the probable methods used in Palestine.<P>Three branches of agriculture were more prominent than the others; the growing of grain, the care of vineyards (<a onClick="return mV(\'Num\',18,30);">Nu 18:30</a>), and the raising of flocks. Most households owned fields and vineyards and the richer added to these a wealth of flocks. The description of Job\'s wealth (in <a onClick="return mV(\'Job\',1,\'1-\');">Job 1</a>) shows that he was engaged in all these pursuits. Hezekiah\'s riches as enumerated in <a onClick="return mV(\'2Ch\',32,27,28);">2Ch 32:27-28</a> suggest activity in each of these branches.<P>1. Growing of Grain:<P>In this and following descriptions, present-day methods as far as they correspond to ancient records will be dealt with.<P>(1) Plowing and sowing.<P>On the plains, little or no preparation for plowing is needed, but in the hilly regions, the larger stones, which the tilling of the previous season has loosened and which the winter\'s rains have washed bare, are picked out and piled into heaps on some ledge, or are thrown into the paths, which thus become elevated above the fields which they traverse. (See <a href="./study/isbe/search.html?string=FIELD">FIELD</a>.) If grain is to be planted, the seed is scattered broadcast by the sower. If the land has not been used for some time the ground is first plowed, and when the seed has been scattered is plowed again. The sower may keep his supply of seed in a pocket made by pulling up his outer garment through his girdle to a sufficient extent for it to sag down outside his girdle in the form of a loose pouch. He may, on the other hand, carry it in a jar or basket as the sowers are pictured as doing on the Egyptian monuments. As soon as the seed is scattered it is plowed in before the ever-present crows and ravens can gather it up. The path of the plow in the fields of the hilly regions is a tortuous one because of the boulders jutting out here and there (<a onClick="return mV(\'Mat\',13,3);">Mt 13:3</a>f.) or because of the ledges which frequently lie hidden just beneath the surface (the rocky places of Christ\'s parable).<P>When the plowman respects the footpaths which the sufferance of the owner has allowed to be trodden across his fields or which mark the boundaries between the lands of different owners, and leaves them unplowed, then the seed which has fallen on these portions becomes the food of the birds. Corners of the field where the plow cannot reach are hoed by hand. Harrowing-in as we know it is not practiced today, except on some of the larger plains, and probably was not used in Palestine in earlier times. See <a href="./study/isbe/search.html?string=HARROW">HARROW</a>.<P>(2) Reaping.<P>After the plowing is over, the fields are deserted until after the winter rains, unless an unusually severe storm of rain and hail (<a onClick="return mV(\'Exd\',9,25);">Ex 9:25</a>) has destroyed the young shoots. Then a second sowing is made. In April, if the hot east winds have not blasted the grain (see <a href="./study/isbe/search.html?string=BLASTING">BLASTING</a>) the barley begins to ripen. The wheat follows from a week to six weeks later, depending upon the altitude. Toward the end of May or the first week in June, which marks the beginning of the dry season, reaping begins. Whole families move out from their village homes to spend the time in the fields until the harvest is over. Men and women join in the work of cutting the grain. A handful of grain is gathered together by means of a sickle held in the right hand. The stalks thus gathered in a bunch are then grasped by the left hand and at the same time a pull is given which cuts off some of the stalks a few inches above ground (see <a href="./study/isbe/search.html?string=STUBBLE">STUBBLE</a>) and pulls the rest up by the roots. These handfuls are laid behind the reapers and are gathered up by the helpers (see <a href="./study/isbe/search.html?string=GLEANING">GLEANING</a>), usually the children, and made into piles for transporting to the threshing-floor.<P>(3) Threshing.<P>The threshing-floors are constructed in the fields, preferably in an exposed position in order to get the full benefit of the winds. If there is a danger of marauders they are clustered together close to the village. The floor is a level, circular area 25 to 40 ft. in diameter, prepared by first picking out the stones, and then wetting the ground, tamping or rolling it, and finally sweeping it. A border of stones usually surrounds the floor to keep in the grain. The sheaves of grain which have been brought on the backs of men, donkeys, camels, or oxen, are heaped on this area, and the process of tramping out begins. In some localities several animals, commonly oxen or donkeys, are tied abreast and driven round and round the floor. In other places two oxen are yoked together to a drag, the bottom of which is studded with pieces of basaltic stone. This drag, on which the driver, and perhaps his family, sits or stands, is driven in a circular path over the grain. In still other districts an instrument resembling a wheel harrow is used, the antiquity of which is confirmed by the Egyptian records. The supply of unthreshed grain is kept in the center of the floor. Some of this is pulled down from time to time into the path of the animals. All the while the partly threshed grain is being turned over with a fork. The stalks gradually become broken into short pieces and the husks about the grain are torn off. This mixture of chaff and grain must now be winnowed. This is done by tossing it into the air so that the wind may blow away the chaff (see <a href="./study/isbe/search.html?string=WINNOWING">WINNOWING</a>). When the chaff is gone then the grain is tossed in a wooden tray to separate from it the stones and lumps of soil which clung to the roots when the grain was reaped. The difference in weight between the stones and grain makes separation by this process possible (see <a href="./study/isbe/search.html?string=SIFT">SIFT</a>). The grain is now poled in heaps and in many localities is also sealed. This process consists in pressing a large wooden seal against the pile. When the instrument is removed it leaves an impression which would be destroyed should any of the grain be taken away. This allows the government offers to keep account of the tithes and enables the owner to detect any theft of grain. Until the wheat is transferred to bags some one sleeps by the pries on the threshing-floor. If the wheat is to be stored for home consumption it is often first washed with water and spread out on goats\' hair mats to dry before it is stored in the wall compartments found in every house (see <a href="./study/isbe/search.html?string=STOREHOUSES">STOREHOUSES</a>). Formerly the wheat was ground only as needed. This was then a household task which was accomplished with the hand-mill or mortar (see <a href="./study/isbe/search.html?string=MILL">MILL</a>).<P>2. Care of Vineyards:<P>No clearer picture to correspond with present-day practice in vine culture (see <a href="./study/isbe/search.html?string=VINE">VINE</a>) in Palestine could be given than that mentioned in <a onClick="return mV(\'Isa\',5,1,6);">Isa 5:1, 6</a>. Grapes probably served an important part in the diet of Bible times as they do at present. In the season which begins in July and extends for at least three months, the humblest peasant as well as the richest landlord considers grapes as a necessary part of at least one meal each day. The grapes were not only eaten fresh but were made into wine (see <a href="./study/isbe/search.html?string=WINE+PRESS">WINE PRESS</a>). No parallel however can be found in the Bible for the molasses which is made by boiling down the fresh grape juice. Some writers believe that this substance was meant in some passages translated by wine or honey, but it is doubtful. The care of the vineyards fitted well into the farmer\'s routine, as most of the attention required could be given when the other crops demanded no time.<P>3. Raising of Flocks:<P>The leaders of ancient Israel reckoned their flocks as a necessary part of their wealth (see <a href="./study/isbe/search.html?string=SHEEP">SHEEP</a>). When a man\'s flocks were his sole possession he often lived with them and led them in and out in search of pasturage (<a onClick="return mV(\'Psa\',23,\'1-\-);">Ps 23</a>; <a onClick="return mV(\'Mat\',18,12);">Mt 18:12</a>), but a man with other interests delegated this task to his sons (<a onClick="return mV(\'1Sa\',16,11);">1Sa 16:11</a>) or to hirelings. Human nature has not changed since the time when Christ made the distinction between the true shepherd and the hireling (<a onClick="return mV(\'Jhn\',10,12);">Joh 10:12</a>). Within a short time of the writing of these words the writer saw a hireling cursing and abusing the stray members of a flock which he was driving, not leading as do good shepherds. The flock furnished both food and raiment. The milk of camels, sheep and goats was eaten fresh or made into curdled milk, butter or cheese. More rarely was the flesh of these animals eaten (see <a href="./study/isbe/search.html?string=FOOD">FOOD</a>). The peasant\'s outer coat is still made of a tawed sheepskin or woven of goats\' hair or wool (see <a href="./study/isbe/search.html?string=WEAVING">WEAVING</a>). The various agricultural operations are treated more fully under their respective names, (which see) .``133';
isbe[286]='Agrippa`a-grip\'-a.`<a href="./study/isbe/search.html?string=HEROD">HEROD</a>`1';
isbe[287]='Ague`a\'-gu (qaddachath): In <a onClick="return mV(\'Lev\',26,16);">Le 26:16</a> the King James Version is one of the diseases threatened as a penalty for disobedience to the law. The malady is said to "consume the eyes, and make the soul to pine away." The word means burning (Vulgate "ardor") and was probably intended to denote the malarial fever so common now both in the Shephelah and in the Jordan valley. In Septuagint the word used (ikteros) means jaundice, which often accompanies this fever. The Revised Version (British and American) translates it "fever."`<a href="./study/isbe/search.html?string=FEVER">FEVER</a>`1';
isbe[288]='Agur`a\'-gur (\'aghur, seeming, from comparison with Arabic roots, to mean either "hireling," or "collector," "gatherer"): One of the contributors to Proverbs; his words being included in <a onClick="return mV(\'Pro\',30,\'1-\');">Pr 30</a>. He takes an agnostic attitude toward God and transcendent things, and in general the range of his thought, as compared with that of other authors, is pedestrian. He shows, however, a tender reverence and awe. His most notable utterance, perhaps, is the celebrated Prayer of Agur (<a onClick="return mV(\'Pro\',30,\'7-9\');">Pr 30:7-9</a>), which gives expression to a charming golden mean of practical ideal. His sayings are constructed on a rather artificial plan; having the form of the so-called numerical proverb.`<a href="./study/isbe/search.html?string=PROVERBS,+THE+BOOK+OF">PROVERBS, THE BOOK OF</a>`66';
isbe[289]='Ah`In proper names.`<a href="./study/isbe/search.html?string=AHI">AHI</a>`1';
isbe[290]='Ah; Aha`a, a-ha’: Interjections of frequent occurrence in the Old Testament, representing different Hebrew words and different states of feeling.<P>(1) ‘ahah, expressing complaint and found in the phrase "Ah, Lord Yahweh" (<a onClick="return mV(\'Jer\',1,6);">Jer 1:6</a>; <a onClick="return mV(\'Jer\',4,10);">4:10</a> etc.; <a onClick="return mV(\'Eze\',4,14);">Eze 4:14</a> etc.). Elsewhere the word is translated "alas!" (<a onClick="return mV(\'Joe\',1,15);">Joe 1:15</a>).<P>(2) ‘ach, occurs once (<a onClick="return mV(\'Eze\',21,15);">Eze 21:15</a>), expressing grief in contemplating Israel’s destruction.<P>(3) he’ach, usually expresses malicious joy over the reverses of an enemy, and is introduced by the verb "to say" (Brown-Driver-Briggs’ Lexicon); so in <a onClick="return mV(\'Psa\',35,21,25);">Ps 35:21, 25</a>; <a onClick="return mV(\'Eze\',25,3);">Eze 25:3</a>; <a onClick="return mV(\'Eze\',26,2);">26:2</a>; <a onClick="return mV(\'Eze\',36,2);">36:2</a>; in the repeated <a onClick="return mV(\'Psa\',40,15);">Psalm 40:15</a>; <a onClick="return mV(\'Psa\',70,3);">70:3</a>. It expresses satiety in <a onClick="return mV(\'Isa\',44,16);">Isa 44:16</a>; and represents the neighing of a horse in <a onClick="return mV(\'Job\',39,25);">Job 39:25</a>.<P>(4) hoy, expresses grief or pain, (<a onClick="return mV(\'Isa\',1,4);">Isa 1:4</a>; <a onClick="return mV(\'Jer\',22,18);">Jer 22:18</a>). In <a onClick="return mV(\'1Ki\',13,30);">1Ki 13:30</a> it is translated "alas!" More frequently it is used to indicate that a threat of judgment is to follow (<a onClick="return mV(\'Isa\',10,5);">Isa 10:5</a>; <a onClick="return mV(\'Isa\',29,1);">29:1</a>); or to direct attention to some important announcement (<a onClick="return mV(\'Isa\',55,1);">Isa 55:1</a>), where the Hebrew word is translated "Ho."<P>(5) Greek oua, in <a onClick="return mV(\'Mar\',15,29);">Mr 15:29</a>, used by those who mocked Jesus, as He hung upon the cross. All of these words are evidently imitative of the natural sounds, which spontaneously give expression to these emotions of complaint, grief, pain, exultation, etc.``109';
isbe[291]='Ahab`a\'-hab (\'ach\'abh, Assyrian a-cha-ab-bu; Septuagint Achaab, but <a onClick="return mV(\'Jer\',29,21);">Jer 29:21</a>f., Achiab, which, in analogy with\'-h-y- m-l-k, (\')-h-y-\'-l, etc., indicates an original \'achi\'abh, meaning "the father is my brother"): The compound probably signifies that "the father," referring to God, has been chosen as a brother.<P>1. Ahab\'s Reign:<P>Ahab, son of Omri, the seventh king of Israel, who reigned for twenty-two years, from 876 to 854 (<a onClick="return mV(\'1Ki\',16,28);">1Ki 16:28</a>f.), was one of the strongest and at the same time one of the weakest kings of Israel. With his kingdom he inherited also the traditional enemies of the kingdom, who were no less ready to make trouble for him than for his predecessors. Occupying a critical position at the best, with foes ever ready to take advantage of any momentary weakness, the kingdom, during the reign of Ahab, was compelled to undergo the blighting effects of misfortune, drought and famine. But Ahab, equal to the occasion, was clever enough to win the admiration and respect of friend and foe, strengthening the kingdom without and within. Many of the evils of his reign, which a stronger nature might have overcome, were incident to the measures that he took for strengthening the kingdom.<P>2. His Foreign Policy:<P>In the days of David and Solomon a beneficial commercial intercourse existed between the Hebrews and the Phoenicians. Ahab, recognizing the advantages that would accrue to his kingdom from an alliance with the foremost commercial nation of his time, renewed the old relations with the Phoenicians and cemented them by his marriage with Jezebel, daughter of Ethbaal, king of Tyre (the Ithobalos, priest of Astarte mentioned by Meander). He next turns his attention to the establishment of peaceful and friendly relations with the kindred and neighboring kingdom of Judah. For the first time since the division of the kingdoms the hereditary internecine quarrels are forgotten, "and Jehoshaphat," the good king of Judah, "made peace with the king of Israel." This alliance, too, was sealed by a marriage relationship, Jehoram, the crown-prince of Judah, being united in marriage with the princess Athaliah, daughter of Ahab.<P>Perhaps some additional light is thrown upon Ahab\'s foreign policy by his treatment of Benhadad, king of Damascus. An opportunity was given to crush to dust the threatening power of Syria. But when Benhadad in the garb of a suppliant was compelled to sue for his life, Ahab received into kindly as his brother, and although denounced by the prophets for his leniency, spared his enemy and allowed him to depart on the condition that he would restore the cities captured from Omri, and concede certain "streets" in Damascus as a quarter for Israelite residents. No doubt Ahab thought that a king won as a friend by kindness might be of greater service to Israel than a hostile nation, made still more hostile, by having its king put to death. Whatever Ahab\'s motives may have been, these hereditary foes really fought side by side against the common enemy, the king of Assyria, in the battle at Karkar on the Orontes in the year 854, as is proved by the inscription on the monolith of Shalmaneser II, king of Assyria.<P>3. His Religious Policy:<P>Ahab\'s far-sighted foreign policy was the antithesis of his short-sighted religious policy. Through his alliance with Phoenicia he not only set in motion the currents of commerce with Tyre, but invited Phoenician religion as well. The worship of Yahweh by means of the golden calves of Jeroboam appeared antiquated to him. Baal, the god of Tyre, the proud mistress of the seas and the possessor of dazzling wealth, was to have an equal place with Yahweh, the God of Israel. Accordingly he built in Samara a temple to Baal and in it erected an altar to that god, and at the side of the altar a pole to Asherab (<a onClick="return mV(\'1Ki\',16,32,33);">1Ki 16:32-33</a>). On the other hand he tried to serve Yahweh by naming his children in his honor—Ahaziah ("Yah holds"), Jehoram ("Yah is high"), and Athaliah ("Yah is strong"). However, Ahab failed to realize that while a coalition of nations might be advantageous, a syncretism of their religions would be disastrous. He failed to apprehend the full meaning of the principle, "Yahweh alone is the God of Israel." In Jezebel, his Phoenician wife, Ahab found a champion of the foreign culture, who was as imperious and able as she was vindictive and unscrupulous. She was the patron of the prophets of Baal and of the devotees of Asherab (<a onClick="return mV(\'1Ki\',18,19,20);">1Ki 18:19-20</a>; <a onClick="return mV(\'1Ki\',19,1,2);">19:1-2</a>) At her instigation the altars of Yahweh were torn down. She inaugurated the first great religious persecution of the church, killing off the prophets of Yahweh with the sword. In all this she aimed at more than a syncretism of the two religions; she planned to destroy the religion of Yahweh root and branch and put that of Baal in its place. In this Ahab did not oppose her, but is guilty of conniving at the policy of his unprincipled wife, if not of heartily concurring in it.<P>4. The Murder of Naboth:<P>Wrong religious principles have their counterpart in false ethical ideals and immoral civil acts. Ahab, as a worshipper of Baal, not only introduced a false religion, but false social ideals as well. The royal residence was in Jezreel, which had probably risen in importance through his alliance with Phoenicia. Close to the royal palace was a vineyard (<a onClick="return mV(\'1Ki\',21,1);">1Ki 21:1</a>) owned by Naboth, a native of Jezreel. This piece of ground was coveted by Ahab for a vegetable garden. He demanded therefore that Naboth should sell it to into or exchange it for a better piece of land. Naboth declined the offer. Ahab, a Hebrew, knowing the laws of the land, was stung by the refusal and went home greatly displeased. Jezebel, however, had neither religious scruples nor any regard for the civil laws of the Hebrews. Accordingly she planned a high-handed crime to gratify the whim of Ahab. In the name and by the authority of the king she had Naboth falsely accused of blasphemy against God and the king, and had him stoned to death by the local authorities. The horror created by this judicial murder probably did as much to finally overthrow the house of Omri as did the favor shown to the Tyrian Baal.<P>5. Ahab and Elijah:<P>Neither religious rights nor civil liberties can be trampled under foot without Divine retribution. The attempt to do so calls forth an awakened and quickened conscience, imperatively demanding that the right be done. Like an accusing conscience, Elijah appeared before Ahab. His very name ("my God is Yah") inspired awe. "As Yahweh, the God of Israel liveth, before whom I stand, there shall not be dew nor rain these years," was the conscience- troubling message left on the mind of Ahab for more than three years. On Elijah\'s reappearance, Ahab greets into as the troubler of Israel. Elijah calmly reforms him that the king\'s religious policy has caused the trouble in Israel. The proof for it is to be furnished on Mount Carmel. Ahab does the bidding of Elijah. The people shall know whom to serve. Baal is silent. Yahweh answers with fire. A torrent of rain ends the drought. The victory belongs to Yahweh.<P>Once more Elijah\'s indignation flashes against the house of Ahab. The judicial murder of Naboth calls it forth. The civil rights of the nation must be protected. Ahab has sold himself to do evil in the sight of Yahweh. Therefore Ahab\'s house shall fall. Jezebel\'s carcass shall be eaten by dogs; the king\'s posterity shall be cut off; the dogs of the city or the fowls of the air shall eat their bodies (<a onClick="return mV(\'1Ki\',21,\'20-26\');">1Ki 21:20-26</a>). Like thunderbolts the words of Elijah strike home. Ahab "fasted, and lay in sackcloth, and went softly." But the die was cast. Yahweh is vindicated. Never again, in the history of Israel can Baal, the inspirer of injustice, claim a place at the side of Yahweh, the God of righteousness.<P>6. Ahab\'s Building Operations:<P>In common with oriental monarchs, Ahab displayed a taste for architecture, stimulated, no doubt, by Phoenician influence. Large building operations were undertaken in Samaria (<a onClick="return mV(\'1Ki\',16,32);">1Ki 16:32</a>; <a onClick="return mV(\'2Ki\',10,21);">2Ki 10:21</a>). Solomon had an ivory throne, but Ahab built for himself, in Jezreel, a palace adorned with woodwork and inlaid with ivory (<a onClick="return mV(\'1Ki\',21,1);">1Ki 21:1</a>; <a onClick="return mV(\'1Ki\',22,39);">22:39</a>). Perhaps Amos, one hundred years later, refers to the work of Ahab when he says, "The houses of ivory shall perish" (<a onClick="return mV(\'Amo\',3,15);">Am 3:15</a>). In his day Hiel of Bethel undertook to rebuild Jericho, notwithstanding the curse of Joshua (<a onClick="return mV(\'1Ki\',16,33,34);">1Ki 16:33-34</a>). Many cities were built during his reign (<a onClick="return mV(\'1Ki\',22,39);">1Ki 22:39</a>).<P>7. Ahab\'s Military Career:<P>Ahab was not only a splendor-loving monarch, but a great military leader as well. He no doubt began his military policy by fortifying the cities of Israel (<a onClick="return mV(\'1Ki\',16,34);">1Ki 16:34</a>; <a onClick="return mV(\'1Ki\',22,39);">22:39</a>). Benhadad (the Dadidri of the Assyrian annals; Hadadezer and Barhadad are Hebrew, Aramaic and Arabic forms of the same name), the king of Syria, whose vassals the kings of Israel had been (<a onClick="return mV(\'1Ki\',15,19);">1Ki 15:19</a>), promptly besieges Samaria, and sends Ahab an insulting message. Ahab replies, "Let not him that girdeth on his armor boast himself as he that putteth it off." At the advice of a prophet of Yahweh, Ahab, with 7,000 men under 232 leaders, inflicts a crushing defeat upon Benhadad and his 32 feudal kings, who had resigned themselves to a drunken carousal (<a onClick="return mV(\'1Ki\',20,\'1-\');">1Ki 20</a>-<a onClick="return mV(\'1Ki\',21,\'1-\');">21</a>).<P>In the following year, the Syrian army, in spite of its overwhelming superiority, meets another defeat at the hands of Ahab in the valley, near Aphek. On condition that Benhadad restore all Israelite territory and grant the Hebrews certain rights in Damascus, Ahab spares his life to the great indignation of the prophet (<a onClick="return mV(\'1Ki\',20,22);">1Ki 20:22</a>f.). In the year 854, Ahab with 2,000 chariots and 10,000 men, fights shoulder to shoulder with Benhadad against Shalmaneser II, king of Assyria. At Karkar, on the Orontes, Benhadad, with his allied forces, suffered an overwhelming defeat (COT, II, i, 183f).<P>Perhaps Benhadad blamed Ahab for the defeat. At any rate he fails to keep his promise to Ahab (<a onClick="return mV(\'1Ki\',22,3);">1Ki 22:3</a>; <a onClick="return mV(\'1Ki\',20,34);">20:34</a>). Lured by false prophets, but against the dramatic warning of Micaiah, Ahab is led to take up the gauntlet against Syria once more. His friend, Jehoshaphat, king of Judah, joins him in the conflict. For the first time since the days of David all Israel and Judah stand united against the common foe.<P>8. Ahab\'s Death:<P>Possibly the warning of Micaiah gave Ahab a premonition that this would be has last fight. He enters the battle in disguise, but in vain. An arrow, shot at random, inflicts a mortal wound. With the fortitude of a hero, in order to avoid a panic, Ahab remains in his chariot all day and dies at sunset. His body is taken to Samaria for burial. A great king had died, and the kingdom declined rapidly after his death. He had failed to comprehend the greatness of Yahweh; he failed to stand for the highest justice, and his sins are visited upon has posterity (<a onClick="return mV(\'1Ki\',22,29);">1Ki 22:29</a>f.).<P>9. Ahab and Archaeology:<P>(1) The Moabite Stone<P>The Moabite Stone (see <a href="./study/isbe/search.html?string=MOABITE+STONE">MOABITE STONE</a>) bears testimony (lines 7, 8) that Omri and his son (Ahab) ruled over the land of Mehdeba for forty years. When Ahab was occupied with the Syriac wars, Moab rose in insurrection. Mesha informs us in an exaggerated manner that "Israel perished with an everlasting destruction." Mesha recognizes Yahweh as the God of Israel.<P>(2) The Monolith of Shalmaneser II<P>The Monolith of Shalmaneser II (Brit Mus; see <a href="./study/isbe/search.html?string=ASSYRIA">ASSYRIA</a>) informs us that in 854 Shalmaneser II came in conflict with the kingdom of Hamath, and that Benhadad II with Ahab of Israel and others formed a confederacy to resist the Assyrian advance. The forces of the coalition were defeated at Karkar.<P>(3) Recent Excavations.<P>Under the direction of Harvard University, excavations have been carried on in Samaria since 1908. In 1909 remains of a Hebrew palace were found. In this palace two grades of construction have been detected. The explorers suggest that they have found the palace of Omri, enlarged and improved by Ahab. This may be the "ivory house" built by Ahab. In August,1910,about 75 potsherds were found in a building adjacent to Ahab\'s palace containing writing. The script is the same as that of the Moabite Stone, the words being divided by ink spots. These ostraca seem to be labels attached to jars kept in a room adjoining Ahab\'s palace. One of them reads, "In the ninth year. From Shaphtan. For Ba\'al-zamar. A jar of old wine." Another reads, "Wine of the vineyard of the Tell." These readings remind one of Naboth\'s vineyard. In another room not far from where the ostraca were found, "was found an alabaster vase inscribed with the name of Ahab\'s contemporary, Osorkon II of Egypt." Many proper names are found on the ostraca, which have their equivalent in the Old Testament. It is claimed that the writing is far greater than all other ancient Hebrew writing yet known. Perhaps with the publication of all these writings we may expect much light upon Ahab\'s reign. (Harvard Theological Review, January, 1909, April, 1910, January, 1911; Sunday School Times, January 7, 1911; The Jewish Chronicle, January 27, 1911.)`<a href="./study/isbe/search.html?string=OSTRACA">OSTRACA</a>`125';
isbe[292]='Ahab and Zedekiah`a\'-hab, zed-e-ki\'-a (\'ach\'abh, "uncle"; tsidhqiyahu, "Yahweh is my righteousness"): Ahab, son of Kolaiah, and Zedekiah, son of Maaseiah, were two prophets against whom Jeremiah uttered an oracle for prophesying falsely in the name of Yahweh, and for immoral conduct. They should be delivered over to Nebuchadrezzar and be slain, and the captives of Judah that were in Babylon should take up the curse concerning them. "Yahweh make thee like Zedekiah and like Ahab, whom the King of Babylon roasted in the fire" (<a onClick="return mV(\'Jer\',29,21);">Jer 29:21</a>f.).``78';
isbe[293]='Aharah`a\'-har-a, a-har\'-a (\'achrach; A, Aara; B, Iaphael, "brother of Rach," or, a brother\'s follower, though some regard it as a textual corruption for Ahiram): A son of Benjamin (<a onClick="return mV(\'1Ch\',8,1);">1Ch 8:1</a>).`<a href="./study/isbe/300.html?toc=321">AHIRAM</a>`1';
isbe[294]='Aharahel`a-har\'-hel (\'acharchel, "brother of Rachel"; Septuagint adelphou Rechab, "brother of Rechab"): A son of Harum of the tribe of Judah (<a onClick="return mV(\'1Ch\',4,8);">1Ch 4:8</a>).``1';
isbe[295]='Ahasai`a\'-ha-si, a-ha\'-si.`<a href="./study/isbe/300.html?toc=341">AHZAI</a>`1';
isbe[296]='Ahasbai`a-has\'-bi (\'achacbay, "blooming"): The father of Eliphelet, a Maacathite, a soldier in David\'s army (<a onClick="return mV(\'2Sa\',23,34);">2Sa 23:34</a>). He was either a native of Abel-beth-maacah (<a onClick="return mV(\'2Sa\',20,14);">2Sa 20:14</a>) or, more probably, of Maacah in Syria (<a onClick="return mV(\'2Sa\',10,6);">2Sa 10:6</a>). The list in <a onClick="return mV(\'1Ch\',11,35,36);">1Ch 11:35-36</a> gives different names entirely. Here we have Ur and Hepher, which simply show that the text is corrupt in one or both places.``1';
isbe[297]='AHASUERUS or ASSEURUS`a-haz-u-e\'-rus:<p>(Septuagint Assoueros, but in Tobit 14:15 Asueros; the Latin form of the Hebrew \'achashwerosh, a name better known in its ordinary Greek form of Xerxes): It was the name of two, or perhaps of three kings mentioned in the canonical, or apocryphal, books of the Old Testament.<P>1. In Esther:<P>There seems to be little reasonable doubt, that we should identify the Ahasuerus of Esther with the well-known Xerxes, who reigned over Persia from 485 to 465 BC, and who made the great expedition against Greece that culminated in the defeat of the Persian forces at Salamis and Plataea. If Esther be taken as equivalent to Ishtar, it may well be the same as the Amestris of Herodotus, which in Babylonian would be Ammi-Ishtar, or Ummi-Ishtar. Amestris is said to have been the daughter of Otanes, a distinguished general of Xerxes, and the grand-daughter of Sisamnes, a notorious judge, who was put to death with great cruelty by the king because of malfeasance in office. Sisamnes may be in Babylonian Shamash-ammanu-(shallim). If he were the brother and Otanes the nephew of Mordecai, we can easily account for the ease with which the latter and has ward Esther, were advanced and confirmed in their Positions at the court, of Xerxes.<P>2. In Ezra:<P>An Ahasuerus is mentioned in <a onClick="return mV(\'Ezr\',4,6);">Ezr 4:6</a>, as one to whom some persons unnamed wrote an accusation against Judah and Jerusalem. Ewald and others have suggested that this Ahasuerus was Cambyses, the son and successor of Cyrus. It seems to be more probable that Xerxes, the son and successor of Darius Hystaspis, is meant: first, because in the following verse Artaxerxes, the son and successor of Xerxes, is mentioned; and secondly, because we have no evidence whatever that Cambyses was ever called Ahasuerus, whereas there is absolute certainty that the Pets Khshayarsha, the Hebrew \'achashwerosh, the Greek Assoueros or Xerxes, and the Latin Ahasuerus, are the exact equivalents of one another.<P>3. In Tobit:<P>In the apocryphal book of Tobit (14:15, the King James Version) it is said that before Tobias died he heard of the destruction of Nineveh, which was taken by Nabuchodonosor and Assuerus. This Assuerus can have been no other than Cyaxares, who according to Herodotus (i.196) took Nineveh and reduced the Assyrians into subjection, with the exception of the Babylonian district. As we shall see below, he was probably the same as the Ahasuerus of <a onClick="return mV(\'Dan\',9,1);">Da 9:1</a>. The phrase "which was taken by Nabuchodonosor and Assuerus" is not found in the Syriac version of Tobit.<P>4. In Daniel:<P>An Ahasuerus is said in <a onClick="return mV(\'Dan\',9,1);">Da 9:1</a> to have been the father of Darius the Mede, and to have been of the seed of the Medes. It is probable that this Ahasuerus is the same as the Uvakhshatara of the Persian recension of the Behistun inscription, which in the Babylonian is Umaku\'ishtar, in the Susian Makishtarra, and in Herod Cyaxares. It will be noted that both the Greek Cyaxares and the Hebrew Akhashwerosh omit the preformative uwa- and the "t" of the Persian form Uvakhshatara. That this Median king had sons living in the time of Cyrus is shown by the fact that two rebel aspirants to the throne in the time of Darius Hystaspis claimed to be his sons, to wit: Fravartish, a Median, who lied saying, "I am Khshathrita of the family of Uvakhshatara" (Behistun Inscr, col. II, v); and Citrantakhma, who said, "I am king in Sagartia of the family of Uvakhshatara" (id, II, xiv). If we accept the identification of Gubaru with Darius the Mede, then the latter may well have been another of his sons, at first a sub-king to Astyages the Scythian, as he was later to Cyrus the Persian.``196';
isbe[298]='Ahava`a-ha\'-va (\'ahawa\'): The river in Babylonia on the banks of which Ezra gathered together the Jews who accompanied him to Jerusalem. At this rendezvous the company encamped for three days to make preparation for the difficult and dangerous journey (<a onClick="return mV(\'Ezr\',8,15);">Ezr 8:15</a>f.). On reviewing the people and the priests Ezra found no Levites among them; he therefore sent to Iddo, "the chief at the place Casiphia," a request for ministers for the temple. A number of Levites with 220 Nethinim returned to the rendezvous with the deputation. Ezra had expressed to the king his faith in the protection of God; being, therefore, ashamed to ask for a military escort he proclaimed a fast to seek of God "a straight way." To 12 priests Ezra assigned the care of the offering for the temple in Jerusalem. When all was ready the company "departed from the river Ahava," and journeyed in safety to Jerusalem.<P>This river, apparently called after a town or district toward which it flowed (<a onClick="return mV(\'Ezr\',8,15);">Ezr 8:15</a>), remains unidentified, though many conjectures have been made. Rawlinson thinks it is the "Is" of Herodotus (i.79), now called "Hit," which flowed past a town of the same name in the Euphrates basin, 8 days\' journey from Babylon. Some identify the district with "Ivvah" (<a onClick="return mV(\'2Ki\',18,34);">2Ki 18:34</a>, etc.). Most probably, however, this was one of the numerous canals which intersected Babylonia, flowing from the Euphrates toward a town or district "Ahava." If so, identification is impossible.``78';
isbe[299]='Ahaz`a\'-haz (\'achaz, "he has grasped," <a onClick="return mV(\'2Ki\',16,\'1\');">2Ki 16</a>; <a onClick="return mV(\'2Ch\',28,\'1-\');">2Ch 28</a>; <a onClick="return mV(\'Isa\',7,10);">Isa 7:10</a>f.; Achaz).<P>1. Name:<P>The name is the same as Jehoahaz; hence appears on Tiglath-pileser\'s Assyrian inscription of 732 BC as Ia-u-ha-zi. The sacred historians may have dropped the first part of the name in consequence of the character of the king.<P>2. The Accession:<P>Ahaz was the son of Jotham, king of Judah. He succeeded to the throne at the age of 20 years (according to another reading 25). The chronology of his reign is difficult, as his son Hezekiah is stated to have been 25 years of age when he began to reign 16 years after (<a onClick="return mV(\'2Ki\',18,2);">2Ki 18:2</a>). If the accession of Ahaz be placed as early as 743 BC, his grandfather Uzziah, long unable to perform the functions of his office on account of his leprosy (<a onClick="return mV(\'2Ch\',26,21);">2Ch 26:21</a>), must still have been alive. (Others date Ahaz later, when Uzziah, for whom Jotham had acted as regent, was already dead.)<P>3. Early Idolatries:<P>Although so young, Ahaz seems at once to have struck out an independent course wholly opposed to the religious traditions of his nation. His first steps in this direction were the causing to be made and circulated of molten images of the Baalim, and the revival in the valley of Hinnom, south of the city, of the abominations of the worship of Moloch (<a onClick="return mV(\'2Ch\',28,2,3);">2Ch 28:2-3</a>). He is declared to have made his own son "pass through the fire" (<a onClick="return mV(\'2Ki\',16,3);">2Ki 16:3</a>); the chronicler puts it even more strongly: he "burnt his children in the fire" (<a onClick="return mV(\'2Ch\',28,3);">2Ch 28:3</a>). Other acts of idolatry were to follow.<P>4. Peril from Syria and Israel:<P>The kingdom of Judah was at this time in serious peril. Rezin, king of Damascus, and Pekah, king of Samaria, had already, in the days of Jotham, begun to harass Judah (<a onClick="return mV(\'2Ki\',15,37);">2Ki 15:37</a>); now a conspiracy was formed to dethrone the young Ahaz, and set upon the throne a certain "son of Tabeel" (<a onClick="return mV(\'Isa\',7,6);">Isa 7:6</a>). An advance of the two kings was made against Jerusalem, although without success (<a onClick="return mV(\'2Ki\',16,5);">2Ki 16:5</a>; <a onClick="return mV(\'Isa\',7,1);">Isa 7:1</a>); the Jews were expelled from Elath (<a onClick="return mV(\'2Ki\',16,6);">2Ki 16:6</a>), and the country was ravaged, and large numbers taken captive (<a onClick="return mV(\'2Ch\',28,5);">2Ch 28:5</a>f.). Consternation was universal. The heart of Ahaz "trembled, and the heart of his people, as the trees of the forest tremble with the wind" (<a onClick="return mV(\'Isa\',7,2);">Isa 7:2</a>). In his extremity Ahaz appealed to the king of Assyria for help (<a onClick="return mV(\'2Ki\',16,7);">2Ki 16:7</a>; <a onClick="return mV(\'2Ch\',28,16);">2Ch 28:16</a>).<P>5. Isaiah\'s Messages to the King:<P>Amid the general alarm and perturbation, the one man untouched by it in Jerusalem was the prophet Isaiah. Undismayed, Isaiah set himself, apparently single-handed, to turn the tide of public opinion from the channel in which it was running, the seeking of aid from Assyria. His appeal was to both king and people. By Divine direction, meeting Ahaz "at the end of the conduit of the upper pool, in the highway of the fuller\'s field," he bade him have no fear of "these two tails of smoking firebrands," Rezin and Pekah, for, like dying torches, they would speedily be extinguished (<a onClick="return mV(\'Isa\',7,3);">Isa 7:3</a>f.). If he would not believe this he would not be established (<a onClick="return mV(\'Isa\',7,9);">Isa 7:9</a>). Failing to win the young king\'s confidence, Isaiah was sent a second time, with the offer from Yahweh of any sign Ahaz chose to ask, "either in the depth, or in the height above," in attestation of the truth of the Divine word. The frivolous monarch refused the arbitrament on the hypocritical ground, "I will not ask, neither will I tempt Yahweh" (<a onClick="return mV(\'Isa\',7,\'10-12\');">Isa 7:10-12</a>). Possibly his ambassadors were already dispatched to the Assyrian king. Whenever they went, they took with them a large subsidy with which to buy that ruler\'s favor (<a onClick="return mV(\'2Ki\',16,8);">2Ki 16:8</a>). It was on this occasion that Isaiah, in reply to Ahaz, gave the reassuring prophecy of Immanuel (<a onClick="return mV(\'Isa\',7,13);">Isa 7:13</a>f.).<P>6. Isaiah\'s Tablet:<P>As respects the people, Isaiah was directed to exhibit on "a great tablet" the words "For Maher-shalal-hash-baz" ("swift the spoil, speedy the prey"). This was attested by two witnesses, one of whom was Urijah, the high priest. It was a solemn testimony that, without any action on the part of Judah, "the riches of Damascus and the spoil of Samaria shall be carried away before the king of Assyria" (<a onClick="return mV(\'Isa\',8,\'1-4\');">Isa 8:1-4</a>).<P>7. Fall of Damascus and Its Results:<P>It was as the prophet had foretold. Damascus fell, Rezin was killed (<a onClick="return mV(\'2Ki\',16,9);">2Ki 16:9</a>), and Israel was raided (<a onClick="return mV(\'2Ki\',15,29);">2Ki 15:29</a>). The action brought temporary relief to Judah, but had the effect of placing her under the heel of Assyria. Everyone then living knew that there could be no equal alliance between Judah and Assyria, and that the request for help, accompanied by the message, "I am thy servant" (<a onClick="return mV(\'2Ki\',16,7,8);">2Ki 16:7-8</a>) and by "presents" of gold and silver, meant the submission of Judah and the annual payment of a heavy tribute. Had Isaiah\'s counsel been followed, Tiglath-pileser would probably, in his own interests, have been compelled to crush the coalition, and Judah would have retained her freedom.<P>8. Sun-Dial of Ahaz:<P>The political storm having blown over for the present, with the final loss of the important port of Elath on the Red Sea (<a onClick="return mV(\'2Ki\',16,6);">2Ki 16:6</a>), Ahaz turned his attention to more congenial pursuits. The king was somewhat of a dilettante in matters of art, and he set up a sun-dial, which seems to have consisted of a series of steps arranged round a short pillar, the time being indicated by the position of the shadow on the steps (compare <a onClick="return mV(\'2Ki\',20,\'9-11\');">2Ki 20:9-11</a>; <a onClick="return mV(\'Isa\',38,8);">Isa 38:8</a>). As it is regarded as possible for the shadow to return 10 steps, it is clear that each step did not mark an hour of the day, but some smaller period.<P>9. The Lavers and Brazen Sea:<P>Another act of the king was to remove from the elaborate ornamental bases on which they had stood (compare <a onClick="return mV(\'1Ki\',7,\'27-39\');">1Ki 7:27-39</a>), the ten layers of Solomon, and also to remove Solomon\'s molten sea from the 12 brazen bulls which supported it (compare <a onClick="return mV(\'1Ki\',7,\'23-26\');">1Ki 7:23-26</a>), the sea being placed upon a raised platform or pavement (<a onClick="return mV(\'2Ki\',16,17);">2Ki 16:17</a>). From <a onClick="return mV(\'Jer\',52,20);">Jer 52:20</a>, where the prophet sees "the 12 brazen bulls that were under the bases," it has been conjectured that the object of the change may have been to transfer the layers to the backs of the bulls.<P>10. The Damascus Altar:<P>To this was added a yet more daring act of impiety. In 732 Ahaz was, with other vassal princes, summoned to Damascus to pay homage to Tiglath-pileser (<a onClick="return mV(\'2Ki\',16,10);">2Ki 16:10</a>; his name appears in the Assyrian inscription). There he saw a heathen altar of fanciful pattern, which greatly pleased him. A model of this was sent to Urijah the high priest, with instructions to have an enlarged copy of it placed in the temple court. On the king\'s return to Jerusalem, he sacrificed at the new altar, but, not satisfied with its position, gave orders for a change. The altar had apparently been placed on the east side of the old altar; directions were now given for the brazen altar to be moved to the north, and the Damascus altar to be placed in line with it, in front of the temple giving both equal honor. Orders were further given to Urijah that the customary sacrifices should be offered on the new altar, now called "the great altar," while the king reserved the brazen altar for himself "to inquire by" (<a onClick="return mV(\'2Ki\',16,15);">2Ki 16:15</a>).<P>11. Further Impieties:<P>Even this did not exhaust the royal innovations. We learn from a later notice that the doors of the temple porch were shut, that the golden candlestick was not lighted, that the offering of incense was not made, and other solemnities were suspended (<a onClick="return mV(\'2Ch\',29,7);">2Ch 29:7</a>). It is not improbable that it was Ahaz who set up \'the horses of the sun\' mentioned in <a onClick="return mV(\'2Ki\',23,11);">2Ki 23:11</a>, and gave them accommodation in the precincts of the temple. He certainly built the "altars...on the roof of the upper chamber of Ahaz," perhaps above the porch of the temple, for the adoration of the heavenly bodies (verse <a onClick="return mV(\'2Ki\',23,12);">12</a>). Many other idolatries and acts of national apostasy are related regarding him (<a onClick="return mV(\'2Ch\',28,22);">2Ch 28:22</a>f.).<P>12. Recurrence of Hostilities:<P>In the later years of his unhappy reign there was a recurrence of hostilities with the inhabitants of Philistia and Edom, this time with disaster to Judah (see the list of places lost in <a onClick="return mV(\'2Ch\',28,18,19);">2Ch 28:18-19</a>). New appeal was made to Tiglath-pileser, whose subject Ahaz, now was, and costly presents were sent from the temple, the royal palace, and even the houses of the princes of Judah, but without avail (<a onClick="return mV(\'2Ch\',28,\'19-21\');">2Ch 28:19-21</a>). The Assyrian \'distressed\' Ahaz, but rendered no assistance. In his trouble the wicked king only "trespassed yet more" (<a onClick="return mV(\'2Ch\',28,22);">2Ch 28:22</a>).<P>13. Death of Ahaz:<P>Ahaz died in 728, after 16 years of misused power. The exultation with which the event was regarded is reflected in Isaiah\'s little prophecy written "in the year that King Ahaz died" (<a onClick="return mV(\'Isa\',14,\'28-32\');">Isa 14:28-32</a>). The statement in <a onClick="return mV(\'2Ki\',16,20);">2Ki 16:20</a> that Ahaz "was buried with his fathers in the city of David" is to be understood in the light of <a onClick="return mV(\'2Ch\',28,27);">2Ch 28:27</a>, that he was buried in Jerusalem, but that his body was not laid in the sepulchers of the kings of Israel. His name appears in the royal genealogies in <a onClick="return mV(\'1Ch\',3,13);">1Ch 3:13</a> and <a onClick="return mV(\'Mat\',1,9);">Mt 1:9</a>.``17';
