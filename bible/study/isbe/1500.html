isbe = [];

isbe[1501]='Bildad`bil\'-dad (bildadh, "Bel has loved"): The second of the three friends of Job who, coming from distant regions, make an appointment together to condole with and comfort him in his affliction (<a onClick="return mV(\'Job\',2,11);">Job 2:11</a>). He is from Shuah, an unknown place somewhere in the countries east and southeast of Palestine (or the designation Shuhite may be intended to refer to his ancestor Shuah, one of Abraham\'s sons by Keturah, <a onClick="return mV(\'Gen\',25,2);">Ge 25:2</a>), and from his name (compounded with Bel, the name of a Babylonian deity) would seem to represent the wisdom of the distant East. His three speeches are contained in <a onClick="return mV(\'Job\',8,\'1-\');">Job 8</a>; <a onClick="return mV(\'Job\',18,\'1-\');">18</a>; For substance they are largely an echo of what Eliphaz has maintained, but charged with somewhat increased vehemence (compare <a onClick="return mV(\'Job\',8,2);">Job 8:2</a>; <a onClick="return mV(\'Job\',18,3,4);">18:3-4</a>) because he deems Job\'s words so impious and wrathful. He is the first to attribute Job\'s calamity to actual wickedness; but he gets at it indirectly by accusing his children (who were destroyed, <a onClick="return mV(\'Job\',1,19);">Job 1:19</a>) of sin to warrant their punishment (<a onClick="return mV(\'Job\',8,4);">Job 8:4</a>). For his contribution to the discussion he appeals to tradition (<a onClick="return mV(\'Job\',8,\'8-10\');">Job 8:8-10</a>), and taking Eliphaz\' cue of cause and effect (<a onClick="return mV(\'Job\',8,11);">Job 8:11</a>) he gives, evidently from the literary stores of wisdom, a description of the precarious state of the wicked, to which he contrasts, with whatever implication it involves, the felicitous state of the righteous (<a onClick="return mV(\'Job\',8,\'11-22\');">Job 8:11-22</a>). His second speech is an intensified description of the wicked man\'s woes, made as if to match Job\'s description of his own desperate case (compare <a onClick="return mV(\'Job\',18,\'5-21\');">Job 18:5-21</a> with <a onClick="return mV(\'Job\',16,\'6-22\');">Job 16:6-22</a>), thus tacitly identifying Job with the reprobate wicked. His third speech (<a onClick="return mV(\'Job\',25,\'1-\');">Job 25</a>), which is the last utterance of the friends, is brief, subdued in tone, and for substance is a kind of Parthian shot, reiterating Eliphaz\' depravity idea, the doctrine that dies hardest. This speech marks the final silencing of the friends.``66';
isbe[1502]='Bileam`bil\'-e-am (bil\'am; Iblaam): A town in the territory of Manasseh assigned to the Kohathite Levites (<a onClick="return mV(\'1Ch\',6,70);">1Ch 6:70</a>), probably the same as Ibleam (<a onClick="return mV(\'Jos\',17,11);">Jos 17:11</a>, etc.), and identical with the modern Bel\'ameh, half a mile south of Jenin.``1';
isbe[1503]='Bilgah; Bilgai`bil\'-ga bil\'-ga-i (bilgah; bilgay, "cheerfulness"): A priest or priestly family in the time of the Return (<a onClick="return mV(\'Neh\',12,5);">Ne 12:5</a>), and (under the form of "Bilgai," <a onClick="return mV(\'Neh\',10,8);">Ne 10:8</a>) in the time of Nehemiah. According to <a onClick="return mV(\'1Ch\',24,14);">1Ch 24:14</a>, Bilgah is the 15th of the 24 divisions of the priests who officiated in the Temple. In the Septuagint, the names read Belgai, Belga and Balgas. The traditional explanation of the name is "rejuvenation"; modern exegetes explain it as "cheerfulness."``1';
isbe[1504]='Bilhah (1)`bil\'-ha (person) (bilhah; Balla): A slave girl whom Laban gave to Rachel (<a onClick="return mV(\'Gen\',29,29);">Ge 29:29</a>), and whom the latter gave to Jacob as a concubine (<a onClick="return mV(\'Gen\',30,3,4);">Ge 30:3-4</a>); the mother of Dan and Naphtali (<a onClick="return mV(\'Gen\',30,4,7);">Ge 30:4, 7</a>; <a onClick="return mV(\'Gen\',35,25);">35:25</a>; <a onClick="return mV(\'Gen\',46,25);">46:25</a>; <a onClick="return mV(\'1Ch\',7,13);">1Ch 7:13</a>); guilty of incest with Reuben (<a onClick="return mV(\'Gen\',35,22);">Ge 35:22</a>).``1';
isbe[1505]='Bilhah (2)`bil\'-ha (place) (bilhah; Codex Alexandrinus, Balaa; Codex Vaticanus, Abella): A city in Simeon (<a onClick="return mV(\'1Ch\',4,29);">1Ch 4:29</a>) = Baalah (<a onClick="return mV(\'Jos\',15,29);">Jos 15:29</a>), Balah (<a onClick="return mV(\'Jos\',19,3);">Jos 19:3</a>), and Baalath (<a onClick="return mV(\'Jos\',19,44);">Jos 19:44</a>). Unidentified.``1';
isbe[1506]='Bilhan`bil\'-han (bilhan; Balaan):<P>(1) A Horite chief, son of Ezer (<a onClick="return mV(\'Gen\',36,27);">Ge 36:27</a>; <a onClick="return mV(\'1Ch\',1,42);">1Ch 1:42</a>).<P>(2) A descendant of Benjamin, son of Jediael, father of seven sons who were heads of houses in their tribes (<a onClick="return mV(\'1Ch\',7,10);">1Ch 7:10</a>).``1';
isbe[1507]='Bill, Bond`<P>(1) In the parable of the Unjust Steward (<a onClick="return mV(\'Luk\',16,6);">Lu 16:6</a>f) "bill," the King James Version, better "bond," the Revised Version (British and American), is used to translate the Greek grammata, which is the equivalent of the contemporary Hebrew legal term shetar, "writing." This "writing," in the usage of the times, was an acknowledgment of the taking over or receiving of goods or money that had to be written and signed by the debtor himself. (See Babha\' Bathra\' <a onClick="return mV(\'Luk\',10,8);">Lu 10:8</a>.) Edersheim\'s averment that the Greek word was adopted into the Hebrew (Life and Times of Jesus the Messiah, II, 272), is based, according to competent textual critics, upon a false reading. The Greek, according to Tischendorf, Tregelles, and Westcott and Hort, The New Testament in Greek, is ta grammata, not to gramma (Textus Receptus of the New Testament). The word is indefinite, literally "the letter," and determines nothing involved in controversy.<P>(2) A question much discussed is, Was "the bond" (the Revised Version (British and American)) merely an acknowledgment of debt, or was it an obligation to pay a fixed annual rental from the produce of a farm? Edersheim, for instance, holds the former view, Lightfoot the latter. That the obligation is stated in the parable in kind—wheat and oil—and not in money—seems to bear against the simple debt theory. Edersheim sets down the remissions spoken of as authorized by the steward as amounting in money value to only about 5 British pounds and 25 British pounds respectively, and thinks they represented not a single but an annual payment (compare Kennedy, 1-vol HDB, and Fraser, DCG, article "Bill").<P>(3) Still another question has arisen: Was the old "bond" simply altered, or was a new one substituted for it? Here again Lightfoot and Edersheim are in the controversy and on opposite sides. The alteration of the old bond is suggested though not demanded by the language here, and, moreover, would be, Edersheim thinks, in accordance with the probabilities of the case. Such bonds were usually written, not on vellum or papyrus, but on wax-covered tablets, and so could be easily erased or altered by the stylus with its fiat, thick "eraser" (mocheq).<P>(4) It is probably safe to conclude:<P>(a) that the "bill" or "bond" had to be written and signed by the person assuming the obligation;<P>(b) that it was the only formal or legal evidence of the debt incurred; and<P>(c) that the supervision of the whole transaction belonged of right to "the steward." Should "the steward" conspire with the debtor against the master, the latter, it would appear, would have no check against the fraud.<P>LITERATURE.<P>Lightfoot, Hor. Hebrew, edition L. and T., II, 268-73; Edersheim, Life and Times of Jesus the Messiah, II, 272ff; crit. commentary in the place cited.``47';
isbe[1508]='Bill of Divorcement`di-vors\'-ment.`<a href="./study/isbe/search.html?string=DIVORCE+IN+THE+OLD+TESTAMENT">DIVORCE IN THE OLD TESTAMENT</a>`1';
isbe[1509]='Billow`bil\'-o (gal, "a great rolling wave"): Figuratively, of trouble, "All thy waves and thy billows are gone over me" (<a onClick="return mV(\'Psa\',42,7);">Ps 42:7</a>; compare <a onClick="return mV(\'Jon\',2,3);">Jon 2:3</a>).``1';
isbe[1510]='Bilshan`bil\'-shan (bilshan): An Israelite who returned with Zerubbabel (<a onClick="return mV(\'Ezr\',2,2);">Ezr 2:2</a> = <a onClick="return mV(\'Neh\',7,7);">Ne 7:7</a>). The name may be explained as the "inquirer" (new Hebrew and Aramaic), balash, the ("b" being an abbreviation of ben, as in bidhqar, and bimhal. Bilshan would then be a compound of ben, and lashon. J. Halevy (Revue etudes juives, X, 3)) translates the name "pere de la langue," \'abh lashon. In 1 Esdras 5:8, he is called "Beelsarus," which is akin to the form "Belshar" =" Belshar-uccur" or "O Bel, protect king." Bilshan points to "Belsun," "his lord." The rabbis take Bilshan as a surname to the preceding``197';
isbe[1511]='Bimhal`bim\'-hal (bimhal): A descendant of Asher (<a onClick="return mV(\'1Ch\',7,33);">1Ch 7:33</a>).``1';
isbe[1512]='Bind; Bound`bind (deo): There are a number of Hebrew words used to express this word in its various meanings, \'alam (<a onClick="return mV(\'Gen\',37,7);">Ge 37:7</a>), \'acar (<a onClick="return mV(\'Gen\',42,24);">Ge 42:24</a>), qashar (<a onClick="return mV(\'Deu\',6,8);">De 6:8</a>). It sometimes means "to attach," "to fasten" (<a onClick="return mV(\'Exd\',28,28);">Ex 28:28</a>; <a onClick="return mV(\'Deu\',14,25);">De 14:25</a>). It was used also with reference to an agreement in a judicial sense (<a onClick="return mV(\'Num\',30,2,3);">Nu 30:2-3</a>), or to make one a prisoner (<a onClick="return mV(\'Jdg\',16,10);">Jud 16:10</a>; <a onClick="return mV(\'Psa\',149,8);">Ps 149:8</a>). It means also "to control" (<a onClick="return mV(\'Job\',38,31);">Job 38:31</a>).<P>Figurative: In a figurative sense, to bind heavy and burdensome (extra) so-called religious duties on men (<a onClick="return mV(\'Mat\',23,4);">Mt 23:4</a>). This figurative use of the word in <a onClick="return mV(\'Mat\',16,19);">Mt 16:19</a> and <a onClick="return mV(\'Mat\',18,18);">18:18</a> has given special interest to it. Necessarily certain powers for administration must be conferred on this company of men to carry out the purpose of Christ. That this power was not conferred on Peter alone is evident from the fact that in <a onClick="return mV(\'Mat\',18,18);">Mt 18:18</a> it is conferred on all the apostles. The use of the word in the New Testament is to declare a thing to be binding or obligatory (<a onClick="return mV(\'Jhn\',20,23);">Joh 20:23</a>). In this sense this authority is used by some denominations in the service in preparation for the Lord\'s Supper, in which after the confession of sin by the people the ministers say, "I declare to you who have sincerely repented of your sins and believe on the Lord Jesus Christ the entire forgiveness of your sins." This statement is followed by the further declaration that if any have not so repented God will not forgive them, but will retain them and call them to account. The claim of the church of Rome that these statements of our Lord confer on the priests and bishops, or primarily on the pope, the power to retain or forgive sins, is without historical validity and does violence to the Scriptures.`<a href="./study/isbe/search.html?string=AUTHORITY">AUTHORITY</a>; <a href="./study/isbe/search.html?string=FORGIVENESS">FORGIVENESS</a>; <a href="./study/isbe/search.html?string=PETER">PETER</a>`87';
isbe[1513]='Binea`bin\'-e-a (bin\'ah): A name in the genealogy of Benjamin (<a onClick="return mV(\'1Ch\',8,37);">1Ch 8:37</a> = <a onClick="return mV(\'1Ch\',9,43);">1Ch 9:43</a>).``1';
isbe[1514]='Binnui`bin\'-u-i (binnuy, a proper name, "a building up"):<P>(1) A Levite, living in the time of Ezra (<a onClick="return mV(\'Ezr\',8,33);">Ezr 8:33</a>; <a onClick="return mV(\'Neh\',10,9);">Ne 10:9</a>; <a onClick="return mV(\'Neh\',12,8);">12:8</a>).<P>(2) One of the bene Pachath-mo\'abh who had taken foreign wives (<a onClick="return mV(\'Ezr\',10,30);">Ezr 10:30</a>—Balnuus of 1Esdras 9:31) and one of the bene Bani (<a onClick="return mV(\'Ezr\',10,38);">Ezr 10:38</a>) who had also intermarried.<P>(3) The son of Henadad, who built part of the wall of Jerusalem (<a onClick="return mV(\'Neh\',3,24);">Ne 3:24</a>), and sealed the covenant with Nehemiah (<a onClick="return mV(\'Neh\',10,9);">Ne 10:9</a>). In all probability he is identical with "Bavvai, the son of Henadad" mentioned in <a onClick="return mV(\'Neh\',3,18);">Ne 3:18</a>. "Bavvai" is either a corruption of "Binnui," or is the name of the Levitical house of which Bavvai was the chief representative. Binnui is mentioned in <a onClick="return mV(\'Neh\',10,9);">Ne 10:9</a> as a leading Levite, and, besides, the names in these verses are obviously those of priests and Levites; so the former theory is probably correct.<P>(4) Head of a family who returned with Zerubbabel (<a onClick="return mV(\'Neh\',7,15);">Ne 7:15</a>; <a onClick="return mV(\'Ezr\',2,10);">Ezr 2:10</a>).``197';
isbe[1515]='Bird-Catcher`burd\'-kach-er`<a href="./study/isbe/search.html?string=FOWLER">FOWLER</a>`1';
isbe[1516]='Birds`burds (\'ayiT; Greek variously ta peteina (<a onClick="return mV(\'Mat\',13,4);">Mt 13:4</a>) ta ornea tou ouranou (<a onClick="return mV(\'Rev\',19,17);">Re 19:17</a>) ornis (<a onClick="return mV(\'Mat\',23,37);">Mt 23:37</a>; <a onClick="return mV(\'Luk\',13,34);">Lu 13:34</a>) Latin, avis; Old English "brid"):<P>I. Meaning of the Word.<P>All authorities agree that the exact origin of the word bird, as we apply it to feathered creatures, is unknown.<P>1. In Early Hebrew:<P>The Hebrew \'ayit means to "tear and scratch the face," and in its original form undoubtedly applied to birds of prey. It is probable that no spot of equal size on the face of the globe ever collected such numbers of vultures, eagles and hawks as ancient Palestine. The land was so luxuriant that flocks and herds fed from the face of Nature. In cities, villages, and among tent-dwellers incessant slaughter went on for food, while the heavens must almost have been obscured by the ascending smoke from the burning of sacrificed animals and birds, required by law of every man and woman. From all these slain creatures the offal was thrown to the birds. There were no guns; the arrows of bowmen or "throw sticks" were the only protection against them, and these arms made no noise to frighten feathered creatures, and did small damage. So it easily can be seen that the birds would increase in large numbers and become so bold that men were often in actual conflict with them, and no doubt their faces and hands were torn and scratched.<P>2. In Later Usage:<P>Later, as birds of song and those useful for food came into their lives, the word was stretched to cover all feathered creatures. In the King James Version \'ayit is translated "fowl," and occurs several times: "And when the fowls came down upon the carcasses, Abram drove them away" (<a onClick="return mV(\'Gen\',15,11);">Ge 15:11</a>). "They shall be left together unto the fowls of the mountains, and to the beasts of the earth; and the fowls shall summer upon them, and all the beasts of the earth shall winter upon them" (<a onClick="return mV(\'Isa\',18,6);">Isa 18:6</a>). "There is a path which no fowl knoweth, and which the vulture\'s eye hath not seen" (<a onClick="return mV(\'Job\',28,7);">Job 28:7</a>). The American Standard Revised Version changes these and all other references to feathered creatures to "birds," making a long list. The Hebrew \'ayit in its final acceptance was used in Palestine as "bird" is with us.<P>3. In Old English:<P>Our earliest known form of the word is the Old English "brid," but they applied the term to the young of any creature. Later its meaning was narrowed to young produced from eggs, and the form changed to "bird."<P>II. Natural History of Birds.<P>The first known traces of birds appear in the formation of the Triassic period, and are found in the shape of footprints on the red sandstone of the Connecticut valley.<P>1. Earliest Traces and Specimens:<P>This must have been an ancient sea bed over which stalked large birds, leaving deeply imprinted impressions of their feet. These impressions baked in the sun, and were drifted full of fine wind-driven sand before the return of the tide. Thus were preserved to us the traces of 33 species of birds all of which are proven by their footprints to have been much larger than our birds of today. The largest impressions ever found measured 15 inches in length by 10 in width, and were set from 4 to 6 ft. apart. This evidence would form the basis for an estimate of a bird at least four times as large as an ostrich. That a bird of this size ever existed was not given credence until the finding of the remains of the dinornis in New Zealand. The largest specimen of this bird stood 10 1/2 ft. in height. The first complete skeleton of a bird was found in the limestone of the Jurassic period in Solenhofen, Bavaria. This bird had 13 teeth above and 3 below, each set in a separate socket, wings ending in three-fingered claws much longer than the claws of the feet, and a tail of 20 vertebrae, as long as the body, having a row of long feathers down each side of it, the specimen close to the size of a crow. The first preserved likeness of a bird was found frescoed on the inside of a tomb of Maydoon, and is supposed to antedate the time of Moses 3,000 years. It is now carefully preserved in the museum of Cairo. The painting represents six geese, four of which can be recognized readily as the ancestors of two species known today. Scientists now admit that Moses was right in assigning the origin of birds to the water, as their structure is closer reptilian than mammalian, and they reproduce by eggs. To us it seems a long stretch between the reptile with a frame most nearly bird-like and a feathered creature, but there is a possibility that forms making closer connection yet will be found.<P>2. Structural Formation:<P>The trunk of a bird is compact and in almost all instances boat-shaped. Without doubt prehistoric man conceived his idea of navigation and fashioned his vessel from the body of a water bird, and then noticed that a soaring bird steered its course with its tail and so added the rudder. The structural formation of a bird is so arranged as to give powerful flight and perfect respiration. In the case of a few birds that do not fly, the wings are beaten to assist in attaining speed in running, as the ostrich, or to help in swimming under the water, as the auk. The skull of a young bird is made up of parts, as is that of man or animal; but with age these parts join so evenly that they appear in a seamless formation. The jaws extend beyond the face, forming a bill that varies in length and shape with species, and it is used in securing food, in defense, feather dressing, nest building—in fact it is a combination of the mouth and hand of man. The spine is practically immovable, because of the ribs attached to the upper half and the bony structure supporting the pelvic joints of the lower. In sharp contrast with this the neck is formed of from 10 to 23 vertebrae, and is so flexible that a bird can turn its head completely around, a thing impossible to man or beast. The breast bone is large, strong, and provided with a ridge in the middle, largest in birds of strong flight, smallest in swimmers, and lacking only in birds that do not fly, as the ostrich. The wings correspond to the arms of man, and are now used in flight and swimming only. Such skeletons as the Archeopteryx prove that the bones now combined in the tip of the wing were once claws. This shows that as birds spread over land and developed wing power in searching longer distances for food or when driven by varying conditions of climate, the wings were used more in flight, and the claws gradually joined in a tip and were given covering that grew feathers, while the bill became the instrument for taking food and for defense. At the same time the long tail proving an encumbrance, it gradually wore away and contracted to the present form. Studied in detail of bony structure, muscle, and complicated arrangement of feathers of differing sizes, the wing of a bird proves one of Nature\'s marvels. The legs are used in walking or swimming, the thigh joint being so enveloped in the body that the true leg is often mistaken for it. This makes the knee of a man correspond to the heel of a bird, and in young birds of prey especially, the shank or tarsus is used in walking, until the bones harden and the birds are enabled to bear their weight on the feet and straighten the shank. The toes vary with species. Pliny classified birds by them: "The first and principal difference and distinction in birds is taken from their feet; for they have either hooked talons, as Hawkes, or long round claws as Hens, or else they be broad, flat and whole- footed as Geese." Flight is only possible to a bird when both wings are so nearly full-feathered that it balances perfectly. In sleep almost every bird places its head under its wing and stands on one foot. The arrangement by which this is accomplished, without tiring the bird in the least, is little short of miraculous and can be the result only of slow ages of evolution. In the most finished degree this provision for the comfort of the bird is found among cranes and other long- legged water birds. The bone of one part of the leg fits into the bone of the part above, so that it is practically locked into place with no exertion on the part of the bird. At the same time the muscles that work the claws, cross the joints of the leg so that they are stretched by the weight of the bird, and with no effort, it stands on earth or perches on a branch. This explains the question so frequently asked as to why the feet of a perching bird do not become so cramped and tired that it falls.<P>3. Birds\' Food, Blood, etc.:<P>Birds feed according to their nature, some on prey taken alive, some on the carrion of dead bodies, some on fish and vegetable products of the water, some on fruit seed, insects and worms of the land. Almost every bird indulges in a combination of differing foods. Their blood is from 12 degrees to 16 degrees warmer than that of the rest of the animal kingdom, and they exhibit a corresponding exhilaration of spirits. Some indulge in hours of sailing and soaring, some in bubbling notes of song, while others dart near earth in playful dashes of flight. Birds are supposed to be rather deficient in the senses of taste and touch, and to have unusually keen vision. They reproduce by eggs that they deposit in a previously selected and prepared spot, and brood for a length of time varying with the species. The young of birds of prey, song birds, and some water birds, remain in the nests for differing lengths of time and are fed by the old birds; while others of the water birds and most of the game birds leave the nest as soon as the down is dry, and find food as they are taught by their elders, being sheltered at night so long as needful.<P>III. Birds of the Bible.<P>The birds of the Bible were the same species and form as exist in Palestine today. Because of their wonderful coloring, powerful flight, joyous song, and their similarity to humanity in home-making and the business of raising their young, birds have been given much attention, and have held conspicuous place since the dawn of history. When the brain of man was young and more credulous than today he saw omens, signs and miracles in the characteristic acts of birds, and attributed to them various marvelous powers: some were considered of good omen and a blessing, and some were bad and a curse.<P>1. Earliest Mention:<P>The historians of the Bible frequently used birds in comparison, simile, and metaphor. They are first mentioned in <a onClick="return mV(\'Gen\',7,14,15);">Ge 7:14-15</a>, "They, and every beast after its kind, and all the cattle after their kind, and every creeping thing that creepeth upon the earth after its kind, and every bird after its kind, every bird of every sort." This is the enumeration of the feathered creatures taken into the ark to be preserved for the perpetuation of species after the flood abated. They are next found in the description of the sacrifice of Abram, where it was specified that he was to use, with the animals slaughtered, a turtle dove and a young pigeon, the birds not to be divided. It is also recorded that the birds of prey were attracted by the carcasses as described in <a onClick="return mV(\'Gen\',15,\'9-11\');">Ge 15:9-11</a>, "And he said unto him, Take me a heifer three years old, and a she-goat three years old, and a ram three years old, and a turtle-dove, and a young pigeon. And he took him all these, and divided them in the midst, and laid each half over against the other: but the birds divided he not. And the birds of prey came down upon the carcasses, and Abram drove them away." Palestine abounded in several varieties of "<a href="./study/isbe/search.html?string=DOVE">doves</a>" (which see) and their devotion to each other, and tender, gentle characteristics had marked them as a loved possession of the land; while the clay cotes of pigeons were reckoned in establishing an estimate of a man\'s wealth.<P>2. Used in Sacrifice:<P>In an abandon of gratitude to God these people offered of their best-loved and most prized possessions as sacrifice; and so it is not surprising to find the history of burnt offerings frequently mentioning these birds which were loved and prized above all others. Their use is first commanded in <a onClick="return mV(\'Lev\',1,\'14-17\');">Le 1:14-17</a>, "And if his oblation to Yahweh be a burnt-offering of birds, then he shall offer his oblation of turtle-doves, or of young pigeons. And the priest shall bring it unto the altar, and wring off its head, and burn it on the altar; and the blood thereof shall be drained out on the side of the altar; and he shall take away its crop with the filth thereof, and cast it beside the altar on the east part, in the place of the ashes." Again in <a onClick="return mV(\'Lev\',5,\'7-10\');">Le 5:7-10</a>, we read:<p class="in15">"And if his means suffice not for a lamb, then he shall bring his trespass-offering for that wherein he hath sinned, two turtle-doves, or two young pigeons, unto Yahweh; one for a sin-offering, and the other for a burnt-offering."<p>Throughout the Bible these birds figure in the history of sacrifice (<a onClick="return mV(\'Lev\',12,8);">Le 12:8</a>; <a onClick="return mV(\'Lev\',14,\'4-8\');">14:4-8</a>; <a onClick="return mV(\'Num\',6,10);">Nu 6:10</a>, etc.).<P>3. Other References:<P>The custom of weaving cages of willow wands, in which to confine birds for pets, seems to be referred to when Job asks (<a onClick="return mV(\'Job\',41,5);">Job 41:5</a>): " Wilt thou play with him as with a bird? Or wilt thou bind him for thy maidens?" See <a onClick="return mV(\'Job\',12,7);">Job 12:7</a>: "But ask now the beasts, and they shall teach thee; And the birds of the heavens, and they shall tell thee." David was thinking of the swift homeward flight of an eagle when he wrote: "In Yahweh do I take refuge: How say ye to my soul, Flee as a bird to your mountain?" (<a onClick="return mV(\'Psa\',11,1);">Ps 11:1</a>).<P>His early days guarding the flocks of his father no doubt suggested to him the statement found in <a onClick="return mV(\'Psa\',50,11);">Ps 50:11</a>: "I know all the birds of the mountains; And the wild beasts of the field are mine" (the Revised Version margin, "in my mind"). In describing Lebanon, the Psalmist wrote of its waters: "By them the birds of the heavens have their habitation; They sing among the branches" (<a onClick="return mV(\'Psa\',104,12);">Ps 104:12</a>). He mentioned its trees: "Where the birds make their nests: As for the stork, the fir-trees are her house" (<a onClick="return mV(\'Psa\',104,17);">Ps 104:17</a>). See also <a onClick="return mV(\'Psa\',78,27);">Ps 78:27</a>; <a onClick="return mV(\'Psa\',148,10);">148:10</a>.<P>The origin of the oft-quoted phrase, "A little bird told me," can be found in <a onClick="return mV(\'Ecc\',10,20);">Ec 10:20</a>: "Revile not the king, no, not in thy thought; and revile not the rich in thy bedchamber: for a bird of the heavens shall carry the voice, and that which hath wings shall tell the matter." In a poetical description of spring in the Song of Solomon, we read: "The flowers appear on the earth; The time of the singing of birds is come, and the voice of the turtle-dove is heard in our land" (<a onClick="return mV(\'Sgs\',2,12);">So 2:12</a>). In his prophecy concerning Ethiopia, Isaiah wrote, "They shall be left together unto the ravenous birds of the mountains, and to the beasts of the earth; and the ravenous birds shall summer upon them, and all the beasts of the earth shall winter upon them" (<a onClick="return mV(\'Isa\',18,6);">Isa 18:6</a>). In foretelling God\'s judgment upon Babylon, Isaiah (<a onClick="return mV(\'Isa\',46,11);">Isa 46:11</a>) refers to Cyrus as "a ravenous bird (called) from the east, the man of my counsel from a far country"; "probably in allusion to the fact that the griffon was the emblem of Persia; and embroidered on its standard" (HDB, I, 632); (see <a href="./study/isbe/search.html?string=EAGLE">EAGLE</a>). <a onClick="return mV(\'Jer\',4,25);">Jer 4:25</a> describes the habit of birds, which invariably seek shelter before an approaching storm. In His denunciation of Israel, Yahweh questions, in <a onClick="return mV(\'Jer\',12,9);">Jer 12:9</a>, "Is my heritage unto me as a speckled bird of prey? Are the birds of prey against her round about?" When Jeremiah threatened the destruction of Jerusalem, he wrote that Yahweh would "cause them to fall by the sword before their enemies, and by the hand of them that seek their life: and their dead bodies will I give to be food for the birds of the heavens" (<a onClick="return mV(\'Jer\',19,7);">Jer 19:7</a>): that is, He would leave them for the carrion eaters. Ezekiel threatens the same fate to the inhabitants of Gog (<a onClick="return mV(\'Eze\',39,4,17);">Eze 39:4, 17</a>). Hosea (<a onClick="return mV(\'Hsa\',9,11);">Ho 9:11</a>) prophesies of Ephraim, "Their glory shall fly away like a bird." In the Sermon on the Mount, Jesus mentions the birds, as recorded by <a onClick="return mV(\'Mat\',6,26);">Mt 6:26</a>: "Behold the birds of the heaven, that they sow not, neither do they reap, nor gather into barns; and your heavenly Father feedeth them. Are not ye of much more value than they?" In the sermon from the boat where He spoke the parable of the Sower He again mentioned the birds: "As he sowed, some seeds fell by the way side, and the birds came and devoured them" (<a onClick="return mV(\'Mat\',13,4);">Mt 13:4</a>). Mark describes the same sermon in <a onClick="return mV(\'Mar\',4,4);">Mr 4:4</a>, and <a onClick="return mV(\'Mar\',4,32);">Mr 4:32</a> quotes the parable of the Mustard Seed: "Yet when it is sown, (it) groweth up, and becometh greater than all the herbs, and putteth out great branches; so that the birds of the heaven can lodge under the shadow thereof." In <a onClick="return mV(\'Luk\',8,5);">Lu 8:5</a>, Luke gives his version of the parable of the Sower, and in <a onClick="return mV(\'Luk\',13,19);">Lu 13:19</a> of the Mustard Seed. See also <a onClick="return mV(\'Rev\',19,17,21);">Re 19:17, 21</a>. These constitute all the important references to birds in the Bible, with the exception of a few that seem to belong properly under such subjects as <a href="./study/isbe/search.html?string=TRAP">TRAP</a>; <a href="./study/isbe/search.html?string=NET">NET</a>; <a href="./study/isbe/search.html?string=CAGE">CAGE</a>, etc..``167';
isbe[1517]='Birds of Abomination``<a href="./study/isbe/search.html?string=ABOMINATION,+BIRDS+OF">ABOMINATION, BIRDS OF</a>`1';
isbe[1518]='Birds of Prey`pra: They were undoubtedly the first birds noticed by the compilers of Biblical records. They were camp followers, swarmed over villages and perched on the walls of cities. They were offensive in manner and odor, and of a boldness unknown to us in birds. They flocked in untold numbers, there was small defense against them, and the largest and strongest not only carried away meat prepared for food and sacrifice, but also preyed upon the much-prized house pigeons, newly born of the smaller animals, and even at times attacked young children. See <a onClick="return mV(\'Gen\',15,11);">Ge 15:11</a>, "And the birds of prey came down upon the carcasses, and Abram drove them away." Because they were attracted from above the clouds by anything suitable for food, people recognized that these were birds of unusual vision. When Job wanted to tell how perfectly the path to the gold mine was concealed, he wrote, "That path no bird of prey knoweth" (<a onClick="return mV(\'Job\',28,7);">Job 28:7</a>). The inference is, that, if it were so perfectly concealed that it escaped the piercing eyes of these birds, it was not probable that man would find it. These birds were so strong, fierce and impudent that everyone feared them, and when the prophets gave warning that people would be left for birds of prey to ravage, they fully understood what was meant, and they were afraid (<a onClick="return mV(\'Isa\',18,6);">Isa 18:6</a>). In His complaint against His heritage, Yahweh questions, "Is my heritage unto me as a speckled bird of prey? are the birds of prey against her round about?" (<a onClick="return mV(\'Jer\',12,9);">Jer 12:9</a>). And when he prophesied the destruction of Jerusalem, Jeremiah painted a dreadful picture, but one no doubt often seen in that land of pillage and warfare: "Their dead bodies will I give to be food for the birds of the heavens, and for the beasts of the earth" (<a onClick="return mV(\'Jer\',19,7);">Jer 19:7</a>).``167';
isbe[1519]='Birds, Unclean`un-klen\':The lists of birds forbidden as food are given in <a onClick="return mV(\'Lev\',11,\'13-19\');">Le 11:13-19</a> and <a onClick="return mV(\'Deu\',14,\'12-18\');">De 14:12-18</a>. The names are almost identical, Deuteronomy containing one more than Leviticus and varying the order slightly. In <a onClick="return mV(\'Deu\',14,13);">De 14:13</a> the first name, ha-ra\'ah, is almost certainly a corruption of ha-da\'-ah, the first name in <a onClick="return mV(\'Lev\',11,14);">Le 11:14</a>. In the American Standard Revised Version it is translated "kite" in Leviticus, while in Deuteronomy it is translated "glede." The additional one in Deuteronomy is ha-dayyah, and is translated "kite." Doubtless the three words, ha-da\'ah, ha-\'ayyah and ha-dayyah, are generic and refer to different birds of the kite or perhaps falcon family, so it is impossible to give specific meanings to them. There are twenty-one names in all, counting the extra one in Deuteronomy. The translation of many of these words is disputed. The American Standard Revised Version gives them as follows: eagle, gier eagle, osprey, kite, falcon, glede, every raven, ostrich, night-hawk, sea-mew, hawk, little owl, cormorant, great owl, horned owl, pelican, vulture, stork, heron, hoopoe and bat. It will be observed that all of them are either carrion-eaters, birds of prey, or water fowl. The names of those birds which may be eaten are not given, the principle of classification is that of elimination. No principle of separation is given as is the case with the animals. The reason for the prohibition doubtless lies in the unsanitary and repulsive nature of the flesh of these birds, the Divine command endorsing the instincts which were repelled by such food. For particulars, see separate articles on each of these birds.`<a href="./study/isbe/search.html?string=ABOMINATION,+BIRDS+OF">ABOMINATION, BIRDS OF</a>`146';
isbe[1520]='Birsha`bur\'-sha (birsha\'): King of Gomorrah (<a onClick="return mV(\'Gen\',14,2);">Ge 14:2</a>), who joined the league against Chedorlaomer. The name is probably corrupt; some have tried to explain it as beresha\', "with wickedness," a name purposely used by the writer in referring to this king.``1';
isbe[1521]='Birth`burth (genesis):<P>(1) It was said by the angel beforehand of John the Baptist, "Many shall rejoice at his birth"; and when he was born Elisabeth said, "Thus hath the Lord done unto me...to take away my reproach among men" (<a onClick="return mV(\'Luk\',1,14,25);">Lu 1:14, 25</a>). Among the ancient Hebrews barrenness was a "reproach" and the birth of a child, of a son especially, an occasion for rejoicing.<P>(2) This, no doubt, was due in part to the Messianic hope inspired and sustained by prophecy (see <a onClick="return mV(\'Gen\',3,15);">Ge 3:15</a>, where it was foretold that the seed of the woman should bruise the serpent\'s head; and subsequent prophecies too numerous to mention). Cases in point worth studying are found in <a onClick="return mV(\'Gen\',4,1);">Ge 4:1</a>, where Eve rejoices over the birth of her firstborn and cries, "I have gotten a man with the help of Yahweh"; and <a onClick="return mV(\'1Sa\',1,20);">1Sa 1:20</a>, where Hannah exults over her firstborn, calling his name "Samuel," "because," she says, "I have asked him of Yahweh."<P>(3) The marvelous passage in <a onClick="return mV(\'Isa\',7,14);">Isa 7:14</a>, "Behold, a virgin shall conceive, and bear a son, and shall call his name Immanuel," must have intensified the longing and hope of every devout Jewish maiden to be a mother, if mayhap, under God, she might be the mother of Messiah—Immanuel! (Compare <a onClick="return mV(\'Mat\',1,22,23);">Mt 1:22-23</a>; <a onClick="return mV(\'Luk\',1,13);">Lu 1:13</a> f.)`<a href="./study/isbe/search.html?string=JESUS+CHRIST">JESUS CHRIST</a>; <a href="./study/isbe/search.html?string=VIRGIN+BIRTH">VIRGIN BIRTH</a>`47';
isbe[1522]='Birth, New``<a href="./study/isbe/search.html?string=REGENERATION">REGENERATION</a>`1';
isbe[1523]='Birth, Virgin``<a href="./study/isbe/search.html?string=VIRGIN+BIRTH">VIRGIN BIRTH</a>`1';
isbe[1524]='Birth-Stool`burth\'-stool: Found only in <a onClick="return mV(\'Exd\',1,16);">Ex 1:16</a>, in connection with Hebrew women in Egypt when oppressed by Pharaoh. The Hebrew (\'obhnayim) here rendered "birth-stool" is used in <a onClick="return mV(\'Jer\',18,3);">Jer 18:3</a>, and is there rendered "potter\'s wheel." The word is used in both places in the dual form, which points, no doubt, to the fact that the potter\'s wheel was composed of two discs, and suggests that the birth-stool was similarly double.`<a href="./study/isbe/search.html?string=STOOL">STOOL</a>`1';
isbe[1525]='Birthday`burth\'-da:<P>(1) The custom of observing birthdays of great men, especially of kings, was widespread in ancient times (see <a onClick="return mV(\'Gen\',40,20);">Ge 40:20</a>f; "the third day, which was Pharaoh\'s birthday," etc.; compare 2Macc 6:7; and Herod. ix.110; in the New Testament, <a onClick="return mV(\'Mat\',14,6);">Mt 14:6</a>; <a onClick="return mV(\'Mar\',6,21);">Mr 6:21</a>, "Herod on his birthday made a supper to his lords," etc., i.e. Herod Antipas). Here we see the ancient custom reflected in two conspicuous instances centuries apart:<P>(a) Pharaoh, on his birthday "made a feast unto all his servants," etc., and<P>(b) Herod on his birthday "made a supper to his lords, and the high captains," etc.<P>The King James Version (<a onClick="return mV(\'Mat\',14,6);">Mt 14:6</a>) has it "when Herod\'s birthday was kept," etc. The correct text here (Tischendorf, Westcott-Hort) has a very peculiar construction, but without material difference of meaning. The locative case gives the time of the principal action, "danced on Herod\'s birthday, when it occurred." The construction is not unexampled (see Jelf, section 699). This need not be called "a case absolute," though it corresponds to the Latin ablative (locative) absolute; and the Greek genitive absolute is itself not really "absolute," i.e. it is not cut loose from the rest of the construction, but gives some event to which the principal action is referred, for the indication of its circumstances.<P>(2) The term "birthday" (ta genesia) was applied also to the anniversary of a king\'s accession to the throne (Edersheim); but Wieseler\'s argument that such is the case here is not conclusive. It is easy to suppose that when Herod\'s birthday approached he was sojourning at the castle of Macherus, accompanied by leading military and civil officials of his dominions (<a onClick="return mV(\'Mar\',6,21);">Mr 6:21</a>). Petty ruler as he was, not properly "king" at all, he affected kingly ways (compare <a onClick="return mV(\'Est\',5,3,6);">Es 5:3, 6</a>; <a onClick="return mV(\'Est\',7,2);">7:2</a>).<P>(3) Genesia, which in Attic Greek means the commemoration of the dead, in later Greek is interchangeable with genethlia = "birthday celebrations"; and there is no good reason why the rendering of the King James Version and the Revised Version (British and American) here, "birthday," should not be right (See Swete on <a onClick="return mV(\'Mar\',6,21);">Mr 6:21</a>, and HDB, under the word)`<a href="./study/isbe/search.html?string=JESUS+CHRIST">JESUS CHRIST</a>; <a href="./study/isbe/search.html?string=CALENDAR">CALENDAR</a>`47';
isbe[1526]='Birthright`burth\'-rit (bekhorah, from bekhor, "firstborn"; prototokia): Birthright is the right which naturally belonged to the firstborn son. Where there were more wives than one, the firstborn was the son who in point of time was born before the others, apparently whether his mother was a wife or a concubine. Sarah protests against Ishmael being heir along with Isaac, but it is possible that the bestowal of the rights of the firstborn on Isaac was not due to any law, but rather to the influence of a favorite wife (<a onClick="return mV(\'Gen\',21,10);">Ge 21:10</a>). The birthright of the firstborn consisted in the first place of a double portion of what his father had to leave. This probably means that he had a double share of such property as could be divided. We have no certain knowledge of the manner in which property was inherited in the patriarchal age, but it seems probable that the lands and flocks which were the possession of the family as a whole, remained so after the death of the father. The firstborn became head of the family and thus succeeded to the charge of the family property, becoming responsible for the maintenance of the younger sons, the widow or widows, and the unmarried daughters. He also, as head, succeeded to a considerable amount of authority over the other members. Further, he generally received the blessing, which placed him in close and favored covenant-relationship with Yahweh. According to the accounts which have come down to us, all these gifts and privileges could be diverted from the firstborn son. This could happen with his own consent, as in the case of Esau, who sold his birthright to Jacob (<a onClick="return mV(\'Gen\',25,\'29-34\');">Ge 25:29-34</a>), or by the decision of the father, as in the case of Reuben (<a onClick="return mV(\'Gen\',48,22);">Ge 48:22</a>; <a onClick="return mV(\'Gen\',49,3,4);">49:3-4</a>; <a onClick="return mV(\'1Ch\',5,1,2);">1Ch 5:1-2</a>) and of Shimri (<a onClick="return mV(\'1Ch\',26,10);">1Ch 26:10</a>). In the Deuteronomic version of the law, a provision is made, prohibiting the father from making the younger son the possessor of the birthright, just because his mother was specially beloved (<a onClick="return mV(\'Deu\',21,\'15-17\');">De 21:15-17</a>). The blessing also could be diverted from the eldest son. This was done when Jacob blessed the children of Joseph, and deliberately put the younger before the elder (<a onClick="return mV(\'Gen\',48,13,14,17,18,19);">Ge 48:13-14, 17-19</a>); even when the blessing was obtained by the younger son in a fraudulent manner, it could not be recalled (<a onClick="return mV(\'Gen\',27,\'1-\');">Ge 27</a>). Jacob does not appear to have inherited any of the property of his father, although he had obtained both the birthright and the blessing.<P>In the New Testament "birthright," prototokia, is mentioned only once (<a onClick="return mV(\'Hbr\',12,16);">Heb 12:16</a>), where the reference is to Esau. In various passages where our Lord is spoken of as the firstborn, as in <a onClick="return mV(\'Col\',1,\'15-19\');">Col 1:15-19</a>; <a onClick="return mV(\'Hbr\',1,2);">Heb 1:2</a>, the association of ideas with the Old Testament conception of birthright is easy to trace.`<a href="./study/isbe/search.html?string=FIRSTBORN">FIRSTBORN</a>; <a href="./study/isbe/search.html?string=FAMILY">FAMILY</a>; <a href="./study/isbe/search.html?string=HEIR">HEIR</a>; <a href="./study/isbe/search.html?string=INHERITANCE">INHERITANCE</a>; <a href="./study/isbe/search.html?string=LAW">LAW</a>`195';
isbe[1527]='Birzaith`bur-za\'-ith, bur-za\'-vith the King James Version Birzavith, (birzawith or birzayith; Bezaith, or Berzaie): The name of a town in Asher founded by Malchiel (<a onClick="return mV(\'1Ch\',7,31);">1Ch 7:31</a>). It probably corresponds to the modern Bir ez-Zait, "well of olive oil," near Tyre.``1';
isbe[1528]='Bishlam`bish\'-lam (bishlam, "peaceful" (?)): One of three foreign colonists who wrote a letter of complaint against the Jews to Artaxerxes (<a onClick="return mV(\'Ezr\',4,7);">Ezr 4:7</a> = 1Esdras 2:16). In 1Esdras the reading is "Belemus." "And in the days of Artaxerxes wrote Bishlam, Mithredath, Tabeel, and the rest of his companions, unto Artaxerxes, king of Persia," etc. (<a onClick="return mV(\'Ezr\',4,7);">Ezr 4:7</a>). The Septuagint renders Bishlam as en eirene, "in peace," as though it were a phrase rather than a proper name; this is clearly an error.``1';
isbe[1529]='Bishop`bish\'-up: The word is evidently an abbreviation of the Greek episkopos; Latin, episcopus.<P>GENERAL<P>1. Use in the Septuagint and Classic Greek:<P>The Septuagint gives it the generic meaning of "superintendency, oversight, searching" (<a onClick="return mV(\'Num\',4,16);">Nu 4:16</a>; <a onClick="return mV(\'Num\',31,14);">31:14</a>) in matters pertaining to the church, the state, and the army (<a onClick="return mV(\'Jdg\',9,28);">Jud 9:28</a>; <a onClick="return mV(\'2Ki\',12,11);">2Ki 12:11</a>; <a onClick="return mV(\'2Ch\',34,12,17);">2Ch 34:12, 17</a>; 1Macc 1:54; The <span class="noTag">Wisdom of Solomon 1:6</span>). Nor is it unknown to classical Greek. Thus Homer in the Iliad applied it to the gods (xxii.255), also Plutarch, Cam., 5. In Athens the governors of conquered states were called by this name.<P>2. New Testament Use:<P>The word is once applied to Christ himself, "unto the Shepherd and Bishop of your souls" (<a onClick="return mV(\'1Pe\',2,25);">1Pe 2:25</a>). It abounds in as Pauline literature, and is used as an alternative for presbuteros or elder (<a onClick="return mV(\'Tts\',1,5,7);">Tit 1:5, 7</a>; <a onClick="return mV(\'1Ti\',3,1);">1Ti 3:1</a>; <a onClick="return mV(\'1Ti\',4,14);">4:14</a>; <a onClick="return mV(\'1Ti\',5,17,19);">5:17, 19</a>). The earliest ecclesiastical offices instituted in the church were those of elders and deacons, or rather the reverse, inasmuch the latter office grew almost immediately out of the needs of the Christian community at Jerusalem (<a onClick="return mV(\'Act\',6,\'1-6\');">Ac 6:1-6</a>). The presbyteral constitution of Jerusalem must have been very old (<a onClick="return mV(\'Act\',11,30);">Ac 11:30</a>) and was distinct from the apostolate (<a onClick="return mV(\'Act\',15,2,4,6,22,23);">Ac 15:2, 4, 6, 22-23</a>; <a onClick="return mV(\'Act\',16,4);">16:4</a>). As early as 50 AD Paul appointed "elders" in every church, with prayer and fasting (<a onClick="return mV(\'Act\',14,23);">Ac 14:23</a>), referring to the Asiatic churches before established. But in writing to the Philippians (<a onClick="return mV(\'Phl\',1,1);">Php 1:1</a>) he speaks of "bishops" and "deacons." In the GentileChristian churches this title evidently had been adopted; and it is only in the Pastoral Epistles that we find the name "presbyters" applied. The name "presbyter" or "elder," familiar to the Jews, signifies their age and place in the church; while the other term "bishop" refers rather to their office. But both evidently have reference to the same persons. Their office is defined as "ruling" (<a onClick="return mV(\'Rom\',12,8);">Ro 12:8</a>), "overseeing" (<a onClick="return mV(\'Act\',20,17,28);">Ac 20:17, 28</a>; <a onClick="return mV(\'1Pe\',5,2);">1Pe 5:2</a>), caring for the flock of God (<a onClick="return mV(\'Act\',20,28);">Ac 20:28</a>). But the word archein, "to rule," in the hierarchical sense, is never used. Moreover, each church had a college of presbyter-bishops (<a onClick="return mV(\'Act\',20,17,28);">Ac 20:17, 28</a>; <a onClick="return mV(\'Phl\',1,1);">Php 1:1</a>; <a onClick="return mV(\'1Ti\',4,14);">1Ti 4:14</a>). During Paul\'s lifetime the church was evidently still unaware of the distinction between presbyters and bishops.<P>Of a formal ordination, in the later hierarchical sense, there is no trace as yet. The word "ordained" used in the King James Version (<a onClick="return mV(\'Act\',1,22);">Ac 1:22</a>) is an unwarrantable interpolation, rightly emended in the Revised Version (British and American). Neither the word cheirotonesantes (<a onClick="return mV(\'Act\',14,23);">Ac 14:23</a>, translated "appointed" the American Standard Revised Version) nor katasteses (<a onClick="return mV(\'Tts\',1,5);">Tit 1:5</a>, translated "appoint" the American Standard Revised Version) is capable of this translation. In rendering these words invariably by "ordain" the King James Version shows a vitium originis. No one doubts that the idea of ordination is extremely old in the history of the church, but the laying on of hands, mentioned in the New Testament (<a onClick="return mV(\'Act\',13,3);">Ac 13:3</a>; <a onClick="return mV(\'1Ti\',4,14);">1Ti 4:14</a>; <a onClick="return mV(\'2Ti\',1,6);">2Ti 1:6</a>; compare <a onClick="return mV(\'Act\',14,26);">Ac 14:26</a>; <a onClick="return mV(\'Act\',15,40);">15:40</a>) points to the communication of a spiritual gift or to its invocation, rather than to the imparting of an official status.<P>3. Later Development of the Idea:<P>According to Rome, as finally expressed by the Council of Trent, and to the episcopal idea in general, the hierarchical organization, which originated in the 3rd century, existed from the beginning in the New Testament church. But besides the New Testament as above quoted, the early testimony of the church maintains the identity of "presbyters" and "bishops." Thus, Clement of Rome (<span class="noTag">Ep. 1</span>, chapters 42, 44, 57), the Didache, chapter 15; perhaps the Constitutions, II, 33, 34, in the use of the plural form; Irenaeus (Adv. Haer., iii. 2, 3), Ambrosiaster (on <a onClick="return mV(\'1Ti\',3,10);">1Ti 3:10</a>; <a onClick="return mV(\'Eph\',4,11);">Eph 4:11</a>), Chrysostom (Hom 9 in Ep. ad Tim), in an unequivocal statement, the "presbyters of old were called bishops...and the bishops presbyters," equally unequivocally Jerome (Ad Tit,1,7), "the same is the presbyter, who is also the bishop." Augustine and other Fathers of the 4th and 5th centuries hold this view, and even Peter Lombard, who preceded Aquinas as the great teacher of the church of the Middle Ages. Hatch of Oxford and Harnack of Berlin, in the face of all this testimony, maintain a distinction between the presbyters, as having charge of the law and discipline of the church, and the bishops, as being charged with the pastoral care of the church, preaching and worship. This theory is built upon the argument of prevailing social conditions and institutions, as adopted and imitated by the church, rather than on sound textual proof. The distinction between presbyters and bishops can only be maintained by a forced exegesis of the Scriptures. The later and rapid growth of the hierarchical idea arose from the accession of the Ebionite Christian view of the church, as a necessary continuation of the Old Testament dispensation, which has so largely influenced the history of the inner development of the church in the first six centuries of her existence.<P>Henry E. Dosker<P>ANGLICAN VIEW<P>I. Episcopacy Defined.<P>Episcopacy is the government in the Christian church by bishops. The rule of the Orthodox churches in the East, of the Roman Catholics, and of the Anglicans is that the consecration of other bishops, and the ordination of priests and deacons can only be by a bishop; and with them, a bishop is one who claims historic descent from apostolic or sub-apostolic times.<P>II. Offices in the Early Church.<P>In the New Testament, the office of bishop is not clearly defined. Indeed there appear to have been many degrees of ministry in the infant church: apostles, prophets, evangelists, teachers, presbyters or elders, bishops or overseers, and deacons.<P>Due allowance is not generally made for the mental attitude of the apostles and early Christians. They were looking for the speedy return of Christ, and consequently did not organize the church in its infancy, as it was afterward found necessary to do. For this reason, while the different persons who composed the body of Christian ministers did not overlap or infringe on each other\'s work, yet the relative rank or priority of each minister was not clearly defined.<P>1. Apostles:<P>The apostles were undoubtedly first, and in them rested the whole authority, and they were the depository of the power committed unto them by Christ.<P>2. Prophets:<P>Next to the apostles in rank, and first in point of mention (<a onClick="return mV(\'Act\',11,27);">Ac 11:27</a>), came the prophets. So important were these officers in the early church that they were sent from Jerusalem to warn the rapidly growing church at Antioch of an impending famine. Then it appears that there were resident prophets at Antioch, men of considerable importance since their names are recorded, Barnabas, Symeon, Lucius, Manaen and Saul (<a onClick="return mV(\'Act\',13,1);">Ac 13:1</a>). These men received a command from the Holy Spirit to "separate me Barnabas and Saul," on whom they laid their hands and sent them forth on their work. The election is conducted on the same lines as the election by the eleven apostles of Matthias, and Barnabas and Paul are hereafter called apostles. It is an ordination to the highest order in the Christian ministry by "prophets and teachers." Whether "prophets and teachers" refers to two distinct ministries, or whether they are terms used for the same one is uncertain. It may be that of the five men mentioned, some were prophets, and others teachers.<P>In <a onClick="return mV(\'Act\',15,32);">Ac 15:32</a> we have given us the names of two other prophets, Judas and Silas. Paul tells the Corinthians (<a onClick="return mV(\'1Cr\',12,28);">1Co 12:28</a>) that God hath set some in his church, first apostles, secondly prophets, thirdly teachers, and writing to the Ephesians he places the prophets in the same rank. "He gave some, apostles; and some, prophets; and some, evangelists; and some, pastors and teachers; for the perfecting of the saints, for the work of the ministry" (<a onClick="return mV(\'Eph\',4,11,12);">Eph 4:11-12</a> the King James Version). And again, he says that the mystery of Christ is now "revealed unto his holy apostles and prophets in the Spirit" (<a onClick="return mV(\'Eph\',3,5);">Eph 3:5</a>). The same apostle in that wonderful imagery of Christians being built up for a habitation of God, says they are "being built upon the foundation of the apostles and prophets, Christ Jesus himself being the chief corner stone" (<a onClick="return mV(\'Eph\',2,20);">Eph 2:20</a>).<P>In the case of the ordination of Timothy, which Paul says distinctly was by his own laying on of hands and that of the presbytery, it is of great consequence to note that Paul says to Timothy that his ordination was "according to the prophecies which went before on thee" (<a onClick="return mV(\'1Ti\',1,18);">1Ti 1:18</a> the King James Version). From this it would appear that the prophets, as in the case of Paul himself, guided by the Holy Ghost, chose Timothy for the overseership or bishopric, or it may be, which is just as likely, that Timothy was set apart by the laying on of hands by some prophets, to the rank of elder or presbyter which did not carry with it the "overseership." It is at any rate evident that in the selection of Timothy, Paul is insistent on pointing out that it was through the prophets (compare <a onClick="return mV(\'1Ti\',1,18);">1Ti 1:18</a>; <a onClick="return mV(\'1Ti\',4,14);">4:14</a>; <a onClick="return mV(\'2Ti\',1,6);">2Ti 1:6</a>).<P>In Revelation, the term prophet constantly occurs as a term denoting rank equivalent to that of apostle: "ye saints, and ye apostles, and ye prophets" (<a onClick="return mV(\'Rev\',18,20);">Re 18:20</a>); "blood of prophets and of saints" (<a onClick="return mV(\'Rev\',16,6);">Re 16:6</a>; <a onClick="return mV(\'Rev\',18,24);">18:24</a>). The angel calls himself "thy fellow-servant, and of thy brethren the prophets" (<a onClick="return mV(\'Rev\',22,9);">Re 22:9</a> the King James Version). The words prophesy and prophesying are used in a general sense, and it does not mean that they were in every case the formal utterances of prophets.<P>3. Elders or Presbyters:<P>The ministry of the elders of the Christian church was modeled after that of the synagogue in which there were elders and teachers. The Christian elders or presbyters were most likely a council of advice in each local Christian ekklesia. They appear to act conjointly and not separately (<a onClick="return mV(\'Act\',15,4,6,22);">Ac 15:4, 6, 22</a>; <a onClick="return mV(\'Act\',16,4);">16:4</a>; <a onClick="return mV(\'Act\',20,17);">20:17</a>; <a onClick="return mV(\'Jam\',5,14);">Jas 5:14</a>).<P>4. Teachers:<P>Teachers were the equivalent of those teachers or catechists of the synagogue before whom our Lord was found in the temple.<P>5. Evangelists:<P>Evangelists were persons who probably had the gift of oratory and whose function it was to preach the glad tidings. Philip was one of them (<a onClick="return mV(\'Act\',21,8);">Ac 21:8</a>). In the instructions to Timothy he is bidden to do the work of an evangelist, that is to say, to preach the gospel. This was to be part of his work in the ministry.<P>In writing to Timothy, Paul twice says that he himself was ordained preacher, and apostle and teacher. This does not mean that he held three grades of the ministry, but that his duties as an apostle were to preach and to teach. The fact that the apostles called themselves elders does not thereby confirm the view that the bishops mentioned by them were not superior to elders, any more than the fact that the apostles called themselves teachers, or preachers, makes for the view that teachers, or preachers, were the equals of apostles.<P>6. Bishops:<P>Bishops or overseers were probably certain elders chosen out of the body of local elders. Under the Jewish dispensation, the elders stayed at home, that is, they did no ministerial visiting, but it was soon found necessary as the Christian church grew to have someone to attend to outside work to win over by persuasion and exposition of the Scriptures those inclined to embrace Christianity. This necessitated visiting families in their own homes. Then, it became necessary to shepherd the sheep. Someone had to oversee or superintend the general work. The Jewish elders always had a head and in a large synagogue the conditions laid down for its head, or legatus, were almost identical with those laid down by Paul to Timothy. He was to be a father of a family, not rich or engaged in business, possessing a good voice, apt to teach, etc.<P>The term episkopos was one with which the Hellenistic Jews and Gentiles were well acquainted; and it became thus a fitting term by which to designate the men called out of the body of elders to this special work of oversight. Then, again, the term episkopos was endeared to the early Christians as the one applied to our Lord—"the Shepherd and Bishop of your souls" (<a onClick="return mV(\'1Pe\',2,25);">1Pe 2:25</a>). The duties of elders, or presbyters, are not clearly defined in the New Testament.<P>In the Acts, the term is found only twice, one in reference to Judas, "his bishopric (or overseership) let another take" (<a onClick="return mV(\'Act\',1,20);">Ac 1:20</a> the King James Version), and in Paul\'s address to the elders of Ephesus, he warns them to feed the church over which they have been made overseers or bishops (<a onClick="return mV(\'Act\',20,28);">Ac 20:28</a>). It is impossible to say whether this "overseership" refers to all the elders addressed, or to such of those elders as had been made "overseers," or "bishops."<P>In the epistles, we find the church more clearly organized, and in these writings we find more definite allusions to bishops and their duties (<a onClick="return mV(\'Phl\',1,1);">Php 1:1</a>; <a onClick="return mV(\'1Ti\',3,1,2);">1Ti 3:1-2</a>; <a onClick="return mV(\'Tts\',1,7);">Tit 1:7</a>; <a onClick="return mV(\'1Pe\',2,25);">1Pe 2:25</a>).<P>Paul tells Timothy, "If a man desire the office of a bishop (or overseer) he desireth a good work." "A bishop (or overseer) must be blameless" (<a onClick="return mV(\'1Ti\',3,1,2);">1Ti 3:1-2</a> the King James Version). He tells Titus that "he is to ordain elders in every city" and that a "bishop must be blameless, as the steward of God" (<a onClick="return mV(\'Tts\',1,5,7);">Tit 1:5, 7</a> the King James Version).<P>On the other hand, there are numerous texts where elders and their duties are mentioned and where there is no reference whatever to bishopric or oversight. The epistles show that of necessity there had grown to be a more distinct organization of the ministry, and that following the custom of the synagogue to some of the elders had been committed a bishopric or oversight. At the same time the rank of a bishop, or overseer, was not yet one of the highest. Paul does not enumerate it in the order of ministry which he gives to the Ephesians—apostles, prophets, evangelists, pastors and teachers.<P>That Timothy had an oversight over the elders or presbyters is evident from the fact that Paul enjoins him to rebuke those that sin: "Against an elder receive not an accusation, except at the mouth of two or three witnesses. Them that sin reprove in the sight of all" (<a onClick="return mV(\'1Ti\',5,19,20);">1Ti 5:19-20</a>). This, of course, refers to a formal trial by one in authority of persons inferior to him in rank.<P>It has been asserted that the terms elder and bishop in the New Testament were equivalent and denoted the same office or grade in the ministry. This assertion seems unwarranted. They do not naturally denote the same grade any more than do apostle and teacher, or angel and prophet.<P>7. Deacons:<P>The deacons were the seven appointed to take charge of the temporal affairs of the church. Their appointment was perhaps suggested by the alms-collectors of the synagogue. In the New Testament they do not appear as deacons to have had any part in the sacred ministry, except, in the case of Philip the evangelist, if it be assumed that he was a deacon, which is uncertain. Nowhere is it recorded that they laid hands on anyone, or were considered as capable of bestowing any grace. In the epistles they are mentioned with the bishops—"bishops and deacons" (<a onClick="return mV(\'Phl\',1,1);">Php 1:1</a>), thus showing the nature of their influence as the helpers of the "bishops" in the management of the growing funds, or properties of the church.<P>III. Episcopacy according to the New Testament.<P>The passages where the Greek word occurs which has been translated either as bishops, or overseers, are so few that they are enumerated: <a onClick="return mV(\'Act\',20,17,28);">Ac 20:17, 28</a>: the Ephesian elders are stated to be bishops (or overseers) to feed the church; <a onClick="return mV(\'Phl\',1,1);">Php 1:1</a> the salutation of Paul and Timothy to bishops (or overseers) and deacons at Philippi; <a onClick="return mV(\'1Ti\',3,1,2);">1Ti 3:1-2</a> and <a onClick="return mV(\'Tts\',1,7);">Tit 1:7</a> give the exhortation to Timothy and Titus as holding the office of a bishop; <a onClick="return mV(\'1Pe\',2,25);">1Pe 2:25</a>, where the apostle referring to Christ says, "unto the Shepherd and Bishop of your souls."<P>IV. The "Didache."<P>Passing out of the New Testament, we come to the early Christian writing, the so-called Teaching of the Twelve Apostles. Setting aside the question for what class of Christians this document was intended, the clear fact stands out that at the date of its writing the two highest grades in the Christian ministry were still called apostles and prophets. Various dates have been assigned to this document ranging from 80 to 160 AD.<P>At the end of chapter 10, which deals with the thanksgiving or eucharist, the remark is made, "But permit the prophets to make thanksgiving as much as they desire." Chapters 11 and 13 deal with apostles and prophets. They were to be treated "according to the ordinance of the gospel." An apostle was not to be allowed to stay more than a couple of days at the utmost, and in no case was he to receive any money, else he was to be considered "a false prophet." A prophet could beg on behalf of others, but not for himself; but a prophet could settle among a congregation, and in that case he was to receive the same first-fruits "of money and raiment and of every possession" as the chief priest did under the old dispensation. It is to be noted that in reality the prophets, though placed second in order, were to be treated with the greater respect. If the prophet settles down, he becomes the man of the first rank in that Christian community.<P>Chapter 15 deals with bishops and deacons, and we are told that if appointed they rendered the ministry of prophets and teachers, but the warning is given, "Despise them not, therefore, for they are your honored ones, together with the prophets and teachers." This shows that bishops were localized; and that while they could be appointed over a community, they were not considered as of equal rank with the prophets.<P>V. Clement of Rome.<P>Clement of Rome in his Epistle to the Corinthians says that the apostles preaching through countries and cities appointed the first-fruits of their labors to be bishops and deacons (chapter 42). It is usually said that Clement meant elders by the term "bishops," but it is much more likely that he meant what he said; that according to the tradition received by him, the apostles appointed bishops, that is, appointed bishops out of the elders—mentioned in the Acts. In chapter 44 Clement warns against the sin of ejecting from the episcopate those who have presented the offerings, and says, "Blessed are those presbyters who have finished their course."<P>The reason why the terms apostles and prophets fell into desuetude was, as regards the first, not so much out of respect to the original apostles, but because the apostles in the sub-apostolic age became apparently only wandering evangelists of little standing; while the prophets lowered their great office by descending to be soothsayers, as the Shepherd of Hermas plainly intimates. With the fall of the apostles and the prophets, there rose into prominence the bishops and deacons.<P>VI. Bishops and Deacons.<P>The deacons acted as secretaries and treasurers to the bishops. They were their right-hand men, representing them in all secular matters. As the numbers of Christians increased, it was found absolutely necessary for the bishops to delegate some of their spiritual authority to a second order.<P>VII. Bishops and Presbyters (Priests).<P>Thus very slowly emerged out of the body of elders the official presbyters or priests. To them the bishop delegated the power to teach, to preach, to baptize, to celebrate the Holy Eucharist; but how slowly is evidenced by the fact that so late as 755 AD the Council of Vern forbade priests to baptize, except by distinct permission of their bishop.<P>VIII. Ignatian Epistles on the Three Orders.<P>When we come to the Ignatian epistles written between 110-17 AD, we find a distinct threefold order. We have given us the names of Damas, for bishop, Bassus and Apollonius for presbyters, Zotion for deacon. Throughout these epistles there is no question that the bishop is supreme. Apostles and prophets are not even mentioned. The bishop succeeds to all the powers the apostles and prophets had. On the other hand, as with the Jewish elders, so with the Christian presbyters, they form a council with the bishop. Here we see in clear day what we had all along suspected to be the case in apostolic times: a council of presbyters with a ruler at their head and deacons to attend to money matters.<P>It is quite immaterial as to whether a bishop had ten or a hundred presbyter-elders under him, whether he was bishop in a small town or in a large city. The question of numbers under him would not affect his authority as has been claimed. The greatness of the city in which he exercised this rule would add dignity to his position, but nothing to his inherent authority.<P>From this time on it is admitted by all that bishops, priests and deacons have been continuously in existence. Their powers and duties have varied, have been curtailed as one order has encroached on the power of the other, but still there the three orders have been. Gradually the presbyters or priests encroached on the power of the bishop, till now, according to Anglican usage, only the power of ordaining, confirming and consecrating churches is left to them.<P>IX. Views of Reformers.<P>At the time of the Reformation there was a great outcry against bishops. This was caused by the fact that under feudalism the bishops had come to be great temporal lords immersed in schemes of political and material aggrandizement, and often actually leading their armies in times of war. Many of the bishops were proud and arrogant, forgetful that their duties as fathers of the children of Christ were to look after those committed to them with fatherly kindness and charity or that as pastors they had to tend the erring sheep with Divine patience and infinite love.<P>The bulk of the adherents to the Reformed religion, looking upon the bishops as they were and as their fathers had known them, recoiled from retaining the office, although their principal men, like Calvin, deplored the loss of bishops, and hoped that bishops of the primitive order would some day be restored. The present modern Anglican bishop seems to sum up in his person and office the requirements laid down by Calvin.<P>Conclusion:<P>Thus the claim put forth by the Anglicans in the preface to the Ordinal may be considered as sound: "It is evident unto all men, diligently reading Holy Scripture and ancient Authors, that from the Apostles\' time there have been these Orders of Ministers in Christ\'s Church—Bishops, Priests, and Deacons."<P>LITERATURE.<P>Teaching of the Twelve Apostles; Clement of Rome; Shepherd of Hermas; Ignatian epistles; Muratorian Fragment; Works of John Lightfoot; Duchesne, Origines du Culte Chretien; Pellicia, Polity of the Christian Church; Bishop MacLean, Ancient Church Orders; Cheetham, Hist of the Christian Church during the First Six Centuries; Salmon, Introduction to New Testament; Elwin, The Minister of Baptism; Cruttwell, Literary History of Early Christianity; Potter, Church Government; Lowndes, Vindication of Anglican Orders; E. Hatch, The Organization of the Early Christian Churches; C. Gore, The Church and the Ministry; Thompson, Historic Episcopate (Presbyterian); Baird, Huguenots.<P>Arthur Lowndes<P>CONGREGATIONAL VIEW:<P>1. The New Testament Church a Spiritual Democracy:<P>As a spiritual and social democracy, Congregationaliam finds no warrant or precedent in the New Testament for the episcopal conception of the words "bishop," "presbyter," and "elder." It interprets epi-skopos, literally as overseer—not an ecclesiastical dignitary but a spiritual minister. It finds the Romanist view of Peter\'s primacy, founded alone on <a onClick="return mV(\'Mat\',16,18);">Mt 16:18</a>, contradicted by the entire trend of Christ\'s teaching, as e.g. when referring to the Gentiles exercising lordship and authority Christ says, "Not so shall it be among you" (<a onClick="return mV(\'Mat\',20,26);">Mt 20:26</a>ff). He set the precedent of official greatness when He said "the Son of man came not to be ministered unto, but to minister," and that "whosoever would become great among you shall be your minister (servant)." Paul\'s testimony confirms this in suggesting no primacy among the apostles and prophets, but making "Christ...himself...the chief corner stone" (<a onClick="return mV(\'Eph\',2,20);">Eph 2:20</a>). The organization and history of the early Christian church establish this view of its simplicity and democracy. In <a onClick="return mV(\'Act\',1,20);">Ac 1:20</a> the Revised Version (British and American) corrects the rendering "bishopric" (given by the King James translators, who were officers in the Episcopal church) to "office," thus, relieving the verse of possible ecclesiastical pretensions.<P>The church formed on the day of Pentecost was the spontaneous coming together of the original 120 disciples and the 3,000 Christian converts, for fellowship, worship and work, under the inspiration and guidance of the Holy Spirit. Its only creed was belief in the risen Christ and the renewing power of the Holy Spirit; its only condition of membership, repentance and baptism.<P>2. Election of Officers by Popular Vote:<P>The apostles naturally took leadership but, abrogating all authority, committed to the church as a whole the choice of its officers and the conduct of its temporal and spiritual affairs. Judas\' place in the apostolate was not filled by succession or episcopal appointment (<a onClick="return mV(\'Act\',1,\'23-26\');">Ac 1:23-26</a>). The seven deacons were elected by popular vote (<a onClick="return mV(\'Act\',6,\'1-6\');">Ac 6:1-6</a>). One of the seven—Philip—preached and, without protest, administered the rite of baptism (<a onClick="return mV(\'Act\',8,12,13);">Ac 8:12-13</a>).<P>The churches in the apostolic era were independent and self-governing, and the absence of anything like a centralized ecclesiastical authority is seen by the fact that the council at Jerusalem, called to consider whether the church at Antioch should receive the uncircumcised into membership, was a delegated body, composed in part of lay members, and having only advisory power (<a onClick="return mV(\'Act\',15,\'1-29\');">Ac 15:1-29</a>).<P>3. The Epistles not Official Documents:<P>The apostolic letters, forming so large a part of the New Testament, are not official documents but letters of loving pastoral instruction and counsel. The terms bishops, elders, pastors and teachers are used synonymously and interchangeably, thus limiting the officers of the early church to two orders: pastors and deacons.<P>See also <a href="./study/isbe/search.html?string=CHURCH+GOVERNMENT">CHURCH GOVERNMENT</a>; <a href="./study/isbe/search.html?string=DIDACHE">DIDACHE</a>.<P>4. Restoration of Primitive Ideals:<P>Under the spiritual tyrannies of the Church of England, during the reigns of Henry VIII, Edward VI, "bloody" Mary and \'Queen Elizabeth, the Dissenting bodies, chiefly the Congregationalists, returned to the simplicity and spiritual freedom of the primitive church. The issue was forced by two arbitrary acts of Parliament under Elizabeth: the Act of Supremacy and the Act of Uniformity. Emancipation from the intellectual and religious tyranny of these acts was won at the cost of many martyrdoms. These struggles and persecutions wrought into the successors of Robert Browne, the father of modern Congregationalism, a deep-seated and permanent resentment against all forms of autocratic power in church and state. They challenged, at the cost of life, both the Divine Right of kings, and of bishops. They believed that in Christ Jesus all believers are literally and inalienably made "kings and priests unto God" (<a onClick="return mV(\'Rev\',1,6);">Re 1:6</a> the King James Version), actual spiritual sovereigns, independent of all human dictation and control in matters of belief and worship. The Pilgrims expatriated themselves to secure this spiritual liberty; and to their inherent antagonism to inherited and self-perpetuated power, whether civil or ecclesiastical, must be credited the religious freedom and civil democracy of America.<P>LITERATURE.<P>For further study see Henry M. Dexter, Congregationalism, chapter ii; Dunning\'s Congregationalists in America, chapters i, ii: Rainy, The Ancient Catholic Church.``139';
isbe[1530]='Bishoprick`bish\'-up-rik (episkope; <a onClick="return mV(\'Act\',1,20);">Ac 1:20</a> the King James Version, quoted from <a onClick="return mV(\'Psa\',109,8);">Ps 109:8</a>): the Revised Version (British and American) "office," margin, "overseership."`<a href="./study/isbe/search.html?string=BISHOP">BISHOP</a>`1';
isbe[1531]='Bishops\' Bible``<a href="./study/isbe/search.html?string=ENGLISH+VERSIONS">ENGLISH VERSIONS</a>`1';
isbe[1532]='Bit And Bridle`bri\'-d\'-l (methegh wa-recen): The two words occur in conjunction (<a onClick="return mV(\'Psa\',32,9);">Ps 32:9</a> the King James Version, "Be ye not as the horse, or as the mule, which have no understanding; whose mouth must be held in with bit and bridle, lest they come near unto thee"; the Revised Version (British and American)) "else they will not come near unto thee," margin, "that they come not near." Methegh, translated "bit" above, is properly a bridle or halter in which the bit was a loop passed round the under jaw of the animal; recen has a similar meaning. The counsel in the verse is that men should render a willing obedience to God and not be like the animals that man has to bridle and curb in order to get them to do his will. Compare <a onClick="return mV(\'Jam\',3,3);">Jas 3:3</a>, where we have "bit" as translation of chalinos, "a bit" or "curb," "We put bits (the Revised Version (British and American) "bridles") in the horses\' mouths that they may obey us." "Bridle" occurs separately as translation of methegh (<a onClick="return mV(\'2Sa\',8,1);">2Sa 8:1</a>), "David took Metheg-ammah," King James Version margin "the bridle of Ammah," the Revised Version (British and American) "the bridle of the mother city," margin, as the King James Version; the meaning may be that he took the control or dominion of it; "I will put...my bridle in thy lips" (<a onClick="return mV(\'2Ki\',19,28);">2Ki 19:28</a>; <a onClick="return mV(\'Isa\',37,29);">Isa 37:29</a>); "a bridle for the ass" (<a onClick="return mV(\'Pro\',26,3);">Pr 26:3</a>); of recen (<a onClick="return mV(\'Job\',30,11);">Job 30:11</a>), "They have also let loose the bridle before me," the Revised Version (British and American) "and they have cast off the bridle before me" (acted in an unbridled (unrestrained) manner); <a onClick="return mV(\'Job\',41,13);">Job 41:13</a>, said of "leviathan" (the Revised Version (British and American) "the hippopotamus"), "Who can come
