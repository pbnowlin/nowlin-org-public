to him his double bridle?" the American Standard Revised Version "within his jaws?" the English Revised Version "within his double bridle," others, "into the double row of his teeth"; <a onClick="return mV(\'Isa\',30,28);">Isa 30:28</a>, "a bridle in the jaws of the people causing them to err," the Revised Version (British and American) "a bridle that causeth to err"; of machcom, which means "a muzzle" (<a onClick="return mV(\'Psa\',39,1);">Ps 39:1</a>), "I will keep my mouth with a bridle," King James Version margins "Hebrew, a bridle, or muzzle for my mouth"; so the Revised Version, margin.<P>To "bridle" occurs (<a onClick="return mV(\'Jam\',1,26);">Jas 1:26</a>, "bridleth not his tongue"; <a onClick="return mV(\'Jam\',3,2);">Jas 3:2</a> "able to bridle the whole body"; chalinagogeo, "to lead" or "guide with a bit"). In 1Esdras 3:6, and 2Macc 10:29, we have "bridles of gold" (chrusochalinos).``185';
isbe[1533]='Bithiah`bi-thi\'-a (bithyah; Beththia; Codex Vaticanus, Gelia, "daughter of Yah"): The daughter of a Pharaoh who married Mered, a descendant of Judah (<a onClick="return mV(\'1Ch\',4,18);">1Ch 4:18</a>). Whether this Pharaoh was an Egyptian king, or whether it was in this case a Hebrew name, it is difficult to say. The name Bithiah seems to designate one who had become converted to the worship of Yahweh, and this would favor the first supposition. If, as the Revised Version (British and American) reads, the other wife of Mered is distinguished as "the Jewess" (instead of the King James Version "Jehudijah"), this supposition would receive further support.``77';
isbe[1534]='Bithron`bith\'-ron (ha-bithron; holen ten parateinousan, literally "the entire (land) extending"; <a onClick="return mV(\'2Sa\',2,29);">2Sa 2:29</a>, "the Bithron," i.e. the gorge or groove): Does not seem to be a proper name; rather it indicates the gorge by which Abner approached Mahanaim. Buhl (GAP, 121) favors identification with Wady \'Ajlun, along which in later times a Roman road connected \'Ajlun and Mahanaim. Others (Guthe, Kurz. bib. Worterbuch, under the word) incline to Wady esh Sha\'ib.``1';
isbe[1535]='Bithynia`bi-thin\'-i-a (Bithunia): A coast province in northwestern Asia Minor on the Propontis and the Euxine. Its narrowest compass included the districts on both sides of the Sangarius, its one large river, but in prosperous times its boundaries reached from the Rhyndacus on the west to and beyond the Parthenius on the east. The Mysian Olympus rose in grandeur to a height of 6,400 ft. in the southwest, and in general the face of Nature was wrinkled with rugged mountains and seamed with fertile valleys sloping toward the Black Sea.<P>Hittites may have occupied Bithynia in the remote past, for Priam of Troy found some of his stoutest enemies among the Amazons on the upper Sangarius in Phrygia, and these may have been Hittite, and may easily have settled along the river to its mouth. The earliest discernible Bithynians, however, were Thracian immigrants from the European side of the Reliespont. The country was overcome by Croesus, and passed with Lydia under Persian control, 546 BC. After Alexander the Great, Bithynia became independent, and Nicomedes I, Prusias I and II, and Nicomedes II and III, ruled from 278 to 74 BC. The last king, weary of the incessant strife among the peoples of Asia Minor, especially as provoked by the aggressive Mithridates, bequeathed his country to Rome. Nicomedia and Prusa, or Brousa, were founded by kings whose names they bear; the other chief cities, Nicea and Chalcedon, had been built by Greek enterprise earlier. There were highways leading from Nicomedia and Nicea to Dorylaeum and to Angora (see Ramsay, Historical Geography of Asia Minor, and The Church in the Roman Empire before A. D. 170). Under Rome the Black Sea littoral as far as Amisus was more or less closely joined with Bithynia in administration.<P>Paul and Silas essayed to go into Bithynia, but the Spirit suffered them not (<a onClick="return mV(\'Act\',16,7);">Ac 16:7</a>). Other evangelists, however, must have labored there early and with marked success. Bithynia is one of the provinces addressed in <a onClick="return mV(\'1Pe\',1,1);">1Pe 1:1</a>.<P>Internal difficulties and disorders led to the sending of Pliny, the lawyer and literary man, as governor, 111 to 113 AD. He found Christians under his jurisdiction in such numbers that the heathen temples were almost deserted, and the trade in sacrificial animals languished. A memorable correspondence followed between the Roman governor and the emperor Trajan, in which the moral character of the Christians was completely vindicated, and the repressive measures required of officials were interpreted with leniency (see E. G. Hardy, Pliny\'s Correspondence with Trajan, and Christianity and the Roman Government). Under this Roman policy Christianity was confirmed in strength and in public position. Subsequently the first Ecumenical Council of the church was held in Nicea, and two later councils convened in Chalcedon, a suburb of what is now Constantinople. The emperor Diocletian had fixed his residence and the seat of government for the eastern Roman Empire in Nicomedia.<P>Bithynia was for a thousand years part of the Byzantine Empire, and shared the fortunes and misfortunes of that state. On the advent of the Turks its territory was quickly overrun, and Orchan, sultan in 1326, selected Brousa as his capital, since which time this has been one .of the chief Ottoman cities.``191';
isbe[1536]='Bitter Herbs`hurbs, or urbs (merorim): Originally in the primitive Passover (<a onClick="return mV(\'Exd\',12,8);">Ex 12:8</a>; <a onClick="return mV(\'Num\',9,11);">Nu 9:11</a>) these were probably merely salads, the simplest and quickest prepared form of vegetable accompaniment to the roasted lamb. Such salads have always been favorites in the Orient. Cucumbers, lettuce, water-cress, parsley and endive are some of those commonly used. Later on the Passover ritual (as it does today) laid emphasis on the idea of "bitterness" as symbolical of Israel\'s lot in Egypt. In modern Palestine the Jews use chiefly lettuce and endive for the "bitter herbs" of their Passover. In <a onClick="return mV(\'Lam\',3,15);">La 3:15</a> the same word is used: "He hath filled me with bitterness merorim, he hath sated me with wormwood." Here the parallelism with "wormwood" suggests some plant more distinctly bitter than the mild salads mentioned above, such, for example, as the colocynth (Citrullus colocynthus) or the violently irritating squirting cucumber (Ecballium elaterium).``117';
isbe[1537]='Bitter Water``<a href="./study/isbe/search.html?string=ADULTERY">ADULTERY</a>; <a href="./study/isbe/search.html?string=MARAH">MARAH</a>`1';
isbe[1538]='Bitter; Bitterness`bit\'-er, bit\'-er-nes (mar, or marah = "bitter" (literally or figuratively); also (noun) "bitterness" or (adverb) "bitterly"; "angry," "chafed," "discontented," "heavy" (<a onClick="return mV(\'Gen\',27,34);">Ge 27:34</a>; <a onClick="return mV(\'Exd\',15,23);">Ex 15:23</a>; <a onClick="return mV(\'Num\',5,18,19,23,24,27);">Nu 5:18-19, 23-24, 27</a>; <a onClick="return mV(\'Est\',4,1);">Es 4:1</a>; <a onClick="return mV(\'Job\',3,20);">Job 3:20</a>; <a onClick="return mV(\'Psa\',64,3);">Ps 64:3</a>; <a onClick="return mV(\'Pro\',5,4);">Pr 5:4</a>; <a onClick="return mV(\'Pro\',27,7);">27:7</a>; <a onClick="return mV(\'Ecc\',7,26);">Ec 7:26</a>; <a onClick="return mV(\'Isa\',5,20);">Isa 5:20</a>; <a onClick="return mV(\'Jer\',2,19);">Jer 2:19</a>; <a onClick="return mV(\'Jer\',4,18);">4:18</a>; <a onClick="return mV(\'Eze\',27,31);">Eze 27:31</a>; <a onClick="return mV(\'Amo\',8,10);">Am 8:10</a>; <a onClick="return mV(\'Hab\',1,6);">Hab 1:6</a>); the derivatives marar, meror, and merorah, used with the same significance according to the context, are found in <a onClick="return mV(\'Exd\',1,14);">Ex 1:14</a>; <a onClick="return mV(\'Exd\',12,8);">12:8</a>; <a onClick="return mV(\'Num\',9,11);">Nu 9:11</a>; <a onClick="return mV(\'Job\',13,26);">Job 13:26</a>; <a onClick="return mV(\'Isa\',24,9);">Isa 24:9</a>. The derivatives meri and meriri occur in <a onClick="return mV(\'Deu\',32,24);">De 32:24</a>; <a onClick="return mV(\'Job\',23,2);">Job 23:2</a> (margin); and tamrur, is found in <a onClick="return mV(\'Jer\',6,26);">Jer 6:26</a>; <a onClick="return mV(\'Jer\',31,15);">31:15</a>. In the New Testament the verb pikraino = "to embitter"; the adjective pikros = "bitter," and the noun pikria, "bitterness," supply the same ideas in <a onClick="return mV(\'Col\',3,19);">Col 3:19</a>; <a onClick="return mV(\'Jam\',3,11,14);">Jas 3:11, 14</a>; <a onClick="return mV(\'Rev\',8,11);">Re 8:11</a>; <a onClick="return mV(\'Rev\',10,9,10);">10:9-10</a>): It will be noted that the word is employed with three principal spheres of application:<P>(1) the physical sense of taste;<P>(2) a figurative meaning in the objective sense of cruel, biting words; intense misery resulting from forsaking God, from a life of sin and impurity; the misery of servitude; the misfortunes of bereavement;<P>(3) more subjectively, bitter and bitterness describe emotions of sympathy;\' the sorrow of childlessness and of penitence, of disappointment; the feeling of misery and wretchedness, giving rise to the expression "bitter tears";<P>(4) the ethical sense, characterizing untruth and immorality as the bitter thing in opposition to the sweetness of truth and the gospel;<P>(5) <a onClick="return mV(\'Num\',5,18);">Nu 5:18</a> the Revised Version (British and American) speaks of "the water of bitterness that causeth the curse." Here it is employed as a technical term.``77';
isbe[1539]='Bittern`bit\'-ern (qippodh; Latin Botaurus stellaris; Greek echinos): A nocturnal member of the heron family, frequenting swamps and marshy places. Its Hebrew name means a creature of waste and desert places. The bittern is the most individual branch of the heron (ardeidae) family on account of being partially a bird of night. There are observable differences from the heron in proportion, and it differs widely in coloration. It is one of the birds of most ancient history, and as far back as records extend is known to have inhabited Europe, Asia, Africa, Australia and America. The African bird that Bible historians were familiar with was 2 1/2 ft. in length. It had a 4-inch bill, bright eyes and plumage of buff and chestnut, mottled with black. It lived around swamps and marshes, hunting mostly at night, and its food was much the same as that of all members of the heron family, frogs being its staple article of diet. Its meat has not the fishy taste of most members of the heron family, and in former times wa s considered a great delicacy of food. In the days of falconry it was protected in England because of the sport afforded in hunting it. Aristotle mentions that previous to his time the bittern was called oknos, which name indicates "an idle disposition." It was probably bestowed by people who found the bird hiding in swamps during the daytime, and saw that it would almost allow itself to be stepped upon before it would fly. They did not understand that it fed and mated at night. Pliny wrote of it as a bird that "bellowed like oxen," for which reason it was called Taurus. Other medieval writers called it botaurus, from which our term "bittern" is derived. There seems to be much confusion as to the early form of the name; but all authorities agree that it was bestowed on the bird on account of its voice. Turner states that in 1544 the British called it "miredromble," and "botley bump," from its voice. Rolland says the French called it, Boeuf d\'eau. In later days "bog-bull," "stake-driver" and "thunder-pumper" have attached themselves to it as terms fitly descriptive of its voice. Nuttall says its cry is "like the interrupted bellowing of a bull, but hollower and louder, and is heard at a mile\'s distance, as if issuing from some formidable being that resided at the bottom of the waters." Tristram says, "Its strange booming note, disturbing the stillness of night, gives an idea of desolation which nothing but the wail of a hyena can equal." Thoreau thought its voice like the stroke of an ax on the head of a deeply driven stake. In ancient times it was believed the bird thrust its sharp beak into a reed to produce this sound. Later it was supposed to be made by pushing the bill into muck and water while it cried. Now the membrane by which the sound is produced has been located in the lungs of the bird. In all time it has been the voice that attracted attention to the bittern, and it was solely upon the ground of its vocal attainments that it entered the Bible. There are three references, all of which originated in its cry. Isaiah in prophesying the destruction of Babylon (<a onClick="return mV(\'Isa\',14,23);">Isa 14:23</a> in the King James Version) wrote: "I will also make it a possession for the bittern, and pools of water"; in other words he would make of it a desolate and lonely swamp. Again in <a onClick="return mV(\'Isa\',34,11);">Isa 34:11</a> in the King James Version, in pronouncing judgment against Idumaea, he wrote, "But the cormorant and the bittern shall possess it." In the Revised Version (British and American), "cormorant" and "bittern" are changed to "pelican" and "porcupine." The change from the cormorant to pelican makes less difference, as both are water birds, and the Hebrew shalakh, which means "a plunging bird," would apply equally to either of them. If they were used to bear out the idea that they would fill the ruins with terrifying sound, then it is well to remember that the cormorant had something of a voice, while the pelican is notoriously the most silent of birds. The change from bittern to porcupine is one with which no ornithologist would agree. About 620 BC, the prophet Zephaniah (<a onClick="return mV(\'Zep\',2,14);">Zep 2:14</a>) clearly indicates this bird: "And herds shall lie down in the midst of her, all the beasts of the nations: both the pelican and the porcupine shall lodge in the capitals thereof; their voice shall sing in the windows; desolation shall be in the thresholds: for he hath laid bare the cedar work." This should forever settle the question raised by some modern commentators as to whether a bird or beast is intended by the word qippodh. In some instances it seems to have been confounded with qunfudh, the hedgehog or porcupine. No natural historian ever would agree to this, because these animals are not at home in the conditions that were known to exist here. Even granting that Nineveh was to be made dry, it must be remembered that the marshes of the Tigris lay very close, and the bird is of night, with a voice easily carrying over a mile. Also it was to "sing" and to "lodge" on the "upper lintels" which were the top timbers of the doors and windows. These formed just the location a bittern would probably perch upon when it left its marshy home and went booming through the night in search of a mate. It was without doubt the love song of the bittern that Isaiah and Zephaniah used in completing prophecies of desolation and horror, because with the exception of mating time it is a very quiet bird. For these reasons the change from bittern to porcupine in the Revised Version (British and American), of the paragraph quoted, is a great mistake, as is also that of cormorant to pelican.``167';

isbe[1541]='Bitterness, Water of``<a href="./study/isbe/search.html?string=ADULTERY">ADULTERY</a>`1';
isbe[1542]='Bitumen`bi-tu\'-men.`<a href="./study/isbe/search.html?string=SLIME">SLIME</a>`1';
isbe[1543]='Biziothiah`biz-yo-thi\'-a, biz-joth\'-ja (bizyotheyah; Septuagint hai komai auton, literally "their villages"; the King James Version Bizjothjah, "place of Jah\'s olives" (Young), or "contempt of Jah" (Strong)): According to Massoretic Text, a town in the south of Judah, near Beersheba (<a onClick="return mV(\'Jos\',15,28);">Jos 15:28</a>). Septuagint reads "and her daughters," only one consonant of Massoretic Text being read differently; and so We, Hollenberg, Di and others The Septuagint has probably preserved the original text (compare <a onClick="return mV(\'Neh\',11,27);">Ne 11:27</a>).``1';
isbe[1544]='Biztha`biz\'-tha (Septuagint Mazan; also Bazan and Bazea): One of the seven eunuchs or chamberlains of King Ahasuerus (Xerxes). It is possible that the name is derived from the Persian besteh, "bound," hence, "eunuch" (<a onClick="return mV(\'Est\',1,10);">Es 1:10</a>).``1';
isbe[1545]='Black``<a href="./study/isbe/search.html?string=COLORS">COLORS</a>`1';
isbe[1546]='Blackness`(kimririm, "obscurations"; qadhruth, "darkness"; gnophos, "darkness" zophos "blackness"): Terms rarely used but of special significance in picturing the fearful gloom and blackness of moral darkness and calamity. Job, cursing, the day of his birth, wishes that it, a dies ater ("dead black day"), might be swallowed up in darkness (<a onClick="return mV(\'Job\',3,5);">Job 3:5</a>). Because of Israel\'s spiritual infidelity Yahweh clothes the heavens with the blackness of sackcloth (<a onClick="return mV(\'Isa\',50,3);">Isa 50:3</a>), the figure being that of the inky blackness of ominous, terrifying thunder clouds. The fearful judgment against sin under the old dispensation is illustrated by the appalling blackness that enveloped smoking, burning, quaking Sinai at the giving of the law (<a onClick="return mV(\'Hbr\',12,18);">Heb 12:18</a>; compare <a onClick="return mV(\'Exd\',19,\'16-19\');">Ex 19:16-19</a>; <a onClick="return mV(\'Exd\',20,18);">20:18</a>). The horror of darkness culminates in the impenetrable blackness of the under-world, the eternal abode of fallen angels and riotously immoral and ungodly men (<a onClick="return mV(\'Jud\',1,13);">Jude 1:13</a>; see also <a onClick="return mV(\'Jud\',1,6);">Jude 1:6</a> and <a onClick="return mV(\'2Pe\',2,4,17);">2Pe 2:4, 17</a>). Human language is here too feeble to picture the m oral gloom and rayless night of the lost: "Pits (the King James Version "chains") of darkness" (compare the ninth plague of Egypt, "darkness which may be felt" (<a onClick="return mV(\'Exd\',10,21);">Ex 10:21</a>)). Wicked men are "wandering stars," comets that disappear in "blackness of darkness...reserved for ever." In art this figurative language has found majestic and awe-inspiring expression in Dore\'s illustrations of Dante\'s Purgatory and Milton\'s Paradise Lost.``139';
isbe[1547]='Blains`blanz (abha\'bu\'ah: only in <a onClick="return mV(\'Exd\',9,9,10);">Ex 9:9-10</a>): Pustules containing fluid around a boil or inflamed sore. It is an Old English word "bleyen," used sometimes as a synonym for boil. Wyclif (1382) uses the expression "stinkende bleyne" for Job\'s sores. The Hebrew word is from a root which means that which bubbles up.`<a href="./study/isbe/search.html?string=BOIL">BOIL</a>`1';
isbe[1548]='Blasphemy`blas\'-fe-mi (blasphemia): In classical Greek meant primarily "defamation" or "evil-speaking" in general; "a word of evil omen," hence, "impious, and irreverent speech against God."<P>(1) In the Old Testament as substantive and vb.:<P>(a) (barakh) "Naboth did blaspheme God and the king" (<a onClick="return mV(\'1Ki\',21,10,13);">1Ki 21:10, 13</a> the King James Version);<P>(b) (gadhaph) of Senna-cherib defying Yahweh (<a onClick="return mV(\'2Ki\',19,6,22);">2Ki 19:6, 22</a> = <a onClick="return mV(\'Isa\',37,6,23);">Isa 37:6, 23</a>; also <a onClick="return mV(\'Psa\',44,16);">Ps 44:16</a>; <a onClick="return mV(\'Eze\',20,27);">Eze 20:27</a>; compare <a onClick="return mV(\'Num\',15,30);">Nu 15:30</a>), "But the soul that doeth aught with a high hand (i.e. knowingly and defiantly),...the same blasphemeth (so the Revised Version (British and American), but the King James Version "reproacheth") Yahweh; and that soul shall be cut off from among his people." Blasphemy is always in word or deed, injury, dishonor and defiance offered to God, and its penalty is death by stoning;<P>(c) (charaph) of idolatry as blasphemy against Yahweh (<a onClick="return mV(\'Isa\',65,7);">Isa 65:7</a>);<P>(d) (naqabh) "And he that blasphemeth the name of Yahweh, he shall surely be put to death" (<a onClick="return mV(\'Lev\',24,11,16);">Le 24:11, 16</a>);<P>(e) (na\'ats) David\'s sin is an occasion to the enemies of the Lord to blaspheme (<a onClick="return mV(\'2Sa\',12,14);">2Sa 12:14</a>; also <a onClick="return mV(\'Psa\',74,10,18);">Ps 74:10, 18</a>; <a onClick="return mV(\'Isa\',52,5);">Isa 52:5</a>; compare <a onClick="return mV(\'Eze\',35,12);">Eze 35:12</a>; <a onClick="return mV(\'2Ki\',19,3);">2Ki 19:3</a> the King James Version; <a onClick="return mV(\'Isa\',37,3);">Isa 37:3</a>).<P>(2) In the New Testament blasphemy, substantive and vb., may be<P>(a) of evil-speaking generally, (<a onClick="return mV(\'Act\',13,45);">Ac 13:45</a>; <a onClick="return mV(\'Act\',18,6);">18:6</a>); The Jews contradicted Paul "and blasphemed," the Revised Version, margin "railed." (So in the King James Version of <a onClick="return mV(\'Mat\',15,19);">Mt 15:19</a> = <a onClick="return mV(\'Mar\',7,22);">Mr 7:22</a>; <a onClick="return mV(\'Col\',3,8);">Col 3:8</a>, but in the Revised Version (British and American) "railings"; <a onClick="return mV(\'Rev\',2,9);">Re 2:9</a> the Revised Version, margin "reviling"; so perhaps in <a onClick="return mV(\'1Ti\',1,20);">1Ti 1:20</a>; or Hymeneus and Alexander may have blasphemed Christ by professing faith and living unworthily of it.)<P>(b) Speaking against a heathen goddess: the town clerk of Ephesus repels the charge that Paul and his companions were blasphemers of Diana (<a onClick="return mV(\'Act\',19,37);">Ac 19:37</a>).<P>(c) Against God:<p>(i) uttering impious words (<a onClick="return mV(\'Rev\',13,1,5,6);">Re 13:1, 5-6</a>; <a onClick="return mV(\'Rev\',16,9,11,21);">16:9, 11, 21</a>; <a onClick="return mV(\'Rev\',17,3);">17:3</a>);<p>(ii) unworthy conduct of Jews (<a onClick="return mV(\'Rom\',2,24);">Ro 2:24</a>) and Christians (<a onClick="return mV(\'1Ti\',6,1);">1Ti 6:1</a>; <a onClick="return mV(\'Tts\',2,5);">Tit 2:5</a>, and perhaps <a onClick="return mV(\'1Ti\',1,20);">1Ti 1:20</a>);<p>(iii) of Jesus Christ, alleged to be usurping the authority of God (<a onClick="return mV(\'Mat\',9,3);">Mt 9:3</a> = <a onClick="return mV(\'Mar\',2,7);">Mr 2:7</a> = <a onClick="return mV(\'Luk\',5,21);">Lu 5:21</a>), claiming to be the Messiah, the son of God (<a onClick="return mV(\'Mat\',26,65);">Mt 26:65</a> = <a onClick="return mV(\'Mar\',14,64);">Mr 14:64</a>), or making Himself God (<a onClick="return mV(\'Jhn\',10,33,36);">Joh 10:33, 36</a>).<P>(d) Against Jesus Christ: Saul strove to make the Christians he persecuted blaspheme their Lord (<a onClick="return mV(\'Act\',26,11);">Ac 26:11</a>). So was he himself a blasphemer (<a onClick="return mV(\'1Ti\',1,13);">1Ti 1:13</a>; compare <a onClick="return mV(\'Jam\',2,7);">Jas 2:7</a>).<P>The Unpardonable Sin:<P>(3) Blasphemy against the Holy Spirit:<P>"Every sin and blasphemy shall be forgiven unto men; but the blasphemy against the Spirit shall not be forgiven. And whosoever shall speak a word against the Son of man, it shall be forgiven him; but whosoever shall speak against the Holy of Spirit, it shall not be forgiven him, neither in this world, nor in that which is to come" (<a onClick="return mV(\'Mat\',12,31,32);">Mt 12:31-32</a> = <a onClick="return mV(\'Mar\',3,28,29);">Mr 3:28-29</a>; <a onClick="return mV(\'Luk\',12,10);">Lu 12:10</a>). As in the Old Testament "to sin with a high hand" and to blaspheme the name of God incurred the death penalty, so the blasphemy against the Holy Spirit remains the one unpardonable sin. These passages at least imply beyond cavil the personality of the Holy Spirit, for sin and blasphemy can only be committed against persons. In Matthew and Mark a particular case of this blasphemy is the allegation of the Pharisees that Jesus Christ casts out devils by Beelzebub. The general idea is that to attribute to an evil source acts which are clearly those of the Holy Spirit, to call good evil, is blasphemy against the Spirit, and sin that will not be pardoned. "A distinction is made between Christ\'s other acts and those which manifestly reveal the Holy Spirit in Him, and between slander directed against Him personally as He appears in His ordinary acts, and that which is aimed at those acts in which the Spirit is manifest" (Gould, Mark at the place). Luke does not refer to any particular instance, and seems to connect it with the denial of Christ, although he, too, gives the saying that "who shall speak a word against the Son of man, it shall be forgiven." But which of Christ\'s acts are not acts the Holy Spirit, and how therefore is a word spoken against Him not also blasphemy against the Holy Spirit? John identifies the Holy Spirit with the exalted Christ (<a onClick="return mV(\'Jhn\',14,\'16-18\',26,28);">Joh 14:16-18, 26, 28</a>). The solution generally offered of this most difficult problem is concisely put by Plummer (Luke ad loc.): "Constant and consummate opposition to the influence of the Holy Spirit, because of a deliberate preference of darkness to light, render repentance and therefore forgiveness morally impossible." A similar idea is taught in <a onClick="return mV(\'Hbr\',6,\'4-6\');">Heb 6:4-6</a>, and <a onClick="return mV(\'1Jo\',5,16);">1Jo 5:16</a>: "A sin unto death." But the natural meaning of Christ\'s words implies an inability or unwillingness to forgive on the Divine side rather than inability to repent in man. Anyhow the abandonment of man to eternal condemnation involves the inability and defeat of God. The only alternative seems to be to call the kenotic theory into service, and to put this idea among the human limitations which Christ assumed when He became flesh. It is less difficult to ascribe a limit to Jesus Christ\'s knowledge than to God\'s saving grace (<a onClick="return mV(\'Mar\',13,32);">Mr 13:32</a>; compare <a onClick="return mV(\'Jhn\',16,12,13);">Joh 16:12-13</a>). It is also noteworthy that in other respects, at least, Christ acquiesced in the view of the Holy Spirit which He found among His contemporaries.`<a href="./study/isbe/search.html?string=HOLY+SPIRIT">HOLY SPIRIT</a>`145';
isbe[1549]='Blast`(neshamah, ruach):<P>(1) The blowing of the breath of Yahweh, expressive of the manifestation of God\'s power in Nature and Providence. "With the blast of thy nostrils the waters were piled up" (<a onClick="return mV(\'Exd\',15,8);">Ex 15:8</a>), referring to the east wind (<a onClick="return mV(\'Exd\',14,21);">Ex 14:21</a>; compare <a onClick="return mV(\'2Sa\',22,16);">2Sa 22:16</a> and <a onClick="return mV(\'Psa\',18,15);">Ps 18:15</a>). "I will send a blast upon him" (<a onClick="return mV(\'2Ki\',19,7);">2Ki 19:7</a> the King James Version; the Revised Version (British and American) "put a spirit in him," i.e. "an impulse of fear" (Dummelow in the place cited.); compare <a onClick="return mV(\'Isa\',37,7);">Isa 37:7</a>). "By the blast of his anger are they consumed" (<a onClick="return mV(\'Job\',4,9);">Job 4:9</a>; compare <a onClick="return mV(\'Isa\',37,36);">Isa 37:36</a>).<P>(2) The word ruach is used with reference to the tyranny and violence of the wicked (<a onClick="return mV(\'Isa\',25,4);">Isa 25:4</a>).<P>(3) The blowing of a wind instrument: "When they make a long blast with the ram\'s horn" (<a onClick="return mV(\'Jos\',6,5);">Jos 6:5</a>).``91';
isbe[1550]='Blast; Blasting`blast\'-ing (shiddaphon—root, shadhaph, literally "scorching"): This is the effect produced upon grain or other plants by the hot east winds which blow from the desert of Arabia. They usually continue to blow for two or three days at a time. If they occur in the spring near ripening time, the grain is often turned yellow and does not properly mature. The farmers dread this wind. In some localities, if they suspect that the east wind is coming, they set up a great shouting and beating of pans, hoping to drive it off. Sometimes this wind is a double pestilence, when it brings with it a cloud of locusts (<a onClick="return mV(\'2Ch\',6,28);">2Ch 6:28</a>). The writer, while journeying in the northern part of the Arabian desert, the source of these winds, witnessed such a cloud of locusts on their way toward habitable regions. It did not call for a very vivid imagination on the part of the children of Israel to realize the meaning of the curses and all manner of evil which would befall those who would not hearken to the voice of Yahweh. <a onClick="return mV(\'Deu\',28,\'22-24\');">De 28:22-24</a> could easily be considered a poetic description of the east winds (Arabic howa sharki\'yeh) which visit Palestine and Syria at irregular intervals today. The heat is fiery: it dries up the vegetation and blasts the grain; the sky is hazy and there is a glare as if the sun were reflected from a huge brass tray. Woodwork cracks and warps; the covers of books curl up. Instead of rain, the wind brings dust and sand which penetrate into the innermost corners of the dwellings. This dust fills the eyes and inflames them. The skin becomes hot and dry. To one first experiencing this storm it seems as though some volcano must be belching forth heat and ashes. No other condition of the weather can cause such depression. Such a pestilence, only prolonged beyond endurance, was to be the fate of the disobedient. This word should not be confused with mildew. Since the words blasting and mildew occur together it may be inferred that mildew (literally "a paleness") must mean the sickly color which plants assu me for other causes than the blasting of the east wind, such, as for instance, fungus diseases or parasites (<a onClick="return mV(\'1Ki\',8,37);">1Ki 8:37</a>; <a onClick="return mV(\'Amo\',4,9);">Am 4:9</a>; <a onClick="return mV(\'Hag\',2,17);">Hag 2:17</a>).``133';
isbe[1551]='Blastus`blas\'-tus (Blastos, "shoot"): The chamberlain of Herod Agrippa I, whose services as an intermediary between them and the king were gained by the people of Tyre and Sidon. These cities were dependent on Palestine for corn and other provisions, and when Herod, on the occasion of some commercial dispute, forbade the export of foodstuffs to Tyre and Sidon, they were at his mercy and were compelled to ask for peace. "Having made Blastus the king\'s chamberlain their friend," probably by means of a bribe, the Phoenician embassy was given an opportunity of setting their case before Herod (<a onClick="return mV(\'Act\',12,20);">Ac 12:20</a>ff).``78';
isbe[1552]='Blaze`blaz ("to publish"): Found only in the King James Version of <a onClick="return mV(\'Mar\',1,45);">Mr 1:45</a>, for Greek diaphemizein, translated by the Revised Version (British and American) "spread abroad," as in <a onClick="return mV(\'Mat\',9,31);">Mt 9:31</a>; <a onClick="return mV(\'Mat\',28,15);">28:15</a>.``1';
isbe[1553]='Blemish`blem\'-ish:<P>(1) mum, me\'um; momos: This word signifies no particular skin disease, as has been supposed; but is used generally for any and all disfiguring affections of the skin, such as eczema, herpes, scabies, etc., even for scratches and scars, as in <a onClick="return mV(\'Lev\',24,19,20);">Le 24:19-20</a>; and thence for moral defects, as in <a onClick="return mV(\'Eph\',5,27);">Eph 5:27</a>. The existence of a blemish in a person of priestly descent prevented him from the execution of the priestly office; similarly an animal fit for sacrifice was to be without blemish. In the New Testament Christ is presented as the antitype of a pure and ritually acceptable sacrifice "as a lamb without blemish and without spot" (<a onClick="return mV(\'Hbr\',9,14);">Heb 9:14</a>; <a onClick="return mV(\'1Pe\',1,19);">1Pe 1:19</a>), and the disciples are admonished to be blameless, "without blemish" (<a onClick="return mV(\'Eph\',5,27);">Eph 5:27</a>). Rarely the word is used to designate a reprobate person (<a onClick="return mV(\'2Pe\',2,13);">2Pe 2:13</a>).<P>(2) Blemish in the eye, tebhallul (from a root balal, "to overflow"; Arabic balla, balal, "to moisten"), cataract, white spots in the eye (<a onClick="return mV(\'Lev\',21,20);">Le 21:20</a>).``106';
isbe[1554]='Bless`(barakh): This word is found more frequently in the Old Testament than in the New Testament, and is used in different relations.<P>(1) It is first met in <a onClick="return mV(\'Gen\',1,22);">Ge 1:22</a> at the introduction of animal life upon the earth, where it is written, "And God blessed them, saying, Be fruitful, and multiply," etc. The context furnishes the key to its meaning, which is the bestowal of good, and in this particular place the pleasure and power of increase in kind. Thus it is generally employed in both Testaments, the context always determining the character of the bestowal; for instance (where man is the recipient), whether the good is temporal or spiritual, or both.<P>Occasionally, however, a different turn is given to it as in <a onClick="return mV(\'Gen\',2,3);">Ge 2:3</a> the King James Version, where it is written, "And God blessed the seventh day, and hallowed it." Here the good consists in the setting apart and consecrating of that day for His use.<P>(2) In the foregoing instances the Creator is regarded as the source of blessing and the creature the recipient, but the order is sometimes reversed, and the creature (man) is the source and the Creator the recipient. In <a onClick="return mV(\'Gen\',24,48);">Ge 24:48</a>, for example, Abraham\'s servant says, "I bowed my head, and worshipped Yahweh, and blessed Yahweh, the God of my master Abraham," where the word evidently means to worship God, to exalt and praise Him.<P>(3) There is a third use where men only are considered. In <a onClick="return mV(\'Gen\',24,60);">Ge 24:60</a>, her relatives "blessed Rebekah, and said unto her, Our sister, be thou the mother of thousands of ten thousands" (the King James Version "millions"), where the word expresses the wish or hope for the bestowal of the good designated. There are also instances where such a blessing of man by man may be taken in the prophetic sense, as when Isaac blessed Jacob (<a onClick="return mV(\'Gen\',27,4,27);">Ge 27:4, 27</a>), putting himself as it were in God\'s place, and with a sense of the Divine concurrence, pronouncing the good named. Here the word becomes in part a prayer for, and in part a prediction of, the good intended. Balaam\'s utterances are simply prophetic of Israel\'s destiny (<a onClick="return mV(\'Num\',23,9,11,23);">Nu 23:9-11, 23</a> margin, <a onClick="return mV(\'Num\',23,24);">Nu 23:24</a>).<P>Although these illustrations are from the Old Testament the word is used scarcely differently in the New Testament; "The blessing of bread, of which we read in the Gospels, is equivalent to giving thanks for it, the thought being that good received gratefully comes as a blessing"; compare <a onClick="return mV(\'Mat\',14,19);">Mt 14:19</a> and <a onClick="return mV(\'Mat\',15,36);">Mt 15:36</a> with <a onClick="return mV(\'1Cr\',11,24);">1Co 11:24</a> (Adeney, HDB, I, 307).`<a href="./study/isbe/search.html?string=BENEDICTION">BENEDICTION</a>`69';
isbe[1555]='Blessed`bles\'-ed (barukh): Where God is referred to, this word has the sense of "praise," as in <a onClick="return mV(\'1Sa\',25,32);">1Sa 25:32</a>, "Blessed be Yahweh, the God of Israel." But where man is in mind it is used in the sense of "happy" or "favored," and most frequently so in the Psalms and the Gospels, as for example, "Blessed is the man that walketh not in the counsel of the wicked" (<a onClick="return mV(\'Psa\',1,1);">Ps 1:1</a>); "Blessed art thou among women" (<a onClick="return mV(\'Luk\',1,42);">Lu 1:42</a>); "Blessed are the poor in spirit" (<a onClick="return mV(\'Mat\',5,3);">Mt 5:3</a>).`<a href="./study/isbe/search.html?string=BEATITUDES">BEATITUDES</a>`1';
isbe[1556]='Blessedness`bles\'-ed-nes: This translation of makarismos (a word signifying "beatification" or "the ascription of blessing"), is used but three times, in <a onClick="return mV(\'Rom\',4,6,9);">Ro 4:6, 9</a>, and <a onClick="return mV(\'Gal\',4,15);">Ga 4:15</a>, in the King James Version only. In the first two instances it refers to the happy state or condition of a man to whom Christ\'s righteousness is imputed by faith, and in the last to a man\'s experience of that condition.``1';
isbe[1557]='Blessing`(berakhah; eulogia): Sometimes means the form of words used in invoking the bestowal of good, as in <a onClick="return mV(\'Deu\',33,1);">De 33:1</a>; <a onClick="return mV(\'Jos\',8,34);">Jos 8:34</a>; and <a onClick="return mV(\'Jam\',3,10);">Jas 3:10</a>. Sometimes it means the good or the benefit itself which has been conferred, as in <a onClick="return mV(\'Gen\',27,36);">Ge 27:36</a>, "Hast thou not reserved a blessing for me?" and <a onClick="return mV(\'Pro\',10,22);">Pr 10:22</a>, "The blessing of Yahweh, it maketh rich." "The cup of blessing" (to poterion tes eulogias, a special use of the word in <a onClick="return mV(\'1Cr\',10,16);">1Co 10:16</a>), means the cup for which we bless God, or which represents to us so much blessing from God.``69';
isbe[1558]='Blessing, Cup of`(to poterion tes eulogias, "the consecrated cup," <a onClick="return mV(\'1Cr\',10,16);">1Co 10:16</a>): A technical term from the Jewish liturgy transferred to the Lord\'s Supper, and signifying the cup of wine upon which a blessing was pronounced. The suggestion that it carries with it a higher significance, as a cup that brings blessing, is not without force. The succeeding words, "we bless," are equivalent to "for which we give thanks." It was consecrated by thanksgiving and prayer.`<a href="./study/isbe/search.html?string=CUP">CUP</a>`1';
isbe[1559]='Blessing, Valley of``<a href="./study/isbe/search.html?string=BERACAH">BERACAH</a>`1';
isbe[1560]='Blindfold`blind\'-fold (perikalupto): A sport common among the children of ancient times, in which the blindfolded were struck on the cheek, then asked who had struck them, and not let go until they had correctly guessed. This treatment was accorded Christ by his persecutors (<a onClick="return mV(\'Luk\',22,64);">Lu 22:64</a>).``1';
isbe[1561]='Blinding`blind\'-ing.`<a href="./study/isbe/search.html?string=PUNISHMENTS">PUNISHMENTS</a>`1';
isbe[1562]='Blindness`blind\'-ness (\'awar, and variants; tuphlos): The word blind is used as a verb, as <a onClick="return mV(\'Jhn\',12,40);">Joh 12:40</a>, usually in the sense of obscuring spiritual perception. In reference to physical blindness it is used as a noun frequently or else as an adjective with the noun man. There are 54 references to this condition, and there is no reason to believe, as has been surmised, that blindness was any less rife in ancient times than it is now, when defective eyes and bleared, inflamed lids are among the commonest and most disgusting sights in a Palestine crowd. In the Papyrus Ebers (1500 BC) there are enumerated a number of diseases of the eye and a hundred prescriptions are given for their treatment. That the disease occurred in children and caused destruction and atrophy of the eyeball is testified to by the occurrence of a considerable number of mummy heads, in which there is marked diminution in size of one orbit. The commonest disease is a purulent ophthalmia, a highly infectious condition propagated largely by the flies which can be seen infesting the crusts of dried secretion undisturbed even on the eyes of infants. (In Egypt there is a superstition that it is unlucky to disturb them.) This almost always leaves the eyes damaged with bleared lids, opacities of the cornea, and sometimes extensive internal injury as well. Like other plagues, this disease was thought to be a Divine infliction (<a onClick="return mV(\'Exd\',4,11);">Ex 4:11</a>). Minor forms of the disease destroy the eyelashes and produce the unsightly tender-eyes (in <a onClick="return mV(\'Gen\',29,17);">Ge 29:17</a> the word rakh may mean simply "weak").<P>Blindness from birth is the result of a form of this disease known as ophthalmia neonatorum which sets in a few days after birth. I have seen cases of this disease in Palestine. Sometimes ophthalmia accompanies malarial fever (<a onClick="return mV(\'Lev\',26,16);">Le 26:16</a>). All these diseases are aggravated by sand, and the sun glare, to which the unprotected inflamed eyes are exposed. Most of the extreme cases which one sees are beyond remedy—and hence, the giving of sight to the blind is generally put in the front of the mighty works of healing by our Lord. The methods used by Him in these miracles varied probably according to the degree of faith in the blind man; all were merely tokens, not intended as remedies. The case of the man in <a onClick="return mV(\'Mar\',8,22);">Mr 8:22</a> whose healing seemed gradual is an instance of the phenomenon met with in cases where, by operation, sight has been given to one congenitally blind, where it takes some time before he can interpret his new sensations.<P>The blindness of old age, probably from senile cataract, is described in the cases of Eli at 98 years of age (<a onClick="return mV(\'1Sa\',3,2);">1Sa 3:2</a>; <a onClick="return mV(\'1Sa\',4,15);">4:15</a>), Ahijah (<a onClick="return mV(\'1Ki\',14,4);">1Ki 14:4</a>), and Isaac (<a onClick="return mV(\'Gen\',27,1);">Ge 27:1</a>). The smiting of Elymas (<a onClick="return mV(\'Act\',13,11);">Ac 13:11</a>) and the Syrian soldiers (<a onClick="return mV(\'2Ki\',6,18);">2Ki 6:18</a>) was either a miraculous intervention or more probably a temporary hypnotism; that of Paul (<a onClick="return mV(\'Act\',9,8);">Ac 9:8</a>) was doubtless a temporary paralysis of the retinal cells from the bright light. The "scales" mentioned were not material but in the restoration of his sight it seemed as if scales had fallen from his eyes. It probably left behind a weakness of the eyes (see <a href="./study/isbe/search.html?string=THORN+IN+THE+FLESH">THORN IN THE FLESH</A>). That blindness of Tobit (Tobit 2:10), from the irritation of sparrows\' dung, may have been some form of conjunctivitis, and the cure by the gall of the fish is paralleled by the account given in Pliny (xxxii.24) where the gall of the fish Callionymus Lyra is recommended as an application in some cases of blindness. The hypothesis that the gall was used as a pigment to obscure the whiteness of an opaque cornea (for which Indian ink tattooing has been recommended, not as a cure but to remove the unsightliness of a white spot) has nothing in its favor for thereby the sight would not be restored. The only other reference to medicaments is the figurative mention of eyesalve in <a onClick="return mV(\'Rev\',3,18);">Re 3:18</a>.<P>Blindness unfitted a man for the priesthood (<a onClick="return mV(\'Lev\',21,18);">Le 21:18</a>); but care of the blind was specially enjoined in the Law (<a onClick="return mV(\'Lev\',19,14);">Le 19:14</a>), and offenses against them are regarded as breaches of Law (<a onClick="return mV(\'Deu\',27,18);">De 27:18</a>).<P>Figuratively, blindness is used to represent want of mental perception, want of prevision, recklessness, and incapacity to perceive moral distinctions (<a onClick="return mV(\'Isa\',42,16,18,19);">Isa 42:16, 18-19</a>; <a onClick="return mV(\'Mat\',23,16);">Mt 23:16</a>ff; <a onClick="return mV(\'Jhn\',9,39);">Joh 9:39</a>ff).``107';
isbe[1563]='Blindness, Judicial`ju-dish\'-al, joo-dish\'-al: Among the ancient Israelites in the pre-Canaanite period disputes within the family or clan or tribe would be settled by the natural head of the family or clan or tribe. According to <a onClick="return mV(\'Exd\',18,\'1-\');">Ex 18</a> Moses, as the leader of the tribes, settled all disputes. But he was compelled to appoint a body of magistrates—heads of families—to act in conjunction with himself, and under his judicial oversight. These magistrates settled ordinary disputes while he reserved for himself the more difficult cases. After the conquest of Canaan, the conditions of life became so complex, and questions of a difficult nature so constantly arose, that steps were taken<P>(1) to appoint official judges—elders of the city (<a onClick="return mV(\'Jos\',8,33);">Jos 8:33</a>; <a onClick="return mV(\'Jdg\',8,3);">Jud 8:3</a>; <a onClick="return mV(\'1Ki\',21,8);">1Ki 21:8</a>);<P>(2) to codify ancient custom, and<P>(3) to place the administration of justice on an organized basis.<P>It is significant that in one of the oldest documents in the Pentateuch—namely, in the Book of the Covenant (<a onClick="return mV(\'Exd\',20,\'20-\');">Ex 20:20-23:33</a>)—the miscarriage of justice was of such frequent occurrence as to require special mention (<a onClick="return mV(\'Exd\',23,1,2,3,6,7,8);">23:1-3, 6-8</a>). In fact the Old Testament abounds with allusions to the corruption and venality of the magisterial bench (<a onClick="return mV(\'Deu\',16,19);">De 16:19</a>; <a onClick="return mV(\'Lev\',19,15);">Le 19:15</a>; <a onClick="return mV(\'Amo\',5,12);">Am 5:12</a>; <a onClick="return mV(\'Mic\',3,11);">Mic 3:11</a>; <a onClick="return mV(\'Mic\',7,3);">7:3</a>; <a onClick="return mV(\'Isa\',1,23);">Isa 1:23</a>; <a onClick="return mV(\'Isa\',5,23);">5:23</a>; <a onClick="return mV(\'Zep\',3,3);">Ze 3:3</a>; <a onClick="return mV(\'Psa\',15,5);">Ps 15:5</a>; <a onClick="return mV(\'Pro\',17,23);">Pr 17:23</a>). According to the Book of the Covenant (<a onClick="return mV(\'Exd\',23,8);">Ex 23:8</a>) \'a bribe blindeth the eyes of the open-eyed.\' This descriptive phrase indicates a prolific cause of the miscarriage of justice—an exceedingly common thing in the East, in the present no less than in the past. The prohibition in <a onClick="return mV(\'Exd\',23,3);">Ex 23:3</a>, "Neither shalt thou favor a poor man in his cause," is rather remarkable and many scholars are of opinion that "a great man" should be read for "a poor man" as, according to <a onClick="return mV(\'Exd\',23,6);">23:6</a> the King James Version, the common fault was "wresting the judgment of the poor." The rich alone could offer a satisfactory bribe. But it should be pointed out that <a onClick="return mV(\'Lev\',19,15);">Le 19:15</a> legislates in view of both tendencies—"respecting the person of the poor:" and "honoring the person of the mighty." Sympathy with the poor no less than a bribe from the well-to-do might affect the judgment of the bench. <a onClick="return mV(\'Deu\',16,19);">De 16:19</a> reproduces the words of the Book of the Covenant with a slight alteration—namely, "eyes of the wise" for "eyes of the open-eyed" ("them that have sight"). Both phrases vividly bring out the baneful effect of bribery—a magistrate otherwise upright and honest—open-eyed and wise—may be unconsciously yet effectively influenced in his judicial decisions by a gift sufficiently large. A similar phrase is found in the story of Abraham\'s life (<a onClick="return mV(\'Gen\',20,16);">Ge 20:16</a>). A gift of a thousand shekels to Abraham was intended to be a "covering of the eyes" for Sarah, i.e. compensation or reparation for the wrong which had been done. For a gift of such magnitude she ought to wink at the injury. <a onClick="return mV(\'Job\',9,24);">Job 9:24</a> declares in his bitterness that God "covereth the faces of the judges"—inflicts judicial blindness on them so that justice in this world is out of the question. Judicial corruption was the burden of the prophets\' preaching—"judges loved bribes, and followed after rewards," with the result that "the fatherless" and "the widow" were helpless to have their grievances redressed (<a onClick="return mV(\'Isa\',1,23);">Isa 1:23</a>). A satisfactory reward would always secure the acquittal of the offender (<a onClick="return mV(\'Isa\',5,23);">Isa 5:23</a>). Micah combines judges, priests and prophets under a similar charge; they are all guilty of gross venality (<a onClick="return mV(\'Isa\',3,11);">Isa 3:11</a>). <a onClick="return mV(\'Pro\',17,23);">Pr 17:23</a> defines the wicked person as one who is always prepared to take a "bribe out of the bosom, to pervert the ways of justice"; on the other hand the good man is he who will not take a reward against the innocent (<a onClick="return mV(\'Psa\',15,5);">Ps 15:5</a>) or "shaketh his hands from taking a bribe" (<a onClick="return mV(\'Isa\',33,15);">Isa 33:15</a>). In regard to Yahweh alone is absolute incorruptibility affirmed—he "regardeth not persons, nor taketh reward" (<a onClick="return mV(\'Deu\',10,17);">De 10:17</a>).``103';
isbe[1564]='Blood`blud (dam, probably from \'adham "to be red"; haima): Used in the Old Testament to designate the life principle in either animal or vegetable, as the blood of man or the juice of the grape (<a onClick="return mV(\'Lev\',17,11);">Le 17:11</a>, et al.); in the New Testament for the blood of an animal, the atoning blood of Christ, and in both Old Testament and New Testament in a figurative sense for bloodshed or murder (<a onClick="return mV(\'Gen\',37,26);">Ge 37:26</a>; <a onClick="return mV(\'Hsa\',4,2);">Ho 4:2</a>; <a onClick="return mV(\'Rev\',16,6);">Re 16:6</a>).<P>1. Primitive Ideas:<P>Although the real function of the blood in the human system was not fully known until the fact of its circulation was established by William Harvey in 1615, nevertheless from the earliest times a singular mystery has been attached to it by all peoples. Blood rites, blood ceremonies and blood feuds are common among primitive tribes. It came to be recognized as the life principle long before it was scientifically proved to be. Naturally a feeling of fear, awe and reverence would be attached to the shedding of blood. With many uncivilized peoples scarification of the body until blood flows is practiced. Blood brotherhood or blood friendship is established by African tribes by the mutual shedding of blood and either drinking it or rubbing it on one another\'s bodies. Thus and by the inter-transfusion of blood by other means it was thought that a community of life and interest could be established.<P>2. Hebrew and Old Testament Customs:<P>Notwithstanding the ignorance and superstition surrounding this suggestively beautiful idea, it grew to have more than a merely human significance and application. For this crude practice of inter-transference of human blood there came to be a symbolic substitution of animal blood in sprinkling or anointing. The first reference in the Old Testament to blood (<a onClick="return mV(\'Gen\',4,10);">Ge 4:10</a>) is figurative, but highly illustrative of the reverential fear manifested upon the shedding of blood and the first teaching regarding it.<P>The rite of circumcision is an Old Testament form of blood ceremony. Apart from the probable sanitary importance of the act is the deeper meaning in the establishment of a bond of friendship between the one upon whom the act is performed and Yahweh Himself. In order that Abraham might become "the friend of God" he was commanded that he should be circumcised as a token of the covenant between him and God (<a onClick="return mV(\'Gen\',17,10,11);">Ge 17:10-11</a>; see <a href="./study/isbe/search.html?string=CIRCUMCISION">CIRCUMCISION</A>).<P>It is significant that the eating of blood was prohibited in earliest Bible times (<a onClick="return mV(\'Gen\',9,4);">Ge 9:4</a>). The custom probably prevailed among heathen nations as a religious rite (compare <a onClick="return mV(\'Psa\',16,4);">Ps 16:4</a>). This and its unhygienic influence together doubtless led to its becoming taboo. The same prohibition was made under the Mosaic code (<a onClick="return mV(\'Lev\',7,26);">Le 7:26</a>; see <a href="./study/isbe/search.html?string=SACRIFICE">SACRIFICE</A>).<P>Blood was commanded to be used also for purification or for ceremonial cleansing (<a onClick="return mV(\'Lev\',14,\'5-7\',51,52);">Le 14:5-7, 51-52</a>; <a onClick="return mV(\'Num\',19,4);">Nu 19:4</a>), provided, however, that it be taken from a clean animal (see <a href="./study/isbe/search.html?string=PURIFICATION">PURIFICATION</A>).<P>In all probability there is no trace of the superstitious use of blood in the Old Testament, unless perchance in <a onClick="return mV(\'1Ki\',22,38);">1Ki 22:38</a> (see <a href="./study/isbe/search.html?string=BATHING">BATHING</A>); but everywhere it is vested with cleansing, expiatory, and reverently symbolic qualities.<P>3. New Testament Teachings:<P>As in the transition from ancient to Hebrew practice, so from the Old Testament to the New Testament we see an exaltation of the conception of blood and blood ceremonies. In Abraham\'s covenant his own blood had to be shed. Later an expiatory animal was to shed blood (<a onClick="return mV(\'Lev\',5,6);">Le 5:6</a>; see <a href="./study/isbe/search.html?string=ATONEMENT">ATONEMENT</A>), but there must always be a shedding of blood. "Apart from shedding of blood there is no remission" (<a onClick="return mV(\'Hbr\',9,22);">Heb 9:22</a>). The exaltation and dignifying of this idea finds its highest development then in the vicarious shedding of blood by Christ Himself (<a onClick="return mV(\'1Jo\',1,7);">1Jo 1:7</a>). As in the Old Testament "blood" was also used to signify the juice of grapes, the most natural substitute for the drinking of blood would be the use of wine. Jesus takes advantage of this, and introduces the beautiful and significant custom (<a onClick="return mV(\'Mat\',26,28);">Mt 26:28</a>) of drinking wine and eating bread as symbolic of the primitive intertransfusion of blood and flesh in a pledge of eternal friendship (compare <a onClick="return mV(\'Exd\',24,6,7);">Ex 24:6-7</a>; <a onClick="return mV(\'Jhn\',6,\'53-56\');">Joh 6:53-56</a>). This is the climactic observance of blood rites recorded in the Bible.<P>LITERATURE.<P>Trumbull, The Blood Covenant and The Threshold Covenant; Westermarck, The Origin and Development of the Moral Ideas; Robertson Smith, Lectures on the Religion of the Semites.``25';
isbe[1565]='Blood And Water`(haima kai hudor): The remarkable passage (<a onClick="return mV(\'Jhn\',19,34);">Joh 19:34</a>) from which this expression is taken refers to the piercing of the Savior\'s side by the soldier. The evangelist notes here what he, as an eyewitness of the crucifixion, had seen as a surprising fact. Whereon this surprise was founded cannot now be more than guessed at. Nor is it necessary here to discuss the reason or reasons why the apostle mentions the fact at all in his report, whether merely for historical accuracy and completeness, or as a possible proof of the actual death of Christ, which at an early date became a subject of doubt among certain Christian sects, or whether by it he wished to refer to the mystical relation of baptismal cleansing ("water") and the atonement ("blood") as signified thereby. Let it suffice to state that a reference often made to <a onClick="return mV(\'1Jo\',5,6,8);">1Jo 5:6, 8</a> is here quite out of place. This passage, though used by certain Fathers of the church as a proof of the last-named doctrine, does not indeed refer to this wonderful incident of the crucifixion story. The argument of <a onClick="return mV(\'1Jo\',5,8);">1Jo 5:8</a> concerns the Messiahship of Jesus, which is proved by a threefold witness, for He is the one whom at the baptism of John ("water") God attested as the Messiah by the heavenly voice, "This is my beloved Son," who at the crucifixion ("blood") had the testimony that the Father had accepted His atoning sacrifice, and whose promise of sending the Comforter fulfilled on Pentecost ("spirit") presented us with the final proof of the completed Messianic task. The same expression in <a onClick="return mV(\'1Jo\',5,6);">1Jo 5:6</a> refers probably to the same argument with the implied meaning that Jesus came not only by the merely ceremonial water of baptism, but also by the more important, because vivifying, blood of atonement.<P>The physiological aspect of this incident of the crucifixion has been first discussed by Gruner (Commentatio de morte Jesu Christi vera, Halle, 1805), who has shown that the blood released by the spear-thrust of the soldier must have been extravasated before the opening of the side took place, for only so could it have been poured forth in the described manner. While a number of commentators have opposed this view as a fanciful explanation, and have preferred to give the statement of the evangelist a symbolical meaning in the sense of the doctrines of baptism and eucharist (so Baur, Strauss, Reuss and others), some modern physiologists are convinced that in this passage a wonderful phenomenon is reported to us, which, inexplicable to the sacred historian, contains for us an almost certain clue to the real cause of the Savior\'s death. Dr. Stroud (On the Physiological Cause of the Death of Christ, London, 1847) basing his remarks on numerous postmortems, pronounced the opinion that here we had a proof of the death of Christ being due not to the effects of crucifixion but to "laceration or rupture of the heart" as a consequence of supreme mental agony and sorrow. It is well attested that usually the suffering on the cross was very prolonged. It often lasted two or three days, when death would supervene from exhaustion. There were no physical reasons why Christ should not have lived very much longer on the cross than He did. On the other hand, death caused by laceration of the heart in consequence of great mental suffering would be almost instantaneous. In such a case the phrase "of a broken heart," becomes literally true. The life blood flowing through the aperture or laceration into the pericardium or caul of the heart, being extravasated, soon coagulates into the red clot (blood) and the limpid serum (water). This accumulation in the heart-sac was released by the spear-thrust of the soldier (which here takes providentially the place of a postmorten without which it would have been impossible to determine the real cause of death), and from the gaping wound there flow the two component parts of blood distinctly visible.<P>Several distinguished physicians have accepted Dr. Stroud\'s argument, and some have strengthened it by the observation of additional symptoms. We may mention Dr. James Begbie, fellow and late president of the Royal College of Physicians of Edinburgh, Sir J. Y. Simpson, professor at the University of Edinburgh, and others (see Dr. Hanna, Our Lord\'s Life on Earth, Appendix I). The latter refers to the loud cry, mentioned by the Synoptists (<a onClick="return mV(\'Mat\',27,50);">Mt 27:50</a>; <a onClick="return mV(\'Mar\',15,37);">Mr 15:37</a>; <a onClick="return mV(\'Luk\',23,46);">Lu 23:46</a>), which preceded the actual death of Jesus, as a symptom characteristic of cases of "broken heart." He adds that Dr. Walshe, professor of medicine in University College, London, one of the greatest authorities on the diseases of the heart, says that a "piercing shriek" is always uttered in such cases immediately before the end.<P>While we may never reach a state of absolute certainty on this subject, there is no valid reason to deny the probability of this view of the death of Christ. It certainly gives a more solemn insight into Christ\'s spiritual anguish, "the travail of his soul" on our behalf, which weighed upon Him so heavily that long before the usual term of bodily and therefore endurable suffering of crucified persons Christ\'s loving heart broke, achieving the great atoning sacrifice for all mankind.``106';
