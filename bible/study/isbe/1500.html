isbe[1569]='Bloodguiltiness`blud-gilt\'-i-nes: Found in the King James Version only in <a onClick="return mV(\'Psa\',51,14);">Ps 51:14</a>. The Revised Version (British and American) adds <a onClick="return mV(\'Exd\',22,2,3);">Ex 22:2-3</a>; <a onClick="return mV(\'1Sa\',25,26,33);">1Sa 25:26, 33</a>. <a onClick="return mV(\'Eze\',18,13);">Eze 18:13</a> seems to indicate that the phrase does not necessarily signify bloodshed, but any grievous sin which, if it remains, will block God\'s favor to His land and people (compare <a onClick="return mV(\'Deu\',21,8);">De 21:8</a>; <a onClick="return mV(\'Isa\',1,15);">Isa 1:15</a>). <a onClick="return mV(\'Psa\',51,\'1-\');">Ps 51</a> is to be interpreted in this light.``1';
isbe[1570]='Bloodshedding`blud\'-shed-ing (haimatekchusia, <a onClick="return mV(\'Hbr\',9,22);">Heb 9:22</a>): In this passage the indispensability of expiating sacrifice is positively set forth.``1';
isbe[1571]='Bloodthirsty`blud\'-thurs-ti (\'anshe damim, "men of blood"): This occurs in the King James Version only in <a onClick="return mV(\'Pro\',29,10);">Pr 29:10</a>; in the Revised Version (British and American), <a onClick="return mV(\'Psa\',5,6);">Ps 5:6</a>; <a onClick="return mV(\'Psa\',55,23);">55:23</a>; <a onClick="return mV(\'Psa\',59,2);">59:2</a>; <a onClick="return mV(\'Psa\',139,19);">139:19</a>.`<a href="./study/isbe/search.html?string=BLOODY">BLOODY</a>`1';
isbe[1572]='Bloody`blud\'-i (dam = "blood" of man or an animal; and where the King James translators have rendered with the adjective "bloody," the Hebrew employs the noun in the construct case, "of blood"): "A bridegroom of blood" (<a onClick="return mV(\'Exd\',4,25,26);">Ex 4:25-26</a>, the King James Version bloody husband). Zipporah, not being an Israelite, probably objected to the circumcision of infants, if not to the rite altogether; apprehending, however, that her husband\'s life was imperiled possibly through some grievous sickness (<a onClick="return mV(\'Exd\',4,24);">Ex 4:24</a>) because of their disobedience in this particular, she performed the ceremony herself upon her son, saying, "A bridegroom of blood art thou to me."<P>In the Revised Version (British and American) the expression (the King James Version "bloody") is variously rendered, "man of blood" (<a onClick="return mV(\'2Sa\',16,7,8);">2Sa 16:7-8</a>); "men of blood" (<a onClick="return mV(\'Psa\',26,9);">Ps 26:9</a>); "bloodthirsty" (<a onClick="return mV(\'Psa\',5,6);">Ps 5:6</a>; <a onClick="return mV(\'Psa\',59,2);">59:2</a>; <a onClick="return mV(\'Psa\',139,19);">139:19</a>). In <a onClick="return mV(\'2Sa\',21,1);">2Sa 21:1</a>, "It is for Saul, and for his bloody house," might be rendered "Upon Saul and his house rests bloodshed."<P>Ezekiel calls Jerusalem "the bloody city" (<a onClick="return mV(\'Eze\',22,2);">Eze 22:2</a>; <a onClick="return mV(\'Eze\',24,6);">24:6</a>; compare <a onClick="return mV(\'Eze\',7,23);">Eze 7:23</a>), referring to those unjustly put to death by the wicked rulers of Jerusalem. Nineveh also is called "the bloody city" (<a onClick="return mV(\'Nah\',3,1);">Na 3:1</a>). The capital here virtually stands for the kingdom, and history bears witness to the enormous cruelties perpetrated by the Assyrian rulers. It is siege on siege, pools of blood everywhere, the flaying of men alive, "great baskets stuffed with the salted heads of their foes." For two hundred years it is th e story of brute force and ruthless cruelty. "The prey departeth not." And now every cruelty which they have visited upon others is to be turned upon themselves (<a onClick="return mV(\'Nah\',3,19);">Na 3:19</a>).``91';
isbe[1573]='Bloody Flux`fluks (puretos kai dusenteria, literally "fever and dysentery"): The disease by which the father of Publius was afflicted in Malta (<a onClick="return mV(\'Act\',28,8);">Ac 28:8</a>). the Revised Version (British and American) calls it "dysentery"; a common and dangerous disease which in Malta is often fatal to soldiers of the garrison even at the present day (Aitken, Pract. of Medicine, II, 841). It is also prevalent in Palestine at certain seasons, and in Egypt its mortality was formerly about 36 percent. Its older name was due to the discharge of blood from the intestine. Sometimes portions of the bowel become gangrenous and slough, the condition described as affecting Jehoram (<a onClick="return mV(\'2Ch\',21,19);">2Ch 21:19</a>). There seems to have been an epidemic of the disease at the time of his seizure (<a onClick="return mV(\'2Ch\',21,14,15);">2Ch 21:14-15</a>), and in the case of the king it left behind it a chronic ulcerated condition, ending in gangrene. Somewhat similar conditions of chronic intestinal ulceration following epidemic dysentery I have seen in persons who had suffered from this disease in India.``107';
isbe[1574]='Bloody Sweat`(swet hosei thromboi haimatos): Described in <a onClick="return mV(\'Luk\',22,44);">Lu 22:44</a> as a physical accompaniment of our Lord\'s agony at Gethsemane (on the passage, which is absent in some manuscripts, see Westcott and Hort, The New Testament in Greek). Many old writers take this to mean that the perspiration dropped in the same manner as clots of blood drop from a wound, regarding the Greek word prefixed as expressing merely a comparison as in <a onClick="return mV(\'Mat\',28,3);">Mt 28:3</a>, where leukon hos chion means "white as snow." Cases of actual exudation of blood are described in several of the medieval accounts of stigmatization, and Lefebvre describes the occurrence of something similar in his account of Louise Lateau in 1870. For references to these cases see the article "Stigmatization" in Encyclopedia Britannica (11th edition), XXII, 550. It is perhaps in favor of the older interpretation that the word used by Aeschylus for drops of blood is stagon (Agam. 1122) and by Euripides stalagmos, not thromboi. None of the instances given by Tissot (Traite des nerfs, 279), or Schenck (Observ. med., III, 45:5), can be said to be unimpeachable; but as the agony of our Lord was unexampled in human experience, it is conceivable that it may have been attended with physical conditions of a unique nature.``107';
isbe[1575]='Bloom; Blossom`bloom, blos\'-um.`<a href="./study/isbe/search.html?string=FLOWERS">FLOWERS</a>`1';
isbe[1576]='Blot`blot (mum, contracted from me\'um, "spot"): Occurs in the sense of scorn (<a onClick="return mV(\'Pro\',9,7);">Pr 9:7</a>). In <a onClick="return mV(\'Job\',31,7);">Job 31:7</a> (the King James Version) it is used figuratively of a moral defect; the Revised Version (British and American) has "spot." Blot out (machah, "to wipe out," exaleipho, "to smear out"), to obliterate or destroy: "That a tribe be not blotted out" (the King James Version "destroyed," <a onClick="return mV(\'Jdg\',21,17);">Jud 21:17</a>). To blot men out of God\'s book is to cut them off by an untimely death (<a onClick="return mV(\'Exd\',32,32);">Ex 32:32</a>).<P>Figuratively: "To blot out sin" is to forgive sin fully (<a onClick="return mV(\'Psa\',51,1,9);">Ps 51:1, 9</a>; <a onClick="return mV(\'Act\',3,19);">Ac 3:19</a>; <a onClick="return mV(\'Col\',2,14);">Col 2:14</a>). Not to blot out sin is to reserve for punishment (<a onClick="return mV(\'Neh\',4,5);">Ne 4:5</a>). The names of those who inherit eternal life are not blotted out of the "book of life" (<a onClick="return mV(\'Rev\',3,5);">Re 3:5</a>).`<a href="./study/isbe/search.html?string=BOOK+OF+LIFE">BOOK OF LIFE</a>; <a href="./study/isbe/search.html?string=BOOK+OF+REMEMBRANCE">BOOK OF REMEMBRANCE</a>; <a href="./study/isbe/search.html?string=FORGIVENESS">FORGIVENESS</a>`1';
isbe[1577]='Blow`blo (nashaph): Used with reference to the wind (<a onClick="return mV(\'Exd\',15,10);">Ex 15:10</a>; <a onClick="return mV(\'Psa\',78,26);">Ps 78:26</a>; <a onClick="return mV(\'Psa\',147,18);">147:18</a>; pneo, "to breathe," <a onClick="return mV(\'Luk\',12,55);">Lu 12:55</a>; <a onClick="return mV(\'Jhn\',3,8);">Joh 3:8</a>; <a onClick="return mV(\'Rev\',7,1);">Re 7:1</a>); taqa\', with reference to trumpet sound (<a onClick="return mV(\'Num\',10,\'3-10\');">Nu 10:3-10</a>; <a onClick="return mV(\'Num\',31,6);">31:6</a> the King James Version; <a onClick="return mV(\'Jdg\',7,18,20);">Jud 7:18, 20</a>; <a onClick="return mV(\'1Ki\',1,34);">1Ki 1:34</a>; <a onClick="return mV(\'1Ch\',15,24);">1Ch 15:24</a>; <a onClick="return mV(\'Psa\',81,3);">Ps 81:3</a>; <a onClick="return mV(\'Eze\',33,3,6);">Eze 33:3, 6</a>; <a onClick="return mV(\'Hsa\',5,8);">Ho 5:8</a>; <a onClick="return mV(\'Joe\',2,1,15);">Joe 2:1, 15</a>); puach, with reference to the strong expulsion of the breath (<a onClick="return mV(\'Eze\',21,31);">Eze 21:31</a>; <a onClick="return mV(\'Eze\',22,20,21);">22:20-21</a>; <a onClick="return mV(\'Hag\',1,9);">Hag 1:9</a>; <a onClick="return mV(\'Isa\',40,7);">Isa 40:7</a>; <a onClick="return mV(\'Isa\',54,16);">54:16</a>; <a onClick="return mV(\'Job\',20,26);">Job 20:26</a>); nashaph, with reference to a forcible slap or stroke with hand or an instrument (<a onClick="return mV(\'Psa\',39,10);">Ps 39:10</a>; <a onClick="return mV(\'Isa\',40,24);">Isa 40:24</a>; <a onClick="return mV(\'Jer\',14,17);">Jer 14:17</a> the King James Version).``77';
isbe[1578]='Blue`bloo.`<a href="./study/isbe/search.html?string=COLORS">COLORS</a>`1';
isbe[1579]='Boanerges`bo-a-nur\'-jez (Boanerges; bene reghesh, "sons of thunder"): The surname bestowed by Jesus upon James and John, the sons of Zebedee, when they were ordained to the apostleship (<a onClick="return mV(\'Mar\',3,17);">Mr 3:17</a>). See <a href="./study/isbe/search.html?string=JAMES">JAMES</A>. It has also been regarded as an equivalent of the "Heavenly Twins," the Sons of Zeus or Thunder. According to this interpretation, the name Boanerges would represent the Dioscuri in some form or other of their varied presentation in the cults of the Mediterranean (compare Professor J. Rendel Harris in The Expositor, series vii, III, 146).``88';
isbe[1580]='Boar`bor (chazir): In lamenting the troubled state of the Jewish nation the Psalmist (<a onClick="return mV(\'Psa\',80,13);">Ps 80:13</a>) says: "The boar out of the wood doth ravage it, and the wild beasts of the field feed on it," with evident reference to Israel\'s enemies, the Assyrians, etc. The wild boar is abundant in certain parts of Palestine and Syria, especially in the thickets which border the lakes and rivers, as about the Chuleh, the sea of Galilee, the Jordan, and in the deltas of streams flowing into the Dead Sea, as Ghaur-us-Cafiyeh. Several fountains in Lebanon bear the name, \'Ain-ul-Chazir, though chazir is not an Arabic word, khanzir being the Arabic for "swine."`<a href="./study/isbe/search.html?string=SWINE">SWINE</a>`37';
isbe[1581]='Board`bord (qeresh, "a slab or plank," "deck of a ship," "bench," "board"): This word is found in <a onClick="return mV(\'Exd\',26,\'16-21\');">Ex 26:16-21</a>; <a onClick="return mV(\'Exd\',36,21);">36:21</a>ff; its plural occurs in <a onClick="return mV(\'Exd\',26,15,\'17-29\');">Ex 26:15, 17-29</a>; <a onClick="return mV(\'Exd\',35,11);">35:11</a>; <a onClick="return mV(\'Exd\',36,\'20-34\');">36:20-34</a>; <a onClick="return mV(\'Exd\',39,33);">39:33</a>; <a onClick="return mV(\'Exd\',40,18);">40:18</a>; <a onClick="return mV(\'Num\',3,36);">Nu 3:36</a>; <a onClick="return mV(\'Num\',4,31);">4:31</a>. This word also is used in translation of luach (<a onClick="return mV(\'Exd\',27,8);">Ex 27:8</a>; <a onClick="return mV(\'Exd\',38,7);">38:7</a>; <a onClick="return mV(\'Sgs\',8,9);">So 8:9</a>; <a onClick="return mV(\'Eze\',27,5);">Eze 27:5</a> the King James Version) = "a tablet" (of stone, wood or metal), "board," "plate," "table"; also of tsla\' = "rib," hence, a "side," "timber," "plank" (<a onClick="return mV(\'1Ki\',6,15);">1Ki 6:15</a>f). In <a onClick="return mV(\'1Ki\',6,9);">1Ki 6:9</a>, sedherah = "a rank," "a row," hence, "a range" or "board" is used. In the New Testament we find the expression "on board" in <a onClick="return mV(\'Act\',27,44);">Ac 27:44</a> the King James Version, in translation of epi sanisin = "planks."``77';
isbe[1582]='Boast`bost (halal, "to praise"; kauchaomai, "to vaunt oneself," used both in a good and a bad sense): To praise God: "In God have we made our boast all the day long" (<a onClick="return mV(\'Psa\',44,8);">Ps 44:8</a>); to praise oneself, to vaunt (<a onClick="return mV(\'Psa\',10,3);">Ps 10:3</a>). In the New Testament the Revised Version (British and American) frequently translates "glory," where the King James Version has "boast," in a good sense (<a onClick="return mV(\'2Cr\',7,14);">2Co 7:14</a>). In the sense of self-righteousness (<a onClick="return mV(\'Eph\',2,9);">Eph 2:9</a>; <a onClick="return mV(\'Rom\',2,17,23);">Ro 2:17, 23</a>). Boaster (alazon, "a braggart") occurs in the King James Version (<a onClick="return mV(\'Rom\',1,30);">Ro 1:30</a>; <a onClick="return mV(\'2Ti\',3,2);">2Ti 3:2</a>); the Revised Version (British and American) has "boastful."``1';
isbe[1583]='Boat`bot.`<a href="./study/isbe/search.html?string=SHIPS+and+BOATS">SHIPS AND BOATS</a>`1';
isbe[1584]='Boaz`bo\'-az (bo\'az; Booz; "quickness" (?) <a onClick="return mV(\'Rth\',2,\'1-\');">Ru 2-4</span>; <a onClick="return mV(\'1Ch\',2,11,12);">1Ch 2:11-12</a>; <a onClick="return mV(\'Mat\',1,5);">Mt 1:5</a>; <a onClick="return mV(\'Luk\',3,32);">Lu 3:32</a>):<P>(1) A resident of Bethlehem and kinsman of Elimelech, Naomi\'s husband. In <a onClick="return mV(\'Rth\',2,1);">Ru 2:1</a> he is described as a gibbor chayil, a phrase which can mean either "a mighty man of valor" or else "a man of position and wealth." The latter is probably the sense in which the phrase is applied to Boaz (compare <a onClick="return mV(\'1Sa\',9,1);">1Sa 9:1</a>). He had fields outside the town, and to them Ruth went to glean. Boaz noticed her and extended special kindness and protection to her, bidding her remain with his female workers, and charging the men not to illtreat her, and also giving her of the reapers\' food at mealtime. Boaz awoke one night and found Ruth lying at his feet. He praised her virtue, and promised to take charge of her if her dead husband\'s next-of-kin failed to do so. He laid her case before the next-of-kin, and finally redeemed the family property himself and bought as well the right to take Ruth in marriage. The son of Boaz and Ruth was Obed, father of Jesse, and grandfather of David. <a onClick="return mV(\'1Ch\',2,11,12);">1Ch 2:11-12</a> makes Boaz a descendant of Hezron, and so probably a chief of the Hezronite clan in Bethlehem. Jewish tradition identifies Boaz with Ibzan (<a onClick="return mV(\'Jdg\',12,\'8-10\');">Jud 12:8-10</a>).<P>Boaz "is set before us as a model of piety, generosity and chastity" (H. P. Smith, Old Testament History, 398). He found virtue and rewarded it. HPM, sections 501-8, gives a picture of the life of "a well-to-do landed proprietor of central Palestine," much of which could aptly be taken as a description of Boaz.<P>(2) The name of one of the two bronze pillars erected in front of Solomon\'s temple, the other being Jachin (<a onClick="return mV(\'1Ki\',7,21);">1Ki 7:21</a>; <a onClick="return mV(\'2Ch\',3,17);">2Ch 3:17</a>).`<a href="./study/isbe/search.html?string=JACHIN+and+BOAZ">JACHIN AND BOAZ</a>; <a href="./study/isbe/search.html?string=TEMPLE">TEMPLE</a>`149';
isbe[1585]='Boccas`bok\'-as (Bokkas): A priest in the line of Ezra (1Esdras 8:2) called Bukki in <a onClick="return mV(\'Ezr\',7,4);">Ezr 7:4</a> and Borith in 2Esdras 1:2.``1';
isbe[1586]='Bocheru`bo\'-ke-roo (bokheru): A son of Azrikam, Saul\'s descendant (<a onClick="return mV(\'1Ch\',8,38);">1Ch 8:38</a> = <a onClick="return mV(\'1Ch\',9,34);">1Ch 9:34</a>). For the ending ("-u"), compare the forms gashmu (<a onClick="return mV(\'Neh\',6,1,6);">Ne 6:1, 6</a>) and melikhu (<a onClick="return mV(\'Neh\',12,14);">Ne 12:14</a> the King James Version and the Revised Version, margin).``1';
isbe[1587]='Bochim`bo\'-kim (ha-bokhim): A place on the mountain west of Gilgal said to have been so named (literally "the weepers") because Israel wept there at the remonstrance of the angel (<a onClick="return mV(\'Jdg\',2,1,5);">Jud 2:1, 5</a>). No name resembling this has been discovered. Given on the occasion mentioned, it may not have endured. Many, following Septuagint, identify it with Bethel.``1';
isbe[1588]='Body`bod\'-i:<P>I. PHILOLOGICAL:<P>Generally speaking, the Old Testament language employs no fixed term for the human body as an entire organism in exact opposition to "soul" or "spirit." Various terms were employed, each of which denotes only one part or element of the physical nature, such as "trunk," "bones," "belly," "bowels," "reins," "flesh," these parts being used, by synecdoche, for the whole: etsem = "bone," or "skeleton," hence, "body," is found in <a onClick="return mV(\'Exd\',24,10);">Ex 24:10</a> the King James Version; <a onClick="return mV(\'Lam\',4,7);">La 4:7</a>; nephesh = "living organism" (<a onClick="return mV(\'Lev\',21,11);">Le 21:11</a>; <a onClick="return mV(\'Num\',6,6,7,11);">Nu 6:6-7, 11</a>; <a onClick="return mV(\'Num\',19,11,13,16);">19:11, 13, 16</a>; <a onClick="return mV(\'Hag\',2,13);">Hag 2:13</a>); nebhelah = "a flabby thing," "carcass" (<a onClick="return mV(\'Deu\',21,23);">De 21:23</a>; <a onClick="return mV(\'Isa\',26,19);">Isa 26:19</a>; <a onClick="return mV(\'Jer\',26,23);">Jer 26:23</a>; <a onClick="return mV(\'Jer\',36,30);">36:30</a>); beten = "womb" (<a onClick="return mV(\'Deu\',28,4,11,18,53);">De 28:4, 11, 18, 53</a>; <a onClick="return mV(\'Deu\',30,9);">30:9</a>; <a onClick="return mV(\'Job\',19,17);">Job 19:17</a> the King James Version; <a onClick="return mV(\'Psa\',132,11);">Ps 132:11</a>; <a onClick="return mV(\'Mic\',6,7);">Mic 6:7</a>); yarekh = "thigh," "generative parts," "body" (<a onClick="return mV(\'Jdg\',8,30);">Jud 8:30</a>); gewiyah = "a body, whether alive or dead" (<a onClick="return mV(\'1Sa\',31,10,12);">1Sa 31:10, 12</a>; <a onClick="return mV(\'2Ki\',8,5);">2Ki 8:5</a> the King James Version; <a onClick="return mV(\'Dan\',10,6);">Da 10:6</a>); me\'im, "body" (<a onClick="return mV(\'Sgs\',5,14);">So 5:14</a>); guphah = "corpse" (<a onClick="return mV(\'1Ch\',10,12);">1Ch 10:12</a>); gewah = "the back," i.e. (by extension) "person" (<a onClick="return mV(\'Job\',20,25);">Job 20:25</a>); she\'er = "flesh, as living or for food," "body" (<a onClick="return mV(\'Eze\',10,12);">Eze 10:12</a>); geshem = "a hard shower of rain" hence, "a body" (<a onClick="return mV(\'Dan\',4,33);">Da 4:33</a>; <a onClick="return mV(\'Dan\',5,21);">5:21</a>; <a onClick="return mV(\'Dan\',7,11);">7:11</a>); nidhneh = "a sheath," hence, the receptacle of the soul, "body" (<a onClick="return mV(\'Dan\',7,15);">Da 7:15</a>).<P>The Greek word which is used almost exclusively for "body" in the New Testament is soma, Latin corpus (<a onClick="return mV(\'Mat\',5,29,30);">Mt 5:29-30</a>; <a onClick="return mV(\'Mat\',6,22,23,25);">6:22-23, 25</a>; <a onClick="return mV(\'Mat\',26,26);">26:26</a>; <a onClick="return mV(\'Jhn\',2,21);">Joh 2:21</a>; <a onClick="return mV(\'Act\',9,40);">Ac 9:40</a>; <a onClick="return mV(\'1Cr\',15,35,37,38,44);">1Co 15:35, 37-38, 44</a>; <a onClick="return mV(\'Eph\',1,23);">Eph 1:23</a>; <a onClick="return mV(\'Eph\',2,16);">2:16</a>; <a onClick="return mV(\'Eph\',4,4,12,16);">4:4, 12, 16</a>; <a onClick="return mV(\'Eph\',5,23,30);">5:23, 30</a>). chros, signifying primarily the "surface" or "skin," occurs in <a onClick="return mV(\'Act\',19,12);">Ac 19:12</a>. A compound word with soma, as its base, sussomos = "a member of the same body," occurs in <a onClick="return mV(\'Eph\',3,6);">Eph 3:6</a>. From the above, it appears that the New Testament places the body as a whole into opposition to the spirit or the invisible nature. Paul, of course, employs the term also to designate the sublimated substance with which we are to be clothed after the resurrection when he speaks of the "spiritual body" (<a onClick="return mV(\'1Cr\',15,44);">1Co 15:44</a>).<P>Frank E. Hirsch<P>II. GENERAL:<P>1. In the Old Testament:<P>soma, Latin corpus: The term "body" is not found in the Hebrew of the Old Testament in the sense in which it occurs in the Greek "The Hebrew word for \'body\' is gewiyah, which is sometimes used for the \'living\' body (<a onClick="return mV(\'Eze\',1,11);">Eze 1:11</a>), \'bodies of the cherubim\' (<a onClick="return mV(\'Gen\',47,18);">Ge 47:18</a>; <a onClick="return mV(\'Neh\',9,37);">Ne 9:37</a>), but usually for the dead body or carcass. Properly speaking the Hebrew has no term for \'body.\' The Hebrew term around which questions relating to the body must gather is flesh" (Davidson, Old Testament Theology, 188). Various terms are used in the Old Testament to indicate certain elements or component parts of the body, such as "flesh," "bones," "bowels," "belly," etc., some of which have received a new meaning in the New Testament. Thus the Old Testament "belly" (Hebrew beten, Greek koilia), "Our soul is bowed down to the dust; our belly cleaveth unto the earth" (<a onClick="return mV(\'Psa\',44,25);">Ps 44:25</a> the King James Version)—as the seat of carnal appetite—has its counterpart in the New Testament: "They serve...their own belly" (<a onClick="return mV(\'Rom\',16,18);">Ro 16:18</a>). So also the word translated "bowels" (meim, rachamim) in the sense of compassion, as in <a onClick="return mV(\'Jer\',31,20);">Jer 31:20</a>, King James Version: "Therefore my bowels are troubled for him," is found in more than one place in the New Testament. Thus in <a onClick="return mV(\'Phl\',1,8);">Php 1:8</a> the King James Version, "I long after you all in the bowels (splagchna) of Christ," and again, "if there be any bowels (splagchna) and mercies" (<a onClick="return mV(\'Phl\',2,1);">Php 2:1</a> the King James Version).<P>2. In the New Testament:<P>"Body" in the New Testament is largely used in a figurative sense, either as indicating the "whole man" (<a onClick="return mV(\'Rom\',6,12);">Ro 6:12</a>; <a onClick="return mV(\'Hbr\',10,5);">Heb 10:5</a>), or as that which is morally corrupt—"the body of this death" (<a onClick="return mV(\'Rom\',6,6);">Ro 6:6</a>; <a onClick="return mV(\'Rom\',7,24);">7:24</a>). Hence, the expression, "buffet my body" (<a onClick="return mV(\'1Cr\',9,27);">1Co 9:27</a>, hupopiazo, a word adopted from the prize-ring, palaestra), the body being considered as the lurking-place and instrument of evil. (Compare <a onClick="return mV(\'Rom\',8,13);">Ro 8:13</a> the King James Version "Mortify the deeds of the body.")<P>3. Other Meanings:<P>Between these two the various other meanings seem to range. On the one hand we find the church called "the body of Christ" (<a onClick="return mV(\'Eph\',4,16);">Eph 4:16</a>; <a onClick="return mV(\'1Cr\',12,13);">1Co 12:13</a>), with diversity of gifts, enjoying the "unity of the Spirit in the bond of peace." On the other we read of a spiritual, incorruptible body, a resurrection-body as opposed to the natural body, which is doomed to corruption in death (<a onClick="return mV(\'1Cr\',15,44);">1Co 15:44</a>). Not only do we find these meanings in the word itself, but also in some of its combinations. On the one hand we read in <a onClick="return mV(\'Eph\',3,6);">Eph 3:6</a> of the Gentiles as "partakers of the promise in Christ" as "fellow-heirs," and "of the same body" (sussoma) in corporate union with all who put their trust in the Redeemer of mankind; on the other, we read of mere "bodily (somatic) exercises," which are not profitable (<a onClick="return mV(\'1Ti\',4,8);">1Ti 4:8</a>)—where "body" evidently is contrasted with "spirit." And again, we read of the Holy Ghost descending in "bodily" (somatic) shape upon the "Son of God" (<a onClick="return mV(\'Luk\',3,22);">Lu 3:22</a>), in whom dwelt the "fullness of the Godhead bodily" (somatically) (<a onClick="return mV(\'Col\',2,9);">Col 2:9</a>). So, too, the "body" is called a temple of the Holy Ghost: "Know ye not that your body is a temple of the Holy Spirit?" (<a onClick="return mV(\'1Cr\',6,19);">1Co 6:19</a>).<P>4. The Body and Sin:<P>From all this it is apparent that the body in itself is not necessarily evil, a doctrine which is taught in Greek philosophy, but nowhere in the Old Testament and New Testament. The rigid and harsh dualism met with in Plato is absent from Paul\'s writings, and is utterly foreign to the whole of Scripture. Here we are distinctly taught, on the one hand, that the body is subordinated to the soul, but on the other, with equal clearness, that the human body has a dignity, originally conferred upon it by the Creator, who shaped it out of earth, and glorified it by the incarnation of Christ, the sinless One, though born of a woman. Julius Muller has well said: "Paul denies the presence of evil in Christ, who was partaker of our fleshly nature (<a onClick="return mV(\'Gal\',4,4);">Ga 4:4</a>), and he recognizes it in spirits who are not partakers thereof (<a onClick="return mV(\'Eph\',6,12);">Eph 6:12</a> the King James Version, \'spiritual wickedness in high places\'). Is it not therefore in the highest degree probable that according to him evil does not necessarily pertain to man\'s sensuous nature, and that sarx (say body) denotes something different from this?" (The Christian Doctrine of Sin, I, 321, English edition). He further shows that the derivation of sin from sense is utterly irreconcilable with the central principle of the apostle\'s doctrine as to the perfect holiness of the Redeemer, and that "the doctrine of the future resurrection—even taking into account the distinction between the soma psuchikon and the soma pneumatikon (<a onClick="return mV(\'1Cr\',15,44);">1Co 15:44</a>)—is clearly at variance with the doctrine that sin springs from the corporal nature as its source" (318).<P>5. The First Sin:<P>The very first sin was spiritual in its origin—an act of rebellion against God—the will of the creature in opposition to the will of the Creator (<a onClick="return mV(\'Gen\',3,\'1-\');">Ge 3</a>). It was conceived in doubt—"Hath God said?"; it was born in desire—"The tree was good for food"; it was stimulated by a rebellious hankering after equality with God: "Ye shall be as God, knowing good and evil"; it was introduced from without, from the spiritual world, through the agency of a mysterious, supernatural being, employing "a beast of the field more subtle than any which Yahweh God had made." That the serpent in the Old Testament is not identified with Satan, and that the clearest utterance in pre-Christian times on the subject is to be found in the Book of The <span class="noTag">Wisdom of Solomon 2:24</span> ("by the envy of the devil death entered into the world"), may be true. That the narrative of the Fall is figurative or symbolical may also be granted. But the whole tendency of the early narrative is to connect the first human sin with a superhuman being, employing an agent known to man, and making that agent its representative in the "subtlety" of the great temptation as a prelude to the mighty fall. The New Testament is clear on this point (<a onClick="return mV(\'Jhn\',8,44);">Joh 8:44</a>; <a onClick="return mV(\'Jhn\',16,11);">16:11</a>; <a onClick="return mV(\'2Cr\',11,3);">2Co 11:3</a>; <a onClick="return mV(\'1Ti\',2,14);">1Ti 2:14</a>; <a onClick="return mV(\'Hbr\',2,14);">Heb 2:14</a>; <a onClick="return mV(\'Rev\',12,9);">Re 12:9</a>). Great historic truths are imbedded in that narrative, whatever we may think of the form which that narrative has assumed. There can be no doubt that the oldest and truest traditions of the human race are to be found there. It is not denied that sin has desecrated the temple of the living God, which is the body. That body indeed has become defiled and polluted by sin. Paul recognizes "an abnormal development of the sensuous in fallen man, and regards sin as having in a special manner entrenched itself in the body, which becomes liable to death on this very account (<a onClick="return mV(\'Rom\',6,23);">Ro 6:23</a>; <a onClick="return mV(\'Rom\',7,24);">7:24</a>)" (Encyclopedia of Religion and Ethics, I, 761). But we may safely say that theory which connects sin with the physical body, and gives it a purely sensuous origin, is alien to the whole spirit and letter of revelation.<P>J. I. Marais<P>III. FIGURATIVE:<P>In the New Testament (soma, "the body" both of men and animals) the word has a rich figurative and spiritual use:<P>(1) the temporary home of the soul (<a onClick="return mV(\'2Cr\',5,6);">2Co 5:6</a>);<P>(2) "the temple of the Holy Spirit" (<a onClick="return mV(\'1Cr\',6,19);">1Co 6:19</a>);<P>(3) "temple" (<a onClick="return mV(\'Jhn\',2,21);">Joh 2:21</a>);<P>(4) "the old man," the flesh as the servant of sin or the sphere in which moral evil comes to outward expression (<a onClick="return mV(\'Rom\',6,6);">Ro 6:6</a>; <a onClick="return mV(\'Rom\',7,7);">7:7</a>; compare Paul\'s use of sarx, "flesh");<P>(5) the "church" as Christ\'s body, the organism through which He manifests His life and in which H is spirit dwells (<a onClick="return mV(\'Eph\',1,23);">Eph 1:23</a>; <a onClick="return mV(\'Col\',1,24);">Col 1:24</a>);<P>(6) the spiritual "unity" of believers, one redeemed society or organism (<a onClick="return mV(\'Eph\',2,16);">Eph 2:16</a>; a corpus mysticum, <a onClick="return mV(\'Eph\',4,4);">Eph 4:4</a>);<P>(7) "substance" (spiritual reality or life in Christ) versus "shadow" (<a onClick="return mV(\'Col\',2,17);">Col 2:17</a>);<P>(8) the ascended and glorified body of Jesus (<a onClick="return mV(\'Phl\',3,21);">Php 3:21</a>);<P>(9) the resurrection or "spiritual" (v. natural) body of the redeemed in heaven (<a onClick="return mV(\'1Cr\',15,44);">1Co 15:44</a>);<P>(10) the whole personality, e.g. the spiritual presence, power and sacrificial work of Christ, the mystical meaning of "the body and the blood" symbolized in the bread and cup of the sacrament (<a onClick="return mV(\'1Cr\',11,27);">1Co 11:27</a>).<P>The term body is exceptionally rich in connection with the selfgiving, sacrificial, atoning work of Christ. It was the outward sphere or manifestation of His suffering. Through the physical He revealed the extent of His redeeming and sacrificial love. He "bare our sins in his body upon the tree" (<a onClick="return mV(\'1Pe\',2,24);">1Pe 2:24</a>), thus forever displacing all the ceaseless and costly sacrifices of the old dispensation (<a onClick="return mV(\'Hbr\',9,\'24-28\');">Heb 9:24-28</a>). Special terms, "body of his flesh" (<a onClick="return mV(\'Col\',1,22);">Col 1:22</a>); "body of sin" (<a onClick="return mV(\'Rom\',6,6);">Ro 6:6</a>); "body of this death" (<a onClick="return mV(\'Rom\',7,24);">Ro 7:24</a>); "body of his glory" (<a onClick="return mV(\'Phl\',3,21);">Php 3:21</a>).<P>The word ptoma, used only of fallen, i.e. dead bodies (<a onClick="return mV(\'Rev\',11,8,9);">Re 11:8-9</a>).``139';
isbe[1589]='Body of Death`deth (soma tou thanatou): These words are found in Paul\'s impassioned argument on the reign of the law, which dooms man to continuous disappointment and convinces him of the terrible power of indwelling sin. "O wretched man that I am! who shall deliver me from the body of this death?" (<a onClick="return mV(\'Rom\',7,24);">Ro 7:24</a> the King James Version). It is the "picture of the still unredeemed man in his relation to the law" (Meyer). The translation, "this body of death," though grammatically possible, is logically impermissible. The picture here before the mind of the apostle is not physical but ethical. Death points to the dominion of sin, to the reign of the law, as revealed in his physical life, from which he is delivered only through regeneration, by faith in Christ. It points to the "I must" and to the "I cannot." It is therefore the bondage under the law of sin, the body as the seat of this conscious and bitter struggle, that the figure points at. And yet the ethical may have a physical background. There may be a distant reference here to the dreadful punishment of the ancients of chaining the living body to a corpse, that the constant corruption of death might extinguish the life of the victim of this exquisite torture.``42';
isbe[1590]='Body of Heaven`The King James Version translates the Hebrew idiom, etsem ha-shamayim, by "the body of heaven" (<a onClick="return mV(\'Exd\',24,10);">Ex 24:10</a>). A more correct rendering is given in the Revised Version (British and American), "the very heaven," taking the word \'etsem in its idiomatic use as an intensive, which is derived from its literal meaning, "bone," as "strength," "substance," and then as "self" (compare <a onClick="return mV(\'Job\',21,23);">Job 21:23</a>); the substance of the blue, unclouded sky, hence, the clear sky itself.``1';
isbe[1591]='Body, Spiritual`spir\'-it-u-al: Paul describes the body after the resurrection as a spiritual body (soma psuchikon) and contrasts it with the natural (psychical body, soma pneumatikon, <a onClick="return mV(\'1Cr\',15,44);">1Co 15:44</a>). Our present natural body has for its life-principle the soul (psuche) but the resurrection body is adapted and subordinated to the spirit (pneuma). See <a href="./study/isbe/search.html?string=PSYCHOLOGY">PSYCHOLOGY</A>. The apostle does not argue for a literal and material identity of that future body with the present one, but thinks of it as the counterpart of the present animal organism so conditioned as to be adapted to a state of existence which lies wholly within the sphere of the spirit. Against his Corinthian readers he argues that the resurrection cannot be succeeded by a state of non-existence, nor is he willing to admit a mere etherealized state. There must be a body, but between it and our present body there is a similar difference to that between the first and second Adam. The present body and the first Adam were alike dominated by the soul (psuche); but as the second Adam became a life-giving spirit, so will the resurrection body be a spiritual one. Christ became a life-giving spirit through the resurrection (Meyer on <a onClick="return mV(\'1Cr\',15,45);">1Co 15:45</a>); and since we are to bear His image (<a onClick="return mV(\'1Cr\',15,49);">1Co 15:49</a>), it becomes evident that Christ\'s resurrection-body is the nearest possible approach to a sensible representation of the spiritual body. For this Paul argues more directly when he affirms that our resurrection-body shall be transformed according to the body of His glory (<a onClick="return mV(\'Phl\',3,21);">Php 3:21</a>; compare <a onClick="return mV(\'1Jo\',3,2);">1Jo 3:2</a>). The body of Christ after the resurrection was conformed in many respects to the body of His earthly life, yet with some marked differences. He ate (<a onClick="return mV(\'Luk\',24,42,43);">Lu 24:42-43</a>); He breathed (<a onClick="return mV(\'Jhn\',20,22);">Joh 20:22</a>); possessed flesh and bones (<a onClick="return mV(\'Luk\',24,39);">Lu 24:39</a>), and could be apprehended by the bodily senses (<a onClick="return mV(\'Luk\',24,40);">Lu 24:40</a>; <a onClick="return mV(\'Jhn\',20,27);">Joh 20:27</a>). His body possessed characteristics which differentiated it entirely from the popular fancy of ghosts or apparitions (<a onClick="return mV(\'Luk\',24,\'36-43\');">Lu 24:36-43</a>). Yet His body was superior to the usual barriers which restrict human movements. Barred doors and distances did not impede His going (<a onClick="return mV(\'Jhn\',20,\'19-26\');">Joh 20:19-26</a>; <a onClick="return mV(\'Luk\',24,\'31-36\');">Lu 24:31-36</a>). The context shows that the purpose of His eating was to convince the disciples that it was really He (<a onClick="return mV(\'Luk\',24,\'41-43\');">Lu 24:41-43</a>), and not to sustain life which His body was probably capable of maintaining in other ways. John speaks of His appearances after His resurrection as "manifestations" (<a onClick="return mV(\'Jhn\',21,\'1-21\');">Joh 21:1-21</a>). A change in His person and appearance had certainly taken place, for those who knew Him best did not at once recognize Him (<a onClick="return mV(\'Luk\',24,16);">Lu 24:16</a>; <a onClick="return mV(\'Jhn\',20,14);">Joh 20:14</a>). It is evident therefore that the post-resurrection-body of Jesus was one that had the power of materializing itself to natural senses, or withdrawing itself at will. It was this same body which was taken into the heavens at the ascension, and which remains in heaven (<a onClick="return mV(\'Act\',1,11);">Ac 1:11</a>; <a onClick="return mV(\'Act\',3,21);">3:21</a>). There is no hint that it underwent any change in its removal from earth. Hence, the spiritual body of which Paul speaks is not to be unlike the body which Jesus possessed after His resurrection. There is to be an absence of the desires and passions which belong naturally to the present bodily existence (<a onClick="return mV(\'Mat\',22,30);">Mt 22:30</a>; <a onClick="return mV(\'Luk\',20,35,36);">Lu 20:35-36</a>).``124';
isbe[1592]='Body-Guard`bod\'-i-gard: The expression occurs in Apocrypha (1Esdras 3:4), "the body-guard that kept the king\'s person."``1';
isbe[1593]='Bohan`bo\'-han (bohan, "thumb," "stumpy"): A son of Reuben according to <a onClick="return mV(\'Jos\',15,6);">Jos 15:6</a>; <a onClick="return mV(\'Jos\',18,17);">18:17</a>. No mention is made of Bohan in the genealogies of Reuben. "The stone of Bohan" (\'ebhen bohan) was a boundary mark on the Northeast frontier of Judah, separating it from Benjamin. Site unidentified.``1';
isbe[1594]='Boil (1)`(noun) (shechin; helkos): A localized inflamed swelling. The Hebrew word is derived from a root probably meaning "to burn," and is used as a generic term for the sores in the sixth plague of Egypt (<a onClick="return mV(\'Exd\',9,\'9-11\');">Ex 9:9-11</a>); for a sore which might be confounded with leprosy (<a onClick="return mV(\'Lev\',13,\'18-23\');">Le 13:18-23</a>); for Job\'s malady (<a onClick="return mV(\'Job\',2,7);">Job 2:7</a>) and Hezekiah\'s disease (<a onClick="return mV(\'2Ki\',20,1);">2Ki 20:1</a>; <a onClick="return mV(\'Isa\',38,21);">Isa 38:21</a>). Our English word is derived from the verb "to beal," i.e. to suppurate, now obsolete except as a dialect word in Scotland and Ireland. Wyclif uses the name for Lazarus\' sores (<a onClick="return mV(\'Luk\',16,20);">Lu 16:20</a>), "houndis lickeden his bylis." The Egyptian word schn is the name of an abscess, and occurs in the reduplicated form chnchnt in Papyr. Ebers, CV. The plague of boils in Egypt came without warning immediately after the insect plagues of kinnim (sandflies) and that of \'arobh or flies, and followed the epizootic murrain, which is suggestive in the light of the transmission of toxic germs by insects. It has been supposed by some to be elephantiasis, as Pliny says that this disease was peculiar to Egypt (xxvi.5). A stronger case has been made out for its identity with confluent smallpox; but as it is not described as being a fatal disease, it may more probably have been an aggravated form of the ordinary gregarious furuncles or boils, due to the microbe streptococcus pyogenes.<P>Job\'s body is said to have been covered with itchy, irritating sores which made his face unrecognizable, <a onClick="return mV(\'Job\',2,12);">Job 2:12</a>, caused continual burning pain (<a onClick="return mV(\'Job\',3,24);">Job 3:24</a>; <a onClick="return mV(\'Job\',6,4);">6:4</a>), and which were infested with maggots (<a onClick="return mV(\'Job\',7,5);">Job 7:5</a>) and exhaled a nauseous fetor (<a onClick="return mV(\'Job\',19,17);">Job 19:17</a>). His sleep was destroyed and his nervous system enfeebled (<a onClick="return mV(\'Job\',3,26);">Job 3:26</a>) so that he required assistance to move, as he sat in the ashes (<a onClick="return mV(\'Job\',2,8);">Job 2:8</a>). Various diagnoses have been made of his malady, but it is most probable that it was a form of the disease known as "oriental sore," or "Bagdad boil," called in Algeria "Biskra batton," in which the intensely itchy sores are often multiple, affecting the face, hands, and other exposed parts. The cases which I have seen have been very intractable and disfiguring.<P>Hezekiah\'s boil was apparently more localized, and the indefinite description would accord with that of a carbuncle. It seems to have rendered him unclean (<a onClick="return mV(\'Isa\',38,22);">Isa 38:22</a>), though the reference may be to the practice referred to in <a onClick="return mV(\'Lev\',13,18);">Le 13:18</a>f. The "botch" of Egypt (<a onClick="return mV(\'Deu\',28,27,35);">De 28:27, 35</a> the King James Version) is translation of the same word, as is "boil" in the Revised Version (British and American). Botch is an old English name for boil and occurs in Piers Plowman, and the adjective "botchy" is used in Troilus and Cressida (II,1,6). The word is cognate to the old French boche or poche, a form of our later word "pock." The sores of Lazarus (<a onClick="return mV(\'Luk\',16,20);">Lu 16:20</a>) were probably old varicose ulcers, such as are as common on the legs of the old and poor in the East as they are in the West.``107';
isbe[1595]='Boil (2)`(verb) (bashal, rathach): "Boil" is the translation of bashal, "to bubble up," "to boil," "to be cooked," Piel, "to cause to boil," "to cook" (<a onClick="return mV(\'Lev\',8,31);">Le 8:31</a>; <a onClick="return mV(\'1Ki\',19,21);">1Ki 19:21</a>; <a onClick="return mV(\'2Ki\',6,29);">2Ki 6:29</a>; <a onClick="return mV(\'Eze\',46,20,24);">Eze 46:20, 24</a> bis); of rathach, "to be hot," "to boil," "to be made to boil," "to be greatly moved" under strong emotion (the bowels), Hiphil "to cause to boil" (<a onClick="return mV(\'Job\',30,27);">Job 30:27</a> the King James Version "My bowels boiled, and rested not," the English Revised Version "My bowels boil." the American Standard Revised Version "My heart is troubled"; <a onClick="return mV(\'Job\',41,31);">Job 41:31</a>, "He maketh the deep to boil like a pot"; <a onClick="return mV(\'Eze\',24,5);">Eze 24:5</a>, "make it boil well"); of ba\'ah, "to bubble" or "well up" (<a onClick="return mV(\'Isa\',64,2);">Isa 64:2</a> (1, in Hebrew) "The fire causeth the waters to boil"); in King James Version, margin of <a onClick="return mV(\'Psa\',45,1);">Ps 45:1</a> ("My heart is inditing a good matter") we have Hebrew "boileth" or "bubbleth up" (rachash, "to boil" or "bubble up," the Revised Version (British and American) text, "My heart overfloweth with a goodly matter").<P>"Boiling-places," occurs in <a onClick="return mV(\'Eze\',46,23);">Eze 46:23</a> as the translation of mebhashsheloth, "hearths," "boiling-places." The American Standard Revised Version has "boiling-houses" for "places of them that boil" (<a onClick="return mV(\'Eze\',46,24);">Eze 46:24</a>), "boil well" for "consume" (<a onClick="return mV(\'Eze\',24,10);">Eze 24:10</a>). The American Standard Revised Version has "boiling over" for "unstable" (<a onClick="return mV(\'Gen\',49,4);">Ge 49:4</a>; the English Revised Version, margin "bubbling over").``185';
isbe[1596]='Boldness`bold\'-nes (parresia, "confidence," "fearlessness," "freedom of speech"): This was one of the results of discipleship (<a onClick="return mV(\'Act\',4,13,29,31);">Ac 4:13, 29, 31</a>; <a onClick="return mV(\'Eph\',3,12);">Eph 3:12</a>; <a onClick="return mV(\'Phl\',1,20);">Php 1:20</a>; <a onClick="return mV(\'1Ti\',3,13);">1Ti 3:13</a>; <a onClick="return mV(\'1Jo\',4,17);">1Jo 4:17</a>). It was a necessary qualification for the work assigned them. They were not only subject to violent persecutions, but also were the constant subject of ridicule and contempt. Paul uses the word in the sense of plainness in <a onClick="return mV(\'2Cr\',3,12);">2Co 3:12</a>. In <a onClick="return mV(\'Hbr\',10,19);">Heb 10:19</a>; <a onClick="return mV(\'1Jo\',2,28);">1Jo 2:28</a>; <a onClick="return mV(\'1Jo\',4,17);">4:17</a>, it has the sense of freeness resulting from confidence. In <a onClick="return mV(\'Phm\',1,8);">Phm 1:8</a>, the reference is to the authority which Paul claims in this case.``87';
isbe[1597]='Bolled`bold (gibh\'ol, "the calyx of flowers"): Hence, "in bloom," and so rendered, in the Revised Version (British and American), of flowering flax (<a onClick="return mV(\'Exd\',9,31);">Ex 9:31</a>).``1';
isbe[1598]='Bolster`bol\'-ster: Found in the King James Version only in <a onClick="return mV(\'1Sa\',19,13,16);">1Sa 19:13, 16</a>, "Behold, the teraphim was in the bed, with the pillow of goat\'s hair at the head thereof" (the King James Version "for his bolster"), and <a onClick="return mV(\'1Sa\',26,7,11,12,16);">1Sa 26:7, 11-12, 16</a>, "Saul lay sleeping...with his spear stuck in the ground at his head." "Bolster" in these passages in the King James Version was used to translate a Hebrew word whose true significance is "the place of the head," or "the head-place." It will be noted that it has disappeared from the Revised Version (British and American), which rightly has throughout "head," instead of "bolster."`<a href="./study/isbe/search.html?string=CUSHION">CUSHION</a>`1';
isbe[1599]='Bolt`bolt (na\'al, "to bind up"): The ancient Hebrews had fastenings of wood or iron for the doors of houses (<a onClick="return mV(\'2Sa\',13,17,18);">2Sa 13:17-18</a>; <a onClick="return mV(\'Sgs\',5,5);">So 5:5</a>), city gates (<a onClick="return mV(\'Neh\',3,3,6,13,14,15);">Ne 3:3, 6, 13-15</a>), prison doors, etc. (<a onClick="return mV(\'Isa\',45,2);">Isa 45:2</a>), which were in the form of bolts. These were sometimes pushed back from within; but there were others which, by means of a key, could be unfastened and pushed back from without (<a onClick="return mV(\'Jdg\',3,23);">Jud 3:23</a>ff). These were almost the only form of locks known.<P>See <a href="./study/isbe/search.html?string=BAR">BAR</A>; <a href="./study/isbe/search.html?string=LOCKS">LOCKS</A>.<P>In <a onClick="return mV(\'Hab\',3,5);">Hab 3:5</a>, resheph (a poetic word for "flame") is rendered "fiery bolts" (the King James Version "burning coals"). It seems to denote "the fiery bolts, by which Yahweh was imagined to produce pestilence or fever" (Driver, Deuteronomy, 367).``91';
isbe[1600]='Bond``<a href="./study/isbe/search.html?string=BAND">BAND</a>; <a href="./study/isbe/search.html?string=BILL">BILL</a>; <a href="./study/isbe/search.html?string=CHAIN">CHAIN</a>`1';
