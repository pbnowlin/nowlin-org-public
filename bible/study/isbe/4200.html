isbe[4201]='Heap`hep (\'aremah, gal, nedh, tel): "Heap" appears<P>(1) in the simple sense of a gathering or pile, as the translation of \'aremah, a "heap," in <a onClick="return mV(\'Rth\',3,7);">Ru 3:7</a> of grain; <a onClick="return mV(\'Neh\',4,2);">Ne 4:2</a> of stones; in <a onClick="return mV(\'2Ch\',31,6);">2Ch 31:6</a>, etc., of the tithes, etc.; of chomer (boiling up), a "heap"; in <a onClick="return mV(\'Exd\',8,14);">Ex 8:14</a> of frogs; of gal, a "heap"; in <a onClick="return mV(\'Job\',8,17);">Job 8:17</a> of stones.<P>(2) As indicating "ruin," "waste," gal (<a onClick="return mV(\'2Ki\',19,25);">2Ki 19:25</a>; <a onClick="return mV(\'Job\',15,28);">Job 15:28</a>; <a onClick="return mV(\'Isa\',25,2);">Isa 25:2</a>; <a onClick="return mV(\'Isa\',37,26);">37:26</a>; <a onClick="return mV(\'Jer\',9,11);">Jer 9:11</a>; <a onClick="return mV(\'Jer\',51,37);">51:37</a>); me\'i (<a onClick="return mV(\'Isa\',17,1);">Isa 17:1</a>); \'i (<a onClick="return mV(\'Psa\',79,1);">Ps 79:1</a>; <a onClick="return mV(\'Jer\',26,18);">Jer 26:18</a>; <a onClick="return mV(\'Mic\',1,6);">Mic 1:6</a>; <a onClick="return mV(\'Mic\',3,12);">3:12</a>); tel, "mound," "hillock," "heap" (<a onClick="return mV(\'Deu\',13,16);">De 13:16</a>; <a onClick="return mV(\'Jos\',8,28);">Jos 8:28</a>; <a onClick="return mV(\'Jer\',30,18);">Jer 30:18</a> the King James Version; <a onClick="return mV(\'Jer\',49,2);">Jer 49:2</a>).<P>(3) Of waters, nedh, "heap," "pile" (<a onClick="return mV(\'Exd\',15,8);">Ex 15:8</a>; <a onClick="return mV(\'Jos\',3,13,16);">Jos 3:13, 16</a>; <a onClick="return mV(\'Psa\',33,7);">Ps 33:7</a>; <a onClick="return mV(\'Psa\',78,13);">78:13</a>); chomer (<a onClick="return mV(\'Hab\',3,15);">Hab 3:15</a>, "the heap of mighty waters," the Revised Version margin "surge").<P>(4) A cairn, or heap of stones (a) over the dead body of a dishonored person, gal (<a onClick="return mV(\'Jos\',7,26);">Jos 7:26</a>; <a onClick="return mV(\'Jos\',8,29);">8:29</a>; <a onClick="return mV(\'2Sa\',18,17);">2Sa 18:17</a>); (b) as a witness or boundary-heap (<a onClick="return mV(\'Gen\',31,46);">Ge 31:46</a>f; Gal\'edh (Galeed) in Hebrew, also mitspah, "watch tower," Yeghar-Sahadhutha\' (Jegar-sahadutha) in Aramaic, both words meaning "the heap of witness"; see <a onClick="return mV(\'Gen\',31,47,49);">Ge 31:47, 49</a> the Revised Version (British and American)).<P>(5) As a way mark, tamrurim, from tamar, "to stand erect" (<a onClick="return mV(\'Jer\',31,21);">Jer 31:21</a> the King James Version, "Set thee up waymarks, make thee high heaps," the Revised Version (British and American) "guide-posts," a more likely translation).<P>"To heap" represents various single words: chathah, "to take," "to take hold of," with one exception, applied to fire or burning coals (<a onClick="return mV(\'Pro\',25,22);">Pr 25:22</a>, "Thou writ heap coals of fire upon his head," "Thou wilt take coals of fire (and heap them) on his head"); caphah, "to add" (<a onClick="return mV(\'Deu\',32,23);">De 32:23</a>); tsabhar, "to heap up" (<a onClick="return mV(\'Hab\',1,10);">Hab 1:10</a>); kabhats, "to press together" (with the fingers or hand) (<a onClick="return mV(\'Hab\',2,5);">Hab 2:5</a>); rabhah, "to multiply" (<a onClick="return mV(\'Eze\',24,10);">Eze 24:10</a>); episoreuo, "to heap up upon" (<a onClick="return mV(\'2Ti\',4,3);">2Ti 4:3</a>, they "will heap to themselves teachers after their own lusts"); soreuo, "to heap up" (<a onClick="return mV(\'Rom\',12,20);">Ro 12:20</a>, "Thou shalt heap coals of fire upon his head"); thesaurizo, "to lay up" (as treasure) (<a onClick="return mV(\'Jam\',5,3);">Jas 5:3</a> the King James Version, "Ye have heaped treasure together," the Revised Version (British and American) "laid up"); tsabhar, "to heap up," "to heap" or "store up" (<a onClick="return mV(\'Job\',27,16);">Job 27:16</a>, "silver"; <a onClick="return mV(\'Psa\',39,6);">Ps 39:6</a>, "riches"; <a onClick="return mV(\'Zec\',9,3);">Zec 9:3</a>, "silver,"); sum, sim "to place," "set," "put" (<a onClick="return mV(\'Job\',36,13);">Job 36:13</a> the King James Version, "The hypocrites in heart heap up wrath," the Revised Version (British and American) "They that are godless in heart lay up anger"). In <a onClick="return mV(\'Jdg\',15,16);">Jud 15:16</a> we have chamor, chamorothayim, "with the jawbone of an ass, heaps upon heaps," the Revised Version margin "heap, two heaps"; one of Samson\'s sayings; chamor means "an ass," chomer "a heap."<P>For "heap up words" (<a onClick="return mV(\'Job\',16,4);">Job 16:4</a>), the Revised Version (British and American) has "join together"; for "shall be a heap" (<a onClick="return mV(\'Isa\',17,11);">Isa 17:11</a>), "fleeth away," margin "shall be a heap"; "heap" for "number" (<a onClick="return mV(\'Nah\',3,3);">Na 3:3</a>); the English Revised Version "heap of stones" for "sling," margin as the King James Version and the American Standard Revised Version (<a onClick="return mV(\'Pro\',26,8);">Pr 26:8</a>); "in one heap" for "upon a heap" (<a onClick="return mV(\'Jos\',3,16);">Jos 3:16</a>); "he heapeth up (dust)" for "they shall heap" (<a onClick="return mV(\'Hab\',1,10);">Hab 1:10</a>).``185';
isbe[4202]='Heart`hart (lebh, lebhabh; kardia): The different senses in which the word occurs in the Old Testament and the New Testament may be grouped under the following heads:<P>1. Various Meanings:<P>It represents in the first place the bodily organ, and by easy transition those experiences which affect or are affected by the body. Fear, love, courage, anger, Joy, sorrow, hatred are always ascribed to the heart—especially in the Old Testament; thus courage for which usually ruach is used (<a onClick="return mV(\'Psa\',27,14);">Ps 27:14</a>); joy (<a onClick="return mV(\'Psa\',4,7);">Ps 4:7</a>); anger (<a onClick="return mV(\'Deu\',19,6);">De 19:6</a>, "while his heart is hot," lebhabh); fear (<a onClick="return mV(\'1Sa\',25,37);">1Sa 25:37</a>); sorrow (<a onClick="return mV(\'Psa\',13,2);">Ps 13:2</a>), etc.<P>Hence, naturally it came to stand for the man himself (<a onClick="return mV(\'Deu\',7,17);">De 7:17</a>; "say in thine heart," <a onClick="return mV(\'Isa\',14,13);">Isa 14:13</a>).<P>2. Heart and Personality:<P>As representing the man himself, it was considered to be the seat of the emotions and passions and appetites (<a onClick="return mV(\'Gen\',18,5);">Ge 18:5</a>; <a onClick="return mV(\'Lev\',19,17);">Le 19:17</a>; <a onClick="return mV(\'Psa\',104,15);">Ps 104:15</a>), and embraced likewise the intellectual and moral faculties—though these are necessarily ascribed to the "soul" as well. This distinction is not always observed.<P>3. Soul and Heart:<P>"Soul" in Hebrew can never be rendered by "heart"; nor can "heart" be considered as a synonym for "soul." Cremer has well observed: "The Hebrew nephesh ("soul") is never translated kardia ("heart")...The range of the Hebrew nephesh, to which the Greek psuche alone corresponds, differs so widely from the ideas connected with psuche, that utter confusion would have ensued had psuche been employed in an unlimited degree for lebh ("heart"). The Biblical lebh never, like psuche, denotes the personal subject, nor could it do so. That which in classical Greek is ascribed to psuche (a good soul, a just soul, etc.) is in the Bible ascribed to the heart alone and cannot be otherwise" (Cremer, Lexicon, article "Kardia," 437ff, German edition).<P>4. Center of Vital Action:<P>In the heart vital action is centered (<a onClick="return mV(\'1Ki\',21,7);">1Ki 21:7</a>). "Heart," except as a bodily organ, is never ascribed to animals, as is the case sometimes with nephesh and ruach (<a onClick="return mV(\'Lev\',17,11);">Le 17:11</a>, nephesh; <a onClick="return mV(\'Gen\',2,19);">Ge 2:19</a>; <a onClick="return mV(\'Num\',16,22);">Nu 16:22</a>; <a onClick="return mV(\'Gen\',7,22);">Ge 7:22</a>, ruach). "Heart" is thus often used interchangeably with these two (<a onClick="return mV(\'Gen\',41,8);">Ge 41:8</a>; <a onClick="return mV(\'Psa\',86,4);">Ps 86:4</a>; <a onClick="return mV(\'Psa\',119,20);">119:20</a>); but "it never denotes the personal subject, always the personal organ."<P>5. Heart and Mind:<P>As the central organ in the body, forming a focus for its vital action, it has come to stand for the center of its moral, spiritual, intellectual life. "In particular the heart is the place in which the process of self-consciousness is carried out, in which the soul is at home with itself, and is conscious of all its doing and suffering as its own" (Oehler). Hence, it is that men of "courage" are called "men of the heart"; that the Lord is said to speak "in his heart" (<a onClick="return mV(\'Gen\',8,21);">Ge 8:21</a>); that men "know in their own heart" (<a onClick="return mV(\'Deu\',8,5);">De 8:5</a>); that "no one considereth in his heart\' (<a onClick="return mV(\'Isa\',44,19);">Isa 44:19</a> the King James Version). "Heart" in this connection is sometimes rendered "mind," as in <a onClick="return mV(\'Num\',16,28);">Nu 16:28</a> ("of mine own mind," Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) ex proprio corde, Septuagint ap\' emautou); the foolish "is void of understanding," i.e. "heart" (<a onClick="return mV(\'Pro\',6,32);">Pr 6:32</a>, where the Septuagint renders phrenon, Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) cordis, Luther "der ist ein Narr"). God is represented as "searching the heart" and "trying the reins" (<a onClick="return mV(\'Jer\',17,10);">Jer 17:10</a> the King James Version). Thus, "heart" comes to stand for "conscience," for which there is no word in Hebrew, as in <a onClick="return mV(\'Job\',27,6);">Job 27:6</a>, "My heart shall not reproach me," or in <a onClick="return mV(\'1Sa\',24,5);">1Sa 24:5</a>, "David\'s heart smote him"; compare <a onClick="return mV(\'1Sa\',25,31);">1Sa 25:31</a>. From this it appears, in the words of Owen: "The heart in Scripture is variously used, sometimes for the mind and understanding, sometimes for the will, sometimes for the affections, sometimes for the conscience, sometimes for the whole soul. Generally, it denotes the whole soul of man and all the faculties of it, not absolutely, but as they are all one principle of moral operations, as they all concur in our doing of good and evil."<P>6. Figurative Senses:<P>The radical corruption of human nature is clearly taught in Scripture and brought into connection with the heart. It is "uncircumcised" (<a onClick="return mV(\'Jer\',9,26);">Jer 9:26</a>; <a onClick="return mV(\'Eze\',44,7);">Eze 44:7</a>; compare <a onClick="return mV(\'Act\',7,51);">Ac 7:51</a>); and "hardened" (<a onClick="return mV(\'Exd\',4,21);">Ex 4:21</a>); "wicked" (<a onClick="return mV(\'Pro\',26,23);">Pr 26:23</a>); "perverse" (<a onClick="return mV(\'Pro\',11,20);">Pr 11:20</a>); "godless" (<a onClick="return mV(\'Job\',36,13);">Job 36:13</a>); "deceitful and desperately wicked" (<a onClick="return mV(\'Jer\',17,9);">Jer 17:9</a> the King James Version). It defiles the whole man (<a onClick="return mV(\'Mat\',15,19,20);">Mt 15:19-20</a>); resists, as in the case of Pharaoh, the repeated call of God (<a onClick="return mV(\'Exd\',7,13);">Ex 7:13</a>). There, however, the law of God is written (<a onClick="return mV(\'Rom\',2,15);">Ro 2:15</a>); there the work of grace is wrought (<a onClick="return mV(\'Act\',15,9);">Ac 15:9</a>), for the "heart" may be "renewed" by grace (<a onClick="return mV(\'Eze\',36,26);">Eze 36:26</a>), because the "heart" is the seat of sin (<a onClick="return mV(\'Gen\',6,5);">Ge 6:5</a>; <a onClick="return mV(\'Gen\',8,21);">8:21</a>).<P>7. Process of Heart Renewal:<P>This process of heart-renewal is indicated in various ways. It is the removal of a "stony heart" (<a onClick="return mV(\'Eze\',11,19);">Eze 11:19</a>). The heart becomes "clean" (<a onClick="return mV(\'Psa\',51,10);">Ps 51:10</a>); "fixed" (<a onClick="return mV(\'Psa\',112,7);">Ps 112:7</a>) through "the fear" of the Lord (verse <a onClick="return mV(\'Psa\',112,1);">1</a>); "With the heart man believeth" (<a onClick="return mV(\'Rom\',10,10);">Ro 10:10</a>); on the "heart" the power of God is exercised for renewal (<a onClick="return mV(\'Jer\',31,33);">Jer 31:33</a>). To God the bereaved apostles pray as a knower of the heart (<a onClick="return mV(\'Act\',1,24);">Ac 1:24</a>—a word not known to classical writers, found only here in the New Testament and in <a onClick="return mV(\'Act\',15,8);">Ac 15:8</a>, kardiognostes). In the "heart" God\'s Spirit dwells with might (<a onClick="return mV(\'Eph\',3,16);">Eph 3:16</a>, eis ton eso anthropon); in the "heart" God\'s love is poured forth (<a onClick="return mV(\'Rom\',5,5);">Ro 5:5</a>). The Spirit of His son has been "sent forth into the heart" (<a onClick="return mV(\'Gal\',4,6);">Ga 4:6</a>); the "earnest of the Spirit" has been given "in the heart" (<a onClick="return mV(\'2Cr\',1,22);">2Co 1:22</a>). In the work of grace, therefore, the heart occupies a position almost unique.<P>8. The Heart First:<P>We might also refer here to the command, on which both the Old Testament and New Testament revelation of love is based: "Thou shalt love Yahweh thy God with all thy heart, and with all thy soul, and with all thy might" (<a onClick="return mV(\'Deu\',6,5);">De 6:5</a>); where "heart" always takes the first place, and is the term which in the New Testament rendering remains unchanged (compare <a onClick="return mV(\'Mat\',22,37);">Mt 22:37</a>; <a onClick="return mV(\'Mar\',12,30,33);">Mr 12:30, 33</a>; <a onClick="return mV(\'Luk\',10,27);">Lu 10:27</a>, where "heart" always takes precedence).<P>9. A Term for "Deepest":<P>A bare reference may be made to the employment of the term for that which is innermost, hidden, deepest in anything (<a onClick="return mV(\'Exd\',15,8);">Ex 15:8</a>; <a onClick="return mV(\'Jon\',2,3);">Jon 2:3</a>), the very center of things. This we find in all languages. Compare <a onClick="return mV(\'Eph\',3,16,17);">Eph 3:16-17</a>, "in the inward man," as above.``113';
isbe[4203]='Hearth`harth: Occurs 7 times in the King James Version: <a onClick="return mV(\'Gen\',18,6);">Ge 18:6</a>; <a onClick="return mV(\'Psa\',102,3);">Ps 102:3</a>; <a onClick="return mV(\'Isa\',30,14);">Isa 30:14</a>; <a onClick="return mV(\'Jer\',36,22,23);">Jer 36:22-23</a> bis; <a onClick="return mV(\'Zec\',12,6);">Zec 12:6</a>; <span class="noTag">4</span> times in the Revised Version: <a onClick="return mV(\'Lev\',6,9);">Le 6:9</a>; <a onClick="return mV(\'Isa\',30,14);">Isa 30:14</a>; <a onClick="return mV(\'Eze\',43,15,16);">Eze 43:15-16</a> ("altar hearth"); compare also <a onClick="return mV(\'Isa\',29,1);">Isa 29:1</a> the Revised Version margin. It will be noted that the renderings of the two versions agree in only one passage (<a onClick="return mV(\'Isa\',30,14);">Isa 30:14</a>).<P>(1) The hearth in case of a tent was nothing more than a depression in the ground in which fire was kindled for cooking or for warmth. Cakes were baked, after the fashion of <a onClick="return mV(\'Gen\',18,6);">Ge 18:6</a>, in the ashes or upon hot stones. In this passage, however, there is nothing in the Hebrew corresponding to the King James Version "on the hearth." In the poorer class of houses also the hearth consisted of such a depression, of varying dimensions, in the middle or in one corner of the room. There was no chimney for the smoke, which escaped as it could, or through a latticed opening for the purpose (the "chimney" of <a onClick="return mV(\'Hsa\',13,3);">Ho 13:3</a>). While the nature of the hearth is thus clear enough, more or less uncertainty attaches to specific terms used in the Hebrew. In <a onClick="return mV(\'Isa\',30,14);">Isa 30:14</a> the expression means simply "that which is kindled," referring to the bed of live coals. From this same verb (yaqadh, "be kindled") are formed the nouns moqedh (<a onClick="return mV(\'Psa\',102,3);">Ps 102:3 (Hebrew 4)</a>) and moqkedhah (<a onClick="return mV(\'Lev\',6,9);">Le 6:9 (Hebrew 2)</a>) which might, according to their formation, mean either the material kindled or the place where a fire is kindled. Hence, the various renderings, "firebrand," "hearth," etc. Moreover, in <a onClick="return mV(\'Lev\',6,9);">Le 6:9 (Hebrew 2)</a> the termination -ah of moqedhah may be taken as the pronominal suffix, "its"; hence, the Revised Version margin "on its firewood."<P>(2) Two other terms have reference to heating in the better class of houses. In <a onClick="return mV(\'Jer\',36,22,23);">Jer 36:22-23</a> the word (\'ach) means a "brazier" of burning coals, with which Jehoiakim\'s "winter house" was heated. The same purpose was served by the "pan (kiyyor) of fire" of <a onClick="return mV(\'Zec\',12,6);">Zec 12:6</a> the Revised Version (British and American), apparently a wide, shallow vessel otherwise used for cooking (<a onClick="return mV(\'1Sa\',2,14);">1Sa 2:14</a>, English Versions of the Bible "pan"), or as a wash basin (compare <a onClick="return mV(\'Exd\',30,18);">Ex 30:18</a>; <a onClick="return mV(\'1Ki\',7,38);">1Ki 7:38</a>, etc., "laver").<P>(3) Another class of passages is referred to the signification "altar hearth," which seems to have been a term applied to the top of the altar of burnt offering. The moqedhah of <a onClick="return mV(\'Lev\',6,9);">Le 6:9</a> (2), though related by derivation to the words discussed under (1) above, belongs here (compare also Ecclesiasticus 50:12, "by the hearth of the altar," par\' eschara bomou). Again in Ezekiel\'s description of the altar of the restored temple (<a onClick="return mV(\'Exd\',43,15,16);">43:15,16</A>), he designates the top of the altar by a special term (the Revised Version margin, ariel), which is by most understood to mean "altar hearth" (so the Revised Version (British and American)). With this may be compared the symbolical name given to Jerusalem (<a onClick="return mV(\'Isa\',29,1);">Isa 29:1</a>), and variously explained as "lion (or lioness) of God," or "hearth of God."``44';
isbe[4204]='Heartily`har\'-ti-li: Occurs (<a onClick="return mV(\'Col\',3,23);">Col 3:23</a>) as the translation of ek psuches, "out of the soul," "Whatsoever ye do, do it heartily as unto the Lord (who sees the heart and recompenses "whatsoever good thing a man does") and not unto men" (however they, your masters according to the flesh, may regard it); the Revised Version (British and American) "work heartily," margin (Greek) "from the soul."<P>In 2Macc 4:37, we have "Antiochus was heartily sorry," psuchikos ("from the soul").``1';
isbe[4205]='Heat`het (chom, horebh, "drought," <a onClick="return mV(\'Job\',30,30);">Job 30:30</a>; <a onClick="return mV(\'Isa\',4,6);">Isa 4:6</a>; <a onClick="return mV(\'Isa\',25,4);">25:4</a>; <a onClick="return mV(\'Jer\',36,30);">Jer 36:30</a>; sharabh, <a onClick="return mV(\'Isa\',49,10);">Isa 49:10</a>, translated in the Revised Version margin "mirage"; zestos, "fervent," <a onClick="return mV(\'Rev\',3,15);">Re 3:15</a>, therme, <a onClick="return mV(\'Act\',28,3);">Ac 28:3</a>, kauma, <a onClick="return mV(\'Rev\',7,16);">Re 7:16</a>, kauson, <a onClick="return mV(\'Mat\',20,12);">Mt 20:12</a>; see <a href="study/isbe/search.html?string=MIRAGE">MIRAGE</A>):<P>1. Dreaded in Palestine:<P>The heat of the summer is greatly dreaded in Palestine, and as a rule the people rest under cover during the middle of the day, when the sun is hottest. There is no rain from May to October, and scarcely a cloud in the sky to cool the air or to screen off the burning vertical rays of the sun. The first word of advice given to visitors to the country is to protect themselves from the sun. Even on the mountains, where the temperature of the air is lower, the sun is perhaps more fierce, owing to the lesser density of the atmosphere.<P>2. Causes Disease:<P>This continuous summer heat often causes sunstroke, and the glare causes diseases of the eye which affect a large percentage of the people of Palestine and Egypt.<P>3. Relief Sought:<P>It is to be expected that in these times of heat and drought the ideal pleasure has come to be to sit in the shade by some cool flowing fountain. In the mountains the village which has the coolest spring of water is the most desired. These considerations give renewed meaning to the passages: "as cold waters to a thirsty soul" (<a onClick="return mV(\'Pro\',25,25);">Pr 25:25</a>); "He maketh me to lie down in green pastures; he leadeth me beside still waters" (<a onClick="return mV(\'Psa\',23,2);">Ps 23:2</a>). What a blessing to be "under the shadow of the Almighty" (<a onClick="return mV(\'Psa\',91,1);">Ps 91:1</a>), where "the sun shall not strike upon them, nor any heat" (<a onClick="return mV(\'Rev\',7,16);">Re 7:16</a>)!<P>4. Midday Heat:<P>The middle of the day is often referred to as the "heat of the day" (<a onClick="return mV(\'1Sa\',11,11);">1Sa 11:11</a>). It made a great difference to the army whether it could win the battle before the midday heat. Saladin won the great battle at Hattin by taking advantage of this fact. It was a particular time of the day when it was the custom to rest. "They came about the heat of the day to the house of Ish-bosheth, as he took his rest at noon" (<a onClick="return mV(\'2Sa\',4,5);">2Sa 4:5</a>). Yahweh appeared to Abraham as "he sat in the tent door in the heat of the day" (<a onClick="return mV(\'Gen\',18,1);">Ge 18:1</a>). The hardship of working throughout the day is expressed in <a onClick="return mV(\'Mat\',20,12);">Mt 20:12</a>, "who have borne the burden of the day and scorching heat." Sometimes just after sunrise the contrast of the cold of night and the heat of the sun is especially noticeable. "The sun ariseth with the scorching wind" (<a onClick="return mV(\'Jam\',1,11);">Jas 1:11</a>).<P>5. Summer Heat:<P>In summer the wind is usually from the southwest, but in case it is from the south it is sure to be hot. "When ye see a south wind blowing, ye say, There will be a scorching heat" (<a onClick="return mV(\'Luk\',12,55);">Lu 12:55</a>). The heat on a damp, sultry day, when the atmosphere is full of dust haze is especially oppressive, and is referred to in <a onClick="return mV(\'Isa\',25,5);">Isa 25:5</a> as "the heat by the shade of a cloud." The heat of summer melts the snow on the mountains and causes all vegetation to dry up and wither. Ice and snow vanish in the heat thereof (<a onClick="return mV(\'Job\',6,17);">Job 6:17</a>), "Drought and heat consume the snow waters" (<a onClick="return mV(\'Job\',24,19);">Job 24:19</a>). But the "tree planted by the waters, that spreadeth out its roots by the river...shall not fear when heat cometh, but its leaf shall be green" (<a onClick="return mV(\'Jer\',17,8);">Jer 17:8</a>).<P>6. Figurative Uses:<P>The word is used often in connection with anger in the Scriptures: "hot anger" (<a onClick="return mV(\'Exd\',11,8);">Ex 11:8</a>); "hot displeasure" (<a onClick="return mV(\'Deu\',9,19);">De 9:19</a>); "anger of the Lord was hot against Israel" (<a onClick="return mV(\'Jdg\',2,14);">Jud 2:14</a> the King James Version); "thine anger from waxing hot" (<a onClick="return mV(\'Psa\',85,3);">Ps 85:3</a> King James Version, margin); "I know thy works, that thou art neither cold nor hot" (<a onClick="return mV(\'Rev\',3,15);">Re 3:15</a>).``85';

isbe[4213]='Heavenly`hev\'-\'n-li (ouranios, epouranios): Pertaining to heaven or the heavens. See <a href="study/isbe/search.html?string=HEAVENS">HEAVENS</A>. The phrase ta epourania, translated "heavenly things" in <a onClick="return mV(\'Jhn\',3,12);">Joh 3:12</a>; <a onClick="return mV(\'Hbr\',8,5);">Heb 8:5</a>; <a onClick="return mV(\'Hbr\',9,23);">9:23</a>, but in Ephesians "heavenly places" (<a onClick="return mV(\'Jhn\',1,3,10);">Joh 1:3, 10</a>; <a onClick="return mV(\'Jhn\',2,6);">2:6</a>; <a onClick="return mV(\'Jhn\',3,10);">3:10</a>; <a onClick="return mV(\'Jhn\',6,12);">6:12</a>), has shades of meaning defined by the context. In <a onClick="return mV(\'Jhn\',3,12);">Joh 3:12</a>, in contrast with "earthly things" (i.e. such as can be brought to the test of experience), it denotes truths known only through revelation (God\'s love in salvation). In Hebrews the sense is local. In Ephesians it denotes the sphere of spiritual privilege in Christ, except in <a onClick="return mV(\'Eph\',6,12);">6:12</a>, where it stands for the unseen spiritual world, in which both good and evil forces operate. It is always the sphere of the super-earthly.``132';
isbe[4214]='Heavens`hev\'-\'nz (shamayim; ouranoi): On the physical heavens see <a href="study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</A>; <a href="study/isbe/search.html?string=WORLD">WORLD</A>. Above these, in popular conception, were the celestial heavens, the abode of God and of the hosts of angels (<a onClick="return mV(\'Psa\',11,4);">Ps 11:4</a>; <a onClick="return mV(\'Psa\',103,\'19-21\');">103:19-21</a>; <a onClick="return mV(\'Isa\',66,1);">Isa 66:1</a>; <a onClick="return mV(\'Rev\',4,2);">Re 4:2</a>; <a onClick="return mV(\'Rev\',5,11);">5:11</a>; compare <a onClick="return mV(\'Dan\',7,10);">Da 7:10</a>), though it was recognized that Yahweh\'s presence was not confined to any region (<a onClick="return mV(\'1Ki\',8,27);">1Ki 8:27</a>). Later Judaism reckoned seven heavens. The apostle Paul speaks of himself as caught up into "the third heaven," which he evidently identifies with Paradise (<a onClick="return mV(\'2Cr\',12,2);">2Co 12:2</a>).`<a href="./study/isbe/search.html?string=HEAVENLY">HEAVENLY</a>`1';
isbe[4215]='Heavens, New (And Earth, New)`1. Eschatological Idea<P>2. Earliest Conceptions: Cosmic verses National Type<P>3. Different from Mythological Theory<P>4. Antiquity of Cosmical Conception<P>5. The Cosmical Dependent on the Ethico-Religious<P>6. The End Correspondent to the Beginning<P>7. The Cosmical Heavens: <a onClick="return mV(\'Hbr\',12,\'26-29\');">Hebrews 12:26-29</a><P>8. Palingenesis: <a onClick="return mV(\'Mat\',19,28);">Matthew 19:28</a><P>9. A Purified Universe<hr /><P>1. Eschatological Idea:<P>The formal conception of new heavens and a new earth occurs in <a onClick="return mV(\'Isa\',65,17);">Isa 65:17</a>; <a onClick="return mV(\'Isa\',66,22);">66:22</a>; <a onClick="return mV(\'2Pe\',3,13);">2Pe 3:13</a>; <a onClick="return mV(\'Rev\',21,1);">Re 21:1</a> (where "heaven," singular). The idea in substance is also found in <a onClick="return mV(\'Isa\',51,16);">Isa 51:16</a>; <a onClick="return mV(\'Mat\',19,28);">Mt 19:28</a>; <a onClick="return mV(\'2Cr\',5,17);">2Co 5:17</a>; <a onClick="return mV(\'Hbr\',12,\'26-28\');">Heb 12:26-28</a>. In each case the reference is eschatological, indeed the adjective "new" seems to have acquired in this and other connections a semi-technical eschatological sense. It must be remembered that the Old Testament has no single word for "universe," and that the phrase "heaven and earth" serves to supply the deficiency. The promise of a new heavens and a new earth is therefore equivalent to a promise of world renewal.<P>2. Earliest Conceptions: Cosmic verses National Type:<P>It is a debated question how old in the history of revelation this promise is. Isaiah is the prophet with whom the idea first occurs in explicit form, and that in passages which many critics would assign to the post-exilic period (the so-called Trito-Isaiah). In general, until recently, the trend of criticism has been to represent the universalistic-cosmic type of eschatology as developed out of the particularistic-national type by a gradual process of widening of the horizon of prophecy, a view which would put the emergence of the former at a comparatively late date. More recently, however, Gressmann (Der Ursprung der israelitisch-judischen Eschatologie, 1905) and others have endeavored to show that often even prophecies belonging to the latter type embody material and employ means of expression which presuppose acquaintance with the idea of a world-catastrophe at the end. On this view the world-eschatology would have, from ancient times, existed alongside of the more narrowly confined outlook, and would be even older than the latter. These writers further assume that the cosmic eschatology was not indigenous among the Hebrews, but of oriental (Babylonian) origin, a theory which they apply not only to the more developed system of the later apocalyptic writings, but also to its preformations in the Old Testament. The cosmic eschatology is not believed to have been the distinctive property of the great ethical prophets, but rather a commonly current mythological belief to which the prophets refer without formally endorsing it.<P>3. Different from Mythological Theory:<P>Its central thought is said to have been the belief that the end of the world-process must correspond to the beginning, that consequently the original condition of things, when heaven and earth were new, must repeat itself at some future point, and the state of paradise with its concomitants return, a belief supposed to have rested on certain astronomical observations.<P>4. Antiquity of Cosmical Conception<P>While this theory in the form presented is unproven and unacceptable, it deserves credit for having focused attention on certain phenomena in the Old Testament which clearly show that Messianic prophecy, and particularly the world-embracing scope which it assumes in some predictions, is far older than modern criticism had been willing to concede. The Old Testament from the beginning has an eschatology and puts the eschatological promise on the broadest racial basis (<a onClick="return mV(\'Gen\',3,\'1-\');">Ge 3</a>). It does not first ascend from Israel to the new humanity, but at the very outset takes its point of departure in the race and from this descends to the election of Israel, always keeping the Universalistic goal in clear view. Also in the earliest accounts, already elements of a cosmical universalism find their place side by side with those of a racial kind, as when Nature is represented as sharing in the consequences of the fall of man.<P>5. The Cosmical Dependent on the Ethico-Religious:<P>As regards the antiquity of the universalistic and cosmical eschatology, therefore, the conclusions of these writers may be registered as a gain, while on the two other points of the pagan origin and the unethical character of the expectation involved, dissent from them should be expressed. According to the Old Testament, the whole idea of world-renewal is of strictly super-natural origin, and in it the cosmical follows the ethical hope. The cosmical eschatology is simply the correlate of the fundamental Biblical principle that the issues of the world-process depend on the ethico-religious developments in the history of man (compare <a onClick="return mV(\'2Pe\',3,13);">2Pe 3:13</a>).<P>6. The End Correspondent to the Beginning:<P>But the end correspondent to the beginning is likewise a true Scriptural principle, which theory in question has helped to reemphasize, although there is this difference that Scripture does not look forward to a repetition of the same process, but to a restoration of the primeval harmony on a higher plane such as precludes all further disturbance. In the passages above cited, there are clear reminiscences of the account of creation (<a onClick="return mV(\'Isa\',51,16);">Isa 51:16</a>, "that I may plant the heavens, and lay the foundations of the earth"; <a onClick="return mV(\'Isa\',65,17);">Isa 65:17</a>, "I create new heavens and a new earth"; <a onClick="return mV(\'2Pe\',3,13);">2Pe 3:13</a> compared with <a onClick="return mV(\'2Pe\',3,\'4-6\');">2Pe 3:4-6</a>; <a onClick="return mV(\'Rev\',21,1);">Re 21:1</a> compared with the imagery of paradise throughout the chapter). Besides this, where the thought of the renewal of earth is met with in older prophecy, this is depicted in colors of the state of paradise (<a onClick="return mV(\'Isa\',11,\'6-9\');">Isa 11:6-9</a>; <a onClick="return mV(\'Hsa\',2,\'18-21\');">Ho 2:18-21</a>). The "regeneration" (palingenesia) of <a onClick="return mV(\'Mat\',19,28);">Mt 19:28</a> also points back to the first genesis of the world. The \'inhabited earth to come\' (oikoumene mellousa) of <a onClick="return mV(\'Hbr\',2,5);">Heb 2:5</a> occurs at the opening of a context throughout which the account of <a onClick="return mV(\'Gen\',1,\'1-\');">Ge 1-3</a> evidently stood before the writer\'s mind.<P>7. The Cosmical Heavens: <a onClick="return mV(\'Hbr\',12,\'26-29\');">Hebrews 12:26-29</a>:<P>In the combination "new heavens and a new earth," the term "heavens" must therefore be taken in the sense imposed upon it by the story of creation, where "heavens" designates not the celestial habitation of God, but the cosmical heavens, the region of the supernal waters, sun moon and stars. The Bible nowhere suggests that there is anything abnormal or requiring renewal in God\'s dwelling-place (<a onClick="return mV(\'Hbr\',9,23);">Heb 9:23</a> is of a different import). In <a onClick="return mV(\'Rev\',21,\'1-\');">Re 21</a>, where "the new heaven and the new earth" appear, it is at the same time stated that the new Jerusalem comes down from God out of heaven (compare <a onClick="return mV(\'Rev\',21,1,2,10);">21:1,2,10</A>). In <a onClick="return mV(\'Hbr\',12,\'26-28\');">Heb 12:26-28</a> also the implication is that only the lower heavens are subject to renewal. The "shaking" that accompanies the new covenant and corresponds to the shaking of the law-giving at Sinai, is a shaking of "not the earth only, but also the heaven." This shaking, in its reference to heaven as well as to earth, signifies a removal of the things shaken. But from the things thus shaken and removed (including heaven), the writer distinguishes "those things which are not shaken," which are destined to remain, and these are identified with the kingdom of God. The kingdom of God, however, according to the general trend of the teaching of the epistle, has its center in the heavenly world. The words "that have been made," in 12:27, do not assign their created character as the reason why heaven and earth can be shaken, an exegesis which would involve us in the difficulty that among that which remains there is something uncreated besides God; the true construction and correct paraphrase are: "as of things that were made with the thought in the mind of God that those things which cannot be shaken may remain," i.e. already at creation God contemplated an unchangeable universe as the ultimate, higher state of things.<P>8. Palingenesis: <a onClick="return mV(\'Mat\',19,28);">Matthew 19:28</a>:<P>In <a onClick="return mV(\'Mat\',19,28);">Mt 19:28</a> the term palingenesia marks the world-renewing as the renewal of an abnormal state of things. The Scripture teaching, therefore, is that around the center of God\'s heaven, which is not subject to deterioration or renewal, a new cosmical heaven and a new earth will be established to be the dwelling-place of the eschatological humanity. The light in which the promise thus appears reminds us that the renewed kosmos, earth as well as cosmical heavens, is destined to play a permanent (not merely provisional, on the principle of chiliasm) part in the future life of the people of God. This is in entire harmony with the prevailing Biblical representation, not only in the Old Testament but likewise in the New Testament (compare <a onClick="return mV(\'Mat\',5,5);">Mt 5:5</a>; <a onClick="return mV(\'Hbr\',2,5);">Heb 2:5</a>), although in the Fourth Gospel and in the Pauline Epistles the emphasis is to such an extent thrown on the heaven-centered character of the future life that the role to be played in it by the renewed earth recedes into the background. Revelation, on the other hand, recognizes this element in its imagery of "the new Jerus" coming down from God out of heaven upon earth.<P>9. A Purified Universe:<P>That the new heavens and the new earth are represented as the result of a "creation" does not necessarily involve a production ex nihilo. The terms employed in <a onClick="return mV(\'2Pe\',3,\'6-13\');">2Pe 3:6-13</a> seem rather to imply that the renewal will out of the old produce a purified universe, whence also the catastrophe is compared to that of the Deluge. As then the old world perished by water and the present world arose out of the flood, so in the end-crisis "the heavens shall be dissolved by fire and the elements melt with fervent heat," to give rise to the new heaven and the new earth in which righteousness dwells. The term palingenesia (<a onClick="return mV(\'Mat\',19,28);">Mt 19:28</a>) points to renewal, not to creation de novo. The Talmud also teaches that the world will pass through a process of purification, although at the same time it seems to break up the continuity between this and the coming world by the fantastic assumption that the new heavens and the new earth of <a onClick="return mV(\'Isa\',65,17);">Isa 65:17</a> were created at the close of the Hexemeron of <a onClick="return mV(\'Gen\',1,\'1-\');">Ge 1</a>. This was inferred from the occurrence of the article in <a onClick="return mV(\'Isa\',66,22);">Isa 66:22</a>, "the new heavens and the new earth."``182';
isbe[4216]='Heavy; Heaviness`hev\'-i, hev\'-i-nes (kabhedh, de\'aghah; lupe):<P>1. Literal:<P>Heavy (heave, to lift) is used literally with respect to material things, as the translation of kobhedh, "heaviness" (<a onClick="return mV(\'Pro\',27,3);">Pr 27:3</a>, "a stone is heavy"); of kabhedh, "to be weighty" (<a onClick="return mV(\'1Sa\',4,18);">1Sa 4:18</a>; <a onClick="return mV(\'2Sa\',14,26);">2Sa 14:26</a>; <a onClick="return mV(\'Lam\',3,7);">La 3:7</a>); of \'amac, "to load" (<a onClick="return mV(\'Isa\',46,1);">Isa 46:1</a> the King James Version; compare <a onClick="return mV(\'Mat\',26,43);">Mt 26:43</a>; <a onClick="return mV(\'Mar\',14,40);">Mr 14:40</a>; <a onClick="return mV(\'Luk\',9,32);">Lu 9:32</a>, "Their eyes were heavy"); bareomai, "to be weighed down."<P>2. Figuratively:<P>It is used<P>(1) for what is hard to bear, oppressive, kabhedh (<a onClick="return mV(\'Exd\',18,18);">Ex 18:18</a>; <a onClick="return mV(\'Num\',11,14);">Nu 11:14</a>; <a onClick="return mV(\'1Sa\',5,6,11);">1Sa 5:6, 11</a>; <a onClick="return mV(\'Psa\',38,4);">Ps 38:4</a>; <a onClick="return mV(\'Isa\',24,20);">Isa 24:20</a>); motah, a "yoke" (<a onClick="return mV(\'Isa\',58,6);">Isa 58:6</a>, the Revised Version (British and American) "bands of the yoke"); qasheh, "sharp," "hard" (<a onClick="return mV(\'1Ki\',14,6);">1Ki 14:6</a>, "heavy tidings"); barus, "heavy" (<a onClick="return mV(\'Mat\',23,4);">Mt 23:4</a>);<P>(2) for sad, sorrowful (weighed down), mar, "bitter" (<a onClick="return mV(\'Pro\',31,6);">Pr 31:6</a>, the Revised Version (British and American) "bitter"); ra\', "evil" (<a onClick="return mV(\'Pro\',25,20);">Pr 25:20</a>); ademoneo, literally, "to be sated," "wearied," then, "to be very heavy," "dejected" (<a onClick="return mV(\'Mat\',26,37);">Mt 26:37</a>, of our Lord in Gethsemane, "(he) began to be sorrowful and very heavy," the Revised Version (British and American) "sore troubled"); "ademonein denotes a kind of stupefaction and bewilderment, the intellectual powers reeling and staggering under the pressure of the ideas presented to them" (Mason, The Conditions of our Lord\'s Life on Earth); compare <a onClick="return mV(\'Mar\',14,33);">Mr 14:33</a>;<P>(3) morose, sulky, as well as sad, car, "sullen," "sour," "angry" (<a onClick="return mV(\'1Ki\',20,43);">1Ki 20:43</a>; <a onClick="return mV(\'1Ki\',21,4);">21:4</a>, "heavy and displeased");<P>(4) dull, kabhedh (<a onClick="return mV(\'Isa\',6,10);">Isa 6:10</a>, "make their ears heavy"; <a onClick="return mV(\'Isa\',59,1);">Isa 59:1</a>, "neither (is) his ear heavy");<P>(5) "tired" seems to be the meaning in <a onClick="return mV(\'Exd\',17,12);">Ex 17:12</a>, "Moses\' hands were heavy" (kabhedh); compare <a onClick="return mV(\'Mat\',26,43);">Mt 26:43</a> and parallels above.<P>Heavily is the translation of kebhedhuth, "heaviness" (<a onClick="return mV(\'Exd\',14,25);">Ex 14:25</a>), meaning "with difficulty"; of qadhar, "to be black," "to be a mourner" (<a onClick="return mV(\'Psa\',35,14);">Ps 35:14</a> the King James Version, the Revised Version (British and American) "I bowed down mourning"); of kabhedh (<a onClick="return mV(\'Isa\',47,6);">Isa 47:6</a>).<P>Heaviness has always the sense of anxiety, sorrow, grief, etc.; de\'aghah, "fear," "dread," "anxious care" (<a onClick="return mV(\'Pro\',12,25);">Pr 12:25</a>, "Heaviness in the heart of a man maketh it stoop," the Revised Version margin "or care"); kehah, "to be feeble," "weak" (<a onClick="return mV(\'Isa\',61,3);">Isa 61:3</a>, "the spirit of heaviness"); panim, "face," "aspect" (<a onClick="return mV(\'Job\',9,27);">Job 9:27</a> the King James Version, "I will leave off my heaviness," the Revised Version (British and American) "(sad) countenance"; compare 2Esdras 5:16; The <span class="noTag">Wisdom of Solomon 17:4</span>; Ecclesiasticus 25:23); ta\'aniyah, from \'anah, "to groan," "to sigh" (<a onClick="return mV(\'Isa\',29,2);">Isa 29:2</a>, the Revised Version (British and American) "mourning and lamentation"); tughah, "sadness," "sorrow" (<a onClick="return mV(\'Psa\',119,28);">Ps 119:28</a>; <a onClick="return mV(\'Pro\',10,1);">Pr 10:1</a>; <a onClick="return mV(\'Pro\',14,13);">14:13</a>); ta\'anith, "affliction of one\'s self," "fasting" (<a onClick="return mV(\'Ezr\',9,5);">Ezr 9:5</a>, the Revised Version (British and American) "humiliation," margin "fasting"); katepheia, "dejection," "sorrow" (literally, "of the eyes") (<a onClick="return mV(\'Jam\',4,9);">Jas 4:9</a>, "your joy (turned) to heaviness"); lupe, "grief" (<a onClick="return mV(\'Rom\',9,2);">Ro 9:2</a>, the Revised Version (British and American) "great sorrow"; <a onClick="return mV(\'2Cr\',2,1);">2Co 2:1</a>, the Revised Version (British and American) "sorrow"); lupeomai (<a onClick="return mV(\'1Pe\',1,6);">1Pe 1:6</a>, the Revised Version (British and American) "put to grief"); for nush, "to be sick," "feeble" (<a onClick="return mV(\'Psa\',69,20);">Ps 69:20</a>, the Revised Version margin "sore sick"), and ademoneo (<a onClick="return mV(\'Phl\',2,26);">Php 2:26</a> the Revised Version (British and American) "sore troubled"), the King James Version has "full of heaviness." "Heaviness," in the sense of sorrow, sadness, occurs in 2Esdras 10:7,8,24; Tobit 2:5; lupe (Ecclesiasticus 22:4, the Revised Version (British and American) "grief"; 30:21, "Give not thy soul to heaviness," the Revised Version (British and American) "sorrow"; 1Macc 6:4); lupeo (Ecclesiasticus 30:9, the Revised Version (British and American) "will grieve thee"; penthos (1Macc 3:51, etc.).<P>The Revised Version has "heavier work" for "more work" (<a onClick="return mV(\'Exd\',5,9);">Ex 5:9</a>); "heavy upon men" for "common among men" (<a onClick="return mV(\'Ecc\',6,1);">Ec 6:1</a>); for "were heavy loaden" (<a onClick="return mV(\'Isa\',46,1);">Isa 46:1</a>), "are made a load"; for "the burden thereof is heavy" (<a onClick="return mV(\'Isa\',30,27);">Isa 30:27</a>), "in thick rising smoke."``185';
isbe[4217]='Heber`he\'-ber (chebher, "associate" or, possibly, "enchanter"; Eber): A name occurring several times in the Old Testament as the name of an individual or of a clan.<P>(1) A member of the tribe of Asher and son of Beraiah (<a onClick="return mV(\'Gen\',46,17);">Ge 46:17</a>; <a onClick="return mV(\'Num\',26,45);">Nu 26:45</a>; <a onClick="return mV(\'1Ch\',7,31);">1Ch 7:31</a>f).<P>(2) A Kenite, husband of Jael, who deceptively slew Sisera, captain of the army of Jabin, a Canaanite king (<a onClick="return mV(\'Jdg\',4,17);">Jud 4:17</a>; <a onClick="return mV(\'Jdg\',5,24);">5:24</a>). He had separated himself from the main body of the Kenites, which accounts for his tent being near Kedesh, the place of Sisera\'s disastrous battle (<a onClick="return mV(\'Jdg\',4,11);">Jud 4:11</a>).<P>(3) Head of a clan of Judah, and son of Mered by his Jewish, as distinguished from an Egyptian wife. He was father, or founder, of Soco (<a onClick="return mV(\'1Ch\',4,18);">1Ch 4:18</a>).<P>(4) A Benjamite, or clan or family of Elpaal belonging to Benjamin (<a onClick="return mV(\'1Ch\',8,17);">1Ch 8:17</a>).<P>(5) Heber, of our Lord\'s genealogy (<a onClick="return mV(\'Luk\',3,35);">Lu 3:35</a> the King James Version), better, Eber.<P>So, the name "Eber," \'ebher, in <a onClick="return mV(\'1Ch\',5,13);">1Ch 5:13</a>; <a onClick="return mV(\'1Ch\',8,22);">8:22</a>, is not to be confused with Heber, chebher, as in the foregoing passages.``137';
isbe[4218]='Heberites`he\'-ber-its (ha-chebhri): Descendants of Heber, a prominent clan of Asher, (<a onClick="return mV(\'Num\',26,45);">Nu 26:45</a>). Supposed by some to be connected with the Chabiri of the Tell el-Amarna Letters.``1';
isbe[4219]='Hebrew Language``<a href="./study/isbe/search.html?string=LANGUAGES+OF+THE+OLD+TESTAMENT">LANGUAGES OF THE OLD TESTAMENT</a>; <a href="./study/isbe/search.html?string=ARAMAIC;+ARAMAIC+LANGUAGE">ARAMAIC</a>`1';
isbe[4220]='Hebrew; Hebrewess`he\'-broo, he\'-broo-es (\'ibhri, feminine \'ibhriyah; Hebraios): The earliest name for Abraham (<a onClick="return mV(\'Gen\',14,13);">Ge 14:13</a>) and his descendants (Joseph, <a onClick="return mV(\'Gen\',39,14,17);">Ge 39:14, 17</a>; <a onClick="return mV(\'Gen\',40,15);">40:15</a>; <a onClick="return mV(\'Gen\',41,12);">41:12</a>; <a onClick="return mV(\'Gen\',43,32);">43:32</a>; Israelites in Egypt, <a onClick="return mV(\'Exd\',1,15);">Ex 1:15</a>; <a onClick="return mV(\'Exd\',2,6,11,13);">2:6, 11, 13</a>; <a onClick="return mV(\'Exd\',3,18);">3:18</a>; in laws, <a onClick="return mV(\'Exd\',21,2);">Ex 21:2</a>; <a onClick="return mV(\'Deu\',15,12);">De 15:12</a>; in history, <a onClick="return mV(\'1Sa\',4,6,9);">1Sa 4:6, 9</a>; <a onClick="return mV(\'1Sa\',13,7,19);">13:7, 19</a>, etc.; later, <a onClick="return mV(\'Jer\',34,9);">Jer 34:9</a>, "Hebrewess," 34:14; <a onClick="return mV(\'Jon\',1,9);">Jon 1:9</a>; in the New Testament, <a onClick="return mV(\'Act\',6,1);">Ac 6:1</a>; <a onClick="return mV(\'2Cr\',11,22);">2Co 11:22</a>; <a onClick="return mV(\'Phl\',3,5);">Php 3:5</a>). The etymology of the word is disputed. It may be derived from Eber (<a onClick="return mV(\'Gen\',10,21,24,25);">Ge 10:21, 24-25</a>, etc.), or, as some think, from the verb \'abhar, "to cross over" (people from across the Euphrates; compare <a onClick="return mV(\'Jos\',24,2);">Jos 24:2</a>). A connection is sought by some with the apri or epri of the Egyptian monuments, and again with the Habiri of the Tell el-Amarna Letters. In <a onClick="return mV(\'Act\',6,1);">Ac 6:1</a>, the "Hebrews" are contrasted with "Hellenists," or Greek-speaking Jews. By the "Hebrew" tongue in the New Testament (Hebraisti, <a onClick="return mV(\'Jhn\',5,2);">Joh 5:2</a>; <a onClick="return mV(\'Jhn\',19,13,17,20);">19:13, 17, 20</a>; <a onClick="return mV(\'Jhn\',20,16);">20:16</a>) is meant <a href="./study/isbe/search.html?string=ARAMAIC;+ARAMAIC+LANGUAGE">ARAMAIC</A> (which see), but also in <a onClick="return mV(\'Rev\',9,11);">Re 9:11</a>; <a onClick="return mV(\'Rev\',16,16);">16:16</a>, Hebrew proper.``132';
isbe[4221]='Hebrews, Epistle to the`he\'-brooz,<P><b>I. TITLE</b><P><b>II. LITERARY</b><P class="in15">1. The Author\'s Culture and Style<P class="in15">2. Letter, Epistle or Treatise?<P class="in15">3. A Unity or a Composite Work?<P><B>III. THE AUTHOR</b><P class="in15">1. Tradition<P class="in30">(1) Alexandrian: Paul<P class="in30">(2) African: Barnabas<P class="in30">(3) Rome and the West: Anonymous<P class="in15">2. The Witness of the Epistle Itself<P class="in30">(1) Paul not the Author<P class="in30">(2) Other Theories<p class="in45">(a) Luke and Clement<p class="in45">(b) Barnabas; Priscilla and Aquila; Philip; Aristion; Apollos<P><b>IV. DESTINATION</b><P class="in15">1. General Character of the Readers<P class="in15">2. Jews or Gentiles?<P class="in15">3. The Locality of the Readers<P><b>V. DATE</b><P class="in15">1. Terminal Dates<P class="in15">2. Conversion and History of the Readers<P class="in15">3. Doctrinal Development<P class="in15">4. The Fall of Jerusalem<P class="in15">5. Timothy<P class="in15">6. Two Persecutions<P><b>VI. CONTENTS</b><P class="in15">1. Summary of Contents<P class="in15">2. The Main Theme<P class="in15">3. Alexandrian Influences<P class="in15">4. The Christian Factor<P><b>LITERATURE</b><hr /><P>I. Title.<P>In the King James Version and the English Revised Version the title of this book describes it as "the Epistle of Paul the Apostle to the Hebrews." Modern scholarship has disputed the applicability of every word of this title. Neither does it appear in the oldest manuscripts, where we find simply "to Hebrews" (pros Hebraious). This, too, seems to have been prefixed to the original writing by a collector or copyist. It is too vague and general for the author to have used it. And there is nothing in the body of the book which affirms any part of either title. Even the shorter title was an inference from the general character of the writing. Nowhere is criticism less hampered by problems of authenticity and inspiration. No question arises, at least directly, of pseudonymity either of author or of readers, for both are anonymous. For the purpose of tracing the history and interpreting the meaning of the book, the absence of a title, or of any definite historical data, is a disadvantage. We are left to infer its historical context from a few fragments of uncertain tradition, and from such general references to historical conditions as the document itself contains. Where no date, name or well-known event is fixed, it becomes impossible to decide, among many possibilities, what known historical conditions, if any, are pre-supposed. Yet this very fact, of the book\'s detachment from personal and historical incidents, renders it more self-contained, and its exegesis less dependent upon understanding the exact historical situation. But its general relation to the thought of its time must be taken into account if we are to understand it at all.<P>II. Literary Form.<P>1. The Author\'s Culture and Style:<P>The writer was evidently a man of culture, who had a masterly command of the Greek language. The theory of Clement of Alexandria, that the work was a translation from Hebrew, was merely an inference from the supposition that it was first addressed to Hebrew-speaking Christians. It bears none of the marks of a translation. It is written in pure idiomatic Greek. The writer had an intimate knowledge of the Septuagint, and was familiar with Jewish life. He was well-read in Hellenic literature (e.g. Wisdom), and had probably made a careful study of Philo (see VI below). His argument proceeds continuously and methodically, in general, though not strict, accord with the rules of Greek rhetoric, and without the interruptions and digressions which render Paul\'s arguments so hard to follow. "Where the literary skill of the author comes out is in the deft adjustment of the argumentative to the hortatory sections" (Moffatt, Introduction, 424f). He has been classed with Luke as the most "cultured" of the early Christian writers.<P>2. Letter, Epistle or Treatise?:<P>It has been questioned whether Hebrews is rightly called a letter at all. Unlike all Paul\'s letters, it opens without any personal note of address or salutation; and at the outset it sets forth, in rounded periods and in philosophical language, the central theme which is developed throughout. In this respect it resembles the Johannine writings alone in the New Testament. But as the argument proceeds, the personal note of application, exhortation and expostulation emerges more clearly (<a onClick="return mV(\'Hbr\',2,1);">Heb 2:1</a>; <a onClick="return mV(\'Hbr\',3,\'1-12\');">3:1-12</a>; <a onClick="return mV(\'Hbr\',4,1,14);">4:1, 14</a>; <a onClick="return mV(\'Hbr\',5,11);">5:11</a>; <a onClick="return mV(\'Hbr\',6,9);">6:9</a>; <a onClick="return mV(\'Hbr\',10,9);">10:9</a>; <a onClick="return mV(\'Hbr\',13,7);">13:7</a>); and it ends with greetings and salutations (<a onClick="return mV(\'Hbr\',13,18);">Heb 13:18</a>). The writer calls it "a word of exhortation." The verb epesteila (the Revised Version (British and American) "I have written") is the usual expression for writing a letter (<a onClick="return mV(\'Hbr\',13,22);">Heb 13:22</a>). Hebrews begins like an essay, proceeds like a sermon, and ends as a letter.<P>Deissmann, who distinguishes between a "true letter," the genuine personal message of one man to another, and an "epistle," or a treatise written in imitation of the form of a letter, but with an eye on the reading public, puts Hebrews in the latter class; nor would he "consider it anything but a literary oration—hence, not as an epistle at all—if the epesteila, and the greetings at the close, did not permit of the supposition that it had at one time opened with something of the nature of an address as well" (Bible Studies, 49-50). There is no textual or historical evidence of any opening address having ever stood as part of the text; nor does the opening section bear any mark or suggestion of fragmentariness, as if it had once followed such an address.<P>Yet the supposition that a greeting once stood at the beginning of our document is not so impossible as Zahn thinks (Introduction to the New Testament, II, 313f), as a comparison with James or 1 Peter will show.<P>So unusual is the phenomenon of a letter without a greeting, that among the ancients, Pantaenus had offered the explanation that Paul, out of modesty, had refrained from putting his name to a letter addressed to the Hebrews, because the Lord Himself had been apostle to them.<P>In recent times, Julicher and Harnack have conjectured that the author intentionally suppressed the greeting, either from motives of prudence at a time of persecution, or because it was unnecessary, since the bearer of the letter would communicate the name of the sender to the recipients.<P>Overbeck advanced the more revolutionary hypothesis that the letter once opened with a greeting, but from someone other than Paul; that in order to satisfy the general conditions of canonization, the non-apostolic greeting was struck out by the Alexandrians, and the personal references in <a onClick="return mV(\'Hbr\',13,\'22-25\');">Heb 13:22-25</a> added, in order to represent it as Pauline.<P>3. A Unity or a Composite Work?:<P>W. Wrede, starting from this theory, rejects the first part of it and adopts the second. He does not base his hypothesis on the conditions of canonization, but on an examination of the writing itself. He adopts Deissmann\'s rejected alternative, and argues that the main part of the book was originally not an epistle at all, but a general doctrinal treatise. Then <a onClick="return mV(\'Hbr\',13,\'1-\');">Heb 13</a>, and especially <a onClick="return mV(\'Hbr\',13,18);">13:18</A>ff, were added by a later hand, in order to represent the whole as a Pauline letter, and the book in its final form was made, after all, pseudonymous. The latter supposition is based upon an assumed reference to imprisonment in <a onClick="return mV(\'Hbr\',13,19);">13:19</A> (compare <a onClick="return mV(\'Phm\',1,22);">Phm 1:22</a>) and upon the reference to Timothy in <a onClick="return mV(\'Hbr\',13,23);">Heb 13:23</a> (compare <a onClick="return mV(\'Phl\',2,19);">Php 2:19</a>); and the proof that these professed Pauline phrases are not really Pauline is found in a supposed contradiction between <a onClick="return mV(\'Hbr\',13,19);">Heb 13:19</a> and <a onClick="return mV(\'Hbr\',13,23);">13:23</A>. But <a onClick="return mV(\'Hbr\',13,19);">13:19</A> does not necessarily refer to imprisonment exclusively or even at all, and therefore it stands in no contradiction with <a onClick="return mV(\'Hbr\',13,23);">13:23</A> (compare <a onClick="return mV(\'Rom\',1,\'9-13\');">Ro 1:9-13</a>). And Timothy must have associated with many Christian leaders besides Paul. But why should anybody who wanted to represent the letter as Pauline and who scrupled not to add to it for that purpose, refrain from the obvious device of prefixing a Pauline greeting? Moreover, it is only by the most forced special pleading that it can be maintained that <a onClick="return mV(\'Hbr\',1,\'1-\');">Heb 1-12</a> are a mere doctrinal treatise, devoid of all evidences of a personal relation to a circumscribed circle of readers. The period and manner of the readers\' conversion are defined (<a onClick="return mV(\'Hbr\',2,3);">2:3</A>f). Their present spiritual condition is described in terms of such anxiety and hope as betoken a very intimate personal relation (<a onClick="return mV(\'Hbr\',5,11);">5:11</a>f; <a onClick="return mV(\'Hbr\',6,\'9-11\');">6:9-11</a>). Their past conflicts, temptations, endurance and triumph are recalled for their encouragement under present trials, and both past and present are defined in particular terms that point to concrete situations well known to writer and readers (<a onClick="return mV(\'Hbr\',10,\'32-36\');">10:32-36</a>). There is, it is true, not in Hebrews the same intense and all-pervading personal note as appears in the earlier Pauline letters; the writer often loses sight of his particular audience and develops his argument in detached and abstract form. But it cannot be assumed that nothing is a letter which does not conform to the Pauline model. And the presence of long, abstract arguments does not justify the excision or explaining away of undoubted personal passages. Neither the language nor the logic of the book either demands or permits the separation of doctrinal and personal passages from one another, so as to leave for residuum a mere doctrinal treatise. Doctrinal statements lead up to personal exhortations, and personal exhortations form the transition to new arguments; they are indissolubly involved in one another; and chapter <a onClick="return mV(\'Hbr\',13,\'1-\');">13</a> presents no such exceptional features as to justify its separation from the whole work. There is really no reason, but the unwarrantable assumption that an ancient writer must have conformed with a certain convention of letter-writing, to forbid the acceptance of Hebrews for what it appears to be—a defense of Christianity written for the benefit of definite readers, growing more intimate and personal as the writer gathers his argument into a practical appeal to the hearts and consciences of his readers,<P>III. The Author.<P>Certain coincidences of language and thought between this epistle and that of Clement of Rome to the Corinthians justify the inference that Hebrews was known in Rome toward the end of the 1st century AD (compare <a onClick="return mV(\'Hbr\',11,7,31);">Heb 11:7, 31</a> and <a onClick="return mV(\'Hbr\',1,3);">1:3</A>ff with Clement ad Cor 9,12,36). Clement makes no explicit reference to the book or its author: the quotations are unacknowledged. But they show that Hebrews already had some authority in Rome. The same inference is supported by similarities of expression found also in the Shepherd of Hermas. The possible marks of its influence in Polycarp and Justin Martyr are too uncertain and indefinite to justify any inference. Its name does not appear in the list of New Testament writings compiled and acknowledged by Marcion, nor in that of the Muratorian Fragment. The latter definitely assigns letters by Paul to only seven churches, and so inferentially excludes Hebrews.<P>When the book emerges into the clear light of history toward the end of the 2nd century, the tradition as to its authorship is seen to divide into three different streams.<P>(1) Alexandrian: Paul<P>In Alexandria, it was regarded as in some sense the work of Paul. Clement tells how his teacher, apparently Pantaenus, explained why Paul does not in this letter, as in others, address his readers under his name. Out of reverence for the Lord (II, 2, above) and to avoid suspicion and prejudice, he as apostle of the Gentiles refrains from addressing himself to the Hebrews as their apostle. Clement accepts this explanation, and adds to it that the original Hebrew of Paul\'s epistle had been translated into Greek by Luke. That Paul wrote in Hebrew was assumed from the tradition or inference that the letter was addressed to Aramaic-speaking Hebrews. Clement also had noticed the dissimilarity of its Greek from that of Paul\'s epistles, and thought he found a resemblance to that of Acts.<P>Origen starts with the same tradition, but he knew, moreover, that other churches did not accept the Alexandrian view, and that they even criticized Alexandria for admitting Hebrews into the Canon. And he feels, more than Clement, that not only the language, but the forms of thought are different from those of Paul\'s epistles. This he tries to explain by the hypothesis that while the ideas were Paul\'s, they had been formulated and written down by some other disciple. He found traditions that named Luke and Clement of Rome, but who the actual writer was, Origen declares that "God alone knows."<P>The Pauline tradition persisted in Alexandria, and by the 4th century it was accepted without any of the qualifications made by Clement and Origen. It had also in the same period spread over the other eastern churches, both Greek and Syrian. But the Pauline tradition, where it is nearest the fountain-head of history, in Clement and Origen, only ascribes Hebrews to Paul in a secondary sense.<P>(2) African: Barnabas<P>In the West, the Pauline tradition failed to assert itself till the 4th century, and was not generally accepted till the 5th century. In Africa, another tradition prevailed, namely, that Barnabas was the author. This was the only other definite tradition of authorship that prevailed in antiquity. Tertullian, introducing a quotation of <a onClick="return mV(\'Hbr\',6,1,4,5,6);">Heb 6:1, 4-6</a>, writes: "There is also an Epistle to the Hebrews under the name of Barnabas...and the Epistle of Barnabas is more generally received among the churches than that apocryphal \'Shepherd\' of adulterers" (De Pudicitia, 20). Tertullian is not expressing his mere personal opinion, but quoting a tradition which had so far established itself as to appear in the title of the epistle in the MS, and he betrays no consciousness of the existence of any other tradition. Zahn infers that this view prevailed in Montanist churches and may have originated in Asia. Moffatt thinks that it had also behind it "some Roman tradition" (Introduction, 437). If it was originally, or at any time, the tradition of the African churches, it gave way there to the Alexandrian view in the course of the 4th century. A Council of Hippo in 393 reckons "thirteen epistles of the apostle Paul, and one by the same to the Hebrews." A council of Carthage in 419 reckons "fourteen epistles of the apostle Paul." By such gradual stages did the Pauline tradition establish itself.<P>(3) Rome and the West: Anonymous<P>All the evidence tends to show that in Rome and the remaining churches of the West, the epistle was originally anonymous. No tradition of authorship appears before the 4th century. And Stephen Gobarus, writing in 600, says that both Irenaeus and Hippolytus denied the Pauline authorship. Photius repeats this statement as regards Hippolytus. Neither he nor Gobarus mentions any alternative view (Zahn, Intro, II, 310). The epistle was known in Rome (to Clement) toward the end of the 1st century, and if Paul\'s name, or any other, had been associated with it from the beginning, it is impossible that it could have been forgotten by the time of Hippolytus. The western churches had no reason for refusing to admit Hebrews into the Pauline and canonical list of books, except only that they did not believe it to be the work of Paul, or of any other apostle.<P>It seems therefore certain that the epistle first became generally known as an anonymous writing. Even the Alexandrian tradition implies as much, for it appears first as an explanation by Pantaenus why Paul concealed his name. The idea that Paul was the author was therefore an Alexandrian inference. The religious value of the epistle was naturally first recognized in Alexandria, and the name of Paul, the chief letter-writer of the church, at once occurred to those in search for its author. Two facts account for the ultimate acceptance of that view by the whole church. The spiritual value and authority of the book were seen to be too great to relegate it into the same class as the Shepherd or the Epistle of Barnabas. And the conception of the Canon developed into the hard-and-fast rule of apostolicity. No writing could be admitted into the Canon unless it had an apostle for its author; and when Hebrews could no longer be excluded, it followed that its apostolic authorship must be affirmed. The tradition already existing in Alexandria supplied the demand, and who but Paul, among the apostles, could have written it?<P>The Pauline theory prevailed together with the scheme of thought that made it necessary, from the 5th to the 16th century. The Humanists and the Reformers rejected it. But it was again revived in the 17th and 18th centuries, along with the recrudescence of scholastic ideas. It is clear, however, that tradition and history shed no light upon the question of the authorship of Hebrews. They neither prove nor disprove the Pauline, or any other theory.<P>2. The Witness of the Epistle Itself:<P>We are therefore thrown back, in our search for the author, on such evidence as the epistle itself affords, and that is wholly inferential. It seems probable that the author was a Hellenist, a Greek-speaking Jew. He was familiar with the Scriptures of the Old Testament and with the religious ideas and worship of the Jews. He claims the inheritance of their sacred history, traditions and institutions (<a onClick="return mV(\'Hbr\',1,1);">Heb 1:1</a>), and dwells on them with an intimate knowledge and enthusiasm that would be improbable, though not impossible, in a proselyte, and still more in a Christian convert from heathenism. But he knew the Old Testament only in the Septuagint translation, which he follows even where it deviates from the Hebrew. He writes Greek with a purity of style and vocabulary to which the writings of Luke alone in the New Testament can be compared. His mind is imbued with that combination of Hebrew and Greek thought which is best known in the writings of Philo. His general typological mode of thinking, his use of the allegorical method, as well as the adoption of many terms that are most familiar in Alexandrian thought, all reveal the Hellenistic mind. Yet his fundamental conceptions are in full accord with the teaching of Paul and of the Johannine writings.<P>The central position assigned to Christ, the high estimate of His person, the saving significance of His death, the general trend of the ethical teaching, the writer\'s opposition to asceticism and his esteem for the rulers and teachers of the church, all bear out the inference that he belonged to a Christian circle dominated by Pauline ideas. The author and his readers alike were not personal disciples of Jesus, but had received the gospel from those who had heard the Lord (<a onClick="return mV(\'Hbr\',2,3);">Heb 2:3</a>) and who were no longer living (<a onClick="return mV(\'Hbr\',13,7);">Heb 13:7</a>). He had lived among his readers, and had probably been their teacher and leader; he is now separated from them but he hopes soon to return to them again (<a onClick="return mV(\'Hbr\',13,18);">Heb 13:18</a>f).<P>Is it possible to give a name to this person?<P>(1) Paul not the Author<P>Although the Pauline tradition itself proves nothing, the internal evidence is conclusive against it. We know enough about Paul to be certain that he could not have written Hebrews, and that is all that can be said with confidence on the question of authorship. The style and language, the categories of thought and the method of argument, all differ widely from those of any writings ascribed to Paul. The latter quotes the Old Testament from the Hebrew and Septuagint, but he only from Septuagint. Paul\'s formula of quotation is, "It is written" or "The scripture saith"; that of Hebrews, "God," or "The Holy Spirit," or "One somewhere saith." For Paul the Old Testament is law, and stands in antithesis to the New Testament, but in Hebrews the Old Testament is covenant, and is the "shadow" of the New Covenant. Paul\'s characteristic terms, "Christ Jesus," and "Our Lord Jesus Christ," are never found in Hebrews; and "Jesus Christ" only 3 times (<a onClick="return mV(\'Hbr\',10,10);">10:10</A>; <a onClick="return mV(\'Hbr\',13,8);">13:8</a>), and "the Lord" (for Christ) only twice (<a onClick="return mV(\'Hbr\',2,3);">2:3</a>; <a onClick="return mV(\'Hbr\',7,14);">7:14</A>)—phrases used by Paul over 600 times (Zahn). Paul\'s Christology turns around the death, resurrection and living presence of Christ in the church, that of Hebrews around His high-priestly function in heaven. Their conceptions of God differ accordingly. In Hebrews it is Judaistic-Platonistic, or (in later terminology) Deistic. The revelation of the Divine Fatherhood and the consequent immanence of God in history and in the world had not possessed the author s mind as it had Paul\'s. Since the present world is conceived in Hebrews as a world of "shadows," God could only intervene in it by mediators.<P>The experience and conception of salvation are also different in these two writers. There is no evidence in Hebrews of inward conflict and conversion and of constant personal relation with Christ, which constituted the entire spiritual life of Paul. The apostle\'s central doctrine, that of justification by faith, does not appear in Hebrews. Faith is less the personal, mystical relation with Christ, that it is for Paul, than a general hope which lays hold of the future to overcome the present; and salvation is accomplished by cleansing, sanctification and perfection, not by justification. While Paul\'s mind was not uninfluenced by Hellenistic thought, as we find it in Alexandria (as, e.g. in Col and Eph), it nowhere appears in his epistles so clearly and prominently as it does in Hebrews. Moreover, the author of Hebrews was probably a member of the community to which he writes (<a onClick="return mV(\'Hbr\',13,18);">Heb 13:18</a>f), but Paul never stood in quite the relation supposed here to any church. Finally, Paul could not have written <a onClick="return mV(\'Hbr\',2,3);">Heb 2:3</a>, for he emphatically declares that he did not receive his gospel from the older disciples (<a onClick="return mV(\'Gal\',1,12);">Ga 1:12</a>; <a onClick="return mV(\'Gal\',2,6);">2:6</a>).<P>The general Christian ideas on which He was in agreement with Paul were part of the heritage which the apostle had left to all the churches. The few more particular affinities of Hebrews with certain Pauline writings (e.g. <a onClick="return mV(\'Hbr\',2,2);">Heb 2:2</a> parallel <a onClick="return mV(\'Gal\',3,19);">Ga 3:19</a>; <a onClick="return mV(\'Hbr\',12,22);">Heb 12:22</a>; <a onClick="return mV(\'Hbr\',3,14);">3:14</a> parallel <a onClick="return mV(\'Gal\',4,25);">Ga 4:25</a>; <a onClick="return mV(\'Hbr\',2,10);">Heb 2:10</a> parallel <a onClick="return mV(\'Rom\',11,36);">Ro 11:36</a>; also with Ephesians; (see yon Soden, Hand-Commentar, 3) are easily explicable either as due to the author\'s reading of Paul\'s Epistles or as reminiscences of Pauline phrases that were current in the churches. But they are too few and slender to rest upon them any presumption against the arguments which disprove the Pauline tradition.<P>(2) Other Theories<P>The passage that is most conclusive against the Pauline authorship (<a onClick="return mV(\'Hbr\',2,3);">Heb 2:3</a>) is equally conclusive against any other apostle being the author. But almost every prominent name among the Christians of the second generation has been suggested. The epistle itself excludes Timothy (<a onClick="return mV(\'Hbr\',13,23);">Heb 13:23</a>), and Titus awaits his turn. Otherwise Luke, Clement of Rome, Barnabas, Silas, Apollos, Priscilla and Aquila, Philip the Deacon, and Aristion have all had their champions.<P>(a) Luke and Clement<P>The first two, Luke and Clement, were brought in through their connection with Paul. Where it was recognized that a direct Pauline authorship could not be maintained, the Pauline tradition might still be retained, if the epistle could be assigned to one of the apostle\'s disciples. These two were fixed upon as being well-known writers. But this very fact reveals the improbability of theory. Similar arguments from language and thought to those derived from the comparison of Hebrews with the Pauline writings avail also in the comparison of Hebrews with the writings of Luke and Clement. Both these disciples of the apostle adhere much closer to his system of thought than Hebrews does, and they reveal none of the influences of Alexandrian thought, which is predominant in Hebrews.<P>(b) Barnabas; Priscilla and Aquila; Philip; Aristion; Apollos<P>Of all the other persons suggested, so little is known that it is impossible to establish, with any convincing force, an argument for or against their authorship.<P>(i) Barnabas was a Levite of Cyprus (<a onClick="return mV(\'Act\',4,36);">Ac 4:36</a>), and once a companion of Paul (<a onClick="return mV(\'Act\',13,2);">Ac 13:2</a>). Another ancient writing is called "the Epistle of Barnabas," but it has no affinity with Hebrews. The coincidence of the occurrence of the word "consolation" in Barnabas\' name (<a onClick="return mV(\'Act\',4,36);">Ac 4:36</a>) and in the writer\'s description of Hebrews (<a onClick="return mV(\'Hbr\',13,22);">13:22</a>) is quite irrelevant. Tertullian\'s tradition is the only positive argument in favor of the Barnabas theory. It has been argued against it that Barnabas, being a Levite, could not have shown the opposition to the Levitical system, and the unfamiliarity with it (<a onClick="return mV(\'Hbr\',7,27);">Heb 7:27</a>; <a onClick="return mV(\'Hbr\',9,4);">9:4</a>), which is supposed to mark our epistle. But the author\'s Levitical system was derived, not from the Hebrew Old Testament, nor from the Jerusalem temple, but from Jewish tradition; and the supposed inaccuracies as to the daily sin offering (<a onClick="return mV(\'Hbr\',7,27);">7:27</a>), and the position of the golden altar of incense (<a onClick="return mV(\'Hbr\',9,4);">9:4</a>) have been traced to Jewish tradition (see Moffatt, Introduction, 438). And the writer\'s hostility to the Levitical system is not nearly as intense as that of Paul to Pharisaism. There is nothing that renders it intrinsically impossible that Barnabas was the author, nor is anything known of him that makes it probable; and if he was, it is a mystery why the tradition was confined to Africa.<P>(ii) Harnack has argued the probability of a joint authorship by Priscilla and Aquila. The interchange of "I" and "we" he explains as due to a dual authorship by persons intimately related, but such an interchange of the personal "I" and the epistolary "we" can be paralleled in the Epistles of Paul (e.g. Romans) where no question of joint authorship arises. The probable relation of the author to a church in Rome may suit Priscilla arid Aquila (compare <a onClick="return mV(\'Rom\',16,5);">Ro 16:5</a> with <a onClick="return mV(\'Hbr\',13,\'22-24\');">Heb 13:22-24</a>), but even if this interpretation of the aforementioned passages were correct, it is possible and probable that Luke, Barnabas, Apollos, and certainly Clement, stood in a similar relation to a Roman church. Harnack, on this theory, explains the disappearance of the author\'s name as due to prejudice against women teachers. This is the only novel point in favor of this theory as compared with several others; and it does not explain why Aquila\'s name should not have been retained with the address. The evidences adduced of a feminine mind behind the epistle are highly disputable. On the other hand, a female disciple of Paul\'s circle would scarcely assume such authority in the church as the author of Hebrews does (<a onClick="return mV(\'Hbr\',13,17);">13:17</a>f; compare <a onClick="return mV(\'1Cr\',14,34);">1Co 14:34</a>f). And nothing that is known of Priscilla and Aquila would suggest the culture and the familiarity with Alexandrian thought possessed by this writer. <a onClick="return mV(\'Act\',18,26);">Ac 18:26</a> does not prove that they were expert and cultured teachers, but only that they knew and could repeat the salient points of Paul\'s early preaching. So unusual a phenomenon as this theory supposes demands more evidence to make it even probable. (But see Rendel Harris, Sidelights on New Testament Research, 148-76.)<P>(iii) Philip the Deacon and Aristion, "a disciple of the Lord" mentioned by Papias, are little more than names to us. No positive knowledge of either survives on which any theory can be built. It is probable that both were personal disciples of the Lord, and they could not therefore have written <a onClick="return mV(\'Hbr\',2,3);">Heb 2:3</a>.<P>(iv) Apollos has found favor with many scholars from Luther downward. No ancient tradition supports this theory, a fact which tells heavily against it, but not conclusively, for someone must have written the letter, and his name was actually lost to early tradition, unless it were Barnabas, and that tradition too was unknown to the vast majority of the early churches. All that is known of Apollos suits the author of Hebrews. He may have learned the gospel from "them that heard" (<a onClick="return mV(\'Hbr\',2,3);">2:3</A>); he was a Jew, "an Alexandrian by race, a learned (or eloquent) man," "mighty in the Scriptures," "he powerfully confuted the Jews" (<a onClick="return mV(\'Act\',18,24);">Ac 18:24</a>), and he belonged to the same Pauline circle as Timothy and Titus (<a onClick="return mV(\'1Cr\',16,\'10-12\');">1Co 16:10-12</a>; <a onClick="return mV(\'Tts\',3,13);">Tit 3:13</a>; compare <a onClick="return mV(\'Hbr\',13,23);">Heb 13:23</a>). The Alexandrian type of thought, the affinities with Philo, the arguments from Jewish tradition and ceremonial, the fluent style, may all have issued from "an eloquent Jew of Alexandria." But it does not follow that Apollos was the only person of this type. The author may have been a Gentile, as the purity of his Greek language and style suggests; and the combination of Greek and Hebrew thought, which the epistle reflects, and even Philo\'s terms, may have had a wide currency outside Alexandria, as for instance in the great cosmopolitan cities of Asia. All that can be said is that the author of Hebrews was someone generally like what is known of Apollos, but who he actually was, we must confess with Origen, "God alone knows."<P>IV. Destination.<P>The identity of the first readers of Hebrews is, if possible, more obscure than that of the author. It was written to Christians, and to a specific body or group of Christians (see I above).
