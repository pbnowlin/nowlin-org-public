isbe[4260]='Helon`hel\'-on (chelon, "valorous"; the Septuagint\'s Codex Vaticanus, Chailon): The father of Eliab, the prince of the tribe of Zebulun (<a onClick="return mV(\'Num\',1,9);">Nu 1:9</a>; <a onClick="return mV(\'Num\',2,7);">2:7</a>; <a onClick="return mV(\'Num\',7,24,29);">7:24, 29</a>; <a onClick="return mV(\'Num\',10,16);">10:16</a>).``1';
isbe[4261]='Help`With the sense of that which brings aid, support, or deliverance, "help" (noun and vb.) represents a large variety of words in Hebrew and Greek (noun 7, verb 16). A principal Hebrew word is \'azar, "to help," with the corresponding nouns \'ezer, \'ezrah; a chief Greek word is boetheo (<a onClick="return mV(\'Mat\',15,25);">Mt 15:25</a>; <a onClick="return mV(\'Mar\',9,22,24);">Mr 9:22, 24</a>, etc.). True help is to be sought for in Yahweh, in whom, in the Old Testament, the believer is constantly exhorted to trust, with the renouncing of all other confidences (<a onClick="return mV(\'Psa\',20,2);">Ps 20:2</a>; <a onClick="return mV(\'Psa\',33,20);">33:20</a>; <a onClick="return mV(\'Psa\',42,5);">42:5</a>; <a onClick="return mV(\'Psa\',46,1);">46:1</a>; <a onClick="return mV(\'Psa\',115,9,10,11);">115:9-11</a>; <a onClick="return mV(\'Psa\',121,2);">121:2</a>; <a onClick="return mV(\'Isa\',41,10,13,14);">Isa 41:10, 13-14</a>, etc.). In <a onClick="return mV(\'Rom\',8,26);">Ro 8:26</a> it is said, "the Spirit also helpeth our infirmity," the verb here (sunantilambanetai) having the striking meaning of to "take hold along with one." In the story of Eden, Eve is spoken of as "a help meet" for Adam (<a onClick="return mV(\'Gen\',2,18,20);">Ge 2:18, 20</a>). The idea in "meet" is not so much "suitability," though that is implied, as likeness, correspondence in nature (Vulgate, similem sibi). One like himself, as taken from him, the woman would be an aid and companion to the man in his tasks.``132';
isbe[4262]='Helpmeet`help\'-met.`<a href="./study/isbe/search.html?string=HELP">HELP</a>`1';
isbe[4263]='Helps (1)`(antilempseis, <a onClick="return mV(\'1Cr\',12,28);">1Co 12:28</a>): In classical Greek the word antilempsis means "remuneration," the hold one has on something, then perception, apprehension. But in Biblical Greek it has an altruistic meaning. Thus, it is used in the Septuagint, both in the Old Testament Scriptures and in the Apocrypha (<a onClick="return mV(\'Psa\',22,19);">Ps 22:19</a>; <a onClick="return mV(\'Psa\',89,19);">89:19</a>, 1Esdras 8:27; 2Macc 15:7). Thus, we obtain a clue to its meaning in our text, where it has been usually understood as referring to the deacons, the following word kuberneseis, translated "governments," being explained as referring to the presbyters.``42';
isbe[4264]='Helps (2)`(boetheiai, <a onClick="return mV(\'Act\',27,17);">Ac 27:17</a>).`<a href="./study/isbe/search.html?string=SHIPS+AND+BOATS">SHIPS AND BOATS</a>`1';
isbe[4265]='Helve`helv (\'ets "wood," "tree"): The handle or wooden part of an ax. "The head (margin "iron") slippeth from the helve" (margin "tree," <a onClick="return mV(\'Deu\',19,5);">De 19:5</a>). The marginal reading suggests that "the ax is supposed to glance off the tree it is working on."``1';
isbe[4266]='Hem`(kraspedon): The classic instance of the use of "hem" in the New Testament is <a onClick="return mV(\'Mat\',9,20);">Mt 9:20</a> the King James Version (compare <a onClick="return mV(\'Mat\',14,36);">Mt 14:36</a>), where the woman "touched the hem of his (Christ\'s) garment." The reference is to the fringe or tassel with its traditional blue thread which the faithful Israelite was directed to wear on the corners of the outer garment (<a onClick="return mV(\'Num\',15,37);">Nu 15:37</a>ff; <a onClick="return mV(\'Deu\',22,12);">De 22:12</a>). Great importance came to be attached to it, the ostentatious Pharisees making it very broad or large (<a onClick="return mV(\'Mat\',23,5);">Mt 23:5</a>). Here the woman clearly thought there might be peculiar virtue in touching the tassel or fringe of Jesus\' garment. Elsewhere the word is rendered <a href="study/isbe/search.html?string=BORDER;+BORDERS">BORDER</a> (which see).`<a href="./study/isbe/search.html?string=DRESS">DRESS</a>; <a href="./study/isbe/search.html?string=FRINGES">FRINGES</a>`47';
isbe[4267]='Hemam`he\'-mam (<a onClick="return mV(\'Gen\',36,22);">Ge 36:22</a> the King James Version and the English Revised Version).`<a href="./study/isbe/search.html?string=HEMAN">HEMAN</a>; <a href="./study/isbe/search.html?string=HOMAM">HOMAM</a>`1';
isbe[4268]='Heman`he\'-man (heman, "faithful"): The name of two men in the Old Testament.<P>(1) A musician and seer, a Levite, son of Joel and grandson of the prophet Samuel; of the family of the Kohathites (<a onClick="return mV(\'1Ch\',6,33);">1Ch 6:33</a>), appointed by David as one of the leaders of the temple-singing (<a onClick="return mV(\'1Ch\',15,17);">1Ch 15:17</a>; <a onClick="return mV(\'2Ch\',5,12);">2Ch 5:12</a>). He had 14 sons (and 3 daughters) who assisted their father in the chorus. Heman seems also to have been a man of spiritual power; is called "the king\'s seer in matters of God" (<a onClick="return mV(\'1Ch\',25,5);">1Ch 25:5</a>; <a onClick="return mV(\'2Ch\',35,15);">2Ch 35:15</a>).<P>(2) One of the noted wise men prior to, or about, the time of Solomon. He was one of the three sons of Mahol (<a onClick="return mV(\'1Ki\',4,31);">1Ki 4:31 (Hebrew 5:11)</a>); also called a son of Zerah (<a onClick="return mV(\'1Ch\',2,6);">1Ch 2:6</a>).<P><a onClick="return mV(\'Psa\',88,\'1-\');">Ps 88</a> is inscribed to Heman the Ezrahite, who is probably to be identified with the second son of Zerah.``137';
isbe[4269]='Hemath`he\'-math.`<a href="./study/isbe/search.html?string=HAMMATH">HAMMATH</a>`1';
isbe[4270]='Hemdan`hem\'-dan (chemdan, "pleasant"): A descendant of Seir, the Horite (<a onClick="return mV(\'Gen\',36,26);">Ge 36:26</a>). Wrongly translated "Amram" by the King James Version in <a onClick="return mV(\'1Ch\',1,41);">1Ch 1:41</a> (the Revised Version (British and American) "Hamran"), where the transcribers made an error in one vowel and one consonant, writing (chamran), instead of (chemdan).``1';
isbe[4271]='Hemlock`hem\'-lock.`<a href="./study/isbe/search.html?string=GALL">GALL</a>`1';
isbe[4272]='Hen (1)`hen (chen, "favor"). In <a onClick="return mV(\'Zec\',6,14);">Zec 6:14</a>, English Versions of the Bible reads, "And the crowns shall be to Helem...and to Hen the son of Zephaniah." But as this person is called Josiah in <a onClick="return mV(\'Zec\',6,10);">Zec 6:10</a>, the Revised Version, margin "and for the kindness of the son of Zephaniah" is probably right, but the text is uncertain.`<a href="./study/isbe/search.html?string=JOSIAH">JOSIAH</a>`1';
isbe[4273]='Hen (2)`(ornis): Mentioned in the accounts of the different disciples in describing the work of Jesus (<a onClick="return mV(\'Mat\',23,37);">Mt 23:37</a>; <a onClick="return mV(\'Luk\',13,34);">Lu 13:34</a>).``1';
isbe[4274]='Hena`he\'-na (hena\'; Ana): Named in <a onClick="return mV(\'2Ki\',19,13);">2Ki 19:13</a>, as one of the cities destroyed by Sennacherib along with Sepharvaim. It does not appear in a similar connection in <a onClick="return mV(\'2Ki\',17,24);">17:24</a>. The text is probably corrupt. No reasonable identification has been proposed. Cheyne (Encyclopaedia Biblica, under the word) says of the phrase "Hena and Ivah" that "underlying this is a witty editorial suggestion that the existence of cities called h-n-\' and \'-w-h respectively has passed out of mind (compare <a onClick="return mV(\'Psa\',9,6);">Ps 9:6 (Hebrew 7)</a>), for hena\' we\'iwwah, clearly means \'he has driven away and overturned\' (so Targum, Symmachus)." He would drop out h-n-\'. Hommel (Expositors Times, IX, 330) thinks that here we have divine names; Hena standing for the Arabic star-name al-han\'a, and Ivvah for al-\'awwa\'u.`<a href="./study/isbe/search.html?string=IVAH">IVAH</a>`54';
isbe[4275]='Henadad`hen\'-a-dad (chenadhadh, "favor of Hadad"; Septuagint Henaad; Henadad; Henadab; Henalab (<a onClick="return mV(\'Ezr\',3,9);">Ezr 3:9</a>; <a onClick="return mV(\'Neh\',3,18,24);">Ne 3:18, 24</a>; <a onClick="return mV(\'Neh\',10,9);">10:9</a>)): One of the heads of the Levites in the post-exilic community.``1';
isbe[4276]='Henna`hen\'-a (<a onClick="return mV(\'Sgs\',1,14);">So 1:14</a>; <a onClick="return mV(\'Sgs\',4,13);">4:13</a>): An aromatic plant.``1';
isbe[4277]='Henoch`he\'-nok (chanokh; Henoch; in <a onClick="return mV(\'1Ch\',1,3);">1Ch 1:3</a> the King James Version the Revised Version (British and American), "Enoch"; in <a onClick="return mV(\'Gen\',25,4);">Ge 25:4</a>, the King James Version and the Revised Version (British and American) "Hanoch"; <a onClick="return mV(\'1Ch\',1,33);">1Ch 1:33</a>, the King James Version "Henoch," the Revised Version (British and American) "Hanoch"): The name of a Midianite, a descendant of Abram.``1';
isbe[4278]='Hepher`(chepher):<P>(1) Septuagint Hopher (<a onClick="return mV(\'Jos\',12,17);">Jos 12:17</a>), a Canaanitish town mentioned between Tappuah and Aphek, unidentified.<P>(2) In <a onClick="return mV(\'1Ki\',4,10);">1Ki 4:10</a> a district connected with Socoh, and placed by Solomon under the direction of Benhesed of Arubboth, unidentified.``1';
isbe[4279]='Hepher; Hepherites`he\'-fer, he\'-fer-its (chepher, chephri):<P>(1) Septuagint Hopher (<a onClick="return mV(\'Num\',26,32);">Nu 26:32</a>f; <a onClick="return mV(\'Num\',27,1);">27:1</a>; <a onClick="return mV(\'Jos\',17,2);">Jos 17:2</a>f), the head of a family or clan of the tribe of Manasseh. The clan is called the Hepherites in <a onClick="return mV(\'Num\',26,32);">Nu 26:32</a>.<P>(2) Septuagint Hephal (<a onClick="return mV(\'1Ch\',4,6);">1Ch 4:6</a>), a man of Judah.<P>(3) Septuagint Hopher (<a onClick="return mV(\'1Ch\',11,36);">1Ch 11:36</a>), one of David\'s heroes.``1';
isbe[4280]='Hephzibah`hef\'-zi-ba (chephtsi-bhah, "my delight is in her"):<P>(1) Septuagint Hopseiba, Hapseiba, Hophsiba, the mother of Manasseh (<a onClick="return mV(\'2Ki\',21,1);">2Ki 21:1</a>).<P>(2) The new name of Zion (<a onClick="return mV(\'Isa\',62,4);">Isa 62:4</a>); Septuagint translates Thelema emon, "my delight."``1';
isbe[4281]='Herakles`her\'-a-klez (Herakles).`<a href="./study/isbe/search.html?string=HERCULES">HERCULES</a>`1';
isbe[4282]='Herald`her\'-ald: The word occurs once (<a onClick="return mV(\'Dan\',3,4);">Da 3:4</a>) as the translation of the Aramaic word karoz (compare kerux): "Then the herald cried aloud."`<a href="./study/isbe/search.html?string=GAMES">GAMES</a>`1';
isbe[4283]='Herb`hurb, urb:<P>(1) yaraq, "green thing" (<a onClick="return mV(\'Exd\',10,15);">Ex 10:15</a>; <a onClick="return mV(\'Isa\',15,6);">Isa 15:6</a>); a garden of herbs" (<a onClick="return mV(\'Deu\',11,10);">De 11:10</a>; <a onClick="return mV(\'1Ki\',21,2);">1Ki 21:2</a>); "(a dinner, the margin portion of) herbs" (<a onClick="return mV(\'Pro\',15,17);">Pr 15:17</a>).<P>(2) \'esebh; compare Arabic \'ushb, "herbage," "grass," etc.; "herbs yielding seed" (<a onClick="return mV(\'Gen\',1,11);">Ge 1:11</a>); "herbage" for food (<a onClick="return mV(\'Gen\',1,30);">Ge 1:30</a>; <a onClick="return mV(\'Jer\',14,6);">Jer 14:6</a>); translated "grass" (<a onClick="return mV(\'Deu\',11,15);">De 11:15</a>; <a onClick="return mV(\'Amo\',7,2);">Am 7:2</a>); "herbs" (<a onClick="return mV(\'Pro\',27,25);">Pr 27:25</a>, etc.).<P>(3) deshe\', translated "herb" (<a onClick="return mV(\'2Ki\',19,26);">2Ki 19:26</a>; <a onClick="return mV(\'Pro\',27,25);">Pr 27:25</a>; <a onClick="return mV(\'Isa\',37,27);">Isa 37:27</a>; <a onClick="return mV(\'Isa\',66,14);">66:14</a> the King James Version), but generally <a href="study/isbe/search.html?string=GRASS">GRASS</a> (which see).<P>(4) chatsir, vegetation generally, but translated <a href="study/isbe/search.html?string=GRASS">GRASS</A> (which see).<P>(5) \'oroth, \'owroth (plural only), "green plants" or "herbs." In <a onClick="return mV(\'2Ki\',4,39);">2Ki 4:39</a> the Talmud interprets it to mean "colewort," but it may mean any edible herbs which had survived the drought. In <a onClick="return mV(\'Isa\',26,19);">Isa 26:19</a> the expression "dew of herbs" is in the margin translated "dew of light" which is more probable (see <a href="study/isbe/search.html?string=DEW">DEW</A>), and the translation "heat upon herbs" (<a onClick="return mV(\'Isa\',18,4);">Isa 18:4</a> the King James Version) is in the Revised Version (British and American) translated "clear heat in sunshine."<P>(6) botane (<a onClick="return mV(\'Hbr\',6,7);">Heb 6:7</a>).<P>(7) lachana = yaraq (<a onClick="return mV(\'Mat\',13,32);">Mt 13:32</a>).`<a href="./study/isbe/search.html?string=BITTER+HERBS">BITTER HERBS</a>`117';
isbe[4284]='Hercules`hur\'-ku-lez (Herakles): The process of Hellenizing the Jews which began at an earlier date was greatly promoted under Antiochus Epiphanes (175-164 BC). Jason, who supplanted his brother Onias in the office of high priest by promising Antiochus an increase of tribute, aided the movement by setting up under the king\'s authority a Greek palaestra for the training of youth in Greek exercises, and by registering the inhabitants of Jerusalem as citizens of Antioch (2Macc 4:8f). Certain of these Antiochians of Jerusalem Jason sent to Tyre, where games were held every five years in honor of Hercules, that is, the national Tyrian deity Melcart, identified with Baal of Old Testament history. According to Josephus (Ant., VII, v, 3) Hiram, king of Tyre in the days of Solomon, built the temple of Hercules and also of Astarte. Jason s deputies carried 300 drachmas of silver for the sacrifice of Hercules, but they were so ashamed of their commission that they "thought it not right to use the money for any sacrifice" and "on account of present circumstances it went to the equipment of the galleys" (2Macc 4:18-20).``79';
isbe[4285]='Herd`hurd.`<a href="./study/isbe/search.html?string=CATTLE">CATTLE</a>`1';
isbe[4286]='Herdsman`hurdz\'-man (boqer; the King James Version, the English Revised Version "herdman"): A cowherd (<a onClick="return mV(\'Amo\',7,14);">Am 7:14</a>). The same word is used in Syria today. ro\'eh, has its equivalent in the language of Syria and Palestine (Arabic ra\'i), and is a general term for any kind of a herdsman (<a onClick="return mV(\'Gen\',13,7,8);">Ge 13:7-8</a>; <a onClick="return mV(\'Gen\',26,20);">26:20</a>; <a onClick="return mV(\'1Sa\',21,7);">1Sa 21:7</a>). noqedh, occurs in one passage (<a onClick="return mV(\'Amo\',1,1);">Am 1:1</a>); literally it means one who spots or marks the sheep, hence, a herdsman. Spotting the wool with different dyes is still the method of distinguishing between the sheep of different flocks. The herdsman is seldom the owner of the sheep, but a hireling.`<a href="./study/isbe/search.html?string=SHEEP">SHEEP</a>; <a href="./study/isbe/search.html?string=SHEEP+TENDING">SHEEP TENDING</a>`133';
isbe[4287]='Here`her, in composition:`<a href="./study/isbe/search.html?string=HEREAFTER">Hereafter</A>; <a href="./study/isbe/search.html?string=HEREBY">Hereby</A>; <a href="./study/isbe/search.html?string=HEREOF">Hereof</A>; <a href="./study/isbe/search.html?string=HERETOFORE">Heretofore</A>; <a href="./study/isbe/search.html?string=HEREWITH">Herewith</A>;`1';
isbe[4288]='Hereafter`her-aft\'-er (here (this present) and after) represents Hebrew \'achar, "hinder part," "end" (<a onClick="return mV(\'Isa\',41,23);">Isa 41:23</a>), "the things that are to come hereafter" (\'achor after, behind the present), with den, "this," \'achare dhen, Aramaic (<a onClick="return mV(\'Dan\',2,29,45);">Da 2:29, 45</a>), \'achar, "after," "behind," "last" (<a onClick="return mV(\'Eze\',20,39);">Eze 20:39</a>), Greek ap\' arti, "from now" (<a onClick="return mV(\'Mat\',26,64);">Mt 26:64</a>), "Hereafter ye shall see the Son of man sitting on the right hand of power, and coming in the clouds of heaven," which does not mean "at a future time" according to the more modern usage of "hereafter," but (as the Greek) "from now," the Revised Version (British and American) "henceforth"; Tyndale and the chief versions after him have "hereafter," but Wycliff has "fro hennes forth." <a onClick="return mV(\'Jhn\',1,51);">Joh 1:51</a>, "Hereafter ye shall see the heaven opened," etc., where "hereafter" has the same meaning; it is omitted by the Revised Version (British and American) after a corrected text (Wycliff also omits); eti, "yet," "still," "any more" "any longer" (<a onClick="return mV(\'Jhn\',14,30);">Joh 14:30</a>, the Revised Version (British and American) "I will no more speak much with you," Wycliff, "now I schal not"); meketi, "no more," "no longer" (<a onClick="return mV(\'Mar\',11,14);">Mr 11:14</a>, "no man eat fruit of thee hereafter," the Revised Version (British and American) "henceforward"); apo tou nun, "from now" (<a onClick="return mV(\'Luk\',22,69);">Lu 22:69</a>, the Revised Version (British and American) "From henceforth shall the Son of man be seated at the right hand of the power of God," Wycliff "aftir this tyme"); meta tauta (<a onClick="return mV(\'Jhn\',13,7);">Joh 13:7</a>, "Thou shalt know (the Revised Version (British and American) "understand") hereafter," Wycliff "aftirward").``1';
isbe[4289]='Hereby`her-bi\', represents bezo\'th, "in or by this" (<a onClick="return mV(\'Gen\',42,15);">Ge 42:15</a> "Hereby ye shall be proved"); ek toutou, "out of this" (<a onClick="return mV(\'1Jo\',4,6);">1Joh 4:6</a>, the Revised Version (British and American) "by this"); en touto, "in this," "by this means" (<a onClick="return mV(\'1Cr\',4,4);">1Co 4:4</a>; <a onClick="return mV(\'1Jo\',2,3,5);">1Joh 2:3, 5</a>; <a onClick="return mV(\'1Jo\',3,16,19,24);">3:16, 19, 24</a>; <a onClick="return mV(\'1Jo\',4,2,13);">4:2, 13</a>).``1';
isbe[4290]='Heredity`he-red\'-i-ti:<P>1. Physiological Heredity:<P>Heredity, in modern language, is the law by which living beings tend to repeat their characteristics, physiological and psychical, in their offspring, a law familiar in some form to even the most uncultured peoples. The references to it in the Bible are of various kinds.<P>Curiously enough, little mention is made of physiological heredity, even in so simple a form as the resemblance of a son to his father, but there are a few references, such as, e.g., those to giants with giants for sons (<a onClick="return mV(\'2Sa\',21,\'18-22\');">2Sa 21:18-22</a>; <a onClick="return mV(\'1Ch\',20,\'4-8\');">1Ch 20:4-8</a>; compare <a onClick="return mV(\'Gen\',6,4);">Ge 6:4</a>; <a onClick="return mV(\'Num\',13,33);">Nu 13:33</a>; <a onClick="return mV(\'Deu\',1,28);">De 1:28</a>, etc.). Moreover <a onClick="return mV(\'Deu\',28,\'59-61\');">De 28:59-61</a> may contain a thought of hereditary diseases (compare <a onClick="return mV(\'2Ki\',5,27);">2Ki 5:27</a>). On the psychical side the data are almost equally scanty. That a son and his father may differ entirely is taken for granted and mentioned repeatedly (especially in <a onClick="return mV(\'Eze\',18,\'5-20\');">Eze 18:5-20</a>). Even in the case of the king, the frequent changes of dynasty prevented such a phrase as "the seed royal" (<a onClick="return mV(\'2Ki\',11,1);">2Ki 11:1</a>; <a onClick="return mV(\'Jer\',41,1);">Jer 41:1</a>) from being taken very seriously. Yet, perhaps, the inheritance of mechanical dexterity is hinted at in <a onClick="return mV(\'Gen\',4,\'20-22\');">Ge 4:20-22</a>, if "father" means anything more than "teacher." But, in any case, the fact that "father" could have this metaphorical sense, together with the corresponding use of "son" in such phrases as "son of Belial" (<a onClick="return mV(\'Jdg\',19,22);">Jud 19:22</a> the King James Version), "son of wickedness" (<a onClick="return mV(\'Psa\',89,22);">Ps 89:22</a>), "sons of the prophets" (<a onClick="return mV(\'Amo\',7,14);">Am 7:14</a> margin, etc.), "son of the wise,...of ancient kings" (<a onClick="return mV(\'Isa\',19,11);">Isa 19:11</a>; this last phrase may be meant literally), shows that the inheritance of characteristics was a very familiar fact.<P>2. Hebrew Conception of Heredity:<P>The question, however, is considerably complicated by the intense solidarity that the Hebrews ascribed to the family. The individual was felt to be only a link in the chain, his "personality" (very vaguely conceived) somehow continuing that of his ancestors and being continued in that of his descendants. After death the happiness (or even existence; see <a href="study/isbe/search.html?string=DEATH">DEATH</A>) of this shade in the other world depended on the preservation of a posterity in this. Hence, slaying the sons of a dead man was thought to affect him directly, and it would be a great mistake to suppose that an act such as that of <a onClick="return mV(\'2Sa\',21,\'1-9\');">2Sa 21:1-9</a>, etc., was simply to prevent a blood-feud. Nor was it at all in point that the children might repeat the qualities of the father, however much this may have been realized in other connections. Consequently, it is impossible to tell in many cases just how much of a modern heredity idea is present.<P>The most important example is the conception of the position of the nations. These are traced back to single ancestors, and in various cases the qualities of the nation are explained by those of the ancestor (<a onClick="return mV(\'Gen\',9,\'22-27\');">Ge 9:22-27</a>; <a onClick="return mV(\'Gen\',21,20,21);">21:20-21</a>; <a onClick="return mV(\'Gen\',49,\'1-\');">49</a>, etc.). The influences that determine national characteristics are evidently thought to be hereditary, and yet not all of them are hereditary in our sense; e.g. in <a onClick="return mV(\'Gen\',27,\'1-\');">Ge 27</a>, the condition of the descendants of Jacob and Esau is conceived to have been fixed by the nature of the blessings (mistakenly) pronounced by Isaac. On the other hand, Ezra (<a onClick="return mV(\'Ezr\',9,11,12);">9:11,12</a>) thinks of the danger of intermarrying with the children of a degenerate people in an entirely modern style, but in <a onClick="return mV(\'Deu\',23,\'3-6\');">De 23:3-6</a> the case is not so clear. There a curse pronounced on the nations for their active hostility is more in point than moral degeneracy (however much this may be spoken of elsewhere, <a onClick="return mV(\'Num\',25,\'1-3\');">Nu 25:1-3</a>, etc.), and it is on account of the curse that the taint takes ten generations to work itself out, while, in the case of Edomite or Egyptian blood, purity was attained in three. Hence, it is hard to tell just how <a onClick="return mV(\'Exd\',20,5,6);">Ex 20:5-6</a> was interpreted. The modern conception of the effect of heredity was surely present in part, but there must have been also ideas of the extension of the curse-bearing individuality that we should find hard to understand.<P>3. Abraham\'s Children:<P>The chiefest question is that of the Israelites. Primarily they are viewed as the descendants of Abraham, blessed because he was blessed (<a onClick="return mV(\'Gen\',22,\'15-18\');">Ge 22:15-18</a>, etc.). This was taken by many with the utmost literalness, and physical descent from Abraham was thought to be sufficient (especially <a onClick="return mV(\'Mat\',3,9);">Mt 3:9</a>; <a onClick="return mV(\'Jhn\',8,\'31-44\');">Joh 8:31-44</a>; <a onClick="return mV(\'Rom\',9,\'6-13\');">Ro 9:6-13</a>), or at least necessary (especially <a onClick="return mV(\'Ezr\',2,59);">Ezr 2:59</a>; <a onClick="return mV(\'Ezr\',9,2);">9:2</a>; <a onClick="return mV(\'Neh\',7,61);">Ne 7:61</a>), for salvation. Occasionally this descent is stated to give superior qualities in other regards (<a onClick="return mV(\'Est\',6,13);">Es 6:13</a>). But a distinction between natural inheritance of Abraham\'s qualities and the blessing bestowed by God\'s unbounded favor and decree on his descendants must have been thoroughly recognized, otherwise the practice of proselytizing would have been impossible.<P>4. Heredity and the New Testament:<P>In the New Testament the doctrine of original sin, held already by a certain school among the Jews (2Esdras 7:48), alone raises much question regarding heredity (compare <a onClick="return mV(\'1Cr\',7,14);">1Co 7:14</a>). Otherwise the Old Testament concepts are simply reversed: where likeness of nature appears, there is (spiritual) descent (<a onClick="return mV(\'Rom\',4,12);">Ro 4:12</a>; <a onClick="return mV(\'Gal\',3,7);">Ga 3:7</a>, etc.). None the less, that the Israel "after the flesh" has a real spiritual privilege is stated explicitly (<a onClick="return mV(\'Rom\',3,1,2);">Ro 3:1-2</a>; <a onClick="return mV(\'Rom\',11,26);">11:26</a>; <a onClick="return mV(\'Rev\',11,13);">Re 11:13</a>).`<a href="./study/isbe/search.html?string=SON;+SONS">SON</a>; <a href="./study/isbe/search.html?string=BLESSING">BLESSING</a>; <a href="./study/isbe/search.html?string=CURSE">CURSE</a>; <a href="./study/isbe/search.html?string=FAMILY">FAMILY</a>; <a href="./study/isbe/search.html?string=SALVATION">SALVATION</a>; <a href="./study/isbe/search.html?string=SIN+(1)">SIN</a>; <a href="./study/isbe/search.html?string=TRADITION">TRADITION</a>`48';
isbe[4291]='Herein`her-in\', Hebrew bezo\'th, "in" or "by this" (<a onClick="return mV(\'Gen\',34,22);">Ge 34:22</a>, the Revised Version (British and American) "on this condition"); en touta (<a onClick="return mV(\'Jhn\',4,37);">Joh 4:37</a>; <a onClick="return mV(\'Jhn\',9,30);">9:30</a>; <a onClick="return mV(\'Jhn\',15,8);">15:8</a>; <a onClick="return mV(\'Act\',24,16);">Ac 24:16</a>; <a onClick="return mV(\'2Cr\',8,10);">2Co 8:10</a>; <a onClick="return mV(\'1Jo\',4,10,17);">1Joh 4:10, 17</a>).``1';
isbe[4292]='Hereof`her-ov\', Greek haute, "this" (<a onClick="return mV(\'Mat\',9,26);">Mt 9:26</a>); houtos, "this" (<a onClick="return mV(\'Hbr\',5,3);">Heb 5:3</a>, the Revised Version (British and American) "thereof").``1';
isbe[4293]='Heres`he\'-rez, he\'-res:<P>(1) har-cherec, "Mount Heres" (<a onClick="return mV(\'Jdg\',1,34);">Jud 1:34</A>f), a district from which the Amorites were not expelled; it is mentioned along with Aijalon and Shallbim. In <a onClick="return mV(\'Jos\',19,41);">Jos 19:41</a>f we have then two towns in association with Ir-shemesh and many authorities consider that as cherec = shemesh, i.e. the sun, and har, being perhaps a copyist\'s error for \'ir, "city," we have in <a onClick="return mV(\'Jdg\',1,34);">Jud 1:34</a> a reference to Beth-shemesh, the modern \'Ain Shems. Conder thinks that Batn Harasheh, northeast of Aijalon, a prominent hill, may be the place referred to. Budde thinks Har-heres may be identified with the Bit-Ninib (Ninib being the fierce morning sun) of the Tell el-Amarna Letters; this place was in the district of Jerusalem.<P>(2) ma\'aleh he-charec, "the ascent of Heres" (<a onClick="return mV(\'Jdg\',8,13);">Jud 8:13</a>, the King James Version "before the sun was up"), the place from which Gideon returned to Succoth after his defeat of Zebah and Zalmunna. the Revised Version (British and American) is probably a great improvement on the King James Version, but both the text and the topography are uncertain.<P>(3) \'ir ha-cherec, "City of Heres" EVm, "City of Destruction" (cherem) English Versions of the Bible, or "City of the sun" cherec) English Versions, margin. This is the name of one of the "five cities in the land of Egypt that speak the language of Canaan, and swear to Yahweh of hosts" (<a onClick="return mV(\'Isa\',19,18);">Isa 19:18</a>).`<a href="./study/isbe/search.html?string=IR-HA-HERES">IR-HA-HERES</a>`117';
isbe[4294]='Heresh`he\'-resh (cheresh; the Septuagint\'s Codex Vaticanus, Rharaiel; Codex Alexandrinus, Hares): A Levite (<a onClick="return mV(\'1Ch\',9,15);">1Ch 9:15</a>)``1';
isbe[4295]='Heresy`her\'-e-si, her\'-e-si (hairesis, from verb haireo, "to choose"): The word has acquired an ecclesiastical meaning that has passed into common usage, containing elements not found in the term in the New Testament, except as implied in one passage. In classical Greek, it may be used either in a good or a bad sense, first, simply for "choice," then, "a chosen course of procedure," and afterward of various schools and tendencies. Polybius refers to those devoting themselves to the study of Greek literature as given to the Hellenike hairesis. It was used not simply for a teaching or a course followed, but also for those devoting themselves to such pursuit, namely, a sect, or assembly of those advocating a particular doctrine or mode of life. Thus, in Acts, the word is used in the Greek, where the King James Version and the Revised Version (British and American) have "sect," "sect of the Sadducees" (<a onClick="return mV(\'Act\',5,17);">Ac 5:17</a>), "sect of the Nazarenes" (<a onClick="return mV(\'Act\',24,5);">Ac 24:5</a>). In <a onClick="return mV(\'Act\',26,5);">Ac 26:5</a> the Pharisees are called "the straitest hairesis (sect)." The name was applied contemptuously to Christianity (<a onClick="return mV(\'Act\',24,14);">Ac 24:14</a>; <a onClick="return mV(\'Act\',28,22);">28:22</a>). Its application, with censure, is found in <a onClick="return mV(\'1Cr\',11,19);">1Co 11:19</a> m; <a onClick="return mV(\'Gal\',5,20);">Ga 5:20</a> margin, where it is shown to interfere with that unity of faith and community of interests that belong to Christians. There being but one standard of truth, and one goal for all Christian life, any arbitrary choice varying from what was common to all believers, becomes an inconsistency and a sin to be warned against. Ellicott, on <a onClick="return mV(\'Gal\',5,20);">Ga 5:20</a>, correctly defines "heresies" (King James Version, the English Revised Version) as "a more aggravated form of dichostasia" (the American Standard Revised Version "parties") "when the divisions have developed into distinct and organized parties"; so also <a onClick="return mV(\'1Cr\',11,19);">1Co 11:19</a>, translated by the Revised Version (British and American) "factions." In <a onClick="return mV(\'2Pe\',2,1);">2Pe 2:1</a>, the transition toward the subsequent ecclesiastical sense can be traced. The "destructive heresies" (Revised Version margin, the English Revised Version margin "sects of perdition") are those guilty of errors both of doctrine and of life very fully described throughout the entire chapter, and who, in such course, separated themselves from the fellowship of the church.<P>In the fixed ecclesiastical sense that it ultimately attained, it indicated not merely any doctrinal error, but "the open espousal of fundamental error" (Ellicott on <a onClick="return mV(\'Tts\',3,10);">Tit 3:10</a>), or, more fully, the persistent, obstinate maintenance of an error with respect to the central doctrines of Christianity in the face of all better instruction, combined with aggressive attack upon the common faith of the church, and its defenders. Roman Catholics, regarding all professed Christians who are not in their communion as heretics, modify their doctrine on this point by distinguishing between Formal and terial Heresy, the former being unconscious and unintentional, and between different degrees of each of these classes (Cath. Encyclopedia, VII, 256ff). For the development of the ecclesiastical meaning, see Suicer\'s Thesaurus Ecclesiasticus, I, 119-23.``84';
isbe[4296]='Hereth, the Forest of`he\'-reth (ya\'-ar chareth; Septuagint polis Sareik; the King James Version Hareth): David (<a onClick="return mV(\'1Sa\',22,5);">1Sa 22:5</a>) was told by the prophet Gad to depart from Mizpah of Moab and go to the land of Judah, and he "came into the forest of Hereth." The Septuagint has "city" instead of forest; see also Josephus, Ant, VI, xii, 4. The village Kharas, on an ancient high road, 3 miles southeast of Aid el ma, probably David\'s stronghold <a href="study/isbe/search.html?string=ADULLAM">ADULLAM</a> (which see), may possibly answer to the place (PEF, III, 305, Sh XXI). "Horesh" has been suggested as an alternative reading.``117';
isbe[4297]='Heretic; Heretical`her\'-e-tik, her\'-e-tik, he-ret\'-i-kal (hairetikos): Used in <a onClick="return mV(\'Tts\',3,10);">Tit 3:10</a>, must be interpreted according to the sense in which Paul employs the word "heresy" (<a onClick="return mV(\'1Cr\',11,19);">1Co 11:19</a>; <a onClick="return mV(\'Gal\',5,20);">Ga 5:20</a>) for "parties" or "factions." According to this, the Scriptural meaning of the word is no more than "a factious man" (American Standard Revised Version), an agitator who creates divisions and makes parties. Weizsacker translates it into German ein Sektierer, "a sectarist." The nature of the offense is described in other words in <a onClick="return mV(\'2Th\',2,6,11);">2Th 2:6, 11</a>.``1';
isbe[4298]='Heretofore`her-too-for\', Hebrew temol, "yesterday," "neither heretofore, nor since" (<a onClick="return mV(\'Exd\',4,10);">Ex 4:10</a>; compare <a onClick="return mV(\'Exd\',5,7,8,14);">Ex 5:7-8, 14</a>; <a onClick="return mV(\'Jos\',3,4);">Jos 3:4</a>; <a onClick="return mV(\'Rth\',2,11);">Ru 2:11</a>); \'ethmol shilshom, "yesterday," "third day" (<a onClick="return mV(\'1Sa\',4,7);">1Sa 4:7</a>, "There hath not been such a thing heretofore.")``1';
isbe[4299]='Hereunto`her-un-too\', Greek eis touto, "unto," "with a view to this" (<a onClick="return mV(\'1Pe\',2,21);">1Pe 2:21</a>, "For hereunto were ye called"): "hereunto" is supplied (<a onClick="return mV(\'Ecc\',2,25);">Ec 2:25</a>, "Who else can hasten hereunto more than I" the Revised Version (British and American) "who can have enjoyment," margin "hasten thereto").``1';
isbe[4300]='Herewith`her-with\', Hebrew ba-zo\'th, bezo\'th, "in," "by," or "with this" (<a onClick="return mV(\'Eze\',16,29);">Eze 16:29</a>; <a onClick="return mV(\'Mal\',3,10);">Mal 3:10</a>, "Prove me now herewith, saith Yahweh").<P>The Revised Version (British and American) has "herein" for "to do this" (<a onClick="return mV(\'Ezr\',4,22);">Ezr 4:22</a>); for "in these things" (<a onClick="return mV(\'Rom\',14,18);">Ro 14:18</a>); "of them that have sinned heretofore" for "which have sinned already" (<a onClick="return mV(\'2Cr\',12,21);">2Co 12:21</a>); "hereunto" for "thereunto" (<a onClick="return mV(\'1Pe\',3,9);">1Pe 3:9</a>); "herewith" for "thus" (<a onClick="return mV(\'Lev\',16,3);">Le 16:3</a>).``185';
