The title "to Hebrews" might mean properly Palestinian Jews who spoke the Hebrew language, but the fact that the epistle was written in Greek excludes that supposition. It therefore meant Christians of Jewish origin, and gives no indication of their place of residence. The title represents an early inference drawn from the contents of the document, and the tradition it embodies was unanimously accepted from the 2nd century down to the early part of the last century. Now, however, a considerable body of critics hold that the original readers were Gentiles. The question is entirely one of inference from the contents of the epistle itself.<P>1. General Character of the Readers:<P>The readers, like the writer, received the gospel first from "them that heard" (<a onClick="return mV(\'Hbr\',2,3);">Heb 2:3</a>), from the personal disciples of the Lord, but they were not of their number. They had witnessed "signs and wonders" and "manifold powers" and "gifts of the Holy Spirit" (<a onClick="return mV(\'Hbr\',2,4);">Heb 2:4</a>). Their conversion had been thorough, and their faith and Christian life had been of a high order. They had a sound knowledge of the first principles of Christ (<a onClick="return mV(\'Hbr\',6,1);">Heb 6:1</a>). They had become "partakers of Christ," and had need only to "hold fast the beginning of (their) confidence firm unto the end" (<a onClick="return mV(\'Hbr\',3,14);">Heb 3:14</a>). They had been fruitful in good works, ministering unto the saints (<a onClick="return mV(\'Hbr\',6,10);">Heb 6:10</a>), enduring suffering and persecution, and sympathizing with whose who were imprisoned (<a onClick="return mV(\'Hbr\',10,\'32-34\');">Heb 10:32-34</a>). All this had been in former days which appeared now remote. Their rulers and ministers of those days are now dead (<a onClick="return mV(\'Hbr\',13,7);">Heb 13:7</a>). And they themselves have undergone a great change. While they should have been teachers, they have become dull of hearing, and have need again to be taught the rudiments of the first principles of the gospel (<a onClick="return mV(\'Hbr\',5,12);">Heb 5:12</a>), and they are in danger of a great apostasy from the faith. They need warning against "an evil heart of unbelief, in falling away from the living God" (<a onClick="return mV(\'Hbr\',3,12);">Heb 3:12</a>). They are become sluggish (<a onClick="return mV(\'Hbr\',6,12);">Heb 6:12</a>), profane like Esau (<a onClick="return mV(\'Hbr\',12,16);">Heb 12:16</a>), worldly-minded (<a onClick="return mV(\'Hbr\',13,5);">Heb 13:5</a>). Perhaps their religion was tending toward a false asceticism and outward works (<a onClick="return mV(\'Hbr\',13,4,9);">Heb 13:4, 9</a>). And now that this moral dulness and spiritual indifference had fallen upon them, they are being subjected to a new test by persecution from outside (<a onClick="return mV(\'Hbr\',10,36);">Heb 10:36</a>; <a onClick="return mV(\'Hbr\',12,4);">12:4</a>), which renders the danger of their falling away from the faith all the more imminent. The author apparently bases his claim to warn them on the fact that he had been a teacher among them, and hoped soon to return to them (<a onClick="return mV(\'Hbr\',13,18);">Heb 13:18</a>f). The same might be said perhaps of Timothy (<a onClick="return mV(\'Hbr\',13,23);">Heb 13:23</a>). Both author and readers had friends in Italy (<a onClick="return mV(\'Hbr\',13,24);">Heb 13:24</a>) who were with the author when he wrote, either in Italy saluting the readers outside, or outside, saluting the readers in Italy. In all this there is little or nothing to help to fix the destination of the letter, for it might be true at some time or other of any church.<P>2. Jews or Gentiles?:<P>The old tradition that the readers were Jews claims some more definite support from the epistle itself. The writer assumes an intimate knowledge of the Old Testament and of Jewish ceremonial on their part. The fathers of the Hebrew race are also their fathers (<a onClick="return mV(\'Hbr\',1,1);">Heb 1:1</a>; <a onClick="return mV(\'Hbr\',3,9);">3:9</a>). The humanity that Christ assumed and redeemed is called "the seed of Abraham" (<a onClick="return mV(\'Hbr\',2,16);">Heb 2:16</a>). All this, however, might stand in reference to a Gentile church, for the early Christians, without distinction of race, regarded themselves as the true Israel and heirs of the Hebrew revelation, and of all that related to it (<a onClick="return mV(\'1Cr\',10,1);">1Co 10:1</a>; <a onClick="return mV(\'Gal\',3,7);">Ga 3:7</a>ff; <a onClick="return mV(\'Gal\',4,21);">4:21</A>ff; <a onClick="return mV(\'Rom\',4,\'11-18\');">Ro 4:11-18</a>). Still there is force in Zahn\'s argument that "Hebrews does not contain a single sentence in which it is so much as intimated that the readers became members of God\'s people who descended from Abraham, and heirs of the promise given to them and their forefathers, and how they became such" (Intro to New Testament, II, 323). Zahn further finds a direct proof in <a onClick="return mV(\'Hbr\',13,13);">Heb 13:13</a> that "both the readers and the author belong to the Jewish people," which he interprets as "meaning that the readers were to renounce fellowship with the Jewish people who had rejected Jesus, to confess the crucified Jesus, and to take upon themselves all the ignominy that Jesus met at the hands of his countrymen" (ibid., 324-25). But that is too large an inference to draw from a figurative expression which need not, and probably does not, mean more than an exhortation to rely on the sacrifice of Christ, rather than upon any external rules and ceremomes. Nor were the "divers and strange teachings" about marriage and meats (<a onClick="return mV(\'Hbr\',13,4,9);">13:4,9</a>) necessarily Jewish doctrines. They might be the doctrines of an incipient Gnosticism which spread widely throughout the Christian churches, both Jewish and Gentile, toward the end of the 1st century. There is otherwise no evidence that the apostasy, of which the readers stood in danger, was into Judaism, but it was rather a general unbelief and "falling away from the living God" (<a onClick="return mV(\'Hbr\',13,12);">3:12</a>).<P>It is the whole argument of the epistle, rather than any special references, that produced the tradition, and supports the view, that the readers were Jews. The entire message of the epistle, the dominant claims of Christ and of the Christian faith, rests upon the supposition that the readers held Moses, Aaron, the Jewish priesthood, the old Covenant and the Levitical ritual, in the highest esteem. The author\'s argument is: You will grant the Divine authority and greatness of Moses, Aaron and the Jewish institutions: Christ is greater than they; therefore you ought to be faithful to Him. He assumes an exclusively Jewish point of view in the minds of his readers as his major premise. He could scarcely do that, if they had been Gentiles. Paul, when writing to the mixed church at Rome, relates his philosophy of the Christian revelation to both Jewish and Gentile pre-Christian revelation. Gentile Christians adopted the Jewish tradition as their own in consequence of, and secondary to, their attachment to Christianity. Even Judaizing Gentile Christians, such as may be supposed to have belonged to the Galatian and Corinthian churches, adopted some parts of the Jewish law only as a supplement to Christianity, but not as its basis.<P>Von Soden and others have argued with much reason that these Christians were not in danger of falling back into Judaism from Christianity, but rather of falling away from all faith into unbelief and materialism, like the Israelites in the wilderness (<a onClick="return mV(\'Hbr\',3,7);">Heb 3:7</a>), or Esau (<a onClick="return mV(\'Hbr\',12,16);">Heb 12:16</a>). With all its references to Old Testament sacrifice and ceremonial, the letter contains not a single warning against reviving them, nor any indications that the readers were in danger of so doing (Hand-Commentar, 12-16). But it has been too readily assumed that these facts prove that the readers were not Jews. The pressure of social influence and persecution rendered Jews and Jewish Christians, as well as Gentile Christians, liable to apostatize to heathenism or irreligion (The <span class="noTag">Wisdom of Solomon 2:10,20</span>; 2Macc 4; 6; 7; Philo, De Migratione Abrahami, XVI; <a onClick="return mV(\'Mat\',24,10,12);">Mt 24:10, 12</a>; <a onClick="return mV(\'Act\',20,30);">Ac 20:30</a>; <a onClick="return mV(\'1Cr\',10,7,14);">1Co 10:7, 14</a>; <a onClick="return mV(\'2Th\',2,4);">2Th 2:4</a>; <a onClick="return mV(\'1Jo\',2,18);">1Joh 2:18</a>; <a onClick="return mV(\'1Jo\',5,21);">5:21</a>; Pliny Epistle X, 96). Von Soden\'s argument really cuts the other way. If the writer had been dealing with Gentile Christians who were in danger of relapsing into heathenism or of falling into religious indifference, his argument from the shadowy and temporary glories of Judaism to the perfect salvation in Christ would avail nothing, because, for such, his premises would depend upon his conclusion. But if they were Jewish Christians, even though leaning toward heathenism, his argument is well calculated to call up on its side all the dormant force of their early religious training. He is not arguing them out of a "subtle Judaism" quickened by the zeal of a propaganda (Moffatt, Introduction, 449-50), but from "drifting away" in Heb (<a onClick="return mV(\'Hbr\',2,1);">2:1</A>), from "neglect" (<a onClick="return mV(\'Hbr\',2,3);">2:3</A>), from "an evil heart of unbelief, in falling away from the living God" (<a onClick="return mV(\'Hbr\',3,12);">3:12</A>), from "disobedience" (<a onClick="return mV(\'Hbr\',4,11);">4:11</A>), from "a dulness of hearing" (<a onClick="return mV(\'Hbr\',5,11);">5:11</A>), but into "diligence...that ye be not sluggish" (<a onClick="return mV(\'Hbr\',6,11);">6:11</A>f), into "boldness and patience" (<a onClick="return mV(\'Hbr\',10,35);">10:35</A>f), and to "lift up the hands that hang down, and the palsied knees" (<a onClick="return mV(\'Hbr\',12,12);">12:12</A>); and this he might well do by his appeal to their whole religious experience, both Jewish and Christian, and to the whole religious history of their race.<P>3. The Locality of the Readers:<P>The question of the locality of these "Hebrews" remains a matter for mere conjecture. Jerusalem, Alexandria, Rome, Antioch, Colosse, Ephesus, Berea, Ravenna and other places have been suggested. Tradition, since Clement of Alexandria, fixed on Jerusalem, but on the untenable ground that the letter was written to Aramaic-speaking Jews. The undisputed fact that it was written in Greek tells against Jerusalem. So does the absence of all reference to the temple ritual, and the mention of almsgiving as the chief grace of the "Hebrews" (<a onClick="return mV(\'Hbr\',6,10);">6:10</A>). Jerusalem received rather than gave alms. Nor is it likely that all the personal disciples of the Lord would have died out in Jerusalem (<a onClick="return mV(\'Hbr\',2,3);">2:3</a>). And it could not be charged against the mother church that it had produced no teachers (<a onClick="return mV(\'Hbr\',5,12);">5:12</A>). These points also tell with almost equal force against any Palestinian locality.<P>Alexandria was suggested as an alternative to Jerusalem, on the supposition that those references to Jewish ritual which did not correspond with the Jerusalem ritual (<a onClick="return mV(\'Hbr\',7,27);">Heb 7:27</a>; <a onClick="return mV(\'Hbr\',9,4);">9:4</a>; <a onClick="return mV(\'Hbr\',10,11);">10:11</a>) might refer to the temple at Leontopolis. But the ritual system of the epistle is that of the tabernacle and of tradition, and not of any temple. The Alexandrian character of the letter has bearing on the identity of the author, but not so much on that of his readers. The erroneous idea that Paul was the author arose in Alexandria, but it would have been least likely to arise where the letter was originally sent.<P>Rome has lately found much favor. We first learn of the existence of the letter at Rome. The phrase "they of Italy salute you" (<a onClick="return mV(\'Hbr\',13,24);">Heb 13:24</a>) implies that either the writer or his readers were in Italy. It may be more natural to think of the writer, with a small group of Italian friends away from home, sending greetings to Italy, than to suppose that a greeting from Italy generally was sent to a church at a distance. It is probable that a body of Jewish Christians existed in Rome, as in other large cities of the Empire. But this view does not, as von Soden thinks, explain any coincidences between Hebrews and Romans. A Roman origin might. It could explain the use of Hebrews by Clement. But the letter might also have come to Rome by Clement\'s time, even though it was originally sent elsewhere. The slender arguments in favor of Rome find favor chiefly because no arguments can be adduced in favor of any other place.<P>V. Date.<P>1. Terminal Dates:<P>The latest date for the composition of Hebrews is clearly fixed as earlier than 96 AD by reason of its use by Clement of Rome about that time. There is no justification for the view that Hebrews shows dependence on Josephus. The earliest date cannot be so definitely fixed. The apparent dependence of Hebrews on Paul\'s Epistles, Galatians, 1 Corinthians and Romans, brings it beyond 50 AD.<P>2. Conversion and History of Readers:<P>But we have data in the epistle itself which require a date considerably later. The readers had been converted by personal disciples of the Lord (<a onClick="return mV(\'Hbr\',2,3);">Heb 2:3</a>). They did not, therefore, belong to the earliest group of Christians. But it is not necessary to suppose a long interval between the Lord\'s ascension and their conversion. The disciples were scattered widely from Jerusalem by the persecution that followed the death of Stephen (<a onClick="return mV(\'Act\',8,1);">Ac 8:1</a>). "We may well believe that the vigorous preaching of Stephen would set a wave in motion which would be felt even at Rome" (Sanday, Romans, xxviii). They are not, therefore, necessarily to be described as Christians of the 2nd generation in the strict chronological sense. But the letter was written a considerable time after their conversion. They have had time for great development in Heb (<a onClick="return mV(\'Hbr\',5,12);">5:12</a>). They have forgotten the former days after their conversion (<a onClick="return mV(\'Hbr\',10,32);">10:32</A>). Their early leaders are now dead (<a onClick="return mV(\'Hbr\',13,7);">13:7</A>). Yet the majority of the church still consists of the first converts (<a onClick="return mV(\'Hbr\',2,3);">2:3</A>; <a onClick="return mV(\'Hbr\',10,32);">10:32</A>). And although no argument can be based upon the mention of 40 years (<a onClick="return mV(\'Hbr\',3,9);">3:9</A>), for it is only an incidental phrase in a quotation, yet no longer interval could lie between the founding of the church and the writing of the letter. It might be shorter. And the church may have been founded at any time from 32 to 70 AD.<P>3. Doctrinal Development:<P>The doctrinal development represented in Hebrews stands midway between the system of the later Pauline Epistles (Philippians, Colossians, Ephesians) and that of the Johannine Writings. The divers and strange teachings mentioned include only such ascetic tendencies about meat and marriage (<a onClick="return mV(\'Hbr\',13,4,9);">Heb 13:4, 9</a>) as are reflected in Paul\'s Epistles early and late. There is no sign of the appearance of the full-blown heresies of the Ebionites, Docetists, and Gnostics, which became prevalent before the end of the 1st century. On the other hand the Logos-doctrine as the interpretation of the person of Christ (<a onClick="return mV(\'Hbr\',1,\'1-4\');">Heb 1:1-4</a>) is more fully thought out than in Paul, but less explicit, and less assimilated with the purpose of Christianity, than in the Fourth Gospel.<P>4. The Fall of Jerusalem:<P>It has been argued that the letter must have been written before the fall of Jerusalem in 70 AD, because in writing to a Jewish community, and especially in dealing with Jewish ritual, the writer would have referred to that event, if it had happened. This point would be relevant, if the letter had been addressed to Jerusalem, which is highly improbable. But, at a distance, an author so utterly unconcerned with contemporary history could easily have omitted mention of even so important a fact. For in fact the author never mentions the temple or its ritual. His system is that of the tabernacle of the Old Testament and of Jewish tradition. The writer\'s interest is not in historical Judaism, and his omission to mention the great catastrophe does not prove that it had not occurred. The use of the present tense of the ritual does not imply its present continuance. "The present expresses the fact that so it is enjoined in the law, the past that with the founding of the New Covenant the old had been abolished" (Peake, Hebrews, 39).<P>5. Timothy:<P>A point of contact with contemporary history is found in the fact that Timothy was still living and active when Hebrews was written (<a onClick="return mV(\'Hbr\',13,23);">13:23</A>), but it does not carry us far. Timothy was a young man and already a disciple, when Paul visited Galatia on his 2nd journey about 46 AD (<a onClick="return mV(\'Act\',16,1);">Ac 16:1</a>). And he may have lived to the end of the century or near to it. It cannot be safely argued from the mere mention of his name alone, that Paul and his other companions were dead.<P>6. Two Persecutions:<P>Two incidents in the history of the readers are mentioned which afford further ground for a somewhat late date. Immediately after their conversion, they suffered persecution, "a great conflict of sufferings; partly, being made a gazingstock both by reproaches and afflictions; and partly, becoming partakers with them that were so used" (<a onClick="return mV(\'Hbr\',10,32);">Heb 10:32</a>f). And now again, when the letter is written, they are entering upon another time of similar trial, in which they "have need of patience" (<a onClick="return mV(\'Hbr\',10,36);">Heb 10:36</a>), though they "have not yet resisted unto blood" (<a onClick="return mV(\'Hbr\',12,4);">Heb 12:4</a>). Their leaders, at least, it would appear, the writer and Timothy, have also been in prison, but one is at liberty and the other expects to be soon (<a onClick="return mV(\'Hbr\',13,19,23);">Heb 13:19, 23</a>). It has been conjectured that the first persecution was that under Nero in 64 AD, and the second, that in the reign of Domitian, after 81 AD. But when it is remembered that in some part of the Empire Christians were almost always under persecution, and that the locale of these readers is very uncertain, these last criteria do not justify any dogmatizing. It is certain that the letter was written in the second half of the 1st century. Certain general impressions, the probability that the first apostles and leaders of the church were dead, the absence of any mention of Paul, the development of Paul\'s theological ideas in a new medium, the disappearance of the early enthusiasm, the many and great changes that had come over the community, point strongly to the last quarter of the century. The opinions of scholars at present seem to converge about the year 80 AD or a little later.<P>VI. Contents.<P>1. Summary of Contents:<p><b>I. The Revelation of God in His Son (<a onClick="return mV(\'Hbr\',1,\'1-\');">Heb 1</A>-<a onClick="return mV(\'Hbr\',2,\'1-\');">2</a>)</b>.<P class="in15">1. Christ the completion of revelation (<a onClick="return mV(\'Hbr\',1,\'1-3\');">Heb 1:1-3</a>).<P class="in15">2. Christ\'s superiority over the angels (<a onClick="return mV(\'Hbr\',1,4);">Heb 1:4</a>).<P class="in30">(1) Because He is a Son (<a onClick="return mV(\'Hbr\',1,\'4-6\');">Heb 1:4-6</a>).<P class="in30">(2) Because His reign is eternal (<a onClick="return mV(\'Hbr\',1,7);">Heb 1:7</a>).<P class="in15">3. The dangers of neglecting salvation through the Son (<a onClick="return mV(\'Hbr\',2,\'1-4\');">Heb 2:1-4</a>).<P class="in15">4. The Son and humanity (<a onClick="return mV(\'Hbr\',2,5);">Heb 2:5</a>).<P class="in30">(1) The lowliness and dignity of man (<a onClick="return mV(\'Hbr\',2,\'5-8\');">Heb 2:5-8</a>).<P class="in30">(2) Necessity for the Incarnation (<a onClick="return mV(\'Hbr\',2,9);">Heb 2:9</a>).<P class="in45">(a) To fulfill God\'s gracious purpose (<a onClick="return mV(\'Hbr\',2,9);">Heb 2:9</a>f).<P class="in45">(b) That the Saviour and saved might be one (<a onClick="return mV(\'Hbr\',2,\'11-15\');">Heb 2:11-15</a>).<P class="in45">(c) That the Saviour may sympathize with the saved (<a onClick="return mV(\'Hbr\',2,16);">Heb 2:16</a>).<P><b>II. The Prince of Salvation (<a onClick="return mV(\'Hbr\',3,\'1-\');">Heb 3:1</a>-<a onClick="return mV(\'Hbr\',4,\'1-13\');">4:13</a>)</b>.<P class="in15">1. Christ as Son superior to Moses as servant (<a onClick="return mV(\'Hbr\',3,\'1-6\');">Heb 3:1-6</a>).<P class="in15">2. Consequences of Israel\'s unbelief (<a onClick="return mV(\'Hbr\',3,\'7-11\');">Heb 3:7-11</a>).<P class="in15">3. Warning the "Hebrews" against similar unbelief (<a onClick="return mV(\'Hbr\',3,12);">Heb 3:12</a>).<P class="in15">4. Exhortations to faithfulness (<a onClick="return mV(\'Hbr\',4,\'1-13\');">Heb 4:1-13</a>).<P class="in30">(1) Because a rest remains for the people of God (<a onClick="return mV(\'Hbr\',4,\'1-11\');">Heb 4:1-11</a>).<P class="in30">(2) Because the omniscient God is judge (<a onClick="return mV(\'Hbr\',4,12);">Heb 4:12</a>f).<P><b>III. The Great High Priest (<a onClick="return mV(\'Hbr\',4,\'14-\');">Heb 4:14-10:18</a>)</b>.<P class="in15">1. Christ\'s priesthood the Christian\'s confidence (<a onClick="return mV(\'Hbr\',4,\'14-16\');">Heb 4:14-16</a>).<P class="in15">2. Christ has the essential qualifications for priesthood (<a onClick="return mV(\'Hbr\',5,\'1-10\');">Heb 5:1-10</a>).<P class="in30">(1) Sympathy with men (<a onClick="return mV(\'Hbr\',5,\'1-3\');">Heb 5:1-3</a>).<P class="in30">(2) God\'s appointment (<a onClick="return mV(\'Hbr\',5,\'4-10\');">Heb 5:4-10</a>).<P class="in15">3. The spiritual dulness of the Hebrews (<a onClick="return mV(\'Hbr\',5,11);">Heb 5:11-6:12</a>).<P class="in30">(1) Their lack of growth in knowledge (<a onClick="return mV(\'Hbr\',5,11);">Heb 5:11</a>).<P class="in30">(2) "Press on unto perfection" (<a onClick="return mV(\'Hbr\',6,\'1-3\');">Heb 6:1-3</a>).<P class="in30">(3) The danger of falling away from Christ (<a onClick="return mV(\'Hbr\',6,\'4-8\');">Heb 6:4-8</a>).<P class="in30">(4) Their past history ground for hoping better things (<a onClick="return mV(\'Hbr\',6,\'9-12\');">Heb 6:9-12</a>).<P class="in15">4. God\'s oath the ground of Christ\'s priesthood and of the believer\'s hope (<a onClick="return mV(\'Hbr\',6,13);">Heb 6:13</a>).<P class="in15">5. Christ a priest after the order of Melchizedek (<a onClick="return mV(\'Hbr\',7,1);">Heb 7:1</a>).<P class="in30">(1) The history of Melchizedek (<a onClick="return mV(\'Hbr\',7,\'1-3\');">Heb 7:1-3</a>).<P class="in30">(2) The superiority of his order over that of Aaron (<a onClick="return mV(\'Hbr\',7,\'4-10\');">Heb 7:4-10</a>).<P class="in30">(3) Supersession of the Aaronic priesthood (<a onClick="return mV(\'Hbr\',7,\'11-19\');">Heb 7:11-19</a>).<P class="in30">(4) Superiority of Christ\'s priesthood (<a onClick="return mV(\'Hbr\',7,\'20-24\');">Heb 7:20-24</a>).<P class="in30">(5) Christ a priest befitting us (<a onClick="return mV(\'Hbr\',7,24);">Heb 7:24</a>).<P class="in15">6. Christ the true high priest (<a onClick="return mV(\'Hbr\',8,\'1-\');">Heb 8:1-10:18</a>).<P class="in30">(1) Because He entered the true sanctuary (<a onClick="return mV(\'Hbr\',8,\'1-5\');">Heb 8:1-5</a>).<P class="in30">(2) Because He is priest of the New Covenant (<a onClick="return mV(\'Hbr\',8,6);">Heb 8:6</a>).<P class="in30">(3) A description of the old tabernacle and its services (<a onClick="return mV(\'Hbr\',9,\'1-7\');">Heb 9:1-7</a>).<P class="in30">(4) Ineffectiveness of its sacrifices (<a onClick="return mV(\'Hbr\',9,\'8-10\');">Heb 9:8-10</a>).<P class="in30">(5) Superiority of Christ\'s sacrifice (<a onClick="return mV(\'Hbr\',9,\'11-14\');">Heb 9:11-14</a>).<P class="in30">(6) The Mediator of the New Covenant through His own blood (<a onClick="return mV(\'Hbr\',9,15);">Heb 9:15</a>).<P class="in30">(7) Weakness of the sacrifices of the law (<a onClick="return mV(\'Hbr\',10,\'1-5\');">Heb 10:1-5</a>).<P class="in30">(8) Incarnation for the sake of sacrifice (<a onClick="return mV(\'Hbr\',10,\'6-9\');">Heb 10:6-9</a>).<P class="in30">(9) The one satisfactory sacrifice (<a onClick="return mV(\'Hbr\',10,\'10-18\');">Heb 10:10-18</a>).<P><b>IV. Practical Exhortations (<a onClick="return mV(\'Hbr\',10,19);">Heb 10:19-13:25</a>)</b>.<P class="in15">1. Draw near to God and hold fast the faith (<a onClick="return mV(\'Hbr\',10,\'19-23\');">Heb 10:19-23</a>).<P class="in15">2. The responsibility of Christians and the judgment of God (<a onClick="return mV(\'Hbr\',10,\'24-31\');">Heb 10:24-31</a>).<P class="in15">3. Past faithfulness a ground for present confidence (<a onClick="return mV(\'Hbr\',10,32);">Heb 10:32</a>).<P class="in15">4. The household of faith (<a onClick="return mV(\'Hbr\',11,1);">Heb 11:1</a>).<P class="in30">(1) What is faith? (<a onClick="return mV(\'Hbr\',11,\'1-3\');">Heb 11:1-3</a>).<P class="in30">(2) The examples of faith (<a onClick="return mV(\'Hbr\',11,\'4-32\');">Heb 11:4-32</a>).<P class="in30">(3) The triumphs of faith (<a onClick="return mV(\'Hbr\',11,33);">Heb 11:33</a>).<P class="in15">5. Run the race looking unto Jesus (<a onClick="return mV(\'Hbr\',12,\'1-3\');">Heb 12:1-3</a>).<P class="in15">6. Sufferings as discipline from the Father (<a onClick="return mV(\'Hbr\',12,\'4-11\');">Heb 12:4-11</a>).<P class="in15">7. The duty of helping and loving the brethren (<a onClick="return mV(\'Hbr\',12,\'12-17\');">Heb 12:12-17</a>).<P class="in15">8. Comparison of the trials and privileges of Christians with those of the Israelites (<a onClick="return mV(\'Hbr\',12,18);">Heb 12:18</a>).<P class="in15">9. Various duties (<a onClick="return mV(\'Hbr\',13,\'1-17\');">Heb 13:1-17</a>).<P class="in30">(1) Moral and social relations (<a onClick="return mV(\'Hbr\',13,\'1-6\');">Heb 13:1-6</a>).<P class="in30">(2) Loyalty to leaders (<a onClick="return mV(\'Hbr\',13,7);">Heb 13:7</a>f).<P class="in30">(3) Beware of Jewish heresies (<a onClick="return mV(\'Hbr\',13,\'9-14\');">Heb 13:9-14</A>).<P class="in30">(4) Ecclesiastical worship and order (<a onClick="return mV(\'Hbr\',13,\'15-17\');">Heb 13:15-17</a>).<P class="in15">10. Personal affairs and greetings (<a onClick="return mV(\'Hbr\',13,18);">Heb 13:18</a>).<P class="in30">(1) A request for the prayers of the church (<a onClick="return mV(\'Hbr\',13,18);">Heb 13:18</a>f).<P class="in30">(2) A prayer for the church (<a onClick="return mV(\'Hbr\',13,20);">Heb 13:20</a>f) .<P class="in30">(3) "Bear with the word of exhortation" (<a onClick="return mV(\'Hbr\',13,22);">Heb 13:22</a>).<P class="in30">(4) "Our brother Timothy" (<a onClick="return mV(\'Hbr\',13,23);">Heb 13:23</a>).<P class="in30">(5) Greetings (<a onClick="return mV(\'Hbr\',13,24);">Heb 13:24</a>).<P class="in30">(6) Grace (<a onClick="return mV(\'Hbr\',13,25);">Heb 13:25</a>).<P>2. The Main Theme:<P>The theme of the epistle is the absoluteness of the Christian religion, as based-upon the pre-eminence of Jesus Christ, the one and only mediator of salvation. The essence of Christ\'s preeminence is that He fully realizes in His own person the principles of revelation and reconciliation. It is made manifest in His superiority over the Jewish system of salvation, which He therefore at once supersedes and fulfils. The author\'s working concept is the Logos-doctrine of Philo; and the empirical data to which it is related is the religious history of Israel, as it culminates in Christianity. He makes no attempt to prove either his ideal first principles or his historical premises, and his philosophy of religion takes no account of the heathen world. The inner method of his argument is to fit Judaism and Christianity into the Logos-concept; but his actual is related to the ideal in the way of Plato\'s antithesis, of shadow and reality, of pattern and original, rather than in Aristotle\'s way of development, although the influence of the latter method may often be traced, as in the history of faith, which is carried back to the beginnings of history, but is made perfect only in the Christian consummation (<a onClick="return mV(\'Hbr\',11,40);">Heb 11:40</a>). In a number of other ideas the teleological movement may be seen cutting across the categories of shadow and reality (<a onClick="return mV(\'Hbr\',1,3);">Heb 1:3</a>; <a onClick="return mV(\'Hbr\',1,10);">1:10</a>; <a onClick="return mV(\'Hbr\',4,8);">4:8</a>f; <a onClick="return mV(\'Hbr\',5,8);">5:8</A>f; <a onClick="return mV(\'Hbr\',9,12);">9:12</A>; <a onClick="return mV(\'Hbr\',10,12);">10:12</A>; <a onClick="return mV(\'Hbr\',12,22);">12:22</A>).<P>3. Alexandrian Influences:<P>The form of the argument may be described as either rabbinical or Alexandrian. The writer, after laying down his proposition, proceeds to prove it by quotations from the Old Testament, taken out of their context and historical connection, adapted and even changed to suit his present purpose. This practice was common to Palestinian and Alexandrian writers; as was also the use of allegory which plays a large part in Hebrews (e.g. <a onClick="return mV(\'Hbr\',3,\'7-\');">Heb 3:7</a>-<a onClick="return mV(\'Hbr\',4,\'1-11\');">4:11</a>; <a onClick="return mV(\'Hbr\',13,11);">13:11</a>f). But the writer\'s allegorical method differs from that of the rabbis in that it is like Philo\'s, part of a conscious philosophy, according to which the whole of the past and present history of the world is only a shadow of the true realities which are laid up in heaven (<a onClick="return mV(\'Hbr\',8,5);">Heb 8:5</a>; <a onClick="return mV(\'Hbr\',9,23);">9:23</a>f; <a onClick="return mV(\'Hbr\',10,1);">10:1</a>). His interest in historical facts, in Old Testament writers, in Jewish institutions and even in the historical life of Jesus, is quite subordinate to his prepossession with the eternal and heavenly realities which they, in more or less shadowy fashion, represent. That the affinities of Hebrews are Alexandrian rather than Palestinian is further proved by many philological and literary correspondences with The Wisdom of Solomon and Philo. Most of the characteristic terms and phrases of the epistle are also found in these earlier writers. It has been argued that Hebrews and Wisdom came from the same hand, and it seems certain that the author of Hebrews was familiar with both Wisdom and the writings of Philo (Plumptre in The Expositor, I, 329ff, 409ff; von Soden in Hand-Commentar, 5-6). In Philo the dualism of appearance and reality finds its ultimate synthesis in his master-conception of the Logos, and although this term does not appear in Hebrews in Philo\'s sense, the doctrine is set forth in Philonic phraseology in the opening verses (<a onClick="return mV(\'Hbr\',1,\'1-4\');">1:1-4</A>). As Logos, Christ excels the prophets as revealer of God, is superior to the angels who were the mediators of the old Covenant, and is more glorious than Moses as the builder of God\'s true tabernacle, His eternal house; He is a greater Saviour than Joshua, for He brings his own to final rest; and He supersedes the Aaronic priesthood, for while they ministered in a "holy place made with hands, like in pattern to the true," under a "law having a shadow of the good things to come, not the very image of the things" (<a onClick="return mV(\'Hbr\',9,24);">Heb 9:24</a>; <a onClick="return mV(\'Hbr\',10,1);">10:1</a>), He "having come a high priest of the good things to come, through the greater and more perfect tabernacle, not made with hands...nor yet through the blood of goats and calves, but through his own blood, entered in once for all into the holy place, having obtained eternal redemption" (<a onClick="return mV(\'Hbr\',9,11);">Heb 9:11</a>f).<P>4. The Christian Factor:<P>Yet it is possible to exaggerate the dependence of Hebrews on Alexandrian thought. Deeper than the allegorical interpretation of passages culled from the Septuagint, deeper than the Logos-philosophy which formed the framework of his thought, is the writer\'s experience and idea of the personal Christ. His central interest lies, not in the theoretical scheme which he adopts, but in the living person who, while He is the eternal reality behind all shadows, and the very image of God\'s essence, is also our brother who lived and suffered on earth, the author of our salvation, our "fore-runner within the veil," who "is able to save to the uttermost them that draw near unto God through him, seeing he ever liveth to make intercession for them" (<a onClick="return mV(\'Hbr\',1,\'1-4\');">Heb 1:1-4</a>; <a onClick="return mV(\'Hbr\',2,14);">2:14</a>ff; <a onClick="return mV(\'Hbr\',2,10);">2:10</A>; <a onClick="return mV(\'Hbr\',5,\'7-9\');">5:7-9</A>; <a onClick="return mV(\'Hbr\',4,14,15);">4:14-15</a>; <a onClick="return mV(\'Hbr\',6,20);">6:20</a>; <a onClick="return mV(\'Hbr\',7,25);">7:25</A>). As in Paul and John, so in Hebrews, the historical and ever-living Christ comes in as an original and creative element, which transforms the abstract philosophy of Hellenistic thought into a living system of salvation. Because of His essential and personal preeminence over the institutions and personalities of the old Covenant, Christ has founded a new Covenant, given a new revelation and proclaimed a new gospel. The writer never loses sight of the present bearing of these eternal realities on the lives of his readers. They are for their warning against apostasy, for their encouragement in the face of persecution, and for their undying hope while they \'run the race that is set before (them), looking unto Jesus the author and perfecter of...faith (<a onClick="return mV(\'Hbr\',2,3);">Heb 2:3</a>; <a onClick="return mV(\'Hbr\',3,12);">3:12</a>ff; <a onClick="return mV(\'Hbr\',4,1);">4:1</a>ff; <a onClick="return mV(\'Hbr\',10,28);">10:28</a>ff; <a onClick="return mV(\'Hbr\',12,1);">12:1</A>f; <a onClick="return mV(\'Hbr\',12,22);">22</a>).<P>LITERATURE.<P>(1) Commentary by A. S. Peake, Century Bible; A.B. Davidson, Bible Handbooks; Marcus Dods, Expositor\'s Greek Test.; T.C. Edwards, Expositor\'s Bible; F. Rendall (London, 1888); Westcott 3 (1903); von Soden, Hand-Commentar; Hollmann, Die Schriften des New Testament.<P>(2) Introductions by Moffatt, Introduction to the Lit. of the New Testament; A. B. Bruce in HDB; von Soden in EB; Zahn, Introduction to the New Testament; H.H.B Ayles, Destination, Date, and Authorship of the Epistle to the Hebrews; Harnack, "Probabilia, uber die Addresse und den Verfasser des Hebraerbriefes," ZNTW, I (1900); W. Wrede, Das literarische Ratsel des Hebraerbriefes (1906).<P>(3) Theology: Bruce, The Epistle to the Hebrews; Milligan, The Theology of the Epistle to the Hebrews; Menegoz, La theologie de l\'epitre aux Hebreux. For fuller list, see Moffatt, in the work quoted``145';
isbe[4222]='Hebrews, Gospel According to the`(Euaggelion kath\' Hebraious, to Hebraikon, to Ioudaikon; Evangelium Hebraeorum, Judeorum):<P>1. References in Early Church History<P>2. Its Character and Contents<P>3. Its Circulation and Language<P>4. Relation to Matthew<P>5. Time of Composition<P>6. Uncanonical Sayings and Incidents<P>7. Conclusion<P>LITERATURE<hr /><P>"The Gospel according to the Hebrews" was a work of early Christian literature to which reference is frequently made by the church Fathers in the first five centuries, and of which some twenty or more fragments, preserved in their writings, have come down to us. The book itself has long disappeared. It has, however, been the subject of many critical surmises and discussions in the course of the last century. It has been regarded as the original record of the life of Jesus, the Archimedespoint of the whole gospel history. From it Justin Martyr has been represented as deriving his knowledge of the works and words of Christ, and to it have been referred the gospel quotations found in Justin and other early writers when these deviate in any measure from the text of the canonical gospels. Recent discussions have thrown considerable light upon the problems connected with this Gospel, and a large literature has grown up around it of which the most important works will be noted below.<P>1. References in Early Church History:<P>Speaking of Papias Eusebius mentions that he has related the story of a woman who was accused of many sins before the Lord, which is contained in the "Gospel according to the Hebrews." This does not prove that Papias was acquainted with this Gospel, for he might have obtained the story, which cannot any longer be regarded as part of John\'s Gospel, from oral tradition. But there is a certain significance in Eusebius\' mentioning it in this connection (Euseb., HE, III, xxxix, 16). Eusebius, speaking of Ignatius and his epp., takes notice of a saying of Jesus which he quotes (Ep. ad Smyrn, iii; compare <a onClick="return mV(\'Luk\',24,39);">Lu 24:39</a>), "Take, handle me, and see that I am not an incorporeal spirit." The saying differs materially from the saying in Luke\'s Gospel, and Eusebius says he has no knowledge whence it had been taken by Ignatius. Jerome, however, twice over attributes the saying to the "Gospel according to the Hebrews," and Origen quotes it from the "Teaching of Peter." Ignatius may have got the saying from oral tradition, and we cannot, therefore, be sure that he knew this Gospel.<P>The first early Christian writer who is mentioned as having actually used the "Gospel according to the Hebrews" is Hegesippus, who flourished in the second half of the 2nd century. Eusebius, to whom we owe the reference, tells us that Hegesippus in his Memoirs quotes passages from "the Syriac Gospel according to the Hebrews" (Historia Ecclesiastica, IV, xxii, 7).<P>Irenaeus, in the last quarter of the 2nd century, says the Ebionites use only the "Gospel according to Matthew" and reject the apostle Paul, calling him an apostate from the law (Adv. Haer., i. 26, 2). There is reason to believe that there is some confusion in this statement of Irenaeus, for we have the testimony of Eusebius, Jerome and Epiphanius that it was the "Gospel according to the Hebrews" that was used by the Ebionites. With this qualification we may accept Irenaeus as a witness to this Gospel.<P>Clement of Alexandria early in the 3rd century quotes from it an apocryphal saying with the same formula as he employs for quotation of Holy Scripture (Strom., ii.9). Origen, Clement\'s successor at Alexandria, has one very striking quotation from the "Gospel according to the Hebrews" (Comm. in Joann, ii), and Jerome says this Gospel is often used by Origen. Eusebius, in the first half of the 4th century, mentions that the Ebionites use only the "Gospel according to the Hebrews" and take small account of the others (Historia Ecclesiastica, III, xxvii, 4). He has, besides, other references to it, and in his widely known classification of Christian Scriptures into "acknowledged" "disputed," and "rejected," he mentions this Gospel which he says some have placed in the last category, although those of the Hebrews who have accepted Christ are delighted with it (Historia Ecclesiastica, III, xxv, 5). Eusebius had himself in all probability seen and handled the book in the library of his friend Pamphilus at Caesarea, where Jerome, half a century later, found it and translated it.<P>Epiphanius, who lived largely in Palestine, and wrote his treatise on heresies in the latter half of the 4th century, has much to say of the Ebionites, and the Nazarenes. Speaking of the Ebionites, he says they receive the "Gospel according to Matthew" to the exclusion of the others, mentioning that it alone of the New Testament books is in Hebrew speech and Hebrew characters, and is called the "Gospel according to the Hebrews" (Haer., xxx.3). He goes on to say, that their "Gospel according to Matthew," as it is named, is not complete but falsified and mutilated, "and they call it the Hebrew Gospel" (Haer., xxx. 13). The quotations which Epiphanius proceeds to make show that this Gospel diverges considerably from the canonical Gospel of Matthew and may well be that according to the Hebrews. It is more likely that "the Gospel according to Matthew, very full, in Hebrew," of which Epiphanius speaks, when telling about the Nazarene, is the Hebrew "Gospel of Matthew" attested by Papias, Irenaeus, and a widespread early tradition. But as Epiphanius confesses he does not know whether it has the genealogies, it is clear he was not himself acquainted with the book.<P>Jerome, toward the end of the 4th century, is our chief authority for the circulation and use of the "Gospel according to the Hebrews," although his later statements on the subject do not always agree with the earlier. He was proud of being "trilinguis," acquainted with Hebrew as well as with Latin and Greek. "There is a Gospel," he says, "which the Nazarenes and Ebionites use, which I lately translated from the Hebrew tongue into Greek and which is called by many the authentic Gospel of Matthew" (Commentary on <a onClick="return mV(\'Mat\',12,13);">Matthew 12:13</a>). The fact here mentioned, that he translated the work, seems to imply that this Gospel was really something different from the canonical Matthew which he had in his hands. In another place, however, he writes: "Matthew...first of all composed the Gospel of Christ in Hebrew letters and words, in Judea, for behoof of those of the circumcision who had believed, and it is not quite certain who afterward translated it into Greek. But the very Hebrew is preserved to this day in the Caesarean library, which Pamphilus the Martyr, with such care, collected. I myself was allowed the opportunity of copying it by the Nazarenes in Berea who use this volume. In which it is to be observed that the evangelist, when he uses the testimonies of the Old Testament, either in his own person, or in that of the Lord and Saviour, does not follow the authority of the Septuagint translators, but the Hebrew. Of those, the following are two examples: \'Out of Egypt have I called my Son\' (<a onClick="return mV(\'Mat\',2,15);">Mt 2:15</a> the King James Version); and \'He shall be called a Nazarene\' (<a onClick="return mV(\'Mat\',2,23);">Mt 2:23</a>)" (De Vir. Ill., iii). It certainly looks as if in the former instance Jerome meant the Gospel according to the Hebrews, and in the latter the well-authenticated Hebrew Gospel of Matthew. At a later time, however, Jerome appears to withdraw this and to introduce a confusing or even contradictory note. His words are: "In the Gospel according to the Hebrews, which was written indeed in the Chaldee-Syr (Aramaic) language, but in Hebrew characters, which the Nazarenes use as the \'Gospel of the Apostles,\' or as most people think \'according to Matthew,\' which also is contained in the library at Caesarea, the narrative says" (Adv. Pelag., iii.2). As he proceeds, he quotes passages which are not in the canonical Mt. He also says: "That Gospel which is called the Gospel of the Hebrews which was latedly translated by me into Greek and Latin, and was used frequently by Origen" (Catal. Script. Eccl., "Jacobus"). Jerome\'s notices of the actual Gospel were frequent, detailed and unequivocal.<P>Nicephorus at the beginning of the 9th century puts the Gospel according to the Hebrews in his list of disputed books of the New Testament along with the Apocalypse of John, the Apocalypse of Peter, and the Epistle of Barnabas. This list is believed to rest upon an authority of about the year 500 AD, and, in the stichometry attached, this Gospel is estimated to have occupied 2,200 lines, while the canonical Matthew occupied 2,500.<P>Codex Lambda of the 9th century, discovered by Tischendorf, and now in the Bodleian Library at Oxford, has marginal notes affixed to four passages of Matthew giving the readings of to Ioudaikon, the lost Gospel according to the Hebrews (Scrivener, Textual Criticism, I4, 160; see also Plate XI, 30, p. 131).<P>2. Its Character and Contents:<P>All that survives, and all that we are told, of this work, show that it was of the nature of a Gospel, and that it was written in the manner of the Synoptic Gospels. But it seems not to have acquired at any time ecclesiastical standing outside the very limited circles of Jewish Christians who preferred it. And it never attained canonical authority. The Muratorian Fragment has no reference to it. Irenaeus knew that the Ebionites used only the Gospel according to Matthew in Hebrew, although, as we have seen, this may be really the Gospel according to the Hebrews; but his fourfold Gospel comprises the Gospels of Matthew, Mark, Luke and John, which we know. There is no reason to believe that it was the source of the quotations made by Justin from the Apomnemoneumata, or of quotations made anonymously by others of the early Fathers. Like the Synoptic Gospels, however, it contained narratives of events as well as sayings and discourses. It had an account of John the Baptist\'s ministry, of the baptism of Jesus, of the call of the apostles, of the woman taken in adultery, of the Last Supper, of the denial of Peter, of appearances of Jesus after the resurrection; and it contained the Lord\'s Prayer, and sayings of Jesus, like the forgiveness of injuries seventy times seven, the counsel to the rich young ruler, and others. One or two sayings have a Gnostic tinge, as when Jesus calls the Holy Spirit His mother, and is made to express His unwillingness to eat the flesh of the Passover Lamb. There are apocryphal additions, even where incidents and sayings are narrated belonging to the canonical Gospels, and there are sayings and incidents wholly apocryphal in the fragments of the Gospel which have survived. But these superfluities do not imply any serious deviation from Catholic doctrine; they only prove, as Professor Zahn says, "the earnestness of the redactor of the Gospel according to the Hebrews to enrich the only Gospel which Jewish Christians possessed up to that time from the still unexhausted source of private oral tradition" (GK, II, 717).<P>The very title of the work suggests that it circulated among Jewish Christians. Those Christians of Palestine to whom Jerusalem was the ecclesiastical center betook themselves, after the troubles which befell the Holy City, to the less frequented regions beyond the Jordan, and were thus cut off from the main stream of catholic Christianity.<P>3. Its Circulation and Language:<P>It was accordingly easier for the spirit of exclusiveness to assert itself among them and also for heretical tendencies to develop. The Ebionites went farthest in this direction. They denied the supernatural birth of our Lord, and insisted upon the binding character of the Law for all Christians. The Nazarenes, as all Jewish Christians were called at first, observed the ceremonial law themselves, but did not impose it upon GentileChristians. And they accepted the catholic doctrine of the person of Christ. It was among a community of these Nazarenes at Berea, the modern Aleppo, that Jerome, during a temporary residence at Chalcis in Northern Syria, found the Gospel according to the Hebrews in circulation. No fewer than 9 times does he mention that this Gospel is their one Gospel, and only once does he connect the Ebionites with them in the use of it. Epiphanius draws a clear line of distinction between the Ebionites and the Nazarenes; and we can scarcely suppose that a Gospel which satisfied the one would be wholly acceptable to the other. There is reason to believe that the Hebrew Gospel of Matthew was most to the mind of the Hebrew Christians, and that it took different forms in the hands of the sects into which the Jewish Christian church became divided. Thus the Gospel of the Nazarenes was the Gospel according to the Hebrews, which in all probability had some affinity with the Hebrew Gospel of Matthew. The Gospel of the Ebionites, which seems to have been the same as the Gospel of the Twelve Apostles, was something of a more divergent doctrinal tendency suited to the exclusive and heretical views of that sect. But it is not easy to reconcile the statements of Epiphanius with those of Eusebius and Jerome.<P>That the Hebrew tongue in which Papins says Matthew composed his Logia was the Aramaic of Palestine is generally accepted. This Aramaic was closely akin to the Syriac spoken between the Mediterranean and the Tigris. It was the same as the Chaldee of the Books of Ezra, Nehemiah, and Daniel, of which examples have so recently been found in the Aramaic papyri from Elephantine at Assouan. Eusebius and Jerome are emphatic and precise in recording the fact that the Gospel according to the Hebrews was not only Hebrew or Aramaic in composition, but written in the square Hebrew characters, so different from the Old Hebrew of the Moabite Stone and the Siloam inscription. That there was a Greek translation before the time of Jerome of the Gospel according to the Hebrews, which was used by Origen, Clement of Alexandria, and others, is strenuously affirmed by Professor Harnack (Altchristliche Literatur, I, 6ff) and as strenuously denied by Professor Zahn (GK, II, 648ff). One reason why the book never attained to any ecclesiastical authority was no doubt its limited circulation in a tongue familiar, outside the circle of Jewish Christians, to only a learned few. For this reason also it is unlikely that it will ever be found, as the Epistle of Barnabas, the Shepherd, and other works have been.<P>4. Relation to Matthew:<P>It is natural to seek for traces of special relationship between the Gospel according to the Hebrews, circulating among communities of Jewish Christians, and the Gospel according to Matthew which grew up on the soil of Palestine, and which was originally composed in the interest of Jewish Christians, and circulated at a very early period in a Hebrew recension, soon superseded by the canonical Gospel of Matthew and now altogether lost. We have already seen that Irenaeus in all likelihood confused the "Gospel according to the Hebrews" with the Hebrew Gospel of Matthew; and that Jerome says the Gospel used by the Nazarenes was called by many the authentic Gospel of Matthew. Moreover, among the fragments that have survived, there are more which resemble Matthew\'s record than either of the other Synoptics. E.B. Nicholson, after a full and scholarly examination of the fragments and of the references, puts forward the hypothesis that "Matthew wrote at different times the canonical Gospel and the Gospel according to the Hebrews, or, at least, that large part of the latter which runs parallel to the former" (The Gospel according to the Hebrews, 104). The possibility of two editions of the same Gospel-writing coming from the same hand has recently received illustration from Professor. Blass\' theory of two recensions of the Acts and of Luke\'s Gospel to explain the textual peculiarities of these books in Codex Bezae (D). This theory has received the adhesion of eminent scholars, but Nicholson has more serious differences to explain, and it cannot be said that his able argument and admirably marshaled learning have carried conviction to the minds of New Testament scholars.<P>5. Time of Composition:<P>If we could be sure that Ignatius in his Epistle to the Smyrneans derived the striking saying attributed to our Lord, "Take, handle me, and see that I am not an incorporeal spirit," from the Gospel according to the Hebrews, we should be able to fix its composition as at any rate within the 1st century. The obscurity of its origin, the primitive cast of its contents, and the respect accorded to it down into the 5th century, have disposed some scholars to assign it an origin not later than our Synoptic Gospels, and to regard it as continuing the Aramaic tradition of the earliest preaching and teaching regarding Christ. The manifestly secondary character of some of its contents seems to be against such an early origin. Professor Zahn is rather disposed to place it not earlier than 130, when, during the insurrection of Bar-cochba, the gulf that had grown up between Jews and Jewish Christians was greatly deepened, and with an exclusively Gentile church in Jerusalem, the Jewish Christians had lost their center and broken off into sects. The whole situation seems to him to point to a date somewhere between 130-50 AD. The data for any precise determination of the question are wanting.<P>6. Uncanonical Sayings and Incidents:<P>There is a saying which Clement of Alexandria quotes from it as Scripture: "He that wonders shall reign and he that reigns shall rest" (Strom., ii.9). Origen quotes from it a saying of Jesus, reminding us somewhat of Ezekiel (<a onClick="return mV(\'Eze\',8,3);">8:3</A>): "Just now My Mother the Holy Spirit took me by one of my hairs, and bore me away to the great mountain Thabor" (Orig., In Joann., ii; it is quoted several times both by Origen and Jerome). Jerome more than once quotes from it a saying of the Lord to His disciples: "Never be joyful except when ye look on your brother in love" (Hieron. in <a onClick="return mV(\'Eph\',5,4);">Eph 5:4</a>; in <a onClick="return mV(\'Eze\',18,7);">Eze 18:7</a>). In his commentary on Mattew (<a onClick="return mV(\'Mat\',6,11);">6:11</a>) Jerome mentions that he found in the third petition of the Lord\'s prayer for the difficult and unique Greek word epiousios, which he translates "supersubstantialis," the Aramaic word machar, crastinus, so that the sense would be, "Tomorrow\'s bread give us today." Of unrecorded incidents the most notable is that of the appearance of the Risen Lord to James: "And when the Lord had given His linen cloth to the servant of the priest, He went to James and appeared to him. For James had sworn that he would not eat bread from that hour wherein he had drunk the cup of the Lord until he saw Him rising from the dead. Again a little afterward the Lord says, Bring a table and bread. Immediately it is added: He took bread and blessed and brake, and afterward gave it to James the Just and said to him, My brother, eat thy bread for the Son of Man has risen from them that sleep" (Hieron., De Vir. Illustr., "Jacobus").<P>Jerome also tells that in the Gospel according to the Hebrews, there is the following passage: "Lo, the mother of the Lord and His brethren said unto Him: John the Baptist is baptizing for the remission of sins; let us go and be baptized by him. But He said to them: What sin have I committed that I should go and be baptized by him? Unless perchance this very word which I have spoken is a sin of ignorance" (Hieron., Adv. Pelag., iii.2).<P>7. Conclusion:<P>This Gospel is not to be classed with heretical Gospels like that of Marcion, nor with apocryphal Gospels like that of James or Nicodemus. It differed from the former in that it did not deviate from any essential of catholic truth in its representation of our Lord. It differed from the latter in that it narrated particulars mostly relating to our Lord\'s public ministry, while they occupy themselves with matters of curiosity left unrecorded in the canonical Gospels. It differs from the canonical Gospels only in that it is more florid in style, more diffuse in the relation of incidents, and more inclined to sectional views of doctrine. Its uncanonical sayings and incidents may have come from oral tradition, and they do lend a certain interest and picturesqueness to the narrative. Its language confined it to a very limited sphere, and its sectional character prevented it from ever professing Scriptural authority or attaining to canonical rank.<P>LITERATURE.<P>E.B. Nicholson, The Gospel according to the Hebrews (1879); R. Handmann, Das Hebrder-Evangelium: Texte u. Untersuchungen, Band V (1889); Zahn, GK, II, 642-723 (1890); Harnack, Geschichte der altchristlichen Literatur, I, 6ff; II, 1, 625-51 (1897); Neutestamentliche Apocryphen (Hennecke), I, 11-21 (1904).`<a href="./study/isbe/search.html?string=APOCRYPHAL+GOSPELS">APOCRYPHAL GOSPELS</a>`128';
isbe[4223]='Hebrews, Religion of the``<a href="./study/isbe/search.html?string=ISRAEL,+RELIGION+OF,+1">ISRAEL, RELIGION OF</a>`1';
isbe[4224]='Hebron (1)`he\'-brun (chebhron, "league" or "confederacy"; Chebron): One of the most ancient and important cities in Southern Palestine, now known to the Moslems as el Khalil (i.e. Khalil er Rahman, "the friend of the Merciful," i.e. of God, a favorite name for Abraham; compare <a onClick="return mV(\'Jam\',2,23);">Jas 2:23</a>). The city is some 20 miles south of Jerusalem, situated in an open valley, 3,040 ft. above sea-level.<P>I. History of the City.<P>Hebron is said to have been rounded before Zoan (i.e. Tanis) in Egypt (<a onClick="return mV(\'Num\',13,22);">Nu 13:22</a>); its ancient name was Kiriath-arba, probably meaning the "Four Cities," perhaps because divided at one time into four quarters, but according to Jewish writers so called because four patriarchs, Abraham, Isaac, Jacob and Adam were buried there. According to <a onClick="return mV(\'Jos\',15,13);">Jos 15:13</a> it was so called after Arba, the father of Anak.<P>1. Patriarchal Period:<P>Abram came and dwelt by the oaks of <a href="study/isbe/search.html?string=MAMRE">MAMRE</A> (which see), "which are in Hebron" Genesis (<a onClick="return mV(\'Gen\',13,18);">13:18</a>); from here he went to the rescue of Lot and brought him back after the defeat of Chedorlaomer (<a onClick="return mV(\'Gen\',14,13);">14:13</A>f); here his name was changed to Abraham (<a onClick="return mV(\'Gen\',17,15);">17:5</A>); to this place came the three angels with the promise of a son (<a onClick="return mV(\'Gen\',18,1);">18:1</A>f); Sarah died here (<a onClick="return mV(\'Gen\',23,2);">23:2</a>), and for her sepulcher Abraham bought the cave of Machpelah (<a onClick="return mV(\'Gen\',23,17);">23:17</a>); here Isaac and Jacob spent much of their lives (<a onClick="return mV(\'Gen\',35,27);">35:27</A>; <a onClick="return mV(\'Gen\',37,14);">37:14</a>); from here Jacob sent Joseph to seek his brethren (<a onClick="return mV(\'Gen\',37,14);">37:14</a>), and hence, Jacob and his sons went down to Egypt (<a onClick="return mV(\'Gen\',46,1);">46:1</A>). In the cave of Machpelah all the patriarchs and their wives, except Rachel, were buried (<a onClick="return mV(\'Gen\',49,30);">49:30</a>f; <a onClick="return mV(\'Gen\',50,13);">50:13</a>).<P>2. Times of Joshua and Judges:<P>The spies visited Hebron and near there cut the cluster of grapes (<a onClick="return mV(\'Num\',13,22);">Nu 13:22</a>f). <a href="study/isbe/search.html?string=HOHAM">HOHAM</a> (which see), king of Hebron, was one of the five kings defeated by Joshua at Beth-horon and slain at Makkedah (<a onClick="return mV(\'Jos\',10,3);">Jos 10:3</a>f). Caleb drove out from Hebron the "three sons of Anak" (<a onClick="return mV(\'Jos\',14,12);">Jos 14:12</a>; <a onClick="return mV(\'Jos\',15,14);">15:14</a>); it became one of the cities of Judah (<a onClick="return mV(\'Jos\',15,54);">Jos 15:54</a>), but was set apart for the Kohathite Levites (<a onClick="return mV(\'Jos\',21,10);">Jos 21:10</a>f), and became a city of refuge (<a onClick="return mV(\'Jos\',20,7);">Jos 20:7</a>). One of Samson\'s exploits was the carrying of the gate of Gaza "to the top of the mountain that is before Hebron" (<a onClick="return mV(\'Jdg\',16,3);">Jud 16:3</a>).<P>3. The Days of the Monarchy:<P>David, when a fugitive, received kindness from the people of this city (<a onClick="return mV(\'1Sa\',30,31);">1Sa 30:31</a>); here Abner was treacherously slain by Joab at the gate (<a onClick="return mV(\'2Sa\',3,27);">2Sa 3:27</a>), and the sons of Rimmon, after their hands and feet had been cut off, were hanged "beside the pool" (<a onClick="return mV(\'2Sa\',4,12);">2Sa 4:12</a>). After the death of Saul, David was here anointed king (<a onClick="return mV(\'2Sa\',5,3);">2Sa 5:3</a>) and reigned here 7 1/2 years, until he captured Jerusalem and made that his capital (<a onClick="return mV(\'2Sa\',5,5);">2Sa 5:5</a>); while here, six sons were born to him (<a onClick="return mV(\'2Sa\',3,2);">2Sa 3:2</a>). In this city Absalom found a center for his disaffection, and repairing there under pretense of performing a vow to Yahweh, he raised the standard of revolt (<a onClick="return mV(\'2Sa\',15,7);">2Sa 15:7</a>f). Josephus mistakenly places here the dream of Solomon (Ant., VIII, ii, 1) which occurred at Gibeon (<a onClick="return mV(\'1Ki\',3,4);">1Ki 3:4</a>). Hebron was fortified by Rehoboam (<a onClick="return mV(\'2Ch\',11,10);">2Ch 11:10</a>).<P>4. Later History:<P>Probably during the captivity Hebron came into the hands of Edom, though it appears to have been colonized by returning Jews (<a onClick="return mV(\'Neh\',11,25);">Ne 11:25</a>); it was recovered from Edom by Simon Maccabeus (1Macc 5:65; Josephus, Ant, XII, viii, 6). In the first great revolt against Rome, Simon bar-Gioras captured the city (BJ, IV, ix, 7), but it was retaken, for Vespasian, by his general Cerealis who carried it by storm, slaughtered the inhabitants and burnt it (ibid., 9).<P>During the Muslim period Hebron has retained its importance on account of veneration to the patriarchs, especially Abraham; for the same reason it was respected by the Crusaders who called it Castellum ad Sanctum Abraham. In 1165 it became the see of a Latin bishop, but 20 years later it fell to the victorious arms of Saladin, and it has ever since remained a fanatic Moslem center, although regarded as a holy city, alike by Moslem, Jew and Christian.<P>II. The Ancient Site.<P>Modern Hebron is a straggling town clustered round the Haram or sacred enclosure built above the traditional cave of <a href="study/isbe/search.html?string=MACHPELAH">MACHPELAH</A> (which see); it is this sacred spot which has determined the present position of the town all through the Christian era, but it is quite evident that an exposed and indefensible situation, running along a valley, like this, could not have been that of earlier and less settled times. From many of the pilgrim narratives, we can gather that for long there had been a tradition that the original site was some distance from the modern town, and, as analogy might suggest, upon a hill. There can be little doubt that the site of the Hebron of Old Testament history is a lofty, olive-covered hill, lying to the west of the present town, known as er Rumeidy. Upon its summit are cyclopian walls and other traces of ancient occupation. In the midst are the ruins of a medieval building known as Der el-Arba\'in, the "monastery of the forty" (martyrs) about whom the Hebronites have an interesting folklore tale. In the building are shown the so-called tombs of Jesse and Ruth. Near the foot of the hill are several fine old tombs, while to the north is a large and very ancient Jewish cemetery, the graves of which are each covered with a massive monolith, 5 and 6 ft. long. At the eastern foot of the hill is a perennial spring, \'Ain el Judeideh; the water rises in a vault, roofed by masonry and reached by steps. The environs of this hill are full of folklore associations; the summit would well repay a thorough excavation.<P>A mile or more to the northwest of Hebron is the famous oak of <a href="study/isbe/search.html?string=MAMRE">MAMRE</a> (which see), or "Abraham\'s oak," near which the Russians have erected a hospice. It is a fine specimen of the Holm oak (Quercus coccifera), but is gradually dying. The present site appears to have been pointed out as that of Abraham\'s tent since the 12th century; the earlier traditional site was at Ramet el Khalil.<P>See<a href="study/isbe/search.html?string=MAMRE"> MAMRE</A>.<P>III. Modern Hebron.<P>Modern Hebron is a city of some 20,000 inhabitants, 85 percent of whom are Moslems and the remainder mostly Jews. The city is divided into seven quarters, one of which is known as that of the "glass blowers" and another as that of the "water-skin makers." These industries, with the manufacture of pottery, are the main sources of trade. The most conspicuous building is the Haram (see <a href="study/isbe/search.html?string=MACHPELAH">MACHPELAH</a>). In the town are two large open reservoirs the Birket el Qassasin, the "pool of the glass blowers" and Birket es Sultan, "the pool of the Sultan." This latter, which is the larger, is by tradition the site of the execution of the murderers of Ishbosheth (<a onClick="return mV(\'2Sa\',4,12);">2Sa 4:12</a>). The Moslem inhabitants are noted for their fanatical exclusiveness and conservatism, but this has been greatly modified in recent years through the patient and beneficent work of Dr. Paterson, of the U. F. Ch. of S. Med. Mission. The Jews, who number about 1,500, are mostly confined to a special ghetto; they have four synagogues, two Sephardic and two Ashkenazic; they are a poor and unprogressive community.`<a href="./study/isbe/search.html?string=EBRON">EBRON</a>`117';
isbe[4225]='Hebron (2)`(chebhron, "league," "association"):<P>(1) The third son of Kohath, son of Levi (<a onClick="return mV(\'Exd\',6,18);">Ex 6:18</a>; <a onClick="return mV(\'Num\',3,19,27);">Nu 3:19, 27</a>; <a onClick="return mV(\'1Ch\',6,2,18);">1Ch 6:2, 18</a>; <a onClick="return mV(\'1Ch\',23,12,19);">23:12, 19</a>).<P>(2) A son of Mareshah and descendant of Caleb (<a onClick="return mV(\'1Ch\',2,42,43);">1Ch 2:42-43</a>).`<a href="./study/isbe/search.html?string=KORAH">KORAH</a>`1';
isbe[4226]='Hebronites`he\'-brun-its (chebhroni): A family of Levites, descendants of Hebron, third son of Kohath (<a onClick="return mV(\'Num\',3,27);">Nu 3:27</a>; <a onClick="return mV(\'Num\',26,58);">26:58</a>, etc.)``1';
isbe[4227]='Hedge`hej:<P>(1) mecukhah, "a thorn hedge," only in <a onClick="return mV(\'Mic\',7,4);">Mic 7:4</a>; mesukkah, "a hedge" (<a onClick="return mV(\'Isa\',5,5);">Isa 5:5</a>); mesukhath chadheq, "a hedge of thorns" (<a onClick="return mV(\'Pro\',15,19);">Pr 15:19</a>).<P>(2) gadher, and geherah, translated "hedges" in the Revised Version (British and American) only in <a onClick="return mV(\'Psa\',89,40);">Ps 89:40</a>, elsewhere "fence." <a href="study/isbe/search.html?string=GEDERAH">GEDERAH</a> (which see) in the Revised Version margin is translated "hedges" (<a onClick="return mV(\'1Ch\',4,23);">1Ch 4:23</a>).<P>(3) na\'atsuts, "thorn-hedges" (<a onClick="return mV(\'Isa\',7,19);">Isa 7:19</a>).<P>(4) phragmos, translated "hedge" (<a onClick="return mV(\'Mat\',21,33);">Mt 21:33</a>; <a onClick="return mV(\'Mar\',12,1);">Mr 12:1</a>; <a onClick="return mV(\'Luk\',14,23);">Lu 14:23</a>); "partition" in <a onClick="return mV(\'Eph\',2,14);">Eph 2:14</a>, which is its literal meaning. In the Septuagint it is the usual equivalent of the above Hebrew words.<P>Loose stone walls without mortar are the usual "fences" around fields in Palestine, and this is what gadher and gedherah signify in most passages. Hedges made of cut thorn branches or thorny bushes are very common in the plains and particularly in the Jordan valley.``117';
isbe[4228]='Hedgehog`hej\'-hog Septuagint echinos, "hedgehog," for qippodh, in <a onClick="return mV(\'Isa\',14,23);">Isa 14:23</a>; <a onClick="return mV(\'Isa\',34,11);">34:11</a>; <a onClick="return mV(\'Zep\',2,14);">Ze 2:14</a>, and for qippoz, in <a onClick="return mV(\'Isa\',34,15);">Isa 34:15</a>).`<a href="./study/isbe/search.html?string=PORCUPINE">PORCUPINE</a>; <a href="./study/isbe/search.html?string=BITTERN">BITTERN</a>; <a href="./study/isbe/search.html?string=OWL">OWL</a>; <a href="./study/isbe/search.html?string=SERPENT">SERPENT</a>`1';
isbe[4229]='Heed`hed: This word, in the sense of giving careful attention ("take heed," "give heed," etc.), represents several Hebrew and Greek words; chief among them shamar, "to watch"; blepo, "to look," horao, "to see." As opposed to thoughtlessness, disregard of God\'s words, of the counsels of wisdom, of care for one\'s ways, it is constantly inculcated as a duty of supreme importance in the moral and spiritual life (<a onClick="return mV(\'Deu\',4,9,15,23);">De 4:9, 15, 23</a>; <a onClick="return mV(\'Deu\',27,9);">27:9</a> the King James Version, etc.; <a onClick="return mV(\'Jos\',22,5);">Jos 22:5</a>; <a onClick="return mV(\'Jos\',23,11);">23:11</a>; <a onClick="return mV(\'Psa\',39,1);">Ps 39:1</a>; <a onClick="return mV(\'Mat\',16,6);">Mt 16:6</a>; <a onClick="return mV(\'Mar\',4,24);">Mr 4:24</a>; <a onClick="return mV(\'Mar\',13,33);">13:33</a>; <a onClick="return mV(\'Luk\',12,15);">Lu 12:15</a>; <a onClick="return mV(\'1Cr\',3,10);">1Co 3:10</a>; <a onClick="return mV(\'1Cr\',8,9);">8:9</a>; <a onClick="return mV(\'1Cr\',10,12);">10:12</a>; <a onClick="return mV(\'Col\',4,17);">Col 4:17</a>).``132';
isbe[4230]='Heel`hel (\'aqebh): "The iniquity of my heels" (<a onClick="return mV(\'Psa\',49,5);">Ps 49:5</a> the King James Version) is a literal translation, and might be understood to indicate the Psalmist\'s "false steps," errors or sins, but that meaning is very doubtful here. the Revised Version (British and American) gives "iniquity at my heels." the Revised Version margin gives a still better sense, "When the iniquity of them that would supplant me compasseth me about, even of them that trust in...riches"—treacherous enemies ever on the watch to trip up a man\'s heels (compare <a onClick="return mV(\'Hsa\',12,3);">Ho 12:3</a>). Of Judah it was said, "Thy heels (shall) suffer violence" (<a onClick="return mV(\'Jer\',13,22);">Jer 13:22</a>) through being "made bare" (the King James Version), and thus subject to the roughness of the road as she was led captive.<P>Figurative:<P>(1) Of the partial victory of the evil power over humanity, "Thou shalt bruise (m "lie in wait for") his heel" (<a onClick="return mV(\'Gen\',3,15);">Ge 3:15</a>), through constant, insidious suggestion of the satisfaction of the lower desires. Or if we regard this statement as a part of the Protevangelium, the earliest proclamation of Christ\'s final, and complete victory over sin, the destruction of "the serpent" ("He shall bruise thy head"), then the reference is evidently to Christ\'s sufferings and death, even to all that He endured in His human nature.<P>(2) Of the stealthy tactics of the tribe of Dan in war, "An adder in the path, that biteth the horse\'s heels" (<a onClick="return mV(\'Gen\',49,17);">Ge 49:17</a>), by which it triumphed over foes of superior strength.<P>(3) Of violence and brutality, "Who...hath lifted up his heel against me" (<a onClick="return mV(\'Psa\',41,9);">Ps 41:9</a>; <a onClick="return mV(\'Jhn\',13,18);">Joh 13:18</a>), i.e. lifted up his foot to trample upon me (compare <a onClick="return mV(\'Jos\',10,24);">Jos 10:24</a>).``91';
isbe[4231]='Hegai; Hege`he\'-ga-i, he\'-ge (heghay; Gai (<a onClick="return mV(\'Est\',2,8,15);">Es 2:8, 15</a>), and heghe\', Hege (<a onClick="return mV(\'Est\',2,3);">Es 2:3</a>)): One of the officers of the Persian king Ahasuerus; a chamberlain or eunuch (keeper of women), into whose custody the "fair young virgins" were delivered from whom the king intended to choose his queen in the place of the discredited Vashti.``1';
isbe[4232]='Hegemonides`heg-e-mon\'-i-dez, hej-e-mo-ni\'-dez (Hegemonides): The Syrian officer placed in command of the district extending from Ptolemais to the Gerrenians (2Macc 13:24). It is not easy to see how in the King James Version and even in Swete\'s revised text the word can be taken as a mere appellative along with strategon, the two being rendered "principal officer": one of the two could certainly be omitted (Swete, 3rd ed., 1905, capitalizes Hegemonides). In the Revised Version (British and American) the word is taken as the name of some person otherwise unknown.``1';
isbe[4233]='Heifer`hef\'-er (parah, in <a onClick="return mV(\'Num\',19,\'1-\');">Nu 19</a> (see following article [<a href="./study/isbe/search.html?string=HEIFER,+RED">HEIFER, RED</a>]) and <a onClick="return mV(\'Hsa\',4,16);">Ho 4:16</a>; \'eghlah, elsewhere in the Old Testament; damalis, in <a onClick="return mV(\'Hbr\',9,13);">Heb 9:13</a>):for the "heifer of three years old" in the King James Version, the Revised Version margin of <a onClick="return mV(\'Isa\',15,5);">Isa 15:5</a>; <a onClick="return mV(\'Jer\',48,34);">Jer 48:34</a>, see <a href="study/isbe/search.html?string=EGLATH-SHELISHIYAH">EGLATH-SHELISHIYAH</A>. A young cow (contrast <a href="study/isbe/search.html?string=BULLOCK">BULLOCK</A>). The \'eghlah figures specifically in religious rites only in the ceremony of <a onClick="return mV(\'Deu\',21,\'1-9\');">De 21:1-9</a> for the cleansing of the land, where an unexpiated murder had been committed. This was not a sacrificial rite—the priests are witnesses only, and the animal was slain by breaking the neck—but sacrificial purity was required for the heifer. Indeed, it is commonly supposed that the rite as it now stands is a rededication of one that formerly had been sacrificial. In the sacrifices proper the heifer could be used for a peace offering (<a onClick="return mV(\'Lev\',3,1);">Le 3:1</a>), but was forbidden for the burnt (<a onClick="return mV(\'Lev\',1,3);">Le 1:3</a>) or sin (<a onClick="return mV(\'Lev\',4,3,14);">Le 4:3, 14</a>) offerings. Hence, the sacrifice of <a onClick="return mV(\'1Sa\',16,2);">1Sa 16:2</a> was a peace offering. In <a onClick="return mV(\'Gen\',15,9);">Ge 15:9</a> the ceremony of the ratification of the covenant by God makes use of a heifer and a she-goat, but the reason for the use of the females is altogether obscure. Compare following article [<a href="./study/isbe/search.html?string=HEIFER,+RED">HEIFER, RED</a>].<P>Figuratively: The heifer appears as representing sleekness combined with helplessness in <a onClick="return mV(\'Jer\',46,20);">Jer 46:20</a> (compare the comparison of the soldiers to \'stalled calves\' in the next verse). In <a onClick="return mV(\'Jer\',50,11);">Jer 50:11</a>; <a onClick="return mV(\'Hsa\',10,11);">Ho 10:11</a>, the heifer is pictured as engaged in threshing. This was particularly light work, coupled with unusually abundant food (<a onClick="return mV(\'Deu\',25,4);">De 25:4</a>), so that the threshing heifer served especially well for a picture of contentment. ("Wanton" in <a onClick="return mV(\'Jer\',50,11);">Jer 50:11</a>, however, is an unfortunate translation in the Revised Version (British and American).) Hosea, in contrast, predicts that the "heifers" shall be set to the hard work of plowing and breaking the sods. In <a onClick="return mV(\'Jdg\',14,18);">Jud 14:18</a>, Samson uses "heifer" in his riddle to refer to his wife. This, however, was not meant to convey the impression of licentiousness that it gives the modern reader.``48';
isbe[4234]='Heifer, Red`In <a onClick="return mV(\'Num\',19,\'1-\');">Nu 19</a> a rite is described in which the ashes of a "red heifer" and of certain objects are mixed with running water to obtain the so-called "water for impurity." (Such is the correct translation of the American Standard Revised Version in <a onClick="return mV(\'Num\',19,9,13,20,21);">Nu 19:9, 13, 20-21</a>; <a onClick="return mV(\'Num\',31,23);">31:23</a>. In these passages, the King James Version and the English Revised Version, through a misunderstanding of a rather difficult Hebrew term, have "water of separation"; Septuagint and the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) have, "water of sprinkling." the English Revised Version margin, "water of impurity," is right, but ambiguous.) This water was employed in the removal of the uncleanness of a person or thing that had been in contact with a dead body, and also in removing ritual defilement from booty taken in war.<P>1. Origin and Significance of the Rite:<P>The general origin of the rite is clear enough, as is the fact that this origin lies back of the official sacrificial system of Israel. For the removal of impurity, ritual as well as physical, water, preferably running water (<a onClick="return mV(\'Num\',19,17);">Nu 19:17</a>; compare <a onClick="return mV(\'Lev\',14,5);">Le 14:5</a>ff; <a onClick="return mV(\'Lev\',15,13);">Le 15:13</a>), is the natural means, and is employed universally. But where the impurity was unusually great, mere water was not felt to be adequate, and various substances were mixed with it in order to increase its efficacy. So (among other things) blood is used in <a onClick="return mV(\'Lev\',14,6,7);">Le 14:6-7</a>, and dust in <a onClick="return mV(\'Num\',5,17);">Nu 5:17</a> (see <a href="study/isbe/search.html?string=WATER+OF+BITTERNESS">WATER OF BITTERNESS</a>). The use, however, of ashes in <a onClick="return mV(\'Num\',19,17);">Nu 19:17</a> is unique in the Old Testament, although parallels from elsewhere can be adduced. So e.g. in Ovid Fasti, iv.639-40, 725, 733, in the last of these references, "The blood of a horse shall be a purification, and the ashes of calves," is remarkably close to the Old Testament. The ashes were obtained by burning the heifer completely, "her skin, and her flesh, and her blood, with her dung" (the contents of the entrails) (<a onClick="return mV(\'Num\',19,5);">Nu 19:5</a>; compare <a onClick="return mV(\'Exd\',29,14);">Ex 29:14</a>). Here only in the Old Testament is blood burned for a ceremonial purpose, and here only is burning a preliminary; elsewhere it is either a chief act or serves to consume the remnants of a finished sacrifice—<a onClick="return mV(\'Lev\',4,12);">Le 4:12</a> and <a onClick="return mV(\'Num\',19,3);">Nu 19:3</a> are altogether different.<P>The heifer is a female. For the regular sin offering for the congregation, only the male was permitted (<a onClick="return mV(\'Lev\',4,14);">Le 4:14</a>), but the female was used in the purificatory ceremony of <a onClick="return mV(\'Deu\',21,3);">De 21:3</a> (a rite that has several points of similarity to that of <a onClick="return mV(\'Num\',19,\'1-\');">Nu 19</a>). An individual sin offering by one of the common people, however, required a female (<a onClick="return mV(\'Lev\',4,28);">Le 4:28</a>), but probably only in order to give greater prominence to the more solemn sacrifices for which the male was reserved. A female is required again in the cases enumerated in <a onClick="return mV(\'Lev\',5,\'1-6\');">Le 5:1-6</a>, most of which are ritual defilements needing purification; a female was required at the purification of a leper (in addition to two males, <a onClick="return mV(\'Lev\',14,10);">Le 14:10</a>), and a female, with one male, was offered when a Nazirite terminated his vows (<a onClick="return mV(\'Num\',6,14);">Nu 6:14</a>). Some connection between purification and the sacrifice of a female may be established by this list, for even in the case of th
