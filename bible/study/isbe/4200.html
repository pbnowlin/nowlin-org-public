e Nazirite the idea may be removal of the state of consecration. But the reason for such a connection is anything but obvious, and the various explanations that have been offered are hardly more than guesses. The most likely is that purificatory rites originated in a very primitive stage when the female was thought to be the more sacred animal on account of its greater usefulness. Of the other requirements for the heifer she must be "red," i.e. reddish brown (<a onClick="return mV(\'Num\',19,2);">Nu 19:2</a>). Likeness in color to blood is at first sight the most natural explanation, but likeness in color to ripe grain is almost equally plausible. It may be noted that certain Egyptian sacrifices also required red cattle as victims (Plutarch, De Isid. 31). The heifer is to be "without spot" ("faultless"), "wherein is no blemish," the ordinary requirement for sacrifices. (The Jewish exegetes misread this "perfectly red, wherein is no blemish," with extraordinary results; see below.) But an advance on sacrificial requirements is that she shall be one "upon which never came yoke." This requirement is found elsewhere only in <a onClick="return mV(\'Deu\',21,3);">De 21:3</a> and in <a onClick="return mV(\'1Sa\',6,7);">1Sa 6:7</a> (that the animals in this last case were finally sacrificed is, however, not in point). But in other religions this requirement was very common (compare Iliad x.293; Vergil, Georg. iv.550-51; Ovid, Fasti iv.336).<P>2. Use of Cedar and Hyssop:<P>While the heifer was being burned, "cedar-wood, and hyssop, and scarlet" (i.e. scarlet wool or thread) were cast into the flames. The same combination of objects (although differently employed) is found at the cleansing of a leper (<a onClick="return mV(\'Lev\',14,4);">Le 14:4</a>), but their meaning is entirely unknown. The explanations offered are almost countless. It is quite clear that hyssop was especially prized in purifications (<a onClick="return mV(\'Psa\',51,7);">Ps 51:7</a>), but the use of hyssop as a sprinkler and the use of ashes of hyssop may be quite unrelated. Hyssop and cedar were supposed to have medicinal properties (see <a href="study/isbe/search.html?string=CEDAR">CEDAR</A>; <a href="study/isbe/search.html?string=HYSSOP">HYSSOP</A>). Or the point may be the use of aromatic woods. For a mixture of cedar and other substances in water as a purificatory medium compare Fossey, Magie Assyrienne, 285. The scarlet wool offers still greater difficulties, apart from the color, but it may be noted that scarlet wool plays a part in some of the Babylonian conjurations (Assyrian Bibl., XII, 31). But, obviously, none of this leads very far and it may all be in the wrong direction. All that can be said definitely is that <a onClick="return mV(\'Lev\',14,4);">Le 14:4</a> and <a onClick="return mV(\'Num\',19,6);">Nu 19:6</a> show that the combination of objects was deemed to have a high purificatory value.<P>3. Application and Sacredness of the Ashes:<P>The ashes, when obtained, were used in removing the greatest of impurities. Consequently, they themselves were deemed to have an extraordinarily "consecrated" character, and they were not to be handled carelessly. Their consecration extended to the rite by which they were produced, so that every person engaged in it was rendered unclean (<a onClick="return mV(\'Num\',19,7,8,10);">Nu 19:7-8, 10</a>), an excellent example of how in primitive religious thought the ideas of "holiness" and "uncleanness" blend. It was necessary to perform the whole ceremony "without the camp" (<a onClick="return mV(\'Num\',19,3);">Nu 19:3</a>), and the ashes, when prepared, were also kept without the camp (<a onClick="return mV(\'Num\',19,9);">Nu 19:9</a>), probably in order to guard against their touch defiling anyone (as well as to keep them from being defiled). When used they were mixed with running water, and the mixture was sprinkled with hyssop on the person or object to be cleansed (<a onClick="return mV(\'Num\',19,\'17-19\');">Nu 19:17-19</a>). The same water was used to purify booty (<a onClick="return mV(\'Num\',31,23);">Nu 31:23</a>), and it may also be meant by the "water of expiation" in <a onClick="return mV(\'Num\',8,7);">Nu 8:7</a>.<P>4. Of Non-Priestly and Non-Israelitish Origin:<P>In addition to the similarities already pointed out between <a onClick="return mV(\'Num\',19,\'1-\');">Nu 19</a> and <a onClick="return mV(\'Deu\',21,\'1-9\');">De 21:1-9</a>, the rites resemble each other also in the fact that, in both, laymen are the chief functionaries and that the priests have little to do (in <a onClick="return mV(\'Deu\',21,\'1-9\');">De 21:1-9</a> they are mere passive witnesses). This suggests a non-priestly origin. The title "sin-offering" in <a onClick="return mV(\'Num\',19,9,17);">Nu 19:9, 17</a> (unless used in a unique sense) points to an original sacrificial meaning, although in <a onClick="return mV(\'Num\',19,\'1-\');">Nu 19</a> the heifer is carefully kept away from the altar. Again, the correspondences with rites in other religions indicate a non-Israelitish origin. Such a ceremony may well have passed among the Israelites and have become prized by them. It contained nothing objectionable and seemed to have much of deep worth, and a few slight additions—chiefly the sprinkling (<a onClick="return mV(\'Num\',19,4);">Nu 19:4</a>; compare <a onClick="return mV(\'Lev\',4,6,17);">Le 4:6, 17</a>)—made it fit for adoption into the highest system. Some older features may have been eliminated also, but as to this, of course, there is no information. But, in any case, the ceremony is formed of separate rites that are exceedingly old and that are found in a great diversity of religions so that any elaborate symbolic interpretation of the details would seem to be without justification. The same result can be reached by comparing the countless symbolic interpretations that have been attempted in the past, for they differ hopelessly. As a matter of fact, the immense advance that has been gained in the understanding of the meaning of the Old Testament rites through the comparative study of religions has shown the futility of much that has been written on symbolism. That a certain rite is widely practiced may merely mean that it rests on a true instinct. To be sure, the symbolism of the future will be written on broader lines and will be less pretentious in its claims, but for these very reasons it will rest on a more solid basis. At present, however, the chief task is the collection of material and its correct historical interpretation.<P>5. Obscurity of Later History:<P>The later history of the rite is altogether obscure. As no provision was made in <a onClick="return mV(\'Num\',19,\'1-\');">Nu 19</a> for sending the ashes to different points, the purification could have been practiced only by those living near the sanctuary. Rabbinical casuistry still further complicated matters by providing that two black or white hairs from the same follicle would disqualify the heifer (see above), and that one on whom even a cloth had been laid could not be used. In consequence, it became virtually or altogether impossible to secure a proper animal, and the Mishnic statement that only nine had ever been found (Parah, iii.5) probably means that the rite had been obsolete long before New Testament times. Still, the existence of the tractate, Parah, and the mention in <a onClick="return mV(\'Hbr\',9,13);">Heb 9:13</a> show that the provisions were well remembered.<P>LITERATURE.<P>Baentsch (1903), Holzinger (1903), and (especially) Grey (1903) on Numbers; Kennedy in HDB; Edersheim, Temple and Ministry, chapter xviii (rabbinic traditions. Edersheim gives the best of the "typological" explanations).`<a href="./study/isbe/search.html?string=SACRIFICE">SACRIFICE</a>`48';
isbe[4235]='Height; Heights`hit, The English terms represent a large number of Hebrew words (gobhah, marom, qomah, rum, etc.). A chief thing to notice is that in the Revised Version (British and American) "height" and "heights" are frequently substituted for other words in the King James Version, as "coast" (<a onClick="return mV(\'Jos\',12,23);">Jos 12:23</a>), "region" (<a onClick="return mV(\'1Ki\',4,11);">1Ki 4:11</a>), "borders" (<a onClick="return mV(\'Jos\',11,2);">Jos 11:2</a>), "countries" (<a onClick="return mV(\'Jos\',17,11);">Jos 17:11</a>), "strength" (<a onClick="return mV(\'Psa\',95,4);">Ps 95:4</a>), "high places" (<a onClick="return mV(\'Isa\',41,18);">Isa 41:18</a>; <a onClick="return mV(\'Jer\',3,2,21);">Jer 3:2, 21</a>; <a onClick="return mV(\'Jer\',7,29);">7:29</a>; <a onClick="return mV(\'Jer\',12,12);">12:12</a>; <a onClick="return mV(\'Jer\',14,6);">14:6</a>), "high palaces" (<a onClick="return mV(\'Psa\',78,69);">Ps 78:69</a>). On the other hand, for "height" in the King James Version, the Revised Version (British and American) has "stature" (<a onClick="return mV(\'Eze\',31,5,10);">Eze 31:5, 10</a>), "raised basement" (<a onClick="return mV(\'Eze\',41,8);">Eze 41:8</a>), etc. In the New Testament we have hupsoma, prop. of space (<a onClick="return mV(\'Rom\',8,39);">Ro 8:39</a>), and hupsos of measure (<a onClick="return mV(\'Eph\',3,18);">Eph 3:18</a>; <a onClick="return mV(\'Rev\',21,16);">Re 21:16</a>).``132';
isbe[4236]='Heir`ar:<P>1. The Word "Heir":<P>In the New Testament "heir" is the invariable translation of kleronomos (15 times), the technical equivalent in Greek, and of the compound sunkleronomos, "co-heir," in <a onClick="return mV(\'Rom\',8,17);">Ro 8:17</a>; <a onClick="return mV(\'Eph\',3,6);">Eph 3:6</a>; <a onClick="return mV(\'Hbr\',11,9);">Heb 11:9</a>; <a onClick="return mV(\'1Pe\',3,7);">1Pe 3:7</a> (in <a onClick="return mV(\'Gal\',4,30);">Ga 4:30</a>; <a onClick="return mV(\'Hbr\',1,14);">Heb 1:14</a>, contrast the King James Version and the Revised Version (British and American)). In the Old Testament "heir" and "to be heir" both represent some form of the common verb yarash, "possess," and the particular rendition of the verb as "to be heir" is given only by the context (compare e.g. the King James Version and the Revised Version (British and American) in <a onClick="return mV(\'Jer\',49,2);">Jer 49:2</a>; <a onClick="return mV(\'Mic\',1,15);">Mic 1:15</a>). Exactly the same is true of the words translated "inherit," "inheritance," which in by far the great majority of cases would have been represented better by "possess," "possession" (see <a href="study/isbe/search.html?string=INHERITANCE">INHERITANCE</a> and OHL on ...). Consequently, when God is said, for instance, to have given Palestine to Israel as an \'inheritance\' (<a onClick="return mV(\'Lev\',20,24);">Le 20:24</a>, etc.), nothing more need be meant than \'given as a possession.\' The Septuagint, however, for the sake of variety in its rendition of Hebrew words, used kleronomeo in many such cases (especially <a onClick="return mV(\'Gen\',15,7,8);">Ge 15:7-8</a>; <a onClick="return mV(\'Gen\',22,17);">22:17</a>), and thereby fixed on \'heir\' the sense of \'recipient of a gift from God.\' And so the word passed in this sense into New Testament Greek—<a onClick="return mV(\'Rom\',4,13,14);">Ro 4:13-14</a>; <a onClick="return mV(\'Gal\',3,29);">Ga 3:29</a>; <a onClick="return mV(\'Tts\',3,7);">Tit 3:7</a>; <a onClick="return mV(\'Hbr\',6,17);">Heb 6:17</a>; <a onClick="return mV(\'Hbr\',11,7);">11:7</a>; <a onClick="return mV(\'Jam\',2,5);">Jas 2:5</a>; compare <a onClick="return mV(\'Eph\',3,6);">Eph 3:6</a>; <a onClick="return mV(\'Hbr\',11,9);">Heb 11:9</a>; <a onClick="return mV(\'1Pe\',3,7);">1Pe 3:7</a>. On the other hand, the literal meaning of the word is found in <a onClick="return mV(\'Mar\',12,7);">Mr 12:7</a> (and parallels and <a onClick="return mV(\'Gal\',4,1);">Ga 4:1</a>—in the latter case being suggested by the transferred meaning in <a onClick="return mV(\'Gal\',3,29);">3:29</A>—while in <a onClick="return mV(\'Rom\',8,17);">Ro 8:17</a>; <a onClick="return mV(\'Gal\',4,7);">Ga 4:7</a>, the literal and transferred meanings are blended. This blending has produced the phrase "heirs of God," which, literally, is meaningless and which doubtless was formed without much deliberation, although it is perfectly clear. A similar blending has applied "heir" to Christ in <a onClick="return mV(\'Hbr\',1,2);">Heb 1:2</a> (compare <a onClick="return mV(\'Rom\',8,17);">Ro 8:17</a> and perhaps <a onClick="return mV(\'Mar\',12,7);">Mr 12:7</a>) as the recipient of all things in their totality. But apart from these "blended" passages, it would be a mistake to think that sonship is always consciously thought of where "heir" is mentioned, and hence, too much theological implication should not be assigned the latter word.<P>2. Heir in Old Testament Law:<P>The heirs of property in the Old Testament were normally the sons and, chief among these, the firstborn.<P>(1) <a onClick="return mV(\'Deu\',21,\'15-17\');">De 21:15-17</a> provides that the firstborn shall inherit a "double portion," whence it would appear that all the other sons shared equally. (It should be noted that in this law the firstborn is the eldest son of the father, not of the mother as in <a onClick="return mV(\'Exd\',13,2);">Ex 13:2</a>.) Uncertain, however, is what <a onClick="return mV(\'Deu\',21,\'15-17\');">De 21:15-17</a> means by "wife," and the practice must have varied. In <a onClick="return mV(\'Gen\',21,10);">Ge 21:10</a> the son of the handmaid was not to be heir with Isaac, but in <a onClick="return mV(\'Gen\',30,\'1-13\');">Ge 30:1-13</a> the sons of Bilhah and Zilpah are reckoned as legitimate children of Jacob. See <a href="study/isbe/search.html?string=MARRIAGE">MARRIAGE</A>. Nor is it clear that <a onClick="return mV(\'Deu\',21,\'15-17\');">De 21:15-17</a> forbids setting aside the eldest son because of his own sin—compare the case of Reuben (<a onClick="return mV(\'Gen\',49,3,4);">Ge 49:3-4</a>; <a onClick="return mV(\'1Ch\',5,1);">1Ch 5:1</a>), although the son of a regular wife (<a onClick="return mV(\'Gen\',29,32);">Ge 29:32</a>). The very existence of <a onClick="return mV(\'Deu\',21,\'15-17\');">De 21:15-17</a>, moreover, shows that in spite of the absence of formal wills, a man could control to some extent the disposition of his property after his death and that the right of the firstborn could be set aside by the father (<a onClick="return mV(\'1Ch\',26,10);">1Ch 26:10</a>). That the royal dignity went by primogeniture is asserted only (in a particular case) in <a onClick="return mV(\'2Ch\',21,3);">2Ch 21:3</a>, and both David (<a onClick="return mV(\'1Ki\',1,\'11-13\');">1Ki 1:11-13</a>) and Rehoboam (<a onClick="return mV(\'2Ch\',11,\'21-23\');">2Ch 11:21-23</a>) chose younger sons as their successors. A single payment in the father\'s lifetime could be given in lieu of heritage (<a onClick="return mV(\'Gen\',25,6);">Ge 25:6</a>; <a onClick="return mV(\'Luk\',15,12);">Lu 15:12</a>), and it was possible for two brothers to make a bargain as to the disposition of the property after the father\'s death (<a onClick="return mV(\'Gen\',25,\'31-34\');">Ge 25:31-34</a>).<P>(2) When there were sons alive, the daughters had no right of inheritance, and married daughters had no such right in any case. (<a onClick="return mV(\'Job\',42,15);">Job 42:15</a> describes an altogether exceptional procedure.) Probably unmarried daughters passed under the charge of the firstborn, as the new head of the family, and he took the responsibility of finding them husbands. <a onClick="return mV(\'Num\',27,\'1-11\');">Nu 27:1-11</a>; <a onClick="return mV(\'Num\',36,\'1-12\');">36:1-12</a> treat of the case where there were no sons—the daughters inherited the estate, but they could marry only within the tribe, lest the tribal possessions be confused. This right of the daughters, however, is definitely stated to be a new thing, and in earlier times the property probably passed to the nearest male relatives, to whom it went in later times if there were no daughters. In extreme cases, where no other heirs could be found, the property went to the slaves (<a onClick="return mV(\'Gen\',15,3);">Ge 15:3</a>; <a onClick="return mV(\'Pro\',30,23);">Pr 30:23</a>, noting that the meaning of the latter verse is uncertain), but this could have happened only at the rarest intervals. A curious instance is that of <a onClick="return mV(\'1Ch\',2,34,35);">1Ch 2:34-35</a>, where property is preserved in the family by marrying the daughter to an Egyptian slave belonging to the father; perhaps some adoption-idea underlies this.<P>(3) The wife had no claim on the inheritance, though the disposition made of her dowry is not explained, and it may have been returned to her. If she was childless she resorted to the Levirate marriage (<a onClick="return mV(\'Deu\',25,\'5-10\');">De 25:5-10</a>). If this was impracticable or was without issue she returned to her own family and might marry another husband (<a onClick="return mV(\'Gen\',38,11);">Ge 38:11</a>; <a onClick="return mV(\'Lev\',22,13);">Le 22:13</a>; <a onClick="return mV(\'Rth\',1,8);">Ru 1:8</a>). The inferior wives (concubines) were part of the estate and went to the heir; indeed, possession of the father\'s concubines was proof of possession of his dignities (<a onClick="return mV(\'2Sa\',16,21,22);">2Sa 16:21-22</a>; <a onClick="return mV(\'1Ki\',2,\'13-25\');">1Ki 2:13-25</a>). At least, such was the custom in the time of David and Solomon, but at a later period nothing is heard of the practice.<P>(4) The disposition of land is a very obscure question. <a onClick="return mV(\'Num\',36,4);">Nu 36:4</a> states explicitly that each heir had a share, but the continual splitting up of an estate through successive generations would have produced an impossible state of affairs. Possibly the land went to the eldest born as part of his portion, possibly in some cases it was held in common by the members of the family, possibly some member bought the shares of the others, possibly the practice differed at different times. But our ignorance of the facts is complete.<P>NOTE.—The dates assigned by different scholars to the passages cited have an important bearing on the discussion.``48';
isbe[4237]='Helah`he\'-la (chel\'ah): A wife of Ashhur, father of Tekoa (<a onClick="return mV(\'1Ch\',4,5,7);">1Ch 4:5, 7</a>).``1';
isbe[4238]='Helam`he\'-lam (chelam, <a onClick="return mV(\'2Sa\',10,16);">2Sa 10:16</a>f; in <a onClick="return mV(\'2Sa\',16,17);">16:17</A> with the he of locale; Septuagint Hailam): A place near which David is said to have defeated the Aramean world under Hadarezer (<a onClick="return mV(\'2Sa\',10,16);">2Sa 10:16</a>). Its site is unknown. Cornill and others introduce it into the text of <a onClick="return mV(\'Eze\',47,16);">Eze 47:16</a> from the Septuagint Heliam). This would place it between the territories of Damascus and Hamath, which is not unreasonable. Some scholars identify it with Aleppo, which seems too far north.``1';
isbe[4239]='Helbah`hel\'-ba (chelbah): A place in the territory assigned to Asher (<a onClick="return mV(\'Jdg\',1,31);">Jud 1:31</A>). It may be identical with Mahalliba of Sennacherib\'s prism inscription. The site, however, has not been recovered.``1';
isbe[4240]='Helbon`hel\'-bon (chelbon; Chelbon, Chebron): A district from which Tyre received supplies of wine through the Damascus market (<a onClick="return mV(\'Eze\',27,18);">Eze 27:18</a>); universally admitted to be the modern Halbun, a village at the head of a fruitful valley of the same name among the chalk slopes on the eastern side of Anti-Lebanon, 13 miles north-northwest of Damascus, where traces of ancient vineyard terracing still exist. Records contemporary with Ezekiel mention mat helbunim or the land of Helbon, whence Nebuchadnezzar received wine for sacrificial purposes (Belinno Cylinder, I, 23), while karan hulbunu, or Helbonian wine, is named in Western Asiatic Inscriptions, II, 44. Strabo (xv.735) also tells that the kings of Persia esteemed it highly. The district is still famous for its grapes—the best in the country—but these are mostly made into raisins, since the population is now Moslem. Helbon must not be confounded with Chalybon (Ptol. v.15, 17), the Greek-Roman province of Haleb or Aleppo.``23';
isbe[4241]='Helchiah`hel-ki\'-a.`<a href="./study/isbe/search.html?string=HELKIAS">HELKIAS</a>`1';
isbe[4242]='Heldai`hel\'-da-i (chelday):<P>(1) A captain of the temple-service, appointed for the 12th month (<a onClick="return mV(\'1Ch\',27,15);">1Ch 27:15</a>). Same as Heled (cheledh) in parallel list (compare <a onClick="return mV(\'1Ch\',11,30);">1Ch 11:30</a>), and is probably also to be identified with Heleb, son of Baanah the Metophathite, one of David\'s heroic leaders (<a onClick="return mV(\'2Sa\',23,29);">2Sa 23:29</a>).<P>(2) One of a company of Jews who brought gifts of gold and silver from Babylon to assist the exiles under Zerubbabel (<a onClick="return mV(\'Zec\',6,10);">Zec 6:10</a>).``1';
isbe[4243]='Heleb`he\'-leb chelebh, (<a onClick="return mV(\'2Sa\',23,29);">2Sa 23:29</a>).`<a href="./study/isbe/search.html?string=HELDAI">HELDAI</a>`1';
isbe[4244]='Heled`he\'-led (cheledh, <a onClick="return mV(\'1Ch\',11,30);">1Ch 11:30</a>).`<a href="./study/isbe/search.html?string=HELDAI">HELDAI</a>`1';
isbe[4245]='Helek`he\'-lek chelekh): Son of Gilead the Manassite (<a onClick="return mV(\'Num\',26,30);">Nu 26:30</a>; <a onClick="return mV(\'Jos\',17,2);">Jos 17:2</a>). Patronymic, Helekites (<a onClick="return mV(\'Num\',26,30);">Nu 26:30</a>).``1';
isbe[4246]='Helem`he\'-lem:<P>(1) helem; Septuagint Codex Vaticanus, Balaam, omitting "son," Codex Alexandrinus, huios Elam, "son of Elam" (<a onClick="return mV(\'1Ch\',7,35);">1Ch 7:35</a>). A great-grandson of Asher, called Hotham in <a onClick="return mV(\'1Ch\',7,32);">1Ch 7:32</a>. The form "Elam" appears as the name of a Levite in 1Esdras 8:33.<P>(2) chelem, "strength," regarded by Septuagint as a common noun (<a onClick="return mV(\'Zec\',6,14);">Zec 6:14</a>). One of the ambassadors from the Jews of the exile to Jerusalem; probably the person called Heldai in <a onClick="return mV(\'Zec\',6,10);">Zec 6:10</a> is meant.``1';
isbe[4247]='Heleph`he\'-lef (cheleph): A place on the southern border of Naphtali (<a onClick="return mV(\'Jos\',19,33);">Jos 19:33</a>); unidentified.``1';
isbe[4248]='Helez`he\'-lez (chelets "vigor"; Septuagint Selles, Chelles):<P>(1) <a onClick="return mV(\'2Sa\',23,26);">2Sa 23:26</a>; <a onClick="return mV(\'1Ch\',11,27);">1Ch 11:27</a>; <a onClick="return mV(\'1Ch\',27,10);">27:10</a>. One of David\'s mighty men; according to <a onClick="return mV(\'1Ch\',27,10);">1Ch 27:10</a>, he belonged to the sons of Ephraim and was at the head of the 7th course in David\'s organization of the kingdom.<P>(2) Septuagint Chelles, <a onClick="return mV(\'1Ch\',2,39);">1Ch 2:39</a>. A man of Judah of the clan of the Jerahmeelites.``1';
isbe[4249]='Heli`he\'-li (Helei for \'eli):<P>(1) The father of Joseph, the husband of Mary, in Luke\'s account of the genealogy of Jesus (<a onClick="return mV(\'Luk\',3,23);">Lu 3:23</a>).<P>(2) An ancestor of Ezra (2Esdras 1:2).``1';
isbe[4250]='Heliodorus`he-li-o-do\'-rus (Heliodoros): Treasurer of the Syrian king Seleucus IV, Philopator (187-175 BC), the immediate predecessor of Antiochus Epiphanes who carried out to its utmost extremity the Hellenizing policy begun by Seleucus and the "sons of Tobias." Greatly in want of money to pay the tribute due to the Romans as one of the results of the victory of Scipio over Antiochus the Great at Magnesia (190 BC), Seleucus learned from Apollonius, governor of Coele-Syria (Pal) and Phoenicia, of the wealth which was reported to be stored up in the Temple at Jerusalem and commissioned Heliodorus. (2Macc 3) to plunder the temple and to bring its contents to him. On the wealth collected in the Temple at this time, Josephus (Ant., IV, vii, 2) may be consulted. The Temple seems to have served the purposes of a bank in which the private deposits of widows and orphans were kept for greater security, and in 2Macc 3:15-21 is narrated the panic at Jerusalem which took place when Heliodorus came with an armed guard to seize the contents of the Temple (see Stanley, Lectures on the History of the Jewish Church, III, 287). In spite of the protest of Onias, the high priest, Heliodorus. was proceeding to carry out his commission when, "through the Lord of Spirits and the Prince of all power," a great apparition appeared which caused him to fall down "compassed with great darkness" and speechless. When "quite at the last gasp" he was by the intercession of Onias restored to life and strength and "testified to all men the works of the great God which he had beheld with his eyes." The narrative given in 2Macc 3 is not mentioned by any other historian, though 4Macc refers to the plundering of the Temple and assigns the deed to Apollonius. Raffaelle used the incident in depicting, on the walls of the Vatican, the triumph of Pope Julius II over the enemies of the Pontificate.``79';
isbe[4251]='Heliopolis`he-li-op\'-o-lis.`<a href="./study/isbe/search.html?string=ON">ON</a>`1';
isbe[4252]='Helkai`hel\'-ka-i, hel\'-ki, hel-ka\'-i (chelqay, perhaps an abbreviation for Helkiah, "Yah is my portion." Not in the Septuagint\'s Codex Vaticanus; Codex L: Chelkias (<a onClick="return mV(\'Neh\',12,15);">Ne 12:15</a>)): The head of a priestly house in the days of Joiakim.``1';
isbe[4253]='Helkath`hel\'-kath (chelqath (<a onClick="return mV(\'Jos\',19,25);">Jos 19:25</a>); chelqath (<a onClick="return mV(\'Jos\',21,31);">Jos 21:31</a>); by a scribal error chuqoq (<a onClick="return mV(\'1Ch\',6,75);">1Ch 6:75</a>)): A town or district on the border of Asher, assigned to the Levites; unidentified.``1';
isbe[4254]='Helkath-Hazzurim`hel\'-kath-haz\'-u-rim, -ha-zu\'-rim (chelqath ha-tsurim; Meris ton epiboulon): The name as it stands means "field of the sword edges," and is applied to the scene of the conflict in which twelve champions each from the army of Joab and that of Abner perished together, each slaying his fellow (<a onClick="return mV(\'2Sa\',2,16);">2Sa 2:16</a>). Some, following Septuagint, would read chelqath ha-tsodhim, "field of the crafty," i.e. "of the ambush." Thenius suggested chelqath ha-tsarim, "field of the adversaries" (see also H. P. Smith, ICC, "Samuel," 271). Probably, however, the text as it stands is correct.``54';
isbe[4255]='Helkias`hel-ki\'-as (chilqiyah; Chelkias; the King James Version Chelcias):<P>(1) Father of Susanna (Susanna verses 2,29,63). According to tradition he was brother of Jeremiah, and he is identified with the priest who found the Book of the Law in the time of Josiah (<a onClick="return mV(\'2Ki\',22,8);">2Ki 22:8</a>).<P>(2) Ancestor of Baruch (Baruch 1:1).<P>(3) Father of Joiakim the high priest (Baruch 1:7). The name represents <a href="study/isbe/search.html?string=HILKIAH">HILKIAH</a> (which see).``1';
isbe[4256]='Hell`hel (see <a href="study/isbe/search.html?string=SHEOL">SHEOL</a>; <a href="study/isbe/search.html?string=HADES">HADES</a>; <a href="study/isbe/search.html?string=GEHENNA">GEHENNA</a>):<P>1. The Word in the King James Version:<P>The English word, from a Teutonic root meaning "to hide" or "cover," had originally the significance of the world of the dead generally, and in this sense is used by Chaucer, Spenser, etc., and in the Creed ("He descended into hell"); compare the English Revised Version Preface. Now the word has come to mean almost exclusively the place of punishment of the lost or finally impenitent; the place of torment of the wicked. In the King James Version of the Scriptures, it is the rendering adopted in many places in the Old Testament for the Hebrew word she\'ol (in 31 out of 65 occurrences of that word it is so translated), and in all places, save one (<a onClick="return mV(\'1Cr\',15,55);">1Co 15:55</a>) in the New Testament, for the Greek word Hades (this word occurs 11 times; in 10 of these it is translated "hell"; <a onClick="return mV(\'1Cr\',15,55);">1Co 15:55</a> reads "grave," with "hell" in the margin). In these cases the word has its older general meaning, though in <a onClick="return mV(\'Luk\',16,23);">Lu 16:23</a> (parable of Rich Man and Lazarus) it is specially connected with a place of "torment," in contrast with the "Abraham\'s bosom" to which Lazarus is taken (<a onClick="return mV(\'Luk\',16,22);">16:22</A>).<p>2. The Word in the Revised Version:<P>In the above cases the Revised Version (British and American) has introduced changes, replacing "hell" by "Sheol" in the passages in the Old Testament (the English Revised Version retains "hell" in <a onClick="return mV(\'Isa\',14,9,15);">Isa 14:9, 15</a>; the American Standard Revised Version makes no exception), and by "Hades" in the passages in the New Testament (see under these words).<P>3. Gehenna:<P>Besides the above uses, and more in accordance with the modern meaning, the word "hell" is used in the New Testament in the King James Version as the equivalent of Gehenna (12 times; <a onClick="return mV(\'Mat\',5,22,29);">Mt 5:22, 29</a>; <a onClick="return mV(\'Mat\',10,28);">10:28</a>, etc.). the Revised Version (British and American) in these cases puts "Gehenna" in the margin. Originally the Valley of Hinnom, near Jerusalem, Gehenna became among the Jews the synonym for the place of torment in the future life (the "Gehenna of fire," <a onClick="return mV(\'Mat\',5,22);">Mt 5:22</a>, etc.; see <a href="study/isbe/search.html?string=GEHENNA">GEHENNA</A>).<P>4. Tartarus:<P>In yet one other passage in the New Testament (<a onClick="return mV(\'2Pe\',2,4);">2Pe 2:4</a>), "to cast down to hell" is used (the King James Version and the Revised Version (British and American)) to represent the Greek tartaroo, ("to send into Tartarus"). Here it stands for the place of punishment of the fallen angels: "spared not angels when they sinned, but cast them down to hell, and committed them to pits (or chains) of darkness" (compare <a onClick="return mV(\'Jud\',1,6);">Jude 1:6</a>; but also <a onClick="return mV(\'Mat\',25,41);">Mt 25:41</a>). Similar ideas are found in certain of the Jewish apocalyptic books (Book of Enoch, Book of Jubilees, Apocrypha Baruch, with apparent reference to <a onClick="return mV(\'Gen\',6,\'1-4\');">Ge 6:1-4</a>; compare <a href="study/isbe/search.html?string=ESCHATOLOGY+OF+THE+OLD+TESTAMENT">ESCHATOLOGY OF THE OLD TESTAMENT</a>).<P>On theological aspect, see <a href="study/isbe/search.html?string=PUNISHMENT,+EVERLASTING">PUNISHMENT, EVERLASTING</a>. For literature, see references in above-named articles, and compare article "Hell" by Dr. D. S. Salmond in HDB.``132';
isbe[4257]='Hellenism; Hellenist`hel\'-en-iz\'-m, hel\'-en-ist: Hellenism is the name we give to the manifold achievements of the Greeks in social and political institutions, in the various arts, in science and philosophy, in morals and religion. It is customary to distinguish two main periods, between which stands the striking figure of Alexander the Great, and to apply to the earlier period the adjective "Hellenic," that of "Hellenistic" to the latter. While there is abundant reason for making this distinction, it must not be considered as resting upon fortuitous changes occasioned by foreign influences. The Hellenistic age is rather the sudden unfolding of a flower whose bud was forming and maturing for centuries.<P>1. The Expansion of the Greek Peoples:<P>Before the coming of the Hellenic peoples into what we now call Greece, there existed in those lands a flourishing civilization to which we may give the name "Aegean." The explorations of archaeologists during the last few decades have brought it to light in many places on the continent, as well as on the islands of the Aegean and notably in Crete. When the Hellenic peoples came, it was not as a united nation, nor even as homogeneous tribes of a common race; though without doubt predominantly of kindred origin, it was the common possession of an Aryan speech and of similar customs and religion that marked them off from the peoples among whom they settled. When their southward movemerit from Illyria occurred, and by what causes it was brought about, we do not know; but it can hardly have long antedated the continuance of this migration which led to the settlement of the coast districts of Asia Minor and the islands of the Aegean from about the 13th to the 10th centuries BC. In the colonization of these new territories the Hellenic peoples became conscious of their kinship, partly because the several colonies received contingents from various regions of the motherland, partly because they were in common brought into striking contrast to the alien "Barbarians" who spoke other untintelligible languages. As the older communities on the mainland and on the islands began to flourish, they felt the need, arising from various causes, for further colonization. Among these causes we may mention the poverty of the soil in Greece proper, the restricting pressure of the strong tribes of Asia Minor who prevented expansion inland, a growing disaffection with the aristocratic regime in almost all Greek states and with the operation of the law of primogeniture in land tenure, and lastly the combined lure of adventure and the prospect of trade. Thus, it came about that in the 8th and 7th centuries BC, two great movements of colonial expansion set in, one toward the Hellespont and to the shores of the Pontus, or Black Sea, beyond, the other westward toward Southern Italy, Sicily, and beyond as far as Gades in Spain. To the 7th century belongs also the colonization of Naucratis in Egypt and of Cyrene in Libya. Then followed a period of relative inactivity during the 5th century, which was marked by the desperate conflict of the Greeks with Persia in the East and with Carthage in the West, succeeded by even more disastrous conflicts among themselves. With the enforced internal peace imposed by Macedonia came the resumption of colonial and military expansion in a measure before undreamed of. In a few years the empire of Alexander embraced Thrace, Asia Minor, Egypt, and Asia eastward beyond the Indus. The easternmost regions soon fell away, but Asia Minor, Syria and Egypt long continued under Greek rule, until Rome in the 1st century BC made good her claims to sovereignty in those lands.<P>2. The Hellenic State:<P>Throughout this course of development and expansion we speak of the people as Greeks, although it is evident that even such racial homogeneity as they may have had on coming into Greece must have been greatly modified by the absorption of conquered peoples. But the strong individuality of the Hellenic population manifested itself everywhere in its civilization. In the evolution from the Homeric kingship (supported by the nobles in council, from which the commonalty was excluded, or where it was supposed at most to express assent or dissent to proposals laid before it) through oligarchic or aristocratic rule and the usurped authority of the tyrants, to the establishement of democratic government, there is nothing surprising to the man of today. That is because Greek civilization has become typical of all western civilization. In the earlier stages of this process, moreover, there is nothing strikingly at variance with the institutions of the Hebrews, at least so far as concerns the outward forms. But there existed throughout a subtle difference of spirit which made it possible, even inevitable, for the Greeks to attain to democratic institutions, whereas to the Hebrews such a development was impossible, if not unthinkable. It is difficult to define this spirit, but one may say that it was marked from the first by an inclination to permit the free development and expression of individuality subordinated to the common good; by a corresponding recognition of human limitations over against one\'s fellow-man as over against Deity; by an instinctive dread of excess as inhuman and provoking the just punishment of the gods; and lastly by a sane refusal to take oneself too seriously, displaying itself in a certain good-humored irony even among men who, like Socrates and Epicurus, regarded themselves as charged with a sublime mission, in striking contrast with the Hebrew prophets who voiced the thunders of Sinai, but never by any chance smiled at their own earnestness. Even the Macedonians did not attempt to rule Greece with despotic sway, leaving the states in general in the enjoyment of their liberties; and in the Orient, Alexander and his successors, Roman as well as Greek, secured their power and extended civilization by the foundation and encouragement of Hellenic cities in extraordinary numbers. The city-state, often confederated with other city-states, displaced the organization of tribe or clan, thus substituting a new unit and a new interest for the old; and the centers thus created radiated Hellenic influence and made for order and good government everywhere. But in accordance with the new conditions the state took on a somewhat different form. While the city preserved local autonomy, the state became monarchical; and the oriental deification of the king reinforced by the Hellenic tendency to deify the benefactors of mankind, eventuated in modes of speech and thought which powerfully influenced the Messianic hopes of the Jews.<P>3. Hellenic Life:<P>The life of the Greeks, essentially urban and dominated by political interests fostered in states in which the individual counted for much, was of a type wholly different from the oriental. Although the fiction of consanguinity was cultivated by the Hellenic city-state as by the Semitic tribe, it was more transparent in the former, particularly in the newer communities formed in historical times. There was thus a powerful stimulus to mutual tolerance and concession which, supported as it was by the strong love of personal independence and the cultivation of individuality, led to the development of liberty and the recognition of the rights of man. A healthy social life was the result for those who shared the privileges of citizenship, and also, in hardly less degree, for those resident aliens who received the protection of the state. Women also, though not so free as men, enjoyed, even at Athens where they were most limited, liberties unknown to the Orientals. In the Hellenistic age they attained a position essentially similar to that of modern Europe. There were slaves belonging both to individuals and the state, but their lot was mitigated in general by a steadily growing humanity. The amenities of life were many, and were cultivated no less in the name of religion than of art, literature, and science.<P>4. Hellenic Art and Letters:<P>As in every phase of Greek civilization, the development of art and letters was free. Indeed their supreme excellence must be attributed to the happy circumstances which suffered them to grow spontaneously from the life of the people without artificial constraints imposed from within, or overpowering influences coming from without: a fortune which no other great movement in art or letters can boast. Greek art was largely developed in the service of religion; but owing to the circumstance that both grew side by side, springing from the heart of man, their reactions were mutual, art contributing to religion quite as much as it received. The creative genius of the Hellenic people expressed itself with singular directness and simplicity in forms clearly visualized and subject to the conditions of psychologically effective grouping in space or time. Their art is marked by the observance of a just proportion and by a certain natural restraint due to the preponderance of the intellectual element over the purely sensuous. Its most characteristic product is the ideal type in which only enough individuality enters to give to the typical the concreteness of life. What has been said of art in the narrower sense applies equally to artistic letters. The types thus created, whether in sculpture, architecture, music, drama, history, or oratory, though not regarded with superstitious reverence, commended themselves by the sheer force of inherent truth and beauty to succeeding generations, thus steadying the course of development and restraining the exuberant originality and the tendency to individualism. In the Hellenistic age, individualism gradually preponderated where the lessening power of creative genius did not lead to simple imitation.<P>5. Philosophy of Nature and of Conduct:<P>The traditional views of the Hellenic peoples touching Nature and conduct, which did not differ widely from those of other peoples in a corresponding stage of culture, maintained themselves down to the 7th century BC with comparatively little change. Along with and following the colonial expansion of Hellenism there came the awakening intellectual curiosity, or rather the shock of surprise necessary to convert attention into question. The mythology of the Greeks had contained a vague theology, without authority indeed, but satisfactory because adequate to express the national thought. Ethics there was none, morality being customary. But the extending horizon of Hellenic thought discovered that customs differed widely in various lands; indeed, it is altogether likely that the collection of strange and shocking customs which filled the quivers of the militant Sophists in the 5th century had its inception in the 6th and possibly the 7th century At any rate it furnished the fiery darts of the adversary until ethics was founded in reason by the quest of Socrates for the universal, not in conduct, but in judgment. As ethics arose out of the irreconcilable contradictions of conduct, so natural philosophy sprung from the contradictions of mythical theology and in opposition to it. There were in fact two strata of conceptions touching supernatural beings; one, growing out of a primitive animism, regarded their operations essentially from the point of view of magic, which refuses to be surprised at any result, be it never so ill-proportioned to the means employed, so long as the mysterious word was spoken or the requisite act performed; the other, sprung from a worship of Nature in her most striking phenomena, recognized an order, akin to the moral order, in her operations. When natural philosophy arose in the 6th century, it instinctively at first, then consciously, divested Nature of personality by stripping off the disguise of myth and substituting a plain and reasoned tale founded on mechanical principles. This is the spirit which pervades pre-Socratic science and philosophy. The quest of Socrates for universally valid judgments on conduct directed thought to the laws of mind, which are teleological, in contradistinction to the laws of matter, which are mechanical; and thus in effect dethroned Nature, regarded as material, by giving primacy to mind. Henceforth, Greek philosophy was destined, with relatively few and unimportant exceptions, to devote itself to the study of human conduct and to be essentially idealistic, even where the foundation, as with the Stoics, was ostensibly materialistic. More and more it became true of the Greek philosophers that they sought God, "if haply they might feel after him and find him," conscious of the essential unity of the Divine and the human, and defining philosophy as the endeavor to assimilate the soul to God.<P>6. Hellenic and Hellenistic Religion:<P>The Homeric poems present a picture of Greek life as seen by a highly cultivated aristocratic society having no sympathy with the commonalty. Hence, we are not to regard Homeric religion as the religion of the Hellenic peoples in the Homeric age. Our first clear view of the Hellenic commoner is presented by Hesiod in the 8th century. Here we find, alongside of the worship of the Olympians, evidences of chthonian cults and abundant hints of human needs not satisfied by the well-regulated religion of the several city-states. The conventionalized monarchy of Zeus ruling over his fellow-Olympians is known to be a fiction of the poets, having just as much—no more—foundation, in fact, as the mythical overlordship of Agamemnon over the assembled princes of the Achaens; while it caught the imagination of the Greeks and dominated their literature, each city-state possessed its own shrines sacred to its own gods, who might or might not be called by the names of Olympians. Yet the great shrines which attracted Greeks from every state, such as those of Zeus at Dodona (chiefly in the period before the 7th century) and Olympia, of Apollo at Delos and Delphi, and of Hera at Argos, were the favored abodes of Olympians. Only one other should be mentioned: that of Demeter at Eleusis. Her worship was of a different character, and the great repute of her shrine dates from the 5th century. If the Zeus of Olympia was predominantly the benign god of the sky, to whom men came in joyous mood to delight him with pomp and festive gatherings, performing feats of manly prowess in the Olympic games, the Zeus of Dodona, and the Delphian Apollo, as oracular deities, were visited in times of doubt and distress. The 7th and 6th centuries mark the advent—or the coming into prominence—of deities whose appeal was to the deepest human emotions, of ecstatic enthusiasm, of fear, and of hope. Among them we must mention Dionysus, the god of teeming Nature (see <a href="study/isbe/search.html?string=DIONYSUS">DIONYSUS</a>), and Orpheus. With their advent comes an awakening of the individual soul, whose aspiration to commune with Deity found little satisfaction in the general worship of the states. Private organizations and quasi-monastic orders, like those of the Orphics and Pythagoreans, arose and won countless adherents. Their deities found admission into older shrines, chiefly those of chthonian divinities, like that of Demeter at Eleusis, and wrought a change in the spirit and to a certain extent in the ritual of the "mysteries" practiced there. It was in these "mysteries" that the Christian Fathers, according to the mood or the need, polemic or apologetic, of the moment, saw now the propaedeutic type, now the diabolically instituted counterfeit, of the sacraments and ordinances of the church. The spirit and even the details of the observances of the "mysteries" are difficult to determine; but one must beware of accepting the hostile judgments of Christian writers who were in fact retorting upon the Greeks criticisms leveled at the church: both were blinded by partisanship and so misread the symbols.<P>If we thus find a true praeparatio evangelica in the Hellenistic developments of earlier Hellenic religion, there are parallel developments in the other religions which were adopted in the Hellenistic age. The older national religions of Persia and Egypt underwent a similar change, giving rise respectively to the worship of Mithra and of Isis, both destined, along with the chthonian mysteries of the Greeks, to be dangerous rivals for the conquest of the world of Christianity, itself a younger son in this prolific family of new religions. Space is wanting here for a consideration of these religious movements, the family resemblance of which with Christianity is becoming every day more apparent; but so much at least should be said, that while every candid student must admit the superiority of Christianity in moral content and adaptation to the religious nature of man, the difference in these respects was not at first sight so obvious that the successful rival might at the beginning of the contest have been confidently predicted.<P>As with other manifestations of the Hellenic spirit, so, too, in matters of religion, it was the free development of living institutions that most strikingly distinguishes the Greeks from the Hebrews. They had priests, but were never ruled by them; they possessed a literature regarded with veneration, and in certain shrines treasured sacred writings containing directions for the practice and ritual of the cults, but they were neither intended nor suffered to fix for all time the interpretation of the symbols. In the 5th and 4th centuries the leaders of Greek thought rebuked the activity of certain priests, and it was not before the period of Roman dominion that priests succeeded even in a small measure in usurping power, and sacred writings began to exercise an authority remotely comparable to that recognized among the Jews.<P>A most interesting question is that concerning the extent to which Greek civilization and thought had penetrated and influenced Judaism. During three centuries before the advent of Jesus, Hellenism had been a power in Syria and Judea. The earliest writings of the Hebrews showing this influence are Daniel and the Old Testament Apocrypha. Several books of the Apocrypha were originally written in Greek, and show strong influence of Greek thought. The Septuagint, made for the Jews of the Dispersion, early won its way to authority even in Palestine, where Aramaic had displaced Hebrew, which thus became a dead language known only to a few. New Testament quotations of the Old Testament are almost without exception taken from the Septuagint. Thus the sacred literature of the Jews was for practical purposes Greek. Though Jesus spoke Aramaic, He unquestionably knew some Greek. Yet there is no clear evidence of specifically Greek influence on this thought, the presuppositions of which are Jewish or generally those of the Hellenistic age. All the writings of the New Testament were originally composed in Greek, though their authors differed widely in the degree of proficiency in the use of the language and in acquaintance with Hellenic thought. Their debt to these sources can be profitably considered only in connection with the individual writers; but one who is acquainted with the Hebrew and Greek literature instinctively feels in reading the New Testament that the national character of the Jews, as reflected in the Old Testament, has all but vanished, remaining only as a subtle tone of moral earnestness and as an imaginative coloring, except in the simple story of the Synoptic Gospels. But for the bitterness aroused by the destruction of Jerusalem, it is probable that the Jews would have yielded completely to Hellenic influences.`<a href="./study/isbe/search.html?string=GREECE,+RELIGION+IN+ANCIENT">GREECE, RELIGION IN ANCIENT</a>`75';
