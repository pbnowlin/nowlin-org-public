isbe[3445]='Firebrand`fir\'-brand (\'udh, used for a burning stick taken out of the fire):<P>In <a onClick="return mV(\'Jdg\',15,4,5);">Jud 15:4-5</a> describing the "brands" (margin "torches") which Samson tied to the foxes\' tails, the word is lappidh ("lamp"; see <a onClick="return mV(\'Jdg\',7,16,20);">Jud 7:16, 20</a> the Revised Version (British and American), "torches"). Other words are ziqqim, "sparks," "flames" (fiery darts; <a onClick="return mV(\'Pro\',26,18);">Pr 26:18</a>), and ziqoth (<a onClick="return mV(\'Isa\',50,11);">Isa 50:11</a>); \'udh is used figuratively of angry men (<a onClick="return mV(\'Isa\',7,4);">Isa 7:4</a>), and of those mercifully rescued from destruction (<a onClick="return mV(\'Amo\',4,11);">Am 4:11</a>; <a onClick="return mV(\'Zec\',3,2);">Zec 3:2</a>; the Revised Version (British and American) "brand"). the Revised Version (British and American) gives "firebrand" as translation of moqedh (the King James Version "hearth") in <a onClick="return mV(\'Psa\',102,3);">Ps 102:3</a>, "My bones are burned as a firebrand" (margin "as a hearth").`<a href="./study/isbe/search.html?string=BRAND">BRAND</a>`185';
isbe[3446]='Firepan`fir\'-pan (machtah, "firepan," "censer," "snuffdish," from chathah, "to snatch up"):<P>A vessel for carrying coals. Brazen firepans were part of the furnishings of the altar of burnt offerings (<a onClick="return mV(\'Exd\',27,3);">Ex 27:3</a>; <a onClick="return mV(\'Exd\',38,3);">38:3</a>, and in <a onClick="return mV(\'Num\',4,14);">Nu 4:14</a>, where the King James Version wrongly reads "censers," the context indicating a vessel belonging to the brazen altar).<P>The same word is translated "snuffdishes" in <a onClick="return mV(\'Exd\',25,38);">Ex 25:38</a>; <a onClick="return mV(\'Exd\',37,23);">37:23</a>; <a onClick="return mV(\'Num\',4,9);">Nu 4:9</a>, where it refers to golden firepans which belonged to the golden candlestick or lamp stand, and were used to receive the burnt ends of the wicks. In <a onClick="return mV(\'1Ki\',7,50);">1Ki 7:50</a> and <a onClick="return mV(\'2Ch\',4,22);">2Ch 4:22</a>, although the King James Version reads "censers," the context points to the firepans belonging to the candlestick; as also in <a onClick="return mV(\'2Ki\',25,15);">2Ki 25:15</a> and <a onClick="return mV(\'Jer\',52,19);">Jer 52:19</a>, translated "firepans" in the King James Version and the Revised Version (British and American). A similar firepan designated by the same Hebrew word but translated "censer" was used to carry the burning coals upon which the incense was thrown and burned (<a onClick="return mV(\'Lev\',10,1);">Le 10:1</a>; <a onClick="return mV(\'Lev\',16,12);">16:12</a>; <a onClick="return mV(\'Num\',16,6,17);">Nu 16:6, 17</a>ff).<P>The firepan or censer of the Hebrews was doubtless similar to the censer of the Egyptians, pictures of which have been found. It consisted of a pan or pot for the coals, which was held by a straight or slightly curved long handle. The style of censer used in recent centuries, swung by three chains, came into use about the 12th century AD.`<a href="./study/isbe/search.html?string=CENSER">CENSER</a>`76';
isbe[3447]='Fires`firz:<P>In <a onClick="return mV(\'Isa\',24,15);">Isa 24:15</a> the King James Version translates \'urim ("lights," especially Urim in the phrase "Urim and Thummim") "fires." The Revised Version (British and American), understanding the word to mean the region of light, translates "east," which satisfies the context far better, and is adopted by many modern scholars. In <a onClick="return mV(\'Eze\',39,9,10);">Eze 39:9-10</a> the Revised Version (British and American) has "fires"; in <a onClick="return mV(\'Eze\',39,9);">39:9</A> "make fires" is a translation of a verb of different root; in <a onClick="return mV(\'Eze\',39,10);">Eze 39:10</a> "fires" translates the common singular noun for fire.``1';
isbe[3448]='Firkin`fur\'-kin (metretes):<P>The liquid measure used in <a onClick="return mV(\'Jhn\',2,6);">Joh 2:6</a> to indicate the capacity of the water-pots mentioned in the narrative of the miracle of turning the water into wine. It is regarded as equivalent to the Hebrew bath, and thus contained about nine gallons.`<a href="./study/isbe/search.html?string=WEIGHTS+AND+MEASURES">WEIGHTS AND MEASURES</a>`1';
isbe[3449]='Firmament`fur\'-ma-ment.`<a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>`1';
isbe[3450]='First`furst (\'echadh, ri\'shon; proton, to proton, protos):<P>Of these words, which are those most frequently used for "first," ri\'shon is from rosh, "the head, and is used for the highest, chief, etc.; also of time, the beginning, e.g. <a onClick="return mV(\'Gen\',8,13);">Ge 8:13</a>, in the first month"; in <a onClick="return mV(\'Isa\',44,6);">Isa 44:6</a>; <a onClick="return mV(\'Isa\',48,12);">48:12</a>, it is used of Yahweh as Eternal and solely Supreme—the First and the Last (compare <a onClick="return mV(\'Isa\',41,4);">Isa 41:4</a>). Special usages are in connection with "firstborn," "first-fruit," etc.; proton is used of that which is first in order; but also of that which is first or chief in importance, etc. (<a onClick="return mV(\'Mat\',6,33);">Mt 6:33</a>; <a onClick="return mV(\'Jam\',3,17);">Jas 3:17</a>). In <a onClick="return mV(\'1Ti\',1,15);">1Ti 1:15</a>, Paul says Jesus came "to save sinners; of whom I am chief," literally, "first"; the same word is used by Jesus of the "first" of the commandments (<a onClick="return mV(\'Mar\',12,29);">Mr 12:29</a>); where we read in <a onClick="return mV(\'1Cr\',15,3);">1Co 15:3</a>, "I delivered unto you first of all," it is en protois ("in the foremost place"); "The first and the last" is applied to Christ as Eternal and Supreme (<a onClick="return mV(\'Rev\',1,17);">Re 1:17</a>; <a onClick="return mV(\'Rev\',2,8);">2:8</a>; <a onClick="return mV(\'Rev\',22,13);">22:13</a>); protos is "the first day" (<a onClick="return mV(\'Mat\',26,17);">Mt 26:17</a>; <a onClick="return mV(\'Mar\',16,9);">Mr 16:9</a>); in <a onClick="return mV(\'Mat\',28,1);">Mt 28:1</a>; <a onClick="return mV(\'Mar\',16,2);">Mr 16:2</a>; <a onClick="return mV(\'Luk\',24,1);">Lu 24:1</a>; <a onClick="return mV(\'Jhn\',20,1,19);">Joh 20:1, 19</a>; <a onClick="return mV(\'Act\',20,7);">Ac 20:7</a>, it is mia ("one").``185';
isbe[3451]='First-Begotten`furst-be-got\'-\'-n (prototokos):<P>This Greek word is translated in two passages in the King James Version by "first-begotten" (<a onClick="return mV(\'Hbr\',1,6);">Heb 1:6</a>; <a onClick="return mV(\'Rev\',1,5);">Re 1:5</a>), but in all other places in the King James Version, and always in the Revised Version (British and American), by "firstborn." It is used in its natural literal sense of Jesus Christ as Mary\'s firstborn (<a onClick="return mV(\'Luk\',2,7);">Lu 2:7</a>; <a onClick="return mV(\'Mat\',1,25);">Mt 1:25</a> the King James Version); it also bears the literal sense of Jesus Christ as Mary\'s firstborn (<a onClick="return mV(\'Luk\',2,7);">Lu 2:7</a>; <a onClick="return mV(\'Mat\',1,25);">Mt 1:25</a> the King James Version); it also bears the literal sense of the firstborn of the firstborn of men and animals (<a onClick="return mV(\'Hbr\',11,28);">Heb 11:28</a>). It is not used in the New Testament or Septuagint of an only child, which is expressed by monogenes (see below).<P>Metaphorically, it is used of Jesus Christ to express at once His relation to man and the universe and His difference from them, as both He and they are related to God. The laws and customs of all nations show that to be "firstborn" means, not only priority in time, but a certain superiority in privilege and authority. Israel is Yahweh\'s firstborn among the nations (<a onClick="return mV(\'Exd\',4,22);">Ex 4:22</a>; compare <a onClick="return mV(\'Jer\',31,9);">Jer 31:9</a>). The Messianic King is God\'s firstborn Septuagint prototokos), "the highest of the kings of the earth" (<a onClick="return mV(\'Psa\',89,27);">Ps 89:27</a>). Philo applies the word to the Logos as the archetypal and governing idea of creation. Similarly Christ, as "the firstborn of all creation" (<a onClick="return mV(\'Col\',1,15);">Col 1:15</a>), is not only prior to it in time, but above it in power and authority. "All things have been created through him, and unto him" (<a onClick="return mV(\'Col\',1,16);">Col 1:16</a>).<P>He is "sovereign Lord over all creation by virtue of primo-geniture" (Lightfoot). It denotes His status and character and not His origin; the context does not admit the idea that He is a part of the created universe. So in His incarnation He is brought into the world as "firstborn," and God summons all His angels to worship Him (<a onClick="return mV(\'Hbr\',1,6);">Heb 1:6</a>). In His resurrection He is "firstborn from the dead" (<a onClick="return mV(\'Col\',1,18);">Col 1:18</a>) or "of the dead" (<a onClick="return mV(\'Rev\',1,5);">Re 1:5</a>), the origin and prince of life. And finally He is "firstborn among many brethren" in the consummation of God\'s purpose of grace, when all the elect are gathered home. Not only is He their Lord, but also their pattern, God\'s ideal Son and men are "foreordained to be conformed to (his) image" (<a onClick="return mV(\'Rom\',8,29);">Ro 8:29</a>). Therefore the saints themselves, as growing in His likeness, and as possessing all the privileges of eldest sons, including the kingdom and the priesthood, may be called the "church of the firstborn who are enrolled in heaven" (<a onClick="return mV(\'Hbr\',12,23);">Heb 12:23</a>).`<a href="./study/isbe/search.html?string=BEGOTTEN">BEGOTTEN</a>`145';
isbe[3452]='First-Fruits`furst\'-froots (re\'shith, bikkurim; aparche. Septuagint translates re\'shith by aparche, but for bikkurim it uses the word protogennemata; compare Philo 22 33):<P>In acknowledgment of the fact that the land and all its products were the gift of Yahweh to Israel, and in thankfulness for His bounty, all the first-fruits were offered to Him. These were offered in their natural state (e.g. cereals, tree fruits, grapes), or after preparation (e.g. musk, oil, flour, dough), after which the Israelite was at liberty to use the rest (<a onClick="return mV(\'Exd\',23,19);">Ex 23:19</a>; <a onClick="return mV(\'Num\',15,20);">Nu 15:20</a>; <a onClick="return mV(\'Num\',18,12);">18:12</a>; <a onClick="return mV(\'Deu\',26,2);">De 26:2</a>; <a onClick="return mV(\'Neh\',10,35,37);">Ne 10:35, 37</a>). No absolute distinction can be made between re\'shith and bikkurim, but re\'shith seems generally to mean what is prepared by human labor, and bikkurim the direct product of Nature. The phrase "the first of the first-fruits" (<a onClick="return mV(\'Exd\',23,19);">Ex 23:19</a>; <a onClick="return mV(\'Exd\',34,26);">34:26</a>; <a onClick="return mV(\'Eze\',44,30);">Eze 44:30</a>), Hebrew re\'shith bikkure, Greek aparchai ton protogennematon, is not quite clear. It may mean the first-ripe or the choicest of the first-fruits.<P>The re\'shith offerings were individual, except that a re\'shith of dough was to be offered as a heave offering (<a onClick="return mV(\'Num\',15,\'17-21\');">Nu 15:17-21</a>). The priest waved a re\'shith of corn before the Lord on the morrow after the Sabbath in the week of unleavened bread (<a onClick="return mV(\'Lev\',23,\'9-11\');">Le 23:9-11</a>). These offerings all fell to the priest (<a onClick="return mV(\'Num\',18,12);">Nu 18:12</a>). Bikkurim refers specially to things sown (<a onClick="return mV(\'Exd\',23,16);">Ex 23:16</a>; <a onClick="return mV(\'Lev\',2,14);">Le 2:14</a>). At the Feast of Weeks, seven weeks after the offering of the sheaf, bikkurim of corn in the ear, parched with fire and bruised, were brought to the House of the Lord as a meal offering (<a onClick="return mV(\'Exd\',34,\'22-26\');">Ex 34:22-26</a>; <a onClick="return mV(\'Lev\',2,\'14-16\');">Le 2:14-16</a>). The bikkurim also fell to the priest, except a portion which was burned as a memorial (<a onClick="return mV(\'Lev\',2,\'8-10\',16);">Le 2:8-10, 16</a>).<P>The beautiful ceremony of the offering of the re\'shith in the House of God is described in <a onClick="return mV(\'Deu\',26,\'1-11\');">De 26:1-11</a>, and is enlarged upon in the Talmud (Bikkurim 3 2). According to the Talmud (Terumoth 4 3) a sixtieth part of the first-fruits in a prepared form was the minimum that could be offered; the more generous brought a fortieth part, and even a thirtieth. The fruits of newly planted trees were not to be gathered during the first three years; the fruits of the fourth year were consecrated to Yahweh, and from the fifth year the fruits belonged to the owner of the trees (<a onClick="return mV(\'Lev\',19,\'23-25\');">Le 19:23-25</a>). According to Mishna, \'Orlah i.10, even the shells of nuts and pomegranates could not be used during the first three years as coloring matter or for the lighting of fires. It is held by some scholars that the institution of the tithe (see <a href="./study/isbe/search.html?string=TITHE">TITHE</a>) is a later development from the first-fruits.<P>Figurative: In the Old Testament, in <a onClick="return mV(\'Jer\',2,3);">Jer 2:3</a>, Israel is called "the re\'shith of his increase." In the New Testament aparche is applied figuratively to the first convert or converts in a particular place (<a onClick="return mV(\'Rom\',16,5);">Ro 16:5</a>; <a onClick="return mV(\'1Cr\',16,15);">1Co 16:15</a>); to the Christians of that age (<a onClick="return mV(\'Jam\',1,18);">Jas 1:18</a>; <a onClick="return mV(\'2Th\',2,13);">2Th 2:13</a>, WHm), and to the 144,000 in heaven (<a onClick="return mV(\'Rev\',14,4);">Re 14:4</a>); to Christ, as the first who rose from the dead (<a onClick="return mV(\'1Cr\',15,20,23);">1Co 15:20, 23</a>); also to the blessings which we receive now through the Spirit, the earnest of greater blessings to come (<a onClick="return mV(\'Rom\',8,23);">Ro 8:23</a>).``98';
isbe[3453]='Firstborn; Firstling`furst\'-born, furst\'-ling (bekhor; prototokos):<P>The Hebrew word denotes the firstborn of human beings as well as of animals (<a onClick="return mV(\'Exd\',11,5);">Ex 11:5</a>), while a word from the same root denotes first-fruits (<a onClick="return mV(\'Exd\',23,16);">Ex 23:16</a>). All the data point to the conclusion that among the ancestors of the Hebrews the sacrifice of the firstborn was practiced, just as the firstlings of the flocks and the first-fruits of the produce of the earth were devoted to the deity. The narrative of the Moabite war records the sacrifice of the heir to the throne by Mesha, to Chemosh, the national god (<a onClick="return mV(\'2Ki\',3,27);">2Ki 3:27</a>). The barbarous custom must have become extinct at an early period in the religion of Israel (<a onClick="return mV(\'Gen\',22,12);">Ge 22:12</a>). It was probably due to the influence of surrounding nations that the cruel practice was revived toward the close of the monarchical period (<a onClick="return mV(\'2Ki\',16,3);">2Ki 16:3</a>; <a onClick="return mV(\'2Ki\',17,17);">17:17</a>; <a onClick="return mV(\'2Ki\',21,6);">21:6</a>; <a onClick="return mV(\'Jer\',7,31);">Jer 7:31</a>; <a onClick="return mV(\'Eze\',16,20);">Eze 16:20</a>; <a onClick="return mV(\'Eze\',23,37);">23:37</a>; <a onClick="return mV(\'Mic\',6,7);">Mic 6:7</a>). Jeremiah denies that the offering of human beings could have been an instruction from Yahweh (<a onClick="return mV(\'Jer\',7,31);">Jer 7:31</a>; <a onClick="return mV(\'Jer\',19,5);">19:5</a>).<P>The prophetic conception of God had rendered such a doctrine inconceivable. Clear evidence of the spiritualization and humanization of religion among the Israelites is furnished in the replacement, at an early stage, of the actual sacrifice of the firstborn by their dedication to the service of Yahweh. At a later stage the Levites were substituted for the firstborn. Just as the firstlings of unclean animals were redeemed with money (<a onClick="return mV(\'Exd\',13,13);">Ex 13:13</a>; <a onClick="return mV(\'Exd\',34,20);">34:20</a>), for the dedication of the firstborn was substituted the consecration of the Levites to the service of the sanctuary (<a onClick="return mV(\'Num\',3,\'11-13\',15);">Nu 3:11-13, 15</a>). On the 30th day after birth the firstborn was brought to the priest by the father, who paid five shekels for the child\'s redemption from service in the temple (compare <a onClick="return mV(\'Luk\',2,27);">Lu 2:27</a>; Mishna Bekhoroth viii.8). For that service the Levites were accepted in place of the redeemed firstborn (<a onClick="return mV(\'Num\',3,45);">Nu 3:45</a>). See note. According to <a onClick="return mV(\'Exd\',22,\'29-31\');">Ex 22:29-31</a> the firstborn were to be given to Yahweh. (The firstborn of clean animals, if free from spot or blemish, were to be sacrificed after eight days, <a onClick="return mV(\'Num\',18,16);">Nu 18:16</a>ff.) This allusion to the sacrifice of the firstborn as part of the religion of Yahweh has been variously explained. Some scholars suspect the text, but in all probability the verse means no more than similar references to the fact that the firstborn belonged to Yahweh (<a onClick="return mV(\'Exd\',13,2);">Ex 13:2</a>; <a onClick="return mV(\'Exd\',34,19);">34:19</a>). The modifying clause, with regard to the redemption of the firstborn, has been omitted. The firstborn possessed definite privileges which were denied to other members of the family. The Law forbade the disinheriting of the firstborn (<a onClick="return mV(\'Deu\',21,\'15-17\');">De 21:15-17</a>). Such legislation, in polygamous times, was necessary to prevent a favorite wife from exercising undue influence over her husband in distributing his property, as in the case of Jacob (<a onClick="return mV(\'Gen\',25,23);">Ge 25:23</a>). The oldest son\'s share was twice as large as that of any other son. When Elisha prayed for a double portion of Elijah\'s spirit, he simply wished to be considered the firstborn, i.e. the successor, of the dying prophet. Israel was Yahweh\'s firstborn (<a onClick="return mV(\'Exd\',4,22);">Ex 4:22</a> privileges. She occupied a unique position in virtue of the special relationship between Yahweh and the nation. In three passages (<a onClick="return mV(\'Rom\',8,29);">Ro 8:29</a>; <a onClick="return mV(\'Col\',1,15);">Col 1:15</a>; <a onClick="return mV(\'Hbr\',1,6);">Heb 1:6</a>), Jesus Christ is the firstborn—among many brethren (<a onClick="return mV(\'Rom\',8,29);">Ro 8:29</a>); of every creature (<a onClick="return mV(\'Col\',1,16);">Col 1:16</a>). This application of the term to Jesus Christ may be traced back to <a onClick="return mV(\'Psa\',89,27);">Ps 89:27</a> where the Davidic ruler, or perhaps the nation, is alluded to as the firstborn of Yahweh.<P>NOTE—The custom of redeeming the firstborn son is preserved among the Jews to this day. After thirty days the father invites the "Kohen," i.e. a supposed descendant of Aaron, to the house. The child is brought and shown to the "Kohen," and the father declares the mother of the child to be an Israelite. If she is a "Kohen," redemption is not necessary. The "Kohen" asks the father which he prefers, his child or the five shekels; the father answers that he prefers his son, and pays to the "Kohen" a sum equivalent to five shekels. After receiving the redemption-money, the "Kohen" puts his hands on the child\'s head and pronounces the Aaronite blessing (<a onClick="return mV(\'Num\',6,\'22-27\');">Nu 6:22-27</a>).`<a href="./study/isbe/search.html?string=CHILD;+CHILDREN">CHILD</a>; <a href="./study/isbe/search.html?string=CIRCUMCISION">CIRCUMCISION</a>; <a href="./study/isbe/search.html?string=FIRST+BEGOTTEN">FIRST-BEGOTTEN</a>; <a href="./study/isbe/search.html?string=PLAGUES+OF+EGYPT">PLAGUES OF EGYPT</a>`103';
isbe[3454]='Firstling``<a href="./study/isbe/search.html?string=FIRSTBORN;+FIRSTLING">FIRSTBORN</a>`1';
isbe[3455]='Fish`(dagh, daghah, da\'gh; ichthus, ichthudion, opsarion):<P>1. Natural History:<P>Fishes abound in the inland waters of Palestine as well as the Mediterranean. They are often mentioned or indirectly referred to both in the Old Testament and in the New Testament, but it is remarkable that no particular kind is distinguished by name. In <a onClick="return mV(\'Lev\',11,\'9-12\');">Le 11:9-12</a> and <a onClick="return mV(\'Deu\',14,9);">De 14:9</a>f; "whatsoever hath fins and scales in the waters" is declared clean, while all that "have not fins and scales" are forbidden. This excluded not only reptiles and amphibians, but also, among fishes, siluroids and eels, sharks, rays and lampreys. For our knowledge of the inland fishes of Palestine we are mainly indebted to Tristram, NHB and Fauna and Flora of Palestine; Lortet, Poissons et reptiles du Lac de Tiberiade; and Russegger, Reisen in Europa, Asien, Afrika, 1835-1841. The most remarkable feature of the fish fauna of the Jordan valley is its relationship to that of the Nile and of East Central Africa. Two Nile fishes, Chromis nilotica Hasselquist, and Clarias macracanthus Gunth., are found in the Jordan valley, and a number of other species found only in the Jordan valley belong to genera (Chromis and Hemichromis) which are otherwise exclusively African. This seems to indicate that at some time, probably in the early Tertiary, there was some connection between the Palestinian and African river systems. No fish can live in the Dead Sea, and many perish through being carried down by the swift currents of the Jordan and other streams. There are, however, several kinds of small fish which live in salt springs on the borders of the Dead Sea, springs which are as salt as the Dead Sea but which, according to Lortet, lack the magnesium chloride which is a constituent of the Dead Sea water and is fatal to the fish. Capoeta damascina Cuv. and Val., one of the commonest fishes of Syria and Palestine, has been taken by the writer in large numbers in the Arnon and other streams flowing into the Dead Sea. This is surprising in view of the fact that the Dead Sea seems to form an effective barrier between the fishes of the different streams flowing into it. The indiscriminate mention of fishes without reference to the different kinds is well illustrated by the numerous passages in which "the fishes of the sea, the birds of the heavens, and the beasts of the field," or some equivalent expression, is used to denote all living creatures, e.g. <a onClick="return mV(\'Gen\',1,26);">Ge 1:26</a>; <a onClick="return mV(\'Gen\',9,2);">9:2</a>; <a onClick="return mV(\'Num\',11,22);">Nu 11:22</a>; <a onClick="return mV(\'Deu\',4,18);">De 4:18</a>; <a onClick="return mV(\'1Ki\',4,33);">1Ki 4:33</a>; <a onClick="return mV(\'Job\',12,8);">Job 12:8</a>; <a onClick="return mV(\'Psa\',8,8);">Ps 8:8</a>; <a onClick="return mV(\'Eze\',38,20);">Eze 38:20</a>; <a onClick="return mV(\'Hsa\',4,3);">Ho 4:3</a>; <a onClick="return mV(\'Zep\',1,3);">Ze 1:3</a>; <a onClick="return mV(\'1Cr\',15,39);">1Co 15:39</a>.<P>2. Jonah\'s Fish:<P>An unusually large shark might fulfill the conditions of Jonah\'s fish (dagh, daghah; but <a onClick="return mV(\'Mat\',12,40);">Mt 12:40</a>, ketos, "whale" or "sea monster"). The whale that is found in the Mediterranean (Balaena australis) has a narrow throat and could not swallow a man. No natural explanation is possible of Jonah\'s remaining alive and conscious for three days in the creature\'s belly. Those who consider the book historical must regard the whole event as miraculous. For those who consider it to be a story with a purpose, no explanation is required.<P>3. Fishing:<P>The present inhabitants of Moab and Edom make no use of the fish that swarm in the Arnon, the Hisa and other streams, but fishing is an important industry in Galilee and Western Palestine. Now, as formerly, spear hooks and nets are employed. The fish-spear (<a onClick="return mV(\'Job\',41,7);">Job 41:7</a>) is little used. Most of the Old Testament references to nets have to do with the taking of birds and beasts and not of fishes, and, while in <a onClick="return mV(\'Hab\',1,15);">Hab 1:15</a> cherem is rendered "net" and mikhmereth "drag," it is hot clear that these and the other words rendered "net" refer to particular kinds of nets. In the New Testament, however, sagene (<a onClick="return mV(\'Mat\',13,47);">Mt 13:47</a>), is clearly the dragnet, and amphiblestron (<a onClick="return mV(\'Mat\',4,18);">Mt 4:18</a>), is clearly the casting net. The word most often used is diktuon. Though this word is from dikein, "to throw," or "to cast," the context in several places (e.g. <a onClick="return mV(\'Luk\',5,4);">Lu 5:4</a>; <a onClick="return mV(\'Jhn\',21,11);">Joh 21:11</a>) suggests that a dragnet is meant. The dragnet may be several hundred feet long. The upper edge is buoyed and the lower edge is weighted. It is let down from a boat in a line parallel to the shore and is then pulled in by ropes attached to the two ends, several men and boys usually pulling at each end. The use of the casting net requires much skill. It forms a circle of from 10 to 20 feet in diameter with numerous small leaden weights at the circumference. It is lifted by the center and carefully gathered over the right arm. When well thrown it goes to some distance, at the same time spreading out into a wide circle. A cord may be attached to the center, but this is not always the case. When lifted again by the center, the leads come together, dragging over the bottom, and sometimes a large number of fish may be enclosed. The novice has only to try, to realize the dexterity of the practiced fishermen.<P>Figurative: The fact that so many of our Lord\'s disciples were fishermen lends a profound interest to their profession. Christ tells Simon and Andrew (<a onClick="return mV(\'Mat\',4,19);">Mt 4:19</a>; <a onClick="return mV(\'Mar\',1,17);">Mr 1:17</a>) that He will make them fishers of men. The Kingdom of Heaven (<a onClick="return mV(\'Mat\',13,47);">Mt 13:47</a>) is likened unto a net that was cast into the sea, and gathered of every kind; which, when it was filled, they drew up on the beach; and they sat down and gathered the good into vessels, but the bad they cast away. Tristram (NHB) says that he has seen the fishermen go through their net and throw out into the sea those that were too small for the market or were considered unclean. In <a onClick="return mV(\'Jer\',16,16);">Jer 16:16</a>, we read: "Behold, I will send for many fishers, saith Yahweh, and they shall fish them up; and afterward I will send for many hunters, and they shall hunt them from every mountain, and from every hill, and out of the clefts of the rocks." In the vision of Ezekiel (<a onClick="return mV(\'Eze\',47,9);">Eze 47:9</a>f), the multitude of fish and the nets spread from En-gedi to En-eglaim are marks of the marvelous change wrought in the Dead Sea by the stream issuing from the temple. The same sign, i.e. of the spreading of nets (<a onClick="return mV(\'Eze\',26,5,14);">Eze 26:5, 14</a>), marks the desolation of Tyre. It is a piece of broiled fish that the risen Lord eats with the Eleven in Jerusalem (<a onClick="return mV(\'Luk\',24,42);">Lu 24:42</a>), and by the Sea of Galilee (<a onClick="return mV(\'Jhn\',21,13);">Joh 21:13</a>) He gives the disciples bread and fish.``37';
isbe[3456]='Fish Gate``<a href="./study/isbe/search.html?string=JERUSALEM,+1">JERUSALEM</a>`1';
isbe[3457]='Fisher\'s Coat`kot: This expression is found in <a onClick="return mV(\'Jhn\',21,7);">Joh 21:7</a> where the Revised Version (British and American) and the American Standard Revised Version have "coat." John here, after representing Peter as "naked" (gumnos), pictures him as girding on his "coat" (ependutes), literally, "upper garment," and not at all specifically a "fisher\'s coat."`<a href="./study/isbe/search.html?string=DRESS">DRESS</a>`1';
isbe[3458]='Fisher; Fisherman`fish\'-er fish\'-er-man (dayyagh, dawwagh; halieus; Westcott and Hort, The New Testament in Greek haleeus):<P>Although but few references to fishermen are made in the Bible, these men and their calling are brought into prominence by Jesus\' call to certain Galilee fishermen to become His disciples (<a onClick="return mV(\'Mat\',4,18,19);">Mt 4:18-19</a>; <a onClick="return mV(\'Mar\',1,16,17);">Mr 1:16-17</a>). Fishermen, then as now, formed a distinct class. The strenuousness of the work (<a onClick="return mV(\'Luk\',5,2);">Lu 5:2</a>) ruled out the weak and indolent. They were crude in manner, rough in speech and in their treatment of others (<a onClick="return mV(\'Luk\',9,49,54);">Lu 9:49, 54</a>; <a onClick="return mV(\'Jhn\',18,10);">Joh 18:10</a>). James and John before they became tempered by Jesus\' influence were nicknamed the "sons of thunder" (<a onClick="return mV(\'Mar\',3,17);">Mr 3:17</a>). The fishermen\'s exposure to all kinds of weather made them hardy and fearless. They were accustomed to bear with patience many trying circumstances. They often toiled for hours without success, and yet were always ready to try once more (<a onClick="return mV(\'Luk\',5,5);">Lu 5:5</a>; <a onClick="return mV(\'Jhn\',21,3);">Joh 21:3</a>). Such men, when impelled by the same spirit as filled their Master, became indeed "fishers of men" (<a onClick="return mV(\'Mat\',4,19);">Mt 4:19</a>; <a onClick="return mV(\'Mar\',1,17);">Mr 1:17</a>).<P>One of the striking instances of the fulfillment of prophecy is the use by the Syrian fishermen today of the site of ancient Tyre as a place for the spreading of their nets (<a onClick="return mV(\'Eze\',26,5,14);">Eze 26:5, 14</a>).<P>Figurative: Fish were largely used as food (<a onClick="return mV(\'Hab\',1,16);">Hab 1:16</a>), hence, the lamentation of the fishermen, who provided for all, typified general desolation (<a onClick="return mV(\'Isa\',19,8);">Isa 19:8</a>). On the other hand, abundance of fish and many fishermen indicated general abundance (<a onClick="return mV(\'Eze\',47,10);">Eze 47:10</a>). Our modern expression, "treated like a dog," had its counterpart in the language of the Old Testament writers, when they portrayed the punished people of Judah as being treated like fish. Yahweh would send many fishers to fish them up and put sticks or hooks through their cheeks as a fisherman strings his fish (<a onClick="return mV(\'Jer\',16,16);">Jer 16:16</a>; <a onClick="return mV(\'Job\',41,2);">Job 41:2</a>). Such treatment of the people of Judah is depicted on some of the Assyrian monuments.``133';
isbe[3459]='Fishhook`fish\'-hook (cir dughah, chakkah):<P>The word "fishhooks" occurs but twice in the American Standard Revised Version (<a onClick="return mV(\'Job\',41,1);">Job 41:1</a>; <a onClick="return mV(\'Amo\',4,2);">Am 4:2</a>). In other passages the word hook or "angle" is applied to this instrument for fishing (<a onClick="return mV(\'Isa\',19,8);">Isa 19:8</a>; <a onClick="return mV(\'Job\',41,2);">Job 41:2</a>). The ancient Egyptian noblemen used to amuse themselves by fishing from their private fishpools with hook and line. The Egyptian monuments show that the hook was quite commonly used for catching fish. The hook is still used in Bible lands, although not as commonly as nets. It is called a cinnarat, probably from the same root as tsinnah, the plural of which is translated hooks in <a onClick="return mV(\'Amo\',4,2);">Am 4:2</a>. In <a onClick="return mV(\'Mat\',17,27);">Mt 17:27</a>, agkistron (literally, "fishhook"), is rendered "hook."``133';
isbe[3460]='Fishing`fish\'-ing (halieuo): Several methods of securing fish are resorted to at the present day along the seashores of Palestine. Two of these, dynamiting and poisoning with the juice of cyclamen bulbs or other poisonous plants, can be passed over as havi ng no bearing on ancient methods.<P>(1) With Hooks:<P>Some fishing is done with hooks and lines, either on poles when fishing from shore, or on trawls in deep-sea fishing. The fishhooks now used are of European origin, but bronze fishhooks of a very early date have been discovered. That fishing with hooks was known in Jesus\' time is indicated by the Master\'s command to Peter (<a onClick="return mV(\'Mat\',17,27);">Mt 17:27</a>).<P>See <a href="./study/isbe/search.html?string=FISHHOOK">FISHHOOK</a>.<P>(2) With Spears:<P><a onClick="return mV(\'Job\',41,7);">Job 41:7</a> probably refers to an instrument much like the barbed spear still used along the Syrian coast. It is used at night by torchlight.<P>(3) With Nets:<P>In the most familiar Bible stories of fisherman life a net was used. Today most of the fishing is done in the same way. These nets are homemade. Frequently one sees the fishermen or members of their families making nets or repairing old ones during the stormy days when fishing is impossible.<P>Nets are used in three ways:<P>(a) A circular net, with small meshes and leaded around the edge, is cast from the shore into the shallow water in such a manner that the leaded edge forms the base of a cone, the apex being formed by the fisherman holding the center of the net in his hand. The cone thus formed encloses such fish as cannot escape the quick throw of the fisher.<P>(b) A long net or seine of one or two fathoms depth, leaded on one edge and provided with floats on the other, is payed out from boats in such a way as to surround a school of fish. Long ropes fastened to the two ends are carried ashore many yards apart, and from five to ten men on each rope gradually draw in the net. The fish are then landed from the shallow water with small nets or by hand. This method is commonly practiced on the shore of the Sea of Galilee.<P>(c) In deeper waters a net similar to that described above, but four or five fathoms deep, is cast from boats and the ends slowly brought together so as to form a circle. Men then dive down and bring one portion of the weighted edge over under the rest, so as to form a bottom. The compass of the net is then narrowed, and the fish are emptied from the net into the boat. Sometimes the net with the fish enclosed is towed into shallow water before drawing. The above method is probably the one the disciples used (<a onClick="return mV(\'Mat\',4,18);">Mt 4:18</a>; <a onClick="return mV(\'Mar\',1,16);">Mr 1:16</a>; <a onClick="return mV(\'Luk\',5,\'2-10\');">Lu 5:2-10</a>; <a onClick="return mV(\'Jhn\',21,\'3-11\');">Joh 21:3-11</a>). Portions of nets with leads and floats, of early Egyptian origin, may be seen in the British Museum.<P>The fishermen today usually work with their garments girdled up about their waists. Frequently they wear only a loose outer garment which is wet much of the time. This garment can be quickly removed by pulling it over the head, When occasion requires the fisherman to jump into the sea. If methods have not changed, Peter had probably just climbed back into the boat after adjusting the net for drawing when he learned that it was Jesus who stood on the shore. He was literally naked and pulled on his coat before he went ashore (<a onClick="return mV(\'Jhn\',21,7);">Joh 21:7</a>).`<a href="./study/isbe/search.html?string=NET">NET</a>`133';
isbe[3461]='Fishpools`fish\'-pools:<P>This is a mistranslation. The Hebrew berekhoth (<a onClick="return mV(\'Sgs\',7,4);">So 7:4</a>) simply means "pools" (Revised Version); "fish" is quite unwarrantably introduced in the King James Version. In <a onClick="return mV(\'Isa\',19,10);">Isa 19:10</a>, again, instead of "all that make sluices and ponds for fish" (the King James Version), we should certainly read, with the Revised Version (British and American), "All they that work for hire shall be grieved in soul."``1';
isbe[3462]='Fit, Fitly`fit\'-li:<P>The word "fit" (adjective and verb) occurs a few times, representing nearly as many Hebrew and Greek words. the Revised Version (British and American) frequently alters, as in <a onClick="return mV(\'Lev\',16,21);">Le 16:21</a> (\'itti, "timely," "opportune," "ready"), where for "fit" it reads "in readiness," margin "appointed." In <a onClick="return mV(\'1Ch\',7,11);">1Ch 7:11</a> the Revised Version (British and American) has "that were able"; in <a onClick="return mV(\'Isa\',44,13);">Isa 44:13</a>, "shapeth"; in <a onClick="return mV(\'Pro\',24,27);">Pr 24:27</a>, "ready," etc. "Fitly" in <a onClick="return mV(\'Pro\',25,11);">Pr 25:11</a> is in the Revised Version, margin "in due season"; in <a onClick="return mV(\'Sgs\',5,12);">So 5:12</a>, "fitly set" is in the Revised Version, margin "sitting by full streams." In the New Testament "fit" is the translation of euthetos, "well placed" (<a onClick="return mV(\'Luk\',9,62);">Lu 9:62</a>; <a onClick="return mV(\'Luk\',14,35);">14:35</a>), of kathekon, "suitable" (<a onClick="return mV(\'Act\',22,22);">Ac 22:22</a>), and of katartizo, "to make quite ready" (<a onClick="return mV(\'Rom\',9,22);">Ro 9:22</a>, "vessels of wrath fitted unto destruction").``185';
isbe[3463]='Fitches`fich\'-iz (the English word "fitch" is the same as "vetch"):<P>(1) qetsach (<a onClick="return mV(\'Isa\',28,25,27);">Isa 28:25, 27</a>; the Revised Version, margin has "black cummin" (Nigella sativa)). This is the "nutmeg flower," an annual herb (Natural Order, Ranunculaceae), the black seeds of which are sprinkled over some kinds of bread in Palestin. They were used as a condiment by the ancient Greeks and Romans. These seeds have a warm aromatic flavor and are carminative in their properties, assisting digestion. They, like all such plants which readily yield their seed, are still beaten out with rods. The contrast between the stouter staff for the "fitches" and the lighter rod for the cummin is all the more noticeable when the great similarity of the two seeds is noticed.<P>(2) kuccemim (pl.) (<a onClick="return mV(\'Eze\',4,9);">Eze 4:9</a>) the Revised Version (British and American) "<a href="./study/isbe/search.html?string=SPELT">spelt</a>" (which see).``117';
isbe[3464]='Five`fiv (chamesh; pente).`<a href="./study/isbe/search.html?string=NUMBER">NUMBER</a>`1';
isbe[3465]='Flag`Two Hebrew words:<P>(1) cuph (<a onClick="return mV(\'Exd\',2,3,5);">Ex 2:3, 5</a>, "flags"; <a onClick="return mV(\'Isa\',19,6);">Isa 19:6</a>, "flags"; <a onClick="return mV(\'Jon\',2,5);">Jon 2:5</a>, "weeds"). This is apparently a general name which includes both the fresh-water weeds growing along a river bank and "seaweeds." The Red Sea was known as Yam cuph.<P>(2) \'achu (<a onClick="return mV(\'Gen\',41,2,18);">Ge 41:2, 18</a>, the King James Version "meadow," the Revised Version (British and American) "reed-grass"; <a onClick="return mV(\'Job\',8,11);">Job 8:11</a>, "Can the rush grow up without mire? Can the flag (margin "reed-grass") grow without water?"). Some such general term as "sedges" or "fens" would better meet the requirements.``1';
isbe[3466]='Flagon`flag\'-un:<P>The translation of \'ashishah, in the King James Version in <a onClick="return mV(\'2Sa\',6,19);">2Sa 6:19</a>; <a onClick="return mV(\'1Ch\',16,3);">1Ch 16:3</a>; <a onClick="return mV(\'Sgs\',2,5);">So 2:5</a>; <a onClick="return mV(\'Hsa\',3,1);">Ho 3:1</a>. In all, these passages the Revised Version (British and American) reads "cake of raisins" or "raisins." It was probably a pressed raisin cake. the King James Version and the Revised Version (British and American) read "flagons," in <a onClick="return mV(\'Isa\',22,24);">Isa 22:24</a> as a rendering of nebhalim, which is elsewhere (<a onClick="return mV(\'1Sa\',1,24);">1Sa 1:24</a>; <a onClick="return mV(\'1Sa\',10,3);">10:3</a>; <a onClick="return mV(\'2Sa\',16,1);">2Sa 16:1</a>, etc.) rendered "bottles," the Revised Version, margin "skins." These were the bags or bottles made of the whole skin of a kid, goat or other animal. the Revised Version (British and American) has "flagons" in <a onClick="return mV(\'Exd\',25,29);">Ex 25:29</a> and <a onClick="return mV(\'Exd\',37,16);">37:16</a> as translation of qeshawoth, a golden jug or jar used in the tabernacle from which the drink offerings were poured out. The same word is translated "cups" in <a onClick="return mV(\'Num\',4,7);">Nu 4:7</a>.``76';
isbe[3467]='Flake`flak (mappal, a word of uncertain meaning):<P>It is used in the sense of "refuse (husks) of the wheat" in <a onClick="return mV(\'Amo\',8,6);">Am 8:6</a>. With regard to the body we find it used in <a onClick="return mV(\'Job\',41,23);">Job 41:23</a> in the description of leviathan (the crocodile): "The flakes of his flesh are joined together: they are firm upon him; they cannot be moved." Baethgen in Kautzsch\'s translation of the Old Testament translates "Wampen," i.e. the collops or lateral folds of flesh and armored skin. A better translation would perhaps be: "the horny epidermic scales" of the body, differentiated from the bony dermal scutes of the back (Hebrew "channels of shields," "courses of scales"), which are mentioned in <a onClick="return mV(\'Job\',41,15);">Job 41:15</a> margin.``106';
isbe[3468]='Flame`flam (lahabh, and other forms from same root; phlox):<P>In <a onClick="return mV(\'Jdg\',13,20);">Jud 13:20</a> bis; <a onClick="return mV(\'Job\',41,21);">Job 41:21</a>; <a onClick="return mV(\'Isa\',29,6);">Isa 29:6</a>; <a onClick="return mV(\'Joe\',2,5);">Joe 2:5</a>, the word is lahabh. Various other words are translated "flame"; mas\'eth, "a lifting or rising up" (<a onClick="return mV(\'Jdg\',20,38,40);">Jud 20:38, 40</a> the King James Version), the Revised Version (British and American) "cloud" (of smoke); kalil, "completeness" (<a onClick="return mV(\'Jdg\',20,40);">Jud 20:40b</a> King James Version margin, "a holocaust, or offering wholly consumed by fire"; compare <a onClick="return mV(\'Lev\',6,15);">Le 6:15</a>); shalhebheth (<a onClick="return mV(\'Job\',15,30);">Job 15:30</a>; <a onClick="return mV(\'Sgs\',8,6);">So 8:6</a>; the American Standard Revised Version "a very flame of Yahweh," margin "or, a most vehement flame"; <a onClick="return mV(\'Eze\',20,47);">Eze 20:47</a>, the Revised Version (British and American) "the flaming flame"); shabhibh (<a onClick="return mV(\'Job\',18,5);">Job 18:5</a>; the Revised Version, margin); shebhibh, Aramaic (<a onClick="return mV(\'Dan\',3,22);">Da 3:22</a>; <a onClick="return mV(\'Dan\',7,9);">7:9</a>). In <a onClick="return mV(\'Psa\',104,4);">Ps 104:4</a> the American Standard Revised Version has "maketh...flames of fire his ministers"; the Revised Version (British and American) "flame" for "snare" (<a onClick="return mV(\'Pro\',29,8);">Pr 29:8</a>).<P>Figuratively: "Flame" is used to denote excitement (<a onClick="return mV(\'Pro\',29,8);">Pr 29:8</a> the Revised Version (British and American)), shame, astonishment, "faces of flame" (<a onClick="return mV(\'Isa\',13,8);">Isa 13:8</a>); in <a onClick="return mV(\'Rev\',1,14);">Re 1:14</a>, the glorified Christ is described as having eyes "as a flame of fire," signifying their searching purity (compare <a onClick="return mV(\'Rev\',2,18);">Re 2:18</a>; <a onClick="return mV(\'Rev\',19,12);">19:12</a>). Flame is also a symbol of God\'s wrath (<a onClick="return mV(\'Psa\',83,14);">Ps 83:14</a>; <a onClick="return mV(\'Isa\',5,24);">Isa 5:24</a>; <a onClick="return mV(\'Isa\',10,17);">10:17</a>).`<a href="./study/isbe/search.html?string=FIRE">FIRE</a>`185';
isbe[3469]='Flat Nose`(charum; Septuagint koloborin):<P>Used only in <a onClick="return mV(\'Lev\',21,18);">Le 21:18</a> as the name of a deformity which disqualified a member of a priestly family for serving the altar.<P>The root of the word signifies "to cut off" or "to cut flat," and in the Revised Version, margin "slit nose" is substituted. The condition indicated is most probably the depressed, flattened nose which so often accompanies harelip, especially in its double form.<P>A mere snub-nose can scarcely be regarded as a blemish of sufficient importance to unfit a priest for the service of "offering the bread of God"; but harelip, like blindness or the other congenital malformations or deformities enumerated in this passage, might well render a son of Aaron unfit or unsuitable for public religious duty.``107';
isbe[3470]='Flax`flaks pesheth, also pishtah; linon (<a onClick="return mV(\'Mat\',12,20);">Mt 12:20</a>)): The above Hebrew words are applied<P>(1) to the plant: "The flax was in bloom" (the King James Version "bolled"; <a onClick="return mV(\'Exd\',9,31);">Ex 9:31</a>);<P>(2) the "stalks of flax," literally, "flax of the tree," put on the roof to dry (<a onClick="return mV(\'Jos\',2,6);">Jos 2:6</a>);<P>(3) to the fine fibers used for lighting: the King James Version "tow," "flax," the Revised Version (British and American). "A dimly burning wick will he not quench" (<a onClick="return mV(\'Isa\',42,3);">Isa 42:3</a>); "They are quenched as a wick" (<a onClick="return mV(\'Isa\',43,17);">Isa 43:17</a>). The thought is perhaps of a scarcely lighted wick just kindled with difficulty from a spark.<P>(4) In <a onClick="return mV(\'Isa\',19,9);">Isa 19:9</a> mention is made of "combed flax," i.e. flax hackled ready for spinning (compare <a onClick="return mV(\'Hsa\',2,5,9);">Ho 2:5, 9</a>; <a onClick="return mV(\'Pro\',31,13);">Pr 31:13</a>). The reference in <a onClick="return mV(\'Jdg\',15,14);">Jud 15:14</a> is to flax twisted into cords.<P>(5) In <a onClick="return mV(\'Jdg\',16,9);">Jud 16:9</a>; <a onClick="return mV(\'Isa\',1,31);">Isa 1:31</a>, mention is made of ne\'oreth, "tow," literally, something "shaken off"—as the root implies—from flax.<P>(6) The plural form pishtim is used in many passages for linen, or linen garments, e.g. <a onClick="return mV(\'Lev\',13,47,48,52,59);">Le 13:47-48, 52, 59</a>; <a onClick="return mV(\'Deu\',22,11);">De 22:11</a>; <a onClick="return mV(\'Jer\',13,1);">Jer 13:1</a> ("linen girdle"); <a onClick="return mV(\'Eze\',44,17);">Eze 44:17</a>f. Linen was in the earliest historic times a favorite material for clothes. The Jewish priestly garments were of pure linen. Egyptian mummies were swathed in linen. Several other Hebrew words were used for linen garments.<P>Flax is the product of Linum usitatissimum, a herbaceous plant which has been cultivated from the dawn of history. It is perennial and grows to a height of 2 to 3 ft.; it has blue flowers and very fibrous stalks. The tough fibers of the latter, after the decay and removal of the softer woody and gummy material, make up the crude "flax." Linseed, linseed oil and oilcake are useful products of the same plant.`<a href="./study/isbe/search.html?string=LINEN">LINEN</a>`117';
isbe[3471]='Flaying`fla\'-ing.`<a href="./study/isbe/search.html?string=PUNISHMENTS">PUNISHMENTS</a>`1';
isbe[3472]='Flea`fle (par\'osh; compare Arabic barghut, "flea," and barghash, "mosquito" (<a onClick="return mV(\'1Sa\',24,14);">1Sa 24:14</a>; <a onClick="return mV(\'1Sa\',26,20);">26:20</a>); kinnim (<a onClick="return mV(\'Exd\',8,16);">Ex 8:16</a>), "lice," the Revised Version, margin "sandflies" or "fleas"; Septuagint skniphes, probably best rendered "gnat"; see <a href="./study/isbe/search.html?string=GNAT">GNAT</A>; <a href="./study/isbe/search.html?string=LICE">LICE</a>):<P>In <a onClick="return mV(\'1Sa\',24,\'1-\');">1Sa 24</a> Saul seeks David in the wilderness of En-gedi, and David, after cutting off the skirt of Saul\'s robe in the cave, calls out to him, "After whom is the king of Israel come out? after whom dost thou pursue? after a dead dog, after a flea" (<a onClick="return mV(\'1Sa\',24,14);">24:14</a>). Again in <a onClick="return mV(\'1Sa\',26,20);">1Sa 26:20</a> Saul seeks David in the wilderness of Ziph, and David after taking the spear and cruse from beside Saul while he slept, cries out to him, "...the king of Israel is come out to seek a flea, as when one doth hunt a partridge in the mountains." The flea is here used as a symbol of David\'s insignificance, coupled perhaps, in the second passage, with a thought of the difficulty that Saul had in laying hands on him. In Encyclopedia Biblica Cheyne finds fault with a similar interpretation given in DB on the ground that it is absurd that David should refer to hunting "a single flea," and proposes to change par\'osh \'echadh "a flea," to pere\' midhbar, "wild ass of the desert." The writer will only say that no observant resident of Palestine would consider the textual alteration to be called for.<P>Linnaeus recognized two species of flea, Pulex irritans, the common parasite of man, and Pulex (Sarcopsylla) penetrans, the tropical and sub-tropical jigger flea. More than a hundred species are now listed, and the recent discovery that certain fleas are instrumental in the transmission of the plague has given a new impetus to the study of these tiny pests. A flea that is often commoner in houses than Pulex irritans is the "dog and cat flea," variously known as Pulex serraticeps, Pulex canis, Pulex felis or Ctenocephalus canis.``37';
isbe[3473]='Flee`fle.`<a href="./study/isbe/search.html?string=FLY">FLY</a>`1';
isbe[3474]='Fleece`fles.`<a href="./study/isbe/search.html?string=GIDEON">GIDEON</a>; <a href="./study/isbe/search.html?string=SHEEP">SHEEP</a>; <a href="./study/isbe/search.html?string=WOOL">WOOL</a>`1';
isbe[3475]='Flesh`@basar, she\'er):<P>1. Etymology:<P>Used in all senses of the word, the latter, however, most frequently in the sense of kin, family, relationship (compare sha\'arah, "kins-woman," <a onClick="return mV(\'Lev\',18,17);">Le 18:17</a>): <a onClick="return mV(\'Lev\',18,6);">Le 18:6</a>; <a onClick="return mV(\'Lev\',25,49);">25:49</a>; <a onClick="return mV(\'Pro\',11,17);">Pr 11:17</a>; <a onClick="return mV(\'Jer\',51,35);">Jer 51:35</a>, and probably <a onClick="return mV(\'Psa\',73,26);">Ps 73:26</a>. In all other places she\'er means "flesh" = body (<a onClick="return mV(\'Pro\',5,11);">Pr 5:11</a>) or = food (<a onClick="return mV(\'Psa\',78,20,27);">Ps 78:20, 27</a>; <a onClick="return mV(\'Mic\',3,2,3);">Mic 3:2-3</a>). Tibhchah, is "(slaughtered) flesh for food," "butcher\'s meat" (<a onClick="return mV(\'1Sa\',25,11);">1Sa 25:11</a>). The word \'eshpar, found only in two parallel passages (<a onClick="return mV(\'2Sa\',6,19);">2Sa 6:19</a> = <a onClick="return mV(\'1Ch\',16,3);">1Ch 16:3</a>), is of very uncertain meaning. The English versions translate it with "a good piece (portion) of flesh," the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) with "a piece of roast meat," others with "a portion of flesh" and "a measure of wine." It probably means simply "a measured portion." lachum, literally, "eaten," then food (compare lechem, "bread"), has been rarely specialized as flesh or meat (compare Arabic lachm, "meat," "flesh," so in <a onClick="return mV(\'Zep\',1,17);">Ze 1:17</a>, where it stands in parallelism with "blood"). The Greek terms are sarx, and kreas, the latter always meaning "butcher\'s meat" (<a onClick="return mV(\'Rom\',14,21);">Ro 14:21</a>; <a onClick="return mV(\'1Cr\',8,13);">1Co 8:13</a>).<P>We can distinguish the following varieties of meaning in Biblical language:<P>2. Ordinary Sense:<P>In a physical sense, the chief substance of the animal body, whether used for food and sacrifice, or not; also the flesh of man (<a onClick="return mV(\'Gen\',2,21);">Ge 2:21</a>; <a onClick="return mV(\'Exd\',21,10);">Ex 21:10</a>; <a onClick="return mV(\'Isa\',31,3);">Isa 31:3</a>; <a onClick="return mV(\'Eze\',23,20);">Eze 23:20</a>; <a onClick="return mV(\'1Cr\',15,39);">1Co 15:39</a>; <a onClick="return mV(\'Rev\',19,18,21);">Re 19:18, 21</a>).<P>3. The Body:<P>The whole body. This meaning is the extension of the preceding (pars pro toto). This is indicated by the Septuagint, where basar is often translated by the plural hai sarkes (<a onClick="return mV(\'Gen\',40,19);">Ge 40:19</a>; <a onClick="return mV(\'Num\',12,12);">Nu 12:12</a>; <a onClick="return mV(\'Job\',33,25);">Job 33:25</a>), and occasionally by soma, i.e. "body" (<a onClick="return mV(\'Lev\',15,2);">Le 15:2</a>; <a onClick="return mV(\'1Ki\',21,27);">1Ki 21:27</a>). This meaning is also very clear in passages like the following: <a onClick="return mV(\'Exd\',4,7);">Ex 4:7</a>; <a onClick="return mV(\'Lev\',17,14);">Le 17:14</a>; <a onClick="return mV(\'Num\',8,7);">Nu 8:7</a>; <a onClick="return mV(\'2Ki\',4,34);">2Ki 4:34</a>; <a onClick="return mV(\'Pro\',5,11);">Pr 5:11</a>, where basar and she\'er are combined; and <a onClick="return mV(\'Pro\',14,30);">Pr 14:30</a>; <a onClick="return mV(\'Ecc\',12,12);">Ec 12:12</a>.<P>4. The Term "All Flesh":<P>Flesh, as the common term for living things, animals and men, especially the latter (<a onClick="return mV(\'Gen\',6,13,17,19);">Ge 6:13, 17, 19</a>; <a onClick="return mV(\'Num\',16,22);">Nu 16:22</a>; <a onClick="return mV(\'Jer\',12,12);">Jer 12:12</a>; <a onClick="return mV(\'Mar\',13,20);">Mr 13:20</a>); often in the phrase "all flesh" (<a onClick="return mV(\'Psa\',65,2);">Ps 65:2</a>; <a onClick="return mV(\'Isa\',40,5,6);">Isa 40:5-6</a>; <a onClick="return mV(\'Jer\',25,31);">Jer 25:31</a>; <a onClick="return mV(\'Eze\',20,48);">Eze 20:48</a>; <a onClick="return mV(\'Joe\',2,28);">Joe 2:28</a>; <a onClick="return mV(\'Luk\',3,6);">Lu 3:6</a>).<P>5. As Opposed to the Spirit:<P>Flesh as opposed to the spirit, both of which were comprised in the preceding meaning (<a onClick="return mV(\'Gen\',6,3);">Ge 6:3</a>; <a onClick="return mV(\'Psa\',16,9);">Ps 16:9</a>; <a onClick="return mV(\'Luk\',24,39);">Lu 24:39</a>, where "flesh and bones" are combined; <a onClick="return mV(\'Jhn\',6,63);">Joh 6:63</a>). Thus we find in <a onClick="return mV(\'Jhn\',1,14);">Joh 1:14</a>, "The Word became flesh"; <a onClick="return mV(\'1Ti\',3,16);">1Ti 3:16</a>, "He who was manifested in the flesh"; <a onClick="return mV(\'1Jo\',4,2);">1Joh 4:2</a>, and all passages where the incarnation of Christ is spoken of. The word in this sense approaches the meaning of "earthly life," as in <a onClick="return mV(\'Phl\',1,22,24);">Php 1:22, 24</a>, "to live in the flesh," "to abide in the flesh"; compare <a onClick="return mV(\'Phm\',1,16);">Phm 1:16</a> and perhaps <a onClick="return mV(\'2Cr\',5,16);">2Co 5:16</a>. Under this meaning we may enumerate expressions such as "arm of flesh" (<a onClick="return mV(\'2Ch\',32,8);">2Ch 32:8</a>; <a onClick="return mV(\'Jer\',17,5);">Jer 17:5</a>), "eyes of flesh" (<a onClick="return mV(\'Job\',10,4);">Job 10:4</a>), etc. Frequently the distinction is made to emphasize the weakness or inferiority of the flesh, as opposed to the superiority of the spirit (<a onClick="return mV(\'Isa\',31,3);">Isa 31:3</a>; <a onClick="return mV(\'Mat\',26,41);">Mt 26:41</a>; <a onClick="return mV(\'Mar\',14,38);">Mr 14:38</a>; <a onClick="return mV(\'Rom\',6,19);">Ro 6:19</a>). In this connection we mention also the expression "flesh and blood," a phrase borrowed from rabbinical writings and phraseology (see also Sirach 14:18, "the generation of flesh and blood," and <span class="noTag">17:31</span>, "man whose desire is flesh and blood" the King James Version). The expression does not convey, as some have supposed, the idea of inherent sinfulness of the flesh (a doctrine borrowed by Gnostic teachers from oriental sources), but merely the idea of ignorance and frailty in comparison with the possibilities of spiritual nature. The capabilities of our earthly constitution do not suffice to reveal unto us heavenly truths; these must always come to us from above.<P>So Peter\'s first recognition of the Divine sonship of Jesus did not proceed from a logical conviction based upon outward facts acting upon his mind, but was based upon a revelation from God vouchsafed to his inner consciousness. Christ says therefore to him: "Blessed art thou, Simon Bar-Jonah: for flesh and blood hath not revealed it unto thee, but my Father who is in heaven" (<a onClick="return mV(\'Mat\',16,17);">Mt 16:17</a>). Similarly the kingdom of God, being a realm of perfect spiritual submission to God, cannot be inherited by flesh and blood (<a onClick="return mV(\'1Cr\',15,50);">1Co 15:50</a>), nor was the richly endowed mind a competent tribunal to which Paul could refer his heaven-wrought conviction of his great salvation and the high calling to be a witness and apostle of Christ, so he did well that he "conferred not with flesh and blood" (<a onClick="return mV(\'Gal\',1,16);">Ga 1:16</a>). That "flesh and blood" does not imply a sense of inherent sinfulness is moreover shown in all passages where Christ is declared a partaker of such nature (<a onClick="return mV(\'Eph\',6,12);">Eph 6:12</a>; <a onClick="return mV(\'Hbr\',2,14);">Heb 2:14</a>, where, however, we find in the original text the inverted phrase "blood and flesh").<P>6. Applied to the Carnal Nature:<P>Flesh in the sense of carnal nature (sarkikos, "carnal"; the King James Version uses sarkinos in <a onClick="return mV(\'Rom\',7,14);">Ro 7:14</a>). Human nature, being inferior to the spiritual, is to be in subjection to it. If man refuses to be under this higher law, and as a free agent permits the lower nature to gain an ascendancy over the spirit, the "flesh" becomes a revolting force (<a onClick="return mV(\'Gen\',6,3,12);">Ge 6:3, 12</a>; <a onClick="return mV(\'Jhn\',1,13);">Joh 1:13</a>; <a onClick="return mV(\'Rom\',7,14);">Ro 7:14</a>; <a onClick="return mV(\'1Cr\',3,1,3);">1Co 3:1, 3</a>; <a onClick="return mV(\'Col\',2,18);">Col 2:18</a>; <a onClick="return mV(\'1Jo\',2,16);">1Joh 2:16</a>). Thus, the fleshly or carnal mind, i.e. a mind in subjection to carnal nature, is opposed to the Divine spirit, who alone is a sufficient corrective, Christ having secured for us the power of overcoming (<a onClick="return mV(\'Rom\',8,3);">Ro 8:3</a>), if we manifest a deep desire and an earnest endeavor to overcome (<a onClick="return mV(\'Gal\',5,17,18);">Ga 5:17-18</a>).<P>7. In the Sense of Relationship:<P>Flesh in the sense of relationship, tribal connection, kith and kin. For examples, see what has been said above on Hebrew she\'er. The following passages are a few of those in which basar is used: <a onClick="return mV(\'Gen\',2,24);">Ge 2:24</a>; <a onClick="return mV(\'Gen\',37,27);">37:27</a>; <a onClick="return mV(\'Job\',2,5);">Job 2:5</a>; compare the New Testament passages: <a onClick="return mV(\'Mat\',19,5,6);">Mt 19:5-6</a>; <a onClick="return mV(\'Rom\',1,3);">Ro 1:3</a>; <a onClick="return mV(\'Rom\',9,3,5,8);">9:3, 5, 8</a>. The expressions "bone" and "flesh" are found in combination (<a onClick="return mV(\'Gen\',2,23);">Ge 2:23</a>; <a onClick="return mV(\'Gen\',29,14);">29:14</a>; <a onClick="return mV(\'Jdg\',9,2);">Jud 9:2</a>; <a onClick="return mV(\'2Sa\',5,1);">2Sa 5:1</a>; <a onClick="return mV(\'2Sa\',19,12,13);">19:12-13</a>; <a onClick="return mV(\'Eph\',5,31);">Eph 5:31</a>, the latter in some manuscripts only).<P>8. Other Meanings:<P>Some other subdivisions of meanings might be added, for example where "flesh" takes almost the place of "person," as in <a onClick="return mV(\'Col\',2,1);">Col 2:1</a>: "as many as have not seen my face in the flesh," i.e. have not known me personally, or <a onClick="return mV(\'Col\',2,5);">2:5</a>, "absent in the flesh, yet am I with you in the spirit," etc.``106';

isbe[3477]='Flesh-Hook`flesh\'-hook (mazlegh, and plural mizlaghoth):<P>One of the implements used around the sacrificial altar. According to Divine direction given to Moses (<a onClick="return mV(\'Exd\',27,3);">Ex 27:3</a>; <a onClick="return mV(\'Exd\',38,3);">38:3</a>), it was to be made of brass, but later David felt impelled by "the Spirit" or "in his spirit" to determine that for use in the magnificent Temple of Solomon it should be made of gold (<a onClick="return mV(\'1Ch\',28,17);">1Ch 28:17</a>). But Huram made it, with other altar articles, of "bright brass" (<a onClick="return mV(\'2Ch\',4,16);">2Ch 4:16</a>).<P>In Samuel\'s time, it was made with three hook-shaped tines, and was used in taking out the priests\' share of the meat offering (<a onClick="return mV(\'1Sa\',2,13,14);">1Sa 2:13-14</a>). With the other altar utensils, it was in the special charge of the Kohathites (<a onClick="return mV(\'Num\',4,14);">Nu 4:14</a>). The hooks mentioned in <a onClick="return mV(\'Eze\',40,43);">Eze 40:43</a> were altogether different and for another purpose.`<a href="./study/isbe/search.html?string=HOOK">HOOK</a>`41';
isbe[3478]='Flesh-Pot`flesh\'-pot (cir ha-basar, "pot of the flesh"):<P>One of the six kinds of cooking utensils spoken of as pots or pans or caldrons or basins. Probably usually made of bronze or earthenware. The only mention of flesh-pots, specifically so named, is in <a onClick="return mV(\'Exd\',16,3);">Ex 16:3</a>.`<a href="./study/isbe/search.html?string=FOOD">FOOD</a>`1';
isbe[3479]='Flies`fliz.`<a href="./study/isbe/search.html?string=FLY;+FLIES">FLY</a>`1';
isbe[3480]='Flint`flint (challamish (<a onClick="return mV(\'Deu\',8,15);">De 8:15</a>; <a onClick="return mV(\'Deu\',32,13);">32:13</a>; <a onClick="return mV(\'Job\',28,9);">Job 28:9</a>; <a onClick="return mV(\'Psa\',114,8);">Ps 114:8</a>), tsor (<a onClick="return mV(\'Exd\',4,25);">Ex 4:25</a>; <a onClick="return mV(\'Eze\',3,9);">Eze 3:9</a>), tser (<a onClick="return mV(\'Isa\',5,28);">Isa 5:28</a>), tsur (<a onClick="return mV(\'Job\',22,24);">Job 22:24</a>; <a onClick="return mV(\'Psa\',89,43);">Ps 89:43</a>), tsurim (<a onClick="return mV(\'Jos\',5,2);">Jos 5:2</a>f); (= kechlex "pebble"), kochlax (1Macc 10:73)):<P>The word challamish signifies a hard stone, though not certainly flint, and is used as a figure for hardness in <a onClick="return mV(\'Isa\',50,7);">Isa 50:7</a>, "Therefore have I set my face like a flint." A similar use of tsor is found in <a onClick="return mV(\'Eze\',3,9);">Eze 3:9</a>, "As an adamant harder than flint have I made thy forehead," and <a onClick="return mV(\'Isa\',5,28);">Isa 5:28</a>, "Their horses\' hoofs shall be accounted as flint"; and of tsela\' in <a onClick="return mV(\'Jer\',5,3);">Jer 5:3</a>, "They have made their faces harder than a rock." The same three words are used of the rock from which Moses drew water in the wilderness: challamish (<a onClick="return mV(\'Deu\',8,15);">De 8:15</a>; <a onClick="return mV(\'Psa\',114,8);">Ps 114:8</a>); tsur (<a onClick="return mV(\'Exd\',17,6);">Ex 17:6</a>; <a onClick="return mV(\'Deu\',8,15);">De 8:15</a>; <a onClick="return mV(\'Psa\',78,20);">Ps 78:20</a>; <a onClick="return mV(\'Isa\',48,21);">Isa 48:21</a>); cela\' (<a onClick="return mV(\'Num\',20,8);">Nu 20:8</a>; <a onClick="return mV(\'Neh\',9,15);">Ne 9:15</a>; <a onClick="return mV(\'Psa\',78,16);">Ps 78:16</a>).<P>Tsur and cela\' are used oftener than challamish for great rocks and cliffs, but tsur is used also for flint knives in <a onClick="return mV(\'Exd\',4,25);">Ex 4:25</a>, "Then Zipporah took a flint (the King James Version "sharp stone"), and cut off the foreskin of her son," and in <a onClick="return mV(\'Jos\',5,2);">Jos 5:2</a>f; "Yahweh said unto Joshua, Make thee knives of flint (the King James Version "sharp knives"), and circumcise again the children of Israel the second time." Surgical implements of flint were used by the ancient Egyptians, and numerous flint chippings with occasional flint implements are found associated with the remains of early man in Syria and Palestine. Flint and the allied mineral, chert, are found in great abundance in the limestone rocks of Syria, Palestine and Egypt.`<a href="./study/isbe/search.html?string=ROCK">ROCK</a>`37';
isbe[3481]='Float (Flote)`flot.`<a href="./study/isbe/search.html?string=RAFT">RAFT</a>; <a href="./study/isbe/search.html?string=SHIPS+AND+BOATS">SHIPS AND BOATS</a>`1';

isbe[3483]='Flood`flud:<P>In the King James Version not less than 13 words are rendered "flood," though in the Revised Version (British and American) we find in some passages "river," "stream," "tempest," etc. The word is used for: the deluge of Noah, mabbul (<a onClick="return mV(\'Gen\',6,17);">Ge 6:17</a>ff); kataklusmos (<a onClick="return mV(\'Mat\',24,38,39);">Mt 24:38-39</a>; <a onClick="return mV(\'Luk\',17,27);">Lu 17:27</a>); the waters of the Red Sea, nazal (<a onClick="return mV(\'Exd\',15,8);">Ex 15:8</a>); the Euphrates, nahar, "Your fathers dwelt of old time on the other side of the flood". (the Revised Version (British and American) "beyond the River" <a onClick="return mV(\'Jos\',24,2);">Jos 24:2</a>): the Nile, ye\'or, "the flood (the Revised Version (British and American) "River") of Egypt" (<a onClick="return mV(\'Amo\',8,8);">Am 8:8</a>); the Jordan, nahar, "They went through the flood (the Revised Version (British and American) "river") on foot" (<a onClick="return mV(\'Psa\',66,6);">Ps 66:6</a>); torrent, zerem, "as a flood (the Revised Version (British and American) "tempest") of mighty waters" (<a onClick="return mV(\'Isa\',28,2);">Isa 28:2</a>); potamos, "The rain descended and the floods came" (<a onClick="return mV(\'Mat\',7,25);">Mt 7:25</a>); plemmura, "When a flood arose, the stream brake against that house" (<a onClick="return mV(\'Luk\',6,48);">Lu 6:48</a>).<P>Figurative: nachal, "The floods of ungodly men (the Revised Version (British and American) "ungodliness," the Revised Version, margin "Hebrew Belial") made me afraid" (<a onClick="return mV(\'2Sa\',22,5);">2Sa 22:5</a>; <a onClick="return mV(\'Psa\',18,4);">Ps 18:4</a>); also \'or (<a onClick="return mV(\'Amo\',8,8);">Am 8:8</a> (the King James Version)); shibboleth (<a onClick="return mV(\'Psa\',69,2);">Ps 69:2</a>); sheteph (<a onClick="return mV(\'Dan\',11,22);">Da 11:22</a> (the King James Version)); sheteph (<a onClick="return mV(\'Psa\',32,6);">Ps 32:6</a> (the King James Version)); potamophoretos (<a onClick="return mV(\'Rev\',12,15);">Re 12:15</a> (the King James Version)).`<a href="./study/isbe/search.html?string=DELUGE+OF+NOAH">DELUGE OF NOAH</a>`37';
isbe[3484]='Floor`flor.`<a href="./study/isbe/search.html?string=HOUSE">HOUSE</a>; <a href="./study/isbe/search.html?string=THRESHING-FLOOR">THRESHING-FLOOR</a>`1';
isbe[3485]='Flote (Float)``<a href="./study/isbe/search.html?string=RAFT">RAFT</a>; <a href="./study/isbe/search.html?string=SHIPS+AND+BOATS">SHIPS AND BOATS</a>`1';
isbe[3486]='Flour`flour.`<a href="./study/isbe/search.html?string=BREAD">BREAD</a>; <a href="./study/isbe/search.html?string=FOOD">FOOD</a>`1';
isbe[3487]='Flourish`flur\'-ish (parach, tsuts; anathallo):<P>The translation of parach, "to break forth" (<a onClick="return mV(\'Psa\',72,7);">Ps 72:7</a>; <a onClick="return mV(\'Psa\',92,12,13);">92:12-13</a>; <a onClick="return mV(\'Pro\',14,11);">Pr 14:11</a>; <a onClick="return mV(\'Isa\',66,14);">Isa 66:14</a>; <a onClick="return mV(\'Sgs\',6,11);">So 6:11</a>; <a onClick="return mV(\'Sgs\',7,12);">7:12</a>; the Revised Version (British and American) "budded"); of tsuts "to bloom" (<a onClick="return mV(\'Psa\',72,16);">Ps 72:16</a>; <a onClick="return mV(\'Psa\',90,6);">90:6</a>; <a onClick="return mV(\'Psa\',92,7);">92:7</a>; <a onClick="return mV(\'Psa\',103,15);">103:15</a>; <a onClick="return mV(\'Psa\',132,18);">132:18</a>); ra\'anan, "green," "fresh," is translated "flourishing" in <a onClick="return mV(\'Psa\',92,14);">Ps 92:14</a>, the Revised Version (British and American) "green," and ra\'anan, Aramaic in <a onClick="return mV(\'Dan\',4,4);">Da 4:4</a>; nubh, "to sprout" (<a onClick="return mV(\'Zec\',9,17);">Zec 9:17</a>, the King James Version "cheerful").<P>In an interesting passage (<a onClick="return mV(\'Ecc\',12,5);">Ec 12:5</a> the King James Version), the Hiphil future of na\'ats, meaning properly "to pierce or strike," hence, to slight or reject, is translated "flourish"; it is said of the old man "The almond tree shall flourish," the Revised Version (British and American) "blossom" (so Ewald, Delitzsch, etc.); na\'ats has nowhere else this meaning; it is frequently rendered "contemn;" "despise," etc. Other renderings are, "shall cause loathing" (Gesenius, Knobel, etc.), "shall be despised," i.e. the hoary head; "The almond tree shall shake off its flowers," the silvery hairs falling like the fading white flowers of the almond tree; by others it is taken to indicate "sleeplessness," the name of the almond tree (shaqedh) meaning the watcher or early riser (compare <a onClick="return mV(\'Jer\',1,11);">Jer 1:11</a>, "a rod of an almond-tree," literally, "a wakeful (or early) tree"), the almond being the first of the trees to wake from the sleep of winter.<P>"Flourish" appears once only in the New Testament, in the King James Version, as translation of anathallo, "to put forth anew," or "to make put forth anew" (<a onClick="return mV(\'Phl\',4,10);">Php 4:10</a>): "Your care for me hath flourished again," the Revised Version (British and American) "Ye have revived your thought for me."`<a href="./study/isbe/search.html?string=ALMOND">ALMOND</a>`185';
isbe[3488]='Flowers`flou\'-erz (BLOOM; BLOSSOM, etc.):<P>(1) gibh\'ol, literally, "a small cup," hence, calyx or corolla of a flower (<a onClick="return mV(\'Exd\',9,31);">Ex 9:31</a>, "The flax was in bloom").<P>(2) nets (<a onClick="return mV(\'Gen\',40,10);">Ge 40:10</a>, nitstsah, "a flower" or "blossom"; <a onClick="return mV(\'Job\',15,33);">Job 15:33</a>; <a onClick="return mV(\'Isa\',18,5);">Isa 18:5</a>). These words are used of the early berries of the vine or olive.<P>(3) nitstsan, "a flower"; plural only, nitstsanim (<a onClick="return mV(\'Sgs\',2,12);">So 2:12</a>, "The flowers appear on the earth").<P>(4) perach, root to "burst forth" expresses an early stage of flowering; "blossom" (<a onClick="return mV(\'Isa\',5,24);">Isa 5:24</a>; <a onClick="return mV(\'Isa\',18,5);">18:5</a>); "flower" (<a onClick="return mV(\'Nah\',1,4);">Na 1:4</a>, "The flower of Lebanon languisheth"). Used of artificial flowers in candlesticks (<a onClick="return mV(\'Exd\',25,31);">Ex 25:31</a>ff).<P>(5) tsits, "flower" (<a onClick="return mV(\'Isa\',40,6);">Isa 40:6</a>); plural tsitstsim, flowers as architectural ornaments (<a onClick="return mV(\'1Ki\',6,18);">1Ki 6:18</a>); tsitsah, "the fading flower of his glorious beauty" (<a onClick="return mV(\'Isa\',28,1,4);">Isa 28:1, 4</a>; also <a onClick="return mV(\'Num\',17,8);">Nu 17:8</a>; <a onClick="return mV(\'Job\',14,2);">Job 14:2</a>, etc.).<P>(6) anthos, in Septuagint equivalent of all the Hebrew words (<a onClick="return mV(\'Jam\',1,10,11);">Jas 1:10-11</a>; <a onClick="return mV(\'1Pe\',1,24);">1Pe 1:24</a>).<P>The beauty of the profusion of flowers which cover Palestine every spring receives but scant reference in the Old Testament; <a onClick="return mV(\'Sgs\',2,12);">So 2:12</a> is perhaps the only clear reference. It is noticeable that the native of Syria thinks little of flowers unless it be for their perfume. our Lord\'s reference to the flowers ("lilies") is well known (<a onClick="return mV(\'Mat\',6,28);">Mt 6:28</a>; <a onClick="return mV(\'Luk\',12,27);">Lu 12:27</a>). For details of the flowers of modern Palestine, see <a href="./study/isbe/search.html?string=BOTANY">BOTANY</A>. The aptness of the expression "flower of the field" for a type of the evanescence of human life (<a onClick="return mV(\'Job\',14,2);">Job 14:2</a>; <a onClick="return mV(\'Psa\',103,15);">Ps 103:15</a>; <a onClick="return mV(\'Isa\',40,6);">Isa 40:6</a>; <a onClick="return mV(\'Jam\',1,10);">Jas 1:10</a>) is the more impressive in a land like Palestine where the annual display of wild flowers, so glorious for a few short weeks, is followed by such desolation. The fresh and brilliant colors fade into masses of withered leaves (not uncommonly cleared by burning), and then even these are blown, away, so that but bare, cracked and baked earth remains for long months where once all was beauty, color and life.``117';
