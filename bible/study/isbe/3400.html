isbe[3492]='Fly`(Verb; \'uph petaomai, or, contracted, ptaomai):<P>Used in preference to "flee" when great speed is to be indicated. "To fly" is used:<p>(1) Literally, of birds, \'uph (<a onClick="return mV(\'Gen\',1,20);">Ge 1:20</a>; <a onClick="return mV(\'Psa\',55,6);">Ps 55:6</a>); da\'ah (<a onClick="return mV(\'Deu\',28,49);">De 28:49</a>), of sparks (<a onClick="return mV(\'Job\',5,7);">Job 5:7</a>); of the arrow (<a onClick="return mV(\'Psa\',91,5);">Ps 91:5</a>); of the seraphim (<a onClick="return mV(\'Isa\',6,2,6);">Isa 6:2, 6</a>); of an angel (<a onClick="return mV(\'Dan\',9,21);">Da 9:21</a>, ya\'aph, "to be caused to fly"); of swift action or movement (<a onClick="return mV(\'Psa\',18,10);">Ps 18:10</a>; <a onClick="return mV(\'Jer\',48,40);">Jer 48:40</a>); of people (<a onClick="return mV(\'Isa\',11,14);">Isa 11:14</a>); of a fleet (<a onClick="return mV(\'Isa\',60,8);">Isa 60:8</a>; <a onClick="return mV(\'1Sa\',15,19);">1Sa 15:19</a>; <a onClick="return mV(\'1Sa\',14,32);">14:32</a>, \'asah, "to do," etc.).<p>(2) Figuratively, of a dream (<a onClick="return mV(\'Job\',20,8);">Job 20:8</a>); of man\'s transitory life (<a onClick="return mV(\'Psa\',90,10);">Ps 90:10</a>); of riches (<a onClick="return mV(\'Pro\',23,5);">Pr 23:5</a>); of national glory (<a onClick="return mV(\'Hsa\',9,11);">Ho 9:11</a>).<P>For "fly" the Revised Version (British and American) has "soar" (<a onClick="return mV(\'Job\',39,26);">Job 39:26</a>) "fly down" (<a onClick="return mV(\'Isa\',11,14);">Isa 11:14</a>); for "flying" (<a onClick="return mV(\'Isa\',31,5);">Isa 31:5</a>) the American Standard Revised Version has "hovering."``185';
isbe[3493]='Fly; Flies`fli fliz \'arobh (<a onClick="return mV(\'Exd\',8,21);">Ex 8:21</a>ff; <a onClick="return mV(\'Psa\',78,45);">Ps 78:45</a>; <a onClick="return mV(\'Psa\',105,31);">105:31</a>; Septuagint kunomuia; "dog-fly"), zebhubh (<a onClick="return mV(\'Ecc\',10,1);">Ec 10:1</a>; <a onClick="return mV(\'Isa\',7,18);">Isa 7:18</a>; Septuagint muiai, "flies"); compare ba\'al-zebhubh, "Baal-zebub" (<a onClick="return mV(\'2Ki\',1,2);">2Ki 1:2</a>ff), and beelzeboul, "Beelzebul," or beelzeboub, "Beelzebub" (<a onClick="return mV(\'Mat\',10,25);">Mt 10:25</a>; <a onClick="return mV(\'Mat\',12,24,27);">12:24, 27</a>; <a onClick="return mV(\'Luk\',11,15,18,19);">Lu 11:15, 18-19</a>); compare Arabic dhubab, "fly" or "bee"; (Note: "dh" for Arabic dhal, pronounced like "d" or "z" or like th in "the"):<P>The references in Psalms as well as in Exodus are to the plague of flies, and the word \'arobh is rendered "swarm of flies" throughout, except in <a onClick="return mV(\'Psa\',78,45);">Ps 78:45</a>; <a onClick="return mV(\'Psa\',105,31);">105:31</a> the King James Version, where we find "divers sorts of flies" (compare Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) omne genus muscarum). In <a onClick="return mV(\'Exd\',8,21);">Ex 8:21</a> we read, "I will send swarms of flies upon thee, and upon thy servants, and upon thy people, and into thy houses: and the houses of the Egyptians shall be full of swarms of flies, and also the ground whereon they are"; in <a onClick="return mV(\'Exd\',8,24);">Ex 8:24</a>, "...the land was corrupted by reason of the swarms of flies"; in <a onClick="return mV(\'Psa\',78,45);">Ps 78:45</a>, "He sent among them swarms of flies, which devoured them." There has been much speculation as to what the insects were, but all the texts cited, including even <a onClick="return mV(\'Psa\',78,45);">Ps 78:45</a>, may apply perfectly well to the common house fly (Musca domestica). Some species of blue-bottle fly (Calliphora) might also suit.<P>The other word, zebhubh, occurs in <a onClick="return mV(\'Ecc\',10,1);">Ec 10:1</a>, "Dead flies cause the oil of the perfumer to send forth an evil odor; so doth a little folly outweigh wisdom and honor"; and <a onClick="return mV(\'Isa\',7,18);">Isa 7:18</a>, "And it shall come to pass in that day, that Yahweh will hiss for the fly that is in the uttermost part of the rivers of Egypt, and for the bee that is in the land of Assyria:" The house fly would fit perfectly the reference in each, but that in Isaiah would seem to suggest rather one of the horse flies (Tabanidae) or gad flies (Oestridae). Whatever fly may be meant, it is used as a symbol for the military power of Egypt, as the bee for that of Assyria.<P>Owing to deficiencies in public and private hygiene, and also for other reasons, house flies and others are unusually abundant in Palestine and Egypt and are agents in the transmission of cholera, typhoid fever, ophthalmia and anthrax. Glossina morsitans, the tsetse fly, which is fatal to many domestic animals, and Glossina palpalis which transmits the sleeping sickness, are abundant in tropical Africa, but do not reach Egypt proper.`<a href="./study/isbe/search.html?string=PLAGUE">PLAGUE</a>`37';
isbe[3494]='Foal`fol.`<a href="./study/isbe/search.html?string=COLT">COLT</a>`1';
isbe[3495]='Foam`fom (qetseph (<a onClick="return mV(\'Hsa\',10,7);">Ho 10:7</a>); aphros (<a onClick="return mV(\'Luk\',9,39);">Lu 9:39</a>), aphrizo (<a onClick="return mV(\'Mar\',9,18,20);">Mr 9:18, 20</a>), epaphrizo (<a onClick="return mV(\'Jud\',1,13);">Jude 1:13</a>)):<P>Qetseph from qatsaph, "to break to pieces," or "to break forth into anger," "to be angry," occurs often in the sense of "wrath" or "anger" (e.g. <a onClick="return mV(\'Num\',1,53);">Nu 1:53</a>; <a onClick="return mV(\'Psa\',38,1);">Ps 38:1</a>, etc.), and in this passage has been rendered "twigs" or "chips," "As for Samaria, her king is cut off, as foam (the Revised Version, margin "twigs") upon the water" (<a onClick="return mV(\'Hsa\',10,7);">Ho 10:7</a>). The other references are from the New Testament. In Jude, evil-doers or false teachers are compared to the "wild waves of the sea, foaming out their own shame." In Mark and Luke the references are to the boy with a dumb spirit who foamed at the mouth.``37';
isbe[3496]='Fodder`fod\'-er.`<a href="./study/isbe/search.html?string=PROVENDER">PROVENDER</a>`1';
isbe[3497]='Fold; Folding`fold fold\'-ing (verb; chabhaq, sabhakh; helisso):<P>The verb occurs only 3 times in the King James Version, and in each instance represents a different word; we have chabhaq "to clasp" (<a onClick="return mV(\'Ecc\',4,5);">Ec 4:5</a>), "The fool foldeth his hands together" (compare <a onClick="return mV(\'Pro\',6,10);">Pr 6:10</a>); cabhak, "to interweave" (<a onClick="return mV(\'Nah\',1,10);">Na 1:10</a>, "folded together as thorns," the English Revised Version "like tangled thorns" the American Standard Revised Version "entangled like thorns"; see <a href="./study/isbe/search.html?string=ENTANGLE">ENTANGLE</A>); helisso "to roll or fold up" (<a onClick="return mV(\'Hbr\',1,12);">Heb 1:12</a>, quoted from <a onClick="return mV(\'Psa\',102,26);">Ps 102:26</a> (Septuagint), the Revised Version (British and American) "As a mantle shalt thou roll them up"). Folding occurs as translation of galil, "turning" or "rolling" (<a onClick="return mV(\'1Ki\',6,34);">1Ki 6:34</a> bis, folding leaves of door).`<a href="./study/isbe/search.html?string=HOUSE">HOUSE</a>`185';
isbe[3498]='Folk`fok:<P>The translation of \'am, \'am "a people or nation" (<a onClick="return mV(\'Gen\',33,15);">Ge 33:15</a>, "some of the folk that are with me"; <a onClick="return mV(\'Pro\',30,26);">Pr 30:26</a>, "The conies are but a feeble folk"); of le\'om, with the same meaning (<a onClick="return mV(\'Jer\',51,58);">Jer 51:58</a>, "the folk in the fire," the Revised Version (British and American) "the nations for the fire"); "sick folk" is the translation of arrhostos, "not strong" (<a onClick="return mV(\'Mar\',6,5);">Mr 6:5</a>); of ton asthenounton, participle of astheneo, "to be without strength," "weak," "sick" (<a onClick="return mV(\'Jhn\',5,3);">Joh 5:3</a>, the Revised Version (British and American) "them that were sick"); "sick folks," of astheneis plural of asthenes, "without strength," the Revised Version (British and American) "sick folk" (<a onClick="return mV(\'Act\',5,16);">Ac 5:16</a>).``185';
isbe[3499]='Follow`fol\'-o (\'achar, radhaph; akoloutheo, dioko):<P>Frequently the translation of \'achar, "after," e.g. <a onClick="return mV(\'Num\',14,24);">Nu 14:24</a>, "hath followed me fully," literally, "fulfilled after me" (<a onClick="return mV(\'Num\',32,11,12);">Nu 32:11-12</a>; <a onClick="return mV(\'Deu\',1,36);">De 1:36</a>; <a onClick="return mV(\'Amo\',7,15);">Am 7:15</a>); radhaph is "to pursue," and is often so translated; it is translated "follow" (<a onClick="return mV(\'Psa\',23,6);">Ps 23:6</a>; <a onClick="return mV(\'Isa\',5,11);">Isa 5:11</a>, etc.); "follow after" (<a onClick="return mV(\'Gen\',44,4);">Ge 44:4</a>; <a onClick="return mV(\'Exd\',14,4);">Ex 14:4</a>); reghel, "foot," is several times translated "follow" (literally, "at the foot of"; <a onClick="return mV(\'Exd\',11,8);">Ex 11:8</a>; <a onClick="return mV(\'Jdg\',8,5);">Jud 8:5</a>, etc.); halakh \'achar, "to go after" (<a onClick="return mV(\'Deu\',4,3);">De 4:3</a>; <a onClick="return mV(\'1Ki\',14,8);">1Ki 14:8</a>, etc.); yalakh \'achar, "to go on after" (<a onClick="return mV(\'Gen\',24,5);">Ge 24:5</a>; <a onClick="return mV(\'Jdg\',2,19);">Jud 2:19</a>, etc.); dabheq, "to cause to cleave to" is "follow hard after" (<a onClick="return mV(\'1Sa\',14,22);">1Sa 14:22</a>; <a onClick="return mV(\'Psa\',63,8);">Ps 63:8</a>, etc.).<P>In the New Testament, in addition to akoloutheo (<a onClick="return mV(\'Mat\',4,20,22,25);">Mt 4:20, 22, 25</a>, etc.) various words and phrases are rendered "follow," e.g. Deute opiso mou, "Come after me" (<a onClick="return mV(\'Mat\',4,19);">Mt 4:19</a>, "Follow me," the Revised Version (British and American) "Come ye after me"); dioko, "to pursue" (<a onClick="return mV(\'Luk\',17,23);">Lu 17:23</a>; <a onClick="return mV(\'1Th\',5,15);">1Th 5:15</a>, the Revised Version (British and American) "follow after," etc.); mimeomai, "to imitate" (<a onClick="return mV(\'Hbr\',13,7);">Heb 13:7</a>, "whose faith follow," the Revised Version (British and American) "imitate their faith; <a onClick="return mV(\'2Th\',3,7,9);">2Thes 3:7, 9</a>; <a onClick="return mV(\'3Jo\',1,11);">3Joh 1:11</a>); compounds of akoloutheo with ex, para sun, etc. (<a onClick="return mV(\'2Pe\',1,16);">2Pe 1:16</a>; <a onClick="return mV(\'Mar\',16,20);">Mr 16:20</a>; <a onClick="return mV(\'Act\',16,17);">Ac 16:17</a>; <a onClick="return mV(\'Mar\',5,37);">Mr 5:37</a>, etc.).<P>English Revised Version, "Follow after faithfulness" makes an important change in <a onClick="return mV(\'Psa\',37,3);">Ps 37:3</a>, where the King James Version has "and verily thou shalt be fed"; but the American Standard Revised Version has "feed on his faithfulness," margin "feed securely or verily thou shalt be fed." For "attained" (<a onClick="return mV(\'1Ti\',4,6);">1Ti 4:6</a>) the Revised Version (British and American) gives "followed until now."``185';
isbe[3500]='Follower`fol\'-o-er (mimetes):<P>"Followers" is in the King James Version the translation of mimetes, "to imitate" (in the New Testament in the good sense of becoming imitators, or following an example), rendered by the Revised Version (British and American) "imitators" (<a onClick="return mV(\'1Cr\',4,16);">1Co 4:16</a>; <a onClick="return mV(\'1Cr\',11,1);">11:1</a>; <a onClick="return mV(\'Eph\',5,1);">Eph 5:1</a>; <a onClick="return mV(\'1Th\',1,6);">1Th 1:6</a>; <a onClick="return mV(\'1Th\',2,14);">2:14</a>; <a onClick="return mV(\'Hbr\',6,12);">Heb 6:12</a>); summimetai, "joint imitators" (<a onClick="return mV(\'Phl\',3,17);">Php 3:17</a>); in <a onClick="return mV(\'1Pe\',3,13);">1Pe 3:13</a>, the King James Version "followers of that which is good," the word, according to a better text, is zelotis, the Revised Version (British and American) "if ye be zealous of that which is good."``1';
