isbe[3432]='Fine`fin (adj., from Latin finire, "to finish"):<P>Indicates superior quality. Only in a few instances does "fine" represent a separate word:<p class="in15">(1) Tobh, "good," qualifies gold (<a onClick="return mV(\'2Ch\',3,5,8);">2Ch 3:5, 8</a>, "fine gold"; compare <a onClick="return mV(\'Gen\',2,12);">Ge 2:12</a>, "good"); fine gold (<a onClick="return mV(\'Lam\',4,1);">La 4:1</a>, the King James Version "most fine gold," the Revised Version (British and American) "most pure gold," literally, "good fine gold"), copper (<a onClick="return mV(\'Ezr\',8,27);">Ezr 8:27</a>, the Revised Version (British and American) "fine bright brass"); Tabh, Aramaic (<a onClick="return mV(\'Dan\',2,32);">Da 2:32</a>, "fine gold").<p class="in15">(2) paz, "refined" (<a onClick="return mV(\'Sgs\',5,11);">So 5:11</a>, "the most fine gold").<p class="in15">(3) chelebh, "fatness," "the best of any kind"; compare <a onClick="return mV(\'Gen\',45,18);">Ge 45:18</a>; <a onClick="return mV(\'Deu\',32,14);">De 32:14</a>, etc. (<a onClick="return mV(\'Psa\',81,16);">Ps 81:16</a>, "the finest of the wheat," the Revised Version, margin Hebrew "fat of wheat").<p class="in15">(4) sariq, "fine combed" (<a onClick="return mV(\'Isa\',19,9);">Isa 19:9</a>, "fine flax," the Revised Version (British and American) "combed flax").<P>In other places it expresses a quality of the substantive: kethem, "fine gold" (<a onClick="return mV(\'Job\',31,24);">Job 31:24</a>; <a onClick="return mV(\'Dan\',10,5);">Da 10:5</a>, the Revised Version (British and American) "pure gold"); paz, used as a noun for refined gold (<a onClick="return mV(\'Job\',28,17);">Job 28:17</a>; <a onClick="return mV(\'Psa\',19,10);">Ps 19:10</a>; <a onClick="return mV(\'Pro\',8,19);">Pr 8:19</a>; <a onClick="return mV(\'Isa\',13,12);">Isa 13:12</a>; <a onClick="return mV(\'Lam\',4,2);">La 4:2</a>); charuts, "fine gold" (<a onClick="return mV(\'Pro\',3,14);">Pr 3:14</a>; compare <a onClick="return mV(\'Psa\',68,13);">Ps 68:13</a>, "yellow gold"); coleth, "flour," rendered "fine flour," rolled or crushed small (<a onClick="return mV(\'Lev\',2,1,4,5,7);">Le 2:1, 4-5, 7</a>, etc.); semidalis, "the finest wheaten flour" (<a onClick="return mV(\'Rev\',18,13);">Re 18:13</a>); qemach coleth, "fine meal" (<a onClick="return mV(\'Gen\',18,6);">Ge 18:6</a>); cadhin, "linen garment" (Septuagint sindon, <a onClick="return mV(\'Pro\',31,24);">Pr 31:24</a> the King James Version; <a onClick="return mV(\'Isa\',3,23);">Isa 3:23</a>); shesh, "white," "fine linen" (<a onClick="return mV(\'Gen\',41,42);">Ge 41:42</a>; <a onClick="return mV(\'Exd\',25,4);">Ex 25:4</a>, etc.); in <a onClick="return mV(\'Pro\',31,22);">Pr 31:22</a> the King James Version has "silk"; sheshi (<a onClick="return mV(\'Eze\',16,13);">Eze 16:13</a>, "fine flour"); \'etun, "what is twisted or spun," "yarn" (<a onClick="return mV(\'Pro\',7,16);">Pr 7:16</a> the King James Version, "fine linen of Egypt" the Revised Version (British and American) "yarn of Egypt"); buts, "fine white cloth," "cotton or linen," "fine linen" (<a onClick="return mV(\'1Ch\',4,21);">1Ch 4:21</a>; <a onClick="return mV(\'Eze\',27,16);">Eze 27:16</a>, etc.; <a onClick="return mV(\'2Ch\',5,12);">2Ch 5:12</a>, King James Version "white," the Revised Version (British and American) "fine"); bussos, "byssus," "linen" from buts Septuagint for which, <a onClick="return mV(\'2Ch\',2,14);">2Ch 2:14</a>; <a onClick="return mV(\'2Ch\',3,14);">3:14</a>), deemed very fine and precious, worn only by the rich (<a onClick="return mV(\'Luk\',16,19);">Lu 16:19</a>; <a onClick="return mV(\'Rev\',18,12);">Re 18:12</a>); bussinos, "byssine" made of fine linen, Septuagint for buts (<a onClick="return mV(\'1Ch\',5,27);">1Ch 5:27</a>) (<a onClick="return mV(\'Rev\',18,16);">Re 18:16</a>, "clothed in fine linen," the Revised Version (British and American) "arrayed," <a onClick="return mV(\'Rev\',19,8,14);">Re 19:8, 14</a>); sindon, "fine linen" (<a onClick="return mV(\'Mar\',5,46);">Mr 5:46</a>, "He bought fine linen," the Revised Version (British and American) "a linen cloth"; compare <a onClick="return mV(\'Mar\',14,51,52);">Mr 14:51-52</a>; <a onClick="return mV(\'Mat\',27,59);">Mt 27:59</a>; <a onClick="return mV(\'Luk\',23,53);">Lu 23:53</a>); it was used for wrapping the body at night, also for wrapping round dead bodies; sindon is Septuagint for cadhin (<a onClick="return mV(\'Jdg\',14,12,13);">Jud 14:12-13</a>; <a onClick="return mV(\'Pro\',31,24);">Pr 31:24</a>); chalkolibanon (<a onClick="return mV(\'Rev\',1,15);">Re 1:15</a>; <a onClick="return mV(\'Rev\',2,18);">2:18</a>, the King James Version "fine brass").<P>The meaning of this word has been much discussed; chalkos is "brass" in Greek (with many compounds), and libanos is the Septuagint for lebhonah, "frankincense," which word was probably derived from the root labhan, "to burn"; this would give glowing brass, "as if they burned in a furnace"; in <a onClick="return mV(\'Dan\',10,6);">Da 10:6</a> it is nehosheth qalal, the King James Version "polished brass," the Revised Version (British and American) "burnished" (qalal is "to glow"). Plumptre deemed it a hybrid word composed of the Greek chalkos, "brass," and the Hebrew labhan, "white," a technical word, such as might be familiar to the Ephesians; the Revised Version (British and American) has "burnished brass"; Weymouth, "silver-bronze when it is white-hot in a furnace"; the whiteness being expressed by the second half of the Greek word. See Thayer\'s Lexicon (s.v.).<P>In Apocrypha we have "fine linen," bussinos (1Esdras 3:6), "fine bread"; the adjective katharos, separate (Judith 10:5, the Revised Version, margin "pure bread"); "fine flour" (Ecclesiasticus 35:2; 38:11); semidalis (Bel and the Dragon verse 3; 2Macc 1:8, the Revised Version (British and American) "meal offering").``185';
isbe[3433]='Finer; Fining`fin\'-er, fin\'-ing (<a onClick="return mV(\'Pro\',25,4);">Pr 25:4</a> the King James Version).`<a href="./study/isbe/search.html?string=REFINER">REFINER</a>`1';
isbe[3434]='Fines`finz.`<a href="./study/isbe/search.html?string=PUNISHMENTS">PUNISHMENTS</a>`1';
isbe[3435]='Finger (1)`fin\'-ger (Hebrew and Aramaic \'etsba\'; daktulos): The fingers are to the Oriental essential in conversation; their language is frequently very eloquent and expressive. They often show what the mouth does not dare to utter, especially grave insult and scorn. The scandalous person is thus described in <a onClick="return mV(\'Pro\',6,13);">Pr 6:13</a> as "teaching" or "making signs with his fingers." Such insulting gestures (compare e.g. the gesture of Shimei in throwing dust or stones at David, <a onClick="return mV(\'2Sa\',16,6);">2Sa 16:6</a>) are even now not infrequent in Palestine. The same habit is alluded to in <a onClick="return mV(\'Isa\',58,9);">Isa 58:9</a> by the expression, "putting forth of fingers. "<P>The fingers were decorated with rings of precious metal, which, with other jewelry worn ostentatiously on the body, often formed the only possession of the wearer, and were therefore carefully guarded. In the same way the law of Yahweh was to be kept:<p class="in15">"Bind them (my commandments) upon thy fingers;<br>write them upon the tablet of thy heart" (<a onClick="return mV(\'Pro\',7,3);">Pr 7:3</a>).<P>Figurative: In <a onClick="return mV(\'1Ki\',12,10);">1Ki 12:10</a> and <a onClick="return mV(\'2Ch\',10,10);">2Ch 10:10</a> Rehoboam gives the remarkable answer to his dissatisfied people, which is, at the same time, an excellent example of the use of figurative language in the Orient: "My little finger is thicker than my father\'s loins," a figure explained in the next verse: "Whereas my father did lade you with a heavy yoke, I will add to your yoke: my father chastised you with whips, but I will chastise you with scorpions." The Hebrew word used here for little finger is qoten, literally, "pettiness," "unimportant thing."<P>The "finger of God," like the "hand of God," is synonymous with power, omnipotence, sometimes with the additional meaning of the infallible evidence of Divine authorship visible in all His works (<a onClick="return mV(\'Psa\',8,3);">Ps 8:3</a>; <a onClick="return mV(\'Luk\',11,20);">Lu 11:20</a>), especially in His law (<a onClick="return mV(\'Exd\',8,19);">Ex 8:19</a>; <a onClick="return mV(\'Exd\',31,18);">31:18</a>; <a onClick="return mV(\'Deu\',9,10);">De 9:10</a>; compare <a onClick="return mV(\'Exd\',32,15,16);">Ex 32:15-16</a>).<P>The finger or digit as a linear measure is mentioned in <a onClick="return mV(\'Jer\',52,21);">Jer 52:21</a> (Greek daktulos; Josephus, Ant, VIII, iii, 4). It is equal to one finger-breadth, 1/4 of a hand-breadth (palm) = 18,6 millimeters or .73 inches.``106';
isbe[3436]='Finger (2)`fin\'-ger (\'etsba\'):<P>The smallest of the Hebrew linear measures. It was equal to the breadth of the finger, or about 3/4 inches, four of which made a palm (<a onClick="return mV(\'Jer\',52,21);">Jer 52:21</a>).`<a href="./study/isbe/search.html?string=WEIGHTS+AND+MEASURES">WEIGHTS AND MEASURES</a>`1';
isbe[3437]='Finish`fin\'-ish (kalah; teleo, with other Hebrew and Greek words): The proper sense of "finish" is to end or complete; so for "finish," "finished," in the King James Version, there is sometimes met with in the Revised Version (British and American) the change to "complete" (<a onClick="return mV(\'Luk\',14,28);">Lu 14:28</a>; <a onClick="return mV(\'2Cr\',8,6);">2Co 8:6</a>), "accomplish" (<a onClick="return mV(\'Jhn\',4,34);">Joh 4:34</a>; <a onClick="return mV(\'Jhn\',5,36);">5:36</a>; <a onClick="return mV(\'Jhn\',17,4);">17:4</a>), "made an end of doing" (<a onClick="return mV(\'2Ch\',4,11);">2Ch 4:11</a>; compare <a onClick="return mV(\'2Ch\',24,14);">2Ch 24:14</a>), etc. In <a onClick="return mV(\'Jam\',1,15);">Jas 1:15</a>, for "sin, when it is finished," the Revised Version (British and American) reads "sin when it is full-grown," corresponding to "conceived" of the previous clause. On the other hand, the Revised Version (British and American) has frequently "finished" for other words, as "ended" (<a onClick="return mV(\'Gen\',2,2);">Ge 2:2</a>; <a onClick="return mV(\'Deu\',31,30);">De 31:30</a>), "accomplished" (<a onClick="return mV(\'Jhn\',19,28);">Joh 19:28</a>), "filled up," "fulfilled" (<a onClick="return mV(\'Rev\',15,1,8);">Re 15:1, 8</a>), etc. The grandest Scriptural example of the word is the cry upon the cross, "It is finished" (Tetelestai, <a onClick="return mV(\'Jhn\',19,30);">Joh 19:30</a>).``185';
isbe[3438]='Finisher`fin\'-ish-er (teleiotes):<P>This word is applied to Jesus (<a onClick="return mV(\'Hbr\',12,2);">Heb 12:2</a>), and comes from teleioo, "to complete," "to make perfect"; hence, it means finisher in the sense of completing; the King James Version "the author and finisher of our faith," the Revised Version (British and American) "the author (margin "captain") and perfecter of our faith"; but "our" is supplied, and in the connection in which the passage stands—after the examples which have been adduced of the power of faith—most probably the best rendering is "the Leader (or Captain) and Perfecter of the Faith," that is of the faith which has been illustrated by those mentioned in <a onClick="return mV(\'Hbr\',11,\'1-\');">Heb 11</a>, who are as "a great cloud of witnesses" to the power of faith; but above all "looking to Jesus, our Leader" in whom it was perfected, as is shown in what follows: "who for the joy that was set before him endured the cross," etc. "In His human nature He exhibited Faith in its highest form, from first to last, and placing Himself as it were at the head of the great army of heroes of Faith, He carried Faith, the source of their strength, to its most complete perfection and to its loftiest triumph" (Westcott).``185';
isbe[3439]='Fir; Fir-Tree`fur, (the Revised Version, margin "cypress"; berosh, <a onClick="return mV(\'2Sa\',6,5);">2Sa 6:5</a>; <a onClick="return mV(\'1Ki\',5,8,10);">1Ki 5:8, 10</a>, etc.; (berothem (plural only), an Aramaic form, <a onClick="return mV(\'Sgs\',1,17);">So 1:17</a>):<P>1. Old Testament References:<P>This tree was one of the chief trees of Lebanon (<a onClick="return mV(\'Isa\',60,13);">Isa 60:13</a>); one of usefulness (<a onClick="return mV(\'Isa\',41,19);">Isa 41:19</a>; <a onClick="return mV(\'Isa\',55,13);">55:13</a>); associated with the cedar (<a onClick="return mV(\'2Ki\',19,23);">2Ki 19:23</a>; <a onClick="return mV(\'Psa\',104,17);">Ps 104:17</a>; <a onClick="return mV(\'Isa\',14,8);">Isa 14:8</a>; <a onClick="return mV(\'Zec\',11,2);">Zec 11:2</a>); its boughs were wide and great (<a onClick="return mV(\'Eze\',31,8);">Eze 31:8</a>); it was evergreen (<a onClick="return mV(\'Hsa\',14,8);">Ho 14:8</a>); it could supply boards and timber for doors (<a onClick="return mV(\'1Ki\',6,15,24);">1Ki 6:15, 24</a>); beams for roofing the temple (<a onClick="return mV(\'2Ch\',3,5);">2Ch 3:5</a>); planks for shipbuilding (<a onClick="return mV(\'Eze\',27,5);">Eze 27:5</a>). In <a onClick="return mV(\'2Sa\',6,5);">2Sa 6:5</a> we read: "David and all the house of Israel played before Yahweh with all manner of instruments made of fir-wood," etc. It is practically certain that the reading in the parallel passage in <a onClick="return mV(\'1Ch\',13,8);">1Ch 13:8</a> is more correct: "David and all Israel played before God with all their might, even with songs," etc. This view is supported by the Septuagint translation (en pase dunamei). There is therefore no necessity to suppose that berosh was a wood used for musical instruments.<P>2. The Identity of "Berosh":<P>The identity of berosh is uncertain. It was a name applied either to several of the Coniferae in common or to one or more outstanding species. If the latter is the case we can only seek for the most suited to Old Testament requirements. The Aleppo pine, Pinus Halepensis, is a fine tree which flourishes in the Lebanon, but its wood is not of special excellence and durability. A better tree (or couple of trees) is the sherbin of the Syrians; this name includes two distinct varieties in the suborder Cypressineae, the fine tall juniper, Juniperis excelsa and the cypress, Cypressus sempervirens. They both still occur in considerable numbers in the Lebanon and Anti-Lebanon; they are magnificent trees and produce excellent wood—resinous, fragrant, durable. If these trees were not classed locally, as now, under one name, then the cypress is of the two more probably the berosh. The coffins of Egyptian mummies were made of cypress; a compact variety of this cypress is cultivated all over the Turkish empire by the Moslems as an ornament in cemeteries. From early times the cypress has been connected with mourning.<P>In the Apocrypha there are two definite references to the cypress (kuparissos). In Sirach 24:13, Wisdom says:<P class="in15">"I was exalted like a cedar in Libanus,<br>And as a cypress tree on the mountains of Hermon."<P>And in Sirach 50:10 the high priest Simon is said to be<P class="in15">"As an olive tree budding forth fruits,<br>And as a cypress growing high among the clouds."<P>These passages, especially the former, certainly favor the idea that berosh was the cypress; the name may, however, have included allied trees.``117';
isbe[3440]='Fire`fir (\'esh; pur):<P>These are the common words for fire, occurring very frequently. \'Ur, "light" (<a onClick="return mV(\'Isa\',24,15);">Isa 24:15</a> the King James Version; compare the Revised Version (British and American); <a onClick="return mV(\'Isa\',31,9);">Isa 31:9</a>, and see <a href="./study/isbe/search.html?string=FIRES">FIRES</a>), nur (Aramaic) (<a onClick="return mV(\'Dan\',3,22);">Da 3:22</a>ff) are found a few times, also \'eshshah (<a onClick="return mV(\'Jer\',6,29);">Jer 6:29</a>), and be\'erah (<a onClick="return mV(\'Exd\',22,6);">Ex 22:6</a>), once each. <a onClick="return mV(\'Act\',28,2,3);">Ac 28:2-3</a> has pura, "pyre," and <a onClick="return mV(\'Mar\',14,54);">Mr 14:54</a>; <a onClick="return mV(\'Luk\',22,56);">Lu 22:56</a>, phos, "light," the Revised Version (British and American) "in the light (of the fire)." "To set on fire," yatsath (<a onClick="return mV(\'2Sa\',14,31);">2Sa 14:31</a>), lahat (<a onClick="return mV(\'Deu\',32,22);">De 32:22</a>, etc.), phlogizo (<a onClick="return mV(\'Jam\',3,6);">Jas 3:6</a>).<P>Fire was regarded by primitive peoples as supernatural in origin and specially Divine. Molech, the fire-god, and other deities were worshipped by certain Canaanitish and other tribes with human sacrifices (<a onClick="return mV(\'Deu\',12,31);">De 12:31</a>; <a onClick="return mV(\'2Ki\',17,31);">2Ki 17:31</a>; <a onClick="return mV(\'Psa\',106,37);">Ps 106:37</a>), and, although this was specially forbidden to the Israelites (<a onClick="return mV(\'Lev\',18,21);">Le 18:21</a>; <a onClick="return mV(\'Deu\',12,31);">De 12:31</a>; <a onClick="return mV(\'Deu\',18,10);">18:10</a>), they too often lapsed into the practice (<a onClick="return mV(\'2Ki\',16,3);">2Ki 16:3</a>; <a onClick="return mV(\'2Ki\',21,6);">21:6</a>; <a onClick="return mV(\'Jer\',7,31);">Jer 7:31</a>; <a onClick="return mV(\'Eze\',20,26,31);">Eze 20:26, 31</a>).<P>See <a href="./study/isbe/search.html?string=MOLECH;+MOLOCH">MOLECH</a>; <a href="./study/isbe/search.html?string=IDOLATRY">IDOLATRY</a>.<P>1. Literal Usage:<P>Fire in the Old Testament is specially associated with the Divine presence, e.g. in the making of the Covenant with Abraham (<a onClick="return mV(\'Gen\',15,17);">Ge 15:17</a>), in the burning bush. (<a onClick="return mV(\'Exd\',3,\'2-4\');">Ex 3:2-4</a>), in the pillar of fire (<a onClick="return mV(\'Exd\',13,21);">Ex 13:21</a>), on Sinai (<a onClick="return mV(\'Exd\',19,18);">Ex 19:18</a>), in the flame on the altar (<a onClick="return mV(\'Jdg\',13,20);">Jud 13:20</a>). Yahweh was "the God that answereth by fire" (<a onClick="return mV(\'1Ki\',18,24,38);">1Ki 18:24, 38</a>). In the Law, therefore, sacrifices and offerings (including incense) were to be made by fire (<a onClick="return mV(\'Exd\',12,8,9,10);">Ex 12:8-10</a>; <a onClick="return mV(\'Lev\',1,\'1-\');">Le 1</a>). Fire from Yahweh signified the acceptance of certain special and separate sacrifices (<a onClick="return mV(\'Jdg\',6,21);">Jud 6:21</a>; <a onClick="return mV(\'1Ki\',18,38);">1Ki 18:38</a>; <a onClick="return mV(\'1Ch\',21,26);">1Ch 21:26</a>). In <a onClick="return mV(\'Lev\',9,24);">Le 9:24</a> the sacrificial fire "came forth from before Yahweh." The altar-fire was to be kept continually burning (<a onClick="return mV(\'Lev\',6,12,13);">Le 6:12-13</a>); offering by "strange fire" (other than the sacred altar-fire) was punished by "fire from before Yahweh" (<a onClick="return mV(\'Lev\',10,1,2);">Le 10:1-2</a>). Fire came from heaven also at the consecration of Solomon\'s Temple (<a onClick="return mV(\'2Ch\',7,1);">2Ch 7:1</a>).<P>According to 2Macc 1:19-22, at the time of the Captivity priests hid the sacred fire in a well, and Nehemiah found it again, in a miraculous way, for the second Temple. Later, Maccabeus is said to have restored the fire by "striking stones and taking fire out of them" (<span class="noTag">10:3</SPAN>).<P>Fire was a frequent instrument of the Divine primitive wrath (<a onClick="return mV(\'Gen\',19,24);">Ge 19:24</a>; <a onClick="return mV(\'Exd\',9,23);">Ex 9:23</a> (lightning); <a onClick="return mV(\'Num\',11,1);">Nu 11:1</a>; <a onClick="return mV(\'Num\',16,35);">16:35</a>, etc.; <a onClick="return mV(\'Psa\',104,4);">Ps 104:4</a>, the American Standard Revised Version "Who maketh...flames of fire his ministers"). Fire shall yet dissolve the world (<a onClick="return mV(\'2Pe\',3,12);">2Pe 3:12</a>). It was frequently used by the Israelites as a means of destruction of idolatrous objects and the cities of their enemies (<a onClick="return mV(\'Deu\',7,5,25);">De 7:5, 25</a>; <a onClick="return mV(\'Deu\',12,3);">12:3</a>; <a onClick="return mV(\'Deu\',13,16);">13:16</a>; <a onClick="return mV(\'Jos\',6,24);">Jos 6:24</a>; Judgess, frequently); sometimes also of punishment (<a onClick="return mV(\'Lev\',20,14);">Le 20:14</a>; <a onClick="return mV(\'Lev\',21,9);">21:9</a>; <a onClick="return mV(\'Jos\',7,25);">Jos 7:25</a>; 2Macc 7:5).<P>The domestic use of fire was, as among other peoples, for heating, cooking, lighting, etc., but according to the Law no fire could be kindled on the Sabbath day (<a onClick="return mV(\'Exd\',35,3);">Ex 35:3</a>). It was employed also for melting (<a onClick="return mV(\'Exd\',32,24);">Ex 32:24</a>), and refining (<a onClick="return mV(\'Num\',31,23);">Nu 31:23</a>; <a onClick="return mV(\'Num\',3,2,3);">3:2-3</a>, etc.). For the sacrificial fire wood was used as fuel (<a onClick="return mV(\'Gen\',22,3,6);">Ge 22:3, 6</a>; <a onClick="return mV(\'Lev\',6,12);">Le 6:12</a>); for ordinary purposes, also charcoal (<a onClick="return mV(\'Pro\',25,22);">Pr 25:22</a>; <a onClick="return mV(\'Isa\',6,6);">Isa 6:6</a>, the Revised Version, margin "or hot stone"; <a onClick="return mV(\'Hab\',3,5);">Hab 3:5</a>, the Revised Version (British and American) "fiery bolts," margin "or burning coals"; <a onClick="return mV(\'Jhn\',21,9);">Joh 21:9</a>, "a fire of coals" the Revised Version, margin "Gr, a fire of charcoal"; <a onClick="return mV(\'Rom\',12,20);">Ro 12:20</a>); branches (<a onClick="return mV(\'Num\',15,32);">Nu 15:32</a>; <a onClick="return mV(\'1Ki\',17,12);">1Ki 17:12</a>); thorns (<a onClick="return mV(\'Psa\',58,9);">Ps 58:9</a>; <a onClick="return mV(\'Psa\',118,12);">118:12</a>; <a onClick="return mV(\'Ecc\',7,6);">Ec 7:6</a>; <a onClick="return mV(\'Isa\',33,12);">Isa 33:12</a>); grass and other herbage (<a onClick="return mV(\'Mat\',6,30);">Mt 6:30</a>; <a onClick="return mV(\'Luk\',12,28);">Lu 12:28</a>).<P>2. Figurative Use:<P>Fire was an emblem<P>(1) of Yahweh in His glory (<a onClick="return mV(\'Dan\',7,9);">Da 7:9</a>);<P>(2) in His holiness (<a onClick="return mV(\'Isa\',6,4);">Isa 6:4</a>);<P>(3) in His jealousy for His sole worship (<a onClick="return mV(\'Deu\',4,24);">De 4:24</a>; <a onClick="return mV(\'Hbr\',12,29);">Heb 12:29</a>; <a onClick="return mV(\'Psa\',79,5);">Ps 79:5</a>; perhaps also <a onClick="return mV(\'Isa\',33,14);">Isa 33:14</a>);<P>(4) of His protection of His people (<a onClick="return mV(\'2Ki\',6,17);">2Ki 6:17</a>; <a onClick="return mV(\'Zec\',2,5);">Zec 2:5</a>);<P>(5) of His righteous judgment and purification (<a onClick="return mV(\'Zec\',13,9);">Zec 13:9</a>; <a onClick="return mV(\'Mal\',3,2,3);">Mal 3:2-3</a>; <a onClick="return mV(\'1Cr\',3,13,15);">1Co 3:13, 15</a>);<P>(6) of His wrath against sin and punishment of the wicked (<a onClick="return mV(\'Deu\',9,3);">De 9:3</a>; <a onClick="return mV(\'Psa\',18,8);">Ps 18:8</a>; <a onClick="return mV(\'Psa\',89,46);">89:46</a>; <a onClick="return mV(\'Isa\',5,24);">Isa 5:24</a>; <a onClick="return mV(\'Isa\',30,33);">30:33</a>, "a Topheth is prepared of old"; <a onClick="return mV(\'Mat\',3,\'10-12\');">Mt 3:10-12</a>; <a onClick="return mV(\'Mat\',5,22);">5:22</a>, the Revised Version (British and American) "the hell of fire," margin "Greek, Gehenna of fire"; see <a onClick="return mV(\'Isa\',30,33);">Isa 30:33</a>; <a onClick="return mV(\'Jer\',7,31);">Jer 7:31</a>; <a onClick="return mV(\'Mat\',13,40,42);">Mt 13:40, 42</a>; <a onClick="return mV(\'Mat\',25,41);">25:41</a>, "eternal fire"; <a onClick="return mV(\'Mar\',9,\'45-49\');">Mr 9:45-49</a>; see <a onClick="return mV(\'Isa\',66,24);">Isa 66:24</a>; <a onClick="return mV(\'2Th\',1,7);">2Th 1:7</a>; <a onClick="return mV(\'Hbr\',10,27);">Heb 10:27</a>; <a onClick="return mV(\'Jud\',1,7);">Jude 1:7</a>);<P>(7) of the word of God in its power (<a onClick="return mV(\'Jer\',5,14);">Jer 5:14</a>; <a onClick="return mV(\'Jer\',23,29);">23:29</a>);<P>(8) of Divine truth (<a onClick="return mV(\'Psa\',39,3);">Ps 39:3</a>; <a onClick="return mV(\'Jer\',20,9);">Jer 20:9</a>; <a onClick="return mV(\'Luk\',12,49);">Lu 12:49</a>);<P>(9) of that which guides men (<a onClick="return mV(\'Isa\',50,10,11);">Isa 50:10-11</a>);<P>(10) of the Holy Spirit (<a onClick="return mV(\'Act\',2,3);">Ac 2:3</a>);<P>(11) of the glorified Christ (<a onClick="return mV(\'Rev\',1,14);">Re 1:14</a>);<P>(12) of kindness in its melting power (<a onClick="return mV(\'Rom\',12,20);">Ro 12:20</a>);<P>(13) of trial and suffering (<a onClick="return mV(\'Psa\',66,12);">Ps 66:12</a>; <a onClick="return mV(\'Isa\',43,2);">Isa 43:2</a>; <a onClick="return mV(\'1Pe\',1,7);">1Pe 1:7</a>; <a onClick="return mV(\'1Pe\',4,12);">4:12</a>);<P>(14) of evil (<a onClick="return mV(\'Pro\',6,27);">Pr 6:27</a>; <a onClick="return mV(\'Pro\',16,27);">16:27</a>; <a onClick="return mV(\'Isa\',9,18);">Isa 9:18</a>; <a onClick="return mV(\'Isa\',65,5);">65:5</a>); lust or desire (<a onClick="return mV(\'Hsa\',7,6);">Ho 7:6</a>; Sirach 23:16; <a onClick="return mV(\'1Cr\',7,9);">1Co 7:9</a>); greed (<a onClick="return mV(\'Pro\',30,16);">Pr 30:16</a>);<P>(15) of the tongue in its evil aspects (<a onClick="return mV(\'Jam\',3,5,6);">Jas 3:5-6</a>);<P>(16) of heaven in its purity and glory (<a onClick="return mV(\'Rev\',15,2);">Re 15:2</a>; see also <a onClick="return mV(\'Rev\',21,22,23);">Re 21:22-23</a>).``185';
