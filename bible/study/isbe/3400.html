isbe = [];

isbe[3401]='Feathers`feth\'-erz (notsah; Latin penna): "Gavest thou the goodly wings unto the peacocks? or wings (the Revised Version (British and American) "pinions") and feathers (the American Standard Revised Version "plumage") unto the ostrich?" (<a onClick="return mV(\'Job\',39,13);">Job 39:13</a> the King James Version); "He shall cover thee with his feathers, and under his wings shalt thou trust; his truth shall be thy shield and buckler" (<a onClick="return mV(\'Psa\',91,4);">Ps 91:4</a> the King James Version). In the Revised Version (British and American) this is again changed to pinions. in <a onClick="return mV(\'Dan\',4,33);">Da 4:33</a> the word "feathers" is left. The wonderful plumage of birds was noted and prized in those days, just as now. Old ostriches were too tough and rank of flesh for food. They were pursued for their feathers, which were used for the headdressing and shield ornaments of desert princes. No one doubts that the ships of Solomon introduced peacocks because of their wonderful feathers. Those of the eagle were held in superstitious reverence as late as the days of Pliny, who was ten years old at the time of the crucifixion of Christ. Pliny wrote that the eagle was so powerful that if its feathers be laid in a box with those of other birds, the eagle feathers would "devour and consume all the rest."``167';
isbe[3402]='Feeble Knees`fe\'-b\'-l nez: The expression. is found in three places (one being a free quotation of another): <a onClick="return mV(\'Job\',4,4);">Job 4:4</a>, "Thou hast made firm the feeble (kara\', "bending," "bowing") knees," and <a onClick="return mV(\'Hbr\',12,12);">Heb 12:12</a>, "Wherefore lift up the hands that hang down, and the palsied (the King James Version "feeble") knees." The Greek word used here (paralelumena, "paralyzed," "motionless") implies the loss of junction, interrupted articulation, the cutting off of vital strength; compare Greek cholos, "lame," and see Delitzsch in his Commentary on Heb, in the place cited<P>Such an affection of the knees may be due to different causes. It is, e.g., a very frequent symptom of the disease known in the Orient as beriberi, when the muscles of the lower leg shrink to such a degree as to render voluntary locomotion impossible. It always disables its victim, and is therefore often expressive of general debility, e.g. in <a onClick="return mV(\'Psa\',109,24);">Ps 109:24</a>, where such weakness is described as the outcome of protracted fasting in <a onClick="return mV(\'Eze\',7,17);">Eze 7:17</a> and <a onClick="return mV(\'Eze\',21,7);">21:7</A>, "All knees shall be weak as water," the expression indicates a complete relaxation of the muscles. Fear effected the same condition in Belshazzar\'s case, when he saw the writing on the wall (<a onClick="return mV(\'Dan\',5,6);">Da 5:6</a>), "The joints of his loins were loosed, and his knees smote one against another" (compare <a onClick="return mV(\'Nah\',2,10);">Na 2:10</a>).<P>The "sore boil...in the knees, and in the legs," a disease announced in <a onClick="return mV(\'Deu\',28,35);">De 28:35</a> as a punishment upon Israel for disobedience, cannot now be fully determined. Driver (in his commentary on the passage) thinks of elephantiasis, which is possible but not probable on account of the additional statement, "whereof thou canst not be healed, from the sole of thy foot unto the crown of thy head" which would be unexplained, as elephantiasis rarely presents a form in which the whole body is sympathetically affected. I rather think of some form of bubonic plague, which causes very high fever all over the body. In <a onClick="return mV(\'Deu\',28,27);">De 28:27</a> in the enumeration of plagues mention is made of the "boil of Egypt," and some commentators have explained this as "bubonic plague." There is, however, no doubt that the "boil or botch of Egypt" is identical with the disease known to modern medicine as bouton du Nil, Biskra button, Bagdad or Aleppo sore.``106';
isbe[3403]='Feeble-Minded`fe\'-b\'-l-min\'-ded (oligopsuchos): Only in <a onClick="return mV(\'1Th\',5,14);">1Th 5:14</a> the King James Version, in the sense of "fainthearted," as in the Revised Version (British and American). In Septuagint it is used as the equivalent of koshel, the tottering or feeble-kneed in <a onClick="return mV(\'Isa\',35,3);">Isa 35:3</a>; <a onClick="return mV(\'Isa\',54,6);">54:6</a>; oligopsuchia occurs in Septuagint twice (<a onClick="return mV(\'Exd\',6,9);">Ex 6:9</a>; <a onClick="return mV(\'Psa\',54,7);">Ps 54:7</a>), for "anguish of spirit" and "trouble." The term refers to weakness of will and vacillation of purpose rather than to idiocy or morbid imbecility.``1';
isbe[3404]='Feeling`fel\'-ing: The following varieties of meaning are to be noted:<P>(1) "To touch," "handle," "grope after" (mashash (<a onClick="return mV(\'Gen\',27,12,22);">Ge 27:12, 22</a>; <a onClick="return mV(\'Exd\',10,21);">Ex 10:21</a>; mush, <a onClick="return mV(\'Gen\',27,21);">Ge 27:21</a>; <a onClick="return mV(\'Jdg\',16,26);">Jud 16:26</a>; pselaphao, <a onClick="return mV(\'Act\',17,27);">Ac 17:27</a>).<P>(2) "To know," "understand," "experience" (bin, <a onClick="return mV(\'Psa\',58,9);">Ps 58:9</a>; yadha\', <a onClick="return mV(\'Pro\',23,35);">Pr 23:35</a>; ginosko, <a onClick="return mV(\'Mar\',5,29);">Mr 5:29</a>).<P>(3) "To have a fellow feeling," "to place one\'s self into the position of another," especially while suffering, "to have compassion" (sumpathein, <a onClick="return mV(\'Hbr\',4,15);">Heb 4:15</a>; compare <a onClick="return mV(\'Hbr\',10,34);">10:34</A>; which is to be carefully distinguished from the similar verb sumpaschein, which means "to share in the same suffering with another," <a onClick="return mV(\'Rom\',8,17);">Ro 8:17</a>; <a onClick="return mV(\'1Cr\',12,26);">1Co 12:26</a>). See Delitzsch, Commentary on <a onClick="return mV(\'Hbr\',4,15);">Heb 4:15</a>.<P>(4) "To feel harm," "pain," "grief," "to be sensitive" (paschein, with the roots path-and penth-, <a onClick="return mV(\'Act\',28,5);">Ac 28:5</a>); or with the negation: "to have ceased to feel," "to be apathetic," "past feeling," "callous," apelgekos, perfect participle of apalgeo (<a onClick="return mV(\'Eph\',4,19);">Eph 4:19</a>) which describes the condition of the sinner, who by hardening his heart against moral influences is left without a sense of his high vocation, without an idea of the awfulness of sin, without reverence to God, without an appreciation of the salvation offered by Him, and without fear of His judgment.``106';
isbe[3405]='Feet, Washing of``<a href="./study/isbe/search.html?string=FOOT">FOOT</a>; <a href="./study/isbe/search.html?string=WASHING+OF+FEET">WASHING OF FEET</a>`1';
isbe[3406]='Feign`fan (badha, nakhar; plastos): Occurs<P>(1) in the sense of "to devise," "invent" as the translation of badha\', "to form," "to fashion" (<a onClick="return mV(\'Neh\',6,8);">Ne 6:8</a>, "Thou feignest them out of thine own heart"; compare <a onClick="return mV(\'1Ki\',12,33);">1Ki 12:33</a>, English Versions of the Bible "devised of his own heart"); of plastos, "formed," "molded" (<a onClick="return mV(\'2Pe\',2,3);">2Pe 2:3</a>, "with reigned words make merchandise of you");<P>(2) in the sense of "pretense," nakhar, "to be foreign," "strange" (<a onClick="return mV(\'1Ki\',14,5);">1Ki 14:5</a>, "feign herself to be another woman," <a onClick="return mV(\'1Ki\',14,6);">1ki 14:6</a>; compare <a onClick="return mV(\'Gen\',42,7);">Ge 42:7</a>; <a onClick="return mV(\'Pro\',26,24);">Pr 26:24</a>); \'abhal, "to mourn," "to act as a mourner" (<a onClick="return mV(\'2Sa\',14,2);">2Sa 14:2</a>); halal, "to make a show," Hithpael, "to be mad," "to feign madness" (of David, <a onClick="return mV(\'1Sa\',21,13);">1Sa 21:13</a>; compare <a onClick="return mV(\'Jer\',25,16);">Jer 25:16</a>; <a onClick="return mV(\'Jer\',50,38);">50:38</a>); hupokrinomai, "to give judgment, or act, under a mask" (<a onClick="return mV(\'Luk\',20,20);">Lu 20:20</a>, "who feigned themselves to be righteous");<P>(3) in the sense of "deceit" "fraud," "insincerity," mirmah, "prayer, that goeth not out of feigned lips" (<a onClick="return mV(\'Psa\',17,1);">Ps 17:1</a>); sheqer, "falsehood," "a lie," "Judah hath not returned unto me with her whole heart, but feignedly" (<a onClick="return mV(\'Jer\',3,10);">Jer 3:10</a>; compare 2Esdras 8:28); kahash, "to lie," "to feign, or flatter" (<a onClick="return mV(\'2Sa\',22,45);">2Sa 22:45; <a onClick="return mV(\'Psa\',18,44);">Ps 18:44</a>; <a onClick="return mV(\'Psa\',66,3);">66:3</a>; <a onClick="return mV(\'Psa\',81,15);">81:15</a>), where the text of the King James Version and the Revised Version (British and American), "shall submit themselves," is rendered the margin (the King James Version and the Revised Version (British and American)), "yield feigned obedience, Hebrew lie." the Revised Version (British and American) has "feign" for "make" (<a onClick="return mV(\'2Sa\',13,5);">2Sa 13:5</a>), and "feigned" for "made" (<a onClick="return mV(\'2Sa\',13,6);">2Sa 13:6</a>).``185';
isbe[3407]='Felix; Antonius`fe\'-liks, an-to\'-ni-us (Phelix, from Latin felix, "happy"): A Roman procurator of Judea, appointed in succession to Cumanus by the emperor Claudius. The event which led to the introduction of Felix into the narrative of Acts was the riot at Jerusalem (<a onClick="return mV(\'Act\',21,27);">Ac 21:27</a>). There Paul, being attacked at the instigation of the Asiatic Jews for alleged false teaching and profanation of the temple, was rescued with difficulty by Lysias the chief captain. But Lysias, finding that Paul was a Roman citizen, and that therefore the secret plots against the life of his captive might entail serious consequences upon himself, and finding also that Paul was charged on religious rather than on political grounds, sent him on to Felix at Caesarea for trial (<a onClick="return mV(\'Act\',21,\'31-\');">Ac 21:31-23:34</a>). On his arrival, Paul was presented to Felix and was then detained for five days in the judgment hall of Herod, till his accusers should also reach Caesarea (<a onClick="return mV(\'Act\',23,\'33-35\');">Ac 23:33-35</a>). The trial was begun, but after hearing the evidence of Tertullus (see <a href="./study/isbe/search.html?string=TERTULLUS">TERTULLUS</a>) and the speech of Paul in his own defense, Felix deferred judgment (<a onClick="return mV(\'Act\',24,\'1-22\');">Ac 24:1-22</a>). The excuse he gave for delay was the non-appearance of Lysias, but his real reason was in order to obtain bribes for the release of Paul. He therefore treated his prisoner at first with leniency, and pretended along with Drusilla to take interest in his teaching. But these attempts to induce Paul to purchase his freedom failed ignominiously; Paul sought favor of neither Felix nor Drusilla, and made the frequent interviews which he had with them an opportunity for preaching to them concerning righteousness and temperance and the final judgment. The case dragged on for two years till Felix, upon his retirement, "desiring to gain favor with the Jews...left Paul in bonds" (<a onClick="return mV(\'Act\',24,27);">Ac 24:27</a>). According to the Bezan text, the continued imprisonment of Paul was due to the desire of Felix to please Drusilla.<P>Felix was the brother of Pallas, who was the infamous favorite of Claudius, and who, according to Tacitus (Annals xiii. 14), fell into disgrace in 55 AD. Tacitus implies that Felix was joint procurator of Judea, along with Cumanus, before being appointed to the sole command, but Josephus is silent as to this. Both Tacitus and Josephus refer to his succeeding Cumanus, Josephus stating that it was at the instigation of Jonathan the high priest. There is some doubt as to the chronology of Felix\' tenure of office. Harnack and Blass, following Eusebius and Jerome, place his accession in 51 AD, and the imprisonment of Paul in 54-56 AD; but most modern commentators incline to the dates 52 AD and 56-58 AD. These latter interpret the statement of Paul, "Thou hast been of many years a judge unto this nation" (<a onClick="return mV(\'Act\',24,10);">Ac 24:10</a>), as referring to some judicial office, not necessarily that of co-procurator (see Tacitus), previously held by Felix in the time of Cumanus, and argue that this earlier connection of Felix with Judea supplied a reason for the advocacy by Jonathan of Felix\' claims to the procuratorship on the deposition of Gumanus. The testimony of Acts as to the evil character of Felix is fully corroborated by the writings of Josephus (BJ, II, xiii). Although he suppressed the robbers and murderers who infested Judea, and among them the "Egyptian" to whom Lysias refers (<a onClick="return mV(\'Act\',21,38);">Ac 21:38</a>), yet "he himself was more hurtful than them all." When occasion offered, he did not hesitate to employ the sicarii (see <a href="./study/isbe/search.html?string=ASSASSINS">ASSASSINS</a>) for his own ends. Trading upon the influence of his brother at court, his cruelty and rapacity knew no bounds, and during his rule revolts became continuous, and marked a distinct stage in that seditious movement which culminated in the outbreak of 70 AD (so Schurer). His leaving Paul in bonds was but a final instance of one who sacrificed duty and justice for the sake of his Own unscrupulous selfishness. For more detailed information as to dates, etc., compare Knowling (Expos Greek Test., II, 477ff).``88';
isbe[3408]='Felloes`fel\'-oz (<a onClick="return mV(\'1Ki\',7,33);">1Ki 7:33</a>).`<a href="./study/isbe/search.html?string=WHEEL">WHEEL</a>`1';
isbe[3409]='Fellow`fel\'-o (chabher, rea\'; hetairos): Meant originally a "partner," from fe, "property," and lag, "to lay," then "a companion," "an equal," "a person or individual," "a worthless person."<P>(1) As "companion" it is the translation of chabher, "associate," "companion," "friend" (also chabbar, <a onClick="return mV(\'Job\',41,6);">Job 41:6</a>), where we have the original sense of partnership, translated "bands" the Revised Version (British and American), the King James Version "companions"); <a onClick="return mV(\'Psa\',45,7);">Ps 45:7</a>, "God hath anointed thee...above thy fellows"; of habhrah (<a onClick="return mV(\'Ecc\',4,10);">Ec 4:10</a>; <a onClick="return mV(\'Dan\',7,20);">Da 7:20</a>); of rea\', "companion," "friend," "another" (<a onClick="return mV(\'Exd\',2,13);">Ex 2:13</a>; <a onClick="return mV(\'Jdg\',7,13,14,22);">Jud 7:13-14, 22</a>); re\'ah (or ra\'yah), "a female friend" (<a onClick="return mV(\'Jdg\',11,37);">Jud 11:37</a>, "I and my fellows," the Revised Version (British and American) "companions"; here the King James Version applies "fellow" to a female; compare Baruch 6:43, "She reproacheth her fellow," he plesion); in <a onClick="return mV(\'Jdg\',11,38);">Jud 11:38</a>, "companions" is the translation of \'amith, "fellowship"; \'amith (<a onClick="return mV(\'Zec\',13,7);">Zec 13:7</a>, "the man that is my fellow," literally, "the man of my fellowship"); hetairos, "companion" (<a onClick="return mV(\'Mat\',11,16);">Mt 11:16</a>); metochos, "partner"; (compare <a onClick="return mV(\'Luk\',5,7);">Lu 5:7</a>; <a onClick="return mV(\'Hbr\',1,9);">Heb 1:9</a>, quoted from <a onClick="return mV(\'Psa\',45,7);">Ps 45:7</a>, Septuagint for chabher).<P>(2) As an individual or person "fellow" is the translation of \'ish, "a man," "an individual": "make this fellow return" (<a onClick="return mV(\'1Sa\',29,4);">1Sa 29:4</a> the King James Version, the Revised Version (British and American) "the man"); in the same verse "fellow" is supplied instead of "he"; "fellow" in 1611 meant simply "a man," and it is difficult to say in what passages the ideas of "worthless," etc., are meant to be implied; probably, however, in <a onClick="return mV(\'Jdg\',18,25);">Jud 18:25</a>, where the Hebrew is simply \'enosh, "man," and the text is almost the only deviation from the rendering "man," "men," "lest angry (margin, Revised Version "bitter of soul") fellows fall upon you"; also <a onClick="return mV(\'Act\',17,5);">Ac 17:5</a>, aner, "a man," "certain lewd fellows of the baser sort," the Revised Version (British and American) "vile fellows"; compare <a onClick="return mV(\'2Sa\',6,20);">2Sa 6:20</a>, "vain (req) fellows" (supplied); 1Macc 10:61, "contain pestilent fellows" (aner); Ecclesiasticus 8:15, "a bold fellow" (tolmeros), the Revised Version (British and American) "a rash man"; in several places of the Old Testament "fellow" represents zeh, "this," and in these instances there seems to be something of worthlessness or contempt implied (<a onClick="return mV(\'1Sa\',21,15);">1Sa 21:15</a>; <a onClick="return mV(\'1Sa\',25,21);">25:21</a>; <a onClick="return mV(\'1Ki\',22,27);">1Ki 22:27</a>; <a onClick="return mV(\'2Ki\',9,11);">2Ki 9:11</a>, and, as before, <a onClick="return mV(\'1Sa\',29,4);">1Sa 29:4</a> the Revised Version (British and American)); in the New Testament also "fellow" often represents houtos, "this," and in most of these cases the King James Version seems to intend something depreciatory to be understood; the Revised Version (British and American) gives simply "man" (<a onClick="return mV(\'Mat\',12,24);">Mt 12:24</a>; <a onClick="return mV(\'Mat\',26,61,71);">26:61, 71</a>; <a onClick="return mV(\'Luk\',22,59);">Lu 22:59</a>; <a onClick="return mV(\'Luk\',23,2);">23:2</a>; <a onClick="return mV(\'Jhn\',9,29);">Joh 9:29</a>; <a onClick="return mV(\'Act\',18,13);">Ac 18:13</a>); so Ecclesiasticus 13:23, "If the poor man speaks, they say, What fellow is this?" the Revised Version (British and American) "who is this?" 1Macc 4:5, "These fellows flee from us," the Revised Version (British and American) "these men." the Revised Version (British and American) has "fellows" for "persons" (<a onClick="return mV(\'Jdg\',9,4);">Jud 9:4</a>), for "men" (<a onClick="return mV(\'Jdg\',11,3);">Jud 11:3</a>); "base fellows" for "men the children of Belial" (<a onClick="return mV(\'Deu\',13,13);">De 13:13</a>), margin, "sons of worthlessness"; the American Standard Revised Version "worthless fellow" for "son of Belial" (<a onClick="return mV(\'1Sa\',25,17,25);">1Sa 25:17, 25</a>), "base fellows" for "sons of Belial" (<a onClick="return mV(\'Jdg\',19,22);">Jud 19:22</a>; <a onClick="return mV(\'Jdg\',20,13);">20:13</a>, etc.); the Revised Version (British and American) has also "companions" for "fellows" (<a onClick="return mV(\'Jdg\',11,37);">Jud 11:37</a>; <a onClick="return mV(\'Eze\',37,19);">Eze 37:19</a>; <a onClick="return mV(\'Dan\',2,13);">Da 2:13</a>), "each man his fellow" for "one another" (<a onClick="return mV(\'2Ki\',3,23);">2Ki 3:23</a>); "fellow by" for "neighbor in" (<a onClick="return mV(\'1Ki\',20,35);">1Ki 20:35</a>).<P>Fellow-citizen, Fellow-disciple, Fellow-heirs, Yokefellow, etc. In composition, "fellow" always means partner or companion.``185';
isbe[3410]='Fellowship`fel\'-o-ship.`<a href="./study/isbe/search.html?string=COMMUNION;+(FELLOWSHIP)">COMMUNION</a>`1';
isbe[3411]='Female`fe\'-mal: Two Hebrew words are thus translated:<P>(1) neqebhah, which is merely a physiological description of the sexual characteristic (from naqabh, "to perforate"), and which corresponds to zakhar, "male" (see under the word).<P>(2) \'ishshah, with the irregular plural nashim (only <a onClick="return mV(\'Gen\',7,2);">Ge 7:2</a>, in all other places "wife," "woman"), the feminine form of \'ish, "man."<P>The Greek word is thelus, literally, "the nursing one," "the one giving suck" (from thelazo, "to suckle").<P>Israelitic law seems frequently guilty of unjust partiality in favor of the male sex, but we have to consider that most of these legal and religious disabilities of women can be explained from the social conditions prevailing at the time of legislation. They are therefore found also in contemporaneous Gentile religions. Though traces of this prejudice against the weaker sex are found in the New Testament, the religious discrimination between the sexes has practically ceased, as is evident from <a onClick="return mV(\'Gal\',3,28);">Ga 3:28</a>: "There can be no male and female; for ye all are one man in Christ Jesus"; compare also <a onClick="return mV(\'1Pe\',3,7);">1Pe 3:7</a>.``106';
isbe[3412]='Fence`fens (batsar, mibhtsar):<P>Commonly used in the King James Version in the description of fortified places, as the translation of batsar, "to cut off," "to separate," "to fortify" (and forms) (<a onClick="return mV(\'Deu\',3,5);">De 3:5</a>; <a onClick="return mV(\'Deu\',9,1);">9:1</a>; <a onClick="return mV(\'Deu\',28,52);">28:52</a>, etc.); mibhtsar, "fenced city," is a fortified place (<a onClick="return mV(\'Num\',32,17,36);">Nu 32:17, 36</a>; <a onClick="return mV(\'Jos\',10,20);">Jos 10:20</a>; <a onClick="return mV(\'Jos\',19,35);">19:35</a>, etc.); matsor, "fenced cities," means "bulwark," "citadel" (<a onClick="return mV(\'2Ch\',8,5);">2Ch 8:5</a>); metsurah, "fortification" (<a onClick="return mV(\'2Ch\',11,23);">2Ch 11:23</a>; <a onClick="return mV(\'2Ch\',12,4);">12:4</a>; <a onClick="return mV(\'2Ch\',14,6);">14:6</a>; <a onClick="return mV(\'2Ch\',21,3);">21:3</a>); for "fenced" the American Standard Revised Version substitutes "fortified" in all these instances; in <a onClick="return mV(\'Dan\',11,15);">Da 11:15</a>, mibhtsar is "a well-fortified city," margin "the fortified cities," the English Revised Version "well-fenced"; "fence" is also the translation of gadher, "a wall" or "fence" (<a onClick="return mV(\'Job\',19,8);">Job 19:8</a> the American Standard Revised Version, "walled up" (gadhar); <a onClick="return mV(\'Psa\',62,3);">Ps 62:3</a>); \'azaq, "to loosen" (the ground) as with a mattock (<a onClick="return mV(\'Isa\',5,2);">Isa 5:2</a>, where the King James Version has "fenced" it (the vineyard), the American Standard Revised Version "digged it," the English Revised Version "made a trench about it," margin "digged it" sukh, "to interweave" or "interlace" (<a onClick="return mV(\'Job\',10,11);">Job 10:11</a>, the Revised Version (British and American) "clothed"); male\', "to be or become full" (<a onClick="return mV(\'2Sa\',23,7);">2Sa 23:7</a>, the Revised Version (British and American) "armed," margin "Hebrew filled").<P>ERV has "fence" for "wall" (<a onClick="return mV(\'Num\',22,24);">Nu 22:24</a>; <a onClick="return mV(\'Isa\',5,5);">Isa 5:5</a>; <a onClick="return mV(\'Hsa\',2,6);">Ho 2:6</a>; the American Standard Revised Version retains "wall"), for "hedge" (<a onClick="return mV(\'Ecc\',10,8);">Ec 10:8</a>; <a onClick="return mV(\'Eze\',13,5);">Eze 13:5</a>; <a onClick="return mV(\'Eze\',22,30);">22:30</a>; the American Standard Revised Version "wall"); "fenced" for "walled" (<a onClick="return mV(\'Num\',13,28);">Nu 13:28</a>; <a onClick="return mV(\'Deu\',1,28);">De 1:28</a>; the American Standard Revised Version "fortified"); compare for "strong" <a onClick="return mV(\'Jos\',19,29);">Jos 19:29</a>; <a onClick="return mV(\'Neh\',9,25);">Ne 9:25</a>; <a onClick="return mV(\'Psa\',108,10);">Ps 108:10</a> (margin <a onClick="return mV(\'Jos\',19,29);">Jos 19:29</a>, "the city of Mibzar-zor, that is, the fortress of Tyre," the English Revised Version, "fenced"), for "hedged" (<a onClick="return mV(\'Lam\',3,7);">La 3:7</a>, American Revised Version, "walled"); compare for "defenced," the English Revised Version "fenced," the American Standard Revised Version "fortified" (<a onClick="return mV(\'Isa\',36,1);">Isa 36:1</a>; <a onClick="return mV(\'Isa\',37,26);">37:26</a>, etc.); "fences" for "hedges" (<a onClick="return mV(\'Psa\',80,12);">Ps 80:12</a>, the American Standard Revised Version "walls"); in <a onClick="return mV(\'Jer\',49,3);">Jer 49:3</a>, the English Revised Version and the American Standard Revised Version have "fences."`<a href="./study/isbe/search.html?string=HEDGE">HEDGE</a>`185';
isbe[3413]='Fenced Cities``<a href="./study/isbe/search.html?string=FORTIFICATION">FORTIFICATION</a>`1';
isbe[3414]='Ferret`fer\'-et (\'anaqah, the Revised Version (British and American) <a href="./study/isbe/search.html?string=GECKO">GECKO</a>): Occurs only in <a onClick="return mV(\'Lev\',11,30);">Le 11:30</a> the King James Version, in the list of animals which are unclean "among the creeping things that creep upon the earth." the Revised Version (British and American) has "gecko" with the marginal note, "Words of uncertain meaning, but probably denoting four kinds of lizards." The list of animals in <a onClick="return mV(\'Lev\',11,29,30);">Le 11:29-30</a> includes<P>(1) choledh, English Versions of the Bible "weasel";<P>(2) \'akhbar, English Versions of the Bible "mouse";<P>(3) tsabh, the King James Version "tortoise," the Revised Version (British and American) "great lizard";<P>(4) \'anaqkah, the King James Version "ferret," the Revised Version (British and American) "gecko";<P>(5) koach the King James Version "chameleon," the Revised Version (British and American) "land crocodile";<P>(6) leta\'ah, English Versions of the Bible "lizard";<P>(7) chomet, the King James Version "snail," the Revised Version (British and American) "sand lizard";<P>(8) tinshemeth, the King James Version "mole," the Revised Version (British and American) "chameleon."<P>It will be noted that while Revised Version makes the first two mammals and the remaining six reptiles, the King James Version makes not only (1) and (2) but also (4) and (8) mammals, and (7) a mollusk. So far as this general classification is concerned the King James Version follows the Septuagint, except in the case of (7). It must be borne in mind that all these words except (2) and (8) occur only in this passage, while (2) and (8) occur each in only a few passages where the context throws but uncertain light upon the meaning. Under these circumstances we ought to be content with the rendering of the Septuagint, unless from philology or tradition we can show good reason for differing. For \'anaqah, Septuagint has mugale, which occurs in Herodotus and Aristotle and may be a shrew mouse or a field mouse. Just as the next word, koach, is found in other passages (see <a href="./study/isbe/search.html?string=CHAMELEON">CHAMELEON</a>) with the meaning of "strength," so \'anaqah occurs in several places signifying "moaning" or "sighing" (<a onClick="return mV(\'Psa\',12,5);">Ps 12:5</a>; <a onClick="return mV(\'Psa\',79,11);">79:11</a>; <a onClick="return mV(\'Psa\',102,20);">102:20</a>; <a onClick="return mV(\'Mal\',2,13);">Mal 2:13</a>). It seems to be from the root, \'anaq, "to choke," "to be in anguish" (compare \'anaq, "a collar"; chanaq, "to choke"; Arabic \'unq, "neck"; Arabic khanaq, "to strangle"; Greek anagke; Latin angustus; German enge, Nacken; English "anxious," "neck"). Some creature seems to be meant which utters a low cry or squeak, and neither "ferret" (the King James Version) nor "gecko" (Revised Version (British and American)) seems to have a better claim than the older Septuagint rendering of mugale ="shrew mouse" or "field mouse."``37';
isbe[3415]='Ferry-Boat`fer\'-i-bot (<a onClick="return mV(\'2Sa\',19,18);">2Sa 19:18</a>).`<a href="./study/isbe/search.html?string=SHIPS+AND+BOATS">SHIPS AND BOATS</a>`1';
isbe[3416]='Fervent`fur\'-vent (dalaq; ektenes, zeo):<P>"Fervent" (from Latin fervere, "to boil") does not occur in the King James Version of the Old Testament, but the Revised Version (British and American) gives it as the translation of dalaq, "to burn" (<a onClick="return mV(\'Pro\',26,23);">Pr 26:23</a>), instead of "burning," "fervent lips and a wicked heart." In the New Testament it is the translation of ektenes, "stretched out," hence, intent, earnest (<a onClick="return mV(\'1Pe\',4,8);">1Pe 4:8</a>, "being fervent in your love among yourselves"); of zeo, "to boil," "to be hot" (<a onClick="return mV(\'Rom\',12,11);">Ro 12:11</a>, "fervent in spirit," <a onClick="return mV(\'Act\',18,25);">Ac 18:25</a>); of zelos, "zeal," "fervor" (<a onClick="return mV(\'2Cr\',7,7);">2Co 7:7</a>, the Revised Version (British and American) "zeal"), in <a onClick="return mV(\'Jam\',5,16);">Jas 5:16</a> the King James Version has: "The effectual fervent prayer of a righteous man availeth much," where the Greek is: polu ischuei deesis dikaiou energoumene, which the Revised Version (British and American) renders, "The supplication of a righteous man availeth much in its working."<P>"Fervently" is the translation of agonizomai, "to strive or struggle" (agonize), <a onClick="return mV(\'Col\',4,12);">Col 4:12</a> the King James Version, the Revised Version (British and American) "Epaphras...striving for you in his prayers"; of ektenos, literally, in an outstretched manner (<a onClick="return mV(\'1Pe\',1,22);">1Pe 1:22</a>, the Revised Version (British and American) "Love one another from the heart fervently"; compare <a onClick="return mV(\'1Pe\',4,8);">1Pe 4:8</a>, "fervent in your love among yourselves"). Christian love too often lacks this fervency, but Christ\'s love for us was "stretched out" to the uttermost.<P>The Revised Version (British and American) has "fervently" for "earnestly" (<a onClick="return mV(\'Jam\',5,17);">Jas 5:17</a>, margin "with prayer").``185';
isbe[3417]='Festival`fes\'-ti-val.`<a href="./study/isbe/search.html?string=FEASTS+AND+FASTS">FEASTS AND FASTS</a>`1';
isbe[3418]='Festus; Porcius`fes\'-tus, por\'-shi-us Porkios Phestos):<P>The Roman governor or procurator who succeeded Felix in the province of Judea (<a onClick="return mV(\'Act\',24,27);">Ac 24:27</a>), and was thus brought into prominence in the dispute between Paul and the Sanhedrin which continued after the retirement of Felix (<a onClick="return mV(\'Act\',25,\'1-\');">Ac 25</a>; <a onClick="return mV(\'Act\',26,\'1-\');">26</a>). Upon the arrival of Festus in Jerusalem, the official capital of his province, the Jews besought of him to send Paul from Caesarea to Jerusalem to appear before them, intending to kill him on the way (<a onClick="return mV(\'Act\',25,3);">Ac 25:3</a>). Festus at first refused their request, and upon his return to Caesarea proceeded himself to examine Paul (<a onClick="return mV(\'Act\',25,6);">Ac 25:6</a>). But on finding that the evidence was conflicting, and reflecting that, as the accused was apparently charged on religious rather than on political grounds, the Sanhedrin was a more suitable court for his case than a Roman tribunal, he asked Paul if he were agreeable to make the journey to Jerusalem (<a onClick="return mV(\'Act\',25,\'7-9\');">Ac 25:7-9</a>). But Paul, who knew well the nefarious use that the Jews would make of the pleasure which Festus was willing to grant them, made his appeal unto Caesar (<a onClick="return mV(\'Act\',25,10,11);">Ac 25:10-11</a>). To this request of a Roman citizen accused on a capital charge (compare <a onClick="return mV(\'Act\',25,16);">Ac 25:16</a>), Festus had perforce to give his consent (<a onClick="return mV(\'Act\',25,12);">Ac 25:12</a>). But the manner of his consent indicated his pique at the apparent distrust shown by Paul. By the words "unto Caesar shalt thou go," Festus implied that the case must now be proceeded with to the end: otherwise, had it been left in his own hands, it might have been quashed at an earlier stage (compare also <a onClick="return mV(\'Act\',26,32);">Ac 26:32</a>). Meantime King Agrippa and Bernice had arrived in Caesarea, and to these Festus gave a brief explanation of the circumstances (<a onClick="return mV(\'Act\',25,\'13-21\');">Ac 25:13-21</a>).<P>The previous audiences of Festus with Paul and his accusers had, however, served only to confuse him as to the exact nature of the charge. Paul was therefore summoned before the regal court, in order both that Agrippa might hear him, and that the governor might obtain more definite information for insertion in the report he was required to send along with the prisoner to Rome (<a onClick="return mV(\'Act\',25,\'22-27\');">Ac 25:22-27</a>). The audience which followed was brought to an abrupt conclusion by the interruption of Paul\'s speech (<a onClick="return mV(\'Act\',26,\'1-23\');">Ac 26:1-23</a>) by Festus: "Paul, thou art mad; thy much learning is turning thee mad" (<a onClick="return mV(\'Act\',26,24);">Ac 26:24</a>). Yet the meeting was sufficient to convince both Agrippa and Festus that "this man doeth nothing worthy of death or of bonds" (<a onClick="return mV(\'Act\',26,31);">Ac 26:31</a>).<P>While Festus displayed a certain contempt for what he regarded as the empty delusions of a harmless maniac, his conduct throughout the whole proceeding was marked by a strict impartiality; and his straightforward dealing with Paul formed a marked contrast to the dilatoriness of Felix. The praise bestowed upon the latter by Tertullus (<a onClick="return mV(\'Act\',24,2);">Ac 24:2</a>) might with better reason have been bestowed on Festus, in that he freed the country from many robbers (Sicarii: Josephus, Ant, XX, viii-x; BJ, II, xiv, 1); but his procuratorship was too short to undo the harm wrought by his predecessor. The exact date of his accession to office is uncertain, and has been variously placed at 55-61 AD<P>(compare Knowling in Expositor\'s Greek Testament, II, 488-89; see also <a href="./study/isbe/search.html?string=FELIX">FELIX</a>).``88';
isbe[3419]='Fetch`fech (laqach):<P>Has generally the meaning of "to bring"; it is commonly the translation of Hebrew laqach, "to take" or "lay hold of," Hoph. "to be brought, seized or snatched away" (<a onClick="return mV(\'Gen\',18,4);">Ge 18:4</a>, etc.; <a onClick="return mV(\'Gen\',27,9);">Ge 27:9</a>; <a onClick="return mV(\'Gen\',42,16);">42:16</a>; <a onClick="return mV(\'1Sa\',4,3);">1Sa 4:3</a>; <a onClick="return mV(\'1Ki\',17,10);">1Ki 17:10</a>, etc.); twice of nasa\', "to lift up" (<a onClick="return mV(\'2Ch\',12,11);">2Ch 12:11</a>, the American Standard Revised Version "bare"; <a onClick="return mV(\'Job\',36,3);">Job 36:3</a>); of bo\', "to come in" (<a onClick="return mV(\'2Ch\',1,17);">2Ch 1:17</a>; <a onClick="return mV(\'Neh\',8,15);">Ne 8:15</a>); of \'alah, "to cause to come up" (<a onClick="return mV(\'1Sa\',6,21);">1Sa 6:21</a>; <a onClick="return mV(\'1Sa\',7,1);">7:1</a>); of yatsa\', "to cause to come out" (<a onClick="return mV(\'Num\',20,10);">Nu 20:10</a>, the American Standard Revised Version "bring forth"; <a onClick="return mV(\'Jer\',26,23);">Jer 26:23</a>), and of a number of other words.<P>In the New Testament it is the translation of exago, "to lead out" (<a onClick="return mV(\'Act\',16,37);">Ac 16:37</a>, "Let them come themselves and fetch us out," the Revised Version (British and American) "bring"); "to fetch a compass" is the translation of cabhabh (<a onClick="return mV(\'Num\',34,5);">Nu 34:5</a>; <a onClick="return mV(\'Jos\',15,3);">Jos 15:3</a>, the Revised Version (British and American) "turn," "turned about"; <a onClick="return mV(\'2Sa\',5,23);">2Sa 5:23</a>, the Revised Version (British and American) "make a circuit"; <a onClick="return mV(\'2Ki\',3,9);">2Ki 3:9</a>, the Revised Version (British and American) "made a circuit"); of perierchomai (aor. 2, perielthon), "to go about," "to wander up and down" (of a ship driven about; <a onClick="return mV(\'Act\',28,13);">Ac 28:13</a>, the Revised Version (British and American) "made a circuit," margin "some ancient authorities read cast loose").<P>The Revised Version (British and American) has "fetch" for "bring" (<a onClick="return mV(\'1Ki\',3,24);">1Ki 3:24</a>), for "call for" (<a onClick="return mV(\'Act\',10,5);">Ac 10:5</a>; <a onClick="return mV(\'Act\',11,13);">11:13</a>); "fetched" for "called for" (<a onClick="return mV(\'Est\',5,10);">Es 5:10</a>), for "took out" (<a onClick="return mV(\'Jer\',37,17);">Jer 37:17</a>); "fetched" for "took" (<a onClick="return mV(\'2Ch\',8,18);">2Ch 8:18</a>).``185';
isbe[3420]='Fetter`fet\'-er:<P>Found only in the plural in both Old Testament and New Testament; fetters of iron (<a onClick="return mV(\'Psa\',105,18);">Ps 105:18</a>; <a onClick="return mV(\'Psa\',149,8);">149:8</a>; so probably <a onClick="return mV(\'Mar\',5,4);">Mr 5:4</a>; <a onClick="return mV(\'Luk\',8,29);">Lu 8:29</a>) or brass (<a onClick="return mV(\'Jdg\',16,21);">Jud 16:21</a>; <a onClick="return mV(\'2Ki\',25,7);">2Ki 25:7</a>) were frequently used for securing prisoners.<P>Figurative: of trouble (<a onClick="return mV(\'Job\',36,8);">Job 36:8</a>).`<a href="./study/isbe/search.html?string=CHAIN;+CHAINS">CHAIN</a>`1';
isbe[3421]='Fever`fe\'-ver (qaddachath, dalleqeth; puretos, derived from a root signifying "to burn"):<P>A generic term, applied to all diseases characterized by high temperature of body. Several forms of febrile disease are among the commonest of all maladies in Palestine today, as they were also in the period covered by the Bible history. Of these the most prevalent is ague or intermittent malarial fever, which is common in all parts but especially in low-lying districts or places where there are pools or marshes in which mosquitoes breed, these insects being the commonest carriers of the malaria bacillus. These fevers are generally more severe in late summer and autumn, when the mosquitoes are most numerous, and when there is a liability to chill, owing to the sudden drop of temperature at sunset. During the day one uses as light clothing as possible, but immediately after sunset the air becomes chilly and damp, and the physiological resistance to the influence of the parasite is remarkably diminished. On this account travelers in Palestine at this season should be particular to avoid exposure to these evening damps, and to use mosquito curtains invariably at night.<P>In most tropical countries now houses are rendered mosquito-proof by close wire netting, and thereby the risk of infection is much diminished. In Palestine the marshes of the north about Banias and the Water of Merom, the Shephelah, and the Jordan valley are the most fever-stricken regions of the country. The word qaddachath is translated burning ague in <a onClick="return mV(\'Lev\',26,16);">Le 26:16</a> the King James Version (the Revised Version (British and American) "fever"), and is coupled with dalleqeth, translated inflammation in <a onClick="return mV(\'Deu\',28,22);">De 28:22</a>. Septuagint renders the former word puretos, and the latter rhigos in this passage, a collocation which is interesting as Galen uses these words together rhigopuretos in his description of a fever identical with that common in Palestine. In Leviticus, the word in Septuagint is ikteros which literally means jaundice, a disease otherwise not mentioned in the Bible.<P>In Palestine as in other malarious countries the condition of jaundice or yellowing of the skin frequently accompanies repeated and protracted attacks of fever which cause organic disease of the liver. On this account Hippocrates describes all fevers as due to a perverted secretion of bile. These fevers begin with severe shivering fits, hence, the name rhigos which is used by Hippocrates. This is followed by a period of burning dry heat, ending in a period of profuse perspiration. Such attacks may take place daily, a few hours of interval with normal temperature separating the end of one fit from the onset of the next.<P>The commonest type however is that called tertian, in which a whole day separates one fit from the next. In some of the severe fevers which are rife in the Jordan valley the temperature never falls to the normal, and while there is a short remission between the attacks with a body heat a little above the normal, there is no intermission. Rarer febrile conditions which have been met with in Palestine, such as the Malta fever, present the same characteristics and may continue for months. Cases also of genuine blackwater fever have been recorded by several authorities. It is probable that in former days these fevers were even worse than they are now, as ancient medicine knew of no certain remedy for them. At present they generally yield at once to treatment by quinine, and in my own experience I believe that the administration of this remedy in large and repeated doses is the most effectual treatment.<P>Other febrile diseases are rife in certain districts in Palestine, and probably existed in Bible times. Typhoid is common in some crowded towns and villages, and considering how little protected the wells are from contamination, the wonder is that it is not much more prevalent. It is probable also that typhus then, as now, was present as an occasional epidemic in the more crowded cities, but even the physicians of Greece and Rome did not differentiate these diseases. All these fevers seem also to have existed in Egypt to much the same extent as in Palestine. The Papyrus Ebers speaks of "a fever of the gods" (46) and another called "a burning of the heart" (102). Its causation is attributed to the influence of the "god of fever," and the evil sequelae of the disease as it affects the heart, stomach, eyes and other organs are described in terms which remind us of the minatory passages in <a onClick="return mV(\'Lev\',26,\'1-\');">Le 26</a> and <a onClick="return mV(\'Deu\',28,\'1-\');">De 28</a>. The conditions there mentioned, such as consuming the eyes and causing sorrow of heart or pining away of the soul, graphically describe the state frequently seen affecting those in the Shephelah villages who have suffered from frequent returns of fever, and who in consequence have developed serious local affections of the liver, spleen and other organs. Before the introduction of quinine, cases of this kind must have been much more commonly met with than they are now. It is probable that this state is that called shachepheth, or consumption, in these passages.<P>Another form of fever, charchur, the "extreme burning" of the King James Version or "fiery heat" of the Revised Version (British and American), is coupled with the other forms of fever in <a onClick="return mV(\'Deu\',28,22);">De 28:22</a>. This is called in Septuagint erethismos or irritation, and may have been a feverish condition with a reddened skin, possibly erysipelas or else one of the eruptive fevers. At present outbreaks of scarlatina, measles and erysipelas are of fairly frequent occurrence and are often very severe.<P>In the New Testament fever is mentioned eight times. The disease which affected Simon\'s wife\'s mother is called a "great fever" (<a onClick="return mV(\'Luk\',4,38);">Lu 4:38</a>), and that which nearly proved fatal to the nobleman\'s son in the same district was also a fever (<a onClick="return mV(\'Jhn\',4,52);">Joh 4:52</a>). Cases of the kind are common all round the Sea of Galilee at the present day.``107';
isbe[3422]='Field`feld.`<a href="./study/isbe/search.html?string=AGRICULTURE">AGRICULTURE</a>`1';
isbe[3423]='Fiery Heat`fi\'-er-i, fir\'-i het:<P>In <a onClick="return mV(\'Deu\',28,22);">De 28:22</a>, where the King James Version has "an extreme burning."`<a href="./study/isbe/search.html?string=FEVER">FEVER</a>`1';
isbe[3424]='Fiery Serpent``<a href="./study/isbe/search.html?string=SERPENT">SERPENT</a>`1';
isbe[3425]='Fig, Fig-Tree`fig\'-tre (te\'enah, plural te\'enim, specially "figs"; paggim, "green figs" only in <a onClick="return mV(\'Sgs\',2,13);">So 2:13</a>; suke, "fig-tree," sukon, "fig"):<P>1. Fig-Trees in the Old Testament:<P>The earliest Old Testament reference to the fig is to the leaves, which Adam and Eve converted into aprons (<a onClick="return mV(\'Gen\',3,7);">Ge 3:7</a>). The promised land was described (<a onClick="return mV(\'Deu\',8,8);">De 8:8</a>) as "a land of wheat and barley, and vines and fig-trees and pomegranates," etc. The spies who visited it brought, besides the cluster of grapes, pomegranates and figs (<a onClick="return mV(\'Num\',13,23);">Nu 13:23</a>). The Israelites complained that the wilderness was "no place of seed, or of figs, or of vines, or of pomegranates" (<a onClick="return mV(\'Num\',20,5);">Nu 20:5</a>). When Egypt was plagued, the fig-trees were smitten (<a onClick="return mV(\'Psa\',105,33);">Ps 105:33</a>); a similar punishment was threatened to unfaithful Israel (<a onClick="return mV(\'Jer\',5,17);">Jer 5:17</a>; <a onClick="return mV(\'Hsa\',2,12);">Ho 2:12</a>; <a onClick="return mV(\'Amo\',4,9);">Am 4:9</a>). It is only necessary to ride a few miles among the mountain villages of Palestine, with their extensive fig gardens, to realize what a long-lasting injury would be the destruction of these slow-growing trees. Years of patient labor—such as that briefly hinted at in <a onClick="return mV(\'Luk\',13,7);">Lu 13:7</a>—must pass before a newly planted group of fig-trees can bear profitably. Plenitude of fruitful vines and fig-trees, specially individual ownership, thus came to be emblematical of long-continued peace and prosperity. In the days of Solomon "Judah and Israel dwelt safely, every man under his vine and under his fig-tree" (<a onClick="return mV(\'1Ki\',4,25);">1Ki 4:25</a>). Compare also <a onClick="return mV(\'2Ki\',18,31);">2Ki 18:31</a>; <a onClick="return mV(\'Isa\',36,16);">Isa 36:16</a>; <a onClick="return mV(\'Mic\',4,4);">Mic 4:4</a>; <a onClick="return mV(\'Zec\',3,10);">Zec 3:10</a>; 1Macc 14:12. Only a triumphal faith in Yahweh could rejoice in Him "though the fig-tree shall hot flourish" (<a onClick="return mV(\'Hab\',3,17);">Hab 3:17</a>).<P>2. Natural History of the Fig-Tree:<P>The Ficus carica, which produces the common fig, is a tree belonging to the Natural Order. Urticaceae, the nettle family, which includes also the banyan, the India rubber fig-tree, the sycamore fig and other useful plants. Fig-trees are cultivated all over the Holy Land, especially in the mountain regions. Wild fig-trees—usually rather shrubs than trees—occur also everywhere; they are usually barren and are described by the fellahin as "male" trees; it is generally supposed that their presence is beneficial to the cultivated variety. The immature flowers harbor small insects which convey pollen to the female flowers and by their irritating presence stimulate the growth of the fruit. Artificial fertilization has been understood since ancient times, and there may be a reference to it in <a onClick="return mV(\'Amo\',7,14);">Am 7:14</a>.<P>Fig-trees are usually of medium height, 10 or 15 ft. for full-grown trees, yet individual specimens sometimes attain as much as 25 ft. The summer foliage is thick and surpasses other trees of its size in its cool and dense shade. In the summer owners of such trees may be seen everywhere sitting in their shadow (<a onClick="return mV(\'Jhn\',1,48);">Joh 1:48</a>). Such references as Mac 4:4; <a onClick="return mV(\'Zec\',3,10);">Zec 3:10</a>, etc., probably are to this custom rather than to the not uncommon one of having a fig-tree overhanging a dwelling.<P>3. Figs:<P>The fruit of the fig-tree is peculiar. The floral axis, instead of expanding outward, as with most flowers, closes, as the flower develops, upon the small internal flowers, leaving finally but a small opening at the apex; the axis itself becomes succulent and fruit-like. The male flowers lie around the opening, the female flowers deeper in; fertilization is brought about by the presence of small hymenopterous insects.<P>There are many varieties of figs in Palestine differing in sweetness, in color and consistence; some are good and some are bad (compare <a onClick="return mV(\'Jer\',24,1,8);">Jer 24:1, 8</a>; <a onClick="return mV(\'Jer\',29,17);">29:17</a>). In Palestine and other warm climates the fig yields two crops annually—an earlier one, ripe about June, growing from the "old wood," i.e. from the midsummer sprouts of the previous year, and a second, more important one, ripe about August, which grows upon the "new wood," i.e. upon the spring shoots. By December, fig-trees in the mountainous regions of Palestine have shed all their leaves, and they remain bare until about the end of March, when they commence putting forth their tender leaf buds (<a onClick="return mV(\'Mat\',24,32);">Mt 24:32</a>; <a onClick="return mV(\'Mar\',13,28,32);">Mr 13:28, 32</a>; <a onClick="return mV(\'Luk\',21,\'29-33\');">Lu 21:29-33</a>), and at the same time, in the leaf axils, appear the tiny figs. They belong to the early signs of spring:<P class="in15">"The voice of the turtle-dove is heard in our land;<br>The fig-tree ripeneth her green figs" (paggim)<br>—<a onClick="return mV(\'Sgs\',2,12,13);">So 2:12-13</a>.<P>4. Early Figs:<P>These tiny figs develop along with the leaves up to a certain point—to about the size of a small cherry—and then the great majority of them fall to the ground, carried down with every gust of wind. These are the "unripe figs" (olunthos)—translated, more appropriately in the King James Version, as "untimely figs"—of <a onClick="return mV(\'Rev\',6,13);">Re 6:13</a>. Compare also <a onClick="return mV(\'Isa\',34,4);">Isa 34:4</a> the King James Version—in the Revised Version (British and American) "leaf" has been supplied instead of "fig." These immature figs are known to the fellahin as taksh, by whom they are eaten as they fall; they may even sometimes be seen exposed for sale in the markets in Jerusalem. In the case of many trees the whole of this first crop may thus abort, so that by May no figs at all are to be found on the tree, but with the best varieties of fig-trees a certain proportion of the early crop of figs remains on the tree, and this fruit reaches ripe perfection about June. Such fruit is known in Arabic as dafur, or "early figs," and in Hebrew as bikkurah, "the first-ripe" (<a onClick="return mV(\'Isa\',28,4);">Isa 28:4</a>; <a onClick="return mV(\'Jer\',24,2);">Jer 24:2</a>; <a onClick="return mV(\'Hsa\',9,10);">Ho 9:10</a>). They are now, as of old, esteemed for their delicate flavor (<a onClick="return mV(\'Mic\',7,1);">Mic 7:1</a>, etc.).<P>5. The Cursing of the Barren Fig-Tree:<P>The miracle of our Lord (<a onClick="return mV(\'Mat\',21,\'18-20\');">Mt 21:18-20</a>; <a onClick="return mV(\'Mar\',11,12,13,20,21);">Mr 11:12-13, 20-21</a>) which occurred in the Passover season, about April, will be understood (as far as the natural phenomena are concerned) by the account given above of the fruiting of the fig-tree, as repeatedly observed by the present writer in the neighborhood of Jerusalem. When the young leaves are newly appearing, in April, every fig-tree which is going to bear fruit at all will have some taksh ("immature figs") upon it, even though "the time of figs" (<a onClick="return mV(\'Mar\',11,13);">Mr 11:13</a> the King James Version), i.e. of ordinary edible figs—either early or late crop—"was not yet." This taksh is not only eaten today, but it is sure evidence, even when it falls, that the tree bearing it is not barren. This acted parable must be compared with <a onClick="return mV(\'Luk\',13,6,9);">Lu 13:6, 9</a>; now the time of judgment was surely coming, the fate of the fruitless Jewish nation was forcibly foretold.<P>6. Dried Figs:<P>While fresh figs have always been an important article of diet in their season (<a onClick="return mV(\'Neh\',13,15);">Ne 13:15</a>) the dried form is even more used. They are today dried in the sun and threaded on strings (like long necklaces) for convenience of carriage. A "cake of figs" (debhelah, literally, "pressed together") is mentioned (<a onClick="return mV(\'1Sa\',30,12);">1Sa 30:12</a>); Abigail gave 200 such cakes of figs to David (<a onClick="return mV(\'1Sa\',25,18);">1Sa 25:18</a>); the people of Northern Israel sent, with other things, "cakes of figs" as a present to the newly-crowned David (<a onClick="return mV(\'1Ch\',12,40);">1Ch 12:40</a>). Such masses of figs are much used today—they can be cut into slices with a knife like cheese. Such a mass was used externally for Hezekiah\'s "boil" (<a onClick="return mV(\'Isa\',38,21);">Isa 38:21</a>; <a onClick="return mV(\'2Ki\',20,7);">2Ki 20:7</a>); it was a remedy familiar to early medical writers.``117';
isbe[3426]='Fight``<a href="./study/isbe/search.html?string=WAR;+WARFARE">WAR</a>; <a href="./study/isbe/search.html?string=GAMES">GAMES</a>`1';
isbe[3427]='Figure`fig\'-ur, fig\'-yur (cemel, cemel; tupos):<P>The translation of cemel, or cemel, "a likeness or image"; perhaps a transposition of tselem, the usual word for likeness; it is elsewhere translated "idol" and "image" (<a onClick="return mV(\'Deu\',4,16);">De 4:16</a>, "the similitude of any figure," the Revised Version (British and American) "in the form of any figure"); of tabhnith, "form or likeness" (<a onClick="return mV(\'Isa\',44,13);">Isa 44:13</a>, "shapeth it (the idol)...after the figure of a man"; compare <a onClick="return mV(\'Deu\',4,16);">De 4:16</a>); of miqla\'ath, "carving," "carved work" (<a onClick="return mV(\'1Ki\',6,29);">1Ki 6:29</a>: "And he carved all the walls of the house round about with carved figures of cherubim and palm-trees and open flowers, within and without," only here and in <a onClick="return mV(\'1Ki\',6,32);">1Ki 6:32</a>; <a onClick="return mV(\'1Ki\',7,31);">7:31</a> where the word is translated "carving" and "graying"); in the New Testament "figure" is the translation of tupos, primarily "a mark," "print," "impression," "something made by blows," hence, "figure," "statue," tropically "form," "manner"; a person bearing the form or figure of another, having a certain resemblance, preceding another to come, model, exemplar (<a onClick="return mV(\'Act\',7,43);">Ac 7:43</a>), "the figures (images) which ye made to worship them"; <a onClick="return mV(\'Rom\',5,14);">Ro 5:14</a>, "who is the figure (Revised Version, "a figure") of him that was to come," that is, the first Adam was a type of the second Adam, Christ; of antitupon, that which corresponds to a type or model (<a onClick="return mV(\'Hbr\',9,24);">Heb 9:24</a> the King James Version, "Christ is not entered into the holy places made with hands, which are the figures of the true; but into heaven itself"); the meaning is simply the correspondence, or likeness (of the tabernacle to heaven), therefore the Revised Version (British and American) renders "like in pattern to the true" (<a onClick="return mV(\'1Pe\',3,21);">1Pe 3:21</a>, "the like figure whereunto (even) baptism doth also now save us," i.e. baptism is the antitype of the ark "wherein...eight souls were saved (or brought safely) through water," Revised Version "which also after a true likeness (m "in the antitype") doth now save you even baptism"); of parabole, "a placing alongside", a "comparison," "similitude," hence, image, figure, type (<a onClick="return mV(\'Hbr\',9,9);">Heb 9:9</a>, "which was a figure for the time then present," the American Standard Revised Version "which is a figure for the time present," the English Revised Version "parable" and "(now) present," namely, the entrance of the high priest into the Holy of Holies was a type of Christ\'s entrance into heaven; <a onClick="return mV(\'Hbr\',11,19);">Heb 11:19</a>, "from whence (from the dead) also he received him in a figure," i.e. Abraham received Isaac back from the dead as it were, in the likeness of a resurrection, he not being actually dead, the American Standard Revised Version "from whence he did also in a figure receive him back," the English Revised Version "in a parable"); metaschematizo, "to change the form or appearance," "to transfer figuratively" (<a onClick="return mV(\'1Cr\',4,6);">1Co 4:6</a>,"these things, brethren, I have in a figure transferred to myself and Apollos"; the Geneva version reads "I have figuratively described in my own person"). Paul is "substituting himself and Apollos for the teachers most in repute at Corinth that he might thus avoid personality." "Figure" is supplied in Ecclesiasticus 49:9, with en ombro, "He made mention of the enemies under the figure of the rain," the Revised Version (British and American) "He remembered the enemies in storm," margin "(Greek) rain."<P>The Revised Version (British and American) has "a figure" margin "an interpretation," for "the interpretation" (<a onClick="return mV(\'Pro\',1,6);">Pr 1:6</a>; the word is melitsah, only here and <a onClick="return mV(\'Hab\',2,6);">Hab 2:6</a>, meaning properly what is involved and needs interpretation; in <a onClick="return mV(\'Hab\',2,6);">Hab 2:6</a> it is translated "taunting proverb," the Revised Version, margin "riddle"); "figured stone" for "image of stone" (<a onClick="return mV(\'Lev\',26,1);">Le 26:1</a>); "figured stones" for "pictures" (<a onClick="return mV(\'Num\',33,52);">Nu 33:52</a>).``185';
isbe[3428]='File`fil:<P>Found only in <a onClick="return mV(\'1Sa\',13,21);">1Sa 13:21</a>, but the text here is obscure.<P>The Hebrew (petsirah phim) signifies "bluntness of edge," and is so rendered in the Revised Version, margin.`<a href="./study/isbe/search.html?string=TOOLS">TOOLS</a>`1';
isbe[3429]='Fillet`fil\'-et (chut, chashuq):<P>(1) Chut, from a root not used, meaning probably "to sew," therefore a string or a measuring rod or cord, and so a line, tape, thread, fillet. <a onClick="return mV(\'Jer\',52,21);">Jer 52:21</a> translated "line" (the King James Version "fillet"), measuring 12 cubits long, encircling brass pillars standing 18 cubits high, part of the temple treasure plundered by the Chaldeans; and many other things "that were in the house of Yahweh, did the Chaldeans break in pieces." Translated "thread," used by Rahab, in <a onClick="return mV(\'Jos\',2,18);">Jos 2:18</a>, and "cord," "three fold...is not quickly broken," in <a onClick="return mV(\'Ecc\',4,12);">Ec 4:12</a>.<P>(2) Chashuq, from a root meaning "to join" and therefore something joined or attached, and so a rail or rod between pillars, i.e. a fillet. The hangings of the court of the tabernacle were supported by brass pillars set in brass sockets, "The hooks of the pillars and their fillets shall be of silver" (<a onClick="return mV(\'Exd\',27,10,11);">Ex 27:10-11</a>). The embroidered screen for the door of the Tent was supported by five pillars socketed in brass: "And he overlaid their capitals and their fillets with gold" (<a onClick="return mV(\'Exd\',36,38);">Ex 36:38</a>). The pillars for the court and the gate of the court had fillets of silver (<a onClick="return mV(\'Exd\',38,10);">Ex 38:10</a>). The verb is used in <a onClick="return mV(\'Exd\',27,17);">Ex 27:17</a>; <a onClick="return mV(\'Exd\',38,17);">38:17</a>, "All the pillars of the court were filleted with silver."``142';
isbe[3430]='Filth; Filthiness; Filthy`filth, fil\'-thi-nes, fil\'-thi (tso\'ah, Tum\'ah; rhupoo):<P>The word once translated "filth" in the Old Testament is tso\'ah, "excrement" or "dung," elsewhere translated "dung" (<a onClick="return mV(\'Isa\',4,4);">Isa 4:4</a>, used figuratively of evil doings, sin, "the filth of the daughters of Zion"; compare <a onClick="return mV(\'Pro\',30,12);">Pr 30:12</a>); in the New Testament we have perikatharma "cleansings" "sweepings," offscourings (<a onClick="return mV(\'1Cr\',4,13);">1Co 4:13</a>, "We are made as the filth of the world," the Revised Version, margin "or refuse"); rhupos, "filth," "dirt," Septuagint for tso\'ah in <a onClick="return mV(\'Isa\',4,4);">Isa 4:4</a> (<a onClick="return mV(\'1Pe\',3,21);">1Pe 3:21</a>, "the filth of the flesh").<P>"Filthiness" is the translation of tum\'ah, "uncleanness" (ritual, <a onClick="return mV(\'Lev\',5,3);">Le 5:3</a>; <a onClick="return mV(\'Lev\',7,20);">7:20</a>, etc.), used figuratively of moral impurity, translated "filthiness" (<a onClick="return mV(\'Ezr\',6,21);">Ezr 6:21</a>; <a onClick="return mV(\'Lam\',1,9);">La 1:9</a>; <a onClick="return mV(\'Eze\',22,15);">Eze 22:15</a>; <a onClick="return mV(\'Eze\',24,11,13);">24:11, 13</a>; <a onClick="return mV(\'Eze\',36,25);">36:25</a>); niddah, "impurity" (<a onClick="return mV(\'2Ch\',29,5);">2Ch 29:5</a>); figuratively (<a onClick="return mV(\'Ezr\',9,11);">Ezr 9:11</a>); the Revised Version (British and American) has "uncleanness," but "filthiness" for uncleanness at close of verse (niddah); nechosheth, "brass," figuratively (for "impurity" or "impudence") (<a onClick="return mV(\'Eze\',16,36);">Eze 16:36</a>); aischrotes, primarily "ugliness," tropical for unbecomingness, indecency (only <a onClick="return mV(\'Eph\',5,4);">Eph 5:4</a>, "nor filthiness, nor foolish talking"; Alford has "obscenity," Weymouth, "shameful"); akathartes, "uncleanness" (<a onClick="return mV(\'Rev\',17,4);">Re 17:4</a> the King James Version), corrected text, ta akatharta, "the unclean things," so the Revised Version (British and American).<P>"Filthy" is the translation of \'alach, "to be turbid," to become foul or corrupt in a moral sense (<a onClick="return mV(\'Job\',15,16);">Job 15:16</a> the King James Version; <a onClick="return mV(\'Psa\',14,3);">Ps 14:3</a>; <a onClick="return mV(\'Psa\',53,3);">53:3</a>); \'iddim, plural of \'iddah, from \'adhadh, "to number or compute (monthly courses)"; <a onClick="return mV(\'Isa\',64,6);">Isa 64:6</a>, "All our righteousnesses are as filthy rags," the Revised Version (British and American) "as a polluted garment"; compare <a onClick="return mV(\'Eze\',36,17);">Eze 36:17</a>; aischros, "ugly," tropical for unbecoming, shameful (<a onClick="return mV(\'Tts\',1,11);">Tit 1:11</a>, "for filthy lucre\'s sake"; compare <a onClick="return mV(\'Tts\',1,7);">Tit 1:7</a>); shameful discourse aischrologia (<a onClick="return mV(\'Col\',3,8);">Col 3:8</a> the King James Version); rhupoo, "filthy," in a moral sense polluted (<a onClick="return mV(\'Rev\',22,11);">Re 22:11</a>, "He that is filthy, let him be filthy still," the Revised Version (British and American) "let him be made filthy still" (corrected text), margin "yet more"; Alford, "Let the filthy (morally polluted) pollute himself still" (in the constant middle sense of passive verbs when the act depends on the man\'s self)).<P>In Apocrypha we have (Ecclesiasticus 22:1): "A slothful man is compared to a filthy (ardaloo) stone," the Revised Version (British and American) "a stone that is defiled," <span class="noTag">22:2</span> "A slothful man is compared to the filth (bolbiton) of a dunghill"; <span class="noTag">27:4</a> "So the filth (skubalon) of a man in his talk (the Revised Version (British and American) "of man in his reasoning") remaineth."`<a href="./study/isbe/search.html?string=UNCLEANNESS">UNCLEANNESS</a>`185';
