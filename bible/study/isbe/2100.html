isbe[2125]='Cities of the Plain; Ciccar`sit\'-iz, plan, (kikkar ha-yarden): Included Sodom, Gomorrah, Admah, Zeboiim and Zoar. The locality is first referred to in <a onClick="return mV(\'Gen\',13,10);">Ge 13:10</a>, where it is said that Lot "lifted up his eyes, and beheld all the Plain of the Jordan, that it was well watered every where, before Yahweh destroyed Sodom and Gomorrah, like the garden of Yahweh, like the land of Egypt, as thou goest unto Zoar." The word translated plain is kikkar, "circle." In this ver, and in the 11th, as well as in <a onClick="return mV(\'1Ki\',7,46);">1Ki 7:46</a> and <a onClick="return mV(\'Mat\',3,5);">Mt 3:5</a>, we have the full phrase "circle of the Jordan." Elsewhere (<a onClick="return mV(\'Gen\',13,12);">Ge 13:12</a>; <a onClick="return mV(\'Gen\',19,17,29);">19:17, 29</a>; <a onClick="return mV(\'Deu\',34,3);">De 34:3</a>; <a onClick="return mV(\'2Sa\',18,23);">2Sa 18:23</a>) the word for "circle" is used alone with the article. Until recently the traditional view that this circle of the Jordan was at the south end of the Dead Sea was universally maintained. The arguments in favor of this view are:<P>(1) The name of Sodom is preserved in Jebel Usdum—Usdum having the same consonants with Sodom; moreover, the name is known to have referred to a place in that region as early as the days of Galen (De Simpl. medic. Facult., 4,19) who describes certain "salts of Sodom" from the mountains surrounding the lake which are called Sodom.<P>(2) Zoar seems to have been represented in the Middle Ages by a place which the Crusaders called Segore, and Arabic writers Zoghar. Under the name Zughar or Sughar the place is often referred to by medieval Arabian geographers as situated 1ø south of Jericho "at the end of the Dead Sea" and as a station on the route between the Gulf of Akabah and Jericho, two days\' journey from Jericho. Ptolemy (v.17,5) reckons Zoar as belonging to Arabia Petrea. Eusebius (Onom., 261) describes the Dead Sea as lying between Jericho and Zoar. Josephus (Ant., I, xi, 4) makes the Dead Sea extend 580 stadia "as far as Zoar of Arabia" (Wars, IV, viii, 4). These references would locate Zoar at the base of the mountains just southeast of the Dead Sea, and, as it was within easy reach of Sodom, from which Lot fled, would fix the Cities of the Plain in that locality. Jerome (Comm. on <a onClick="return mV(\'Isa\',15,5);">Isa 15:5</a>) says that Zoar was in the borders of Moab.<P>On the other hand, it is maintained that the "kikkar of the Jordan" lay north of the Dead Sea for the following reasons:<P>(1) That is the region which is visible from the heights of Bethel whence Abraham and Lot looked down upon it (<a onClick="return mV(\'Gen\',13,10);">Ge 13:10</a>), while the south end of the lake is not visible. But it may be answered that the phrase need not be limited to the actual region in sight, but may have included the whole known extension of the valley.<P>(2) Zoar was said to be in range of Moses\' vision from the top of Pisgah (<a onClick="return mV(\'Deu\',34,\'1-3\');">De 34:1-3</a>) whereas the south end of the Dead Sea is invisible from that point, on account of intervening mountains. But this description in Deuteronomy evidently is not intended to be limited to the points which are actually visible, but should be understood as describing the extreme limits of the land some points of which are visible in their near vicinity. Certainly the vision did not comprehend all portions of Dan or Judah "unto the hinder sea." The phrase from Jericho to. Zoar is like "from Dan to Beersheba." The mountain heights overlooking Zoar were certainly visible.<P>(3) In <a onClick="return mV(\'Gen\',14,\'1-\');">Ge 14</a> the four kings coming up from Kadesh attacked the Amorites "that dwelt in Hazezon-tamar" before reaching Sodom, and Hazezon-tamar is to be identified with Engedi. On the other hand, it is possible that it is to be identified with the Tamar of <a onClick="return mV(\'Eze\',47,19);">Eze 47:19</a>; <a onClick="return mV(\'Eze\',48,28);">48:28</a>, and that this place lay southwest of the Dead Sea. Or, if that explanation is not accepted, it is proper to note that the course of this expedition led at first a considerable distance south of the Dead Sea through Mt. Seir to El-paran, when "they smote all the country of the Amalekites, and also the Amorites." In accomplishing this they would naturally be led along the highland to Hebron from which they could easily descend to Engedi, whence they could proceed without difficulty to the south end of the end Sea. Besides, it is by no means certain that there was not an easy passage along the whole western shore of the Dead Sea at that time. See <a href="./study/isbe/search.html?string=DEAD+SEA">DEAD SEA</a>.<P>(4) It is argued that the region at the south end of the Dead Sea could not be described "as the garden of the Lord," etc. Neither, for that matter, could the region around the north end be so described in its present condition. But, on the other hand, the region south of the sea is by no means as devoid of vegetation as is sometimes represented, while there are convincing arguments to prove that formerly it was much more extensive and fertile than now. To the fertility of this area there is no more capable witness than Professor Hull, though he is an ardent advocate of the location of these cities at the north end of the lake. This appears both in his original diary, and in his more mature and condensed account contained in his article on the Dead Sea in Hastings, Dictionary of the Bible (five volumes), where he writes, "When, in December, 1883, the writer found himself standing on the edge of the terrace overlooking the Ghor, he beheld at his feet a wide plain stretching away northward toward the margin of the Dead Sea, and to a large extent green with vegetation and thickets of small trees. To the right in an open space were seen several large Bedouin camps, from which the shouts of wild men, the barking of dogs, and the bellowing of camels ascended. Numerous flocks of black goats and white sheep were being tended by women in long blue cloaks; and on the party of travelers being observed, groups of merry children came tripping up toward the path accompanied by a few of the elders, and, ranging themselves in a line, courteously returned salutations. Here the Arabs remain enjoying the warmth, of the plain till the increasing heat of the summer\'s sun calls them away to their high pasture grounds on the table-land of Edom and Moab. At a short distance farther toward the shore of the lake is the village of Es-Safieh, inhabited by a tribe of fellahin called the Ghawarneh, who by means of irrigation from the Wady el-Hessi cultivate with success fields of wheat, maize, dhurah, indigo and cotton, while they rear herds of camels and flocks of sheep and goats. On the produce of these fields the Arabs largely depend for their supplies of food and raiment, which they obtain by a kind of rude, often compulsory, barter."<P>LITERATURE.<P>Authorities favoring the south end of the Dead Sea: Dillmann, Genesis, 111f; Robinson, BRP2, II, 187:ff; G. A. Smith, Smith, Historical Geography of the Holy Land, 505ff; Baedeker-Socin, Palestine, III, 146; Buhl, Buhl, Geographic des alten Palastina,117,271, 274; see also especially Samuel Wolcott, "Site of Sodom," Bibliotheca Sacra, XXV, 112-51. Favoring the north end: Sir George Grove in various articles in Smith, Dictionary of the Bible; Canon Tristram, Land of Moab, 330ff; Selah Merrill, East of the Jordan, 232-39; W. M. Thomson, The Land and the Book.``198';

isbe[2129]='Citizenship`sit\'-i-zen-ship: All the words in use connected with this subject are derived from polis, "city."<P>1. Philological:<P>These words, with the meanings which they have in the Bible, are the nouns, polites, "citizen"; politeia, "citizenship"; politeuma, "commonwealth"; sumpolites, "fellow-citizen"; and the verb, politeuo, "to behave as a citizen." Each will be considered more fully in its proper place.<P>2. Civil:<P>(1) The word for citizen is sometimes used to indicate little if anything more than the inhabitant of a city or country. "The citizens of that country" (<a onClick="return mV(\'Luk\',15,15);">Lu 15:15</a>); "His citizens hated him" (<a onClick="return mV(\'Luk\',19,14);">Lu 19:14</a>). Also the quotation from the Septuagint, "They shall not teach every man his fellow-citizen" (<a onClick="return mV(\'Hbr\',8,11);">Heb 8:11</a>; compare <a onClick="return mV(\'Jer\',31,34);">Jer 31:34</a>). So also in the Apocrypha (2Macc 4:50; 5:6; 9:19).<P>(2) Roman citizenship.—This is of especial interest to the Bible student because of the apostle Paul\'s relation to it. It was one of his qualifications as the apostle to the Gentiles. Luke shows him in Acts as a Roman citizen, who, though a Jew and Christian receives, for the most part, justice and courtesy from the Roman officials, and more than once successfully claims its privileges. He himself declares that he was a citizen of Tarsus (<a onClick="return mV(\'Act\',21,39);">Ac 21:39</a>). He was not only born in that city but had a citizen\'s rights in it.<P>See <a href="./study/isbe/search.html?string=PAUL">PAUL</a>; <a href="./study/isbe/search.html?string=TARSUS">TARSUS</a>.<P>But this citizenship in Tarsus did not of itself confer upon Paul the higher dignity of Roman citizenship. Had it done so, Claudius Lysias would not have ordered him to be scourged, as he did, after having learned that he was a citizen of Tarsus (<a onClick="return mV(\'Act\',21,39);">Ac 21:39</a>; compare <a onClick="return mV(\'Act\',22,25);">Ac 22:25</a>). So, over and above this Tarsian citizenship, was the Roman one, which availed for him not in one city only, but throughout the Roman world and secured for him everywhere certain great immunities and rights. Precisely what all of these were we are not certain, but we know that, by the Valerian and Porcian laws, exemption from shameful punishments, such as scourging with rods or whips, and especially crucifixion, was secured to every Roman citizen; also the right of appeal to the emperor with certain limitations. This sanctity of person had become almost a part of their religion, so that any violation was esteemed a sacrilege. Cicero\'s oration against Verres indicates the almost fanatical extreme to which this feeling had been carried. Yet Paul had been thrice beaten with rods, and five times received from the Jews forty stripes save one (<a onClick="return mV(\'2Cr\',11,24,25);">2Co 11:24-25</a>). Perhaps it was as at Philippi before he made known his citizenship (<a onClick="return mV(\'Act\',16,22,23);">Ac 16:22-23</a>), or the Jews had the right to whip those who came before their own tribunals. Roman citizenship included also the right of appeal to the emperor in all cases, after sentence had been passed, and no needless impediment must be interposed against a trial. Furthermore, the citizen had the right to be sent to Rome for trial before the emperor himself, when charged with capital offenses (<a onClick="return mV(\'Act\',16,37);">Ac 16:37</a>; <a onClick="return mV(\'Act\',22,\'25-29\');">22:25-29</a>; <a onClick="return mV(\'Act\',25,11);">25:11</a>).<P>How then had Paul, a Jew, acquired this valued dignity? He himself tells us. In contrast to the parvenu citizenship of the chief captain, who seems to have thought that Paul also must have purchased it, though apparently too poor, Paul quietly, says, "But I was free born" (King James Versions; "a Roman born" the Revised Version (British and American), <a onClick="return mV(\'Act\',22,28);">Ac 22:28</a>). Thus either Paul\'s father or some other ancestor had acquired the right and had transmitted it to the son.<P>3. Metaphorical and Spiritual:<P>What more natural than that Paul should sometimes use this civic privilege to illustrate spiritual truths? He does so a number of times. Before the Sanhedrin he says, in the words of our English Versions, "I have lived before God in all good conscience" (<a onClick="return mV(\'Act\',23,1);">Ac 23:1</a>). But this translation does not bring out the sense. Paul uses a noticeable word, politeuo, "to live as a citizen." He adds, "to God" (to Theo). That is to say, he had lived conscientiously as God\'s citizen, as a member of God\'s commonwealth. The day before, by appealing to his Roman citizenship, he had saved himself from ignominious whipping, and now what more natural than that he should declare that he had been true to his citizenship in a higher state? What was this higher commonwealth in which he has enjoyed the rights and performed the duties of a citizen? What but theocracy of his fathers, the ancient church, of which the Sanhedrin was still the ostensible representative, but which was really continued in the kingdom of Christ without the national restrictions of the older one? Thus Paul does not mean to say simply, "I have lived conscientiously before God," but "I have lived as a citizen to God, of the body of which He is the immediate Sovereign." He had lived theocratically as a faithful member of the Jewish church, from which his enemies claimed he was an apostate. Thus Paul\'s conception was a kind of blending of two ideas or feelings, one of which came from the old theocracy, and the other from his Roman citizenship.<P>Later, writing from Rome itself to the Philippians, who were proud of their own citizenship as members of a colonia, a reproduction on a small scale of the parent commonwealth, where he had once successfully maintained his own Roman rights, Paul forcibly brings out the idea that Christians are citizens of a heavenly commonwealth, urging them to live worthy of such honor (<a onClick="return mV(\'Phl\',1,27);">Php 1:27</a> margin).<P>A similar thought is brought out when he says, "For our commonwealth (politeuma) is in heaven" (<a onClick="return mV(\'Phl\',3,20);">Php 3:20</a> margin). The state to which we belong is heaven. Though absent in body from the heavenly commonwealth, as was Paul from Rome when he asserted his rights, believers still enjoy its civic privileges and protections; sojourners upon earth, citizens of heaven. The Old Testament conception, as in <a onClick="return mV(\'Isa\',60,\'1-\');">Isa 60-62</a>, would easily lend itself to this idea, which appears in <a onClick="return mV(\'Hbr\',11,10,16);">Heb 11:10, 16</a>; <a onClick="return mV(\'Hbr\',12,\'22-24\');">12:22-24</a>; <a onClick="return mV(\'Hbr\',13,14);">13:14</a>; <a onClick="return mV(\'Gal\',4,26);">Ga 4:26</a>, and possibly in <a onClick="return mV(\'Rev\',21,\'1-\');">Re 21</a>.`<a href="./study/isbe/search.html?string=ROME">ROME</a>`177';

isbe[2131]='City`sit\'-i (\'ir, qiryah; polis):<p><b>I. THE CANAANITE CITY</b><P class="in15">1. Origin<P class="in15">2. Extent<P class="in15">3. Villages<P class="in15">4. Sites<P class="in15">5. External Appearance<P class="in15">6. General<p><b>II. THE CITY OF THE JEWISH OCCUPATION</b><P class="in15">1. Tower or Stronghold<P class="in15">2. High Place<P class="in15">3. Broad Place<P class="in15">4. Streets<P class="in15">5. General Characteristics<p><b>III. STORE CITIES</b><p><b>IV. LEVITICAL CITIES</b><P><b>LITERATURE</b><hr /><p>I. The Canaanite City.<P>1. Origin:<P>The development of the Canaanite city has been traced by Macalister in his report on the excavation at Gezer (Palestine Exploration Fund Statement,1904,108ff). It originated on the slopes of a bare rocky spur, in which the Neolithic Troglodytes quarried their habitations out of the solid rock, the stones therefrom being used to form a casing to the earthen ramparts, with which the site was afterwards surrounded and which served as a protection against the intrusion of enemies. Later Semitic intruders occupied the site, stone houses were built, and high stone defense walls were substituted for the earthen stone-cased ramparts. These later walls were much higher and stronger than those of the Neilithic occupation and were the walls seen by the Israelites when they viewed the country of their promise.<P>2. Extent:<P>"The people that dwell in the land are strong, and the cities are fortified, and very great" (<a onClick="return mV(\'Num\',13,28);">Nu 13:28</a>) was the report of the spies sent by Moses to spy out the land of Canaan, to see "what cities they are that they dwell in, whether in camps, or in strongholds" (<a onClick="return mV(\'Num\',13,19,20);">Nu 13:19-20</a>). The difficulties of the task set before the advancing Israelites and their appreciation of the strength of the cities, is here recorded, and also in <a onClick="return mV(\'Deu\',1,28);">De 1:28</a>: "The people are greater and taller than we; the cities are great and fortified up to heaven; and moreover we have seen the sons of the Anakim there." This assessment of greatness was based upon comparative ignorance of such fortifications and the want of war experience and the necessary implements of assault. It need not, therefore, be supposed that the cities were "great" except by comparison in the eyes of a tent- dwelling and pastoral people. On the contrary, most recent exploration has proved that they were small (see Pere Vincent, Canaan, 27, note 3, and Pl. I, where comparative measurements of the areas of ancient cities show that, in nine cities compared, Tell Sandahannah (barely 6 acres) is the smallest). Gezer measures approximately 22 1/4 acres and Tell el-Hesy somewhat greater. By way of illustration, it is interesting to note that the Acropolis at Athens, roughly computed, measures 7 1/4 acres, while the Castle Rock at Edinburgh is about 6 acres, or the same as the whole Seleucidan city of Tell Sandahannah. The Acropolis at Tell Zakariya measures about 2 acres or nearly one-fourth of the area of the whole city (about 8 1/2 acres). It is unlikely that Jebus (Jerusalem) itself was an exception, although in Solomonic and later times it extended to a far greater area.<P>3. Villages:<P>Besides the walled cities there were "unwalled (country) towns a great many" (<a onClick="return mV(\'Deu\',3,5);">De 3:5</a>), "villages," unfortified suburbs, lying near to and under the protection of the walled cities and occupied by the surplus population. The almost incredible number of cities and their villages mentioned in the Old Testament, while proving the clannishness of their occupants, proves, at the same time, their comparatively small scale.<P>4. Sites:<P>Traces of similar populations that rise and fall are seen in China and Japan today. As a little poem says of Karakura: " Where were palaces and merchants and the blades of warriors, Now are only the cicadas and waving blades of grass." " Cities that stood on their mounds" (<a onClick="return mV(\'Jos\',11,13);">Jos 11:13</a>; <a onClick="return mV(\'Jer\',30,18);">Jer 30:18</a>) as at Lachish and Taanach are distinguished from those built on natural hills or spurs of hills, such as Jebus, Gezer, Tell es Sail (Gath?), Bethshemesh (see Vincent, Canaan, 26ff). The Arabic name "Tell" is applied to all mounds of ancient cities, whether situated on a natural eminence or on a plain, and the word is common in the geographical nomenclature of Palestine Sites were chosen near a water supply, which was ever the most essential qualification. For purposes of defense, the nearest knoll or spur was selected. Sometimes these knolls were of no great height and their subsequent elevation is accounted for by the gradual accumulation of debris from town refuse and from frequent demolitions; restoration being effected after a levelng up of the ruins of the razed city (see Fig. 2: Tell el-Hesy, Palestine Exploration Fund, which shows a section of the Tell from which the levels of the successive cities in distinct stratification were recovered). Closely packed houses, in narrow alleys, with low, rude mud, brick, or stone and mud walls, with timber and mud roofs, burned readily and were easily razed to the ground (<a onClick="return mV(\'Jos\',8,1);">Jos 8:1</a>ff; <a onClick="return mV(\'Jos\',11,11);">Jos 11:11</a>).<P>It would seem that, viewed from the outside, these cities had the appearance of isolated forts, the surrounding walls being strengthened at frequent intervals, with towers. The gates were approached by narrow roads, which mounted the slopes of the mound at the meeting-point of the meandering paths on the plain below.<P>5. External Appearance:<P>The walls of Tell ej-Judeideh were strengthened by towers in the inside, and presented an unbroken circuit of wall to the outside view (see Fig. 4, PEF). Houses on the wall (<a onClick="return mV(\'Jos\',2,15);">Jos 2:15</a>; <a onClick="return mV(\'2Cr\',11,33);">2Co 11:33</a>) may have been seen from the outside; but it is unlikely that any building within the walls was visible, except possibly the inner tower or stronghold. The whole of the interior of the early Jerusalem (Jebus) was visible from the hills to the east, but this peculiarity of position is uncommon. Strong and high walls, garrisoned by men-at-arms seen only through the battlements, showed no weakness, and the gates, with their narrow and steep approaches and projecting defense towers, looked uninviting traps. The mystery of these unseen interiors could therefore be easily conjured into an exaggeration of strength.<P>6. General:<P>The inhabitants of the villages (banoth, "daughters," <a onClick="return mV(\'Num\',32,42);">Nu 32:42</a> margin) held feudal occupation and gave service to their lord of the city (\'em, "mother," <a onClick="return mV(\'2Sa\',20,19);">2Sa 20:19</a>), in defense of their own or in attacks on their neighbor\'s property. Such were the cities of the truculent, marauding kings of Canaan, whose broken territories lent themselves to the upkeep of a condition, of the weakness of which, the Israelites, in their solid advance, took ready advantage.<p>II. The City of the Jewish Occupation.<P>After the conquest, and the abandonment of the pastoral life for that of agriculture and general trade, the condition of the cities varied but little, except that they were, from time to time, enlarged and strengthened. Solomon\'s work at Jerusalem was a step forward, but there is little evidence that, in the other cities which he is credited with having put his hands to, there was any embellishment. Megiddo and Gezer at least show nothing worthy of the name. Greek influence brought with it the first real improvements in city building; and the later work of Herod raised cities to a grandeur which was previously undreamed of among the Jews. Within the walls, the main points considered in the "layout" were, the Tower or Stronghold, the High Place, the Broad Place by the Gate, and the Market-Place.<P>1. Tower or Stronghold:<P>The Tower or Stronghold was an inner fort which held a garrison and commander, and was provisioned with "victuals, and oil and wine" (<a onClick="return mV(\'2Ch\',11,11);">2Ch 11:11</a>), to which the defenders of the city when hard pressed betook themselves, as a last resource. The men of the tower of Shechem held out against Abimelech (<a onClick="return mV(\'Jdg\',9,49);">Jud 9:49</a>) who was afterward killed by a stone thrown by a woman from the Tower of Thebez "within the city" (<a onClick="return mV(\'Jdg\',9,51,53);">Jud 9:51, 53</a>). David took the stronghold of Zion, "the same is the city of David" (<a onClick="return mV(\'2Sa\',5,7);">2Sa 5:7</a>), which name (Zion) was afterward applied to the whole city. It is not unlikely that the king\'s house was included in the stronghold. Macalister (Palestine Exploration Fund Statement, 1907, 192ff) reports the discovery of a Canaanite castle with enormously thick walls abutting against the inside of the city wall. The strongholds at Taanach and Tell el-Hesy are similarly placed; and the Acropolis at Tell Zakariya lies close to, but independent of, the city wall.<P>2. High Place:<P>The High Place was an important feature in all Canaanite cities and retained its importance long after the conquest (<a onClick="return mV(\'1Sa\',9,12);">1Sa 9:12</a>ff; <a onClick="return mV(\'1Ki\',3,2);">1Ki 3:2</a>; <a onClick="return mV(\'Amo\',7,9);">Am 7:9</a>). It was a sanctuary, where sacrifices were offered and feasts were held, and men did "eat before Yahweh" (<a onClick="return mV(\'Deu\',14,26);">De 14:26</a>). The priests, as was their custom, received their portion of the flesh (<a onClick="return mV(\'1Sa\',2,12);">1Sa 2:12</a>ff). The High Place discovered at Gezer (Bible Sidelights, chapter iii) is at a lower level than the city surrounding it, and lies north and south. It is about 100 ft. in length, and when complete consisted of a row of ten rude undressed standing stones, of which eight are still remaining, the largest being 10 ft. 6 inches high, and the others varying to much smaller sizes.<P>See <a href="./study/isbe/search.html?string=HIGH+PLACE">HIGH PLACE</a>.<P>3. Broad Place:<P>The Broad Place (<a onClick="return mV(\'Neh\',8,1,3,16);">Ne 8:1, 3, 16</a>; <a onClick="return mV(\'Jer\',5,1);">Jer 5:1</a>) seems to have been, usually, immediately inside the city gate. It was not, in early Jewish cities, an extensive open area, but simply a widening of the street, and was designated "broad" by comparison with the neighboring alleys, dignified by the name of street. It took the place of a general exchange. Justice was dispensed (<a onClick="return mV(\'Rth\',4,2);">Ru 4:2</a>) and punishment was administered. Jeremiah was put in "the stocks that were in the upper gate of Benjamin" (<a onClick="return mV(\'Jer\',20,2);">Jer 20:2</a>), proclamations were read, business was transacted, and the news and gossip of the day were exchanged. It was a place for all classes to congregate (<a onClick="return mV(\'Job\',29,7);">Job 29:7</a>; <a onClick="return mV(\'Pro\',31,23);">Pr 31:23</a>), and was also a market-place (<a onClick="return mV(\'2Ki\',7,1);">2Ki 7:1</a>). In later times, the market-place became more typically a market square of the Greek agora plan, with an open area surrounded by covered shelters. The present market-place at Haifa resembles this. Probably it was this type of market-place referred to in <a onClick="return mV(\'Mat\',11,16);">Mt 11:16</a>; <a onClick="return mV(\'Mat\',20,3);">20:3</a> and <a onClick="return mV(\'Luk\',7,32);">Lu 7:32</a>; <a onClick="return mV(\'Luk\',11,43);">11:43</a>. The street inside the Damascus gate of Jerusalem today is, in many ways, similar to the Broad Place, and retains many of its ancient uses. Here, Bedouin and Fellahin meet from the outlying districts to barter, to arbitrate, to find debtors and to learn the news of the day. Lying as it did immediately inside the gate, the Broad Place had a defensive value, in that it admitted of concentration against the forcing of the gate. There does not seem to have been any plan of either a Canaanite or early Jewish city, in which this question of defense did not predominate. Open areas within the city were "waste places" (<a onClick="return mV(\'Isa\',58,12);">Isa 58:12</a>) and were not an integral part of the plan.<P>4. Streets:<P>The streets serving these quarters were not laid out on any fixed plan. They were, in fact, narrow, unpaved alleys, all seeming of equal importance, gathering themselves crookedly to the various centers. Having fixed the positions of the City Gates, the Stronghold and the High Place, the inhabitants appear to have been allowed to situate themselves the best way they could, without restriction of line or frontage. Houses were of modest proportions and were poorly built; planned, most often, in utter disregard of the square, and presenting to the street more or less dead walls, which were either topped by parapets or covered with projecting wood and mud roofs (see <a href="./study/isbe/search.html?string=ARCHITECTURE">ARCHITECTURE</a>, fig. 1; <a href="./study/isbe/search.html?string=HOUSE">HOUSE</a>).<P>The streets, as in the present day in Palestine, were allocated to separate trades: "bakers\' street" (<a onClick="return mV(\'Jer\',37,21);">Jer 37:21</a>), place "of the merchants" (<a onClick="return mV(\'Neh\',3,31,32);">Ne 3:31-32</a> the King James Version), "goldsmiths," etc. The Valley of the Cheesemakers was a street in the Tyropceon Valley at Jerusalem.<P>For a discussion of the subject of "<a href="./study/isbe/search.html?string=CISTERN;+WELL;+POOL;+AQUEDUCT">cisterns</a>", see the separate article under the word<P>5. General Characteristics:<P>The people pursued the industries consequent upon their own self-establishment. Agriculture claimed first place, and was their most highly esteemed occupation. The king\'s lands were farmed by his subjects for his own benefit, and considerable tracts of lands belonged to the aristocracy. The most of the lands, however, belonged to the cities and villages, and were allotted among the free husbandmen. Various cereals were raised, wheat and barley being most commonly cultivated. The soil was tilled and the crops reaped and threshed in much the same manner and with much the same implements as are now used in Syria. Cities lying in main trade routes developed various industries more quickly than those whose positions were out of touch with foreign traffic. Crafts and trades, unknown to the early Jews, were at first monopolized by foreigners who, as a matter of course, were elbowed out as time progressed. Cities on the seaboard of Phoenicia depended chiefly on maritime trade. Money, in the form of ingots and bars of precious metals, "weighed out" (<a onClick="return mV(\'2Ki\',12,11);">2Ki 12:11</a>), was current in preexilic times, and continued in use after foreign coinage had been introduced. The first native coinage dates from the Maccabean period (see Madden, Jewish Coinage, chapter iv). Slavery was freely trafficked in, and a certain number of slaves were attached to the households of the more wealthy. Although they were the absolute property of their masters, they enjoyed certain religious privileges not extended to the "sojourners" or "strangers" who sought the protection of the cities, often in considerable numbers.<P>The king\'s private property, from which he drew full revenue, lay partly within the city, but to a greater extent beyond it (<a onClick="return mV(\'1Sa\',8,15,16);">1Sa 8:15-16</a>). In addition to his private property, he received tithes of fields and flocks, "the tenth part of your seed." He also drew a tax in the shape of certain "king\'s mowings" (<a onClick="return mV(\'Amo\',7,1);">Am 7:1</a>). Vassal kings, paid tribute; Mesha, king of Moab, rendered wool unto the king of Israel (<a onClick="return mV(\'2Ki\',3,4);">2Ki 3:4</a>).<P>See G. A. Smith, Jerusalem, I, chapters v-x, for detailed account of the conditions of Jewish city life. For details of government, see <a href="./study/isbe/search.html?string=ELDER">ELDER</a>; <a href="./study/isbe/search.html?string=JUDGE">JUDGE</a>; <a href="./study/isbe/search.html?string=SANHEDRIN">SANHEDRIN</a>.<p>III. Store Cities.<P>These were selected by Solomon and set aside for stores of victuals, chariots, horsemen, etc. (<a onClick="return mV(\'1Ki\',9,19);">1Ki 9:19</a>). Jehoshaphat "built in Judah castles and cities of store" (<a onClick="return mV(\'2Ch\',17,12);">2Ch 17:12</a>). Twelve officers were appointed by Solomon to provision his household, each officer being responsible for the supply in one month in the year (<a onClick="return mV(\'1Ki\',4,7);">1Ki 4:7</a>). There were also "storehouses in the fields, in the cities, and in the villages" (<a onClick="return mV(\'1Ch\',27,25);">1Ch 27:25</a> the King James Version).<p>IV. Levitical Cities.<P>These were apportioned 13 to the children of Aaron, 10 to Kohath, 13 to Gershon, 12 to Merari, 48 cities in all (<a onClick="return mV(\'Jos\',21,13);">Jos 21:13</a>ff), 6 of which were cities of Refuge (<a onClick="return mV(\'Num\',35,6);">Nu 35:6</a>); see <a href="./study/isbe/search.html?string=REFUGE,+CITIES OF">REFUGE, CITIES OF</a>. For further details see <a href="./study/isbe/search.html?string=ARCHITECTURE">ARCHITECTURE</a>; <a href="./study/isbe/search.html?string=HOUSE">HOUSE</a>.<P>LITERATURE.<P>PEFS; Bliss and Dickie, Excavations at Jerusalem; Macalister, Excavation at Gezer; Bliss and Macalister, Excavations in Palestine; Sellin, Excavation at Taanach; Schumacher, Excavation at Tell Mutesellim; Macalister, Bible Sidelights; G. A. Smith, Jerusalem; Historical Geography of the Holy Land; Bliss, Mounds of Many Cities; Vincent, Canaan.``39';

isbe[2134]='City of Destruction`de-struk\'-shun \'ir ha-herec; (Septuagint Base-dek): In his prediction of the future return of Egypt to Yahweh, Isaiah declares, "In that day there shall be five cities in the land of Egypt that speak the language of Canaan, and swear to Yahweh of hosts; one shall be called \'The city of Destruction\'" (<a onClick="return mV(\'Isa\',19,18);">Isa 19:18</a>). The name \'ir ha-herec, "the city of overthrow," is evidently a play upon \'ir ha-cherec, "city of the sun," a designation of Heliopolis (same meaning; compare the name for this city, Beth-shemesh, <a onClick="return mV(\'Jer\',43,13);">Jer 43:13</a>), in Egyptian, On (<a onClick="return mV(\'Gen\',41,45);">Ge 41:45</a>), which last name Ezekiel, by a similar play on sound, changes into Aven. See <a href="./study/isbe/search.html?string=ON">ON</A>. Some codices, however, as the Revised Version, margin notes, read here \'ir ha-cherec, the actual name of the city.``132';

isbe[2140]='City, Rulers of`rool\'-erz: The English Versions of the Bible rendering of the politarchai, of Thessalonica, before whom Jason and the other Christians were dragged by the mob (<a onClick="return mV(\'Act\',17,6,8);">Ac 17:6, 8</a>). The term distinguishes the magistrates of a free Greek city from the ordinary Roman officials. It primarily denotes "rulers of the citizens," and hence, was used only of magistrates of free cities. The term seems to have been confined largely to Macedonia, although there have been found a few inscriptions elsewhere in which it is used. The use of this term well illustrates the accuracy of the author of the Book of Acts, for while politarchai is not used by classical authors, this form is attested by a number of Macedonian inscriptions. Much work has been done in this field in recent years and the results throw light on the reference in Acts. Of the inscriptions that have been found at least five belong to Thessalonica (see article by Professor Burton, in the American Journal of Theology of 1898, "The Politarchs").<P>"The rulers" of Philippi, before whom Paul and Silas were brought is the English Versions of the Bible rendering of archonies, which is commonly used in the New Testament (<a onClick="return mV(\'Act\',16,19);">Ac 16:19</a>). This is the ordinary term for "rulers" and is not the same as "rulers of the city."``62';
isbe[2141]='Clap`An emphatic expression of joy, "They clapped their hands (nakhah), and said, Long live (the King James Version "God save") the king" (<a onClick="return mV(\'2Ki\',11,12);">2Ki 11:12</a>); "Oh clap your hands (taqa\'), all ye peoples" (<a onClick="return mV(\'Psa\',47,1);">Ps 47:1</a>); or exultation (caphaq, <a onClick="return mV(\'Lam\',2,15);">La 2:15</a>; macha\',<a onClick="return mV(\'Eze\',25,6);">Eze 25:6</a>; taqa\', <a onClick="return mV(\'Nah\',3,19);">Na 3:19</a>); or repudiation (caphaq, <a onClick="return mV(\'Job\',27,23);">Job 27:23</a>; <a onClick="return mV(\'Job\',34,37);">34:37</a>).<P>Figurative: To denote Nature\'s "sympathy" with God\'s people. "Let the floods clap (macha\') their hands" (<a onClick="return mV(\'Psa\',98,8);">Ps 98:8</a>); "All the trees of the field shall clap their hands" (<a onClick="return mV(\'Isa\',55,12);">Isa 55:12</a>; compare <a onClick="return mV(\'Jdg\',5,20);">Jud 5:20</a>).``1';
isbe[2142]='Clasps`klasps (qerec): The word occurs nine times in <a onClick="return mV(\'Exd\',26,\'1-\');">Ex 26</a>; <a onClick="return mV(\'Exd\',36,\'1-\');">36</a>, <a onClick="return mV(\'Exd\',39,\'1-\');">39</a>; which record the specifications for the erection of the tabernacle and their subsequent carrying out. In each of these passages the King James Version renders "taches"—an early English word of French origin now embodied in our "attachment." 50 clasps or taches of gold were ordered to be used in connecting together the two sets of inner tapestry curtains (10 in number) of the tabernacle (<a onClick="return mV(\'Exd\',26,6);">Ex 26:6</a>), and 50 clasps of brass (bronze) were similarly to be used in joining the two sets of goats\' hair curtains (11 in number) which formed the outer covering (<a onClick="return mV(\'Exd\',26,11);">Ex 26:11</a>). See <a href="./study/isbe/search.html?string=TABERNACLE">TABERNACLE</a>. As to the nature of the clasp itself, it seems to have belonged to a double set of loops, opposite to each other, to one of which in each set, required to be of blue cord, a gold or brass button or pin was attached, which, being inserted into the loop opposite, kept the curtain in position (<a onClick="return mV(\'Exd\',26,\'4-6\');">Ex 26:4-6</a>).<P>A difficulty arises from the direction in <a onClick="return mV(\'Exd\',26,33);">Ex 26:33</a> that the veil which divided the "dwelling" into two parts—the holy place and the most holy—was to be suspended "under the clasps." If the clasps are supposed to be midway in the total length of the tabernacle, this would make the two holy places to be of equal size, contrary to the usual assumption that the outer was twice the length of the inner. The term "under" must therefore be used with some latitude, or the ordinary conception of the arrangement of the curtains, or of the size of the holy places will have to be revised (the dimensions are not actually given in the description).``17';
isbe[2143]='Clauda`klo\'-da.`<a href="./study/isbe/search.html?string=CAUDA">CAUDA</a>`1';
isbe[2144]='Claudia`klo\'-di-a (Klaudia): A member of the Christian congregation at Rome, who, with other members of that church, sends her greetings, through Paul, to Timothy (<a onClick="return mV(\'2Ti\',4,21);">2Ti 4:21</a>). More than this concerning her cannot be said with certainty. The Apostolical Constitutions (VII, 21) name her as the mother of Linus, mentioned subsequently by Irenaeus and Eusebius as bishop of Rome. An ingenious theory has been proposed, upon the basis of the mention of Claudia and Pudens as husband and wife in an epigram of Martial, that they are identical with the persons of the same name here mentioned. A passage in the Agricola of Tacitus and an inscription found in Chichester, England, have been used in favor of the further statement that this Claudia was a daughter of a British king, Cogidubnus. See argument by Alford in the Prolegomena to 2 Timothy in his Greek Testament. It is an example of how a very few data may be used to construct a plausible theory. If it be true, the contrast between their two friends, the apostle Paul, on the one hand, and the licentious poet, Martial, on the other, is certainly unusual. If in <a onClick="return mV(\'2Ti\',4,21);">2Ti 4:21</a>, Pudens and Claudia be husband and wife, it is difficult to explain how Linus occurs between them. See argument against this in Lightfoot, The Apostolic Fathers.``84';
isbe[2145]='Claudius`klo\'-di-us (Klaudios): Fourth Roman emperor. He reigned for over 13 years (41-54 AD), having succeeded Caius (Caligula) who had seriously altered the conciliatory policy of his predecessors regarding the Jews and, considering himself a real and corporeal god, had deeply offended the Jews by ordering a statue of himself to be placed in the temple of Jerusalem, as Antiochus Epiphanes had done with the statue of Zeus in the days of the Maccabees (2Macc 6:2). Claudius reverted to the policy of Augustus and Tiberius and marked the opening year of his reign by issuing edicts in favor of the Jews (Ant., XIX, 5), who were permitted in all parts of the empire to observe their laws and customs in a free and peaceable manner, special consideration being given to the Jews of Alexandria who were to enjoy without molestation all their ancient rights and privileges. The Jews of Rome, however, who had become very numerous, were not allowed to hold assemblages there (Dio LX, vi, 6), an enactment in full correspondence with the general policy of Augustus regarding Judaism in the West. The edicts mentioned were largely due to the intimacy of Claudius with Herod Agrippa, grandson of Herod the Great, who had been living in Rome and had been in some measure instrumental in securing the succession for Claudius. As a reward for this service, the Holy Land had a king once more. Judea was added to the tetrarchies of Philip and Antipas; and Herod Agrippa I was made ruler over the wide territory which had been governed by his grandfather. The Jews\' own troubles during the reign of Caligula had given "rest" (the American Standard Revised Version "peace") to the churches "throughout all Judea and Galilee and Samaria" (<a onClick="return mV(\'Act\',9,31);">Ac 9:31</a>). But after the settlement of these troubles, "Herod the king put forth his hands to afflict certain of the church" (<a onClick="return mV(\'Act\',12,1);">Ac 12:1</a>). He slew one apostle and "when he saw that it pleased the Jews, he proceeded to seize" another (<a onClick="return mV(\'Act\',12,3);">Ac 12:3</a>). His miserable death is recorded in <a onClick="return mV(\'Act\',12,\'20-23\');">Ac 12:20-23</a>, and in Ant, XIX, 8. This event which took place in the year 44 AD is held to have been coincident with one of the visits of Paul to Jerusalem. It has proved one of the chronological pivots of the apostolic history.<P>Whatever concessions to the Jews Claudius may have been induced out of friendship for Herod Agrippa to make at the beginning of his reign, Suetonius records (Claud. chapter 25) "Judaeos impulsore Chresto assidue tumultuantes Roma expulit," an event assigned by some to the year 50 AD, though others suppose it to have taken place somewhat later. Among the Jews thus banished from Rome were Aquila and Priscilla with whom Paul became associated at Corinth (<a onClick="return mV(\'Act\',18,2);">Ac 18:2</a>). With the reign of Claudius is also associated the famine which was foretold by Agabus (<a onClick="return mV(\'Act\',11,28);">Ac 11:28</a>). Classical writers also report that the reign of Claudius was, from bad harvest or other causes, a period of general distress and scarcity over the whole world (Dio LX, 11; Suet. Claud. xviii; Tac. Ann. xi. 4; xiii.43; see Mommsen, Provinces of the Roman Empire, chapter ix; and Conybeare and Howson, Life and Epistles of Paul, I).``79';
isbe[2146]='Claudius Lysias`klo\'-di-us lis\'-i-as (Klaudios Lysias): A chief captain who intervened when the Jews sought to do violence to Paul at Jerusalem (<a onClick="return mV(\'Act\',21,31);">Ac 21:31</a>; <a onClick="return mV(\'Act\',24,22);">24:22</a>). Lysias, who was probably a Greek by birth (compare <a onClick="return mV(\'Act\',21,37);">Ac 21:37</a>), and who had probably assumed the Roman forename Claudius (<a onClick="return mV(\'Act\',23,26);">Ac 23:26</a>) when he purchased the citizenship (<a onClick="return mV(\'Act\',22,28);">Ac 22:28</a>), was a military tribune or chiliarch (i.e. leader of 1,000 men) in command of the garrison stationed in the castle overlooking the temple at Jerusalem. Upon learning of the riot instigated by the Asiatic Jews, he hastened down with his soldiers, and succeeded in rescuing Paul from the hands of the mob. As Paul was the apparent malefactor, Lysias bound him with two chains, and demanded to know who he was, and what was the cause of the disturbance. Failing amid the general tumult to get any satisfactory reply, he conducted Paul to the castle, and there questioned him as to whether he was the "Egyptian," an postor that had lately been defeated by Felix (Josephus, BJ, II, xiii, 5; Ant, XX, viii, 6). Upon receiving the answer of Paul that he was a "Jew of Tarsus," he gave him permission to address the people from the stairs which connected the castle and the temple. As the speech of Paul had no pacifying effect, Lysias purposed examining him by scourging; but on learning that his prisoner was a Roman citizen, he desisted from the attempt and released him from his bonds. The meeting of the Sanhedrin which Lysias then summoned also ended in an uproar, and having rescued Paul with difficulty he conducted him back to the castle. The news of the plot against the life of one whom he now knew to be a Roman citizen decided for Lysias that he could not hope to cope alone with so grave a situation. He therefore dispatched Paul under the protection of a bodyguard to Felix at Caesarea, along with a letter explaining the circumstances (<a onClick="return mV(\'Act\',23,\'26-30\');">Ac 23:26-30</a>. The genuineness of this letter has been questioned by some, but without sufficient reason.) In this letter he took care to safeguard his own conduct, and to shield his hastiness in binding Paul. There is evidence (compare <a onClick="return mV(\'Act\',24,22);">Ac 24:22</a>) that Lysias was also summoned to Caesarea at a later date to give his testimony, but no mention is made of his arrival there. It is probable, however, that he was among the chief captains who attended the trial of Paul before King Agrippa and Festus (compare <a onClick="return mV(\'Act\',25,22);">Ac 25:22</a>). For the reference to him in the speech of Tertullus (see <a onClick="return mV(\'Act\',24,7);">Ac 24:7</a> the Revised Version, margin)`<a href="./study/isbe/search.html?string=TERTULLUS">TERTULLUS</a>`88';
isbe[2147]='Claw`klo (parcah, literally, "hoof"): One of the marks of a "clean" animal is stated thus: "Every beast that parteth the hoof, and cleaveth the cleft into two claws, ye shall eat" (<a onClick="return mV(\'Deu\',14,6);">De 14:6</a> the King James Version; the Revised Version (British and American) "hath the hoof cloven in two"). See <a href="./study/isbe/search.html?string=CHEW">CHEW</a>; <a href="./study/isbe/search.html?string=CUD">CUD</a>. the King James Version uses the word "claws" where the Revised Version (British and American) supplies "hoofs" in <a onClick="return mV(\'Zec\',11,16);">Zec 11:16</a>, "and will tear their hoofs in pieces," as the sheep are being overdriven. In the only other passage containing the word (<a onClick="return mV(\'Dan\',4,33);">Da 4:33</a>) there is no Hebrew equivalent in the original—"his nails like birds\' (claws)."``1';
isbe[2148]='Clay`kla (chomer, chacaph, tit, melet, \'abhi, ma\'abheh, abhtit; pelos, "wet clay," "mud"): True clay, which is a highly aluminous soil, is found in certain localities in Palestine, and is used in making pottery. The Hebrew and Greek words, as well as the English "clay," are, however, used loosely for any sticky mud. In making mud bricks, true clay is not always used, but ordinary soil is worked up with water and mixed with straw, molded and left to dry in the sun. Chomer (compare chmar, "slime" or "bitumen") is rendered both "clay" and "mortar." Tit is rendered "clay" or "mire." In <a onClick="return mV(\'Isa\',41,25);">Isa 41:25</a> we have: "He shall come upon rulers as upon mortar (chomer), and as the potter treadeth clay" (tit). In <a onClick="return mV(\'Nah\',3,14);">Na 3:14</a>, "Go into the clay (tit), and tread the mortar (chomer); make strong the brickkiln" (i.e. make the walls ready to withstand a siege). Chacaph is the clay of the image in Nebuchadnezzar\'s dream (<a onClick="return mV(\'Dan\',2,33);">Da 2:33</a>ff). Melet occurs only in <a onClick="return mV(\'Jer\',43,9);">Jer 43:9</a>, where we find: the King James Version, "Take great stones...and hide them in the clay in the brickkiln"; the Revised Version (British and American), "hide them in mortar in the brickwork"; the Revised Version, margin, "lay them with mortar in the pavement." In <a onClick="return mV(\'Hab\',2,6);">Hab 2:6</a>, \'abhtit (found only here) is rendered in the King James Version "thick clay," as if from \'abhi and tit, but the Revised Version (British and American) has "pledges," referring the word to the root \'abhat, "to give a pledge." In <a onClick="return mV(\'1Ki\',7,46);">1Ki 7:46</a>, ma\'abheh ha-\'adhamah (compare <a onClick="return mV(\'2Ch\',4,17);">2Ch 4:17</a>, \'abhi ha-\'adhamah) is the compact or clayey soil in the plain of Jordan between Succoth and Zarethan, in which Hiram cast the vessels of brass for Solomon\'s temple. In <a onClick="return mV(\'Jhn\',9,6,11,14);">Joh 9:6, 11, 14</a>, Thayer gives "made mud of the spittle"; in <a onClick="return mV(\'Rom\',9,21);">Ro 9:21</a>, "wet clay."``37';
isbe[2149]='Clean`klen (Anglo-Saxon cloene, "clear," "pure"): Rendering four Hebrew roots: bar, etc., "purify," "select," "make shining"; zakh, etc., "bright," "clean" "pure"; naqi, "free from," "exempt"; Taher, "clean," "pure," "empty," "bright" (?) the principal root, rendered "clean" 80 times (the King James Version); occurring in all its forms in various renderings about 200 times; also one Greek root, katharos, etc., akin to castus, "chaste," "free from admixture or adhesion of anything that soils, adulterates, corrupts" (Thayer\'s Lexicon). The physical, ritual, ethical, spiritual, figurative uses continually overlap, especially the last four.<P>1. Physical:<P>The physical use is infrequent: "Wash...with snow water, and make my hands never so clean" (zakhakh, <a onClick="return mV(\'Job\',9,30);">Job 9:30</a>; figurative also); "clean provender" (hamits, the Revised Version (British and American) "savory"; the Revised Version, margin "salted"); "Cleanse...inside of the cup and of the platter, that the outside thereof may become clean also" (katharos, <a onClick="return mV(\'Mat\',23,26);">Mt 23:26</a>); "arrayed in fine linen, clean (katharon) and white" (<a onClick="return mV(\'Rev\',19,8);">Re 19:8</a>; the American Standard Revised Version "bright and pure").<P>2. Ceremonial:<P>The principal use was the ceremonial; applied to persons, places or things, "undefiled," "not causing defilement," or "from which defilement has just been removed"; Taher, almost exclusively ceremonial, being the chief Hebrew root. Katharos (New Testament), or derivatives, has this use clearly in <a onClick="return mV(\'Mar\',1,44);">Mr 1:44</a>; <a onClick="return mV(\'Luk\',5,14);">Lu 5:14</a>: "Offer for thy cleansing the things which Moses," etc.; <a onClick="return mV(\'Hbr\',9,13,22,23);">Heb 9:13, 22-23</a>: "the cleanness of the flesh," etc. "Clean" is applied to animals and birds: "of every clean beast" (<a onClick="return mV(\'Gen\',7,2);">Ge 7:2</a>); "of all clean birds" (<a onClick="return mV(\'Deu\',14,11);">De 14:11</a>); (for list of unclean creatures see <a onClick="return mV(\'Lev\',14,\'1-\');">Le 14-20</a>); to places: "Carry forth...unto a clean place" (<a onClick="return mV(\'Lev\',4,12);">Le 4:12</a>); to buildings: "Make atonement for the house; and it shall be clean" (<a onClick="return mV(\'Lev\',14,53);">Le 14:53</a>); to persons: "A clean person shall take hyssop" (<a onClick="return mV(\'Num\',19,18);">Nu 19:18</a>); to clothing: "garment...washed the second time, and shall be clean" (<a onClick="return mV(\'Lev\',13,58);">Le 13:58</a>); and to objects of all sorts, free or freed from defilement.<P>3. Ethical or Spiritual:<P>The ethical or spiritual meaning, either directly or figuratively, is found in the Old Testament chiefly in Job, Psalms, the Prophets, whose interest is ethico-religious, rather than ritual, but the predominant uses are found in the New Testament: "Cleanse yourselves (barar) ye that bear the vessels of Yahweh" (<a onClick="return mV(\'Isa\',52,11);">Isa 52:11</a>); "How can he be clean (zakhah) that is born of a woman?" (<a onClick="return mV(\'Job\',25,4);">Job 25:4</a>) (principally moral, perhaps with allusion to the ceremonial defilement of childbirth); "The fear of Yahweh is clean" (<a onClick="return mV(\'Psa\',19,9);">Ps 19:9</a>), that is, the religion of Yahweh is morally undefiled, in contrast to heathen religions; "He that hath clean (naqi) hands, and a pure heart" (<a onClick="return mV(\'Psa\',24,4);">Ps 24:4</a>); "Purify me with hyssop, and I shall be clean" (Taher, <a onClick="return mV(\'Psa\',51,7);">Ps 51:7</a>); "Therefore said he, Ye are not all clean" (katharos, <a onClick="return mV(\'Jhn\',13,11);">Joh 13:11</a>). Here, as in <a onClick="return mV(\'Psa\',51,7);">Ps 51:7</a> and many others, the ritual furnishes a figure for the spiritual, illustrating the Divine purpose in the ritual, to impress, prefigure and prepare for the spiritual. A somewhat similar figurative moral use is found in <a onClick="return mV(\'Act\',18,6);">Ac 18:6</a>: "Your blood be upon your own heads; I am clean" (katharos, "guiltless," "unstained").<P>See also <a href="./study/isbe/search.html?string=UNCLEANNESS">UNCLEANNESS</a>; <a href="./study/isbe/search.html?string=PURIFICATION">PURIFICATION</a>; <a href="./study/isbe/search.html?string=DEFILEMENT">DEFILEMENT</a>.<P>Clean.—Adverb (in one case adjective): "utterly," "wholly"; usually rendering an intensive use of the Hebrew verb as <a onClick="return mV(\'Joe\',1,7);">Joe 1:7</a>: "He hath made it clean bare" (lit. "stripping he will strip"); <a onClick="return mV(\'Zec\',11,17);">Zec 11:17</a>: "Arm...clean dried up"; <a onClick="return mV(\'Isa\',24,19);">Isa 24:19</a> the King James Version :"Earth is clean dissolved." Twice it renders a principal verb: <a onClick="return mV(\'Jos\',3,17);">Jos 3:17</a>: "Passed clean over the Jordan" (literally, "finished with regard to J."); <a onClick="return mV(\'Lev\',23,22);">Le 23:22</a> King James Version: "Shall not make a clean riddance" (literally, "shall not finish the corners"; the American Standard Revised Version "shalt not wholly reap"). Once it renders a noun: <a onClick="return mV(\'Psa\',77,8);">Ps 77:8</a>: "Is his lovingkindness clean gone for ever?" ("end," he-\'aphec, "has his lovingkindness come to an end?"); and once an adverb "clean (ontos, "actually," "really") escaped" (<a onClick="return mV(\'2Pe\',2,18);">2Pe 2:18</a>); but the American Standard Revised Version, following the reading "oligos," "a little," "scarcely," renders "just escaping."``31';
isbe[2150]='Cleanse`klenz: "Make clean," "purify" being a frequent rendering of the original. It is found often (American Revised Version) instead of "purge," "purify" (the King James Version), renders nearly the same roots, and has the same overlapping phases, as "clean."<P>1. Physical:<P>Physical cleansing, often figuratively used: "Stripes that wound cleanse away (tamriq) evil" (<a onClick="return mV(\'Pro\',20,30);">Pr 20:30</a>); "A hot wind...not to winnow, nor to cleanse" (barar, <a onClick="return mV(\'Jer\',4,11);">Jer 4:11</a>); "Straightway his leprosy was cleansed" (katharizo, <a onClick="return mV(\'Mat\',8,3);">Mt 8:3</a>).<P>2. Ceremonial:<P>In the ceremonial sense:<P>(1) With a very strong religious aspect: to purify from sin by making atonement (chate); e.g. the altar, by the sin offering (<a onClick="return mV(\'Exd\',29,36);">Ex 29:36</a>); the leprous house (<a onClick="return mV(\'Lev\',14,\'48-53\');">Le 14:48-53</a>); the people, by the offering of the Day of Atonement (<a onClick="return mV(\'Lev\',16,30);">Le 16:30</a>); the sanctuary, by the blood of the sin offering (<a onClick="return mV(\'Eze\',45,18);">Eze 45:18</a>ff).<P>(2) To expiate (kaphar, "cover," "hide"); sin (in this case blood-guiltiness): "The land cannot be cleansed of the blood" (the King James Version <a onClick="return mV(\'Num\',35,33);">Nu 35:33</a>; the American Standard Revised Version "no expiation can be made for the land").<P>(3) To remove ceremonial defilement, the principal use, for which the chief root is Taher: "Take the Levites...and cleanse them" (<a onClick="return mV(\'Num\',8,6);">Nu 8:6</a>); "and she shall be cleansed (after childbirth) from the fountain of her blood" (<a onClick="return mV(\'Lev\',12,7);">Le 12:7</a>); "Cleanse it, and hallow it (the altar) from the uncleannesses of the children of Israel" (<a onClick="return mV(\'Lev\',16,19);">Le 16:19</a>), etc. This use is infrequent in the New Testament, except figuratively. Clear instances are <a onClick="return mV(\'Mar\',1,44);">Mr 1:44</a>: "Offer for thy cleansing (katharismos)...for a testimony unto them" (also <a onClick="return mV(\'Luk\',5,14);">Lu 5:14</a>); <a onClick="return mV(\'Hbr\',9,22,23);">Heb 9:22-23</a>: "necessary therefore that the copies of the things in the heavens should be cleansed with these." Physical, ritual, and figurative uses are combined in <a onClick="return mV(\'Mat\',23,25);">Mt 23:25</a>: "Ye cleanse the outside of the cup and of the platter." <a onClick="return mV(\'Act\',10,15);">Ac 10:15</a>: "What God hath cleansed, make not thou common" uses the figure of the ritual to declare the complete abolition of ceremonial defilement and hence, of ceremonial cleansing. For the elaborate system of ceremonial cleansing see especially <a onClick="return mV(\'Lev\',12,\'1-\');">Le 12-17</a>, also articles <a href="./study/isbe/search.html?string=UNCLEANNESS">UNCLEANNESS</a>; <a href="./study/isbe/search.html?string=PURIFICATION">PURIFICATION</a>. Its principal agencies were water, alone, as in minor or indirect defilements, like those produced by contact with the unclean (<a onClick="return mV(\'Lev\',15,\'5-18\');">Le 15:5-18</a>, etc.); or combined with a sin offering and burnt offering, as with a woman after childbirth (<a onClick="return mV(\'Lev\',12,\'6-8\');">Le 12:6-8</a>); fire, as with Gentile booty (<a onClick="return mV(\'Num\',31,23);">Nu 31:23</a>; by water, when it would not endure the fire\); the ashes of a red heifer without spot, mingled with running water, for those defiled by contact with the dead (<a onClick="return mV(\'Num\',19,2);">Nu 19:2</a>ff). For the complex ceremonial in cases of leprosy, combining water, cedar, hyssop, crimson thread, the blood and flight of birds, the trespass offering, sin offering, burnt offering, see <a onClick="return mV(\'Lev\',14,\'1-\');">Le 14</a>. Blood, the vehicle and emblem of life, plays a large part in the major cleansings, in which propitiation for sin, as well as the removal of ceremonial defilement, is prominent, as of the temple, altar, etc.: "According to the law, I may almost say, all things are cleansed with blood" (<a onClick="return mV(\'Hbr\',9,22);">Heb 9:22</a>).<P>3. Ethical and Spiritual:<P>In the ethical and spiritual sense, using the symbolism chiefly of 2. This embodies two phases:<p>(1) the actual removal of sin by the person\'s own activity, "Wherewith shall a young man cleanse (zakhah) his way?" (<a onClick="return mV(\'Psa\',119,9);">Ps 119:9</a>); "Cleanse your hands, ye sinners" (<a onClick="return mV(\'Jam\',4,8);">Jas 4:8</a>); "Let us cleanse ourselves from all defilement" (<a onClick="return mV(\'2Cr\',7,1);">2Co 7:1</a>);<P>(2) God\'s removal of the guilt and power of sin, as, by discipline or punishment: "He cleanseth it" (<a onClick="return mV(\'Jhn\',15,2);">Joh 15:2</a>, the King James Version "purgeth"); "I have cleansed thee" (<a onClick="return mV(\'Eze\',24,13);">Eze 24:13</a>); or in forgiveness, justification, sanctification. In these latter cases the exculpatory idea is sometimes the prominent, although the other is not absent: "I will cleanse (Taher) them from all their iniquity, whereby they have sinned against me; and I will pardon aH their iniquities" (<a onClick="return mV(\'Jer\',33,8);">Jer 33:8</a>); "Wash me thoroughly from mine iniquity, and cleanse (Taher, "declare me clean") me from my sin" (<a onClick="return mV(\'Psa\',51,2);">Ps 51:2</a>). "Cleanse (naqqeh; the American Standard Revised Version "clear") thou me from hidden faults" (<a onClick="return mV(\'Psa\',19,12);">Ps 19:12</a>), while formally to be understood "hold innocent," really connotes forgiveness. In <a onClick="return mV(\'Eph\',5,26);">Eph 5:26</a>, it is hard to determine whether pardon or God-given holiness is predominant: "That he might sanctify it (the church), having cleansed it by the washing of water with the word." In <a onClick="return mV(\'1Jo\',1,7);">1Jo 1:7</a>, the sanctificatory meaning seems almost wholly to absorb the other: "The blood of Jesus his Son cleanseth us ("is purifying, sanctifying") from all sin"; but in <a onClick="return mV(\'1Jo\',1,9);">1Jo 1:9</a> it is again hard to determine the predominance: "He is faithful and righteous to forgive us our sin, and to cleanse us from all unrighteousness." The uncertainty lies in that the second clause may not, as in our speech, add a distinct idea, but may be Hebrew synonymous parallelism. Perhaps it is not wise to seek too curiously to disentangle the two ideas, since they cannot be separated. God never "clears" where he has not begun to "cleanse," and never "cleanses" by the Spirit without "clearing" through the blood.``31';
isbe[2151]='Clear; Clearness`kler, kler\'-nes (bar; diablepo): Equivalent of several Hebrew and Greek words for bright, unclouded, shining without obstruction, distinct, brilliant; "clearer than the noon-day" (<a onClick="return mV(\'Job\',11,17);">Job 11:17</a>): "clear as the sun" (<a onClick="return mV(\'Sgs\',6,10);">So 6:10</a>); "clear shining after rain" (<a onClick="return mV(\'2Sa\',23,4);">2Sa 23:4</a>); "clear heat in sunshine" (<a onClick="return mV(\'Isa\',18,4);">Isa 18:4</a>); "clear as crystal" (<a onClick="return mV(\'Rev\',21,11);">Re 21:11</a>). Adverb, "clearly," for distinctly (<a onClick="return mV(\'Mat\',7,5);">Mt 7:5</a>; <a onClick="return mV(\'Mar\',8,25);">Mr 8:25</a>; <a onClick="return mV(\'Rom\',1,20);">Ro 1:20</a>). Noun, "clearness," for brilliancy, in <a onClick="return mV(\'Exd\',24,10);">Ex 24:10</a>, "as the very heaven for clearness."<P>From this physical, it is applied, in a moral sense, to character, as spotless and free from guilt, or charge, or obligation "from oath" (<a onClick="return mV(\'Gen\',24,8);">Ge 24:8</a>); "from transgression" (<a onClick="return mV(\'Psa\',19,13);">Ps 19:13</a>). Hence, the verb "to clear" means juridically to declare or prove innocent, to vindicate (<a onClick="return mV(\'Gen\',44,16);">Ge 44:16</a>; <a onClick="return mV(\'Exd\',34,7);">Ex 34:7</a>; <a onClick="return mV(\'Num\',14,18);">Nu 14:18</a>; compare hagnos, <a onClick="return mV(\'2Cr\',7,11);">2Co 7:11</a>, the Revised Version (British and American) "pure") "Be clear when thou judgest" (<a onClick="return mV(\'Psa\',51,4);">Ps 51:4</a>) refers to the proof and vindication of the righteousness of God.``84';
isbe[2152]='Cleave`klev: Is used in the Bible in two different senses:<P>(1) baqa\' "to split," or "to rend." We are told that Abraham "clave the wood for the burnt-offering" (<a onClick="return mV(\'Gen\',22,3);">Ge 22:3</a>), and that "they clave the wood of the cart" (<a onClick="return mV(\'1Sa\',6,14);">1Sa 6:14</a>). The Psalmist speaks of Yahweh cleaving fountain and flood (<a onClick="return mV(\'Psa\',74,15);">Ps 74:15</a>), and the plowman cleaving the earth (<a onClick="return mV(\'Psa\',141,7);">Ps 141:7</a>). For other examples see <a onClick="return mV(\'Jdg\',15,19);">Jud 15:19</a>; <a onClick="return mV(\'Ecc\',10,9);">Ec 10:9</a>; <a onClick="return mV(\'Psa\',78,15);">Ps 78:15</a>; <a onClick="return mV(\'Hab\',3,9);">Hab 3:9</a>.<P>(2) dabhaq; kollao, "to adhere to," or "to join one\'s self to." This meaning is the reverse of the preceding. The Psalmist speaks of his tongue cleaving to the roof of his mouth (<a onClick="return mV(\'Psa\',137,6);">Ps 137:6</a>). We are told that a man should cleave unto his wife (<a onClick="return mV(\'Gen\',2,24);">Ge 2:24</a>; <a onClick="return mV(\'Mat\',19,5);">Mt 19:5</a>). It is said that Ruth clave unto her mother-in-law (<a onClick="return mV(\'Rth\',1,14);">Ru 1:14</a>), and that certain men clave unto Paul (<a onClick="return mV(\'Act\',17,34);">Ac 17:34</a>; compare <a onClick="return mV(\'Act\',4,23);">Ac 4:23</a>; <a onClick="return mV(\'Act\',11,23);">11:23</a> margin).<P>"Cleave" is also used in this sense to describe one\'s adherence to principles. Paul admonished the Romans to cleave to that which is good (<a onClick="return mV(\'Rom\',12,9);">Ro 12:9</a>).``62';
isbe[2153]='Cleft; Cliff; Clift`kleft, klif, klift: The first of these words, from cleave, "to split," is a crevice or narrow opening, as "of the ragged rocks" (<a onClick="return mV(\'Isa\',2,21);">Isa 2:21</a>); "under the clefts of the rocks" (<a onClick="return mV(\'Isa\',57,5);">Isa 57:5</a>). "Clift" is an obsolete form of cleft, found in the King James Version <a onClick="return mV(\'Exd\',33,22);">Ex 33:22</a>; <a onClick="return mV(\'Isa\',57,5);">Isa 57:5</a>, but not in the Revised Version (British and American). "Cliff," an abrupt, precipitous, towering rock, is not in the Revised Version (British and American), but is found in the King James Version <a onClick="return mV(\'2Ch\',20,16);">2Ch 20:16</a>, the Revised Version (British and American) "ascent," <a onClick="return mV(\'Job\',30,6);">Job 30:6</a>.``1';
isbe[2154]='Clemency`klem\'-en-si (epietkeia, "fairness," "sweet reasonableness," <a onClick="return mV(\'Act\',24,4);">Ac 24:4</a>): The Greek word is rendered elsewhere "gentleness," <a onClick="return mV(\'2Cr\',10,1);">2Co 10:1</a>; <a onClick="return mV(\'Tts\',3,2);">Tit 3:2</a>, "meekhess"; <a onClick="return mV(\'Jam\',3,17);">Jas 3:17</a>; <a onClick="return mV(\'1Pe\',2,18);">1Pe 2:18</a>.``1';
isbe[2155]='Clement`klem\'-ent (Klemes, "mild"): A fellow-worker with Paul at Philippi, mentioned with especial commendation in <a onClick="return mV(\'Phl\',4,3);">Php 4:3</a>. The name being common, no inference can be drawn from this statement as to any identity with the author of the Epistle to the Corinthians published under this name, who was also the third bishop of Rome. The truth of this supposition ("it cannot be called a tradition," Donaldson, The Apostolical Fathers, 120), although found in Origen, Eusebius, Epiphanius and Jerome, can neither be proved nor disproved. Even Roman Catholic authorities dispute it (article "Clement," Catholic Cyclopaedia, IV, 13). The remoteness between the two in time and place is against it; "a wholly uncritical view" (Cruttwell, Literary History of Early Christianity, 31).``84';
isbe[2156]='Cleopas`kle\'-o-pas (Kleopas, "renowned father"): One of the two disciples whom Jesus met on the way to Emmaus (<a onClick="return mV(\'Luk\',24,18);">Lu 24:18</a>). The name is a contraction of Cleopatros, not identical with Clopas of <a onClick="return mV(\'Jhn\',19,25);">Joh 19:25</a>.`<a href="./study/isbe/search.html?string=ALPHAEUS">ALPHAEUS</a>; <a href="./study/isbe/search.html?string=CLOPAS">CLOPAS</a>`1';
isbe[2157]='Cleopatra`kle-o-pa\'-tra (Kleopatra, "from a famous father"): A daughter of Ptolemy VI (Philometor) and of Queen Cleopatra, who was married first to Alexander Balas 150 BC (1Macc 10:58; Josephus, Ant, XIII, iv, 1) and was afterward taken from him by her father and given to Demetrius Nicator on the invasion of Syria by the latter (1Macc 11:12; Josephus, Ant, XIII, iv, 7). Alexander was killed in battle against the joint forces of Ptolemy and Demetrius while Demetrius was in captivity in Parthia. Cleopatra married his brother Antiochus VII (Sidetes), who in the absence of Demetrius had gained possession of the Syrian throne (137 BC). She was probably privy (Appian, Syriac., 68) to the murder of Demetrius on his return to Syria 125 BC, but Josephus (Ant., XIII, ix, 3) gives a different account of his death. She afterward murdered Seleucus, her eldest son by Nicator, who on his father\'s death had taken possession of the government without her consent. She attempted unsuccessfully to poison her second son by Nicator, Antiochus VIII (Grypus), for whom she had secured the succession, because he was unwilling to concede to her what she considered her due share of power. She was herself poisoned (120 BC) by the draught which she had prepared for their son (Justin 39). She had also a son by Antiochus VII (Sidetes Antiochus Cyzicenus), who took his name from the place in which he was educated. He was killed in battle 95 BC. The name Cleopatra was borne by many Egyptian princesses, the first of whom was daughter of Antiochus III and was married to Ptolemy V (Epiphanes) 193 BC.``79';
