isbe[2161]='Cloak; Cloke`klok, (me\'il, simlah, etc.; himation, stole, etc.): "Cloke" is retained in the English Revised Version, as in the King James Version, instead of modern "cloak" (American Revised Version). In the Old Testament, me\'il (compare New Testament himation) uniformly stands for the ordinary upper garment worn over the coat (kethoneth). In <a onClick="return mV(\'Mat\',5,40);">Mt 5:40</a> both "cloak" and "coat" are mentioned together; compare <a onClick="return mV(\'Luk\',6,29);">Lu 6:29</a>. In size and material the "cloak" differed according to age and sex, class and occupation, but in shape it was like our mantle or shawl. It might be sewed up to have the surplice form of the robe of the Ephod (<a onClick="return mV(\'Exd\',39,23);">Ex 39:23</a>), or be worn loose and open like a Roman toga, the Arabic Abaa, or the Geneva gown. This is the "garment" referred to in <a onClick="return mV(\'Gen\',39,12);">Ge 39:12</a>; <a onClick="return mV(\'Exd\',22,26);">Ex 22:26</a>; <a onClick="return mV(\'Deu\',24,13);">De 24:13</a>; "the robe" that Jonathan "stripped himself of" and gave to David (<a onClick="return mV(\'1Sa\',18,4);">1Sa 18:4</a>); "the robe" of Saul, "the robe" in which it is said the "old man" (Samuel) was "covered" (<a onClick="return mV(\'1Sa\',28,14);">1Sa 28:14</a>); and in the New Testament "the best robe" put on the returning prodigal (<a onClick="return mV(\'Luk\',15,22);">Lu 15:22</a>). Paul\'s "cloak" that he left at Troas (<a onClick="return mV(\'2Ti\',4,13);">2Ti 4:13</a>; phailones, Latin, paenula, Westcott and Hort, The New Testament in Greek phelones), it has been suggested, "may have been a light mantle like a cashmere dust-cloak, in which the books and parchment were wrapped"<P>(HDB, under the word).<P>Figuratively: The word lent itself easily and naturally to figurative uses. We find Paul (<a onClick="return mV(\'1Th\',2,5);">1Th 2:5</a>) disclaiming using "a cloak of covetousness" (compare <a onClick="return mV(\'1Pe\',2,16);">1Pe 2:16</a>) and Jesus (<a onClick="return mV(\'Jhn\',15,22);">Joh 15:22</a>) saying, "Now they have no excuse ("cloak") for their sin." Some such usage seems common to all languages; compare English "palliate."`<a href="./study/isbe/search.html?string=DRESS">DRESS</a>`47';
isbe[2162]='Clod`In <a onClick="return mV(\'Job\',7,5);">Job 7:5</a> (gish, gush, "a mass of earth"), "clods of dust," the crust of his sores, formed by the dry, swollen skin—a symptom of leprosy, though not peculiar to it. In <a onClick="return mV(\'Job\',21,33);">Job 21:33</a>; <a onClick="return mV(\'Job\',38,38);">38:38</a> (reghebh, "a soft clod," "lump of clay"), "The clods of the valley shall be sweet unto him," "The clods cleave fast together." In <a onClick="return mV(\'Joe\',1,17);">Joe 1:17</a> (meghraphah, "a furrow," "something thrown off" (by the spade)), "The seeds rot (m "shrivel") under their clods."<P>Figurative: "Jacob shall break his clods" (<a onClick="return mV(\'Hsa\',10,11);">Ho 10:11</a>), i.e. "must harrow for himself," used figuratively of spiritual discipline (compare <a onClick="return mV(\'Isa\',28,24);">Isa 28:24</a> the King James Version).``91';
isbe[2163]='Clopas; Cleophas`klo\'-pas (Klopas): The former in the Revised Version (British and American), the latter in the King James Version, of <a onClick="return mV(\'Jhn\',19,25);">Joh 19:25</a>, for the name of the husband of one of the women who stood by the cross of Christ. Upon the philological ground of a variety in pronunciation of the Hebrew root, sometimes identified with Alpheus, the father of James the Less. Said by tradition to have been the brother of Joseph, the husband of Mary; see <a href="./study/isbe/search.html?string=BRETHREN+OF+THE+LORD">BRETHREN OF THE LORD</a>. Distinguished from Cleopas, a Greek word, while Clopas is Aramaic``1';
isbe[2164]='Close`kloz, klos verb, adjective and adverb, (kacah, caghar; kammuo): Other words are charah, "to burn"; "Shalt thou reign, because thou closest thyself in cedar?" (<a onClick="return mV(\'Jer\',22,15);">Jer 22:15</a> the King James Version), the Revised Version (British and American) "strivest to excel in cedar," margin "viest with the cedar"; atsam, "to harden"; "Yahweh has closed your eyes" (<a onClick="return mV(\'Isa\',29,10);">Isa 29:10</a>); gadhar, "to hedge" or "wall up" (<a onClick="return mV(\'Amo\',9,11);">Am 9:11</a>); \'atsar, "to restrain" (<a onClick="return mV(\'Gen\',20,18);">Ge 20:18</a>). In <a onClick="return mV(\'Luk\',4,20);">Lu 4:20</a>, ptusso, "to fold up." the Revised Version (British and American) has "was closed," margin "is opened," for "are open" (<a onClick="return mV(\'Num\',24,3,15);">Nu 24:3, 15</a>), "closed" for "narrow" or "covered" (<a onClick="return mV(\'Eze\',40,16);">Eze 40:16</a>; <a onClick="return mV(\'Eze\',41,16,26);">41:16, 26</a>). To "keep close," sigao (<a onClick="return mV(\'Luk\',9,36);">Lu 9:36</a>), the Revised Version (British and American) "held their peace." We have also "kept close" (the Revised Version (British and American) <a onClick="return mV(\'Num\',5,13);">Nu 5:13</a>; Hebrew cathar, "to hide"); also <a onClick="return mV(\'Job\',28,21);">Job 28:21</a>; "kept himself close," the Revised Version, margin "shut up" (<a onClick="return mV(\'1Ch\',12,1);">1Ch 12:1</a>); "close places," micgereth (<a onClick="return mV(\'2Sa\',22,46);">2Sa 22:46</a>; <a onClick="return mV(\'Psa\',18,45);">Ps 18:45</a> = "castles or holds shut in with high walls").``185';
isbe[2165]='Closet`kloz\'-et: Is the rendering in the King James Version of<P>(1) chuppah, and<P>(2) tameion, also tamieion.<P>Chuppah, derived from chaphah, "to cover," was probably originally the name of the tent specially set apart for the bride, and later (<a onClick="return mV(\'Joe\',2,16);">Joe 2:16</a>) used for the bride\'s chamber. The word tameion, originally storeroom (compare <a onClick="return mV(\'Luk\',12,24);">Lu 12:24</a>, the King James Version "storehouse"; the Revised Version (British and American) "storechamber"), but since for safety it was the inner rooms of the Hebrew house which were used for storage purposes, the word came to mean inner room, as in <a onClick="return mV(\'Mat\',6,6);">Mt 6:6</a>; <a onClick="return mV(\'Luk\',12,3);">Lu 12:3</a>, in both the King James Version "closet" (compare <a onClick="return mV(\'Mat\',24,26);">Mt 24:26</a>, the King James Version "secret chamber"). In all cases the Revised Version (British and American) uses "inner chamber."`<a href="./study/isbe/search.html?string=HOUSE">HOUSE</a>`51';
isbe[2166]='Cloth; Clothing`kloth, kloth\'-ing.`<a href="./study/isbe/search.html?string=DRESS">DRESS</a>`1';
isbe[2167]='Clothed Upon`klothd, (ependuo, "to put on over" another garment): Used only in <a onClick="return mV(\'2Cr\',5,2,4);">2Co 5:2, 4</a>. In <a onClick="return mV(\'2Cr\',5,4);">5:4</a> in contrast with unclothed, compare <a onClick="return mV(\'1Cr\',15,53);">1Co 15:53</a>f; in which the idea of putting on, as a garment, is expressed of incorruption and immortality. The meaning here is very subtle and difficult of interpretation. In all probability Paul thinks of a certain envelopment of his physical mortal body even in this life ("in this we groan," i.e. in this present body), hence, the force of the prefixed preposition. The body itself was regarded by the philosophers of his day as a covering of the soul, and hence, it was to be clothed upon and at the same time transformed by the superimposed heavenly body. Ependutes, an outer garment, is used several times in Septuagint for me\'il, an upper garment or robe (compare <a onClick="return mV(\'Jhn\',21,7);">Joh 21:7</a>).``25';
isbe[2168]='Clothes, Rending of`klothz, (keri\'ath beghadhim): This term is used to describe an ordinary tear made in a garment. Samuel\'s skirt was rent when Saul laid hold upon it (<a onClick="return mV(\'1Sa\',15,27);">1Sa 15:27</a>). Jesus spoke about a rent being made in a garment (<a onClick="return mV(\'Mat\',9,16);">Mt 9:16</a>). The term is also used to describe a Hebrew custom which indicated deep sorrow. Upon the death of a relative or important personage, or when there was a great calamity, it was customary for the Hebrews to tear their garments. Reuben rent his clothes when he found that Joseph had been taken from the pit (<a onClick="return mV(\'Gen\',37,29);">Ge 37:29</a>). The sons of Jacob rent their clothes when the cup was found in Benjamin\'s sack (<a onClick="return mV(\'Gen\',44,13);">Ge 44:13</a>). A messenger came to Eli with his clothes rent to tell of the taking of the ark of God and of the death of his two sons (<a onClick="return mV(\'1Sa\',4,12);">1Sa 4:12</a>). David rent his garments when he heard that Absalom had slain his brothers (<a onClick="return mV(\'2Sa\',13,31);">2Sa 13:31</a>). See also <a onClick="return mV(\'2Sa\',15,32);">2Sa 15:32</a>; <a onClick="return mV(\'2Ki\',18,37);">2Ki 18:37</a>; <a onClick="return mV(\'Isa\',36,22);">Isa 36:22</a>; <a onClick="return mV(\'Jer\',41,5);">Jer 41:5</a>. Rending of clothes was also an expression of indignation. The high priest rent his garment when Jesus spoke what he thought was blasphemy (<a onClick="return mV(\'Mat\',26,65);">Mt 26:65</a>).`<a href="./study/isbe/search.html?string=MOURNING">MOURNING</a>`62';
isbe[2169]='Cloud`kloud (\'anan, \'abh; nephele, nephos):<P>I. Clouds in Palestine.<P>In the Bible few references are found of particular clouds or of clouds in connection with the phenomena of the weather conditions. The weather in Palestine is more even and has less variety than that in other lands. It is a long, narrow country with sea on the west and desert on the east. The wind coming from the west is always moist and brings clouds with it. If the temperature over the land is low enough the clouds will be condensed and rain will fall, but if the temperature is high, as in the five months of summer, there can be no rain even though clouds are seen. As a whole the winter is cloudy and the summer clear.<P>1. Rain Clouds:<P>In the autumn rain storms often arise suddenly from the sea, and what seems to be a mere haze, "as small as a man\'s hand," such as Gehazi saw (<a onClick="return mV(\'1Ki\',18,44);">1Ki 18:44</a>) over the sea, within a few hours becomes the black storm cloud pouring down torrents of rain (<a onClick="return mV(\'1Ki\',18,45);">1Ki 18:45</a>). Fog is almost unknown and there is very seldom an overcast, gloomy day. The west and southwest winds bring rain (<a onClick="return mV(\'Luk\',12,54);">Lu 12:54</a>).<P>2. Disagreeable Clouds:<P>In the months of April, May and September a hot east wind sometimes rises from the desert and brings with it a cloud of dust which fills the air and penetrates everything. In the summer afternoons, especially in the month of August, on the seacoast there is apt to blow up from the south a considerable number of low cirro-stratus clouds which seem to fill the air with dampness, making more oppressive the dead heat of summer. These are doubtless the detested "clouds without water" mentioned in <a onClick="return mV(\'Jud\',1,12);">Jude 1:12</a>, and "heat by the shade of a cloud" (<a onClick="return mV(\'Isa\',25,5);">Isa 25:5</a>).<P>II. Figurative Uses.<P>1. Yahweh\'s Presence and Glory:<P>The metaphoric and symbolic uses of clouds are many, and furnish some of the most powerful figures of Scripture. In the Old Testament, Yahweh\'s presence is made manifest and His glory shown forth in a cloud. The cloud is usually spoken of as bright and shining, and it could not be fathomed by man: "Thou hast covered thyself with a cloud, so that no prayer can pass through" (<a onClick="return mV(\'Lam\',3,44);">La 3:44</a>). Yahweh Himself was present in the cloud (<a onClick="return mV(\'Exd\',19,9);">Ex 19:9</a>; <a onClick="return mV(\'Exd\',24,16);">24:16</a>; <a onClick="return mV(\'Exd\',34,5);">34:5</a>) and His glory filled the places where the cloud was (<a onClick="return mV(\'Exd\',16,10);">Ex 16:10</a>; <a onClick="return mV(\'Exd\',40,38);">40:38</a>; <a onClick="return mV(\'Num\',10,34);">Nu 10:34</a>); "The cloud filled the house of Yahweh" (<a onClick="return mV(\'1Ki\',8,10);">1Ki 8:10</a>). In the New Testament we often have "the Son of man coming on" or "with clouds" (<a onClick="return mV(\'Mat\',24,30);">Mt 24:30</a>; <a onClick="return mV(\'Mat\',26,64);">26:64</a>; <a onClick="return mV(\'Mar\',13,26);">Mr 13:26</a>; <a onClick="return mV(\'Mar\',14,62);">14:62</a>; <a onClick="return mV(\'Luk\',21,27);">Lu 21:27</a>) and received up by clouds (<a onClick="return mV(\'Act\',1,9);">Ac 1:9</a>). The glory of the second coming is indicated in <a onClick="return mV(\'Rev\',1,7);">Re 1:7</a> for "he cometh with the clouds" and "we that are alive...shall together with them be caught up in the clouds, to meet the Lord" and dwell with Him (<a onClick="return mV(\'1Th\',4,17);">1Th 4:17</a>).<P>2. Pillar of Cloud:<P>The pillar of cloud was a symbol of God\'s guidance and presence to the children of Israel in their journeys to the promised land. The Lord appeared in a pillar of cloud and forsook them not (<a onClick="return mV(\'Neh\',9,19);">Ne 9:19</a>). They followed the guidance of this cloud (<a onClick="return mV(\'Exd\',40,36);">Ex 40:36</a>; <a onClick="return mV(\'Psa\',78,14);">Ps 78:14</a>).<P>3. Bow in Cloud:<P>The clouds are spoken of in the Old Testament as the symbol of God\'s presence and care over His people; and so the "bow in the cloud" (<a onClick="return mV(\'Gen\',9,13);">Ge 9:13</a>) is a sign of God\'s protection.<P>4. Clouds Blot Out:<P>As the black cloud covers the sky and blots out the sun from sight, so Yahweh promises "to blot out the sins" of Israel (<a onClick="return mV(\'Isa\',44,22);">Isa 44:22</a>); Egypt also shall be conquered, "As for her, a cloud shall cover her" (<a onClick="return mV(\'Eze\',30,18);">Eze 30:18</a>; compare <a onClick="return mV(\'Lam\',2,1);">La 2:1</a>).<P>5. Transitory:<P>There is usually a wide difference in temperature between day and night in Palestine. The days axe warm and clouds coming from the sea are often completely dissolved in the warm atmosphere over the land. As the temperature falls, the moisture again condenses into dew and mist over the hills and valleys. As the sun rises the "morning cloud" (<a onClick="return mV(\'Hsa\',6,4);">Ho 6:4</a>) is quickly dispelled and disappears entirely. Job compares the passing of his prosperity to the passing clouds (<a onClick="return mV(\'Job\',30,15);">Job 30:15</a>).<P>6. God\'s Omnipotence and Man\'s Ignorance:<P>God "bindeth up the waters in his thick clouds" (<a onClick="return mV(\'Job\',26,8);">Job 26:8</a>) and the "clouds are the dust of his feet" (<a onClick="return mV(\'Nah\',1,3);">Na 1:3</a>). Yahweh "commands the clouds that they rain no rain" (<a onClick="return mV(\'Isa\',5,6);">Isa 5:6</a>), but as for man, "who can number the clouds?" (<a onClick="return mV(\'Job\',38,37);">Job 38:37</a>); "Can any understand the spreadings of the clouds?" (<a onClick="return mV(\'Job\',36,29);">Job 36:29</a>); "Dost thou know the balancings of the clouds, the wondrous works of him who is perfect in knowledge?" (<a onClick="return mV(\'Job\',37,16);">Job 37:16</a>). See <a href="./study/isbe/search.html?string=BALANCINGS">BALANCINGS</a>. "He that regardeth the clouds shall not reap" (<a onClick="return mV(\'Ecc\',11,4);">Ec 11:4</a>), for it is God who controls the clouds and man cannot fathom His wisdom. "Thick clouds are a covering to him" (<a onClick="return mV(\'Job\',22,14);">Job 22:14</a>).<P>7. Visions:<P>Clouds are the central figure in many visions. Ezekiel beheld "a stormy wind...out of the north, a great cloud" (<a onClick="return mV(\'Eze\',1,4);">Eze 1:4</a>), and John saw "a white cloud; and on the cloud one sitting" (<a onClick="return mV(\'Rev\',14,14);">Re 14:14</a>). See also <a onClick="return mV(\'Dan\',7,13);">Da 7:13</a>; <a onClick="return mV(\'Rev\',10,1);">Re 10:1</a>; <a onClick="return mV(\'Rev\',11,12);">11:12</a>.<P>8. The Terrible and Unpleasant:<P>The cloud is also the symbol of the terrible and of destruction. The day of Yahweh\'s reckoning is called the "day of clouds" (<a onClick="return mV(\'Eze\',30,3);">Eze 30:3</a>) and a day of "clouds and thick darkness" (<a onClick="return mV(\'Zec\',1,15);">Zec 1:15</a>). The invader is expected to "come up as clouds" (<a onClick="return mV(\'Jer\',4,13);">Jer 4:13</a>). <a onClick="return mV(\'Joe\',2,2);">Joe 2:2</a> foretells the coming of locusts as "a day of clouds and thick darkness" which is both literal and figurative. Misfortune and old age are compared to "the cloudy and dark day" (<a onClick="return mV(\'Eze\',34,12);">Eze 34:12</a>) and "the clouds returning after rain" (<a onClick="return mV(\'Ecc\',12,2);">Ec 12:2</a>).<P>9. Various Other Figures:<P>Clouds are used in connection with various other figures. Rapidity of motion, "these that fly as a cloud" (<a onClick="return mV(\'Isa\',60,8);">Isa 60:8</a>). As swaddling clothes of the newborn earth (<a onClick="return mV(\'Job\',38,9);">Job 38:9</a>); indicating great height (<a onClick="return mV(\'Job\',20,6);">Job 20:6</a>) and figurative in <a onClick="return mV(\'Isa\',14,14);">Isa 14:14</a>, "I will ascend above the heights of the clouds," portraying the self- esteem of Babylon. "A morning without clouds" is the symbol of righteousness and justice (<a onClick="return mV(\'2Sa\',23,4);">2Sa 23:4</a>); partial knowledge and hidden glory (<a onClick="return mV(\'Lev\',16,2);">Le 16:2</a>; <a onClick="return mV(\'Act\',1,9);">Ac 1:9</a>; <a onClick="return mV(\'Rev\',1,7);">Re 1:7</a>).``85';
isbe[2170]='Cloud, Pillar of``<a href="./study/isbe/search.html?string=CLOUD">CLOUD</a>`1';
isbe[2171]='Clout`klout: As substantive (ha-cechabhoth) a patch or piece of cloth, leather, or the like, a rag, a shred, or fragment. Old "cast clouts and old rotten rags" (<a onClick="return mV(\'Jer\',38,11,12);">Jer 38:11-12</a> the King James Version). As verb (Tala\')" to bandage," "patch," or mend with a clout. "Old shoes and clouted (the American Standard Revised Version "patched") upon their feet" (<a onClick="return mV(\'Jos\',9,5);">Jos 9:5</a>); compare Shakespeare, Cym., IV, 2: "I thought he slept, And put my clouted brogues from off my feet"; Milton, Comus: "And the dull swain treads on it daily with his clouted shoon."``1';
isbe[2172]='Cloven`klo\'-v\'-n: In the Old Testament, represented by a participle from shaca, "to split," and applied to beasts that divide the hoof (<a onClick="return mV(\'Lev\',11,3);">Le 11:3</a>; <a onClick="return mV(\'Deu\',14,7);">De 14:7</a>). Beasts with hoofs completely divided into two parts, that were also ruminant, were allowed the Israelites as food; see <a href="./study/isbe/search.html?string=CUD">CUD</a>; <a href="./study/isbe/search.html?string=HOOF">HOOF</a>. In the New Testament, for diamerizomenai, in <a onClick="return mV(\'Act\',2,3);">Ac 2:3</a> the King James Version, the Revised Version (British and American) "tongues parting asunder," i.e. "bifurcated flames." Another explanation found in the Revised Version, margin applies the word, not to tongues, but to the multitude, "parting among them," or "distributing themselves among them," settling upon the head of each disciple.``84';
isbe[2173]='Club`klub.`<a href="./study/isbe/search.html?string=ARMOR">ARMOR</a>; <a href="./study/isbe/search.html?string=SHEPHERD">SHEPHERD</a>; <a href="./study/isbe/search.html?string=STAFF">STAFF</a>`1';
isbe[2174]='Cluster`klus\'-ter:<P>(1) \'eshkol; compare proper name <a href="./study/isbe/search.html?string=ESHCOL">VALE OF ESHCOL</a> (which see), from root meaning "to bind together." A cluster or bunch of grapes (<a onClick="return mV(\'Gen\',40,10);">Ge 40:10</a>; <a onClick="return mV(\'Num\',13,23);">Nu 13:23</a>; <a onClick="return mV(\'Isa\',65,8);">Isa 65:8</a>; <a onClick="return mV(\'Sgs\',7,8);">So 7:8</a>; <a onClick="return mV(\'Mic\',7,1);">Mic 7:1</a>, etc.); a cluster of henna flowers (<a onClick="return mV(\'Sgs\',1,14);">So 1:14</a>); a cluster of dates (<a onClick="return mV(\'Sgs\',7,7);">So 7:7</a>). "Their grapes are grapes of gall, their clusters are bitter." (<a onClick="return mV(\'Deu\',32,32);">De 32:32</a>).<P>(2) botrus, "gather the clusters of the vine of the earth" (<a onClick="return mV(\'Rev\',14,18);">Re 14:18</a>).<P>The "cluster of raisins" (tsimmuqim) of <a onClick="return mV(\'1Sa\',25,18);">1Sa 25:18</a>; <a onClick="return mV(\'1Sa\',30,12);">30:12</a>, should rather be "raisin cakes" or "dried raisins."``117';
isbe[2175]='Cnidus`ni\'-dus, kni\'-dus (Knidos, "age"): A city of Caria in the Roman province of Asia, past which, according to <a onClick="return mV(\'Act\',27,7);">Ac 27:7</a>, Paul sailed. At the southwest corner of Asia Minor there projects for 90 miles into the sea a long, narrow peninsula, practically dividing the Aegean from the Mediterranean. It now bears the name of Cape Crio. Ships sailing along the southern coast of Asia Minor here turn northward as they round the point. Upon the very end of the peninsula, and also upon a small island off its point was the city of Cnidus. The island which in ancient times was connected with the mainland by a causeway is now joined to it by a sandy bar. Thus were formed two harbors, one of which could be closed by a chain. Though Cnidus was in Caria, it held the rank of a free city. There were Jews here as early as the 2nd century BC.<P>The ruins of Cnidus are the only objects of interest on the long peninsula, and as they may be reached by land only with great difficulty, few travelers have visited them; they may, however, be reached more easily by boat. The nearest modern village is Yazi Keui, 6 miles away. The ruins of Cnidus are unusually interesting, for the entire plan of the city may easily be traced. The sea-walls and piers remain. The acropolis was upon the hill in the western portion of the town; upon the terraces below stood the public buildings, among which were two theaters and the odeum still well preserved. The city was especially noted for its shrine of Venus and for the statue of that goddess by Praxiteles. Here in 1875-78 Sir C. Newton discovered the statue of Demeter, now in the British Museum. See also the Aphrodite of Cnidus in the South Kensington Museum, one of the loveliest statues in the world. From here also came the huge Cnidian lion. The vast necropolis west of the ruins contains tombs of every size and shape, and from various ages.``7';
isbe[2176]='Coal`kol (pecham, "charcoal"; compare Arabic fachm, "charcoal"; gacheleth, "burning coal" or "hot ember"; compare Arabic jacham, "to kindle"; shechor, "a black coal" (<a onClick="return mV(\'Lam\',4,8);">La 4:8</a>); compare Arabic shachchar, "soot" or "dark-colored sandstone"; retseph (<a onClick="return mV(\'1Ki\',19,6);">1Ki 19:6</a>), and ritspah (= Rizpah) (<a onClick="return mV(\'Isa\',6,6);">Isa 6:6</a>), margin "a hot stone"; compare resheph, "a flame" (<a onClick="return mV(\'Sgs\',8,6);">So 8:6</a>; <a onClick="return mV(\'Hab\',3,5);">Hab 3:5</a>); anthrax, "a live coal" (<a onClick="return mV(\'Rom\',12,20);">Ro 12:20</a>) (= gacheleth in <a onClick="return mV(\'Pro\',25,22);">Pr 25:22</a>); anthrakia, "a live coal" (<a onClick="return mV(\'Jhn\',18,18);">Joh 18:18</a>; <a onClick="return mV(\'Jhn\',21,9);">21:9</a>): There is no reference to mineral coal in the Bible. Coal, or more properly lignite, of inferior quality, is found in thin beds (not exceeding 3 ft.) in the sandstone formation (see <a href="./study/isbe/search.html?string=GEOLOGY+OF+PALESTINE">GEOLOGY OF PALESTINE</a>, under Nubian Sandstone), but there is no evidence of its use in ancient times. Charcoal is manufactured in a primitive fashion which does not permit the conservation of any by-products. A flat, circular place (Arabic beidar, same name as for a threshing-floor) 10 or 15 ft. in diameter is prepared in or conveniently near to the forest. On this the wood, to be converted into charcoal, is carefully stacked in a dome-shaped structure, leaving an open space in the middle for fine kindlings. All except the center is first covered with leaves, and then with earth. The kindlings in the center are then fired and afterward covered in the same manner as the rest. While it is burning or smoldering it is carefully watched, and earth is immediately placed upon any holes that may be formed in the covering by the burning of the wood below. In several days, more or less, according to the size of the pile, the wood is converted into charcoal and the heap is opened. The charcoal floor is also called in Arabic mashcharah, from shachchar, "soot"; compare Hebrew shechor. The characteristic odor of the mashcharah clings for months to the spot.<P>In <a onClick="return mV(\'Psa\',120,4);">Ps 120:4</a>, there is mention of "coals of juniper," the Revised Version, margin "broom," rothem. This is doubtless the Arabic retem, Retama roetam, Forsk., a kind of broom which is abundant in Judea and Moab. Charcoal from oak wood, especially Quercus coccifera, L., Arabic sindyan, is much preferred to other kinds, and fetches a higher price.<P>In most of the passages where English versions have "coal," the reference is not necessarily to charcoal, but may be to coals of burning wood. Pecham in <a onClick="return mV(\'Pro\',26,21);">Pr 26:21</a>, however, seems to stand for charcoal: " As coals are to hot embers, and wood to fire, So is a contentious man to inflame strife." The same may be true of pecham in <a onClick="return mV(\'Isa\',44,12);">Isa 44:12</a> and <a onClick="return mV(\'Isa\',54,16);">Isa 54:16</a>; also of shechor in <a onClick="return mV(\'Lam\',4,8);">La 4:8</a>.``37';
isbe[2177]='Coast`kost (gebhul, etc., "boundary"; compare gebhal, "mountain" and Arabic jebel, "mountain"; chebhel, literally, "a rope"; compare Arabic chabl (<a onClick="return mV(\'Jos\',19,29);">Jos 19:29</a> the King James Version; <a onClick="return mV(\'Zec\',2,5,6,7);">Zec 2:5-7</a>); choph, literally, "that which is washed"; compare Arabic chaffet (<a onClick="return mV(\'Jos\',9,1);">Jos 9:1</a> the King James Version; <a onClick="return mV(\'Eze\',25,16);">Eze 25:16</a>); paralios, literally, "by the sea" (<a onClick="return mV(\'Luk\',6,17);">Lu 6:17</a>): "Coast" (from Latin costa, "rib" or "side") in the sense of "seacoast," occurs but a few times in the Bible. In nearly all the many passages where the King James Version has "coast," the Revised Version (British and American) correctly has "border," i.e. "boundary," translating gebhul, etc.; in <a onClick="return mV(\'Act\',27,2);">Ac 27:2</a> the American Standard Revised Version, "coast" is the translation of topos, literally, "place." That the seacoast is but seldom mentioned arises naturally from the fact that, while the promised land extended to the sea, the coast was never effectively occupied by the Israelites. RVm in a number of places renders \'i English Versions of the Bible "<a href="./study/isbe/search.html?string=ISLAND;+ISLE">isle</a>" or "<a href="./study/isbe/search.html?string=ISLAND;+ISLE">island</a>" (which see), by "<a href="./study/isbe/search.html?string=COAST">coastland</a>," e.g. <a onClick="return mV(\'Isa\',11,11);">Isa 11:11</a>; <a onClick="return mV(\'Isa\',23,6);">23:6</a>; <a onClick="return mV(\'Isa\',24,15);">24:15</a>; <a onClick="return mV(\'Isa\',59,18);">59:18</a>; <a onClick="return mV(\'Jer\',25,22);">Jer 25:22</a>; <a onClick="return mV(\'Eze\',39,6);">Eze 39:6</a>; <a onClick="return mV(\'Dan\',11,18);">Da 11:18</a>; <a onClick="return mV(\'Zep\',2,11);">Ze 2:11</a>. In <a onClick="return mV(\'Isa\',20,6);">Isa 20:6</a>, the King James Version has "isle," the King James Version margin "country," and the Revised Version (British and American) "coast-land." In <a onClick="return mV(\'Jer\',47,4);">Jer 47:4</a>, the King James Version has "country," the King James Version marginand the Revised Version (British and American) "isle," and the Revised Version, margin "sea-coast."`<a href="./study/isbe/search.html?string=ISLE">ISLE</a>`37';
isbe[2178]='Coat`kot.`<a href="./study/isbe/search.html?string=CLOAK">CLOAK</a>; <a href="./study/isbe/search.html?string=DRESS">DRESS</a>`1';
isbe[2179]='Coat of Mail`mal.`<a href="./study/isbe/search.html?string=ARMOR;+ARMS">ARMOR; ARMS</a>; <a href="./study/isbe/search.html?string=BRIGANDINE">BRIGANDINE</a>`1';
isbe[2180]='Cock`kok (alektor; Latin gallus): There is no reference in the Old Testament to domesticated poultry, which was probably first introduced into Judea after the Roman conquest. See <a href="./study/isbe/search.html?string=CHICKEN">CHICKEN</a>. The cock is several times mentioned in the New Testament and always with reference to its habit of crowing in eastern countries with such regularity as to be almost clocklike. The first full salute comes almost to the minute at half-past eleven, the second at half-past one, and the third at dawn. So uniformly do the cocks keep time and proclaim these three periods of night that we find cock-crowing mentioned as a regular division of time: "Watch therefore: for ye know not when the lord of the house cometh, whether at even, or at midnight, or at cockcrowing, or in the morning" (<a onClick="return mV(\'Mar\',13,35);">Mr 13:35</a>). Jesus had these same periods of night in mind when he warned Peter that he would betray Him. <a onClick="return mV(\'Mat\',26,34);">Mt 26:34</a>; <a onClick="return mV(\'Luk\',22,34);">Lu 22:34</a>; <a onClick="return mV(\'Jhn\',13,38);">Joh 13:38</a>, give almost identical wording of the warning. But in all his writing Mark was more explicit, more given to exact detail. Remembering the divisions of night as the cocks kept them, his record reads: "And Jesus saith unto him, Verily I say into thee, that thou today, even this night, before the cock crow twice, shalt deny me thrice" (<a onClick="return mV(\'Mar\',14,30);">Mr 14:30</a>). See <a href="./study/isbe/search.html?string=CHICKEN">CHICKEN</a>. It is hardly necessary to add that the cocks crow at irregular intervals as well as at the times indicated, according to the time of the year and the phase of the moon (being more liable to crow during the night if the moon is at the full), or if a storm threatens, or there is any disturbance in their neighborhood.``167';
isbe[2181]='Cock-Crowing`kok\'-kro-ing (alektorophonia): An indefinite hour of the night between midnight and morning (<a onClick="return mV(\'Mar\',13,35);">Mr 13:35</a>), referred to by all the evangelists in their account of Peter\'s denial (<a onClick="return mV(\'Mat\',26,34,74);">Mt 26:34, 74</a>; <a onClick="return mV(\'Mar\',14,30);">Mr 14:30</a>; <a onClick="return mV(\'Luk\',22,34);">Lu 22:34</a>; <a onClick="return mV(\'Jhn\',13,38);">Joh 13:38</a>). It is derived from the habit of the cock to crow especially toward morning.`<a href="./study/isbe/search.html?string=COCK">COCK</a>`1';
isbe[2182]='Cockatrice`kok\'-a-tris, kok\'-a-tris (tsepha\'; tsph\'oni; Septuagint, basiliskos, "<a href="./study/isbe/search.html?string=BASILISK">basilisk</A>" (which see), and aspis, "asp" (see <a href="./study/isbe/search.html?string=ADDER">ADDER</a>; <a href="./study/isbe/search.html?string=ASP">ASP</a>; <a href="./study/isbe/search.html?string=SERPENT">SERPENT</a>)): A fabulous, deadly, monster. The name "cockatrice" appears to be a corruption of Latin calcatrix, from calcare, "to tread," calcatrix being in turn a translation of the Greek ichneumon, from ichnos, "track" or "footstep." Herpestes ichneumon, the ichneumon, Pharaoh\'s rat, or mongoose, a weasel-like animal, is a native of Northern Africa and Southern Spain. There are also other species, including the Indian mongoose. It preys on rats and snakes, and does not despise poultry and eggs.<P>Pliny (see Oxford Dictionary, under the word "Cockatrice") relates that the ichneumon darts down the open mouth of the crocodile, and destroys it by gnawing through its belly. In the course of time, as the story underwent changes, the animal was metamorphosed into a water snake, and was confused with the crocodile itself, and also with the basilisk. According to the Encyclopedia Britannica, 11th edition, the cockatrice was believed as late as the 17th century to be produced from a cock\'s egg and hatched by a serpent, and "to possess the most deadly powers, plants withering at its touch, and men and animals being poisoned by its look. It stood in awe however of the cock, the sound of whose crowing killed it....The weasel alone among animals was unaffected by the glance of its evil eye, and attacked it at all times successfully; for when wounded by the monster\'s teeth it found a ready remedy in rue, the only plant which the cockatrice could not wither." The real ichneumon does kill the most deadly snakes, and has been supposed to resort to a vegetable antidote when bitten. It actually dies however when bitten by a deadly snake, and does not possess a knowledge of herbs, but its extraordinary agility enables it ordinarily to escape injury. It is interesting to see how the changing tale of this creature with its marvelous powers has made a hodge-podge of ichneumon, weasel, crocodile, and serpent.<P>The Biblical references (the King James Version <a onClick="return mV(\'Isa\',11,8);">Isa 11:8</a>; <a onClick="return mV(\'Isa\',59,5);">59:5</a>; <a onClick="return mV(\'Jer\',8,17);">Jer 8:17</a>) are doubtless to a serpent, the word "cockatrice," with its medieval implications, having been introduced by the translators of the King James Version.`<a href="./study/isbe/search.html?string=SERPENT">SERPENT</a>`37';
isbe[2183]='Cocker`kok\'-er (titheneo, "to nurse," "coddle," "pamper"): Occurs only in Ecclesiasticus 30:9 with the meaning "to pamper": "Cocker thy child, and he shall make thee afraid"; so Shakespeare, "a cockered silken wanton"; now seldom used; Jean Ingelow, "Poor folks cannot afford to cocker themselves."``1';
isbe[2184]='Cockle`kok\'-\'-l (King James Version margin "stinking weeds," the Revised Version, margin "noisome weeds"; bo\'shah, from Hebrew root ba\'ash, "to stink"; batos): "Let thistles grow instead of wheat, and cockle instead of barley" (<a onClick="return mV(\'Job\',31,40);">Job 31:40</a>). On account of the meaning of the Hebrew root we should expect that the reference was rather to repulsive, offensive weeds than to the pretty corn cockle. It is very possible that no particular plant is here intended, though the common Palestinian "stinking" arums have been suggested by Hooker.``1';
isbe[2185]='Code of Hammurabi``<a href="./study/isbe/search.html?string=HAMMURABI,+CODE+OF">HAMMURABI, CODE OF</a>`1';
isbe[2186]='Coele-Syria`se-le-sir\'-i-a (the King James Version Celosyria; Koile Suria, "hollow Syria"): So the Greeks after the time of Alexander the Great named the valley lying between the two mountain ranges, Lebanon and Anti-Lebanon. It is referred to in the Old Testament as Biq\'ath ha-Lebhanon, "the valley of Lebanon" (<a onClick="return mV(\'Jos\',11,17);">Jos 11:17</a>), a name the echo of which is still heard in el-Buqa\', the designation applied today to the southern part of the valley. This hollow, which extends about 100 miles in length, is the continuation northward of the Jordan valley. The main physical features are described under <a href="./study/isbe/search.html?string=LEBANON">LEBANON</a> (which see). The name, however, did not always indicate the same tract of territory. In Strabo (xvi.2) and Ptolemy (v.15), it covers the fertile land between Jebel esh-Sharqy and the desert presided over by Damascus. In 1Esdras 2:17; 2Macc 3:8, etc., it indicates the country south and east of Mt. Lebanon, and along with Phoenicia it contributed the whole of the Seleucid dominions which lay south of the river Eleutherus. Josephus includes in Coele-Syria the country east of the Jordan, along with Scythopolis (Beisan) which lay on the west, separated by the river from the other members of the Decapolis (Ant., XIII, xiii,2,etc.). In XIV, iv,5,he says that "Pompey committed Coele-Syria as far as the river Euphrates and Egypt to Scaurus." The term is therefore one of some elasticity.``54';
isbe[2187]='Coffer`kof\'-er (\'argaz): A small box such as that in which the Philistines placed their golden mice and other offerings in returning the Ark (<a onClick="return mV(\'1Sa\',6,8,11,15);">1Sa 6:8, 11, 15</a>).``1';
isbe[2188]='Coffin`kof\'-in.`<a href="./study/isbe/search.html?string=CHEST">CHEST</a>; <a href="./study/isbe/search.html?string=BURIAL">BURIAL</a>`1';
isbe[2189]='Cogitation`koj-i-ta\'-shun, ra\'yon, "the act of thinking or reflecting," as in <a onClick="return mV(\'Dan\',7,28);">Da 7:28</a>, "my cogitations much troubled me" (the Revised Version (British and American) "my thoughts").``1';
isbe[2190]='Cohort`ko\'-hort: In the Revised Version, margin of <a onClick="return mV(\'Mat\',27,27);">Mt 27:27</a>; <a onClick="return mV(\'Mar\',15,16);">Mr 15:16</a>; <a onClick="return mV(\'Jhn\',18,3,12);">Joh 18:3, 12</a>; <a onClick="return mV(\'Act\',10,1);">Ac 10:1</a>; <a onClick="return mV(\'Act\',21,31);">21:31</a>; <a onClick="return mV(\'Act\',27,1);">27:1</a>, the translation of speira (the King James Version and the Revised Version (British and American), "band"); the tenth part of a legion; ordinarily about 600 men. In <a onClick="return mV(\'Jhn\',18,\'1-\');">Joh 18</a> the word seems to be used loosely of a smaller body of soldiers, a detachment, detail.`<a href="./study/isbe/search.html?string=ARMY">ARMY</a>; <a href="./study/isbe/search.html?string=BAND">BAND</a>`1';
isbe[2191]='Coins`koinz: There were no coins in use in Palestine until after the Captivity. It is not quite certain whether gold and silver were before that time divided into pieces of a certain weight for use as money or not, but there can be no question of coinage proper until the Persian period. Darius I is credited with introducing a coinage system into his empire, and his were the first coins that came into use among the Jews, though it seems probable that coins were struck in Lydia in the time of Croesus, the contemporary of Cyrus the Great, and these coins were doubtless the model upon which Darius based his system, and they may have circulated to some extent in Babylonia before the return of the Jews. The only coins mentioned in the Old Testament are the Darics (see <a href="./study/isbe/search.html?string=DARIC">DARIC</A>), and these only in the Revised Version (British and American), the word "dram" being used in the King James Version (<a onClick="return mV(\'Ezr\',2,69);">Ezr 2:69</a>; <a onClick="return mV(\'Ezr\',8,27);">8:27</a>; <a onClick="return mV(\'Neh\',7,\'70-72\');">Ne 7:70-72</a>). The Jews had no native coins until the time of the Maccabees, who struck coins after gaining their independence about 143-141 BC. These kings struck silver and copper, or the latter, at least (see <a href="./study/isbe/search.html?string=MONEY">MONEY</a>), in denominations of shekels and fractions of the shekel, until the dynasty was overthrown by the Romans. Other coins were certainly in circulation during the same period, especially those of Alexander and his successors the Ptolemies of Egypt and the Seleucids of Syria, both of whom bore sway over Palestine before the rise of the Maccabees. Besides these coins there were the issues of some of the Phoenician towns, which were allowed to strike coins by the Persians and the Seleucids. The coins of Tyre and Sidon, both silver and copper, must have circulated largely in Palestine on account of the intimate commercial relations between the Jews and Phoenicians (for examples, see under <a href="./study/isbe/search.html?string=MONEY">MONEY</a>). After the advent of the Romans the local coinage was restricted chiefly to the series of copper coins, such as the mites mentioned in the New Testament, the silver denarii being struck mostly at Rome, but circulating wherever the Romans went. The coins of the Herods and the Procurators are abundant, but all of copper, since the Romans did not allow the Jewish rulers to strike either silver or gold coins. At the time of the first revolt (66-70 AD) the Jewish leader, Simon, struck shekels again, or, as some numismatists think, he was the first to do so. But this series was a brief one, lasting between 3 and 4 years only, as Jerusalem was taken by Titus in 70 AD, and this put an end to the existence of the Jewish state. There was another short period of Jewish coinage during the second revolt, in the reign of Hadrian, when Simon Barcochba struck coins with Hebrew legends which indicate his independence of Roman rule. They were of both silver and copper, and constitute the last series of strictly Jewish coins (see <a href="./study/isbe/search.html?string=MONEY">MONEY</a>). After this the coins struck in Judea were Roman, as Jerusalem was made a Roman colony.``138';
isbe[2192]='Col-Hozeh`kol-ho\'-ze (kol-chozeh, "all seeing"; Septuagint omits): A man whose son Shallum rebuilt the fountain gate of Jerusalem in the days of Nehemiah (<a onClick="return mV(\'Neh\',3,15);">Ne 3:15</a>). The Col-hozeh of <a onClick="return mV(\'Neh\',11,5);">Ne 11:5</a> is probably another man.``1';
isbe[2193]='Cola`ko\'-la.`<a href="./study/isbe/search.html?string=CHOLA">CHOLA</a>`1';
isbe[2194]='Cold`kold (qor; psuchros (adj.), psuchos (noun)): Palestine is essentially a land of sunshine and warmth.<P>1. Temperature in Palestine:<P>The extreme cold of northern latitudes is unknown. January is the coldest month; but the degree of cold in a particular place depends largely on the altitude above the sea. On the seacoast and plain the snow never falls; and the temperature reaches freezing-point, perhaps once in thirty years. In Jerusalem at 2,500 ft. above the sea the mean temperature in January is about 45 degrees F., but the minimum may be as low as 25 degrees F. Snow occasionally falls, but lasts only a short time. On Mt. Hermon and on the Lebanons snow may be found the whole year, and the cold is most intense, even in the summer. In Jericho and around the Dead Sea, 1,292 ft. below sea-level, it is correspondingly hotter, and cold is not known.<P>2. Provision against Cold:<P>Cold is of such short duration that no adequate provision is made by the people to protect themselves against the cold. The sun is always bright and warm, and nearly always shines for part of the day, even in winter. After sunset the people wrap themselves up and go to sleep. They prefer to wrap up their heads rather than their feet in order to keep warm. The only means of heating the houses is the charcoal brazier around which as many as possible gather for a little warmth. It is merely a bed of coals in an iron vessel. Peter was glad to avail himself of the little heat of the coals as late as the beginning of April, when the nights are often chilly in Jerusalem: "Having made a fire of coals; for it was cold:...and Peter also was with them, standing and warming himself" (<a onClick="return mV(\'Jhn\',18,18);">Joh 18:18</a>). There is no attempt made to heat the whole house. In the cold winter months the people of the mountains almost hibernate. They wrap up their heads in shawls and coverings and only the most energetic venture out: "The sluggard will not plow by reason of the winter" (<a onClick="return mV(\'Pro\',20,4);">Pr 20:4</a>, the King James Version "cold"). The peasants and more primitive people of the desert often make a fire in the open or in partial shelter, as in Melita where Paul was cast ashore after shipwreck: "The barbarians...kindled a fire...because of the cold" (<a onClick="return mV(\'Act\',28,2);">Ac 28:2</a>).<P>3. Dread of Cold:<P>The cold is greatly dreaded because it causes so much actual suffering: "Who can stand before his cold?" (<a onClick="return mV(\'Psa\',147,17);">Ps 147:17</a>). The last degree of degradation is to have "no covering in the cold" (<a onClick="return mV(\'Job\',24,7);">Job 24:7</a>).<P>4. Cold Grateful in Summer:<P>In the heat of the long summer, the shadow of a rock or the cool of evening is most grateful, and the appreciation of a cup of cold water can easily be understood by anyone who has experienced the burning heat of the Syrian sun: "As cold waters to a thirsty soul, so is good news from a far country" (<a onClick="return mV(\'Pro\',25,25);">Pr 25:25</a>); "cold of snow in the time of harvest" (<a onClick="return mV(\'Pro\',25,13);">Pr 25:13</a>), probably with reference to the use of snow (shaved ice) in the east to cool a beverage.<P>Figurative uses: "The love of the many shall wax cold" (<a onClick="return mV(\'Mat\',24,12);">Mt 24:12</a>); "I know thy works, that thou art neither cold nor hot" (<a onClick="return mV(\'Rev\',3,15);">Re 3:15</a>).``85';
isbe[2195]='Colius`ko\'-li-us (Kolios, 1Esdras 9:23).`<a href="./study/isbe/search.html?string=CALITAS">CALITAS</a>`1';
isbe[2196]='Collar`kol\'-ar, kol\'-er:<P>(1) (netphah, plural netphoth, literally, "drops," from nataph, "to drop"). <a onClick="return mV(\'Jdg\',8,26);">Jud 8:26</a> includes netphoth among the spoils taken from the Midianites and Ishmaelites; the Revised Version (British and American) "pendants," the King James Version "collars." Qimchi at the place suggests "perfume-dropper."<P>(2) (peh, literally, "mouth"). In <a onClick="return mV(\'Job\',30,18);">Job 30:18</a> the word is used to indicate the collar band, or hole of a robe, through which the head was inserted. Job, in describing his suffering and writhing, mentions the disfiguring of his garment, and suggests that the whole thing feels as narrow or close-fitting as the neckband, or perhaps that in his fever and pains he feels as if the neckband itself is choking him.<P>(3) (tsinoq, <a onClick="return mV(\'Jer\',29,26);">Jer 29:26</a>, "stocks"; the Revised Version (British and American) "shackles," which see; the Revised Version, margin "collar"). An instrument of torture or punishment.``81';
isbe[2197]='Collection`ko-lek\'-shun:<P>(1) In the Old Testament (mas\'eth, "something taken up"), used in <a onClick="return mV(\'2Ch\',24,6,9);">2Ch 24:6, 9</a> the King James Version with reference to the tax prescribed in <a onClick="return mV(\'Exd\',30,12,16);">Exo 30:12,16</a>; the Revised Version (British and American) "tax."<P>(2) In the New Testament "collection" is the translation given to logia, found only twice (classical, sulloge). It is used with reference to the collection which Paul took up in the Gentile churches for the poor Christians in Jerusalem, as, for some reason, perhaps more severe persecutions, that church was especially needy (<a onClick="return mV(\'1Cr\',16,1,2);">1Co 16:1-2</a>; verse <a onClick="return mV(\'1Cr\',16,1,2);">2</a> the King James Version "gatherings"). Other words, such as bounty, contribution, blessing, alms, ministration, are used to indicate this same ministry. Paul seems to have ascribed to it great importance. Therefore, he planned it carefully long in advance; urged systematic, weekly savings for it; had delegates carefully chosen to take it to Jerusalem; and, in spite of dangers, determined himself to accompany them. Evidently he thought it the crowning act of his work in the provinces of Galatia, Asia, Macedonia and Achaia, for as soon as it was finished he purposed to go to Rome and the West (<a onClick="return mV(\'Act\',24,17);">Ac 24:17</a>; <a onClick="return mV(\'Rom\',15,25,26);">Ro 15:25-26</a>; <a onClick="return mV(\'2Cr\',8,\'1-\');">2Co 8</a>; <a onClick="return mV(\'2Cr\',9,\'1-\');">9</a>).`<a href="./study/isbe/search.html?string=COMMUNION">COMMUNION</a>`177';
isbe[2198]='College`kol\'-ej: This is the rendering of the King James Version for Hebrew Mishneh (mishneh, <a onClick="return mV(\'2Ki\',22,14);">2Ki 22:14</a> = <a onClick="return mV(\'2Ch\',34,22);">2Ch 34:22</a>; compare <a onClick="return mV(\'Zep\',1,10);">Ze 1:10</a>). It is found in the Targum of Jonathan on <a onClick="return mV(\'2Ki\',22,14);">2Ki 22:14</a> and rests on a faulty combination with Mishna, the well-known code of laws of the 2nd century AD. the Revised Version (British and American) renders "second quarter" (of the city); <a onClick="return mV(\'2Ch\',34,22);">2Ch 34:22</a> the King James Version margin, "the school."``1';
isbe[2199]='Collop`kol\'-up (pimah): A slice of meat or "fat," the King James Version in <a onClick="return mV(\'Job\',15,27);">Job 15:27</a>, "maketh collops of fat (thick folds of flesh) on his flanks," said of the "wicked man." the American Standard Revised Version reads "(hath) gathered fat upon his loins."``1';
isbe[2200]='Colony`kol\'-o-ni (kolonia, Greek transliteration of Latin colonia, from the root, col, "cultivate"): The word occurs but once (<a onClick="return mV(\'Act\',16,12);">Ac 16:12</a>) in reference to Philippi in Macedonia. Roman colonies were of three kinds and of three periods:<P>(1) Those of the early republic, in which the colonists, established in conquered towns to serve the state as guardians of the frontier, were exempt from ordinary military service. They were distinguished as<P>(a) c. civium Romanorum, wherein the colonists retained Roman citizenship, also called c. maritumae, because situated on the coast, and<P>(b) c. Latinae, situated inland among the allies (socii), wherein the colonists possessed the ius Latinum, entitling them to invoke the Roman law of property (commercium), but not that of the family (connubium), and received Roman citizenship only when elected to magistracies.<P>(2) The colonies of the Gracchan period, established in pursuance of the scheme of agrarian reforms, to provide land for the poorer citizens.<P>(3) After the time of Sulla colonies were founded in Italy by the Republic as a device for granting lands to retiring veterans, who of course retained citizenship. This privilege was appropriated by Caesar and the emperors, who employed it to establish military colonies, chiefly in the provinces, with various rights and internal organizations. To this class belonged Philippi. Partly organized after the great battle of 42 BC, fought in the neighboring plain by Brutus and Cassius, the champions of the fated Republic, and Antonius and Octavian, it was fully established as a colony by Octavian (afterward styled Augustus) after the battle of Actium (31 BC), under the name Colonia Aug. Iul. Philippi or Philippensis. It received the ius Italicum, whereby provincial cities acquired the same status as Italian cities, which possessed municipal self-government and exemption from poll and land taxes.`<a href="./study/isbe/search.html?string=CITIZENSHIP">CITIZENSHIP</a>; <a href="./study/isbe/search.html?string=PHILIPPI">PHILIPPI</a>; <a href="./study/isbe/search.html?string=ROMAN">ROMAN</a>`75';
