isbe[2102]='Church`church:<p><b>I. PRE-CHRISTIAN HISTORY OF THE TERM</b><p><b>II. ITS ADOPTION BY JESUS</b><p><b>III. ITS USE IN THE NEW TESTAMENT</b><P class="in15">1. In the Gospels<P class="in15">2. In Acts<P class="in15">3. In the Pauline Epistles<p><b>IV. THE NOTES OF THE CHURCH</b><P class="in15">1. Faith<P class="in15">2. Fellowship<P class="in15">3. Unity<P class="in15">4. Consecration<P class="in15">5. Power<p><b>V. ORGANIZATION OF THE CHURCH</b><P class="in15">1. The General and Prophetic Ministry<P class="in15">2. The Local and Practical Ministry<P><b>LITERATURE</b><hr /><P>The word "church," which is derived from kuriakos, "of or belonging to the Lord," represents in the English Versions of the Bible of the New Testament the Greek word ekklesia; Latin, ecclesia. It is with the signification of this word ekklesia as it meets us in the New Testament, and with the nature of the society which the word is there used to describe, that the present article is concerned.<p>I. Pre-Christian History of the Term.<P>Although ekklesia soon became a distinctively Christian word, it has its own pre-Christian history; and to those, whether Jews or Greeks, who first heard it applied to the Christian society it would come with suggestions of familiar things. Throughout the Greek world and right down to New Testament times (compare <a onClick="return mV(\'Act\',19,39);">Ac 19:39</a>), ekklesia was the designation of the regular assembly of the whole body of citizens in a free city-state, "called out" (Greek ek, "out," and kalein, "to call") by the herald for the discussion and decision of public business. The Septuagint translators, again, had used the word to render the Hebrew qahal, which in the Old Testament denotes the "congregation" or community of Israel, especially in its religious aspect as the people of God. In this Old Testament sense we find ekklesia employed by Stephen in the Book of Acts, where he describes Moses as "he that was in the church (the Revised Version, margin "congregation") in the wilderness" (<a onClick="return mV(\'Act\',7,38);">Ac 7:38</a>). The word thus came into Christian history with associations alike for the Greek and the Jew. To the Greek it would suggest a self-governing democratic society; to the Jew a theocratic society whose members were the subjects of the Heavenly King. The pre-Christian history of the word had a direct bearing upon its Christian meaning, for the ekklesia of the New Testament is a "theocratic democracy" (Lindsay, Church and Ministry in the Early Centuries, 4), a society of those who are free, but are always conscious that their freedom springs from obedience to their King.<p>II. Its Adoption by Jesus.<P>According to <a onClick="return mV(\'Mat\',16,18);">Mt 16:18</a> the name ekklesia was first applied to the Christian society by Jesus Himself, the occasion being that of His benediction of Peter at Caesarea Philippi. The authenticity of the utterance has been called in question by certain critics, but on grounds that have no textual support and are made up of quite arbitrary presuppositions as to the composition of the First Gospel. It is true that Jesus had hitherto described the society He came to found as the "kingdom of God" or the "kingdom of heaven," a designation which had its roots in Old Testament teaching and which the Messianic expectations of Israel had already made familiar. But now when it was clear that He was to be rejected by the Jewish people (compare <a onClick="return mV(\'Mat\',16,21);">Mt 16:21</a>), and that His society must move on independent lines of its own, it was natural that He should employ a new name for this new body which He was about to create, and thus should say to Peter, on the ground of the apostle\'s believing confession, "Upon this rock I will build my church." The adoption of this name, however, did not imply any abandonment of the ideas suggested by the conception of the kingdom. In this very passage (<a onClick="return mV(\'Mat\',16,19);">Mt 16:19</a>) "the kingdom of heaven" is employed in a manner which, if it does not make the two expressions church and kingdom perfectly synonymous, at least compels us to regard them as closely correlative and as capable of translation into each other\'s terms. And the comparative disuse by the apostolic writers of the name "kingdom," together with their emphasis on the church, so far from showing that Christ\'s disciples had failed to understand His doctrine of the kingdom, and had substituted for it the more formal notion of the church, only shows that they had followed their Master\'s guidance in substituting for a name and a conception that were peculiarly Jewish, another name whose associations would enable them to commend their message more readily to the world at large.<p>III. Its Use in the New Testament.<P>1. In the Gospels:<P>Apart from the passage just referred to, the word ekklesia occurs in the Gospels on one other occasion only (<a onClick="return mV(\'Mat\',18,17);">Mt 18:17</a>). Here, moreover, it may be questioned whether Our Lord is referring to the Christian church, or to Jewish congregations commonly known as synagogues (see the Revised Version, margin) The latter view is more in keeping with the situation, but the promise immediately given to the disciples of a power to bind and loose (<a onClick="return mV(\'Mat\',18,18);">Mt 18:18</a>) and the assurance "Where two or three are gathered together in my name, there am I in the midst of them" (<a onClick="return mV(\'Mat\',18,20);">Mt 18:20</a>) are evidently meant for the people of Christ. If, as is probable, the ekklesia of <a onClick="return mV(\'Mat\',18,17);">Mt 18:17</a> is the Christian ekklesia of which Christ had already spoken to Peter, the words show that He conceived of the church as a society possessing powers of self-government, in which questions of discipline were to be decided by the collective judgment of the members.<P>2. In Acts:<P>In Acts the ekklesia has come to be the regular designation for the society of Christian believers, but is employed in two distinct senses. First in a local sense, to denote the body of Christians in a particular place or district, as in Jerusalem (<a onClick="return mV(\'Act\',5,11);">Ac 5:11</a>; <a onClick="return mV(\'Act\',8,1);">8:1</a>), in Antioch (<a onClick="return mV(\'Act\',13,1);">Ac 13:1</a>; <a onClick="return mV(\'Act\',15,22);">15:22</a>), in Caesarea (<a onClick="return mV(\'Act\',18,22);">Ac 18:22</a>)—a usage which reappears in the Apocalypse in the letters to the Seven Churches. Then in a wider and what may be called a universal sense, to denote the sum total of existing local churches (<a onClick="return mV(\'Act\',9,31);">Ac 9:31</a> the Revised Version (British and American)), which are thus regarded as forming one body.<P>3. In the Pauline Epistles:<P>In the Pauline Epistles both of these usages are frequent. Thus the apostle writes of "the church of the Thessalonians" (<a onClick="return mV(\'1Th\',1,1);">1Th 1:1</a>), "the church of God which is at Corinth" (<a onClick="return mV(\'1Cr\',1,2);">1Co 1:2</a>; <a onClick="return mV(\'2Cr\',1,1);">2Co 1:1</a>). Indeed he localizes and particularizes the word yet further by applying it to a single Christian household or to little groups of believers who were accustomed to assemble in private houses for worship and fellowship (<a onClick="return mV(\'Rom\',16,5);">Ro 16:5</a>; <a onClick="return mV(\'1Cr\',16,19);">1Co 16:19</a>; <a onClick="return mV(\'Col\',4,15);">Col 4:15</a>; <a onClick="return mV(\'Phm\',1,2);">Phm 1:2</a>)—an employment of the word which recalls the saying of Jesus in <a onClick="return mV(\'Mat\',18,20);">Mt 18:20</a>. The universal use, again, may be illustrated by the contrast he draws between Jews and Greeks on the one hand and the church of God on the other (<a onClick="return mV(\'1Cr\',10,32);">1Co 10:32</a>), and by the declaration that God has set in the church apostles, prophets, and teachers (<a onClick="return mV(\'1Cr\',12,28);">1Co 12:28</a>).<P>But Paul in his later epistles has another use of ekklesia peculiar to himself, which may be described as the ideal use. The church, now, is the body of which Christ is the head (<a onClick="return mV(\'Eph\',1,22);">Eph 1:22</a>f; <a onClick="return mV(\'Col\',1,18,24);">Col 1:18, 24</a>). It is the medium through which God\'s manifold wisdom and eternal purpose are to be made known not only to all men, but to the principalities and powers in the heavenly places (<a onClick="return mV(\'Eph\',3,\'9-11\');">Eph 3:9-11</a>). It is the bride of whom He is the heavenly Bridegroom, the bride for whom in His love He gave Himself up, that He might cleanse and sanctify her and might present her to Himself a glorious church, a church without blemish, not having spot or wrinkle or any such thing (<a onClick="return mV(\'Eph\',5,25);">Eph 5:25</a>ff). This church clearly is not the actual church as we know it on earth, with its divisions, its blemishes, its shortcomings in faith and love and obedience. It is the holy and catholic church that is to be when the Bridegroom has completed the process of lustration, having fully "cleansed it by the washing of water with the word." It is the ideal which the actual church must keep before it and strive after, the ideal up to which it shall finally be guided by that Divine in-working power which is able to conform the body to the head, to make the bride worthy of the Bridegroom, so that God may receive in the church the glory that is His (<a onClick="return mV(\'Eph\',3,21);">Eph 3:21</a>).<p>IV. The Notes of the Church.<P>1. Faith:<P>Although a systematic doctrine of the church is neither to be found nor to be looked for in the New Testament, certain characteristic notes or features of the Christian society are brought before us from which we can form some conception as to its nature. The fundamental note is faith. It was to Peter confessing his faith in Christ that the promise came, "Upon this rock I will build my church" (<a onClick="return mV(\'Mat\',16,18);">Mt 16:18</a>). Until Jesus found a man full of faith He could not begin to build His church; and unless Peter had been the prototype of others whose faith was like his own, the walls of the church would never have risen into the air. Primarily the church is a society not of thinkers or workers or even of worshippers, but of believers. Hence, we find that "believers" or "they that believed" is constantly used as a synonym for the members of the Christian society (e.g. <a onClick="return mV(\'Act\',2,44);">Ac 2:44</a>; <a onClick="return mV(\'Act\',4,32);">4:32</a>; <a onClick="return mV(\'Act\',5,14);">5:14</a>; <a onClick="return mV(\'1Ti\',4,12);">1Ti 4:12</a>). Hence, too, the rite of baptism, which from the first was the condition of entrance into the apostolic church and the seal of membership in it, was recognized as preeminently the sacrament of faith and of confession (<a onClick="return mV(\'Act\',2,41);">Ac 2:41</a>; <a onClick="return mV(\'Act\',8,12,36);">8:12, 36</a>; <a onClick="return mV(\'Rom\',6,4);">Ro 6:4</a>; <a onClick="return mV(\'1Cr\',12,13);">1Co 12:13</a>). This church-founding and church-building faith, of which baptism was the seal, was much more than an act of intellectual assent. It was a personal laying hold of the personal Saviour, the bond of a vital union between Christ and the believer which resulted in nothing less than a new creation (<a onClick="return mV(\'Rom\',6,4);">Ro 6:4</a>; <a onClick="return mV(\'Rom\',8,1,2);">8:1-2</a>; <a onClick="return mV(\'2Cr\',5,17);">2Co 5:17</a>).<P>2. Fellowship:<P>If faith in Christ is the fundamental note of the Christian society, the next is fellowship among the members. This follows from the very nature of faith as just described; for if each believer is vitally joined to Christ, all believers must stand in a living relation to one another. In Paul\'s favorite figure, Christians are members one of another because they are members in particular of the body of Christ (<a onClick="return mV(\'Rom\',12,5);">Ro 12:5</a>; <a onClick="return mV(\'1Cr\',12,27);">1Co 12:27</a>). That the Christian society was recognized from the first as a fellowship appears from the name "the brethren," which is so commonly applied to those who belong to it. In Acts the name is of very frequent occurrence (<a onClick="return mV(\'Act\',9,30);">Ac 9:30</a>, etc.), and it is employed by Paul in the epistles of every period of his career (<a onClick="return mV(\'1Th\',4,10);">1Th 4:10</a>, etc.). Similar testimony lies in the fact that "the koinonia" (English Versions "fellowship") takes its place in the earliest meetings of the church side by side with the apostles\' teaching and the breaking of bread and prayers (<a onClick="return mV(\'Act\',2,42);">Ac 2:42</a>). See <a href="./study/isbe/search.html?string=COMMUNION">COMMUNION</a>. The koinonia at first carried with it a community of goods (<a onClick="return mV(\'Act\',2,44);">Ac 2:44</a>; <a onClick="return mV(\'Act\',4,32);">4:32</a>), but afterward found expression in the fellowship of ministration (<a onClick="return mV(\'2Cr\',8,4);">2Co 8:4</a>) and in such acts of Christian charity as are inspired by Christian faith (<a onClick="return mV(\'Hbr\',13,16);">Heb 13:16</a>). In the Lord\'s Supper, the other sacrament of the primitive church, the fellowship of Christians received its most striking and most sacred expression. For if baptism was especially the sacrament of faith, the Supper was distinctively the sacrament of love and fellowship—a communion or common participation in Christ\'s death and its fruits which carried with it a communion of hearts and spirits between the participants themselves.<P>3. Unity:<P>Although local congregations sprang up wherever the gospel was preached, and each of these enjoyed an independent life of its own, the unity of the church was clearly recognized from the first. The intercourse between Jerusalem and Antioch (<a onClick="return mV(\'Act\',11,22);">Ac 11:22</a>; <a onClick="return mV(\'Act\',15,2);">15:2</a>), the conference held in the former city (<a onClick="return mV(\'Act\',15,6);">Ac 15:6</a>ff), the right hand of fellowship given by the elder apostles to Paul and Barnabas (<a onClick="return mV(\'Gal\',2,9);">Ga 2:9</a>), the untiring efforts made by Paul himself to forge strong links of love and mutual service between Gentile and Jewish Christians (<a onClick="return mV(\'2Cr\',8,\'1-\');">2Co 8</a>)—all these things serve to show how fully it was realized that though there were many churches, there was but one church. This truth comes to its complete expression in the epistles of Paul\'s imprisonment, with their vision of the church as a body of which Christ is the head, a body animated by one spirit, and having one Lord, one faith, one baptism, one God and Father of all (<a onClick="return mV(\'Eph\',4,4);">Eph 4:4</a>ff; <a onClick="return mV(\'Col\',1,18);">Col 1:18</a>; <a onClick="return mV(\'Col\',3,11);">3:11</a>). And this unity, it is to be noticed, is conceived of as a visible unity. Jesus Himself evidently conceived it so when He prayed for His disciples that they all might be one, so that the world might believe (<a onClick="return mV(\'Jhn\',17,21);">Joh 17:21</a>). And the unity of which Paul writes and for which he strove is a unity that finds visible expression. Not, it is true, in any uniformity of outward polity, but through the manifestation of a common faith in acts of mutual love (<a onClick="return mV(\'Eph\',4,3,13);">Eph 4:3, 13</a>; <a onClick="return mV(\'2Cr\',9,\'1-\');">2Co 9</a>).<P>4. Consecration:<P>Another dominant note of the New Testament church lay in the consecration of its members. "Saints" is one of the most frequently recurring designations for them that we find. As thus employed, the word has in the first place an objective meaning; the sainthood of the Christian society consisted in its separation from the world by God\'s electing grace; in this respect it has succeeded to the prerogatives of Israel under the old covenant. The members of the church, as Peter said, are "an elect race, a royal priesthood, a holy nation, a people for God\'s own possession" (<a onClick="return mV(\'1Pe\',2,9);">1Pe 2:9</a>). But side by side with this sense of an outward and priestly consecration, the flame "saints" carried within it the thought of an ethical holiness—a holiness consisting, not merely in a status determined by relation to Christ, but in an actual and practical saintliness, a consecration to God that finds expression in character and conduct. No doubt the members of the church are called saints even when the living evidences of sainthood are sadly lacking. Writing to the Corinthian church in which he found so much to blame, Paul addresses its members by this title (<a onClick="return mV(\'1Cr\',1,2);">1Co 1:2</a>; compare <a onClick="return mV(\'1Cr\',6,11);">1Co 6:11</a>). But he does so for other than formal reasons—not only because consecration to God is their outward calling and status as believers; but also because he is assured that a work of real sanctification is going on, and must continue to go on, in their bodies and their spirits which are His. For those who are in Christ are a new creation (<a onClick="return mV(\'2Cr\',5,17);">2Co 5:17</a>), and those to whom has come the separating and consecrating call (<a onClick="return mV(\'2Cr\',6,17);">2Co 6:17</a>) must cleanse themselves from all filthiness of the flesh and spirit, perfecting holiness in the fear of God (<a onClick="return mV(\'2Cr\',7,1);">2Co 7:1</a>). Paul looks upon the members of the church, just as he looks upon the church itself, with a prophetic eye; he sees them not as they are, but as they are to be. And in his view it is "by the washing of water with the word," in other words by the progressive sanctification of its members, that the church itself is to be sanctified and cleansed, until Christ can present it to Himself a glorious church, not having spot or wrinkle or any such thing (<a onClick="return mV(\'Eph\',5,26,27);">Eph 5:26-27</a>).<P>5. Power:<P>Yet another note of the church was spiritual power. When the name ekklesia was given by Jesus to the society He came to found, His promise to Peter included the bestowal of the gift of power (<a onClick="return mV(\'Mat\',16,18,19);">Mt 16:18-19</a>). The apostle was to receive the "power of the keys," i.e. he was to exercise the privilege of opening the doors of the kingdom of heaven to the Jew (<a onClick="return mV(\'Act\',2,41);">Ac 2:41</a>) and to the Gentile (<a onClick="return mV(\'Act\',10,\'34-38\');">Ac 10:34-38</a>; <a onClick="return mV(\'Act\',15,7);">15:7</a>). He was further to have the power of binding and loosing, i.e. of forbidding and permitting; in other words he was to possess the functions of a legislator within the spiritual sphere of the church. The legislative powers then bestowed upon Peter personally as the reward of his believing confession were afterward conferred upon the disciples generally (<a onClick="return mV(\'Mat\',18,18);">Mt 18:18</a>; compare <a onClick="return mV(\'Mat\',18,1);">Mt 18:1</a> and also <a onClick="return mV(\'Mat\',18,19,20);">Mt 18:19-20</a>), and at the conference in Jerusalem were exercised by the church as a whole (<a onClick="return mV(\'Act\',15,4,22);">Ac 15:4, 22</a>). The power to open the gates of the kingdom of heaven was expanded into the great missionary commission, "Go ye therefore, and make disciples of all the nations" (<a onClick="return mV(\'Mat\',28,19);">Mt 28:19</a>)—a commission that was understood by the apostolic church to be addressed not to the eleven apostles only, but to all Christ\'s followers without distinction (<a onClick="return mV(\'Act\',8,4);">Ac 8:4</a>, etc.). To the Christian society there thus belonged the double power of legislating for its own members and of opening the kingdom of heaven to all believers. But these double functions of teaching and government were clearly recognized as delegated gifts. The church taught the nations because Christ had bid her go and do it. She laid down laws for her own members because He had conferred upon her authority to bind and to loose. But in every exercise of her authority she relied upon Him from whom she derived it. She believed that Christ was with her alway, even unto the end of the world (<a onClick="return mV(\'Mat\',28,20);">Mt 28:20</a>), and that the power with which she was endued was power from on high (<a onClick="return mV(\'Luk\',24,49);">Lu 24:49</a>).<p>V. Organization of the Church.<P>It seems evident from the New Testament that Jesus gave His disciples no formal prescriptions for the organization of the church. In the first days after Pentecost they had no thought of separating themselves from the religious life of Israel, and would not realize the need of any distinct organization of their own. The temple-worship was still adhered to (<a onClick="return mV(\'Act\',2,46);">Ac 2:46</a>; <a onClick="return mV(\'Act\',3,1);">3:1</a>), though it was supplemented by apostolic teaching, by prayer and fellowship, and by the breaking of bread (<a onClick="return mV(\'Act\',2,42,46);">Ac 2:42, 46</a>). Organization was a thing of gradual growth suggested by emerging needs, and the differentiation of function among those who were drawn into the service of the church was due to the difference in the gifts bestowed by God upon the church members (<a onClick="return mV(\'1Cr\',12,28);">1Co 12:28</a>). At first the Twelve themselves, as the immediate companions of Jesus throughout His ministry and the prime witnesses of the Christian facts and especially of the resurrection (compare <a onClick="return mV(\'Act\',1,21,22);">Ac 1:21-22</a>), were the natural leaders and teachers of the community. Apart from this, the earliest evidence of anything like organization is found in the distinction drawn by the Twelve themselves between the ministry of the word and the ministry of tables (<a onClick="return mV(\'Act\',6,2,4);">Ac 6:2, 4</a>)—a distinction which was fully recognized by Paul (<a onClick="return mV(\'Rom\',12,6,8);">Ro 12:6, 8</a>; <a onClick="return mV(\'1Cr\',1,17);">1Co 1:17</a>; <a onClick="return mV(\'1Cr\',9,14);">9:14</a>; <a onClick="return mV(\'1Cr\',12,28);">12:28</a>), though he enlarged the latter type of ministry so as to include much more than the care of the poor. The two kinds of ministry, as they meet us at the first, may broadly be distinguished as the general and prophetic on the one hand, the local and practical on the other.<P>1. The General and Prophetic Ministry:<P>From <a onClick="return mV(\'Act\',6,1);">Ac 6:1</a>ff we see that the Twelve recognized that they were Divinely called as apostles to proclaim the gospel; and Paul repeatedly makes the same claim for himself (<a onClick="return mV(\'1Cr\',1,17);">1Co 1:17</a>; <a onClick="return mV(\'1Cr\',9,16);">9:16</a>; <a onClick="return mV(\'2Cr\',3,6);">2Co 3:6</a>; <a onClick="return mV(\'2Cr\',4,1);">4:1</a>; <a onClick="return mV(\'Col\',1,23);">Col 1:23</a>). But apostle ship was by no means confined to the Twelve (<a onClick="return mV(\'Act\',14,14);">Ac 14:14</a>; <a onClick="return mV(\'Rom\',16,7);">Ro 16:7</a>; compare Didache 11 4ff); and an itinerant ministry of the word was exercised in differing ways by prophets, evangelists, and teachers, as well as by apostles (<a onClick="return mV(\'1Cr\',12,28,29);">1Co 12:28-29</a>; <a onClick="return mV(\'Eph\',4,11);">Eph 4:11</a>). The fact that Paul himself is variously described as an apostle, a prophet, a teacher (<a onClick="return mV(\'Act\',13,1);">Ac 13:1</a>; <a onClick="return mV(\'Act\',14,14);">14:14</a>; <a onClick="return mV(\'1Ti\',2,7);">1Ti 2:7</a>; <a onClick="return mV(\'2Ti\',1,11);">2Ti 1:11</a>) appears to show that the prophetic ministry was not a ministry of stated office, but one of special gifts and functions. The apostle carried the good tidings of salvation to the ignorant and unbelieving (<a onClick="return mV(\'Gal\',2,7,8);">Ga 2:7-8</a>), the prophet (in the more specific sense of the word) was a messenger to the church (<a onClick="return mV(\'1Cr\',14,4,22);">1Co 14:4, 22</a>); and while the teacher explained and applied truth that was already possessed (<a onClick="return mV(\'Hbr\',5,12);">Heb 5:12</a>), the prophet was recognized by those who had spiritual discernment (<a onClick="return mV(\'1Cr\',2,15);">1Co 2:15</a>; <a onClick="return mV(\'1Cr\',14,29);">14:29</a>; <a onClick="return mV(\'1Jo\',4,1);">1Jo 4:1</a>) as the Divinely employed medium of fresh revelations (<a onClick="return mV(\'1Cr\',14,25,30,31);">1Co 14:25, 30-31</a>; <a onClick="return mV(\'Eph\',3,5);">Eph 3:5</a>; compare Didache 4 1).<P>2. The Local and Practical Ministry:<P>The earliest examples of this are the Seven of Jerusalem who were entrusted with the care of the "daily ministration" (<a onClick="return mV(\'Act\',6,1);">Ac 6:1</a>ff). With the growth of the church, however, other needs arose, and the local ministry is seen developing in two distinct directions. First there is the presbyter or elder, otherwise known as the bishop or overseer, whose duties, while still local, are chiefly of a spiritual kind (<a onClick="return mV(\'Act\',20,17,28,35);">Ac 20:17, 28, 35</a>; <a onClick="return mV(\'1Ti\',3,2,5);">1Ti 3:2, 5</a>; <a onClick="return mV(\'Jam\',5,14);">Jas 5:14</a>; <a onClick="return mV(\'1Pe\',5,2);">1Pe 5:2</a>). See <a href="./study/isbe/search.html?string=BISHOP">BISHOP</a>. Next there are the deacon and the deaconess (<a onClick="return mV(\'Phl\',1,1);">Php 1:1</a>; <a onClick="return mV(\'1Ti\',3,\'8-13\');">1Ti 3:8-13</a>), whose work appears to have lain largely in house to house visitation and a practical ministry to the poor and needy (<a onClick="return mV(\'1Ti\',5,\'8-11\');">1Ti 5:8-11</a>). The necessities of government, of discipline, and of regular and stated instruction had thus brought it to pass that within New Testament times some of the functions of the general ministry of apostles and prophets were discharged by a local ministry. The general ministry, however, was still recognized to be the higher of the two. Paul addresses the presbyter- bishops of Ephesus in a tone of lofty spiritual authority (<a onClick="return mV(\'Act\',20,17);">Ac 20:17</a>ff). And according to the Didache, a true prophet when he visits a church is to take precedence over the resident bishops and deacons (Didache 10 7; 13 3).<P>LITERATURE.<P>Hort, The Christian Ecclesia; Lindsay, The Church and the Ministry in the Early Cents., lects I-V; Hatch, Bampton Lectures; Gwatkin, Early Church History to AD 313; Kostlin, article "Kirche" in See Hauck-Herzog, Realencyklopadie fur protestantische Theologie und Kirche; Armitage Robinson, article "Church" in Encyclopedia Biblica; Fairbairn Christ in Modern Theology, 513-34; Dargan, Ecclesiology; Denney, Studies in Theology, Ch viii.`<a href="./study/isbe/search.html?string=CHURCH+GOVERNMENT">CHURCH GOVERNMENT</a>`94';
isbe[2103]='Church Government`guv\'-ern-ment:<p><b>I. APPROACH TO SUBJECT</b><P class="in15">1. The General Sense<P class="in15">2. The Local Sense<p><b>II. INTERNAL ORDER</b><P class="in15">1. Subjects of Admission<P class="in15">2. Definite Organizations<P class="in15">3. Ministers<P class="in30">(1) General<P class="in30">(2) Local<P class="in15">4. Ecclesiastical Functions<P class="in30">(1) Control of Membership<P class="in30">(2) Selection of Officers, etc.<P class="in30">(3) Observations of Ordinances<P class="in15">5. Independent (Autonomous) Organizations<p><b>III. EXTERNAL AUTHORITY</b><p><b>IV. COOPERATIVE RELATIONS</b><P><b>LITERATURE</b><hr /><P>The object here sought is to discover what kind of church government is mirrored in the New Testament. To do this with perfect definiteness is, no doubt, quite impossible. Certain general features, however, may clearly be seen.<p>I. Approach to the Subject.<P>The subject is best approached through the Greek word ekklesia, translated "church." Passing by the history of this word, and its connection with the Hebrew words \'edhah and qahal (which the Septuagint sometimes renders by ekklesia), we come at once to the New Testament usage. Two perfectly distinct senses are found, namely, a general and a local.<P>1. The General Sense:<P>Christ is "head over all things to the church, which is his body ...."(<a onClick="return mV(\'Eph\',1,22);">Eph 1:22</a>); "the general assembly and church of the firstborn who are enrolled in heaven" (<a onClick="return mV(\'Hbr\',12,23);">Heb 12:23</a>). Here we have "church" in the broadest sense, including all the redeemed in earth and heaven, and in all ages (see also <a onClick="return mV(\'Eph\',1,22);">Eph 1:22</a>; <a onClick="return mV(\'Eph\',3,10);">3:10</a>; <a onClick="return mV(\'Eph\',5,\'22-27\');">5:22-27</a>; <a onClick="return mV(\'Col\',1,24);">Col 1:24</a>; <a onClick="return mV(\'Hbr\',12,23);">Heb 12:23</a>).<P>2. The Local Sense:<P>Here the Scripture passages are very numerous. In some cases, the word is used in the singular, and in others the plural; in some it is used with reference to a specified church, and in others without such specification. In all cases the sense is local.<P>In <a onClick="return mV(\'Act\',11,26);">Ac 11:26</a>, it is said that Paul and Barnabas were "gathered together with the church," where the church at Antioch is meant. In <a onClick="return mV(\'Act\',14,23);">Ac 14:23</a>, Paul and Barnabas are said to have "appointed elders in every church," that is, churches which they had planted. In <a onClick="return mV(\'Rev\',2,\'1-\');">Re 2</a> and <a onClick="return mV(\'Rev\',3,\'1-\');">Re 3</a> the seven churches of Asia Minor are addressed. In <a onClick="return mV(\'Act\',16,5);">Ac 16:5</a> we are told that the churches "were strengthened in the faith." On the local sense see, further, <a onClick="return mV(\'Act\',8,1);">Ac 8:1</a>; <a onClick="return mV(\'Act\',15,4);">15:4</a>; <a onClick="return mV(\'Act\',16,5);">16:5</a>; <a onClick="return mV(\'Act\',20,17);">20:17</a>; <a onClick="return mV(\'Rom\',16,4);">Ro 16:4</a>; <a onClick="return mV(\'1Cr\',12,\'1-\');">1Co 12</a>; <a onClick="return mV(\'1Cr\',6,4);">6:4</a>; <a onClick="return mV(\'1Cr\',11,16);">11:16</a>; <a onClick="return mV(\'Gal\',1,2,22);">Ga 1:2, 22</a>, and many other places.<P>There are a few passages that do not seem exactly to fit into either of the above categories. Such, for example, are <a onClick="return mV(\'Mat\',18,17);">Mt 18:17</a> and <a onClick="return mV(\'1Cr\',12,28);">1Co 12:28</a>, where it seems best to understand a generic sense. Such, also, are passages like <a onClick="return mV(\'Act\',9,31);">Ac 9:31</a>, and <a onClick="return mV(\'1Cr\',10,32);">1Co 10:32</a>, where a collective sense best suits the cases.<P>Church government in the New Testament applies only to the local bodies.<p>II. Internal Order.<P>With respect to the constitution and life of these New Testament churches, several points may be made out beyond reasonable doubt.<P>1. Subjects of Admission:<P>They were composed of persons who professed faith in Christ, and who were believed to have been regenerated, and who had been baptized. See <a onClick="return mV(\'Act\',2,41,44,47);">Ac 2:41, 44, 47</a> (the Revised Version (British and American) "added to them"); <a onClick="return mV(\'Act\',8,12);">Ac 8:12</a>; <a onClick="return mV(\'Rom\',1,8);">Ro 1:8</a>; <a onClick="return mV(\'Rom\',6,4);">6:4</a>; <a onClick="return mV(\'Rom\',10,9,10);">10:9-10</a>; <a onClick="return mV(\'1Cr\',1,2);">1Co 1:2</a>; <a onClick="return mV(\'Col\',1,2,4);">Col 1:2, 4</a>; <a onClick="return mV(\'1Ti\',6,12);">1Ti 6:12</a>, and others, where they are called "saints," "sons of God," "faithful brethren," "sanctified in Christ Jesus."<P>2. Definite Organizations:<P>They are definitely and permanently organized bodies, and not temporary and loose aggregations of individuals. It is quite impossible, for example, to regard the church at Antioch as a loose aggregation of people for a passing purpose. The letters of Paul to the churches at Rome, Corinth, Philippi, Thessalonica, cannot be regarded as addressed to other than permanent and definitely organized bodies.<P>3. Ministers:<P>They were served by two classes of ministers—one general, the other local.<P>(1) General.<P>At the head of these is the "apostle" (<a onClick="return mV(\'1Cr\',12,28);">1Co 12:28</a>; <a onClick="return mV(\'Eph\',4,11);">Eph 4:11</a>). His official relation to the churches was general. He did not necessarily belong to the group of the original Eleven. Besides Matthias (<a onClick="return mV(\'Act\',1,26);">Ac 1:26</a>), Paul and Barnabas (<a onClick="return mV(\'1Cr\',9,5,6);">1Co 9:5-6</a>), James, the Lord\'s brother (<a onClick="return mV(\'Gal\',1,19);">Ga 1:19</a>), Andronicus and Junias (<a onClick="return mV(\'Rom\',16,7);">Ro 16:7</a>) are reckoned as "apostles." The one invariable and necessary qualification of an apostle was that he should have seen the Lord after the Resurrection (<a onClick="return mV(\'Act\',1,22);">Ac 1:22</a>; <a onClick="return mV(\'1Cr\',9,1);">1Co 9:1</a>). Another qualification was to have wrought "the signs of an apostle" (<a onClick="return mV(\'2Cr\',12,12);">2Co 12:12</a>; compare <a onClick="return mV(\'1Cr\',9,2);">1Co 9:2</a>). He was to bear witness to what he had seen and heard, to preach the gospel of the kingdom (<a onClick="return mV(\'Act\',1,8);">Ac 1:8</a>; <a onClick="return mV(\'1Cr\',1,17);">1Co 1:17</a>), to found churches and have a general care of them (<a onClick="return mV(\'2Cr\',11,28);">2Co 11:28</a>). From the nature of his chief qualification, his office was temporary.<P>Next comes the "prophet." His relation to the churches, also, was general. It was not necessary that he should have seen the Lord, but it appertained to his spiritual function that he should have revelations (<a onClick="return mV(\'Eph\',3,5);">Eph 3:5</a>). There is no indication that his office was in any sense administrative.<P>After the "prophet" come the "evangelist" and "teacher," the first, a traveling preacher, the second, one who had special aptitude for giving instruction.<P>After the "teacher" and "evangelist" follow a group of special gifts of "healing," "helps," "governments," "tongues." It may be that "helps" and "governments" are to be identified with "deacons" and "bishops," to be spoken of later. The other items in this part of Paul\'s list seem to refer to special charismata.<P>(2) Local.<P>There were two clearly distinct offices of a local and permanent kind in the New Testament churches. Paul (<a onClick="return mV(\'Phl\',1,1);">Php 1:1</a>) addresses "all the saints in Christ Jesus that are at Philippi, with the bishops and deacons."<P>See <a href="./study/isbe/search.html?string=BISHOP">BISHOP</a>; <a href="./study/isbe/search.html?string=DEACON">DEACON</a>.<P>The most common designation of the first of these officers is "elder" (presbuteros). In one passage (<a onClick="return mV(\'Eph\',4,11);">Eph 4:11</a>) he is called "pastor" (poimen). In <a onClick="return mV(\'Act\',20,\'17-28\');">Ac 20:17-28</a>, it becomes clear that the office of elder, bishop, and pastor was one; for there the apostle charges the elders of the church at Ephesus to feed (pastor) the church in which the Holy Spirit has made them bishops (compare <a onClick="return mV(\'Tts\',1,5,7);">Titus 1:5, 7</a>; <a onClick="return mV(\'1Pe\',5,1,2);">1Pe 5:1-2</a>).<P>The function of the elders was, in general, spiritual, but involved an oversight of all the affairs of the church (<a onClick="return mV(\'1Ti\',3,2);">1Ti 3:2</a>; <a onClick="return mV(\'1Ti\',5,17);">5:17</a>).<P>As to the second of the local church officers, it has to be said that little is given us in the New Testament. That the office of deacon originated with the appointment of the Seven in <a onClick="return mV(\'Act\',6,\'1-\');">Ac 6</a> is not certain. If we compare the qualifications there given by the apostles with those given by Paul in <a onClick="return mV(\'1Ti\',3,\'8-13\');">1Ti 3:8-13</a>, it seems quite probable that the necessity which arose at Jerusalem, and which led to the appointment of the Seven was really the occasion for originating the office of deacon in the churches. The work assigned the Seven was secular, that is to say, the "service of tables." They were to relieve the apostles of that part of the work. A similar relation to the work of the elders seems to have been borne by that of the deacons.<P>Again, they exercised the highest ecclesiastical functions.<P>4. Ecclesiastical Functions:<P>(1) Control of Membership.<P>In <a onClick="return mV(\'Mat\',18,17);">Mt 18:17</a>, our Lord, by anticipation, lodges final action, in the sphere of church discipline, with the church. When the church has taken action, the matter is ended. There is no direction to take it to a higher court. In the church at Corinth, there was a man who was guilty of an infamous offense against purity. With regard to the case, Paul urged the most summary discipline (<a onClick="return mV(\'1Cr\',5,5);">1Co 5:5</a>). If the church should act upon the judgment which he communicated to them, they would act when "gathered together"; that is to say, action would be taken in conference of the church. In <a onClick="return mV(\'2Cr\',2,\'1-\');">2Co 2</a>, a reference to the case shows that they had acted upon his advice, and that the action was taken by the majority ("the many," the more, <a onClick="return mV(\'2Cr\',2,6);">2Co 2:6</a>). In <a onClick="return mV(\'2Cr\',2,\'1-\');">2Co 2</a> he counsels restoration of this excluded member now repentant. Exclusion and restoration of members were to be effected by a church. This, of course, carried with it the reception of members in the first instance.<P>(2) Selection of Officers, etc.<P>This was true in case of the Seven (<a onClick="return mV(\'Act\',6,\'3-13\');">Ac 6:3-13</a>; see other cases in <a onClick="return mV(\'Act\',15,22);">Ac 15:22</a>; <a onClick="return mV(\'1Cr\',16,3);">1Co 16:3</a>; <a onClick="return mV(\'2Cr\',8,1);">2Co 8:1</a>ff; <a onClick="return mV(\'Phl\',2,25);">Php 2:25</a>). <a onClick="return mV(\'Act\',14,23);">Ac 14:23</a> and <a onClick="return mV(\'Tts\',1,5);">Titus 1:5</a> seem, at first, to offset the passages just given. In one of these, Paul and Barnabas are said to have "appointed" (cheirotonesantes) elders in the churches which they had planted. But scholars of first quality, though themselves adhering to Presbyterial or Episcopal forms of church government, maintain that Paul and Barnabas ordained the elders whom the churches selected—that they "appointed" them in the usual way, by the suffrages of the members of the churches concerned. The word rendered "appoint" in <a onClick="return mV(\'Tts\',1,5);">Tit 1:5</a> (katasteses) is more easily understood as referring to ordination instead of selection.<P>(3) Observation of Ordinances.<P>Paul gives direction (<a onClick="return mV(\'1Cr\',11,\'20-34\');">1Co 11:20-34</a>) to the church at Corinth about the observance of the Lord\'s Supper. These directions are given, not to any officer or set of officers, but to the church. Ecclesiastically, of course, the two ordinances are on the same level; and, if one of them had been committed to the custody, so to say, of the churches, so must the other.<P>5. Independent (Autonomous) Organizations:<P>The management of their business was in their own hands. Paul wrote the church at Corinth: "Let all things be done decently and in order" (<a onClick="return mV(\'1Cr\',14,40);">1Co 14:40</a>). In that comprehensive injunction, given to a church, is implied control of its affairs by the church.<p>III. External Authority.<P>The investigation up to this point places us in position to see that there is in the New Testament no warrant for ecclesiastical grades in the ministry of the churches, by which there may be created an ascending series of rulers who shall govern the churches merged into one vast ecclesiastical organization called "the church." So, also, we are in position to see that there is no warrant for an ascending series of courts which may review any "case" that originates in a local church. We may see, on the contrary, that to each local church has been committed by Christ the management of its own affairs; and that He had endowed every such church with ecclesiastical competency to perform every function that any ecclesiastical body has a right to perform.<P>As the churches are not to be dominated by any external ecclesiastical authority, so they are not to be interfered with, in their church life, by civil government. Jesus taught that Christians should be good citizens (<a onClick="return mV(\'Mat\',22,\'15-22\');">Mt 22:15-22</a>); so did the apostles (<a onClick="return mV(\'Rom\',13,\'1-7\');">Ro 13:1-7</a>; <a onClick="return mV(\'1Pe\',2,\'13-16\');">1Pe 2:13-16</a>). Jesus also taught the spirituality of His Kingdom: "My kingdom is not of this world" (<a onClick="return mV(\'Jhn\',18,36);">Joh 18:36</a>). It follows that only where the life of a church touched the civic life of the community has the civil authority any right to interfere.<p>IV. Cooperative Relations.<P>While each local church, according to the New Testament, is independent of every other in the sense that no other has jurisdiction over it, yet cooperative relations were entered into by New Testament churches. Examples and indications of that may be found in <a onClick="return mV(\'Rom\',15,26,27);">Ro 15:26-27</a>; <a onClick="return mV(\'2Cr\',8,\'1-\');">2Co 8</a>; <a onClick="return mV(\'2Cr\',9,\'1-\');">9</a>; <a onClick="return mV(\'Gal\',2,10);">Ga 2:10</a>; <a onClick="return mV(\'Rom\',15,1);">Ro 15:1</a>; <a onClick="return mV(\'3Jo\',1,8);">3Joh 1:8</a>. The principle of cooperation effective in those cases is susceptible of indefinite expansion. Churches may properly cooperate in matters of discipline, by seeking and giving counsel, and by respecting each other\'s disciplinary measures. In the great, paramount business of evangelizing and teaching the nations, they may cooperate in a multitude of ways. There is no sphere of general Christian activity in which the churches may not voluntarily and freely cooperate for the betterment of the world, the salvation of humanity.<P>LITERATURE.<P>Hort, The Christian Ecclesia; Hatch, Organization of the Early Christian Churches; Whitley, Church, Ministry and Sacraments in the New Testament; Lindsay, The Church and the Ministry in the Early Cents.; French, Synonyms of New Testament; Vitringa, De Synagoga Vetere; Holzinger, ZAW; Schurer, Schurer, History of the Jewish People in the Time of Jesus Christ, II; Driver, Driver, Introduction to the Literature of the Old Testament; Thayer, New Testament Lexicon, and Cremer, Biblical Theol. Lexicon, under the word, "ekklesia" and "sunagoge"; Neumann, Rom. Staat und die all-gemeine Kirche; Ramsay, Church in the Roman Empire.; Lightfoot, "The Christian Ministry," in Commentary on Philippians; Harvey, The Church; Dagg, Church Order; Hovey, Religion and the State; Owen, Church Government; Ladd, Principles of Church Polity; Dexter, Congregationalism; Hodge, Discussions in Church Polity; Abbey, Ecclesiastical Constitutions; Hooker, Ecclesiastical Polity; Jacob, Ecclesiastical Polity; Bore, The Church and Its Ministry; Dollinger, The Church and The Churches; Stanley, Lectures on the Eastern Church; Dargan, Ecclesiology.`<a href="./study/isbe/search.html?string=BISHOP">BISHOP</a>; <a href="./study/isbe/search.html?string=GOVERNMENT">GOVERNMENT</a>; <a href="./study/isbe/search.html?string=MINISTRY">MINISTRY</a>`61';

isbe[2106]='Churl`churl (kilay or kelay): The Hebrew word occurs only in <a onClick="return mV(\'Isa\',32,5,7);">Isa 32:5, 7</a>, in the latter verse in a form slightly modified so as to produce a pleasing assonance with the word immediately following. The word probably means "crafty" or "miserly," both ideas being suitable to the context, though "miserly" accords with the setting in Isaiah somewhat better.<P>In <a onClick="return mV(\'1Sa\',25,3);">1Sa 25:3</a> the Hebrew qasheh which means "hard," "severe," "rough," is rendered "churlish." In Saxon, churl, as the name for the lowest order of freemen, came to be used of persons boorish in manner. The rough and ill-mannered Nabal is aptly described as churlish.``156';

isbe[2108]='Chusi`ku\'-si, (Chous): A place only named in Judith 7:18, as near Ekrebel on the brook Mochmur. It was in central Palestine, and has with some probability been identified with Quzah, a village 5 1/2 miles south of Nablus and 5 miles west of Agrabeh (Ekrebel).``1';
isbe[2109]='Chuzas`ku\'-zas, chu\'-zas (Chouzas; the King James Version Chuza): The steward of Herod Antipas. In <a onClick="return mV(\'Luk\',8,3);">Lu 8:3</a> we read that his wife Joanna, "and Susanna, and many others," ministered to Christ and His disciples.`<a href="./study/isbe/search.html?string=JOANNA">JOANNA</a>`1';
isbe[2110]='Ciccar`sik\'-ar (kikkar, "circle"): Used of the circle of the Jordan (<a onClick="return mV(\'Gen\',13,10);">Ge 13:10</a>, Hebrew).`<a href="./study/isbe/search.html?string=PLAIN">PLAIN</a>; <a href="./study/isbe/search.html?string=CITIES+OF+THE+PLAIN">CITIES OF THE PLAIN</a>`1';

isbe[2112]='Cilicia`si-lish\'-i-a (he Kilikia): An important province at the southeast angle of Asia Minor, corresponding nearly with the modern Turkish vilayet of Adana; enfolded between the Taurus mountains and the Mediterranean Sea, with the Amanus range on the east and Pamphylia on the west; chief rivers, the Pyramus, Sarus, Cydnus and Calycadnus. The character of Cilician history has been largely determined by the physical features of the province. It is divided by nature into a mountainous part to the west, called Tracheia, and a broad, alluvial plain, hot and fertile, toward the east, termed Campestris or Pedias. Cilicia has always been isolated from its neighbors by land by its encircling mountains, save for its two famous mountain passes, the "Syrian Gates," which offer an easy road to Antioch and the south, and the wonderful "Cilician Gates," which open a road to central and western Asia Minor. Through these passes the armies and the pilgrims, the trade and the travel of the centuries have made their way. Alexander was one of the most renowned leaders of such expeditions, and at Issus he met and shattered the power of the Persian empire.<P>The early settlers of Cilicia are held to have been Semitic Syrians and Phoenicians, but in the still earlier days the inhabitants must have been Hittites. While few Hittite remains have been brought to light in Cilicia proper, the province was so surrounded by Hittites, and such important works of Hittite art and industry remain on the outskirts of the province, as at Ivriz, Marash, Sinjirli and Sakche Geuzi, that the intervening territory could hardly fail to be overspread with the same civilization and imperial power. See Professor John Garstang\'s The Land of the Hittites.<P>Cilicia appears as independent under Syennesis, a contemporary of Alyattes of Lydia, 610 BC. Later it passed under the Persian sway, but retained its separate line of kings. After Alexander the Seleucid rulers governed Cilicia from Antioch. The disturbances of the times enabled the pirates so to multiply and establish themselves in their home base, in Cilicia, Tracheia, that they became the scourge of the Mediterranean until their power was broken by Pompey (67-66 BC). Cilicia was by degrees incorporated in the Roman administration, and Cicero, the orator, was governor (51-50 BC).<P>The foremost citizen of the province was Saul of Tarsus (<a onClick="return mV(\'Act\',21,39);">Ac 21:39</a>; <a onClick="return mV(\'Act\',22,3);">22:3</a>; <a onClick="return mV(\'Act\',23,34);">23:34</a>). Students or pilgrims from Cilicia like himself disputed with Stephen (<a onClick="return mV(\'Act\',6,9);">Ac 6:9</a>). Some of the earliest labors of the great apostle were near his home, in Syria and Cilicia (<a onClick="return mV(\'Gal\',1,21);">Ga 1:21</a>; <a onClick="return mV(\'Act\',15,23,41);">Ac 15:23, 41</a>). On his voyage to Rome he sailed across the sea which is off Cilicia (<a onClick="return mV(\'Act\',27,5);">Ac 27:5</a>). Constantinople and Antioch may be regarded as the front and back door of Asia Minor, and as the former was not founded till the 4th century, Asia Minor may be regarded as fronting during apostolic days on Antioch. Cilicia was intimately connected with its neighbor province on the south. The first Christian apostles and evangelists followed the great highways, through the famous mountain passes, and carried the religion of Jesus to Asia Minor from Antioch as a base.<P>Armenians migrating from the north founded kingdom in Cilicia under Roupen which was terminated by the overthrow of King Levon, or Leo, by the conquering Turks in 1393. A remnant of this kingdom survives in the separate Armenian catholicate of Sis, which has jurisdiction over few bishoprics, and Armenians are among the most virile of the present inhabitants of the province.``191';
isbe[2113]='Cinnamon`sin\'-a-mun (qinnamon; kinnamomon): Mentioned, like cassia, as a perfume. In <a onClick="return mV(\'Exd\',30,23);">Ex 30:23</a> it is one of the ingredients of the "holy anointing oil"; in <a onClick="return mV(\'Pro\',7,17);">Pr 7:17</a> it is, along with myrrh and aloes, a perfume for a bed; in <a onClick="return mV(\'Sgs\',4,14);">So 4:14</a> it is a very precious spice. Cinnamon is (<a onClick="return mV(\'Rev\',18,13);">Re 18:13</a>) part of the merchandise of "Babylon the great."<P>Cinnamon is the product of Cinnamomum zeylanicum, a laurel-like plant widely cultivated in Ceylon and Java. It has a profuse white blossom, succeeded by a nut from which the fragrant oil is obtained. The wood is the inner bark from branches which have reached a diameter of from 2 to 3 inches; the epidermis and pulpy matter are carefully scraped off before drying. In commerce the cheaper Cassia ligra of China is sometimes substituted for true cinnamon, and it is thought by some authorities that this was the true cinnamon of the ancients.`<a href="./study/isbe/search.html?string=CASSIA">CASSIA</a>`117';

isbe[2115]='Cirama`si-ra\'-ma, sir\'-a-ma.`<a href="./study/isbe/search.html?string=KIRAMA">KIRAMA</a>`1';
isbe[2116]='Circle`sur\'-k\'-l: Is used with reference to the vault of the heavens (hugh) in <a onClick="return mV(\'Isa\',40,22);">Isa 40:22</a>, and in a similar sense in The <span class="noTag">Wisdom of Solomon 13:2</span> (Revised Version margin), "circle of stars" (kuklos astron). It is also used in the sense of surrounding territory, as in the expression "circle of Jordan" (<a onClick="return mV(\'Gen\',13,10);">Ge 13:10</a> the Revised Version, margin).`<a href="./study/isbe/search.html?string=CICCAR">CICCAR</a>; <a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>`1';
isbe[2117]='Circuit`sur\'-kit, "a going around": Used to represent several Hebrew words in several senses, e.g. the sun\'s orbit (tequphah), <a onClick="return mV(\'Psa\',19,6);">Ps 19:6</a>; the vault of the heavens (chugh), <a onClick="return mV(\'Job\',22,14);">Job 22:14</a> the King James Version; the circuit of the winds (cabhibh), <a onClick="return mV(\'Ecc\',1,6);">Ec 1:6</a> (see <a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>); Samuel\'s visiting of communities (cabhabh), <a onClick="return mV(\'1Sa\',7,16);">1Sa 7:16</a>. In the Revised Version (British and American) the idea of encircling or "fetching a compass" (the King James Version) is expressed by the phrase "to make a circuit" (hacebh), <a onClick="return mV(\'2Sa\',5,23);">2Sa 5:23</a>; <a onClick="return mV(\'2Ki\',3,9);">2Ki 3:9</a>; and in the Revised Version, margin it indicates a plain (ha-kikkar), <a onClick="return mV(\'Neh\',3,22);">Ne 3:22</a>. The Greek perielthontes is translated in the same way (<a onClick="return mV(\'Act\',28,13);">Ac 28:13</a>), but the Revised Version, margin reads "cast loose," following the Westcott and Hort, The New Testament in Greek reading perielontes.``81';
isbe[2118]='Circumcision`sur-kum-sizh\'-un (mul, muloth; peritome): The removal of the foreskin is a custom that has prevailed, and prevails, among many races in different parts of the world—in America, Africa and Australia. It was in vogue among the western Semites—Hebrews, Arabians, Moabites, Ammonites, Edomites, Egyptians, but was unknown among the Semites of the Euphrates. In Canaan the Philistines were an exception, for the term "uncircumcised" is constantly used in connection with them. Generally speaking, the rite of circumcision was a precondition of the enjoyment of certain political and religious privileges (<a onClick="return mV(\'Exd\',12,48);">Ex 12:48</a>; <a onClick="return mV(\'Eze\',44,9);">Eze 44:9</a>); and in view of the fact that in the ancient world religion played such an important role in life, it may be assumed that circumcision, like many other strange customs whose original significance is no longer known, originated in connection with religion. Before enumerating the different theories which have been advanced with regard to the origin and original significance of circumcision, it may be of advantage to consider some of the principal references to the rite in the Old Testament.<P>1. Circumcision in the Old Testament:<P>In the account of the institution of the covenant between Yahweh and Abraham which Priestly Code (P) gives (<a onClick="return mV(\'Gen\',17,\'1-\');">Ge 17</a>), circumcision is looked upon as the ratification of the agreement. Yahweh undertook to be the God of Abraham and of his descendants. Abraham was to be the father of a multitude of nations and the founder of a line of kings. He and his descendants were to inherit Canaan. The agreement thus formed was permanent; Abraham\'s posterity should come within the scope of it. But it was necessary to inclusion in the covenant that every male child should be circumcised on the 8th day. A foreigner who had attached himself as a slave to a Hebrew household had to undergo the rite—the punishment for its non-fulfilment being death or perhaps excommunication. According to <a onClick="return mV(\'Exd\',12,48);">Ex 12:48</a> (also P) no stranger could take part in the celebration of the Passover unless he had been circumcised. In the Book of Joshua (<a onClick="return mV(\'Jos\',5,\'2-9\');">Jos 5:2-9</a>) we read that the Israelites were circumcised at Gilgal ("Rolling"), and thus the "reproach of Egypt" was "rolled away." Apparently circumcision in the case of the Hebrews was prohibited during the Egyptian period—circumcision being a distinctive mark of the ruling race. It is noticeable that flint knives were used for the purpose. This use of an obsolete instrument is one of many proofs of conservatism in religion. According to the strange and obscure account of the circumcision by Zipporah of her eldest son (<a onClick="return mV(\'Exd\',4,25);">Ex 4:25</a>) the performance of the rite in the case of the son apparently possesses a vicarious value, for thereby Moses becomes a "bridegroom of blood." The marriage bond is ratified by the rite of blood (see 4 below). But it is possible that the author\'s meaning is that owing to the fact that Moses had not been circumcised (the "reproach of Egypt") he was not fit to enter the matrimonial estate (see 3 below).<P>2. Theories of Origin:<P>The different theories with regard to the origin of circumcision may be arranged under four heads:<P>(1) Herodotus (ii.37), in dealing with circumcision among the Egyptians, suggests that it was a sanitary operation. But all suggestions of a secular, i.e. non-religious, origin to the rite, fail to do justice to the place and importance of religion in the life of primitive man.<P>(2) It was a tribal mark. Tattooed marks frequently answered the purpose, although they may have been originally charms. The tribal mark enabled one member of the tribe to recognize another and thus avoid injuring or slaying a fellow-tribesman. It also enabled the tribal deity to recognize a member of the tribe which was under his special protection. A mark was placed on Cain to indicate that he was under the special protection of Yahweh (<a onClick="return mV(\'Gen\',4,15);">Ge 4:15</a>). It has been suggested, in the light of <a onClick="return mV(\'Isa\',44,5);">Isa 44:5</a> the Revised Version, margin, that the employer\'s mark was engraved (tattooed) on the slave\'s hand. The prophet represents Jews as inscribing on their hands that they belong to Yahweh. The walls of Jerusalem are engraved on Yahweh\'s palms (<a onClick="return mV(\'Isa\',49,16);">Isa 49:16</a>). On the other hand "cuttings in the flesh" are prohibited in <a onClick="return mV(\'Lev\',19,28);">Le 19:28</a> because they were common in the case of the non-Jewish religions. Such tattooed marks might be made in conspicuous places when it was necessary that they should be easily seen, but there might be reason for secrecy so that the marks might be known only to the members of the tribe in question.<P>(3) It was a rite which celebrated the coming of age of the person. It signified the attainment of puberty and of the right to marry and to enjoy full civic privileges.<P>(4) As human sacrifices began to be done away with, the sacrifice of the most easily removed portion of the anatomy provided a vicarious offering.<P>(5) It was a sacramental operation. "The shedding of blood" was necessary to the validity of any covenant between tribes or individuals. The rite of blood signifies the exchange of blood on the part of the contracting parties, and therefore the establishment of physical affinity between them. An alliance based on blood-relationship was inviolable. In the same way the tribal god was supposed to share in the blood of the sacrificed animal, and a sacred bond was established between him and the tribe. It is not quite obvious why circumcision should be necessary in connection with such a ceremony. But it may be pointed out that the process of generation excited the wonder and awe of primitive man. The prosperity of the tribe depended on the successful issue of the marriage bond, and a part of the body which had so much to do with the continuation and numerical strength of the tribe would naturally be fixed upon in connection with the covenant of blood. In confirmation of the last explanation it is urged that in the case of the covenant between Yahweh and Abraham circumcision was the rite that ratified the agreement. In opposition to (3) it has been urged that among the Hebrews circumcision was performed in infancy—when the child was 8 days old. But this might have been an innovation among the Hebrews, due to ignorance of the original significance of the rite. If circumcision conferred upon the person circumcised the right to the enjoyment of the blessings connected with membership in the tribe it was natural that parents should be anxious that such an initiatory act should be performed early in life. The question of adult and infant baptism is capable of similar explanation. When we examine explanations (2), (3), (4), (5), we find that they are really different forms of the same theory. There can be no doubt that circumcision was originally a religions act. Membership in the tribe, entrance upon the rights of citizenship, participation in the religious practices of the tribe—these privileges are interdependent. Anyone who had experienced the rite of blood stood within the scope of the covenant which existed between the tribe and the tribal god, and enjoyed all the privileges of tribal society. It is easily understood why the historian carefully relates the circumcision of the Israelites by Joshua on their arrival in Canaan. It was necessary, in view of the possible intermingling of the conquerors and the conquered, that the distinctive marks of the Abrahamic covenant should be preserved (<a onClick="return mV(\'Jos\',5,3);">Jos 5:3</a>).<P>3. Spiritual Significance:<P>In <a onClick="return mV(\'Jer\',9,25);">Jer 9:25</a> and <a onClick="return mV(\'Deu\',30,6);">De 30:6</a> we find the spiritual significance of circumcision. A prophet like Jeremiah was not likely to attach much importance to an external act like circumcision. He bluntly tells his countrymen that they are no better than Egyptians, Edomites, Moabites and Ammonites. They are uncircumcised in heart. Paul uses the term concision for this outward circumcision unaccompanied by any spiritual change (<a onClick="return mV(\'Phl\',3,2);">Php 3:2</a>). The question of circumcision occasioned a protracted strife among the early Christians. Judaizing Christians argued for the necessity of circumcision. It was a reminiscence of the unrelenting particularism which had sprung up during the prolonged oppression of the Greek and Roman period. According to their view salvation was of the Jews and for the Jews. It was necessary to become a Jew in order to become a Christian. Paul consented to circumcision in the case of Timothy "because of the Jews" (<a onClick="return mV(\'Act\',16,3);">Ac 16:3</a>). But he saw that a principle was at stake and in most of his epistles he points out the sheer futility of the contention of the Judaizers. (See commentaries on Romans and Galatians.)<P>4. Figurative Uses:<P>In a few suggestive passages we find a figurative application of the term. For three years after the settlement in Canaan the "fruit of the land" was to be considered as "uncircumcised" (<a onClick="return mV(\'Lev\',19,23);">Le 19:23</a>), i.e. it was the property of the Baalim, the gods of Palestine The fruit of the fourth year belonged to Yahweh. Moses with characteristic humility describes himself as a man of "uncircumcised lips" (<a onClick="return mV(\'Exd\',6,30);">Ex 6:30</a>). Jeremiah charges his contemporaries with having their ear uncircumcised (<a onClick="return mV(\'Jer\',6,10);">Jer 6:10</a>) and their heart (<a onClick="return mV(\'Jer\',9,26);">Jer 9:26</a>). "An uncircumcised heart" is one which is, as it were, closed in, and so impervious to good influences and good impressions, just as an uncircumcised ear (<a onClick="return mV(\'Jer\',6,10);">Jer 6:10</a>) is an ear which, from the same cause, hears imperfectly; and uncircumcised lips (compare <a onClick="return mV(\'Exd\',6,12,30);">Ex 6:12, 30</a>) are lips which open and speak with difficulty (Driver on <a onClick="return mV(\'Deu\',10,16);">De 10:16</a>).``103';
isbe[2119]='Cis`sis (Keis): The form given in <a onClick="return mV(\'Act\',13,21);">Ac 13:21</a> the King James Version for Kish, the father of Saul the first king of Israel (<a onClick="return mV(\'1Sa\',9,1);">1Sa 9:1</a>f).``1';
isbe[2120]='Cisai`si\'-sa-i.`<a href="./study/isbe/search.html?string=KISEUS">KISEUS</a>`1';
isbe[2121]='Cistern; Well; Pool; Aqueduct`sis\'-tern:<P>Use of Terms<P>1. General<P>2. Wells or Cylindrical Cisterns<P>3. Private Cisterns<P>4. Public Cisterns<P>5. Pools and Aqueducts<P>6. Figurative Uses<P>LITERATURE<hr /><P>Several words are rendered by "cistern," "well," "pool," the relations of which in the King James Version and the Revised Version (British and American) are as follows:<P>Use of Terms:<P>"Cistern," bo\'r (<a onClick="return mV(\'Jer\',2,13);">Jer 2:13</a>, etc.), or bor (<a onClick="return mV(\'2Ki\',18,31);">2Ki 18:31</a>). The latter word is frequently in the King James Version translated "well." the Revised Version (British and American) in these cases changes to "cistern" in text (<a onClick="return mV(\'Deu\',6,11);">De 6:11</a>; <a onClick="return mV(\'2Ch\',26,10);">2Ch 26:10</a>; <a onClick="return mV(\'Neh\',9,25);">Ne 9:25</a>) margin (<a onClick="return mV(\'Jer\',14,3);">Jer 14:3</a>), rendered "pit" in the King James Version are changed to "cistern" the Revised Version (British and American) (the latter in the American Standard Revised Version only).<P>The proper Hebrew word for "well" is be\'er (seen in Beer-sheba, "well of the oath," <a onClick="return mV(\'Gen\',21,31);">Ge 21:31</a>), but other terms are thus rendered in the King James Version, as \'ayin (<a onClick="return mV(\'Gen\',24,13,16);">Ge 24:13, 16</a>, etc., and frequently), ma\'yan (<a onClick="return mV(\'Jos\',18,15);">Jos 18:15</a>), maqor (<a onClick="return mV(\'Pro\',10,11);">Pr 10:11</a>). ally changes to "fountain"; in <a onClick="return mV(\'Exd\',15,27);">Ex 15:27</a>, however, it renders \'ayin by "springs," and in <a onClick="return mV(\'Psa\',84,6);">Ps 84:6</a>, ma\'yan by, "place of springs." "Pool," \'agham (<a onClick="return mV(\'Isa\',14,23);">Isa 14:23</a>, etc.; in the King James Version, <a onClick="return mV(\'Exd\',7,19);">Ex 7:19</a>; <a onClick="return mV(\'Exd\',8,5);">8:5</a>, rendered "ponds"); more frequently berekhah (<a onClick="return mV(\'2Sa\',2,13);">2Sa 2:13</a>; <a onClick="return mV(\'2Sa\',4,12);">4:12</a>, etc.). In <a onClick="return mV(\'Psa\',84,6);">Ps 84:6</a> the cognate berakhah, is changed to "blessing."<P>In the New Testament "well" represents the two words: pege (<a onClick="return mV(\'Jhn\',4,6,14);">Joh 4:6, 14</a>; in the Revised Version, margin "spring"; <a onClick="return mV(\'2Pe\',2,17);">2Pe 2:17</a>; the Revised Version (British and American) renders "springs"), and phrear (<a onClick="return mV(\'Jhn\',4,11,12);">Joh 4:11-12</a>). "Pool" is kolumbethra, in <a onClick="return mV(\'Jhn\',5,2,4,7);">Joh 5:2, 4, 7</a>; <a onClick="return mV(\'Jhn\',9,7,11);">9:7, 11</a>.<P>1. General:<P>The efforts made to supplement the natural water supply, both in agricultural and in populated areas, before as well as after the Conquest, are clearly seen in the innumerable cisterns, wells and pools which abound throughout Palestine The rainy season, upon which the various storage systems depend, commences at the end of October and ends in the beginning of May. In Jerusalem, the mean rainfall in 41 years up to 1901 was 25,81 inches, falling in a mean number of 56 days (see Glaisher, Meteorological Observations, 24). Toward the end of summer, springs and wells, where they have not actually dried up, diminish very considerably, and cisterns and open reservoirs become at times the only sources of supply. Cisterns are fed from surface and roof drainage. Except in the rare instances where springs occur, wells depend upon percolation. The\' great open reservoirs or pools are fed from surface drainage and, in some cases, by aqueducts from springs or from more distant collecting pools. In the case of private cisterns, it is the custom of the country today to close up the inlets during the early days of the rain, so as to permit of a general wash down of gathering surfaces, before admitting the water. Cisterns, belonging to the common natives, are rarely cleansed, and the inevitable scum which collects is dispersed by plunging the pitcher several times before drawing water. When the water is considered to be bad, a somewhat primitive cure is applied by dropping earth into the cistern, so as to sink all impurities with it, to the bottom. The accumulation often found in ancient cisterns probably owes some of its presence to this same habit.<P>2. Wells or Cylindrical Cisterns:<P>It is necessary to include wells under the head of cisterns, as there appears to be some confusion in the use of the two terms. Wells, so called, were more often deep cylindrical reservoirs, the lower part of which was sunk in the rock and cemented, the upper part being built with open joints, to receive the surface percolation. They were often of great depth. Job\'s well at Jerusalem, which is certainly of great antiquity, is 125 ft. deep (see Palestine Exploration Fund, "Jerus," 371).<P>The discovery of "living water" when digging a well, recorded in <a onClick="return mV(\'Gen\',26,19);">Ge 26:19</a> margin, appears to have been an unusual incident. Uzziah hewed out many cisterns in the valley for his cattle (<a onClick="return mV(\'2Ch\',26,9,10);">2Ch 26:9-10</a> the Revised Version (British and American)), and he built towers, presumably to keep watch over both cattle and cisterns. Isaac "digged again the wells" which had been filled in by the Philistines (<a onClick="return mV(\'Gen\',26,18);">Ge 26:18</a>). Wells were frequently dug in the plain, far from villages, for flocks and herds, and rude stone troughs were provided nearby. The well was usually covered with a stone, through which a hole was pierced sufficiently large to allow of free access for the pitchers. A stone was placed over this hole (<a onClick="return mV(\'Gen\',29,10);">Ge 29:10</a>) when the well was not in use. The great amount of pottery found in ancient cisterns suggests that clay pots were used for drawing water (see Bible Sidelights, 88). Josephus (Ant., IV, viii, 37) elucidates the passage in <a onClick="return mV(\'Exd\',21,33);">Ex 21:33</a> requiring the mouth of a "pit" or "well" to be covered with planks against accidents. This would seem to apply to wide-mouthed wells which had not been narrowed over to receive a stone cover. It may have been a well or cistern similar to these into which Joseph was cast (<a onClick="return mV(\'Gen\',37,24);">Ge 37:24</a>). In fact, dry-wells and cisterns formed such effective dungeons, that it is very probable they were often used for purposes of detention. From earliest times, wells have been the cause of much strife. The covenant between Abimelech and Abraham at Beersheba (<a onClick="return mV(\'Gen\',32,\'1-\');">Ge 32</a>) was a necessity, no less pressing then than it is now. The well, today, is a center of life in the East. Women gather around it in pursuit of their daily duties, and travelers, man and beast, divert their course thereto, if needs be, for refreshment; and news of the outer world is carried to and from the well. It is, in fact, an all-important center, and daily presents a series of characteristic Bible scenes. The scene between Rebekah and the servant of Abraham (<a onClick="return mV(\'Gen\',24,11);">Ge 24:11</a>ff) is one with frequent parallels. The well lies usually at some little distance from the village or city. Abraham\'s servant made his "camels to kneel down without the city by the well of water at the time of the evening, the time that women go out to draw water." Saul and his servant found young maidens going out of the city to draw water (<a onClick="return mV(\'1Sa\',9,11);">1Sa 9:11</a>). Moses helped the daughters of the priest of Midian at the well, which was evidently at some distance from habitation (<a onClick="return mV(\'Exd\',2,16);">Ex 2:16</a>ff).<P>3. Private Cisterns:<P>Private cisterns must be distinguished from public cisterns or wells. They were smaller and were sunk in the rocks within private boundaries, each owner having his own cistern (<a onClick="return mV(\'2Ki\',18,31);">2Ki 18:31</a>; <a onClick="return mV(\'Pro\',5,15);">Pr 5:15</a>). Ancient sites are honeycombed with these cisterns. A common type in Jerusalem seems to have been bottle-shaped in section, the extended bottom part being in the softer rock, and the narrow neck in the hard upper stratum. Many irregularly shaped cisterns occur with rock vaults supported by rock or masonry piers. Macalister tells of the discovery at Gezer of a small silt catchpit attached to a private cistern, and provided with an overflow channel leading to the cistern. It is an early instance of a now well-known method of purification. The universal use of cement rendering to the walls of the cisterns was most necessary to seal up the fissures of the rock. The "broken cisterns" (<a onClick="return mV(\'Jer\',2,13);">Jer 2:13</a>) probably refer to insufficiently sealed cisterns.<P>4. Public Cisterns:<P>Besides private cisterns there were huge public rock-cut cisterns within the city walls. The great water caverns under the Temple area at Jerusalem show a most extensive system of water storage (see Recovery of Jerusalem, chapter vii). There are 37 of these described in Palestine Exploration Fund, "Jerus," 217ff, and the greatest is an immense rock-cut cavern the roof of which is partly rock and partly stone, supported by rock piers (see Fig. 1, Palestine Exploration Fund). It <span clas="noTag">is</span> 43 ft. deep with a storage capacity of over two million gallons and there are numerous access manholes. This cistern is fed by an aqueduct from Solomon\'s Pools about 10 miles distant by road, and is locally known as Bahar el Kebir, the "Great Sea." One of the most recent and one of the most interesting rock-cut reservoirs yet discovered is that at Gezer. (See Palestine Exploration Fund Statement, 1908, 96ff.) In this example, the pool of spring water is reached by a great rock-tunnel staircase which descends 94 ft. 6 inches from the surface. The staircase diminishes in size as it descends, and at its greatest, it <span clas="noTag">is</span> 23 ft. high and 12 ft. 10 inches wide. These proportions may seem unnecessarily large, but may be accounted for by the necessity for providing light at the water level. As a matter of fact, the brink of the pool receives the light from above. The work dates back to pre-Israelite times.<P>5. Pools and Aqueducts:<P>Open pools were common in every city. They were cut out of the rock and were built and cemented at points where occasion demanded. They were often of great size. The pool outside Jerusalem known as Birket es Sultan measures 555 ft. x 220 ft. x 36 ft. deep, and the so-called Hezekiah\'s Pool within the walls, is 240 ft. x 144 ft. x about 20 ft. deep. The latter probably owes its origin to the rock-cut fosse of early Jewish date. The Birket es Sultan, on the other hand, probably dates from the time of the Turkish occupation. They may, however, be taken as examples, which, if somewhat larger, are still in accord with the pool system of earlier history. Pools were usually fed by surface drainage, and in some cases by aqueducts from springs at some distance away. They seem to have been at the public service, freely accessible to both man and beast. Pools situated outside the city walls were sometimes connected by aqueducts with pools within the city, so that the water could be drawn within the walls in time of siege. The so-called Pools of Solomon, three in number (see Fig. 3), situated about 10 miles by road from Jerusalem, are of large proportions and are fed by surface water and by aqueducts from springs. The water from these pools is conveyed in a wonderfully engineered course, known as the lower-level aqueduct, which searches the winding contours of the Judean hills for a distance of about 15 miles, before reaching its destination in "the great sea" under the Temple area. This aqueduct is still in use, but its date is uncertain (see G. A. Smith, Jerusalem, 131, where the author finds reason for ascribing it to the period of Herod). The course and destination of another aqueduct known as the high-level aqueduct is less definite. These aqueducts are of varying dimensions. The low-level aqueduct at a point just before it enters the Temple area was found to measure 3 ft. high x 2 ft. 3 inches wide, partly rock-cut and partly built, and rendered in smooth-troweled cement, with well-squared stone covers (see Palestine Exploration Fund, Excavations at Jerusalem, 53ff). There are many remains of rock-cut aqueducts throughout Palestine (see Fig. 4) which seem to indicate their use in early Hebrew times, but the lack of Old Testament references to these works is difficult to account for, unless it is argued that in some cases they date back to pre-Israelite times. The great tunnel and pool at Gezer lends a measure of support to this hypothesis. On the other hand, a plea for a Hebrew origin is also in a measure strengthened by the very slight reference in the Old Testament to such a great engineering feat as the cutting of the Siloam tunnel, which is doubtless the work of Hezekiah. The pool of Siloam was originally a simple rock-cut reservoir within the walls, and was constructed by Hezekiah (<a onClick="return mV(\'2Ch\',32,30);">2Ch 32:30</a>). It measures 75 ft. x 71 ft. It is the upper pool of <a onClick="return mV(\'Isa\',7,3);">Isa 7:3</a>. A lower overflow pool existed immediately beyond, contained by the city wall across the Tyropoeon valley. The aqueduct which supplies the upper pool takes a tortuous course of about 1,700 ft. through the solid rock from the Virgin\'s fountain, an intermittent spring on the east slope of the hill. The water reaches the pool on the southwest of the spur of Ophel, and it was in the rock walls of this aqueduct that the famous Siloam inscription recording the completion of the work was discovered.<P>Herod embellished the upper pool, lining it with stone and building arches around its four sides (see Palestine Exploration Fund, Excavations at Jerusalem, 154ff), and the pool was most likely in this condition in the time of Christ (<a onClick="return mV(\'Jhn\',9,6,7);">Joh 9:6-7</a>). There are numerous other pools, cisterns and aqueducts in and around Jerusalem, which provide abundant evidence of the continual struggle after water, made by its occupants of all times (see G. A. Smith, Jerusalem, chapter v, volume I).<P>See also <a href="./study/isbe/search.html?string=PIT">PIT</a>; <a href="./study/isbe/search.html?string=WELL">WELL</a>, etc.<P>6. Figurative Uses:<P>Good wives are described as cisterns (<a onClick="return mV(\'Pro\',5,15);">Pr 5:15</a>ff). "The left ventricle of the heart, which retains the blood till it be redispersed through the body, is called a cistern" (<a onClick="return mV(\'Ecc\',12,6);">Ec 12:6</a>). Idols, armies and material objects in which Israel trusted were "broken cisterns" (<a onClick="return mV(\'Jer\',2,13);">Jer 2:13</a>, see above) "soon emptied of all the aid and comfort which they possess, and cannot fill themselves again."<P>LITERATURE.<P>G. A. Smith, Jerusalem; Palestine Exploration Fund Memoirs, Jerusalem vol; Wilson, The Recovery of Jerusalem; Macalister, Bible Sidelights; Palestine Exploration Fund Statement; Bliss and Dickie, Excavations at Jerusalem; Josephus.``39';

isbe[2123]='Cithern`sith\'-ern (kithara; 1Macc 4:54 the King James Version, kitharais kai kinurais is translated "citherns and harps"; the Revised Version (British and American) "harps and lutes"; compare guitar, zither): As 1Macc was originally written in Hebrew, it is natural to suppose that these two Greek words stand for Hebrew nebhalim and kinnoroth; but to this it may be objected that kithara and kinura are not used elsewhere together to represent two different instruments. On the contrary we have either kinura kai nabla or kithara kai psalterion. The most probable explanation of the unusual collocation of these two words in 1Maccabees is that kithara was a gloss meant to explain the obsolescent kinura.`<a href="./study/isbe/search.html?string=MUSIC">MUSIC</a>`120';
