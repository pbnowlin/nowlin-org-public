isbe[9061]='Vampire`vam\'-pir (alaqah): the Revised Version margin for "horseleach" (<a onClick="return mV(\'Pro\',30,15);">Pr 30:15</a>) has "vampire."`<a href="./study/isbe/search.html?string=HORSELEACH">HORSELEACH</a>`1';
isbe[9062]='Vaniah`va-ni\'-a (wanyah, meaning unknown): A son of Bani, who had married a foreign wife (<a onClick="return mV(\'Ezr\',10,36);">Ezr 10:36</a>). The text is, however, doubtful. The Septuagint Codex Vaticanus has Ouiechoa; Codex Sinaiticus Ouierecho; Codex Alexandrinus Ouounia, Lucian Ouania.``1';
isbe[9063]='Vanity, Vanities`van\'-i-ti, van\'-i-tiz (hebhel, \'awen, shaw\'; kenos; mataiotes): The words "vain," "vanity," "vanities" are frequent in the Bible. Their idea is almost exclusively that of "evanescence," "emptiness," including "idolatry" and "wickedness" as being not only evil but vain and empty things. They also signify falseness. The chief word translated "vanity," "vanities" is hebhel, a "breath of air, or of the mouth," often applied to idolatry (<a onClick="return mV(\'Deu\',32,21);">De 32:21</a>; <a onClick="return mV(\'1Ki\',16,13);">1Ki 16:13</a>; <a onClick="return mV(\'Psa\',31,6);">Ps 31:6</a>; <a onClick="return mV(\'Jer\',8,19);">Jer 8:19</a>, etc.); to man\'s days and to man himself (<a onClick="return mV(\'Job\',7,16);">Job 7:16</a>; <a onClick="return mV(\'Psa\',39,5,11);">Ps 39:5,11</a>, etc.); to man\'s thoughts (<a onClick="return mV(\'Psa\',94,11);">Ps 94:11</a>); to wealth and treasures (<a onClick="return mV(\'Pro\',13,11);">Pr 13:11</a>; <a onClick="return mV(\'Pro\',21,6);">21:6</a>); to everything, in Ecclesiastes, where the word occurs frequently in various applications: "Vanity of vanities, all is vanity" (<a onClick="return mV(\'Ecc\',1,2);">Ec 1:2</a>; <a onClick="return mV(\'Ecc\',12,8);">12:8</a>). Hebhel is also the name of Adam\'s second son (<a onClick="return mV(\'Gen\',4,2);">Ge 4:2</a>). \'Awen, meaning also "breath," is likewise translated "vanity" in similar connections, but it inclines more to "iniquity" (so often rendered); it is joined with mischief and iniquity (<a onClick="return mV(\'Isa\',41,29);">Isa 41:29</a>; <a onClick="return mV(\'Isa\',58,9);">58:9</a>; <a onClick="return mV(\'Zec\',10,2);">Zec 10:2</a>); another frequent word is shaw\', having also the idea of "falsity,...wickedness" (<a onClick="return mV(\'Exd\',20,7);">Ex 20:7</a>; <a onClick="return mV(\'Deu\',5,11);">De 5:11</a>; <a onClick="return mV(\'Psa\',31,6);">Ps 31:6</a>, etc.).<P>"Vanity" does not often occur in the New Testament; but see <a href="./study/isbe/search.html?string=VAIN">VAIN</A>, <a href="./study/isbe/search.html?string=VAINGLORY">VAINGLORY</a>. In <a onClick="return mV(\'Act\',14,15);">Ac 14:15</a> we have mataios, "empty," translated "vanities" (of idols); mataiotes, "emptiness," "transitoriness" (<a onClick="return mV(\'Rom\',8,20);">Ro 8:20</a>, "The creation was subjected to vanity," frailty, transitoriness); "emptiness," "folly" (<a onClick="return mV(\'Eph\',4,17);">Eph 4:17</a>; <a onClick="return mV(\'2Pe\',2,18);">2Pe 2:18</a>).<P>Among other changes for "vanity" the Revised Version (British and American) has "iniquity" (<a onClick="return mV(\'Job\',15,35);">Job 15:35</a>; <a onClick="return mV(\'Psa\',10,7);">Ps 10:7</a>); "falsehood" (<a onClick="return mV(\'Psa\',12,2);">Ps 12:2</a>; <a onClick="return mV(\'Psa\',41,6);">41:6</a>); "deceit" (<a onClick="return mV(\'Psa\',144,8,11);">Ps 144:8,11</a>); "vapor" (<a onClick="return mV(\'Pro\',21,6);">Pr 21:6</a>); "calamity" (<a onClick="return mV(\'Pro\',22,8);">Pr 22:8</a> margin "vanity"); "a breath" (<a onClick="return mV(\'Isa\',57,13);">Isa 57:13</a>); "wickedly" (<a onClick="return mV(\'Isa\',58,9);">Isa 58:9</a>). Conversely, for "Wherefore hast thou made all men in vain?" (<a onClick="return mV(\'Psa\',89,47);">Ps 89:47</a>), "For what vanity hast thou created all the children of men!"; for "Behold, they are all vanity; their works are nothing" (<a onClick="return mV(\'Isa\',41,29);">Isa 41:29</a>), "Behold, all of them, their works are vanity and nought," margin as the King James Version, with "nought" for "nothing."``185';
isbe[9064]='Vapor`va\'-per:<P>(1) edh: "For he draweth up the drops of water, which distill in rain from his vapor" (<a onClick="return mV(\'Job\',36,27);">Job 36:27</a>); "There went up a mist [\'edh] from the earth, and watered the whole face of the ground" (<a onClick="return mV(\'Gen\',2,6);">Ge 2:6</a>).<P>(2) nasi\', "vapor," i.e. that which rises, from nasa\', "to lift": "Who causeth the vapors to ascend from the ends of the earth" (<a onClick="return mV(\'Psa\',135,7);">Ps 135:7</a>; compare <a onClick="return mV(\'Jer\',10,13);">Jer 10:13</a>; <a onClick="return mV(\'Jer\',51,16);">51:16</a>); also translated "clouds": "as clouds and wind without rain" (<a onClick="return mV(\'Pro\',25,14);">Pr 25:14</a>).<P>(3) In <a onClick="return mV(\'Job\',36,33);">Job 36:33</a>, the King James Version has "vapour" ("concerning the vapour") for \'alah, alah, "to go up," where the Revised Version (British and American) reads "concerning the storm that cometh up."<P>(4) qitor: "fire and hail, snow and vapor" (<a onClick="return mV(\'Psa\',148,8);">Ps 148:8</a>); elsewhere, "smoke": "The smoke of the land went up as the smoke of a furnace" (<a onClick="return mV(\'Gen\',19,28);">Ge 19:28</a>); "I am become like a wineskin in the smoke" (<a onClick="return mV(\'Psa\',119,83);">Ps 119:83</a>).<P>(5) atmis: "blood, and fire, and vapor of smoke" (<a onClick="return mV(\'Act\',2,19);">Ac 2:19</a>); "For ye are a vapor that appeareth for a little time, and then vanisheth away" (<a onClick="return mV(\'Jam\',4,14);">Jas 4:14</a>).<P>The first two of the preceding quotations are interesting as indicating the knowledge that vapor of water from the earth or sea is the source of the rain. Visible vapor, i.e. mist or fog, is much less common in Palestine than in many other countries. In the mountains, however, especially in Lebanon, mists are of frequent occurrence, appearing to those below as clouds clinging to the mountains.``37';
isbe[9065]='Vashni`vash\'-ni (washni, see below; the Septuagint\'s Codex Vaticanus Sanei; Codex Alexandrinus Sani): Read in <a onClick="return mV(\'1Ch\',6,28);">1Ch 6:28</a> the King James Version (Hebrew 13) as the name of the firstborn son of Samuel. According to <a onClick="return mV(\'1Ch\',6,33);">1Ch 6:33 (Hebrew 18)</a> and <a onClick="return mV(\'1Sa\',8,2);">1Sa 8:2</a>, Samuel\'s oldest son was Joel, and the second Abijah. The explanation of this is that in <a onClick="return mV(\'1Ch\',6,28);">1Ch 6:28</a> the word taken then as a proper name is really "and second"; so following Septuagint, Lucian, and Syriac we read (as the Revised Version (British and American)), "And the sons of Samuel: the first-born, Joel, and the second Abijah."``1';
isbe[9066]='Vashti`vash\'-ti (washti; Astin; Old Persian "beautiful woman"): The former queen of Xerxes, whom he divorced. On the 7th day of a great feast which the king was giving to the assembled nobles of the empire and others, he commanded the seven chamberlains who served in his presence to bring the queen into the assembly. We are told (<a onClick="return mV(\'Est\',1,11);">Es 1:11</a>) that his purpose was "to show the peoples and the princes her beauty; for she was fair to look on." The king\'s command was met by Vashti with a mortifying refusal to obey. The reason which is sometimes assigned for her disobedience—that no man but the king was permitted to look upon the queen—is without foundation. Esther invites Haman on two occasions to accompany the king to a banquet at which she was present. Nor can it be said that there was any lack of recognition of Vashti\'s high dignity; the seven highest officials of the palace were sent to escort her. The refusal had to be visited with a punishment severe enough to reestablish the supremacy which it threatened to overthrow. She was, accordingly, divorced and dethroned.<P>There is no known reference to Vashti outside of Esther. The suggestion has been made that Vashti was an inferior wife, or one of the royal concubines. There is nothing, however, to support it; and it is, besides, directly opposed to several statements in the narrative. She is always named "queen" (<a onClick="return mV(\'Est\',1,9);">Es 1:9,11,12</a>,<a onClick="return mV(\'Est\',1,\'15-18\');">15-18</a>). It is only (<a onClick="return mV(\'Est\',1,19);">Es 1:19</a>) when the decree is proposed to repudiate and degrade her that she is called merely "Vashti." She also (<a onClick="return mV(\'Est\',1,9);">Es 1:9</a>) presides at the banquet for the women. It is evident, therefore, that in the palace of the women there was no higher personage than Vashti.``180';
isbe[9067]='Vat``<a href="./study/isbe/search.html?string=WINEVAT">WINEVAT</a>`1';
isbe[9068]='Vault`volt (natsar, "to guard," "protest"): Isaiah\'s charge against Israel as "a people that...lodge in the secret places" (<a onClick="return mV(\'Isa\',65,4);">Isa 65:4</a>, margin "vaults," the King James Version "monuments") probably refers to the custom of sleeping in sacred tombs or vaults of idol temples to learn the future through dreams by the method known as incubation.`<a href="./study/isbe/search.html?string=DIVINATION">DIVINATION</a>; <a href="./study/isbe/search.html?string=FAMILIAR">FAMILIAR</a>; <a href="./study/isbe/search.html?string=WITCHCRAFT">WITCHCRAFT</a>`1';
isbe[9069]='Vault of Earth``<a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>`1';
isbe[9070]='Vav`vav.`<a href="./study/isbe/search.html?string=WAW">WAW</a>`1';
isbe[9071]='Vedan`ve\'-dan (wedhan): A place-name occurring only in <a onClick="return mV(\'Eze\',27,19);">Eze 27:19</a>, "Vedan and Javan traded with yarn for thy wares." the King James Version, taking the syllable we as the Hebrew conjunction, renders "and Dan also." The text is in bad condition. Some read "Dedan," but Dedan is spoken of separately in the following verse. Assuming that Vedan is the correct reading, an identification may be conjectured with Waddan, also called al-\'Abwa\', between Mecca and Medina. It was the object of Mohammed\'s first expedition (Ibn Hisham, 415). The name contains that of the god Wadd who was worshipped chiefly by the Arab tribe Kalb.``63';
isbe[9072]='Vehement, Vehemently`ve\'-he-ment, ve\'-he-ment-li (charishi; epipothesis): "Vehement" (from Latin vehere, "to carry," or ve, "out of," and mens, "mind"), carried away by the mind or force of passion, occurs twice in the Old Testament (<a onClick="return mV(\'Sgs\',8,6);">So 8:6</a>, the King James Version "a most vehement flame" (jealousy)) as the translation of shalhebheth-yah, "the flame of Yah," which perhaps means lightning (the Revised Version (British and American) "a very flame of Yahweh," margin "a most vehement flame, Hebrew: Yah"); and as the translation of the King James Version charishi, "silent," "still," hence "sultry" (<a onClick="return mV(\'Jon\',4,8);">Jon 4:8</a>, the King James Version "a vehement east wind," the Revised Version (British and American) "sultry"). In the New Testament, "vehement desire" is (the King James Version) the translation of epipothesis, "earnest desire" (<a onClick="return mV(\'2Cr\',7,11);">2Co 7:11</a>, the Revised Version (British and American) "longing").<P>"Vehemently" is the translation of deinos, "greatly" (<a onClick="return mV(\'Luk\',11,53);">Lu 11:53</a>); of ek perissou or ekperissos, "beyond measure" (<a onClick="return mV(\'Mar\',14,31);">Mr 14:31</a>, "He spake exceeding vehemently"); of eutonos, "intensely" (<a onClick="return mV(\'Luk\',23,10);">Lu 23:10</a>); and in the King James Version of prosrhegnumi, "to break" or "dash upon" (<a onClick="return mV(\'Luk\',6,48,49);">Lu 6:48,49</a>, the Revised Version (British and American) "break").``185';
isbe[9073]='Veil (1)`val: The following words are so translated in English Versions of the Bible (sometimes the King James Version vail):<P>(1) mitpachath, <a onClick="return mV(\'Rth\',3,15);">Ru 3:15</a> the King James Version, the Revised Version (British and American) "mantle." As the material was strong enough to serve as a bag for a large quantity of grain the Revised Version (British and American) is certainly right; compare <a onClick="return mV(\'Isa\',3,22);">Isa 3:22</a>.<P>(2) macweh, <a onClick="return mV(\'Exd\',34,\'33-35\');">Ex 34:33-35</a>. Paul in his quotation of the passage in <a onClick="return mV(\'2Cr\',3,\'13-16\');">2Co 3:13-16</a> uses kalumma, following Septuagint. The covering worn by Moses to conceal the miraculous brightness of his face, although, according to Massoretic Text, he seems to have worn it only in private.<P>(3) macckhah, <a onClick="return mV(\'Isa\',25,7);">Isa 25:7</a>; in <a onClick="return mV(\'Isa\',28,20);">28:20</A> translated "covering." The use in <a onClick="return mV(\'Isa\',25,7);">25:7</A> is figurative and the form of the "veil" a matter of indifference.<P>(4) tsammah, the Revised Version (British and American) <a onClick="return mV(\'Sgs\',4,1,3);">So 4:1,3</a> (margin "locks" (of hair)); <a onClick="return mV(\'Sgs\',6,7);">6:7</a>; <a onClick="return mV(\'Isa\',47,2);">Isa 47:2</a>, the King James Version "locks." The meaning of the word is uncertain and the King James Version may very well be right. If, however, the Revised Version\'s translation is correct, a light ornamental veil is meant.<P>(5) tsa\'iph, <a onClick="return mV(\'Gen\',24,65);">Ge 24:65</a>; <a onClick="return mV(\'Gen\',38,14,19);">38:14,19</a>. A large wrap is meant, which at times was used to cover the face also. In <a onClick="return mV(\'Gen\',24,65);">24:65</a> Rebekah conformed to the etiquette which required the veiling of brides (see <a href="./study/isbe/search.html?string=MARRIAGE">MARRIAGE</A>). In <a onClick="return mV(\'Gen\',38,\'1-\');">Genesis 38</a> one motive for Tamar\'s use of the veil was certainly to avoid recognition, but it seems clear from the passage that veils were used by courtesans. Why is unknown, perhaps partly to conceal their identity, perhaps partly in parody of the marriage custom.<P>(6) redhidh, <a onClick="return mV(\'Sgs\',5,7);">So 5:7</a> (the Revised Version (British and American) "mantle," margin "veil"); <a onClick="return mV(\'Isa\',3,23);">Isa 3:23</a>. A light mantle is certainly meant. In <a onClick="return mV(\'Sgs\',5,7);">So 5:7</a> it is torn from the maiden in the watchmen\'s endeavor to detain her.<P>(7) parakalumma, <span class="noTag">The Wisdom of Solomon 17:3</span> the King James Version, the Revised Version (British and American) "curtain."<P>(8) Verb katakalupto, <a onClick="return mV(\'1Cr\',11,6);">1Co 11:6</a>f; with akatakalupto, "unveil" in <a onClick="return mV(\'1Cr\',11,5);">11:5</A>; the King James Version has "cover" and "uncover"; kalupto, <a onClick="return mV(\'2Cr\',4,3);">2Co 4:3</a> (twice), anakalupto, <a onClick="return mV(\'2Cr\',3,18);">2Co 3:18</a>; the King James Version "hid" and "open."<P>It will be seen that there is a certain reference to what in modern times would be termed a "veil" only in (2) above. For a possible additional reference see <a href="./study/isbe/search.html?string=MUFFLER">MUFFLER</A>.<P>The use of the face veil as a regular article of dress was unknown to the Hebrew women, and if "veil" is to be understood in <a onClick="return mV(\'Sgs\',4,1);">So 4:1</a>, etc., it was worn as an ornament only. The modern oriental custom of veiling is due to Mohammedan influence and has not been universally adopted by Jewesses in the Orient. In New Testament times, however, among both Greeks and Romans, reputable women wore a veil in public (Plutarch Quaest. Rom. xiv) and to appear without it was an act of bravado (or worse); Tarsus, Paul\'s home city, was especially noted for strictness in this regard (Dio of Prusa, Tarsica prior, section symbol 48). Hence, Paul\'s indignant directions in <a onClick="return mV(\'1Cr\',11,\'2-16\');">1Co 11:2-16</a>, which have their basis in the social proprieties of the time. The bearing of these directions, however, on the compulsory use of the hat by modern women in public worship would appear to be very remote.`<a href="./study/isbe/search.html?string=VEIL">VEIL</a>`48';
isbe[9074]='Veil (2)`(1) (parokheth; katapetasma; the King James Version vail): In Exodus, Leviticus, Numbers, the veil that hung between the two holy chambers of the tabernacle is mentioned 23 times (<a onClick="return mV(\'Exd\',26,31);">Ex 26:31</a>, etc.). In several places it is termed "the veil of the screen" and it is distinguished from "the screen for the door of the tabernacle" (<a onClick="return mV(\'Exd\',35,12,15);">Ex 35:12,15</a>; <a onClick="return mV(\'Exd\',39,34,38);">39:34,38</a>). By the latter is meant the curtain that hung outside the holy place, i.e. at the tabernacle entrance. <a onClick="return mV(\'Exd\',26,31);">Ex 26:31</a> informs us that the veil was made of fine-twined linen, and that its colors were blue and purple and scarlet. It was embroidered with cherubim. At each removal of the tabernacle the veil was used to enwrap the ark of the testimony (<a onClick="return mV(\'Num\',4,5);">Nu 4:5</a>). From its proximity to this central object of the Hebrew ceremonial system, the veil is termed "the veil of the testimony" (<a onClick="return mV(\'Lev\',24,3);">Le 24:3</a>), "the veil which is before the testimony" (<a onClick="return mV(\'Exd\',27,21);">Ex 27:21</a>), etc. In Solomon\'s Temple the veil is mentioned but once (<a onClick="return mV(\'2Ch\',3,14);">2Ch 3:14</a>). It was protected by doors of olive wood (<a onClick="return mV(\'1Ki\',6,31);">1Ki 6:31</a>). In the later temple it is alluded to in 1Macc 1:22. Its presence in Herod\'s temple is attested by the statement in each of the Synoptists that at the time of Christ\'s death the veil of the temple was rent from top to bottom, or in the midst (<a onClick="return mV(\'Mat\',27,51);">Mt 27:51</a>; <a onClick="return mV(\'Mar\',15,38);">Mr 15:38</a>; <a onClick="return mV(\'Luk\',23,45);">Lu 23:45</a>; compare in Mishna, Mid. ii. 1; iv.7). This fact is the basis of the profound truth expressed by the writer to the Hebrews that Jesus, by His sacrificial death, opened for all believers a way into the holiest "through the veil, that is to say, his flesh" (<a onClick="return mV(\'Hbr\',10,20);">Heb 10:20</a>). See <a href="./study/isbe/search.html?string=TABERNACLE">TABERNACLE</a>; <a href="./study/isbe/search.html?string=TEMPLE">TEMPLE</A>.<P>(2) See the preceding article [<a href="./study/isbe/search.html?string=VEIL+(1)">Veil (1)</a>] and <a href="./study/isbe/search.html?string=DRESS">DRESS</A>, V.``17';
isbe[9075]='Vein`van: Only in <a onClick="return mV(\'Job\',28,1);">Job 28:1</a>, the King James Version "a vein for the silver," or motsa\', "going forth," "source." Both the King James Version "vein" and the Revised Version (British and American) "mine" are more specialized than motsa\', but the Revised Version (British and American) doubtless conveys the original meaning.``1';
isbe[9076]='Vengeance`ven\'-jans.`<a href="./study/isbe/search.html?string=AVENGE">AVENGE</a>; <a href="./study/isbe/search.html?string=GOEL">GOEL</a>; <a href="./study/isbe/search.html?string=RETRIBUTION">RETRIBUTION</a>; <a href="./study/isbe/search.html?string=REVENGE">REVENGE</a>`1';
isbe[9077]='Venison`ven\'-i-z\'-n, ven\'-z\'-n: Is derived (through the French venaison) from the Latin venari, "to hunt," and means properly "the spoils of the chase." As, however, the object of the chase, par excellence, was the deer, venison came to mean usually (as it invariably does in modern English) "deer\'s flesh." But in English Versions of the Bible this technical force seems not to be implied, for "venison" is used only for the two Hebrew words tsayidh (<a onClick="return mV(\'Gen\',25,28);">Ge 25:28</a>; <a onClick="return mV(\'Gen\',27,5);">27:5</a>), and tsedhah (<a onClick="return mV(\'Gen\',27,3);">Ge 27:3</a>), and both these words (from tsudh, "to hunt") mean simply "game" of any kind.``1';
isbe[9078]='Verdigris`vur\'-di-gres.`<a href="./study/isbe/search.html?string=SCUM">SCUM</a>`1';
isbe[9079]='Verily, Verity`ver\'-i-ti, ver\'-i-ti (\'abhal, etc.; amen): "Verily," as corroborative adverb, represents various Hebrew and Greek words and particles (\'abhal, "truly," in <a onClick="return mV(\'Gen\',42,21);">Ge 42:21</a>, etc.; \'akh, "only," "surely," in <a onClick="return mV(\'Psa\',66,19);">Ps 66:19</a>; <a onClick="return mV(\'Isa\',45,15);">Isa 45:15</a>, etc.). For the King James Version "verily thou shalt be fed" (<a onClick="return mV(\'Psa\',37,3);">Ps 37:3</a>, where \'emunah), the American Standard Revised Version has "feed on his faithfulness" and the English Revised Version "follow after faithfulness," margin in both "feed securely." The Greek amen (Hebrew \'amen) is used very frequently in the Gospels as an emphatic confirmation of Christ\'s sayings (<a onClick="return mV(\'Mat\',5,18,26);">Mt 5:18,26</a>; <a onClick="return mV(\'Mat\',6,2);">6:2</a>; <a onClick="return mV(\'Mar\',3,28);">Mr 3:28</a>, etc.), and in John\'s Gospel is repeated to give additional emphasis (<a onClick="return mV(\'Jhn\',1,51);">Joh 1:51</a>; <a onClick="return mV(\'Jhn\',3,3,5,11);">3:3,5,11</a>, The Revised Version (British and American) makes various changes, as "wholly" for "verily" (<a onClick="return mV(\'Job\',19,13);">Job 19:13</a>), "surely" (<a onClick="return mV(\'Psa\',39,5);">Ps 39:5</a>; <a onClick="return mV(\'Psa\',73,13);">73:13</a>), "indeed" (<a onClick="return mV(\'Mar\',9,12);">Mr 9:12</a>; <a onClick="return mV(\'Rom\',2,25);">Ro 2:25</a>; <a onClick="return mV(\'Hbr\',3,5);">Heb 3:5</a>; <a onClick="return mV(\'Hbr\',7,5);">7:5</a>), etc., and sometimes puts "verily" where the King James Version has other words, as "also" (<a onClick="return mV(\'Mat\',13,23);">Mt 13:23</a>), "doubtless" (<a onClick="return mV(\'Phl\',3,8);">Php 3:8</a>), etc.<P>Verity is the translation of \'emeth, "truth," "stedfastness" (<a onClick="return mV(\'Psa\',111,7);">Ps 111:7</a>, "The works of his hands are verity and judgment," the American Standard Revised Version "truth and justice," the English Revised Version "truth and judgment"); and of aletheia, "truth," "reality," "certainty" (<a onClick="return mV(\'1Ti\',2,7);">1Ti 2:7</a>), "faith and verity," the Revised Version (British and American) "faith and truth."``185';

isbe[9081]='Versions`vur\'-shunz.<P>See also, <a href="./study/isbe/search.html?string=VULGATE">VULGATE</a>.`<a href="./study/isbe/search.html?string=AMERICAN+REVISED+VERSION">AMERICAN REVISED VERSION</a>; <a href="./study/isbe/search.html?string=ARABIC+VERSIONS">ARABIC VERSIONS</a>; <a href="./study/isbe/search.html?string=ARMENIAN+VERSIONS">ARMENIAN VERSIONS</a>; <a href="./study/isbe/search.html?string=COPTIC+VERSIONS">COPTIC VERSIONS</a>; <a href="./study/isbe/search.html?string=ENGLISH+VERSIONS">ENGLISH VERSIONS</a>; <a href="./study/isbe/search.html?string=ETHIOPIC+VERSIONS">ETHIOPIC VERSIONS</a>; <a href="./study/isbe/search.html?string=LATIN+VERSION,+THE+OLD">LATIN VERSION, THE OLD</a>; <a href="./study/isbe/search.html?string=SEPTUAGINT">SEPTUAGINT</a>; <a href="./study/isbe/search.html?string=SYRIAC+VERSIONS">SYRIAC VERSIONS</a>; <a href="./study/isbe/search.html?string=TARGUM">TARGUM</a>; <a href="./study/isbe/search.html?string=TEXT+AND+MANUSCRIPTS+OF+THE+NEW+TESTAMENT">TEXT AND MANUSCRIPTS OF THE NEW TESTAMENT</a>; <a href="./study/isbe/search.html?string=TEXT+OF+THE+OLD+TESTAMENT">TEXT OF THE OLD TESTAMENT</a>`1';
isbe[9082]='Versions, Georgian, Gothic, Slavonic`jor\'-ji-an, goth\'-ik, sla-von\'-ik:<P>1. The Georgian Version:<P>Georgia is the name given to the territory extending to the east of the Black Sea, a country that has had an independent national existence of 2,000 years but is now (under the name Grusinia) a part of the trans-Caucasian domain of Russia. The language has no affinities with any of the recognized groups, but is becoming obsolete under Russian pressure. Christianity was introduced into Georgia m the 4th century, and a national conversion followed. A well-supported tradition makes the first translation of the Bible almost contemporaneous with this conversion and refers it to Mesrop (died 441; see <a href="./study/isbe/search.html?string=ARMENIAN+VERSIONS">ARMENIAN VERSIONS</a>), but the fact is not quite certain and the beginnings of a native version may really be as much as two centuries later. The oldest manuscript extant is a Psalter of the 7th-8th centuries, and the earliest copy of the Gospels is perhaps a century later; in all, Gregory (Textkritik, 573-75) enumerates 17 Georgian manuscripts of the New Testament, but his list is not exhaustive.<P>The first printed Bible was produced in the ancient alphabet in Moscow in 1743 and has never been reprinted, but other edd, perhaps only of the New Testament, were issued at least in 1816 and 1818, using the nonecclesiastical alphabet. According to Conybeare (ZNTW, XI, 161-66, 232-39 (1910)) the Georgian version was first made from the Old Syriac and then later (11th century) revised from the Greek In 1910 a new edition, based on two manuscripts dated respectively 913 and 995, was begun (Quattuor Ev. versio Georgia vetus, Petersburg). The Georgian version was used by S. C. Malan, The Gospel according to John, translated from the 11 Oldest VSS, London, 1862.<P>2. The Gothic Version:<P>Ulfilas, the Arian bishop of the West Goths and the chief agent in their conversion to Christianity, was also the first translator of the Bible into Gothic, a work for which he had even to invent an alphabet. According to tradition, his translation included the entire Bible with the exception of Kings (which he thought unadapted to the already too warlike character of his converts), but there is doubt whether his work actually included more than the New Testament. Too little of the Old Testament has survived to enable a settling of this question, nor is it possible to tell how much revision the New Testament translation has undergone since Ulfilas\' work.<P>A list of the six Gothic manuscripts is given in HDB, IV,862,to which is to be added a bilingual Latin-Gothic manuscript containing portions of <a onClick="return mV(\'Luk\',24,1);">Luke 24</a>, known as the Arsinoe Fragment (published in ZNTW, XI, 1-38 (1910) and separately (Giessen, 1910)). In all there have been preserved in the Old Testament <a onClick="return mV(\'Gen\',5,\'1-\');">Ge 5</a> (in part); <a onClick="return mV(\'Psa\',52,2);">Ps 52:2</a>f; <a onClick="return mV(\'Neh\',5,\'1-\');">Ne 5-7</a> (in part), and in the New Testament the Gospels and Pauline Epistles (all incomplete), with quotations from Hebrews. The best complete edition is that of Stamm-Heyne(9) (Paderborn, 1896), but as the version is of basic importance for the history of the Germanic languages there are many editions of various portions prepared for philological purposes.<P>The Old Testament fragments are a translation of a text very closely allied to the Lucianic Greek (see <a href="./study/isbe/search.html?string=SEPTUAGINT">SEPTUAGINT</a>) and are certainly not from the Hebrew New Testament undoubtedly was made from a text of the type used in Antioch (Constantinople) in the 4th century, with very slight variations, none of which are "neutral" (von Soden classes them as of the I-type). Either in making the translation or (more probably) in a subsequent revision an Old-Latin text was used, of the type of Codex Brixianus (f), and certain Old-Latin readings are well marked. For brief lists of these peculiarities see Burkitt in Journal Theological Studies, I, 129-34 (1900), or von Soden, Schriften des New Testament, I, 1469f (1906).<P>3. The Slavonic Version:<P>It is definitely known that the first Slavonic translation of the Bible was commenced in 864 or earlier by the two brothers Cyril (died 869) and Methodius (died 885), and that the latter worked on it after the former\'s death. Their work was undertaken for the benefit of the Balkan Slavs, and at first only the liturgical portions (Gospels, Acts, Epistles and Psalms) were translated, but, after the completion of this, Methodius carried the translation farther to include larger portions of the Old Testament. How much of this he accomplished is obscure, but he seems not to have finished the Old Testament entirely, while almost certainly he did not translate Revelation. Uncertain also is the exact dialect used for this work; although this dialect was the basis of the present liturgical language of the Russian church, it has undergone much transformation before arriving at its final stage. At different times the translation of the Bible was revised to conform to the changes of the language, in addition to other revisional changes, and, as a result, the manuscripts (some of which go back to the 10th century) exhibit very varying types of text that have not been satisfactorily classified.<P>An attempt to bring the discrepant material into order was made about 1495 by Archbishop Gennadius, but he was unable to find Slavonic manuscripts that included the entire Bible and was forced to supply the deficiencies (Chronicles, Ezra, Nehemiah, Esther and most of Jeremiah and the Apocrypha) by a new translation made from the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) This Bible of Gennadius was the basis of the first printed edition, made at Ostrog in 1581, although the liturgical portions had been printed earlier (Ac and Epistles first of all in 1564). The Ostrog edition followed Gennadius fairly closely, but Esther, Canticles, and Wisdom were new translations made from the Septuagint. The next revision was undertaken by order of Peter the Great and was performed by using the Greek (Old Testament and New Testament), although the resulting text was not printed until 1751. A slightly emended edition of 1756 is still the official Bible of the Russian church.<P>This Slavonic version is to be distinguished from the version in the true Russian language, begun first in 1517, revised or remade at various times, with an excellent modern translation first published complete in 1876. See, on the whole subject, especially Bebb in Church Quart. Rev., XLI, 203-25, 1895.<P>LITERATURE.<P>On all three versions see HDB, IV, 861-64, 1902, and the article "Bibelubersetzung" in PRE3, III (1897), with the important supplement in XXIII (1913).``48';
isbe[9083]='Very`ver\'-i: As adjective (from verus, "true"), "true," "real," "actual," etc. (<a onClick="return mV(\'Gen\',27,21,24);">Ge 27:21,24</a>, "my very son Esau"; <a onClick="return mV(\'Jos\',10,27);">Jos 10:27</a>, "this very day"; <a onClick="return mV(\'Jhn\',7,26);">Joh 7:26</a>, "the very Christ," etc.); chiefly as adverb, "in a high degree," "extremely." As adverb it is commonly in the Old Testament the translation of me\'odh, and in the New Testament represents, as adjective and adverb, several Greek words, as alethos, "truly" (<a onClick="return mV(\'Jhn\',7,26);">Joh 7:26</a>, above), autos (<a onClick="return mV(\'Jhn\',14,11);">Joh 14:11</a>, "the very works\' sake"; <a onClick="return mV(\'Rom\',13,6);">Ro 13:6</a>), sphodra (<a onClick="return mV(\'Mat\',18,31);">Mt 18:31</a>, "very sorry," the Revised Version (British and American) "exceeding sorry"; <a onClick="return mV(\'Mar\',16,4);">Mr 16:4</a>, "very great," the Revised Version (British and American) "exceeding"), huper- (in composition <a onClick="return mV(\'1Th\',5,13);">1Th 5:13</a>), etc. the Revised Version (British and American) frequently omits "very," and also substitutes other words for it, as "exceeding" (<a onClick="return mV(\'2Ch\',16,8);">2Ch 16:8</a>; <a onClick="return mV(\'Mat\',26,7);">Mt 26:7</a>; compare above), "sore" (<a onClick="return mV(\'Zec\',9,5);">Zec 9:5</a>), etc.``185';
isbe[9084]='Vessel`ves\'-el: Is used freely in English Versions of the Bible to translate keli, the Aramaic ma\'n, and skeuos, words all meaning "an implement or utensil" of any kind, when the context shows that a hollow utensil is meant. In <a onClick="return mV(\'1Sa\',21,5);">1Sa 21:5</a>, however, the translation of the plural of keli by "vessels" is dubious. English Versions of the Bible evidently intended something in the nature of provision wallets, and the "holiness" of such objects finds partial parallels in <a onClick="return mV(\'Num\',19,15);">Nu 19:15</a>; <a onClick="return mV(\'Lev\',11,\'32-34\');">Le 11:32-34</a>, etc. But in <a onClick="return mV(\'1Sa\',21,8);">1Sa 21:8</a>, in the immediate context of the verse above, keli certainly means "weapons," and this translation is quite intelligible in 21:5 also. For war among the Hebrews was a holy function, calling for extreme ceremonial purity (<a onClick="return mV(\'Deu\',23,\'9-14\');">De 23:9-14</a>). See the commentaries. and especially RS2, 455-56. In addition, "vessel" appears in <a onClick="return mV(\'Isa\',30,14);">Isa 30:14</a> for nebhel, "jar"; in <a onClick="return mV(\'Mat\',13,48);">Mt 13:48</a> for aggos, "vessels"; and in Sirach 21:14; <a onClick="return mV(\'Mat\',25,4);">Mt 25:4</a> for aggeion, a diminutive form of aggos. A different use is that of <span class="noTag">The Wisdom of Solomon 14:1</span>, where "vessel" represents ploion, "a boat," while <span class="noTag">The Wisdom of Solomon 14:5,6</span> the King James Version has "weak vessel" for schedia, "raft" (so the Revised Version (British and American)). Vessels of all sorts and kinds and for all sorts of uses were so familiar as to make them natural illustrations for different sorts of human beings (<a onClick="return mV(\'Hsa\',8,8);">Ho 8:8</a>; <a onClick="return mV(\'Isa\',22,24);">Isa 22:24</a>; <a onClick="return mV(\'Jer\',22,28);">Jer 22:28</a>, etc.; see <a href="./study/isbe/search.html?string=POTTER">POTTER</a>), and through <a onClick="return mV(\'Act\',9,15);">Ac 9:15</a> the word "vessel" has passed into Christian theology as signifying simply a human being. But the figure of such "vessels" as (passively) filled with different contents is not Biblical. In <a onClick="return mV(\'1Th\',4,4);">1Th 4:4</a> "vessel" may be taken as a figure for either the man\'s own body or for his wife. Between these possibilities the commentaries are almost equally divided.``48';
isbe[9085]='Vestments`vest\'-ments.`<a href="./study/isbe/search.html?string=DRESS">DRESS</a>`1';
isbe[9086]='Vestry`ves\'-tri (meltachah): Once, in <a onClick="return mV(\'2Ki\',10,22);">2Ki 10:22</a>, as a place for vestments.``1';
isbe[9087]='Vex, Vexation`veks, vek-sa\'-shun: "Vex," meaning originally to shake or toss in carrying, has a much more intensive meaning in Scripture than in common modern usage. It represents over a score of Hebrew and Greek words, most of them translated by this word only once, and many of them changed in the Revised Version (British and American) into other forms. Thus bahel in <a onClick="return mV(\'Psa\',6,2,3,10);">Ps 6:2,3,10</a>. is in the American Standard Revised Version "troubled" (in <a onClick="return mV(\'Psa\',2,5);">Ps 2:5</a>, the Revised Version margin. "trouble"); tsarar in <a onClick="return mV(\'Neh\',9,27);">Ne 9:27</a> is in the Revised Version (British and American) "distressed"; pascho in <a onClick="return mV(\'Mat\',17,15);">Mt 17:15</a> is "suffereth grievously"; kakoo in <a onClick="return mV(\'Act\',12,1);">Ac 12:1</a> is "afflict," etc. So "vexation only" in <a onClick="return mV(\'Isa\',28,19);">Isa 28:19</a> is in the Revised Version (British and American) "nought but terror," and there are other changes of this word (compare <a onClick="return mV(\'Deu\',28,20);">De 28:20</a>, "discomfiture"; <a onClick="return mV(\'Isa\',9,1);">Isa 9:1</a>, "in anguish"). On the other hand, the Revised Version (British and American) has "vex" for "distress" (<a onClick="return mV(\'Deu\',2,9,19);">De 2:9,19</a>); "they that vex" for "the adversaries of" (<a onClick="return mV(\'Isa\',11,13);">Isa 11:13</a>); "vexeth himself" for "meddleth" (<a onClick="return mV(\'Pro\',26,17);">Pr 26:17</a>), etc.``185';
isbe[9088]='Vial`vi\'-al: In modern English means "a tiny flask." The word appears in English Versions of the Bible <a onClick="return mV(\'1Sa\',10,1);">1Sa 10:1</a> and the Revised Version (British and American) <a onClick="return mV(\'2Ki\',9,1,3);">2Ki 9:1,3</a> (the King James Version "box") for pakh, a word found nowhere else and from a root meaning "to pour." The shape and size of the pakh are quite uncertain. In 1Esdras 2:13; and the King James Version <a onClick="return mV(\'Rev\',5,8);">Re 5:8</a>, etc., "vial" translates phiale. The phiale was a flat, shallow bowl (Latin, patera), shaped much like a saucer. Hence, the Revised Version\'s change to "bowl" in Revelation, a change that should have been made in 1Esdras also.``1';

isbe[9091]='Vile, Villany`vil, vil\'-an-i: The original words for "vile" and "villany" are used in about 10 different senses, e.g. despised (<a onClick="return mV(\'1Sa\',15,9);">1Sa 15:9</a>), despicable (<a onClick="return mV(\'Dan\',11,21);">Da 11:21</a> the King James Version), lightly esteemed (<a onClick="return mV(\'Deu\',25,3);">De 25:3</a>), empty (<a onClick="return mV(\'Jdg\',19,24);">Jud 19:24</a> the King James Version), foolish (<a onClick="return mV(\'Isa\',32,6);">Isa 32:6</a>, the King James Version and the English Revised Version), dishonorable (<a onClick="return mV(\'Rom\',1,26);">Ro 1:26</a>), filthy or dirty (<a onClick="return mV(\'Jam\',2,2);">Jas 2:2</a>), humiliation (<a onClick="return mV(\'Phl\',3,21);">Php 3:21</a>).<P>Villany occurs but twice in the King James Version (<a onClick="return mV(\'Isa\',32,6);">Isa 32:6</a>; <a onClick="return mV(\'Jer\',29,23);">Jer 29:23</a>), and signifies emptiness or folly (so the Revised Version (British and American)). From the foregoing meanings it will be seen that the word "vile" does not always bear the meaning which has come to be invariably given it in our present-day speech. Anything common or ordinary or humble might, in the Scriptural sense, be termed "vile." So <a onClick="return mV(\'Job\',40,4);">Job 40:4</a>, the Revised Version (British and American) "Behold, I am of small account"; also "the low estate of his handmaid" (<a onClick="return mV(\'Luk\',1,48);">Lu 1:48</a>). Ordinarily, however, the idea of contemptible, despicable, is read into the word.``53';
isbe[9092]='Village`vil\'-aj (qaphar, chawwoth, qatserim, banoth, perazoth; kome):<P>(1) The general term for a village, in common with Aramaic and Arabic is qaphar (<a onClick="return mV(\'Sgs\',7,11);">So 7:11</a>; <a onClick="return mV(\'1Ch\',27,25);">1Ch 27:25</a>; kopher; <a onClick="return mV(\'1Sa\',6,18);">1Sa 6:18</a>; kephir, <a onClick="return mV(\'Neh\',6,2);">Ne 6:2</a>). This designation is derived from the idea of its offering "cover" or shelter. It is used in combination, and place-names of this formation became prominent in post-Biblical times, probably because the villages so named had then grown into towns. A well-known Biblical instance of such names is Capernaum.<P>(2) Chawwoth (always "town" in English Versions of the Bible; see <a href="./study/isbe/search.html?string=HAVVOTH-JAIR">HAVVOTH-JAIR</a>) means originally a group of tents (Arabic chiwa\'). These in settled life soon became more permanent dwellings, or what we understand by a village. The term, however, is applied only to the villages of Jair in the tribe of Manasseh (<a onClick="return mV(\'Num\',32,41);">Nu 32:41</a>; <a onClick="return mV(\'1Ki\',4,13);">1Ki 4:13</a>).<P>(3) Chatserim likewise came from nomadic life. They were originally enclosures specially for cattle, alongside of which dwellings for the herdsmen and peasantry naturally grew up (see <a href="./study/isbe/search.html?string=HAZAR-ADDAR">HAZAR-ADDAR</A>; <a href="./study/isbe/search.html?string=HAZOR">HAZOR</a>). They were unwalled (<a onClick="return mV(\'Lev\',25,31);">Le 25:31</a>) and lay around the cities (<a onClick="return mV(\'Jos\',19,8);">Jos 19:8</a>).<P>(4) Banoth is literally "daughters." The word is applied to the dependent villages lying around the larger cities, and to which they looked as to a kind of metropolis (<a onClick="return mV(\'Num\',21,25);">Nu 21:25</a>, etc.); the Revised Version (British and American) "towns" except in <a onClick="return mV(\'Num\',32,42);">Nu 32:42</a>.<P>(5) Perazoth means "the open country," but it soon came to mean the villages scattered in the open (<a onClick="return mV(\'Eze\',38,11);">Eze 38:11</a>; <a onClick="return mV(\'Zec\',2,4);">Zec 2:4</a>; <a onClick="return mV(\'Est\',9,19);">Es 9:19</a>). Some have sought to connect the Perizzites with this word and to regard them, not as a distinct people, but as the peasant class. Attempts have also been m<P>ade to connect perazon in <a onClick="return mV(\'Jdg\',5,7,11);">Jud 5:7,11</a> with the same root, and the King James Version rendered it "inhabitants of the villages." the Revised Version (British and American), on the contrary, gives it the meaning of "rulers." The versions indicate a word meaning authority, and probably the text should be emended to read rozenim, "rulers." A similar emendation is required in <a onClick="return mV(\'Hab\',3,14);">Hab 3:14</a>. "Village" in the Revised Version (British and American) of the New Testament invariably represents the Greek kome, but in 2Macc 8:6 the Revised Version (British and American) Apocrypha has "village" for chora, lit. "country."`<a href="./study/isbe/search.html?string=CITY">CITY</a>; <a href="./study/isbe/search.html?string=TOWN">TOWN</a>`23';
isbe[9093]='Villany``<a href="./study/isbe/search.html?string=VILE">VILE</a>`1';
isbe[9094]='Vine`vin:<P>1. Hebrew Words:<P>(1) gephen, usually the cultivated grape vine. In <a onClick="return mV(\'Num\',6,4);">Nu 6:4</a>; <a onClick="return mV(\'Jdg\',13,14);">Jud 13:14</a> we have gephen ha-yayin, literally, "vine of wine," translated "grape vine" (Numbers) and "vine," margin "grape vine" (Jgs); <a onClick="return mV(\'2Ki\',4,39);">2Ki 4:39</a>, gephen sadheh English Versions of the Bible "wild vine"; <a onClick="return mV(\'Deu\',32,32);">De 32:32</a>, gephen cedhom, "vine of Sodom."<P>(2) soreq, in <a onClick="return mV(\'Isa\',5,2);">Isa 5:2</a>, "choicest vine"; soreq, in <a onClick="return mV(\'Jer\',2,21);">Jer 2:21</a>, "noble vine"; soreqah, in <a onClick="return mV(\'Gen\',49,11);">Ge 49:11</a>, "choice vine"; compare <a href="./study/isbe/search.html?string=SOREK,+VALLEY OF">SOREK, VALLEY OF</a> (which see). The Hebrew is supposed to indicate dark grapes and, according to rabbinical tradition, they were unusually sweet and almost, if not quite, stoneless.<P>(3) nazir, in <a onClick="return mV(\'Lev\',25,5,11);">Le 25:5,11</a>, "undressed vine," the King James Version "vine undressed," margin "separation." This may mean an unpruned vine and be a reference to the uncut locks of a Nazirite, but it is equally probable that nazir should be batsir, "vintage."<P>For the blossom we have peraq (<a onClick="return mV(\'Isa\',18,5);">Isa 18:5</a>), "blossom"; nitstsah, either the blossom or half-formed clusters of grapes (<a onClick="return mV(\'Gen\',40,10);">Ge 40:10</a>; <a onClick="return mV(\'Isa\',18,5);">Isa 18:5</a>); cemadhar, "sweet-scented blossom" (<a onClick="return mV(\'Sgs\',2,13,15);">So 2:13,15</a>; <a onClick="return mV(\'Sgs\',7,12);">7:12</a>).<P>For grapes we have commonly: \'enabh (a word common to all Semitic languages) (<a onClick="return mV(\'Gen\',40,10);">Ge 40:10</a>; <a onClick="return mV(\'Deu\',32,14);">De 32:14</a>; <a onClick="return mV(\'Isa\',5,2);">Isa 5:2</a>, etc.); dam \'anabhim, literally, "blood of grapes," i.e. wine (<a onClick="return mV(\'Gen\',49,11);">Ge 49:11</a>); bocer, "the unripe grape" (<a onClick="return mV(\'Isa\',18,5);">Isa 18:5</a>, "ripening grape," the King James Version "sour grape"; <a onClick="return mV(\'Job\',15,33);">Job 15:33</a>, "unripe grapes"; <a onClick="return mV(\'Jer\',31,29);">Jer 31:29</a>f; <a onClick="return mV(\'Eze\',18,2);">Eze 18:2</a>, "sour grapes"); be\'ushim "wild grapes" (<a onClick="return mV(\'Isa\',5,2,4);">Isa 5:2,4</a>; see <a href="./study/isbe/search.html?string=GRAPES,+WILD">GRAPES, WILD</a>); \'eshkol, a "cluster" of ripe grapes (<a onClick="return mV(\'Gen\',40,10);">Ge 40:10</a>; <a onClick="return mV(\'Sgs\',7,8);">So 7:8</a>; <a onClick="return mV(\'Hab\',3,17);">Hab 3:17</a>, etc.; compare <a href="./study/isbe/search.html?string=ESHCOL">ESHCOL</a> (which see)); qartsannim, usually supposed to be the kernels of grapes (<a onClick="return mV(\'Num\',6,4);">Nu 6:4</a>).<P>2. Greek and Latin:<P>In Greek we have ampelos, "vine" (<a onClick="return mV(\'Mat\',26,29);">Mt 26:29</a>, etc.), staphule (Sirach 39:26, "blood of grapes"; <a onClick="return mV(\'Mat\',7,16);">Mt 7:16</a>, "grapes," etc.), and botrus (<a onClick="return mV(\'Rev\',14,18);">Re 14:18</a>), "cluster of the vine." In the Latin of 2Esdras vinea is "vine" in 5:23 ("vineyard" in 16:30,43); botrus (9:21) and racemus (16:30) are "cluster"; acinium (9:21) and uva (16:26) are "a grape."<P>3. Antiquity and Importance:<P>Palestine appears to have been a vine-growing country from the earliest historic times. The countless wine presses found in and around centers of early civilization witness to this. It is probable that the grape was largely cultivated as a source of sugar: the juice expressed in the "wine press" was reduced by boiling to a liquid of treacle-like consistency known as "grape honey," or in Hebrew debhash (Arabic, dibs). This is doubtless the "honey" of many Old Testament references, and before the days of cane sugar was the chief source of sugar. The whole Old Testament witnesses to how greatly Palestine depended upon the vine and its products. Men rejoiced in wine also as one of God\'s best gifts (<a onClick="return mV(\'Jdg\',9,13);">Jud 9:13</a>; <a onClick="return mV(\'Psa\',104,15);">Ps 104:15</a>). But the Nazirite might eat nothing of the vine "from the kernels even to the husk" (<a onClick="return mV(\'Num\',6,4);">Nu 6:4</a>; <a onClick="return mV(\'Jdg\',13,14);">Jud 13:14</a>).<P>The land promised to the children of Israel was one of "vines and fig trees and pomegranates" (<a onClick="return mV(\'Deu\',8,8);">De 8:8</a>); they inherited vineyards which they had not planted (<a onClick="return mV(\'Deu\',6,11);">De 6:11</a>; <a onClick="return mV(\'Jos\',24,13);">Jos 24:13</a>; <a onClick="return mV(\'Neh\',9,25);">Ne 9:25</a>). Jacob\'s blessing on Judah had much reference to the suitability of his special part of the land to the vine (<a onClick="return mV(\'Gen\',49,11);">Ge 49:11</a>). When the leading people were carried captive the poor were left as vine dressers (<a onClick="return mV(\'2Ki\',25,12);">2Ki 25:12</a>; <a onClick="return mV(\'Jer\',52,16);">Jer 52:16</a>), lest the whole land should lapse into uncultivated wilderness. On the promised return this humble duty was, however, to fall to the "sons of the alien" (<a onClick="return mV(\'Isa\',61,5);">Isa 61:5</a> the King James Version).<P>4. Its Cultivation:<P>The mountain regions of Judea and Samaria, often little suited to cereals, have always proved highly adapted to vine culture. The stones must first be gathered out and utilized for the construction of a protecting wall or of terraces or as the bases of towers (<a onClick="return mV(\'Isa\',5,2);">Isa 5:2</a>; <a onClick="return mV(\'Mat\',21,33);">Mt 21:33</a>). Every ancient vineyard had its wine press cut in a sheet of rock appearing at the surface. As a rule the vinestocks lie along the ground, many of the fruit-bearing branches falling over the terraces (compare <a onClick="return mV(\'Gen\',49,22);">Ge 49:22</a>); in some districts the end of the vine-stock is raised by means of a cleft stick a foot or more above the surface; exceptionally the vine branches climb into trees, and before a dwelling-house they are sometimes supported upon poles to form a bower (compare <a onClick="return mV(\'1Ki\',4,25);">1Ki 4:25</a>, etc.).<P>The cultivation of the vine requires constant care or the fruit will very soon degenerate. After the rains the loosely made walls require to have breaches repaired; the ground must be plowed or harrowed and cleared of weeds—contrast with this the vineyard of the sluggard (<a onClick="return mV(\'Pro\',24,\'30-31\');">Pr 24:30-31</a>); in the early spring the plants must be pruned by cutting off dead and fruitless branches (<a onClick="return mV(\'Lev\',25,3,4);">Le 25:3,4</a>; <a onClick="return mV(\'Isa\',5,6);">Isa 5:6</a>) which are gathered and burned (<a onClick="return mV(\'Jhn\',15,6);">Joh 15:6</a>). As the grapes ripen they must be watched to keep off jackals and foxes (<a onClick="return mV(\'Sgs\',2,15);">So 2:15</a>), and in some districts even wild boars (<a onClick="return mV(\'Psa\',80,13);">Ps 80:13</a>). The watchman is stationed in one of the towers and overlooks a considerable area. When the grape season comes, the whole family of the owner frequently take their residence in a booth constructed upon one of the larger towers and remain there until the grapes are practically finished. It is a time of special happiness (compare <a onClick="return mV(\'Isa\',16,10);">Isa 16:10</a>). The gleanings are left to the poor of the village or town (<a onClick="return mV(\'Lev\',19,10);">Le 19:10</a>; <a onClick="return mV(\'Deu\',24,21);">De 24:21</a>; <a onClick="return mV(\'Jdg\',8,2);">Jud 8:2</a>; <a onClick="return mV(\'Isa\',17,6);">Isa 17:6</a>; <a onClick="return mV(\'Isa\',24,13);">24:13</a>; <a onClick="return mV(\'Jer\',49,9);">Jer 49:9</a>; <a onClick="return mV(\'Mic\',7,1);">Mic 7:1</a>). In the late summer the vineyards are a beautiful mass of green, as contrasted with the dried-up parched land around, but in the autumn the leaves are sere and yellow (<a onClick="return mV(\'Isa\',34,4);">Isa 34:4</a>), and the place desolate.<P>5. Vine of Sodom:<P>The expression "vine of Sodom" (<a onClick="return mV(\'Deu\',32,32);">De 32:32</a>) has been supposed, especially because of the description in Josephus (BJ, IV, viii, 4), to refer to the colocynth (Citrullus colocynthis), but it is far more probable that it means "a vine whose juices and fruits were not fresh and healthy, but tainted by the corruption of which Sodom was the type" (Driver, Commentary on Deuteronomy).<P>See <a href="./study/isbe/search.html?string=SODOM,+VINE+OF">SODOM, VINE OF</a>.<P>Figurative: Every man "under his vine and under his fig-tree" (<a onClick="return mV(\'1Ki\',4,25);">1Ki 4:25</a>; <a onClick="return mV(\'Mic\',4,4);">Mic 4:4</a>; <a onClick="return mV(\'Zec\',3,10);">Zec 3:10</a>) was a sign of national peace and prosperity. To plant vineyards and eat the fruit thereof implied long and settled habitation (<a onClick="return mV(\'2Ki\',19,29);">2Ki 19:29</a>; <a onClick="return mV(\'Psa\',107,37);">Ps 107:37</a>; <a onClick="return mV(\'Isa\',37,30);">Isa 37:30</a>; <a onClick="return mV(\'Isa\',65,21);">65:21</a>; <a onClick="return mV(\'Jer\',31,5);">Jer 31:5</a>; <a onClick="return mV(\'Eze\',28,26);">Eze 28:26</a>; <a onClick="return mV(\'Amo\',9,14);">Am 9:14</a>); to plant and not eat the fruit was a misfortune (<a onClick="return mV(\'Deu\',20,6);">De 20:6</a>; compare <a onClick="return mV(\'1Cr\',9,7);">1Co 9:7</a>) and might be a sign of God\'s displeasure (<a onClick="return mV(\'Deu\',28,30);">De 28:30</a>; <a onClick="return mV(\'Zep\',1,13);">Ze 1:13</a>; <a onClick="return mV(\'Amo\',5,11);">Am 5:11</a>). Not to plant vines might be a sign of deliberate avoidance of permanent habitation (<a onClick="return mV(\'Jer\',35,7);">Jer 35:7</a>). A successful and prolonged vintage showed God\'s blessing (<a onClick="return mV(\'Lev\',26,5);">Le 26:5</a>), and a fruitful wife is compared to a vine (<a onClick="return mV(\'Psa\',128,3);">Ps 128:3</a>); a failure of the vine was a sign of God\'s wrath (<a onClick="return mV(\'Psa\',78,47);">Ps 78:47</a>; <a onClick="return mV(\'Jer\',8,13);">Jer 8:13</a>; <a onClick="return mV(\'Joe\',1,7);">Joe 1:7</a>); it might be a test of faith in Him (<a onClick="return mV(\'Hab\',3,17);">Hab 3:17</a>). Joseph "is a fruitful bough,...his branches run over the wall" (<a onClick="return mV(\'Gen\',49,22);">Ge 49:22</a>). Israel is a vine (<a onClick="return mV(\'Isa\',5,\'1-5\');">Isa 5:1-5</a>) brought out of Egypt (<a onClick="return mV(\'Psa\',80,8);">Ps 80:8</a>f; <a onClick="return mV(\'Jer\',2,21);">Jer 2:21</a>; <a onClick="return mV(\'Jer\',12,10);">12:10</a>; compare <a onClick="return mV(\'Eze\',15,2,6);">Eze 15:2,6</a>; <a onClick="return mV(\'Eze\',17,6);">17:6</a>). At a later period vine leaves or grape clusters figure prominently on Jewish coins or in architecture.<P>Three of our Lord\'s parables are connected with vineyards (<a onClick="return mV(\'Mat\',20,1);">Mt 20:1</a>ff; <a onClick="return mV(\'Mat\',21,28,33);">21:28,33</a>), and He has made the vine ever sacred in Christian symbolism by His teaching regarding the true vine (<a onClick="return mV(\'Jhn\',15,1);">Joh 15</a>).``117';
isbe[9095]='Vinegar`vin\'-e-ger (chomets; oxos): Vinegar, whose use as a condiment (<a onClick="return mV(\'Rth\',2,14);">Ru 2:14</a>) needs no comment, is formed when a saccharine fluid passes through a fermentation that produces acetic acid. In the ancient world vinegar was usually made of wine, although any fruit juice can be utilized in its manufacture, and "vinegar of strong drink" (palm juice?) is mentioned in <a onClick="return mV(\'Num\',6,3);">Nu 6:3</a>. Undiluted vinegar is of course undrinkable, and to offer it to a thirsty man is mockery (<a onClick="return mV(\'Psa\',69,21);">Ps 69:21</a>), but a mixture of water and vinegar makes a beverage that was very popular among the poor (Greek oxos, oxukraton, Latin posca—names applied also to diluted sour wine). It is mentioned in <a onClick="return mV(\'Num\',6,3);">Nu 6:3</a> (forbidden to the Nazirite) and again in the Gospels in the account of the Crucifixion. The executioners had brought it in a vessel (<a onClick="return mV(\'Jhn\',19,29);">Joh 19:29</a>) for their own use and at first "offered" it to Christ, while keeping it out of reach (<a onClick="return mV(\'Luk\',23,36);">Lu 23:36</a>). But at the end the drink was given Him on a sponge (<a onClick="return mV(\'Mar\',15,36);">Mr 15:36</a>; <a onClick="return mV(\'Mat\',27,48);">Mt 27:48</a>; <a onClick="return mV(\'Jhn\',19,29,30);">Joh 19:29,30</a>). In addition, the King James Version, following Textus Receptus of the New Testament, has "vinegar...mingled with gall" in <a onClick="return mV(\'Mat\',27,34);">Mt 27:34</a>, but this rests on a false reading, probably due to <a onClick="return mV(\'Psa\',69,21);">Ps 69:21</a>, and the Revised Version (British and American) rightly has "wine." Vinegar, like all acids, is injurious to the teeth (<a onClick="return mV(\'Pro\',10,26);">Pr 10:26</a>); and when it is combined with niter an effervescence is produced (<a onClick="return mV(\'Pro\',25,20);">Pr 25:20</a>). The appropriateness of the last figure, however, is obscure, and Septuagint reads "as vinegar on a wound," causing pain.``48';

isbe[9099]='Viol`vi\'-ol (nebhel, nebhel): the King James Version and the Revised Version (British and American) in <a onClick="return mV(\'Isa\',14,11);">Isa 14:11</a>; <a onClick="return mV(\'Amo\',5,23);">Am 5:23</a>; <a onClick="return mV(\'Amo\',6,5);">6:5</a>; the King James Version alone in <a onClick="return mV(\'Isa\',5,12);">Isa 5:12</a>, the Revised Version (British and American) "lute." "Viol" is derived from Latin vitella, a doublet of vitula, a "viol"; hence, French vielle, doublet of viole. The viol was a bowed instrument, the parent of the violin tribe, and is not a true equivalent for nebhel.`<a href="./study/isbe/search.html?string=MUSIC">MUSIC</a>`1';
isbe[9100]='Violence, Violent`vi\'-o-lens; vi\'-o-lent: Chiefly for gazal, qamac; bia, and their derivatives. Difficulty is offered only by the very obscure passage <a onClick="return mV(\'Mat\',11,12);">Mt 11:12</a> parallel <a onClick="return mV(\'Luk\',16,16);">Lu 16:16</a>. Both Matthew and Luke contain the verb biazetai, but this form maybe either a middle, "presses violently," "storms," or a passive, "is forced." Matthew, in addition, contains the adjective biastai, but whether this is a term of praise, "heroic enthusiasts," or of blame, "hot-headed revolutionaries," is again a problem. Nor can it be determined whether the words "from the days of John the Baptist until now" are meant to include or exclude the work of the Baptist himself. The difference in wording in Matthew and Luke further complicates the problem, and, in consequence, scholars are widely at variance as to the proper interpretation. "The Baptist has fanned a new Messianic storm of ill-advised insurrection," "the Pharisees have shamefully used forcible suppression of God\'s teachers," "the Kingdom of God comes like a storm and is received by those who have used drastic self-discipline," are instances of the differing explanations proposed.``48';
