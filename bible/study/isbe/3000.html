isbe[3077]='En-Rimmon`en-rim\'-on (\'en-rimmon, "the fountain of Rimmon" (see <a href="./study/isbe/search.html?string=RIMMON">RIMMON</a>), or perhaps "the spring of the pomegranate"; Eromoth, Rhemmon):<P>A city of Judah (<a onClick="return mV(\'Jos\',15,32);">Jos 15:32</a>), "Ain and Rimmon"; ascribed to Simeon (<a onClick="return mV(\'Jos\',19,7);">Jos 19:7</a>; <a onClick="return mV(\'1Ch\',4,32);">1Ch 4:32</a>, "Ain, Rimmon"). In <a onClick="return mV(\'Neh\',11,29);">Ne 11:29</a> mentioned as reinhabited after the Captivity. <a onClick="return mV(\'Zec\',14,10);">Zec 14:10</a>, runs: "All the land shall be made like the Arabah, from Geba to Rimmon, south of Jerusalem." It must have been a very southerly place. In the Eusebius, Onomasticon, ("Erimmon") it is described as a "very large village 16 miles south of Eleutheropolis." Kh. Umm er Rumamin, 9 miles north of Beersheba is the usually accepted site. See PEF, 398; Sh XXIV.``117';
isbe[3078]='En-Rogel`en-ro\'-gel (\'en roghel; pege Rhogel; meaning uncertain, but interpreted by some to mean "the spring of the fuller"):<P>No argument from this meaning can be valid because<P>(1) it is a very doubtful rendering and<P>(2) "fulling" vats are common in the neighborhood of most town springs and are today plentiful at both the proposed sites. G. A. Smith thinks "spring of the current," or "stream," from Syriac rogulo, more probable.<P>(1) En-rogel was an important landmark on the boundary between Judah and Benjamin (<a onClick="return mV(\'Jos\',15,7);">Jos 15:7</a>; <a onClick="return mV(\'Jos\',18,16);">18:16</a>). Here David\'s spies, Jonathan and Ahimaaz, hid themselves (<a onClick="return mV(\'2Sa\',17,17);">2Sa 17:17</a>), and here (<a onClick="return mV(\'1Ki\',1,9);">1Ki 1:9</a>) "Adonijah slew sheep and oxen and fatlings by the stone of Zoheleth, which is beside En-rogel," when he anticipated his father\'s death and caused himself rebelliously to be proclaimed king.<P>(2) The identification of this important landmark is of first-class importance in Jerusalem topography. Two sites have been proposed:<P>(a) The older view identifies En-rogel with the spring known variously as "the Virgin\'s Fount," \'Ain sitti Miriam and \'Ain Umm el deraj, an intermittent source of water which rises in a cave on the west side of the Kedron valley opposite Siloam (see <a href="./study/isbe/search.html?string=GIHON">GIHON</a>). The arguments that this is the one Jerusalem spring and that this must have been a very important landmark are inconclusive. The strongest argument for this view is that put forward by M. Clermont-Ganneau, who found that a rough rock surface on the mountain slope opposite, an ascent to the village of Silwan, is known as es Zechweleh, a word in which there certainly appears to linger an echo of Zoheleth. The argument is, however, not as convincing as it seems. Firstly, Zoheleth was a stone; this is a natural rock scarp; such a stone might probably have been transferred from place to place. Secondly, it is quite common for a name to be transferred some miles; instances are numerous. Thirdly, the writer, after frequent inquiries of the fellahin of Silwan, is satisfied that the name is by no means confined to the rock scarp near the spring, but to the whole ridge running along from here to, or almost to, Bir Eyyub itself. The strongest argument against this identification is, however, that there are so much stronger reasons for identifying the "Virgin\'s Fount" with Gihon (see <a href="./study/isbe/search.html?string=GIHON">GIHON</a>), and that the two springs En-rogel and Gihon cannot be at one site, as is clear from the narrative in <a onClick="return mV(\'1Ki\',1,\'1-\');">1Ki 1</a>.<P>(b) The view which places En-rogel at Bir Eyyub in every way harmonizes with the Bible data. It has been objected that the latter is not a spring but a well. It is today a well, 125 ft. deep, but one with an inexhaustible supply—there must be a true spring at the bottom. Probably one reason it only overflows today after periods of heavy rain is that such enormous quantities of debris have now covered the original valley bed that the water cannot rise to the surface; much of it flows away down the valley deep under the present surface. The water is brackish and is impregnated with sewage, which is not extraordinary when we remember that a large part of the rock strata from which the water comes is overlaid by land constantly irrigated with the city\'s sewage.<P>Although the well may itself be of considerable antiquity, there is no need to insist that this is the exact position of the original spring En-rogel. The source may in olden times have arisen at some spot in the valley bottom which is now deeply buried under the rubbish, perhaps under the southernmost of the irrigated gardens of the fellahin of Silwan. The neighborhood, at the junction of two deep valleys—not to count the small el wad, the ancient Tyropceon—is a natural place for a spring. There would appear to have been considerable disturbance here. An enormous amount of debris from various destructions of the city has collected here, but, besides this, Josephus records a tradition which appears to belong to this neighborhood. He says (Ant., IX, x, 4) that an earthquake took place once at Eroge—which appears to be En-rogel—when "half of the mountain broke off from the remainder on the west, and rolling 4 furlongs, came to stand on the eastern mountain till the roads, as well as the king\'s gardens, were blocked." It is sufficient that En-rogel is to be located either at Bir Eyyub or in its immediate neighborhood; for practical purposes the former will do. En-rogel was an important point on the boundary line between Judah and Benjamin. The line passed down the lower end of the Kidron valley, past En-rogel (Bir Eyyub) and then up the Valley of Hinnom (Wady er Rababi)—a boundary well adapted to the natural conditions.<P>With regard to David\'s spies (<a onClick="return mV(\'2Sa\',17,17);">2Sa 17:17</a>), whereas the Virgin\'s Fount—the great source of the city\'s water supply (see <a href="./study/isbe/search.html?string=GIHON">GIHON</a>)—just below the city walls (see <a href="./study/isbe/search.html?string=ZION">ZION</A>) was an impossible place of hiding, this lower source, out of sight of almost the whole city and removed a considerable distance from its nearest point, was at least a possible place. Further, the facts that it was off the main road, that it afforded a supply of one of the main necessities of life—water—and that there were, as there are today, many natural caves in the neighborhood, greatly added to its suitability.<P>Here too was a most appropriate place for Adonijah\'s plot (<a onClick="return mV(\'1Ki\',1,9);">1Ki 1:9</a>). He and his confederates dared not go to Gihon, the original sacred spring, but had to content themselves with a spot more secluded, though doubtless still sacred. It is recorded (<a onClick="return mV(\'1Ki\',1,40,41);">1Ki 1:40-41</a>) that the adherents of Solomon saluted him at Gihon (the Virgin\'s Fount) and the people "rejoiced with great joy, so that the earth rent with the sound of them. And Adonijah and all the guests that were with him (at En-rogel) heard it as they had made an end of eating." The relative positions of these two springs allow of a vivid reconstruction of the narrative as do no other proposed identifications. The two spots are out of sight the one of the other, but not so far that the shout of a multitude at the one could not be carried to the other.``117';
isbe[3079]='En-Shemesh`en-she\'-mesh (\'en shemesh, "spring of the sun"):<P>An important landmark on the boundary line between Judah and Benjamin (<a onClick="return mV(\'Jos\',15,7);">Jos 15:7</a>; <a onClick="return mV(\'Jos\',18,17);">18:17</a>).<P>The little spring \'Ain el chand, east of Bethany, the last spring on the road descending to Jericho, seems to suit the conditions. \'Ain el chaud is usually called the "Apostles\' Fountain" by Christians, on account of a tradition dating from the 15th century that the apostles drank there.``1';
isbe[3080]='En-Tappuah`en-tap\'-u-a, en-ta-pu\'-a (\'en tappuach; pege Thaphthoth, "apple spring"):<P>Probably in the land of Tappuah which belonged to Manasseh, although Tappuah, on the border of Manasseh, belonged to Ephraim (<a onClick="return mV(\'Jos\',17,7);">Jos 17:7</a>f). It lay on the border of Ephraim which ran southward east of Shechem, and is probably to be identified with the spring at Yasuf, about 3 miles north of Lebonah.``1';
isbe[3081]='Enable`en-a\'-b\'-l:<P>Only in <a onClick="return mV(\'1Ti\',1,12);">1Ti 1:12</a> (the King James Version and the Revised Version (British and American)) in the sense of "strengthen" (Greek endunamoo, "endue with strength").``1';
isbe[3082]='Enaim`e-na\'-im (\'enayim, "place of a fountain"; Ainan; <a onClick="return mV(\'Gen\',38,14);">Ge 38:14</a> (the King James Version "in an open place"; <a onClick="return mV(\'Gen\',38,21);">Ge 38:21</a> the King James Version "openly")):<P>A place which lay between Adullam and Timnath; probably the same as Enam (<a onClick="return mV(\'Jos\',15,34);">Jos 15:34</a>). Also mentioned in close connection with Adullam. It was in the Shephelah of Judah. The Talmud (Pesik. Rab. 23) mentions a Kephar Enaim. Conder proposes Khurbet Wady \'Alin, which is an ancient site, evidently of great strength and importance, lying between Kh. \'Ain Shems and the village of Deir Aban. The ruins crown a lofty and almost isolated hill; the greatest objection to the identification is that there is no fountain at all in the immediate neighborhood. There may have been one in earlier times.``117';
isbe[3083]='Enam`e\'-nam.`<a href="./study/isbe/search.html?string=ENAN">ENAN</a>`1';
isbe[3084]='Enan`e\'-nan (\'enan, "having fountains," or "eyes," i.e. "keen-eyed"; in Septuagint Ainan):<P>The father of Ahira, and prince of Naphtali at the first census of Israel (<a onClick="return mV(\'Num\',1,15);">Nu 1:15</a>; <a onClick="return mV(\'Num\',2,29);">2:29</a>; <a onClick="return mV(\'Num\',7,78,83);">7:78, 83</a>; <a onClick="return mV(\'Num\',10,27);">10:27</a>).``1';
isbe[3085]='Enasibus`e-nas\'-i-bus (Enasibos, 1Esdras 9:34):<P>Corresponding to "Eliashib" in <a onClick="return mV(\'Ezr\',10,36);">Ezr 10:36</a>.``1';
isbe[3086]='Encampment`en-kamp\'-ment.`<a href="./study/isbe/search.html?string=WAR;+WARFARE">WAR</a>`1';
isbe[3087]='Encampment By the Red Sea`According to the version of the wanderings of Israel given in <a onClick="return mV(\'Num\',33,\'1-\');">Nu 33</a>, they "encamped by the Red Sea" (<a onClick="return mV(\'Num\',33,10);">Nu 33:10</a>) after leaving Elim and before entering the Wilderness of Sin.`<a href="./study/isbe/search.html?string=WANDERINGS+OF+ISRAEL">WANDERINGS OF ISRAEL</a>`1';
isbe[3088]='Enchantment`en-chant\'-ment:<P>The occult arts, either supposedly or pretentiously supernatural, were common to all oriental races. They included enchantment, sorcery, witchcraft, sooth-saying, augury, necromancy, divination in numberless forms, and all kinds of magic articles. Nine varieties are mentioned in one single passage in the Pentateuch (<a onClick="return mV(\'Deu\',18,10,11);">De 18:10-11</a>); other varieties in many passages both in the Old Testament and New Testament, eg. <a onClick="return mV(\'Lev\',19,26,31);">Le 19:26, 31</a>; <a onClick="return mV(\'Isa\',2,6);">Isa 2:6</a>; <a onClick="return mV(\'Isa\',57,3);">57:3</a>; <a onClick="return mV(\'Jer\',27,9);">Jer 27:9</a>; <a onClick="return mV(\'Mic\',5,12);">Mic 5:12</a>; <a onClick="return mV(\'Act\',8,9,11);">Ac 8:9, 11</a>; <a onClick="return mV(\'Act\',13,6,8);">13:6, 8</a>; <a onClick="return mV(\'Gal\',5,20);">Ga 5:20</a>; <a onClick="return mV(\'Rev\',9,21);">Re 9:21</a>.<P>The extent of the magic arts (forbidden under Judaism and Christianity) may incidentally be seen from the fact that the Scriptures alone refer to their being practiced in Chaldea (<a onClick="return mV(\'Dan\',5,11);">Da 5:11</a>), Babylon (<a onClick="return mV(\'Eze\',21,21);">Eze 21:21</a>), Assyria (<a onClick="return mV(\'2Ki\',17,17);">2Ki 17:17</a>), Egypt (<a onClick="return mV(\'Exd\',7,11);">Ex 7:11</a>), Canaan (<a onClick="return mV(\'Lev\',18,3,11);">Le 18:3, 11</a>; <a onClick="return mV(\'Lev\',19,26,31);">19:26, 31</a>), Asia (Ephesus, <a onClick="return mV(\'Act\',19,13,19);">Ac 19:13, 19</a>), Greece (<a onClick="return mV(\'Act\',16,16);">Ac 16:16</a>), Arabia also, as "customs from the East," etc. (<a onClick="return mV(\'Isa\',2,6);">Isa 2:6</a>) indicates. These secret arts were prohibited by the laws of Moses (<a onClick="return mV(\'Deu\',18,\'9-12\');">De 18:9-12</a>), inasmuch as they constituted a peculiar temptation to Israel to apostatize. They were a constant incentive to idolatry, clouded the mind with superstition, tended and were closely allied to imposture (<a onClick="return mV(\'Mat\',24,24);">Mt 24:24</a>). The term "enchantment" is found only in the Old Testament and its Hebrew originals indicate its varieties.<P>(1) latim, and lehatim "to wrap up," "muffie," "cover," hence, "clandestine," "secret." It was this hidden element that enabled the magicians of Egypt to impose on the credulity of Pharaoh in imitating or reproducing the miracles of Moses and Aaron; "They...did in like manner with their enchantments" (<a onClick="return mV(\'Exd\',7,11,22);">Ex 7:11, 22</a>). Their inability to perform a genuine miracle is shown by <a onClick="return mV(\'Exd\',8,18);">Ex 8:18</a>.<P>(2) nachash, "to hiss," "whisper" referring to the mutterings of sorcerers in their incantations. Used as a derivative noun this Hebrew word means "a serpent." This involves the idea of cunning and subtlety. Although employed in the wider sense of augury or prognostication, its fundamental meaning is divination by serpents. This was the form of enchantment sought by Balaam (<a onClick="return mV(\'Num\',24,1);">Nu 24:1</a>). Its impotence against the people of God is shown by <a onClick="return mV(\'Num\',23,23);">Nu 23:23</a> margin. Shalmaneser forced this forbidden art upon the Israelites whom he carried captive to Assyria (<a onClick="return mV(\'2Ki\',17,17);">2Ki 17:17</a>). It was also one of the heathen practices introduced during the apostasy under Ahab, against which Elijah protested (compare <a onClick="return mV(\'1Ki\',21,20);">1Ki 21:20</a>).<P>(3) lachash, "to whisper," "mutter," an onomatopoetic word, like the above, in imitation of the hiss of serpents. It is used of the offensive practice of serpent charming referred to in <a onClick="return mV(\'Ecc\',10,11);">Ec 10:11</a>, and as Delitzsch says, in the place cited., "signifies the whispering of formulas of charming." See also <a onClick="return mV(\'Isa\',3,3);">Isa 3:3</a>, "skilful enchanter"; <a onClick="return mV(\'Jer\',8,17);">Jer 8:17</a>, "serpents, cockatrices (the Revised Version (British and American) "adders")...which will not be charmed"; <a onClick="return mV(\'Psa\',58,4,5);">Ps 58:4-5</a>, "the voice of charmers (the Revised Version, margin "enchanters"), charming never so wisely." Ophiomancy, the art of charming serpents, is still practiced in the East.<P>(4) chebher, "spell," from chabhar, "to bind," hence, "to bind with spells," "fascinate," "charm," descriptive of a species of magic practiced by binding knots. That this method of imposture, eg. the use of the magic knot for exorcism and other purposes, was common, is indicated by the monuments of the East. The moral mischief and uselessness of this and other forms of enchantment are clearly shown in <a onClick="return mV(\'Isa\',47,9,12);">Isa 47:9, 12</a>. This word is also used of the charming of serpents (<a onClick="return mV(\'Deu\',18,11);">De 18:11</a>; <a onClick="return mV(\'Psa\',58,5);">Ps 58:5</a>).<P>(5) \'anan, "to cover," "to cloud," hence, "to use covert arts." This form of divination was especially associated with idolatry (so Gesenius, Hebrew Lexicon). Delitzsch, however, in a note on this word (<a onClick="return mV(\'Isa\',2,6);">Isa 2:6</a>), doubts the meaning "conceal" and thinks that it signifies rather "to gather auguries from the clouds." He translates it "cloud-interpretive" (<a onClick="return mV(\'Mic\',5,12);">Mic 5:12</a>). This view is not generally supported. Rendered "enchanters" (<a onClick="return mV(\'Jer\',27,9);">Jer 27:9</a>, the Revised Version (British and American) "soothsayers"; so also in <a onClick="return mV(\'Isa\',2,6);">Isa 2:6</a>). Often translated in the Revised Version (British and American) "practice augury," as in <a onClick="return mV(\'Lev\',19,26);">Le 19:26</a>; <a onClick="return mV(\'Deu\',18,10,14);">De 18:10, 14</a>; <a onClick="return mV(\'2Ki\',21,6);">2Ki 21:6</a>; <a onClick="return mV(\'2Ch\',33,6);">2Ch 33:6</a>; a form of magical art corresponding in many respects to that of the Greek mantis, who uttered oracles in a state of divine frenzy. Septuagint kledonizomai, i.e. augury through the reading or acceptance of a sign or omen. A kindred form of enchantment is mentioned in the New Testament (<a onClick="return mV(\'2Ti\',3,13);">2Ti 3:13</a>; Greek goetes, "enchanters," "jugglers," the original indicating that the incantations were uttered in a kind of howl; rendered "seducers" the King James Version, "impostors" the Revised Version (British and American); compare <a onClick="return mV(\'Rev\',19,20);">Re 19:20</a>). The New Testament records the names of several magicians who belonged to this class of conscious impostors: Simon Magus (<a onClick="return mV(\'Act\',8,9);">Ac 8:9</a>); Bar-Jesus and Elymas (<a onClick="return mV(\'Act\',13,6,8);">Ac 13:6, 8</a>); the slave girl with the spirit of Python ("divination," <a onClick="return mV(\'Act\',16,16);">Ac 16:16</a>); "vagabond (the Revised Version (British and American) "strolling") Jews, exorcists" (<a onClick="return mV(\'Act\',19,13);">Ac 19:13</a>; compare <a onClick="return mV(\'Luk\',11,19);">Lu 11:19</a>); also the magicians of Moses\' day, named Jannes and Jambres (<a onClick="return mV(\'2Ti\',3,8);">2Ti 3:8</a>).<P>All these forms of enchantment claimed access through supernatural insight or aid, to the will of the gods and the secrets of the spirit world. In turning away faith and expectation from the living God, they struck a deadly blow at the heart of true religion. From the enchanters of the ancient Orient to the medicine-men of today, all exponents of the "black art" exercise a cruel tyranny over the benighted people, and multitudes of innocent victims perish in body and soul under their subtle impostures. In no respect is the exalted nature of the Hebrew and Christian faiths more clearly seen than in their power to emancipate the human mind and spirit from the mental and moral darkness, the superstition and fear, and the darkening effect of these occult and deadly articles.``139';
isbe[3089]='End`qets, \'ephec, kalah; telos, sunteleo:<P>The end of anything is its termination, hence, also, final object or purpose.<P>It is the translation of several Hebrew and Greek words, chiefly in the Old Testament of qets (properly, "a cutting off") and other words from the same root (<a onClick="return mV(\'Gen\',6,13);">Ge 6:13</a>, "The end of all flesh is come before me"); \'acharith, "hinder part," is also frequently translated "end" (<a onClick="return mV(\'Deu\',11,12);">De 11:12</a>; <a onClick="return mV(\'Psa\',37,37,38);">Ps 37:37-38</a>, American Revised Version: "There is a happy end to the man of peace...The end of the wicked shall be cut off"; the English Revised Version "latter end" (<a onClick="return mV(\'Psa\',37,37);">Ps 37:37</a>), margin "reward" or "future posterity"; <a onClick="return mV(\'Psa\',73,17);">Ps 73:17</a>; <a onClick="return mV(\'Jer\',5,31);">Jer 5:31</a>); coph (from cuph "to come to an end") is several times translated "end" (<a onClick="return mV(\'2Ch\',20,16);">2Ch 20:16</a>; <a onClick="return mV(\'Ecc\',3,11);">Ec 3:11</a>; <a onClick="return mV(\'Ecc\',7,2);">7:2</a>). "End" in the sense of purpose is the translation of lema\'an, "to the intent" (<a onClick="return mV(\'Exd\',8,22);">Ex 8:22</a>, "to the end thou mayest know"), and of dibhrah (from dabhar, "to speak"); <a onClick="return mV(\'Ecc\',7,14);">Ec 7:14</a> "to the end that man should find nothing after him" (the Revised Version (British and American) "should not find out anything (that shall be) after him"). "Ends of the earth" is the translation of \'ephec, "extremities" (<a onClick="return mV(\'Deu\',33,17);">De 33:17</a>; <a onClick="return mV(\'Psa\',22,27);">Ps 22:27</a>), also of kanaph, "wing" (<a onClick="return mV(\'Job\',37,3);">Job 37:3</a>; <a onClick="return mV(\'Job\',38,13);">38:13</a>). Other words are netsah, "utmost" (<a onClick="return mV(\'Job\',34,36);">Job 34:36</a>), tequphah, "circuit," "revolution" (<a onClick="return mV(\'Exd\',34,22);">Ex 34:22</a>; <a onClick="return mV(\'2Ch\',24,23);">2Ch 24:23</a>, the Revised Version, margin "revolution"), etc. The verb occurs almost invariably in the phrase "to make an end," as the translation of kalah, "to finish," "complete" (<a onClick="return mV(\'Gen\',17,3);">Ge 17:3</a>; <a onClick="return mV(\'Deu\',20,9);">De 20:9</a>; <a onClick="return mV(\'Jer\',26,8);">Jer 26:8</a>, etc.); also of nalah, "to complete" (<a onClick="return mV(\'Isa\',33,1);">Isa 33:1</a>), and shalam, "to finish" (<a onClick="return mV(\'Isa\',38,12,13);">Isa 38:12-13</a>).<P>In <a onClick="return mV(\'Dan\',9,24);">Da 9:24</a>, the Iteb text has chatham, "to seal up" ("to complete or finish"), but the margin, followed by the King James Version, the Revised Version (British and American), Driver and most moderns, has hathem, "to finish," "end," "complete," a difference of one letter, but practically none in the sense, "to bring to an end"; compare "to finish the transgression," which precedes.<P>In the New Testament the common word for "end" is telos "an end," "completion," "termination" (<a onClick="return mV(\'Mat\',10,22);">Mt 10:22</a>; <a onClick="return mV(\'Mat\',24,6);">24:6</a>; <a onClick="return mV(\'Jhn\',13,1);">Joh 13:1</a>, the Revised Version, margin "to the uttermost"; <a onClick="return mV(\'Rom\',6,21);">Ro 6:21</a>, "The end of those things is death"; <a onClick="return mV(\'Rom\',6,22);">Ro 6:22</a>, "the end eternal life; <a onClick="return mV(\'Rom\',10,4);">Ro 10:4</a>, Christ is the end of the law unto righteousness"; <a onClick="return mV(\'Rev\',21,6);">Re 21:6</a>; <a onClick="return mV(\'Rev\',22,13);">Re 22:13</a>, etc.); ekbasis, "outgoing" (<a onClick="return mV(\'Hbr\',13,7);">Heb 13:7</a>, the Revised Version (British and American) "issue"); sunteleia, "full end," is used of "the end of the world" (<a onClick="return mV(\'Mat\',13,39);">Mt 13:39</a>; <a onClick="return mV(\'Hbr\',9,26);">Heb 9:26</a>); peras, "extremity," "the ends of the world" (<a onClick="return mV(\'Rom\',10,18);">Ro 10:18</a>); akros, "a point, end" (<a onClick="return mV(\'Mat\',24,31);">Mt 24:31</a>, "from one end of heaven to the other"). End as purpose is the translation of eis to, "with a view to" (<a onClick="return mV(\'Act\',7,19);">Ac 7:19</a>; <a onClick="return mV(\'Rom\',1,11);">Ro 1:11</a>; <a onClick="return mV(\'Rom\',4,16);">4:16</a>; <a onClick="return mV(\'1Th\',3,13);">1Th 3:13</a>); of eis touto, "unto this" (<a onClick="return mV(\'Jhn\',18,37);">Joh 18:37</a>; <a onClick="return mV(\'Rom\',14,9);">Ro 14:9</a>; <a onClick="return mV(\'2Cr\',2,9);">2Co 2:9</a>); of pros to, "toward this" (<a onClick="return mV(\'Luk\',18,1);">Lu 18:1</a>). "To end" (verb) is pleroo, "to fill up" (<a onClick="return mV(\'Luk\',7,1);">Lu 7:1</a>; <a onClick="return mV(\'Act\',19,21);">Ac 19:21</a>); once ginomai, "to become" (<a onClick="return mV(\'Jhn\',13,2);">Joh 13:2</a>, "supper being ended," which the Revised Version (British and American) corrects, giving, "during supper").<P>For "end" the Revised Version (British and American) has "uttermost part" (<a onClick="return mV(\'Jos\',15,8);">Jos 15:8</a>, etc.), "latter end" (<a onClick="return mV(\'Psa\',73,17);">Ps 73:17</a>; the English Revised Version<a onClick="return mV(\'Psa\',37,38);">ps 37:38</a>; <a onClick="return mV(\'Pro\',5,4);">Pr 5:4</a>); "issue" (<a onClick="return mV(\'Dan\',12,8);">Da 12:8</a>, margin "latter end"; <a onClick="return mV(\'Hbr\',13,7);">Heb 13:7</a>); "side" (<a onClick="return mV(\'Eze\',41,12);">Eze 41:12</a>). Conversely, it has "end" for "uttermost part" (<a onClick="return mV(\'Jos\',15,5);">Jos 15:5</a>); for "side" (<a onClick="return mV(\'Deu\',4,32);">De 4:32</a>); for "conclusion" (<a onClick="return mV(\'Ecc\',12,13);">Ec 12:13</a>); for "an end" (<a onClick="return mV(\'Pro\',23,18);">Pr 23:18</a>); "a reward," margin "sequel" or "future," Hebrew "latter end"; "final" (<a onClick="return mV(\'Hbr\',6,16);">Heb 6:16</a>); for "an end of" (<a onClick="return mV(\'Job\',18,2);">Job 18:2</a>), "snares for" (the American Standard Revised Version "hunt for"); for "at one end" (<a onClick="return mV(\'Jer\',51,31);">Jer 51:31</a>), "on every quarter"; for "until the day and night come to an end" (<a onClick="return mV(\'Job\',26,10);">Job 26:10</a>), "unto the confines of light and darkness"; for "have an end" (<a onClick="return mV(\'Luk\',22,37);">Lu 22:37</a>), "hath fulfillment," margin, Greek "end"; for "to the end for" (<a onClick="return mV(\'1Pe\',1,13);">1Pe 1:13</a>), "perfectly on"; "at the end of" for "in these last days" (<a onClick="return mV(\'Hbr\',1,2);">Heb 1:2</a>); "His end was nigh" for "He died" (<a onClick="return mV(\'Hbr\',11,22);">Heb 11:22</a>); "its own end," instead of "for himself" (<a onClick="return mV(\'Pro\',16,4);">Pr 16:4</a>, margin "his own purpose"); "neither is there any end to" instead of "for thine iniquities are infinite" (<a onClick="return mV(\'Job\',22,5);">Job 22:5</a>); "to this end" for "therefore" (<a onClick="return mV(\'Mar\',1,38);">Mr 1:38</a>; <a onClick="return mV(\'1Ti\',4,10);">1Ti 4:10</a>); for "for this cause," "to this end" (<a onClick="return mV(\'Jhn\',18,37);">Joh 18:37</a> twice), "unto this end" (<a onClick="return mV(\'1Pe\',4,6);">1Pe 4:6</a>); "to this end" for "for this purpose" (<a onClick="return mV(\'Act\',26,16);">Ac 26:16</a>; <a onClick="return mV(\'1Jo\',3,8);">1Joh 3:8</a>); "to which end" for "wherefore" (<a onClick="return mV(\'2Th\',1,11);">2Th 1:11</a>); "to the end" is inserted in <a onClick="return mV(\'Gen\',18,19);">Ge 18:19</a> bis, and several other passages.<P>For "ends of the earth" see <a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY, sec. III, 2</a>.``185';
isbe[3090]='End of the World``<a href="./study/isbe/search.html?string=ESCHATOLOGY">ESCHATOLOGY</a>; <a href="./study/isbe/search.html?string=WORLD+END+OF+THE">WORLD, END OF THE</a>`1';
isbe[3091]='Endamage`en-dam\'-aj:<P>Archaic for "damage"; <a onClick="return mV(\'Ezr\',4,13);">Ezr 4:13</a> the King James Version: "Thou shalt damage the revenue of the kings," the Revised Version (British and American) "It will be hurtful unto the kings" (Aramaic nezaq); compare 1Esdras 6:33.``1';
isbe[3092]='Endeavor`en-de\'-ver:<P>The sense of this word has suffered weakening since the time of the King James Version. Then it implied utmost exertion and success; now rather forlorn hope and possible failure. Thus the Revised Version (British and American) reads "giving diligence," "give diligence," for the King James Version "endeavoring," "endeavor," in <a onClick="return mV(\'Eph\',4,3);">Eph 4:3</a>; <a onClick="return mV(\'2Pe\',1,15);">2Pe 1:15</a>, respectively; but "endeavored" is suffered to remain in <a onClick="return mV(\'1Th\',2,17);">1Th 2:17</a> (spoudazo, "hasten," "exert oneself"). Compare also <a onClick="return mV(\'Act\',16,10);">Ac 16:10</a>, the King James Version "endeavored," the Revised Version (British and American) "sought" (Greek zeteo, "seek").``1';
isbe[3093]='Endirons`end\'-i-urnz (shephattayim):<P>Used once (<a onClick="return mV(\'Eze\',40,43);">Eze 40:43</a> the King James Version) in the margin only. In text, both the King James Version and the Revised Version (British and American), "hooks," denoting stalls or places for the fastening of victims for sacrifice, or perhaps the two hearthstones. The term is a corruption from another word similar in form and identity of usage. This word, "andiron," from Middle English, has assumed many peculiar forms, as "anderne," "aundirne," from which the form is doubtless derived, though this is not the original and has no relation to it. the American Revised Version, margin reads, "According to Vulgate (Jerome\'s Latin Bible, 390-405 AD.) and Syriac, ledges."``1';
isbe[3094]='Endless`end\'-les (akatalutos (<a onClick="return mV(\'Hbr\',7,16);">Heb 7:16</a>), aperantos (<a onClick="return mV(\'1Ti\',1,4);">1Ti 1:4</a>)):<P>This English word occurs twice in the New Testament, and is there represented by the two Greek words above noted.<P>(1) In <a onClick="return mV(\'Hbr\',7,16);">Heb 7:16</a> Jesus is said to be a priest "after the power of an endless life." The word means literally, as in the Revised Version, margin, "indissoluble." It is not simply that Christ\'s priesthood was eternal. The priesthood was based upon His possession, by nature, of a life which in time and eternity death could not touch. This distinguished Him essentially from priests under the law.<P>(2) In <a onClick="return mV(\'1Ti\',1,4);">1Ti 1:4</a>, Paul warns Timothy against giving heed in his ministry to "fables (muthoi) and endless (limitless) genealogies." The allusion seems to be to the series of emanations (aeons) in Gnostic speculation, to which no limit could be set.<P>Distinct from the above are the words denoting "<a href="./study/isbe/search.html?string=EVERLASTING">everlasting</a>," "<a href="./study/isbe/search.html?string=ETERNAL">eternal</a>," which see.``132';
isbe[3095]='Endow; Endue`en-dou\', en-du\':<P>"Endow" meant originally "to provide with a dowry"; "indue" took the meaning "clothe"; the likeness between the literal meanings has confused the metaphorical use of the words in spite of their difference in origin. Thus we find in <a onClick="return mV(\'Gen\',30,20);">Ge 30:20</a>, the King James Version "endued me with a good dowry" the Revised Version (British and American) "endowed" (zabhadh, "bestow upon," "endow"); <a onClick="return mV(\'Exd\',22,16);">Ex 22:16</a>, the King James Version "endow her to be his wife" the Revised Version (British and American) "pay a dowry for her" mahar, "purchase" "endow"; compare <a onClick="return mV(\'Deu\',22,29);">De 22:29</a>; <a onClick="return mV(\'2Ch\',2,12,13);">2Ch 2:12-13</a>, the King James Version and the Revised Version (British and American) "endued" with understanding (from yadha\', "know"); and <a onClick="return mV(\'Luk\',24,49);">Lu 24:49</a>, the King James Version "endued with power," the Revised Version (British and American) "clothed" (enduo, "clothe").``57';
isbe[3096]='Ends of the Earth``<a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>`1';
isbe[3097]='Endure`en-dur\':<P>Used in the Bible<P>(1) in the sense of "continue," "last," as in <a onClick="return mV(\'Psa\',9,7);">Ps 9:7</a>, "The Lord shall endure for ever" (the American Standard Revised Version "Yahweh sitteth as king forever"); <a onClick="return mV(\'Psa\',30,5);">Ps 30:5</a>, "Weeping may endure for a night" (the Revised Version (British and American) "tarry" margin "may come in to lodge at even"); <a onClick="return mV(\'Jhn\',6,27);">Joh 6:27</a>, "the meat which endureth," the King James Version, the Revised Version (British and American) "the food which abideth";<P>(2) in the sense of "bear" (<a onClick="return mV(\'Hbr\',12,20);">Heb 12:20</a>): "bear up under," hardship, persecution, etc. (<a onClick="return mV(\'2Ti\',3,11);">2Ti 3:11</a>; <a onClick="return mV(\'1Pe\',2,19);">1Pe 2:19</a>); "to remain under" (<a onClick="return mV(\'Hbr\',10,32);">Heb 10:32</a>; <a onClick="return mV(\'Hbr\',12,2);">12:2</a>; <a onClick="return mV(\'Jam\',1,12);">Jas 1:12</a>; <a onClick="return mV(\'Jam\',5,11);">5:11</a>); "to be strong, firm" (<a onClick="return mV(\'Hbr\',11,27);">Heb 11:27</a>); "to persevere" beneath a heavy burden (<a onClick="return mV(\'Mat\',10,22);">Mt 10:22</a>).``1';
isbe[3098]='Enemessar`en-e-mes\'-ar (Enemessar, Enemessaros):<P>Generally allowed, since Grotius, to be a corruption, though occasionally defended as an alternative form, of Shalmaneser (Tobit 1:2,15, etc.) who carried Israel captive to Nineveh, as related in 2 Kings. Among the captives was Tobit, taken from Thisbe in Gilead, where the prophet Elijah was born and for a time lived. The writer of Tobit makes Sennacherib the son (1:15), as well as the successor of Enemessar, whereas, according to the Assyrian inscriptions, Sennacherib was the son of Sargon. This is only one of several serious historical difficulties in the narrative of Tobit. The corruption of the name is variously explained. Rawlinson supposes the first syllable of the word "Shal" to have been dropped, comparing the Bupalussor of Abydenus for Nabopolassar. Dr. Pinches takes Enemessar for Senemessar, the "sh" being changed to "s" and then to the smooth breathing, though the rough breathing more commonly takes the place of a dropped "s"; both scholars admit the easy transposition of the liquids "m" and "n". Shalman-asharid is the Assyrian form of Shalmaneser.``79';
isbe[3099]='Enemy`en\'-e-mi (\'oyebh, tsar, tsar; echthros):<P>"Enemy," "enemies," are frequent words in the Old Testament. The Hebrew word most often so translated is \'oyebh, meaning perhaps literally, "one who hates"; very frequent in the Psalms, eg. <a onClick="return mV(\'Psa\',3,7);">3:7</a>; <a onClick="return mV(\'Psa\',6,10);">6:10</a>; <a onClick="return mV(\'Psa\',7,5);">7:5</a>; <a onClick="return mV(\'Psa\',8,2);">8:2</a>; <a onClick="return mV(\'Psa\',9,3,6);">9:3, 6</a>; <a onClick="return mV(\'Psa\',13,2);">13:2</a>, where the cry is often for deliverance from enemies. Another word for "enemy," found chiefly in the poetical books, is tsar, or tsar, "distresser," "straitener" (<a onClick="return mV(\'Num\',10,9);">Nu 10:9</a>; <a onClick="return mV(\'Job\',16,9);">Job 16:9</a>; <a onClick="return mV(\'Psa\',27,2,12);">Ps 27:2, 12</a>, the Revised Version (British and American) "adversary," etc.); also tsarar (<a onClick="return mV(\'Est\',3,10);">Es 3:10</a>; <a onClick="return mV(\'Psa\',8,2);">Ps 8:2</a>; <a onClick="return mV(\'Psa\',10,5);">10:5</a> the King James Version, etc.). Other words are \'ar, "one awake" (<a onClick="return mV(\'1Sa\',28,16);">1Sa 28:16</a> the King James Version; <a onClick="return mV(\'Dan\',4,19);">Da 4:19</a> the King James Version); sane\', perhaps, "to be sharp or bite" (<a onClick="return mV(\'Exd\',1,10);">Ex 1:10</a>; <a onClick="return mV(\'Pro\',25,21);">Pr 25:21</a>; <a onClick="return mV(\'Pro\',27,6);">27:6</a>); sharar, "to watch" (<a onClick="return mV(\'Psa\',5,8);">Ps 5:8</a>; <a onClick="return mV(\'Psa\',27,11);">27:11</a>), and qum, "to stand up," or "withstand" (<a onClick="return mV(\'Exd\',32,25);">Ex 32:25</a>).<P>In the New Testament echthros, "enemy," "opponent," is the only word translated "enemy" (<a onClick="return mV(\'Mat\',5,43,44);">Mt 5:43-44</a>; <a onClick="return mV(\'Mar\',12,36);">Mr 12:36</a>; <a onClick="return mV(\'Luk\',1,71,74);">Lu 1:71, 74</a>, etc.; <a onClick="return mV(\'Rom\',5,10);">Ro 5:10</a>; <a onClick="return mV(\'Rom\',11,28);">11:28</a>, etc.), once with anthropos ("a man"), joined to echthros (<a onClick="return mV(\'Mat\',13,28);">Mt 13:28</a>).<P>In the Revised Version (British and American) "adversary" is frequently substituted for "enemy" (<a onClick="return mV(\'Num\',24,8);">Nu 24:8</a>; <a onClick="return mV(\'Deu\',32,41);">De 32:41</a>; <a onClick="return mV(\'Psa\',6,7);">Ps 6:7</a>; <a onClick="return mV(\'Psa\',7,6);">7:6</a>; <a onClick="return mV(\'Psa\',44,10);">44:10</a>, etc.); for "O thou enemy," etc. (<a onClick="return mV(\'Psa\',9,6);">Ps 9:6</a>) we have "The enemy are come to an end"; instead of "When the enemy shall come in like a flood, the Spirit of the Lord shall lift up a standard against him" (<a onClick="return mV(\'Isa\',59,19);">Isa 59:19</a>) we have "For he will come as a rushing stream, which the breath of Yahweh driveth" (with the text of the King James Version in margins); for "The fire of thine enemies shall devour them" (<a onClick="return mV(\'Isa\',26,11);">Isa 26:11</a>), "Fire shall devour thine adversaries" (text of the King James Version in the margin).<P>The frequent reference to enemies in the Old Testament is what we should expect to see in these early times on the part of a people settling in a land that had been occupied by other tribes, worshipping other gods. The spirit of their law was that expressed by our Lord in His Sermon on the Mount, "Thou shalt love thy neighbor, and hate thine enemy." This He changed: "but I say unto you, Love your enemies." An approach toward this spirit had been made in the later prophets by their inclusion of the whole world under one God, who had a gracious purpose toward all, but the near statement of it we only find in <a onClick="return mV(\'Pro\',25,21);">Pr 25:21</a> (quoted by Paul, <a onClick="return mV(\'Rom\',12,20);">Ro 12:20</a>). See also <a onClick="return mV(\'Exd\',23,4);">Ex 23:4</a>, and compare <a onClick="return mV(\'2Ki\',6,22);">2Ki 6:22</a>; <a onClick="return mV(\'2Ch\',28,15);">2Ch 28:15</a>.``185';
isbe[3100]='Eneneus`e-ne\'-ne-us, en-e-ne-us (Enenios; the King James Version Enenius, the Revised Version, margin "Enenis"):<P>Occurring only in Apocrypha. According to 1Esdras 5:8, Eneneus was one of the 12 leaders over the returning exiles from Babylon under Zerubbabel. <a onClick="return mV(\'Ezr\',2,\'1-\');">Ezr 2</a> contains the parallel list of the returning leaders but omits Eneneus, giving only 11; but Eneneus corresponds to Nahamani (<a onClick="return mV(\'Neh\',7,7);">Ne 7:7</a>).``1';
