isbe[1347]='Benjamite`ben\'-ja-mit: One belonging to the tribe of Benjamin, such as Ehud (<a onClick="return mV(\'Jdg\',3,15);">Jud 3:15</a>), Saul (<a onClick="return mV(\'1Sa\',9,1,2);">1Sa 9:1-2</a>), Sheba (<a onClick="return mV(\'2Sa\',20,1);">2Sa 20:1</a>), Shimei (<a onClick="return mV(\'1Ki\',2,8);">1Ki 2:8</a>), etc.``1';
isbe[1348]='Beno`be\'-no (beno, "his son"): The son of Jaaziah of the house of Levi (<a onClick="return mV(\'1Ch\',24,26,27);">1Ch 24:26-27</a>).``1';
isbe[1349]='Beon`be\'-on (<a onClick="return mV(\'Num\',32,3);">Nu 32:3</a>).`<a href="./study/isbe/search.html?string=BAAL+MEON">BAAL-MEON</a>`1';
isbe[1350]='Beor`be\'-or (be\'or, "destroyer"(?)):<P>(1) Father of Bela, the first king of Edom (<a onClick="return mV(\'Gen\',36,32);">Ge 36:32</a>; <a onClick="return mV(\'1Ch\',1,43);">1Ch 1:43</a>).<P>(2) The father of the seer Balaam (<a onClick="return mV(\'Num\',22,5);">Nu 22:5</a>; <a onClick="return mV(\'Num\',24,3,15);">24:3, 15</a>; <a onClick="return mV(\'Num\',31,8);">31:8</a>; <a onClick="return mV(\'Deu\',23,4);">De 23:4</a>; <a onClick="return mV(\'Jos\',13,22);">Jos 13:22</a>; <a onClick="return mV(\'Jos\',24,9);">24:9</a>, omitted in Septuagint; <a onClick="return mV(\'Mic\',6,5);">Mic 6:5</a>; <a onClick="return mV(\'2Pe\',2,15);">2Pe 2:15</a>, the King James Version and the Revised Version, margin "Bosor").``1';
isbe[1351]='Bera`be\'-ra (bera\', "gift"(?); compare HPN, 74 note): King of Sodom (<a onClick="return mV(\'Gen\',14,2);">Ge 14:2</a>) who in the battle of Siddim was subdued by Chedorlaomer.``1';
isbe[1352]='Beracah`be-ra\'-ka (berakhah, "blessing," the King James Version Berachah): A Benjamite who joined David at Ziklag (<a onClick="return mV(\'1Ch\',12,3);">1Ch 12:3</a>).``1';
isbe[1353]='Beracah, Valley of`be-ra\'-ka, ber\'-a-ka (the King James Version Berachah; \'emeq berkhah; koilas eulogias): After the victory of Jehoshaphat and his people over Moab and Ammon, "On the fourth day they assembled themselves in the valley of Beracah; for there they blessed Yahweh: therefore the name of that place was called The valley of Beracah (i.e. of blessing) unto this day" (<a onClick="return mV(\'2Ch\',20,26);">2Ch 20:26</a>). In the Wady \'Arrub there is a ruin called Breikut and the valley in its proximity receives the same name. This is on the main road from Hebron to Jerusalem and not far from Tekoa; it suits the narrative well (see PEF, III, 352).``117';
isbe[1354]='Berachiah`ber-a-ki\'-a.`<a href="./study/isbe/search.html?string=BERECHIAH">BERECHIAH</a>`1';
isbe[1355]='Beraiah`be-ri\'-a (bera\'yah, "Yah hath created"): A son of Shimei of the house of Benjamin (<a onClick="return mV(\'1Ch\',8,21);">1Ch 8:21</a>).``1';
isbe[1356]='Berea`be-re\'-a.`<a href="./study/isbe/search.html?string=BEROEA">BEROEA</a>`1';
isbe[1357]='Bereave; Bereaver; Bereft`be-rev\', be-rev\'-er, be-reft\':Bereave is frequently used in the Old Testament in the (now almost obsolete) meaning of "to deprive," "to take away," especially with reference to loss of children. The Hebrew word used here is shakhol, "to be childless," or in the Piel "to make childless" (compare <a onClick="return mV(\'Gen\',42,36);">Ge 42:36</a> et al.). In the King James Version <a onClick="return mV(\'Ecc\',4,8);">Ec 4:8</a> (from the Hebrew chacer, "to lack") we read "and bereave my soul of good" (the Revised Version (British and American) "deprive"), and in <a onClick="return mV(\'Eze\',36,14);">Eze 36:14</a> (from Hebrew kashal, "to stumble"), "neither bereave thy nations any more" (the Revised Version, margin "cause to stumble").<P>Bereaver, otherwise very rare, is found the Revised Version (British and American) <a onClick="return mV(\'Eze\',36,13);">Eze 36:13</a> (from Hebrew shakhol "to be childless"), "a bereaver of thy nation" (the King James Version "hast bereaved").<P>Bereft is found in <a onClick="return mV(\'1Ti\',6,5);">1Ti 6:5</a> (from the Greek apostereo, "to rob") "bereft of the truth" (the King James Version "destitute"). The expression bereavement (the Revised Version (British and American) <a onClick="return mV(\'Isa\',49,20);">Isa 49:20</a>) in the phrase "the children of thy bereft" means "the children born to thee in the time when God had afflicted thee."``16';
isbe[1358]='Berechiah`ber-e-ki\'-a (berekhyah, berekhyahu, "Yahweh blesses," HPN, 216, 287):<P>(1) A descendant of David (<a onClick="return mV(\'1Ch\',3,20);">1Ch 3:20</a>).<P>(2) The father of Asaph, the singer (<a onClick="return mV(\'1Ch\',6,39);">1Ch 6:39</a> the King James Version "Berachiah"; <a onClick="return mV(\'1Ch\',15,17);">1Ch 15:17</a>).<P>(3) A former inhabitant of Jerusalem, a Levee (<a onClick="return mV(\'1Ch\',9,16);">1Ch 9:16</a>).<P>(4) A doorkeeper \'for the ark at David\'s time (<a onClick="return mV(\'1Ch\',15,23);">1Ch 15:23</a>).<P>(5) One of the heads of the children of Ephraim (<a onClick="return mV(\'2Ch\',28,12);">2Ch 28:12</a>).<P>(6) The father of Meshullam the builder (<a onClick="return mV(\'Neh\',3,4,30);">Ne 3:4, 30</a>; <a onClick="return mV(\'Neh\',6,18);">6:18</a>).<P>(7) The father of the prophet Zechariah (<a onClick="return mV(\'Zec\',11,7);">Zec 11:7</a>).``16';
isbe[1359]='Bered (1)`be\'-red (beredh, "hail," from a Hebrew root meaning "to be cold"): The son of Shuthelah of the house of Ephraim (<a onClick="return mV(\'1Ch\',7,20);">1Ch 7:20</a>). Compare <a href="./study/isbe/search.html?string=BECHER">BECHER</a>.``1';
isbe[1360]='Bered (2)`be\'-red (beredh; Barad): A place in the Negeb mentioned in the story of Hagar (<a onClick="return mV(\'Gen\',16,14);">Ge 16:14</a>). The well Beer-lahai-roi was "between Kadesh and Bered." The Onkelos Targum renders it Chaghra\', which is the usual equivalent of Shur, while the Jerusalem Targum renders it Chalutsah, which is also Shur (<a onClick="return mV(\'Exd\',15,22);">Ex 15:22</a>). Chalutsah is clearly the city of Elusu mentioned by Ptolemy and from the 4th to the 7th centuries by various ecclesiastical writers. It was an important town on the road from Palestine to Kadesh and Mount Sinai. This is without doubt the very large and important ruin Kh. Khalasa, some 70 miles south of Jerusalem on the road from Beersheba and Rehoboth. "These ruins cover an area of 15 to 20 acres, throughout which the foundations and enclosures of houses are distinctly to be traced....We judged that here there must have been a city with room enough for a population of 15,000 to 20,000 souls" (Robinson, BR, I, 201).``117';
isbe[1361]='Berenice`ber\'-e-nes.`<a href="./study/isbe/search.html?string=BERNICE">BERNICE</a>`1';
isbe[1362]='Beri`be\'-ri (beri, "wisdom"): A descendant of Asher (<a onClick="return mV(\'1Ch\',7,36);">1Ch 7:36</a>).``1';
isbe[1363]='Beriah; Beriites`be-ri\'-a, be-ri\'-its (beri\'ah, "in shouting," probably derived from a Hebrew root meaning "to make noise," or "in evil," from another Hebrew root):<P>(1) A son of Asher and father of Heber and Malchiel (<a onClick="return mV(\'Gen\',46,17);">Ge 46:17</a>; <a onClick="return mV(\'1Ch\',7,30,31);">1Ch 7:30-31</a>; the head of the family of the Beriites, <a onClick="return mV(\'Num\',26,44);">Nu 26:44</a>ff).<P>(2) A son of Ephraim, called Beriah by his father because "it went evil with his house" (<a onClick="return mV(\'1Ch\',7,23);">1Ch 7:23</a>).<P>(3) A descendant of Benjamin (<a onClick="return mV(\'1Ch\',8,13,16);">1Ch 8:13, 16</a>).<P>(4) A Levite in the line of Gershon (<a onClick="return mV(\'1Ch\',23,10);">1Ch 23:10</a>f).``1';
isbe[1364]='Berites`be\'-rits (berim; according to Klostermann and others, bikhrim): The word is found only once in the Old Testament (<a onClick="return mV(\'2Sa\',20,14);">2Sa 20:14</a>). The passage seems to be doubtful. The suggestion of Klostermann does not improve matters any; the other proposed reading, bachrim (Vulgate, viri electi), "choice young men," is to be preferred.``1';
isbe[1365]='Berith`be\'-rith (berith, "covenant").`<a href="./study/isbe/search.html?string=BAAL+BERITH">BAAL-BERITH</a>`1';
isbe[1366]='Bernice`ber-ni\'-se (Bernike "victorious"): One of the shameless women of the Bible, mentioned in <a onClick="return mV(\'Act\',25,13,23);">Ac 25:13, 23</a>; <a onClick="return mV(\'Act\',26,30);">26:30</a>. She was the eldest daughter of Herod Agrippa I (<a onClick="return mV(\'Act\',12,1,6,11,21);">Ac 12:1, 6, 11, 21</a>) who ruled from 38-45 AD. Her whole life from the Jewish standpoint was incestuous. Its story is told by Josephus (Ant XIX, v, 1; XX, vii, 1-3), also by Juvenal (6, 156). Her first husband was her own uncle, Herod of Calchis. After his death she consorted with her own brother Agrippa II, with whom she listened to the impassioned defense of Paul at Caesarea before Felix. For a while she was married to King Ptolemy or Polemo of Sicily, who for her sake embraced Judaism, by the rite of circumcision. But she left him soon to return to Agrippa. Later on she figures shamefully in the lives of Vespasian and Titus, father and son. If heredity stands for anything, its lessons are forcibly taught in the history of the Herodian family.``42';
isbe[1367]='Berodach-Baladan`be-ro\'-dak-bal\'-a-dan.`<a href="./study/isbe/search.html?string=MERODACH+BALADAN">MERODACH-BALADAN</a>`1';
isbe[1368]='Beroea`be-re\'-a (Beroia or Berroia):<P>(1) A town of southwestern Macedonia, in the district of Emathia. It lay at the foot of Mt. Bermius, on a tributary of the Haliacmon, and seems to have been an ancient town, though the date of its foundation is uncertain. A passage in Thucydides (i.61) relating to the year 432 BC probably refers to another place of the same name, but an inscription (Inscr Graec, II,5,296i) proves its existence at the end of the 4th century BC, and it is twice mentioned by Polybius (xxvii.8; xxviii.8). After the battle of Pydba in 168 BC Berea was the first city to surrender to Rome and fell in the third of the four regions into which Macedonia was divided (Livy xliv.45; xlv.29). Paul and Silas came to Berea from Thessalonica which they had been forced by an uproar to leave, and preached in the synagogue to the Jews, many of whom believed after a candid examination of the apostolic message in the light of their Scriptures (<a onClick="return mV(\'Act\',17,10,11);">Ac 17:10-11</a>). A number of "Greek women of honorable estate and of men" also believed, but the advent of a body of hostile Jews from Thessalonica created a disturbance in consequence of which Paul had to leave the city, though Silas and Timothy stayed there for a few days longer (<a onClick="return mV(\'Act\',17,\'12-15\');">Ac 17:12-15</a>). Perhaps the Sopater of Berea who accompanied Paul to Asia on his last journey to Jerusalem was one of his converts on this visit (<a onClick="return mV(\'Act\',20,4);">Ac 20:4</a>). Berea, which was one of the most populous cities of Macedonia early became a bishopric under the metropolitan of Thessalonica and was itself made a metropolis by Andronicus II (1283-1328): there is a tradition that the first bishop of the church was Onesimus. It played a prominent part in the struggles between the Greeks and the Bulgarians and Serbs, and was finally conquered by the Turks in 1373-74. The town, which still bears among the Greeks its ancient name (pronounced Verria) though called by the Turks Karaferia, possesses but few remains of antiquity with the exception of numerous inscriptions (Leake, Travels in Northern Greece, III, 290 if; Cousinery, Voyage dans la Macedoine, I, 57ff; Dimitsas, Makedonia in Greek, 57ff).<P>Marcus N. Tod<P>(2) The place where Menelaus the ex-high priest was executed by order of Antiochus Eupator, the victim, according to local custom, being cast from a tower 50 cubits high into a bed of ashes (2Macc 13:3ff). It was the ancient city of Chalab, lying about midway between Antioch and Hierapolis. Seleucus Nicator gave it the name Berea. It was a city of importance under the Moslems in the Middle Ages, when the old name again asserted itself, and remains to the present time.<P>The name "Aleppo" came to us through the Venetian traders in the days before the great overland route to India via Aleppo lost its importance through the discovery of the passage round the Cape. Aleppo is now a city of nearly 130,000 inhabitants. The governor exercises authority over a wide district extending from the Euphrates to the Mediterranean.<P>(3) (Berea); A place mentioned in 1Macc 9:4. It may be identical with <a href="./study/isbe/search.html?string=BEEROTH">BEEROTH</a> (which see) in Benjamin, a Hivite town, 8 miles north of Jerusalem, or with the modern Birez-Zait, 1 1/2 miles Northwest of Jifneh.``54';
isbe[1369]='Beroth`be\'-roth (1Esdras 5:19).`<a href="./study/isbe/search.html?string=BEEROTH">BEEROTH</a>`1';
isbe[1370]='Berothah`be-ro\'-tha (<a onClick="return mV(\'Eze\',47,16);">Eze 47:16</a>: berothah; Septuagint Codex Vaticanus, Abthera; or <a href="./study/isbe/search.html?string=BEROTHAH">BEROTHAH</a> <a onClick="return mV(\'2Sa\',8,8);">2Sa 8:8</a>; berothai, where for mibberothai Septuagint reads ek ton eklekton poleon, "from the select cities"): Probably two forms of the same name. <a onClick="return mV(\'Eze\',47,16);">Eze 47:16</a> places it on the ideal northern frontier of Israel, between Damascus and Hamath. According to <a onClick="return mV(\'2Sa\',8,8);">2Sa 8:8</a> it was a city of Hadadezer, king of Zobah. In the parallel passage (<a onClick="return mV(\'1Ch\',18,8);">1Ch 18:8</a>) Cun is given in place of Berothai. Its site is unknown. Ewald connected it with Beirut (so also apparently H. P. Smith, ICC, "Samuel," 307), but Ezekiel\'s description excludes this view. Others have sought it in the Wady Brissa, in the east slope of Lebanon, north of Baalbec. A more plausible conjecture identifies it with Bereitan (Brithen), a village somewhat south of Baalbec (Baedeker, Pal3, 369). Possibly, however, the ideal northern frontier line should be drawn farther south.`<a href="./study/isbe/search.html?string=HETHLON">HETHLON</a>; <a href="./study/isbe/search.html?string=ZEDAD">ZEDAD</a>; <a href="./study/isbe/search.html?string=ZOBAH">ZOBAH</a>`172';
isbe[1371]='Berothite`be\'-roth-it.`<a href="./study/isbe/search.html?string=BEEROTHITE">BEEROTHITE</a>`1';
isbe[1372]='Berries`ber\'-is: Occurs in <a onClick="return mV(\'Jam\',3,12);">Jas 3:12</a> (the King James Version) in the phrase "olive berries" (elaiai). The Revised Version (British and American) reads simply "olives."``1';
isbe[1373]='Beryl`ber\'-il.`<a href="./study/isbe/search.html?string=STONES,+PRECIOUS">STONES, PRECIOUS</a>`1';
isbe[1374]='Berytus`ber\'-i-tus, be-ri\'-tus (Berutos; Arabic: modern Beirut, Beyrout, Beyrouth): An ancient Phoenician city situated on the north side of a promontory jutting out from the base of Lebanon to the west into the Mediterranean and forming a bay on the north connected with the fable of George and the Dragon, and hence called George\'s Bay. The city is about 25 miles north of Sidon and about 12 south of the famous Lycus or Dog River, at the mouth of which are found the sculptured rocks bearing the monuments of the ancient kings of Egypt, Babylonia and Assyria.<P>The city has been thought by some to be the Berothai of <a onClick="return mV(\'2Sa\',8,8);">2Sa 8:8</a> or the Berothah of <a onClick="return mV(\'Eze\',47,16);">Eze 47:16</a>, but the connection in which these cities are mentioned seems to preclude the identification. The town is, however, an ancient one, for it occurs in Tell el-Amarna Letters as Beruti where it is closely connected with Gebal of which it may have been a dependency.<P>Though not mentioned in Old Testament or New Testament it appears in the history of Herod the Great as an important town where was assembled a court of 150 judges, presided over by Saturninus, a former Roman consul, to try the case which Herod brought against his two sons, Alexander and Aristobulus, who were condemned there by the Roman court (Ant., XVI, xi, 2). Beirut was a Roman colony at this time where many veterans settled and it afterward became the seat of a great Roman law school which was attended, in the days of Justinian, by thousands of students. It was utterly destroyed by an earthquake in 551 AD, and for a time was abandoned. Many remains of temples and public buildings of the Roman period remain. It rose to some importance during the Crusades and is at present the chief seaport of Syria, and has the only harbor on the coast. It is a town of about 125,000 inhabitants.``138';
isbe[1375]='Berzelus`ber-ze\'-lus.`<a href="./study/isbe/search.html?string=ZORZELLEUS">ZORZELLEUS</a>`1';
isbe[1376]='Besai`be\'-si (becay, "downtrodden"): The descendants of Besai (Nethinim) returned with Zerubbabel to Jerusalem (<a onClick="return mV(\'Ezr\',2,49);">Ezr 2:49</a>; <a onClick="return mV(\'Neh\',7,52);">Ne 7:52</a> = Basthai, 1Esdras 5:31).``1';
isbe[1377]='Beset`be-set\' (euperistatos): The most common sense of this word is "to surround." This is the thought in <a onClick="return mV(\'Psa\',139,5);">Ps 139:5</a>, and teaches the omnipresence of God. Often wicked men find that the things which they have done so envelope them that they cannot escape ruin (<a onClick="return mV(\'Hsa\',7,2);">Ho 7:2</a>). The reference in <a onClick="return mV(\'Hbr\',12,1);">Heb 12:1</a> is first of all against the sin of apostasy against which repeated warning is given in this book. But the warning is also against any sin that is especially dangerous to us. It, again and again, surrounds us like a besieging army. To surrender would be traitorous and disgraceful, since the Captain of the Lord\'s host is with us.``87';
isbe[1378]='Beside`be-sid\': Near to, or close to (<a onClick="return mV(\'Psa\',23,2);">Ps 23:2</a>). It is often used to refer to the mental state, to the derangement of the mind (existemi, <a onClick="return mV(\'Mar\',3,21);">Mr 3:21</a>; <a onClick="return mV(\'Act\',26,24);">Ac 26:24</a> the King James Version). Or it may refer to the condition of being out of the ordinary course of the life. A life consecrated to God and spent in the interest of humanity is so designated (<a onClick="return mV(\'2Cr\',5,13);">2Co 5:13</a>). It has the sense also of a state of being out of one\'s usual mind, but not of mental derangement, occasioned by something that causes amazement or astonishment (<a onClick="return mV(\'Mar\',5,42);">Mr 5:42</a>). Or it may refer to a state in which one is not conscious of present conditions, but is rapt in vision (<a onClick="return mV(\'Act\',10,10);">Ac 10:10</a>).<P>Besides is used in the sense of in addition to or that which is over and above what has been said or is possessed (<a onClick="return mV(\'Luk\',16,26);">Lu 16:26</a>; see the American Revised Version, margin "in"; <a onClick="return mV(\'Phm\',1,19);">Philemon 1:19</a>).``87';
isbe[1379]='Besiege`be-sej\'.`<a href="./study/isbe/search.html?string=SIEGE">SIEGE</a>`1';
isbe[1380]='Besodeiah`bes-o-de\'-ya, bes-o-di\'-a (becodheyah, "in the confidence or counsel of Yah"; compare <a onClick="return mV(\'Jer\',23,18,22);">Jer 23:18, 22</a>; and HPN, 207, 221, 286): Father of Meshullam, the builder (<a onClick="return mV(\'Neh\',3,6);">Ne 3:6</a>).``1';
isbe[1381]='Besom`be\'-zum: Occurs only once in Scripture: "I will sweep it with the besom of destruction" (<a onClick="return mV(\'Isa\',14,23);">Isa 14:23</a>). Refers to what was in store for Babylon. The Hebrew word maT\'ate\', rendered "besom," is close of kin to the one (ti\'te\'thiha) rendered "sweep." In early English "besom" was synonymous with "broom," and is still so used in some parts of England.``1';
isbe[1382]='Besor, the Brook`be\'-sor, (nachal besor; Codex Alexandrinus, Bechor, Codex Vaticanus, Beana; <a onClick="return mV(\'1Sa\',30,9,20,21);">1Sa 30:9, 20-21</a>; Josephus, Ant, VI, xiv, 6): A torrent-bed (nachal) mentioned in the account of David\'s pursuit of the Amalekites. Thought to be Wady Ghazza, which enters the sea southwest of Gaza.``1';
isbe[1383]='Best`Of five Hebrew originals the chief is Tobh, "good," expressing quality, character. Variously used of objects pleasing to the senses, feelings, mind, moral sense, e.g. "best of the land" (<a onClick="return mV(\'Gen\',47,6);">Ge 47:6</a>); "of sheep" (<a onClick="return mV(\'1Sa\',15,9);">1Sa 15:9</a>); of persons "married to whom they think best" (<a onClick="return mV(\'Num\',36,6);">Nu 36:6</a>); of abode, "where it liketh (the Revised Version (British and American) "pleaseth") him best" (<a onClick="return mV(\'Deu\',23,16);">De 23:16</a>).<P>In <a onClick="return mV(\'Num\',18,12);">Nu 18:12</a> the revenues of the priests were to be "holy gifts," e.g. the "best of the oil," etc. (chelebh, "fat"); also <a onClick="return mV(\'Num\',18,29,30,32);">18:29,30,32</a>, the gifts of the heave-offering were to be "of all the best," indicating that the richest elements of life were to go into the support and service of the sanctuary. So "the choice (best) fruits" (zimrah, literally, "the song of the land"), a beautifully poetic expression for the most celebrated fruits (<a onClick="return mV(\'Gen\',43,11);">Ge 43:11</a>); equally choice is pazaz, "separate," "the finest (best) gold," hence "purified" (<a onClick="return mV(\'1Ki\',10,18);">1Ki 10:18</a>).<P>Used but twice in the New Testament:<P>(1) of spiritual gifts (kreitton, "better" the Revised Version (British and American) "greater"); <a onClick="return mV(\'1Cr\',12,31);">1Co 12:31</a>);<P>(2) of raiment (protos, "first"), "best robe" (<a onClick="return mV(\'Luk\',15,22);">Lu 15:22</a>), of special significance as expressing the Father\'s lavish love for the repentant and returning sinner.``139';
isbe[1384]='Bestead`be-sted\' (niqsheh, "caught in a snare," "entrapped"; as Judah hard pressed in their own land by the Assyrians (<a onClick="return mV(\'Isa\',8,21);">Isa 8:21</a> the King James Version)): Found only here. Old English word steden meaning "place," hence, "set," "beset"; usually with "ill," "sorely bested." In the Revised Version (British and American) rendered "sore distressed."``1';
isbe[1385]='Bestiality`bes-ti-al\'-i-ti.`<a href="./study/isbe/search.html?string=CRIMES">CRIMES</a>`1';
isbe[1386]='Bestow`be-sto\':The seven Hebrew words rendered by this term variously mean "to put" or "place," "to give"; "do," "deposit," as e.g. to locate chariots and horsemen in cities (<a onClick="return mV(\'1Ki\',10,26);">1Ki 10:26</a>); or give a blessing (<a onClick="return mV(\'Exd\',32,29);">Ex 32:29</a>). Four Greek words so translated signify "to give," "to labor," "to feed," "to place around"; as sunago, "to stow away goods" (<a onClick="return mV(\'Luk\',12,17);">Lu 12:17</a>); or psomizo, "give away" (<a onClick="return mV(\'1Cr\',13,3);">1Co 13:3</a>). The term has richest significance in expressing God\'s abundant gift of grace and love, didomi (<a onClick="return mV(\'2Cr\',8,1);">2Co 8:1</a> the King James Version; <a onClick="return mV(\'1Jo\',3,1);">1Jo 3:1</a>).``1';
isbe[1387]='Betah`be\'-ta (<a onClick="return mV(\'2Sa\',8,8);">2Sa 8:8</a>).`<a href="./study/isbe/search.html?string=TIBHATH">TIBHATH</a>`1';
isbe[1388]='Betane`bet\'-a-ne (Baitane): A place named in Judith 1:9, among those to which the messengers of Nebuchadnezzar were sent. From the order in which they are named we should seek for it south of Jerusalem. It may be identical with Beit \'Ainun, about 3 miles north of Hebron.``1';
isbe[1389]='Beten`be\'-ten (Beten; Batne): A city of Asher mentioned between Hall and Achshaph (<a onClick="return mV(\'Jos\',19,25);">Jos 19:25</a>). Eusebius, Onomasticon places it 8 Roman miles east of Ptolemais, giving it the name Bethseten. It may be identical with the modern village el-B\'aneh, but no certainty is possible.``1';
isbe[1390]='Beth (1)`bath (b): The second letter of the Hebrew alphabet. With the daghesh it is transliterated in this dictionary as "b," and, without the daghesth, as "bh" (= "v"). It came also to be used for the number two (2) and with the dieresis for 2,000. For name, etc.,`<a href="./study/isbe/search.html?string=ALPHABET">ALPHABET</a>; <a href="./study/isbe/search.html?string=BAYITH">BAYITH</a>`1';
isbe[1391]='Beth (2)`beth (in proper names; Greek transliteration in Septuagint, beth, baith, or beth): This is the English transliteration for the Hebrew beth, meaning "house," "tent," "place." It occurs in many compound proper names formed similarly to the method of compounding words in the German language, as shown in the articles immediately following. Thus we have beth \'anath or \'anoth = "house of replies" (<a onClick="return mV(\'Jos\',19,38);">Jos 19:38</a>; <a onClick="return mV(\'Jdg\',1,33);">Jud 1:33</a>); beth\'el = "house of God" (<a onClick="return mV(\'Gen\',12,8);">Ge 12:8</a>; <a onClick="return mV(\'Gen\',13,3);">13:3</a>), etc. We also find the word in hybrid formations, e.g. Bethphage = Bethphage = "fig house" (<a onClick="return mV(\'Mat\',21,1);">Mt 21:1</a>).``77';
isbe[1392]='Beth-Anath`beth-a\'-nath (beth\'anath; Bainathath): A city in the territory of Naphtali, named with Horem and Bethshemesh (<a onClick="return mV(\'Jos\',19,38);">Jos 19:38</a>; <a onClick="return mV(\'Jdg\',1,33);">Jud 1:33</a>). It is represented by the modern village Ainatha, about 12 miles Northwest of Cafed. The name signifies the "house" or "temple" of Anath, a goddess of the Canaanites.``1';
isbe[1393]='Beth-Anoth`beth-a\'-noth (beth\'anoth; Baithanam, probably "House of Anath"—a god; <a onClick="return mV(\'Jos\',15,59);">Jos 15:59</a>): The ruin of Beit \'Ainun, 1 1/2 miles southeast of Halhul, in the neighborhood also of Bethzur and Gedor—places mentioned in association with it as towns in the hill country of Judah—appears to be a probable site. The present surface ruins belong to later ages.``1';
isbe[1394]='Beth-Arabah`beth-ar\'-a-ba (beth ha-\'arabhah; Baitharaba, "place of the Arabah"):<P>(1) One of the 6 cities of Judah "in the wilderness" (<a onClick="return mV(\'Jos\',15,61);">Jos 15:61</a>), on the borders of Benjamin and Judah (<a onClick="return mV(\'Jos\',15,6);">Jos 15:6</a>; <a onClick="return mV(\'Jos\',18,18);">18:18</a> Septuagint). "The wilderness of Judah" is the barren land west of the Dead Sea. Beth-arabah is not yet identified.<P>(2) One of the cities of Benjamin (<a onClick="return mV(\'Jos\',18,22);">Jos 18:22</a>). Septuagint (Codex Vaticanus) reads Baithabara, and this may be correct. The names are early confounded.`<a href="./study/isbe/search.html?string=BETHABARA">BETHABARA</a>`1';
isbe[1395]='Beth-Arbel`beth-ar\'-bel (beth \'arbe\'l): The scene of a terrific disaster inflicted on the inhabitants by Shalman (<a onClick="return mV(\'Hsa\',10,14);">Ho 10:14</a>). If the place intended was in Palestine, and was not the famous city of that name on the Euphrates, then probably it should be identified either with Irbid (or Irbil) in Galilee, or with Irbid, which corresponds to Arbela of the Eusebius, Onomasticon, east of the Jordan, about 12 miles southeast of Gadara. If, as Schrader thinks (COT, II, 140), Shalman stands for the Moabite king, Shalamanu, a tributary of Tiglath-pileser, the eastern town would be the more natural identification. Possibly however the reference is to Shalmaneser III or IV. For the Galilean site,`<a href="./study/isbe/search.html?string=ARBELA">ARBELA</a>`54';
isbe[1396]='Beth-Aven`beth-a\'-ven (beth \'awen; Baithon, Baithaun): A place on the northern boundary of the territory of Benjamin (<a onClick="return mV(\'Jos\',18,12);">Jos 18:12</a>) east of Bethel, near Ai (<a onClick="return mV(\'Jos\',7,2);">Jos 7:2</a>), west of Michmash (<a onClick="return mV(\'1Sa\',13,5);">1Sa 13:5</a>; <a onClick="return mV(\'1Sa\',14,23);">14:23</a>). Beth-aven, "house of vanity," i.e. "idolatry," may possibly represent an original beth-\'on, "house of wealth." Wilson (PEFS, 1869, 126) suggests Khirbet An, west of Michmash. The name is used in mockery for Bethel by Hosea (<a onClick="return mV(\'Hsa\',4,15);">4:15</a>; <a onClick="return mV(\'Hsa\',10,5,8);">10:5, 8</a>, etc.; compare <a onClick="return mV(\'Amo\',5,5);">Am 5:5</a>).``1';
isbe[1397]='Beth-Azmaveth`beth-az-ma\'-veth (<a onClick="return mV(\'Neh\',7,28);">Ne 7:28</a>).`<a href="./study/isbe/search.html?string=AZMAVETH">AZMAVETH</a>`1';
isbe[1398]='Beth-Baal-Meon`beth-ba-al-me\'-on (<a onClick="return mV(\'Jos\',13,17);">Jos 13:17</a>).`<a href="./study/isbe/search.html?string=BAAL+MEON">BAAL-MEON</a>`1';
isbe[1399]='Beth-Barah`beth-ba\'-ra (beth barah; Baithera): Perhaps Beth-\'abharu, the guttural being lost in copying. It is a ford which the Midianites were expected to pass in fleeing from Gideon. Messengers were therefore sent by Gideon to the Ephraimites bidding them "take before them the waters, as far as Beth-barah, even (the Revised Version, margin "and also") the Jordan" (<a onClick="return mV(\'Jdg\',7,24);">Jud 7:24</a>). "The waters" were the streams emptying themselves into the Jordan: "even the Jordan" is a gloss on "the waters." Between the Jordan and the modern Wady Fari\'ah an enemy could be entrapped; it is therefore probable that Beth-barah was on that stream near its entrance into the Jordan.`<a href="./study/isbe/search.html?string=BETHABARA">BETHABARA</a>`78';
isbe[1400]='Beth-Biri`beth-bir\'-i (the King James Version Beth-birei, beth-bir\'-e-i) beth bir\'i; oikos Braoumseoreim; <a onClick="return mV(\'1Ch\',4,31);">1Ch 4:31</a> (called in <a onClick="return mV(\'Jos\',19,6);">Jos 19:6</a>, Beth-lebaoth, "abode of lions"): A site belonging to Simeon in the Negeb—unidentified.``1';
