isbe[6731]='Patara`pat\'-a-ra (ta Patara): A coast city of ancient Lycia, from which, according to <a onClick="return mV(\'Act\',21,1);">Ac 21:1</a>, Paul took a ship for Phoenicia. Because of its excellent harbor, many of the coast trading ships stopped at Patara, which therefore became an important and wealthy port of entry to the towns of the interior. As early as 440 BC autonomous coins were struck there; during the 4th and the 3rd centuries the coinage was interrupted, but was again resumed in 168 BC when Patara joined the Lycian league. Ptolemy Philadelphus enlarged the city, and changed its name to Arsinoe in honor of his wife. The city was celebrated not only as a trading center, but especially for its celebrated oracle of Apollo which is said to have spoken only during the six winter months of the year. Among the ruins there is still to be seen a deep pit with circular steps leading to a seat at the bottom; it is supposed that the pit is the place of the oracle. In the history of early Christianity, Patara took but little part, but it was the home of a bishop, and the birthplace of Nicholas, the patron saint of the sailors of the East. Though born at Patara, Nicholas was a bishop and saint of Myra, a neighboring Lycian city, and there he is said to have been buried. Gelemish is the modern name of the ruin. The walls of the ancient city may still be traced, and the foundations of the temple and castle and other public buildings are visible. The most imposing of the ruins is a triumphal arch bearing the inscription: "Patara the Metropolis of the Lycian Nation." Outside the city walls many sarcophagi may be seen, but the harbor, long ago choked by sand, has been converted into a useless swamp. another at grace, in addition to which two other cups have been added, the 4 according to the Mishna (Pecachim x.1) symbolizing the 4 words employed in <a onClick="return mV(\'Exd\',6,6,7);">Ex 6:6,7</a> for the delivery of Israel from Egypt. Instead of eating in haste, as in the Egyptian Passover, it is customary to recline or lean at this meal in token of Israel\'s freedom.`<a href="./study/isbe/search.html?string=MYRA">MYRA</a>`7';
isbe[6732]='Pate`pat (qodhqodh): The word usually translated "crown," "crown of the head" (<a onClick="return mV(\'Gen\',49,26);">Ge 49:26</a>; <a onClick="return mV(\'Deu\',28,35);">De 28:35</a>; <a onClick="return mV(\'Deu\',33,16,20);">33:16,20</a>; <a onClick="return mV(\'2Sa\',14,25);">2Sa 14:25</a>; <a onClick="return mV(\'Job\',2,7);">Job 2:7</a>; <a onClick="return mV(\'Isa\',3,17);">Isa 3:17</a>; <a onClick="return mV(\'Jer\',2,16);">Jer 2:16</a>; <a onClick="return mV(\'Jer\',48,45);">48:45</a>) and "scalp" (<a onClick="return mV(\'Psa\',68,21);">Ps 68:21</a>) is rendered "pate" in <a onClick="return mV(\'Psa\',7,16);">Ps 7:16</a> in agreement with earlier English translators since Coverdale: "His mischief shall return upon his own head, and his violence shall come down upon his own pate." The reason for the choice of the word lies evidently in the desire to make the Hebrew parallelism with "head" (ro\'sh) apparent. The same object has, however, been achieved differently in another poetical passage (<a onClick="return mV(\'Gen\',49,26);">Ge 49:26</a> parallel <a onClick="return mV(\'Deu\',33,16);">De 33:16</a>), namely, by the juxtaposition of "head" and "crown of the head."``106';
isbe[6733]='Path; Pathway`path, path\'-wa (orach, nethibhah, etc.; tribos, trochia):<P>(1) In the Old Testament.—In addition to its obvious literal sense (e.g. <a onClick="return mV(\'Gen\',49,17);">Ge 49:17</a>), it has very frequently a figurative meaning.<P>(a) As applied to man, a course or manner of life: (i) man\'s outward lot in life, his career or destiny, whether of the just man (<a onClick="return mV(\'Isa\',26,7);">Isa 26:7</a>) or of the ungodly (<a onClick="return mV(\'Job\',8,13);">Job 8:13</a>); (ii) frequently in an ethical sense, of men\'s conduct or inward life-purpose, whether it be good or evil (e.g. <a onClick="return mV(\'Pro\',2,15);">Pr 2:15</a>), generally accompanied by a term defining the moral quality of the conduct, either an abstract noun (e.g. "the paths of uprightness," <a onClick="return mV(\'Pro\',2,13);">Pr 2:13</a>; <a onClick="return mV(\'Pro\',4,11);">4:11</a>; "the paths of justice," <a onClick="return mV(\'Pro\',2,8);">Pr 2:8</a>; <a onClick="return mV(\'Isa\',40,14);">Isa 40:14</a>; "the paths of life," <a onClick="return mV(\'Psa\',16,11);">Ps 16:11</a>; <a onClick="return mV(\'Pro\',2,19);">Pr 2:19</a>), or a concrete adjective or noun (e.g. "crooked paths," <a onClick="return mV(\'Isa\',59,8);">Isa 59:8</a>; "the paths of the righteous," <a onClick="return mV(\'Pro\',2,20);">Pr 2:20</a>; <a onClick="return mV(\'Pro\',4,18);">4:18</a>).<P>(b) The term is also applied to God either (i) of the methods of the Divine Providence, God\'s dealings with men (<a onClick="return mV(\'Psa\',25,10);">Ps 25:10</a>; <a onClick="return mV(\'Psa\',65,11);">65:11</a>), or (ii) of the principles and maxims of religion and morality divinely revealed to man ("Show me thy ways, O Yahweh, teach me thy paths," <a onClick="return mV(\'Psa\',25,4);">Ps 25:4</a>; compare <a onClick="return mV(\'Isa\',2,3);">Isa 2:3</a>).<P>(2) In the Apocrypha we have the "paths" of Wisdom (tribos, Baruch 3:21,31); the "path" shown to men by the Law (semita, 2Esdras 14:22); and a man\'s "paths" (tribos, Tobit 4:10).<P>(3) In the New Testament the word occurs only in <a onClick="return mV(\'Mat\',3,3);">Mt 3:3</a> and parallel passages <a onClick="return mV(\'Mar\',1,3);">Mr 1:3</a>; <a onClick="return mV(\'Luk\',3,4);">Lu 3:4</a> (of the forerunner\'s work), and in <a onClick="return mV(\'Hbr\',12,13);">Heb 12:13</a> (in the Old Testament ethical sense).<P>Pathway occurs in <a onClick="return mV(\'Pro\',12,28);">Pr 12:28</a> (derekh nethibhah) and The <span class="noTag">Wisdom of Solomon 5:10</span> (atrapos).`<a href="./study/isbe/search.html?string=WAY">WAY</a>`49';
isbe[6734]='Patheus`pa-the\'-us (Pathaios, Phathaios): One of the Levites who had married a foreign wife (1Esdras 9:23) equals "Pethahiah" of <a onClick="return mV(\'Ezr\',10,23);">Ezr 10:23</a>.``1';
isbe[6735]='Pathros`path\'-ros (pathros; Egyptian Pata resii, the "South land"; Septuagint ge Pathoures): The Hebrew form of the Egyptian name for Upper Egypt (<a onClick="return mV(\'Isa\',11,11);">Isa 11:11</a>; <a onClick="return mV(\'Jer\',44,1,15);">Jer 44:1,15</a>; <a onClick="return mV(\'Eze\',29,14);">Eze 29:14</a>; <a onClick="return mV(\'Eze\',30,14);">30:14</a>).``1';
isbe[6736]='Pathrusim`path-roo\'-sim, path-ru\'-sim (pathruci, "an inhabitant of Pathros"; Septuagint hoi Patrosonieim): The branch of the Egyptians who came from <a href="./study/isbe/search.html?string=PATHROS">PATHROS</A> (which see). They are represented as begotten of Mizraim, "Mizraim begat Zudim....and Pathrusim" (<a onClick="return mV(\'Gen\',10,13);">Ge 10:13</a>f; <a onClick="return mV(\'1Ch\',1,11);">1Ch 1:11</a>f).``1';
isbe[6737]='Patience`pa\'-shens (hupomone, makrothumia): "Patience" implies suffering, enduring or waiting, as a determination of the will and not simply under necessity. As such it is an essential Christian virtue to the exercise of which there are many exhortations. We need to "wait patiently" for God, to endure uncomplainingly the various forms of sufferings, wrongs and evils that we meet with, and to bear patiently injustices which we cannot remedy and provocations we cannot remove.<P>The word "patience" does not occur in the Old Testament, but we have "patiently" in <a onClick="return mV(\'Psa\',40,1);">Ps 40:1</a> as the translation of qawah, "to wait," "to expect," which word frequently expresses the idea, especially that of waiting on God; in <a onClick="return mV(\'Psa\',37,7);">Ps 37:7</a>, "patiently" ("wait patiently") is the translation of qul, one of the meanings of which is "to wait" or "to hope for" or "to expect" (of <a onClick="return mV(\'Job\',35,14);">Job 35:14</a>); "patient" occurs (<a onClick="return mV(\'Ecc\',7,8);">Ec 7:8</a>) as the translation of \'erekh ruach, "long of spirit," and (<a onClick="return mV(\'Job\',6,11);">Job 6:11</a>) "that I should be patient" (ha\'arikh nephesh). Compare "impatient" (<a onClick="return mV(\'Job\',21,4);">Job 21:4</a>).<P>"Patience" occurs frequently in the Apocrypha, especially in Ecclesiasticus, e.g. 2:14; 16:13; 17:24; 41:2 (hupomone); 5:11 (makrothumia); 29:8 (makrothumeo, the Revised Version (British and American) "long suffering"); in The <span class="noTag">Wisdom of Solomon 2:19</span>, the Greek word is anexikakia.<P>In the New Testament hupomone carries in it the ideas of endurance, continuance (<a onClick="return mV(\'Luk\',8,15);">Lu 8:15</a>; <a onClick="return mV(\'Luk\',21,19);">21:19</a>; <a onClick="return mV(\'Rom\',5,3,4);">Ro 5:3,4</a>, the American Standard Revised Version "stedfastness"; <a onClick="return mV(\'Rom\',8,25);">Ro 8:25</a>, etc.).<P>In all places the American Revised Version margin has "stedfastness," except <a onClick="return mV(\'Jam\',5,11);">Jas 5:11</a>, where it has "endurance"; makrothumia is translated "patience" (<a onClick="return mV(\'Hbr\',6,12);">Heb 6:12</a>; <a onClick="return mV(\'Jam\',5,10);">Jas 5:10</a>); makrothumeo, "to bear long" (<a onClick="return mV(\'Mat\',18,26,29);">Mt 18:26,29</a>; <a onClick="return mV(\'Jam\',5,7);">Jas 5:7</a>; See <a href="./study/isbe/search.html?string=LONGSUFFERING">LONGSUFFERING</A>); the same verb is translated "be patient" (<a onClick="return mV(\'1Th\',5,14);">1Th 5:14</a>, the Revised Version (British and American) "longsuffering"; <a onClick="return mV(\'Jam\',5,7,8);">Jas 5:7,8</a>, the King James Version and the Revised Version (British and American) "patient"); makrothumos, "patiently" (<a onClick="return mV(\'Act\',26,3);">Ac 26:3</a>); hupomeno (<a onClick="return mV(\'1Pe\',2,20);">1Pe 2:20</a>); anexikakos is translated "patient" (<a onClick="return mV(\'2Ti\',2,4);">2Ti 2:4</a>, the Revised Version (British and American), the King James Version margin, "forbearing"); epieikes, "gentle" (<a onClick="return mV(\'1Ti\',3,3);">1Ti 3:3</a>, the Revised Version (British and American) "gentle"); hupomeno (<a onClick="return mV(\'Rom\',12,12);">Ro 12:12</a>, "patient in tribulation"). For "the patient waiting for Christ" (<a onClick="return mV(\'2Th\',3,5);">2Th 3:5</a>), the Revised Version (British and American) has "the patience of Christ."<P>Patience is often hard to gain and to maintain, but, in <a onClick="return mV(\'Rom\',15,5);">Ro 15:5</a>, God is called "the God of patience" (the American Revised Version margin "stedfastness") as being able to grant that grace to those who look to Him and depend on Him for it. It is in reliance on God and acceptance of His will, with trust in His goodness, wisdom and faithfulness, that we are enabled to endure and to hope stedfastly.`<a href="./study/isbe/search.html?string=GOD">GOD</a>`185';
isbe[6738]='Patmos`pat\'-mos (Patomos; Italian: San Giovanni di Patino): A Turkish island of the group Sporades, southwest of Samos, mentioned once in the Bible, <a onClick="return mV(\'Rev\',1,9);">Re 1:9</a>, "I, John...was in the isle that is called Patmos, for the word of God and the testimony of Jesus" (dia ton logon tou theou kai ten marturian Iesou). The island <span class="noTag">is</span> 10 miles long, and about 6 broad along the northern coast. It is for the most part rocky. The highest part is Mount Elias, which rises to a height of over 800 ft. As in Greece, and in the adjacent mainland of Asia Minor, the land is treeless. Near the city of Patmos there is a good harbor. A famous monastery, Christodulos, was founded on the island in 1088. Near this is a thriving school, attended by students from all parts of the Archipelago. The population of the island <span class="noTag">numbers</span> 3,000, almost entirely Greek. The ancient capital was on an isthmus between the inlets of La Scala and Merika. Many ruins can still be seen. The huge walls of Cyclopean masonry, similar to those at Tiryns, attest their great age. In Roman times Patmos was one of the many places to which Rome banished her exiles. In 95 AD, according to a tradition preserved by Irenaeus, Eusebius, Jerome and others, John was exiled here—in the 14th year of the reign of Domitian—whence he returned to Ephesus under Nerva (96 AD). The cave in which he is said to have seen his visions is still pointed out to the traveler. Only a small part of the once valuable library in the monastery of Christodulos is left. Just 100 years ago (1814) Mr. E.D. Clark purchased here the manuscript of Plato which is now in the Bodleian Library, the celebrated Clarkianus, a parchment written in the year 895, and admittedly the best of all for the 1st of the 2 volumes into which the works of Plato were divided for convenience. Patmos is mentioned by Thucydides (iii.33), by Pliny (NH, iv.23), and by Strabo (x.5).<P>LITERATURE.<P>Tozer, The Islands of the Aegean (1890), 178-95; Walpole, Turkey (London, 1820), II, 43; E.D. Clark, Travels (London, 1818), VI, 2; Ross, Reisen (Stuttgart, 1840), II; Guerin, Description de l\'Ile de Patmos (Paris, 1856).`<a href="./study/isbe/search.html?string=JOHN,+THE+APOSTLE">JOHN, THE APOSTLE</a>; <a href="./study/isbe/search.html?string=REVELATION+OF+JOHN">REVELATION OF JOHN</a>`71';
isbe[6739]='Patriarch; Patriachs`pa\'-tri-ark, patriarches). The word occurs in the New Testament in application to Abraham (<a onClick="return mV(\'Hbr\',7,4);">Heb 7:4</a>), to the sons of Jacob (<a onClick="return mV(\'Act\',7,8,9);">Ac 7:8,9</a>), and to David (<a onClick="return mV(\'Act\',2,29);">Ac 2:29</a>). In Septuagint it is used as the equivalent of the head of the fathers\' house, or of a tribe (<a onClick="return mV(\'1Ch\',24,31);">1Ch 24:31</a>; <a onClick="return mV(\'1Ch\',27,32);">27:32</a>; <a onClick="return mV(\'2Ch\',26,12);">2Ch 26:12</a>). Commonly now the term is used of the persons whose names appear in the genealogies and covenant-histories in the periods preceding Moses (<a onClick="return mV(\'Gen\',5,\'1-\');">Ge 5</a>; <a onClick="return mV(\'Gen\',11,\'1-\');">11</a>, histories of Noah, Abraham, Isaac, Jacob, etc.; compare "patriarchal dispensation"). The problems connected with the longevity ascribed to the patriarchs in the genealogies and narratives in Genesis are dealt with in special articles.`<a href="./study/isbe/search.html?string=ANTEDILUVIAN+PATRIARCHS">ANTEDILUVIAN PATRIARCHS</a>; <a href="./study/isbe/search.html?string=ANTEDILUVIANS+(genealogy)">ANTEDILUVIANS (GENEALOGY)</a>`132';
isbe[6740]='Patriarchs, Testaments of the Twelve``<a href="./study/isbe/search.html?string=APOCALYPTIC+LITERATURE">APOCALYPTIC LITERATURE</a>`1';
isbe[6741]='Patrimony`pat\'-ri-mo-ni (ha-\'abhoth, "the fathers"): A word occurring once in English Versions of the Bible (<a onClick="return mV(\'Deu\',18,8);">De 18:8</a>), meaning literally, "the fathers," which, however, is obscure, probably by reason of abbreviation for some phrase, e.g. "house of the fathers." It may indicate "some private source of income possessed by the Levite (who has come up from a country district to the central sanctuary) distinct from what he receives as a priest officiating at the central sanctuary" (Driver, "Deuteronomy," ICC, in the place cited.). Beyond this one occurrence of the word the same idea is conveyed often by other words or phrases: "He divided unto them his living" (<a onClick="return mV(\'Luk\',15,13);">Lu 15:13</a>); "Teacher, bid my brother divide the inheritance with me" (<a onClick="return mV(\'Luk\',12,13);">Lu 12:13</a>). Full and specific directions were given in the Law for the division of the patrimony (<a onClick="return mV(\'Num\',27,\'1-\');">Nu 27</a>; <a onClick="return mV(\'Deu\',21,\'1-\');">De 21</a>, etc.) and for its redemption (<a onClick="return mV(\'Rth\',4,\'1-12\');">Ru 4:1-12</a>). The idea was frequently used with figurative and spiritual application: the land of Canaan was Israel\'s patrimony, being inherited from Yahweh (<a onClick="return mV(\'Psa\',105,11);">Ps 105:11</a>); salvation because of its origin in grace was the believer\'s patrimony (<a onClick="return mV(\'Gal\',3,\'26-\');">Ga 3:26-4:7</a>). Contrariwise Israel was Yahweh\'s inheritance (<a onClick="return mV(\'Isa\',19,25);">Isa 19:25</a>; <a onClick="return mV(\'Isa\',63,14);">63:14</a>; compare <a onClick="return mV(\'Psa\',33,12);">Ps 33:12</a>; and the whole earth is the Messiah\'s patrimony, inherited from His Eternal Father (<a onClick="return mV(\'Psa\',2,8);">Ps 2:8</a>).`<a href="./study/isbe/search.html?string=BIRTHRIGHT">BIRTHRIGHT</a>; <a href="./study/isbe/search.html?string=FAMILY">FAMILY</a>; <a href="./study/isbe/search.html?string=INHERITANCE">INHERITANCE</a>; <a href="./study/isbe/search.html?string=PROPERTY">PROPERTY</a>`109';
isbe[6742]='Patrobas`pat\'-ro-bas (Patrobas): The name of a member of the Christian community at Rome to whom Paul sent greetings (<a onClick="return mV(\'Rom\',16,14);">Ro 16:14</a>). The name is an abbreviated form of "Patrobius." There was a wealthy freedman of Nero of the same name who was put to death by Galba (Tacitus, History i.49; ii.95). The Patrobas of Paul may have been a dependent of his.``1';
isbe[6743]='Patroclus`pa-tro\'-klus (Patroklos): The father of the Syrian general Nicanor (2Macc 8:9).``1';
isbe[6744]='Pattern`pat\'-ern (tabhnith, "model," mar\'eh, "a vision" or "view"): The Old Testament words translated "pattern" do not necessarily indicate a drawing such as a modern constructor begins with, or the patterns made from these drawings for the guidance of workmen. In <a onClick="return mV(\'Exd\',25,9,40);">Ex 25:9,40</a> the word "idea" or "suggestion" would possibly indicate more distinctly than "pattern" what Moses received in regard to the building of the tabernacle, etc. It is doubtful if any architect\'s drawing was ever made of the temple. It is not the custom in Palestine and Syria today to work from any pattern more concrete than an idea. A man who wants a house calls the builder and says he wants to build so many rooms of such and such dimensions with, for example, a court 10 drahs (arm\'s lengths) wide and 15 drahs long, made of sandstone and plastered inside and out. With these meager instructions the builder starts. The details are worked out as the building proceeds. When a piece of iron or brass work is to be made, the customer by gestures with his hands outlines the form the piece should take. "I want it haik wa haik" ("thus and thus"), he says, and leaves the metal worker to conceive the exact form. It is probable that directions similar to these were given by David to Solomon. "Then David gave Solomon his son the pattern (his conception) of the porch of the temple," etc. (<a onClick="return mV(\'1Ch\',28,11);">1Ch 28:11</a>). The above does not apply to Greek and Roman work in Syria. Their workmen, probably mostly native, were trained to work from models. Williams in the Architect, January,1913,says of the works at Baalbek and Palmyra, "There is a machine-like resemblance betokening slavish copying." At the present time native workmen coming under the influence of foreigners are beginning to work from models and plans, but they show little tendency to create models of their own.<P>Three Greek words have been translated in the New Testament: tupos, "type," occurs in <a onClick="return mV(\'Tts\',2,7);">Tit 2:7</a> and <a onClick="return mV(\'Hbr\',8,5);">Heb 8:5</a>. In the first instance the Revised Version (British and American) reads "ensample." hupotuposis, "outline," has been similarly translated in <a onClick="return mV(\'1Ti\',1,16);">1Ti 1:16</a>, but "pattern" in <a onClick="return mV(\'2Ti\',1,13);">2Ti 1:13</a>. In <a onClick="return mV(\'Hbr\',9,24);">Heb 9:24</a> the American Standard Revised Version. antitupos, is rendered "like in pattern." hupodeigma, the King James Version "pattern," is translated in the American Standard Revised Version "copy" (<a onClick="return mV(\'Hbr\',8,5);">Heb 8:5</a>), "copies" (<a onClick="return mV(\'Hbr\',9,23);">Heb 9:23</a>). At the time of the translation of the King James Version the word "pattern" meant either the thing to be copied or the copy.``133';

isbe[6746]='Paul, the Apostle, 1`pol,<P><b>I. SOURCES</b><P class="in15">1. The Acts<P class="in15">2. The Thirteen Epistles<P class="in30">(1) Pauline Authorship<P class="in30">(2) Lightfoot\'s Grouping<P class="in45">(a) First Group (1 and 2 Thessalonians)<P class="in45">(b) Second Group (1 and 2 Corinthians, Galatians, Romans, <P class="in45">(c) Third Group-(Philippians, Philemon, Colossians, Ephesians)<P class="in45">(d) Fourth Group (1 Timothy, Titus, 2 Timothy)<P class="in30">(3) Paul\'s Conception of His Epistles<P class="in30">(4) Development in Paul\'s Epistles<P><b>II. MODERN THEORIES ABOUT PAUL</b><P class="in15">1. Criticism Not Infallible<P class="in15">2. The Tubingen Theory<P class="in15">3. Protest against Baur\'s View<P class="in15">4. Successors to Baur<P class="in15">5. Appeal to Comparative Religion<P class="in15">6. The Eschatological Interpretation<P><b>III. CHRONOLOGY OF PAUL\'S CAREER</b><P class="in15">1. Schemes<P class="in15">2. Crucial Points<P class="in30">(1) The Death of Stephen<P class="in30">(2) The Flight from Damascus<P class="in30">(3) The Death of Herod Agrippa I<P class="in30">(4) The First Mission Tour<P class="in30">(5) The First Visit to Corinth<P class="in30">(6) Paul at Troas according to <span class="noTag">Acts 20:6</span> f<P class="in30">(7) Festus Succeeding Felix<P><b>IV. EQUIPMENT</b><P class="in15">1. The City of Tarsus<P class="in15">2. Roman Citizenship<P class="in15">3. Hellenism<P class="in15">4. The Mystery-Religions<P class="in15">5. Judaism<P class="in15">6. Personal Characteristics<P class="in30">(1) Personal Appearance<P class="in30">(2) Natural Endowments<P class="in30">(3) Supernatural Gifts<P class="in15">7. Conversion<P class="in30">(1) Preparation<P class="in30">(2) Experience<P class="in30">(3) Effect on Paul<P><b>V. WORK</b><P class="in15">1. Adjustment<P class="in15">2. Opposition<P class="in15">3. Waiting<P class="in15">4. Opportunity<P class="in15">5. The First Great Mission Campaign<P class="in15">6. The Conflict at Jerusalem<P class="in15">7. The Second Mission Campaign<P class="in15">8. The Third Mission Campaign<P class="in15">9. Five Years a Prisoner<P class="in15">10. Further Travels<P class="in15">11. Last Imprisonment and Death<P><b>VI. GOSPEL</b><P><b>LITERATURE</b><hr /><P>I. Sources.<P>1. The Acts:<P>For discussion of the historical value of the <A href="./study/isbe/search.html?string=ACTS+OF+THE+APOSTLES">Acts of the Apostles</a> see the article on that subject. It is only necessary to say here that the view of Sir W.M. Ramsay in general is accepted as to the trustworthiness of Luke, whose authorship of the Acts is accepted and proved by Harnack (Die Apostelgeschichte, 1908; The Acts of the Apostles, translation by Wilkinson, 1909; Neue Untersuch. zur Ap., 1911; The Date of the Acts and of the Synoptic Gospels, translations by Wilkinson, 1911). The proof need not be given again. The same hand appears in the "we" sections and the rest of the book. Even Moffatt (Introduction to the Literature of the New Testament, 311) admits the Lukan authorship though dating it in 100 AD instead of 60-62 AD, against Harnack. The Acts is written independently of the Epistles of Paul, whether early or late, and supplements in a wonderful way the incidental references in the epistles, though not without lacunae and difficulties.<P>2. The Thirteen Epistles:<P>(1) Pauline Authorship.<P>See the articles on each epistle for detailed criticism. It is here assumed that the Epistle to the Hebrews was not written by Paul, though Pauline in point of view. One cannot stop to prove every statement in an article like this, else a large book would be needed. Criticism is not an infallible science. One can turn easily from the Hatch-Van Manen article on "Paul" in Encyclopedia Biblica (1902) to the Maclean article on "Paul the Apostle" in the 1-vol HDB (1909). Van-Manen\'s part of the one denies all the thirteen, while Maclean says: "We shall, in what follows, without hesitation use the thirteen epistles as genuine." It is certain that Paul wrote more epistles, or "letters," as Deissmann (Light from the Ancient East, 225) insists on calling all of Paul\'s epistles. Certainly Philera is a mere "letter," but it is difficult to say as much about Romans. Deissmann (St. Paul, 22) admits that portions of Romans are like "an epistolary letter." At any rate, when Moffatt (Introduction to the Literature of the New Testament, 64-82) carefully justifies the Pauline authorship of both 1 and 2 Thessalonians, it is clear that the case against them cannot be very strong, especially as Moffatt stands out against the genuineness of Ephesians (op. cit., 393) and the Pastoral Epistles (p. 414).<P>Bartlet, who was once at a loss to know what to do with the Pastorals on theory that Paul was not released from the Roman imprisonment (Apostolic Age, 1899, 200), is now quite willing to face the new facts set forth by Ramsay (Expos, VII, viii-ix, VIII, i), even if it means the admission of a second Roman imprisonment, a view that Bartlet had opposed. He now pleads for "the fresh approach from the side of experience, by men who are in touch with the realities of human nature in all its variety, as well as at home in the historical background of society in the early Roman empire, that has renovated the study of them and taken it out of the old ruts of criticism in which it has moved for the most part in modern times" (Expos, January, 1913, 29). Here Bartlet, again, now eloquently presents the view of common-sense criticism as seen by the practical missionary better than by a life "spent amid the academic associations of a professor\'s chair," though he pauses to note as an exception Professor P. Gardner\'s The Religious Experience of Paul (1912). We may quote Bartlet once more (Expos, January, 1913, 30): "In the recovery of a true point of view a vital element has been the newer conception of Paul himself and so of Paulinism. Paul the doctrinaire theologian, or at least the prophet of a one-sided gospel repeated with fanatical uniformity of emphasis under all conditions, has largely given place to Paul the missionary, full indeed of inspired insight on the basis of a unique experience, but also of practical instinct, the offspring of sympathy with living men of other types of training. When the Pastorals are viewed anew in the light of this idea, half their difficulties disappear." One need not adopt Deissmann\'s rather artificial insistence on "letters" rather than "epistles," and his undue depreciation of Paul\'s intellectual caliber and culture as being more like Amos than Origen (St. Paul, 1912, 6), in order to see the force of this contention for proper understanding of the social environment of Paul. Against Van Manen\'s "historical Paul" who wrote nothing, he places "the historic Paul" who possibly wrote all thirteen. "There is really no trouble except with the letters to Timothy and Titus, and even there the difficulties are perhaps not quite so great as many of our specialists assume" (St. Paul, 15). See <a href="./study/isbe/search.html?string=PASTORAL+EPISTLES">PASTORAL EPISTLES</a>. Deissmann denies sharply that Paul was an "obscurantist" who corrupted the gospel of Jesus, "the dregs of doctrinaire study of Paul, mostly in the tired brains-of gifted amateurs" (p. 4). But A. Schweitzer boldly proclaims that he alone has the key to Paul and Jesus. It is the "exclusively Jewish eschatological" (Paul and His Interpreters, 1912, ix), conception of Christ\'s gospel that furnishes Schweitzer\'s spring-board (The Quest of the Historical Jesus). Thus he will be able to explain "the Hellenization of the gospel" as mediated through Paul. To do that Schweitzer plows his weary way from Grotius to Holtzmann, and finds that they have all wandered into the wilderness. He is positive that his eschatological discovery will rescue Paul and some of his epistles from the ruin wrought by Steck and Van Manen to whose arguments modern criticism has nothing solid to offer, and the meager negative crumbs offered by Schweitzer ought to be thankfully received (ibid, 249).<P>(2) Lightfoot\'s Grouping.<P>(Compare Biblical Essays, 224.) There is doubt as to the position of Galatians. Some advocates of the South-Galatian theory make it the very earliest of Paul\'s Epistles, even before the Jerusalem Conference in <a onClick="return mV(\'Act\',15,\'1-\');">Ac 15</a>. So Eramet, Commentary on Galatians (1912), ix, who notes (Preface) that his commentary is the first to take this position. But the North Galatian view still has the weight of authority in spite of Ramsay\'s powerful advocacy in his various books (see Historical Commentary on Galatians), as is shown by Moffatt, Introduction to the Literature of the New Testament, 90ff. Hence, Lightfoot\'s grouping is still the best to use.<P>(a) First Group (1 and 2 Thessalonians):<p>1 and 2 Thessalonians, from Corinth, 52-53 AD. Harnack\'s view that 2 Thessalonians is addressed to a Jewish Christian church in Thessalonica while 1 Thessalonians is addressed to a Gentile church is accepted by Lake (Earlier Epistles of Paul,1911,83ff) but Frame (ICC, 1912, 54) sees no need for this hypothesis. Milligan is clear that 1 Thessalonians precedes 2 Thessalonians (Commentary, 1908, xxxix) and is the earliest of Paul\'s Epistles (p. xxxvi). The accent on eschatology is in accord with the position of the early disciples in the opening chapters of Acts. They belong to Paul\'s stay in Corinth recorded in <a onClick="return mV(\'Act\',18,\'1-\');">Ac 18</a>.<P>(b) Second Group (1 and 2 Corinthians, Galatians, Romans):<P>1 Corinthians, 2 Corinthians, Galatians, Romans, 55-58 AD. This is the great doctrinal group, the four chief epistles of Baur. They turn about the Judaizing controversy which furnishes the occasion for the expansion of the doctrine of justification by faith in opposition to the legalistic contention of the Judaizing Christians from Jerusalem (<a onClick="return mV(\'Act\',15,\'1-3\');">Ac 15:1-3</a>; <a onClick="return mV(\'Gal\',2,\'1-10\');">Ga 2:1-10</a>). The dates of these epistles are not perfectly clear. 1 Corinthians was written shortly before the close of Paul\'s 3 years\' stay at Ephesus (<a onClick="return mV(\'Act\',20,31);">Ac 20:31</a>; <a onClick="return mV(\'1Cr\',16,8);">1Co 16:8</a>; <a onClick="return mV(\'Act\',20,1);">Ac 20:1</a>f). 2 Corinthians was written a few months later while he was in Macedonia (<a onClick="return mV(\'2Cr\',2,13);">2:13</A>; <a onClick="return mV(\'2Cr\',7,5,13);">7:5,13</a>; <a onClick="return mV(\'2Cr\',8,\'16-24\');">8:16-24</A>). Romans was written from Corinth (<a onClick="return mV(\'2Cr\',16,23);">16:23</A>; <a onClick="return mV(\'Act\',20,2);">Ac 20:2</a>f) and sent by Phoebe of Cenchrea (<a onClick="return mV(\'Rom\',16,1);">Ro 16:1</a>). The integrity of Romans is challenged by some who deny in particular that chapter <a onClick="return mV(\'Rom\',16,\'1-\');">16</a> belongs to the epistle Moffatt (Intro, 134-38) gives an able, but unconvincing, presentation of the arguments for the addition of the chapter by a later hand. Deissmann (St. Paul, 19) calls <a onClick="return mV(\'Rom\',16,\'1-\');">Ro 16</a> "a little letter" addressed to the Christians at Ephesus. Von. Soden (History of Early Christian Literature, 78) easily justifies the presence of <a onClick="return mV(\'Rom\',16,\'1-\');">Ro 16</a> in the Epistle to the Romans: "These greetings, moreover, were certainly intended by Paul to create bonds of fellowship between the Pauline Christians and the Roman community, and to show that he had not written to them quite exclusively in his own name." A common-sense explanation of Paul\'s personal ties in Rome is the fact that as the center of the world\'s life the city drew people thither from all parts of the earth. So, today many a man has friends in New York or London who has never been to either city. A much more serious controversy rages as to the integrity of 2 Corinthians. Semler took <a onClick="return mV(\'2Cr\',10,\'1-\');">2Co 10-13</a> to be a separate and later ep., because of its difference in tone from <a onClick="return mV(\'2Cr\',1,\'1-\');">2Co 1-9</a>, but Hausrath put it earlier than chapters <a onClick="return mV(\'2Cr\',1,\'1-\');">1-9</a>, and made it the letter referred to in <a onClick="return mV(\'2Cr\',2,4);">2:4</a>. He has been followed by many scholars like Schmiedel, Cone, McGiffert, Bacon, Moffatt, Kennedy, Rendall, Peake, Plummer. Von Soden (History of Early Christian Literature, 50) accepts the partition-theory of 2 Corinthians heartily: "It may be shown with the highest degree of probability that this letter has come down to us in <a onClick="return mV(\'2Cr\',10,\'1-\');">2Co 10:1-13:10</a>." But the unity of the epistle on theory that the change in tone is a climax to the disobedient element of the church is still maintained with force and justice by Klopper, Zahn, Bachmann, Denhey, Bernard, A. Robertson, Weiss, Menzies. The place of the writing of Galatians turns on its date. Lightfoot (in loc.) argues for Corinth, since it was probably written shortly before Romans. But Moffatt (Introduction, 102) holds tentatively to Ephesus, soon after Paul\'s arrival there from Galatia. So he gives the order: Galatians, 1 and 2 Corinthians, Romans. In so much doubt it is well to follow Lightfoot\'s logical argument. Galatians leads naturally to Romans, the one hot and passionate, the other calm and contemplative, but both on the same general theme.<P>(c) Third group (Philippians, Philemon, Colossians, Ephesians):<P>Philippians, Philemon, Colossians, Ephesians. Date 61-63, unless Paul reached Rome several years earlier. This matter depends on the date of the coming of Festus to succeed Felix (<a onClick="return mV(\'Act\',24,27);">Ac 24:27</a>). It was once thought to be 60 AD beyond any doubt, but the whole matter is now uncertain. See "Chronology," III, 2, (2), below. At any rate these four epistles were written during the first Roman imprisonment, assuming that he was set free.<P>But it must be noted that quite a respectable group of scholars hold that one or all of these epistles were written from Caesarea (Schultz, Thiersch, Meyer, Hausrath, Sabatier, Reuss, Weiss, Haupt, Spitta, McPherson, Hicks). But the arguments are more specious than convincing. See Hort, Romans and Ephesians, 101-10. There is a growing opinion that Philemon, Colossians and Ephesians were written from Ephesus during a possible imprisonment in Paul\'s stay of 3 years there. So Deissmann (Light from the Ancient East, 229; Paul, 16); Lisco (Vincula Sanctorum, 1900); M. Albertz (Theol. Studien und Kritiken, 1910, 551ff); B. W. Bacon (Journal of Biblical Lit., 1910, 181ff). The strongest argument for this position is that Paul apparently did not know personally the readers of Eph (<a onClick="return mV(\'Eph\',1,15);">1:15</a>); compare also <a onClick="return mV(\'Col\',1,4);">Col 1:4</a>. But this objection need not apply if the so-called Ephesian Epistle was a circular letter and if Paul did not visit Colosse and Laodicea during his 3 years at Ephesus. The theory is more attractive at first than on reflection. It throws this group before Romans—a difficult view to concede.<P>But even so, the order of these epistles is by no means certain. It is clear that Philemon, Colossians and Ephesians were sent together. Tychicus was the bearer of Colossians (<a onClick="return mV(\'Col\',4,7);">4:7</a>f) and Ephesians (<a onClick="return mV(\'Eph\',6,21);">6:21</a>f). Onesimus carried the letter to Philemon (<a onClick="return mV(\'Phm\',1,10,13);">1:10,13</a>) and was also the companion of Tychicus to Colosse (<a onClick="return mV(\'Col\',4,9);">Col 4:9</a>). So these three epistles went together from Rome. It is commonly assumed that Php was the last of the group of four, and hence later than the other three, because Paul is balancing life and death (<a onClick="return mV(\'Phl\',1,21);">Php 1:21</a>) and is expecting to be set free (<a onClick="return mV(\'Phl\',1,25);">Php 1:25</a>), but he has the same expectation of freedom when he writes Philemon (<a onClick="return mV(\'Phm\',1,22);">1:22</a>). The absence of Luke (<a onClick="return mV(\'Phl\',2,20);">Php 2:20</a>) has to be explained on either hypothesis. Moffatt (Introduction, 159) is dogmatic, "as Philippians was certainly the last letter that he wrote," ruling out of court Ephesians, not to say the later Pastoral Epistles. But this conclusion gives Moffatt trouble with the Epistle to the Laodiceans (<a onClick="return mV(\'Col\',4,16);">Col 4:16</a>) which he can only call "the enigmatic reference" and cannot follow Rutherford (St. Paul\'s Epistles to Colosse and Laodicea, 1908) in identifying the Laodicean Epistle with Ephesians, as indeed Marcion seems to have done. But the notion that Ephesians was a circular letter designed for more than one church (hence, without personalities) still holds the bulk of modern opinion.<P>Von Soden (History of Early Christian Literature, 294) is as dogmatic as Wrede or Van Manen: "All which has hitherto been said concerning this epistle, its form, its content, its ideas, its presuppositions, absolutely excludes the possibility of a Pauline authorship." He admits "verbal echoes of Pauline epistles"<P>Lightfoot puts Philippians before the other three because of its doctrinal affinity with the second group in chapter 3 as a reminiscence, and because of its anticipation of the Christological controversy with incipient Gnosticism in chapter 2. This great discussion is central in Colossians and Ephesians. At any rate, we have thus a consistent and coherent interpretation of the group. Philemon, though purely personal, is wondrously vital as a sociological document. Paul is in this group at the height of his powers in his grasp of the Person of Christ.<P>(d) Fourth Group (1 Timothy, Titus, 2 Timothy):<P>1 Timothy, Titus, 2 Timothy. The Pastoral Epistles are still hotly disputed, but there is a growing willingness in Britain and Germany to make a place for them in Paul\'s life. Von Soden bluntly says: "It is impossible that these epistles as they stand can have been written by Paul" (History of Early Christian Literature, 310). He finds no room for the heresy here combated, or for the details in Paul\'s life, or for the linguistic peculiarities in Paul\'s style. But he sees a "literary nicety"—this group that binds them together and separates them from Paul. Thus tersely he puts the case against the Pauline authorship. So Moffatt argues for the "sub-Pauline environment" and "sub-Pauline atmosphere" of these epistles with the advanced ecclesiasticism (Introduction to the Literature of the New Testament, 410ff). Wrede thrusts aside the personal details and argues that the epistles give merely the tendency of early Christianity (Ueber Aufgabe und Metbode der Sogen. New Testament Theologie, 1897, 357). The Hatch-Van Manen article in Encyclopedia Biblica admits only that "the Pastoral Epistles occupy themselves chiefly with the various affairs of the churches within \'Pauline circles.\' "<P>Moffatt has a vigorous attack on these letters in EB, but he "almost entirely ignores the external evidence, while he has nothing to say to the remarkable internal evidence which immediately demands our attention" (Knowling, Testimony of Paul to Christ, 3rd edition, 1911, 129). Moffatt (Introduction to the Literature of the New Testament, 414) holds that the Pastoral Epistles came from one pen, but the personality and motives are very vague to him. The personal details in <a onClick="return mV(\'2Ti\',1,\'14-18\');">2Ti 1:14-18</a>; <a onClick="return mV(\'2Ti\',4,\'9-22\');">4:9-22</a> are not on a paragraph with those in The Acts of Paul and Thekla in the 2nd century. Many critics who reject the Pauline authorship of the Pastoral Epistles admit the personal details in 2 Timothy, but it is just in such matters that forgeries are recognizable. To admit these fragments is logically to admit the whole (Maclean in 1-vol HDB), as Moffatt sees (Intro, 414), however much he seeks to tone down the use of Paul\'s name as "a Christian form of suasoriae," and "a further and inoffensive development of the principle which sought to claim apostolic sanction for the expanding institutions and doctrines of the early church" (ibid., 415). The objection against these epistles from differences in diction has been grievously overdone. As a matter of fact, each of the four groups has words peculiar to it, and naturally so. Style is a function of the subject as well as a mark of the man. Besides, style changes with one\'s growth. It would have been remarkable if all four<P>groups had shown no change in no change in vocabulary and style. The case of Shakespeare is quite pertinent, for the various groups of plays stand more or less apart. The Pastoral Epistles belong to Paul\'s old age and deal with personal and ecclesiastical matters in a more or less reminiscential way, with less of vehement energy than we get in the earlier epistles, but this situation is what one would reasonably expect. The "ecclesiastical organization" argument has been greatly overdone. As a matter of fact, "the organization in the Pastoral Epistles is not apparently advanced one step beyond that of the church in Philippi in 61 AD" (Ramsay, The Expositor, VII, viii, 17). The "gnosis" met by these epistles (<a onClick="return mV(\'1Ti\',6,20);">1Ti 6:20</a>; <a onClick="return mV(\'Tts\',1,14);">Tit 1:14</a>) is not the highly developed type seen in the Ignatian Epistles of the 2nd century. Indeed, Bartlet ("Historic Setting of the Pastoral Epistles," The Expositor, January, 1913, 29) pointedly says that, as a result of Hort\'s "Judaistic Christianity" and "Christian Ecclesia" and Ramsay\'s "Historical Commentary on the Epistles of Timothy" (Expos, VII, vii, ix, VIII, i), "one feels the subject has been lifted to a new level of reality and that much criticism between Baur and Julicher is out of date and irrelevant." It is now shown that the Pastoral Epistles are not directed against Gnosticism of advanced type, but even of a more Jewish type (<a onClick="return mV(\'Tts\',1,14);">Tit 1:14</a>) than that in Colossians. Ramsay (Expos, VIII, i, 263) sweeps this stock criticism aside as "from the wrong point of view." It falls to the ground. Lightfoot ("Note on the Heresy Combated in the Pastoral Epistles," Biblical Essays, 413) had insisted on the Jewish character of the Gnosticism attacked here. As a matter of fact, the main objection to these epistles is that they do not fit into the story in Acts, which breaks off abruptly with Paul in Rome. But it is a false premise to assume that the Pastoral Epistles have to fit into the events in Acts. Harnack turns the objection that Paul in <a onClick="return mV(\'Act\',20,26);">Ac 20:26</a> predicted that he would never see the Ephesian elders again into a strong argument for the date of Luke\'s Gospel before <a onClick="return mV(\'2Ti\',4,21);">2Ti 4:21</a> (The Date of Acts and Synoptic Gospels, 103). Indeed, he may not have revisited Ephesus after all, but may have seen Timothy at Miletus also (<a onClick="return mV(\'1Ti\',1,3);">1Ti 1:3</a>). Harnack frankly admits the acquittal and release of Paul and thus free play for the Pastoral Epistles Blass (Acta Apostolorum, 24) acknowledges the Pastoral Epistles as genuine. So also Findlay, article "Paul," in HDB; Maclean in 1-vol HDB; Denney in Standard BD. Sanday (Inspiration, 364) comments on the strength of the external evidence for the Pastoral Epistles. Even Holtzmann (Einl(3), 291) appears to admit echoes of the Pastoral Epistles in the Ignatian Epistles Lightfoot (Biblical Essays, "Date of the Pastoral Epistles," 399-437) justifies completely the acceptance of the Pauline authorship. Deissman (St. Paul, 15) has a needed word: "The delusion is still current in certain circles that the scientific distinction of a Bible scholar may be estimated in the form of a percentage according to the proportion of his verdicts of spuriousness....The extant letters of Paul have been innocently obliged to endure again a fair share of the martyrdom suffered by the historic Paul." See further <a href="./study/isbe/search.html?string=PASTORAL+EPISTLES">PASTORAL EPISTLES</A>.<P>(3) Paul\'s Conception of His Epistles<P>Assuming, therefore, the Pauline authorship of the thirteen epistles, we may note that they, reveal in a remarkable way the growth in Paul\'s apprehension of Christ and Christianity, his adaptation to varied situations, his grasp of world-problems and the eternal values of life. Paul wrote other epistles, as we know. In <a onClick="return mV(\'1Cr\',5,9);">1Co 5:9</a> there is a clear reference to a letter not now known to us otherwise, earlier than 1 Corinthians. The use of "every epistle" in <a onClick="return mV(\'2Th\',3,17);">2Th 3:17</a> naturally implies that Paul had written more than two already. It is not certain to what letter Paul refers in <a onClick="return mV(\'2Cr\',2,4);">2Co 2:4</a>—most probably to one between 1 and 2 Corinthians, though, as already shown, some scholars find that letter in <a onClick="return mV(\'2Cr\',10,1);">2Co 10-13</a>. Once more Paul (<a onClick="return mV(\'Col\',4,16);">Col 4:16</a>) mentions an epistle addressed to the church at Laodicea. This epistle is almost certainly that which we know as Ephesians. If not, here is another lost epistle. Indeed, at least two apocryphal Epistles to the Laodiceans were written to supply this deficiency. As early as <a onClick="return mV(\'2Th\',2,2);">2Th 2:2</a> forgers were at work to palm, off epistles in Paul\'s name, "or by epistle as from us," to attack and pervert Paul\'s real views, whom Paul denounces. It was entirely possible that this "nefarious work" would be continued (Gregory, Canon and Text of the New Testament,1907,191), though, as Gregory argues, Paul\'s exposure here would have a tendency to put a stop to it and to put Christians on their guard and to watch for Paul\'s signature to the epistles as a mark of genuineness (<a onClick="return mV(\'2Th\',3,17);">2Th 3:17</a>; <a onClick="return mV(\'1Cr\',16,21);">1Co 16:21</a>; <a onClick="return mV(\'Gal\',6,11);">Ga 6:11</a>; <a onClick="return mV(\'Col\',4,18);">Col 4:18</a>). This was all the more important since Paul evidently dictated his letters to amanuenses, as to Tertius in the case of <a onClick="return mV(\'Rom\',16,22);">Ro 16:22</a>. In the case of <a onClick="return mV(\'Phm\',1,19);">Phm 1:19</a>, Paul probably wrote the whole letter. We may be sure therefore that, if we had the other genuine letters of Paul, they would occupy the same general standpoint as the thirteen now in our possession. The point to note here is that the four groups of Paul\'s Epistles fit into the historical background of the Acts as recorded by Luke, barring the fourth group which is later than the events in Acts. Each group meets a specific situation in a definite region or regions, with problems of vital interest. Paul attacks these various problems (theological, ecclesiastical, practical) with marvelous vigor, and applies the eternal principles of the gospel of Christ in such fashion as to furnish a norm for future workers for Christ. It is not necessary to say that he was conscious of that use. Deissmann (St. Paul, 12f) is confident on this point: "That a portion of these confidential letters should be still extant after centuries, Paul cannot have intended, nor did it ever occur to him that they would be." Be that as it may, and granted that Paul\'s Epistles are "survivals, in the sense of the technical language employed by the historical method" (ibid., 12), still we must not forget that Paul attached a great deal of importance to his letters and urged obedience to the teachings which they contained: "I adjure you by the, Lord that this epistle be read unto all the brethren" (<a onClick="return mV(\'1Th\',5,27);">1Th 5:27</a>). This command we find in the very first one preserved to us. Once more note <a onClick="return mV(\'2Th\',3,14);">2Th 3:14</a>: "And if any man obeyeth not our word by this ep., note that man, that ye have no company with him." Evidently therefore Paul does not conceive his epistles as mere incidents in personal correspondence, but authoritative instructions for the Christians to whom they are addressed. In <a onClick="return mV(\'1Cr\',7,17);">1Co 7:17</a>, "And so ordain I in all the churches," he puts his epistolary commands on a paragraph with the words of Jesus quoted in the same chapter. Some indeed at Corinth (<a onClick="return mV(\'2Cr\',10,9);">2Co 10:9</a>f) took his "letters" as an effort to "terrify" them, a thing that he was afraid to do in person. Paul (<a onClick="return mV(\'2Cr\',10,11);">2Co 10:11</a>) does not deny the authority of his letters, but claims equal courage when he comes in person (compare <a onClick="return mV(\'2Cr\',13,2,10);">2Co 13:2,10</a>). That Paul expected his letters to be used by more than the one church to which they were addressed is clear from <a onClick="return mV(\'Col\',4,16);">Col 4:16</a>: "And when this epistle hath been read among you, cause that it be read also in the church of the Laodiceans; and that ye also read the epistle from Laodicea." If the letter to Laodicea is our Eph and a sort of circular letter (compare Galatians), that is clear. But it must be noted that Colossians, undoubtedly a specific letter to Colosse, is likewise to be passed on to Laodicea. It is not always observed that in <a onClick="return mV(\'1Cr\',1,2);">1Co 1:2</a>, though the epistle is addressed "unto the church of God which is at Corinth," Paul adds, "with all that call upon the name of our Lord Jesus Christ in every place, their Lord and ours." Philemon is, of course, a personal letter, though it deals with a sociological problem of universal interest. The Pastoral Epistles are addressed to two young ministers and have many personal details, as is natural, but the epistles deal far more with the social aspects of church life and the heresies and vices that were threatening the very existence of Christianity in the Roman empire. Paul is eager that Timothy shall follow his teaching (<a onClick="return mV(\'2Ti\',3,10);">2Ti 3:10</a>), and "the same commit thou to faithful men, who shall be able to teach others also" (<a onClick="return mV(\'2Ti\',2,2);">2Ti 2:2</a>). It is this larger view of the future of Christianity that concerns Paul very keenly. The very conception of his ministry to the Gentiles (<a onClick="return mV(\'Rom\',15,16);">Ro 15:16</a>; <a onClick="return mV(\'Eph\',3,7);">Eph 3:7</a>) led Paul to feel that he had a right to speak to all, "both to Greeks and to Barbarians" (<a onClick="return mV(\'Rom\',1,14);">Ro 1:14</a>), and hence, even to Rome (<a onClick="return mV(\'Rom\',1,15);">Ro 1:15</a>f). It is a mistake to limit Paul\'s Epistles to the local and temporary sphere given them by Deissmann.<P>(4) Development in Paul\'s Epistles<P>For Paul\'s gospel or theology see later. Here we must stress the fact that all four groups of Paul\'s Epistles are legitimate developments from his fundamental experience of grace as conditioned by his previous training and later work. He met each new problem with the same basal truth that Jesus is the Messiah, the Son of God, revealed to Paul on the way to Damascus. The reality of this great experience must here be assumed (see discussion later). It may be admitted that the Acts does not stand upon the same plane as the Pauline Epistles as a witness concerning Paul\'s conversion (Fletcher, The Conversion of Paul, 1910, 5). But even so, the Epistles amply confirm Luke\'s report of the essential fact that Jesus appeared to Paul in the same sense that He did to the apostles and 500 Christians (<a onClick="return mV(\'1Cr\',15,\'4-9\');">1Co 15:4-9</a>). The revelation of Christ to Paul and in Paul (en emoi, <a onClick="return mV(\'Gal\',1,16);">Ga 1:16</a>) and the specific call connected therewith to preach to the Gentiles gave Paul a place independent of and on a paragraph with the other apostles (<a onClick="return mV(\'Gal\',1,16);">Ga 1:16</a>f; <a onClick="return mV(\'Gal\',2,\'1-10\');">2:1-10</a>). Paul\'s first preaching (<a onClick="return mV(\'Act\',9,20);">Ac 9:20</a>) "proclaimed Jesus, that he is the Son of God." This "primitive Paulinism" (Sabatier, The Apostle Paul,1893,113) lay at the heart of Paul\'s message in his sermons and speeches in Acts. Professor P. Gardner regards Luke as a "careless" historian ("The Speeches of Paul in Acts," Cambridge Biblical Essays, 1909, 386), but he quite admits the central place of Paul\'s conversion, both in the Acts and the Epistles (ib; compare also The Religious Experience of Paul).<P>We cannot here trace in detail the growth of Paulinism. Let Wernle speak (Beginnings of Christianity,1903, I, 224) for us: "The decisive factor in the genius of Paul\'s theology was his personal experience, his conversion on the road to Damascus." This fact reappears in each of the groups of the Epistles. It is the necessary implication in the apostolic authority claimed in <a onClick="return mV(\'1Th\',2,\'4-6\');">1Th 2:4-6</a>; <a onClick="return mV(\'2Th\',2,15);">2Th 2:15</a>; <a onClick="return mV(\'2Th\',3,6,14);">3:6,14</a>. "We might have claimed authority as apostles of Christ" (<a onClick="return mV(\'1Th\',2,6);">1Th 2:6</a>). For the second group we need only refer to <a onClick="return mV(\'1Cr\',9,1);">1Co 9:1</a>f and <a onClick="return mV(\'1Cr\',15,\'1-11\');">15:1-11</a>, where Paul justifies his gospel by the fact of having seen the risen Jesus. His self-depreciation in <a onClick="return mV(\'1Cr\',15,9);">15:9</a> is amply balanced by the claims in <a onClick="return mV(\'1Cr\',15,10);">15:10</a>. See also <a onClick="return mV(\'2Cr\',10,\'1-\');">2Co 10-13</a> and <a onClick="return mV(\'Gal\',1,\'1-\');">Galatians 1</a> and <a onClick="return mV(\'Gal\',2,\'1-\');">2</a> for Paul\'s formal defense of his apostolic authority. The pleasantry in <a onClick="return mV(\'Rom\',15,14);">Ro 15:14</a> does not displace the claim in <a onClick="return mV(\'Rom\',15,16,23);">15:16,23</A>f. In the third group note the great passage in <a onClick="return mV(\'Phl\',3,\'12-14\');">Php 3:12-14</a>, where Paul pointedly alludes to his conversion: "I was laid hold of by Jesus Christ," as giving him the goal of his ambition, "that I may lay hold"; "I count not myself yet to have laid hold." This concentration of effort to come up to Christ\'s purpose in him is the key to Paul\'s life and letters, "I press on toward the goal." So the golden cord reappears in <a onClick="return mV(\'Eph\',3,\'2-13\');">Eph 3:2-13</a>: "How that by revelation was made known unto me the mystery, as I wrote before in few words, whereby, when ye read, ye can perceive my understanding in the mystery of Christ." In the fourth group he still recalls how Christ Jesus took pity on him, the blasphemer, the persecutor, the chief of sinners, and put him into the ministry, "that in me as chief might Jesus Christ show forth all his longsuffering, for an ensample of them that should thereafter believe on him unto eternal life" (<a onClick="return mV(\'1Ti\',1,16);">1Ti 1:16</a>). He kept up the fight to the end (<a onClick="return mV(\'2Ti\',4,6);">2Ti 4:6</a>f), for the Lord Jesus stood by him (<a onClick="return mV(\'2Ti\',4,17);">2Ti 4:17</a>), as on the road to Damascus. So the personal note of experience links all the epistles together.They reveal Paul\'s growing conception of Christ. Paul at the very start perceived that men are redeemed by faith in Jesus as the Saviour from sin through His atoning death, not by works of the Law (<a onClick="return mV(\'Act\',13,38);">Ac 13:38</a>f). In the first group there are allusions to the "work of faith and labor of love and patience of hope in our Lord Jesus Christ" (<a onClick="return mV(\'1Th\',1,3);">1Th 1:3</a>). He speaks of "election" (<a onClick="return mV(\'1Th\',1,4);">1Th 1:4</a>) and "our gospel" (<a onClick="return mV(\'1Th\',1,5);">1Th 1:5</a>) and the resurrection of Jesus (<a onClick="return mV(\'1Th\',1,10);">1Th 1:10</a>). The Father, Son and Spirit cooperate in the work of salvation (<a onClick="return mV(\'2Th\',2,13);">2Th 2:13</a>f), which includes election, belief, sanctification, glorification. It is not necessary to press the argument for the conception of salvation by faith in Christ, grace as opposed to works, in the second group. It is obviously present in the third and the fourth. We seem forced to the view therefore that Paul\'s experience was revolutionary, not evolutionary. "If we consider the whole history of Paul as it is disclosed to us in his letters, are we not forced to the conclusion that his was a catastrophic or explosive, rather than a slowly progressive personality?" (Garvie, Studies of Paul and His Gospel, 1911, 32). "His gospel was included in his conversion, and it was meditation that made explicit what was thus implicit in his experience" (same place). This is not to say that there was no "spiritual development of Paul" (Matheson, 1890). There was, and of the richest kind, but it was a growth of expression in the successive application of the fundamental Christian conception. The accent upon this or that phase of truth at different stages in Paul\'s career does not necessarily mean that the truth is a new one to him. It may simply be that the occasion has arisen for emphasis and elaboration.<P>In a broad generalization the first group of the epistles is eschatological, the second soteriological, the third Christological, and the fourth pastoral (Garvie, Studies of Paul and His Gospel, 22). But one must not get the notion that Paul did not have a full gospel of salvation in the first group, and did not come to the true motive of the person of Christ as Lord till the second, or understand the pastoral office till the fourth. See emphasis on Paul\'s work as pastor and preacher in <a onClick="return mV(\'1Th\',2,\'1-\');">1Th 2</a> (first group), and the Lordship of Christ also (<a onClick="return mV(\'1Th\',1,1,3);">1Th 1:1,3</a>; <a onClick="return mV(\'2Th\',1,1);">2Th 1:1</a>; <a onClick="return mV(\'2Th\',2,13);">2:13</a>f), on a paragraph with the Father.<P>There was a change of accent in each group on questions of eschatology, but in each one Paul cherishes the hope of the second coming of Christ up to the very end when he speaks of his own death (<a onClick="return mV(\'2Ti\',4,8,18);">2Ti 4:8,18</a>). Paul has a whole gospel of grace in all his epistles, but he presses home the special phase of truth needed at the moment, always with proper balance and modification, though not in the form of a system of doctrine. In the first group he relieves the minds of the Thessalonian Christians from the misapprehension into which they had fallen concerning his position on the immediate coming of Christ. In the second group Paul vindicates the gospel of grace from the legalistic addition of the Judaizers who sought to rob the Gentiles of their freedom by insisting that they become Jews as well as Christians. This ringing battle is echoed in <a onClick="return mV(\'Act\',15,\'1-\');">Ac 15</a> and is the mightiest conflict of Paul\'s career. We hear echoes of it in <a onClick="return mV(\'Phl\',3,\'1-\');">Php 3</a>, but he had won his contention. In the third group the battle with error has shifted to the province of Asia, especially the Lycus Valley, where a mystic mixture of Judaism (Essenism) and heathen mystery-religions and philosophies (incipient Gnosticism) was so rife in the 2nd century (the various forms of Gnosticism which combined with some aspects of Christianity). It is possible also that Mithraism was already a foe of Christianity. The central position and essential deity of Jesus Christ was challenged by these new and world-old heresies, and Paul attacks them with marvelous skill in Col and Eph and works out in detail his teaching concerning the person of Christ with due emphasis on the soteriological aspects of Christ\'s work and on Christian life. Bruce (St. Paul\'s Conception of Christianity) conceives that Paul gives us his entire conception of Christianity in the four great epistles of the second group, while B. Weiss (Biblical Theology of the New Testament) sees a more developed doctrine in the third group. He is in his prime in both groups. In the fourth group the same struggle lingers on with variations in Crete and even in Ephesus. The Jewish phase of the heresy is more decided (perhaps Pharisaic), and recalls to some extent the Judaistic controversy in the second group. Paul is older and faces the end, and Christianity has enemies within and without. He turns to young ministers as the hope of the future in the propagation of the gospel of the happy God. The fires have burned lower, and there is less passion and heat. The tone is now fierce, now tender. The style is broken and reminiscent and personal, though not with the rush of torrential emotion in 2 Corinthians, nor the power of logic in Galatians and Romans. Each epistle fits into its niche in the group. Each group falls into proper relation to the stage in Paul\'s life and justly reveals the changes of thought and feeling in the great apostle. It is essential that one study Paul\'s Epistles in their actual historical order if one wishes to understand the mind of Paul. Scholars are not agreed, to be sure on this point. They are not agreed on anything, for that matter. See two methods of presenting Paul\'s Epistles in Robertson, Chronological New Testament (1904), and Moffatt, Historical New Testament (1901).``150';
isbe[6747]='Paul, the Apostle, 2`II. Modern Theories about Paul.<P>1. Criticism Not Infallible:<P>Findlay (HDB, "Paul") utters a needed warning when he reminds us that the modern historical and psychological method of study is just as liable to prepossession and prejudice as the older categories of scholastic and dogmatic theology. "The focus of the picture may be displaced and its colors falsified by philosophical no less than by ecclesiastical spectacles" (same place). Deissmann (St. Paul, 4f) sympathizes with this protest against the infallibility of modern subjective criticism: "That really and properly is the task of the modern student of Paul: to come back from the paper Paul of our western libraries, Germanized, dogmatised, modernized, to the historic Paul; to penetrate through the \'Paulinism\' of our New Testament theologies to the Paul of ancient reality." He admits the thoroughness and the magnitude of the work accomplished in the 19th century concerning the literary questions connected with Paul\'s letters, but it is a "doctrinaire interest" that "has gone farther and farther astray." Deissmann conceives of Paul as a "hero of piety first and foremost," not as a theologian. "As a religious genius Paul\'s outlook is forward into a future of universal history." In this position of Deissmann we see a return to the pre-Baur time. Deissmann would like to get past all the schools of criticism, back to Paul himself.<P>2. The Tubingen Theory:<P>Baur started the modern critical attitude by his Pastoralbriefe (1835, p. 79), in which he remarked that there were only four epistles of Paul (<a onClick="return mV(\'Gal\',1,1);">Galatians 1</a> and 2 Corinthians, Romans) which could be accepted as genuine. In his Paulus (1845) he expounded this thesis. He also rejected the Acts. From the four great epistles and from the pseudo-Clementine literature of the 2nd century, Baur argued that Paul and Peter were bitter antagonists. Peter and the other apostles were held fast in the grip of the legalistic conception of Christianity, a sort of Christianized Pharisaism. Paul, when converted, had reacted violently against this view, and became the exponent of Gentile freedom. Christianity was divided into two factions, Jewish Christians (Petrinists) and Gentile Christians (Paulinists). With this "key" Baur ruled out the other Pauline epistles and Acts as spurious, because they did not show the bitterness of this controversy. He called them "tendency" writings, designed to cover up the strife and to show that peace reigned in the camp. This arbitrary theory cut a wide swath for 50 years, and became a fetich with many scholars, but it is now dead. "It has been seen that it is bad criticism to make a theory on insecure grounds, and then to reject all the literature which contradicts it" (Maclean in 1-vol HDB). Ramsay (The First Christian Century,1911,195) contends that the perpetuation of the Baur standpoint in Moffatt\'s Introduction to the Literature of the New Testament is an anachronism: "We are no longer in the 19th century with its negations, but in the 20th century with its growing power of insight and the power of belief that springs therefrom." Van Marten (Encyclopedia Biblica) calls the Baur view that of the "old guard" of liberal theology in Germany, Switzerland, France, Holland, and, to some extent, in Britain.<P>3. Protest against Baur\'s View:<P>But even in Germany the older conservative view of Paul has always had champions. The most consistent of the recent opponents of Baur\'s views in Germany is Th. Zahn (compare his Einlin das New Testament, 2 volumes, 1897-99; Introduction to the New Testament, 3 volumes, 1910). In Britain the true successor of Lightfoot as the chief antagonist of the Tubingen School is Sir W.M. Ramsay, whose numerous volumes (Church in the Roman Empire, 1893; Cities and Bishoprics of Phrygia, 1895; Paul the Traveler, 1896; Pauline and Other Studies, 1906; Cities of Paul, 1908; Luke the Physician and Other Studies, 1908; Pictures of the Apostolic Church, 1910; The First Christian Century, 1911) have given the finishing touches to the overthrow of Baur\'s contention.<P>4. Successors to Baur:<P>But even so, already the Baur school had split into two parts. The ablest representatives, like H. J. Holtzmann, Pfleiderer, Harnack, Julicher, Lipsius, von Soden, were compelled to admit more of Paul\'s Epistles as genuine than the four principal ones, till there are left practically none to fight over but Eph and the Pastoral Epistles. This progress eliminated completely Baur\'s thesis and approached very nearly to the position of Lightfoot, Ramsay and Zahn. Von Soden (Early Christian Literature, 324) still stands out against 2 Thessalonians, but Harnack has deserted him on that point. But the old narrow view of Baur is gone, and von Soden is eloquent in his enthusiasm for Paul (ibid., 119): "As we gaze upon the great literary memorials of the Greeks we may well question whether these Pauline letters are not equal to them—indeed, do not surpass them—in spiritual significance, in psychological depths and loftiness of ideal, above all in the art of complete and forcible expression." The other wing of Baur\'s school Findlay (HDB) calls "ultra-Baurians." It is mainly a Dutch school with Loman and Van Manen as its main exponents, though it has support in Germany from Steck and Volter, and in America from W. B. Smith. These writers do not say that Paul is a myth, but that our sources (Acts and the 13 epistles) are all legendary. It is a relentless carrying of Baur\'s thesis to a reductio ad absurdum. Van Manen (Encyclopedia Biblica) says of "the historical, Paul" as distinct from "the legendary Paul": "It does not appear that Paul\'s ideas differed widely from those of the other disciples, or that he had emancipated himself from Judaism or had outgrown the law more than they." When one has disposed of all the evidence he is entirely free to reconstruct the pictures to suit himself. Quite arbitrarily, Van Manen accepts the "we"-sections in Acts as authoritative. But these give glimpses of the historical Jesus quite as truly as the Pauline Epistles, and should therefore be rejected by advocates of the mythical Jesus. So the pendulum swings back and forth. One school destroys the other, but the fact of Paul\'s personality remains. "The new start is one of such importance that we must distinguish the pre-Pauline from the post-Pauline Christianity, or, what amounts to the same thing, the Palestinian sect and the world-religion" (Wernle, Beginnings of Christianity, I, 159).<P>5. Appeal to Comparative Religion:<P>In his Paulus (1904), Wrede finds the explanation of Paul\'s theology in late Jewish apocalyptic views and in the oriental mystery religions. Bousset (Die Religion des Judenthums im New Testament Zeitalter, 1903) seeks to find in the "late Jewish apocalyptic" "conceptions from the Babylonian and the Irano-Zarathustrian religions" (Schweitzer, Paul and His Interpreters, 173). According to Wrede\'s view, Paul is one of the creators of "Christ" as distinct from the Jesus of history (compare "Jesus or Christ," HJ, suppl., January, 1909). "Wrede\'s object is to overthrow the view predominant in modern theology, that Paul loyally and consistently expounded and developed theology of Jesus" (J. Weiss, Paul and Jesus,1909,2). J. Weiss in this book makes a careful reply to Wrede as others have done; compare A. Meyer, Jesus or Paul (1909), who concludes (p. 134) dramatically: "Paul—just one who points the way to Jesus and to God!" See also Julicher, Paulus und Jesus (1907); Kaftan, Jesus und Paulus (1906); Kolbing, Die geistige Einwirkung der Person Jesu und Paulus (1906). The best reply to Wrede\'s arguments about the mystery-religion is found in articles in the The Expositor for 1912-13 (now in book form) by H.A.A. Kennedy on "St. Paul and the Mystery-Religions." The position of Wrede is carried to its logical conclusion by Drews (Die Christus-Mythe, 1909), who makes Paul the creator of Christianity. W. B. Smith (Der vorchristliche Jesus, 1906) tries to show that "Jesus" was a pre-Christian myth or god. Schweitzer (Paul and His Interpreters, 235) sums the matter up thus: "Drews\'s thesis is not merely a curiosity; it indicates the natural limit at which the hypothesis advanced by the advocates of comparative religion, when left to its own momentum, finally comes to rest."<P>6. The Eschatological Interpretation:<P>Schweitzer himself may be accepted as the best exponent of the rigid application of this view to Paul (Paul and His Interpreters, 1912) that he had made to Jesus (The Quest of the Historical Jesus, 1910). He glories in the ability to answer the absurdities of Steck, Loman and Van Manen and Drews by showing that the eschatological conceptions of Paul in his epistles are primitive, not late, and belong to the 1st century, not to the 2nd (Paul and His Interpreters, 249). He thus claims to be the true pupil of Baur, though reaching conclusions utterly different. There is undoubtedly an element of truth in this contention of Schweitzer, but he loses his case, when he insists that nothing but eschatology must be allowed to figure. "The edifice constructed by Baur has fallen," he proclaims (p. viii), but he demands that in its place we allow the "exclusively Jewish-eschatological" (p. ix) interpretation. There he slips, and his theory will go the way of that of Baur. C. Anderson Scott ("Jesus and Paul," Cambridge Biblical Essays, 365) admits that Paul has the same eschatological outlook as Jesus, but also the same ethical interest. It is not "either ..... or," but both in each case. See a complete bibliography of the "Jesus and Paul" controversy in J. G. Machens\' paper on "Jesus and Paul" in Biblical and Theological Studies (1912, 547f). As Ramsay insists, we are now in the 20th century of insight and sanity, and Paul has come to his own. Even Wernle (Beginnings of Christianity, I, 163) sees that Paul is not the creator of the facts: "He merely transmits historical facts. God—Christ—Paul, such is the order." Saintsbury (History of Criticism, 152) says: "It has been the mission of the 19th century to prove that everybody\'s work was written by somebody else, and it will not be the most useless task of the 20th to betake itself to more profitable inquiries."``150';
isbe[6748]='Paul, the Apostle, 3`III. Chronology of Paul\'s Career.<P>1. Schemes:<P>There is not a single date in the life of Paul that is beyond dispute, though several are narrowed to a fine point, and the general course and relative proportion of events are clear enough. Luke gave careful data for the time of the birth of Jesus (<a onClick="return mV(\'Luk\',2,1);">Lu 2:1</a>f), for the entrance of the Baptist on his ministry (<a onClick="return mV(\'Luk\',3,1);">Lu 3:1</a>f), and the age of Jesus when He began His work (<a onClick="return mV(\'Luk\',3,23);">Lu 3:23</a>), but he takes no such pains in the Acts with chronology. But we are left with a number of incidental allusions and notes of time which call for some discussion. For fuller treatment see <a href="./study/isbe/search.html?string=CHRONOLOGY+OF+THE+NEW+TESTAMENT">CHRONOLOGY OF THE NEW TESTAMENT</a>. Garvie (Life and Teaching of Paul, 1910, 181) gives a comparative table of the views of Harnack, Turner, Ramsay and Lightfoot for the events from the crucifixion of Christ to the close of Acts. The general scheme is nearly the same, differing from one to four years here and there. Shaw (The Pauline Epistles, xi) gives a good chronological scheme. Moffatt (Introduction to the Literature of the New Testament, 62f) gives theories of 23 scholars:<P>Turner, "Chronology," in HDB; Neteler, Untersuchung New Testament Zeitverhaltnisse, 1894; O. Holtzmann, New Testament Zeitgeschichte,1895,changed in 2nd edition, 1906; Bartlet, Apostolic Age, xiiif; Cornely (compare Laurent), New Testament Studien; Harnack, Chron. d. altchristl. Lit. bis Eusebius, 233-329; McGiffert, Apostolic Age,164,172; Zahn, Intro, III, 450f; Ramsay, "The Pauline Chronology," Pauline and Other Studies, 345f; Lightfoot, Biblical Essays, 213-33; Wendt, Acts, 53-60, Meyer, Commentary; Renan, Paul; Bornemann, Thess, 17f; Meyer, Comm.; Clemen, Paulus, I, 411; Giffert, Student\'s Life of Paul, 242-59; Weiss, Intro, I, 154f; Sabatier, Paul, 13f; Julicher, Einl6, 31f; Findlay, "Paul" in HDB; Farrar, Paul, Appendix; Belser, Theol. Quartalschrift; Steinmann, Abfassungszeit d. Gal, 169; Hoennicke, Die Chronologie des Paulus.<P>Let us look at the dates given by ten of this list:<P>Turner Bartlet Harnack McGiffert Zahn<P>Conversion 35-36 31-32 30 31-32 35<P>1st visit to Jerusalem 38 34-35 33 34-45 38<P>2nd visit to Jerusalem 46 46 44 45 44<P>1st missionary tour 47 47 45 before 45 50-51<P>Meeting in Jerusalem 49 49 46-47 45 52<P>2nd missionary tour 49 49 46-47 46 52<P>3rd missionary tour 52 52 50 49 54<P>Arrest in Jerusalem 56 56 53-54 53 58<P>Arrival in Rome 59 59 56-57 56 61<P>Death of Paul 64-65 61-62 64 58 66-67<P>Ramsay Lightfoot Clemen Findlay Hoennicke<P>Conversion 32 34 31 36 33-35<P>1st visit to Jerusalem 34 37 34 39 36-38<P>2nd visit to Jerusalem 45 45...45-46<P>1st missionary tour 46-48 48 46 46 49?<P>Meeting in Jerusalem 50 51 48 49 50-52<P>2nd missionary tour 50-53 51 49-52 49 ..<P>3rd missionary tour 53-57 54 53-59 53 ..<P>Arrest in Jerusalem 57 58 59 57 ..<P>Arrival in Rome 60 61 62 60 60-62<P>Death of Paul 67 67 64 67 ..<P>This table shows very well the present diversity of opinion on the main points in Paul\'s life. Before expressing an opinion on the points at issue it is best to examine a few details. Paul himself gives some notes of time. He gives "after 3 years" (<a onClick="return mV(\'Gal\',1,18);">Ga 1:18</a>) as the period between his conversion and first visit to Jerusalem, though he does not necessarily mean 3 full years. In <a onClick="return mV(\'Gal\',2,1);">Ga 2:1</a>, Paul speaks of another visit to Jerusalem "after the space of 14 years." Then again Luke quotes him as saying to the Ephesian elders at Miletus that he had spent "3 years" at Ephesus (<a onClick="return mV(\'Act\',20,31);">Ac 20:31</a>). These periods of time all come before Paul\'s last visit and arrest in Jerusalem, and they do not embrace all the time between his conversion and arrest. There is also another note of time in <a onClick="return mV(\'2Cr\',12,2);">2Co 12:2</a>, where he speaks in an enigmatic way of experiences of his "14 years" ago from the writing of this epistle from Macedonia on the third tour. This will take him back to Tarsus before coming to Antioch at the request of Barnabas, and so overlaps a bit the other "14" above, and includes the "3 years" at Ephesus. We cannot, therefore, add these figures together for the total. But some light may be obtained from further details from Acts and the Epistles.<P>2. Crucial Points:<P>(1) The Death of Stephen.<P>Saul is "a young man" (<a onClick="return mV(\'Act\',7,58);">Ac 7:58</a>) when this event occurs. Like other young Jews he entered upon his life as a rabbi at the age of thirty. He had probably been thus active several years, especially as he was now in a position of leadership and may even have been a member of the Sanhedrin (<a onClick="return mV(\'Act\',26,10);">Ac 26:10</a>). Pontius Pilate was not deposed from his procuratorship till 36 AD, but was in a state of uneasiness for a couple of years. It is more probable, therefore, that the stoning of Stephen would take place after his deposition in the interregnum, or not many years before, when he would be afraid to protest against the lawlessness of the Jewish leaders. He had shown timidity at the death of Jesus, 29 or 30 AD, but some of the forms of law were observed. So nothing decisive is here obtained, though 35 AD seems more probable than 32 or 33.<P>(2) The Flight from Damascus.<P>Paul locates this humiliating experience (<a onClick="return mV(\'2Cr\',11,32);">2Co 11:32</a>f) when "the governor under Aretas the king guarded the city of the Damascenes." Aretas the Arabian, and not the Roman, has now control when Paul is writing. The likelihood is that Aretas did not get possession of Damascus till 37 AD, when Tiberius died and was succeeded by Caligula. It is argued by some that the expression "the city of the Damascenes" shows that the city was not under the
