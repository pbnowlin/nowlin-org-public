iglath-pileser claims to have appointed to the throne. The Biblical narrative does not do more than record the fact that "Hoshea the son of Elah made a conspiracy against Pekah the son of Remaliah, and smote him, and slew him, and reigned in his stead" (<a onClick="return mV(\'2Ki\',15,30);">2Ki 15:30</a>). The date given to this act is the 20th year of Jotham. As Jotham\'s reign lasted but 16 years, this number is evidently an error.<P>8. References in Isaiah:<P>For the first time, the historian makes no reference to the religious conduct of a king of Israel. The subject was beneath notice. The second section of Isaiah\'s prophecies (<a onClick="return mV(\'Isa\',7,\'1-\');">Isa 7:1-10:4</a>) belongs to the reign of Ahaz and thus to the time of Pekah, both of whom are named in it. Pekah is named in <a onClick="return mV(\'Isa\',7,1);">Isa 7:1</a>, and is often, in this and the next chapter, referred to as "the son of Remaliah." His loss of the territorial divisions of Zebulun and Naphtali is referred to in <a onClick="return mV(\'Isa\',9,1);">9:1</A>, and is followed by prophecy of their future glory as the earthly home of the Son of Man. The wording of <a onClick="return mV(\'Isa\',9,14);">Isa 9:14</a> shows that it was written before the fall of Samaria, and that of <a onClick="return mV(\'Isa\',10,\'9-11\');">Isa 10:9-11</a> that Damascus and Samaria had both fallen and Jerusalem was expected to follow. This section of Isaiah may thus be included in the literature of the time of Pekah.``17';
isbe[6774]='Pekahiah`pek-a-hi\'-a, pe-ka\'-ya (peqachyah, "Yah hath opened" (the eyes) (<a onClick="return mV(\'2Ki\',15,\'23-26\');">2Ki 15:23-26</a>); Phakesias; Codex Alexandrinus Phakeias):<P>1. Accession:<P>Son of Menahem, and 17th king of Israel. He is said to have succeeded his father in the "50th year of Azariah" (or Uzziah), a synchronism not free from difficulty if his accession is placed in 750-749 (see <a href="./study/isbe/search.html?string=MENAHEM">MENAHEM</a>; <a href="./study/isbe/search.html?string=UZZIAH">UZZIAH</a>). Most date lower, after 738, when an Assyrian inscription makes Menahem pay tribute to Tiglath-pileser (compare <a onClick="return mV(\'2Ki\',15,\'19-21\');">2Ki 15:19-21</a>).<P>2. Regicide in Israel:<P>Pekahiah came to the throne enveloped in the danger which always accompanies the successor of an exceptionally strong ruler, in a country where there is not a settled law of succession. Within two years of his accession he was murdered in a foul manner—the 7th king of Israel who had met his death by violence (the others were Nadab, Elah, Tibni, Jehoram, Zechariah and Shallum). The chief conspirator was Pekah, son of Remaliah, one of his captains, with whom, as agent in the crime, were associated 50 Gileadites. These penetrated into the palace (the Revised Version (British and American) "castle") of the king\'s house, and put Pekahiah to death, his bodyguards, Argob and Arieh, dying with him. The record, in its close adherence to fact, gives no reason for the king\'s removal, but it may reasonably be surmised that it was connected with a league which was at this time forming for opposing resistance to the power of Assyria. This league, Pekahiah, preferring his father\'s policy of tributary vassalage, may have refused to join. If so, the decision cost him his life. The act of treachery and violence is in accordance with all that Hosea tells us of the internal condition of Israel at this time: "They...devour their judges; all their kings are fallen" (<a onClick="return mV(\'Hsa\',7,7);">Ho 7:7</a>).<P>3. Pekahiah\'s Character:<P>The narrative of Pekahiah\'s short reign contains but a brief notice of his personal character. Like his predecessors, Pekahiah did not depart from the system of worship introduced by Jeroboam, the son of Nebat, "who made Israel to sin." Despite the denunciations of the prophets of the Northern Kingdom (<a onClick="return mV(\'Amo\',5,\'21-27\');">Am 5:21-27</a>; <a onClick="return mV(\'Hsa\',8,\'1-6\');">Ho 8:1-6</a>), the worship of the calves remained, till the whole was swept away, a few years later, by the fall of the kingdom.<P>After Pekahiah\'s murder, the throne was seized by the regicide Pekah.``17';
isbe[6775]='Pekod`pe\'-kod (peqodh): A name applied in <a onClick="return mV(\'Jer\',50,21);">Jer 50:21</a> and <a onClick="return mV(\'Eze\',23,23);">Eze 23:23</a> to the Chaldeans. Various English Versions of the Bible (margins) in the former passage gives the meaning as "visitation."``1';
isbe[6776]='Pelaiah`pe-la\'-ya, pe-li\'-a (pela\'yah):<P>(1) A son of Elioenai, of the royal house of Judah (<a onClick="return mV(\'1Ch\',3,24);">1Ch 3:24</a>).<P>(2) A Levite who assisted Ezra by expounding the Law (<a onClick="return mV(\'Neh\',8,7);">Ne 8:7</a>), and was one of those who sealed the covenant with Nehemiah (<a onClick="return mV(\'Neh\',10,10);">10:10</a>). He is called "Phalias" in 1Esdras 9:48 (Revised Version).``1';
isbe[6777]='Pelaliah`pel-a-li\'-a (pelalyah, "Yahweh judges"): A priest, father of Jeroham, one of the "workers" in the Lord\'s house (<a onClick="return mV(\'Neh\',11,12);">Ne 11:12</a>).``1';
isbe[6778]='Pelatiah`pel-a-ti\'-a (pelatyah, "Yahweh delivers"):<P>(1) One who "sealed" the covenant (<a onClick="return mV(\'Neh\',10,22);">Ne 10:22</a>).<P>(2) A descendant of Solomon, grandson of Zerubbabel (<a onClick="return mV(\'1Ch\',3,21);">1Ch 3:21</a>).<P>(3) A Simeonite, one of the captains who cleared out the Amalekites and dwelt on the captured land (<a onClick="return mV(\'1Ch\',4,42,43);">1Ch 4:42,43</a>).<P>(4) A prince of the people whom Ezekiel (in Babylon) pictures as \'devising mischief\' and giving \'wicked counsel\' in Jerusalem. He is represented as falling dead while Ezekiel prophesies (<a onClick="return mV(\'Eze\',11,1,13);">Eze 11:1,13</a>). His name has the "-u," ending.``1';
isbe[6779]='Peleg`pe\'-leg (pelegh, "watercourse," "division"): A son of Eber, and brother of Joktan. The derivation of the name is given: "for in his days was the earth divided" (niphleghah) (<a onClick="return mV(\'Gen\',10,25);">Ge 10:25</a>; compare <a onClick="return mV(\'Luk\',3,35);">Lu 3:35</a>, the King James Version "Phalec"). This probably refers to the scattering of the world\'s population and the confounding of its language recorded in <a onClick="return mV(\'Gen\',11,\'1-9\');">Ge 11:1-9</a>. In Aramaic pelagh and Arabic phalaj mean "division"; in Hebrew pelegh means "watercourse." The name may really be due to the occupation by this people of some well-watered (furrowed), district (e.g. in Babylonia), for these patronymics represent races, and the derivation in <a onClick="return mV(\'Gen\',10,25);">Ge 10:25</a> is a later editor\'s remark.``78';
isbe[6780]='Pelet`pe\'-let (peleT, "deliverance"):<P>(1) Son of Iahdai (<a onClick="return mV(\'1Ch\',2,47);">1Ch 2:47</a>).<P>(2) Son of Azmaveth, one of those who resorted to David at Ziklag while he was hiding from Saul (<a onClick="return mV(\'1Ch\',12,3);">1Ch 12:3</a>).``1';
isbe[6781]='Peleth`pe\'-leth (peleth, "swiftness"):<P>(1) Father of On, one of the rebels against Moses and Aaron (<a onClick="return mV(\'Num\',16,1);">Nu 16:1</a>); probably same as <a href="./study/isbe/search.html?string=PALLU">PALLU</a> (which see).<P>(2) A descendant of Jerahmeel (<a onClick="return mV(\'1Ch\',2,33);">1Ch 2:33</a>).``1';
isbe[6782]='Pelethites`pel\'-e-thits, pe\'-leth-its (pelethi): A company of David\'s bodyguard, like the <a href="./study/isbe/search.html?string=CHERETHITES">CHERETHITES</a> (which see) (<a onClick="return mV(\'2Sa\',8,18);">2Sa 8:18</a>; <a onClick="return mV(\'2Sa\',15,18);">15:18</a>); probably a corrupt form of "Philistines."``1';
isbe[6783]='Pelias`pe-li\'-as: the King James Version equals the Revised Version (British and American) "Pedias."``1';
isbe[6784]='Pelican`pel\'-kan (qa\'ath; Latin Pelecanus onocrotalus Septuagint reads pelekan, in Leviticus and Psalms, but has 3 other readings, that are rather confusing, in the other places)): Any bird of the genus Pelecanus. The Hebrew qi\' means "to vomit." The name was applied to the bird because it swallowed large quantities of fish and then disgorged them to its nestlings. In the performance of this act it pressed the large beak, in the white species, tipped with red, against the crop and slightly lifted the wings. In ancient times, people, seeing this, believed that the bird was puncturing its breast and feeding its young with its blood. From this idea arose the custom of using a pelican with lifted wings in heraldry or as a symbol of Christ and of charity. (See Fictitious Creatures in Art, 182-86, London, Chapman and Hall, 1906.) Palestine knew a white and a brownish-gray bird, both close to 6 ft. long and having over a 12 ft. sweep of wing. They lived around the Dead Sea, fished beside the Jordan and abounded in greatest numbers in the wildernesses of the Mediterranean shore. The brown pelicans were larger than the white. Each of them had a long beak, peculiar throat pouch and webbed feet. They built large nests, 5 and 6 ft. across, from dead twigs of bushes, and laid two or three eggs. The brown birds deposited a creamy-white egg with a rosy flush; the white, a white egg with bluish tints. The young were naked at first, then covered with down, and remained in the nest until full feathered and able to fly. This compelled the parent birds to feed them for a long time, and they carried such quantities of fish to a nest that the young could not consume all of them and many were dropped on the ground. The tropical sun soon made the location unbearable to mortals. Perching pelicans were the ugliest birds imaginable, but when their immense brown or white bodies swept in a 12 ft. spread across the land and over sea, they made an impressive picture. They are included, with good reason, in the list of abominations (see <a onClick="return mV(\'Lev\',11,18);">Le 11:18</a>; <a onClick="return mV(\'Deu\',14,17);">De 14:17</a>). They are next mentioned in <a onClick="return mV(\'Psa\',102,6);">Ps 102:6</a>:<P class="in15">"I am like a pelican of the wilderness;<br>I am become as an owl of the waste places."<P>Here David from the depths of affliction likened himself to a pelican as it appears when it perches in the wilderness. See <a onClick="return mV(\'Isa\',34,11);">Isa 34:11</a>: "But the pelican and the porcupine shall possess it; and the owl and the raven shall dwell therein: and he will stretch over it the line of confusion, and the plummet of emptiness." Here the bird is used to complete the picture of desolation that was to prevail after the destruction of Edom. The other reference concerns the destruction of Nineveh and is found in <a onClick="return mV(\'Zep\',2,14);">Ze 2:14</a>: "And herds shall lie down in the midst of her, all the beasts of the nations: both the pelican and the porcupine shall lodge in the capitals thereof; their voice shall sing in the windows; desolation shall be in the thresholds: for he hath laid bare the cedar-work."``167';
isbe[6785]='Pelishtim`pel\'-ish-tim, pe-lish\'-tim (pelishtim (the Revised Version margin of <a onClick="return mV(\'Gen\',10,14);">Ge 10:14</a>)).`<a href="./study/isbe/search.html?string=PHILISTINES">PHILISTINES</a>`1';
isbe[6786]='Pelonite`pel\'-o-nit, pe\'-lo-nit, pe-lo\'-nit (peloni, a place-name): Two of David\'s heroes are thus described: (1) "Helez the Pelonite" (<a onClick="return mV(\'1Ch\',11,27);">1Ch 11:27</a>) (see <a href="./study/isbe/search.html?string=PALTITE">PALTITE</a>); and (2) "Ahijah the Pelonite" (<a onClick="return mV(\'1Ch\',11,36);">1Ch 11:36</a>).``1';
isbe[6787]='Pen`(\'et, cheret; kalamos): The first writing was done on clay, wax, lead or stone tablets by scratching into the material with some hard pointed instrument. For this purpose bodkins of bronze, iron, bone or ivory were used (<a onClick="return mV(\'Job\',19,24);">Job 19:24</a>; <a onClick="return mV(\'Isa\',8,1);">Isa 8:1</a>; <a onClick="return mV(\'Jer\',17,1);">Jer 17:1</a>). In <a onClick="return mV(\'Jer\',17,1);">Jer 17:1</a> a diamond is also mentioned as being used for the same purpose. In <a onClick="return mV(\'Jer\',36,\'1-\');">Jer 36</a> Baruch, the son of Neriah, declares that he recorded the words of the prophet with ink in the book. In <a onClick="return mV(\'Jer\',36,23);">Jer 36:23</a> it says that the king cut the roll with the penknife (literally, the scribe\'s knife). This whole scene can best be explained if we consider that Baruch and the king\'s scribes were in the habit of using reed pens. These pens are made from the hollow jointed stalks of a coarse grass growing in marshy places. The dried reed is cut diagonally with the penknife and the point thus formed is carefully shaved thin to make it flexible and the nib split as in the modern pen. The last operation is the clipping off of the very point so that it becomes a stub pen. The Arab scribe does this by resting the nib on his thumb nail while cutting, so that the cut will be clean and the pen will not scratch. The whole procedure requires considerable skill. The pupil in Hebrew or Arabic writing learns to make a pen as his first lesson. A scribe carries a sharp knife around with him for keeping his pen in good condition, hence, the name penknife. The word used in <a onClick="return mV(\'3Jo\',1,13);">3Joh 1:13</a> is kalamos, "reed," indicating that the pen described above was used in John\'s time (compare qalam, the common Arabic name for pen).<P>Figurative: "Written with a pen of iron," i.e. indelibly (<a onClick="return mV(\'Jer\',17,1);">Jer 17:1</a>). "My tongue is the pen of a ready writer" (<a onClick="return mV(\'Psa\',45,1);">Ps 45:1</a>; compare <a onClick="return mV(\'Jer\',36,18);">Jer 36:18</a>). As the trained writer records a speech, so the Psalmist\'s tongue impresses or engraves on his hearers\' minds what he has conceived.`<a href="./study/isbe/search.html?string=INK">INK</a>; <a href="./study/isbe/search.html?string=INK-HORN">INK-HORN</a>; <a href="./study/isbe/search.html?string=WRITING">WRITING</a>`133';
isbe[6788]='Pence; Penny`pens.`<a href="./study/isbe/search.html?string=MONEY">MONEY</a>`1';
isbe[6789]='Pencil`pen\'-sil (<a onClick="return mV(\'Isa\',44,13);">Isa 44:13</a>, margin "red ochre," the King James Version "line").`<a href="./study/isbe/search.html?string=LINE">LINE</a>; <a href="./study/isbe/search.html?string=OCHRE,+RED">OCHRE, RED</a>`1';
isbe[6790]='Pendant`pen\'-dant (from French from Latin pendeo, "to hang"): Not in the King James Version. Twice in the Revised Version (British and American).<P>(1) netiphoth (the King James Version "collars"), ornaments of the Midianites captured by Gideon (<a onClick="return mV(\'Jdg\',8,26);">Jud 8:26</a>).<P>(2) netiphoth (the King James Version "chains"), an article of feminine apparel (<a onClick="return mV(\'Isa\',3,19);">Isa 3:19</a>). The reference seems to be (Cheyne, "Isaiah" Polychrome Bible (HDB, III, 739)) to ear-drops, pearl or gold ornaments resembling a drop of Water, fastened, probably, to the lobe of the ear.``1';
isbe[6791]='Peniel`pe-ni\'-el, pen\'-i-el, pe\'-ni-el (peni\'el, "face of God"; Eidos theou): This is the form of the name in <a onClick="return mV(\'Gen\',32,30);">Ge 32:30</a>. In the next verse and elsewhere it appears as "Penuel." The name is said to have been given to the place by Jacob after his night of wrestling by the Jabbok, because, as he said, "I have seen God face to face, and my life is preserved." It was a height evidently close by the stream over which Jacob passed in the morning. Some have thought it might be a prominent cliff, the contour of which resembled a human face. Such a cliff on the seashore to the south of Tripoli was called theou prosopon, "face of God" (Strabo xvi.2,15f). In later times a city with a strong tower stood upon it. This lay in the line of Gideon\'s pursuit of the Midianites. When he returned victorious, he beat down the place because of the churlishness of the inhabitants (<a onClick="return mV(\'Jdg\',8,8,9,17);">Jud 8:8,9,17</a>). It was one of the towns "built" or fortified by Jeroboam (<a onClick="return mV(\'1Ki\',12,25);">1Ki 12:25</a>). Merrill would identify it with Telul edh-Dhahab, "hills of gold," two hills with ruins that betoken great antiquity, and that speak of great strength, on the south of the Jabbok, about 10 miles east of Jordan (for description see Merrill, East of the Jordan, 390 if). A difficulty that seems fatal to this identification is that here the banks of the Jabbok are so precipitous as to be impassable. Conder suggests Jebel \'Osha. The site was clearly not far from Succoth; but no certainty is yet possible.``54';
isbe[6792]='Peninnah`pe-nin\'-a (peninnah, "coral," "pearl"): Second wife of Elkanah, father of Samuel (<a onClick="return mV(\'1Sa\',1,2,4);">1Sa 1:2,4</a>).``1';
isbe[6793]='Penknife`pen\'-nif (<a onClick="return mV(\'Jer\',36,23);">Jer 36:23</a>).`<a href="./study/isbe/search.html?string=PEN">PEN</a>`1';
isbe[6794]='Penny`pen\'-i (denarion; Latin <a href="./study/isbe/search.html?string=DENARIUS">denarius</a> (which see)): the American Standard Revised Version (<a onClick="return mV(\'Mat\',18,28);">Mt 18:28</a>; <a onClick="return mV(\'Mat\',20,2,9,10,13);">20:2,9,10,13</a>, etc.) renders it by "shilling" except in <a onClick="return mV(\'Mat\',22,19);">Mt 22:19</a>; <a onClick="return mV(\'Mar\',12,15);">Mr 12:15</a> and <a onClick="return mV(\'Luk\',20,24);">Lu 20:24</a>, where it retains the original term as it refers to a particular coin.`<a href="./study/isbe/search.html?string=DENARIUS">DENARIUS</a>; <a href="./study/isbe/search.html?string=MONEY">MONEY</a>`1';
isbe[6795]='Pension`pen\'-shun (1Esdras 4:56, the King James Version "and he commanded to give to all that kept the city pensions and wages"; kleros, "allotted portion," usually (here certainly) of lands (the Revised Version (British and American) "lands")): Literally it means simply "payment," and the King James Version seems to have used the word in order to avoid any specialization of kleros. There is no reference to payment for past services.`<a href="./study/isbe/search.html?string=LOT">LOT</a>`1';
isbe[6796]='Pentateuch, 1`pen\'-ta-tuk:<P><b>I. TITLE, DIVISION, CONTENTS</b><P><b>II. AUTHORSHIP, COMPOSITION, DATE</b><P class="in15">1. The Current Critical Scheme <P class="in15">2. The Evidence for the Current Critical Scheme<P class="in30">(1) Astruc\'s Clue<P class="in30">(2) Signs of Post-Mosaic Date<P class="in30">(3) Narrative Discrepancies<P class="in30">(4) Doublets<P class="in30">(5) The Laws<P class="in30">(6) The Argument from Style<P class="in30">(7) Props of the Development Hypothesis<P class="in15">3. The Answer to the Critical Analysis<P class="in30">(1) The Veto of Textual Criticism<P class="in30">(2) Astruc\'s Clue Tested<P class="in30">(3) The Narrative Discrepancies and Signs of Post-Mosaic Date Examined<P class="in30">(4) The Argument from the Doublets Examined<P class="in30">(5) The Critical Argument from the Laws<P class="in30">(6) The Argument from Style<P class="in30">(7) Perplexities of the Theory<P class="in30">(8) Signs of Unity<P class="in30">(9) The Supposed Props of the Development Hypothesis<P class="in15">4. The Evidence of Date<P class="in30">(1) The Narrative of Genesis<P class="in30">(2) Archaeology and Genesis<P class="in30">(3) The Legal Evidence of Genesis<P class="in30">(4) The Professedly Mosaic Character of the Legislation<P class="in30">(5) The Historical Situation Required by Pentateuch<P class="in30">(6) The Hierarchical Organization in Pentateuch<P class="in30">(7) The Legal Evidence of Pentateuch<P class="in30">(8) The Evidence of D<P class="in30">(9) Later Allusions<P class="in30">(10) Other Evidence<P class="in15">5. The Fundamental Improbabilities of the Critical Case<P class="in30">(1) The Moral and Psychological Issues<P class="in30">(2) The Historical Improbability<P class="in30">(3) The Divergence between the Laws and Post-exilic Practice<P class="in30">(4) The Testimony of Tradition<P class="in15">6. The Origin and Transmission of the Pentateuch<P><b>III. SOME LITERARY POINTS</b><P class="in15">1. Style of Legislation<P class="in15">2. The Narrative<P class="in15">3. The Covenant<P class="in15">4. Order and Rhythm<P><b>IV. THE PENTATEUCH AS HISTORY</b><P class="in15">1. Textual Criticism and History<P class="in15">2. Hebrew Methods of Expression<P class="in15">3. Personification and Genealogies<P class="in15">4. Literary Form<P class="in15">5. The Sacred Numbers<P class="in15">6. Habits of Thought<P class="in15">7. National Coloring<P class="in15">8. How Far the Pentateuch Is Trustworthy<P class="in30">(1) Contemporaneous Information<P class="in30">(2) Character of Our Informants<P class="in30">(3) Historical Genius of the People<P class="in30">(4) Good Faith of Deuteronomy<P class="in30">(5) Nature of the Events Recorded<P class="in30">(6) External Corroborations<P class="in15">9. The Pentateuch as Reasoned History<P><b>V. THE CHARACTER OF THE PENTATEUCH</b><P class="in15">1. Hindu Law Books<P class="in15">2. Differences<P class="in15">3. Holiness<P class="in15">4. The Universal Aspect<P class="in15">5. The National Aspect<P><b>LITERATURE</b><hr /><P>I. Title, Division, Contents<P>(Torah, "law" or "teaching").—It has recently been argued that the Hebrew word is really the Babylonian tertu, "divinely revealed law" (e.g. Sayce, Churchman,1909,728ff), but such passages as <a onClick="return mV(\'Lev\',14,\'54-57\');">Le 14:54-57</a>; <a onClick="return mV(\'Deu\',17,11);">De 17:11</a> show that the legislator connected it with horah (from yarah), "to teach." Also called by the Jews chamishshah chumeshi torah, "the five-fifths of the law": ho nomos, "the Law." The word "Pentateuch" comes from pentateuchos, literally "5-volumed (book)." The Pentateuch consists of the first five books of the Bible, and forms the first division of the Jewish Canon, and the whole of the Samaritan Canon. The 5-fold division is certainly old, since it is earlier than the Septuagint or the Samaritan Pentateuch. How much older it may be is unknown. It has been thought that the 5-fold division of the Psalter is based on it.<P>The five books into which the Pentateuch is divided are respectively Genesis, Exodus, Leviticus, Numbers, and Deuteronomy, and the separate articles should be consulted for information as to their nomenclature.<P>The work opens with an account of the Creation, and passes to the story of the first human couple. The narrative is carried on partly by genealogies and partly by fuller accounts to Abraham. Then comes a history of Abraham, Isaac and Jacob, the collateral lines of descendants being rapidly dismissed. The story of Joseph is told in detail, and Genesis closes with his death. The rest of the Pentateuch covers the oppression of the Israelites in Egypt, their exodus and wanderings, the conquest of the trans-Jordanic lands and the fortunes of the people to the death of Moses. The four concluding books contain masses of legislation mingled with the narrative (for special contents, see articles on the several books).``193';
isbe[6797]='Pentateuch, 2A`II. Authorship, Composition, Date.<P>1. The Current Critical Scheme:<P>The view that Moses was the author of the Pentateuch, with the exception of the concluding verses of Deuteronomy, was once held universally. It is still believed by the great mass of Jews and Christians, but in most universities of Northern Europe and North America other theories prevail. An application of what is called "higher" or "documentary criticism" (to distinguish it from lower or textual criticism) has led to the formation of a number of hypotheses. Some of these are very widely held, but unanimity has not been attained, and recent investigations have challenged even the conclusions that are most generally accepted. In the English-speaking countries the vast majority of the critics would regard Driver\'s, Introduction to the Literature of the Old Testament and Carpenter and Harford-Battersby\'s Hexateuch as fairly representative of their position, but on the Continent of Europe the numerous school that holds some such position is dwindling alike in numbers and influence, while even in Great Britain and America some of the ablest critics are beginning to show signs of being shaken in their allegiance to cardinal points of the higher-critical case. However, at the time of writing, these latter critics have not put forward any fresh formulation of their views, and accordingly the general positions of the works named may be taken as representing with certain qualifications the general critical theory. Some of the chief stadia in the development of this may be mentioned.<P>After attention had been drawn by earlier writers to various signs of post-Mosaic date and extraordinary perplexities in the Pentateuch, the first real step toward what its advocates have, till within the last few years, called "the modern position" was taken by J. Astruc (1753). He propounded what Carpenter terms "the clue to the documents," i.e. the difference of the divine appellations in Genesis as a test of authorship. On this view the word \'Elohim ("God") is characteristic of one principal source and the Tetragrammaton, i.e. the divine name YHWH represented by the "LORD" or "GOD" of the King James Version and the Revised Version (British and American), shows the presence of another. Despite occasional warnings, this clue was followed in the main for 150 years. It forms the starting-point of the whole current critical development, but the most recent investigations have successfully proved that it is unreliable (see below,3,(2)) Astruc was followed by Eichhorn (1780), who made a more thorough examination of Genesis, indicating numerous differences of style, representation, etc.<P>Geddes (1792) and Vater (1802-1805) extended the method applied to Genesis to the other books of the Pentateuch.<P>In 1798 Ilgen distinguished two Elohists in Genesis, but this view did not find followers for some time. The next step of fundamental importance was the assignment of the bulk of Deuteronomy to the 7th century BC. This was due to De Wette (1806). Hupfeld (1853) again distinguished a second Elohist, and this has been accepted by most critics. Thus, there are four main documents at least: D (the bulk of Deuteronomy), two Elohists (P and E) and one document (Jahwist) that uses the Tetragrammaton in Genesis. From 1822 (Bleek) a series of writers maintained that the Book of Joshua was compounded from the same documents as the Pentateuch (see <a href="./study/isbe/search.html?string=HEXATEUCH">HEXATEUCH</a>).<P>Two other developments call for notice:<P>(1) there has been a tendency to subdivide these documents further, regarding them as the work of schools rather than of individuals, and resolving them into different strata (P1, Secondary Priestly Writers, P3, etc., J1, Later additions to J, etc., or in the notation of other writers Jj Je, etc.);<P>(2) a particular scheme of dating has found wide acceptance. In the first period of the critical development it was assumed that the principal Elohist (P) was the earliest document.<P>A succession of writers of whom Reuss, Graf, Kuenen and Wellhausen are the most prominent have, however, maintained that this is not the first but the last in point of time and should be referred to the exile or later. On this view theory is in outline as follows: J and E (so called from their respective divine appellations)—on the relative dates of which opinions differ—were composed probably during the early monarchy and subsequently combined by a redactor (Rje) into a single document JE. In the 7th century D, the bulk of Deuteronomy, was composed. It was published in the 18th year of Josiah\'s reign. Later it was combined with JE into JED by a redactor (Rjed). P or Priestly Code the last of all (originally the first Elohist, now the Priestly Code) incorporated an earlier code of uncertain date which consists in the main of most of <a onClick="return mV(\'Lev\',17,\'1-\');">Le 17:1-26:46</a> and is known as the Law of Holiness (H or Ph). P itself is largely postexilic. Ultimately it was joined with JED by a priestly redactor (Rp) into substantially our present Pentateuch. As already stated, theory is subject to many minor variations. Moreover, it is admitted that not all its portions are equally well supported. The division of JE into J and E is regarded as less certain than the separation of Pentateuch. Again, there are variations in the analysis, differences of opinion as to the exact dating of the documents, and so forth. Yet the view just sketched has been held by a very numerous and influential school during recent years, nor is it altogether fair to lay stress on minor divergences of opinion. It is in the abstract conceivable that the main positions might be true, and that yet the data were inadequate to enable all the minor details to be determined with certainty.<P>See <a href="./study/isbe/search.html?string=CRITICISM+OF+THE+BIBLE">CRITICISM OF THE BIBLE</a>.<P>This theory will hereafter be discussed at length for two reasons:<P>(1) while it is now constantly losing ground, it is still more widely held than any other; and<P>(2) so much of the modern literature on the Old Testament has been written from this standpoint that no intelligent use can be made of the most ordinary books of reference without some acquaintance with it.<P>Before 1908 the conservative opposition to the dominant theory had exhibited two separate tendencies. One school of conservatives rejected the scheme in toto; the other accepted the analysis with certain modifications, but sought to throw back the dating of the documents. In both these respects it had points of contact with dissentient critics (e.g. Delitzsch, Dillmann, Baudissin, Kittel, Strack, Van Hoonacker), who sought to save for conservatism any spars they could from the general wreckage. The former school of thought was most prominently represented by the late W.H. Green, and J.<P>Raven\'s Old Testament Introduction may be regarded as a typical modern presentation of their view; the latter especially by Robertson and Orr. The scheme put forward by the last named has found many adherents. He refuses to regard J and E as two separate documents, holding that we should rather think (as in the case of the parallel Psalms) of two recensions of one document marked by the use of different divine appellations. The critical P he treats as the work of a supplemented, and thinks it never had an independent existence, while he considers the whole Pentateuch as early. He holds that the work was done by "original composers, working with a common aim, and toward a common end, in contrast with the idea of late irresponsible redactors, combining, altering, manipulating, enlarging at pleasure" (POT, 375).<P>While these were the views held among Old Testament critics, a separate opposition had been growing up among archaeologists. This was of course utilized to the utmost by the conservatives of both wings. In some ways archaeology undoubtedly has confirmed the traditional view as against the critical (see <a href="./study/isbe/search.html?string=ARCHAEOLOGY+AND+CRITICISM">ARCHAEOLOGY AND CRITICISM</a>); but a candid survey leads to the belief that it has not yet dealt a mortal blow, and here again it must be remembered that the critics may justly plead that they must not be judged on mistakes that they made in their earlier investigations or on refutations of the more uncertain portions of their theory, but rather on the main completed result. It may indeed be said with confidence that there are certain topics to which archaeology can never supply any conclusive answer. If it be the case that the Pentateuch contains hopelessly contradictory laws, no archaeological discovery can make them anything else; if the numbers of the Israelites are original and impossible, archaeology cannot make them possible. It is fair and right to lay stress on the instances in which archaeology has confirmed the Bible as against the critics; it is neither fair nor right to speak as if archaeology had done what it never purported to do and never could effect.<P>The year 1908 saw the beginning of a new critical development which makes it very difficult to speak positively of modern critical views. Kuenen has been mentioned as one of the ablest and most eminent of those who brought the Graf-Wellhausen theory into prominence. In that year B.D. Eerdmans, his pupil and successor at Leyden, began the publication of a series of Old Testament studies in which he renounces his allegiance to the line of critics that had extended from Astruc to the publications of our own day, and entered on a series of investigations that were intended to set forth a new critical view. As his labors are not yet complete, it is impossible to present any account of his scheme; but the volumes already published justify certain remarks. Eerdmans has perhaps not converted any member of the Wellhausen school, but he has made many realize that their own scheme is not the only one possible. Thus while a few years ago we were constantly assured that the "main results" of Old Testament criticism were unalterably settled, recent writers adopt a very different tone: e.g. Sellin (1910) says, "We stand in a time of fermentation and transition, and in what follows we present our own opinion merely as the hypothesis which appears to us to be the best founded" (Einleitung, 18). By general consent Eerdmans\' work contains a number of isolated shrewd remarks to which criticism will have to attend in the future; but it also contains many observations that are demonstrably unsound (for examples see BS, 1909, 744-48; 1910, 549-51). His own reconstruction is in many respects so faulty and blurred that it does not seem likely that it will ever secure a large following in its present form. On the other hand he appears to have succeeded in inducing a large number of students in various parts of the world to think along new lines and in this way may exercise a very potent influence on the future course of Old Testament study. His arguments show increasingly numerous signs of his having been influenced by the publications of conservative writers, and it seems certain that criticism will ultimately be driven to recognize the essential soundness of the conservative position. In 1912 Dahse (TMH, I) began the publication of a series of volumes attacking the Wellhausen school on textual grounds and propounding a new pericope hypothesis. In his view many phenomena are due to the influence of the pericopes of the synagogue service or the form of the text and not to the causes generally assigned.<P>2. The Evidence for the Current Critical Scheme:<P>The examination of the Graf-Wellhausen theory must now be undertaken, and attention must first be directed to the evidence which is adduced in its support. Why should it be held that the Pentateuch is composed mainly of excerpts from certain documents designated as J and E and P and D? Why is it believed that these documents are of very late date, in one case subsequent to the exile?<P>(1) Astruc\'s Clue.<P>It has been said above that Astruc propounded the use of the divine appellations in Genesis as a clue to the dissection of that book. This is based on <a onClick="return mV(\'Exd\',6,3);">Ex 6:3</a>, \'And I appeared unto Abraham, unto Isaac, and unto Jacob, as \'El Shadday (God Almighty); but by my name YHWH I was not known to them.\' In numerous passages of Genesis this name is represented as known, e.g. <a onClick="return mV(\'Exd\',4,26);">4:26</A>, where we read of men beginning to call on it in the days of Enosh. The discrepancy here is very obvious, and in the view of the Astruc school can be satisfactorily removed by postulating different sources. This clue, of course, fails after <a onClick="return mV(\'Exd\',6,3);">Ex 6:3</a>, but other difficulties are found, and moreover the sources already distinguished in Genesis are, it is claimed, marked by separate styles and other characteristics which enable them to be identified when they occur in the narrative of the later books.<P>See <a href="./study/isbe/search.html?string=CRITICISM+OF+THE+BIBLE">CRITICISM OF THE BIBLE</a>.<P>(2) Signs of Post-Mosaic Date.<P>Close inspection of the Pentateuch shows that it contains a number of passages which, it is alleged, could not have proceeded from the pen of Moses in their present form. Probably the most familiar instance is the account of the death of Moses (<a onClick="return mV(\'Deu\',34,\'1-\');">De 34</a>). Other examples are to be found in seeming allusions to post-Mosaic events, e.g. in <a onClick="return mV(\'Gen\',22,\'1-\');">Ge 22</a> we hear of the Mount of the Lord in the land of Moriah; this apparently refers to the Temple Hill, which, however, would not have been so designated before Solomon. So too the list of kings who reigned over Edom "before there reigned any king over the children of Israel" (<a onClick="return mV(\'Exd\',36,31);">36:31</A>) presumes the existence of the monarchy. The Canaanites who are referred to as being "then in the land" (<a onClick="return mV(\'Gen\',12,6);">Ge 12:6</a>; <a onClick="return mV(\'Gen\',13,7);">13:7</a>) did not disappear till the time of Solomon, and, accordingly, if this expression means "then still" it cannot antedate his reign. <a onClick="return mV(\'Deu\',3,11);">De 3:11</a> (Og\'s bedstead) comes unnaturally from one who had vanquished Og but a few weeks previously, while <a onClick="return mV(\'Num\',21,14);">Nu 21:14</a> (the King James Version) contains a reference to "the book of the Wars of the Lord" which would hardly have been quoted in this way by a contemporary. <a onClick="return mV(\'Exd\',16,35);">Ex 16:35</a> refers to the cessation of the manna after the death of Moses. These passages, and more like them, are cited to disprove Mosaic authorship; but the main weight of the critical argument does not rest on them.<P>(3) Narrative Discrepancies.<P>While the divine appellations form the starting-point, they do not even in Genesis constitute the sole test of different documents. On the contrary, there are other narrative discrepancies, antinomies, differences of style, duplicate narratives, etc., adduced to support the critical theory. We must now glance at some of these.<P>In <a onClick="return mV(\'Gen\',21,14);">Ge 21:14</a>f Ishmael is a boy who can be carried on his mother\'s shoulder, but from a comparison of <a onClick="return mV(\'Gen\',16,3,16);">16:3,16</A>; <a onClick="return mV(\'Exd\',17,\'1-\');">17</A>, it appears that he must have been 14 when Isaac was born, and, since weaning sometimes occurs at the age of 3 in the East, may have been even as old as 17 when this incident happened. Again, "We all remember the scene (<a onClick="return mV(\'Gen\',27,\'1-\');">Ge 27</a>) in which Isaac in extreme old age blesses his sons; we picture him as lying on his deathbed. Do we, however, all realize that according to the chronology of the Book of Genesis he must have been thus lying on his deathbed for eighty years (compare <a onClick="return mV(\'Gen\',25,26);">25:26</a>; <a onClick="return mV(\'Gen\',26,34);">26:34</a>; <a onClick="return mV(\'Gen\',35,28);">35:28</A>)? Yet we can only diminish this period by extending proportionately the interval between Esau marrying his Hittite wives (<a onClick="return mV(\'Gen\',26,34);">26:34</a>) and Rebekah\'s suggestion to Isaac to send Jacob away, lest he should follow his brother\'s example (<a onClick="return mV(\'Gen\',27,46);">27:46</a>); which, from the nature of the case, will not admit of any but slight extension. Keil, however, does so extend it, reducing the period of Isaac\'s final illness by 43 years, and is conscious of no incongruity in supposing that Rebekah, 30 years after Esau had taken his Hittite wives, should express her fear that Jacob, then aged 77, will do the same" (Driver, Contemporary Review, LVII, 221).<P>An important instance occurs in Numbers. According to <a onClick="return mV(\'Gen\',33,38);">33:38</A>, Aaron died on the 1st day of the 5th month. From <a onClick="return mV(\'Deu\',1,3);">De 1:3</a> it appears that 6 months later Moses delivered his speech in the plains of Moab. Into those 6 months are compressed one month\'s mourning for Aaron, the Arad campaign, the wandering round by the Red Sea, the campaigns against Sihon and Og, the missions to Balaam and the whole episode of his prophecies, the painful occurrences of <a onClick="return mV(\'Num\',25,\'1-\');">Nu 25</a>, the second census, the appointment of Joshua, the expedition against Midian, besides other events. It is clearly impossible to fit all these into the time.<P>Other discrepancies are of the most formidable character. Aaron dies now at Mt. Hor (<a onClick="return mV(\'Num\',20,28);">Nu 20:28</a>; <a onClick="return mV(\'Num\',33,38);">33:38</a>), now at Moserah (<a onClick="return mV(\'Deu\',10,6);">De 10:6</a>). According to <a onClick="return mV(\'Deu\',1,\'1-\');">De 1</a>; <a onClick="return mV(\'Deu\',2,1,14);">2:1,14</a>, the children of Israel left Kadesh-barnea in the 3rd year and never subsequently returned to it, while in Numbers they apparently remain there till the journey to Mt. Hor, where Aaron dies in the 40th year. The Tent of Meeting perhaps provides some of the most perplexing of the discrepancies, for while according to the well-known scheme of <a onClick="return mV(\'Exd\',25,\'1-\');">Ex 25</a>ff and many other passages, it was a large and heavy erection standing in the midst of the camp, <a onClick="return mV(\'Exd\',33,\'7-11\');">Ex 33:7-11</a> provides us with another Tent of Meeting that stood outside the camp at a distance and could be carried by Moses alone. The verbs used are frequentative, denoting a regular practice, and it is impossible to suppose that after receiving the commands for the Tent of Meeting Moses could have instituted a quite different tent of the same name. Joseph again is sold, now by Ishmaelites (<a onClick="return mV(\'Gen\',37,27,28);">Ge 37:27,28</a>; <a onClick="return mV(\'Gen\',39,1);">39:1</a>), anon by Midianites (<a onClick="return mV(\'Gen\',31,28,36);">31:28a, 36</A>). Sometimes he is imprisoned in one place, sometimes apparently in another. The story of Korah, Dathan and Abiram in <a onClick="return mV(\'Num\',16,\'1-\');">Nu 16</a> is equally full of difficulty. The enormous numbers of the Israelites given in <a onClick="return mV(\'Num\',1,\'1-\');">Nu 1-4</a>, etc., are in conflict with passages that regard them as very few.<P>(4) Doublets.<P>Another portion of the critical argument is provided by doublets or duplicate narratives of the same event, e.g. <a onClick="return mV(\'Gen\',16,\'1-\');">Ge 16</a> and <a onClick="return mV(\'Gen\',21,\'1-\');">21</A>. These are particularly numerous in Genesis, but are not confined to that book. "Twice do quails appear in connection with the daily manna (<a onClick="return mV(\'Num\',11,\'4-6\',31);">Nu 11:4-6,31</a>ff; <a onClick="return mV(\'Exd\',16,13);">Ex 16:13</a>) Twice does Moses draw water from the rock, when the strife of Israel begets the name Meribah (\'strife\')(<a onClick="return mV(\'Exd\',17,\'1-7\');">Ex 17:1-7</a>; <a onClick="return mV(\'Num\',20,\'1-13\');">Nu 20:1-13</a>)" (Carpenter, Hexateuch, I, 30).<P>(5) The Laws.<P>Most stress is laid on the argument from the laws and their supposed historical setting. By far the most important portions of this are examined in <a href="./study/isbe/search.html?string=SANCTUARY">SANCTUARY</a> and <a href="./study/isbe/search.html?string=PRIESTS+AND+LEVITES">PRIESTS AND LEVITES</a>. These subjects form the two main pillars of the Graf-Wellhausen theory, and accordingly the articles in question must be read as supplementing the present article. An illustration may be taken from the slavery laws. It is claimed that <a onClick="return mV(\'Exd\',21,\'1-6\');">Ex 21:1-6</a>; <a onClick="return mV(\'Deu\',15,12);">De 15:12</a>ff permit a Hebrew to contract for life slavery after 6 years\' service, but that <a onClick="return mV(\'Lev\',25,\'39-42\');">Le 25:39-42</a> takes no notice of this law and enacts the totally different provision that Hebrews may remain in slavery only till the Year of Jubilee. While these different enactments might proceed from the same hand if properly coordinated, it is contended that this is not the case and that the legislator in Leviticus ignores the legislator in Exodus and is in turn ignored by the legislator in Deuteronomy, who only knows the law of Exodus.<P>(6) The Argument from Style.<P>The argument from style is less easy to exemplify shortly, since it depends so largely on an immense mass of details. It is said that each of the sources has certain characteristic phrases which either occur nowhere else or only with very much less frequency. For instance in <a onClick="return mV(\'Gen\',1,\'1-\');">Ge 1</a>, where \'Elohim is used throughout, we find the word "create," but this is not employed in <a onClick="return mV(\'Gen\',2,4);">2:4b</A>ff, where the Tetragrammaton occurs. Hence, it is argued that this word is peculiarly characteristic of P as contrasted with the other documents, and may be used to prove his presence in e.g. <a onClick="return mV(\'Gen\',5,1);">5:1</a>f.<P>(7) Props of the Development Hypothesis.<P>While the main supports of the Graf-Wellhausen theory must be sought in the articles to which reference has been made, it is necessary to mention briefly some other phenomena to which some weight is attached. Jeremiah displays many close resemblances to Deuteronomy, and the framework of Kings is written in a style that has marked similarities to the same book. Ezekiel again has notable points of contact with P and especially with H; either he was acquainted with these portions of the Pentateuch or else he must have exercised considerable influence on those who composed them. Lastly the Chronicler is obviously acquainted with the completed Pentateuch. Accordingly, it is claimed that the literature provides a sort of external standard that confirms the historical stages which the different Pentateuchal sources are said to mark. Deuteronomy influences Jeremiah and the subsequent literature. It is argued that it would equally have influenced the earlier books, had it then existed. So too the completed Pentateuch should have influenced Kings as it did Chronicles, if it had been in existence when the earlier history was composed.``193';
isbe[6798]='Pentateuch, 2B`3. Answer to the Critical Analysis:<P>(1) The Veto of Textual Criticism.<P>The first great objection that may be made to the higher criticism is that it starts from the Massoretic text (MT) without investigation. This is not the only text that has come down to us, and in some instances it can be shown that alternative readings that have been preserved are superior to those of the Massoretic Text. A convincing example occurs in <a onClick="return mV(\'Exd\',18,\'1-\');">Ex 18</a>. According to the Hebrew, Jethro comes to Moses and says "I, thy father-in-law...am come," and subsequently Moses goes out to meet his father-in-law. The critics here postulate different sources, but some of the best authorities have preserved a reading which (allowing for ancient differences of orthography) supposes an alteration of a single letter. According to this reading the text told how one (or they) came to Moses and said "Behold thy father-in-law...is come." As the result of this Moses went out and met Jethro. The vast improvement in the sense is self-evident. But in weighing the change other considerations must be borne in mind. Since this is the reading of some of the most ancient authorities, only two views are possible. Either the Massoretic Text has undergone a corruption of a single letter, or else a redactor made a most improbable cento of two documents which gave a narrative of the most doubtful sense. Fortunately this was followed by textual corruption of so happy a character as to remove the difficulty by the change of a single letter; and this corruption was so widespread that it was accepted as the genuine text by some of our best authorities. There can be little doubt which of these two cases is the more credible, and with the recognition of the textual solution the particular bit of the analysis that depends on this corruption falls to the ground. This instance illustrates one branch of textual criticism; there are others. Sometimes the narrative shows with certainty that in the transmission of the text transpositions have taken place; e.g. the identification of Kadesh shows that it was south of Hormah. Consequently, a march to compass Edom by way of the Red Sea would not bring the Israelites to Hormah. Here there is no reason to doubt that the events narrated are historically true, but there is grave reason to doubt that they happened in the present order of the narrative. Further, Deuteronomy gives an account that is parallel to certain passages of Numbers; and it confirms those passages, but places the events in a different order. Such difficulties may often be solved by simple transpositions, and when transpositions in the text of Numbers are made under the guidance of Deuteronomy they have a very different probability from guesses that enjoy no such sanction. Another department of textual criticism deals with the removal of glosses, i.e. notes that have crept into the text. Here the ancient versions often help us, one or other omitting some words which may be proved from other sources to be a later addition. Thus in <a onClick="return mV(\'Exd\',17,7);">Ex 17:7</a> the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) did not know the expression, "and Meribah" (one word in Hebrew), and calls the place "Massah" simply. This is confirmed by the fact that Deuteronomy habitually calls the place Massah (<a onClick="return mV(\'Deu\',6,16);">6:16</A>; <a onClick="return mV(\'Deu\',9,22);">9:22</A>; <a onClick="return mV(\'Deu\',33,8);">33:8</A>). The true Meribah was Kadesh (<a onClick="return mV(\'Num\',20,\'1-\');">Nu 20</a>) and a glossator has here added this by mistake (see further (4) below). Thus we can say that a scientific textual criticism often opposes a real veto to the higher critical analysis by showing that the arguments rest on late corruptions and by explaining the true origin of the difficulties on which the critics rely.<P>(2) Astruc\'s Clue Tested.<P>Astruc\'s clue must next be examined. The critical case breaks down with extraordinary frequency. No clean division can be effected, i.e. there are cases where the Massoretic Text of Genesis makes P or E use the Tetragrammaton (YHWH) or J Yahweh (Yahweh). In some of these cases the critics can suggest no reason; in others they are compelled to assume that the Massoretic Text is corrupt for no better reason than that it is in conflict with their theory. Again the exigencies of the theory frequently force the analyst to sunder verses or phrases that cannot be understood apart from their present contexts, e.g. in <a onClick="return mV(\'Gen\',28,21);">Ge 28:21</a> Carpenter assigns the words "and Yahweh will be my God" to J while giving the beginning and end of the verse to E; in <a onClick="return mV(\'Gen\',31,3);">Genesis 31, verse 3</a> goes to a redactor, though E actually refers to the statement of <a onClick="return mV(\'Gen\',31,3);">31:3</A> in verse <a onClick="return mV(\'Gen\',31,5);">5</A>; in <a onClick="return mV(\'Gen\',32,30);">Genesis 32, verse 30</a> is torn from a J-context and given to E, thus leaving <a onClick="return mV(\'Gen\',32,31);">32:31</A> (Jahwist) unintelligible. When textual criticism is applied, startling facts that entirely shatter the higher critical argument are suddenly revealed. The variants to the divine appellations in Genesis are very numerous, and in some instances the new readings are clearly superior to the Massoretic Text, even when they substitute \'Elohim for the Tetragrammaton. Thus, in <a onClick="return mV(\'Gen\',16,11);">16:11</A>, the explanation of the name Ishmael requires the word \'Elohim, as the name would otherwise have been Ishmayah, and one Hebrew MS, a recension of the Septuagint and the Old Latin do in fact preserve the reading \'Elohim. The full facts and arguments cannot be given here, but Professor Schlogl has made an exhaustive examination of the various texts from <a onClick="return mV(\'Gen\',1,1);">Ge 1:1</a> to <a onClick="return mV(\'Exd\',3,12);">Ex 3:12</a>. Out of a total of 347 occurrences of one or both words in the Massoretic Text of that passage, there are variants in 196 instances. A very important and detailed discussion, too long to be summarized here will now be found in TMH, I. Wellhausen himself has admitted that the textual evidence constitutes a sore point of the documentary theory (Expository Times, XX, 563). Again in <a onClick="return mV(\'Exd\',6,3);">Ex 6:3</a>, many of the best authorities read "I was not made known" instead of "I was not known" a difference of a single letter in Hebrew. But if this be right, there is comparative evidence to suggest that to the early mind a revelation of his name by a deity meant a great deal more than a mere knowledge of the name, and involved rather a pledge of his power. Lastly the analysis may be tested in yet another way by inquiring whether it fits in with the other data, and when it is discovered (see below 4, (1)) that it involves ascribing, e.g. a passage that cannot be later than the time of Abraham to the period of the kingdom, it becomes certain that the clue and the method are alike misleading (see further EPC, chapter i; Expository Times, XX, 378f; 473-75, 563; TMH, I; PS, 49-142; BS, 1913, 145-74; A. Troelstra, The Name of God, NKZ, XXIV (1913), 119-48; The Expositor, 1913).<P>(3) The Narrative Discrepancies and Signs of Post-Mosaic Date Examined.<P>Septuagintal manuscripts are providing very illuminating material for dealing with the chronological difficulties. It is well known that the Septuagint became corrupt and passed through various recensions (see <a href="./study/isbe/search.html?string=SEPTUAGINT">SEPTUAGINT</a>). The original text has not yet been reconstructed, but as the result of the great variety of recensions it happens that our various manuscripts present a wealth of alternative readings. Some of these show an intrinsic superiority to the corresponding readings of the Massoretic Text. Take the case of Ishmael\'s age. We have seen (above,2,(3)) that although in <a onClick="return mV(\'Gen\',21,14);">Ge 21:14</a>f he is a boy who can be carried by his mother even after the weaning of Isaac, his father, according to <a onClick="return mV(\'Gen\',16,3,16);">16:3,16</A>, was 86 years old at the time of his birth, and, according to <a onClick="return mV(\'Gen\',17,\'1-\');">Genesis 17</a>, 100 years old when Isaac was born. In <a onClick="return mV(\'Gen\',17,25);">17:25</A> we find that Ishmael is already 13 a year before Isaac\'s birth. Now we are familiar with marginal notes that set forth a system of chronology in many printed English Bibles. In this case the Septuagintal variants suggest that something similar is responsible for the difficulty of our Hebrew. Two manuscripts, apparently representing a recension, omit the words, "after Abram had dwelt ten years in the land of Canaan" in <a onClick="return mV(\'Gen\',16,3);">16:3</A>, and again, <a onClick="return mV(\'Gen\',16,16);">16:16</A>, while in <a onClick="return mV(\'Gen\',17,25);">17:25</A> there is a variant making Ishmael only 3 years old. If these readings are correct it is easy to see how the difficulty arose. The narrative originally contained mere round numbers, like 100 years old, and these were not intended to be taken literally. A commentator constructed a scheme of chronology which was embodied in marginal notes. Then these crept into the text and such numbers as were in conflict with them were thought to be corrupt and underwent alteration. Thus the 3-year-old Ishmael became 13.<P>The same manuscripts that present us with the variants in <a onClick="return mV(\'Gen\',16,\'1-\');">Ge 16</a> have also preserved a suggestive reading in <a onClick="return mV(\'Gen\',35,28);">35:28</A>, one of the passages that are responsible for the inference that according to the text of Genesis Isaac lay on his deathbed for 80 years (see above,2,(3)). According to this Isaac was not 180, but 150 years old when he died. It is easy to see that this is a round number, not to be taken literally, but this is not the only source of the difficulty. In <a onClick="return mV(\'Gen\',27,41);">27:41</A>, Esau, according to English Versions of the Bible, states "The days of mourning for my father are at hand; then will I slay my brother Jacob." This is a perfectly possible rendering of the Hebrew, but the Septuagint translated the text differently, and its rendering, while grammatically correct, has the double advantage of avoiding Isaac\'s long lingering on a deathbed and of presenting Esau\'s hatred and ferocity far more vividly. It renders, "May the days of mourning for my father approach that I may slay my brother Jacob." Subsequent translators preferred the milder version, but doubtless the Septuagint has truly apprehended the real sense of the narrative. If we read the chapter with this modification, we see Isaac as an old man, not knowing when he may die, performing the equivalent of making his will. It puts no strain on our credulity to suppose that he may have lived 20 or 30 years longer. Such episodes occur constantly in everyday experience. As to the calculations based on <a onClick="return mV(\'Gen\',25,26);">Ge 25:26</a> and <a onClick="return mV(\'Gen\',36,34);">26:34</A>, the numbers used are 60 and 40, which, as is well known, were frequently employed by the ancient Hebrews, not as mathematical expressions, but simply to denote unknown or unspecified periods.<P>See <a href="./study/isbe/search.html?string=NUMBER">NUMBER</a>.<P>The other chronological difficulty cited above (namely, that there is not room between the date of Aaron\'s death and the address by Moses in the plains of Moab for all the events assigned to this period by Numbers) is met partly by a reading preserved by the Peshitta and partly by a series of transpositions. In <a onClick="return mV(\'Num\',33,38);">Nu 33:38</a> Peshitta reads "first" for "fifth" as the month of Aaron\'s death, thus recognizing a longer period for the subsequent events. The transpositions, however, which are largely due to the evidence of Deuteronomy, solve the most formidable and varied difficulties; e.g. a southerly march from Kadesh no longer conducts the Israelites to Arad in the north, the name Hormah is no longer used (<a onClick="return mV(\'Num\',14,45);">Nu 14:45</a>) before it is explained (<a onClick="return mV(\'Num\',21,3);">Nu 21:3</a>), there is no longer an account directly contradicting Deuteronomy and making the Israelites spend 38 years at Kadesh immediately after receiving a divine command to turn "tomorrow" (<a onClick="return mV(\'Num\',14,25);">Nu 14:25</a>). A full discussion is impossible here and will be found in EPC, 114-38. The order of the narrative that emerges as probably original is as follows: <a onClick="return mV(\'Num\',12,\'1-\');">Nu 12</a>; <a onClick="return mV(\'Num\',20,1,\'14-21\');">20:1,14-21</a>; <a onClick="return mV(\'Num\',21,\'1-3\');">21:1-3</a>; <a onClick="return mV(\'Num\',13,\'1-\');">13</a>; <a onClick="return mV(\'Num\',14,\'1-\');">14</a>; <a onClick="return mV(\'Num\',16,\'1-\');">16-18</a>; <a onClick="return mV(\'Num\',20,\'2-13\',22);">20:2-13,22</a>; <a onClick="return mV(\'Num\',21,\'4-9\');">21:4b-9</a>, then some missing vs, bringing the Israelites to the head of the Gulf of Akabah and narrating the turn northward from Elath and Ezion-geber, then <a onClick="return mV(\'Num\',20,\'22-29\');">20:22b-29</A>; <a onClick="return mV(\'Num\',21,4);">21:4a</A>, and some lost words telling of the arrival at the station before Oboth. In <a onClick="return mV(\'Num\',33,40);">Nu 33:40</a> is a gloss that is missing in Lagarde\'s Septuagint, and <a onClick="return mV(\'Num\',33,36,37);">33:36b-37a</A> should probably come earlier in the chapter than they do at present.<P>Another example of transposition is afforded by <a onClick="return mV(\'Exd\',33,\'7-11\');">Ex 33:7-11</a>, the passage relating to the Tent of Meeting which is at present out of place (see above 2, (3)). It is supposed that this is E\'s idea of the Tabernacle, but that, unlike the Priestly Code (P), he places it outside the camp and makes Joshua its priest. This latter view is discussed and refuted in <a href="./study/isbe/search.html?string=PRIESTS+AND+LEVITES">PRIESTS AND LEVITES, sec. 3</a>, where it is shown that <a onClick="return mV(\'Exd\',33,7);">Ex 33:7</a> should be rendered "And Moses used to take a (or, the) tent and pitch it for himself," etc. As to theory that this is E\'s account of the Tabernacle, <a onClick="return mV(\'Exd\',18,\'1-\');">Ex 18</a> has been overlooked. This chapter belongs to the same E but refers to the end of the period spent at Horeb, i.e. it is later than <a onClick="return mV(\'Exd\',33,\'7-11\');">33:7-11</A>. In <a onClick="return mV(\'Exd\',18,\'13-16\');">18:13-16</A> we find Moses sitting with all the people standing about him because they came to require of God; i.e. the business which according to <a onClick="return mV(\'Exd\',33,\'1-\');">Ex 33</a> was transacted in solitude outside the camp was performed within the camp in the midst of the people at a later period. This agrees with the Priestly Code (P), e.g. <a onClick="return mV(\'Num\',27,\'1-\');">Nu 27</a>. If now we look at the other available clues, it appears that <a onClick="return mV(\'Exd\',33,11);">Ex 33:11</a> seems to introduce Joshua for the first time. The passage should therefore precede <a onClick="return mV(\'Exd\',17,\'8-15\');">17:8-15</A>; <a onClick="return mV(\'Exd\',24,13);">24:13</a>; <a onClick="return mV(\'Exd\',32,17);">32:17</A>, where he is already known. Again, if <a onClick="return mV(\'Exd\',18,\'1-\');">Ex 18</a> refers to the closing scenes at Horeb (as it clearly does), <a onClick="return mV(\'Exd\',24,14);">Ex 24:14</a> providing for the temporary transaction of judicial business reads very strangely. It ought to be preceded by some statement of the ordinary course in normal times when Moses was not absent from the camp. <a onClick="return mV(\'Exd\',33,7);">Ex 33:7</a>ff provides such a statement. The only earlier place to which it can be assigned is after <a onClick="return mV(\'Exd\',13,22);">13:22</A>, but there it fits the context marvelously, for the statements as to the pillar of cloud in <a onClick="return mV(\'Exd\',33,9);">33:9</A>f attach naturally to those in <a onClick="return mV(\'Exd\',13,21);">13:21</A>f. With this change all the difficulties disappear. Immediately after leaving Egypt Moses began the practice of carrying a tent outside the camp and trying cases there. This lasted till the construction of the Tabernacle. "And there I will meet with thee, and I will commune with thee" (<a onClick="return mV(\'Exd\',25,22);">Ex 25:22</a>). After its erection the earlier tent was disused, and the court sat at the door of the Tabernacle in the center of the camp (see, further, EPC, 93-102, 106f) .<P>Some other points must be indicated more briefly. In <a onClick="return mV(\'Num\',16,\'1-\');">Nu 16</a> important Septuagintal variants remove the main difficulties by substituting "company of Korah" for "dwelling of Korah, Dathan, and Abiram" in two verses (see EPC, 143-46). Similarly in the Joseph-story the perplexities have arisen through corruptions of verses which may still be corrected by the versional evidence (PS, 29-48). There is evidence to show that the numbers of the Israelites are probably due to textual corruption (EPC, 155-69). Further, there are numerous passages where careful examination has led critics themselves to hold that particular verses are later notes. In this way they dispose of <a onClick="return mV(\'Deu\',10,6);">De 10:6</a>f (Aaron\'s death, etc.), the references to the Israelirish kingdom (<a onClick="return mV(\'Gen\',36,31);">Ge 36:31</a>) and the Canaanites as being "then" in the land (<a onClick="return mV(\'Gen\',12,6);">Ge 12:6</a>; <a onClick="return mV(\'Gen\',13,7);">13:7</a>), the bedstead of Og (<a onClick="return mV(\'Deu\',3,11);">De 3:11</a>) and other passages. In <a onClick="return mV(\'Gen\',22,\'1-\');">Ge 22</a>, "the land of Moriah" is unknown to the versions which present the most diverse readings, of which "the land of the Amorite" is perhaps the most probable; while in <a onClick="return mV(\'Exd\',22,14);">22:14</a> the Septuagint, reading the same Hebrew consonants as Massoretic Text, translates "In the Mount the Lord was seen." This probably refers to a view that God manifested Himself especially in the mountains (compare <a onClick="return mV(\'1Ki\',20,23,28);">1Ki 20:23,28</a>) and has no reference whatever to the Temple Hill. The Massoretic pointing is presumably due to a desire to avoid what seemed to be an anthropomorphism (see further PS, 19-21). Again, in <a onClick="return mV(\'Num\',21,14);">Nu 21:14</a>, the Septuagint knows nothing of "a book of the Wars of Yahweh" (see Field, Hexapla, at the place). It is difficult to tell what the original reading was, especially as the succeeding words are corrupt in the Hebrew, but it appears that no genitive followed wars" and it is doubtful if there was any reference to a "book of wars."<P>(4) The Argument from the Doublets Examined.<P>The foregoing sections show that the documentary theory often depends on phenomena that were absent from the original Pentateuch. We are now to examine arguments that rest on other foundations. The doublets have been cited, but when we examine the instances more carefully, some curious facts emerge. <a onClick="return mV(\'Gen\',16,\'1-\');">Ge 16</a> and <a onClick="return mV(\'Gen\',21,\'1-\');">21</A> are, to all appearance, narratives of different events; so are <a onClick="return mV(\'Exd\',17,\'1-7\');">Ex 17:1-7</a> and <a onClick="return mV(\'Num\',20,\'1-13\');">Nu 20:1-13</a> (the drawing of water from rocks). In the latter case the critics after rejecting this divide the passages into 5 different stories, two going to J, two to E and one to Pentateuch. If the latter also had a Rephidimnarrative (compare <a onClick="return mV(\'Num\',33,14);">Nu 33:14</a> P), there were 6 tales. In any case both J and E tell two stories each. It is impossible to assign any cogency to the argument that the author of the Pentateuch could not have told two such narratives, if not merely the redactor of the Pentateuch but also J and E could do so. The facts as to the manna stories are similar. As to the flights of quails, it is known that these do in fact occur every year, and the Pentateuch places them at almost exactly a year\'s interval (see EPC, 104f; 109f).<P>(5) The Critical Argument from the Laws.<P>The legal arguments are due to a variety of misconceptions, the washing out of the historical background and the state of the text. Reference must be made to the separate articles (especially <a href="./study/isbe/search.html?string=SANCTUARY">SANCTUARY</a>; <a href="./study/isbe/search.html?string=PRIESTS+AND+LEVITES">PRIESTS AND LEVITES</a>). As the slave laws were cited, it may be explained that in ancient Israel as in other communities slavery could arise or slaves be acquired in many ways: e.g. birth, purchase (<a onClick="return mV(\'Gen\',14,14);">Ge 14:14</a>; <a onClick="return mV(\'Gen\',17,12);">17:12</a>, etc.), gift (<a onClick="return mV(\'Gen\',20,14);">Ge 20:14</a>), capture in war (<a onClick="return mV(\'Gen\',14,21);">Ge 14:21</a>; <a onClick="return mV(\'Gen\',34,29);">34:29</a>), kidnapping (Joseph). The law of Exodus and Deuteronomy applies only to Hebrew slaves acquired by purchase, not to slaves acquired in any other way, and least of all to those who in the eye of the law were not true slaves. <a onClick="return mV(\'Lev\',25,\'1-\');">Le 25</a> has nothing to do with Hebrew slaves. It is concerned merely with free Israelites who become insolvent. "If thy brother be waxed poor with thee, and sell himself" it begins (<a onClick="return mV(\'Lev\',25,39);">25:39</A>). Nobody who was already a slave could wax poor and sell himself. The law then provides that these insolvent freemen were not to be treated as slaves. In fact, they were a class of free bondsmen, i.e. they were full citizens who were compelled to perform certain duties. A similar class of free bondsmen existed in ancient Rome and were called nexi. The Egyptians who sold themselves to Pharaoh and became serfs afford another though less apt parallel In all ancient societies insolvency led to some limitations of freedom, but while in some full slavery ensued, in others a sharp distinction was drawn between the slave and the insolvent freeman (see further SBL, 5-11).<P>(6) The Argument from Style.<P>Just as this argument is too detailed to be set out in a work like the present, so the answer cannot be given with any degree of fullness. It may be said generally that the argument too frequently neglects differences of subject-matter and other sufficient reasons (such as considerations of euphony and slight variations of meaning) which often provide far more natural reasons for the phenomena observed. Again, the versions suggest that the Biblical text has been heavily glossed. Thus in many passages where the frequent recurrence of certain words and phrases is supposed to attest the presence of the Priestly Code (P), versional evidence seems to show that the expressions in question have been introduced by glossators, and when they are removed the narrative remains unaffected in meaning, but terser and more vigorous and greatly improved as a vehicle of expression. To take a simple instance in <a onClick="return mV(\'Gen\',23,1);">Ge 23:1</a>, "And the life of Sarah was a hundred and seven and twenty years:...the years of the fife of Sarah," the italicized words were missing in the Septuagint. When they are removed the meaning is unaltered, but the form of expression is far superior. They are obviously mere marginal note. Again the critical method is perpetually breaking down. It constantly occurs that redactors have to be called in to remove from a passage attributed to some source expressions that are supposed to be characteristic of another source, and this is habitually done on no other ground than that theory requires it. One instance muse be given. It is claimed that the word "create" is a P-word. It occurs several times in <a onClick="return mV(\'Gen\',1,\'1-\');">Ge 1:1</a>-<a onClick="return mV(\'Gen\',2,\'1-4\');">2:4a</a> and 3 times in <a onClick="return mV(\'Gen\',5,1,2);">Ge 5:1,2</a>, but in <a onClick="return mV(\'Gen\',6,7);">6:7</a> it is found in a J-passage, and some critics therefore assign it to a redactor. Yet J undoubtedly uses the word in <a onClick="return mV(\'Num\',16,30);">Nu 16:30</a> and D in <a onClick="return mV(\'Deu\',4,32);">De 4:32</a>. On the other hand, P does not use the word exclusively, even in <a onClick="return mV(\'Gen\',1,\'1-\');">Ge 1</A>-<a onClick="return mV(\'Gen\',2,\'1-4\');">2:4</a>, the word "make" being employed in <a onClick="return mV(\'Gen\',2,7,25,26,31);">1:7,25,26,31</A>; <a onClick="return mV(\'Gen\',2,2);">2:2</a>, while in <a onClick="return mV(\'Gen\',2,3);">2:3</A> both words are combined. Yet all these passages are given unhesitatingly to P.<P>(7) Perplexities of the Theory.<P>The perplexities of the critical hypothesis are very striking, but a detailed discussion is impossible here. Much material will, however, be found in POT and Eerd. A few general statements may be made. The critical analysis repeatedly divides a straightforward narrative into two sets of fragments, neither of which will make sense without the other. A man will go to sleep in one document and wake in another, or a subject will belong to one source and the predicate to another. No intelligible account can be given of the proceedings of the redactors who one moment slavishly preserve their sources and at another cut them about without any necessity, who now rewrite their material and now leave it untouched. Even in the ranks of the Wellhausen critics chapters will be assigned by one writer to the post-exilic period and by another to the earliest sources (e.g. <a onClick="return mV(\'Gen\',14,\'1-\');">Ge 14</a>, pre-Mosaic in the main according to Sellin (1910), post-exilic according to others), and the advent of Eerdmans and Dahse has greatly increased the perplexity. Clue after clue, both stylistic and material, is put forward, to be abandoned silently at some later stage. Circular arguments are extremely common: it is first alleged that some phenomenon is characteristic of a particular source; then passages are referred to that source for no other reason than the presence of that phenomenon; lastly these passages are cited to prove that the phenomenon in question distinguishes the source. Again theory is compelled to feed on itself; for J, E, the Priestly Code (P), etc., we have schools of J\'s, E\'s, etc., subsisting side by side for centuries, using the same material, employing the same ideas, yet remaining separate in minute stylistic points. This becomes impossible when viewed in the light of the evidences of pre-Mosaic date in parts of Genesis (see below 4, (1) to (3)).<P>(8) Signs of Unity.<P>It is often possible to produce very convincing internal evidence of the unity of what the critics sunder. A strong instance of this is to be found when one considers the characters portrayed. The character of Abraham or Laban, Jacob or Moses is essentially unitary. There is but one Abraham, and this would not be so if we really had a cento of different documents representing the results of the labor of various schools during different centuries. Again, there are sometimes literary marks of unity, e.g. in <a onClick="return mV(\'Num\',16,\'1-\');">Nu 16</a>, the effect of rising anger is given to the dialogue by the repetition of "Ye take too much upon you" (<a onClick="return mV(\'Gen\',16,3,7);">16:3,7</a>), followed by the repetition of "Is it a small thing that" (<a onClick="return mV(\'Gen\',16,9,13);">16:9,13</A>). This must be the work of a single literary artist (see further SBL, 37f).<P>(9) The Supposed Props of the Development Hypothesis.<P>When we turn to the supposed props of the development hypothesis we see that there is nothing conclusive in the critical argument. Jeremiah and the subsequent literature certainly exhibit the influence of Deuteronomy, but a Book of the Law was admittedly found in Josiah\'s reign and had lain unread for at any rate some considerable time. Some of its requirements had been in actual operation, e.g. in Naboth\'s case, while others had become a dead letter. The circumstances of its discovery, the belief in its undoubted Mosaic authenticity and the subsequent course of history led to its greatly influencing contemporary and later writers, but that really proves nothing. Ezekiel again was steeped in priestly ideas, but it is shown in <a href="./study/isbe/search.html?string=PRIESTS+AND+LEVITES">PRIESTS AND LEVITES, sec. 5b</a>, how this may be explained. Lastly, Chronicles certainly knows the whole Pentateuch, but as certainly misinterprets it (see <a href="./study/isbe/search.html?string=PRIESTS+AND+LEVITES">PRIESTS AND LEVITES</a>). On the other hand the Pentateuch itself always represents portions of the legislation as being intended to reach the people only through the priestly teaching, and this fully accounts for P\'s lack of influence on the earlier literature. As to the differences of style within the Pentateuch itself, something is said in III, below. Hence, this branch of the critical argument really proves nothing, for the phenomena are susceptible of more than one explanation.<P>4. The Evidence of Date:<P>(1) The Narrative of Genesis.<P>Entirely different lines of argument are provided by the abundant internal evidences of date. In <a onClick="return mV(\'Gen\',10,19);">Ge 10:19</a>, we read the phrase "as thou goest toward Sodom and Gomorrah, and Admah and Zeboiim" in a definition of boundary. Such language could only have originated when the places named actually existed. One does not define boundaries by reference to towns that are purely mythical or have been overthrown many centuries previously. The consistent tradition is that these towns were destroyed in the lifetime of Abraham, and the passage therefore cannot be later than his age. But the critics assign it to a late stratum of J, i.e. to a period at least 1,000 years too late. This suggests several comments. First, it may reasonably be asked whether much reliance can be placed on a method which after a century and a half of the closest investigation does not permit its exponents to arrive at results that are correct to within 1,000 years. Secondly, it shows clearly that in the composition of the Pentateuch very old materials were incorporated in their original language. Of the historical importance of this fact more will be said in IV; in this connection we must observe that it throws fresh light on expressions that point to the presence, in Genesis of sources composed in Palestine, e.g. "the sea" for "the west" indicates the probability of a Palestinian source, but once it is proved that we have materials as old as the time of Abraham such expressions do not argue post-Mosaic, but rather pre-Mosaic authorship. Thirdly, the passage demolishes theory of schools of J\'s, etc. It cannot seriously be maintained that there was a school of J\'s writing a particular style marked by the most delicate and subjective criteria subsisting continuously for some 10 or 12 centuries from the time of Abraham onward, side by side with other writers with whom its members never exchanged terms of even such common occurrence as "handmaid."<P><a onClick="return mV(\'Gen\',10,19);">Ge 10:19</a> is not the only passage of this kind. In <a onClick="return mV(\'Gen\',2,4);">2:14</A> we read of the Hiddekel (Tigris) as flowing east of Assur, though there is an alternative reading "in front of." If the translation "east" be correct, the passage must antedat
