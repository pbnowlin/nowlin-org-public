ineness of Paul\'s Epistles, 1897; Zahn, Introduction to the New Testament, 1909.<P>(3) Commentaries:<P>For exegetical commentaries on special epistles see special articles For the ancients see Chrysostom for the Greeks, and Pelagius for the Latins. For the Middle Ages see Thomas Aquinas. For the later time see Beza, Calvin, Colet, Estius, Grotius, Cornelius a Lapide, Wettstein, Bengel. Among the moderns note Alford, Beet (Romans-Colossians), Boise, Bible for Home and School, Cambridge Bible for Schools, Cambridge Greek Testament, New Century Bible; Drummond, Epistles of Paul, Ellicott (all but Romans and 2 Corinthians), Expositor\'s Bible, Expositor\'s Greek Testament; Holtzmann, Hand-Comm. zum New Testament; Jewett (1 and 2 Thessalonians, Romans, Galatians), Lightfoot (Galatians, Philippians, Colossians, Philemon and Notes), Lietzmann, Handbuch zum New Testament; Meyer (translation, revised German editions), Zahn, Kommentar zum New Testament.<P>(4) Lives and Monographs:<P>Albrecht, Paulus der Apestel Jesu Christi, 1903; Bacon, The Story of Paul, 1904; Bartlet, article in Encyclopedia Britannica, 11th edition; Baring-Gould, A Study of Paul, 1897; Baur, The Apostle Paul(2), 1845; Bevan, Paul in the Light of Today, 1912; Bird, Paul of Tarsus, 1900; Campbell, Paul the Mystic, 1907; Chrysostom, Homiliae in Laude S. Pauli, Opera, volume II, edition Montf. (more critically in Field\'s edition); Clemen, Paulus, 1904; Cone, Paul the Man, the Missionary, 1898; Cohu, Paul in the Light of Recent Research, 1910; Conybeare and Howson, Life and Epistles of Paul (many editions); Deissmann, Paul, 1912; Drescher, Das Leben Jesu bei Paulus, 1900; Drury, The Prison Ministry of Paul, 1910; Eadie, Paul the Preacher, 1859; Farrar, Life and Work of Paul (various editions); Erbes, Die Todestage der Apostel Paulus und Petrus, 1899; Fletcher, A Study of the Conversion of Paul, 1911; Forbes, Footsteps of Paul in Rome, 1899; Fouard, Paul and His Mission,1894,Last Years of Paul, 1897; Gardner, Religious Experience of Paul, 1911; Garvie, Life and Teaching of Paul,1909,Studies of Paul and His Gospel, 1911; Gilbert, Student\'s Life of Paul, 1899; Heim, Paulus, 1905; Honnicke, Chronologie des Lebens Pauli, 1904; Iverach, Paul, His Life and Time, 1890; Johnston, The Mission of Paul to the Roman Empire, 1909; M. Jones, Paul the Orator, 1910; Kennedy, Paul and the Mystery-Religions, 1913; Kohler, Zum Verstandnis d. Apostels Paulus, 1908; Lewin, Life and Epistles of Paul, 1875; Lock, Paul the Master Builder, 1905; Lyttleton, Observations on Saul\'s Conversion, 1774; Myers, Saint Paul (various editions); Matheson, Spiritual Development of Paul, 1891; Means, Paul and the Ante-Nicene Church, 1903; Noesgen, Paulus der Apostel der Heiden, 1908; Paley, Horae Paulinae, 1790; Ramsay, Paul the Traveler,1896,Pauline and Other Studies,1906,Cities of Paul,1908,Luke the Physician and Other Studies,1908,Pictures of the Apostolic Church, 1910; Renan, Paul, 1869; A. T. Robertson, Epochs in the Life of Paul,1909,The Glory of the Ministry or Paul\'s Exultation in Preaching, 1911; Sabatier, The Apostle Paul, 1896; Selden, In the Time of Paul, 1900; Schweitzer, Paul and His Interpreters, 1912; Smith, Voyage and Shipwreck of Paul4, 1880; Speer, The Man Paul, 1900; Stalker, Life of Paul, 1889; Taylor, Paul the Missionary, 1882; Underhill, Divine Legation of Paul, 1889; Weinel, Paul (translation, 1906); Whyte, The Apostle Paul, 1903; Wilkinson, Epic of Saul,1891,Epic of Paul, 1897; Wrede, Paulus(2), 1907 (translation); Wright, Cities of Paul, 1907; Wynne, Fragmentary Records of Jesus of Nazareth by a Contemporary, 1887.<P>(5) Teaching:<P>A.B.D. Alexander, The Ethics of Paul, 1910; S.A. Alexander, Christianity of Paul, 1899; Anonymous, The Fifth Gospel, 1906; R. Allen, Christelegy of Paul, 1912; M. Arnold, Paul and Protestantism, 1897; Ball, Paul and the Roman Law, 1901; Breitenstein, Jesus et Paul, 1908; Bruce, Paul\'s Conception of Christianity, 1898; Bruckner, Die Entstehung der Paulinischen Christologie, 1903; Bultmann, Der Stil der Paulin. Predigt und die kyn. Diatribe, 1910; Chadwick, Social Teaching of Paul,1907,Pastoral Teaching of Paul, 1907; M. Dibelius, Die Geisterwelt im Glauben des Paulus, 1909; Dickie, Culture of the Spiritual Life, 1905; Dickson, Paul\'s Use of the Terms Flesh and Spirit, 1883; Du Bose, Gospel according to Paul, 1907; Dykes, Gospel according to Paul, 1888; Everett, Gospel of Paul, 1893; Feine, Paul as Theologian (translation, 1908); Greenough, Mind of Christ in Paul; Goguel, L\'Apotre Paul et Jesus Christ, 1904; Harford, The Gospel according to Paul, 1912; Hicks, "St. Paul and Hellenism," Stud. Bibl., IV; Holsten, Das Evangelium des Paulus, 1898; Julicher, Paulus und Jesus, 1907; Kaftan, Jesus und Paulus, 1906; Kennedy, Paul\'s Conceptions of Last Things, 1904; Knowling, Testimony of Paul to Christ (3rd edition, 1911); A. Meyer, Jesus or Paul? 1909; Moffatt, Paul and Paulinism, 1910; Montet, Essai sur la christologie de Saint Paul, 1906; Nageli, Der Wortschatz des Apostels Paulus, 1905; Oehler, Paulus und Jesus, 1908; Paterson, The Pauline Theology, 1903; Pfleidercr, Paulinismus,1873,Influence of the Apostle Paul on the Development of Christianity, 1885; Prat, La theologie de Saint Paul, 1907; Ramsay, The Teaching of Paul in Terms of the Present Day, 1913; Resch, Paulinismus und die Logia Jesu, 1904; Rostron, The Christology of Paul, 1912; Simon, Die Psychologie des Apostels Paulus, 1897; Somerville, Paul\'s Conception of Christ, 1897; Stevens, The Pauline Theology, 1894; Thackeray, Relation of Paul to Contemporary Jewish Thought, 1900; J. Weiss, Paul and Jesus, 1909; Paul and Justification, 1913; Williams, A Plea for a Reconstruction of Paul\'s Doctrine of Justification, 1912; Wustmann, Jesus und Paulus, 1907; Zahn, Das Gesetz Gottes nach der Lehre des Apostels Paulus(2), 1892.``150';
isbe[6752]='Paul, Voyage And Shipwreck of``<a href="./study/isbe/search.html?string=PAUL,+THE+APOSTLE">PAUL, THE APOSTLE</a>; <a href="./study/isbe/search.html?string=PHOENIX">PHOENIX</a>`1';
isbe[6753]='Pauline Theology`pol\'-in:<P><b>I. THE PREPARATION</b><P class="in15">1. The Pharisee<P class="in15">2. Saul and Sin<P class="in15">3. Primitive Christianity<P><b>II. THE CONVERSION</b><P class="in15">1. Christ<P class="in15">2. The Spirit<P class="in15">3. The Unio Mystica<P class="in15">4. Salvation<P class="in15">5. Justification<P><b>III. FURTHER DEVELOPMENTS</b><P class="in15">1. Abolition of the Law<P class="in15">2. Gentiles<P class="in15">3. Redemption<P class="in15">4. Atonement<P class="in15">5. Moral Example<P class="in15">6. Function of the Law<P><b>IV. SPECIAL TOPICS</b><P class="in15">1. The Church<P class="in15">2. The Sacraments<hr /><P>I. The Preparation.<P>In order to understand the development of Paul\'s theological system, it is necessary to begin with his beliefs as a Pharisee. The full extent of these beliefs, to be sure, is not now ascertainable, for Pharisaism was a rule of conduct rather than a system of dogmas, and great diversity of opinions existed among Pharisees. Yet there was general concurrence in certain broad principles, while some of Paul\'s own statements enable us to specify his beliefs still more closely.<P>1. The Pharisee:<P>Saul the Pharisee believed that God was One, the Creator of all things. In His relation to His world He was transcendent, and governed it normally through His angels. Certain of these angelic governors had been unfaithful to their trust and had wrought evil, although God still permitted them to bear rule for a time (<a onClick="return mV(\'Col\',2,15);">Col 2:15</a>; compare Enoch 89:65). And evil had come into humanity through the transgression of the first man (<a onClick="return mV(\'Rom\',5,12);">Ro 5:12</a>; compare 2Esdras 7:118). To lead men away from this evil God gave His Law, which was a perfect revelation of duty (<a onClick="return mV(\'Rom\',7,12);">Ro 7:12</a>), and this Law was illumined by the traditions of the Fathers, which the Pharisees felt to be an integral part of the Law itself. God was merciful and would pardon the offender against the Law, if he completely amended his ways. But imperfect reformation brought no certain hope of pardon. To a few specially favored individuals God had given the help of His Spirit, but this was not for the ordinary individual. The great majority of mankind (compare 2Esdras 7:49-57), including all Gentiles, had no hope of salvation. In a very short time the course of the world would be closed. With God, from before the beginning of creation, there was existing a heavenly being, the Son of man of <a onClick="return mV(\'Dan\',7,13);">Da 7:13</a>, and He was about to be made manifest. (That Saul held the transcendental Messianic doctrine is not to be doubted.) As the world was irredeemably bad, this Messiah would soon appear, cause the dead to rise, hold the Last Judgment and bring from heaven the "Jerus that is above" (<a onClick="return mV(\'Gal\',4,26);">Ga 4:26</a>), in which the righteous would spend a blessed eternity.<P>See <a href="./study/isbe/search.html?string=PHARISEES">PHARISEES</a>; <a href="./study/isbe/search.html?string=MESSIAH">MESSIAH</a>; <a href="./study/isbe/search.html?string=PAROUSIA">PAROUSIA</a>.<P>2. Saul and Sin:<P><a onClick="return mV(\'Rom\',7,\'7-25\');">Ro 7:7-25</a> throws a further light on Saul\'s personal beliefs. The Old Testament promised pardon to the sinner who amended his ways, but the acute moral sense of Saul taught him that he could never expect perfectly to amend his ways. The 10th Commandment was the stumbling-block. Sins of deed and of word might perhaps be overcome, but sins of evil desires stayed with him, despite his full knowledge of the Law that branded them as sinful. Indeed, they seemed stimulated rather than suppressed by the divine precepts against them. With the best will in the world, Saul\'s efforts toward perfect righteousness failed continually and gave no promise of ever succeeding. He found himself thwarted by something that he came to realize was ingrained in his very nature and from which he could never free himself. Human nature as it is, the flesh (not "the material of the body"), contains a taint that makes perfect reformation impossible (<a onClick="return mV(\'Rom\',7,18);">Ro 7:18</a>; compare <a onClick="return mV(\'Rom\',8,3);">Ro 8:3</a>, etc.). Therefore, as the Law knows no pardon for the imperfectly reformed, Saul felt his future to be absolutely black. What he longed for was a promise of pardon despite continued sin, and that the Law precluded. (Any feeling that the temple sacrifices. would bring forgiveness had long since been obsolete in educated Judaism.)<P>There is every reason to suppose that Saul\'s experience was not unique at this period. Much has been written in recent years about the Jews\' confidence in God\'s mercy, and abundant quotations are brought from the Talmud in support of this. But the surviving portions of the literature of the Daniel-Aqiba period (165 BC-135 AD) give a different impression, for it is predominantly a literature of penitential prayers and confessions of sin, of pessimism regarding the world, the nation and one\'s self. In 2Esdras, in particular, Saul\'s experience is closely paralleled, and 2Esdras 7 (of course not in the King James Version) is one of the best commentaries ever written on <a onClick="return mV(\'Rom\',7,\'1-\');">Ro 7</a>.<P>3. Primitive Christianity:<P>Saul must have come in contact with Christianity very soon after Pentecost, at the latest. Some personal acquaintance with Christ is in no way impossible, irrespective of the meaning of <a onClick="return mV(\'2Cr\',5,16);">2Co 5:16</a>. But no one in Jerusalem, least of all a man like Saul, could have failed tq learn very early that there was a new "party" in Judaism. To his eyes this "party" would have about the following appearance: Here was a band of men proclaiming that the Messiah, whom all expected, would be the Jesus who had recently been crucified. Him the disciples were preaching as risen, ascended and sitting on God\'s right hand. They claimed that He had sent on all His followers the coveted gift of the Spirit, and they produced miracles in proof of their claim. A closer investigation would show that the death of Jesus was being interpreted in terms of <a onClick="return mV(\'Isa\',53,\'1-\');">Isa 53</a>, as a ransom for the nation. The inquirer would learn also that Jesus had given teaching that found constant and relentless fault with the Pharisees. Moreover, He had swept aside the tradition of the Fathers as worthless and had given the Law a drastic reinterpretation on the basis of eternal spiritual facts.<P>This inwardness must have appealed to Saul and he must have envied the joyous enthusiasm of the disciples. But to him Pharisaism was divine, and he was in a spiritual condition that admitted of no compromxses. Moreover, the Law (<a onClick="return mV(\'Gal\',3,13);">Ga 3:13</a>; compare <a onClick="return mV(\'Deu\',21,23);">De 21:23</a>) cursed anyone who had been hanged on a tree, and the new party was claiming celestial Messiahship for a man who had met this fate. The system aroused Saul\'s burning hatred; he appointed himself (perhaps stimulated by his moral desperation) to exterminate the new religion, and in pursuit of his mission he started for Damascus.<P>Saul must have gained a reasonable knowledge of Christ\'s teachings in this period of antagonism. He certainly could not have begun to persecute the faith without learning what it was, and in the inevitable discussions with his victims he must have learned still more, even against his will. This fact is often overlooked.<P>II. The Conversion.<P>1. Christ:<P>The immediate content of Paul\'s conversion was the realization that the celestial Messiah was truly Jesus of Nazareth. This was simply the belief of the primitive church and was the truth for which Christ had died (<a onClick="return mV(\'Mar\',14,62);">Mr 14:62</a>). But it involved much. It made Christ the Son of God (<a onClick="return mV(\'Rom\',8,32);">Ro 8:32</a>; <a onClick="return mV(\'Gal\',4,4);">Ga 4:4</a>, etc.), "firstborn of (i.e. "earlier than") all creation" (<a onClick="return mV(\'Col\',1,15);">Col 1:15</a>), "existing in the form of God" (<a onClick="return mV(\'Phl\',2,6);">Php 2:6</a>) and "rich" (<a onClick="return mV(\'2Cr\',8,9);">2Co 8:9</a>). In the Messiah are "all the treasures of wisdom and knowledge hidden" (<a onClick="return mV(\'Col\',2,3);">Col 2:3</a>), to be manifested at the end of time when the Messiah shall appear as the Judge of all (<a onClick="return mV(\'2Cr\',5,10);">2Co 5:10</a>, etc.), causing the resurrection of the dead (<a onClick="return mV(\'1Cr\',15,45);">1Co 15:45</a>, etc.). All this was given by Paul\'s former beliefs and had been claimed by Christ for Himself. That this Messiah had become man was a fact of the immediate past (the reality of the manhood was no problem at this period). As Messiah His sinlessness was unquestioned, while the facts of His life proved this sinlessness also. His teaching was wholly binding (<a onClick="return mV(\'1Cr\',7,10,11);">1Co 7:10,11</a>; that the writer of these words could have spared any effort to learn the teaching fully is out of the question). The conversion experience was proof sufficient of the resurrection, although for missionary purposes Paul used other evidence as well (<a onClick="return mV(\'1Cr\',15,\'1-11\');">1Co 15:1-11</a>).<P>Faith in this Messiah brought the unmistakable experience of the Holy Spirit (<a onClick="return mV(\'Rom\',8,2);">Ro 8:2</a>; <a onClick="return mV(\'Gal\',3,2);">Ga 3:2</a>, etc.; compare <a onClick="return mV(\'Act\',9,17);">Ac 9:17</a>), demonstrating Christ\'s Lordship (<a onClick="return mV(\'1Cr\',12,3);">1Co 12:3</a>; compare <a onClick="return mV(\'Act\',2,33);">Ac 2:33</a>). So "the head of every man is Christ" (<a onClick="return mV(\'1Cr\',11,3);">1Co 11:3</a>; compare <a onClick="return mV(\'Col\',1,18);">Col 1:18</a>; <a onClick="return mV(\'Eph\',1,22);">Eph 1:22</a>; <a onClick="return mV(\'Eph\',4,15);">4:15</a>), with complete control of the future (<a onClick="return mV(\'1Cr\',15,25);">1Co 15:25</a>), and all righteous men are His servants ("slaves," <a onClick="return mV(\'Rom\',1,1);">Ro 1:1</a>, etc.). To Him men may address their prayers (<a onClick="return mV(\'2Cr\',12,8);">2Co 12:8</a>; <a onClick="return mV(\'1Cr\',1,2);">1Co 1:2</a>, etc.; compare <a onClick="return mV(\'Act\',14,23);">Ac 14:23</a>).<P>Further reflection added to the concepts. As the Lordship of Christ was absolute, the power of all hostile beings must have been broken also (<a onClick="return mV(\'Rom\',8,38);">Ro 8:38</a>; <a onClick="return mV(\'Phl\',2,\'9-11\');">Php 2:9-11</a>; <a onClick="return mV(\'Col\',2,15);">Col 2:15</a>; <a onClick="return mV(\'Eph\',1,\'21-23\');">Eph 1:21-23</a>, etc.). The Being who had such significance for the present and the future could not have been without significance for the past. "In all things" He must have had "the preeminence" (<a onClick="return mV(\'Col\',1,18);">Col 1:18</a>). It was He who ministered to the Israelites at the Exodus (<a onClick="return mV(\'1Cr\',10,4,9);">1Co 10:4,9</a>). In fact He was not only "before all things" (<a onClick="return mV(\'Col\',1,17);">Col 1:17</a>), but "all things have been created through him" (<a onClick="return mV(\'Col\',1,16);">Col 1:16</a>). Wisdom and Logos concepts may have helped Paul in reaching these conclusions, which in explicit statement are an advance on Christ\'s own words. But the conclusions were inevitable.<P>Fitting these data of religious fact into the metaphysical doctrine of God was a problem that occupied the church for the four following centuries. After endless experimenting the only conclusion was shown to be that already reached by Paul in <a onClick="return mV(\'Rom\',9,5);">Ro 9:5</a> (compare <a onClick="return mV(\'Tts\',2,13);">Tit 2:13</a>, the English Revised Version, the American Revised Version margin), that Christ is God. To be sure, Paul\'s terminology, carried over from his pre-Christian days, elsewhere reserves "God" for the Father (and compare <a onClick="return mV(\'1Cr\',15,28);">1Co 15:28</a>). But the fact of this theology admits only of the conclusion that was duly drawn.<P>2. The Spirit:<P>A second fact given directly by the conversion was the presence of the Spirit, where the actual experience transcended anything that had been dreamed of. Primarily the operation of the Spirit was recognized in vividly supernatural effects (<a onClick="return mV(\'Rom\',15,19);">Ro 15:19</a>; <a onClick="return mV(\'1Cr\',12,\'5-11\');">1Co 12:5-11</a>, etc.; compare <a onClick="return mV(\'2Cr\',12,12);">2Co 12:12</a>; <a onClick="return mV(\'Act\',2,4);">Ac 2:4</a>), but Paul must at first have known the presence of the Spirit through the assurance of salvation given him, a concept that he never wearies of expressing (<a onClick="return mV(\'Rom\',8,16,23);">Ro 8:16,23</a>; <a onClick="return mV(\'Gal\',4,6);">Ga 4:6</a>, etc.). The work of the Spirit in producing holiness in the soul needs no comment (see <a href="./study/isbe/search.html?string=HOLY+SPIRIT">HOLY SPIRIT</a>; <a href="./study/isbe/search.html?string=SANCTIFICATION">SANCTIFICATION</a>), but it is characteristic of Paul that it is on this part of the Spirit\'s activity, rather than on the miraculous effects, that he lays the emphasis. "The fruit of the Spirit is love, joy, peace," etc. (<a onClick="return mV(\'Gal\',5,22);">Ga 5:22</a>); the greatest miracles without love are more than useless (<a onClick="return mV(\'1Cr\',13,\'1-3\');">1Co 13:1-3</a>); in such sayings Paul touched the depths of the purest teaching of Christ. To be sure, in the Synoptic Gospels the word "Spirit" is not often on Christ\'s lips, but there is the same conception of a life proceeding from a pure center (<a onClick="return mV(\'Mat\',6,22);">Mt 6:22</a>; <a onClick="return mV(\'Mat\',7,17);">7:17</a>, etc.) in entire dependence on God.<P>Further reflection and observation taught Paul something of the greatest importance for Christian theology. In prayer the Spirit appeared distinguished from the Father as well as from the Son (<a onClick="return mV(\'Rom\',8,26);">Ro 8:26</a>f; compare <a onClick="return mV(\'1Cr\',2,10);">1Co 2:10</a>f), giving three terms that together express the plenitude of the Deity (<a onClick="return mV(\'2Cr\',13,14);">2Co 13:14</a>; <a onClick="return mV(\'Eph\',1,3,6,13);">Eph 1:3,6,13</a>, etc.), with no fourth term ever similarly associated.<P>See <a href="./study/isbe/search.html?string=TRINITY">TRINITY</a>.<P>3. The Unio Mystica:<P>The indwelling of the divine produced by the Spirit is spoken of indifferently as the indwelling of the Spirit, or of the Spirit of Christ, or of Christ Himself (all three terms in <a onClick="return mV(\'Rom\',8,\'9-11\');">Ro 8:9-11</a>; compare <a onClick="return mV(\'1Cr\',2,12);">1Co 2:12</a>; <a onClick="return mV(\'Gal\',4,6);">Ga 4:6</a>; <a onClick="return mV(\'Eph\',3,17);">Eph 3:17</a>, etc.). The variations are in part due to the inadequacy of the Old terminology (so <a onClick="return mV(\'2Cr\',3,17);">2Co 3:17</a>), in part to the nature of the subject. Distinctions made between the operations of the persons of the Trinity on the soul can never be much more than verbal, and the terms are freely interchangeable. At all events, through the Spirit Christ is in the believer (<a onClick="return mV(\'Rom\',8,10);">Ro 8:10</a>; <a onClick="return mV(\'Gal\',2,20);">Ga 2:20</a>; <a onClick="return mV(\'Gal\',4,19);">4:19</a>; <a onClick="return mV(\'Eph\',3,17);">Eph 3:17</a>), or, what is the same thing, the believer is in Christ (<a onClick="return mV(\'Rom\',6,11);">Ro 6:11</a>; <a onClick="return mV(\'Rom\',8,1);">8:1</a>; <a onClick="return mV(\'Rom\',16,7);">16:7</a>, etc.). "We have become united with him" (<a onClick="return mV(\'Rom\',6,5);">Ro 6:5</a>, sumphutoi, "grown together with") in an union once and for all effected (<a onClick="return mV(\'Gal\',3,27);">Ga 3:27</a>) and yet always to be made more intimate (<a onClick="return mV(\'Rom\',13,14);">Ro 13:14</a>). The union so accomplished makes the man "a new creature" (<a onClick="return mV(\'2Cr\',5,17);">2Co 5:17</a>).<P>4. Salvation:<P>Paul now saw within himself a dual personality. His former nature, the old man, still persisted, with its impulses, liability to temptation, and inertnesses. The "flesh" still existed (<a onClick="return mV(\'Gal\',5,17);">Ga 5:17</a>; <a onClick="return mV(\'Rom\',8,12);">Ro 8:12</a>; <a onClick="return mV(\'Rom\',13,14);">13:14</a>; <a onClick="return mV(\'Eph\',4,22);">Eph 4:22</a>; <a onClick="return mV(\'Phl\',3,12);">Php 3:12</a>, etc.). On the other hand there was fighting in him against this former nature nothing less than the whole power of Christ, and its final victory could not be uncertain for a moment (<a onClick="return mV(\'Rom\',6,12);">Ro 6:12</a>; <a onClick="return mV(\'Rom\',8,2,10);">8:2,10</a>; <a onClick="return mV(\'Gal\',5,16);">Ga 5:16</a>, etc.). Indeed, it is possible to speak of the believer as entirely spiritual (<a onClick="return mV(\'Rom\',6,11,22);">Ro 6:11,22</a>; <a onClick="return mV(\'Rom\',8,9);">8:9</a>, etc.), as already in the kingdom (<a onClick="return mV(\'Col\',1,13);">Col 1:13</a>), as already sitting in heavenly places (<a onClick="return mV(\'Eph\',2,6);">Eph 2:6</a>). Of course Paul had too keen an appreciation of reality to regard believers as utterly sinless (<a onClick="return mV(\'Phl\',3,12);">Php 3:12</a>, etc.), and his pages abound in reproofs and exhortations. But the present existence of remnants of sin had no final terrors, for the ultimate victory over sin was certain, even if it was not to be complete until the last day when the power of God would redeem even the present physical frame (<a onClick="return mV(\'Rom\',8,11);">Ro 8:11</a>; <a onClick="return mV(\'Phl\',3,21);">Php 3:21</a>, etc.).<P>As the first man to belong to\'the higher order, and as the point from which the race could take a fresh start, Christ could justly be termed a new Adam (<a onClick="return mV(\'1Cr\',15,\'45-49\');">1Co 15:45-49</a>; compare <a onClick="return mV(\'Rom\',5,\'12-21\');">Ro 5:12-21</a>). If <a onClick="return mV(\'1Cr\',15,46);">1Co 15:46</a> has any relation to the PhiIonic doctrine of the two Adams, it is a polemic against it. Such a polemic would not be unlikely.<P>5. Justification:<P>A most extraordinary fact, to the former Pharisee, was that this experience had been gained without conscious effort and even against conscious effort (<a onClick="return mV(\'Phl\',3,7);">Php 3:7</a>f). After years of fruitless striving a single act of self-surrender had brought him an assurance that he had despaired of ever attaining. And this act of self-surrender is what Paul means by "faith," "faith without works." This faith is naturally almost anything in the world rather than a mere intellectual acknowledgment of a fact (<a onClick="return mV(\'Jam\',2,19);">Jas 2:19</a>), and is an act of the whole man, too complex for simple analysis. It finds, however, its perfect statement in Christ\'s reference to \'receiving the kingdom of God as a little child\' (<a onClick="return mV(\'Mar\',10,15);">Mr 10:15</a>). By an act of simple yielding Paul found himself no longer in dread of his sins; he was at peace with God, and confident as to his future; in a word, "justified." In one sense, to be sure, "works" were still involved, for without the past struggles the result would never have been attained. A desire, however imperfect, to do right is a necessary preparation for justification, and the word has no meaning to a man satisfied to be sunk in complete selfishness (<a onClick="return mV(\'Rom\',6,2);">Ro 6:2</a>; <a onClick="return mV(\'Rom\',3,8);">3:8</a>, etc.). This desire to do right, which Paul always presupposes, and the content given "faith" are sufficient safeguards against antinomianism. But the grace given is in no way commensurate with past efforts, nor does it grow out of them. It is a simple gift of God (<a onClick="return mV(\'Rom\',6,23);">Ro 6:23</a>).<P>III. Further Developments.<P>1. Abolition of the Law:<P>The adoption by Paul of the facts given by his conversion (and the immediate conclusions that followed from them) involved, naturally, a readjustment and a reformation of the other parts of his belief. The process must have occupied some time, if it was ever complete during his life, and must have been affected materially by his controversies with his former co-religionists and with very many Christians.<P>Fundamental was the problem of the Law. The Law was perfectly clear that he—and only he—who performed it would live. But life was found through faith in Christ, while the Law was not fulfilled. There could be no question of compromise between the two positions; they were simply incompatible (<a onClick="return mV(\'Rom\',10,5);">Ro 10:5</a>f; <a onClick="return mV(\'Gal\',2,16);">Ga 2:16</a>; <a onClick="return mV(\'Gal\',3,11);">3:11</a>f; <a onClick="return mV(\'Phl\',3,7);">Php 3:7</a>). One conclusion only was possible: "Christ is the end of the law unto righteousness to every one that believeth" (<a onClick="return mV(\'Rom\',10,4);">Ro 10:4</a>). As far as concerned the believer, the Law was gone. Two tremendous results followed. One was the immense simplification of what we call "Christian ethics," which were now to be determined by the broadest general principles of right and wrong and no longer by an elaborate legalistic construing of God\'s commands (<a onClick="return mV(\'Rom\',13,\'8-10\');">Ro 13:8-10</a>; <a onClick="return mV(\'Gal\',5,22);">Ga 5:22</a>f; etc.; compare <a onClick="return mV(\'Mar\',12,\'29-31\');">Mr 12:29-31</a>). To be sure, the commandments might be quoted as convenient expressions of moral duty (<a onClick="return mV(\'Eph\',6,2);">Eph 6:2</a>; <a onClick="return mV(\'1Cr\',9,9);">1Co 9:9</a>, etc.; compare <a onClick="return mV(\'Mar\',10,19);">Mr 10:19</a>), but they are binding because they are right, not because they are commandments (<a onClick="return mV(\'Col\',2,16);">Col 2:16</a>). So, in Paul\'s moral directions, he tries to bring out always the principle involved, and <a onClick="return mV(\'Rom\',14,\'1-\');">Ro 14</a> and <a onClick="return mV(\'1Cr\',8,\'1-\');">1Co 8</a> are masterpieces of the treatment of concrete problems by this method.<P>2. Gentiles:<P>The second result of the abolition of the Law was overwhelming. Gentiles had as much right to Christ as had the Jews, barring perhaps the priority of honor (<a onClick="return mV(\'Rom\',3,2);">Ro 3:2</a>, etc.) possessed by the latter. It is altogether conceivable, as <a onClick="return mV(\'Act\',22,21);">Ac 22:21</a> implies, that Paul\'s active acceptance of this result was long delayed and reached only after severe struggles. The fact was utterly revolutionary, and although it was prophesied in the Old Testament (<a onClick="return mV(\'Rom\',9,25);">Ro 9:25</a>f), yet \'the Messiah among you Gentiles\' remained the hidden mystery that God had revealed only in the last days (<a onClick="return mV(\'Col\',1,26);">Col 1:26</a>f; <a onClick="return mV(\'Eph\',3,\'3-6\');">Eph 3:3-6</a>, etc.). The struggles of the apostle in defense of this principle are the most familiar part of his career.<P>3. Redemption:<P>This consciousness of deliverance from the Law came to Paul in another way. The Law was meant for men in this world, but the union with Christ had raised him out of this world and so taken him away from the Law\'s control. In the Epistles this fact finds expression in an elaborately reasoned form. As Christ\'s nature is now a vital part of our nature, His death and resurrection are facts of our past as well. "Ye died, and your life is hid with Christ in God" (<a onClick="return mV(\'Col\',3,3);">Col 3:3</a>). But "the law hath dominion over a man" only "for so long time as he liveth" (<a onClick="return mV(\'Rom\',7,1);">Ro 7:1</a>). "Wherefore, my brethren, ye also were made dead to the law through the body of Christ" (<a onClick="return mV(\'Rom\',7,4);">Ro 7:4</a>). Compare <a onClick="return mV(\'Col\',2,\'11-13\',20);">Col 2:11-13,20</a>, where the same argument is used to show that ritual observance is no longer necessary. In <a onClick="return mV(\'Rom\',6,\'1-14\');">Ro 6:1-14</a> this argument is made to issue in a practical exhortation. Through the death of Christ, which is our death (<a onClick="return mV(\'Rom\',6,4);">6:4</A>), we, like Him, are placed in a higher world (<a onClick="return mV(\'Rom\',6,5);">6:5</A>) where sin has lost its power (<a onClick="return mV(\'Rom\',6,7);">6:7</A>), a world in which we are no longer under Law (<a onClick="return mV(\'Rom\',6,14);">6:14</a>). Hence, the intensest moral effort becomes our duty (<a onClick="return mV(\'Rom\',6,13);">6:13</A>; compare <a onClick="return mV(\'2Cr\',5,14);">2Co 5:14</a>f).<P>4. Atonement:<P>This release from the Law, however, does not solve the whole problem. Evil, present and past, is a fact, Law or no Law (on <a onClick="return mV(\'Rom\',4,15);">Ro 4:15b</a>; <a onClick="return mV(\'Rom\',5,13);">5:13b</A>; see the comms.), and a forbearance of God that simply "passes over" sins is disastrous for man as well as contrary to the righteous nature of God (<a onClick="return mV(\'Rom\',3,25);">Ro 3:25</a>f). However inadequate the Old Testament sacrifices were felt to have been (and hence, perhaps, Paul\'s avoidance of the Levitical terms except in <a onClick="return mV(\'Eph\',5,2);">Eph 5:2</a>), yet they offered the only help possible for the treatment of this most complex of problems. The guilt of our sins is "covered" by the death of Christ (<a onClick="return mV(\'1Cr\',15,3);">1Co 15:3</a>, where this truth is among those which were delivered to converts "first of all"; <a onClick="return mV(\'Rom\',3,25);">Ro 3:25</a>; <a onClick="return mV(\'Rom\',4,25);">4:25</a>; <a onClick="return mV(\'Rom\',5,6);">5:6</a>, etc.). This part of his theology Paul leaves in an incomplete form. He was accustomed, like any other man of his day, whether Jew or Gentile, to think naturally in sacrificial terms, and neither he nor his converts were conscious of any difficulty involved. Nor has theology since his time been able to contribute much toward advancing the solution of the problem. The fatal results of unchecked evil, its involving of the innocent with the guilty, and the value of vicarious suffering, are simple facts of our experience that defy our attempts to reduce them to intellectual formulas. In Paul\'s case it is to be noted that he views the incentive as coming from God (<a onClick="return mV(\'Rom\',3,25);">Ro 3:25</a>; <a onClick="return mV(\'Rom\',5,8);">5:8</a>; <a onClick="return mV(\'Rom\',8,32);">8:32</a>, etc.), because of His love toward man, so that a "gift-propitiation" of an angry deity is a theory the precise opposite of the Pauline. Moreover, Christ\'s death is not a mere fact of the past, but through the "mystical union" is incorporated into the life of every believer.<P>Further developments of this doctrine about Christ\'s death find in it the complete destruction of whatever remained of the Law (<a onClick="return mV(\'Col\',2,14);">Col 2:14</a>), especially as the barrier between Jew and Gentile (<a onClick="return mV(\'Eph\',2,15);">Eph 2:15</a>f). The extension of the effects of the death to the unseen world (<a onClick="return mV(\'Col\',2,15);">Col 2:15</a>; compare <a onClick="return mV(\'Gal\',4,9);">Ga 4:9</a>; <a onClick="return mV(\'Eph\',4,8);">Eph 4:8</a>) was of course natural.<P>5. Moral Example:<P>The death of Christ as producing a subjective moral power in the believer is appealed to frequently (compare <a onClick="return mV(\'Rom\',8,3);">Ro 8:3</a>; <a onClick="return mV(\'Gal\',2,20);">Ga 2:20</a>; <a onClick="return mV(\'Eph\',5,2,25);">Eph 5:2,25</a>; <a onClick="return mV(\'Phl\',2,5);">Php 2:5</a>, etc.), while the idea is perhaps present to some degree even in <a onClick="return mV(\'Rom\',3,26);">Ro 3:26</a>. From a different point of view, the Cross as teaching the vanity of worldly things is a favorite subject with Paul (<a onClick="return mV(\'1Cr\',1,\'22-25\');">1Co 1:22-25</a>; <a onClick="return mV(\'2Cr\',13,4);">2Co 13:4</a>; <a onClick="return mV(\'Gal\',5,11);">Ga 5:11</a>; <a onClick="return mV(\'Gal\',6,14);">6:14</a>, etc.). These aspects require no explanation.<P>There are, accordingly, in Paul\'s view of the death of Christ at least three distinct lines, the "mystical," the "juristic," and the "ethical." But this distinction is largely only genetic and logical, and the lines tend to blend in all sorts of combinations. Consequently, it is frequently an impossible exegetical problem to determine which is most prominent in any given passage (e.g. <a onClick="return mV(\'2Cr\',5,14);">2Co 5:14</a>f).<P>6. Function of the Law:<P>Regarding the Law a further question remained, which had great importance in Paul\'s controversies. If the Law was useless for salvation, why was it given at all? Paul replies that it still had its purpose. To gain righteousness one must desire it and this desire the Law taught (<a onClick="return mV(\'Rom\',7,12,16);">Ro 7:12,16</a>; <a onClick="return mV(\'Rom\',2,18);">2:18</a>), even though it had no power to help toward fulfillment. So the Law gave knowledge of sin (<a onClick="return mV(\'Rom\',3,20);">Ro 3:20</a>; <a onClick="return mV(\'Rom\',7,7);">7:7</a>). But Paul did not hesitate to go beyond this. Familiar in his own experience with the psychological truth that a prohibition may actually stimulate the desire to transgress it, he showed that the Law actually had the purpose of bringing out all the dormant evil within us, that grace might deal with it effectually (<a onClick="return mV(\'Rom\',5,20);">Ro 5:20</a>f; <a onClick="return mV(\'Rom\',7,8,25);">7:8,25</a>; compare <a onClick="return mV(\'1Cr\',15,56);">1Co 15:56</a>). Thus the Law became our paidagogos "to bring us unto Christ" (<a onClick="return mV(\'Gal\',3,24);">Ga 3:24</a>; see <a href="./study/isbe/search.html?string=SCHOOLMASTER">SCHOOLMASTER</a>), and came in "besides" (<a onClick="return mV(\'Rom\',5,20);">Ro 5:20</a>), i.e. as something not a primary part of God\'s plan. Indeed, this could be shown from the Law itself, which proved that faith was the primary method of salvation (<a onClick="return mV(\'Rom\',4,\'1-\');">Ro 4</a>; compare <a onClick="return mV(\'Gal\',3,17);">Ga 3:17</a>) and which actually prophesied its own repeal (<a onClick="return mV(\'Gal\',4,\'21-31\');">Ga 4:21-31</a>). With this conclusion, which must have required much time to work out, Paul\'s reversal of his former Pharisaic position was complete.<P>IV. Special Topics.<P>1. The Church:<P>As Christ is the central element in the life of the believer, all believers have this element in common and are so united with each other (<a onClick="return mV(\'Rom\',12,5);">Ro 12:5</a>). This is the basis of the Pauline doctrine of the church. The use of the word "church" to denote the whole body of believers is not attained until the later Epistles (<a onClick="return mV(\'Col\',1,18);">Col 1:18</a>; <a onClick="return mV(\'Phl\',3,6);">Php 3:6</a>; <a onClick="return mV(\'Eph\',1,22);">Eph 1:22</a>, etc.)—before that time the word is in the plural when describing more than a local congregation (<a onClick="return mV(\'2Th\',1,4);">2Th 1:4</a>; <a onClick="return mV(\'1Cr\',7,17);">1Co 7:17</a>; <a onClick="return mV(\'Rom\',16,16);">Ro 16:16</a>, etc.)—but the idea is present from the first. Indeed, the only terms in Judaism that were at all adequate were "the nation" or "Israel." Paul uses the latter term (<a onClick="return mV(\'Gal\',6,16);">Ga 6:16</a>) and quite constantly expresses himself in a manner that suggests the Old Testament figures for the nation (e.g. compare <a onClick="return mV(\'Eph\',5,25);">Eph 5:25</a> with <a onClick="return mV(\'Hsa\',2,19);">Ho 2:19</a>f), and time was needed in order to give ekklesia (properly "assembly") the new content.<P>The church is composed of all who have professed faith in Christ and the salvation of its members Paul takes generally for granted (<a onClick="return mV(\'1Th\',1,4);">1Th 1:4</a>; <a onClick="return mV(\'Rom\',1,7);">Ro 1:7</a>; <a onClick="return mV(\'1Cr\',1,8);">1Co 1:8</a>, etc.), even in the case of the incestuous person of <a onClick="return mV(\'1Cr\',5,5);">1Co 5:5</a> (compare <a onClick="return mV(\'1Cr\',3,15);">3:15</A>; <a onClick="return mV(\'1Cr\',11,32);">11:32</A>). To be sure, <a onClick="return mV(\'1Cr\',5,\'11-13\');">1Co 5:11-13</a> makes it clear that the excommunication of grave sinners had been found necessary, and one may doubt if Paul had much hope for the "false brethren" of <a onClick="return mV(\'2Cr\',11,26);">2Co 11:26</a>; <a onClick="return mV(\'Gal\',2,4);">Ga 2:4</a> (compare <a onClick="return mV(\'1Cr\',3,17);">1Co 3:17</a>, etc.). But on the whole Paul\'s optimism has little doubt that every member of the church is in right relations with God. These members, through their union with Christ, form a corporate, social organism of the greatest possible solidarity (<a onClick="return mV(\'1Cr\',12,26);">1Co 12:26</a>, etc.) and have the maximum of responsibility toward one another (<a onClick="return mV(\'Rom\',14,15);">Ro 14:15</a>; <a onClick="return mV(\'1Cr\',8,11);">1Co 8:11</a>; <a onClick="return mV(\'2Cr\',8,\'13-15\');">2Co 8:13-15</a>; <a onClick="return mV(\'Gal\',6,2);">Ga 6:2</a>; <a onClick="return mV(\'Eph\',4,25);">Eph 4:25</a>; <a onClick="return mV(\'Col\',1,24);">Col 1:24</a>, etc.). They are utterly distinct from the world around them (<a onClick="return mV(\'2Cr\',6,\'14-18\');">2Co 6:14-18</a>; <a onClick="return mV(\'1Cr\',5,12);">1Co 5:12</a>, etc.), although in constant intercourse with it (<a onClick="return mV(\'1Cr\',5,10);">1Co 5:10</a>; <a onClick="return mV(\'1Cr\',10,27);">10:27</a>, etc.). It was even desirable, in the conditions of the times, that the church should have her own courts like Jews in Gentile cities (<a onClick="return mV(\'1Cr\',6,5);">1Co 6:5</a>f). The right of the church to discipline her members is taken for granted (<a onClick="return mV(\'1Cr\',5,\'1-\');">1Co 5</a>; <a onClick="return mV(\'2Cr\',2,\'5-11\');">2Co 2:5-11</a>). According to <a onClick="return mV(\'Act\',14,23);">Ac 14:23</a> Paul made his own appointments of church officers, but the Epistles as a whole would suggest that this practice did not extend beyond Asia Minor. For further details see <a href="./study/isbe/search.html?string=CHURCH+GOVERNMENT">CHURCH GOVERNMENT</a>; <a href="./study/isbe/search.html?string=MINISTRY">MINISTRY</a>. A general obedience to Paul\'s own authority is presupposed throughout.<P>The church is, of course, the object of Christ\'s sanctifying power (<a onClick="return mV(\'Eph\',5,\'25-30\');">Eph 5:25-30</a>) and is so intimately united with Him as to be spoken of as His "body" (<a onClick="return mV(\'1Cr\',12,27);">1Co 12:27</a>; <a onClick="return mV(\'Col\',1,18);">Col 1:18</a>; <a onClick="return mV(\'Eph\',1,23);">Eph 1:23</a>, etc.), or as the "complement" of Christ, the extension of His personality into the world (<a onClick="return mV(\'Eph\',1,22);">Eph 1:22</a>f). As such, its members have not only their duty toward one another, but also the responsibility of carrying Christ\'s message into the world (<a onClick="return mV(\'Phl\',2,15);">Php 2:15</a>f; and presupposed everywhere). And to God shall "be the glory in the church and in Christ Jesus unto all generations forever and ever" (<a onClick="return mV(\'Eph\',3,21);">Eph 3:21</a>).<P>2. The Sacraments:<P>As the union with Christ\'s death is something more than a subjective impression made on the mind by the fact of that death, the references to the union with the death accomplished in baptism in <a onClick="return mV(\'Rom\',6,\'1-7\');">Ro 6:1-7</a> and <a onClick="return mV(\'Col\',2,11);">Col 2:11</a>f are not explained by supposing them to describe a mere dramatic ceremony. That Paul was really influenced by the mystery-religion concepts has not been made out. But his readers certainly were so influenced and tended to conceive very materialistic views of the Christian sacraments (<a onClick="return mV(\'1Cr\',10,5);">1Co 10:5</a>; <a onClick="return mV(\'1Cr\',15,29);">15:29</a>). And historic exegesis is bound to construe Paul\'s language in the way in which he knew his readers would be certain to understand it, and no ordinary Gentile reader of Paul\'s day would have seen a purely "symbolic" meaning in either of the baptismal passages. Philo would have done so, but not the class of men with whom Paul had to deal. Similarly, with regard to the Lord\'s Supper, in <a onClick="return mV(\'1Cr\',10,20);">1Co 10:20</a> Paul teaches that through participation in a sacral meal it is possible to be brought into objective relations with demons of whom one is wholly ignorant. In this light it is hard to avoid the conclusion that through participation in the Lord\'s Supper the believer is objectively brought into communion with the Lord (<a onClick="return mV(\'1Cr\',10,16);">1Co 10:16</a>), a communion that will react for evil on the believer if he approach it in an unworthy manner (<a onClick="return mV(\'1Cr\',11,\'29-32\');">1Co 11:29-32</a>): i.e. the union with Christ that is the center of Paul\'s theology he teaches to be established normally through baptism. And in the Lord\'s Supper this union is further strengthened. That faith on the part of the believer is an indispensable prerequisite for the efficacy of the sacraments need not be said.`<a href="./study/isbe/search.html?string=GOD">GOD</a>; <a href="./study/isbe/search.html?string=PAROUSIA">PAROUSIA</a>; <a href="./study/isbe/search.html?string=PRAYER">PRAYER</a>; <a href="./study/isbe/search.html?string=PREDESTINATION">PREDESTINATION</a>; <a href="./study/isbe/search.html?string=PROPITIATION">PROPITIATION</a>; <a href="./study/isbe/search.html?string=PAUL">PAUL</a>`48';
isbe[6754]='Paulus, Sergius`po\'-lus, sur\'-ji-us (Sergios Paulos): The Roman "proconsul" (Revised Version) or "deputy" (the King James Version) of Cyprus when Paul, along with Barnabas, visited that island on his first missionary journey (<a onClick="return mV(\'Act\',13,4,7);">Ac 13:4,7</a>). The official title of Sergius is accurately given in Acts. Cyprus was originally an imperial province, but in 22 BC it was transferred by Augustus to the Senate, and was therefore placed under the administration of proconsuls, as is attested by extant Cyprian coins of the period. When the two missionaries arrived at Paphos, Sergius, who was a "prudent man" (the King James Version) or "man of understanding" (Revised Version), i.e. a man of practical understanding, "sought to hear the word of God" (<a onClick="return mV(\'Act\',13,7);">Ac 13:7</a>). Bar-Jesus, or Elymas, a sorcerer at the court of Sergius, fearing the influence of the apostles, sought, however, "to turn aside the proconsul from the faith," but was struck with blindness (<a onClick="return mV(\'Act\',13,\'8-11\');">Ac 13:8-11</a>); and the deputy, "when he saw what was done, believed, being astonished at the teaching of the Lord" (<a onClick="return mV(\'Act\',13,12);">Ac 13:12</a>). The narrative indicates that not only the miracle but also the attention with which Sergius listened to the teaching of Paul (compare <a onClick="return mV(\'Act\',13,7);">Ac 13:7</a>) conduced to his conversion (Bengel). Attempts have been made to trace some connection between the name Sergius Paulus and the fact that Saul is first called Paul in <a onClick="return mV(\'Act\',13,9);">Ac 13:9</a>, but the joint occurrence of the two names is probably to be set down as only a coincidence.``88';
isbe[6755]='Pavement`pav\'-ment: In the Old Testament, with the exception of <a onClick="return mV(\'2Ki\',16,17);">2Ki 16:17</a>, the Hebrew word is ritspah (<a onClick="return mV(\'2Ch\',7,3);">2Ch 7:3</a>; <a onClick="return mV(\'Est\',1,6);">Es 1:6</a>; <a onClick="return mV(\'Eze\',40,17);">Eze 40:17</a>, etc.); in Sirach 20:18 and Bel and the Dragon verse 19 the word is edaphos; in <a onClick="return mV(\'Jhn\',19,13);">Joh 19:13</a>, the name "The Pavement" (lithostrotos, "paved with stone") is given to the place outside the Praetorium on which Pilate sat to give judgment upon Jesus. Its Hebrew (Aramaic) equivalent is declared to be <a href="./study/isbe/search.html?string=GABBATHA">GABBATHA</a> (which see). The identification of the place is uncertain.``1';
isbe[6756]='Pavilion`pa-vil\'-yun: A covered place, booth, tent, in which a person may be kept hid or secret (cokh, <a onClick="return mV(\'Psa\',27,5);">Ps 27:5</a>; cukkah—the usual term—<a onClick="return mV(\'Psa\',31,20);">Ps 31:20</a>), or otherwise be withdrawn from view. The term is used with reference to God (<a onClick="return mV(\'2Sa\',22,12);">2Sa 22:12</a>; <a onClick="return mV(\'Psa\',18,11);">Ps 18:11</a>); to kings drinking in privacy (<a onClick="return mV(\'1Ki\',20,12,16);">1Ki 20:12,16</a>); the Revised Version (British and American) gives "pavilion" for the King James Version "tabernacle" in <a onClick="return mV(\'Job\',36,29);">Job 36:29</a>; <a onClick="return mV(\'Isa\',4,6);">Isa 4:6</a>; while in <a onClick="return mV(\'Num\',25,8);">Nu 25:8</a> it substitutes this word, with the margin "alcove," for the King James Version "tent" (qubbah), and <a onClick="return mV(\'Jer\',43,10);">Jer 43:10</a>, for "royal pavilion" (shaphrur), reads in the margin "glittering pavilion."``132';
isbe[6757]='Paw`po (kaph, literally, "palm," yadh, literally, "hand"): The former (kaph) is applied to the soft paws of animals in contradistinction to the hoofs (<a onClick="return mV(\'Lev\',11,27);">Le 11:27</a>); the latter is thrice used in <a onClick="return mV(\'1Sa\',17,37);">1Sa 17:37</a>: "Yahweh that delivered me out of the paw (yadh) of the lion, and out of the paw (yadh) of the bear, he will deliver me out of the hand (yadh) of this Philistine." The verb "to paw" (chaphar) is found in the description of the horse: "He paweth (margin "they paw") in the valley, and rejoiceth in his strength: he goeth out to meet the armed men (margin, "the weapons")" (<a onClick="return mV(\'Job\',39,21);">Job 39:21</a>). The word is usually translated "to delve into," "to pry into," "to explore."``106';
isbe[6758]='Pe`pa "p": The 17th letter of the Hebrew alphabet; transliterated in this Encyclopedia as "p" with daghesh and "ph" (equalsf) without. It came also to be used for the number 80.`<a href="./study/isbe/search.html?string=ALPHABET">ALPHABET</a>`1';
isbe[6759]='Peace`pes (shalom; eirene):<P>1. In the Old Testament:<P>Is a condition of freedom from disturbance, whether outwardly, as of a nation from war or enemies, or inwardly, within the soul. The Hebrew word is shalom (both adjective and substantive), meaning, primarily, "soundness," "health," but coming also to signify "prosperity," well-being in general, all good in relation to both man and God. In early times, to a people harassed by foes, peace was the primary blessing. In <a onClick="return mV(\'Psa\',122,7);">Ps 122:7</a>, we have "peace" and "prosperity," and in <a onClick="return mV(\'Psa\',35,27);">35:27</A>; <a onClick="return mV(\'Psa\',73,3);">73:3</A>, shalom is translated "prosperity." In <a onClick="return mV(\'2Sa\',11,7);">2Sa 11:7</a> the King James Version, David asked of Uriah "how Joab did" (margin "of the peace of Joab"), "and how the people did (the Revised Version (British and American) "fared," literally, "of the peace of the people"), and how the war prospered" (literally, "and of the peace (welfare) of the war").<P>(1) Shalom was the common friendly greeting, used in asking after the health of anyone; also in farewells (<a onClick="return mV(\'Gen\',29,6);">Ge 29:6</a>, "Is it well with him?" ("Is there peace to him?"); <a onClick="return mV(\'Gen\',43,23);">43:23</a>, "Peace be to you"; <a onClick="return mV(\'Gen\',43,27);">43:27</A>, "He asked them of their welfare (of their peace)"; <a onClick="return mV(\'Jdg\',6,23);">Jud 6:23</a>, "Yahweh said unto him, Peace be unto thee"; <a onClick="return mV(\'Jdg\',18,15);">18:15</A> (the King James Version "saluted him," margin "Hebrew asked him of peace," the Revised Version (British and American) "of his welfare"); <a onClick="return mV(\'Jdg\',19,20);">Jud 19:20</a>, etc.). See also <a href="./study/isbe/search.html?string=GREETING">GREETING</a>.<P>(2) Peace from enemies (implying prosperity) was the great desire of the nation and was the gift of God to the people if they walked in His ways (<a onClick="return mV(\'Lev\',26,6);">Le 26:6</a>; <a onClick="return mV(\'Num\',6,26);">Nu 6:26</a>, "Yahweh lift up his countenance upon thee, and give thee peace"; <a onClick="return mV(\'Psa\',29,11);">Ps 29:11</a>; <a onClick="return mV(\'Isa\',26,12);">Isa 26:12</a>, etc.). To "die in peace" was greatly to be desired (<a onClick="return mV(\'Gen\',15,15);">Ge 15:15</a>; <a onClick="return mV(\'1Ki\',2,6);">1Ki 2:6</a>; <a onClick="return mV(\'2Ch\',34,28);">2Ch 34:28</a>, etc.).<P>(3) Inward peace was the portion of the righteous who trusted in God (<a onClick="return mV(\'Job\',22,21);">Job 22:21</a>, "Acquaint now thyself with him, and be at peace (shalam)"; <a onClick="return mV(\'Psa\',4,8);">Ps 4:8</a>; <a onClick="return mV(\'Psa\',85,8);">85:8</a>, "He will speak peace unto his people, and to his saints"; <a onClick="return mV(\'Psa\',119,165);">119:165</A>; <a onClick="return mV(\'Pro\',3,2,17);">Pr 3:2,17</a>; <a onClick="return mV(\'Isa\',26,3);">Isa 26:3</a>, "Thou wilt keep him in perfect peace (Hebrew "peace, peace"), whose mind is stayed on thee; because he trusteth in thee"; <a onClick="return mV(\'Mal\',2,5);">Mal 2:5</a>); also outward peace (<a onClick="return mV(\'Job\',5,23,24);">Job 5:23,24</a>; <a onClick="return mV(\'Pro\',16,7);">Pr 16:7</a>, etc.).<P>(4) Peace was to be sought and followed by the righteous (<a onClick="return mV(\'Psa\',34,14);">Ps 34:14</a>, "Seek peace, and pursue it"; <a onClick="return mV(\'Zec\',8,16,19);">Zec 8:16,19</a>, "Love truth and peace").<P>(5) Peace should be a prominent feature of the Messianic times (<a onClick="return mV(\'Isa\',2,4);">Isa 2:4</a>; <a onClick="return mV(\'Isa\',9,6);">9:6</a>, "Prince of Peace"; <a onClick="return mV(\'Isa\',11,6);">Isa 11:6</a>; <a onClick="return mV(\'Eze\',34,25);">Eze 34:25</a>; <a onClick="return mV(\'Mic\',4,\'2-4\');">Mic 4:2-4</a>; <a onClick="return mV(\'Zec\',9,10);">Zec 9:10</a>).<P>In the New Testament, where eirene has much the same meaning and usage as shalom (for which it is employed in the Septuagint; compare <a onClick="return mV(\'Luk\',19,42);">Lu 19:42</a>, the Revised Version (British and American) "If thou hadst known...the things which belong unto peace"), we have still the expectation of "peace" through the coming of the Christ (<a onClick="return mV(\'Luk\',1,74,79);">Lu 1:74,79</a>; <a onClick="return mV(\'Luk\',12,51);">12:51</a>) and also its fulfillment in the higher spiritual sense.<P>2. In the New Testament:<P>(1) The gospel in Christ is a message of peace from God to men (<a onClick="return mV(\'Luk\',2,14);">Lu 2:14</a>; <a onClick="return mV(\'Act\',10,36);">Ac 10:36</a>, "preaching...peace by Jesus Christ"). It is "peace with God through our Lord Jesus Christ," in <a onClick="return mV(\'Rom\',5,1);">Ro 5:1</a>; the King James Version <a onClick="return mV(\'Rom\',10,15);">10:15</A>; peace between Jew and Gentile (<a onClick="return mV(\'Eph\',2,14,15);">Eph 2:14,15</a>); an essential element in the spiritual kingdom of God (<a onClick="return mV(\'Rom\',14,17);">Ro 14:17</a>).<P>(2) It is to be cherished and followed by Christians. Jesus exhorted His disciples, "Have salt in yourselves, and be at peace one with another" (<a onClick="return mV(\'Mar\',9,50);">Mr 9:50</a>); Paul exhorts, "Live in peace: and the God of love and peace shall be with you" (<a onClick="return mV(\'2Cr\',13,11);">2Co 13:11</a>; compare <a onClick="return mV(\'Rom\',12,18);">Ro 12:18</a>; <a onClick="return mV(\'1Cr\',7,15);">1Co 7:15</a>).<P>(3) God is therefore "the God of peace," the Author and Giver of all good ("peace" including every blessing) very frequently (e.g. <a onClick="return mV(\'Rom\',15,33);">Ro 15:33</a>; <a onClick="return mV(\'Rom\',16,20);">16:20</a>; <a onClick="return mV(\'2Th\',3,16);">2Th 3:16</a>, etc., "the Lord of peace"). "Peace from God our Father and the Lord Jesus Christ" is a common apostolic wish or salutation (compare <a onClick="return mV(\'1Cr\',1,3);">1Co 1:3</a>; <a onClick="return mV(\'2Cr\',1,2);">2Co 1:2</a>, etc.).<P>(4) We have also "peace" as a greeting (<a onClick="return mV(\'Mat\',10,13);">Mt 10:13</a>; <a onClick="return mV(\'Luk\',10,5);">Lu 10:5</a>); "a son of peace" (<a onClick="return mV(\'Luk\',10,6);">Lu 10:6</a>) is one worthy of it, in sympathy with it; the Lord\'s own greeting to His disciples was "Peace be unto you" (<a onClick="return mV(\'Luk\',24,36);">Lu 24:36</a>; <a onClick="return mV(\'Jhn\',20,19,21,26);">Joh 20:19,21,26</a>), and ere He left them He gave them specially His blessing of "Peace" (<a onClick="return mV(\'Jhn\',14,27);">Joh 14:27</a>); we have also frequently "Go in peace" (<a onClick="return mV(\'Mar\',5,34);">Mr 5:34</a>; <a onClick="return mV(\'Luk\',7,50);">Lu 7:50</a>). In <a onClick="return mV(\'Luk\',19,38);">Lu 19:38</a>, we have "peace in heaven" (in the acclamation of Jesus on His Messianic entry of Jerusalem).<P>(5) The peace that Christ brought is primarily spiritual peace from and with God, peace in the heart, peace as the disposition or spirit. He said that He did not come "to send peace on the earth, but a sword," referring to the searching nature of His call and the divisions and clearances it would create. But, of course, the spirit of the gospel and of the Christian is one of peace, and it is a Christian duty to seek to bring war and strife everywhere to an end. This is represented as the ultimate result of the gospel and Spirit of Christ; universal and permanent peace can come only as that Spirit rules in men\'s hearts.<P>"Peace" in the sense of silence, to hold one\'s peace, etc., is in the Old Testament generally the translation of charash, "to be still, or silent" (<a onClick="return mV(\'Gen\',24,21);">Ge 24:21</a>; <a onClick="return mV(\'Gen\',34,5);">34:5</a>; <a onClick="return mV(\'Job\',11,3);">Job 11:3</a>); also of chashah, "to hush," "to be silent" (<a onClick="return mV(\'2Ki\',2,3,5);">2Ki 2:3,5</a>; <a onClick="return mV(\'Psa\',39,2);">Ps 39:2</a>), and of other words. In <a onClick="return mV(\'Job\',29,10);">Job 29:10</a> ("The nobles held their peace," the King James Version), it is qol, "voice."<P>In the New Testament we have siopao, "to be silent," "to cease speaking" (<a onClick="return mV(\'Mat\',20,31);">Mt 20:31</a>; <a onClick="return mV(\'Mat\',26,63);">26:63</a>; <a onClick="return mV(\'Act\',18,9);">Ac 18:9</a>, etc.); sigao, "to be silent," "not to speak" (<a onClick="return mV(\'Luk\',20,26);">Lu 20:26</a>; <a onClick="return mV(\'Act\',12,17);">Ac 12:17</a>); hesuchazo, "to be quiet" (<a onClick="return mV(\'Luk\',14,4);">Lu 14:4</a>; <a onClick="return mV(\'Act\',11,18);">Ac 11:18</a>); phimoo, "to muzzle or gag" (<a onClick="return mV(\'Mar\',1,25);">Mr 1:25</a>; <a onClick="return mV(\'Luk\',4,35);">Lu 4:35</a>).<P>In Apocrypha eirene is frequent, mostly in the sense of peace from war or strife (Tobit 13:14; Judith 3:1; Ecclesiasticus 13:18; 1Macc 5:54; 6:49; 2Macc 14:6, eustatheia equals "tranquillity").<P>The Revised Version (British and American) has "peace" for "tongue" (<a onClick="return mV(\'Est\',7,4);">Es 7:4</a>; <a onClick="return mV(\'Job\',6,24);">Job 6:24</a>; <a onClick="return mV(\'Amo\',6,10);">Am 6:10</a>; <a onClick="return mV(\'Hab\',1,13);">Hab 1:13</a>); "at peace with me" for "perfect" (<a onClick="return mV(\'Isa\',42,19);">Isa 42:19</a>, margin "made perfect" or "recompensed"); "security" instead of "peaceably" and "peace" (<a onClick="return mV(\'Dan\',8,25);">Da 8:25</a>; <a onClick="return mV(\'Dan\',11,21,24);">11:21,24</a>); "came in peace to the city," for "came to Shalem, a city" (<a onClick="return mV(\'Gen\',33,18);">Ge 33:18</a>); "it was for my peace" instead of "for peace" (<a onClick="return mV(\'Isa\',38,17);">Isa 38:17</a>); "when they are in peace," for "and that which should have been for their welfare" (<a onClick="return mV(\'Psa\',69,22);">Ps 69:22</a>).``185';
isbe[6760]='Peace offering``<a href="./study/isbe/search.html?string=SACRIFICE">SACRIFICE</a>`1';
isbe[6761]='Peacemaker`pes\'-mak-er: Occurs only in the plural (<a onClick="return mV(\'Mat\',5,9);">Mt 5:9</a>, "Blessed are the peacemakers (eirenopoioi): for they shall be called sons of God" (who is "the God of peace")). We have also what seems to be a reflection of this saying in <a onClick="return mV(\'Jam\',3,18);">Jas 3:18</a>, "The fruit of righteousness is sown in peace for (the Revised Version margin "by") them that make peace" (tois poiousin eirenen). In classical Greek a "peacemaker" was an ambassador sent to treat of peace. The word in <a onClick="return mV(\'Mat\',5,9);">Mt 5:9</a> would, perhaps, be better rendered "peace-workers," implying not merely making peace between those who are at variance, but working peace as that which is the will of the God of peace for men.``185';
isbe[6762]='Peacock`pe\'-kok (tukkiyim (plural); Latin Pavo cristatus): A bird of the genus Pavo. Japan is the native home of the plainer peafowl; Siam, Ceylon and India produce the commonest and most gorgeous. The peacock has a bill of moderate size with an arched tip, its cheeks are bare, the eyes not large, but very luminous, a crest of 24 feathers 2 inches long, with naked shafts and broad tips of blue, glancing to green. The neck is not long but proudly arched, the breast full, prominent and of bright blue green, blue predominant. The wings are short and ineffectual, the feathers on them made up of a surprising array of colors. The tail consists of 18 short, stiff, grayish-brown feathers. Next is the lining of the train, of the same color. The glory of this glorious bird lies in its train. It begins on the back between the wings in tiny feathers not over 6 inches in length, and extends backward. The quills have thick shafts of purple and green shades, the eye at the tip of each feather from one-half to 2 inches across, of a deep peculiar blue, surrounded at the lower part by two half-moon-shaped crescents of green. Whether the train lies naturally, or is spread in full glory, each eye shows encircled by a marvel of glancing shades of green, gold, purple, blue and bronze. When this train is spread, it opens like a fan behind the head with its sparkling crest, and above the wondrous blue of the breast. The bird has the power to contract the muscles at the base of the quills and play a peculiar sort of music with them. It loves high places and cries before a storm in notes that are startling to one not familiar with them. The bird can be domesticated and will become friendly enough to take food from the hand. The peahen is smaller than the cock, her neck green, her wings gray, tan and brown—but she has not the gorgeous train. She nests on earth and breeds with difficulty when imported, the young being delicate and tender. The grown birds are hardy when acclimated, and live to old age. By some freak of nature, pure white peacocks are at times produced. Aristophanes mentioned peafowl in his Birds, II. 102, 269. Alexander claimed that he brought them into Greece from the east, but failed to prove his contention. Pliny wrote that Hortensius was the first to serve the birds for food, and that Aufidius Lurco first fattened and sold them in the markets. It was the custom to skin the bird, roast and recover it and send it to the table, the gaudy feathers showing.<P>The first appearance of the bird in the Bible occurs in a summing-up of the wealth and majesty of Solomon (<a onClick="return mV(\'1Ki\',10,22);">1Ki 10:22</a> "For the king had at sea a navy of Tarshish with the navy of Hiram: once every three years came the navy of Tarshish, bringing gold, and silver, ivory, and apes, and peacocks"). (Here the Septuagint translates peleketoi (s.c. lithoi), equals "(stones) carved with an ax.") The same statement is made in <a onClick="return mV(\'2Ch\',9,21);">2Ch 9:21</a>: "For the king had ships that went to Tarshish with the servants of Huram; once every three years came the ships of Tarshish, bringing gold and silver, ivory, and apes, and peacocks" Septuagint omits). There is no question among scholars and scientists but that these statements are true, as the ships of Solomon are known to have visited the coasts of India and Ceylon, and Tarshish was on the Malabar coast of India, where the native name of the peacock was tokei, from which tukkiyim undoubtedly was derived (see <a href="./study/isbe/search.html?string=GOLD">GOLD</a>, and The Expository Times, IX, 472). The historian Tennant says that the Hebrew names for "ivory" and "apes" were also the same as the Tamil. The reference to the small, ineffectual wing of the peacock which scarcely will lift the weight of the body and train, that used to be found in Job, is now applied to the ostrich, and is no doubt correct:<P class="in15">"The wings of the ostrich wave proudly;<br>But are they the pinions and plumage of love?" (<a onClick="return mV(\'Job\',39,13);">Job 39:13</a>).<P>While the peacock wing seems out of proportion to the size of the bird, it will sustain flight and bear the body to the treetops. The wing of the ostrich is useless for flight.``167';
isbe[6763]='Pearl`purl.`<a href="./study/isbe/search.html?string=STONES,+PRECIOUS">STONES, PRECIOUS</a>`1';
isbe[6764]='Peculiar`pe-kul\'-yar: The Latin peculium means "private property," so that "peculiar" properly equals "pertaining to the individual." In modern English the word has usually degenerated into a half-colloquial form for "extraordinary," but in Biblical English it is a thoroughly dignified term for "esp. one\'s own"; compare the "peculiar treasure" of the king in <a onClick="return mV(\'Ecc\',2,8);">Ec 2:8</a> (the King James Version). Hence, "peculiar people" (the King James Version <a onClick="return mV(\'Deu\',14,2);">De 14:2</a>, etc.) means a people especially possessed by God and particularly prized by Him. The word in the Old Testament (the King James Version <a onClick="return mV(\'Exd\',19,5);">Ex 19:5</a>; <a onClick="return mV(\'Deu\',14,2);">De 14:2</a>; <a onClick="return mV(\'Deu\',26,18);">26:18</a>; <a onClick="return mV(\'Psa\',135,4);">Ps 135:4</a>; <a onClick="return mV(\'Ecc\',2,8);">Ec 2:8</a>) invariably represents ceghullah, "property," an obscure word which Septuagint usually rendered by the equally obscure periousios (apparently meaning "superabundant"), which in turn is quoted in <a onClick="return mV(\'Tts\',2,14);">Tit 2:14</a>. In <a onClick="return mV(\'Mal\',3,17);">Mal 3:17</a>, however, Septuagint has peripoiesis, quoted in <a onClick="return mV(\'1Pe\',2,9);">1Pe 2:9</a>. the English Revised Version in the New Testament substituted "own possession" in the two occurrences, but in the Old Testament kept "peculiar" and even extended its use (<a onClick="return mV(\'Deu\',7,6);">De 7:6</a>; <a onClick="return mV(\'Mal\',3,17);">Mal 3:17</a>) to cover every occurrence of ceghullah except in <a onClick="return mV(\'1Ch\',29,3);">1Ch 29:3</a> ("treasure"). the American Standard Revised Version, on the contrary, has dropped "peculiar" altogether, using "treasure" in <a onClick="return mV(\'1Ch\',29,3);">1Ch 29:3</a>; <a onClick="return mV(\'Ecc\',2,8);">Ec 2:8</a>, and "own possession" elsewhere. the King James Version also has "peculiar commandments" (idios, "particular," the Revised Version (British and American) "several") in The <span class="noTag">Wisdom of Solomon 19:6</span>, and the Revised Version (British and American) has "peculiar" where the King James Version has "special" in The <span class="noTag">Wisdom of Solomon 3:14</span> for eklekte, "chosen out."``48';
isbe[6765]='Pedahel`ped\'-a-hel, pe-da\'-el (pedhah\'-el, "whom God redeems"): A prince of Naphtali; one of the tribal chiefs who apportioned the land of Canaan (<a onClick="return mV(\'Num\',34,28);">Nu 34:28</a>; compare <a onClick="return mV(\'Num\',34,17);">Nu 34:17</a>).``1';
isbe[6766]='Pedahzur`pe-da\'zur (pedhahtsur): Mentioned in <a onClick="return mV(\'Num\',1,10);">Nu 1:10</a>; <a onClick="return mV(\'Num\',2,20);">2:20</a>; <a onClick="return mV(\'Num\',7,54,59);">7:54,59</a>; <a onClick="return mV(\'Num\',10,23);">10:23</a> as the father of Gamaliel, head of the tribe of Manasseh, at the time of the exodus. See The Expository Times, VIII, 555ff.``1';
isbe[6767]='Pedaiah`pe-da\'-ya, pe-di\'-a (pedhayahu, "Yah redeems"):<P>(1) Father of Joel, who was ruler of Western Manasseh in David\'s reign (<a onClick="return mV(\'1Ch\',27,20);">1Ch 27:20</a>). Form pedhayah (see above).<P>(2) Pedaiah of Rumah (<a onClick="return mV(\'2Ki\',23,36);">2Ki 23:36</a>), father of Zebudah, Jehoiakim\'s mother.<P>(3) A son of Jeconiah (<a onClick="return mV(\'1Ch\',3,18);">1Ch 3:18</a>); in <a onClick="return mV(\'1Ch\',3,19);">1Ch 3:19</a> the father of Zerubbabel. Pedaiah\'s brother, Shealtiel, is also called father of Zerubbabel (<a onClick="return mV(\'Ezr\',3,2);">Ezr 3:2</a>; but in <a onClick="return mV(\'1Ch\',3,17);">1Ch 3:17</a> the King James Version spelled "Salathiel"). There may have been two cousins, or even different individuals may be referred to under Shealtiel and Salathiel respectively.<P>(4) Another who helped to repair the city wall (<a onClick="return mV(\'Neh\',3,25);">Ne 3:25</a>), of the family of <a href="./study/isbe/search.html?string=PAROSH">PAROSH</a> (which see). Perhaps this is the man who stood by Ezra at the reading of the Law (<a onClick="return mV(\'Neh\',8,4);">Ne 8:4</a>; 1Esdras 9:44, called "Phaldeus").<P>(5) A "Levite," appointed one of the treasurers over the "treasuries" of the Lord\'s house (<a onClick="return mV(\'Neh\',13,13);">Ne 13:13</a>).<P>(6) A Benjamite, one of the rulers residing in Jerusalem under the "return" arrangements (<a onClick="return mV(\'Neh\',11,7);">Ne 11:7</a>).``186';
isbe[6768]='Pedestal`ped\'-es-tal (ken): In two places (<a onClick="return mV(\'1Ki\',7,29,31);">1Ki 7:29,31</a>) the Revised Version (British and American) gives this word for the King James Version "base" (in Solomon\'s "Sea").``1';
isbe[6769]='Pedias`ped\'-i-as, pe-di\'-as (Pedias; Codex Alexandrinus Paideias; the King James Version by mistake Pelias): One of those who had taken "strange wives" (1Esdras 9:34) equals "Bedeiah" of <a onClick="return mV(\'Ezr\',10,35);">Ezr 10:35</a>.``1';
isbe[6770]='Pedigree`ped\'-i-gre (hithyalledh, "to show one\'s birth"): The English word "pedigree" occurs only once in the Bible, according to the concordance. In <a onClick="return mV(\'Num\',1,18);">Nu 1:18</a>, it is said: "They declared their pedigrees"; that is, they enrolled or registered themselves according to their family connections. The same idea is expressed frequently, employing a different term in the Hebrew, by the common phrase of Chronicles, Ezra and Nehemiah, "to reckon by genealogy," "to give genealogy," etc. (compare <a onClick="return mV(\'1Ch\',7,5,9);">1Ch 7:5,9</a>; <a onClick="return mV(\'Ezr\',2,62);">Ezr 2:62</a>ff; <a onClick="return mV(\'Neh\',7,64);">Ne 7:64</a>). These last passages indicate the importance of the registered pedigree or genealogy, especially of the priests in the post-exilic community, for the absence of the list of their pedigrees, or their genealogical records, was sufficient to cause the exclusion from the priesthood of certain enrolled priests.``13';
isbe[6771]='Peel; Pill`pel, pil: "Pill" (<a onClick="return mV(\'Gen\',30,37,38);">Ge 30:37,38</a>; Tobit 11:13 (the Revised Version (British and American) "scaled")) and "peel" (<a onClick="return mV(\'Isa\',18,2,7);">Isa 18:2,7</a> (the King James Version and the Revised Version margin); <a onClick="return mV(\'Eze\',29,18);">Eze 29:18</a> (the King James Version and the English Revised Version)) are properly two different words, meaning "to remove the hair" (pilus) and "to remove the skin" (pellis), but in Elizabethan English the two were confused. In <a onClick="return mV(\'Isa\',18,2,7);">Isa 18:2,7</a>, the former meaning is implied, as the Hebrew word here (marat) is rendered "pluck off the hair" in <a onClick="return mV(\'Ezr\',9,3);">Ezr 9:3</a>; <a onClick="return mV(\'Neh\',13,25);">Ne 13:25</a>; <a onClick="return mV(\'Isa\',50,6);">Isa 50:6</a>. The word, however, may also mean "make smooth" (so the Revised Version margin) or "bronzed." This last, referring to the dark skins of the Ethiopians, is best here, but in any case the King James Version and the Revised Version margin are impossible. In the other cases, however, "remove the skin" (compare "scaled," Tobit 11:13 the Revised Version (British and American)) is meant. So in <a onClick="return mV(\'Gen\',30,37,38);">Ge 30:37,38</a>, Jacob "peels" (so the Revised Version (British and American)) off portions of the bark of his rods, so as to give alternating colors (compare <a onClick="return mV(\'Gen\',30,39);">30:39</a>). And in <a onClick="return mV(\'Eze\',29,18);">Eze 29:18</a>, the point is Nebuchadrezzar\'s total failure in his siege of Tyre, although the soldiers had carried burdens until the skin was peeled from their shoulders (compare the American Standard Revised Version "worn").``48';
isbe[6772]='Peep`pep (tsphaph; the King James Version <a onClick="return mV(\'Isa\',8,19);">Isa 8:19</a>; <a onClick="return mV(\'Isa\',10,14);">10:14</a> (the Revised Version (British and American) "chirp")): In <a onClick="return mV(\'Isa\',10,14);">10:14</A>, the word describes the sound made by a nestling bird; in <a onClick="return mV(\'Isa\',8,19);">8:19</A>, the changed (ventriloquistic?) voice of necromancers uttering sounds that purported to come from the feeble dead. The modern use of "peep" equals "look" is found in Sirach 21:23, as the translation of parakupto: "A foolish man peepeth in from the door of another man\'s house."``1';
isbe[6773]='Pekah`pe\'-ka (peqach, "opening" (of the eyes) (<a onClick="return mV(\'2Ki\',15,\'25-31\');">2Ki 15:25-31</a>); Phakee):<P>1. Accession:<P>Son of Remaliah, and 18th king of Israel. Pekah murdered his predecessor, Pekahiah, and seized the reins of power (<a onClick="return mV(\'2Ki\',15,25);">2Ki 15:25</a>). His usurpation of the throne is said to have taken place in the 52nd year of Uzziah, and his reign to have lasted for 20 years (<a onClick="return mV(\'2Ki\',15,27);">2Ki 15:27</a>). His accession, therefore, may be placed in 748 BC (other chronologies place it later, and make the reign last only a few years).<P>Pekah came to the throne with the resolution of assisting in forming a league to resist the westward advance of Assyria. The memory of defeat by Assyria at the battle of Karkar in 753, more than 100 years before, had never died out.<P>2. Attitude of Assyria:<P>Tiglath-pileser III was now ruler of Assyria, and in successive campaigns since 745 had proved himself a resistless conqueror. His lust for battle was not yet satisfied, and the turn of Philistia and Syria was about to come. In 735, a coalition, of which Pekah was a prominent member, was being formed to check his further advance. It comprised the princes of Comagene, Gebal, Hamath, Arvad, Ammon, Moab, Edom, Gaza, Samaria, Syria, and some minor potentates, the list being taken from a roll of the subject-princes who attended a court and paid tribute after the fall of Damascus. Ahaz likewise attended as a voluntary tributary to do homage to Tiglath-pileser (<a onClick="return mV(\'2Ki\',16,10);">2Ki 16:10</a>).<P>3. Judah Recalcitrant:<P>While the plans of the allies were in course of formation, an obstacle was met with which proved insurmountable by the arts of diplomacy. This was the refusal of Ahaz, then on the throne of David, to join the confederacy. Arguments and threats having failed to move him, resort was had to force, and the troops of Samaria and Damascus moved on Jerusalem (<a onClick="return mV(\'2Ki\',16,5);">2Ki 16:5</a>). Great alarm was felt at the news of their approach, as seen in the 7th and 8th chapters of Isaiah. The allies had in view to dispossess Ahaz of his crown, and give it to one of their own number, a son of Tabeel. Isaiah himself was the mainstay of the opposition to their projects. The policy he advocated, by divine direction, was that of complete neutrality. This he urged with passionate earnestness, but with only partial success. Isaiah (probably) had kept back Ahaz from joining the coalition, but could not prevent him from sending an embassy, laden with gifts to Tiglath-pileser, to secure his intervention. On the news arriving that the Assyrian was on the march, a hasty retreat was made from Jerusalem, and the blow soon thereafter fell, where Isaiah had predicted, on Rezin and Pekah, and their kingdoms.<P>4. Chronicles Ancillary to Kings:<P>The severely concise manner in which the writer of Kings deals with the later sovereigns of the Northern Kingdom is, in the case of Pekah, supplemented in Chronicles by further facts as to this campaign of the allies. The Chronicler states that "a great multitude of captives" were taken to Damascus and many others to Samaria. These would be countrymen and women from the outlying districts of Judah, which were ravaged. Those taken to Samaria were, however, returned, unhurt, to Jericho by the advice of the prophet Oded (<a onClick="return mV(\'2Ch\',28,\'5-15\');">2Ch 28:5-15</a>).<P>5. Fall of Damascus; Northern and Eastern Palestine Overrun:<P>The messengers sent from Jerusalem to Nineveh appear to have arrived when the army of Tiglath-pileser was already prepared to march. The movements of the Assyrians being expedited, they fell upon Damascus before the junction of the allies was accomplished. Rezin was defeated in a decisive battle, and took refuge in his capital, which was closely invested. Another part of the invading army descended on the upper districts of Syria and Samaria. Serious resistance to the veteran troops of the East could hardly be made, and city after city fell. A list of districts and cities that were overrun is given in <a onClick="return mV(\'2Ki\',15,29);">2Ki 15:29</a>. It comprises Gilead beyond Jordan—already partly depopulated (<a onClick="return mV(\'1Ch\',5,26);">1Ch 5:26</a>); the tribal division of Naphtali, lying to the west of the lakes of Galilee and Merom, and all Galilee, as far south as the plain of Esdraelon and the Valley of Jezreel. Cities particularly mentioned are Ijon (now \'Ayun), Abel-beth-maacah (now \'Abi), Janoah (now Yanun), Kedesh (now Kados) and Hazor (now Hadireh).<P>6. Deportation of the Inhabitants:<P>These places and territories were not merely attacked and plundered. Their inhabitants were removed, with indescribable loss and suffering, to certain districts in Assyria, given as Halah, Habor, Hara, and both sides of the river Gozan, an affluent of the Euphrates. The transplantation of these tribes to a home beyond the great river was a new experiment in political geography, devised with the object of welding the whole of Western Asia into a single empire. It was work of immense difficulty and must have taxed the resources of even so great an organizer as Tiglath-pileser. The soldiers who had conquered in the field were, of course, employed to escort the many thousands of prisoners to their new locations. About two-thirds of the Samarian kingdom, comprising the districts of Samaria, the two Galilees, and the trans-Jordanic region, was thus denuded of its inhabitants.<P>7. Death of Pekah:<P>Left with but a third of his kingdom—humbled but still defiant—Pekah was necessarily unpopular with his subjects. In this extremity—the wave of invasion from the north having spent itself—the usual solution occurred, and a plot was formed by which the assassination of Pekah should be secured, and the assassin should take his place as a satrap of Assyria. A tool was found in the person of Hoshea, whom T
