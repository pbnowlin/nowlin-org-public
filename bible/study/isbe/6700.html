e the 13th century BC, for Assur, the ancient capital, which was on the west bank of the Tigris, was abandoned at about that date for Kalkhi on the east.<P>(2) Archaeology and Genesis.<P>Closely connected with the foregoing are cases where Genesis has preserved information that is true of a very early time only. Thus in <a onClick="return mV(\'Gen\',10,22);">10:22</A> Elam figures as a son of Shem. The historical Elam was, however, an Aryan people. Recently inscriptions have been discovered which show that in very early times Elam really was inhabited by Semites. "The fact," writes Driver, at the place, "is not one which the writer of this verse is likely to have known." This contention falls to the ground when we find that only three verses off we have material that goes back at least as far as the time of Abraham. After all, the presumption is that the writer stated the fact because he knew it, not in spite of his not knowing it; and that knowledge must be due to the same cause as the noteworthy language of <a onClick="return mV(\'Gen\',10,19);">Ge 10:19</a>, i.e. to early date.<P>This is merely one example of the confirmations of little touches in Genesis that are constantly being provided by archaeology. For the detailed facts see the separate articles, e.g. <a href="./study/isbe/search.html?string=AMRAPHEL">AMRAPHEL</a>; <a href="./study/isbe/search.html?string=JERUSALEM">JERUSALEM</a>, and compare IV, below.<P>From the point of view of the critical question we note<P>(a) that such accuracy is a natural mark of authentic early documents, and<P>(b) that in view of the arguments already adduced and of the legal evidence to be considered, the most reasonable explanation is to be found in a theory of contemporary authorship.<P>(3) The Legal Evidence of Genesis.<P>The legal evidence is perhaps more convincing, for here no theory of late authorship can be devised to evade the natural inference. Correct information as to early names, geography, etc., might be the result of researches by an exilic writer in a Babylonian library; but early customs that are confirmed by the universal experience of primitive societies, and that point to a stage of development which had long been passed in the Babylonia even of Abraham\'s day, can be due to but one cause—genuine early sources. The narratives of Genesis are certainly not the work of comparative sociologists. Two instances may be cited. The law of homicide shows us two stages that are known to be earlier than the stage attested by <a onClick="return mV(\'Exd\',21,12);">Ex 21:12</a>ff. In the story of Cain we have one stage; in <a onClick="return mV(\'Gen\',9,6);">Ge 9:6</a>, which does not yet recognize any distinction between murder and other forms of homicide, we have the other.<P>Our other example shall be the unlimited power of life and death possessed by the head of the family (<a onClick="return mV(\'Gen\',38,24);">Ge 38:24</a>; <a onClick="return mV(\'Gen\',42,37);">42:37</a>, etc.), which has not yet been limited in any way by the jurisdiction of the courts as in Exodus-Deuteronomy. In both cases comparative historical jurisprudence confirms the Bible account against the critical, which would make e.g. <a onClick="return mV(\'Gen\',9,6);">Ge 9:6</a> post-exilic, while assigning <a onClick="return mV(\'Exd\',21,\'1-\');">Ex 21</a> to a much earlier period. (On the whole subject see further OP, 135ff.)<P>(4) The Professedly Mosaic Character of the Legislation.<P>Coming now to the four concluding books of the Pentateuch, we must first observe that the legislation everywhere professes to be Mosaic. Perhaps this is not always fully realized. In critical editions of the text the rubrics and an occasional phrase are sometimes assigned to redactors, but the representation of Mosaic date is far too closely interwoven with the matter to be removed by such devices. If e.g. we take such a section as <a onClick="return mV(\'Deu\',12,\'1-\');">De 12</a>, we shall find it full of such phrases as "for ye are not as yet come to the rest and to the inheritance" etc.; "When ye go over Jordan," "the place which the Lord shall choose" (the King James Version), etc. It is important to bear this in mind throughout the succeeding discussion.<P>(5) The Historical Situation required by Pentateuch.<P>What do we find if we ignore the Mosaic dress and seek to fit P into any other set of conditions, particularly those of the post-exilic period? The general historical situation gives a clear answer. The Israelites are represented as being so closely concentrated that they will always be able to keep the three pilgrimage festivals. One exception only is contemplated, namely, that ritual uncleanness or a journey may prevent an Israelite from keeping the Passover. Note that in that case he is most certainly to keep it one month later (<a onClick="return mV(\'Num\',9,10);">Nu 9:10</a>f). How could this law have been enacted when the great majority of the people were in Babylonia, Egypt, etc., so that attendance at the temple was impossible for them on any occasion whatever? With this exception the entire Priestly Code always supposes that the whole people are at all times dwelling within easy reach of the religious center. How strongly this view is embedded in the code may be seen especially from <a onClick="return mV(\'Lev\',17,\'1-\');">Le 17</a>, which provides that all domestic animals to be slaughtered for food must be brought to the door of the Tent of Meeting. Are we to suppose that somebody deliberately intended such legislation to apply when the Jews were scattered all over the civilized world, or even all over Canaan? If so, it means a total prohibition of animal food for all save the inhabitants of the capital.<P>In post-exilic days there was no more pressing danger for the religious leaders to combat than intermarriage, but this code, which is supposed to have been written for the express purpose of bringing about their action, goes out of its way to give a fictitious account of a war and incidentally to legalize some such unions (<a onClick="return mV(\'Num\',31,18);">Nu 31:18</a>). And this chapter also contains a law of booty. What could be more unsuitable? How and where were the Jews to make conquests and capture booty in the days of Ezra?<P>"Or again, pass to the last chapter of Numbers and consider the historical setting. What is the complaint urged by the deputation that waits upon Moses? It is this: If heiresses \'be married to any of the sons of the other tribes of the children of Israel, then shall their inheritance be taken away from the inheritance of our fathers, and shall be added to the inheritance of the tribe whereunto they shall belong.\' What a pressing grievance for a legislator to consider and redress when tribes and tribal lots had long since ceased to exist for ever!" (OP, 121f).<P>Perhaps the most informing of all the discrepancies between P and the post-exilic age is one that explains the freedom of the earlier prophets from its literary influence. According to the constant testimony of the Pentateuch, including the Priestly Code (P), portions of the law were to reach the people only through priestly teaching (<a onClick="return mV(\'Lev\',10,11);">Le 10:11</a>; <a onClick="return mV(\'Deu\',24,8);">De 24:8</a>; <a onClick="return mV(\'Deu\',33,10);">33:10</a>, etc.). Ezra on the other hand read portions of P to the whole people.<P>(6) The Hierarchical Organization in Pentateuch.<P>Much of what falls under this head is treated in <a href="./study/isbe/search.html?string=PRIESTS+AND+LEVITES">PRIESTS AND LEVITES, sec. 2, (a), (b)</a>, and need not be repeated here. The following may be added: "Urim and Thummim were not used after the Exile. In lieu of the simple conditions—a small number of priests and a body of Levites—we find a developed hierarchy, priests, Levites, singers, porters, Nethinim, sons of Solomon\'s servants. The code that ex hypothesi was forged to deal with this state of affairs has no acquaintance with them. The musical services of the temple are as much beyond its line of vision as the worship of the synagogue. Even such an organization as that betrayed by the reference in <a onClick="return mV(\'1Sa\',2,36);">1Sa 2:36</a> to the appointment by the high priest to positions carrying pecuniary emoluments is far beyond the primitive simplicity of P" (OP, 122).<P>(7) The Legal Evidence of the Pentateuch.<P>As this subject is technical we can only indicate the line of reasoning. Legal rules may be such as to enable the historical inquirer to say definitely that they belong to an early stage of society. Thus if we find elementary rules relating to the inheritance of a farmer who dies without leaving sons, we know that they cannot be long subsequent to the introduction of individual property in land, unless of course the law has been deliberately altered. It is an everyday occurrence for men to die without leaving sons, and the question What is to happen to their land in such cases must from the nature of the case be raised and settled before very long. When therefore we find such rules in <a onClick="return mV(\'Num\',27,\'1-\');">Nu 27</a>, etc., we know that they are either very old or else represent a deliberate change in the law. The latter is really out of the question, and we are driven back to their antiquity (see further OP, 124ff). Again in <a onClick="return mV(\'Num\',35,\'1-\');">Nu 35</a> we find an elaborate struggle to express a general principle which shall distinguish between two kinds of homicide. The earlier law had regarded all homicide as on the same level (<a onClick="return mV(\'Gen\',9,\'1-\');">Ge 9</a>). Now, the human mind only reaches general principles through concrete cases, and other ancient legislations (e.g. the Icelandic) bear witness to the primitive character of the rules of Numbers. Thus, an expert like Dareate can say confidently that such rules as these are extremely archaic (see further SBL and OP, passim).<P>(8) The Evidence of Deuteronomist.<P>The following may be quoted: "Laws are never issued to regulate a state of things which has passed away ages before, and can by no possibility be revived. What are we to think, then, of a hypothesis which assigns the code of Deuteronomy to the reign of Josiah, or shortly before it, when its injunctions to exterminate the Canaanites (<a onClick="return mV(\'Gen\',20,16,17,18);">20:16-18</a>) and the Amalekites (<a onClick="return mV(\'Gen\',25,17,18,19);">25:17-19</A>), who had long since disappeared, would be as utterly out of date as a law in New Jersey at the present time offering a bounty for killing wolves and bears, or a royal proclamation in Great Britain ordering the expulsion of the Danes? A law contemplating foreign conquests (<a onClick="return mV(\'Gen\',20,\'10-15\');">20:10-15</A>) would have been absurd when the urgent question was whether Judah could maintain its own existence against the encroachments of Babylon and Egypt. A law discriminating against Ammon and Moab (<a onClick="return mV(\'Gen\',23,3,4);">23:3,4</A>), in favor of Edom (<a onClick="return mV(\'Gen\',23,7,8);">23:7,8</a>), had its warrant in the Mosaic period, but not in the time of the later kings. Jeremiah discriminates precisely the other way, promising a future restoration to Moab (<a onClick="return mV(\'Jer\',48,47);">48:47</A>) and Ammon (<a onClick="return mV(\'Jer\',49,6);">49:6</A>), which he denies to Edom (<a onClick="return mV(\'Jer\',49,17,18);">49:17,18</a>), who is also to Joel (<a onClick="return mV(\'Joe\',3,19);">3:19</a>), Obadiah, and Isaiah (<a onClick="return mV(\'Isa\',63,\'1-6\');">63:1-6</a>), the representative foe of the people of God...The allusions to Egypt imply familiarity with and recent residence in that land...And how can a code belong to the time of Josiah, which, while it contemplates the possible selection of a king in the future (<a onClick="return mV(\'Deu\',17,14);">De 17:14</a>), nowhere implies an actual regal government, but vests the supreme central authority in a judge and the priesthood (<a onClick="return mV(\'Deu\',17,\'8-12\');">De 17:8-12</a>; <a onClick="return mV(\'Deu\',19,17);">19:17</a>); which lays special stress on the requirements that the king must be a native and not a foreigner (<a onClick="return mV(\'Deu\',17,15);">De 17:15</a>), when the undisputed line of succession had for ages been fixed in the family of David, and that he must not \'cause the people to return to Egypt.\' (<a onClick="return mV(\'Deu\',17,16);">De 17:16</a>), as they seemed ready to do on every grievance in the days of Moses (<a onClick="return mV(\'Num\',14,4);">Nu 14:4</a>), but which no one ever dreamed of doing after they were fairly established in Canaan?" (Green, Moses and the Prophets, 63f). This too may be supplemented by legal evidence (e.g. <a onClick="return mV(\'Deu\',22,26);">De 22:26</a> testifies to the undeveloped intellectual condition of the people). Of JE it is unnecessary to speak, for <a onClick="return mV(\'Exd\',21,\'1-\');">Ex 21</a>f are now widely regarded as Mosaic in critical circles. Wellhausen (Prolegomena (6), 392, note) now regards their main elements as pre-Mosaic Canaanitish law.<P>(9) Later Allusions.<P>These are of two kinds. Sometimes we have references to the laws, in other cases we find evidence that they were in operation.<P>(a) By postulating redactors evidence can be banished from the Biblical text. Accordingly, reference will only be made to some passages where this procedure is not followed. <a onClick="return mV(\'Eze\',22,26);">Eze 22:26</a> clearly knows of a law that dealt with the subjects of the Priestly Code (P), used its very language (compare <a onClick="return mV(\'Lev\',10,10);">Le 10:10</a>f), and like P was to be taught to the people by the priests. <a onClick="return mV(\'Hsa\',4,6);">Ho 4:6</a> also knows of some priestly teaching, which, however, is moral and may therefore be <a onClick="return mV(\'Lev\',19,1);">Le 19</a>; but in <a onClick="return mV(\'Lev\',8,\'11-13\');">8:11-13</a> he speaks of 10,000 written precepts, and here the context points to ritual. The number and the subject-matter of these precepts alike make it certain that he knew a bulky written law which was not merely identical with <a onClick="return mV(\'Exd\',21,\'1-\');">Ex 21</a>; <a onClick="return mV(\'Exd\',22,\'1-\');">22</a>; <a onClick="return mV(\'Exd\',23,\'1-\');">23</a>, and this passage cannot be met by Wellhausen who resorts to the device of translating it with the omission of the important word "write."<P>(b) Again, in dealing with institutions the references can often be evaded. It is possible to say, "Yes, this passage knows such and such a law, but this law does not really come into existence with D or the Priestly Code (P), but was an older law incorporated in these documents." That argument would apply, e.g. to the necessity for two witnesses in the case of Naboth. That is a law of D, but those who assign Deuteronomy to the reign of Josiah would assert that it is here merely incorporating older material. Again the allusions sometimes show something that differs in some way from the Pentateuch, and it is often impossible to prove that this was a development. The critics in such cases claim that it represents an earlier stage, and it frequently happens that the data are insufficient either to support or refute this view. "But fortunately there are in P certain institutions of which the critics definitely assert that they are late. Accordingly, references that prove the earlier existence of such institutions have a very different probative value. Thus it is alleged that before the exile there was but one national burnt offering and one national meal offering each day: whereas <a onClick="return mV(\'Num\',28,\'1-\');">Nu 28</a> demands two. Now in <a onClick="return mV(\'1Ki\',18,29,36);">1Ki 18:29,36</a>, we find references to the offering of the evening oblation, but <a onClick="return mV(\'2Ki\',3,20);">2Ki 3:20</a> speaks of \'the time of offering the oblation\' in connection with the morning. Therefore these two oblations were actually in existence centuries before the date assigned to P—who, on the critical theory, first introduced them. So <a onClick="return mV(\'2Ki\',16,15);">2Ki 16:15</a> speaks of \'the morning burnt-offering, and the evening meal-offering...with the burnt-offering of all the people of the land, and their meal-offering.\' This again gives us the two burnt offerings, though, on the hypothesis, they were unknown to pre-exilic custom. Similarly in other cases: <a onClick="return mV(\'Jer\',32,\'1-\');">Jer 32</a> shows us the land laws in actual operation; Ezekiel is familiar with the Jubilee laws—though, on the critical hypothesis, these did not yet exist. Jeroboam was acquainted with P\'s date for Tabernacles, though the critics allege that the date was first fixed in the Exile" (OP, 132f) .<P>(10) Other Evidence.<P>We can only mention certain other branches of evidence. There is stylistic evidence of early date (see e.g. Lias, BS, 1910, 20-46, 299-334). Further, the minute accuracy of the narrative of Exd-Num to local conditions, etc. (noticed below, IV,8,(6)), affords valuable testimony. It may be said generally that the whole work—laws and narrative—mirrors early conditions, whether we regard intellectual, economic or purely legal development (see further below, IV, and OP, passim).<P>5. The Fundamental Improbabilities of the Critical Case:<P>(1) Moral and Psychological Issues.<P>The great fundamental improbabilities of the critical view have hitherto been kept out of sight in order that the arguments for and against the detailed case might not be prejudiced by other considerations. We must now glance at some of the broader issues. The first that occurs is the moral and psychological incredibility. On theory two great frauds were perpetrated—in each case by men of the loftiest ethical principles. Deuteronomy was deliberately written in the form of Mosaic speeches by some person or persons who well knew that their work was not Mosaic. P is a make-up—nothing more. All its references to the wilderness, the camp, the Tent of Meeting, the approaching occupation of Canaan, etc., are so many touches introduced for the purpose of deceiving. There can be no talk of literary convention, for no such convention existed in Israel. The prophets all spoke in their own names, not in the dress of Moses. David introduced a new law of booty in his own name; the Chronicler repeatedly refers temple ordinances to David and Solomon; Samuel introduced a law of the kingdom in his own name. Yet we are asked to believe that these gigantic forgeries were perpetrated without reason or precedent. Is it credible? Consider the principles inculcated, e.g. the Deuteronomic denunciations of false prophets, the prohibition of adding aught to the law, the passionate injunctions to teach children. Can it be believed that men of such principles would have been guilty of such conduct? Nemo repente fit turpissimus, says the old maxim; can we suppose that the denunciations of those who prophesy falsely in the name of the Lord proceed from the pen of one who was himself forging in that name? Or can it be that the great majority of Bible readers know so little of truth when they meet it that they cannot detect the ring of unquestionable sincerity in the references of the Deuteronomist to the historical situation? Or can we really believe that documents that originated in such a fashion could have exercised the enormous force for righteousness in the world that these documents have exercised? Ex nihilo nihil. Are literary forgeries a suitable parentage for <a onClick="return mV(\'Gen\',1,\'1-\');">Ge 1</a> or Leviticus or Deuteronomy? Are the great monotheistic ethical religions of the world, with all they have meant, really rooted in nothing better than folly and fraud?<P>(2) The Historical Improbability.<P>A second fundamental consideration is the extraordinary historical improbability that these frauds could have been successfully perpetrated. The narrative in Kings undoubtedly relates the finding of what was regarded as an authentic work. King and people, priests and prophets must have been entirely deceived if the critical theory be true. It is surely possible that Huldah and Jeremiah were better judges than modern critics. Similarly in the case of the Priestly Code (P), if e.g. there had been no Levitical cities or no such laws as to tithes and firstlings as were here contemplated, but entirely different provisions on the subjects, how came the people to accept these forgeries so readily? (See further POT, 257f; 294-97.) It is of course quite easy to carry this argument too far. It cannot be doubted that the exile had meant a considerable break in the historical continuity of the national development; but yet once the two views are understood the choice cannot be difficult. On the critical theory elaborate literary forgeries were accepted as genuine ancient laws; on the conservative theory laws were accepted because they were in fact genuine, and interpreted as far as possible to meet the entirely different requirements of the period. This explains both the action of the people and the divergence between preexilic and post-exilic practice. The laws were the same but the interpretation was different.<P>(3) The Divergence between the Laws and Post-exilic Practice.<P>Thirdly, the entire perversion of the true meaning of the laws in post-exilic times makes the critical theory incredible. Examples have been given (see above,4,(5), (6), and <a href="./study/isbe/search.html?string=PRIESTS+AND+LEVITES">PRIESTS AND LEVITES</a>, passim). It must now suffice to take just one instance to make the argument clear. We must suppose that the author of P deliberately provided that if Levites approached the altar both they and the priests should die (<a onClick="return mV(\'Num\',18,3);">Nu 18:3</a>), because he really desired that they should approach the altar and perform certain services there. We must further suppose that Ezra and the people on reading these provisions at once understood that the legislator meant the exact opposite of what he had said, and proceeded to act accordingly (<a onClick="return mV(\'1Ch\',23,31);">1Ch 23:31</a>). This is only one little example. It is so throughout Pentateuch. Everybody understands that the Tabernacle is really the second Temple and wilderness conditions post-exilic, and everybody acts accordingly. Can it be contended that this view is credible?<P>(4) The Testimony of Tradition.<P>Lastly the uniform testimony of tradition is in favor of Mosaic authenticity—the tradition of Jews, Samaritans and Christians alike. The national consciousness of a people, the convergent belief of Christendom for 18 centuries are not lightly to be put aside. And what is pitted against them? Theories that vary with each fresh exponent, and that take their start from textual corruption, develop through a confusion between an altar and a house, and end in misdating narratives and laws by 8 or 10 centuries! (see above 3 and 4; <a href="./study/isbe/search.html?string=SANCTUARY">SANCTUARY</a>; <a href="./study/isbe/search.html?string=PRIESTS+AND+LEVITES">PRIESTS AND LEVITES</a>).<P>6. The Origin and Transmission of the Pentateuch:<P>If anything at all emerges from the foregoing discussion, it is the impossibility of performing any such analytical feat as the critics attempt. No critical microscope can possibly detect with any reasonable degree of certainty the joins of various sources, even if such sources really exist, and when we find that laws and narratives are constantly misdated by 8 or 10 centuries, we can only admit that no progress at all is possible along the lines that have been followed. On the other hand, certain reasonable results do appear to have been secured, and there are indications of the direction in which we must look for further light.<P>First, then, the Pentateuch contains various notes by later hands. Sometimes the versions enable us to detect and remove those notes, but many are pre-versional. Accordingly, it is often impossible to get beyond probable conjectures on which different minds may differ.<P>Secondly, Genesis contains pre-Mosaic elements, but we cannot determine the scope of these or the number and character of the sources employed, or the extent of the author\'s work.<P>Thirdly, the whole body of the legislation is (subject only to textual criticism) Mosaic. But the laws of Deuteronomy carry with them their framework, the speeches which cannot be severed from them (see SBL, II). The speeches of Deuteronomy in turn carry with them large portions of the narrative of Exodus-Numbers which they presuppose. They do not necessarily carry with them such passages as <a onClick="return mV(\'Exd\',35,\'1-\');">Ex 35</a>; <a onClick="return mV(\'Exd\',36,\'1-\');">36</a>; <a onClick="return mV(\'Exd\',37,\'1-\');">37</a>; <a onClick="return mV(\'Exd\',38,\'1-\');">38</a>; <a onClick="return mV(\'Exd\',39,\'1-\');">39</a> or <a onClick="return mV(\'Num\',1,\'1-\');">Nu 1</a>; <a onClick="return mV(\'Num\',2,\'1-\');">2</a>; <a onClick="return mV(\'Num\',3,\'1-\');">3</a>; <a onClick="return mV(\'Num\',4,\'1-\');">4</a>; <a onClick="return mV(\'Num\',7,\'1-\');">7</a>; <a onClick="return mV(\'Num\',26,\'1-\');">26</a>, but <a onClick="return mV(\'Num\',1,\'1-\');">Nu 1-4</a> contains internal evidence of Mosaic date.<P>At this point we turn to examine certain textual phenomena that throw light on our problem. It may be said that roughly there are two great classes of textual corruption—that which is due to the ordinary processes of copying, perishing, annotating, etc. and that which is due to a conscious and systematic effort to fix or edit a text. In the case of ancient authors, there comes a time sooner or later when scholarship, realizing the corruption that has taken place, makes a systematic attempt to produce, so far as possible, a correct standard text. Instances that will occur to many are to be found in the work of the Massoretes on the Hebrew text, that of Origen and others on the Septuagint, and that of the commission of Peisistratos and subsequently of the Alexandrian critics on Homer. There is evidence that such revisions took place in the case of the Pentateuch. A very important instance is to be found in the chronology of certain portions of Genesis of which three different versions survive, the Massoretic, Samaritan and Septuagintal. Another instance of even greater consequence for the matter in hand is to be found in <a onClick="return mV(\'Exd\',35,\'1-\');">Ex 35</a>; <a onClick="return mV(\'Exd\',36,\'1-\');">36</a>; <a onClick="return mV(\'Exd\',37,\'1-\');">37</a>; <a onClick="return mV(\'Exd\',38,\'1-\');">38</a>; <a onClick="return mV(\'Exd\',39,\'1-\');">39</a>. It is well known that the Septuagint preserves an entirely different edition from that of Massoretic Text (supported in the main by the Samaritan and other VSS). Some other examples have been noticed incidentally in the preceding discussion; one other that may be proved by further research to possess enormous importance may be mentioned. It appears that in the law of the kingdom (<a onClick="return mV(\'Deu\',17,\'1-\');">De 17</a>) and some other passages where the Massoretic and Samaritan texts speak of a hereditary king, the Septuagint knew nothing of such a person (see further PS, 157-68). The superiority of the Septuagint text in this instance appears to be attested by 1 Samuel, which is unacquainted with any law of the kingdom.<P>Thus, we know of at least three recensions, the M, the Samaritan and the Septuagint. While there are many minor readings (in cases of variation through accidental corruption) in which the two last-named agree, it is nevertheless true that in a general way the Samaritan belongs to the same family as the M, while the Septuagint in the crucial matters represents a different textual tradition from the other two (see The Expositor, September 1911, 200-219). How is this to be explained? According to the worthless story preserved in the letter of Aristeas the Septuagint was translated from manuscripts brought from Jerusalem at a date long subsequent to the Samaritan schism. The fact that the Septuagint preserves a recension so different from both Samaritan and (i.e. from the most authoritative Palestinian tradition of the 5th century BC and its lineal descendants) suggests that this part of the story must be rejected. If so, the Septuagint doubtless represents the text of the Pentateuch prevalent in Egypt and descends from a Hebrew that separated from the ancestor of the M before the Samaritan schism. At this point we must recall the fact that in Jeremiah the Septuagint differs rom Massoretic Text more widely than in any other Biblical book, and the current explanation is that the divergence goes back to the times of Jeremiah, his work having been preserved in two editions, an Egyptian and a Babylonian. We may be sure that if the Jews of Egypt had an edition of Jeremiah, they also had an edition of that law to which Jeremiah refers, and it is probable that the main differences between Septuagint and Massoretic Text (with its allies) are due to the two streams of tradition separating from the time of the exile—the Egyptian and the Babylonian. The narrative of the finding of the Book of the Law in the days of Josiah (<a onClick="return mV(\'2Ki\',22,\'1-\');">2Ki 22</a>), which probably refers to Deuteronomy only, suggests that its text at that time depended on the single manuscript found. The phenomena presented by Genesis-Numbers certainly suggest that they too were at one time dependent on a single damaged MS, and that conscious efforts were made to restore the original order—in some cases at any rate on a wrong principle (see especially EPC, 114-38; BS, 1913, 270-90). In view of the great divergences of the Septuagint in <a onClick="return mV(\'Exd\',35,\'1-\');">Ex 35</a>; <a onClick="return mV(\'Exd\',36,\'1-\');">36</a>; <a onClick="return mV(\'Exd\',37,\'1-\');">37</a>; <a onClick="return mV(\'Exd\',38,\'1-\');">38</a>; <a onClick="return mV(\'Exd\',39,\'1-\');">39</a>, it may be taken as certain that in some instances the editing went to considerable lengths.<P>Thus, the history of the Pentateuch, so far as it can be traced, is briefly as follows: The backbone of the book consists of pre-Mosaic sources in Genesis, and Mosaic narratives, speeches and legislation in Exodus-Deuteronomy. To this, notes, archaeological, historical, explanatory, etc., were added by successive readers. The text at one time depended on a single manuscript which was damaged, and one or more attempts were made to repair this damage by rearrangemerit of the material. It may be that some of the narrative chapters, such as <a onClick="return mV(\'Num\',1,\'1-\');">Nu 1-4</a>; <a onClick="return mV(\'Num\',7,\'1-\');">7</a>; <a onClick="return mV(\'Num\',26,\'1-\');">26</a>, were added from a separate source and amplified or rewritten in the course of some such redaction, but on this head nothing certain can be said. Within a period that is attested by the materials that survive, <a onClick="return mV(\'Exd\',35,1);">Ex 35</a>; <a onClick="return mV(\'Exd\',36,\'1-\');">36</a>; <a onClick="return mV(\'Exd\',37,\'1-\');">37</a>; <a onClick="return mV(\'Exd\',38,\'1-\');">38</a>; <a onClick="return mV(\'Exd\',39,\'1-\');">39</a> underwent one or more such redactions. Slighter redactions attested by Samaritan and Septuagint have affected the chronological data, the numbers of the Israelites and some references to post-Mosaic historical events. Further than this it is impossible to go on our present materials.``193';
isbe[6799]='Pentateuch, 3`III. Some Literary Points.<P>1. Style of Legislation:<P>No general estimate of the Pentateuch as literature can or need be attempted. Probably most readers are fully sensible to its literary beauties. Anybody who is not would do well to compare the chapter on Joseph in the Koran (12) with the Biblical narrative. A few words must be said of some of the less obvious matters that would naturally fall into a literary discussion, the aim being rather to draw the reader\'s attention to points that he might overlook.<P>Of the style of the legislation no sufficient estimate can now be formed, for the first requisite of legal style is that it should be clear and unambiguous to contemporaries, and today no judgment can be offered on that head. There is, however, one feature that is of great interest even now, namely, the prevalence in the main of three different styles, each marked by its special adaptation to the end in view. These styles are<P>(1) mnemonic,<P>(2) oratorical, and<P>(3) procedural.<P>The first is familiar in other early legislations. It is lapidary, terse in the extreme, pregnant, and from time to time marked by a rhythm that must have assisted the retention in the memory. Occasionally we meet with parallelism. This is the style of <a onClick="return mV(\'Exd\',21,\'1-\');">Ex 21</a>ff and occasional later passages, such as the judgment in the case of Shelomith\'s son (<a onClick="return mV(\'Lev\',24,10);">Le 24:10</a>). No doubt these laws were memorized by the elders.<P>Secondly, the legislation of Deuteronomy forms part of a speech and was intended for public reading. Accordingly, the laws here take on a distinctly oratorical style. Thirdly, the bulk of the rest of the legislation was intended to remain primarily in the custody of the priests who could certainly write (<a onClick="return mV(\'Num\',6,23);">Nu 6:23</a>). This was taken into account, and the style is not terse or oratorical, but reasonably full. It was probably very clear to those for whom the laws were meant. There are minor varieties of style but these are the most important. (On the whole subject see especially PS, 170-224.)<P>2. The Narrative:<P>What holds good of the laws is also true with certain modifications of the narrative. The style varies with the nature of the subject, occasion and purpose. Thus, the itinerary in <a onClick="return mV(\'Num\',33,\'1-\');">Nu 33</a> is intentionally composed in a style which undoubtedly possesses peculiar qualities when chanted to an appropriate tune. The census lists, etc., appear to be written in a formal official manner, and something similar is true of the lists of the spies in <a onClick="return mV(\'Num\',13,\'1-\');">Nu 13</a>. There is no ground for surprise in this. In the ancient world style varied according to the genre of the composition to a far greater extent than it does today.<P>3. The Covenant:<P>A literary form that is peculiar to the Pentateuch deserves special notice, namely, the covenant document as a form of literature. Many peoples have had laws that were attributed to some deity, but it is only here that laws are presented in the form of sworn agreements entered into with certain formalities between the nation and God. The literary result is that certain portions of the Pentateuch are in the form of a sort of deed with properly articulated parts. This deed would have been ratified by oath if made between men, as was the covenant between Jacob and Laban, but in a covenant with God this is inapplicable, and the place of the jurat is in each case taken by a discourse setting forth the rewards and penalties attached by God to observance and breach of the covenant respectively. The covenant conception and the idea that the laws acquire force because they are terms in an agreement between God and people, and not merely because they were commanded by God, is one of extraordinary importance in the history of thought and in theology, but we must not through absorption in these aspects of the question fail to notice that the conception found expression in a literary form that is unknown elsewhere and that it provides the key to the comprehension of large sections of the Pentateuch, including almost the whole of Deuteronomy (see in detail SBL, chapter ii).<P>4. Order and Rhythm:<P>Insufficient attention has been paid to order and rhythm generally. Two great principles must be borne in mind:<P>(1) in really good ancient prose the artist appeals to the ear in many subtle ways, and<P>(2) in all such prose, emphasis and meaning as well as beauty are given to a great extent by the order of the words. The figures of the old Greek rhetoricians play a considerable part.<P>Thus the figure called kuklos, "the circle," is sometimes used with great skill. In this the clause or sentence begins and ends with the same word, which denotes alike the sound and the thought. Probably the most effective instance—heightened by the meaning, the shortness and the heavy boom of the word—is to be found in <a onClick="return mV(\'Deu\',4,12);">De 4:12</a>, where there is an impressive "circle" with qol, "voice"—the emphasis conveyed by the sound being at least as marked as that conveyed by the sense. This is no isolated instance of the figure; compare e.g. in <a onClick="return mV(\'Num\',32,1);">Nu 32:1</a>, the "circle" with "cattle"; <a onClick="return mV(\'Num\',14,2);">14:2</A> that with "would that we had died." Chiasmus is a favorite figure, and assonances, plays on words, etc., are not uncommon. Such traits often add force as well as beauty to the narrative, as may be seen from instances like <a onClick="return mV(\'Gen\',1,2);">Ge 1:2</a>: tohu wa-bhohu, "waste and void"; <a onClick="return mV(\'Gen\',4,12);">4:12</a>: na\' wa-nadh, "a fugitive and a wanderer"; <a onClick="return mV(\'Gen\',9,6);">9:6</A>: shophekh dam ha-\'adham, ba-\'adham damo, yishshaphekh, literally, "shedding blood-of man, by-man his-blood shall-be-shed"; <a onClick="return mV(\'Num\',14,45);">Nu 14:45</a>: wayyakkum-wayyakkethum, "and smote them and beat them down."<P>The prose of the Pentateuch, except in its more formal and official parts, is closely allied to poetry (compare e.g. the Aeschylean "Sin coucheth at the door" (<a onClick="return mV(\'Gen\',4,7);">Ge 4:7</a>); "The fountains of the great deep (were) broken up, and the windows of heaven were opened" (<a onClick="return mV(\'Gen\',7,11);">Ge 7:11</a>); "how I bare you on eagles\' wings" (<a onClick="return mV(\'Exd\',19,4);">Ex 19:4</a>)). In the oratorical prose of Deuteronomy we find an imagery and a poetical imagination that are not common among great orators. Its rhythm is marked and the arrangement of the words is extraordinarily forcible, especially in such a chapter as <a onClick="return mV(\'Deu\',28,\'1-\');">Deuteronomy 28</a>. It is difficult to convey any idea of how much the book loses in <a href="./study/isbe/search.html?string=ENGLISH+VERSIONS">English Versions of the Bible</a> from the changes of order. Occasionally the rendering does observe the point of the original, e.g. in <a onClick="return mV(\'Deu\',4,36);">De 4:36</a>: "Out of heaven he made thee to hear his voice," and if we consider how strikingly this contrasts with the fiat "He made thee to hear his voice out of heaven," some notion may perhaps be formed of the importance of retaining the order. More frequently, however, the English is false to the emphasis and spirit of the Hebrew. Sometimes, but not always, this is due to the exigencies of English idiom. This is the cardinal fault of the King James Version, which otherwise excels so greatly.<P>IV. The Pentateuch as History.<P>1. Textual Criticism and History:<P>Beyond all doubt, the first duty of any who would use the Pentateuch for historical purposes is to consider the light that textual criticism throws upon it. So many of the impossibilities that are relied upon by those who seek to prove that the book is historically worthless may be removed by the simplest operations of scientific textual criticism, that a neglect of this primary precaution must lead to disastrous consequences. After all, it is common experience that a man who sets out to produce a history—whether by original composition or compilation—does not intentionally make, e.g., a southward march lead to a point northward of the starting-place, or a woman carry an able-bodied lad of 16 or 17 on her shoulder, or a patriarch linger some 80 years on a deathbed. When such episodes are found, the rudiments of historical judgment require that we should first ask whether the text is in order, and if the evidence points to any easy, natural and well-supported solutions of the difficulties, we are not justified in rejecting them without inquiry and denying to the Pentateuch all historical value. It is a priori far more probable that narratives which have come down to us from a date some 3,000 years back may have suffered slightly in transmission than that the Pentateuch was in the first instance the story of a historical wonderland. It is far more reasonable, e.g., to suppose that in a couple of verses of Exodus a corruption of two letters (attested by Aquila) has taken place in the Massoretic Text than that the Pentateuch contains two absolutely inconsistent accounts of the origin of the priesthood (see <a href="./study/isbe/search.html?string=PRIESTS+AND+LEVITES">PRIESTS AND LEVITES</a>). Accordingly, the first principle of any scientific use of the Pentateuch for historical purposes must be to take account of textual criticism.<P>2. Hebrew Methods of Expression:<P>Having discovered as nearly as may be what the author wrote, the next step must be to consider what he meant by it. Here, unfortunately, the modern inquirer is apt to neglect many most necessary precautions. It would be a truism, but for the fact that it is so often disregarded, to say that the whole of a narrative must be carefully read in order to ascertain the author\'s meaning; e.g. how often we hear that <a onClick="return mV(\'Gen\',14,\'1-\');">Ge 14</a> represents Abram as having inflicted a defeat on the enemy with only 318 men (<a onClick="return mV(\'Gen\',14,14);">14:14</A>), whereas from <a onClick="return mV(\'Gen\',14,24);">14:24</a> (compare <a onClick="return mV(\'Gen\',14,13);">14:13</A>) it appears that in addition to these his allies Aner, Eshcol and Mamre (i.e. as we shall see, the inhabitants of certain localities) had accompanied him! Sometimes the clue to the precise meaning of a story is to be found near the end: e.g. in <a onClick="return mV(\'Jos\',22,\'1\');">Jos 22</a> we do not see clearly what kind of an altar the trans-Jordanic tribes had erected (and consequently why their conduct was open to objection) till <a onClick="return mV(\'Gen\',22,28);">22:28</a> when we learn that this was an altar of the pattern of the altar of burnt offering, and so bore not the slightest resemblance to such lawful altars as those of Moses and Joshua (see <a href="./study/isbe/search.html?string=ALTAR">ALTAR</a>; <a href="./study/isbe/search.html?string=SANCTUARY">SANCTUARY</a>). Nor is this the only instance in which the methods of expression adopted cause trouble to some modern readers; e.g. the word "all" is sometimes used in a way that apparently presents difficulties to some minds. Thus in <a onClick="return mV(\'Exd\',9,6);">Ex 9:6</a> it is possible to interpret "all" in the most sweeping sense and then see a contradiction in <a onClick="return mV(\'Exd\',9,19,22);">9:19,22</a>, etc., which recognize that some cattle still existed. Or again the term may be regarded as limited by <a onClick="return mV(\'Exd\',9,3);">9:3</a> to all the cattle in the field.<P>See <a href="./study/isbe/search.html?string=UPPERCASE">ALL</a>.<P>3. Personification and Genealogies:<P>At this point two further idiosyncrasies of the Semitic genius must be noted—the habits of personification and the genealogical tendency; e.g. in <a onClick="return mV(\'Num\',20,\'12-21\');">Nu 20:12-21</a>, Edom and Israel are personified: "thy brother Israel," "Edom came out against him," etc. Nobody here mistakes the meaning. Similarly with genealogical methods of expression. The Semites spoke of many relationships in a way that is foreign to occidental methods. Thus the Hebrew for "30 years old" is "son of 30 years." Again we read "He was the father of such as dwell in tents" (<a onClick="return mV(\'Gen\',4,20);">Ge 4:20</a>). These habits (of personification and genealogical expression of relationships) are greatly extended, e.g. "And Canaan begat Zidon his first-born" (<a onClick="return mV(\'Gen\',10,15);">Ge 10:15</a>). Often this leads to no trouble, yet strangely enough men who will grasp these methods when dealing with <a onClick="return mV(\'Gen\',10,\'1-\');">Genesis 10</a> will claim that <a onClick="return mV(\'Gen\',14,\'1-\');">Genesis 14</a> cannot be historical because localities are there personified and grouped in relationships. Yet if we are to estimate the historical value of the narrative, we must surely be willing to apply. the same methods to one chapter as to another if the sense appears to demand this.<P>See, further, <a href="./study/isbe/search.html?string=UPPERCASE">GENEALOGY</a>.<P>4. Literary Form:<P>A further consideration that is not always heeded is the exigency of literary form; e.g. in <a onClick="return mV(\'Gen\',24,\'1-\');">Ge 24</a> there occurs a dialogue. Strangely enough, an attack has been made on the historical character of Genesis on this ground. It cannot be supposed—so runs the argument—that we have here a literal report of what was said. This entirely ignores the practice of all literary artists. Such passages are to be read as giving a literary presentation of what occurred; they convey a far truer and more vivid idea of what passed than could an actual literal report of the mere words, divorced from the gestures, glances and modulations of the voice that play such an important part in conversation.<P>5. The Sacred Numbers:<P>Another matter is the influence of the sacred numbers on the text; e.g. in <a onClick="return mV(\'Num\',33,\'1-\');">Nu 33</a> the journeys seem designed to present 40 stations and must not be held to exclude camping at other stations not mentioned; <a onClick="return mV(\'Gen\',10,\'1-\');">Ge 10</a> probably contained 70 names in the original text. This is a technical consideration which must be borne in mind, and so, too, must the Hebrew habit of using certain round numbers to express an unspecified time: When, for instance, we read that somebody was 40 or 60 years old, we are not to take these words literally. "Forty years old" often seems to correspond to "after he had reached man\'s estate".<P>See <a href="./study/isbe/search.html?string=NUMBER">NUMBER</a>.<P>6. Habits of Thought:<P>Still more important is it to endeavor to appreciate the habits of thought of those for whom the Pentateuch was first intended, and to seek to read it in the light of archaic ideas. One instance must suffice. Of the many explanations of names few are philologically correct. It is certain that Noah is not connected with the Hebrew for "to comfort" or Moses with "draw out"—even if Egyptian princesses spoke Hebrew. The etymological key will not fit. Yet we must ask ourselves whether the narrator ever thought that it did. In times when names were supposed to have some mystic relation to their bearers they might be conceived as standing also in some mystic relation to events either present or future; it is not clear that the true original meaning of the narratives was not to suggest this in literary form. How far the ancient Hebrews were from regarding names in the same light as we do may be seen from such passages as <a onClick="return mV(\'Exd\',23,20);">Ex 23:20</a>f; <a onClick="return mV(\'Isa\',30,27);">Isa 30:27</a>; see further EPC, 47ff.<P>See also <a href="./study/isbe/search.html?string=NAMES,+PROPER">NAMES, PROPER</a>.<P>7. National Coloring:<P>The Pentateuch is beyond all doubt an intensely national work. Its outlook is so essentially Israelite that no reader could fail to notice the fact, and it is therefore unnecessary to cite proofs. Doubtless this has in many instances led to its presenting a view of history with which the contemporary peoples would not have agreed. It is not to be supposed that the exodus was an event of much significance in the Egypt of Moses, however important it may appear to the Egyptians of today; and this suggests two points. On the one hand we must admit that to most contemporaries the Pentateuchal narratives must have seemed out of all perspective; on the other the course of subsequent history has shown that the Mosaic sense of perspective was in reality the true one, however absurd it may have seemed to the nations of his own day. Consequently in using the Pentateuch for historical purposes we must always apply two standards—the contemporary and the historical. In the days of Moses the narrative might often have looked to the outsider like the attempt of the frog in the fable to attain to the size of an ox; for us, with the light of history upon it, the values are very different. The national coloring, the medium through which the events are seen, has proved to be true, and the seemingly insignificant doings of unimportant people have turned out to be events of prime historical importance.<P>There is another aspect of the national coloring of the Pentateuch to be borne in mind. If ever there was a book which revealed the inmost soul of a people, that book is the Pentateuch. This will be considered in V, below, but for the present we are concerned with its historical significance. In estimating actions, motives, laws, policy—all that goes to make history—character is necessarily a factor of the utmost consequence. Now here we have a book that at every point reveals and at the same t ime grips the national character. Alike in contents and in form the legislation is adapted with the utmost nicety to the nature of the people for which it was promulgated.<P>8. How Far the Pentateuch Is Trustworthy:<P>When due allowance has been made for all the various matters enumerated above, what can be said as to the trustworthiness of the Pentateuchal history? The answer is entirely favorable.<P>(1) Contemporaneous Information.<P>In the first place the discussion as to the dating of the Pentateuch (above, II, 4) has shown that we have in it documents that are in many cases certainly contemporaneous with the matters to which they relate and have been preserved in a form that is substantially original. Thus we have seen that the wording of <a onClick="return mV(\'Gen\',10,19);">Ge 10:19</a> cannot be later than the age of Abraham and that the legislation of the last four books is Mosaic. Now contemporaneousness is the first essential of credibility.<P>(2) Character of Our Informants.<P>Given the fact (guaranteed by the contemporaneousness of the sources) that our informants had the means of providing accurate information if they so desired, we have to ask whether they were truthful and able. As to the ability no doubt is possible; genius is stamped on every page of the Pentateuch. Similarly as to truthfulness. The conscience of the narrators is essentially ethical. This appears of course most strongly in the case of the legislation (compare <a onClick="return mV(\'Lev\',19,11);">Le 19:11</a>) and the attribution of truthfulness to God (<a onClick="return mV(\'Exd\',34,6);">Ex 34:6</a>), but it may readily be detected throughout; e.g. in <a onClick="return mV(\'Gen\',20,12);">Ge 20:12</a> the narrative clearly shows that truthfulness was esteemed as a virtue by the ancient Hebrews. Throughout, the faults of the dramatis personae are never minimized even when the narrator\'s sympathy is with them. Nor is there any attempt to belittle the opponents of Israel\'s heroes. Consider on the one hand the magnanimity of Esau\'s character and on the other the very glaring light that is thrown on the weaknesses of Jacob, Judah, Aaron. If we are taught to know the Moses who prays, "And if not, blot me, I pray thee, out of thy book which thou hast written" (<a onClick="return mV(\'Exd\',32,32);">Ex 32:32</a>), we are also shown his frequent complaints, and we make acquaintance with the hot-tempered manslayer and the lawgiver who disobeyed his God.<P>(3) Historical Genius of the People.<P>Strangely enough, those who desire to discuss the trustworthiness of the Pentateuch often go far afield to note the habits of other nations and, selecting according to their bias peoples that have a good or a bad reputation in the matter of historical tradition, proceed to argue for or against the Pentateuchal narrative on this basis. Such procedure is alike unjust and unscientific. It is unscientific because the object of the inquirer is to obtain knowledge as to the habits of this people, and in view of the great divergences that may be observed among different races the comparative method is clearly inapplicable; it is unjust because this people is entitled to be judged on its own merits or defects, not on the merits or defects of others. Now it is a bare statement of fact that the Jews possess the historical sense to a preeminent degree. Nobody who surveys their long history and examines their customs and practices to this day can fairly doubt that fact. This is no recent development; it is most convincingly attested by the Pentateuch itself, which here, as elsewhere, faithfully mirrors the spirit of the race. What is the highest guaranty of truth, a guaranty to which unquestioning appeal may be made in the firm assurance that it will carry conviction to all who hear? "Remember the days of old, Consider the years of many generations: Ask thy father and he will show thee; Thine elders, and they will tell thee" (<a onClick="return mV(\'Deu\',32,7);">De 32:7</a>). "For ask now of the days that are past, which were before thee, since the day that God created man upon the earth," etc. (<a onClick="return mV(\'Deu\',4,32);">De 4:32</a>). Conversely, the due handing down of tradition is a religious duty: "And it shall come to pass, when your children shall say unto you, What mean ye by this service? that ye shall say," etc. (<a onClick="return mV(\'Exd\',12,26);">Ex 12:26</a>f). "Only take heed to thyself, and keep thy soul diligently, lest thou forget the things which thine eyes saw, and lest they depart from thy heart all the days of thy life; but make them known unto thy children, and thy children\'s children" (<a onClick="return mV(\'Deu\',4,9);">De 4:9</a>). It is needless to multiply quotations. Enough has been said to show clearly the attitude of this people toward history.<P>(4) Good Faith of Deuteronomy.<P>Closely connected with the preceding is the argument from the very obvious good faith of the speeches in Deuteronomy. It is not possible to read the references to events in such a chapter as <a onClick="return mV(\'Deu\',4,\'1-\');">Deuteronomy 4</a> without realizing that the speaker most fully believed the truth of his statements. The most unquestionable sincerity is impressed upon the chapter. The speaker is referring to what he believes with all the faith of which he is capable. Even for those who doubt the Mosaic authenticity of these speeches there can be no doubt as to the writer\'s unquestioning acceptance of the historical consciousness of the people. But once the Mosaic authenticity is established the argument becomes overwhelming. How could Moses have spoken to people of an event so impressive and unparalleled as having happened within their own recollection if it had not really occurred?<P>(5) Nature of the Events Recorded.<P>Another very important consideration arises from the nature of the events recorded. No nation, it has often been remarked, would gratuitously invent a story of its enslavement to another. The extreme sobriety of the patriarchal narratives, the absence of miracle, the lack of any tendency to display the ancestors of the people as conquerors or great personages, are marks of credibility. Many of the episodes in the Mosaic age are extraordinarily probable. Take the stories of the rebelliousness of the people, of their complaints of the water, the food, and so on: what could be more in accordance with likelihood? On the other hand there is another group of narratives to which the converse argument applies. A Sinai cannot be made part of a nation\'s consciousness by a clever story-teller or a literary forger. The unparalleled nature of the events narrated was recognized quite as clearly by the ancient Hebrews as it is today (see <a onClick="return mV(\'Deu\',4,32);">De 4:32</a>ff). It is incredible that such a story could have been made up and successfully palmed off on the whole nation. A further point that may be mentioned in this connection is the witness of subsequent history to the truth of the narrative. Such a unique history as that of the Jews, such tremendous consequences as their religion has had on the fortunes of mankind, require for their explanation causal events of sufficient magnitude.<P>(6) External Corroborations.<P>All investigation of evidence depends on a single principle: "The coincidences of the truth are infinite." In other words, a false story will sooner or later become involved in conflict with ascertained facts. The Biblical narrative has been subjected to the most rigorous cross-examination from every point of view for more than a century. Time after time confident assertions have been made that its falsehood has been definitely proved, and in each case the Pentateuch has come out from the test triumphant. The details will for the most part be found enumerated or referred to under the separate articles. Here it must suffice just to refer to a few matters. It was said that the whole local coloring of the Egyptian scenes was entirely false, e.g. that the vine did not grow in Egypt. Egyptology has in every instance vindicated the minute accuracy of the Pentateuch, down to even the non-mention of earthenware (in which the discolored Nile waters can be kept clean) in <a onClick="return mV(\'Exd\',7,19);">Ex 7:19</a> and the very food of the lower classes in <a onClick="return mV(\'Num\',11,5);">Nu 11:5</a>. It was said that writing was unknown in the days of Moses, but Egyptology and Assyriology have utterly demolished this. The historical character of many of the names has been strengthened by recent discoveries (see e.g. <a href="./study/isbe/search.html?string=JERUSALEM">JERUSALEM</a>; <a href="./study/isbe/search.html?string=AMRAPHEL">AMRAPHEL</a>). From another point of view modern observation of the habits of the quails has shown that the narrative of Numbers is minutely accurate and must be the work of an eyewitness. From the ends of the earth there comes confirmation of the details of the evolution of law as depicted in the Pentateuch. Finally it is worth noting that even the details of some of the covenants in Genesis are confirmed by historical parallels (Churchman,1908,17f).<P>It is often said that history in the true sense was invented by the Greeks and that the Hebrew genius was so intent on the divine guidance that it neglected secondary causes altogether. There is a large measure of truth in this view; but so far as the Pentateuch is concerned it can be greatly overstated.<P>9. The Pentateuch as Reasoned History:<P>One great criticism that falls to be made is entirely in favor of the Hebrew as against some Greeks, namely, the superior art with which the causes are given. A Thucydides would have stated the reasons that induced Pharaoh to persecute the Israelites, or Abraham and Lot to separate, or Korah, Dathan and Abiram and their followers to rebel; but every reader would have known precisely what he was doing and many who can read the material passages of the Pentateuch with delight would have been totally unable to grapple with his presentation of the narrative. The audience is here more unsophisticated and the material presented in more artistic form. In truth, any historian who sat down to compose a philosophical history of the period covered by the Pentateuch would in many instances be surprised at the lavish material it offered to him. A second criticism is more obvious. The writer clearly had no knowledge of the other side of the case. For example, the secondary causes for the defeat near Hormah are plain enough so far as they are internal to the Israelites—lack of morale, discipline and leadership, division of opinion, discouragement produced by the divine disapproval testified by the absence from the army of Moses and the Ark, and the warnings of the former—but the secondary causes on the side of the Amalekites and Canaanites are entirely omitted. Thus it generally happens that we do not get the same kind of view of the events as might be possible if we could have both sides. Naturally this is largely the case with the work of every historian who tells the story from one side only and is not peculiar to the Pentateuch. Thirdly, the object of the Pentateuch is not merely to inform, but to persuade. It is primarily statesmanship, not literature, and its form is influenced by this fact. Seeking to sway conduct, not to provide a mere philosophical exposition of history, it belongs to a different (and higher) category from the latter, and where it has occasion to use the same material puts it in a different way, e.g. by assigning as motives for obeying laws reasons that the philosophic historian would have advanced as causes for their enactment. To some extent, therefore, an attempt to criticize the Pentateuch from the standpoint of philosophic history is an attempt to express it in terms of something that is incommensurable with it.<P>V. The Character of the Pentateuch.<P>1. Hindu Law Books:<P>The following sentences from Maine\'s Early Law and Custom form a suggestive introduction to any consideration of the character of the Pentateuch:<P>"The theory upon which these schools of learned men worked, from the ancient, perhaps very ancient, Apastamba and Gautama to the late Manu and the still later Narada, is perhaps still held by some persons of earnest religious convictions, but in time now buried it affected every walk of thought. The fundamental assumption is that a sacred or inspired literature being once believed to exist, all knowledge is contained in it. The Hindu way of putting it was, and is, not simply that the Scripture is true, but that everything which is true is contained in the Scripture....It is to be observed that such a theory, firmly held during the infancy of systematic thought, tends to work itself into fact. As the human mind advances, accumulating observation and accumulating reflection, nascent philosophy and dawning science are read into the sacred literature, while they are at the same time limited by the ruling ideas of its priestly authors. But as the mass of this literature grows through the additions made to it by successive expositors, it gradually specializes itself, and subjects, at first mixed together under vague general conceptions, become separated from one another and isolated. In the history of law the most important early specialization is that which separates what a man ought to do from what he ought to know. A great part of the religious literature, including the Creation of the Universe, the structure of Heaven, Hell, and the World or Worlds, and the nature of the Gods, falls under the last head, what a man ought to know. Law-books first appear as a subdivision of the first branch, what a man should do. Thus the most ancient books of this class are short manuals of conduct for an Aryan Hindu who would lead a perfect life. They contain much more ritual than law, a great deal more about the impurity caused by touching impure things than about crime, a great deal more about penances than about punishments" (pp. 16-18).<P>It is impossible not to see the resemblances to the Pentateuch that these sentences suggest. Particularly interesting is the commentary they provide on the attitude of Moses toward knowledge: "The secret things belong unto Yahweh our God; but the things that are revealed belong unto us and to our children for ever, that we may do all the words of this law" (<a onClick="return mV(\'Deu\',29,29);">De 29:29</a>).<P>But if the Pentateuch has significant resemblances to other old law books, there are differences that are even more significant.<P>2. Differences:<P>"By an act that is unparalleled in history a God took to Himself a people by means of a sworn agreement. Some words that are fundamental for our purpose must be quoted from the offer; \'Now, therefore, if ye will obey my voice indeed, and keep my covenant, then ye shall be mine own possession from among all peoples: for all the earth is mine: and ye shall be unto me a kingdom of priests and a holy nation.\' The views here expressed dominate the legislation. Holiness—the correlative holiness to which the Israelites must attain because the Lord their God is holy—embraces much that is not germane to our subject, but it also covers the whole field of national and individual righteousness. The duty to God that is laid upon the Israelites in these words is a duty that has practical consequences in every phase of social life. I have already quoted a sentence from Sir Henry Maine in which he speaks of the uniformity with which religion and law are implicated in archaic legislation. There is a stage in human development where life is generally seen whole, and it is to this stage that the Pentateuch belongs. But no other legislation so takes up one department of man\'s life after another and impresses on them all the relationship of God and people. Perhaps nothing will so clearly bring out my meaning as a statement of some of the more fundamental differences between the Pentateuchal legislation and the old Indian law-books which often provide excellent parallels to it. Those to which I desire to draw particular attention are as follows: The Indian law-books have no idea of national (as distinct from individual) righteousness—a conception that entered the world with the Mosaic legislation and has perhaps not made very much progress there since. There is no personal God: hence, His personal interest in righteousness is lacking: hence, too, there can be no relationship between God and people: and while there is a supernatural element in the contemplated results of human actions, there is nothing that can in the slightest degree compare with the Personal Divine intervention that is so often promised in the Pentateuchal laws. The caste system, like Hammurabi\'s class system, leads to distinctions that are always inequitable. The conception of loving one\'s neighbour and one\'s sojourner as oneself are alike lacking. The systematic provisions for poor relief are absent, and the legislation is generally on a lower ethical and moral level, while some of the penalties are distinguished by the most perverted and barbarous cruelty. All these points are embraced in the special relationship of the One God and the peculiar treasure with its resulting need for national and individual holiness" (PS, 330f).<P>3. Holiness:<P>These sentences indicate some of the most interesting of the distinguishing features of the Pentateuch—its national character, its catholic view of life, its attitude toward the Divine, and some at any rate of its most peculiar teachings. It is worth noting that Judaism, the oldest of the religions which it has influenced, attaches particular importance to one chapter, <a onClick="return mV(\'Lev\',19,\'1-\');">Le 19</a>. The keynote of that chapter is the command: \'Holy shall ye be, for holy am I the Lord your God\'—to preserve the order and emphasis of the original words. This has been called the Jew\'s imitatio Dei, though a few moments\' reflection shows that the use of the word "imitation" is here inaccurate. Now this book with this teaching has exercised a unique influence on the world\'s history, for it must be remembered that Judaism, Christianity and Islam spring ultimately from its teachings, and it is impossible to sever it from the history of the "people of the book"—as Mohammed called them. It appears then that it possesses in some unique way both an intensely national and an intensely universal character and a few words must be said as to this.<P>4. The Universal Aspect:<P>The great literary qualities of the work have undoubtedly been an important factor. All readers have felt the fascination of the stories of Genesis. The Jewish character has also counted for much; so again have the moral and ethical doctrines, and the miraculous and unprecedented nature of the events narrated. And yet there is much that might have been thought to militate against the book\'s obtaining any wide influence. Apart from some phrases about all the families of the earth being blessed (or blessing themselves) in the seed of Abraham, there is very little in its direct teaching to suggest that it was ever intended to be of universal application. Possibly these phrases only mean that other nations will use Israel as a typical example of greatness and happiness and pray that they may attain an equal degree of glory and prosperity. Moreover, the Pentateuch provides for a sacrificial system that has long ceased to exist, and a corpus of jural law that has not been adopted by other peoples. Of its most characteristic requirement—holiness—large elements are rejected by all save its own people. Wherein then lies its universal element? How came this the most intensely national of books to exercise a world-wide and ever-growing influence? The reason lies in the very first sentence: "In the beginning God created the heavens and the earth." This doctrine of the unity of an Almighty God is the answer to our question. Teach that there is a God and One Only All-powerful God, and the book that tells of Him acquires a message to all His creatures.<P>5. The National Aspect:<P>Of the national character of the work something has already been said. It is remarkable that for its own people it has in very truth contained life and length of days, for it has been in and through that book that the Jews have maintained themselves throughout their unique history. If it be asked wherein the secret of this strength lies, the answer is in the combination of the national and the religious. The course of history must have been entirely different if the Pentateuch had not been the book of the people long before the Jews became the people of the book.<P>LITERATURE.<P>The current critical view is set forth in vast numbers of books. The following may be mentioned: LOT; Cornill\'s Introduction to the Canonical Books of the Old Testament; Carpenter and Harford-Battersby\'s Hexateuch (a 2nd edition of the Introduction without the text has been published as The Composition of the Hexateuch); the volumes of the ICC, Westminster Comms. and Century Bible. Slightly less thoroughgoing views are put forward in the German Introductions of Konig (1893), Baudissin (1901), Sellin (1910); and Geden, Outlines of Introduction to the Hebrew Bible (1909); Kittel, Scientific Study of the Old Testament (English translation, 1910); Eerdm. has entirely divergent critical views; POT; TMH, I, and W. Moller, Are the Critics Right? and Wider den Bann der Quellenscheidung; Robertson, Early Religion of Israel; Van Hoonacker, Lieu du culte, and Sacerdoce levitique are all much more conservative and valuable. J.H. Raven, Old Testament Intro, gives a good presentation of the most conservative case. The views taken in this article are represented by SBL, EPC, OP, PS, Troelstra, The Name of God, and in some matters, TMH, I.``193';
isbe[6800]='Pentateuch, the Samaritan`sa-mar\'-i-tan:<P><b>I. KNOWLEDGE OF SAMARITAN PENTATEUCH</b><P class="in15">1. In Older Times<P class="in15">2. Revived Knowledge<P><b>II. CODICES AND SCRIPT</b><P class="in15">1. Nablus Roll<P class="in15">2. The Script<P class="in15">3. Peculiarities of Writing<P class="in15">4. The Tarikh<P class="in15">5. The Mode of Pronunciation<P class="in15">6. Age of the Nablus Roll<P><b>III. RELATION OF THE SAMARITAN RECENSION TO THE MASSORETIC TEXT AND TO THE SEPTUAGINT</b><P class="in15">1. Relation to the Massoretic Text: Classification of Differences<P class="in30">(1) Examples of Accidental Variations<P class="in45">(a) Due to Mistakes of Sight<P class="in45">(b) Variations Due to Mistakes of Hearing<P class="in45">(c) Changes Due to Deficient Attention<P class="in30">(2) Intentional<P class="in45">(a) Grammatical<P class="in45">(b) Logical<P class="in45">(c) Doctrinal<P class="in15">2. Relation of Samaritan Recension to Septuagint<P class="in30">(1) Statement of Hypotheses<P class="in30">(2) Review of These Hypotheses<P><b>IV. BEARING ON THE PENTATEUCHAL QUESTION</b><P><b>V. TARGUMS AND CHRONICLE</b><P><b>LITERATURE</b><hr /><P>The existence of a Samaritan community in Nablus is generally known, and the fact that they have a recension of the Pentateuch which differs in some respects from the Massoretic has been long recognized as important.<P>I. Knowledge of Samaritan Pentateuch.<P>1. In Older Times:<P>Of the Greek Fathers Origen knew of it and notes two insertions which do not appear in the Massoretic Text—<a onClick="return mV(\'Num\',13,1);">Nu 13:1</a> and <a onClick="return mV(\'Num\',21,12);">21:12</A>, drawn from <a onClick="return mV(\'Deu\',1,2);">De 1:2</a> and <a onClick="return mV(\'Deu\',2,18);">2:18</A>. Eusebius of Caesarea in his Chronicon compares the ages of the patriarchs before Abraham in the Septuagint with those in the Samaritan Pentateuch and the Massoretic Text. Epiphanius is aware that the Samaritans acknowledged the Pentateuch alone as canonical. Cyril of Jerusalem notes agreement of Septuagint and Samaritan in <a onClick="return mV(\'Gen\',4,8);">Ge 4:8</a>. These are the principal evidences of knowledge of this recension among the Greek Fathers. Jerome notes some omissions in the Massoretic Text and supplies them from the Samaritan Text. The Talmud shows that the Jews retained a knowledge of the Samaritan Pentateuch longer, and speaks contemptuously of the points in which it differs from the Massoretic Text. Since the differences observed by the Fathers and the Talmudists are to be seen in the Samaritan Pentateuch before us, they afford evidence of its authenticity.<P>2. Revived Knowledge:<P>After nearly a millennium of oblivion the Samaritan Pentateuch was restored to the knowledge of Christendom by Pietro de la Valle who in 1616 purchased a copy from the Samaritan community which then existed in Damascus. This copy was presented in 1623 to the Paris Oratory and shortly after published in the Paris Polyglot under the editorship of Morinus, a priest of the Oratory who had been a Protestant. He emphasized the difference between the Massoretic Text and Samaritan Pentateuch for argumentative reasons, in order to prove the necessity for the intervention of the church to settle which was Scripture. A fierce controversy resulted, in which various divines, Protestant and Catholic, took part. Since then copies of this recension have multiplied in Europe and America. All of them may be regarded as copies ultimately of the Nablus roll. These copies are in the form, not of rolls, but of codices or bound volumes. They are usually written in two columns to the page, one being the Targum or interpretation and this is sometimes in Aramaic and sometimes in Arabic. Some codices show three columns with both Targums. There are probably nearly 100 of these codices in various libraries in Europe and America. These are all written in the Samaritan script and differ only by scribal blunders.<P>II. Codices and Script.<P>1. Nablus Roll:<P>The visitor to the Samaritans is usually shown an ancient roll, but only rarely is the most ancient exhibited, and when so exhibited still more rarely is it in circumstances in which it may be examined.<P>Dr. Mills, who spent three months in the Samaritan community, was able to make a careful though interrupted study of it. His description (Nablus and the Modern Samaritans, 312) is that "the roll is of parchment, written in columns, 13 inches deep, and 7 1/2 inches wide. The writing is in a fair hand, rather small; each column contains from 70 to 72 lines, and the whole roll contains 110 columns. The name of the scribe is written in a kind of acrostic, running through these columns, and is found in the Book of Deuteronomy The roll has the appearance of very great antiquity, but is wonderfully well preserved, considering its venerable age. It is worn out and torn in many places and patched with re-written parchment; in many other places, where not torn, the writing is unreadable. It seemed to me that about two-thirds of the original is still readable. The skins of which the roll is composed are of equal size and measure each 25 inches long by 15 inches wide." Dr. Rosen\'s account on the authority of Kraus (Zeitschr. der deulschmorgenl. Gesellsch., XVIII, 582) agrees with this, adding that the "breadth of the writing is a line and the space between is similar." Both observers have noted that the parchment has been written only on the "hair" side. It is preserved in a silk covering enclosed in a silver case embossed with arabesque ornaments.<P>2. The Script:<P>The reader on opening one of the codices of the Samaritan Pentateuch recognizes at once the difference of the writing from the characters in an ordinary Hebrew Bible. The Jews admit that the character in which the Samaritan Pentateuch is written is older than their square character. It is said in the Talmud (Sanhedhrin 21b): "The law at first was given to Israel in \'ibhri letters and in the holy tongue and again by Ezra in the square (\'ashurith) character and the Aramaic tongue. Israel chose for themselves the \'ashurith character and the holy tongue: they left to the hedhyototh ("uncultured") the \'ibhri character and the Aramaic tongue—\'the Cuthaeans are the hedhyototh,\' said Rabbi Chasda." When Jewish hatred of the Samaritans, and the contempt of the Pharisees for them are remembered, this admission amounts to a demonstration. The Samaritan script resembles that on the Maccabean coins, but is not identical with it. It may be regarded as between the square character and the angular, the latter as is seen in the manuscript and the Siloam inscription. Another intermediate form, that found on the Assouan papyri, owes the differences it presents to having been written with a reed on papyrus. As the chronology of these scripts is of importance we subjoin those principally in question.<P>The study of these alphabets. will confirm the statement above made that the Samaritan alphabet is, in evolution, between the square character and the angular, nearer the latter than the former, while the characters of the Assouan papyri are nearer the former than the latter. Another point to be observed is that the letters which resemble each other in one alphabet do not always resemble in another. We can thus, from comparison of the letters liable to be confused, form a guess as to the script in which the document containing the confusion written.<P>3. Peculiarities in Writing:<P>In inscriptions the lapidary had no hesitation, irrespective of syllables, in completing in the next line any word for which he had not sufficient room. Thus, the beginnings and endings of lines were directly under each other, as on the MS. In the papyri the words are not divided, but the scribe was not particular to have the ends of lines directly under each other. The scribe of the square character by use of literae dilatabiles secured this without dividing
