<script type="text/javascript">
isbe = [];

isbe[6701]='Pardon`par\'-d\'n, par\'-dun.`<a href="./study/isbe/search.html?string=FORGIVENESS">FORGIVENESS</a>`1';
isbe[6702]='Pare, (the Nails)`par (\'asah, "to fix," "manipulate"): The word, which in Hebrew has a very wide range of application, and which is of very frequent occurrence in the Hebrew Bible, is found in the above meaning in but one passage of English Versions of the Bible (<a onClick="return mV(\'Deu\',21,12);">De 21:12</a>; see <a href="./study/isbe/search.html?string=NAIL">NAIL</A>). In a similar sense it is found in <a onClick="return mV(\'2Sa\',19,24);">2Sa 19:24</a>, where it is used to express the dressing of the feet anti the trimming of the beard.``1';
isbe[6703]='Parent`par\'-ent.`<a href="./study/isbe/search.html?string=CHILDREN">CHILDREN</a>; <a href="./study/isbe/search.html?string=CRIMES">CRIMES</a>; <a href="./study/isbe/search.html?string=EDUCATION">EDUCATION</a>; <a href="./study/isbe/search.html?string=FAMILY">FAMILY</a>; <a href="./study/isbe/search.html?string=PUNISHMENTS">PUNISHMENTS</a>`1';
isbe[6704]='Park`park (pardec; Septuagint paradeisos; compare Arabic firdaus): "I made me gardens and parks," the King James Version "orchards" (<a onClick="return mV(\'Ecc\',2,5);">Ec 2:5</a>); "Asaph the keeper of the king\'s forest," the Revised Version margin "park" (<a onClick="return mV(\'Neh\',2,8);">Ne 2:8</a>). The same word occurs in <a onClick="return mV(\'Sgs\',4,13);">So 4:13</a>, "Thy shoots are an orchard (the Revised Version margin "paradise") of pomegranates." according to Liddell and Scott, paradeisos occurs first in Xenophon, who always uses it of the parks of Persian kings and noblemen. Like many other quadriliterals the word is undoubtedly of eastern origin. It seems to connote an enclosure. It is used in Septuagint of the Garden of Eden. Compare <a onClick="return mV(\'Luk\',23,43);">Lu 23:43</a>; <a onClick="return mV(\'2Cr\',12,4);">2Co 12:4</a>; <a onClick="return mV(\'Rev\',2,7);">Re 2:7</a>.`<a href="./study/isbe/search.html?string=PARADISE">PARADISE</a>`37';
isbe[6705]='Parlor`par\'-ler: This word in the King James Version, occurring in <a onClick="return mV(\'Jdg\',3,\'20-25\');">Jud 3:20-25</a>; <a onClick="return mV(\'1Sa\',9,22);">1Sa 9:22</a>; <a onClick="return mV(\'1Ch\',28,11);">1Ch 28:11</a>, is in every instance changed in the Revised Version: in Judges into "upper room," in 1 Samuel into "guest-chamber," in 1 Chronicles into "chambers," representing as many Hebrew words.`<a href="./study/isbe/search.html?string=HOUSE">HOUSE</a>`1';
isbe[6706]='Parmashta`par-mash\'-ta (parmashta\'; Septuagint Marmasima, or Marmasimna): One of the sons of Haman (<a onClick="return mV(\'Est\',9,9);">Es 9:9</a>).``1';
isbe[6707]='Parmenas`par\'-me-nas (Parmenas): A Greek name, an abbreviated form of Parmenides. Parmenas was one of "the seven" chosen by the people and appointed by the apostles to superintend the daily distribution to the Christian poor of Jerusalem (<a onClick="return mV(\'Act\',6,5);">Ac 6:5</a>). Tradition states that he was martyred at Philippi, in the reign of Trajan, but his name does not appear again in Scripture.``1';
isbe[6708]='Parnach`par\'-nak (parnakh, "gifted"): Father of Elizaphan, the prince of Zebulun (<a onClick="return mV(\'Num\',34,25);">Nu 34:25</a>).``1';
isbe[6709]='Parosh`pa\'-rosh, par\'-osh (par\'osh, "flea" (leap)): a family that in part returned under Zerubbabel (<a onClick="return mV(\'Ezr\',2,3);">Ezr 2:3</a>; <a onClick="return mV(\'Neh\',7,8);">Ne 7:8</a>), and in part under Ezra (<a onClick="return mV(\'Ezr\',8,3);">Ezr 8:3</a>; there spelt "Pharosh," the King James Version). Some of the family had foreign wives (<a onClick="return mV(\'Ezr\',10,25);">Ezr 10:25</a>). One descendant, Pedaiah (see <a href="./study/isbe/search.html?string=PEDAIAH">PEDAIAH, (3)</A>), helped to rebuild the city walls (<a onClick="return mV(\'Neh\',3,25);">Ne 3:25</a>), and others were among those who "sealed" the covenant of Nehemiah (<a onClick="return mV(\'Neh\',10,1,14);">Ne 10:1,14</a>). In 1Esdras 5:9; 8:30; 9:26, "Phoros."``1';
isbe[6710]='Parousia`pa-roo’-zhi-a:<P><b>I. THE APOSTOLIC DOCTRINE</b><P class="in15">1. Terms<P class="in15">2. Data and Sources<P class="in15">3. Consistency<P class="in15">4. Meaning of the Symbolism<P><b>II. THE TEACHING OF JESUS</b><P class="in15">1. Critical Problems<P class="in15">2. Summary<P class="in15">3. Fall of Jerusalem<P class="in15">4. Time<P><b>III. JOHN’S EVALUATION</b><P class="in15">1. Solution of Problem<P class="in15">2. The Church a Divine Quantity<P><b>LITERATURE</b><hr /><P>I. The Apostolic Doctrine.<P>1. Terms:<P>The Second Coming of Christ (a phrase not found in the Bible) is expressed by the apostles in the following special terms:<P>(1) "Parousia" (parousia), a word fairly common in Greek, with the meaning "presence" (<a onClick="return mV(\'2Cr\',10,10);">2Co 10:10</a>; <a onClick="return mV(\'Phl\',2,12);">Php 2:12</a>). More especially it may mean "presence after absence," "arrival" (but not "return," unless this is given by the context), as in <a onClick="return mV(\'1Cr\',16,17);">1Co 16:17</a>; <a onClick="return mV(\'2Cr\',7,6,7);">2Co 7:6,7</a>; <a onClick="return mV(\'Phl\',1,26);">Php 1:26</a>. And still more particularly it is applied to the Coming of Christ in <a onClick="return mV(\'1Cr\',15,23);">1Co 15:23</a>; <a onClick="return mV(\'1Th\',2,19);">1Th 2:19</a>; <a onClick="return mV(\'1Th\',3,13);">3:13</a>; <a onClick="return mV(\'1Th\',4,15);">4:15</a>; <a onClick="return mV(\'1Th\',5,23);">5:23</a>; <a onClick="return mV(\'2Th\',2,1,8);">2Th 2:1,8</a>; <a onClick="return mV(\'Jam\',5,7,8);">Jas 5:7,8</a>; <a onClick="return mV(\'2Pe\',1,16);">2Pe 1:16</a>; <a onClick="return mV(\'2Pe\',3,4,12);">3:4,12</a>; <a onClick="return mV(\'1Jo\',2,28);">1Joh 2:28</a>—in all 13 times, besides <a onClick="return mV(\'2Th\',2,9);">2Th 2:9</a>, where it denotes the coming of Anti-christ. This word for Christ’s Second Coming passed into the early Patristic literature (Diognetus, vii.6, e.g.), but its use in this sense is not invariable. For instance the word in Ignatius, Philadelphians, ix.2, means the Incarnation. Or the Incarnation is called the first Parousia, as in Justin, Trypho, xiv. But in modern theology it means invariably the Second Coming. Recent archaeological discoveries have explained why the word received such general Christian use in the special sense. In Hellenistic Greek it was used for the arrival of a ruler at a place, as is evidenced by inscriptions in Egypt, Asia Minor, etc. Indeed, in an Epidaurus inscription of the 3rd century BC (Dittenberger, Sylloge (2), Number 803, 34), "Parousia" is applied to a manifestation of Aesculapius. Consequently, the adoption by the Greek-speaking Christians of a word that already contained full regal and even Divine concepts was perfectly natural. (The evidence is well summarized in Deissmann, Light from the Ancient East 3, 372-78, German edition, 281-87.)<P>(2) "Epiphany" epiphaneia), "manifestation," used of the Incarnation in <a onClick="return mV(\'2Ti\',1,10);">2Ti 1:10</a>, but of the Second Coming in <a onClick="return mV(\'2Th\',2,8);">2Th 2:8</a>; <a onClick="return mV(\'1Ti\',6,14);">1Ti 6:14</a>; <a onClick="return mV(\'2Ti\',4,1,8);">2Ti 4:1,8</a>; <a onClick="return mV(\'Tts\',2,13);">Tit 2:13</a>. The word was used like Parousia in Hellenistic Greek to denote the ceremonial arrival of rulers; compare Deissmann, as above.<P>(3) "Apocalypse" apokalupsis), "revelation," denotes the Second Coming in <a onClick="return mV(\'1Cr\',1,7);">1Co 1:7</a>; <a onClick="return mV(\'2Th\',1,7);">2Th 1:7</a>; <a onClick="return mV(\'1Pe\',1,7,13);">1Pe 1:7,13</a>; <a onClick="return mV(\'1Pe\',4,13);">4:13</a>.<P>(4) "Day of the Lord, more or less modified, but referring to Christ in <a onClick="return mV(\'1Cr\',1,8);">1Co 1:8</a>; <a onClick="return mV(\'1Cr\',5,5);">5:5</a>; <a onClick="return mV(\'2Cr\',1,14);">2Co 1:14</a>; <a onClick="return mV(\'Phl\',1,6,10);">Php 1:6,10</a>; <a onClick="return mV(\'Phl\',2,16);">2:16</a>; <a onClick="return mV(\'1Th\',5,2);">1Th 5:2</a>; <a onClick="return mV(\'2Th\',2,2);">2Th 2:2</a>. The phrase is used of the Father in the strict Old Testament sense in <a onClick="return mV(\'Act\',2,20);">Ac 2:20</a>; <a onClick="return mV(\'2Pe\',3,12);">2Pe 3:12</a>; <a onClick="return mV(\'Rev\',1,\'6-14\');">Re 1:6-14</a>, and probably in <a onClick="return mV(\'2Pe\',3,10);">2Pe 3:10</a>. Besides, as in the Old Testament and the intermediate literature, "day of wrath," "last day," or simply "day" are used very frequently.<P>See <a href="./study/isbe/search.html?string=DAY+OF+THE+LORD">DAY OF THE LORD</a>.<P>Of the first three of the above terms, only Parousia is found in the Gospels, 4 times, all in <a onClick="return mV(\'Mat\',24,3,17,37,39);">Mt 24:3,17,37,39</a>, and in the last three of these all in the set phrase "so shall be the Parousia of the Son of Man." As Christ spoke in Aramaic, the use of "Parousia" here is of course due to Matthew’s adoption of the current Greek word.<P>2. Data and Sources:<P>The last of the 4 terms above brings the apostolic doctrine of the Parousia into connection with the eschatology (Messianic or otherwise) of the Old Testament and of the intermediate writings. But the connection is far closer than that supplied by this single term only, for newly every feature in the apostolic doctrine can be paralleled directly from the Jewish sources. The following summary does not begin to give complete references to even such Jewish material as is extant, but enough is presented to show how closely allied are the eschatologies of Judaism and of early Christianity.<P>The end is not to be expected instantly. There are still signs to come to pass (<a onClick="return mV(\'2Th\',2,3);">2Th 2:3</a>), and in especial the determined number of martyrs must be filled up (<a onClick="return mV(\'Rev\',6,11);">Re 6:11</a>; compare 2Esdras 4:35,36). There is need of patience (<a onClick="return mV(\'Jam\',5,7);">Jas 5:7</a>, etc.; compare 2Esdras 4:34; Baruch 83:4). But it is at hand (<a onClick="return mV(\'1Pe\',4,7);">1Pe 4:7</a>; <a onClick="return mV(\'Rev\',1,3);">Re 1:3</a>; <a onClick="return mV(\'Rev\',22,10);">22:10</a>; compare 2Esdras 14:17). "Yet a little while" (<a onClick="return mV(\'Hbr\',10,37);">Heb 10:37</a>), "The night is far spent" (<a onClick="return mV(\'Rom\',13,12);">Ro 13:12</a>), "The Lord is at hand" (<a onClick="return mV(\'Phl\',4,5);">Php 4:5</a>). "We that are alive" expect to see it (<a onClick="return mV(\'1Th\',4,15);">1Th 4:15</a>; <a onClick="return mV(\'1Cr\',15,51);">1Co 15:51</a>; compare Baruch 76:5); the time is shortened henceforth (<a onClick="return mV(\'1Cr\',7,29);">1Co 7:29</a>; compare Baruch 20:1; 2Esdras 4:26, and the commentaries on 1 Corinthians). Indeed, there is hardly time for repentance even (<a onClick="return mV(\'Rev\',22,11);">Re 22:11</a>, ironical), certainly there is no time left for self-indulgence (<a onClick="return mV(\'1Th\',5,3);">1Th 5:3</a>; <a onClick="return mV(\'1Pe\',4,2);">1Pe 4:2</a>; <a onClick="return mV(\'2Pe\',3,11);">2Pe 3:11</a>; <a onClick="return mV(\'Rev\',3,3);">Re 3:3</a>; compare Baruch 83:5), and watchfulness is urgently demanded (<a onClick="return mV(\'1Th\',5,6);">1Th 5:6</a>; <a onClick="return mV(\'Rev\',3,3);">Re 3:3</a>).<P>An outpouring of the Spirit is a sign of the end (<a onClick="return mV(\'Act\',2,17,18);">Ac 2:17,18</a>; compare Testament of the Twelve Patriarchs, Test. <span class="noTag">Levi 18:11</A>; Sib Or 4:46, always after the consummation in the Jewish sources). But the world is growing steadily worse, for the godly and intense trials are coming (passim), although those especially favored may be spared suffering (<a onClick="return mV(\'Rev\',3,10);">Re 3:10</a>; compare Baruch 29:2). This is the beginning of Judgment (<a onClick="return mV(\'1Pe\',4,17);">1Pe 4:17</a>; compare Enoch 99:10). Iniquity increases and false teachers are multiplied (<a onClick="return mV(\'Jud\',1,18);">Jude 1:18</a>; <a onClick="return mV(\'2Pe\',3,3);">2Pe 3:3</a>; <a onClick="return mV(\'2Ti\',3,\'1-\');">2Ti 3</a>, especially <a onClick="return mV(\'2Ti\',3,13);">2Ti 3:13</a>; compare Enoch 80:7; Baruch 70:5; 2Esdras 5:9,10). Above all there is to be an outburst of diabolic malevolence in the antichrist (<a onClick="return mV(\'1Jo\',2,18,22);">1Joh 2:18,22</a>; <a onClick="return mV(\'1Jo\',4,3);">4:3</a>; <a onClick="return mV(\'2Jo\',1,7);">2Joh 1:7</a>; <a onClick="return mV(\'2Th\',2,\'8-10\');">2Th 2:8-10</a>; <a onClick="return mV(\'Rev\',19,19);">Re 19:19</a>; compare Baruch 36:8-10; Sib Or 3:63-70, and see <a href="./study/isbe/search.html?string=ANTICHRIST">ANTICHRIST</a>), who will gather all nations to his ensign (<a onClick="return mV(\'Rev\',19,19);">Re 19:19</a>; <a onClick="return mV(\'2Th\',2,10);">2Th 2:10</a> compare 2Esdras 13:5; Enoch 56). Plagues fall upon men (Rev, passim; compare especially Philo, Execr.), and natural portents occur (<a onClick="return mV(\'Act\',2,19,20);">Ac 2:19,20</a>; Rev, passim; compare 2Esdras 5:4,5; Enoch 80:5-8). But the conversion of the Jews (<a onClick="return mV(\'Rom\',11,26);">Ro 11:26</a>) is brought about by these plagues (<a onClick="return mV(\'Rev\',11,13);">Re 11:13</a>; in the Jewish sources, naturally, conversion of Gentiles, as in Sib Or 3:616-623; Enoch 10:21). Then Christ is manifested and Antichrist is slain or captured (<a onClick="return mV(\'2Th\',2,8);">2Th 2:8</a>; <a onClick="return mV(\'Rev\',19,20);">Re 19:20</a>; compare 2Esdras 13:10,11). In <a onClick="return mV(\'Rev\',20,3);">Re 20:3</a> the Millennium follows (compare 2Esdras 7:28; 12; 34; Baruch 40:3, and often in rabbinical literature; the millennium in Slavic Enoch, chapter 33, is of very dubious existence), but other traces of millennial doctrine in the New Testament are of the vaguest (compare the commentaries to <a onClick="return mV(\'1Cr\',15,24);">1Co 15:24</a>, for instance, especially Schmiedel, J. Weiss, and Lietzmann, and see <a href="./study/isbe/search.html?string=MILLENNIUM">MILLENNIUM</a>). The general resurrection follows (see <a href="./study/isbe/search.html?string=RESURRECTION">RESURRECTION</a> for details).<P>The Father holds the Judgment in <a onClick="return mV(\'Hbr\',10,30);">Heb 10:30</a>; <a onClick="return mV(\'Hbr\',12,23);">12:23</a>; <a onClick="return mV(\'Hbr\',13,4);">13:4</a>; <a onClick="return mV(\'Jam\',4,11,12);">Jas 4:11,12</a>; <a onClick="return mV(\'1Pe\',1,17);">1Pe 1:17</a>; <a onClick="return mV(\'Rev\',14,7);">Re 14:7</a>; <a onClick="return mV(\'Rev\',20,11);">20:11</a>, and probably in <a onClick="return mV(\'Jud\',1,14,15);">Jude 1:14,15</a>. Christ is Judge in <a onClick="return mV(\'Act\',10,42);">Ac 10:42</a>; <a onClick="return mV(\'2Cr\',5,10);">2Co 5:10</a>; <a onClick="return mV(\'2Ti\',4,1);">2Ti 4:1</a>. The two concepts are interwoven in <a onClick="return mV(\'Rom\',14,9,10);">Ro 14:9,10</a>. God mediates judgment through Christ in <a onClick="return mV(\'Act\',17,31);">Ac 17:31</a>; <a onClick="return mV(\'Rom\',2,16);">Ro 2:16</a>, and probably in <a onClick="return mV(\'Rom\',2,\'2-6\');">Ro 2:2-6</a>; <a onClick="return mV(\'Rom\',3,6);">3:6</a>. In 2 Thessalonians Christ appears as the executor of punishment. For similar uncertainties in the Jewish schemes, compare, for instance, 2Esdras 7:33 and Enoch 45:3. For the fate of the wicked see <a href="./study/isbe/search.html?string=ESCHATOLOGY">ESCHATOLOGY</a>; <a href="./study/isbe/search.html?string=HELL">HELL</A>; Paul, rather curiously, has very little to say about this (<a onClick="return mV(\'Rom\',2,3);">Ro 2:3</a>; <a onClick="return mV(\'1Cr\',3,17);">1Co 3:17</a>; <a onClick="return mV(\'2Th\',1,8,9);">2Th 1:8,9</a>). Then all Nature is renewed (<a onClick="return mV(\'Rom\',8,21);">Ro 8:21</a>; Enoch 45:4,5) or completely destroyed (<a onClick="return mV(\'1Cr\',7,31);">1Co 7:31</a>; <a onClick="return mV(\'Hbr\',12,27);">Heb 12:27</a>; <a onClick="return mV(\'Rev\',21,1);">Re 21:1</a>; compare Enoch 1:6; 2Esdras 7:30); by fire in <a onClick="return mV(\'2Pe\',3,10);">2Pe 3:10</a> (compare Sib Or 4:172-177), so as to leave only the eternal verities (<a onClick="return mV(\'Hbr\',12,27);">Heb 12:27</a>; compare 2Esdras 7:30(?)), or to be replaced with a new heaven and a new earth (<a onClick="return mV(\'Rev\',21,1);">Re 21:1</a>; compare Slavic Enoch 33:1-2). And the righteous receive the New Jerusalem (<a onClick="return mV(\'Gal\',4,26);">Ga 4:26</a>; <a onClick="return mV(\'Hbr\',12,22);">Heb 12:22</a>; <a onClick="return mV(\'Rev\',3,12);">Re 3:12</a>; <a onClick="return mV(\'Rev\',21,2,10);">21:2,10</a>; compare Baruch 4:2-6; 2Esdras 7:26).<P>3. Consistency:<P>It is of course possible, as in the older works on dogmatics, to reconcile the slight divergences of the above details and to fit them all into a single scheme. But the propriety of such an undertaking is more than dubious, for the traditional nature of these details is abundantly clear—a tradition that is not due solely to the fact that the Christian and the Jewish schemes have a common Old Testament basis. That the Jewish writers realized that the eschatological details were merely symbolic is made obvious by the contradictions that every apocalypse contains—the contradictions that are the despair of the beginner in apocalyptics. No writer seems to have thought it worth while to reconcile his details, for they were purely figures of dimly comprehended forces. And the Christian symbolism must be interpreted on the same principle. No greater injustice, for instance, could be done Paul’s thought than to suppose he would have been in the least disturbed by John’s interpretation of the Antichrist as many persons and all of them ordinary human beings (<a onClick="return mV(\'1Jo\',2,18,19);">1Joh 2:18,19</a>).<P>4. Meaning of the Symbolism:<P>The symbolism, then, in which the Parousia is described was simply that held by the apostles in their pre-Christian days. This symbolism, to be sure, has been thoroughly purified from such puerilities as the feast on Leviathan and Behemoth of Baruch 29, or the "thousand children" of Enoch 10:17, a fact all the more remarkable as 2nd-century Christianity has enough of this and to spare (e.g. Irenaeus, v.33). What is more important is that the symbolism of the Parousia is simply in the Jewish sources the symbolism of the coming of the Messiah (or of God in such schemes as have no Messiah). Now it is to be observed that among the apostles the Kingdom of God is almost uniformly regarded as a future quantity (<a onClick="return mV(\'1Cr\',6,9,10);">1Co 6:9,10</a>; <a onClick="return mV(\'1Cr\',15,50);">15:50</a>; <a onClick="return mV(\'Gal\',5,21);">Ga 5:21</a>; <a onClick="return mV(\'Eph\',5,5);">Eph 5:5</a>; <a onClick="return mV(\'2Ti\',4,1,18);">2Ti 4:1,18</a>; <a onClick="return mV(\'2Pe\',1,11);">2Pe 1:11</a>; <a onClick="return mV(\'Rev\',11,15);">Re 11:15</a>; <a onClick="return mV(\'Rev\',12,10);">12:10</a>), with a definitely present idea only in <a onClick="return mV(\'Col\',1,13);">Col 1:13</a>. Remembering again that the term "Messiah" means simply "the Bringer of the Kingdom," the case becomes entirely clear. No apostle, of course, ever thought of Christ as anything but the Messiah. But neither did they think of His Messianic work as completed, or, if the most exact terminology be pressed, of the strict Messianic work as done at all. Even the Atonement belonged to the preliminary acts, viewed perhaps somewhat as Enoch 39:6 views the preexistent Messiah’s residence among the "church expectant." This could come to pass more readily as the traditions generally were silent as to what the Messiah was to do before He brought the Kingdom, while they all agreed that He was not to be created only at that moment. Into this blank, especially with the aid of <a onClick="return mV(\'Isa\',53,\'1-\');">Isa 53</a>, etc., our Lord’s earthly life and Passion fitted naturally, leaving the fact of His Second Coming to be identified with the coming of the Messiah as originally conceived.<P>II. The Teaching of Jesus.<P>1. Critical Problems:<P>It will be found helpful, in studying the bitter controversies that have raged around Christ’s teaching about the future, to remember that the apostolic idea of the word "Messiah" is the only definition that the word has; that, for instance, "Messiah" and "Saviour of the world" are not quite convertible terms, or that a redefinition of the Messiah as a moral teacher or an expounder of the will of God does not rest on "spiritualizing" of the term, but on a destruction of it in favor of "prophet." Now the three expressions, "Messianic work," "coming of the Kingdom," and "Parousia" are only three titles for one and the same thing, while the addition of "Son of Man" to them merely involves their being taken in the most transcendental form possible. In fact, this is the state of affairs found in the Synoptists. Christ predicts the coming of the Kingdom. He claims the title of its king (or Regent under the Father). The realization of this expectation He placed on the other side of the grave, i.e. in a glorified state. And in connection with this evidence we find His use of the title Son of Man. From all this the doctrine of the Parousia follows immediately, even apart from the passages in which the regular apocalyptic symbolism is used. The contention may be made that this symbolism in the Gospels has been drawn out of other sources by the evangelists (the so-called "Little Apocalypse" of <a onClick="return mV(\'Mar\',13,\'7-9\');">Mr 13:7-9</a>, <a onClick="return mV(\'Mar\',13,\'14-20\');">14-20</a>,<a onClick="return mV(\'Mar\',13,\'24-27\');">24-27</a>, <a onClick="return mV(\'Mar\',13,\'30-31\');">30-31</a> is the usual point of attack), but, even if the contention could be made out (and agreement in this regard is anything but attained), no really vital part of the case would be touched. Of course, it is possible to begin with the a priori assumption that "no sane man could conceive of himself as an apocalyptic being walking the earth incognito," and to refer to later tradition everything in the Gospels that contradicts this assumption. But then there are difficulties. The various concepts involved are mentioned directly so often that the number of passages to be removed grows alarmingly large. Then the concepts interlock in such a way as to present a remarkably firm resistance to the critical knife; the picture is much too consistent for an artificial product. Thus, there are a number of indirect references (the title on the Cross, the "Palm-Sunday" procession, etc.) that contradict all we know of later growths. And, finally, the most undeterred critic finds himself confronted with a last stubborn difficulty, the unwavering conviction of the earliest church that Christ made the eschatological claims. It is conceivable that the apostles may have misunderstood Christ in other matters, but an error in this central point of all (as the apostles appraised things) is hardly in the realms of critical possibility. On the whole, such an attempt to force a way through the evidence of the documents would seem something surprisingly like the violence done to history by the most perverse of the older dogmatists.<P>2. Summary:<P>The number of relevant passages involved is so large and the critical problems so intricate that any detailed discussion is prohibited here. Moreover, the symbolism presents nothing novel to the student familiar with the usual schemes. Forces of evil increase in the world, the state of the righteous grows harder, distress and natural portents follow, at the climax Christ appears suddenly with His angels, bringing the Kingdom of God, gathers the elect into the Kingdom, and dismisses the wicked into outer darkness (or fire). The Father is the Judge in <a onClick="return mV(\'Mat\',10,32,33);">Mt 10:32,33</a>, but the Son in the parallel <a onClick="return mV(\'Luk\',12,8,9);">Lu 12:8,9</a>, and in <a onClick="return mV(\'Mat\',13,41);">Mt 13:41</a>; <a onClick="return mV(\'Mat\',16,27);">16:27</a>; <a onClick="return mV(\'Mat\',25,32);">25:32</a>; probably in <a onClick="return mV(\'Mat\',24,50);">Mt 24:50</a> parallel <a onClick="return mV(\'Luk\',12,46);">Lu 12:46</a>; <a onClick="return mV(\'Mar\',8,38);">Mr 8:38</a> and its parallel <a onClick="return mV(\'Luk\',9,26);">Lu 9:26</a> are uncertain. At all events, the eternal destiny of each man depends on Christ’s attitude, possibly with the Father’s (invariable) ratification considered.<P>3. Fall of Jerusalem:<P>How far Christ connected the Parousia and the fall of Jerusalem, it is not easy to say. Various sayings of Christ about the future were certainly grouped by the evangelists; compare <a onClick="return mV(\'Mat\',24,\'1-\');">Mt 24</a> with <a onClick="return mV(\'Mar\',13,\'1-\');">Mr 13</a> and <a onClick="return mV(\'Luk\',17,\'20-37\');">Lu 17:20-37</a>; or <a onClick="return mV(\'Luk\',17,31);">Lu 17:31</a> with <a onClick="return mV(\'Mar\',13,15,16);">Mr 13:15,16</a> (noting the inappropriateness of <a onClick="return mV(\'Luk\',17,31);">Lu 17:31</a> in its present context). The critical discussions of <a onClick="return mV(\'Mar\',13,\'1-\');">Mr 13</a> are familiar and those of <a onClick="return mV(\'Luk\',21,\'1-\');">Lu 21</a> (a still more complex problem) only less so. Remembering what the fall of Jerusalem or its immediate prospect would have meant to the apostles, the tendency to group the statements of Christ will be realized. Consequently, not too much stress should be laid on the connection of this with the Parousia, and in no case can the fall of Jerusalem be considered to exhaust the meaning of the Parousia.<P>4. Time:<P>The most debated question is that of the time of the Parousia. Here <a onClick="return mV(\'Mar\',13,30);">Mr 13:30</a> parallel <a onClick="return mV(\'Luk\',21,32);">Lu 21:32</a> parallel <a onClick="return mV(\'Mat\',24,34);">Mt 24:34</a> place it within Christ’s generation, <a onClick="return mV(\'Mar\',9,1);">Mr 9:1</a> parallel <a onClick="return mV(\'Luk\',9,27);">Lu 9:27</a> parallel <a onClick="return mV(\'Mat\',16,28);">Mt 16:28</a> within the lifetime of some of His hearers, <a onClick="return mV(\'Mat\',10,23);">Mt 10:23</a> before all the cities of Judea are closed to Christ’s apostles. (Only the first of these contains any reference to the fall of Jerusalem.) Then there is "ye shall see" of <a onClick="return mV(\'Mar\',14,62);">Mr 14:62</a>; <a onClick="return mV(\'Luk\',13,35);">Lu 13:35</a> parallel <a onClick="return mV(\'Mat\',23,39);">Mt 23:39</a>. Agreeing with this are the exhortations to watchfulness (<a onClick="return mV(\'Mar\',13,\'33-37\');">Mr 13:33-37</a>; <a onClick="return mV(\'Luk\',12,40);">Lu 12:40</a> parallel <a onClick="return mV(\'Mat\',24,44);">Mt 24:44</a>, etc., with many parables, such as the Ten Virgins). Now <a onClick="return mV(\'Mar\',13,32);">Mr 13:32</a> parallel <a onClick="return mV(\'Mat\',24,36);">Mt 24:36</a> do not quite contradict this, for knowledge of the generation is quite consistent with ignorance of the day and hour; "It will be within your generation, but nothing more can be told you, so watch!" The real difficulty lies in <a onClick="return mV(\'Mar\',13,10);">Mr 13:10</a> parallel <a onClick="return mV(\'Mat\',24,14);">Mt 24:14</a>, the necessity of all Gentiles hearing the gospel (<a onClick="return mV(\'Luk\',21,24);">Lu 21:24</a> is hardly relevant). To leave the question here, as most conservative scholars do, is unsatisfactory, for <a onClick="return mV(\'Mar\',13,10);">Mr 13:10</a> is of no deep value for apologetic service and this value is far outweighed by the real contradiction with the other passages. The key, probably, lies in <a onClick="return mV(\'Mat\',10,18);">Mt 10:18</a>, from which <a onClick="return mV(\'Mar\',13,10);">Mr 13:10</a> differs only in insisting on all Gentiles, perhaps with the apostles’ thought that "world" and "Roman Empire" were practically coextensive. With this assumption the data yield a uniform result.<P>III. John’s Evaluatlon.<P>1. Solution of Problem:<P>It appears, then, that Christ predicted that shortly after His death an event would occur of so transcendental a nature that it could be expressed only in the terms of the fullest eschatological symbolism. John has a clear interpretation of this. In place of the long Parousia discourses in the Synoptists, we have, in the corresponding part of the Fourth Gospel, <a onClick="return mV(\'Jhn\',13,\'1-\');">John 13-17</a>, dealing not only with the future in general but concretely with Christ’s coming and the Judgment. Christ indeed came to His own (<a onClick="return mV(\'Jhn\',14,18);">Joh 14:18</a>), and not He only but the Spirit also (<a onClick="return mV(\'Jhn\',14,16);">14:16</a>), and even the Father (<a onClick="return mV(\'Jhn\',14,23);">14:23</A>). When the disciples are so equipped, their presence in the world subjects the world to a continual sifting process of judgment (<a onClick="return mV(\'Jhn\',16,11);">16:11</a>). The fate of men by this process is to be eternally fixed (<a onClick="return mV(\'Jhn\',3,18);">3:18</a>), while the disciples newly made are assured that they have already entered into their eternal condition of blessedness (<a onClick="return mV(\'Jhn\',11,25,26);">11:25,26</A>; <a onClick="return mV(\'Jhn\',5,24);">5:24</A>; <a onClick="return mV(\'Jhn\',10,28);">10:28</a>; <a onClick="return mV(\'Jhn\',17,2,3);">17:2,3</A>). Equally directly the presence of Christ is conceived in <a onClick="return mV(\'Rev\',3,20);">Re 3:20</a>. So in Paul, the glorified Christ has returned to His own to dwell in them (<a onClick="return mV(\'Rom\',8,9,10);">Ro 8:9,10</a>, etc.), uniting them into a body vitally connected with Him (<a onClick="return mV(\'Col\',1,18);">Col 1:18</a>), so supernatural that it is the teacher of ‘angels’ (<a onClick="return mV(\'Eph\',3,10);">Eph 3:10</a>), a body whose members are already in the Kingdom (<a onClick="return mV(\'Col\',1,13);">Col 1:13</a>), who even sit already in heavenly places (<a onClick="return mV(\'Eph\',2,6);">Eph 2:6</a>). The same thought is found in such synoptic passages (<a onClick="return mV(\'Luk\',7,28);">Lu 7:28</a> parallel <a onClick="return mV(\'Mat\',11,11);">Mt 11:11</a>; <a onClick="return mV(\'Luk\',17,21);">Lu 17:21</a>(?); see <a href="./study/isbe/search.html?string=KINGDOM+OF+GOD">KINGDOM OF GOD</A>) as represent the Kingdom as present. Already the eschatological promises were realized in a small group of men, even though they still lacked the transforming influence of the Spirit. Compare the continuous coming of <a onClick="return mV(\'Mat\',26,64);">Mt 26:64</a> (<a onClick="return mV(\'Luk\',22,69);">Lu 22:69</a>).<P>It is on these lines of the church as a supernatural quantity (of course not to be confused with any particular denomination) that the immediate realization of the Parousia promises is to be sought. Into human history has been "injected" a supernatural quantity, through which a Divine Head works, whose reaction on men settles their eternal destiny, and within which the life of heaven is begun definitely.<P>2. The Church a Divine Quantity:<P>The force in this body is felt at the crises of human history, perhaps especially after the catastrophe that destroyed Jerusalem and set Christianity free from the swaddling clothes of the primitive community. This conception of the church as a divine quantity, as, so to speak, a part of heaven extended into earth, is faithful to the essentials of the predictions. Nor is it a rationalization of them, if the idea of the church itself be not rationalized. With this conception all realms of Christian activity take on a transcendental significance, both in life and (especially) death, giving to the individual the confidence that he is building better than he knows, for even the apostles could not realize the full significance of what they were doing. Generally speaking, the details in the symbolism must not be pressed. The purpose of revelation is to minister to life, not to curiosity, and, in teaching of the future, Christ simply taught with the formal language of the schools of the day, with the one change that in the supernatural process He Himself was to be the central figure. Still, the end is not yet. "The hour cometh, in which all that are in the tombs shall hear his voice" (<a onClick="return mV(\'Jhn\',5,28);">Joh 5:28</a>; compare <a onClick="return mV(\'Jhn\',6,40);">Joh 6:40</a>; <a onClick="return mV(\'Jhn\',21,23);">21:23</a>; <a onClick="return mV(\'1Jo\',2,28);">1Joh 2:28</a>). In Christ human destiny is drawing to a climax that can be expressed only in spiritual terms that transcend our conceptions.<P>LITERATURE.<P>This is overwhelming. For the presuppositions, GJV4 (HJP is antiquated); Volz, Judische Eschatologie; Bousset, Religion des Judentums(2). General discussions: Mathews, The Messianic Hope in the New Testament (the best in English); Sanday, The Life of Christ in Recent Research; Holtzmann, Das messianische Bewusstein Jesu (a classic); von Dobschiitz, The Eschatology of the Gospels (popular, but very sound). Eschatological extreme: Schweitzer, The Quest of the Historical Jesus (Von Reimarus zu Wrede), is quite indispensable; Tyrrell, Christianity at the Cross Roads (perverse, but valuable in parts); Loisy, Gospel and the Church (compare his Evangiles synoptiques). Anti-eschatological: Sharman, The Teaching of Jesus about the Future (minute criticism, inadequate premises, some astounding exegesis); Bacon, The Beginnings of Gospel Story (based on Wellhausen). For the older literature see Schweitzer, Sanday, Holtzmann, as above, and compare Fairweather, The Background of the Gospels, and Brown, "Parousia," in HDB, III.`<a href="./study/isbe/search.html?string=ESCHATOLOGY+OF+THE+NEW+TESTAMENT">ESCHATOLOGY OF THE NEW TESTAMENT</a>`48';
isbe[6711]='Parshandatha`par-shan-da\'-tha, par-shan\'-da-tha (parshandatha; Septuagint Pharsan, or Pharsanestan; perhaps from the Persian fratsna-data, "given by prayer"): One of the sons of Haman (<a onClick="return mV(\'Est\',9,7);">Es 9:7</a>).``1';
isbe[6712]='Part`part: "to part" as a verb is no longer in good use (except in a few special phrases, compare <a onClick="return mV(\'Rth\',1,17);">Ru 1:17</a>), but is obscure only in <a onClick="return mV(\'Pro\',18,18);">Pr 18:18</a>, where the meaning is "break up their quarrel" (compare <a onClick="return mV(\'2Sa\',14,6);">2Sa 14:6</a>). the Revised Version (British and American) has not changed the King James Version\'s usage, except (strangely) in <a onClick="return mV(\'1Sa\',30,24);">1Sa 30:24</a>, where "share" is written.`<a href="./study/isbe/search.html?string=PORTION">PORTION</a>`1';
isbe[6713]='Parthians`par\'-thi-anz (Parthoi):<P>1. Country and Early History:<P>A people mentioned in <a onClick="return mV(\'Act\',2,9);">Ac 2:9</a> only, in connection with other strangers present at Jerusalem at Pentecost, from which we infer that they were Jews or proselytes from the regions included in the Parthian empire. This empire stretched from the Euphrates to the confines of India and the Oxus, and for centuries was the rival of Rome, and more than once proved her match on the battlefield. The Parthians are not mentioned in the Old Testament, but are frequently in Josephus, and they had an important connection with the history of the Jews, on account of the large colonies of the latter in Mesopotamia, and the interference of the Parthians in the affairs of Judea, once making it a vassal state.<P>Parthia proper was a small territory to the southeast of the Caspian Sea, about 300 miles long by 120 wide, a fertile though mountainous region, bordering on the desert tract of Eastern Persia. The origin of the Parthians is rather uncertain, though the prevailing opinion is that they were of Scythic stock or of the great Tartar race. We have no reference to them earlier than the time of Darius the Great, but they were doubtless among the tribes subdued by Cyrus, as they are mentioned by Darius as being in revolt. They seem to have remained faithful to the Persians after that, and submitted to Alexander without resistance.<P>2. The Seleucid Kings:<P>Next they came under the rule of the Seleucid kings of Syria, but revolted about 250 BC, in the reign of Antiochus II (Theos), and gained their independence under the lead of Arsaces I who established the dynasty of the Arsacidae, which continued for nearly 5 centuries. His capital was Hecatompylos, but his reign continued only about 3 years, and his brother Tridates succeeded him as Arsaces II and he consolidated the kingdom. The war between the Seleucids and the Ptolemies freed him from interference from that quarter until 237 BC, when Seleucus II (Callinicus) marched against him, but was completely defeated, and Parthian independence was secured. Artabanus I, who followed him, extended his dominions westward to the Zagros Mountains, but Antiochus III would not permit such an encroachment with impunity, and led an expedition against him, driving him back and even invading his ancestral dominion. But after a struggle of some years the Parthians remained still unsubdued, and the difficulties of the contest led Antiochus to conclude peace with him in which he acknowledged the independence of Parthia. For about a quarter of a century the king of Parthia remained quiet, but Phraates I (181-174 BC) recommenced aggressions on the Seleucid empire which Were continued by Mithridates I (174-137), who added to his dominions a part of Bactria, on the east, and Media, Persia and Babylonia on the west. This was a challenge to Demetrius II, of Syria, to whose empire the provinces belonged, and he marched against him with a large force, but was defeated and taken prisoner. He remained in Parthia some years, well treated by Phraates II, whose sister he married, and, when Phraates wished to create a diversion against Antiochus Sidetes, he set Demetrius at liberty and sent him back to Syria. Antiochus was at first successful, as his force of 300,000 men far outnumbered the Parthians, but he was at last defeated and slain in 129 BC and his army destroyed. This was the last attempt of the Seleucid kings to subdue Parthia, and it was acknowledged as the dominant power in Western Asia. But Phraates fell in conflict with the Scyths, whom he called in to aid him in his war with Sidetes, and his successor likewise, and it was only on the accession of Mithridates in 124 BC that these barbarians were checked. The king then turned his attention toward Armenia, which he probably brought under his control, but its king Tigranes recovered its independence and even attacked the Parthians, and took from them two provinces in Mesopotamia.<P>3. In Contact with Rome:<P>Not long after, the power of Rome came into contact with armenia and Parthia. In 66 BC when, after subduing Mithridates of Pontus, Pompey came into Syria, Phraates III made an alliance with him against Armenia, but was offended by the way in which he was treated and thought of turning against his ally, but refrained for the time being. It was only a question of time when the two powers would come to blows, for Parthia had become an empire and could ill brook the intrusion of Rome into Western Asia. It was the ambition and greed of Crassus that brought about the clash of Rome and Parthia. When he took the East as his share of the Roman world as apportioned among the triumvirs, he determined to rival Caesar in fame and wealth by subduing Parthia, and advanced across the Euphrates on his ill-fated expedition in 53 BC. The story of his defeat and death and the destruction of the army and loss of the Roman eagles is familiar to all readers of Roman history. It revealed Parthia to the world as the formidable rival of Rome, which she continued to be for nearly 3 centuries. After the death of Crassus, the Parthians crossed the Euphrates and ravaged Northern Syria, but retired the following year without securing any portion of the country, and thus ended the first war with Rome. In 40 BC, after the battle of Philippi, Pacorus, who was then king, invaded Syria a second time and took possession of it together with all Palestine, Tyre alone escaping subjection. He set Antigonus on the throne of Judea, deposing Hyrcanus for the purpose. Syria and Palestine remained in the hands of Parthia for 3 years, but the coming of Ventidius gave a new turn to affairs. He drove the Parthians out of Syria, and when they returned the following year, he defeated them again and Pacorus was slain. Parthia had to retire within her own borders and remain on the defensive. Antony\'s attempt to subdue them proved abortive, and his struggle with Octavian compelled him to relinquish the project. The Parthians were unable to take advantage of the strife in the Roman empire on account of troubles at home. an insurrection led by Tiridates drove the king Phraates IV from the throne, but he recovered it by the aid of the Scyths, and Tiridates took refuge in Syria with the youngest son of the king. Augustus afterward restored him without ransom, and obtained the lost standards of Crassus, and thus peace was established between the rival empires. Each had learned to respect the power of the other, and, although contention arose regarding the suzerainty of armenia, peace was not seriously disturbed between them for about 130 years, or until the reign of Trajan. Parthia was not at peace with herself, however. Dynastic troubles were frequent, and the reigns of the kings short. Artabanus III, who reigned 16-42 AD, was twice expelled from his kingdom and twice recovered his throne. In his days occurred a terrible massacre of Jewish colonists in Mesopotamia, as narrated by Josephus (Ant., XVIII, ix). The contest with Rome over Armenia was settled in the days of Nero in a manner satisfactory to both parties, so that peace was not broken for 50 years. The ambition of Trajan led him to disregard the policy inaugurated by Augustus, adhered to, for the most part, by succeeding emperors, not to extend the limits of the empire. After the conquest of Dacia he turned his attention to the East and resolved on the invasion of Parthia. The Parthian king, Chosroes, endeavored to placate Trajan by an embassy bearing presents and proposals of peace, but Trajan rejected them and carried out his purpose. He subdued armenia, took Upper Mesopotamia, Adiabebe (Assyria), Ctesiphon, the capital, and reached the Pets Gulf, but was obliged to turn back by revolts in his rear and failed to reduce the fortress of Hatra. The conquered provinces were restored, however, by Hadrian, and the Parthians did not retaliate until the reign of Aurelius, when they overran Syria, and in 162 AD Lucius Verus was sent to punish them. In the following year he drove them back and advanced into the heart of the Parthian empire, inflicting the severest blow it had yet received. It was evident that the empire was on the decline, and the Romans did not meet with the resistance they had experienced in former times. Severus and Caracalla both made expeditions into the country, and the latter took the capital and massacred the inhabitants, but after his assassination his successor, Macrinus, fought a three days\' battle with the Parthians at Nisibis in which he was worsted and was glad to conclude a peace by paying an indemnity of some 1,500,000 British pounds (217 AD).<P>4. Fall of the Empire:<P>But this was the last achievement of the Parthians. It is evident that Artabanus had suffered severely in his conflict with the Romans, and was unable to put down the revolt of the Persians under the lead of Artaxerxes, who overthrew the Parthian empire and established the dynasty of the Sassanidae in its place (226 AD).<P>5. Culture:<P>The Parthians were not a cultured people, but displayed a rude magnificence, making use, to some extent, of remains of Greek culture which they found within the regions they seized from the empire of Alexander. They had no native literature, as far as known, but made use of Greek in writing and on their coins. They were familiar with Hebrew or Syro-Chaldaic, and the later kings had Semitic legends on their coins. Josephus is said to have written his history of the Jewish War in his native tongue for Parthian readers. In their method of government they seem to have left the different provinces pretty much to themselves, so long as they paid tribute and furnished the necessary contingents.``138';
isbe[6714]='Particular, Particularly`pir-tik\'-u-lar, par-tik\'-u-lar-li: The adverbial phrase "in particular" occurs twice in the King James Version (<a onClick="return mV(\'1Cr\',12,27);">1Co 12:27</a>, ek merous, the Revised Version (British and American) "severally," the Revised Version margin "each in his part"; and <a onClick="return mV(\'Eph\',5,33);">Eph 5:33</a>, hoi kath\' hena, the Revised Version (British and American) "severally"); in both cases it has the obsolete meaning of "severally," "individually." The adverb "particularly" occurs in the same sense in <a onClick="return mV(\'Act\',21,19);">Ac 21:19</a> the King James Version, kath\' hen hekaston, the Revised Version (British and American) "one by one," and <a onClick="return mV(\'Hbr\',9,5);">Heb 9:5</a> the King James Version, kata meros, the Revised Version (British and American) "severally." We have the plural noun in the sense of "details" in 2Macc 2:30: "to be curious in particulars"; 11:20, (the King James Version "Of the particulars I have given order," the Revised Version (British and American) I have given order in detail); and the adjective "particular" in the sense of "special" in the first Prologue to Sirach (King James Version, Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) peculiares; the whole section was omitted in the Revised Version (British and American)).``49';
isbe[6715]='Partition, the Middle Wall of`par-tish\'-un, par-tish\'-un (to mesotoichon tou phragmou (<a onClick="return mV(\'Eph\',2,14);">Eph 2:14</a>)):<P>1. The Barrier in the Temple<P>What Paul here asserts is that Christ is our peace, the peace of both Jewish and Gentile believers. He has made them both to be one in Himself, and has broken down the middle wall of partition which divided them from one another. Then the apostle regards Jew and Gentile as two, who by a fresh act of creation in Christ are made into one new man. In the former of these similes he refers to an actual wall in the temple at Jerusalem, beyond which no one was allowed to pass unless he were a Jew, the balustrade or barrier which marked the limit up to which a Gentile might advance but no farther. Curiously, this middle wall of partition had a great deal to do with Paul\'s arrest and imprisonment, for the multitude of the Jews became infuriated, not merely because of their general hostility to him as an apostle of Christ and a preacher of the gospel for the world, but specially because it was erroneously supposed that he had brought Trophimus the Ephesian past this barrier into the temple (<a onClick="return mV(\'Act\',21,29);">Ac 21:29</a>), and that he had in this manner profaned the temple (<a onClick="return mV(\'Act\',24,6);">Ac 24:6</a>), or, as it is put in <a onClick="return mV(\'Act\',21,28);">Ac 21:28</a>, he had \'brought Greeks into the temple and polluted this holy place.\' In the assault which they thereupon made on Paul they violently seized and dragged him out of the temple-dragged him outside the balustrade. The Levites at once shut the gates, to prevent the possibility of any further profanation, and Paul would have been torn in pieces, had not the Roman commander and his soldiers forcibly prevented.<P>2. Herod\'s Temple; Its Divisions; the Courts:<P>In building the temple Herod the Great had enclosed a large area to form the various courts. The temple itself consisted of the two divisions, the Holy Place, entered by the priests every day, and the Holy of Holies into which the high priest entered alone once every year. Immediately outside the temple there was the Court of the Priests, and in it was placed the great altar of burnt offering. Outside of this again was the Court of the Sons of Israel, and beyond this the Court of the Women. The site of the temple itself and the space occupied by the various courts already mentioned formed a raised plateau or platform. "From it you descended at various points down 5 steps and through gates in a lofty wall, to find yourself overlooking another large court—the outer court to which Gentiles, who desired to see something of the glories of the temple and to offer gifts and sacrifices to the God of the Jews, were freely admitted. Farther in than this court they were forbidden, on pain of death, to go. The actual boundary line was not the high wall with its gates, but a low stone barrier about 5 ft. in height, which ran round at the bottom of 14 more steps" (J. Armitage Robinson, D.D., Paul\'s Epistle to the Ephesians, 59; see also Edersheim, The Temple, Its Ministry and Services as They Were at the Time of Jesus Christ, 46).<P>The middle wall of partition was called Coregh, and was built of marble beautifully ornamented.<P>3. The Court of the Gentiles:<P>The Court of the Gentiles formed the lowest and the outermost enclosure of all the courts of the sanctuary. It was paved with the finest variegated marble. Its name signified that it was open to all, Jews or Gentiles alike. It was very large, and is said by Jewish tradition to have formed a square of 750 ft. It was in this court that the oxen and sheep and the doves for the sacrifices were sold as in a market. It was in this court too that there were the tables of the money-changers, which Christ Himself overthrew when He drove out the sheep and oxen and them that bought and sold in His Father\'s house. The multitudes assembling in this court must have been very great, especially on occasions such as the Passover and Pentecost and at the other great feasts, and the din of voices must oftentimes have been most disturbing. As already seen, beyond this court no Gentile might go.<P>See <a href="./study/isbe/search.html?string=TEMPLE">TEMPLE</a>.<P>In the year 1871, while excavations were being made on the site of the temple by the Palestine Exploration Fund, M. Clermont-Ganneau discovered one of the pillars which Josephus describes as having been erected upon the very barrier or middle wall of partition, to which Paul refers. This pillar is now preserved in the Museum at Constantinople and is inscribed with a Greek inscription in capital or uncial letters, which is translated as follows:<P class="in15">NO MAN OF ANOTHER NATION<br>TO ENTER WITHIN THE FENCE AND<br>ENCLOSURE ROUND THE TEMPLE,<br>AND WHOEVER IS CAUGHT WILL<br>HAVE HIMSELF TO BLAME THAT<br>HIS DEATH ENSUES<P>While Paul was writing the Epistle to the Ephesians at Rome, this barrier in the temple at Jerusalem was still standing, yet the chained prisoner of Jesus Christ was not afraid to write that Christ had broken down the middle wall of partition, and had thus admitted Gentiles who were far off, strangers and foreigners, to all the privileges of access to God in ancient times possessed by Israel alone; that separation between Jew and Gentile was done away with forever in Christ.<P>4. The Throwing Down of the Barrier:<P>If Paul wrote the Epistle to the Ephesians in 60 or 61 AD, then the actual barrier of stone remained in its position in the Court of the Gentiles not more than some 10 years, for it was thrown down in the burning of the temple by the Roman army. And out of those ruins a fragment has been excavated in our own day, containing the very inscription threatening death to the Gentile intruder, and reminding us that it is only in Christ Jesus that we now draw nigh unto God, and that we are thus one body in Christ, one new man. Christ has broken down the middle wall of partition, for He, in His own person, is our peace.``155';
isbe[6716]='Partridge`par\'-trij (qore; Latin perdix; Septuagint, <a onClick="return mV(\'1Sa\',26,20);">1Sa 26:20</a>, nuktikorax, "owl," <a onClick="return mV(\'Jer\',17,11);">Jer 17:11</a>, perdix): a bird of the family Tetraonidae. The Hebrew word for this bird, qore\', means "a caller," and the Latin perdix is supposed to be an imitation of its cry, and as all other nations base their name for the bird on the Latin, it becomes quite evident that it was originally named in imitation of its call. The commonest partridge of Palestine, very numerous in the wilderness and hill country, was a bird almost as large as a pheasant. It had a clear, exquisite cry that attracted attention, especially in the mating season. The partridge of the wilderness was smaller and of beautifully marked plumage. It made its home around the Dead Sea, in the Wilderness of Judea and in rocky caverns. Its eggs were creamy white; its cry very similar to its relatives\'. The partridge and its eggs were used for food from time immemorial.<P>The first reference to it is found in <a onClick="return mV(\'1Sa\',26,20);">1Sa 26:20</a>: "Now therefore, let not my blood fall to the earth away from the presence of Yahweh: for the king of Israel is come out to seek a flea, as when one doth hunt a partridge in the mountains." David in this dialogue with Saul clearly indicates that if he did not hunt the partridge himself, he knew how it was done. The birds were commonly chased up the mountains and stunned or killed with "throw sticks." David knew how deft these birds were at hiding beside logs and under dry leaves colored so like them as to afford splendid protection; how swiftly they could run; what expert dodgers they were; so he compared taking them with catching a flea. The other reference is found in <a onClick="return mV(\'Jer\',17,11);">Jer 17:11</a>: "As the partridge that sitteth on eggs which she hath not laid, so is he that getteth riches, and not by right; in the midst of his days they shall leave him, and at his end he shall be a fool." If this reference is supposed to indicate that partridges are in the habit of brooding on the nest of their kind or of different birds, it fails wholly to take into consideration the history of the bird. Partridges select a location, carefully deposit an egg a day for from 10 to 15 days, sometimes 20, and then brood, so that all the young emerge at one time. But each bird knows and returns to its nest with unfailing regularity. It would require the proverbial "Philadelphia lawyer" to explain this reference to a "partridge sitting on eggs she had not laid." No ornithologist ever could reconcile it to the habits or characteristics of the birds. the King James Version translated these lines, "As the partridge sitteth on eggs, and hatcheth them not." This was easy to explain clearly. The eggs of the partridge were delicious food, and any brooding bird whose nest was discovered after only a few days of incubation did not hatch, because she lost her eggs. Also the eggs frequently fall prey to other birds or small animals. Again, they are at the mercy of the elements, sometimes being spoiled by extremely wet cold weather. Poultry fanciers assert that a heavy thunder storm will spoil chicken eggs when hatchingtime is close; the same might be true with eggs of the wild. And almost any wild bird will desert its nest and make its former brooding useless, if the location is visited too frequently by man or beast.<P>There is also a partridge reference in the Book of Ecclesiasticus 11:29ff the Revised Version (British and American)): "Bring not every man into thine house; for many are the plots of the deceitful man. As a decoy partridge in a cage, so is the heart of a proud man; and as one that is a spy, he looketh upon thy falling. For he lieth in wait to turn things that are good into evil; and in things that are praiseworthy he will lay blame." The reference is to confining a tame partridge in a hidden cage so that its calls would lure many of its family within range of arrows or "throw sticks" used by concealed hunters.``167';
isbe[6717]='Paruah`pa-roo\'-a (paruach "blooming"): Father of Jehoshaphat, who was one of Solomon\'s twelve victualers or providers, and had charge in Isaachar of this function (<a onClick="return mV(\'1Ki\',4,17);">1Ki 4:17</a>).``1';
isbe[6718]='Parvaim`par-va\'-im (parwayim; Septuagint Pharouaim): The word occurs only in <a onClick="return mV(\'2Ch\',3,6);">2Ch 3:6</a>, as the place from which Solomon obtained gold for the decoration of his Temple. A derivation is given from the Sanskrit purva, "eastern," so that the name might be a vague term for the East (Gesenius, Thesaurus, 1125). Whether there was such a place in arabia is doubtful. Farwa in Yemen has been suggested, and also Saq el Farwain in Yemamah. Some have considered the name a shortened form of Cepharvayim which occurs in the Syriac and Targum Jonathan for the "Sephar" of <a onClick="return mV(\'Gen\',10,30);">Ge 10:30</a>.``63';

isbe[6720]='Pasach`pa\'-sak (pacakh, "divider"): Son of Japhlet, descendant of Asher (<a onClick="return mV(\'1Ch\',7,33);">1Ch 7:33</a>).``1';
isbe[6721]='Paseah`pa-se\'-a, pas\'-e-a (paceach "limping"):<P>(1) A son of Eshton, descendant of Judah (<a onClick="return mV(\'1Ch\',4,12);">1Ch 4:12</a>).<P>(2) The eponym of a family of Nethinim (<a onClick="return mV(\'Ezr\',2,49);">Ezr 2:49</a>; <a onClick="return mV(\'Neh\',7,51);">Ne 7:51</a>, the King James Version "Phaseah" equals "Phinoe" (1Esdras 5:31).<P>(3) Father of Joiada, who helped to repair the old gate (<a onClick="return mV(\'Neh\',3,6);">Ne 3:6</a>).``1';
isbe[6722]='Pashhur, Pashur`pash\'-hur, pash\'-ur (pashchur, "splitter," "cleaver"): The name of several persons difficult to individuate:<P>(1) A priest, son of Immer, and "chief governor in the house of the Lord" (<a onClick="return mV(\'Jer\',20,1);">Jer 20:1</a>), who persecuted Jeremiah, putting him in "the stocks" hard by the "house of Yahweh" in the "gate of Benjamin" (<a onClick="return mV(\'Jer\',20,2);">Jer 20:2</a>). When released, Jeremiah pronounced Divine judgment on him and the people. Future captivity and an exile\'s death are promised to Pashur whose name he changed from its masterful significance to a cowering one. "Terror on every side" (maghor miccabhibh) is to take the place of "stable strength" (<a onClick="return mV(\'Jer\',20,3);">Jer 20:3</a>).<P>(2) Son of Melchiah, a prince of Judah, and one of the delegation sent by Zedekiah, the king, to consult Jeremiah (<a onClick="return mV(\'Jer\',21,1);">Jer 21:1</a>). It looks like a larger and later deputation, similarly sent, to which this Pashur belongs, whose record is given in <a onClick="return mV(\'Jer\',38,\'1-13\');">Jer 38:1-13</a>. Accompanying them was one, Gedaliah, who was a son of (3).<P>(3) Another Pashur (<a onClick="return mV(\'Jer\',38,1);">Jer 38:1</a>), who may be the person mentioned in <a onClick="return mV(\'1Ch\',9,12);">1Ch 9:12</a>; <a onClick="return mV(\'Neh\',11,12);">Ne 11:12</a>.<P>(4) A priest, of those who "sealed" Nehemiah\'s covenant (<a onClick="return mV(\'Neh\',10,1,3);">Ne 10:1,3</a>), who may, however, be the same as (5).<P>(5) The chief of a priestly family called "sons of Pashur" (<a onClick="return mV(\'Ezr\',2,38);">Ezr 2:38</a>; <a onClick="return mV(\'Ezr\',10,22);">10:22</a>; <a onClick="return mV(\'Neh\',7,41);">Ne 7:41</a>; 1Esdras 5:25 ("Phassurus," margin "Pashhur"); 1Esdras 9:22 ("Phaisur," margin "Pashhur")). Doubtless it is this Pashur, some of whose sons had "strange wives" (<a onClick="return mV(\'Ezr\',10,22);">Ezr 10:22</a>).``186';
isbe[6723]='Pass, Passage, Passenger`pas, pas\'-aj, pas\'-en-jer: "To pass" bears different meanings and corresponds to various words in Hebrew and Greek. It occurs frequently in the phrase "and it came to pass" (literally, "and it was"). This is simply a Hebrew idiom linking together the different paragraphs of a continuous narrative. As a rule "pass" renders the Hebrew word \'abhar. This verb has various meanings, e.g. "to pass over" a stream (<a onClick="return mV(\'Gen\',31,21);">Ge 31:21</a>); "to cross" a boundary (<a onClick="return mV(\'Num\',20,17);">Nu 20:17</a>); "to pass through," or "traverse," a country (<a onClick="return mV(\'Num\',21,22);">Nu 21:22</a>); "to pass on" (<a onClick="return mV(\'Gen\',18,5);">Ge 18:5</a>); "to pass away," "cease to exist" (<a onClick="return mV(\'Job\',30,15);">Job 30:15</a>). The word is used metaphorically, "to pass over," "overstep," "transgress" (<a onClick="return mV(\'Num\',14,41);">Nu 14:41</a>). In the causative form the verb is used in the phrase "to cause to pass through fire" (<a onClick="return mV(\'Deu\',18,10);">De 18:10</a>; <a onClick="return mV(\'2Ki\',16,3);">2Ki 16:3</a>). In the King James Version "pass" sometimes has the force of "surpass," "exceed," e.g. <a onClick="return mV(\'2Ch\',9,22);">2Ch 9:22</a>, "King Solomon passed all the kings of the earth in riches and wisdom"; compare also <a onClick="return mV(\'Eph\',3,19);">Eph 3:19</a>, "the love of Christ which passeth knowledge," and <a onClick="return mV(\'Phl\',4,7);">Php 4:7</a>, "the peace of God, which passeth all understanding."<P>Passage in the King James Version renders ma\'abhar, or ma\'abharah. The former word denotes (1) the ford of a river (<a onClick="return mV(\'Gen\',32,23);">Ge 32:23</a> King James Version margin); (2) the pass of a mountain range (<a onClick="return mV(\'1Sa\',13,23);">1Sa 13:23</a>). In the only other instance of the use of the shorter form (<a onClick="return mV(\'Isa\',30,32);">Isa 30:32</a> margin), the King James Version renders "where the grounded staff shall pass." A more correct translation would be, "and every sweep (or stroke) of the appointed staff." The longer form bears both meanings, namely, "ford" (e.g. <a onClick="return mV(\'Jos\',2,7);">Jos 2:7</a>; <a onClick="return mV(\'Jdg\',3,28);">Jud 3:28</a>, etc.) and "pass" (<a onClick="return mV(\'1Sa\',14,4);">1Sa 14:4</a>; <a onClick="return mV(\'Isa\',10,29);">Isa 10:29</a>). In <a onClick="return mV(\'Jos\',22,11);">Jos 22:11</a>, the rendering \'towards the region opposite the children of Israel\' would be more correct than the King James Version, "at the passage of the children of Israel." In English Versions of the Bible of <a onClick="return mV(\'Num\',20,21);">Nu 20:21</a> "passage" seems to mean "right of way," and renders the infinitive of the Hebrew verb. In <a onClick="return mV(\'Jer\',22,20);">Jer 22:20</a> the King James Version the word rendered "passage" should be translated "from Abarim" (as in the Revised Version (British and American)), a mountain range in Moab, northeast of the Dead Sea.<P>Passenger in the King James Version means a "passer-by." In <a onClick="return mV(\'Eze\',39,11,14,15);">Eze 39:11,14,15</a> where the word occurs 4 times in the King James Version, the Revised Version (British and American) translates "them that pass through."``103';
