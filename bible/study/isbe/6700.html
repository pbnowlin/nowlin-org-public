isbe[6726]='Passion, Passions`pash\'-un, pash\'-unz: "Passion" is derived from Latin passio, which in turn is derived from the verb patior, with the root, pat-. The Latin words are connected with the Greek root, path-, which appears in a large number of derivatives. And in Greek, Latin, and English (with other languages in addition) words connected with this root, pat-, path-, are often susceptible of a great variety of meanings, for which the dictionaries must be consulted. For "passion," however, as it appears in English Versions of the Bible, only three of these meanings need be considered.<P>(1) Close to what seems to be the primary force of the root is the meaning "suffer," and in this sense "passion" is used in <a onClick="return mV(\'Act\',1,3);">Ac 1:3</a>, "to whom he also showed himself alive after his passion." This translation is a paraphrase (Greek: "after he had suffered"), due to the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) (post passionem suam), and in English is as old as Wycliff, whom the subsequent English Versions of the Bible has followed. This is the only case in the King James Version and the Revised Version (British and American) where "passion" has this meaning, and it can be so used in modern English only when referring (as here) to the sufferings of Christ (compare "Passion play").<P>(2) "Suffering," when applied to the mind, came to denote the state that is controlled by some emotion, and so "passion" was applied to the emotion itself. This is the meaning of the word in <a onClick="return mV(\'Act\',14,15);">Ac 14:15</a>, "men of like passions," and <a onClick="return mV(\'Jam\',5,17);">Jas 5:17</a>, "a man of like passions," Greek homoiopathes; the Revised Version margin "of like nature" gives the meaning exactly: "men with the same emotions as we."<P>(3) From "emotion" a transition took place to "strong emotion," and this is the normal force of "passion" in modern English the King James Version does not use this meaning, but in the Revised Version (British and American) "passion" in this sense is the translation of pathos, in its three occurrences: <a onClick="return mV(\'Rom\',1,26);">Ro 1:26</a> (the King James Version "affection"); <a onClick="return mV(\'Col\',3,5);">Col 3:5</a> (the King James Version "inordinate affection"); <a onClick="return mV(\'1Th\',4,5);">1Th 4:5</a> (the King James Version "lust").<P>It is used also for two occurrences of pathema (closely allied to pathos) in <a onClick="return mV(\'Rom\',7,5);">Ro 7:5</a> (the King James Version "motions," the King James Version margin "passions") and in <a onClick="return mV(\'Gal\',5,24);">Ga 5:24</a> (the King James Version "affection"). The fixing of the exact force in any of these cases is a delicate problem fully discussed in the commentaries. In <a onClick="return mV(\'Col\',3,5);">Col 3:5</a> only does "passion" stand as an isolated term. The context here perhaps gives the word a slight sexual reference, but this must not be overstressed; the warning probably includes any violent over-emotion that robs a man of his self-control.`<a href="./study/isbe/search.html?string=AFFECTION">AFFECTION</a>; <a href="./study/isbe/search.html?string=MOTION">MOTION</a>`48';
isbe[6727]='Passover`pas\'-o-ver (pecach, from pacach, "to pass" or "spring over" or "to spare" (<a onClick="return mV(\'Exd\',12,13,23,27);">Ex 12:13,23,27</a>; compare <a onClick="return mV(\'Isa\',31,5);">Isa 31:5</a>. Other conjectures connect the word with the "passing over" into a new year, with assyr pasahu, meaning "to placate," with Hebrew pacah, meaning "to dance," and even with the skipping motions of a young lamb; Aramaic paccha\', whence Greek Pascha; whence English "paschal." In early Christian centuries folk-etymology connected pascha with Greek pascho, "to suffer" (see <a href="./study/isbe/search.html?string=PASSION">PASSION</A>), and the word was taken to refer to Good Friday rather than the Passover):<P>1. Pecach and Matstsoth<P>2. Pecach mitsrayim<P>3. Pecach doroth<P>4. Matstsoth<P>5. The \'Omer<P>6. Non-traditional Theories<P>7. The Higher Criticism<P>8. Historical Celebrations: Old Testament Times<P>9. Historical Celebrations: New Testament Times<P>10. The Jewish Passover<hr /><P>1. Pecach and Matstsoth:<P>The Passover was the annual Hebrew festival on the evening of the 14th day of the month of \'Abhibh (Abib) or Nisan, as it was called in later times. It was followed by, and closely connected with, a 7 days\' festival of matstsoth, or unleavened bread, to which the name Passover was also applied by extension (<a onClick="return mV(\'Lev\',23,5);">Le 23:5</a>). Both were distinctly connected with the Exodus, which, according to tradition, they commemorate; the Passover being in imitation of the last meal in Egypt, eaten in preparation for the journey, while Yahweh, passing over the houses of the Hebrews, was slaying the firstborn of Egypt (<a onClick="return mV(\'Exd\',12,12);">Ex 12:12</a>f; <a onClick="return mV(\'Exd\',13,2,12);">13:2,12</a>); the matstsoth festival being in memory of the first days of the journey during which this bread of haste was eaten (<a onClick="return mV(\'Exd\',12,\'14-20\');">Ex 12:14-20</a>).<P>2. Pecach mitsrayim:<P>The ordinance of pecach mitsrayim, the last meal in Egypt, included the following provisions:<P>(1) the taking of a lamb, or kid without blemish, for each household on the 10th of the month;<P>(2) the killing of the lamb on the 14th at even;<P>(3) the sprinkling of the blood on doorposts and lintels of the houses in which it was to be eaten;<P>(4) the roasting of the lamb with fire, its head with its legs and inwards—the lamb was not to be eaten raw nor sodden (bashal) with water;<P>(5) the eating of unleavened bread and bitter herbs;<P>(6) eating in haste, with loins girded, shoes on the feet, and staff in hand;<P>(7) and remaining in the house until the morning;<P>(8) the burning of all that remained; the Passover could be eaten only during the night (<a onClick="return mV(\'Exd\',12,\'1-23\');">Ex 12:1-23</a>).<P>3. Pecach doroth:<P>This service was to be observed as an ordinance forever (<a onClick="return mV(\'Exd\',12,14,24);">Ex 12:14,24</a>), and the night was to be lel shimmurim, "a night of vigils," or, at least, "to be much observed" of all the children of Israel throughout their generations (<a onClick="return mV(\'Exd\',12,42);">Ex 12:42</a>). The details, however, of the pecach doroth, or later observances of the Passover, seem to have differed slightly from those of the Egyptian Passover (Mishna, Pesachim, ix.5). Thus, it is probable that the victim could be taken from the flock or from the herd (<a onClick="return mV(\'Deu\',16,2);">De 16:2</a>; compare <a onClick="return mV(\'Eze\',45,22);">Eze 45:22</a>). (3), (6) and (7) disappeared entirely, and judging from <a onClick="return mV(\'Deu\',16,7);">De 16:7</a>, the prohibition against seething (Hebrew bashal) was not understood to apply (unless, indeed, the omission of the expression with water" gives a more general sense to the Hebrew word bashal, making it include roasting). New details were also added: for example, that the Passover could be sacrificed only at the central sanctuary (<a onClick="return mV(\'Deu\',16,5);">De 16:5</a>); that no alien or uncircumcised person, or unclean person could partake thereof, and that one prevented by uncleanness or other cause from celebrating the Passover in season could do so a month later (<a onClick="return mV(\'Num\',9,9);">Nu 9:9</a>). The singing of the Hallel (<a onClick="return mV(\'Psa\',113,\'1-\');">Psalms 113-118</a>), both while the Passover was being slaughtered and at the meal, and other details were no doubt added from time to time.<P>4. Matstsoth:<P>Unleavened bread was eaten with the Passover meal, just as with all sacrificial meals of later times (<a onClick="return mV(\'Exd\',23,18);">Ex 23:18</a>; <a onClick="return mV(\'Exd\',34,25);">34:25</a>; <a onClick="return mV(\'Lev\',7,12);">Le 7:12</a>), independently perhaps of the fact that the Passover came in such close proximity with the Feast of Unleavened Bread (<a onClick="return mV(\'Exd\',12,8);">Ex 12:8</a>). Jewish tradition distinguishes, at any rate, between the first night and the rest of the festival in that the eating of matstsoth is an obligation on the first night and optional during the rest of the week (Pesachim 120a), although the eating of unleavened bread is commanded in general terms (<a onClick="return mV(\'Exd\',12,15,18);">Ex 12:15,18</a>; <a onClick="return mV(\'Exd\',13,6,7);">13:6,7</a>; <a onClick="return mV(\'Exd\',23,15);">23:15</a>; <a onClick="return mV(\'Exd\',34,18);">34:18</a>; <a onClick="return mV(\'Lev\',23,6);">Le 23:6</a>; <a onClick="return mV(\'Num\',28,17);">Nu 28:17</a>). The eating of leavened bread is strictly prohibited, however, during the entire week under the penalty of kareth, "excision" (<a onClick="return mV(\'Exd\',12,15,19);">Ex 12:15,19</a>f; <a onClick="return mV(\'Exd\',13,3);">13:3</a>; <a onClick="return mV(\'Deu\',16,3);">De 16:3</a>), and this prohibition has been observed traditionally with great care. The 1st and 7th days are holy convocations, days on which no labor could be done except such as was necessary in the preparation of food. The festival of matstsoth is reckoned as one of the three pilgrimage festivals, though strictly the pilgrimage was connected with the Passover portion and the first day of the festival.<P>During the entire week additional sacrifices were offered in the temple: an offering made by fire and a burnt offering, 2 young bullocks, 1 ram, 7 lambs of the first year without blemish, together with meal offerings and drink offerings and a goat for a sin offering.<P>5. The \'Omer:<P>During the week of the matstsoth festival comes the beginning of the barley harvest in Palestine (Menachoth 65b) which lasts from the end of March in the low Jordan valley to the beginning of May in the elevated portions. The time of the putting-in of the sickle to the standing grain (<a onClick="return mV(\'Deu\',16,9);">De 16:9</a>) and of bringing the sheaf of the peace offering is spoken of as the morrow after the Sabbath (<a onClick="return mV(\'Lev\',23,15);">Le 23:15</a>), that is, according to the Jewish tradition, the day after the first day, or rest-day, of the Passover (Mend. 65b; Meg Ta\'an. 1; Josephus, Ant, III, x, 5), and according to Samaritan and Boethusian traditions and the modern Karites the Sunday after the Passover. At this time a wave offering is made of a sheaf, followed by an offering of a lamb with a meal and drink offering, and only thereafter might the new grain be eaten. From this day 7 weeks are counted to fix the date of Pentecost, the celebration connected with the wheat harvest. It is of course perfectly natural for an agricultural people to celebrate the turning-points of the agricultural year in connection with their traditional festivals. Indeed, the Jewish liturgy of today retains in the Passover service the Prayer of Dew (Tal) which grew up in Palestine on the basis of the needs of an agricultural people.<P>6. Non-traditional Theories:<P>Many writers, however, eager to explain the entire festival as originally an agricultural feast (presumably a Canaanitic one, though there is not a shred of evidence that the Canaanites had such a festival), have seized upon the \'omer, or sheaf offering, as the basis of the hagh (festival), and have attempted to explain the matstsoth as bread hastily baked in the busy harvest times, or as bread quickly baked from the freshly exempted first-fruits. Wherein these theories are superior to the traditional explanation so consistently adhered to throughout the Pentateuch it is difficult to see. In a similar vein, it has been attempted to connect the Passover with the sacrifice or redemption of the firstborn of man and beast (both institutions being traditionally traced to the judgment on the firstborn of Egypt, as in <a onClick="return mV(\'Exd\',13,\'11-13\');">Ex 13:11-13</a>; <a onClick="return mV(\'Exd\',22,29,30);">22:29,30</a>; <a onClick="return mV(\'Exd\',23,19);">23:19</a>; <a onClick="return mV(\'Exd\',34,19,20);">34:19,20</a>), so as to characterize the Passover as a festival of pastoral origin. Excepting for the multiplication of highly ingenious guesses, very little that is positive has been added to our knowledge of the Passover by this theory.<P>7. The Higher Criticism:<P>The Pentateuch speaks of the Passover in many contexts and naturally with constantly varying emphasis. Thus the story of the Exodus it is natural to expect fewer ritual details than in a manual of temple services; again, according to the view here taken, we must distinguish between the pecach mitsrayim and the pecach doroth. Nevertheless, great stress is laid on the variations in the several accounts, by certain groups of critics, on the basis of which they seek to support their several theories of the composition of the Pentateuch or Hexateuch. Without entering into this controversy, it will be sufficient here to enumerate and classify all the discrepancies said to exist in the several Passover passages, together with such explanations as have been suggested. These discrepancies, so called, are of three kinds:<P>(1) mere omissions,<P>(2) differences of emphasis, and<P>(3) conflicting statements.<P>The letters, J, E, D, P and H will here be used to designate passages assigned to the various sources by the higher criticism of today merely for the sake of comparison.<P>(1) There is nothing remarkable about the omission of the daily sacrifices from all passages except <a onClick="return mV(\'Lev\',23,8);">Le 23:8</a> (H) and <a onClick="return mV(\'Num\',28,19);">Nu 28:19</a> (P), nor in the omission of a specific reference to the holy convocation on the first day in the contexts of <a onClick="return mV(\'Deu\',16,8);">De 16:8</a> and <a onClick="return mV(\'Exd\',13,6);">Ex 13:6</a>, nor even in the omission of reference to a central sanctuary in passages other than <a onClick="return mV(\'Deu\',16,\'1-\');">De 16</a>. Neither can any significance be attached to the fact that the precise day is not specified in <a onClick="return mV(\'Exd\',23,\'1-\');">Ex 23</a> (E) where the appointed day is spoken of, and in <a onClick="return mV(\'Lev\',23,15);">Le 23:15</a> (H) where the date can be figured out from the date of Pentecost there given.<P>(2) As to emphasis, it is said that the socalled Elohist Covenant (E) (<a onClick="return mV(\'Exd\',23,\'1-\');">Ex 23</a>) has no reference to the Passover, as it speaks only of matstsh in <a onClick="return mV(\'Exd\',23,15);">Ex 23:15</a>, in which this festival is spoken of together with the other reghalim or pilgrimage festivals. The so-called Jehovistic source (Jahwist) (<a onClick="return mV(\'Exd\',34,\'18-21\',25);">Ex 34:18-21,25</a>) is said to subordinate the Passover to matstsoth, the great feast of the Jehovistic history (JE) (<a onClick="return mV(\'Exd\',12,\'21-27\',\'29-36\',38,39);">Ex 12:21-27,29-36,38,39</a>; <a onClick="return mV(\'Exd\',13,\'3-16\');">13:3-16</a>); in Deuteronomy (D) the Passover is said to predominate over matstsoth, while in Leviticus (P and H) it is said to be of first importance. JE and P emphasize the historical importance of the day. Whether these differences in emphasis mean much more than that the relative amount of attention paid to the paschal sacrifice, as compared with matstsoth, depends on the context, is of course the fundamental question of the higher criticism; it is not answered by pointing out that the differences of emphasis exist.<P>(3) Of the actual conflicts, we have already seen that the use of the words "flock" and "herd" in Deuteronomy and Hebrew bashal are open to explanation, and also that the use of the matstsoth at the original Passover is not inconsistent with the historical reason for the feast of matstsoth—it is not necessary to suppose that matstsoth were invented through the necessity of the Hebrews on their journey. There is, however, one apparent discrepancy in the Biblical narrative that seems to weaken rather than help the position of those critics who would ascribe very late dates to the passages which we have cited: Why does Ezekiel\'s ideal scheme provide sacrifices for the Passover different from those prescribed in the so-called P ascribed to the same period (<a onClick="return mV(\'Eze\',45,21);">Eze 45:21</a>)?<P>8. Historical Celebrations: Old Testament Times:<P>The children of Israel began the keeping of the Passover in its due season according to all its ordinances in the wilderness of Sinai (<a onClick="return mV(\'Num\',9,5);">Nu 9:5</a>). In the very beginning of their national life in Palestine we find them celebrating the Passover under the leadership of Joshua in the plains of Jericho (<a onClick="return mV(\'Jos\',5,10);">Jos 5:10</a>). History records but few later celebrations in Palestine, but there are enough intimations to indicate that it was frequently if not regularly observed. Thus Solomon offered sacrifices three times a year upon the altar which he had built to Yahweh, at the appointed seasons, including the Feast of Unleavened Bread (<a onClick="return mV(\'1Ki\',9,25);">1Ki 9:25</a> equals <a onClick="return mV(\'2Ch\',8,13);">2Ch 8:13</a>). The later prophets speak of appointed seasons for pilgrimages and sacrifices (compare <a onClick="return mV(\'Isa\',1,\'12-14\');">Isa 1:12-14</a>), and occasionally perhaps refer to a Passover celebration (compare <a onClick="return mV(\'Isa\',30,29);">Isa 30:29</a>, bearing in mind that the Passover is the only night-feast of which we have any record). In Hezekiah\'s time the Passover had fallen into such a state of desuetude that neither the priests nor the people were prepared for the king\'s urgent appeal to observe it. Nevertheless, he was able to bring together a large concourse in Jerusalem during the 2nd month and institute a more joyful observance than any other recorded since the days of Solomon. In the 18th year of King Josiah, however, there was celebrated the most memorable Passover, presumably in the matter of conformity to rule, since the days of the Judges (<a onClick="return mV(\'2Ki\',23,21);">2Ki 23:21</a>; <a onClick="return mV(\'2Ch\',35,1);">2Ch 35:1</a>). The continued observance of the feast to the days of the exile is attested by Ezekiel\'s interest in it (<a onClick="return mV(\'Eze\',45,18);">Eze 45:18</a>). In post-exilic times it was probably observed more scrupulously than ever before (<a onClick="return mV(\'Ezr\',6,19);">Ezr 6:19</a>).<P>9. Historical Celebrations: New Testament Times:<P>Further evidence, if any were needed, of the importance of the Passover in the life of the Jews of the second temple is found in the Talmud, which devotes to this subject an entire tractate, Pecachim on which we have both Babylonian and Palestine gemara\'. These are devoted to the sacrificial side and to the minutiae of searching out and destroying leaven, what constitutes leaven, and similar questions, instruction in which the children of Israel sought for 30 days before the Passover. Josephus speaks of the festival often (Ant., II, xiv, 6; III, x, 5; IX, iv, 8; XIV, ii, 2; XVII, ix, 3; BJ, II, i, 3; V, iii, 1; VI, ix, 3). Besides repeating the details already explained in the Bible, he tells of the innumerable multitudes that came for the Passover to Jerusalem out of the country and even from beyond its limits. He estimates that in one year in the days of Cestius, 256,500 lambs were slaughtered and that at least 10 men were counted to each. (This estimate of course includes the regular population of Jerusalem. But even then it is doubtless exaggerated.) The New Testament bears testimony, likewise, to the coming of great multitudes to Jerusalem (<a onClick="return mV(\'Jhn\',11,55);">Joh 11:55</a>; compare also <a onClick="return mV(\'Jhn\',2,13);">Joh 2:13</a>; <a onClick="return mV(\'Jhn\',6,4);">6:4</a>). At this great festival even the Roman officers released prisoners in recognition of the people\'s celebration. Travel and other ordinary pursuits were no doubt suspended (Compare <a onClick="return mV(\'Act\',12,3);">Ac 12:3</a>; <a onClick="return mV(\'Act\',20,6);">20:6</a>). Naturally the details were impressed on the minds of the people and lent themselves to symbolic and homiletic purposes (compare <a onClick="return mV(\'1Cr\',5,7);">1Co 5:7</a>; <a onClick="return mV(\'Jhn\',19,\'34-36\');">Joh 19:34-36</a>, where the paschal lamb is made to typify Jesus; and <a onClick="return mV(\'Hbr\',11,28);">Heb 11:28</a>). The best-known instance of such symbolic use is the institution of the Eucharist on the basis of the paschal meal. Some doubt exists as to Whether the Last Supper was the paschal meal or not. According to the Synoptic Gospels, it was (<a onClick="return mV(\'Luk\',22,7);">Lu 22:7</a>; <a onClick="return mV(\'Mat\',26,17);">Mt 26:17</a>; <a onClick="return mV(\'Mar\',14,12);">Mr 14:12</a>); while according to John, the Passover was to be eaten some time following the Last Supper (<a onClick="return mV(\'Jhn\',18,28);">Joh 18:28</a>). Various harmonizations of these passages have been suggested, the most in genious, probably, being on theory that when the Passover fell on Friday night, the Pharisees ate the meal on Thursday and the Sadducees on Friday, and that Jesus followed the custom of the Pharisees (Chwolson, Das letzte Passahmal Jesu, 2nd edition, Petersburg, 1904). Up to the Nicene Council in the year 325, the church observed Easter on the Jewish Passover. Thereafter it took precautions to separate the two, condemning their confusion as Arianism.<P>10. The Jewish Passover:<P>After the destruction of the temple the Passover became a home service. The paschal lamb was no longer included. Only the Samaritans have continued this rite to this day. In the Jewish home a roasted bone is placed on the table in memory of the rite, and other articles symbolic of the Passover are placed beside it: such as a roasted egg, said to be in memory of the free-will offering; a sauce called charoceth, said to resemble the mortar of Egypt; salt water, for the symbolic dipping (compare <a onClick="return mV(\'Mat\',26,23);">Mt 26:23</a>); the bitter herbs and the matstsoth. The cedher (program) is as follows: sanctification; washing of the hands; dipping and dividing the parsley; breaking and setting aside a piece of matstsah to be distributed and eaten at the end of the supper; reading of the haggadhah shel pecach, a poetic narrative of the Exodus, in answer to four questions asked by the youngest child in compliance with the Biblical command found 3 times in Exodus and once in Deuteronomy, "Thou shalt tell thy son on that day"; washing the hands for eating; grace before eating; tasting the matstsah; tasting the bitter herbs; eating of them together; the meal; partaking of the matstsah that had been set aside as \'aphiqomen or dessert; grace after meat; Hallel; request that the service be accepted. Thereafter folk-songs are sung to traditional melodies, and poems recited, many of which have allegorical meanings. A cup of wine is used at the sanctification and another at grace, in addition to which two other cups have been added, the 4 according to the Mishna (Pecachim x.1) symbolizing the 4 words employed in <a onClick="return mV(\'Exd\',6,6,7);">Ex 6:6,7</a> for the delivery of Israel from Egypt. Instead of eating in haste, as in the Egyptian Passover, it is customary to recline or lean at this meal in token of Israel\'s freedom.<P>The prohibition against leaven is strictly observed. The searching for hidden leaven on the evening before the Passover and its destruction in the morning have become formal ceremonies for which appropriate blessings and declarations have been included in the liturgy since the days when Aramaic was the vernacular of the Jews. As in the case of other festivals, the Jews have doubled the days of holy convocation, and have added a semi-holiday after the last day, the so-called \'iccur chagh, in token of their love for the ordained celebration and their loathness to depart from it.``81';
isbe[6728]='Pastor`pas\'-ter (ro\'eh; poimen; literally, a helper, or feeder of the sheep (the King James Version <a onClick="return mV(\'Jer\',2,8);">Jer 2:8</a>; <a onClick="return mV(\'Jer\',3,15);">3:15</a>; <a onClick="return mV(\'Jer\',10,21);">10:21</a>; <a onClick="return mV(\'Jer\',12,10);">12:10</a>; <a onClick="return mV(\'Jer\',17,16);">17:16</a>; <a onClick="return mV(\'Jer\',22,22);">22:22</a>; <a onClick="return mV(\'Jer\',23,1,2);">23:1,2</a>, and in <a onClick="return mV(\'Eph\',4,11);">Eph 4:11</a>, the King James Version and the Revised Version (British and American))): Besides the literal sense the word has now a figurative meaning and refers to the minister appointed over a congregation. This latter meaning is recognized in the translation of the King James Version.`<a href="./study/isbe/search.html?string=MINISTRY">MINISTRY</a>`1';
isbe[6729]='Pastoral Epistles`pas\'-tor-al,<P><b>I. GENUINENESS</b><P class="in15">1. External Evidence<P class="in15">2. Genuineness Questioned<P><b>II. ALLEGED DIFFICULTIES AGAINST PAULINE AUTHORSHIP</b><P class="in15">1. Relative to Paul\'s Experiences<P class="in30">(1) Data in 1 Timothy<P class="in30">(2) Data in 2 Timothy<P class="in30">(3) Data in Titus<P class="in15">2. Subject-Matter Post-Pauline <P class="in30">(1) Difficulty Regarding Church Organization<P class="in30">(2) The Doctrinal Difficulty<P class="in30">3. Difficulty Relative to Language<P class="in15">4. Is There "Another Gospel" in the Pastorals?<P><b>III. DATE AND ORDER</b><P class="in15">1. Date of the Epistles<P class="in15">2. Their Order<P><b>LITERATURE</b><hr /><P>The First and Second Epistles to Timothy, and the Epistle to Titus form a distinct group among the letters written by Paul, and are now known as the Pastoral Epistles because they were addressed to two Christian ministers. When Timothy and Titus received these epistles they were not acting, as they had previously done, as missionaries or itinerant evangelists, but had been left by Paul in charge of churches; the former having the oversight of the church in Ephesus, and the latter having the care of the churches in the island of Crete. The Pastoral Epistles were written to guide them in the discharge of the duties devolving upon them as Christian pastors. Such is a general description of these epistles. In each of them, however, there is a great deal more than is covered or implied by the designation, "Pastoral"—much that is personal, and much also that is concerned with Christian faith and doctrine and practice generally.<P>I. Genuineness.<P>1. External Evidence:<P>In regard to the genuineness of the epistles there is abundant external attestation. Allusions to them are found in the writings of Clement and Polycarp. In the middle of the 2nd century the epistles were recognized as Pauline in authorship, and were freely quoted.<P>"Marcion indeed rejected them, and Tatian is supposed to have rejected those to Timothy. But, as Jerome states in the preface to his Commentary on Titus, these heretics rejected the epistles, not on critical grounds, but merely because they disliked their teaching. He says they used no argument, but merely asserted, This is Paul\'s, This is not Paul\'s. It is obvious that men holding such opinions as Marcion and Tatian held, would not willingly ascribe authority to epistles which condemned asceticism. So far, then, as the early church can guarantee to us the authenticity of writings ascribed to Paul, the Pastoral Epistles are guaranteed" (Marcus Dods, Introduction to the New Testament, 167).<P>The external evidence is all in favor of the reception of these epistles., which were known not only to Clement and Polycarp, but also to Irenaeus, Tertullian, the author of the Epistle to the churches of Vienne and Lyons, and Theophilus of Antioch. The evidence of Polycarp, who died in 167 AD, is remarkably strong. He says, "The love of money is the beginning of all trouble, knowing...that we brought nothing into the world, neither can carry anything out" (compare <a onClick="return mV(\'1Ti\',6,7,10);">1Ti 6:7,10</a>). It would be difficult to overthrow testimony of this nature.<P>2. Genuineness Questioned:<P>The decision of certain critics to reject the Pastoral Epistles as documents not from the hand of Paul, "is not reached on the external evidence, which is perhaps as early an attestation as can be reasonably expected. They are included in the Muratorian Canon, and quoted by Irenaeus and later writers as Paul\'s" (A.S. Peake, A Critical Introduction to the New Testament, 60). This admission is satisfactory. In recent times, however, the authenticity of these epistles has been called in question by Schmidt, Schleiermacher, Baur, Renan, and many others. Baur asserted that they were written for the purpose of combating the Gnosticism of the 2nd century, and of defending the church from it by means of ecclesiastical organization, and that the date of their composition was about the year 150 AD.<P>II. Alleged Difficulties against Pauline Authorship.<P>Various difficulties have been alleged against the reception of the Pastoral Epistles as Pauline. The chief of these are:<P>(1) the difficulty of finding any place for these letters in the life of Paul, as that is recorded in the Acts and in the Pauline Epistles written before the Pastorals;<P>(2) the fact that there are said to be in them indications of an ecclesiastical organization, and of a development of doctrine, both orthodox and heretical, considerably in advance of the Pauline age;<P>(3) that the language of the epistles is, to a large extent, different from that in the accepted epistles; (4) the "most decisive" of all the arguments against the Pauline authorship—so writes Dr. A.C. McGiffert (A History of Christianity in the Apostolic Age, 402)—is that "the Christianity of the Pastoral Epistles is not the Christianity of Paul."<P>Where can a place be found for these epistles, in the life of Paul? The indications of the date of their composition given in the epistles themselves are these.<P>1. Relative to Paul\'s Experiences:<P>(1) Data in 1 Timothy<P>In <a onClick="return mV(\'1Ti\',1,3);">1Ti 1:3</a> Paul had gone from Ephesus to Macedonia, and had left Timothy in Ephesus in charge of the church there. In the Acts and in the previously written Pauline epistles, it is impossible to find such events or such a state of matters as will satisfy these requirements. Paul had previously been in Ephesus, on several occasions. His 1st visit to that city is recorded in <a onClick="return mV(\'Act\',18,\'19-21\');">Ac 18:19-21</a>. On that occasion he went from Ephesus, not into Macedonia, but into Syria. His 2nd visit was his 3 years\' residence in Ephesus, as narrated in <a onClick="return mV(\'Act\',19,\'1-\');">Ac 19</a>; and when he left the city, he had, previous to his own departure from it, already sent Timothy into Macedonia (<a onClick="return mV(\'Act\',19,22);">19:22</A>)—a state of matters exactly the reverse of that described in <a onClick="return mV(\'1Ti\',1,3);">1Ti 1:3</a>. Timothy soon rejoined Paul, and so far was he from being left in Ephesus then, that he was in Paul\'s company on the remainder of his journey toward Jerusalem (<a onClick="return mV(\'Act\',20,4);">Ac 20:4</a>; <a onClick="return mV(\'2Cr\',1,1);">2Co 1:1</a>).<P>No place therefore in Paul\'s life, previous to his arrest in Jerusalem, and his first Roman imprisonment, can be found, which satisfies the requirements of the situation described in <a onClick="return mV(\'1Ti\',1,3);">1Ti 1:3</a>. "It is impossible, unless we assume a second Roman imprisonment, to reconcile the various historical notices which the epistle (2 Timothy) contains" (McGiffert, op. cit., 407).<P>In addition to this, the language used by the apostle at Miletus, when he addressed the elders of the Ephesian church (<a onClick="return mV(\'Act\',20,30);">Ac 20:30</a>) about the men speaking perverse things, who should arise among them, showed that these false teachers had not made their appearance at that time. There is, for this reason alone, no place for the Pastoral Epistles in Paul\'s life, previous to his arrest in Jerusalem. But Paul\'s life did not end at the termination of his first Roman imprisonment; and this one fact gives ample room to satisfy all the conditions, as these are found in the three Pastorals.<P>Those who deny the Pauline authorship of these epistles also deny that he was released from what, in this article, is termed his 1st Roman imprisonment. But a denial of this latter statement is an assumption quite unwarranted and unproved. It assumes that Paul was not set free, simply because there is no record of this in the Acts. But the Acts is, on the very face of it, an incomplete or unfinished record; that is, it brings the narrative to a certain point, and then breaks off, evidently for the reason which Sir W.M. Ramsay demonstrates, that Luke meant to write a sequel to that book—a purpose, however, which he was unable, owing to some cause now unknown, to carry into execution. The purpose of the Acts, as Ramsay shows (St. Paul the Traveler and the Roman Citizen, 23, 308), is to lead up to the release of Paul, and to show that the Christian faith was not a forbidden or illegal religion, but that the formal impeachment of the apostle before the supreme court of the empire ended in his being set at liberty, and thus there was established the fact that the faith of Jesus Christ was not, at that time, contrary to Roman law. "The Pauline authorship...can be maintained only on the basis of a hypothetical reconstruction, either of an entire period subsequent to the Roman imprisonment, or of the events within some period known to us" (McGiffert, op. cit., 410). The one fact that Paul was set free after his 1st Roman imprisonment gives the environment which fits exactly all the requirements of the Pastoral Epistles.<P>Attention should be directed to the facts and to the conclusion stated in the article <a href="./study/isbe/search.html?string=PRAETORIUM">PRAETORIUM</A> (which see), Mommsen having shown that the words, "My bonds became manifest in Christ throughout the whole praetorian guard" (<a onClick="return mV(\'Phl\',1,13);">Php 1:13</a>), mean that at the time when Paul wrote the Epistle to the Philippians, the case against him had already come before the supreme court of appeal in Rome, that it had been partly heard, and that the impression made by the prisoner upon his judges was so favorable, that he expected soon to be set free.<P>The indications to be drawn from other expressions in three of the epistles of the Roman captivity—Philippians, Colossians, and Philemon—are to the same effect. Thus, writing to the Philippians, he says that he hopes to send Timothy to them, so soon as he sees how matters go with him, and that he trusts in the Lord that he himself will visit them shortly. And again, writing to his friend Philemon in the city of Colosse, he asks him to prepare him a lodging, for he trusts that through the prayers of the Colossians, he will be granted to them.<P>These anticipations of acquittal and of departure from Rome are remarkable, and do not in any degree coincide with the idea that Paul was not set free but was condemned and put to death at that time. "It is obvious that the importance of the trial is intelligible only if Paul was acquitted. That he was acquitted follows from the Pastoral Epistles with certainty for all who admit their genuineness; while even they who deny their Pauline origin must allow that they imply an early belief in historical details which are not consistent with Paul\'s journeys before his trial, and must either be pure inventions or events that occurred on later journeys....If he was acquitted, the issue of the trial was a formal decision by the supreme court of the empire that it was permissible to preach Christianity; the trial, therefore, was really a charter of religious liberty, and therein lies its immense importance. It was indeed overturned by later decisions of the supreme court; but its existence was a highly important fact for the Christians" (Ramsay, op. cit., 308). "That he was acquitted is demanded both by the plan evident in Acts and by other reasons well stated by others" (ibid., 360).<P>It should also be observed that there is the direct and corroborative evidence of Paul\'s release, afforded by such writers as Cyril of Jerusalem, Ephrem Syriac., Chrysostom and Theodoret, all of whom speak of Paul\'s going to Spain. Jerome (Vir. Ill., 5) gives it as a matter of personal knowledge that Paul traveled as far as Spain. But there is more important evidence still. In the Muratorian Canon, 1,37, there are the words, "profectionem Pauli ab urbe ad Spaniam proficiscentis" ("the journey of Paul as he journeyed from Rome to Spain"). Clement also in the epistle from the church in Rome to the church in Corinth, which was written not later than the year 96 AD, says in reference to Paul, "Having taught righteousness to the whole world, and having gone to the extremity of the west (epi to terma tes duseos elthon) and having borne witness before the rulers, so was he released from the world and went to the holy place, being the greatest example of endurance." The words, "having gone to the extremity of the west," should be specially noticed. Clement was in Rome when he wrote this, and, accordingly, the natural import of the words is that Paul went to the limit of the western half of then known world, or in other words, to the western boundary of the lands bordering the Mediterranean, that is, to Spain.<P>Now Paul never had been in Spain previous to his arrest in Jerusalem, but in <a onClick="return mV(\'Rom\',15,24,28);">Ro 15:24,28</a> he had twice expressed his intention to go there. These independent testimonies, of Clement and of the Muratorian Canon, of the fact that after Paul\'s arrest in Jerusalem he did carry into execution his purpose to visit Spain, are entitled to great weight. They involve, of course, the fact that he was acquitted after his 1st Roman imprisonment.<P>Having been set free, Paul could not do otherwise than send Timothy to Philippi, and himself also go there, as he had already promised when he wrote to the Philippian church (<a onClick="return mV(\'Phl\',2,19,24);">Php 2:19,24</a>). As a matter of course he would also resume his apostolic journeys for the purpose of proclaiming the gospel. There is now ample room in his life for the Pastoral Epistles, and they give most interesting details of his further labors. The historical and geographical requirements in 1 Timothy are, in this way, easily satisfied. It was no great distance to Ephesus from Philippi and Colosse, where he had promised that he would "come shortly."<P>(2) Data in 2 Timothy<P>The requirements in 2 Timothy are (a) that Paul had recently been at Troas, at Corinth, and at Miletus, each of which he mentions (<a onClick="return mV(\'2Ti\',4,13,20);">2Ti 4:13,20</a>); (b) that when he wrote the epistles he was in Rome (<a onClick="return mV(\'2Ti\',1,17);">1:17</A>); (c) that he was a prisoner for the cause of the gospel (<a onClick="return mV(\'2Ti\',1,8);">1:8</a>; <a onClick="return mV(\'2Ti\',2,9);">2:9</A>), and had once already appeared before the emperor\'s supreme court (<a onClick="return mV(\'2Ti\',4,16,17);">4:16,17</a>); (d) that he had then escaped condemnation, but that he had reason to believe that on the next hearing of his case the verdict would be given against him, and that he expected it could not be long till execution took place (<a onClick="return mV(\'2Ti\',4,6);">4:6</a>); (e) that he hoped that Timothy would be able to come from Ephesus to see him at Rome before the end (<a onClick="return mV(\'2Ti\',4,9,21);">4:9,21</A>). These requirements cannot be made to agree or coincide with the first Roman captivity, but they do agree perfectly with the facts of the apostle\'s release and his subsequent second imprisonment in that city.<P>(3) Data in Titus<P>The data given in the Epistle to Titus are<P>(a) that Paul had been in Crete, and that Titus had been with him there, and had been left behind in that island, when Paul sailed from its shores, Titus being charged with the oversight of the churches there (<a onClick="return mV(\'Tts\',1,5);">Tit 1:5</a>); and<P>(b) that Paul meant to spend the next winter at Nicopolis (<a onClick="return mV(\'2Ti\',3,12);">3:12</a>).<P>It is simply impossible to locate these events in the recorded life of Paul, as that is found in the other epistles, and in the Acts. But they agree perfectly with his liberation after his first Roman imprisonment. "As there is then no historical evidence that Paul did not survive the year 64, and as these Pastoral Epistles were recognized as Pauline in the immediately succeeding age, we may legitimately accept them as evidence that Paul did survive the year 64—that he was acquitted, resumed his missionary labors, was again arrested and brought to Rome, and from this second imprisonment wrote the Second Epistle to Timothy—his last extant writing" (Dods, Introduction to the New Testament, 172).<P>2. Subject-Matter, Post-Pauline:<P>The second difficulty alleged against the acceptance of these epistles as Pauline is that there are said to exist in them indications of an ecclesiastical organization and of a doctrinal development, both orthodox and heretical, considerably later than those of the Pauline age.<P>(1) Difficulty Regarding Church Organization<P>The first statement, that the epistles imply an ecclesiastical organization in advance of the time when Paul lived, is one which cannot be maintained in view of the facts disclosed in the epistles themselves. For directions are given to Timothy and to Titus in regard to the moral and other characteristics necessary in those who are to be ordained as bishops, elders, and deacons. In the 2nd century the outstanding feature of ecclesiastical organization was the development of monarchical episcopacy, but the Pastoral Epistles show a presbyterial administration. The office held by Timothy in Ephesus and by Titus in Crete was, as the epistles themselves show, of a temporary character. The directions which Paul gives to Timothy and Titus in regard to the ordaining of presbyters in every church are in agreement with similar notices found elsewhere in the New Testament, and do not coincide with the state of church organization as that existed in the 2nd century, the period when, objectors to the genuineness of the epistles assert, they were composed. "Everyone acquainted with ancient literature, particularly the literature of the ancient church, knows that a forger or fabricator of those times could not possibly have avoided anachronisms" (Zahn, Introduction to the New Testament, II, 93). But the ecclesiastical arrangements in the Pastoral Epistles coincide in all points with the state of matters as it is found in the church in the time of the apostles, as that is described in the Acts and elsewhere in the New Testament.<P>It seems an error to suppose, as has often been done, that these epistles contain the germ of monarchical episcopacy; for the Christian church had already, from the day of Pentecost, existed as a society with special officers for the functions of extension, discipline and administration. The church in the Pastoral Epistles is a visible society, as it always was. Its organization therefore had come to be of the greatest importance, and especially so in the matter of maintaining and handing down the true faith; the church accordingly is described as "the pillar and stay of the truth" (<a onClick="return mV(\'1Ti\',3,15);">1Ti 3:15</a> margin), that is, the immovable depository of the Divine revelation.<P>(2) The Doctrinal Difficulty<P>The other statement, that the epistles show a doctrinal development out of harmony with the Pauline age is best viewed by an examination of what the epistles actually say.<P>In <a onClick="return mV(\'1Ti\',6,20);">1Ti 6:20</a>, Paul speaks of profane and vain babblings and oppositions of gnosis (the Revised Version (British and American) "knowledge," the King James Version "science") falsely so called. In <a onClick="return mV(\'Tts\',3,9);">Tit 3:9</a>, he tells Titus to avoid foolish questions and genealogies and contentions and strivings about the law. These phrases have been held to be allusions to the tenets of Marcion, and to those of some of the Gnostic sects. There are also other expressions, such as fables and endless genealogies (<a onClick="return mV(\'1Ti\',1,3,4);">1Ti 1:3,4</a>; <a onClick="return mV(\'1Ti\',6,3);">6:3</a>), words to no profit but the subverting of the hearer (<a onClick="return mV(\'2Ti\',2,14);">2Ti 2:14</a>), foolish and unlearned questions which do gender strifes (<a onClick="return mV(\'2Ti\',2,23);">2Ti 2:23</a>), questions and strifes of words (<a onClick="return mV(\'1Ti\',6,4,5);">1Ti 6:4,5</a>), discussions which lead to nothing but word-battles and profane babbling. Such are the expressions which Paul uses. These, taken with what is even more clearly stated in the Epistle to the Colossians, certainly point to an incipient Gnosticism. But had the writer of the Pastoral Epistles been combating the Gnosticism of the 2nd century, it would not have been phrases like these that he would have employed, but others much more definite. Godet, quoted by Dods (Intro, 175), writes, "The danger here is of substituting intellectualism in religion for piety of heart and life. Had the writer been a Christian of the 2nd century, trying, under the name of Paul, to stigmatize the Gnostic systems, he would certainly have used much stronger expressions to describe their character and influence."<P>It should be observed that the false teachers described in <a onClick="return mV(\'2Ti\',3,\'6-9\',13);">2Ti 3:6-9,13</a>, as well as in other places in these epistles, were persons who taught that the Mosaic Law was binding upon all Christians. They laid stress upon rabbinic myths, upon investigations and disputations about genealogies and specific legal requirements of the Old Testament. What they taught was a form of piously sounding doctrine assuming to be Christian, but which was really rabbinism.<P>"For a pseudo-Paul in the post-apostolic age—when Christians of Jewish birth had become more and more exceptions in the Gentile Christian church—to have invented a description of and vigorously to have opposed the heterodidaskaloi, who did not exist in his own age, and who were without parallel in the earlier epistles of Paul, would have been to expose himself to ridicule without apparent purpose or meaning" (Zahn, Introduction, II, 117). "A comparison of the statements in these epistles about various kinds of false doctrine, and of those portions of the same that deal with the organization and officers of the church, with conditions actually existing in the church, especially the church of Asia Minor, at the beginning and during the course of the 2nd century, proves, just as clearly as does the external evidence, that they must have been written at latest before the year 100. But they could not have been written during the first two decades after Paul\'s death, because of the character of the references to persons, facts and conditions in Paul\'s lifetime and his own personal history, and because of the impossibility on this assumption of discovering a plausible motive for their forgery. Consequently the claim that they are post-Pauline, and contain matter which is un-Pauline, is to be treated with the greatest suspicion" (Zahn, op. cit., II, 118).<P>3. Difficulty Relative to Language:<P>The third difficulty alleged against the Pauline authorship of the Pastoral Epistles is connected with the language employed, which is said to be, to a large extent, different from that in the accepted epistles. The facts in regard to this matter are that in 1 Timothy there are 82 words not found elsewhere in the New Testament; in 2 Timothy there are 53 such words, and in Titus there are 33. But, while the total of such words in the three epistles is 168, this number, large though it appears, may be compared with the words used only once in the other Epistles of Paul. In Romans, 1 Corinthians, 2 Corinthians, Galatians, Ephesians, Philippians, Colossians, 1 Thessalonians, 2 Thessalonians and Philemon, the words of this description are 627 in number. So nothing can be built upon the fact of the 168 peculiar words in the Pastoral Epistles, that can safely be alleged as proof against their Pauline authorship. The special subjects treated in these epistles required adequate language, a requirement and a claim which would not be refused in the case of any ordinary author.<P>The objections to the Pauline authorship of the Pastorals, based upon the dissimilarity of diction in them and in Ephesians, Philippians and Colossians, cease to exist when theory is no longer persisted in, that the nucleus of the Pastoral Epistles was composed during the Roman imprisonment, which, according to this theory ended, not in the apostle\'s release, but in his execution. The fact that he was writing to intimate and beloved friends, both on personal matters and on the subject of church organization, and on that of incipient Gnosticism, which was troubling the churches of Asia Minor, made it essential that he should, to a large extent, use a different vocabulary.<P>4. Is There "Another Gospel" in the Pastorals?:<P>The "most decisive" of all the arguments against the Pauline authorship is that "the Christianity of the Pastoral Epistles is not the Christianity of Paul" (McGiffert, A History of Christianity, 402). "For the most part," Dr. McGiffert writes, "there is no trace whatever of the great fundamental truth of Paul\'s gospel—death unto the flesh and life in the Spirit." Now this is not so, for the passages which Dr. McGiffert himself gives in a footnote (<a onClick="return mV(\'2Ti\',1,\'9-11\');">2Ti 1:9-11</a>; <a onClick="return mV(\'2Ti\',2,11);">2:11</a>ff; <a onClick="return mV(\'Tts\',3,\'4-7\');">Tit 3:4-7</a>), as well as other references, do most certainly refer to this very aspect of the gospel. For example, the passage in <a onClick="return mV(\'2Ti\',2,\'1-\');">2Ti 2</a> contains these words, "If we died with him (Christ), we shall also live with him." What is this but the great truth of the union of the Christian believer with Christ? The believer is one with Christ in His death, one with Him now as He lives and reigns. The objection, therefore, which is "most decisive of all," is one which is not true in point of fact. Dr. McGiffert also charges the author of the Pastoral Epistles as being "one who understood by resurrection nothing else than the resurrection of the fleshly body" (p. 430). The body of our Lord was raised from the dead, but how very unjust this accusation is, is evident from such a passage as <a onClick="return mV(\'1Ti\',3,16);">1Ti 3:16</a>,<p class="in15"> "And without controversy great is the mystery of godliness;<br>He who was manifested in the flesh,<br>Justified in the Spirit,<br>Seen of angels,<br>Preached among the nations,<br>Believed on in the world,<br>Received up in glory."<P>Charges of this nature are unsupported by evidence, and are of the kind on which Dr. A.S. Peake (A Critical Introduction to the New Testament, 71) bases his rejection of the Pauline authorship—except for a Pauline nucleus—that he "feels clear." More than an ipse dixit of this sort is needed.<P>The theory that the Pastoral Epistles are based upon genuine letters or notes of Paul to Timothy and Titus is thus advocated by Peake, McGiffert, Moffatt and many others. It bears very hard upon 1 Timothy. "In 1 Timothy not a single verse can be indicated, which clearly bears the stamp of Pauline origin" (Peake, op. cit., 70). "We may fairly conclude then in agreement with many modern scholars that we have here, in the Pastoral Epistles, authentic letters of Paul to Timothy and Titus, worked over and enlarged by another hand" (McGiffert, op. cit., 405). In regard to 1 Timothy he writes, "It is very likely that there are scattered fragments of the original epistle in 1 Timothy, as for instance in <a onClick="return mV(\'1Ti\',1,23);">1:23</A>. But it is difficult to find anything which we can be confident was written by Paul" (p. 407).<P>Dr. McGiffert also alleges that in the Pastoral Epistles, the word "faith" "is not employed in its profound Pauline sense, but is used to signify one of the cardinal virtues, along with love, peace, purity, righteousness, sanctification, patience and meekness." One of the Pauline epistles, with which he contrasts the Pastorals, is the Epistle to the Galatians; and the groundlessness of this charge is evident from <a onClick="return mV(\'Gal\',5,22);">Ga 5:22</a>, where "faith" is included in the list there given of the fruit of the Spirit, along with love, joy, peace, longsuffering, gentleness, goodness, meekness and self-control.<P>If the Pastoral Epistles are the work of Paul, then, Dr. McGiffert concludes, Paul had given up that form of the gospel which he had held and taught throughout his life, and descended from the lofty religious plane upon which he had always moved, to the level of mere piety and morality (op. cit., 404). But this charge is not just or reasonable, in view of the fact that the apostle is instructing Timothy and Titus how to combat the views and practices of immoral teachers. Or again, in such a passage as <a onClick="return mV(\'1Ti\',1,\'12-17\');">1Ti 1:12-17</a> the King James Version, the author of the epistle has not descended from the lofty plane of faith to that of mere piety and morality, when he writes, "The grace of our Lord was exceeding abundant with faith and love which is in Christ Jesus. This is a faithful saying, and worthy of all acceptation, that Christ Jesus came into the world to save sinners; of whom I am chief."<P>If such be the "most decisive" objection against the Pauline authorship, the other difficulties, as already seen, need not cause alarm, for they resolve themselves into the equally groundless charges that the historical requirements of the epistles cannot be fitted into any part of Paul\'s life, and that the doctrine and ecclesiastical organization do not suit the Apostolic age. These objections have been already referred to.<P>The real difficulty, writes Dr. Peake (A Critical Introduction, 68), is that "the old energy of thought and expression is gone, and the greater smoothness and continuity in the grammar is a poor compensation for the lack of grip and of continuity in the thought." Dr. Peake well and truly says that this statement does not admit of detailed proof. Lack of grip and lack of continuity of thought are not the characteristics of such passages as <a onClick="return mV(\'1Ti\',1,\'9-17\');">1Ti 1:9-17</a>, a passage which will bear comparison with anything in the acknowledged Pauline Epistles; and there are many other similar passages, e.g. <a onClick="return mV(\'Tts\',2,\'11-\');">Tit 2:11</A>-<a onClick="return mV(\'Tts\',3,\'1-7\');">3:7</a>.<P>What must be said of the dullness of the intelligence of Christian men and of the Christian church as a whole, if they could thus let themselves be imposed upon by epistles which purported to be Paul\'s, but which were not written by him at all, but were the enlargement of a Pauline nucleus? Can it be believed that the church of the 2nd century, the church of the martyrs, was in such a state of mental decrepitude as to receive epistles which were spurious, so far as the greater portion of their contents is concerned? And can it be believed that this idea, so recently originated and so destitute of proof, is andequate explanation of epistles which have been received as Pauline from the earliest times?<P>When placed side by side with sub-apostolic writings like the Didache, Clement of Rome, Polycarp, and Ignatius, "it is difficult to resist the idea which returns upon one with almost every sentence that...the Pastorals are astonishingly superior" (Moffatt, The Historical New Testament, 556). Godet, quoted by R.D. Shaw (The Pauline Epistles, 441), writes, "When one has had enough of the pious amplifications of Clement of Rome, of the ridiculous inanities of Barnabas, of the general oddities of Ignatius, of the well-meant commonplaces of Polycarp, of the intolerable verbiage of Hermas, and of the nameless platitudes of the Didache, and, after this promenade in the first decade of the 2nd century, reverts to our Pastoral Epistles, one will measure the distance that separates the least striking products of the apostolic literature from what has been preserved to us as most eminent in the ancient patristic literature."<P>In the case of some modern critics, the interpolation hypothesis "is their first and last appeal, the easy solution of any difficulty that presents itself to their imaginations. Each writer feels free to give the kaleidoscope a fresh turn, and then records with blissful confidence what are called the latest results....The whole method postulates that a writer must always preserve the same dull monotone or always confine himself to the same transcendental heights....He must see and say everything at once; having had his vision and his dream, he must henceforth be like a star and dwell apart....To be stereotyped is his only salvation....On such principles there is not a writer of note, and there never has been a man in public life, or a student in the stream of a progressive science, large parts of whose sayings and doings could not be proved to be by some one else" (Shaw, The Pauline Epistles, 483).<P>III. Date and Order.<P>1. Date of the Epistles:<P>In regard to the date of these epistles, external and internal evidence alike go to show that they belong to practically the same period. The dates of their composition are separated from each other by not more than three or four years; and the dates of each and all of them must be close to the Neronic persecution (64 AD). If Paul was executed 67 AD (see Ramsay, Paul, 396), there is only a short interval of time between his release in 61 or 62, and his death in 67, that is a period of some 5 or 6 years, during which his later travels took place, and when the Pastoral Epistles were written. "Between the three letters there is an affinity of language, a similarity of thought, and a likeness of errors combated, which prevents our referring any of them to a period much earlier than the others" (Zahn, Introduction, II, 37).<P>2. Their Order:<P>The order in which they were written must have been 1 Timothy, Titus, 2 Timothy. It is universally acknowledged that 2 Timothy is the very last of Paul\'s extant epistles, and the internal evidence of the other two seems to point out 1 Timothy as earlier than Titus.<P>To sum up, the evidence of the early reception of the Pastoral Epistles as Pauline is very strong. "The confident denial of the genuineness of these letters—which has been made now for several generations more positively than in the case of any other Pauline epistles—has no support from tradition....Traces of their circulation in the church before Marcion\'s time are clearer than those which can be found for Romans and 2 Corinthians" (Zahn, op. cit., II, 85). The internal evidence shows that all three are from the hand of one and the same writer, a writer who makes many personal allusions of a nature which it would be impossible for a forger to invent. It is generally allowed that the personal passages in <a onClick="return mV(\'2Ti\',1,\'15-18\');">2Ti 1:15-18</a>; <a onClick="return mV(\'2Ti\',4,\'9-22\');">4:9-22</a> are genuine. But if this is so, then it is not possible to cut and carve the epistles into fragments of this kind. Objections dating only a century back are all too feeble to overturn the consistent marks of Pauline authorship found in all three epistles, corroborated as this is by their reception in the church, dating from the very earliest period. The Pastoral Epistles may be used with the utmost confidence, as having genuinely come from the hand of Paul.<P>LITERATURE.<P>R. D. Shaw, The Pauline Epistles; A. S. Peake, A Critical Introduction to the New Testament; A. C. McGiffert, A History of Christianity in the Apostolic Age; Theodor Zahn, An Introduction to the New Testament; Marcus Dods, Introduction to the New Testament; Weiss, Einleitung in das New Testament (English translation); C. J. Ellicott, A Critical and Grammatical Commentary on the Pastoral Epistles; Patrick Fairbairn, The Pastoral Epistles; John Ed. Huther, Critical and Exegetical Handbook of the Epistles of Paul to Timothy and Titus; George Salmon, A Historical Introduction to the Study of the Books of the New Testament; James Moffatt, The Historical New Testament; Introduction to the Literature of the New Testament; Adolf Julicher, An Introduction to the New Testament; Caspar Rene Gregory, Canon and Text of the New Testament.<P>The "lives" of Paul may also be consulted, as they contain much that refers to these epistles, i.e. those by Conybeare and Howson, Lewin, Farrar and others. See also Ramsay\'s Paul the Traveler and the Roman Citizen.``155';
