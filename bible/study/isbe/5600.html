isbe[5683]='Magi, the`ma\'-ji, (Magoi (<a onClick="return mV(\'Mat\',2,1,7,16);">Mt 2:1,7,16</a>, "Wise-men," the Revised Version (British and American) and the King James Version, "Magi" the Revised Version margin)):<P>1. Originally a Median Tribe:<P>Were originally a Median tribe (Herodotus i.101); and in Darius\' Inscriptions Magush means only a member of that tribe. It was one of them, Bardiya, who pretended to be Smerdis and raised the rebellion against Cambyses. Rabh Magh in <a onClick="return mV(\'Jer\',39,3);">Jer 39:3</a> does not mean "Chief Magus," but is in Assyrian Rab mugi (apparently "commander"; compare tab mugi sa narkabti, "commander of chariots"), having no connection with "Magus" (unless perhaps Magians were employed as charioteers, Media being famous for its Nisean steeds). The investment of the Magi with priestly functions, possibly under Cyrus (Xen. Cyrop. viii), but probably much later, was perhaps due to the fact that Zoroaster (Zarathustra) belonged, it is said, to that tribe. They guarded the sacred fire, recited hymns at dawn and offered sacrifices of haoma-juice, etc. Herodotus i.132) says they also buried the dead (perhaps temporary burial is meant as in Vendidad, Farg. viii). They were granted extensive estates in Media for their maintenance, and the athravans and other priests mentioned in the Avesta may have been of their number, though only once does the word "Magus" occur in the book (in the compound Moghu-thbish, "Magus-hater," Yasna, lxv.7, Geldner\'s edition). The Magi even in Herodotus\' time had gained a reputation for "magic" articles (compare <a onClick="return mV(\'Act\',13,6,8);">Ac 13:6,8</a>). They also studied astrology and astronomy (rationes mundani motus et siderum (Amm. Marc., xxiii.6, 32)), partly learned from Babylon.<P>2. The Magi at Bethlehem:<P>These latter studies explain why a star was used to lead them to Christ at Bethlehem, when our Lord was less than two years old (<a onClick="return mV(\'Mat\',2,16);">Mt 2:16</a>). No reliable tradition deals with the country whence these particular magi came. Justin Martyr, Tertullian and Epiphanius fancied that they came from Arabia, founding their opinion on the fact that "gold, frankincense and myrrh" abounded in Yemen. But the text says they came not from the south but from the east. Origen held that they came from Chaldea, which is possible. But Clement of Alexandria, Diodorus of Tarsus, Chrysostom, Cyril of Alexandria, Juvencus, Prudentius and others are probably right in bringing them from Persia. Sargon\'s settlement of Israelites in Media (circa 730-728 BC (<a onClick="return mV(\'2Ki\',17,6);">2Ki 17:6</a>)) accounts for the large Hebrew element of thought which Darmesteter recognizes in the Avesta (SBE, IV, Intro, chapter vi). Median astronomers would thus know Balaam\'s prophecy of the star out of Jacob (<a onClick="return mV(\'Num\',24,17);">Nu 24:17</a>). That the Jews expected a star as a sign of the birth of the Messiah is clear from the tractate Zohar of the Gemara and also from the title "Son of the Star" (Bar Kokhebha) given to a pseudo-Messiah<P>(130-35 AD). Tacitus (Hist. v.13) and Suetonius (Vesp. iv) tell us how widespread in the East at the time of Christ\'s coming was the expectation that "at that time men starting from Judea would make themselves masters of things" (compare Virgil, Ecl. iv). All this would naturally prepare the Magi to follow the star when it appeared.<P>See also <a href="./study/isbe/search.html?string=ASTROLOGY">ASTROLOGY</a>; <a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>; <a href="./study/isbe/search.html?string=DIVINATION">DIVINATION</a>; <a href="./study/isbe/search.html?string=MAGIC">MAGIC</a>; <a href="./study/isbe/search.html?string=WISE+MEN">WISE MEN</a>; <a href="./study/isbe/search.html?string=ZOROASTRIANISM">ZOROASTRIANISM</a>.<P>LITERATURE.<P>Herodotus; Xenophon; Amm. Marcellinus; Strabo; Spiegel, Altpersische Keilinschriften; Geldner, Avesta; Muss-Arnolt, Assyrian Dict.; BDB; RE.``175';
isbe[5684]='Magic; Magician`maj\'-ik, ma-jish\'-an:<P><b>I. DEFINITION</b><P><b>II. DIVISION OF THE SUBJECT</b><P class="in15">1. Magic as Impersonal<P class="in15">2. Margic as Personal<P><b>III. MAGIC AND RELIGION</b><P><b>IV. MAGIC IN THE BIBLE</b><P class="in15">1. Hostility to Magic<P class="in15">2. Potency of Magical Words<P class="in15">3. Influence of Charms<P><b>V. MAGICAL TERMS USED IN THE BIBLE</b><P class="in15">1. Divination<P class="in15">2. Sorcery<P class="in15">3. Enchantment<P class="in15">4. Amulets<P class="in15">5. Incantation<P class="in15">6. Repeated Utterances<P class="in15">7. Impostors<P class="in15">8. Witchcraft<P><b>LITERATURE</b><hr /><P>The word comes from a Greek adjective (magike) with which the noun techne, "art," is understood. The full phrase is "magical art" (The <span class="noTag">Wisdom of Solomon 17:10</span>). But the Greek word is derived from the magi or Zarathustran (Zoroastrian) priests. Magic is therefore historically the art practiced in Persia by the recognized priests of the country. It is impossible in the present article, owing to exigencies of space, to give a full account of this important subject and of the leading views of it which have been put forth. The main purpose of the following treatment will be to consider the subject from the Biblical standpoint.<P>I. Definition.<P>In its modern accepted sense magic may be described as the art of bringing about results beyond man\'s own power by superhuman agencies. In the wide sense of this definition divination is only a species of magic, i.e. magic used as a means of securing secret knowledge, especially a knowledge of the future. Divination and magic bear a similar relation to prophecy and miracle respectively, the first and third implying special knowledge, the second and fourth special power. But divination has to do generally with omens, and it is better for this and other reasons to notice the two subjects—magic and divination—apart as is done in the present work.<P>II. Division of the Subject.<P>1. Magic as Impersonal:<P>There are two kinds of magic:<P>(1) impersonal;<P>(2) personal.<P>In the first, magic is a species of crude science, for the underlying hypothesis is that there are forces in the world which can be utilized on certain conditions, incantations, magical acts, drugs, etc. The magician in this case connects what on a very slender induction he considers to be causes and effects, mainly on the principle of post hoc ergo propter hoc. He may not know much of the causal agency; it is enough for him to know that by performing some act or reciting some formula (see <a href="./study/isbe/search.html?string=CHARM">CHARM</a>) or carrying some object (see <a href="./study/isbe/search.html?string=AMULET">AMULET</a>) he can secure some desired end. Frazer (Golden Bough(2), I, 61) says: "Magic is a kind of savage logic, an elementary species of reasoning based on similarity, contiguity and contrast." But why does the savage draw conclusions from association of ideas? There must be an implied belief in the uniformly of Nature or in the controlling power of intelligent beings.<P>2. Magic as Personal:<P>In personal magic, living, intelligent, spiritual beings are made the real agents which men by incantations, etc., influence and even control. The magical acts may in an advanced stage include sacrifice, the incantations become prayer.<P>Impersonal magic is regarded by most anthropologists, including E.B. Tylor and J. Frazer, as more primitive than the second and as a lower form of it. This conclusion rests on an assumption that human culture is always progressive, that the movement is uniformly onward and upward. But this law does not always hold. The religion of Israel as taught in the 8th century BC stands on a higher level ethically and intellectually than that taught in the writings of Haggai, Zechariah and Eccelesiastes centuries later. Among the ancient Indians, the Rig Veda occupies much loftier ground than the much later Atharva Veda.<P>III. Magic and Religion.<P>Personal magic in its higher forms shades off into religion, and very commonly the two exist together. It is the practice to speak of sacrifice and prayer as constituting elements of the ancient and modern religions of India. But it is doubtful whether either of these has the same connotation that it bears in the Jewish and Christian Scriptures. J. Frazer (Golden Bough(2), I, 67ff) says that where the operation of spirits is assumed (and "these cases are exceptional"), magic is "tinged and alloyed with religion." Such an assumption is, he admits, often made and the present writer thinks it is generally made, for even the operation of the laws of association implies it. But Frazer concludes from various considerations that "though magic is...found to fuse and amalgamate with religion in many ages and in many lands, there are some grounds for thinking that this fusion is not primitive." It is of course personal magic to which religion stands in closest relations. As soon as man comes to see in the beings by whose power marvels are wrought, personalities capable of emotions like himself and susceptible to persuasion, his magical art becomes an intelligent effort to propitiate these superior beings and his incantations become hymns and prayers. In all religions, Jewish, Moslem, Christian or pagan, when the act or prayer as such is held to produce certain results or to secure certain desired boons, we have to do with a species of magic. The word "religion" is inapplicable, unless it includes the idea of personal faith in a God or gods whose favor depends on moral acts and on ritual acts only in so far as they have a voluntary and ethical character. If it be granted that magic, the lower, precedes religion, the higher, this does not necessarily negative the validity of the religious concept. Mature knowledge is preceded by elementary impressions and beliefs which are subjective without objective correspondences. But this higher knowledge is none the less valid for its antecedents. If it can be proved that the Christian or any other religion has become what it is by gradual ascent from animism, magic, etc., its validity is not by this destroyed or even impaired. Religion must be judged according to its own proper evidence. But see II, end.<P>IV. Magic in the Bible.<P>1. Hostility to Magic:<P>The general remarks made on the Bible and divination in <a href="./study/isbe/search.html?string=DIVINATION">DIVINATION, V</a>, have an equal application to the attitude of the Bible toward magic. This attitude is distinctly hostile, as it could not but be in documents professing to inculcate the teaching of the ethical and spiritual religion of Israel (see <a onClick="return mV(\'Deu\',18,10);">De 18:10</a>f; <a onClick="return mV(\'2Ki\',21,6);">2Ki 21:6</a>; <a onClick="return mV(\'2Ch\',33,6);">2Ch 33:6</a>, etc.). Yet it is equally clear that the actual power of magic is acknowledged as clearly as its illegitimacy is pointed out. In P\'s account of the plagues (<a onClick="return mV(\'Exd\',7,\'1-\');">Ex 7-11</a>) it is assumed that the magicians of Egypt had real power to perform superhuman feats. They throw their rods and they become serpents; they turn the waters of the Nile into blood. It is only when they try to produce gnats that they fail, though Aaron had succeeded by Yahweh\'s power in doing this and thus showed that Yahweh\'s power was greatest. But that the magicians had power that was real and great is not so much as called in question.<P>2. Potency of Magical Words:<P>Among the ancient Semites (Arabs, Assyrians, Hebrews, etc.) there was a strong belief in the potency of the magical words of blessing and of curse. The mere utterance of such words was regarded as enough to secure their realization. That the narrator of <a onClick="return mV(\'Num\',22,\'1-\');">Nu 22-24</a> (Jahwist) ascribed to Balaam magical power is clear from the narrative, else why should Yahweh be represented as transferring Balaam\'s service to the cause of Israel? We have other Biblical references to the power of the spoken word of blessing in <a onClick="return mV(\'Gen\',12,3);">Ge 12:3</a>; <a onClick="return mV(\'Exd\',12,32);">Ex 12:32</a>; <a onClick="return mV(\'Jdg\',17,2);">Jud 17:2</a>; <a onClick="return mV(\'2Sa\',21,3);">2Sa 21:3</a>, and of curse in <a onClick="return mV(\'Gen\',27,29);">Ge 27:29</a>; <a onClick="return mV(\'Jdg\',5,23);">Jud 5:23</a>; <a onClick="return mV(\'Job\',3,8);">Job 3:8</a> (compare the so-called Imprecatory Psalms, and see Century Bible, "Psalms," volume II, 216). On the prevalence of the belief among the Arabs, see the important work of Goldziher, Abhandlungen zur arabischen Philologie, Theil I, 23ff.<P>3. Influence of Charms:<P>In <a onClick="return mV(\'Gen\',30,14);">Ge 30:14</a> (Jahwist) we have an example of the belief in the power of plants (here mandrakes) to stir up and strengthen sexual love, and we read in Arabic literature of the very same superstition in connection with what is called Yabruch, almost certainly the same plant. Indeed one of the commonest forms in which magic appears is as a love-charm, and as this kind of magic was often exercised by women, magic and adultery are frequently named together in the Old Testament (see <a onClick="return mV(\'2Ki\',9,22);">2Ki 9:22</a>; <a onClick="return mV(\'Nah\',3,4);">Na 3:4</a>; <a onClick="return mV(\'Mal\',3,5);">Mal 3:5</a>; and compare <a onClick="return mV(\'Exd\',22,18);">Ex 22:18 (Hebrew 17)</a>, where the sorceress (the King James Version "witch") is to be condemned to death). We have an instance of what is called sympathetic magic (for a description of which see Jevons, Introduction to History of Religion, 28ff, and Frazer, Golden Bough(2), I, 49ff) in <a onClick="return mV(\'Gen\',30,37);">Ge 30:37</a>ff. Jacob placed before the sheep and goats that came to drink water peeled rods, so that the pregnant ones might bring forth young that were spotted and striped. The teraphim mentioned in <a onClick="return mV(\'Gen\',31,19);">Ge 31:19</a>ff and put away with wizards during the drastic reforms of Josiah (<a onClick="return mV(\'2Ki\',23,24);">2Ki 23:24</a>; compare <a onClick="return mV(\'Zec\',10,2);">Zec 10:2</a>) were household objects supposed capable of warding off evil of every kind. The Babylonians and Assyrians had a similar custom. We read of an Assyrian magician that he had statues of the gods Lugalgira and Alamu put on each side of the main entrance to his house, and in consequence he felt perfectly impregnable against evil spirits (see Tallquist, Assyrian. Beach, 22).<P>In <a onClick="return mV(\'Isa\',3,2);">Isa 3:2</a> the qocem ("magician" or "diviner") is named along with the knight warrior, the judge, prophet and elder, among the stays and supports of the nation; no disapproval is expressed or implied with regard to any of them. Yet it is not to be denied that in its essential features pure Yahwism, which enforced personal faith in a pure spiritual being, was radically opposed to all magical beliefs and practices. The fact that the Hebrews stood apart as believers in an ethical and spiritual religion from the Semitic and other peoples by which they were surrounded suggests that they were Divinely guided, for in other respects—art, philosophy, etc.—this same Hebrew nation held a lower place than many contemporary nations.<P>V. Magical Terms Used in the Bible.<P>Many terms employed in the Old Testament in reference to divination have also a magical import. See <a href="./study/isbe/search.html?string=DIVINATION">DIVINATION, VII</a>. For a fuller discussion of Biblical terms connected with both subjects, reference may be made to T. Witton Davies, Magic, Divination and Demonology among the Hebrews and Their Neighbours, 44 iff, 78ff; see also articles "Divination" and "Magic" in EB, by the present writer.<P>1. Divination:<P>Here a few brief statements are all that can be attempted. Qecem, usually rendered "divination" (see <a onClick="return mV(\'Num\',23,23);">Nu 23:23</a>), has primarily a magical reference (Fleischer), though both Wellhausen (Reste des arabischen Heidenthums 2, 133, note 5) and W. Robertson Smith (Jour. Phil., XIII, 278) hold that its first use was in connection with divination. The Arabic verb ("to exorcise") and noun ("an oath") have magical meanings. But it must be admitted that the secondary meaning ("divination") has almost driven out the other. See under I, where it is held that at bottom magic and divination are one.<P>2. Sorcery:<P>The verb kashaph, the Revised Version (British and American) "to practice sorcery," comes, as Fleischer held, from a root denoting "to have a dark appearance," to look gloomy, to be distressed, then as a suppliant to seek relief by magical means. The corresponding nouns kashshaph and mekashsheph are rendered "sorcerer" in English Versions of the Bible.<P>3. Enchantment:<P>Lachash, English Versions of the Bible "enchantment," etc. (see <a onClick="return mV(\'Isa\',3,3);">Isa 3:3</a>, nebhon lachash, the Revised Version (British and American) "the skillful enchanter"), is connected etymologically with nachash, "a serpent,"\' the "n" and "l" often interchanging in Semitic Lachash is, therefore, as might have been expected from this etymology, used specifically of serpent charming (see <a onClick="return mV(\'Jer\',8,17);">Jer 8:17</a>; <a onClick="return mV(\'Ecc\',10,11);">Ec 10:11</a>; compare melachesh in <a onClick="return mV(\'Psa\',58,5);">Ps 58:5 (Hebrew 6)</a>, English Versions of the Bible "charmer").<P>4. Amulets:<P>Chebher occurs in the plural only (<a onClick="return mV(\'Isa\',47,9,12);">Isa 47:9,12</a>, English Versions of the Bible, "enchantments"). It comes from a root meaning "to bind," and it denotes probably amulets of some kind carried on the person to ward off evil. It seems therefore to be the Biblical equivalent of the Talmudic qemia\', literally, equals "something bound" from qama\', "to bind."<P>5. Incantation:<P>Shichar (<a onClick="return mV(\'Isa\',47,11);">Isa 47:11</a>) seems to have an etymological connection with the principal Arabic word for "magic" (sichrun), and is explained by the great majority of recent commentators following J.H. Michaelis (Hitzig, Ewald, Dillmann, Whitehouse in Century Bible, etc.) as meaning "to charm away" (by incantations). So also Targum, Rashi, J H and Jastrow, Dictionary of the Targumim, Talmudim, and Midrashic Literature, Michaelis, Eichhorn, etc.<P>6. Repeated Utterances:<P>The verb battologeo in <a onClick="return mV(\'Mat\',6,7);">Mt 6:7</a> (equals "say not the same thing over and over again") refers to the superstition that the repeated utterance of a word will secure one\'s wish. In India today it is thought that if an ascetic says in one month the name of Radha, Krishna, or Ro 100,000 times, he cannot fail to obtain what he wants (see <a onClick="return mV(\'1Ki\',18,26);">1Ki 18:26</a>).<P>See <a href="./study/isbe/search.html?string=DIVINATION">DIVINATION</a>.<P>7. Impostors:<P>The term goetes, the Revised Version (British and American) "impostors," the King James Version "seducers," is used of a class of magicians who uttered certain magical formulas in a deep, low voice (compare the verb goao, which = "to sigh," "to utter low moaning tones"). Herodotus (ii.33) says that there were persons of the kind in Egypt, and they are mentioned also by Euripides and Plato.<P>8. Witchcraft:<P>Paul in <a onClick="return mV(\'Gal\',5,20);">Ga 5:20</a> classes with uncleanness, idolatry, etc., what he calls pharmakeia, the King James Version "witchcraft" the Revised Version (British and American) "sorcery." The word has reference first of all to drugs used in exercising the magical art. Note the name Simon Magus, which = Simon the magician (<a onClick="return mV(\'Act\',8,9);">Ac 8:9</a>f), and Bar-Jesus, whom Luke calls a magician (magos, English Versions of the Bible, "sorcerer") and to whom he gives also the proper name Elymas, which is really the Arabic \'alim = "learned," and so one skillful in the magical art.<P>See also under <a href="./study/isbe/search.html?string=AMULET">AMULET</a>; <a href="./study/isbe/search.html?string=CHARM">CHARM</a>; <a href="./study/isbe/search.html?string=DEMONOLOGY">DEMONOLOGY</a>; <a href="./study/isbe/search.html?string=WITCHCRAFT">WITCHCRAFT</a>.<P>LITERATURE.<P>A Very full bibliography of the subject will be found in T. Witton Davies, Magic, Divination and Demonology among the Hebrews and Their Neighbours, xi through xvi. See also the literature under <a href="./study/isbe/search.html?string=DIVINATION">DIVINATION</a> and in addition to the literature cited in the course of the foregoing article, note the following: A. Lehmann, Aberglaube und Zauberei2, 1908; A.C. Haddon, Magic and Fetishism, 1906; Blau, Das altjudische Zauberwesen, 1898; Smith, "Witchcraft in the Old Testament," Biblical Soc.,1902,23-35; W.R. Halliday, Greek Divination; A Study of Its Methods and Principles, London, Macmillan (important) and the valuable article on "Magic" by Northwest Thomas in the Encyclopedia Brittanica, and also the relevant articles in the Bible dictionaries.``33';
isbe[5685]='Magistrate`maj\'-is-trat (shephat, corresponding to shaphat, "to judge," "to pronounce sentence" (<a onClick="return mV(\'Jdg\',18,7);">Jud 18:7</a>)): Among the ancients, the terms corresponding to our "magistrate" had a much wider signification. "Magistrates and judges" (shophetim we-dhayyanim) should be translated "judges and rulers" (<a onClick="return mV(\'Ezr\',7,25);">Ezr 7:25</a>). ceghanim "rulers" or "nobles," were Babylonian magistrates or prefects of provinces (<a onClick="return mV(\'Jer\',51,23,28,57);">Jer 51:23,28,57</a>; <a onClick="return mV(\'Eze\',23,6);">Eze 23:6</a>). In the time of Ezra and Nehemiah, the Jewish magistrates bore the same title (<a onClick="return mV(\'Ezr\',9,2);">Ezr 9:2</a>; <a onClick="return mV(\'Neh\',2,16);">Ne 2:16</a>; <a onClick="return mV(\'Neh\',4,14);">4:14</a>; <a onClick="return mV(\'Neh\',13,11);">13:11</a>). The Greek archon, "magistrate" (<a onClick="return mV(\'Luk\',12,58);">Lu 12:58</a>; <a onClick="return mV(\'Tts\',3,1);">Tit 3:1</a> the King James Version), signifies the chief in power (<a onClick="return mV(\'1Cr\',2,6,8);">1Co 2:6,8</a>) and "ruler" (<a onClick="return mV(\'Act\',4,26);">Ac 4:26</a>; <a onClick="return mV(\'Rom\',13,3);">Ro 13:3</a>).<P>The Messiah is designated as the "prince (archon) of the kings of the earth" (<a onClick="return mV(\'Rev\',1,5);">Re 1:5</a> the King James Version), and by the same term Moses is designated the judge and leader of the Hebrews (<a onClick="return mV(\'Act\',7,27,35);">Ac 7:27,35</a>). The wide application of this term is manifest from the fact that it is used of magistrates of any kind, e.g. the high priest (<a onClick="return mV(\'Act\',23,5);">Ac 23:5</a>); civil judges (<a onClick="return mV(\'Luk\',12,58);">Lu 12:58</a>; <a onClick="return mV(\'Act\',16,19);">Ac 16:19</a>); ruler of the synagogue (<a onClick="return mV(\'Luk\',8,41);">Lu 8:41</a>; <a onClick="return mV(\'Mat\',9,18,23);">Mt 9:18,23</a>; <a onClick="return mV(\'Mar\',5,22);">Mr 5:22</a>); persons of standing and authority among the Pharisees and other sects that appear in the Sanhedrin (<a onClick="return mV(\'Luk\',14,1);">Lu 14:1</a>; <a onClick="return mV(\'Jhn\',3,1);">Joh 3:1</a>; <a onClick="return mV(\'Act\',3,17);">Ac 3:17</a>). The term also designates Satan, the prince or chief of the fallen angels (<a onClick="return mV(\'Mat\',9,34);">Mt 9:34</a>; <a onClick="return mV(\'Eph\',2,2);">Eph 2:2</a>).<P>In the New Testament we also find strategos, employed to designate the Roman praetors or magistrates of Philippi, a Roman colony (<a onClick="return mV(\'Act\',16,20,22,35,36,38);">Ac 16:20,22,35,36,38</a>). A collective term for those clothed with power (Eng. "the powers"), exousiai, is found in <a onClick="return mV(\'Luk\',12,11);">Lu 12:11</a> the King James Version; <a onClick="return mV(\'Rom\',13,2,3);">Ro 13:2,3</a>; <a onClick="return mV(\'Tts\',3,1);">Tit 3:1</a>. The "higher powers" (<a onClick="return mV(\'Rom\',13,1);">Ro 13:1</a>) are all those who are placed in positions of civil authority from the emperor down.<P>In early Hebrew history, the magisterial office was limited to the hereditary chiefs, but Moses made the judicial office elective. In his time the "heads of families" were 59 in number, and these, together with the 12 princes of the tribes, composed the Sanhedrin or Council of 71. Some of the scribes were entrusted with the business of keeping the genealogies and in this capacity were also regarded as magistrates.``77';
isbe[5686]='Magnifical`mag-nif\'-i-kal (gadhal, in Hiphil "to make great"): Old form retained from Genevan version in <a onClick="return mV(\'1Ch\',22,5);">1Ch 22:5</a>; in the American Standard Revised Version "magnificent."``1';
isbe[5687]='Magnificat`mag-nif\'-i-kat: The name given to the hymn of Mary in <a onClick="return mV(\'Luk\',1,\'46-55\');">Lu 1:46-55</a>, commencing "My soul doth magnify the Lord." Three old Latin manuscripts substitute the name "Elisabeth" for "Mary" in <a onClick="return mV(\'Luk\',1,46);">1:46</a>, but against this is the authority of all Greek manuscripts and other Latin versions. The hymn, modeled in part on that of Hannah in <a onClick="return mV(\'1Sa\',2,1);">1Sa 2:1</a>ff, is peculiarly suitable to the circumstances of Mary, and plainly could not have been composed after the actual appearance and resurrection of Christ. Its early date is thus manifest.``1';
isbe[5688]='Magnify`mag\'-ni-fi (Hiphil of gadhal; megaluno, "to make great," "extol," "celebrate in praise"): Used especially of exaltation of the name, mercy, and other attributes of God (<a onClick="return mV(\'Gen\',19,19);">Ge 19:19</a>; <a onClick="return mV(\'2Sa\',7,26);">2Sa 7:26</a>; <a onClick="return mV(\'Psa\',35,27);">Ps 35:27</a>; <a onClick="return mV(\'Psa\',40,16);">40:16</a>; <a onClick="return mV(\'Psa\',70,4);">70:4</a>; <a onClick="return mV(\'Luk\',1,46);">Lu 1:46</a>; <a onClick="return mV(\'Act\',10,46);">Ac 10:46</a>); of God\'s "word" (<a onClick="return mV(\'Psa\',138,2);">Ps 138:2</a>); or of Christ (<a onClick="return mV(\'Act\',19,17);">Ac 19:17</a>; <a onClick="return mV(\'Phl\',1,20);">Php 1:20</a>). Men also can be "magnified" (<a onClick="return mV(\'Jos\',4,14);">Jos 4:14</a>; <a onClick="return mV(\'1Ch\',29,25);">1Ch 29:25</a>, etc.). In <a onClick="return mV(\'Rom\',11,13);">Ro 11:13</a>, "magnify mine office," the word (Greek, doxazo) is changed in the Revised Version (British and American) to "glorify."``1';
isbe[5689]='Magog`ma\'-gog (maghogh; Magog): Named among the sons of Japheth (<a onClick="return mV(\'Gen\',10,2);">Ge 10:2</a>; <a onClick="return mV(\'1Ch\',1,5);">1Ch 1:5</a>). Ezekiel uses the word as equivalent to "land of Gog" (<a onClick="return mV(\'Eze\',38,2);">Eze 38:2</a>; <a onClick="return mV(\'Eze\',39,6);">39:6</a>). Josephus identifies the Magogites with the Scythians (Ant., I, vi, 1). From a resemblance between the names Gog and Gyges (Gugu), king of Lydia, some have suggested that Magog is Lydia; others, however, urge that Magog is probably only a variant of Gog (Sayce in HDB). In the Apocalypse of John, Gog and Magog represent all the heathen opponents of Messiah (<a onClick="return mV(\'Rev\',20,8);">Re 20:8</a>), and in this sense these names frequently recur in Jewish apocalyptic literature.``95';
isbe[5690]='Magor-Missabib`ma\'-gor-mis\'-a-bib (maghor miccabhibh, "terror on every side"): A name given by Jeremiah to Pashhur ben Immer, the governor of the temple, who had caused the prophet to be beaten and set in the stocks (<a onClick="return mV(\'Jer\',20,3);">Jer 20:3</a>). The same expression is used (not as a proper name) in several other passages (<a onClick="return mV(\'Psa\',31,13);">Ps 31:13</a>; <a onClick="return mV(\'Jer\',6,25);">Jer 6:25</a>; <a onClick="return mV(\'Jer\',20,10);">20:10</a>; <a onClick="return mV(\'Jer\',46,5);">46:5</a>; <a onClick="return mV(\'Jer\',49,29);">49:29</a>; <a onClick="return mV(\'Lam\',2,22);">La 2:22</a>).``1';
isbe[5691]='Magpiash`mag\'-pi-ash.`<a href="./study/isbe/search.html?string=MAGBISH">MAGBISH</a>`1';
isbe[5692]='Magus, Simon`ma\'-gus.`<a href="./study/isbe/search.html?string=SIMON+MAGUS">SIMON MAGUS</a>; <a href="./study/isbe/search.html?string=MAGI">MAGI</a>; <a href="./study/isbe/search.html?string=MAGIC">MAGIC</a>`1';
isbe[5693]='Mahalah`ma-ha\'-la, ma\'-ha-la (machlah; the Revised Version (British and American) has the correct form <a href="./study/isbe/search.html?string=MAHLAH">MAHLAH</a>): A descendant of Manasseh (<a onClick="return mV(\'1Ch\',7,18);">1Ch 7:18</a>).``1';
isbe[5694]='Mahalalel`ma-ha\'-la-lel (mahalal\'el; the King James Version Mahalaleel, ma-ha\'la-le-el, ma-hal\'a-lel):<P>(1) Son of Cainan, the grandson of Seth (<a onClick="return mV(\'Gen\',5,12);">Ge 5:12</a>ff; <a onClick="return mV(\'1Ch\',1,2);">1Ch 1:2</a>).<P>(2) The ancestor of Athaiah, one of the children of Judah who dwelt in Jerusalem after the return from exile (<a onClick="return mV(\'Neh\',11,4);">Ne 11:4</a>).``1';
isbe[5695]='Mahalath`ma\'-ha-lath (machalath):<P>(1) In <a onClick="return mV(\'Gen\',28,9);">Ge 28:9</a> the name of a wife of Esau, daughter of Ishmael, and sister of Nebaioth, called in <a onClick="return mV(\'Gen\',36,3);">36:3</A>, <a href="./study/isbe/search.html?string=BASEMATH">BASEMATH</a> (which see). The Samaritan Pentateuch, however, throughout <a onClick="return mV(\'Gen\',36,\'1-\');">Genesis 36</a> retains "Mahalath." On the other hand, in <a onClick="return mV(\'Gen\',26,34);">26:34</a> Basemath is said to be "the daughter of Elon the Hittite," probably a confusion with Adah, as given in <a onClick="return mV(\'Gen\',36,2);">36:2</A>, or corruption may exist in the lists otherwise.<P>(2) One of the 18 wives of Rehoboam, a grand-daughter of David (<a onClick="return mV(\'2Ch\',11,18);">2Ch 11:18</a>).<P>(3) The word is found in the titles of <a onClick="return mV(\'Psa\',53,\'1-\');">Ps 53</a> (the Revised Version (British and American) "set to Mahalath") and <a onClick="return mV(\'Psa\',88,\'1-\');">Ps 88</a> (the Revised Version (British and American) "set to Mahalath Leannoth," margin "for singing"). Probably some song or tune is meant, though the word is taken by many to denote a musical instrument. Hengstenberg and others interpret it as indicating the subject of the Psalms.`<a href="./study/isbe/search.html?string=PSALMS">PSALMS</a>`132';
isbe[5696]='Mahali`ma\'-ha-li.`<a href="./study/isbe/search.html?string=MAHLI">MAHLI</a>`1';
isbe[5697]='Mahanaim`ma-ha-na\'-im (machanayim; the Greek is different in every case where the name occurs, Codex Vaticanus and Codex Alexandrinus also giving variant forms; the dual form may be taken as having arisen from an old locative ending, as, e.g. yerushala(y)im from an original yerushalem. In <a onClick="return mV(\'Gen\',32,21);">Ge 32:21</a> machaneh is evidently a parallel form and should be rendered as a proper name, Mahaneh, i.e. Mahanaim): The city must have been one of great strength. It lay east of the Jordan, and is first mentioned in the history of Jacob. Here he halted after parting from Laban, before the passage of the Jabbok (<a onClick="return mV(\'Gen\',31,2);">Ge 31:2</a>), "and the angels of God met him." Possibly it was the site of an ancient sanctuary. It is next noticed in defining the boundaries of tribal territory east of the Jordan. It lay on the border of Gad and Manasseh (<a onClick="return mV(\'Jos\',13,26,30);">Jos 13:26,30</a>). It belonged to the lot of Gad, and was assigned along with Ramoth in Gilead to the Merarite Levites (<a onClick="return mV(\'Jos\',21,38);">Jos 21:38</a>; <a onClick="return mV(\'1Ch\',6,80);">1Ch 6:80</a>—the former of these passages affords no justification to Cheyne in saying (EB, under the word) that it is mentioned as a "city of refuge"). The strength of the place doubtless attracted Abner, who fixed here the capital of Ishbosheth\'s kingdom. Saul\'s chivalrous rescue of Jabesh-gilead was remembered to the credit of his house in these dark days, and the loyalty of Mahanaim could be reckoned on (<a onClick="return mV(\'2Sa\',2,8);">2Sa 2:8</a>, etc.). To this same fortress David fled when endangered by the rebellion of Absalom; and in the "forest" hard by, that prince met his fate (<a onClick="return mV(\'2Sa\',17,24);">2Sa 17:24</a>, etc.). It was made the center of one of Solomon\'s administrative districts, and here Abinadab the son of Iddo was stationed (<a onClick="return mV(\'1Ki\',4,14);">1Ki 4:14</a>). There seems to be a reference to Mahanaim in <a onClick="return mV(\'Sgs\',6,13);">So 6:13</a> the Revised Version (British and American). If this is so, here alone it appears with the article. By emending the text Cheyne would read: "What do you see in the Shulammite? A narcissus of the valleys."<P>It is quite clear from the narrative that Jacob, going to meet his brother, who was advancing from the south, crossed the Jabbok after leaving Mahanaim. It is therefore vain to search for the site of this city south of the Jabbok, and Conder\'s suggested identification with some place near el-Buqei\'a, east of es-Salt], must be given up.<P>On the north of the Jabbok several positions have been thought of. Merrill (East of the Jordan, 433ff) argues in favor of Khirbet Saleikhat, a ruined site in the mouth of Wady Saleikhat, on the northern bank, 3 miles east of Jordan, and 4 miles north of Wady \'Ajlun. From its height, 300 ft. above the plain, it commands a wide view to the west and south. One running "by the way of the Plain" could be seen a great way off (<a onClick="return mV(\'2Sa\',18,23);">2Sa 18:23</a>). This would place the battle in the hills to the south near the Jordan valley. Ahimaaz then preferred to make a detour, thus securing a level road, while the Cushite took the rough track across the heights. Others, among them Buhl (GAP, 257), would place Mahanaim at Michneh, a partly overgrown ruin 9 miles east of Jordan, and 4 miles north of \'Ajlun on the north bank of Wady Machneh. This is the only trace of the ancient name yet found in the district. It may be assumed that Mahanaim is to be sought in this neighborhood. Cheyne would locate it at \'Ajlun, near which rises the great fortress Kal\'ater-Rabad. He supposes that the "wood of Mahanaim" extended as far as Michneh, and that "the name of Mihneh is really an abbreviation of the ancient phrase." Others would identify Mahanaim with Jerash, where, however, there are no remains older than Greek-Roman times.<P>Objections to either \'Ajlun or Michneh are:<P>(1) The reference to this Jordan" in <a onClick="return mV(\'Gen\',32,10);">Ge 32:10</a>, which seems to show that the city was near the river. It may indeed be said that the great hollow of the Jordan valley seems close at hand for many miles on either side, but this, perhaps, hardly meets the objection.<P>(2) The word kikkar, used for "Plain" in <a onClick="return mV(\'2Sa\',18,23);">2Sa 18:23</a>, seems always elsewhere to apply to the "circle" of the Jordan. Buhl, who identifies Mahanaim with Michneh, yet cites this verse (G A the Priestly Code (P), 112) as a case in which kikkar applies to the plain of the Jordan. He thus prescribes for Ahimaaz a very long race. Cheyne sees the difficulty. The battle was obviously in the vicinity of Mahanaim, and the nearest way from the "wood" was by the kikkar, "or, since no satisfactory explanation of this reading has been offered by the nachal, that is to say, the eager Ahimaaz ran along in the wady in which, at some little distance, Mahanaim lay" (EB, under the word). The site for the present remains in doubt.ter-Rabad. He supposes that the "wood of Mahanaim" extended as far as Michneh, and that "the name of Mihneh is really an abbreviation of the ancient phrase." Others would identify Mahanaim with Jerash, where, however, there are no remains older than Greek-Roman times.``54';
isbe[5698]='Mahaneh-Dan`ma\'-ha-ne-dan (machaneh-dhan; parembole Dan): This place is mentioned twice: in <a onClick="return mV(\'Jdg\',13,25);">Jud 13:25</a> (the King James Version "the camp of Dan"), and <a onClick="return mV(\'Jdg\',18,12);">Jud 18:12</a>. In Mahaneh-dan, between Zorah and Eshtaol, the spirit of the Lord began to move Samson. Here the 600 marauders of Dan, coming from Zorah and Eshtaol, encamped behind Kiriath-jearim. It has been thought that these two statements contradict each other; or at least that they cannot both apply to the same place. But if we accept the identification of Zorah with Surah, and of Eshtaol with Eshu\', which there seems no reason to question; and if, further, we identify Kiriath-jearim with Khirbet Erma, which is at least possible, the two passages may be quite reconciled. Behind Kiriath-jearim, that is west of Khirbet Erma, runs the Vale of Sorek, on the north bank of which, about 2 miles apart, stand Zorah and Eshtaol; the former 3 1/2 miles, the latter 2 1/2 miles fron khirbet Erma. No name resembling Mahanehdan has yet been recovered; but the place may have lain within the area thus indicated, so meeting the conditions of both passages, whether it was a permanent settlement, or derived its name only from the incident mentioned in <a onClick="return mV(\'Jdg\',18,12);">Jud 18:12</a>.``54';
isbe[5699]='Maharai`ma-har\'-a-i, ma\'-ha-ri (maharay, "impetuous"): One of David\'s "braves" (<a onClick="return mV(\'2Sa\',23,28);">2Sa 23:28</a>; <a onClick="return mV(\'1Ch\',11,30);">1Ch 11:30</a>; <a onClick="return mV(\'1Ch\',27,13);">27:13</a>). He was one of the 12 monthly captains of David\'s administration, and took the 10th month in rotation. He was of the family of Zerah, and dwelt in Netophah in Judah.``1';
isbe[5700]='Mahath`ma\'-hath (machath, "snatching"; Meth):<P>(1) One of the Kohathites having charge of the "service of song" in David\'s time, son of Amasai (<a onClick="return mV(\'1Ch\',6,35);">1Ch 6:35</a>). Possibly the same as Ahimoth (<a onClick="return mV(\'1Ch\',6,25);">1Ch 6:25</a>). He seems also to be the same as the person named in <a onClick="return mV(\'2Ch\',29,12);">2Ch 29:12</a> during Hezekiah\'s time, though it is probable there is some confusion in the narrative. He is there represented as taking part in the new covenant of Hezekiah and the cleansing of the Lord\'s house.<P>(2) One of the overseers of the temple under Conaniah and Shimei (<a onClick="return mV(\'2Ch\',31,13);">2Ch 31:13</a>); three passages of Scripture give the name, but it is difficult to individuate these because the genealogy identifies the two first named (<a onClick="return mV(\'1Ch\',6,35);">1Ch 6:35</a>; <a onClick="return mV(\'2Ch\',29,12);">2Ch 29:12</a>), while the chronology seems to divide them—one in David\'s day, the other in Hezekiah\'s. It is not, however, impossible to identify the man of <a onClick="return mV(\'2Ch\',29,12);">2Ch 29:12</a> with him of <a onClick="return mV(\'2Ch\',31,13);">2Ch 31:13</a>. Possibly the genealogy has been mistakenly repeated in <a onClick="return mV(\'2Ch\',29,12);">2Ch 29:12</a>.``186';
