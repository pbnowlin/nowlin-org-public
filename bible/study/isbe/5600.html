isbe[5628]='Lysias`lis\'-i-as (Lusias):<P>(1) "A noble man, and one of the blood royal" whom Antiochus Epiphanes (circa 166 BC) left with the government of Southern Syria and the guardianship of his son, while he went in person into Persia to collect the revenues which were. not coming in satisfactorily (1Macc 3:32; 2Macc 10:11). According to Josephus (Ant., XII, vii, 2), the instructions of Lysias were\' "to conquer Judea, enslave its inhabitants, utterly destroy Jerusalem and abolish the whole nation." Lysias, accordingly, armed against Judas Maccabeus a large force under Ptolemy, son of Dorymenes, Nicanor and Gorgias. Of this force Judas defeated the two divisions under Nicanor and Gorgias near Emmaus (166 BC), and in the following year Lysias himself at Bethsura (1Macc 4), after which he proceeded to the purification of the temple. In the narration of these campaigns there are considerable differences between the writers of 1Maccabees and 2Maccabees which scholars have not found easy to explain. Antiochus died at Babylon on his Persian expedition (164 BC), and Lysias assumed the office of regent during the minority of his son, who was yet a child (1Macc 6:17). He collected another army at Antioch, and after the recapture of Bethsura was besieging Jerusalem when he learned of the approach of Philip to whom Antiochus, on his deathbed, had entrusted the guardianship of the prince (1Macc 6:15; 2Macc 13). He defeated Philip in 163 BC and was supported at Rome, but in the following year he fell with his ward Antiochus into the hands of Demetrius I (Soter), who put both of them to death (1Macc 7:1-23).`<a href="./study/isbe/search.html?string=CLAUDIUS+LYSIAS">CLAUDIUS LYSIAS</a>`79';
isbe[5629]='Lysimachus`li-sim\'-a-kus (Lusimachos):<P>(1) The son of Ptolemy, of Jerusalem, is named (<span class="noTag">Additions to Esther 11:1</span>) as the interpreter (translator of the Rest of Esther into Greek).<P>See <a href="./study/isbe/search.html?string=ESTHER,+THE+REST+OF">ESTHER, THE REST OF</a>.<P>(2) Brother of Menelaus, a Greek name said by Josephus (Ant., XII, v, 1) to have been assumed by Onias, the high priest in the hellenizing days of Antiochus Epiphanes, as the Jewish name Jesus was changed to Jason. When Menelaus was summoned to Antioch (2Macc 4:29) on a charge of malversation, he left Lysimachus as his deputy in the priesthood at Jerusalem. Lysimachus robbed the temple and caused an insurrection in which he met his death beside the treasury (2Macc 4:42). The name of Lysimachus does not appear in the narrative of these events given by Josephus``79';
isbe[5630]='Lystra`lis\'-tra: The forms Lustran, and Lustrois, occur. Such variation in the gender of Anatolian city-names is common (see Harnack, Apostelgeschichte, 86; Ramsay, Paul the Traveler, 128). Lystra was visited by Paul 4 times (<a onClick="return mV(\'Act\',14,6,21);">Ac 14:6,21</a>; <a onClick="return mV(\'Act\',16,1);">16:1</a>; <a onClick="return mV(\'Act\',18,23);">18:23</a> —the last according to the "South Galatian" theory), and is mentioned in <a onClick="return mV(\'2Ti\',3,10);">2Ti 3:10</a>f as one of the places where Paul suffered persecution. Timothy resided in Lystra (<a onClick="return mV(\'Act\',16,1);">Ac 16:1</a>).<P>1. Character and Site:<P>Lystra owed its importance, and the attention which Paul paid to it, to the fact that it had been made a Roman colonia by Augustus (see <a href="./study/isbe/search.html?string=ANTIOCH">ANTIOCH</a>), and was therefore, in the time of Paul, a center of education and enlightenment. Nothing is known of its earlier, and little of its later, history. The site of Lystra was placed by Leake (1820) at a hill near Khatyn Serai, 18 miles south-southwest from Iconium; this identification was proved correct by an inscription found by Sterrett in 1885. The boundary between Phrygia and Lycaonia passed between Iconium and Lystra. (<a onClick="return mV(\'Act\',14,6);">Ac 14:6</a>) (see <a href="./study/isbe/search.html?string=ICONIUM">ICONIUM</a>).<P>The population of Lystra consisted of the local aristocracy of Roman soldiers who formed the garrison of the colonia, of Greeks and Jews (<a onClick="return mV(\'Act\',16,1,3);">Ac 16:1,3</a>), and of native Lycaonians (<a onClick="return mV(\'Act\',14,11);">Ac 14:11</a>).<P>2. Worship of Paul and Barnabas:<P>After Paul had healed a life-long cripple at Lystra, the native population (the "multitude" of <a onClick="return mV(\'Act\',14,11);">Ac 14:11</a>) regarded him and Barnabas as pagan gods come down to them in likeness of men, and called Barnabas "Zeus" and Paul "Hermes." Commentators on this incident usually point out that the same pair of divinities appeared to Baucis and Philemon in Ovid\'s well-known story, which he locates in the neighboring Phrygia. The accuracy in detail of this part of the narrative in Acts has been strikingly confirmed by recent epigraphic discovery. Two inscriptions found in the neighborhood of Lystra in 1909 run as follows:<P>(1) "Kakkan and Maramoas and Iman Licinius priests of Zeus";<P>(2) "Toues Macrinus also called Abascantus and Batasis son of Bretasis having made in accordance with a vow at their own expense (a statue of) Hermes Most Great along with a sun-dial dedicated it to Zeus the sun-god."<P>Now it is evident from the narrative in Acts that the people who were prepared to worship Paul and Barnabas as gods were not Greeks or Romans, but native Lycaonians. This is conclusively brought out by the use of the phrase "in the speech of Lycaonia" (<a onClick="return mV(\'Act\',14,11);">Ac 14:11</a>). The language in ordinary use among the educated classes in Central Anatolian cities under the Roman Empire was Greek; in some of those cities, and especially of course, in Roman colonies, Latin also was understood, and it was used at this period in official documents. But the Anatolian element in the population of those cities continued for a long time to use the native language (e.g. Phrygian was in use at Iconium till the 3rd century of our era; see <a href="./study/isbe/search.html?string=ICONIUM">ICONIUM</a>). In the story in Acts a fast distinction is implied, and in fact existed, between the ideas and practices of the Greeks and the Roman colonists and those of the natives. This distinction would naturally maintain itself most vigorously in so conservative an institution as religious ritual and legend. We should therefore expect to find that the association between Zeus and Hermes indicated in Acts belonged to the religious system of the native population, rather than to that of the educated society of the colony. And this is precisely the character of the cult illustrated in our two inscriptions. It is essentially a native cult, under a thin Greek disguise. The names in those inscriptions can only have been the names of natives; the Zeus and Hermes of Acts and of our inscriptions were a graecized version of the Father-god and Son-god of the native Anatolian system. The college of priests which appears in inscription <span class="noTag">number 1</span> (supporting the Bezan variant "priests" for "priest" in <a onClick="return mV(\'Act\',14,13);">Ac 14:13</a>) was a regular Anatolian institution. The miracle performed by Paul, and his companionship with Barnabas would naturally suggest to the natives who used the "speech of Lycaonia" a pair of gods commonly associated by them in a local cult. The two gods whose names rose to their lips are now known to have been associated by the dedication of a statue of one in a temple, of the other in the neighborhood of Lystra.<P>LITERATURE.<P>Ramsay, Cities of Paul, 407ff. On the new inscriptions, see Calder, The Expositor, 1910, 1ff, 148ff; id, Classical Review, 1910, 67ff. Inscriptions of Lystra are published in Sterrett, Wolfe Expedition, and in Jour. Hell. Stud., 1904 (Cronin).``20';
isbe[5631]='Maacah`ma\'-a-ka (ma\'akhah; Septuagint: Codex Vaticanus Mocha; Codex Alexandrinus Maacha): A small Syrian kingdom adjoining that of Geshur on the western border of Bashan, the inhabitants of which are called Maachathites (the Revised Version (British and American) "Maacathites"), whose territory was taken by Jair (<a onClick="return mV(\'Deu\',3,14);">De 3:14</a>; <a onClick="return mV(\'Jos\',12,5);">Jos 12:5</a>). The border of the Geshurites and the Maacathites and all Mt. Hermon were given to the half-tribe of Manasseh (<a onClick="return mV(\'Jos\',13,11);">Jos 13:11</a>). The inhabitants of these kingdoms, however, were not driven out by Israel (<a onClick="return mV(\'Jos\',13,13);">Jos 13:13</a>), and at a later day the children of Ammon hired mercenaries from Maacah for their encounter with David. The armies met near Medeba when the "Syrians" from Maacah found themselves opposed to Joab. That famous captain completely routed them (<a onClick="return mV(\'2Sa\',10,6);">2Sa 10:6</a>ff the Septuagint has "Amalek"). In <a onClick="return mV(\'1Ch\',19,6);">1Ch 19:6</a> it is called Aram-maacah, Syria-maachah (the King James Version); and in <a onClick="return mV(\'1Ch\',2,23);">1Ch 2:23</a> "Aram" appears instead of "Maacah."<P>It evidently lay between Geshur on the south and Hermon on the north, being probably bounded by Jordan on the west, although no certain indication of boundaries is now possible. They would thus be hemmed in by Israel, which accounts for \'Geshur and Maacath dwell in the midst of Israel" (<a onClick="return mV(\'Jos\',13,13);">Jos 13:13</a>). It is possible that Abel-beth-maacah may have been a colony founded by men from Maacah.``54';
isbe[5632]='Maacah; Maachah`ma\'-a-ka (ma\'akhah):<P>(1) Septuagint: Codex Vaticanus Mocha; Codex Alexandrinus Mocha, daughter of Nahor, borne to him by Reumah (<a onClick="return mV(\'Gen\',22,24);">Ge 22:24</a>).<P>(2) Septuagint: Codex Vaticanus Maacha; Codex Alexandrinus Maachath, the one wife of David who was of royal rank, the daughter of Talmai, king of Geshur, who became the mother of Absalom (<a onClick="return mV(\'2Sa\',3,3);">2Sa 3:3</a>; <a onClick="return mV(\'1Ch\',3,2);">1Ch 3:2</a>).<P>(3) Maacha, father of Achish, king of Gath (<a onClick="return mV(\'1Ki\',2,39);">1Ki 2:39</a>). He is probably referred to as "Maoch" in <a onClick="return mV(\'1Sa\',27,2);">1Sa 27:2</a>.<P>(4) The daughter of Absalom, the favorite wife of Rehoboam, and mother of Abijah (<a onClick="return mV(\'1Ki\',15,2);">1Ki 15:2</a>; <a onClick="return mV(\'2Ch\',11,20);">2Ch 11:20</a>, etc.). Evidently "daughter" must here be understood as "granddaughter," according to a common oriental usage. Tamar was the only daughter of Absalom. If Tamar married Uriel of Gibeah (<a onClick="return mV(\'2Ch\',13,2);">2Ch 13:2</a>), then Maacah was her daughter. In that case the name Micaiah in this passage would be either a copyist\'s error or a variant of Maacah. She must have been a woman of strong personality. Unfortunately, her influence was cast upon the side of idolatry. She maintained her position in the palace, however, till the reign of her grandson Asa. Possibly she acted as regent during his minority. Ultimately, she was degraded by him for an act of peculiar infamy (<a onClick="return mV(\'1Ki\',15,13);">1Ki 15:13</a>; <a onClick="return mV(\'2Ch\',15,16);">2Ch 15:16</a>).<P>(5) Concubine of Caleb, son of Hezron (<a onClick="return mV(\'1Ch\',2,48);">1Ch 2:48</a>).<P>(6) Sister of Huppim and Shuppim the Benjamites, who became the wife of Machir the Manassite, the "father" of Gilead (<a onClick="return mV(\'1Ch\',7,12,15);">1Ch 7:12,15</a>f).<P>(7) Wife of Jeiel, the "father" of Gibeon, an ancestress of King Saul (<a onClick="return mV(\'1Ch\',8,29);">1Ch 8:29</a>; <a onClick="return mV(\'1Ch\',9,35);">9:35</a>).<P>(8) Father of Hanan, one of David\'s mighty men (<a onClick="return mV(\'1Ch\',11,43);">1Ch 11:43</a>).<P>(9) Father of Shephatiah, ruler of the Simeonites under David (<a onClick="return mV(\'1Ch\',27,16);">1Ch 27:16</a>).``54';
isbe[5633]='Maacathites`ma-ak\'-a-thits hama\'akhathi; Septuagint: Codex Vaticanus ho Machatei; Codex Alexandrinus Machathi): Mentioned in Scripture are Ahasbai (<a onClick="return mV(\'2Sa\',23,34);">2Sa 23:34</a>), Jaazaniah (<a onClick="return mV(\'2Ki\',25,23);">2Ki 25:23</a>), Naham (<a onClick="return mV(\'1Ch\',4,19);">1Ch 4:19</a>) and Jezaniah (<a onClick="return mV(\'Jer\',40,8);">Jer 40:8</a>).`<a href="./study/isbe/search.html?string=MAACAH">MAACAH</a>`1';
isbe[5634]='Maadai`ma-a-da\'-i, ma\'-a-di (ma\'adhay): Son of Bani; one of those who married foreign wives (<a onClick="return mV(\'Ezr\',10,34);">Ezr 10:34</a>).``1';
isbe[5635]='Maadiah`ma-a-di\'-a (ma\'adhyah, "whose ornament is Jah"): A priest who returned with Zerubbabel (<a onClick="return mV(\'Neh\',12,5);">Ne 12:5</a>). The name also occurs in the form "Moadiah" (<a onClick="return mV(\'Neh\',12,17);">Ne 12:17</a>).``1';
isbe[5636]='Maai`ma-a\'-i, ma\'i (ma\'ay): An Asaphite musician who took part in the ceremony of the dedication of the walls (<a onClick="return mV(\'Neh\',12,36);">Ne 12:36</a>).``1';
isbe[5637]='Maaleh-Acrabbim`ma\'-a-la-a-krab\'-im, ma-al\'-a-.`<a href="./study/isbe/search.html?string=AKRABBIM">AKRABBIM</a>`1';
isbe[5638]='Maani`ma\'-a-ni (Maani):<P>(1) the King James Version "Meani" (1Esdras 5:31), corresponding to "Meunim" in <a onClick="return mV(\'Ezr\',2,50);">Ezr 2:50</a>; <a onClick="return mV(\'Neh\',7,52);">Ne 7:52</a>.<P>(2) the Revised Version (British and American) "Baani," head of a family, many of whom had married foreign wives (1Esdras 9:34; called "Bani" in <a onClick="return mV(\'Ezr\',10,34);">Ezr 10:34</a>).``1';
isbe[5639]='Maarath`ma\'-a-rath (ma\'arath): A city in the hill country of Judah, mentioned between Gedor and Beth-anoth (<a onClick="return mV(\'Jos\',15,59);">Jos 15:59</a>). The small village of Beit Ummar upon the watershed, a little to the west of the carriage road to Hebron and about a mile from Khirbet Jedur (Gedor), is a probable site. There are many rock tombs to its east. The village mosque is dedicated to Nebi Matta, i.e. Matthew. See PEF, III, 305, Sh XXI.``1';
isbe[5640]='Maareh-Geba`ma\'-a-re-ge\'-ba, -ga\'-ba (ma\'areh gebha\'; Septuagint: Codex Vaticanus Maraagabe; Codex Alexandrinus dusmon tes Gabaa): The place where the men of Israel lay in ambush, from which they broke forth upon the children of Benjamin (<a onClick="return mV(\'Jdg\',20,33);">Jud 20:33</a>). the King James Version renders "the meadows of Gibeah," the Revised Version margin "the meadow of Geba (or Gibeah)." The Septuagint\'s Codex Alexandrinus affords a clue to the correct reading. It to read place-name. The text must be emended to read mima\'arabh legebha\', "to the west of Geba." Peshitta suggests a reading mime-\'arath gebha\', "from the cave of Geba." This, however, there is nothing to warrant.``54';
isbe[5641]='Maasai`ma\'-a-si, ma-as\'-i (ma\'say; the King James Version, Maasiai): A priest, son of Abdid (<a onClick="return mV(\'1Ch\',9,12);">1Ch 9:12</a>).``1';
isbe[5642]='Maaseas`ma-a-se\'-as (Maasaios; the King James Version Maasias): Grandfather of Baruch (Baruch 1:1); called Mahseiah in <a onClick="return mV(\'Jer\',32,12);">Jer 32:12</a>; <a onClick="return mV(\'Jer\',51,59);">51:59</a>.``1';
isbe[5643]='Maaseiah`ma-a-se\'-ya, ma-a-si\'a (ma\'aseyahu, "Yahweh\'s work"; Maassaia, and Massaias in the Septuagint): A name common in exilic and late monarchic times (Gray, H P N).<P>(1) A Levite musician named in connection with David\'s bringing up of the ark from the house of Obed-edom (<a onClick="return mV(\'1Ch\',15,18,20);">1Ch 15:18,20</a>).<P>(2) A Levite captain who aided Jehoiada at the coronation of Joash (<a onClick="return mV(\'2Ch\',23,1);">2Ch 23:1</a>).<P>(3) An officer of Uzziah (<a onClick="return mV(\'2Ch\',26,11);">2Ch 26:11</a>).<P>(4) Ahaz\' son, slain by the Ephraimite, Zichri (<a onClick="return mV(\'2Ch\',28,7);">2Ch 28:7</a>).<P>(5) A governor of Jerusalem under Josiah (<a onClick="return mV(\'2Ch\',34,8);">2Ch 34:8</a>).<P>(6) (7) (8) (9) The name of 4 men, 3 of them priests, who had married foreign wives (<a onClick="return mV(\'Ezr\',10,18,21,22,30);">Ezr 10:18,21,22,30</a>).<P>(10) Father of Azariah, one of the builders of the wall (<a onClick="return mV(\'Neh\',3,23);">Ne 3:23</a>).<P>(11) One of those who stood at Ezra\'s right hand during the reading of the Law (<a onClick="return mV(\'Neh\',8,4);">Ne 8:4</a>).<P>(12) One of the expounders of the Law (<a onClick="return mV(\'Neh\',8,7);">Ne 8:7</a>).<P>(13) One of those who took part in sealing the covenant (<a onClick="return mV(\'Neh\',10,25);">Ne 10:25</a>).<P>(14) A Judahite inhabitant of Jerusalem (<a onClick="return mV(\'Neh\',11,5);">Ne 11:5</a>), who in <a onClick="return mV(\'1Ch\',9,5);">1Ch 9:5</a> is called Asaiah.<P>(15) A Benjamite (<a onClick="return mV(\'Neh\',11,7);">Ne 11:7</a>).<P>(16) (17) Name of two priests (<a onClick="return mV(\'Neh\',12,41);">Ne 12:41</a>f).<P>(18) A priest in Zedekiah\'s reign, father of a certain Zephaniah who interviewed the prophet Jeremiah (<a onClick="return mV(\'Jer\',21,1);">Jer 21:1</a>; <a onClick="return mV(\'Jer\',29,25);">29:25</a>; <a onClick="return mV(\'Jer\',37,3);">37:3</a>).<P>(19) Father of the false prophet Zedekiah (<a onClick="return mV(\'Jer\',29,21);">Jer 29:21</a>).<P>(20) A keeper of the threshold in the reign of Jehoiakim (<a onClick="return mV(\'Jer\',35,4);">Jer 35:4</a>).<P>(21) <a href="./study/isbe/search.html?string=BAASEIAH">Baaseiah</a> (which see), a Kohathite name (<a onClick="return mV(\'1Ch\',6,40);">1Ch 6:40</a>), is probably a textual error for Maaseiah.<P>(22) the King James Version for Mahseiah, an ancestor of Baruch (<a onClick="return mV(\'Jer\',32,12);">Jer 32:12</a>).``95';
isbe[5644]='Maasiai`ma-as\'-i-i.`<a href="./study/isbe/search.html?string=MAASAI">MAASAI</a>`1';
isbe[5645]='Maasmas`ma-as\'-mas, ma\'-as-mas (Maasmas; Swete reads Maasman; the King James Version Masman, 1Esdras 8:43): Corresponds to "Shemaiah" in <a onClick="return mV(\'Ezr\',8,16);">Ezr 8:16</a>.``1';
isbe[5646]='Maath`ma\'-ath (Maath): An ancestor of Jesus in Luke\'s genealogy in the 12th generation before Joseph, the husband of Mary (<a onClick="return mV(\'Luk\',3,26);">Lu 3:26</a>).``1';
isbe[5647]='Maaz`ma\'-az (ma\'ats): A descendant of Judah (<a onClick="return mV(\'1Ch\',2,27);">1Ch 2:27</a>).``1';
isbe[5648]='Maaziah`ma-a-zi\'-a (ma\'azyahu):<P>(1) The priest to whom fell the lot for the 24th course (<a onClick="return mV(\'1Ch\',24,18);">1Ch 24:18</a>).<P>(2) One of those who took part in sealing the covenant (<a onClick="return mV(\'Neh\',10,8);">Ne 10:8</a>).``1';
isbe[5649]='Mabdai`mab\'-da-i.`<a href="./study/isbe/search.html?string=MAMDAI">MAMDAI</a>`1';
isbe[5650]='Mabnabedai`mab-nab\'-e-di.`<a href="./study/isbe/search.html?string=MACHNADEBAI">MACHNADEBAI</a>`1';
isbe[5651]='Macalon`mak\'-a-lon (hoi ek Makalon; 1Esdras 5:21): This corresponds to "the men of Michmas" in <a onClick="return mV(\'Ezr\',2,27);">Ezr 2:27</a>. The mistake has probably arisen through reading Macalon in Greek uncials for "AL".``1';
isbe[5652]='Maccabaeus; Maccabees`mak-a-be\'-us (Makkabaios), mak\'-a-bez (hoi Makkabaioi):<P><b>I. PALESTINE UNDER KINGS OF SYRIA</b><P class="in15">1. Rivalry of Syria and Egypt<P class="in15">2. Palestine Seized by Antiochus the Great<P class="in15">3. Accession of Antiochus Epiphanes<P><b>II. PALESTINE UNDER THE MACCABEES</b><P class="in15">1. Mattathias<P class="in15">2. Judas<P class="in15">3. Jonathan<P class="in15">4. Simon<P class="in15">5. John Hyrcanus<P class="in15">6. John and Eleazar<P><b>LITERATURE</b></a><hr /><P>The name Maccabeus was first applied to Judas, one of the sons of Mattathias generally called in English the Maccabees, a celebrated family who defended Jewish rights and customs in the 2nd century BC (1Macc 2:1-3). The word has been variously derived (e.g. as the initial letters of Mi Khamokha, Ba-\'elim Yahweh! "Who is like unto thee among the mighty, O Yahweh ?"), but it is probably best associated with maqqabhah "hammer," and as applied to Judas may be compared with the malleus Scotorum and malleus haereticorum of the Middle Ages (see next article [<A href="./study/isbe/search.html?string=MACCABEES,+BOOKS+OF,+1-2">Maccabees, Books of, 1-2</a>]). To understand the work of the Maccabees, it is necessary to take note of the relation in which the Jews and Palestine stood at the time to the immediately neighboring nations.<P>I. Palestine under Kings of Syria.<P>1. Rivalry of Syria and Egypt:<P>On the division of Alexander\'s empire at his death in the year 323 BC, Palestine became a sort of buffer state between Egypt under the Ptolemies on the south, and Syria, under the house of Seleucus, the last survivor of Alexander\'s generals, on the north. The kings of Syria, as the Seleucid kings are generally called, though their dominion extended practically from the Mediterranean Sea to India, had not all the same name, like the Ptolemies of Egypt, though most of them were called either Seleucus or Antiochus. For a hundred years after the death of Alexander, the struggle went on as to which of the two powers was to govern Palestine, until in the year 223 came the northern prince under whom Palestine was destined to fall to the Seleucids for good.<P>2. Palestine Seized by Antiochus the Great:<P>This was Antiochus III, commonly known as Antiochus the Great. He waged two campaigns against Egypt for the possession of Palestine, finally gaining the upper hand in the year 198 BC by his victory at Panium, so called from its proximity to a sanctuary of the god Pan, a spot close to the sources of the Jordan and still called Banias. The Jews helped Antiochus to gain the victory and, according to Josephus, his rule was accepted by the Jews with good will. It is with him and his successors that the Jews have now to deal. Antiochus, it should be noticed, came in contact with the Romans after their conquest of Macedonia in 197, and was defeated by Scipio Asiaticus at Magnesia in 190. He came under heavy tribute which he found it difficult to pay, and met his end in 187, while plundering a Greek temple in order to secure its contents. His son and successor Seleucus IV was murdered by his prime minister Heliodorus in 176-175 BC, who reaped no benefit from his crime.<P>3. Accession of Antiochus Epiphanes:<P>The brother of the murdered king succeeded to the throne as Antiochus IV, generally known as Antiochus Epiphanes ("the Illustrious"), a typical eastern ruler of considerable practical ability, but whose early training while a hostage at Rome had made him an adept in dissimulation. Educated in the fashionable Hellenism of the day, he made it his aim during his reign (175-164 BC) to enforce it upon his empire a policy which brought him into conflict with the Jews. Even before his reign many Jews had yielded to the attraction of Greek thought and custom, and the accession of a ruler like Antiochus Epiphanes greatly increased the drift in that direction, as will be found described in the article dealing with the period between the Old and the New Testaments (see <a href="./study/isbe/search.html?string=BETWEEN+THE+TESTAMENTS">BETWEEN THE TESTAMENTS</a>). Pious Jews meanwhile, men faithful to the Jewish tradition, Chasidim (see <a href="./study/isbe/search.html?string=HASIDAEANS">HASIDAEANS</a>), as they were called, resisted this tendency, and in the end were driven to armed resistance against the severe oppression practiced by Antiochus in advancing his Hellenizing views.<P>See <a href="./study/isbe/search.html?string=ASMONEANS">ASMONEANS</a>.<P>II. Palestine under the Maccabees.<P>1. Mattathias:<P>Mattathias, a priest of the first 24 courses and therefore of the noblest who dwelt at Modin, a city of Judah, was the first to strike a blow. With his own hand he slew a Jew at Modin who was willing to offer the idolatrous sacrifices ordered by the king, and also Apelles, the leader of the king\'s messengers (1Macc 2:15-28). He fled with his sons to the mountains (168 BC), where he organized a successful resistance; but being of advanced age and unfit for the fatigue of active service, he died in 166 BC and was buried "in the sepulchres of his fathers" at Modin (1Macc 2:70; Josephus, Ant, XII, vi, 3). He apparently named as his successor his 3rd son, Judas, though it was with real insight that on his deathbed he recommended the four brothers to take Simon as their counselor (1Macc 2:65).<P>2. Judas:<P>Judas, commonly called Judas Maccabeus—often called in 2Maccabees "Judas the Maccabee"—held strongly the opinions of his father and proved at least a very capable leader in guerrilla warfare. He defeated several of the generals of Antiochus—Apollonius at Beth-horon, part of the army of Lysias at Emmaus (166 BC), and Lysias himself at Bethsura the following year. He took possession of Jerusalem, except the "Tower," where he was subsequently besieged and hard pressed by Lysias and the young king Antiochus Eupator in 163 BC; but quarrels among the Syrian generals secured relief and liberty of religion to the Jews which, however, proved of short duration. The Hellenizing Jews, with <a href="./study/isbe/search.html?string=ALCIMUS">ALCIMUS</a> (which see) at their head, secured the favor of the king, who sent Nicanor against Judas. The victory over Nicanor first at Capharsalama and later (161 BC) at Adasa near Beth-horon, in which engagement Nicanor was slain, was the greatest of Judas\' successes and practically secured the independence of the Jews. The attempt of Judas to negotiate an alliance with the Romans, who had now serious interests in these regions, caused much dissatisfaction among his followers; and their defection at Elasa (161 BC), during the invasion under Bacchides, which was undertaken before the answer of the Roman Senate arrived, was the cause of the defeat and death of Judas in battle. His body was buried "in the sepulchres of his fathers" at Modin. There is no proof that Judas held the office of high priest like his father Mattathias. (An interesting and not altogether favorable estimate of Judas and of the spiritual import of the revolt will be found in Jerusalem under the High Priests, 97-99, by E.R. Bevan, London, 1904.)<P>3. Jonathan:<P>Jonathan (called Apphus, "the wary"), the youngest of the sons of Mattathias, succeeded Judas, whose defeat and death had left the patriotic party in a deplorable condition from which it was rescued by the skill and ability of Jonathan, aided largely by the rivalries among the competitors for the Syrian throne. It was in reality from these rivalries that resulted the 65 years (129-64 BC) of the completely independent rule of the Hasmonean dynasty (see <a href="./study/isbe/search.html?string=ASMONEANS">ASMONEANS</a>) that elapsed between the Greek supremacy of the Syrian kings and the Roman supremacy established by Pompey. The first step toward the recovery of the patriots was the permission granted them by Demetrius I to return to Judea in 158 BC—the year in which Bacchides ended an unsuccessful campaign against Jonathan and in fact accepted the terms of the latter. After his departure, Jonathan "judged the people at Michmash" (1Macc 9:73). Jonathan was even authorized to reenter Jerusalem and to maintain a military force, only the "Tower" the Akra, as it was called in Greek, being held by a Syrian garrison.<P>See further under <a href="./study/isbe/search.html?string=ASMONEANS">ASMONEANS</a>; <a href="./study/isbe/search.html?string=LACEDAEMONIANS">LACEDAEMONIANS</a>; <a href="./study/isbe/search.html?string=TRYPHON">TRYPHON</a>.<P>4. Simon:<P>Simon, surnamed Thassi ("the zealous"?) was now the only surviving member of the original Maccabean family, and he readily took up the inheritance. Tryphon murdered the boy-king Antiochus Dionysus and seized the throne of Seleucus, although having no connection with the Seleucid family. Simon accordingly broke entirely with Tryphon after making successful overtures to Demetrius, who granted the fullest immunity from all the dues that had marked the Seleucid supremacy. Even the golden crown, which had to be paid on the investiture of a new high priest, was now remitted. On the 23rd of Ijjar (May),141,the patriots entered even the Akra "with praise and palm branches, and with harps, and with cymbals and with viols, and with hymns, and with songs" (1Macc 13:51). Simon was declared in a Jewish assembly to be high priest and chief of the people "for ever, until there should arise a prophet worthy of credence" (1Macc 14:41), a limitation that was felt to be necessary on account of the departure of the people from the Divine appointment of the high priests of the old line and one that practically perpetuated the high-priesthood in the family of Simon. Even a new era was started, of which the high-priesthood of Simon was to be year 1, and this was really the foundation of the Hasmonean dynasty (see <a href="./study/isbe/search.html?string=ASMONEANS">ASMONEANS</a>).<P>5. John Hyrcanus:<P>John Hyrcanus, one of the sons of Simon, escaped from the plot laid by Ptolemy, and succeeded his father, both as prince and high priest. See <a href="./study/isbe/search.html?string=ASMONEANS">ASMONEANS</a>. He was succeeded (104 BC) by his son Aristobulus I who took the final step of assuming the title of king.<P>6. John and Eleazar:<P>Two members of the first generation of the Maccabean family still remain to be mentioned:<P>(1) John, the eldest, surnamed Gaddis (the King James Version "Caddis"), probably meaning "my fortune," was murdered by a marauding tribe, the sons of <a href="./study/isbe/search.html?string=JAMBRI">JAMBRI</a> (which see), near Medeba, on the east of the Jordan, when engaged upon the convoy of some property of the Maccabees to the friendly country of the Nabateans (1Macc 9:35-42).<P>(2) Eleazar, surnamed Avaran, met his death (161 BC) in the early stage of the Syrian war, shortly before the death of Judas. In the battle of Bethzacharias (163 BC), in which the Jews for the first time met elephants in war, he stabbed from below the elephants on which he supposed the young king was riding. He killed the elephant but he was himself crushed to death by its fall (1Macc 6:43-46). For the further history of the Hasmonean dynasty, see <a href="./study/isbe/search.html?string=ASMONEANS">ASMONEANS</a>; <a href="./study/isbe/search.html?string=MACCABEES,+BOOKS+OF">MACCABEES, BOOKS OF</a>.<P>LITERATURE.<P>There is a copious literature on the Maccabees, a family to which history shows few, if any, parallels of such united devotion to a sacred cause. The main authorities are of course the Maccabean Books of the Apocrypha; but special reference may be made to the chapters of Stanley, Lectures on the History of the Jewish Church, dealing with the subject, and to E.R. Bevan. Jerusalem under the High Priests,1904,or to the 2nd volume of House of Seleucus by the same author, 1902.``79';
isbe[5653]='Maccabees, Books of, 1-2`mak\'-a-bez,<p><b>I. 1 MACCABEES</b><P class="in15">1. Name<P class="in15">2. Canonicity<P class="in15">3. Contents<P class="in15">4. Historicity<P class="in15">5. Author\'s Standpoint and Aim<P class="in15">6. Date<P class="in15">7. Sources<P class="in15">8. Original Language<P class="in15">9. Text and Versions<P><b>LITERATURE</b><p><b>II. 2 MACCABEES</b><P class="in15">1. Name<P class="in15">2. Canonicity<P class="in15">3. Contents<P class="in15">4. Sources<P class="in15">5. Historicity<P class="in15">6. Teaching of the Book<P class="in15">7. Author<P class="in15">8. Date<P class="in15">9. Original Language<P class="in15">10. Text and Versions<P><b>LITERATURE</b><p><b>III. 3 MACCABEES</b><P class="in15">1. Name<P class="in15">2. Canonicity<P class="in15">3. Contents<P class="in15">4. Historicity<P class="in15">5. Aim and Teaching<P class="in15">6. Authorship and Date<P class="in15">7. Original Language<P class="in15">8. Text and Versions<P><b>LITERATURE</b><P><b>IV. 4 MACCABEES</b><P class="in15">1. Name<P class="in15">2. Canonicity<P class="in15">3. Contents<P class="in15">4. Teaching<P class="in15">5. Authorship and Date<P class="in15">6. Original Language<P class="in15">7. Text and Versions<P><b>LITERATURE</b><P><b>V. 5 MACCABEES</b><P class="in15">1. Name<P class="in15">2. Canonicity <P class="in15">3. Contents<P class="in15">4. Historicity<P class="in15">5. Original Language<P class="in15">6. Aim and Teaching<P class="in15">7. Authorship and Date<P class="in15">8. Text and Versions<P><b>LITERATURE</b><hr /><P>I. 1Maccabees.<P>1. Name:<P>The Hebrew title has perished with the original Hebrew text. Rabbinical writers call the Books of Maccabees ciphere ha-chashmonim, "The Book of the Hasmoneans" (see <a href="./study/isbe/search.html?string=ASMONEANS">ASMONEANS</a>). Origen gives to Book I (the only one he seemed to know of) the name Sarbeth Sabanaiel, evidently a Hebrew or Aramaic name of very uncertain meaning, but which Dalman (Aramaic Grammar, section 6) explains as a corruption of Aramaic words= "The Book of the House of the Hasmoneans" (compare the rabbinical name given above). In the Greek manuscripts N, V (Codex Venetus), the 4 books go under the designation Makkabaion, [Codices Alexandrinus, Vaticanus, Gamma Delta, biblos, being understood. In the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) the 1st and 2nd books are alone found, and appear under the name Machabaeorum liber primus, secundus. The spelling Machabaeorum reproduces probably the pronunciation current in Jerome\'s day.<P>The name "Maccabee" belongs strictly only to Judas, who in 2Maccabees is usually called "the Maccabee" (ho Makkabaios). But the epithet came to be applied to the whole family and their descendants. The word means probably "extinguisher" (of persecution) (makhbi, from kabhah, "to be extinguished"; so Niese; Josephus, Ant, XII, vi, 1f; S.J. Curtis, The Name Maccabee). The more usual explanation, "hammerer" (maqqabhay), is untenable, as the noun from which it is derived (maqqebheth) (<a onClick="return mV(\'Jdg\',4,21);">Jud 4:21</a>) denotes a smith\'s hammer.<P>2. Canonicity:<P>Since the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) includes only the first 2 books of Maccabees, these are the only books pronounced canonical by the Council of Trent and included in recognized Protestant versions of the Apocrypha (see <a href="./study/isbe/search.html?string=APOCRYPHA">APOCRYPHA</a>). That 1Maccabees was used largely in the early Christian church is proved by the numerous references made to it and quotations from it in the writings of Tertullian (died 220), Clement of Alexandria (died 220), Hippolytus (died 235), Origen (died 254), etc. The last named states that 1Maccabees is uncanonical, and it is excluded from the lists of canonical writings given by Athanasius (died 373), Cyril of Jerusalem (died 386), and Gregory of Nazianzus (died 390). Indeed, none of the books of the Maccabees was recognized as canonical until the Council of Trent (1553) gave this rank to the first 2 books, and Protestants continue in their confessions to exclude the whole of the Apocrypha from the Bible proper, though Luther maintained that 1Maccabees was more worthy of a place in the Canon than many books now included in it.<P>3. Contents:<P>1Maccabees gives first of all a brief view of the reign of Alexander the Great and the partition of his kingdom among his successors. Having thus explained the origin of the Seleucid Dynasty, the author proceeds to give a history of the Jews from the accession of Antiochus IV, king of Syria (175 BC), to the death of Simon (135 BC). The events of these 40 years are simply but graphically related and almost entirely in the order of their occurrence. The contents of 1Maccabees and 2Macc 4-15 are in the main parallel, dealing with the same incidents; but the simple narrative character of 1Maccabees, in contrast to the didactic and highly religious as well as supernatural coloring of 2Maccabees, can easily be seen in these corresponding parts. The victories due to heroism in 1Maccabees are commonly ascribed to miraculous intervention on the part of God in 2Maccabees (see 1Macc 4:1f; compare 2Macc 8:23f). 2Maccabees is more given to exaggerations. The army of Judas at Bethsura consists of 10,000 according to 1Macc 4:29, but of 80,000 according to 2Macc 11:2. The following is a brief analysis of 1Maccabees:<P>(1) 1Maccabees 1:1-10: An account of the rise of the Seleucid Dynasty.<P>(2) 1Maccabees 1:11-16:24: History of the Jews from 175 to 135 BC.<P>(a) 1Maccabees 1:11-64: Introductory. Some Jews inclined to adopt Greek customs (religious, etc.); Antiochus\' aim to conquer Egypt and to suppress the Jewish religion as a source of Jewish disloyalty. Desecration of the Jewish temple: martyrdom of many faithful Jews.<P>(b) 1Maccabees 2:1-70: The revolt of Mattathias<P>(c) 1Maccabees 3:1-9:22: Leadership of Judas Maccabeus after his father\'s death. Brilliant victories over the Syrians. Purification of the temple. Death of Antiochus IV (Epiphanes) and accession of Antiochus V (Eupator) (164 BC). Demetrius I became king of Syria, and Alcimus Jewish high priest (162 BC). Treaty between Jews and Romans. Defeat of Jews at Eleasa and death of Judas Maccabeus (161 BC).<P>(d) 1Maccabees 9:23-12:53: Leadership of Jonathan, 5th son of Mattathias, elected to succeed his brother Judas. He becomes high priest. Political independence of Judea secured.<P>(e) 1Maccabees 13:31-16:24: Peaceful and prosperous rule of Simon, brother of Jonathan; accession of his son John Hyrcanus (135 BC).<P>4. Historicity:<P>That the author of 1Maccabees aims at giving a correct narrative, and that on the whole his account is correct, is the opinion of practically all scholars. The simple, straight-forward way in which he writes inspires confidence, and there can be no doubt that we have here a first-class authority for the period covered (175-135 BC). It is the earliest Jewish history which dates events in reference to a definite era, this era being that of the Seleucids, 312 BC, the year of the founding of that dynasty. The aid received from God is frequently recognized in the book (<span class="noTag">2:51ff; 3:18; 4:10f; 9:46; 16:3</span>), yet it is mainly through personal valor that the Jews conquer, not, as in 2Maccabees (see III, 3 below), through miraculous Divine interpositions. Ordinary, secondary causes are almost the only ones taken into account, so that the record may be relied upon as on the whole trustworthy. Yet the writer shows the defects which belong to his age and environment, or what from the standpoint of literal history must be counted defects, though, as in the case of 2Maccabees (compare Chronicles), a writer may have other aims than to record bare objective facts. In 1:1-9 the author errs through ignorance of the real facts as regards Alexander\'s partition of his kingdom; and other misstatements of fact due to the same cause occur in 10:1ff (Alexander (Balas), son of Antiochus Epiphanes) and in 13:31ff (time of assassination of Antiochus VI by Tryphon). In 6:37 it is said there were 32 men upon each elephant, perhaps a misreading of the original "2 or 3," although the Indian elephant corps at the turn of this century carried more.<P>We know nothing of a Persian village Elymais (1Macc 6:1). The number of Jewish warriors that fought and the number slain are understated, while there are evident exaggerations of the number of soldiers who fought against them and of those of them who were left dead on the field (see 1Macc 4:15; 7:46; 11:45-51, etc.).<P>But in this book, prayers, speeches and official records abound as they do in Ezra, Nehemiah (see Century Bible, "Ezra," "Nehemiah," "Esther," 12ff), and many modern Protestant writers doubt or deny the authenticity of a part of those, though that is not necessarily to question their genuineness as part of the original narrative.<P>As regards the prayers (1Macc 3:50-54; 4:30-33) and speeches (1Macc 2:7-13; 2:50-68; 4:6-11, etc.), there is no valid reason for doubting that they give at least the substance of what was originally said or written, though ancient historians like Thucydides and Livy think it quite right to edit the speeches of their characters, abbreviating, expanding or altering. Besides, it is to be remembered that the art of stenography is a modern one; even Dr. Johnson, in default of verbatim reports, had to a large extent to make the speeches which he ostensibly reported.<P>There is, however, in the book a large number of official documents, and it is in regard to the authenticity of these that modern criticism has expressed greatest doubt. They are the following:<P class="in15">(1) Letter of the Jews in Gilead to Judas (1Macc 5:10-13).<P class="in15">(2) Treaty of alliance between the Romans and Jews; copy written on brass tablets sent to Judas (1Macc 8:22-32).<P class="in15">(3) Letter from King Alexander Balas to Jonathan (1Macc 10:18-20).<P class="in15">(4) Letter from King Demetrius I to Jonathan (1Macc 10:25-45).<P class="in15">(5) Letter from King Demetrius II to Jonathan (1Macc 11:30-37), together with letter to Lasthenes (1Macc 11:31-37).<P class="in15">(6) Letter from the young prince Antiochus to Jonathan, making the latter high priest (1Macc 11:57).<P class="in15">(7) Letter from Jonathan to the Spartans, asking for an alliance (1Macc 12:5-18).<P class="in15">(8) Earlier letter of the Spartan king Arius to the high priest Onias (1Macc 12:20-23).<P class="in15">(9) Letter from King Demetrius II to Simon (1Macc 13:36-40).<P class="in15">(10) Letter from the Spartans to Simon (1Macc 14:20-24).<P class="in15">(11) A decree of the Jews recognizing the services of Simon and his brothers (1Macc 14:27-45).<P class="in15">(12) Letters from Antiochus VII (Sidetes) to Simon (1Macc 15:2-9).<P class="in15">(13) Message from the Roman consul Lucius to Ptolemy, king of Egypt, asking protection for the Jews (1Macc 15:16-21). A copy was sent to Simon (1Macc 15:24).<P>Formerly the authenticity of these state documents was accepted without doubt, as they still are by Romanist commentators (Welte, Scholz, etc.). At most, they are but translations of translations, for the originals would be written in Greek and Latin, from which the author would translate into Hebrew. The Greek of our book is a translation from the Hebrew (see II, 8 below).<P>Rawlinson (Speaker\'s Apocrypha, II, 329) says these documents "have a general air of authenticity." Most modern scholars reject the letters purporting to emanate from the Romans (<span class="noTag">numbers</a> 2 and 13 above) and from the Spartans (<span class="noTag">numbers 8, 10</span> above), together with Jonathan\'s message to the latter (<span class="noTag">number 7</span>, above), on the ground that they contain some historical inaccuracies and imply others. How could one consul issue official mandates in the name of the Roman republic (see <span class="noTag">number 13</span>, above)? In <span class="noTag">number 8</span> above, it is the king of the Spartans who writes on behalf of his people to Onias the high priest; but it is the ephoroi or rulers who write for the Spartans to Simon. Why the difference? Moreover, in 1Macc 12:21 the Spartans and Jews are said to be kinsmen (literally, brothers), both alike being descendants of Abraham; so also 14:20. This is admittedly contrary to fact. For a careful examination of these official documents and their objective value, see Kautzsch, Die Apokryphen des Altes Testament, 27-30. Though, however, these documents and some others can be proved incorrect as they stand, they do seem to imply actual negotiations of the kind described; i.e. the Jews must have had communications with the Romans and Spartans, the Jews of Gilead must have sent a missive to Judas (<span class="noTag">number 1</span>), Alexander Balas did no doubt write to Jonathan, etc., though the author of 1Maccabees puts the matter in his own way, coloring it by his own patriotic and religious prejudices.<P>5. Author\'s Standpoint and Aim:<P>Though the name of the author is unknown, the book itself supplies conclusive evidence that he belonged to the Sadducee party, the party favored by the Hasmoneans. The aim of the writer is evidently historical and patriotic, yet his attitude toward religious questions is clearly indicated, both directly and indirectly.<P>(1) Nowhere in the book is the Divine Being mentioned under any name except Heaven (1Macc 3:18f; 50,60; 4:10,55; 12:15, etc.), a designation common in rabbinical Hebrew (Talmud, etc.). As early as 300 BC the sacred name "Yahweh" was discarded in favor of "Adonai" (Lord) for superstitious reasons. But in 1Maccabees no strictly Divine name meets us at all. This would seem to suggest the idea of a certain aloofness of God, such as characterized theology of the Sadducee party. Contrast with this the mystic closeness of God realized and expressed by the psalmists and prophets of the Old Testament.<P>(2) The author is a religious patriot, believing that his people have been Divinely chosen and that the cause of Israel is the cause of God.<P>(3) He is also a strict legalist, believing it the duty of every Jew to keep the Law and to preserve its institutions (1Macc 1:11,15,43,49,54,60,62f; 2:20ff, 27,42,48,50; 3:21, etc.), and deprecating attempts to compel Jews to desecrate the Sabbath and feast days (1Macc 1:45), to eat unclean food (1Macc 1:63) and to sacrifice to idols (1Macc 1:43). Yet the comparatively lax attitude toward the Sabbath implied in 1Macc 2:41ff, involving the principle of Christ\'s words, "The sabbath was made for man, and not man for the Sabbath" (<a onClick="return mV(\'Mar\',2,27);">Mr 2:27</a>), agrees with the Sadducee position against that of the Pharisees.<P>(4) The book teaches that the age of inspiration is past, and that the sacred books already written are the only source of comfort in sorrow and of encouragement under difficulties (1Macc 12:9).<P>(5) The legitimacy of the high-priesthood of Simon is not once questioned, though it is condemned by both the Deuteronomic law (D), which restricts the priesthood to the tribe of Levi, and by the priestly law (P), which requires in addition that a priest must be of the family of Aaron. This laxity agrees well with the general tenets of the Sadducees.<P>(6) The book contains no trace of the Messianic hope, though it was entertained at the time in other circles (the Pharisees; see <a href="./study/isbe/search.html?string=MESSIAH">MESSIAH, II, 2</a>; <a href="./study/isbe/search.html?string=Prophecy;+Prophets,+1">PROPHECY</a>); 1Macc 2:57 is no exception, for it implies no more than a belief that there would be a restoration of the Davidic Dynasty. Perhaps it is implied that that expectation was realized in the Hasmoneans.<P>(7) There is no reference in the book to the doctrine of a resurrection from the dead or to that of the immortality of the soul, though we know that both these beliefs were commonly held by Jews of the time (see <a onClick="return mV(\'Dan\',12,3);">Da 12:3</a>; <span class="noTag">Enoch 19; 22:11-14; 9:1,5ff; 2Macc 7:9,11,14,29</a>). We know that the Pharisee party believed in a resurrection (see <a onClick="return mV(\'Act\',23,6);">Ac 23:6</a>). The Maccabean heroes fought their battles and faced death without fear, not because, like Moslems, they looked to the rewards of another life, but because they believed in the rightness of their cause and coveted the good name won by their fathers by acts of similar courage and devotion.<P>This outline of the doctrines taught or implied in the book makes it extremely likely that the author was a member of the Sadducee party.<P>6. Date:<P>1Maccabees must have been written before the Roman conquest under Pompey, since the writer speaks of the Romans as allies and even friends (8:1,12; 12:1; 14:40); i.e. the composition of the book must have been completed (unless we except chapters 14-16; see below) before 63 BC, when Pompey conquered Jerusalem, and Judea became a Roman province. We thus get 63 BC as a terminus ad quem. Moreover, the historical narrative is brought down to the death of Simon (16:16), i.e. to 135 BC. We have thus an undoubted terminus a quo in 135 BC. The book belongs for certain to the period between 135 and 63 BC. But 1Macc 16:18-24 implies that John Hyrcanus (died 105 BC) had for some time acted as successor to Simon, and Reuss, Ewald, Fritzsche, Grimm, Schurer, Kautzsch, etc., are probably right in concluding from 16:23f that John was dead when the book was completed, for we have in this verse the usual formula recording the close of a royal career (see <a onClick="return mV(\'1Ki\',11,41);">1Ki 11:41</a>; <a onClick="return mV(\'2Ki\',10,34);">2Ki 10:34</a>, etc.), and the writer makes it sufficiently understood that all his acts were already "entered in the public annals of the kingdom" (Ewald, History of Israel, V, 463,note), so that repetition was unnecessary. But Bertheau, Keil, Wellhausen and Torrey draw the contrary conclusion, arguing that John had but begun his rule, so that at the time of writing there was practically nothing to record of the doings subsequent to 135, when John succeeded Simon (see EB, III, 2860 (Toy)). In 1Macc 13:30 we read that the monument erected in 143 BC by Simon in memory of his father and brothers was standing at the time when this book was written, words implying the lapse of say 30 years at least. This gives a terminus a quo of 113 BC. Moreover, the panegyric on Simon (died 135 BC) and his peaceful rule in 14:4-15 leaves the impression that he had been long in his grave. We cannot be far wrong in assigning a date for the book in the early part of the last century BC, say 80 BC.<P>Destinon (Die Quellen des Flavius Josephus, I, 1882, 80ff), followed by Wellhausen (IJG, 1894, 222f), maintained that Josephus (died circa 95), who followed 1Maccabees up to the end of chapter 13, could not have seen chapters 14-16 (or from 14:16?), or he would not have given so meager an account of the high-priesthood of Simon (see Ant, XIII, vi, 7), which the author of 1Maccabees describes so fully in those chapters. But Josephus must have used these chapters or he could not have written of Simon even as fully as he does.<P>7. Sources:<P>If, as Torrey (EB, III, 2862) holds, we have in 1Maccabees "the account of one who had witnessed the whole Maccabean struggle from its beginning," the book having been completed soon after the middle of the 2nd century BC, it may then be assumed that the writer depended upon no other sources than his own. But even in this case one is compelled, contrary to Torrey (loc. cit.), to assume that written sources of his own were used, or the descriptions would not have been so full and the dating so exact. If, however, we follow the evidence and bring down the date of the book to about 80 BC (see I, 6), it must be supposed that the author had access to written sources. It may legitimately be inferred from 1Macc 9:22 and 16:23 and from the habit of earlier times (see Century Bible, "Ezra," etc., 11ff) that official records were kept in the archives of the temple, or elsewhere. These might have contained the state documents referred to in I,4,some or all, and reports of speeches and prayers, etc. It must be admitted that, unlike the compilers of the historical books of the Old Testament (Samuel, Kings, Chronicles, etc.), the author of 1Maccabees does not definitely name his written sources. The writer might well be supposed to have kept a kind of diary of his own in which the events of his own early life were recorded. Oral tradition, much more retentive of songs, speeches and the like in ancient than in modern times, must have been a very important source.<P>8. Original Language:<P>We have the testimony of Origen (see I, 1) and Jerome (Prolog. Galeatus) that the book existed in Hebrew in their day. But it is doubtful whether the words of Origen imply a Hebrew or an Aramaic original, and though Jerome does speak of the book as Hebrew (hebraicus), it has to be remembered that in later times the Greek adjective denoting Hebrew (hebraisti) and perhaps the corresponding Latin one (hebraicus) often denoted Palestinian Aramaic (see <a onClick="return mV(\'Jdg\',5,2);">Jud 5:2</a>; <a onClick="return mV(\'Jdg\',19,13,17);">19:13,17</a>; and Kautzsch, Grammatik des bib. Aramaic, 19).<P>Hebraisms (or Aramaisms?) abound throughout the book. In the following examples Hebraisms are literally rendered in Greek, though in the latter language they are unidiomatic and often unintelligible: "two years of days" = two full years (1Macc 1:29, etc.); "month and month" = every month (1Macc 1:58); "a man (or each one) his neighbor" = each...the other (1Macc 2:40; 3:43); "sons of the fortress" = occupants of the fortress (1Macc 4:2); "against our face" = before us (1Macc 4:10); "men of power" = warriors (1Macc 5:32); "of them" = some of them (1Macc 6:2; compare 7:33, "of the priests" = some of the priests); "the right hand wing" = the southern wing (1Macc 9:1); "yesterday and the third day" = hitherto (1Macc 9:44). The above are strictly Hebraisms and not for the most part Aramaisms. The implied use of the "waw-consecutive" in 1Macc 3:1,41; 8:1; 9:1, and often, points also to a Hebrew, not to an Aramaic origin.. "Heaven" as a substitute for "God," so common in this book (see I, 5), is perhaps as much an Aramaism as a Hebraism (see Targum Jerusalem). Many of the proper names in the book are obviously but trans-literations from the Hebrew; thus, Phulistiein (1Macc 3:24); compare Sirach 46:18; 47:7; see the names in 1Macc 11:34; and Schurer, GJV4, I, 233.<P>9. Text and Versions:<P>The original Hebrew text of 1Maccabees (see I, 8) must have been lost at a very early time, since we have no evidence of its use by any early writer. J.D. Michaells held that Josephus used it, but this idea has been abandoned in the face of overwhelming evidence to the contrary. The Hebrew text of the first half of 1Macc, edited by A. Schweitzer and taken by him to be a part of the original text, is in reality a translation from the Latin made in the 11th century of our era (so Noldeke, etc.).<P>(1) Greek.<P>The Greek text from which the other versions are nearly all made is given in all editions of the Septuagint. It occurs in the uncials Codex Sinaiticus (Fritzsche, X), Codex Alexandrinus (Fritzsche, III), and Codex Venetus (8th or 9th century), not in Codex Vaticanus; and in a large number of cursives. Swete (Old Testament in Greek) gives the text of Codex Alexandrinus with the variations of Codex Sinaiticus and Codex Venetus. Though the Greek text has so many Hebraisms, it is an exceedingly good rendering, full of spirit and on the whole more idiomatic than the rest of the Septuagint.<P>(2) Latin.<P>There are two Latin recensions of the book: (a) that found in the Vulgate, which agrees almost entirely with the Old Latin version. It is in the main a literal rendering of the Greek (b) Sabatier (Bibliorum sacrorum Latinae versiones antiquae, II) published in 1743 a Latin version of 1Macc 1-13 found in but one manuscript (Sangermanensis). Though it is evidently made from the Greek it differs at many points from the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) It is probably older than the Old Latin and therefore than the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.)<P>(3) Syriac.<P>There are also two varying texts in this language.<P>(a) The best known is that printed in the Paris Polyglot (Vol. IX), copied with some changes into the London Polyglot (Vol. IV; for readings see volume V). Lagarde (Lib. Vet. Test. Apocrypha. Syriac., 1861) has edited this version, correcting and appending readings.<P>(b) A text differing in many respects from (a) is given by Ceriani in his Codex Ambros. of the Peshitta (1876-83), though this also is made from the Greek For a careful collection of both the above Syriac texts by G. Schmidt, see Z A T W,1897,1-47, 233-62.<P>LITERATURE.<P>See literature cited in the foregoing material. For texts and commentaries on the Apocrypha, see <a href="./study/isbe/search.html?string=APOCRYPHA">APOCRYPHA</a>. The following commentaries deserve special mention: Grimm, Kurz. exeg. Handbuch, etc., to which the commentaries by Keil (1 and 2Maccabees) and Bissel (Lange) owe very much; Kautzsch, Die Apocrypha des AT; W. Fair-weather and J.S. Black, Cambridge Bible, "1Maccabees," and Oesterley in the Oxford Apocrypha edited by R. H. Charles (1913). Of the dict. articles those in E B (Torrey) and H D B (Fairweather) are excellent. See also E. Montet, Essai sur les origines des saduceens et des pharisiens, 1885; Wibrich, Juden und Griechen vor der mak. Erhebung,1875,69-76; B. Niese, Kritik der beiden Makkabderbucher, 1900. For a very full bibliography see Schurer, GJ V4, III, 198ff, and his article "Apocrypha" in RE3, and in Sch-Herz.<p>II. 2Maccabees.<P>1. Name:<P>See I, above. The earliest extant mention of the book as 2 Maccabees is in Euseb., Praep. Evang., VIII, 9. Jerome also (Prol. Galeatus) calls it by this name.<P>2. Canonicity:<P>In the early church 2 Maccabees was much less valued and therefore less read than 1Maccabees. Augustine was the only church Father to claim for it canonical rank and even he in a controversy with the Donatists who quoted 2 Maccabees, replied that this book had never been received into the Canon. Since they formed an integral part of the Vulgate, 1 and 2 Maccabees were both recognized by the Council of Trent as belonging to the Romanist Canon.<P>3. Contents:<P>(1) 2 Maccabees 1-9:18:<P>Two letters from the Jews of Jerusalem to their brethren in Egypt, urging them to keep the Feast of Dedication and in a general way to observe the Law given them by God through Moses. Both letters appear designed to win for the Jerusalem temple the love and devotion which the Jews of Egypt were in danger of lavishing upon the Leontopolis temple in Egypt. These letters have no connection with the rest of the book or with each other, and both are undoubted forgeries. There can be no doubt that 2 Maccabees was first of all composed, and that subsequently either the author or a later hand prefixed these letters on account of their affinity in thought to the book as it first existed. See further on these letters II, 4 and 9.<P>(2) 2 Maccabees 2:19-32:<P>Introduction to what follows. The author or epitomizer claims that his history (chapter 3 to end of the book) is an epitome in one book of a larger work in 5 books by Jason of Cyrene. But see II,4,below.<P>(3) 2 Maccabees 3:1-15:39 (End of Book):<P>History of the rise and progress of the Maccabean wars from 176 BC, to the closing year of the reign of Seleucus IV Philopator, to the defeat and death of Nicanor in 161 BC, a period of 15 years. The record in 2 Maccabees begins one year earlier than that of 1 Maccabees, but as the latter reaches down to 135 BC (and probably below 105 BC; see I, 5), 1 Maccabees covers a period of at least 40 years, while 2 Maccabees gives the history of but 15 years (176-161 BC). The history of this period is thus treated:<P>(a) 2Macc 3:1-4:6: Traitorous conduct of the Benjamite Simon in regard to the temple treasures and the high priest; futile attempt of Heliodorus, prime minister of Seleucus IV, to rob the temple (see I,3,(11) above);<P>(b) 2Macc 4:7-7:42 parallel 1Macc 1:10-64 with significant variations and additions. Accession of Antiocus Epiphanes (175 BC); the Hellenizing of some Jews; persecution of the faithful; martyrdom of Eleazar and the 7 brethren and their mother (this last not in 1Maccabees);<P>(c) 2Macc 8-15 (end) parallel 1Macc 3-7, with significant divergences in details.<P>Rise and development of the Maccabean revolt (see I,3,above). In the closing verses (2Macc 15:38ff) the writer begs that this composition may be received with consideration.<P>The record of events in 2 Maccabees ends with the brilliant victory of Judas over Nicanor, followed by the death of the latter; but it is strange that the history of the main hero of the book should be dropped in the middle. Perhaps this abrupt ending is due to the writer\'s aim to commend to the Jews of Egypt the two new festivals, both connected with the Jerusalem temple:<P>(a) Chanukkah (Festival of Dedication) (1:9,18; 2:16; 10:8);<P>(b) Nicanor Day (15:36), to commemorate the defeat and death of Nicanor.<P>To end the book with the account of the institution of the latter gives it greater prominence.<P>4. Sources:<P>In its present form 2 Maccabees is based ostensibly on two kinds of written sources.<P>(1) In 2Macc 2:19-32 the writer of 3:1 to the end, which constitutes the book proper, says that his own work is but an epitome, clearly, artistically and attractively set out, of a larger history by one Jason of Cyrene. Most commentators understand this statement literally, and endeavor to distinguish between the parts due to Jason and those due to the epitomizer. Some think they see endings of the 5 books reflected in the summaries at 3:40; 7:42; 10:9; 13:26; 15:37. But W.H. Kosters gives cogent reasons for concluding that the reference to Jason is but a literary device to secure for his own composition the respect accorded in ancient, as in a lesser degree in modern, times to tradition. The so-called "epitomizer”is in that case alone responsible for the history he gives. The present writer has no hesitation in accepting these conclusions. We read such nowhere a large else of a historian called "Jason," or of such a large history at his must have been if it extended to 5 books dealing with the events of 15 years, though such a man and so great a work could hardly have escaped notice. Hitzig (Gesch. des Volkes Israels, II, 415) held that Jason or his supposed epitomizer made use of 1Maccabees, altering, adding and subtracting to suit his purpose. But the different order of the events and the contradictions in statements of facts in the 2 books, as well as the omission from 2 Maccabees of important items found in 1Maccabees, make Hitzig\'s supposition quite untenable. A careful examination of 2 Maccabees has led Grimm, Schurer, Zockler, Wibrich, Cornill, Torrey and others to the conclusion that the author depended wholly upon oral tradition. This gives the best clue to the anachronisms, inconsistencies and loose phrasing which characterize the book. According to 1Macc 4:26-33, the first campaign of Lysias into Judea took place in 165 BC, the year before the death of Antiochus IV; but 2Macc 11 tells us that it occurred in 163 BC, i.e. subsequent to the death of Antiochus IV. Moreover, in the latter passage this 1st expedition of Lysias is connected with the grant of freedom to the Jews, which is really an incident of the 2nd expedition, and in 2Macc 13:1-24 is rightly mentioned in the account of the 2nd expedition. The writer of 2 Maccabees, relying upon memory, evidently mixes up the stories of two different expeditions. Similarly the invasions of neighboring tribes under Judas, which are represented in 1Macc 5:1-68 as taking place in quick succession, belong, according to 2Macc 8:30; 10:15-38; 12:2-45, to separate dates and different sets of circumstances. The statements in 2 Maccabees are obscure and confused, those in 1Macc 5 clear and straightforward. Though in 2Macc 10:37 we read of the death of Timotheus, yet in 12:2ff he appears as a leader in other campaigns. There again the writer\'s memory plays him false as he recalls various accounts of the same events. It was Mattathias who gathered together the Jews and organized them for resistance against Syria, if we follow 1Macc 2:1-70; but 2Macc 8:1-7 ascribes this role to his son Judas. The purification of the temple took place 3 years subsequent to its profanation, according to 1Macc 1:54; 4:52, but only 2 years, according to 2Macc 10:3.<P>(2) The two letters sent from Palestinian to Egyptian Jews (2Macc 1:1-2:18) form no integral part of the original 2 Maccabees. They are clearly forgeries, and abound in inaccuracies and inconsistencies. The second letter, much the longer, gives an account of the death of Antiochus Epiphanes, which is irreconcilable with that in 9:1-28 and also with that in 1Macc 6:1-16. Nehemiah is said in 1:18 to have rebuilt the temple and altar, a work accomplished by Zerubbabel nearly a century earlier (<a onClick="return mV(\'Ezr\',3,3);">Ezr 3:3</a>; <a onClick="return mV(\'Ezr\',6,15);">6:15</a>). Nehemiah\'s work was to repair the gates and walls (<a onClick="return mV(\'Neh\',3,\'1-32\');">Ne 3:1-32</a>; <a onClick="return mV(\'Neh\',6,1);">6:1</a>; <a onClick="return mV(\'Neh\',7,1);">7:1</a>; Sirach 49:13). The writer of this letter says (2Macc 2:3-5) that at the time of the exile, Jeremiah concealed in a cave on Mt. Pisgah the tabernacle, the ark of the covenant and the altar of incense, a statement which no one accepts as correct or even plausible. That the author of the rest of the book is not the composer of the letters is proved by the difference of style and the contradictions in subject-matter. But that he himself prefixed them is made probable by the connecting particle in the Greek (de), though some (Bertholdt, Grimm, Paulus, Kosters) think rather plausibly that the letters were added by a later hand, the connection in the Greek being also introduced by him and not by the author of the rest of the book. It has been maintained that we have but one letter in 2Macc 1:1-2:18, and on the other hand that there are three. But the division into two is quite natural and is almost universally accepted.<P>5. Historicity: 2 Maccabees belongs to the class of literature called by the Germans Tendenz-Schriften, i.e. writings originating in the desire to teach some doctrine or to correct some supposed error. 1Maccabees gives us a history of the Maccabean wars as such, taking so little notice of the part played by God that the Divine Being is not so much as mentioned, except under the impersonal form Heaven (compare "Heaven helps those who help themselves"). Nor has 1Maccabees a word to say about a life beyond the grave. In short, 1Maccabees is written from the standpoint of the Sadducees, to which party the reigning dynasty (the Hasmonean) belonged. The writer of 2 Maccabees is evidently a Pharisee and his aim is not historical but doctrinal; i.e. the book is a historical romance with a purpose, that purpose being to make prominent the outstanding tenets of the Pharisees (see II, 6). Two extreme opinions have been defended as to the historical value of 2 Maccabees:<P>(1) That 2 Maccabees is a strictly historical work, is more trustworthy than 1Maccabees and is to be followed when the two books differ; so the bulk of Roman Catholics and also Niese and Schlatter. The supernaturalism of the book is to Romanists a recommendation.<P>(2) That 2 Maccabees has virtually no historical value, since it was written for other than historical ends; so Wibrich, Kosters and Kamphausen.<P>But the bulk of Protestant critics of recent times occupy a portion midway between these two opposite opinions, namely, that 1 Maccabees is much more accurate than 2 Maccabees and is to be preferred when the 2 books of Maccabees differ or contradict each other; so Grimm, Reuss, Schurer, Kamphausen. On the other hand, when 2 Maccabees contains historical matter absent from 1Maccabees it is to be accepted as correct unless opposed by intrinsic improbability or direct contrary evidence. In 2Macc 3-5 we have details concerning the Maccabean revolt not found in 1Maccabees, and in treatment of episodes or incidents with which 1Maccabees deals it is often fuller and more specific, as in 2Macc 10:14-23; 12:7-9 (compare 1Macc 5:1-5; 12:17-25); 2Macc 10:24-38 (compare 1Macc 5:29-44); 2Macc 12:32-45 (compare 1Macc 5:65,68,63f). On the other hand, the account of the celestial appearances in 2Macc 3:24ff; 11:8, etc., and the description in 6:18ff of the martyrdom of Eleazar the scribe and of the 7 brethren and their mother, carry on their face the marks of their legendary and unhistorical character. The edifying remarks scattered throughout the book, many of them pragmatic and reminding one of the Book of Daniel, confirm the impression otherwise suggested, that the author\'s aim was didactic and not historical. The book as it stands is a real authority for the ideas prevalent in the writer\'s circle at the time of its composition.<P>6. Teaching of the Book:<P>In general it may be said that the doctrines taught in 2 Maccabees are those of the Pharisees of the day. Several scholars consider 2 Maccabees the answer of Pharisaism to the Sadduceeism of 1 Maccabees (see Wellhausen, Die Pharisaer und die Saducaer; compare Geiger, Urschrift und Ubersetzungen der Bibel, 219ff). But there is evidence enough (see II, 4) that the author of 2 Maccabees had not seen 1 Maccabees. Yet it is equally clear that 2 Maccabees does give prominence to the distinctive tenets of Pharisaism, and it was probably written on that account.<P>(1) The strictest observance of the law is enforced. The violation of the sanctity of the Sabbath countenanced under special circumstances in 1Macc (2:39-48) is absolutely forbidden in 2Macc (6:6,11; 8:26f; 12:38); compare the words of the Pharisees to Petronius when the latter proposed to have a statue of the emperor Caius erected in the temple: "We will die rather than transgress the law" (Josephus, Ant, XVIII, viii, 3).<P>(2) The Pharisaic party took but little interest in political affairs, and supported the Hasmoneans only because and in so far as they fought for the right to observe their religious rites. When, however, they compromised with Hellenism, the Pharisees turned against them and their allies the Sadducees. In this book we miss the unstinted praise accorded the Hasmonean leaders in 1Maccabees, and it is silent as to the genealogy of the Hasmoneans, the death of Judas Maccabeus and the family grave at Modin.<P>(3) The book reveals thus early the antagonism between the Pharisees and the priestly party, which is so evident in the Gospels. The high-priesthood had through political circumstances become the property of the Maccabees, though they were not of the Aaronic family, or even of the tribe of Levi. The priestly circle became the aristocratic, broad-church party, willing to come to terms with Greek thought and life. Hence, in 2 Maccabees, Jason and Menelaus are fit representatives of the priesthood. In the list of martyrs (chapters 6f) no priest appears, but on the other hand, Eleazar, one of the principal scribes—scribes and Pharisees were then as in New Testament times virtually one party—suffered for his loyalty to the national religion, "leaving his death for an example" (6:18-31).<P>(4) The temple occupies a high and honorable place in 2 Maccabees, as in the mind of the orthodox party (see 2:19; 3:2; 5:15; 9:16; 13:23; 14:31). Great stress is laid on the importance of the feasts (6:6; 10:8, etc.), of sacrifice (10:3), of circumcision (6:10), of the laws of diet (6:18; 11:31). The author seems in particular anxious to recommend to his readers (Egyptian Jews) the observance of the two new festivals instituted to commemorate the purification of the temple after its pollution by the Syrians and also the victory over Nicanor. According to this book the Chanukkah feast was established immediately after the death of Antiochus Epiphanes (10:6ff), not before this event (1Macc 4:56), probably to give it additional importance. The book closes with the defeat and death of Nicanor and the founding of the Nicanor Day festival, without mentioning the death of Judas, as though the writer\'s aim was to give prominence to the two new festivals.<P>(5) 2 Maccabees shows a Jewish particularism which agrees well with Pharisaism and Scribism, but is opposed to the broader sentiments of the ruling party: Israel is God\'s people (1:26); His portion (14:15); He often intervenes miraculously on behalf of Israel and the religion of Israel (3:24-30; 10:29f; 11:6-8); even the calamities of the nation are proofs of Divine love because designed for the nation\'s good (5:18); but the sufferings brought upon the heathen are penal and show the Divine displeasure (4:38; 5:9; 13:8; 15:32f). The writer is deadly opposed to the introduction of Greek customs and in particular to the establishment of a gymnasium in Jerusalem (4:7f; 11:24). The Book of Jubilees, also written by a zealous Pharisee, takes up the same hostile attitude toward foreign customs (see 3:31; 7:20, and the note by R. H. Charles (Book of Jubilees) on the former).<P>(6) This book gives prominence to the doctrine of a resurrection and of a future life about which 1Maccabees, a document of the Sadducee party, is silent, (compare I, 5 above; see 2Macc 7:9,11,14,36; 12:43-45; 14:46 (compare IV,4,below)). The Sadducees, to which the Hasmoneans belonged, denied a resurrection, limiting their conception of religion to the present life, in this agreeing with the teaching of the Hebrew Scriptures down to the time of the exile (536 BC). But the Pharisees and scribes, though professing to rest their beliefs on the "Law of Moses," departed from that law in this matter (see Warburton, The Divine Legation of Moses). The resurrection is to be a bodily one (2Macc 7:11,22f; 14:46) and to a life that is unending (2Macc 7:9,36). The following related beliefs supported in this book and forming part of the creed of orthodox Pharisaism are adduced by Romanists on behalf of their own teaching: (a) the efficacy of prayers for the dead (2Macc 12:44); (b) the power exercised by the intercession of saints (2Macc 15:12-14); Philo (De execrat., 9) and Josephus (Ant., I, xi, 3) held the same doctrine; (c) the atoning character of the martyrdom of the righteous (2Macc 7:36,38; compare 4Macc 17:22; see IV,4,(3), below).<P>(7) The angelology of 2 Maccabees forms a prominent feature of the book (see 3:24-30; 10:29f; 11:6-8). The Sadducees accepted the authority of the Pentateuch, though they rejected tradition. They were therefore inconsistent in allowing no place for angelic beings in their creed, though consistent in rejecting the doctrine of a future life.<P>(8) The comparative silence of this book on the question of the Messianic hope is strikingly in contrast with the prominence of the subject in Psalter of Solomon (17:23ff, etc.; see Ryle and James, Psalms of Solomon, liiff) and other contemporary writings emanating from the Pharisees. But why should the author of 2 Maccabees be expected to give equal prominence to all his opinions in one tract? Some such hope as that connected with the Messiah does, however, seem to be implied in 1:27; 2:18; 7:33; 14:15.<P>The present writer holds that one man is responsible for 2 Maccabees in its present form and that the only written source was the 2 letters with which the book opens (1:1-2:18) (see II,4,above).<P>7. Author:<P>Even if we have to assume an original in 5 books of which 2 Maccabees, as we have it, is but an epitome, it is not possible to distinguish between the sentiments of "Jason" and his epitomizer. The author—assuming but one—was evidently an Egyptian probably an Alexandrian Jew, who nevertheless retained his loyalty to the Jerusalem temple and its constitutions and desired to prevent the alienation of his fellow-countrymen in the same country from the home sanctuary and its feasts, especially the two new feasts, Chanukkah (Dedication) and Nicanor Day. The Jews of Egypt had a temple of their own, in opposition to the teaching of the Jewish law (D and P; compare <a onClick="return mV(\'Deu\',12,\'2-18\');">De 12:2-18</a> and <a onClick="return mV(\'Lev\',17,\'1-9\');">Le 17:1-9</a>; <a onClick="return mV(\'Lev\',19,30);">19:30</a>), and it was perhaps the growing influence of this temple that prompted the author to compose this book which sets so much honor upon the Jerusalem temple and its observances. The character of the Greek (see II, 9, below), the ignorance of Palestine and also the deep interest in Egypt which this book reveals—these and other considerations point to the conclusion that the author lived and wrote in Egypt. There is no evidence that Judas Maccabeus (Leon Allatius), or the author of Sirach (Hasse) or Philo the Jew (Honorius d\'Autun) or Josephus wrote the book, though it has been ascribed by different scholars to each of the persons named.<P>8. Date:<P>The book must have been written sufficiently long after 161 BC, the year with which the record closes, to allow mythical tales of the martyrdoms in 2Macc 6f and the history of the supernatural appearances in 3:24-30, etc., to arise. If we allow 30 years, or the lifetime of a generation, we come down to say 130 BC as a terminus a quo. There is probably in 15:36 a reference to the Book of Esther (so Cornill, Kautzsch and Wellhausen, IJG4, 302f) which would bring the terminus a quo down to about 100 BC. That 2 Maccabees was written subsequently to 1 Maccabees (i.e. after 80 BC) is made certain by the fact that the Jews now pay tribute to Rome (2Macc 8:10,36). Since Philo, who died about 40 AD, refers to 2Macc 4:8-7:42 (Quod omnis probus liber, Works, edition Mangey, II, 459), the book must have been composed before 40 AD. This is confirmed by the certainty that it was written before the destruction of Jerusalem and the temple (70 AD), for the city still exists and the temple services are in full operation (3:6ff, etc.). <a onClick="return mV(\'Hbr\',11,35);">Heb 11:35</a>f is no doubt an echo of 2Macc 6:18-7:42 and shows that the unknown author of Hebrews had 2 Maccabees before him. The teaching of the book represents the views of the Pharisees about the middle of the last century BC. A date about 40 BC would agree with all the evidence.<P>9. Original Language:<P>That the original language was Greek is made exceedingly likely by the easy flow of the style and the almost entire absence of Hebraisms (yet see 2Macc 8:15; 9:5; 14:24). No scholar of any standing has pleaded for a Hebrew original of the present book. Bertholdt, however, argued that the two letters (2Macc 1:1-2:18) were composed in Hebrew (or Aramaic) Ewald held that the 2nd letter (2Macc 1:11-2:18) is from the Hebrew, and Schlunkes that this applies to the 1st only. But the evidence given by these scholars is unconvincing, though the 1st letter is certainly more Hebraic in style than the 2nd letter, the contrary of what Ewald said.<P>10. Text and Versions:<P>As to the texts and versions, see I,9,above, where the statements apply here with but slight qualifications. But the book is lacking in Codex Sinaiticus as well as in Codex Alexandrinus. In addition to the Old Latin text and adopted for the Vulgate, we have another Latin text in Codex Ambrosianus, published in 1824 by Peyron; but this book is unrepresented in Sabatier\'s collection of Old Latin texts.<P>LITERATURE.<P>In addition to the literature mentioned under <a href="./study/isbe/search.html?string
