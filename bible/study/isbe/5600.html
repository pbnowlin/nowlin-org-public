=APOCRYPHA">APOCRYPHA</a> and I above, and in the course of the present article, note the following items: Commentary of Moffatt (Oxford Apocrypha); C. Bertheau, De section lib. Macc., 1829 (largely quoted by Grimm); W.H. Kosters, "De Polemiek van het tweede boek de Mak," TT, XII, 491-558; Schlatter, "Jason von Cyrene," TLZ,1893,322; A. Buchler, Die Tobliden u. die Oniaden im II Mak, 1889; Wibrich, Juden und Griechen, etc.,1895,64; Kamphausen (Kautzsch, Die Apocrypha des AT). The following discussing the two letters (1:1-2:18) deserve mention: Valckenaer, De Aristobulo, 38-44; Schlunkes, Epistolae quae secundo Macc libro I, etc.,1844,1-9; also Difficiliorum locorum epistolae, etc., 1847; Graetz, "Das Sendschreiben der Palaestinenser an die aegyptischen Gemeinden," etc., Monatss. fur Gesch. u. Wissen. des Judenthums,1877, 1-16, 49-60; A. Buchler, "Das Sendschreiben der Jerusalemer," etc., Monatss. fur Gesch. u. Wissen. des Judenthums; see last notice, 1897, 481-500, 529-54); Bruston, "Trois lettres des Juifs de Palestine," ZATW, X, 110-17; W. H. Kosters, "Strekking der brieven in 2Macc," TT, 1898, 68-76; Torrey, "Die Briefe 2 Mak," ZATW, 1900, 225-42.``1';
isbe[5654]='Maccabees, Books of, 3-5`IIII. 3 Maccabees.<P>1. Name:<P>The name 3 Maccabees, though occurring in the oldest manuscripts and VSS, is quite unsuitable, because the book refers to events which antedate the Maccabean age by about half a century, and also to events in which the Maccabees took no part. But this book tells of sufferings and triumphs on the part of loyal Jews comparable to those of the Maccabean period. Perhaps the term Maccabees was generalized so as to denote all who suffered for their faith. Some hold that the book was written originally as a kind of introduction to the Books of Maccabees, which it precedes as Book I in Cotton\'s Five Books of Maccabees. But the contents of the book do not agree with this view. Perhaps the title is due to a mistake on the part of a copyist.<P>2. Canonicity:<P>The book has never been reckoned as canonical by the Western church, as is shown by the fact that it exists in no edition of the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) and was not included in the Canon by the Council of Trent. It is for the latter reason absent from the Protestant versions of the Apocrypha which contain but the Books of Maccabees (1 and 2). But 3 Maccabees has a place in two uncials of the Septuagint (A and V) and also in the ancient (Peshitta) Syriac version of the Scriptures, and it is given canonical rank in the Apostolical Constitutions (canon 85). The book must therefore have been held in high esteem in the early church.<P>3. Contents:<P>3 Maccabees is a historical novel in which there is much more romance than history, and more silly and superficial writing than either. It professes to narrate occurrences in the history of the Jews which took place at Jerusalem and at Alexandria in which the Jews were persecuted but in various ways delivered.<P>(1) 3 Maccabees 1:1-2:24:<P>After conquering at Raphia Antiochus III, the great king of Syria (224-187 BC), Ptolemy IV Philopator, king of Egypt (221-204 BC), resolved to visit Jerusalem and to enter the sanctum ("holy of holies," naos) of the temple to which by the Jewish law access was allowed only to the high priest, and even to him but once a year (Day of Atonement (1:11)). The Jews, priests and people, were in a paroxysm of grief and earnestly entreated him to desist, but he persisted in his plan. They then through Simon, the high priest, 219-199 BC, prayed that God might intervene and avert this desecration. The prayer is answered, the king being paralyzed before realizing his purpose.<P>(2) 3 Maccabees 2:25-30:<P>Returned to Alexandria, Ptolemy is exasperated at the failure of his long-cherished project and resolves to wreak his vengeance upon the Jews of Egypt. He issues a decree that all Jews in Alexandria who refused to bend the knee to Bacchus should be deprived of all their rights as citizens.<P>(3) 3 Maccabees 2:31-4:21:<P>A goodly number of Alexandrian Jews refuse to obey the royal mandate, whereupon Ptolemy issues an edict that all the Jews of Egypt, men, women and children, shall be brought in chains to Alexandria and confined in the race-course (hippodrome), with a view to their wholesale massacre. Prior to the massacre there is to be a complete register taken of the names of the assembled Jews. Before the list is complete the writing materials give way and the huge slaughter is averted.<P>(4) 3 Maccabees 4:22-6:21:<P>The king, still thirsting for the blood of this people, hits upon a different method of compassing their ruin. Five hundred elephants are intoxicated with wine and incense and let loose upon the Jews in the race-course. Here we have the principal plot of the book, and we reach the climax in the various providential expedients, childish in their character, of preventing the execution of the king\'s purpose. The lesson of it all seems to be that God will deliver those who put their trust in Him.<P>(5) 3 Maccabees 6:22-7:23:<P>At length the king undergoes a change of heart. He releases the Jews and restores them to all their lost rights and honors. In response to their request, he gives them permission to slay their brother-Jews who, in the hour of trial, had given up their faith. They put to death 300, "esteeming this destruction of the wicked a season of joy" (7:15).<P>3 Maccabees is made up of a number of incredible tales, the details of which are absurd and contradictory. The beginning of the book has evidently been lost, as appears from the opening words, "Now when Philopator" (ho de Philopator), and also from the references to an earlier part of the narrative now lost, e.g.: 1:1 ("from those who came back"); 1:2 ("the plot afore mentioned"); 2:25 ("the aforenamed boon companions"), etc.<P>4. Historicity:<P>The book contains very little that is true history, notwithstanding what Israel Abrahams (see "Literature" to this section), depending largely on Mahaffy (The Empire of the Ptolemies), says to the contrary. It is much more manifest than even in the case of 2 Maccabees that the writer\'s aim was to convey certain impressions and not to write history (see III, 5).<P>The improbabilities of the book are innumerable (see Bissell, The Apocrypha of the Old Testament, 616f), and it is evident that we have to do here with a combination of legends and fables worked up in feeble fashion with a view to making prominent certain ideas which the author wishes his readers to keep in mind. Yet behind the fiction of the book there are certain facts which prompted much of what the writer says.<P>(1) That Ptolemy IV bore the character of cruelty and capriciousness and effeminacy is borne out by Polybius (204-121 BC) in his History and by Plutarch in his Life of Cleomenes.<P>(2) The brief outline of the war between Ptolemy IV and Antiochus III, the latter being conquered at Raphia (chapters 1f), agrees in a general way with what has been written by Polybius, Livy and Justin.<P>(3)in this book, by the command of Ptolemy, 500 intoxicated elephants are let loose upon the Jews brought bound to the race-course of Alexandria. Josephus (Apion, II, v) tells us that Ptolemy VII Physcon, king of Egypt, 145-117 BC, had the Jews of Alexandria, men, women and children, brought bound and naked to an enclosed space and that he had let loose on them a herd of elephants, which, however, turned instead upon his own men, killing a large number of them. The cause of the king\'s action was that the Jewish residents of Alexandria sided with his foes. In 3 Maccabees the cause of the action of Ptolemy IV was the failure of his project to enter the sanctum of the Jerusalem temple; this last perhaps a reflection of 2Macc 3:9ff, where it is related that Heliodorus was hindered from entering the temple by a ghostly apparition. Now these two incidents, in both of which Jews are attacked by intoxicated elephants, must rest upon a common tradition and have probably a nucleus of fact. Perhaps, as Israel Abrahams holds, the tradition arose from the action of the elephants of Ptolemy in the Battle of Raphia. Most writers think that the reference is to something that occurred in the reign of Ptolemy VII.<P>(4) The shutting-up of the Jews in the racecourse at Alexandria was not improbably suggested by a similar incident in which Herod the Great was the principal agent.<P>(5) In the opinion of Grimm (Comm., 216) we have in the two festivals (3Macc 6:36; 7:19) and in the existence of the synagogue at Ptolemais an implied reference to some great deliverance vouchsafed to the Jews.<P>5. Aim and Teaching:<P>3 Maccabees was probably written by an Alexandrian Jew at a time when the Jews in and around Alexandria were sorely persecuted on account of their religion. The purpose of the author seems to have been to comfort those suffering for the faith by giving examples showing how God stands by His people, helping in all their trials and delivering them out of the hands of their enemies. Note further the following points:<P>(1) The book, unlike 2 Maccabees, is silent as to a bodily resurrection and a future life, though this may be due to pure accident. Hades (Haides) in 3Macc 4:8; 5:42; 6:31, etc., appears to stand only for death, regarded as the end of all human life.<P>(2) Yet the belief in angelic beings is clearly implied (see 6:18ff).<P>(3) The author has much confidence in the power of prayer (see 2:10; 2:21-24; 5:6-10,13,50f; 6:1-15, etc.).<P>(4) The book lays stress upon the doctrine that God is on the side of His people (4:21, etc.), and even though they transgress His commandments He will forgive and save them (2:13; 4:13, etc.).<P>6. Authorship and Date:<P>From the character of the Greek, the interest shown in Alexandrian Judaism, and the acquaintance displayed with Egyptian affairs (see I. Abrahams, op. cit., 39ff), it may be inferred with confidence that the author was a Jew residing in Alexandria. The superior limit (terminus a quo) for the date is some time in the last century BC. Since the existence of the additions to Daniel is implied (see <a onClick="return mV(\'Dan\',6,6);">Da 6:6</a>), the inferior limit (terminus ad quem) is some time before 70 AD. If the temple had been destroyed, the continuance of the temple services could not have been implied (see 3Macc 1:8ff). As the book seems written to comfort and encourage Alexandrian Jews at a time when they were persecuted, Ewald, Hausrath, Reuss and others thought it was written during the reign of the emperor Caligula (37-41 AD), when such a persecution took place. But if Ptolemy is intended to represent Caligula, it is strange, as Schurer (GJV4, III, 491) remarks, that the writer does not make Ptolemy claim Divine honors, a claim actually made by Caligula.<P>Though Josephus (died 95 AD) could not have known the book, since his version of the same incidents differs so much, yet it must have been written some 30 years before his death, i.e. before the destruction of Jerusalem and the temple in 71 AD.<P>7. Original Language:<P>That 3 Maccabees was composed in Greek is the opinion of all scholars and is proved by the free, idiomatic and rather bombastic character of the language in the Septuagint.<P>8. Text and Versions:<P>(1) Greek.<P>This book occurs in the two unicals Codex Alexandrinus and Codex Venetus (not in Codex Vaticanus or Codex Sinaiticus), in most cursives and also in nearly all editions of the Septuagint.<P>(2) Syriac.<P>The Syriac version (Peshitta) reproduced in the Paris and London Polyglot and by Lagarde, Lib. Apocrypha. Vet. Test. It is not a good translation.<P>(3) Latin.<P>The earliest Latin translation is that made for the Complutensian Polyglot.<P>(4) English.<P>The earliest in English is that of Walter Lynne (1650).<P>LITERATURE.<P>Besides the commentaries by Grimm (the best), Bissell (Lange), Kautzsch and Emmet (Oxford Apocrypha), and the articles in HDB (Fairweather, excellent), Encyclopedia Biblica (Torrey, good), GJV4 (Schurer), III, 489-92; HJP, II, iii, 216-19, let the following be noted: A. Hausrath, A History of New Testament Times, 1895, II, 70ff; Wibrich, Juden u. Griechen; Abrahams, "The Third Book of the Mace," JQR, IX, 1897, 39-58; A. Buchler, Die Tobiaden u. die Oniaden,1899,172-212. Both Abrahams and Buchler defend the historicity of some parts of 3 Maccabees; Wibrich, "Der historische Kern des III Makk," Hermes, Bd. 39, 1904, 244-58. For English translation see (1) Henry Cotton, The Five Books of Maccabees (Cotton calls it First Book of Maccabees); (2) W.R. Churton, The Uncanonical and Apocryphal Scriptures, and (3) Baxter, The Apocrypha, Greek and English<P>IV. 4 Maccabees.<P>1. Name:<P>4 Maccabees is a philosophical treatise or discourse on the supremacy of pious reason (= religious principle) in the virtuous man. The oldest title of the book, 4 Maccabees (Makkabaion d, (4)), occurs in the earliest extant manuscripts of the Septuagint (Codices Sinaiticus, Alexandrinus, Venetus, etc.), in the list of the Codex Claromontanus (3rd century?), the Catalogue of the Sixty Canonical Books (5th century?) and the Synopsis of Athanasius (9th century). It obtained this name from the fact that it illustrates and enforces its thesis by examples from the history of the Maccabees. Some early Christian writers, believing 4 Maccabees to be the work of Josephus (see IV, 5), gave it a corresponding title. Eusebius and Jerome, who ascribe the book to Josephus, speak of it under the name of: A Discourse concerning the Supreme Power of Reason.<P>2. Canonicity:<P>Though absent from the Vulgate, and therefore from the Romanist Canon and from Protestant versions of its Apocrypha, 4 Maccabees occurs in the principal manuscripts (Sinaiticus, Alexandrinus, Venetus, etc.) and editions (Fritzsche, Swete, not Tischendorf) of the Septuagint, showing it was highly esteemed and perhaps considered canonical by at least some early Christian Fathers.<P>3. Contents:<P>This book is a philosophical disquisition in the form of a sermon on the question "Whether pious reason is absolute master of the passions" (4Macc 1:1).<P>(1) 4 Maccabees 1:1-12:<P>First of all, the writer states his theme and the method in which he intends to treat it.<P>(2) 4 Maccabees 1:13-3:18:<P>He defines his terms and endeavors from general principles to show that pious reason does of right rule the passions.<P>(3) 4 Maccabees 3:19 to End of Book:<P>He tries to prove the same proposition from the lives of the Maccabean martyrs. These historical illustrations are based on 2Macc 6:18-7:42 (compare 3Macc 6).<P>Because the book is written as a discourse or sermon and is largely addressed to an apparent audience (4Macc 1:17; 2:14; 13:10; 18:4), Freudenthal and others think we have here an example of a Jewish sermon delivered as here written. But Jewish preachers based their discourses on Scripture texts and their sermons were more concise and arresting than this book.<P>4. Teaching:<P>The author\'s philosophical standpoint is that of Stoicism, namely, that in the virtuous man reason dominates passion. His doctrine of four cardinal virtues (phronesis, dikaiosune, andreia, sophrosune, "Providence," "Justice" "Fortitude," "Temperance" (4Macc 1:18)), is also derived from Stoicism. Though, however, he sets out as if he were a true Stoic, he proceeds to work out his discourses in orthodox Jewish fashion. His all-dominating reason is that which is guided by the Divinely revealed law, that law for the faithful observing of which the martyrs died. The four cardinal virtues are but forms of that true wisdom which is to be obtained only through the Mosaic law (4Macc 7:15-18). Moreover, the passions are not, as Stoicism taught, to be annihilated, but regulated (4Macc 1:61; 3:5), since God has planted them (4Macc 2:21).<P>The author\'s views approach those of Pharisaism.<P>(1) He extols the self-sacrificing devotion to the law exhibited by the Maccabean martyrs mentioned in 4Macc 3:9 to the end of the book.<P>(2) He believes in a resurrection from the dead. The souls of the righteous will enjoy hereafter ceaseless fellowship with God (9:8; 15:2; 18:5), but the wicked will endure the torment of fire forever and ever (10:11,15; 12:12; 13:14). Nothing, however, is said of the Pharisees\' doctrine of a bodily resurrection which 2 Maccabees, a Pharisaic document (see II,6,(6) above), clearly teaches.<P>(3) The martyrdom of the faithful atones for the sins of the people (4Macc 6:24; 17:19-21; compare <a onClick="return mV(\'Rom\',3,25);">Ro 3:25</a>).<P>5. Authorship and Date:<P>According to Eusebius (Historia Ecclesiastica, III, 6), Jerome (De Viris Illust., xiii; C Peleg, ii.6), Suidas (Lex Iosepos) and other early writers, Josephus is the author of this book, and in Greek editions of his works it constitutes the last chapter with the heading: Phlab. Iosepou eis Makkabaions logos, e peri autokratoros logismou, "The Discourse of Flavius Josephus: or concerning the Supreme Power of Reason" (so Niese, Bekker, Dindorf, etc.). But this tradition is negated by the style and thought, which differ completely from those found in the genuine writings of that Jewish historian. Besides this, the author of the book makes large use of 2 Maccabees, of which Josephus was ignorant. Moreover, there are traditions equally ancient of a contrary kind.<P>The author must have been a Jew and he probably belonged to the Pharisee party (see IV, 7). He was also a Hellenist, for he reveals the influence of Greek thought more than any other apocryphal writer. He was also, it would appear, a resident of Alexandria, for the earliest notices of it occur in literature having an Alexandrian origin, and the author makes considerable use of 2 Maccabees, which emanated from Alexandria.<P>It is impossible definitely to fix the date of the book. But it was certainly written before the destruction of the temple in 70 AD and after the composition of 2 Maccabees, on which it largely depends. A date in the first half of the 1st century of our era would suit all the requirements of the case.<P>6. Original Language:<P>The book was certainly written in Greek, as all scholars agree. It employs many of the terms of Greek philosophy and it bears the general characteristics of the Greek spoken and written at Alexandria at the commencement of the Christian era.<P>7. Text and Versions:<P>(1) Greek.<P>This book occurs in the principal manuscripts (Sinaiticus, Alexandrinus, Venetus, etc.) and printed editions (Grabe, Breitinger, Apel, Fritzsche, Swete (Codex Alexandrinus with variants of Codex Sinaiticus and Codex Venetus) and Baxter, The Apocrypha, Greek and English), also in various Josephus manuscripts and most editions of Josephus, including Naber, but not Niese.<P>(2) Latin.<P>No Old Latin version has come down to us.<P>(3) Syriac.<P>The Peshitta text is printed in Codex Ambros. (Ceriani) and by Bensley from a manuscript in The Fourth Book of Maccabees and Kindred Documents in Syriac (agrees mostly with Codex Alexandrinus). Sixtus Senensis (Bibliotheca Sancta,1566,I, 39) speaks of having seen another 4 Maccabees. But this was probably "simply a reproduction of Josephus" (Schurer, History of the Jewish People in the Time of Jesus Christ, II, iii, 14).<P>LITERATURE.<P>Besides the literature mentioned under the other books of Maccabees, under <a href="./study/isbe/search.html?string=APOCRYPHA">APOCRYPHA</a>, and in the course of the present article, note the following: The commentaries of Grimm (excellent; the only one on the complete book) and Deissmann (in Kautzsch, A pok des Altes Testament, brief but up to date and good); the valuable monograph by Freudenthal: Die Flavius Josephus beigelegte Schrift uber die Herrschafft der Vernunft (IV. Makkabaerbuch) Untersucht, 1869. See, besides the articles in HDB (Fairweather); Encyclopedia Biblica (Torrey); Gfrorer, Philo, etc., II, 1831,173-200; Dahne, Gesch. Darstellung der jud.-alex. Religions Philosophie, II, 1834, 190-99; and the History of Ewald, IV, 632ff. There are English translations in Cotton, The Five Books of Maccabees, Oxford, 1832; W.R. Churton, The Uncanonical and Apocryphal Scripture; Baxter, The Apocrypha, Greek and English.<P>V. 5 Maccabees.<P>1. Name:<P>The designation 5 Maccabees was first given to the book (now commonly so called) by Cotton (The Five Books of Maccabees English, 1832), and it has been perpetuated by Dr. Samuel Davidson (Introduction to the Old Testament, III, 465); Ginsburg (Kitto\'s Cycyclopedia of Biblical Literature); Bissell (Apocrypha of the Old Testament) and others. It has been called the Arabic 2 Maccabees (so in the Paris and London Polyglot), and the Arabic Maccabees. The 5 Maccabees in the Translatio Syra Peshitto, edited by Ceriani, is really nothing more than a Syriac version of the 6th book of Josephus, The Wars of the Jews.<P>2. Canonicity:<P>This book has never been recognized as canonical by either Jews or Christians.<P>3. Contents:<P>The book is ostensibly a history of the Jews from the attempt of Heliodorus to plunder the temple (186 BC) to about 6 BC. It is really nothing more than a clumsy compilation from 1 and 2 Maccabees and Josephus (except 5Macc 12, which is the only original part, and this teems with errors of various kinds); a note at the end of 5Macc 16 says 1:1-16:26 is called The Second Book of Maccabees according to the Translation of the <a onClick="return mV(\'Hbr\',5,1);">Hebrews</a>. 5Macc 19 closes with the events narrated at the end of 1Maccabees. The rest of the book (5Macc 20-59) follows Josephus (BJ, If) closely. Perhaps the original work ended with 5Macc 19. Ginsburg (op. cit., III., 17), Bissell (Apocrypha, 639) and Wellhausen (Der arab. Josippus) give useful tables showing the dependence of the various parts of 5 Maccabees on the sources used.<P>4. Historicity:<P>In so far as this book repeats the contents of 1 and 2 Maccabees and Josephus, it has the historical value of the sources used. But in itself the book has no historical worth. The author calls Roman and Egyptian soldiers "Macedonians," Mt. Gerizim, "Jezebel," Samaria "Sebaste," Shechem "Neapolis" or "Naploris." Herod and Pilate exchange names. Some of the mistakes may of course be traceable to the translation.<P>5. Original Language:<P>The original work was almost certainly composed in Hebrew, though we have no trace of a Hebrew text (so Ginsburg, op. cit., and Bissell). This conclusion is supported by the numerous Hebraisms which show themselves even in a double translation. The Pentateuch is called the "Torah," the Hebrew Scriptures are spoken of as "the twenty-four books," the temple is "the house of God" or "the holy house," Judea is "the land of the holy house" and Jerusalem is "the city of the holy house." These and like examples make it probable that the writer was a Jew and that the language he used was Hebrew. Zunz (Die gottesdienstlichen Vortrage,1832,146ff), Graetz (Geschichte, V, 281) and Dr. S. Davidson (op. cit., 465) say the book was written in Arabic from Hebrew memoirs. According to Zunz (loc. cit.) and Graetz (loc. cit.) the Jewish history of Joseph ben Gorion (Josippon), the "pseudo-Josephus" (10th century), is but a Hebrew recension of 5 Maccabees (the Arabic 2 Maccabees). On the contrary, Wellhausen (op. cit.) and Schurer (GJV4, I, 159f) maintain that the shorter narrative in 5 Maccabees represents the extent of the original composition far more correctly than the Hebrew history of Josippon (which ranges from Adam to 70 AD), and than other recensions of the same history.<P>6. Aim and Teaching:<P>The book was compiled for the purpose of consoling the Jews in their sufferings and encouraging them to be stedfast in their devotion to the Mosaic law. The same end was contemplated in 2, 3 and 4 Maccabees and in a lesser degree in 1Maccabees, but the author or compiler of the present treatise wished to produce a work which would appeal in the first instance and chiefly to Hebrew (or Arabic?) readers. The author believes in a resurrection of the body, in a future life and a final judgment (5Macc 5:13,43f). The righteous will dwell in future glory, the wicked will be hereafter punished (5Macc 5:49,50f; 59:14).<P>7. Authorship and Date:<P>We have no means of ascertaining who the author was, but he must have been a Jew and he lived some time after the destruction of the temple in 70 AD (see 5Macc 9:5; 21:30; 22:9; 53:8, though Ginsburg regards these passages as late additions and fixes the date of the original work at about 6 BC, when the history ends). The author makes large use of Josephus (died 95 AD), which also favors the lower date.<P>8. Text and Versions:<P>The Arabic text of the book and a Latin translation by Gabriel Sionita is printed in the Paris and London Polyglots. No other ancient text has come down to us. cotton (op. cit., xxx) errs in saying that there is a Syriac version of the book.<P>LITERATURE.<P>The most important literature has been mentioned in the course of the article. The English and earlier German editions of Schurer, GJ V, do not help. The only English translation is that by Cotton made directly from the Latin of Gabriel Sionita. Bissell says that a French version appears as an appendix in the Bible of de Sacy; not, however, in the Nouvelle Edition (1837) in the possession of the present writer.``33';
isbe[5655]='Macedonia`mas-e-do\'-ni-a (Makedonia, ethnic Makedon,):<P><b>I. THE MACEDONIAN PEOPLE AND LAND</b><P><b>II. HISTORY OF MACEDONIA</b><P class="in15">1. Philip and Alexander<P class="in15">2. Roman Intervention<P class="in15">3. Roman Conquest<P class="in15">4. Macedonia a Roman Province<P class="in15">5. Later History<P><b>III. PAUL AND MACEDONIA</b><P class="in15">1. Paul\'s First Visit<P class="in15">2. Paul\'s Second Visit<P class="in15">3. Paul\'s Third Visit<P class="in15">4. Paul\'s Later Visits<P><b>IV. THE MACEDONIAN CHURCH</b><P class="in15">1. Prominence of Women<P class="in15">2. Marked Characteristics<P class="in15">3. Its Members<P><b>LITERATURE</b><hr /><P>A country lying to the north of Greece, afterward enlarged and formed into a Roman province; it is to the latter that the term always refers when used in the New Testament.<P>I. The Macedonian People and Land.<P>Ethnologists differ about the origin of the Macedonian race and the degree of its affinity to the Hellenes. But we find a well-marked tradition in ancient times that the race comprised a Hellenic element and a non-Hellenic, though Aryan, element, closely akin to the Phrygian and other Thracian stocks. The dominant race, the Macedonians in the narrower sense of the term, including the royal family, which was acknowledged to be Greek and traced its descent through the Temenids of Argos back to Heracles (Herodotus v.22), settled in the fertile plains about the lower Haliacmon (Karasu or Vistritza) and Axius (Vardar), to the north and northwest of the Thermaic Gulf. Their capital, which was originally at Edessa or Aegae (Vodhena), was afterward transferred to Pella by Philip II. The other and older element—the Lyncestians, Orestians, Pelagonians and other tribes—were pushed back northward and westward into the highlands, where they struggled for generations to maintain their independence and weakened the Macedonian state by constant risings and by making common cause with the wild hordes of Illyrians and Thracians, with whom we find the Macedonian kings in frequent conflict. In order to maintain their position they entered into a good understanding from time to time with the states of Greece or acknowledged temporarily Persian suzerainty, and thus gradually extended the sphere of their power.<P>II. History of Macedonia.<P>Herodotus (viii.137-39) traces the royal line from Perdiccas I through Argaeus, Philip I, Aeropus, Alcetas and Amyntas I to Alexander I, who was king at the time of the Persian invasions of Greece. He and his son and grandson, Perdiccas II and Archelaus, did much to consolidate Macedonian power, but the death of Archelaus (399 BC) was followed by 40 years of disunion and weakness.<P>1. Philip and Alexander:<P>With the accession of Philip II, son of Amyntas II, in 359 BC, Macedonia came under the rule of a man powerful alike in body and in mind, an able general and an astute diplomatist, one, moreover, who started out with a clear perception of the end at which he must aim, the creation of a great national army and a nation-state, and worked consistently and untiringly throughout his reign of 23 years to gain that object. He welded the Macedonian tribes into a single nation, won by force and fraud the important positions of Amphipolis, Pydna, Potidaea, Olynthus, Abdera and Maronea, and secured a plentiful supply of gold by founding Philippi on the site of Crenides. Gradually extending his rule over barbarians and Greeks alike, he finally, after the battle of Chaeronea (338 BC), secured his recognition by the Greeks themselves as captain-general of the Hellenic states and leader of a Greco-Macedonian crusade against Persia. On the eve of this projected eastern expedition, however, he was assassinated by order of his dishonored wife Olympias (336 BC), whose son, Alexander the Great, succeeded to the throne. After securing his hold on Thrace, Illyria and Greece, Alexander turned eastward and, in a series of brilliant campaigns, overthrew the Persian empire. The battle of the Granicus (334 BC) was followed by the submission or subjugation of most of Asia Minor. By the battle of Issus (333), in which Darius himself was defeated, Alexander\'s way was opened to Phoenicia and Egypt; Darius\' second defeat, at Arbela (331), sealed the fate of the Persian power. Babylon, Susa, Persepolis and Ecbatana were taken in turn, and Alexander then pressed eastward through Hyrcania, Aria, Arachosia, Bactria and Sogdiana to India, which he conquered as far as the Hyphasis (Sutlej): thence he returned through Gedrosia, Carmania and Persis to Babylon, to make preparations for the conquest of Arabia. A sketch of his career is given in 1Macc 1:1-7, where he is spoken of as "Alexander the Macedonian, the son of Philip, who came out of the land of Chittim" (1:1): his invasion of Persia is also referred to in 1Macc 6:2, where he is described as "the Macedonian king, who reigned first among the Greeks," i.e. the first who united in a single empire all the Greek states, except those which lay to the west of the Adriatic. It is the conception of the Macedonian power as the deadly foe of Persia which is responsible for the description of Haman in <span class="noTag">Additions to Esther 16:10</span> as a Macedonian, "an alien in truth from the Persian blood," and for the attribution to him of a plot to transfer the Persian empire to the Macedonians (verse 14), and this same thought appears in the Septuagint\'s rendering of the Hebrew Agagite (\'aghaghi) in <a onClick="return mV(\'Est\',9,24);">Es 9:24</a> as Macedonian (Makedon).<P>2. Roman Intervention:<P>Alexander died in June 323 BC, and his empire fell a prey to the rivalries of his chief generals (1Macc 1:9); after a period of struggle and chaos, three powerful kingdoms were formed, taking their names from Macedonia, Syria and Egypt. Even in Syria, however, Macedonian influences remained strong, and we find Macedonian troops in the service of the Seleucid monarchs (2Macc 8:20). In 215 King Philip V, son of Demetrius II and successor of Antigonus Doson (229-220 BC), formed an alliance with Hannibal, who had defeated the Roman forces at Lake Trasimene (217) and at Cannae (216), and set about trying to recover Illyria. After some years of desultory and indecisive warfare, peace was concluded in 205, Philip binding himself to abstain from attacking the Roman possessions on the east of the Adriatic. The Second Macedonian War, caused by a combined attack of Antiochus III of Syria and Philip of Macedon on Egypt, broke out in 200 and ended 3 years later in the crushing defeat of Philip\'s forces by T. Quinctius Flamininus at Cynoscephalae in Thessaly (compare 1Macc 8:5). By the treaty which followed this battle, Philip surrendered his conquests in Greece, Illyria, Thrace, Asia Minor and the Aegean, gave up his fleet, reduced his army to 5,000 men, and undertook to declare no war and conclude no alliance without Roman consent.<P>3. Roman Conquest:<P>In 179 Philip was succeeded by his son Perseus, who at once renewed the Roman alliance, but set to work to consolidate and extend his power. In 172 war again broke out, and after several Roman reverses the consul Lucius Aemilius Paulus decisively defeated the Macedonians at Pydna in 168 BC (compare 1Macc 8:5, where Perseus is called "king of Chittim "). The kingship was abolished and Perseus was banished to Italy. The Macedonians were declared free and autonomous; their land was divided into four regions, with their capitals at Amphipolis, Thessalonica, Pella and Pelagonia respectively, and each of them was governed by its own council; commercium and connubium were forbidden between them and the gold and silver mines were closed. A tribute was to be paid annually to the Roman treasury, amounting to half the land tax hitherto exacted by the Macedonian kings.<P>4. Macedonia a Roman Province:<P>But this compromise between freedom and subjection could not be of long duration, and after the revolt of Andriscus, the pseudo-Philip, was quelled (148 BC), Macedonia was constituted a Roman province and enlarged by the addition of parts of Illyria, Epirus, the Ionian islands and Thessaly. Each year a governor was dispatched from Rome with supreme military and judicial powers; the partition fell into abeyance and communication within the province was improved by the construction of the Via Egnatia from Dyrrhachium to Thessalonica, whence it was afterward continued eastward to the Nestus and the Hellespont. In 146 the Acheans, who had declared war on Rome, were crushed by Q. Caecilius Metellus and L. Mummius, Corinth was sacked and destroyed, the Achean league was dissolved, and Greece, under the name of Achea, was made a province and placed under the control of the governor of Macedonia. In 27 BC, when the administration of the provinces was divided between Augustus and the Senate, Macedonia and Achea fell to the share of the latter (Strabo, p. 840; Dio Cassius liii.12) and were governed separately by ex-praetors sent out annually with the title of proconsul. In 15 AD, however, senatorial mismanagement had brought the provinces to the verge of ruin, and they were transferred to Tiberius (Tacitus, Annals, i.76), who united them under the government of a legatus Augusti pro praetore until, in 44 AD, Claudius restored them to the Senate (Suetonius, Claudius 25; Dio Cassius lx .24). It is owing to this close historical and geographical connection that we find Macedonia and Achia frequently mentioned together in the New Testament, Macedonia being always placed first (<a onClick="return mV(\'Act\',19,21);">Ac 19:21</a>; <a onClick="return mV(\'Rom\',15,26);">Ro 15:26</a>; <a onClick="return mV(\'2Cr\',9,2);">2Co 9:2</a>; <a onClick="return mV(\'1Th\',1,7,8);">1Th 1:7,8</a>).<P>5. Later History:<P>Diocletian (284-305 AD) detached from Macedonia Thessaly and the Illyrian coast lands and formed them into two provinces, the latter under the name of Epirus Nova. Toward the end of the 4th century what remained of Macedonia was broken up into two provinces, Macedonia prima and Macedonia secunda or salutaris, and when in 395 the Roman world was divided into the western and eastern empires, Macedonia was included in the latter. During the next few years it was overrun and plundered by the Goths under Alaric, and later, in the latter half of the 6th century, immense numbers of Slavonians settled there. In the 10th century a large part of it was under Bulgarian rule, and afterward colonies of various Asiatic tribes were settled there by the Byzantine emperors. In 1204 it became a Latin kingdom under Boniface, marquis of Monferrat, but 20 years later Theodore, the Greek despot of Epirus, founded a Greek empire of Thessalonica. During the 2nd half of the 14th century the greater part of it was part of the Servian dominions, but in 1430 Thessalonica fell before the Ottoman Turks, and from that time down to the year 1913 Macedonia has formed part of the Turkish empire. Its history thus accounts for the very mixed character of its population, which consists chiefly of Turks, Albanians, Greeks and Bulgarians, but has in it a considerable element of Jews, Gypsies, Vlachs, Servians and other races.<P>III. Paul and Macedonia.<P>In the narrative of Paul\'s journeys as given us in <a onClick="return mV(\'Act\',13,\'1-\');">Ac 13-28</a> and in the Pauline Epistles, Macedonia plays a prominent part. The apostle\'s relations with the churches of Philippi, Thessalonica, and Berea will be found discussed under those several headings; here we will merely recount in outline his visits to the province.<P>1. Paul\'s First Visit:<P>On his 2nd missionary journey Paul came to Troas, and from there sailed with Silas, Timothy and Luke to Neapolis, the nearest Macedonian seaport, in obedience to the vision of a Macedonian (whom Ramsay identifies with Luke: see under the word "Philippi") urging him to cross to Macedonia and preach the gospel there (<a onClick="return mV(\'Act\',16,9);">Ac 16:9</a>). From Neapolis he journeyed inland to Philippi, which is described as "a city of Macedonia, the first of the district" (<a onClick="return mV(\'Act\',16,12);">Ac 16:12</a>). Thence Paul and his two companions (for Luke appears to have remained in Philippi for the next 5 years) traveled along the Ignatian road, passing through Amphipolis and Apollonia, to Thessalonica, which, though a "free city," and therefore technically exempt from the jurisdiction of the Roman governor, was practically the provincial capital. Driven thence by the hostility of the Jews, the evangelists preached in Berea, where Silas and Timothy remained for a short time after a renewed outbreak of Jewish animosity had forced Paul to leave Macedonia for the neighboring province of Achaia (<a onClick="return mV(\'Act\',17,14);">Ac 17:14</a>). Although he sent a message to his companions to join him with all speed at Athens (<a onClick="return mV(\'Act\',17,15);">Ac 17:15</a>), yet so great was his anxiety for the welfare of the newly founded Macedonian churches that he sent Timothy back to Thessalonica almost immediately (<a onClick="return mV(\'1Th\',3,1,2);">1Th 3:1,2</a>), and perhaps Silas to some other part of Macedonia, nor did they again join him until after he had settled for some time in Corinth (<a onClick="return mV(\'Act\',18,5);">Ac 18:5</a>; <a onClick="return mV(\'1Th\',3,6);">1Th 3:6</a>). The rapid extension of the Christian faith in Macedonia at this time may be judged from the phrases used by Paul in his 1st Epistle to the Thessalonians, the earliest of his extant letters, written during this visit to Corinth. He there speaks of the Thessalonian converts as being an example "to all that believe in Macedonia and in Achaia" (<a onClick="return mV(\'1Th\',1,7);">1Th 1:7</a>), and he commends their love "toward all the brethren that are in all Macedonia" (<a onClick="return mV(\'1Th\',4,10);">1Th 4:10</a>). Still more striking are the words, "From you hath sounded forth the word of the Lord, not only in Macedonia and Achaia, but in every place your faith to God-ward is gone forth" (<a onClick="return mV(\'1Th\',1,8);">1Th 1:8</a>).<P>2. Paul\'s Second Visit:<P>On his 3rd missionary journey, the apostle paid two further visits to Macedonia. During the course of a long stay at Ephesus he laid plans for a 2nd journey through Macedonia and Achaia, and dispatched two of his helpers, Timothy and Erastus, to Macedonia to prepare for his visit (<a onClick="return mV(\'Act\',19,21,22);">Ac 19:21,22</a>). Some time later, after the uproar at Ephesus raised by Demetrius and his fellow-silversmiths (<a onClick="return mV(\'Act\',19,\'23-41\');">Ac 19:23-41</a>), Paul himself set out for Macedonia (<a onClick="return mV(\'Act\',20,1);">Ac 20:1</a>). Of this visit Luke gives us a very summary account, telling us merely that Paul, "when he had gone through those parts, and had given them much exhortation,...came into Greece" (<a onClick="return mV(\'Act\',20,2);">Ac 20:2</a>); but from 2 Corinthians, written from Macedonia (probably from Philippi) during the course of this visit, we learn more of the apostle\'s movements and feelings. While at Ephesus, Paul had changed his plans. His intention at first had been to travel across the Aegean Sea to Corinth, to pay a visit from there to Macedonia and to return to Corinth, so as to sail direct to Syria (<a onClick="return mV(\'2Cr\',1,15,16);">2Co 1:15,16</a>). But by the time at which he wrote the 1st Epistle to the Corinthians, probably near the end of his stay at Ephesus, he had made up his mind to go to Corinth by way of Macedonia, as we have seen that he actually did (<a onClick="return mV(\'1Cr\',16,5,6);">1Co 16:5,6</a>). From <a onClick="return mV(\'2Cr\',2,13);">2Co 2:13</a> we learn that he traveled from Ephesus to Troas, where he expected to find Titus. Titus, however, did not yet arrive, and Paul, who "had no relief for (his) spirit," left Troas and sailed to Macedonia. Even here the same restlessness pursued him: "fightings without, fears within" oppressed him, till the presence of Titus brought some relief (<a onClick="return mV(\'2Cr\',7,5,6);">2Co 7:5,6</a>). The apostle was also cheered by "the grace of God which had been given in the churches of Macedonia" (<a onClick="return mV(\'2Cr\',8,1);">2Co 8:1</a>); in the midst of severe persecution, they bore their trials with abounding joy, and their deep poverty did not prevent them begging to be allowed to raise a contribution to send to the Christians in Jerusalem (<a onClick="return mV(\'Rom\',15,26);">Ro 15:26</a>; <a onClick="return mV(\'2Cr\',8,\'2-4\');">2Co 8:2-4</a>). Liberality was, indeed, from the very outset one of the characteristic virtues of the Macedonian churches. The Philippians had sent money to Paul on two occasions during his first visit to Thessalonica (<a onClick="return mV(\'Phl\',4,16);">Php 4:16</a>), and again when he had left Macedonia and was staying at Corinth (<a onClick="return mV(\'2Cr\',11,9);">2Co 11:9</a>; <a onClick="return mV(\'Phl\',4,15);">Php 4:15</a>). On the present occasion, however, the Corinthians seem to have taken the lead and to have prepared their bounty in the previous year, on account of which the apostle boasts of them to the Macedonian Christians (<a onClick="return mV(\'2Cr\',9,2);">2Co 9:2</a>). He suggests that on his approaching visit to Achaia he may be accompanied by some of these Macedonians (<a onClick="return mV(\'2Cr\',9,4);">2Co 9:4</a>), but whether this was actually the case we are not told.<P>3. Paul\'s Third Visit:<P>The 3rd visit of Paul to Macedonia took place some 3 months later and was occasioned by a plot against his life laid by the Jews of Corinth, which led him to alter his plan of sailing from Cenchrea, the eastern seaport of Corinth, to Syria (<a onClick="return mV(\'2Cr\',1,16);">2Co 1:16</a>; <a onClick="return mV(\'Act\',20,3);">Ac 20:3</a>). He returned to Macedonia accompanied as far as Asia by 3 Macedonian Christians—Sopater, Aristarchus and Secundus—and by 4 from Asia Minor. Probably Paul took the familiar route by the Via Egnatia, and reached Philippi immediately before the days of unleavened bread; his companions preceded him to Troas (<a onClick="return mV(\'Act\',20,5);">Ac 20:5</a>), while he himself remained at Philippi until after the Passover (Thursday, April 7, 57 AD, according to Ramsay\'s chronology), when he sailed from Neapolis together with Luke, and joined his friends in Troas (<a onClick="return mV(\'Act\',20,6);">Ac 20:6</a>).<P>4. Paul\'s Later Visits:<P>Toward the close of his 1st imprisonment at Rome Paul planned a fresh visit to Macedonia as soon as he should be released (<a onClick="return mV(\'Phl\',1,26);">Php 1:26</a>; <a onClick="return mV(\'Phl\',2,24);">2:24</a>), and even before that he intended to send Timothy to visit the Philippian church and doubtless those of Berea and Thessalonica also. Whether Timothy actually went on this mission we cannot say; that Paul himself went back to Macedonia once more we learn from <a onClick="return mV(\'1Ti\',1,3);">1Ti 1:3</a>, and we may infer a 5th visit from the reference to the apostle\'s stay at Troas, which in all probability belongs to a later occasion (<a onClick="return mV(\'2Ti\',4,13);">2Ti 4:13</a>).<P>IV. The Macedonian Church.<P>1. Prominence of Women:<P>Of the churches of Macedonia in general, little need be said here. A striking fact is the prominence in them of women, which is probably due to the higher social position held by women in this province than in Asia Minor (Lightfoot, Philippians4, 55ff). We find only two references to women in connection with Paul\'s previous missionary work; the women proselytes of high social standing take a share in driving him from Pisidian Antioch (<a onClick="return mV(\'Act\',13,50);">Ac 13:50</a>), and Timothy\'s mother is mentioned as a Jewess who believed (<a onClick="return mV(\'Act\',16,1);">Ac 16:1</a>). But in Macedonia all is changed. To women the gospel was first preached at Philippi (<a onClick="return mV(\'Act\',16,13);">Ac 16:13</a>); a woman was the first convert and the hostess of the evangelists (<a onClick="return mV(\'Act\',16,14,15);">Ac 16:14,15</a>); a slave girl was restored to soundness of mind by the apostle (<a onClick="return mV(\'Act\',16,18);">Ac 16:18</a>), and long afterward Paul mentions two women as having "labored with (him) in the gospel" and as endangering the peace of the church by their rivalry (<a onClick="return mV(\'Phl\',4,2,3);">Php 4:2,3</a>). At Thessalonica a considerable number of women of the first rank appear among the earliest converts (<a onClick="return mV(\'Act\',17,4);">Ac 17:4</a>), while at Berea also the church included from the outset numerous Greek women of high position (<a onClick="return mV(\'Act\',17,12);">Ac 17:12</a>).<P>2. Marked Characteristics:<P>The bond uniting Paul and the Macedonian Christians seems to have been a peculiarly close and affectionate one. Their liberality and open-heartedness, their joyousness and patience in trial and persecution, their activity in spreading the Christian faith, their love of the brethren—these are a few of the characteristics which Paul specially commends in them (1 and 2 Thessalonians; Philippians; <a onClick="return mV(\'2Cr\',8,\'1-8\');">2Co 8:1-8</a>), while they also seem to have been much freer than the churches of Asia Minor from Judaizing tendencies and from the allurements of "philosophy and vain deceit."<P>3. Its Members:<P>We know the names of a few of the early members of the Macedonian churches—Sopater (<a onClick="return mV(\'Act\',20,4);">Ac 20:4</a>) or Sosipater (<a onClick="return mV(\'Rom\',16,21);">Ro 16:21</a>: the identification is a probable, though not a certain, one) of Berea; Aristarchus (<a onClick="return mV(\'Act\',19,29);">Ac 19:29</a>; <a onClick="return mV(\'Act\',20,4);">20:4</a>; <a onClick="return mV(\'Act\',27,2);">27:2</a>; <a onClick="return mV(\'Col\',4,10);">Col 4:10</a>; <a onClick="return mV(\'Phm\',1,24);">Phm 1:24</a>), Jason (<a onClick="return mV(\'Act\',17,\'5-9\');">Ac 17:5-9</a>; <a onClick="return mV(\'Rom\',16,21);">Ro 16:21</a>) and Secundus (<a onClick="return mV(\'Act\',20,4);">Ac 20:4</a>) of Thessalonica; Clement (<a onClick="return mV(\'Phl\',4,3);">Php 4:3</a>), Epaphroditus (<a onClick="return mV(\'Phl\',2,25);">Php 2:25</a>; <a onClick="return mV(\'Phl\',4,18);">4:18</a>), Euodia (<a onClick="return mV(\'Phl\',4,2);">Php 4:2</a>; this, not Euodias (the King James Version), is the true form), Syntyche (same place), Lydia (<a onClick="return mV(\'Act\',16,14,40);">Ac 16:14,40</a>; a native of Thyatira), and possibly Luke (Ramsay, Paul the Traveler, 201ff) of Philippi. Gaius is also mentioned as a Macedonian in <a onClick="return mV(\'Act\',19,29);">Ac 19:29</a>, but perhaps the reading of a few manuscripts Makedona is to be preferred to the Textus Receptus of the New Testament Makedonas in which case Aristarchus alone would be a Macedonian, and this Gaius would probably be identical with the Gaius of Derbe mentioned in <a onClick="return mV(\'Act\',20,4);">Ac 20:4</a> as a companion of Paul (Ramsay, op. cit., 280). The later history of the Macedonian churches, together with lists of all their known bishops, will be found in Le Quien, Oriens Christianus, II, 1ff; III, 1089ff 1045 f.<P>LITERATURE.<P>General: C. Nicolaides, Macedonien, Berlin, 1899; Berard, La Macedoine, Paris, 1897; "Odysseus," Turkey in Europe, London, 1900. Secular History: Hogarth, Philip and Alexander of Macedon, London,1897,and the histories of the Hellenistic period by Holm, Niese, Droysen and Kaerst. Ethnography and Language: O. Hoffmann, Die Makedonen, ihre Sprache und ihr Volkstum, Gottingen, 1906. Topography and Antiquities: Heuzey and Daumet, Mission archeologique de Macedoine, Paris, 1876; Cousinery, Voyage dans la Macedoine, Paris, 1831; Clarke, Travels 4, VII, VIII, London, 1818; Leake, Travels in Northern Greece, III, London, 1835; Duchesne and Bayet, Memoire sur une mission en Macedoine et au Mont Athos, Paris, 1876; Hahn, Reise von Belgrad nach Saloniki, Vienna, 1861. Coins: Head, Historia Nummorum, 193f; British Museum Catalogue of Coins: Macedonia, etc., London, 1879. Inscriptions: CIG, numbers 1951-2010; CIL, III, 1 and III, Suppl.; Dimitsas, \'H ... Athens, 1896.``176';
isbe[5656]='Machaerus`ma-ke\'-rus (Machairous): Not mentioned in Scripture, canonical or apocryphal, but its importance in Jewish history justifies its inclusion here. Pliny (NH, v.16,72) speaks of it as, after Jerusalem, the strongest of Jewish fortresses. It was fortified by Alexander Janneus (BJ, VII, vi, 2). It was taken and destroyed by Gabinius (ibid., I, viii, 5; Ant, XIV, v, 4). Herod the Great restored it and, building a city here, made it one of his residences (BJ, VII, vi,1,2). It lay within the tetrarchy assigned to Antipas at the death of Herod. The wife of Antipas, daughter of Aretas, privately aware of his infidelity, asked to be sent hither (Ant., XVIII, v, 1). Here Josephus has fallen into confusion if he meant by the phrase "a place in the borders of the dominions of Aretas and Herod" that it was still in Herod\'s hands, since immediately he tells us that it was "subject to her father." It was natural enough, however, that a border fortress should be held now by one and now by the other. It may have passed to Aretas by some agreement of which we have no record; and Herod, unaware that his wife knew of his guilt, would have no suspicion of her design in wishing to visit her father. If this is true, then the Baptist could not have been imprisoned and beheaded at Macherus (ibid., 2). The feast given to the lords of Galilee would most probably be held at Tiberias; and there is nothing in the Gospel story to hint that the prisoner was some days\' journey distant (<a onClick="return mV(\'Mar\',6,14);">Mr 6:14</a>). The citadel was held by a Roman garrison until 66 AD, which then evacuated it to escape a siege (BJ, II, xviii, 6). Later by means of a stratagem it was recovered for the Romans by Bassus, circa 72 AD (BJ, VII, vi, 4).<P>The place is identified with the modern Mkaur, a position of great strength on a prominent height between Wady Zerqa Ma\'in and Wady el-Mojib, overlooking the Dead Sea. There are extensive ruins.``54';
isbe[5657]='Machbannai`mak\'-ba-ni, -ba-na\'-i (makhbannay; the King James Version Machbanai): A Gadite who attached himself to David in Ziklag (<a onClick="return mV(\'1Ch\',12,13);">1Ch 12:13</a>).``1';
isbe[5658]='Machbena`mak-be\'-na (makhbenah; Septuagint: Codex Vaticanus Machabena; Codex Alexandrinus Machamena; the King James Version, Machbenah): A name which occurs in the genealogical list of Judah (<a onClick="return mV(\'1Ch\',2,49);">1Ch 2:49</a>), apparently the name of a place, which may be the same as "Cabbon" (<a onClick="return mV(\'Jos\',15,40);">Jos 15:40</a>), probably to be identified with el-Kubeibeh, about 3 miles south of Beit Jibrin.``1';
isbe[5659]='Machi`ma\'-ki (makhi; Peshitta and some manuscripts of Septuagint read "Machir"): A Gadite, father of Geuel, one of the 12 spies (<a onClick="return mV(\'Num\',13,15);">Nu 13:15</a>).``1';
isbe[5660]='Machir; Machirite`ma\'-kir (makhir; Macheir), ma\'-kir-it:<P>(1) The eldest son of Manasseh (<a onClick="return mV(\'Gen\',50,23);">Ge 50:23</a>). In <a onClick="return mV(\'Num\',26,29);">Nu 26:29</a> it is recorded that Machir begat Gilead, but another narrative informs us that the children of Machir "went to Gilead, and took it, and dispossessed the Amorites that were therein. And Moses gave Gilead unto Machir the son of Manasseh; and he dwelt therein" (<a onClick="return mV(\'Num\',32,39,40);">Nu 32:39,40</a>; <a onClick="return mV(\'Jos\',17,1,3);">Jos 17:1,3</a>; compare also <a onClick="return mV(\'1Ch\',2,21,25);">1Ch 2:21,25</a>; <a onClick="return mV(\'1Ch\',7,\'14-17\');">7:14-17</a>; <a onClick="return mV(\'Deu\',3,15);">De 3:15</a>; <a onClick="return mV(\'Jos\',13,31);">Jos 13:31</a>). In the song of Deborah, Machir is used as equivalent to Manasseh (<a onClick="return mV(\'Jdg\',5,14);">Jud 5:14</a>).<P>(2) Son of Ammiel, dwelling in Lo-debar (<a onClick="return mV(\'2Sa\',9,4,5);">2Sa 9:4,5</a>), a wealthy landowner who protected Mephibosheth (Meribbaal), son of Jonathan, until assured of the friendly intentions of David (compare Ant, VII, ix, 8). Afterward, during the rebellion of Absalom, Machir with others came to David\'s assistance at Mahanaim, bringing supplies for the king and his men (<a onClick="return mV(\'2Sa\',17,27);">2Sa 17:27</a>).``95';
isbe[5661]='Machmas`mak\'-mas.`<a href="./study/isbe/search.html?string=MICHMASH">MICHMASH</a>`1';
isbe[5662]='Machnadebai`mak-nad\'-e-bi, mak-na-de\'-bi (makhnaddebhay): Son of Bani, one of those who married foreign wives (<a onClick="return mV(\'Ezr\',10,40);">Ezr 10:40</a>).``1';
isbe[5663]='Machpelah`mak-pe\'-la (ha-makhpelah, "the Machpelah"; to diploun, "the double"): The name of a piece of ground and of a cave purchased by Abraham as a place of sepulcher. The word is supposed to mean "double" and refers to the condition of the cave. It is translated "double cave" (to diploun spelaion) in the Septuagint in <a onClick="return mV(\'Gen\',23,17);">Ge 23:17</a>. The name is applied to the ground in <a onClick="return mV(\'Gen\',23,19);">Ge 23:19</a>; <a onClick="return mV(\'Gen\',49,30);">49:30</a>; <a onClick="return mV(\'Gen\',50,13);">50:13</a>, and to the cave in <a onClick="return mV(\'Gen\',23,9);">Ge 23:9</a>; <a onClick="return mV(\'Gen\',25,9);">25:9</a>. In <a onClick="return mV(\'Gen\',23,17);">Ge 23:17</a> we have the phrase "the field of Ephron, which was in (the) Machpelah."<P>1. Scriptural Data:<P>The cave belonged to Ephron the Hittite, the son of Zohar, from whom Abraham purchased it for 400 shekels of silver (<a onClick="return mV(\'Gen\',23,\'8-16\');">Ge 23:8-16</a>). It is described as "before," i.e. "to the east of" Mamre (<a onClick="return mV(\'Gen\',23,17);">Ge 23:17</a>) which (<a onClick="return mV(\'Gen\',23,19);">Ge 23:19</a>) is described as the same as Hebron (see, too, <a onClick="return mV(\'Gen\',25,9);">Ge 25:9</a>; <a onClick="return mV(\'Gen\',49,30);">49:30</a>; <a onClick="return mV(\'Gen\',50,13);">50:13</a>). Here were buried Abraham and Sarah, Isaac and Rebecca, Jacob and Leah. (Compare however the curious variant tradition in <a onClick="return mV(\'Act\',7,16);">Ac 7:16</a>, "Shechem" instead of "Hebron.")<P>2. Tradition Regarding the Site:<P>Josephus (BJ, IV, ix, 7) speaks of the monuments (mnemeia) of Abraham and his posterity which "are shown to this very time in that small city (i.e. in Hebron); the fabric of which monuments are of the most excellent marble and wrought after the most excellent manner"; and in another place he writes of Isaac being buried by his sons with his wife in Hebron where they had a monument belonging to them from their forefathers (Ant., I, xxii, 1). The references of early Christian writers to the site of the tombs of the patriarchs only very doubtfully apply to the present buildings and may possibly refer to Ramet el-Khalil (see <a href="./study/isbe/search.html?string=MAMRE">MAMRE</a>). Thus the Bordeaux Pilgrim (333 AD) mentions a square enclosure built of stones of great beauty in which Abraham, Isaac and Jacob were buried with their wives. Antonius Martyr (circa 600) and Arculf (698) also mention this monument. Mukaddasi speaks (circa 985) of the strong fortress around the tombs of the patriarchs built of great squared stones, the work of Jinns, i.e. of supernatural beings. From this onward the references are surely to the present site, and it is difficult to believe, if, as good authorities maintain, the great buttressed square wall enclosing the site is work at least as early as Herod, that the earlier references can be to any other site. It is certain that the existing buildings are very largely those which the Crusaders occupied; there are many full references to this place in medieval Moslem writers.<P>3. The Charam at Hebron:<P>The Charam at Hebron, which present-day tradition, Christian, Jewish and Moslem, recognizes as built over the cave of Machpelah, is one of the most jealousy guarded sanctuaries in the world. Only on rare occasions and through the exercise of much political pressure have a few honored Christians been allowed to visit the spot. The late King Edward VII in 1862 and the present King George V, in 1882, with certain distinguished scholars in their parties, made visits which have been chiefly important through the writings of their companions—Stanley in 1862 and Wilson and Conder in 1882. One of the latest to be accorded the privilege was C.W. Fairbanks, late vice-president of the United States of America. What such visitors have been permitted to see has not been of any great antiquity nor has it thrown any certain fight on the question of the genuineness of the site.<P>The space containing the traditional tombs is a great quadrangle 197 ft. in length (northwest to southeast) and 111 ft. in breadth (northeast to southwest). It is enclosed by a massive wall of great blocks of limestone, very hard and akin to marble. The walls which are between 8 and 9 ft thick are of solid masonry throughout. At the height of 15 ft. from the ground, at indeed the level of the floor within, the wall is set back about 10 inches at intervals, so as to leave pilasters 3 ft. 9 inches wide, with space between each of 7 ft. all round. On the longer sides there are 16 and on the shorter sides 8 such pilasters, and there are also buttresses 9 ft. wide on each face at each angle. This pilastered wall runs up for 25 ft., giving the total average height from the ground of 40 ft. The whole character of the masonry is so similar to the wall of the Jerusalem Charam near the "wailing place" that Conder and Warren considered that it must belong to that period and be Herodian work.<P>The southern end of the great enclosure is occupied by a church—probably a building entirely of the crusading period—with a nave and two aisles. The rest is a courtyard open to the air. The cenotaphs of Isaac and Rebecca are within the church; those of Abraham and Sarah occupy octagonal chapels in the double porch before the church doors; those of Jacob and Leah are placed in chambers near the north end of the Charam. The six monuments are placed at equal distances along the length of the enclosure, and it is probable that their positions there have no relation to the sarcophagi which are described as existing in the cave itself.<P>4. The Cave:<P>It is over this cave that the chief mystery hangs. It is not known whether it has been entered by any man at present alive, Moslem or otherwise. While the cave was in the hands of the Crusaders, pilgrims and others were allowed to visit this spot. Thus Rabbi Benjamin of Tudela, writing in 1163 AD, says that "if a Jew comes, who gives an additional fee to the keeper of the cave, an iron door is opened, which dates from the times of our forefathers who rest in peace, and with a burning candle in his hand the visitor descends into a first cave which is empty, traverses a second in the same state and at last reaches a third which contains six sepulchres—those of Abraham, Isaac and Jacob, and of Sarah, Rebecca and Leah, one opposite the other. ... A lamp burns in the cave and upon the sepulchre continually, both night and day." The account reminds us of the condition of many Christian tomb-shrines in Palestine today.<P>It would appear from the description of modern observers that all entrance to the cave is now closed; the only known approaches are never now opened and can only be reached by breaking up the flags of the flooring. Through one of the openings—which had a stone over it pierced by a circular hole 1 ft. in diameter—near the northern wall of the old church, Conder was able by lowering a lantern to see into a chamber some 15 ft. under the church. He estimated it to be some 12 ft. square; it had plastered walls, and in the wall toward the southeast there was a door which appeared like the entrance to a rock-cut tomb. On the outside of the Charam wall, close to the steps of the southern entrance gateway is a hole in the lowest course of masonry, which may possibly communicate with the western cave. Into this the Jews of Hebron are accustomed to thrust many written prayers and vows to the patriarchs.<P>The evidence, historical and archaeological seems to show that the cave occupies only the south end of the great quadrilateral enclosure under part only of the area covered by the church.<P>See <a href="./study/isbe/search.html?string=HEBRON">HEBRON</a>.<P>LITERATURE.<P>PEF, III., 333-46; PEFS, 1882, 197; 1897, 53; 1912, 145-150; HDB, III., article "Machpelah," by Warren; Stanley, SP and Lectures on the Jewish Church; "Pal under the Moslems," PEF; Pilgrim Text Soc. publications.``117';
isbe[5664]='Maconah`ma-ko\'-na: the King James Version <a href="./study/isbe/search.html?string=MEKONAH">Mekonah</a>, (which see).``1';
isbe[5665]='Macron`ma\'-kron (Makron>): Ptolemy Macron who had been appointed by Ptolemy Philmetor VI governor of Cyprus and deserted to Antiochus Epiphanes, king of Syria (2Macc 10:12ff). Under Antiochus he was governor of Coele-Syria and Phoenicia (2Macc 8:8). In 1Macc 3:38 and 2Macc 4:45 he is called "Ptolemy the son of Dorymenes." At first he was a fierce and cruel enemy of the Jews and was one of those chosen by Lysias to destroy Israel and reduce Judas Maccabee (same place). Later he apparently relented toward the Jews (2Macc 10:12), fell into disfavor with Antiochus Eupator, before whom he was accused by the king\'s friends, and was so galled by being constantly called traitor that he ended his life with poison (2Macc 10:13).``5';
isbe[5666]='Mad; Madness`(halal, shagha\'; mania):<P>1. In the Old Testament:<P>These words, and derivatives from the same roots are used to express various conditions of mental derangement. Though usually translated "mad," or "madness" they are often used for temporary conditions to which one would scarcely apply them today except as common colloquial inaccuracies. The madness coupled with folly in Ecclesiastes is rather the excessive frivolity and dissipation on the part of the idle rich (so in <a onClick="return mV(\'Ecc\',1,17);">1:17</a>; <a onClick="return mV(\'Ecc\',2,\'2-12\');">2:2-12</A>; <a onClick="return mV(\'Ecc\',7,25);">7:25</a>; <a onClick="return mV(\'Ecc\',9,3);">9:3</a>; <a onClick="return mV(\'Ecc\',10,13);">10:13</a>). The insensate fury of the wicked against the good is called by this name in <a onClick="return mV(\'Psa\',102,8);">Ps 102:8</a>. In <a onClick="return mV(\'Deu\',28,\'28-34\');">De 28:28-34</a> it is used to characterize the state of panic produced by the oppression of tyrannical conquerors, or (as in <a onClick="return mV(\'Zec\',12,4);">Zec 12:4</a>) by the judgment of God on sinners. This condition of mind is metaphorically called a drunkenness with the wine of God\'s wrath (<a onClick="return mV(\'Jer\',25,16);">Jer 25:16</a>; <a onClick="return mV(\'Jer\',51,7);">51:7</a>). The same mental condition due to terror-striking idols is called "madness" in <a onClick="return mV(\'Jer\',50,38);">Jer 50:38</a>. The madman of <a onClick="return mV(\'Pro\',26,18);">Pr 26:18</a> is a malicious person who carries his frivolous jest to an unreasonable length, for he is responsible for the mischief he causes. The ecstatic condition of one under the inspiration of the Divine or of evil spirits, such as that described by Balaam (<a onClick="return mV(\'Num\',24,3);">Nu 24:3</a>f), or that which Saul experienced (<a onClick="return mV(\'1Sa\',10,10);">1Sa 10:10</a>), is compared to madness; and conversely in the Near East at the present day the insane are supposed to be Divinely inspired and to be peculiarly under the Divine protection. This was the motive which led David, when at the court of Achish, to feign madness (<a onClick="return mV(\'1Sa\',21,\'13-15\');">1Sa 21:13-15</a>). It is only within the last few years that any provision has been made in Palestine for the restraint even of dangerous lunatics, and there are many insane persons wandering at large there.<P>This association of madness with inspiration is expressed in the name "this mad fellow" given to the prophet who came to anoint Jehu, which did not necessarily convey a disrespectful meaning (<a onClick="return mV(\'2Ki\',9,11);">2Ki 9:11</a>). The true prophetic spirit was, however, differentiated from the ravings of the false prophets by Isaiah (<a onClick="return mV(\'Isa\',44,25);">44:25</a>), these latter being called mad by Jeremiah (<a onClick="return mV(\'2Ki\',29,26);">29:26</a>) and Hosea (<a onClick="return mV(\'Hsa\',9,7);">9:7</a>).<P>The most interesting case of real insanity recorded in the Old Testament is that of Saul, who, from being a shy, self-conscious young man, became, on his exaltation to the kingship, puffed up with a megalomania, alternating with fits of black depression with homicidal impulses, finally dying by suicide. The cause of his madness is said to have been an evil spirit from God (<a onClick="return mV(\'1Sa\',18,10);">1Sa 18:10</a>), and when, under the influence of the ecstatic mood which alternated with his depression, he conducted himself like a lunatic (<a onClick="return mV(\'1Sa\',19,23);">1Sa 19:23</a>f), his mutterings are called "prophesyings." The use of music in his case as a remedy (<a onClick="return mV(\'1Sa\',16,16);">1Sa 16:16</a>) may be compared with Elisha\'s use of the same means to produce the prophetic ecstasy (<a onClick="return mV(\'2Ki\',3,15);">2Ki 3:15</a>).<P>The story of Nebuchadnezzar is another history of a sudden accession of insanity in one puffed up by self-conceit and excessive prosperity. His delusion that he had become as an ox is of the same nature as that of the daughters of Procyus recorded in the Song of Silenus by Virgil (Ecl. vi.48).<P>2. In the New Testament:<P>In the New Testament the word "lunatic" (seleniazomenoi) (the King James Version <a onClick="return mV(\'Mat\',4,24);">Mt 4:24</a>; <a onClick="return mV(\'Mat\',17,15);">17:15</a>) is correctly rendered in the Revised Version (British and American) "epileptic." Undoubtedly many of the demoniacs were persons suffering from insanity. The words "mad" or "madness" occur 8 times, but usually in the sense of paroxysms of passion, excitement, and foolishness. Thus in <a onClick="return mV(\'Act\',26,11);">Ac 26:11</a> Paul says that before his conversion he was "exceedingly mad" (emmainomenos) against the Christians. In <a onClick="return mV(\'1Cr\',14,23);">1Co 14:23</a>, those who "speak with tongues" in Christian assemblies are said to appear "mad" to the outsider. Rhoda was called "mad" when she announced that Peter was at the door (<a onClick="return mV(\'Act\',12,15);">Ac 12:15</a>). The madness with which the Jews were filled when our Lord healed the man with the withered hand is called anoia, which is literally senselessness (<a onClick="return mV(\'Luk\',6,11);">Lu 6:11</a>), and the madness of Balaam is called paraphronia, "being beside himself" (<a onClick="return mV(\'2Pe\',2,16);">2Pe 2:16</a>). Paul is accused by Festus of having become deranged by overstudy (<a onClick="return mV(\'Act\',26,24);">Ac 26:24</a>). It is still the belief among the fellahin that lunatics are people inspired by spirits, good or evil, and it is probable that all persons showing mental derangement would naturally be described as "possessed," so that, without entering into the vexed question of demoniacal possession, any cases of insanity cured by our Lord or the apostles would naturally be classed in the same category.`<a href="./study/isbe/search.html?string=LUNATIC">LUNATIC</a>`107';

isbe[5670]='Madmannah`mad-man\'-a (madhmannah; Septuagint: Codex Vaticanus Macharim; Codex Alexandrinus Bedebena (<a onClick="return mV(\'Jos\',15,31);">Jos 15:31</a>); Codex Vaticanus Marmena; Codex Alexandrinus Madmena (<a onClick="return mV(\'1Ch\',2,49);">1Ch 2:49</a>)): This town lay in the Negeb of Judah and is mentioned with Hormah and Ziklag. It is represented in <a onClick="return mV(\'Jos\',19,5);">Jos 19:5</a>, etc., by Beth-marcaboth. Umm Deimneh, 12 miles north of Beersheba, has been proposed on etymological grounds (PEF, III,392,399, Sh XXIV).``1';
isbe[5671]='Madmen`mad\'-men (madhmen; kai pausin pausetai): An unidentified town in Moab against which Jeremiah prophesied (<a onClick="return mV(\'Jer\',48,2);">48:2</a>). The play upon the words here suggests a possible error in transcription: gam madhmen tiddomi, "Also, Madmen, thou shalt be silenced." The initial "M" of "Madmen" may have arisen by dittography from the last letter of gam. We should then vocalize it as "Dimon," which of course is "Dibon."``1';
isbe[5672]='Madmenah`mad-me\'-na (madhmenah; Madebena): A place mentioned only in Isaiah\'s description of the Assyrian advance upon Jerusalem (<a onClick="return mV(\'Isa\',10,31);">Isa 10:31</a>). It is not identified.``1';
isbe[5673]='Madness`mad\'-nes.`<a href="./study/isbe/search.html?string=MAD,+MADNESS">MAD, MADNESS</a>`1';
isbe[5674]='Madon`ma\'-don (madhon; Septuagint: Codex Vaticanus Marrhon; Codex Alexandrinus Madon (<a onClick="return mV(\'Jos\',11,1);">Jos 11:1</a>); Codex Vaticanus Marmoth; Codex Alexandrinus Maron (<a onClick="return mV(\'Jos\',12,19);">Jos 12:19</a>)): A royal city of the Canaanites named along with Hazor of Galilee. El-Medineh, "the city," on the heights west of the Sea of Galilee, with which it might possibly be identified, probably dates only from Moslem times. It seems likely that the common confusion of the Hebrew letter daleth ("d") for the Hebrew letter resh ("r") has occurred, and that we should read "Maron." The place may be then identified with Meiron, a village with ancient ruins and rock tombs at the foot of Jebel Jermuk, a little to the northwest of Safed.``54';
isbe[5675]='Maelus`ma-e\'-lus (LXX: Codex Alexandrinus Maelos; Codex Vaticanus Milelos): One of those who at Esdras\' request put away his foreign wife (1Esdras 9:26 equals "Mijamin" in the parallel <a onClick="return mV(\'Ezr\',10,25);">Ezr 10:25</a>).``1';
isbe[5676]='Magadan`mag\'-a-dan, ma-ga\'-dan (Magadan; the reading of the Textus Receptus of the New Testament, Magdala (the King James Version), but Magdala is unsupported): This name appears only in <a onClick="return mV(\'Mat\',15,39);">Mt 15:39</a>. In the parallel passage, <a onClick="return mV(\'Mar\',8,10);">Mr 8:10</a>, its place is taken by Dalmanutha. From these two passages it is reasonable to infer that "the borders of Magadan" and "the parts of Dalmanutha" were contiguous. We may perhaps gather from the narrative that they lay on the western shore of the Sea of Galilee. After the feeding of the 4,000, Jesus and His disciples came to these parts. Thence they departed to "the other side" (<a onClick="return mV(\'Mar\',8,13);">Mr 8:13</a>), arriving at Bethsaida. This is generally believed to have been Bethsaida Julias, northeast of the sea, whence He set out on His visit to Caesarea Philippi. In this case we might look for Dalmanutha and Magadan somewhere south of the Plain of Gennesaret, at the foot of the western hills. Stanley (SP, 383) quotes Schwarz to the effect that a cave in the face of these precipitous slopes bears the name of Teliman or Talmanutha. If this is true, it points to a site for Dalmanutha near \'Ain el-Fuliyeh. Magadan might then be represented by el-Mejdel, a village at the southwest corner of the Plain of Gennesaret. It is commonly identified with Magdala, the home of Mary Magdalene, but without any evidence. The name suggests that this was the site of an old Hebrew mighdal, "tower" or "fortress." The village with its ruins is now the property of the German Roman Catholics. The land in the plain has been purchased by a colony of Jews, and is once more being brought under cultivation.<P>The identification with Magdala is made more probable by the frequent interchange of "l" for "n", e.g. Nathan (Hebrew), Nethel (Aramaic).``54';
isbe[5677]='Magbish`mag\'-bish (maghbish; Septuagint: Codex Vaticanus Magebos; Codex Alexandrinus Maabeis): An unidentified town in Benjamin, 156 of the inhabitants of which are said to have returned from exile with Zerubbabel (<a onClick="return mV(\'Ezr\',2,30);">Ezr 2:30</a>). It does not appear in Nehemiah\'s list (<a onClick="return mV(\'Neh\',7,33);">Ne 7:33</a>). Septuagint (Codex Vaticanus), however, has Magebos. The name is probably identical with Magpiash, "one who sealed the covenant" (<a onClick="return mV(\'Neh\',10,20);">Ne 10:20</a>).``1';

isbe[5680]='Magdiel`mag\'-di-el (maghdi\'el; <a onClick="return mV(\'Gen\',36,43);">Ge 36:43</a>, Septuagint: Codex Alexandrinus Metoduel; <a onClick="return mV(\'1Ch\',1,54);">1Ch 1:54</a>; Codex Alexandrinus Mageduel; Codex Vaticanus Meduel): One of the "dukes" of Edom.``1';
