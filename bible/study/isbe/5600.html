isbe[5601]='Low Country``<a href="./study/isbe/search.html?string=SHEPHELAH">SHEPHELAH</a>`1';
isbe[5602]='Lowland`lo\'-land (shephelah; compare Arabic sufalat, "the lowest part"): The western part of Palestine, including the maritime plain and the foothills. There has been an attempt to restrict the term to the foothills, at least as far as the more ancient documents are concerned, but there can be little doubt that the maritime plain should be included. the Revised Version (British and American) has "lowland" throughout for shephelah, while the King James Version has "low country" (<a onClick="return mV(\'2Ch\',26,10);">2Ch 26:10</a>; <a onClick="return mV(\'2Ch\',28,18);">28:18</a>), "low plains" (<a onClick="return mV(\'1Ch\',27,28);">1Ch 27:28</a>; <a onClick="return mV(\'2Ch\',9,27);">2Ch 9:27</a>), "plain" (<a onClick="return mV(\'Jer\',17,26);">Jer 17:26</a>; <a onClick="return mV(\'Oba\',1,19);">Ob 1:19</a>; <a onClick="return mV(\'Zec\',7,7);">Zec 7:7</a>), "vale" or "valley" (<a onClick="return mV(\'Deu\',1,7);">De 1:7</a>; <a onClick="return mV(\'Jos\',9,1);">Jos 9:1</a>; <a onClick="return mV(\'Jos\',10,40);">10:40</a>).`<a href="./study/isbe/search.html?string=COUNTRY">COUNTRY</a>; <a href="./study/isbe/search.html?string=SHEPHELAH">SHEPHELAH</a>`37';
isbe[5603]='Lozon`lo\'-zon (Lozon): Head of a family of Solomon\'s servants (1Esdras 5:33); called "Darkon" in <a onClick="return mV(\'Ezr\',2,56);">Ezr 2:56</a>; <a onClick="return mV(\'Neh\',7,58);">Ne 7:58</a>.``1';
isbe[5604]='Lubim`lu\'-bim (lubhim): A people mentioned in the Old Testament (<a onClick="return mV(\'2Ch\',12,3);">2Ch 12:3</a>; <a onClick="return mV(\'2Ch\',16,8);">16:8</a>; <a onClick="return mV(\'Dan\',11,43);">Da 11:43</a>; <a onClick="return mV(\'Nah\',3,9);">Na 3:9</a>). In all these cases the word is translated in the King James Version "Libyans"; in the Revised Version (British and American) only in <a onClick="return mV(\'Dan\',11,43);">Da 11:43</a>. The people so named had their seat in North Africa, west of Egypt (compare <a onClick="return mV(\'Act\',2,10);">Ac 2:10</a>, "the parts of Libya about Cyrene"). See <a href="./study/isbe/search.html?string=LIBYA">LIBYA</a>. On three different occasions the Libyans invaded Egypt, and at length, in the 10th century BC, succeeded in founding an Egyptian dynasty under <a href="./study/isbe/search.html?string=SHISHAK">SHISHAK</a> (which see).``1';
isbe[5605]='Lucas`lu\'-kas, loo\'-kas. In <a onClick="return mV(\'Phm\',1,24);">Phm 1:24</a> the King James Version, for "Luke" (Revised Version).``1';
isbe[5606]='Lucifer`lu\'-si-fer, loo\'-si-fer: The morning star, an epithet of the planet Venus.`<a href="./study/isbe/search.html?string=ASTROLOGY">ASTROLOGY</a>`1';
isbe[5607]='Lucius (1)`lu\'-shi-us, lu\'-shus (Loukios, Leukios): A Roman consul who is said (1Macc 15:16ff) to have written a letter to Ptolemy Euergetes securing to Simon the high priest and to the Jews the protection of Rome. As the praenomen only of the consul is given, there has been much discussion as to the person intended. The weight of probability has been assigned to Lucius Calpurnius Piso, who was one of the consuls in 139-138 BC, the fact of his praenomen being Cneius and not Lucius being explained by an error in transcription and the fragmentary character of the documents. The authority of the Romans not being as yet thoroughly established in Asia, they were naturally anxious to form alliances with the kings of Egypt and with the Jews to keep Syria in check. The imperfections that are generally admitted in the transcription of the Roman letter are not such as in any serious degree to invalidate the authority of the narrative in 1Maccabees.``79';
isbe[5608]='Lucius (2)`(Loukios): This name is mentioned twice:<P>(1) In the church at Antioch which sent out Barnabas and Saul as its missionaries were several prophets and teachers, among whom was Lucius of Cyrene (<a onClick="return mV(\'Act\',13,1);">Ac 13:1</a>). He was probably one of those "men of Cyprus and Cyrene, who, when they were come to Antioch, spake unto the Greeks also" (<a onClick="return mV(\'Act\',11,20);">Ac 11:20</a>). It has been suggested that he is the same as Luke, but this is merely conjecture.<P>(2) "Lucius and Jason and Sosipater, my kinsmen" were among those who joined Paul in saluting the Christians in Rome (<a onClick="return mV(\'Rom\',16,21);">Ro 16:21</a>). By "kinsmen" Paul means "Jews" (compare <a onClick="return mV(\'Rom\',9,3);">Ro 9:3</a>; <a onClick="return mV(\'Rom\',16,11,21);">16:11,21</a>). This Lucius may have been the same person as (1), but, as we have no more information about either, we cannot determine this.``78';
isbe[5609]='Lucre`lu\'-ker, loo\'-ker (betsa\'>; kerdos): Literally, "gain" (<a onClick="return mV(\'1Sa\',8,3);">1Sa 8:3</a>; <a onClick="return mV(\'Tts\',1,7);">Tit 1:7</a>), hence, in the New Testament always qualified by "filthy" (<a onClick="return mV(\'1Ti\',3,8);">1Ti 3:8</a>, "not greedy of filthy lucre" aischrokerdes; so <a onClick="return mV(\'Tts\',1,7);">Tit 1:7</a>). The adverb is found in <a onClick="return mV(\'1Pe\',5,2);">1Pe 5:2</a> (see also <a onClick="return mV(\'Tts\',1,11);">Tit 1:11</a>). In <a onClick="return mV(\'1Ti\',3,3);">1Ti 3:3</a>, the Revised Version (British and American) changes the King James Version to "no lover of money" (aphilarguros).``1';
isbe[5610]='Lud; Ludim`lud, lu\'-dim, lood\'-im (ludh, ludhim, ludhiyum, "Ludites"; Loud, Loudieim; Targum Onk: ludha\'e):<P>1. Two Different Nationalities:<P>In <a onClick="return mV(\'Gen\',10,13);">Ge 10:13</a> Ludim appears as the firstborn of Mizraim (Egypt), and in <a onClick="return mV(\'Gen\',10,22);">10:22</A> Lud is the fourth son of Shem. We have therefore to do with two different nationalities bearing the same name, and not always easy to distinguish. <a onClick="return mV(\'1Ch\',1,11,17);">1Ch 1:11,17</a> simply repeat the statements of <a onClick="return mV(\'Gen\',10,13,22);">Ge 10:13,22</a>. In <a onClick="return mV(\'Isa\',66,19);">Isa 66:19</a> Lud is mentioned with Tarshish and Pul (generally regarded as a mistake for Phut), Tubal, Javan, and the isles. Accepting this emendation, the passage agrees with <a onClick="return mV(\'Jer\',46,9);">Jer 46:9</a>, where the Ludim are spoken of with Kush and Phut as the allies of Egypt; and also with <a onClick="return mV(\'Eze\',27,10);">Eze 27:10</a>, where Lud is referred to with Persia and Put as soldiers of Tyre. Lud, again, is mentioned with Ethiopia (Gush), Put, all the mingled people, Cab, and the children of the land which is in league (or, margin "the land of the covenant"), which were all to fall by the sword (<a onClick="return mV(\'Eze\',30,5);">Eze 30:5</a>).<P>2. The Semitic Lud:<P>Coming to the Semitic Lud, it is to be noted that the Assyrians called Lydia Lu(d)du, and that the mythical ancestor of the Lydians, according to Herodotus (i.7), was Lydos, and their first king, Agros, was descended from Ninos and Belos, i.e. Assyria and Babylonia. The apparently Assyrian colony in Cappadocia about 2000 BC, who used the Babylonian script, may be regarded as supporting this statement, and that there were other colonies of the same nationality in the neighborhood is implied by the fact that Assyro-Babylonian was one of the official languages of the Hittite state whose capital was Hattu or Boghaz-keui. On the other hand when Gyges sent an embassy to Assur-bani-apli of Assyria, Lu(d)du is described as a country whose name had never before been heard, and whose language was unknown. As, however, the earlier kings of Assyria certainly warred in that district, this statement has to be taken with caution. Perhaps the name had changed in the interval, owing to an immigration similar to that which brought the Hittites into Asia Minor, and caused change in the language at the same time.<P>3. Not Recognizable as Semitic Later:<P>Naturally Lydia was not recognizable as Semitic in classical times. The existence of Lud in the neighborhood of Egypt as well as in Asia Minor finds parallels in the Syrian Mucri of the Assyrian inscriptions by the side of the Mucur which stood for Egypt, and still more in the Cappadocian Cush (Kusu) of certain Assyrian letters relating to horses, by the side of the Cush (Kusu likewise) which stands for Ethiopia.<P>4. Egyptian Lud Not Recognizable:<P>Everything points, therefore, to the Semitic Lud and Ludim being Lydia, and the identification may be regarded as satisfactory. It is altogether otherwise with the Egyptian Lud and Ludim, however, about which little can be said at present. The reference to a city which seems to be Putu-yawan in an inscription mentioning the 37th year of Nebuchadrezzar, and apparently referring to an expedition against Amasis, though it may stand for "Grecian Phut," has very little bearing upon the position of the Egyptian Lud, especially as the text in which it occurs is very mutilated. One thing is certain, however: the Hebrews regarded this Lud and Ludim as being Hamitic, and not Semitic.``136';
isbe[5611]='Luhith, Ascent of`lu\'-hith, loo\'-hith, ma\'-aleh ha-luchith): A place named in <a onClick="return mV(\'Isa\',15,5);">Isa 15:5</a>; <a onClick="return mV(\'Jer\',48,5);">Jer 48:5</a>. It is clearly identical with the way, or descent, of Horonaim. Eusebius, Onomasticon places Luhith between Areopolis and Zoar. Some way is intended by which fugitives from the Arabah could reach the uplands of the Moabite plateau. Guthe thinks it may be the road which leads from the district of the ancient Zoar on the eastern shore of the Dead Sea to the uplands through Wady Bene Hammad. Along this track ran also a Roman road. If Horonaim were the higher of the two places, this might account for the way being called the "descent" of Horonaim as going down from that place, and the "ascent" of Luhith as going up thence. Neither place can as yet be identified with certainty.``54';
isbe[5612]='Luke, the Evangelist`look, luk.<P>1. Name:<P>The name Luke (Loukas) is apparently an abbreviation for Loukanos. Old Latin manuscripts frequently have the words CATA LUCANUM as the title of the Third Gospel. (But the form Loukios, is also found in inscriptions synonymous with Loukas; compare Ramsay, The Expositor, December, 1912.)<P>It was a common fashion in the koine to abbreviate proper names, as it is today, for that matter (compare Amphias from Amphiatos, Antipas from Antipatros, Apollos from Apollonias, Demas from Demetrios, Zenas from Zenodoros, etc.; and see Jannaris, Historical Greek Grammar, section 287).<P>2. Mentioned Three Times by Name:<P>Paul alone names Luke (<a onClick="return mV(\'Col\',4,14);">Col 4:14</a>; <a onClick="return mV(\'2Ti\',4,11);">2Ti 4:11</a>; <a onClick="return mV(\'Phm\',1,24);">Phm 1:24</a>). He does not mention his own name in the Gospel or in the Acts. Compare the silence of the Fourth Gospel concerning the name of the apostle John. There was no particular occasion to mention Luke\'s name in the Gospel, except as the author, if he had so wished. The late legend that Luke was one of the Seventy sent out by Jesus (Epiphanius, Haer., ii.51, 11) is pure conjecture, as is the story that Luke was one of the Greeks who came to Philip for an introduction to Jesus (<a onClick="return mV(\'Jhn\',12,20);">Joh 12:20</a>f), or the companion of Cleopas in the walk to Emmaus (<a onClick="return mV(\'Luk\',24,13);">Lu 24:13</a>). The clear implication of <a onClick="return mV(\'Luk\',1,2);">Lu 1:2</a> is that Luke himself was not an eyewitness of the ministry of Jesus.<P>3. A Gentile:<P>In <a onClick="return mV(\'Col\',4,14);">Col 4:14</a> Luke is distinguished by Paul from those "of the circumcision" (Aristarchus, Mark, Jesus Justus). Epaphras, Luke, Demas form the Gentile group. He was believed by the early Christian writers to have come directly from heathendom to Christianity. He may or may not have been a Jewish proselyte. His first appearance with Paul at Troas (compare the "we"-sections, <a onClick="return mV(\'Act\',16,\'10-12\');">Ac 16:10-12</a>) is in harmony with this idea. The classic introduction to the Gospel (<a onClick="return mV(\'Luk\',1,\'1-4\');">Lu 1:1-4</a>) shows that he was a man of culture (compare Apollos and Paul). He was a man of the schools, and his Greek has a literary flavor only approached in the New Testament by Paul\'s writings and by the Epistle to the Hebrews.<P>4. Home:<P>His home is very uncertain. The text of D (Codex Bezae) and several Latin authorities have a "we-"passage in <a onClick="return mV(\'Act\',11,27);">Ac 11:27</a>. If this reading, the so-called B text of Blass, is the original, then Luke was at Antioch and may have been present at the great event recorded in <a onClick="return mV(\'Act\',13,1);">Ac 13:1</a>f. But it is possible that the Western text is an interpolation. At any rate, it is not likely that Luke is the same person as Lucius of <a onClick="return mV(\'Act\',13,1);">Ac 13:1</a>. Ramsay (St. Paul the Traveler, 389f) thinks that Eusebius (Historia Ecclesiastica, III, iv, 6) does not mean to say that Luke was a native of Antioch, but only that he had Antiochian family connections. Jerome calls him Lucas medicus Antiochensis. He certainly shows an interest in Antioch (compare <a onClick="return mV(\'Act\',11,\'19-27\');">Ac 11:19-27</a>; <a onClick="return mV(\'Act\',13,1);">13:1</a>; <a onClick="return mV(\'Act\',14,26);">14:26</a>; <a onClick="return mV(\'Act\',15,22,23,30,35);">15:22,23,30,35</a>; <a onClick="return mV(\'Act\',18,22);">18:22</a>). Antioch, of course, played a great part in the early work of Paul. Other stories make Luke live in Alexandria and Achaia and narrate that he died in Achaia or Bithynia. But we know that he lived in Philippi for a considerable period. He first meets Paul at Troas just before the vision of the Man from Macedonia (<a onClick="return mV(\'Act\',16,\'10-12\');">Ac 16:10-12</a>), and a conversation with Paul about the work in Macedonia may well have been the human occasion of that vision and call. Luke remains in Philippi when Paul and Silas leave (<a onClick="return mV(\'Act\',16,40);">Ac 16:40</a>, "They...departed"). He is here when Paul comes back on his 3rd tour bound for Jerusalem (<a onClick="return mV(\'Act\',20,\'3-5\');">Ac 20:3-5</a>). He shows also a natural pride in the claims of Philippi to the primacy in the province as against Amphipolis and Thessalonica (<a onClick="return mV(\'Act\',16,12);">Ac 16:12</a>, "the first of the district"). On the whole, then, we may consider Philippi as the home of Luke, though he was probably a man who had traveled a great deal, and may have been with Paul in Galatia before coming to Troas. He may have ministered to Paul in his sickness there (<a onClick="return mV(\'Gal\',4,14);">Ga 4:14</a>). His later years were spent chiefly with Paul away from Philippi (compare <a onClick="return mV(\'Act\',20,\'3-28\',31);">Ac 20:3-28,31</a>, on the way to Jerusalem, at Caesarea, the voyage to Rome and in Rome).<P>5. Physician:<P>Paul (<a onClick="return mV(\'Col\',4,14);">Col 4:14</a>) expressly calls him "the beloved physician." He was Paul\'s medical adviser, and doubtless prolonged his life and rescued him from many a serious illness. He was a medical missionary, and probably kept up his general practice of medicine in connection with his work in Rome (compare Zahn, Intro, III, 1). He probably practiced medicine in Malta (<a onClick="return mV(\'Act\',28,9);">Ac 28:9</a>f). He naturally shows his fondness for medical terms in his books (compare Hobart, The Medical Language of Luke; Harnack, New Testament Studies: Luke the Physician, 175-98). Harnack adds some examples to those given by Hobart, who has overdone the matter in reality.<P>See further, <a href="./study/isbe/search.html?string=ACTS+OF+THE+APOSTLES">ACTS OF THE APOSTLES</a>.<P>6. Brother of Titus:<P>It is possible, even probable (see Souter\'s article in DCG), that in <a onClick="return mV(\'2Cr\',8,18);">2Co 8:18</a> "the brother" is equivalent to "the brother" of Titus just mentioned, that is, "his brother." If so, we should know that Paul came into contact with Luke at Philippi on his way to Corinth during his 2nd tour (compare also <a onClick="return mV(\'2Cr\',12,18);">2Co 12:18</a>). It would thus be explained why in Acts the name of Titus does not occur, since he is the brother of Luke the author of the book.<P>7. Connection with Paul:<P>If the reading of Codex Bezae (D) in <a onClick="return mV(\'Act\',11,27);">Ac 11:27</a>f is correct, Luke met Paul at Antioch before the 1st missionary tour. Otherwise it may not have been till Troas on the 2nd tour. But he is the more or less constant companion of Paul from Philippi on the return to Jerusalem on the 3rd tour till the 2 years in Rome at the close of the Acts. He was apparently not with Paul when <a onClick="return mV(\'Phl\',2,20);">Php 2:20</a> was written, though, as we have seen, he was with Paul in Rome when he wrote Colossians and Philemon. He was Paul\'s sole companion for a while during the 2nd Roman imprisonment (<a onClick="return mV(\'2Ti\',4,11);">2Ti 4:11</a>). His devotion to Paul in this time of peril is beautiful.<P>8. Author of Both Gospel and Acts:<P>For the proof of the Lukan authorship of the Acts see <a href="./study/isbe/search.html?string=ACTS+OF+THE+APOSTLES">ACTS OF THE APOSTLES</a>. For the discussion of the Lukan authorship of the Gospel with his name, see <a href="./study/isbe/search.html?string=LUKE,+THE+GOSPEL+OF">LUKE, THE GOSPEL OF</a>. Our interest in him is largely due to this fact and to his relations with Paul. The Christian world owes him a great debt for his literary productions in the interest of the gospel.<P>9. Legends:<P>One legend regarding Luke is that he was a painter. Plummer (Commentary on Luke, xxif) thinks that the legend is older than is sometimes supposed and that it has a strong element of truth. It is true that he has drawn vivid scenes with his pen. The early artists were especially fond of painting scenes from the Gospel of Luke. The allegorical figure of the ox or calf in <a onClick="return mV(\'Eze\',1,\'1-\');">Eze 1</a> and <a onClick="return mV(\'Rev\',4,\'1-\');">Re 4</a> has been applied to Luke\'s Gospel.<P>LITERATURE.<P>Bible dicts., comms., lives of Paul, instroductions. See also Harnack, "Lukas, der Arzt, der Verfasser" (1906); New Testament Studies: Luke the Physician (1907); Ramsay, Luke the Physician (1908); Selwyn, Luke the Prophet (1901); Hobart, The Medical Language of Luke (1882); Ramsay, Was Christ Born at Bethlehem? A Study in the Credibility of Luke (1898); Maclachlan, John, Evangelist and Historian (1912).``150';
isbe[5613]='Luke, the Gospel of`1. Text<P>2. Canonicity<P>3. Authorship<P>4. Sources<P>5. Credibility<P>6. Characteristics<P>7. Date<P>8. Analysis<P>LITERATURE<hr /><P>1. Text:<P>The five primary uncials (Codices Sinaiticus, Alexandrinus, Vaticanus, Ephraemi, Bezae) are the chief witnesses for the text of Luke\'s Gospel. This group is reinforced by L, Codex Delta and the Freer (Detroit) MS; R, T, X and Xi are also valuable in fragments. The other uncials are of secondary value. The Latin, Egyptian and Syriac versions are also of great importance. There are 4 Latin versions (African, European, Italian, Vulgate), 3 Egyptian (Memphitic, Sahidic, Bohairic), 5 Syriac (Curetonian, Sinaitic, Peshitto, Harclean, Palestinian or Jerusalem). Many of the cursive (minuscule) manuscripts are also of considerable worth, as are some of the quotations from the Fathers.<P>Blass, Philology of the Gospels (1898), has advanced theory of two recensions of this Gospel (a longer and a shorter), such as he holds to be true of Acts. In the case of Acts, theory has won some acceptance (see <a href="./study/isbe/search.html?string=ACTS+OF+THE+APOSTLES">ACTS OF THE APOSTLES</a>), but that is not true of the Gospel to any extent. The Western text of the Gospel is the shorter text, while in Acts it is the longer text. In both instances Blass holds that the shorter text was issued after the longer and original text. His idea is that Luke himself revised and issued the shorter text. In itself this is, of course, possible, since the books are both addressed to an individual, Theophilus. The other edition may have been meant for others. Westcott and Hort, The New Testament in Greek explain the omission in the Western text of the Gospel as "Western non-interpolations," and often hold them to be the true text. As samples one may note <a onClick="return mV(\'Luk\',10,41);">Lu 10:41</a>; <a onClick="return mV(\'Luk\',12,19);">12:19</a>; <a onClick="return mV(\'Luk\',24,36,40,42);">24:36,40,42</a>, where the Western text is the shorter text. This is not always true, however, for in <a onClick="return mV(\'Luk\',6,2);">6:2</A>ff Codex Bezae (D) has the famous passage about the man working on the Sabbath, which the other documents do not give. In <a onClick="return mV(\'Luk\',3,22);">Lu 3:22</a>, D has the reading of <a onClick="return mV(\'Psa\',2,7);">Ps 2:7</a> (" Thou art my Son; this day I have begotten thee") for the usual text. Zahn (Introduction, III, 38) accepts this as the true text. There is no doubt of the interest and value of the Western readings in Luke, but it cannot be said that Blass has carried his point here. The peculiar mutilation of the Gospel by Marcion has an interest of its own.<P>2. Canonicity:<P>Plummer (Commentary on Luke, lxxx) says: "In the second half of the 2nd century this Gospel is recognized as authentic and authoritative; and it is impossible to show that it had not been thus recognized at a very much earlier date." On the other hand, Schmiedel (Encyclopedia Biblica) says: "This \'tradition,\' however, cannot be traced farther back than toward the end of the 2nd century (Irenaeus, Tertullian, Clement of Alexandria and the Muratorian Fragment); there is no sound basis for the contention of Zahn (II, 175) that the existence of the tradition can also be found as early as in Marcion, because that writer, from his aversion to the Third Gospel (which nevertheless was the only one he admitted into his collection—with alterations it is true) omitted the expression of honor applied to Luke in <a onClick="return mV(\'Col\',4,14);">Col 4:14</a>." Here the two views are well stated. Schmiedel shows dogmatic bias and prejudice against Luke. Julicher, however, frankly admits (Intro, 330) that "the ancients were universally agreed that the writer was that Luke, disciple of Paul, who is mentioned in <a onClick="return mV(\'Phm\',1,24);">Phm 1:24</a>; <a onClick="return mV(\'2Ti\',4,11);">2Ti 4:11</a>, and called \'the physician\' in <a onClick="return mV(\'Col\',4,14);">Col 4:14</a>; presumably a native of Antioch." This statement bears more directly on the question of authorship than of canonicity, but it is a good retort to the rather cavalier tone of Schmiedel, who is reluctant to admit the facts. The recognition of the Third Gospel in the Muratorian Canon (170 AD) is a fact of much significance. It was used in Tatian\'s Diatessaron (circa 170 AD) as one of the four recognized Gospels (compare Hemphill, Diatessaron of Tatian, 3ff). The fact that Marcion (140 AD) mutilated this Gospel to suit his theology and thus used it is even more significant (compare Sanday, Gospels in the 2nd Century, Appendix). Other heretics like the Valentinians (compare Lightfoot, Biblical Essays, 5-7) made use of it, and Heracleon (compare Clement of Alexandria, Strom., iv.9) wrote a commentary on it. Irenaeus (end of the 2nd century) makes frequent quotations from this Gospel. He argues that there could be only "four" Gospels because of the four points of the compass—an absurd argument, to be sure, but a powerful testimony to the general acceptance of this Gospel along with the other three. It is needless to appeal to the presence of the Third Gospel in the Curetonian Syriac, the Sinaitic Syriac, the African Latin—versions that date to the 2nd century, not to mention the probability of the early date of the Memphitic (Coptic) versions. Examples of the early use of this Gospel occur in various writings of the 2nd century, as in Justin Martyr (150 AD), the Testament of the Twelve Patriarchs (circa 140 AD), Celsus (circa AD 160), the Gospel of Peter (2nd century), the Epistle of the Church of Lyons and Vienne (177 AD), probably also the Didache (2nd century), Clement of Alexandria (190-202 AD), Tertullian (190-220 AD). It is doubtful about Clement of Rome, Ignatius, Polycarp; and the Epistle of Barnabas seems to make no use of the Third Gospel. But Clement of Rome, Ignatius and Polycarp quote Acts. But surely the general use and acceptance of the Third Gospel in the early 2nd century is beyond reasonable doubt. It is not easy to decide when the actual use began, because we have so little data from the 1st century (compare Plummer, Commentary, lxxiii).<P>The fact that the author was not an apostle affected the order of the book in some lists. Most manuscripts and versions have the common order of today, but the Western order (Matthew, John, Luke, Mark) is given by D, many Old Latin manuscripts, the Gothic VS, the Apostolical Constitutions. The object was probably to place the books by apostles together and first. The Old Latin has Luke second (John, Luke, Mark, Matthew), while the Curetonian Syriac has Luke last of the four. The cursives 90 and 399 also have Luke second.<P>3. Authorship:<P>The first writers who definitely name Luke as the author of the Third Gospel belong to the end of the 2nd century. They are the Canon of Muratori (possibly by Hippolytus), Irenaeus, Tertullian, Clement of Alexandria. We have already seen that Julicher (Introduction, 330) admits that the ancients Universally agreed that Luke wrote the Third Gospel. In the early part of the 2nd century the writers did not, as a rule, give the names of the authors of the Gospels quoted by them. It is not fair, therefore, to use their silence on this point as proof either of their ignorance of the author or of denial of Luke\'s authorship. Julicher for instance, says (Introduction, 330): "There is no tradition worthy of the name concerning Luke, whom Papias did not mention, or at any rate did not know." But we owe to Eusebius all the fragments that we have preserved from the writings of Papias. Our ignorance of Papias can hardly be charged up to him. Plummer (Commentary, xii) says that nothing in Biblical criticism is more certain than the fact that Luke wrote the Third Gospel. On the other hand, Julicher (Introduction, 331) is not willing to let it go as easily as that. He demands appeal to Acts, and there (ibid., 447) he denies the Lukan authorship save as to the "we" sections. J. Weiss (Die Schriften des Neuen Testaments; das Lukas Evang., 1906, 378) admits that but for Acts no sufficient reason would exist for denying the authorship of the Third Gospel to Luke, the disciple of Paul. A Pauline point of view in this Gospel is admitted generally. Many modern critics take it for granted that the Lukan authorship of Acts is disproved, and hence, that of the Gospel likewise falls by the way. So argue Baur, Clemen, De Wette, Hausrath, Hilgenfeld, Holtzmann, Julicher, Pfleiderer, Schurer, Spitta, von Soden, J. Weiss, Weizsacker, Zeller. Men like Blass, Credner, Harnack, Hawkins, Hobart, Klostermann, Plummer, Ramsay, Renan, Vogel, Zahn, stand by the tradition of Lukan authorship, but Harnack is almost irritated (Luke the Physician, 1907,6), since "the indefensibility of the tradition is regarded as being so clearly established that nowadays it is thought scarcely worth while to reprove this indefensibility, or even to notice the arguments of conservative opponents." Harnack proceeds to make a plea for a hearing. Jacobus (Standard Bible Dictionary) admits that "Ac tells us nothing more of the author than does the Gospel." That is true so far as express mention is concerned, but not so far as natural implication goes. It is true that the place to begin the discussion of the Lukan authorship of the Gospel is Acts. For detailed discussion of the proof that Luke wrote Acts, see <a href="./study/isbe/search.html?string=ACTS+OF+THE+APOSTLES">ACTS OF THE APOSTLES</a>. It is there shown that the line of argument which has convinced Harnack, the leader of the liberal criticism of Germany, ought to convince any openminded critic. It means a good deal when Harnack (Luke the Physician, 14) says: "I subscribe to the words of Zahn (Einleitung, II, 427): \'Hobart has proved for everyone who can at all appreciate proof that the author of the Lukan work was a man practiced in the scientific language of Greek medicine—in short, a Greek physician.\' " It is here assumed that the line of argument pursued in the article on <a href="./study/isbe/search.html?string=ACTS+OF+THE+APOSTLES">ACTS OF THE APOSTLES</a> is conclusive. If so, little remains to be done in the way of special proof for the Gospel. The author of Acts specifically refers (<a onClick="return mV(\'Act\',1,1);">Ac 1:1</a>) to a former treatise which was likewise addressed to Theophilus. This we find to be the case with the Gospel passing under the name of Luke (<a onClick="return mV(\'Luk\',1,4);">1:4</a>). The critics who admit the Lukan authorship of Acts and deny the Lukan authorship of the Gospel are hardly worth considering.<P>It is, therefore, largely a work of supererogation to give at length the proof from internal grounds that Luke wrote the Gospel, after being convinced about Acts. Still it may be worth while to sketch in outline the line of argument, even though it is very simple. Plummer (Comm., x-xvii) argues three propositions:"<P>(1) The author of the Third Gospel is the author of the Acts.<P>(2) The author of Acts was a companion of Paul.<P>(3) This companion was Luke."<P>Harnack (The Acts of the Apostles, 1909) has argued with great minuteness and skill theory that the same linguistic peculiarities occur in all portions of Acts, including the "we-"sections. He accepts the facts set forth by Hawkins (Horae Synopticae) and adds others. He agrees, therefore, that the author of Acts was a companion of Paul. Harnack is convinced by the exhaustive labors of Hobart (Medical Language of Luke) that this author was a physician, as we know Luke to have been (<a onClick="return mV(\'Col\',4,14);">Col 4:14</a>). He shows this to be true of the author of Acts by the use of "us" in <a onClick="return mV(\'Act\',28,10);">Ac 28:10</a>, showing that the author of Acts received honors along with Paul, probably because he practiced medicine and treated many (compare Barnack, Luke the Physician, 15f). These medical terms occur in the Gospel of Luke also, and the same general linguistic style is found in both the Gospel and Acts. Hawkins has made a careful study of likenesses and variations in style in these two books (compare Horae Synopticae, 15-25, 174-89). The argument is as conclusive as such a line of proof can be expected to be. For further discussion see Ramsay, Luke the Physician,1908,1-68; Zahn, Introduction, III, 160ff. There are no phenomena in the Gospel hostile to this position save the Semitic character of <a onClick="return mV(\'Luk\',1,\'1-\');">Luke 1</a> and <a onClick="return mV(\'Luk\',2,\'1-\');">2</a> (barring the classical introduction <a onClick="return mV(\'Luk\',1,\'1-4\');">1:1-4</A>). Luke, though a Gentile, has in these chapters the most Semitic narrative in the New Testament. But the explanation is obvious. He is here using Semitic material (either oral or written), and has with true artistic skill preserved the tone of the original. To a certain extent the same thing is true of the opening chapters of Acts.<P>4. Sources:<P>The synoptic problem (see <a href="./study/isbe/search.html?string=GOSPELS,+THE+SYNOPTIC">GOSPELS, THE SYNOPTIC</a>) remains the most difficult one in the realm of New Testament criticism. But the Gospel of Luke yields on the whole more satisfactory results than is yet true of Matthew.<P>(1) Unity.<P>If the Lukan authorship of the book is accepted, there remains no serious doubt concerning the unity and integrity of the Gospel. The abridgment of Luke\'s Gospel used by Marcion does not discredit those portions of the Gospel omitted by him. They are omitted for doctrinal reasons (compare Sanday, Gospels in the 2nd Century, chapter viii). His readings are of interest from the viewpoint of textual criticism, as are the quotations of other early writers, but his edition does not seriously challenge the value of Luke\'s work.<P>(2) Luke\'s Method.<P>Luke has announced his methods of work in a most classic introduction (<a onClick="return mV(\'Luk\',1,\'1-4\');">1:1-4</a>). Here we catch a glimpse of the author\'s personality. That is not possible in Mark nor in Matthew, and only indirectly in passing shadows in the Fourth Gospel. But here the author frankly takes the reader into his confidence and discloses his standpoint and qualifications for the great task. He writes as a contemporary about the recent past, always the most difficult history to interpret and often the most interesting. He speaks of "those matters which have been fulfilled among us," in our time. He does not himself claim to have been an eyewitness of "those matters." As we know already, Luke was a Gentile and apparently never saw Jesus in the flesh. He occupies thus a position outside of the great events which he is to record. He does not disguise his intense interest in the narrative, but he claims the historical spirit. He wishes to assure Theophilus of "the certainty concerning the things wherein thou wast instructed." He claims to have investigated "the course of all things accurately from the first," just as the true historian would. He thus implies that some of the attempts made had been fragmentary at any rate, and to that extent inaccurate. He has also produced an "orderly" narrative by which Theophilus may gain a just conception of the historical progress of the events connected with the life of Jesus of Nazareth. The fact that "many have taken in hand to draw up a narrative concerning those matters" does not deter Luke from his task. The rather he is stirred thereby ("It seemed good to me also") to give his interpretation of the life and work of Jesus as the result of his researches. He stands not farther away than one generation from the death of Jesus. He has the keen interest natural to a cultured follower of Jesus in the origin of what had become a great world-movement. He is able to get at the facts because he has had intercourse with eyewitnesses of Jesus and His work, "even as they delivered them unto us, who from the beginning were eyewitnesses and ministers of the word." Luke had abundant opportunity during the two years at Caesarea with Paul (<a onClick="return mV(\'Act\',24,\'1-\');">Ac 24-26</a>) to make careful and extended investigations. Many of the personal followers of Jesus were still living (<a onClick="return mV(\'1Cr\',15,6);">1Co 15:6</a>). It was a golden opportunity for Luke\'s purpose. He had also the written narratives which others ("many") had already drawn up. We are, then, to expect in Luke\'s Gospel a book closely akin to Acts in style and plan, with the historian\'s love of accuracy and order, with the author\'s own contribution in the assimilation and use of this oral and written material. One would not expect in such a writer slavish copying, but intelligent blending of the material into an artistic whole.<P>(3) The Aramaic Infancy Narrative.<P>The very first section in this Gospel (<a onClick="return mV(\'Luk\',1,\'5-\');">Lu 1:5</a>-<a onClick="return mV(\'Luk\',2,\'1-52\');">2:52</a>) illustrates Luke\'s fidelity in the use of his material. Wellhausen drops these two chapters from his edition of Luke\'s Gospel as not worthy of consideration. That is conjectural criticism run mad and is not to be justified by the example of Marcion, who begins with chapter <a onClick="return mV(\'Luk\',4,\'1-\');">4</A>. Wright (Gospel according to Luke in Greek, 1900, viiif; under the word "Luke\'s Gospel," DCG) holds that this section was the last to be added to the Gospel though he holds that it comes from Luke. It may be said in passing that Wright is a stout advocate for the oral source for all of Luke\'s Gospel. He still holds out against the "two-document" or any document theory. However, he claims rightly that Luke\'s information for these two chapters was private. This material did not form part of the current oral Gospel. In Matthew the narrative of the birth of Jesus is given from the standpoint of Joseph, and Mary is kept in the background, according to Eastern feeling (Wright). But in Luke the story is told from Mary\'s point of view. Luke may, indeed, have seen Mary herself in the years 57-59 AD (or 58-60). He could easily have seen some of Mary\'s intimate friends who knew the real facts in the case. The facts were expressly said to have been kept in Mary\'s heart. She would tell only to sympathetic ears (compare Ramsay, Was Christ Born at Bethlehem? 74f). It is not possible to discredit Luke\'s narrative of the Virgin Birth on a priori grounds (compare Orr, The Virgin Birth of Christ, 1907; Sweet, Birth and Infancy of Jesus Christ, 1906). The curious Semitic flavor of this narrative argues strongly for its genuineness, since Luke was a Greek. We do not know whether Luke knew Aramaic or not. That was possible, since he spent these 2 years in Palestine. We do not know whether this information came to him in written form (note especially the hymns of Mary and of Zacharias) or in oral tradition. But it is hardly possible to credit a Greek with the invention of these birth-narratives and poems which ring so true to the soil and the Hebrew life. Immediately after Luke\'s statement about historical research comes the narrative of the birth of Jesus. It is the first illustration of his work on his sources.<P>(4) Luke\'s Relation to Mark\'s Gospel.<P>Luke knew Mark in Rome (<a onClick="return mV(\'Col\',4,10,14);">Col 4:10,14</a>; <a onClick="return mV(\'Phm\',1,24);">Phm 1:24</a>). He may have met him in Palestine also. Had he seen Mark\'s Gospel when he wrote his own? Was it one of the "many" narratives that came under Luke\'s eye? Wright (compare DCG) denies that Luke had our Mark. He admits that he may have had an Urmarkus or proto-Mark which he heard in oral form, but not the present (written) Gospel of Mark. He thinks that this can best be accounted for by the fact that out of 223 sections in Mark there are 54 not in Luke. But most modern critics have come to the conclusion that both Matthew and Luke had Mark before them as well as other sources. Matthew, if he used Mark, in the early chapters, followed a topical arrangement of his material, combining Mark with the other source or sources. But Luke has followed the order of Mark very closely in this part and indeed throughout. Luke has a special problem in <a onClick="return mV(\'Luk\',9,\'51-\');">9:51-19:27</a>, but the broad general outline follows that of Mark. But it cannot be said that Luke made a slavish use of Mark, if he had this Gospel before him. He gives his own touch to each incident and selects what best suits his purpose. It is not possible for us to tell always that motive, but it is idle to suppose that Luke blindly recorded every incident found in every document or every story that came to his ears. He implies in his introduction that he has made a selection out of the great mass of material and has woven it into a coherent and progressive narrative. We may admit with Harnack (New Testament Studies: Sayings of Jesus, xiii) that the Markan problem "has been treated with scientific thoroughness" and that Luke had Mark as one of his sources. The parallel between Luke and Mark in the narrative portion is easily seen in any Harmony of the Gospels, like Broadus or Stevens and Burton.<P>(5) Q (Quelle) or the Logia.<P>It is a matter of more uncertainty when we come to the mass of material common to Matthew and Luke, but absent from Mark. This is usually found in the discourses of Jesus. The more generally accepted theory today is that both Matthew and Luke made use of Mark and also this collection of Logia called Q for short (Ger. Quelle, "source"). But, while this theory may be adopted as a working hypothesis, it cannot be claimed that it is an established fact. Zahn (compare Introduction) stoutly stands up for the real authorship of the First Gospel of Matthew. Arthur Carr ("Further Notes on the Synoptic Problem," The Expositor, January, 1911, 543-553) argues strongly for the early date and Matthean authorship of the First Gospel. He says on the whole subject: "The synoptic problem which has of late engaged the speculation of some of our keenest and most laborious students is still unsolved." He even doubts the priority of Mark\'s Gospel. Wellhausen (Einleitung in die drei ersten Evangelien, 73-89) advocates the priority of Mark to Q. But Harnack balances the problem of "Q and Mark" (Sayings of Jesus, 193-233) and decides in favor of Q. In any case, it is to be noted that the result of critical research into the value of Q is to put it quite on a paragraph with Mark. Harnack is quite impressed with the originality and vivid reality of the matter in Q. The material present in Q cannot be gauged so accurately as that in Mark, since we have the Gospel of Mark in our hands. Where both Matthew and Luke give material not found in Mark, it is concluded that this is drawn from Q. But it cannot be shown that Matthew may not have used Q at some points and Luke at still others independently. Besides Q may have contained material not preserved either in Matthew or Luke. A careful and detailed comparison of the material common to both Matthew and Luke and absent from Mark may be found in Hawkins, Horae Synopticae, 10713; Harnack, Sayings of Jesus, 127-82; Wellhausen, Einleitung, 66; Robertson, "Matthew" in Bible for Home and School, 14-19. But, if it is true that Luke made use of Q as of Mark, he was no mere copyist. No solution of the synoptic problem can ever be obtained on the idea that the Gospels are mere reproductions of previous documents. There was freedom in the use of all the material, both oral and written, and the writer gave his own interpretation to the result. It was often a restatement in the author\'s own language, not formal quotation. Wright (DCG) calls this editorial element "editorial notes"; that is, of course, often true when the author makes comments on the matters presented, but "ancient authors took immense pains to reduce the rude chronicles which they used, into literary form" (same place). The point of all this is that a great deal of criticism of the Gospels is attempting the impossible, for many of the variations cannot possibly be traced to any "source." Wright (same place) puts it tersely again: "And if in John\'s Gospel it is more and more recognized that the mind of the evangelist cast the utterances of our Lord into the peculiar form which they there hold, the same process of redaction may be observed in Luke, who comes nearest of the synoptists to the methods of John." As a matter of fact, this is as it should be expected. The frank recognition of this point of view marks progress in synoptic criticism.<P>(6) Other Sources.<P>There is a large block of material in <a onClick="return mV(\'Luk\',9,\'51-\');">Lu 9:51-18:14</a> which is given by him alone. There are various sayings like some reported by Matthew (or Mark) in other connections. Some of the incidents are similar to some given elsewhere by Matthew and Mark. There are various theories concerning this position of Luke. Some critics hold that Luke has here put a mass of material which he had left over, so to speak, and which he did not know where to locate, without any notion of order. Against this theory is the express statement of Luke that he wrote an orderly narrative (<a onClick="return mV(\'Col\',1,3);">1:3</a>f). One is disposed to credit Luke\'s own interpretation unless the facts oppose it. It is common for traveling preachers, as was Jesus, to have similar experiences in different parts of the country and to repeat their favorite sayings. So teachers repeat many of their sayings each year to different classes. Indeed, it is just in this section of Luke that the best parts of his Gospel are found (the parables of the Good Samaritan, the Prodigal Son, the Pharisee and the Publican, etc.). "The more we consider this collection, the more we are entranced with it. It is the very cream of the Gospel, and yet (strange to say) it is peculiar to Luke" Wright DCG) Wright calls this "a Pauline collection, not because Paul is responsible for the material, but because the chapters breathe cosmopolitan spirit of Paul. That is true, but Jesus loved the whole world. This side of the teaching of Jesus may have appealed to Luke powerfully because of its reflection in Paul. Matthew\'s Gospel was more narrowly Jewish in its outlook, and Mark\'s had fewer of the sayings of Christ. But it is to be noted that this special material in Luke extends more or less all through the Gospel. Burton (Some Principles of Literary Criticism and Their Application to the Synoptic Problem, 49) calls this special material in <a onClick="return mV(\'Luk\',9,\'51-\');">Lu 9:51-18:14</a> "the Perean document." We do not know, of course, anything of the actual source of this material. Whether Luke has here followed one or more documents, he has, as elsewhere, given his own stamp to the whole, while preserving in a marvelous way the spirit of Jesus. (For the possible parallel between this section of Luke and John see Robertson\'s "Notes" to Broadus, Harmony of the Gospels, 249-52.) For the earlier material in Luke not found elsewhere (<a onClick="return mV(\'Luk\',3,\'7-15\',17,18);">3:7-15,17,18</a>; <a onClick="return mV(\'Luk\',4,\'2-13\');">4:2b-13 (Hebrew 14,15)</a>, <a onClick="return mV(\'Luk\',4,\'16-30\');">16-30</A>; <a onClick="return mV(\'Luk\',5,\'1-11\');">5:1-11</A>; <a onClick="return mV(\'Luk\',6,\'21-49\');">6:21-49</a>; <a onClick="return mV(\'Luk\',7,\'1-\');">7:1</a>-<a onClick="return mV(\'Luk\',8,\'1-3\');">8:3</A>) Burton suggests "the Galilean document" as the source. Wright, on the other hand, proposes "anonymous fragments" as the source of Luke\'s material not in the infancy narrative, nor in Mark, nor in Q, nor in the "Pauline" or Perean document. At any rate, it is certain that Luke\'s own words of explanation should warn us against drawing too narrow a line around the "sources" used by him. His "many" may well have included a dozen sources, or even more. But it may be said, in a word, that all that criticism has been able to learn on the subject has confirmed the statement of Luke himself concerning his method of research and his use of the material.<P>5. Credibility:<P>More fault has been found with Luke as a historian in Acts than in the Gospel. Harnack (Acts of the Apostles) is not disposed to give Luke full credit as a reliable historian. But Ramsay (Luke the Physician, 5) champions the reliability of Luke (compare also Paul the Traveler; The Church in the Roman Empire) against the skepticism of Harnack, which is growing less, since in the Theol. Literaturzeitung (July 7,1906,S. 4) he speaks well of Luke\'s ability to secure correct information. So in Luke the Physician (121-45) Harnack urges that the possible "instances of incredibility have been much exaggerated by critics." He adds about <a onClick="return mV(\'Act\',5,36);">Ac 5:36</a>: "It is also possible that there is a mistake in Jos" (compare Chase, Credibility of the Book of the Acts of the Apostles; see also <a href="./study/isbe/search.html?string=ACTS+OF+THE+APOSTLES">ACTS OF THE APOSTLES</a>.<P>But the Gospel is not free from attack. The chief matter in the Gospel of Luke which is challenged on historical grounds, apart from the birth-narratives, which some critics treat as legendary, is the census in <a onClick="return mV(\'Luk\',2,1);">Lu 2:1</a>ff. Critics, who in general have accepted Luke\'s veracity, have sometimes admitted that here he fell into error and confused the census under Quirinius in 6-7 AD when Quirinius came, after the banishment of Archelaus, to take a census and to collect taxes, much to the indignation of the Jews (compare <a onClick="return mV(\'Act\',5,37);">Ac 5:37</a>; Josephus, Ant, XVIII, i). It was not known that Quirinius had been governor of Syria before this time, nor was there any other knowledge of a census under Augustus. The case against Luke seemed strong. But Ramsay (Was Christ Born at Bethlehem? 227ff) shows that the inscription at Tibur, as agreed by Mommsen and like authorities, shows that Quirinius "twice governed Syria as legatus of the divine Augustus." He was consul in 12 BC, so that the first mission was after that date. Ramsay shows also from the papyri that the 14-year cycle was used for the Roman census (many census papers are known from 20 AD on). He argues that the first one was instituted by Augustus in 8 BC. Herod, as a vassal king, would naturally be allowed to conduct it in the Jewish fashion, not the Roman, and it was probably delayed several years in the provinces. Thus once more Luke is vindicated in a remarkable way (see <a href="./study/isbe/search.html?string=CHRONOLOGY+OF+THE+NEW+TESTAMENT">CHRONOLOGY OF THE NEW TESTAMENT, sec. I,1,(2)</a>).<P>The Acts of the Apostles has come out of the critical ordeal in a wonderful manner, so that Luke\'s credit as a historical writer is now very high among those qualified to know the facts. He has been tested and found correct on so many points that the presumption is in his favor where he cannot as yet be verified. Moffatt (Introduction to the Literature of the New Testament, 265) finds Luke "more graphic than historical."<P>6. Characteristics:<P>He was the most versatile of the Gospel writers. He was a Greek, a Christian, a physician, a man of travel, a man of world-outlook, sympathetic, cultured, poetic, spiritual, artistic, high-minded. His Prologue is the most classic piece of Greek in the New Testament, but the rest of chapter <a onClick="return mV(\'Luk\',1,\'1-\');">1</a> and all of chapter <a onClick="return mV(\'Luk\',2,\'1-\');">2</a> are the most Semitic in tone. The breadth of his literary equipment is thereby shown. He not only uses many medical terms common to technical circles, but he has the physician\'s interest in the sick and afflicted, as shown in the large number of miracles of healing narrated. His interest in the poor is not due to Ebionitic prejudice against the rich, but to human compassion for the distressed. His emphasis on the human side of the work of Jesus is not due to Ebionitic denial of the Divinity of Jesus, but to his keen appreciation of the richness of the human life of the Son of God. His rich and varied vocabulary reveals a man who read and mingled with the best life of his time. He wrote his books in the vernacular, but the elevated vernacular of an educated man touched with a distinct literary flavor. His poetic temperament is shown in the preservation of the beautiful hymns of the nativity and in the wonderful parables of Jesus in chapters <a onClick="return mV(\'Luk\',10,\'1-\');">10</a>, <a onClick="return mV(\'Luk\',15,\'1-\');">15-18</A>. They are reported with rare grace and skill. Luke is fond of showing Christ\'s sympathy with women and children, and he has more to say about prayer than the authors of the other Gospels. His interest in individuals is shown by the dedication of both his books to Theophilus. His cosmopolitan sympathies are natural in view of his training and inheritance, but part of it is doubtless due to his association with the apostle Paul. He comes to the interpretation of Jesus from a world-standpoint and does not have to overcome the Pharisaic limitations incident to one reared in Palestine. It is a matter of rejoicing that we have this book, called by Renan the most beautiful book in the world, as a cultured Greek\'s interpretation of the origin of Christianity. He thus stands outside of the pale of Judaism and can see more clearly the world-relations and world-destiny of the new movement. With Luke, Jesus is distinctly the world\'s Saviour. The accent on sin is human sin, not specifically Jewish sin. John in his Gospel came in his old age to look back upon the events in Judea from a non-Jewish standpoint. But he rose to the essentially spiritual and eternal apprehension of Christ, rather than extended his vision, as Luke did, to the cosmopolitan mission and message of Jesus, though this did not escape John. The Gospel of Luke thus has points of affinity with Paul, John and the author of Hebrews in style and general standpoint. But while Luke\'s own style is manifest throughout, it is not obtrusive. He hides himself behind the wonderful portrait of Jesus which he has here drawn in undying colors.<P>7. Date:<P>The extreme position of Baur and Zeller may be dismissed at once. There is no reason for dating the Gospel of Luke in the 2nd century on the ground that he used Marcion\'s Gospel, since it is now admitted all round that Marcion made use of Luke. The supposed use of Josephus by Luke (see <a href="./study/isbe/search.html?string=ACTS+OF+THE+APOSTLES">ACTS OF THE APOSTLES</a> for discussion and refutation) leads a goodly number of radical scholars (Hilgenfeld, Holsten, Holtzmann, Julicher, Krenkel, Weizsacker, Wernle) to date the book at the end of the 1st century. This is still extreme, as Harnack had already shown in his Chronologie der altchristl. Litt., I,1897,246-50. Any use of Josephus by Luke is highly improbable (see Plummer on Luke, xxix). The Gospel was certainly written before Acts (<a onClick="return mV(\'Act\',1,1);">Ac 1:1</a>) and while Paul was alive, if <a onClick="return mV(\'1Ti\',5,18);">1Ti 5:18</a> be taken as a quotation from <a onClick="return mV(\'Luk\',10,7);">Lu 10:7</a>, which is by no means certain, however. But it is true that the most natural way to interpret the sudden close of Acts, after 2 years in Rome (<a onClick="return mV(\'Act\',28,31);">Ac 28:31</a>), is the fact that Luke finished the book at that time (Maclean, 1 volume HDB). Moffatt (Historical New Testament, 273) calls this early date "reactionary" and "extravagant." But it is supported by Alford, Blass, Ebrard, Farrar, Gloag, Godet, Grau, Guericke, Hahn, Headlam, Hitzig, Hofmann, Hug, Keil, Lange, Lumby, Marshall, Nosgen, Oosterzee, Resch, Riehm, Schaff, Schanz, Thiersch, Tholuck, Wieseler, and Harnack himself is now ready to join this goodly company. He warns critics against too hasty a closing of the chronological question (Ac of the Apostles, 291), and admits that Acts was written "perhaps so early as the beginning of the 7th decade of the 1st century" (ibid., 297), "the Acts (and therefore also the Gospel)." In the Date of the Acts and the Synoptic Gospels (1911, 124) Harnack says: "It seems now to be established beyond question that both books of this great historical order were written while Paul was still alive." There is an intermediate date about 80 AD, assigned by Adeney, Bartlett, Plummer, Sanday, Weiss, Wright, on the ground that the investigations mentioned in <a onClick="return mV(\'Luk\',1,\'1-4\');">Lu 1:1-4</a> describe the use of narratives which could have been written only after a long period of reflection. But that is not a valid objection. There is no sound critical reason why the Gospel of Mark, Q, the infancy narratives, and all the other sources alluded to by this preface could not have been in circulation in Palestine by 55 AD. Indeed, Allen writes in The Expository Times (July, 1910): "I see no reason why such an original (Mark\'s Gospel in Aramaic) should not have appeared before the year 50 AD." The other objection to the early date comes out of <a onClick="return mV(\'Luk\',21,20);">Lu 21:20</a>, "Jerus compassed with armies" as compared with "the abomination of desolation" in <a onClick="return mV(\'Mar\',13,14);">Mr 13:14</a>. The change is so specific that it is held by some critics to be due to the fact that Luke is writing after the destruction of Jerusalem. But it is just as likely (Maclean) that Luke has here interpreted the Hebraism of Mark for his Gentile readers. Besides, as Plummer (p. xxxi) shows, Luke in <a onClick="return mV(\'Luk\',21,\'5-36\');">21:5-36</a> does not record the fact that Jerusalem was destroyed, nor does he change Christ\'s "flee to the mountains" to "Pella in North Peraea," whither the Christians actually fled. Besides, the fact that Acts shows no acquaintance with Paul\'s Epistles is best explained on the assumption of the early date. The question is thus practically settled in favor of the early date. The place of the writing is not known. The early date naturally falls in with Caesarea (Blass, Michaelis, Thiersch), but there is little to guide one.<P>8. Analysis:<P>(1) Prologue, <a onClick="return mV(\'Luk\',1,\'1-4\');">Luke 1:1-4</a>.<P>(2) Infancy and childhood of John and Jesus, <a onClick="return mV(\'Luk\',1,\'5-\');">Luke 1:5</a>-<a onClick="return mV(\'Luk\',2,\'1-52\');">2:52</a>.<P>(3) Beginning of Christ\'s Ministry, <a onClick="return mV(\'Luk\',3,\'1-\');">Luke 3:1</a>-<a onClick="return mV(\'Luk\',4,\'1-13\');">4:13</a>.<P>(4) Galilean Campaign, <a onClick="return mV(\'Luk\',4,\'14-\');">Luke 4:14-9:6</a>.<P>(5) Retirement from Galilee, <a onClick="return mV(\'Luk\',9,\'7-50\');">Luke 9:7-50</a>.<P>(6) Later Judean and Perean Ministry, <a onClick="return mV(\'Luk\',9,\'51-\');">Luke 9:51-19:28</a>.<P>(7) Close of the Public Ministry in Jerusalem, <a onClick="return mV(\'Luk\',19,\'29-\');">Luke 19:29-21:37</a>.<P>(8) The Dreadful End, <a onClick="return mV(\'Luk\',21,\'1-\');">Luke 21-23</a>.<P>(9) Resurrection of Christ, <a onClick="return mV(\'Luk\',24,\'1-\');">Luke 24</a>.<P>LITERATURE.<P>See extended list of books at close of article on <a href="./study/isbe/search.html?string=ACTS+OF+THE+APOSTLES">ACTS OF THE APOSTLES</a>; the extensive list of Commentaries Plummer\'s Commentary on Luke can also be consulted. After Plummer the best commentaries on Luke\'s Gospel are Bruce, Expositor\'s Greek Test.; Weiss\' Meyer Krit.-exeget. Komm.; Godet; Holtzmann, Hand-Commentary Of the many Introduction to the New Testament, Zahn\'s is the ablest and most exhaustive (conservative) and Julicher\'s is the fairest of the radical school. The best of the briefer ones is Gregory\'s Canon and Text (1907). Special treatises deserving mention here are Blass, Philology of the Gospels (1898); Ev. secundum Lukam (1897); Wellhausen. Das Ev. Lukae (1904); Sense, Origin of the Third Gospel (1901); Friedrich, Das Lukasevangelium und die Apostelgeschichte, Werke desselben Verfassers (1890); Harnack, Luke the Physician (1907), and Sayings of Jesus (1908); The Date of the Acts and the Synoptic Gospels (1911); Hawkins, Horae Synopticae (2nd edition, 1909); Hervey. Authenticity of Luke (1892); Hobart, Medical Language of Luke (1882); Litzinger, Die Entstehung des Lukasevangelium und der Apostelgeschichte (1883); Ramsay, Was Christ Born at Bethlehem? (1898) and Luke the Physician (1908); Resch, Das Kindheit-Evangelium nach Lukas und Matthaus; Selwyn, Luke the Prophet (1901); Vogel, Zur Characteristik des Lukas nach Sprache und Stil (1897); Weiss, Quellen des Lukasevangelium (1907); Wright, Synopsis of the Gospels and his Gospel according to Luke in Greek (1900).``150';
isbe[5614]='Lunatic(K)`lu\'-na-tik:<P>I. Epilepsy.<P>1. Incorrect Translation:<P>The English word "lunatic," which in popular speech signifies a sufferer from any mental derangement, whether periodic or chronic, other than congenital idiocy, appears in the King James Version as a translation of the Greek word seleniazomai, in the two passages where it occurs. In the Revised Version (British and American) the word has very properly been displaced by the strictly accurate term "epileptic." This change is justified not only by the extra-Biblical usage (see Liddell and Scott, under the word), but clearly enough by <a onClick="return mV(\'Mat\',17,15);">Mt 17:15</a> (compare <a onClick="return mV(\'Mat\',4,24);">4:24</a>), where epilepsy is circumstantially described.<P>2. Original Meaning:<P>The original meaning of the term seleniazomai, "moon-struck," is connected with the popular belief, widespread and of strange persistency, that the moon, in certain of its phases, is injurious to human beings, especially in the case of diseases of a periodic or remittent character. There are no data by which to determine whether, in the New Testament times, this particular word represented a living and active belief or had passed into the state of usage in which the original metaphor disappears, and the word simply indicates the fact signified without reference to the idea embodied in the etymology. We still use the word "lunatic" to signify a person mentally diseased, although we have long since ceased to believe in the moon\'s influence in such cases.<P>II. Madness.<P>The Bible designates "madness," or alienation of mind, by various terms, all of which seem to be onomatopoetic. These various words seem to be derived from the strange and fierce or mournful cries uttered by the unfortunate victims of this dread malady. In <a onClick="return mV(\'Deu\',28,34);">De 28:34</a> the word "maddened" is meshugga\', participle of shagha\' (compare also <a onClick="return mV(\'1Sa\',21,15);">1Sa 21:15</a>). With this corresponds the word mainomai, in the New Testament. In <a onClick="return mV(\'1Sa\',21,13);">1Sa 21:13 (Hebrew 14)</a> the word is a form of the verb chalal, which is also a derivative from the sound indicated.<P>In certain cases, though by no means uniformly, madness is ascribed to demon-possession (<a onClick="return mV(\'Luk\',8,26);">Lu 8:26</a>f). One is struck by the fact that mental derangement occupies a very small place in Scripture.``169';
isbe[5615]='Lurk; Lurking-Place`lurk, lurk\'-ing-plas: "To lurk" means "to lie in wait," usually with intent to do harm (see <a onClick="return mV(\'Psa\',17,12);">Ps 17:12</a>; <a onClick="return mV(\'Pro\',1,11,18);">Pr 1:11,18</a>).<P>Lurking-place, a place of hiding, usually for the purpose of murder. See <a onClick="return mV(\'1Sa\',23,23);">1Sa 23:23</a>; <a onClick="return mV(\'Psa\',10,8);">Ps 10:8</a>.``1';
isbe[5616]='Lust`(5 Hebrew and 5 Greek words are so rendered, namely:<P>(1) nephesh,<P>(2) sheriruth,<P>(3) ta\'awah,<P>(4) chamadh,<P>(5) \'awah;<P>(1) epithumia,<P>(2) hedone,<P>(3) epipotheo,<P>(4) orexis,<P>(5) pathos):<hr /><P>The word both as verb and as substantive has a good and a bad meaning. It probably meant at first a strong desire, a craving, abnormal appetite, not only for physical but for spiritual satisfaction. It has come, however, to be confined in its use almost entirely to the bad sense. Some old translations are not accepted now, the word being used in connections which at present seem almost irreverent. Shades of meaning are learned from an examination of the Hebrew and Greek originals.<P>1. The Old Testament Use:<P>The substantive and verbs are:<P>(1) Nephesh, in <a onClick="return mV(\'Exd\',15,9);">Ex 15:9</a> and <a onClick="return mV(\'Psa\',78,18);">Ps 78:18</a> translated "desire"; "My desire shall be satisfied"; "by asking food according to their desire." A strong but not sensual sense.<P>(2) Sheriruth, meaning "obstinacy," evil imagination. Yahweh said (<a onClick="return mV(\'Psa\',81,12);">Ps 81:12</a>), "I let them go after the stubbornness of their heart," a willful self-satisfaction.<P>(3) Ta\'awah, "a delight" "a longing satisfaction," and so it came to mean "sinful pleasure." Translated in <a onClick="return mV(\'Psa\',78,30);">Ps 78:30</a>, "that which they desired," intensely longed for, referring to Yahweh\'s provision of food in the wilderness. Also in <a onClick="return mV(\'Num\',11,4);">Nu 11:4</a> concerning "flesh to eat" it is said the multitude "lusted exceedingly" i.e. "craved eagerly.<P>(4) Chamadh, the verb meaning "to delight in," "greatly belove," "covet," probably for evil purposes. The young man is warned against the evil woman (<a onClick="return mV(\'Pro\',6,25);">Pr 6:25</a>): "Lust not after her beauty." Here the bad sense is evident, for in the same connection are used such expressions as "harlot," "adulteress," "evil woman."<P>(5) \'Awah, meaning "greatly to desire," long after, with undue emphasis, with evil spirit though not perhaps with impure thought. In <a onClick="return mV(\'Num\',11,34);">Nu 11:34</a> reference is made to a place called qibhroth ha-ta\'wah, "the graves of lust, where "they buried the people that lusted." <a onClick="return mV(\'Psa\',106,14);">Ps 106:14</a> also refers to the Israelites who "lusted exceedingly." Translated in <a onClick="return mV(\'Deu\',12,15,21);">De 12:15,21</a> "desire of thy soul"; <a onClick="return mV(\'Deu\',12,20);">12:20</a>; <a onClick="return mV(\'Deu\',14,26);">14:26</a>, "thy soul desireth." These Deuteronomy passages evidently mean lust only in the good sense.<P>2. The New Testament Use:<P>As in the Old Testament, so in the New Testament we find both meanings of the word.<P>(1) Epithumia is used most frequently, and means a longing for the unlawful, hence, concupiscence, desire, lust. The following references hold the idea, not only of sinful desire known as "fleshly," "worldly," as opposed to "spiritual" "heavenly," "the will of man" as opposed to "the will of God," but also the sensual desire connected with adultery, fornication; verb in <a onClick="return mV(\'Mat\',5,28);">Mt 5:28</a>; <a onClick="return mV(\'Mar\',4,19);">Mr 4:19</a>; <a onClick="return mV(\'Jhn\',8,44);">Joh 8:44</a>; <a onClick="return mV(\'Rom\',1,24);">Ro 1:24</a>; <a onClick="return mV(\'1Cr\',10,6);">1Co 10:6</a>; <a onClick="return mV(\'Gal\',5,16,17,24);">Ga 5:16,17,24</a>; <a onClick="return mV(\'Tts\',2,12);">Tit 2:12</a>; <a onClick="return mV(\'1Pe\',1,14);">1Pe 1:14</a>; <a onClick="return mV(\'1Jo\',2,16);">1Joh 2:16</a>f; <a onClick="return mV(\'Jud\',1,16,18;">Jude 1:16,18</a>; <a onClick="return mV(\'Rev\',18,14);">Re 18:14</a>.<P>(2) Hedone, delight in sensuality, hence, wicked pleasures; translated in <a onClick="return mV(\'Jam\',4,1,3);">Jas 4:1,3</a> "pleasures": "Your pleasures that war in your members"; "Ye ask amiss, that ye may spend it in your pleasures" (the King James Version "lust").<P>(3) Epipotheo means to crave intensely the wrong possession; translated in <a onClick="return mV(\'Jam\',4,5);">Jas 4:5</a> "long (the King James Version "lusteth") unto envying."<P>(4) Orexis, used in <a onClick="return mV(\'Rom\',1,27);">Ro 1:27</a>, from context evidently meaning "lust" in the worst sense; translated "lust."<P>(5) Pathos, meaning "passion" inordinate affection, with the idea in it of suffering; translated in <a onClick="return mV(\'1Th\',4,5);">1Th 4:5</a> "passion of lust."``142';
isbe[5617]='Lute`lut (nebhel; thus the Revised Version (British and American); the King James Version viol (<a onClick="return mV(\'Isa\',5,12);">Isa 5:12</a>)): Nebhel is rendered elsewhere by psaltery" or "viol." The lute was originally an Arabic instrument. It resembled a guitar, though with a longer and more slender neck. The name is derived from Arabic al\'ood, with a of article elided; hence, Italian liuto; French luth.`<a href="./study/isbe/search.html?string=MUSIC">MUSIC</a>`1';
isbe[5618]='Luz`(Luz):the Hebrew word means "almond tree" or "almond wood" (OHL, under the word). It may also mean "bone," particularly a bone of the spine, and might be applied to a rocky height supposed to resemble a backbone (Lagarde, Uebersicht., 157f). Winckler explains it by Aramaic laudh, "asylum," which might be suitably applied to a sanctuary (Geschichte Israels). Cheyne (EB, under the word) would derive it by corruption from chalutsah, "strong (city)."<P>(1) This was the ancient name of Bethel (<a onClick="return mV(\'Gen\',28,19);">Ge 28:19</a>; <a onClick="return mV(\'Jdg\',1,23);">Jud 1:23</a>; compare <a onClick="return mV(\'Gen\',35,6);">Ge 35:6</a>; <a onClick="return mV(\'Gen\',48,3);">48:3</a>; <a onClick="return mV(\'Jos\',16,2);">Jos 16:2</a>; <a onClick="return mV(\'Jos\',18,13);">18:13</a>). It has been thought that <a onClick="return mV(\'Jos\',16,2);">Jos 16:2</a> contradicts this, and that the two places were distinct. Referring to <a onClick="return mV(\'Gen\',28,19);">Ge 28:19</a>, we find that the name Bethel was given to "the place," ha-maqom, i.e. "the sanctuary," probably "the place" (28:11, Hebrew) associated with the sacrifice of Abraham (<a onClick="return mV(\'Gen\',12,8);">12:8</A>), which lay to the east of Bethel. The name of the city as distinguished from "the place" was Luz. As the fame of the sanctuary grew, we may suppose, its name overshadowed, and finally superseded, that of the neighboring town. The memory of the ancient nomenclature persisting among the people sufficiently explains the allusions in the passages cited.<P>(2) A Bethelite, the man who betrayed the city into the hands of the children of Joseph, went into the land of the Hittites, and there founded a city which he called Luz, after the ancient name of his native place (<a onClick="return mV(\'Jdg\',1,26);">Jud 1:26</a>). No satisfactory identification has been suggested.``54';
isbe[5619]='Lycaonia`lik-a-o\'-ni-a, li-ka-o\'-ni-a (Lukaonia (<a onClick="return mV(\'Act\',14,6);">Ac 14:6</a>), Lukaonisti, (<a onClick="return mV(\'Act\',14,11);">Ac 14:11</a>, "in the speech of Lycaonia"); Lycaonia is meant, according to the South Galatian view, by the expression ten Galatiken choran, in <a onClick="return mV(\'Act\',18,23);">Ac 18:23</a>, and the incidents in <a onClick="return mV(\'Act\',16,\'1-4\');">Ac 16:1-4</a> belong to Lycaonia): Was a country in the central and southern part of Asia Minor whose boundaries and extent varied at different periods. In the time of Paul, it was bounded on the north by Galatia proper (but lay in the Roman province Galatia), on the east by Cappadocia, on the south by Cilicia Tracheia, and on the west by Pisidia and Phrygia. The boundary of Phrygia and Lycaonia passed between Iconium and Lystra (see <a href="./study/isbe/search.html?string=ICONIUM">ICONIUM</a>). Lycaonia consists of a level plain, waterless and treeless, rising at its southern fringe for some distance into the foothills of Taurus, and broken on its eastern side by the volcanic mass of Kara-Dagh and by many smaller hills. Strabo informs us that King Amyntas of Galatia fed many flocks of sheep on the Lycaonian plain. Much of the northern portion of Lycaonia has been proved by recent discovery to have belonged to the Roman emperors, who inherited the crown lands of Amyntas.<P>In <a onClick="return mV(\'Act\',14,6);">Ac 14:6</a> Lycaonia is summed up as consisting of the cities of Lystra and Derbe and the district (including many villages) lying around them. This description refers to a particular division of Lycaonia, which alone is mentioned in the Bible. In the time of Paul, Lycaonia consisted of two parts, a western and an eastern. The western part was a "region" or subdivision of the Roman province Galatia; the eastern was called Lycaonia Antiochiana, after Antiochus of Commagene under whom it had been placed in 37 AD. This non-Roman portion was traversed by Paul; but nothing is recorded of his journey through it (see <a href="./study/isbe/search.html?string=DERBE">DERBE</a>). It included the important city of Laranda; and when Lycaonia is described as consisting of the cities of Lystra and Derbe and the surrounding district, the writer is clearly thinking only of the western portion of Lycaonia, which lay in, and formed a "region" of, the province Galatia. This is the tract of country which is meant in <a onClick="return mV(\'Act\',18,23);">Ac 18:23</a>, where it is called the "region" of Galatia, and placed side by side with Phrygia, another region of Galatia. The province Galatia was divided into districts technically known as "regions," and Roman Lycaonia is called the "region of Galatia" in implied contrast with Antiochian Lycaonia, which lay outside the Roman province. Of the language of Lycaonia. (see <a href="./study/isbe/search.html?string=LYSTRA">LYSTRA</a>) nothing survives except some personal and place names, which are discussed in Kretschmar\'s Einleitung in die Gesch. der griech. Sprache.<P>LITERATURE.<P>Ramsay, Historical Commentary on Galatians (Introduction); Sterrett, Wolfe Expedition (inscriptions).``20';
isbe[5620]='Lycia`lish\'-i-a (Lukia): An ancient country forming the southeast portion of Asia Minor. The surface of Lycia is exceedingly rugged, and its lofty mountains rise almost directly from the sea. Over them several trade routes or passes lead from the coast to the interior. Down the mountain sides rush many small rivers, of which the Xanthus is the chief. The history of Lycia, like that of the neighboring countries, forms a part of the history of Asia Minor. Successively it was in the possession of the Persians, of Alexander the Great, of the Seleucid kings and of the Ptolemies. In 188 BC it fell into the hands of the Romans, who gave it to the island of Rhodes; 20 years later, because of its loyalty to Rome, it became free and independent (1Macc 15:23). In 53 AD, during the reign of the emperor Claudius, it became a Roman province, and in 74 AD it was united with Pamphylia to form a double province over which a Roman governor presided.<P>At different times during the history of Lycia, there were about 100 places which issued coins of their own. Pliny speaks of 70 cities which had existed there, but in his age there were but 36. Of these, Patara, Myra and Phaselis are of interest to Bible students. From the coast city of Patara, according to <a onClick="return mV(\'Act\',21,\'1-\');">Ac 21</a>f; Paul took ship for Phoenicia. It was a place celebrated not only as a trading-center, and a port of entry to the interior, but as the seat of the oracle of Apollo, and the birthplace of Nicholas. Myra, though over 2 miles from the coast, possessed a harbor, and was also a trading-center. Here, according to <a onClick="return mV(\'Act\',27,\'5-38\');">Ac 27:5-38</a>, Paul found a grain ship from Alexandria. For some time Myra was the capital of the Roman province; to Christendom it is especially known as the home of Nicholas, who was its bishop and the patron saint of the sailors along the coast. Phaselis, on the border of Pamphylia, was also the home of the bishop.<P>Lycia was a stopping-place, rather than the scene of the active work of Paul, and therefore it figures little in the earliest history of Christianity. For a long time the people strongly opposed the introduction of a strange religion, and in 312 AD they even petitioned the Roman emperor Maximin against it. A portion of the petition has been discovered at Arykander.``7';
isbe[5621]='Lydda`lid\'-a.`<a href="./study/isbe/search.html?string=LOD">LOD</a>`1';
isbe[5622]='Lydia (1)`lid\'-i-a (Ludia): An important country in the western part of Asia Minor bounded on the north by Mysia, on the east by Phrygia, on the south by Caria, and on the west by the Aegean Sea. Its surface is rugged, but along the valleys between its mountain ranges ran some of the most important highways from the coast cities to the distant interior. Of its many rivers the chief are the Cayster, the Lower Hermus, the Cogamos, the Caicus and, during a part of its course, the Meander.<P>Lydia was an exceedingly ancient and powerful kingdom whose history is composed chiefly of that of its individual cities. In 546 BC it fell into the hands of the Persians, and in 334 BC it became a part of Alexander\'s empire. After the death of Alexander its possession was claimed by the kings both of Pergamos and of Seleucia, but in 190 BC it became the undisputed possession of the former (1Macc 8:8). With the death of Attalus III, 133 BC, it was transferred by the will of that king to Rome, and Lydia, which then became but a name, formed, along with Caria, Mysia and Phrygia, a part of the Roman province of Asia (see <a href="./study/isbe/search.html?string=ASIA">ASIA</a>). Chief among its cities were Smyrna and Ephesus, two of the most important in Asia Minor, and Smyrna is still the largest and wealthiest city of that part of Turkey. At Ephesus, the seat of the goddess Diana, Paul remained longer than elsewhere in Asia, and there his most important missionary work was done (<a onClick="return mV(\'Act\',19,\'1-\');">Ac 19</a>). Hence, Lydia figures prominently in the early history of the church; it became Christianized during the residence of the apostle at Ephesus, or soon afterward (see also <a href="./study/isbe/search.html?string=LUD">LUD</a>).``7';
isbe[5623]='Lydia (2)`lid\'-i-a (Ludia): The feminine of Lydian, a native of Lydia, a large country on the west of Asia Minor, and the name of Paul\'s first convert in Europe. This name was a popular one for women (compare Horace Odes i.8; iii.9; vi.20), but Ramsay thinks she "was familiarly known in the town by the ethnic that showed her origin" (H D B, under the word "Lydia"; compare Paul the Traveler, 214). It has always been and is still a common custom in the Orient to refer to one living in a foreign land by employing the adjective which designates the nationality. Renan thinks it means "the Lydian"; Thyatira is a city of Lydia. Lydia was (1) living in Philippi, (2) of the city of Thyatira, (3) a seller of the purple-dyed garments from her native town, (4) and "one that worshipped God." Her occupation shows her to have been a woman of some capital. The phrase which describes her religion (sebomene ton Theon) is the usual designation for a proselyte. She was in the habit of frequenting a place of prayer by a riverside, a situation convenient for the necessary ablutions required by the Jewish worship, and there Paul and his companions met her. After she had been listening to Paul (Greek imperfect), the Lord opened her heart to give heed to his teaching ("To open is the part of God, to pay attention that of the woman," Chrysostom). Her baptism and that of her household followed. To prove her sincerity she besought the missionaries to accept the hospitality of her home. Her house probably became the center for the church in Philippi (<a onClick="return mV(\'Act\',16,14,15,40);">Ac 16:14,15,40</a>). Lydia is not mentioned in Paul\'s letter to the Philippians, but, if Ramsay be correct, she may have been Euodias or Syntyche (<a onClick="return mV(\'Phl\',4,2);">Php 4:2</a>).``78';
isbe[5624]='Lydian`lid\'-i-an.`<a href="./study/isbe/search.html?string=LYDIA">LYDIA</a>`1';

isbe[5627]='Lysanias`li-sa\'-ni-as (Lusanias): Mentioned in <a onClick="return mV(\'Luk\',3,1);">Lu 3:1</a> as tetrarch of Abilene in the 15th year of the reign of Tiberius Caesar, and thus fixing the date of the preaching of John the Baptist in the wilderness at about 26 or 28 AD. A Lysanias is mentioned by Josephus as having ruled over Chalcis and Abilene, and as having been slain by Mark Antony at the instigation of Cleopatra. As this happened about 36 BC, Luke has been charged with inaccuracy. Inscriptions, however, corroborate the view that the Lysanias of Luke was probably a descendant of the Lysanias mentioned by Josephus (compare Schurer, H J the Priestly Code (P), div I, volume II, App. 1, p. 338).``88';
