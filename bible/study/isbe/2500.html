isbe[2578]='Deadly`ded\'-li: In the Old Testament two words are used in the sense of a "mortal (Hebrew nephesh, "hateful," "foul") enemy" (<a onClick="return mV(\'Psa\',17,9);">Ps 17:9</a>), and in the sense of "fatal disease," the destructiveness of which causes a general panic (Hebrew maweth, "death," <a onClick="return mV(\'1Sa\',5,11);">1Sa 5:11</a>).<P>In the New Testament we have in <a onClick="return mV(\'Rev\',13,3,12);">Re 13:3,12</a> the expression "deadly wound" (Greek thanatos), better "death-stroke," as in the Revised Version (British and American), and the phrases "deadly thing," i.e. poison (thanasimon ti, <a onClick="return mV(\'Mar\',16,18);">Mr 16:18</a>), and "full of deadly poison" (meste iou thanatephorou, <a onClick="return mV(\'Jam\',3,8);">Jas 3:8</a>), said of an unruly tongue. Both Greek words convey the idea of "causing or bringing death" and occur in classical literature in a variety of uses in combination with the bite of venomous reptiles, deadly potions, mortal wounds and fatal contagion.``106';
isbe[2579]='Deaf`def (cheresh; kophos): Used either in the physical sense, or figuratively as expressing unwillingness to hear the Divine message (<a onClick="return mV(\'Psa\',58,4);">Ps 58:4</a>), or incapacity to understand it for want of spirituality (<a onClick="return mV(\'Psa\',38,13);">Ps 38:13</a>). The prophetic utterances were sufficiently forcible to compel even such to hear (<a onClick="return mV(\'Isa\',42,18);">Isa 42:18</a>; <a onClick="return mV(\'Isa\',43,8);">43:8</a>) and thereby to receive the Divine mercy (<a onClick="return mV(\'Isa\',29,18);">Isa 29:18</a>; <a onClick="return mV(\'Isa\',35,5);">35:5</a>).<P>The expression "deaf adder that stoppeth her car" (<a onClick="return mV(\'Psa\',58,4);">Ps 58:4</a>) alludes to a curious notion that the adder, to avoid hearing the voice of the charmer, laid its head with one car on the ground and stopped the other with the tip of its tail (Diary of John Manninghan, 1602). The adder is called deaf by Shakespeare (2 Hen VI, iii,2, 76; Troilus and Cressida, ii, 2,172). The erroneous idea probably arose from the absence of external ears. Physical deafness was regarded as a judgment from God (<a onClick="return mV(\'Exd\',4,11);">Ex 4:11</a>; <a onClick="return mV(\'Mic\',7,16);">Mic 7:16</a>), and it was consequently impious to curse the deaf (<a onClick="return mV(\'Lev\',19,14);">Le 19:14</a>).<P>In New Testament times deafness and kindred defects were attributed to evil spirits (<a onClick="return mV(\'Mar\',9,18);">Mr 9:18</a>ff).`<a href="./study/isbe/search.html?string=DUMB">DUMB</a>`107';
isbe[2580]='Deal`del: The noun "deal" is not found in the Revised Version (British and American). The King James Version translation of \'issaron, "the tenth deal" (<a onClick="return mV(\'Exd\',29,40);">Ex 29:40</a>; <a onClick="return mV(\'Lev\',14,10);">Le 14:10</a>, et al.) is rendered uniformly "the tenth part" in the Revised Version (British and American) (see <a href="./study/isbe/search.html?string=WEIGHTS+AND+MEASURES">WEIGHTS AND MEASURES</a>). The verb "to deal" often means "to apportion," "to distribute" (compare <a onClick="return mV(\'2Sa\',6,19);">2Sa 6:19</a>; <a onClick="return mV(\'1Ch\',16,3);">1Ch 16:3</a>; <a onClick="return mV(\'Isa\',58,7);">Isa 58:7</a>; <a onClick="return mV(\'Rom\',12,3);">Ro 12:3</a>), but more frequently it is used in the sense of "to act" "to do," "to have transaction of any kind with." In the Psalms "to deal" always means "to confer benefit," "to deal bountifully," with the exception of <a onClick="return mV(\'Psa\',105,25);">Ps 105:25</a>, where it means "to deal subtly with." The expression "to deal," i.e. "to be engaged in," is not found in the Scriptures. The translation of sugchraomai, in <a onClick="return mV(\'Jhn\',4,9);">Joh 4:9</a>, "Jews have no dealings with Samaritans," conveys the idea that they have nothing in common.``16';
isbe[2581]='Dear; Dearly`der, der\'-li ("held at a great price," "highly valued"): In <a onClick="return mV(\'Act\',20,24);">Ac 20:24</a>, Paul does not hold his life "dear" (timios, "at a price"); compare <a onClick="return mV(\'1Cr\',3,12);">1Co 3:12</a>, "costly stones"; <a onClick="return mV(\'1Pe\',1,19);">1Pe 1:19</a>, "precious blood." <a onClick="return mV(\'Luk\',7,2);">Lu 7:2</a>, the servant was "dear" to the centurion (entimos, "highly prized"; compare <a onClick="return mV(\'Phl\',2,29);">Php 2:29</a>; <a onClick="return mV(\'1Pe\',2,6);">1Pe 2:6</a>). <a onClick="return mV(\'1Th\',2,8);">1Th 2:8</a>, "very dear to us" (agapetos, "beloved"). In the Revised Version (British and American), agapetos is generally translated "beloved." "Dearly" before "beloved" of the King James Version is omitted in all passages in the Revised Version (British and American). The word "dear" occurs but once in the Old Testament, namely, <a onClick="return mV(\'Jer\',31,20);">Jer 31:20</a>. the Revised Version (British and American) correctly changes "dear Son" of the King James Version (<a onClick="return mV(\'Col\',1,13);">Col 1:13</a>) into "the Son of his love."``84';
isbe[2582]='Dearth`durth.`<a href="./study/isbe/search.html?string=FAMINE">FAMINE</a>`1';
isbe[2583]='Death`(maweth; thanatos):<P>PHYSIOLOGICAL AND FIGURATIVE VIEW<P>The word "Death" is used in the sense of<P>(1) the process of dying (<a onClick="return mV(\'Gen\',21,16);">Ge 21:16</a>);<P>(2) the period of decease (<a onClick="return mV(\'Gen\',27,7);">Ge 27:7</a>);<P>(3) as a possible synonym for poison (<a onClick="return mV(\'2Ki\',4,40);">2Ki 4:40</a>);<P>(4) as descriptive of person in danger of perishing (<a onClick="return mV(\'Jdg\',15,18);">Jud 15:18</a>; "in deaths oft" <a onClick="return mV(\'2Cr\',11,23);">2Co 11:23</a>). In this sense the shadow of death is a familiar expression in Job, the Psalms and the Prophets;<P>(5) death is personified in <a onClick="return mV(\'1Cr\',15,55);">1Co 15:55</a> and <a onClick="return mV(\'Rev\',20,14);">Re 20:14</a>. Deliverance from this catastrophe is called the "issues from death" (<a onClick="return mV(\'Psa\',68,20);">Ps 68:20</a> the King James Version; translated "escape" in the Revised Version (British and American)). Judicial execution, "putting to death," is mentioned 39 times in the Levitical Law.<P>Figuratively: Death is the loss of spiritual life as in <a onClick="return mV(\'Rom\',8,6);">Ro 8:6</a>; and the final state of the unregenerate is called the "second death" in <a onClick="return mV(\'Rev\',20,14);">Re 20:14</a>.<P>Alex. Macalister<P>THEOLOGICAL VIEW<P>1. Conception of Sin and Death:<P>According to <a onClick="return mV(\'Gen\',2,17);">Ge 2:17</a>, God gave to man, created in His own image, the command not to eat of the tree of knowledge of good and evil, and added thereto the warning, "in the day that thou eatest thereof, thou shalt surely die." Though not exclusively, reference is certainly made here in the first place to bodily death. Yet because death by no means came upon Adam and Eve on the day of their transgression, but took place hundreds of years later, the expression, "in the day that," must be conceived in a wider sense, or the delay of death must be attributed to the entering-in of mercy (<a onClick="return mV(\'Gen\',3,15);">Ge 3:15</a>).<P>However this may be, <a onClick="return mV(\'Gen\',2,17);">Ge 2:17</a> places a close connection between man\'s death and his transgression of God\'s commandment, thereby attaching to death a religious and ethical significance, and on the other hand makes the life of man dependent on his obedience to God. This religious-ethical nature of life and death is not only decidedly and clearly expressed in <a onClick="return mV(\'Gen\',2,\'1-\');">Ge 2</a>, but it is the fundamental thought of the whole of Scripture and forms an essential element in the revelations of salvation. The theologians of early and more recent times, who have denied the spiritual significance of death and have separated the connection between ethical and physical life, usually endeavor to trace back their opinions to Scripture; and those passages which undoubtedly see in death a punishment for sin (<a onClick="return mV(\'Gen\',2,17);">Ge 2:17</a>; <a onClick="return mV(\'Jhn\',8,44);">Joh 8:44</a>; <a onClick="return mV(\'Rom\',5,12);">Ro 5:12</a>; <a onClick="return mV(\'Rom\',6,23);">6:23</a>; <a onClick="return mV(\'1Cr\',15,21);">1Co 15:21</a>), they take as individual opinions, which form no part of the organism of revelation. But this endeavor shuts out the organic character of the revelation of salvation. It is true that death in Holy Scripture is often measured by the weakness and frailty of human nature (<a onClick="return mV(\'Gen\',3,19);">Ge 3:19</a>; <a onClick="return mV(\'Job\',14,1,12);">Job 14:1,12</a>; <a onClick="return mV(\'Psa\',39,5,6);">Ps 39:5,6</a>; <a onClick="return mV(\'Psa\',90,5);">90:5</a>; <a onClick="return mV(\'Psa\',103,14,15);">103:14,15</a>; <a onClick="return mV(\'Ecc\',3,20);">Ec 3:20</a>, etc.).<P>Death is seldom connected with the transgression of the first man either in the Old Testament or the New Testament, or mentioned as a specified punishment for sin (<a onClick="return mV(\'Jhn\',8,44);">Joh 8:44</a>; <a onClick="return mV(\'Rom\',5,12);">Ro 5:12</a>; <a onClick="return mV(\'Rom\',6,23);">6:23</a>; <a onClick="return mV(\'1Cr\',15,21);">1Co 15:21</a>; <a onClick="return mV(\'Jam\',1,15);">Jas 1:15</a>); for the most part it is portrayed as something natural (<a onClick="return mV(\'Gen\',5,5);">Ge 5:5</a>; <a onClick="return mV(\'Gen\',9,29);">9:29</a>; <a onClick="return mV(\'Gen\',15,15);">15:15</a>; <a onClick="return mV(\'Gen\',25,8);">25:8</a>, etc.), a long life being presented as a blessing in contrast to death in the midst of days as a disaster and a judgment (<a onClick="return mV(\'Psa\',102,23);">Ps 102:23</a>f; <a onClick="return mV(\'Isa\',65,20);">Isa 65:20</a>). But all this is not contrary to the idea that death is a consequence of, and a punishment for, sin. Daily, everyone who agrees with Scripture that death is held out as a punishment for sin, speaks in the same way. Death, though come into the world through sin, is nevertheless at the same time a consequence of man\'s physical and frail existence now; it could therefore be threatened as a punishment to man, because he was taken out of the ground and was made a living soul, of the earth earthy (<a onClick="return mV(\'Gen\',2,7);">Ge 2:7</a>; <a onClick="return mV(\'1Cr\',15,45,47);">1Co 15:45,47</a>). If he had remained obedient, he would not have returned to dust (<a onClick="return mV(\'Gen\',3,19);">Ge 3:19</a>), but have pressed forward on the path of spiritual development (<a onClick="return mV(\'1Cr\',15,46,51);">1Co 15:46,51</a>); his return to dust was possible simply because he was made from dust (see <a href="./study/isbe/search.html?string=ADAM+IN+THE+NEW+TESTAMENT">ADAM IN THE NEW TESTAMENT</a>). Thus, although death is in this way a consequence of sin, yet a long life is felt to be a blessing and death a disaster and a judgment, above all when man is taken away in the bloom of his youth or the strength of his years. There is nothing strange, therefore, in the manner in which Scripture speaks about death; we all express ourselves daily in the same way, though we at the same time consider it as the wages of sin. Beneath the ordinary, everyday expressions about death lies the deep consciousness that it is unnatural and contrary to our innermost being.<P>2. The Meaning of Death:<P>This is decidedly expressed in Scripture much more so even than among ourselves. For we are influenced always more or less by the Greek, Platonic idea, that the body dies, yet the soul is immortal. Such an idea is utterly contrary to the Israelite consciousness, and is nowhere found in the Old Testament. The whole man dies, when in death the spirit (<a onClick="return mV(\'Psa\',146,4);">Ps 146:4</a>; <a onClick="return mV(\'Ecc\',12,7);">Ec 12:7</a>), or soul (<a onClick="return mV(\'Gen\',35,18);">Ge 35:18</a>; <a onClick="return mV(\'2Sa\',1,9);">2Sa 1:9</a>; <a onClick="return mV(\'1Ki\',17,21);">1Ki 17:21</a>; <a onClick="return mV(\'Jon\',4,3);">Jon 4:3</a>), goes out of a man. Not only his body, but his soul also returns to a state of death and belongs to the nether-world; therefore the Old Testament can speak of a death of one\'s soul (<a onClick="return mV(\'Gen\',37,21);">Ge 37:21</a> (Hebrew); <a onClick="return mV(\'Num\',23,10);">Nu 23:10</a> margin; <a onClick="return mV(\'Deu\',22,21);">De 22:21</a>; <a onClick="return mV(\'Jdg\',16,30);">Jud 16:30</a>; <a onClick="return mV(\'Job\',36,14);">Job 36:14</a>; <a onClick="return mV(\'Psa\',78,50);">Ps 78:50</a>), and of defilement by coming in contact with a dead body (<a onClick="return mV(\'Lev\',19,28);">Le 19:28</a>; <a onClick="return mV(\'Lev\',21,11);">21:11</a>; <a onClick="return mV(\'Lev\',22,4);">22:4</a>; <a onClick="return mV(\'Num\',5,2);">Nu 5:2</a>; <a onClick="return mV(\'Num\',6,6);">6:6</a>; <a onClick="return mV(\'Num\',9,6);">9:6</a>; <a onClick="return mV(\'Num\',19,10);">19:10</a>ff; <a onClick="return mV(\'Deu\',14,1);">De 14:1</a>; <a onClick="return mV(\'Hag\',2,13);">Hag 2:13</a>). This death of man is not annihilation, however, but a deprivation of all that makes for life on earth. The Sheol (she\'ol) is in contrast with the land of the living in every respect (<a onClick="return mV(\'Job\',28,13);">Job 28:13</a>; <a onClick="return mV(\'Pro\',15,24);">Pr 15:24</a>; <a onClick="return mV(\'Eze\',26,20);">Eze 26:20</a>; <a onClick="return mV(\'Eze\',32,23);">32:23</a>); it is an abode of darkness and the shadow of death (<a onClick="return mV(\'Job\',10,21,22);">Job 10:21,22</a>; <a onClick="return mV(\'Psa\',88,12);">Ps 88:12</a>; <a onClick="return mV(\'Psa\',143,3);">143:3</a>), a place of destruction, yea destruction itself (<a onClick="return mV(\'Job\',26,6);">Job 26:6</a>; <a onClick="return mV(\'Job\',28,22);">28:22</a>; <a onClick="return mV(\'Job\',31,12);">31:12</a>; <a onClick="return mV(\'Psa\',88,11);">Ps 88:11</a>; <a onClick="return mV(\'Pro\',27,20);">Pr 27:20</a>), without any order (<a onClick="return mV(\'Job\',10,22);">Job 10:22</a>), a land of rest, of silence, of oblivion (<a onClick="return mV(\'Job\',3,13,17,18);">Job 3:13,17,18</a>; <a onClick="return mV(\'Psa\',94,17);">Ps 94:17</a>; <a onClick="return mV(\'Psa\',115,17);">115:17</a>), where God and man are no longer to be seen (<a onClick="return mV(\'Isa\',38,11);">Isa 38:11</a>), God no longer praised or thanked (<a onClick="return mV(\'Psa\',6,5);">Ps 6:5</a>; <a onClick="return mV(\'Psa\',115,17);">115:17</a>), His perfections no more acknowledged (<a onClick="return mV(\'Psa\',88,\'10-13\');">Ps 88:10-13</a>; <a onClick="return mV(\'Isa\',38,18,19);">Isa 38:18,19</a>), His wonders not contemplated (<a onClick="return mV(\'Psa\',88,12);">Ps 88:12</a>), where the dead are unconscious, do no more work, take no account of anything, possess no knowledge nor wisdom, neither have any more a portion in anything that is done under the sun (<a onClick="return mV(\'Ecc\',9,5,6,10);">Ec 9:5,6,10</a>). The dead ("the Shades" the Revised Version, margin; compare article <a href="./study/isbe/search.html?string=DECEASE">DECEASE</a>) are asleep (<a onClick="return mV(\'Job\',26,5);">Job 26:5</a>; <a onClick="return mV(\'Pro\',2,18);">Pr 2:18</a>; <a onClick="return mV(\'Pro\',9,18);">9:18</a>; <a onClick="return mV(\'Pro\',21,6);">21:6</a>; <a onClick="return mV(\'Psa\',88,11);">Ps 88:11</a>; <a onClick="return mV(\'Isa\',14,9);">Isa 14:9</a>), weakened (<a onClick="return mV(\'Isa\',14,10);">Isa 14:10</a>) and without strength (<a onClick="return mV(\'Psa\',88,4);">Ps 88:4</a>).<P>3. Light in the Darkness:<P>The dread of death was felt much more deeply therefore by the Israelites than by ourselves. Death to them was separation from all that they loved, from God, from His service, from His law, from His people, from His land, from all the rich companionship in which they lived. But now in this darkness appears the light of the revelation of salvation from on high. The God of Israel is the living God and the fountain of all life (<a onClick="return mV(\'Deu\',5,26);">De 5:26</a>; <a onClick="return mV(\'Jos\',3,10);">Jos 3:10</a>; <a onClick="return mV(\'Psa\',36,9);">Ps 36:9</a>). He is the Creator of heaven and earth, whose power knows no bounds and whose dominion extends over life and death (<a onClick="return mV(\'Deu\',32,39);">De 32:39</a>; <a onClick="return mV(\'1Sa\',2,6);">1Sa 2:6</a>; <a onClick="return mV(\'Psa\',90,3);">Ps 90:3</a>). He gave life to man (<a onClick="return mV(\'Gen\',1,26);">Ge 1:26</a>; <a onClick="return mV(\'Gen\',2,7);">2:7</a>), and creates and sustains every man still (<a onClick="return mV(\'Job\',32,8);">Job 32:8</a>; <a onClick="return mV(\'Job\',33,4);">33:4</a>; <a onClick="return mV(\'Job\',34,14);">34:14</a>; <a onClick="return mV(\'Psa\',104,29);">Ps 104:29</a>; <a onClick="return mV(\'Ecc\',12,7);">Ec 12:7</a>). He connects life with the keeping of His law and appoints death for the transgression of it (<a onClick="return mV(\'Gen\',2,17);">Ge 2:17</a>; <a onClick="return mV(\'Lev\',18,5);">Le 18:5</a>; <a onClick="return mV(\'Deu\',30,20);">De 30:20</a>; <a onClick="return mV(\'Deu\',32,47);">32:47</a>). He lives in heaven, but is present also by His spirit in Sheol (<a onClick="return mV(\'Psa\',139,7,8);">Ps 139:7,8</a>). Sheol and Abaddon are open to Him even as the hearts of the children of men (<a onClick="return mV(\'Job\',26,6);">Job 26:6</a>; <a onClick="return mV(\'Job\',38,17);">38:17</a>; <a onClick="return mV(\'Pro\',15,11);">Pr 15:11</a>). He kills and makes alive, brings down into Sheol and raises from thence again (<a onClick="return mV(\'Deu\',32,39);">De 32:39</a>; <a onClick="return mV(\'1Sa\',2,6);">1Sa 2:6</a>; <a onClick="return mV(\'2Ki\',5,7);">2Ki 5:7</a>). He lengthens life for those who keep His commandments (<a onClick="return mV(\'Exd\',20,12);">Ex 20:12</a>; <a onClick="return mV(\'Job\',5,26);">Job 5:26</a>), gives escape from death, can deliver when death menaces (<a onClick="return mV(\'Psa\',68,20);">Ps 68:20</a>; <a onClick="return mV(\'Isa\',38,5);">Isa 38:5</a>; <a onClick="return mV(\'Jer\',15,20);">Jer 15:20</a>; <a onClick="return mV(\'Dan\',3,26);">Da 3:26</a>), can take Enoch and Elijah to Himself without dying (<a onClick="return mV(\'Gen\',5,24);">Ge 5:24</a>; <a onClick="return mV(\'2Ki\',2,11);">2Ki 2:11</a>), can restore the dead to life (<a onClick="return mV(\'1Ki\',17,22);">1Ki 17:22</a>; <a onClick="return mV(\'2Ki\',4,34);">2Ki 4:34</a>; <a onClick="return mV(\'2Ki\',13,21);">13:21</a>). He can even bring death wholly to nothing and completely triumph over its power by rising from the dead (<a onClick="return mV(\'Job\',14,\'13-15\');">Job 14:13-15</a>; <a onClick="return mV(\'Job\',19,\'25-27\');">19:25-27</a>; <a onClick="return mV(\'Hsa\',6,2);">Ho 6:2</a>; <a onClick="return mV(\'Hsa\',13,14);">13:14</a>; <a onClick="return mV(\'Isa\',25,8);">Isa 25:8</a>; <a onClick="return mV(\'Isa\',26,19);">26:19</a>; <a onClick="return mV(\'Eze\',37,11,12);">Eze 37:11,12</a>; <a onClick="return mV(\'Dan\',12,2);">Da 12:2</a>).<P>4. Spiritual Significance:<P>This revelation by degrees rejects the old contrast between life on earth and the disconsolate existence after death, in the dark place of Sheol, and puts another in its place. The physical contrast between life and death gradually makes way for the moral and spiritual difference between a life spent in the fear of the Lord, and a life in the service of sin. The man who serves God is alive (<a onClick="return mV(\'Gen\',2,17);">Ge 2:17</a>); life is involved in the keeping of His commandments (<a onClick="return mV(\'Lev\',18,5);">Le 18:5</a>; <a onClick="return mV(\'Deu\',30,20);">De 30:20</a>); His word is life (<a onClick="return mV(\'Deu\',8,3);">De 8:3</a>; <a onClick="return mV(\'Deu\',32,47);">32:47</a>). Life is still for the most part understood to mean length of days (<a onClick="return mV(\'Pro\',2,18);">Pr 2:18</a>; <a onClick="return mV(\'Pro\',3,16);">3:16</a>; <a onClick="return mV(\'Pro\',10,30);">10:30</a>; <a onClick="return mV(\'Isa\',65,20);">Isa 65:20</a>). Nevertheless it is remarkable that Pr often mentions death and Sheol in connection with the godless (<a onClick="return mV(\'Pro\',2,18);">Pr 2:18</a>; <a onClick="return mV(\'Pro\',5,5);">5:5</a>; <a onClick="return mV(\'Pro\',7,27);">7:27</a>; <a onClick="return mV(\'Pro\',9,18);">9:18</a>), and on the other hand only speaks of life in connection with the righteous. Wisdom, righteousness, the fear of the Lord is the way of life (<a onClick="return mV(\'Pro\',8,35,36);">Pr 8:35,36</a>; <a onClick="return mV(\'Pro\',11,19);">11:19</a>; <a onClick="return mV(\'Pro\',12,28);">12:28</a>; <a onClick="return mV(\'Pro\',13,14);">13:14</a>; <a onClick="return mV(\'Pro\',14,27);">14:27</a>; <a onClick="return mV(\'Pro\',19,23);">19:23</a>). The wicked is driven away in his wickedness, but the righteous hath hope in his death (<a onClick="return mV(\'Pro\',14,32);">Pr 14:32</a>). Blessed is he who has the Lord for his God (<a onClick="return mV(\'Deu\',33,29);">De 33:29</a>; <a onClick="return mV(\'Psa\',1,1.2);">Ps 1:1,2</a>; <a onClick="return mV(\'Psa\',2,12);">2:12</a>; <a onClick="return mV(\'Psa\',32,1,2);">32:1,2</a>; <a onClick="return mV(\'Psa\',33,12);">33:12</a>; <a onClick="return mV(\'Psa\',34,9);">34:9</a>, etc.); he is comforted in the greatest adversity (<a onClick="return mV(\'Psa\',73,\'25-28\');">Ps 73:25-28</a>; <a onClick="return mV(\'Hab\',3,\'17-19\');">Hab 3:17-19</a>), and sees a light arise for him behind physical death (<a onClick="return mV(\'Gen\',49,18);">Ge 49:18</a>; <a onClick="return mV(\'Job\',14,\'13-15\');">Job 14:13-15</a>; <a onClick="return mV(\'Job\',16,\'16-21\');">16:16-21</a>; <a onClick="return mV(\'Job\',19,\'25-27\');">19:25-27</a>; <a onClick="return mV(\'Psa\',73,\'23-26\');">Ps 73:23-26</a>). The godless on the contrary, although enjoying for a time much prosperity, perish and come to an end (<a onClick="return mV(\'Psa\',1,\'4-6\');">Ps 1:4-6</a>; <a onClick="return mV(\'Psa\',73,\'18-20\');">73:18-20</a>; <a onClick="return mV(\'Isa\',48,22);">Isa 48:22</a>; <a onClick="return mV(\'Mal\',4,3);">Mal 4:3</a>, etc.).<P>The righteous of the Old Testament truly are continually occupied with the problem that the lot of man on earth often corresponds so little to his spiritual worth, but he strengthens himself with the conviction that for the righteous it will be well, and for the wicked, ill (<a onClick="return mV(\'Ecc\',8,12,13);">Ec 8:12,13</a>; <a onClick="return mV(\'Isa\',3,10,11);">Isa 3:10,11</a>). If they do not realize it in the present, they look forward to the future and hope for the day in which God\'s justice will extend salvation to the righteous, and His anger will be visited on the wicked in judgment. So in the Old Testament the revelation of the new covenant is prepared wherein Christ by His appearance hath abolished death and hath brought life and immortality to light through the gospel (<a onClick="return mV(\'2Ti\',1,10);">2Ti 1:10</a>). See <a href="./study/isbe/search.html?string=ABOLISH">ABOLISH</a>. This everlasting life is already here on earth presented to man by faith, and it is his portion also in the hour of death (<a onClick="return mV(\'Jhn\',3,36);">Joh 3:36</a>; <a onClick="return mV(\'Jhn\',11,25,26);">11:25,26</a>). On the other hand, he who lives in sin and is disobedient to the Son of God, is in his living dead (<a onClick="return mV(\'Mat\',8,22);">Mt 8:22</a>; <a onClick="return mV(\'Luk\',15,32);">Lu 15:32</a>; <a onClick="return mV(\'Jhn\',3,36);">Joh 3:36</a>; <a onClick="return mV(\'Jhn\',8,24);">8:24</a>; <a onClick="return mV(\'Eph\',2,1);">Eph 2:1</a>; <a onClick="return mV(\'Col\',2,13);">Col 2:13</a>); he shall never see life, but shall pass by bodily death into the second death (<a onClick="return mV(\'Rev\',2,11);">Re 2:11</a>; <a onClick="return mV(\'Rev\',20,6,14);">20:6,14</a>; <a onClick="return mV(\'Rev\',21,8);">21:8</a>).<P>5. Death in Non-Christian Religions and in Science:<P>This view of Scripture upon death goes much deeper than that which is found in other religions, but it nevertheless receives support from the unanimous witness of humanity with regard to its unnaturalness and dread. The so-called nature-peoples even feel that death is much more of an enigma than life; Tiele (Inleiding tot de goddienst- artenschap, II (1900), 202, referring to Andrew Lang, Modern Mythology, chapter xiii) says rightly, that all peoples have the conviction that man by nature is immortal, that immortality wants no proof, but that death is a mystery and must be explained. Touching complaints arise in the hearts of all men on the frailty and vanity of life, and the whole of mankind fears death as a mysterious power. Man finds comfort in death only when he hopes it will be an end to a still more miserable life. Seneca may be taken as interpreter of some philosophers when he says: Stultitia est timore morris mori ("It is stupid to die through the fear of death") and some may be able, like a Socrates or a Cato, to face death calmly and courageously; what have these few to say to the millions, who through fear of death are all their lifetime subject to bondage (<a onClick="return mV(\'Hbr\',2,15);">Heb 2:15</a>)? Such a mystery has death remained up to the present day. It may be said with Kassowitz, Verworm and others that the "cell" is the beginning, and the old, gray man is the natural end of an uninterrupted life-development, or with Metschnikoff, that science will one day so lengthen life that it will fade away like a rose at last and death lose all its dread; death still is no less a riddle, and one which swallows up all the strength of life. When one considers, besides, that a number of creatures, plants, trees, animals, reach a much higher age than man; that the larger half of mankind dies before or shortly after birth; that another large percentage dies in the bloom of youth or in the prime of life; that the law of the survival of the fittest is true only when the fact of the survival is taken as a proof of their fitness; that the graybeards, who, spent and decrepit, go down to the grave, form a very small number; then the enigma of death increases more and more in mysteriousness.<P>The endeavors to bring death into connection with certain activities of the organism and to explain it by increasing weight, by growth or by fertility, have all led to shipwreck. When Weismann took refuge in the immortality of the "einzellige Protozoen," he raised a hypothesis which not only found many opponents, but which also left mortality of the "Korperplasma" an insoluble mystery (Beth, "Ueber Ursache und Zweck des Todes, Glauben und Wissen" (1909), 285-304, 335-48). Thus, science certainly does not compel us to review Scripture on this point, but rather furnishes a strong proof of the mysterious majesty of death. When Pelagius, Socinus, Schleiermacher, Ritschl and a number of other theologians and philosophers separate death from its connection with sin, they are not compelled to do so by science, but are led by a defective insight into the relation between ethos and phusis. Misery and death are not absolutely always consequences and punishment of a great personal transgression (<a onClick="return mV(\'Luk\',13,2);">Lu 13:2</a>; <a onClick="return mV(\'Jhn\',9,3);">Joh 9:3</a>); but that they are connected with sin, we learn from the experience of every day. Who can number the victims of mammonism, alcoholism and licentiousness? Even spiritual sins exercise their influence on corporal life; envy is a rottenness of the bones (<a onClick="return mV(\'Pro\',14,30);">Pr 14:30</a>). This connection is taught us in a great measure by Scripture, when it placed the not yet fallen man in a Paradise, where death had not yet entered, and eternal life was not yet possessed and enjoyed; when it sends fallen man, who, however, is destined for redemption, into a world full of misery and death; and at last assigns to the wholly renewed man a new heaven and a new earth, where death, sorrow, crying or pain shall no longer exist (<a onClick="return mV(\'Rev\',21,4);">Re 21:4</a>). Finally, Scripture is not the book of death, but of life, of everlasting life through Jesus Christ our Lord. It tells us, in oft-repeated and unmistakable terms, of the dreaded reality of death, but it proclaims to us still more loudly the wonderful power of the life which is in Christ Jesus.`<a href="./study/isbe/search.html?string=DECEASE">DECEASE</a>`10';
isbe[2584]='Death, Body of``<a href="./study/isbe/search.html?string=BODY+OF+DEATH">BODY OF DEATH</a>`1';
isbe[2585]='Death, Second`(ho deuteros thanatos): An expression, peculiar to the Book of Revelation (<a onClick="return mV(\'Rev\',2,11);">re 2:11</a>; <a onClick="return mV(\'Rev\',20,6,14);">20:6,14</a>; <a onClick="return mV(\'Rev\',21,8);">21:8</a>) in Scripture, denoting the final penalty of the unrighteous; parallel with another expression likewise peculiar, "the lake of fire," in <a onClick="return mV(\'Rev\',20,14);">Re 20:14</a>; <a onClick="return mV(\'Rev\',21,8);">21:8</a>.`<a href="./study/isbe/search.html?string=ESCHATOLOGY+OF+THE+NEW+TESTAMENT">ESCHATOLOGY OF THE NEW TESTAMENT</a>`1';
isbe[2586]='Debate`de-bat\':This word is used only once in the Revised Version (British and American) (<a onClick="return mV(\'Pro\',25,9);">Pr 25:9</a>). It evidently refers to the settling of a difficulty with a neighbor, and anticipates <a onClick="return mV(\'Mat\',18,15);">Mt 18:15</a>. It argues for and shows the advantage of private, peaceable settlement of difficulties. Compare Ecclesiasticus 28:9`<a href="./study/isbe/search.html?string=MAKEBATES">MAKEBATES</a>`1';
isbe[2587]='Debir (1)`de\'-ber (debhir, or debhir, "oracle"): King of Eglon, one of the five Amorite kings whose confederation against Israel was overcome and who were killed by Joshua (<a onClick="return mV(\'Jos\',10,3);">Jos 10:3</a>).``1';
isbe[2588]='Debir (2)`de\'-ber (debhir; Dabeir): "And Joshua returned, and all Israel with him, to Debir, and fought against it: and he took it, and the king thereof, and all the cities thereof; and they smote them with the edge of the sword...he left none remaining" (<a onClick="return mV(\'Jos\',10,38,39);">Jos 10:38,39</a>). In <a onClick="return mV(\'Jos\',15,\'15-17\');">Jos 15:15-17</a> and <a onClick="return mV(\'Jdg\',1,\'11-13\');">Jud 1:11-13</a> is an account of how Othniel captured Debir, which "beforetime was Kiriath-sepher," and won thereby the hand of Achsah, Caleb\'s daughter. In <a onClick="return mV(\'Jos\',15,49);">Jos 15:49</a> Debir is called Kiriath-sannah. It had once been inhabited by the Anakim (<a onClick="return mV(\'Jos\',11,21);">Jos 11:21</a>). It was a Levitical city (<a onClick="return mV(\'Jos\',21,15);">Jos 21:15</a>; <a onClick="return mV(\'1Ch\',6,58);">1Ch 6:58</a>).<P>1. The Meaning of the Name:<P>(1) Debir is usually accepted as meaning "back," but this is doubtful; the word debhir is used to denote the "holy of holies" (<a onClick="return mV(\'1Ki\',6,5);">1Ki 6:5</a>). According to Sayce (HDB), "the city must have been a sacred one with a well-known temple." Kiriath-sepher is translated "town of books," and Sayce and others consider that in all probability there was a great storehouse of clay tablets here; perhaps the name may have been qiryath copher, "town of scribes." Kiriath-sannah (<a onClick="return mV(\'Jos\',15,49);">Jos 15:49</a>) is probably a corruption of Kiriath-sepher; the Septuagint has here as in references to the latter polis grammaton, "town of books."<P>2. The Site:<P>Unfortunately this site, important even if the speculations about the books are doubtful, is still a matter of uncertainty. Edh-Dhaheriyeh, some 11 miles southwest of Hebron, has a good deal of support. It was unquestionably a site of importance in ancient times as the meeting-place of several roads; it is in the Negeb (compare <a onClick="return mV(\'Jdg\',1,15);">Jud 1:15</a>), in the neighborhood of the probable site of Anab (<a onClick="return mV(\'Jos\',11,21);">Jos 11:21</a>; <a onClick="return mV(\'Jos\',15,50);">15:50</a>); it is a dry site, but there are "upper" and "lower" springs about 6 1/2 miles to the North. A more thorough examination of the site than has as yet been undertaken might produce added proofs in favor of this identification. No other suggestion has any great probability. See PEF, III, 402; PEFS, 1875.<P>(2) Debir, on the border between Judah and Benjamin (<a onClick="return mV(\'Jos\',15,7);">Jos 15:7</a>), must have been somewhere east of Jerusalem not far from the modern Jericho road. Thoghgret edition Debr, "the pass of the rear," half a mile southwest of the Tal\'at edition Dumm (see <a href="./study/isbe/search.html?string=ADUMMIM">ADUMMIM</a>), close to the so-called, "Inn of the Good Samaritan," may be an echo of the name which has lingered in the neighborhood. Many authorities consider that there is no place-name in this reference at all, the text being corrupt.<P>(3) Debir the Revised Version, margin, Lidebir (<a onClick="return mV(\'Jos\',13,26);">Jos 13:26</a>), a town on the border of Gad, near Mahanaim; Ibdar, south of the Yarmuk has been suggested. May be identical with Lo-debar (<a onClick="return mV(\'2Sa\',9,4);">2Sa 9:4</a>).``117';
isbe[2589]='Deborah`deb\'-o-ra (debhorah, signifying "bee"):<P>(1) Rebekah\'s nurse, who died near Bethel and was buried under "the oak of weeping" (<a onClick="return mV(\'Gen\',35,8);">Ge 35:8</a> margin).<P>(2) A prophetess, fourth in the order of the "judges." In aftertime a palm tree, known as the "palm tree of Deborah," was shown between Ramah and Bethel, beneath which the prophetess was wont to administer justice. Like the rest of the "judges" she became a leader of her people in times of national distress. This time the oppressor was Jabin, king of Hazor, whose general was Sisera. Deborah summoned Barak of Kedesh-naphtali and delivered to him the Divine message to meet Sisera in battle by the brook Kishon. Barak induced Deborah to accompany him; they were joined by 10,000 men of Zebulun and Naphtali. The battle took place by the brook Kishon, and Sisera\'s army was thoroughly routed. While Barak pursued the fleeing army, Sisera escaped and sought refuge with Jael the wife of Heber the Kenite, near Kedesh. The brave woman, the prototype of Judith, put the Canaanite general to sleep by offering him a draft of milk and then slew him by driving a peg into his temple.<P>Thus runs the story in <a onClick="return mV(\'Jdg\',4,\'1-\');">Jud 4</a>. It is on the whole substantiated by the ode in chapter <a onClick="return mV(\'Jdg\',5,\'1-\');">5</A> which is ascribed jointly to Deborah and Barak. It is possible that the editor mistook the archaic form qamti, in <a onClick="return mV(\'Jdg\',5,7);">5:7</A> which should be rendered "thou arosedst" instead of "I arose." Certainly the ode was composed by a person who, if not a contemporary of the event, was very near it in point of time. The song is spoken of as one of the oldest pieces of Hebrew literature. Great difficulties meet the exegete. Nevertheless the general substance is clear. The Lord is described as having come from Sinai near the "field of Edom" to take part in the battle; \'for from heaven they fought, the very stars from their courses fought against Sisera\' (<a onClick="return mV(\'Jdg\',5,20);">5:20</a>). The nation was in a sad plight, oppressed by a mighty king, and the tribes loth to submerge their separatist tendencies. Some, like Reuben, Gilead, Dan and Asher remained away. A community by the name of Meroz is singled out for blame, \'because they came not to the help of Yahweh, to the help of Yahweh among the mighty\' (<a onClick="return mV(\'Jdg\',5,23);">5:23</A>; compare the Revised Version, margin).<P>Ephraim, Issachar, Machir, Benjamin were among the followers of Barak; "Zebulun...jeopardized their lives unto the death, and Naphtali, upon the high places of the field" (verse <a onClick="return mV(\'Jdg\',5,18);">18</A>). According to the song, the battle was fought at Taanach by the waters of Megiddo; Sisera\'s host was swept away by "that ancient river, the river Kishon" (verse 21). Jael, the wife of Heber the Kenite, receives here due reward of praise for her heroic act. The paean vividly paints the waiting of Sisera\'s mother for the home-coming of the general; the delay is ascribed to the great booty which the conqueror is distributing among his Canaanite host. "So let all thine enemies perish," concludes the song; "O Yahweh: but let them that love him be as the sun when he goeth forth in his might." It is a song in praise of the "righteous acts" of the Lord, His work of victory which Israel\'s leaders, \'the long-haired princes,\' wrought, giving their lives freely to the nation\'s cause. And the nation was sore bestead because it had become faithless to the Lord and chosen new gods. Out of the conflict came, for the time being, victory and moral purification; and the inspiring genius of it all was a woman in Israel, the prophetess Deborah.<P>(3) Tobit\'s grandmother (the King James Version "Debora," Tobit 1:8).``115';
isbe[2590]='Debt; Debtor`det, det\'-er: It is difficult nowadays to think of debt without associating with it the idea of interest, and even usury. Certain it is that this idea is associated with the Old Testament idea of the word, at least in the later period of Old Testament history. This is true of the New Testament entire. The Hebrew word (neshi) always carries with it the idea of "biting interest" (compare <a onClick="return mV(\'2Ki\',4,7);">2Ki 4:7</a>). The Greek words daneion (<a onClick="return mV(\'Mat\',18,27);">Mt 18:27</a>), and opheile (<a onClick="return mV(\'Mat\',18,32);">Mt 18:32</a>), may point only to the fact of indebtedness; the idea of interest, however, is clearly taught in the New Testament (compare <a onClick="return mV(\'Mat\',25,27);">Mt 25:27</a>).<P>Quite extensive legislation is provided in the Old Testament governing the matter of debt and debtors. Indebtedness and loaning had not, however, the commercial aspect among the Jews so characteristic of the nations surrounding Palestine. Indeed the Mosaic legislation was seemingly intended to guard against just such commercialism. It was looked upon as a misfortune to be in debt; it indicated poverty brought on probably by blighted harvests; consequently those in debt were to be looked upon with pity and dealt with in leniency. There must be no oppression of the poor under such circumstances (<a onClick="return mV(\'Exd\',22,25);">Ex 22:25</a>; <a onClick="return mV(\'Deu\',23,19,20);">De 23:19,20</a>; <a onClick="return mV(\'Eze\',18,18);">Eze 18:18</a>). Even where a pledge is given and received, certain restrictions are thrown around it, e. g. the creditor must not take a mill, nor a necessary garment, nor a widow\'s ox, etc., in pledge (<a onClick="return mV(\'Exd\',22,\'25-27\');">Ex 22:25-27</a>; <a onClick="return mV(\'Deu\',24,6);">De 24:6</a>,<a onClick="return mV(\'Deu\',24,\'10-13\');">10-13</a>; <a onClick="return mV(\'Job\',22,6);">Job 22:6</a>; <a onClick="return mV(\'Amo\',2,8);">Am 2:8</a>). And further, the pledge is to be restored in some instances "before the sun goeth down" (<a onClick="return mV(\'Exd\',22,26,27);">Ex 22:26,27</a>), and in all cases full redemption in the seventh and jubilee years (<a onClick="return mV(\'Neh\',10,31);">Ne 10:31</a>, etc.). The Jews were strictly exhorted to take no interest at all from their own nation (<a onClick="return mV(\'Exd\',22,25);">Ex 22:25</a>; <a onClick="return mV(\'Deu\',23,19,20);">De 23:19,20</a>). Strangers, however, might be charged interest (ibid.). A devout Jew would not lend money to another Jew on interest.<P>It would seem that as Israel came into contact with the surrounding nations, debt became increasingly a commercial matter. The Mosaic laws regarding clemency toward the poor who were compelled for the time being to become debtors were utterly disregarded, and the poor were oppressed by the rich. An illustration of the severity with which debtors came to be dealt with is to be found in <a onClick="return mV(\'2Ki\',4,\'1-7\');">2Ki 4:1-7</a>, in which, because of the inability of a widow to pay a small debt contracted by her dead husband, the woman complains to the prophet that the creditors have come to sell her two children in order that the debt might be paid. Strangely the prophet, while helping the widow by miraculously multiplying the oil in order that the debt might be paid, says nothing by way of condemnation of such conduct on the part of the creditors. Are we to understand by this that commercialism had already so powerful a grip upon Israel that even to a prophet the practice had come to seem proper, or at least expected? The debtor himself or his family might be sold for debt, or the debtor might become a slave for a certain length of time until the debt was paid (<a onClick="return mV(\'Lev\',25,39,47);">Le 25:39,47</a>; <a onClick="return mV(\'Isa\',50,1);">Isa 50:1</a>). So oppressive had the commercial system in Israel become that the debtor cursed the creditor and the creditor the debtor (<a onClick="return mV(\'Jer\',15,10);">Jer 15:10</a>). Sometimes debtors were outlawed, as in the case of the men who came to David in the cave of Adullam (<a onClick="return mV(\'1Sa\',22,2);">1Sa 22:2</a>). That the matter of borrowing and lending had assumed very grievous proportions is evident from the very sharp warnings concerning the matter in the Book of Proverbs (<a onClick="return mV(\'Pro\',6,1);">Pr 6:1</a>; <a onClick="return mV(\'Pro\',11,15);">11:15</a>; <a onClick="return mV(\'Pro\',20,16);">20:16</a>, etc.).<P>The teaching of the New Testament on this subject is confined very largely to the parables of our Lord. Some think that the expression, "Owe no man anything" (<a onClick="return mV(\'Rom\',13,8);">Ro 13:8</a>), is an absolute warning against indebtedness. Quite a noticeable advance in the matter of debts and debtors is noticed as we enter the time of the New Testament. We read of bankers, exchangers, moneychangers, interest, investments, usury (<a onClick="return mV(\'Mat\',25,\'16-27\');">Mt 25:16-27</a>; <a onClick="return mV(\'Jhn\',2,\'13-17\');">Joh 2:13-17</a>). The taking of interest does not seem to be explicitly condemned in the New Testament. The person of the debtor, as well as his family and lands, could be seized for non-payment of debt (<a onClick="return mV(\'Mat\',18,\'21-26\');">Mt 18:21-26</a>). Indeed, the debtor was often cast into prison and tormented because of non-payment (<a onClick="return mV(\'Mat\',18,30,34);">Mt 18:30,34</a>). That compassion and leniency should be exercised toward those in debt is the clear teaching of Christ in the parables of the Unmerciful Servant (<a onClick="return mV(\'Mat\',18,\'23-35\');">Mt 18:23-35</a>) and the Two Debtors (<a onClick="return mV(\'Luk\',7,\'41-43\');">Lu 7:41-43</a>).<P>Figurative: Debt and debtor are used in a moral sense also as indicating the obligation of a righteous life which we owe to God. To fall short in righteous living is to become a debtor. For this reason we pray, "Forgive us our debts" (<a onClick="return mV(\'Mat\',6,12);">Mt 6:12</a>). Those who are ministered to in spiritual things are said to be debtors to those who minister to them (<a onClick="return mV(\'Rom\',15,27);">Ro 15:27</a>). To make a vow to God is to put one\'s self in debt in a moral sense (<a onClick="return mV(\'Mat\',23,\'16-18\');">Mt 23:16-18</a>; the Revised Version, margin "bound by his oath"). In a deeply spiritual sense the apostle Paul professed to be in debt to all men in that he owed them the opportunity to do them good (<a onClick="return mV(\'Rom\',1,14);">Ro 1:14</a>).<P>The parables of Jesus as above named are rich with comforting truth. How beautiful is the willingness of God, the great and Divine Creditor, to release us from our indebtedness! Just so ought we to be imitators of the Father in heaven who is merciful.``53';
isbe[2591]='Decalogue`dek\'-a-log`<a href="./study/isbe/search.html?string=TEN+COMMANDMENTS">TEN COMMANDMENTS</a>`1';
isbe[2592]='Decapolis`de-kap\'-o-lis (Dekapolis): The name given to the region occupied by a league of "ten cities" (<a onClick="return mV(\'Mat\',4,25);">Mt 4:25</a>; <a onClick="return mV(\'Mar\',5,20);">Mr 5:20</a>; <a onClick="return mV(\'Mar\',7,31);">7:31</a>), which Eusebius defines (in Onomastica) as "lying in the Peraea, round Hippos, Pella and Gadara." Such combinations of Greek cities arose as Rome assumed dominion in the East, to promote their common interests in trade and commerce, and for mutual protection against the peoples surrounding them.<P>This particular league seems to have been constituted about the time of Pompey\'s campaign in Syria, 65 BC, by which several cities in Decapolis dated their eras. They were independent of the local tetrarchy, and answerable directly to the governor of Syria. They enjoyed the rights of association and asylum; they struck their own coinage, paid imperial taxes and were liable to military service (Ant., XIV, iv, 4; BJ, I, vii, 7; II, xviii, 3; III, ix, 7; Vita,65,74). Of the ten cities, Scythopolis, the ancient Bethshean, alone, the capital of the league, was on the west side of Jordan. The names given by Pliny (NH, v.18) are Scythopolis (Beisan), Hippos (Susiyeh), Gadara (Umm Qeis), Pella (Fahil), Philadelphia (\'Amman), Gerasa (Jerash), Dion (Adun?), Canatha (Qanawat), Damascus and Raphana. The last named is not identified, and Dion is uncertain. Other cities joined the league, and Ptolemy, who omits Raphans, gives a list of 18. The Greek inhabitants were never on good terms with the Jews; and the herd of swine (<a onClick="return mV(\'Mar\',5,11);">Mr 5:11</a>ff) indicates contempt for what was probably regarded as Jewish prejudice. The ruins still seen at Gadara, but especially at Kanawat (see <a href="./study/isbe/search.html?string=KENATH">KENATH</a>) and Jerash, of temples, theaters and other public buildings, attest the splendor of these cities in their day.``54';
isbe[2593]='Decay`de-ka\':Although this word is still in good use in both its literal sense, of the putrefaction of either animal or vegetable matter, and its derived sense, denoting any deterioration, decline or gradual failure, the Revised Version (British and American) has replaced it by other expressions in <a onClick="return mV(\'Lev\',25,35);">Le 25:35</a>; <a onClick="return mV(\'Ecc\',10,18);">Ec 10:18</a>; <a onClick="return mV(\'Isa\',44,26);">Isa 44:26</a>; <a onClick="return mV(\'Hbr\',8,13);">Heb 8:13</a>; in some of these cases with a gain in accuracy of translation. In <a onClick="return mV(\'Neh\',4,10);">Ne 4:10</a> (kashal, "to be feeble," "stumble") the Revised Version (British and American) retains "is decayed"; in <a onClick="return mV(\'Job\',14,11);">Job 14:11</a> (charebh, "to be dried up") the American Standard Revised Version substitutes "wasteth," and in <a onClick="return mV(\'Jhn\',11,39);">Joh 11:39</a> the American Standard Revised Version has "the body decayeth" instead of the more literal translation offensive to modern ears (ozei, "emits a smell").``57';
isbe[2594]='Decease, in New Testament`de-ses\' (teleutao, "to come to an end," "married and deceased" (<a onClick="return mV(\'Mat\',22,25);">Mt 22:25</a>)): With thanato, "death," "die the death" (<a onClick="return mV(\'Mat\',15,4);">Mt 15:4</a>; <a onClick="return mV(\'Mar\',7,10);">Mr 7:10</a>, the Revised Version, margin "surely die"). Elsewhere the word is translated "die" (<a onClick="return mV(\'Mat\',2,19);">Mt 2:19</a>; <a onClick="return mV(\'Mat\',9,18);">9:18</a>; <a onClick="return mV(\'Mar\',9,48);">Mr 9:48</a> and often; <a onClick="return mV(\'Hbr\',11,22);">Heb 11:22</a>, the Revised Version (British and American) "end was nigh").<P>Also the substantive, exodos, "exodus," "exit," "departure," "his decease which he was about to accomplish" (<a onClick="return mV(\'Luk\',9,31);">Lu 9:31</a>, the Revised Version, margin "departure"); "after my decease" (<a onClick="return mV(\'2Pe\',1,15);">2Pe 1:15</a>, the Revised Version, margin "departure").``1';
isbe[2595]='Decease, in the Old Testament And Apocyphra`de-ses\' (rapha\', plural repha\'im, "ghosts," "shades," is translated by "dead," "dead body," and "deceased" in both the King James Version and the Revised Version (British and American)): The word seems to mean "soft," "inert," but its etymology is uncertain (see <a href="./study/isbe/search.html?string=REPHAIM">REPHAIM</a>). The various writers of the Old Testament present, as is to be expected on such a subject, different conceptions of the condition of the deceased. In the beginning probably a vague idea of the continuation of existence was held, without the activities (<a onClick="return mV(\'Isa\',59,10);">Isa 59:10</a>) and the joys of the present life (<a onClick="return mV(\'Psa\',49,17);">Ps 49:17</a>). They dwell in the "land of forgetfulness" (<a onClick="return mV(\'Job\',14,21);">Job 14:21</a>; <a onClick="return mV(\'Psa\',88,5);">Ps 88:5</a>; compare <a onClick="return mV(\'Isa\',26,14);">Isa 26:14</a>), they "tremble" of cold (<a onClick="return mV(\'Job\',26,5);">Job 26:5</a>), they totter and "stumble at noonday as in the twilight" (<a onClick="return mV(\'Isa\',59,10);">Isa 59:10</a>), their voice is described as low and muttering or chirping (<a onClick="return mV(\'Isa\',8,19);">Isa 8:19</a>; <a onClick="return mV(\'Isa\',29,4);">29:4</a>), which may refer to the peculiar pitch of the voice of the spirit medium when a spirit speaks through him. (The calling up of the dead, which was strictly forbidden to Israel (<a onClick="return mV(\'Lev\',19,31);">Le 19:31</a>; <a onClick="return mV(\'Lev\',20,27);">20:27</a>) is referred to in <a onClick="return mV(\'1Sa\',28,13);">1Sa 28:13</a> and perhaps in <a onClick="return mV(\'Isa\',14,9);">Isa 14:9</a>.) The deceased are separated from their friends; love and hatred have both ceased with them (<a onClick="return mV(\'Ecc\',9,5,6);">Ec 9:5,6</a>); "There is no work, nor device, nor knowledge, nor wisdom, in Sheol" (<a onClick="return mV(\'Ecc\',9,10);">Ec 9:10</a>). The deceased are unable to praise Yahweh (<a onClick="return mV(\'Psa\',6,5);">Ps 6:5</a>; <a onClick="return mV(\'Psa\',88,\'10-12\');">88:10-12</a>; <a onClick="return mV(\'Isa\',38,18);">Isa 38:18</a>; Baruch 2:17; Sirach 17:27,28). Nor does there seem to have been at first an anticipation of reward or punishment after death (<a onClick="return mV(\'Psa\',88,10);">Ps 88:10</a>; Sirach 41:4), probably because the shades were supposed to be lacking the organs by which either reward or punishment could be perceived; nevertheless they are still in the realm of God\'s power (<a onClick="return mV(\'1Sa\',2,6);">1Sa 2:6</a>; <a onClick="return mV(\'Psa\',86,13);">Ps 86:13</a>; <a onClick="return mV(\'Psa\',139,8);">139:8</a>; <a onClick="return mV(\'Pro\',15,11);">Pr 15:11</a>; <a onClick="return mV(\'Isa\',7,11);">Isa 7:11</a>; <a onClick="return mV(\'Hsa\',13,14);">Ho 13:14</a>; <a onClick="return mV(\'Amo\',9,2);">Am 9:2</a>; Tobit 13:2).<P>Gradually the possibility of a return of the departed was conceived (<a onClick="return mV(\'Gen\',5,24);">Ge 5:24</a>; <a onClick="return mV(\'2Ki\',13,21);">2Ki 13:21</a>; <a onClick="return mV(\'Psa\',49,15);">Ps 49:15</a>; <a onClick="return mV(\'Psa\',73,24);">73:24</a>; <a onClick="return mV(\'Psa\',86,13);">86:13</a>; <a onClick="return mV(\'Hsa\',13,14);">Ho 13:14</a>; The <span class="noTag">Wisdom of Solomon 3:1-7; 4:13,14; 6:18,19; 10:14</span>). Even here it is often more the idea of the immortality of the soul than that of the resurrection of the body, and some of these passages may be interpreted as allegorical expressions for a temporal rescue from great disaster (e. g. <a onClick="return mV(\'1Sa\',2,6);">1Sa 2:6</a>); nevertheless this interpretation presupposes the existence of a deliverance from the shadows of Sheol to a better life in the presence of Yahweh. Some passages refer clearly to such an escape at the end of the age (<a onClick="return mV(\'Dan\',12,2);">Da 12:2</a>; <a onClick="return mV(\'Isa\',26,19);">Isa 26:19</a>). Only very few of the Old Testament believers reached the sublime faith of Job (<a onClick="return mV(\'Job\',19,25,26);">19:25,26</a>) and none the blessed expectation taught in the New Testament, for none but Christ has "brought life and immortality to light" (<a onClick="return mV(\'2Ti\',1,10);">2Ti 1:10</a>; <a onClick="return mV(\'Jhn\',5,28,29);">Joh 5:28,29</a>).<P>The opinion that the dead or at least the newly buried could partake of the food which was placed in graves, a custom which recent excavations have clearly shown to have been almost universal in Palestine, and which is referred to in <a onClick="return mV(\'Deu\',26,14);">De 26:14</a> and Tobit 4:17, was soon doubted (Sirach 30:18), and food and drink prepared for the funeral was henceforth intended as the "bread of comfort" and the "cup of consolation" for the mourners (<a onClick="return mV(\'Jer\',16,7);">Jer 16:7</a>; <a onClick="return mV(\'2Sa\',3,35);">2Sa 3:35</a>; <a onClick="return mV(\'Eze\',24,17);">Eze 24:17</a>). Similarly the offering and burning of incense, originally an homage to the deceased, became a relief for the mourner (<a onClick="return mV(\'2Ch\',16,14);">2Ch 16:14</a>; <a onClick="return mV(\'2Ch\',21,19);">21:19</a>; <a onClick="return mV(\'Jer\',34,5);">Jer 34:5</a>). See also <span class="noTag">The Wisdom of Solomon 3:2; 7:6</span>; Sirach 38:23`<a href="./study/isbe/search.html?string=CORPSE">CORPSE</a>; <a href="./study/isbe/search.html??string=DEATH">DEATH</a>; <a href="./study/isbe/search.html??string=HADES">HADES</a>; <a href="./study/isbe/search.html??string=SHEOL">SHEOL</a>`106';
isbe[2596]='Deceit`de-set\' (mirmah; (dolos)): The intentional misleading or beguiling of another; in Scripture represented as a companion of many other forms of wickedness, as cursing (<a onClick="return mV(\'Psa\',10,7);">Ps 10:7</a>), hatred (<a onClick="return mV(\'Pro\',26,24);">Pr 26:24</a>), theft, covetousness, adultery, murder (<a onClick="return mV(\'Mar\',7,22);">Mr 7:22</a>; <a onClick="return mV(\'Rom\',1,29);">Ro 1:29</a>). The Revised Version (British and American) introduces the word in <a onClick="return mV(\'Pro\',14,25);">Pr 14:25</a>; <a onClick="return mV(\'2Th\',2,10);">2Th 2:10</a>; but in such passages as <a onClick="return mV(\'Psa\',55,11);">Ps 55:11</a>; <a onClick="return mV(\'Pro\',20,17);">Pr 20:17</a>; <a onClick="return mV(\'Pro\',26,26);">26:26</a>; <a onClick="return mV(\'1Th\',2,3);">1Th 2:3</a>, renders a variety of words, more accurately than the King James Version, by "oppression," "falsehood," "guile," "error."``1';
isbe[2597]='Deceivableness; Deceive`de-sev\'-a-b\'-l-nes, de-sev\' (nasha\', "to lead astray"): "The pride of thy heart hath deceived thee" (<a onClick="return mV(\'Jer\',49,16);">Jer 49:16</a>), i.e. "Thy stern mountain fastnesses have persuaded thee that thou art impregnable." In <a onClick="return mV(\'Jer\',20,7);">Jer 20:7</a>, "O Lord, thou hast deceived me, and I was deceived," pathah, signifies "to be enticed," "persuaded," as in the American Standard Revised Version and the Revised Version, margin.<P>In the Old Testament most often, and in the New Testament regularly, the various words rendered in the King James Version "deceive" denote some deliberate misleading in the moral or spiritual realm. False prophets (<a onClick="return mV(\'Jer\',29,8);">Jer 29:8</a>), false teachers (<a onClick="return mV(\'Eph\',5,6);">Eph 5:6</a>) and Satan himself (<a onClick="return mV(\'Rev\',12,9);">Re 12:9</a>) are deceivers in this sense. In the gospels, the King James Version "deceive" (planao, 9 times <a onClick="return mV(\'Mat\',24,4,5);">Mt 24:4,5</a> parallel <a onClick="return mV(\'Mar\',13,5,6);">Mr 13:5,6</a> parallel <a onClick="return mV(\'Luk\',21,8);">Lu 21:8</a>; <a onClick="return mV(\'Mat\',24,11,24);">Mt 24:11,24</a>; <a onClick="return mV(\'Jhn\',7,12,47);">Joh 7:12,47</a>) becomes in the Revised Version (British and American) "lead astray"; the same change is made in <a onClick="return mV(\'1Jo\',2,26);">1Joh 2:26</a>; <a onClick="return mV(\'1Jo\',3,7);">3:7</a>; but elsewhere (13 times) both the King James Version and the Revised Version (British and American) render planao by "deceive."<P>"Deceivableness" (apate), only in <a onClick="return mV(\'2Th\',2,10);">2Th 2:10</a>, signifies power to deceive, not liability to deception; the Revised Version (British and American) "deceit."``57';
isbe[2598]='Decently`de\'-sent-li (euschemonos): Only once is this word found in our English Bible (<a onClick="return mV(\'1Cr\',14,40);">1Co 14:40</a>). It is in the last verse of that remarkable chapter on the proper use of spiritual gifts in the church and the proper conduct of public worship. It does not refer here to absence of impurity or obscenity. It rather refers to good order in the conduct of public worship. All things that are done and said in public worship are to be in harmony with that becoming and reverent spirit and tone that befit the true worshippers of God.``1';
isbe[2599]='Decision`de-sizh\'-un: Has several different shades of meaning. It expresses the formation of a judgment on a matter under consideration. It expresses the quality of being firm or positive in one\'s actions. It expresses the termination of a contest or question in favor of one side or the other, as the decision of the battle, or the decision of the judge.<P>1. National Decisions:<P>Until recent times the decision of disputed points between nations was determined by force of arms. Thus the questions of dispute were decided between Israel and the surrounding tribes, between Israel and Assyria, between Israel and Egypt, and later between Judea and Rome.<P>2. Judicial Decisions:<P>In the earliest times the questions of dispute between individuals were decided by the patriarch who was the head of the family. When Israel became a nation men were appointed to decide the difficulties between the people. At first this was one of the most important duties of Moses, but when the task became too great he appointed judges to assist him (see <a onClick="return mV(\'Exd\',18,\'13-26\');">Ex 18:13-26</a>). One important function of those who are called judges was to decide the difficulties between the people (see <a onClick="return mV(\'Jdg\',4,4,5);">Jud 4:4,5</a>). The kings also decided questions of dispute between individuals (see <a onClick="return mV(\'2Sa\',15,\'1-6\');">2Sa 15:1-6</a>; <a onClick="return mV(\'1Ki\',3,\'16-28\');">1Ki 3:16-28</a>). As the people developed in their national ideals the decisions in judicial matters were rendered by councils appointed for that purpose.<P>3. Methods of Forming Decisions:<P>Perplexing questions were many times decided by the casting of lots. The people believed that God would in this way direct them to the right decision (<a onClick="return mV(\'Pro\',16,33);">Pr 16:33</a>; <a onClick="return mV(\'Jos\',7,\'10-21\');">Jos 7:10-21</a>; <a onClick="return mV(\'Jos\',14,2);">14:2</a>; <a onClick="return mV(\'1Sa\',10,20);">1Sa 10:20</a>f). Casting lots must have been a common method of deciding perplexing questions (see <a onClick="return mV(\'1Sa\',14,41,42);">1Sa 14:41,42</a>; <a onClick="return mV(\'Jon\',1,7);">Jon 1:7</a>). It was resorted to by the apostles to decide which of the two men they had selected should take the place of Judas (<a onClick="return mV(\'Act\',1,\'21-26\');">Ac 1:21-26</a>). The custom gradually lost in favor, and decisions, even of perplexing questions, were formed by considering all the facts.`<a href="./study/isbe/search.html?string=AUGURY">AUGURY</a>; <a href="./study/isbe/search.html??string=LOTS">LOTS</a>`62';
