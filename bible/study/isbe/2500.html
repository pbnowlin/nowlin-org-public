isbe[2523]='Dandle`dan\'-d\'-l. (sha\'-osha\', a Pulpal form, from root (sha\'-a\') with sense of to "be caressed"). Occurs in <a onClick="return mV(\'Isa\',66,12);">Isa 66:12</a>, "shall be dandled upon the knees."``1';
isbe[2524]='Danger`dan\'-jer: Danger does not express a state of reality but a possibility. In <a onClick="return mV(\'Mat\',5,21);">Mt 5:21</a>f; however, and also the King James Version <a onClick="return mV(\'Mar\',3,29);">Mr 3:29</a> (the Revised Version (British and American)) "but is guilty of an eternal sin"the expression "danger" refers to a certainty, for the danger spoken of is in one case judgment which one brings upon himself, and in the other the committing of an unpardonable sin. Both are the necessary consequences of a man\'s conduct. The reason for translating the Greek (enochos, literally, "to be held in anything so one cannot escape") by "is in danger," instead of "guilty" or "liable," may be due to the translator\'s conception of these passages as a warning against such an act rather than as a statement of the judgment which stands pronounced over every man who commits the sin.``16';
isbe[2525]='Daniel`dan\'-yel (daniye\'l, dani\'-el, "God is my judge"; Daniel):<P>(1) One of the sons of David (<a onClick="return mV(\'1Ch\',3,1);">1Ch 3:1</a>).<P>(2) A Levite of the family of Ithamar (<a onClick="return mV(\'Ezr\',8,2);">Ezr 8:2</a>; <a onClick="return mV(\'Neh\',10,6);">Ne 10:6</a>).<P>(3) A prophet of the time of Nebuchadnezzar and Cyrus, the hero and author of the Book of Daniel.<P>1. Early Life:<P>We know nothing of the early life of Daniel, except what is recorded in the book bearing his name. Here it is said that he was one of the youths of royal or noble seed, who were carried captive by Nebuchadnezzar in the third year of Jehoiakim, king of Judah. These youths were without blemish, well-favored, skillful in all wisdom, endued with knowledge, and understanding science, and such as had ability to stand in the king\'s palace. The king commanded to teach them the knowledge and tongue of the Chaldeans; and appointed for them a daily portion of the king\'s food and of the wine which he drank. After having been thus nourished for three years, they were to stand before the king. Ashpenaz, the master or chief of the eunuchs, into whose hands they had been entrusted, following a custom of the time, gave to each of these youths a new and Babylonian name. To Daniel, he gave the name Belteshazzar.<P>In Babylonian this name was probably Belu-lita-sharri-usur, which means "O Bel, protect thou the hostage of the king," a most appropriate name for one in the place which Daniel occupied as a hostage of Jehoiakim at the court of the king of Babylon. The youths were probably from 12 to 15 years of age at the time when they were carried captive. (For changes of names, compare Joseph changed to Zaphenath-paneah (<a onClick="return mV(\'Gen\',41,45);">Ge 41:45</a>); Eliakim, to Jehoiakim (<a onClick="return mV(\'2Ki\',23,34);">2Ki 23:34</a>); Mattaniah, to Zedekiah (<a onClick="return mV(\'2Ki\',24,17);">2Ki 24:17</a>); and the two names of the high priest Johanan\'s brother in the Sachau Papyri, i.e. Ostan and Anani.)<P>Having purposed in his heart that he would not defile himself with the food and drink of the king, Daniel requested of Ashpenaz permission to eat vegetables and drink water. Through the favor of God, this request was granted, notwithstanding the fear of Ashpenaz that his head would be endangered to the king on account of the probably resulting poor appearance of the youths living upon this blood-diluting diet, in comparison with the expected healthy appearance of the others of their class. However, ten days\' trial having been first granted, and at the end of that time their countenances having been found fairer and their flesh fatter than the other youths\', the permission was made permanent; and God gave to Daniel and his companions knowledge and skill in all learning and wisdom, and to Daniel understanding in all visions and dreams; so that at the end of the three years when the king communed with them, he found them much superior to all the magicians and enchanters in every matter of wisdom and understanding.<P>2. Dream-Interpreter:<P>Daniel\'s public activities were in harmony with his education. His first appearance was as an interpreter of the dream recorded in <a onClick="return mV(\'Dan\',2,1);">Da 2</a>. Nebuchadnezzar having seen in his dream a vision of a great image, excellent in brightness and terrible in appearance, its head of fine gold, its breast and its arms of silver, its belly and its thighs of brass, its legs of iron, its feet part of iron and part of clay, beheld a stone cut out without hands smiting the image and breaking it in pieces, until it became like chaff and was carried away by the wind; while the stone that smote the image became a great mountain and filled the whole earth. When the king awoke from his troubled sleep, he forgot, or reigned that he had forgotten, the dream, and summoned the wise men of Babylon both to tell him the dream and to give the interpretation thereof. The wise men having said that they could not tell the dream, nor interpret it as long as it was untold, the king threatened them with death. Daniel, who seems not to have been present when the other wise men were before the king, when he was informed of the threat of the king, and that preparations were being made to slay all of the wise men of Babylon, himself and his three companions included, boldly went in to the king and requested that he would appoint a time for him to appear to show the interpretation, Then he went to his house, and he and his companions prayed, and the dream and its interpretation were made known unto Daniel. At the appointed time, the dream was explained and the four Hebrews were loaded with wealth and given high positions in the service of the king. In the 4th chapter, we have recorded Daniel\'s interpretation of the dream of Nebuchadnezzar about the great tree that was hewn at the command of an angel, thus prefiguring the insanity of the king.<P>3. Interpreter of Signs: Daniel\'s third great appearance in the book is in chapter 5, where he is called upon to explain the extraordinary writing upon the wall of Belshazzar\'s palace, which foretold the end of the Babylonian empire and the incoming of the Medes and Persians. For this service Daniel was clothed with purple, a chain of gold put around his neck, and he was made the third ruler in the kingdom.<P>4. Seer of Visions:<P>Daniel, however, was not merely an interpreter of other men\'s visions. In the last six chapters we have recorded four or five of his own visions, all of which are taken up with revelations concerning the future history of the great world empires, especially in their relation to the people of God, and predictions of the final triumph of the Messiah\'s kingdom.<P>5. Official of the Kings:<P>In addition to his duties as seer and as interpreter of signs and dreams, Daniel also stood high in the governmental service of Nebuchadnezzar, Belshazzar, and Darius the Mede, and perhaps also of Cyrus. The Book of Daniel, our only reliable source of information on this subject, does not tell us much about his civil duties and performances. It does say, however, that he was chief of the wise men, that he was in the gate of the king, and that he was governor over the whole province of Babylon under Nebuchadnezzar; that Belshazzar made him the third ruler in his kingdom; and that Darius made him one of the three presidents to whom his hundred and twenty satraps were to give account; and that he even thought to set him over his whole kingdom. In all of these positions he seems to have conducted himself with faithfulness and judgment.<P>While in the service of Darius the Mede, he aroused the antipathy of the other presidents and of the satraps. Unable to find any fault with his official acts, they induced the king to make a decree, apparently general in form and purpose, but really aimed at Daniel alone. They saw that they could find no valid accusation against him, unless they found it in connection with something concerning the law of his God. They therefore caused the king to make a decree that no one should make a request of anyone for the space of thirty days, save of the king. Daniel, having publicly prayed three times a day as he was in the habit of doing, was caught in the act, accused, and on account of the irrevocability of a law of the Medes and Persians, was condemned in accordance with the decree to be cast into a den of lions. The king was much troubled at this, but was unable to withhold the punishment. However, he expressed to Daniel his belief that his God in whom he trusted continually would deliver him; and so indeed it came to pass. For in the morning, when the king drew near to the mouth of the den, and called to him, Daniel said that God had sent His angel and shut the mouths of the lions. So Daniel was taken up unharmed, and at the command of the king his accusers, having been cast into tile den, were destroyed before they reached the bottom.<P>LITERATURE.<P>Besides the commentaries and other works mentioned in the article on the Book of Daniel, valuable information may be found in Josephus and in Payne Smith\'s Lectures on Daniel.``196';
isbe[2526]='Daniel, Book of`dan\'-yel:<P><b>I. NAME</b><P><b>II. PLACE IN THE CANON <p><b>III. DIVISIONS OF THE BOOK</b><P><b>IV. LANGUAGES</b><P>V. PURPOSE OF THE BOOK</b><P><b>VI. UNITY</b><P><b>VII. GENUINENESS</b><P class="in15">1. The Predictions<P class="in15">2. The Miracles<P class="in15">3. The Text<P class="in15">4. The Language<P class="in15">5. The Historical Statements<P><b>VIII. INTERPRETATION</b><P><b>IX. DOCTRINES</b><P class="in15">Commentaries and Introductions<P><b>X. APOCRYPHAL ADDITIONS</b><P><b>LITERATURE</b><hr /><P>I. Name.<P>The Book of Daniel is rightly so called, whether we consider Daniel as the author of it, or as the principal person mentioned in it.<P>II. Place in the Canon.<P>In the English Bible, Daniel is placed among the Major Prophets, immediately after Ezekiel, thus following the order of the Septuagint and of the Latin Vulgate (Jerome\'s Bible, 390-405 A. D.) In the Hebrew Bible, however, it is placed in the third division of the Canon, called the Kethuvim or writings, by the Hebrews, and the hagiographa, or holy writings, by the Seventy. It has been claimed, that Daniel was placed by the Jews in the third part of the Canon, either because they thought the inspiration of its author to be of a lower kind than was that of the other prophets, or because the book was written after the second or prophetical part of the Canon had been closed. It is more probable, that the book was placed in this part of the Hebrew Canon, because Daniel is not called a nabhi\' ("prophet"), but was rather a chozeh ("seer") and a chakham ("wise man"). None but the works of the nebhi\'im were put in the second part of the Jewish Canon, the third being reserved for the heterogeneous works of seers, wise men, and priests, or for those that do not mention the name or work of a prophet, or that are poetical in form. A confusion has arisen, because the Greek word prophet is used to render the two Hebrew words nabhi\' and chozeh. In the Scriptures, God is said to speak to the former, whereas the latter see visions and dream dreams. Some have attempted to explain the position of Daniel by assuming that he had the prophetic gift without holding the prophetic office. It must be kept in mind that all reasons given to account for the order and place of many of the books in the Canon are purely conjectural, since we have no historical evidence bearing upon the subject earlier than the time of Jesus ben Sirach, who wrote probably about 180 BC.<P>III. Divisions of the Book.<P>According to its subject-matter, the book falls naturally into two great divisions, each consisting of six chapters, the first portion containing the historical sections, and the second the apocalyptic, or predictive, portions; though the former is not devoid of predictions, nor the latter of historical statements. More specifically, the first chapter is introductory to the whole book; <a onClick="return mV(\'Dan\',2,\'1-\');">Da 2-6</a> describe some marvelous events in the history of Daniel and his three companions in their relations with the rulers of Babylon; and chapters <a onClick="return mV(\'Dan\',7,\'1-\');">7-12</A> narrate some visions of Daniel concerning the great world-empires, especially in relation to the kingdom of God.<P>According to the languages in which the book is written, it may be divided into the Aramaic portion, extending from <a onClick="return mV(\'Dan\',2,\'4-\');">Da 2:4</a> to the end of chapter 7, and a Hebrew portion embracing the rest of the book.<P>IV. Languages.<P>The language of the book is partly Hebrew and partly a dialect of Aramaic, which has been called Chaldee, or Biblical Aramaic This Aramaic is almost exactly the same as that which is found in portions of Ezra. On account of the large number of Babylonian and Persian words characteristic of this Aramaic and of that of the papyri recently found in Egypt, as well as on account of the general similarity of the nominal, verbal and other forms, and of the syntactical construction, the Aramaic of this period might properly be called the Babylonian-Persian Aramaic With the exception of the sign used to denote the sound "dh," and of the use of qoph in a few cases where Daniel has \'ayin, the spelling in the papyri is the same in general as that in the Biblical books. Whether the change of spelling was made at a later time in the manuscripts of Daniel, or whether it was a peculiarity of the Babylonian Aramaic as distinguished from the Egyptian or whether it was due to the unifying, scientific genius of Daniel himself, we have no means at present to determine.<P>In view of the fact that the Elephantine Papyri frequently employ the "d" sign to express the "dh" sound, and that it is always employed in Ezra to express it; in view further of the fact that the "z" sign is found as late as the earliest Nabatean inscription, that of 70 BC (see Euting, 349: 1,2,4) to express the "dh" sound, it seems fatuous to insist on the ground of the writing of these two sounds in the Book of Daniel, that it cannot have been written in the Persian period. As to the use of qoph and \'ayin for the Aramaic sound which corresponds to the Hebrew tsadhe when equivalent to an Arabic dad, any hasty conclusion is debarred by the fact that the Aramaic papyri of the 5th century BC, the manuscripts of the Samaritan Targum and the Mandaic manuscripts written from 600 to 900 AD all employ the two letters to express the one sound. The writing of \'aleph and he without any proper discrimination occurs in the papyri as well as in Daniel.<P>The only serious objection to the early date of upon the ground of its spelling is that which is based upon the use of a final "n" in the pronominal suffix of the second and third persons masculine plural instead of the margin of the Aramaic papyri and of the Zakir and Sendschirli inscriptions. It is possible that was influenced in this by the corresponding forms of the Babylonian language. The Syriac and Mandaic dialects of the Aramaic agree with the Babylonian in the formation of the pronominal suffixes of the second and third persons masculine plural, as against the Hebrew, Arabic, Minaean, Sabean and Ethiopic. It is possible that the occurrence of "m" in some west Aramaic documents may have arisen through the influence of the Hebrew and Phoenician, and that pure Aramaic always had "n" just as we find it in Assyrian and Babylonian, and in all east Aramaic documents thus far discovered.<P>The supposition that the use of "y" in Daniel as a preformative of the third person masculine of the imperfect proves a Palestinian provenience has been shown to be untenable by the discovery that the earliest east Syriac also used "y". (See M. Pognon, Inscriptions semitiques, premiere partie, 17.)<P>This inscription is dated 73 AD. This proof that in the earlier stages of its history the east Aramaic was in this respect the same as that found in Daniel is confirmed by the fact that the forms of the 3rd person of the imperfect found in the proper names on the Aramaic dockets of the Assyrian inscriptions also have the preformative y. (See Corpus Inscriptionum Semiticarum, II, 47.)<P>V. Purpose of the Book.<P>The book is not intended to give an account of the life of Daniel. It gives neither his lineage, nor his age, and recounts but a few of the events of his long career. Nor is it meant to give a record of the history of Israel during the exile, nor even of the captivity in Babylon. Its purpose is to show how by His providential guidance, His miraculous interventions, His foreknowledge and almighty power, the God of heaven controls and directs the forces of Nature and the history of nations, the lives of Hebrew captives and of the mightiest of the kings of the earth, for the accomplishment of His Divine and beneficent plans for His servants and people.<P>VI. Unity.<P>The unity of the book was first denied by Spinoza, who suggested that the first part was taken from the chronological works of the Chaldeans, basing his supposition upon the difference of language between the former and latter parts. Newton followed Spinoza in suggesting two parts, but began his second division with <a onClick="return mV(\'Dan\',7,\'1-\');">Da 7</a>, where the narrative passes over from the 3rd to the 1st person. Kohler follows Newton, claiming, however, that the visions were written by the Daniel of the exile, but that the first 6 chapters were composed by a later writer who also redacted the whole work. Von Orelli holds that certain prophecies of Daniel were enlarged and interpolated by a Jew living in the time of Antiochus Epiphanes, in order to show his contemporaries the bearing of the predictions of the book upon those times of oppression. Zockler and Lange hold to the unity of the book in general; but the former thought that <a onClick="return mV(\'Dan\',11,\'5-45\');">Da 11:5-45</a> is an interpolation; and the latter, that <a onClick="return mV(\'Dan\',10,\'1\');">10:1</a>-<a onClick="return mV(\'Dan\',11,\'1-44\');">11:44</a> and <a onClick="return mV(\'Dan\',12,\'5-13\');">12:5-13</A> have been inserted in the original work. Meinhold holds that the Aramaic portions existed as early as the times of Alexander the Great—a view to which Strack also inclines. Eichhorn held that the book consisted of ten different original sections, which are bound together merely by the circumstance that they are all concerned with Daniel and his three friends. Finally, De Lagarde, believing that the fourth kingdom was the Roman, held that <a onClick="return mV(\'Dan\',7,\'1-\');">Da 7</a> was written about 69 AD. (For the best discussion of the controversies about the unity of Daniel, see Eichhorn, Einleitung, sections 612-19, and Buhl in See Hauck-Herzog, Realencyklopadie fur protestantische Theologie und Kirche, IV, 449-51.)<P>VII. Genuineness.<P>With the exception of the neo-Platonist Porphyry, a Greek non-Christian philosopher of the 3rd century AD, the genuineness of the Book of Daniel was denied by no one until the rise of the deistic movement in the 17th century. The attacks upon the genuineness of the book have been based upon:<P class="in15">(1) the predictions,<P class="in15">(2) the miracles,<P class="in15">(3) the text,<P class="in15">(4) the language,<P class="in15">(5) the historical statements.<P>1. The Predictions:<P>The assailants of the genuineness of Daniel on the ground of the predictions found therein, may be divided into two classes—those who deny prediction in general, and those who claim that the apocalyptic character of the predictions of Daniel is a sufficient proof of their lack of genuineness. The first of these two classes includes properly those only who deny not merely Christianity, but theism; and the answering of them may safely be left to those who defend the doctrines of theism, and particularly of revelation. The second class of assailants is, however, of a different character, since it consists of those who are sincere believers in Christianity and predictive prophecy.<P>They claim, however, that certain characteristics of definiteness and detail, distinguishing the predictive portions of the Book of Daniel from other predictions of the Old Testament, bring the genuineness of Daniel into question. The kind of prediction found here, ordinarily called apocalyptic, is said to have arisen first in the 2nd century BC, when parts of the Book of Enoch and of the Sibylline Oracles were written; and a main characteristic of an apocalypse is said to be that it records past events as if they were still future, throwing the speaker back into some distant past time, for the purpose of producing on the reader the impression that the book contains real predictions, thus gaining credence for the statements of the writer and giving consolation to those who are thus led to believe in the providential foresight of God for those who trust in Him.<P>Since those who believe that God has spoken unto man by His Son and through the prophets will not be able to set limits to the extent and definiteness of the revelations which He may have seen fit to make through them, nor to prescribe the method, style, time and character of the revelations, this attack on the genuineness of Daniel may safely be left to the defenders of the possibility and the fact of a revelation. One who believes in these may logically believe in the genuineness of Daniel, as far as this objection goes. That there are spurious apocalypses no more proves that all are spurious than that there are spurious gospels or epistles proves that there are no genuine ones.<P>The spurious epistles of Philaris do not prove that Cicero\'s Letters are not genuine; nor do the false statements of 2Macc, nor the many spurious Acts of the Apostles, prove that 1Macc or Luke\'s Acts of the Apostles is not genuine. Nor does the fact that the oldest portions of the spurious apocalypses which have been preserved to our time are thought to have been written in the 2nd century BC, prove that no apocalypses, either genuine or spurious, were written before that time. There must have been a beginning, a first apocalypse, at some time, if ever. Besides, if we admit that the earliest parts of the Book of Enoch and of the Sibylline Oracles were written about the middle of the 2nd century BC, whereas the Book of Esdras was written about 300 AD, 450 years later, we can see no good literary reason wh Daniel may not have antedated Enoch by 350 years. The period between 500 BC and 150 BC is so almost entirely devoid of all known Hebrew literary productions as to render it exceedingly precarious for anyone to express an opinion as to what works may have characterized that long space of time.<P>2. The Miracles:<P>Secondly, as to the objections made against the Book of Daniel on the ground of the number or character of the miracles recorded, we shall only say that they affect the whole Christian system, which is full of the miraculous from beginning to end. If we begin to reject the books of the Bible because miraculous events are recorded in them, where indeed shall we stop?<P>3. The Text:<P>Thirdly, a more serious objection, as far as Daniel itself is concerned, is the claim of Eichhorn that the original text of the Aramaic portion has been so thoroughly tampered with and changed, that we can no longer get at the genuine original composition. We ourselves can see no objection to the belief that these Aramaic portions were written first of all in Hebrew, or even, if you will, in Babylonian; nor to the supposition that some Greek translators modified the meaning in their version either intentionally, or through a misunderstanding of the original. We claim, however, that the composite Aramaic of Daniel agrees in almost every particular of orthography, etymology and syntax, with the Aramaic of the North Semitic inscriptions of the 9th, 8th and 7th centuries BC and of the Egyptian papyri of the 5th century BC, and that the vocabulary of Daniel has an admixture of Hebrew, Babylonian and Persian words similar to that of the papyri of the 5th century BC; whereas, it differs in composition from the Aramaic of the Nabateans, which is devoid of Persian, Hebrew, and Babylonian words, and is full of Arabisms, and also from that of the Palmyrenes, which is full of Greek words, while having but one or two Persian words, and no Hebrew or Babylonian. As to different recensions, we meet with a similar difficulty in Jeremiah without anyone\'s impugning on that account the genuineness of the work as a whole. As to interpolations of verses or sections, they are found in the Samaritan recension of the Hebrew text and in the Samaritan and other Targums, as also in certain places in the text of the New Testament, Josephus and many other ancient literary works, without causing us to disbelieve in the genuineness of the rest of their works, or of the works as a whole.<P>4. The Language:<P>Fourthly, the objections to the genuineness of Daniel based on the presence in it of three Greek names of musical instruments and of a number of Persian words do not seem nearly as weighty today as they did a hundred years ago. The Greek inscriptions at Abu Simbal in Upper Egypt dating from the time of Psamtek II in the early part of the 6th century BC, the discovery of the Minoan inscriptions and ruins in Crete, the revelations of the wide commercial relations of the Phoenicians in the early part of the 1st millennium BC, the lately published inscriptions of Sennacherib about his campaigns in Cilicia against the Greek seafarers to which Alexander Poly-histor and Abydenus had referred, telling about his having carried many Greeks captive to Nineveh about 700 BC, the confirmation of the wealth and expensive ceremonies of Nebuchadnezzar made by his own building and other inscriptions, all assure us of the possibility of the use of Greek musical instruments at Babylon in the 6th century BC. This, taken along with the well-known fact that names of articles of commerce and especially of musical instruments go with the thing, leave no room to doubt that a writer of the 6th century BC may have known and used borrowed Greek terms. The Arameans being the great commercial middlemen between Egypt and Greece on the one hand and Babylon and the Orient on the other, and being in addition a subject people, would naturally adopt many foreign words into their vocabulary.<P>As to the presence of the so-called Persian words in Daniel, it must be remembered that many words which were formerly considered to be such have been found to be Babylonian. As to the others, perhaps all of them may be Median rather than Persian; and if so, the children of Israel who were carried captive to the cities of the Medes in the middle of the 8th century BC, and the, Arameans, many of whom were subject to the Medes, at least from the time of the fall of Nineveh about 607 BC, may well have adopted many words into their vocabulary from the language of their rulers. Daniel was not writing merely for the Jews who had been carried captive by Nebuchadnezzar, but for all Israelites throughout the world. Hence, he would properly use a language which his scattered readers would understand rather than the purer idiom of Judea. Most of his foreign terms are names of officials, legal terms, and articles of clothing, for which there were no suitable terms existing in the earlier Hebrew or Aramaic There was nothing for a writer to do but to invent new terms, or to transfer the current foreign words into his native language. The latter was the preferable method and the one which he adopted.<P>5. The Historical Statements:<P>Fifthly, objections to the genuineness of the Book of Daniel are made on the ground of the historical misstatements which are said to be found in it. These may be classed as:<P class="in15">(1) chronological,<P class="in15">(2) geographical, and<P class="in15">(3) various.<P>(1) Chronological Objections.<P>The first chronological objection is derived from <a onClick="return mV(\'Dan\',1,1);">Da 1:1</a>, where it is said that Nebuchadnezzar made an expedition against Jerusalem in the 3rd year of Jehoiakim, whereas Jeremiah seems to imply that the expedition was made in the 4th year of that king. As Daniel was writing primarily for the Jews of Babylon, he would naturally use the system of dating that was employed there; and this system differed in its method of denoting the 1st year of a reign from that used by the Egyptians and by the Jews of Jerusalem for whom Jeremiah wrote.<P>The second objection is derived from the fact that Daniel is said (<a onClick="return mV(\'Dan\',1,21);">Da 1:21</a>) to have lived unto the 1st year of Cyrus the king, whereas in <a onClick="return mV(\'Dan\',10,1);">Da 10:1</a> he is said to have seen a vision in the 3rd year of Cyrus, king of Persia. These statements are easily reconciled by supposing that in the former case it is the 1st year of Cyrus as king of Babylon, and in the second, the 3rd year of Cyrus as king of Persia.<P>The third chronological objection is based on <a onClick="return mV(\'Dan\',6,28);">Da 6:28</a>, where it is said that Daniel prospered in the kingdom of Darius and in the kingdom of Cyrus the Persian. This statement is harmonized with the facts revealed by the monuments and with the statements of the book itself by supposing that Darius reigned synchronously with Cyrus, but as sub-king under him.<P>The fourth objection is based on <a onClick="return mV(\'Dan\',8,1);">Da 8:1</a>, where Daniel is said to have seen a vision in the third year of Belshazzar the king. If we suppose that Belshazzar was king of the Chaldeans while his father was king of Babylon, just as Cambyses was king of Babylon while his father, Cyrus, was king of the lands, or as Nabonidus II seems to have been king of Harran while his father, Nabonidus I, was king of Babylon, this statement will harmonize with the other statements made with regard to Belshazzar.<P>(2) Geographical Objections.<P>As to the geographical objections, three only need be considered as important. The first is, that Shushan seems to be spoken of in <a onClick="return mV(\'Dan\',7,2);">Da 7:2</a> as subject to Babylon, whereas it is supposed by some to have been at that time subject to Media. Here we can safely rest upon the opinion of Winckler, that at the division of the Assyrian dominions among the allied Medes and Babylonians, Elam became subject to Babylon rather than to Media. If, however, this opinion could be shown not to be true, we must remember that Daniel is said to have been at ShuShan in a vision. The second geographical objection is based on the supposition that Nebuchadnezzar would not have gone against Jerusalem, leaving an Egyptian garrison at Carchemish in his rear, thus endangering his line of communication and a possible retreat to Babylon. This objection has no weight, now that the position of Carchemish has been shown to be, not at Ciressium, as formerly conjectured, but at Jirabis, 150 miles farther up the Euphrates. Carchemish would have cut off a retreat to Nineveh, but was far removed from the direct line of communication with Babylon. The third geographical objection is derived from the statement that Darius placed 120 satraps in, or over, all his kingdom. The objection rests upon a false conception of the meaning of satrap and of the extent of a satrapy, there being no reason why a sub-king under Darius may not have had as many satraps under him as Sargon of Assyria had governors and deputies under him; and the latter king mentions 117 peoples and countries over which he appointed his deputies to rule in his place.<P>(3) Other Objections.<P>Various other objections to the genuineness of Daniel have been made, the principal being those derived from the supposed non-existence of Kings Darius the Mede and Belshazzar the Chaldean, from the use of the word Chaldean to denote the wise men of Babylon, and from the silence of other historical sources as to many of the events recorded in Daniel. The discussion of the existence of Belshazzar and Darius the Mede will be found under <a href="./study/isbe/search.html?string=BELSHAZZAR">BELSHAZZAR</a> and <a href="./study/isbe/search.html?string=DARIUS">DARIUS</a>. As to the argument from silence in general, it may be said that it reduces itself in fact to the absence of all reference to Daniel on the monuments, in the Book of Ecclus, and in the post-exilic literature. As to the latter books it proves too much; for Haggai, Zechariah, and Malachi, as well as Ezra, Nehemiah, and Esther, refer to so few of the older canonical books and earlier historical persons and events, that it is not fair to expect them to refer to Daniel—at least, to use their not referring to him or his book as an argument against the existence of either before the time when they were written.<P>As to Ecclesiasticus, we might have expected him to mention Daniel or the So of Three Children; but who knows what reasons Ben Sira may have had for not placing them in his list of Hebrew heroes? Perhaps, since he held the views which later characterized the Sadducees, he may have passed Daniel by because of his views on the resurrection and on angels. Perhaps he failed to mention any of the four companions because none of their deeds had been wrought in Palestine; or because their deeds exalted too highly the heathen monarchies to which the Jews were subject. Or, more likely, the book may have been unknown to him, since very few copies at best of the whole Old Testament can have existed in his time, and the Book of Daniel may not have gained general currency in Palestine before it was made so preeminent by the fulfillment of its predictions in the Maccabean times.<P>It is not satisfactory to say that Ben Sira did not mention Daniel and his companions, because the stories concerning them had not yet been imbedded in a canonical book, inasmuch as he does place Simon, the high priest, among the greatest of Israel\'s great men, although he is not mentioned in any canonical book. In conclusion, it may be said, that while it is impossible for us to determine why Ben Sira does not mention Daniel and his three companions among his worthies, if their deeds were known to him, it is even more impossible to understand how these stories concerning them cannot merely have arisen but have been accepted as true, between 180 BC, when Ecclesiasticus is thought to have been written, and 169 BC, when, according to 1Maccabees, Matthias, the first of the Asmoneans, exhorted his brethren to follow the example of the fortitude of Ananias and his friends. As to the absence of all mention of Daniel on the contemporary historical documents of Babylon and Persia, such mention is not to be expected, inasmuch as those documents give the names of none who occupied positions such as, or similar to, those which Daniel is said to have filled.<P>VIII. Interpretation.<P>Questions of the interpretation of particular passages may be looked for in the commentaries and special works. As to the general question of the kind of prophecy found in the Book of Daniel, it has already been discussed above under the caption of "Genuineness." As to the interpretation of the world monarchies which precede the monarchy of the Messiah Prince, it may be said, however, that the latest discoveries, ruling out as they do a separate Median empire that included Babylon, support the view that the four monarchies are the Babylonian, the Persian, the Greek, and the Roman. According to this view, Darius the Mede was only a sub-king under Cyrus the Persian. Other interpretations have been made by selecting the four empires from those of Assyria, Babylonia, Media, Persia, Medo-Persia, Alexander, the Seleucids, the Romans, and the Mohammedans. The first and the last of these have generally been excluded from serious consideration. The main dispute is as to whether the 4th empire was that of the Seleucids, or that of the Romans, the former view being held commonly by those who hold to the composition of in the 2nd century BC, and the latter by those who hold to the traditional view that it was written in the 6th century BC.<P>IX. Doctrines.<P>It is universally admitted that the teachings of Daniel with regard to angels and the resurrection are more explicit than those found elsewhere in the Old Testament. As to angels, Daniel attributes to them names, ranks, and functions not mentioned by others. It has become common in certain quarters to assert that these peculiarities of Daniel are due to Persian influences. The Babylonian monuments, however, have revealed the fact that the Babylonians believed in both good and evil spirits with names, ranks, and different functions. These spirits correspond in several respects to the Hebrew angels, and may well have afforded Daniel the background for his visions. Yet, in all such matters, it must be remembered that Daniel purports to give us a vision, or revelation; and a revelation cannot be bound by the ordinary laws of time and human influence.<P>As to the doctrine of the resurrection, it is generally admitted that Daniel adds some new and distinct features to that which is taught in the other canonical books of the Old Testament. But it will be noted that he does not dwell upon this doctrine, since he mentions it only in <a onClick="return mV(\'Dan\',12,2);">Da 12:2</a>. The materials for his doctrine are to be found in <a onClick="return mV(\'Isa\',26,14);">Isa 26:14,21</a> and <a onClick="return mV(\'Isa\',66,24);">66:24</a>; <a onClick="return mV(\'Eze\',37,\'1-14\');">Eze 37:1-14</a>, and in <a onClick="return mV(\'Job\',14,12);">Job 14:12</a>; <a onClick="return mV(\'Job\',19,25);">19:25</a>; <a onClick="return mV(\'Hsa\',6,2);">Ho 6:2</a>; <a onClick="return mV(\'1Ki\',17,4);">1Ki 17:4</a>; <a onClick="return mV(\'2Ki\',4,\'1-\');">2Ki 4</a> <a onClick="return mV(\'2Ki\',8,\'1-5\');">2Ki 8:1-5</a>, as well as in the use of the words for sleep and awakening from sleep, or from the dust, for everlasting life or everlasting contempt in <a onClick="return mV(\'Isa\',26,19);">Isa 26:19</a>; <a onClick="return mV(\'Psa\',76,6);">Ps 76:6</a>; <a onClick="return mV(\'Psa\',13,3);">13:3</a>; <a onClick="return mV(\'Psa\',127,2);">127:2</a>; <a onClick="return mV(\'Deu\',31,16);">De 31:16</a>; <a onClick="return mV(\'2Sa\',7,12);">2Sa 7:12</a>; <a onClick="return mV(\'1Ki\',1,21);">1Ki 1:21</a>; <a onClick="return mV(\'Job\',7,21);">Job 7:21</a>, and <a onClick="return mV(\'Jer\',20,11);">Jer 20:11</a>; <a onClick="return mV(\'Jer\',23,40);">23:40</a>. The essential ideas and phraseology of Daniel\'s teachings are found in Isaiah, Jeremiah, and Ezekiel. The first two parts of the books of Enoch and 2Maccabees make much of the resurrection; but on the other hand, Ecclesiastes seems to believe not even in the immortality of the soul, and Wisdom and 1Maccabees do not mention a resurrection of the body. That the post-exilic prophets do not mention a resurrection does not prove that they knew nothing about Daniel any more than it proves that they knew nothing about Isaiah, Jeremiah, and Ezekiel.<P>There are resemblances, it is true, between the teachings of Daniel with regard to the resurrection and those of the Avesta. But so are there between his doctrines and the ideas of the Egyptians, which had existed for millenniums before his time. Besides there is no proof of any derivation of doctrines from the Persians by the writers of the canonical books of the Jews; and, as we have seen above, both the ideas and verbiage of Daniel are to be found in the generally accepted early Hebrew literature. And finally, this attempt to find a natural origin for all Biblical ideas leaves out of sight the fact that the Scriptures contain revelations from God, which transcend the ordinary course of human development. To a Christian, therefore, there can be no reason for believing that the doctrines of Daniel may not have been promulgated in the 6th century BC.<P>Commentaries and Introductions:<P>The best commentaries on Daniel from a conservative point of view are those by Calvin, Moses Stuart, Keil, Zockler, Strong in Lange\'s Bibelwerk, Fuller in the Speaker\'s Commentary, Thomson in the Pulpit Commentary, and Wright, Daniel and His Critics. The best defenses of Daniel\'s authenticity and genuineness are Hengstenberg, Authenticity of the Book of Daniel, Tregelles, Defense of the Authenticity, Auberlen, The Prophecies of Daniel, Fuller, Essay on the Authenticity of Daniel, Pusey, Daniel the Prophet (still the best of all), C. H. H. Wright, Daniel and His Critics, Kennedy, The Book of Daniel from the Christian Standpoint, Joseph Wilson, Daniel, and Sir Robert Anderson, Daniel in the Critics\' Den. One should consult also Pinches, The Old Testament in the Light of the Historical Records of Assyria and Babylonia, Clay, Light on the Old Testament from Babel, and Orr, The Problem of the Old Testament. For English readers, the radical school is best represented by Driver in his Literature of the Old Testament and in his Daniel; by Bevan, The Book of Daniel; by Prince, Commentary on Daniel, and by Cornill in his Introduction to the Old Testament.<P>X. Apocryphal Additions.<P>In the Greek translations of Daniel three or four pieces are added which are not found in the original Hebrew or Aramaic text as it has come down to us. These are The Prayer of Azarias, The Song of the Three Children, Susanna, and Bel and the Dragon. These additions have all been rejected from the Canon by the Protestant churches because they are not contained in the Hebrew Canon. In the Church of England they are "read for example of life and instruction of manners." The Song of Three Children was "ordered in the rubric of the first Prayer Book of Edward VI (AD 1549) to be used in Lent as a responsory to the Old Testament Lesson at the Morning Prayer." It contains the Prayer of Azarias from the midst of the fiery furnace, and the song of praise by the three children for their deliverance; the latter being couched largely in phrases borrowed from <a onClick="return mV(\'Psa\',148,\'1-\');">Ps 148</a>.<P>Susanna presents to us the story of a virtuous woman who resisted the seductive attempts of two judges of the elders of the people, whose machinations were exposed through the wisdom of Daniel who convicted them of false witness by the evidence of their own mouth, so that they were put to death according to the law of Moses; and from that day forth Daniel was held in great reputation in the sight of the people. Bel and the Dragon contains three stories. The first relates how Daniel destroyed the image of Bel which Nebuchadnezzar worshipped, by showing by means of ashes strewn on the floor of the temple that the offerings to Bel were devoured by the priests who came secretly into the temple by night. The second tells how Daniel killed the Dragon by throwing lumps of mingled pitch, fat and hair into his mouth, so causing the Dragon to burst asunder. The third gives a detailed account of the lions\' den, stating that there were seven lions and that Daniel lived in the den six days, being sustained by broken bread and pottage which a prophet named Habakkuk brought to him through the air, an angel of the Lord having taken him by the arm and borne him by the hair of his head and through the vehemency of his spirit set him in Babylon over the den, into which he dropped the food for Daniel\'s use.<P>LITERATURE.<P>For commentaries on the additions to the Book of Daniel, see the works on Daniel cited above, and also The Apocrypha by Churton and others; the volume on the Apocrypha in Lange\'s Commentary by Bissell; "The Apocrypha" by Wace in the Speaker\'s Commentary, and Schurer, History of the Jewish People.``196';
isbe[2527]='Danites`dan\'-its (ha-dani): Occurs as describing those belonging to Dan in <a onClick="return mV(\'Jdg\',13,2);">Jud 13:2</a>; <a onClick="return mV(\'Jdg\',18,1,11);">18:1,11</a>; <a onClick="return mV(\'1Ch\',12,35);">1Ch 12:35</a>.``1';
isbe[2528]='Dannah`dan\'-a (dannah): One of the cities in the hill country of Judah (<a onClick="return mV(\'Jos\',15,49);">Jos 15:49</a>) between Socoh and Kiriath-sannah (Debir), probably Idhna—the Iedna of the Onom—8 miles west of Hebron. See PEF, III, 305, 330.``1';
isbe[2529]='Daphne`daf\'-ne (Daphne, "bay-tree"): A suburb of Antioch on the Orontes, according to Strabo and the Jerusalem itinerary, about 40 furlongs, or 5 miles distant. It is identified with Beit el-Ma\' on the left bank of the river, to the southwest of the city. Here were the famous grove and sanctuary of Apollo. The grove and shrine owed their origin to Seleucus Nicator. It was a place of great natural beauty, and the Seleucid kings spared no outlay in adding to its attractions. The precincts enjoyed the right of asylum. Hither fled Onias the high priest (171 BC) from the wrath of Menelaus whom he had offended by plain speech. To the disgust and indignation of Jew and Gentile alike, he was lured from the sanctuary by Andronicus and basely put to death (2Macc 4:33-38). It sheltered fugitives dyed with villainy of every shade. It was the great pleasure resort of the citizens of Antioch; and it gained an evil repute for immorality, as witnessed by the proverbial Daphnici mores. In Tiberim defluxit Orontes, says Juvenal (iii.62), indicating one main source of the corruption that demoralized the imperial city. The decline of Daphne dates from the days of Christian ascendancy in the reign of Julian. The place is still musical with fountains and luxuriant with wild vegetation; but nothing now remains to suggest its former splendor. See also Decline and Fall, chapter xxiii.`<a href="./study/isbe/search.html?string=ANTIOCH">ANTIOCH</a>`54';
isbe[2530]='Dara`dar\'-a (dara\').`<a href="./study/isbe/search.html?string=DARDA">DARDA</a>`1';
isbe[2531]='Darda`dar\'-da (darda\', "pearl of wisdom"): One of the wise men to whom Solomon is compared (<a onClick="return mV(\'1Ki\',4,31);">1Ki 4:31</a>). He was either a son of Mahol (ibid.) or a son of Zerah, son of Judah (<a onClick="return mV(\'1Ch\',2,6);">1Ch 2:6</a>, where the corresponding name in the same list is given as <a href="./study/isbe/search.html?string=DARA">DARA</a>). In rabbinic lore the name has been interpreted as dor dea, "the generation of knowledge"—the generation of the wilderness.``1';
isbe[2532]='Dare`dar: The expression "to dare" in the Scriptures never has the meaning of "to defy," "to challenge," or "to terrify." It is always found as the translation of tolmao, "to manifest courage." This is particularly evident from <a onClick="return mV(\'2Cr\',10,12);">2Co 10:12</a>, "for we are not bold to number or compare ourselves" (the King James Version "for we dare not make ourselves of the number").``1';
isbe[2533]='Daric`dar\'-ik (darkemon, and \'adharkon; dareikos): A Persian gold coin about a guinea or five dollars in value. The first form of the word occurs in <a onClick="return mV(\'1Ch\',29,7);">1Ch 29:7</a>; <a onClick="return mV(\'Ezr\',2,69);">Ezr 2:69</a>, and <a onClick="return mV(\'Neh\',7,\'70-72\');">Ne 7:70-72</a>; the second in <a onClick="return mV(\'Ezr\',8,27);">Ezr 8:27</a> and is rendered, "dram" in the King James Version and "daric" in the Revised Version (British and American). In the passage in Chronicles, it must refer to a weight, since at the time of David there were no coins, but in the days of Ezra and Nehemiah the Persian darics were current.`<a href="./study/isbe/search.html?string=MONEY">MONEY</a>`1';
isbe[2534]='Darius`da-ri\'-us: The name of three or four kings mentioned in the Old Testament. In the original Persian it is spelled "Darayavaush"; in Babylonian, usually "Dariamush"; in Susian(?), "Tariyamaush"; in Egyptian "Antaryuash"; on Aramaic inscriptions, d-r-y-h-w-sh or d-r-y-w-h-w-sh; in Hebrew, dareyawesh; in Greek, Dareios; in Latin, "Darius." In meaning it is probably connected with the new Persian word Dara, "king." Herodotus says it means in Greek, Erxeies, coercitor, "restrainer," "compeller," "commander."<P>(1) Darius the Mede (<a onClick="return mV(\'Dan\',6,1);">Da 6:1</a>; <a onClick="return mV(\'Dan\',11,1);">11:1</a>) was the son of Ahasuerus (Xerxes) of the seed of the Medes (<a onClick="return mV(\'Dan\',9,1);">Da 9:1</a>). He received the government of Belshazzar the Chaldean upon the death of that prince (<a onClick="return mV(\'Dan\',5,30,31);">Da 5:30,31</a>; <a onClick="return mV(\'Dan\',6,1);">6:1</a>), and was made king over the kingdom of the Chaldeans.<P>From <a onClick="return mV(\'Dan\',6,28);">Da 6:28</a> we may infer that Darius was king contemporaneously with Cyrus. Outside of the Book of Daniel there is no mention of Darius the Mede by name, though there are good reasons for identifying him with Gubaru, or Ugbaru, the governor of Gutium, who is said in the Nabunaid-Cyrus Chronicle to have been appointed by Cyrus as his governor of Babylon after its capture from the Chaldeans. Some reasons for this identification are as follows:<P>(a) Gubaru is possibly a translation of Darius. The same radical letters in Arabic mean "king," "compeller," "restrainer." In Hebrew, derivations of the root mean "lord," "mistress," "queen"; in Aramaic, "mighty," "almighty."<P>(b) Gutium was the designation of the country north of Babylon and was in all possibility in the time of Cyrus a part of the province of Media.<P>(c) But even if Gutium were not a part of Media at that time, it was the custom of Persian kings to appoint Medes as well as Persians to satrapies and to the command of armies. Hence, Darius-Gubaru may have been a Mede, even if Gutium were not a part of Media proper.<P>(d) Since Daniel never calls Darius the Mede king of Media, or king of Persia, it is immaterial what his title or position may have been before he was made king over the realm of the Chaldeans. Since the realm of the Chaldeans never included either Media or Persia, there is absolutely no evidence in the Book of Daniel that its author ever meant to imply that Darius the Mede ever ruled over either Media or Persia.<P>(e) That Gubaru is called governor (pihatu), and Darius the Mede, king, is no objection to this identification; for in ancient as well as modern oriental empires the governors of provinces and cities were often called kings.<P>Moreover, in the Aramaic language, no more appropriate word than "king" can be found to designate the ruler of a sub-kingdom, or province of the empire.<P>(f) That Darius is said to have had 120 satraps under him does not conflict with this; for the Persian word "satrap" is indefinite as to the extent of his rule, just like the English word "governor." Besides, Gubaru is said to have appointed pihatus under himself. If the kingdom of the Chaldeans which he received was as large as that of Sargon he may easily have appointed 120 of these sub-rulers; for Sargon names 117 subject cities and countries over which he appointed his prefects and governors.<P>(g) The peoples, nations and tongues of chapter 6 are no objection to this identification; for Babylonia itself at this time was inhabited by Babylonians, Chaldeans, Arabians, Arameans and Jews, and the kingdom of the Chaldeans embraced also Assyrians, Elamites, Phoenicians and others within its limits.<P>(h) This identification is supported further by the fact that there is no other person known to history that can well be meant. Some, indeed, have thought that Darius the Mede was a reflection into the past of Darius Hystaspis; but this is rendered impossible inasmuch as the character, deeds and empire of Darius Hystaspis, which are well known to us from his own monuments and from the Greek historians, do not resemble what Daniel says of Darius the Mede.<P>(2) Darius, the fourth king of Persia, called Hystaspes because he was the son of a Persian king named Hystaspis, is mentioned in Ezra (<a onClick="return mV(\'Ezr\',4,5);">4:5</a>, et al.), Hag (<a onClick="return mV(\'Hag\',1,1);">1:1</a>) and Zec (<a onClick="return mV(\'Zec\',1,1);">1:1</a>). Upon the death of Cambyses, son and successor to Cyrus, Smerdis the Magian usurped the kingdom and was dethroned by seven Persian nobles from among whom Darius was selected to be king. After many rebellions and wars he succeeded in establishing himself firmly upon the throne (Ant., XI, i). He reorganized and enlarged the Persian empire. He is best known to general history from his conflict with Greece culminating at Marathon, and for his re-digging of the Suez Canal. In sacred history he stands forth as the king who enabled the Jews under Jeshua and Zerubbabel to rebuild the temple at Jerusalem.<P>(3) Darius, called by the Greeks Nothus, was called Ochus before he became king. He reigned from 424 to 404 BC. In the Scriptures he is mentioned only in <a onClick="return mV(\'Neh\',12,22);">Ne 12:22</a>, where he is called Darius the Persian, probably to distinguish him from Darius the Mede.<P>It is not necessary to suppose that Darius Codomannus who reigned from 336 to 330 BC, is meant by the author of <a onClick="return mV(\'Neh\',12,\'1-\');">Ne 12</a>, because he mentions Jaddua; for (a) Johanan, the father of this Jaddua, was high priest about 408 BC, as is clear from the Aramaic papyrus from Elephantine lately published by Professor Sachau of Berlin, and Jaddua may well have succeeded him in those troubled times before the death of Darius Nothus in 404 BC. And (b) that a high priest named Jaddua met Alexander in 332 BC, is attested only by Josephus (Ant., XI, viii, 5). It is not fair to take the testimony of Josephus as to Jaddua without taking his testimony as to the meeting with Alexander and as to the appeal of Jaddua to the predictions of the Book of Daniel. But even if Josephus be right, there may have been two Jadduas, one high priest in 404 BC, and the other in 332 BC; or the one who was alive and exercising his functions in 404 BC may still have been high priest in 332 BC. He need not have exceeded 90 years of age.<P>According to the Eshki Harran inscription, which purports to have been written by himself, the priest of the temple in that city had served for 104 years. In our own time how many men have been vigorous in mind and body at the age of 90, or thereabouts; Bismarck and Gladstone, for example?``196';
isbe[2535]='Dark Sayings`(<a onClick="return mV(\'Pro\',1,6);">Pr 1:6</a>; <a onClick="return mV(\'Psa\',78,2);">Ps 78:2</a>; singular, <a onClick="return mV(\'Psa\',49,4,5);">Ps 49:4,5</a>; chidhoth, singular chidhah, elsewhere rendered "riddle," "proverb"): In the heading to the canonical Book of Proverbs, the general term "proverbs" is made to include "a proverb mashal, and a figure (or, an interpretation, melitsah), the words (singular dabhar) of the wise, and their dark sayings (or, riddles)."<P>The "proverb" is either a saying current among the people (compare <a onClick="return mV(\'1Sa\',10,12);">1Sa 10:12</a>; "the proverb of the ancients" <a onClick="return mV(\'1Sa\',24,13);">24:13 (Hebrew 14)</a>), or a sentence of ethical wisdom composed by the order of wise men (chakhamim). Of the latter kind are the sententious maxims of the Wisdom literature (chiefly Proverbs, but also Job, Ecclesiastes, and among the uncanonical writings, Ecclesiasticus). They are characterized by a secular touch; wisdom, moreover, flourished among the neighbors of Israel as well; so in Edom and elsewhere.<P>Whatever the date of the collection known as the "Proverbs of Solomon," the wise men existed in Israel at a very early period; the prophets allude to them. But the Hebrew mashal is sometimes of a more elaborate character corresponding to our "parables"; frequently a vein of taunt runs through them, and they played an important part in compositions directed against other nations (compare <a onClick="return mV(\'Num\',21,27);">Nu 21:27</a>). The prophets are fond of employing this genre of literary production; in their hands the mashal becomes a figurative or allegorical discourse (compare <a onClick="return mV(\'Eze\',21,5);">Eze 21:5ff (Hebrew 8ff)</a>). The mashal in the sense of a didactic poem occurs also in the Psalms (<a onClick="return mV(\'Psa\',49,\'1-\');">Pss 49</a> and <a onClick="return mV(\'Psa\',78,\'1-\');">78</A>). Hence, it is that "proverb" and "figure," or "proverb" and "dark saying" are interchangeable terms. The "dark saying" is the popular "riddle" (compare <a onClick="return mV(\'Jdg\',14,\'1-\');">Jud 14</a>) raised to the dignity of elaborate production.<P>It is in short an allegorical sentence requiring interpretation. Both prophets and psalmists avail themselves thereof. The word of God comes to the prophet in the form of a vision (compare the visions of Amos or Jeremiah), i.e. the truth presents itself to them in the form of a simile. To the perfect prophet of the type of Moses the revelation comes direct in the shape of the naked truth without the mediation of figures of speech or obscure utterances requiring elucidation (compare <a onClick="return mV(\'Num\',12,\'1-\');">Nu 12</a>). In the same way Paul (<a onClick="return mV(\'1Cr\',13,\'1-\');">1Co 13</a>) distinguishes between the childish manner of speaking of things spiritual and the manner of a man: "For now we see in a mirror, darkly (Greek "in a riddle"); but then face to face." The rabbis say that, whereas all the other prophets saw God and things Divine in a dim mirror, Moses saw them in a polished, clear mirror. Both Paul and the rabbis feel the difference between mediate and immediate vision, the revelation which requires dark figurative language as a vehicle and the clear perception which is the direct truth.``115';
isbe[2536]='Dark; Darkness`dark, dark\'-nes (choshekh; skotos):<P>1. Darkness and Light in Palestine:<P>The day and night, light and darkness, are notable antitheses in Palestine. There the day does not slowly fade away into the night after a period of twilight, but before sunset there is the brightness of day, and when the sun has disappeared everything has changed and night is at hand. From sunset until the darkness of night is less than an hour.<P>2. Symbolic Uses:<P>In the Bible the main use of darkness is in contrast to light. Light is the symbol of God\'s purity, wisdom and glory. Darkness is the opposite. Miraculous occurrence of darkness in the land of Egypt for three days is recorded in <a onClick="return mV(\'Exd\',10,21,22);">Ex 10:21,22</a>, and at the death of Christ (<a onClick="return mV(\'Mat\',27,45);">Mt 27:45</a>). See <a href="./study/isbe/search.html?string=PLAGUE">PLAGUE</a>; <a href="./study/isbe/search.html?string=ECLIPSE">ECLIPSE</a>.<P>The figurative uses of darkness are many and various. It is used as a symbol<P>(a) of moral depravity and its punishment. The wicked walk and work in darkness (<a onClick="return mV(\'Psa\',82,5);">Ps 82:5</a>; <a onClick="return mV(\'Pro\',2,13);">Pr 2:13</a>; <a onClick="return mV(\'Jhn\',3,19);">Joh 3:19</a>; <a onClick="return mV(\'Rom\',13,12);">Ro 13:12</a>), and their reward is to "sit in darkness" (<a onClick="return mV(\'Psa\',107,10);">Ps 107:10</a>) or to be "cast forth into the outer darkness" (<a onClick="return mV(\'Mat\',8,12);">Mt 8:12</a>);<P>(b) of things mysterious or inexplicable (<a onClick="return mV(\'1Ki\',8,12);">1Ki 8:12</a>; <a onClick="return mV(\'Psa\',97,2);">Ps 97:2</a>);<P>(c) of trouble and affliction (<a onClick="return mV(\'2Sa\',22,29);">2Sa 22:29</a>; <a onClick="return mV(\'Job\',5,14);">Job 5:14</a>; <a onClick="return mV(\'Pro\',20,20);">Pr 20:20</a>; <a onClick="return mV(\'Isa\',9,2);">Isa 9:2</a>; compare <a onClick="return mV(\'Gen\',15,12);">Ge 15:12</a>);<P>(d) of punishment (<a onClick="return mV(\'Lam\',3,2);">La 3:2</a>; <a onClick="return mV(\'Eze\',32,8);">Eze 32:8</a>; <a onClick="return mV(\'Zep\',1,15);">Ze 1:15</a>); (e) of death (<a onClick="return mV(\'1Sa\',2,9);">1Sa 2:9</a>; <a onClick="return mV(\'Job\',10,21);">Job 10:21</a>f; <a onClick="return mV(\'Ecc\',11,8);">Ec 11:8</a>);<p>(f) of nothingness (<a onClick="return mV(\'Job\',3,\'4-6\');">Job 3:4-6</a>);<p>(g) of human ignorance (<a onClick="return mV(\'Job\',19,8);">Job 19:8</a>; <a onClick="return mV(\'1Jo\',2,11);">1Joh 2:11</a>).<P>"A dark (the Revised Version, margin "squalid") place" (<a onClick="return mV(\'2Pe\',1,19);">2Pe 1:19</a>) refers especially to the state of things described in <a onClick="return mV(\'2Pe\',2,\'1-\');">2Pe 2</a>.``85';
isbe[2537]='Darkly`dark\'-li: The word occurs in <a onClick="return mV(\'1Cr\',13,12);">1Co 13:12</a>, "For now we see in a mirror, darkly," in translation of the words en ainigmati, the Revised Version, margin "in a riddle." The contrast is with the "face to face" vision of Divine things in eternity. Earth\'s best knowledge is partial, obscure, enigmatic, a broken reflection of the complete truth ("broken lights of Thee").``1';
isbe[2538]='Darkon`dar\'-kon (darqon, "carrier"): Ancestor of a subdivision of "Solomon\'s servants," so called, in post-exilic times (<a onClick="return mV(\'Ezr\',2,56);">Ezr 2:56</a>; <a onClick="return mV(\'Neh\',7,58);">Ne 7:58</a>; Lozon, 1Esdras 5:33).``1';
isbe[2539]='Darling`dar\'-ling (yachidh, "only," the King James Version margin, "only one"; the American Revised Version, margin, "dear life"): Used poetically for the life or soul (<a onClick="return mV(\'Psa\',22,20);">Ps 22:20</a>; <a onClick="return mV(\'Psa\',35,17);">35:17</a>).``1';
isbe[2540]='Dart`dart (chets; belos): A pointed missile weapon, as an arrow or light spear (<a onClick="return mV(\'2Sa\',18,14);">2Sa 18:14</a>; <a onClick="return mV(\'Job\',41,26);">Job 41:26</a>). See <a href="./study/isbe/search.html?string=ARMOR;+ARMS">ARMOR; ARMS, III, 4</a>; <a href="./study/isbe/search.html?string=ARROW">ARROW</a>. Figurative:<P>(1) Of the penalty of sin (<a onClick="return mV(\'Pro\',7,23);">Pr 7:23</a> the King James Version);<P>(2) of strong suggestions and fierce temptations to evil (<a onClick="return mV(\'Eph\',6,16);">Eph 6:16</a>; compare 1Macc 5:51).``1';
isbe[2541]='Dart-Snake`dart\'-snake (<a onClick="return mV(\'Isa\',34,15);">Isa 34:15</a>).`<a href="./study/isbe/search.html?string=ARROWSNAKE">ARROWSNAKE</a>`1';
isbe[2542]='Dash`The idea of "to throw violently" or "to strike" with purpose of causing destruction is usually connected with the word "to dash." There is perhaps but one exception to this: <a onClick="return mV(\'Psa\',91,12);">Ps 91:12</a> and the quotations of this passage in the New Testament (<a onClick="return mV(\'Mat\',4,6);">Mt 4:6</a>; <a onClick="return mV(\'Luk\',4,11);">Lu 4:11</a>, proskopto), have the meaning "to strike against accidentally" and not intentionally. <a onClick="return mV(\'Nah\',2,1);">Na 2:1</a>, "he that dasheth in pieces" is doubtful. "He that scatters" would be in better harmony with the Hebrew mephits, and the following description of destruction. In all other cases "to dash" is connected with the idea of destruction, especially the infliction of punishment which is usually expressed by ratash, "to dash to the ground" (<a onClick="return mV(\'2Ki\',8,12);">2Ki 8:12</a>; <a onClick="return mV(\'Isa\',13,16);">Isa 13:16</a>ff, et al., "to dash in pieces," the King James Version simply "to dash"), but also by naphats, "to break to pieces" (<a onClick="return mV(\'Psa\',2,9);">Ps 2:9</a>; <a onClick="return mV(\'Psa\',137,9);">137:9</a>, et al.).`<a href="./study/isbe/search.html?string=PUNISHMENTS">PUNISHMENTS</a>`16';
isbe[2543]='Dates`dats (debhash): Arabic, dibbs (<a onClick="return mV(\'2Ch\',31,5);">2Ch 31:5</a>, King James Version margin); English Versions of the Bible <a href="./study/isbe/search.html?string=HONEY">HONEY</a> (which see).`<a href="./study/isbe/search.html?string=PALM+TREE">PALM TREE</a>`1';
isbe[2544]='Dathan`da\'-than (dathan, meaning and derivation unknown, though the name is found in Assyrian, in the records of Shalmaneser II): The son of Eliab the son of Pallu the son of Reuben (<a onClick="return mV(\'Num\',26,5);">Nu 26:5</a>ff; <a onClick="return mV(\'Deu\',11,6);">De 11:6</a>; <a onClick="return mV(\'Psa\',106,17);">Ps 106:17</a>). He and his brother Abiram, with others, followed Korah the Levite in disputing the authority of Moses and Aaron in the wilderness (<a onClick="return mV(\'Num\',16,1);">Nu 16-17</a>; <a onClick="return mV(\'Num\',26,1);">26</a>; <a onClick="return mV(\'Deu\',11,6);">De 11:6</a>; <a onClick="return mV(\'Psa\',106,17);">Ps 106:17</a>). Other followers of Korah perished by fire before the tent of meeting, but Dathan and Abiram were swallowed up by the earth, with their families and their goods, at their tents.`<a href="./study/isbe/search.html?string=KORAH">KORAH</a>`11';
isbe[2545]='Dathema`dath\'-e-ma (Dathema): A stronghold (1Macc 5:29) in Gilead to which the Jews fled for refuge from the heathen (1Macc 5:9). They were delivered by Judas and Jonathan his brother. It was within a night\'s march from Bosora. It may possibly be identical with \'Athaman which lies east of el-Muzeribe in disputing the authority of Moses and Aaron in the wilderness (<a onClick="return mV(\'Num\',16,1);">Nu 16-17</a>; <a onClick="return mV(\'Num\',26,1);">26</a>; <a onClick="return mV(\'Deu\',11,6);">De 11:6</a>; <a onClick="return mV(\'Psa\',106,17);">Ps 106:17</a>). Other followers of Korah perished by fire before the tent of meeting, but Dathan and Abiram were swallowed up by the earth, with their families and their goods, at their tents.``1';
isbe[2546]='Daub`dob: "To daub" always has the meaning "to cover," "to smear with" in the Scriptures. Ezekiel compares the flatteries of the false prophets to a slight wall covered with whitewash (literally, "spittle"). See <a onClick="return mV(\'Eze\',13,10);">Eze 13:10</a>, <a onClick="return mV(\'Eze\',13,22);">22:28</a>. In <a onClick="return mV(\'Exd\',2,3);">Ex 2:3</a> "daubed it with slime and with pitch" (Hebrew wattachmerah, denominative of chemar, "bitumen" or "asphalt"), "to daub" has the same meaning as in the Ezekiel passage.``1';
isbe[2547]='Daughter`do\'-ter (bath; thugater): Used in Scriptures in several more or less distinct senses:<P>(a) for daughter in the ordinary, literal sense (<a onClick="return mV(\'Gen\',46,25);">Ge 46:25</a>; <a onClick="return mV(\'Exd\',1,16);">Ex 1:16</a>);<P>(b) daughter-in-law (<a onClick="return mV(\'Rth\',2,2);">Ru 2:2</a>);<P>(c) grand-daughter or other female descendant (<a onClick="return mV(\'Exd\',21,1);">Ex 21</a>; <a onClick="return mV(\'Luk\',1,5);">Lu 1:5</a>; <a onClick="return mV(\'Luk\',13,16);">13:16</a>);<P>(d) the women of a country, or of a place, taken collectively (<a onClick="return mV(\'Luk\',23,28);">Lu 23:28</a>), of a particular religion (<a onClick="return mV(\'Mal\',2,11);">Mal 2:11</a>);<P>(e) all the population of a place, taken collectively, especially in Prophets and poetic books (<a onClick="return mV(\'Psa\',9,14);">Ps 9:14</a>; <a onClick="return mV(\'Isa\',23,10);">Isa 23:10</a>; <a onClick="return mV(\'Jer\',46,24);">Jer 46:24</a>; <a onClick="return mV(\'Mat\',21,5);">Mt 21:5</a>);<P>(f) used in familiar address, "Daughter, be of good comfort" (<a onClick="return mV(\'Mat\',9,22);">Mt 9:22</a> the King James Version; <a onClick="return mV(\'Mar\',5,34);">Mr 5:34</a>; <a onClick="return mV(\'Luk\',8,48);">Lu 8:48</a>);<P>(g) women in general (<a onClick="return mV(\'Pro\',31,29);">Pr 31:29</a>);<P>(h) the personification of towns or cities, as of the female sex (<a onClick="return mV(\'Isa\',47,1);">Isa 47:1</a>; <a onClick="return mV(\'Eze\',16,44,46);">Eze 16:44,46</a>; compare <a onClick="return mV(\'Nah\',3,4,7);">Na 3:4,7</a>), especially of dependent towns and villages (<a onClick="return mV(\'Psa\',48,11);">Ps 48:11</a>; <a onClick="return mV(\'Num\',21,25);">Nu 21:25</a> margin; <a onClick="return mV(\'Jdg\',1,27);">Jud 1:27</a> margin);<P>(i) in Hebrew idiom for person or thing belonging to or having the characteristics of that with which it is joined, as "daughter of ninety years," of Sarah, ninety years old (<a onClick="return mV(\'Gen\',17,17);">Ge 17:17</a>); "daughters of music," singing birds, or singing women (<a onClick="return mV(\'Ecc\',12,4);">Ec 12:4</a>); daughters of a tree, i. e. branches; daughter of the eye, i. e. the pupil.<P>Daughters were not so highly prized as sons, not being usually mentioned by name. A father might sometimes sell his daughter as bondwoman (<a onClick="return mV(\'Exd\',21,7);">Ex 21:7</a>); though not to a foreigner (<a onClick="return mV(\'Exd\',21,8);">Ex 21:8</a>); daughters might sometimes inherit as did sons, but could not take the inheritance outside of the tribe (<a onClick="return mV(\'Num\',36,\'1-12\');">Nu 36:1-12</a>).``137';
