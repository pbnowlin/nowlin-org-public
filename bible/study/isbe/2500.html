<script type="text/javascript">
isbe = [];

isbe[2501]='Dakubi`da-ku\'-bi, da-koo\'-bi (Dakoub, Dakoubi; the King James Version Dacobi): Head of a family of gate-keepers (1Esdras 5:28) called "Akkub" in the canonical lists.``1';
isbe[2502]='Dalaiah`da-la\'-a, da-la-i\'-a.`<a href="./study/isbe/search.html?string=DELAIAH">DELAIAH</a>`1';
isbe[2503]='Dalan`da\'-lan (Dalan; the King James Version Ladan): Head of a family that returned to Jerusalem, but which "could shew neither their families, nor their stock, how they were of Israel" (1Esdras 5:37); corresponds to Delaiah (<a onClick="return mV(\'Ezr\',2,60);">Ezr 2:60</a>). Another reading is "Asan."``1';
isbe[2504]='Dale, King\'s`(dal, \'emeq hamelekh):<P>(1) "Absalom in his lifetime had taken and reared up for himself the pillar, which is in the king\'s dale" (<a onClick="return mV(\'2Sa\',18,18);">2Sa 18:18</a>). According to Josephus (Ant., VII, x, 3) this was a marble pillar, which he calls "Absalom\'s hand" and it was two furlongs from Jerusalem. Warren suggests that this dale was identical with the <a href="./study/isbe/search.html?string=KING\'S+GARDEN">KING\'S GARDEN</a> (which see), which he places at the open valley formed at the junction of the Tyropoen with the Kidron (see <a href="./study/isbe/search.html?string=JERUSALEM">JERUSALEM</a>). The so-called Absalom\'s Pillar, which the Jews still pelt with stones in reprobation of Absalom\'s disobedience, and which a comparatively recent tradition associates with <a onClick="return mV(\'2Sa\',18,18);">2Sa 18:18</a>, is a very much later structure, belonging to the Greco- Roman period, but showing Egyptian influence.<P>(2) King\'s Vale (<a onClick="return mV(\'Gen\',14,17);">Ge 14:17</a>; the King James Version dale).`<a href="./study/isbe/search.html?string=KING\'s+VALE">KING\'S VALE</a>; <a href="./study/isbe/search.html??string=VALE">VALE</a>`117';
isbe[2505]='Daleth`da\'-leth (...): The 4th letter of the Hebrew alphabet, and as such used in <a onClick="return mV(\'Psa\',119,1);">Ps 119</a> to designate the 4th section; transliterated in this Encyclopedia with the dagesh as d, and, without, as dh (= th in "the"). It came also to be used for the number four (4), and with the dieresis for 4,000. With the apostrophe it is sometimes used as abbreviation for the tetragrammaton.`<a href="./study/isbe/search.html?string=ALPHABET">ALPHABET</a>`1';
isbe[2506]='Dally`dal\'-i: Occurs in The <span class="noTag">Wisdom of Solomon 12:26</span>: "But they that would not be reformed by that correction wherein he dallied with them" (paigniois epitimeseos, "child play of correction"), the reference being to the earlier and lighter plagues of Egypt; Version (British and American) renders "by a mocking correction as of children," "by a correction which was as children\'s play," Greek (as above). He first tried them by those lighter inflictions before sending on them the heavier. In later usage "daily" implies delay.``1';
isbe[2507]='Dalmanutha`dal-ma-nu\'-tha. Compare <a onClick="return mV(\'Mar\',8,10);">Mr 8:10</a>; <a onClick="return mV(\'Mat\',15,39);">Mt 15:39</a>.`<a href="./study/isbe/search.html?string=MAGADAN">MAGADAN</a>`1';
isbe[2508]='Dalmatia`dal-ma\'-shi-a (Dalmatia, "deceitful"): A district of the Roman empire lying on the eastern shore of the Adriatic. Writing from Rome to Timothy during his second imprisonment (in 66 or 67 AD, according to Ramsay\'s chronology), Paul records the departure of Titus to Dalmatia (<a onClick="return mV(\'2Ti\',4,10);">2Ti 4:10</a>). No mention is made of his special mission, and we cannot tell whether his object was to traverse regions hitherto unevangelized or to visit churches already formed. Nor can we determine with certainty the meaning of the word Dalmatia as here used. Originally it denoted the land of the barbarous Dalmatae or Delmatae, a warlike Illyrian tribe subjugated by the Romans after a long and stubborn resistance; it was then applied to the southern portion of the Roman province of Illyricum, lying between the river Titius (modern Kerka) and the Macedonian frontier; later the name was extended to the entire province. On the whole it seems most probable that the apostle uses it in this last sense.`<a href="./study/isbe/search.html?string=ILLYRICUM">ILLYRICUM</a>`176';
isbe[2509]='Dalphon`dal\'-fon (dalphon, "crafty"): The second of the ten sons of Haman, slain by the Jews (<a onClick="return mV(\'Est\',9,7);">Es 9:7</a>).``1';
isbe[2510]='Dam`(\'em, ordinary Hebrew word for "mother"): Hebrew law prohibited the destruction of the "dam" and the young of birds at the same time, commanding that if the young be taken from a nest the dam be allowed to escape (<a onClick="return mV(\'Deu\',22,6,7);">De 22:6,7</a>). In the same spirit it enjoined the taking of an animal for slaughter before it had been seven days with its "dam" (<a onClick="return mV(\'Exd\',22,30);">Ex 22:30</a>; <a onClick="return mV(\'Lev\',22,27);">Le 22:27</a>; compare <a onClick="return mV(\'Exd\',23,19);">Ex 23:19</a>).``1';
isbe[2511]='Damage`dam\'-aj (chabhala\'): This word expresses any inflicted loss of value or permanent injury to persons or things. "Why should damage grow to the hurt of the kings?" (<a onClick="return mV(\'Ezr\',4,22);">Ezr 4:22</a>). In <a onClick="return mV(\'Pro\',26,6);">Pr 26:6</a> "damage" means "wrong," "injury" (Hebrew chamac). The translation of <a onClick="return mV(\'Est\',7,4);">Es 7:4</a> is doubtful: "Although the adversary could not have compensated for the king\'s damage" (the Revised Version, margin "For our affliction is not to be compared with the king\'s damage" the King James Version "could not countervail the king\'s damage") but Hebrew nezeq (<a onClick="return mV(\'Est\',7,4);">Es 7:4</a>) and Aramaic naziq (<a onClick="return mV(\'Dan\',6,2);">Da 6:2</a>) have the meaning of "molestation" or "annoyance" (see Ges.6 Buhl Dict. (15th edition) 489,806,908). We therefore ought to read \'for that oppression would not have been worthy of the molestation of the king\' (<a onClick="return mV(\'Est\',7,4);">Es 7:4</a>) and \'that the king should have no molestation\' (<a onClick="return mV(\'Dan\',6,2);">Da 6:2</a>). The Greek zemia, "loss" and zemioo, "to cause loss"; the Revised Version (British and American) therefore translates <a onClick="return mV(\'Act\',27,10);">Ac 27:10</a> "will be with injury and much loss" (the King James Version "damage"), and <a onClick="return mV(\'2Cr\',7,9);">2Co 7:9</a> "that ye might suffer loss by us in nothing" (the King James Version "damage").``16';
isbe[2512]='Damaris`dam\'-a-ris (Damaris, possibly a corruption of damalis, "a heifer"): The name of a female Christian of Athens, converted by Paul\'s preaching (<a onClick="return mV(\'Act\',17,34);">Ac 17:34</a>). The fact that she is mentioned in this passage together with Dionysius the Areopagite has led some, most probably in error, to regard her as his wife. The singling out of her name with that of Dionysius may indicate some personal or social distinction. Compare <a onClick="return mV(\'Act\',17,12);">Ac 17:12</a>.``1';
isbe[2513]='Damascenes`dam-a-senz\', dam\'-a-senz ten polin Damaskenon, ("the city of the Damascenes"): The inhabitants of Damascus under Aretas the Arabian are so called (<a onClick="return mV(\'2Cr\',11,32);">2Co 11:32</a>).``1';
isbe[2514]='Damascus`da-mas\'-kus:<P>1. The Name<P>2. Situation and Natural Features<P>3. The City Itself<P>4. Its History<P class="in15">(1) The Early Period (to circa 950 BC)<P class="in15">(2) The Aramean Kingdom (circa 950-732 BC)<P class="in15">(3) The Middle Period (732 BC-650 AD)<Pclass="in15">(4) Under Islam<hr /><P>1. Name:<P>The English name is the same as the Greek Damaskos. The Hebrew name is Dammeseq, but the Aramaic form Darmeseq, occurs in <a onClick="return mV(\'1Ch\',18,5);">1Ch 18:5</a>; <a onClick="return mV(\'2Ch\',28,5);">2Ch 28:5</a>. The name appears in Egyptian inscriptions as Ti-mas-ku (16th century BC), and Sa-ra-mas-ki (13th century BC), which W. M. Muller, Asien u. Europa,227,regards as representing Ti-ra-mas-ki, concluding from the "ra" in this form that Damascus had by that time passed under Aramaic influence. In the Tell el-Amarna Letters the forms Ti-ma-as-gi and Di-mas-ka occur. The Arabic name is Dimashk esh-Sham ("Damascus of Syria") usually contrasted to Esh-Sham simply. The meaning of the name Damascus is unknown. Esh-Sham (Syria) means "the left," in contrast to the Yemen (Arabia) = "the right."<P>2. Situation and Natural Features:<P>Damascus is situated (33 degrees 30\' North latitude, 36 degrees 18\' East longitude) in the Northwest corner of the Ghuta, a fertile plain about 2,300 ft. above sea level, west of Mt. Hermon. The part of the Ghuta east of the city is called el-Merj, the "meadow-land" of Damascus. The river Barada (see <a href="./study/isbe/search.html?string=ASANA">ASANA</a>) flows through Damascus and waters the plain, through which the Nahr el-Awaj (see <a href="./study/isbe/search.html?string=PHARPAR">PHARPAR</a>) also flows, a few miles south of the city.<P>Surrounded on three sides by bare hills, and bordered on the east, its open side, by the desert, its well-watered and fertile Ghuta, with its streams and fountains, its fields and orchards, makes a vivid impression on the Arab of the desert. Arabic literature is rich in praises of Damascus, which is described as an earthly paradise. The European or American traveler is apt to feel that these praises are exaggerated, and it is perhaps only in early summer that the beauty of the innumerable fruit trees—apricots, pomegranates, walnuts and many others—justifies enthusiasm. To see Damascus as the Arab sees it, we must approach it, as he does, from the desert. The Barada (Abana) is the life blood of Damascus. Confined in a narrow gorge until close to the city, where it spreads itself in many channels over the plain, only to lose itself a few miles away in the marshes that fringe the desert, its whole strength is expended in making a small area between the hills and the desert really fertile. That is why a city on this site is inevitable and permanent. Damascus, almost defenseless from a military point of view, is the natural mart and factory of inland Syria. In the course of its long history it has more than once enjoyed and lost political supremacy, but in all the vicissitudes of political fortune it has remained the natural harbor of the Syrian desert.<P>3. The City Itself:<P>Damascus lies along the main stream of the Barada, almost entirely on its south bank. The city is about a mile long (east to west) and about half a mile broad (north to south). On the south side a long suburb, consisting for the most part of a single street, called the Meidan, stretches for a mile beyond the line of the city wall, terminating at the Bawwabet Allah, the "Gate of God," the starting-point of the Haj, the annual pilgrimage to Mecca. The city has thus roughly the shape of a broad-headed spoon, of which the Meidan is the handle. In the Greek period, a long, colonnaded street ran through the city, doubtless the "street which is called Straight" (<a onClick="return mV(\'Act\',9,11);">Ac 9:11</a>). This street, along the course of which remains of columns have been discovered, runs westward from the Babesh-Sherki, the "East Gate."<P>Part of it is still called Derb el-Mustakim ("Straight Street"), but it is not certain that it has borne the name through all the intervening centuries. It runs between the Jewish and Christian quarters (on the left and right, respectively, going west), and terminates in the Suk el-Midhatiyeh, a bazaar built by Midhat Pasha, on the north of which is the main Moslem quarter, in which are the citadel and the Great Mosque. The houses are flat-roofed, and are usually built round a courtyard, in which is a fountain. The streets, with the exception of Straight Street, are mostly narrow and tortuous, but on the west side of the city there are some good covered bazaars. Damascus is not rich in antiquities.<P>The Omayyad Mosque, or Great Mosque, replaced a Christian church, which in its time had taken the place of a pagan temple. The site was doubtless occupied from time immemorial by the chief religious edifice of the city. A small part of the ancient Christian church is still extant. Part of the city wall has been preserved, with a foundation going back to Roman times, surmounted by Arab work. The traditional site of Paul\'s escape (<a onClick="return mV(\'Act\',9,25);">Ac 9:25</a>; <a onClick="return mV(\'2Cr\',11,33);">2Co 11:33</a>) and of the House of Naaman (<a onClick="return mV(\'2Ki\',5,1);">2Ki 5</a>) are pointed out to the traveler, but the traditions are valueless.<P>The charm of Damascus lies in the life of the bazaars, in the variety of types which may be seen there—the Druse, the Kurd, the Bedouin and many others—and in its historical associations. It has always been a manufacturing city. Our word "damask" bears witness to the fame of its textile industry, and the "Damascus blades" of the Crusading period were equally famous; and though Timur (Tamerlane) destroyed the trade in arms in 1399 by carrying away the armorers to Samarcand, Damascus is still a city of busy craftsmen in cloth and wood. Its antiquity casts a spell of romance upon it. After a traceable history of thirty-five centuries it is still a populous and flourishing city, and, in spite of the advent of the railway and even the electric street car, it still preserves the flavor of the East.<P>4. Its History:<P>(1) The Early Period (to circa 950 BC).<P>The origin of Damascus is unknown. Mention has already been made (section 1) of the references to the city in Egyptian inscriptions and in the Tell el-Amarna Letters. It appears once—possibly twice—in the history of Abraham. In <a onClick="return mV(\'Gen\',14,15);">Ge 14:15</a> we read that Abraham pursued the four kings as far as Hobah, "which is on the left hand (i.e. the north) of Damascus." But this is simply a geographical note which shows only that Damascus was well known at the time when <a onClick="return mV(\'Gen\',14,1);">Ge 14</a> was written. Greater interest attaches to <a onClick="return mV(\'Gen\',15,2);">Ge 15:2</a>, where Abraham complains that he is childless and that his heir is "Dammesek Eliezer" (English Revised Version), for which the Syriac version reads "Eliezer the Damaschul." The clause, however, is hopelessly obscure, and it is doubtful whether it contains any reference to Damascus at all. In the time of David Damascus was an Aramean city, which assisted the neighboring Aramean states in their unsuccessful wars against David (<a onClick="return mV(\'2Sa\',8,5);">2Sa 8:5</a>f). These campaigns resulted indirectly in the establishment of a powerful Aramean kingdom in Damascus. Rezon, son of Eliada, an officer in the army of Hadadezer, king of Zobah, escaped in the hour of defeat, and became a captain of banditti. Later he established himself in Damascus, and became its king (<a onClick="return mV(\'1Ki\',11,23);">1Ki 11:23</a>ff). He cherished a not unnatural animosity against Israel and the rise of a powerful and hostile kingdom in the Israelite frontier was a constant source of anxiety to Solomon (<a onClick="return mV(\'1Ki\',11,25);">1Ki 11:25</a>).<P>(2) The Aramean Kingdom (circa 950-732 BC).<P>Whether Rezon was himself the founder of a dynasty is not clear. He has been identified with Hezion, father of Tab-rimmon, and grandfather of Ben-hadad (<a onClick="return mV(\'1Ki\',15,18);">1Ki 15:18</a>), but the identification, though a natural one, is insecure. Ben-hadad (Biridri) is the first king of Damascus, after Rezon, of whom we have any detailed knowledge. The disruption of the Hebrew kingdom afforded the Arameans an opportunity of playing off the rival Hebrew states against each other, and of bestowing their favors now on one, and now on the other. Benhadad was induced by Asa of Judah to accept a large bribe, or tribute, from the Temple treasures, and relieve Asa by attacking the Northern Kingdom (<a onClick="return mV(\'1Ki\',15,18);">1Ki 15:18</a>ff). Some years later (circa 880 BC) Ben-hadad (or his successor?) defeated Omri of Israel, annexed several Israelite cities, and secured the right of having Syrian "streets" (i.e. probably a bazaar for Syrian merchants) in Samaria (<a onClick="return mV(\'1Ki\',20,34);">1Ki 20:34</a>). Ben-hadad II (according to Winckler the two Ben-hadads are really identical, but this view, though just possible chronologically, conflicts with <a onClick="return mV(\'1Ki\',20,34);">1Ki 20:34</a>) was the great antagonist of Ahab. His campaigns against Israel are narrated in <a onClick="return mV(\'1Ki\',20,22);">1Ki 20:22</a>. At first successful, he was subsequently twice defeated by Ahab, and after the rout at Aphek was at the mercy of the conqueror, who treated him with generous leniency, claiming only the restoration of the lost Israelite towns, and the right of establishing an Israelite bazaar in Damascus.<P>On the renewal of hostilities three years later Ahab fell before Ramoth-gilead, and his death relieved Ben-hadad of the only neighboring monarch who could ever challenge the superiority of Damascus. Further light is thrown upon the history of Damascus at this time by the Assyrian inscriptions. In 854 BC the Assyrians defeated a coalition of Syrian and Palestine states (including Israel) under the leadership of Ben-hadad at Karqar. In 849 and 846 BC renewed attacks were made upon Damascus by the Assyrians, who, however, did not effect any considerable conquest. From this date until the fall of the city in 732 BC the power of the Aramean kingdom depended upon the activity or quiescence of Assyria. Hazael, who murdered Ben-hadad and usurped his throne circa 844 BC, was attacked in 842 and 839, but during the next thirty years Assyria made no further advance westward. Hazael was able to devote all his energies to his western neighbors, and Israel suffered severely at his hands. In 803 Mari\' of Damascus, who is probably identical with the Ben-hadad of <a onClick="return mV(\'2Ki\',13,3);">2Ki 13:3</a>, Hazael\'s son, was made tributary to Ramman-nirari III of Assyria. This blow weakened Aram, and afforded Jeroboam II of Israel an opportunity of avenging the defeats inflicted upon his country by Hazael. In 773 Assyria again invaded the territory of Damascus.<P>Tiglath-pileser III (745-727 BC) pushed vigorously westward, and in 738 Rezin of Damascus paid tribute. A year or two later he revolted, and attempted in concert with Pekah of Israel, to coerce Judah into joining an anti- Assyrian league (<a onClick="return mV(\'2Ki\',15,37);">2Ki 15:37</a>; <a onClick="return mV(\'2Ki\',16,5);">16:5</a>; <a onClick="return mV(\'Isa\',7,1);">Isa 7</a>). His punishment was swift and decisive. In 734 the Assyrians advanced and laid siege to Damascus, which fell in 732. Rezin was executed, his kingdom was overthrown, and the city suffered the fate which a few years later befell Samaria.<P>(3) The Middle Period (circa 732 BC-650 AD).<P>Damascus had now lost its political importance, and for more than two centuries we have only one or two inconsiderable references to it. It is mentioned in an inscription of Sargon (722-705 BC) as having taken part in an unsuccessful insurrection along with Hamath and Arpad. There are incidental references to it in <a onClick="return mV(\'Jer\',49,23);">Jer 49:23</a>ff and <a onClick="return mV(\'Eze\',27,18);">Eze 27:18</a>; <a onClick="return mV(\'Eze\',47,16);">47:16</a>ff. In the Persian period Damascus, if not politically of great importance, was a prosperous city. The overthrow of the Persian empire by Alexander was soon followed (301 BC) by the establishment of the Seleucid kingdom of Syria, with Antioch as its capital, and Damascus lost its position as the chief city of Syria. The center of gravity was moved toward the sea, and the maritime commerce of the Levant became more important than the trade of Damascus with the interior. In 111 BC the Syrian kingdom was divided, and Antiochus Cyzicenus became king of Coele-Syria, with Damascus as his capital. His successors, Demetrius Eucaerus and Antiochus Dionysus, had troubled careers, being involved in domestic conflicts and in wars with the Parthians, with Alexander Janneus of Judea, and with Aretas the Nabatean, who obtained possession of Damascus in 85 BC. Tigranes, being of Armenia, held Syria for some years after this date, but was defeated by the Romans, and in 64 BC Pompey finally annexed the country.<P>The position of Damascus during the first century and a half of Roman rule in Syria is obscure. For a time it was in Roman hands, and from 31 BC-33 AD its coins bear the names of Augustus or Tiberius. Subsequently it was again in the hands of the Nabateans, and was ruled by an ethnarch, or governor, appointed by Aretas, the Nabatean king. This ethnarch adopted a hostile attitude to Paul (<a onClick="return mV(\'2Cr\',11,32);">2Co 11:32</a>f). Later, in the time of Nero, it again became a Roman city. In the early history of Christianity Damascus, as compared with Antioch, played a very minor part. But it is memorable in Christian history on account of its associations with Paul\'s conversion, and as the scene of his earliest Christian preaching (<a onClick="return mV(\'Act\',9,\'1-25\');">Ac 9:1-25</a>). All the New Testament references to the city relate to this event (<a onClick="return mV(\'Act\',9,1);">Ac 9:1:25</a>; <a onClick="return mV(\'Act\',22,\'5-11\');">22:5-11</a>; <a onClick="return mV(\'Act\',26,12,20);">26:12,20</a>; <a onClick="return mV(\'2Cr\',11,32);">2Co 11:32</a>f; <a onClick="return mV(\'Gal\',1,17);">Ga 1:17</a>). Afterward, under the early Byzantine emperor, Damascus, though important as an outpost of civilization on the edge of the desert, continued to be second to Antioch both politically and ecclesiastically. It was not until the Arabian conquest (634 AD when it passed out of Christian hands, and reverted to the desert, that it once more became a true capital.)<P>(4) Under Islam.<P>Damascus has now been a Moslem city, or rather a city under Moslem rule, for nearly thirteen centuries. For about a century after 650 AD it was the seat of the Omayyad caliphs, and enjoyed a position of preeminence in the Moslem world. Later it was supplanted by Bagdad, and in the 10th century it came under the rule of the Fatimites of Egypt. Toward the close of the 11th century the Seljuk Turks entered Syria and captured Damascus. In the period of the Crusades the city, though never of decisive importance, played a considerable part, and was for a time the headquarters of Saladin. In 1300 it was plundered by the Tartars, and in 1399 Timur exacted an enormous ransom from it, and carried off its famous armorers, thus robbing it of one of its most important industries. Finally, in 1516 AD, the Osmanli Turks under Sultan Selim conquered Syria, and Damascus became, and still is, the capital of a province of the Ottoman Empire.``172';
isbe[2515]='Dammesek Eliezer`(<a onClick="return mV(\'Gen\',15,2);">Ge 15:2</a> the English Revised Version).`<a href="./study/isbe/search.html?string=ELIEZER">ELIEZER</a>`1';
isbe[2516]='Damn; Damnation; Damnable`dam, dam-na\'-shun, dam\'-na-bl: These words have undergone a change of meaning since the King James Version was made. They are derived from Latin damnare = "to inflict a loss," "to condemn," and that was their original meaning in English Now they denote exclusively the idea of everlasting punishment in hell. It is often difficult to determine which meaning was intended by the translators in the King James Version. They have been excluded altogether from the Revised Version (British and American). The words for which they stand in the King James Version are:<P>(1) apoleia, "destruction," translated "damnable" and "damnation" only in <a onClick="return mV(\'2Pe\',2,\'1-3\');">2Pe 2:1-3</a> (the Revised Version (British and American) "destructive," "destruction"). False prophets taught doctrines calculated to destroy others, and themselves incurred the sentence of destruction such as overtook the fallen angels, the world in the Deluge, and the cities of the Plain. Apoleia occurs otherwise 16 times in the New Testament, and is always translated in the King James Version and the Revised Version (British and American) by either "perdition" or "destruction": twice of waste of treasure (<a onClick="return mV(\'Mat\',26,8);">Mt 26:8</a> = <a onClick="return mV(\'Mar\',14,4);">Mr 14:4</a>); twice of the beast that comes out of the abyss and goes into perdition (<a onClick="return mV(\'Rev\',17,8,11);">Re 17:8,11</a>). In all other cases, it refers to men, and defines the destiny that befalls them as the result of sin: Judas is the "son of perdition" (<a onClick="return mV(\'Jhn\',17,12);">Joh 17:12</a>). Peter consigns Simon Magus and his money to perdition (<a onClick="return mV(\'Act\',8,20);">Ac 8:20</a>). Some men are "vessels of wrath fitted unto destruction" (<a onClick="return mV(\'Rom\',9,22);">Ro 9:22</a>), and others, their "end is perdition" (<a onClick="return mV(\'Phl\',3,19);">Php 3:19</a>). It is the antithesis of salvation (<a onClick="return mV(\'Hbr\',10,39);">Heb 10:39</a>; <a onClick="return mV(\'Phl\',1,28);">Php 1:28</a>). Of the two ways of life, one leads to destruction (<a onClick="return mV(\'Mat\',7,13);">Mt 7:13</a>). Whether it is utter, final and irretrievable destruction is not stated.<P>(2) krino, translated "damned" only in the King James Version of <a onClick="return mV(\'2Th\',2,12);">2Th 2:12</a> (the Revised Version (British and American) "judged") means "to judge" in the widest sense, "to form an opinion" (<a onClick="return mV(\'Luk\',7,43);">Lu 7:43</a>), and forensically "to test and try" an accused person. It can only acquire the sense of "judging guilty" or "condemning" from the context.<P>(3) katakrino, translated "damned" only in the King James Version of <a onClick="return mV(\'Mar\',16,16);">Mr 16:16</a>; <a onClick="return mV(\'Rom\',14,23);">Ro 14:23</a> ("condemned" in the Revised Version (British and American)), means properly "to give judgment against" or "to condemn" and is so translated 17 times in the King James Version and always in the Revised Version (British and American).<P>(4) krisis, translated "damnation" in the King James Version of <a onClick="return mV(\'Mat\',23,33);">Mt 23:33</a>; <a onClick="return mV(\'Mar\',3,29);">Mr 3:29</a>; <a onClick="return mV(\'Jhn\',5,29);">Joh 5:29</a> (the Revised Version (British and American) "judgment," but in <a onClick="return mV(\'Mar\',3,29);">Mr 3:29</a>, "sin" for hamartema), means (a) judgment in general like krino, and is so used about 17 times, besides 14 times in the phrase "day of judgment"; (b) "condemnation," like katakrino, about 14 times.<P>(5) krima, translated in the King James Version "damnation" 7 times (<a onClick="return mV(\'Mat\',23,14);">Mt 23:14</a> = <a onClick="return mV(\'Mar\',12,40);">Mr 12:40</a> = <a onClick="return mV(\'Luk\',20,47);">Lu 20:47</a>; <a onClick="return mV(\'Rom\',3,8);">Ro 3:8</a>; <a onClick="return mV(\'Rom\',13,2);">13:2</a>; <a onClick="return mV(\'1Cr\',11,29);">1Co 11:29</a>; <a onClick="return mV(\'1Ti\',5,12);">1Ti 5:12</a>), "condemnation" 6 times, "judgment" 13 times, "law" and "avenged" once each; in the Revised Version (British and American) "condemnation" 9 times (<a onClick="return mV(\'Mat\',23,14);">Mt 23:14</a> only inserted in margin), "judgment" 17 times, and once in margin, "lawsuit" and "sentence" once each. "Judgment" may be neutral, an impartial act of the judge weighing the evidence (so in <a onClick="return mV(\'Mat\',7,2);">Mt 7:2</a>; <a onClick="return mV(\'Act\',24,25);">Ac 24:25</a>; <a onClick="return mV(\'Rom\',11,33);">Ro 11:33</a>; <a onClick="return mV(\'Hbr\',6,2);">Heb 6:2</a>; <a onClick="return mV(\'1Pe\',4,17);">1Pe 4:17</a>; <a onClick="return mV(\'Rev\',20,4);">Re 20:4</a>) and "lawsuit" (<a onClick="return mV(\'1Cr\',6,7);">1Co 6:7</a>); or it may be inferred from the context that judgment is unto condemnation (so in <a onClick="return mV(\'Rom\',2,2,3);">Ro 2:2,3</a>; <a onClick="return mV(\'Rom\',5,16);">5:16</a>; <a onClick="return mV(\'Gal\',5,10);">Ga 5:10</a>; <a onClick="return mV(\'2Pe\',2,3);">2Pe 2:3</a>; <a onClick="return mV(\'Rev\',17,1);">Re 17:1</a>; <a onClick="return mV(\'Rev\',18,20);">18:20</a>, and the Revised Version (British and American) <a onClick="return mV(\'Rom\',13,2);">Ro 13:2</a>; <a onClick="return mV(\'1Cr\',11,29);">1Co 11:29</a>). In places where krima and krisis are rightly translated "condemnation," and where "judgment" regarded as an accomplished fact involves a sentence of guilt, they together with katakrino define the relation of a person to the supreme authority, as that of a criminal, found and held guilty, and liable to punishment. So the Roman empire regarded Jesus Christ, and the thief on the cross (<a onClick="return mV(\'Luk\',23,40);">Lu 23:40</a>; <a onClick="return mV(\'Luk\',24,20);">24:20</a>).<P>But generally these words refer to man as a sinner against God, judged guilty by Him, and liable to the just penalty of sin. They imply nothing further as to the nature of the penalty or the state of man undergoing it, nor as to its duration. Nor does the word "eternal" (aion, aionios, often wrongly translated "everlasting" in the King James Version) when added to them, determine the question of duration. Condemnation is an act in the moral universe, which cannot be determined under categories of time.<P>These terms define the action of God in relation to man\'s conduct, as that of the Supreme Judge, but they express only one aspect of that relation which is only fully conceived, when coordinated with the more fundamental idea of God\'s Fatherhood.<P>LITERATURE. Salmond, Christian Doctrine of Immortality; Charles, Eschatology.`<a href="./study/isbe/search.html?string=ESCHATOLOGY">ESCHATOLOGY</a>; <a href="./study/isbe/search.html??string=JUDGMENT">JUDGMENT</a>`145';
isbe[2517]='Damsel`dam\'-zel: A young, unmarried woman; a girl (lass); maiden (compare French demoiselle). The Revised Version (British and American) in <a onClick="return mV(\'Mat\',26,69);">Mt 26:69</a>; <a onClick="return mV(\'Jhn\',18,17);">Joh 18:17</a>; <a onClick="return mV(\'Act\',12,13);">Ac 12:13</a>; <a onClick="return mV(\'Act\',16,16);">16:16</a> gives "maid" for paidiske, "a girl," i.e. (spec.) a maidservant or young female slave (the King James Version "damsel"), and "child" for paidion, "a half-grown boy or girl," in <a onClick="return mV(\'Mar\',5,39,40,41);">Mr 5:39,40 bis. 41</a>.``1';
isbe[2518]='Dan (1); Dan, Tribe of`(dan, "judge"; Dan).<P>1. Name:<P>The fifth of Jacob\'s sons, the first borne to him by Bilhah, the maid of Rachel, to whom, as the child of her slave, he legally belonged. At his birth Rachel, whose barrenness had been a sore trial to her, exclaimed "God hath judged me...and hath given me a son," so she called his name Dan, i.e. "judge" (<a onClick="return mV(\'Gen\',30,6);">Ge 30:6</a>). He was full brother of Naphtali. In Jacob\'s Blessing there is an echo of Rachel\'s words, "Dan shall judge his people" (<a onClick="return mV(\'Gen\',49,16);">Ge 49:16</a>). Of the patriarch Dan almost nothing is recorded. Of his sons at the settlement in Egypt only one, Hushim, is mentioned (<a onClick="return mV(\'Gen\',46,23);">Ge 46:23</a>). The name in <a onClick="return mV(\'Num\',26,42);">Nu 26:42</a> is Shuham.<P>2. The Tribe:<P>The tribe however stands second in point of numbers on leaving Egypt, furnishing 62,700 men of war (<a onClick="return mV(\'Num\',1,39);">Nu 1:39</a>); and at the second census they were 64,400 strong (<a onClick="return mV(\'Num\',26,43);">Nu 26:43</a>). The standard of the camp of Dan in the desert march, with which were Asher and Naphtali, was on the north side of the tabernacle (<a onClick="return mV(\'Num\',2,25);">Nu 2:25</a>; <a onClick="return mV(\'Num\',10,25);">10:25</a>; compare <a onClick="return mV(\'Jos\',6,9);">Jos 6:9</a> the King James Version margin, "gathering host"). The prince of the tribe was Ahiezer (<a onClick="return mV(\'Num\',1,12);">Nu 1:12</a>). Among the spies Dan was represented by Ammiel the son of Gemalli (<a onClick="return mV(\'Num\',13,12);">Nu 13:12</a>). Of the tribe of Dan was Oholiab (the King James Version "Aholiab") one of the wise-hearted artificers engaged in the construction of the tabernacle (<a onClick="return mV(\'Exd\',31,6);">Ex 31:6</a>). One who was stoned for blasphemy was the son of a Danite woman (<a onClick="return mV(\'Lev\',24,10);">Le 24:10</a>f). At the ceremony of blessing and cursing, Dan and Naphtali stood on Mount Ebal, while the other Rachel tribes were on Gerizim (<a onClick="return mV(\'Deu\',27,13);">De 27:13</a>). The prince of Dan at the division of the land was Bukki the son of Jogli (<a onClick="return mV(\'Num\',34,22);">Nu 34:22</a>).<P>3. Territory:<P>The portion assigned to Dan adjoined those of Ephraim, Benjamin and Judah, and lay on the western slopes of the mountain. The reference in <a onClick="return mV(\'Jdg\',5,17);">Jud 5:17</a>: "And Dan, why did he remain in ships?" seems to mean that on the west, Dan had reached the sea. But the passage is one of difficulty. We are told that the Amorites forced the children of Dan into the mountain (<a onClick="return mV(\'Jdg\',1,34);">Judges 1:34</a>), so they did not enjoy the richest part of their ideal portion, the fertile plain between the mountain and the sea. The strong hand of the house of Joseph kept the Amorites tributary, but did not drive them out. Later we find Dan oppressed by the Philistines, against whom the heroic exploits of Samson were performed (<a onClick="return mV(\'Jdg\',14,\'1-\');">Jud 14</a>ff). The expedition of the Danites recorded in <a onClick="return mV(\'Jdg\',18,\'1-\');">Jud 18</a> is referred to in <a onClick="return mV(\'Jos\',19,47);">Jos 19:47</a>ff.<P>4. The Danite Raid:<P>The story affords a priceless glimpse of the conditions prevailing in those days. Desiring an extension of territory, the Danites sent out spies, who recommended an attack upon Laish, a city at the north end of the Jordan valley. The people, possibly a colony from Sidon, were careless in their fancied security. The land was large, and there was "no want of anything that was in the earth." The expedition of the 600, their dealings with Micah and his priest, their capture of Laish, and their founding of an idol shrine with priestly attendant, illustrate the strange mingling of lawlessness and superstition which was characteristic of the time. The town rebuilt on the site of Laish they called <a href="./study/isbe/search.html?string=DAN+(2)">Dan</a>—see following article. Perhaps <a onClick="return mV(\'2Ch\',2,14);">2Ch 2:14</a> may be taken to indicate that the Danites intermarried with the Phoenicians. Divided between its ancient seat in the south and the new territory in the north the tribe retained its place in Israel for a time (<a onClick="return mV(\'1Ch\',12,35);">1Ch 12:35</a>; <a onClick="return mV(\'1Ch\',27,22);">27:22</a>), but it played no part of importance in the subsequent history.<P>The name disappears from the genealogical lists of Chronicles; and it is not mentioned among the tribes in <a onClick="return mV(\'Rev\',7,5);">Re 7:5</a>ff.<P>Samson was the one great man produced by Dan, and he seems to have embodied the leading characteristics of the tribe: unsteady, unscrupulous, violent, possessed of a certain grim humor; stealthy in tactics—"a serpent in the way, an adder in the path" (<a onClick="return mV(\'Gen\',49,17);">Ge 49:17</a>)—but swift and strong in striking—"a lion\'s whelp, that leapeth forth from Bashan" (<a onClick="return mV(\'Deu\',33,22);">De 33:22</a>). Along with Abel, Dan ranked as a city in which the true customs of old Israel were preserved (<a onClick="return mV(\'2Sa\',20,18);">2Sa 20:18</a> Septuagint).``54';
isbe[2519]='Dan (2)`A city familiar as marking the northern limit of the land of Israel in the common phrase "from Dan even to Beer- sheba" (<a onClick="return mV(\'Jdg\',20,1);">Jud 20:1</a>; <a onClick="return mV(\'1Sa\',3,20);">1Sa 3:20</a>, etc.). Its ancient name was Laish or Leshem (<a onClick="return mV(\'Jdg\',18,7);">Jud 18:7</a>, etc.). It was probably an outlying settlement of Tyre of Sidon. Its inhabitants, pursuing the ends of peaceful traders, were defenseless against the onset of the Danite raiders. Having captured the city the Danites gave it the name of their own tribal ancestor (<a onClick="return mV(\'Jdg\',18,1);">Jud 18</a>). It lay in the valley near Beth-rehob (<a onClick="return mV(\'Jdg\',18,28);">Jud 18:28</a>). Josephus places it near Mt. Lebanon and the fountain of the lesser Jordan, a day\'s journey from Sidon (Ant., V, iii, 1; VIII, viii, 4; BJ, IV, i, 1). Eusebius, Onomasticon says it lay 4 Roman miles from Paneas on the way to Tyre, at the source of the Jordan.<P>This points decisively to Tell el-Qady, in the plain west of Banias. The mound of this name—Kady is the exact Arabic equivalent of the Hebrew Dan—rises from among the bushes and reeds to a height varying from 40 to 80 ft. The largest of all the springs of the Jordan rises on the west side. The waters join with those of a smaller spring on the other side to form Nahr el-Leddan which flows southward to meet the streams from Banias and Chasbeiyeh. The mound, which is the crater of an extinct volcano, has certain ancient remains on the south side, while the tomb of Sheikh Marzuk is sheltered by two holy trees. The sanctuary and ritual established by the Danites persisted as long as the house of God was in Shiloh, and the priesthood in this idolatrous shrine remained in the family of Jonathan till the conquest of Tiglath-pileser (<a onClick="return mV(\'Jdg\',18,30);">Jud 18:30</a>; <a onClick="return mV(\'2Ki\',15,29);">2Ki 15:29</a>). Here Jeroboam I set up the golden calf. The ancient sanctity of the place would tend to promote the success of his scheme (<a onClick="return mV(\'1Ki\',12,28);">1Ki 12:28</a>f; etc.). The calf, according to a Jewish tradition, was taken away by Tiglath-pileser. Dan fell before Benhadad, king of Syria (<a onClick="return mV(\'1Ki\',15,20);">1Ki 15:20</a>; <a onClick="return mV(\'2Ch\',16,4);">2Ch 16:4</a>). It was regained by Jeroboam II (<a onClick="return mV(\'2Ki\',14,25);">2Ki 14:25</a>). It shared the country\'s fate at th hands of Tiglath-pileser (<a onClick="return mV(\'2Ki\',15,29);">2Ki 15:29</a>).<P>It was to this district that Abraham pursued the army of Chedorlaomer (<a onClick="return mV(\'Gen\',14,14);">Ge 14:14</a>). For Dr. G. A. Smith\'s suggestion that Dan may have been at Banias see HGHL1, 473, 480 f.``54';
isbe[2520]='Dan (3)`(<a onClick="return mV(\'Eze\',27,19);">Eze 27:19</a> the King James Version).`<a href="./study/isbe/search.html?string=VEDAN">VEDAN</a>`1';
isbe[2521]='Dan-Jaan`dan-ja\'-an (dan ya\'-an; B, Dan Eidan kai Oudan): A place visited by Joab and his officers when taking the census (<a onClick="return mV(\'2Sa\',24,6);">2Sa 24:6</a>). It is mentioned between Gilead and Sidon. Some would identify it with Khan Danian, a ruined site north of Achzib. The text is probably corrupt. Klostermann would read "toward Dan and Ijon" (compare <a onClick="return mV(\'1Ki\',15,20);">1Ki 15:20</a>).``1';
