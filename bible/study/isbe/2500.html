isbe[2553]='Dawn; Dawning`don: The word means the approach of the morning light, the breaking of the day. There are several words in the Bible that indicate this. nesheph, "twilight" of the morning (<a onClick="return mV(\'Job\',7,4);">Job 7:4</a>; <a onClick="return mV(\'Psa\',119,147);">Ps 119:147</a>). The same word is used for evening twilight (<a onClick="return mV(\'1Sa\',30,17);">1Sa 30:17</a>; <a onClick="return mV(\'2Ki\',7,5,7);">2Ki 7:5,7</a>); penoth ha-boqer, "the turning" of the morning, the change from darkness to light, approach of the morning (<a onClick="return mV(\'Jdg\',19,26);">Jud 19:26</a>); \'aph\'-appe shachar, "the eyelids" of the morning (<a onClick="return mV(\'Job\',3,9);">Job 3:9</a>; <a onClick="return mV(\'Job\',41,18);">41:18</a> (10)); aloth ha-shachar, "the ascent" or "rise" of the morning (<a onClick="return mV(\'Jos\',6,15);">Jos 6:15</a>); epi-phosko, "to grow light," the approach of the dawn (<a onClick="return mV(\'Mat\',28,1);">Mt 28:1</a>; <a onClick="return mV(\'Luk\',23,54);">Lu 23:54</a> margin); diaugazo, "to grow bright", "lustrous" (<a onClick="return mV(\'2Pe\',1,19);">2Pe 1:19</a>), "until the day dawn" figurative of the Second Coming of Christ (compare <a onClick="return mV(\'2Pe\',1,16);">2Pe 1:16</a>).``138';
isbe[2554]='Day`da (yom; hemera): This common word has caused some trouble to plain readers, because they have not noticed that the word is used in several different senses in the English Bible. When the different uses of the word are understood the difficulty of interpretation vanishes. We note several different uses of the word:<P>(1) It sometimes means the time from daylight till dark. This popular meaning is easily discovered by the context, e. g. <a onClick="return mV(\'Gen\',1,5);">Ge 1:5</a>; <a onClick="return mV(\'Gen\',8,22);">8:22</a>, etc. The marked periods of this daytime were morning, noon and night, as with us. See <a onClick="return mV(\'Psa\',55,17);">Ps 55:17</a>. The early hours were sometimes called "the cool of the day" (<a onClick="return mV(\'Gen\',3,8);">Ge 3:8</a>). After the exile the day. or daytime was divided into twelve hours and the night into twelve (see <a onClick="return mV(\'Mat\',20,\'1-12\');">Mt 20:1-12</a>; <a onClick="return mV(\'Jhn\',11,9);">Joh 11:9</a>; <a onClick="return mV(\'Act\',23,23);">Ac 23:23</a>); 6 a. m. would correspond to the first hour, 9 a. m. to the third; 12 noon to the sixth, etc. The hours were longer during the longer days and shorter during the shorter days, since they always counted 12 hours between sunrise and sunset.<P>(2) Day also means a period of 24 hours, or the time from sunset to sunset. In Bible usage the day begins with sunset (see <a onClick="return mV(\'Lev\',23,32);">Le 23:32</a>; <a onClick="return mV(\'Exd\',12,\'15-20\');">Ex 12:15-20</a>; <a onClick="return mV(\'2Cr\',11,25);">2Co 11:25</a>, where night is put before day). See <a href="./study/isbe/search.html?string=DAY+AND+NIGHT">DAY AND NIGHT</a>.<P>(3) The word "day" is also used of an indefinite period, e. g "the day" or "day that" means in general "that time" (see <a onClick="return mV(\'Gen\',2,4);">Ge 2:4</a>; <a onClick="return mV(\'Lev\',14,2);">Le 14:2</a>); "day of trouble" (<a onClick="return mV(\'Psa\',20,1);">Ps 20:1</a>); "day of his wrath" (<a onClick="return mV(\'Job\',20,28);">Job 20:28</a>); "day of Yahweh" (<a onClick="return mV(\'Isa\',2,12);">Isa 2:12</a>); "day of the Lord" (<a onClick="return mV(\'1Cr\',5,5);">1Co 5:5</a>; <a onClick="return mV(\'1Th\',5,2);">1Th 5:2</a>; <a onClick="return mV(\'2Pe\',3,10);">2Pe 3:10</a>); "day of salvation" (<a onClick="return mV(\'2Cr\',6,2);">2Co 6:2</a>); ." day of Jesus Christ" (<a onClick="return mV(\'Phl\',1,6);">Php 1:6</a>).<P>(4) It is used figuratively also in <a onClick="return mV(\'Jhn\',9,4);">Joh 9:4</a>, where "while it is day" means "while I have opportunity to work, as daytime is the time for work." In <a onClick="return mV(\'1Th\',5,5,8);">1Th 5:5,8</a>, "sons of the day" means spiritually enlightened ones.<P>(5) We must also bear in mind that with God time is not reckoned as with us (see <a onClick="return mV(\'Psa\',90,4);">Ps 90:4</a>; <a onClick="return mV(\'2Pe\',3,8);">2Pe 3:8</a>).<P>(6) The apocalyptic use of the word "day" in <a onClick="return mV(\'Dan\',12,11);">Da 12:11</a>; <a onClick="return mV(\'Rev\',2,10);">Re 2:10</a>, etc., is difficult to define. It evidently does not mean a natural day. See <a href="./study/isbe/search.html?string=APOCALYPSE">APOCALYPSE</A>.<P>(7) On the meaning of "day" in the story of Creation we note (a) the word "day" is used of the whole period of creation (<a onClick="return mV(\'Gen\',2,4);">Ge 2:4</a>); (b) these days are days of God, with whom one day is as a thousand years; the whole age or period of salvation is called "the day of salvation"; see above. So we believe that in harmony with Bible usage we may understand the creative days as creative periods. See also <a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>; <a href="./study/isbe/search.html?string=CREATION">CREATION</a>; <a href="./study/isbe/search.html?string=EVOLUTION">EVOLUTION</a>.<P>Figurative: The word "day" is used figuratively in many senses, some of which are here given.<P>(1) The span of human life.—<a onClick="return mV(\'Gen\',5,4);">Ge 5:4</a>: "And the days of Adam...were eight hundred years." "And if thou wilt walk...then I will lengthen thy days" (<a onClick="return mV(\'1Ki\',3,14);">1Ki 3:14</a>; compare <a onClick="return mV(\'Psa\',90,12);">Ps 90:12</a>; <a onClick="return mV(\'Isa\',38,5);">Isa 38:5</a>).<P>(2) An indefinite time.—Existence in general: <a onClick="return mV(\'Gen\',3,14);">Ge 3:14</a>: "All the days of thy life" (compare <a onClick="return mV(\'Gen\',21,34);">Ge 21:34</a>; <a onClick="return mV(\'Num\',9,19);">Nu 9:19</a>; <a onClick="return mV(\'Jos\',22,3);">Jos 22:3</a>; <a onClick="return mV(\'Luk\',1,24);">Lu 1:24</a>; <a onClick="return mV(\'Act\',21,10);">Ac 21:10</a>).<P>(3) A set time.—<a onClick="return mV(\'Gen\',25,24);">Ge 25:24</a>: "And when her days...were fulfilled"; <a onClick="return mV(\'Dan\',12,13);">Da 12:13</a>: "Thou shalt stand in thy lot, at the end of the days" (compare <a onClick="return mV(\'Lev\',12,6);">Le 12:6</a>; <a onClick="return mV(\'Dan\',2,44);">Da 2:44</a>).<P>(4) A historic period.—<a onClick="return mV(\'Gen\',6,4);">Ge 6:4</a>: "The Nephilim were in the earth in those days"; <a onClick="return mV(\'Jdg\',17,6);">Jud 17:6</a>: "In those days there was no king in Israel" (compare <a onClick="return mV(\'1Sa\',3,1);">1Sa 3:1</a>; <a onClick="return mV(\'1Ch\',5,17);">1Ch 5:17</a>; <a onClick="return mV(\'Hsa\',2,13);">Ho 2:13</a>).<P>(5) Past time.—<a onClick="return mV(\'Psa\',18,18);">Ps 18:18</a>: "the day of my calamity"; <a onClick="return mV(\'Psa\',77,5);">Ps 77:5</a>: "I have considered the days of old" (of <a onClick="return mV(\'Mic\',7,20);">Mic 7:20</a>; <a onClick="return mV(\'Mal\',3,7);">Mal 3:7</a>; <a onClick="return mV(\'Mat\',23,30);">Mt 23:30</a>).<P>(6) Future time.—<a onClick="return mV(\'Deu\',31,14);">De 31:14</a>: "Thy days approach that thou must die"; <a onClick="return mV(\'Psa\',72,7);">Ps 72:7</a>: "In his days shall ...." (compare <a onClick="return mV(\'Eze\',22,14);">Eze 22:14</a>; <a onClick="return mV(\'Joe\',2,29);">Joe 2:29</a>; <a onClick="return mV(\'Mat\',24,19);">Mt 24:19</a>; <a onClick="return mV(\'2Pe\',3,3);">2Pe 3:3</a>; <a onClick="return mV(\'Rev\',9,6);">Re 9:6</a>).<P>(7) The eternal.—In <a onClick="return mV(\'Dan\',7,9,13);">Da 7:9,13</a>, where God is called "the ancient of days."<P>(8) A season of opportunity.—<a onClick="return mV(\'Jhn\',9,4);">Joh 9:4</a>: "We must work the works of him that sent me, while it is day: the night cometh, when no man can work" (compare <a onClick="return mV(\'Rom\',13,12,13);">Ro 13:12,13</a>; <a onClick="return mV(\'1Th\',5,\'5-8\');">1Th 5:5-8</a>). See <a href="./study/isbe/search.html?string=DAY">DAY (4)</a>, above.<P>(9) Time of salvation.—Specially referring to the hopes and prospects of the parousia (see <a href="./study/isbe/search.html?string=ESCHATOLOGY+OF+THE+NEW+TESTAMENT">ESCHATOLOGY OF THE NEW TESTAMENT</a>). <a onClick="return mV(\'Rom\',13,12);">Ro 13:12</a>: "The night is far spent, and the day is at hand."``43';
isbe[2555]='Day And Night`"Day," yom; ordinarily, the Hebrew "day" lasted from dawn to the coming forth of the stars (<a onClick="return mV(\'Neh\',4,21);">Ne 4:21</a>). The context usually makes it clear whether the term "day" refers to the period of twenty-four hours or to daytime; when there was a possibility of confusion, the term laylah, "night," was added (<a onClick="return mV(\'Gen\',7,4,12);">Ge 7:4,12</a>; <a onClick="return mV(\'Gen\',31,39);">31:39</a>). The "day" is reckoned from evening to evening, in accordance with the order noted in the account of Creation, namely, "And there was evening and there was morning, one day" (<a onClick="return mV(\'Gen\',1,5);">Ge 1:5</a>); <a onClick="return mV(\'Lev\',23,32);">Le 23:32</a> and <a onClick="return mV(\'Dan\',8,14);">Da 8:14</a> reflect the same mode of reckoning the day. The phrase \'erebh boker, "evening-morning," used in this last passage, is simply a variation of yom and laylah, "day" and "night"; it is the equivalent of the Greek nuchthemeron (<a onClick="return mV(\'2Cr\',11,25);">2Co 11:25</a>). That the custom of reckoning the day as beginning in the evening and lasting until the following evening was probably of late origin is shown by the phrase "tarry all night" (<a onClick="return mV(\'Jdg\',19,\'6-9\');">Jud 19:6-9</a>); the context shows that the day is regarded as beginning in the morning; in the evening the day "declined," and until the new day (morning) arrived it was necessary to "tarry all night" (compare also <a onClick="return mV(\'Num\',11,32);">Nu 11:32</a>).<P>The transition of day to night begins before sunset and lasts till after sunset; the change of night to day begins before sunrise and continues until after sunrise. In both cases, neither \'erebh, "evening," nor boqer, "morning," indicate an exact space of time (compare <a onClick="return mV(\'Gen\',8,11);">Ge 8:11</a>; <a onClick="return mV(\'Exd\',10,13);">Ex 10:13</a>; <a onClick="return mV(\'Deu\',16,6);">De 16:6</a>).<P>The term nesheph, is used for both evening twilight and morning dawn (compare <a onClick="return mV(\'1Sa\',30,17);">1Sa 30:17</a>; <a onClick="return mV(\'2Ki\',7,5,7);">2Ki 7:5,7</a>; <a onClick="return mV(\'Job\',7,4);">Job 7:4</a>). Since there were no definite measurements of the time of day, the various periods were indicated by the natural changes of the day; thus "midday" was the time of the day when the sun mounted its highest (cohorayim); afternoon was that part of the day when the sun declined (netoth ha-yom); and evening was the time of the going down of the sun (\'erebh). "Between the evenings" (ben ha-\'arbayim) was the interval between sunset and darkness. The day was not divided into hours until a late period. sha\'ah = Aramaic (<a onClick="return mV(\'Dan\',3,6);">Da 3:6</a>), is common in Syriac and in later Hebrew; it denoted, originally, any short space of time, and only later came to be equivalent to our "hour" (Driver). The threefold division of the day into watches continued into post-exilic Roman times; but the Roman method of four divisions was also known (<a onClick="return mV(\'Mar\',13,35);">Mr 13:35</a>), where all four divisions are referred to: "at even" (opse), "midnight" (mesonuktion), "at cock crowing" (alektorophonia), "in the morning" (proi). These last extended from six to six o\'clock (of also <a onClick="return mV(\'Mat\',14,25);">Mt 14:25</a>; <a onClick="return mV(\'Mar\',13,35);">Mr 13:35</a>). <a onClick="return mV(\'Act\',12,4);">Ac 12:4</a> speaks of four parties of four Roman soldiers (quaternions), each of whom had to keep guard during one watch of the night. In Berakhoth 3b, Rabbi Nathan (2nd century) knows of only three night-watches; but the patriarch, Rabbi Judah, knows four.`<a href="./study/isbe/search.html?string=DAY">DAY</a>`197';
isbe[2556]='Day Before the Sabbath`(he paraskeue, "preparation"): Considered as a day of preparation, in accordance with <a onClick="return mV(\'Exd\',16,23);">Ex 16:23</a>, both before the regular Sabbath and before a feast Sabbath (<a onClick="return mV(\'Mat\',27,62);">Mt 27:62</a>; <a onClick="return mV(\'Mar\',15,42);">Mr 15:42</a>; <a onClick="return mV(\'Luk\',23,54);">Lu 23:54</a>; <a onClick="return mV(\'Jhn\',19,14,31,42);">Joh 19:14,31,42</a>). At 3 p. m., the Hebrews began to prepare their food for the next day, and to perform all labors which were forbidden to be done on the Sabbath and yet must be done. They bathed and purified themselves, dressed in festive apparel, set their tables, and lighted their lamps. On the day before Easter, the Hebrews of the later period made it their chief business to remove all leaven from the house (<a onClick="return mV(\'1Cr\',5,7);">1Co 5:7</a>). This custom of converting at least a portion of the day before the Sabbath into a holy day was recognized by the Romans to such an extent that, according to a rescript of Augustus, Jews need not appear in court after 3 p. m. on such days. Criminal cases were not brought before court on this day, and journeys exceeding 12 Roman miles were prohibited. The signal for the preparations was given by the priests by means of trumpets blown six times at intervals.``77';

isbe[2560]='Day of the Lord (Yahweh)`(yom Yahweh; he hemera tou Kuriou): The idea is a common Old Testament one. It denotes the consummation of the kingdom of God and the absolute cessation of all attacks upon it (<a onClick="return mV(\'Isa\',2,12);">Isa 2:12</a>; <a onClick="return mV(\'Isa\',13,6,9);">13:6,9</a>; <a onClick="return mV(\'Isa\',34,8);">34:8</a>; <a onClick="return mV(\'Eze\',13,5);">Eze 13:5</a>; <a onClick="return mV(\'Eze\',30,3);">30:3</a>; <a onClick="return mV(\'Joe\',1,15);">Joe 1:15</a>; <a onClick="return mV(\'Joe\',2,11);">2:11</a>; <a onClick="return mV(\'Amo\',5,18);">Am 5:18</a>; <a onClick="return mV(\'Zep\',1,14);">Ze 1:14</a>; <a onClick="return mV(\'Zec\',14,1);">Zec 14:1</a>) It is a "day of visitation" (<a onClick="return mV(\'Isa\',10,3);">Isa 10:3</a>), a day "of the wrath of Yahweh" (<a onClick="return mV(\'Eze\',7,19);">Eze 7:19</a>), a "great day of Yahweh" (<a onClick="return mV(\'Zep\',1,14);">Ze 1:14</a>). The entire conception in the Old Testament is dark and foreboding.<P>On the other hand the New Testament idea is pervaded with the elements of hope and joy and victory. In the New Testament it is eminently the day of Christ, the day of His coming in the glory of His father. The very conception of Him as the "Son of Man" points to this day (E. Kuehl, Das Selbstbewusstsein Jesu, 68). <a onClick="return mV(\'Jhn\',5,27);">Joh 5:27</a>: "And he gave him authority to execute judgment, because he is a son of man" (compare <a onClick="return mV(\'Mat\',24,27,30);">Mt 24:27,30</a>; <a onClick="return mV(\'Luk\',12,8);">Lu 12:8</a>). It is true in the New Testament there is a dark background to the bright picture, for it still remains a "day of wrath". (<a onClick="return mV(\'Rom\',2,5,6);">Ro 2:5,6</a>), a "great day" (<a onClick="return mV(\'Rev\',6,17);">Re 6:17</a>; <a onClick="return mV(\'Jud\',1,6);">Jude 1:6</a>), a "day of God" (<a onClick="return mV(\'2Pe\',3,12);">2Pe 3:12</a>), a "day of judgment" (<a onClick="return mV(\'Mat\',10,15);">Mt 10:15</a>; <a onClick="return mV(\'2Pe\',3,7);">2Pe 3:7</a>; <a onClick="return mV(\'Rom\',2,16);">Ro 2:16</a>).<P>Sometimes it is called "that day" (<a onClick="return mV(\'Mat\',7,22);">Mt 7:22</a>; <a onClick="return mV(\'1Th\',5,4);">1Th 5:4</a>; <a onClick="return mV(\'2Ti\',4,8);">2Ti 4:8</a>), and again it is called "the day" without any qualification whatever, as if it were the only day worth counting in all the history of the world and of the race (<a onClick="return mV(\'1Cr\',3,13);">1Co 3:13</a>). To the unbeliever, the New Testament depicts it as a day of terror; to the believer, as a day of joy. For on that day Christ will raise the dead, especially His own dead, the bodies of those that believed in Him—"that of all that which he hath given me I should lose nothing, but should raise it up at the last day" (<a onClick="return mV(\'Jhn\',6,39);">Joh 6:39</a>). In that day He comes to His own (<a onClick="return mV(\'Mat\',16,27);">Mt 16:27</a>), and therefore it is called "the day of our Lord Jesus" (<a onClick="return mV(\'2Cr\',1,14);">2Co 1:14</a>),"the day of Jesus Christ" or "of Christ" (<a onClick="return mV(\'Phl\',1,6,10);">Php 1:6,10</a>), the day when there "shall appear the sign of the Son of man in heaven" (<a onClick="return mV(\'Mat\',24,30);">Mt 24:30</a>). All Paulinic literature is especially suffused with this longing for the "parousia," the day of Christ\'s glorious manifestation. The entire conception of that day centers therefore in Christ and points to the everlasting establishment of the kingdom of heaven, from which sin will be forever eliminated, and in which the antithesis between Nature and grace will be changed into an everlasting synthesis.`<a href="./study/isbe/search.html?string=ESCHATOLOGY">ESCHATOLOGY</a>`42';

isbe[2562]='Day\'s Journey`jur\'-ni (derekh yom, <a onClick="return mV(\'Gen\',30,36);">Ge 30:36</a>; <a onClick="return mV(\'Num\',10,33);">Nu 10:33</a>; <a onClick="return mV(\'Num\',11,31);">11:31</a>; hemeras hodos, <a onClick="return mV(\'Luk\',2,44);">Lu 2:44</a>): The common way of estimating distances in the East is by hours and days. This is natural in a country where roads are mere bridle paths or non-existent, as in the desert. The distance traveled must of course differ largely according to the difficulties of the way, and it is more important to know where night will overtake the traveler than the actual distance accomplished. A day\'s journey is now commonly reckoned at about 3 miles per hour, the distance usually covered by a loaded mule, the number of hours being about 8. Hence, a day\'s journey is about 24 miles, and this may be taken as a fair estimate for Bible times.``138';

isbe[2565]='Day, Last`(he eschate hemera): Repeatedly used by Jesus in <a onClick="return mV(\'Jhn\',6,39,40,44,54);">Joh 6:39,40,44,54</a>; <a onClick="return mV(\'Jhn\',11,24);">11:24</a>; <a onClick="return mV(\'Jhn\',12,48);">12:48</a>, for the day of resurrection and judgment (see <a href="./study/isbe/search.html?string=ESCHATOLOGY+OF+THE+NEW+TESTAMENT">ESCHATOLOGY OF THE NEW TESTAMENT</a>). Compare the usage in the Old Testament (<a onClick="return mV(\'Isa\',2,2);">Isa 2:2</a>; <a onClick="return mV(\'Mic\',4,1);">Mic 4:1</a>) and the New Testament (<a onClick="return mV(\'Act\',2,17);">Ac 2:17</a>; <a onClick="return mV(\'2Ti\',3,1);">2Ti 3:1</a>; <a onClick="return mV(\'2Pe\',3,3);">2Pe 3:3</a>; <a onClick="return mV(\'1Jo\',2,18);">1Joh 2:18</a>; <a onClick="return mV(\'Jud\',1,18);">Jude 1:18</a>) of "last days" and "last time" to denote the Messianic age.<P>In <a onClick="return mV(\'Jhn\',7,37);">Joh 7:37</a>, "the last day, the great day of the feast" refers to the eighth day of the feast of Tabernacles. This closing day was observed as a Sabbath (<a onClick="return mV(\'Lev\',23,36);">Le 23:36</a>). On it the libation of water made on other days was not made; hence, the allusion of Jesus to Himself as the Giver of the living water.`<a href="./study/isbe/search.html?string=LATTER+DAYS">LATTER DAYS</a>; <a href="./study/isbe/search.html??string=LAST+DAYS">LAST DAYS</a>; <a href="./study/isbe/search.html??string=LAST+TIME">LAST TIME</a>`132';

isbe[2568]='Day-Star`(helel ben-shachar, <a onClick="return mV(\'Isa\',14,12);">Isa 14:12</a>; phosphoros, <a onClick="return mV(\'2Pe\',1,19);">2Pe 1:19</a>): The Old Testament passage is rendered in the King James Version "Lucifer, son of the morning," in the King James Version margin and the Revised Version (British and American) "day-star," i.e. the morning star. The reference is to the king of Babylon (<a onClick="return mV(\'Isa\',14,4);">Isa 14:4</a>). In <a onClick="return mV(\'2Pe\',1,19);">2Pe 1:19</a>, "Until...the daystar arise in your hearts," the word is literally, "light-bringer." It is applicable, therefore, not only to the planet Venus, seen as a morning star, herald of the dawn, but to the sun itself, and is used here as a title of our Lord.`<a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>`1';
isbe[2569]='Days, Last``<a href="./study/isbe/search.html?string=LAST+DAYS">LAST DAYS</a>`1';
isbe[2570]='Daysman`daz\'-man (yakhach, "to argue, decide, convince," the Revised Version (British and American) <a href="./study/isbe/search.html?string=UMPIRE">UMPIRE</A>): The use of this word appears to have been more common in the 16th century than at the later date of the translation of the King James Version, when its adoption was infrequent. The oldest instance of the term given in the Oxford English Dictionary is Plumpton Corresp. (1489), p. 82: "Sir, the dayesmen cannot agre us." It appears also in the 1551 edition of the Old Testament in <a onClick="return mV(\'1Sa\',2,25);">1Sa 2:25</a>, where the English Versions of the Bible "judge" is translated "dayes-man." Tyndale\'s translation has for <a onClick="return mV(\'Exd\',21,22);">Ex 21:22</a>, "He shall paye as the dayesmen appoynte him" (EV as the "judges determine"). See also Edmund Spenser\'s Faerie Queene, ii, c. 8, published in 1590. As used in the King James Version (<a onClick="return mV(\'Job\',9,33);">Job 9:33</a>) the word means an arbitrator, umpire, referee; one who stands in a judicial capacity between two parties, and decides upon the merits of their arguments or case at law. "Neither is there-any daysman (the Revised Version (British and American) "umpire") betwixt us, that might lay his hand upon us both" (compare <a onClick="return mV(\'Gen\',31,37);">Ge 31:37</a>). It was the eastern custom for a judge to lay his hands upon the heads of the two parties in disagreement, thus emphasizing his adjudicatory capacity and his desire to render an unbiased verdict. Job might consider a human judge as capable of acting as an umpire upon his own claims, but no man was worthy to question the purposes of Yahweh, or metaphorically, to "lay his hands upon" Him.<P>In the New Testament (<a onClick="return mV(\'1Cr\',4,3);">1Co 4:3</a>, anthropine, hemera) "man\'s judgment" is literally, "man\'s day," in the sense of a day fixed for the trial of a case. Both Tyndale and Coverdale so translate. See also <a onClick="return mV(\'1Ti\',2,5);">1Ti 2:5</a>, where the Saviour is termed the "one mediator...between God and men." Here the word understands a pleader, an advocate before an umpire, rather than the adjudicator himself (see <a onClick="return mV(\'Job\',19,\'25-27\');">Job 19:25-27</a>).``52';
isbe[2571]='Dayspring`da\'-spring: This beautiful English word, in current use in the time of the King James Version, is found in the Old Testament as the translation of shachar, "Hast thou...caused the dayspring to know his place?" (<a onClick="return mV(\'Job\',38,12);">Job 38:12</a> the King James Version). This is no doubt intended literally for the dawn. The "place" of the dayspring is the particular point of the horizon at which the sun comes up on any given day. This slowly changes day by day through the year, moving northward from midwinter till midsummer, and back again southward from midsummer to midwinter. See <a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY, sec. I, 2</a>. Also once in the New Testament for anatole, "a rising." "The dayspring from on high hath visited us" (the King James Version; the Revised Version (British and American)) "shall visit us," <a onClick="return mV(\'Luk\',1,78);">Lu 1:78</a>). Also in Apocrypha, "At the dayspring pray unto thee" (AV; the Revised Version (British and American) "plead with thee at the dawning of the light," The <span class="noTag">Wisdom of Solomon 16:28</span>). Both the Hebrew and Greek words, however, are of frequent occurrence, but variously rendered "dawn," "break of day," "morning," "sunrise," "east." Note especially "the spring of the day" (<a onClick="return mV(\'1Sa\',9,26);">1Sa 9:26</a>), "the day began to spring" (<a onClick="return mV(\'Jdg\',19,25);">Jud 19:25</a>). Used with heliou, "sun," for rising of the sun (<a onClick="return mV(\'Rev\',7,2);">Re 7:2</a>; <a onClick="return mV(\'Rev\',16,12);">16:12</a>). In the Septuagint the same Greek word is used for Hebrew tsemach, "branch," to designate the Messiah (<a onClick="return mV(\'Jer\',23,5);">Jer 23:5</a>; <a onClick="return mV(\'Zec\',6,12);">Zec 6:12</a>. But this sense of the word is wholly unknown in profane Greek The word is also employed in Septuagint to express the rising of a heavenly body, as the moon (<a onClick="return mV(\'Isa\',60,19);">Isa 60:19</a>). This is good Greek See the kindred verb anatello, "to rise" (the Septuagint, <a onClick="return mV(\'Isa\',60,1);">Isa 60:1</a>; <a onClick="return mV(\'Mal\',4,2);">Mal 4:2</a>).<P>What is the meaning of anatole in <a onClick="return mV(\'Luk\',1,78);">Lu 1:78</a>? Certainly not branch; that does not fit any of the facts, unless it be rendered "branch of light" (see Reynolds, John the Baptist, 115).<P>It occurs in Zacharias\' hymn over the birth of his son. The ode consists of two parts, "The glory and security of the Messiah\'s kingdom," and "The glory of the Forerunner." The expression before us is in the latter part. It naturally refers, therefore, not to the Messiah himself, but to John. He is the dayspring from on high who hath visited the people who sat in darkness and the shadow of death. With Godet we believe that the picture is borrowed from the caravan which has missed its way in the desert. The unfortunate pilgrims, overtaken by the night, are sitting down expecting death, when suddenly a star brightly beams above them. They take courage at the sight. The whole caravan leaps to its feet. It is the herald of the coming day and soon they see the great orb himself filling the east with orient pearl and gold. Is not one tempted to go a little farther and see here the morning star, herald of the coming sun to be obliterated by his rising? \'He must wax, but I must wane\' (<a onClick="return mV(\'Jhn\',3,30);">Joh 3:30</a>). What was John\'s work but, by his own testimony, to guide the benighted pilgrims into the way of peace, that is, to Him who was the Prince of Peace? If, however, as by most commentators, it be taken to refer to the Messiah, it probably implies prophetic knowledge that the conception of Jesus had already taken place, and that the Messianic era was at hand, when the Jewish world should be filled with spiritual splendor.`<a href="./study/isbe/search.html?string=DAY+STAR">DAY-STAR</a>`177';
isbe[2572]='Deacon; Deaconess`de\'-k\'-n, de\'-k\'-n-es: The term diakonos, and its cognates occur many times in the New Testament, as do its synonyms huperetes, and doulos, with their respective cognates. It may be said in general that the terms denote the service or ministration of the bondservant (doulos), underling (huperetes) or helper (diakonos), in all shades and gradations of meaning both literal and metaphorical. It would serve no useful purpose to list and discuss all the passages in detail. Christianity has from the beginning stood for filial service to God and His kingdom and for brotherly helpfulness to man, and hence, terms expressive of these functions abound in the New Testament. It behooves us to inquire whether and where they occur in a technical sense sufficiently defined to denote the institution of a special ecclesiastical office, from which the historical diaconate may confidently be said to be derived.<P>Many have sought the origin of the diaconate in the institution of the Seven at Jerusalem (<a onClick="return mV(\'Act\',6,1);">Ac 6</a>), and this view was countenanced by many of the church Fathers.<P>The Seven were appointed to "serve tables" (diakonein trapezais), in order to permit the Twelve to "continue stedfastly in prayer, and in the ministry (diakonia) of the word." They are not called deacons (diakonoi), and the qualifications required are not the same as those prescribed by Paul in <a onClick="return mV(\'1Ti\',3,\'8-12\');">1Ti 3:8-12</a>; furthermore, Stephen appears in Acts preeminently as a preacher, and Philip as an evangelist. Paul clearly recognizes women as deaconesses, but will not permit a woman to teach (<a onClick="return mV(\'1Ti\',2,12);">1Ti 2:12</a>). The obvious conclusion is that the Seven may be called the first deacons only in the sense that they were the earliest recorded helpers of the Twelve as directors of the church, and that they served in the capacity, among others, of specially appointed ministrants to the poor.<P>Paul says, "I commend unto you Phoebe our sister, who is a servant (the Revised Version, margin "or, deaconess") of the church that is at Cenchrea" (<a onClick="return mV(\'Rom\',16,1);">Ro 16:1</a>). This is by many taken as referring to an officially appointed deaconess; but the fact that there is in the earlier group of Paul\'s epistles no clear evidence of the institution of the diaconate, makes against this interpretation. Phoebe was clearly an honored helper in the church closely associated with that at Corinth, where likewise evidence of special ecclesiastical organization is wanting.<P>In <a onClick="return mV(\'Phl\',1,1);">Php 1:1</a> Paul and Timothy send greetings "to all the saints...at Philippi, with the bishops and deacons." Here then we find mention of "deacons" in a way to suggest a formal diaconate; but the want of definition as to their qualifications and duties renders it impossible to affirm with certainty the existence of the office.<P>In <a onClick="return mV(\'1Ti\',3,\'8-12\');">1Ti 3:8-12</a>, after prescribing the qualifications and the method of appointment of a bishop or overseer, Paul continues: "Deacons in like manner must be grave, not double-tongued, not given to much wine, not greedy of filthy lucre; holding the mystery of the faith in a pure conscience. And let these also first be proved; then let them serve as deacons, if they be blameless. Women in like manner must be grave, not slanderers, temperate, faithful in all things. Let deacons be husbands of one wife, ruling their children and their own houses well." Deacons and deaconesses are here provided for, and the character of their qualifications makes it clear that they were to be appointed as dispensers of alms, who should come into close personal relations with the poor.<P>We conclude, therefore, that the Seven and Phoebe did not exercise the diaconate in a technical sense, which appears first certainly in <a onClick="return mV(\'1Ti\',3,\'1-\');">1Ti 3</a>, although it is not improbably recognized in <a onClick="return mV(\'Phl\',1,1);">Php 1:1</a>, and was foreshadowed in the various agencies for the dispensing of alms and the care of the poor of the church instituted in various churches at an earlier date.`<a href="./study/isbe/search.html?string=BISHOP">BISHOP</a>; <a href="./study/isbe/search.html??string=CHURCH">CHURCH</a>; <a href="./study/isbe/search.html??string=CHURCH+GOVERNMENT">CHURCH GOVERNMENT</a>`75';
isbe[2573]='Dead`ded (muth; nekros): Used in several senses:<P>(1) as a substantive, denoting the body deprived of life, as when Abraham speaks of burying his dead (<a onClick="return mV(\'Gen\',23,1);">Ge 23</a>);<P>(2) as a collective noun including all those that have passed away from life (as <a onClick="return mV(\'Rev\',20,12);">Re 20:12</a>). In several passages dead in this sense is used in contrast to the quick or living (as <a onClick="return mV(\'Num\',16,48);">Nu 16:48</a>). This collective mode of expression is used when resurrection is described as "rising from the dead";<P>(3) as an adjective, coupled with body, carcass or man, as <a onClick="return mV(\'Deu\',14,8);">De 14:8</a> the King James Version;<P>(4) most frequently it is used as a complement of the verb "to be," referring to the condition of being deceased or the period of death, e. g. <a onClick="return mV(\'2Sa\',12,19);">2Sa 12:19</a>; <a onClick="return mV(\'Mar\',5,35);">Mr 5:35</a>;<P>(5) in the sense of being liable to death it occurs in <a onClick="return mV(\'Gen\',20,3);">Ge 20:3</a>; <a onClick="return mV(\'Exd\',12,33);">Ex 12:33</a>; <a onClick="return mV(\'2Sa\',16,9);">2Sa 16:9</a>;<P>(6) as an intensive adjective it is used in the phrase "dead sleep," to mean profound sleep simulating death (<a onClick="return mV(\'Psa\',76,6);">Ps 76:6</a>);<P>(7) figuratively "dead" is used to express the spiritual condition of those who are unable to attain to the life of faith. They are dead in trespasses, as in <a onClick="return mV(\'Eph\',2,1);">Eph 2:1</a>, or conversely, those who by the New Birth are delivered from sin, are said to be dead to the Law (as <a onClick="return mV(\'Col\',2,20);">Col 2:20</a>, etc.). A faith which does not show its life in the practical virtues of Christianity is called dead (<a onClick="return mV(\'Jam\',2,17);">Jas 2:17</a>);<P>(8) in <a onClick="return mV(\'Rom\',4,19);">Ro 4:19</a>; <a onClick="return mV(\'Hbr\',11,12);">Heb 11:12</a>, "dead" signifies the senile condition of loss of vigor and virility.<P>The passage in <a onClick="return mV(\'Job\',26,5);">Job 26:5</a>, wherein in the King James Version "dead things" seem to mean things that never had life, is more accurately translated in the Revised Version (British and American) as "they that are deceased," i.e. the shades of the dead.<P>There are few references to the physical accompaniments of the act of dying. Deborah has a poetical account of the death of Sisera (<a onClick="return mV(\'Jdg\',5,24);">Jud 5:24</a>ff), and in <a onClick="return mV(\'Ecc\',12,\'1-\');">Ec 12</a>, where the failure of the bodily faculties in old age culminates in death, it is pictorially compared to the breaking of a lamp extinguishing the flame ("golden" being probably used of "oil," as it is in <a onClick="return mV(\'Zec\',4,12);">Zec 4:12</a>), and the loosing of the silver chebhel or chain by which the lamp is suspended in the tent of the Arabic.<P>The dead body defiled those who touched it (<a onClick="return mV(\'Lev\',11,31);">Le 11:31</a>) and therefore sepulture took place speedily, as in the case of Lazarus (<a onClick="return mV(\'Jhn\',11,\'17-39\');">Joh 11:17-39</a>) and Ananias and Sapphira (<a onClick="return mV(\'Act\',5,\'6-10\');">Ac 5:6-10</a>). This practice is still followed by the fellahin.<P>The uselessness of the dead is the subject of proverb (<a onClick="return mV(\'Ecc\',9,4);">Ec 9:4</a>) and the phrase "dead dog" is used as a contemptuous epithet as of a person utterly worthless (<a onClick="return mV(\'1Sa\',24,14);">1Sa 24:14</a>; <a onClick="return mV(\'2Sa\',9,8);">2Sa 9:8</a>; <a onClick="return mV(\'2Sa\',16,9);">16:9</a>).``107';
