isbe = [];

isbe[1701]='Bridegroom; Bridegroom, Friend of`brid\'-groom;`<a href="./study/isbe/search.html?string=MARRIAGE">MARRIAGE</a>`1';
isbe[1702]='Bridge`brij (gephura, 2Macc 12:13 the King James Version; the Revised Version (British and American) <a href="./study/isbe/search.html?string=GEPHYRUN">GEPHYRUN</a>): Does not occur in the canonical Scriptures, unless it be indirectly in the proper name Geshur (geshur, <a onClick="return mV(\'2Sa\',3,3);">2Sa 3:3</a>; <a onClick="return mV(\'2Sa\',13,37);">13:37</a>; <a onClick="return mV(\'2Sa\',15,8);">15:8</a>; <a onClick="return mV(\'1Ch\',2,23);">1Ch 2:23</a>, and others). The so-called Jacob\'s bridge is said to mark the site where Jacob crossed the upper Jordan on his return from Paddan-aram, but, of course, does not date from the time of the patriarch. There are traces of ancient bridges across the Jordan in the vicinity of the Lake of Gennesaret, over the Arnon and over other rivers which enter the Jordan from the east; but none of them seem to date farther back than the Roman period. <a onClick="return mV(\'Nah\',2,6);">Na 2:6</a>, in which the Chaldaic paraphrase renders "bridges," evidently refers to dikes or weirs. Judas Maccabeus is said to have planted a bridge in order to besiege the town of Casphor (2Macc 12:13). Josephus (Ant., V, i, 3) tells us that the Jordan, before the passage of the Israelites, had never been bridged, evidently implying that in his own time bridges had been constructed over it, which was the case, under the Romans. The bridge connecting the temple with the upper part of the city of which Josephus speaks (War, VI, vi, 2; Ant, XV, xi, 5) probably was a viaduct.``77';
isbe[1703]='Bridle`bri\'-d\'-l.`<a href="./study/isbe/search.html?string=BIT+AND+BRIDLE">BIT AND BRIDLE</a>`1';
isbe[1704]='Brier`bri\'-er.`<a href="./study/isbe/search.html?string=THORNS">THORNS</a>`1';
isbe[1705]='Brigandine`brig\'-an-den.`<a href="./study/isbe/search.html?string=ARMS">ARMS</a>; <a href="./study/isbe/search.html?string=COAT+OF+MAIL">COAT OF MAIL</a>`1';
isbe[1706]='Brightness`brit\'-nes: Used by the King James Version in <a onClick="return mV(\'Hbr\',1,3);">Heb 1:3</a> for "effulgence of his glory," as in the Revised Version (British and American) and the American Standard Revised Version. The Greek apaugasma may mean either "reflection" or "radiation." Patristic usage favors the latter; compare The <span class="noTag">Wisdom of Solomon</span> 7:26; also the Nicene Creed: "Light of Light," i.e. the Son not only manifests the Father, but is of the same substance. "What emanates from light, must have the nature of light" (Delitzsch).``1';
isbe[1707]='Brim`qatseh or qetseh = "an extremity" (in a variety of applications and idioms), "border," "edge," "side," "shore" (<a onClick="return mV(\'Jos\',3,15);">Jos 3:15</a> the King James Version; the Revised Version (British and American) "brink"); also saphah or sepheth = "edge," "lip" (<a onClick="return mV(\'1Ki\',7,23,24,26);">1Ki 7:23-24, 26</a>; <a onClick="return mV(\'2Ch\',4,2,5);">2Ch 4:2, 5</a>). In <a onClick="r,eturn mV(\'Jhn\',2,7);">Joh 2:7</a>, the adverb ano, is used to emphasize the verb egemisan = "to fill," thus giving the idea of "filling to the top."``1';
isbe[1708]='Brimstone`brim\'-ston, brim\'-stun (gophrith; to theion): The word translated "brimstone" probably referred originally to the pitch of trees, like the cypress. By analogy it has been rendered "brimstone" because of the inflammability of both substances. Sulphur existed in Palestine in early times and was known by most of the ancient nations as a combustible substance. In the vicinity of the Dead Sea, even at the present time, deposits of sulphur are being formed. Blanckenhorn (ZDPV, 1896) believes that this formation is due to the action of bituminous matter upon gypsum, as these two substances are found associated with each other in this district. Travelers going from Jericho to the Dead Sea may pick up lumps of sulphur, which are usually encrusted with crystals of gypsum. <a onClick="return mV(\'Deu\',29,23);">De 29:23</a> well describes the present aspect of this region. That the inhabitants of the land had experienced the terrors of burning sulphur is very probable. Once one of these deposits took fire it would melt and run in burning streams down the ravines spreading everywhere suffocating fumes such as come from the ordinary brimstone match. No more realistic figure could be chosen to depict terrible suffering and destruction. It is not at all unlikely that during some of the disastrous earthquakes which took place in this part of the world, the hot lava sent forth ignited not only the sulphur, but also the bitumen, and added to the horrors of the earthquake the destruction caused by burning pitch and brimstone.<P>The figurative use of the word brimstone to denote punishment and destruction is illustrated by such passages as <a onClick="return mV(\'Deu\',29,23);">De 29:23</a>; <a onClick="return mV(\'Job\',18,15);">Job 18:15</a>; <a onClick="return mV(\'Psa\',11,6);">Ps 11:6</a>; <a onClick="return mV(\'Isa\',30,33);">Isa 30:33</a>; <a onClick="return mV(\'Eze\',38,22);">Eze 38:22</a>; <a onClick="return mV(\'Luk\',17,29);">Lu 17:29</a>; <a onClick="return mV(\'Rev\',9,17);">Re 9:17</a>.``133';
isbe[1709]='Bring`dasha\' = "to sprout," "spring" (<a onClick="return mV(\'Gen\',1,11);">Ge 1:11</a> the King James Version); sharats = "to wriggle," "swarm" (<a onClick="return mV(\'Gen\',1,20);">Ge 1:20</a>f; <a onClick="return mV(\'Gen\',9,9);">9:7</a>; <a onClick="return mV(\'Exd\',8,3);">Ex 8:3</a>); yaladh = "to bear," "beget" (<a onClick="return mV(\'Gen\',3,16);">Ge 3:16</a>; <a onClick="return mV(\'2Ki\',19,3);">2Ki 19:3</a>; <a onClick="return mV(\'Job\',15,35);">Job 15:35</a>; <a onClick="return mV(\'Job\',39,1,2);">39:1-2</a>; "what a day may bring forth," <a onClick="return mV(\'Pro\',27,1);">Pr 27:1</a>; "before the decree bring forth," <a onClick="return mV(\'Zep\',2,2);">Ze 2:2</a>); \'anan = "to cloud over," "to darken" (<a onClick="return mV(\'Gen\',9,14);">Ge 9:14</a>); shalach = "to send on," "to escort" (<a onClick="return mV(\'Gen\',18,16);">Ge 18:16</a>); shubh = "to turn back," "bring" (again, back, home again), "fetch," "establish" (<a onClick="return mV(\'Gen\',24,5,6,8);">Ge 24:5-6, 8</a>; <a onClick="return mV(\'Job\',10,9);">Job 10:9</a>; <a onClick="return mV(\'Psa\',68,22);">Ps 68:22</a>; "bring him back to see," <a onClick="return mV(\'Ecc\',3,22);">Ec 3:22</a>; <a onClick="return mV(\'Zec\',10,6,10);">Zec 10:6, 10</a>); naghash = "present," "adduce" (an argument) (<a onClick="return mV(\'1Sa\',13,9);">1Sa 13:9</a>; <a onClick="return mV(\'1Sa\',15,32);">15:32</a>; <a onClick="return mV(\'1Sa\',23,9);">23:9</a>; <a onClick="return mV(\'1Sa\',30,7);">30:7</a>; "bring forth your strong reasons," <a onClick="return mV(\'Isa\',41,21,22);">Isa 41:21-22</a>); \'asah = "to do," "cause to be," "accomplish" (<a onClick="return mV(\'Psa\',37,5);">Ps 37:5</a>); \'alah = "to carry up," "exalt," "restore" (<a onClick="return mV(\'Gen\',46,4);">Ge 46:4</a>; <a onClick="return mV(\'Exd\',3,8,17);">Ex 3:8, 17</a>; <a onClick="return mV(\'Exd\',33,12);">33:12</a>; <a onClick="return mV(\'Psa\',71,20);">Ps 71:20</a>; <a onClick="return mV(\'Hsa\',12,13);">Ho 12:13</a>); nagha\' = "to touch," "lay hand upon," "reach to" (<a onClick="return mV(\'Lev\',5,7);">Le 5:7</a>); kabhadh, or kabhedh = "to be heavy" (causative "to make weighty"), "to be glorious" (<a onClick="return mV(\'Pro\',4,8);">Pr 4:8</a>); kana\' = "to bend the knee," hence "humiliate," "bring" (down, into subjection, under), "subdue" (<a onClick="return mV(\'Deu\',9,3);">De 9:3</a>; <a onClick="return mV(\'Isa\',25,5);">Isa 25:5</a>); zakhar = "to mark," "call to, put (put in) remembrance" (<a onClick="return mV(\'Psa\',38,1);">Ps 38</a> title; <a onClick="return mV(\'Psa\',70,1);">Ps 70</a> title); yabhal = "to flow," "bring" (especially with pomp) (<a onClick="return mV(\'Psa\',60,9);">Ps 60:9</a>; <a onClick="return mV(\'Psa\',68,29);">68:29</a>; <a onClick="return mV(\'Psa\',76,11);">76:11</a>; <a onClick="return mV(\'Zep\',3,10);">Ze 3:10</a>); chul, or chil = "to writhe in pain," "to be in travail" (<a onClick="return mV(\'Isa\',66,8);">Isa 66:8</a>); tsa\'adh = "to step regularly," "march," "hurl" (<a onClick="return mV(\'Job\',18,14);">Job 18:14</a>); halakh = "to walk," "get" (<a onClick="return mV(\'Hsa\',2,14);">Ho 2:14</a>); gadhal = "bring up," "increase" (<a onClick="return mV(\'Hsa\',9,12);">Ho 9:12</a>).<P>The New Testament employs telesphoreo = "to bring to maturity," "to ripen" (<a onClick="return mV(\'Luk\',8,14);">Lu 8:14</a>); hupomimnesko = "to bring to mind," "suggest," "bring to remembrance" (<a onClick="return mV(\'Jhn\',14,26);">Joh 14:26</a>); douloo = "to enslave" (<a onClick="return mV(\'Act\',7,6);">Ac 7:6</a>); suntrophos = "brought up with" (<a onClick="return mV(\'Act\',13,1);">Ac 13:1</a> the Revised Version (British and American), "the foster-brother of"): diasozo = "to save," "to care," "rescue" (<a onClick="return mV(\'Act\',23,24);">Ac 23:24</a>); atheteo = "to set aside" "cast off," "bring to naught" (<a onClick="return mV(\'1Cr\',1,19);">1Co 1:19</a>); katargeo = "to abolish," "destroy," "do away," "put away," "make void" (<a onClick="return mV(\'1Cr\',1,28);">1Co 1:28</a>); propempo = "to send forward," "bring forward" (<a onClick="return mV(\'1Cr\',16,6);">1Co 16:6</a> the King James Version; <a onClick="return mV(\'Tts\',3,13);">Tit 3:13</a> the King James Version; <a onClick="return mV(\'3Jo\',1,6);">3Joh 1:6</a> the King James Version); ektrepho = "to rear up to maturity," "to cherish," "nourish" (<a onClick="return mV(\'Eph\',6,4);">Eph 6:4</a> the King James Version).``77';
isbe[1710]='Brink`brink: saphah, or sepheth = "the lip," "margin," "bank," "edge" (<a onClick="return mV(\'Gen\',41,3);">Ge 41:3</a>; <a onClick="return mV(\'Exd\',2,3);">Ex 2:3</a>; <a onClick="return mV(\'Exd\',7,15);">7:15</a>); qatseh, or qetseh = "an extremity," "border," "brim" (<a onClick="return mV(\'Jos\',3,8,15);">Jos 3:8, 15</a>; <a onClick="return mV(\'Isa\',19,7);">Isa 19:7</a>; <a onClick="return mV(\'Dan\',12,5);">Da 12:5</a>).`<a href="./study/isbe/search.html?string=BRIM">BRIM</a>`1';
isbe[1711]='Broad`brod (rochabh, "width"; rechobh, "a broadway," "street," "court"; eurchoros, "spacious"): Occurs frequently as a term of dimension (<a onClick="return mV(\'Exd\',27,1);">Ex 27:1</a>; <a onClick="return mV(\'1Ki\',6,6);">1Ki 6:6</a>; <a onClick="return mV(\'Eze\',40,6,43);">Eze 40:6, 43</a> the Revised Version (British and American), "handbreadth long") and as indicative of strength (<a onClick="return mV(\'Neh\',3,8);">Ne 3:8</a>; <a onClick="return mV(\'Jer\',51,58);">Jer 51:58</a>). The centers of communal life are called the "broad places," often rendered "streets" (<a onClick="return mV(\'Jer\',5,1);">Jer 5:1</a>; <a onClick="return mV(\'Sgs\',3,2);">So 3:2</a>; <a onClick="return mV(\'Nah\',2,4);">Na 2:4</a>). A court before the temple: "the broad place on the east" (the King James Version "the east street," <a onClick="return mV(\'2Ch\',29,4);">2Ch 29:4</a>); "broad plates" (<a onClick="return mV(\'Num\',16,38,39);">Nu 16:38-39</a>, the Revised Version (British and American) "beaten").<P>Figurative: Relief from distress: "Yea, he would have allured thee out of (Hebrew "the mouth of") distress into a broad place" (<a onClick="return mV(\'Job\',36,16);">Job 36:16</a>); the liberty of obedience or liberty within the law (<a onClick="return mV(\'Psa\',119,96);">Ps 119:96</a>, "broad," "roomy," "at liberty"); the all-sufficiency of God for His people (<a onClick="return mV(\'Isa\',33,21);">Isa 33:21</a>). Jerusalem could not boast of a river or navy—Yahweh\'s presence with and within her would more than supply these deficiencies; the road to destruction: "Broad is the way, that leadeth to destruction" (<a onClick="return mV(\'Mat\',7,13);">Mt 7:13</a>); the ostentatious piety of the Pharisees: "They make broad (platuno, "widen") their phylacteries" (<a onClick="return mV(\'Mat\',23,5);">Mt 23:5</a>).`<a href="./study/isbe/search.html?string=CITY">CITY</a>; <a href="./study/isbe/search.html?string=GATE">GATE</a>`86';
isbe[1712]='Broad Place``<a href="./study/isbe/search.html?string=CITY">CITY</a>`1';
isbe[1713]='Broidered`broid\'-erd:<P>(1) riqmah, "variegation of color" (<a onClick="return mV(\'Eze\',16,10,13,18);">Eze 16:10, 13, 18</a>; <a onClick="return mV(\'Eze\',26,16);">26:16</a>; <a onClick="return mV(\'Eze\',27,7,16,24);">27:7, 16, 24</a>);<P>(2) tashbets, "checkered stuff" (as reticulated). The high priest\'s garments consisted of "a breastplate, and an ephod, and a robe, and a broidered coat (<a onClick="return mV(\'Exd\',28,4);">Ex 28:4</a> the King James Version; the Revised Version (British and American) "a coat of checker work"), a miter, and a girdle";<P>(3) plegma, "twined or plaited work" (<a onClick="return mV(\'1Ti\',2,9);">1Ti 2:9</a> the King James Version).`<a href="./study/isbe/search.html?string=BRAIDED">BRAIDED</a>; <a href="./study/isbe/search.html?string=EMBROIDERY">EMBROIDERY</a>`1';
isbe[1714]='Broken`bro\'-k\'-n: Occurs both as past participle of the verb translated "to break" and as an adjective, the former use will be dealt with here only so far as verbs occur which are thus translated but do not present the non-participial forms. Such are: meroach = "bruised," "emasculated" (<a onClick="return mV(\'Lev\',21,20);">Le 21:20</a>); chathath = "to frustrate," hence, "to break down" either by violence or by confusion and fear (<a onClick="return mV(\'1Sa\',2,10);">1Sa 2:10</a>; <a onClick="return mV(\'Jer\',48,20,39);">Jer 48:20, 39</a>); dakhah = "to collapse" (<a onClick="return mV(\'Psa\',44,19);">Ps 44:19</a>; <a onClick="return mV(\'Psa\',51,8);">51:8</a>); ratsats = "to crack in pieces" "crush" (<a onClick="return mV(\'Ecc\',12,6);">Ec 12:6</a>); kathath = "to bruise or violently strike," "break in pieces" (<a onClick="return mV(\'Isa\',30,14);">Isa 30:14</a>); <a onClick="return mV(\'Jer\',2,16);">Jer 2:16</a> should evidently be rendered: "have grazed on the crown of thy head," instead of the King James Version "have broken," etc., for ra\'ah = "to tend a flock," "pasture," "graze," but gives no hint of the meaning "to break"; \'alah = "to arise," "depart" (<a onClick="return mV(\'Jer\',37,11);">Jer 37:11</a>); sunthlao = "to dash together," "shatter" (<a onClick="return mV(\'Mat\',21,44);">Mt 21:44</a>); exorusso = "to dig through," "to extract," "remove" (<a onClick="return mV(\'Mar\',2,4);">Mr 2:4</a>).`<a href="./study/isbe/search.html?string=BREAK">BREAK</a>`77';
isbe[1715]='Brokenfooted`bro\'-k\'-n-foot-ed (shebher reghel): In <a onClick="return mV(\'Lev\',21,19);">Le 21:19</a>, one of the blemishes which prevented a man of priestly descent from the execution of the priestly office.``1';
isbe[1716]='Brokenhanded`bro\'-k\'-n-hand-ed (shebher yadh): In <a onClick="return mV(\'Lev\',21,19);">Le 21:19</a> one of the blemishes which prevented a man of priestly descent from the execution of the priestly office.``1';
isbe[1717]='Brokenhearted`bro\'-k\'-n-har-ted (shabhar lebh; suntetrimmenoi ten kardian; <a onClick="return mV(\'Psa\',69,20,21);">Ps 69:20-21</a>; <a onClick="return mV(\'Isa\',61,1);">Isa 61:1</a>; <a onClick="return mV(\'Luk\',4,18);">Lu 4:18</a> the King James Version; "of a broken heart," <a onClick="return mV(\'Psa\',34,18);">Ps 34:18</a>; "broken in heart," <a onClick="return mV(\'Psa\',147,3);">Ps 147:3</a>): People who feel their spiritual bankruptcy and helplessness, and who long for the help and salvation of God. Such people are in the right condition to be met and blessed by God. Compare "of contrite spirit" (<a onClick="return mV(\'Psa\',31,18);">Ps 31:18</a>; <a onClick="return mV(\'Isa\',66,2);">Isa 66:2</a>).``1';
isbe[1718]='Brooch`broch (chach): Used in plural by the Revised Version (British and American) (the King James Version "bracelets") for a class of "jewels of gold" brought as offerings by both men and women of Israel (<a onClick="return mV(\'Exd\',35,22);">Ex 35:22</a>). "Brooches," as Mackie says, is unoriental. The Hebrew word means most likely nose-rings.`<a href="./study/isbe/search.html?string=BRACELET">BRACELET</a>; <a href="./study/isbe/search.html?string=RING">RING</a>`1';
isbe[1719]='Brook`brook (nachal, \'aphiq, ye\'or, mikhal; cheimarrhos): In Palestine there are few large streams. Of the smaller ones many flow only during the winter, or after a heavy rain. The commonest Hebrew word for brook is nachal, which is also used for river and for valley, and it is not always clear whether the valley or the stream in the valley is meant (<a onClick="return mV(\'Num\',13,23);">Nu 13:23</a>; <a onClick="return mV(\'Deu\',2,13);">De 2:13</a>; <a onClick="return mV(\'2Sa\',15,23);">2Sa 15:23</a>). The Arabic wady, which is sometimes referred to in this connection, is not an exact parallel, for while it may be used of a dry valley or of a valley containing a stream, it means the valley and not the stream. \'Aphiq and ye\'or are translated both "brook" and "river," ye\'or being generally used of the Nile (<a onClick="return mV(\'Exd\',1,22);">Ex 1:22</a>, etc.), though in <a onClick="return mV(\'Dan\',12,\'5-7\');">Da 12:5-7</a>, of the Tigris. Cheirnarrhos, "winter-flowing," is applied in <a onClick="return mV(\'Jhn\',18,1);">Joh 18:1</a> to the Kidron. Many of the streams of Palestine which are commonly called rivers would in other countries be called brooks, but in such a dry country any perennial stream assumes a peculiar importance.``37';
isbe[1720]='Brook of Egypt, the`(nachal = "a flowing stream," "a valley"; best translated by the oriental word wady, which means, as the Hebrew word does, both a stream and its valley).<P>1. Name:<P>The Brook of Egypt is mentioned six times in the Old Testament (<a onClick="return mV(\'Num\',34,5);">Nu 34:5</a>; <a onClick="return mV(\'Jos\',15,4,47);">Jos 15:4, 47</a>; <a onClick="return mV(\'1Ki\',8,65);">1Ki 8:65</a>; <a onClick="return mV(\'Isa\',27,12);">Isa 27:12</a>); once, <a onClick="return mV(\'Gen\',15,18);">Ge 15:18</a>, by another word, nahar. The Brook of Egypt was not an Egyptian stream at all, but a little desert stream near the borderland of Egypt a wady of the desert, and, perhaps, the dividing line between Canaan and Egypt. It is usually identified with the Wady el \'Arish of modern geography.<P>2. Description:<P>The Brook of Egypt comes down from the plateau et Tih in the Sinai peninsula and falls into the Mediterranean Sea at latitude 31 deg., 5 min., North, longitude 33 deg., 42 min., East. Its source is at the foot of the central mountain group of the peninsula. The upper portion of the wady is some 400 ft. above the sea. Its course, with one sharp bend to the west in the upper part, runs nearly due north along the western slope of the plateau. Its whole course of 140 miles lies through the desert. These streams in the Sinai peninsula are usually dry water-courses, which at times become raging rivers, but are very seldom babbling "brooks." The floods are apt to come with little or no warning when cloudbursts occur in the mountain region drained.<P>3. Archaeology:<P>The use of the Hebrew word nachal for this wady points to a curious and most interesting and important piece of archaeological evidence on the critical question of the origin of the Pentateuch. In the Pentateuch, the streams of Egypt are designated by an Egyptian word (ye\'or) which belongs to Egypt, as the word bayou does to the lower Mississippi valley, while every other stream mentioned, not except this desert stream, "the Brook of Egypt," is designated by one or other of two Hebrew words, na chal and nahar. Each of these words occurs 13 times in the Pentateuch, but never of the streams of Egypt. The use of nahar in <a onClick="return mV(\'Exd\',7,19);">Ex 7:19</a> in the account of the plagues is not really an exception for the word is then used generically in contrast with ye\'or to distinguish between the "flowing streams," neharoth, and the sluggish irrigation branches of the Nile, ye\'orim, "canals" (compare <a href="./study/isbe/search.html?string=CANALS">CANALS</a>) (<a onClick="return mV(\'Isa\',19,6);">Isa 19:6</a>; <a onClick="return mV(\'Isa\',33,21);">33:21</a>), while ye\'or occurs 30 times but never of any other than the streams of Egypt. There is thus a most exa ct discrimination in the use of these various words, a discrimination which is found alike in the Priestly Code (P), Jahwist (Jahwist), and Elohim (E) of the documentary theory, and also where the editor is supposed to have altered the documents. Such discrimination is scarcely credible on the hypothesis that the Pentateuch is by more than one author, in later than Mosaic times, or that it is by any author without Egyptian training. The documentary theory which requires these instances of the use of these various words for "river" to have been recorded by several different authors or redactors, in different ages and all several centuries after the Exodus, far away from Egypt and opportunities for accurate knowledge of its language, seems utterly incompatible with such discriminating use of these words. And even if the elimination of all mistakes be attributed to one person, a final editor, the difficulty is scarcely lessened. For as no purpose is served by this discriminating use of words, it is evidently a natural phenomenon. In every instance of the use of ye\'or, one or other of the usual Hebrew words, nachal or nahar would have served the purpose of the author, just as any foreign religious writer might with propriety speak of the "streams of Louisiana," though a Louisianian would certainly call them "bayous." How does the author come to use ye\'or even where his native Hebrew words might have been used appropriately? Why never, where its appropriateness is even doubtful, not even saying ye\'or for nachal of the "Brook of Egypt"? It is not art, but experience, in the use of a language which gives such skill as to attend to so small a thing in so extensive use without a single mistake. The only time and place at which such experience in the use of Egyptian words is to be expected in Israel is among the people of the Exodus not long subsequent to that event.``93';
isbe[1721]='Broom`broom: Occurs in <a onClick="return mV(\'1Ki\',19,4);">1Ki 19:4</a> m ("broomtree"); <a onClick="return mV(\'Job\',30,4);">Job 30:4</a>, and <a onClick="return mV(\'Psa\',120,4);">Ps 120:4</a> m as the translation of the Hebrew rothem, where the King James Version employed "juniper" which is retained in the Revised Version (British and American) text in <a onClick="return mV(\'1Ki\',19,4);">1Ki 19:4</a> and <a onClick="return mV(\'Job\',30,4);">Job 30:4</a>. Juniper is certainly incorrect and broom is not a particularly happy rendering. The rothem was doubtless the shrub called by the Arabs ratam, a shrub which casts so little shadow that it would be used for shade only when there was no other refuge from the desert sun, and would be eaten only in case of the direst necessity, but which could be burned and used for the making of charcoal.`<a href="./study/isbe/search.html?string=JUNIPER">JUNIPER</a>`51';
isbe[1722]='Broth`broth (maraq): Equivalent to our "soup." When Gideon (<a onClick="return mV(\'Jdg\',6,19);">Jud 6:19</a>) made ready a kid, "the flesh he put in a basket," but, it is added, "he put the broth in a pot"; and he is told by the angel to "pour out the broth" (<a onClick="return mV(\'Jdg\',6,20);">Jud 6:20</a>). <a onClick="return mV(\'Isa\',65,4);">Isaiah 65:4</a> makes Yahweh speak of rebellious Israel as "a people that provoke me to my face continually sacrificing in gardens," and adds in description "that eat swine\'s flesh, and broth of abominable things is in their vessels" (maraq, paraq).`<a href="./study/isbe/search.html?string=FOOD">FOOD</a>`1';
isbe[1723]='Brother`bruth\'-er (\'ach; adelphos = kin by birth, from the same parents or parent): Used extensively in both Old Testament and New Testament of other relations and relationships, and expanding under Christ\'s teaching to include the universal brotherhood of man. Chiefly employed in the natural sense, as of Cain and Abel (<a onClick="return mV(\'Gen\',4,8);">Ge 4:8</a>); of Joseph and his brethren (<a onClick="return mV(\'Gen\',42,3);">Ge 42:3</a>); of Peter and Andrew, of James and John (<a onClick="return mV(\'Mat\',10,2);">Mt 10:2</a>). Of other relationships:<P>(1) Abram\'s nephew, Lot, is termed "brother" (<a onClick="return mV(\'Gen\',14,14);">Ge 14:14</a>);<P>(2) Moses\' fellow-countrymen are "brethren" (<a onClick="return mV(\'Exd\',2,11);">Ex 2:11</a>; <a onClick="return mV(\'Act\',3,22);">Ac 3:22</a>; compare <a onClick="return mV(\'Hbr\',7,5);">Heb 7:5</a>);<P>(3) a member of the same tribe (<a onClick="return mV(\'2Sa\',19,12);">2Sa 19:12</a>);<P>(4) an ally (<a onClick="return mV(\'Amo\',1,9);">Am 1:9</a>), or an allied or cognate people (<a onClick="return mV(\'Num\',20,14);">Nu 20:14</a>);<P>(5) used of common discipleship or the kinship of humanity (<a onClick="return mV(\'Mat\',23,8);">Mt 23:8</a>);<P>(6) of moral likeness or kinship (<a onClick="return mV(\'Pro\',18,9);">Pr 18:9</a>);<P>(7) of friends (<a onClick="return mV(\'Job\',6,15);">Job 6:15</a>);<P>(8) an equal in rank or office (<a onClick="return mV(\'1Ki\',9,13);">1Ki 9:13</a>);<P>(9) one of the same faith (<a onClick="return mV(\'Act\',11,29);">Ac 11:29</a>; <a onClick="return mV(\'1Cr\',5,11);">1Co 5:11</a>);<P>(10) a favorite oriental metaphor used to express likeness or similarity (<a onClick="return mV(\'Job\',30,29);">Job 30:29</a>, "I am a brother to jackals");<P>(11) a fellow-priest or office-bearer (<a onClick="return mV(\'Ezr\',3,2);">Ezr 3:2</a>); Paul called Sosthenes "brother" (<a onClick="return mV(\'1Cr\',1,1);">1Co 1:1</a>) and Timothy his spiritual son and associate (<a onClick="return mV(\'2Cr\',1,1);">2Co 1:1</a>);<P>(12) a brother-man, any member of the human family (<a onClick="return mV(\'Mat\',7,\'3-5\');">Mt 7:3-5</a>; <a onClick="return mV(\'Hbr\',2,17);">Heb 2:17</a>; <a onClick="return mV(\'Hbr\',8,11);">8:11</a>; <a onClick="return mV(\'1Jo\',2,9);">1Joh 2:9</a>; <a onClick="return mV(\'1Jo\',4,20);">4:20</a>);<P>(13) signifies spiritual kinship (<a onClick="return mV(\'Mat\',12,50);">Mat 12:50</a>);<P>(14) a term adopted by the early disciples and Christians to express their fraternal love for each other in Christ, and universally adopted as the language of love and brotherhood in His kingdom in all subsequent time (<a onClick="return mV(\'2Pe\',3,15);">2Pe 3:15</a>; <a onClick="return mV(\'Col\',4,7,9,15);">Col 4:7, 9, 15</a>).<P>The growing conception of mankind as a brotherhood is the outcome of this Christian view of believers as a household, a family (<a onClick="return mV(\'Eph\',2,19);">Eph 2:19</a>; <a onClick="return mV(\'Eph\',3,15);">3:15</a>; compare <a onClick="return mV(\'Act\',17,26);">Ac 17:26</a>). Jesus has made "neighbor" equivalent to "brother," and the sense of fraternal affection and obligation essential to vital Christianity, and coextensive with the world. The rabbis distinguished between "brother" and "neighbor," applying "brother" to Israelites by blood, "neighbor" to proselytes, but allowing neither title to the Gentiles. Christ and the apostles gave the name "brother" to all Christians, and "neighbor" to all the world (<a onClick="return mV(\'1Cr\',5,11);">1Co 5:11</a>; <a onClick="return mV(\'Luk\',10,29);">Lu 10:29</a>ff). The missionary passion and aggressiveness of the Christian church is the natural product of this Christian conception of man\'s true relation to man.`<a href="./study/isbe/search.html?string=FAMILY+RELATIONSHIPS">FAMILY RELATIONSHIPS</a>`139';
isbe[1724]='Brother\'s Wife`(yebhemeth = "a sister-in-law," "brother\'s wife" (<a onClick="return mV(\'Deu\',25,7,9);">De 25:7, 9</a>); \'ishshah = "a woman," "wife"; \'esheth \'ach = "brother\'s wife" (<a onClick="return mV(\'Gen\',38,8,9);">Ge 38:8-9</a>; <a onClick="return mV(\'Lev\',18,16);">Le 18:16</a>; <a onClick="return mV(\'Lev\',20,21);">20:21</a>); he gune tou adelphou = "the brother\'s wife" (<a onClick="return mV(\'Mar\',6,18);">Mr 6:18</a>)): A brother\'s wife occupies a unique position in Hebrew custom and law, by virtue of the institution of the Levirate. The widow had no hereditary rights in her husband\'s property, but was considered a part of the estate, and the surviving brother of the deceased was considered the natural heir. The right to inherit the widow soon became a duty to marry her if the deceased had left no sons, and in case there was no brother-in-law, the duty of marriage devolved on the father-in-law or the agnate who inherited, whoever this might be. The first son of the Levirate marriage was regarded as the son of the deceased. This institution is found chiefly among people who hold to ancestral worship (Indians, Persians, Afghans, etc.), from which circumstances Benzinger (New Sch-Herz, IV, 276) derives th e explanation of this institution in Israel. The Levirate marriage undoubtedly existed as a custom before the Israelite settlement in Canaan, but after this received special significance because of the succession to the property of the first son of the marriage, since he was reckoned to the deceased, inherited from his putative, not from his real father, thus preventing the disintegration of property and its acquirement by strangers, at the same time perpetuating the family to which it belonged. While the law limited the matrimonial duty to the brother and permitted him to decline to marry the widow, such a course was attended by public disgrace (<a onClick="return mV(\'Deu\',25,5);">De 25:5</a>ff). By the law of <a onClick="return mV(\'Num\',27,8);">Nu 27:8</a>, daughters were given the right to inherit, in order that the family estate might be preserved, and the Levirate became limited to cases where the deceased had left no children at all.``77';
isbe[1725]='Brother-In-Law``<a href="./study/isbe/search.html?string=RELATIONSHIPS,+FAMILY">RELATIONSHIPS, FAMILY</a>`1';
isbe[1726]='Brotherhood`bruth\'-er-hood: The rare occurrence of the term (only <a onClick="return mV(\'Zec\',11,14);">Zec 11:14</a> and <a onClick="return mV(\'1Pe\',2,17);">1Pe 2:17</a>) in contrast with the abundant use of "brother," "brethren," seems to indicate that the sense of the vital relation naturally called for the most concrete expression: "the brethren." But in <a onClick="return mV(\'1Pe\',2,17);">1Pe 2:17</a> the abstract is used for the concrete. In the Old Testament the brotherhood of all Israelites was emphasized; but in the New Testament the brotherhood in Christ is a relation so much deeper and stronger as to eclipse the other.`<a href="./study/isbe/search.html?string=BROTHER">BROTHER</a>; <a href="./study/isbe/search.html?string=BRETHREN">BRETHREN</a>`1';
isbe[1727]='Brotherly`bruth\'-er-li (\'ach, "brother"; philadelphia, "brotherly love"): Like a brother in all the large human relationships indicated above; e.g. the early friendly and fraternal alliance between Tyre and Israel as illustrated by "brotherly covenant" between David and Solomon, and Hiram, king of Tyre (<a onClick="return mV(\'2Sa\',5,11);">2Sa 5:11</a>; <a onClick="return mV(\'1Ki\',5,12);">1Ki 5:12</a>), and repudiated in a later generation by the treachery of Tyre (<a onClick="return mV(\'Amo\',1,9);">Am 1:9</a>).`<a href="./study/isbe/search.html?string=BROTHERLY+KINDNESS;+BROTHERLY+LOVE">BROTHERLY KINDNESS (LOVE)</a>`1';
isbe[1728]='Brotherly Kindness; Brotherly Love`kind\'-nes (the King James Version <a onClick="return mV(\'2Pe\',1,7);">2Pe 1:7</a>), or <a href="./study/isbe/search.html?string=LOVE">LOVE</a> (the King James Version <a onClick="return mV(\'Rom\',12,10);">Ro 12:10</a>; <a onClick="return mV(\'1Th\',4,9);">1Th 4:9</a>; <a onClick="return mV(\'Hbr\',13,1);">Heb 13:1</a>; philadelphia):<P>1. As Moral Ideal:<P>In the Revised Version (British and American), "love of the brethren" in all places, and so in the King James Version of <a onClick="return mV(\'1Pe\',1,22);">1Pe 1:22</a>, thus defining the disposition as love, and its objects as brethren. Since God is Father and men are His sons, they are therefore brethren of one another. As sonship is the most essential factor in man\'s right relation to God, so is brotherhood in his relation to his fellow-man. Brotherhood is first known as the relation between sons of the same parent, a relation of tender affection and benevolence. It becomes gradually extended to kindred, and to members of the same tribe or nation. And the Christian ideal of society is that a similar relation should exist between all men without limit or distinction. Agape, "love" (see <a href="./study/isbe/search.html?string=CHARITY">CHARITY</a>), is the word in the New Testament that generally denotes this ideal. "Thou shalt love thy neighbor as thyself" is the whole law of conduct as between man and man (<a onClick="return mV(\'Mat\',22,39,40);">Mt 22:39-40</a>); and neighbor includes every man within one\'s reach (<a onClick="return mV(\'Luk\',10,29);">Lu 10:29</a>ff), even enemies (<a onClick="return mV(\'Mat\',5,44);">Mt 5:44</a>; <a onClick="return mV(\'Luk\',6,35);">Lu 6:35</a>). Without the love of man, the love of God is impossible, but "he that abideth in love abideth in God" (<a onClick="return mV(\'1Jo\',4,16,20);">1Jo 4:16, 20</a>).<P>2. As Actual Between Christians:<P>But man\'s sonship to God may be potential or actual. He may not respond to God\'s love or know His Fatherhood. Likewise love to man may not be reciprocated, and therefore may be incomplete. Yet it is the Christian\'s duty, like God, to maintain his disposition of love and benevolence to those that hate and curse him (<a onClick="return mV(\'Luk\',6,27,28);">Lu 6:27-28</a>). But within the Christian community, love should respond to love, and find its fulfillment, for there all men are, or should be, God\'s sons actually, "because the love of God hath been shed abroad in our hearts, through the Holy Spirit which was given unto us" (<a onClick="return mV(\'Rom\',5,5);">Ro 5:5</a>). And this mutual love within the Christian brotherhood (<a onClick="return mV(\'1Pe\',5,9);">1Pe 5:9</a>) is called philadelphia.<P>3. Stoic Teaching:<P>This twofold ideal of social morality as universal benevolence and mutual affection had been foreshadowed by the <a href="./study/isbe/search.html?string=STOICS">STOICS</a> (which see). Men as citizens of the world should adopt an attitude of justice and mercy toward all men, even slaves; but within the community of the "wise" there should be the mutual affection of friendship.<P>4. Christian Advance on Heathen Thought:<P>Christianity succeeded in organizing and realizing in intense and practical fellowship the ideal that remained vague and abstract in the Greek schools: "See how these Christians love one another." It was their Master\'s example followed, and His commandment and promise fulfilled: "Love one another...as I have loved you ....; by this shall all men know that ye are my disciples" (<a onClick="return mV(\'Jhn\',13,14,34,35);">Joh 13:14, 34-35</a>). Paul in his earliest epistle bears witness that the Thessalonians practice love "toward all the brethren that are in all Macedonia," even as they had been taught of God, but urges them to "abound more and more" (<a onClick="return mV(\'1Th\',4,9,10);">1Th 4:9-10</a>). For the healing of differences, and to build up the church in order and unity, he urges the Romans "in love of the brethren (to) be tenderly affectioned one to another" (<a onClick="return mV(\'Rom\',12,10);">Ro 12:10</a>). Christians must even "forbear one another in love" (<a onClick="return mV(\'Eph\',4,2);">Eph 4:2</a>) and "walk in love, even as Christ also loved you" (<a onClick="return mV(\'Eph\',5,2);">Eph 5:2</a>; <a onClick="return mV(\'Phl\',2,1,2);">Php 2:1-2</a>). It involves some suffering and sacrifice. The author of the Epistle to the He recognizes the presence of "love of the brethren" and urges that it may continue (<a onClick="return mV(\'Hbr\',13,1);">Heb 13:1</a>). It is the direct result of regeneration, of purity and obedience to the truth (<a onClick="return mV(\'1Pe\',1,22,23);">1Pe 1:22-23</a>). It proceeds from godliness and issues in love (<a onClick="return mV(\'2Pe\',1,7);">2Pe 1:7</a>). "Love of the brethren" (agape) is the one practical topic of John\'s epistles. It is the message heard from the beginning, "that we should love one another" <a onClick="return mV(\'1Jo\',3,11,23);">1Jo 3:11, 23</a>. It is the test of light and darkness (<a onClick="return mV(\'1Jo\',2,10);">1Jo 2:10</a>); life and death (<a onClick="return mV(\'1Jo\',3,14);">1Jo 3:14</a>); children of God or children of the devil (<a onClick="return mV(\'1Jo\',3,10);">1Jo 3:10</a>; <a onClick="return mV(\'1Jo\',4,\'7-12\');">4:7-12</a>). Without it there can be no knowledge or love of God (<a onClick="return mV(\'1Jo\',4,20);">1Jo 4:20</a>), but when men love God and obey Him, they necessarily love His children (<a onClick="return mV(\'1Jo\',5,2);">1Jo 5:2</a>). No man can be of God\'s family, unless his love extends to all its members.``145';
isbe[1729]='Brow`brou: Is found in <a onClick="return mV(\'Isa\',48,4);">Isa 48:4</a>, "thy brow brass" as the translation of metsch, meaning "to be clear," i.e. conspicuous. In <a onClick="return mV(\'Luk\',4,29);">Lu 4:29</a> "led him unto the brow of the hill" is the rendering of ophras, literally "the eyebrow," but used throughout Greek literature as any prominent point or projection of land (compare use of supercilium in Verg. Georg. i.108).``1';
isbe[1730]='Brown``<a href="./study/isbe/search.html?string=COLORS">COLORS</a>`1';
isbe[1731]='Bruise; Bruised`brooz, broozd: The noun occurs in <a onClick="return mV(\'Isa\',1,6);">Isa 1:6</a> the King James Version, "bruises and putrifying sores," as the translation of chabbarah. The verb translations a number of Hebrew words, the principal ones being:<P>(1) shuph (<a onClick="return mV(\'Gen\',3,15);">Ge 3:15</a> (twice));<P>(2) daqaq (<a onClick="return mV(\'Isa\',28,28);">Isa 28:28</a> (twice) (the American Standard Revised Version "ground," "and though the wheel of his cart and his horses scatter it, he doth not grind it" for the King James Version "nor break it with the wheels of his cart, nor bruise it with his horsemen"));<P>(3) dakha\', in the classical passage, <a onClick="return mV(\'Isa\',53,5);">Isa 53:5</a>, "He was bruised for our iniquities," <a onClick="return mV(\'Isa\',53,10);">Isa 53:10</a>, "Yet it pleased Yahweh to bruise him";<P>(4) ratsats, "A bruised reed shall he not break," <a onClick="return mV(\'Isa\',42,3);">Isa 42:3</a> (quoted in <a onClick="return mV(\'Mat\',12,20);">Mt 12:20</a>).<P>In the New Testament bruise is the translation of sparasso, "to rend" (the American Standard Revised Version "bruising him sorely") <a onClick="return mV(\'Luk\',9,39);">Lu 9:39</a>; of suntribo, "to break to pieces" (<a onClick="return mV(\'Mat\',12,20);">Mt 12:20</a>); "shall bruise Satan under your feet shortly" (<a onClick="return mV(\'Rom\',16,20);">Ro 16:20</a>); of thrauo in <a onClick="return mV(\'Luk\',4,18);">Lu 4:18</a> in the quotation from <a onClick="return mV(\'Isa\',58,6);">Isa 58:6</a>, "to set at liberty them that are bruised" (WH omits the verse).``89';
isbe[1732]='Bruit`broot (shema\'): A word no longer in common use (marked "archaic" and "obsolete" by Murray), signifying a rumor or report. The word occurs in the King James Version <a onClick="return mV(\'Jer\',10,22);">Jer 10:22</a> (the Revised Version (British and American) "rumour"; the American Standard Revised Version "tidings") and the King James Version <a onClick="return mV(\'Nah\',3,19);">Na 3:19</a> (the Revised Version (British and American) "bruit," appendix. "report"; the American Standard Revised Version "report").``1';
isbe[1733]='Brute; Brutish`broot, brootish (ba\'ar, "stupid"; alogos, "without speech," hence, irrational, unreasonable (<a onClick="return mV(\'Act\',25,27);">Ac 25:27</a>; <a onClick="return mV(\'2Pe\',2,12);">2Pe 2:12</a>; <a onClick="return mV(\'Jud\',1,10);">Jude 1:10</a> the King James Version)): The man who denies God acts in an irrational way. Such persons are described as brutish (<a onClick="return mV(\'Psa\',49,10);">Ps 49:10</a>; <a onClick="return mV(\'Psa\',92,6);">92:6</a>; <a onClick="return mV(\'Psa\',94,8);">94:8</a>; <a onClick="return mV(\'Jer\',10,14,21);">Jer 10:14,21</a>; <a onClick="return mV(\'Jer\',51,17);">51:17</a>). These are stupid, unteachable. This is a graphic description of the atheist. The proverb, "No fool like the learned fool," is especially true of the ignorance of the unbelievers of the Scriptures. Their objections to the Bible, as a rule, are utterly ridiculous. The word is occasionally used in the sense of thoughtless ignorance. Brutish counsel is counsel that is foolish, unreasonable (<a onClick="return mV(\'Isa\',19,11);">Isa 19:11</a>). The term is used by Agur (<a onClick="return mV(\'Pro\',30,2);">Pr 30:2</a>) to express the low estimate he has of himself and his conscious lack of knowledge.``87';
isbe[1734]='Bubastis`bu-bas\'-tis.`<a href="./study/isbe/search.html?string=PI-BESETH">PI-BESETH</a>`1';
isbe[1735]='Bucket`buk\'-et (deli): The word is found only in <a onClick="return mV(\'Isa\',40,15);">Isa 40:15</a>; <a onClick="return mV(\'Num\',24,7);">Nu 24:7</a>, in the latter passage in a figurative use. The bucket was doubtless a waterskin with two cross-pieces at the top to fit it for use in drawing water, like those now in use in Palestine. The ordinary word for water-skin is a different one (no\'dh).``1';
isbe[1736]='Buckle`buk\'-\'-l (porpe): As a mark of favor Jonathan Maccabeus was presented by Alexander Balas with a buckle of gold (1Macc 10:89), the wearing of which was restricted to the blood royal. The buckle was used for fastening the mantle or outer robe on the shoulder or chest.``1';
isbe[1737]='Buckler`buk\'-ler: God is called a "buckler" (the Revised Version (British and American) "shield") to them that trust Him (<a onClick="return mV(\'Psa\',18,2,30);">Ps 18:2, 30</a>; <a onClick="return mV(\'2Sa\',22,31);">2Sa 22:31</a>; <a onClick="return mV(\'Pro\',2,7);">Pr 2:7</a>).`<a href="./study/isbe/search.html?string=ARMOR">ARMOR</a>`1';
isbe[1738]='Bud``<a href="./study/isbe/search.html?string=FLOWERS">FLOWERS</a>`1';
isbe[1739]='Buffalo`buf\'-a-lo.`<a href="./study/isbe/search.html?string=CATTLE">CATTLE</a>`1';
isbe[1740]='Buffet`buf\'-et (kolaphizo, "to beat with the fist"): Refers to bodily maltreatment and violence: "Then did they spit in his face and buffet him" (<a onClick="return mV(\'Mat\',26,67);">Mt 26:67</a>; <a onClick="return mV(\'Mar\',14,65);">Mr 14:65</a>; <a onClick="return mV(\'1Cr\',4,11);">1Co 4:11</a>; <a onClick="return mV(\'1Pe\',2,20);">1Pe 2:20</a>). Paul speaks of "a thorn in the flesh, a messenger of Satan to buffet me" (<a onClick="return mV(\'2Cr\',12,7);">2Co 12:7</a>). Used figuratively of self-control: "I buffet (the King James Version keep under, the Revised Version, margin "bruise") my body, and bring it into bondage" (<a onClick="return mV(\'1Cr\',9,27);">1Co 9:27</a>). The Greek in this passage reads hupopiazo, literally "to give a blow beneath the eye." In <a onClick="return mV(\'Luk\',18,5);">Lu 18:5</a> the same word is rendered "wear out": "Lest she wear roe out by her continual coming" (the King James Version "weary me" the Revised Version, margin "bruise me") (see Pape\'s Lexicon, under the word).``86';
isbe[1741]='Bugean`bu-je\'-an, ba\'-je-an (Bougaios): An epithet given to Haman in Apocrypha, Additions to Esther 12:6, the Revised Version (British and American); the King James Version has "<a href="./study/isbe/search.html?string=AGAGITE">Agagite</a>".``1';
isbe[1742]='Build; Building`bild, bild\'-ing (banah, binyah, once (<a onClick="return mV(\'Eze\',41,13);">Eze 41:13</a>); oikodomeo).<P>1. Building Conditions:<P>The building conditions existing at the time of the Hebrew conquest were rude and untutored, and, with the exception of the work of the Solomonic period, there was still little or no effort made to introduce a higher state, until the time when Greek influence began to be felt (circa 3rd century BC). In localities where stone was not available, mud bricks were used, and their perishable nature being realized, stone slab facing came into use. These slabs were a protection against the weather and had no constructive value. Probably the hand of the "jerry" builder can be seen in an attempt to make such bad construction appear to be solid stone.<P>2. Masonry:<P>In stone localities buildings were of stone, but the class of building was only that of the rude stone waller. Random rubble masonry, unskillfully laid, was the prevailing characteristic. Occasionally a piece of carefully dressed masonry is found, but it is the exception and is often a re-use of an earlier type akin to "sawed stone" (<a onClick="return mV(\'1Ki\',7,9);">1Ki 7:9</a>). The remains of Jewish walls of the period of the early kings in Jerusalem show skill which does not appear to have existed elsewhere. The boss and margin stones, with wide mud joint, were, in part, the actual masonry of the early fortifications, and were re-used and imitated over and over again. The type crops up in feeble imitation at different sites throughout the country, but hammer- picked and rough hammer-dressed stones are also common. The fine comb pick and marginal dressing of the walls of the Temple area belong to the Herodian period (see Bliss and Dickie, "Excavations at Jerusalem," 273ff, PEFS, 1898). The absence of lime is a striking characteristic. There is no distinctive type which can be named exclusively Jewish, although there is good reason for believing that the boss and margin type has a Jewish origin. Wilson (Golgotha, 124) points out that the projecting bosses had a defensive value, in breaking the force of the battering-ram, and here again the necessity of defense shows its vitality in the existence of such a well-engineered detail. The absence of the finer qualities of building craft can be traced to the same source.<P>3. Foundations:<P>Foundations of fortifications were usually on rock which was sometimes squared for a bed, but more often leveled up with small stones. A portion of the south wall of Jerusalem, certainly late (5th century AD), was laid on a foundation of small rubble resting on debris, accumulated over an earlier wall. (See Plate IV, Excavations at Jerusalem, p. 29.) In smaller buildings, the foundations were usually laid on the debris of earlier structures. At Lachish mud brick walls were laid on a foundation of stone. A peculiar method of spreading a layer of sand under the foundations was also noted (see A Mound of Many Cities, 125-26).<P>4. Modern Methods:<P>The native wall of today is less rudely built and is bedded in lime mortar. It is a broad wall usually about 3 ft. thick, with inner and outer faces of large stones, filled in between with small rubble without proper bond, somewhat in the manner of ancient building. To make up for the want of bond, it is a common habit to insert a piece of steel joint across the return angle (see <a href="./study/isbe/search.html?string=BEAM">BEAM</a>). The building and hewing methods, in all probability, are the same as they were in early Jewish times. Hewers sit at their work, with the plane of the stone on which they operate, lying obliquely from them. Stones are conveyed from the quarry, if at a distance from the building site, on donkeys, thence on men\'s backs to the top of the wall, by rude gangways. Every man digs his "own cistern" (<a onClick="return mV(\'Isa\',36,16);">Isa 36:16</a>), which is sunk in the rock under the site of the house, and used as a quarry from which stones for the building are supplied. If water is scarce, the cistern is sunk first, and the winter rains are allowed to collect and provide the necessary water for the building.<P>5. Figurative:<P>To build up is often used in the sense of giving increase and prosperity, or of stablishing and strengthening. Thus in <a onClick="return mV(\'Job\',22,23);">Job 22:23</a>; <a onClick="return mV(\'Psa\',69,35);">Ps 69:35</a>; <a onClick="return mV(\'Jer\',18,9);">Jer 18:9</a>. A kindred sense is to restore what was decayed, as in <a onClick="return mV(\'Isa\',58,12);">Isa 58:12</a>. To "build an house" for a person is to grant him children or a numerous posterity (<a onClick="return mV(\'Rth\',4,11);">Ru 4:11</a>; of David, <a onClick="return mV(\'2Sa\',7,27);">2Sa 7:27</a>; <a onClick="return mV(\'1Ch\',17,10);">1Ch 17:10</a>). Spiritually, the word is used of one\'s work in life, or of the formation of character and habits. The main thing here is the foundation. Those who build on Christ\'s word build on rock; those who reject this word build on sand (<a onClick="return mV(\'Mat\',7,\'24-27\');">Mt 7:24-27</a>). Christ is the sole true foundation; the work which a man builds on this will be tried by fire (<a onClick="return mV(\'1Cr\',3,\'9-15\');">1Co 3:9-15</a>). The church is compared to a building (<a onClick="return mV(\'1Cr\',3,9);">1Co 3:9</a>; <a onClick="return mV(\'1Pe\',2,\'4-6\');">1Pe 2:4-6</a>) reared on the foundation of apostles and prophets (their truths or teaching), Jesus Christ Himself being the chief corner-stone (<a onClick="return mV(\'Eph\',2,\'20-22\');">Eph 2:20-22</a>). Believers are "builded up" in Christ (<a onClick="return mV(\'Col\',2,7);">Col 2:7</a>), and are exhorted to build themselves up on their most holy faith (<a onClick="return mV(\'Jud\',1,20);">Jude 1:20</a>).`<a href="./study/isbe/search.html?string=ARCHITECTURE">ARCHITECTURE</a>; <a href="./study/isbe/search.html?string=HOUSE">HOUSE</a>; <a href="./study/isbe/search.html?string=FORTIFICATION">FORTIFICATION</a>`39';
isbe[1743]='Builder`bild\'-er (banah; oikodomeo, technites): "To build," "builder," ete, are in the Old Testament commonly the translation of banah, "to build," occurring very frequently; see <a href="./study/isbe/search.html?string=BUILD,+BUILDING">BUILD, BUILDING</a>. The literal significance leads also to several figurative applications, especially to God as Divine Builder:<P>(1) as establishing, e.g. the nation (<a onClick="return mV(\'Psa\',69,35);">Ps 69:35</a>; <a onClick="return mV(\'Psa\',102,16);">102:16</a>; <a onClick="return mV(\'Jer\',12,16);">Jer 12:16</a>), the throne of David (<a onClick="return mV(\'Psa\',89,4);">Ps 89:4</a>), Jerusalem (<a onClick="return mV(\'Psa\',147,2);">Ps 147:2</a>);<P>(2) in restoration—rebuilding (<a onClick="return mV(\'Isa\',58,12);">Isa 58:12</a>; <a onClick="return mV(\'Isa\',61,4);">61:4</a>; <a onClick="return mV(\'Isa\',65,21);">65:21</a>; <a onClick="return mV(\'Jer\',31,4,28);">Jer 31:4, 28</a>; <a onClick="return mV(\'Jer\',42,10);">42:10</a>; <a onClick="return mV(\'Eze\',36,36);">Eze 36:36</a>; <a onClick="return mV(\'Amo\',9,11);">Am 9:11</a>; compare <a onClick="return mV(\'Act\',15,16);">Ac 15:16</a>);<P>(3) as establishing in prosperity (<a onClick="return mV(\'Job\',22,23);">Job 22:23</a>; <a onClick="return mV(\'1Sa\',2,35);">1Sa 2:35</a>; <a onClick="return mV(\'Jer\',24,6);">Jer 24:6</a>; compare <a onClick="return mV(\'Gen\',16,2);">Ge 16:2</a> the Revised Version, margin, Hebrew, "be builded by her");<P>(4) the firm establishment of the Divine attributes (<a onClick="return mV(\'Psa\',89,2);">Ps 89:2</a>);<P>(5) Divine opposition (<a onClick="return mV(\'Lam\',3,5);">La 3:5</a>, "He hath builded against me"); compare <a onClick="return mV(\'Job\',19,8);">Job 19:8</a>;<P>(6) the choosing of a corner-stone which the builders rejected (<a onClick="return mV(\'Psa\',118,22,23);">Ps 118:22-23</a>; quoted by Christ (<a onClick="return mV(\'Mat\',21,42);">Mt 21:42</a>; <a onClick="return mV(\'Mar\',12,10);">Mr 12:10</a>; <a onClick="return mV(\'Luk\',20,17);">Lu 20:17</a>); by Peter (<a onClick="return mV(\'Act\',4,11);">Ac 4:11</a>; <a onClick="return mV(\'1Pe\',2,7);">1Pe 2:7</a>)).<P>In the New Testament Christians are represented as being:<P>(1) built by God (<a onClick="return mV(\'1Cr\',3,9,16);">1Co 3:9, 16</a>) on Christ as the one foundation (<a onClick="return mV(\'Mat\',16,18);">Mt 16:18</a>, on Jesus as the Christ; <a onClick="return mV(\'1Pe\',2,5);">1Pe 2:5</a>f; <a onClick="return mV(\'Act\',9,31);">Ac 9:31</a> the Revised Version, margin; <a onClick="return mV(\'Rom\',15,20);">Ro 15:20</a>; <a onClick="return mV(\'1Cr\',3,10,12,14);">1Co 3:10, 12, 14</a> (epoikodomo); <a onClick="return mV(\'Eph\',2,20);">Eph 2:20</a>);<P>(2) as being continuously and progressively built up in their faith and life (<a onClick="return mV(\'Act\',20,32);">Ac 20:32</a>; <a onClick="return mV(\'1Cr\',8,1);">1Co 8:1</a> the Revised Version, margin, "buildeth up"; <a onClick="return mV(\'Act\',10,23);">Ac 10:23</a> margin, Greek "build up"; <a onClick="return mV(\'Act\',14,4,17);">Ac 14:4, 17</a> m; <a onClick="return mV(\'1Th\',5,11);">1Th 5:11</a>; compare <a onClick="return mV(\'Jud\',1,20);">Jude 1:20</a>);<P>(3) they are "builded togethe r" (sunoikodomeo) in Christ (<a onClick="return mV(\'Eph\',2,22);">Eph 2:22</a>; <a onClick="return mV(\'Col\',2,7);">Col 2:7</a> (epoikodomeo); compare <a onClick="return mV(\'1Cr\',3,9);">1Co 3:9</a>);<P>(4) "builded up" is used in a bad sense (<a onClick="return mV(\'1Cr\',8,10);">1Co 8:10</a> the King James Version and the Revised Version (British and American), "emboldened," the Revised Version, margin "be builded up");<P>(6) in <a onClick="return mV(\'Hbr\',3,4);">Heb 3:4</a> God is represented as the Builder (establisher) of all things, the Revised Version, margin "established," and in <a onClick="return mV(\'Hbr\',11,10);">11:10</a> as the Builder (technites), of the New Jerusalem; in <a onClick="return mV(\'Hbr\',9,11);">Heb 9:11</a> for "building" the Revised Version (British and American) has "creation" (ktisis);<P>(7) in <a onClick="return mV(\'1Cr\',3,\'10-14\');">1Co 3:10-14</a>; <a onClick="return mV(\'Gal\',2,18);">Ga 2:18</a>, building represents constructing a system of teaching; Paul speaks of himself as "a wise master-builder" (sophos architekton).``185';
isbe[1744]='Bukki`buk\'-i (buqqi, "mouth of Jah"):<P>(1) A Danite, son of the tribal prince Jogli (<a onClick="return mV(\'Num\',34,22);">Nu 34:22</a>); he was one of the representative chiefs who assisted in the division of the land.<P>(2) Son of Abishua and father of Izzi, a priest, fourth in descent from Aaron, in the line of Eleazar (<a onClick="return mV(\'1Ch\',6,5,51);">1Ch 6:5, 51</a>), and ancestor of Ezra (<a onClick="return mV(\'Ezr\',7,4);">Ezr 7:4</a>). In 2Esdras 1:2 the name appears as Borith, and in 1Esdras 8:2 as Boccas.``1';
isbe[1745]='Bukkiah`buk-i\'-a (buqqiyahu, "proved of God"): A Levite, son of Heman (<a onClick="return mV(\'1Ch\',25,4,13);">1Ch 25:4, 13</a>).`<a href="./study/isbe/search.html?string=BAKBUKIAH">BAKBUKIAH</a>`1';

isbe[1752]='Bulwark`bool\'-wark: The word represents several Hebrew terms (chel, <a onClick="return mV(\'Isa\',26,1);">Isa 26:1</a>; chelah, <a onClick="return mV(\'Psa\',48,13);">Ps 48:13</a>; matsodh, <a onClick="return mV(\'Ecc\',9,14);">Ec 9:14</a>; matsor, <a onClick="return mV(\'Deu\',20,20);">De 20:20</a>). In <a onClick="return mV(\'2Ch\',26,15);">2Ch 26:15</a> the word is translated in the Revised Version (British and American) "battlements."`<a href="./study/isbe/search.html?string=FORTIFICATION">FORTIFICATION</a>`1';
isbe[1753]='Bunah`bu\'-na (bunah); A son of Jerahmeel (<a onClick="return mV(\'1Ch\',2,25);">1Ch 2:25</a>).``1';
isbe[1754]='Bunch`bunsh: Is used of<P>(1) a "bunch of hyssop" (<a onClick="return mV(\'Exd\',12,22);">Ex 12:22</a>, \'aghuddah);<P>(2) a "cluster of raisins" (<a onClick="return mV(\'2Sa\',16,1);">2Sa 16:1</a> the King James Version; <a onClick="return mV(\'1Ch\',12,40);">1Ch 12:40</a> the King James Version tsimmuq = "something dried or shriveled");<P>(3) a "camel\'s hump" (<a onClick="return mV(\'Isa\',30,6);">Isa 30:6</a> the King James Version dabbesheth): of obscure etymology.``1';
isbe[1755]='Bundle`bun\'-d\'-l: Represents in English Versions of the Bible the words tseror, from a verb meaning "cramp" "bind," etc. (<a onClick="return mV(\'Gen\',42,35);">Ge 42:35</a>; <a onClick="return mV(\'1Sa\',25,29);">1Sa 25:29</a>; <a onClick="return mV(\'Sgs\',1,13);">So 1:13</a>); tsebheth, from a verb probably meaning "to grasp" (<a onClick="return mV(\'Rth\',2,16);">Ru 2:16</a>); and deseme, from deo, "to tie up," "bind," hence, literally "bundle," just as the English word is derived from "bind" (<a onClick="return mV(\'Mat\',13,30);">Mt 13:30</a>); and plethos, properly "multitude." The custom of binding up precious things in bundles (compare <a onClick="return mV(\'Sgs\',1,13);">So 1:13</a>) is the basis of the very interesting metaphor in <a onClick="return mV(\'1Sa\',25,29);">1Sa 25:29</a>: "The soul of my lord shall be bound in the bundle of life with Yahweh thy God," or perhaps better, "in the bundle of the living in the care of Yahweh"—an assurance of perfect safety.``134';
isbe[1756]='Bunni`bun\'-i (bunni, buni, bunni; compare <a href="./study/isbe/search.html?string=BANI">BANI</a>):<P>(1) A Levite (<a onClick="return mV(\'Neh\',9,4);">Ne 9:4</a>). The repetition of Bani\'s name in this passage is probably a scribal error. The Syriac version for the second "Bani" reads "Binnui"; but as, in <a onClick="return mV(\'Neh\',10,9);">Ne 10:9</a> and <a onClick="return mV(\'Neh\',12,8);">Ne 12:8</a>, Binnui\'s name comes, as here, between those of Jeshua and Kadmiel, we should substitute Binnui here for the first Bani. The Septuagint renders all three names as if the Hebrew in each case had been bene, "sons of," reducing the proper names in the verse to five. The names probably stand for chief Levitical houses rather than individuals.<P>(2) Another Levite, one of the overseers of the temple, father of Hashabiah, according to <a onClick="return mV(\'Neh\',11,15);">Ne 11:15</a>; but, according to <a onClick="return mV(\'1Ch\',9,14);">1Ch 9:14</a>, Hashabiah is "of the sons of Merari" The reading in Nehemiah is a corruption of the one in Ch.``197';
isbe[1757]='Burden`bur\'-dn.<P>1. In the Old Testament:<P>In the Old Testament more than one word is rendered "burden."<P>(1) massa\', from a root nasa\' "he lifted up." Thus literally any load is called massa\' (<a onClick="return mV(\'Exd\',23,5);">Ex 23:5</a>; <a onClick="return mV(\'Num\',4,15,24,27);">Nu 4:15, 24, 27</a>ff; <a onClick="return mV(\'2Ki\',5,17);">2Ki 5:17</a>; <a onClick="return mV(\'2Ki\',8,9);">8:9</a>). Figuratively, people are a burden (<a onClick="return mV(\'Num\',11,11,17);">Nu 11:11, 17</a>; <a onClick="return mV(\'Deu\',1,12);">De 1:12</a>; <a onClick="return mV(\'2Sa\',15,33);">2Sa 15:33</a>; <a onClick="return mV(\'2Sa\',19,35);">19:35</a>). A man may be a burden to himself (<a onClick="return mV(\'Job\',7,20);">Job 7:20</a>). Iniquities are a burden (<a onClick="return mV(\'Psa\',38,4);">Ps 38:4</a>). Taxes may be a burden (<a onClick="return mV(\'Hsa\',8,10);">Ho 8:10</a>).<P>(2) In both the King James Version and the Revised Version (British and American) massa\' is translated "burden," as applied to certain prophetic utterances; but both the American Revised Version, margin and the Revised Version, margin have "oracle." Examples are <a onClick="return mV(\'Isa\',13,1);">Isa 13:1</a>; <a onClick="return mV(\'Isa\',14,28);">14:28</a>, and often; <a onClick="return mV(\'Jer\',23,33,36,38);">Jer 23:33, 36, 38</a>, no marginal reading; <a onClick="return mV(\'Eze\',12,10);">Eze 12:10</a>; <a onClick="return mV(\'Nah\',1,1);">Na 1:1</a>; <a onClick="return mV(\'Hab\',1,1);">Hab 1:1</a>; <a onClick="return mV(\'Zec\',9,1);">Zec 9:1</a>; <a onClick="return mV(\'Zec\',12,1);">12:1</a>; <a onClick="return mV(\'Mal\',1,1);">Mal 1:1</a>. As was natural under the circumstances, such oracles usually denounced judgment upon place or people. Hence, probably the translation "burden." But some of these prophetic utterances do not contain denunciation or threat (<a onClick="return mV(\'Zec\',12,\'1-\');">Zec 12</a>). The passage in Jeremiah, moreover, implies that the prophet used the term in the sense of "oraele," for scoffers are reproved for perverting the word and giving it the meaning "burden." Massa\', therefore, means something taken up with solemnity upon the lips, whether threatening or not, and the rendering, "burden," ought most likely to be given up.<P>The word mas\'-eth, of the same derivation as massa\', is applied to foolish oracles (<a onClick="return mV(\'Lam\',2,14);">La 2:14</a> the King James Version, oracles the American Standard Revised Version, burdens the American Revised Version, margin, burdens the Revised Version (British and American), oracles the Revised Version, margin; <a onClick="return mV(\'Amo\',5,11);">Am 5:11</a>, burdens the King James Version, exactions the American Standard Revised Version and the Revised Version (British and American)).<P>Massa\' is used also in <a onClick="return mV(\'Pro\',30,1);">Pr 30:1</a> and <a onClick="return mV(\'Pro\',31,1);">Pr 31:1</a>, and is variously rendered prophecy (the King James Version), oracle (American Revised Version), burden, or the name of the speaker\'s country (Revised Version margin, the American Revised Version, margin), oracle (Revised Version). The reading is doubtful, but probably the reference is to the speaker\'s country- -"Jakeh, of Massa" (compare <a onClick="return mV(\'Gen\',25,14);">Ge 25:14</a>), "Lemuel king of Massa."<P>Other words translated "burden" are from the root cabhal, "to bear a load" (<a onClick="return mV(\'Neh\',4,17);">Ne 4:17</a>; <a onClick="return mV(\'Psa\',81,6);">Ps 81:6</a>; <a onClick="return mV(\'1Ki\',11,28);">1Ki 11:28</a>; King James Version margin, charge the King James Version, labor the American Standard Revised Version and the Revised Version (British and American), burden the American Revised Version, margin and the Revised Version, margin, <a onClick="return mV(\'Exd\',5,4,5);">Ex 5:4-5</a>; <a onClick="return mV(\'Exd\',6,6,7);">6:6-7</a>; <a onClick="return mV(\'Isa\',10,27);">Isa 10:27</a>; <a onClick="return mV(\'Isa\',14,25);">Isa 14:25</a>).<P>2. In the New Testament:<P>In the New Testament several Greek words mean "burden."<P>(1) baros, "something heavy." Burdens of the day (<a onClick="return mV(\'Mat\',20,12);">Mt 20:12</a>), the burden of duty to be borne, a difficult requirement (<a onClick="return mV(\'Act\',15,28);">Ac 15:28</a>; <a onClick="return mV(\'Rev\',2,24);">Re 2:24</a>). The burden of one\'s moral infirmities (<a onClick="return mV(\'Gal\',6,2);">Ga 6:2</a>).<P>(2) phortion, "something to be borne." The obligation which Christ imposes (<a onClick="return mV(\'Mat\',11,30);">Mt 11:30</a>); the legal ordinances of the Pharisees (<a onClick="return mV(\'Luk\',11,46);">Lu 11:46</a>); a man\'s individual responsibility (<a onClick="return mV(\'Gal\',6,5);">Ga 6:5</a>). Whether any clear and consistent distinction can be made between these two words is doubtful. Probably, however, phortion refers to the load as something to be borne, whether heavy or light, whilst baros may be an oppressive load. According to Lightfoot baros may suggest a load of which a man may rightly rid himself should occasion serve, but phortion a burden which he is expected to bear, as every soldier carries his own pack. But most likely too much weight should not be given to these distinctions.<P>(3) There is also the word gomos, "the freight" of a ship (<a onClick="return mV(\'Act\',21,3);">Ac 21:3</a>); compare ogkos, weight or encumbrance which impedes the runner\'s progress to the goal (<a onClick="return mV(\'Hbr\',12,1);">Heb 12:1</a>), with particular reference to the superfluous flesh which an athlete seeks to get rid of in training (compare <a onClick="return mV(\'1Cr\',9,\'24-27\');">1Co 9:24-27</a>), and figuratively whatever hinders the full development of Christian manhood.``177';
