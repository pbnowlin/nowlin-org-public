isbe[1759]='Burial`ber\'-i-al (qebhurah; compare New Testament to entaphidsai):<P><b>I. IMMEDIATE BURIAL CONSIDERED URGENT</b><P class="in15">1. Reasons for This<P class="in15">2. The Burial of Jesus<P class="in15">3. The Usual Time<P class="in15">4. Duties of Next of Kin<P><b>II. PREPARATIONS FOR BURIAL</b><P class="in15">1. Often Informal and Hasty<P class="in15">2. Usually with More Ceremony<P class="in15">3. Contrasts between Jewish Customs and Other Peoples\'<P class="in30">(1) Cremation<P class="in30">(2) Embalming<P><b>III. ON THE WAY TO THE GRAVE</b><P class="in15">1. Coffins Unknown<P class="in15">2. Professional Mourners<P><b>IV. AT THE GRAVE</b><P class="in15">1. Graves Dug in the Earth<P class="in15">2. Family Tombs. Later Customs<P class="in15">3. Sealed Stones<P class="in15">4. Stated Times of Mourning<P class="in15">5. Excessive Mourning<P class="in15">6. Dirge-Songs<P><b>V. FAILURE TO RECEIVE BURIAL A CALAMITY OR JUDGMENT</b><P><b>VI. PLACES OF BURIAL: HOW MARKED</b><P><b>LITERATURE</b><hr /><P>It is well to recall at the outset that there are points of likeness and of marked contrast between oriental and occidental burial customs in general, as well as between the burial customs of ancient Israel and those of other ancient peoples. These will be brought out, or suggested later in this article.<p>I. Immediate Burial Considered Urgent.<P>1. Reasons for This:<P>The burial of the dead in the East in general was and is often effected in such a way as to suggest to the westerner indecent haste. Dr. Post says that burial among the people of Syria today seldom takes place later than ten hours after death, often earlier; but, he adds, "the rapidity of decomposition, the excessive violence of grief, the reluctance of Orientals to allow the dead to remain long in the houses of the living, explain what seems to us the indecency of haste." This still requires the survivors, as in the case of Abraham on the death of Sarah, to bury their dead out of their sight (<a onClick="return mV(\'Gen\',23,\'1-4\');">Ge 23:1-4</a>); and it in part explains the quickness with which the bodies of Nadab and Abihu were Carried out of the camp (<a onClick="return mV(\'Lev\',10,4);">Le 10:4</a>), and those of Ananias and Sapphira were hastened off to burial (<a onClick="return mV(\'Act\',5,\'1-11\');">Ac 5:1-11</a>). Then, of course, the defilement to which contact with a dead body gave occasion, and the judgment that might come upon a house for harboring the body of one dying under a Divine judgment, further explain such urgency and haste.<P>2. The Burial of Jesus:<P>It was in strict accordance with such customs and the provision of the Mosaic law (<a onClick="return mV(\'Deu\',21,23);">De 21:23</a>; compare <a onClick="return mV(\'Gal\',3,13);">Ga 3:13</a>), as well as in compliance with the impulses of true humanity, that Joseph of Arimathea went to Pilate and begged the body of Jesus for burial on the very day of the crucifixion (<a onClick="return mV(\'Mat\',27,39);">Mt 27:39</a>ff).<P>3. The Usual Time:<P>The dead are often in their graves, according to present custom, within two or three hours after death. Among oriental Jews burial takes place, if possible, within twenty-four hours after death, and frequently on the day of death. Likewise Mohammedans bury their dead on the day of death, if death takes place in the morning; but if in the afternoon or at night, not until the following day.<P>4. Duties of Next of Kin:<P>As soon as the breath is gone the oldest son, or failing him, the nearest of kin present, closes the eyes of the dead (compare <a onClick="return mV(\'Gen\',46,4);">Ge 46:4</a>, "and Joseph shall put his hand upon thine eyes"). The mouth, too, is closed and the jaws are bound up (compare <a onClick="return mV(\'Jhn\',11,44);">Joh 11:44</a>, "and his face was bound about with a napkin"). The death is announced, as it was of old, by a tumult of lamentation preceded by a shrill cry, and the weeping and wailing of professional mourners (compare <a onClick="return mV(\'Mar\',5,38);">Mr 5:38</a>ff).<P>See <a href="./study/isbe/search.html?string=MOURNING">MOURNING</a>.<p>II. Preparations for Burial.<P>1. Often Informal and Hasty:<P>These are often informal and hasty. Under the tyranny of such customs as those noted, it is often impossible to make them elaborate. Canon Tristram says: "As interments take place at latest on the evening of the day of death, and frequently at night, there can be no elaborate preparations. The corpse, dressed in such clothes as were worn in life, is stretched on a bier with a cloth thrown over it, until carried forth for burial" (Eastern Customs, 94). In <a onClick="return mV(\'Act\',5,6);">Ac 5:6</a> we read of Ananias, "The young men...wrapped him round, and they carried him out and buried him." "What they did," as Dr. Nicol says, "was likely this: they unfastened his girdle, and then taking the loose under-garment and the wide cloak which was worn above it, used them as a winding-sheet to cover the corpse from head to foot." In other words, there was little ceremony and much haste.<P>2. Usually with More Ceremony:<P>Usually, however, there was more ceremony and more time taken. Missionaries and natives of Syria tell us that it is still customary to wash the body (compare <a onClick="return mV(\'Act\',9,37);">Ac 9:37</a>), anoint it with aromatic ointments (compare <a onClick="return mV(\'Jhn\',12,7);">Joh 12:7</a>; <a onClick="return mV(\'Jhn\',19,39);">19:39</a>; <a onClick="return mV(\'Mar\',16,1);">Mr 16:1</a>; <a onClick="return mV(\'Luk\',24,1);">Lu 24:1</a>), swathe hands and feet in grave-bands, usually of linen (<a onClick="return mV(\'Jhn\',11,44);">Joh 11:44</a>), and cover the face or bind it about with a napkin or handkerchief (<a onClick="return mV(\'Jhn\',11,44);">Joh 11:44</a>). It is still common to place in the wrappings of the body aromatic spices and other preparations to retard decomposition. Thus the friends at Bethany prepared the body of Lazarus, and he came forth wrapped in grave-bands and with a napkin bound about his face. And, we are further told that after the burial of Jesus, Nicodemus brought "a mixture of myrrh and aloes, about a hundred pounds," and that they "took the body of Jesus, and bound it in linen cloths with the spices, as the custom of the Jews is to bury," and that Mary Magdalene and two other women brought spices for the same purpose (<a onClick="return mV(\'Jhn\',19,39,40);">Joh 19:39-40</a>; <a onClick="return mV(\'Mar\',16,1);">Mr 16:1</a>; <a onClick="return mV(\'Luk\',24,1);">Lu 24:1</a>). That this was a very old custom is witnessed by such passages as <a onClick="return mV(\'2Ch\',16,14);">2Ch 16:14</a>, where it is said that Asa, the king, was laid "in the bed which was filled with sweet odors and divers kinds of spices prepared by the perfumers\' art" (compare <a onClick="return mV(\'Jhn\',12,3,7);">Joh 12:3, 7</a>; Sirach 38:16). From <a onClick="return mV(\'Act\',5,6);">Ac 5:6</a>; <a onClick="return mV(\'Act\',8,2);">8:2</a> it appears that there was in later times a confraternity of young men whose business it was to attend to these proprieties and preparations on behalf of the dead; but it was probably only in exceptional cases that they were called upon to act. Certainly such ministries ordinarily devolved, as they do now, upon loving relatives and friends, and mostly women, among the Jews as well as among the Greeks. The practice among the Greeks, both by similarity and contrast, affords an interesting illustration. The following instance is aptly cited in D B (art. "Burial"): Electra believing Orestes to be dead and his ashes placed in the sepulchral urn (Soph. Electra 1136-52), addresses him thus: "Woe is me! These loving hands have not washed or decked thy corpse, nor taken, as was meet, their sad burden from the flaming pyre. At the hands of strangers, hapless one, thou hast had those rites, and so art come to us, a little dust in a narrow urn."<P>3. Contrasts between Jewish Customs and Other Peoples\':<P>This brings us to note two marked contrasts between customs in Israel and among other peoples.<P>(1) Cremation:<P>With the Greeks it was customary to cremate the dead (see <a href="./study/isbe/search.html?string=CREMATION">CREMATION</a>); but there was nothing in Jewish practice exactly corresponding to this. Tacitus (Hist. v.5) expressly says, in noting the contrast with Roman custom, that it was a matter of piety with the Jews "to bury rather than to burn dead bodies." The burning of the bodies of Saul and his sons by the men of Jabesh-Gilead (<a onClick="return mV(\'1Sa\',31,\'11-13\');">1Sa 31:11-13</a>) seems to have been rather a case of emergency, than of conformity to any such custom, as the charred bones were buried by the same men under the tamarisk at Jabesh, and later, by David\'s order, removed and laid to rest in the sepulcher of Kish (<a onClick="return mV(\'2Sa\',21,\'12-14\');">2Sa 21:12-14</a>). According to the Mosaic law burning was reserved, either for the living who had been found guilty of unnatural sins (<a onClick="return mV(\'Lev\',20,4);">Le 20:4</a>; <a onClick="return mV(\'Lev\',21,9);">21:9</a>), or for those who died under a curse, as in the case of Achan and his family, who after they had been stoned to death were, with all their belongings, burned with fire (<a onClick="return mV(\'Jos\',7,25);">Jos 7:25</a>).<P>(2) Embalming:<P>As the burning practiced by the Greeks found no place in Jewish law and custom, so embalming, as practiced by the Egyptians, was unknown in Israel, the cases of Jacob and Joseph being clearly special, and in conformity to Egyptian custom under justifying circumstances. When Jacob died it was Joseph, the Egyptian official, who "commanded his servants the physicians to embalm his father" (<a onClick="return mV(\'Gen\',50,2);">Ge 50:2</a>), and it was conventionally the fit thing that when Joseph himself died his body was embalmed and "put in a coffin (sarcophagus) in Egypt" (<a onClick="return mV(\'Gen\',50,26);">Ge 50:26</a>).<p>III. On the Way to the Grave:<P>When the preparations were made and the time came, the corpse was carried to the grave on a bier, or litter (mittah).<p>1. Coffins Unknown:<P>Coffins were unknown in ancient Israel, as they are among the Jews of the East to this day. The only one mentioned in the Bible is the sarcophagus in which the embalmed body of Joseph was preserved, unless Asa\'s bed (<a onClick="return mV(\'2Ch\',16,14);">2Ch 16:14</a>) be another, as some think. Moslems, like eastern Jews, never use coffins. The bier sometimes has a pole at each corner by means of which it is carried on the shoulders to the tomb.<P>See <a href="./study/isbe/search.html?string=BIER">BIER</a>.<P>2. Professional Mourners:<P>The procession of mourners is made up largely, of course, of relatives and friends of the deceased, but is led by professional mourning women, who make the air resound with their shrieks and lamentations (compare <a onClick="return mV(\'Ecc\',12,5);">Ec 12:5</a>; <a onClick="return mV(\'Jer\',9,17);">Jer 9:17</a>; <a onClick="return mV(\'Amo\',5,16);">Am 5:16</a>). See <a href="./study/isbe/search.html?string=MOURNING">MOURNING</a>. <a onClick="return mV(\'Amo\',5,16);">Am 5:16</a> alludes to this custom in describing the mourning that shall be over the desolations of Israel: "Wailing shall be in all the broad ways; and they shall say in all the streets, Alas! alas! and they shall call the husbandman to mourning, and such as are skillful in lamentation to wailing." (<a onClick="return mV(\'Jer\',9,17,18);">Jer 9:17-18</a>) breaks out: "Call for the mourning women, that they may come;...and let them make haste, and take up a wailing for us, that our eyes may run down with tears, and our eyelids gush out with waters." Dr. Fred. Bliss tells of a mourning delegation at the mahal, or mourning house, of a great man. "No matter how gaily they may be chatting they approach, when they reach the house they rush forward, handkerchiefs to face, sobbing, weeping, with utmost demonstrations of grief, going through them time after time as occasion requires." Amelia B. Edwards gives a vivid account of her first experience with such mourning: "It rose like the far-off wavering sound of many owls. It shrilled, swelled, wavered, dropped, and then died away, like the moaning of the wind at sea. We never heard anything so wild and plaintive." Among some Jews of today, it is said, the funeral procession moves swiftly, because there are supposed to be innumerable evil spirits (shedhim) hovering about, desirous to attack the soul, which is thought to be in the body until interment takes place and the corpse is actually covered (see DB, article "Burial").<p>IV. At the Grave.<P>When the grave, or place of entombment, is reached ceremonies more or less characteristic and peculiar to the Orient take place.<P>1. Graves Dug in the Earth:<P>When the body is let down into the ground, the bier, of course, is set aside, and at first a heap of stones only is piled over the shallow grave—to preserve the dead from the dreaded depredations of hyenas, jackals or thieves. Beyond question graves among ancient Jews were often simply dug in the earth, as they are with us, and as they are with Jews at Jerusalem and elsewhere in the East today.<p>2. Family Tombs. Later Customs:<P>But originally, it would seem to have been customary for each family to have a family tomb: either a natural cave, prepared with stone shelves to receive the bodies, or else hewn out of rock in the hillside, each tomb, or sepulcher, having many niches or loculi, in each one of which a body could be placed (see <a onClick="return mV(\'Gen\',25,10);">Ge 25:10</a>; <a onClick="return mV(\'Gen\',49,31);">49:31</a>; <a onClick="return mV(\'Gen\',50,13);">50:13</a>; <a onClick="return mV(\'Gen\',35,19);">35:19</a>; <a onClick="return mV(\'Jos\',24,32);">Jos 24:32</a>). As Dr. Nicol says, "All among the Israelites who possessed any land, or who could afford it, had their family tombs, hewn out of the rock, each sepulchre containing many niches. Many generations of a family could thus be placed in the ancestral tomb." Countless numbers of such tombs are to be found all over Palestine, but Machpelah, of course, is the chief example (<a onClick="return mV(\'Gen\',23,\'1-\');">Ge 23</a>). Compare the cases of Joshua buried in his inheritance at Timnath-serah (<a onClick="return mV(\'Jos\',24,30);">Jos 24:30</a>), Samuel in his house at Ramah (<a onClick="return mV(\'1Sa\',25,1);">1Sa 25:1</a>), Joab in his house in the wilderness (<a onClick="return mV(\'1Ki\',2,34);">1Ki 2:34</a>), Manasseh in the garden of his house (<a onClick="return mV(\'2Ki\',21,18);">2Ki 21:18</a>), Josiah in the same tomb, it would seem, as his fath er and grandfather (<a onClick="return mV(\'2Ki\',23,30);">2Ki 23:30</a>), and Asa, singled out for special mention (<a onClick="return mV(\'2Ch\',16,14);">2Ch 16:14</a>). According to custom, too, the Jew was not to sell his burying-place, if it was possible for him to hold it. Today in the Orient it is quite different—burying-places of Moslem, Jewish and Christian peoples, while distinct from each other, are community rather than family burying-places.<P>3. Sealed Stones:<P>When the tomb was a cave, or was dug out from some rock, the entrance was often closed with a large circular stone set up on its edge or rim and rolled in its groove to the front of the mouth of the tomb, so as to close it securely. This stone was then often further secured by a strap, or by sealing. In such case it could easily be seen or known if the tomb had been disturbed. Pilate, it will be recalled, directed that the tomb of Joseph of Arimathea, in which the body of Jesus was laid, should be carefully sealed and made as secure as the officials could make it. "So they went, and made the sepulchre sure, sealing the stone, the guard being with them" (<a onClick="return mV(\'Mat\',27,66);">Mt 27:66</a>).<P>4. Stated Times of Mourning:<P>In Syria, as elsewhere in the East, it is customary to have stated times after the burial for mourning at the tomb—for example on the third, seventh, and fortieth days, and again on the anniversary of the burial. The relatives or friends then go to the tomb without ornaments, often with hair disheveled; sometimes with head covered and faces blackened with soot, or ashes, or earth, in their oldest and poorest clothing, which is sometimes violently rent, and, sitting or moving in a circle around or near to the tomb, they break out in spells into weird, dirge-like singing or wailing.<P>5. Excessive Mourning:<P>The violence of grief at times leads to lacerations of the body and the shedding of blood. Morier (Second Journey through Persia), describing a celebration which takes place annually to commemorate the death of the grandson of Mohammed, says: "I have seen the most violent of them, as they vociferated Ya Hosein! walk the streets with their bodies streaming with blood by the voluntary cuts they had given themselves". Such cutting of the flesh in mourning for the dead was specifically forbidden by the Mosaic law (<a onClick="return mV(\'Lev\',19,28);">Le 19:28</a>; <a onClick="return mV(\'Lev\',21,5);">21:5</a>; <a onClick="return mV(\'Deu\',14,1);">De 14:1</a>). But excessive mourning for the dead is often alluded to in Scripture (see <a onClick="return mV(\'2Sa\',1,11,12);">2Sa 1:11-12</a>; <a onClick="return mV(\'Psa\',6,6);">Ps 6:6</a>; <a onClick="return mV(\'Psa\',119,136);">119:136</a>; <a onClick="return mV(\'Lam\',1,16);">La 1:16</a>; <a onClick="return mV(\'Lam\',3,48);">3:48</a>; <a onClick="return mV(\'Jer\',9,1);">Jer 9:1</a>).<P>6. Dirge-Songs:<P>The custom of dirge-songs seems to be alluded to (<a onClick="return mV(\'Mat\',9,23);">Mt 9:23</a>; <a onClick="return mV(\'Mar\',5,38);">Mr 5:38</a>) in the narrative of the healing of the ruler\'s daughter: "Jesus came into the ruler\'s house, and saw the flute-players, and the crowd making a tumult." A characteristic oriental funeral procession and burial are vividly pictured in the narrative of the burial of Jacob (<a onClick="return mV(\'Gen\',50,\'6-13\');">Ge 50:6-13</a>).<p>V. Failure to Receive Burial Counted a Calamity or a Judgment.<P>Any lack of proper burial is still regarded in the East, as it was in ancient times, as a great indignity or a judgment from God. It is esteemed the greatest calamity that can befall a person. It gives men still untold distress to think they shall not receive suitable burial, according to the customs of their respective race, or family, or religion—a fact or sentiment that is often alluded or appealed to by way of illustration in the Scriptures. For a corpse to remain unburied and become food for beasts of prey was the climax of indignity or judgment (<a onClick="return mV(\'2Sa\',21,10,11);">2Sa 21:10-11</a>; <a onClick="return mV(\'1Ki\',13,22);">1Ki 13:22</a>; <a onClick="return mV(\'1Ki\',14,11);">14:11</a>; <a onClick="return mV(\'1Ki\',16,4);">16:4</a>; <a onClick="return mV(\'1Ki\',21,24);">21:24</a>; <a onClick="return mV(\'2Ki\',9,37);">2Ki 9:37</a>; <a onClick="return mV(\'Jer\',7,33);">Jer 7:33</a>; <a onClick="return mV(\'Jer\',8,1);">8:1</a>; <a onClick="return mV(\'Eze\',29,5);">Eze 29:5</a>; <a onClick="return mV(\'Psa\',79,3);">Ps 79:3</a>; <a onClick="return mV(\'Rev\',11,9);">Re 11:9</a>), and uncovered blood cried for vengeance (<a onClick="return mV(\'Eze\',24,6);">Eze 24:6</a>f; <a onClick="return mV(\'Eze\',39,\'11-16\');">39:11-16</a>), the idea being the same as among other oriental peoples, that the unburied dead would not only inflict trouble upon his family, but bring defilement also and a curse upon the whole land. It was, therefore, an obligation resting upon all to bury even the dead found by the way (Tobit 1:18; 2:8). Even malefactors were to be allowed burial (<a onClick="return mV(\'Deu\',21,22,23);">De 21:22-23</a>), and the exceptional denial of it to the sons of Rizpah gave occasion for the touching story of her self-denying care of the dead found in <a onClick="return mV(\'2Sa\',21,10,11);">2Sa 21:10-11</a>.<p>VI. Places of Burial: How Marked.<P>Ordinary graves were marked by the heaping of crude stones, but hewn stones and sometimes costly pillars were set up as memorials of the dead (<a onClick="return mV(\'Eze\',39,15);">Eze 39:15</a>; <a onClick="return mV(\'2Ki\',23,17);">2Ki 23:17</a> the Revised Version (British and American), "What monument is that which I see?" the reference being to a sepulchral pillar). Jacob set up a pillar over Rachel\'s grave (<a onClick="return mV(\'Gen\',35,20);">Ge 35:20</a>), and her tomb is marked by a monument to this day. Absalom\'s grave in the wood of Ephraim had a heap of stones raised over it (<a onClick="return mV(\'2Sa\',18,17);">2Sa 18:17</a>), but in this case, as in the case of Achan, it was not for honor but for dishonor. In New Testament times the place of burial was uniformly outside the cities and villages (see <a onClick="return mV(\'Luk\',7,12);">Lu 7:12</a>; <a onClick="return mV(\'Jhn\',11,30);">Joh 11:30</a>). There was public provision made for the burial of strangers (<a onClick="return mV(\'Mat\',27,7);">Mt 27:7</a>), as in the closing days of the monarchy there was a public burying-ground at Jerusalem (<a onClick="return mV(\'Jer\',26,23);">Jer 26:23</a>), probably where it is to this day between the city wall and the Kidron Valley. Thousands of Jewish graves on the sloping sides of the Valley of Jehoshaphat, where the Jews have come from all lands to be buried, bear witness today to the belief that associates the coming of Messiah with a blessed resurrection. Many Jews hold that Messiah, when He comes, will descend upon the Mount of Olives, and will pass through these resting-places of the dead as He enters the Holy City in glory.<P>LITERATURE.<P>HDB, article "Burial"; Keil, Biblical Arch., II, 199f; Nowack, Heb Arch., I, 187ff; "Burial" and "Tombs" in Kitto, Cycl.; Thomson, LB (see "Funerals" in Index); Tristram, Eastern Customs in Bible Lands; Mackie, Bible Manners and Customs.``47';
isbe[1760]='Burier`ber\'-i-er (kabhar): "Set up a sign by it, till the buriers have buried it" (<a onClick="return mV(\'Eze\',39,15);">Eze 39:15</a>). "When the searchers found any human remains as they passed through the land, they were to set up a mark to attract the attention of the buriers, who followed them" (Dummelow\'s Commentary, in the place cited.).`<a href="./study/isbe/search.html?string=BURIAL">BURIAL</a>`1';
isbe[1761]='Burn; Burning`burn, burn\'-ing: Figurative: In addition to the ordinary meaning, burn is used metaphorically in the following passages of the New Testament:<P>(1) kaio (<a onClick="return mV(\'Luk\',24,32);">Lu 24:32</a>), "Was not our heart burning within us," i.e. greatly moved.<P>(2) puroo, used twice, once in the sense of inflamed with sexual desire (<a onClick="return mV(\'1Cr\',7,9);">1Co 7:9</a>), "For it is better to marry than to burn" and in <a onClick="return mV(\'2Cr\',11,29);">2Co 11:29</a> of the heat of the passions, here of grief, or anger, "Who is offended (the American Standard Revised Version "caused to stumble") and I burn not?"`<a href="./study/isbe/search.html?string=PUNISHMENTS">PUNISHMENTS</a>`1';

isbe[1764]='Bush`boosh:<P>(1) (ceneh, <a onClick="return mV(\'Exd\',3,\'2-4\');">Ex 3:2-4</a>; <a onClick="return mV(\'Deu\',33,16);">De 33:16</a>; batos, <a onClick="return mV(\'Mar\',12,26);">Mr 12:26</a>; <a onClick="return mV(\'Luk\',6,44);">Lu 6:44</a>, "bramble bush"; <a onClick="return mV(\'Luk\',20,37);">20:37</a>; <a onClick="return mV(\'Act\',7,30,35);">Ac 7:30, 35</a>. All the Old Testament references and the New Testament references, except <a onClick="return mV(\'Luk\',6,44);">Lu 6:44</a>, are to the same "bush," namely, Moses\' "burning bush"). From its etymology ceneh clearly denotes a "thorny" plant, as does the corresponding batos in the Septuagint and New Testament. In the Latin versions rubus, i.e. "bramble," is used as equivalent. Several varieties of bramble flourish in Palestine, of which the most common is Rubus discolor, but this is not an indigenous plant in Sinai. It is stated by Post that a bush of this plant has been planted by the monks of the Convent of Catherine at Sinai to the rear of the "Chapel of the Burning Bush." In spite of tradition there is but little doubt that Moses\' "burning bush" must actually have been a shrub of one of the various thorny acacias, or allied plants, indigenous in the Sinaitic peninsula.<P>(2) (siach "plant," <a onClick="return mV(\'Gen\',2,5);">Ge 2:5</a>; "shrub," <a onClick="return mV(\'Gen\',21,15);">Ge 21:15</a>; "bush," <a onClick="return mV(\'Job\',30,4,7);">Job 30:4, 7</a>). In the first reference any kind of plant may be meant, but in the other passages the reference is to the low bushes or scrub, such as are found in the desert.<P>(3) (nahalolim, the King James Version bushes, the Revised Version (British and American) <a href="./study/isbe/search.html?string=PASTURE">PASTURE</a>, margin "bushes," <a onClick="return mV(\'Isa\',7,19);">Isa 7:19</a>). The meaning appears to be rather a place for watering flocks, the corresponding Arabic root nahal, having the meaning "to quench one\'s thirst," and the corresponding noun of place, manhal, meaning a watering-place in the desert.``117';
isbe[1765]='Bush, Burning`burn\'-ing.<P>1. Meaning and Use:<P>The scene at the burning bush (ceneh, "a bush," Septuagint batos, "blackberry bush") reveals God to the world in one of theophanies with fire, of which there are four mentioned in the Bible (<a onClick="return mV(\'Exd\',3,2);">Ex 3:2</a>; <a onClick="return mV(\'Exd\',13,21);">13:21</a>; <a onClick="return mV(\'Exd\',19,18);">19:18</a>; also <a onClick="return mV(\'2Th\',1,8);">2Th 1:8</a> the King James Version, yet to be fulfilled). Many other Divine manifestations were associated with fire. The Burning Bush is mentioned elsewhere in <a onClick="return mV(\'Deu\',33,16);">De 33:16</a>; <a onClick="return mV(\'Mar\',12,26);">Mr 12:26</a>; <a onClick="return mV(\'Luk\',20,37);">Lu 20:37</a>; <a onClick="return mV(\'Act\',7,30,31);">Ac 7:30-31</a>.<P>2. Identification:<P>Exact identification of the particular kind of bush in which God appeared to Moses is impossible. Attempts have been made to identify it with the blackberry bush, as by the Septuagint and also by the monks of the Convent of Catharine on Mount Sinai who grow the blackberry there in token of their tradition. The cassia has also been suggested. Both identifications are failures, the former because the blackberry does not grow in that region unless imported and tended, the latter for philological reasons. Nothing in the language used gives any clue to the species of the bush. The generally accepted view that it was some kind of thorn bush is an assumption with scarcely other ground than that there are so many thorny bushes in that region. This fact does, however, give to the assumption much probability.<P>3. Interpretation:<P>The old Jewish commentators have many things to say in explanation of this theophany (compare Jewish Encyclopedia). That one thing which will meet with much response from the Christian heart is that the unconsumed bush with the fire in the midst of it indicated that the Israelites would not be consumed by the afflictions in Egypt. The application of this view to God\'s people under affliction in all ages is often made by Christian homilists. But this cannot have been the primary meaning of theophany. Of the many theophanies and other Divine manifestations with fire, the specific signification must be learned from a careful study of the circumstances in each case. The fire does not seem to have any one fundamental meaning running through them all. In addition to the references already given, compare <a onClick="return mV(\'Psa\',18,\'8-12\');">Ps 18:8-12</a>; <a onClick="return mV(\'Psa\',50,3);">50:3</a>; <a onClick="return mV(\'Eze\',1,4);">Eze 1:4</a>; <a onClick="return mV(\'Mic\',1,\'1-4\');">Mic 1:1-4</a>; <a onClick="return mV(\'Hab\',3,\'3-6\');">Hab 3:3-6</a>; <a onClick="return mV(\'Hbr\',12,29);">Heb 12:29</a>.<P>The exact meaning of the Burning Bush as a method or medium of revelation may appear as follows:<P>(1) The flame in this bush was not the flame of persecution by God\'s enemies without, but the flame of God\'s presence or the presence of His angel within.<P>(2) The idea of burning and yet not being consumed is brought into the narrative by Moses\' wonderment in the moment of his ignorance, before he knew that God was in the bush.<P>(3) The real significance of the flame in this case seems to be light and glory and preservation where God manifests Himself graciously. This is the universal idea of revealed religion.<P>The prevailing idea of God in the religions round about was that God dwelt in darkness. The approach to the gods in Egyptian temples was through ever-deepening gloom. It was thought that God was very dangerous and apt to be a destroyer, so that a priest must always intervene. God as a gracious Saviour was the new idea revelation was bringing to the world. This was now first clearly announced, but was not to be fully revealed throughout the time of the long line of priests until the Great High Priest should come and make a "way of approach" that we may come "with boldness unto the throne of grace."``93';
isbe[1766]='Bushel`boosh\'-el (modios): A dry measure containing about a peck, but as it is used in the New Testament (<a onClick="return mV(\'Mat\',5,15);">Mt 5:15</a>; <a onClick="return mV(\'Mar\',4,21);">Mr 4:21</a>; <a onClick="return mV(\'Luk\',11,33);">Lu 11:33</a>) it does not refer to capacity but is used only to indicate a covering to conceal the light.``1';
isbe[1767]='Bushy`boosh\'-i: Found in <a onClick="return mV(\'Sgs\',5,11);">So 5:11</a> as the translation of taltal, meaning trailing, pendulous (Septuagint elatai, literally "ductile"); the Revised Version, margin reads "curly."``1';
isbe[1768]='Business`biz\'-nes: Is the rendering of four Hebrew words:<P>(1) mela\'khah, in <a onClick="return mV(\'Gen\',39,11);">Ge 39:11</a> (the American Standard Revised Version "work"); <a onClick="return mV(\'1Ch\',26,29,30);">1Ch 26:29-30</a>; <a onClick="return mV(\'2Ch\',13,10);">2Ch 13:10</a> (the American Standard Revised Version "in their work"); <a onClick="return mV(\'2Ch\',17,13);">17:13</a> (the American Standard Revised Version "many works"); <a onClick="return mV(\'Neh\',11,16,22);">Ne 11:16, 22</a>; <a onClick="return mV(\'Neh\',13,30);">13:30</a> (the American Standard Revised Version "in his work"); <a onClick="return mV(\'Est\',3,9);">Es 3:9</a>; <a onClick="return mV(\'Psa\',107,23);">Ps 107:23</a>; <a onClick="return mV(\'Pro\',22,29);">Pr 22:29</a>; <a onClick="return mV(\'Dan\',8,27);">Da 8:27</a>.<P>(2) dabhar, literally "a word," is so translated in <a onClick="return mV(\'Deu\',24,5);">De 24:5</a>; <a onClick="return mV(\'Jos\',2,14,20);">Jos 2:14, 20</a>; <a onClick="return mV(\'Jdg\',18,7);">Jud 18:7</a> (the American Standard Revised Version "dealings"); <a onClick="return mV(\'Jdg\',18,28);">Jud 18:28</a> (the American Standard Revised Version "dealings"); <a onClick="return mV(\'1Sa\',21,2,8);">1Sa 21:2, 8</a>.<P>(3) ma\'aseh, "an action" (<a onClick="return mV(\'1Sa\',20,19);">1Sa 20:19</a>).<P>(4) \'inyan, "employment" (<a onClick="return mV(\'Ecc\',5,3);">Ec 5:3</a>; <a onClick="return mV(\'Ecc\',8,16);">8:16</a>).<P>In the New Testament "business" in <a onClick="return mV(\'Luk\',2,49);">Lu 2:49</a> is the rendering of the phrase en, tois, tou patros mou, literally "in the things of my Father," which the American Standard Revised Version renders "in my Father\'s house," with "about my Father\'s business" as the marginal reading. "Business" is also used in the translation of chreia, literally "need," of <a onClick="return mV(\'Act\',6,3);">Ac 6:3</a>; as the translation of spoude, literally "haste" of <a onClick="return mV(\'Rom\',12,11);">Ro 12:11</a> (the American Standard Revised Version "diligence"); of pragma, literally "thing done," of <a onClick="return mV(\'Rom\',16,2);">Ro 16:2</a> (the American Standard Revised Version "matter"); of prassein ta idia, literally "tend to one\'s own business," of <a onClick="return mV(\'1Th\',4,11);">1Th 4:11</a>. In <a onClick="return mV(\'Act\',19,24,25);">Ac 19:24-25</a> in Paul\'s account of the riot in Ephesus, ergasia, literally "working," "performing," is translated "little business" in <a onClick="return mV(\'Act\',19,24);">Ac 19:24</a> (the King James Version "small gain"), and "by this business" in <a onClick="return mV(\'Act\',19,25);">Ac 19:25</a> (the King James Version "by this craft").``89';
isbe[1769]='Busybody`biz\'-i-bod-i (periergos, allotrioepiskopos): The word is found twice in Paulinic literature.: <a onClick="return mV(\'1Ti\',5,13);">1Ti 5:13</a>, "not only idle, but tattlers also and busybodies," and <a onClick="return mV(\'2Th\',3,11);">2Th 3:11</a>, "work not at all, but are busybodies." It is also found in <a onClick="return mV(\'1Pe\',4,15);">1Pe 4:15</a> the King James Version (the Revised Version (British and American) "meddler") "or as a busybody in other men\'s matters." If these passages be coupled with such others as <a onClick="return mV(\'Jam\',3,\'2-10\');">Jas 3:2-10</a>; <a onClick="return mV(\'Jam\',4,11);">4:11</a>; <a onClick="return mV(\'Eph\',4,29,31);">Eph 4:29, 31</a>; <a onClick="return mV(\'Tts\',3,2);">Tit 3:2</a>, it becomes evident that sins against the eighth commandment were as common in the apostolic church as they are today. To this day backbiting is a common trait of oriental peoples. And it is this sin which is so repeatedly warned against by the apostles, as in direct conflict with the ethics of Christianity, and in violation of that spirit of brotherly love and mutual trust which Christ has enjoined on His followers, and which is the very marrow of the outward revelation of the Christian faith (<a onClick="return mV(\'1Cr\',13,\'1-\');">1Co 13</a>).``42';
isbe[1770]='Butler`but\'-ler: An officer in households of kings, or other dignitaries, having charge of wines and other potables. mashqeh, "one who gives drink" (<a onClick="return mV(\'Gen\',40,\'1-23\');">Ge 40:1-23</a>; <a onClick="return mV(\'Gen\',41,9);">41:9</a>), rendered "cupbearer" in <a onClick="return mV(\'1Ki\',10,5);">1Ki 10:5</a>; <a onClick="return mV(\'2Ch\',9,4);">2Ch 9:4</a>; <a onClick="return mV(\'Neh\',1,11);">Ne 1:11</a>. The office was one of consider ble importance in oriental courts, because of the danger to the king\'s life through plots of poison, etc. Nehemiah held this position to King Artaxerxes. Wealthy courts, as that of Solomon, usually had more than one (<a onClick="return mV(\'1Ki\',10,5);">1Ki 10:5</a>); over these cupbearers or butlers was the sar ha-mash-qim, or chief butler (<a onClick="return mV(\'Gen\',40,9);">Ge 40:9</a>).``137';

isbe[1772]='Buying`bi\'-ing (karah, laqach, qena\', qanah, shabhar; agorazo, oneomai, emporeuomai):<P><b>I. IN THE EARLIEST PERIODS AND AMONG NOMADS</b><p class="in15">1. The Primitive Stage (the "Shop")<p class="in15">2. In Old Testament Times<p class="in15">3. In New Testament Times<P><b>II. ORIENTAL BUYING A TEDIOUS PROCESS</b><P><b>III. SHOPS AND BAZAARS</b><p class="in15">1. Oriental Shops<p class="in15">2. The Market-Place<P><b>IV. BUYING ON CREDIT PAYING CASH (MONEY)</b></a><P><b>V. OPEN-AIR MARKETS AND FAIRS</b><hr /><P>I. In the Earliest Periods and among Nomads.<P>1. The Primitive Stage; (the "Shop"):<P>Among primitive races and nomads there can be, of course, no organized commerce. Yet they buy and sell, by barter and exchange, in rude and simple ways. When tribes become settled and live in villages the "shop" is established—usually at first the simple "stall" of the grocer (bakkal) where one can buy bread; cheese, salt and dried fish, olives, oil, bundles of wood or charcoal, and even earthenware vessels for the passing traveler. At a later stage the village will have also, according to demand, other shops, as, for instance, those of the baker, the blacksmith, the cobbler, and, today, will be found in many obscure places in the East the butcher\'s shop, and the coffee house.<P>2. In Old Testament Times:<P>These gradations and the gradual rise to the more organized commerce of the Greek-Roman period are indicated in a way by the succession of words for "buying" used in the Bible and the conditions and circumstances pictured and implied in the various accounts of buying and selling. Even as early as Abraham\'s time, however, there were buying and weighing of silver in exchange.<p class="in15">"Hear me," pleads Abraham with the children of Heth, "and entreat for me to Ephron the son of Zohar, that he may give me the cave of Machpelah...which is in the end of his field; for the full price let him give it to me." And Ephron said, "Nay, my lord, hear me: the field give I thee, and the cave that is therein." But Abraham said, "If thou wilt...I will give the price of the field; take it of me, and I will bury my dead there. And Ephron answered...My lord, hearken unto me: a piece of land worth four hundred shekels of silver, what is that betwixt me and thee? bury therefore thy dead ..... And Abraham weighed to Ephron the silver...four hundred shekels of silver, current money with the merchant. So...the field, and the cave, and all the trees that were in the field,...were made sure unto Abraham for a possession" (<a onClick="return mV(\'Gen\',23,\'8-18\');">Ge 23:8-18</a>).<p>Other examples of primitive buying are found in <a onClick="return mV(\'Jos\',24,32);">Jos 24:32</a> ("the parcel of ground which Jacob bought of the sons of Hamor the father of Shechem for a hundred pieces of money"); in <a onClick="return mV(\'Rth\',4,\'5-9\');">Ru 4:5-9</a>, where Boaz is represented as buying "the parcel of land which was Elimelech\'s...of the hand of Naomi...and of Ruth the Moabitess, the wife of the dead...all that was Elimelech\'s"; and in <a onClick="return mV(\'2Sa\',24,\'21-24\');">2Sa 24:21-24</a>, where David is said to have "bought the threshing-floor" of Araunah at "a price." Such cases, however, are in a sense exceptional; trade in general at that time was by barter and exchange, without intermediary or market-place.<P>3. In New Testament Times:<P>In New Testament times things have so changed that the word most commonly used for buying (agorazo) means "to use the market-place," and another (emporeuomai) points to a class of traders or merchants who go on, from city to city—"continue" here or there "and buy and sell" (<a onClick="return mV(\'Jam\',4,13);">Jas 4:13</a> the King James Version).<p>II. Oriental Buying a Tedious Process.<P>Something of this is seen even in the fine examples given above. Doubtless, however, eastern buyers and sellers of old haggled over prices with controversy and heat, even as such buyers do today. Every where you find them now keen for bargains, but "striking a bargain" is a tedious process. They grow warm and then cool off; they are swept into a frenzy by some new turn of the strife and then calm down; but soon the haggling and arguing begin over again, becoming more heated and seemingly more hopeless than ever, and often they become so excited as to threaten to come to blows. But they don\'t mean it all, and at last they find a common basis; the sale is made with flattering compliments to one another, and, if we may believe appearances, to the rapturous delight of both parties to the bargain.<P>The native Oriental clearly takes pleasure in such exercise, and sees great possibilities before him. He graciously assures you at the outset that the bargain shall be "just as you like it—just as you like it!" Is he not a servant of God? What cares he for money? What he most wants is your happiness and good will—that is the sweetest thing in life—the love and favor of brothers. After a while you offer a price. He says, "What is such a trifle between us? Take it for nothing!" But he is far from meaning it, and so the haggling begins and the fire and heat of controversy follow—perhaps for hours.<p>III. Shops and Bazaars.<P>1. Oriental Shops:<P>Oriental shops are all of a pattern—the workshop and the place to store and sell goods is one and the same. It is on the street, of course, and a platform, usually about 2 ft. high, extends along the whole front. A small door opens to a room back, which, as far as such a thing is possible in the Orient, is private. The goods, particularly the best articles, are displayed in front, somewhat as they are in the windows of our department stores. In the center of the platform is a sejadeh, a rug or mat. Upon this the keeper sits in true oriental fashion—cross-legged. He is never too busy with his accounts to let the passerby escape his keen eye. He will give up his nargileh any time to hail the stranger, display his goods, and coaxingly invite him to look at the special beauty and quality of his articles.<P>2. The Market-Place:<P>All the shops or storerooms of the oriental village line the "market," which as a rule, is in the center of the village, or on the chief street. This the Arabs call suk, sookh (compare <a onClick="return mV(\'Mat\',20,3);">Mt 20:3</a>). Here the peasant is found with his donkeys or camels laden with food-stuffs and country produce. The gardener is there with his small fruits, and the fisherman with his latest "catch." All the shopkeepers, too, are on or near to this street or market center. "The sookh in a country village," says J. Carrow Duncan, "is one of the most interesting sights of modern Egypt. Formerly the cattle and dry-goods markets were uniformly held in an open space in the center of each village. Now the government compels them to go to a fenced enclosure outside of the town. At Belbeys the ordinary market is still held in the center of the town, but the cattle market is a mile away, across the canal. As in a bazaar, such as the traveler sees in Cairo, the merchants of the various trades dispose themselves here in lanes, all easily accessible from the main street, which is thus left clear. On the left are the dealers in copper utensils, busily plying their trade; next to them the makers of sieves and riddles; then comes a large space filled with pottery ware, and, close by, the vegetable yentiers. There, jammed in between the pottery space and the coppersmiths, is a lane of gold- and silversmiths—the greatest sharks in the market, their chief prey being the women. On the other side of the main street are the shoemakers\' lane, the drapers\' lane, the grocers, the seed men, the sweetmeat- sellers, fruit-merchants, dealers in glass and carnelian jewelry and, lastly, the butchers\' stalls, all arranged in lanes, and all equally ready to trade or to enjoy a joke at each other\'s expense. There is apparently little eagerness to trade—except when a tourist appears." To one who is ignorant of the value of his wares, the oriental dealer has no fixed price. This is really regulated by the supposed ignorance of the purchaser. If you choose, you may give him what he asks, and be laughed at all round the sookh. If you are wise, you will offer something near to the real value and firmly refuse to vary or haggle, and he will come to terms.<P>Professor Elihu Grant tells of a shop in a Syrian village—"a small room, 6 to 12 ft. square, with a door, but no window, a counter or bench, and shelves and bins along the sides, where sugar, flour, oil, matches, candies, spice, starch, coffee, rice, dried figs, etc., were found, but no wrapping-paper. The buyer must bring his own dish for liquids; other things he carries away in the ample folds of his skirt or in a handkerchief." "Every considerable Turkish town," says Van Lennep, "has a bazaar, bezesten, or \'arcade\': a stone structure, open at both ends, a narrow alley or street running through it, covered with an arched roof, the sides pierced with openings or windows. This covered street is lined on both sides with shops, narrow and shallow. Dealers in similar goods and articles flock together here, as do the artisans of like trades in all oriental cities." Such shops can yet be seen in quite characteristic form in Damascus, Bagdad, Cairo and Constantinople, as in ancient days they were found in Babylon, Jerusalem and Noph (see <a onClick="return mV(\'Eze\',27,\'13-24\');">Eze 27:13-24</a>).<p>IV. Buying on Credit.<P>The shop-keeper does not always get cash from the native buyer. Dr. Post found that debt was well-nigh universal in Syria. The peasant sows "borrowed" seed, in "borrowed" soil, plants and reaps with "borrowed" tools, and lives in a "borrowed" house. Even in case of an abundant harvest the proportion of the crop left by the landlord and the tax-gatherer leaves the man and his family but the barest living at best; at times he can barely pay the debt accumulated in making and gathering in the crop, and sometimes fails in doing this.<P>Paying Cash (Money):<P>In the rare cases when the buyer pays cash for his purchases, he makes payment, after a true oriental fashion, in coin of the most various or varying values, or in rings of copper, silver or gold, such as are now common in the market-places of China. This throws light upon some Scriptural passages, as, for example, <a onClick="return mV(\'Gen\',43,21,22);">Ge 43:21-22</a>, where the language implies that the "rings" or "strings of money" were weighed: "Behold, every man\'s money was in the mouth of his sack, our money in fill weight...and other money have we brought down in our hand to buy food." In <a onClick="return mV(\'Ezr\',2,69);">Ezr 2:69</a>, three kinds of currency are mentioned, "darics of gold," "pounds of silver," and "priests\' garments," as having been given into the treasury for the house of God. The term rendered "darics of gold," \'adharkonim, stands for Persian coins, which were similar to the Greek "darics." The Persians are said to have got the idea of coining from Lydia, at the capture of Sardis, 564 BC. Early Lydian coins were of electrum, but Croesus changed this to coins of gold and silver, probably about 568 BC. Examples of these ancient coins are now known (Rice, Orientalisms in Bible Lands, 234).<p>V. Open-Air Markets and Fairs.<P>In inland towns and cities, markets and market-places are often found in the open air, as well as under cover. Great fairs are held thus on certain days of the week. Several towns will agree upon different days as market days and will offer in turn whatever they have for sale: lambs, sheep, cattle, horses, mules, chickens, eggs, butter, cheese, vegetables, fruits, and even jewelry and garments. In such a case it is as if the whole town for the day was turned into a market or exhibition, where everything is for sale. On such days peasants and townspeople come together in much larger numbers than is ordinary, and mingle freely together. The day thus chosen now, as in olden times, is often a holy day—Friday, which is the Moslem Sabbath, or the Christian Sunday, where Christians abound. Such instances form a side-light on such passages as <a onClick="return mV(\'Neh\',13,\'15-22\');">Ne 13:15-22</a>: "In those days saw I in Judah some men treading winepresses on the sabbath, and bringing in sheaves, and lading asses therewith; as also wine, grapes, and figs, and all manner of burdens, which they brought into Jerusalem on the sabbath day: and I testified against them." Morier testifies that he attended similar fairs in Persia, where were gathered sellers of all sorts of goods in temporary shops or tents, such as sellers of barley and flour, as it was at the gate of Samaria after the famine (<a onClick="return mV(\'2Ki\',7,\'1-\');">2Ki 7</a>). Layard also speaks of having seen at the gate of the modern town of Mosul, opposite the site of ancient Nineveh shops for the sale of wheat, barley, bread-stuffs, and drinks for the thirsty. It will be recalled that it was "at the gate" that Boaz (<a onClick="return mV(\'Rth\',4,\'1-3\');">Ru 4:1-3</a>) called the elders and people to witness that he had bought all that was Elimelech\'s. For similar allusions see <a onClick="return mV(\'Job\',5,4);">Job 5:4</a>; <a onClick="return mV(\'Pro\',31,23);">Pr 31:23</a>; <a onClick="return mV(\'Psa\',127,5);">Ps 127:5</a>; <a onClick="return mV(\'Lam\',5,14);">La 5:14</a>.`<a href="./study/isbe/search.html?string=MONEY">MONEY</a>; <a href="./study/isbe/search.html?string=TRADE">TRADE</a>`47';
isbe[1773]='Buz; Buzi; Buzite`buz, bu\'-zi, buz\'-it (buz):<P>(1) Second son of Nahor (<a onClick="return mV(\'Gen\',22,21);">Ge 22:21</a>). The word occurs again in <a onClick="return mV(\'Jer\',25,23);">Jer 25:23</a>, by the side of Dedan (<a onClick="return mV(\'Gen\',10,7);">Ge 10:7</a>) and Tema (<a onClick="return mV(\'Gen\',25,15);">Ge 25:15</a>), and is probably, therefore, the name of a people living in the neighborhood of Edom. Buz and Hazo (<a onClick="return mV(\'Gen\',22,22);">Ge 22:22</a>) are probably the countries of Bazu and Chazu (the former described as full of snakes and scorpions), which Esarhaddon invaded (KB, II, 131).<P>(2) A Gadite (<a onClick="return mV(\'1Ch\',5,14);">1Ch 5:14</a>) (buzi), "an inhabitant of Buz"), a title given to Elihu, the fourth speaker in the Book of Job (<a onClick="return mV(\'Job\',32,2);">Job 32:2</a>).``197';
isbe[1774]='By`In the sense of "against" which survives only in dialectal English (compare Wright, Dialect Dict., I,470,for examples) is the King James Version rendering of the dative emauto of <a onClick="return mV(\'1Cr\',4,4);">1Co 4:4</a> (the American Standard Revised Version renders this "against"). In classical Greek the same idiom sunoida with dative = "be conscious" or "be cognizant of" a thing.``1';
isbe[1775]='By And By`In the sense of "immediately" is the King James Version translation of exautes, of <a onClick="return mV(\'Mar\',6,25);">Mr 6:25</a> (the American Standard Revised Version "forthwith"); of euthus, <a onClick="return mV(\'Mat\',13,21);">Mt 13:21</a> (the American Standard Revised Version "straightway"); of eutheos, <a onClick="return mV(\'Luk\',17,7);">Lu 17:7</a> (the American Standard Revised Version "straightway"); <a onClick="return mV(\'Luk\',21,9);">Lu 21:9</a> (the American Standard Revised Version "immediately"). In English literally this meaning is obsolete (compare: "After you have dyned and supte, laboure not by and by after, but make a pause—the space of an howre or more with some pastyme") (Babees Book, EETS, 247).``1';

isbe[1780]='Byword`bi\'-wurd: shammah = "consternation," "astonishment," "waste," "wonderful language," "object of remark" (<a onClick="return mV(\'Deu\',28,37);">De 28:37</a>; <a onClick="return mV(\'1Ki\',9,7);">1Ki 9:7</a>; <a onClick="return mV(\'2Ch\',7,20);">2Ch 7:20</a>); mashal, or meshol = "a satire," "byword" (<a onClick="return mV(\'Job\',17,6);">Job 17:6</a>; <a onClick="return mV(\'Psa\',44,14);">Ps 44:14</a>); millah, or milleh = "a topic," "object of talk," "byword" (<a onClick="return mV(\'Job\',30,9);">Job 30:9</a>).``1';

isbe[1783]='Cabin`kab\'-in (chanuyyoth, "vaults"; <a onClick="return mV(\'Jer\',37,16);">Jer 37:16</a> the Revised Version (British and American), "cells"): In the East the prison often consisted of a pit (compare "dungeon-house" the Revised Version (British and American) and "house of the pit" the Revised Version, margin) with vaulted cells around it for the confinement of prisoners. The word is probably a gloss. The phrase "and into the cells" seems superfluous after "into the dungeonhouse."``1';
isbe[1784]='Cabul`ka\'-bul (kabhul; Codex Vaticanus, Chobamasomel; Codex Alexandrinus, Chabol apo aristeron):<P>(1) A city on the boundary between Asher and Zebulun (<a onClick="return mV(\'Jos\',19,27);">Jos 19:27</a>). It corresponds to the Chabolo of Josephus (Vita, 43, etc.), and is represented by the modern village Kabul, about nine miles southeast of Acre.<P>(2) A district probably connected with (1), containing 20 cities, given by Solomon to Hiram king of Tyre (<a onClick="return mV(\'1Ki\',9,10);">1Ki 9:10</a>ff).``1';
