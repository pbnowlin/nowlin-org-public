rmanent authentic form and later to convince the reader of their wonderful fulfillment, thus too the writing down of larger collections of prophecies had for its purpose to intensify the power of the prophetic word and to secure this as a permanent possession of the people (<a onClick="return mV(\'Jer\',30,2);">Jer 30:2</a>; <a onClick="return mV(\'Jer\',36,1);">36:1</a>). Pupils of the prophets assisted them in this writing and in preserving their books (compare <a onClick="return mV(\'Jer\',36,4);">Jer 36:4</a>; <a onClick="return mV(\'Isa\',8,16);">Isa 8:16</a>).<P>7. Poetical Form of Prophecy:<P>It is to this custom that we owe our knowledge of the very words of the utterances of many of the prophets of a later period. In addition to the larger Books of Isaiah, Jeremiah, Ezekiel, we have a number of smaller prophetical books, which have been united into the Book of the Twelve Prophets. These utterances as a rule exhibited an elevated form of language and are more or less poetical. However, in modern times some scholars are inclined to go too far in claiming that these addresses are given in a carefully systematized metrical form. Hebrew meter as such is a freer form of expression than is Arabic or Sanskrit meter, and this is all the more the case with the discourses of the prophets, which were not intended for musical rendering, and which are expressed in a rhythmically-constructed rhetoric, which appears now in one and then in another form of melody, and often changes into prose.<P>8. Prophets in Judah Isaiah, and Others Down to Jeremiah:<P>In the kingdom of Judah the status of the prophets was somewhat more favorable than it was in Ephraim. They were indeed forced in Jerusalem also to contend against the injustice on the part of the ruling classes and against immorality of all kinds. But in this kingdom there were at any rate from time to time found kings who walked more in the footsteps of David. Thus Asa followed the directions of the prophet Azariah (<a onClick="return mV(\'2Ch\',15,1);">2Ch 15:1</a>). It is true that the prophet Hanani censured this king, but it was done for a different reason. Jehoshaphat also regularly consulted the prophets. Among those who had dealings with him Elisha is also mentioned (<a onClick="return mV(\'2Ki\',3,14);">2Ki 3:14</a>), as also some other prophets (compare <a onClick="return mV(\'2Ch\',19,2);">2Ch 19:2</a>; <a onClick="return mV(\'2Ch\',20,\'14-37\');">20:14-37</a>). The greatest among the prophets during the period of the Assyrian invasions was Isaiah, who performed the duties of his office for more than 40 years, and under the kings Jotham, Ahaz, Hezekiah, and possibly too under Manasseh, through his word exercised a powerful influence upon the king and the nation. Although a preacher of judgments, he at critical times appeared also as a prophet of consolation. Nor did he despise external evidences of his prophetic office (compare <a onClick="return mV(\'Isa\',7,11);">Isa 7:11</a>; <a onClick="return mV(\'Isa\',38,22);">38:22</a>, <a onClick="return mV(\'Isa\',38,8);">8</a>). His contemporary Micah is in full agreement with him, although he was not called to deal with the great of the land, with kings, or statesmen, as was the mission of Isaiah. Nahum, Zephaniah and Habakkuk belong rather to the period of transition from the Assyrian to the Chaldean periods. In the days of Josiah the prophetess Huldah had great influence in Jerusalem (<a onClick="return mV(\'2Ki\',22,14);">2Ki 22:14</a>). Much more important under this same king was the prophet Jeremiah, who was called by God for a great mission. This prophet during the siege and destruction of Jerusalem and after that time spoke as an unyielding yet deeply feeling exponent of God, and was compelled again and again to dash to the ground the false hopes of the patriots, whenever these arose. Not so firm was his contemporary and fellow-sufferer Uriah (<a onClick="return mV(\'Jer\',26,20);">Jer 26:20</a>).<P>9. During the Exile, Ezekiel, Deutero-Isaiah, Daniel:<P>In the time of the exile itself we find the period of the activity of Ezekiel. It was significant that this prophet became the recipient of divine revelations while on Babylonian territory. His work was, in accordance with the condition of affairs, more that of a pastor and literary man. He seems also to have been a bodily sufferer. His abnormal conditions became symbolical signs of that which he had to proclaim. Deutero-Isaiah, too (<a onClick="return mV(\'Isa\',40,\'1-\');">Isa 40</a>), spoke during the Babylonian period, namely at its close, and prepared for the return. The peculiar prophecies of Daniel are also accorded to a prophet living during the exile, who occupied a distinguished position at the court of the heathen rulers, and whose apocalyptic utterances are of a kind different from the discourses of the other prophets, as they deal more with the political condition of the world and the drama of history, in so far as this tends toward the establishment of the supremacy of Yahweh. These prophecies were collected in later times and did not receive their final and present form until the Greek period at the beginning of the 2nd century BC.<P>10. After the Exile, Haggai, Zechariah, Malachi:<P>After the return from Babylon the Jews were exhorted by Haggai and Zechariah to rebuild their temple (about 520 BC). At that time there were still to be found prophets who took a hostile attitude to the men of God. Thus Nehemiah (<a onClick="return mV(\'Neh\',6,\'6-14\');">Ne 6:6-14</a>) was opposed by hostile prophets as also by a prophetess, Noadiah. In contrast with these, Malachi is at all times in accord with the canonical prophets, as he was an ardent advocate for the temple cult of Yahweh, not in the sense of a spiritless and senseless external worship, but as against the current indifference to Yahweh. His style and his language, too, evidence a late age. The lyrical form has given way to the didactic. This is also probably the time when the present Book of Jonah was written, a didactic work treating of an older tradition.<P>11. Cessation of Prophecy:<P>Malachi is regarded by the Jews as the last really canonical prophet. While doubtless there was not a total lack of prophetically endowed seers and speakers of God also in the closing centuries of the pre-Christian era, nevertheless the general conviction prevailed that the Spirit of God was no longer present, e.g. in the times of the Maccabees (compare 1Macc 4:46; 9:27; 14:41). It is true that certain modern critics ascribe some large sections of the Book of Isaiah, as well as of other prophets, even to a period as late as the Greek. But this is refuted by the fact mentioned in Ecclesiasticus (beginning of the 2nd century BC) that in the writer\'s time the prophetical Canon appeared already as a closed collection. Daniel is not found in this collection, but the Book of the Twelve Minor Prophets is. It was during this period that apocalyptic literature began to flourish, many specimens of which are foundamong the Apocrypha and the Pseudepigrapha. These books consist of eschatological speculations, not the product of original inspiration, but emanating from the study of the prophetic word. The very name Pseudepigrapha shows that the author issued his work, not under his own name, but under the pseudonym of some man of God from older times, such as Enoch, Ezra, Moses, Isaiah, Jeremiah, Baruch, and others. This fact alone proves the secondary character of this class of literature.<P>See <a href="./study/isbe/search.html?string=APOCALYPTIC+LITERATURE">APOCALYPTIC LITERATURE</a>.<P>12. Prophecy in the New Testament:<P>Malachi finds a successor in John the Baptist, whose coming the former had predicted. John is the greatest of the prophets, because he could directly point to Him who completed the old covenant and fulfilled its promises. All that we know in addition concerning the times of Jesus shows that the prophetical gift was yet thought of as possibly dwelling in many, but that prophecy was no longer the chief spiritual guide of the people (compare e.g. Josephus, Ant, XIII, xi, 2; XV, x,5,among the Essenes, or in the case of Hyrcanus, op. cit., XIII, x, 7). Josephus himself claims to have had prophetic gifts at times (compare BJ, III, viii, 9). He is thinking in this connection chiefly of the prediction of some details. Such "prophets" and "prophetesses" are reported also in the New Testament. In Jesus Christ Himself the prophetic office reached its highest stage of development, as He stood in a more intimate relation than any other being to His Heavenly Father and spoke His word entirely and at all times. In the Christian congregation the office of prophecy is again found, differing from the proclamation of the gospel by the apostles, evangelists, and teachers. In the New Testament the terms prophetes, propheteia, propheteuo, signify speaking under the extraordinary influence of the Holy Ghost. Thus in <a onClick="return mV(\'Act\',11,27);">Ac 11:27</a>f (prophecy of a famine by Agabus); <a onClick="return mV(\'Act\',21,10);">21:10</a>f (prediction of the sufferings of Paul); <a onClick="return mV(\'Act\',13,1);">13:1</A>f (exhortation to mission work); <a onClick="return mV(\'Act\',21,9);">21:9</a>ff (prophetical gift of the daughters of Philip). Paul himself also had this gift (<a onClick="return mV(\'Act\',16,6);">Ac 16:6</a>ff; <a onClick="return mV(\'Act\',18,9);">18:9</a>; <a onClick="return mV(\'Act\',22,17);">22:17</a>ff; <a onClick="return mV(\'Act\',27,23);">27:23</a>f). In the public services of the church, prophecy occupied a prominent position (see especially <a onClick="return mV(\'1Cr\',14,\'1-\');">1Co 14</a>). A prophetical book in a special sense is the Apocalypse of John. The gift of prophecy was claimed by many also in later times. But this gift ceased more and more, as the Christian church more and more developed on the historical basis of revelation as completed in Christ. Especially in spiritually aroused eras in the history of the church, prophecy again puts in its appearance. It has never ceased altogether, but on account of its frequent misuse the gift has become discredited. Jesus Himself warned against false prophets, and during the apostolic times it was often found necessary to urge the importance of trying spirits (<a onClick="return mV(\'1Jo\',4,1);">1Joh 4:1</a>; <a onClick="return mV(\'1Cr\',12,10);">1Co 12:10</a>; <a onClick="return mV(\'1Cr\',14,29);">14:29</a>).``131';
isbe[7126]='Prophecy; Prophets, 3`III. Historical Development of Prophecy.<P>1. Contents of Prophecy:<P>The contents of prophecy are by no means merely predictions concerning the future. That which is given by the Spirit to the prophet can refer to the past and to the present as well as to the future. However, that which is revealed to the prophet finds its inner unity in this, that it all aims to establish the supremacy of Yahweh. Prophecy views also the detailed events in their relation to the divine plan, and this latter has for its purpose the absolute establishment of the supremacy of Yahweh in Israel and eventually on the entire earth. We are accustomed to call those utterances that predict this final purpose the Messianic prophecies. However, not only those that speak of the person of the Messiah belong to this class, but all that treat of the coming of the kingdom of God.<P>2. Conception of the Messiah:<P>The beginnings of the religion of Israel, as also the chief epoch in its development, emanated from prophetical revelations. The prophet Moses elevated the tribal religion into a national religion, and at the same time taught the people to regard the religion of the fathers more ethically, spiritually and vitally. Samuel crowned the earthly form of the concrete theocracy by introducing an "Anointed of Yahweh" in whom the covenant relation between Yahweh and Israel was concentrated personally. The Anointed of the Lord entered into a much more intimate relationship to Yahweh as His Son or Servant than it was possible for the whole people of Israel to do, although as a people they were also called the servant or the son of God (compare <a onClick="return mV(\'Psa\',2,7);">Ps 2:7</a>f; <a onClick="return mV(\'Psa\',110,\'1-\');">110</a>). The Psalms of David are a proof of this, that this high destiny of the kingdom was recognized. David himself became a prophet in those hymns in which he describes his own unique relation to Yahweh. But the actual kings of history as a rule corresponded too imperfectly to this idea. For this reason the word "prophetic" already in David\'s time directs to the future, when this relationship shall be more perfectly realized (<a onClick="return mV(\'2Sa\',7,12);">2Sa 7:12</a>; compare David\'s own words, <a onClick="return mV(\'2Sa\',23,4);">2Sa 23:4</a>).<P>See <a href="./study/isbe/search.html?string=MESSIAH">MESSIAH</a>.<P>3. Before the Exile (through Judgment to Deliverance):<P>Solomon completed the external equipment of theocracy by the erection of the temple. But it was just his reign that constituted the turning-point, from which time on the prophets begin to emphasize the judgment to come, i.e. the dissolution of the external existence of the kingdom of Yahweh. Yet prophecy at all times does this in such a manner, that a kernel of the divine establishment on Zion remains intact. The divine establishment of the sanctuary and the kingdom cannot be destroyed; all that is necessary is that they be restored in greater purity and dignity. This can be seen also in Amos, who predicts that the fallen tabernacle of David shall be raised up again (<a onClick="return mV(\'Amo\',9,11);">Am 9:11</a>), which shall then be followed by a condition of undisturbed blessing. The same is found in Hosea, who sees how all Israel is again united under "David" the king of the last times, when between God and the people, between heaven and earth, an unbroken covenant of love shall be made (<a onClick="return mV(\'Hsa\',2,1,18);">Ho 2:1f; 18</a>); and also in Isaiah, who predicts that during the time of the conquest and subjection of the country by the Gentiles a Son of David shall be born in a miraculous manner and attain supremacy (<a onClick="return mV(\'Isa\',7,14);">Isa 7:14</a>; <a onClick="return mV(\'Isa\',9,2);">9:2</a>ff; <a onClick="return mV(\'Isa\',11,1);">11:1</a>), and who speaks constantly of that divine establishment on Zion (compare the quiet waters of Shiloah, <a onClick="return mV(\'Isa\',8,6);">8:6</A>), the foundation stone that has been laid by Yahweh (<a onClick="return mV(\'Isa\',28,16);">Isa 28:16</a>, etc.). Micah, his contemporary, does the same, and in an entirely similar manner predicts that the radical judgment of destruction which shall come over the temple and the royal palace shall be followed by the wondrous King of Peace from Bethlehem (<a onClick="return mV(\'Mic\',5,1);">Mic 5:1</a>). Possibly even at a somewhat earlier date <a onClick="return mV(\'Zec\',9,9);">Zec 9:9</a> described this future ruler in similar terms. In general it is not probable that Isaiah and Micah were the first to speak so personally of this King. They seem to presuppose that their contemporaries were acquainted with this idea.<P>4. Analogous Ideas among Heathen Peoples:<P>In recent times scholars have pointed to the fact that in the old Orient, among the Egyptians, the Babylonians and elsewhere, the expectation of a miraculously-born King of the future, who was to bring to His own people and to all nations salvation and peace, was entertained at an early period. Yet so much is certain, that Isaiah and Micah did not base their hopes on the vague dreams of the Gentile world, but upon the prophetic establishment of a divine sanctuary and kingdom of Zion. The personal figure of this Son of David is not so much in the foreground in the other prophets down to the period of the exile. These prophets mention only casually the Good Shepherd, as e.g. <a onClick="return mV(\'Jer\',23,1);">Jer 23:1</a>ff; <a onClick="return mV(\'Jer\',33,12);">33:12</a>ff; <a onClick="return mV(\'Eze\',34,23);">Eze 34:23</a>f. But after that time this Messianic expectation became a permanent element in the hopes of Israel.<P>In the meanwhile, prophecy had thrown much light on the ways of God, which prepare for His kingdom on earth. Even long before Amos (<a onClick="return mV(\'Amo\',5,18);">5:18</A>ff) the idea of a "day of Yahweh," which was to be a day of revelation, on which God makes a settlement with the nations, must have been generally known, since Amos is already compelled to protest against the abuse of this expectation. But hand in hand with this settlement we find also and at all times the expectation of the exaltation and of the salvation of Israel. Yet the prophets have all emphasized that Israel and Judah must first be thoroughly purified by a judgment, before the land could, through God\'s grace, be glorified and richly blessed. The judgment which the preexilic prophets are continually predicting is, however, only a means to an end. This judgment is not the final word of the Lord, as Amos, Hosea, Isaiah, Micah and Habakkuk constantly teach. They announce that return to Yahweh and obedience to His commandments is the way to salvation (<a onClick="return mV(\'Hsa\',6,1);">Ho 6:1</a>; <a onClick="return mV(\'Isa\',1,18);">Isa 1:18</a>; <a onClick="return mV(\'Jer\',4,1);">Jer 4:1</a>, and often). However, the prophets know that the people will not turn again to God, but that first the Jewish state must be entirely overthrown (<a onClick="return mV(\'Isa\',6,\'1-\');">Isa 6</a>). It is particularly deserving of notice, that believing trust in Yahweh is regarded as the positive means for deliverance (<a onClick="return mV(\'Isa\',7,9);">Isa 7:9</a>; <a onClick="return mV(\'Isa\',30,15);">30:15</a>; <a onClick="return mV(\'Hab\',2,4);">Hab 2:4</a>). It is through this that the "remnant" of the faithful, "the kernel" of the people, is saved. Also in the case of Jeremiah, whose work it was to predict the immediate destruction of Judah, there is not absent a kind of an esoteric book of consolation. His battle cry for the future is "Yahweh our righteousness" (<a onClick="return mV(\'Jer\',23,6);">Jer 23:6</a>; <a onClick="return mV(\'Jer\',33,16);">33:16</a>). In his case we find a rich spiritualization of religion. The external customs, circumcision and the like, he declares, do no good, if the true state of the heart is lacking. Even the ark of the covenant is unnecessary and is discarded in the enlargement of the sanctuary. Ezekiel, who lays more stress on the external ordinances, nevertheless agrees with Jeremiah in this, that Jerusalem together with the temple must fall. Only after this destruction the prophet in his spirit builds the sanctuary again; notwithstanding the external character of his restoration, there is yet found in his picture a further development of its spiritual character. The ethical rights and the responsibility of the individual are strongly emphasized (<a onClick="return mV(\'Eze\',18,\'1-\');">Ezekiel 18</a>; <a onClick="return mV(\'Eze\',33,\'1-\');">33</a>). The land becomes transformed; the Gentiles are received into the covenant of God.<P>5. During the Exile (Ezekiel, Deutero-Isaiah):<P>Deutero-Isaiah (<a onClick="return mV(\'Isa\',40,\'1-\');">Isa 40:1-66:24</a>), during the time of the Babylonian captivity, enriches prophecy in an extraordinary manner, through the figure of the true "Servant of Yahweh," who in a peaceful way, through his words of instruction and especially through his innocent sufferings and his vicarious deeds, converts Israel, the undeserving servant, and also wins over the Gentile world to Yahweh. It was not possible that the picture of a suffering man of God, who through his death as a martyr attains to exaltation, should be suggested to the Jews by the altogether different figure of a death and resurrection of a Babylonian god (Thammuz-Adonis!). Since the unjust persecutions of Joseph and David they were acquainted with the sufferings of the just, and Jeremiah\'s life as a prophet was a continuous martyrdom. But the writer of the second part of Isaiah had before his eyes a vision that far excelled all of these types in purity and in greatness to such a degree as did David\'s Son in Isaiah and Micah surpass His great ancestor. He brings to a completion the kingdom of God through teaching, suffering and death, and attains to the glory of rulership. In this way He unites the offices of prophet, priest and king.<P>6. After the Exile (Haggai, Zechariah, Malachi):<P>After the exile prophecy continues its work. The Messianic expectations, too, are developed further by Haggai, and still more by Zechariah. Malachi announces the advent of the Day of Yahweh, but expects before this a complete purification of the people of God. God Himself will come, and His angel will prepare the way for Him. The visions of Daniel picture the transformation of the world into a kingdom of God. The latter will mark the end of the history of the world. It comes from above; the earthly kingdoms are from below, and are pictured as beasts; the Ruler of the kingdom of God is a Son of man. The latter comes with the clouds of the heaven to take possession of His kingdom (<a onClick="return mV(\'Dan\',7,13);">Da 7:13</a>). Then the judgment of the world will take place and include also each human being, who before this will bodily arise from the dead, in order to enter upon blessedness or condemnation. Here we find indicated a universal expansion of the kingdom of God extending over the whole world and all mankind.<P>7. Contemporaneous Character of Prophecy:<P>If we survey this prophecy of the kingdom of God and its divinely-blessed Ruler, the Messiah, from a Christian standpoint, we find that a grand divine unity connects its different elements. The form of this prophecy is indeed conditioned by the views and ideas of the time of utterance. The prophets were compelled to speak so that their hearers could understand them. Only gradually these limitations and forms become spiritualized, e.g. the kingdom of God is still pictured by the prophets as established around the local center of Zion. Mt. Zion is in a concrete manner exalted, in order to give expression to its importance, etc. It is the New Testament fulfillment that for the first time gives adequate form to divine revelation. At least in the person of Jesus Christ this perfection is given, although the full unfolding of this kingdom is yet a matter of the future.<P>8. Partial Character of Prophecy:<P>A second characteristic feature of prophecy is the partial nature of the individual prophetical utterances and prophetical pictures. One picture must be supplemented by the others, in order not to be misunderstood. Thus, e.g. according to <a onClick="return mV(\'Isa\',11,14);">Isa 11:14</a>; <a onClick="return mV(\'Zec\',9,13);">Zec 9:13</a>ff, we might expect that the kingdom of God was to be established by force of arms. But the same prophets show in other utterances (<a onClick="return mV(\'Isa\',9,6);">Isa 9:6</a>f; <a onClick="return mV(\'Zec\',9,9);">Zec 9:9</a>f) that these warlike expressions are to be understood figuratively, since the Messianic King is more than all others a Prince of Peace.<P>9. Perspective Character of Prophecy:<P>A third feature that deserves attention is the perspective character of prophecy. The prophet sees together and at once upon the surface of the pictures things which are to be fulfilled only successively and gradually. Thus, e.g. Deutero-Isaiah sees in the near future the return from captivity, and directly connected with this a miraculous glorification of the city of God. The return did as a matter of fact take place soon afterward, but the glorification of the city in which Yahweh Himself had promised to dwell was yet in the distant future. The succeeding prophets, Haggai and Zechariah, predict that this consummation shall take place in the future.<P>Also in the predictions concerning the future made by Jesus and in the Apocalypse of John these characteristics of prophecy, its contemporaneous and perspective and at times symbolical features, are not disregarded. The firm prophetic word is intended to give the congregation certain directive lines and distinctive work. But an adequate idea of what is to come the Christian church will become compelled to form for itself, when the fulfillment and completion shall have taken place.``131';
isbe[7127]='Prophecy; Prophets, 4`IV. Analogous Phenomena among the Gentiles.<p>1. Necromancy and Technical Witchcraft:<P>The uniqueness of Biblical prophecy is grasped fully only when we try to find analogies among the Gentile peoples. Here we find everywhere indeed the art of sooth-saying, the headquarters for which was Babylon. But with this art the prophecy of the Old Testament stands out in bold contrast (compare the prohibitions in <a onClick="return mV(\'Lev\',19,26,31);">Le 19:26,31</a>; <a onClick="return mV(\'Lev\',20,6,27);">20:6,27</a>; <a onClick="return mV(\'Deu\',18,10);">De 18:10</a>ff, prohibitions that refer to necromancy for the purpose of discovering the future). This art was practiced through a medium, a person who had an \'obh (Babylonian, ubi), i.e. a spirit that brought forth the dead in order to question them. The spirits were thought to speak in murmurings or piping sounds (<a onClick="return mV(\'Isa\',8,19);">Isa 8:19</a>), which could be imitated by the medium (ventriloquist). According to the Law, which forbade this under penalty of death, Saul had tried to destroy those who practiced incantations, who generally were women (<a onClick="return mV(\'1Sa\',28,9);">1Sa 28:9</a>). This practice, however, continued to flourish. In addition, the Babylonians and other peoples had also a developed art of interpretation in order to find omens for the future. Especially was the examination of intestines practiced by them. The liver of sacrificial animals particularly was carefully examined, and, from this, predictions, good or bad, were inferred (compare <a onClick="return mV(\'Eze\',21,21);">Eze 21:21</a>). See <a href="./study/isbe/search.html?string=DIVINATION">DIVINATION</a>. This art passed over from the Babylonions to the seafaring Etruscans, and through these came to the Romans. But other phenomena also were by the different nations interpreted as prophetically significant and were by those skilled in this art interpreted accordingly. Among these were miscarriages by human beings and animals, the actions of hens, horses, the flight of birds, earthquakes, forms of the clouds, lightning, and the like. Further, mechanical contrivances were used, such as casting of lots, stones, sticks, etc.<P>2. The Mantic Art:<P>More spiritual and popular was the interpretation of dreams. It also was the case that mediums intentionally would convert themselves into a semi-waking trance. In this way the suitable mediums attained to a certain kind of clairvoyance, found among various peoples. This approaches the condition of an ecstatically aroused pseudo-prophet, of whom mention is made above. In Greece, too, oracles were pronounced by the Pythian prophetess, who by vapors and the like was aroused to a practice of the mantic art. In Dodona it was the voice of the divinity in Nature, which they sought to read in the rustling of the trees and the murmuring of the water. How uncertain these sources were was well known to heathen antiquity. The ancients complain of the enigmatical character of the Sibylline utterances and the doubtful nature of what was said. See <a href="./study/isbe/search.html?string=GREECE,+ RELIGION+IN+ANCIENT">GREECE, RELIGION IN ANCIENT</a>. In contrast to this, Israel knows that it possesses in prophecy a clear word (<a onClick="return mV(\'Num\',23,23);">Nu 23:23</a>).<P>3. Contents of Extra-Biblical Oracles:<P>But the contents also of the Biblical prophecies are unique through their spiritual uniformity and greatness. The oracle at Delphi, too, at times showed a certain moral elevation and could be regarded as the conscience of the nation. But how insignificant and meager was that which it offered to those who questioned it, in comparison with the spontaneous utterances of the prophets of Israel! Also what has in recent times been said concerning the "prophetical texts" from ancient Egypt (Gressmann, Texte und Bilder, I, 20ff) may indeed show some external similarity to the prophecies of Israel; but they lack the spiritual and religious depth and the strictly ethical dignity of the prophets of the Scriptures, as also the consistency with which these from century to century reveal the thoughts of God and make known with constantly increasing clearness their purposes and goal.<P>LITERATURE<P>Witsius, De prophetis et prophetia, 1731; Chr. A. Crusius, Hypomnemata ad theologiam propheticam, Part I, 1764; A. Knobel, Der Prophetismus der Hebraer, 1837; F. B. Koester, Die Propheten des Altes Testament und New Testament, 1838; B. Duhm, Die Theologie der Propheten; Kuenen, The Prophets and Prophecy in Israel; F. E. Koenig, Der Offenbarungsbegriff des Altes Testament, 1882; C. von Orelli, Die alttestamentliche Weissagung von der Vollendung des Gottesreiches, 1882; W. Robertson Smith, The Prophets of Israel and Their Place in History, 1882; E. Riehm, Die messianische Weissagung, English translation, 1885; Delitzsch, Messianic Prophecy, 1891; A. T. Kirkpatrick, The Doctrine of the Prophets, 1892; G. French Oehler, Theologie des A T, 1891; Ed. Koenig, Dos Berufungsbewusstsein der alttestamentlichen Propheten, 1900; F. H. Woods, The Hope of Israel, 1896; R. Kraetzschmar, Prophet und Seher im alten Israel, 1902; A. B. Davidson, Old Testament Prophecy, 1903; Eb. Schrader, Die Keilinschriften und dos A T, 1902; C. von Orelli, Allgemeine Religionsgeschichte; M. Jastrow, Die Religion Babyloniens und Assyriens, 1903; Gressmann, Ursprung der israelitisch-judischen Eschatologie, 1905; W. J. Beecher, The Prophets and the Promise, 1905; C. S. Macfarland, Jesus and the Prophets, 1905; G. G. Findlay, The Books of the Prophets in Their Historical Succession, 1906-7; Gressmann, Alt-orientalische Texte und Bilder zum A T, 1909; Selwyn, Christian Prophets.``131';
isbe[7128]='Prophesyings, False`prof\'-e-si-ingz: The distinction between the true and the false prophecy and prophets is very difficult to state. Broadly speaking, the false prophesying related itself to the national ideal independently of any spiritual quality, while the true prophesying ever kept uppermost the spiritual conception of the national life. Among those given to false prophesying were the ones who spoke after "the deceit of their own heart" (<a onClick="return mV(\'Jer\',14,13,14);">Jer 14:13,14</a>); those who without real prophetic gift borrowed a message and assumed the speech of prophecy (<a onClick="return mV(\'Jer\',23,28,31);">Jer 23:28,31</a>); and those who sought the prophet\'s role in order to gain the material gifts which came from the people to their prophets (<a onClick="return mV(\'Mic\',3,5);">Mic 3:5</a>). These, when discovered, were counted worthy of punishment and even death. There were, however, false prophesyings from men who honestly believed themselves to have a message from Yahweh. These prophecies from self-deceived prophets often led the people astray. The dream of national greatness was substituted for the voice of Yahweh. It was against such prophesying that the true prophets had to contend. The only test here was the spiritual character of the utterance, and this test demanded a certain moral or spiritual sense which the people did not always possess. Consequently, in times of moral darkness the false prophets, predicting smooth things for the nation, independent of repentance, consecration and the pursuit of spiritual ideals, were honored above the true prophets who emphasized the moral greatness of Yahweh and the necessity of righteousness for the nation. In New Testament times false prophesying did much injury in the church.`<a href="./study/isbe/search.html?string=PROPHECY">PROPHECY</a>`158';
isbe[7129]='Prophet, the Old``<a href="./study/isbe/search.html?string=OLD+PROPHET,+THE">OLD PROPHET, THE</a>`1';
isbe[7130]='Prophetess`prof\'-et-es (nebhi\'ah; prophetis): Women were not excluded from the prophetic office in the Old Testament, and were honored with the right of prophetic utterance in the New Testament. It should be noted, however, that women like Miriam (<a onClick="return mV(\'Exd\',15,20);">Ex 15:20</a>), Deborah (<a onClick="return mV(\'Jdg\',4,4);">Jud 4:4</a>) and Huldah (<a onClick="return mV(\'2Ki\',22,14);">2Ki 22:14</a>) were not credited with the seer\'s insight into the future, but were called "prophetesses" because of the poetical inspiration of their speech. Among others mentioned as having the prophetic gift we find Hannah (<a onClick="return mV(\'1Sa\',2,1);">1Sa 2:1</a>), Anna (<a onClick="return mV(\'Luk\',2,36);">Lu 2:36</a>) and the four daughters of Philip (<a onClick="return mV(\'Act\',21,8.9);">Ac 21:8,9</a>).`<a href="./study/isbe/search.html?string=PROPHET">PROPHET</a>`158';
isbe[7131]='Propitiation`pro-pish-i-a\'-shun:<P>1. Terms and Meaning:<P>The word is Latin and brings into its English use the atmosphere of heathen rites for winning the favor, or averting the anger, of the gods. In the Old Testament it represents a number of Hebrew words—ten, including derivatives—which are sufficiently discussed under <a href="./study/isbe/search.html?string=ATONEMENT">ATONEMENT</a> (which see), of which propitiation is one aspect. It represents in Septuagint the Greek stems hilask- (hile-), and katallag-, with derivatives; in the New Testament only the latter, and is rarely used. Propitiation needs to be studied in connection with reconciliation, which is used frequently in some of the most strategic sentences of the New Testament, especially in the newer versions In <a onClick="return mV(\'Hbr\',2,17);">Heb 2:17</a>, the English Revised Version and the American Standard Revised Version have both changed "reconciliation" of the King James Version to "propitiation," to make it correspond with the Old Testament use in connection with the sacrifice on the <a href="./study/isbe/search.html?string=DAY+OF+ATONEMENT">DAY OF ATONEMENT</a> (which see). <a onClick="return mV(\'Luk\',18,13);">Lu 18:13</a> ("God, be thou merciful (margin "be propitiated") to me the sinner" (the American Standard Revised Version margin)); <a onClick="return mV(\'Hbr\',8,12);">Heb 8:12</a> (quoted from the Septuagint); and <a onClick="return mV(\'Mat\',16,22);">Mt 16:22</a> (an idiomatic asseveration like English "mercy on us") will help in getting at the usage in the New Testament. In Septuagint hilasterion is the term for the "mercy-seat" or "lid of the ark" of the covenant which was sprinkled with blood on the Day of Atonement. It is employed in exactly this sense in <a onClick="return mV(\'Hbr\',9,5);">Heb 9:5</a>, where later versions have in the margin "the propitiatory."<P>Elsewhere in the New Testament this form is found only in <a onClick="return mV(\'Rom\',3,25);">Ro 3:25</a>, and it is here that difficulty and difference are found extensively in interpreting. Greek fathers generally and prominent modern scholars understand Paul here to say that God appointed Christ Jesus to be the "mercy-seat" for sinners. The reference, while primarily to the Jewish ceremonial in tabernacle and temple, would not depend upon this reference for its comprehension, for the idea was general in religious thought, that some place and means had to be provided for securing friendly meeting with the Deity, offended by man\'s sin. In Hebrews particularly, as elsewhere generally, Jesus Christ is presented as priest and sacrifice. Many modern writers (compare Sanday and Headlam), therefore, object that to make Him the "mercy-seat" here complicates the figure still further, and so would understand hilasterion as "expiatory sacrifice." While this is not impossible, it is better to take the word in the usual sense of "mercy-seat." It is not necessary to complicate the illustration by bringing in the idea of priest at all here, since Paul does not do so; mercy-seat and sacrifice are both in Christ. hilasmos, is found in the New Testament only in <a onClick="return mV(\'1Jo\',2,2);">1Joh 2:2</a>; <a onClick="return mV(\'1Jo\',4,10);">4:10</a>. Here the idea is active grace, or mercy, or friendliness. The teaching corresponds exactly with that in Romans. "Jesus Christ the righteous" is our "Advocate (margin "Helper") with the Father," because He is active mercy concerning (peri) our sins and those of the whole world. Or (<a onClick="return mV(\'Rom\',4,10);">Ro 4:10</a>), God "loved us, and sent his Son to be the propitiation for (active mercy concerning) our sins." This last passage is parallel with <a onClick="return mV(\'Rom\',3,25);">Ro 3:25</a>, the one dealing with the abstract theory, and so Christ is set forward as a "mercy-seat," the other dealing with experience of grace, and so Christ is the mercy of God in concrete expression.<P>2. Theological Implication:<P>The basal idea in Hebrew terms is that of covering what is offensive, so restoring friendship, or causing to be kindly disposed. The Greek terms lack the physical reference to covering but introduce the idea of friendliness where antagonism would be natural; hence, graciousness. Naturally, therefore, the idea of expiation entered into the concept. It is especially to be noted that all provisions for this friendly relation as between God and offending man find their initiation and provision in God and are under His direction, but involve the active response of man. All heathen and unworthy conceptions are removed from the Christian notion of propitiation by the fact that God Himself proposed, or "set forth," Christ as the "mercy-seat," and that this is the supreme expression of ultimate love. God had all the while been merciful, friendly, "passing over" man\'s sins with no apparently adequate, or just, ground for doing so. Now in the blood of Christ sin is condemned and expiated, and God is able to establish and maintain His character for righteousness, while He continues and extends His dealing in gracious love with sinners who exercise faith in Jesus. The propitiation originates with God, not to appease Himself, but to justify Himself in His uniform kindness to men deserving harshness. Compare also as to reconciliation, as in <a onClick="return mV(\'Rom\',5,\'1-11\');">Ro 5:1-11</a>; <a onClick="return mV(\'2Cr\',5,18);">2Co 5:18</a>ff.<P>LITERATURE.<P>Besides the comms., the literature is the same as for <a href="./study/isbe/search.html?string=ATONEMENT">ATONEMENT</a>, to recent works on which add Stalker, The Atonement; Workman, At Onement, or Reconciliation with God; Moberly, in Foundations, Christian Belief in Terms of Modern Thought.`<a href="./study/isbe/search.html?string=JOHANNINE+THEOLOGY">JOHANNINE THEOLOGY</a>`21';
isbe[7132]='Proportion`pro-por\'-shun: Occurs once in the sense of "space" as the translation of ma\'-ar, "void or open space" (<a onClick="return mV(\'1Ki\',7,36);">1Ki 7:36</a> the King James Version margin "Hebrew \'nakedness,\' " the Revised Version (British and American) "space"); once in the obsolete sense of "form" as the translation of \'erekh, "array," or "row" (<a onClick="return mV(\'Job\',41,12);">Job 41:12</a>, the Revised Version (British and American) "frame"); and once in the sense of "measure" as the translation of analogia, "proportion" "equality" (<a onClick="return mV(\'Rom\',12,6);">Ro 12:6</a>, "the proportion of faith," the Revised Version (British and American) "the proportion of our faith"). "Proportionally" occurs in <span clas="noTag">The Wisdom of Solomon 13:5</a>, analogos, the Revised Version (British and American) "in like proportion," margin "correspondently."``1';
isbe[7133]='Proselyte`pros\'-e-lit (proselutos, from proserchomai, "I approach"): Found 4 times in the New Testament. In the Septuagint it often occurs as the translation of ger. The Hebrew verb gur means "to sojourn"; ger accordingly means a stranger who has come to settle in the land, as distinguished on the one hand from \'ezrach, "a homeborn" or "native," and on the other from nokhri or ben-nekhar, which means a stranger who is only passing through the country. Yet it is to be noted that in <a onClick="return mV(\'2Ch\',2,17);">2Ch 2:17</a> those of the native tribes still living in the land as Amorites, Hittites, etc., are also called gerim. In two places, (<a onClick="return mV(\'Exd\',12,19);">Ex 12:19</a>; <a onClick="return mV(\'Isa\',14,1);">Isa 14:1</a>) the Septuagint uses g(e)ioras, which is derived from giyor, the Aramaic equivalent for ger. Septuagint uses paroikos (the Greek equivalent for the Hebrew toshabh, "a settler") for ger when Israel or the triarchs are indicated (<a onClick="return mV(\'Gen\',15,13);">Ge 15:13</a>; <a onClick="return mV(\'Gen\',23,4);">23:4</a>; <a onClick="return mV(\'Exd\',2,22);">Ex 2:22</a>; <a onClick="return mV(\'Exd\',18,3);">18:3</a>; <a onClick="return mV(\'Deu\',23,7);">De 23:7</a>; <a onClick="return mV(\'1Ch\',29,15);">1Ch 29:15</a>; <a onClick="return mV(\'Psa\',39,12);">Ps 39:12</a>; <a onClick="return mV(\'Psa\',119,19);">119:19</a>; <a onClick="return mV(\'Jer\',14,8);">Jer 14:8</a>), and in a few other cases. In Talmudical literature ger always stands for proselyte in the New Testament sense, i.e. a Gentile who has been converted to Judaism. Onkelos, who was himself a proselyte, always translates the word in this way.<P>1. Ger in the Old Testament:<P>No difficulties were put in the way of those strangers who wished to settle down in the land of Israel. All strangers, the third generation of Egyptians and Edomites included, and only Ammonites and Moabites excluded, could enter "the congregation of God" without circumcision and without the obligation to keep the ceremonial law.<P>\'The stranger within the gate\' was free to eat meat which was prohibited to the Israelite (<a onClick="return mV(\'Deu\',14,21);">De 14:21</a>). If, however, the stranger wished to take part in the Passover, a feast permeated with national ideals, he must be circumcised. The keeping of the Sabbath and other feasts was regarded rather as a privilege than as a duty (<a onClick="return mV(\'Exd\',23,12);">Ex 23:12</a>; <a onClick="return mV(\'Deu\',16,11,14);">De 16:11,14</a>); but according to <a onClick="return mV(\'Lev\',16,29);">Le 16:29</a> the ger was obliged to keep the fast of Atonement. He was forbidden on pain of death to blaspheme (<a onClick="return mV(\'Lev\',24,16);">Le 24:16</a>) or to offer children to Molech (<a onClick="return mV(\'Lev\',20,2);">Le 20:2</a>). If he desired to bring a burnt offering, the same law applied to him as to the Israelites (<a onClick="return mV(\'Lev\',17,8);">Le 17:8</a>; <a onClick="return mV(\'Lev\',22,18);">22:18</a>). Though the law of circumcision was not forced upon the ger, it seems that the Mosaic Law endeavored to bring him nearer to the cult of Israel, not from any proselytizing motives, but in order to preserve theocracy from admixture of foreign elements, which would speedily have proved fatal to its existence.<P>Though the God of Israel, when He is thought of only as such, ceases to be God; though Israel was chosen before all nations for all nations; though Israel had been again and again reminded that the Messiah would bring a blessing to all nations; and though there were instances of pagans coming to believe in Yahweh, yet it did not belong to the economy of Old Testament religion to spread the knowledge of God directly among the Gentiles (the Book of Jonah is an exception to this). There was certainly no active propagandism. Though we read in <a onClick="return mV(\'Neh\',10,28);">Ne 10:28</a> of those who "separated themselves from the peoples of the lands unto the law of God" (compare <a onClick="return mV(\'Isa\',56,3);">Isa 56:3</a>, "the foreigner, that hath joined himself to Yahweh"—the only and exact description of a proselyte proper in the Old Testament), the spirit of exclusiveness prevailed; the doubtful elements were separated (<a onClick="return mV(\'Ezr\',4,3);">Ezr 4:3</a>): mixed marriages were prohibited by the chiefs, and were afterward disapproved of by the people (<a onClick="return mV(\'Ezr\',9,\'1-\');">Ezr 9</a>; <a onClick="return mV(\'Ezr\',10,\'1-\');">10</a>; <a onClick="return mV(\'Neh\',13,23);">Ne 13:23</a>). Direct proselytism did not begin till about a century later.<P>2. Proselytizing:<P>The preaching of the gospel was preceded and prepared for by the dispersion of the Jews, and a world-wide propagandism of Judaism. In the 5th century BC the Jews had a temple of their own at Syene. Alexander the Great settled 8,000 Jews in the Thebais, and Jews formed a third of the population of Alexandria. Large numbers were brought from Palestine by Ptolemy I (320 BC), and they gradually spread from Egypt along the whole Mediterranean coast of Africa. After the persecution of Antiochus Epiphanes (170 BC) they scattered themselves in every direction, and, in the words of the Sibylline Oracles (circa 160 BC), "crowded with their numbers every ocean and country." There was hardly a seaport or a commercial center in Asia Minor, Macedonia, Greece, or the Islands of the AEgean, in which Jewish communities were not to be found. Josephus (Ant., XIV, vii, 2) quotes Strabo as saying: "It is hard to find a place in the habitable earth that hath not admitted this tribe of men, and is not possessed by them." Thus, in spite of the hatred and contempt which Judaism everywhere excited, its lofty, austere and spiritual religious aspirations and conceptions became known to the pagan world and exercised a profound attraction upon many souls that were deeply dissatisfied with contemporary religions. Judaism was at that period filled with missionary zeal and aspired to world-mastery. Many books on Judaism (e.g. the Sibylline Oracles) were written anonymously by Jews in order to influence pagan readers. The synagogue, which had become the center of Jewish worship, now opened its doors widely to the pagan world (compare <a onClick="return mV(\'Act\',15,21);">Ac 15:21</a>), and many of the sermons delivered there were directly aimed at the conversion of pagans. The Jews began to feel that they were "a guide of the blind, a fight of them that are in darkness" (<a onClick="return mV(\'Rom\',2,19);">Ro 2:19</a>).<P>Not only Josephus (Apion, II; BJ, VII, iii, 3), but also Seneca (Apud Aug. De Civit. Dei vi.11), Dio Cassius (xxxvii.17), Tacitus (Ann. ii.85; Hist. v.5), Horace (Sat. i.4, 142), Juvenal (Sat. xiv.96ff), and other Greek and Roman writers testify to the widespread effects of the proselytizing propaganda of the Jews.<P>Many gladly frequented the synagogues and kept some of the Jewish laws and customs. Among those were to be found the "men who feared God," spoken of in Acts. They were so called to distinguish them from full proselytes; and it was probably for this class that tablets of warning in the temple were inscribed in Greek and Latin<P>Another class kept practically all the Jewish laws and customs, but were not circumcised. Some again, though not circumcised, had their children circumcised (Juvenal Sat. xiv.96ff). Such Jewish customs as fasting, cleansings, abstaining from pork, lighting the candles on Friday evening, and keeping the Sabbath (Josephus, Apion, II,29,etc.) were observed by these Gentile sympathizers. Schurer holds that there were congregations of Greeks and Romans in Asia Minor, and probably in Rome, which, though they had no connection with the synagogue, formed themselves into gatherings after the pattern of the synagogue, and observed some of the Jewish customs. Among the converts to Judaism there were probably few who were circumcised, and most of those who were circumcised submitted to the rite in order to marry Jewesses, or to enjoy the rights and privileges granted to the Jews by Syrian, Egyptian and Roman rulers (Josephus, Ant, XIV, vii, 2; XX, vii, 1; compare XVI, vii, 6). It would appear from Christ\'s words ("one proselyte") that the number of full proselytes was not large. Hyrcanus forced the Edomites to adopt Judaism by circumcision (129 BC); and on other occasions the same policy of propagandism by force was followed. Josephus tells an interesting story (Ant., XX, ii, 1) of the conversion of Queen Helena of Adiabene and her two sons. The conversion of the sons was due to the teaching of a merchant called Ananias, who did not insist on circumcision. Later, another Jew, Eliezer of Galilee, told the young princes that it was not enough to read the Law, but that they must keep it too, with the result that both were circumcised. From this it is evident that Jewish teachers of the Gentile converts varied in the strictness of their teaching.<P>3. Proselytes in the New Testament:<P>The word "proselyte" occurs 4 times in the New Testament; once in Matthew (<a onClick="return mV(\'Mat\',23,15);">23:15</A>), where our Lord refers to the proselytizing zeal of the Pharisees, and to the pernicious influence which they exerted on their converts; and 3 times in Acts. Proselytes were present at Pentecost (<a onClick="return mV(\'Act\',2,10);">Ac 2:10</a>); Nicolas, one of the deacons appointed by the primitive church at Jerusalem, was a proselyte (<a onClick="return mV(\'Act\',6,5);">Ac 6:5</a>); and after Paul had spoken in the synagogue at Antioch of Pisidia, many devout proselytes followed Paul and Barnabas (<a onClick="return mV(\'Act\',13,43);">Ac 13:43</a>). It is to be noted in this last case that the proselytes are called sebomenoi, a word generally reserved for another class. Certain people are spoken of in Acts as phoboumenoi ton theon, "fearing God" (<a onClick="return mV(\'Act\',10,2,22,35);">10:2,22,35</a>; <a onClick="return mV(\'Act\',13,16,26);">13:16,26</a>), and as sebomenoi ton theon, "reverencing God," or simply sebomenoi (<a onClick="return mV(\'Act\',13,50);">13:50</a>; <a onClick="return mV(\'Act\',16,14);">16:14</a>; <a onClick="return mV(\'Act\',17,4,17);">17:4,17</A>; <a onClick="return mV(\'Act\',18,7);">18:7</a>). These seem (as against Bertholet and EB) to have been sympathizers with Judaism, who attended the worship of the synagogue, but were not circumcised. It was among this class that the gospel made its first converts among the Gentiles. Those who were fully proselytes were probably as fanatical opponents of Christianity as were the Jews.<P>4. Ger in the Talmud:<P>From the old strict Pharisaic-Palestinian point of view, circumcision, with the addition of baptism and the offering of sacrifice, was indispensable (so to Paul every circumcised person was a Jew; compare <a onClick="return mV(\'Gal\',5,3);">Ga 5:3</a>); and thus their converts had to submit to the whole burden of the Mosaic and traditional Law. The rabbinic distinction between ger toshabh, "a settler," and ger tsedheq, "a proselyte of righteousness," is, according to Schurer, only theoretical, and arose at a later date (Babha\' Metsi\'a\' 5 6,9,12; Makkoth 2 3; Negha\'im 3 1, et al.).<P>While the ger tsedheq (or ger ha-berith, "proselyte of the covenant") was considered as being in every respect a "perfect Israelite," the ger toshabh (or ger sha\'ar, "proselyte of the gate"; compare <a onClick="return mV(\'Exd\',20,10);">Ex 20:10</a>) only professed his faith in the God of Israel, and bound himself to the observance of the 7 Noachic precepts, abstinence from blasphemy, idolatry, homicide, fornication, robbery, eating the flesh of an animal that had died a natural death, and disobedience to (Jewish) authority (Sanh. 56a; compare <a onClick="return mV(\'Act\',15,20,29);">Ac 15:20,29</a>; <a onClick="return mV(\'Act\',21,25);">21:25</a>). He was considered more of a Gentile than a Jew.<P>Three things were required for the admission of a proselyte, circumcision, baptism, and the offering of sacrifice (Ber. 47b; Yebham. 45b, 46a, 48b, 76a; \'Abhoth 57a, et al.). In the case of women only baptism and the offering of sacrifice were required; for that reason there were more women converts than men. Josephus (BJ, II, xx, 2) tells how most of the women of Damascus were addicted to the Jewish religion. Doubt has been expressed as to the necessity of proselytes being baptized, since there is no mention of it by Paul or Philo or Josephus, but it is probable that a Gentile, who was unclean, would not be admitted to the temple without being cleansed.<P>The proselyte was received in the following manner. He was first asked his reason for wishing to embrace Judaism. He was told that Israel was in a state of affliction; if he replied that he was aware of the fact and felt himself unworthy to share these afflictions, he was admitted. Then he received instruction in some of the "light" and "heavy" commandments, the rules concerning gleaning and tithes, and the penalties attached to the breach of the commandments. If he was willing to submit to all this, he was circumcised, and after his recovery he was immersed without delay. At this latter ceremony two "disciples of the wise" stood by to tell him more of the "light" and "heavy" commandments. When he came up after the immersion, those assembled addressed him saying: "Unto whom hast thou given thyself? Blessed art thou, thou hast given thyself to God; the world was created for the sake of Israel, and only Israelites are called the children of God. The afflictions, of which we spoke, we mentioned only to make thy reward the greater." After his baptism he was considered to be a new man, "a little child newly born" (Yebham. 22a, 47a, 48b, 97b); a new name was given him; either he was named "Abraham the son of Abraham," or the Scriptures were opened at hazard, and the first name that was read was given to him. Thenceforth he had to put behind him all his past; even his marriage ties and those of kinship no longer held good (compare Yebham. 22a; Sanhedrin 58b).<P>Although he was thus juridically considered a new man, and one whose praises were sung in the Talmudical literature, he was yet on the whole looked down on as inferior to a born Jew (Kidd. 4 7; Shebhu\'oth 10 9, et al.). Rabbi Chelbo said: "Proselytes are as injurious to Israel as a scab" (Yebham. 47b; Kidd. 70b; compare <a onClick="return mV(\'Phl\',3,5);">Php 3:5</a>).<P>LITERATURE.<P>See articles on "Proselyte" and "Ger." in EB, HDB, Jewish Encyclopedia, and RE; Slevogt, De proselytis Judeorum, 1651; A. Bertholet, Die Stellung der Israeliten und der Juden zu den Fremden, 1896; Schurer, HJP, 1898; Huidekoper, Judaism at Rome, 1887; Harnack, Mission und Ausbreitung des Christentums,1906,English translation; Allen, "On the Meaning of proselutos in the Septuagint," The Expositor, 1894; A. B. Davidson, "They That Fear the Lord," Expository Times, III (1892), 491ff.`<a href="./study/isbe/search.html?string=STRANGER+AND+SOJOURNER">STRANGER AND SOJOURNER</a>`98';
isbe[7134]='Proseuche; Proseucha`pro-su\'-ke, prosu\'-ka (proseuche): "A place in the open air where the Jews were wont to pray, outside of those cities where they had no synagogue," <a onClick="return mV(\'Act\',16,13,16);">Ac 16:13,16</a> (Thayer, Lexicon of the New Testament).`<a href="./study/isbe/search.html?string=PHILIPPI">PHILIPPI</a>`1';

isbe[7138]='Prove`proov (bachan, nacah; dokimazo, peirazo): Means (1) to test or try; (2) to establish, demonstrate; (3) to find by experience. It is for the most part in the first (original) sense that the word is found in Scripture. In the Old Testament it is most frequently the translation of nacah, primarily "to lift," hence, to weigh (<a onClick="return mV(\'Gen\',42,15,16);">Ge 42:15,16</a>, etc.). God is said to "prove" His people, i.e. to test or try them for their good (<a onClick="return mV(\'Gen\',22,1);">Ge 22:1</a>; <a onClick="return mV(\'Exd\',15,25);">Ex 15:25</a>; <a onClick="return mV(\'Deu\',8,16);">De 8:16</a>, etc.). The Psalmist prays that God may prove him (<a onClick="return mV(\'Psa\',26,2);">Ps 26:2</a>). The word is frequently rendered "tempt." See <a href="./study/isbe/search.html?string=TEMPT">TEMPT</a>. The word bachan, primarily "to try by heat," has a similar meaning (<a onClick="return mV(\'Psa\',17,3);">Ps 17:3</a>, the heart, like metal, purified from dross; compare <a onClick="return mV(\'Job\',23,10);">Job 23:10</a>; <a onClick="return mV(\'Psa\',7,9);">Ps 7:9</a>; <a onClick="return mV(\'Mal\',3,2);">Mal 3:2</a>, etc.). In the New Testament the word most frequently rendered "prove" (sometimes "try") is dokimazo (<a onClick="return mV(\'Luk\',14,19);">Lu 14:19</a>; <a onClick="return mV(\'Rom\',12,2);">Ro 12:2</a>; <a onClick="return mV(\'2Cr\',8,8,22);">2Co 8:8,22</a>; <a onClick="return mV(\'2Cr\',13,5);">13:5</a>; <a onClick="return mV(\'Eph\',5,10);">Eph 5:10</a>; <a onClick="return mV(\'1Th\',5,21);">1Th 5:21</a>). Peirazo, "to tempt," "to prove," used in both a good and a bad sense, frequently translated "<a href="./study/isbe/search.html?string=TEMPT;+TEMPTATION">tempt</a>" (which see), is rendered "prove" in <a onClick="return mV(\'Jhn\',6,6);">Joh 6:6</a>, "This he said to prove him." Both Greek words occur frequently in Apocrypha (Wisdom and Ecclesiasticus). the Revised Version (British and American) has "prove" for "tempt" (<a onClick="return mV(\'Gen\',22,1);">Ge 22:1</a>); for, "make" (<a onClick="return mV(\'Job\',24,25);">Job 24:25</a>; <a onClick="return mV(\'Gal\',2,18);">Ga 2:18</a>); for "manifest" (<a onClick="return mV(\'Ecc\',3,18);">Ec 3:18</a>); for "examine" (<a onClick="return mV(\'1Cr\',11,28);">1Co 11:28</a>); for "try" (<a onClick="return mV(\'1Cr\',3,13);">1Co 3:13</a>; <a onClick="return mV(\'1Jo\',4,1);">1Joh 4:1</a>), etc.``185';
isbe[7139]='Provender`prov\'-en-der<P>(1) micpo\', from obsolete capha\', "to feed," fodder for cattle in general (<a onClick="return mV(\'Gen\',24,25,32);">Ge 24:25,32</a>; <a onClick="return mV(\'Gen\',42,27);">42:27</a>; <a onClick="return mV(\'Jdg\',19,19,21);">Jud 19:19,21</a>);<P>(2) belil, from balal, "to mix": "Loweth the ox over his fodder?" (<a onClick="return mV(\'Job\',6,5);">Job 6:5</a>); belil chamits: "The young asses that till the ground shall eat savory (Hebrew "salted") provender" (<a onClick="return mV(\'Isa\',30,24);">Isa 30:24</a>); this is fodder mixed with salt or aromatic herbs): The ordinary provender in Palestine, besides fresh pasturage, is tibn, i.e. straw broken on the threshing floor, kursenneh (Vetch, Vicia errilia), given especially to camels and milch cows; bran, for fattening and especially in cold weather; and, occasionally, hay made from the dried mixed grass and herbs which spring up luxuriously after the rains. The Circassian colonists east of the Jordan are teaching their neighbors the value of this food, so long neglected.``117';
isbe[7140]='Proverb`prov\'-erb (mashal, chidhah; parabole (<a onClick="return mV(\'Luk\',4,23);">Lu 4:23</a>), paroimia (<a onClick="return mV(\'Jhn\',16,25,29);">Joh 16:25,29</a>)):<P><b>I. FOLK MEANING AND USE</b><P class="in15">1. The Primitive Sense<P class="in15">2. The Communal Origin<P class="in15">3. Animus of Proverbs<P><b>II. LITERARY DEVELOPMENT OF THE PROVERB</b><P class="in15">1. Discovery of Literary Value<P class="in15">2. The Differentiation<P><b>III. AS UNIT OF A STRAIN OF LITERATURE</b><P class="in15">1. From Detachment to Continuity<P class="in15">2. The Conception of Wisdom<P class="in15">3. In Later Times<hr /><P>By this term mainly, but sometimes by the term "parable" (e.g. <a onClick="return mV(\'Num\',23,7,18);">Nu 23:7,18</a>; <a onClick="return mV(\'Num\',24,3,15);">24:3,15</a>; <a onClick="return mV(\'Job\',27,1);">Job 27:1</a>; <a onClick="return mV(\'Job\',29,1);">29:1</a>), is translated the Hebrew word (mashal), which designates the formal unit or vehicle of didactic discourse. The mashal was an enunciation of truth, self-evident and self-illustrative, in some pointed or concentrated form adapted to arrest attention, awaken responsive thought, and remain fixed in memory. Its scope was broader than that of our word "proverb," taking in subject matter as well as form. The mashal broadened indeed in the course of its history, until it became the characteristic idiom of Hebrew philosophy, as distinguished from the dialectic method of the Greeks. The Hebrew mind was not inductive but intuitive; it saw and asserted; and the word mashal is the generic term for the form in which its assertion was embodied.<P>I. Folk Meaning and Use.<P>1. The Primitive Sense:<P>The mashal, nearly in our sense of proverb, traces back to the heart and life of the common folk; it is a native form reflecting in a peculiarly intimate way the distinctive genius of the Hebrew people. As to the primitive sense of the word, it is usually traced to a root meaning "likeness," or "comparison," as if the first sense of it were of the principle of analogy underlying it; but this derivation is a guess. The word is just as likely to be connected with the verb mashal, "to rule" or "master"; so by a natural secondary meaning to denote that statement which gives the decisive or final verdict, says the master word. The idea of how the thing is said, or by what phrasing, would be a later differentiation, coming in with literary refinement.<P>2. The Communal Origin:<P>The earliest cited proverb (<a onClick="return mV(\'1Sa\',10,12);">1Sa 10:12</a>, repeated with varied occasion, <a onClick="return mV(\'1Sa\',19,24);">1Sa 19:24</a>) seems to have risen spontaneously from the people\'s observation. That Saul, the son of Kish, whose very different temperament everybody knew, should be susceptible to the wild ecstasy of strolling prophets was an astonishing thing, as it were a discovery in psychology; "Therefore it became a proverb, Is Saul also among the prophets?" A few years later David, explaining his clemency in sparing the life of the king who has become his deadly foe, quotes from a folk fund of proverbs: <a onClick="return mV(\'1Sa\',24,13);">1Sa 24:13</a>, "As saith the proverb of the ancients, Out of the wicked cometh forth wickedness; but my hand shall not be upon thee." The prophet Ezekiel quotes a proverb which evidently embodies a popular belief: "The days are prolonged, and every vision faileth"; which he corrects to, "The days are at hand, and the fulfillment of every vision" (<a onClick="return mV(\'Eze\',12,22,23);">Eze 12:22,23</a>). Both Ezekiel and Jeremiah (<a onClick="return mV(\'Eze\',18,2);">Eze 18:2</a>; <a onClick="return mV(\'Jer\',31,29);">Jer 31:29</a>) quote the same current proverb, "The fathers have eaten sour grapes, and the children\'s teeth are set on edge," in order to announce that the time has come for its discontinuance. These last two examples are very instructive. They show how the body of the people put the inwardness of their history into proverb form, as it were a portable lesson for the times; they show also how the prophets availed themselves of these floating sayings to point their own message. Ezekiel seems indeed to recognize the facility with which a situation may bring forth a proverb: <a onClick="return mV(\'Eze\',16,44);">Eze 16:44</a>, "Every one that useth proverbs shall use this proverb against thee (literally every one that mashals shall mashal against thee), saying, As is the mother, so is her daughter."<P>3. Animus of Proverbs:<P>One element of the proverb, which a wide-awake people like the Hebrews would soon discover, was its adaptability for personal portrayal or satire, like a home thrust. Hence, the popular use of the name mashal came to connote its animus, generally of sarcasm or scorn. The taunting verse raised against Heshbon, <a onClick="return mV(\'Num\',21,\'27-30\');">Nu 21:27-30</a>, is attributed to them "that speak in proverbs" (meshalim); and Isaiah\'s taunt in his burden of Babylon (<a onClick="return mV(\'Isa\',14,\'4-20\');">Isa 14:4-20</a>) is composed in the proverb measure: "Thou shalt take up this parable (mashal, the King James Version "proverb") against the king of Babylon." Answering to this prevailing animus of proverbs was a corresponding susceptibility to their sting and rankle; they were the kind of utterance that most surely found the national and individual self-consciousness. To be a proverb—to be in everybody\'s mouth as a subject of laughter, or as a synonym for some awful atrocity—was about the most dreadful thing that could befall them. To be "a reproach and a proverb, a taunt and a curse" (<a onClick="return mV(\'Jer\',24,9);">Jer 24:9</a>) was all one. That this should be the nation\'s fate was held as a threat over them by lawgiver and prophet (<a onClick="return mV(\'Deu\',28,37);">De 28:37</a>; <a onClick="return mV(\'1Ki\',9,7);">1Ki 9:7</a>); and in adversities of experience, both individual and collective, the thing that was most keenly felt was to have become a byword (mashal) (<a onClick="return mV(\'Psa\',44,14);">Ps 44:14</a>; <a onClick="return mV(\'Psa\',69,11);">69:11</a>).<P>II. Literary Development of the Proverb.<P>1. Discovery of Literary Value:<P>The rank of proverb was by no means attributed to every popular saying, however the people might set store by it. If its application was merely local (e.g. <a onClick="return mV(\'2Sa\',20,18);">2Sa 20:18</a>; <a onClick="return mV(\'Gen\',22,14);">Ge 22:14</a>) or temporary (note how Jeremiah and Ezekiel announce popular sayings as obsolete), it remained in its place and time. About the proverb, on the other hand, there was the sense of a value universal and permanent, fitting it for literary immortality. Nor was the proverb itself a run-wild thing, at the shaping of the crowd; from the beginning it was in the hands of "those who speak in meshalim," whose business it was to put it into skillful wording. The popular proverb, however, and the literary proverb were and continued two different things. There came a time, in the literary development of Israel, when the value of the mashal as a vehicle of instruction came to be recognized; from which time a systematic cultivation of this type of discourse began. That time, as seems most probable, was the reign of King Solomon, when in a special degree the people awoke to the life and industry and intercourse and wealth of the world around them. The king himself was \'large hearted\' (<a onClick="return mV(\'1Ki\',4,29);">1Ki 4:29</a>), versatile, with literary tastes; "spake three thousand proverbs; and his songs were a thousand and five"; and his whole generation, both in Israel and surrounding nations, was engaged in a vigorous movement of thought and "wisdom" (see the whole passage, <a onClick="return mV(\'1Ki\',4,\'29-34\');">1Ki 4:29-34</a>). For the unit and vehicle of this new thought the old native form of the mashal or proverb was chosen; it became the recognized medium of popular education and counsel, especially of the young; and the mashal itself was molded to the classic form, condensed, pointed, aphoristic, which we see best exemplified in the Book of Proverbs <a onClick="return mV(\'Pro\',10,\'1-\');">Proverbs 10-22:16</a>—probably the earliest collection of this kind of literature. In this body of proverbs we see also that instead of retaining the unbalanced single assertion of the popular proverb, as it appears in <a onClick="return mV(\'1Sa\',10,12);">1Sa 10:12</a>; <a onClick="return mV(\'1Sa\',24,13);">24:13</a>, these composers of literary proverbs borrowed the poetic parallelism, or couplet, which in two lines sets two statements over against each other by antithesis or repetition, and cultivated this to its most condensed and epigrammatic construction. Thus the mashal took to itself a literary self-consciousness and became a work of art.<P>2. The Differentiation:<P>Up to the time of this literary development a proverb was recognized simply as a proverb, with little sense of its various phases, except that there was a strong popular tendency to identify it with satire, and with less thought of the elements of its life and power. With the refinement of form, however, came a recognition of its inwardness. Under the generic term mashal, certain elements were differentiated; not, however, as we are wont to distinguish—parable, fable, apologue, allegory—these remained undifferentiated. The most fundamental distinction of classes, perhaps, is given in <a onClick="return mV(\'Pro\',1,6);">Pr 1:6</a>: "To understand a proverb, and a figure, the words of the wise, and their dark sayings." Here it seems the word "proverb" (mashal) and "words of the wise," paired off with each other, are the generic terms; the other two, the differentiating terms, name respectively the two fundamental directions of the mashal, toward the clear and toward the enigmatic. Both are essential elements. The word translated "figure" (melitsah) is rather "interpretation," and seems to refer to the illuminative element of the mashal, and this was mainly analogy. Natural objects, phases of experience, contrasts were drawn into the mashal to furnish analogies for life; Solomon\'s use of plants and animals in his discourses (<a onClick="return mV(\'1Ki\',4,33);">1Ki 4:33</a>) was not by way of natural history, but as analogies to illustrate his meshalim. The word translated "dark sayings" (chidhoth) is the word elsewhere translated "riddle" (Samson\'s riddle, for instance, was a chidhah, <a onClick="return mV(\'Jdg\',14,13,14);">Jud 14:13,14</a>), and refers to that quality of the proverb which, by challenging the hearer\'s acumen, gives it zest; it is due to an association of things so indirectly related that one must supply intermediate thoughts to resolve them. All of this of course. goes to justify the proverb as a capital vehicle for instruction and counsel; it has the elements that appeal to attention, responsive thought, and memory, while on the other hand its basis of analogy makes it illuminative.<P>III. As Unit of a Strain of Literature.<P>1. From Detachment to Continuity:<P>Until it reached its classic perfection of phrasing, say during the time from Solomon to Hezekiah, the formal development of the proverb was concentrative; the single utterance disposed of its whole subject, as in a capsule. But the development of the mashal form from the antithetic to the synonymous couplet gave rise to a proverb in which the explanatory member did not fully close the case; the subject craved further elucidation, and so a group of several couplets was sometimes necessary to present a case (compare e.g. about the sluggard, <a onClick="return mV(\'Pro\',26,\'13-16\');">Pr 26:13-16</a>). From this group of proverbs the transition was easy to a continuous passage, in which the snappy parallelism of the proverb yields to the flow of poetry; see e.g. <a onClick="return mV(\'Pro\',27,\'23-27\');">Pr 27:23-27</a>. This is due evidently to a more penetrative and analytic mode of thinking, which can no longer satisfy its statement of truth in a single illustration or maxim.<P>2. The Conception of Wisdom:<P>As the store of detached utterances on various phases of practical life accumulated and the task of collecting them was undertaken, it was seen that they had a common suffusion and bearing, that in fact they constituted a distinctive strain of literature. The field of this literature was broad, and recognized (see <a onClick="return mV(\'Pro\',1,\'1-5\');">Pr 1:1-5</a>) as promotive of many intellectual virtues; but the inclusive name under which it was gathered was Wisdom (chokhmah). Wisdom, deduced thus from a fund of maxims and analogies, became the Hebrew equivalent for philosophy. With the further history of it this article is not concerned, except to note that the mashal or proverb form held itself free to expand into a continuous and extended discourse, or to hold itself in to the couplet form. As to illustrative quality, too, its scope was liberal enough to include a fully developed parable; see for instance <a onClick="return mV(\'Eze\',17,\'1-10\');">Eze 17:1-10</a>, where the prophet is bidden to "put forth a riddle, and speak a parable (literally, mashal a mashal) unto the house of Israel."<P>3. In Later Time:<P>The existence of so considerable a body of proverbs is a testimony to the Hebrew genius for sententious and weighty expression, a virtue of speech which was held in special esteem. From the uses of practical wisdom the mashal form was borrowed by the later scribes and doctors of the law; we see it for instance in loose and artificial use in such books as Pirqe \'Abhoth, which gives the impression that the utterance so grandly represented in the Solomonic proverbs had become decadent. It is in another direction rather that the virtues of the mashal reach their culmination. In the phrasal felicity and illustrative lucidity of our Lord\'s discourses, and not less in His parables, employed that the multitude "may see and yet not see" (<a onClick="return mV(\'Mar\',4,12);">Mr 4:12</a>), we have the values of the ancient mashal in their perfection, in a literary form so true to its object that we do not think of its artistry at all.`<a href="./study/isbe/search.html?string=GAMES">GAMES</a>`66';
isbe[7141]='Proverbs, the Book of`prov\'-erbz:<P><b>I. THE BOOK\'S ACCOUNT OF ITSELF</b><P class="in15">1. Title and Headings<P class="in15">2. Authorship or Literary Species?<P><b>II. THE SUCCESSIVE COMPILATIONS</b><P class="in15">1. The Introductory Section<P class="in15">2. The Classic Nucleus<P class="in15">3. A Body of Solicited Counsel<P class="in15">4. Some Left-over Precepts<P class="in15">5. The Hezekian Collection<P class="in15">6. Words of Agur<P class="in15">7. Words of King Lemuel<P class="in15">8. An Acrostic Eulogy of Woman<P><b>III. MOVEMENT TOWARD A PHILOSOPHY</b><P class="in15">1. Liberation of the Mashal<P class="in15">2. Emergence of Basal Principles<P class="in15">3. The Conception of Wisdom<P><b>IV. CONSIDERATIONS OF AGE AND LITERARY KINSHIP</b><P class="in15">1. Under the Kings<P class="in15">2. The Concentrative Point<P class="in15">3. Its Stage in Progressive Wisdom<hr /><P>The Scripture book which in both the Hebrew and the Greek arrangements of the Old Testament Canon immediately succeeds the Psalms. In the Hebrew Canon it stands second in the final or supplementary division called kethubhim Septuagint Paroimiai), "writings"; placed there probably because it would be most natural to begin this section with standard collections nearest at hand, which of course would be psalms and proverbs. This book is an anthology of sayings or lessons of the sages on life, character, conduct; and as such embodies the distinctively educative strain of Hebrew literature.<P>I. The Book\'s Account of Itself.<P>1. Title and Headings:<P>At the beginning, intended apparently to cover the whole work, stands the title: "The proverbs of Solomon the son of David, king of Israel." It seemed good to the compilers, however, to repeat, or perhaps retain an older heading, "The proverbs of Solomon" at <a onClick="return mV(\'Pro\',10,\'1-\');">Pr 10</a>, as if in some special sense the collection there beginning deserved it; and at <a onClick="return mV(\'Pro\',25,\'1-\');">Pr 25</a> still another heading occurs: "These also are proverbs of Solomon, which the men of Hezekiah king of Judah copied out." All these ascribe the proverbs to Solomon; but the heading (<a onClick="return mV(\'Pro\',30,1;">30:1</a>), "The words of Agur the son of Jakeh; the oracle," and the heading (<a onClick="return mV(\'Pro\',31,1);">31:1</a>), "The words of king Lemuel; the oracle which his mother taught him," indicate that authorship other than that of Solomon is represented; while the mention of "the words of the wise" (<a onClick="return mV(\'Pro\',1,6);">1:6</a>; <a onClick="return mV(\'Pro\',22,17);">22:17</A>), as also the definite heading, "These also are sayings of the wise" (<a onClick="return mV(\'Pro\',24,23);">24:23</A>), ascribe parts of the book to the sages in general. The book is confessedly a series of compilations made at different times; confessedly, also, to a considerable extent at least, the work of a number, perhaps a whole guild, of writers.<P>2. Authorship or Literary Species?:<P>It is hazardous to argue either for or against a specific authorship; nor is it my intention to do so. The question naturally arises, however, in what sense this book, with its composite structure so outspoken, can lay claim to being the work of Solomon. Does the title refer to actual personal authorship, or does it name a species and type of literature of which Solomon was the originator and inspirer—as if it meant to say "the Solomonic proverbs"? We may work toward the answer of this question by noting some literary facts.<P>Outside of the prophets only three of the Old Testament books are provided in the original text with titles; and these three are all associated with Solomon—two of them, Proverbs and the So of Songs, directly; the third, Ecclesiastes, by an assumed name, which, however, personates Solomon. This would seem to indicate in the composition of these books an unusual degree of literary finish and self-consciousness, a sense on the part of writers or compilers that literature as an art has its claims upon them. The subject-matter of the books, too, bears this out; they are, relatively speaking, the secular books of the Bible and do not assume divine origin, as do law and prophecy. For the original impulse to such literary culture the history directs us to the reign of King Solomon; see <a onClick="return mV(\'1Ki\',4,\'29-34\');">1Ki 4:29-34</a>, where is portrayed, on the part of king and court, an intense intellectual activity for its own sake, the like of which occurs nowhere else in Scripture. The forms then especially impressed upon the literature were the mashal (proverb) and the song, in both of which the versatile young king was proficient; compare <a onClick="return mV(\'1Ki\',4,32);">1Ki 4:32</a>. For the cultivation of the mashal these men of letters availed themselves of a favorite native form, the popular proverb; but they gave to it a literary mold and finish which would thenceforth distinguish it as the Solomonic mashal (see <a href="./study/isbe/search.html?string=PROVERB">PROVERB</a>). This then was the literary form in which from the time of Solomon onward the sages of the nation put their counsels of life, character, conduct; it became as distinctively the mold for this didactic strain of literature as was the heroic couplet for a similar strain in the age of Dryden and Pope.<P>It is reasonable therefore to understand this title of the Book of Proverbs as designating rather a literary species than a personal authorship; it names this anthology of Wisdom in its classically determined phrasing, and for age and authorship leaves a field spacious enough to cover the centuries of its currency. Perhaps also the proverb of this type was by the term "of Solomon" differentiated from mashal of other types, as for instance those of Balaam and Job and Koheleth.<P>II. The Successive Compilations.<P>1. The Introductory Section:<P>That the Book of Proverbs is composed of several collections made
