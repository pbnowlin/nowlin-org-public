isbe[7183]='Purtenance`pur\'-te-nans: With the significance of "belongings," this word occurs in the King James Version of <a onClick="return mV(\'Exd\',12,9);">Ex 12:9</a> as the translation of qerebh, "within" "inward," "roast...with the purtenance thereof," the Revised Version (British and American) "inwards" (compare <a onClick="return mV(\'Lev\',1,9);">Le 1:9</a>; <a onClick="return mV(\'Lev\',3,3);">3:3</a>, etc.).``1';
isbe[7184]='Put`put (put; Phoud, in Genesis and Chronicles, variant for Genesis Phout, for Chronicles, Phouth):<P>1. Renderings:<P>In consequence of the identification at the time, the prophets have "Libya" (Libues), except <a onClick="return mV(\'Nah\',3,9);">Nah 3:9</A>, where the Greek renders the word as phuge, "flight." The Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) has "Phut," "Phuth," and in the Prophets "Libyes" and "Libya"; the King James Version "Phut."<P>2. Son of Ham:<P>In the "Table of Nations" Put is the third son of Ham (<a onClick="return mV(\'Gen\',10,6);">Ge 10:6</a>), the first and second being Cush and Misraim, and the fourth Canaan. Put is the only one of the sons of Ham who is not credited with descendants.<P>3. As Nationality:<P>In the Prophets, warriors from Put are referred to, principally in connection with the forces of Egypt. They appear as shield-bearers (<a onClick="return mV(\'Jer\',46,9);">Jer 46:9</a>: "Cush and Put, that handle the shield; and the Ludim, that handle and bend the bow"). See also <a onClick="return mV(\'Eze\',30,5);">Eze 30:5</a>, where the order in the Hebrew is Cush, Put and Lud. In <a onClick="return mV(\'Nah\',3,9);">Na 3:9</a> Put is the helper of No-amon (Thebes in Egypt), and in <a onClick="return mV(\'Eze\',27,10);">Eze 27:10</a> Put appears with Persia and Lydia (Lud) as being in the army of Tyre.<P>4. Identified with Punt:<P>The common identification of Put is the Egyptian Punt (or Pwent) proposed by Ebers. The assimilation of n to a following consonant is common in the Semitic languages, and would occasion no difficulty if the vocalization be found to agree. The final "t" of Punt, however, seems to be the Egyptian feminine ending, whereas the "T" of Put is radical.<P>5. Somaliland and Yemen:<P>Nevertheless, the district would seem to be rightly identified with the tract to the east of Abyssinia (Somaliland), and as it is described as being on both sides of the sea (the Red Sea), Yemen would seem to be included. In connection with this, it is worthy of note that a fragment of a Babylonian tablet referring to Nebuchadrezzar\'s campaign in Egypt in his 37th year mentions, as though in the neighborhood, the city (here, apparently, standing for the district) of Putu-yaman—probably not "Ionian (Greek) Put" (Lesbos, according to Winckler), but "Put of Yemen." If this be in contra-distinction to the district of Put (Punt) on the African mainland, the latter would be the Putu referred to in the Persian inscription of Naqsh-i-Rustem, which mentions, among the tributary-countries, Kushiya, Putiya and Masiya, in Babylonian (mat) Puta, (mat) K)usu, (mat) Massu(?), "the land Put, the land Kush (Ethiopia), the land Massu(?)." The soldiers of Put in the army of Tyre may have been either from the African or the Yemenite Put, in which case there was no northern tract of that name, unless settlements had been made at any time from the original district. See W. Max Muller, Asien und Europa, Leipzig,1893,106ff.``136';
isbe[7185]='Puteoli`pu-te\'-o-li (Potioloi, "sulphur springs" (<a onClick="return mV(\'Act\',28,13);">Ac 28:13</a>, Westcott and Hort, The New Testament in Greek), the modern Pozzuoli): A maritime city of Campania, which occupied a central position on the northern shore of a recess in the Gulf of Naples, protected on the west by the peninsula of Baiae and Cape Misenum. It was originally a colony of the neighboring Greek city Cumae.<P>The earliest event in the history of Puteoli which can be dated definitely was the repulse of Hannibal before its walls by a Roman garrison in 214 BC. The design of the Carthaginian to secure a seaport as base of supplies and communication was thus thwarted (Livy xxiv. 7,12,13). A Roman colony was established here in 194 BC, and Puteoli thus became the first Roman port on the Gulf of Naples (Livy xxxiv. 45; Strabo v.245; Velleius, i.15). Its subsequent remarkable prosperity and commercial activity are to be attributed to the safety of the harbor and the inhospitable character of the coast nearer Rome. For Puteoli became the chief seaport of the capital before the creation of an artificial harbor at Portus Augusti by Claudius, and before Trajan made the mouth of the Tiber the principal converging point for the over-sea carrying trade. The imports at Puteoli consisted mainly of Egyptian grain and oriental wares, dispatched from Alexandria and other cities of the Levant (Cicero Pro Rabirio 40; Suetonius, Augustus 98; Strabo xvii. 793; Cicero Pro Caelio 10). The eastern element in the population was very numerous (Petronius 81;<P>CIL, X, 1797). The harbor was rendered doubly safe by a mole, which is known to have been at least 418 yards in length, consisting of massive piers connected by means of arches constructed in solid masonry (Strabo v.245). Extensive remains of this mole still exist. The shore line devoted to purposes of commerce (emporium) extended for a distance of about 1 1/4 miles westward from the mole. At the height of its prosperity under Claudius and Nero, the town is thought to have contained a population of nearly 100,000.<P>The region in which the town was situated is of volcanic formation, the name Puteoli being due to the odor of the sulphureous springs or to the wells of a volcanic nature which abound in the vicinity. The volcanic dust, called pozzolana today, was mixed with lime to form a cement of the greatest durability, which was weatherproofing against the influence of seawater.<P>Extensive remains of an amphitheater, whose axes measure 160 and 126 yards across the space enclosed by the outer facade and 75 and 45 yards within the arena, bear testimony to the former affluence of Puteoli.<P>The region about Puteoli together with Baiae became the favorite resort of the Roman nobility, and the foundations of many ancient villas are still visible, although partly covered by the sea. Cicero\'s villa in the territory of Puteoli (Cicero Ad Fam. v.15, 2; Ad Att. xiv. 16, 1; 20, 1) was afterward selected as the place of burial of Hadrian (Spartianus Had. 25). The portion of the bay between Puteoli and Baiae was the scene of the attempt made at the instigation of Nero upon the life of his mother by means of a vessel so contrived that it was to break to pieces while conveying Agrippina toward her villa near the Lucrine Lake (Tacitus, Annals xiv.8).<P>See <a href="./study/isbe/search.html?string=NERO">NERO</a>.<P>The apostle Paul found a Christian community at Puteoli, when he arrived there on his way to Rome, and stopped 7 days with them (<a onClick="return mV(\'Act\',28,13,14);">Ac 28:13,14</a>). At that time the ordinary route to Rome, following the Via Appia from Capua, was 155 Roman, or about 142 1/3 English miles (Nissen, Italische Landeskunde, II, 739). Later, Domitian reduced the distance to 139 Roman miles (about 129 English miles) by laying out the Via Domitia along the coast, joining the Via Appia at Sinuessa (Geog. Raven., IV, 32; Itin. Ant., 122; Tab. Peut.).``3';
isbe[7186]='Puthites`pu\'-thits (puthi, "simple"; the King James Version Puhites): One of the families of Kiriath-jearim, grandchildren of Caleb (<a onClick="return mV(\'1Ch\',2,50,53);">1Ch 2:50,53</a>).``1';
isbe[7187]='Putiel`pu\'-ti-el (puti\'el, "contemned by El"): Father of the wife of Eleazar, Aaron\'s son, and thus grandfather of Phinehas, Eleazar\'s son (<a onClick="return mV(\'Exd\',6,25);">Ex 6:25</a>).`<a href="./study/isbe/search.html?string=PHINEHAS">PHINEHAS</a>`1';
isbe[7188]='Puvah`pu\'-va.`<a href="./study/isbe/search.html?string=PUAH">PUAH</a>`1';
isbe[7189]='Pygarg`pi\'-garg (dishon; Septuagint pugargos; compare proper nouns, "Dishon" and "Dishan" (<a onClick="return mV(\'Gen\',36,\'21-30\');">Ge 36:21-30</a>; <a onClick="return mV(\'1Ch\',1,\'38-42\');">1Ch 1:38-42</a>); according to BDB, Hommel, Saugethiere, derives ... from dush, Arabic das, "to tread," and compare Assyrian dashshu, "mountain-goat"): Dishon as the name of an animal occurs only in <a onClick="return mV(\'Deu\',14,5);">De 14:5</a> in the list of clean beasts. Both the King James Version and the Revised Version (British and American) have "pygarg," which is not the recognized name of any animal whatever. The Septuagint pugargos (from puge, "rump," and argos, "white") was used by Herodotus (iv.192) as the name of an antelope. A white rump is a very common feature of deer and antelopes, and is commonly explained as enabling the fleeing herd easily to keep in sight of its leaders. It has been used as a specific name of Cervus pygargus, the Tartarian roe, and Bubalis pygargus, a small South African antelope. The Arabic Bible has ri\'m, "a white gazelle," a kindred word to re\'em, the King James Version "unicorn," the Revised Version (British and American) "wild-ox." Tristram, Tristram, Natural History of the Bible, considers dishon to be the addax, Antilope addax or Addax nasomaculatus. There is excellent reason, however, for believing that the range of this African antelope does not extend into Palestine, Sinai or Arabia.`<a href="./study/isbe/search.html?string=ZOOLOGY">ZOOLOGY</a>`37';
isbe[7190]='Pyramid`pir\'-a-mid puramis: Pyramids are mentioned in connection with the splendid monument reared by Simon Maccabeus in memory of his parents and brethren at Modin (1Macc 13:28; compare Ant, XIII vi, 6). Josephus describes them as "very surprising, both for their largeness and beauty." There is nothing to show how the pyramid allotted to each was distinguished, whether by difference in size or by inscriptions. It is remarkable that in Scripture there is no allusion to the giant structures in Egypt; but these may have supplied the suggestion to Simon\'s mind.``54';
isbe[7191]='Pyrrhus`pir\'-us (Purros, "fiery-red"): The name is inserted in the text of the Revised Version (British and American) in <a onClick="return mV(\'Act\',20,4);">Ac 20:4</a> as that of the father of <a href="./study/isbe/search.html?string=SOPATER">SOPATER</a> (which see).``1';
isbe[7192]='Python`pi\'-thon: Occurs only in <a onClick="return mV(\'Act\',16,16);">Ac 16:16</a>, where the Revised Version (British and American) reads, "a certain maid having a spirit of divination (margin "a spirit, a Python") met us." Puthon, or Putho, is the oldest name of Delphi (or the country about Delphi), in which was situated the famous Delphic Oracle. Consequently "Pythian spirit" came to be the generic title of the supposed source of inspiration of diviners, including the slave-girl of the account in Acts. Exactly what facts underlie the narrative it is rather hard to say, but it is evident that the girl was sincere in her conviction that she spoke with Pythian inspiration. Probably she represents some hysterical type, of none too strong mentality, whose confused utterances were taken as coming from some supernatural power. Impressed by Paul\'s personality, she followed him about, and, when his command came, was in a state of mind that had prepared her to obey it. The narrative, incidentally, gives an interesting sidelight on a society in which a girl with hysteria had a greater commercial value than she had after her cure.`<a href="./study/isbe/search.html?string=DIVINATION">DIVINATION</a>`48';
isbe[7193]='Qir-Hareseth; Kir-Heres`kur-har\'-seth, -ha-re\'-seth> (qir-charesh, <a onClick="return mV(\'Isa\',16,7);">Isa 16:7</a>; in <a onClick="return mV(\'2Ki\',3,25);">2Ki 3:25</a> the King James Version reads Kir-haraseth (pausal form)); (qir cheres, <a onClick="return mV(\'Jer\',48,31,36);">Jer 48:31,36</a>; in <a onClick="return mV(\'Isa\',16,11);">Isa 16:11</a> the King James Version reads Kir-haresh (pausal form)): Modern scholars unanimously identify this city with Kir of Moab. In Jehoram\'s invasion of Moab it alone withstood his attack; and on the city wall the king of Moab sacrificed his son (<a onClick="return mV(\'2Ki\',3,25);">2Ki 3:25</a>). It was obviously the capital, i.e. Kir Moab. The name is generally taken to mean "city of the sun." Cheyne, however, points out (EB, under the word):<P>(1) that this explanation was unknown to the ancients;<P>(2) that"kir" is nowhere suposed to mean "city," except in the compound names Kir-heres, Kir-hareseth, and Kir Moab;<P>(3) that cheres, "sun," nowhere has a feminine ending, and<P>(4) that <a onClick="return mV(\'Isa\',16,7);">Isa 16:7</a> Septuagint and Aquila.) indicates "d" and not "r" in the second part of the name (Deseth). He suggests, therefore, that we should possibly read qiryath chadhdshah, "new city."``54';
isbe[7194]='Qoph`kof (qoph): The 19th letter of the Hebrew alphabet; transliterated in this Encyclopedia as q (intense k). It came also to be used for the number 100.`<a href="./study/isbe/search.html?string=ALPHABET">ALPHABET</a>`1';
isbe[7195]='Quail`kwal (selaw; ortugometra; Latin Coturnix vulgaris): A game bird of the family Coturnix, closely related to "partridges" (which see). Quail and partridges are near relatives, the partridge a little larger and of brighter color. Quail are like the gray, brown and tan of earth. Their plumage is cut and penciled by markings, and their flesh juicy and delicate food. Their habits are very similar. They nest on the ground and brood on from 12 to 20 eggs. The quail are more friendly birds and live in the open, brooding along roads and around fields. They have a longer, fuller wing than the partridge and can make stronger flight. In Palestine they were migratory. They are first mentioned in <a onClick="return mV(\'Exd\',16,13);">Ex 16:13</a>: "And it came to pass at even, that the quails came up, and covered the camp: and in the morning the dew lay round about the camp." This describes a large flock in migration, so that they passed as a cloud. <a onClick="return mV(\'Num\',11,\'31-33\');">Nu 11:31-33</a>: "And there went forth a wind from Yahweh, and brought quail from the sea, and let them fall by the camp, about a day\'s journey on this side, and a day\'s journey on the other side, round about the camp, and about two cubits above the face of the earth. And the people rose up all that day, and all the night, and all the next day, and gathered the quail: he that gathered least gathered ten homers: and they spread them all abroad for themselves round about the camp"; compare <a onClick="return mV(\'Psa\',78,\'26-30\');">Ps 78:26-30</a>:<P class="in15">"He caused the east wind to blow in the heavens;<br>And by his power he guided the south wind.<br>He rained flesh also upon them as the dust,<br>And winged birds as the sand of the seas:<br>And he let it fall in the midst of their camp,<br>Round about their habitations.<br>So they did eat, and were well filled;<br>And he gave them their own desire."<P>Again the birds are mentioned in migration. Those that fell around the camp and the bread that was sent from heaven are described in <a onClick="return mV(\'Psa\',105,\'39-42\');">Ps 105:39-42</a>. Commentators have had trouble with the above references. They cause the natural historian none—they are so in keeping with the location and the laws of Nature. First the Hebrew selaw means "to be fat." That would be precisely the condition of the quail after a winter of feeding in the south. The time was early spring, our April, and the quail were flocking from Africa and spreading in clouds—even to Europe. They were birds of earth, heavy feeders and of plump, full body. Migration was such an effort that when forced to cross a large body of water they always waited until the wind blew in the direction of their course, lest they tire and fall. Their average was about 16 birds to each nest. If half a brood escaped, they yet multiplied in such numbers as easily to form clouds in migration. Pliny writes of their coming into Italy in such numbers, and so exhausted with their long flight, that if they sighted a sailing vessel they settled upon it by hundreds and in such numbers as to sink it. Taking into consideration the diminutive vessels of that age and the myriads of birds, this does not appear incredible. Now compare these facts with the text. Israelites were encamped on the Sinai Peninsula. The birds were in migration. The quail followed the Red Sea until they reached the point of the peninsula where they selected the narrowest place, and when the wind was with them they crossed the water. Not far from the shore arose the smoke from the campfires of the Israelites. This bewildered them, and, weary from their journey, they began to settle in confused thousands over and around the camp. Then the Israelites arose and, with the ever-ready "throw sticks," killed a certain number for every soul of the camp and spread the bodies on the sand to dry, just as Herodotus (ii. 77) records that the Egyptians always had done (see Rawlinson, Herodotus, II, for an illustration of catching and drying quail). Nature and natural history can account for this incident, with no need to call in the miraculous.``167';
isbe[7196]='Quarrel`kwor\'-el: Originally (1) "a complaint" (compare "querulous"), or (2) "a cause of complaint," and so (3) "a contention."<P>(1) In the King James Version <a onClick="return mV(\'Mar\',6,19);">Mr 6:19</a> (the Revised Version (British and American) "set herself"; the colloquial "had it in for him" is an exact translation) and <a onClick="return mV(\'Col\',3,13);">Col 3:13</a> (momphe, "complaint"; so the Revised Version (British and American)).<P>(2) In <a onClick="return mV(\'2Ki\',5,7);">2Ki 5:7</a> (\'anah, "be opportune," the Revised Version margin "an occasion").<P>(3) In the King James Version <a onClick="return mV(\'Lev\',26,25);">Le 26:25</a> (loose translation of naqam, "vengeance"; so the Revised Version (British and American)).<P>Compare Sirach 31:29 the King James Version (the Revised Version (British and American) "conflict") and <a onClick="return mV(\'Pro\',20,3);">Pr 20:3</a> the Revised Version (British and American) (the King James Version, "meddling").``1';
isbe[7197]='Quarries`kwor\'-iz (pecilim (<a onClick="return mV(\'Jdg\',3,19,26);">Jud 3:19,26</a>, "graven images"), shebharim (<a onClick="return mV(\'Jos\',7,5);">Jos 7:5</a>, "Shebarim," the Revised Version margin "the quarries")):<P>Pesilim is elsewhere translated "graven images" (<a onClick="return mV(\'Deu\',7,5);">De 7:5</a>; <a onClick="return mV(\'Psa\',78,58);">Ps 78:58</a>; <a onClick="return mV(\'Isa\',10,10);">Isa 10:10</a>; <a onClick="return mV(\'Mic\',5,13);">Mic 5:13</a>, etc.) and is a plural form of pecel, "graven image" (<a onClick="return mV(\'Exd\',20,4);">Ex 20:4</a>, etc.), from pacal, "to carve." It occurs in the story of Ehud and Eglon and refers to images or hewn stones in the vicinity of Gilgal, Shebharim is plural of shebher, "breach," "fracture," more often "destruction" (e.g. <a onClick="return mV(\'Pro\',16,18);">Pr 16:18</a>), from shabhar, "to break." The form shebarim is also found in <a onClick="return mV(\'Job\',41,25);">Job 41:25</a>, "consternation," the King James Version "breakings." In <a onClick="return mV(\'Jos\',7,5);">Jos 7:5</a> Shebarim is the point to which the Israelites were chased after their first attack upon Ai.<P>See <a href="./study/isbe/search.html?string=SHEBARIM">SHEBARIM</a>.<P>Quarries in Palestine are not usually very deep because there is plenty of good stone to be found at the surface. The quarryman seeks a thick stratum of firm limestone which has a favorable exposure. The vertical joint-planes divide the stratum into large blocks which the quarryman dislodges with the aid of crowbars. These great blocks he skillfully cleaves by inserting several wedges in a line in holes made by a pick, and driving the wedges in with a heavy hammer. In these days gunpowder is occasionally used, especially when there are not favorable joint-planes producing blocks capable of being moved by the crowbar.<P>Another method, which is employed where stones of great size are wanted, is to carve the stones out of the rock by cutting channels around them with the pick. In the limestone quarries of Ba\'albek and the granite quarries of Acwan at the first cataract of the Nile, enormous stones may be seen which were abandoned while in process of being removed by this method. The channels are wide enough to admit the body of the workman, and the marks of the picks on the sides of the channels are plainly visible.``37';
isbe[7198]='Quarter`kwor\'-ter: Literally, of course, "the fourth part," and so of the four "ends" (qatsah) in <a onClick="return mV(\'Jer\',49,36);">Jer 49:36</a>, and the King James Version of the four "corners" (so the Revised Version (British and American), gonia) in <a onClick="return mV(\'Rev\',20,8);">Re 20:8</a>. Hence, "any part" and in this sense used freely for various words by the King James Version. the Revised Version (British and American) has usually dropped "quarter," but unfortunately has retained it in <a onClick="return mV(\'Num\',34,3);">Nu 34:3</a>; <a onClick="return mV(\'Jos\',15,5);">Jos 15:5</a>; <a onClick="return mV(\'Jos\',18,14,15);">18:14,15</a>, and introduced it in <a onClick="return mV(\'Jos\',18,12,14,20);">Jos 18:12,14,20</a> for pe\'ah, usually rendered "side." The result is very obscure. Elsewhere in the Revised Version (British and American) only in the phrase "from every quarter" (<a onClick="return mV(\'Gen\',19,4);">Ge 19:4</a>; <a onClick="return mV(\'Isa\',56,11);">Isa 56:11</a>; <a onClick="return mV(\'Mar\',1,45);">Mr 1:45</a>).`<a href="./study/isbe/search.html?string=BORDER">BORDER</a>; <a href="./study/isbe/search.html?string=COAST">COAST</a>`1';
isbe[7199]='Quartus`kwor\'-tus (Kouartos): A Christian in Corinth who with "Erastus the treasurer of the city" sent greetings to the Christian community in Rome (<a onClick="return mV(\'Rom\',16,23);">Ro 16:23</a>). He is known to Paul only as a Christian, "the brother."``1';
isbe[7200]='Quaternion`kwa-tur\'-ni-un (tetradion): The name given to a company of four soldiers of Herod\'s army (<a onClick="return mV(\'Act\',12,4);">Ac 12:4</a>). To four such companies Peter had been handed over, who would take their turn of acting as guard over the prisoner, each of the four watches of the night according to Roman reckoning, which Herod Agrippa I would follow. In the castle of Antonia Peter was thus closely secured, in order that Herod, who had already killed James, the brother of John, with the sword (<a onClick="return mV(\'Act\',12,2);">Ac 12:2</a>), might, after the solemnities of the Passover, make sure of his death likewise. On the night before his intended execution he was sleeping in his cell between two soldiers, "bound with two chains," his left hand chained to one and his right to the other. The other two soldiers of the quaternion mounted guard before the door, and are spoken of as "the first and the second guard" (<a onClick="return mV(\'Act\',12,10);">Ac 12:10</a>) whom Peter and his angel guide had to pass on the way to liberty. The Greek word thus rendered is not found in the Septuagint or anywhere else in the New Testament.``128';
