isbe[7143]='Providence, 2`IV. Discussion of the Contents of the Biblical Doctrine.<P>1. Different Views of Providence Compared:<P>There are four distinct conceptions of providence as it concerns God\'s relation to the ongoing of the world and to man, the rational and moral free agent whom He has placed upon it, namely, the atheistic, the deistic, the pantheistic, and theistic or Biblical view. See also <a href="./study/isbe/search.html?string=GOD">GOD, I, 4</a>. The last named view can best be understood only when stated in comparison and contrast with these opposing views.<P>(1) The Atheistic or Materialistic View:<P>Atheism or materialism, stands at one extreme, affirming that there is no God, that the material universe is eternal, and that from material atoms, eternally endowed with certain properties, there have come, by a process of evolution, all existing forms of vegetable, animal and rational life. As materialism denies the existence of a personal Creator, it, of course, denies any and every doctrine of divine providence.<P>(2) The Pantheistic View:<P>Pantheism stands at the other extreme from atheism, teaching that God is everything and everything is God. The created universe is "the living garment" of God—God is the soul of the world, the universe His existence form. But God is an infinite It, not a personal Being who can express His existence in terms of selfconsciousness—I, Thou, He, Providence, according to pantheism, is simply the evolution of impersonal deity, differing from materialism only in the name which it gives to the infinite substance from which all things flow.<P>(3) The Deistic View:<P>Deism teaches that there is a God, and that He created the world, but created things do not need His presence and the exercise of His power in order to continue in existence and fulfill their functions. The material world is placed under immutable law; while man, the rational and moral free agent, is left to do as he wills. God sustains, according to deism, very much the same relation to the universe that the clock-maker does to his timepiece. Having made his clock, and wound it up, he does not interfere with it, and the longer it can run without the maker\'s intervention the greater the evidence of wisdom and skill on the part of the maker. God according to deism has never wrought a miracle nor made a supernatural revelation to man. The only religion that is possible to man is natural religion; he may reason from Nature up to Nature\'s God. The only value of prayer is its subjective influence; it helps us to answer our own prayers, to become and be what we are praying to be. If the Divine Being is a prayer-hearing God, He is least not a prayer-answering God. The laws of Nature constitute God\'s general providence; but there is no other personal and special providence than this, according to deism. God, the deists affirm, is too great, too distant, too transcendent a Being to concern Himself with the details of creaturely existence.<P>(4) The Theistic or Biblical View:<P>The theistic or Biblical conception of providence teaches that God is not only the Creator but the Preserver of the universe, and that the preservation of the universe, no less than its creation, implies and necessitates at every moment of time an omnipotent and omnipresent personal Being. This world is not "governed by the laws of Nature," as deism teaches, but it is "governed by God according to the laws of Nature." "Law," in itself, is an impotent thing, except as it is the expression of a free will or person back of it; "the laws of Nature" are meaningless and impotent, except as they are an expression of the uniform mode, according to which God preserves and governs the world. It is customary to speak of the laws of Nature as if they were certain self-existent forces or powers governing the world. But shall we not rather say that there is no real cause except personal will—either the divine will or created wills? If this be true, then it is inconsistent to say that God has committed the government of the physical universe to "secondary causes"—that is, to the laws of Nature—and that these laws are not immediately dependent upon Him for their efficiency. The omnipresent and ever-active God is the only real force and power and cause in the universe, except as created wills may be true and real causes within their limited bounds. This view of God\'s relation to the created universe serves to distinguish the Biblical doctrine of divine providence from the teachings of materialists and deists, who eliminate entirely the divine hand from the ongoing of the universe, and in its stead make a god of the "laws of Nature," and hence, have no need for a divine preserver. Biblical theism makes ample room for the presence of the supernatural and miraculous, but we must not be blind to a danger here, in that it is possible to make so much of the presence of God in the supernatural (revelation, inspiration, and miracle) as to overlook entirely His equally important and necessary presence in the natural—which would be to encourage a deistical conception of God\'s relation to the world by exaggerating His transcendence at the expense of His immanence. That is the true theistic doctrine of providence which, while not undervaluing the supernatural and miraculous, yet stedfastly maintains that God is none the less present in, and necessary to, what is termed the "natural."<P>(5) The Divine Immanence.<P>This idea of God\'s essential relation to the continuation of all things in existence is perhaps best expressed by the term "immanence." Creation emphasizes God\'s transcendence, while providence emphasizes His immanence. Pantheism affirms God\'s immanence, but denies His transcendence. Deism affirms His transcendence, but denies His immanence. Biblical theism teaches that God is both transcendent and immanent. By the term "transcendence," when applied to God, is meant that the Divine Being is a person, separate and distinct from Nature and above Nature—"Nature" being used here in its largest signification as including all created things. By the Divine Immanence is meant that God is in Nature as well as over Nature, and that the continuance of Nature is as directly and immediately dependent upon Him as the origin of Nature—indeed, by some, God\'s preservation of the created universe is defined as an act of "continuous creation." By the Divine Immanence is meant something more than omnipresence, which term, in itself alone, does not affirm any causal relation between God and the thing to which He is present, whereas the term "immanence" does affirm such causal relation. By asserting the Divine Immanence, therefore, as the mode of God\'s providential efficiency, we affirm that all created things are dependent upon Him for continued existence, that the laws of Nature have no efficiency apart from their Creator and Preserver, that God is to be sought and seen in all forms and phases of creaturely existence, in the natural as well as the supernatural and miraculous, that He is not only omnipresent but always and everywhere active both in the natural and the spiritual world, and that without Him neither the material atom, nor the living organism, nor the rational soul could have any being. He not only created all things, but "by him all things consist," that is, by Him all things are preserved in being.<P>2. The Divine Purpose and Final End of Providence:<P>What, then, let us ask, do the Scriptures teach as to the purpose and end of God\'s providential goverment of the world? Back of this question is another: What was the divine motive and supreme thought in the creation of the universe, and what the final cause and end of all things in the mind and purpose of God? If we can think God\'s thoughts after Him and discover this "final cause" of creation, with even approximate accuracy, then we shall find a principle that will illuminate at least, if it does not fully explain, the methods and mysteries of providence. We venture to affirm that the controlling thought in the mind of God in establishing this order of things, of which we are a conscious part, was to create a race of beings who should find their highest happiness by being in the highest degree holy, and who should, in proportion as they attain their highest holiness and happiness, thereby in the highest degree glorify their Creator. The Creator\'s highest glory can be promoted only by such beings as are at once rational, moral, free, holy. There are unconscious, unthinking, unmoral forms of existence, but the motive and meaning of the universe is to be found, not in the lower, the physical and animal, but in the highest, in the rational and moral. The lower exists for the higher, the material and animal for the spiritual and moral. A being whose character is formed under the conditions and laws of intellectual and moral freedom is higher than any being can be that is what it is necessitatively, that is, by virtue of conditions over which it has no control. Character that is formed freely under God\'s government and guidance will glorify the Creator more than anything can which is made to be what it is wholly by divine omnipotence. These things being true, it follows that God\'s providence in the world will be directed primarily and ceaselessly toward developing character in free moral agents, toward reducing sin to the minimum and developing the maimum of holiness, in every way and by every means compatible with perfect moral freedom in the creature.<P>The possibility of sin in a world of free agents and in a state of probation is unavoidable, but to say that sin is possible does not mean that it is necessary. See <a href="./study/isbe/search.html?string=CHOICE">CHOICE</a>; <a href="./study/isbe/search.html?string=WILL">WILL</a>. The final cause and end, the purpose and motive, of divine providence, then, are not the temporal, material and earthly happiness of men, but the highest ultimate moral good of free beings whose highest happiness is secured through their highest holiness—which means first, their obedience to the holy will of God as their Father, and secondly, loving and self-sacrificing service to their fellow-men. This ever-present and all-dominating moral purpose of divine providence determines its methods and explains, in part at least, what would otherwise be its mysteries. With this conception of divine providence the general trend of Biblical thought is in entire accord. In the light of Christ\'s revelation of God as a holy and loving Father who regards all men as His children and whose chief concern is to develop holiness and love in those whom He loves, we may define divine providence as Infinite Wisdom, using infinite power to accomplish the ends of infinite holiness and love. The originating and determining cause of divine providence is, in the New Testament conception of it, always to be found in the love of God, while the final cause is the glory of the Father as realized in the holiness and happiness of His children.<P>3. Special Providence:<P>By the doctrine of special providence, according to the best use of that term in theological literature, is meant as already indicated, that minute care and ever-watchful supervision which God exercises over His obedient and believing children in things, both small and great, which are designed to secure their ever-increasing holiness and usefusness. God\'s general providence is and must be special, in that it descends to particulars—to the minute details of creaturely existence—and is always and everywhere active. But the Scriptures teach that there is a more special care over and ordering of the lives of the spiritually good than pertains to the wicked, who have not the fear of God before their eyes. The following Scriptures set forth in unmistakable terms the doctrine of a special providence exercised by the heavenly Father over and in behalf of the righteous: "A man\'s goings are established of Yahweh; and he delighteth in his way" (<a onClick="return mV(\'Psa\',37,23);">Ps 37:23</a>); "In all thy ways acknowledge him, and he will direct thy paths" (<a onClick="return mV(\'Pro\',3,6);">Pr 3:6</a>); "There shall no mischief happen to the righteous" (<a onClick="return mV(\'Pro\',12,21);">Pr 12:21</a>); "But seek ye first his kingdom, and his righteousness; and all these things shall be added unto you" (<a onClick="return mV(\'Mat\',6,33);">Mt 6:33</a>); "To them that love God all things work together for good" (<a onClick="return mV(\'Rom\',8,28);">Ro 8:28</a>). The following points seem to be plainly involved in any statement of the doctrine of special providence that can claim to be faithful to the teachings of the Scriptures;<P>(1) Spiritual, Not Material, Good to Man the End Sought in Special Providence.<P>A mistaken and hurtful notion has long been prevalent to the effect that special providence is designed to secure the secular and earthly good, the material and temporal prosperity, of God\'s children. Nothing could be farther from the truth. Material blessings may indeed come as a special providence to the child of God (<a onClick="return mV(\'Mat\',6,33);">Mt 6:33</a> et al.), but that "good" which all things work together to secure for them that love God is mainly spirtual good, and not financial or social, or intellectual, or temporal good, except as these may secure ultimate spiritual good. Indeed, God\'s special providence make take away wealth and bring poverty in its stead in order to impart the "true riches." It may defeat rather than further one\'s worldly hopes and ambitions; may bring sickness rather than health, and ever death instead of life—for sometimes a Christian can do more good by sickness or death than by health or continued life—and when that is the case, his sickness or death may well be interpreted as a special providence. "Every branch that beareth fruit, he purgeth it, that it may bring forth more fruit." Many of the Old Testament promises do, it is true, seem to have special reference to material and temporal blessings, but we should remember that the best interpretation of these is to be found in the New Testament, where they are (as, for example, when quoted by Christ in the Temptation) interpreted as having mainly a spiritual signifigcance. When our Lord speaks of the very hairs of our heads being numbered, and declares that if a sparrow cannot fall to the ground without the Father\'s notice, surely we, who are of more value than many sparrows, cannot drift beyond His love and care, His words might be interpreted as teaching that God will save us from physical suffering and death; but such is not His meaning, for, in the very same context He speaks of how they to whom He thus pledges His love and care shall be persecuted and hated for His name\'s sake, and how some of them shall be put to death; and yet His promise was true. God was with them in their physical sufferings, but the great blessing wherewith He blessed them was not physical, but moral and spiritual.<P>(2) Special Providence and "Accidents."<P>Another still more mistaken and hurtful notion concerning special providence is the association of it with, and the limitation of it largely to, what are called "accidents," those irregular and occasional occurrences which involve more than ordinary danger and risk to life. The popular notion of special providence associates it with a happy escape from visible dangers and serious injury, as when the house catches on fire, or the horses run away, or the train is wrecked, or the ship encounters an awful storm, or one comes in contact with contagious disease or the terrible pestilence that walketh in darkness. A happy escape from injury and death on such an occasion is popularly designated as a "special providence," and this regardless of whether the individual thus escaping is a saint or a sinner. We cannot too strongly emphasize the fact that God\'s special providence is not a capricious, occasional, and irregular intervention of His love and power in behalf of His children, but involves ceaseless—yea infinite—thought and care for those that love Him, everywhere and in all the experiences of life.<P>(3) Special Providence as Related to Piety and Prayer.<P>God\'s special providence is conditioned upon piety and prayer though it far transcends, in the blessings it brings, the specific requests of His children. While we may properly pray for things pertaining to our temporal and physical life with the assurance that God will answer such prayers in so far as He deems best; yet the Scriptures encourage us to make spiritual blessings the main object of our prayers. "Seek ye first his kingdom, and his righteousness," is the essence of the New Testament teaching on this subject; but we should not overlook the fact that this divine injunction is both preceded and followed by the strongest assurances of the most minute and ceaseless provision for all our temporal and physical wants by the loving heavenly Father. "Therefore take no thought saying, What shall we eat? or, What shall we drink? or, Wherewithal shall we be clothed?...For your heavenly Father knoweth that ye have need of all these things. But seek ye first the kingdom of God, and his righteousness; and all these things shall be added unto you," the King James Version. In keeping with this Scripture, the poet has written:<P class="in15">"Make you His service your delight;<P class="in15">Your wants shall be His care."<P>But while it is true that God has promised to make our wants His care, we should remember that He has promised this only to that devout and godly number of pious, praying souls who "seek first the kingdom of God, and his righteousness." His general providence is alike to all, by which "he maketh his sun to rise on the evil and on the good, and sendeth rain on the just and on the unjust." But it is only "to them that love God" that it is promised that "all things work together for good"—and the proof of love is not in one\'s profession, but in his obedience and service.<P>(4) Special Providence as Related to Human Cooperation.<P>The words of Christ concerning the heavenly Father\'s watchful and loving providence do not mean that the children of God are not in any sense to take thought for food and raiment, and labor daily to obtain the necessities of life. Labor, both mental and physical, is as much a duty as prayer. The prayer, "Give us this day our daily bread," does not render it unnecessary that they who offer it should work for their own daily bread. Nothing could be more hurtful to healthful Christian activity than to interpret our Lord\'s insistence, in the Sermon on the Mount and elsewhere, upon trust in the heavenly Father\'s watchful providence as a justification of thoughtlessness, idleness, and improvidence; seeing that its purpose is simply to warn us against that needless and hurtful anxiety about the future which is not only inconsistent with trust in God, but which is utterly destructive of man\'s best efforts in his own behalf.<P>(5) General and Special Providence Both Equally Divine. While the Scriptures appear to us to make a real and true distinction between God\'s natural and His supernatural order, and between His general and His special providence, yet to truly pious and wisely discerning souls all is alike divine, the natural as well as the supernatural, general as well as special providence. So far as God\'s faithful and loving children are concerned, general and special providence blend into one. The only real and important distinction between the two is that made by the free wills of men, by virtue of which some are in loving accord with the divine plans concerning them, and others are at enmity with God and oppose the purpose of His love concerning them. If all men were and had always been, alike trustful and loving children of the heavenly Father, there would perhaps never have been any occasion for making a distinction between the general and the special providence of God. The only distinction we should have needed to recognize in that case would have been as to the varieties of divine providence, in view of the fact that the all-loving Father would cause widely different events to happen to His different children. If anyone, therefore, is inclined to deny the distinction which we have here made between general and special providence, and prefers to affirm that there is but one general providential order over mankind in the world, that the distinction is in man and not in God\'s providence, his position cannot be seriously objected to, provided he does not thereby mean that the world is governed by impersonal and immutable laws, but will affirm with clearness and confidence that the world is governed by the all-loving, all-wise, omnipresent, and everywhere-active God. For, indeed, the only thing that is really "special" and out of order is the limitation which sin imposes upon the workings of divine providence in so far as the self-will and opposition of men prevent the realization of the providential purposes of God concerning them. But, unfortunately, sin is now, and has long been, so prevalent and dominant in the world that we have come to regard God\'s providence as affected and limited by it, as that which is regular and general, and His more perfect and complete providence in behalf of and over the good as the exceptional and special. But whether we call divine providence, as related to believers, "general" or "special," is of little consequence, provided we believe that "the steps of a good man are ordered by the Lord" (<a onClick="return mV(\'Psa\',37,23);">Ps 37:23</a> the King James Version), that "all things work together for (spiritual) good to them that love God," and that to those who, duly subordinating the temporal to the spiritual, seek "first the kingdom of God and his righteousness," all things needful "shall be added" by the heavenly Father.<P>4. Divine Providence and Human Free Will:<P>The problem of divine providence has its utmost significance, not in its bearing on the laws of physical nature, but in that phase of it which concerns God\'s dealings with moral agents, those creatures who may, and often do, act contrary to His will. God governs men as a father governs his children, as a king governs his free subjects; not as a machinist works his machine, or as a hypnotist controls his mesmerized victims. A father in his family and a sovereign in his realm may each do as he pleases within certain limits, and God infinitely more: "He doeth according to his will in the army of heaven, and among the inhabitants of the earth; and none can stay his hand, or say unto him, What doest thou?" (<a onClick="return mV(\'Dan\',4,35);">Da 4:35</a>). He setteth up one and putteth down another. Nevertheless, even God acts within limits; He limited Himself when He created free agents. As a mere matter of power God can predetermine man\'s volitions and necessitate his acts, but He can do so only by making of him a kind of rational machine, and destroying his true freedom. But Scripture, reason and consciousness all unite in teaching man that he is morally free, that he is an agent, and not something merely acted on. God\'s providential government of men, therefore, is based on their freedom as rational and moral beings, and consists in such an administration and guidance by the Holy Spirit of the affairs of men as shall encourage free moral agents to virtue, and discourage them from sin. God\'s providence must needs work upon and with two kinds of wills—willing wills and opposing wills.<P>(1) Divine Providence as Related to Willing Wills.<P>The apostle declares that God works in believers "both to will and to do of his good pleasure." If God\'s special providence over and in behalf of His children may involve an intervention of His Divine power within the realm of physical law, much more, it would seem, will it involve a similar intervention within the realm of the human mind and the human will. Spiritual guidance is one of the most precious privileges of believers, but it is difficult to conceive how the Holy Spirit can effectively guide a believer without finding some way of controlling his will and determining his volitions that is compatible with free agency. While most of man\'s thoughts, emotions and volitions are self-determined in their origin, being due to the free and natural workings of his own mind and heart and will, yet there are also thoughts, emotions and volitions that are divinely produced. Even a sinner under conviction of sin has thoughts and emotions that are produced by the Holy Spirit. Much more has the believer divinely-produced thoughts and feelings; and if divinely-produced thoughts and feelings, there may be, in like manner, it would seem, Divinely produced volitions. Does this seem irreconcilable with the fact of moral free agency? We think not; it is no more subversive of human free agency for God to influence effectively a man\'s volitions and secure a certain course of action than it is for one man effectively to influence another. No volition that is divinely necessitated can be a free moral volition; for moral volitions are such as are put forth freely, in view of motives and moral ends. The element of necessity and compulsion would destroy all true freedom in, and moral accountability for, any particular volition, so that it could not be either virtuous or vicious. But—and here is the crucial point—when a man, by an act of his own will, freely commits the ordering of his life to God, and prays God to choose for him what is best, working in him both to will and to do, that act of self-commitment to God involves the very essence of moral freedom, and is the highest exercise of free agency. "Our wills are ours to make them Thine," the poet has truly said. In other words, the highest moral act of man\'s free will is the surrender of itself to the divine will; and whatever control of man\'s will on God\'s part results from and follows this free act of self-surrender is entirely consistent with perfect moral freedom, even though it should involve divinely-produced volitions. Does a perplexed child cease to be free when in the exercise of his freedom he asks a wise and loving father to decide a matter for him, and be his guide in attaining a certain desired end? Surely not; and this intervention of parental wisdom and love is none the less effective if it should work, as far as possible, through the mind and will of the child, rather than allow the child to be entirely passive. So God works effectively through the mind and will of every soul who unreservedly commits himself to the divine will—commits himself not once simply, but continually. God cannot under the divinely-appointed laws of freedom work in and through the sinner "both to will and to do," because the sinner\'s will is bent on evil, and hence, opposed to the divine will. God\'s will can work, not with, but only against, a sinful will; and if it should so work and necessitate his volitions, that would destroy his true freedom. But, if God should work in and through an obedient and acquiescent will that is seeking divine guidance, THAT would be an exercise of divine power in no way incompatible with the true moral freedom of men. Such is the influence, as we conceive it, of the divine will upon the human will in providence. God\'s providence works effectively only through willing wills.<P>(2) Divine Providence as Related to Sinful Free Will.<P>But God\'s providence encounters opposing as well as willing wills. Not every unconverted man, however, represents an equally antagonistic will—there are different degrees of opposition. That God\'s gracious and special providence in behalf of an individual often antedates his forsaking sin and his acceptance of Christ as a personal Saviour is manifest to every student of Christian biography. Much of the best training that many a "chosen vessel" ever receives for his life-work turns out to be that unconscious providential preparation which he was receiving under a Father\'s guidance before he consciously consecrated himself to his divine Master. "I girded thee, though thou hast not known me," said God to Cyrus—and on this text Horace Bushnell preached one of the greatest of modern sermons on divine providence, taking as his theme, "Every man\'s life is a plan of God." If this be true of a Christian man, that, even before his conversion, the Holy Spirit was seeking him, and even preparing him, as far as was then possible, for fulfilling the "plan of God" in his life, is it not in all probability equally true that the Holy Spirit and the good providence of God were working in behalf of other sinners who persisted to the end in rebellion against God? Such is the power of moral free agency with which God has endowed man that the created free agent can defeat the plan of Infinite Love concerning his life, and frustrate the workings of providence in his behalf (<a onClick="return mV(\'Jer\',18,\'1-\');">Jer 18</a>). Whether a free moral agent, then, shall allow God\'s providential plans to be worked out for him or not, depends upon his own free will. It is said of the divine Christ that He could not do many mighty works in a certain city because of their unbelief and opposition. In like manner divine providence is conditioned and limited by a sinful free will.<P>5. Divine Providence as Related to Natural and Moral Evil:<P>That the Biblical writers do not regard the existence of evil as a valid objection to divine providence is evident to every student of the Scriptures. Indeed, it is in working good out of what the world accounts evil that divine providence accomplishes many of its most salutary and beneficent ends in behalf of the good. That natural or physical evil (poverty, sickness, suffering, etc.) is one of the mightiest agencies in the hands of God for restraining and correcting moral evil and for working out moral and spiritual good to fallen and sinful men, admits of easy demonstration. For the existence in the world of moral evil (sin), man, the moral free agent, is wholly responsible. God could prevent moral free agents from sinning only by not creating them, or else by placing their wills under irresistible divine restraint and compulsion. But the latter method of controlling them would virtually destroy their real and true freedom; and if this were done, then not only all sin, but all virtue and holiness as attributes of free beings would be thereby rendered impossible in men; for only such beings can put forth free holy volitions as can put forth free sinful volitions. If man had never sinned, there would probably have never been such a large providential use of natural or physical evil as prevails at present; and this because of the fact that an unfallen and holy race of beings would not have needed the presence of natural evil to secure their highest moral development. But a fallen and sinful race does need such an agency to bring it back to God and to develop holy character and the highest moral service. It is not true that sin is now always or even generally the immediate cause of an individual\'s suffering physical evil, or that extraordinary suffering is a proof of extraordinary sin. "Master, who did sin," asked the disciples, "this man, or his parents, that he was born blind? Jesus answered, "Neither hath this man sinned, nor his parents: but that the works of God should be made manifest in him" (<a onClick="return mV(\'Jhn\',9,2,3);">Joh 9:2,3</a> King James Version). Human suffering is for man\'s spiritual good and for the divine glory, as shown in working good out of evil—this is the explanation which the Master gives as to why natural evil is permitted or sent by God. It is not only a powerful, but, in a world like ours, a necessary agency for the correction and cure of moral evil and for the spiritual development of fallen man. "Before I was afflicted I went astray; but now I observe thy word...It is good for me that I have been afflicted; that I may learn thy statutes" (<a onClick="return mV(\'Psa\',119,67,71);">Ps 119:67,71</a>); "Every branch that beareth fruit, he cleanseth it, that it may bear more fruit" (<a onClick="return mV(\'Jhn\',15,2);">Joh 15:2</a>). The saintly and eminently useful men and women of history have, as a rule, had to undergo a severe discipline and to endure many and severe trials, and were made perfect only by their sufferings. Divine providence thus turns much of the world\'s natural and physical evil into moral good.<P>6. Evil Providentially Over-ruled for Good:<P>Many of the things that befall the children of God are directly due to the sins of other men. That good men, even the very best of men, suffer many things at the hands of wicked men admits of no question; and yet these ills are among the "all things" which are declared by the apostle to work together for good to them that love God. The good that may ensue to good men from the evil conduct of the wicked is certainly not due to the intrinsic power in sin to work good to those against whom it is maliciously directed; it can only be due to the fact that God overrules it for the good of the innocent. "As for you," said Joseph, "ye meant evil against me; but God meant it for good" (<a onClick="return mV(\'Gen\',50,20);">Ge 50:20</a>); "The things which happened unto me," said Paul, "have fallen out rather unto the progress of the gospel" (<a onClick="return mV(\'Phl\',1,12);">Php 1:12</a>). God, though foreknowing the evil that wicked men are planning to work against His children, may not prevent it; and this because He can and will overrule it for His glory and for their good, if they abide faithful. But, suppose a good man is not simply injured, but killed by the wicked, as in the case of the martyrs that died at the stake—does the principle still hold good? It does, we answer; the saint who dies in the discharge of duty and because of is fidelity to duty is not only assured, by all the promises of revelation, of a happy immortality, but he has the rare privilege of serving to advance the kingdom of God by his death as well as by his life. God\'s kingdom is advanced in manifold ways by the death of good men. Is not "the blood of the martyrs the seed of the church"? But we need here again to remark that it is not material and temporal, but moral and spiritual good, that God has guaranteed to His holy, loving and faithful children. If sin had an intrinsic power to work good, they would be right who maintain that "the end justifies the means, and one may do evil when good will come of it" (compare <a onClick="return mV(\'Rom\',3,8);">Ro 3:8</a>); and they also would be right who maintain that God is the Author of evil, seeing that evil is, on that supposition, only disguised good—propositions which are thoroughly vicious and subversive of all that is good in man or God. The Scriptures, rightly interpreted, nowhere lend themselves to such false and misleading ethics (compare <a onClick="return mV(\'Isa\',45,7);">Isa 45:7</a>).<p>7. Interpreting Providence:<P>To what extent may we, having studied God\'s providential methods as revealed in the Scriptures, in Nature, in human history, and in personal experience, venture to interpret providence as it applies to current events in our own lives and in the lives of others? Experience and observation will warn us both against haste and against too great confidence in our interpretations of providence. Hasty misinterpretations of providence in its bearing on present passing events frequently become fruitful sources of skepticism for the future. Some people are much given to interpreting providence. Certain ills or misfortunes come to a bad man; they are quick to assert that it is a divine judgment sent upon him in view of his sin. Certain blessings come to a good man; they are sure the blessings are heaven-sent in view of his extraordinary piety. A whiskey merchant\'s store burns down: it is, say they, a divine judgment, in view of his ill-gotten gains. But presently the property of an unquestionably pious and consecrated man is swept away by the flames: where now is the providence? The "oracles" fail to explain; and so they do in innumerable other cases: as, for example, when two men, a saint and a sinner, are prostrated on beds of sickness. The former, in spite of prayer and piety, continues to grow worse, and perhaps dies; while the other, without piety or prayer, is restored to health. God has not made us interpreters of His providences except for ourselves; and even much of that which we sincerely believe comes to us in a graciously providential manner we can well afford to keep as a sacred secret between ourselves and our God, seeing that God has not furnished us with any means of absolutely proving that what has happened to us might not have happened, under similar circumstances, even to sinful men. Many a Christian man comes to see that the ill that has happened to him—the loss of property, the terrible spell of sickness, and the like—things that, at the time, he would not interpret as providential—are among the best things that were ever sent upon him, in that they made him holier and more useful (compare <a onClick="return mV(\'Jhn\',13,7);">Joh 13:7</a>):<P class="in15">"Blind unbelief is sure to err,<P class="in15">And scan His work in vain;<P class="in15">God is His own interpreter<P class="in15">And He will make it plain."<P>There are, however, many evident truths written large on the pages of history, in the rise, decline and fall of kingdoms and nations, which he who runs may read. And to him who truly believes in the God and Father of our Lord Jesus Christ and who will duly consider all the facts and lessons of life, in himself and others, in individuals and in nations, and not for a day merely but patiently as the years come and go, it will be made plain that "God\'s in His heaven—All\'s right with the world," and that all things work together for the spiritual good of those who love God and who prove their love for Him by serving their fellow-men.<P>8. Conclusion:<P>We conclude, then, that there is, according to the Scriptures, an ever-watchful providence exercised by the heavenly Father over His faithful and loving children, which is ceaselessly working to secure their ever-increasing holiness and usefulness here, an their perfect happiness in a future state of existence. To prepare rational and immortal free agents through holiness and usefulness here for happiness hereafter is the aim and end of this all-embracing providence of God, which includes within its loving care every human being except such as exclude themselves therefrom by their own willful and persistent sinning. And in the accomplishment of this end, what the world counts as the misfortunes and ills of life often contribute far more than what, in the estimation of men, are accounted the greatest earthly blessings. There is no providential highway to a state here that is free from life\'s ills, and that abounds in temporal and earthly blessings to the good. But there is a royal and holy highway, along which moves a providential pillar of cloud by day and a pillar of fire by night, leading the children of the covenant, through lives of loving service and sacrifice, to a holy land of promise, the goal of a gracious providence; and they who journey along this highway bear this seal: "The Lord knoweth them that are his: And, Let every one that nameth the name of Christ depart from iniquity" (<a onClick="return mV(\'2Ti\',2,19);">2Ti 2:19</a> the King James Version). They who bear this seal are the divinely-chosen instruments and agents of that larger and wider providence that is ever working to establish a perfect kingdom of righteousness in the whole earth, that kingdom of God, to inaugurate which, in its Messianic form, our Lord became incarnate, and to consummate which, in its final and perfect form, He reigns from heaven and will continue to reign until, having "put all enemies under his feet," He shall "deliver up the kingdom to God, even the Father"—when the poet\'s vision shall be realized of:<P class="in15">"That God who ever lives and loves;<P class="in15">One God, one law, one element,<P class="in15">And one far-off Divine event,<P class="in15">To which the whole creation moves."<P>LITERATURE.<P>James Orr, The Christian View of God and the World; A. B. Bruce, The Providential Order of the World; James McCosh, The Method of Divine Government; James Hinton, The Mystery of Pain; John Telford, Man\'s Partnership with Divine Providence; W. N. Clarke, The Christian Doctrine of God, and, An Outline of Christian Theology; W. B. Pope, Compendium of Christian Theology; A. L. Lilley, Adventus Regni; Oehler, Theology of the Old Testament; Wendt, The Teaching of Jesus; George B. Stevens, The Pauline Theology; E. P. Gould, The Biblical Theology of the New Testament; T. Jackson, The Providence of God Viewed in the Light of the Holy Scripture; H. M. Gwatkin, The Knowledge of God; Lux Mundi: Preparation in History for Christ; J. Flavell, Divine Conduct, or the Mystery of Providence; O. D. Watkins, The Divine Providence; Borden P. Bowne, The Immanence of God.``174';
isbe[7144]='Province`prov\'-ins (medhinah, "jurisdiction"; eparchia (English Versions of the Bible, province) (<a onClick="return mV(\'Act\',23,34);">Ac 23:34</a>; <a onClick="return mV(\'Act\',25,1);">25:1</a>)):<P>1. Meaning of the Term<P>2. Roman Provincial Administration<P class="in15">(1) First Period<P class="in15">(2) Second Period<P class="in15">(3) Third Period<P>3. Division of Provinces<P>4. Province of Judea<P>5. Revenue<P>LITERATURE<hr /><P>1. Meaning of the Term:<P>Province (provincia) did not originally denote a territorial circumscription in Roman usage, since the employment of the word was much more ancient than any of the conquests of the Romans outside of Italy. In the most comprehensive official sense it signified a magistrate\'s sphere of administrative action, which in one instance might be the direction of jurisdiction at Rome, in another the management of military operations against a particular hostile community. When the imperium was conferred upon two consuls at the beginning of the Republic, and upon a praetor in 367 BC, and finally upon a second praetor in 241 BC, it became necessary in practice to define their individual competence which was unlimited in theory. When the Romans extended their control over lands situated outside of Italy, it became expedient to fix territorial limits to the exercise of authority by the magistrates who were regularly sent abroad, so that provincia signified henceforth in an abstract sense the rule of the governor, and in a concrete sense the specified region entrusted to his care; and with the development and consolidation of the Roman system of administration, the geographical meaning of the word became more and more significant.<P>2. Roman Provincial Administration:<P>The history of Roman provincial administration in the more definite sense commences in 227 BC, when four praetors were elected for the first time, of whom two were assigned to the government of the provinces. Three periods may be distinguished in the history of the system of provincial administration:<P class="in15">(1) from 227 BC to Sulla,<P class="in15">(2) from Sulla to Augustus, and<P class="in15">(3) the Empire.<P>(1) First Period.<P>During the first period, provision was made for the government of the provinces by means of special praetors, or, in exceptional circumstances, by consuls, during their term of office. Accordingly, the number of praetors was increased from four in 227 BC to eight at the time of Sulla.<P>(2) Second Period.<P>In accordance with the reforms of Sulla all the consuls and praetors remained at Rome during their year of office, and were entrusted with the administration of provinces a subsequent year with the title proconsul (pro consule) or propraetor (pro praetore). The proconsuls were sent to the more important provinces. The senate determined the distinction between consular and praetorian provinces and generally controlled the assignment of the provinces to the ex-magistrates. Julius Caesar increased the praetors to sixteen, but Augustus reduced them to twelve.<P>(3) Third Period.<P>In 27 BC, Augustus as commander-in-chief of the Roman army definitely assumed the administration of all provinces which required the presence of military forces and left the other provinces to the control of the senate. There were then twelve imperial and ten senatorial provinces, but all provinces added after 27 BC came under imperial administration. The emperor administered his provinces through the agency of personal delegates, legati Augusti of senatorial, and praefecti or procuratores of equestrian, rank. The term of their service was not uniform, but continued usually for more than a single year. The senatorial administration was essentially a continuation of the post-Sullan, republican regime. The senatorial governors were called proconsuls generally, whether they were of consular or praetorian rank; but Africa and Asia alone were reserved for exconsuls, the eight remaining senatorial provinces being attributed to ex-praetors. The financial administration of each imperial province was entrusted to a procurator, that of each senatorial province to a quaestor.<P>3. Division of Provinces:<P>The provinces were divided into smaller circumscriptions (civitates) for the purposes of local government. In the older provinces these districts corresponded generally with the urban communities which had been the units of sovereignty before the advent of the Romans. Under Roman rule they were divided into different classes on the basis of their dignity and prerogatives, as follows:<P>(1) Coloniae:<P>Roman or Latin colonies established after the model of the Italian commonwealths.<P>(2) Civitates Foederatae:<P>Communities whose independence had been guaranteed by a formal treaty with Rome.<P>(3) Civitates Liberae:<P>Communities whose independence the Romans respected, although not bound to do so by a formal obligation.<P>(4) Civitates Stipendiariae:<P>Communities which had surrendered to the discretion of the Romans and to which limited powers of local government were granted by the conquerors as a matter of convenience.<P>The civitates stipendiariae, and in some cases the colonies, paid taxes to the Roman government, the greater part of which was in the form either of a certain proportion of the annual products of the soil, such as a fifth or tenth, or a fixed annual payment in money or kind.<P>4. Province of Judea:<P>Judaea became a part of the province of Syria in 63 BC, but was assigned in 40 BC as a kingdom to Herod the Great, whose sovereignty became effective three years later. The provincial regime was reestablished in 6 AD, and was broken only during the years 41-44 AD, when Herod Agrippa was granted royal authority over the land (Josephus, Josephus, Antiquities XIX, viii, 2). The Roman administration was in the hands of the procurators (see <a href="./study/isbe/search.html?string=PROCURATOR">PROCURATOR</a>) who resided at Caesarea (Josephus, BJ, II, xv, 6; <a onClick="return mV(\'Act\',23,23,33);">Ac 23:23,33</a>; <a onClick="return mV(\'Act\',25,1);">25:1</a>) in the palace of Herod the Great (<a onClick="return mV(\'Act\',23,\'1-35\');">Ac 23:1-35</a>). The procurators of Judea were subject to the authority of the imperial governors of Syria, as is evident from the deposition of Pontius Pilate by Vitellius (Josephus, Ant, XVIII, iv, 2; Tacitus, Annals vi.32). The procurator was competent to exercise criminal jurisdiction over the provincials in cases involving a capital sentence (Josephus, BJ, II, viii, 1), but he was bound to grant an appeal by Roman citizens for trial at Rome (<a onClick="return mV(\'Act\',25,11);">Ac 25:11</a>). A death sentence by the Sanhedrin required the sanction of the procurator, as appears in the process against the Saviour. Under Roman rule cities like Caesarea, Sebaste, and Jerusalem became organs for local government, like the urban communities in other parts of the Empire.<P>5. Revenue:<P>The revenue of Palestine under Claudius is said to have been 12,000,000 denarii (about $2,400,000, or 500,000 British pounds (in 1915); compare Josephus, Ant XIX, viii, 2). In addition to the ground tax, the amount of which is not known, a variety of indirect contributions were collected on auctions, salt, highways, bridges, etc., which constituted, no doubt, the field of activity in which the publicans gained their unenviable reputation.<P>LITERATURE.<P>The reader may be directed to Marquardt, Romische Staatsverwaltung, I, 497-502, 517-57, for a general discussion of the Roman system of provincial administration, and to the same volume, pp. 405-12, for the provincial government of Palestine.``3';
isbe[7145]='Provocation; Provoke`prov-o-ka\'-shun, pro-vok\':"Provoke," literally, "to call forth," hence, to excite or stir up, whether in a good or bad sense, appears frequently in the Old Testament as the translation of Piel, or Hiphil of ka\'ac (noun, ka\'ac), in the sense of "to make angry" (<a onClick="return mV(\'Deu\',4,25);">De 4:25</a>; <a onClick="return mV(\'Deu\',9,18);">9:18</a>; <a onClick="return mV(\'1Ki\',14,9,15);">1Ki 14:9,15</a>, etc.); sometimes of marah (<a onClick="return mV(\'Isa\',3,8);">Isa 3:8</a>), and of other words. In the New Testament we have parazeloo, "to make jealous" (<a onClick="return mV(\'Rom\',10,19);">Ro 10:19</a>; <a onClick="return mV(\'Rom\',11,11,14);">11:11,14</a>); parorgizo, "to make angry" (<a onClick="return mV(\'Eph\',6,4);">Eph 6:4</a>; compare <a onClick="return mV(\'Col\',3,21);">Col 3:21</a>); with parapikraino, "to embitter" (<a onClick="return mV(\'Hbr\',3,16);">Heb 3:16</a>; compare in 1Es 6:15), and other Greek words. "Provocation" in <a onClick="return mV(\'Hbr\',3,8,15);">Heb 3:8,15</a> (quoting <a onClick="return mV(\'Psa\',95,8);">Ps 95:8</a>) is parapikrasmos, the Septuagint for the Hebrew meribhah. An example of the good sense of the word is in <a onClick="return mV(\'Hbr\',10,24);">Heb 10:24</a>, "Consider one another to provoke (literally, "to the provoking," here paroxusmos) unto love and good works."<P>For "provoke" the Revised Version (British and American) has "despise" (<a onClick="return mV(\'Num\',14,11);">Nu 14:11</a>; <a onClick="return mV(\'Num\',31,20);">31:20</a>), "rebel against" (<a onClick="return mV(\'Psa\',78,40);">Ps 78:40</a>); for "provoked," "despised" (<a onClick="return mV(\'Num\',14,23);">Nu 14:23</a>; <a onClick="return mV(\'Num\',16,30);">16:30</a>; <a onClick="return mV(\'Isa\',1,4);">Isa 1:4</a>), "moved" (<a onClick="return mV(\'Deu\',32,16);">De 32:16</a>; <a onClick="return mV(\'1Ch\',21,1);">1Ch 21:1</a>), "rebelled against" (<a onClick="return mV(\'Psa\',78,56);">Ps 78:56</a>), "were rebellious" (<a onClick="return mV(\'Psa\',106,33,43);">106:33,43</A>); for "provoking" (<a onClick="return mV(\'Psa\',78,17);">Ps 78:17</a>), "to rebel against"; for "provoked" (<a onClick="return mV(\'2Cr\',9,2);">2Co 9:2</a>), "stirred up"; "provoked within" for "stirred in" (<a onClick="return mV(\'Act\',17,16);">Ac 17:16</a>); "provoked" for "limited" (<a onClick="return mV(\'Psa\',78,41);">Ps 78:41</a> margin, "limited"); "provoketh" for "emboldeneth" (<a onClick="return mV(\'Job\',16,3);">Job 16:3</a>); instead of "Provoke not your children to anger" (<a onClick="return mV(\'Col\',3,21);">Col 3:21</a>), "Provoke not your children."``185';
isbe[7146]='Prudence; Prudent`proo\'-dens, proo\'-dent: In the Old Testament "prudence" is the translation of \'ormah (<a onClick="return mV(\'Pro\',8,12);">Pr 8:12</a>); also in the King James Version of sekhel (<a onClick="return mV(\'2Ch\',2,12);">2Ch 2:12</a>, the Revised Version (British and American) "discretion"); and "prudent" is the translation of \'arum, "subtle" (<a onClick="return mV(\'Pro\',12,16,23);">Pr 12:16,23</a>; <a onClick="return mV(\'Pro\',13,16);">13:16</a>, etc.; compare <a onClick="return mV(\'Gen\',3,1);">Ge 3:1</a>; <a onClick="return mV(\'Job\',5,12);">Job 5:12</a>), and of bin (<a onClick="return mV(\'1Sa\',16,18);">1Sa 16:18</a>, the Revised Version margin "skillful"; <a onClick="return mV(\'Pro\',16,21);">Pr 16:21</a>; <a onClick="return mV(\'Pro\',18,15);">18:15</a>; <a onClick="return mV(\'Isa\',5,21);">Isa 5:21</a>; <a onClick="return mV(\'Isa\',10,13);">10:13</a>, the American Standard Revised Version "understanding," etc.), with other words. In the New Testament "prudence" occurs once as the translation of phronesis (<a onClick="return mV(\'Eph\',1,8);">Eph 1:8</a>); "prudent" is in the King James Version the translation of sunetos, changed in the Revised Version (British and American) to "understanding" (<a onClick="return mV(\'Mat\',11,25);">Mt 11:25</a>; <a onClick="return mV(\'Act\',13,7);">Ac 13:7</a>); in <a onClick="return mV(\'1Cr\',1,19);">1Co 1:19</a>, the American Standard Revised Version has "the discerning," the English Revised Version retains "prudent." In its etymological sense of seeing beforehand (contraction of "providence"), "prudence" does not occur in the New Testament. As forethought, foresight, prudence was reckoned one of the cardinal virtues by the ancient ethical writers. See the remarks of Coleridge on its lower and higher character in his Aids to Reflection, Aphor. 29.``185';

isbe[7148]='Psalms, Book of, 1`samz, (tehillim, "praises," cepher tehillim, "book of praises"; Psalmoi, Psalterion):<P><b>I. INTRODUCTORY TOPICS</b><P class="in15">1. Title<P class="in15">2. Place in the Canon<P class="in15">3. Number of Psalms<P class="in15">4. Titles in the Hebrew Text<P><b>II. AUTHORSHIP AND AGE OF THE PSALMS</b><P class="in15">1. David as a Psalmist<P class="in15">2. Psalmody after David<P><b>III. GROWTH OF THE PSALTER</b><P class="in15">1. Division into Five Books<P class="in15">2. Smaller Groups of Psalms<P><b>IV. POETRY OF THE PSALTER</b><P><b>V. THE SPEAKER IN THE PSALMS</b><P><b>VI. THE GOSPEL IN THE PSALTER</b><P class="in15">1. The Soul\'s Converse with God<P class="in15">2. The Messiah<P class="in15">3. Problem of Sin<P class="in15">4. Wrestling with Doubts<P class="in15">5. Out of the Depths<P class="in15">6. Ethical Ideals<P class="in15">7. Praying against the Wicked<P class="in15">8. The Future Life<P><b>LITERATURE</b><hr /><P>I. Introductory Topics.<P>1. Title:<P>The Hebrew title for the Psalter is cepher tehillim, "book of praises." When we consider the fact that more than 20 of these poems have praise for their keynote, and that there are outbursts of thanksgiving in many others, the fitness of the Hebrew title dawns upon us. As Ker well says, "The book begins with benediction, and ends with praise—first, blessing to man, and then glory to God." Hymns of praise, though found in all parts of the Psalter, become far more numerous in Books IV and V, as if the volume of praise would gather itself up into a Hallelujah Chorus at the end. In the Greek version the book is entitled in some manuscripts Psalmoi, in others Psalterion, whence come our English titles "Psalms," and "Psalter." The Greek word psalmos, as well as the Hebrew mizmor, both of which are used in the superscriptions prefixed to many of the separate psalms, indicates a poem sung to the accompaniment of stringed instruments. The title mizmor is found before 57 psalms. The Psalter was the hymnal of the Jewish nation. To individual psalms other titles are sometimes prefixed, such as shir, "song"; tehillah, "praise"; tephillah, "prayer," etc. The Psalter was both prayerbook and hymnal to the Jewish people. It was also a manual for the nurture of the spiritual life in private as well as public worship.<P>2. Place in the Canon:<P>The Psalms were placed in the kethubhim or "Writings," the third group of the Hebrew Scriptures. As the chief book of the kethubhim, the Psalter appears first in the great majority of German manuscripts, though the Spanish manuscripts place Psalms after Chronicles, and the Talmud puts Ruth before Psalms. There has never been any serious question as to the right of the Psalter to a place in the Canon of Scripture. The book is possibly more highly esteemed among Christians than by the Jews. If Christians were permitted to retain only one book in the Old Testament, they would almost certainly choose Psalms. By 100 BC, and probably at a much earlier date, the Book of Psalms was completed and recognized as part of the Hagiographa, the 3rd division of the Hebrew Bible.<P>3. Number of Psalms:<P>According to the Hebrew text, followed by modern VSS, there are 150 separate poems in the Psalter. The Greek version has an additional psalm, in which David describes his victory over Goliath; but this is expressly said to be "outside the number." The Septuagint, followed by Vulgate, combined <a onClick="return mV(\'Psa\',9,\'1-\');">Psalms 9</a> and <a onClick="return mV(\'Psa\',10,\'1-\');">10</A>, and also <a onClick="return mV(\'Psa\',114,\'1-\');">114</A> and <a onClick="return mV(\'Psa\',115,\'1-\');">115</a>, into a single psalm. On the other hand, they divide <a onClick="return mV(\'Psa\',116,\'1-\');">Psalms 116</a> and <a onClick="return mV(\'Psa\',147,\'1-\');">147</A> each into two poems. Thus, for the greater part of the Psalter the Hebrew enumeration is one number in advance of that in the Greek and Latin Bibles.<P>The existing division in the Hebrew text has been called in question at various points. <a onClick="return mV(\'Psa\',42,\'1-\');">Psalms 42</a> and <a onClick="return mV(\'Psa\',43,\'1-\');">43</a> are almost certainly one poem (see refrain in <a onClick="return mV(\'Psa\',42,5,11);">42:5,11</a>; <a onClick="return mV(\'Psa\',43,5);">43:5</a>); and it is probable that <a onClick="return mV(\'Psa\',9,\'1-\');">Psalms 9</a> and <a onClick="return mV(\'Psa\',10,\'1-\');">10</a> were originally one, as in Septuagint. On the other hand, it is thought by some that certain psalms were composed of two psalms which were originally separate. We may cite as examples <a onClick="return mV(\'Psa\',19,\'1-6\');">Ps 19:1-6</a>,<a onClick="return mV(\'Psa\',19,\'7-14\');">7-14</a>; <a onClick="return mV(\'Psa\',24,\'1-6\');">24:1-6</a>,<a onClick="return mV(\'Psa\',24,\'7-10\');">7-10</a>; <a onClick="return mV(\'Psa\',27,\'1-6\');">27:1-6</a>,<a onCkklick="return mV(\'Psa\',27,\'7-14\');">7-14</a>; <a onClick="return mV(\'Psa\',36,\'1-4\');">36:1-4</a>,<a onClick="return mV(\'Psa\',36,\'5-12\');">5-12</a>. It is evident that such combinations of two different poems into one may have taken place, for we have an example in <a onClick="return mV(\'Psa\',108,1);">Ps 108</a>, which is composed of portions of two other psalms (<a onClick="return mV(\'Psa\',57,\'7-11\');">57:7-11</A>; <a onClick="return mV(\'Psa\',60,\'5-12\');">60:5-12</A>).<P>4. Titles in the Hebrew Text:<P>(1) Value of the Superscriptions.<P>It is the fashion among advanced critics to waive the titles of the psalms out of court as wholly worthless and misleading. This method is as thoroughly unscientific as the older procedure of defending the superscriptions as part of an inspired text. These titles are clearly very old, for the Septuagint, in the 2nd century BC, did not understand many of them. The worst that can be said of the superscriptions is that they are guesses of Hebrew editors and scribes of a period long prior to the Greek version. As to many of the musical and liturgical titles, the best learning of Hebrew and Christian scholars is unable to recover the original meaning. The scribes who prefixed the titles had no conceivable reason for writing nonsense into their prayerbook and hymnal. These superscriptions and subscriptions all had a worthy meaning, when they were first placed beside individual psalms. This indisputable fact of the great antiquity of these titles ought forever to make it impossible for scientific research to ignore them. Grant for the sake of argument, that not one of them came from the pen of the writers of the Psalms, but only from editors and compilers of exilic or post-exilic days, it would still be reasonable to give attention to the views of ancient Hebrew scholars, before considering the conjectures of modern critics on questions of authorship and date. Sources of information, both oral and written, to which they had access, have long since perished. In estimating the value of their work, we have a right to use the best critical processes known to us; but it is unscientific to overlook the fact that their proximity to the time of the composition of the Psalms gave them an advantage over the modern scholar. If it be said by objectors that these ancient scribes formed their conclusions by the study of the life of David as portrayed in the historical Books of Kings and Chronicles, the reply is ready that several historical notices in the titles cannot be thus explained. Who was Cush? Who was Abimelech? (<a onClick="return mV(\'Psa\',7,\'1-\');">Psalms 7</a> and <a onClick="return mV(\'Psa\',34,\'1-\');">34</A>). A careful weighing of the facts concerning the superscriptions will make it seem highly improbable that the earliest of these titles does not reach back into pre-exilic times. We almost certainly have in them the results of the labors of Hebrew scribes and compilers stretching over several centuries. Some of the titles may have been appended by the psalmists themselves.<P>We are far from claiming that the titles are always intelligible to us, or that, when understood, they are always correct. The process of constructing titles indicative of authorship had not ceased in the 2nd century BC, the Septuagint adding many to psalms that were anonymous in the Hebrew. The view expressed nearly 50 years ago by Perowne is eminently sane: "The inscriptions cannot always be relied on. They are sometimes genuine, and really represent the most ancient tradition. At other times, they are due to the caprice of later editors and collectors, the fruits of conjecture, or of dimmer and more uncertain traditions. In short, the inscriptions of the Psalms are like the subscriptions to the Epistles of the New Testament. They are not of any necessary authority, and their value must be weighed and tested by the usual critical processes."<P>(2) Thirtle\'s Theory.<P>J. W. Thirtle (The Titles of the Psalms, 1904) advances the hypothesis that both superscriptions and subscriptions were incorporated in the Psalter, and that in the process of copying the Psalms by hand, the distinction between the superscription of a given psalm and the subscription of the one immediately preceding it was finally lost. When at length the different psalms were separated from one another, as in printed editions, the subscriptions and superscriptions were all set forth as superscriptions. Thus it came about that the musical subscription of a given psalm was prefixed to the literary superscription of the psalm immediately following it. The prayer of Habakkuk (<a onClick="return mV(\'Hab\',3,1);">Hab 3</a>) was taken by Thirtle as a model or normal psalm; and in this instance the superscription was literary. "A prayer of Habakkuk the prophet, upon Shigionoth," while the subscription is musical, "For the Chief Musician, on my stringed instruments." The poem of Hezekiah in celebration of his recovery (<a onClick="return mV(\'Isa\',38,\'9-20\');">Isa 38:9-20</a>) seems to support Thirtle\'s thesis, the superscription stating the authorship and the occasion that gave birth to the psalm, while <a onClick="return mV(\'Isa\',38,20);">Isa 38:20</a> hints at the musical instruments with which the psalm was to be accompanied in public worship. If now the musical notes be separated from the notes of authorship and date that follow them, the musical notes being appended as subscriptions, while the literary notes are kept as real superscriptions, the outcome of the separation is in many instances a more intelligible nexus between title and poem. Thus the subscript to <a onClick="return mV(\'Psa\',55,\'1-\');">Ps 55</a>, "The dove of the distant terebinths," becomes a pictorial title of <a onClick="return mV(\'Psa\',55,6,7,8);">55:6-8</A> of the psalm. The application of the rule that the expression "for the Chief Musician" is always a subscript removes the difficulty in the title of <a onClick="return mV(\'Psa\',88,1);">Ps 88</a>. The superscription of <a onClick="return mV(\'Psa\',88,1);">Ps 88</a>, on Thirtle\'s hypothesis, becomes "Maschil of Heman the Ezrahite." <a onClick="return mV(\'Psa\',87,1);">Ps 87</a> thus has a subscript that repeats the statement of its superscription, but with an addition which harmonizes with the content of the poem. "Mahalath Leannoth," with a slight correction in vocalization, probably means "Dancings with Shoutings," and <a onClick="return mV(\'Psa\',87,7);">87:7</a> speaks of both singing and dancing. The tone of <a onClick="return mV(\'Psa\',87,\'1-\');">Ps 87</a> is exceedingly cheerful; but <a onClick="return mV(\'Psa\',88,\'1-\');">Ps 88</a> is the saddest in the entire Psalter. The application of Thirtle\'s hypothesis also leaves <a onClick="return mV(\'Psa\',88,\'1-\');">Ps 88</a> with a consistent literary title, whereas the usual title ascribes the psalm first to the sons of Korah and then to Heman the Ezrahite.<P>(3) Meaning of the Hebrew Titles.<P>Scholars have not been able to come to agreement as to the meaning and application of a goodly number of words and phrases found in the titles of the Psalms. We append an alphabetical list, together with hints as to the probable meaning:<P>(a) \'Ayeleth ha-Shachar (<a onClick="return mV(\'Psa\',22,\'1-\);">Ps 22</a>) means "the hind of the morning," or possibly "the help of the morning." Many think that the words were the opening line of some familiar song.<P>(b) \'Alamoth (<a onClick="return mV(\'Psa\',46,\'1-\');">Ps 46</a>) means "maidens." The common view is that the psalm was to be sung by soprano voices. Some speak of a female choir and compare <a onClick="return mV(\'1Ch\',15,20);">1Ch 15:20</a>; <a onClick="return mV(\'Psa\',68,11,24);">Ps 68:11,24</a>f. According to Thirtle, the title is a subscript to <a onClick="return mV(\'Psa\',45,\'1-\');">Ps 45</a>, which describes the marriage of a princess, a function at which it would be quite appropriate to have a female choir.<P>(c) \'Al-tashcheth (<a onClick="return mV(\'Psa\',57,\'1-\');">Psalms 57-59</a>; <a onClick="return mV(\'Psa\',75,\'1-\');">75</a>) means "destroy not;" and is quite suitable as a subscript to <a onClick="return mV(\'Psa\',56,\'1-\');">Psalms 56-58</a> and <a onClick="return mV(\'Psa\',74,\'1-\');">74</A> (compare <a onClick="return mV(\'Deu\',9,26);">De 9:26</a>). Many think this the first word of a vintage song (compare <a onClick="return mV(\'Isa\',65,8);">Isa 65:8</a>).<P>(d) Ascents, Songs of" (Psalms 120-184): the Revised Version (British and American) translates the title to 15 psalms "A Song of Ascents," where the King James Version has "A Song of Degrees." The most probable explanation of the meaning of the expression is that these 15 psalms were sung by bands of pilgrims on their way to the yearly feasts in Jerusalem (<a onClick="return mV(\'Psa\',122,4);">Ps 122:4</a>). <a onClick="return mV(\'Psa\',121,\'1-\');">Psalms 121</a>, <a onClick="return mV(\'Psa\',122,\'1-\');">122</a>, <a onClick="return mV(\'Psa\',123,\'1-\');">123</a>; <a onClick="return mV(\'Psa\',125,\'1-\');">125</a>; <a onClick="return mV(\'Psa\',127,\'1-\');">127</a>; <a onClick="return mV(\'Psa\',128,\'1-\');">128</a> and <a onClick="return mV(\'Psa\',132,\'1-\');">132</a>, <a onClick="return mV(\'Psa\',133,\'1-\');">133</a>, <a onClick="return mV(\'Psa\',134,\'1-\');">134</a> are well suited for use on such occasions (see, however, Expository Times, XII, 62).<P>(e) "For the Chief Musician": 55 psalms are dedicated to the precentor or choir leader of the temple. "To the Chief Musician" might mean that the precentor was the author of certain psalms, or that there was a collection of hymns compiled by him for use in temple worship, or that certain psalms were placed in his hands, with suggestions as to the character of the poems and the music which was to accompany them. It is quite likely that there was an official collection of psalms for public worship in the custody of the choir master of the temple.<P>(f) "Dedication of the House" (<a onClick="return mV(\'Psa\',30,\'1-\');">Ps 30</a>): The title probably refers to the dedication of Yahweh\'s house; whether in the days of David, in connection with the removal of the ark to Jerusalem, or in the days of Zerubbabel, or in the time of Judas Maccabeus, it is impossible to say positively. If <a onClick="return mV(\'Psa\',39,\'1-\');">Ps 39</a> was used on any one of these widely separated occasions, that fact might account for the insertion of the caption, "a So at the Dedication of the House."<P>(g) "Degrees": see "Ascents" above.<P>(h) Gittith (<a onClick="return mV(\'Psa\',8,\'1-\');">Psalms 8</a>; <a onClick="return mV(\'Psa\',81,\'1-\');">81</a>; <a onClick="return mV(\'Psa\',84,\'1-\');">84</a>) is commonly supposed to refer to an instrument invented in Gath or to a tune that was used in the Philistine city. Thirtle emends slightly to gittoth, "wine presses," and connects <a onClick="return mV(\'Psa\',7,\'1-\');">Psalms 7</a>; <a onClick="return mV(\'Psa\',80,\'1-\');">80</a> and <a onClick="return mV(\'Psa\',83,\'1-\');">83</a> with the Feast of Tabernacles.<P>(i) Higgayon: This word is not strictly a title, but occurs in connection with Celah in <a onClick="return mV(\'Psa\',9,16);">Ps 9:16</a>. the Revised Version (British and American) translates the word in <a onClick="return mV(\'Psa\',92,3);">Ps 92:3</a>, "a solemn sound," and in <a onClick="return mV(\'Psa\',19,14);">Ps 19:14</a>, "meditation." It is probably a musical note equivalent to largo.<P>(j) Yedhuthun: In the title of <a onClick="return mV(\'Psa\',39,1);">Ps 39</a>, Jeduthun might well be identical with the Chief Musician. In <a onClick="return mV(\'Psa\',62,\'1-\');">Psalms 62</a> and <a onClick="return mV(\'Psa\',77,\'1-\');">77</a> the Revised Version (British and American) renders "after the manner of Jeduthun." We know from <a onClick="return mV(\'1Ch\',16,41);">1Ch 16:41</a>; <a onClick="return mV(\'1Ch\',25,3);">25:3</a> that <a href="./study/isbe/search.html?string=JEDUTHUN">JEDUTHUN</a> (which see) was a choir leader in the days of David. He perhaps introduced a method of conducting the service of song which ever afterward was associated with his name. (k) Yonath \'elem rechoqim (<a onClick="return mV(\'Psa\',56,\'1-\');">Ps 56</a>): We have already called attention to the fact that as a subscript to <a onClick="return mV(\'Psa\',55,\'1-\');">Ps 55</a> "the dove of the distant terebinths," or "the silent dove of them that are afar off," would have a point of contact with <a onClick="return mV(\'Psa\',55,\'6-8\');">Ps 55:6-8</a>.<P>(l) Machalath (<a onClick="return mV(\'Psa\',53,\'1-\');">Ps 53</a>), Machalath le\'annoth (<a onClick="return mV(\'Psa\',88,\'1-\');">Ps 88</a>): Perhaps Thirtle\'s vocalization of the Hebrew consonants as mecholoth, "dancings," is correct. As a subscript to <a onClick="return mV(\'Psa\',87,\'1-\');">Ps 87</a>; mecholoth may refer to David\'s joy at the bringing of the ark to Zion (<a onClick="return mV(\'2Sa\',6,14,15);">2Sa 6:14,15</a>).<P>(m) Maskil (<a onClick="return mV(\'Psa\',32,\'1-\');">Psalms 32</a>; <a onClick="return mV(\'Psa\',42,\'1-\');">42-45</a>; <a onClick="return mV(\'Psa\',52,\'1-\');">52-55</A>; <a onClick="return mV(\'Psa\',74,\'1-\');">74</a>; <a onClick="return mV(\'Psa\',78,\'1-\');">78</a>; <a onClick="return mV(\'Psa\',88,\'1-\');">88</a>; <a onClick="return mV(\'Psa\',89,\'1-\');">89</a>; <a onClick="return mV(\'Psa\',142,\'1-\');">142</a>): The exact meaning of this common term is not clear. Briggs suggests "a meditation," Thirtle and others "a psalm of instruction," Kirkpatrick "a cunning psalm." Some of the 13 psalms bearing this title are plainly didactic, while others are scarcely to be classed as psalms of instruction.<P>(n) Mikhtam (<a onClick="return mV(\'Psa\',16,\'1-\');">Psalms 16</a>; <a onClick="return mV(\'Psa\',56,\'1-\');">56-60</a>): Following the rabbinical guess, some translate "a golden poem." The exact meaning is unknown.<P>(o) Muth labben: The title is generally supposed to refer to a composition entitled "Death of the Son." Possibly the melody to which this composition was sung was the tune to which <a onClick="return mV(\'Psa\',9,\'1-\');">Ps 9</a> (or <a onClick="return mV(\'Psa\',8,\'1-\');">8</a>) was to be sung. Thirtle translates "The Death of the Champion," and regards it as a subscription to <a onClick="return mV(\'Psa\',8,\'1-\');">Ps 8</a>, in celebration of the victory over Goliath.<P>(p) On "Neghinoth”occurs 6 times (<a onClick="return mV(\'Psa\',4,\'1-\');">Psalms 4</a>; <a onClick="return mV(\'Psa\',6,\'1-\');">6</a>; <a onClick="return mV(\'Psa\',54,\'1-\');">54</a>; <a onClick="return mV(\'Psa\',55,\'1-\');">55</a>; <a onClick="return mV(\'Psa\',67,\'1-\');">67</a>; <a onClick="return mV(\'Psa\',76,\'1-\');">76</a>), and means "with stringed instruments." Neghinath (<a onClick="return mV(\'Psa\',61,\'1-\');">Ps 61</a>) may be a slightly defective writing for Neghinoth. Perhaps stringed instruments alone were used with psalms having this title. According to Thirtle\'s hypothesis, the title was originally a subscript to <a onClick="return mV(\'Psa\',3,\'1-\');">Psalms 3</a>; <a onClick="return mV(\'Psa\',5,\'1-\');">5</a>; <a onClick="return mV(\'Psa\',53,\'1-\');">53</a>; <a onClick="return mV(\'Psa\',54,\'1-\');">54</a>; <a onClick="return mV(\'Psa\',60,\'1-\');">60</a>; <a onClick="return mV(\'Psa\',66,\'1-\');">66</a>; <a onClick="return mV(\'Psa\',75,\'1-\');">75</a>.<P>(q) Nechiloth (<a onClick="return mV(\'Psa\',5,\'1-\');">Ps 5</a>), possibly a subscript to <a onClick="return mV(\'Psa\',4,\'1-\');">Ps 4</a>, is supposed by some to refer to "wind instruments," possibly flutes.<P>(r) Celah, though not strictly a title, may well be discussed in connection with the superscriptions. It occurs 71 times in the Psalms and 3 times in Habakkuk. It is almost certainly technical term whose meaning was well known to the precentor and the choir in the temple. The Septuagint always, Symmachus and Theodotion generally, render diapsalma, which probably denotes an instrumental interlude. The Targum Aquila and some other ancient versions render "forever." Jerome, following Aquila, translates it "always." Many moderns derive Celah from a root meaning "to raise," and suppose it to be a sign to the musicians to strike up with a louder accompaniment. Possibly the singing ceased for a moment. A few think it is a liturgical direction to the congregation to "lift up" their voices in benediction. It is unwise to dogmatize as to the meaning of this very common word.<P>See <a href="./study/isbe/search.html?string=SELAH">SELAH</a>.<P>(s) Sheminith (<a onClick="return mV(\'Psa\',6,\'1-\');">Psalms 6</a>; <a onClick="return mV(\'Psa\',12,\'1-\');">12</a>), meaning "the eighth," probably denotes the male choir, as distinguished from \'Alamoth, the maidens\' choir. That both terms are musical notes is evident from <a onClick="return mV(\'1Ch\',15,\'19-21\');">1Ch 15:19-21</a>.<P>(t) Shiggayon (<a onClick="return mV(\'Psa\',7,\'1-\');">Ps 7</a>) is probably a musical note. Some think it denotes "a dithyrambic poem in wild ecstatic wandering rhythms, with corresponding music."<P>(u) Shoshannim (<a onClick="return mV(\'Psa\',45,\'1-\');">Psalms 45</a>; <a onClick="return mV(\'Psa\',69,\'1-\');">69</a>) means "lilies." Shoshannim \'edhuth (<a onClick="return mV(\'Psa\',80,\'1-\');">Ps 80</a>) means "lilies, a testimony." Shushah \'edhuth (<a onClick="return mV(\'Psa\',60,\'1-\');">Ps 60</a>) may be rendered "the lily of testimony." Thirtle represents these titles as subscripts to <a onClick="return mV(\'Psa\',44,\'1-\');">Psalms 44</a>; <a onClick="return mV(\'Psa\',59,\'1-\');">59</a>; <a onClick="return mV(\'Psa\',68,\'1-\');">68</a>; <a onClick="return mV(\'Psa\',79,\'1-\');">79</a>, and associates them with the spring festival, Passover. Others regard them as indicating the melody to which the various psalms were to be sung.<P>(v) "Song of Loves" (<a onClick="return mV(\'Psa\',45,\'1-\');">Ps 45</a>) is appropriate as a literary title to a marriage song.<P>(4) Testimony of the Titles as to Authorship.<P>(a) <a onClick="return mV(\'Psa\',90,\'1-\');">Ps 90</a> is ascribed to Moses.<P>(b) To David 73 psalms are ascribed, chiefly in Books I and II.<P>(c) Two are assigned to Solomon (<a onClick="return mV(\'Psa\',72,\'1-\');">Psalms 72</a>; <a onClick="return mV(\'Psa\',127,\'1-\');">127</a>).<P>(d) 12 are ascribed to Asaph (<a onClick="return mV(\'Psa\',50,\'1-\');">Psalms 50</a>; <a onClick="return mV(\'Psa\',73,\'1-\');">73-83</a>).<P>(e) 11 are assigned to the sons of Korah (<a onClick="return mV(\'Psa\',42,\'1-\');">Psalms 42-49</a>; <a onClick="return mV(\'Psa\',84,\'1-\');">84</a>; <a onClick="return mV(\'Psa\',85,\'1-\');">85</a>; <a onClick="return mV(\'Psa\',87,\'1-\');">87</a>).<P>(f) <a onClick="return mV(\'Psa\',88,\'1-\');">Ps 88</a> is attributed to Heman the Ezrahite.<P>(g) <a onClick="return mV(\'Psa\',89,\'1-\');">Ps 89</a> bears the name of Ethan the Ezrahire.<P>In most cases it is plain that the editors meant to indicate the authors or writers of the psalms. It is possible that the phrase "to David" may sometimes have been prefixed to certain psalms, merely to indicate that they were found in a collection which contained Davidic psalms. It is also possible that the titles "to Asaph" and\' "to the sons of Korah" may have originally meant that the psalms thus designated belonged to a collection in the custody of these temple singers. <a onClick="return mV(\'Psa\',72,\'1-\');">Ps 72</a> may also be a prayer for Solomon rather than a psalm <i>by</i> Solomon. At the same time, we must acknowledge, in the light of the titles describing the occasion of composition, that the most natural interpretation of the various superscriptions is that they indicate the supposed authors of the various poems to which they are prefixed. Internal evidence shows conclusively that some of these titles are incorrect. Each superscription should be tested by a careful study of the psalm to which it is appended.<P>(5) Titles Describing the Occasion of Writing.<P>There are 13 of these, all bearing the name of David. (a) <a onClick="return mV(\'Psa\',7,\'1-\');">Psalms 7</a>; <a onClick="return mV(\'Psa\',59,\'1-\');">59</a>; <a onClick="return mV(\'Psa\',56,\'1-\');">56</a>; <a onClick="return mV(\'Psa\',34,\'1-\');">34</a>; <a onClick="return mV(\'Psa\',52,\'1-\');">52</a>; <a onClick="return mV(\'Psa\',57,\'1-\');">57</a>; <a onClick="return mV(\'Psa\',142,\'1-\');">142</a>; <a onClick="return mV(\'Psa\',54,\'1-\');">54</a> are assigned to the period of his persecution by Saul. (b) During the period of his reign over all Israel, David is credited with <a onClick="return mV(\'Psa\',18,\'1-\');">Psalms 18</a>; <a onClick="return mV(\'Psa\',60,\'1-\');">60</a>; <a onClick="return mV(\'Psa\',51,\'1-\');">51</a>; <a onClick="return mV(\'Psa\',3,\'1-\');">3</a>; and <a onClick="return mV(\'Psa\',63,\'1-\');">63</a>.<P>II. Autho
