at different times is a fact that lies on the surface; as many as eight of these are clearly marked, and perhaps subdivisions might be made. The book was not originally conceived as the development of a theme, or even as a unity; whatever unity it has was an afterthought. That it did come to stand, however, for one homogeneous body of truth, and to receive a name and a degree of articulation as such, will be maintained in a later section (see III, below). Meanwhile, we will take the sections in order and note some of the salient characteristics of each. The introductory section, <a onClick="return mV(\'Pro\',1,\'1-\');">Proverbs 1-9</a>, has the marks of having been added later than most of the rest; and is introductory in the sense of concentrating the thought to the concept of Wisdom, and of recommending the spiritual attitude in which it is to be received. Its style—and in this it is distinguished from the rest of the book—is hortatory; it is addressed to "my son" (<a onClick="return mV(\'Pro\',1,8);">1:8</a> and often) or "my sons" (<a onClick="return mV(\'Pro\',4,1);">4:1</A>; <a onClick="return mV(\'Pro\',5,7);">5:7</a>; <a onClick="return mV(\'Pro\',7,24);">7:24</A>; <a onClick="return mV(\'Pro\',8,32);">8:32</A>), in the tone of a father or a sage, bringing stores of wisdom and experience to the young. The first six verses are prefatory, giving the purpose and use of the whole book. Then <a onClick="return mV(\'Pro\',1,7);">Pr 1:7</a> lays down as the initial point, or spiritual bedrock of Wisdom, the fear of Yahweh, a principle repeated toward the end of this introductory section (<a onClick="return mV(\'Pro\',9,10);">9:10</a>), and evidently regarded as very vital to the whole Wisdom system; compare <a onClick="return mV(\'Job\',28,28);">Job 28:28</a>; <a onClick="return mV(\'Psa\',111,10);">Ps 111:10</a>; Sirach 1:14. The effect of this prefatory and theme-propounding matter is to launch the collection of proverbs much after the manner of modern literary works, and the rest of the section bears this out fairly well. The most striking feature of the section, besides its general homiletic tone, is its personification of Wisdom. She is represented as calling to the sons of men and commending to them her ways (<a onClick="return mV(\'Pro\',1,\'20-33\');">Pr 1:20-33</a>; <a onClick="return mV(\'Pro\',8,\'1-21\',\'32-36\');">8:1-21,32-36</a>); she condescends, for right and purity\'s sake, to enter into rivalry with the "strange woman," the temptress, not in secret, but in open and fearless dealing (<a onClick="return mV(\'Pro\',7,\'6-\');">Pr 7:6</a>-<a onClick="return mV(\'Pro\',8,9);">8:9</a>; <a onClick="return mV(\'Pro\',9,\'1-6\');">9:1-6</a>,<a onClick="return mV(\'Pro\',9,\'13-18\');">13-18</a>); and, in a supremely poetic passage (<a onClick="return mV(\'Pro\',8,\'22-31\');">Pr 8:22-31</a>), she describes her relation from the beginning with God and with the sons of men. It represents the value that the Hebrew mind came to set upon the human endowment of Wisdom. The Hebrew philosopher thought not in terms of logic and dialectics, but in symbol and personality; and to this high rank, almost like that of a goddess, his imagination has exalted the intellectual and spiritual powers of man.<P>See <a href="./study/isbe/search.html?string=UPPERCASE">WISDOM</a>.<P>2. The Classic Nucleus:<P>The section <a onClick="return mV(\'Pro\',10,\'1-\');">Pr 10:1-22:16</a>, with the repeated heading "The proverbs of Solomon", seems to have been the original nucleus of the whole collection. All the proverbs in this, the longest section of the book, are molded strictly to the couplet form (the one triplet, <a onClick="return mV(\'Pro\',19,7);">19:7</A>, being only an apparent exception, due probably to the loss of a line), each proverb a parallelism in condensed phrasing, in which the second line gives either some contrast to or some amplification of the first. This was doubtless the classic art norm of the Solomonic mashal.<P>The section seems to contain the product of that period of proverb-culture during which the sense of the model was a little rigid and severe, not venturing yet to limber up the form. Signs of a greater freedom, however, begin to appear, and possibly two strata of compilation are represented. In <a onClick="return mV(\'Pro\',10,\'1-\');">Proverbs 10-15</a> the prevailing couplet is antithetic, which embodies the most self-closed circuit of the thought. Out of 184 proverbs only 19 do not contain some form of contrast, and 10 of these are in <a onClick="return mV(\'Pro\',15,\'1-\');">Proverbs 15</a>. In <a onClick="return mV(\'Pro\',16,\'1-\');">Pr 16-22:16</a>, on the other hand, the prevailing form is the so-called synonymous or amplified couplet, which leaves the thought-circuit more open to illustrative additions. Out of 191 proverbs only 18 are antithetic, and these contain contrasts of a more subtle and hidden suggestion. As to subject-matter, the whole section is miscellaneous; in the first half, however, where the antithesis prevails, are the great elemental distinctions of life, wisdom and folly, righteousness and wickedness, industry and laziness, wise speech and reticence, and the like; while in the second half there is a decided tendency to go farther afield for subtler and less obvious distinctions. In this way they seem to reflect a growing and refining literary development, the gradual shaping and accumulation of materials for a philosophy of life; as yet, however, not articulated or reduced to unity of principle.<P>3. A Body of Solicited Counsel:<P>In the short section <a onClick="return mV(\'Pro\',22,\'17-\');">Pr 22:17-24:22</a>, the proverb literature seems for the first time to have become as it were self-conscious—to regard itself as a strain of wise counsel to be reckoned with for its educative value. The section is introduced by a preface (<a onClick="return mV(\'Pro\',22,\'17-21\');">22:17-21</A>), in which these "words of the wise" are recommended to some person or delegation, "that thou mayest carry back words of truth to them that send thee" (<a onClick="return mV(\'Pro\',22,21);">22:21</A>). The counsels seem intended for persons in responsible position, perhaps attached to the court (compare <a onClick="return mV(\'Pro\',23,1,2,3);">23:1-3</A>), who, as they are to deal officially with men and affairs, need the prudence, purity, and temperance which will fit them for their duties. As to form, the detached couplet appears only occasionally; the favorite form is the quatrain; but proverbs of a greater number of lines are freely used, and one, the counsel on wine drinking (<a onClick="return mV(\'Pro\',23,\'29-35\');">23:29-35</A>), runs to 17 lines. In tone and specific counsel the section has many resemblances to the introductory section (<a onClick="return mV(\'Pro\',1,\'1-\');">Proverbs 1-9</a>), and provokes the conjecture that this latter section, as the introduction to a compiled body of Wisdom, was composed not long after it.<P>4. Some Left-over Precepts:<P>The little appendix (<a onClick="return mV(\'Pro\',24,\'23-34\');">Pr 24:23-34</a>) is headed, "These also are sayings of the wise." They refer to wise intercourse and ordered industry. The little poem on the sluggard (<a onClick="return mV(\'Pro\',24,\'30-34\');">Pr 24:30-34</a>), with its refrain (<a onClick="return mV(\'Pro\',24,33,34);">Pr 24:33,34</a>), is noteworthy as being apparently one stanza of a poem which is completed with the same refrain in the introductory section (<a onClick="return mV(\'Pro\',6,\'6-11\');">Pr 6:6-11</a>). The stanzas are of the same length and structure; and it would seem the latter named was either discovered later or composed as a supplement to the one in this section.<P>5. The Hezekian Collection:<P>The long section (<a onClick="return mV(\'Pro\',25,\'1-\');">Proverbs 25-29</a>) is headed, "These also are proverbs of Solomon, which the men of Hezekiah king of Judah copied out." The collection claims to be only a compilation; but if, as already suggested, we understand the term "proverbs of Solomon" as equivalent to "Solomonic proverbs," referring rather to species than personal authorship, the compilation may have been made not merely from antiquity, but from the archives of the Wisdom guilds. If so, we have a clue to the state of the Wisdom literature in Hezekiah\'s time. The collection as a whole, unlike secs. 3 and 4, returns predominantly to the classic form of the couplet, but with a less degree of compression and epigram. There is a tendency to group numbers of proverbs on like subjects; note for instance the group on the king (<a onClick="return mV(\'Pro\',25,\'2-7\');">Pr 25:2-7</a>). The most striking-feature of the collection is the prevalence of simile and analogy, and in general the strong figurative coloring, especially in <a onClick="return mV(\'Pro\',25,\'1-\');">Proverbs 25-27</a>; it reads like a new species of proverb when we note that in all the earlier Solomonic sections there are only two clearly defined similes (<a onClick="return mV(\'Pro\',10,26);">10:26</A>; <a onClick="return mV(\'Pro\',11,22);">11:22</A>). In <a onClick="return mV(\'Pro\',25,\'1-\');">Proverbs 25-27</a> are several proverbs of three, four, or five lines, and at the end (<a onClick="return mV(\'Pro\',27,\'23-27\');">27:23-27</a>) a charming little poem of ten lines on husbandry. <a onClick="return mV(\'Pro\',28,\'1-\');">Proverbs 28</a>; <a onClick="return mV(\'Pro\',29,\'1-\');">29</a> are entirely of couplets, and the antithetic proverb reappears in a considerable number. As to subject-matter, the thought of this section makes a rather greater demand on the reader\'s culture and thinking powers, the analogies being less obvious, more subtle. It is decidedly the reflection of a more literary age than that of section 2.<P>6. Words of Agur:<P><a onClick="return mV(\'Pro\',30,\'1-\');">Proverbs 30</a> is taken up with "the words of Agur the son of Jakeh," a person otherwise unknown, who disclaims expert knowledge of Wisdom lore (<a onClick="return mV(\'Pro\',30,3);">30:3</A>), and avows an agnostic attitude toward theological speculations, yet shows a tender reverence before the name and unplumbed mystery of Yahweh (<a onClick="return mV(\'Pro\',30,6,9,32);">30:6,9,32</a>). His words amount to a plea against a too adventurous, not to say presumptuous, spirit in the supposed findings of human Wisdom, and as such supply a useful makeweight to the mounting pride of the scholar. Yet over this peculiar plea is placed the word "Massa" (ha-massa\'); "burden" or "oracle," the term used for prophetic disclosures; and the word for "said" ("the man said," ne\'-um ha-genjer) is the word elsewhere used for mystic or divine utterance. This seems to mark a stage in the self-consciousness of Wisdom when it was felt that its utterances could be ranked by the side of prophecy as a revelation of truth (compare what Wisdom says of herself, <a onClick="return mV(\'Pro\',8,14);">8:14</a>), and could claim the authoritative term "oracle." For the rest, apart from the humble reverence with which they are imbued, these words of Agur do not rise to a high level of spiritual thinking; they tend rather to the riddling element, or "dark sayings" (compare <a onClick="return mV(\'Pro\',1,6);">1:6</a>). The form of his proverbs is peculiar, verging indeed on the artificial; he deals mostly in the so-called numerical proverb ("three things...yea, four"), a style of utterance paralleled elsewhere only in <a onClick="return mV(\'Pro\',6,\'16-19\');">6:16-19</A>, but something of a favorite in the later cryptic sayings of the scribes, as may be seen in Pirqe \'Abhoth.<P>7. Words of King Lemuel:<P><a onClick="return mV(\'Pro\',31,\'1-9\');">Proverbs 31:1-9</a> (possibly the whole chapter should be included) is headed, "The words of king Lemuel; the oracle which his mother taught him." Here occurs again the mysterious Word "oracle," which would seem to be open to the same interpretation as the one given in the previous paragraph, though some would make this otherwise unknown monarch a king of Massa, and refer to the name of one of the descendants of Ishmael (<a onClick="return mV(\'Gen\',25,14);">Ge 25:14</a>), presumably a tribal designation. The Hebrew sages from the beginning were in rivalry and fellowship with the sages of other nations (compare <a onClick="return mV(\'1Ki\',4,30,31);">1Ki 4:30,31</a>); and in the Book of Job, the supreme reach of Wisdom utterance, all of the sages, Job included, are from countries outside of Palestine. King Lemuel, if an actual personage, was not a Jew; and probably Agur was not. The words of Lemuel are a mother\'s plea to her royal son for chastity, temperance and justice, the kingly virtues. The form is the simple Hebrew parallelism, not detached couplets, but continuous.<P>8. An Acrostic Eulogy of Woman:<P>The Book of Proverbs ends in a manner eminently worthy of its high standard of sanity and wisdom. Without any heading (it may possibly belong to the "oracle" that the mother of Lemuel taught her son) the last 22 verses (<a onClick="return mV(\'Pro\',31,\'10-31\');">31:10-31</a>) constitute a single poem in praise of a worthy woman, extolling especially her household virtues. In form these verses begin in the original with the successive 22 letters of the Hebrew alphabet; a favorite form of Hebrew verse, as may be seen (in the original) in several of the psalms, notably <a onClick="return mV(\'Psa\',119,\'1-\');">Ps 119</a>, and in <a onClick="return mV(\'Lam\',1,\'1-\');">Lamentations 1-4</a>.<P>III. Movement toward a Philosophy.<P>It has been much the fashion with modern critics to deny to the Hebrews a truly philosophic mind; this they say was rather the distinctive gift of the Greeks; while for their solution of the problem of life the Hebrews depended on direct revelation from above, which precluded that quasi-abeyance of concepts, that weighing of cosmic and human elements, involved in the commonly received notion of philosophy. This criticism takes account of only one side of the Hebrew mind. It is true they believed their life to be in direct contact with the will and word of Yahweh, revealed to them in terms which could not be questioned; but in the findings and deliverance of their own intellectual powers, too, they had a reliance and confidence which merits the name of an authentic philosophy. But theirs was a philosophy not of speculative world-making, but of conduct and the practical management of life; and it was intuitive and analogical, not the result of dialectical reasoning. Hence, its name wisdom, the solution itself, rather than philosophy, the love of wisdom, the search for solution. This Book of Proverbs, beginning with detached maxims on the elements of conduct, reveals in many suggestive ways the gradual emergence of a philosophy, a comprehensive wisdom, as it were, in the making; it is thus the pioneer book of that Hebrew Wisdom which we see developed to maturer things in the Books of Job and Ecclesiastes. Some of its salient stages may here be traced.<P>1. Liberation of the Mashal:<P>We may first note it, or the literary preparation for it, in the opening up of the mashal, or proverb unit, toward added elements of illustration, explanation, amplitude, a development that begins to appear, in the oldest section (the classic nucleus, section 2) at about <a onClick="return mV(\'Pro\',16,\'1-\');">Proverbs 16</a>. The primitive antithetic mashal contrasted two aspects of truth in such a way as to leave the case closed; there was nothing for it but to go on to a new subject. This had the good effect of setting over against each other the great elemental antagonisms of life: righteousness and wickedness, obedience and lawlessness, teachableness and perversity, industry and laziness, prudence and presumption, reticence and prating, etc., and so far forth it was a masterly analysis of the essentials of individual and social conduct. As soon, however, as the synonymous and illustrative mashal prevails, we are conscious of a limbering up and greater penetrativeness of the range of thought; it is open to subtler distinctions and remoter discoveries, and the analogies tend to employ the less direct relationships of cause and effect. This is increased as we go on, especially by the greater call upon the imagination in the figurative tissue of the Hezekian section, and by the decidedly greater tendency to the riddling and paradox element. The mashal increases in length and amplitude, both by the grouping of similar subjects and by the enlargement from the couplet to the quatrain and the developed poem. All this, while not yet a self-conscious philosophy, is a step on the way thereto.<P>2. Emergence of Basal Principles:<P>One solid presupposition of the sages, like an axiom, was never called in question: namely, that righteousness and wisdom are identical, that wickedness of any sort is folly. This imparts at once a kind of prophetic coloring to the Wisdom precepts, well represented by the opening proverb in the original section (after the prefatory one about the wise son), "Treasures of wickedness profit nothing; but righteousness delivereth from death" (<a onClick="return mV(\'Pro\',10,2);">Pr 10:2</a>). Thus from the outset is furnished an uncompromising background on which the fascinating allurements of vice, the crooked ways of injustice and dishonesty, the sober habits of goodness and right dealing, show for what they are and what they tend to. The sages thus put themselves, too, in entire harmony with what is taught by priests and prophets; there is no quarrel with the law or the word; they simply supply the third strand in the threefold cord of instruction (compare <a onClick="return mV(\'Jer\',18,18);">Jer 18:18</a>). From this basal presumption other principles, scarcely less axiomatic, come in view: that the fount and spring of wise living is reverence, the fear of Yahweh; that the ensuring frame of mind is teachableness, the precluding attitude perverseness; that it is the mark of wisdom, or righteousness, to be fearless and above board, of wickedness, which is folly, to be crooked and secretive. These principles recur constantly, not, as a system, but in numerous aspects and applications in the practical business of life. For their sanctions they refer naively to the Hebrew ideal of rewards on the one hand—wealth, honor, long life, family (compare <a onClick="return mV(\'Pro\',11,31);">Pr 11:31</a>)—and of shame and loss and destruction on the other; but these are emphasized not as direct bestowments or inflictions from a personal Deity, rather as in the law of human nature. The law that evil works its own destruction, good brings its own reward, is forming itself in men\'s reason as one of the fundamental concepts out of which grew the Wisdom philosophy.<P>3. The Conception of Wisdom:<P>From times long before Solomon sagacity in counsel, and. skill to put such counsel into maxim or parable, gave their possessor, whether man or woman, a natural leadership and repute in the local communities (compare <a onClick="return mV(\'2Sa\',14,2);">2Sa 14:2</a>; <a onClick="return mV(\'2Sa\',20,16);">20:16</a>); and Solomon\'s exceptional endowment showed itself not merely in his literary tastes, but in his ability, much esteemed among Orientals, to determine the merits of cases brought before him for judgment (<a onClick="return mV(\'1Ki\',3,\'16-28\');">1Ki 3:16-28</a>), and to answer puzzling questions (<a onClick="return mV(\'1Ki\',10,1,6,7);">1Ki 10:1,6,7</a>). It was from such estimate of men\'s intellectual powers, from the recognition of mental alertness, sagacity, grasp, in their application to the practical issues of life (compare <a onClick="return mV(\'Pro\',1,\'1-5\');">Pr 1:1-5</a>), that the conception of Wisdom in its larger sense arose. As, however, the cultivation of such sagacity of utterance passed beyond the pastime of a royal court (compare <a onClick="return mV(\'1Ki\',4,\'29-34\');">1Ki 4:29-34</a>) into the hands of city elders and sages it attained to greatly enhanced value; note how the influence of such sage is idealized (<a onClick="return mV(\'Job\',29,\'7-25\');">Job 29:7-25</a>). The sages had definite calling and mission of their own, more potent perhaps than belonged to priests and prophets; the frequent reference to the young and the "simple" or immature in the Book of Proverbs would indicate that they were virtually the schoolmasters and educators of the nation. As such, working as they did in a fellowship and collaboration with each other, the subject-matter with which they dealt would not remain as casual and miscellaneous maxims, but work toward a center and system of doctrine which could claim the distinction of an articulated philosophy of life, and all the more since it was so identified with the great Hebrew ideal of righteousness and truth. We have already noted how this sense of the dignity and value of their calling manifested itself in the body of precepts sent in response to solicitation (3 above), with its appendix (4 above) (<a onClick="return mV(\'Pro\',22,\'17-\');">Pr 22:17-24:34</a>). It was not long after this stage of Wisdom-culture, I think, that a very significant new word came into their vocabulary, the word (tushiyah, a puzzle to the translators, variously rendered "sound wisdom," "effectual working," and called by the lexicographers "a technical term of the Wisdom literature," BDB, under the word). Its earliest appearance, and the only one except in the introductory section (<a onClick="return mV(\'Pro\',18,1);">Pr 18:1</a>), is where the man who separates himself from others\' opinions and seeks his own desire is said to quarrel with all tushiyah. The word seems to designate Wisdom in its subjective aspect, as an authentic insight or intuition of truth, the human power to rise into the region of true revelation from below, as distinguished from the prophetic or legal word spoken directly from above. Outside of Proverbs and Job the word occurs only twice: once in <a onClick="return mV(\'Mic\',6,9);">Mic 6:9</a>, and once in <a onClick="return mV(\'Isa\',28,29);">Isa 28:29</a>, in which latter case the prophet has deliberately composed a passage (<a onClick="return mV(\'Isa\',28,\'23-29\');">28:23-29</A>) in the characteristic mashal idiom, and attributed that strain of insight to Yahweh. Evidently there came a time in the culture of Wisdom when its utterances attained in men\'s estimate to a parity with utterances direct from the unseen; perhaps this explains why Agur\'s and Lemuel\'s words could be boldly ranked as oracles (see above, 6 and 7). At any rate, such a high distinction, an authority derived from intimacy with the creative work of Yahweh (<a onClick="return mV(\'Pro\',8,30,31);">Pr 8:30,31</a>), is ascribed to Wisdom (chokhmah, in the introductory section; "counsel is mine," Wisdom is made to say, "and tushiyah" (<a onClick="return mV(\'Pro\',8,14);">Pr 8:14</a>). Thus the Book of Proverbs reveals to us a philosophy, as it were, in the making and from scattered counsels attaining gradually to the summit where the human intellect could place its findings by the side of divine oracles.<P>IV. Considerations of Age and Literary Kinship.<P>To get at the history of the Book of Proverbs, several inquiries must be raised. When were the proverbs composed? The book, like the Book of Psalms, is confessedly an anthology, containing various accumulations, and both by style and maturing thought bearing the marks of different ages. When were the successive compilations made? And, finally, when did the strain of literature here represented reach that point of self-conscious unity and coordination which justified its being reckoned with as a strain by itself and choosing the comprehensive name Wisdom? What makes these inquiries hard to answer is the fact that these proverbs are precepts for the common people, relating to ordinary affairs of the village, the market, and the field, and move in lines remote from politics and dynastic vicissitudes and wars. They are, to an extent far more penetrative and pervasive than law or prophecy, the educative literature on which the sturdy rank and file of the nation was nourished. \'Where there is no vision, the people let loose,\' says a Hezekian proverb (<a onClick="return mV(\'Pro\',29,18);">Pr 29:18</a>); but so they are also when there is no abiding tonic of social convention and principle. Precisely this latter it is which this Book of Proverbs in a large degree reveals; and in course of time its value was so felt that, as we have seen, it could rank itself as an asset of life by the side of vision. It represents, in a word, the human movement toward self-directiveness and self-reliance, without supine dependence on ruler or public sentiment (compare <a onClick="return mV(\'Pro\',29,25,26);">Pr 29:25,26</a>). When and how was this sane and wholesome communal fiber developed?<P>1. Under the Kings:<P>When Solomon and his court made the mashal an elegant fad, they builded better than they knew. They gave to the old native form of the proverb and parable, as reduced to epigrammatic mold and polish, the eclat of a popular literature. This was done orally at first (Solomon spoke his proverbs, <a onClick="return mV(\'1Ki\',4,32,33);">1Ki 4:32,33</a>); but the recording of such carefully expressed utterances could not be long delayed; perhaps this brief style coupe was the most natural early exercise in the new transition from the unwieldly cuneiform to the use of papyrus and a more flexible alphabet, which probably came in with the monarchy. At any rate, here was the medium for a practical didactic literature, applied to the matters of daily life and intercourse to which in Solomon\'s time the nation was enthusiastically awake. There is no valid reason for denying to Solomon, or at least to his time, the initiation of the Solomonic mashal; and if, as has been suggested, the name "proverbs of Solomon" designates rather literary species than personal authorship, the title of the whole book (<a onClick="return mV(\'Pro\',1,1);">Pr 1:1</a>), as well as the headings of sections (<a onClick="return mV(\'Pro\',10,1);">Pr 10:1</a>; <a onClick="return mV(\'Pro\',25,1);">25:1</a>), may be given in entire good faith, whatever the specific time or personal authorship of the utterances. Nor is there anything either in recorded history or the likelihood of the case to make improbable that the activity of the "men of Hezekiah" means just what is said; these men of letters were adding this supplementary collection (<a onClick="return mV(\'Pro\',25,\'1-\');">Pr 25-29</a>) to a body of proverbs that already existed and were recognized as Solomon\'s. This would put the composition of the main body of the Proverbs (chapters <a onClick="return mV(\'Pro\',10,\'1-\');">10-29</a>) prior to the reign of Hezekiah. They represent therefore the chief literary instruction available to the people in the long period of the Kings from Solomon onward, a period which otherwise was very meagerly supplied. The Mosaic Law, as we gather from the finding of the Law in the time of Josiah (<a onClick="return mV(\'2Ki\',22,\'1-\');">2Ki 22</a>), was at best a sequestered thing in the keeping—or neglect—of priests and judges; the prophetic word was a specific message for great national emergencies; the accumulations of sacred song were the property of the temple and the cult; what then was there for the education of the people? There were indeed the folk-tales and catechetical legends of their heroic history; but there were also, most influential of all, these wise sayings of the sages, growing bodies of precept and parable, preserved in village centers, published in the open places by the gate (compare <a onClick="return mV(\'Job\',29,7);">Job 29:7</a>), embodying the elements of a common-sense religion and citizenship, and representing views of life which were not only Hebrew, but to a great extent international among the neighbor kingdoms. Understood so, these Solomonic proverbs furnish incomparably the best reflection we have of the religious and social standards of the common people, during a period otherwise meagerly portrayed. And from it we can understand what a sterling fiber of character existed after all, and how well worth preserving for a unique mission in the world, in spite of the idolatrous corruptions that invaded the sanctuaries, the self-pleasing unconcern of the rulers and the pessimistic denunciations of the prophets.<P>2. The Concentrative Point:<P>For the point in the Hebrew literary history when these scattered Solomonic proverbs were recognized as a homogeneous strain of thought and the compilations were made and recommended as Wisdom, we can do no better, I think, than to name the age of Israel\'s literary prime, the age of Hezekiah. The "men of Hezekiah" did more than append their supplementary section (<a onClick="return mV(\'Pro\',25,1);">Proverbs 25-29</a>); the words "these also" (gam \'elleh) in their heading imply it.<P>See <a href="./study/isbe/search.html?string=HEZEKIAH,+THE+MEN+OF">HEZEKIAH, THE MEN OF</a>.<P>I apprehend the order and nature of their work somehow thus: Beginning with the classic nucleus (<a onClick="return mV(\'Pro\',10,\'1-\');">Pr 10-22:16</a>) (see above, II, 2), which may have come to them in two subsections (<a onClick="return mV(\'Pro\',10,\'1-\');">Proverbs 10-15</a>; <a onClick="return mV(\'Pro\',16,\'1-\');">16-22:16</a>), they put these together as the proverbs most closely associated with Solomon, without much attempt at systematizing, substantially as these had accumulated through the ages in the rough order of their developing form and thought; compiling thus, in their zeal for the literary treasures of the past, the body of educational literature which lay nearest at hand, a body adapted especially, though not exclusively, to the instruction of the young and immature. This done, there next came to their knowledge a remarkable body of "words of the wise" (<a onClick="return mV(\'Pro\',22,\'17-\');">Pr 22:17-24:22</a>), which had evidently been put together by request as a vade mecum for some persons in responsible position, and which were prefaced by a recommendation of them as "words of truth" designed to promote "trust in Yahweh" (<a onClick="return mV(\'Pro\',22,\'19-21\');">Pr 22:19-21</a>)—which latter, as we know from Isaiah, was the great civic issue of Hezekiah\'s time. With this section naturally goes the little appendix of "sayings of the wise" (<a onClick="return mV(\'Pro\',24,\'23-34\');">Pr 24:23-34</a>), added probably at about the same time. These two sections, which seem to open the collection to matter beyond the distinctive Solomonic mashal, are, beyond the rest of the book, in the tone of the introductory section (<a onClick="return mV(\'Pro\',1,\'1-\');">Proverbs 1-9</a>), which latter, along with the Hezekian appendix (<a onClick="return mV(\'Pro\',25,\'1-\');">Proverbs 25-29</a>), was added, partly as a new composition, partly as incorporating some additional findings (compare for instance the completion of the poem on the sluggard, <a onClick="return mV(\'Pro\',6,\'6-11\');">Pr 6:6-11</a>). Thus, by the addition of this introductory section, the Book of Proverbs was recognized as a unity, provided with a preface and initial proposition (<a onClick="return mV(\'Pro\',30,\'1-7\');">1:1-6,7</a>), and launched with such hortatory material as had already, on a smaller scale, introduced the third section. This part not only contains the praise of Wisdom as a human endowment, sharing in the mind and purpose of the divine (<a onClick="return mV(\'Pro\',8,\'22-31\');">8:22-31</A>), but it has become aware also of the revelatory value of tushiyah (<a onClick="return mV(\'Pro\',2,7);">2:7</a>; <a onClick="return mV(\'Pro\',3,21);">3:21</a>; <a onClick="return mV(\'Pro\',8,14);">8:14</a>), or chastened intuition (see above, III, 3), and dares to aspire, in its righteous teachableness, to the intimacy or secret friendship of Yahweh (codho, <a onClick="return mV(\'Pro\',3,32);">3:32</a>). All this indicates the holy self-consciousness to which Wisdom has attained.<P>I see no cogent reason for postponing the substantial completion of the Book of Proverbs beyond the time of Hezekiah. The words of Agur and of King Lemuel, with the final acrostic poem, may be later additions; but their difference in tone and workmanship is just as likely to be due to the fact that they are admitted, in the liberal spirit of the compilers, from foreign stores of wisdom. For spiritual clarity and intensity they do not rise to the height of the native Hebrew consciousness; and they incline to an artificial structure which suggests that the writer\'s interest is divided between sincere tushiyah and literary skill. For the sake of like-minded neighbors, however, something may be forgiven.<P>3. Its Stage in Progressive Wisdom:<P>It is too early in the history of Wisdom to regard this Book of Proverbs as an articulated and coordinated system. It is merely what it purports to be, a collected body of literature having a common bearing and purpose; a literature of reverent and intelligent self-culture, moving among the ordinary relations of life, and not assuming to embody any mystic disclosures of truth beyond the reach of human reason. As such, it has a vocabulary and range of ideas of its own, which distinguishes it from other strains of literature. This is seen in those passages outside of the Book of Proverbs which deliberately assume, for some specific purpose, the Wisdom dialect. In <a onClick="return mV(\'Isa\',28,\'23-29\');">Isa 28:23-29</a>, the prophet, whom the perverse rulers have taunted with baby-talk (<a onClick="return mV(\'Isa\',28,9,10);">28:9,10</a>), appeals to them with the characteristic Wisdom call to attention (<a onClick="return mV(\'Isa\',28,23);">28:23</a>), and in illustrations drawn from husbandry proves to them that this also is from Yahweh of hosts, \'who is transcendent in counsel, preeminent in tushiyah\' (<a onClick="return mV(\'Isa\',28,29);">28:29</a>)—teaching them thus in their own vaunted idiom. In <a onClick="return mV(\'Mic\',6,\'9-15\');">Mic 6:9-15</a>, similarly, calling in tushiyah to corroborate prophecy ("the voice of Yahweh," qol Yahweh, wethushiyah, <a onClick="return mV(\'Mic\',6,9);">6:9</a>), the prophet speaks of the natural disasters that men ought to deduce from their abuse of trade relations, evidently appealing to them in their own favorite strain of thinking. Both these passages seem to reflect a time when the Wisdom dialect was prevalent and popular, and both are concerned to call in sound human intuition as an ally of prophecy. At the same time, as prophets have the right to do, they labor to give revelation the casting vote; the authentic disclosure of truth from Yahweh is their objective, not the mere luxury of making clever observations on practical life. All this coincides, in the Wisdom sphere, with what in Isaiah\'s and Micah\'s time was the supreme issue of state, namely trust in Yahweh, rather than in crooked human devices (compare <a onClick="return mV(\'Isa\',28,16);">Isa 28:16</a>; <a onClick="return mV(\'Isa\',29,15);">29:15</a>); and it is noteworthy that this is the venture of Wisdom urged by the editors of Proverbs in their introductory exhortations (compare <a onClick="return mV(\'Pro\',22,19);">22:19</a>; <a onClick="return mV(\'Pro\',3,\'5-8\');">3:5-8</a>). In other words, these editors are concerned with inducing a spiritual attitude; and so in their literary strain they make their book an adjunct in the movement toward spirituality which Isaiah is laboring to promote. As yet, however, its findings are still in the peremptory stage, stated as absolute and unqualified truths; it has not reached the sober testing of fact and interrogation of motive which it must encounter in order to become a seasoned philosophy of life. Its main pervading thesis—that righteousness in the fear of God is wisdom and bound for success, that wickedness is fatuity and bound for destruction—is eternally sound; but it must make itself good in a world where so many of the enterprises of life seem to come out the other way, and where there is so little appreciation of spiritual values. Nor is the time of skepticism and rigid test long in coming. Two psalms of this period (as I apprehend) (<a onClick="return mV(\'Psa\',73,\'1-\');">Psalms 73</a> and <a onClick="return mV(\'Psa\',49,\'1-\');">49</A>) concern themselves with the anomaly of the success of the wicked and the trials of the righteous; the latter pointedly adopting the Wisdom or mashal style of utterance (<a onClick="return mV(\'Psa\',49,3,4);">Ps 49:3,4</a>), both laboring to induce a more inward and spiritual attitude toward the problem. It remains, however, for the Book of Job to take the momentous forward step of setting wisdom on the unshakable foundation of spiritual integrity, which it does by subjecting its findings to the rigid test of fact and its motives to a drastic Satanic sifting. It is thus in the Book of Job, followed later by the Book of Ecclesiastes, that the Wisdom strain of literature, initiated by the Proverbs of Solomon, finds its Old Testament culmination.``66';
isbe[7142]='Providence, 1`prov\'-i-dens:<P><b>I. PROVIDENCE DEFINED</b><P><b>II. DIFFERENT SPHERES OF PROVIDENTIAL ACTIVITY DISTINGUISHED</b><P><b>III. BIBLICAL PRESENTATION OF THE DOCTRINE OF PROVIDENCE</b><P class="in15">1. Divine Providence in the Old Testament Scriptures<P class="in30">(1) Providence in the Pentateuch<P class="in30">(2) The Historical Books of the Old Testament<P class="in30">(3) The Psalms<P class="in30">(4) The Wisdom Literature<P class="in30">(5) The Book of Job<P class="in30">(6) The Prophetical Writings<P class="in15">2. Divine Providence in the New Testament<P class="in30">(1) The Synoptic Gospels<P class="in30">(2) The Johannine Writings<P class="in30">(3) The Book of Acts and Other New Testament History<P class="in30">(4) The Pauline Epistles<P class="in30">(5) The Petrine Epistles, and Other New Testament Writings<P class="in15">3. Old Testament and New Testament Doctrines of Providence Compared<P class="in30">(1) The New Emphasis on the Fatherhood and Love of God<P class="in30">(2) The Place of Christ and the Holy Spirit in Providence<P class="in30">(3) The New Emphasis upon Moral and Spiritual Blessings<P><b>IV. DISCUSSION OF THE CONTENTS OF THE BIBLICAL DOCTRINE</b><P class="in15">1. Different Views of Providence Compared<P class="in30">(1) The Atheistic or Materialistic View<P class="in30">(2) The Pantheistic View<P class="in30">(3) The Deistic View<P class="in30">(4) The Theistic or Biblical View<P class="in30">(5) The Divine Immanence<P class="in15">2. The Divine Purpose and Final End of Providence<P class="in15">3. Special Providence<P class="in30">(1) Spiritual, Not Material, Good to Man the End Sought in Special Providence<P class="in30">(2) Special Providence and "Accidents"<P class="in30">(3) Special Providence as Related to Piety and Prayer<P class="in30">(4) Special Providence as Related to Human Cooperation<P class="in30">(5) General and Special Providence Both Equally Divine<P class="in15">4. Divine Providence and Human Free Will<P class="in30">(1) Divine Providence as Related to Willing Wills<P class="in30">(2) Divine Providence as Related to Sinful Free Will<P class="in15">5. Divine Providence as Related to Natural and Moral Evil<P class="in15">6. Evil Providentially Overruled for Good<P class="in15">7. Interpreting Providence<P class="in15">8. Conclusion<P><b>LITERATURE</b><hr /><P>I. Providence Defined.<P>The word "provide" (from Latin providere) means etymologically "to foresee." The corresponding Greek word, pronoia, means "forethought." Forethought and foresight imply a future end, a goal and a definite purpose and plan for attaining that end. The doctrine of final ends is a doctrine of final causes, and means that that which is last in realization and attainment is first in mind and thought. The most essential attribute of rational beings is that they act with reference to an end; that they act not only with thought but with forethought. As, therefore, it is characteristic of rational beings to make preparation for every event that is foreseen or anticipated, the word "providence" has come to be used less in its original etymological meaning of foresight than to signify that preparation care and supervision which are necessary to secure a desired future result. While all rational beings exercise a providence proportioned to their powers, yet it is only when the word is used with reference to the Divine Being who is possessed of infinite knowledge and power that it takes on its real and true significance. The doctrine of divine providence, therefore, has reference to that preservation care and government which God exercises over all things that He has created in order they may accomplish the ends for which they were created.<P>"Providence is the most comprehensive term in the language of theology. It is the background of all the several departments of religious truth, a background mysterious in its commingled brightness and darkness. It penetrates and fills the whole compass of the relations of man with his Maker. It connects the unseen God with the visible creation, and the visible creation with the work of redemption, and redemption with personal salvation, and personal salvation with the end of all things. It carries our thoughts back to the supreme purpose which was in the beginning with God, and forward to the foreseen end and consummation of all things, while it includes between these the whole infinite variety of the dealings of God with man" (W. B. Pope, Compendium of Christian Theology, I, 456).<P>II. Different Spheres of Providential Activity Distinguished.<P>The created universe may be conveniently divided, with reference divine providence, into three departments: first, the inanimate or physical universe, which is conserved or governed by God according to certain uniform principles called the laws of Nature; secondly, animate existence, embracing the vegetable and animal world, over which God exercises that providential care which is necessary to sustain the life that He created; and thirdly, the rational world, composed of beings who, in addition to animate life, are possessed of reason and moral free agency, and are governed by God, not necessitatively, but through an appeal to reason, they having the power to obey or disobey the laws of God according to the decision of their own free wills. This widespread care and supervision which God exercises over His created universe is commonly designated as His general providence which embraces alike the evil and the good, in addition to which there is a more special and particular providence which He exercises over and in behalf of the good, those whose wills are in harmony with the divine will. <p>III. Biblical Presentation of the Doctrine of Providence.<P>The word "providence" is used only once in the Scriptures (<a onClick="return mV(\'Act\',24,2);">Ac 24:2</a>), and here it refers, not to God, but to the forethought and work of man, in which sense it is now seldom used. (See also <a onClick="return mV(\'Rom\',13,14);">Ro 13:14</a>, where the same Greek word is translated "provision.") While, however, the Biblical use of the word calls for little consideration, the doctrine indicated by the term "providence" is one of the most significant in the Christian system, and is either distinctly stated or plainly assumed by every Biblical writer. The Old Testament Scriptures are best understood when interpreted as a progressive revelation of God\'s providential purpose for Israel and the world. Messianic expectations pervade the entire life and literature of the Hebrew people, and the entire Old Testament dispensation may not improperly be regarded as the moral training and providential preparation of the world, and especially of the chosen people, for the coming Messiah. In the apocryphal "Book of Wisdom" the word "providence" is twice used (Wisd 14:3; 17:2) in reference to God\'s government of the World. Rabbinical Judaism, according to Josephus, was much occupied with discussing the relation of divine providence to human free will. The Sadducees, he tells us, held an extreme view of human freedom, while the Essenes were believers in absolute fate; the Pharisees, avoiding these extremes, believed in both the overruling providence of God and in the freedom and responsibility of man (Ant., XIII, v, 9; XVIII, i, 3; BJ, II, viii, 14). See <a href="./study/isbe/search.html?string=PHARISEES">PHARISEES</a>. The New Testament begins with the announcement that the "kingdom of heaven is at hand," which declaration carries along with it the idea of a providential purpose and design running through the preceding dispensation that prepared for the Messiah\'s coming. But the work of Christ is set forth in the New Testament, not only as the culmination of a divine providence that preceded it, but as the beginning of a new providential order, a definite and far-reaching plan, for the redemption of the world, a forethought and plan so comprehensive that it gives to the very idea of divine providence a new, larger and richer meaning, both intensively and extensively, than it ever had before. The minutest want of the humblest individual and the largest interests of the world-wide kingdom of God are alike embraced within the scope of divine providence as it is set forth by Christ and the apostles.<P>1. Divine Providence in the Old Testament Scriptures:<P>(1) Providence in the Pentateuch.<P>The opening sentence of the Scriptures, "In the beginning God created the heaven and the earth," is a noble and majestic affirmation of God\'s essential relationship to the origin of all things. It is followed by numerous utterances scattered throughout the sacred volume that declare that He who created also preserves and governs all that He created. But the Israelite nation was from the beginning of its history, in the Hebrew conception, the special object of God\'s providence and care, though it was declared that Yahweh\'s lordship and government extended over all the earth (<a onClick="return mV(\'Exd\',8,22);">Ex 8:22</a>). The Deuteronomist (<a onClick="return mV(\'Deu\',10,14);">De 10:14</a>) uses language which implies that divine possession of all things in heaven and earth carries along with it the idea of divine providence and control; and he also regards Israel as Yahweh\'s peculiar possession and special care (<a onClick="return mV(\'Deu\',32,8);">De 32:8</a>).<P>This special providence that was over the elect nation as a whole was also minute and particular, in that special individuals were chosen to serve a providential purpose in the making of the nation, and were divinely-guided in the accomplishment of their providential mission. Thus Abraham\'s providential place in history is set forth in <a onClick="return mV(\'Neh\',9,7,8);">Ne 9:7,8</a>. Jacob acknowledges the same providential hand in his life (<a onClick="return mV(\'Gen\',31,42);">Ge 31:42</a>; <a onClick="return mV(\'Gen\',48,15);">48:15</a>). The life of Joseph abounds in evidences of a divine providence (<a onClick="return mV(\'Gen\',45,5,7);">Ge 45:5,7</a>; <a onClick="return mV(\'Gen\',50,20);">50:20</a>). The whole life-history of Moses as it is found in the Pentateuch is a study in the doctrine of divine providence. Other lives as set forth in these early narratives may be less notable, but they are not less indebted to divine providence for what they are and for what they accomplish for others. Indeed, as Professor Oehler remarks, "The whole Pentateuchal history of revelation is nothing but the activity of that divine providence which in order to the realization of the divine aim, is at once directed to the whole, and at the same time proves itself efficacious in the direction of the life of separate men, and in the guiding of all circumstances" (Old Testament Theology).<P>(2) The Historical Books of the Old Testament.<P>In a sense all the books of the Old Testament are historical in that they furnish material for writing a history of the people of Israel. See <a href="./study/isbe/search.html?string=ISRAEL,+HISTORY+OF">ISRAEL, HISTORY OF</a>. The Pentateuch, the Poetical Books, the Wisdom Literature, the Prophets, all furnish material for writing Old Testament history; but there is still left a body of literature, including the books from Joshua to Esther that may with peculiar fitness designated as historical. These books are all, in an important sense, an interpretation and presentation of the facts of Hebrew history in their relation to divine providence. The sacred historians undertake to give something of a divine philosophy of history, to interpret in a religious way the facts of history, to point out the evils of individual and national sin and the rewards and blessings of righteousness, and to show God\'s ever-present and ever-guiding hand in human history—that He is not a silent spectator of human affairs, but the supreme moral Governor of the universe, to whom individuals and nations alike owe allegiance. To the Hebrew historian every event in the life of the nation has a moral significance, both because of its relation to God and because of its bearing on the providential mission and testing of Israel as the people of God. The Book of Judges, which covers the "dark ages" of Bible history, and is an enigma to many in the study of God\'s hand in history, shows how far God must needs condescend at times in His use of imperfect and even sensual men through whom to reveal His will and accomplish His work in the world. While therefore He condescends to use as instruments of His providence such men as Samson and Jephthah, it is never through these that He does His greatest work, but through an Abraham, a Joseph, a Moses, an Isaiah, through men of lofty moral character. And this is one of the most notable lessons of Old Testament history if it be studied as a revelation of God\'s providential methods and instrumentalities. Among these historical writers none has given clearer and stronger expression to God\'s providential relation to the physical world as its preserver and to the moral world as its Divine Governor than the author of Nehemiah. "Thou, even thou, art Lord alone; thou hast made heaven, the heaven of heavens, with all their host, the earth, and all things that are therein, the seas, and all that is therein, and thou preservest them all....Yet thou in thy manifold mercies forsookest them not in the wilderness: the pillar of the cloud departed not from them by day, to lead them in the way; neither the pillar of fire by night, to shew them light, and the way wherein they should go. Thou gavest also thy good spirit to instruct them" (<a onClick="return mV(\'Neh\',9,6,19,20);">Ne 9:6,19,20</a> the King James Version). His words reflect the views that were entertained by all the Old Testament historains as to God\'s hand in the government and guidance of the nation. Hebrew history, because of the divine promises and divine providence, is ever moving forward toward the Messianic goal.<P>(3) The Psalms.<P>The poets are among the world\'s greatest religious teachers, and theology of the best poets generally represents the highest and purest faith that is found among a people. Applying this truth to the Hebrew race, we may say that in the Psalms and the Book of Job we reach the high-water mark of the Old Testament revelation as to the doctrine of divine providence. The Psalmist\'s God is not only the Creator and Preserver of all things, but is a prayer-hearing and prayer-answering God, a Being so full of tender mercy and loving-kindness that we cannot fail to identify Him with the God whom Christ taught us to call "our Father." Nowhere else in the entire Scriptures, except in the Sermon on the Mount, can we find such a full and clear exhibition of the minute and special providence of God over His faithful and believing children as in the Psalms—notably such as <a onClick="return mV(\'Psa\',91,\'1-\');">Psalms 91</a>; <a onClick="return mV(\'Psa\',103,\'1-\');">103</a>; <a onClick="return mV(\'Psa\',104,\'1-\');">104</a> and <a onClick="return mV(\'Psa\',139,\'1-\');">139</a>. <a onClick="return mV(\'Psa\',105,\'1-\');">Ps 105</a> traces God\'s hand in providential and gracious guidance through every stage of Israel\'s wondrous history. Thanksgiving and praise for providential mercies and blessings abound in <a onClick="return mV(\'Psa\',44,\'1-\');">Psalms 44</a>; <a onClick="return mV(\'Psa\',66,\'1-\');">66</a>; <a onClick="return mV(\'Psa\',78,\'1-\');">78</a>; <a onClick="return mV(\'Psa\',85,\'1-\');">85</a>; <a onClick="return mV(\'Psa\',138,\'1-\');">138</a>. While the relation of God\'s power and providence to the physical universe and to the material and temporal blessings of life is constantly asserted in the Psalms, yet it is the connection of God\'s providence with man\'s ethical and spiritual nature, with righteousness and faith and love, that marks the highest characteristic of the Psalmist\'s revelation of the doctrine of providence. That righteousness and obedience are necessary conditions and accompaniments of divine providence in its moral aspects and results is evidenced by numerous declarations of the psalmists (<a onClick="return mV(\'Psa\',1,6);">1:6</a>; <a onClick="return mV(\'Psa\',31,19,20);">31:19,20</A>; <a onClick="return mV(\'Psa\',74,12);">74:12</A>; <a onClick="return mV(\'Psa\',84,11);">84:11</a>; <a onClick="return mV(\'Psa\',91,1);">91:1</a>; <a onClick="return mV(\'Psa\',125,2);">125:2</A>). This thought finds happiest expression in <a onClick="return mV(\'Psa\',37,23);">Ps 37:23</a> the King James Version: "The steps of a good man are ordered of the Lord, and he delighteth in his way." The inspired poets make it plain that the purpose of divine providence is not merely to meet temporal wants and bring earthly blessings, but to secure the moral good of individuals and nations.<P>(4) The Wisdom Literature.<P>The doctrine of providence finds ample and varied expression in the wisdom Lit. of the Old Testament, notably in the Book of Proverbs. The power that preserves and governs and guides is always recognized as inseparable from the power that creates and commands (<a onClick="return mV(\'Pro\',3,\'21-26\');">Pr 3:21-26</a>; <a onClick="return mV(\'Pro\',16,4);">16:4</a>). Divine providence does not work independently of man\'s free will; providential blessings are conditioned on character and conduct (<a onClick="return mV(\'Pro\',26,10);">Pr 26:10</a> the King James Version; <a onClick="return mV(\'Pro\',2,7,8);">Pr 2:7,8</a>; <a onClick="return mV(\'Pro\',12,2,21);">12:2,21</a>). There cannot be, in Old Testament terms of faith, any stronger statement of the doctrine of divine providence than that given by the Wise Men of Israel in the following utterances recorded in the Book of Proverbs: "In thy ways acknowledge him and he will direct thy paths" (<a onClick="return mV(\'Pro\',3,6);">3:6</a>); "A man\'s heart deviseth his way, but Yahweh directeth his steps" (<a onClick="return mV(\'Pro\',16,9);">16:9</a>) "The lot is cast into the lap; but the whole disposing thereof is of Yahweh" (<a onClick="return mV(\'Pro\',16,33);">16:33</A>); "A man\'s goings are of Yahweh" (<a onClick="return mV(\'Pro\',20,24);">20:24</A>); "The king\'s heart is in the hand of Yahweh as the watercourses: He turneth it whithersoever he will" (<a onClick="return mV(\'Pro\',3,6);">21:1</a>); "The horse is prepared against the day of battle; but victory is of Yahweh" (<a onClick="return mV(\'Pro\',21,31);">21:31</a>). See also <a onClick="return mV(\'Pro\',3,\'21-26\');">3:21-26</a>; <a onClick="return mV(\'Pro\',12,2,21);">12:2,21</a>. The conception of providence that is presented in the Book of Ecclesiastes seems to reflect the views of one who had had experience in sin and had come into close contact with many of life\'s ills. All things have their appointed time, but the realization of the providential purposes and ends of creaturely existence is, wherever human free agency is involved, always conditioned upon man\'s exercise of his free will. The God of providence rules and overrules, but He does not by His omnipotence overpower and override and destroy man\'s true freedom. Things that are do not reflect God\'s perfect providence, but rather His providence as affected by human free agency and as marred by man\'s sin (<a onClick="return mV(\'Ecc\',3,\'1-11\');">Ec 3:1-11</a>). "I know that there is nothing better for them, than to rejoice, and to do good so long as they live: And also that every man should eat and drink and enjoy good in all his labor, is the gift of God" (<a onClick="return mV(\'Ecc\',3,12,13);">Ec 3:12,13</a>; see also <a onClick="return mV(\'Ecc\',3,14);">Ec 3:14</a>); "The righteous, and the wise, and their works, are in the hand of God" (<a onClick="return mV(\'Ecc\',9,1);">Ec 9:1</a>); "The race is not to the swift, nor the battle to the strong" (<a onClick="return mV(\'Ecc\',9,11);">Ec 9:11</a>). The same conclusion that the author of Ecclesiastes reached as to how human life is affected by divine providence and man\'s sin has found expression in the oft-quoted lines of the great poet:<P class="in15">"There\'s a Divinity that shapes our ends,<P class="in15">Rough-hew them how we will."<P>(5) The Book of Job.<P>The greatest of all the inspired contributions to the Wisdom Literature of the Old Testament, the Book of Job, demands special consideration. It is the one book in the Bible that is devoted wholly to a discussion of divine providence. The perplexities of a thoughtful mind on the subject of divine providence and its relation to human suffering have nowhere in the literature of the world found stronger and clearer expression than in this inspired drama which bears the name of its unique and marvelous hero, Job. Job represents not only a great sufferer, but an honest doubter: he dared to doubt theology of his day, a theology which he had himself doubtless believed until experience, the best of all teachers, taught him its utter inadequacy to explain the deepest problems of human life and of divine providence. The purpose of this book in the inspired volume seems to be to correct the prevailing theology of the day with regard to the subject of Sin and suffering in their relation to divine providence. There is no more deplorable and hurtful error that a false theology could teach than that all suffering in this world is a proof of sin and a measure of one\'s guilt (see <a href="./study/isbe/search.html?string=AFFLICTION">AFFLICTION</a>). It is hard enough for the innocent to suffer. To add to their suffering by them that it is all because they are awful sinners, even though their hearts assure them that they are not, is to lay upon the innocent a burden too grievous to be borne. The value in the inspired Canon of a book written to reveal the error of such a misleading doctrine as this cannot easily be over-estimated. The invaluable contribution which this book makes to the Biblical doctrine of providence is to be found, not in individual and detached sayings, striking and suggestive as some of these may be, but rather in the book as a whole. Statements concerning God\'s general abound in this inspired drama—such these, for example: "Who knoweth not in all these, that the hand of Yahweh hath wrought this, in whose hand is the soul of every living thing, and the breath of all mankind?" (<a onClick="return mV(\'Job\',12,9,10);">Job 12:9,10</a>);" Who hath given him a charge over the earth? or who hath disposed the whole world?...He shall break in pieces mighty men without number, and set others in their stead" (<a onClick="return mV(\'Job\',34,13,14);">Job 34:13,14</a> the King James Version).<P>But the special contribution of the Book of Job to the doctrine of divine providence, as already indicated, is to set forth its connection with the fact of sin and suffering. Perplexed souls in all ages have been asking: If God be all-powerful and all-good, why should there be any suffering in a world which He created and over which He rules? If He cannot prevent suffering is He omnipotent? If He can, but will not prevent suffering, is He infinitely good? Does the book solve the mystery? We cannot claim that it does. But it does vindicate the character of God, the Creator, and of Job, the moral free agent under trial. It does show the place of suffering in a moral world where free agents are forming Character; it does show that perfect moral character is made, not by divine omnipotence, but by trial, and that physical suffering serves a moral end in God\'s providential government of men and nations. While the book does not clear the problem of mystery, it does show how on the dark background of a suffering world the luminous holiness of divine and human character may be revealed. The picture of this suffering man of Uz, racked with bodily pains and irritated by the ill-spoken words of well-meaning friends, planting himself on the solid rock of his own conscious rectitude, and defying earth and hell to prove him guilty of wrong, and knowing that his Vindicator liveth and would come to his rescue—that is an inspired picture that will make every innocent sufferer who reads it stronger until the end of time.<P>See also <a href="./study/isbe/search.html?string=JOB,+BOOK+OF">JOB, BOOK OF</a>.<P>(6) The Prophetical Writings.<P>Nowhere in all literature is the existence and supremacy of a moral and providential order in the world more clearly recognized thin in the writings of the Old Testament prophets. These writings are best understood when interpreted as the moral messages and passionate appeals of men who were not only prophets and preachers of righteousness to their own times, but students and teachers of the moral philosophy of history for all time, seers, men of vision, who interpreted all events in the light of their bearing on this moral and providential order, in which divine order the Israelite nation had no small part, and over which Israel\'s God was sovereign, doing "according to his will in the army of heaven and among the inhabitants of earth." While each prophetic message takes its coloring from the political, social and moral conditions that called it forth, and therefore differs from every other message, the prophets are all one in their insistence upon the supremacy and divine authority of this moral order, and in their looking forward to the coming of the Messiah and the setting up of the Messianic kingdom as the providential goal and consummation of the moral order. They all describe in varying degrees of light and shade a coming time when One born of their own oppressed and down-trodden race should come in power and glory, and set up a kingdom of righteousness and love in the earth, into which kingdom all nations shall be ultimately gathered; and of His kingdom there shall be no end. God\'s providential government of the nation was always and everywhere directed toward this Messianic goal. The language which an inspired writer puts into the mouth of Nebuchadnezzar, the heathen king, is an expression, not so much of the Gentile conception of God and His government, as it is of the faith of a Hebrew prophet concerning God\'s relationship to men and nations: "He doeth according to his will in army of heaven, and among the inhabitants of the earth; and none can stay his hand, or say unto him, What doest thou?" (<a onClick="return mV(\'Dan\',4,35);">Da 4:35</a>). The providential blessings which the prophets promise to the people, whether to individuals or to the nation, are never a matter of mere omnipotence or favoritism, but are inseparably connected with righteous conduct and holy character. The blessings promised are mainly spiritual, but whether spiritual or material, they are always conditioned on righteousness. The Book of Isaiah is especially rich in passages that emphasize the place of moral conduct and character in God\'s providential government of the world, the supreme purpose and end of which are to establish a kingdom of righteousness in the earth (<a onClick="return mV(\'Isa\',33,\'13-16\');">Isa 33:13-16</a>; <a onClick="return mV(\'Isa\',35,\'8-10\');">35:8-10</a>; <a onClick="return mV(\'Isa\',43,2);">43:2</a>; <a onClick="return mV(\'Isa\',46,4);">46:4</a>; <a onClick="return mV(\'Isa\',54,\'14-17\');">54:14-17</a>). Divine providence is both personal and national, and of each it is declared in varying terms of assurance that "Yahweh will go before you; and the God of Israel will be your rearward" (<a onClick="return mV(\'Isa\',52,12);">Isa 52:12</a>). Each of the major and minor prophets confirms and re-enforces the teachings of this greatest and most truly representative of all the Old Testament prophets.<P>2. Divine Providence in the New Testament:<P>(1) The Synoptic Gospels.<P>The Synoptic Gospels furnish the richest possible material for a study of the doctrine of divine providence. They recognize in the advent of Christ the fulfillment of a long line of Messianic prophecies and the culmination of providential purposes and plans that had been in the divine mind from the beginning and awaited the fullness of time for their revelation in the Incarnation (<a onClick="return mV(\'Mat\',1,22);">Mt 1:22</a>; <a onClick="return mV(\'Mat\',2,5,15);">2:5,15</a>; <a onClick="return mV(\'Mat\',3,3);">3:3</a>). In His private and personal life of service and prayer Christ is a model of filial trust in the providence of the heavenly Father (<a onClick="return mV(\'Mat\',11,25);">Mt 11:25</a>; <a onClick="return mV(\'Mat\',26,39);">26:39</a>; <a onClick="return mV(\'Mar\',1,35);">Mr 1:35</a>; <a onClick="return mV(\'Mar\',6,46);">6:46</a>; <a onClick="return mV(\'Luk\',3,21);">Lu 3:21</a>; <a onClick="return mV(\'Luk\',11,1);">11:1</a>). His private and public utterances abound in declarations concerning God\'s ever-watchful and loving care for all His creatures, but above all for those creatures who bear His own image; while His teachings concerning the Kingdom of God reveal a divine providential plan for the world\'s redemption and education extending of necessity far into the future; and still beyond that, in His vision of divine providence, comes a day of final judgment, of retribution and reward, followed by a new and eternal order of things, in which the destiny of every man will be determined by his conduct and character in this present life (see our Lord\'s parables concerning the Kingdom: <a onClick="return mV(\'Mat\',13,\'24-50\');">Mt 13:24-50</a>; <a onClick="return mV(\'Mar\',4,26);">Mr 4:26</a>ff; <a onClick="return mV(\'Luk\',14,16);">Lu 14:16</a>ff; also <a onClick="return mV(\'Mat\',24,\'1\');">Mt 24</a> and <a onClick="return mV(\'Mat\',25,\'1\');">25</A>). The many familiar utterances of our Lord, found in the Synoptic Gospels, contain the most essential and precious of all the New Testament revelations concerning the providence of the heavenly Father (<a onClick="return mV(\'Mat\',5,45);">Mt 5:45</a>; <a onClick="return mV(\'Mat\',6,\'26-34\');">6:26-34</a>; <a onClick="return mV(\'Mat\',10,\'29-31\');">10:29-31</a>; <a onClick="return mV(\'Luk\',21,\'16-18\');">Lu 21:16-18</a>).<P>(2) The Johannine Writings.<P>John\'s Gospel differs from the Synoptic Gospels in its mode of presenting the doctrine of providence chiefly in that it goes back to the mind and purpose of God in the very beginning (<a onClick="return mV(\'Jhn\',1,\'1-5\');">Joh 1:1-5</a>), whereas the Synoptic Gospels simply go back to the Messianic prophecies of the Old Testament. Both the Gospel and the Epistles of John in their presentation of divine providence place the greatest possible emphasis on divine love and filial trust, the latter rising in many places to the point of positive assurance. The Book of Revelation is a prophetic vision, in apocalyptic form, of God\'s providential purpose for the future, dealing not so much with individuals as with nations and with the far-reaching movements of history extending through the centuries. God is revealed in John\'s writings, not as an omnipotent and arbitrary Sovereign, but as an all-loving Father, who not only cares for His children in this life but is building for them in the world to come a house of many mansions (<a onClick="return mV(\'Jhn\',14,\'1-20\');">Joh 14:1-20</a>).<P>(3) The Book of Acts and Other New Testament History.<P>The historical portions of the New Testament, as contained in the Acts, and elsewhere, while not eliminating or depreciating the element of human freedom in individuals and nations, yet recognize in human life and history the ever-present and all-controlling mind of that God in whom, it is declared, "we live, and move, and have our being" (<a onClick="return mV(\'Act\',17,28);">Ac 17:28</a>). The career of the first distinctive New Testament character begins with these words: "There came a man, sent from God, whose name was John" (<a onClick="return mV(\'Jhn\',1,6);">Joh 1:6</a>). But not only John, the forerunner, but every other individual, according to the New Testament conceptions, is a man "sent from God." The apostles conceive themselves to be such; Stephen, the martyr, was such; Paul was such (<a onClick="return mV(\'Act\',22,21);">Ac 22:21</a>). New Testament biography is a study in providentially guided lives, not omitting references to those who refuse to be so guided—for such is the power of human free agency, many who are "sent from God" refuse to go upon their divinely-appointed mission. The Day of Pentecost is the revelation of a new power in history—a revelation of the place and power which the divine-human Christ and the Holy Spirit are to have henceforth in making history—in making the character of the men and the nations whose deeds are to make history. The most potent moral force in history is to be, from the day of Pentecost on, the ascended incarnate Christ, and He is to be all the more influential in the world after His ascension, when His work shall be done through the Holy Spirit. This is the historical view of providence as connected with the person of Christ, which the New Testament historians present, and which we, after 19 centuries of Christian history, are warranted in holding more confidently and firmly even than the Christians of the 1st century could hold it; for the Christian centuries have proved it true. What God is in Nature Christ is in history. All history is becoming Christian history, thus realizing the New Testament conception of divine providence in and through Christ.<P>(4) The Pauline Writings.<P>No character of whom we have any account in Christian literature was providentially prepared for his life-work and providentially guided in accomplishing that life-work more truly than was the apostle Paul. We find, there. fore, as we would antecedently expect, that Paul\'s speeches and writings abound in proofs of his absolute faith in the overruling providence of an all-wise God. His doctrine of predestination and foreordination is best understood when interpreted, not as a divine power predetermining human destiny and nullifying the human will, but as a conception of divine providence as the eternal purpose of God to accomplish an end contemplated and foreseen from the beginning, namely, the redemption of the world and the creation in and through Christ of a new and holy humanity. Every one of the Pauline Epistles bears witness to the author\'s faith in a divine providence that overrules and guides the life of every soul that works in harmony with the divine will; but this providence is working to secure as its chief end, not material and temporal blessings, but the moral and spiritual good of those concerned. Paul\'s teachings concerning divine providence as it concerns individuals and is conditioned on character may be found summed up in what is perhaps the most comprehensive single sentence concerning providence that was ever written: "And we know that all things work together for good to them that love God, to them who are the called according to his purpose" (<a onClick="return mV(\'Rom\',8,28);">Ro 8:28</a> the King James Version). Any true exposition of the New Testament doctrine of divine providence that may be given can only be an unfolding of the content of this brief but comprehensive statement. The greatest of the Pauline Epistles, that to the Romans, is a study in the divine philosophy of history, a revelation of God\'s providential purpose and plan concerning the salvation, not merely of individuals, but of the nations. These purposes, as Paul views them, whether they concern individuals or the entire race, are always associated with the mediatorial ministry of Christ: "For of him, and through him, and unto him, are all things. To him be the glory for ever" (<a onClick="return mV(\'Rom\',11,36);">Ro 11:36</a>).<P>(5) The Petrine Epistles, and Other New Testament Writings.<P>The Epistles of Peter, James, and Jude, and the Epistle to the Hebrews, are all in entire accord with the teachings of the other New Testament writings already considered. Peter, who at first found it so hard to see how God\'s providential purpose in and for the Messiah could be realized if Christ should suffer and die, came later to see that the power and the glory of Christ and His all-conquering gospel are inseparably connected with the sufferings and death of the Messiah (<a onClick="return mV(\'1Pe\',1,11,12);">1Pe 1:11,12</a>). No statement concerning God\'s providence over the righteous can be clearer or stronger than the following utterance of Peter: "The eyes of the Lord are upon the righteous, And his ears unto their supplication: But the face of the Lord is upon them that do evil. And who is he that will harm you, if ye be zealous of that which is good?" (<a onClick="return mV(\'1Pe\',3,12,13);">1Pe 3:12,13</a>). The purpose and end of divine providence as viewed in the Epistle of James are always ethical: as conduct and character are the end and crown of Christian effort, so they are the end and aim of divine providence as it cooperates with men to make them perfect (<a onClick="return mV(\'Jam\',1,5,17,27);">Jas 1:5,17,27</a>; <a onClick="return mV(\'Jam\',2,5);">2:5</a>; <a onClick="return mV(\'Jam\',5,7);">5:7</a>). The apologetic value of the Epistle to the Hebrews grows out of the strong proof it presents that Christ is the fulfillment, not only of the Messianic prophecies and expectations of Israel, but of the providential purposes and plans of that God who at sundry times and in divers manners had spoken in times past unto the fathers by a long line of prophets (<a onClick="return mV(\'Hbr\',1,1,2);">Heb 1:1,2</a>; <a onClick="return mV(\'Hbr\',11,\'7-40\');">11:7-40</a>; <a onClick="return mV(\'Hbr\',13,20,21);">13:20,21</a>). It would be difficult to crowd into one short chapter a more comprehensive study of the lessons of history that illustrate the workings and the retributions of the moral law under divine providence than is found in the Epistle of Jude (see especially <a onClick="return mV(\'Jud\',1,1:5,7,11,14,15,24);">Jude 1:5,7,11,14,15,24</a>).<P>3. Old Testament and New Testament Doctrines of Providence Compared:<P>From this brief survey of the teachings of the Old Testament and New Testament Scriptures concerning the doctrine of divine providence, it will be seen that, while the New Testament reaffirms in most particulars the doctrine of divine providence as set forth in the Old Testament Scriptures, there are three particulars in which the points of emphasis are changed, and by which new and changed emphasis the doctrine is greatly enriched in the New Testament.<P>(1) The New Emphasis on the Fatherhood and Love of God.<P>The God of providence in the Old Testament is regarded as a Sovereign whose will is to be obeyed, and His leading attributes are omnipotence and holiness, whereas in the New Testament God is revealed as the heavenly Father, and His providence is set forth as the forethought and care of a father for his children. His leading attributes here are love and holiness—His very omnipotence is the omnipotence of love. To teach that God is not only a righteous Ruler to be feared and adored, but a tender and loving Father who is ever thinking of and caring for His children, is to make God lovable and turn His providence into an administration of Almighty love.<P>(2) The Place of Christ and the Holy Spirit in Providence.<P>The doctrine of providence in the New Testament is connected with the person of Christ and the administration of the Holy Spirit, in a manner that distinguishes it from the Old Testament presentation of providence as the work of the one God who was there revealed in the simple unity of His nature without distinction of persons. If it be true, as some theologians have taught, that "God the Father plans, God the Son executes, and God the Holy Ghost applies," then it would follow that providence is the work exclusively of Christ and the Holy Spirit; but this theological formula, while it has suggestive value, cannot be accepted as an accurate statement of Biblical doctrine with reference to divine providence. Christ constantly refers creation and providence to the Father. But He also said, "My Father worketh even until now, and I work" (<a onClick="return mV(\'Jhn\',5,17);">Joh 5:17</a>), and the New Testament writers attribute to Christ the work both of creation and providence. Thus Paul: "For by him were all things created, that are in heaven and that are in earth, visible and invisible, whether they be thrones, or dominions, or principalities, or powers: all things were created by him, and for him: and he is before all things, and by him all things consist" (<a onClick="return mV(\'Col\',1,16,17);">Col 1:16,17</a> the King James Version). Although this and other passages refer to Christ\'s relation to general providence, including the government of the physical universe, yet it is only when the divine government is concerned with the redemption of a lost world and the establishment of the Kingdom of God in the hearts and lives of men, that the full extent of Christ\'s part in divine providence can be realized. The saving and perfecting of men is the supreme purpose of providence, if it be viewed from the New Testament standpoint, which is that of Christ\'s mediatorial ministry.<P>(3) The New Emphasis upon Moral and Spiritual Blessings.<P>The New Testament not only subordinates the material and temporal aspects of providence to the spiritual and eternal more than does the Old Testament, but Christ and the apostles, to an extent that finds no parallel in the Old Testament, place the emphasis of their teaching concerning providence upon man\'s moral needs and eternal interests, and upon the Kingdom of God and His righteousness, the establishment of which in the hearts and lives of men is the one great object for which both the heavenly Father and His children are ceaselessly working. To be free from sin, to be holy in heart and useful in life, to love and obey God as a Father, to love and serve men as brothers—this is the ideal and the end for which, according to the New Testament, men should work and pray, and this is the end toward which God is working by His ceaseless cooperative providence.``174';
