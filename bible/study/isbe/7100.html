criptural support. It has already been pointed out that the final judgment is uniformly represented as proceeding on the matter of this life. The theory is considered elsewhere.<P>See <a href="./study/isbe/search.html?string=ESCHATOLOGY+OF+THE+NEW+TESTAMENT">ESCHATOLOGY OF THE NEW TESTAMENT</a>, sec. X.<P>IV. Nature, Conditions and Issues.<P>1. Mystery of the Future:<P>While dogmatisms like the above, which seem opposed to Scripture, are to be avoided, it is equally necessary to guard against dogmatisms of an opposite kind, as if eternity must not, in the nature of the case, have its undisclosed mysteries of which we here in time can frame no conception. The difficulties connected with the ultimate destinies of mankind are truly enormous, and no serious thinker will minimize them. Scripture does not warrant it in negative, any more than in positive, dogmatisms; with its uniformly practical aim, it does not seek to satisfy an idle curiosity (compare <a onClick="return mV(\'Luk\',13,23,24);">Lu 13:23,24</a>). Its language is bold, popular, figurative, intense; the essential idea is to be held fast, but what is said cannot be taken as a directory to all that is to transpire in the ages upon ages of an unending duration. God\'s methods of dealing with sin in the eternities may prove to be as much above our present thoughts as His dealings now are with men in grace. In His hands we must be content to leave it, only using such light as His immediate revelation yields.<P>2. Nature of Punishment:<P>As respects the nature of the punishment of sin, it cannot be doubted that in its essence it is spiritual. Everything can be adopted here which is said by Maurice and others—"The eternal punishment is the punishment of being without the knowledge of God, who is love, and of Jesus Christ who has manifested it; even as eternal life is declared to be the having the knowledge of God and of Jesus Christ" (Theological Essays, 450). The supreme penalty of sin is unquestionably the loss of God\'s life and love—the being sinful. Environment, indeed, may be expected to correspond with character, but the hell is one the sinner essentially makes for himself, and, like the kingdom of God, is within. The fire, the worm, the stripes, that figure its severity, are not physical. Even should the poena sensus (were that conceivable) be utterly removed, the poena damni would eternally remain.<P>3. Range of Divine Mercy:<P>It is a sound principle that, in His dealing with sin in the world to come, God\'s mercy will reach as far as ever it can reach. This follows from the whole Scriptural revelation of the character of God. What may be included in it, it is impossible for anyone to say. It should be noticed that those of whom it is said that they shall not see life, but the wrath of God abideth on them, are those who "obey not" the truth (<a onClick="return mV(\'Jhn\',3,36);">Joh 3:36</a>)—who actively and consciously disregard and oppose it. But all do not belong to this class. It may be assumed that none will be lost who can in consistency with holiness and love be saved. The most germinal goodness, which is the implantation of His own Spirit, God will acknowledge and develop. The problem of undeveloped character may receive a solution we do not wot of with the entrance into the eternal light—not in change of character, but rather, as said before, in the revelation of character\'s inmost bent. In this sense, the entrance into eternity may be to many the revelation of a love and grace which had not been understood or appreciated as it should have been on earth, but with which it is in essential kinship. There are at least many shades and degrees of character, and God may be entrusted to take the most just, yet most merciful, account of all.<P>4. Gradation of Punishment:<P>The fullest weight must further be given to what the Scripture so expressly says of gradation of punishment, even of the unsaved. It is not the case that the lot of all who fail of the eternal life in Christ is all of one grade. There are the "few stripes" and the "many stripes" (<a onClick="return mV(\'Luk\',12,47,48);">Lu 12:47,48</a>); those for whom it will be "more tolerable" than for others in the day of judgment (<a onClick="return mV(\'Mat\',11,20,24);">Mt 11:20,24</a>). Even "Sodom and her daughters" will be mercifully dealt with in comparison with others (<a onClick="return mV(\'Eze\',16,48,49,53,55,61);">Eze 16:48,49,53,55,61</a>). There will be for everyone the most exact weighing of privilege, knowledge and opportunity. There is a vast area here for the divine administration on which no light at all is afforded us.<P>5. God "All in All":<P>There remain those passages already alluded to which do seem to speak, not, indeed, of conversion or admission into the light and fellowship of Christ\'s kingdom, but still of a final subjugation of the powers of evil, to the extent, at least, of a cessation of active opposition to God\'s will, of some form of ultimate unification and acknowledgment of Christ as Lord. Such passages are <a onClick="return mV(\'Eph\',1,10);">Eph 1:10</a>; <a onClick="return mV(\'Phl\',2,\'9-11\');">Php 2:9-11</a>; above all, <a onClick="return mV(\'1Cr\',15,\'24-28\');">1Co 15:24-28</a>. God, in this final vision, has become "all in all." Here, again, dogmatism is entirely out of place, but it is permissible to believe that these texts foreshadow such a final persuasion of God\'s righteousness in His judgment and of the futility of further rebellion as shall bring about an outward pacification and restoration of order in the universe disturbed by sin, though it can never repair that eternal loss accruing from exclusion from Christ\'s kingdom and glory.<P>LITERATURE.<P>Against: Maurice, Theological Essays, "Eternal Life and Eternal Death"; S. Cox, Salvator Mundi; F. W. Farrar, Eternal Hope; Mercy and Judgment; A. Jukes, The Second Death and the Restitution of All Things; E. White, Life in Christ; H. Constable, Duration and Nature of Future Punishment. For: Pusey, What Is of Faith as to Everlasting Punishment, H. N. Oxenham, Catholic Eschatology; C. Clemance, Future Punishment; Edersheim, Life and Times of Jesus, the Messiah, Appendix, xix, "On Eternal Punishment, according to the Rabbis and the New Testament "; The Future Life, A Defence of the Orthodox View, by the Most Eminent American Scholars; S. D. F. Salmond, The Christian Doctrine of Immortality, Book VI; Orr, Christian View of God, lecture ix; Luthardt, Saving Truths (English translations), lecture x. See also the various works on Dogmatic and Biblical Theology.``132';
isbe[7167]='Punishments`pun\'-ish-ments (\'awon, "fault," "iniquity," "punishment for iniquity," "sin" (<a onClick="return mV(\'Gen\',4,13);">Ge 4:13</a>; <a onClick="return mV(\'Lev\',26,41);">Le 26:41</a>; <a onClick="return mV(\'Job\',19,29);">Job 19:29</a>; <a onClick="return mV(\'Psa\',149,7);">Ps 149:7</a>; <a onClick="return mV(\'Lam\',4,22);">La 4:22</a>; <a onClick="return mV(\'Eze\',14,10);">Eze 14:10</a> margin; <a onClick="return mV(\'Amo\',1,3,6,9,11,13);">Am 1:3,6,9,11,13</a>; <a onClick="return mV(\'Amo\',2,1,4,6);">2:1,4,6</a>), \'onesh, "tribute," "fine," "punishment" (<a onClick="return mV(\'Lam\',3,39);">La 3:39</a>), chata\'ah, or chatta\'th, "sin" and its retribution, "penalty," "expiation" (<a onClick="return mV(\'Zec\',14,19);">Zec 14:19</a>); kolasis, "punishment," "torment" (<a onClick="return mV(\'Mat\',25,46);">Mt 25:46</a>), epitimia, "poll tax," hence, "penalty" (<a onClick="return mV(\'2Cr\',2,6);">2Co 2:6</a>), timoria, "vindication," hence, "penalty" (<a onClick="return mV(\'Hbr\',10,29);">Heb 10:29</a>), ekdikesis, "vindication," "retribution" (<a onClick="return mV(\'1Pe\',2,14);">1Pe 2:14</a> the King James Version)): A court could inflict for a crime against the person, a sentence of<P class="in15">(1) death in the form of stoning, burning, beheading, or strangling, etc.;<P class="in15">(2) exile to one of the cities of refuge in case of manslaughter (<a onClick="return mV(\'Num\',35,\'1-\');">Nu 35</a>); or<P class="in15">(3) stripes, not to exceed 40, in practice 39 or less (<a onClick="return mV(\'Deu\',25,3);">De 25:3</a>; <a onClick="return mV(\'2Cr\',11,24);">2Co 11:24</a>).<P>Offences against property (theft, fraudulent conversion of deposit, embezzlement, robbery) were punished by exacting more than the value of the things taken (<a onClick="return mV(\'Luk\',19,8);">Lu 19:8</a>), the excess going to the injured party, thus differing from a fine, which goes into the treasury of the community. The housebreaker was liable to be slain with impunity (<a onClick="return mV(\'Exd\',22,2);">Ex 22:2</a>). A fine in the modern sense is unknown in the Scriptures, unless <a onClick="return mV(\'Lev\',5,\'6-19\');">Le 5:6-19</a> be interpreted as referring to such.<P>1. History of the Hebrew Law concerning Punishment:<P>The earliest theory of punishment seems to have been that of retaliation—"blood for blood"—and to some extent this principle appears even in the Law of Moses (<a onClick="return mV(\'Lev\',21,19,20);">Le 21:19,20</a>; <a onClick="return mV(\'Mat\',5,38);">Mt 5:38</a>). Early in the history of the race, punishment was administered for sin and crime. Adam and Eve were driven from the Garden, and Cain, the first murderer, though not executed in retaliation for his deed, had a mark set on him. The words of Lamech (<a onClick="return mV(\'Gen\',4,24);">Ge 4:24</a>) indicate that death was regarded as the fitting punishment for murder, and the same thought apparently was in the minds of the brethren of Joseph (<a onClick="return mV(\'Gen\',42,21);">Ge 42:21</a>). Judah, as head of his family, seems to have had power of life and death (<a onClick="return mV(\'Gen\',38,24);">Ge 38:24</a>), and Abimelech threatens his people with the extreme punishment in case they injure or insult Isaac or his wife (<a onClick="return mV(\'Gen\',26,11);">Ge 26:11</a>). Similar power is ascribed to Pharaoh (<a onClick="return mV(\'Gen\',41,13);">Ge 41:13</a>).<P>2. The Mosaic Law concerning Punishment:<P>Under the Law of Moses, the murderer was to be put to death without mercy. Even if he took refuge at the altar in a sanctuary or in an asylum city, he would not be immune from arrest and execution, and the same principle was applied in the case of an animal (<a onClick="return mV(\'Exd\',21,12,14,23,28,36);">Ex 21:12,14,23,28,36</a> parallel). But punishment under the Mosaic Law was not to be entailed or transmitted (<a onClick="return mV(\'Deu\',24,16);">De 24:16</a>), as was the case among the Chaldeans (<a onClick="return mV(\'Dan\',6,24);">Da 6:24</a>) and the kings of Israel (<a onClick="return mV(\'1Ki\',21,1);">1Ki 21</a>; <a onClick="return mV(\'2Ki\',9,26);">2Ki 9:26</a>).<P>It has been noted that capital punishment is extensively prescribed by the Mosaic Law, and undoubtedly the Law was carried out. This circumstance has been explained by reference to the fact that the nation consisted of newly emancipated slaves, and therefore required harsh measures to keep them in check.<P>Under the Mosaic Law, the offenses that made one liable to the punishment of death were:<P class="in15">(1) striking or reviling a parent (<a onClick="return mV(\'Exd\',21,15,17);">Ex 21:15,17</a>);<P class="in15">(2) blasphemy (<a onClick="return mV(\'Lev\',24,14,16,23);">Le 24:14,16,23</a>; <a onClick="return mV(\'1Ki\',21,10);">1Ki 21:10</a>; <a onClick="return mV(\'Mat\',26,65,66);">Mt 26:65,66</a>);<P class="in15">(3) Sabbath-breaking (<a onClick="return mV(\'Exd\',31,14);">Ex 31:14</a>; <a onClick="return mV(\'Exd\',35,2);">35:2</a>; <a onClick="return mV(\'Num\',15,\'32-36\');">Nu 15:32-36</a>);<P class="in15">(4) witchcraft and false pretension to prophecy (<a onClick="return mV(\'Exd\',22,18);">Ex 22:18</a>; <a onClick="return mV(\'Lev\',20,27);">Le 20:27</a>; <a onClick="return mV(\'Deu\',13,5);">De 13:5</a>; <a onClick="return mV(\'Deu\',18,20);">18:20</a>; <a onClick="return mV(\'1Sa\',28,9);">1Sa 28:9</a>);<P class="in15">(5) adultery (<a onClick="return mV(\'Lev\',20,10);">Le 20:10</a>; <a onClick="return mV(\'Deu\',22,22);">De 22:22</a>);<P class="in15">(6) unchastity:<P class="in30">(a) before marriage, but detected afterward (<a onClick="return mV(\'Deu\',22,21);">De 22:21</a>),<P class="in30">(b) in case of a woman with someone other than her betrothed (<a onClick="return mV(\'Deu\',22,23);">De 22:23</a>),<P class="in30">(c) in a priest\'s daughter (<a onClick="return mV(\'Lev\',21,9);">Le 21:9</a>);<P class="in15">(7) rape (<a onClick="return mV(\'Deu\',22,25);">De 22:25</a>);<P class="in15">(8) incestuous and unnatural connections (<a onClick="return mV(\'Exd\',22,19);">Ex 22:19</a>; <a onClick="return mV(\'Lev\',20,11,14,16);">Le 20:11,14,16</a>);<P class="in15">(9) man-stealing (<a onClick="return mV(\'Exd\',21,16);">Ex 21:16</a>);<P class="in15">(10) idolatry, actual or virtual, in any form (<a onClick="return mV(\'Lev\',20,2);">Le 20:2</a>; <a onClick="return mV(\'Deu\',13,6);">De 13:6</a>; <a onClick="return mV(\'Deu\',17,\'2-7\');">17:2-7</a>);<P class="in15">(11) false witness in capital cases (<a onClick="return mV(\'Deu\',19,16,19);">De 19:16,19</a>).<P>A large number of offenses come under the law of punishment by cutting off from the people, the meaning of which expression has led to some controversy. It may signify excommunication or death, and occurs in connection with the following offenses:<P class="in15">(1) breach of morals, such as willful sin in general (<a onClick="return mV(\'Num\',15,30,31);">Nu 15:30,31</a>); incestuous or unclean connections (<a onClick="return mV(\'Lev\',18,29);">Le 18:29</a>; <a onClick="return mV(\'Lev\',29,\'9-21\');">29:9-21</A>);<P class="in15">(2) breach of covenant, brought about through uncircumcision (<a onClick="return mV(\'Gen\',17,14);">Ge 17:14</a>; <a onClick="return mV(\'Exd\',4,24);">Ex 4:24</a>), neglect of Passover (<a onClick="return mV(\'Num\',9,13);">Nu 9:13</a>), Sabbath-breaking (<a onClick="return mV(\'Exd\',31,14);">Ex 31:14</a>), neglect of Atonement Day (<a onClick="return mV(\'Lev\',23,29);">Le 23:29</a>), work done on the Atonement Day (<a onClick="return mV(\'Lev\',23,30);">Le 23:30</a>), children offered to Molech (<a onClick="return mV(\'Lev\',20,3);">Le 20:3</a>), witchcraft (<a onClick="return mV(\'Lev\',20,6);">Le 20:6</a>), anointing an alien with holy oil (<a onClick="return mV(\'Exd\',30,33);">Ex 30:33</a>);<P class="in15">(3) breach of ritual, committed by eating leavened bread during Passover (<a onClick="return mV(\'Exd\',12,15,19);">Ex 12:15,19</a>), eating fat of sacrifices (<a onClick="return mV(\'Lev\',7,25);">Le 7:25</a>), eating blood (<a onClick="return mV(\'Lev\',7,27);">Le 7:27</a>; <a onClick="return mV(\'Lev\',17,14);">17:14</a>), eating sacrifices while unclean (<a onClick="return mV(\'Lev\',7,20,21);">Le 7:20,21</a>; <a onClick="return mV(\'Lev\',22,3,4,9);">22:3,4,9</a>), offering too late (<a onClick="return mV(\'Lev\',19,8);">Le 19:8</a>), making holy ointment for private use (<a onClick="return mV(\'Exd\',30,32,33);">Ex 30:32,33</a>), making perfume for private use (<a onClick="return mV(\'Exd\',30,38);">Ex 30:38</a>), general neglect of purification (<a onClick="return mV(\'Num\',19,13,20);">Nu 19:13,20</a>), not bringing offering after slaying a beast for food (<a onClick="return mV(\'Lev\',17,9);">Le 17:9</a>), slaying the animal at a place other than the tabernacle door (<a onClick="return mV(\'Lev\',17,4);">Le 17:4</a>), touching holy things illegally (<a onClick="return mV(\'Num\',4,15,18,20);">Nu 4:15,18,20</a>).<P>Of capital punishments that are properly regarded as of Hebrew origin, we note:<P class="in15">(1) Stoning<P class="in15">Stoning, which was the ordinary mode of execution (<a onClick="return mV(\'Exd\',19,13);">Ex 19:13</a>; <a onClick="return mV(\'Lev\',20,27);">Le 20:27</a>; <a onClick="return mV(\'Jos\',7,25);">Jos 7:25</a>; <a onClick="return mV(\'Luk\',20,6);">Lu 20:6</a>; <a onClick="return mV(\'Act\',7,58);">Ac 7:58</a>; <a onClick="return mV(\'Act\',14,5);">14:5</a>). The witnesses, of whom there were at least two, were required to cast the first stone (<a onClick="return mV(\'Deu\',13,9);">De 13:9</a>f; <a onClick="return mV(\'Jhn\',8,7);">Joh 8:7</a>). If these failed to cause death, the bystanders proceeded to complete the sentence, whereupon the body was to be suspended until sunset (<a onClick="return mV(\'Deu\',21,23);">De 21:23</a>).<br><br><P class="in15">(2) Hanging<P class="in15">Hanging is mentioned (<a onClick="return mV(\'Num\',25,4);">Nu 25:4</a>; <a onClick="return mV(\'Deu\',21,22);">De 21:22</a>), probably not as a mode of execution, but rather of exposure after death. It may have been a Canaanitish punishment, since it was practiced by the Gibeonites on the sons of Saul (<a onClick="return mV(\'2Sa\',21,6,9);">2Sa 21:6,9</a>).<br><br><P class="in15">(3) Burning<P class="in15">Burning, before the age of Moses, was the punishment of unchastity (<a onClick="return mV(\'Gen\',38,24);">Ge 38:24</a>). The Law prescribes it as a punishment in the case of a priest\'s daughter (<a onClick="return mV(\'Lev\',21,9);">Le 21:9</a>), and in case of incest (<a onClick="return mV(\'Lev\',20,14);">Le 20:14</a>), but it is also mentioned as following death by other means (<a onClick="return mV(\'Jos\',7,25);">Jos 7:25</a>), and some believe it was never used except after death. That it was sometimes used as a punishment on living persons among the heathen is shown by <a onClick="return mV(\'Dan\',3,\'1-\');">Da 3</a>.<br><br><P class="in15">(4) The Sword or Spear<P class="in15">The sword or spear as an instrument of punishment is named in the Law (<a onClick="return mV(\'Exd\',19,13);">Ex 19:13</a>; <a onClick="return mV(\'Exd\',32,27);">32:27</a>; <a onClick="return mV(\'Num\',25,7);">Nu 25:7</a>). It occurs frequently in monarchic and post-Bab times (<a onClick="return mV(\'Jdg\',9,5);">Jud 9:5</a>; <a onClick="return mV(\'1Sa\',15,33);">1Sa 15:33</a>; <a onClick="return mV(\'2Sa\',20,22);">2Sa 20:22</a>; <a onClick="return mV(\'1Ki\',19,1);">1Ki 19:1</a>; <a onClick="return mV(\'Jer\',26,23);">Jer 26:23</a>; <a onClick="return mV(\'Mat\',14,8,10);">Mt 14:8,10</a>), but among these cases, there are some of assassination rather than of punishment.<br><br><P class="in15">(5) Strangling<P class="in15">Strangling as a form of punishment has no Scripture authority, but according to tradition was frequently employed, and is said to have been performed by immersing the convict in clay or mud, and then strangling him by a cloth tied around the neck.<P>3. Punishments of Foreign Origin: Besides these, which are to be regarded as the ordinary capital punishments, we read of some that were either of foreign introduction or of an irregular kind, such as:<P class="in15">(1) crucifixion (which see);<P class="in15">(2) drowning (<a onClick="return mV(\'Mat\',18,6);">Mt 18:6</a> parallel);<P class="in15">(3) sawing asunder or crushing (<a onClick="return mV(\'2Sa\',12,31);">2Sa 12:31</a>; <a onClick="return mV(\'Hbr\',11,37);">Heb 11:37</a>);<P class="in15">(4) torturing (<a onClick="return mV(\'1Ch\',20,3);">1Ch 20:3</a>; <a onClick="return mV(\'Hbr\',11,35);">Heb 11:35</a>);<P class="in15">(5) precipitation (<a onClick="return mV(\'2Ch\',25,12);">2Ch 25:12</a>; <a onClick="return mV(\'Luk\',4,29);">Lu 4:29</a>);<P class="in15">(6) suffocation (2Macc 13:4-8).<P>The Persians are said to have filled a high tower a great way up with ashes, and then to have thrown the criminal into it, and continually stirred up the ashes by means of a wheel till he was suffocated (Rawlinson, Ancient Monarchy, III, 246).<P>See also <a href="./study/isbe/search.html?string=HEROD">HEROD, II, 100</a>.<P>Secondary forms of punishment not heretofore mentioned are to be noted as follows:<P class="in15">(1) Blinding or Putting Out of Eyes<P class="in15">Blinding or putting out of eyes in the case of captives (<a onClick="return mV(\'Jdg\',16,21);">Jud 16:21</a>; <a onClick="return mV(\'1Sa\',11,2);">1Sa 11:2</a>; <a onClick="return mV(\'2Ki\',25,7);">2Ki 25:7</a>).<br><br><P class="in15">(2) Chaining<P class="in15">Chaining by means of manacles or fetters of copper or iron, similar to our handcuffs fastened on the wrists and ankles and attached to each other by a chain (<a onClick="return mV(\'Jdg\',16,21);">Jud 16:21</a>; <a onClick="return mV(\'2Sa\',3,34);">2Sa 3:34</a>; <a onClick="return mV(\'2Ki\',25,7);">2Ki 25:7</a>); also alluded to in the life of Paul (<a onClick="return mV(\'Act\',28,20);">Ac 28:20</a>; <a onClick="return mV(\'Eph\',6,20);">Eph 6:20</a>; <a onClick="return mV(\'2Ti\',1,16);">2Ti 1:16</a>); and in the case of Peter (<a onClick="return mV(\'Act\',12,6);">Ac 12:6</a>).<br><br><P class="in15">(3) Confiscation of Property<P class="in15">Confiscation of property that had fallen under the ban, i.e. had been singled out for destruction by the special decree of Yahweh, as in <a onClick="return mV(\'Num\',21,2);">Nu 21:2</a>; <a onClick="return mV(\'Jos\',6,17);">Jos 6:17</a>; or had been reserved for the use of the army (<a onClick="return mV(\'Deu\',2,35);">De 2:35</a>; <a onClick="return mV(\'Deu\',20,14);">20:14</a>; <a onClick="return mV(\'Jos\',22,8);">Jos 22:8</a>); or given over to the priesthood (<a onClick="return mV(\'Jos\',6,19);">Jos 6:19</a>). The term may be extended to include all things vowed or sanctified and those irrevocably devoted or consecrated to God (<a onClick="return mV(\'Lev\',27,21,28);">Le 27:21,28</a>). The idea is applied with special emphasis to those things which, because of their uncleanness, must not be used by the Israelites, though, through their warfare with the heathen, they might have come into possession of them (<a onClick="return mV(\'Deu\',7,26);">De 7:26</a>; <a onClick="return mV(\'1Sa\',15,\'16-23\');">1Sa 15:16-23</a>).<br><br><P class="in15">(4) Dashing in Pieces (<a onClick="return mV(\'Psa\',2,9);">Psalms 2:9</a>; <a onClick="return mV(\'Isa\',13,18);">Isaiah 13:18</a>).<br><br><P class="in15">(5) Divine Visitation.<P class="in15">See <a href="./study/isbe/search.html?string=VISITATION">VISITATION</a>.<br><br><P class="in15">(6) Exposure to Wild Beasts (<a onClick="return mV(\'Lev\',26,22);">Leviticus 26:22</a>; <a onClick="return mV(\'1Sa\',17,46);">1 Samuel 17:46</a>; <a onClick="return mV(\'Dan\',6,\'1-\');">Daniel 6</a>).<br><br><P class="in15">(7) Flaying<P class="in15">(Rawlinson, Ancient Monarchy, I, 478; Nineveh and Babylon; mentioned figuratively in <a onClick="return mV(\'Mic\',3,3);">Mic 3:3</a>).<br><br><P class="in15">(8) Forfeiture (<a onClick="return mV(\'Ezr\',10,8);">Ezra 10:8</a>).<br><br><P class="in15">(9) Gallows<P class="in15">Gallows in the modern sense probably were unknown to the ancients. Where the word occurs in <a onClick="return mV(\'Est\',5,14);">Es 5:14</a>; <a onClick="return mV(\'Est\',6,4);">6:4</a>; <a onClick="return mV(\'Est\',7,9,10);">7:9,10</a>; <a onClick="return mV(\'Est\',9,13,15);">9:13,15</a>, it probably refers to a beam or pole on which the body was impaled and then elevated to a height of 50 cubits as an object of warning to the people (see "Hanging").<br><br><P class="in15">(10) Imprisonment<P class="in15">Imprisonment is frequently referred to in both the Old Testament and the New Testament, indicating that this was a common mode of punishment among both the Israelites and other nations (<a onClick="return mV(\'Gen\',40,3);">Ge 40:3</a>; <a onClick="return mV(\'Gen\',42,17);">42:17</a>; <a onClick="return mV(\'Lev\',24,12);">Le 24:12</a>; <a onClick="return mV(\'Num\',15,34);">Nu 15:34</a>; <a onClick="return mV(\'1Ki\',22,27);">1Ki 22:27</a>; <a onClick="return mV(\'Jer\',37,15,21);">Jer 37:15,21</a>; <a onClick="return mV(\'Luk\',3,20);">Lu 3:20</a>; <a onClick="return mV(\'Act\',4,3,10);">Ac 4:3,10</a>; <a onClick="return mV(\'Act\',23,10);">23:10</a>; and the Epistles of Paul).<P class="in15">See <a href="./study/isbe/search.html?string=PRISON">PRISON</a>.<br><br><P class="in15">(11) Indignities.<P class="in15">In this term may be included all those outbursts of vengeance or other evil dispositions that were practiced in times or under circumstances when liberties with the prisoner were permitted on the part of bystanders or those who had charge beyond the execution of the judicial decree. Instances are found in the life of Christ (<a onClick="return mV(\'Mat\',26,59,67);">Mt 26:59,67</a>; <a onClick="return mV(\'Luk\',22,63);">Lu 22:63</a>ff; <a onClick="return mV(\'Jhn\',18,22);">Joh 18:22</a>); also in the life of Paul (<a onClick="return mV(\'Act\',23,2);">Ac 23:2</a>).<br><br><P class="in15">(12) Mutilation (<a onClick="return mV(\'Jdg\',1,6,7);">Judges 1:6,7</a>; <a onClick="return mV(\'Eze\',23,25);">Ezekiel 23:25</a>; 2Maccabees 7).<P class="in15">The Law was opposed to thus treating any Israelite, and Samuel, when referring to the arbitrary power of the future king (<a onClick="return mV(\'1Sa\',8,10);">1Sa 8:10</a>), does not say that he would thus treat "their sons." It was a barbarous custom of the East (see <a href="./study/isbe/search.html?string=EUNUCH">EUNUCH</a>; <a href="./study/isbe/search.html?string=POLYGAMY">POLYGAMY</a>), evidently regarded, among the Hebrews, as a heinous practice (<a onClick="return mV(\'Deu\',23,1);">De 23:1</a>). The only act authorizing mutilation (except in retaliation) is mentioned in <a onClick="return mV(\'Deu\',25,11);">De 25:11</a>.<br><br><P class="in15">(13) Plucking Off the Hair<P class="in15">Plucking off the hair is alluded to as a mode of punishment in <a onClick="return mV(\'Neh\',13,25);">Ne 13:25</a>; <a onClick="return mV(\'Isa\',50,6);">Isa 50:6</a>.<br><br><P class="in15">(14) Prison Garments<P class="in15">Prison garments were in vogue to mark the convicts (<a onClick="return mV(\'Jer\',52,33);">Jer 52:33</a>).<br><br><P class="in15">(15) Restitution<P class="in15">Restitution has been alluded to in the general introduction to this topic.<br><br><P class="in15">(16) Retaliation<P class="in15">Retaliation was recognized by Moses as a principle, but the application of it was left to the judge (<a onClick="return mV(\'Lev\',24,\'19-22\');">Le 24:19-22</a>). A fine example of it is found in the law of <a onClick="return mV(\'Deu\',19,19);">De 19:19</a>.<br><br><P class="in15">(17) Scorpions, Chastising with.<P class="in15">Probably the use of thongs armed with pointed pieces of lead or other metal (<a onClick="return mV(\'1Ki\',12,11);">1Ki 12:11</a>; <a onClick="return mV(\'2Ch\',10,14);">2Ch 10:14</a>).<P class="in15">See <a href="./study/isbe/search.html?string=SCORPIONS">SCORPIONS</a>.<br><br><P class="in15">(18) <A href="./study/isbe/search.html?string=SCOURGE; SCOURGING">Scourging</a>. See separate article.<br><br><P CLASS="IN15">(19) <A href="./study/isbe/search.html?string=SLAVE; SLAVERY">Slavery</a>. See separate article.<br><br><P CLASS="IN15">(20) Stocks. See <a href="./study/isbe/search.html?string=PRISON">PRISON</a>.``77';
isbe[7168]='Punites`pu\'-nits (puni, probably "dark"): Descendants of Puvah, of the tribe of Issachar (<a onClick="return mV(\'Num\',26,23);">Nu 26:23</a>; compare <a onClick="return mV(\'Gen\',46,13);">Ge 46:13</a>; <a onClick="return mV(\'Jdg\',10,1);">Jud 10:1</a>; <a onClick="return mV(\'1Ch\',7,1);">1Ch 7:1</a>).``1';
isbe[7169]='Punon`pu\'-non (punon): A desert camp of the Israelites, the second after leaving Mt. Hor (<a onClick="return mV(\'Num\',33,42,43);">Nu 33:42,43</a>). Eusebius (Onom 299 85; 123 9) mentions an Idumean village, north of Petra, in the desert, where convicts were mining copper, called Phinon or Phainon. These are doubtless identical.`<a href="./study/isbe/search.html?string=WANDERINGS+OF+ISRAEL">WANDERINGS OF ISRAEL</a>`1';
isbe[7170]='Pur`pur (<a onClick="return mV(\'Est\',3,7);">Es 3:7</a>; <a onClick="return mV(\'Est\',9,26);">9:26</a>).`<a href="./study/isbe/search.html?string=PURIM">PURIM</a>`1';
isbe[7171]='Purah`pu\'-ra (purah, "branch"): Gideon\'s "servant," literally, "young man," i.e. armor-bearer (<a onClick="return mV(\'Jdg\',7,10);">Jud 7:10</a>f; the King James Version "Phurah").``1';
isbe[7172]='Purchase`pur\'-chats: In modern English, "to acquire by payment," in Elizabethan English, "to acquire" by any means. In the Old Testament, the King James Version has used "purchase" to represent qanah, and its derivatives (verb and noun), except in <a onClick="return mV(\'Lev\',25,33);">Le 25:33</a>, where the word is ga\'al (the Revised Version (British and American) "redeem"). In the New Testament the noun does not occur and the verb is used for ktaomai, in <a onClick="return mV(\'Act\',1,18);">Ac 1:18</a>; <a onClick="return mV(\'Act\',8,20);">8:20</a>, and peripoieo, in <a onClick="return mV(\'Act\',20,28);">Ac 20:28</a>; <a onClick="return mV(\'1Ti\',3,13);">1Ti 3:13</a>. But none of these words connotes the payment of a price, so that the Revised Version (British and American) has kept the word only in <a onClick="return mV(\'Act\',20,28);">Ac 20:28</a> (margin "acquired"), changing it into "obtain" in <a onClick="return mV(\'Act\',1,18);">Ac 1:18</a>; <a onClick="return mV(\'Act\',8,20);">8:20</a>, and "gain" in <a onClick="return mV(\'1Ti\',3,13);">1Ti 3:13</a>. In the Old Testament, the Revised Version margin has "gotten" in <a onClick="return mV(\'Exd\',15,16);">Ex 15:16</a> and the American Standard Revised Version has (very properly) introduced the same word into the text of <a onClick="return mV(\'Psa\',74,2);">Ps 74:2</a>; <a onClick="return mV(\'Psa\',78,54);">78:54</a>.``48';
isbe[7173]='Pure; Purely; Purity`pur, pur\'-li, pu\'-ri-ti: This group of words has in the Old Testament and the New Testament an almost exclusively ethical significance, though the word "pure" is of course used also in its literal sense of freedom from alloy or other alien matter (<a onClick="return mV(\'Exd\',25,11);">Ex 25:11</a>, etc.). "Pure" in the Old Testament represents many Hebrew words, most frequently Tahor; "purely," occurs once only in the King James Version, as the translation of bor, properly "that which cleanses" (compare <a onClick="return mV(\'Job\',9,30);">Job 9:30</a>, the Revised Version margin "Hebrew \'cleanse my hands with lye,\' " i.e. alkali for soap) in <a onClick="return mV(\'Isa\',1,25);">Isa 1:25</a>, the Revised Version (British and American) "thoroughly (margin "as with lye," the King James Version "purely") purge away thy dross"; "pureness" is the King James Version translation of the same word in <a onClick="return mV(\'Job\',22,30);">Job 22:30</a>, the Revised Version (British and American) "cleanness." In the New Testament "pure" is the translation chiefly of katharos (<a onClick="return mV(\'Mat\',5,8);">Mt 5:8</a>, Blessed are the pure in heart," etc.), but also of hagnos (<a onClick="return mV(\'Phl\',4,8);">Php 4:8</a>; <a onClick="return mV(\'1Ti\',5,22);">1Ti 5:22</a>; <a onClick="return mV(\'Jam\',3,17);">Jas 3:17</a>; <a onClick="return mV(\'1Jo\',3,3);">1Joh 3:3</a>—always in an ethical sense). A different word (eilikrines) is used in <a onClick="return mV(\'2Pe\',3,1);">2Pe 3:1</a>, the Revised Version (British and American) "sincere." "Purity" (hagneia) occurs only in the King James Version in <a onClick="return mV(\'1Ti\',4,12);">1Ti 4:12</a>; <a onClick="return mV(\'1Ti\',5,2);">5:2</a>; in the Revised Version (British and American) in <a onClick="return mV(\'2Cr\',11,3);">2Co 11:3</a> (as the translation of tes hagnotelos).`<a href="./study/isbe/search.html?string=CLEAN">CLEAN</a>; <a href="./study/isbe/search.html?string=PURITY">PURITY</a>`185';
isbe[7174]='Purge`purj: A number of words in both the Old Testament and the New Testament are so rendered in the King James Version and the Revised Version (British and American), although frequently in the Revised Version (British and American) the older English word "purge" is displaced by the more applicable modern terms "cleanse" and "purify," since the emphatic and medical senses of the word, as we now use it, are not justified by some of the Hebrew and Greek originals. In older English the word was broader in meaning, today it is specific. Occurrences in the King James Version, with the changes made in the Revised Version (British and American), are as follows:<P>1. In the Old Testament:<P>(1) Taber, literally, "to be clean," used of the putting-away of idolatry from Judah by Josiah (<a onClick="return mV(\'2Ch\',34,3,8);">2Ch 34:3,8</a>), is translated "purge" in all VSS, but, in <a onClick="return mV(\'Eze\',24,13);">Eze 24:13</a>, the American Standard Revised Version changes to "cleanse."<P>(2) chata\', literally, "to make a sin offering" (<a onClick="return mV(\'Psa\',51,7);">Ps 51:7</a>): is changed without improvement to "purify" in the American Standard Revised Version, while "purge" is retained in the English Revised Version.<P>(3) kaphar, "to cover" or "to make atonement," occurs in <a onClick="return mV(\'Psa\',65,3);">Ps 65:3</a>; <a onClick="return mV(\'Psa\',79,9);">79:9</a>; <a onClick="return mV(\'Eze\',43,20,26);">Eze 43:20,26</a>; in the two passages in Psalms, the Revised Version (British and American) has "forgive" (the "expiate" of the margin is still better), and in Ezekiel the even more accurate "make atonement." In both<P>(4) tsaraph, "to refine" (<a onClick="return mV(\'Isa\',1,25);">Isa 1:25</a>), and<P>(5) duach, literally, "to rinse" (<a onClick="return mV(\'Isa\',4,4);">Isa 4:4</a>), "purge" is well retained in the Revised Version (British and American).<P>(6) barar, literally, "to be shining," the Revised Version (British and American) retains in <a onClick="return mV(\'Eze\',20,38);">Eze 20:38</a>, but in <a onClick="return mV(\'Dan\',11,35);">Da 11:35</a> changes to "purify."<P>(7) zaqaq, "to pour down" as molten metal (<a onClick="return mV(\'Mal\',3,3);">Mal 3:3</a>), also becomes "purify" in the Revised Version (British and American).<P>These occurrences are all in the figurative sense, and apply to sin, uncleanness, idolatry, etc. Most noteworthy is the American Standard Revised Version change of the familiar <a onClick="return mV(\'Psa\',51,7);">Ps 51:7</a>.<P>2. In the New Testament:<P>The Greek words rendered "purge" in the King James Version of the Apocrypha and New Testament are kathairo, and katharizo, and their compounds and derivatives. In all passages except four, the Revised Version (British and American) more properly translates "cleanse" (<a onClick="return mV(\'Mat\',3,12);">Mt 3:12</a>; <a onClick="return mV(\'Mar\',7,19);">Mr 7:19</a>; <a onClick="return mV(\'Luk\',3,17);">Lu 3:17</a>; <a onClick="return mV(\'Jhn\',15,2);">Joh 15:2</a>; <a onClick="return mV(\'Hbr\',9,14,22);">Heb 9:14,22</a>; <a onClick="return mV(\'Hbr\',10,2);">10:2</a>). In <a onClick="return mV(\'Hbr\',1,3);">Heb 1:3</a> "when he had by himself purged our sins" is changed to "had made purification of." But in the case of the verb compounded with the preps. apo and ek, i.e. apokathairo and ekkathairo (<a onClick="return mV(\'Job\',12,9);">Job 12:9</a>; <a onClick="return mV(\'1Cr\',5,7);">1Co 5:7</a>; <a onClick="return mV(\'2Ti\',2,21);">2Ti 2:21</a>), with strong signification to "cleanse out," the Revised Version (British and American) properly retains "purge." Most worthy of note is the change of the familiar verse in John, "Every branch, that beareth fruit, he purgeth" to "Every branch...he cleanseth" (<a onClick="return mV(\'Job\',15,2);">15:2</A>).``109';
isbe[7175]='Purification`pu-ri-fi-ka\'-shun.`<a href="./study/isbe/search.html?string=PURGE">PURGE</a>; <a href="./study/isbe/search.html?string=PURITY">PURITY</a>; <a href="./study/isbe/search.html?string=UNCLEANNESS">UNCLEANNESS</a>`1';
isbe[7176]='Purim; Pur`pur\'-rim, pur (purim, "lots"; Septuagint Phrourai): The name of a Jewish festival celebrated on the 14th and 15th days of the month Adar, the final month of the Biblical year, corresponding to February-March. 1. Scripture References:<P>The origin of the festival is narrated in the Book of Esther, and indeed is the motive of the book, as the time, reason and manner of its celebration are given in detail (<a onClick="return mV(\'Est\',3,7);">Es 3:7</a>; <a onClick="return mV(\'Est\',9,24);">9:24</a>). Reference also is made to it in apocryphal literature (<span class="noTag">Additions to Esther 10:10-13; 2Macc 15:36</span>) and in Josephus (Ant., XI, vi, 13). No reference is made to this feast in the New Testament, as it was celebrated locally, and is therefore not to be connected with any of the festal pilgrimages to Jerusalem. For this reason the supposition of some that the feast of <a onClick="return mV(\'Jhn\',5,1);">Joh 5:1</a> was Purim is to be rejected, mention of it being immediately followed by the words, "And Jesus went up to Jerusalem."<P>2. History of Institution:<P>For the complete account of the institution of Purim reference must be made to the Book of Esther. Only a brief statement is possible here. Haman, son of Hammedatha the <a href="./study/isbe/search.html?string=AGAGITE">AGAGITE</a> (q.v.; compare <a onClick="return mV(\'1Sa\',15,8,32);">1Sa 15:8,32</a>), who had been made prime minister by King Ahasuerus (Xerxes), bitterly hated the Jews, some of whom, as Mordecai, were rising to prominence in the empire. After Queen Vashti had been put away from her royal position for cause (<a onClick="return mV(\'Est\',1,\'9-12\');">Es 1:9-12</a>), a Jewess named Esther, kinswoman and adopted daughter of Mordecai, was chosen to become the royal consort. This only increased the hatred of Haman, who in his jealous fury soon began to seek an opportune day to work his hate upon Mordecai and the whole Jewish people, and therefore resorted to the casting of the lots for the auspicious time: "They cast Pur, that is, the lot, before Haman from day to day, and from month to month, to the twelfth month, which is the month Adar" (<a onClick="return mV(\'Est\',3,7);">3:7</A>). Beginning with the 1st month, all the days and months were tried with unfavorable result, until the last. At Haman\'s request Ahasuerus caused his scribes to send into all the realm on the 13th day of the 1st month a decree that all Jews should be put to death on the 13th day of the 12th month (<a onClick="return mV(\'Est\',3,12);">3:12</A>ff). As the narrative shows, the wisdom of Mordecai, Esther\'s heroism, and fasting and prayer availed to foil the dastardly scheme of Haman, who had already built the gallows on which his hated rival should be hanged. Haman was himself hanged on this gallows, while Mordecai was honored yet more (<a onClick="return mV(\'Est\',7,10);">7:10</A>; <a onClick="return mV(\'Est\',8,1,2);">8:1,2</A>). A second decree was issued on the 23rd day of the 3rd month that on the 13th day of the 12th month (<a onClick="return mV(\'Est\',8,9,12);">8:9,12</A>), the day appointed in the first decree for their extermination, the Jews should gather together and defend themselves against their foes. On that fateful day not only did the Jews successfully resist the malice of their enemies, but the public officials also, seeing that the royal favor was with the Jews, espoused their cause. In Shushan, the royal city, a second day, the 14th, was granted the Jews for vengeance on their foes (<a onClick="return mV(\'Est\',9,\'11-16\');">9:11-16</a>). In view of so great a deliverance "Mordecai wrote these things...unto all the Jews...to enjoin them that they should keep the fourteenth day of the month Adar, and the fifteenth day of the same, yearly, as the days wherein the Jews had rest from their enemies (<a onClick="return mV(\'Est\',9,20,21,22);">9:20-22</A>).<P>3. Manner of Observance:<P>Already as early as the times of the Maccabees (2Macc 15:36), the festival was observed, the 14th day being called "Mordecai\'s day." Josephus refers to it as continuously and widely observed down to his time: "For this cause the Jews still keep the forementioned days, and call them days of Purim" (Ant., XI, vi, 13). In succeeding centuries as the Jews have passed from one civilization or empire to another, so many causes have arisen to remind them of the persecutions of Haman as to make the festival of a triumph over such persecutions both attractive and most significant to them. Experiences in Syria, Egypt, Rome, Russia and elsewhere have not been lacking in suggestion of the original occasion of Purim. The 13th day has been observed by fasting in commemoration of Esther\'s prayer and fasting before she approached the king; in the evening, at the beginning of the 14th day, the Jews repair to the synagogues where the Book of Esther, one of the meghilloth, is read with interpretations, execrations bursting out at the reading of Haman\'s name, accompanied by noise of rattles and stamping of feet, other persecutors and foes also sometimes coming in for a share of execration. The names of Mordecai and Esther receive blessings. On the following morning of the 14th synagogue services are again held, at which, in addition to the repetition of the Esther reading, <a onClick="return mV(\'Exd\',17,\'8-16\');">Ex 17:8-16</a>, which records the destruction of the Amalekites (compare <a onClick="return mV(\'Est\',3,1);">Es 3:1</a>), is also read as the lesson from the Law, presents are given to the poor and to friends, and the rest of the day, as also the 15th, observed with feasting and rejoicing, even excesses being condoned in the exuberance of national spirit.<P>4. Theories of Origin:<P>Many attempts have been made to trace the origin of Purim in pagan or cosmic festivals, but to the present time without success, without approach even to probability. Supposed connections with nature myths, national festivals, polytheistic legends have all found advocates. The word itself has suggested the possibility of identification with words of similar form or sound in other languages. But the ease of finding such similarities for any word casts doubt upon the reliability of any identification.<P>(1) It has been traced to the Assyrian puru, and identified with the Assyrian New Year when officials entered upon their term of service.<P>(2) The Babylonian puhru, new year festival, has also been claimed as the origin of Purim; Mordecai becomes Marduk, Esther is Ishtar, while Haman, Vashti and Zeresh are Median gods.<P>(3) The most popular attempts at identification are in the Persian field, where bahr, "lot," is claimed as the source of Pur, or purdighan, "new year," or farwardighan, the feast of departed souls.<P>(4) Origin also in a Greek bacchanalian occasion has been sought.<P>(5) Others suggest origin in other Jewish experiences than that claimed by the Book of Esther itself, such as a captivity in Edom, or a persecution under the Ptolemies in Egypt, or the victory of Judas Maccabeus over Nicanor in 161 BC (1Macc 7:49).<P>No one of all these theories has sufficient probability to secure for itself anything like general acceptance; the Book of Esther remains as the most reasonable account; the difficulties met in it are not so great as those of the explanations sought in other languages and religions.<P>LITERATURE.<P>Bible dicts., especially HDB, Encyclopedia Biblica and Jewish Encyclopedia; Paton, commentary on "Est" in ICC, particularly pp. 77-94.``109';
isbe[7177]='Purity`pu\'-ri-ti: The Bible bears witness to the long struggle over and in man to secure physical, mental, and moral cleanliness. The various forms of purity have relation to each other.<P>We have a common proverb that "cleanliness is akin to godliness." Cleanliness and aesthetics are certainly nigh neighbors. But cleanliness and ethics do not dwell farther apart. When one realizes that by uncleanness of person or property he may endanger the health or life of family, or even of society about him—as in keeping conditions that develop typhoid fever—he begins to realize that there is, a close tie between cleanliness and morals. "Ought" comes in on the sphere of cleanliness, and then the whole realm of ethics is open. So near are the departments of physical and ethical cleanliness that now if one hears the word "slum" without explanation, he cannot tell whether it relates to filth or sin.<P>The perception of this relationship is of very ancient date. Though it is Isaiah who says (<a onClick="return mV(\'Isa\',52,11);">52:11</A>) "Cleanse yourselves, ye that bear the vessels of Yahweh," and <a onClick="return mV(\'Mar\',7,3,4);">Mr 7:3,4</a>, "All the Jews, except they wash their hands diligently, eat not, holding the tradition of the elders; and when they come from the marketplace, except they bathe themselves, they eat not; and many other things there are, which they have received to hold, washings of cups, and pots, and brasen vessels," yet such statements are but summaries of directions distributed here and there throughout the whole Levitical Law. We can read therein what sounds like the hygienic orders of a general to his soldiers on the march, or like the rules of the board of health to preserve a city from pestilence. And these Levitical directions for cleanliness are connected inseparably with the worship of Yahweh, as though physical purity were to that an essential. The Psalmist blends these two elements, the physical and the ethical, in the familiar question and answer (<a onClick="return mV(\'Psa\',24,\'3-5\');">Ps 24:3-5</a>), "Who shall ascend into the hill of Yahweh? And who shall stand in his holy place? He that hath clean hands, and a pure heart; who hath not lifted up his soul unto falsehood, and hath not sworn deceitfully. He shall receive a blessing from Yahweh, and righteousness from the God of his salvation."<P>The ceremonial cleansings called for by the Law had meaning and influence. They were interpretative of something spiritual—were a parable way of illustrating the necessity of purity of heart in order to gain acceptance with God. If in after-days the thing symbolized was forgotten in the symbol, that was owing to "blindness of mind." The darkness was not necessary.<P>1. The Sex Relation:<P>But the main subject in respect to which we shall in this article seek light on purity from the Bible will not be hygiene or aesthetics, but morals. When we turn to that department we shall at once realize the fact that the sex relation is the most primitive and comprehensive of all the human relations.<P>The Family.<P>The attitude of the Bible in respect to that relation is unmistakable. From the vision of the Garden of Eden to that of the New Jerusalem, the Bible rings true to the ideal of purity in family life and in the relations of the sexes to each other. This is remarkable, for it is a vast history over which its narrative sweeps, and in it every species of literature is represented. It sets forth the acts and views of a people in all the stages of civilization, from wandering nomads to dwellers in cities embellished by architecture and every device of man to set forth riches and splendor. It sets forth their crime, shame and sin, as well as their virtues, but its tone is approbative of the virtues and reprobative of the crime, shame and sin. In the Magna Charta of the Hebrew people—the Ten Commandments—there stands in equal rank with any other principle, "Thou shalt not commit adultery." The sanction of religion and law was thus given to the integrity and purity of family life. The minute regulations against marriage with relatives, and the severe punishments inflicted for disregard of the restrictions (<a onClick="return mV(\'Lev\',18,\'1-\');">Le 18</a> and <a onClick="return mV(\'Lev\',20,\'1-\');">20</A>), were a powerful force in the same direction. The adultery of married persons was to be punished by the death of both the parties (<a onClick="return mV(\'Lev\',20,10);">Le 20:10</a>; <a onClick="return mV(\'Deu\',22,22);">De 22:22</a>).<P>Such laws may sometimes seem severe. Doubtless they are primitive and date from the time of nomadism. In primitive conditions, penalties for infraction of law are to be severe and swift. Pioneers the world over and through time, for very self-preservation\'s sake, could show little favor or tolerance to lawlessness. Be these laws severe, they show the intense earnestness of a people to have a pure family life in which children born should be genuine to it. These Levitical restrictions upon intermarriage with relatives fit the sense of propriety and right of civilized people, even to this day.<P>2. The Prophets:<P>There is no question about the attitude of the prophets on purity. They were in harmony with the Law. They had no tolerance for corrupt morals or manners leading to impurity or suggesting it. An illustration sometimes has the light of the sun in it. What it is that is illustrated is frequently best seen by looking at the illustration itself. The prophets were passionate monotheists. They wanted above all things that Israel should be true to Yahweh and to Him alone. To the prophets, worship of other gods was treason to Yahweh. One prophet after another, and over and over again, illustrates this highest of crimes by infidelity in the marriage relation. That shows in what estimate the family was held. To put any other in the place of Yahweh was "to go a-whoring after other gods," or "to play the harlot." That shows as nothing else could how deep in the heart was sunk regard for pure family life. Infidelity was high treason there, or it never would have furnished language to describe high treason to God.<P>3. The Proverbs:<P><a onClick="return mV(\'Pro\',5,\'1-\');">Pr 5</a> and <a onClick="return mV(\'Pro\',7,\'1-\');">7</a> indicate the attitude of the book on purity. We may let the book make its own case. The wiles of "the strange woman" and the stupid folly and destruction of her victim are specially set forth in the chapters mentioned. In the last chapter of the book we have a portraiture of a "virtuous woman" in whom domesticity in purity has reached a high stage. "Let her own works praise her in the gates."<P>4. The Song of Songs:<P>It is pleasant to turn from the tense severity of law, since it must deal largely with crime and sin, to the idealism of poetry. In the Psalms and the Prophets the relation of husband and wife, of bridegroom and bride, of lover and loved are always treated with tenderness and reverence. Here is familiar Scripture (<a onClick="return mV(\'Psa\',19,\'1-\');">Ps 19</a>): "The heavens declare the glory of God; and the firmament showeth his handiwork....In them hath he set a tabernacle for the sun, which is as a bridegroom coming out of his chamber, and rejoiceth as a strong man to run his course." That does not betray any lack of sympathy with the exuberant spirit of a lover. So <a onClick="return mV(\'Isa\',62,4,5);">Isa 62:4,5</a>: "For Yahweh delighteth in thee, and thy land shall be married. For as a young man marrieth a virgin, so shall thy sons marry thee; and as the bridegroom rejoiceth over the bride, so shall thy God rejoice over thee." Language cannot more clearly disclose delight in the joy of those who are adjusting themselves under the "primal eldest" rule over sex: "Therefore shall a man leave his father and his mother, and shall cleave unto his wife: and they shall be one flesh" (<a onClick="return mV(\'Gen\',2,24);">Ge 2:24</a>).<P>It is sometimes thought strange that the So of Songs should be in the Scripture Canon. But why should there be such doubt? It is but a more particular elaboration of what is boldly brought to notice in the quotations above. There is no more necessity of reading impurity into it than there is of reading it into the quotations above. The poem is illustrative of an experience as widely known as any in the life of the human race—an experience in which sin is no necessity. One must go out of his way who imputes sin to a single act or thought that comes to expression in the poem. The maiden is guileless and the lover is manly. The poem is said to be erotic. But the eros is idealized. It may be sensuous, but it is not sensual. It is not selfish. The passion of each finds expression in careful thoughtfulness for the other. It does not turn back to itself in coarse brute craving of lust for its own self-indulgence. The refrain of the poem is—<P class="in15">"I adjure you, O daughters of Jerusalem<br>That ye stir not up, nor awake my love."—<a onClick="return mV(\'Sgs\',2,7);">So 2:7</a>; <a onClick="return mV(\'Sgs\',3,5);">3:5</a>; <a onClick="return mV(\'Sgs\',8,4);">8:4</a>.<P>The watchfulness is as tender as that for an infant. Where will the law lay its indictment of sin against such thoughts and feelings? The lovers are under the charm that has been and is to be from everlasting to everlasting with the human race upon the earth.<P>Christ at His strictest did not set Himself against the charm of love. He said it should be eternally single and true in spirit. The maiden in the song goes forth in the night, in the simplicity of her heart, to find her beloved (<a onClick="return mV(\'Sgs\',3,2);">So 3:2</a>). In the same simplicity, Evangeline wandered all the night of her life to find the object of her affection. From the same charm in the beginning came the faithfulness of Enoch Arden. Out of the love that springs from purity has come the integrity that has endured to the end. The exuberance of the charm, like every other spring of life and action, needs regulation, but the charm itself is not to be treated as sin.<P>5. Christ and Purity:<P>Paul has said, "Ye are not under law, but under grace" (<a onClick="return mV(\'Rom\',6,14);">Ro 6:14</a>). But that depends upon the conditions to which it is applied. We may not be under the Levitical, ceremonial Law, but we are under the wide realm of ethical law always, even when we are under grace. What grace does is to idealize and spiritualize and make attractive and beautiful what before was perhaps hard, repellent statute and rule. Christ is sometimes thought to have relaxed the severity of "the reign of law." But six times even in the Sermon on the Mount He added to its strictness. Take the idea of the purity of the family as secured by its unity. Under the Mosaic legislation, certain not onerous forms of legal proceeding intervening, the termination of marriage might be said to be optional with the parties. All this liberty is swept away in one sentence: "I say unto you, Whosoever shall put away his wife, except for fornication, and shall marry another, committeth adultery" (<a onClick="return mV(\'Mat\',19,9);">Mt 19:9</a>). That is a law sentence. It was uttered in the realm of law. It was intended to have effect in law. No wonder, considering the liberty that had been allowed in the Law up to that time, that the disciples as soon as they got breath said, "If the case of a man is so with his wife, it is not expedient to marry." They knew that a new law for Christ\'s disciples was put over marriage. Even the exception confirmed His rule. If the exception is not allowed, polyandry or polygamy is established. No other sentence of human speech has done more for the purity of family life (see <a href="./study/isbe/search.html?string=DIVORCE">DIVORCE</a>). But Christ did not stop with the utterance of law protective of purity physically; He went behind all acts and laid down law for the thoughts and intents of the heart: "But I say unto you, that every one that looketh on a woman to lust after her hath committed adultery with her already in his heart" (<a onClick="return mV(\'Mat\',5,28);">Mt 5:28</a>).<P>Sometimes it may be thought that there is a look of moral indifference about the way in which Jesus disposed of the woman\'s case who was taken in adultery (<a onClick="return mV(\'Jhn\',8,\'1-11\');">Joh 8:1-11</a>): "Did no man condemn thee? And she said, No man, Lord. And Jesus said, Neither do I condemn thee; go thy way; from henceforth sin no more." But it must first be remembered that it was not her case but that of her accusers that was immediately before the mind of Jesus. They brought her before Him to trap Him, but He turned and put them on trial. He made their moral condition the main issue. Hers was but an incident. But then, Jesus did not leave her without impressing on her mind that she was a sinner. The last words left ringing in her ears were, "Sin no more." And she was left, as all in sin are left, to wrestle out adjustment with the Holy Spirit who leaves no soul without conviction of "sin, righteousness and judgment." The words of Jesus no more than the words of anyone else can explain all things at once. They can cover a point in view, but much must always be left to the understanding that comes from known experience under the moral government of God.<P>The subsequent psychology of a sinner after the words of Scripture leave him is of deepest interest. Psychological action he must have had; what is it? The question arises, Had the prodigal son completed his repentance till he had asked the forgiveness of his mother and his elder brother? What is the subsequent psychology of a sinner as he disappears from our view? We can interpret here by what we know to be the operations of the Holy Spirit in the soul; just as we know a material object that diappears from view is still under the law of gravitation. Few who have thought on this subject have expressed the truth so well as Whittier in "Our Master," or in "John Underhill" in these words:<P class="in15">"And men took note of his gloomy air<br>The shame in his eye, the halt in his prayer,<br>The signs of a battle lost within,<br>The pain of a soul in the coils of sin.<br>Into the desert alone rode he,<br>Alone with the Infinite Purity;<br>And bowing his soul to its tender rebuke,<br/>As Peter did to the Master\'s look,<br>He measured his path with prayer of pain<br>For peace with God and nature again."<P>There is a recognition of the burning with fire that is infolded in the word "purity."<P>6. Paul:<P>Paul is like his Master. He seeks for purity in this relation after marriage as well as before—purity of mind. In <a onClick="return mV(\'1Cr\',7,\'1-\');">1Co 7</a> we see how carefully and kindly Paul discoursed about all the complications in matters pertaining to sex. Then again, if Paul has exhorted wives to obedience to husbands, he has also called for equal self-surrender on the part of husbands (<a onClick="return mV(\'Eph\',5,\'22-32\');">Eph 5:22-32</a>): "Husbands, love your wives, even as Christ also loved the church, and gave himself up for it." Can there be any self-surrender greater than that which Christ made? Here let attention rest on the fact that in his catalogue of the fruits of the Spirit (<a onClick="return mV(\'Gal\',5,22);">Ga 5:22</a>), if he has put "love" in the first place of emphasis among the nine, he has put "self-control" in the last.<P>We have only space for a glance at a few departments of action and thought to see what the world has gained in purity from the religion of the Bible. The age of chivalry ought to have a word put to its credit. The knights took the vow of chastity before the tribunals of the church. Take art—compare a Venus and a Madonna. Not only spirituality, but even intellectuality is wanting in a Venus. There is not a suggestion in a Venus that does not inhere in flesh and sense. Of what would she or could she speak if she were to open her mouth? To judge from her. appearance, the utterance would be so "flat, stale and unprofitable" that even the charm of her physical beauty would disappear. In the Madonna you scarce see the physical. If she were to speak, her words would picture the peace and calm joy of a heavenly realm. If her countenance is suggestive of something far away, it is of something far above.<P>But art is not dead, and spiritual art did not die with the creation of the Madonna. Take Gaudens\' "Puritan." Compare that with an Apollo. Again we have the contrast there is between a Madonna and a Venus. We have the physical and the aesthetic in an Apollo, but there is not a gleam of the intellectual. That Apollo thinks is not indicated, much less what he might be thinking about. There is not the faintest suggestion of the ethical. There is no intent and purpose in him. But in the Puritan there is intent and purpose. He means much. He is ethical. That determined bearing can only come from a spirit alive with the sense of right. When it comes to that, you will warrant that the Puritan carries more physical guns than the Apollo, and that if they were to clinch in a tug of wrestling Apollo would fall underneath. That ethical intent and purpose is masterly. You may look through a whole pantheon of Greek gods and meet not a trace of the force concentrated in the Puritan. He is forceful because right makes might. He is in the majority because he knows Who is with him. He is conscious of power because he has subdued the kingdom within. He has won the greatest of all victories—self-control.``22';
isbe[7178]='Purloining`pur-loin\'-ing: Lit. "for far off," hence, to carry away or steal; the word is the translation of nosphizomai, "to take away for oneself," "to secrete," "to steal," a word appropriate to those in the position of slaves in a master\'s service (<a onClick="return mV(\'Tts\',2,10);">Tit 2:10</a>, "not purloining").``1';
isbe[7179]='Purple`pur\'-p\'-l (\'argaman; Chaldaic \'argewan (<a onClick="return mV(\'2Ch\',2,7);">2Ch 2:7</a>); compare Arabic \'urjuwan, and Persian \'arghawan; porphura, porphureos Septuagint and New Testament)):<P>Purple dye was manufactured by the Phoenicians from a marine mollusk, Murex trunculus. The shell was broken in order to give access to a small gland which was removed and crushed. The crushed gland gives a milky fluid that becomes red or purple on exposure to the air. Piles of these broken shells still remain on the coast at Sidon and Tyre. The purple gland is found in various species of Murex and also of Purpura.<P>Purple cloth was used in the furnishings of the tabernacle (<a onClick="return mV(\'Exd\',25,4);">Ex 25:4</a>, etc.) and of Solomon\'s temple (<a onClick="return mV(\'2Ch\',2,14);">2Ch 2:14</a>; <a onClick="return mV(\'2Ch\',3,14);">3:14</a>); in the palanquin of Solomon (<a onClick="return mV(\'Sgs\',3,10);">So 3:10</a>); and in the hangings of the palace of Ahasuerus (<a onClick="return mV(\'Est\',1,6);">Es 1:6</a>). The kings of Midian had purple raiment (<a onClick="return mV(\'Jdg\',8,26);">Jud 8:26</a>); the worthy woman of <a onClick="return mV(\'Pro\',31,22);">Pr 31:22</a> has clothing of fine linen and purple. Mordecai was clothed with purple by Ahasuerus (<a onClick="return mV(\'Est\',8,15);">Es 8:15</a>); Jesus by the Roman soldiers (<a onClick="return mV(\'Mar\',15,17,20);">Mr 15:17,20</a>; <a onClick="return mV(\'Jhn\',19,2,5);">Joh 19:2,5</a>). The rich man of <a onClick="return mV(\'Luk\',16,19);">Lu 16:19</a> and the scarlet woman of <a onClick="return mV(\'Rev\',18,12,16);">Re 18:12,16</a> were arrayed in purple. In <a onClick="return mV(\'Sgs\',7,5);">So 7:5</a> the bride has hair like purple. Purple is in the merchandise of Babylon (<a onClick="return mV(\'Rev\',18,12);">Re 18:12</a>). It is surprising that Ezekiel speaks of the Tyrians as obtaining purple from the isles of Elisha (<a onClick="return mV(\'Eze\',27,7);">Eze 27:7</a>) and from Syria (<a onClick="return mV(\'Eze\',27,16);">Eze 27:16</a>).`<a href="./study/isbe/search.html?string=COLORS">COLORS</a>; <a href="./study/isbe/search.html?string=DYE,+DYEING">DYE, DYEING</a>`37';
isbe[7180]='Purpose, of God`pur\'-pus (prothesis (<a onClick="return mV(\'Rom\',9,11);">Ro 9:11</a>; <a onClick="return mV(\'Eph\',1,11);">Eph 1:11</a>)): The word "purpose" seems to be an equivalent of the word "decree" as used in regard to man\'s relation to eternity. More correctly stated, it softens the word "decree" and refers back to the cause of the decree as lodged in an intelligent design and forward to an aim consistent with the character of God.`<a href="./study/isbe/search.html?string=FOREORDAIN">FOREORDAIN</a>; <a href="./study/isbe/search.html?string=PREDESTINATION">PREDESTINATION</a>`1';
