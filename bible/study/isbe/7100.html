isbe[7155]='Psychology`si-kol\'-o-ji:<P>1. Introduction: Scope of Biblical Psychology<P>2. Nature and Origin of the Soul<P>3. False Theories<P>4. Creationism and Traducianism<P>5. Trichotomy<P>6. Scriptural Terms<P>7. Pauline Expressions<P>8. Monism and Other Theories<P>9. The Fall of Man<P>10. Effects of the Fall<P>11. Death as a Problem<P>12. Immortality of the Soul<P>LITERATURE<hr /><P>1. Introduction: Scope of Biblical Psychology:<P>The extravagant claims made by some writers for a fully developed system of Biblical psychology has brought the whole subject into disrepute. So much so, that Hofmann (Schriftbeweis) has boldly asserted that "a system of Biblical psychology has been got together without any justification for it in Scripture." At the outset, therefore, it must be borne in mind that the Bible does not present us with a systematized philosophy of man, but gives in popular form an account of human nature in all its various relationships. A reverent study of Scripture will undoubtedly lead to the recognition of a well-defined system of psychology, on which the whole scheme of redemption is based. Great truths regarding human nature are presupposed in and accepted by the Old Testament and the New Testament; stress is there laid on other aspects of truth, unknown to writers outside of revelation, and presented to us, not in the language of the schools, but in that of practical life. Man is there described as fallen and degraded, but intended by God to be raised, redeemed, renewed. From this point of view Biblical psychology must be studied, and our aim should be "to bring out the views of Scripture regarding the nature, the life and life-destinies of the soul, as they are determined in the history of salvation" (Delitzsch, Biblical Psychology, 15).<P>2. Nature and Origin of the Soul:<P>As to the origin of the soul, Scripture is silent. It states very clearly that life was inbreathed into man by God (wayyippah; Septuagint enephusesen; Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) inspiravit). The human being thus inspired by God was thereby constituted a nephesh chayyah ("living soul"), because the nishmath chayyim ("breath of lives") had been imparted to him (<a onClick="return mV(\'Gen\',2,7);">Ge 2:7</a>). Beyond this the first book of the Bible does not go. In later books the doctrine is taught with equal clearness. Thus, in the Book of Job: "The Spirit of God hath made me, and the breath of the Almighty giveth me life" (<a onClick="return mV(\'Job\',33,4);">Job 33:4</a>). The difference in expression should be carefully noted. The "living soul" Septuagint psuche zosa) is made to depend upon, as it has its origin in, the "breath of lives" the Septuagint pnoe zoes). The neshamah ("breath") is characteristic of man—though it is very rarely, if ever, attributed to animals; man is described as a being \'in whose nostrils is but a breath\' (neshamah) (<a onClick="return mV(\'Isa\',2,22);">Isa 2:22</a>). That "breath" is \'God\'s breath in man\' (<a onClick="return mV(\'Job\',32,8);">Job 32:8</a>; <a onClick="return mV(\'Job\',34,14);">34:14</a>), or, as it is represented in <a onClick="return mV(\'Pro\',20,27);">Pr 20:27</a>, "The spirit of man (nishmath) is the lamp of Yahweh." In the New Testament Paul evidently refers to this view of man\'s origin in the statement that "the first man Adam became a living soul. The last Adam...a life-giving (quickening) spirit" (<a onClick="return mV(\'1Cr\',15,45);">1Co 15:45</a>). This too agrees with what Christ has said: "It is the spirit, that giveth life (quickeneth)" (<a onClick="return mV(\'Jhn\',6,63);">Joh 6:63</a>), and with what Paul himself has stated elsewhere in the Epistle to the Romans (<a onClick="return mV(\'Rom\',8,2);">8:2</a>): "The Spirit of life in Christ Jesus made me free from the law of sin and of death."<P>3. False Theories:<P>Scripture therefore repudiates all doctrines of emanation, by which is meant a natural, forth-flowing life from God into the human sphere; it teaches a doctrine of creation, whereby it declares that the Almighty acts with deliberation and design, in free choice, and not of necessity. "Let us make man" is the sublime utterance of divine wisdom and power. Nor does Scripture teach the pre-existence of the soul—a doctrine found in the extra-canonical, platonically-inspired Book of Wisdom (Wisd 8:19,20), For I was a child of parts, and a good soul fell to my lot; nay rather, being good, I came into a body undefiled." This doctrine was well known to Jewish writers, and was taught in Talmud and Kabbalah.<P>"All souls were, according to the Talmud, created and kept in secret from the first moment of creation. As creatures of the highest sphere they are omniscient; but at the moment of birth in a human body an angel touches the lips of the child, so that he forgets whatever has been" (Emanuel Deutsch, The Talmud). The doctrine, however, must be a later importation into Jewish theology through Plato and Philo. It reminds us of Vergil (AEneid vi.713), who makes the souls—destined by the Fates to inhabit new bodies on earth—drink of the waters of Lethe (forgetfulness), so as to remove all remembrance of the joys of Elysium:<P>"The souls that throng the flood,<P>Are those to whom by Fate are other bodies owed;<P>In Lethe\'s lake they long oblivion taste<P>Of future life secure, forgetful of the past."<P>According to the Kabbalah, souls are supposed to have an ideal as well as a real pre-existence: "ideal as emanations from the cephiroth, which are themselves emanations from the infinite real, as having been \'created\' at a definite time" (compare Eric Bischoff, De Kabbala).<P>The doctrine with some modifications passed into the Christian church, was accepted by Justin Martyr, Theodoretus, Origen and others of the church Fathers, but became obsolete by the latter part of the 4th century (compare Shedd, History of Christian Doctrine, II, 9). It was formally condemned by a synod held at Constantinople in the 6th century. In later times it was accepted in modified form by Kant, Schelling and others, and was specially defended by Julius Muller, who held that the soul had a timeless preexistence and underwent a fall before the final act, whereby it was united in time to the body as its temporary home (Ein ausserzeitlicher Urzustand und Urfall). Reference is sometimes made to <a onClick="return mV(\'Jer\',1,5);">Jer 1:5</a>, where Yahweh addresses His servant: "Before I formed thee in the belly I knew thee; and before thou camest forth out of the womb I sanctified thee; I have appointed thee a prophet unto the nations." But this text gives no warrant to the doctrine as taught by the writers mentioned. All that may be conceded is, what Delitzsch has termed "an ideal pre-existence," i.e. "a pre-existence, not only of man as such, but also of the individual and of all: a preexistence in the divine knowledge, which precedes the existence in the individual consciousness" (Biblical Psychology, 46).<P>4. Creationism and Traducianism:<P>A new question arises at this point, namely, Is the soul a special creation? Is it derived from the parents? Opinions are and have been divided on this point. Many have supported theory of Creationism, by which is meant that in every instance where a new individual comes into being a soul is specially created by God, de nihilo, to inhabit the new-formed body. This view of the soul\'s birth found great favor in the early church. It was dominant in the East and was advocated in the West. "Jerome asserts that God quotidie fabricatur animas, and cites Scripture in proof" (Shedd, op. cit., II, 11). Scholastic theologians in the Middle Ages, Roman Catholic divines, Reformed orthodoxy upheld theory. Though finding little support in Scripture, they appealed to such texts as the following: "He fashioneth their hearts alike" (<a onClick="return mV(\'Psa\',33,15);">Ps 33:15</a> the King James Version); Yahweh "formeth the spirit of man within him" (<a onClick="return mV(\'Zec\',12,1);">Zec 12:1</a>); "The spirit returneth unto God who gave it" (<a onClick="return mV(\'Ecc\',12,7);">Ec 12:7</a>; compare <a onClick="return mV(\'Num\',16,22);">Nu 16:22</a>; <a onClick="return mV(\'Hbr\',12,9);">Heb 12:9</a>); "God, the God of the spirits of all flesh" (<a onClick="return mV(\'Num\',27,16);">Nu 27:16</a>)—of which Delitzsch declared: "There can hardly be a more classical proof-text for creationism" (Bibl. Psych., 137).<P>Traducianism again has found equal support in the Christian church. It declared that the parents were responsible, not merely for the bodies, but also for the souls of their offspring—per traducem vel per propaginem (i.e. by direct derivation, in the ordinary way of propagation). Tertullian was a strong supporter of this view: "The soul of man, like the shoot of a tree, is drawn out (deducta) into a physical progeny from Adam, the parent stock" (Shedd, History of Doctrine, II, 14). Jerome remarked that in his day it was adopted by maxima pars occidentalium ("the large majority of western theologians"). Leo the Great (died 461) asserted that "the Catholic faith teaches that every man with reference to the substance of his soul as well as of his body is formed in the womb" (Shedd). Augustine, however, though doctrinally inclined to support the claims of Traducianists, kept an open mind on the subject: "You may blame, if you will, my hesitation," he wrote, "because I do not venture to affirm or deny that of which I am ignorant." And, perhaps, this is the safest attitude to assume; for there is little Scriptural warrant for either theory. Birth is a mystery which baffles investigation, and Scripture throws no light upon that mystery. Yet some who have discussed this subject have tried actually to calculate the very day on which the soul is created or infused into the body, as it is being formed in the mother\'s womb—in boys on the 40th day after pregnancy and in girls on the 80th day. This indeed is the reductio ad absurdum of Creationism.<P>Whichever theory we accept, the difficulties are great either way. For if God creates a soul, that soul must be pure and sinless and stainless at birth. How then can it be said that man is "conceived" as well as "born in sin"? If the impure, sin-stained body contaminates the pure, unstained soul by contact, why cannot the stainless soul disinfect the contaminated body? And again, if every individual soul is a special creation by direct interposition of the Almighty, what becomes of the unity and solidarity of the race? Is its connection with Adam then purely one of physical or corporeal generation? Creationism cannot account for the birth of the soul. Nor can Traducianism. For it can account neither for the origin, nor for the hereditary taint of the soul. It lands us in a hopeless dilemma. In the one case we fall back upon Creationism with its difficulties; in the other, we plunge into a materialism which is equally fatal to theory (compare Bavinck, Gereformeerde Dogmatiek, II, 626). Perhaps the words of Petrus Lombardus, though frequently misunderstood and misapplied, throw most light on the subject—a light, however, which is little more than "darkness visible"—creando infundit eas Deus, et infundendo creat ("in creating God infused (the soul); and in infusing He creates"). The problem is and remains insoluble.<P>Passing allusion may be made to another very curious theory, to which reference is made by Martensen (Christliche Ethik, I, 107). It bears upon human individuality, as impressed not only upon the soul, but also upon the body. The soul and the body are represented as arising at the same moment, but the latter (not in regard to its physico-chemical composition, but in other respects) is the resultant of soul-influences, whatever these may be. The soul therefore exercises a formative influence upon the body, with which it is united. This theory is attributed by Martensen to G.E. Stahl, who died in Berlin in 1734, as physician to the royal family. We are here in a region where the way is barred—"a palpable obscure" without the light of day.<P>5. Trichotomy:<P>The next important question which has occupied many minds is equally difficult of solution—theory of Tripartition. Is man composed of "body" and "soul" (dichotomy) only, or is a third to be added to the two, so that "spirit" is another element in the constitution of human nature (trichotomy)? Either theory is supposed to be supported by Scripture, and both have had their defenders in all ages of the church. Where the tripartite division has found favor, soul and spirit have been distinguished from each other, as man\'s lower is distinguished from his higher nature; where dichotomy prevailed, soul and spirit were represented as manifestations of the same spiritual essence. Under the influence of Platonic philosophy, trichotomy found favor in the early church, but was discredited on account of the Apollinarian heresy. The threefold division of human nature into soma ("body"), psuche ("soul"), pneuma ("spirit") had been accepted by many when Apollinaris, bishop of Laodicea (died 382), attempted to explain the mystery of Christ\'s person by teaching that the Logos (or second person of the Trinity) had taken the place of the rational soul in Christ, so that the person of Christ on earth consisted of the Divine Logos, a human body, and a soul (psuche) as the link between the two.<P>For the tripartite division of human nature two texts are specially brought into the discussion: namely, <a onClick="return mV(\'1Th\',5,23);">1Th 5:23</a>, "May your spirit and soul and body be preserved entire, without blame"—a text which is popularly interpreted as conveying that "soul" stands for "our powers natural—those we have by nature," and that by "spirit" is meant "that life in man which in his natural state can scarcely be said to exist at all, but which is to be called out into power and vitality by regeneration" (F.W. Robertson, Sermons). There is very little warrant in Scripture for such interpretation. "The language does not require a distinction of organs or substances, but may be accounted for by a vivid conception of one substance in different relations and under different aspects. The two terms are used to give exhaustive expression to the whole being and nature of man" (Davidson, Old Testament Theology, 135). There is evidently no distinction of essence here—namely, of a soul distinct from the spirit, and a body distinct from either. In his "fervid desire for the complete and perfect sanctification of his disciples, the apostle accumulates these terms" in order to emphasize the doctrine of an entire renewal of the whole man by the working of the Holy Spirit. It has been pointed out (A. Kuyper, Het werk v. d. Heiligen Geest, III, 101)—and this must be carefully borne in mind—that "the apostle does not use the word holomereis, \'in all your parts,\' and then summarize these parts in body, soul and spirit, but holoteleis, a word that has no reference to the parts, but to the telos, the end or aim. Calvin interprets \'soul\' and \'spirit\' here as referring to our rational and moral existence, as thinking, willing beings, both modes of operation of the one, undivided soul."<P>The next text to which an appeal is made is <a onClick="return mV(\'Hbr\',4,12);">Heb 4:12</a>: "The word of God is living, and active, and sharper than any two-edged sword, and piercing even to the dividing of soul and spirit, of both joints and marrow, and quick to discern the thoughts and intents of the heart." Here spirit, soul and heart are brought into close correspondence, with heart evidently as the center of personality, manifesting itself in soul and spirit. The only question is, whether the dividing which takes place by the piercing word of God is one within the soul and spirit, causing a complete exposure of the inner man, a cutting asunder of all that composes his nature, or one between the soul and spirit, causing a division between them as separate parts of human nature. The probability lies with the first of these two contradictory views. The writer evidently meant that, as a sharp two-edged sword pierces to the very marrow in its sundering process, so the sword of the spirit cuts through all obstacles, pierces the very heart, lays bare what hitherto was hidden to all observers, even to the man himself, and "discerns" the "thoughts and intents," which in the unity of soul and spirit have hitherto been kept in the background. "The meaning is rather, that the word of God pierces and dissects both the soul and spirit, separates each into its parts, subtle though they may be, and analyzes their thoughts and intents" (Davidson, op, cit., 187). At any rate, to found a doctrine of Trichotomy on an isolated, variously interpreted text is dangerous in the extreme. The language of metaphor is not the language of literal speech; and here evidently we are in the region of metaphor.<P>The ground is now cleared for a fuller investigation of the meaning of these terms:<P>6. Scriptural Terms:<P>(1) The terms are used inter changeably, though they are not synonymous. Lebhabh ("heart"), nephesh ("soul"), ruach ("spirit") are very closely connected in the Old Testament. The heart is there represented as "the organ, the spirit as the principle, the soul as the subject of life" (Cremer, Lexicon). Hence, we read that "out of it (the heart) are the issues of life" (<a onClick="return mV(\'Pro\',4,23);">Pr 4:23</a>). Dying is represented as the surrender of soul (<a onClick="return mV(\'Gen\',35,18);">Ge 35:18</a>; <a onClick="return mV(\'Job\',11,20);">Job 11:20</a>), but also of spirit (<a onClick="return mV(\'Psa\',31,5);">Ps 31:5</a>; <a onClick="return mV(\'Psa\',146,4);">146:4</a>). The dead are called souls (<a onClick="return mV(\'Rev\',6,9);">Re 6:9</a>; <a onClick="return mV(\'Rev\',20,4);">20:4</a>), and also spirits (<a onClick="return mV(\'Hbr\',12,23);">Heb 12:23</a>; <a onClick="return mV(\'1Pe\',3,19);">1Pe 3:19</a>). In the last mentioned text the "spirits in prison" are also called "souls." The living are described as "disturbed" or "grieved" in soul (<a onClick="return mV(\'Jdg\',10,16);">Jud 10:16</a>), "vexed" (<a onClick="return mV(\'Jdg\',16,16);">Jud 16:16</a>), "discouraged" (<a onClick="return mV(\'Num\',21,4);">Nu 21:4</a>), "weary" (<a onClick="return mV(\'Zec\',11,8);">Zec 11:8</a>); but also as in "anguish of spirit" (<a onClick="return mV(\'Exd\',6,9);">Ex 6:9</a>), "impatient in spirit" (<a onClick="return mV(\'Job\',21,4);">Job 21:4</a>, in the Hebrew), \'straitened in spirit\' (<a onClick="return mV(\'Mic\',2,7);">Mic 2:7</a>). At death the "spirit" departs (<a onClick="return mV(\'Psa\',146,4);">Ps 146:4</a>, in the Hebrew), but also the "soul" (<a onClick="return mV(\'Gen\',35,18);">Ge 35:18</a>). As in the Old Testament so in the New Testament, our Lord "sighed" or "was troubled in the spirit" (<a onClick="return mV(\'Jhn\',13,21);">Joh 13:21</a>)?, but we also read that His soul was "exceeding sorrowful," or troubled (<a onClick="return mV(\'Mat\',26,38);">Mt 26:38</a>; <a onClick="return mV(\'Jhn\',12,27);">Joh 12:27</a>).<P>See <a href="./study/isbe/search.html?string=SPIRIT">SPIRIT</a>; <a href="./study/isbe/search.html?string=SOUL">SOUL</a>; <a href="./study/isbe/search.html?string=HEART">HEART</a>. (2) And yet there is a distinction, whatever the real nature of it may be. In Mary\'s Magnificat, e.g., we find the two combined in an interesting manner: "My soul doth magnify the Lord, and my spirit hath rejoiced in God my Saviour" (<a onClick="return mV(\'Luk\',1,46,47);">Lu 1:46,47</a>), the one clause "referring to the personal emotions of Mary, to her feelings as a woman and a mother, all of which find an outlet in adoration," the second clause "appearing to indicate the moment when, in the profoundest depths of her being, by the touch of the divine spirit, the promise of the angel was accomplished in her" (Godet, in the place cited.). A like contrast meets us in the story of Gethsemane. The Master was \'exceeding sorrowful in soul\' (i.e. the emotional, sensitive center of His being was in deep sorrow), the disciples were \'willing in spirit,\' but \'weak in the flesh\' (<a onClick="return mV(\'Mat\',26,38,41);">Mt 26:38,41</a>). In the Old Testament we find that when a man dies his "soul" departs, and when he is restored to life his "soul" returns (<a onClick="return mV(\'1Ki\',17,22);">1Ki 17:22</a>); but when consciousness or lifepower returns to one not dead, "spirit" is used (<a onClick="return mV(\'Gen\',45,27);">Ge 45:27</a>; <a onClick="return mV(\'Jdg\',15,19);">Jud 15:19</a>; <a onClick="return mV(\'1Sa\',30,12);">1Sa 30:12</a>; <a onClick="return mV(\'1Ki\',10,5);">1Ki 10:5</a>). Even in popular language the distinction is recognized: we speak of so many "souls," not "spirits," as having perished.<P>(3) From all this it would appear that philosophic distinction or scientific accuracy of expression is not met with in Scripture. Man is there represented as a unity, and the various terms employed to indicate that unity in its diversity of activities or passivities do not necessarily imply the existence of different essences, or of separate organs, through which these are realized. Psychical action is sometimes ascribed to the body, as well as to the soul, for soul and body are inseparably united to each other. It is the possession of a soul which makes the body what it is; and on the other hand, a soul without a body is unthinkable. The resurrection of the body therefore is no mere figment of the creeds. The body is God\'s work (<a onClick="return mV(\'Job\',10,8);">Job 10:8</a>), inseparable from the life of the soul. In the New Testament it is spoken of as "the house on earth" (epigeios oikia), the "tabernacle" or tent prepared for the occupant (skenos) (<a onClick="return mV(\'1Cr\',12,18);">1Co 12:18</a>; <a onClick="return mV(\'2Cr\',4,7);">2Co 4:7</a>; <a onClick="return mV(\'2Cr\',5,1);">5:1</a>). In the Old Testament "we have such metaphorical expressions as \'houses of clay\'; or, as in post-Biblical writings, \'earthly tabernacle.\' In the latest, we have words which suggest a hollow, a framework, or a sheath, favoring the Greek idea of the body as the husk or clothing of the soul" (Laidlaw). Hence, in Scripture, spirit and soul are interchangeably used with body for human nature in general, not as though indicating three separate entities, but as denoting a parallelism which brings out the full personality of man. Soul and body are threatened with destruction (<a onClick="return mV(\'Mat\',10,28);">Mt 10:28</a>); body without spirit is a corpse (<a onClick="return mV(\'Jam\',2,26);">Jas 2:26</a>); soul and spirit are interchangeably united: "Stand fast in one spirit, with one soul striving," etc. (<a onClick="return mV(\'Phl\',1,27);">Php 1:27</a>).<P>(4) Gathering all together, the Scriptural position seems to be as follows: The Divine Spirit is the source of all life, and its power is communicated in the physical, intellectual and moral sphere. That Spirit, as the spiritus spirans, the inspiring spirit, by its very breath makes man a living soul: "The spirit (or breath) of God is in my nostrils" (<a onClick="return mV(\'Job\',27,3);">Job 27:3</a>); "Thou takest away their breath (ruach, "spirit"], they die, and return to their dust" (<a onClick="return mV(\'Psa\',104,29);">Ps 104:29</a>). Hence, God is called "God of the spirits of all flesh" (<a onClick="return mV(\'Num\',16,22);">Nu 16:22</a>; <a onClick="return mV(\'Num\',27,16);">27:16</a>). Soul, though identical with spirit, has shades of meaning which spirit has not; it stands for the individual. "Man is spirit, because he is dependent upon God. Man is soul, because, unlike the angels, he has a body, which links him to earth. He is animal as possessing anima, but he is a reasoning animal, which distinguishes him from the brute" (Bavinck, German Dogm., II, 628).<P>(5) In this connection stress may be laid upon some of Paul\'s expressions. He exhorts the Philippians to "stand fast in one spirit (pneuma), with one soul (psuche) striving for the faith" (<a onClick="return mV(\'Phl\',1,27);">Php 1:27</a>).<P>7. Pauline Expressions:<P>He exhorts them to be "of the same mind" (sumpsuchoi, <a onClick="return mV(\'Phl\',2,2);">Php 2:2</a>); he hopes to be "of good comfort" (eupsucho, <a onClick="return mV(\'Phl\',2,19);">Php 2:19</a>); he knows of \'no man likeminded, (isopsuchon), who (would) care truly for (their) state (<a onClick="return mV(\'Phl\',2,20);">Php 2:20</a>). Everywhere therefore we have "soul" in various combinations to indicate the mental attitude, which in the "fellowship of the Spirit" he would assume toward his readers, and his readers would adopt toward himself. There cannot be therefore that subtle distinction which men have found in the terms "spirit" and "soul," as though two separate essences were housed in one body. The text in Job (<a onClick="return mV(\'Eze\',33,4);">33:4</a>), "The Spirit of God hath made me, and the breath of the Almighty giveth me life," is the key to the whole problem. The spiritus spirans becomes the spiritus spiratus—the inspiring spirit becomes in man the life which is expired, outbreathed by man, in both soul and spirit. "Soul," therefore, may well stand for the personal, living, animated being—the suffering, acting, thinking, reasoning, dying creature, "whose breath is in his nostrils." Christ gave His \'soul\' (psuche) for His sheep (<a onClick="return mV(\'Jhn\',10,11);">Joh 10:11</a>). On the cross He Himself exclaimed: "Into thy hands I commend my spirit" (pneuma) (<a onClick="return mV(\'Luk\',23,46);">Lu 23:46</a>). Spirit may therefore indicate the all-embracing power, guiding the inward and the outward life—principium illud internum ex quo fluunt actiones, is Bengel\'s comment on <a onClick="return mV(\'Eph\',2,2);">Eph 2:2</a> (compare <a onClick="return mV(\'Luk\',9,55);">Lu 9:55</a> the King James Version; <a onClick="return mV(\'Luk\',4,36);">Lu 4:36</a>). Hence, by an easy gradation it may stand for the abysmal depths of personality; while "soul" would express man\'s individuality in general.<P>See <a href="./study/isbe/search.html?string=SOUL">SOUL</a>; <a href="./study/isbe/search.html?string=SPIRIT">SPIRIT</a>.<P>Pauline phraseology has somewhat confused the issue; at any rate, new meanings, not obvious to the reader, have been assigned to various terms. Paul contrasts the psychical and the pneumatic, the man under the influence of the divine pneuma, and the man as influenced by his own psuche. The psychical man is man in his natural, unregenerate state, psychical in this connection being almost equivalent to carnal; while the pneumatic man would be the man guided and directed by the Spirit from on high. Nature and grace are contrasted in the two terms as the first and second Adam are contrasted in <a onClick="return mV(\'1Cr\',15,45);">1Co 15:45</a>—the first Adam being described as a living psuche ("soul"), the second as a life-giving pneuma ("spirit"). Even so the psychical body is the body intended, fitted to bear the psuche, while the pneumatic body is evidently the body capable of bearing the pneuma. Hence, the one is corruptible and weak, the other incorruptible and full of power. The soul confined to the carnal body uses it as an organ, till it falls into decay and no longer lends itself to such use. The spirit, in constant fellowship with the Divine Spirit, communicates its energy to a body fitted to be the bearer of this renewed life, spiritualizes that organ, makes that body its docile instrument, enables the body to fulfill its wishes and thoughts, with inexhaustible power of action, "as we even now see the artist using his voice or his hand with marvelous freedom and thus foreshadowing the perfect spiritualizing of the body."<P>8. Monism and Other Theories:<P>Other questions call for discussion here: they may be briefly touched upon. Scripture acknowledges a dualism, which recognizes the separate existence of Soul and body. It rejects a monism, which makes man but "a doublefaced unity" (Bain); or considers mind and body as equally unreal, and as "aspects," "appearances," "sides" of one and the same reality (scientific monism). It knows nothing of mere idealism, which makes mind the only reality, of which matter is but a manifestation, nor of materialism, which considers matter as that which alone is substantial, while mind is a mere product of the brain (Haeckel). It does not support theory of harmonia praestabilita—pre-established harmony, whereby<P>"Our birth is but a sleep and a forgetting,"<P>because soul and body were united in harmonious action before the individual was called into active being, body and soul acting in harmony after creation like two clocks accurately regulated, pointing to the same hour on the dial plate, though driven by different springs (Leibnitz). Scripture has no theory. It deals with facts and facts only in so far as they bear upon the history of man\'s sin and man\'s redemption. It throws no light on many problems raised by science or philosophy. It does not discuss origins—the origin of evil, of matter, of mind. "All is of God" is the Scriptural answer to many questions. Thus, the relation of mind to body is and remains a mystery—as great as the relation between the forces in Nature, to which the names of light and electricity have been given. Science has attempted to explain that mystery and has failed. The words of Shenstone (Cornhill Magazine, 1907) may be applied to all psychical problems, outside of Holy Writ, which by him were applied to those scientific questions which remain unanswered in spite of all our efforts at solution: "We are still very far from knowing definitely that atoms are composed entirely of electrons or that electrons are nothing else than electric charges; and though electrons have been shown to exhibit electric inertia, it has not been proved that the inertia of atoms also is electrical." The mystery of matter is great; that of soul is greater still.<P>9. The Fall of Man:<P>The next question which falls to be discussed is the influence of the fall of man upon his soul. Scripture is clear upon the point. Man\'s fall from a primeval state of innocence is there told in unambiguous terms, though the word itself is not found in the narrative, except perhaps in <a onClick="return mV(\'Rom\',11,11,12);">Ro 11:11,12</a>, where allusion is made to the fall (paraptoma) of Israel. With the origin of evil Scripture apparently does not concern itself, though it clearly states that man\'s sinful condition stands in direct connection with the transgression of Adam, as in <a onClick="return mV(\'Rom\',5,12);">Ro 5:12</a>, where the introduction of sin (hamartia) into the world (kosmos) is spoken of as the act of one man (s.c. Adam), hamartia being evidently taken as a power of evil working in the world of men. The Old Testament allusion in <a onClick="return mV(\'Hsa\',6,7);">Ho 6:7</a> can hardly be referred to Adam\'s transgression; at any rate the reference is doubtful. the King James Version renders the passage: "They like men have transgressed the covenant," though the revisers have translated: "But they like Adam have transgressed the covenant." The German and Dutch versions give the same interpretation to the verse: "like Adam." The Septuagint takes the term as an appellative (hos anthropos, "as man"), but the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) refers the transgression to Adam (sicut Adam transgressi sunt). The other allusions in the Old Testament to this event are slight, as in <a onClick="return mV(\'Job\',31,33);">Job 31:33</a>; <a onClick="return mV(\'Eze\',28,13,15);">Eze 28:13,15</a>. In the New Testament, however, the references are much more frequent, especially in the writings of John and of Paul (compare <a onClick="return mV(\'Jhn\',8,44);">Joh 8:44</a>; <a onClick="return mV(\'1Jo\',3,8);">1Joh 3:8</a>; <a onClick="return mV(\'2Cr\',11,3);">2Co 11:3</a>; <a onClick="return mV(\'1Ti\',2,14);">1Ti 2:14</a>). The strong parallelism between Adam and Christ in <a onClick="return mV(\'Rom\',5,\'12-21\');">Ro 5:12-21</a>, the obedience of the one bringing freedom, while that of the other brought woe, and the contrast in <a onClick="return mV(\'1Cr\',15,22);">1Co 15:22</a> between Adam and Christ throw sufficient light on the question at issue.<P>Modern science, under the influence of the evolutionary hypothesis, has eliminated or at least has attempted to eliminate the factor of the Fall. That "fall" has been interpreted as a "rise," the "descent" is supposed to have been a real "ascent." Far down the ages, millenniums ago, "a miserable, half-starved, naked wretch, just emerged from the bestial condition, torn with fierce passions, and fighting his way among his compeers with low-browed cunning" (Orr, Christian View of God, 180) must have emerged somehow out of darkness into light. "We are no longer," says Professor J. A. Thomson, "as those who look back to a paradise in which man fell; we are as those \'who, rowing hard against the stream, see distant gates of Eden gleam, and do not dream it is a dream\'" (Bible of Nature, 226). If science definitely teaches that man has arisen by slow, insensible gradations from the brute, and no further word may be said on the subject, then indeed the problem of human sin is utterly inexplicable. There can then be no agreement between the Biblical conception and the evolutionary theory as so presented. For primitive man\'s transgression would under such circumstances be but the natural expression of brute passion, to which the name of sin in the Christian sense can hardly be applied. But if for "minute" and "insensible" gradations in the evolutionary process be substituted the "mutations," "leaps" or "lifts," to which an increasing number of evolutionists are appealing; if primitive man be not pictured as a semi-animal, subject to brutish impulse and passion; if with man a new start was made, a "lift" occurred in the process of development under the guiding and directing influence of Almighty power, the problem assumes a different shape. A sinless creature, transgressing the moral law, is then not an unscientific assumption; conscience asserting itself as the voice divine within the human soul is then not only possible, but actual and real, in the history of man\'s earliest progenitors. The Biblical narrative will after all remain as the most reasonable explanation of man\'s original condition and his terrible fall. In that narrative will be found enshrined the "shadowing tradition" of a real, historic event, which has influenced the human race through all the ages. Professor Driver, writing under the strong influence of the evolutionary theory, and accepting as "the law stamped upon the entire range of organic nature, progress, gradual advance from lower to higher, from the less perfect to the more perfect," has wisely remarked that "man failed in the trial to which he was exposed, that sin has entered into the world...and that through the whole course of the race it has been attended by an element of moral disorder, and thus it has been marred, perverted, impeded or drawn back" (Driver, Genesis, 57).<P>See <a href="./study/isbe/search.html?string=FALL,+THE">FALL, THE</a>.<P>10. Effects of the Fall:<P>An equally serious question arises as to the effects of the fall of man. Shame, corruption, death is the answer given by the Old Testament and New Testament. "In the day that thou eatest thereof thou shalt surely die" (<a onClick="return mV(\'Gen\',2,17);">Ge 2:17</a>) was the judgment pronounced upon man. By this was evidently meant "death" as a physical and as a spiritual fact. Man was doomed. The posse non mori, which according to older theologians was man\'s privilege, was lost and was succeeded by a punishment of which the non posse non mori was the doom, i.e. the possibility of immortal life was followed by the impossibility of not suffering death. Not as though immortality was absolutely lost; for with sin came decay, degeneration, death, not of the inbreathed spirit, but of the body into which the soul was breathed by God. But even the body is imperishable. It undergoes change, but not extinction. The resurrection-body has become a possibility through the atonement and resurrection of Christ. The tabernacle is removed, but renewed. The body is not a prison house, but a temple; not an adjunct but an integral part of the human being. The Bible teaches not only a resurrection-body, but a transformed body (<a onClick="return mV(\'Rom\',12,1);">Ro 12:1</a>). It speaks not only of a soul to be saved, but of a body to be redeemed. Scripture alone accounts for death and explains it.<P>11. Death as a Problem:<P>With modern evolutionists death is an unsolved problem. Weissmann (Essays on Heredity) maintains on the one hand that "death is not an essential attitude of matter" (p. 159), and on the other, "it is only from the point of view of utility that we can understand the necessity of death" (p. 23), and again "death is to be looked upon as an occurrence which is advantageous to the species as a concession to the outer conditions of life, and not as an absolute necessity, essentially inherent in life." He even speaks of "the immortality of the protozoa," because "an immense number of the lower organisms" are not subject to death (ibid., 26). Death therefore according to him has been "acquired secondarily as an adaptation," and must in a certain sense be unnatural. It is indeed "one of the most difficult problems in the whole range of physiology." If this be so, we may safely turn to Scripture for an explanation of the problem, which has a value peculiarly its own. "By man came death" is the authoritative declaration, because by man came sin. "In Adam all die," because through Adam came sin. Here we may safely leave the problem, because "by man" will come "resurrection from the dead."<P>See <a href="./study/isbe/search.html?string=DEATH">DEATH</a>.<P>12. Immortality of the Soul:<P>But if the body is mortal, is the soul immortal? On this point the New Testament gives no uncertain sound, and though the doctrine be not as clearly expressed in the Old Testament, yet even there kinship with God is man\'s guaranty for everlasting communion with Him (compare <a onClick="return mV(\'Psa\',73,\'1-\');">Ps 73</a>). Job longed for such fellowship, which to him and to the Old Testament saints before and after him was life. In memorable words he gave utterance to the hope which was in him: \'I know that my Redeemer liveth...and after my skin (read "body")...has been destroyed, yet from my flesh shall I see God; whom I shall see for myself, and mine eyes shall behold and not another\' (<a onClick="return mV(\'Job\',19,25);">Job 19:25</a>). Hosea, the mourner, is responsible for that sublime utterance, which in its New Testament form is recited at the graveside of those who die in the Lord: "I will ransom them from the power of Sheol; I will redeem them from death: O death, where are thy plagues? O Sheol, where is thy destruction?" (<a onClick="return mV(\'Hsa\',13,14);">Ho 13:14</a>). Reference may also be made to the words of Isaiah (<a onClick="return mV(\'Isa\',26,19);">26:19</a>): "Thy dead shall live; my dead bodies shall arise. Awake and sing, ye that dwell in the dust." Still clearer is the note sounded by Daniel (<a onClick="return mV(\'Dan\',12,2,3);">12:2,3</a>): "Many of them that sleep in the dust of the earth shall awake, some to everlasting life, and some to shame and everlasting contempt. And they that are wise shall shine as the brightness of the firmament; and they that turn many to righteousness as the stars forever and ever." In one word, the Old Testament saint based all his hope and fellowship on God. That hope strengthened his soul when he shuddered at the darkness of Sheol. "It overleaps Sheol in the vigor of his faith." In the Psalms we find the same hope expressed on almost every page: "As for me, I shall behold thy face in righteousness; I shall be satisfied, when I awake, with beholding thy form" (the King James Version "with thy likeness," <a onClick="return mV(\'Psa\',17,15);">Ps 17:15</a>); and again: "Thou wilt not leave my soul to Sheol; neither wilt thou suffer thy holy one to see corruption....In thy presence is fullness of joy; in thy right hand there are pleasures for evermore" (<a onClick="return mV(\'Psa\',16,10,11);">Ps 16:10,11</a>). Whatever the ultimate verdict of science may be regarding the "utility" of death in regard to the human race, Scripture considers it abnormal, unnatural, a punishment, an infliction, the result of man\'s wrongdoing and his transgression of the law of God. But death in Holy Writ is not a hopeless separation of body and soul. The New Testament sounds a note even clearer than the Old Testament; for Christ has brought "life and immortality to light." "We know," says Paul, "that we have a building from God," after the dissolution of our tabernacle (<a onClick="return mV(\'2Cr\',5,1);">2Co 5:1</a>); and that is but the necessary corollary to Christ\'s great utterance: "I AM THE RESURRECTION, AND THE LIFE" (<a onClick="return mV(\'Jhn\',11,25);">Joh 11:25</a>).<P>LITERATURE.<P>Beck, Umriss der biblischen Seelenlehre, English translation; Hofmann, Schriftbeweis; Delitzsch, System of Biblical Psychology; Oehler, Old Testament Theology; Wendt, Die Begriffe Fleisch u. Geist, etc.; Dickson, Paul\'s Use of the Flesh and Spirit; Cremer, Bibl.-theol. Worterbuch, etc.; Herzog, RE, articles "Geist" and "Seele"; Laid-law, Bible Doctrine of Man; Orr, God\'s Image in Man; Davidson, Old Testament Theology.``113';
isbe[7156]='Ptolemais`tol-e-ma\'-is (Ptolemais): Same as "Acco" in <a onClick="return mV(\'Jdg\',1,31);">Jud 1:31</a>. Ptolemais was the most prominent town on the Phoenician seacoast in Maccabean times (1Macc 5:15,55; 10:1,58,60; 12:48), and is once mentioned in the New Testament in <a onClick="return mV(\'Act\',21,7);">Ac 21:7</a> as a seaport at which Paul landed for one day, visiting the "brethren" in the place.`<a href="./study/isbe/search.html?string=ACCO">ACCO</a>; <a href="./study/isbe/search.html?string=PHOENICIA">PHOENICIA</a>`1';
isbe[7157]='Ptolemy`tol\'-e-mi (Ptolemaios, but usually called Ptolemy—"the Warlike"): The name Ptolemy is rather common from the days of Alexander the Great, but is best known as the dynastic name of the 13 (14) Macedonian kings of Egypt (323-43 BC) (as Pharaoh in the Old Testament). Those of interest to the Biblical student are:<P>(1) Ptolemy I, surnamed Soter, (Soter, "Savior"), called also Ptolemy Lagi, was born circa 366 BC, the son of Lagus and Arsinoe, a concubine of Philip of Macedon. He was prominent among the officers of Alexander the Great, whom he accompanied in his eastern campaigns. On the death of Alexander, Ptolemy seized the satrapy of Egypt as his share (1Macc 1:6ff). Now commenced the long hostilities between Egypt and Syria, Ptolemy on more than one occasion invading Syria. In 316 he joined in a war against Antigonus during which Coele-Syria and Phoenicia were lost, but in 312 regained from Demetrius the son of Antigonus. It was most probably in this year (312) that Ptolemy captured Jerusalem on a Sabbath day (Josephus, Ant, XII, i, 1), and by force or persuasion induced many Jews to accompany him to Egypt as colonists or mercenaries. His kind treatment of them induced others to leave Syria for Egypt. In 306 Ptolemy was defeated in the great naval fight off Salamis in Cyprus by which Cyprus was lost to Egypt. About this date Ptolemy assumed the title of "king," following the example of the Syrian ruler. In 305-304 he defended the Rhodians against Demetrius Poliorcetes, forcing the latter to raise the siege—hence, the title "Savior." In 285 BC Ptolemy abdicated in favor of his youngest son Philadelphus—the son of his favorite wife Berenice—and died in 283 BC. According to the usual interpretation this Philadelphus is "the king of the south" in <a onClick="return mV(\'Dan\',11,5);">Da 11:5</a>. This Ptolemy shares with his son and successor the honor of rounding the famous Alexandrian Museum and Library.<P>(2) Ptolemy II, surnamed Philadelphus (Philadelphos, "Brother(sister?)-loving"), the youngest son of Ptolemy I; born 309 BC in Cos; succeeded his father in 285 BC and died 247. Like his father, he was actively engaged in two Syrian wars until peace was made about 250 BC, Berenice, the daughter of Philadelphus, being given in marriage to Antiochus II. This Ptolemy planted numerous colonies in Egypt, Syria and Palestine, among which were several of the name of Arsinoe (his sister-wife), Philadelphia on the ruins of old Rabbah, Philotera south of the Sea of Galilee, and Ptolemais on the site of Acco. He devoted great attention to the internal administration of his kingdom, endowed the Museum and Alexandrian Library in which his father had taken much interest; in general he followed his father\'s example as a liberal patron of art, science and literature. According to one tradition it was Philadelphus who was instrumental in starting the Septuagint translation (see <a href="./study/isbe/search.html?string=SEPTUAGINT">SEPTUAGINT</a>). At any rate, he was favorably disposed toward his Jewish subjects, and in his reign Jewish wisdom and Greek philosophy began to blend. Philadelphus is supposed to be "the king of the south" of <a onClick="return mV(\'Dan\',11,6);">Da 11:6</a>, whose daughter "shall come to the king of the north to make an agreement."<P>(3) Ptolemy III, surnamed Euergetes (Euergetes, "Benefactor"), son of Philadelphus, whom he succeeded in 247 BC. In 246 he was provoked to a Syrian war to avenge the murder of his sister Berenice at Antioch; in the course of this campaign he met with remarkable success, overran Syria, plundered Susa and Babylonia, penetrated to the shores of India and captured the important stronghold of Seleucia (1Macc 11:8). Euergetes was, however, prevented from reaping the fruits of his victories by being recalled by internal troubles in Egypt. He brought back with him from the East the Egyptian gods that Cambyses had carried away 300 years before, thus earning from the Egyptians the title of "Benefactor." Two traditions obtain as to his death: the more probable is that of Polybius (ii.71), according to which he died a natural death (222 BC), or, according to another (Justin xxix.1), he was murdered by his son. Some regard this king as the Euergetes mentioned in the Prologue to Sir, but the reference must rather be to Euergetes II (Ptolemy VII). The "shoot" who "shall enter into the fortress of the king of the north" and prevail is Euergetes I (<a onClick="return mV(\'Dan\',11,\'7-9\');">Da 11:7-9</a>), <a onClick="return mV(\'Dan\',11,8);">Da 11:8</a> referring to the act by which he won his title.<P>(4) Ptolemy IV, surnamed Philopator (Philopator, "Lover of his father"), or Tryphon (Truphon), the eldest son of Euergetes whom he succeeded in 222 BC. Antiochus the Great of Syria declared war against Egypt about 219 BC, but, after conquering Coele-Syria and Phoenicia, he was defeated by Philopator at the battle of Raphia near Gaza (217 BC). On his victorious return to Alexandria, Philopator assumed a very anti-Jewish attitude, and indeed caused discontent generally among his subjects. In spite of the victory of Raphia, Egypt began to decline under his weakness. He was as dissolute as Nero, while his domestic tragedies are as dark as those of Herod the Great. He died in 205 BC. <a onClick="return mV(\'Dan\',11,\'10-12\');">Da 11:10-12</a> refers to the reign of Philopator. He was most probably the oppressor of 3Macc.<P>(5) Ptolemy V, surnamed Epiphanes (Epiphanes, "Illustrious"). He was only 5 years old when his father Philopator died. Taking advantage of the king\'s minority, Antiochus the Great leagued with Philip of Macedon against Egypt. Philip took the Cyclades and some cities in Thrace, while Antiochus defeated the Egyptian general Scopas at Paneas on the Jordan in 198 BC, and thus Palestine passed to the Seleucid dynasty. The Romans now interfered to make Antiochus surrender his conquests. Not daring to disobey Rome, Antiochus compromised by making peace with Ptolemy and betrothing to him his daughter Cleopatra, who was to receive as her dower the revenues of the conquered provinces Coele-Syria, Palestine and Phoenicia (Josephus, Ant, XII, iv, 1; Polyb. xxviii.17), but the control of these provinces seems to have been retained by Antiochus. The marriage took place in 193 BC. After the dismissal of his faithful minister, Aristomenes, Epiphanes\' character and reign deteriorated. At last he bestirred himself to recover the lost provinces from Seleucus, the successor of Antiochus, but was poisoned before his plans materialized, in 182 (181) BC (Josephus, Ant, XII, iv, 11). <a onClick="return mV(\'Dan\',11,\'14-17\');">Da 11:14-17</a> is to be interpreted as referring to the relations between Ptolemy V and Antiochus III, "the Great."<P>(6) Ptolemy VI, surnamed Philometor (Philometor, "Fond of his mother"), eider son of Ptolemy V whom he succeeded in 182 (181) BC. For the first 7 years of his reign his mother Cleopatra acted as queen-regent, and peace was maintained with Syria till 173 BC. Antiochus IV Epiphanes then invaded Egypt, defeated the Egyptians at Pelusium and secured the person of Philometor, whom he spared, hoping to employ him as a tool to gain the ascendancy over Egypt. Philometor\'s brother was now proclaimed king by the Alexandrians, with the title of Euergetes (II). When Antiochus retired, Philometor made peace with his brother, conceding him a share in the government (170 BC). This displeased Antiochus, who marched against Alexandria, but was stopped beneath the walls by a Roman embassy (168 BC), in obedience to which he withdrew. The brothers quarreled again, and Philometor, expelled by Euergetes, went to Rome to seek assistance (164 BC). The Romans seated him again on his throne, assigning Cyrenaica to Euergetes. The next, quarrel was about Cyprus. Philometor this time secured his brother as a prisoner, but sent him back to his province. Philometor was later drawn into Syrian politics in the conflict between Alexander Balas and Demetrius. The Egyptian king espoused the cause of the former, to whom he also betrothed his daughter Cleopatra. But on discovering Balas\' treachery, he took away his daughter from him and gave her to his opponent, Demetrius Nikator, whom he now supported against Balas. Balas was defeated in a decisive battle on the Oenoparas and killed, but Ptolemy himself died in 146 BC from the effects of a fall from his horse in the battle (1Macc 1:18; 10:51ff; 2Macc 1:10; 4:21). <a onClick="return mV(\'Dan\',11,\'25-30\');">Da 11:25-30</a> refers to the events of this reign. Philometor seems to have taken a friendly attitude toward the Jews. In his reign the Jewish temple of Leontopolis near Hellopolis was founded in 154 BC (Josephus, Ant, XIII, iii, 1f), and two Jewish generals, Onias and Dositheus, were at the head of his armies and had a large share in the government (Josephus, Apion II, 5). The Jewish-Alexandrine philosopher Aristobulus probably lived in this reign.<P>(7) (On the death of Philometor his young son was proclaimed king as Ptolemy Eupator ("of a noble father"), but after reigning but a few months was put to death by his uncle Euergetes II (Just. xxxviii.8). His reign being so brief he need hardly be numbered among the Ptolemies.)<P>(8) Ptolemy VII (VIII), surnamed Euergetes (II) and called also Physcon (Phuskon, "Big-paunch"), became sole ruler in succession to his brother Philometor (or to his murdered nephew) in 146 BC, and reigned till 117 BC. His reign was characterized by cruelty, tyranny and vice, so that he was hated by his subjects, especially by the people of Alexandria, who on one occasion expelled him during an insurrection. It is uncertain whether Physcon was an enemy and persecutor of the Jews or their patron. Some authorities refer the persecutions mentioned in 3Maccabees to this reign, but most modern authorities are disposed to date them in the reign of the anti-Jewish Ptolemy IV Philopator. The statement, "in the 38th year of King Euergetes," in the Prologue to Sirach refers to Physcon Euergetes II and = 132 BC, since he dated his reign from the year of joint kingship with his brother (170 BC).<P>The other Ptolemies of Egypt require no mention here.<P>The following are the apocryphal Ptolemies:<P class="in15">(1) Ptolemy Macron. See <a href="./study/isbe/search.html?string=MACRON">MACRON</a>.<P class="in15">(2) Ptolemy, son of Abubus, son-in-law of Simon the Maccabee. He treacherously assassinated Simon and two of his sons in the stronghold of Dok near Jericho, 135 BC (1Macc 16:15).<P class="in15">(3) Ptolemy, the father of Lysimachus (Apocrypha) (<span class="noTag">Additions to Esther 11:1</span>).<P class="in15">(4) Ptolemy, son of a Dositheus; he and his father were bearers of the "epistle of Phrurai" (<span class="noTag">Additions to Esther 11:1</span>).<P>LITERATURE.<P>J. P. Mahaffy, Empire of the Ptolemies, is the best account for English readers. A long list of Ptolemies will be found, e.g. in Smith\'s Classical Dictionary. The ancient authorities are Josephus, Polybius, Justin, Pausanias, Plutarch (Cleom.), Livy, Diodorus, Jerome (Commentary to <a onClick="return mV(\'Dan\',11,1);">Da 11</a>).``5';
isbe[7158]='Puah; Puvah`pu\'-a, pu\'-va: (1) pu\'ah: One of the Hebrew midwives whom the king of Egypt commanded to kill all male children of the Hebrews at birth. The midwives, fearing God, refused to obey, pretending that the children of the Hebrew women were usually born before they arrived. Their act is spoken of as being meritorious in the eyes of the Lord, who is said to have rewarded them by making "houses" for them (<a onClick="return mV(\'Exd\',1,\'15-20\');">Ex 1:15-20</a>). In the Midrash, Ex Rabba\', Puah is identified with Miriam, and Shiphrah, the other midwife, with her mother Jochebed. According to another tradition Puah was a proselyte.<P>(2) pu\'ah, in <a onClick="return mV(\'1Ch\',7,1);">1Ch 7:1</a>; puwwah, in <a onClick="return mV(\'Gen\',46,13);">Ge 46:13</a>; <a onClick="return mV(\'Num\',26,23);">Nu 26:23</a>; written also "Pua" the King James Version, and "Puvah" Revised Version: Second son of Issachar, ancestor of the Punites, enumerated in the desert census taken by Moses and Eleazar.<P>(3) pu\'ah: Member of the tribe of Issachar, mentioned (<a onClick="return mV(\'Jdg\',10,1);">Jud 10:1</a>) as the son of Dodo and the father of Tola, the judge.``80';

isbe[7160]='Publius`pub\'-li-us (Poplios, from the Latin praenomen Publius, derived from populus, "popular"; according to Ramsay it is the Greek form of the Latin nomen Popilius; the Greek title meaning "first," applied to Publius in <a onClick="return mV(\'Act\',28,7);">Ac 28:7</a>, was an official one, and has been found on an inscription from the island of Gaulus near Malta (compare Bockh, Corpus Inscriptionum Graecarum, <span class="noTag">number 5</span>, 754)): Publius held office under the governor of Sicily. As the leading official in Malta, he was responsible for any Roman soldiers and their prisoners who might land there, but the account in <a onClick="return mV(\'Act\',28,7);">Ac 28:7</a> implies that he displayed more than ordinary solicitude for Paul and his shipwrecked company, for, according to the writer, he "received us, and lodged us three days courteously" (the King James Version). The Apocryphal "Ac of Paul" (see <a href="./study/isbe/search.html?string=APOCRYPHAL+ACTS">APOCRYPHAL ACTS</a>, sec. B, I) states also that "he did for them many acts of great kindness and charity" (compare Budge, Centendings of the Apostles, II, 605). On this occasion Paul miraculously healed the father of Publius, who "lay sick of fever and dysentery" (<a onClick="return mV(\'Act\',28,8);">Ac 28:8</a>). The exactitude of the medical terms here employed forms part of the evidence that the writer of Acts was a physician. Tradition relates that Publius was the first bishop of Malta and that he afterward became bishop of Athens.``88';
isbe[7160]='Publius`pub\'-li-us (Poplios, from the Latin praenomen Publius, derived from populus, "popular"; according to Ramsay it is the Greek form of the Latin nomen Popilius; the Greek title meaning "first," applied to Publius in <a onClick="return mV(\'Act\',28,7);">Ac 28:7</a>, was an official one, and has been found on an inscription from the island of Gaulus near Malta (compare Bockh, Corpus Inscriptionum Graecarum, <span class="noTag">number 5</span>, 754)): Publius held office under the governor of Sicily. As the leading official in Malta, he was responsible for any Roman soldiers and their prisoners who might land there, but the account in <a onClick="return mV(\'Act\',28,7);">Ac 28:7</a> implies that he displayed more than ordinary solicitude for Paul and his shipwrecked company, for, according to the writer, he "received us, and lodged us three days courteously" (the King James Version). The Apocryphal "Ac of Paul" (see <a href="./study/isbe/search.html?string=APOCRYPHAL+ACTS">APOCRYPHAL ACTS</a>, sec. B, I) states also that "he did for them many acts of great kindness and charity" (compare Budge, Centendings of the Apostles, II, 605). On this occasion Paul miraculously healed the father of Publius, who "lay sick of fever and dysentery" (<a onClick="return mV(\'Act\',28,8);">Ac 28:8</a>). The exactitude of the medical terms here employed forms part of the evidence that the writer of Acts was a physician. Tradition relates that Publius was the first bishop of Malta and that he afterward became bishop of Athens.``88';
isbe[7161]='Pudens`pu\'-denz, pu\'-dens (Poudes, literally, "bashful" (<a onClick="return mV(\'2Ti\',4,21);">2Ti 4:21</a>)):<P>1. Faithful to Paul:<P>One of the Christians in Rome who remained loyal to Paul during his second and last imprisonment there, when most of the members of the church "forsook him." The pressure under which they acted must have been very great, as the apostle\'s final trial before the supreme court of the empire followed quickly after the Neronic persecution. Their defection from their loyalty to Paul must not be taken as implying that they had also proved untrue to Christ. At this time, however, there were some of the Christians who risked their earthly all, and their lives too, in order to prove their adherence to Paul, and Pudens was one of these.<P>2. Pudens and Claudia:<P>Writing the last of all his letters, the Second Epistle to Timothy, Paul sends greeting from "all the brethren" who were then with him. Among these he names Pudens. There are three other names associated by the apostle with that of Pudens: Eubulus, Linus and Claudia. There is an interesting conjecture regarding Pudens and Claudia, that their were husband and wife, and that Claudia was of British birth, a daughter of a British king, called Cogidunus. King Cogidunus was an ally of the Romans, and assumed the name of the emperor Tiberius Claudius, who was his patron. In this way his daughter would be named Claudia. But this identification of the British princess with the Claudia who sends salutation to Timothy is only a supposition; it lacks both evidence and proof.<P>See <a href="./study/isbe/search.html?string=CLAUDIA">CLAUDIA</a> and Code of Hammurabi (St. P), chapter xxvii.<P>In modern Rome, however, the tourist is still shown a building which is called the house of Pudens, in the same way as "Paul\'s hired house" is also shown. The authenticity in both cases is lacking.<P>Pudens is not mentioned elsewhere in the New Testament.``155';

isbe[7164]='Pulpit`pool\'-pit: <a onClick="return mV(\'Neh\',8,4);">Ne 8:4</a>, "Ezra the scribe stood upon a mighdol of wood." Mighdol is one of the commonest words in the Old Testament and means simply a high object—here a scaffolding or platform (bema, 1Esdras 9:42). "Tower" (so the Revised Version margin) gives an entirely wrong picture.``1';
isbe[7165]='Pulse`puls (zero\'-im (<a onClick="return mV(\'Dan\',1,12);">Da 1:12</a> margin, "herbs"), zere\'onim (<a onClick="return mV(\'Dan\',1,16);">Da 1:16</a>); compare zerua\', "sowing seed" (<a onClick="return mV(\'Lev\',11,37);">Le 11:37</a>), and zeru\'im, "things sown" (<a onClick="return mV(\'Isa\',61,11);">Isa 61:11</a>)):<P>(1) In <a onClick="return mV(\'Dan\',1,12,16);">Da 1:12,16</a>, it must mean herbs or vegetables grown from seeds; a vegetable diet is what is implied.<P>(2) In <a onClick="return mV(\'2Sa\',17,28);">2Sa 17:28</a>, "pulse" after "parched" is not in the original, but is probably more correct than the translation in (1), as "pulse" usually implies leguminous plants, peas, beans, etc.``1';
isbe[7166]='Punishment, Everlasting`pun\'-ish-ment:<P><b>I. PRELIMINARY ASSUMPTIONS</b><P class="in15">1. Survival after Death<P class="in15">2. Retribution for Sin<P class="in15">3. Conscious Suffering in Future<P><b>II. SCRIPTURAL SUPPORT</b><P class="in15">1. Old Testament and Jewish Conceptions<P class="in15">2. New Testament Teaching<P class="in30">(1) "Eternal"<P class="in30">(2) Equivalent Expressions<P class="in30">(3) The Last Judgment<P class="in15">3. Teaching of Analogy<P><b>III. DIFFICULTIES AND OBJECTIONS—RIVAL HYPOTHESES</b><P class="in15">1. Universal Salvation<P class="in15">2. Annihilation<P class="in15">3. Second Probation<P><b>IV. NATURE, CONDITIONS AND ISSUES</b><P class="in15">1. Mystery of the Future<P class="in15">2. Nature of Punishment<P class="in15">3. Range of Divine Mercy<P class="in15">4. Gradation of Punishment<P class="in15">5. God "All in All"<P><b>LITERATURE</b><hr /><P>I. Preliminary Assumptions.<P>(For "everlasting," where used in the King James Version as the rendering of aionios, the Revised Version (British and American) substitutes "eternal.") It is assumed in this article that Scripture teaches the survival of the soul after death, the reality of retribution and of judgment to come, and a shorter or longer period of suffering for sin in the case of the unredeemed in the world beyond. Only a few words need be said, therefore, in preliminary remark on these assumptions.<P>1. Survival after Death:<P>Whatever view may be taken of the development of the doctrine of immortality in the Old Testament (see <a href="./study/isbe/search.html?string=ESCHATOLOGY+OF+THE+OLD+TESTAMENT">ESCHATOLOGY OF THE OLD TESTAMENT</a>), it will scarcely be doubted that it is throughout assumed in the New Testament that the souls of men, good and bad, survive death (see <a href="./study/isbe/search.html?string=IMMORTALITY">IMMORTALITY</a>). Two passages only need be referred to in proof: one, Christ\'s saying in <a onClick="return mV(\'Mat\',10,28);">Mt 10:28</a>: "Be not afraid of them that kill the body, but are not able to kill the soul; but rather fear him who is able to destroy both soul and body in hell" (Gehenna); the other, the parable of the Rich Man and Lazarus in <a onClick="return mV(\'Luk\',16,\'19-31\');">Lu 16:19-31</a>: Lazarus is carried by the angels to Abraham\'s bosom; the rich man lifts up his eyes in Hades, being in torments. The whole doctrine of the future judgment in the New Testament presupposes survival after death.<P>2. Retribution for Sin:<P>Retribution for sin is a cardinal point in the teaching of both the Old Testament and New Testament. The doctrine of judgment, again, in the New Testament, with Christ as judge, turns on this point. The following passages are decisive: <a onClick="return mV(\'Isa\',3,10,11);">Isa 3:10,11</a>; <a onClick="return mV(\'Mat\',11,22,24);">Mt 11:22,24</a>; <a onClick="return mV(\'Mat\',12,41,42);">12:41,42</a>; <a onClick="return mV(\'Rom\',2,5,12);">Ro 2:5,12</a>; <a onClick="return mV(\'2Cr\',5,10);">2Co 5:10</a>; <a onClick="return mV(\'Gal\',6,7,8);">Ga 6:7,8</a>, etc.<P>See <a href="./study/isbe/search.html?string=RETRIBUTION">RETRIBUTION</a>.<P>3. Conscious Suffering in Future:<P>The conscious endurance of punishment for sin in the future state is already implied in the preceding. The parable of the Rich Man speaks of it as following immediately on death in Hades; all the descriptions of the judgment imply pain and anguish as the result of condemnation (compare <a onClick="return mV(\'Rom\',2,5,12);">Ro 2:5,12</a>). This does not settle the nature or duration of the punishment; but it excludes the idea that physical death is the extinction of being, or that annihilation follows immediately upon death or judgment.<P>These things being assumed, the questions that remain are: Is the period of suffering for sin eternal, or is it terminable? May it be cut short by repentance or by annihilation? Is there any final solution of the discord it implies in the universe? It is maintained here that the punishment of sin, in the case of the finally impenitent, is everlasting.<P>II. Scriptural Support.<P>The doctrine that the punishment of sin is everlasting is sustained by many plain testimonies of Scripture.<P>1. Old Testament and Jewish Conceptions:<P>The doctrine of future punishment is not prominent in the Old Testament, where rewards and punishments are chiefly connected with the present life. In a few passages (<a onClick="return mV(\'Psa\',49,14,15);">Ps 49:14,15</a>; <a onClick="return mV(\'Psa\',73,18,19);">73:18,19</a>; compare <a onClick="return mV(\'Isa\',24,21,22);">Isa 24:21,22</a>; <a onClick="return mV(\'Isa\',66,24);">66:24</a>), Dr. Charles thinks that "Sheol appears as the place of punishment of the wicked" (Eschatology, 73-76, 156). If so, there is no suggestion of escape from it. In <a onClick="return mV(\'Dan\',12,2);">Da 12:2</a>, some that sleep in the dust are represented as awaking to "shame and everlasting contempt" (the word for "everlasting" is the usual one, \'olam). In the Jewish literature of the century before Christ, "Sheol is regarded," says Dr. Charles, "as the place of final eternal punishment, that is, it has become hell" (op. cit., 236).<P>See <a href="./study/isbe/search.html?string=ESCHATOLOGY+OF+THE+OLD+TESTAMENT">ESCHATOLOGY OF THE OLD TESTAMENT</a>. <p>2. New Testament Teaching:<P>In the New Testament, the strongest language is used by Jesus and the apostolic writers on the certainty and severity of the punishment of sin in the future state, and always in a manner which suggests that the doom is final.<P>(1) "Eternal."<P>The word "eternal" (aionios) is repeatedly applied to the punishment of sin, or to the fire which is its symbol. A principal example is <a onClick="return mV(\'Mat\',25,41,46);">Mt 25:41,46</a>, "eternal fire," "eternal punishment" (kolasis aionios). Here precisely the same word is applied to the punishment of the wicked as to the blessedness of the righteous. Other instances are <a onClick="return mV(\'Mat\',18,8);">Mt 18:8</a>; <a onClick="return mV(\'Jud\',1,7);">Jude 1:7</a>; compare <a onClick="return mV(\'Rev\',14,11);">Re 14:11</a>; <a onClick="return mV(\'Rev\',19,3);">19:3</a>; <a onClick="return mV(\'Rev\',20,10);">20:10</a>. In <a onClick="return mV(\'2Th\',1,9);">2Th 1:9</a>, we have, "eternal destruction." The kindred word aidios, "everlasting," is in <a onClick="return mV(\'Jud\',1,6);">Jude 1:6</a> applied to the punishment of the fallen angels.<P>The reply made by Maurice (Theological Essays, 442ff) that aionios in such passages denotes quality, not duration, cannot be sustained. Whatever else the term includes, it connotes duration. More pertinent is the criticism of other writers (e.g. Cox, Salvator Mundi, 96ff; Farrar, Eternal Hope, Pref., xxxiv, pp. 78ff, 197ff; compare his Mercy and Judgment, passim) that aionios does not necessarily mean "eternal" (according to Cox it does not mean this at all), but is strictly "age-long," is therefore compatible with, if it does not directly suggest, a terminable period. Cox allows that the term is "saturated through and through with the element of time" (p. 100,), but he denies its equivalence with "everlasting." The sense, no doubt, is to be determined by the context, but it can hardly be questioned that "the eons of the eons" and similar phrases are the practical New Testament equivalents for eternity, and that aionios in its application to God and to life ("eternal life") includes the idea of unending duration (compare <a onClick="return mV(\'Jhn\',10,28,29);">Joh 10:28,29</a> for express assertion of this). When, therefore, the term is applied in the same context to punishment and to life (<a onClick="return mV(\'Mat\',25,46);">Mt 25:46</a>), and no hint is given anywhere of limitation, the only reasonable exegesis is to take the word in its full sense of "eternal."<P>(2) Equivalent Expressions.<P>The meaning "eternal" is confirmed by the use of equivalent expressions and of forms of speech which convey in the strongest manner the idea of finality. Such are the expressions, "the unquenchable fire," the "worm" that "dieth not" (<a onClick="return mV(\'Mat\',3,12);">Mt 3:12</a>; <a onClick="return mV(\'Mar\',9,\'43-48\');">Mr 9:43-48</a>; compare <a onClick="return mV(\'Mat\',13,42,50);">Mt 13:42,50</a>), with those numerous references to "death," "destruction," "second death," on which the advocates of conditional immortality build their arguments for final extinction. Such is the dictum of Jesus: "He that obeyeth not the Son shall not see life, but the wrath of God abideth (remains) on him" (<a onClick="return mV(\'Jhn\',3,36);">Joh 3:36</a>; the opposite of "life" is "perishing," <a onClick="return mV(\'Jhn\',3,16);">3:16</A>); or that in <a onClick="return mV(\'Rev\',22,11);">Re 22:11</a>, "He that is unrighteous, let him do unrighteousness still: and he that is filthy, let him be made filthy still." Finality is the note in all Christ\'s warnings—"the outer darkness" (<a onClick="return mV(\'Mat\',8,12);">Mt 8:12</a>; <a onClick="return mV(\'Mat\',22,13);">22:13</a>); "The door was shut...I know you not" (<a onClick="return mV(\'Mat\',25,10,12);">Mt 25:10,12</a>; compare <a onClick="return mV(\'Mat\',7,23;">7:23</A>), as in those of the Epistles (e.g. <a onClick="return mV(\'Hbr\',2,3);">Heb 2:3</a>; <a onClick="return mV(\'Hbr\',6,6,8);">6:6,8</a>; <a onClick="return mV(\'Hbr\',10,27,31);">10:27,31</a>; <a onClick="return mV(\'Hbr\',12,25,29);">12:25,29</a>). Jesus speaks of the blasphemy against the Spirit as a sin which shall not be forgiven, "neither in this world, nor in that which is to come" (<a onClick="return mV(\'Mat\',12,32);">Mt 12:32</a>; not as implying that other sins, unforgiven in this life, may be forgiven in the next), a passage which Mark gives in the remarkable form, "hath never forgiveness, but is guilty of an eternal sin" (<a onClick="return mV(\'Mar\',3,29);">Mr 3:29</a>). The Rich Man in Hades found an impassable gulf fixed between himself and Lazarus (<a onClick="return mV(\'Luk\',16,26);">Lu 16:26</a>). See <a href="./study/isbe/search.html?string=GULF">GULF</a>. It adds to the terribleness of these sayings that, as before remarked, there is nothing to put against them; no hint or indication of a termination of the doom. Why did Jesus not safeguard His words from misapprehension, if behind them there lay an assurance of restoration and mercy? One may ask with Oxenham, in a reply to Jukes, "whether if Christ had intended to teach the doctrine of eternal punishment, He could possibly have taught it in plainer terms."<P>(3) The Last Judgment.<P>The New Testament doctrine of the last judgment leads to the same conclusion. Two things seem plainly taught about this judgment: the first, that it proceeds on the matter of the present life—"the things done in the body" (<a onClick="return mV(\'Mat\',25,\'31-46\');">Mt 25:31-46</a>; <a onClick="return mV(\'2Cr\',5,10);">2Co 5:10</a>; <a onClick="return mV(\'Rev\',20,12);">Re 20:12</a>); and the second, that it is decisive in its issues. Not a single suggestion is given of a reversal of its decisions in any future age. Such silence is inexplicable if the Scriptures meant to teach what the opponents of this doctrine so confidently maintain.<P>3. Teaching of Analogy:<P>In corroboration of this Scriptural view analogy might be pleaded. How constantly even in this life is the law illustrated of the tendency of character to fixity! The present is the season of grace (<a onClick="return mV(\'2Cr\',6,2);">2Co 6:2</a>), yet what powers of resistance to God and goodness are seen to lie in human nature, and how effectually, often, does it harden itself under the influences that seem most fitted to break down its rebellion! What likelihood is there that eternity will alter this tendency, or make conversion more easy? Eternity can hardly be thought of as more really a scene of grace than time is for those to whom the gospel has already come. Its characteristic mark is said to be "judgment" (<a onClick="return mV(\'Hbr\',9,27);">Heb 9:27</a>). Like the photographer\'s bath, may its effect not be to develop and fix existing character, rather than to change it? If so, the state in which judgment finds the soul may be presumed to be one that will remain.<P>III. Difficulties and Objections—Rival Hypotheses.<P>What, it will now be asked, of the tremendous difficulties which inhere in this doctrine, with their undeniable effect in alienating many generous minds from it and from Christianity? The lurid rhetorical picturings of the sufferings of the lost, too frequent in the teaching of the past, may be discounted; it is not necessary to go beyond the inexpressibly solemn words of Christ Himself and His apostles. But even with this limitation, does it not seem as if, by this doctrine, a reflection was cast on the righteousness and mercy of God in creating such multitudes of the human race, as, on any showing, are outside the pale of Christ\'s salvation—the countless generations of the heathen, with the masses even in Christian lands who have not received or do not obey the light—only to doom them to endless misery? Before attempting a positive answer, it is proper that a glance be taken at the rival theories put forth in alleviation of the difficulty.<P>1. Universal Salvation:<P>The most comprehensive solution propounded is that of universal salvation—of a final restitution of all souls to God\'s favor and to blessedness. This tempting speculation—for it is no more—advocated by Origen in the early church, by Schleiermacher in the last century, has been urged by many writers in modern times. One of its best known advocates was Samuel Cox, in his book Salvator Mundi. It is noticeable that not a few who favor this theory (e.g. Maurice, Farrar) decline to commit themselves to it as more than a "hope," and admit the possibility of human souls continuing to resist God endlessly (Maurice, Theological Essays, 476; Farrar, Eternal Hope, Pref., xv, xvi; Mercy and Judgment, I,485,"In this sense there may be for some souls an endless hell"). It must, however, be evident that, be the number greater or smaller—and who shall give assurance of its smallness?—if there are any such souls, the difficulty in principle remains, and the passages alleged as teaching universal restoration are equally contradicted. The deeper objection to this theory is that, springing, not from real knowledge, but from men\'s hopes and wishes, it has, as already shown, the tremendous stress of Scripture testimony against it; nor do the passages commonly adduced as favoring it really bear the weight put upon them. We read, e.g., of a restoration of all things"—the same that Christ calls the palingenesia—but, in the same breath, we are told of those who will not hearken, and will be destroyed (<a onClick="return mV(\'Mat\',19,28);">Mt 19:28</a>; <a onClick="return mV(\'Act\',3,21,23);">Ac 3:21,23</a>). We read of Christ drawing all men unto Him (<a onClick="return mV(\'Jhn\',12,32);">Joh 12:32</a>); but we are not less clearly told that at His coming Christ will pronounce on some a tremendous condemnation (<a onClick="return mV(\'Mat\',7,23);">Mt 7:23</a>; <a onClick="return mV(\'Mat\',25,41);">25:41</a>); we read of all things being gathered, or summed up, in Christ, of Christ subduing all things to Himself, etc.; but representative exegetes like Meyer and Weiss show that it is far from Paul\'s view to teach an ultimate conversion or annihilation of the kingdom of evil (compare Meyer on <a onClick="return mV(\'1Cr\',15,21,28);">1Co 15:21,28</a> and <a onClick="return mV(\'Eph\',1,10);">Eph 1:10</a>; Weiss, Biblical Theology, II, 723, 107, 109, English translation). We confess, however, that the strain of these last passages does seem to point in the direction of some ultimate unity, be it through subjugation, or in some other way, in which active opposition to God\'s kingdom is no longer to be reckoned with.<P>2. Annihilation:<P>The view favored by another class is that of the annihilation of the finally impenitent. The type of doctrine called "conditional immortality" includes other elements which need not here be discussed (see <a href="./study/isbe/search.html?string=IMMORTALITY">IMMORTALITY</a>). The annihilation theory takes different forms. So far as the annihilation is supposed to take place at death, it is contradicted by the Scriptures which support the soul\'s survival after death; so far as it is believed to take place after a longer or shorter period of conscious suffering (which is White\'s theory), it involves its advocates in difficulties with their own interpretations of "death," "destruction," "perishing," seeing that in Scripture this doom is uniformly represented as overtaking the ungodly at the day of judgment, and not at some indefinite period thereafter. The theory conflicts also with the idea of gradation of punishment, for which room has to be sought in the period of conscious suffering, and rests really on an unduly narrowed conception of the meaning of the Scriptural terms "life" and "death." Life is not bare existence, nor is "death" necessarily extinction of being. Assaid earlier, the language of many parts of Scripture implies the continued existence of the subjects of the divine wrath.<P>3. Second Probation:<P>It is significant that on the side alike of the advocates of restoration and of those of annihilation (e.g. E. White), refuge from the difficulties is frequently sought in the hypothesis of an extended probation and work of evangelization beyond death. This theory labors under the drawback that, in marked contrast with Scripture, it throws immensely the larger part of the work of salvation into the future state of being. It is, besides, apart from the dubious and limited support given to it by the passage on Christ\'s preaching to "the spirits in prison" (<a onClick="return mV(\'1Pe\',3,19,20);">1Pe 3:19,20</a>); destitute of S
