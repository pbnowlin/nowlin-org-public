rship and Age of the Psalms.<P><a onClick="return mV(\'Psa\',90,\'1-\');">Ps 90</a> is ascribed to Moses. It is the fashion now to deny that Moses wrote anything. A careful study of <a onClick="return mV(\'Psa\',90,\'1-\');">Ps 90</a> has brought to light nothing inconsistent with Mosaic authorship. The dignity, majesty and pathos of the poem are worthy of the great lawgiver and intercessor.<P>1. David as a Psalmist:<P>(1) The Age of David Offered Fruitful Soil for the Growth of Religious Poetry.<P>(a) The political and religious reforms of Samuel created a new sense of national unity, and kindled the fires of religious patriotism. (b) Music had a large place in the life of the prophetic guilds or schools of the prophets, and was used in public religious exercises (<a onClick="return mV(\'1Sa\',10,5);">1Sa 10:5</a>f). (c) The victories of David and the internal expansion of the life of Israel would inevitably stimulate the poetic instinct of men of genius; compare the Elizabethan age and the Victorian era in English literature. (d) The removal of the ark to the new capital and the organization of the Levitical choirs would stimulate poets to compose hymns of praise to Yahweh (<a onClick="return mV(\'2Sa\',6,\'1-\');">2Sa 6</a>; <a onClick="return mV(\'1Ch\',15,\'1-\');">1Ch 15</a>; <a onClick="return mV(\'1Ch\',16,\'1-\');">16</a>; <a onClick="return mV(\'1Ch\',25,\'1-\');">25</a>).<P>It is the fashion in certain critical circles to blot out the Mosaic era as unhistoric, all accounts of it being considered legendary or mythical. It is easy then to insist on the elimination of all the higher religious teaching attributed to Samuel. This leaves David "a rude king in a semi-barbaric age," or, as Cheyne puts it, "the versatile condottiere, chieftain, and king." It would seem more reasonable to accept as trustworthy the uniform tradition of Israel as to the great leaders, Moses, Samuel and David, than to rewrite Israel\'s history out of the tiny fragments of historical material that are accepted by skeptical critics as credible. It is often said that late writers read into their accounts of early heroes their own ideas of what would be fitting. James Robertson\'s remark in reply has great weight: "This habit of explaining the early as the backward projection of the late is always liable to the objection that it leaves the late itself without explanation" (Poetry and Religion of the Psalms, 332).<P>(2) David\'s Qualifications for Composing Psalms<P>(a) He was a skillful musician, with a sense of rhythm and an ear for pleasing sounds (<a onClick="return mV(\'1Sa\',16,\'15-23\');">1Sa 16:15-23</a>). He seems to have invented new instruments of music (<a onClick="return mV(\'Amo\',6,5);">Am 6:5</a>). (b) He is recognized by critics of all schools as a poet of no mean ability. The genuineness of his elegy over Saul and Jonathan (<a onClick="return mV(\'2Sa\',1,\'19-27\');">2Sa 1:19-27</a>) is commonly accepted; also his lament over Abner (<a onClick="return mV(\'2Sa\',3,33);">2Sa 3:33</a>f). In the elegy over Saul and Jonathan, David displays a magnanimity and tenderness that accord with the representations of S as to his treatment of Saul and of Jonathan. No mere rough border chieftain could have composed a poem full of the tenderest sentiment and the most exemplary attitude toward a persecutor. The moral elevation of the elegy has to be accounted for. If the author was a deeply religious man, a man enjoying the friendship of God, it is easy to account for the moral dignity of the poem. Surely it is only a step from the patriotism and magnanimity and devoted friendship of the elegy to the religious fervor of the Psalms. Moreover, the poetic skill displayed in the elegy removes the possible objection that literary art in the days of David had not attained a development equal to the composition of poems such as the Psalms. There is nothing more beautiful and artistic in the entire Psalter.<P>Radical critics saw the David of the Bible asunder. They contrast the rough border chieftain with the pious Psalmist. Though willing to believe every statement that reflects upon the moral character of David, they consider the references to David as a writer of hymns and the organizer of the temple choirs as the pious imaginings of late chroniclers. Robertson well says: "This habit of refusing to admit complexity in the capacities of Biblical characters is exceedingly hazardous and unsafe, when history is so full of instances of the combination in one person of qualities the most diverse. We not only have poets who can harp upon more than one string, but we have religious leaders who have united the most fervent piety with the exercise of poorly developed virtue, or the practice of very questionable policy. A critic, if he has not a single measure of large enough capacity for a historical character, should not think himself at liberty to measure him out in two halfbushels, making one man of each" (Poetry and Religion of the Psalms, 332). Among kings, Charlemagne and Constantine the Great have been likened to David; and among poets, Robert Burns. There were contradictory elements in the moral characters of all these gifted men. Of Constantine it has been said that he "was by turns the docile believer and the cruel despot, devotee and murderer, patron saint and avenging demon." David was a many-sided man, with a character often at war with itself, a man with conflicting impulses, the flesh lusting against the spirit and the spirit against the flesh. Men of flesh and blood in the midst of life\'s temptations have no difficulty in understanding the David of the Bible.<P>(c) David was a man of deep feeling and of imperial imagination. Think of his love for Jonathan, his grateful appreciation of every exploit done in his behalf by his mighty men, his fondness for Absalom. His successful generalship would argue for imagination, as well as the vivid imagery of the elegy. (d) David was an enthusiastic worshipper of Yahweh. All the records of his life agree in representing him as devoted to Israel\'s God. In the midst of life\'s dangers and disappointments, "David strengthened himself in Yahweh his God" (<a onClick="return mV(\'1Sa\',30,6);">1Sa 30:6</a>). We should have been surprised had no trace of religious poetry come from his pen. It would be difficult to imagine Milton or Cowper or Tennyson as confining himself to secular poetry. "Comus," "John Gilpin," and the "Charge of the Light Brigade" did not exhaust their genius; nor did the elegy over Saul and Jonathan and the lament over Abner relieve David\'s soul of the poetry that clamored for expression. The known facts of his life and times prepare us for an outburst of psalmody under his leadership. (e) The varied experiences through which David passed were of a character to quicken any latent gifts for poetic expression.<P>James Robertson states this argument clearly, and yet with becoming caution: "The vicissitudes and situations in David\'s life presented in these narratives are of such a nature that, though we may not be able to say precisely that such and such a psalm was composed at such and such a time and place, yet we may confidently say, Here is a man who has passed through certain experiences and borne himself in such wise that we are not surprised to hear that, being a poet, he composed this and the other psalms. It is very doubtful whether we should tie down any lyric to a precise set of circumstances, the poet being like a painter who having found a fit landscape, sits down to transfer it to canvas. I do not think it likely that David, finding himself in some great perplexity or sorrow, called for writing materials in order to describe the situation or record his feelings. But I do think it probable that the vicissitudes through which he passed made such an impression on his sensitive heart, and became so inculcated withn an emotional nature, that when he soothed himself in his retirement with his lyre, they came forth spontaneously in the form of a psalm or song or prayer, according as the recollection was sad or joyful, and as his singing mood moved him" (Poetry and Religion of the Psalms, 343f).<P>The Biblical writers, both early and late, agree in affirming that the Spirit of Yahweh rested upon David, empowering him for service of the highest order (<a onClick="return mV(\'1Sa\',16,13);">1Sa 16:13</a>; <a onClick="return mV(\'2Sa\',23,\'1-3\');">2Sa 23:1-3</a>; <a onClick="return mV(\'Mat\',22,43);">Mt 22:43</a>; <a onClick="return mV(\'Act\',2,\'29-31\');">Ac 2:29-31</a>). The gift of prophetic inspiration was bestowed upon Israel\'s chief musician and poet.<P>(3) External Evidence for Davidic Psalms<P>(a) In the New Testament David is named as the author of certain psalms. Thus <a onClick="return mV(\'Psa\',110,\'1-\');">Ps 110</a> is ascribed to David by Jesus in His debate with the Pharisees in the Temple (<a onClick="return mV(\'Mat\',22,\'41-45\');">Mt 22:41-45</a>; <a onClick="return mV(\'Mar\',12,\'35-37\');">Mr 12:35-37</a>; <a onClick="return mV(\'Luk\',20,\'41-44\');">Lu 20:41-44</a>). Peter teaches that David prophesied concerning Judas (<a onClick="return mV(\'Act\',1,16);">Ac 1:16</a>), and he also refers <a onClick="return mV(\'Psa\',16,\'1-\');">Psalms 16</a> and <a onClick="return mV(\'Psa\',110,\'1-\');">110</a> to David (<a onClick="return mV(\'Act\',2,\'25-34\');">Ac 2:25-34</a>). The whole company of the disciples in prayer attribute <a onClick="return mV(\'Psa\',2,\'1-\');">Ps 2</a> to David (<a onClick="return mV(\'Act\',4,25);">Ac 4:25</a>f). Paul quotes <a onClick="return mV(\'Psa\',32,\'1-\');">Psalms 32</a> and <a onClick="return mV(\'Psa\',69,\'1-\');">69</a> as Davidic (<a onClick="return mV(\'Rom\',4,\'6-8\');">Ro 4:6-8</a>; <a onClick="return mV(\'Rom\',11,9);">11:9</a>f). The author of He even refers <a onClick="return mV(\'Psa\',95,\'1-\');">Ps 95</a> to David, following the Septuagint (<a onClick="return mV(\'Hbr\',4,7);">Heb 4:7</a>). From the last-named passage many scholars infer that any quotation from the Psalms might be referred to David as the chief author of the Psalms. Possibly this free and easy method of citation, without any attempt at rigorous critical accuracy, was in vogue in the 1st century AD. At the same time, it is evident that the view that David was the chief author of the Psalms was accepted by the New Testament writers.<P>(b) In 2Macc 2:13 (the Revised Version), in a letter purporting to have been written by the Jews of Palestine to their brethren in Egypt, about 144 BC, occurs the following: "And the same things were related both in the public archives and in the records that concern Nehemiah; and how he, rounding a library, gathered together the books about the kings and prophets, and the books of David, and letters of kings about sacred gifts." We do not know the exact date of 2Maccabees, but it was almost certainly in the 1st century BC. The author regards David as the author of books in the sacred library gathered together by Nehemiah.<P>(c) Jesus the Son of Sirach, who wrote not later than 180 BC, and possibly a good deal earlier, thus describes David\'s contribution to public worship: "In every work of his he gave thanks to the Holy One Most High with words of glory; with his whole heart he sang praise, and loved him that made him" (Ecclesiasticus 47:8f the Revised Version (British and American)). David\'s fame as a psalmist and the organizer of choirs for the sanctuary was well known to Ben Sira at the beginning of the 2nd century BC.<P>(d) The author of Chronicles, writing not later than 300 BC, and probably much earlier, represents David as making provision for a service of song before the ark of God and in connection with its removal to the city of David (<a onClick="return mV(\'1Ch\',15,\'1-\');">1Ch 15</a>; <a onClick="return mV(\'1Ch\',16,\'1-\');">16</a>). It seems to be imagined by some scholars that the Chronicler, whose historical accuracy is severely attacked by certain critics, is responsible for the idea that David was a great writer of hymns. On the contrary, he has less to say about David as a poet and psalmist than the author of Samuel. Only in <a onClick="return mV(\'2Ch\',29,30);">2Ch 29:30</a> is there explicit mention of David as the author of praises to Yahweh. The Chronicler speaks repeatedly of the instruments of David and of his organization of the choirs. And so in the kindred Books of Ezra and Nehemiah there is mention of the style of worship introduced by David (<a onClick="return mV(\'Ezr\',3,10);">Ezr 3:10</a>; <a onClick="return mV(\'Neh\',12,24,36);">Ne 12:24,36</a>). The author of the Book of Kings refers repeatedly to David as a model king (<a onClick="return mV(\'1Ki\',11,4);">1Ki 11:4</a>; <a onClick="return mV(\'2Ki\',14,3);">2Ki 14:3</a>; <a onClick="return mV(\'2Ki\',20,5);">20:5</a>f; etc.). He becomes a witness for the high reputation of David for uprightness and religious zeal.<P>(e) Amos refers incidentally to David\'s great skill as an inventor of musical instruments (<a onClick="return mV(\'Amo\',6,5);">Am 6:5</a>). The same prophet is a witness to the fact that songs were sung in worship at Bethel to the accompaniment of harps or viols (<a onClick="return mV(\'Amo\',5,23);">Am 5:23</a>).<P>(f) The earliest witness, or witnesses, if the narrative be composite, we find in 1 and 2 Samuel. David is described as a wonderful musician and as one on whom the Spirit of Yahweh rested mightily (<a onClick="return mV(\'1Sa\',16,\'13-23\');">1Sa 16:13-23</a>). He is credited with the beautiful elegy oyer Saul and Jonathan (<a onClick="return mV(\'2Sa\',1,\'17-27\');">2Sa 1:17-27</a>) and the brief lament over Abner (<a onClick="return mV(\'2Sa\',3,33);">2Sa 3:33</a>f). He is said to have danced with joy before the ark, and to have brought it up to Jerusalem with shouting and with sound of trumpet (<a onClick="return mV(\'2Sa\',6,12);">2Sa 6:12</a>). He is credited with the pious wish that he might build a temple for Yahweh and the Ark, and is said to have poured forth a prayer of thanksgiving to Yahweh for the promise of a perpetual throne (<a onClick="return mV(\'2Sa\',7,1);">2Sa 7</a>). David dedicated to Yahweh much wealth taken from his enemies. (<a onClick="return mV(\'2Sa\',8,11);">2Sa 8:11</a>). Both the good and the bad in David\'s life and character are faithfully set forth in the vivid narrative.<P>We come next to two statements that would settle the question of David\'s psalms, if critics would only accept them as the work of an author living within a generation or so of the time of David. Unfortunately <a onClick="return mV(\'2Sa\',21,1);">2Sa 21-24</a> is regarded by most critical scholars as an appendix to the early narrative of David\'s career. There is no agreement as to the exact date of the composition of these chapters. Naturally the burden of proof is on the critic who tries to disintegrate a document, and suspicion of bias is inevitable, if by the disintegration he is able to escape the force of a disagreeable argument. Happily, we live in a free country, every man having a right to hold and to express his own opinion, for whatever it may be worth. It seems to the present writer that <a onClick="return mV(\'2Sa\',21,\'1-\');">2Sa 21-24</a> may well have come from the pen of the early narrator who told the story of David\'s reign in such a masterly fashion. Even if these chapters were added by a later editor as an appendix, there is no sufficient reason for putting this writer so late as the exile. His statements cannot be set aside as unreliable, simply because they run counter to the current theory as to the date of the Psalms. <a onClick="return mV(\'2Sa\',22,\'1-\');">2Sa 22</a> purports to give the words of a song which David spake to Yahweh, when he had been delivered from Saul and from all his enemies. <a onClick="return mV(\'Psa\',18,\'1-\');">Ps 18</a> is evidently a different recension of the same poem. The differences between <a onClick="return mV(\'2Sa\',22,\'1-\');">2Sa 22</a> and <a onClick="return mV(\'Psa\',18,\'1-\');">Ps 18</a> are not much greater than the differences in the various odd of "Rock of Ages." Only the most advanced critics deny that David wrote this glorious song. <a onClick="return mV(\'2Sa\',23,\'1-7\');">2Sa 23:1-7</a> must not be omitted, for here David claimed prophetic inspiration as the sweet Psalmist of Israel. This original and striking poem is worthy of the brilliant royal bard. (g) The titles of the Psalms are external evidence of real value for determining the date and authorship of the Psalms; and these ascribe 73 to David. A sweeping denial of all the forms of external evidence for Davidic psalms ought to be buttressed by convincing arguments from internal evidence. Unverified conjectures will not answer.<P>(4) Internal Evidence for Davidic Psalms<P>The fact that many of the psalms ascribed to David correspond in tone and temper and in historical allusions with incidents in his life, while not in itself convincing proof that David wrote them, certainly re-enforces the external evidence in favor of Davidic psalms. We must refer the reader to the commentaries of Delitzsch, Kirkpatrick, Perowne and others for the evidence discovered in individual psalms. In many psalms the evidence is strongly in favor of the superscriptions, in which David is named as the writer. See especially <a onClick="return mV(\'Psa\',18,\'1-\');">Psalms 18</a>; <a onClick="return mV(\'Psa\',23,\'1-\');">23</a>; <a onClick="return mV(\'Psa\',32,\'1-\');">32</a>; <a onClick="return mV(\'Psa\',3,\'1-\');">3</a>.<P>(5) Number of Davidic Psalms<P>Opinion varies among conservative scholars all the way from 3 or 4 to 44 or 45. It has come to pass that a critic who acknowledges even <a onClick="return mV(\'Psa\',18,\'1-\');">Ps 18</a> to be David\'s is called conservative. In fact, the more radical critics regard a scholar as conservative if he assigns even a small group of psalms to the period before the exile. We must not allow ourselves to be deterred from ascribing to David any psalm that seems to us, on the basis of both external and internal evidence, to come from his pen. Delitzsch and Kirkpatrick are safer guides than Cheyne and Duhm. Maclaren also has made a close and sympathetic study of David\'s life and character, and accepts the results of sane criticism. W. T. Davison (HDB, IV) speaks out clearly and strongly for Davidic authorship of <a onClick="return mV(\'Psa\',7,\'1-\');">Psalms 7</a>; <a onClick="return mV(\'Psa\',11,\'1-\');">11</a>; <a onClick="return mV(\'Psa\',17,\'1-\');">17</a>; <a onClick="return mV(\'Psa\',18,\'1-\');">18</a>; <a onClick="return mV(\'Psa\',19,\'1-\');">19</a> (first half), <a onClick="return mV(\'Psa\',24,\'1-\');">24</A> and a few other psalms or parts of psalms, though he makes large concessions to the present tendency to bring the psalms down to a later date. He stands firmly for a large body of pre-exilic psalms. Ewald assigned to David <a onClick="return mV(\'Psa\',3,\'1-\');">Psalms 3</a>; <a onClick="return mV(\'Psa\',4,\'1-\');">4</a>; <a onClick="return mV(\'Psa\',7,\'1-\');">7</a>; <a onClick="return mV(\'Psa\',8,\'1-\');">8</a>; <a onClick="return mV(\'Psa\',11,\'1-\');">11</a>; <a onClick="return mV(\'Psa\',18,\'1-\');">18</a>; <a onClick="return mV(\'Psa\',19,\'1-\');">19</a>; <a onClick="return mV(\'Psa\',24,\'1-\');">24</a>; <a onClick="return mV(\'Psa\',29,\'1-\');">29</a>; <a onClick="return mV(\'Psa\',32,\'1-\');">32</a>; <a onClick="return mV(\'Psa\',101,\'1-\');">101</a>; also <a onClick="return mV(\'Psa\',60,\'8-11\');">60:8-11</a> and <a onClick="return mV(\'Psa\',68,\'14-19\');">68:14-19</a>. Hitzig ascribed to David <a onClick="return mV(\'Psa\',3,\'1-\');">Psalms 3-19</a>, with the exception of <a onClick="return mV(\'Psa\',5,\'1-\');">Pss 5</a>; <a onClick="return mV(\'Psa\',6,\'1-\');">6</a> and <a onClick="return mV(\'Psa\',14,\'1-\');">14</A>. If one follows the titles in the Hebrew text, except where internal evidence clearly contradicts the superscriptions, it will be easy, to follow Delitzsch in attributing 44 or 45 psalms to David.``156';
isbe[7149]='Psalms, Book of, 2`2. Psalmody after David:<P>(1) Psalms of Asaph (<a onClick="return mV(\'Psa\',73,\'1-\');">Psalms 73-83</a>, also <a onClick="return mV(\'Psa\',50,\'1-\');">50</A>).<P>The prophetic spirit throbs in most of the psalms ascribed to <a href="./study/isbe/search.html?string=ASAPH">ASAPH</a> (which see). God is pictured as a righteous Judge. He is also pictured as the Shepherd of Israel. <a onClick="return mV(\'Psa\',73,\'1-\');">Ps 73</a> holds fast to God\'s righteous rule of mankind, in spite of the prosperity of the wicked. <a onClick="return mV(\'Psa\',50,\'1-\');">Ps 50</a>, which is assigned by many to the time of Hosea and Isaiah, because of its powerful prophetic message, may well have come from Asaph, the contemporary of David and of Nathan. Some of the Asaph group, notably <a onClick="return mV(\'Psa\',74,\'1-\');">74</A> and <a onClick="return mV(\'Psa\',79,\'1-\');">79</A>, belong to the period of the exile or later. The family of Asaph continued for centuries to lead in the service of song (<a onClick="return mV(\'2Ch\',35,15);">2Ch 35:15</a>; <a onClick="return mV(\'Neh\',7,44);">Ne 7:44</a>). Inspired poets were raised up from age to age in the Asaph guild.<P>(2) Psalms of the Sons of Korah (<a onClick="return mV(\'Psa\',42,\'1-\');">Psalms 42-49</a>; <a onClick="return mV(\'Psa\',84,\'1-\');">84</a>; <a onClick="return mV(\'Psa\',85,\'1-\');">85</a>; <a onClick="return mV(\'Psa\',87,\'1-\');">87</a>).<P>This family of singers was prominent in the temple-worship in the days of David and afterward. Several of the most beautiful poems in the Psalter are ascribed to members of this guild (see <a onClick="return mV(\'Psa\',42,\'1-\');">Psalms 42</a>; <a onClick="return mV(\'Psa\',43,\'1-\');">43</a>; <a onClick="return mV(\'Psa\',45,\'1-\');">45</a>; <a onClick="return mV(\'Psa\',46,\'1-\');">46</a>; <a onClick="return mV(\'Psa\',49,\'1-\');">49</a>; <a onClick="return mV(\'Psa\',84,\'1-\');">84</a>). We are not to think of these poems as having been composed by a committee of the sons of Korah; no doubt each poem had an individual author, who was willing to sink his personality in the psalm that he was composing. The privileges and blessings of social worship in the sanctuary are greatly magnified in this group of psalms<P>(3) Psalms of Solomon (<a onClick="return mV(\'Psa\',72,\'1-\');">Psalms 72</a>; <a onClick="return mV(\'Psa\',127,\'1-\');">127</a>).<P>Even conservative critics are in doubt as to the Solomonic authorship of the two psalms ascribed to him by the titles. Perhaps assurance is not attainable in the present state of inquiry. Delitzsch well says: "Under Solomon psalmody already began to decline; all the productions of the mind of that period bear the stamp of thoughtful contemplation rather than of direct feeling, for restless yearning for higher things had given place to sensuous enjoyment, national concentration to cosmopolitan expansion."<P>(4) The Era of Jehoshaphat.<P>Delitzsch and others regard the period of Jehoshaphat as one of literary productivity. Possibly <a onClick="return mV(\'Psa\',75,\'1-\');">Psalms 75</a> and <a onClick="return mV(\'Psa\',76,\'1-\');">76</A> celebrate the deliverance from the great eastern invasion toward the close of Jehoshaphat\'s reign.<P>(5) The Era of Hezekiah.<P>The latter half of the 8th century BC was one of literary vigor and expansion, especially in Judah. Perhaps the great deliverance from Sennacherib\'s invasion is celebrated in <a onClick="return mV(\'Psa\',46,\'1-\');">Psalms 46</a> and <a onClick="return mV(\'Psa\',48,\'1-\');">48</a>.<P>(6) The Period of Jeremiah.<P>Ehrt and some other scholars are inclined to attribute to Jeremiah a considerable number of psalms. Among those which have been assigned to this prophet may be named <a onClick="return mV(\'Psa\',31,\'1-\');">Psalms 31</a>; <a onClick="return mV(\'Psa\',35,\'1-\');">35</a>; <a onClick="return mV(\'Psa\',38,\'1-\');">38</a>; <a onClick="return mV(\'Psa\',40,\'1-\');">40</a>; <a onClick="return mV(\'Psa\',55,\'1-\');">55</a>; <a onClick="return mV(\'Psa\',69,\'1-\');">69</a>; <a onClick="return mV(\'Psa\',71,\'1-\');">71</a>. Those who deny the Davidic authorship of <a onClick="return mV(\'Psa\',22,\'1-\');">Ps 22</a> also assign this great poem to Jeremiah. Whether we are able to name definitely any psalms of Jeremiah, it seems thoroughly reasonable that he should have been the author of certain of the plaintive poems in the Psalter.<P>(7) During the Exile.<P><a onClick="return mV(\'Psa\',102,\'1-\');">Ps 102</a> seems to have been composed during the exile. The poet pours out his complaint over the present distress, and reminds Yahweh that it is time to have pity upon Zion. <a onClick="return mV(\'Psa\',137,\'1-\');">Ps 137</a> pictures the distress of the captives by the rivers of Babylon. The fire and fervor of the poem bespeak an author personally involved in the distress. No doubt other psalms in our collection were composed during the captivity in Babylon. (8) Post-exilic Psalms<P>As specimens of the joyous hymns composed after the return from exile, we may name <a onClick="return mV(\'Psa\',85,\'1-\');">Psalms 85</a> and <a onClick="return mV(\'Psa\',126,\'1-\');">126</A>. Many of the liturgical hymns in the Psalter were no doubt prepared for use in the worship of the second temple. Certain recent critics have extended this class of hymns so as to include the greater part of the Psalter, but that is surely an extreme view. No doubt, the stirring times of Ezra and Nehemiah stimulated poets in Jerusalem to pour forth thanksgiving and praise to Israel\'s God. Ewald taught, that the latest psalms in our collection were composed at this time.<P>(9) Are There Maccabean Psalms?<P>Calvin, assigned <a onClick="return mV(\'Psa\',44,\'1-\');">Psalms 44</a>; <a onClick="return mV(\'Psa\',74,\'1-\');">74</a> and <a onClick="return mV(\'Psa\',79,\'1-\');">79</A> to the Maccabean period. If there are Maccabean psalms, Calvin has perhaps hit upon three of them. Hitzig assigns to the Maccabean period all the psalms from <a onClick="return mV(\'Psa\',73,\'1-\');">73</A> to <a onClick="return mV(\'Psa\',150,\'1-\');">150</A>, together with a few psalms in the earlier half of the Psalter. Among moderns, Duhm puts practically the whole Psalter in the period from 170 to 70 BC. Gesenius, Ewald, Hupfeld and Dillmann, four of the greatest names in Old Testament criticism, oppose the view that the Psalter contains Maccabean psalms. Most recent students admit the possibility of Maccabean psalms. The question may well be left open for further investigation. <p>III. Growth of the Psalter.<P>1. Division into Five Books:<P>In the Hebrew text as well as in the Revised Version (British and American), the Psalms are grouped into five books, as follows: Book I, <a onClick="return mV(\'Psa\',1,\'1-\');">Psalms 1-41</a>; Book II, <a onClick="return mV(\'Psa\',42,\'1-\');">Psalms 42-72</a>; Book III, <a onClick="return mV(\'Psa\',73,\'1-\');">Psalms 73-89</a>; Book IV, <a onClick="return mV(\'Psa\',90,\'1-\');">Psalms 90-106</a>; Book V, <a onClick="return mV(\'Psa\',107,\'1-\');">Psalms 107-150</a>. It is possible that this division into five books may have been already made before the Chronicler composed his history of Judah (compare <a onClick="return mV(\'1Ch\',16,36);">1Ch 16:36</a> with <a onClick="return mV(\'Psa\',106,48);">Ps 106:48</a>). At the end of Book II appears a subscript which is significant in the history of the Psalter. It is said in <a onClick="return mV(\'Psa\',72,20);">Ps 72:20</a>: "The prayers of David the son of Jesse are ended." It would seem from this note that the editor who appended it meant to say that in his collection he had included all the psalms of David known to him. Singularly enough, the subscript is attached to a psalm ascribed to Solomon. <a onClick="return mV(\'Psa\',51,\'1-\');">Psalms 51-70</a>, however, lie near at hand, all of which are attributed to David. <a onClick="return mV(\'Psa\',71,\'1-\');">Ps 71</a> is anonymous, and <a onClick="return mV(\'Psa\',72,\'1-\');">Ps 72</a> might possibly be considered a prayer for Solomon. There is a further difficulty in the fact that the Second Book of Psalms opens with nine poems ascribed to the sons of Korah and to Asaph. It is a very natural conjecture that these nine psalms were at one time united with <a onClick="return mV(\'Psa\',73,\'1-\');">Psalms 73-83</a>. With these removed, it would be possible to unite <a onClick="return mV(\'Psa\',51,\'1-\');">Psalms 51-70</a> with Book I. Then the subscript to <a onClick="return mV(\'Psa\',72,\'1-\');">Ps 72</a> would be a fitting close to a roll made up of psalms ascribed to David. It is impossible at this late date to trace fully and accurately the history of the formation of the Psalter.<P>2. Smaller Groups of Psalms:<P>Within the Psalter there lie certain groups of psalms which have in a measure retained the form in which they probably once circulated separately. Among these groups may be named the Psalms of Ascents (<a onClick="return mV(\'Psa\',120,\'1-\');">Psalms 120-134</a>), the Asaph group (<a onClick="return mV(\'Psa\',73,\'1-\');">Psalms 73-83</a>), the sons of Korah groups (<a onClick="return mV(\'Psa\',42,\'1-\');">Psalms 42-49</a>; <a onClick="return mV(\'Psa\',84,\'1-\');">84-87</a>, except <a onClick="return mV(\'Psa\',86,\'1-\');">86</A>), a Mikhtam group (<a onClick="return mV(\'Psa\',56,\'1-\');">Psalms 56-60</a>), a group praising Yahweh for His character and deeds (<a onClick="return mV(\'Psa\',93,\'1-\');">Psalms 93-100</a>), to which <a onClick="return mV(\'Psa\',90,\'1-\');">Psalms 90-92</a> form a fitting introduction. <a onClick="return mV(\'Psa\',103,\'1-\');">Psalms 103-107</a> constitute another group of praise psalms, and <a onClick="return mV(\'Psa\',145,\'1-\');">Psalms 145-150</a> make a closing Hallelujah group.<P>The Psalter has had a long and varied history. No doubt the precentor of the temple choir had his own collection of hymns for public worship. Small groups of psalms may have been issued also for private use in the home. As time went on, collections were made on different organizing principles. Sometimes hymns attributed to a given author were perhaps brought into a single group. Possibly psalms of a certain type, such as Maskil and Mikhtam psalms, were gathered together in small collections. How these small groups were partly preserved and partly broken up, in the history of the formation of our present Psalter, will, perhaps, never be known.<P>IV. Poetry of the Psalter.<P>For general discussion of the form of Hebrew poetry, see <a href="./study/isbe/search.html?string=POETRY">POETRY</a>. In the Psalms almost all known varieties of poetic parallelism are exemplified. Among moderns, C.A. Briggs has made extensive research into the poetical structure of the Psalms. In summing up the result of his study of the various measures employed in the Psalms, he classes 89 psalms or parts of psalms as trimeters, that is, the lines have three main accents; 22 psalms or parts he regards as tetrameters, each of the lines having four accented syllables; 25 psalms or portions are classed as pentameters, and an equal number as hexameters. He recognizes some variety of measure in certain psalms. There is coming to be agreement among Hebrew scholars that the rhythm of Hebrew poetry is largely determined by the number of accented syllables to the line. Some critics insist rigorously on perfect regularity, and therefore are compelled to resort to conjectural emendation.<P>See <a href="./study/isbe/search.html?string=POETRY,+HEBREW">POETRY, HEBREW</a>.<P>Nine psalms are known as alphabetical poems, namely, <a onClick="return mV(\'Psa\',9,\'1-\');">Psalms 9</a>; <a onClick="return mV(\'Psa\',10,\'1-\');">10</a>; <a onClick="return mV(\'Psa\',25,\'1-\');">25</a>; <a onClick="return mV(\'Psa\',34,\'1-\');">34</a>; <a onClick="return mV(\'Psa\',37,\'1-\');">37</a>; <a onClick="return mV(\'Psa\',111,\'1-\');">111</a>; <a onClick="return mV(\'Psa\',112,\'1-\');">112</a>; <a onClick="return mV(\'Psa\',119,\'1-\');">119</a>; <a onClick="return mV(\'Psa\',145,\'1-\');">145</a>. The most elaborate of these is <a onClick="return mV(\'Psa\',119,\'1-\');">Ps 119</a>, which is divided into 22 sections of 8 verses each. Each letter of the Hebrew alphabet occurs 8 times in succession as the initial letter of the verses in its section.<P>As to strophical structure or stanza formation, there is evidence in certain psalms of such organization of the poems. The refrains with which strophes often close form an easy guide to the strophical divisions in certain psalms, such as <a onClick="return mV(\'Psa\',42,\'1-\');">Psalms 42</a>; <a onClick="return mV(\'Psa\',43,\'1-\');">43</a>; <a onClick="return mV(\'Psa\',46,\'1-\');">46</a>; <a onClick="return mV(\'Psa\',107,\'1-\');">107</a>. Among English commentators, Briggs pays most attention to strophical structure. There is some evidence of antiphonal singing in connection with the Psalter. It is thought by some that <a onClick="return mV(\'Psa\',20,\'1-\');">Psalms 20</a> and <a onClick="return mV(\'Psa\',21,\'1-\');">21</a> were sung by responsive choirs. <a onClick="return mV(\'Psa\',24,\'1-\');">Psalms 24</a> and <a onClick="return mV(\'Psa\',118,\'1-\');">118</A> may each be antiphonal.<P>V. The Speaker in the Psalms.<P>Smend, in ZATW,1888,undertook to establish thesis that the speaker in the Psalms is not an individual, but a personification of the Jewish nation or church. At first he was inclined to recognize an individual speaker in <a onClick="return mV(\'Psa\',3,\'1-\');">Psalms 3</a>; <a onClick="return mV(\'Psa\',4,\'1-\');">4</a>; <a onClick="return mV(\'Psa\',62,\'1-\');">62</a> and <a onClick="return mV(\'Psa\',73,\'1-\');">73</A>, but one year later he interpreted these also as collective. Thus, at one stroke individual religious experience is wiped out of the Psalter, A few scholars have accepted Smend\'s thesis; but the great majority of critics of every school have withheld their assent, and some of the best commentators have shown that theory is wholly untenable.<P>Perhaps the best monograph on the subject, for the German student, is one by Emil Balla, Das Ich der Psalmen. Balla\'s thesis is that the "I" psalms, both in the Psalter and in the other books of the Old Testament, are always to be understood as individual, with the exception of those in which from plain data in the text another interpretation of the "I" is necessary. Of 100 psalms in which "I" occurs, Balla classes 80 as easy to interpret; in the remaining 20 there might be reasonable room for difference of opinion whether the psalm was individual or collective.<P>Personification is largely used in all parts of the Old Testament. There is no room for doubt that <a onClick="return mV(\'Psa\',129,\'1-\');">Ps 129</a>, though using "I," "my" and "me," is the language of Israel as a people. The same is true of <a onClick="return mV(\'Psa\',124,\'1-\');">Ps 124</a>. The author of <a onClick="return mV(\'Psa\',126,\'1-\');">Ps 126</a> likewise associates himself with his brethren. The author of <a onClick="return mV(\'Psa\',122,\'1-\');">Ps 122</a>, however, is evidently speaking for himself individually, when he says in <a onClick="return mV(\'Psa\',122,8);">122:8</A>, "For my brethren and companions\' sakes, I will now say, Peace be within thee." The intelligent reader usually has no difficulty in deciding, after a careful reading of a psalm, whether the "I" refers to an individual Israelite or to the congregation of Israel. Sane views on this subject are important, inasmuch as Smend\'s theory does violence to the strength and power of the individual religious experience of Old Testament believers. In many portions of the Old Testament, national duties are urged, and Israel is addressed as a whole. At the same time, it would be easy to exaggerate the relatively small place that individual religion occupies in the prophetic writings and in the Law. The Psalter absolutely refuses to be shut up in the molds of a rigid nationalism.<P>VI. The Gospel in the Psalms<P>Christians love the Psalter as much as the ancient Jew could possibly have done. On every page they discover elements of religious life and experience that are thoroughly Christian. In this respect the earlier dispensation came nearer to the perfection of Christian standards than in political and social organization. Along with the New Testament, the aged Christian saint desires a copy of the Psalms. He passes easily from the Gospels to the Psalter and back again without the sense of shifting from one spiritual level to another. Religious experience was enjoyed and was portrayed by the ancient psalmists so well that no Christian book in the apostolic period was composed to displace the Psalter.<P>1. The Soul\'s Converse with God:<P>(1) The Psalmists Are Always Reverent in Their Approach to Deity.<P>Yahweh is infinitely holy (<a onClick="return mV(\'Psa\',99,3,5,9);">Ps 99:3,5,9</a>). <a onClick="return mV(\'Psa\',95,\'1-\');">Psalms 95-100</a> are models of adoration and worship.<P>(2) Thirsting for God.<P><a onClick="return mV(\'Psa\',42,\'1-\');">Psalms 42</a> and <a onClick="return mV(\'Psa\',43,\'1-\');">43</A>, which were originally one psalm, voice the longing of the individual soul for God as no other human composition has been able to express it. <a onClick="return mV(\'Psa\',63,\'1-\');">Ps 63</a> is a worthy companion psalm of yearning after God.<P>(3) Praising God.<P>More than 20 psalms have for their keynote praise to God. See especially <a onClick="return mV(\'Psa\',8,1,9);">Ps 8:1,9</a>; <a onClick="return mV(\'Psa\',57,\'7-11\');">57:7-11</a>; <a onClick="return mV(\'Psa\',71,\'22-24\');">71:22-24</a>; <a onClick="return mV(\'Psa\',95,\'1-7\');">95:1-7</a>. The first three verses of <a onClick="return mV(\'Psa\',33,\'1-\');">Psalms 33</a>; <a onClick="return mV(\'Psa\',34,\'1-\');">34</a>; <a onClick="return mV(\'Psa\',40,\'1-\');">40</a>; <a onClick="return mV(\'Psa\',92,\'1-\');">92</a> and <a onClick="return mV(\'Psa\',105,\'1-\');">105</A> reveal a rich vocabulary of praise for stammering human lips.<P>(4) Joy in God\'s house.<P><a onClick="return mV(\'Psa\',84,\'1-\');">Psalms 84</a> and <a onClick="return mV(\'Psa\',122,\'1-\');">122</A> are classic hymns expressive of joy in public worship in the sanctuary. Religious patriotism has never received a more striking expression than is found in <a onClick="return mV(\'Psa\',137,5);">Ps 137:5</a>f.<P>(5) Practicing the Presence of God.<P>In <a onClick="return mV(\'Psa\',91,\'1-\');">Psalms 91</a> and <a onClick="return mV(\'Psa\',23,\'1-\');">23</A> the worshipping saint delights his soul with the sense of God\'s protecting presence. The Shepherd, tender and true, is ever present to shield and to comfort. The shadow of the Almighty is over the saint who dwells in the secret place of the Most High.<P>(6) God in Nature.<P>The Psalmist did not go "through Nature up to Nature\'s God"; for he found God immanent in all things. He heard God\'s voice in the thunder; felt His breath in the twilight breeze; saw the gleam of His sword in the lightning\'s flash, and recognized His hand in every provision for the wants of man and the lower animals. See <a onClick="return mV(\'Psa\',104,\'1-\');">Ps 104</a>, "Hymn of Creation"; <a onClick="return mV(\'Psa\',29,\'1-\');">Ps 29</a>, "Yahweh, the God of the storm"; and the first half of <a onClick="return mV(\'Psa\',19,\'1-\');">Ps 19</a>, "the heavens are telling."<P>(7) Love for God\'s word.<P><a onClick="return mV(\'Psa\',119,\'1-\');">Ps 119</a> is the classic description of the beauty and power and helpfulness of the Word of God. The second half of <a onClick="return mV(\'Psa\',19,\'1-\');">Ps 19</a> is also a gem. <a onClick="return mV(\'Psa\',119,\'1-\');">Ps 119</a> was happily named by one of the older commentators "a holy alphabet for Zion\'s scholars." The Psalmist sings the glories of God\'s Word as a lamp to guide, as a spring of comfort, and as a fountain of hope.<P>(8) God\'s Care of All Things.<P>Faith in Divine Providence—both general and special—was a cardinal doctrine with the psalmists; yea more, the very heart of their religion. <a onClick="return mV(\'Psa\',65,\'1-\');">Ps 65</a> sings of God\'s goodness in sunshine and shower, which clothes the meadows with waving grain. The river of God is always full of water. <a onClick="return mV(\'Psa\',121,\'1-\');">Ps 121</a>, "Yahweh thy Keeper," was read by David Livingstone at family worship on the morning when he left home to go out to Africa as a missionary.<P>(9) God Our Refuge.<P>The psalmists were fond of the figure of "taking refuge in God." Yahweh was to them a rock of refuge, a stronghold, a high tower, an impregnable fortress. <a onClick="return mV(\'Psa\',46,\'1-\');">Psalms 46</a>; <a onClick="return mV(\'Psa\',61,\'1-\');">61</a> and <a onClick="return mV(\'Psa\',62,\'1-\');">62</A> exalt God as the refuge of His saints. His help is always easy to find. The might and wisdom of God do not overwhelm the inspired singers, but become a theme of devout and joyous contemplation.<P>Our Lord Jesus found in the Psalms prophecies concerning Himself (<a onClick="return mV(\'Luk\',24,\'44-47\');">Lu 24:44-47</a>).<P>2. The Messiah:<P>(1) The Suffering Saviour.<P>While hanging on the cross, the mind of our Lord turned to the Psalter. He voiced the terrible anguish of His soul in the opening words of <a onClick="return mV(\'Psa\',22,\'1-\');">Ps 22</a>, and breathed out His spirit at the end with the trustful words of <a onClick="return mV(\'Psa\',31,5);">Ps 31:5</a>. He also invited the fulfillment of a Messianic prediction in <a onClick="return mV(\'Psa\',69,21);">Ps 69:21</a> by saying, "I thirst." Isaiah and the Psalms did not fail Him in the hour of His shame, when reproach broke His heart, and there was none to comfort Him. Only <a onClick="return mV(\'Isa\',52,13);">Isa 52:13-53:12</a> surpasses <a onClick="return mV(\'Psa\',22,\'1-\');">Ps 22</a> as a picture of Calvary and an interpretation of the significance of the cross. Whether <a onClick="return mV(\'Psa\',22,\'1-\');">Ps 22</a> is a direct prophecy of Christ, or only a typically Messianic psalm, is in dispute. Every sentence can be applied to Jesus without straining its meaning. If David or some other sufferer took up his harp to sing of his own sorrows, the Spirit of God guided him to describe those of a greater.<P>Rationalistic critics insist that to apply part of a psalm to David and part to Christ introduces confusion. They ridicule theory of a "double sense," and contend that the language refers to the Psalmist and to him alone, and that the application of certain verses to our Lord Jesus is only by way of accommodation. This theory ignores the presence and activity of the Holy Spirit altogether; and when men talk of "psychological impossibilities," they may be talking nonsense; for who of us can us can understand fully the psychological experience of men while receiving revelations from God? The real author of inspired prophecies is the Holy Spirit. His meaning is that which the reverent interpreter most delights to find; and we have evidence that the Old Testament writers did not fully comprehend their own predictions concerning Christ (<a onClick="return mV(\'1Pe\',1,\'10-12\');">1Pe 1:10-12</a>). We ought not to be surprised that we should be unable to explain fully the method of the Holy Spirit\'s activity in guiding the thought of prophets and psalmists in their predictions of the sufferings of Christ and the glories that should follow them.<P>(2) The Conquering King.<P><a onClick="return mV(\'Psa\',2,\'1-\');">Psalms 2</a> and <a onClick="return mV(\'Psa\',110,\'1-\');">110</A> (with which <a onClick="return mV(\'Psa\',72,\'1-\');">Ps 72</a> may be compared) describe the Messiah as Yahweh\'s Son, a mighty. Conqueror, who shall overwhelm all foes and reign supported by Yahweh. Some will oppose the Messiah, and so perish; others will enter His army as volunteers, and in the end will enjoy the fruits of victory. "It is better to sit on His throne than to be His footstool."<P>(3) The Growing Kingdom.<P>There is room in the earth for no god other than Yahweh, the Creator and Redeemer of mankind. <a onClick="return mV(\'Psa\',47,\'1-\');">Psalms 47</a>; <a onClick="return mV(\'Psa\',67,\'1-\');">67</a>; <a onClick="return mV(\'Psa\',96,\'1-\');">96-100</A> and <a onClick="return mV(\'Psa\',117,\'1-\');">117</A> are proofs of the glorious missionary outlook of the Psalter. All nations are exhorted to forsake idols and worship Yahweh. <a onClick="return mV(\'Psa\',47,\'1-\');">Ps 47</a> closes with a picture of the whole world united in the worship of the God of Israel. <a onClick="return mV(\'Psa\',67,\'1-\');">Ps 67</a> is a bugle call to all nations to unite in the worship of the true God. <a onClick="return mV(\'Psa\',96,\'1-\');">Psalms 96-100</a> paint the character of Yahweh as a basis of appeal to all nations to turn from idols and worship the God of Abraham. <a onClick="return mV(\'Psa\',96,\'1-\');">Psalms 96</a> and <a onClick="return mV(\'Psa\',98,\'1-\');">98</A> exalt His righteousness; <a onClick="return mV(\'Psa\',97,\'1-\');">Ps 97</a> His power and dominion; <a onClick="return mV(\'Psa\',99,\'1-\');">Ps 99</a> His holiness and His fidelity to Israel, while <a onClick="return mV(\'Psa\',100,\'1-\');">Ps 100</a> tells of His goodness. Idols will finally go down before a God worthy of men\'s reverence and love.<P>3. Problem of Sin:<P>The Psalter deals with man as a sinner. Seven of the best known poems in the collection are so charged with a sense of sin and of its deadly fruits that they have been known for centuries as the Penitential Psalms (<a onClick="return mV(\'Psa\',6,\'1-\');">6</a>; <a onClick="return mV(\'Psa\',32,\'1-\');">32</a>; <a onClick="return mV(\'Psa\',38,\'1-\');">38</a>; <a onClick="return mV(\'Psa\',51,\'1-\');">51</a>; <a onClick="return mV(\'Psa\',102,\'1-\');">102</A>; <a onClick="return mV(\'Psa\',130,\'1-\');">130</a>; <a onClick="return mV(\'Psa\',143,\'1-\');">143</a>). Besides these poems of penitence and confession, there are many passages elsewhere in the Psalter which depict the sinfulness of men. And yet there are assertions of personal innocence and righteousness in the Psalter that sound like the claims of self-righteous persons (<a onClick="return mV(\'Psa\',7,\'3-9\');">7:3-9</a>; <a onClick="return mV(\'Psa\',17,\'1-5\');">17:1-5</A>; <a onClick="return mV(\'Psa\',18,\'20-24\');">18:20-24</A>; <a onClick="return mV(\'Psa\',35,\'11-17\');">35:11-17</A>; <a onClick="return mV(\'Psa\',44,\'17-22\');">44:17-22</A>). The psalmists do not mean to affirm that they are sinless before God, but rather that they are righteous in comparison with their foes who are seeking to destroy them. Sometimes they plead for mercy in the same context. The honest exegete does not find the Pharisaic temper in these noble hymns, though he is quite willing to admit that the Christian cannot well employ some of the expressions concerning his own experiences. Jesus requires a humility deeper than that which was attained in Old Testament times.<P>(1) Confessing Sin.<P>(a) Individual confession: <a onClick="return mV(\'Psa\',32,\'1-\');">Psalms 32</a> and <a onClick="return mV(\'Psa\',51,\'1-\');">51</A> are notable examples of individual confession. The cries of the penitent in <a onClick="return mV(\'Psa\',51,\'1-\');">Ps 51</a> have been repeated by thousands on bended knee as the best expression of their own sense of sin and yearning for forgiveness. (b) National confession (see especially <a onClick="return mV(\'Psa\',78,\'1-\');">78</A>; <a onClick="return mV(\'Psa\',95,\'1-\');">95</A> and <a onClick="return mV(\'Psa\',106,\'1-\');">106</A>). <a onClick="return mV(\'Psa\',105,\'1-\');">Ps 105</a> celebrates the praises of Yahweh for His unfailing kindness to Israel; <a onClick="return mV(\'Psa\',106,\'1-\');">Ps 106</a> tells the tale of Israel\'s repeated rebellion.<P>(2) Seeking Forgiveness.<P><a onClick="return mV(\'Psa\',51,\'1-\');">Ps 51</a> is the penitent\'s cry for mercy. Never did the soul of man plead more powerfully for forgiveness. God cannot despise a heart broken and crushed with the sense of sin and pleading like a lost child for home and mother.<P>(3) Conquering Sin.<P><a onClick="return mV(\'Psa\',130,\'1-\');">Psalms 130</a> begins with a cry out of the depths and ends with a note of joy over redemption from sin. The plenteous redemption of which the poet speaks includes triumph over sin in one\'s heart and life. The cries of the Old Testament saints for victory over sin were not unheeded (<a onClick="return mV(\'Psa\',139,23);">139:23</a>f; <a onClick="return mV(\'Psa\',19,13);">19:13</a>; <a onClick="return mV(\'Psa\',119,133);">119:133</a>). The author of <a onClick="return mV(\'Psa\',84,\'1-\');">Ps 84</a> truthfully depicts the life of Yahweh\'s worshippers, "They go from strength to strength." Victory over sin is sure in the end.<P>4. Wrestling with Doubts:<P>The ancient Hebrew seems to have had no temptation to atheism or pantheism. The author of Ecclesiastes felt the pull of agnosticism and materialism (<a onClick="return mV(\'Ecc\',3,\'19-21\');">Ec 3:19-21</a>; <a onClick="return mV(\'Ecc\',9,\'2-10\');">9:2-10</a>), but in the end he rejected both (<a onClick="return mV(\'Ecc\',12,7,13);">12:7,13</a>f). The ancient Hebrew found in the world about him one difficulty which seemed almost insuperable. He believed in the wisdom and power and justice of God. How then could it be possible, in a world over which a wise and just God presides, that the wicked should prosper and the righteous suffer? This is the question which is hotly debated by Job and his three friends. A partial solution of the difficulty may be seen in <a onClick="return mV(\'Psa\',37,\'1-\');">Ps 37</a>, theme of which is \'the brevity of godless prosperity, and the certainty that well-doing will lead to well-being.\' A better solution is attained in <a onClick="return mV(\'Psa\',73,\'1-\');">Ps 73</a>, which depicts God\'s attitude toward the wicked and toward the righteous. The wicked will be suddenly overthrown, while the righteous will live forever in the enjoyment of communion with God. Not even death can sever him from God. The fleeting pleasures of proud scoffers pale into insignificance before the glories of everlasting fellowship with God.<P>5. Out of the Depths:<P>(1) Out of the depths of persecution and slander the author of <a onClick="return mV(\'Psa\',31,\'1-\');">Ps 31</a> climbed into his refuge, as he exclaimed, "In the covert of thy presence wilt thou hide them from the plottings of man: Thou wilt keep them secretly in a pavilion from the strife of tongues."<P>(2) <a onClick="return mV(\'Psa\',77,\'1-\');">Ps 77</a> is a stairway out of depths of suspense and the anxiety. The experience of the author well illustrates Maclaren\'s epigram, "If out of the depths we cry, we shall cry ourselves out of the depths."<P>(3) The author of <a onClick="return mV(\'Psa\',116,\'1-\');">Ps 116</a> looked into the jaws of death. Perhaps no other psalm has so much to say of physical death. The singer is filled with gratitude as he reviews the deadly peril from which Yahweh has saved him.<P>(4) <a onClick="return mV(\'Psa\',88,\'1-\');">Ps 88</a> is unique, because it is sad and plaintive from beginning to end. The singer has long cried for deliverance from bodily weakness and from loneliness.<P>(5) Out of the depths of disaster and defeat the authors of <a onClick="return mV(\'Psa\',60,\'1-\');">Psalms 60</a>; <a onClick="return mV(\'Psa\',74,\'1-\');">74</a>; <a onClick="return mV(\'Psa\',79,\'1-\');">79</a> and <a onClick="return mV(\'Psa\',89,\'1-\');">89</a> cry to God. The Babylonian exile was a sore trial to patriotic Jews. They mourned over the destruction of their beautiful temple and the holy city in which their fathers had worshipped. The author of <a onClick="return mV(\'Psa\',60,\'1-\');">Ps 60</a> closes with hope and confidence (<a onClick="return mV(\'Psa\',60,12);">60:12</A>).<P>6. Ethical Ideals:<P>"Unquestionably in the Psalms we reach the high-water mark of Old Testament practical piety, the best that, the Old Testament can exhibit of heart-religion."<P>(1) What Sort of Man, Then, Would the Psalms Acclaim as Good?<P><a onClick="return mV(\'Psa\',1,\'1-\');">Ps 1</a> opens with a vivid contrast between the righteous and the wicked. <a onClick="return mV(\'Psa\',15,\'1-\');">Ps 15</a> is the most complete description of a good man to be found in the Psalter. The picture is drawn in answer to the question, What sort of man will Yahweh receive as an acceptable worshipper? The morality of the Bible is rooted in religion, and the religion of the Bible blossoms and bears fruit in the highest ethics known to man. <a onClick="return mV(\'Psa\',131,\'1-\');">Ps 131</a> makes humility a prime quality in real goodness. <a onClick="return mV(\'Psa\',133,\'1-\');">Ps 133</a> magnifies the spirit of brotherly love. The social virtues had a large place in the psalmists\' ideals of goodness. Humility and brotherly love are a guaranty of peace in the home, the church and the nation. <a onClick="return mV(\'Psa\',24,4);">Ps 24:4</a> is a compend of ethics in a single sentence.<P>(2) The Ethics of Speech.<P>Even a casual reading of the Psalms must impress one with the fact that the psalmists felt very keenly the lies and slanders and boastings of the wicked. Stirred with righteous indignation, they call upon God to awake and confront the blatant foes of truth and righteousness (see especially <a onClick="return mV(\'Psa\',12,\'1-\');">Psalms 12</a>; <a onClick="return mV(\'Psa\',52,\'1-\');">52</a> and <a onClick="return mV(\'Psa\',120,\'1-\');">120</A>).<P>(3) Ministering to the Needy.<P>Bible readers are familiar with the ideal of the good man in <a onClick="return mV(\'Job\',29,\'12-16\');">Job 29:12-16</a>; <a onClick="return mV(\'Job\',31,\'13-22\');">31:13-22</a>. <a onClick="return mV(\'Psa\',82,\'1-\');">Ps 82</a> is a plea for justice. Venal judges are one day to confront the great Judge. Men need fair play first. Perhaps there will then be no occasion for the exercise of almsgiving. <a onClick="return mV(\'Psa\',41,\'1-\');">Ps 41</a> is a plea for kindness. The Christian reader is reminded of the words of Jesus, "Blessed are the merciful: for they shall obtain mercy." The Ideal Ruler is both just and beneficent (<a onClick="return mV(\'Psa\',72,2,12,13,14);">Ps 72:2,12-14</a>).<P>7. Praying against the Wicked:<P>To be a good lover one must know how to hate. The excitement of battle throbs in many of the Psalms. The enemies of righteousness are victorious and defiant. Their taunts drive the psalmists to importunate prayer. Yahweh\'s honor is at stake and His cause in peril. More than 20 psalms contain prayer for the defeat and overthrow of the wicked. Warlike imagery of the boldest kind is found in many of the imprecatory psalms. To the Christian reader some of the curses pronounced against the wicked are startling and painful. Many are led to wonder how such imprecations ever found a place in the Bible. The most severe curses are found in <a onClick="return mV(\'Psa\',35,\'1-\');">Psalms 35</a>; <a onClick="return mV(\'Psa\',69,\'1-\');">69</a> and <a onClick="return mV(\'Psa\',109,\'1-\');">109</a>. Maclaren\'s words are well worth reading as an introduction to <a onClick="return mV(\'Psa\',109,\'1-\');">Ps 109</a>: "For no private injuries, or for those only in so far as the suffering singer is a member of the community which represents God\'s cause, does he ask the descent of God\'s vengeance, but for the insults and hurts inflicted on righteousness. The form of these maledictions belongs to a lower stage of revelation; the substance of them, considered as passionate desires for the destruction of evil, burning zeal for the triumph of truth, which is God\'s cause, and unquenchable faith that He is just, is a part of Christian perfection." Two remarks may be made, as suggestions to the student of the Psalter:<P>(1) We ought to study the psalms of imprecation in the light of their origin. They are poetry and not prose; and De Witt reminds us that the language of oriental poetry is that of exaggerated passion. Some of these imprecations pulse with the throb of actual battle. Swords are drawn, and blood is flowing. The champion of Yahweh\'s people prays for the overthrow of His foes. The enemies cursed are men who break every moral law and defy God. The Psalmist identifies himself with Yahweh\'s cause. "Do not I hate them, O Yahweh, that hate thee? And am not I grieved with those that rise up against thee? I hate them with perfect hatred: They are become mine enemies" (<a onClick="return mV(\'Psa\',139,21);">Ps 139:21</a>f). Thus the psalmists pray with God\'s glory in view.<P>(2) We ought to use the imprecatory psalms in the light of our Lord\'s teaching. We cannot pronounce curses on our personal enemies. This heavenly artillery may be turned upon the saloon, the brothel and the gambling hell, though we must not forget to pray for the conversion of the persons who are engaged in these lines of business.<P>8. The Future Life:<P>"If a man die, shall he live again?" What answer do the Psalms give to Job\'s cry for light? There are expressions in the Psalter which seem to forbid hope of a blessed immortality (<a onClick="return mV(\'Psa\',6,5);">Ps 6:5</a>; <a onClick="return mV(\'Psa\',30,9);">30:9</a>; <a onClick="return mV(\'Psa\',39,13);">39:13</a>; <a onClick="return mV(\'Psa\',115,17);">115:17</a>). The psalmists are tempted to fear that fellowship with God would cease at death. Let this fact, however, be borne in mind, that not one of the poets or prophets of Israel settled down to a final denial of immortality. Some of them had moments of joyous assurance of a blessed life of fellowship with God in the world to come. Life everlasting in the presence of Yahweh is the prospect with which the author of <a onClick="return mV(\'Psa\',16,\'1-\');">Ps 16</a> refreshes himself (<a onClick="return mV(\'Psa\',16,\'8-11\');">16:8-11</a>). The vision of God\'s face after the sleep of death is better than worldly prosperity (<a onClick="return mV(\'Psa\',17,\'13-15\');">17:13-15</A>). The author of <a onClick="return mV(\'Psa\',73,\'1-\');">Ps 73</a> wins rest for his distressed mind in the assurance of a fellowship with God that cannot be broken (<a onClick="return mV(\'Psa\',73,\'23-26\');">73:23-26</A>). God will finally take the singer to Himself. It has been well said that <a onClick="return mV(\'Psa\',49,\'1-\');">Ps 49</a> registers the high-water mark of Old Testament faith in a future life. Death becomes the shepherd of the wicked who trusted in riches, while God redeems the righteous from the power of Sheol and takes the believing soul to Himself.<P>LITERATURE.<P>One of the most elaborate and informing articles on the history of the exposition of the Psalms is found in the Introduction to Delitzsch\'s Commentary (pp. 64-87, English translation). Among the Fathers, Jerome, Chrysostom and Augustine are most helpful. Among the Reformers, Calvin, the prince of expositors, is most valuable. Among modern commentators, Ewald and Delitzsch are scholarly and sane. Their commentaries are accessible in English translation. Hupfeld is strong in grammatical exegesis. Baethgen (1904) is very thorough. Among recent English and American commentators, the most helpful are Perowne (6th edition, 1866), Maclaren in Expositor\'s Bible (1890-92), and Kirkpatrick in Cambridge Bible (1893-95). Briggs in ICC (1906) is learned; Davison, New Century Bible, is bright and attractive. Spurgeon, Treasury of David, is a valuable compilation, chiefly from the Puritan divines. Cheyne, The Book of Psalms (1888) and The Origin and Religious Contents of the Psalter (1891), is quite radical in his critical views. Binnie, The Psalms: Their Origin, Teachings and Use (1886), is a fine introduction to the Psalter. Robertson, The Poetry and Religion of the Psalms (1898), constructs an able argument against recent radical views.``156';
