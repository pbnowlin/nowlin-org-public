isbe[7101]='Principality`prin-si-pal\'-i-ti: In the Old Testament the word occurs but once (<a onClick="return mV(\'Jer\',13,18);">Jer 13:18</a>, "your principalities shall come down"). Here the King James Version margin "head tires" is properly preferred by the Revised Version (British and American) for mera\'ashoth (from ro\'sh, "head"), "head-parts."<P>In the New Testament "principality" occurs for arche, "rule," generally in the plural, referring<P>(a) to men in authority (<a onClick="return mV(\'Tts\',3,1);">Tit 3:1</a>, "Put them in mind to be subject (the King James Version; "in subjection," the Revised Version (British and American)) to principalities (the King James Version; "rulers," the Revised Version (British and American)), and powers" (the King James Version; "to authorities," the Revised Version (British and American));<P>(b) to superhuman agencies, angelic or demonic (<a onClick="return mV(\'Rom\',8,38);">Ro 8:38</a>; <a onClick="return mV(\'Eph\',3,10);">Eph 3:10</a>; <a onClick="return mV(\'Eph\',6,12);">6:12</a>; <a onClick="return mV(\'Col\',1,16);">Col 1:16</a>; <a onClick="return mV(\'Col\',2,10,15);">2:10,15</a>). Paul was keenly sensible of the dualism of mind and body and of the law in his members warring against the law of his mind (<a onClick="return mV(\'Rom\',7,23);">Ro 7:23</a>), and of the temporary victory of the evil, residing in the flesh, over the good of the spirit (<a onClick="return mV(\'Rom\',7,14);">Ro 7:14</a>).<P>This dualism was objectified in Zoroastrianism, and among the Babylonians the several heavenly bodies were regarded as ruled by spirits, some good, some evil. The same belief, appropriated by the Jews during the captivity, appears also in Greek thought, as e.g. in Plato and later in the Stoics. The higher spheres, which hold the even tenor of their way, were in general regarded as ruled by good spirits; but in the sublunar sphere, to which the earth belongs, ill-regulated motions prevail, which must be due to evil spirits. The perversities of human conduct, in particular, thwarting, as was thought, the simple, intelligible divine plan, were held to be subject to rebellious powers offering defiance to God. While Paul clearly recognized a hierarchy of such powers (<a onClick="return mV(\'Col\',1,16);">Col 1:16</a>, "thrones or dominions or principalities or powers"), it is not certain that he had elaborated a system of eons to serve the purposes of metaphysical theology and ethics, such as appears among the Gnostics, although they evidently believed they were developing his thought. In <a onClick="return mV(\'1Cr\',2,6);">1Co 2:6</a> he repudiates the wisdom of this world (aion) and of the rulers of this world aion), and declares (<a onClick="return mV(\'Eph\',6,12);">Eph 6:12</a>) that the Christian has to contend with "the world-rulers of this darkness," and proclaims the triumph of Christ over "the principalities and the powers" in the forgiveness of sins (<a onClick="return mV(\'Col\',2,15);">Col 2:15</a>). The same personification of such agencies or powers appears also in another passage, where the rendering of English Versions of the Bible obscures it (<a onClick="return mV(\'Eph\',1,20,21);">Eph 1:20,21</a> "when he raised him (Christ) from the dead, and made him to sit at his right hand in the heavenly places, far above all (read "every") rule (Revised Version; "principality," the King James Version), and authority, and power, and dominion, and every name that is named not only in this world (aion), but also in that which is to come"). Not the least interesting passage is <a onClick="return mV(\'Eph\',3,10);">Eph 3:10</a>, where the church is said to be the means of revealing to "the principalities and the powers in the heavenly places" "the manifold wisdom of God." One naturally inquires what was the purpose of this revelation. Was it to effect a redemption and reconciliation of these demonic powers to God? To this question Paul supplies no answer.`<a href="./study/isbe/search.html?string=ANGEL">ANGEL</a>; <a href="./study/isbe/search.html?string=SATAN">SATAN</a>`75';
isbe[7102]='Principles`prin\'-si-p\'-lz: Found twice (<a onClick="return mV(\'Hbr\',5,12);">Heb 5:12</a>; <a onClick="return mV(\'Hbr\',6,1);">6:1</a>). The Greek word (stoicheion) is also translated in the King James Version as "elements" and "rudiments." As rendered in He, its meaning is clearly related to the elementary knowledge of Christian truth or doctrine.`<a href="./study/isbe/search.html?string=ELEMENTS">ELEMENTS</a>; <a href="./study/isbe/search.html?string=RUDIMENTS">RUDIMENTS</a>`1';
isbe[7103]='Print; Printing; Printed`print, prin\'-ting, prin\'-ted: Printing is the art of multiplying records—the "art of writing with many pens" (Jewish Encyclopedia, XII, 295), or wholesale writing.<P>The art of making original records is writing. This, however, is a slow process. It involves tracing each letter and part of a letter through from beginning to end by the moving point of chisel, pen, or other instrument, and this process must be repeated with every copy. As soon, therefore, as occasion arose for frequently repeating the record, many ways were devised to save the labor of forming each symbol separately. All these ways involve making a character or a series of characters on a single surface and transferring as a whole to another surface. Neither "pressure," as some say, nor "ink," as others, is essential to the process, for printing from a photographic negative takes no pressure, and printing for the blind takes no ink. Any process which transfers a whole surface is printing.<P>The earliest use of printing seems to have been for painting the face or body with ownership, tribal, trophy, or ceremonial marks for worship, war, mourning, etc. This paint might be temporary or pricked in by the tattoo process. Tattooing itself is rather a writing than a printing process, but may be either, according as the color is laid on by drawing or by the "pintadera." The "pintadera" or "stamp used to impress patterns upon the skin" is best known from the Mexican and South American examples, but in recent years it has been found in deposits all over the Mediterranean region (North Italy, Austria, Hungary, Mycenae, Crete, Egypt) and in Borneo at least. Many of these specimens are from the Neolithic or Copper age. Both in South America and in Neolithic Liguria, some of these stamps were cylindrical and "were used like a printer\'s roller" (Mosso, The Dawn of Mediterranean Civilization, 254-61, with many illustrations, and Frobenius, Childhood of Man, figure 31, "Dayak block for painting the body").<P>The injunction of <a onClick="return mV(\'Lev\',19,28);">Le 19:28</a>, which is translated "print," is commonly, and probably rightly, in view of the Hebrew word, supposed to refer to the permanent marks of tattooing which may or may not have been made by this printing process. <a onClick="return mV(\'Job\',13,27);">Job 13:27</a> the King James Version, which speaks of printing upon the heels or soles of the feet, has been quite changed in the Revised Version (British and American), and, if the idea is one of printing at all, it refers rather to branding than stamping with color.<P>The use of the inkhorn in setting the mark upon the forehead (<a onClick="return mV(\'Eze\',9,3,4,6);">Eze 9:3,4,6</a>) certainly points to marking with color rather than branding. See <a href="./study/isbe/search.html?string=INK-HORN">INK-HORN</a>. This may, of course, have been drawing rather than printing, but, on the other hand, the sealing of the servants of God on their foreheads (<a onClick="return mV(\'Rev\',7,4);">Re 7:4</a>; <a onClick="return mV(\'Rev\',9,4);">9:4</a>) necessarily means printing rather than drawing, and probably printing rather than branding, for the use of the seal with color had long been common. The marks of the beast upon the forehead and upon the hand in <a onClick="return mV(\'Rev\',13,\'1-\');">Re 13</a>; <a onClick="return mV(\'Rev\',14,\'1-\');">14</a>; <a onClick="return mV(\'Rev\',15,\'1-\');">15</a>; <a onClick="return mV(\'Rev\',16,\'1-\');">16</a>; <a onClick="return mV(\'Rev\',19,\'1-\');">19</a>; <a onClick="return mV(\'Rev\',20,\'1-\');">20</a>, more likely refer to branding, as the Greek word points more or less in this direction, while the stigmata of <a onClick="return mV(\'Gal\',6,17);">Ga 6:17</a> may also point to branding. Branding was at all events also a common method of printing characters on the flesh in Biblical times (<a onClick="return mV(\'Isa\',3,24);">Isa 3:24</a>; perhaps <a onClick="return mV(\'Exd\',21,25);">Ex 21:25</a>; a branding on the forehead, Code of Hammurabi section 127; branding of a slave sections 226, 227). The reference in <a onClick="return mV(\'Jhn\',20,25);">Joh 20:25</a> is, of course, to the clearly visible marks or scars left by the nails in the hands.<P>See <a href="./study/isbe/search.html?string=MARK">MARK</a>.<P>The use of seals is a true printing process, whether they are used with color, as they were both in Crete and Egypt almost from the beginning of history, or impressed on clay, wax, or other plastic substances. Mention of seals is frequent in the Bible (see <a href="./study/isbe/search.html?string=SEAL">SEAL</a>). A new interest has been given to this aspect of the matter by the sealings discovered in Ahab\'s palace and other excavations throughout Palestine, which are forming one of the most useful classes of modern inscriptions.<P>Both stamp and seal were used throughout the Middle Ages, the latter abundantly, and the stamp at least occasionally, for stamping the capital letters in Biblical and other manuscripts, as well as for various other purposes.<P>Modern printing begins with the carving of whole pages and books on blocks of wood (xylography), or metal plates for printing (chalcography). This method was quite early practiced by the Chinese, and began to be common in Europe in the early 15th century, most of the books printed by it having to do with Biblical topics (Biblia pauperum, etc.).<P>It was only with the invention of movable type about the middle of the 15th century that the multiplying of books by writing began to come to an end. The printing with movable type is also closely associated with Biblical study, the Gutenberg Psalter and the Gutenberg Bible standing with most for the very beginning of modern printing.<P>For the printed editions of the Hebrew and Greek originals, and the various versions, see articles on <a href="./study/isbe/search.html?string=TEXTUAL+CRITICISM">TEXTUAL CRITICISM</a> and allied topics in this encyclopedia, with their literature. The article on "Typography" in Jewish Encyclopedia is of unusual excellence, and the general literature of printing given in Encyclopedia Britannica (11th edition), at the end of the first part of the article on "Typography," is full and good. Compare also <A href="./study/isbe/search.html?string=BOOK">Book</a> in this encyclopedia and its literature, especially Hortzschansky, supplementing the bibliography of Encyclopedia Britannica (11th edition).``147';

isbe[7106]='Prison, Spirits In`The phrase occurs in the much-disputed passage, <a onClick="return mV(\'1Pe\',3,\'18-20\');">1Pe 3:18-20</a>, where the apostle, exhorting Christians to endurance under suffering for well-doing, says: "Because Christ also suffered for sins once, the righteous for the unrighteous, that he might bring us to God; being put to death in the flesh, but made alive in the spirit; in which also he went and preached unto the spirits in prison, that aforetime were disobedient, when the longsuffering of God waited in the days of Noah, while the ark was a preparing, wherein few, that is, eight souls, were saved through water." It is plain that in this context "the spirits in prison" (tois en phulake pneumasin) denote the generation who were disobedient in the days of Noah, while the words "spirits" and "in prison" refer to their present disembodied condition in a place of judgment in the unseen world (compare <a onClick="return mV(\'2Pe\',2,\'4-9\');">2Pe 2:4-9</a>). The crucial point in the passage lies in what is said of Christ\'s preaching to these spirits in prison. The interpretation which strikes one most naturally is that Christ, put to death in the flesh, and made alive again in the spirit, went in this spiritual (disembodied) state, and preached to these spirits, who once had been disobedient, but are viewed as now possibly receptive of His message This is the idea of the passage taken by the majority of modern exegetes, and it finds support in what is said in <a onClick="return mV(\'1Pe\',4,6);">1Pe 4:6</a>, "For unto this end was the gospel preached even to the dead, that they might be judged indeed according to men in the flesh, but live according to God in the spirit." On this basis is now often reared a mass of doctrine or conjecture respecting "second probation," "restoration," etc.—in part going back to patristic times—for which the passage, even so taken, affords a very narrow foundation (see on this view, Plumptre, The Spirits in Prison; Dorner, System of Christian Doctrine, IV, 130-32; E. White, Life in Christ, chapter xxii). It must be admitted, however, that, on closer examination, the above plausible explanation is compassed with many difficulties. A preaching of Christ in Hades is referred to in no other passage of Scripture, while Peter appears to be speaking to his readers of something with which they are familiar; it seems strange that these antediluvians should be singled out as the sole objects of this preaching in the spiritual world; the word "made alive" does not exegetically refer to a disembodied state, but to the resurrection of Christ in the body, etc. Another line of interpretation is therefore preferred by many, who take the words "in which also he went," to refer, not to a disembodied manifestation, but to the historical preaching to the antediluvian generation through Noah while they yet lived. In favor of this view is the fact that the apostle in <a onClick="return mV(\'1Pe\',1,11);">1Pe 1:11</a> regards the earlier prophetic preaching as a testifying of "the Spirit of Christ," that God\'s long-suffering with Noah\'s generation is described in <a onClick="return mV(\'Gen\',6,5);">Ge 6:5</a>, which Peter has doubtless in his mind, as a striving of God\'s Spirit, and that in <a onClick="return mV(\'2Pe\',2,5);">2Pe 2:5</a> there is another allusion to these events, and Noah is described as "a preacher of righteousness." The passage, <a onClick="return mV(\'1Pe\',4,6);">1Pe 4:6</a>, may have the more general meaning that Christians who have died are at no disadvantage in the judgment as compared with those who shall be alive at the Parousia (compare <a onClick="return mV(\'1Th\',4,\'15-18\');">1Th 4:15-18</a>). (For an exposition of this view, with a full account of the interpretations and literature on the subject, compare Salmond\'s Christian Doctrine of Immortality, 4th edition, 364-87.)`<a href="./study/isbe/search.html?string=ESCHATOLOGY+OF+THE+NEW+TESTAMENT">ESCHATOLOGY OF THE NEW TESTAMENT</a>`132';
isbe[7107]='Prison; Prisoner`priz\'-n, priz\'-\'-n-er, priz\'-ner (there are various Hebrew words which are rendered "prison" in the King James Version, among them:<P>1. Hebrew Words:<P>(1) cohar, "round house," "fortress" (8 times in Genesis), (2) kele\' "restraint," "confinement" (12 times: in historic books, Isaiah, Jeremiah, with "house"), (3) mattarah, "guard," "sentry" (13 times in Jeremiah and Nehemiah), (4) mahaphekheth, "distorting," i.e. stocks or pillory (4 times), (5) \'ecur, "bond," "fetters" (<a onClick="return mV(\'Ecc\',4,14);">Ec 4:14</a>; <a onClick="return mV(\'Jer\',37,15);">Jer 37:15</a>); "ward" in the King James Version is usually the rendering for mishmar):<P>2. In Early Times:<P>The earliest occurrence of the word "prison" in the King James Version is found in the narrative of Joseph\'s life in Egypt (the Jahwist). The term used, namely, cohar, means perhaps "round house" or "tower." It seems probable that among the Hebrews there were no special buildings erected as "jails" in the premonarchical period, and perhaps not before the post-exilic period, when the adoption of the civic institutions and customs of surrounding nations prevailed. In Egypt and Assyria, on the contrary, there were probably public buildings corresponding to our modern jails. Among the Hebrews, rooms in connection with the royal palace or the residence of prominent court officials would be used for the purpose.<P>3. Joseph in Egypt:<P>According to one narrative (Jahwist) in Genesis the prison in which Joseph was confined had a "keeper," while according to another narrative (the Elohist) the offending members of the royal household, namely, the royal butler and the royal baker, were placed "in ward" with the "captain of the guard" in charge, i.e. in some part of the royal palace. This is still more probable if, instead of "captain of the guard," we should translate "chief of the cooks" i.e. superintendent of the royal kitchen.<P>4. Causes of Imprisonment:<P>It was often necessary to restrict the liberty of individuals who for various causes were a menace to those in authority, without inflicting any corporal punishment, e.g. Joseph\'s brethren were kept "in ward" three days (<a onClick="return mV(\'Gen\',42,19);">Ge 42:19</a>); Shimei was forbidden to pass beyond the boundary of Jerusalem (<a onClick="return mV(\'1Ki\',2,36);">1Ki 2:36</a>); the person who was caught gathering sticks on the Sabbath was put "in ward" pending his trial (<a onClick="return mV(\'Num\',15,34);">Nu 15:34</a>). In the monarchical period, prophets who criticized the throne were put in prison, e.g. Micaiah by Ahab (<a onClick="return mV(\'1Ki\',22,27);">1Ki 22:27</a>), Hanani by Asa (<a onClick="return mV(\'2Ch\',16,10);">2Ch 16:10</a>). Hoshea, after his abortive effort to institute an alliance with So or Seve, king of Egypt, was shut up in prison by Shalmaneser (<a onClick="return mV(\'2Ki\',17,4);">2Ki 17:4</a>); compare also <a onClick="return mV(\'2Ki\',25,27);">2Ki 25:27</a> (Jehoiachin in Babylon); <a onClick="return mV(\'Jer\',52,11);">Jer 52:11</a> (Zedekiah in Babylon).<P>5. Under the Monarchy:<P>The Book of Jeremiah throws considerable light on the prison system of Jerusalem in the later monarchical period. The prophet was put "in the stocks that were in the upper gate of Benjamin, which was in the house of Yahweh" (<a onClick="return mV(\'Jer\',20,2);">20:2</A>). Mere imprisonment was not adequate punishment for the prophet\'s announcement of Judah\'s doom; it was necessary to have recourse to the pillory. During the siege of Jerusalem Jeremiah was confined in the "court of the guard, which was in the king of Judah\'s house" (<a onClick="return mV(\'Jer\',32,2);">32:2</A>, etc.). The "court of the guard" was evidently the quarters of the sentry who guarded the royal palace. According to the narrative of <a onClick="return mV(\'Jer\',37,\'1-\');">Jeremiah 37</a>, the prophet was arrested on a charge of treachery and put in prison "in the house of Jonathan the scribe" (<a onClick="return mV(\'Jer\',37,15);">37:15</A>). This verse does not necessarily mean that a private house was used as a prison. The words are capable of another interpretation, namely, that a building known as the "house of Jonathan the scribe" had been taken over by the authorities and converted into a jail. We read in the following verse that the house had a "dungeon" (literally, "house of the pit") and "cabins" or "cells."<P>6. The Treatment of Prisoners:<P>The data are not sufficient to enable us to give any detailed description of the treatment of prisoners. This treatment varied according to the character of the offense which led to incarceration. Samson during the period of his imprisonment was compelled to do hard labor (<a onClick="return mV(\'Jdg\',16,21);">Jud 16:21</a>). Grinding was the occupation of women, and marked the depth of Samson\'s humiliation. Dangerous persons were subjected to various kinds of physical mutilation, e.g. Samson was deprived of his sight. This was a common practice in Assyria (<a onClick="return mV(\'2Ki\',25,7);">2Ki 25:7</a>). The thumbs and great toes of Adonibezek were cut off to render him incapable of further resistance (<a onClick="return mV(\'Jdg\',1,6);">Jud 1:6</a>).<P>Various forms of torture were in vogue. Hanani the seer was put into the pillory by Asa (for "in a prison house" we should render "in the stocks"; see the Revised Version margin). In <a onClick="return mV(\'Jer\',29,26);">Jer 29:26</a> for "prison," we should render "stocks" (so the Revised Version (British and American)) or "pillory," and for "stocks," "collar" (as in the Revised Version margin). the King James Version renders a different Hebrew word by "stocks" in Job (<a onClick="return mV(\'Job\',13,27);">13:27</a>; <a onClick="return mV(\'Job\',13,11);">33:11</a>). There was a special prison diet (<a onClick="return mV(\'1Ki\',22,27);">1Ki 22:27</a>), as well as a prison garb (<a onClick="return mV(\'2Ki\',25,29);">2Ki 25:29</a>).<P>7. Other Hebrew Words:<P>There are other Hebrew words rendered "prison" (sometimes incorrectly) in the King James Version. In <a onClick="return mV(\'Psa\',142,7);">Ps 142:7</a>, the word which is translated "prison" means a "place of execution," and is derived from a root which denotes, for instance, the isolation of the leper (<a onClick="return mV(\'Lev\',13,5);">Le 13:5</a>; compare <a onClick="return mV(\'Isa\',24,22);">Isa 24:22</a>; <a onClick="return mV(\'Isa\',42,7);">42:7</a>). In <a onClick="return mV(\'Isa\',53,8);">Isa 53:8</a> "oppression" not "prison" is the correct translation while in <a onClick="return mV(\'Isa\',61,1);">Isa 61:1</a> the Hebrew denotes "opening of the eyes," rather than "opening of the prison." Prisoners are promised "light after darkness, gleam after gloom."<P>8. In the New Testament:<P>In the New Testament "prison" generally occurs for the Greek word phulake, which corresponds to the Hebrew word mishmar, referred to above (<a onClick="return mV(\'Mat\',5,25);">Mt 5:25</a>; <a onClick="return mV(\'Mar\',6,17);">Mr 6:17</a>; <a onClick="return mV(\'Luk\',3,20);">Lu 3:20</a>; <a onClick="return mV(\'Act\',5,19);">Ac 5:19</a>; <a onClick="return mV(\'1Pe\',3,19);">1Pe 3:19</a>). In <a onClick="return mV(\'Rev\',18,2);">Re 18:2</a>, the King James Version renders this word by two different words, namely, "hold" and "cage"; the Revised Version (British and American) employs "hold" in each case (the Revised Version margin "prison"). In one passage "ward" is the rendering in the King James Version (<a onClick="return mV(\'Act\',12,10);">Ac 12:10</a>). In connection with the imprisonment of John the term used is desmoterion, "place of bonds" or "fetters" (<a onClick="return mV(\'Mat\',11,2);">Mt 11:2</a>); the same word is used in the case of Peter and John (<a onClick="return mV(\'Act\',5,21,23);">Ac 5:21,23</a>), and of Paul and Silas (<a onClick="return mV(\'Act\',16,26);">Ac 16:26</a>). But the more common term is also found in these narratives. In <a onClick="return mV(\'Act\',12,17);">Ac 12:17</a> "prison" renders a Greek word which means "dwelling." In <a onClick="return mV(\'Act\',5,18);">Ac 5:18</a> the King James Version, "prison" is the rendering for another Greek word, namely, teresis, "watching" or "ward" (the Revised Version (British and American) "ward"). In <a onClick="return mV(\'Act\',4,3);">Ac 4:3</a>, the King James Version employs "hold" as the rendering for the same word. This would correspond to the modern "police station" or "lockup."`<a href="./study/isbe/search.html?string=PUNISHMENTS">PUNISHMENTS</a>`103';
isbe[7108]='Privy; Privily`priv\'-i, priv\'-i-li: These words are obsolete in modern English and are replaced by "secret," "secretly," rather than by the cognates "private," "privately." the Revised Version (British and American) usually has not altered the King James Version\'s use of the word, but in <a onClick="return mV(\'Psa\',11,2);">Ps 11:2</a> has substituted "in darkness" and in <a onClick="return mV(\'Jdg\',9,31);">Jud 9:31</a> uses "craftily," margin "in Tormah" (see <a href="./study/isbe/search.html?string=TORMAH">TORMAH</a>). In <a onClick="return mV(\'Eze\',21,14);">Eze 21:14</a>, the King James Version "entereth into their privy chambers," "privy" is a gloss, omitted in the Revised Version (British and American). "To be privy to a thing" (<a onClick="return mV(\'1Ki\',2,44);">1Ki 2:44</a>; <a onClick="return mV(\'Act\',5,2);">Ac 5:2</a>) is simply "to know" it; in <span class="noTag">The Wisdom of Solomon 8:4</span>, the Revised Version (British and American) has changed the phrase into "be initiated into."``1';
isbe[7109]='Prize`priz: Two Greek words are so rendered in English Versions of the Bible:<P>(1) brabeion, the award to the victor in the Greek games, consisting of a garland of bay, olive, or pine; so called because it was given by the brabeus, the adjudicator who assigned the prize at the games (Vulgate bravium, from which may be derived the English "brave" = originally gaily dressed, handsome). Used literally in <a onClick="return mV(\'1Cr\',9,24);">1Co 9:24</a>, and figuratively of the heavenly reward for Christian character in <a onClick="return mV(\'Phl\',3,14);">Php 3:14</a>.<P>(2) harpagmos, in the English Revised Version of <a onClick="return mV(\'Phl\',2,6);">Php 2:6</a>, "counted it not a prize to be on an equality with God." The termination -uos, -mos, would lead us to expect the active sense: "an act of grasping," "plundering" (the King James Version "robbery"), which would imply that Christ did not deem it an act of usurpation to claim equality with God, for such equality was His inherent right. But the context demands a reference "not to the right which He claimed, but to the dignity which He renounced" (Lightfoot); hence, the majority of modern expositors take the word in a passive sense (= harpagma): "a thing to be seized, prized, retained at all costs as a booty" (the English Revised Version "a prize," the American Standard Revised Version "a thing to be grasped"), implying that Christ did not regard equality with God as a thing to be clutched greedily, but waived His rights (see Lightfoot on <a onClick="return mV(\'Phl\',2,6);">Php 2:6</a>). The verb "to prize" occurs only in <a onClick="return mV(\'Zec\',11,13);">Zec 11:13</a>.`<a href="./study/isbe/search.html?string=GRASP">GRASP</a>; <a href="./study/isbe/search.html?string=HUMILIATION+OF+CHRIST">HUMILIATION OF CHRIST</a>; <a href="./study/isbe/search.html?string=KENOSIS">KENOSIS</a>`49';
isbe[7110]='Probation, Second`pro-ba\'-shun, sek\'-und.`<a href="./study/isbe/search.html?string=ESCHATOLOGY+OF+THE+NEW+TESTAMENT">ESCHATOLOGY OF THE NEW TESTAMENT</a>`1';
isbe[7111]='Prochorus`prok\'-o-rus (Prochoros): One of "the seven" chosen by the Christian community in Jerusalem to superintend the dispensing of charity to the widows and other poor (<a onClick="return mV(\'Act\',6,5);">Ac 6:5</a>). The name is Greek, and he may have been a Hellenist. According to tradition he became bishop of Nicomedia and died a martyr at Antioch.``1';
isbe[7112]='Proconsul`pro-kon\'-sul (anthupatos (<a onClick="return mV(\'Act\',13,7);">Ac 13:7</a>; <a onClick="return mV(\'Act\',18,12);">18:12</a>); the King James Version deputy).`<a href="./study/isbe/search.html?string=PROVINCE">PROVINCE</a>`1';
isbe[7113]='Procurator`prok\'-u-ra-ter (epitropos): This word signified in a general sense a steward or bailiff of a private estate, or a financial agent with power of attorney, and the development of the special usage of the word to denote an imperial functionary or official is characteristic of the origin of many departments of administration under the Roman Empire which sprang from the emperor\'s household. At the time of Augustus, when the domestic quality of these offices had not been entirely lost, the procurators were mostly imperial freedmen. But after the systematic organization of the administration in the 2nd century, the title of procurator was reserved for functionaries of the equestrian class. In fact, the term is so intimately connected with the sphere of official activity of the Roman knights that the expressions "procuratorial career" and "equestrian career" are used synonymously (compare Hirschfeld, Die kaiserlichen Verwaltungsbeamten bib auf Diocletian, 410-65).<P>During the last century of the Republic, the class of knights (equites) embraced in general all citizens of wealth who were not magistrates or members of the senate. The Roscian Law (67 BC) established 400,000 sesterces (about $18,000 (in 1915), or 3,600 British pounds (in 1915)) as the minimum census rating for membership in this class. The gold ring, tunic with narrow purple border, and privilege of sitting in the first 14 rows at theater were the tokens of knighthood. Augustus added to these the public horse which was conferred henceforth by the emperor and recalled the original military significance of the order. From the time of Augustus the first three decuriae of jurors (judices), each containing 1,000 persons, were filled with knights.<P>Under the Republic the influence of the equestrian class was chiefly exerted in the financial transactions of the companies which farmed the variable revenues. The importance of the publicani was greatly reduced under the Empire, but the emperors recompensed the knights for this loss of opportunity by entrusting them with a great variety of administrative functions. Military service as prefect or tribune was the preliminary step in the official equestrian career. The highest positions held by members of the equestrian class were called prefectures, and included the prefecture of the guard, of Egypt, of the grain-supply, of the watchmen in Rome, and of the fleet. But between these extremes the title procurator was applied generally to the functionaries whose positions were of imperial origin.<P>The administration of the fiscus or imperial treasury at Rome and of the finances in the imperial provinces, as well as the collection of fiscal revenues in the senatorial provinces, was in the hands of procurators. They occupied many positions which, on account of their intimate relationship with the person of the monarch, could be safely entrusted only to those whose limited prestige precluded inordinate ambition (Friedlaender, Sittengeschichte Roms 7th edition, Part I, 132-43). Finally, several provinces, where the conditions were unfavorable to the introduction of the ordinary administrative system and Roman public law, were governed as imperial domains by officials of the equestrian class as the emperor\'s representatives. In Egypt the title prefect (praefectus) was employed permanently as the appellation of the viceroy, and while the same term may have been used originally to denote the governors of this class generally, when their military outweighed their civil functions, yet the designation procurator became at an early date the term of common usage to designate them (Hirschfeld, 382).<P>Mauretania, Rhaetia, Noricum, Thrace, Cappadocia, Judea and some smaller districts were all, for a time at least, governed by procurators (Tacitus, History i.11; Dio Cassius lvii.17).<P>The question concerning the original title of the Roman governors of Judea has arisen because the New Testament employs the word hegemon (<a onClick="return mV(\'Mat\',27,2,11,14,15,21,27);">Mt 27:2,11,14,15,21,27</a>; <a onClick="return mV(\'Mat\',28,14);">28:14</a>; <a onClick="return mV(\'Luk\',3,1);">Lu 3:1</a>; <a onClick="return mV(\'Luk\',20,20);">20:20</a>; <a onClick="return mV(\'Act\',23,24);">Ac 23:24</a>; <a onClick="return mV(\'Act\',24,1);">24:1</a>; <a onClick="return mV(\'Act\',26,30);">26:30</a>), which corresponds with the Latin term, praeses, which might be considered synonymous with either procurator or praefectus (Hirschfeld, 384). There is no inscriptional evidence to establish the nomenclature of the rulers of Palestine before the time of Vespasian, and Hirschfeld is of the opinion that a certain passage in Tacitus (Ann. xv.44) where Pilate is called procurator is not sufficient proof in view of this writer\'s carelessness in details of this sort. Josephus (Ant., XX, i, 2), however, employs epitropos (procurator) for the time of Claudius, and it is convenient to follow common usage and assume that this title was current from the first.<P>It was evidently the intention of Augustus that membership in the equestrian class should be a necessary qualification for the procurators who were appointed to govern provinces. But Claudius appointed a freedman, Antonius Felix, brother of the famous minister of finance, Pallas, as procurator of Judea (Suetonius, Claudius xxviii; Tacitus, History v.9). This remained, however, an isolated instance in the annals of Palestine (Hirschfeld, 380), and it is probable, moreover, that Felix was raised to equestrian rank before the governorship was conferred upon him.<P>The following list of the procurators of Judea is based on Marquardt (Romische Staatsverwaltung, I,409,412) and Schurer (Geschichte des judischen Volkes(4), I, 485-585):<P class="in15">Coponius (6 AD to circa 10 AD)<P class="in15">M. Ambibulus (circa 10-13)<P class="in15">Annius Rufus (circa 13-15)<P class="in15">Valerius Gratus (circa 15-26)<P class="in15">Pontius Pilatus (26-35)<P class="in15">Marcellus (probably 35-38)<P class="in15">Maryllus (38-44)<P class="in15">C. Cuspins Fadus (44-46)<P class="in15">Tiberius Alexander (46-48)<P class="in15">Ventidius Cumanus (48-52)<P class="in15"> M. Antonius Felix (52-60 or 61)<P class="in30">NOTE.—Marquardt gives his name as Claudius Felix, supposing that he was a freedman of Claudius and therefore took his nomen (Suetonius, Claudius xxviii; Victor, epitome iv, 8); but there is stronger evidence in support of the belief that Felix was a freedman of Antonia, Claudius\' mother, like his brother Pallas (Tacitus, Annals xii. 54; Josephus, Ant, XVIII, vi, 4; XX, vii, 1, 2; XX, viii, 9; BJ, II, xii, 8), and accordingly had received the praenomen and nomen of Antonia\'s father (Josephus, Ant, XVIII, vi, 6).<P class="in15">Portius Festus (61)<P class="in15">Albinus (62-64)<P class="in15">Gessius Florus (65-66)`<a href="./study/isbe/search.html?string=GOVERNOR">GOVERNOR</a>`3';
isbe[7114]='Profane`pro-fan\' (verb chalal, adjective chalal, chol; bebeloo, bebelos): From profanus, "before (i.e. outside) the temple," therefore unholy, polluted, secular, is of frequent occurrence (verb and adjective) in both the Old Testament and the New Testament. It occurs as the translation of chol in the King James Version only in Ezekiel (<a onClick="return mV(\'Eze\',22,26);">22:26</a>, the Revised Version (British and American) "common"; <a onClick="return mV(\'Eze\',42,20);">42:20</a>; <a onClick="return mV(\'Eze\',44,23);">44:23</a>; <a onClick="return mV(\'Eze\',48,15);">48:15</A>, the Revised Version (British and American) "for common use"); as the translation of chalal in <a onClick="return mV(\'Lev\',21,7,14);">Le 21:7,14</a>, the Revised Version margin "polluted"; and <a onClick="return mV(\'Eze\',21,25);">Eze 21:25</a>, where, for the King James Version "thou profane wicked prince of Israel," the Revised Version (British and American) has "thou, O deadly wounded wicked one, the prince of Israel." "To profane" (chalal) is seen in <a onClick="return mV(\'Lev\',18,21);">Le 18:21</a>; <a onClick="return mV(\'Lev\',19,8);">19:8</a>; <a onClick="return mV(\'Neh\',13,17,18);">Ne 13:17,18</a>; <a onClick="return mV(\'Psa\',89,39);">Ps 89:39</a>; <a onClick="return mV(\'Isa\',43,28);">Isa 43:28</a>; <a onClick="return mV(\'Eze\',22,8,26);">Eze 22:8,26</a>, etc. "Profaneness" in <a onClick="return mV(\'Jer\',23,15);">Jer 23:15</a> (chanuppah) is in the American Standard Revised Version "ungodliness." In the New Testament "profane" occurs in the sense of unholy, godless, regardless of God and divine things (<a onClick="return mV(\'1Ti\',1,9);">1Ti 1:9</a>; <a onClick="return mV(\'1Ti\',4,7);">4:7</a>; <a onClick="return mV(\'1Ti\',6,20);">6:20</a>; <a onClick="return mV(\'2Ti\',2,16);">2Ti 2:16</a>; <a onClick="return mV(\'Hbr\',12,16);">Heb 12:16</a>), and "to profane," or violate, in <a onClick="return mV(\'Mat\',12,5);">Mt 12:5</a>; <a onClick="return mV(\'Act\',24,6);">Ac 24:6</a>. The verb is frequent in Apocrypha in 1Macc (1:43,45,63; 2:34, etc.; also in 2Macc 8:2; 10:5; compare 2Esdras 15:8; Judith 4:3,12; 1Macc 1:48; 2Macc 4:13). In numerous cases the Revised Version (British and American) substitutes "profane" for other words and phrases in the King James Version, as for "to prostitute" (<a onClick="return mV(\'Lev\',19,29);">Le 19:29</a>), "an hypocrite" (<a onClick="return mV(\'Isa\',9,17);">Isa 9:17</a>), "pollute" (<a onClick="return mV(\'Num\',18,32);">Nu 18:32</a>; <a onClick="return mV(\'Eze\',7,21);">Eze 7:21</a>), etc.``185';
isbe[7115]='Profess; Profession`pro-fes\', pro-fesh\'-un (naghadh; homologeo, homologia): "Profess" means literally "to own before," hence, to make open or public announcement; it occurs only once in the Old Testament as the translation of naghadh, "to put before," often "to tell," "to show," "to declare" (<a onClick="return mV(\'Deu\',26,3);">De 26:3</a>); in the New Testament it is the translation of homologeo, "to speak or say together in common," "to assent," "to confess publicly" (<a onClick="return mV(\'Mat\',7,23);">Mt 7:23</a>, "Then will I profess unto them, I never knew you"; <a onClick="return mV(\'1Ti\',6,12);">1Ti 6:12</a>, the Revised Version (British and American) "didst confess the good confession"; <a onClick="return mV(\'Tts\',1,16);">Tit 1:16</a>, "They profess that they know God"); of epaggellomai, "to announce one\'s self," "to make profession" (<a onClick="return mV(\'1Ti\',2,10);">1Ti 2:10</a>; <a onClick="return mV(\'1Ti\',6,21);">6:21</a>); of phasko, "to say," "to assert" (<a onClick="return mV(\'Rom\',1,22);">Ro 1:22</a>). "Profession" is the translation of homologia (<a onClick="return mV(\'2Cr\',9,13);">2Co 9:13</a>; <a onClick="return mV(\'1Ti\',6,12);">1Ti 6:12</a>; <a onClick="return mV(\'Hbr\',3,1);">Heb 3:1</a>, the King James Version "the High Priest of our profession" (of our professed faith); <a onClick="return mV(\'Hbr\',4,14);">Heb 4:14</a>; <a onClick="return mV(\'Hbr\',10,23);">10:23</a>; in each instance the Revised Version (British and American) has "confession"). "Profess" occurs in the King James Version of Ecclesiasticus 3:25, but the verse is omitted by the Revised Version (British and American); margin "Most authorities omit verse 25."``185';

isbe[7117]='Prologue`pro\'-log, prol\'-og (prologos, "foreword," "preface," "introduction"): The word occurs in the preface to Ecclesiasticus (Sirach), and is commonly applied to <a onClick="return mV(\'Jhn\',1,\'1-18\');">Joh 1:1-18</a>.`<a href="./study/isbe/search.html?string=ECCLESIASTICUS">ECCLESIASTICUS</a>; <a href="./study/isbe/search.html?string=JOHN,+GOSPEL+OF">JOHN, GOSPEL OF</a>`1';
isbe[7118]='Prolong`pro-long\' (\'arakh, mashakh): "Prolong," "prolonged" are the translations of \'arakh, "to stretch," "to make long" (<a onClick="return mV(\'Deu\',4,26);">De 4:26</a>, and frequently, "prolong days"; <a onClick="return mV(\'Deu\',4,40);">De 4:40</a>, etc.; <a onClick="return mV(\'Job\',6,11);">Job 6:11</a> the King James Version; <a onClick="return mV(\'Pro\',28,16);">Pr 28:16</a>; <a onClick="return mV(\'Ecc\',7,15);">Ec 7:15</a>; <a onClick="return mV(\'Ecc\',8,13);">8:13</a>; <a onClick="return mV(\'Isa\',53,10);">Isa 53:10</a>); of mashakh, "to draw out" (<a onClick="return mV(\'Isa\',13,22);">Isa 13:22</a>; <a onClick="return mV(\'Eze\',12,25,28);">Eze 12:25,28</a> the King James Version); of yacaph, "to add," "to increase" (<a onClick="return mV(\'Psa\',61,6);">Ps 61:6</a>; <a onClick="return mV(\'Pro\',10,27);">Pr 10:27</a>); of natah, "to stretch out," "to incline to" (<a onClick="return mV(\'Job\',15,29);">Job 15:29</a>, "neither shall he prolong the perfection thereof upon the earth," the American Standard Revised Version "neither shall their possessions be extended on the earth," margin "their produce bend to the earth"; the English Revised Version reverses text and margin); of \'arekhah (Aramaic) (<a onClick="return mV(\'Dan\',7,12);">Da 7:12</a>, "Yet their lives were prolonged," the King James Version margin "A prolonging in life was given them"). "Prolong" occurs in Ecclesiasticus 29:5, "prolong the time" (parelkuo); 38:14, "prolong life," the Revised Version (British and American) "maintenance of life" (embiosis); 30:22, "prolongeth his days," the Revised Version (British and American) "length of days" (makroemereusis); 37:31, the Revised Version (British and American) "shall prolong" (prostithemi).``185';
isbe[7119]='Promise`prom\'-is (most frequently in the Old Testament dabhar, "speaking," "speech," and dabhar, "to speak" also \'amar, "to say," once in <a onClick="return mV(\'Psa\',77,8);">Ps 77:8</a>, \'omer, "speech"; in the New Testament epaggelia, and the verbs epaggellomai, and compounds): Promise holds an important place in the Scriptures and in the development of the religion that culminated in Christ. The Bible is indeed full of "precious and exceeding great promises" (<a onClick="return mV(\'2Pe\',1,4);">2Pe 1:4</a>), although the word "promise" is not always used in connection with them. Of the more outstanding promises of the Old Testament may be mentioned:<P class="in15">(1) the proto-evangelium (<a onClick="return mV(\'Gen\',3,15);">Ge 3:15</a>);<P class="in15">(2) the promise to Noah no more to curse the ground, etc. (<a onClick="return mV(\'Gen\',8,21,22);">Ge 8:21,22</a>; <a onClick="return mV(\'Gen\',9,\'1-17\');">9:1-17</a>);<P class="in15">(3) most influential, the promise to Abraham to make of him a great nation in whom all families of the earth should be blessed, to give to him and his seed the land of Canaan (<a onClick="return mV(\'Gen\',12,2,7);">Ge 12:2,7</a>, etc.), often referred to in the Old Testament (<a onClick="return mV(\'Exd\',12,25);">Ex 12:25</a>; <a onClick="return mV(\'Deu\',1,8,11);">De 1:8,11</a>; <a onClick="return mV(\'Deu\',6,3);">6:3</a>; <a onClick="return mV(\'Deu\',9,28);">9:28</a>, etc.);<P class="in15">(4) the promise to David to continue his house on the throne (<a onClick="return mV(\'2Sa\',7,12,13,18);">2Sa 7:12,13,18</a>; <a onClick="return mV(\'1Ki\',2,24);">1Ki 2:24</a>, etc.);<P class="in15">(5) the promise of restoration of Israel, of the Messiah, of the new and everlasting kingdom, of the new covenant and outpouring of the Spirit (<a onClick="return mV(\'Isa\',2,\'2-5\');">Isa 2:2-5</a>; <a onClick="return mV(\'Isa\',4,2);">4:2</a>; <a onClick="return mV(\'Isa\',55,5);">55:5</a>; <a onClick="return mV(\'Isa\',66,13);">66:13</a>; <a onClick="return mV(\'Jer\',31,\'31-34\');">Jer 31:31-34</a>; <a onClick="return mV(\'Jer\',32,\'37-42\');">32:37-42</a>; <a onClick="return mV(\'Jer\',33,14);">33:14</a>; <a onClick="return mV(\'Eze\',36,\'22-31\');">Eze 36:22-31</a>; <a onClick="return mV(\'Eze\',37,11);">37:11</a>f; <a onClick="return mV(\'Eze\',39,25);">39:25</a>f; etc.).<P>In the New Testament these promises are founded on, and regarded as having their true fulfillment in, Christ and those who are His (<a onClick="return mV(\'2Cr\',1,20);">2Co 1:20</a>; <a onClick="return mV(\'Eph\',3,6);">Eph 3:6</a>). The promise of the Spirit is spoken of by Jesus as "the promise of my Father" (<a onClick="return mV(\'Luk\',24,49);">Lu 24:49</a>; <a onClick="return mV(\'Act\',1,4);">Ac 1:4</a>), and this was regarded as fulfilled at Pentecost. The promise of a Saviour of the seed of David is regarded as fulfilled in Christ (<a onClick="return mV(\'Act\',13,23,32);">Ac 13:23,32</a>; <a onClick="return mV(\'Act\',13,26);">26:6</a>; <a onClick="return mV(\'Rom\',1,2);">Ro 1:2</a>; <a onClick="return mV(\'Rom\',4,13);">4:13</a>; <a onClick="return mV(\'Rom\',9,4);">9:4</a>). Paul argues that the promise to Abraham that he should be "heir of the world," made to him before circumcision, is not confined to Israel, but is open to all who are children of Abraham by faith (<a onClick="return mV(\'Rom\',4,\'13-16\');">Ro 4:13-16</a>; compare <a onClick="return mV(\'Gal\',3,16,19,29);">Ga 3:16,19,29</a>). In like manner the writer to the Hebrews goes back to the original promises, giving them a spiritual and eternal significance (<a onClick="return mV(\'Hbr\',4,1);">4:1</a>; <a onClick="return mV(\'Jer\',6,17);">6:17</A>; <a onClick="return mV(\'Jer\',11,19);">11:9</A>, etc.). The New Testament promises include manifold blessings and hopes, among them "life," "eternal life" (<a onClick="return mV(\'1Ti\',4,8);">1Ti 4:8</a>; <a onClick="return mV(\'1Ti\',6,19);">6:19</a>; <a onClick="return mV(\'2Ti\',1,1);">2Ti 1:1</a>; <a onClick="return mV(\'Jam\',1,12);">Jas 1:12</a>), the "kingdom" (<a onClick="return mV(\'Jam\',2,5);">Jas 2:5</a>), Christ\'s "coming" (<a onClick="return mV(\'2Pe\',3,9);">2Pe 3:9</a>, etc.), "new heavens and a new earth" (<a onClick="return mV(\'2Pe\',3,13);">2Pe 3:13</a>), etc. For "promise" and "promised" in the King James Version, the Revised Version (British and American) has frequently other terms, as "word" (<a onClick="return mV(\'Psa\',105,42);">Ps 105:42</a>), "spake," "spoken" (<a onClick="return mV(\'Deu\',10,9);">De 10:9</a>; <a onClick="return mV(\'Jos\',9,21);">Jos 9:21</a>; <a onClick="return mV(\'Jos\',22,4);">22:4</a>; <a onClick="return mV(\'Jos\',23,5,15);">23:5,15</a>, etc.), "consented" (<a onClick="return mV(\'Luk\',22,6);">Lu 22:6</a>), etc. References to the promises occur repeatedly in the Apocrypha (Baruch 2:34; 2Macc 2:18; <span class="noTag">The Wisdom of Solomon 12:21</a>; compare 2Esdras 3:15; 5:29).``185';
isbe[7120]='Proper`prop\'-er: For the King James Version "proper" (child), in <a onClick="return mV(\'Hbr\',11,23);">Heb 11:23</a>, the Revised Version (British and American) substitutes "goodly"; in <a onClick="return mV(\'1Ch\',29,3);">1Ch 29:3</a>; <a onClick="return mV(\'1Cr\',7,7);">1Co 7:7</a>, the Revised Version (British and American) "own" is employed, and for the too emphatic "their proper tongue" in <a onClick="return mV(\'Act\',1,19);">Ac 1:19</a> "their language" is written. But none of the King James Version forms are really obsolete.``1';

isbe[7122]='Property`prop\'-er-ti.`<a href="./study/isbe/search.html?string=AGRARIAN+LAWS">AGRARIAN LAWS</a>; <a href="./study/isbe/search.html?string=JUBILEE">JUBILEE</a>; <a href="./study/isbe/search.html?string=POOR">POOR</a>; <a href="./study/isbe/search.html?string=PORTION">PORTION</a>; <a href="./study/isbe/search.html?string=PRIMOGENITURE">PRIMOGENITURE</a>; <a href="./study/isbe/search.html?string=WEALTH">WEALTH</a>`1';

isbe[7124]='Prophecy; Prophets, 1`prof\'-e-si, prof\'-e-si, prof\'-ets:<P><b>I. THE IDEA OF BIBLICAL PROPHECY</b><P class="in15">1. The Seer and Speaker of God<P class="in15">2. Prophetical Inspiration<P class="in15">3. Relation to Dreams<P class="in15">4. Freedom of Inspiration<P class="in15">5. Supernatural Visions of the Future<P class="in15">6. The Fulfillment<P><b>II. HISTORICAL DEVELOPMENT OF THE PROPHETIC OFFICE</b><P class="in15">1. Abraham<P class="in15">2. Moses<P class="in15">3. Period of the Judges<P class="in15">4. Schools of Prophets<P class="in15">5. Period of the Kings<P class="in15">6. Literary Prophets, Amos, Hosea<P class="in15">7. Poetical Form of Prophecy<P class="in15">8. Prophets of Judah, Isaiah, and Others Down to Jeremiah<P class="in15">9. During the Exile, Ezekiel, Deutero-Isaiah, Daniel<P class="in15">10. After the Exile, Haggai, Zechariah, Malachi<P class="in15">11. Cessation of Prophecy<P class="in15">12. Prophecy in the New Testament<P><b>III. HISTORICAL DEVELOPMENT OF PROPHECY</b><P class="in15">1. Contents of Prophecy<P class="in15">2. Conception of the Messiah<P class="in15">3. Before the Exile (through Judgment to Deliverance)<P class="in15">4. Analogous Ideas among Heathen Peoples<P class="in15">5. During the Exile (Ezekiel, Deutero-Isaiah)<P class="in15">6. After the Exile (Haggai, Zechariah, Malachi)<P class="in15">7. Contemporaneous Character of Prophecy<P class="in15">8. Partial Character of Prophecy<P class="in15">9. Perspective Character of Prophecy<P><b>IV. ANALOGOUS PHENOMENA AMONG THE GENTILES</b><P class="in15">1. Necromancy and Technical Witchcraft<P class="in15">2. The Mantle Art<P class="in15">3. Contents of Extra-Biblical Oracles<P><b>LITERATURE</b><hr /><P>I. The Idea of Biblical Prophecy.<P>1. The Seer and Speaker of God:<P>According to the uniform teaching of the Bible the prophet is a speaker of or for God. His words are not the production of his own spirit, but come from a higher source. For he is at the same time, also, a seer, who sees things that do not lie in the domain of natural sight, or who hears things which human ears do not ordinarily receive; compare <a onClick="return mV(\'1Sa\',9,9);">1Sa 9:9</a>, where nabhi\', "speaker," and ro\'eh, "seer," are used as synonymous terms. <a onClick="return mV(\'Jer\',23,16);">Jer 23:16</a> and <a onClick="return mV(\'Eze\',13,2);">Eze 13:2</a>f are particularly instructive in this regard. In these passages a sharp distinction is made between those persons who only claim to be prophets but who prophesy "out of their own heart," and the true prophets who declare the word which the Lord has spoken to them. In the latter case the contents of the prophecy have not originated in their own reflection or calculation; and just as little is this prophecy the product of their own feelings, fears or hopes, but, as something extraneous to man and independent of him, it has with a divine certainty entered the soul of the prophet. The prophet has seen that which he prophesies, although he need not have seen it in the form of a real vision. He can also "see" words with his inner eyes (<a onClick="return mV(\'Isa\',2,1);">Isa 2:1</a>, and often). It is only another expression for this when it is frequently said that God has spoken to the prophet. In this case too it is not necessary that there must have been a voice which he could hear phonetically through his natural ear. The main thing is that he must have been able sharply to distinguish the contents of this voice from his own heart, i.e. from his personal consciousness. Only in this way is he capable of speaking to the people in the name of God and able to publish his word as that of Yahweh. In this case he is the speaker of Yahweh (nabhi\'), or the mouth of the Lord (compare <a onClick="return mV(\'Eze\',7,1);">Eze 7:1</a> with <a onClick="return mV(\'Eze\',4,16);">4:16</A>). Under these conditions he then regards it as absolute compulsion to speak, just as a person must be filled with fear when he hears a lion roar nearby (<a onClick="return mV(\'Amo\',3,8);">Am 3:8</a>). The words burn in his soul until he utters them (<a onClick="return mV(\'Jer\',20,7,9);">Jer 20:7,9</a>).<P>2. Prophetical Inspiration:<P>The divine power, which comes over a human being and compels him to see or to hear things which otherwise would be hidden from him, is called by various terms expressive of inspiration. It is said that the Spirit of God has come over someone (<a onClick="return mV(\'Num\',24,2);">Nu 24:2</a>); or has fallen upon him (<a onClick="return mV(\'Eze\',11,5);">Eze 11:5</a>); or that the hand of Yahweh has come over him and laid hold of him (<a onClick="return mV(\'2Ki\',3,15);">2Ki 3:15</a>; <a onClick="return mV(\'Eze\',1,3);">Eze 1:3</a>; <a onClick="return mV(\'Eze\',3,14,22);">3:14,22</a>, and often); or that the Holy Spirit has been put on him as a garment, i.e. has been incorporated in him (<a onClick="return mV(\'1Ch\',12,18);">1Ch 12:18</a>; <a onClick="return mV(\'2Ch\',24,20);">2Ch 24:20</a>); or that the Spirit of revelation has permanently descended upon him (<a onClick="return mV(\'Num\',11,25);">Nu 11:25</a>f; <a onClick="return mV(\'2Ki\',2,15);">2Ki 2:15</a>; <a onClick="return mV(\'Isa\',11,2);">Isa 11:2</a>; <a onClick="return mV(\'Isa\',61,1);">61:1</a>); or that God has given this Spirit of His (<a onClick="return mV(\'Num\',11,29);">Nu 11:29</a>; <a onClick="return mV(\'Isa\',42,1);">Isa 42:1</a>); or pours Him out upon man (<a onClick="return mV(\'Joe\',2,28);">Joe 2:28</a>f; <a onClick="return mV(\'Hbr\',3,1);">Heb 3:1</a>f). But this inspiration is not such that it suppresses the human consciousness of the recipient, so that he would receive the word of God in the state of sleep or trance. But rather the recipient is in possession of his full consciousness, and is able afterward to give a clear account of what happened. Nor is the individuality of the prophet eliminated by this divine inspiration; unconsciously this individuality cooperates in the formal shaping of that which has been seen and heard. In accordance with the natural peculiarity of the prophet and with the contents of the message, the psychological condition of the recipient may be that of intense excitement or of calmness. As a rule the inspiration that takes possession of the prophets is evidenced also by an exalted and poetical language, which assumes a certain rhythmical character, but is not bound to a narrow and mechanical meter. It is, however, also possible that prophetical utterances find their expression in plain prose. The individual peculiarity of the prophet is a prime factor also in the form in which the revelation comes to him. In the one prophet we find a preponderance of visions; another prophet has no visions. But the visions of the future which he sees are given in the forms and the color which have been furnished by his own consciousness. All the more the form in which the prophet gives expression to his word of God is determined by his personal talents and gifts as also by his experiences.<P>3. Relation to Dreams:<P>In a certain respect the dream can be cited as an analogous phenomenon, in which also the ideas that are slumbering in the soul uninvited put in their appearance without being controlled by consciousness and reason. On the other hand, prophecy differs pecifically from dreams, first, because the genuine prophetical utterance is received when the prophet is clearly conscious, and, secondly, because such an utterance brings with it a much greater degree of certainty and a greater guaranty of its higher origin than is done even by a dream that seems to be prophetical. In <a onClick="return mV(\'Jer\',23,25);">Jer 23:25</a>ff it is declared that these two are entirely dissimilar, and the relation between the two is compared to straw and wheat. The Moslem Arabs also put a much lower estimate on the visionary dream than on the prophetic vision in a waking condition.<P>4. Freedom of Inspiration:<P>Because this Spirit of God acts with full freedom, He can select His organs at will from among every station, age, or sex. The Spirit is not confined to any priestly class or organization. It indeed was the case at times that a prophet gathered disciples around himself, who could themselves in turn also be seized by his spirit, although the transmission of this spirit was a difficult matter (<a onClick="return mV(\'2Ki\',2,10);">2Ki 2:10</a>). Yet genuine prophecies continued to be at all times a free gift of the sovereign God. Amos (<a onClick="return mV(\'Amo\',7,14);">7:14</a>f) appeals expressly to this fact, that he did not himself choose the prophet\'s calling nor was the pupil of a prophetic school, but that he had been directly called by Yahweh from his daily occupation as a shepherd and workman. In the same way we indeed find prophets who belonged to the priestly order (Jeremiah, Ezekiel, and others), but equally great is the number of those who certainly did not so belong. Further, age made no difference in the call to the prophetic office. Even in his earliest youth Samuel was called to be a prophet (<a onClick="return mV(\'1Sa\',3,1);">1Sa 3:1</a>), and it did not avail Jeremiah anything when he excused himself because of his youth (<a onClick="return mV(\'Jer\',1,6);">Jer 1:6</a>). Then, too, a woman could be seized by this Spirit. From time to time prophetesses appeared, although the female sex is by no means so prominent here as it is in the sorcery of the heathen. See <a href="./study/isbe/search.html?string=PROPHETESS">PROPHETESS</a>. As an exceptional case the Spirit of God could lay hold even of a person who inwardly was entirely estranged from Him and could make an utterance through him (compare Saul, <a onClick="return mV(\'1Sa\',10,11);">1Sa 10:11</a>; <a onClick="return mV(\'1Sa\',19,24);">19:24</a>; Balaam, <a onClick="return mV(\'Num\',23,\'1-\');">Nu 23</a>f; Caiaphas, <a onClick="return mV(\'Jhn\',11,51);">Joh 11:51</a>). As a rule, however, God has selected such prophetic organs for a longer service. These persons are called and dedicated for this purpose by Him through a special act (compare Moses <a onClick="return mV(\'Exd\',3,1);">Ex 3:1</a>ff; <a onClick="return mV(\'1Ki\',19,16,19);">1Ki 19:16,19</a>ff; <a onClick="return mV(\'Isa\',6,\'1-\');">Isa 6</a>; <a onClick="return mV(\'Jer\',1,\'1-\');">Jer 1</a>; <a onClick="return mV(\'Eze\',1,\'1-\');">Eze 1</a>). This moment was decisive for their whole lives and constituted their authorization as far as they themselves and others were concerned. Yet for each prophetic appearance these men receive a special enlightenment. The prophet does not at all times speak in an inspired state; compare Nathan (<a onClick="return mV(\'2Sa\',7,3);">2Sa 7:3</a>), who afterward was compelled to take back a word which he had spoken on his own authority. Characteristic data on the mental state of the prophets in the reception and in the declaration of the divine word are found in <a onClick="return mV(\'Jer\',15,16);">Jer 15:16</a>f; <a onClick="return mV(\'Jer\',20,7);">20:7</a>ff. Originally Jeremiah felt it as a joy that Yahweh spoke to him (compare <a onClick="return mV(\'Eze\',3,3);">Eze 3:3</a>), but then he lost all pleasure in life and would have preferred not to have uttered this word, but he could not do as he desired.<P>5. Supernatural Visions of the Future:<P>The attempt has often been made to explain prophecy as a natural product of purely human factors. Rationalistic theologians regarded the prophets as enthusiastic teachers of religion and morals, as warm patriots and politicians, to whom they ascribed nothing but a certain ability of guessing the future. But this was no explanation of the facts in the case. The prophets were themselves conscious of this, that they were not the intellectual authors of their higher knowledge. This consciousness is justified by the fact that they were in a condition to make known things which lay beyond their natural horizon and which were contrary to all probability. Those cases are particularly instructive in this respect which beyond a doubt were recorded by the prophets themselves. Ezekiel could indeed, on the basis of moral and religious reflections, reach the conviction that Zedekiah of Jerusalem would not escape his punishment for his political treachery and for his disobedience to the word of Yahweh; but he could never from this source have reached the certainty that this king, as the prophet describes the case in <a onClick="return mV(\'Eze\',12,8);">12:8</a>ff, was to be taken captive while trying to escape from the besieged city and was then to be blinded and taken to Babylon. Just as little could he in Babylon know the exact day when the siege of Jerusalem began (<a onClick="return mV(\'Eze\',24,2);">24:2</A>). If this prophet had learned of these things in a natural way and had afterward clothed them in the form of prophecy, he would have been guilty of a deception, something unthinkable in the case of so conscientious a preacher of morality. But such cases are frequently met with. Jeremiah predicts to Hananiah that he would die during the year (<a onClick="return mV(\'Jer\',28,16);">28:16</A>), but it is not only such matters of detail that presuppose an extraordinary vision of the prophet. The whole way also in which Jeremiah predicts the destruction of Jerusalem as inevitable, in direct contrast to the hopes of the Jerusalemites and to the desires of his own heart, shows that he was speaking under divine compulsion, which was more powerful than his own reflections and sympathies. On any other presupposition his conduct would have been reprehensible cowardice. The case of Isaiah is exactly the same. When he gives to Ahaz the word of God as a guaranty that the Syrians and the Ephraimites would not capture Jerusalem (<a onClick="return mV(\'Isa\',7,4);">7:4</a>ff), and when he promises Hezekiah that the Assyrians would not shoot an arrow into the city, but would return without having accomplished their purpose (<a onClick="return mV(\'Isa\',37,22,33);">37:22,33</A>), these things were so much in contradiction to all the probabilities of the course events would take that he would have been a frivolous adventurer had he not received his information from higher sources. Doubtless it was just these predictions which established and upheld the influence of the prophets. Thus in the case of Amos it was his prediction of a great earthquake, which did occur two years later (<a onClick="return mV(\'Amo\',1,1);">1:1</a>); in the case of Elijah, the prediction of the long dearth (<a onClick="return mV(\'1Ki\',17,1);">1Ki 17:1</a>); in the case of Elisha the undertakings of the enemies (<a onClick="return mV(\'2Ki\',6,12);">2Ki 6:12</a>), and in other cases. It is indeed true that the contents of the prophetic discourses are not at all confined to the future. Everything that God has to announce to mankind, revelations concerning His will, admonitions, warnings, He is able to announce through the mouth of the prophet. But His determinations with reference to the future as a rule are connected with prophetical utterances of the latter kind. The prophets are watchmen, guardians of the people, who are to warn the nation, because they see the dangers and the judgments approaching, which must put in their appearance if the divine will is disregarded. The prophets interpret also for the people that which is happening and that which has occurred, e.g. the defeats which they have suffered at the hands of their enemies, or the grasshopper plague (Joel), or a famine. They lay bare the inner reason for external occurrences and explain such events in their connection with the providential government of God. This gives to prophecy a powerful inner unity, notwithstanding the great differences of times and surrounding circumstances. It is prophecy which the Hebrew people must thank for their higher conception of history. This people know of a Highest Author of all things and of a positive end, which all things that transpire must serve. God\'s plan has for its purpose to bring about the complete supremacy of His will among the children of men.<P>6. The Fulfillment:<P>In genuine prophecy, according to Biblical conceptions, the fulfillment constitutes an integral part. This is set up by <a onClick="return mV(\'Deu\',18,21);">De 18:21</a>f as a proof of the genuineness of a prophetic utterance. The prophetic word "falls to the ground" (<a onClick="return mV(\'1Sa\',3,19);">1Sa 3:19</a>) if it is not "raised up" (heqim, "fulfil," for which we more rarely find mille\', but regularly in the New Testament plerousthai "being fulfilled") by the course of events. It would remain an empty word if it did not attain to its full content through its realization. In fact, in the word spoken by the prophet itself there dwells a divine power, so that at the moment when he speaks the event takes place, even if it is not yet visible to man. This realization is also not infrequently represented symbolically by the prophet in confirmation of his prediction. Thus in a certain sense it is the prophet himself who through his word builds up and pulls down, plants and roots out (<a onClick="return mV(\'Jer\',1,10);">Jer 1:10</a>; <a onClick="return mV(\'Jer\',25,15);">25:15</a>). But the fulfillment can be judged by the contemporaries in the sense of <a onClick="return mV(\'Deu\',18,22);">De 18:22</a> only when this fulfillment refers to the near future and when special emphasis is laid on external events. In these cases the prediction of certain events assumes the significance of a "sign" (compare <a onClick="return mV(\'Jer\',28,16);">Jer 28:16</a>; <a onClick="return mV(\'Isa\',8,1);">Isa 8:1</a>ff; <a onClick="return mV(\'Isa\',37,30);">37:30</a>, and elsewhere). In other cases it is only later generations who can judge of the correctness of a prediction or of a threat. In this way in <a onClick="return mV(\'Zec\',1,6);">Zec 1:6</a> the fulfillment of a threat is declared, and in the New Testament often the fulfillment of a promise is after a long time pointed out. But it is not the case that a genuine prophecy must be fulfilled like an edict of fate. Such prophecy is not an inevitable decree of fate, but is a word of the living God to mankind, and therefore conditioned ethically, and God can, if repentance has followed, withdraw a threat (<a onClick="return mV(\'Jer\',18,2);">Jer 18:2</a>; case of Jonah), or the punishment can be mitigated (<a onClick="return mV(\'1Ki\',21,29);">1Ki 21:29</a>). A prediction, too, Yahweh can recall if the people prove unworthy (<a onClick="return mV(\'Jer\',18,9);">Jer 18:9</a>f). A favorable or an unfavorable prediction can also be postponed, as far as its realization is concerned, to later times, if it belongs to the ultimate counsels of God, as e.g. the final judgment and deliverance on the last day. This counsel also may be realized successively. In this case the prophet already collects into one picture what is realized gradually in a longer historical development. The prophet in general spoke to his hearers in such a way as could be understood by them and could be impressed on them. It is therefore not correct to demand a fulfillment pedantically exact in the form of the historical garb of the prophecy. The main thing is that the divine thought contained in the prophecy be entirely and completely realized. But not infrequently the finger of God can be seen in the entirely literal fulfillment of certain prophecies. This is especially the case in the New Testament in the appearance of the Son of Man, in whom all the rays of Old Testament prophecy have found their common center.``131';
isbe[7125]='Prophecy; Prophets, 2`II. Historical Development of the Prophetic Office.<P>1. Abraham:<P>It is a characteristic peculiarity of the religion of the Old Testament that its very elementary beginnings are of a prophetical nature. The fathers, above all Abraham, but also Isaac and Jacob, are the recipients of visions and of divine revelations. Especially is this true of Abraham, who appeared to the foreigners, to whom he was neither kith or kin, to be indeed a prophet (nabhi\') (<a onClick="return mV(\'Gen\',20,7);">Ge 20:7</a>; compare <a onClick="return mV(\'Psa\',105,15);">Ps 105:15</a>), although in his case the command to preach the word was yet absent.<P>2. Moses:<P>Above all, the creative founder of the Israelite national religion, Moses, is a prophet in the eminent sense of the word. His influence among the people is owing neither to his official position, nor to any military prowess, but solely and alone to the one circumstance, that since his call at the burning bush God has spoken to him. This intercourse between God and Moses was ever of a particularly intimate character. While other men of God received certain individual messages only from time to time and through the mediation of dreams and visions, Yahweh spoke directly and "face to face" with Moses (<a onClick="return mV(\'Num\',12,6);">Nu 12:6</a>ff; <a onClick="return mV(\'Deu\',34,10);">De 34:10</a>; compare <a onClick="return mV(\'Exd\',33,11);">Ex 33:11</a>). Moses was the permanent organ through whom Yahweh brought about the Egyptian plagues and through whom He explained what these meant to His people, as also through whom He led and ruled them. The voice of Moses too had to explain to them the divine signs in the desert and communicate to them the commandments of God. The legislation of Moses shows that he was not only filled with the Spirit of God occasionally, but that he abode with God for longer periods of time and produced something that is a well-ordered whole. A production such as the Law is the result of a continuous association with God.<P>3. Period of the Judges:<P>Since that time revelation through prophecy was probably never entirely wanting in Israel (<a onClick="return mV(\'Deu\',18,15);">De 18:15</a>). But this fountain did not always flow with the same fullness or clearness. During the period of the Judges the Spirit of God urged the heroes who served Yahweh rather to deeds than to words. Yet Deborah enjoyed a high rank as a prophetess, and for a long time pronounced decisions of justice in the name of the Lord before she, through her prophetical utterances, aroused the people to rise up against their oppressors. What is said in <a onClick="return mV(\'1Sa\',3,1);">1Sa 3:1</a> concerning the times of Eli can be applied to this whole period, namely that the word and vision of the prophet had become rare in the land. All the more epoch-making was the activity of Samuel, who while yet a boy received divine revelations (<a onClick="return mV(\'1Sa\',3,1);">1Sa 3:1</a>). He was by the whole people regarded as a "seer" whose prophecies were always fulfilled (<a onClick="return mV(\'1Sa\',3,19);">3:19</A>f). The passage <a onClick="return mV(\'1Sa\',9,6);">1Sa 9:6</a>ff shows that the people expected of such a man of God that he should also as a clairvoyant come to the assistance of the people in the troubles of life. Such a professional clairvoyant, indeed, Samuel was not, as he was devoted entirely to the service of his God and of his people and obeyed the Divine Spirit, even in those cases when he was compelled to act contrary to his personal inclinations, as was the case when the kingdom was established in Israel (<a onClick="return mV(\'1Sa\',8,6);">8:6</A>ff).<P>4. Schools of Prophets:<P>Since the days of Samuel we hear of schools of prophets, or "sons of prophets." These associations probably originated in this way, that an experienced prophet attracted to himself bands of youths, who sought to receive a measure of his spirit. These disciples of the prophets, together with their families, lived in colonies around the master. Possibly Samuel was the first who founded such a school of prophets. For in or near the city of Ramah we first find nayoth, or colonies of such disciples (<a onClick="return mV(\'1Sa\',19,18);">1Sa 19:18</a>f; <a onClick="return mV(\'1Sa\',20,1);">20:1</a>). Among these pupils is found to a much greater extent than among the teachers a certain ecstatic feature. They arouse their feelings through music and induce a frantic condition which also affects others in the same way, in which state they "prophesy" and, throwing off their garments, fall to the ground. In later times too we find traces of such ecstatic phenomena. Thus e.g. in <a onClick="return mV(\'Zec\',13,6);">Zec 13:6</a>; <a onClick="return mV(\'1Ki\',20,37,38);">1Ki 20:37,38</a>, the "wounds" on the breast or on the forehead recall the self-mutilation of the priests of Baal (<a onClick="return mV(\'1Ki\',18,28);">1Ki 18:28</a>). The deeds, suggestive of what the dervishes of our own day do, probably were phenomena quite similar to the action of the prophets of the surrounding tribes. But that prophecy in Israel was not, as is now not infrequently claimed, merely a less crude form of the heathen prophetic institution, is proved by such men as Moses and Samuel, who even in their times represent something much higher. Also in the colonies of prophets there was assuredly not to be found merely an enthusiasm without the Spirit of God. Proof for this is Samuel, the spiritual father of this colony, as Elijah was for the later colonies of this kind. These places were rather the centers of a religious life, where communion with God was sought by prayer and meditation, and where the recollection of the great deeds of God in the past seemed to prepare for the reception of new revelations. From such centers of theocratic ideas and ideals without a doubt there came forth also corresponding influences that affected the people. Perhaps not only was sacred music cultivated at these places but also sacred traditions, which were handed down orally and in writing. Certain it is that at these colonies the religion of Yahweh prevailed.<P>5. Period of the Kings:<P>During the period of the kings prophetically inspired men frequently appeared, who demanded even of the kings that they should submit to their divinely-inspired word. Saul, who refused such submission, perished as the result of this conflict. David owed much to the support of the prophets Samuel, Nathan, Gad (<a onClick="return mV(\'1Sa\',16,1);">1Sa 16:1</a>ff; <a onClick="return mV(\'2Sa\',7,\'1-\');">2Sa 7</a>; <a onClick="return mV(\'2Ch\',29,25);">2Ch 29:25</a>, and elsewhere). But David also bowed in submission when these prophets rebuked him because of his transgression of the divine commands (<a onClick="return mV(\'2Sa\',12,1);">2Sa 12</a>; <a onClick="return mV(\'2Sa\',24,\'1-\');">24</a>). His son Solomon was educated by the prophet Nathan. But the destruction of his kingdom was predicted by the prophet Abijah, the Shilonite (<a onClick="return mV(\'1Ki\',11,29);">1Ki 11:29</a>). Since Yahweh, as the supreme Sovereign, has the right to enthrone or to dethrone kings, this is often done through the mouths of the prophets (compare <a onClick="return mV(\'1Ki\',14,7);">1Ki 14:7</a>ff; <a onClick="return mV(\'1Ki\',16,1);">16:1</a>ff). After the division of the kingdom we find Shemaiah forbidding Rehoboam to begin a war with his brethren of Israel (<a onClick="return mV(\'1Ki\',12,21);">1Ki 12:21</a>; compare <a onClick="return mV(\'2Ch\',11,2);">2Ch 11:2</a>; compare another mission of the same prophet, <a onClick="return mV(\'2Ch\',12,5);">2Ch 12:5</a>). On the other hand in the Northern Kingdom the prophetic word is soon turned against the untheocratic rule of Jeroboam (<a onClick="return mV(\'1Ki\',13,\'1-\');">1Ki 13</a>; <a onClick="return mV(\'1Ki\',14,\'1-\');">14</a>). It is in this very same Northern Kingdom that the prophets unfolded their full activity and generally in opposition to the secular rulers, although there was no lack of accommodating "prophets," who were willing to sanction everything that the king wanted. The opposition of the true prophets to these false representatives of prophecy is illustrated in the story of Micaiah, the son of Imlah (<a onClick="return mV(\'1Ki\',22,\'1-\');">1Ki 22</a>). But a still higher type of prophecy above the ordinary is found in Elijah, whose historic mission it was to fight to the finish the battle between the followers of Yahweh and the worship of the Tyrian Baal. He was entirely a man of action; every one of his words is a deed on a grand scale (compare concerning Elijah and Elisha the article <a href="./study/isbe/search.html?string=ISRAEL,+RELIGION+OF">ISRAEL, RELIGION OF</a>). His successor Elisha inherited from him not only his mantle, but also a double measure of his spiritual gifts. He exhibits the prophetic office more from its loving side. He is accustomed to visit the schools of prophets found scattered throughout the land, calls the faithful together around himself on the Sabbaths and the new moons (<a onClick="return mV(\'2Ki\',4,23);">2Ki 4:23</a>), and in this way establishes centers of a more spiritual culture than was common elsewhere among the people. We read that first-fruits were brought to him as to the priests (<a onClick="return mV(\'2Ki\',4,42);">2Ki 4:42</a>). But while the activity of Elijah was entirely in antagonism to the ruling house in the kingdom, this feature is not entirely lacking in the work of Elisha also. He has even been charged with wicked conspiracies against the dynasty of Omri and the king of Syria (<a onClick="return mV(\'2Ki\',8,\'1-\');">2Ki 8</a>; <a onClick="return mV(\'2Ki\',9,\'1-\');">9</a>). His conduct in connection with these events can be excused only on the ground that he was really acting in the name of a higher Master. But in general it was possible for Elisha, after the radical change in public sentiment that had followed upon the work of Elijah, in later time to assume a more friendly attitude toward the government and the people. He often assisted the kings in their arduous contests with the Syrians (compare <a onClick="return mV(\'2Ki\',6,8);">2Ki 6:8</a>ff; <a onClick="return mV(\'2Ki\',13,14);">13:14</a>ff). His deeds are generally of a benevolent character. In connection with these he exhibits to a remarkable degree the gift of prophetic foresight (<a onClick="return mV(\'2Ki\',4,16);">2Ki 4:16</a>; <a onClick="return mV(\'2Ki\',5,26);">5:26</a>; <a onClick="return mV(\'2Ki\',6,8);">6:8</a>ff; <a onClick="return mV(\'2Ki\',7,1);">7:1</a>ff; <a onClick="return mV(\'2Ki\',8,10,12);">8:10,12</a>; <a onClick="return mV(\'2Ki\',9,6);">9:6</a>ff; <a onClick="return mV(\'2Ki\',13,19);">13:19</a>). Jonah, too, the son of Amittai, had at that time a favorable message for the Northern Kingdom (<a onClick="return mV(\'2Ki\',14,25);">2Ki 14:25</a>).<P>6. Literary Prophets, Amos, Hosea:<P>However, the flourishing condition of the kingdom under Jeroboam II had an unfavorable influence on its spiritual development. Soon Amos and Hosea were compelled to announce to this kingdom its impending destruction through a great world-power. These two prophets have left us books. To put prophetic utterances into written form had already been introduced before this. At any rate, many scholars are of the conviction that the prophecies of Obadiah and Joel belong to an earlier period, although others place them in the post-exilic period. In any case, the expectation of a day of settlement by Yahweh with His people was already in the days of Amos common and current (<a onClick="return mV(\'Amo\',5,18);">5:18</a>ff). As the writing of individual prophecies (<a onClick="return mV(\'Isa\',8,1);">Isa 8:1</a>f; <a onClick="return mV(\'Isa\',30,8);">30:8</a>; <a onClick="return mV(\'Hab\',2,2);">Hab 2:2</a>f) had for its purpose the preserving of these words in pe
