;">Joh 20:29</a>).<P>e) The Galilean Appearances:<P>The scene now shifts for the time to Galilee. Jesus had appointed to meet with His disciples in Galilee (<a onClick="return mV(\'Mat\',26,32);">Mt 26:32</a>; <a onClick="return mV(\'Mar\',16,7);">Mr 16:7</a>; compare <a onClick="return mV(\'Mar\',14,28);">Mr 14:28</a>). Prior, however, to this meeting—that recorded in <a onClick="return mV(\'Mat\',28,\'16-20\');">Mt 28:16-20</a>, probably to be identified with the appearance "to above five hundred brethren at once" mentioned by Paul (<a onClick="return mV(\'1Cr\',15,6);">1Co 15:6</a>)—there is another appearance of Jesus to seven disciples at the Lake of Galilee, of which the story is preserved in <a onClick="return mV(\'Jhn\',21,\'1-23\');">Joh 21:1-23</a>.<P>(1) At the Sea of Tiberias—the Draught of Fishes—Peter\'s Restoration.<P>The chapter which narrates this appearance of Jesus at the Lake of Galilee ("Sea of Tiberias") is a supplement to the Gospel, but is so evidently Johannine in character that it may safely be accepted as from the pen of the beloved disciple (thus Lightfoot, Meyer, Godet, Alford, etc.). The appearance itself is described as the third to the disciples (<a onClick="return mV(\'Jhn\',21,14);">Joh 21:14</a>), i.e. the third to the apostles collectively, and in Jn\'s record seven disciples are stated to have been present, of whom five are named—Peter, Thomas, Nathaniel (probably to be identified with Bartholomew), and the sons of Zebedee, James and John. The disciples had spent the night in fishing without result. In the morning Jesus—yet unrecognized—appeared on the beach, and bade them cast down their net on the right side of the boat. The draught of fishes which they took revealed to John the presence of the Master. "It is the Lord," he said to Peter, who at once flung himself into the lake to go to Jesus. On landing, the disciples found a fire of coals, with fish placed on it, and bread; and Jesus Himself, after more fish had been brought, distributed the food, and, it seems implied, Himself shared in the meal. Still a certain awe—another indication of a mysterious change in Christ\'s appearance—restrained the disciples from asking openly, "Who art thou?" (<a onClick="return mV(\'Jhn\',21,12);">Joh 21:12</a>). It was not long, however ("when they had broken their fast"), before Jesus sufficiently disclosed Himself in the touching episode of the restoration of Peter (the three-fold question, "Lovest thou me?" answering to the three-fold denial, met by Peter\'s heartfelt, "Yea, Lord; thou knowest that I love thee," with the words of reinstatement, "Feed my lambs," "Feed my sheep"). In another way, Jesus foretold that Peter would have the opportunity of taking back his denial in the death by which he should glorify God (<a onClick="return mV(\'Jhn\',21,18,19);">Joh 21:18,19</a>; tradition says he was crucified head-downward). Curious inquiries were set aside, and attention recalled to duty, "Follow thou me" (<a onClick="return mV(\'Jhn\',21,22);">Joh 21:22</a>).<P>(2) On the Mountain—the Great Commission—Baptism.<P>Though only the eleven apostles are named in Matthew\'s account (<a onClick="return mV(\'Mat\',28,16);">Mt 28:16</a>), the fact of an \'appointment\' for a definite time and place ("the mountain"), and the terms in which the message was given to the "disciples," suggests a collective gathering such as is implied in Paul\'s "above five hundred brethren at once" (<a onClick="return mV(\'1Cr\',15,6);">1Co 15:6</a>). The company being assembled, Jesus appeared; still, at first, with that element of mystery in His appearance, which led some to doubt (<a onClick="return mV(\'Mat\',28,17);">Mt 28:17</a>). Such doubt would speedily vanish when the Lord, announcing Himself as clothed with all authority in heaven and earth, gave to the apostles the supreme commission to "make disciples of all the nations" (<a onClick="return mV(\'Mat\',28,\'18-20\');">Mt 28:18-20</a>; compare <a onClick="return mV(\'Mar\',16,15);">Mr 16:15</a>, "Go ye into all tho world" etc.). Discipleship was to be shown by baptism "into the name of the Father and of the Son and of the Holy Spirit" (one name, yet threefold), and was to be followed by instruction in Christ\'s commands. Behind the commission, world-wide in its scope, and binding on every age, stands the word of never-failing encouragement, "Lo, I am with you always, even unto the end of the world." Doubts of the genuineness of these august utterances go as a rule with doubt of the resurrection itself.<P>It will be noticed that the Lord\'s Supper and Baptism are the only sacraments instituted by Jesus in His church.<P>f) Appearance to James:<P>Paul records, as subsequent to the above, an appearance of Jesus to James, known as "the Lord\'s brother" (<a onClick="return mV(\'1Cr\',15,7);">1Co 15:7</a>; compare <a onClick="return mV(\'Gal\',1,19);">Ga 1:19</a>). No particulars are given of this appearance, which may have occurred either in Galilee or Jerusalem. James, so far as known, was not a believer in Jesus before the crucifixion (compare <a onClick="return mV(\'Jhn\',7,3);">Joh 7:3</a>); after the ascension he and the other brethren of Jesus are found in the company of the disciples (<a onClick="return mV(\'Act\',1,14);">Ac 1:14</a>), and he became afterward a chief "pillar" of the church at Jerusalem (<a onClick="return mV(\'Gal\',1,19);">Ga 1:19</a>; <a onClick="return mV(\'Gal\',2,9);">2:9</a>). This appearance may have marked the turning-point.<P>g) The Last Meeting:<P>The final appearance of Jesus to the apostles (<a onClick="return mV(\'1Cr\',15,7);">1Co 15:7</a>) is that which Luke in the closing verses of his Gospel (<a onClick="return mV(\'Luk\',24,\'44-53\');">Lu 24:44-53</a>), and in <a onClick="return mV(\'Act\',1,\'3-12\');">Ac 1:3-12</a>, brings into direct relation with the ascension. In the Gospel Luke proceeds without a break from the first appearance of Jesus to "the eleven" to His last words about "the promise of my Father"; but <a onClick="return mV(\'Act\',1,1);">Acts 1</a> shows that a period of 40 days really elapsed during which Jesus repeatedly "appeared" to those whom He had chosen. This last meeting of Jesus with His apostles was mainly occupied with the Lord\'s exposition of the prophetic Scriptures (<a onClick="return mV(\'Luk\',24,\'44-46\');">Lu 24:44-46</a>), with renewed commands to preach repentance and forgiveness of sins in His name, "beginning from Jerusalem" (<a onClick="return mV(\'Luk\',24,47,48);">Lu 24:47,48</a>; compare <a onClick="return mV(\'Act\',1,8);">Ac 1:8</a>), and with the injunction to tarry in Jerusalem till the Spirit should be given (<a onClick="return mV(\'Luk\',24,49);">Lu 24:49</a>; compare <a onClick="return mV(\'Act\',1,4,5);">Ac 1:4,5</a>). Then He led them forth to Olivet, "over against Bethany," and, while blessing them, "was carried up into heaven" (<a onClick="return mV(\'Luk\',24,50,51);">Lu 24:50,51</a>; compare <a onClick="return mV(\'Act\',1,10,12);">Ac 1:10,12</a>).<P>2. The Ascension:<P>(<a onClick="return mV(\'Luk\',24,\'50-53\');">Luke 24:50-53</a>; <a onClick="return mV(\'Act\',1,\'6-14\');">Ac 1:6-14</a>; compare <a onClick="return mV(\'Mar\',16,19);">Mark 16:19</a>)<P>Jesus had declared, "I ascend unto my Father" (<a onClick="return mV(\'Jhn\',20,17);">Joh 20:17</a>), and Luke in <a onClick="return mV(\'Act\',1,\'1-\');">Acts 1</a> narrates the circumstances of that departure. Jesus might simply have "vanished" from the sight of His disciples, as on previous occasions, but it was His will to leave them in a way which would visibly mark the final close of His association with them. They are found, as in the Gospel, "assembled" with Him at Jerusalem, where His final instructions are given. Then the scene insensibly changes to Olivet, where the ascension is located (<a onClick="return mV(\'Act\',1,12);">Ac 1:12</a>). The disciples inquire regarding the restoration of the kingdom to Israel (even yet their minds are held in these temporal conceptions), but Jesus tells them that it is not for them to know times and seasons, which the Father had set within His own authority (<a onClick="return mV(\'Act\',1,7);">Ac 1:7</a>). Far more important was it for them to know that within the next days they should receive power from the Holy Spirit to be witnesses for Him to the uttermost part of the earth (<a onClick="return mV(\'Act\',1,8);">Ac 1:8</a>). Even as He spake, He was taken up, and a cloud received Him out of their sight (<a onClick="return mV(\'Act\',1,9);">Ac 1:9</a>). Then, as the apostles stood gazing upward, two heavenly messengers appeared, who comforted them with the assurance that in like manner as they had seen Jesus ascend into heaven, so also would He come again. For that return the church still prays and waits (compare <a onClick="return mV(\'Rev\',22,20);">Re 22:20</a>).<P>See, further, <a href="./study/isbe/search.html?string=ASCENSION">ASCENSION</a>.<P>Retracing their steps to Jerusalem, the apostles joined the larger company of disciples in the "upper room" where their meetings seem to have been habitually held, and there, with one accord, to the number of about 120 (<a onClick="return mV(\'Act\',1,15);">Ac 1:15</a>), they all continued steadfastly in prayer till "the promise of the Father" (<a onClick="return mV(\'Luk\',24,49);">Lu 24:49</a>; <a onClick="return mV(\'Act\',1,4);">Ac 1:4</a>) was, at Pentecost, bestowed upon them.``132';
isbe[5027]='Jesus Christ, 5`PART IV. EPILOGUE: THE APOSTOLIC TEACHING<P>1. After the Ascension:<P>The earthly life of Jesus is finished. With His resurrection and ascension a new age begins. Yet the work of Christ continues. As Luke expressively phrases it in <a onClick="return mV(\'Act\',1,1,2);">Ac 1:1,2</a>, the Gospels are but the records of "all that Jesus began both to do and to teach, until the day in which he was received up." It is beyond the scope of this article to trace the succeeding developments of Christ\'s activity through His church and by His Spirit; in order, however, to bring the subject to a proper close, it is necessary to glance, even if briefly, at the light thrown back by the Spirit\'s teachings, after the ascension, on the significance of the earthly life itself, and at the enlargement of the apostles\' conceptions about Christ, consequent on this, as seen in the Epistles and the Apocalypse.<P>2. Revelation through the Spirit:<P>It was the promise of Jesus that, after His departure, the Spirit would be given to His disciples, to teach them all things, and bring to their remembrance all that He had said to them (<a onClick="return mV(\'Jhn\',14,26);">Joh 14:26</a>). It was not a new revelation they were to receive, but illumination and guidance of their minds into the meaning of what they had received already (<a onClick="return mV(\'Jhn\',16,\'13-15\');">Joh 16:13-15</a>). This promise of the Spirit was fulfilled at Pentecost (<a onClick="return mV(\'Act\',2,1);">Ac 2</a>). Only a few personal manifestations of Jesus (<a onClick="return mV(\'Act\',7,55,56);">Ac 7:55,56</a>; <a onClick="return mV(\'Act\',22,17,18);">22:17,18</a>; <a onClick="return mV(\'Act\',23,11);">23:11</a>) are recorded after that event—the two chief being the appearance to Paul on the way to Damascus (<a onClick="return mV(\'1Cr\',15,8);">1Co 15:8</a>; compare <a onClick="return mV(\'Act\',9,3);">Ac 9:3</a>, etc.), and the appearance in vision to John in Patmos (<a onClick="return mV(\'Rev\',1,10);">Re 1:10</a>). The rest was internal revelation (compare <a onClick="return mV(\'Gal\',1,12,16);">Ga 1:12,16</a>; <a onClick="return mV(\'Eph\',1,17);">Eph 1:17</a>; <a onClick="return mV(\'Eph\',3,\'3-5\');">3:3-5</a>). The immense advance in enlargement and clearness of view—aided, no doubt, by Christ\'s parting instructions (<a onClick="return mV(\'Luk\',24,\'44-48\');">Lu 24:44-48</a>; <a onClick="return mV(\'Act\',1,2);">Ac 1:2</a>)—is already apparent in Peter\'s discourses at Pentecost; but it is not to be supposed that much room was not left for after-growth in knowledge, and deepened insight into the connection of truths. Peter, e.g., had to be instructed as to the admission of the Gentiles (<a onClick="return mV(\'Act\',10,11);">Ac 10:11</a>); the apostles had much gradually to learn as to the relations of the law (compare <a onClick="return mV(\'Act\',15,\'1-\');">Ac 15</a>; <a onClick="return mV(\'Act\',21,20);">21:20</a>ff; <a onClick="return mV(\'Gal\',2,\'1-\');">Ga 2</a>, etc.); Paul received revelations vastly widening the doctrinal horizon; both John and Paul show progressive apprehension in the truth about Christ.<P>3. Gospels and Epistles:<P>It is therefore a question of much interest how the apostolic conceptions thus gained stand related to the picture of Jesus we have been studying in the Gospels. It is the contention of the so-called "historical" (anti-supernaturalistic) school of the day that the two pictures do not correspond. The transcendental Christ of Paul and John has little in common, it is affirmed, with the Man of Nazareth of the Synoptic Gospels. Theories of the "origins of Christianity" are concocted proceeding on this assumption (compare Pfieiderer, Weizsacker, Bousset, Wernle, etc.). Such speculations ignore the first conditions of the problem in not accepting the self-testimony of Jesus as to who He was, and the ends of His mission into the world. When Jesus is taken at His own valuation, and the great fact of His resurrection is admitted, the alleged contradictions between the "Jesus of history" and the "Christ of faith" largely disappear.<P>4. Fact of Christ\'s Lordship:<P>It is forgotten how great a change in the center of gravity in the conception of Christ\'s person and work was necessarily involved in the facts of Christ\'s death, resurrection and exaltation to the right hand of power. The life is not ignored—far from it. Its influence breathes in every page, e.g. of Paul\'s epistles. But the weakness, the limitations, the self-suppression—what Paul in <a onClick="return mV(\'Phl\',2,7);">Php 2:7</a> calls the "emptying"—of that earthly life have now been left behind; the rejected and crucified One has now been vindicated, exalted, has entered into His glory. This is the burden of Peter\'s first address at Pentecost: "God hath made him both Lord and Christ, this Jesus whom ye crucified" (<a onClick="return mV(\'Act\',2,36);">Ac 2:36</a>). Could anything look quite the same after that? The change is seen in the growing substitution of the name "Christ" for "Jesus" (see at beginning of article), and in the habitual speaking of Jesus as "Lord."<P>5. Significance of Christ\'s Person:<P>With belief in the lordship of Jesus went necessarily an enlarged conception of the significance of His person. The elements were all there in what the disciples had seen and known of Jesus while on earth (<a onClick="return mV(\'Jhn\',1,14);">Joh 1:14</a>; <a onClick="return mV(\'1Jo\',1,\'1-3\');">1Joh 1:1-3</a>), but His exaltation not only threw back light upon His claims while on earth—confirmed, interpreted, completed them—but likewise showed the ultimate ground of these claims in the full Divine dignity of His person. He who was raised to the throne of Divine dominion; who was worshipped with honors due to God only; who was joined, with Father and with Holy Spirit as, coordinately, the source of grace and blessing, must in the fullest sense be Divine. There is not such a thing as honorary Godhead. In this is already contained in substance everything taught about Jesus in the epistles: His preexistence (the Lord\'s own words had suggested this, <a onClick="return mV(\'Jhn\',8,58);">Joh 8:58</a>; <a onClick="return mV(\'Jhn\',17,5);">17:5</a>, etc.), His share in Divine attributes (eternity, etc.), in Divine works (creation, etc., <a onClick="return mV(\'1Cr\',8,6);">1Co 8:6</a>; <a onClick="return mV(\'Col\',1,16,17);">Col 1:16,17</a>; <a onClick="return mV(\'Hbr\',1,2);">Heb 1:2</a>; <a onClick="return mV(\'Rev\',1,8);">Re 1:8</a>; <a onClick="return mV(\'Rev\',3,14);">3:14</a>, etc.), in Divine worship (<a onClick="return mV(\'Phl\',2,\'9-11\');">Php 2:9-11</a>; <a onClick="return mV(\'Rev\',5,11,12);">Re 5:11,12</a>, etc.), in Divine names and titles (<a onClick="return mV(\'Hbr\',1,8);">Heb 1:8</a>, etc.). It is an extension of the same conception when Jesus is represented as the end of creation—the "Head" in whom all things are finally to be summed up (<a onClick="return mV(\'Eph\',1,10);">Eph 1:10</a>; compare <a onClick="return mV(\'Hbr\',2,\'6-9\');">Heb 2:6-9</a>). These high views of the person of Christ in the Epistles are everywhere assumed to be the possession of the readers.<P>Jesus had furnished His disciples with the means of understanding His death as a necessity of His Messianic vocation, endured for the salvation of the world; but it was the resurrection and exaltation which shed light on the utmost meaning of this also. Jesus died, but it was for sins. He was a propitiation for the sin of the world (<a onClick="return mV(\'Rom\',3,25);">Ro 3:25</a>; <a onClick="return mV(\'1Jo\',2,2);">1Joh 2:2</a>; <a onClick="return mV(\'1Jo\',4,10);">4:10</a>). He was \'made sin\' for us (<a onClick="return mV(\'2Cr\',5,21);">2Co 5:21</a>).<P>6. Significance of the Cross and Resurrection:<P>The strain of <a onClick="return mV(\'Isa\',53,\'1-\');">Isa 53</a> runs through the New Testament teaching on this theme (compare <a onClick="return mV(\'1Pe\',1,19);">1Pe 1:19</a>; <a onClick="return mV(\'1Pe\',2,\'22-25\');">2:22-25</a>, etc.). Jesus\' own word "ransom" is reproduced by Paul (<a onClick="return mV(\'1Ti\',2,6);">1Ti 2:6</a>). The song of the redeemed is, "Thou didst purchase unto God with thy blood men of every tribe," etc. (<a onClick="return mV(\'Rev\',5,9);">Re 5:9</a>). Is it wonderful, in view of this, that in the apostolic writings—not in Paul only, but in Peter, in John, in Hebrews, and Revelation, equally—the cross should assume the decisive importance it does? Paul only works out more fully in relation to the law and the sinner\'s justification a truth shared by all. He himself declares it to be the common doctrine of the churches (<a onClick="return mV(\'1Cr\',15,3,4);">1Co 15:3,4</a>).<P>7. Hope of the Advent:<P>The newer tendency is to read an apocalyptic character into nearly all the teaching of Jesus (compare Schweitzer, Quest of the Historical Jesus). This is an exaggeration, but that Jesus taught His disciples to look for His coming again, and connected with that coming the perfection of His kingdom, is plain to every reader of the Gospels. It will not be denied that the apostolic church retained this feature of the teaching of Jesus. In accordance with the promise in <a onClick="return mV(\'Act\',1,11);">Ac 1:11</a>, it looked for the glorious reappearing of its Lord. The Epistles are full of this hope. Even John gives it prominence (<a onClick="return mV(\'1Jo\',2,28);">1Joh 2:28</a>; <a onClick="return mV(\'1Jo\',3,2);">3:2</a>). In looking for the parousia as something immediately at hand, the early believers went even beyond what had been revealed, and Paul had to rebuke harmful tendencies in this direction (<a onClick="return mV(\'2Th\',2,\'1-\');">2Th 2</a>). The hope might be cherished that the coming would not long be delayed, but in face of the express declarations of Jesus that no one, not the angels, not even the Son, knew of that day and hour (<a onClick="return mV(\'Mat\',24,36);">Mt 24:36</a>; <a onClick="return mV(\'Mar\',13,32);">Mr 13:32</a>), and that the Father had set these things in His own authority (<a onClick="return mV(\'Act\',1,7);">Ac 1:7</a>; compare also such intimations as in <a onClick="return mV(\'Mat\',13,30);">Mt 13:30</a>; <a onClick="return mV(\'Mat\',24,14);">24:14</a>; <a onClick="return mV(\'Mat\',25,19);">25:19</a>; <a onClick="return mV(\'Mat\',28,19);">28:19</a>; <a onClick="return mV(\'Luk\',19,11);">Lu 19:11</a>, etc.), none could affirm this with certainty. Time has proved—proved it even in the apostolic age (<a onClick="return mV(\'2Pe\',3,3,4);">2Pe 3:3,4</a>)—that the Advent was not so near as many thought. In part, perhaps, the church itself may be to blame for the delay. Still to faith the Advent remains the great fixed event of the future, the event which overshadows all others—in that sense is ever near—the polestar of the church\'s confidence that righteousness shall triumph, the dead shall be raised, sin shall be judged and the kingdom of God shall come.<P>LITERATURE.<P>The literature on the life and teaching of Jesus is so voluminous, and represents such diverse standpoints, that it would be unprofitable to furnish an extended catalogue of it. It may be seen prefixed to any of the larger books. On the skeptical and rationalistic side the best account of the literature will be found in Schweitzer\'s book, From Reimarus to Wrede (English translation, Quest of the Historical Jesus). Of modern believing works may be specially named those of Lange, Weiss, Ellicott Edersheim, Farrar, D. Smith. Dr. Sanday\'s book, The Life of Christ in Recent Research, surveys a large part of the field, and is preparatory to an extended Life from Dr. Sanday\'s own pen. His article in HDB has justly attracted much attention. Schurer\'s Hist of the Jewish People in the Time of Jesus Christ (ET, 5 volumes; a new German edition has been published) is the best authority on the external conditions. The works on New Testament Biblical theology (Reuss, Weiss, Schmid, Stevens, etc.) deal with the teaching of Jesus; see also Wendt, The Teaching of Jesus (ET). Works and articles on the Chronology, on Harmony of the Gospels, on geography and topography (compare especially Stanley, G.A. Smith) are legion. A good, comprehensive book on these topics is Andrews, Life of our Lord (revised edition). The present writer has published works on The Virgin Birth of Christ and The Resurrection of Jesus. On the relations of gospel and epistle, see J. Denney, Jesus and the Gospel.<P>See also the various articles in this Encyclopedia, on <a href="./study/isbe/search.html?string=GOSPELS">GOSPELS</a>; <a href="./study/isbe/search.html?string=PERSON+OF+CHRIST">PERSON OF CHRIST</a>; <a href="./study/isbe/search.html?string=ETHICS+OF+JESUS">ETHICS OF JESUS</a>; <a href="./study/isbe/search.html?string=VIRGIN+BIRTH">VIRGIN BIRTH</A>; <a href="./study/isbe/search.html?string=JESUS+CHRIST,+THE+ARREST+AND+TRIAL+OF">JESUS CHRIST, THE ARREST AND TRIAL OF</a>; <a href="./study/isbe/search.html?string=RESURRECTION">RESURRECTION</a>; <a href="./study/isbe/search.html?string=ASCENSION">ASCENSION</a>; <a href="./study/isbe/search.html?string=PHARISEES">PHARISEES</a>; <a href="./study/isbe/search.html?string=SADDUCEES">SADDUCEES</a>; <a href="./study/isbe/search.html?string=HEROD">HEROD</a>; <a href="./study/isbe/search.html?string=JERUSALEM">JERUSALEM</a>, etc.``132';
isbe[5028]='Jesus Christ, the Arrest and Trial of`<p>1. Jewish and Roman Law<P>2. Difficulties of the Subject<P>3. Illustrations of Difficulties<P><b>I. THE ARREST</b><P class="in15">1. Preparatory Steps<P class="in15">2. The Arrest in the Garden<P class="in15">3. Taken to the City<P><b>II. THE JEWISH TRIAL</b><P class="in15">1. The Jewish Law<P class="in15">2. The Mishna<P class="in15">3. Criminal Trials<P class="in15">4. The Trial of Jesus<P class="in15">5. The Preliminary Examination<P class="in15">6. The Night Trial<P class="in15">7. False Witnesses<P class="in15">8. A Browbeating Judge<P class="in15">9. The Morning Session<P class="in15">10. Powers of the Sanhedrin<P class="in15">11. Condemnation for Blasphemy<P class="in15">12. Summary<P><b>III. THE ROMAN TRIAL</b><P class="in15">1. Taken before Pilate<P class="in15">2. Roman Law and Procedure<P class="in15">3. Full Trial Not Desired<P class="in15">4. Final Accusation<P class="in15">5. Examination, Defence and Acquittal<P class="in15">6. Fresh Accusations<P class="in15">7. Reference to Herod<P class="in15">8. Jesus or Barabbas<P class="in15">9. Behold the Man!<P class="in15">10. Pilate Succumbs to Threats<P class="in15">11. Pilate Washes His Hands<P class="in15">12. The Sentence<P class="in15">13. Review<hr /><P>This subject is of special interest, not only on account of its inherent importance, but more particularly on account of its immediately preceding, and leading directly up to what is the greatest tragedy in human history, the crucifixion of our Lord. It has also the added interest of being the only proceeding on record in which the two great legal systems of antiquity, the Jewish and the Roman, which have most largely influenced modern legislation and jurisprudence, each played a most important part.<P>1. Jewish and Roman Law:<P>The coexistence of these two systems in Judea, and their joint action in bringing about the tremendous results in question, were made possible by the generous policy pursued by Rome in allowing conquered nations to retain their ancient laws, institutions and usages, in so far as they were compatible with Roman sovereignty and supremacy. Not only so, but, in a large degree, they permitted these laws to be administered by the officials of the subject peoples. This privilege was not granted absolutely, but was permitted only so long as it was not abused. It might be withdrawn at any time, and the instances in which this was, done were by no means rare.<P>Of the matters considered in this article, the arrest of Jesus and the proceedings before Annas, Caiaphas and the Sanhedrin took place professedly under Jewish law; the proceedings before Pilate and the reference to Herod, under Roman law.<P>2. Difficulties of the Subject:<P>It is very difficult to construct from the materials in the four Gospels a satisfactory continuous record of the arrest, and of what may be called the twofold trial of Jesus. The Gospels were written from different viewpoints, and for different purposes, each of the writers selecting such particulars as seemed to him to be of special importance for the particular object he had in view. Their reports are all very brief, and the proper chronological order of the various events recorded in different Gospels must, in many eases, be largely a matter of conjecture. The difficulty is increased by the great irregularities and the tumultuous character of the proceedings; by our imperfect knowledge of the topography of Jerusalem at this time (29 AD); also by the fact that the reports are given mainly in popular and not in technical language; and when the latter form is used, the technical terms have had to be translated into Greek, either from the Hebrew or from the Latin.<P>3. Illustrations of Difficulties:<P>For instance, opinions are divided as to where Pilate resided when in Jerusalem, whether in the magnificent palace built by Herod the Great, or in the castle of Antonia; as to where was the palace occupied by Herod Antipas during the Passover; whether Annas and Caiaphas occupied different portions of the same palace, or whether they lived in adjoining or different residences; whether the preliminary examination of Jesus, recorded by John, was before Annas or Caiaphas, and as to other similar matters. It is very satisfactory, however, to know that, although it is sometimes difficult to decide exactly as to the best way of harmonizing the different accounts, yet there is nothing irreconcilable or contradictory in them, and that there is no material point in the history of the very important proceedings falling within the scope of this article which is seriously affected by any of these debatable matters.<P>For a clear historical statement of the events of the concluding day in the life of our Lord before His crucifixion, see the article on <a href="./study/isbe/search.html?string=JESUS+CHRIST">JESUS CHRIST</a>. The present article will endeavor to consider the matters relating to His arrest and trial from a legal and constitutional point of view.<P>I. The Arrest.<P>During the last year of the ministry of Jesus, the hostility of the Jews to Him had greatly increased, and some six months before they finally succeeded in accomplishing their purpose, they had definitely resolved to make away with Him. At the Feast of Tabernacles they sent officers (the temple-guards) to take Him while He was teaching in the temple (<a onClick="return mV(\'Jhn\',7,32);">Joh 7:32</a>); but these, after listening to His words, returned without having made the attempt, giving as a reason that "never man so spake" (<a onClick="return mV(\'Jhn\',7,46);">Joh 7:46</a>).<P>After His raising of Lazarus, their determination to kill Him was greatly intensified. A special meeting of the council was held to consider the matter. There Caiaphas, the high priest, strongly advocated such a step on national grounds, and on the ground of expediency, quoting in support of his advice, in a cold-blooded and cynical manner, the Jewish adage that it was expedient that one man should die for the people, and that the whole nation perish not. Their plans to this end were frustrated, for the time being, by Jesus withdrawing Himself to the border of the wilderness, where He remained with His disciples (<a onClick="return mV(\'Jhn\',11,\'47-54\');">Joh 11:47-54</a>).<P>On His return to Bethany and Jerusalem, six days before the Passover, they were deterred from carrying out their design on account of His manifest popularity with the people, as evidenced by His triumphal entry into Jerusalem on the first day of the Passover week (Palm Sunday), and by the crowds who thronged around Him, and listened to His teachings in the temple, and who enjoyed the discomfiture of the Pharisees, Sadducees and Herodians, as they successively sought to entangle Him in His talk.<P>Two days before the Passover, at a council meeting held in the palace of Caiaphas, they planned to accomplish their purpose by subtlety, but "not during the feast, lest a tumult arise among the people" (<a onClick="return mV(\'Mat\',26,\'3-5\');">Mt 26:3-5</a>; <a onClick="return mV(\'Mar\',14,1,2);">Mr 14:1,2</a>). While they were in this state of perplexity, to their great relief Judas came to them and agreed to betray his Master for money (<a onClick="return mV(\'Mat\',26,\'14-16\');">Mt 26:14-16</a>; <a onClick="return mV(\'Mar\',14,10,11);">Mr 14:10,11</a>).<P>1. Preparatory Steps:<P>This time they determined not to rely solely upon their own temple-guards or officers to execute their warrant or order of arrest, fearing that these officials, being Jews, might again be fascinated by the strange influence which Jesus exercised over His countrymen, or that His followers might offer resistance. They therefore applied to Pilate, the Roman procurator (governor), for the assistance of a band of Roman soldiers. He granted them a cohort (Greek: speira, 400 to 600 men) from the legion then quartered in the castle of Antonia, which adjoined and overlooked the temple-area. The final arrangements as to these would probably be completed while Judas was at the supper room. It has been suggested that the whole cohort would not go, but only a selection from them. However, it is said that Judas "received the band (cohort) of soldiers" (<a onClick="return mV(\'Jhn\',18,3);">Joh 18:3</a>), and that they were under the command of a chief captain (Greek: chiliarch, Latin tribune, <a onClick="return mV(\'Jhn\',18,12);">Joh 18:12</a>). If there had not been more than 100 soldiers, they would not have been under the command of a captain, but the chief officer would have been a centurion. The amazing popularity of Jesus, as shown by His triumphal entry into the city, may have led the authorities to make such ample provision against any possible attempt at rescue.<P>The Garden of Gethsemane, in which Judas knew that Jesus would be found that night, was well known to him (<a onClick="return mV(\'Jhn\',18,2);">Joh 18:2</a>); and he also knew the time he would be likely to find his Master there. Thither at the proper hour he led the band of soldiers, the temple officers and others, and also some of the chief priests and elders themselves; the whole being described as "a great multitude with swords and staves" (<a onClick="return mV(\'Mat\',26,47);">Mt 26:47</a>). Although the Easter full moon would be shining brightly, they also carried "lanterns and torches" (<a onClick="return mV(\'Jhn\',18,3);">Joh 18:3</a>), in order to make certain that Jesus should not escape or fail to be recognized in the deep shade of the olive trees in the garden.<P>2. The Arrest in the Garden:<P>On their arrival at the garden, Jesus came forward to meet them, and the traitor Judas gave them the appointed signal by kissing Him. As the order or warrant was a Jewish one, the temple officers would probably be in front, the soldiers supporting them as reserves. On Jesus announcing to the leaders that He was the one they sought, what the chief priests had feared actually occurred. There was something in the words or bearing of Jesus which awed the temple officers; they were panic-stricken, went backward, and fell to the ground. On their rallying, the impetuous Peter drew his sword, and cut off the ear of one of them, Malchus, the servant of the high priest (<a onClick="return mV(\'Jhn\',18,\'6-10\');">Joh 18:6-10</a>).<P>On this evidence of resistance the Roman captain and soldiers came forward, and with the assistance of the Jewish officers bound Jesus. Under the Jewish law this was not lawful before condemnation, save in exceptional cases where resistance was either offered or apprehended.<P>Even in this trying hour the concern of Jesus was more for others than for Himself, as witness His miracle in healing the ear of Malchus, and His request that His disciples might be allowed their liberty (<a onClick="return mV(\'Jhn\',18,8);">Joh 18:8</a>). Notwithstanding His efforts, His followers were panic-stricken, probably on account of the vigorous action of the officers and soldiers after the assault by Peter, "and they all left him and fled" (<a onClick="return mV(\'Mar\',14,50);">Mr 14:50</a>).<P>It is worthy of note that Jesus had no word of blame or censure for the Roman officers or soldiers who were only doing their sworn duty in supporting the civil authorities; but His pungent words of reproach for not having attempted His arrest while He was teaching openly in the temple were reserved for "the chief priests, and captains of the temple, and elders" (<a onClick="return mV(\'Luk\',22,52);">Lu 22:52</a>), who had shown their inordinate zeal and hostility by taking the unusual, and for those who were to sit as judges on the case, the improper and illegal course of accompanying the officers, and themselves taking part in the arrest.<P>3. Taken to the City:<P>The whole body departed with their prisoner for the city. From the first three Gospels one might infer that they went directly to the palace of Caiaphas, the high priest. In the Fourth Gospel, however, we are told that they took him first to Annas (<a onClick="return mV(\'Jhn\',18,13);">Joh 18:13</a>).<P>Why they did so we are not informed, the only statement made being that he was the father-in-law of Caiaphas (<a onClick="return mV(\'Jhn\',18,13);">Joh 18:13</a>). He had been the high priest from 7 AD to 15 AD, when he was deposed by Valerius Gratus, the Roman procurator. He was still the most influential member of the Sanhedrin, and, being of an aggressive disposition, it may be that it was he who had given instructions as to the arrest, and that they thought it their duty to report first to him.<P>Annas, however, sent Jesus bound to Caiaphas (<a onClick="return mV(\'Jhn\',18,24);">Joh 18:24</a>). Having delivered over their prisoner, the Roman soldiers would proceed to their quarters in the castle, the temple officials retaining Jesus in their charge.<P>Meanwhile, the members of the Sanhedrin were assembling at the palace of the high priest, and the preliminary steps toward the first or Jewish trial were being taken.<P>II. The Jewish Trial.<P>1. The Jewish Law:<P>It is the just boast of those countries whose jurisprudence had its origin in the common law of England, that their system of criminal law is rounded upon the humane maxims that everyone is presumed to be innocent until he is proved to be guilty, and that no one is bound to criminate himself. But the Jewish law went even farther in the safeguards which it placed around an accused person. In the Pentateuch it is provided that one witness shall not be sufficient to convict any man of even a minor offense. "One witness shall not rise up against a man for any iniquity, or for any sin, in any sin that he sinneth: at the mouth of two witnesses, or at the mouth of three witnesses, shall a matter be established" (<a onClick="return mV(\'Deu\',19,15);">De 19:15</a>).<P>2. The Mishna:<P>These principles of the Mosaic law were elaborated and extended in the system which grew up after the return from Babylon. It was begun by the men of the Great Synagogue, and was afterward completed by the Sanhedrin which succeeded them. Up to the time of our Lord, and for the first two centuries of the Christian era, their rules remained largely in an oral or unwritten form, until they were compiled or codified in the Mishna by Rabbi Judah and his associates and successors in the early part of the 3rd century. It is generally conceded by both Jewish and Christian writers that the main provisions, therein found for the protection of accused persons, had been long incorporated in the oral law and were recognized as a part of it in the time of Annas and Caiaphas.<P>3. Criminal Trials:<P>The provisions relating to criminal trials, and especially to those in which the offense was punishable by death, were very stringent and were all framed in the interest of the accused. Among them were the following: The trial must be begun by day, and if not completed before night it must be adjourned and resumed by day; the quorum of judges in capital cases was 23, that being the quorum of the Grand Council; a verdict of acquittal, which required only a majority of one, might be rendered on the same day as the trial was completed; any other verdict could only be rendered on a subsequent day and required a majority of at least two; no prisoner could be convicted on his own evidence; it was the duty of a judge to see that the interests of the accused were fully protected.<P>The modern practice of an information or complaint and a preliminary investigation before a magistrate was wholly unknown to the Jewish law and foreign to its genius. The examination of the witnesses in open court was in reality the beginning of a Jewish trial, and the crime for which the accused was tried, and the sole charge he had to meet, was that which was disclosed by the evidence of the witnesses.<P>4. The Trial of Jesus:<P>Let us see how far the foregoing principles and rules were followed and observed in the proceedings before the high priest in the present instance. The first step taken in the trial was the private examination of Jesus by the high priest, which is recorded only in <a onClick="return mV(\'Jhn\',18,\'19-23\');">Joh 18:19-23</a>. Opinions differ as to whether this examination was conducted by Annas at his residence before he sent Jesus to Caiaphas (<a onClick="return mV(\'Jhn\',18,24);">Joh 18:24</a>), or by the latter after Jesus had been delivered up to him.<P>Caiaphas was actually the high priest at the time, and had been for some years. Annas had been deposed from the office about 14 years previously by the Roman procurator; but he was still accorded the title (<a onClick="return mV(\'Act\',4,6);">Ac 4:6</a>). Many of the Jews did not concede the right of the procurator to depose him, and looked upon him as still the rightful high priest. He is also said to have been at this time the vice-president of the Sanhedrin. The arguments as to which of them is called the high priest by John in this passage are based largely upon two different renderings of <a onClick="return mV(\'Jhn\',18,24);">Joh 18:24</a>. In the King James Version the verse reads "Now Annas had sent him bound unto Caiaphas the high priest," a reading based upon the Textus Receptus of the New Testament which implies that Jesus had been sent to Caiaphas before the examination. On the other hand, the Revised Version (British and American), following the Greek text adopted by Nestle and others, reads, "Annas therefore sent him bound unto Caiaphas the high priest," implying that Annas sent him to Caiaphas on account of what had taken place in the examination.<P>However, it is not material which of these two leading members of the Sanhedrin conducted the examination. The same may also be said as to the controversy regarding the residence of Annas at the time, whether it was in some part of the official palace of the high priest or elsewhere. The important matters are the fact, the time, and the manner of the examination by one or other of these leading members of the council, not the precise place where, or the particular person by whom, it was conducted.<P>5. The Preliminary Examination:<P>The high priest (whether Annas or Caiaphas) proceeded to interrogate Jesus concerning His disciples and His doctrine (<a onClick="return mV(\'Jhn\',18,19);">Joh 18:19</a>). Such a proceeding formed no part of a regular Jewish trial, and was, moreover, not taken in good faith; but with a view to entrapping Jesus into admissions that might be used against Him at the approaching trial before the council. It appears to have been in the nature of a private examination, conducted probably while the members of the council were assembling. The dignified and appropriate answer of Jesus pointedly brought before the judge the irregularity he was committing, and was a reminder that His trial should begin with the examination of the witnesses: "\'I spake openly to the world; I ever taught in the synagogue, and in the temple, whither the Jews always resort; and in secret have I said nothing. Why askest thou me? Ask them which heard me, what I have said unto them: behold, they know what I said" (<a onClick="return mV(\'Jhn\',18,20,21);">Joh 18:20,21</a> the King James Version). The reply to this was a blow from one of the officers, an outrageous proceeding which appears to have passed unrebuked by the judge, and it was left to Jesus Himself to make the appropriate protest.<P>6. The Night Trial:<P>The next proceeding was the trial before the council in the palace of Caiaphas, attended at least by the quorum of 23. This was an illegal meeting, since a capital trial, as we have seen, could not either be begun or proceeded with at night. Some of the chief priests and elders, as previously stated, had been guilty of the highly improper act for judges, of taking part in and directing the arrest of Jesus. Now, "the chief priests and the whole council" spent the time intervening between the arrest and the commencement of the trial in something even worse: they "sought false witness against Jesus, that they might put him to death" (<a onClick="return mV(\'Mat\',26,59);">Mt 26:59</a>). This, no doubt, only means that they then collected their false witnesses and instructed them as to the testimony they should give. For weeks, ever since the raising of Lazarus, they had been preparing for such a trial, as we read: "So from that day forth they took counsel that they might put him to death" (<a onClick="return mV(\'Jhn\',11,53);">Joh 11:53</a>).<P>Caiaphas, as high priest and president of the Sanhedrin, presided at the meeting of the council. The oath administered to witnesses in a Jewish court was an extremely solemn invocation, and it makes one shudder to think of the high priest pronouncing these words to perjured witnesses, known by him to have been procured by the judges before him in the manner stated.<P>7. False Witnesses:<P>But even this did not avail. Although "many bare false witness against him," yet on account of their having been imperfectly tutored by their instructors, or for other cause, "their witness agreed not together" (<a onClick="return mV(\'Mar\',14,56);">Mr 14:56</a>), and even these prejudiced and partial judges could not find the concurring testimony of two witnesses required by their law (<a onClick="return mV(\'Deu\',19,15);">De 19:15</a>).<P>The nearest approach to the necessary concurrence came at last from two witnesses, who gave a distorted report of a figurative and enigmatic statement made by Jesus in the temple during His early ministry: "Destroy this temple, and in three days I will raise it up" (<a onClick="return mV(\'Jhn\',2,19);">Joh 2:19</a>). The explanation is given: "He spake of the temple of his body" (<a onClick="return mV(\'Jhn\',2,21);">Joh 2:21</a>). The testimony of the two witnesses is reported with but slight variations in the two first Gospels as follows: "This man said, I am able to destroy the temple of God, and to build it in three days" (<a onClick="return mV(\'Mat\',26,61);">Mt 26:61</a>); and "We heard him say, I will destroy this temple that is made with hands, and in three days I will build another made without hands" (<a onClick="return mV(\'Mar\',14,58);">Mr 14:58</a>). Whether these slightly different statements represent the discrepancies in their testimony, or on account of some other variations or contradictions, the judges reluctantly decided that "not even so did their witness agree together" (<a onClick="return mV(\'Mar\',14,59);">Mr 14:59</a>).<P>8. A Browbeating Judge:<P>Caiaphas, having exhausted his list of witnesses, and seeing the prosecution on which he had set his heart in danger of breaking down for the lack of legal evidence, adopted a blustering tone, and said to Jesus, "Answerest thou nothing? what is it which these witness against thee? But Jesus held his peace" (<a onClick="return mV(\'Mat\',26,62,63);">Mt 26:62,63</a>), relying on the fact that the prosecution had utterly failed on account of the lack of agreement of two witnesses on any of the charges. As a final and desperate resort, Caiaphas had recourse to a bold strategic move to draw from Jesus an admission or confession on which he might base a condemnation, similar to the attempt which failed at the preliminary examination; but this time fortifying his appeal by a solemn adjuration in the name of the Deity. He said to Jesus: "I adjure thee by the living God, that thou tell us whether thou art the Christ, the Son of God. Jesus saith unto him, Thou hast said: nevertheless I say unto you, Henceforth ye shall see the Son of man sitting at the right hand of Power, and coming on the clouds of heaven" (<a onClick="return mV(\'Mat\',26,63,64);">Mt 26:63,64</a>). Caiaphas, although knowing that under the law Jesus could not be convicted on His own answers or admissions, thereupon in a tragic manner "rent his garments, saying, He hath spoken blasphemy: what further need have we of witnesses? behold, now ye have heard the blasphemy: what think ye? They answered and said, He is worthy of death (<a onClick="return mV(\'Mat\',26,65,66);">Mt 26:65,66</a>).<P>The night session then broke up to meet again after daybreak in order to ratify the decision just come to, and to give a semblance of legality to the trial and verdict. The closing scene was one of disorder, in which they spat in their prisoner\'s face and buffeted him (<a onClick="return mV(\'Mat\',26,67,68);">Mt 26:67,68</a>; <a onClick="return mV(\'Luk\',22,\'63-65\');">Lu 22:63-65</a>).<P>9. The Morning Session:<P>The following morning, "as soon as it was day," the council reassembled in the same place, and Jesus was led into their presence (<a onClick="return mV(\'Luk\',22,66);">Lu 22:66</a>). There were probably a number of the council present who had not attended the night session. For the benefit of these, and perhaps to give an appearance of legality to the proceeding, the high priest began the trial anew, but not with the examination of witnesses which had proved such a failure at the night session. He proceeded at once to ask substantially the same questions as had finally brought out from Jesus the night before the answer which he had declared to be blasphemy, and upon which the council had "condemned him to be worthy of death" (<a onClick="return mV(\'Mar\',14,64);">Mr 14:64</a>). The meeting is mentioned in all the Gospels, the details of the examination are related by Luke alone. When asked whether He was the Christ, He replied, "If I tell you, ye will not believe: and if I ask you, ye will not answer. But from henceforth shall the Son of man be seated at the right hand of the power of God" (<a onClick="return mV(\'Luk\',22,\'67-69\');">Lu 22:67-69</a>). This answer not being sufficient to found a verdict of blasphemy upon, they all cried out, "Art thou then the Son of God?" To this He gave an affirmative answer, "Ye say that I am. And they said, What further need have we of witness? for we ourselves have heard from his own mouth" (<a onClick="return mV(\'Luk\',22,70,71);">Lu 22:70,71</a>).<P>10. Powers of the Sanhedrin:<P>It will be observed that neither at the night nor at the morning session was there any sentence pronounced upon Jesus by the high priest. There was on each occasion only what would be equivalent to a verdict of guilty found by a jury under our modern criminal practice, but no sentence passed upon the prisoner by the presiding judge. When Judea lost the last vestige of its independence and became a Roman province (6 AD), the Sanhedrin ceased to have the right to inflict Capital punishment or to administer the law of life and death. This jurisdiction was thenceforth transferred to the Roman procurator. The Sanhedrin submitted very reluctantly to this curtailment of its powers. A few years later it exercised it illegally and in a very riotous manner in the case of Stephen (<a onClick="return mV(\'Act\',7,58);">Ac 7:58</a>). Annas, however, of all men, had good reason not to violate this law, as his having done so during the absence of the procurator was the cause of his being deposed from the office of high priest by Valerius Gratus (15 AD).<P>The proceedings may have been taken before the high priest in the hope that Pilate might be induced to accept the verdict of the Sanhedrin as conclusive that Jesus had been guilty of an offense punishable by death under the Jewish law.<P>11. Condemnation for Blasphemy:<P>Now what was the precise crime or crimes for which Jesus was tried at these two sittings of the council? The first impression would probably be that there was no connection between the charge of destroying the temple and building another in three days, and His claiming to be the Son of God. And yet they were closely allied in the Jewish mind. The Jewish nation being a pure theocracy, the overthrow of the temple, the abode of the Divine Sovereign, would mean the overthrow of Divine institutions, and be an act of treason against the Deity. The profession of ability to build another temple in three days would be construed as a claim to the possession of supernatural power and, consequently, blasphemy. As to the other claim which He Himself made and confessed to the council, namely, that He was the Christ, the Son of God, none of them would have any hesitation in concurring in the verdict of the high priest that it was rank blasphemy, when made by one whom they regarded simply as a Galilean peasant.<P>12. Summary:<P>To sum up: The Jewish trial of our Lord was absolutely illegal, the court which condemned Him being without jurisdiction to try a capital offense, which blasphemy was under the Jewish law. Even if there had been jurisdiction, it would have been irregular, as the judges had rendered themselves incompetent to try the case, having been guilty of the violation of the spirit of the law that required judges to be unprejudiced and impartial, and carefully to guard the interests of the accused. Even the letter of the law had been violated in a number of important respects. Among these may be mentioned:<P class="in15">(1) some of the judges taking part in and directing the arrest;<P class="in15">(2) the examination before the trial and the attempt to obtain admissions;<P class="in15">(3) endeavors of the judges to procure the testimony of false witnesses;<P class="in15">(4) commencing and continuing the trial at night;<P class="in15">(5) examining and adjuring the accused in order to extort admissions from Him;<P class="in15">(6) rendering a verdict of guilty at the close of the night session, without allowing a day to intervene;<P class="in15">(7) holding the morning session on a feast day, and rendering a verdict at its close; and<P class="in15">(8) rendering both verdicts without any legal evidence.<P>III. The Roman Trial.<P>Early on the morning of Friday of the Passover week, as we have already seen, "the chief priests with the elders and scribes, and the whole council" held a consultation (Mark), in the palace of the high priest; and after the examination of Jesus and their verdict that He was guilty of blasphemy, they took counsel against Him "to put him to death" (Matthew), this being, in their judgment, the proper punishment for the offense of which they had pronounced Him guilty.<P>1. Taken before Pilate:<P>For the reasons already mentioned, they came to the conclusion that it would be necessary to invoke the aid of the Roman power in carrying out this sentence. They thereupon bound Jesus, and led Him away and delivered Him up to Pilate, who at this time probably occupied, while in Jerusalem, the magnificent palace built by Herod the Great. Jesus was taken into the judgment hall of the palace or Praetorium; His accusers, unwilling to defile themselves by entering into a heathen house and thereby rendering themselves unfit to eat the Passover, remained outside upon the marble pavement.<P>2. Roman Law and Procedure:<P>The proceedings thus begun were conducted under a system entirely different from that which we have thus far been considering, both in its nature and its administration. The Jewish law was apart of the religion, and in its growth and development was administered in important cases by a large body of trained men, who were obliged to follow strictly a well-defined procedure. The Roman law, on the other hand, had its origin and growth under the stern and manly virtues and the love of justice which characterized republican Rome, and it still jealously guarded the rights and privileges of Roman citizens, even in a conquered province. Striking illustrations of this truth are found in the life of Paul (see <a onClick="return mV(\'Act\',16,\'35-39\');">Ac 16:35-39</a>; <a onClick="return mV(\'Act\',22,\'24-29\');">22:24-29</a>; <a onClick="return mV(\'Act\',25,\'10-12\');">25:10-12</a>). The lives and fortunes of the natives in an imperial province like Judea may be said to have been almost completely at the mercy of the Roman procurator or governor, who was responsible to his imperial master alone, and not even to the Roman senate. Pilate therefore was well within the mark when, at a later stage of the trial, being irritated at Jesus remaining silent when questioned by him, he petulantly exclaimed: "Speakest thou not unto me? knowest thou not that I have power to release thee, and have power to crucify thee?" (<a onClick="return mV(\'Jhn\',19,10);">Joh 19:10</a>). While, however, the procurator was not compelled in such cases to adhere strictly to the prescribed procedure, and had a wide discretion, he was not allowed to violate or depart from the established principles of the law.<P>On this occasion, Pilate, respecting the scruples of the chief priests about entering the palace, went outside at their request, apparently leaving Jesus in the Pretorium. He asked them the usual formal question, put at the opening of a Roman trial: "What accusation bring ye against this man?<P>3. Full Trial Not Desired:<P>They answered and said unto him, If he were not an evil-doer, we should not have delivered him up unto thee" (<a onClick="return mV(\'Jhn\',18,29);">Joh 18:29</a>f the King James Version). Pilate could see at once that this was a mere attempt to evade the direct question he had asked, and was not such an accusation as disclosed any offense known to the Roman law. Affecting to treat it with disdain, and as something known only to their own law, he said, "Take him yourselves, and judge him according to your law. The Jews said unto him, It is not lawful for us to put any man to death" (<a onClick="return mV(\'Jhn\',18,31);">Joh 18:31</a>).<P>4. Final Accusation:<P>Perceiving that Pilate would not gratify their desire to have Jesus condemned on the verdict which they had rendered, or for an offense against their own law only, "they began to accuse him, saying, We found this man perverting our nation, and forbidding to give tribute to Caesar, and saying that he himself is Christ a king" (<a onClick="return mV(\'Luk\',23,2);">Lu 23:2</a>). This was an accusation containing three charges, much like a modern indictment containing three counts. Pilate appears to have been satisfied that there was nothing in the first two of these charges; but the third was too serious to be ignored, especially as it was a direct charge of majestas or treason, the greatest crime known to the Roman law, and as to which the reigning emperor, Tiberius, and his then favorite, Sejanus, were particularly sensitive and jealous. The charges in this case were merely oral, but it would appear to have been in the discretion of the procurator to receive them in this form in the case of one who was not a Roman citizen.<P>5. Examination, Defence and Acquittal:<P>The accusers having been heard, Pilate returned to the Pretorium to examine Jesus regarding the last and serious accusation. The Four Gospels give in the same words the question put to him by Pilate, "Art thou the King of the Jews?" The first three record only the final affirmative answer, "Thou sayest," which if it stood alone might have been taken as a plea of guilty; but John gives the intervening discussion which explains the matter fully. He tells us that Jesus did not answer the question directly, but asked Pilate, "Sayest thou this of thyself, or did others tell it thee concerning me?" (<a onClick="return mV(\'Jhn\',18,34);">Joh 18:34</a>) (apparently not having been outside when the charges were made). On being told that it came from the chief priests, He went on to explain that His kingdom was not of this world, but was a spiritual kingdom. Being again asked if He was a king, He replied in effect, that He was a king in that sense, and that His subjects were those who were of the truth and heard His voice (<a onClick="return mV(\'Jhn\',18,\'35-37\');">Joh 18:35-37</a>). Pilate, being satisfied with His explanation, "went out again unto the Jews," and apparently having taken Jesus with him, he mounted his judgment seat or movable tribunal, which had been placed upon the tesselated pavement, and pronounced his verdict, "I find in him no fault at all" (<a onClick="return mV(\'Jhn\',18,38);">Joh 18:38</a> the King James Version, the Revised Version (British and American) "I find no crime in him").<P>6. Fresh Accusations:<P>According to the Roman law, this verdict of acquittal should have ended the trial and at once secured the discharge of Jesus; but instead it brought a volley of fresh accusations to which Jesus made no reply. Pilate hesitated, and hearing a charge that Jesus had begun His treasonable teaching in Galilee, the thought occurred to him that he might escape from his dilemma by sending Jesus for trial to Herod Antipas, the tetrarch of Galilee, who was then in Jerusalem for the feast, which he accordingly did (<a onClick="return mV(\'Luk\',23,7);">Lu 23:7</a>).<P>7. Reference to Herod:<P>Herod had long been desirous to see Jesus—"hoped to see some miracle done by him," and "questioned him in many words; but he answered him nothing." The chief priests and scribes, who had followed him from the Pretorium to the Maccabean palace, which Herod was then occupying, "stood, vehemently accusing" Jesus (<a onClick="return mV(\'Luk\',23,\'8-10\');">Lu 23:8-10</a>). "That fox," however, as Jesus had called him (<a onClick="return mV(\'Luk\',13,32);">Lu 13:32</a>), was too astute to intermeddle in a trial for treason, which was a dangerous proceeding, and possibly he was aware that Pilate had already acquitted Him; in which case a retrial by him would be illegal. He and his soldiers, probably irritated at the refusal of Jesus to give him any answer, mocked Him, and arraying Him in a gorgeous robe, no doubt in ridicule of His claim to be a king, sent Him back to Pilate. This reference to Herod in reality formed no effective part of the trial of Jesus, as Herod declined the jurisdiction, although Pilate sought to make use of it in his subsequent discussion with the chief priests. The only result was that Herod was flattered by the courtesy of Pilate, the enmity between them ceased, and they were made friends (<a onClick="return mV(\'Luk\',23,11,12,15);">Lu 23:11,12,15</a>).<P>8. Jesus or Barabbas:<P>On their return, Pilate resumed his place on the judgment seat outside. What followed, however, properly formed no part of the legal trial, as it was a mere travesty upon law as well as upon justice. Pilate resolved to make another attempt to secure the consent of the Jews to the release of Jesus. To this end he summoned not only the chief priests and the rulers, but "the people" as well (<a onClick="return mV(\'Luk\',23,13);">Lu 23:13</a>), and after mentioning the failure to prove any of the charges made against Jesus, he reminded them of the custom of releasing at the feast a prisoner selected by them, and offering as a compromise to chastise or scourge Jesus before releasing Him. At this point Pilate\'s anxiety to release Jesus was still further increased by the message he received from his wife concerning her disturbing dream about Jesus and warning him to "have...nothing to do with that righteous man" (<a onClick="return mV(\'Mat\',27,19);">Mt 27:19</a>). Meanwhile, the chief priests and elders were busily engaged in canvassing the multitude to ask for the release of Barabbas, the notable robber, and destroy Jesus (<a onClick="return mV(\'Mat\',27,20);">Mt 27:20</a>). When Pilate urged them to release Jesus, they cried out all together, "Away with this man, and release unto us Barabbas"; and upon a further appeal on behalf of Jesus they cried, "Crucify, crucify him." A third attempt on his part met with no better result (<a onClick="return mV(\'Luk\',23,\'18-23\');">Lu 23:18-23</a>).<P>9. Behold the Man!:<P>The Fourth Gospel alone records a final attempt on the part of Pilate to save Jesus. He scourged Him, it has been suggested, with a view to satisfying their desire for His punishment, and afterward appealing to their pity. He allowed his soldiers to repeat what they had seen done at Herod\'s palace, and place a crown of thorns upon His head, array Him in a purple robe, and render mock homage to Him as king of the Jews. Pilate went out to the Jews with Jesus thus arrayed and bleeding. Again declaring that he found no fault in Him, he presented Him, saying, "Behold, the man!" This was met by the former cry, "Crucify him, crucify him." Pilate replied, "Take him yourselves...for I find no crime in him." The Jews referred him to their law by which He deserved death because He made Himself the Son of God. This alarmed Pilate\'s superstitious fears, who by this time appears to have wholly lost control of himself. He took Jesus into the palace and said to Him, "Whence art thou? But Jesus gave him no answer." Irritated at His silence, Pilate reminded Him of his absolute power over Him. The mysterious answer of Jesus as to the source of power still further alarmed him, and he made new efforts to secure His discharge (<a onClick="return mV(\'Jhn\',19,\'1-9\');">Joh 19:1-9</a>).<P>10. Pilate Succumbs to Threats:<P>The Jews were well aware that Pilate was arbitrary and cruel, but they had also found that he was very sensitive as to anything that might injuriously affect his official position or his standing with his master, the emperor. As a last resort they shouted to him, "If thou release this man, thou art not Caesar\'s friend: every one that maketh himself a king speaketh against Caesar" (<a onClick="return mV(\'Jhn\',19,12);">Joh 19:12</a>). The prospect of a charge of his aiding and abetting such a crime as treason, in addition to the other charges that a guilty conscience told him might be brought against him, proved too much for the vacillating procurator. He brought Jesus out, and sat down again upon the judgment seat placed upon the pavement. He made one more appeal, "Shall I crucify your King?" The chief priests gave the hypocritical answer, "We have no king but Caesar" (<a onClick="return mV(\'Jhn\',19,15);">Joh 19:15</a>). Pilate finally succumbed to their threats and clamor; but took his revenge by placing upon the cross the superscription that was so galling to them, "THE KING OF THE JEWS."<P>11. Pilate Washes His Hands:<P>Then occurred the closing scene of the tragedy, recorded only in the First Gospel, when Pilate washed his hands before the multitude (a Jewish custom), saying to them, "I am innocent of the blood of this righteous man; see ye to it." The reply was that dreadful imprecation, "His blood be on us, and on our children" (<a onClick="return mV(\'Mat\',27,24,25);">Mt 27:24,25</a>).<P>12. The Sentence:<P>Pilate resumes his place upon the judgment seat, the fatal sentence at last falls from his lips, and Jesus is delivered up to be crucified.<P>Now, how far were these proceedings in accordance with the Roman law under which they purported to have been taken and conducted? In the first place, Pilate, as procurator, was the proper officer to try the charges brought against Jesus.<P>13. Review:<P>In the next place he acted quite properly in declining to entertain a charge which disclosed no offense known to the Roman law, or to pass a sentence based on the verdict of the Sanhedrin for an alleged violation of the Jewish law. He appears to have acted in accordance with the law, and indeed in a judicial and praiseworthy manner in the trial and disposition of the threefold indictment for treason (unless it be a fact that Jesus was not present when these accusations were brought against Him outside the Pretorium, which would be merely an irregularity, as they were made known to him later inside). Pilate\'s initial mistake, which led to all the others, was in not discharging Jesus at once, when he had pronounced the verdict of acquittal.<P>All the subsequent proceedings were contrary to both the letter and the spirit of the law. Although Pilate took his place upon the judgment seat, his acts, properly speaking, were not those of a judge, and had no legal force or value; but were rather the futile attempts of a weak and vacillating politician to appease an angry mob thirsting for the blood of an innocent countryman. The carrying out of a sentence imposed in such circumstances, and under such conditions, may not inaptly be described as a judicial murder.``111';
isbe[5029]='Jesus Justus`je\'-zus jus\'-tus Iesous ho legomenos Ioustos, "Jesus that is called Justus," <a onClick="return mV(\'Col\',4,11);">Col 4:11</a>):<P>1. A Jew by Birth:<P>One of three friends of Paul—the others being Aristarchus and Mark—whom he associates with himself in sending salutations from Rome to the church at Colosse. Jesus Justus is not mentioned elsewhere in the New Testament, and there is nothing more known about him than is given in this passage in Colossians, namely, that he was by birth a Jew—"of the circumcision"—that he had been converted to Christ, and that he was one of the inner circle of intimate friends and associates of the apostle during his first Roman captivity.<P>2. He Remains True to Paul:<P>The words also contain the information that at a stage in Paul\'s imprisonment, when the welcome extended to him by the Christians in Rome on his arrival there had lost its first warmth, and when in consequence, probably, of their fear of persecution, most of them had proved untrue and were holding aloof from him, J. J. and his two friends remained faithful. It would be pressing this passage unduly to make it mean that out of the large number—hundreds, or perhaps even one or two thousands—who composed the membership of the church in Rome at this time, and who within the next few years proved their loyalty to Christ by their stedfastness unto death in the Neronic persecution, all fell away from their affectionate allegiance to Paul at this difficult time. The words cannot be made to signify more than that it was the Jewish section of the church in Rome which acted in this unworthy manner—only temporarily, it is to be hoped. But among these Jewish Christians, to such dimensions had this defection grown that Aristarchus, Mark and J. J. alone were the apostle\'s fellow-workers unto the kingdom of God. These three alone, at that particular time—from among the Jewish Christians—were helping him in the work of the gospel in Rome. That this defection refers to the Jewish section of the church and not to the converts from among the Gentiles, is evident from many considerations. It seems to be proved, for example by verse 14 of the same chapter (i.e. <a onClick="return mV(\'Col\',4,14);">Col 4:14</a>), as well as by <a onClick="return mV(\'Phm\',1,24);">Phm 1:24</a>, in both of which passages Paul names Demas and Luke as his fellow-laborers; and Luke was not a Jew by birth. But in the general failure of the Christians in Rome in their conduct toward Paul, it is with much affection and pathos that he writes concerning Aristarchus, Mark, and J. J., "These only are my fellow-workers unto the kingdom of God, men that have been a comfort unto me."``155';
isbe[5030]='Jesus, Genealogy of``<a href="./study/isbe/search.html?string=GENEALOGY+OF+JESUS+CHRIST">GENEALOGY OF JESUS CHRIST</a>`1';
isbe[5031]='Jether`je\'-ther (yether, "abundance"):<P>(1) <a onClick="return mV(\'Exd\',4,18);">Ex 4:18</a> the Revised Version margin, King James Version, margin.<P>See <a href="./study/isbe/search.html?string=JETHRO">JETHRO</a>.<P>(2) Gideon\'s eldest son (<a onClick="return mV(\'Jdg\',8,20);">Jud 8:20</a>), who was called upon by his father to slay Zebah and Zalmunnah, but "feared, because he was yet a youth." The narrative there (<a onClick="return mV(\'Jdg\',8,4);">Jud 8:4</a>) should be connected with that of <a onClick="return mV(\'Jdg\',6,34);">Jud 6:34</a>, where Gideon is followed by his clan, and not with that of <a onClick="return mV(\'Jdg\',7,\'1-\');">Jud 7</a>, where he has 300 picked men. The captives would be taken to Orpah, Gideon\'s home, and slain there.<P>(3) Father of Amasa (<a onClick="return mV(\'1Ki\',2,5,32);">1Ki 2:5,32</a>); he was an Ishmaelite according to <a onClick="return mV(\'1Ch\',2,17);">1Ch 2:17</a> = "Ithra, the Israelite" of <a onClick="return mV(\'2Sa\',17,25);">2Sa 17:25</a>, where "the Ishmaelite" should be read for "the Israelite."<P>(4) A Jerahmeelite (<a onClick="return mV(\'1Ch\',2,32);">1Ch 2:32</a> twice).<P>(5) A Judahite (<a onClick="return mV(\'1Ch\',4,17);">1Ch 4:17</a>).<P>(6) A man of Asher (<a onClick="return mV(\'1Ch\',7,38);">1Ch 7:38</a>) = "Ithran" of <a onClick="return mV(\'1Ch\',7,37);">1Ch 7:37</a>.``149';
isbe[5032]='Jetheth`je\'-theth (yetheth, meaning unknown): a chief (or clan) of Edom (<a onClick="return mV(\'Gen\',36,40);">Ge 36:40</a> parallel <a onClick="return mV(\'1Ch\',1,51);">1Ch 1:51</a>), but probably a mistake for "Jether" = "Ithran" (<a onClick="return mV(\'Gen\',36,26);">Ge 36:26</a>).``1';
isbe[5033]='Jethlah`jeth\'-la (yithlah).`<a href="./study/isbe/search.html?string=ITHLAH">ITHLAH</a>`1';
isbe[5034]='Jethro`jeth\'-ro, je\'-thro (yithro, "excellence," <a onClick="return mV(\'Exd\',3,1);">Ex 3:1</a>; <a onClick="return mV(\'Exd\',4,18);">4:18b</a>; <a onClick="return mV(\'Exd\',18,\'1-12\');">18:1-12</a> (in <a onClick="return mV(\'Exd\',4,18);">4:18a</a>, probably a textual error, yether, "Iether," the King James Version margin, the Revised Version margin); Septuagint always Iothor): The priest of Midian and father-in-law (chothen) of Moses.<P>1. His Relation to Reuel and Hobab:<P>It is not easy to determine the relation of Jethro to Reuel and Hobab. If we identify Jethro with Reuel as in <a onClick="return mV(\'Exd\',2,18);">Ex 2:18</a>; <a onClick="return mV(\'Exd\',3,1);">3:1</a> (and in Ant, III, iii; V, ii, 3), we must connect "Moses\' father-in-law" in <a onClick="return mV(\'Num\',10,29);">Nu 10:29</a> immediately with "Reuel" (the King James Version "Raguel"), and make Hobab the brother-in-law of Moses. But while it is possible that chothen may be used in the wider sense of a wife\'s relative, it is nowhere translated "brother-in-law" except in <a onClick="return mV(\'Jdg\',1,16);">Jud 1:16</a>; <a onClick="return mV(\'Jdg\',4,11);">4:11</a> ("father-in-law," the King James Version, the Revised Version margin). If we insert, as Ewald suggests (HI, II, 25), "Jethro son of" before "Reuel" in <a onClick="return mV(\'Exd\',2,18);">Ex 2:18</a> (compare the Septuagint, verse 16, where the name "Jethro" is given), we would then identify Jethro with Hobab, the son of Reuel, in <a onClick="return mV(\'Num\',10,29);">Nu 10:29</a>, taking "Moses\' father-in-law" to refer back to Hobab. Against this identification, however, it is stated that Jethro went away into his own country without any effort on the part of Moses to detain him (<a onClick="return mV(\'Exd\',18,27);">Ex 18:27</a>), whereas Hobab, though at first he refused to remain with the Israelites, seems to have yielded to the pleadings of Moses to become their guide to Canaan (<a onClick="return mV(\'Num\',10,\'29-32\');">Nu 10:29-32</a>; <a onClick="return mV(\'Jdg\',1,16);">Jud 1:16</a>, where Kittel reads "Hobab the Kenite"; <a onClick="return mV(\'Jdg\',4,11);">Jud 4:11</a>). It may be noted that while the father-in-law of Moses is spoken of as a "Midianite" in Exodus, he is called A "kenite" in <a onClick="return mV(\'Jdg\',1,16);">Jud 1:16</a>; <a onClick="return mV(\'Jdg\',4,11);">4:11</a>. From this Ewald infers that the Midianites were at that time intimately blended with the Amalekites, to which tribe the Kenites belonged (HI, II, 44).<P>2. His Hearty Reception of Moses:<P>When Moses fled from Egypt he found refuge in Midian, where he received a hearty welcome into the household of Jethro on account of the courtesy and kindness he had shown to the priest\'s 7 daughters in helping them to water their flock. This friendship resulted in Jethro giving Moses his daughter, Zipporah, to wife (<a onClick="return mV(\'Exd\',2,\'15-21\');">Ex 2:15-21</a>). After Moses had been for about 40 years in the service of his father-in-law, the angel of the Lord appeared to him in the burning bush as he was keeping the flock at Horeb, commanding him to return to Egypt and deliver his enslaved brethren out of the hands of Pharaoh (<a onClick="return mV(\'Exd\',3,1);">Ex 3:1</a>). With Jethro\'s consent Moses left Midian to carry out the Divine commission (<a onClick="return mV(\'Exd\',4,18);">Ex 4:18</a>).<P>3. His Visit to Moses in the Wilderness:<P>When tidings reached Midian of "all that God had done for Moses, and for Israel" in delivering them from Egyptian bondage, Jethro, with a natural pride in the achievements of his relative, set out on a visit to Moses, taking Zipporah and her two sons with him (<a onClick="return mV(\'Exd\',18,\'1-12\');">Ex 18:1-12</a>). On learning of his father-in-law\'s arrival at the "mount of God," Moses went out to meet him, and after a cordial exchange of courtesies they retired to Moses\' tent, where a pleasant interview took place between them. We are told of the interest Jethro felt in all the particulars of the great deliverance, how he "rejoiced for all the goodness which Yahweh had done to Israel," and how the conviction was wrought within him that Yahweh was "greater than all gods; yea, in the thing wherein they dealt proudly against them" (<a onClick="return mV(\'Exd\',18,11);">Ex 18:11</a>). In this condition so expressed there is evidently a reference to the element by which the Egyptians thought in their high-handed pursuit they would be able to bring back Israel into bondage, but by which they were themselves overthrown.<P>It is worth noting that in the religious service in which Jethro and Moses afterward engaged, when Jethro, as priest, offered a burnt offering, and Aaron with all the elders of Israel partook of the sacrificial feast, prominence was given to Jethro over Aaron, and thus a priesthood was recognized beyond the limits of Israel.<P>4. His Wise Counsel:<P>This visit of Jethro to Moses had important consequences for the future government of Israel (<a onClick="return mV(\'Exd\',18,\'13-27\');">Ex 18:13-27</a>). The priest of Midian became concerned about his son-in-law when he saw him occupied from morning to night in deciding the disputes that had arisen among the people. The labor this entailed, Jethro said, was far too heavy a burden for one man to bear. Moses himself would soon be worn out, and the people, too, would become weary and dissatisfied, owing to the inability of one judge to overtake all the eases that were brought before him. Jethro, therefore, urged Moses to make use of the talents of others and adopt a plan of gradation of judges who would dispose of all eases of minor importance, leaving only the most difficult for him to settle by a direct appeal to the will of God. Moses, recognizing the wisdom of his father-in-law\'s advice, readily acted upon his suggestion and appointed "able men out of all Israel, and made them heads over the people, rulers of thousands, rulers of hundreds, rulers of fifties, and rulers of tens." Thereafter, Jethro returned to his own country.<P>5. His Character and Influence:<P>The story of Jethro reveals him as a man of singular attractiveness and strength, in whom a kind, considerate disposition, a deeply religious spirit, and a wise judgment all met in happy combination. And this ancient priest of Midian made Israel and all nations his debtors when he taught the distinction between the legislative and the judicial function, and the importance of securing that all law be the expression of the Divine will, and that its application be entrusted only to men of ability, piety, integrity and truth (<a onClick="return mV(\'Exd\',18,21);">Ex 18:21</a>).``32';
isbe[5035]='Jetur`je\'-tur (yetur, meaning uncertain): a "son" of Ishmael (<a onClick="return mV(\'Gen\',25,15);">Ge 25:15</a> parallel <a onClick="return mV(\'1Ch\',1,31);">1Ch 1:31</a>); against this clan the two and a half tribes warred (<a onClick="return mV(\'1Ch\',5,18);">1Ch 5:18</a>f); they are the Itureans of New Testament times.`<a href="./study/isbe/search.html?string=ITURAEA">ITURAEA</a>`1';
isbe[5036]='Jeuel`je-u\'-el ju\'-el (ye\'-u\'-el, meaning unknown):<P>(1) A man of Judah (<a onClick="return mV(\'1Ch\',9,6);">1Ch 9:6</a>); the name is not found in the parallel of <a onClick="return mV(\'Neh\',11,24);">Ne 11:24</a>. <p>(2) A Levite, the King James Version "Jeiel" (<a onClick="return mV(\'2Ch\',29,13);">2Ch 29:13</a>).<P>(3) A companion of Ezra, the King James Version "Jeiel" (<a onClick="return mV(\'Ezr\',8,13);">Ezr 8:13</a>).<P>(4) The name occurs also as Kethibh in <a onClick="return mV(\'1Ch\',9,35);">1Ch 9:35</a>; <a onClick="return mV(\'2Ch\',26,11);">2Ch 26:11</a>.`<a href="./study/isbe/search.html?string=JEIEL">JEIEL</a>`1';
