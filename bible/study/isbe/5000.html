>; <a onClick="return mV(\'Neh\',4,7);">4:7</a>; <a onClick="return mV(\'Neh\',6,1);">6:1</a>)? For Ezekiel also, from whom it is supposed Joel derived his reference to the Edomites, mentions also Moabites and Ammonites as hostile to Israel (<a onClick="return mV(\'Eze\',25,\'1-11\');">Eze 25:1-11</a>). And so far were Tyre and Sidon from being hostile in the days of Nehemiah that we read of similar arrangements being made with them, as in the time of Solomon, for the supply of materials for the rebuilding of the temple (<a onClick="return mV(\'Ezr\',3,7);">Ezr 3:7</a>). And why is not a word said of the Babylonians, at whose hands Israel had suffered so much? So strongly, indeed, are these objections felt by Reuss, that he declares that, should the view of the late origin come to be finally accepted as the more probable, he would decide for a date after the Persian domination, i.e. subsequent to 332 BC. For, he says, the names of peoples introduced at the end of the book, Phoenicians, Egyptians, Philistines, Edomites, must surely in some way have had an actual significance for the author, who cannot out of caprice have passed over Syrians, Assyrians, Chaldeans, and Persians. Accordingly, if we are to have nothing to do with the pre-Assyrian period, we must come down to the late Seleucidan and Ptolemean dynasties, by whose hostile collisions Judea was certainly involved in severe trouble. But then, how are we to account for the position of Joel so high up in the collection of prophetical writers? For, on this supposition, we should expect his book to stand in the third division of the Canon.<P>(6) Some Notable Expressions.<P>There remain to be noticed some significant expressions which have a bearing on the question of date and, at first sight, seem to indicate a late origin. And yet there is a difficulty. For there is no doubt that our familiarity with the details of the great downfall of the Jewish state leads us to think of the destruction of Jerusalem when we read of the captivity or scattering of the people. There is, however, a saying in the Talmud that a greater distress makes a lesser one forgotten; and the question is whether there may not have been national experiences at an earlier time to which such expressions might be applicable: or, in other words, how early such phrases were coined and became current.<P>(a) "Bring Back the Captivity":<P>There is, first of all, uncertainty as to the origin of the phrase "bring back the captivity." Some connect the word "captivity" (shebhuth, shebhith) with the verb "to take captive" (shabhah), while others make it the cognate noun of the verb "to return" (shubh), with which it stands connected in the phrase "bring back the captivity of Judah and Jerus" (<a onClick="return mV(\'Joe\',3,1);">Joe 3:1</a>). In the former case the reference would be to the return of captives taken in war, or the return of exiles from captivity; and that view has led to the translation in our version. On the latter view, the expression would mean the restoration of prosperity, of which use we have an undoubted example in the words: "Yahweh turned the captivity of Job" (<a onClick="return mV(\'Job\',42,10);">Job 42:10</a>). We can conceive either of the views to have been the original, and either to be quite early. A main feature of early warfare was the carrying away of prisoners, and the return of such captives was equivalent to a restoration of prosperity. Or again, the relief from any illness or trouble might be expressed by saying that there was a restoration, as e.g. in Scotland a sick person is said to have "got the turn." As to the significance of the phrase in Joel, it is pointed out by the advocates of the early date that, in Nehemiah\'s time, the exile was at an end, and the captivity "brought back" (<a onClick="return mV(\'Psa\',126,\'1-\');">Ps 126</a>). On the other side it is said that, though the new order was set up at Jerusalem, there still remained many Israelites in foreign lands, and Joel, not satisfied with the meager community in Palestine, looked forward to a fuller restoration; or otherwise, that the words are used in the wider and more general sense of restored prosperity. That the phrase was in early use, and in the sense of bringing back captives, is seen in <a onClick="return mV(\'Amo\',9,14);">Am 9:14</a> and <a onClick="return mV(\'Hsa\',6,11);">Ho 6:11</a>. And it may be observed that the phraseology used by Amos to denote going into captivity (<a onClick="return mV(\'Amo\',1,5,15);">Am 1:5,15</a>; <a onClick="return mV(\'Amo\',5,5,27);">5:5,27</a>; <a onClick="return mV(\'Amo\',7,17);">7:17</a>) is employed by the Jews to denote the Babylonian captivity, and is even used by modern Jews to express the present dispersion. And yet Amos speaks of an "entire captivity" of people in his day (<a onClick="return mV(\'Amo\',1,6,9);">Am 1:6,9</a> margin).<P>(b) "Parted My Land":<P>Then again, the expression "parted my land" (<a onClick="return mV(\'Joe\',3,2);">Joe 3:2</a>) does not seem very applicable to the breaking up of the state, for the land was not parted but absorbed in the great eastern empires; nor does Joel single out Assyrians, Babylonians, and Persians, by whom, if by any, a post-exilian parting of the land was effected. The expression would more fitly apply to such movements as the revolt of Edom and Libnah (<a onClick="return mV(\'2Ki\',8,22);">2Ki 8:22</a>), and the successive losses of territory by which the great dominion of David and Solomon was reduced. This process, described as "cutting Israel short" (literally, "cutting off the ends," <a onClick="return mV(\'2Ki\',10,32);">2Ki 10:32</a> the King James Version) is recorded as having begun in the time of Jehu, before the reign of Joash, when outlying parts of territory were smitten by Hazael of Damascus; and Joel, speaking in God\'s name, may have used the expression "my land" as referring to the whole country.<P>(c) "Scattered among the Nations":<P>Whether the expression "scattered among the nations" (<a onClick="return mV(\'Joe\',3,2);">Joe 3:2</a>) would be applicable to the Israelite inhabitants of such conquered territories or to those sold into slavery (<a onClick="return mV(\'Joe\',3,6);">Joe 3:6</a>) may be disputed. The expression certainly suggests rather the dispersion following the downfall of the state. And yet it is noteworthy that, if so, Joel is the only prophet who uses in that sense the verb here employed, a very strange thing if he followed and borrowed from them all; for, both in Jeremiah and Ezkekiel, as well as in Deuteronomy, other verbs are used. Jeremiah indeed uses the verb in comparing Israel to a scattered (or isolated) sheep which the lions have driven away (<a onClick="return mV(\'Jer\',50,17);">50:17</a>); but the only other passage in which the word is plainly used of Israel being dispersed among the peoples in all the provinces of Persia is <a onClick="return mV(\'Est\',3,8);">Es 3:8</a>.<P>(d) "Reproach of the Nations":<P>Then there is the passage: "Give not thy heritage to reproach, that the nations should rule over them" (or "use a byword against them"): "wherefore should they say among the peoples, Where is their God?" (<a onClick="return mV(\'Joe\',2,17,19);">Joe 2:17,19</a>; compare margin). Here it is to be noted that the idea involved is certainly much older than the time of the exile. In the time of Hezekiah, the ambassadors of Sennacherib delivered their taunting message, which is described as reproaching the living God (<a onClick="return mV(\'2Ki\',19,4);">2Ki 19:4</a>). It was the method of ancient warfare, as is seen in the boasting of Goliath; for it is the same word that is used in that narrative, though rendered in our version "defy" (<a onClick="return mV(\'1Sa\',17,10,25,36);">1Sa 17:10, 25f; 36</a>). And, if we read between the lines of the historical books, we shall see how common was this habit of "defying" or "reproaching," and how sensitive the people were to it (e.g. <a onClick="return mV(\'1Ki\',20,2,5,13,18);">1Ki 20:2f; 5f; 13,18</a>). All this is anterior to the earliest possible date of Joel, and proves that, at an early time, there was a consciousness in Israel that the fortunes of the people were bound up with the honor of the national God. It is not to be overlooked that it is in the early part of the book, when he is concerned with the drought and locust, that Joel uses this expression.<P>(e) "Strangers Passing Through":<P>Toward the close of the book it is predicted that, in the time of final glory, strangers shall no longer pass through Jerusalem (<a onClick="return mV(\'Joe\',3,17);">Joe 3:17</a>). This again would certainly be applicable to a late time, after the land had suffered many hostile invasions. Yet it can well be understood how a prophet at a very early period, thinking of the glorification of Zion, should imagine a state in which no "stranger" or foreigner should have a footing on the sacred soil, and Israel should dwell in solitary and preeminent exclusiveness. If so, the idea again is of a more primitive kind than the late date would suggest, especially if we postulate a prophet who had deeply studied earlier prophets, to whom Jerusalem of the future was the religious metropolis of the world, and Zion the place to which all nations would flow (<a onClick="return mV(\'Isa\',2,3);">Isa 2:3</a>; <a onClick="return mV(\'Isa\',56,7);">56:7</a>).<P>(f) "Day of Yahweh":<P>A word must be said, in conclusion, in regard to the "day of Yahweh" which figures so prominently in the Book of Joel. In whatever sense it may originally have been employed, whether betokening weal or woe, the expression was an ancient one; for Amos refers to it as current in his day (5:18); and almost all the prophets refer to it in one way or another (<a onClick="return mV(\'Amo\',5,\'18-20\');">Am 5:18-20</a>; <a onClick="return mV(\'Isa\',2,12);">Isa 2:12</a>; <a onClick="return mV(\'Isa\',13,6,9);">13:6,9</a>; <a onClick="return mV(\'Isa\',34,8);">34:8</a>; <a onClick="return mV(\'Jer\',46,10);">Jer 46:10</a>; <a onClick="return mV(\'Lam\',2,22);">La 2:22</a>; <a onClick="return mV(\'Eze\',30,3);">Eze 30:3</a>; <a onClick="return mV(\'Oba\',1,15);">Ob 1:15</a>; <a onClick="return mV(\'Zep\',1,8,18);">Ze 1:8,18</a>; <a onClick="return mV(\'Zep\',2,2,3);">2:2,3</a>; <a onClick="return mV(\'Zec\',14,1);">Zec 14:1</a>; <a onClick="return mV(\'Mal\',4,5);">Mal 4:5</a>). So far as it bears upon the date of Joel the question is: How does his usage compare with those of the other prophets? We find that he uses the expression twice in connection with the visitation of the locust (<a onClick="return mV(\'Joe\',1,15);">1:15</a>; <a onClick="return mV(\'Joe\',2,1);">2:1</a>), once after speaking of the outpouring of the Spirit (<a onClick="return mV(\'Joe\',2,31);">2:31</a>), and once again near the close of the book (<a onClick="return mV(\'Joe\',3,14);">3:14</a>). Now, in regard to the earliest occurrences, it will be perceived that Joel is on a lower plane than succeeding prophets. He associates the approach of the day of the Lord with a heavy visitation upon material nature, precisely as the simple Oriental of the present day, on the occurrence of an eclipse, or at a visitation of locust or pestilence, begins to talk of the end of the world. And, though the point of view is shifted, and the horizon wider, at the close, it is to be remarked that the highest point attained is the conception of the day of the Lord as the deliverance and glorification of Israel: there is not a hint of that day being a time of testing and sifting of Israel itself, as in Amos and elsewhere (<a onClick="return mV(\'Amo\',5,\'18-20\');">Am 5:18-20</a>; <a onClick="return mV(\'Isa\',2,12);">Isa 2:12</a>). In fact, so far is he from going beyond the other prophets in his conception, that we may say Joel leaves the matter at the point where Amos takes it up.<P>5. View of Professor Merx:<P>In view of all these perplexing questions, Professor Ad. Merx had some reason for describing the Book of Joel as the "sorrow\'s child" (Schmerzenskind) of Old Testament exegesis; and he published in 1879 a work, Die Prophetic des Joel und ihre Ausleger von den aeltesten Zeiten bis zu den Reformatoren, in which, besides giving a history of the interpretation, he combated the method hitherto employed, and put forth a novel view of his own. Concluding, on the grounds usually maintained by the advocates of the late date, that Joel is post-exilian, he makes a comparison of the book with preceding prophetical literature, in order to show that Joel derived his ideas from a study of it, and especially that he followed step by step the prophecies of Ezekiel. Now in Ezekiel\'s outlook, the overflowing of Judea by the northern people, Gog, plays an important part (<a onClick="return mV(\'Eze\',38,2,3,16,18);">Eze 38:2,3,16,18</a>; <a onClick="return mV(\'Eze\',39,11);">39:11</a>), and this explains Joel\'s reference in <a onClick="return mV(\'Joe\',2,20);">2:20</a>.<P>As to the precise date: not only is the second temple standing but the city is surrounded by a wall (<a onClick="return mV(\'Joe\',2,9);">Joe 2:9</a>); and this brings us down to the government of Nehemiah, after 445 BC; and the book of Nehemiah shows that other prophets besides Malachi lived and found acceptance in those days (<a onClick="return mV(\'Neh\',6,7,14);">Ne 6:7,14</a>). The circumstances were these. Not only the exile, but the restoration, is a thing of the past. We are to think of Jerusalem and Judah in the narrowest sense: the elders and all the inhabitants of the land are addressed, a sort of senatus populusque Romanus, and with them are the priests presiding over an orderly ritual service at the temple. Judah is unaffected by political movements; the conflict with the Samaritans has died down; Judah is leading a quiet life, of which nothing is recorded because there is nothing to record; and the people of the ten tribes have practically disappeared, being swallowed up among the heathen: This undisturbed period is employed in literary labor, as may be inferred from the well-known notice regarding Nehemiah\'s collection of books (2Macc 2:13f), and from the production of such works as Esther, Jonah, Qoheleth, Malachi, Chronicles, Ezra-Nehemiah, etc. The making of books (<a onClick="return mV(\'Ecc\',12,12);">Ec 12:12</a>) had not come to an end.<P>But now, if the older prophets were seriously studied (compare <a onClick="return mV(\'Dan\',9,2);">Da 9:2</a>), what impression would they make on the mind of a man like Joel? Was the daily life that followed the time of Nehemiah in any degree a fulfillment of the hopes of a Deutero-Isaiah, a Jeremiah, an Ezekiel, a Zechariah? Could a member of the restored community contemplate without painful feelings the lamentable condition of existence under the Persian government, the limitation of the people to a narrow territory, the separation from those still in the Dispersion, the irritation of the worship of the half-heathen Samaritans, the mixed marriages and general low condition, as contrasted with the glowing pictures of the prophets who had spoken of the last days? Such a contradiction between prophecy and event must have disturbed the minds of the more thoughtful; and so, while some said, "It is vain to serve God" (<a onClick="return mV(\'Mal\',3,14);">Mal 3:14</a>), "They that feared Yahweh spake one with another" (<a onClick="return mV(\'Mal\',3,16);">Mal 3:16</a>), waiting in hope, believing that the present restoration could not be the true and final bringing back of the captivity.<P>To relieve his mind, Joel will write a book, the result of his study; and it must depict the full and final consummation. Living as he did, however, in quiet times, he had not, like earlier prophets, a historical situation to start from. Here, according to Merx, the genius of Joel comes into play. Seeking for a type of the end of the world, which was to be the antitype, he found one in the deliverance of Israel from Egypt in the distant past. Just as at that great crisis the people were rescued from bondage and brought into a wide and fertile land, so in the end Yahweh would subdue all Israel\'s enemies and place them in a noble land, uncontaminated by strangers, while He Himself would be enthroned in majesty on Zion. But just as that deliverance was ushered in by plagues, so also will be the "great day of Yahweh"; and as a signal type of the wholesale destruction of Israel\'s enemies, he seizes upon the plague of locusts and models his introduction upon <a onClick="return mV(\'Exd\',10,4);">Ex 10:4</a>ff. Joel had, no doubt, seen many a visitation of locusts; but what we have before us in <a onClick="return mV(\'Joe\',1,\'1-\');">Joe 1</a> and <a onClick="return mV(\'Joe\',2,\'1-\');">2</a> is not actual description but idealized picture, the groundwork of his eschatology.<P>Accordingly, in the view of Merx, the whole Book of Joel is one piece. There is no historical transition at <a onClick="return mV(\'Joe\',2,10);">2:10</a>; in fact, there is no historical element in it at all. The end of the book being apocalyptical, the beginning, which forms with it a unity, must also relate to no event in Joel\'s days, but moves likewise in the period at the close of time. The people addressed are not the men of Joel\'s day, but those who shall be alive when "that day" is imminent: in a word, the reader is at <a onClick="return mV(\'Joe\',1,2);">1:2</a> lifted into the air and placed at the beginning of the final judgment, at the moment when the apocalyptic locusts appear as heralds of the day.<P>Merx\'s view may be taken as an extreme and somewhat fanciful statement of the case for a late post-exilian date; and it does not seem to have found acceptance by the critics who start from a historical basis. Merx himself is fully aware that it is a revival of the allegorical and typical interpretation which had its vogue in earlier stages of exposition. But he defends himself on the ground that it was not the ancients who imposed the allegorical interpretation upon Scripture, but the original writers who were the first typologists and allegorists, as is notably seen in later books like Ezekiel and Daniel. Whatever opinion may be held on that subject, we must at least recognize the strongly marked eschatology of the book. But this does not of necessity imply a late date. It is no doubt true that the fully developed eschatology, as we see it in the apocalyptic literature of the extra-canonical books, came in after the cessation of prophecy proper. Yet prophecy, in its earliest phases, contemplated the distant future, and had its support in such an outlook. Professor A.B. Davidson has said: "Isaiah is the creator of the eschatology of the Old Testament and of Christianity, and it comes from his hand in a form so perfect that his successors can hardly add a single touch to it" (Expository Times, V, 297). The ancient oracle, found both in Isaiah and Micah (<a onClick="return mV(\'Isa\',2,\'2-4\');">Isa 2:2-4</a>; <a onClick="return mV(\'Mic\',4,\'1-5\');">Mic 4:1-5</a>), testifies to the triumphant and far-reaching hope of the older seers; and, before Isaiah\'s time, both Amos (<a onClick="return mV(\'Amo\',9,\'11-15\');">9:11-15</a>) and Hosea (<a onClick="return mV(\'Hsa\',14,\'4-8\');">14:4-8</a>) have their outlook to the final future. The remarkable thing about Joel, which makes the determination of his date so difficult, is that he seems now to go beyond and now to fall short of other prophets. If he is later than Ezekiel and Jeremiah, he has nothing to say of the inclusion of Gentiles in the inheritance of Israel, but contemplates the final destruction of all Israel\'s enemies. If he is a contemporary of Malachi or later, he is less legalistic than that prophet; and whereas in Malachi we see the beginning of the fading away of prophecy, Joel looks for the time when the Spirit shall be poured out on all flesh, and the sons and daughters shall prophesy (<a onClick="return mV(\'Joe\',2,28);">2:28</a>).<P>6. Connection with the New Testament:<P>It is this last element in the prophecy of Joel that links his book particularly with the New Testament, for Peter quoted Joel\'s words in this passage as fulfilled on the day of Pentecost, when the Spirit was poured forth on the assembled multitude (<a onClick="return mV(\'Act\',2,16);">Ac 2:16</a>). Yet, even as the Old Testament prophets one after another caught up the idea, unfolding and expanding it, so the New Testament writers see the approach of the day of the Lord in their own time (<a onClick="return mV(\'1Th\',5,2);">1Th 5:2</a>; <a onClick="return mV(\'2Pe\',3,10);">2Pe 3:10</a>); for that day is always coming, always near, though still in the future. Paul saw the whole creation groaning and travailing in pain, as Joel did, and the pouring out of the Spirit at Pentecost was part of, and also more than, the effusion seen by Joel. What Joel said he said truly, though he could not say all. For "that day" has grown in significance as the ages have rolled on; men have seen its approach in the various commotions and upheavals of the world, depicting its features in the colors of the changing times, now praying for it, now dreading its approach; and how far from precision are our thoughts in regard to it still! Yet, early or late, unerring is the sure word of prophecy in its essential burden. The concrete historical situations crumble away and leave the eternal truth as fresh as ever: "Yahweh reigneth; let the earth rejoice" (<a onClick="return mV(\'Psa\',97,1);">Ps 97:1</a>); it is the hopeful burden of Old Testament prophecy, for "righteousness and justice are the foundation of thy throne" (<a onClick="return mV(\'Psa\',89,14);">Ps 89:14</a>).<P>LITERATURE<P>(Besides that cited above).—Credner, Der Proph. Joel ubersetzt u. erklart (1831); Wuensche, Die Weissagungen des Proph. Joel ubersetzt u. erklart (1872); the commentary on the Minor Prophets by Pusey, Orelli, Keil, Wellhausen, G.A. Smith; Meyrick in Speaker\'s Commentary; Nowack, in Handkommentar zum Altes Testament; Marti, in Kurzer Hand-Commentar zum Altes Testament.``151';
isbe[5088]='Joelah`jo-e\'-la (yo\'e\'lah, perhaps = yo\'elah, "may he avail!"): One of David\'s recruits at Ziklag (<a onClick="return mV(\'1Ch\',12,7);">1Ch 12:7 (Hebrew 8)</a>); a Benjamite or perhaps a Judean (see Curtis, Chronicles, 195f).``1';
isbe[5089]='Joezer`jo-e\'-zer (yo\'ezer, "Yahweh is help"): One of David\'s Benjamite recruits at Ziklag, though perhaps a Judean (<a onClick="return mV(\'1Ch\',12,6);">1Ch 12:6 (Hebrew 7)</a>).``1';
isbe[5090]='Jogbehah`jog\'-be-ha (yoghbechah): A city in Gilead assigned to Gad and fortified by that tribe (<a onClick="return mV(\'Num\',32,35);">Nu 32:35</a>). It lay on the line along which Gideon chased the Midianites (<a onClick="return mV(\'Jdg\',8,11);">Jud 8:11</a>), and the indication there leaves no doubt that it is represented today by Ajbeihat. The name attaches to 3 groups of ruins which date from Roman times. The position is about 7 miles northwest of \'Amman, and about midway between that city and the town of es-SalT. It stands 3,468 ft. above the level of the Mediterranean.<P>LITERATURE.<P>Oliphant, Land of Gilead, 232; Baedeker-Socin, Palestine.``1';
isbe[5091]='Jogli`jog\'-li (yoghli, perhaps = "led into exile"): Father of Bukki, a Danite chief (<a onClick="return mV(\'Num\',34,22);">Nu 34:22</a>).``1';
isbe[5092]='Joha`jo\'-ha (yocha, meaning unknown, but perhaps = yo\'ach "Joah"; see HPN, 283, note 4):<P>(1) A Benjamite (<a onClick="return mV(\'1Ch\',8,16);">1Ch 8:16</a>).<P>(2) One of David\'s mighty men (<a onClick="return mV(\'1Ch\',11,45);">1Ch 11:45</a>).``1';
isbe[5093]='Johanan`jo-ha\'-nan (yochanan, "Yahweh has been gracious"; Ioanan; compare <a href="./study/isbe/search.html?string=JEHOHANAN">JEHOHANAN</a>):<P>(1) Son of Kareah, and one of "the captains of the forces who were in the fields" (i.e. probably guerrilla bands), who allied with Gedaliah, governor of Judah, after the fall of Jerusalem, 586 BC (<a onClick="return mV(\'2Ki\',25,23);">2Ki 25:23</a>; <a onClick="return mV(\'Jer\',40,7);">Jer 40:7-43:7</a>). He warned Gedaliah of the plot of Ishmael ben Nethaniah, who was instigated by the Ammonite king Baalis, to murder the governor; but the latter refused to believe him nor would he grant Johanan permission to slay Ishmael (<a onClick="return mV(\'Jer\',40,\'8-16\');">Jer 40:8-16</a>). After Ishmael had murdered Gedaliah and also 70 northern pilgrims, Johanan went in pursuit. He was joined by the unwilling followers of Ishmael, but the murderer escaped. Thereupon Johanan settled at Geruth-Chimham near Bethlehem (<a onClick="return mV(\'Jer\',41,\'1-\');">Jer 41</a>). As Ishmael\'s plan was to take the remnant to the land of Ammon, so that of Johanan and his fellow-chiefs was to go to Egypt. They consulted the Divine oracle through Jeremiah, and received the answer that they should remain in Judah (<a onClick="return mV(\'Jer\',42,\'1-\');">Jer 42</a>). But the prophet was accused of giving false counsel and of being influenced by Baruch. The chiefs then resolved to go to Egypt, and forced Jeremiah and Baruch to accompany them (<a onClick="return mV(\'Jer\',43,\'1-\');">Jer 43</a>).<P>(2) The eldest son of King Josiah (<a onClick="return mV(\'1Ch\',3,15);">1Ch 3:15</a>), apparently = "Jehoahaz" (<a onClick="return mV(\'2Ki\',23,\'30-33\');">2Ki 23:30-33</a>).<P>(3) Son of Elioenai, and a Davidic post-exilic prince (<a onClick="return mV(\'1Ch\',3,24);">1Ch 3:24</a>).<P>(4) Father of the Azariah who was priest in Solomon\'s time (<a onClick="return mV(\'1Ch\',6,9,10);">1Ch 6:9,10; (Hebrew 5:35,36)</a>).<P>(5) A Benjamite recruit of David at Ziklag, but perhaps a Judean (<a onClick="return mV(\'1Ch\',12,4);">1Ch 12:4 (Hebrew 5)</a>).<P>(6) A Gadite recruit of David at Ziklag (<a onClick="return mV(\'1Ch\',12,12);">1Ch 12:12 (Hebrew 13)</a>).<P>(7) Hebrew has "Jehohanan," an Ephraimite chief (<a onClick="return mV(\'2Ch\',28,12);">2Ch 28:12</a>).<P>(8) A returned exile (<a onClick="return mV(\'Ezr\',8,12);">Ezr 8:12</a>) = "Joannes" (1Esdras 8:38, the King James Version "Johannes").<P>(9) <a onClick="return mV(\'Neh\',12,22,23);">Ne 12:22,23</a> = <a href="./study/isbe/search.html?string=JEHOHANAN">JEHOHANAN, (3)</a>.``149';
isbe[5094]='Johannes`jo-han\'-es, jo-han\'-ez.`<a href="./study/isbe/search.html?string=JOANNES">JOANNES</a>`1';
isbe[5095]='Johannine Theology, 1`jo-han\'-in, -in:<P><b>I. THE ANTECEDENTS</b><P class="in15">1. Personality of Writer<P class="in15">2. Earlier New Testament Writings<P class="in15">3. Christian Experience and Teaching of History<P class="in15">4. Widening Contact with Gentile World<P class="in15">5. The Odes of Solomon<P class="in15">6. Antagonism to Gnostic Speculation<P><b>II. THE DIVINE NATURE</b><P class="in15">1. God Is Spirit<P class="in15">2. God Is Life<P class="in15">3. God Is Light<P class="in15">4. Ethical Attributes<P class="in30">God Is Righteous<P class="in15">5. God Is Love<P class="in30">(1) The Love of God<P class="in45">(a) Primarily a Disposition<P class="in45">(b) Embodied in Christ\'s Self-Sacrifice<P class="in45">(c) Love in Redemption<P class="in30">(2) Love Is God\'s Nature<P><b>III. THE INCARNATION</b><P class="in15">1. Historical Antecedents of the Logos-Doctrine<P class="in15">2. The Logos-Doctrine in John<P class="in15">3. The Incarnation as Delineated in the Fourth Gospel<P class="in15">4. The Incarnation in the First Epistle<P class="in15">5. Practical Implications of the Incarnation<P><b>IV. THE HOLY SPIRIT</b><P class="in15">1. The Work of the Spirit—in the Fourth Gospel<P class="in30">Perpetuates, but also Intensifies the Consciousness of Christ<P class="in15">2. In the First Epistle<P class="in30">(1) A Divine Teacher<P class="in30">(2) Other Aspects<P class="in15">3. The Person of the Spirit<P class="in30">His Deity Implied<P><b>V. DOCTRINE OF SIN AND PROPITIATION</b><P class="in15">1. Sin<P class="in15">2. Propitiation<P class="in30">(1) In the Gospel<P class="in30">(2) In the Epistle<P class="in30">(3) One with New Testament Teaching<P><b>VI. ETERNAL LIFE</b><P class="in15">1. Ethical Rather than Eschatological<P class="in15">2. Metaphysical Aspect<P class="in30">Reply to Criticism<P class="in15">3. Development of Doctrine<P class="in30">(1) Source in God<P class="in30">(2) Mediated by Christ<P class="in30">(3) Through the Spirit<P class="in30">(4) The Divine "Begetting"<P class="in30">(5) The "Children of God"<P class="in30">(6) The Divine Abiding<P><b>VII. HUMAN NATURE AND ITS REGENERATION</b><P class="in15">1. The World<P class="in15">2. Two Classes in the Human Race<P><b>VIII. THE CHURCH AND SACRAMENTS</b><P class="in15">1. The Church<P class="in15">2. The Sacraments<P class="in30">(1) Baptism<P class="in30">(2) The Lord\'s Supper<P>IX. ESCHATOLOGY<P class="in15">1. Type of Thought Idealistic<P class="in15">2. Yet History Not Ignored<P class="in15">3. Nor Eschatology<P class="in15">4. Eschatological Ideas<P class="in30">(1) Eternal Life<P class="in30">(2) Antichrist<P class="in30">(3) Resurrection<P class="in30">(4) Judgment<P class="in30">(5) The Parousia<P class="in45">(a) A "Manifestation"<P class="in45">(b) Relation to Believers<P><b>LITERATURE</b><hr ><P>The materials for the following sketch of the Johannine theology are necessarily drawn from the Fourth Gospel and the Epistles, chiefly the First Epistle, of John. The question of authorship is not here considered (see articles on the <a href="./study/isbe/search.html?string=GOSPEL">GOSPEL</a> and on the <a href="./study/isbe/search.html?string=JOHN,+THE+EPISTLES+OF">JOHN, THE EPISTLES OF</a>). These writings, whether by the same or by different authors, are equally saturated with that spiritual and theological atmosphere, equally characterized by that type of thought which we call Johannine, and which presents an interpretation of Christianity scarcely less distinctive and original than Paulinism. Where there are differences in the point of view, these will be indicated.<P>I. The Antecedents.<P>1. Personality of Writer:<P>To attempt a full account of the historical sources and antecedents of the Johannine theology is beyond the scope of the present article; but they may be briefly indicated. Much must be attributed to the personality of the great anonymous writer to whom we directly owe this latest development of New Testament thought. Only a thinker of first rank among the idealists and mystics, a mind of the Platonic order, moving instinctively in the world of supersensuous realities, absorbed in the passion for the infinite, possessing in a superlative degree the gift of spiritual intuition, could under any conditions have evolved a system of thought having the special characteristics of this theology.<P>2. Earlier New Testament Writings:<P>Yet with all his originality the builder has raised his structure upon the foundation already laid in the teaching represented by the earlier New Testament writings. The synoptic tradition, though freshly interpreted, is presupposed. At certain points there is a strong affinity with the Epistle to the Hebrews. In the main, however, the Johannine doctrine may be said to be a natural and inevitable development of Paulinism—the conclusion to which the earlier writer\'s mind is visibly moving in e.g. the Epistle to the Colossians.<P>3. Christian Experience and Teaching of History:<P>Among the influences which have stimulated and guided this development, the first place belongs to the natural growth of Christian experience and the teaching of history. In the closing decades of the 1st century, Christianity was compelled by the force of events to liberate itself more completely from the husk of Jewish Messianism in which its Divine seed had first been deposited. The faith of the first Christian generation in the Messiahship of Jesus and the triumph of His cause had expressed itself (necessarily so, under the historical conditions) in vivid expectation of His Second Coming. He was only waiting behind the clouds, and would speedily return to the earth for the restitution of all things (<a onClick="return mV(\'Act\',3,21);">Ac 3:21</a>). But after the fall of Jerusalem this primitive apocalypticism became, with the passing years, more and more discredited; and the Christian faith had either to interpret itself afresh, both to its own consciousness and to the world, or confess itself "such stuff as dreams are made of." It would be difficult to overestimate the service which the Johannine theology must have rendered in this hazardous transition by transferring the emphasis of Christian faith from the apocalyptic to \'the spiritual, and leading the church to a profounder realization of its essential and inalienable resources in the new spiritual life it possessed through the ever-living Christ. Eternal life was not merely a future felicity, but a present possession; the most real coming of Christ, His coming in the Spirit. The Kingdom of God is here: the eternal is now. Such was the great message of John to his age, and to all ages.<P>4. Widening Contact with Gentile World:<P>In another direction, the widening contact of Christianity with the Gentile world had stimulated the development of doctrine. A disentanglement from Jewish nationalism, more complete than even Paul had accomplished, had become a necessity. If Christianity was to find a home and a sphere of conquest in the Greek-Roman world—to recreate European thought and civilization—the person of Christ must be interpreted as having a vastly larger significance than that of the Jewish Messiah. That this necessity hastened the process of thought which reached its goal in the Loges-doctrine of John cannot well be doubted. The way had so far been prepared by Philo and the Jewish-Alexandrian school. And while it is probably mere coincidence that Ephesus, with which the activity of John\'s later years is associated by universal tradition, was also the city of Heraclitus, who, 500 years earlier, had used the term Logos to express the idea of an eternal and universal Reason, immanent in the world, there is as little room as there can be motive for questioning that in the Johannine theology Christian thought has been influenced and fertilized at certain points by contact with Hellenism.<P>5. The Odes of Solomon:<P>On the other hand it is possible that this influence has been overrated. Fresh material for the investigation of the sources and connections of the Johannine theology is furnished by the recent discovery of the Odes of Solomon (J. Rendel Harris, M.A., Odes and Psalms of Solomon, Cambridge, 1909; AdoIf Harnack, Ein judisch-christliches Psalmbuch aus dem ersten Jahrhundert, Leipzig, 1910). This collection of religious poems is regarded by its discoverer, Rendel Harris, as the work of a writer who, while not a Jew, was a member of a community of Christians who were for the most part of Jewish extraction and beliefs. But though the Odes in their present form contain distinctly Christian elements (references, e.g. to the Son, the Incarnation, the Virgin Birth, the Passion, the Descensus ad inferos), Harnack\'s closer analysis tends to the conclusion that in their original form they were purely Jewish, and that they have been adapted to Christian use by a process of interpolation. For the original work Harnack gives as a possible date the beginning of the Christian era, the Christian redaction falling within the 1st century. Harnack recognizes a possibility that the redactor may have been acquainted with the Fourth Gospel. The religious feeling of the writer is throughout individual and mystical, rather than nationalistic and Messianic. The characteristic atmosphere is strongly Johannine (we may quote in, illustration only the noble sentence from the 12th ode: "The dwelling-place of the Word is man; and its truth is Love"). The Odes have, in common with the Johannine writings, such leading conceptions as "grace," "believing," "knowledge," "truth," "light," "living water," "life" (for a full exhibition of the parallelisms, see article by R.H. Strachan, The Expository Times, October, 1910). Harnack asserts deliberately (p. 99) that in the Odes we possess "the presuppositions of the Johannine theology, apart from the historical Jesus Christ, and without any Messianic doctrine." More recent criticism of the Odes, however, has resulted in great diversity of view regarding their origin. They have been assigned to Gnosticism, and on the contrary to Montanism; and again are described (Bernard) as Christian baptismal hymns. In view of this division of critical opinion, all that can be said in the meantime is that the Odes testify to a collateral mystical development, the recognition of which necessitates a revision of the estimates which have been made regarding the extent to which the Johannine theology is indebted to Hellenistic philosophy.<P>6. Antagonism to Gnostic Speculation:<P>One other factor in this theological development remains to be mentioned—antagonism to Gnostic speculation. In the Gospel this has left not a few traces, in the way both of statement and omission; in the 1st Epistle scarcely any other danger to the faith and life of the church is apprehended than the spreading influence of Gnostic tenets (see <a href="./study/isbe/search.html?string=JOHN,+THE+EPISTLES+OF">JOHN, THE EPISTLES OF</a>). John himself has been charged with Gnostic tendencies; but the truth rather is that to him Gnosticism must have been the more hateful and have seemed the more dangerous because its conceptions were at some points the caricature of his own. In it he saw the real Antichrist, the "spirit of error," giving fatally misleading solutions of those problems which the human mind can never leave alone, but regarding which the one true light is the historic Christ. Gnosticism had lost all historical sense, all touch with reality. It moved in a world of sheer mythology and speculation; history became allegory; the incarnate Christ a phantasm. John took his stand only the more firmly upon historical fact, insisted the more strenuously upon the verified physical reality of the Incarnation. In many of its adherents Gnosticism had lost almost completely the moral sense; John the more vehemently asserts the inviolable moral purity of the Divine nature and of the regenerate life which is derived from it. Gnostic dualism had set God infinitely far from men as transcendent Being; John brings God infinitely near to men as Love; and sweeps away the whole complicated mythology of Gnostic emanations, eons and archons, by his doctrine of the Logos, coeternal and coequal with the Father, incarnate in Jesus, through whom humanity is made to participate in the very life of God—the life of all love, purity and truth.<P>II. The Divine Nature.<P>1. God Is Spirit:<P>One of the glories of the Johannine theology is its doctrine of God, its delineation of the Divine nature. This is given in a series of intuitional affirmations which, though the manner of statement indicates no attempt at correlation, unite to form a complete organic conception. The first of these affirmations defines what is the Divine order of being: God is Spirit (<a onClick="return mV(\'Jhn\',4,24);">Joh 4:24</a>). The central significance of this inexhaustible saying is defined by the context. The old local worships, whether at Jerusalem or Samaria, had implied some special local mode of Divine presence; and this naturally suggested, if it did not necessitate, the idea of some kind of materiality in the Divine nature. But God is spirit; and true worship must be an intercourse of spirit with spirit, having relation to no local or material, but only to moral conditions. Thus the concept of the Divine spirituality is both moral and metaphysical. The religious relation to God, as it exists for Christian faith, rests upon the fact that the Supreme Being is essentially moral, but also omnipresent and omniscient—the Divine Spirit whose will and percipiency act immediately and simultaneously at every point of existence. Such a Being we utterly lack the power to comprehend. But only such a Being can be God, can satisfy our religious need—a Being of whom we are assured that nothing that is in us, good or evil, true or false, and nothing that concerns us, past, present or future, is hid from His immediate vision or barred against the all-pervading operation of His will. To realize that God is such a Being is to be assured that He can be worshipped with no mechanical ritual or formal observance: they that worship Him must worship Him "in spirit and in truth."<P>2. God Is Life:<P>God, who is spirit, is further conceived as Life, Light, Righteousness and Love. Righteousness and Love are the primary ethical quailties of the Divine nature; Life the energy by which they act; Light the self-revelation in which they are manifested throughout the spiritual universe. God is Life. He is the ultimate eternal Reality. He was "in the beginning" (<a onClick="return mV(\'Jhn\',1,1);">Joh 1:1</a>), or "from the beginning" (<a onClick="return mV(\'1Jo\',1,1);">1Joh 1:1</a>; <a onClick="return mV(\'1Jo\',2,13);">2:13</a>). These statements are made of the Logos, therefore a fortiori of God. But the Divine nature is not mere abstract being, infinite and eternal; it is being filled with that inscrutable elemental energy which we call Life. In God this energy of life is self-originating and self-sustaining ("The Father hath life in himself," <a onClick="return mV(\'Jhn\',5,26);">Joh 5:26</a>), and is the source of all life (<a onClick="return mV(\'Jhn\',1,3,4);">Joh 1:3,4</a>, the Revised Version (British and American) margin). For every finite being life is union with God according to its capacity.<P>But the lower potencies of the creative Life do not come within the scope of the Johannine theology. The term is restricted in usage to its highest ethical significance, as denoting that life of perfect, holy love which is "the eternal life," the possession of which in fellowship with God is the chief end for which every spiritual nature exists. The elements present in the conception of the Divine life are these:<P>(1) The ethical: the life God lives is one of absolute righteousness (<a onClick="return mV(\'1Jo\',2,29);">1Joh 2:29</a>), and perfect love (<a onClick="return mV(\'1Jo\',4,9);">1Joh 4:9</a>).<P>(2) The metaphysical: the Divine life is nothing else than the Divine nature itself regarded dynamically, as the ground and source of all its own activities, the animating principle or energy which makes Divine righteousness and love to be not mere abstractions but active realities.<P>(3) In Johannine thought the Divine life is especially an energy of self-reproduction. It is this by inherent moral necessity. Love cannot but seek to beget love, and righteousness to beget righteousness, in all beings capable of them. With John this generative activity of the Divine nature holds a place of unique prominence. It is this that constitutes the Fatherhood of God. Eternally the Father imparts Himself to the Son (<a onClick="return mV(\'Jhn\',5,26);">Joh 5:26</a>), the Word whose life from the beginning consisted in His relation to the Father (<a onClick="return mV(\'1Jo\',1,2);">1Joh 1:2</a>). To men eternal life is communicated as the result of a Divine begetting (<a onClick="return mV(\'Jhn\',1,13);">Joh 1:13</a>; <a onClick="return mV(\'Jhn\',3,5);">3:5</a>; <a onClick="return mV(\'1Jo\',2,29);">1Joh 2:29</a>; <a onClick="return mV(\'1Jo\',3,9);">3:9</a>; <a onClick="return mV(\'1Jo\',4,7);">4:7</a>, etc.) by which they become "children of God" (<a onClick="return mV(\'Jhn\',1,12);">Joh 1:12</a>; <a onClick="return mV(\'1Jo\',3,1);">1Joh 3:1</a>, etc.).<P>(4) But God is not only the transcendent final source, He is also the immanent source of life. This is clearly implied in all those passages, too numerous to be quoted, which speak of God\'s abiding in us and our abiding in Him. Life is maintained only through a continuous vitalizing union with Him, as of the branches with the vine (<a onClick="return mV(\'Jhn\',5,\'1-6\');">Joh 5:1-6</a>). It must be observed, however, that John nowhere merges the idea of God in that of life. God is personal; life is impersonal. The eternal life is the element common to the personality of God, of the Loges, and of those who are the "children of God." Any pantheistic manner of thinking is as foreign to John as to every other Biblical writer.<P>3. God Is Light:<P>God is not life only; He is light also (<a onClick="return mV(\'1Jo\',1,5);">1Joh 1:5</a>). That God is life means that He is and is self-imparting; that He is light means that the Divine nature is by inward necessity self-revealing.<P>(1) As the essential property of light is to shine, so God by His very nature of righteousness and love is necessitated to reveal Himself as being what He is, so as to become the Truth (he aletheia), the object of spiritual perception (ginoskein), and the source of spiritual illumination to every being capable of receiving the revelation. "God is light, and in him is no darkness at all." In God there is nothing that hides, nothing that is hidden. The Divine character is utterly transparent—goodness without a shadow of evil.<P>(2) This self-revelation of God is given in its perfect form in Jesus, the incarnate Word, who is the light of men (<a onClick="return mV(\'Jhn\',1,4);">Joh 1:4</a>), the light of the world (<a onClick="return mV(\'Jhn\',8,12);">Joh 8:12</a>; <a onClick="return mV(\'Jhn\',9,5);">9:5</a>), the true light (<a onClick="return mV(\'Jhn\',1,9);">Joh 1:9</a>; <a onClick="return mV(\'1Jo\',2,8);">1Joh 2:8</a>).<P>(3) It is in their illumination by this Divine light that there exists, even for the sinful, a medium of moral fellowship with God. We can "come to the light" (<a onClick="return mV(\'Jhn\',3,\'19-21\');">Joh 3:19-21</a>) and "walk in the light" (<a onClick="return mV(\'1Jo\',1,7);">1Joh 1:7</a>). In the translucent atmosphere of the true light, we, even while morally imperfect and impure, may come to have a common view of spiritual facts with God (<a onClick="return mV(\'1Jo\',1,\'8-10\');">1Joh 1:8-10</a>; <a onClick="return mV(\'1Jo\',2,9,10);">2:9,10</a>). This is the basis of a spiritual religion, and distinguishes Christianity from all irrational superstitions and unethical ritualisms.<P>4. Ethical Attributes:<P>In Gnostic speculation the Divine nature was conceived as the ultimate spiritual essence, in eternal separation from all that is material and mutable. But while John also, as we have seen, conceives it in this way, with him the conception is primarily and intensely ethical. The Divine nature, the communication of which is life and the revelation of which is light, has, as its two great attributes, Righteousness and Love; and with his whole soul John labors to stamp on the minds of men that only in righteousness and love can they walk in the light and have fellowship in the life of God. It is characteristic of John\'s intuitional fashion of thought that there is no effort to correlate these two aspects of the ethical perfection of God; but, broadly, it may be said that they are respectively the negative and the positive. Love is the sum of all that is positively right; righteousness the antithesis of all that is wrong, in character and conduct.<P>God Is Righteous.<P>(1) That such righteousness—antagonism to all sin—belongs to, or rather is, the moral nature of God, and that this lies at the basis of Christian ethics is categorically affirmed. "If ye know that he is righteous, ye know that every one also that doeth righteousness is begotten of him" (<a onClick="return mV(\'1Jo\',2,29);">1Joh 2:29</a>).<p>(2) This righteousness which belongs to the inward character of God extends necessarily to all His actions: "If we confess our sins, he is faithful and righteous to forgive us our sins" (<a onClick="return mV(\'1Jo\',1,9);">1Joh 1:9</a>). When on the ground of Christ\'s propitiation God forgives those who by confessing their sins make forgiveness possible, He acts righteously; and because He acts righteously, He acts also faithfully, that is, self-consistently. He does not "deny himself" (<a onClick="return mV(\'2Ti\',2,13);">2Ti 2:13</a>), but does what is in accordance with His own unchangeable character. (3) God\'s righteousness is related imperatively to the whole moral activity of His creatures, rendering sin inadmissible in them—inadmissible de jure in all, de facto in all who are "begotten of him." This John maintains with unexampled vigor (compare <a onClick="return mV(\'1Jo\',2,29);">1Joh 2:29</a>; <a onClick="return mV(\'1Jo\',3,6,8,9,10);">3:6,8-10</a>; <a onClick="return mV(\'1Jo\',5,18);">5:18</a>). It is true, however, that in its doctrine of Divine righteousness the Johannine theology makes no notable contribution to the sum of New Testament thought, but simply restates in peculiarly forceful fashion the conception of it which pervades the whole Biblical revelation.<P>5. God Is Love:<P>(1) The Love of God.<P>It is far otherwise with the next of the great affirmations which constitute its doctrine of God: God is Love. Here Gospel and Epistle rise to the summit of all revelation, and for the first time clearly and fully enunciate that truth which is the innermost secret of existence.<P>(a) Primarily a Disposition:<P>Love is primarily a disposition, a moral quality of the will. What this quality is is indicated by the fact that the typical object of love in human relation is invariably our "brother." It is the disposition to act toward others as it is natural for those to do who have all interests in common and who realize that the full self-existence of each can be attained only in a larger corporate existence. It is the mysterious power by which egoism and altruism meet and coalesce, the power to live not only for another but in another, to realize one\'s own fullest life in the fulfillment of other lives. It is self-communication which is also self-assertion.<P>(b) Embodied in Christ\'s Self-Sacrifice:<P>In history love has its one perfect embodiment in the self-sacrifice of Christ. "Hereby know we love (i.e. perceive what love is), because he laid down his life for us" (<a onClick="return mV(\'1Jo\',3,16);">1Joh 3:16</a>). The world had never been without love; but till Jesus Christ came and laid down His life for the men that hated and mocked and slew him, it had not known what love in its greatness and purity could be.<P>(c) Love in Redemption:<P>But here history is the invisible translated into the visible. The self-sacrifice of Christ in laying down His life for us is the manifestation (<a onClick="return mV(\'1Jo\',4,9);">1Joh 4:9</a>), under the conditions of time and sense, of the love of God, eternal and invisible. In the closely related parallel passages (<a onClick="return mV(\'Jhn\',3,16);">Joh 3:16</a>; <a onClick="return mV(\'1Jo\',4,9,10);">1Joh 4:9,10</a>) this is declared with matchless simplicity of statement. The Divine love is manifested in the magnitude of its gift—"his Son, his only begotten" (elsewhere the title is only "the Son" or "his Son" or "the Son of God"). Other gifts are only tokens of God\'s love; in Christ its all is bestowed (compare <a onClick="return mV(\'Rom\',8,32);">Ro 8:32</a>; <a onClick="return mV(\'Gen\',22,12);">Ge 22:12</a>). The love of God is manifested further in the purpose of its gift—"that whosoever believeth on him should not perish, but have eternal life." It is the self-determination of God, not only to rescue men from what is the sum and finality of all evils, but to impart the supreme and eternal good. But again, the love of God is manifested in the means by which this purpose is achieved. His son is sent as "the propitiation for our sins." God shrinks not from the uttermost cost of redemption; but in the person of His Son humbles Himself and suffers unto blood that He may take upon Himself the load of human guilt and shame. And the last element in the full conception of Divine love is its objects: "God so loved the world"; "Herein is love, not that we loved God, but that he loved us." Its ineffable mystery reveals itself in its absolute spontaneity, its self-origination. Its fires are self-kindled; it shines forth in its purest splendors upon the unattractive and unworthy. Such is the conception John sets before us. In this entirely spontaneous, self-determined devotion of God to sinful men; this Divine passion to rescue them from sin, the supreme evil, and to impart to them eternal life, the supreme good; in this, which is evoked not by their worthiness but by their need, and goes to the uttermost length of sacrifice in bearing the uttermost burden of their sin and its inevitable consequences; in this, which is forever revealed in the mission of Jesus Christ, God\'s only begotten Son, is love.<P>(2) Love Is God\'s Nature.<P>And God is love (<a onClick="return mV(\'1Jo\',4,8,16);">1Joh 4:8,16</a>).<P>(a) God is love essentially. Love is not one of God\'s moral attributes, but that from which they all proceed, and in which they all unite. The spring of all His actions is love.<P>(b) Therefore also His love is universal. In a special sense He loves those who are spiritually His children (<a onClick="return mV(\'Jhn\',14,23);">Joh 14:23</a>); but His undivided and essential love is given also to the whole world (<a onClick="return mV(\'Jhn\',3,16);">Joh 3:16</a>; <a onClick="return mV(\'1Jo\',2,2);">1Joh 2:2</a>). That is John\'s great truth. He does not attempt to reconcile with it other apparently conflicting truths in his theological scheme; possibly he was not conscious of any need to do so. But of this he is sure—God is love. That fact must, in ways we cannot yet discern, include all other facts.<P>(c) The love of God is eternal and unchangeable; for it does not depend on any merit or reciprocation in its object, but overflows from its own infinite fullness. We may refuse to it the inlet into our life which it seeks (<a onClick="return mV(\'Jhn\',3,19);">Joh 3:19</a>; <a onClick="return mV(\'Jhn\',5,40);">5:40</a>); we may so identify ourselves with evil as to turn it into an antagonistic force. But as our goodness did not call it forth, neither can our evil cause it to cease.<P>(d) If love is an essential, the essential attribute of God, it follows that we cannot ultimately conceive of God as a single simple personality. It is at this point that the fuller Johannine conception of multiple personality in the Godhead becomes most helpful, enabling us to think of the Divine life in itself not as an eternal solitude of self-contemplation and self-love, but as a life of fellowship (<a onClick="return mV(\'Jhn\',1,1);">Joh 1:1</a>; <a onClick="return mV(\'1Jo\',1,2);">1Joh 1:2</a>). The Godhead is filled with love. "The Father loveth the Son" (<a onClick="return mV(\'Jhn\',3,35);">Joh 3:35</a>); and the prayer of the Son for His followers is "that the love wherewith thou lovedst me may be in them" (<a onClick="return mV(\'Jhn\',17,26);">Joh 17:26</a>). The eternal giving and receiving of Divine love between the Father and the Son is, in the Johannine theology, an essential element of the Divine nature.<P>III. The Incarnation.<P>The 2nd great contribution of the Johannine writings to the development of Christian theology is their doctrine of Christ—the latest and most deliberate effort within New Testament times to relate intellectually the church\'s faith in Jesus to its faith in God. In these writings the superhuman personality of Jesus is expressed by three titles which are used as practically synonymous—"the Christ," "the Son" ("Son of God," "only begotten Son of God"), the "Word" (Logos). The last alone is distinctively Johannine.<P>1. Historical Antecedents of the Logos-Doctrine:<P>Historically, the Logos-doctrine of John has undoubted links of connection with certain speculative developments both of Greek and Hebrew thought. The Heraclitean use of the term "Logos" (see above, I) to express the idea of an eternal and all-embracing Reason immanent in the world was continued, while the conception was further elaborated, by the Stoics. On the other hand, the later developments of Hebrew thought show an increasing tendency to personify the self-revealing activity of God under such conceptions as the Angel, Glory, or Name of Yahweh, to attach a peculiar significance to the "Word" (me\'mera\') by which He created the heaven and the earth, and to describe "Wisdom" (Job, Proverbs) in something more than a figurative sense as His agent and coworker. These approximations of Greek pantheism and Hebrew monotheism were more verbal than real; and, naturally, Philo\'s attempt in his doctrine of the Logos to combine philosophies so radically divergent was less successful than it was courageous. How far, and whether directly or indirectly, John is indebted to Philo and his school, are questions to which widely different answers have been given; but some obligation, probably indirect, cannot reasonably be denied. It is evident, indeed, that both the idea and the term "Logos" were current in the Christian circles for which his Gospel and First Epistle were immediately written; in both its familiarity is assumed. Yet the Johannine doctrine has little in common with Philo\'s except the name; and it is just in its most essential features that it is most original and distinct.<P>As the Old Testament begins with the affirmation, "In the beginning God created the heaven and the earth," so the Fourth Gospel begins with the similar affirmation, "In the beginning was the Word, and the Word was with God, and the Word was God" (<a onClick="return mV(\'Jhn\',1,1);">Joh 1:1</a>). The Word was the medium of Divine action in creation (<a onClick="return mV(\'Jhn\',1,3);">Joh 1:3</a>).<P>2. The Logos-Doctrine in John:<P>In the Word was life, not merely self-existing but self-imparting, so that it became the light of men (<a onClick="return mV(\'Jhn\',1,4);">Joh 1:4</a>)—the true light, which, coming into the world, lighteth every man (<a onClick="return mV(\'Jhn\',1,9);">Joh 1:9</a>). And finally it is declared that this Divine Word became flesh and tabernacled among us, so that "we beheld his glory, glory as of the only begotten from the Father, full of grace and truth" (<a onClick="return mV(\'Jhn\',1,14);">Joh 1:14</a>). Here faith in Jesus as Divine has been traced back to, and grounded in, a duality within the Godhead itself. In the twofold mode of the Divine existence, it is seen that there is God who is just God (so to say), God in Himself; and there is God-with-God, God who is God\'s other self, God going forth from Himself in thought and action. The first without the second would be essence without manifestation, mind without utterance, light without effulgence, life without life-giving, fatherhood without sonship. It is seen that within the Divine Being there is one through whom, as there is also one from whom, all Divine energy goes forth. Above all it is seen that there is a Divine mode of existence in which it is inherently possible and natural for God to be immediately related to created being and even to become incarnate in humanity, as there is also a mode of Divine existence which cannot be immediately communicated or revealed to created life. Thus the Johannine doctrine is: first, that the Logos is personal and Divine, having a ground of personal being within the Divine nature (pros ton Theon, "in relation to God"); and, second, that the Logos became flesh, was and is incarnate in the historical Jesus.<P>3. The Incarnation as Delineated in the Fourth Gospel:<P>In the Gospel the term "Logos" does not recur after the opening verses; yet thesis of the Prologue, so far from being irrelevant, dominates the entire biographical presentation. The creative and cosmic significance of the Logos-Christ is naturally in the background; but it may be said of the Gospel that "the Word became flesh" is its text, and all the rest—miracle, incident, discourse—is comment. On the one hand, the reality of the "becoming flesh" is emphasized (e.g. <a onClick="return mV(\'Jhn\',4,6);">Joh 4:6</a>; <a onClick="return mV(\'Jhn\',11,35);">11:35</a>; <a onClick="return mV(\'Jhn\',19,1,2,3,17,28,34,\'38-40\');">19:1,2,3,17,28,34,38-40</a>; <a onClick="return mV(\'Jhn\',20,20,27);">20:20,27</a>). On the other hand, the human vesture only reveals the Divine glory within. On earth, Jesus is still "the Son of man, who is in heaven" (<a onClick="return mV(\'Jhn\',3,13);">Joh 3:13</a>); the perfect revelation of the Father (<a onClick="return mV(\'Jhn\',14,9);">Joh 14:9</a>); the light of the world (<a onClick="return mV(\'Jhn\',8,12);">Joh 8:12</a>); the way, the truth and the life (<a onClick="return mV(\'Jhn\',14,6);">Joh 14:6</a>); the resurrection (<a onClick="return mV(\'Jhn\',11,26);">Joh 11:26</a>); the final judge (<a onClick="return mV(\'Jhn\',5,22);">Joh 5:22</a>) and Saviour (<a onClick="return mV(\'Jhn\',4,42);">Joh 4:42</a>; <a onClick="return mV(\'Jhn\',6,40);">6:40</a>) of men; the supreme moral authority (<a onClick="return mV(\'Jhn\',13,34);">Joh 13:34</a>; <a onClick="return mV(\'Jhn\',14,15,21);">14:15,21</a>); the hearer of prayer (<a onClick="return mV(\'Jhn\',14,13,14);">Joh 14:13,14</a>); the giver of the Spirit (<a onClick="return mV(\'Jhn\',7,38,39);">Joh 7:38,39</a>; <a onClick="return mV(\'Jhn\',16,7);">16:7</a>; <a onClick="return mV(\'Jhn\',20,22);">20:22</a>); endowed with all the prerogatives of God (<a onClick="return mV(\'Jhn\',5,23);">Joh 5:23</a>; <a onClick="return mV(\'Jhn\',10,30);">10:30</a>,<a onClick="return mV(\'Jhn\',10,\'36-38\');">36-38</a>).<P>4. The Incarnation in the First Epistle:<P>In the 1John the central thesis is the complete, personal, and permanent identity of the historical Jesus with the Divine Being who is the Word of Life (<a onClick="return mV(\'Jhn\',1,1);">1:1</a>), the Christ (<a onClick="return mV(\'Jhn\',4,2);">4:2</a>), the Son of God (<a onClick="return mV(\'Jhn\',5,5);">5:5</a>). This is maintained in a vigorous polemic against certain heretical teachers whom the writer calls "antichrists," who in docetic fashion denied that Jesus is the Christ (<a onClick="return mV(\'Jhn\',2,22);">2:22</A>), or, more definitely, the "Christ come in the flesh" (<a onClick="return mV(\'Jhn\',4,3);">4:3</a>), and who asserted that He "came" by water only and not by blood also (<a onClick="return mV(\'Jhn\',5,6);">5:6</A>; see <a href="./study/isbe/search.html?string=JOHN,+THE+EPISTLES+OF">JOHN, THE EPISTLES OF</a>). Against this doctrine of a merely apparent or temporary association of Jesus with the Christ John bears vehement testimony. "Who is the liar but he that denieth that Jesus is the Christ?" (<a onClick="return mV(\'1Jo\',2,22);">1Joh 2:22</a>). \'Every spirit that confesseth Jesus as Christ come in the flesh is of God: and every spirit that confesseth not Jesus is not of God\' (<a onClick="return mV(\'1Jo\',4,2,3);">1Joh 4:2,3</a>). "Who is he that overcometh the world, but he that believeth that Jesus is the Son of God? This is he that came by water and blood, even Jesus Christ; not with the water only, but with the water and with the blood" (<a onClick="return mV(\'1Jo\',5,5,6);">1Joh 5:5,6</a>). These passages all promulgate the same truth in substantially the same way. Without ceasing to be what He is, the Christ, the Son of God, has become Jesus; and Jesus, without ceasing to be truly human, is the Son of God. As to the manner of the incarnation—by what process of self-emptying or by what conjunction of Divine-human attributes the eternal Son became Jesus—the Johannine writings, like the New Testament everywhere, are silent. They proclaim Jesus Christ as human and Divine; but the distinguishing of what in Him was human and what Divine, or whether the one is distinct from the other, this they do not even consider. Gnosticism drew such a distinction; John does not. His one truth is that Jesus is the Son of God and the Son of God is Jesus, and that in Him the life of God was manifested (<a onClick="return mV(\'1Jo\',1,2);">1Joh 1:2</a>) and is given (<a onClick="return mV(\'1Jo\',5,11);">1Joh 5:11</a>) to men.<P>5. Practical Implications of the Incarnation:<P>In this truth, viewed in its practical consequences, John sees the core of the church\'s faith and the root and safeguard of its life.<p>(a) This alone secures and guarantees the Christian revelation of God; with its denial that revelation is canceled. "Whosoever denieth the Son, the same hath not the Father" (<a onClick="return mV(\'1Jo\',2,23);">1Joh 2:23</a>).<p>(b) Above all, it is only in the life and death of Jesus, the incarnate Son, that we possess a valid revelation of God\'s self-sacrificing love. "Herein was the love of God manifested in us, that God hath sent his...Son into the world that we might live through him" (<a onClick="return mV(\'1Jo\',4,9);">1Joh 4:9</a>). With the denial of this the Christian ethic is drained of its very life-blood. There was no merely external and accidental connection between Docetism and the moral indifferentism of the Gnostic. The natural result of making man\'s salvation easy, so to say, for God, was to make it easy for man also—salvation by creed without conduct (<a onClick="return mV(\'1Jo\',2,4,6);">1Joh 2:4,6</a>; <a onClick="return mV(\'1Jo\',3,7);">3:7</a>), knowledge without love (<a onClick="return mV(\'1Jo\',4,8);">1Joh 4:8</a>), or love that paid its debts with goodly phrases and empty words (<a onClick="return mV(\'1Jo\',3,17,18);">1Joh 3:17,18</a>). A docetic Christ meant docetic Christianity.<p>(c) Finally, John sees in the incarnation the only possibility of a Divine redemption. It was not for a word or a formula he was concerned, but for the raising of humanity to Divine life through the God-man. The ultimate significance of the incarnation of the Son is that in Him the eternal life of God has flowed into our humanity and become a fountain of regenerative power to as many as receive Him (<a onClick="return mV(\'Jhn\',1,12);">Joh 1:12</a>). "He that hath the Son hath the life; he that hath not the Son of God hath not the life" (<a onClick="return mV(\'1Jo\',5,12);">1Joh 5:12</a>). This is the center of the Johannine Gospel—a Divine-human Christ, who stands in a unique, vital relation to men, reproducing in them His own character and experiences as the vine reproduces itself in the branches, doing that, the mysterious reality of which is only expressed, not explained, when it is said that He is our "life" (<a onClick="return mV(\'Jhn\',14,19,20);">Joh 14:19,20</a>; <a onClick="return mV(\'Jhn\',15,5);">15:5</a>).<P>IV. The Holy Spirit.<P>1. The Work of the Spirit—in the Fourth Gospel:<P>In one direction the doctrine of the Holy Spirit is uniquely developed in the Johannine writings. The conception of the Spirit as the agent of Work of the Christ\'s presence with and activity in the church is presented with a fullness and clearness unequaled in the New Testament. The departing Christ promises to His friends a new presence, different from His own in that it was to be not a bodily but a spiritual presence, and yet really His own—a presence in which all and more than all the effects of His bodily presence would be perpetuated (<a onClick="return mV(\'Jhn\',14,18);">Joh 14:18</a>; <a onClick="return mV(\'Jhn\',16,22);">16:22</a>). In truth, it was expedient for them that He should go away, in order that this other Paraclete should come (<a onClick="return mV(\'Jhn\',16,7);">Joh 16:7</a>). In the body His presence with His followers had been local and intermittent; in the Spirit He would come to take up His abode with them forever (<a onClick="return mV(\'Jhn\',14,16);">Joh 14:16</a>). Formerly He had been still external to them, but now was not only to dwell with them, but to be in them (<a onClick="return mV(\'Jhn\',14,17);">Joh 14:17</a>). Instead of the external voice of their Teacher addressing to them the words of eternal life, they should possess the very Spirit of truth (<a onClick="return mV(\'Jhn\',14,17);">Joh 14:17</a>), a well-spring of illumination from within, giving them an "understanding" to know Him that is true (<a onClick="return mV(\'1Jo\',5,20);">1Joh 5:20</a>); and instead of His visible example before their eyes, an inward community of life with Him like that of the vine and the branches. The complete, vital, permanent union of Christ and His people, which had been prevented by the necessary limitations of a local, corporeal state of existence, would be attained, when for this there was substituted the direct action of spirit upon spirit.<P>Perpetuates, but also Intensifies the Consciousness of Christ.<P>Thus the function of the Spirit which is chiefly emphasized in the Johannine writings is that by which He perpetuates but also intensifies, enlightens, and educates the consciousness of Christ in the church and in the Christian life. In this respect His nature is the opposite of that of the Logos, the self-revealing God. The Holy Spirit never reveals Himself to human consciousness; He reveals the Son and the Father through the Son. His operations are wholly secret and inscrutable, known only by their result (<a onClick="return mV(\'Jhn\',3,8);">Joh 3:8</a>). He is the silent inward monitor and remembrancer of the disciples (<a onClick="return mV(\'Jhn\',14,20);">Joh 14:20</a>); the illuminator, the revealer of Christ (<a onClick="return mV(\'Jhn\',16,14);">Joh 16:14</a>); a spirit of witness who both Himself bears witness concerning Christ to His people and makes of them ready and joyful witness-bearers (<a onClick="return mV(\'Jhn\',15,26,27);">Joh 15:26,27</a>); a guide by whom a steady growth in knowledge is secured, leading gradually on to the full truth of Christ (<a onClick="return mV(\'Jhn\',16,12,13);">Joh 16:12,13</a>); a spirit of conviction working in men an immediate certainty of the truth regarding sin and righteousness, and the Divine judgment which marks their eternal antagonism (<a onClick="return mV(\'Jhn\',16,\'8-11\');">Joh 16:8-11</a>).<P>2. In the First Epistle:<P>In the Epistle we find the promise of the Gospel accomplished in actual experience. There is no reference to the manifold charismata of the first age, the prophetic afflatus excepted (<a onClick="return mV(\'1Jo\',4,1);">1Joh 4:1</a>). But whether through the prophetic "medium" or the normal Christian consciousness, the function of the Spirit is always to "teach" or to "witness" concerning Christ. This is finely brought out in the parallelism of <a onClick="return mV(\'1Jo\',5,6);">1Joh 5:6</a>: "This (Jesus Christ) is he that came" (once for all fulfilling the Messiah\'s mission); "It is the Spirit that beareth witness" (ever authenticating its Divine origin, interpreting its purpose and applying its results). The specific testimony the Spirit bears to Christ is defined (<a onClick="return mV(\'1Jo\',4,2,3);">1Joh 4:2,3</a>). "Hereby know ye the Spirit of God: every spirit that confesseth that Jesus Christ is come in the flesh is of God: and every spirit that confesseth not Jesus is not of God."<P>(1) A Divine Teacher.<P>The gift of the Spirit is an "anointing from the Holy One" (<a onClick="return mV(\'1Jo\',2,20);">1Joh 2:20</a>); and the result of this "anointing" is that "ye know all things" (or that "ye all have knowledge"; the reading is doubtful), and "need not that any one teach you" (<a onClick="return mV(\'1Jo\',2,27);">1Joh 2:27</a>). The apostle\'s comfort concerning his readers, encompassed as they are by the snares of Antichrist, is that they have a Divine Teacher, who continually enlightens their understanding, strengthens their convictions and ministers to them an invincible assurance of the truth of the Gospel. "The anointing abideth in you...and teacheth you concerning all things." The spirit is not a source of independent revelation, but makes the revelation of Christ effectual. The truth is placed beyond all reach of controversy and passes into absolute knowledge: "Ye know all things." It may be added that the history of Christianity furnishes an always growing verification of this Johannine doctrine of a living power of witness and enlightenment present in the church, by which, notwithstanding the constant hindrance of human imperfection, the development of the Christian faith has been steadily advanced, its forgotten or neglected factors brought to remembrance. Old truths have been presented in new aspects and filled with fresh life, and all has been brought to pass with marvelous adaptation to the church\'s needs and in proportion to its receptivity.<P>(2) Other Aspects.<P>In other directions the doctrine of the Spirit is less developed. The agency of the Spirit in regeneration is repeatedly and emphatically declared in a single passage (<a onClick="return mV(\'Jhn\',3,\'5-8\');">Joh 3:5-8</a>), but is nowhere else referred to either in the Gospel or the First Epistle. More remarkable still, neither in Gospel nor Epistle is the Holy Spirit once spoken of as the Divine agent in sanctification. There is no passage resembling that in which Paul speaks of the ethical "fruit of the Spirit" (<a onClick="return mV(\'Gal\',5,22,23);">Ga 5:22,23</a>). The Spirit is the Spirit of truth, the revealer, the inspirer of faith, but is never spoken of as the Spirit of love or holiness. If those who are begotten of God cannot sin, it is not because God\'s Spirit, but because "his seed," abideth in them (<a onClick="return mV(\'1Jo\',3,9);">1Joh 3:9</a>). The explanation of this peculiarity (which has been little observed) in the Johannine theology may be that the Spirit\'s work of revealing Christ is regarded as all-inclusive. Thus enabling Christ\'s disciples to abide in Him as the branch in the vine, He secures also their bringing forth "much fruit" in all Christlikeness of character and conduct.<P>2. The Person of the Spirit:<P>Passing now from the work to the Person, we observe that in the Fourth Gospel the attribution of personality to the Spirit reaches the acme of distinctness. He is "another Paraclete" (<a onClick="return mV(\'Jhn\',14,16);">Joh 14:16</a> margin), personal as Christ Himself is personal; and all the functions ascribed to Him—to remind, to teach, to testify, to guide, to convict—are such as are possible only to a personal agent. Nor is it otherwise in the First Epistle. The expressions in it which have been alleged (Pfleiderer and others) as inconsistent with personality (the "anointing," <a onClick="return mV(\'1Jo\',2,20);">1Joh 2:20</a>; "He hath given us of his Spirit," <a onClick="return mV(\'Jhn\',4,13);">4:13</a>) require no such interpretation. The "anointing" denotes the Spirit, not in His essence or agency, but as the gift of the Holy One with which He anoints believers (compare <a onClick="return mV(\'Jhn\',7,38,39);">Joh 7:38,39</a>); and the expression "He hath given us of his Spirit" (as if the Spirit were a divisible entity) is no more incompatible with personality than is the saying "to Him whom he hath sent..., God giveth not the Spirit by measure" (<a onClick="return mV(\'Jhn\',3,34);">Joh 3:34</a>), or than our speaking of Christians as having more or less of the Spirit.<P>His Deity Implied.<P>The essential Deity of the Spirit is nowhere explicitly asserted, but is necessarily implied in His relation both to Christ and to the church as the "other Paraclete." There is not, however, the same theological development as is achieved regarding the Logos. The Divinity of Christ is grounded in an essential duality of being within the Godhead itself; but there is no similar effort to trace back the threefoldness in the revelation of God, as Father, Son and Spirit, to an essential threefoldness in the Divine nature. The fact is that both historically and logically the doctrine of the Spirit as the third person in the Godhead depends upon that of the Divine Son as the second. It was through its living experience of the Divine in Christ that the church first developed its thought of God beyond the simple monotheism of the Old Testament; but having advanced to the conception of a twofold Godhead, in which there is Fatherhood and Sonship, it was bound to enlarge it still further to that of a threefold Godhead—Father, Son and Spirit. The Son and the Spirit were equally manifestations of God in redemption, and must equally stand in essential relation to the Divine existence.<P>V. Doctrine of Sin and Propitiation.<P>This theme is not elaborated. It is characteristic of the Johannine writings that salvation is looked at from the terminus ad quem rather than from the terminus a quo. The infinite good, eternal life, is more in view than the infinite evil, sin. It seems safe to say that the author of these writings at no time had that intense experience of bondage to the law of sin and of death which so colors Paul\'s presentation of the gospel. It was, moreover, no part of his plan to expound the doctrine of propitiation; nor had he any original contribution to make on this head to the sum of New Testament thought. But it is a quite unwarrantable criticism which denies that the saving work of Christ, in the Johannine conception, consists in deliverance from sin.<P>1. Sin:<P>It is true that Christ not only takes away the sin of the world (<a onClick="return mV(\'Jhn\',1,29);">Joh 1:29</a>), but also draws it forth in its utmost intensity and guilt. All sin culminates in the rejection of Christ (<a onClick="return mV(\'Jhn\',15,22);">Joh 15:22</a>); the Spirit convicts men of sin because they "believe not" on Him (<a onClick="return mV(\'Jhn\',16,9);">Joh 16:9</a>). "Every one that committeth sin is the bondservant of sin" (<a onClick="return mV(\'Jhn\',8,34);">Joh 8:34</a>); but what reveals the true character of this bondage is that in the presence of the light, men "loved the darkness" (<a onClick="return mV(\'Jhn\',3,19);">Joh 3:19</a>). That the malign quality and power of evil are fully revealed only in the presence of perfect goodness, that the brighter is the light, the darker is the shade of guilt created by its rejection—all this John teaches; but such teaching is by no means peculiar to him, and to infer from it that "to his mind sin in itself involves no moral culpability" is nothing more than a way-ward paradox.<P>In
