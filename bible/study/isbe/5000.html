ending great events. The fortunes of the Jewish people were at their lowest ebb. Pharisaic formalism, Sadducean unbelief, fanatical Zealotry, Herodian sycophantism, Roman oppression, seemed to have crushed out the last sparks of spiritual religion. Yet in numerous quiet circles in Judea, and even in remote Galilee, little godly bands still nourished their souls on the promises, looking for "the consolation of Israel" and "redemption of Jerusalem" (<a onClick="return mV(\'Luk\',2,25,38);">Lu 2:25,38</a>). Glimpses of these are vouchsafed in Zacharias and Elisabeth, in Simeon, in Anna, in Joseph and Mary (<a onClick="return mV(\'Luk\',1,\'1-\');">Lu 1</a>; <a onClick="return mV(\'Luk\',2,\'1-\');">2</a>; <a onClick="return mV(\'Mat\',1,18);">Mt 1:18</a>). It was in hearts in these circles that the stirrings of the prophetic spirit began to make themselves felt anew, preparing for the Advent (compare <a onClick="return mV(\'Luk\',2,27,36);">Lu 2:27,36</a>).<P>2. Birth of the Baptist:<P>(<a onClick="return mV(\'Luk\',1,\'1-\');">Luke 1</a>)<P>In the last days of Herod—perhaps in the year 748 of Rome, or 6 BC—the aged priest Zacharias, of the course of Abijah (<a onClick="return mV(\'1Ch\',24,10);">1Ch 24:10</a>; compare Schurer, Div. II, Vol. I, 219ff), was ministering in the temple at the altar of incense at the hour of evening prayer. Scholars have reckoned, if on somewhat precarious grounds, that the ministry of the order to which Zacharias belonged fell in this year in the month of April or in early October (compare Andrews, Life of our Lord). Now a wonderful thing happened. Zacharias and his wife Elisabeth, noted for their blameless piety, were up to this time childless. On this evening an angel, appearing at the side of the altar of incense, announced to Zacharias that a son should be born to them, in whom should be realized the prediction of Malachi of one coming in the spirit and power of Elijah to prepare the way of the Lord (compare <a onClick="return mV(\'Mal\',4,5,6);">Mal 4:5,6</a>). His name was to be called John. Zacharias hesitated to believe, and was stricken with dumbness till the promise should be fulfilled. It happened as the angel had foretold, and at the circumcision and naming of his son his tongue was again loosed. Zacharias, filled with the Spirit, poured forth his soul in a hymn of praise—the Benedictus (<a onClick="return mV(\'Luk\',1,\'5-25\');">Lu 1:5-25</a>,<a onClick="return mV(\'Luk\',1,\'57-80\');">57-80</a>; compare <a href="./study/isbe/search.html?string=JOHN+THE+BAPTIST">JOHN THE BAPTIST</a>).<P>3. The Annunciation and Its Results:<P>(<a onClick="return mV(\'Luk\',1,\'26-56\');">Lu 1:26-56</a>; <a onClick="return mV(\'Mat\',1,\'18-25\');">Mt 1:18-25</a>)<P>Meanwhile yet stranger things were happening in the little village of Nazareth, in Galilee (now enNacirah). There resided a young maiden of purest character, named Mary, betrothed to a carpenter of the village (compare <a onClick="return mV(\'Mat\',13,55);">Mt 13:55</a>), called Joseph, who, although in so humble a station, was of the lineage of David (compare <a onClick="return mV(\'Isa\',11,1);">Isa 11:1</a>). Mary, most probably, was likewise of Davidic descent (<a onClick="return mV(\'Luk\',1,32);">Lu 1:32</a>; on the genealogies, see below). The fables relating to the parentage and youth of Mary in the Apocryphal Gospels may safely be discarded. To this maiden, three months before the birth of the Baptist, the same angelic visitant (Gabriel) appeared, hailing her as "highly favored" of God, and announcing to her that, through the power of the Holy Spirit, she should become the mother of the Saviour. The words "Blessed art thou among women," in the King James Version of <a onClick="return mV(\'Luk\',1,28);">Lu 1:28</a> are omitted by the Revised Version (British and American), though found below (<a onClick="return mV(\'Luk\',1,42);">1:42</a>) in Elisabeth\'s salutation. They give, in any case, no support to Mariolatry, stating simply the fact that Mary was more honored than any other woman of the race in being chosen to be the mother of the Lord.<P>(1) The Amazing Message.<P>The announcement itself was of the most amazing import. Mary herself was staggered at the thought that, as a virgin, she should become a mother (<a onClick="return mV(\'Luk\',1,34);">Lu 1:34</a>). Still more surprising were the statements made as to the Son she was to bear. Conceived of the Holy Spirit (<a onClick="return mV(\'Luk\',1,35);">Lu 1:35</a>; <a onClick="return mV(\'Mat\',1,18);">Mt 1:18</a>), He would be great, and would be called "the Son of the Most High" (<a onClick="return mV(\'Luk\',1,32);">Lu 1:32</a>)—"the Son of God" (<a onClick="return mV(\'Luk\',1,35);">Lu 1:35</a>); there would be given to Him the throne of His father David, and His reign would be eternal (<a onClick="return mV(\'Luk\',1,32,33);">Lu 1:32,33</a>; compare <a onClick="return mV(\'Isa\',9,6,7);">Isa 9:6,7</a>); He would be "holy" from the womb (<a onClick="return mV(\'Luk\',1,35);">Lu 1:35</a>). His name was to be called Jesus (<a onClick="return mV(\'Luk\',1,31);">Lu 1:31</a>; compare <a onClick="return mV(\'Mat\',1,21);">Mt 1:21</a>), denoting Him as Saviour. The holiness of Jesus is here put in connection with His miraculous conception, and surely rightly. In no case in the history of mankind has natural generation issued in a being who is sinless, not to say superhuman. The fact that Jesus, even in His human nature, was supernaturally begotten—was "Son of God"—does not exclude the higher and eternal Sonship according to the Divine nature (<a onClick="return mV(\'Jhn\',1,18);">Joh 1:18</a>). The incarnation of such a Divine Being as Paul and John depict, itself implies miracle in human origin. On the whole message being declared to her, Mary accepted what was told her in meek humility (<a onClick="return mV(\'Luk\',1,38);">Lu 1:38</a>).<P>(2) The Visit to Elisabeth.<P>With the announcement to herself there was given to Mary an indication of what had befallen her kinswoman Elisabeth, and Mary\'s first act, on recovering from her astonishment, was to go in haste to the home of Elisabeth in the hill country of Judea (<a onClick="return mV(\'Luk\',1,39);">Lu 1:39</a>). Very naturally she did not rashly forestall God\'s action in speaking to Joseph of what had occurred, but waited in quietness and faith till God should reveal in His own way what He had done. The meeting of the two holy women was the occasion of a new outburst of prophetic inspiration. Elisabeth, moved by the Spirit, greeted Mary in exalted language as the mother of the Lord (<a onClick="return mV(\'Luk\',1,\'42-45\');">Lu 1:42-45</a>)—a confirmation to Mary of the message she had received; Mary, on her part, broke forth in rhythmical utterance, "My soul doth magnify the Lord," etc. (<a onClick="return mV(\'Luk\',1,\'46-56\');">Lu 1:46-56</a>). Her hymn—the sublime Magnificat—is to be compared with Hannah\'s (<a onClick="return mV(\'1Sa\',2,\'1-11\');">1Sa 2:1-11</a>), which furnishes the model of it. Mary abode with Elisabeth about three months, then returned to her own house.<p>(3) Joseph\'s Perplexity.<P>Here a new trial awaited her. Mary\'s condition of motherhood could not long be concealed, and when Joseph first became aware of it, the shock to a man so just (<a onClick="return mV(\'Mat\',1,19);">Mt 1:19</a>) would be terrible in its severity. The disappearance of Joseph from the later gospel history suggests that he was a good deal older than his betrothed, and it is possible that, while strict, upright and conscientious, his disposition was not as strong on the side of sympathy as so delicate a case required. It is going too far to say with Lange, "He encountered the modest, but unshakably firm Virgin with decided doubt; the first Ebionite"; but so long as he had no support beyond Mary\'s word, his mind was in a state of agonized perplexity. His first thought was to give Mary a private "bill of divorcement" to avoid scandal (<a onClick="return mV(\'Mat\',1,19);">Mt 1:19</a>). Happily, his doubts were soon set at rest by a Divine intimation, and he hesitated no longer to take Mary to be his wife (<a onClick="return mV(\'Mat\',1,24);">Mt 1:24</a>). Luke\'s Gospel, which confines itself to the story of Mary, says nothing of this episode; Matthew\'s narrative, which bears evidence of having come from Joseph himself, supplies the lack by showing how Joseph came to have the confidence in Mary which enabled him to take her to wife, and become sponsor for her child. The trial, doubtless, while it lasted, was not less severe for Mary than for Joseph—a prelude of that sword which was to "pierce through (her) own soul" (<a onClick="return mV(\'Luk\',2,35);">Lu 2:35</a>). There is no reason to believe that Joseph and Mary did not subsequently live in the usual relations of wedlock, and that children were not born to them (compare <a onClick="return mV(\'Mat\',13,55,56);">Mt 13:55,56</a>, etc.).<P>4. The Birth at Bethlehem:<P>(<a onClick="return mV(\'Mat\',2,1);">Matthew 2:1</a>; <a onClick="return mV(\'Luk\',2,\'1-7\');">Luke 2:1-7</a>)<P>Matthew gives no indication of where the events narrated in his first chapter took place, first mentioning Nazareth on the occasion of the return of the holy family from Egypt (<a onClick="return mV(\'Mat\',2,23);">2:23</a>). In <a onClick="return mV(\'Mat\',2,1);">2:1</a> he transports us to Bethlehem as the city of Christ\'s birth. It is left to Luke to give an account of the circumstances which brought Joseph and Mary to Bethlehem—thus fulfilling prophecy (<a onClick="return mV(\'Mic\',5,2);">Mic 5:2</a>; <a onClick="return mV(\'Mat\',2,5,6);">Mt 2:5,6</a>)—at this critical hour, and to record the lowly manner of Christ\'s birth there.<P>(1) The Census of Quirinius.<P>The emperor Augustus had given orders for a general enrollment throughout the empire (the fact of periodical enrollments in the empire is well established by Professor W.M. Ramsay in his Was Christ Born at Bethlehem?), and this is stated to have been given effect to in Judea when Quirinius was governor of Syria (<a onClick="return mV(\'Luk\',2,1,2);">Lu 2:1,2</a>). The difficulties connected with the enrollment or census here mentioned are discussed in the article <a href="./study/isbe/search.html?string=QUIRINIUS">QUIRINIUS</a>. It is known that Quirinius did conduct a census in Judea in 6 AD (compare <a onClick="return mV(\'Act\',5,37);">Ac 5:37</a>), but the census at Christ\'s birth is distinguished from this by Luke as "the first enrollment." The difficulty was largely removed when it was ascertained, as it has been to the satisfaction of most scholars, that Quirinius was twice governor of Syria—first, after Herod\'s death, 4-1 BC, and again in 6-11 AD. The probability is that the census was begun under Varus, the immediate predecessor of Quirinius—or even earlier under Saturninus—but was delayed in its application to Judea, then under Herod\'s jurisdiction, and was completed by Quirinius, with whose name it is officially connected. That the enrollment was made by each one going to his own city (verse <a onClick="return mV(\'Luk\',2,3);">3</a>) is explained by the fact that the census was not made according to the Roman method, but, as befitted a dependent kingdom, in accordance with Jewish usages (compare Ramsay).<P>(2) Jesus Born.<P>It must be left undecided whether the journey of Mary to Bethlehem with Joseph was required for any purpose of registration, or sprang simply from her unwillingness to be separated from Joseph in so trying a situation. To Bethlehem, in any case, possibly by Divine monition, she came, and there, in the ancestral city of David, in circumstances the lowliest conceivable, brought forth her marvelous child. In unadorned language—very different from the embellishments of apocryphal story—Luke narrates how, when the travelers arrived, no room was found for them in the "inn"—the ordinary eastern khan or caravanserai, a square enclosure, with an open court for cattle, and a raised recess round the walls for shelter of visitors—and how, when her babe was born, Mary wrapped Him in swaddling clothes, and laid Him in a manger. The wearied pair having, according to Luke, been crowded out of, and not merely within, the inn, there is every probability that the birth took place, not, as some suppose, in the courtyard of the inn, but, as the oldest tradition asserts (Justin Martyr, Dialogue with Trypho, 78), in a cave in the neighborhood, used for similar purposes of lodgment and housing of cattle. High authorities look favorably on the "cave of the nativity" still shown, with its inscription, Hic de virgine Maria Jesus Christus natus est, as marking the sacred spot. In such incredibly mean surroundings was "the only begotten of the Father" ushered into the world He came to redeem. How true the apostle\'s word that He "emptied" Himself (<a onClick="return mV(\'Phl\',2,7);">Php 2:7</a>)! A problem lies in the very circumstances of the entrance into time of such a One, which only the thought of a voluntary humiliation for saving ends can solve.<P>5. The Incidents of the Infancy:<P>(<a onClick="return mV(\'Luk\',2,\'8-39\');">Luke 2:8-39</a>; <a onClick="return mV(\'Mat\',2,\'1-12\');">Matthew 2:1-12</a>)<P>Born, however, though Jesus was, in a low condition, the Father did not leave Him totally without witness to His Sonship. There were rifts in the clouds through which cidents of the hidden glory streamed. The scenes in the narratives of the Infancy exhibit a strange commingling of the glorious and the lowly.<P>(1) The Visit of the Shepherds.<P>To shepherds watching their flocks by night in the fields near Bethlehem the first disclosure was made. The season, one would infer, could hardly have been winter, though it is stated that there is frequently an interval of dry weather in Judea between the middle of December and the middle of February, when such a keeping of flocks would be possible (Andrews). The angel world is not far removed from us, and as angels preannounced the birth of Christ, so, when He actually came into the world (compare <a onClick="return mV(\'Hbr\',1,6);">Heb 1:6</a>), angels of God made the night vocal with their songs. First, an angel appearing in the midst of the Divine glory—the "Shekinah"—announced to the sorely alarmed shepherds the birth of a "Saviour who was Christ the Lord" at Bethlehem; then a whole chorus of the heavenly host broke in with the refrain, "Glory to God in the highest, and on earth peace among men in whom He is well pleased" (literally, "men of good pleasure")—since, the Christmas hymn of the generations (<a onClick="return mV(\'Luk\',2,\'1-14\');">Lu 2:1-14</a>). The shepherds, guided as to how to recognize the babe (<a onClick="return mV(\'Luk\',2,12);">Lu 2:12</a>), went at once, and found it to be ever, as they had been told. Thence they hastened to spread abroad the tidings—the first believers, the first worshippers, the first preachers (<a onClick="return mV(\'Luk\',2,\'15-20\');">Lu 2:15-20</a>). Mary cherished the sayings in the stillness of her heart.<P>(2) The Circumcision and Presentation in the Temple.<P>Jewish law required that on the 8th day the male child should be circumcised, and on the same day He received His name (compare <a onClick="return mV(\'Luk\',1,\'59-63\');">Lu 1:59-63</a>). Jesus, though entirely pure, underwent the rite which denoted the putting off of fleshly sin (<a onClick="return mV(\'Col\',2,11);">Col 2:11</a>), and became bound, as a true Israelite, to render obedience to every Divine commandment. The name "Jesus" was then given Him (<a onClick="return mV(\'Luk\',2,21);">Lu 2:21</a>). On the 40th day came the ceremony of presentation in the temple at Jerusalem, when Mary had to offer for her purifying (<a onClick="return mV(\'Lev\',12,\'1-\');">Le 12</a>; Mary\'s was the humbler offering of the poor, "a pair of turtle-doves, or two young pigeons" (<a onClick="return mV(\'Lev\',12,8);">Le 12:8</a>; <a onClick="return mV(\'Luk\',2,24);">Lu 2:24</a>)), and when the first-born son had to be redeemed with 5 shekels of the sanctuary (<a onClick="return mV(\'Num\',18,15,16);">Nu 18:15,16</a>; about $3.60 (in 1915)). The observance was an additional token that Christ—personally sinless—did not shrink from full identification with our race in the responsibilities of its sinful condition. Ere it was completed, however, the ceremony was lifted to a Diviner level, and a new attestation was given of the dignity of the child of Mary, by the action and inspired utterances of the holy Simeon and the aged prophetess Anna. To Simeon, a righteous and devout man, "looking for the consolation of Israel," it had been revealed that he should not die till he had seen the Lord\'s Christ, and, led by the Spirit into the temple at the very time when Jesus was being presented, he recognized in Him the One for whom he had waited, and, taking Him in his arms, gave utterance to the beautiful words of the Nunc Dimittis—"Now lettest thou thy servant depart, Lord," etc. (<a onClick="return mV(\'Luk\',2,\'25-32\');">Lu 2:25-32</a>). He told also how this child was set for the falling and rising of many in Israel, and how, through Him, a sword should pierce through Mary\'s own soul (<a onClick="return mV(\'Luk\',2,34,35);">Lu 2:34,35</a>). Entering at the same hour, the prophetess Anna—now in extreme old age (over 100; a constant frequenter of the temple, <a onClick="return mV(\'Luk\',2,37);">Lu 2:37</a>—confirmed his words, and spoke of Him to all who, like herself, looked "for the redemption of Jerusalem."<P>(3) Visit of the Magi.<P>It seems to have been after the presentation in the temple that the incident took place recorded by Matthew of the visit of the Magi. The Magi, a learned class belonging originally to Chaldea or Persia (see <a href="./study/isbe/search.html?string=MAGI">MAGI</a>), had, in course of time, greatly degenerated (compare Simon Magus, <a onClick="return mV(\'Act\',8,9);">Ac 8:9</a>), but those who now came to seek Christ from the distant East were of a nobler order. They appeared in Jerusalem inquiring, "Where is He that is born King of the Jews?" and declaring that they had seen His star in the East, and had come to worship Him (<a onClick="return mV(\'Mat\',2,2);">Mt 2:2</a>). Observers of the nightly sky, any significant appearance in the heavens would at once attract their attention. Many (Kepler, Ideler, etc.; compare Ramsay, op. cit., 215ff) are disposed to connect this "star" with a remarkable conjunction—or series of conjunctions—of planets in 7-6 BC, in which case it is possible that two years may have elapsed (compare the inquiry of Herod and his subsequent action, <a onClick="return mV(\'Mat\',2,7,16);">Mt 2:7,16</a>) from their observation of the sign. On the other hand, the fact of the star reappearing and seeming to stand over a house in Bethlehem (<a onClick="return mV(\'Mat\',2,9);">Mt 2:9</a>) rather points to a distinct phenomenon (compare <a href="./study/isbe/search.html?string=BETHLEHEM,+STAR+OF">BETHLEHEM, STAR OF</a>). The inquiry of the Magi at once awakened Herod\'s alarm; accordingly, having ascertained from the scribes that the Christ should be born at Bethlehem (<a onClick="return mV(\'Mic\',5,2);">Mic 5:2</a>), he summoned the Magi, questioned them as to when exactly the star appeared, then sent them to Bethlehem to search out the young child, hypocritically pretending that he also wished to worship Him (<a onClick="return mV(\'Mat\',2,7,8);">Mt 2:7,8</a>). Herod had faith enough to believe the Scriptures, yet was foolish enough to think that he could thwart God\'s purpose. Guided by the star, which anew appeared, the wise men came to Bethlehem, offered their gifts, and afterward, warned by God, returned by another road, without reporting to Herod. It is a striking picture—Herod the king, and Christ the King; Christ a power even in His cradle, inspiring terror, attracting homage! The faith of these sages, unrepelled by the lowly surroundings of the child they had discovered, worshipping, and laying at His feet their gold, frankincense and myrrh, is a splendid anticipation of the victories Christ was yet to win among the wisest as well as the humblest of our race. Herod, finding himself, as he thought, befooled by the Magi, avenged himself by ordering a massacre of all the male children of two years old, and under, in Bethlehem and its neighborhood (<a onClick="return mV(\'Mat\',2,\'16-19\');">Mt 2:16-19</a>). This slaughter, if not recorded elsewhere (compare however, Macrobius, quoted by Ramsay, op. cit., 219), is entirely in keeping with the cruelty of Herod\'s disposition. Meanwhile, Joseph and Mary had been withdrawn from the scene of danger (<a onClick="return mV(\'Mat\',2,17);">Mt 2:17</a> connects the mourning of the Bethlehem mothers with Rachel\'s weeping, <a onClick="return mV(\'Jer\',31,15);">Jer 31:15</a>).<P>6. Flight to Egypt and Return to Nazareth:<P>(<a onClick="return mV(\'Mat\',2,\'13-15\');">Matthew 2:13-15</a>,<a onClick="return mV(\'Mat\',2,\'19-23\');">19-23</a>)<P>The safety of Mary and her threatened child was provided for by a Divine warning to retire for a time to Egypt (mark the recurring expression, "the young child and his mother"—the young child taking the lead, <a onClick="return mV(\'Mat\',2,11,13,14,20,21);">Mt 2:11,13,14,20,21</a>), whither, accordingly, they were conducted by Joseph (<a onClick="return mV(\'Mat\',2,14);">Mt 2:14</a>). The sojourn was not a long one. Herod\'s death brought permission to return, but as Archelaus, Herod\'s son (the worst of them), reigned in Judea in his father\'s stead (not king, but "ethnarch"), Joseph was directed to withdraw to Galilee; hence it came about that he and Mary, with the babe, found themselves again in Nazareth, where Luke anew takes up the story (<a onClick="return mV(\'Luk\',2,39);">Lu 2:39</a>), the thread of which had been broken by the incidents in Matthew. Matthew sees in the return from Egypt a refulfilling of the experiences of Israel (<a onClick="return mV(\'Hsa\',11,1);">Ho 11:1</a>), and in the settling in Nazareth a connection with the Old Testament prophecies of Christ\'s lowly estate (<a onClick="return mV(\'Isa\',11,1);">Isa 11:1</a>, netser, "branch"; <a onClick="return mV(\'Zec\',3,8);">Zec 3:8</a>; <a onClick="return mV(\'Zec\',6,12);">6:12</a>, etc.).<P>7. Questions and Objections:<P>The objections to the credibility of the narratives of the Virgin Birth have already partly been adverted to. (See further the articles on <a href="./study/isbe/search.html?string=MARY">MARY</a>; <a href="./study/isbe/search.html?string=VIRGIN+BIRTH">VIRGIN BIRTH</a>; and the writer\'s volume, The Virgin Birth of Christ.)<P>(1) The Virgin Birth.<P>The narratives in Matthew and Luke are attested by all manuscripts and versions genuine parts of their respective Gospels, and as coming to us in their integrity. The narrative of Luke is generally recognized as resting on an Aramaic basis, which, from its diction and the primitive character of its conceptions, belongs to the earliest age. While in Luke\'s narrative everything is presented from the standpoint of Mary, in Matthew it is Joseph who is in the forefront, suggesting that the virgin mother is the source of information in the one case, and Joseph himself in the other. The narratives are complementary, not contradictory. That Mark and John do not contain narratives of the Virgin Birth cannot be wondered at, when it is remembered that Mark\'s Gospel begins of purpose with the Baptism of John, and that the Fourth Gospel aims at setting forth the Divine descent, not the circumstances of the earthly nativity. "The Word became flesh" (<a onClick="return mV(\'Jhn\',1,14);">Joh 1:14</a>)—everything is already implied in that. Neither can it be objected to that Paul does not in his letters or public preaching base upon so essentially private a fact as the miraculous conception—at a time, too, when Mary probably still lived. With the exception of the narrowest sect of the Jewish Ebionites and some of the Gnostic sects, the Virgin Birth was universally accepted in the early church.<P>(2) The Genealogies<P>(<a onClick="return mV(\'Mat\',1,\'1-17\');">Matthew 1:1-17</a>; <a onClick="return mV(\'Luk\',3,\'23-28\');">Luke 3:23-28</a>)<P>Difficulty is felt with the genealogies in Matthew and Luke (one descending, the other ascending), which, while both professing to trace the descent of Jesus from David and Abraham (Luke from Adam), yet go entirely apart in the pedigree after David. See on this the article <a href="./study/isbe/search.html?string=GENEALOGY+OF+JESUS+CHRIST">GENEALOGY OF JESUS CHRIST</a>. A favorite view is that Matthew exhibits the legal, Luke the natural descent of Jesus. There is plausibility in the supposition that though, in form, a genealogy of Joseph, Luke\'s is really the genealogy of Mary. It was not customary, it is true, to make out pedigrees of females, but the case here was clearly exceptional, and the passing of Joseph into the family of his father-in-law Heli would enable the list to be made out in his name. Celsus, in the 2nd century, appears thus to have understood it when he derides the notion that through so lowly a woman as the carpenter\'s wife, Jesus should trace His lineage up to the first man (Origen, Contra Celsus, ii. 32; Origen\'s reply proceeds on the same assumption. Compare article on "Genealogies" in Kitto, II).<P>II. The Years of Silence—the Twelfth Year.<P>1. The Human Development:<P>(<a onClick="return mV(\'Luk\',2,40,52);">Luke 2:40,52</a>)<P>With the exception of one fragment of incident—that of the visit to Jerusalem and the Temple in His 12th year—the Canonical Gospels are silent as to the history of Jesus from the return to Nazareth till His baptism by John. This long period, which the Apocryphal Gospels crowd with silly fables (see <a href="./study/isbe/search.html?string=APOCRYPHAL+GOSPELS">APOCRYPHAL GOSPELS</a>), the inspired records leave to be regarded as being what it was—a period of quiet development of mind and body, of outward uneventfulness, of silent garnering of experience in the midst of the Nazareth surroundings. Jesus "grew, and waxed strong, filled with wisdom; and the grace of God was upon him...advanced in wisdom and stature, and in favor with God and men" (<a onClick="return mV(\'Luk\',2,40,52);">Lu 2:40,52</a>). The incarnation was a true acceptance of humanity, with all its sinless limitations of growth and development. Not a hint is offered of that omniscience or omnipotence which theology has not infrequently imputed to Jesus even as child and boy. His schooling was probably that of the ordinary village child (He could read, <a onClick="return mV(\'Luk\',4,17);">Lu 4:17</a>ff, and write, <a onClick="return mV(\'Jhn\',8,\'6-8\');">Joh 8:6-8</a>); He wrought at the carpenter\'s bench (compare <a onClick="return mV(\'Mar\',6,3);">Mr 6:3</a>; Justin Martyr, following tradition, speaks of Him as making "plows and yokes," Dial., 88). His gentleness and grace of character endeared Him to all who knew Him (<a onClick="return mV(\'Luk\',2,52);">Lu 2:52</a>). No stain of sin clouded His vision of Divine things. His after-history shows that His mind was nourished on the Scriptures; nor, as He pondered psalms and prophets, could His soul remain unvisited by presentiments, growing to convictions, that He was the One in whom their predictions were destined to be realized.<P>2. Jesus in the Temple:<P>(<a onClick="return mV(\'Luk\',2,\'41-50\');">Luke 2:41-50</a>)<P>Every year, as was the custom of the Jews, Joseph and Mary went, with their friends and neighbors, in companies, to Jerusalem to the Passover. When Jesus was 12 years old, it would seem that, for the first time, He was permitted to accompany them. It would be to Him a strange and thrilling experience. Everything He saw—the hallowed sites, the motley crowd, the service of the temple, the very shocks His moral consciousness would receive from contact with abounding scandals—would intensify His feeling of His own unique relation to the Father. Every relationship was for the time suspended and merged to His thought in this higher one. It was His Father\'s city whose streets He trod; His Father\'s house He visited for prayer; His Father\'s ordinance the crowds were assembled to observe; His Father\'s name, too, they were dishonoring by their formalism and hypocrisy. It is this exalted mood of the boy Jesus which explains the scene that follows—the only one rescued from oblivion in this interval of growth and preparation. When the time came for the busy caravan to return to Nazareth, Jesus, acting, doubtless, from highest impulse, "tarried behind" (verse <a onClick="return mV(\'Luk\',2,43);">43</a>). In the large company His absence was not at first missed, but when, at the evening halting-place, it became known that He was not with them, His mother and Joseph returned in deep distress to Jerusalem. Three days elapsed before they found Him in the place where naturally they should have looked first—His Father\'s house. There, in one of the halls or chambers where the rabbis were wont to teach, they discovered Him seated "in the midst," at the feet of the men of learning, hearing them discourse, asking questions, as pupils were permitted to do, and giving answers which awakened astonishment by their penetration and wisdom (<a onClick="return mV(\'Luk\',2,46,47);">Lu 2:46,47</a>). Those who heard Him may well have thought that before them was one of the great rabbis of the future! Mary, much surprised, asked in remonstrance, "Son, why hast thou thus dealt with us?" evoking from Jesus the memorable reply, "How is it that ye sought me? knew ye not that I must be in my Father\'s house?" or "about my Father\'s business?" the King James Version (<a onClick="return mV(\'Luk\',2,48,49);">Lu 2:48,49</a>). Here was the revelation of a selfconsciousness that Mary might have been prepared for in Jesus, but perhaps, in the common intercourse of life, was tending to lose sight of. The lesson was not unneeded. Yet, once it had been given, Jesus went back with Joseph and Mary to Nazareth, and "was subject unto them"; and Mary did not forget the teaching of the incident (<a onClick="return mV(\'Luk\',2,51);">Lu 2:51</a>).<P>III. The Forerunner and the Baptism.<P>1. The Preaching of John:<P>(<a onClick="return mV(\'Mat\',3,\'1-12\');">Matthew 3:1-12</a>; <a onClick="return mV(\'Mar\',1,\'1-8\');">Mark 1:1-8</a>; <a onClick="return mV(\'Luk\',3,\'1-18\');">Luke 3:1-18</a>)<P>Time passed, and when Jesus was nearing His 30th year, Judea was agitated by the message of a stern preacher of righteousness who had appeared in the wilderness by the Jordan, proclaiming the imminent approach of the kingdom of heaven, summoning to repentance, and baptizing those who confessed their sins. Tiberius had succeeded Augustus on the imperial throne; Judea, with Samaria, was now a Roman province, under the procurator Pontius Pilate; the rest of Palestine was divided between the tetrarchs Herod (Galilee) and Philip (the eastern parts). The Baptist thus appeared at the time when the land had lost the last vestige of self-government, was politically divided, and was in great ecclesiastical confusion. Nurtured in the deserts (<a onClick="return mV(\'Luk\',1,80);">Lu 1:80</a>), John\'s very appearance was a protest against the luxury and self-seeking of the age. He had been a Nazarite from his birth; he fed on the simplest products of nature—locusts and wild honey; his coarse garb of camel\'s hair and leathern girdle was a return to the dress of Elijah (<a onClick="return mV(\'2Ki\',1,8);">2Ki 1:8</a>), in whose spirit and power he appeared (<a onClick="return mV(\'Luk\',1,17);">Lu 1:17</a>) (see <a href="./study/isbe/search.html?string=JOHN+THE+BAPTIST">JOHN THE BAPTIST</a>).<P>The Coming Christ.<P>John\'s preaching of the kingdom was unlike that of any of the revolutionaries of his age. It was a kingdom which could be entered only through moral preparation. It availed nothing for the Jew simply that he was a son of Abraham. The Messiah was at hand. He (John) was but a voice in the wilderness sent to prepare the way for that Greater than himself. The work of the Christ would be one of judgment and of mercy. He would lay the axe at the root of the tree—would winnow the chaff from the wheat—yet would baptize with the Holy Spirit (<a onClick="return mV(\'Mat\',3,\'10-12\');">Mt 3:10-12</a>; <a onClick="return mV(\'Luk\',3,\'15-17\');">Lu 3:15-17</a>). Those who professed acceptance of his message, with its condition of repentance, John baptized with water at the Jordan or in its neighborhood (compare <a onClick="return mV(\'Mat\',3,6);">Mt 3:6</a>; <a onClick="return mV(\'Jhn\',1,28);">Joh 1:28</a>; <a onClick="return mV(\'Jhn\',3,23);">3:23</a>).<P>2. Jesus Is Baptized:<P>(<a onClick="return mV(\'Mat\',3,\'13-17\');">Matthew 3:13-17</a>; <a onClick="return mV(\'Mar\',1,\'9-11\');">Mark 1:9-11</a>; <a onClick="return mV(\'Luk\',3,21,22);">Luke 3:21,22</a>)<P>John\'s startling words made a profound impression. All classes from every part of the land, including Pharisees and Sadducees (<a onClick="return mV(\'Mat\',3,7);">Mt 3:7</a>), came to his baptism. John was not deceived. He saw how little change of heart underlay it all. The Regenerator had not yet come. But one day there appeared before him One whom he intuitively recognized as different from all the rest—as, indeed, the Christ whose coming it was his to herald. John, up to this time, does not seem to have personally known Jesus (compare <a onClick="return mV(\'Jhn\',1,31);">Joh 1:31</a>). He must, however, have heard of Him; he had, besides, received a sign by which the Messiah should be recognized (<a onClick="return mV(\'Jhn\',1,33);">Joh 1:33</a>); and now, when Jesus presented Himself, Divinely pure in aspect, asking baptism at his hands, the conviction was instantaneously flashed on his mind, that this was He. But how should he, a sinful man, baptize this Holy One? "I have need to be baptized of thee, and comest thou to me?" (<a onClick="return mV(\'Mat\',3,14);">Mt 3:14</a>). The question is one which forces itself upon ourselves—How should Jesus seek or receive a "baptism of repentance"? Jesus Himself puts it on the ground of meetness. "Suffer it now: for thus it becometh us to fulfill all righteousness" (<a onClick="return mV(\'Mat\',3,15);">Mt 3:15</a>). The Head was content to enter by the same gateway as the members to His specific vocation in the service of the kingdom. In submitting to the baptism, He formally identified Himself with the expectation of the kingdom and with its ethical demands; separated Himself from the evil of His nation, doubtless with confession of its sins; and devoted Himself to His life-task in bringing in the Messianic salvation. The significance of the rite as marking His consecration to, and entrance upon, His Messianic career, is seen in what follows. As He ascended from the water, while still "praying" (<a onClick="return mV(\'Luk\',3,21);">Lu 3:21</a>), the heavens were opened, the Spirit of God descended like a dove upon Him, and a voice from heaven declared: "This is my beloved Son, in whom I am well pleased" (<a onClick="return mV(\'Mat\',3,16,17);">Mt 3:16,17</a>). It is needless to inquire whether anyone besides John (compare <a onClick="return mV(\'Jhn\',1,33);">Joh 1:33</a>) and Jesus (<a onClick="return mV(\'Mat\',3,16);">Mt 3:16</a>; <a onClick="return mV(\'Mar\',1,10);">Mr 1:10</a>) received this vision or heard these words; it was for them, not for others, the vision was primarily intended. To Christ\'s consecration of Himself to His calling, there was now added the spiritual equipment necessary for the doing of His work. He went forward with the seal of the Father\'s acknowledgment upon Him.<P>IV. The Temptation.<P>1. Temptation Follows Baptism:<P>(<a onClick="return mV(\'Mat\',4,\'1-11\');">Matthew 4:1-11</a>; <a onClick="return mV(\'Mar\',1,13,14);">Mark 1:13,14</a>; <a onClick="return mV(\'Luk\',4,\'1-13\');">Luke 4:1-13</a>)<P>On the narrative of the baptism in the first three Gospels there follows at once the account of the temptation of Jesus in the wilderness. The psychological naturalness of the incident is generally acknowledged. The baptism of Jesus was a crisis in His experience. He had been plenished by the Spirit for His work; the heavens had been opened to Him, and His mind was agitated by new thoughts and emotions; He was conscious of the possession of new powers. There was need for a period of retirement, of still reflection, of coming to a complete understanding with Himself as to the meaning of the task to which He stood committed, the methods He should employ, the attitude He should take up toward popular hopes and expectations. He would wish to be alone. The Spirit of God led Him (<a onClick="return mV(\'Mat\',4,1);">Mt 4:1</a>; <a onClick="return mV(\'Mar\',1,12);">Mr 1:12</a>; <a onClick="return mV(\'Luk\',4,1);">Lu 4:1</a>) whither His own spirit also impelled. It is with a touch of similar motive that Buddhist legend makes Buddha to be tempted by the evil spirit Mara after he has attained enlightenment.<P>2. Nature of the Temptation:<P>The scene of the temptation was the wilderness of Judea. Jesus was there 40 days, during which, it is told, He neither ate nor drank (compare the fasts of Moses and Elijah, <a onClick="return mV(\'Exd\',24,18);">Ex 24:18</a>; <a onClick="return mV(\'Exd\',34,28);">34:28</a>; <a onClick="return mV(\'Deu\',9,18);">De 9:18</a>; <a onClick="return mV(\'1Ki\',19,8);">1Ki 19:8</a>). Mark adds, "He was with the wild beasts" (verse <a onClick="return mV(\'Mar\',1,13);">13</a>). The period was probably one of intense self-concentration. During the whole of it He endured temptations of Satan (<a onClick="return mV(\'Mar\',1,13);">Mr 1:13</a>); but the special assaults came at the end (<a onClick="return mV(\'Mat\',4,2);">Mt 4:2</a>ff; <a onClick="return mV(\'Luk\',4,2);">Lu 4:2</a>). We assume here a real tempter and real temptations—the question of diabolic agency being considered after. This, however, does not settle the form of the temptations. The struggle was probably an inward one. It can hardly be supposed that Jesus was literally transported by the devil to a pinnacle of the temple, then to a high mountain, then, presumably, back again to the wilderness. The narrative must have come from Jesus Himself, and embodies an ideal or parabolic element. "The history of the temptation," Lange says, "Jesus afterwards communicated to His disciples in the form of a real narrative, clothed in symbolical language" (Commentary on Matthew, 83, English translation).<P>3. Stages of the Temptation:<P>The stages of the temptation were three—each in its own way a trial of the spirit of obedience.<P>(1) The first temptation was to distrust. Jesus, after His long fast, was hungry. He had become conscious also of supernatural powers. The point on which the temptation laid hold was His sense of hunger—the most over-mastering of appetites. "If thou art the Son of God, command that these stones become bread." The design was to excite distrustful and rebellious thoughts, and lead Jesus to use the powers entrusted to Him in an unlawful way, for private and selfish ends. The temptation was promptly met by a quotation from Scripture: "Man shall not live by bread alone," etc. (<a onClick="return mV(\'Mat\',4,4);">Mt 4:4</a>; <a onClick="return mV(\'Luk\',4,4);">Lu 4:4</a>; compare <a onClick="return mV(\'Deu\',8,3);">De 8:3</a>). If Jesus was in this position, it was His Father who had brought Him there for purposes of trial. Man has a higher life than can be sustained on bread; a life, found in depending on God\'s word, and obeying it at whatever cost.<P>(2) The second temptation (in Luke the third) was to presumption. Jesus is borne in spirit (compare <a onClick="return mV(\'Eze\',40,1,2);">Eze 40:1,2</a>) to a pinnacle of the temple. From this dizzy elevation He is invited to cast Himself down, relying on the Divine promise: "He shall give His angels charge over thee," etc. (compare <a onClick="return mV(\'Psa\',91,11,12);">Ps 91:11,12</a>). In this way an easy demonstration of His Messiahship would be given to the crowds below. The temptation was to overstep those bounds of humility and dependence which were imposed on Him as Son; to play with signs and wonders in His work as Messiah. But again the tempter is foiled by the word: "Thou shalt not make trial of (try experiments with, propose tests, put to the proof) the Lord thy God" (<a onClick="return mV(\'Mat\',4,7);">Mt 4:7</a>; <a onClick="return mV(\'Luk\',4,12);">Lu 4:12</a>; compare <a onClick="return mV(\'Deu\',6,16);">De 6:16</a>).<P>(3) The third temptation (Luke\'s second) was to worldly sovereignty, gained by some small concession to Satan. From some lofty elevation—no place on a geographical map—the kingdoms of the world and the glory of them are flashed before Christ\'s mind, and all are offered to Him on condition of one little act of homage to the tempter. It was the temptation to choose the easier path by some slight pandering to falsehood, and Jesus definitely repelled it by the saying: "Thou shalt worship the Lord thy God, and him only shalt thou serve" (<a onClick="return mV(\'Mat\',4,10);">Mt 4:10</a>; <a onClick="return mV(\'Luk\',4,8);">Lu 4:8</a>). Jesus had chosen His path. The Father\'s way of the cross would be adhered to.<P>Its Typical Character.<P>The stages of the temptation typify the whole round of Satanic assault on man through body, mind, and spirit (<a onClick="return mV(\'Luk\',4,13);">Lu 4:13</a>; compare <a onClick="return mV(\'1Jo\',2,16);">1Joh 2:16</a>), and the whole round of Messianic temptation. Jesus was constantly being tempted<P class="in15">(a) to spare Himself;<P class="in15">(b) to gratify the Jewish signseekers;<P class="in15">(c) to gain power by sacrifice of the right.<P>In principle the victory was gained over all at the commencement. His way was henceforth clear.``132';
isbe[5020]='Jesus Christ, 4B`B. THE EARLY JUDAEAN MINISTRY<P>I. The Testimonies of the Baptist.<P>1. The Synoptics and John:<P>While the Synoptics pass immediately from the temptation of Jesus to the ministry in Galilee the imprisonment of the Baptist (<a onClick="return mV(\'Mat\',4,12);">Mt 4:12</a>; <a onClick="return mV(\'Mar\',1,14,15);">Mr 1:14,15</a>; <a onClick="return mV(\'Luk\',4,14);">Lu 4:14</a>), the Fourth Gospel furnishes the account, full of interest, of the earlier ministry of Jesus in Judea while the Baptist was still at liberty.<P>2. Threefold Witness of the Baptist:<P>(<a onClick="return mV(\'Jhn\',1,\'19-37\');">John 1:19-37</a>)<P>The Baptist had announced Christ\'s coming; had baptized Him when He appeared; it was now his privilege to testify to Him as having come, and to introduce to Jesus His first disciples.<P>a) First Testimony—Jesus and Popular Messianic Expectation:<P>(<a onClick="return mV(\'Jhn\',1,\'19-28\');">John 1:19-28</a>)<P>John\'s work had assumed proportions which made it impossible for the ecclesiastical authorities any longer to ignore it (compare <a onClick="return mV(\'Luk\',3,15);">Lu 3:15</a>). A deputation consisting of priests and Levites was accordingly sent to John, where he was baptizing at Bethany beyond Jordan, to put to him categorical questions about his mission. Who was he? And by what authority did—he baptize? Was he the Christ? or Elijah? or the expected prophet? (compare <a onClick="return mV(\'Jhn\',6,14);">Joh 6:14</a>; <a onClick="return mV(\'Jhn\',7,4);">7:4</a>; <a onClick="return mV(\'Mat\',16,14);">Mt 16:14</a>). To these questions John gave distinct and straightforward replies. He was not the Christ, not Elijah, not the prophet. His answers grow briefer every time, "I am not the Christ"; "I am not"; "No." Who was he then? The answer was emphatic. He was but a "voice" (compare <a onClick="return mV(\'Isa\',40,3);">Isa 40:3</a>)—a preparer of the way of the Lord. In their midst already stood One—not necessarily in the crowd at that moment—with whose greatness his was not to be compared (<a onClick="return mV(\'Jhn\',1,26,27);">Joh 1:26,27</a>). John utterly effaces himself before Christ.<P>b) Second Testimony—Christ and the Sin of the World:<P>(<a onClick="return mV(\'Jhn\',1,\'29-34\');">John 1:29-34</a>)<P>The day after the interview with the Jerusalem deputies, John saw Jesus coming to him—probably fresh from the temptation—and bore a second and wonderful testimony to His Messiahship. Identifying Jesus with the subject of his former testimonies, and stating the ground of his knowledge in the sign God had given him (<a onClick="return mV(\'Jhn\',1,\'30-34\');">1:30-34</a>), he said, "Behold, the Lamb of God, that taketh away the sin of the world" (<a onClick="return mV(\'Jhn\',1,29);">1:29</a>). The words are rich in suggestion regarding the character of Jesus, and the nature, universality and efficacy of His work (compare <a onClick="return mV(\'1Jo\',3,5);">1Joh 3:5</a>). The "Lamb" may point specifically to the description of the vicariously Suffering Servant of Yahweh in <a onClick="return mV(\'Isa\',53,11);">Isa 53:11</a>.<P>c) Third Testimony—Christ and the Duty of the Disciple:<P>(<a onClick="return mV(\'Jhn\',1,\'35-37\');">John 1:35-37</a>)<P>The third testimony was borne "again on the morrow," when John was standing with two of his disciples (one Andrew, <a onClick="return mV(\'Jhn\',1,40);">1:40</a>, the other doubtless the evangelist himself). Pointing to Jesus, the Baptist repeated his former words, "Behold, the Lamb of God." While the words are the same, the design was different. In the first "behold" the idea is the recognition of Christ; in the second there is a call to duty—a hint to follow Jesus. On this hint the disciples immediately acted (<a onClick="return mV(\'Jhn\',1,37);">1:37</a>). It is next to be seen how this earliest "following" of Jesus grew.<P>II. The First Disciples.<P>1. Spiritual Accretion:<P>(<a onClick="return mV(\'Jhn\',1,\'37-51\');">John 1:37-51</a>)<P>John\'s narrative shows that Jesus gathered His disciples, less by a series of distinct calls, than by a process of spiritual accretion. Men were led to Him, then accepted by Him. This process of selection left Jesus at the close of the second day with five real and true followers. The history confutes the idea that it was first toward the close of His ministry that Jesus became known to His disciples as the Messiah. In all the Gospels it was as the Christ that the Baptist introduced Jesus; it was as the Christ that the first disciples accepted and confessed Him (<a onClick="return mV(\'Jhn\',1,41,45,49);">Joh 1:41,45,49</a>).<P>a) Andrew and John—Discipleship as the Fruit of Spiritual Converse:<P>(<a onClick="return mV(\'Jhn\',1,\'37-40\');">John 1:37-40</a>)<P>The first of the group were Andrew and John—the unnamed disciple of <a onClick="return mV(\'Jhn\',1,40);">Joh 1:40</a>. These followed Jesus in consequence of their Master\'s testimony. It was, however, the few hours\' converse they had with Jesus in His own abode that actually decided them. To Christ\'s question, "What seek ye?" their answer was practically "Thyself." "The mention of the time—the 10th hour, i.e. 10 AM—is one of the small traits that mark John. He is here looking back on the date of his own spiritual birth" (Westcott).<P>b) Simon Peter—Discipleship a Result of Personal Testimony:<P>(<a onClick="return mV(\'Jhn\',1,41,42);">John 1:41,42</a>)<P>John and Andrew had no sooner found Christ for themselves ("We have found the Messiah," <a onClick="return mV(\'Jhn\',1,41);">Joh 1:41</a>) than they hastened to tell others of their discovery. Andrew at once sought out Simon, his brother, and brought him to Jesus; so, later, Philip sought Nathanael (<a onClick="return mV(\'Jhn\',1,45);">Joh 1:45</a>). Christ\'s unerring eye read at once the quality of the man whom Andrew introduced to Him. "Thou art Simon the son of John: thou shalt be called Cephas"—"Rock" or "Stone" (<a onClick="return mV(\'Jhn\',1,42);">1:42</a>). <a onClick="return mV(\'Mat\',16,18);">Mt 16:18</a>, therefore, is not the original bestowal of this name, but the confirmation of it. The name is the equivalent of "Peter" (Petros), and was given to Simon, not with any official connotation, but because of the strength and clearness of his convictions. His general steadfastness is not disproved by His one unhappy failure. (Was it thus the apostle acquired the name "Peter"?)<P>c) Philip—the Result of Scriptural Evidence:<P>(<a onClick="return mV(\'Jhn\',1,43,44);">John 1:43,44</a>)<P>The fourth disciple, Philip, was called by Jesus Himself, when about to depart for Galilee (<a onClick="return mV(\'Jhn\',1,43);">Joh 1:43</a>). Friendship may have had its influence on Philip (like the foregoing, he also was from Bethsaida of Galilee, <a onClick="return mV(\'Jhn\',1,44);">Joh 1:44</a>), but that which chiefly decided him was the correspondence of what he found in Jesus with the prophetic testimonies (<a onClick="return mV(\'Jhn\',1,45);">Joh 1:45</a>).<P>d) Nathanael—Discipleship an Effect of Heart-Searching Power:<P>(<a onClick="return mV(\'Jhn\',1,\'45-51\');">John 1:45-51</a>)<P>Philip sought Nathanael (of Cana of Galilee, <a onClick="return mV(\'Jhn\',21,2);">Joh 21:2</a>)—the same probably as Bartholomew the Apostle—and told him he had found Him of whom Moses in the law and the prophets had written (<a onClick="return mV(\'Jhn\',1,45);">Joh 1:45</a>). Nathanael doubted, on the ground that the Messiah was not likely to have His origin in an obscure place like Nazareth (<a onClick="return mV(\'Jhn\',1,46);">Joh 1:46</a>; compare <a onClick="return mV(\'Jhn\',7,52);">Joh 7:52</a>). Philip\'s wise answer was, "Come and see"; and when Nathanael came, the Lord met him with a word which speedily rid him of his hesitations. First, Jesus attested His seeker\'s sincerity ("Behold, an Israelite indeed," etc., <a onClick="return mV(\'Jhn\',1,47);">Joh 1:47</a>); then, on Nathanael expressing surprise, revealed to him His knowledge of a recent secret act of meditation or devotion ("when thou wast under the fig tree," etc., <a onClick="return mV(\'Jhn\',1,48);">Joh 1:48</a>). The sign was sufficient to convince Nathanael that he was in the presence of a superhuman, nay a Divine, Being, therefore, the Christ—"Son of God...King of Israel" (<a onClick="return mV(\'Jhn\',1,49);">Joh 1:49</a>). Jesus met his faith with further self-disclosure. Nathanael had believed on comparatively slight evidence; he would see greater things: heavens opened, and the angels of God ascending and descending upon the Son of Man (<a onClick="return mV(\'Jhn\',1,51);">Joh 1:51</a>). The allusion is to Jacob\'s vision (<a onClick="return mV(\'Gen\',28,\'10-22\');">Ge 28:10-22</a>)—a Scripture which had possibly been theme of Philip\'s meditation in his privacy. Jesus puts Himself in place of that mystic ladder as the medium of reopened communication between heaven and earth.<P>2. "Son of Man" and "Son of God":<P>The name "Son of Man"—a favorite designation of Jesus for Himself—appears here for the first time in the Gospels. It is disputed whether it was a current Messianic title (see <a href="./study/isbe/search.html?string=SON+OF+MAN">SON OF MAN</a>), but at least it had this force on the lips of Jesus Himself, denoting Him as the possessor of a true humanity, and as standing in a representative relation to mankind universally. It is probably borrowed from <a onClick="return mV(\'Dan\',7,13);">Da 7:13</a> and appears in the Book of Enoch (see <a href="./study/isbe/search.html?string=APOCALYPTIC+LITERATURE">APOCALYPTIC LITERATURE</a>). The higher title, "Son of God," given to Jesus by Nathanael, could not, of course, as yet carry with it the transcendental associations of John\'s Prologue (<a onClick="return mV(\'Jhn\',1,1,14,18);">Joh 1:1,14,18</a>), but it evidently conveyed an idea of superhuman dignity and unique relation to God, such as the better class of minds would seem to have attributed to the Messiah (compare <a onClick="return mV(\'Jhn\',5,18);">Joh 5:18</a>; <a onClick="return mV(\'Jhn\',10,33);">10:33</a>ff; <a onClick="return mV(\'Mat\',26,63);">Mt 26:63</a>).<P>III. The First Events.<P>An interval of a few weeks is occupied by a visit of Jesus to Cana of Galilee (<a onClick="return mV(\'Jhn\',2,1);">Joh 2:1</a>) and a brief sojourn in Capernaum (<a onClick="return mV(\'Jhn\',2,12);">Joh 2:12</a>); after which Jesus returned to Jerusalem to the Passover as the most appropriate place for His public manifestation of Himself as Messiah (<a onClick="return mV(\'Jhn\',2,13);">Joh 2:13</a>). The notes of time in John suggest that the Passover (beginning of April, 27 AD) took place about three months after the baptism by John (compare <a onClick="return mV(\'Jhn\',1,43);">1:43</A>; <a onClick="return mV(\'Jhn\',2,1,12);">2:1,12</A>).<P>1. The First Miracle:<P>(<a onClick="return mV(\'Jhn\',2,\'1-11\');">Joh 2:1-11</a>)<P>Prior to His public manifestation, a more private unfolding of Christ\'s glory was granted to the disciples at the marriage feast of Cana of Galilee (compare <a onClick="return mV(\'Jhn\',2,11);">Joh 2:11</a>). The marriage was doubtless that of some relative of the family, and the presence of Jesus at the feast, with His mother, brethren and disciples (as Joseph no more appears, it may be concluded that he was dead), is significant as showing that His religion is not one of antagonism to natural relations. The marriage festivities lasted seven days, and toward the close the wine provided for the guests gave out. Mary interposed with an indirect suggestion that Jesus might supply the want. Christ\'s reply, literally, "Woman, what is that to thee and to me?" (<a onClick="return mV(\'Jhn\',2,4);">Joh 2:4</a>), is not intended to convey the least tinge of reproof (compare Westcott, in the place cited.), but intimates to Mary that His actions were henceforth to be guided by a rule other than hers (compare <a onClick="return mV(\'Luk\',2,51);">Lu 2:51</a>). This, however, as Mary saw (<a onClick="return mV(\'Jhn\',2,5);">Joh 2:5</a>), did not preclude an answer to her desire. Six waterpots of stone stood near, and Jesus ordered these to be filled with water (the quantity was large; about 50 gallons); then when the water was drawn off it was found changed into a nobler element—a wine purer and better than could have been obtained from any natural vintage. The ruler of the feast, in ignorance of its origin, expressed surprise at its quality (<a onClick="return mV(\'Jhn\',2,10);">Joh 2:10</a>). The miracle was symbolical—a "sign" (<a onClick="return mV(\'Jhn\',2,11);">Joh 2:11</a>)—and may be contrasted with the first miracle of Moses—turning the water into blood (<a onClick="return mV(\'Exd\',7,20);">Ex 7:20</a>). It points to the contrast between the old dispensation and the new, and to the work of Christ as a transforming, enriching and glorifying of the natural, through Divine grace and power.<P>After a brief stay at Capernaum (<a onClick="return mV(\'Jhn\',2,12);">Joh 2:12</a>), Jesus went up to Jerusalem to keep the Passover. There it was His design formally to manifest Himself. Other "signs" He wrought at the feast, leading many to believe on Him—not, however, with a deep or enduring faith (<a onClick="return mV(\'Jhn\',2,\'23-25\');">Joh 2:23-25</a>)—but the special act by which He signalized His appearance was His public cleansing of the temple from the irreligious trafficking with which it had come to be associated.<P>2. The First Passover, and Cleansing of the Temple:<P>(<a onClick="return mV(\'Jhn\',2,\'13-25\');">John 2:13-25</a>)<P>A like incident is related by the Synoptics at the close of Christ\'s ministry (<a onClick="return mV(\'Mat\',21,12,13);">Mt 21:12,13</a>; <a onClick="return mV(\'Mar\',11,\'15-18\');">Mr 11:15-18</a>; <a onClick="return mV(\'Luk\',19,45,46);">Lu 19:45,46</a>), and it is a question whether the act was actually repeated, or whether the other evangelists, who do not narrate the events of the early ministry, simply record it out of its chronological order. In any case, the act was a fitting inauguration of the Lord\'s work. A regular market was held in the outer court of the temple. Here the animals needed for sacrifice could be purchased, foreign money exchanged, and the doves, which were the offerings of the poor, be obtained. It was a busy, tumultuous, noisy and unholy scene, and the "zeal" of Jesus burned within Him—had doubtless often done so before—as He witnessed it. Arming Himself with a scourge of cords, less as a weapon of offense, than as a symbol of authority, He descended with resistless energy upon the wrangling throng, drove out the dealers and the cattle, overthrew the tables of the moneychangers, and commanded the doves to be taken away. Let them not profane His Father\'s house (<a onClick="return mV(\'Jhn\',2,\'14-16\');">Joh 2:14-16</a>). No one seems to have opposed. All felt that a prophet was among them, and could not resist the overpowering authority with which He spake and acted. By and by, when their courage revived, they asked Him for a "sign" in evidence of His right to do such things. Jesus gave them no sign such as they demanded, but uttered an enigmatic word, and left them to reflect on it, "Destroy this temple, and in three days I will raise it up" (<a onClick="return mV(\'Jhn\',2,19);">Joh 2:19</a>). The authenticity of the saying is sufficiently vouched for by the perverted use made of it at Christ\'s trial (<a onClick="return mV(\'Mat\',26,61);">Mt 26:61</a> parallel). It is a word based on the foresight which Christ had that the conflict now commencing was to end in His rejection and death. "The true way to destroy the Temple, in the eyes of Jesus, was to slay the Messiah....If it is in the person of the Messiah that the Temple is laid in ruins, it is in His person it shall be raised again" (Godet). The disciples, after the resurrection, saw the meaning of the word (<a onClick="return mV(\'Jhn\',2,22);">Joh 2:22</a>).<P>3. The Visit of Nicodemus:<P>(<a onClick="return mV(\'Jhn\',3,\'1-12\');">John 3:1-12</a>)<P>As a sequel to these stirring events Jesus had a nocturnal visitor in the person of Nicodemus—a Pharisee, a ruler of the Jews, a "teacher of Israel" (<a onClick="return mV(\'Jhn\',3,10);">Joh 3:10</a>), apparently no longer young (<a onClick="return mV(\'Jhn\',3,4);">Joh 3:4</a>). His coming by night argues, besides some fear of man, a constitutional timidity of disposition (compare <a onClick="return mV(\'Jhn\',19,39);">Joh 19:39</a>); but the interesting thing is that he did come, showing that he had been really impressed by Christ\'s words and works. One recognizes in him a man of candor and uprightness of spirit, yet without adequate apprehensions of Christ Himself, and of the nature of Christ\'s kingdom. Jesus he was prepared to acknowledge as a Divinely-commissioned teacher—one whose mission was accredited by miracle (<a onClick="return mV(\'Jhn\',3,2);">Joh 3:2</a>). He was interested in the kingdom, but, as a morally living man, had no doubt of his fitness to enter into it. Jesus had but to teach and he would understand.<P>(1) The New Birth.<P>Jesus in His reply laid His finger at once on the defective point in His visitor\'s relation to Himself and to His kingdom: "Except one be born anew, he cannot see the kingdom of God" (<a onClick="return mV(\'Jhn\',3,3);">Joh 3:3</a>); "Except one be born of water and the Spirit, he cannot enter into the kingdom of God" (<a onClick="return mV(\'Jhn\',3,5);">Joh 3:5</a>). Nicodemus was staggered at this demand for a spiritual new birth. There is reason to believe that proselytes were baptized on being received into the Jewish church, and their baptism was called a "new birth." Nicodemus would therefore be familiar with the expression, but could not see that it had any applicability to him. Jesus teaches him, on the other hand, that he also needs a new birth, and this, not through water only, but through the Spirit. The change was mysterious, yet plainly manifest in its effects (<a onClick="return mV(\'Jhn\',3,7,8);">Joh 3:7,8</a>). If Nicodemus did not understand these "earthly things"—the evidence of which lay all around him—how should he understand "heavenly things," the things pertaining to salvation?<P>(2) "Heavenly Things."<P>These "heavenly things" Jesus now proceeds to unfold to Nicodemus: "As Moses lifted up the serpent," etc. (<a onClick="return mV(\'Jhn\',3,14);">Joh 3:14</a>). The "lifting up" is a prophecy of the cross (compare <a onClick="return mV(\'Jhn\',12,32,33,34);">12:32-34</A>). The brazen serpent is the symbol of sin conquered and destroyed by the death of Christ. What follows in <a onClick="return mV(\'Jhn\',3,\'16-21\');">Joh 3:16-21</a> is probably the evangelist\'s expansion of this theme—God\'s love the source of salvation (<a onClick="return mV(\'Jhn\',3,16);">Joh 3:16</a>), God\'s purpose not the world\'s condemnation, but its salvation (<a onClick="return mV(\'Jhn\',3,17,18);">Joh 3:17,18</a>) the self-judgment of sin (<a onClick="return mV(\'Jhn\',3,19);">Joh 3:19</a>).<P>4. Jesus and John:<P>(<a onClick="return mV(\'Jhn\',3,\'22-36\');">John 3:22-36</a>)<P>Retiring from Jerusalem, Jesus commenced a ministry in Judea (<a onClick="return mV(\'Jhn\',3,22);">Joh 3:22</a>). It lasted apparently about 6 months. The earlier Gospels pass over it. This is accounted for by the fact that the ministry in Judea was still preparatory. Jesus had publicly asserted His Messianic authority. A little space is now allowed to test the result. Meanwhile Jesus descends again to the work of prophetic preparation. His ministry at this stage is hardly distinguishable from John\'s. He summons to the baptism of repentance. His disciples, not Himself, administer the rite (<a onClick="return mV(\'Jhn\',3,23);">Joh 3:23</a>; <a onClick="return mV(\'Jhn\',4,2);">4:2</a>); hence the sort of rivalry that sprang up between His baptism and that of the forerunner (<a onClick="return mV(\'Jhn\',3,\'22-26\');">Joh 3:22-26</a>). John was baptizing at the time at Aenon, on the western side of the Jordan; Jesus somewhere in the neighborhood. Soon the greater teacher began to eclipse the less. "All men came to Him" (<a onClick="return mV(\'Jhn\',3,26);">3:26</A>). John\'s reply showed how pure his mind was from the narrow, grudging spirit which characterized his followers. To him it was no grievance, but the fulfillment of his joy, that men should be flocking to Jesus. He was not the Bridegroom, but the friend of the Bridegroom. They themselves had heard him testify, "I am not the Christ." It lay in the nature of things that Jesus must increase; he must decrease (<a onClick="return mV(\'Jhn\',3,\'27-30\');">3:27-30</a>). Explanatory words follow (<a onClick="return mV(\'Jhn\',3,\'31-36\');">3:31-36</a>).<P>IV. Journey to Galilee—the Woman of Samaria.<P>1. Withdrawal to Galilee:<P>Toward the close of this Judean ministry the Baptist appears to have been cast into prison for his faithfulness in reproving Herod Antipas for taking his brother Philip\'s wife (compare <a onClick="return mV(\'Jhn\',3,24);">Joh 3:24</a>; <a onClick="return mV(\'Mat\',14,\'3-5\');">Mt 14:3-5</a> parallel). It seems most natural to connect the departure to Galilee in <a onClick="return mV(\'Jhn\',4,3);">Joh 4:3</a> with that narrated in <a onClick="return mV(\'Mat\',3,13);">Mt 3:13</a> parallel, though some think the imprisonment of the Baptist did not take place till later. The motive which John gives was the hostility of the Pharisees, but it was the imprisonment of the Baptist which led Jesus to commence, at the time He did, an independent ministry. The direct road to Galilee lay through Samaria; hence the memorable encounter with the woman at that place.<P>2. The Living Water:<P>Jesus, being wearied, paused to rest Himself at Jacob\'s well, near a town called Sychar, now \'Askar. It was about the sixth hour—or 6 o\'clock in the evening. The time of year is determined by <a onClick="return mV(\'Jhn\',4,35);">Joh 4:35</a> to be "four months" before harvest, i.e. December (there is no reason for not taking this literally). It suits the evening hour that the woman of Samaria came out to draw water. (Some, on a different reckoning, take the hour to be noon.) Jesus opened the conversation by asking from the woman a draught from her pitcher. The proverbial hatred between Jews and Samaritans filled the woman with surprise that Jesus should thus address Himself to her. Still greater was her surprise when, as the conversation proceeded, Jesus announced Himself as the giver of a water of which, if a man drank, he should never thirst again (<a onClick="return mV(\'Jhn\',4,13,14);">Joh 4:13,14</a>). Only gradually did His meaning penetrate her mind, "Sir, give me this water," etc. (<a onClick="return mV(\'Jhn\',4,15);">Joh 4:15</a>). The request of Jesus that she would call her husband led to the discovery that Jesus knew all the secrets of her life. She was before a prophet (<a onClick="return mV(\'Jhn\',4,19);">Joh 4:19</a>). As in the case iof Nathanael, the heart-searching power of Christ\'s word convinced her of His Divine claim.<P>3. The True Worship:<P>The conversation next turned upon the right place of worship. The Samaritans had a temple of their own on Mount Gerizim; the Jews, on the other hand, held to the exclusive validity of the temple at Jerusalem. Which was right? Jesus in His reply, while pronouncing for the Jews as the custodians of God\'s salvation (<a onClick="return mV(\'Jhn\',4,22);">Joh 4:22</a>), makes it plain that distinction of places is no longer a matter of any practical importance. A change was imminent which would substitute a universal religion for one of special times and places (<a onClick="return mV(\'Jhn\',4,20);">Joh 4:20</a>). He enunciates the great principle of the new dispensation that God is a Spirit, and they who worship Him must do so in spirit and in truth. Finally, when she spoke of the Messiah, Jesus made Himself definitely known to her as the Christ. To this poor Samaritan woman, with her receptive heart, He unveils Himself more plainly than He had done to priests and rulers (<a onClick="return mV(\'Jhn\',4,26);">Joh 4:26</a>).<P>4. Work at Its Reward:<P>The woman went home and became an evangelist to her people, with notable results (<a onClick="return mV(\'Jhn\',4,28,39);">Joh 4:28,39</a>). Jesus abode with them two days and confirmed the impression made by her testimony (<a onClick="return mV(\'Jhn\',4,\'40-42\');">Joh 4:40-42</a>). Meanwhile, He impressed on His disciples the need of earnest sowing and reaping in the service of the Kingdom, assuring them of unfailing reward for both sower and reaper (<a onClick="return mV(\'Jhn\',4,\'35-38\');">Joh 4:35-38</a>). He Himself was their Great Example (<a onClick="return mV(\'Jhn\',4,34);">Joh 4:34</a>).``132';
isbe[5021]='Jesus Christ, 4C1`C. THE GALILEAN MINISTRY AND VISITS TO THE FEASTS<P>1. The Scene:<P>Galilee was divided into upper Galilee and lower Galilee. It has already been remarked that upper Galilee was inhabited by a mixed population—hence called "Galilee of the Gentiles" (<a onClick="return mV(\'Mat\',4,15);">Mt 4:15</a>). The highroads of commerce ran through it. It was "the way of the sea" (the King James Version)—a scene of constant traffic. The people were rude, ignorant, and superstitious, and were densely crowded together in towns and villages. About 160 BC there were only a few Jews in the midst of a large heathen population; but by the time of Christ the Jewish element had greatly increased. The busiest portion of this busy district was round the Sea of Galilee, at the northeast corner of which stood Capernaum—wealthy and cosmopolitan. In Nazareth, indeed, Jesus met with a disappointing reception (<a onClick="return mV(\'Luk\',4,\'16-30\');">Lu 4:16-30</a>; <a onClick="return mV(\'Mat\',13,\'54-57\');">Mt 13:54-57</a>; compare <a onClick="return mV(\'Jhn\',4,\'43-45\');">Joh 4:43-45</a>); yet in Galilee generally He found a freer spirit and greater receptiveness than among the stricter traditionalists of Judea.<P>2. The Time:<P>It is assumed here that Jesus returned to Galilee in December, 27 AD, and that His ministry there lasted till late in 29 AD (see "Chronology" above). On the two years\' scheme of the public ministry, the Passover of <a onClick="return mV(\'Jhn\',6,4);">Joh 6:4</a> has to be taken as the second in Christ\'s ministry—therefore as occurring at an interval of only 3 or 4 months after the return. This seems impossible in view of the crowding of events it involves in so short a time—opening incidents, stay in Capernaum (<a onClick="return mV(\'Mat\',4,13);">Mt 4:13</a>), three circuits in "all Galilee" (<a onClick="return mV(\'Mat\',4,\'23-25\');">Mt 4:23-25</a> parallel; <a onClick="return mV(\'Luk\',8,\'1-4\');">Lu 8:1-4</a>; <a onClick="return mV(\'Mat\',9,\'35-38\');">Mt 9:35-38</a>; <a onClick="return mV(\'Mar\',6,6);">Mr 6:6</a>), lesser journeys and excursions (Sermon on Mount: Gadara); and the dislocations it necessitates, e.g. the plucking of ears of corn (about Passover time) must be placed after the feeding of the 5,000, etc. It is simpler to adhere to the three years\' scheme.<P>A division of the Galilean ministry may then fitly be made into two periods—one preceding, the other succeeding the Mission of the Twelve in <a onClick="return mV(\'Mat\',10,\'1-\');">Mt 10</a> parallel. One reason for this division is that after the Mission of the Twelve the order of events is the same in the first three evangelists till the final departure from Galilee.<P>First Period—From the Beginning of the Ministry in Galilee till the Mission of the Twelve<P>I. Opening Incidents.<P>1. Healing of Nobleman\'s Son:<P>(<a onClick="return mV(\'Jhn\',4,\'43-54\');">Joh 4:43-54</a>)<P>From sympathetic Samaria (<a onClick="return mV(\'Jhn\',4,39);">Joh 4:39</a>), Jesus had journeyed to unsympathetic Galilee, and first to Cana, where His first miracle had been wrought. The reports of His miracles in Judea had come before Him (<a onClick="return mV(\'Jhn\',4,45);">Joh 4:45</a>), and it was mainly His reputation as a miracle-worker which led a nobleman—a courtier or officer at Herod\'s court—to seek Him at Cana on behalf of his son, who was near to death. Jesus rebuked the sign-seeking spirit (<a onClick="return mV(\'Jhn\',4,48);">Joh 4:48</a>), but, on the fervent appeal being repeated, He bade the nobleman go his way: his son lived. The man\'s prayer had been, "Come down"; but he had faith to receive the word of Jesus (<a onClick="return mV(\'Jhn\',4,50);">Joh 4:50</a>), and on his way home received tidings of his son\'s recovery. The nobleman, with his whole household, was won for Jesus (<a onClick="return mV(\'Jhn\',4,53);">Joh 4:53</a>). This is noted as the second of Christ\'s Galilean miracles (<a onClick="return mV(\'Jhn\',4,54);">Joh 4:54</a>).<P>2. The Visit to Nazareth:<P>(<a onClick="return mV(\'Mat\',4,13);">Matthew 4:13</a>; <a onClick="return mV(\'Luk\',4,\'16-30\');">Luke 4:16-30</a>)<P>A very different reception awaited Him at Nazareth,"his own country," to which He next came. We can scarcely take the incident recorded in <a onClick="return mV(\'Luk\',4,\'16-30\');">Lu 4:16-30</a> to be the same as that in <a onClick="return mV(\'Mat\',13,\'54-58\');">Mt 13:54-58</a>, though Matthew\'s habit of grouping makes this not impossible. The Sabbath had come, and on His entering the synagogue, as was His wont, the repute He had won led to His being asked to read. The Scripture He selected (or which came in the order of the day) was <a onClick="return mV(\'Isa\',61,1);">Isa 61:1</a>ff (the fact that Jesus was able to read from the synagogue-roll is interesting as bearing on His knowledge of Hebrew), and from this He proceeded to amaze His hearers by declaring that this Scripture was now fulfilled in their ears (<a onClick="return mV(\'Luk\',4,21);">Lu 4:21</a>). The "words of grace" he uttered are not given, but it can be understood that, following the prophet\'s guidance, He would hold Himself forth as the predicted "Servant of Yahweh," sent to bring salvation to the poor, the bound, the broken-hearted, and for this purpose endowed with the fullness of the Spirit. The idea of the passage in Isaiah is that of the year of jubilee, when debts were canceled, inheritances restored, and slaves set free, and Jesus told them He had come to inaugurate that "acceptable year of the Lord." At first He was listened to with admiration, then, as the magnitude of the claims He was making became apparent to His audience, a very different spirit took possession of them. \'Who was this that spoke thus?\' \'Was it not Joseph\'s son?\' (<a onClick="return mV(\'Luk\',4,22);">Lu 4:22</a>). They were disappointed, too, that Jesus showed no disposition to gratify them by working before them any of the miracles of which they had heard so much (<a onClick="return mV(\'Luk\',4,23);">Lu 4:23</a>). Jesus saw the gathering storm, but met it resolutely. He told His hearers He had not expected any better reception, and in reply to their reproach that He had wrought miracles elsewhere, but had wrought none among them, quoted examples of prophets who had done the same thing (Elijah, Elisha, <a onClick="return mV(\'Luk\',4,\'24-28\');">Lu 4:24-28</a>). This completed the exasperation of the Nazarenes, who, springing forward, dragged Him to the brow of the hill on which their city was built, and would have thrown Him down, had something in the aspect of Jesus not restrained them. With one of those looks we read of occasionally in the Gospels, He seems to have overawed His townsmen, and, passing in safety through their midst, left the place (<a onClick="return mV(\'Luk\',4,\'28-30\');">Lu 4:28-30</a>).<P>3. Call of the Four Disciples:<P>(<a onClick="return mV(\'Mat\',4,\'17-22\');">Matthew 4:17-22</a>; <a onClick="return mV(\'Mar\',1,\'16-22\');">Mark 1:16-22</a>; <a onClick="return mV(\'Luk\',5,\'1-11\');">Luke 5:1-11</a>)<P>After leaving Nazareth Jesus made His way to Capernaum (probably Tell Hum), which thereafter seems to have been His headquarters. He "dwelt" there (<a onClick="return mV(\'Mat\',4,13);">Mt 4:13</a>). It is called in <a onClick="return mV(\'Mat\',9,1);">Mt 9:1</a>, "his own city." Before teaching in Capernaum self, however, He appears to have opened His ministry by evangelizing along the shores of the Sea of Galilee (<a onClick="return mV(\'Mat\',4,18);">Mt 4:18</a>; <a onClick="return mV(\'Mar\',1,16);">Mr 1:16</a>; <a onClick="return mV(\'Luk\',5,1);">Lu 5:1</a>), and there, at Bethsaida (on topographical questions, see special articles), He took His first step in gathering His chosen disciples more closely around Him. Hitherto, though attached to His person and cause, the pairs of fisher brothers, Simon and Andrew, James and John—these last the "sons of Zebedee"—had not been in constant attendance upon Him. Since the return from Jerusalem, they had gone back to their ordinary avocations. The four were "partners" (<a onClick="return mV(\'Luk\',5,10);">Lu 5:10</a>). They had "hired servants" (<a onClick="return mV(\'Mar\',1,20);">Mr 1:20</a>); therefore were moderately well off. The time had now come when they were to leave "all," and follow Jesus entirely.<P>a) The Draught of Fishes:<P>(<a onClick="return mV(\'Luk\',5,\'1-9\');">Luke 5:1-9</a>)<P>Luke alone records the striking miracle which led to the call. Jesus had been teaching the multitude from a boat borrowed from Simon, and now at the close He bade Simon put out into the deep, and let down his nets. Peter told Jesus they had toiled all night in vain, but he would obey His word. The result was an immense draught of fishes, so that the nets were breaking, and the other company had to be called upon for help. Both boats were filled and in danger of sinking. Peter\'s cry in so wonderful a presence was, "Depart from me; for I am a sinful man, O Lord."<P>b) "Fishers of Men":<P>The miracle gave Jesus opportunity for the word He wished to speak. It is here that Mat and Mar take up the story. The boats had been brought to shore when, first to Simon and Andrew, afterward to James and John (engaged in "mending their nets," <a onClick="return mV(\'Mat\',4,21);">Mt 4:21</a>; <a onClick="return mV(\'Mar\',1,19);">Mr 1:19</a>), the call was given:"Come ye after me, and I will make you fishers of men." At once all was left—boats, nets, friends—and they followed Him. Their experience taught them to have large expectations from Christ.<P>4. At Capernaum:<P>(<a onClick="return mV(\'Mat\',4,13);">Matthew 4:13</a>; <a onClick="return mV(\'Luk\',4,31);">Luke 4:31</a>)<P>Jesus is now found in Capernaum. An early Sabbath—perhaps the first of His stated residence in the city—was marked by notable events. The Sabbath found Jesus as usual in the synagogue—now as teacher. The manner of His teaching is specially noticed: "He taught them as having authority, and not as the scribes" (<a onClick="return mV(\'Mar\',1,22);">Mr 1:22</a>). The scribes gave forth nothing of their own.<P>a) Christ\'s Teaching:<P>(<a onClick="return mV(\'Mar\',1,22,27);">Mark 1:22,27</a>; <a onClick="return mV(\'Luk\',4,32);">Luke 4:32</a>)<P>They but repeated the dicta of the great authorities of the past. It was a surprise to the people to find in Jesus One whose wisdom, like waters from a clear fountain, came fresh and sparkling from His own lips. The authority also with which Jesus spoke commanded attention. He sought support in the opinion of no others, but gave forth His statements with firmness, decision, dignity and emphasis.<P>b) The Demoniac in the Synagogue:<P>(<a onClick="return mV(\'Mar\',1,\'23-27\');">Mark 1:23-27</a>; <a onClick="return mV(\'Luk\',4,\'33-37\');">Luke 4:33-37</a>)<P>While Jesus was teaching an extraordinary incident occurred. A man in the assembly, described as possessed by "an unclean spirit" (<a onClick="return mV(\'Mar\',1,23);">Mr 1:23</a>; <a onClick="return mV(\'Luk\',4,33);">Lu 4:33</a>) broke forth in cries, addressing Jesus by name ("Jesus, thou Nazarene"), speaking of Him as "the Holy One of God," and asking "What have we to do with thee? Art thou come to destroy us?" The diseased consciousness of the sufferer bore a truer testimony to Christ\'s dignity, holiness and power than most of those present could have given, and instinctively, but truly, construed His coming as meaning destruction to the empire of the demons. At Christ\'s word, after a terrible paroxysm, from which, however, the man escaped unhurt (<a onClick="return mV(\'Luk\',4,35);">Lu 4:35</a>), the demon was cast out. More than ever the people were "amazed" at the word which had such power (<a onClick="return mV(\'Mar\',1,27);">Mr 1:27</a>).<P>Demon-Possession: Its Reality.<P>This is the place to say a word on this terrible form of malady—demon-possessio
