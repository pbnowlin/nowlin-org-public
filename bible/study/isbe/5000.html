 embodies two truths:<P class="in15">(1) the Divinity,<P class="in15">(2) the Messiahship, of the Son of man.<P>Jesus did honor to the confession of His apostle. Not flesh and blood, but the Father, had revealed the truth to him. Here at length was "rock" on which He could build a church. Reverting to Peter\'s original name, Simon Bar-Jonah, Jesus declared, with a play on the name "Peter" (petros, "rock," "piece of rock") He had before given him (<a onClick="return mV(\'Jhn\',1,42);">Joh 1:42</a>), that on this "rock" (petra), He would build His church, and the gates of Hades (hostile evil powers) would not prevail against it (<a onClick="return mV(\'Mat\',16,18);">Mt 16:18</a>). The papacy has reared an unwarrantable structure of pretensions on this passage in supposing the "rock" to be Peter personally and his successors in the see of Rome (none such existed; Peter was not bishop of Rome). It is not Peter the individual, but Peter the confessing apostle—Peter as representative of all—that Christ names "rock"; that which constituted him a foundation was the truth he had confessed (compare <a onClick="return mV(\'Eph\',2,20);">Eph 2:20</a>). This is the first New Testament mention of a "church" (ekklesia). The Christian church, therefore, is founded<P class="in15">(1) on the truth of Christ\'s Divine Sonship;<P class="in15">(2) on the truth of His Messiah-ship, or of His being the anointed prophet, priest and king of the new age.<P>A society of believers confessing these truths is a church; no society which denies these truths deserves the name. To this confessing community Jesus, still addressing Peter as representing the apostolate (compare <a onClick="return mV(\'Mat\',18,18);">Mt 18:18</a>), gives authority to bind and loose—to admit and to exclude. Jesus, it is noted, bade His disciples tell no man of these things (<a onClick="return mV(\'Mat\',16,20);">Mt 16:20</a>; <a onClick="return mV(\'Mar\',8,30);">Mr 8:30</a>; <a onClick="return mV(\'Luk\',9,21);">Lu 9:21</a>).<P>(2) The Cross and the Disciple.<P>The confession of Peter prepared the way for an advance in Christ\'s teaching. From that time, Matthew notes, Jesus began to speak plainly of His approaching sufferings and death (<a onClick="return mV(\'Mat\',16,21);">16:21</a>). There are in all three solemn announcements of the Passion (<a onClick="return mV(\'Mat\',16,\'21-23\');">Mt 16:21-23</a>; <a onClick="return mV(\'Mat\',17,22,23);">17:22,23</a>; <a onClick="return mV(\'Mat\',20,\'17-19\');">20:17-19</a> parallel). Jesus foresaw, and clearly foretold, what would befall Him at Jerusalem. He would be killed by the authorities, but on the third day would rise again. On the first announcement, following His confession, Peter took it upon him to expostulate with Jesus: "Be it far from thee, Lord," etc. (<a onClick="return mV(\'Mat\',16,22);">Mt 16:22</a>), an action which brought upon him the stern rebuke of Jesus: "Get thee behind me, Satan," etc. (<a onClick="return mV(\'Mat\',16,23);">Mt 16:23</a>). The Rock-man, in his fall to the maxims of a worldly expediency, is now identified with Satan, the tempter. This principle, that duty is only to be done when personal risk is not entailed, Jesus not only repudiates for Himself, but bids His disciples repudiate it also. The disciple, Jesus says, must be prepared to deny himself, and take up his cross. The cross is the symbol of anything distressing or painful to bear. There is a saving of life which is a losing of it, and what shall a man be profited if he gain the whole world, and forfeit his (true, higher) life? As, however, Jesus had spoken, not only of dying, but of rising again, so now He encourages His disciples by announcing His future coming in glory to render to every man according to His deeds. That final coming might be distant (compare <a onClick="return mV(\'Mat\',24,36);">Mt 24:36</a>); but (so it seems most natural to interpret the saying <a onClick="return mV(\'Mat\',16,28);">Mt 16:28</a> parallel) there were those living who would see the nearer pledge of that, in Christ\'s coming in the triumphs and successes of His kingdom (compare <a onClick="return mV(\'Mar\',9,1);">Mr 9:1</a>; <a onClick="return mV(\'Luk\',9,27);">Lu 9:27</a>; <a onClick="return mV(\'Mat\',26,64);">Mt 26:64</a>).<P>6. The Transfiguration—the Epileptic Boy:<P>(<a onClick="return mV(\'Mat\',17,\'1-20\');">Matthew 17:1-20</a>; <a onClick="return mV(\'Mar\',9,\'2-29\');">Mark 9:2-29</a>; <a onClick="return mV(\'Luk\',9,\'28-43\');">Luke 9:28-43</a>)<P>About eight days after the announcement of His passion by Jesus, took place the glorious event of the transfiguration. Jesus had spoken of His future glory, and here was pledge of it. In strange contrast with the scene of glory on the summit of the mountain was the painful sight which met Jesus and His three companions when they descended again to to the plain.<P>a) The Glory of the Only Begotten:<P>Tradition connects the scene of the transfiguration with Mount Tabor, but it more probably took place on one of the spurs of Mount Hermon. Jesus had ascended the mountain with Peter, James and John, for prayer. It was while He was praying the wonderful change happened. For once the veiled glory of the only begotten from the Father (<a onClick="return mV(\'Jhn\',1,14);">Joh 1:14</a>) was permitted to burst forth, suffusing His person and garments, and changing them into a dazzling brightness. His face did shine as the sun; His raiment became white as light ("as snow," the King James Version, Mark). Heavenly visitants, recognized from their converse as Moses and Elijah, appeared with Him and spoke of His decease (Luke). A voice from an enveloping cloud attested: "This is my beloved Son, in whom I am well pleased." Little wonder the disciples were afraid, or that Peter in his confusion should stammer out: "It is good for us to be here: if thou wilt, I will make here three tabernacles (booths)." This, however, was not permitted. Earth is not heaven. Glimpses of heavenly glory are given, not to wean from duty on earth, but to prepare for the trials connected therewith.<P>b) Faith\'s Entreaty and Its Answer:<P>The spectacle that met the eyes of Jesus and the chosen three as they descended was distressing in the extreme. A man had brought his epileptic boy—a sore sufferer and dumb—to the disciples to see if they could cast out the evil spirit that possessed him, but they were not able. Their failure, as Jesus showed, was failure of faith; none the less did their discomfiture afford a handle to the gainsayers, who were not slow to take advantage of it (<a onClick="return mV(\'Mar\',9,14);">Mr 9:14</a>). The man\'s appeal was now to Jesus, "If thou canst do anything," etc. (<a onClick="return mV(\'Mar\',9,22);">Mr 9:22</a>). The reply of Jesus shifted the "canst" to the right quarter, "If thou canst (believe)" (<a onClick="return mV(\'Mar\',9,23);">Mr 9:23</a>). Such little faith as the man had revived under Christ\'s word: "I believe; help thou mine unbelief." The multitude pressing around, there was no call for further delay. With one energetic word Jesus expelled the unclean spirit (<a onClick="return mV(\'Mar\',9,25);">Mr 9:25</a>). The first effect of Christ\'s approach had been to induce a violent paroxysm (<a onClick="return mV(\'Mar\',9,20);">Mr 9:20</a>); now the spirit terribly convulsed the frame it was compelled to relinquish. Jesus, taking the boy\'s hand, raised him up, and he was found well. The lesson drawn to the disciples was the omnipotence of faith (<a onClick="return mV(\'Mat\',17,19,20);">Mt 17:19,20</a>) and power of prayer (<a onClick="return mV(\'Mar\',9,28,29);">Mr 9:28,29</a>).<P>III. From Private Journey through Galilee till Return from the Feast of Tabernacles.<P>1. Galilee and Capernaum:<P>Soon after the last-mentioned events Jesus passed privately through Galilee (<a onClick="return mV(\'Mar\',9,30);">Mr 9:30</a>), returning later to Capernaum. During the Galilean journey Jesus made to His disciples His 2nd announcement of His approaching sufferings and death, accompanied as before by the assurance of His resurrection. The disciples still could not take in the meaning of His words, though what He said made them "exceeding sorry" (<a onClick="return mV(\'Mat\',17,23);">Mt 17:23</a>).<P>a) Second Announcement of Passion:<P>(<a onClick="return mV(\'Mat\',17,22,23);">Matthew 17:22,23</a>; <a onClick="return mV(\'Mar\',9,\'30-33\');">Mark 9:30-33</a>; <a onClick="return mV(\'Luk\',9,44,45);">Luke 9:44,45</a>)<P>The return to Capernaum was marked by an incident which raised the question of Christ\'s relation to temple institutions. The collectors of tribute for the temple inquired of Peter: "Doth not your teacher pay the half-shekel?" (Greek didrachma, or double drachm, worth about 32 cents or is. 4d.).<P>b) The Temple Tax:<P>(<a onClick="return mV(\'Mat\',17,\'24-27\');">Matthew 17:24-27</a>)<P>The origin of this tax was in the half-shekel of atonement-money of <a onClick="return mV(\'Exd\',30,\'11-16\');">Ex 30:11-16</a>, which, though a special contribution, was made the basis of later assessment (<a onClick="return mV(\'2Ch\',24,\'4-10\');">2Ch 24:4-10</a>; in Nehemiah\'s time the amount was one-third of a shekel, <a onClick="return mV(\'Neh\',10,32);">Ne 10:32</a>), and its object was the upkeep of the temple worship (Schurer). The usual time of payment was March, but Jesus had probably been absent and the inquiry was not made for some months later. Peter, hasty as usual, probably reasoning from Christ\'s ordinary respect for temple ordinances, answered at once that He did pay the tax. It had not occurred to him that Jesus might have something to say on it, if formally challenged. Occasion therefore was taken by Jesus gently to reprove Peter. Peter had but recently acknowledged Jesus to be the Son of God. Do kings of the earth take tribute of their own sons? The half-shekel was suitable to the subject-relation, but not to the relation of a son. Nevertheless, lest occasion of stumbling be given, Jesus could well waive this right, as, in His humbled condition, He had waived so many more. Peter was ordered to cast his hook into the sea, and Jesus foretold that the fish he would bring up would have in its mouth the necessary coin (Greek, stater, about 64 cents or 2s. 8d.). The tax was paid, yet in such a way as to show that the payment of it was an act of condescension of the king\'s Son.<P>c) Discourse on Greatness and Forgiveness:<P>(<a onClick="return mV(\'Mat\',18,\'1-35\');">Matthew 18:1-35</a>; <a onClick="return mV(\'Mar\',9,\'33-50\');">Mark 9:33-50</a>; <a onClick="return mV(\'Luk\',9,\'46-50\');">Luke 9:46-50</a>)<P>On the way to Capernaum a dispute had arisen among the disciples as to who should be greatest in the Messianic kingdom about to be set up. The fact of such disputing showed how largely even their minds were yet dominated by worldly, sensuous ideas of the kingdom. Now, in the house (<a onClick="return mV(\'Mar\',9,33);">Mr 9:33</a>), Jesus takes occasion to check their spirit of ambitious rivalry, and to inculcate much-needed lessons on greatness and kindred matters.<P>(1) Greatness in Humility.<P>First, by the example of a little child, Jesus teaches that humility is the root-disposition of His kingdom. It alone admits to the kingdom, and conducts to honor in it. He is greatest who humbles himself most (<a onClick="return mV(\'Mat\',18,4);">Mt 18:4</a>), and is the servant of all (<a onClick="return mV(\'Mar\',9,35);">Mr 9:35</a>). He warns against slighting the "little ones," or causing them to stumble, and uses language of terrible severity against those guilty of this sin.<P>(2) Tolerance.<P>The mention of receiving little ones in Christ\'s name led John to remark that he had seen one casting out demons in Christ\'s name, and had forbidden him, because he was not of their company. "Forbid him not," Jesus said, "for there is no man who shall do a mighty work in my name, and be able quickly to speak evil of me. For he that is not against us is for us" (<a onClick="return mV(\'Mar\',9,39,40);">Mr 9:39,40</a>).<P>(3) The Erring Brother.<P>The subject of offenses leads to the question of sins committed by one Christian brother against another. Here Christ inculcates kindness and forbearance; only if private representations and the good offices of brethren fail, is the matter to be brought before the church; if the brother repents he is to be unstintedly forgiven ("seventy times seven," <a onClick="return mV(\'Mat\',18,22);">Mt 18:22</a>). If the church is compelled to interpose, its decisions are valid (under condition, however, of prayer and Christ\'s presence, <a onClick="return mV(\'Mat\',18,\'18-20\');">Mt 18:18-20</a>).<P>(4) Parable of the Unmerciful Servant.<P>To enforce the lesson of forgiveness Jesus speaks the parable of the Unmerciful Servant (<a onClick="return mV(\'Mat\',18,\'23-35\');">Mt 18:23-35</a>). Himself forgiven much, this servant refuses to forgive his fellow a much smaller debt. His lord visits him with severest punishment. Only as we forgive others can we look for forgiveness.<P>2. The Feast of Tabernacles—Discourses, etc.:<P>(<a onClick="return mV(\'Jhn\',7,\'1-\');">John 7-10:21</a>)<P>The Gospel of John leaves a blank of many months between chapters <a onClick="return mV(\'Jhn\',6,\'1-\');">6</a> and <a onClick="return mV(\'Jhn\',7,\'1-\');">7</a>, covered only by the statement, "After these things, Jesus walked in Galilee" (<a onClick="return mV(\'Jhn\',7,1);">7:1</a>). In this year of His ministry Jesus had gone neither to the feast of the Passover nor to Pentecost. The Feast of Tabernacles was now at hand (October). To this Jesus went up, and John preserves for us a full record of His appearance, discourses and doings there.<P>a) The Private Journey—Divided Opinions:<P>(<a onClick="return mV(\'Jhn\',7,\'1-10\');">John 7:1-10</a>)<P>The brethren of Jesus, still unpersuaded of His claims (<a onClick="return mV(\'Jhn\',7,5);">Joh 7:5</a>), had urged Jesus to go up with them to the feast. "Go up," in their sense, included a public manifestation of Himself as the Messiah. Jesus replied that His time for this had not yet come. Afterward He went up quietly, and in the midst of the feast appeared in the temple as a teacher. The comments made about Jesus at the feast before His arrival vividly reflect the divided state of opinion regarding Him. "He is a good man," thought some. "Not so," said others, "but He leadeth the multitude astray." His teaching evoked yet keener division. While some said, "Thou hast a demon" (<a onClick="return mV(\'Jhn\',7,20);">Joh 7:20</a>), others argued, "When the Christ shall come, will he do more signs?" etc. (<a onClick="return mV(\'Jhn\',7,31);">Joh 7:31</a>). Some declared, "This is of a truth the prophet," or "This is the Christ"; others objected that the Christ was to come out of Bethlehem, not Galilee (<a onClick="return mV(\'Jhn\',7,\'40-42\');">Joh 7:40-42</a>). Yet no one dared to take the step of molesting Him.<P>b) Christ\'s Self-Witness:<P>(<a onClick="return mV(\'Jhn\',7,\'14-52\');">John 7:14-52</a>)<P>Christ\'s wisdom and use of the Scriptures excited surprise. Jesus met this surprise by stating that His knowledge was from the Father, and with reference to the division of opinion about Him laid down the principle that knowledge of the truth was the result of the obedient will: "If any man willeth to do his will, he shall know of the teaching, whether it is of God" (<a onClick="return mV(\'Jhn\',7,17);">Joh 7:17</a>). It was objected that they knew who Jesus was, and whence He came. In a sense, Jesus replied, this was true; in a deeper sense, it was not. He came from the Father, whom they knew not (<a onClick="return mV(\'Jhn\',7,28,29);">Joh 7:28,29</a>). The last and great day of the feast—the eighth (<a onClick="return mV(\'Num\',29,35);">Nu 29:35</a>)—brought with it a new self-attestation. Jesus stood and cried, "If any man thirst, let him come unto me and drink. He that believeth on me...from within him shall flow rivers of living water" (<a onClick="return mV(\'Jhn\',7,37,38);">Joh 7:37,38</a>). The words are understood to have reference to the ceremony of pouring out a libation of water at this feast—the libation, in turn, commemorating the gift of water at the striking of the rock. The evangelist interprets the saying of the Spirit which believers should receive. Meanwhile, the chief priests and Pharisees had sent officers to apprehend Jesus (<a onClick="return mV(\'Jhn\',7,32);">Joh 7:32</a>), but they returned without Him. "Why did ye not bring him?" The reply was confounding, "Never man so spake" (<a onClick="return mV(\'Jhn\',7,45,46);">Joh 7:45,46</a>). The retort was the poor one, "Are ye also led astray?" In vain did Nicodemus, who was present, try to put in a moderating word (<a onClick="return mV(\'Jhn\',7,50,51);">Joh 7:50,51</a>). It was clear to what issue hate like this was tending.<P>c) The Woman Taken in Adultery:<P>(<a onClick="return mV(\'Jhn\',8,\'1-\');">John 8</a>)<P>The discourses at the feast are at this point interrupted by the episode of the woman taken in adultery (<a onClick="return mV(\'Jhn\',8,\'1-11\');">Joh 8:1-11</a>), which, by general consent, does not belong to the original text of the Gospel. It is probably, however, an authentic incident, and illustrates, on the one hand, the eagerness of the official classes to find an accusation against Jesus, and, on the other, the Saviour\'s dignity and wisdom in foiling such attempts, His spirit of mercy and the action of conscience in the accusers. In His continued teaching, Jesus put forth even higher claims than in the foregoing discourse. As He had applied to Himself the water from the rock, so now He applied to Himself the symbolic meaning of the two great candelabra, which were lighted in the temple court during the feast and bore reference to the pillar of cloud and fire. "I am the light of the world," said Jesus (<a onClick="return mV(\'Jhn\',8,12);">Joh 8:12</a>). Only a Divine being could put forth such a claim as that. The Jews objected that they had only His witness to Himself. Jesus replied that no other could bear adequate witness of Him, for He alone knew whence He came and whither He went (<a onClick="return mV(\'Jhn\',8,14);">Joh 8:14</a>). But the Father also had borne witness of Him (<a onClick="return mV(\'Jhn\',8,18);">Joh 8:18</a>). This discourse, delivered in the "treasury" of the temple (<a onClick="return mV(\'Jhn\',8,20);">Joh 8:20</a>), was soon followed by another, no man yet daring to touch Him. This time Jesus warns the Jews of the fate their unbelief would entail upon them: "Ye shall die in your sins" (<a onClick="return mV(\'Jhn\',8,24);">Joh 8:24</a>). Addressing Himself next specially to the Jews who believed in Him, He urged them to continuance in His word as the condition of true freedom. Resentment was again aroused at the suggestion that the Jews, Abraham\'s seed, were not free. Jesus made clear that the real bondage was that of sin; only the Son could make spiritually free (<a onClick="return mV(\'Jhn\',8,\'34-36\');">Joh 8:34-36</a>). Descent from Abraham meant nothing, if the spirit was of the devil (<a onClick="return mV(\'Jhn\',8,\'39-41\');">Joh 8:39-41</a>). A new conflict was provoked by the saying, "If a man keep my word, he shall never see death" (<a onClick="return mV(\'Jhn\',8,51);">Joh 8:51</a>). Did Jesus make Himself greater than Abraham? The controversy that ensued resulted in the sublime utterance, "Before Abraham was born, I am" (<a onClick="return mV(\'Jhn\',8,58);">Joh 8:58</a>). The Jews would have stoned Him, but Jesus eluded them, and departed.<P>d) The Cure of the Blind Man:<P>(<a onClick="return mV(\'Jhn\',9,\'1-\');">John 9</a>)<P>The Feast of Tabernacles was past, but Jesus was still in Jerusalem. Passing by on a Sabbath (<a onClick="return mV(\'Jhn\',9,14);">Joh 9:14</a>), He saw a blind man, a beggar (<a onClick="return mV(\'Jhn\',9,8);">John 9:8</a>), well known to have been blind from his birth. The narrative of the cure and examination of this blind man is adduced by Paley as bearing in its inimitable circumstantiality every mark of personal knowledge on the part of the historian. The man, cured in strange but symbolic fashion by the anointing of his eyes with clay (thereby apparently sealing them more firmly), then washing in the Pool of Siloam, became an object of immediate interest, and every effort was made by the Pharisees to shake his testimony as to the miracle that had been wrought. The man, however, held to his story, and his parents could only corroborate the fact that their son had been born blind, and now saw. The Pharisees themselves were divided, some reasoning that Jesus could not be of God because He had broken the Sabbath—the old charge; others, Nicodemus-like, standing on the fact that a man who was a sinner could not do such signs (<a onClick="return mV(\'Jhn\',9,15,16);">Joh 9:15,16</a>). The healed man applied the logic of common-sense: "If this man were not from God, he could do nothing" (<a onClick="return mV(\'Jhn\',9,33);">Joh 9:33</a>). The Pharisees, impotent to deny the wonder, could only cast him out of the synagogue. Jesus found him, and brought him to full confession of faith in Himself (<a onClick="return mV(\'Jhn\',9,\'35-38\');">Joh 9:35-38</a>).<P>e) The Good Shepherd:<P>(<a onClick="return mV(\'Jhn\',10,\'1-21\');">John 10:1-21</a>)<P>Yet another address of Jesus is on record arising out of this incident. In continuation of His reply to the question of the Pharisees in John (<a onClick="return mV(\'Jhn\',9,40);">9:40</a>), "Are we also blind?" Jesus spoke to them His discourse on the Good Shepherd. Flocks in eastern countries are gathered at night into an enclosure surrounded by a wall or palisade. This is the "fold," which is under the care of a "porter," who opens the closely barred door to the shepherds in the morning. As contrasted with the legitimate shepherds, the false shepherds "enter not by the door," but climb over some other way. The allusion is to priests, scribes, Pharisees and generally to all, in any age, who claim an authority within the church unsanctioned by God (Godet). Jesus now gathers up the truth in its relation to Himself as the Supreme Shepherd. From His fundamental relation to the church, He is not only the Shepherd, but the Door (<a onClick="return mV(\'Jhn\',10,\'7-14\');">10:7-14</a>). To those who enter by Him there is given security, liberty, provision (<a onClick="return mV(\'Jhn\',10,9);">10:9</A>). In his capacity as Shepherd Christ is preeminently all that a faithful shepherd ought to be. The highest proof of His love is that, as the Good Shepherd, He lays down His life for the sheep (<a onClick="return mV(\'Jhn\',10,11,15,17);">10:11,15,17</a>). This laying down of His life is not an accident, but is His free, voluntary act (<a onClick="return mV(\'Jhn\',10,17,18);">10:17,18</a>). Again there was division among the Jews because of these remarkable sayings (<a onClick="return mV(\'Jhn\',10,19,20,21);">10:19-21</a>).<P>Chronological Note.<P>Though John does not mention the fact, there is little doubt that, after this visit to Jerusalem, Jesus returned to Galilee, and at no long interval from His return, took His final departure southward. The chronology of this closing period in Galilee is somewhat uncertain. Some would place the visit to the Feast of Tabernacles before the withdrawal to Caesarea Philippi, or even earlier (compare Andrews, Life of our Lord, etc.); but the order adopted above appears preferable.``132';
isbe[5023]='Jesus Christ, 4D`D. LAST JOURNEY TO JERUSALEM—JESUS IN PERAEA<P>Departure from Galilee:<P>An interval of two months elapses between <a onClick="return mV(\'Jhn\',10,21);">John 10:21</a> and <a onClick="return mV(\'Jhn\',10,22);">22</a>—from the Feast of Tabernacles (October) till the Feast of the Dedication (December). This period witnessed the final withdrawal of Jesus from Galilee. Probably while yet in Galilee He sent forth the seventy disciples to prepare His way in the cities to which He should come (<a onClick="return mV(\'Luk\',10,1);">Lu 10:1</a>). Repulsed on the borders of Samaria (<a onClick="return mV(\'Luk\',9,\'51-53\');">Lu 9:51-53</a>), He passed over into Peraea ("beyond Jordan"), where he exercised a considerable ministry. The record of this period, till the entry into Jerusalem, belongs in great part to Luke, who seems to have had a rich special source relating to it (<a onClick="return mV(\'Luk\',9,51);">9:51-19:27</a>). The discourses in Luke embrace many passages and sections found in other connections in Matthew, and it is difficult, often, to determine their proper chronological place, if, as doubtless sometimes happened, portions were not repeated.<P>I. From Leaving Galilee till the Feast of the Dedication.<P>1. Rejected by Samaria:<P>(<a onClick="return mV(\'Luk\',9,\'51-55\');">Luke 9:51-55</a>)<P>Conscious that He went to suffer and die, Jesus steadfastly set His face to go to Jerusalem. His route was first by Samaria—an opportunity of grace to that people—but here, at a border village, the messengers He sent before Him, probably also He Himself on His arrival, were repulsed, because of His obvious intention to go to Jerusalem (<a onClick="return mV(\'Luk\',9,53);">Lu 9:53</a>). James and John wished to imitate Elijah in calling down fire from heaven on the rejecters, but Jesus rebuked them for their thought (the Revised Version (British and American) omits the reference to Elijah, and subsequent clauses, <a onClick="return mV(\'Luk\',9,55,56);">Lu 9:55,56</a>).<P>2. Mission of the Seventy:<P>(<a onClick="return mV(\'Luk\',10,\'1-20\');">Luke 10:1-20</a>)<P>In the present connection Luke inserts the incidents of the three aspirants formerly considered (<a onClick="return mV(\'Luk\',9,\'57-62\');">9:57-62</a>; compare p. 1645). It was suggested that the second and third cases may belong to this period.<P>A new and significant step was now taken by Jesus in the sending out of 70 disciples, who should go before Him, two by two, to announce His coming in the cities and villages He was about to visit. The number sent indicates how large a following Jesus had now acquired. (Some see a symbolical meaning in the number 70, but it is difficult to show what it is.) The directions given to the messengers are similar to those formerly given to the Twelve (<a onClick="return mV(\'Luk\',9,\'1-5\');">Lu 9:1-5</a>; compare <a onClick="return mV(\'Mat\',10,\'1-\');">Mt 10</a>); a passage also found in Matthew in a different connection (<a onClick="return mV(\'Mat\',11,\'21-24\');">11:21-24</a>) is incorporated in this discourse, or had originally its place in it (<a onClick="return mV(\'Mat\',11,\'13-15\');">11:13-15</a>). In this mission Jesus no longer made any secret of His Messianic character. The messengers were to proclaim that the kingdom of God was come nigh to them in connection with His impending visit (<a onClick="return mV(\'Luk\',10,9);">Lu 10:9</a>). The mission implies that a definite route was marked out by Jesus for Himself (compare <a onClick="return mV(\'Luk\',13,22);">Lu 13:22</a>), but this would be subject to modification according to the reception of His emissaries (<a onClick="return mV(\'Luk\',10,10,11,16);">Lu 10:10,11,16</a>). The circuit need not have occupied a long time with so many engaged in it. The results show that it aroused strong interest. Later the disciples returned elated with their success, emphasizing their victory over the demons (<a onClick="return mV(\'Luk\',10,17);">Lu 10:17</a>). Jesus bade them rejoice rather that their names were written in heaven (<a onClick="return mV(\'Luk\',10,20);">Lu 10:20</a>). Again a passage is inserted (<a onClick="return mV(\'Luk\',10,21,22);">Lu 10:21,22</a>) found earlier in <a onClick="return mV(\'Mat\',11,\'25-27\');">Mt 11:25-27</a>; compare also <a onClick="return mV(\'Luk\',10,23,24);">Lu 10:23,24</a>, with <a onClick="return mV(\'Mat\',13,16,17);">Mt 13:16,17</a>.<P>3. The Lawyer\'s Question—Parable of Good Samaritan:<P>(<a onClick="return mV(\'Luk\',10,\'25-37\');">Luke 10:25-37</a>)<P>Jesus had now passed "beyond the Jordan," i.e. into Peraea, and vast crowds waited on His teaching (compare <a onClick="return mV(\'Mat\',19,1);">Mt 19:1</a>f; <a onClick="return mV(\'Mar\',10,1);">Mr 10:1</a>; <a onClick="return mV(\'Luk\',12,\'1-\');">Lu 12:1</a>). At one place a lawyer put what he meant to be a testing question, "What shall I do to inherit eternal life?" Jesus referred him to the great commandments of love to God and one\'s neighbor, eliciting the further query, "And who is my neighbor?" In reply Jesus spoke to him the immortal parable of the Good Samaritan, and asked who proved neighbor to him who fell among the robbers. The lawyer could give but one answer, "He that showed mercy on him." "Go," said Jesus, "and do thou likewise."<P>The incident of Martha and Mary, which Luke inserts here (<a onClick="return mV(\'Luk\',10,\'38-42\');">Lu 10:38-42</a>), comes in better later, when Jesus was nearer Bethany.<P>4. Discourses, Parables, and Miracles:<P>(<a onClick="return mV(\'Luk\',11,1);">Luke 11-14</a>)<P>At this place Luke brings together a variety of discourses, warnings and exhortations, great parts of which have already been noticed in earlier contexts. It does not follow that Luke has not, in many cases, preserved the original connection. This is probably the case with the Lord\'s Prayer (<a onClick="return mV(\'Luk\',11,\'1-4\');">Lu 11:1-4</a>), and with portions of what Matthew includes in the Sermon on the Mount (e.g. <a onClick="return mV(\'Mat\',11,\'9-13\',\'13-36\');">11:9-13,13-36</a>; <a onClick="return mV(\'Luk\',12,\'22-34\');">12:22-34</a>; compare <a onClick="return mV(\'Luk\',13,\'24-27\');">Lu 13:24-27</a> with <a onClick="return mV(\'Mat\',7,13,14,22,23);">Mt 7:13,14,22,23</a>), and in other discourses (e.g. <a onClick="return mV(\'Luk\',11,\'42-52\');">Lu 11:42-52</a> = <a onClick="return mV(\'Mat\',23,\'23-36\');">Mt 23:23-36</a>; <a onClick="return mV(\'Luk\',12,\'2-12\');">Lu 12:2-12</a> = <a onClick="return mV(\'Mat\',10,\'26-33\');">Mt 10:26-33</a>; <a onClick="return mV(\'Luk\',12,\'42-48\');">Lu 12:42-48</a> = <a onClick="return mV(\'Mat\',24,\'45-51\');">Mt 24:45-51</a>; <a onClick="return mV(\'Luk\',13,\'18-21\');">Lu 13:18-21</a>, parables of Mustard Seed and Leaven = <a onClick="return mV(\'Mat\',13,31,32);">Mt 13:31,32</a>, etc.).<P>a) Original to Luke:<P>Of matter original to Luke in these chapters may be noted such passages as that on the Friend at Midnight (<a onClick="return mV(\'Luk\',11,\'5-8\');">11:5-8</a>), the incident of the man who wished Jesus to bid his brother divide his inheritance with him, to whom Jesus spoke the parable of the Rich Fool (<a onClick="return mV(\'Luk\',12,\'13-21\');">12:13-21</a>), the parable of the Barren Fig Tree, called forth by the disposition to regard certain Galileans whom Pilate had slain in a tumult at the temple, and eighteen on whom the tower of Siloam had fallen, as sinners above others (<a onClick="return mV(\'Luk\',13,\'1-9\');">13:1-9</a>: "Nay," said Jesus, "but, except ye repent, ye shall all likewise perish"), and most of the teaching in <a onClick="return mV(\'Luk\',14,\'1-\');">Luke 14</a>, referred to below. In <a onClick="return mV(\'Luk\',11,37,38);">11:37,38</a>, we have the mention of a Pharisee inviting Jesus to dine, and of his astonishment at the Lord\'s neglect of the customary ablutions before eating. <a onClick="return mV(\'Luk\',11,53);">Luke 11:53</a> gives a glimpse of the fury to which the scribes and Pharisees were aroused by the severity of Christ\'s denunciations. They "began to press upon him vehemently...laying wait for him, to catch something out of his mouth." In <a onClick="return mV(\'Luk\',13,31);">13:31</a>ff it is told how the Pharisees sought to frighten Jesus from the district by telling Him that Herod would fain kill Him. Jesus bade them tell that "fox" that His work would go on uninterruptedly in the brief space that remained ("day" used enigmatically) till He was "perfected" (<a onClick="return mV(\'Luk\',13,32);">13:32</a>). The woe on Jerusalem (<a onClick="return mV(\'Luk\',13,34,35);">13:34,35</a>) is given by Matthew in the discourse in chapter <a onClick="return mV(\'Mat\',23,\'1-\');">23</a>.<P>b) The Infirm Woman—the Dropsied Man:<P>Of the miracles in this section, the casting out of the demon that was mute (<a onClick="return mV(\'Luk\',11,14);">Lu 11:14</a>) is evidently the same incident as that already noted in <a onClick="return mV(\'Mat\',12,22);">Mt 12:22</a>ff. Two other miracles are connected with the old accusation of Sabbath breaking. One was the healing in a synagogue on the Sabbath day of a woman bowed down for 18 years with "a spirit of infirmity" (<a onClick="return mV(\'Luk\',13,\'10-17\');">Lu 13:10-17</a>); the other was the cure on the Sabbath of a man afflicted with dropsy at a feast in the house of a ruler of the Pharisees to which Jesus had been invited (<a onClick="return mV(\'Luk\',14,\'1-6\');">Lu 14:1-6</a>). The motive of the Pharisee\'s invitation, as in most such cases, was hostile (<a onClick="return mV(\'Luk\',14,1);">Lu 14:1</a>). In both instances Jesus met the objection in the same way, by appealing to their own acts of humanity to their animals on the Sabbath (<a onClick="return mV(\'Luk\',13,15,16);">Lu 13:15,16</a>; <a onClick="return mV(\'Luk\',14,5);">14:5</a>).<P>c) Parable of the Great Supper:<P>This feast at the Pharisee\'s house had an interesting sequel in the discourse it led Jesus to utter against vainglory in feasting, and on the spirit of love which would prompt to the table being spread for the helpless and destitute rather than for the selfish enjoyment of the select few, closing, in answer to a pious ejaculation of one of the guests, with the parable of the Great Supper (<a onClick="return mV(\'Luk\',14,\'7-24\');">Lu 14:7-24</a>). The parable, with its climax in the invitation to bring in the poor, and maimed, and blind, and those from the highways and hedges, was a commentary on the counsels He had just been giving, but it had its deeper lesson in picturing the rejection by the Jews of the invitation to the feast God had made for them in His kingdom, and the call that would be given to the Gentiles to take their place.<P>d) Counting the Cost:<P>The injunctions to the multitudes as to the sacrifice and cross-bearing involved in discipleship are pointed by the examples of a man building a tower, and a king going to war, who count the cost before entering on their enterprises (<a onClick="return mV(\'Luk\',14,\'25-35\');">Lu 14:25-35</a>).<P>5. Martha and Mary:<P>At or about this time—perhaps before the incidents in <a onClick="return mV(\'Luk\',14,\'1-\');">Lu 14</a>—Jesus paid the visit to Jerusalem at the Feast of the Dedication described in <a onClick="return mV(\'Jhn\',10,\'22-39\');">Joh 10:22-39</a>. This seems the fitting place for the introduction of the episode of Martha and Mary which Luke narrates a little earlier (<a onClick="return mV(\'Luk\',10,\'38-42\');">10:38-42</a>). The "village" into which Jesus entered was no doubt Bethany (<a onClick="return mV(\'Jhn\',11,1);">Joh 11:1</a>). The picture given by Luke of the contrasted dispositions of the two sisters—Martha active and "serving" (compare <a onClick="return mV(\'Jhn\',12,2);">Joh 12:2</a>), Mary retiring and contemplative—entirely corresponds with that in John. Martha busied herself with preparations for the meal; Mary sat at Jesus\' feet, and heard His word. To Martha\'s complaint, as if her sister were idling, Jesus gave the memorable answer, "One thing is needful: for Mary hath chosen the good part," etc. (<a onClick="return mV(\'Luk\',10,42);">Lu 10:42</a>).<P>6. Feast of the Dedication:<P>(<a onClick="return mV(\'Jhn\',10,\'22-39\');">John 10:22-39</a>)<P>The Feast of the Dedication, held in December, was in commemoration of the cleansing of the temple and restoration of its worship after its profanation by Antiochus Epiphanes (164 BC). Great excitement was occasioned by the appearance of Jesus at this feast, and some asked, "How long dost thou hold us in suspense? If thou art the Christ, tell us plainly." Jesus said He had told them, and His works attested His claim, but they were not of His true flock, and would not believe. To His own sheep He gave eternal life. The Jews anew wished to stone Him for claiming to be God. Jesus replied that even the law called the judges of Israel "gods" (<a onClick="return mV(\'Psa\',82,6);">Ps 82:6</a>, "I said, Ye are gods, and all of you sons of the Most High") how could it then be blasphemy for Him whom the Father had sanctified and sent into the world to say of Himself, "I am the Son of God"? The Jews sought to take Him, but He passed from their midst.<P>II. From the Abode at Bethabara till the Raising of Lazarus.<P>After leaving Jerusalem Jesus went beyond Jordan again to the place where John at first baptized (<a onClick="return mV(\'Jhn\',10,40);">Joh 10:40</a>; compare <a onClick="return mV(\'Jhn\',1,28);">Joh 1:28</a>, called in the King James Version "Bethabara," in the Revised Version (British and American) "Bethany," distinct from the Bethany of <a onClick="return mV(\'Jhn\',11,\'1-\');">John 11</a>). There He "abode," implying a prolonged stay, and many resorted to Him. This spot, sacred to Jesus by His own baptism, may be regarded now as His headquarters from which excursions would be made to places in the neighborhood. Several of the incidents recorded by Luke are probably connected with this sojourn. <p>1. Parables of Lost Sheep, Lost Piece of Silver, Prodigal Son:<P>(<a onClick="return mV(\'Luk\',15,\'1-\');">Luke 15</a>)<P>The stronger the opposition of scribes and Pharisees to Jesus became, the more by natural affinity did the classes regarded as outcast feel drawn to Him. He did not repel them, as the Pharisees did, but ate and drank with them. Publicans and sinners gathered to His teaching, and He associated with them. The complaining was great: "This man receiveth sinners, and eateth with them." The defense of Jesus was in parables, and the Pharisees\' reproach may be thanked for three of the most beautiful parables Jesus ever spoke—the Lost Sheep (compare <a onClick="return mV(\'Mat\',18,\'12-14\');">Mt 18:12-14</a>), the Lost Piece of Silver, and the Prodigal Son (<a onClick="return mV(\'Luk\',15,\'1-\');">Luke 15</a>). Why does the shepherd rejoice more over the one lost sheep brought back than over the ninety-nine that have not gone astray? Why does the woman rejoice more over the recovery of her lost drachma than over all the coins safe in her keeping? Why does the father rejoice more over the prodigal son come back in rags and penitence from the far country than over the obedient but austere brother that had never left the home? The stories were gateways into the inmost heart of God. There is joy in heaven over one sinner that repenteth more than over ninetynine just persons that need no repentance (<a onClick="return mV(\'Luk\',15,7);">Lu 15:7</a>).<P>2. Parables of the Unjust Steward and the Rich Man and Lazarus:<P>(<a onClick="return mV(\'Luk\',16,\'1-\');">Luke 16</a>)<P>Two other parables, interspersed by discourses (in part again met with in other connections, compare <a onClick="return mV(\'Luk\',16,13);">Lu 16:13</a> with <a onClick="return mV(\'Mat\',6,24);">Mt 6:24</a>; <a onClick="return mV(\'Luk\',16,16);">Lu 16:16</a> with <a onClick="return mV(\'Mat\',11,12);">Mt 11:12</a>; <a onClick="return mV(\'Luk\',16,18);">Lu 16:18</a> with <a onClick="return mV(\'Mat\',5,32);">Mt 5:32</a>; <a onClick="return mV(\'Mat\',19,9);">19:9</a>, etc.), were spoken at this time—that of the Unjust Steward (<a onClick="return mV(\'Luk\',16,\'1-9\');">Lu 16:1-9</a>) and that of the Rich Man and Lazarus (<a onClick="return mV(\'Luk\',16,\'19-31\');">Lu 16:19-31</a>). The dishonest steward, about to be dismissed, utilized his opportunities, still dishonestly, to make friends of his master\'s creditors; let the "children of light" better his example by righteously using mammon to make friends for themselves, who shall receive them into everlasting habitations. The rich man, pampered in luxury, let the afflicted Lazarus starve at his gate. At death—in Hades—the positions are reversed: the rich man is in torment, stripped of all he had enjoyed; the poor man is at rest in Abraham\'s bosom, compensated for all he suffered. It is character, not outward estate, that determines destiny. The unmerciful are doomed. Even a messenger from the unseen world will not save men, if they hear not Moses and the prophets (<a onClick="return mV(\'Luk\',16,31);">Lu 16:31</a>).<P>In this connection Luke (<a onClick="return mV(\'Luk\',17,\'1-10\');">17:1-10</a>) places exhortations to the disciples on occasions of stumbling, forgiveness, the power of faith, renunciation of merit ("We are unprofitable servants"), some of which are found elsewhere (compare <a onClick="return mV(\'Mat\',18,6,7,15,21);">Mt 18:6,7,15,21</a>, etc.).<P>3. The Summons to Bethany—Raising of Lazarus:<P>(<a onClick="return mV(\'Jhn\',11,1);">John 11</a>)<P>While Jesus was in the trans-Jordanic Bethabara, or Bethany, or in its neighborhood, a message came to Him from the house of Martha and Mary in the Judean Bethany (on the Mount of Olives, about 2 miles east from Jerusalem), that His friend Lazarus ("he whom thou lovest") was sick. The conduct of Jesus seemed strange, for He abode still two days where He was (<a onClick="return mV(\'Jhn\',11,6);">Joh 11:6</a>). As the sequel showed, this was only for the end of a yet more wonderful manifestation of His power and love, to the glory of God (<a onClick="return mV(\'Jhn\',11,4);">Joh 11:4</a>). Meanwhile Lazarus died, and was buried. When Jesus announced His intention of going into Judea, the disciples sought hard to dissuade Him (<a onClick="return mV(\'Jhn\',11,8);">Joh 11:8</a>); but Jesus was not moved by the fears they suggested. He reached Bethany (a distance of between 20 and 30 miles) on the fourth day after the burial of Lazarus (<a onClick="return mV(\'Jhn\',11,17);">Joh 11:17</a>), and was met on the outskirts by Martha, and afterward by Mary, both plunged in deepest sorrow. Both breathed the same plaint: "Lord, if thou hadst been here, my brother had not died" (<a onClick="return mV(\'Jhn\',11,21,32);">Joh 11:21,32</a>). To Martha Jesus gave the pledge, "Thy brother shall rise again," strengthening the faith she already had expressed in Him (<a onClick="return mV(\'Jhn\',11,22);">Joh 11:22</a>) by announcing Himself as "the resurrection, and the life" (<a onClick="return mV(\'Jhn\',11,25,26);">Joh 11:25,26</a>); at Mary\'s words He was deeply moved, and asked to be taken to the tomb. Here, it is recorded, "Jesus wept" (<a onClick="return mV(\'Jhn\',11,35);">Joh 11:35</a>), the only other instance of His weeping in the Gospels being as He looked on lost Jerusalem (<a onClick="return mV(\'Luk\',19,41);">Lu 19:41</a>). The proof of love was manifest, but some, as usual, suggested blame that this miracle-worker had not prevented His friend\'s death (<a onClick="return mV(\'Jhn\',11,37);">Joh 11:37</a>). Arrived at the rock-tomb, Jesus, still groaning in Himself, caused the stone at its mouth to be removed, and, after prayer, spoke with a loud voice, "Lazarus, come forth" (<a onClick="return mV(\'Jhn\',11,43);">Joh 11:43</a>). The spirit returned, and the man who had been dead came forth bound with his grave-clothes. He was released and restored to his sisters.<P>Even this mighty deed did not alter the mind of the Pharisees, who held a council, and decided, on the advice of Caiaphas (<a onClick="return mV(\'Jhn\',11,50);">Joh 11:50</a>), that for the safety of the nation it was "expedient" that this man should die.<P>The circumstantiality of this beautiful narrative speaks irresistibly for its historical truth, and the objections raised by critical writers center really in their aversion to the miraculous as such.<P>III. From the Retirement to Ephraim till the Arrival at Bethany.<P>1. Retreat to Ephraim:<P>(<a onClick="return mV(\'Jhn\',11,\'54-57\');">John 11:54-57</a>)<P>The hostility of the ruling classes was now so pronounced that, in the few weeks that remained till Jesus should go up to the Passover, He deemed it advisable to abide in privacy at a city called Ephraim (situation uncertain). That He was in secrecy during this period is implied in the statement (<a onClick="return mV(\'Jhn\',11,57);">Joh 11:57</a>) that if anyone knew where He was, he was to inform the chief priests and Pharisees. The retirement would be for Jesus a period of preparation for the ordeal before Him, as the wilderness had been for the commencement of His ministry.<P>2. The Journey Resumed:<P>On His leaving this retreat to resume His advance to Jerusalem the narratives again become rich in incident and teaching.<P>3. Cure of the Lepers:<P>(<a onClick="return mV(\'Luk\',17,\'11-19\');">Luke 17:11-19</a>)<P>It is not easy to define the route which brought Jesus again to the border line between Samaria and Galilee (<a onClick="return mV(\'Luk\',17,11);">Lu 17:11</a>), but, in traversing this region, He was met by ten lepers, who besought Him for a cure. Jesus bade them go and show themselves to the priests, and on the way they were cleansed. Only one of the ten, and he a Samaritan, returned to give thanks and glorify God. Gratitude appeared in the unlikely quarter.<P>4. Pharisaic Questionings:<P>At some point in this journey the Pharisees sought to entrap Jesus on the question of divorce.<P>a) Divorce:<P>(<a onClick="return mV(\'Mat\',19,\'3-12\');">Matthew 19:3-12</a>; <a onClick="return mV(\'Mar\',10,\'1-12\');">Mark 10:1-12</a>) Was it lawful for a man to put away his wife for every cause? (<a onClick="return mV(\'Mat\',19,3);">Mt 19:3</a>). Jesus in reply admitted the permission to divorce given by Moses (<a onClick="return mV(\'Mar\',10,\'3-5\');">Mr 10:3-5</a>), but declared that this was for the hardness of their hearts, and went back to the original institution of marriage in which the two so joined were declared to be "one flesh." Only one cause is admissible as a ground of separation and remarriage (<a onClick="return mV(\'Mat\',19,9);">Mt 19:9</a>; compare <a onClick="return mV(\'Mat\',5,31,32);">Mt 5:31,32</a>; Mark has not even the exception, which is probably, however, implied). Comments follow to the disciples in Matthew on the subject of continence (<a onClick="return mV(\'Mat\',19,\'10-12\');">Mt 19:10-12</a>).<P>See <a href="./study/isbe/search.html?string=DIVORCE">DIVORCE</a>.<P>b) Coming of the Kingdom:<P>(<a onClick="return mV(\'Luk\',17,\'20-37\');">Luke 17:20-37</a>)<P>Another question asked by the Pharisees of Jesus was as to when the kingdom of God should come. The expectation excited by His own ministry and claims was that it was near; when should it appear? Rebuking their worldly ideas, Jesus warned them that the kingdom did not come "with observation"—was not a "Lo, there! Lo, here!"; it was "within" them, or "in their midst," though they did not perceive it. In the last decisive coming of the Son of Man there would be no dubiety as to His presence (<a onClick="return mV(\'Luk\',17,24,25);">Lu 17:24,25</a>). He adds exhortations as to the suddenness of His coming, and the separations that would ensue (<a onClick="return mV(\'Luk\',17,\'26-37\');">Lu 17:26-37</a>), which Matthew gives as part of the great discourse on the Last Things in chapter <a onClick="return mV(\'Mat\',24,\'1-\');">24</a>.<P>c) Parable of the Unjust Judge:<P>(<a onClick="return mV(\'Luk\',18,\'1-8\');">Luke 18:1-8</a>)<P>In close connection with the foregoing, as furnishing the ground for the certainty that this day of the Son of Man would come, Jesus spoke the parable of the Unjust Judge. This judge, though heedless of the claims of right, yet yielded to the widow\'s importunity, and granted her justice against her adversary. How much more surely will the righteous, long-suffering God avenge His own elect, who cry unto Him day and night (<a onClick="return mV(\'Luk\',18,7,8);">Lu 18:7,8</a>)! Yet men, in that supreme hour, will almost have lost faith in His coming (<a onClick="return mV(\'Luk\',18,8);">Lu 18:8</a>).<P>A series of sayings and incidents at this time throw light upon the spirit of the kingdom.<P>5. The Spirit of the Kingdom:<P>The spirit of self-righteousness is rebuked and humble penitence as the condition of acceptance is enforced in the parable of the Pharisee and Publican.<P>a) Parable of Pharisee and Publican:<P>(<a onClick="return mV(\'Luk\',18,\'9-14\');">Luke 18:9-14</a>)<P>The Pharisee posing in his self-complacency at his fastings and tithes, and thanking God for his superiority to others, is set in vivid contrast to the abased publican, standing afar off, and able only to say, "God, be thou merciful to me a sinner" (<a onClick="return mV(\'Luk\',18,13);">Lu 18:13</a>). Yet it was he who went down to his house "justified" (<a onClick="return mV(\'Luk\',18,14);">Lu 18:14</a>).<P>b) Blessing of the Babies:<P>(<a onClick="return mV(\'Mat\',19,\'13-15\');">Matthew 19:13-15</a>; <a onClick="return mV(\'Mar\',10,\'13-16\');">Mark 10:13-16</a>; <a onClick="return mV(\'Luk\',18,\'15-17\');">Luke 18:15-17</a>)<P>A similar lesson is inculcated in the beautiful incident of the blessing of the babes. The disciples rebuked the mothers for bringing their little ones, but Jesus, "moved with indignation" (Mark), received and blessed the babes, declaring that to such (to them and those of like spirit) belonged the kingdom of heaven. "Suffer the little children, and forbid them not, to come unto me," etc.<P>c) The Rich Young Ruler:<P>(<a onClick="return mV(\'Mat\',19,\'16-30\');">Matthew 19:16-30</a>; <a onClick="return mV(\'Mar\',10,\'17-31\');">Mark 10:17-31</a>; <a onClick="return mV(\'Luk\',18,\'18-30\');">Luke 18:18-30</a>)<P>A third illustration—this time of the peril of covetousness—is afforded by the incident of the rich young ruler. This amiable, blameless, and evidently sincere young man ("Jesus looking upon him loved him," <a onClick="return mV(\'Mar\',10,21);">Mr 10:21</a>) knelt, and addressing Jesus as "Good Teacher," asked what he must do to inherit eternal life. Jesus first declined the term "good," in the easy, conventional sense in which it was applied, then referred the ruler to the commandments as the standard of doing. All these, however, the young man averred he had observed from his youth up. He did not know himself. Jesus saw the secret hold his riches had upon his soul, and revealed it by the searching word, "If thou wouldest be perfect, go, sell that which thou hast," etc. (<a onClick="return mV(\'Mat\',19,21);">Mt 19:21</a>; compare Mark, "One thing thou lackest," etc.). This was enough. The young man could not yield up his "great possessions," and went away sorrowing. Jesus bases on his refusal earnest warnings against the love of riches, and points out, in answer to a question of Peter, that loss for His sake in this life is met with overwhelmingly great compensations in the life to come.<P>6. Third Announcement of the Passion:<P>(<a onClick="return mV(\'Mat\',20,\'17-19\');">Matthew 20:17-19</a>; <a onClick="return mV(\'Mar\',10,\'32-34\');">Mark 10:32-34</a>; <a onClick="return mV(\'Mar\',18,\'31-33\');">18:31-33</a>)<P>Not unconnected with the foregoing teachings is the third solemn announcement to the disciples, so hard to be persuaded that the kingdom was not immediately to be set up in glory, of His approaching sufferings and death, followed by resurrection. The disciples had been "amazed" and "afraid" (Mark) at something strange in the aspect and walk of Jesus as they Luke were on the way, going to Jerusalem (compare <a onClick="return mV(\'Luk\',9,51);">Lu 9:51</a>). His words gave the explanation. With them should be taken what is said in a succeeding incident of His baptism of suffering (<a onClick="return mV(\'Mar\',10,38,39);">Mr 10:38,39</a>; compare <a onClick="return mV(\'Luk\',12,50);">Lu 12:50</a>).<P>7. The Rewards of the Kingdom:<P>The spirit of the kingdom and sacrifice for the kingdom have already been associated with the idea of reward, but the principles underlying this reward are now made the subject of special teaching.<P>First by the parable of the Laborers in the Vineyard the lesson is inculcated that reward in the kingdom is not according to any legal rule, but is governed by a Divine equity, in accordance with which the last may often be equal to, or take precedence of, the first.<P>a) Parable of the Laborers in the Vineyard:<P>(<a onClick="return mV(\'Mat\',20,\'1-17\');">Matthew 20:1-17</a>)<P>The laborers were hired at different hours, yet all at the end received the same wage. The murmuring at the generosity of the householder of those who had worked longest betrayed a defectiveness of spirit which may explain why they were not more highly rewarded. In strictness, the kingdom is a gift of grace, in the sum total of its blessings one and the same to all.<P>b) The Sons of Zebedee:<P>(<a onClick="return mV(\'Mat\',20,\'20-28\');">Matthew 20:20-28</a>; <a onClick="return mV(\'Mar\',10,\'35-45\');">Mark 10:35-45</a>)<P>Still there are distinctions of honor in God\'s kingdom, but these are not arbitrarily made. This is the lesson of the reply of Jesus to the plea of the mother of the sons of Zebedee, James and John, with, apparently, the concurrence of the apostles themselves, that they might sit one on the right hand and the other on the left hand in His kingdom. It was a bold and ambitious request, and naturally moved the indignation of the other apostles. Still it had its ground in a certain nobility of spirit. For when Jesus asked if they were able to drink of His cup and be baptized with His baptism, they answered, "We are able." Jesus told them they should share that lot of suffering, but to sit on His right hand and on His left were not favors that could be arbitrarily bestowed, but would be given to those for whom it had been prepared of His Father—the preparation having regard to character and fitness, of which the Father alone was judge. Jesus went on to rebuke the spirit which led one to seek prominence over another, and laid down the essential law, "Whosoever would become great among you shall be your minister," enforcing it by His own never-to-be-forgotten example, "Even as the Son of man came not to be ministered unto, but to minister, and to give his life a ransom, for many" (<a onClick="return mV(\'Mat\',20,28);">Mt 20:28</a>; <a onClick="return mV(\'Mar\',10,45);">Mr 10:45</a>).<P>8. Jesus at Jericho:<P>Accompanied by a great throng, possibly of pilgrims to the feast, Jesus drew near to the influential city of Jericho, in the Jordan valley, about 17 miles distant from Jerusalem. Here two notable incidents marked His progress.<P>a) The Cure of Bartimeus:<P>(<a onClick="return mV(\'Mat\',20,\'29-34\');">Matthew 20:29-34</a>; <a onClick="return mV(\'Mat\',10,\'46-52\');">Mark 10:46-52</A>; <a onClick="return mV(\'Luk\',18,\'35-43\');">Luke 18:35-43</a>)<P>As they approached the city (Luke) (Matthew and Mark place the incident as they "went out") a blind beggar, Bartimeus, hearing that "Jesus the Nazarene" (Mark) passed by, loudly called on Him as the "Son of David" to have mercy on him. The multitude would have restrained the man, but their rebukes only made him the more urgent in his cries. Jesus stopped in His way, called the blind man to Him, then, when he came, renewing his appeal, healed him. The cry of the beggar shows that the Davidic descent, if not the Messiahship, of Jesus was now known. Matthew varies from the other evangelists in speaking of "two blind men," while Matthew and Mark, as noted, make the cure take place on leaving, not on entering the city. Not improbably there are two healings, one on entering Jericho, the other on going from the city, and Matthew, after his fashion, groups them together (Luke\'s language is really indefinite; literally, "as they were near to Jericho").<P>b) Zaccheus the Publican:<P>(<a onClick="return mV(\'Luk\',19,\'1-10\');">Luke 19:1-10</a>)<P>The entrance of Jesus into Jericho was signalized by a yet more striking incident. The chief collector of revenue in the city was Zaccheus, rich, but held in opprobrium ("a sinner") because of his occupation. Being little of stature, Zaccheus had climbed into the branches of a sycomore tree to see Jesus as He passed. To his amazement, and that of the crowd, Jesus stopped on His way, and called Zaccheus by name to hasten to come down, for that day He must abide at his house. Zaccheus joyfully received Him, and, moved to a complete change in his views of duty, declared his purpose of giving half his goods to the poor, and of restoring fourfold anything he might have taken by false accusation. It was a revolution in the man\'s soul, wrought by love. "Today," Jesus testified, "is salvation come to this house ..... For the Son of man came to seek and to save that which was lost."<P>c) Parable of the Pounds:<P>(<a onClick="return mV(\'Luk\',19,\'11-27\');">Luke 19:11-27</a>)<P>The expectations of the multitude that the kingdom of God should immediately appear led Jesus to speak the parable of the Pounds, forewarning them that the consummation they looked for might be longer delayed than they thought, and impressing on them the need of loyalty, faithfulness and diligence, if that day, when it came, was not to prove disastrous to them. The nobleman went into a "far country" to receive a kingdom, and his ten servants were to trade with as many pounds (each = 100 drachmas) in his absence. On his return the faithful servants were rewarded in proportion to their diligence; the faithless one lost what he had; the rebellious citizens were destroyed. Thus Jesus fore-shadowed the doom that would overtake those. who were plotting against Him, and checked hopes that disregarded the moral conditions of honor in His kingdom.<P>Arrival at Bethany.<P>From Jericho Jesus moved on to Bethany, the abode of Lazarus and his sisters. To His halt here before His public entrance into Jerusalem the next events belong.``132';
isbe[5024]='Jesus Christ, 4E1`E. THE PASSION WEEK—BETRAYAL, TRIAL AND CRUCIFIXION<P>Importance of the Last Events:<P>We reach now the closing week and last solemn events of the earthly life of Jesus. The importance attached to this part of their narratives is seen by the space the evangelists devote to it. Of the Gospels of Matthew and Mark fully one-third is devoted to the events of the Passion Week and their sequel in the resurrection; Luke has several chapters; John gives half his Gospel to the same period. It is obvious that in the minds of the evangelists the crucifixion of Jesus is the pivot of their whole narrative—the denouement to which everything tends from the first.<P>I. The Events Preceding the Last Super.<P>1. The Chronology:<P>The arrival in Bethany is placed by John "six days before the Passover" (<a onClick="return mV(\'Jhn\',12,1);">12:1</A>). Assuming that the public entry into Jerusalem took place on the Sunday, and that the 14th of Nisan fell on the following Thursday, this would lead to the arrival being placed on the Friday or Saturday preceding, according to the mode of reckoning. It is in the highest degree unlikely that Jesus would journey from Jericho on the Jewish Sabbath; hence He may be supposed to have arrived on the Friday evening. The supper at which the anointing by Mary took place would be on the Saturday (Sabbath) evening. Matthew and Mark connect it with events two days before the Passover (<a onClick="return mV(\'Mat\',26,2);">Mt 26:2</a>; <a onClick="return mV(\'Mar\',14,1);">Mr 14:1</a>), but parenthetically, in a way which leaves the other order open.<P>2. The Anointing at Bethany:<P>(<a onClick="return mV(\'Mat\',26,\'6-13\');">Matthew 26:6-13</a>; <a onClick="return mV(\'Mar\',14,\'3-9\');">Mark 14:3-9</a>; <a onClick="return mV(\'Jhn\',12,\'1-9\');">John 12:1-9</a>)<P>This beautiful deed occurred at a supper given in honor of Jesus at the house of one Simon, a leper (Matthew and Mark)—probably cured by Jesus—at which Martha, Mary and Lazarus were guests. Martha aided in serving (<a onClick="return mV(\'Jhn\',12,2);">Joh 12:2</a>). In the course of the meal, or at its close, Mary brought a costly box of nard (valued by Judas at "300 shillings," about $50, or 10 pounds; compare the American Revised Version margin on <a onClick="return mV(\'Jhn\',6,7);">Joh 6:7</a>), and with the perfume anointed the head (Matthew, Mark) and feet (John) of Jesus, wiping His feet with her hair (Matthew and Mark, though not mentioning the "feet," speak of the "body" of Jesus). Indignation, instigated by Judas (John), was at once awakened at what was deemed wanton waste. How much better had the money been given to the poor! Jesus vindicated Mary in her loving act—a prophetic anointing for His burial—and declared that wherever His gospel went, it would be spoken of for a memorial of her. It is the hearts from which such acts come that are the true friends of the poor. The chief priests were only the further exasperated at what was happening, and at the interest shown in Lazarus, and plotted to put Lazarus also to death (<a onClick="return mV(\'Jhn\',12,10);">Joh 12:10</a>).<P>3. The Entry into Jerusalem:<P>(<a onClick="return mV(\'Mat\',21,\'1-11\');">Matthew 21:1-11</a>; <a onClick="return mV(\'Mar\',11,\'1-11\');">Mark 11:1-11</a>; <a onClick="return mV(\'Luk\',19,\'29-44\');">Luke 19:29-44</a>; <a onClick="return mV(\'Jhn\',12,\'12-19\');">John 12:12-19</a>)<P>On the day following—Palm Sunday—Jesus made His public entry as Messiah into Jerusalem. All the evangelists narrate this event. The Mount of Olives had to be crossed from Bethany, and Jesus sent two disciples to an adjacent village—probably Bethphage (this seems to have been also the name of a district)—where an ass and its colt would be found tied. These they were to bring to Him, Jesus assuring them of the permission of the owners. Garments were thrown over the colt, and Jesus seated Himself on it. In this humble fashion (as Matthew and John note, in fulfillment of prophecy, <a onClick="return mV(\'Zec\',9,9);">Zec 9:9</a>), He proceeded to Jerusalem, from which a multitude, bearing palm branches, had already come out to meet Him (John). Throngs accompanied Him, going before and after; these, spreading their garments, and strewing branches in the way, hailed Him with hosannas as the Son of David, the King of Israel, who came in the name of the Lord. Very different were the feelings in the breasts of the Pharisees. "Behold," they said, "how ye prevail nothing; lo, the world is gone after him" (<a onClick="return mV(\'Jhn\',12,19);">Joh 12:19</a>). They bade Jesus rebuke His disciples, but Jesus replied that if they were silent, the very stones would cry out (<a onClick="return mV(\'Luk\',19,40);">Lu 19:40</a>).<P>Jesus Weeping over Jerusalem—Return to Bethany.<P>One incident in this progress to Jerusalem is related only by <a onClick="return mV(\'Luk\',19,\'41-44\');">Lu 19:41-44</a>. As at a bend in the road Jerusalem became suddenly visible, Jesus paused and wept over the city, so blind to its day of visitation, and so near to its awful doom. Not His own sufferings, but the thought of Jerusalem\'s guilt and woes, filled Him with anguish. On reaching the city, Mark\'s testimony is explicit that He did no more than enter the temple, and \'look round on all things\' (<a onClick="return mV(\'Mar\',11,11);">Mr 11:11</a>). Then eventide having come, He returned to Bethany with the Twelve.<P>4. Cursing of the Fig Tree—Second Cleansing of Temple:<P>(<a onClick="return mV(\'Mat\',21,\'12-22\');">Matthew 21:12-22</a>; <a onClick="return mV(\'Mar\',11,\'12-26\');">Mark 11:12-26</a>; <a onClick="return mV(\'Luk\',19,\'45-48\');">Luke 19:45-48</a>)<P>The morning of Monday found Jesus and His disciples again on their way to the city. Possibly the early hours had been spent by Jesus in solitary prayer, and, as they went, it is recorded that "he hungered." A fig tree from which, from its foliage, fruit might have been expected, stood invitingly by the wayside, but when Jesus approached it, it was found to have nothing but leaves—a striking symbol of the outwardly religious, but spiritually barren Jewish community. And in this sense Jesus used it in pronouncing on it the word of doom, "No man eat fruit from thee henceforward for ever" (Mark). Next morning (Tuesday), as the disciples passed, the tree was found withered from the roots. Matthew combines the events of the cursing and the withering, placing both on the second day, but Mark more accurately distinguishes them. Jesus used the surprise of the disciples as the occasion of a lesson on the omnipotence of faith, with added counsels on prayer.<P>Were There Two Cleansings?<P>Pursuing His journey on the first morning, Jesus reached the temple, and there, as His first act, is stated by Matthew and Mark to have cleansed the temple of the traders. It is a diffcult question whether this is a second cleansing, or the same act as that recorded by John at the beginning of the ministry (<a onClick="return mV(\'Jhn\',2,\'13-22\');">Joh 2:13-22</a>; see above), and here narrated out of its chronological order. The acts are at least quite similar in character and significance. In favor of a second cleansing is the anger of the priests and scribes (<a onClick="return mV(\'Mar\',11,18);">Mr 11:18</a>; <a onClick="return mV(\'Luk\',19,47);">Lu 19:47</a>), and their demand next day for His authority. No other incidents are recorded of this visit to the temple, except the healing of certain blind and lame, and the praises of the children, "Hosanna to the son of David"—an echo of the previous day\'s proceedings (<a onClick="return mV(\'Mat\',21,\'14-16\');">Mt 21:14-16</a>). In the evening He went back to Bethany.<P>5. The Eventful Tuesday:<P>Far different is it with the third day of these visits of Jesus to the temple—the Tuesday of the Passion Week. This is crowded with parables, discourses, incidents, so numerous, impressive, tragical, as to oppress the mind in seeking to grasp how one short day could embrace them all. It was the last day of the appearance of Jesus in the temple (<a onClick="return mV(\'Jhn\',12,36);">Joh 12:36</a>), and marks His final break with the authorities of the nation, on whom His words of denunciation (<a onClick="return mV(\'Mat\',23,\'1-\');">Mt 23</a>) fell with overwhelming force. The thread of the day\'s proceedings may thus be briefly traced.<P>a) The Demand for Authority—Parables:<P>(<a onClick="return mV(\'Mat\',21,\'23-\');">Matthew 21:23</A>-<a onClick="return mV(\'Mat\',22,\'1-14\');">22:14</a>; <a onClick="return mV(\'Mar\',11,\'27-\');">Mark 11:27</A>-<a onClick="return mV(\'Mar\',12,\'1-12\');">12:12</a>; <a onClick="return mV(\'Luk\',20,\'1-18\');">Luke 20:1-18</a>)<P>On His first appearance in the temple on the Tuesday morning, Jesus was met by a demand from the chief priests, scribes and elders (representatives of the Sanhedrin), for the authority by which He acted as He did. Jesus met them by a counterquestion, "The baptism of John, was it from heaven, or from men?" The dilemma was obvious. If John was Divinely accredited, why did they not accept his testimony to Jesus? Yet they feared to say his mission was of men, for John was universally esteemed a prophet. They could therefore only lamely reply: "We cannot tell" (the King James Version). Matters had now come to an issue, and Jesus, reverting to the method of parable, set forth plainly their sin and its results to themselves and others.<P>The Two Sons—the Wicked Husbandmen—the Marriage of the King\'s Son.<P>The parables spoken on this occasion were: that of the Two Sons, one who said "I go not," but afterward repented and went, the other who said, "I go, sir," but went not—pointing the moral that the publicans and harlots went into the kingdom of God before the self-righteous leaders who rejected the preaching of John (<a onClick="return mV(\'Mat\',21,\'28-32\');">Mt 21:28-32</a>); that of the Wicked Husbandmen, who slew the servants, and finally the son, sent to them, and were at length themselves destroyed, the vineyard being given to others—a prophecy of the transferring of the kingdom to the Gentiles (Matthew, Mark, Luke); and that of the Marriage of the King\'s Son (<a onClick="return mV(\'Mat\',22,\'2-14\');">Mt 22:2-14</a>), akin to that of the Great Supper in <a onClick="return mV(\'Luk\',14,\'16-24\');">Lu 14:16-24</a> in its gathering in of the outcasts to take the place of those who had been bidden, but distinguished from it by the feature of the wedding garment, the lack of which meant being thrust into the outer darkness. The Pharisees easily perceived that these parables were spoken of them (<a onClick="return mV(\'Mat\',21,45);">Mt 21:45</a>; <a onClick="return mV(\'Mar\',12,12);">Mr 12:12</a>; <a onClick="return mV(\'Luk\',20,19);">Lu 20:19</a>), and were correspondingly enraged, yet dared not touch Jesus for fear of the people.<P>b) Ensnaring Questions, etc.:<P>(<a onClick="return mV(\'Mat\',22,\'1-46\');">Matthew 22:1-46</a>; <a onClick="return mV(\'Mar\',12,\'13-37\');">Mark 12:13-37</a>; <a onClick="return mV(\'Luk\',20,\'19-44\');">Luke 20:19-44</a>)<P>The attempt was next made on the part of the Pharisees, Herodians and Sadducees—now joined in a common cause—to ensnare Jesus by captious and compromising questions. These attempts He met with a wisdom and dignity which foiled His adversaries, while He showed a ready appreciation of a candid spirit when it presented itself, and turned the point against His opponents by putting a question on the Davidic sonship of the Messiah.<P>(1) Tribute to Caesar—the Resurrection—the Great Commandment.<P>First the Pharisees with the Herodians sought to entrap Him by raising the question of the lawfulness of tribute to Caesar. By causing them to produce a denarius bearing Caesar\'s image and superscription, Jesus obtained from them a recognition of their acceptance of Caesar\'s authority, and bade them render Caesar\'s things to Caesar, and God\'s to God. The Sadducees next tried Him with the puzzle of the wife who had seven husbands, leading up to denial of the resurrection; but Jesus met them by showing that marriage relations have no place in the resurrection life, and by pointing to the implication of a future life in God\'s word to Moses, "I am the God of Abraham," etc. God "is not the God of the dead, but of the living," a fact which carried with it all the weight of resurrection, as needed for the completion of the personal life. The candid scribe, who came last with His question as to which commandment was first of all, had a different reception. Jesus met Him kindly, satisfied him with His answer, and pronounced him "not far from the kingdom of God" (<a onClick="return mV(\'Mar\',12,34);">Mr 12:34</a>).<P>(2) David\'s Son and Lord.<P>The adversaries were silenced, but Jesus now put to them His own question. If David in <a onClick="return mV(\'Psa\',110,\'1-\');">Ps 110</a> could say "Yahweh saith unto my lord, Sit thou on my right hand," etc., how was this reconcilable with the Christ being David\'s son? The question was based on the acceptance of the oracle as spoken by David, or one of his house, of the Messiah, and was intended to suggest the higher nature of Christ as one with God in a Divine sovereignty. David\'s son was also David\'s Lord.<P>c) The Great Denunciation:<P>(<a onClick="return mV(\'Mat\',23,\'1-\');">Matthew 23</a>; <a onClick="return mV(\'Mar\',12,\'38-40\');">Mark 12:38-40</a>; <a onClick="return mV(\'Luk\',20,\'45-47\');">Luke 20:45-47</a>; compare <a onClick="return mV(\'Luk\',11,\'39-52\');">Luke 11:39-52</a>)<P>At this point, in audience of the multitudes and of His disciples in the temple, Jesus delivered that tremendous indictment of the scribes and Pharisees, with denunciations of woes upon them for their hypocrisy and iniquity of conduct, recorded most fully in <a onClick="return mV(\'Mat\',23,\'1-\');">Mt 23</a>. A more tremendous denunciation of a class was never uttered. While conceding to the scribes and Pharisees any authority they lawfully possessed (<a onClick="return mV(\'Mat\',23,2,3);">23:2,3</a>), Jesus specially dwelt on their divorce of practice from precept. They said and did not (<a onClick="return mV(\'Mat\',23,2);">23:3</a>). He denounced their perversion of the right, their tyranny, their ostentation, their keeping back others from the kingdom, their zeal in securing proselytes, only to make them, when gained, worse than themselves, their immoral casuistry, their scruples about trifles, while neglecting essentials, their exaltation of the outward at the expense of the inward, their building the tombs of the prophets, while harboring the spirit of those that killed the prophets. He declared them to be foul and corrupt to the last degree: \'sons of Gehenna\' (<a onClick="return mV(\'Mat\',23,15,33);">23:15,33</a>). So awful a condition meant ripeness for doom. On them, through that law of retribution which binds generation with generation in guilt and penalty, would come all the righteous blood shed since the days of Abel (the allusion to "Zachariah son of Barachiah," <a onClick="return mV(\'Mat\',23,35);">23:35</a>, is unmistakably to <a onClick="return mV(\'2Ch\',24,21);">2Ch 24:21</a>—this being the last book in the Hebrew Canon—but "Barachiah" seems a confusion with <a onClick="return mV(\'Zec\',1,1);">Zec 1:1</a>, perhaps through a copyist\'s gloss or error). At the close indignation melts into tenderness in the affecting plaint over Jerusalem—"O Jerusalem, Jerusalem,...how often would I have gathered thy children together," etc. (<a onClick="return mV(\'Mat\',23,\'37-39\');">Mt 23:37-39</a>)—words found in Luke in an earlier context (<a onClick="return mV(\'Mat\',13,34,35);">13:34,35</a>), but assuredly also appropriate here. For other parts of the discourse found earlier, compare <a onClick="return mV(\'Luk\',11,\'39-52\');">Lu 11:39-52</a>. All seems to have been gathered up afresh in this final accusation. It can be imagined that the anger of the Pharisees was fierce at such words, yet they did not venture openly to touch Him.<P>d) The Widow\'s Offering:<P>(<a onClick="return mV(\'Mar\',12,\'41-44\');">Mark 12:41-44</a>; <a onClick="return mV(\'Luk\',21,\'1-4\');">Luke 21:1-4</a>)<P>Before finally leaving the temple, Jesus seems to have passed from the outer court into the women\'s court, and there to have sat down near the receptacles provided for the gifts of the worshippers. Many who were wealthy cast of their gold and silver into the treasury, but the eye of Jesus singled out one poor widow who, creeping up, cast in two mites (Greek lepta, the smallest of coins), which made up but a farthing. It was little, but it was her all, and Jesus immortalized her poor offering by declaring that, out of her want, she had given more than the wealthlest there. Gifts were measured in His sight by the willingness that prompted them, and by the sacrifice they entailed.<P>e) The Visit of the Greeks:<P>(<a onClick="return mV(\'Jhn\',12,\'20-36\');">John 12:20-36</a>)<P>It is perhaps to this crowded day, though some place it earlier in the week (on Sunday or Monday), that the incident should be referred of the request of certain Greeks to see Jesus, as related in <a onClick="return mV(\'Jhn\',12,20);">Joh 12:20</a>ff. Who these Greeks were, or whence they came, is unknown, but they were evidently proselytes to the Jewish faith, and men of a sincere spirit. Their request was made through Philip of Bethsaida, and Philip and Andrew conveyed it to Jesus. It is not said whether their wish was granted, but we can hardly doubt that it was. Jesus evidently saw in the incident a prelude of that glory that should accrue to Himself through all men being drawn to Him (<a onClick="return mV(\'Jhn\',12,23,32);">Joh 12:23,32</a>). But He saw as clearly that this "glorifying" could only be through His death (<a onClick="return mV(\'Jhn\',12,24,33);">Joh 12:24,33</a>), and He universalized it into a law of His Kingdom that, as a grain of wheat must fall into the earth and die if it is to be multiplied, so only through sacrifice can any life be made truly fruitful (<a onClick="return mV(\'Jhn\',12,24,25);">Joh 12:24,25</a>). The thought of death, however, always brought trouble to the soul of Jesus (<a onClick="return mV(\'Jhn\',12,27);">Joh 12:27</a>), and a voice from the Father was given to comfort Him. The multitude thought it thundered, and failed to apprehend the meaning of the voice, or His own words about being "lifted up" (<a onClick="return mV(\'Jhn\',12,29,34);">Joh 12:29,34</a>).<P>f) Discourse on the Last Things:<P>(<a onClick="return mV(\'Mat\',24,\'1-\');">Matthew 24</a>; <a onClick="return mV(\'Mar\',13,\'1-\');">Mark 13</a>; <a onClick="return mV(\'Luk\',21,\'5-36\');">Luke 21:5-36</a>)<P>Jesus had now bidden farewell to the temple. As He was going out, His disciples—or one of them (Mark)—called His attention to the magnificence of the buildings of the temple, eliciting from Him the startling reply that not one stone should be left upon another that should not be thrown down. Later in the evening, when seated on the Mount of Olives on their return journey, in view of the temple, Andrew, James and John (Mark) asked Him privately when these things should be, and what would be the signs of their fulfillment. In Matthew the question is put more precisely, "When shall these things be? And what shall be the sign of thy coming (parousia), and of the end of the world?" (or "consummation of the age"). It is in answer to these complex questions that Jesus spoke His great discourse on the destruction of Jerusalem and His final coming, some of the strands in which it is difficult now to disentangle. In the extended report in <a onClick="return mV(\'Mat\',24,\'1-\');">Mt 24</a> certain passages appear which are given elsewhere by Luke (compare <a onClick="return mV(\'Luk\',17,\'20-37\');">Lu 17:20-37</a>). It may tend to clear
