n—met with so often in the Gospels. Was it a reality? Or a hallucination? Did Jesus believe in it? It is difficult to read the Gospels, and not answer the last question in the affirmative. Was Jesus, then, mistaken? This also it is hard to believe. If there is one subject on which Jesus might be expected to have clear vision—on which we might trust His insight—it was His relation to the spiritual world with which He stood in so close rapport. Was He likely then to be mistaken when He spoke so earnestly, so profoundly, so frequently, of its hidden forces of evil? There is in itself no improbability—rather analogy suggests the highest probability—of realms of spiritual existence outside our sensible ken. That evil should enter this spiritual world, and that human life should be deeply implicated with that evil—that its forces should have a mind and will organizing and directing them—are not beliefs to be dismissed with scorn. The presence of such beliefs in the time of Christ is commonly attributed to Babylonian, Persian or other foreign influences. It may be questioned, however, whether the main cause was not something far more real—an actual and permitted "hour and the power of darkness" (<a onClick="return mV(\'Luk\',22,53);">Lu 22:53</a>) in the kingdom of evil, discovering itself in manifestations in the bodies and souls of men, that could be traced only to a supernatural cause (see <a href="./study/isbe/search.html?string=DEMONIAC">DEMONIAC</A>). (The present writer discusses the subject in an article in the Sunday School Times for June 4, 1910. It would be presumptuous even to say that the instance in the Gospels have no modern parallels. See a striking paper in Good, Words, edited by Dr. Norman MacLeod, for 1867, on "The English Demoniac.") It should be noted that all diseases are not, as is sometimes affirmed, traced to demonic influence. The distinction between other diseases and demonic possession is clearly maintained (compare <a onClick="return mV(\'Mat\',4,24);">Mt 4:24</a>; <a onClick="return mV(\'Mat\',10,1);">10:1</a>; <a onClick="return mV(\'Mat\',11,5);">11:5</a>, etc.). Insanity, epilepsy, blindness, dumbness, etc., were frequent accompaniments of possession, but they are not identified with it.<P>c) Peter\'s Wife\'s Mother:<P>(<a onClick="return mV(\'Mat\',8,14,15);">Matthew 8:14,15</a>; <a onClick="return mV(\'Mar\',1,\'29-31\');">Mark 1:29-31</a>; <a onClick="return mV(\'Luk\',4,38,39);">Luke 4:38,39</a>)<P>Jesus, on leaving the synagogue, entered the house of Peter. In Mark it is called "the house of Simon and Andrew" (<a onClick="return mV(\'Luk\',1,29);">1:29</a>). Peter was married (compare <a onClick="return mV(\'1Cr\',9,5);">1Co 9:5</a>), and apparently his mother-in-law and brother lived with him in Capernaum. It was an anxious time in the household, for the mother-in-law lay "sick of a fever"—"a great fever," as Luke the physician calls it. Taking her by the hand, Jesus rebuked the fever, which instantaneously left her. The miracle, indeed, was a double one, for not only was the fever stayed, but strength was at once restored. "She rose up and ministered unto them" (<a onClick="return mV(\'Luk\',4,39);">Lu 4:39</a>).<P>d) The Eventful Evening:<P>(<a onClick="return mV(\'Mat\',8,16);">Matthew 8:16</a>; <a onClick="return mV(\'Mar\',1,\'32-34\');">Mark 1:32-34</a>; <a onClick="return mV(\'Luk\',4,40,41);">Luke 4:40,41</a>)<P>The day\'s labors were not yet done; were, indeed, scarce begun. The news of what had taken place quickly spread, and soon the extraordinary spectacle was presented of \'the whole city\' gathered at the door of the dwelling, bringing their sick of every kind to be healed. Demoniacs were there, crying and being rebuked, but multitudes of others as well. The Lord\'s compassion was unbounded. He rejected none. He labored unweariedly till every one was healed. His sympathy was individual: "He laid his hands on every one of them" (<a onClick="return mV(\'Luk\',4,40);">Lu 4:40</a>).<P>II. From First Galilean Circuit till the Choice of the Apostles.<P>1. The First Circuit:<P>(<a onClick="return mV(\'Mar\',1,\'35-45\');">Mark 1:35-45</a>; <a onClick="return mV(\'Luk\',4,\'42-44\');">Luke 4:42-44</a>; compare <a onClick="return mV(\'Mat\',4,\'23-25\');">Matthew 4:23-25</a>)<P>The chronological order in this section is to be sought in Mark and Luke; Matthew groups for didactic purposes. The morning after that eventful Sabbath evening in Capernaum, Jesus took steps for a systematic visitation of the towns and villages of Galilee.<P>The task He set before Himself was prepared for by early, prolonged, solitary prayer (<a onClick="return mV(\'Mar\',1,35);">Mr 1:35</a>; many instances show that Christ\'s life was steeped in prayer). His disciples followed Him, and reported that the multitudes sought Him. Jesus intimated to them His intention of passing to the next towns, and forthwith commenced a tour of preaching and healing "throughout all Galilee."<P>a) Its Scope:<P>Even if the expression "all Galilee" is used with some latitude, it indicates a work of very extensive compass. It was a work likewise methodically conducted (compare <a onClick="return mV(\'Mar\',6,6);">Mr 6:6</a>: "went round about the villages," literally, "in a circle"). Galilee at this time was extraordinarily populous (compare Josephus, Wars of the Jews, III, iii, 2), and the time occupied by the circuit must have been considerable. Matthew\'s condensed picture (<a onClick="return mV(\'Mat\',4,\'23-25\');">Mt 4:23-25</a>) shows that Christ\'s activity during this period was incredibly great. He stirred the province to its depths. His preaching and miracles drew enormous crowds after Him. This tide of popularity afterward turned, but much of the seed sown may have produced fruit at a later day.<P>b) Cure of the Leper:<P>(<a onClick="return mV(\'Mat\',8,\'2-4\');">Matthew 8:2-4</a>; <a onClick="return mV(\'Mar\',1,\'40-45\');">Mark 1:40-45</a>; <a onClick="return mV(\'Luk\',5,\'12-16\');">Luke 5:12-16</a>)<P>The one incident recorded which seems to have belonged to this tour was a sufficiently typical one. While Jesus was in a certain city a man "full of leprosy" (<a onClick="return mV(\'Luk\',5,12);">Lu 5:12</a>) came and threw himself down before Him, seeking to be healed. The man did not even ask Jesus to heal him, but expressed his faith, "If thou wilt, thou canst make me clean." The man\'s apparent want of importunity was the very essence of his importunity. Jesus, moved by his earnestness, touched him, and the man was made whole on the spot. The leper was enjoined to keep silence—Jesus did not wish to pass for a mere miracle-worker—and bade the man show himself to the priests and offer the appointed sacrifices (note Christ\'s respect for the legal institutions). The leper failed to keep Christ\'s charge, and published his cure abroad, no doubt much to his own spiritual detriment, and also to the hindrance of Christ\'s work (<a onClick="return mV(\'Mar\',1,45);">Mr 1:45</a>).<P>2. Capernaum Incidents:<P>His circuit ended, Jesus returned to Capernaum (<a onClick="return mV(\'Mar\',2,1);">Mr 2:1</a>; literally, "after days"). Here again His fame at once drew multitudes to see and hear Him. Among them were now persons of more unfriendly spirit. Pharisees and doctors, learning of the new rabbi, had come out of "every village of Galilee and Judea and Jerusalem" (<a onClick="return mV(\'Luk\',5,17);">Lu 5:17</a>), to hear and judge of Him for themselves. The chief incidents of this visit are the two now to be noted.<P>a) Cure of the Paralytic:<P>(<a onClick="return mV(\'Mat\',9,\'2-8\');">Matthew 9:2-8</a>; <a onClick="return mV(\'Mar\',2,\'1-12\');">Mark 2:1-12</a>; <a onClick="return mV(\'Luk\',5,\'17-26\');">Luke 5:17-26</a>).<P>In a chamber crowded till there was no standing room, even round the door, Jesus wrought the cure upon the paralytic man. The scene was a dramatic one. From Christ\'s words "son," literally, "child" (<a onClick="return mV(\'Mar\',2,5);">Mr 2:5</a>), we infer that the paralytic was young, but his disablement seems to have been complete. It was no easy matter, with the doorways blocked, to get the man brought to Jesus, but his four bearers (<a onClick="return mV(\'Mar\',2,3);">Mr 2:3</a>) were not easily daunted. They climbed the fiat roof, and, removing part of the covering above where Jesus was, let down the man into the midst. Jesus, pleased with the inventiveness and perseverance of their faith, responded to their wish. But, first, that the spiritual and temporal might be set in their right relations, and the attitude of His hearers be tested, He spoke the higher words: "Son, thy sins are forgiven" (<a onClick="return mV(\'Mar\',2,5);">Mr 2:5</a>). At once the temper of the scribes was revealed. Here was manifest evasion. Anyone could say, "Thy sins are forgiven." Worse, it was blasphemy, for "who can forgive sins but one, even God?" (<a onClick="return mV(\'Mar\',2,7);">Mr 2:7</a>). Unconsciously they were conceding to Christ the Divine dignity He claimed. Jesus perceives at once the thoughts of the cavilers, and proceeds to expose their malice. Accepting their own test, He proves His right to say, "Thy sins are forgiven," by now saying to the palsied man, "Take up thy bed and walk" (<a onClick="return mV(\'Mar\',2,9,11);">Mr 2:9,11</a>). At once the man arose, took his bed, and went forth whole. The multitude were "amazed" and "glorified God" (<a onClick="return mV(\'Mar\',2,12);">Mr 2:12</a>).<P>b) Call and Feast of Matthew:<P>(<a onClick="return mV(\'Mat\',9,\'9-13\');">Matthew 9:9-13</a>; <a onClick="return mV(\'Mar\',2,\'13-17\');">Mark 2:13-17</a>; <a onClick="return mV(\'Luk\',5,\'27-32\');">Luke 5:27-32</a>)<P>The call of Matthew apparently took place shortly after the cure of the paralytic man. The feast was possibly later (compare the connection with the appeal of Jairus, <a onClick="return mV(\'Mat\',9,18);">Mt 9:18</a>), but the call and the feast are best taken together, as they are in all the three narratives.<P>(1) The Call.<P>Matthew is called "Levi" by Luke, and "Levi, the son of Alpheus" by Mark. By occupation he was a "publican" (<a onClick="return mV(\'Luk\',5,27);">Lu 5:27</a>), collector of custom-dues in Capernaum, an important center of traffic. There is no reason to suppose that Matthew was not a man of thorough uprightness, though naturally the class to which he belonged was held in great odium by the Jews. Passing the place of toll on His way to or from the lake-side, Jesus called Matthew to follow Him. The publican must by this time have seen and heard much of Jesus, and could not but keenly feel His grace in calling one whom men despised. Without an instant\'s delay, he left all, and followed Jesus. From publican, Matthew became apostle, then evangelist.<P>(2) The Feast.<P>Then, or after, in the joy of his heart, Matthew made a feast for Jesus. To this feast he invited many of his own class—"publicans and sinners" (<a onClick="return mV(\'Mat\',9,10);">Mt 9:10</a>). Scribes and Pharisees were loud in their remonstrances to the disciples at what seemed to them an outrage on all propriety. Narrow hearts cannot understand the breadth of grace. Christ\'s reply was conclusive: "They that are whole have no need of a physician, but they that are sick," etc. (<a onClick="return mV(\'Mar\',2,17);">Mr 2:17</a>, etc.).<P>(3) Fasting and Joy.<P>Another line of objection was encountered from disciples of the Baptist. They, like the Pharisees, "fasted oft" (<a onClick="return mV(\'Mat\',9,14);">Mt 9:14</a>), and they took exception to the unconstrained way in which Jesus and His disciples entered into social life. Jesus defends His disciples by adopting a metaphor of John\'s own (<a onClick="return mV(\'Jhn\',3,29);">Joh 3:29</a>), and speaking of Himself as the heavenly bridegroom (<a onClick="return mV(\'Mar\',2,19);">Mr 2:19</a>). Joy was natural while the bridegroom was with them; then, with a sad forecast of the end, He alludes to days of mourning when the bridegroom should be taken away (<a onClick="return mV(\'Mar\',2,20);">Mr 2:20</a>). A deeper answer follows. The spirit of His gospel is a free, spontaneous, joyful spirit, and cannot be confined within the old forms. To attempt to confine His religion within the outworn forms of Judaism would be like putting a patch of undressed cloth on an old garment, or pouring new wine into old wineskins. The garment would be rent; the wineskins would burst (<a onClick="return mV(\'Mar\',2,21,22);">Mr 2:21,22</a> parallel). The new spirit must make forms of its own.<P>3. The Unnamed Jerusalem Feast:<P>(<a onClick="return mV(\'Jhn\',5,1);">John 5</a>)<P>At this point is probably to, be introduced the visit to Jerusalem to attend "a feast," or, according to another reading, "the feast\' of the Jews, recorded in <a onClick="return mV(\'Jhn\',5,\'1-\');">Joh 5</a>. The feast may, if the article is admitted, have been the Passover (April), though in that case one would expect it to be named; it may have been Purim (March), only this is not a feast Jesus might be thought eager to attend; it may even have been Pentecost (June). In this last case it would succeed the Sabbath controversies to be mentioned later. Fortunately, the determination of the actual feast has little bearing on the teaching of the chapter.<P>a) The Healing at Bethesda:<P>(<a onClick="return mV(\'Jhn\',5,\'1-16\');">John 5:1-16</a>).<P>Bethesda ("house of mercy") was the name given to a pool, fed by an intermittent spring, possessing healing properties, which was situated by the sheep-gate (not "market," the King James Version), i.e. near the temple, on the East Porches were erected to accommodate the invalids who desired to make trial of the waters (the mention of the angel, <a onClick="return mV(\'Jhn\',5,4);">Joh 5:4</a>, with part of <a onClick="return mV(\'Jhn\',5,3);">5:3</a>, is a later gloss, and is justly omitted in the Revised Version (British and American)). On one of these porches lay an impotent man. His infirmity was of long standing—38 years. Hope deferred was making his heart sick, for he had no friend, when the waters were troubled, to put him into the pool. Others invariably got down before him. Jesus took pity on this man. He asked him if he would be made whole; then by a word of power healed him. The cure was instantaneous (<a onClick="return mV(\'Jhn\',5,8,9);">John 5:8,9</a>). It was the Sabbath day, and as the man, at Christ\'s command, took up his bed to go, he was challenged as doing that which was unlawful. The healed man, however, rightly perceived that He who was able to work so great a cure had authority to say what should and should not be done on the Sabbath. Meeting the man after in the temple, Jesus bade him "sin no more"—a hint, perhaps, that his previous infirmity was a result of sinful conduct (<a onClick="return mV(\'Jhn\',5,14);">John 5:14</a>).<P>b) Son and Father:<P>(<a onClick="return mV(\'Jhn\',5,\'17-29\');">John 5:17-29</a>)<P>Jesus Himself was now challenged by the authorities for breaking the Sabbath. Their strait, artificial rules would not permit even of acts of mercy on the Sabbath. This led, on the part of Jesus, to a momentous assertion of His Divine dignity. He first justified Himself by the example of His Father, who works continually in the upholding and government of the universe (<a onClick="return mV(\'Jhn\',5,17);">Joh 5:17</a>)—the Sabbath is a rest from earthly labors, for Divine, heavenly labor (Westcott)—then, when this increased the offense by its suggestion of "equality" with the Father, so that His life was threatened (<a onClick="return mV(\'Jhn\',5,18);">Joh 5:18</a>), He spoke yet more explicitly of His unique relationship to the Father, and of the Divine prerogatives it conferred upon Him. The Jews were right: if Jesus were not a Divine Person, the claims He made would be blasphemous. Not only was He admitted to intimacy with the Divine counsel (<a onClick="return mV(\'Jhn\',5,20,21);">Joh 5:20,21</a>; compare <a onClick="return mV(\'Mat\',11,27);">Mt 11:27</a>), but to Him, He averred, was committed the Divine power of giving life (<a onClick="return mV(\'Jhn\',5,21,26);">Joh 5:21,26</a>), of judgment (<a onClick="return mV(\'Jhn\',5,22,27);">Joh 5:22,27</a>), of resurrection—spiritual resurrection now (<a onClick="return mV(\'Jhn\',5,24,25);">Joh 5:24,25</a>), resurrection at the last day (<a onClick="return mV(\'Jhn\',5,28,29);">Joh 5:28,29</a>). It was the Father\'s will that the Son should be honored even as Himself (<a onClick="return mV(\'Jhn\',5,23);">Joh 5:23</a>).<P>c) The Threefold Witness:<P>(<a onClick="return mV(\'Jhn\',5,\'30-47\');">John 5:30-47</a>)<P>These stupendous claims are not made without adequate attestation. Jesus cites a threefold witness:<P>(1) the witness of the Baptist, whose testimony they had been willing for a time to receive (<a onClick="return mV(\'Jhn\',5,33,35);">Joh 5:33,35</a>);<P>(2) the witness of the Father, who by Christ\'s works supported His witness to Himself (<a onClick="return mV(\'Jhn\',5,\'36-38\');">Joh 5:36-38</a>);<P>(3) the witness of the Scriptures, for these, if read with spiritual discernment, would have led to Him (<a onClick="return mV(\'Jhn\',5,39);">Joh 5:39</a>,<a onClick="return mV(\'Jhn\',5,\'45-47\');">45-47</a>). Moses, whom they trusted, would condemn them. Their rejection of Jesus was due, not to want of light, but to the state of the heart: "I know you, that ye have not the love of God in yourselves" (<a onClick="return mV(\'Jhn\',5,42);">Joh 5:42</a>); "How can ye believe," etc. (<a onClick="return mV(\'Jhn\',5,44);">Joh 5:44</a>).<P>4. Sabbath Controversies:<P>Shortly after His return to Galilee, if the order of events has been rightly apprehended, Jesus became involved in new disputes with the Pharisees about Sabbath-keeping. Possibly we hear in these the echoes of the charges brought against Him at the feast in Judea. Christ\'s conduct, and the principles involved in His replies, throw valuable light on the Sabbath institution.<P>a) Plucking of the Ears of Grain: (<a onClick="return mV(\'Mat\',12,\'1-8\');">Matthew 12:1-8</a>; <a onClick="return mV(\'Mar\',2,\'23-28\');">Mark 2:23-28</a>; <a onClick="return mV(\'Luk\',6,\'1-5\');">Luke 6:1-5</a>)<P>The first dispute was occasioned by the action of the disciples in plucking ears of grain and rubbing them in their hands as they passed through the grainfields on a Sabbath (the note of time "second-first," in <a onClick="return mV(\'Luk\',6,1);">Lu 6:1</a> the King James Version, is omitted in the Revised Version (British and American). In any case the ripened grain points to a time shortly after the Passover). The law permitted this liberty (<a onClick="return mV(\'Deu\',23,25);">De 23:25</a>), but Pharisaic rigor construed it into an offense to do the act on the Sabbath (for specimens of the minute, trivial and vexatious rules by which the Pharisees converted the Sabbath into a day of wretched constraint, see Farrar\'s Life of Christ, Edersheim\'s Jesus the Messiah, and similar works). Jesus, in defending His disciples, first quotes Old Testament precedents (David and the showbread, an act done apparently on the Sabbath, <a onClick="return mV(\'1Sa\',21,6);">1Sa 21:6</a>; the priests\' service on the Sabbath—"One greater than the temple" was there, <a onClick="return mV(\'Mat\',12,6);">Mt 12:6</a>), in illustration of the truth that necessity overrides positive enactment; next, falls back on the broad principle of the design of the Sabbath as made for man—for his highest physical, mental, moral and spiritual well-being: "The sabbath was made for man," etc. (<a onClick="return mV(\'Mar\',2,27);">Mr 2:27</a>). The claims of mercy are paramount. The end is not to be sacrificed to the means. The Son of Man, therefore, asserts lordship over the Sabbath (<a onClick="return mV(\'Mar\',2,28);">Mr 2:28</a> parallel).<P>b) The Man with the Withered Hand:<P>(<a onClick="return mV(\'Mat\',12,\'10-14\');">Matthew 12:10-14</a>; <a onClick="return mV(\'Mar\',3,\'1-6\');">Mark 3:1-6</a>; <a onClick="return mV(\'Luk\',6,\'6-11\');">Luke 6:6-11</a>)<P>The second collision took place on "another sabbath" (<a onClick="return mV(\'Luk\',6,6);">Lu 6:6</a>) in the synagogue. There was present a man with a withered hand. The Pharisees themselves, on this occasion, eager to entrap Jesus, seem to have provoked the conflict by a question, "Is it lawful to heal on the sabbath day?" (<a onClick="return mV(\'Mat\',12,10);">Mt 12:10</a>). Jesus met them by an appeal to their own practice in permitting the rescue of a sheep that had fallen into a pit on the Sabbath day (<a onClick="return mV(\'Mat\',12,11,12);">Mt 12:11,12</a>), then, bidding the man stand forth, retorted the question on themselves, "Is it lawful on the sabbath day to do good, or to do harm? to save a life, or to kill?" (<a onClick="return mV(\'Mar\',3,4);">Mr 3:4</a>)—an allusion to their murderous intents. On no reply being made, looking on them with holy indignation, Jesus ordered the man to stretch forth his hand, and it was at once perfectly restored. The effect was only to inflame to "madness" (<a onClick="return mV(\'Luk\',6,11);">Lu 6:11</a>) the minds of His adversaries, and Pharisees and Herodians (the court-party of Herod) took counsel to destroy Him (<a onClick="return mV(\'Mar\',3,6);">Mr 3:6</a> parallel).<P>c) Withdrawal to the Sea:<P>(<a onClick="return mV(\'Mat\',12,\'15-21\');">Matthew 12:15-21</a>; <a onClick="return mV(\'Mar\',3,\'7-9\');">Mark 3:7-9</a>)<P>Jesus, leaving this scene of unprofitable conflict, quietly withdrew with His disciples to the shore, and there continued His work of teaching and healing. People from all the neighboring districts flocked to His ministry. He taught them from a little boat (<a onClick="return mV(\'Mar\',3,9);">Mr 3:9</a>), and healed their sick. Matthew sees in this a fulfillment of the oracle which is to be found in <a onClick="return mV(\'Isa\',42,\'1-4\');">Isa 42:1-4</a>.<P>5. The Choosing of the Twelve:<P>(<a onClick="return mV(\'Mat\',10,\'1-4\');">Matthew 10:1-4</a>; <a onClick="return mV(\'Mar\',3,\'13-19\');">Mark 3:13-19</a>; <a onClick="return mV(\'Luk\',6,\'12-16\');">Luke 6:12-16</a>; <a onClick="return mV(\'Act\',1,13);">Ac 1:13</a>)<P>The work of Jesus was growing on His hands, and friends and enemies were rapidly taking sides. The time accordingly had come for selecting and attaching to His person a definite number of followers—not simply disciples—who might be prepared to carry on His work after His departure. This He did in the choice of twelve apostles. The choice was made in early morning, on the Mount of Beatitudes, after a night spent wholly in prayer (<a onClick="return mV(\'Luk\',6,12);">Lu 6:12</a>).<P>a) The Apostolic Function:<P>"Apostle" means "one sent." On the special function of the apostle it is sufficient to say here that those thus set apart were chosen for the special end of being Christ\'s witnesses and accredited ambassadors to the world, able from personal knowledge to bear testimony to what Christ had been, said and done—to the facts of His life, death and resurrection (compare <a onClick="return mV(\'Act\',1,22,23);">Ac 1:22,23</a>; <a onClick="return mV(\'Act\',2,\'22-32\');">2:22-32</a>; <a onClick="return mV(\'Act\',3,15);">3:15</a>; <a onClick="return mV(\'Act\',10,39);">10:39</a>; <a onClick="return mV(\'1Cr\',15,\'3-15\');">1Co 15:3-15</a>, etc.); but, further, as instructed by Him, and endowed with His Spirit (compare <a onClick="return mV(\'Luk\',12,12);">Lu 12:12</a>; <a onClick="return mV(\'Jhn\',14,16,17,26);">Joh 14:16,17,26</a>, etc.), of being the depositories of His truth, sharers of His authority (compare <a onClick="return mV(\'Mat\',10,1);">Mt 10:1</a>; <a onClick="return mV(\'Mar\',3,15);">Mr 3:15</a>), messengers of His gospel (compare <a onClick="return mV(\'2Cr\',5,\'18-21\');">2Co 5:18-21</a>), and His instruments in laying broad and strong the foundations of His church (compare <a onClick="return mV(\'Eph\',2,20);">Eph 2:20</a>; <a onClick="return mV(\'Eph\',3,5);">3:5</a>). So responsible a calling was never, before or after, given to mortal men.<P>b) The Lists:<P>Four lists of the apostles are given—in Matthew, Mark, Luke, and Acts (<a onClick="return mV(\'Act\',1,13);">1:13</A>, omitting Judas). The names are given alike in all, except that "Judas, the son (or brother) of James" (<a onClick="return mV(\'Luk\',6,16);">Lu 6:16</a>; <a onClick="return mV(\'Act\',1,13);">Ac 1:13</a>) is called by Matt Lebbaeus, "and by Mark Thaddaeus." The latter names are cognate in meaning and all denote the same person. "Bartholomew" (son of Tolmai) is probably the Nathanael of <a onClick="return mV(\'Jhn\',1,47);">Joh 1:47</a> (compare <a onClick="return mV(\'Jhn\',21,2);">21:2</a>). The epithet "Cananaean" (<a onClick="return mV(\'Mat\',10,4);">Mt 10:4</a>; <a onClick="return mV(\'Mar\',3,18);">Mr 3:18</a>) marks "Simon" as then or previously a member of the party of the Zealots (<a onClick="return mV(\'Luk\',6,15);">Lu 6:15</a>). In all the lists Peter, through his gifts of leadership, stands first; Judas Iscariot, the betrayer, stands last. There is a tendency to arrangement in pairs: Peter and Andrew; James and John; Philip and Bartholomew; Thomas and Matthew; lastly, James, the son of Alpheus, Judas, son or brother of James, Simonthe Zealot and Judas Iscariot. The list contains two pairs of brothers (three, if "brother" be read with Judas), and at least one pair of friends (Philip and Nathanael).<P>c) The Men:<P>All the apostles were men from the humbler ranks, yet not illiterate, and mostly comfortably circumstanced. All were Galileans, except the betrayer, whose name "Iscariot" i.e. "man of Kerioth," marks him as a Judean. Of some of the apostles we know a good deal; of others very little; yet we are warranted in speaking of them all, Judas excepted, as men of honest minds, and sincere piety. The band held within it a number of men of strongly contrasted types of character. Allusion need only be made to the impetuous Peter, the contemplative John, the matter-of-fact Philip, the cautious Thomas, the zealous Simon, the conservative Matthew, the administrative Judas. The last-named—Iscariot—is the dark problem of the apostolate. We have express testimony that Jesus knew him from the beginning (<a onClick="return mV(\'Jhn\',6,64);">Joh 6:64</a>). Yet He chose him. The character of Judas, when Jesus received him, was doubtless undeveloped. He could not himself suspect the dark possibilities that slept in it. His association with the apostles, in itself considered, was for his good. His peculiar gift was, for the time, of service. In choosing him, Jesus must be viewed as acting for, and under the direction of, the Father (<a onClick="return mV(\'Jhn\',5,19);">Joh 5:19</a>; <a onClick="return mV(\'Jhn\',17,12);">17:12</a>). See special articles on the several apostles [<a href="./study/isbe/search.html?string=PETER,+SIMON">Peter</a>; <a href="./study/isbe/search.html?string=ANDREW">Andrew</a>; <a href="./study/isbe/search.html?string=JAMES">James</a>; <a href="./study/isbe/search.html?string=JOHN,+THE APOSTLE">John, The Apostle</a>; <a href="./study/isbe/search.html?string=PHILIP+(2)">Philip (2)</a>; <a href="./study/isbe/search.html?string=BARTHOLOMEW">Bartholomew</a>; <a href="./study/isbe/search.html?string=MATTHEW">Matthew</a>; <a href="./study/isbe/search.html?string=THOMAS">Thomas</a>; <a href="./study/isbe/search.html?string=JAMES">James son of Alphaeus</a>; <a href="./study/isbe/search.html?string=SIMON+THE+CANAANITE;+SIMON+THE+CANANAEAN;+SIMON+THE+ZEALOT">Simon the Zealot</a>; <a href="./study/isbe/search.html?string=JUDAS+OF+JAMES">Judas son of James</a>; <a href="./study/isbe/search.html?string=JUDAS+ISCARIOT">Judas Iscariot</a>]. <P>III. From the Sermon on the Mount till the Parables of the Kingdom—a Second Circuit.<P>1. The Sermon on the Mount:<P>The choice of the apostles inaugurates a new period of Christ\'s activity. Its first most precious fruit was the delivery to the apostles and the multitudes who thronged Him as He came down from the mountain (<a onClick="return mV(\'Luk\',6,17);">Lu 6:17</a>) of that great manifesto of His kingdom popularly known as the Sermon on the Mount. The hill is identified by Stanley (Sinai and Palestine, 368) and others with that known as "the Horns of Hattin," where "the level place" at the top, from which Christ would come down from one of the higher horns, exactly suits the conditions of the narrative. The sick being healed, Jesus seated Himself a little higher up, His disciples near Him, and addressed the assembly (compare <a onClick="return mV(\'Mat\',7,28,29);">Mt 7:28,29</a>). The season of the year is shown by the mention of the "lilies" to be the summer.<P>Its Scope.<P>His words were weighty. His aim was at the outset to set forth in terms that were unmistakable the principles, aims and dispositions of His kingdom; to expound its laws; to exhibit its righteousness, both positively, and in contrast with Pharisaic formalism and hypocrisy. Only the leading ideas can be indicated here (see <a href="./study/isbe/search.html?string=BEATITUDES">BEATITUDES</a>; <a href="./study/isbe/search.html?string=SERMON+ON+THE+MOUNT">SERMON ON THE MOUNT</a>; <a href="./study/isbe/search.html?string=ETHICS+OF+JESUS">ETHICS OF JESUS</a>). Matthew, as is his wont, groups material part of which is found in other connections in Luke, but it is well to study the whole in the well-ordered form in which it appears in the First Gospel.<P>a) The Blessings:<P>(<a onClick="return mV(\'Mat\',5,\'1-6\');">Matthew 5:1-6</a>; <a onClick="return mV(\'Luk\',6,\'20-26\');">Luke 6:20-26</a>)<P>In marked contrast with the lawgiving of Sinai, Christ\'s first words are those of blessing. Passing at once to the dispositions of the heart, He shows on what inner conditions the blessings of the kingdom depend. His beatitudes (poverty of spirit, mourning, meekness, hunger and thirst after righteousness, etc.) reverse all the world\'s standards of judgment on such matters. In the possession of these graces consists true godliness of character; through them the heirs of the kingdom become the salt of the earth, the light of the world. The obligation rests on them to let their light shine (compare <a onClick="return mV(\'Mar\',4,\'21-23\');">Mr 4:21-23</a>; <a onClick="return mV(\'Luk\',8,16);">Lu 8:16</a>; <a onClick="return mV(\'Luk\',11,33);">11:33</a>).<P>b) True Righteousness—the Old and the New Law:<P>(<a onClick="return mV(\'Mat\',5,\'17-48\');">Matthew 5:17-48</a>; <a onClick="return mV(\'Luk\',6,\'27-36\');">Luke 6:27-36</a>)<P>Jesus defines His relation to the old law—not a Destroyer, but a Fulfiller—and proceeds to exhibit the nature of the true righteousness in contrast to Pharisaic literality and formalism. Through adherence to the latter they killed the spirit of the law. With an absolute authority—"But I say unto you"—Jesus leads everything back from the outward letter to the state of the heart. Illustrations are taken from murder, adultery, swearing, retaliation, hatred of enemies, and a spiritual expansion is given to every precept. The sinful thought or desire holds in it the essence of transgression. The world\'s standards are again reversed in the demands for nonresistance to injuries, love of enemies and requital of good for evil.<P>c) Religion and Hypocrisy—True and False Motive:<P>(<a onClick="return mV(\'Mat\',6,\'1-18\');">Matthew 6:1-18</a>; compare <a onClick="return mV(\'Luk\',11,\'1-8\');">Luke 11:1-8</a>)<P>Pursuing the contrast between the true righteousness and that of the scribes and Pharisees, Jesus next draws attention to motive in religion. The Pharisees erred not simply in having regard only to the letter of the Law, but in acting in morals and religion from a false motive. He had furnished the antidote to their literalism; He now assails their ostentation and hypocrisy. Illustrations are taken from almsgiving, prayer and fasting, and in connection with prayer the Lord\'s Prayer is given as a model (Luke introduces this in another context, <a onClick="return mV(\'Luk\',11,\'1-4\');">Lu 11:1-4</a>).<P>d) The True Good and Cure for Care:<P>(<a onClick="return mV(\'Mat\',6,\'19-34\');">Matthew 6:19-34</a>; compare <a onClick="return mV(\'Luk\',11,\'34-36\');">Luke 11:34-36</a>; <a onClick="return mV(\'Luk\',12,\'22-34\');">12:22-34</a>)<P>The true motive in religious acts is to please God; the same motive should guide us in the choice of what is to be our supreme good. Earthly treasure is not to be put above heavenly. The kingdom of God and His righteousness are to be first in our desires. The eye is to be single. The true cure for worldly anxiety is then found in trust of the heavenly Father. His children are more to God than fowls and flowers, for whom His care in Nature is so conspicuously manifest. Seeking first the kingdom they have a pledge—no higher conceivable—that all else they need will be granted along with it (this section on trust, again, Luke places differently, <a onClick="return mV(\'Luk\',12,\'22-34\');">12:22-34</a>).<P>e) Relation to the World\'s Evil—the Conclusion:<P>(<a onClick="return mV(\'Mat\',7,\'1-29\');">Matthew 7:1-29</a>; <a onClick="return mV(\'Luk\',6,\'37-49\');">Luke 6:37-49</a>; compare <a onClick="return mV(\'Luk\',11,\'9-13\');">11:9-13</a>):<P>Jesus finally proceeds to speak of the relation of the disciple to the evil of the world. That evil has been considered in its hostile attitude to the disciple (<a onClick="return mV(\'Mat\',5,38);">Mt 5:38</a>); the question is now as to the disciple s free relations toward it. Jesus inculcates the duties of the disciple\'s bearing himself wisely toward evil—with charity, with caution, with prayer, in the spirit of ever doing as one would be done by—and of being on his guard against it. The temptation is great to follow the worldly crowd, to be misled by false teachers, to put profession for practice. Against these perils the disciple is energetically warned. True religion will ever be known by its fruits. The discourse closes with the powerful similitude of the wise and foolish builders. Again, as on an earlier occasion, Christ\'s auditors were astonished at His teaching, and at the authority with which He spoke (<a onClick="return mV(\'Mat\',7,28,29);">Mt 7:28,29</a>).<P>2. Intervening Incidents: A series of remarkable incidents are next to be noticed.<P>a) Healing of the Centurion\'s Servant:<P>(<a onClick="return mV(\'Mat\',8,1,\'5-13\');">Matthew 8:1,5-13</a>; <a onClick="return mV(\'Luk\',7,\'1-10\');">Luke 7:1-10</a>)<P>(1) The healing of the centurion\'s servant apparently took place on the same day as the delivery of the Sermon on the Mount (<a onClick="return mV(\'Luk\',7,1,2);">Lu 7:1,2</a>). It had been a day of manifold and exhausting labors for Jesus. A walk of perhaps 7 miles brought Him back to Capernaum, the crowds accompanying. Yet no sooner, on His return, does He hear a new appeal for help than His love Replies,"i will come and heal him." The suppliant was a Roman centurion—one who had endeared himself to the Jews (<a onClick="return mV(\'Luk\',7,5);">Lu 7:5</a>)—and the request was for the healing of a favorite servant, paralyzed and tortured with pain. First, a deputation sought Christ\'s good offices, then, when Jesus was on the way, a second message came, awakening even Christ\'s astonishment by the magnitude of its faith. The centurion felt he was not worthy that Jesus should come under his roof, but let Jesus speak the word only, and his servant would be healed. "I have not found so great faith," Jesus said, "no, not in Israel." The word was spoken, and, on the return of the messengers, the servant was found healed.<P>b) The Widow of Nain\'s Son Raised:<P>(<a onClick="return mV(\'Luk\',7,\'11-17\');">Luke 7:11-17</a>)<P>The exciting events of this day gathered so great a crowd round the house where Jesus was as left Him no leisure even to eat, and His friends, made anxious for His health, sought to restrain Him (<a onClick="return mV(\'Mar\',3,20,21);">Mr 3:20,21</a>). It was probably to escape from this local excitement that Jesus, "soon afterwards," is found at the little town of Nain, a few miles southeast of Nazareth. A great multitude still followed Him. Here, as He entered the city, occurred the most wonderful of the works He had yet wrought. A young man—the only son of a widowed mother—was being carried out for burial. Jesus, in compassion, stopped the mournful procession, and, in the calm certainty of His word being obeyed, bade the young man arise. On the instant life returned, and Jesus gave the son back to his mother. The amazement of the people was tenfold intensified. They felt that the old days had come back: that God had visited His people.<P>It was apparently during the journey or circuit which embraced this visit to Nain, and as the result of the fame it brought to Jesus (<a onClick="return mV(\'Luk\',7,17,18);">Lu 7:17,18</a>; note the allusion to the dead being raised in Christ\'s reply to John), that the embassy was sent from the Baptist in prison to ask of Jesus whether He was indeed He who should come, or would they look for another.<P>c) Embassy of John\'s Disciples—Christ and His Generation:<P>(<a onClick="return mV(\'Mat\',11,\'2-30\');">Matthew 11:2-30</a>; <a onClick="return mV(\'Luk\',7,\'18-35\');">Luke 7:18-35</a>)<P>It was a strange question on the lips of the forerunner, but is probably to be interpreted as the expression of perplexity rather than of actual doubt. There seems no question but that John\'s mind had been thrown into serious difficulty by the reports which had reached him of the work of Jesus. Things were not turning out as he expected. It was the peaceful, merciful character of Christ\'s work which stumbled John. The gloom of his prison wrought with his disappointment, and led him to send this message for the satisfaction of himself and his disciples.<P>(1) Christ\'s Answer to John.<P>If doubt there was, Jesus treated it tenderly. He did not answer directly, but bade the two disciples who had been sent go back and tell John the things they had seen and heard—the blind receiving their sight, the lame walking, the deaf cured, the dead raised, the Gospel preached. Little doubt the Messiah had come when works like these—the very works predicted by the prophets (<a onClick="return mV(\'Isa\',35,5,6);">Isa 35:5,6</a>)—were being done. Blessed were those who did not find occasion of stumbling in Him. Jesus, however, did more. By his embassy John had put himself in a somewhat false position before the multitude. But Jesus would not have His faithful follower misjudged. His was no fickle spirit. Jesus nobly vindicated him as a prophet and more than a prophet; yea, a man than whom a greater had not lived. Yet, even as the new dispensation was higher than the old, one "but little" in the kingdom of heaven—one sharing Christ\'s humble, loving, self-denying disposition—was greater even than John (<a onClick="return mV(\'Mat\',11,11);">Mt 11:11</a>).<P>(2) A Perverse People—Christ\'s Grace.<P>The implied contrast between Himself and John led Jesus further to denounce the perverse spirit of His own generation. The Pharisees and lawyers (<a onClick="return mV(\'Luk\',7,30);">Lu 7:30</a>) had rejected John; they were as little pleased with Him. Their behavior was like children objecting to one game because it was merry, and to another because it was sad. The flood of outward popularity did not deceive Jesus. The cities in which His greatest works were wrought—Chorazin, Bethsaida, Capernaum—remained impenitent at heart. The heavier would be their judgment; worse even than that on Tyre and Sidon, or on Sodom itself. Over against their unbelief Jesus reasserts His dignity and declares His grace (<a onClick="return mV(\'Mat\',11,\'25-30\');">Mt 11:25-30</a>). All authority was His; He alone knew and could reveal the Father (no claims in John are higher). Let the heavy laden come to Him, and He would give them rest (parts of these passages appear in another connection in <a onClick="return mV(\'Luk\',10,\'12-21\');">Lu 10:12-21</a>).<P>d) The First Anointing—the Woman Who Was a Sinner:<P>(<a onClick="return mV(\'Luk\',7,\'36-50\');">Luke 7:36-50</a>)<P>Yet another beautiful incident connected with this journey is preserved by Lk—the anointing of Jesus in Simon\'s house by a woman who was a sinner. In Nain or some other city visited by Him, Jesus was invited to dine with a Pharisee named Simon. His reception was a cold one (<a onClick="return mV(\'Luk\',7,\'44-46\');">Lu 7:44-46</a>). During the meal, a woman of the city, an outcast from respectable society—one, however, as the story implies, whose heart Jesus had reached, and who, filled with sorrow, love, shame, penitence, had turned from her life of sin, entered the chamber. There, bathing Christ\'s feet with her tears, wiping them with her tresses, and imprinting on them fervent kisses, she anointed them with a precious ointment she had brought with her. Simon was scandalized. Jesus could not be a right-thinking man, much less a prophet, or He would have rebuked this misbehavior from such a person. Jesus met the thought of Simon\'s heart by speaking to him the parable of the Two Debtors (<a onClick="return mV(\'Luk\',7,41,42);">Lu 7:41,42</a>). Of two men who had been freely forgiven, one 500, the other 50 shillings, which would love his creditor most? Simon gave the obvious answer, and the contrast between his own reception of Jesus and the woman\'s passionate love was immediately pointed out. Her greater love was due to the greater forgiveness; though, had Simon only seen it, he perhaps needed forgiveness even more than she.<P>3. Second Galilean Circuit—Events at Capernaum:<P>(<a onClick="return mV(\'Luk\',8,\'1-4\',\'19-21\');">Luke 8:1-4,19-21</a>; <a onClick="return mV(\'Mat\',12,\'22-50\');">Matthew 12:22-50</a>; <a onClick="return mV(\'Mar\',3,\'22-35\');">Mark 3:22-35</a> compare <a onClick="return mV(\'Luk\',11,\'14-36\');">Luke 11:14-36</a>)<P>Her faith saved her and she was dismissed in peace. But again the question arose, "Who is this that even forgiveth sins?" Luke introduces here (<a onClick="return mV(\'Luk\',8,\'1-4\');">Lu 8:1-4</a>) a second Galilean circuit of Jesus, after the return from which a new series of exciting incidents took place at Capernaum.<P>a) Galilee Revisited:<P>(<a onClick="return mV(\'Luk\',8,\'1-4\');">Luke 8:1-4</a>)<P>The circuit was an extensive one—"went about through cities and villages (literally, "according to city and village"), preaching." During this journey Jesus was attended by the Twelve, and by devoted women (Mary Magdalene, Joanna, wife of Herod\'s steward, Susanna, and others), who ministered to Him of their substance (<a onClick="return mV(\'Luk\',8,2,3);">Lu 8:2,3</a>). At the close of this circuit Jesus returned to Capernaum.<P>b) Cure of Demoniac—Discourse on Blasphemy:<P>Jesus, no doubt, wrought numerous miracles on demoniacs (compare <a onClick="return mV(\'Luk\',8,1,2);">Lu 8:1,2</a>; out of Mary Magdalene He is said to have cast 7 demons—perhaps a form of speech to indicate the severity of the possession). The demoniac now brought to Jesus was blind and dumb. Jesus cured him, with the double result that the people were filled with amazement: "Can this be the son of David?" (<a onClick="return mV(\'Mat\',12,23);">Mt 12:23</a>), while the Pharisees blasphemed, alleging that Jesus cast out demons by the help of Beelzebub (Greek, Beelzeboul), the prince of the demons (see under the word). A quite similar incident is narrated in <a onClick="return mV(\'Mat\',9,\'32-34\');">Mt 9:32-34</a>; and Luke gives the discourse that follows in a later connection (<a onClick="return mV(\'Luk\',11,11);">11:14</a>ff). The accusation may well have been repeated more than once. Jesus, in reply, points out, first, the absurdity of supposing Satan to be engaged in warring against his own kingdom (<a onClick="return mV(\'Mat\',18,25);">Mt 18:25</a> parallel; here was plainly a stronger than Satan); then utters the momentous word about blasphemy against the Holy Spirit. All other blasphemies—even that against the Son of Man (<a onClick="return mV(\'Mat\',12,32);">Mt 12:32</a>)—may be forgiven, for they may proceed from ignorance and misconception; but deliberate, perverse rejection of the light, and attributing to Satan what was manifestly of God, was a sin which, when matured—and the Pharisees came perilously near committing it—admitted of no forgiveness, either in this world or the next, for the very capacity for truth in the soul was by such sin destroyed. Mark has the strong phrase, "is guilty of an eternal sin" (<a onClick="return mV(\'Mar\',3,29);">3:29</a>). Pertinent words follow as to the root of good and evil in character (<a onClick="return mV(\'Mat\',12,\'33-37\');">Mt 12:33-37</a>).<P>See <a href="./study/isbe/search.html?string=BLASPHEMY">BLASPHEMY</a>.<P>The Sign of Jonah.<P>Out of this discourse arose the usual Jewish demand for a "sign" (<a onClick="return mV(\'Mat\',12,38);">Mt 12:38</a>; compare <a onClick="return mV(\'Luk\',11,\'29-32\');">Lu 11:29-32</a>), which Jesus met by declaring that no sign would be given but the sign of the prophet Jonah—an allusion to His future resurrection. He reiterates His warning to the people of His generation for their rejection of greater light than had been enjoyed by the Ninevites and the Queen of Sheba.<P>Two incidents, not dissimilar in character, interrupted this discourse—one the cry of a woman in the audience (if the time be the same, <a onClick="return mV(\'Luk\',11,27,28);">Lu 11:27,28</a>), "Blessed is the womb that bare thee," etc., to which Jesus replied, "Yea rather, blessed are they that hear the word of God, and keep it"; the other, a message that His mother and brethren (doubtless anxious for His safety) desired to speak with Him.<P>c) Christ\'s Mother and Brethen:<P>To this, stretching out His hand toward His disciples, Jesus answered, "Behold, my mother and my brethren" (<a onClick="return mV(\'Mar\',3,34);">Mr 3:34</a>), etc. Kinship in the spiritual kingdom consists in fidelity to the will of God, not in ties of earthly relationship.<P>4. Teaching in Parables:<P>(<a onClick="return mV(\'Mat\',13,\'1-52\');">Matthew 13:1-52</a>; <a onClick="return mV(\'Mar\',4,\'1-34\');">Mark 4:1-34</a>; <a onClick="return mV(\'Luk\',8,\'4-15\');">Luke 8:4-15</a>; <a onClick="return mV(\'Luk\',13,\'18-21\');">13:18-21</a>)<P>On the same day on which the preceding discourses were delivered, Jesus, seeing the multitudes, passed to the shore, and entering a boat, inaugurated a new method in His public. teaching. This was the speaking in parables. Similitude, metaphor, always entered into the teaching of Jesus (compare <a onClick="return mV(\'Mat\',7,\'24-27\');">Mt 7:24-27</a>), and parable has once been met with (<a onClick="return mV(\'Luk\',7,41,42);">Lu 7:41,42</a>); now parable is systematically employed as a means of imparting and illustrating important truths, while yet veiling them from those whose minds were hostile and unreceptive (<a onClick="return mV(\'Mar\',4,\'10-12\');">Mr 4:10-12</a>; <a onClick="return mV(\'Luk\',8,9,10);">Lu 8:9,10</a>). The parable thus at once reveals and conceals. The motive of this partially veiled teaching was the growing hostility of the Pharisees. In its nature the parable (from a verb signifying "to place side by side") is a representation in some form of earthly analogy of truths relating to Divine and eternal things (see <a href="./study/isbe/search.html?string=PARABLE">PARABLE</a>). The parables of the kingdom brought together in <a onClick="return mV(\'Mat\',13,1);">Mt 13</a> form an invaluable series, though not all were spoken in public (compare <a onClick="return mV(\'Mat\',13,\'36-52\');">Mt 13:36-52</a>), and some may belong to a later occasion (compare <a onClick="return mV(\'Luk\',13,\'18-21\');">Lu 13:18-21</a>). Mark adds the parable of the Seed Growing Secretly (<a onClick="return mV(\'Mar\',4,\'26-29\');">4:26-29</a>). Of three of the parables (the Sower, the Tares, the Dragnet), Jesus Himself gives the interpretation.<P>Parables of the Kingdom.<P>In series the parables at once mirror the origin, mixed character and development of the kingdom in its present imperfect earthly condition, and the perfection which awaits it after the crisis at the end. In the parable of the Sower is represented the origin of the kingdom in the good seed of the word, and the varied soils on which that seed falls; in the Seed Growing Secretly, the law of orderly growth in the kingdom; in the parable of the Tares, the mixed character of the subjects of the kingdom; in those of the Mustard Seed and Leaven, the progress of the kingdom—external growth, internal tramsformative effect; in those of the Treasure and Pearl the finding and worth of the kingdom; in that of the Dragnet the consummation of the kingdom. Jesus compares His disciples, if they understand these things, to householders bringing out of their treasure "things new and old" (<a onClick="return mV(\'Mat\',13,52);">Mt 13:52</a>).<P>IV. From the Crossing to Gadara to the Mission of the Twelve—a Third Circuit.<P>1. Crossing of the Lake—Stilling of the Storm:<P>(<a onClick="return mV(\'Mat\',8,\'18-27\');">Matthew 8:18-27</a>; <a onClick="return mV(\'Mar\',4,\'35-41\');">Mark 4:35-41</a>; <a onClick="return mV(\'Luk\',8,\'22-25\');">Luke 8:22-25</a>; compare <a onClick="return mV(\'Luk\',9,\'57-62\');">9:57-62</a>)<P>It was on the evening of the day on which He spoke the parables—though the chronology of the incident seems unknown to Luke (<a onClick="return mV(\'Luk\',8,22);">8:22</a>)—that Jesus bade His disciples cross over to the other side of the lake. At this juncture He was accosted by an aspirant for discipleship. Matthew gives two cases of aspirants; Luke (but in a different connection, <a onClick="return mV(\'Luk\',9,\'57-62\');">9:57-62</a>), three. Luke\'s connection (departure from Galilee) is perhaps preferable for the second and third; but the three may be considered together.<P>The three aspirants may be distinguished as,<P>(a) The forward disciple: he who in an atmosphere of enthusiasm offered himself under impulse, without counting the cost. The zeal of this would-be follower Jesus cheeks with the pathetic words, "The foxes have holes," etc. (<a onClick="return mV(\'Mat\',8,20);">Mt 8:20</a>; <a onClick="return mV(\'Luk\',9,58);">Lu 9:58</a>).<P>(b) The procrastinating disciple. The first candidate needed repression; the second needs impulsion.<P>a) Aspirants for Disciplineship:<P>He would follow Jesus, but first let him bury his father. There had come a crisis, however, when the Lord\'s claim was paramount: "Leave the dead to bury their own dead" (<a onClick="return mV(\'Mat\',8,22);">Mt 8:22</a>). There are at times higher claims than mere natural relationships, to which, in themselves, Jesus was the last to be indifferent.<p>(c) The wavering disciple. The third disciple is again one who offers himself, but his heart was too evidently still with the things at home. Jesus, again, lays His finger on the weak spot, "No man, having put his hand to the plow, and looking back," etc. (<a onClick="return mV(\'Luk\',9,62);">Lu 9:62</a>). As mentioned, the latter two cases tally better with a final departure from Galilee than with a temporary crossing of the lake.<P>b) The Storm Calmed:<P>The inland lake was exposed to violent and sudden tempests. One of these broke on the disciples\' boat as they sailed across. Everyone\'s life seemed in jeopardy. Jesus, meanwhile, in calmest repose, was asleep on a cushion in the stern (<a onClick="return mV(\'Mar\',4,38);">Mr 4:38</a>). The disciples woke Him almost rudely: "Teacher, carest thou not that we perish?" Jesus at once arose, and, reproving their want of faith, rebuked wind and waves ("Peace, be still"). Immediately there was a great calm. It was a new revelation to the disciples of the majesty of their Master. "Who then is this, that even the wind and the sea obey him?"<P>2. The Gadarene (Gerasene) Demoniac:<P>(<a onClick="return mV(\'Mat\',8,\'28-34\');">Matthew 8:28-34</a>; <a onClick="return mV(\'Mar\',5,\'1-20\');">Mark 5:1-20</a>; <a onClick="return mV(\'Luk\',8,\'26-39\');">Luke 8:26-39</a>)<P>The lake being crossed, Jesus and His disciples came into the country of the Gadarenes (Matthew), or Gerasenes (Mark, Luke)—Gadara being the capital of the district (on the topography, compare Stanley, Sinai and Palestine, 380-81). From the lake shore rises a mountain in which are ancient tombs. Here Jesus was met by a demoniac (Matthew mentions two demoniacs: M. Henry\'s quaint comment is, "If there were two, there was one." Possibly one was the fiercer of the two, the other figuring only as his companion). The man, as described, was a raving maniac of the worst type (<a onClick="return mV(\'Mar\',5,\'3-5\');">Mr 5:3-5</a>), dwelling in the tombs, wearing no clothes (<a onClick="return mV(\'Luk\',8,27);">Lu 8:27</a>), of supernatural strength, wounding himself, shrieking, etc. Really possessed by "an unclean spirit," his consciousness was as if he were indwelt by a "legion" of demons, and from that consciousness he addressed Jesus as the Son of God come for their tormenting. In what follows it is difficult to distinguish what belongs to the broken, incoherent consciousness of the man, and the spirit or spirits who spake through him. In the question, "What is thy name?" (<a onClick="return mV(\'Mar\',5,9);">Mr 5:9</a>) Jesus evidently seeks to arouse the victim\'s shattered soul to some sense of its own individuality. On Jesus commanding the unclean spirit to leave the man, the request was made that the demons might be permitted to enter a herd of swine feeding near. The reason of Christ\'s permission, with its result in the destruction of the herd ("rushed down the steep into the sea") need not be too closely scrutinized. It may have had an aspect of judgment on the (possibly) Jewish holders of the swine; or it may have had reference to the victim of the possession, as enabling him to realize his deliverance. Whatever the difficulties of the narrative, none of the rationalistic explanations afford any sensible relief from them. The object of the miracle may be to exclude rationalistic explanations, by giving a manifest attestation of the reality of the demon influence. When the people of the city came they found the man fully restored—"clothed and in his right mind." Yet, with fatal shortsightedness, they besought Jesus to depart from their borders. The man was sent home to declare to his friends the great things the Lord had done to him.<P>3. Jairus\' Daughter Raised—Woman with Issue of Blood:<P>(<a onClick="return mV(\'Mat\',9,\'18-26\');">Matthew 9:18-26</a>; <a onClick="return mV(\'Mar\',5,\'21-43\');">Mark 5:21-43</a>; <a onClick="return mV(\'Luk\',8,\'40-56\');">Luke 8:40-56</a>)<P>Repelled by the Gerasenes, Jesus received a warm welcome on His return to Capernaum on the western shore (<a onClick="return mV(\'Mar\',5,21);">Mr 5:21</a>). It was probably at this point that Matthew gave the feast formerly referred to.<P>It was in connection with this feast, Matthew himself informs us (<a onClick="return mV(\'Mar\',9,18);">9:18</a>), that Jairus, one of the rulers of the synagogue, made his appeal for help. His little daughter, about 12 years old (<a onClick="return mV(\'Luk\',8,42);">Lu 8:42</a>), was at the point of death; indeed, while Jesus was coming, she died. The ruler\'s faith, though real, was not equal to the centurion\'s, who believed that Jesus could heal without being present.<P>a) Jairus\' Appeal and Its Result:<P>Jesus came, and having expelled the professional mourners, in sacred privacy, only the father and mother, with Peter, James and John being permitted to enter the death-chamber, raised the girl to life. It is the second miracle on record of the raising from the dead.<P>b) The Afflicted Woman Cured:<P>On the way to the ruler\'s house occurred another wonder—a miracle within a miracle. A poor woman, whose case was a specially distressing one, alike as regards the nature of her malady, the length of its continuance, and the fruitlessness of her application to the physicians, crept up to Jesus, confident that if she could but touch the border of His garment, she would be healed. The woman was ignorant; her faith was blended with superstition; but Jesus, reading the heart, gave her the benefit she desired. It was His will, however, that, for her own good, the woman thus cured should not obtain the blessing by stealth. He therefore brought her to open confession, and cheered her by His commendatory word.<P>4. Incidents of Third Circuit:<P>(<a onClick="return mV(\'Mat\',9,\'27-38\');">Matthew 9:27-38</a>; <a onClick="return mV(\'Mat\',13,\'53-58\');">13:53-58</a>; <a onClick="return mV(\'Mar\',6,\'1-6\');">Mark 6:1-6</a>)<P>At this point begins apparently a new evangelistic tour (<a onClick="return mV(\'Mat\',9,35);">Mt 9:35</a>; <a onClick="return mV(\'Mar\',6,6);">Mr 6:6</a>), extending methodically to "all the cities and villages." To it belong in the narratives the healing of two blind men (compare the case of Bartimeus, recorded later); the cure of a demoniac who was dumb—a similar case to that in <a onClick="return mV(\'Mat\',12,22);">Mt 12:22</a>; and a second rejection at Nazareth (Matthew, Mark). The incident is similar to that in <a onClick="return mV(\'Luk\',4,\'16-30\');">Lu 4:16-30</a>, and shows, if the events are different, that the people\'s hearts were unchanged. Of this circuit Matthew gives an affecting summary (<a onClick="return mV(\'Mat\',9,\'35-38\');">9:35-38</A>), emphasizing the Lord\'s compassion, and His yearning for more laborers to reap the abundant harvest.<P>5. The Twelve Sent Forth—Discourse of Jesus:<P>(<a onClick="return mV(\'Mat\',10,\'1-\');">Matthew 10</a>; <a onClick="return mV(\'Mar\',6,\'7-13\');">Mark 6:7-13</a>; <a onClick="return mV(\'Luk\',9,\'1-6\');">Luke 9:1-6</a>; compare <a onClick="return mV(\'Luk\',10,\'2-24\');">Luke 10:2-24</a>; <a onClick="return mV(\'Luk\',12,\'2-12\');">12:2-12</a>, etc.)<P>Partly with a view to the needs of the rapidly growing work and the training of the apostles, and partly as a witness to Israel (<a onClick="return mV(\'Mat\',10,6,23);">Mt 10:6,23</a>), Jesus deemed it expedient to send the Twelve on an independent mission. The discourse in Matthew attached to this event seems, as frequently, to be a compilation. Parts of it are given by Luke in connection with the mission of the Seventy (<a onClick="return mV(\'Luk\',10,1);">Lu 10:1</a>; the directions were doubtless similar in both cases); parts on other occasions (<a onClick="return mV(\'Luk\',12,\'2-12\');">Lu 12:2-12</a>; <a onClick="return mV(\'Luk\',21,\'12-17\');">21:12-17</a>, etc.; compare <a onClick="return mV(\'Mar\',13,\'9-13\');">Mr 13:9-13</a>).<P>The Twelve were sent out two by two. Their work was to be a copy of the Master\'s—to preach the gospel and to heal the sick. To this end they were endowed with authority over unclean spirits, and over all manner of sickness. They were to go forth free from all encumbrances—no money, no scrip, no changes of raiment, no staff (save that in their hand, <a onClick="return mV(\'Mar\',6,8);">Mr 6:8</a>), sandals only on their feet, etc.<P>a) The Commission:<P>They were to rely for support on those to whom they preached. They were for the present to confine their ministry to Israel. The saying in <a onClick="return mV(\'Mat\',10,23);">Mt 10:23</a>, "Ye shall not have gone through the cities of Israel, till the Son of man be come," apparently has reference to the judgment on the nation, not to the final coming (compare <a onClick="return mV(\'Mat\',16,28);">16:28</a>).<P>b) Counsels and Warnings:<P>The mission of the Twelve was the first step of Christianity as an aggressive force in society. Jesus speaks of it, accordingly, in the light of the whole future that was to come out of it. He warns His apostles faithfully of the dangers that awaited them; exhorts them to prudence and circumspection ("wise as serpents," etc.); holds out to them Divine promises for consolation; directs them when persecuted in one place to flee to another; points out to them from His own case that such persecutions were only to be expected. He assures them of a coming day of revelation; bids them at once fear and trust God; impresses on them the duty of courage in confession; inculcates in them supreme love to Himself. That love would be tested in the dearest relations, In itself peace, the gospel would be the innocent occasion of strife, enmity and division among men. Those who receive Christ\'s disciples will not fail of their reward.<P>When Christ had ended His discourse He proceeded with His own evangelistic work, leaving the disciples to inaugurate theirs (<a onClick="return mV(\'Mat\',11,1);">Mt 11:1</a>).``132';
isbe[5022]='Jesus Christ, 4C2`Second Period—After the Mission of the Twelve till the Departure from Galilee<P>I. From the Death of the Baptist till the Discourse on Bread of Life.<P>1. The Murder of the Baptist and Herod\'s Alarms:<P>(<a onClick="return mV(\'Mat\',14,\'1-12\');">Matthew 14:1-12</a>; <a onClick="return mV(\'Mar\',6,\'14-29\');">Mark 6:14-29</a>; <a onClick="return mV(\'Luk\',9,\'7-9\');">Luke 9:7-9</a>; compare <a onClick="return mV(\'Luk\',3,\'18-20\');">3:18-20</a>)<P>Shortly before the events now to be narrated, John the Baptist had been foully murdered in his prison by Herod Antipas at the instigation of Herodias, whose unlawful marriage with Herod John had unsparingly condemned. Josephus gives as the place of the Baptist\'s imprisonment the fortress of Macherus, near the Dead Sea (Ant., XVIII, v, 2); or John may have been removed to Galilee. Herod would ere this have killed John, but was restrained by fear of the people (<a onClick="return mV(\'Mat\',14,5);">Mt 14:5</a>). The hate of Herodias, however, did not slumber. Her relentless will contrasts with the vacillation of Herod, as Lady Macbeth in Shakspeare contrasts with Macbeth. A birthday feast gave her the opening she sought for. Her daughter Saleme, pleasing Herod by her dancing, obtained from him a promise on oath to give her whatever she asked. Prompted by Herodias, she boldly demanded John the Baptist\'s head. The weak king was shocked, but, for his oath\'s sake, granted her what she craved. The story tells how the Baptist\'s disciples reverently buried the remains of their master, and went and told Jesus. Herod\'s conscience did not let him rest. When rumors reached him of a wonderful teacher and miracle-worker in Galilee, he leaped at once to the conclusion that it was John risen from the dead. Herod cannot have heard much of Jesus before. An evil conscience makes men cowards.<P>Another Passover drew near (<a onClick="return mV(\'Jhn\',6,4);">Joh 6:4</a>), but Jesus did not on this occasion go up to the feast.<P>Returning from their mission, the apostles reported to Jesus what they had said and done (<a onClick="return mV(\'Luk\',9,10);">Lu 9:10</a>); Jesus had also heard of the Baptist\'s fate, and of Herod\'s fears, and now proposed to His disciples a retirement to a desert place across the lake, near Bethsaida (on the topography, compare Stanley, op. cit.,375,381).<P>2. The Feeding of the Five Thousand:<P>(<a onClick="return mV(\'Mat\',14,\'13-21\');">Matthew 14:13-21</a>; <a onClick="return mV(\'Mar\',6,\'30-44\');">Mark 6:30-44</a>; <a onClick="return mV(\'Luk\',9,\'10-17\');">Luke 9:10-17</a>; <a onClick="return mV(\'Jhn\',6,\'1-14\');">John 6:1-14</a>)<P>As it proved, however, the multitudes had observed their departure, and, running round the shore, were at the place before them (<a onClick="return mV(\'Mar\',6,33);">Mr 6:33</a>). The purpose of rest was frustrated, but Jesus did not complain. He pitied the shepherdless state of the people, and went out to teach and heal them. The day wore on, and the disciples suggested that the fasting multitude should disperse, and seek victuals in the nearest towns and villages. This Jesus, who had already proved Philip by asking how the people should be fed (<a onClick="return mV(\'Jhn\',6,5);">Joh 6:5</a>), would not permit. With the scanty provision at command—5 loaves and 2 fishes—He fed the whole multitude. By His blessing the food was multiplied till all were satisfied, and 12 baskets of fragments, carefully collected, remained over. It was astupendous act of creative power, no rationalizing of which can reduce it to natural dimensions.<P>3. Walking on the Sea:<P>(<a onClick="return mV(\'Mat\',14,\'22-33\');">Matthew 14:22-33</a>; <a onClick="return mV(\'Mar\',6,\'45-52\');">Mark 6:45-52</a>; <a onClick="return mV(\'Jhn\',6,\'15-21\');">John 6:15-21</a>)<P>The enthusiasm created by this miracle was intense (<a onClick="return mV(\'Jhn\',6,14);">Joh 6:14</a>). Matthew and Mark relate (Luke here falls for a time out of the Synopsis) that Jesus hurriedly constrained His disciples to enter into their boat and recross the lake—this though a storm was gathering—while He Himself remained in the mountain alone in prayer. John gives the key to this action in the statement that the people were about to take Him by force and make Him a king (<a onClick="return mV(\'Jhn\',6,15);">6:15</a>). Three hours after midnight found the disciples still in the midst of the lake, "distressed in rowing" (<a onClick="return mV(\'Mar\',6,48);">Mr 6:48</a>), deeply anxious because Jesus was not, as on a former occasion, with them. At last, at the darkest hour of their extremity, Jesus was seen approaching in a way unlooked-for—walking on the water. Every new experience of Jesus was a surprise to the disciples. They were at first terrified, thinking they saw a spirit, but straightway the well-known voice was heard, "Be of good cheer: it is I; be not afraid." In the rebound of his feelings the impulsive Peter asked Jesus to permit him to come to Him on the water (Matthew). Jesus said "Come," and for the first moment or two Peter did walk on the water; then, as he realized his unwonted situation, his faith failed, and he began to sink. Jesus, with gentle chiding, caught him, and assisted him back into the boat. Once again the sea was calmed, and the disciples watch found themselves safely at land. To their adoring minds the miracle of the loaves was eclipsed by this new marvel (<a onClick="return mV(\'Mar\',6,52);">Mr 6:52</a>).<P>4. Gennesaret—Discourse on the Bread of Life:<P>(<a onClick="return mV(\'Mat\',14,\'34-36\');">Matthew 14:34-36</a>; <a onClick="return mV(\'Mar\',6,\'53-56\');">Mark 6:53-56</a>; <a onClick="return mV(\'Jhn\',6,\'22-71\');">John 6:22-71</a>)<P>On the return to Gennesaret the sick from all quarters were brought to Jesus—the commencement apparently of a new, more general ministry of healing (<a onClick="return mV(\'Mar\',6,56);">Mr 6:56</a>). Meanwhile—here we depend on John—the people on the other side of the lake, when they found that Jesus was gone, took boats hastily, and came over to Capernaum. They found Jesus apparently in the synagogue (<a onClick="return mV(\'Mar\',6,59);">6:59</a>). In reply to their query, "Rabbi, when camest thou hither?" Jesus first rebuked the motive which led them to follow Him—not because they had seen in His miracles "signs" of higher blessings, but because they had eaten of the loaves and were filled (<a onClick="return mV(\'Mar\',6,26);">6:26</A>)—then spoke to them His great discourse on the bread from heaven. "Work," He said, "for the food which abideth unto eternal life, which the Son of man shall give unto you" (<a onClick="return mV(\'Mar\',6,27);">6:27</A>). When asked to authenticate His claims by a sign from heaven like the manna, He replied that the manna also (given not by Moses but by God) was but typical bread, and surprised them by declaring that He Himself was the true bread of life from heaven (<a onClick="return mV(\'Mar\',6,35,51);">6:35,51</a>). The bread was Christ\'s flesh, given for the life of the world; His flesh and blood must be eaten and drunk (a spiritual appropriation through faith, <a onClick="return mV(\'Mar\',6,63);">6:63</a>), if men were to have eternal life. Jesus of set purpose had put His doctrine in a strong, testing manner. The time had come when His hearers must make their choice between a spiritual acceptance of Him and a break with Him altogether. What He had said strongly offended them, both on account of the claims implied (<a onClick="return mV(\'Mar\',6,42);">6:42</a>), and on account of the doctrine taught, which, they were plainly told, they could not receive because of their carnality of heart (<a onClick="return mV(\'Mar\',6,43,44,\'61-64\');">6:43,44,61-64</A>). Many, therefore, went back and walked no more with Him (<a onClick="return mV(\'Mar\',6,60,61,66);">6:60,61,66</a>); but their defection only evoked from the chosen Twelve a yet more confident confession of their faith. "Would ye also go away?"<P>Peter\'s First Confession.<P>Peter, as usual, spoke for the rest: "Lord, to whom shall we go?...We have believed and know that thou art the Holy One of God" (<a onClick="return mV(\'Jhn\',6,69);">Joh 6:69</a>). Here, and not first at Caesarea Philippi (<a onClick="return mV(\'Mat\',16,16);">Mt 16:16</a>), is Peter\'s brave confession of his Master\'s Messiahship. Twelve thus confessed Him, but even of this select circle Jesus was compelled to say, "One of you (Judas) is a devil" (<a onClick="return mV(\'Jhn\',6,70,71);">Joh 6:70,71</a>).<P>II. From Disputes with the Pharisees till the Transfiguration.<P>The discourse in Capernaum seems to mark a turning-point in the Lord\'s ministry in Galilee. Soon after we find Him ceasing from public teaching, and devoting Himself to the instruction of His apostles (<a onClick="return mV(\'Mat\',15,21);">Mt 15:21</a>; <a onClick="return mV(\'Mar\',7,24);">Mr 7:24</a>, etc.).<P>1. Jesus and Tradition—Outward and Inward Purity:<P>(<a onClick="return mV(\'Mat\',15,\'1-20\');">Matthew 15:1-20</a>; <a onClick="return mV(\'Mar\',7,\'1-23\');">Mark 7:1-23</a>)<P>Meanwhile, that Christ\'s work in Galilee was attracting the attention of the central authorities, is shown by the fact that scribes and Pharisees came up from Jerusalem to watch Him. They speedily found ground of complaint against Him in His unconventional ways and His total disregard of the traditions of the elders. They specially blamed Him for allowing His disciples to eat bread with "common," i.e. unwashen hands. Here was a point on which the Pharisees laid great stress (<a onClick="return mV(\'Mar\',7,3,4);">Mr 7:3,4</a>). Ceremonial ablutions (washing "diligently," Greek "with the fist"; "baptizings" of person and things) formed a large part of their religion. These washings were part of the "oral tradition" said to have been delivered to Moses, and transmitted by a succession of elders. Jesus set all this ceremonialism aside. It was part of the "hypocrisy" of the Pharisees (<a onClick="return mV(\'Mar\',7,6);">Mr 7:6</a>). When questioned regarding it, He drew a sharp distinction between God\'s commandment in the Scriptures and man\'s tradition, and accused the Pharisees (instancing "<a href="./study/isbe/search.html?string=Corban">Corban</a>" (which see), in support, <a onClick="return mV(\'Mar\',7,\'10-12\');">Mr 7:10-12</a>) of making "void" the former through the latter. This led to the wider question of wherein real defilement consisted. Christ\'s rational position here is that it did not consist in anything outward, as in meats, but consisted in what came from within the man: as Jesus explained afterward, in the outcome of his heart or moral life: "Out of the heart of men evil thoughts proceed," etc. (<a onClick="return mV(\'Mar\',7,\'20-23\');">Mr 7:20-23</a>). Christ\'s saying was in effect the abrogation of the old ceremonial distinctions, as Mark notes: "making all meats clean" (<a onClick="return mV(\'Mar\',7,19);">Mr 7:19</a>). The Pharisees, naturally, were deeply offended at His sayings, but Jesus was unmoved. Every plant not of the Father\'s planting must be rooted up (<a onClick="return mV(\'Mar\',7,13);">Mr 7:13</a>).<P>2. Retirement to Tyre and Sidon—the Syrophoenician Woman:<P>(<a onClick="return mV(\'Mat\',15,\'21-28\');">Matthew 15:21-28</a>; <a onClick="return mV(\'Mar\',7,\'24-30\');">Mark 7:24-30</a>)<P>From this point Jesus appears, in order to escape notice, to have made journeys privately from place to place. His first retreat was to the borders, or neighborhood, of Tyre and Sidon. From <a onClick="return mV(\'Mar\',7,31);">Mr 7:31</a> it is to be inferred that He entered the heathen territory. He could not, however, be hid (<a onClick="return mV(\'Mar\',7,24);">Mr 7:24</a>). It was not long ere, in the house into which He had entered, there reached Him the cry of human distress. A woman came to Him, a Greek (or Gentile, Greek-speaking), but Syrophoenician by race. Her "little daughter" was grievously afflicted with an evil spirit. Flinging herself at His feet, and addressing Him as "Son of David," she besought His mercy for her child. At first Jesus seemed—yet only seemed—to repel her, speaking of Himself as sent only to the lost sheep of Israel, and of the unmeetness of giving the children\'s loaf to the dogs (the Greek softens the expression, "the little dogs"). With a beautiful urgency which won for her the boon she sought, the woman seized on the word as an argument in her favor. "Even the dogs under the table eat of the children\'s crumbs." The child at Jesus\' word was restored.<P>3. At Decapolis—New Miracles:<P>(<a onClick="return mV(\'Mat\',15,\'29-39\');">Matthew 15:29-39</a>; <a onClick="return mV(\'Mar\',7,\'31-37\');">Mark 7:31-37</a>; <a onClick="return mV(\'Mar\',8,\'1-10\');">8:1-10</a>)<P>Christ\'s second retreat was to Decapolis—the district of the ten cities—east of the Jordan. Here also He was soon discovered, and followed by the multitude. Sufferers were brought to Him, whom He cured (<a onClick="return mV(\'Mat\',15,30);">Mt 15:30</a>). Later, He fed the crowds.<P>The miracle of the deaf man is attested only by Mk. The patient was doubly afflicted, being deaf, and having an impediment in his speech. The cure presents several peculiarities—its privacy (<a onClick="return mV(\'Mat\',15,33);">Mt 15:33</a>); the actions of Jesus in putting his fingers into his ears, etc. (a mode of speech by signs to the deaf man); His "sign," accompanied with prayer, doubtless accasioned by something in the man\'s look; the word Ephphatha (<a onClick="return mV(\'Mat\',15,34);">Mt 15:34</a>)—"Be opened."<P>a) The Deaf Man:<P>(<a onClick="return mV(\'Mar\',7,\'32-37\');">Mark 7:32-37</a>)<P>The charge to those present not to blazon the deed abroad was disregarded. Jesus desired no cheap popularity.<P>b) Feeding of Four Thousand:<P>(<a onClick="return mV(\'Mat\',15,\'32-39\');">Matthew 15:32-39</a>; <a onClick="return mV(\'Mar\',8,\'1-9\');">Mark 8:1-9</a>)<P>The next miracle closely resembles the feeding of the Five Thousand at Bethsaida, but the place and numbers are different; 4,000 instead of 5,000; 7 loaves and a few fishes, instead of 5 loaves and 2 fishes; 7 baskets of fragments instead of 12 (Mark\'s term denotes a larger basket). There is no reason for doubting the distinction of the incidents (compare <a onClick="return mV(\'Mat\',16,9,10);">Mt 16:9,10</a>; <a onClick="return mV(\'Mar\',8,19,20);">Mr 8:19,20</a>).<P>4. Leaven of the Pharisees, etc.—Cure of Blind Man:<P>(<a onClick="return mV(\'Mat\',16,\'1-12\');">Matthew 16:1-12</a>; <a onClick="return mV(\'Mar\',8,\'11-26\');">Mark 8:11-26</a>)<P>Returning to the plain of Gennesaret (Magdala, <a onClick="return mV(\'Mat\',15,39);">Mt 15:39</a> the King James Version; parts of Dalmanutha, <a onClick="return mV(\'Mar\',8,10);">Mr 8:10</a>), Jesus soon found Himself assailed by His old adversaries. Pharisees and Sadducees were now united. They came "trying" Jesus, and asking from Him a "sign from heaven"—some signal Divine manifestation. "Sighing deeply" (Mark) at their caviling spirit, Jesus repeated His word about the sign of Jonah. The times in which they lived were full of signs, if they, so proficient in weather signs, could only see them. To be rid of such questioners, Jesus anew took boat to Bethsaida. On the way He warned His disciples against the leaven of the spirit they had just encountered. The disciples misunderstood, thinking that Jesus referred to their forgetfulness in not taking bread (Mark states in his graphic way that they had only one loaf). The leaven Christ referred to, in fact, represented three spirits:<P class="in15">(1) the Pharisaic leaven—formalism and hypocrisy;<P class="in15">(2) the Sadducean leaven—rationalistic skepticism;<P class="in15">(3) the Herodian leaven (<a onClick="return mV(\'Mar\',8,15);">Mr 8:15</a>)—political expediency and temporizing.<P>Arrived at Bethsaida, a miracle was wrought on a blind man resembling in some of its features the cure of the deaf man at Decapolis. In both cases Jesus took the patients apart; in both physical means were used—the spittle ("spit on his eyes," <a onClick="return mV(\'Mar\',8,23);">Mr 8:23</a>); in both there was strict injunction not to noise the cure abroad. Another peculiarity was the gradualness of the cure. It is probable that the man had not been blind from his birth, else he could hardly have recognized men or trees at the first opening. It needed that Jesus should lay His hands on Him before he saw all things clearly.<P>5. At Caesarea Philippi—The Great Confession—First Announcement of Passion:<P>(<a onClick="return mV(\'Mat\',16,\'13-28\');">Matthew 16:13-28</a>; <a onClick="return mV(\'Mar\',8,\'27-30\');">Mark 8:27-30</a>; <a onClick="return mV(\'Luk\',9,\'18-27\');">Luke 9:18-27</a>)<P>The next retirement of Jesus with His disciples was to the neighborhood of Caesarea Philippi, near the source of the Jordan. This was the northernmost point of His journeyings. Here, "on the geographical frontier between Judaism and heathenism" (Liddon), our Lord put the momentous question which called forth Peter\'s historical confession.<P>(1) The Voices of the Age and the External Truth.<P>The question put to the Twelve in this remote region was: "Who do men say that the Son of man is?" "Son of man," as already said, was the familiar name given by Jesus to Himself, to which a Messianic significance might or might not be attached, according to the prepossessions of His hearers. First the changeful voices of the age were recited to Jesus: "Some say John the Baptist; some, Elijah," etc. Next, in answer to the further question: "But who say ye that I am ?" there rang out from Peter, in the name of all, the unchanging truth about Jesus: "Thou art the Christ, the Son of the living God." In clearness, boldness, decision, Peter\'s faith had attained a height not reached before. The confession
