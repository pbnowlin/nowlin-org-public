isbe[5037]='Jeush`je\'-ush (ye\'ush, probably "he protects," "he comes to help"; see HPN, 109; Kethibh is ye\'ish, in <a onClick="return mV(\'Gen\',36,5,14);">Ge 36:5,14</a>; <a onClick="return mV(\'1Ch\',7,10);">1Ch 7:10</a>):<P>(1) A "son" of Esau (<a onClick="return mV(\'Gen\',36,5,14,18);">Ge 36:5,14,18</a>; <a onClick="return mV(\'1Ch\',1,35);">1Ch 1:35</a>). "The name is thought by some to be identical with that, of an Arabian lion-god Yagut ...., meaning \'helper,\' whose antiquity is vouched for by inscriptions of Thamud" (Skinner, Genesis, 432).<P>(2) A Benjamite (<a onClick="return mV(\'1Ch\',7,10);">1Ch 7:10</a>), but probably a Zebulunite. See Curtis, Chronicles, 145ff.<P>(3) A descendant of King Saul, the King James Version "Jehush" (<a onClick="return mV(\'1Ch\',8,39);">1Ch 8:39</a>).<P>(4) A Gershonite Levite (<a onClick="return mV(\'1Ch\',23,10,11);">1Ch 23:10,11</a>).<P>(5) A son of King Rehoboam (<a onClick="return mV(\'2Ch\',11,19);">2Ch 11:19</a>).``149';
isbe[5038]='Jeuz`je\'-uz ye\'-uts "he counsels"): The eponym of a Benjamite family (<a onClick="return mV(\'1Ch\',8,10);">1Ch 8:10</a>).``1';
isbe[5039]='Jew, Jewess, Jewish`ju, joo, ju\'-ish, joo\'-ish (yehudhi plural yehudhim; Ioudaioi; feminine adjective yehudhith; Ioudaikos): "Jew" denotes originally an inhabitant of Judah (<a onClick="return mV(\'2Ki\',16,6);">2Ki 16:6</a> applies to the two tribes of the Southern Kingdom), but later the meaning was extended to embrace all descendants of Abraham. In the Old Testament the word occurs a few times in the singular. (<a onClick="return mV(\'Est\',2,5);">Es 2:5</a>; <a onClick="return mV(\'Est\',3,4);">3:4</a>, etc.; <a onClick="return mV(\'Jer\',34,9);">Jer 34:9</a>; <a onClick="return mV(\'Zec\',8,23);">Zec 8:23</a>); very frequently in the plural in Ezra and Nehemiah, Esther, and in Jeremiah and Daniel. The adjective in the Old Testament applies only to the "Jews\' language" or speech (<a onClick="return mV(\'2Ki\',18,26,28);">2Ki 18:26,28</a> parallel <a onClick="return mV(\'Neh\',13,24);">Ne 13:24</a>; <a onClick="return mV(\'Isa\',36,11,13);">Isa 36:11,13</a>). "Jews" (always plural) is the familiar term for Israelites in the Gospels (especially in John), Acts, Epistles, etc. "Jewess" occurs in <a onClick="return mV(\'1Ch\',4,18);">1Ch 4:18</a>; <a onClick="return mV(\'Act\',16,1);">Ac 16:1</a>; <a onClick="return mV(\'Act\',24,24);">24:24</a>. In <a onClick="return mV(\'Tts\',1,14);">Tit 1:14</a> a warning is given against "Jewish fables" (in Greek the adjective is found also in <a onClick="return mV(\'Gal\',2,14);">Ga 2:14</a>). The "Jews\' religion" (Ioudaismos) is referred to in <a onClick="return mV(\'Gal\',1,13,14);">Ga 1:13,14</a>. On the "Jews\' language,” see <a href="./study/isbe/search.html?string=LANGUAGES+OF+THE+OLD+TESTAMENT">LANGUAGES OF THE OLD TESTAMENT</a>; on the "Jews\' religion," see <a href="./study/isbe/search.html?string=ISRAEL,+RELIGION+OF">ISRAEL, RELIGION OF</a>``132';
isbe[5040]='Jewel`ju\'-el, joo\'-el: An ornament of gold, silver or of precious stones in the form of armlet, bracelet, anklet, nose-ring, etc. Oriental dress yields itself freely to such adornment, to which there are many allusions in Scripture. a frequent term in Hebrew is keli ("utensil," "vessel"), coupled with mention of "gold" or "silver" or both (<a onClick="return mV(\'Gen\',24,53);">Ge 24:53</a>; <a onClick="return mV(\'Exd\',3,22);">Ex 3:22</a>; <a onClick="return mV(\'Exd\',11,2);">11:2</a>; <a onClick="return mV(\'Exd\',12,35);">12:35</a>; <a onClick="return mV(\'Exd\',35,22);">35:22</a>; <a onClick="return mV(\'1Sa\',6,8,15);">1Sa 6:8,15</a>, etc.; the Revised Version (British and American) in <a onClick="return mV(\'2Ch\',32,27);">2Ch 32:27</a> translations "vessels"). In <a onClick="return mV(\'Sgs\',1,10);">So 1:10</a>, where the King James Version has "rows (of jewels)," the Revised Version (British and American) has "plaits (of hair)"; in <a onClick="return mV(\'Sgs\',7,1);">So 7:1</a>, the word is from a root chalah, meaning "to adorn." In 3 instances in the King James Version "jewel" represents the Hebrew nezem (<a onClick="return mV(\'Pro\',11,22);">Pr 11:22</a>; <a onClick="return mV(\'Isa\',3,21);">Isa 3:21</a>; <a onClick="return mV(\'Eze\',16,12);">Eze 16:12</a>); the American Standard Revised Version changes <a onClick="return mV(\'Pro\',11,22);">Pr 11:22</a> to "ring" Septuagint here = "earring"), and both the English Revised Version and the American Standard Revised Version have "ring" in <a onClick="return mV(\'Eze\',16,12);">Eze 16:12</a>. The familiar phrase in <a onClick="return mV(\'Mal\',3,17);">Mal 3:17</a>, "in that day when I make up my jewels," becomes in the English Revised Version, "in the day that I do make, even a peculiar treasure" (margin "or, wherein I do make a peculiar treasure"), and in the American Standard Revised Version, "even mine own possession, in the day that I make" (margin "or, do this").`<a href="./study/isbe/search.html?string=ORNAMENT">ORNAMENT</a>; <a href="./study/isbe/search.html?string=DRESS">DRESS</a>; <a href="./study/isbe/search.html?string=STONES,+PRECIOUS">STONES, PRECIOUS</a>`132';
isbe[5041]='Jewry`ju\'-ri, joo\'-ri: In <a onClick="return mV(\'Dan\',5,13);">Da 5:13</a> the King James Version, where the Revised Version (British and American) has "Judah"; in the New Testament, in two places in the King James Version, <a onClick="return mV(\'Luk\',23,5);">Lu 23:5</a>; <a onClick="return mV(\'Jhn\',7,1);">Joh 7:1</a>, where the Revised Version (British and American) has correctly "<a href="./study/isbe/search.html?string=JUDAEA">Judaea</a>" (Ioudaia) (which see).``1';
isbe[5042]='Jews`juz, jooz.`<a href="./study/isbe/search.html?string=JEW">JEW</a>`1';
isbe[5043]='Jezaniah`jez-a-ni\'-a (yezanyahu, probably "Yahweh hears"; compare <a href="./study/isbe/search.html?string=JAAZANIAH">JAAZANIAH</a>): In <a onClick="return mV(\'Jer\',40,8);">Jer 40:8</a>, and also <a onClick="return mV(\'Jer\',42,1);">42:1</a> where Septuagint has "Azariah," as in <a onClick="return mV(\'Jer\',43,2);">43:2</a> (see Driver, Jeremiah) = <a href="./study/isbe/search.html?string=JAAZANIAH">JAAZANIAH, (1)</a> (which see).``1';
isbe[5044]='Jezebel`jez\'-e-bel \'izebhel, "unexalted," "unhusbanded" (?); Iezabel; see BDB; <a onClick="return mV(\'1Ki\',16,31);">1Ki 16:31</a>; <a onClick="return mV(\'1Ki\',18,4,13119);">18:4,13,19</a>; <a onClick="return mV(\'1Ki\',19,1,2);">19:1,2</a>; <a onClick="return mV(\'1Ki\',21,5);">21:5</a>ff; <a onClick="return mV(\'2Ki\',9,7,30);">2Ki 9:7ff, 30ff</a>; <a onClick="return mV(\'Rev\',2,20);">Re 2:20</a>): Daughter of Ethbaal, king of the Zidonians, i.e. Phoenicians, and queen of Ahab, king of Northern Israel. Ahab (circa 874-853 BC) carried out a policy, which his father had perhaps started, of making alliances with other states. The alliance with the Phoenicians was cemented by his marriage with Jezebel, and he subsequently gave his daughter Athaliah in marriage to Jehoram, son of Jehoshaphat, king of Judah. His own union with Jezebel is regarded as a sin in <a onClick="return mV(\'1Ki\',16,31);">1Ki 16:31</a>, where the Massoretic Text is difficult, being generally understood as a question. The Septuagint translations: "and it was not enough that he should walk in the sins of Jeroboam ben Nebat, he also took to wife Jezebel," etc. The Hebrew can be pointed to mean, "And it was the lightest thing for him to walk in the sins of Jeroboam ben Nebat, he also took to wife Jezebel, and went and served Baal and worshipped him," i.e. all the other sins were light as compared with the marriage with Jezebel and the serving of Baal (compare <a onClick="return mV(\'Mic\',6,16);">Mic 6:16</a>). Is this a justifiable view to take of the marriage? One answer would be that Ahab made a wise alliance; that Baal-worship was not non-Hebrew, that Ahab named his children not alter Baal but after Yahweh (compare Ahaziah, Jehoram, Athaliah), and that he consulted the prophets of Yahweh (compare <a onClick="return mV(\'1Ki\',22,6);">1Ki 22:6</a>); further, that he only did what Solomon had done on a much larger scale; it may be added too that Ahab was in favor of religious toleration, and that Elijah and not the king is the persecutor. What then can be said for the unfavorable Verdict of the Hebrew historians? That verdict is based on the results and effects of the marriage, on the life and character of Jezebel, and in that life two main incidents demand attention.<P>1. Persecution of Yahweh\'s Prophets:<P>This is not described; it is only referred to in <a onClick="return mV(\'1Ki\',18,4);">1Ki 18:4</a>, "when Jezebel cut off the prophets of Yahweh"; and this shows the history of the time to be incompletely related. In <a onClick="return mV(\'1Ki\',18,19);">1Ki 18:19</a> we are further told that "450 prophets of Baal ate at her table" (commentators regard the reference to "400 prophets of the Asherah" as an addition). In <a onClick="return mV(\'1Ki\',19,1);">1Ki 19:1</a> Ahab tells Jezebel of the slaughter of the prophets of Baal by Elijah, and then Jezebel (<a onClick="return mV(\'1Ki\',19,2);">19:2</a>) sends a messenger to Elijah to threaten his life. This leads to the prophet\'s flight, an object which Jezebel had in view, perhaps, for she would hardly dare to murder Elijah himself. <a onClick="return mV(\'2Ki\',9,7);">2Ki 9:7</a> regards the massacre of Ahab\'s family as a punishment for the persecution of the prophets by Jezebel<P>2. Jezebel\'s Plot Against Naboth (<a onClick="return mV(\'1Ki\',21,\'1-\');">1Ki 21</a>):<P>Ahab expresses a desire to possess the vineyard neighboring upon his palace in Jezreel, owned by Naboth, who refuses to part with the family inheritance though offered either its money value or a better vineyard in exchange. Ahab is depressed at this, and Jezebel, upon finding the cause of his melancholy feelings, asks him sarcastically if he is not king, suggesting that as king his wishes should be immediately granted by his subjects. She thereupon plots to secure him Naboth\'s vineyard. Jezebel sends letters sealed in Ahab\'s name to the elders of Naboth\'s township, and bids them arrange a public fast and make Naboth "sit at the head of the people" (Revised Version margin), a phrase taken by some to mean that he is to be arraigned, while it is explained by others as meaning that Naboth is to be given the chief place. Two witnesses—a sufficient number for that purpose—are to be brought to accuse Naboth of blasphemy and treason. This is done, and Naboth is found guilty, and stoned to death. The property is confiscated, and falls to the king (<a onClick="return mV(\'1Ki\',21,\'1-16\');">1Ki 21:1-16</a>). Elijah hears of this, and is sent to threaten Ahab with Divine vengeance; dogs shall lick his dead body (<a onClick="return mV(\'1Ki\',21,19);">1Ki 21:19</a>). But in <a onClick="return mV(\'1Ki\',21,\'20-23\');">1Ki 21:20-23</a> this prophecy is made, not concerning Ahab but against Jezebel, and <a onClick="return mV(\'1Ki\',21,25);">21:25</a> attributes the sins of Ahab to her influence over him.<P>The prophecy is fulfilled in <a onClick="return mV(\'2Ki\',9,\'30-37\');">2Ki 9:30-37</a>. Ahaziah and Jehoram had succeeded their father Ahab; the one reigned for 2 years (<a onClick="return mV(\'1Ki\',22,51);">1Ki 22:51</a>), the other 12 years (<a onClick="return mV(\'2Ki\',3,1);">2Ki 3:1</a>). Jehu heads a revolt against the house of Ahab, and one day comes to Jezreel. Jezebel had "painted her eyes, and attired her head," and sees Jehu coming. She greets him sarcastically as his master\'s murderer. According to Massoretic Text, Jehu asks, "Who is on my side? who?" but the text is emended by Klostermann, following Septuagint in the main, "Who art thou that thou shouldest find fault with me?" i.e. thou art but a murderess thyself. She is then thrown down and the horses tread upon her (reading "they trod" for "he trod" in <a onClick="return mV(\'2Ki\',9,33);">2Ki 9:33</a>). When search is afterward made for her remains, they are found terribly mutilated. Thus was the prophecy fulfilled. (Some commentaries hold that Naboth\'s vineyard and Ahab\'s garden were in Samaria, and Naboth a Jezreelite. The words, "which was in Jezreel," of <a onClick="return mV(\'1Ki\',21,1);">1Ki 21:1</a> are wanting in Septuagint, which has "And Naboth had a vineyard by the threshing-floor of Ahab king of Samaria." But compare <a onClick="return mV(\'1Ki\',18,45);">1Ki 18:45</a>; <a onClick="return mV(\'1Ki\',21,23);">21:23</a>; <a onClick="return mV(\'2Ki\',8,29);">2Ki 8:29</a>; <a onClick="return mV(\'2Ki\',9,10,15,30);">9:10,15ff, 30ff</a>.)<P>See <a href="./study/isbe/search.html?string=AHAB">AHAB</a>; <a href="./study/isbe/search.html?string=JEHU">JEHU</a>.<P>3. Jezebel\'s Character:<P>The character of Jezebel is seen revived in that of her daughter, Athaliah of Judah (<a onClick="return mV(\'2Ki\',11,\'1-\');">2Ki 11</a>); there is no doubt that Jezebel was a powerful personality. She brought the worship of the Phoenician Baal and Astarte with her into Hebrew life, and indirectly introduced it into Judah as well as into the Northern Kingdom. In judging her connection with this propagation, we should bear in mind that she is not a queen of the 20th century; she must be judged in company with other queens famous in history. Her religious attitude and zeal might profitably be compared with that of Mary, queen of Scots. It must also be remembered that the introduction of any religious change is often resented when it comes from a foreign queen, and is apt to be misunderstood, e.g. the attitude of Greece to the proposal of Queen Olga have an authorized edition of the Bible in modern Greek.<P>On the other hand, although much may be said that would be favorable to Jezebel from the religious standpoint, the balance is heavy against her when we remember her successful plot against Naboth. It is not perhaps blameworthy in her that she upheld the religion of her native land, although the natural thing would have been to follow that of her adopted land (compare <a onClick="return mV(\'Rth\',1,16);">Ru 1:16</a>f). The superiority of Yahweh-worship was not as clear then as it is to us today. It may also be held that Baal-worship was not unknown in Hebrew life (compare <a onClick="return mV(\'Jdg\',6,25);">Jud 6:25</a>f), that Baal of Canaan had become incorporated with Yahweh of Sinai, and that there were pagan elements in the worship of the latter. But against all this it must be clear that the Baal whom Jezebel attempted to introduce was the Phoenician Baal, pure and simple; he was another god, or rather in him was presented an idea of God very different from Yahweh. And further, "in Phoenicia, where wealth and luxury had been enjoyed on a scale unknown to either Israel or the Canaanites of the interior, there was a refinement, if one may so speak, and at the same time a prodigality of vicious indulgences, connected with the worship of Baal and Astarte to which Israel had hitherto been a stranger ..... It was like a cancer eating into the vitals or a head and heart sickness resulting in total decay (<a onClick="return mV(\'Isa\',1,6);">Isa 1:6</a>). In Israel, moral deterioration meant political as well as spiritual death. The weal of the nation lay in fidelity to Yahweh alone, and in His pure worship" (HPM, section symbol 213).<P>The verdict of the Hebrew historian is thus substantiated. Jezebel is an example—an extreme one no doubt—of the bad influence of a highly developed civilization forcing itself with all its sins upon a community less highly civilized, but possessed of nobler moral and religious conceptions. She has parallels both in family and in national life. For a parallel to Elijah\'s attitude toward Jezebel compare the words of Carlyle about Knox in On Heroes and Hero-Worship, IV, especially the section, "We blame Knox for his intolerance," etc.<P>In <a onClick="return mV(\'Rev\',2,20);">Re 2:20</a>, we read of Iezabel, "the woman Jezebel, who calleth herself a prophetess"; not "thy wife" (i.e. the wife of the bishop) the Revised Version margin, but as Moffat (Expositor\'s Greek Testament) aptly renders, "that Jezebel of a woman alleging herself a prophetess." Some members of the church at Thyatira "under the sway of an influential woman refused to separate from the local guilds where moral interests, though not ostensibly defied, were often seriously compromised ..... Her lax principles or tendencies made for a connection with foreign and compromising associations which evidently exerted a dangerous influence upon some weaker Christians in the city." Her followers "prided themselves upon their enlightened liberalism (<a onClick="return mV(\'Rev\',2,24);">Re 2:24</a>)." Moffat rejects both the view of Schurer (Theol. Abhandlungen, 39f), that she is to be identified with the Chaldean Sibyl at Thyatira, and also that of Selwyn making her the wife of the local asiarch. "It was not the cults but the trade guilds that formed the problem at Thyatira." See also Zahn, Introduction to the New Testament, section symbol 73, note 7. `<a href="./study/isbe/search.html?string=AHAB">AHAB</a>; <a href="./study/isbe/search.html?string=BAAL">BAAL</a>; <a href="./study/isbe/search.html?string=ELIJAH">ELIJAH</a>.`149';

isbe[5053]='Jezreel`jez\'-re-el, jez\'-rel (yizre\'e\'l, "God soweth"):<P>(1) A city on the border of the territory of Issachar (<a onClick="return mV(\'Jos\',19,18);">Jos 19:18</a>).<P>1. Territory:<P>It is named with Chesulloth and Shunem (modern Iksal and Solam). It remained loyal to the house of Saul, and is mentioned as part of the kingdom over which Abner set Ishbosheth (<a onClick="return mV(\'2Sa\',2,9);">2Sa 2:9</a>). From Jezreel came the tidings of Saul and Jonathan\'s death on Gilboa, which brought disaster to Mephibosheth (<a onClick="return mV(\'2Sa\',4,4);">2Sa 4:4</a>). The city plays no important part in the history till the time of Ahab. Attracted, doubtless, by the fine position and natural charms of the place, he made it one of his royal residences, building here a palace (<a onClick="return mV(\'1Ki\',21,1);">1Ki 21:1</a>). This was evidently on the eastern wall; and the gate by which Jehu entered was over-looked by the quarters of Queen Jezebel (<a onClick="return mV(\'2Ki\',9,30);">2Ki 9:30</a>f). The royal favor naturally enhanced the dignity of the city, and "elders" and "nobles" of Jezreel are mentioned (<a onClick="return mV(\'1Ki\',21,8);">1Ki 21:8</a>, etc.). Under the influence of Jezebel, an institution for the worship of Baal was founded here, from which, probably, the men were drawn who figured in the memorable contest with Elijah on Carmel (<a onClick="return mV(\'2Ki\',10,11);">2Ki 10:11</a>). "The tower in Jezreel" was part of the defenses of the city. It commanded a view of the approach up the valley from Beth-shean—the way followed by the hordes of the East, who, from time immemorial, came westward for the rich pasture of the plain (<a onClick="return mV(\'2Ki\',9,17);">2Ki 9:17</a>). It was necessary also to keep constant watch, as the district east of the Jordan was always more unsettled than that on the west; and danger thence might appear at any moment. The garden of Naboth seems to have lain to the East of the city (<a onClick="return mV(\'2Ki\',9,21);">2Ki 9:21</a>), near the royal domain, to which Ahab desired to add it as a garden of herbs (<a onClick="return mV(\'1Ki\',21,1);">1Ki 21:1</a>). See <a href="./study/isbe/search.html?string=NABOTH">NABOTH</a>. This was the scene of the tragic meetings between Elijah and Ahab (<a onClick="return mV(\'1Ki\',21,17);">1Ki 21:17</a>), and between Jehu and Joram and Ahaziah (<a onClick="return mV(\'2Ki\',9,21);">2Ki 9:21</a>). Joram had returned to Jezreel from Ramoth-gilead to be healed of his wounds (<a onClick="return mV(\'2Ki\',9,15);">2Ki 9:15</a>). By the gateway the dogs devoured Jezebel\'s body (<a onClick="return mV(\'2Ki\',9,31);">2Ki 9:31</a>). Naboth had been stoned to death outside the city (<a onClick="return mV(\'1Ki\',21,13);">1Ki 21:13</a>). Josephus lays the scene by the fountain of Jezreel, and here, he says, the dogs licked the blood washed from the chariot of Ahab (Ant., VIII, xv, 6). This accords with <a onClick="return mV(\'1Ki\',21,19);">1Ki 21:19</a>; but <a onClick="return mV(\'1Ki\',22,38);">22:38</a> points to the pool at Samaria.<P>2. Identification:<P>The site of Jezreel must be sought in a position where a tower would command a view of the road coming up the valley from Beth-shean. It has long been the custom to identify it with the modern village, Zer\'in, on the northwestern spur of Gilboa. This meets the above condition; and it also agrees with the indications in Eusebius, Onomasticon as lying between Legio (Lejjun) and Scythopolis (Beisan). Recently, however, Professor A.R.S. Macalister made a series of excavations here, and failed to find any evidence of ancient Israelite occupation. This casts doubt upon the identification, and further excavation is necessary before any certain conclusion can be reached. For the "fountain which is in Jezreel," see <a href="./study/isbe/search.html?string=HAROD,+WELL+OF">HAROD, WELL OF</a>.<P>(2) An unidentified town in the uplands of Judah (<a onClick="return mV(\'Jos\',15,56);">Jos 15:56</a>), the home of Ahinoam (<a onClick="return mV(\'1Sa\',27,3);">1Sa 27:3</a>, etc.).``54';

isbe[5064]='Joab`jo\'-ab (yo\'-abh, "Yahweh is father"; Ioab):<P>(1) Son of Zeruiah, David\'s sister. He was "captain of the host" (compare <a onClick="return mV(\'2Sa\',19,13);">2Sa 19:13</a>) under David.<P>1. Joab and Abner:<P>(a) Joab is first introduced in the narrative of the war with Abner, who supported the claims of Ishbosheth to the throne against those of David (<a onClick="return mV(\'2Sa\',2,8);">2Sa 2:8-3:1</a>). The two armies met, and on Abner\'s suggestion a tournament took place between 12 men from each side; a general engagement follows, and in this Joab\'s army is victorious. Asahel, Joab\'s brother, is killed in his pursuit of Abner, but the latter\'s army is sorely pressed, and he appeals to Joab for a cessation of hostilities. Joab calls a halt, but declares that he would not cease had Abner not made his plea.<P>(b) <a onClick="return mV(\'2Sa\',3,\'12-29\');">2Sa 3:12-29</a>. Abner visits David at Hebron, and makes an alliance with David. He then leaves the town, apparently under royal protection. Joab is absent at the time, but returns immediately after Abner\'s departure, and expostulates with David for not avenging Asahel\'s death, and at the same time attributes a bad motive to Abner\'s visit. He sends a message, no doubt in the form of a royal command, for Abner to return; the chief does so, is taken aside "into the midst of the gate" (or as Septuagint and commentators read, "into the side of the gate," <a onClick="return mV(\'2Sa\',3,27);">2Sa 3:27</a>), and slain there by Joab. David proclaims his own innocence in the matter, commands Joab as well as the people to mourn publicly for the dead hero (<a onClick="return mV(\'2Sa\',3,31);">2Sa 3:31</a>), composes a lament for Abner, and pronounces a curse upon Joab and his descendants (<a onClick="return mV(\'2Sa\',3,30);">2Sa 3:30</a> is regarded as an editorial note, and commentators change <a onClick="return mV(\'2Sa\',3,39);">2Sa 3:39</a>).<P>2. The Ammonite War: Death of Uriah:<P>(a) <a onClick="return mV(\'2Sa\',10,\'1-14\');">2Sa 10:1-14</a>; <a onClick="return mV(\'1Ch\',19,\'1-15\');">1Ch 19:1-15</a>. David sends ambassadors with his good wishes to Hanun on his ascending the throne of the Ammonites; these are ill-treated, and war follows, David\'s troops being commanded by Joab. On finding himself placed between the Ammonites on the one hand, and their Syrian allies on the other, he divides his army, and himself leads one division against the Syrians, leaving Abishai, his brother, to fight the Ammonites; the defeat of the Syrians is followed by the rout of the ammonites.<P>(b) <a onClick="return mV(\'2Sa\',10,\'15-19\');">2Sa 10:15-19</a>; <a onClick="return mV(\'1Ch\',19,\'16-19\');">1Ch 19:16-19</a> describes a second war between Hadarezer and David. Joab is not mentioned here.<P>(c) <a onClick="return mV(\'2Sa\',11,1);">2Sa 11:1</a> narrates the resumption of the war against the Ammonites; Joab is in command, and the town of Rabbah is besieged. Here occurs the account of David\'s sin with Bathsheba, omitted by Chronicles. David gets Joab to send Uriah, her husband, to Jerusalem, and when he refuses to break the soldier\'s vow (<a onClick="return mV(\'2Sa\',11,\'6-13\');">11:6-13</a>), Joab is used to procure Uriah\'s death in the siege, and the general then sends news of it to David (<a onClick="return mV(\'2Sa\',11,\'14-27\');">11:14-27</a>). After capturing the \'water-city\' of Rabbah, Joab sends for David to complete the capture and lead the triumph himself (<a onClick="return mV(\'2Sa\',12,\'26-29\');">12:26-29</a>).<P>3. Joab and Absalom:<P>(a) The next scene depicts Joab attempting and succeeding in his attempt to get Absalom restored to royal favor. He has noticed that "the king\'s heart is toward Absalom" (<a onClick="return mV(\'2Sa\',14,1);">2Sa 14:1</a>), and so arranges for "a wise woman" of Tekoa to bring a supposed complaint of her own before the king, and then rebuke him for his treatment of Absalom. The plan succeeds. David sees Joab\'s hand in it, and gives him permission to bring Absalom to Jerusalem. But the rebel has to remain in his own house, and is not allowed to see his father (<a onClick="return mV(\'2Sa\',14,\'1-24\');">2Sa 14:1-24</a>).<P>(b) Absalom attempts to secure Joab\'s intercession for a complete restoration to his father\'s confidence. Joab turns a deaf ear to the request until his field is put on fire by Absalom\'s command. He then sees Absalom, and gets David to receive his prodigal son back into the royal home (<a onClick="return mV(\'2Sa\',14,\'28-33\');">2Sa 14:28-33</a>).<P>(c) Absalom revolts, and makes Amasa, another nephew of David, general instead of Joab (<a onClick="return mV(\'2Sa\',17,24);">2Sa 17:24</a>f). David flees to Mahanaim, followed by Absalom. Joab is given a third of the army, the other divisions being led by Abishai and Ittai. He is informed that Absalom has been caught in a tree (or thicket), and expostulates with the informer for not having killed him. Although he is reminded of David\'s tender plea that Absalom be kindly dealt with, he dispatches the rebel himself, and afterward calls for a general halt of the army. When David gives vent to his feelings of grief, he is sternly rebuked by Joab, and the rebuke has its effect (<a onClick="return mV(\'2Sa\',17,1);">2Sa 17-19:8</a>).<P>4. Joab and Amasa:<P><a onClick="return mV(\'2Sa\',19,\'8-15\');">2Sa 19:8b-15</a>. On David\'s return to Jerusalem, Amasa is made "captain of the host" instead of Joab (<a onClick="return mV(\'2Sa\',19,13);">19:13</a>). Then Sheba revolts, Amasa loses time in making preparation for quelling it, and Abishai is bidden by David to take the field (<a onClick="return mV(\'2Sa\',20,6);">20:6</a>). The Syriac version reads "Joab" for "Abishai" in this verse, and some commentators follow it, but Septuagint supports Massoretic Text. Joab seems to have accompanied Abishai; and when Amasa meets them at Gibeon, Joab, on pretense of kissing his rival, kills him. He then assumes command, is followed by Amasa\'s men, and arranges with a woman of Abel beth-maacah to deliver to him Sheba\'s head. The revolt is then at an end.<P>5. Joab\'s Death:<P>Joab subsequently opposed David\'s suggestion of a census, but eventually carried it out (<a onClick="return mV(\'2Sa\',24,\'1-9\');">2Sa 24:1-9</a>; <a onClick="return mV(\'1Ch\',21,\'1-6\');">1Ch 21:1-6</a>), yet <a onClick="return mV(\'1Ch\',21,6);">1Ch 21:6</a> and <a onClick="return mV(\'1Ch\',27,24);">27:24</a> relate that he did not carry it out fully. He was one of Adonijah\'s supporters in his claim to the throne (<a onClick="return mV(\'1Ki\',1,7,19,41);">1Ki 1:7,19,41</a>). For this he had to pay the penalty with his life, being slain at the altar in the "Tent of Yahweh" (<a onClick="return mV(\'1Ki\',2,\'28-34\');">1Ki 2:28-34</a>) by Benaiah, who acted upon Solomon\'s orders. His murderer became his successor as head of the army. <a onClick="return mV(\'1Ki\',2,5);">1Ki 2:5</a> makes David advise Solomon not to forget that Joab slew Abner and Amasa, and <a onClick="return mV(\'1Ki\',11,\'14-22\');">1Ki 11:14-22</a> contains a reference to the dread of his name in Edom. <a onClick="return mV(\'1Ch\',11,6);">1Ch 11:6</a> makes him win his spurs first at the capture of Jerusalem, but <a onClick="return mV(\'2Sa\',2,\'1-\');">2Sa 2</a>; <a onClick="return mV(\'2Sa\',3,\'1-\');">3</a> are previous in time to this event (compare <a onClick="return mV(\'2Sa\',5,\'6-10\');">2Sa 5:6-10</a>), and <a onClick="return mV(\'1Ch\',11,8);">1Ch 11:8</a> makes him repair the city, while <a onClick="return mV(\'1Ch\',26,28);">1Ch 26:28</a> refers to a dedication of armor by him.<P>6. Joab\'s Character:<P>In summing up Joab\'s character, we must remember the stirring times in which he lived. That he was a most able general, there is no doubt. He was, however, very jealous of his position, and this accounts for Amasa\'s murder, if not partially for that of Abner too: if he was afraid that Abner would supplant him, that fear may be held to be justified, for Amasa, who had not been too loyal to David did take Joab\'s place for a time. But blood revenge for Asahel\'s death was perhaps the chief cause. Yet even when judged in the light of those rough times, and in the light of eastern life, the murder of Abner was a foul, treacherous deed (see Trumbull, Studies in Oriental Social Life, 129-31).<P>Joab opposed the census probably because it was an innovation. His rebuke of David\'s great grief over Absalom\'s death can only be characterized as just; he is the stern warrior who, after being once merciful and forgiving, will not again spare a deceitful rebel; and yet David shows how a father\'s conduct toward a prodigal, rebellious son is not regulated by stern justice. Joab\'s unswerving loyalty to David leads one to believe that no disloyalty was meant by his support of Adonijah, who was really the rightful heir to the throne. But their plans were defeated by those of the harem, and Joab had to pay the price with his life.<P>Taken as a whole, his life, as depicted in the very reliable narrative of 2 Samuel and 1 Kings, may be said to be as characteristic of the times as that of David himself, with a truly Homeric ring about it. He was a great man, great in military prowess and also in personal revenge, in his loyalty to the king as well as in his stern rebuke of his royal master. He was the greatest of David\'s generals, and the latter\'s success and glory owed much to this noblest of that noble trio whom Zeruiah bore.<P>(2) A Judahite, father or founder of Ge-harashim (<a onClick="return mV(\'1Ch\',4,14);">1Ch 4:14</a>, "valley of craftsmen" the Revised Version margin).<P>See <a href="./study/isbe/search.html?string=GE-HARASHIM">GE-HARASHIM</a>.<P>(3) A family of returned exiles (<a onClick="return mV(\'Ezr\',2,6);">Ezr 2:6</a> parallel <a onClick="return mV(\'Neh\',7,11);">Ne 7:11</a>; <a onClick="return mV(\'Ezr\',8,9);">Ezr 8:9</a>; 1Es 8:35).<P>(4) See <a href="./study/isbe/search.html?string=ATROTH-BETH-JOAB">ATROTH-BETH-JOAB</a>.``149';
isbe[5065]='Joachaz`jo\'-a-kaz (Iochaz, Iechonias): Son of Josiah (1Esdras 1:34). In <a onClick="return mV(\'Mat\',1,11);">Mt 1:11</a> "Jechoniah" is the reading.``1';
isbe[5066]='Joacim`jo\'-a-sim.`<a href="./study/isbe/search.html?string=JOAKIM">JOAKIM</a>`1';
isbe[5067]='Joadanus`jo-a-da\'-nus (Ioadanos: In 1Esdras 9:19, apparently, through some corruption; the same as Gedaliah, a son of Jeshua, the son of Jozadak, in <a onClick="return mV(\'Ezr\',10,18);">Ezr 10:18</a>.``1';
isbe[5068]='Joah`jo\'-a (yo\'ach, "Yahweh is brother"):<P>(1) Son of Asaph and recorder under King Hezekiah (<a onClick="return mV(\'2Ki\',18,18,26);">2Ki 18:18,26</a>; <a onClick="return mV(\'Isa\',36,3,11,22);">Isa 36:3,11,22</a>); he was one of the 3 officers sent by the king to speak to the Assyrian envoys at the siege of Jerusalem (circa 701 BC).<P>(2) In <a onClick="return mV(\'1Ch\',6,21);">1Ch 6:21 (Hebrew 6)</a>; <a onClick="return mV(\'2Ch\',29,12);">2Ch 29:12</a>, a Levite (son of Zimmah) = "Ethan" of <a onClick="return mV(\'1Ch\',6,42);">1Ch 6:42 (Hebrew 27)</a>.<P>(3) a son of Obed-edom (<a onClick="return mV(\'1Ch\',26,4);">1Ch 26:4</a>).<P>(4) Son of Joahaz and recorder under King Josiah (<a onClick="return mV(\'2Ch\',34,8);">2Ch 34:8</a>).``1';
isbe[5069]='Joahaz`jo\'-a-haz (yo\'-achaz, "Yahweh has grasped" = "Jehoahaz"):<P>(1) Father of <a href="./study/isbe/search.html?string=JOAH">JOAH (4)</a> (<a onClick="return mV(\'2Ch\',34,8);">2Ch 34:8</a>).<P>(2) the Revised Version (British and American) and Hebrew in <a onClick="return mV(\'2Ki\',14,1);">2Ki 14:1</a> for Jehoahaz, king of Israel.<P>See <a href="./study/isbe/search.html?string=JEHOAHAZ">JEHOAHAZ</a>.<P>(3) the Revised Version (British and American) and Hebrew in <a onClick="return mV(\'2Ch\',36,2,4);">2Ch 36:2,4</a> for <a href="./study/isbe/search.html?string=JEHOAHAZ">JEHOAHAZ</a>, king of Judah (which see).``1';
isbe[5070]='Joakim`jo\'-a-kim (Ioakeim; the King James Version Joacim):<P>(1) Jehoiakim, king of Judah and Jerusalem (1Esdras 1:37-39; Baruch 1:3).<P>(2) Jehoiachin, son of (1) (1Esdras 1:43).<P>(3) Son of Jeshua (1Esdras 5:5), called by mistake son of Zerubbabel; in <a onClick="return mV(\'Neh\',12,10,26);">Ne 12:10,26</a> his name occurs as in 1Esdras, among the priests and Levites who returned to Jerusalem with Zerubbabel.<P>(4) High priest of Jerusalem in the time of Baruch (Baruch 1:7).<P>(5) High priest in Jerusalem in the days of Judith who, along with "the ancients of the children of Israel," welcomed the heroine back to the city after the death of Holofernes (Judith 4). He cannot be identified with any of the high priests in the lists given in 1 Chronicles or in Josephus, Ant, X, viii, 6. The word means "the Lord hath set up." It is probably symbolical, and tends with other names occurring in the narrative to establish the supposition that the book was a work of imagination composed to support the faith of the Jews in times of stress and difficulty.<P>(6) The husband of Susanna (Susanna verses 1ff), perhaps here also a symbolical name.``79';
isbe[5071]='Joanan`jo-a\'-nan (Westcott-Hort, Greek New Testament, Ioanan; Textus Receptus of the New Testament, Ioanna; the King James Version, Joanna):<P>(1) A grandson of Zerubbabel in the genealogy of Jesus according to Luke (<a onClick="return mV(\'Luk\',3,27);">3:27</a>).<P>(2) The son of Eliasib (1Esdras 9:1 the King James Version, the Revised Version (British and American) "Jonas").``1';
isbe[5072]='Joanna`jo-an\'-a (Ioana, or Ioanna): The wife of Chuzas, Herod\'s steward. She was one of the "women who had been healed of evil spirits and infirmities" which "ministered unto him (King James Version, i.e. Jesus, or "them" the Revised Version (British and American), i.e. Jesus and His disciples) of their substance," on the occasion of Jesus\' tour through Galilee (<a onClick="return mV(\'Luk\',8,2,3);">Lu 8:2,3</a>). Along with other women she accompanied Jesus on His last journey from Galilee to Jerusalem, and was present when His body was laid in the sepulcher (<a onClick="return mV(\'Luk\',23,55);">Lu 23:55</a>). She was thus among those who prepared spices and ointments, who found the grave empty, and who "told these things unto the apostles" (<a onClick="return mV(\'Luk\',23,\'56-\');">Lu 23:56</a>-<a onClick="return mV(\'Luk\',24,\'1-10\');">24:10</a>).``88';
isbe[5073]='Joannes`jo-an\'-es, jo-an\'-ez (Ioannes; the King James Version, Johannes):<P>(1) Son of Acatan (1Esdras 8:38), called also "Johanan" in <a onClick="return mV(\'Ezr\',8,12);">Ezr 8:12</a>.<P>(2) Son of Bebai (1Esdras 9:29), called "Jehohanan" in <a onClick="return mV(\'Ezr\',10,28);">Ezr 10:28</a>.``1';
isbe[5074]='Joarib`jo\'-a-rib (Ioarib; the King James Version Jarib): Ancestor of Mattathias (1Macc 14:29), given as "Joarib" in the King James Version of 1Macc 2:1; he was chief of the first of the 24 courses of priests in the reign of David. Varieties of the name are Jarib, Joarib, and Jehoiarib (<a onClick="return mV(\'1Ch\',24,7);">1Ch 24:7</a>).``1';
isbe[5075]='Joash (1)`jo\'-ash (yo\'ash, "Yahweh is strong" or "Yahweh has bestowed"; Ioas):<P>(1) Father of Gideon, of the clan of Abiezer and the tribe Manasseh (<a onClick="return mV(\'Jdg\',6,11,29,30,31);">Jud 6:11,29,30,31</a>; <a onClick="return mV(\'Jdg\',7,14);">7:14</a>; <a onClick="return mV(\'Jdg\',8,13,19,62);">8:13,19,32</a>). Gideon declares (<a onClick="return mV(\'Jdg\',6,15);">Jud 6:15</a>) that the family is the poorest in Manasseh, words similar to those of Saul (<a onClick="return mV(\'1Sa\',9,21);">1Sa 9:21</a>), and not to be taken too literally. Joash would be a man of standing and wealth, for Gideon was able to command 10 servants to destroy the altar and the Asherah (<a onClick="return mV(\'Jdg\',6,27,34);">Jud 6:27,34</a>), and also to summon the whole clan to follow him. Further, the altar that Joash had was that used by the community (<a onClick="return mV(\'Jdg\',6,28);">Jud 6:28</a>), so that he would be the priest, not only of his own family qua paterfamilias, but also of the community in virtue of his position as chief. When Gideon destroyed the altar and the Asherah or sacred pillar by it, Joash refused to deliver his son to death, declaring that Baal, if he was a god, should avenge himself (compare Elijah in <a onClick="return mV(\'1Ki\',18,\'1-\');">1Ki 18</a>).<P>(2) Called "the king\'s son" (<a onClick="return mV(\'1Ki\',22,26);">1Ki 22:26</a>; <a onClick="return mV(\'2Ch\',18,25);">2Ch 18:25</a>; compare <a onClick="return mV(\'Jer\',36,26);">Jer 36:26</a>; <a onClick="return mV(\'Jer\',38,6);">38:6</a>), or, less probably, "the son of Hammelech," the Revised Version margin; perhaps a son of Ahab. Micaiah the prophet was handed over to his custody and that of Amon by Ahab.<P>(3) A Judahite, descendant of Shelah (<a onClick="return mV(\'1Ch\',4,22);">1Ch 4:22</a>).<P>(4) A Benjamite recruit of David at Ziklag. Commentators read here, "Joash the son of Shemaiah (or Jehoshamai), the Gibeathite" (<a onClick="return mV(\'1Ch\',12,3);">1Ch 12:3</a>).<P>(5) In <a onClick="return mV(\'2Ki\',11,2);">2Ki 11:2</a>, etc. = Jehoash, king of Judah.<P>(6) In <a onClick="return mV(\'2Ki\',13,9);">2Ki 13:9</a>, etc. = Jehoash, king of Northern Israel.``149';
isbe[5076]='Joash (2)`(yo\'ash, "Yahweh has aided"):<P>(1) A Benjamite, or, more probably, a Zebulunite (<a onClick="return mV(\'1Ch\',7,8);">1Ch 7:8</a>).<P>(2) One of David\'s officers; Joash was "over the cellars of oil" (<a onClick="return mV(\'1Ch\',27,28);">1Ch 27:28</a>).``1';
isbe[5077]='Joatham`jo\'-a-tham (Ioatham): the King James Version for the Revised Version (British and American) "Jotham" (<a onClick="return mV(\'Mat\',1,9);">Mt 1:9</a>).`<a href="./study/isbe/search.html?string=JOTHAM">JOTHAM</a>`1';
isbe[5078]='Job`job (\'iyobh, meaning of name doubtful; some conjecturing "object of enmity," others "he who turns," etc., to God; both uncertain guesses; Iob): The titular hero of the Book of Job, represented as a wealthy and pious land-holder who lived in patriarchal times, or at least conditions, in the land of Uz, on the borders of Idumea. Outside of the Book of Job he is mentioned by Ezekiel (<a onClick="return mV(\'Eze\',14,14,20);">Eze 14:14,20</a>) as one of 3 great personages whose representative righteousness would presumably avail, if that of any individuals could, to redeem the nation; the other two being Noah, an ancient patriarch, and Daniel, a contemporary of the prophet. It is difficult to determine whether Job was an actual personage or not. If known through legend, it must have been on account of some such experience as is narrated in the book, an experience unique enough to have become a potent household word; still, the power and influence of it is due to the masterly vigor and exposition of the story. It was the Job of literature, rather than the Job of legend, who lived in the hearts of men; a character so commanding that, albeit fictitious, it could be referred to as real, just as we refer to Hamlet or Othello. It is not the way of Hebrew writers, however, to evolve literary heroes from pure imagination; they crave an authentic basis of fact. It is probable that such a basis, in its essential outlines, existed under the story of Job. It is not necessary to suppose, however, that the legend or the name was known to Israel from ancient times. Job is introduced (<a onClick="return mV(\'Job\',1,1);">Job 1:1</a>) as if he had not been known before. The writer, who throughout the book shows a wide acquaintance with the world, doubtless found the legend somewhere, and drew its meanings together for an undying message to his and all times.``66';
isbe[5079]='Job, Book of`<b>I. INTRODUCTORY</b><P class="in30">1. Place in the Canon<P class="in30">2. Rank and Readers<P><b>II. THE LITERARY FRAMEWORK</b><P class="in30">1. Setting of Time, Place and Scene<P class="in30">2. Characters and Personality<P class="in30">3. Form and Style<P><b>III. THE COURSE OF THE STORY</b><P class="in15">A) To Job\'s Blessing and Curse<P class="in30">1. His "Autumn Days"<P class="in30">2. The Wager in Heaven<P class="in30">3. The Silent Friends<P class="in30">4. Whose Way Is Hid<P class="in15">B) To Job\'s Ultimatum of Protest<P class="in30">1. The Veiled Impeachment<P class="in30">2. Wisdom Insipid, Friends Doubtful<P class="in30">3. Crookedness of the Order of Things<P class="in30">4. No Mediation in Sight<P class="in15">C) To Job\'s Ultimatum of Faith<P class="in30">1. Detecting the Friends\' False Note<P class="in30">2. Staking Everything on Integrity<P class="in30">3. "If a Man Die"<P class="in30">4. The Surviving Next of Kin<P class="in15">D) To Job\'s Verdict on Things as They Are<P class="in30">1. Climax and Subsidence of the Friends\' Charge<P class="in30">2. The Real Cause of Job\'s Dismay<P class="in30">3. Manhood in the Ore<P class="in30">4. Job Reads His Indictment<P class="in15">E) The Denouement<P class="in30">1. The Self-constituted Interpreter<P class="in30">2. The Whirlwind and the Voice<P class="in30">3. The Thing That Is Right<P class="in30">4. The Restored Situation<P><b>IV. THE PROBLEM AND THE PURPOSE</b><P class="in30">1. Beyond the Didactic Tether<P class="in30">2. What Comes of Limiting the Purpose<P class="in30">3. The Book\'s Own Import of Purpose<P class="in30">4. Problem of the Intrinsic Man<P><b>V. CONSIDERATIONS OF AGE AND SETTING</b><P class="in30">1. Shadowy Contacts with History<P class="in30">2. Place in Biblical Literature<P class="in30">3. Parallels and Echoes<P>LITERATURE<hr /><P>I. Introductory.<P>1. Place in the Canon:<P>The greatest production of the Hebrew Wisdom literature, and one of the supreme literary creations of the world. Its place in the Hebrew Canon corresponds to the high estimation in which it was held; it stands in the 3rd section, the "writings" (kethubhim) or Hagiographa, next after the two great anthologies Psalms and Proverbs; apparently put thus near the head of the list for weighty reading and meditation. In the Greek Canon (which ours follows), it is put with the poetical books, standing at their head. It is one of 3 Scripture books, the others being Psalms and Proverbs, for which the later Hebrew scholars (the Massoretes) employed a special system of punctuation to mark its poetic character.<P>2. Rank and Readers:<P>The Book of Job was not one of the books designated for public reading in the synagogues, as were the Pentateuch and the Prophets, or for occasional reading at feast seasons, as were the 5 megilloth or rolls. It was rather a book for private reading, and one whose subject-matter would appeal especially to the more cultivated and thoughtful classes. Doubtless it was all the more intimately valued for this detachment from sanctuary associations; it was, like Proverbs, a people\'s book; and especially among the cultivators of Wisdom it must have been from its first publication a cherished classic. At any rate, the patriarch Job (though whether from the legend or from the finished book is not clear; see <a href="./study/isbe/search.html?string=JOB">JOB</a>) is mentioned as a well-known national type by <a onClick="return mV(\'Eze\',14,14,20);">Eze 14:14,20</a>; and James, writing to Jewish Christians (<a onClick="return mV(\'Jam\',5,11);">5:11</a>), refers to the character of patriarch as familiar to his readers. It was as one of the great classic stories of their literature, rather than as embodying a ritual or prophetic standard, that it was so universally known and cherished.<P>II. The Literary Framework.<P>In view of the numerous critical questions by which the interpretation of the book has been beclouded—questions of later alterations, additions, corruptions, dislocations—it may be well to say at the outset that what is here proposed is to consider the Book of Job as we have it before us today, in its latest and presumably definitive edition. It will be time enough to remove excrescences when a fair view of the book as it is, with its literary values and relations, makes us sure that there are such; see III, below. Meanwhile, as a book that has reached a stage so fixed and finished that at any rate modern tinkering cannot materially change it, we may consider what its literary framework does to justify itself. And first of all, we may note that preeminently among Scripture books it bears the matured literary stamp; both in style and structure it is a work, not only of spiritual edification, but of finished literary art. This may best be realized, perhaps, by taking it, as from the beginning it purports to be, as a continuously maintained story, with the consistent elements of plot, character scheme, and narrative movement which we naturally associate with a work of the narrator\'s article<P>1. Setting of Time, Place and Scene:<P>The story of the Book of Job is laid in the far-off patriarchal age, such a time as we find elsewhere represented only in the Book of Genesis; a time long before the Israelite state, with its religious, social and political organization, existed. Its place is "the land of Uz," a little-known region southeast of Palestine, on the borders of Edom; a place remote from the ways of thinking peculiar to Israelite lawgivers, priests and prophets. Its scene is in the free open country, among mountains, wadies, pasture-lands, and rural towns, where the relations of man and man are more elemental and primitive, and where the things of God are more intimately apprehended than in the complex affairs of city and state. It is easy to see what the writer gains by such a choice of setting. The patriarchal conditions, wherein the family is the social and communal unit, enable him to portray worship and conduct in their primal elements: religious rites of the simplest nature, with the family head the unchallenged priest and intercessor (compare <a onClick="return mV(\'Job\',1,4,5);">Job 1:4,5</a>; <a onClick="return mV(\'Job\',42,8);">42:8</a>), and without the austere exactions of sanctuary or temple; to represent God, as in the old folk-stories, as communicating with men in audible voice and in tempest; and to give to the patriarch or sheikh a function of counsel and succor in the community analogous to that of the later wise man or sage (compare <a onClick="return mV(\'Job\',29,\'1-\');">Job 29</a>). The place outside the bounds of Palestine enables him to give an international or rather intercommunal tissue to his thought, as befits the character of the wisdom with which he is dealing, a strain of truth which Israel could and did share with neighbor nations. This is made further evident by the fact that in the discourses of the book, the designation of God is not Yahweh (with one exception, <a onClick="return mV(\'Job\',12,9);">Job 12:9</a>), but \'Elohim or \'Eloah or Shaddai, appellatives rather than names, common to the Semitic peoples. The whole archaic scene serves to detach the story from complex conditions of civilization, and enables the writer to deal with the inherent and intrinsic elements of manhood.<P>2. Characters and Personality:<P>All the characters of the story, Job included, are from non-Palestinian regions. The chief spokes-man of the friends, Eliphaz, who is from Teman, is perhaps intended to represent a type of the standard and orthodox wisdom of the day; Teman, and Edom in general being famed for wisdom (<a onClick="return mV(\'Jer\',49,7);">Jer 49:7</a>; <a onClick="return mV(\'Oba\',1,8,9);">Obadiah 1:8,9</a>). The characters of the friends, while representing in general a remarkable uniformity of tenet, are quite aptly individualized: Eliphaz as a venerable and devout sage who, with his eminent penetrativeness of insight, combines a yearning compassion; Bildad more as a scholar versed in the derived lore of tradition; and Zophar more impetuous and dogmatic, with the dogmatist\'s vein of intolerance. In Elihu, the young Aramean who speaks after the others, the writer seems endeavoring to portray a young man\'s positiveness and absoluteness of conviction, and with it a self-conceit that quite outruns his ability. The Satan of the Prologue, who makes the wager with Yahweh, is masterfully individualized, not as the malignant tempter and enemy of mankind, but as a spirit compact of impudent skepticism, who can appreciate no motive beyond self-advantage. Even the wife of Job, with her peremptory disposition to make his affliction a personal issue with God, is not without an authentic touch of the elemental feminine. But high above them all is the character of Job himself, which, with all its stormy alternations of mood, range of assertion and remonstrance and growth of new conviction, remains absolutely consistent with itself. Nor can we leave unmentioned what is perhaps the hardest achievement of all, the sublime venture of giving the very words of God, in such a way that He speaks no word out of character nor measures His thought according to the standards of men.<P>3. Form and Style:<P>The Prologue, <a onClick="return mV(\'Job\',1,\'1-\');">Job 1</a> and <a onClick="return mV(\'Job\',2,\'1-\');">2</a>, a few verses at the beginning of chapter <a onClick="return mV(\'Job\',32,\'1-6\');">32 (verses 1-6a)</a>, and the Epilogue (<a onClick="return mV(\'Job\',42,\'7-17\');">42:7-17</a>) are written in narrative prose. The rest of the book (except the short sentences introducing the speakers) is in poetry; a poetic tissue conforming to the type of the later mashal (see under <a href="./study/isbe/search.html?string=PROVERB">PROVERB</a>), which, in continuous series of couplets, is admirably adapted alike to imaginative sublimity and impassioned address. Beginning with Job\'s curse of his day (<a onClick="return mV(\'Job\',3,\'1-\');">Job 3</a>), Job and his three friends answer each other back and forth in three rounds of speeches, complete except that, for reasons which the subject makes apparent, Zophar, the third friend, fails to speak the third time. After the friends are thus put to silence, Job speaks three times in succession (<a onClick="return mV(\'Job\',26,\'1-\');">Job 26:1-31:40</a>), and then "the words of Job are ended." At this point (<a onClick="return mV(\'Job\',32,\'1-\');">Job 32</a>) a fourth speaker, Elihu, hitherto unmentioned, is introduced and speaks four times, when he abruptly ceases in terror at an approaching whirlwind (<a onClick="return mV(\'Job\',37,24);">37:24</a>). Yahweh speaks from the whirlwind, two speeches, each of which Job answers briefly (<a onClick="return mV(\'Job\',40,\'3-5\');">40:3-5</a>; <a onClick="return mV(\'Job\',42,\'1-6\');">42:1-6</a>), or rather declines to answer. Such, which we may summarize in Prologue (<a onClick="return mV(\'Job\',1,\'1-\');">Job 1</a>; <a onClick="return mV(\'Job\',2,\'1-\');">2</a>), Body of Discussion (<a onClick="return mV(\'Job\',3,\'1-\');">3-42:6</a>), and Epilogue (<a onClick="return mV(\'Job\',42,\'7-17\');">42:7-17</a>), is the literary framework of the book. The substance of the book is in a way dramatic; it cannot, however, be called so truly a drama as a kind of forum of debate; its movement is too rigid for dramatic action, and it lacks besides the give-and-take of dialogue. In a book of mine published some years ago I ventured to call it "the Epic of the Inner Life," epic not so much in the technical sense, as in recognition of an underlying epos which for fundamental significance may be compared to the story underlying the Prometheus Bound of Aeschylus. It will not do, however, to make too much of either of these forms as designating the Book of Job; either term has to be accommodated almost out of recognition, because the Hebrew literary forms were not conceived according to the Greek categories from which our terms "epic" and "dramatic" are derived. A greater limitation on our appreciation of its form, I think, is imposed by those who regard it as a mixture of forms. It is too generally divided between narrative and didactic debate. To the Hebrew mind it was all a continuous narrative, in which the poetic discussion, though overweighting the current of visualized action, had nevertheless the movement and value of real events. It is in this light, rather than in the didactic, that we may most profitably regard it.<P>III. The Course of the Story.<P>To divide the story of Job into 42 parts, according to the 42 numbered chapters, is in the last degree arbitrary. Nothing comes of it except convenience in reading for those who wish to take their Job in little detached bits. The chapter division was no part of the original, and a very insignificant step in the later apprehension of the original. To divide according to the speeches of the interlocutors is better; it helps us realize how the conflict of views brought the various phases of the thought to expression; but this too, with its tempting, three-times-three, turns out to be merely a framework; it corresponds only imperfectly with the true inwardness of the story\'s movement; it is rather a scheme than a continuity. We are to bear in mind that this Book of Job is fundamentally the inner experience of one man, as he rises from the depths of spiritual gloom and doubt to a majestic table-land of new insight and faith; the other characters are but ancillary, helps and foils, whose function is subordinate and relative. Hence, mindful of this inwardness of Job\'s experience, I have ventured to trace the story in 5 main stages, naming them according to the landing-stage attained in each.<P>A) To Job\'s Blessing and Curse:<P>1. His "Autumn Days":<P>The story begins (<a onClick="return mV(\'Job\',1,\'1-5\');">Job 1:1-5</a>) with a brief description of Job as he was before his trial began; the elements of his life, outer and inner, on which is to be raised the question of motive. A prosperous landholder of the land of Uz, distinguished far and wide as the greatest (i.e. richest) of the sons of the East, his inner character corresponds: to all appearance nothing lacking, a man "perfect and upright, and one that feared God, and turned away from evil." The typical Hebrew blessings of life were his to the full: wealth, honor, health, family. He is evidently set before us as the perfect example of the validity of the established Wisdom-tenet, that righteousness and Wisdom are identical (see under <a href="./study/isbe/search.html?string=PROVERBS,+THE+BOOK+OF">PROVERBS, THE BOOK OF</a>), and that this is manifest in its visible rewards. This period of his life Job describes afterward by retrospect as his "autumn days," when the friendship or intimacy (coah) of God was over his tent (see <a onClick="return mV(\'Job\',29,4);">29:4</a>, and the whole <a onClick="return mV(\'Job\',29,\'1-\');">chapter</a>). Nor are we left without a glimpse into his heart: his constant attitude of worship, and his tender solicitude lest, in their enjoyment of the pleasures of life, his sons may have been disloyal to God (<a onClick="return mV(\'Job\',1,4,5);">Job 1:4,5</a>). It is easy to see that not Job alone, but Wisdom as embodied in Job, is postulated here for its supreme test.<P>2. The Wager in Heaven:<P>Nor is the test delayed, or its ground ambiguous when it comes. Satan proposes it. Two scenes are given (<a onClick="return mV(\'Job\',1,\'6-12\');">Job 1:6-12</a>; <a onClick="return mV(\'Job\',2,\'1-6\');">2:1-6</a>) from the court of God, wherever that is; for they are overheard by the reader, not seen, and of course neither Job nor any inhabitant of earth is aware of them. In these scenes the sons of God, the spirits who rejoiced over creation (<a onClick="return mV(\'Job\',38,7);">38:7</a>), are come together to render report, and Satan, uninvited, enters among them. He is a wandering spirit, unanchored to any allegiance, who roams through the earth, prying and criticizing. There is nothing, it would seem, in which he cannot find some flaw or discount. To Yahweh\'s question if he has considered Job, the man perfect and upright, he makes no denial of the fact, but raises the issue of motive: "Doth Job fear God for nought?" and urges that Job\'s integrity is after all only a transparent bargain, a paying investment with only reward in view. It is virtually an arraignment both of God\'s order and of the essential human character: of God\'s order in connecting righteousness so intimately with gain; and of the essential human character, virtually denying that there is such a thing as disinterested, intrinsic human virtue. The sneer strikes deep, and Job, the perfect embodiment of human virtue, is its designated victim. Satan proposes a wager, to the issue of which Yahweh commits Himself. The trial of Job is carried out in two stages: first against his property and family, with the stipulation that it is not to touch him; and then, this failing to detach him from his allegiance, against his person in sore disease, with the stipulation that his life is to be spared. Yahweh acknowledges that for once He is consenting to an injustice (<a onClick="return mV(\'Job\',2,3);">2:3</a>), and Satan, liar that he is, uses instrumentalities that men have ascribed to God alone: the first time, tempest and lightning (as well as murderous foray), the second time, the black leprosy, a fell disease, loathsome and deadly, which, in men\'s minds meant the immediate punitive stroke of God. The evil is as absolute as was the reward; a complete reversal of the order in which men\'s wisdom had come to trust. But in the immediate result, Yahweh\'s faith in His noblest creature is vindicated. Urged by his wife in his extremity to "curse God and die," Job remains true to his allegiance; and in his staunch utterance, "Yahweh gave, and Yahweh hath taken away; blessed be the name of Yahweh," Job, as the writer puts it, \'sinned not, nor attributed aught unbeseeming (tiphalah, literally, "tasteless") to God.\' Such is the first onset of Job\'s affliction and its result. It remains to be seen what the long issue, days and months of wretchedness, will bring forth.<P>3. The Silent Friends:<P>We are now to imagine the lapse of some time, perhaps several months (compare <a onClick="return mV(\'Job\',7,3);">Job 7:3</a>), during which Job suffers alone, an outcast from house and society, on a leper\'s ash-heap. Meanwhile three friends of his who have heard of his affliction make an appointment together and come from distant regions to give him sympathy and comfort (<a onClick="return mV(\'Job\',2,\'11-13\');">2:11-13</a>). On arriving, however, they find things different from what they had expected; perhaps the ominous nature of his disease has developed since they started. What they find is a man wretched and outcast, with a disease (elephantiasis) which to them can mean nothing but the immediate vengeance of God. The awful sight gives them pause. Instead of condoling with him, they sit silent and dismayed, and for seven days and nights no word is spoken (compare <a onClick="return mV(\'Isa\',53,3);">Isa 53:3</a>). What they were debating with themselves during that time is betrayed by the after-course of the story. How can they bless one whom God has stamped with His curse? To do so would be taking sides with the wicked. Is it not rather their duty to side with God, and be safe, and let sympathy go? By this introduction of the friends and their averted attitude, the writer with consummate skill brings a new element into the story, the element of the Wisdom-philosophy; and time will show whether as a theoretical thing, cold and intellectual, it will retain or repress the natural outwelling of human friendship. And this silence is ominous.<P>4. Whose Way Is Hid:<P>The man who, in the first onset of trial, blessed Yahweh and set himself to bear in silence now opens his mouth to curse. His curse is directed, not against Yahweh nor against the order of things, but against the day of his birth. It is a day that has ceased to have meaning or worth for him. The day stands for life, for his individual life, a life that in the order of things should carry out the personal promise and fruitage for which it had been bestowed. And his quarrel with it is that he has lost its clue. Satan unknown to him has sneered because Yahweh had hedged him round with protection and favor (<a onClick="return mV(\'Job\',1,10);">Job 1:10</a>); but his complaint is that all this is removed without cause, and God has hedged him round with darkness. His way is hid (<a onClick="return mV(\'Job\',3,23);">Job 3:23</a>). Why then was life given at all? In all this, it will be noted, he raises no train of introspection to account for his condition; he assumes no sinfulness, nor even natural human depravity; the opposite rather, for a baffling element of his case is his shrinking sensitiveness against evil and disloyalty (compare <a onClick="return mV(\'Job\',3,25,26);">Job 3:25,26</a>, in which the tenses should be past, with <a onClick="return mV(\'Job\',1,5);">1:5</a>; see also <a onClick="return mV(\'Job\',6,30);">6:30</a>; <a onClick="return mV(\'Job\',16,17);">16:17</a>). His plight has become sharply, poignantly objective; his inner self has no part in it. Thus in this opening speech he strikes the keynote of the real, against which the friends\' theories rage and in the end wreck themselves.<P>B) To Job\'s Ultimatum of Protest:<P>1. The Veiled Impeachment:<P>With all the gentle regret of having to urge a disagreeable truth the friends, beginning with Eliphaz the wisest and most venerable, enter upon their theory of the case. Eliphaz covers virtually the whole ground; the others come in mainly to echo or emphasize. He veils his reproof in general and implicatory terms, the seasoned terms of wisdom in which Job himself is expert (<a onClick="return mV(\'Job\',4,3,4,5);">4:3-5</a>); reminds him that no righteous man perishes, but that men reap what they sow (<a onClick="return mV(\'Job\',4,7,8);">4:7,8</a>); adduces a vision that he had had which revealed to him that man, by the very fact of being mortal, is impure and iniquitous (<a onClick="return mV(\'Job\',4,17,18,19);">4:17-19</a>); implies that Job\'s turbulence of mind precludes him from similar revelations, and jeopardizes his soul (<a onClick="return mV(\'Job\',5,1,2);">5:1,2</a>); advises him to commit his case to God, with the implication, however, that it is a case needing correction rather than justification, and that the result in view is restored comfort and prosperity. As Job answers with a more passionate and detailed portrayal of his wrong, Bildad, following, abandons the indirect impeachment and attributes the children\'s death to their sin (<a onClick="return mV(\'Job\',8,4);">8:4</a>), saying also that if Job were pure and upright he might supplicate and regain God\'s favor (<a onClick="return mV(\'Job\',8,5,6);">8:5,6</a>). He then goes on to draw a lesson from the traditional Wisdom lore, to the effect that sure destruction awaits the wicked and sure felicity the righteous (<a onClick="return mV(\'Job\',8,\'11-22\');">Job 8:11-22</a>). On Job\'s following this with his most positive arraignment of God\'s order and claim for light, Zophar replies with impetuous heat, averring that Job\'s punishment is less than he deserves (<a onClick="return mV(\'Job\',11,6);">Job 11:6</a>), and reproving him for his presumption in trying to find the secret of God (<a onClick="return mV(\'Job\',11,\'7-12\');">Job 11:7-12</a>). All three of the friends, with increasing emphasis, end their admonitions in much the same way; promising Job reinstatement in God\'s favor, but always with the veiled implication that he must own to iniquity and entreat as a sinner.<P>2. Wisdom Insipid, Friends Doubtful:<P>To the general maxims of Wisdom urged against him, with which he is already familiar (compare <a onClick="return mV(\'Job\',13,2);">Job 13:2</a>), Job\'s objection is not that they are untrue, but that they are insipid (<a onClick="return mV(\'Job\',6,6,7);">Job 6:6,7</a>); they have lost their application to the case. Yet it is pain to him to think that the words of the Holy One should fail; he longs to die rather than deny them (<a onClick="return mV(\'Job\',6,9,10);">Job 6:9,10</a>). One poignant element of his sorrow is that the intuitive sense (tushiyah; see under <a href="./study/isbe/search.html?string=PROVERBS,+THE+BOOK+OF">PROVERBS, THE BOOK OF</A>) is driven away from him; see <a onClick="return mV(\'Job\',6,13);">Job 6:13</a>. He is irritated by the insinuating way in which the friends beg the question of his guilt; longs for forthright and sincere words (<a onClick="return mV(\'Job\',6,25);">6:25</a>). It is this quality of their speech, in fact, which adds the bitterest drop to his cup; his friends, on whom he had counted for support, are deceitful like a dried-up brook (<a onClick="return mV(\'Job\',6,\'15-20\');">6:15-20</a>); he feels, in his sick sensitiveness, that they are not sympathizing with him but using him for their cold, calculating purposes (<a onClick="return mV(\'Job\',6,27);">6:27</a>). Thus is introduced one of the most potent motives of the story, the motive of friendship; much will come of it when from the fallible friendships of earth he conquers his way by faith to a friendship in the unseen (compare <a onClick="return mV(\'Job\',16,19);">16:19</a>; <a onClick="return mV(\'Job\',19,27);">19:27</a>).<P>3. Crookedness of the Order of things:<P>With the sense that the old theories have become stale and pointless, though his discernment of the evil of things is undulled by sin (<a onClick="return mV(\'Job\',6,30);">Job 6:30</a>), Job arrives at an extremely poignant realization of the hardness and crookedness of the world-order, the result both of what the friends are saying and of what he has always held in common with them. It is the view that is forced upon him by the sense that he is unjustly dealt with by a God who renders no reasons, who on the score of justice vouchsafes to man neither insight nor recourse, and whose severity is out of all proportion to man\'s sense of worth (<a onClick="return mV(\'Job\',7,17);">7:17</a>) or right (<a onClick="return mV(\'Job\',9,17);">9:17</a>) or claim as a creature of His hand (<a onClick="return mV(\'Job\',10,\'8-14\');">10:8-14</a>). <a onClick="return mV(\'Job\',9,\'1-\');">Job 9</a>, which contains Job\'s direct address to this arbitrary Being, is one of the most tremendous, not to say audacious conceptions in literature; in which a mortal on the threshold of death takes upon himself to read God a lesson in godlikeness. In this part of the story Job reaches his ultimatum of protest; a protest amazingly sincere, but not blasphemous when we realize that it is made in the interest of the Godlike.<P>4. No Mediation in Sight:<P>The great lack which Job feels in his arraignment of God is the lack of mediation between Creator and creature, the Oppressor and His victim. There is no umpire between them, who might lay his hand upon both, so that the wronged one might have voice in the matter (<a onClick="return mV(\'Job\',9,\'32-35\');">9:32-35</a>). The two things that an umpire might do: to remove God\'s afflicting hand, and to prevent God\'s terror from unmanning His victim (see <a onClick="return mV(\'Job\',13,\'20-22\');">13:20-22</a>, as compared with the passage just cited), are the great need to restore normal and reciprocal relations with Him whose demand of righteousness is so inexorable. This umpire or advocate idea, thus propounded negatively, will grow to a sublime positive conviction in the next stage of Job\'s spiritual progress (<a onClick="return mV(\'Job\',16,19);">16:19</a>; <a onClick="return mV(\'Job\',19,\'25-27\');">19:25-27</a>).<P>C) To Job\'s Ultimatum of Faith:<p>1. Detecting the Friends\' False Note:<P>As the friends finish their first round of speeches, in which a remote and arbitrary God is urged upon him as everything, and man so corrupt and blind that he cannot but be a worm and culprit (compare <a onClick="return mV(\'Job\',25,\'4-6\');">Job 25:4-6</a>), Job\'s eyes, which hitherto have seen with theirs, are suddenly opened. His first complaint of their professed friendship was that it was fallible; instead of sticking to him when he needed them most (<a onClick="return mV(\'Job\',6,14);">Job 6:14</a>), and in spite of his bewilderment (<a onClick="return mV(\'Job\',6,26);">Job 6:26</a>), they were making it virtually an article of traffic (<a onClick="return mV(\'Job\',6,27);">Job 6:27</a>), as if it were a thing for their gain. It was not sincere, not intrinsic to their nature, but an expedient. And now all at once he penetrates to its motive. They are deserting him in order to curry favor with God. That motive has prevented them from seeing true; they see only their theoretical God, and are respecting His person instead of responding to the inner dictate of truth and integrity. To his honest heart this is monstrous; they ought to be afraid of taking falseness for God (<a onClick="return mV(\'Job\',13,\'3-12\');">Job 13:3-12</a>). Nor does his inference stop with thus detecting their false note. If they are "forgers of lies" in this respect, what of all their words of wisdom? they have been giving him "proverbs of ashes" (<a onClick="return mV(\'Job\',13,12);">Job 13:12</a>); the note of false implication is in them all. From this point therefore he pays little attention to what they say; lets them go on to grossly exaggerated statement of their tenet, while he opens a new way of faith for himself, developing the germs of insight that have come to him.<P>2. Staking All on Integrity:<P>Having cut loose from all countenancing of the friends\' self-interested motives, Job now, with the desperate sense of taking his life in his hand and abandoning hope, resolves that come what will he will maintain his ways to God\'s face. This, as he believes, is not only the one course for his integrity, but his one plea of salvation, for no false one shall appear before him. How tremendous the meaning of this resolve, we can think when we reflect how he has just taken God in hand to amend His supposed iniquitous order of things; and that he is now, without mediator, pleading the privilege that a mediator would secure (<a onClick="return mV(\'Job\',13,30,21);">13:20,21</a>; see 8, above) and urging a hearing on his own charges. The whole reach of his sublime faith is involved in this.<P>3. "If a Man Die":<P>In two directions his faith is reaching out; in both negatively at first. One, the belief in an Advocate, has already been broached, and is germinating from negative to positive. The other, the question of life after death, rises here in the same tentative way: using first the analogy of the tree which sprouts again after it is cut down (<a onClick="return mV(\'Job\',14,\'7-9\');">Job 14:7-9</a>), and from it inquiring, \'If a man die—might he live again?\' and dwelling in fervid imagination on the ideal solution which a survival of death would bring (<a onClick="return mV(\'Job\',14,\'13-17\');">Job 14:13-17</a>), but returning to his reluctant negative, from the analogy of drying waters (<a onClick="return mV(\'Job\',14,11);">Job 14:11</a>) and the slow wearing down of mountains (<a onClick="return mV(\'Job\',14,18,19);">Job 14:18,19</a>). As yet he can treat the idea only as a fancy; not yet a hope or a grounded conviction.<P>4. The Surviving Next of Kin:<P>The conviction comes by a nobler way than fancy, by the way of his personal sense of the just and God-like order. The friends in their second round of speeches have begun their lurid portrayals of the wicked man\'s awful fate; but until all have spoken again he is concerned with a far more momentous matter. Dismissing these for the present as an academic exercise composed in cold blood (<a onClick="return mV(\'Job\',16,4,5);">Job 16:4,5</a>), and evincing a heart hid from understanding (<a onClick="return mV(\'Job\',17,4);">Job 17:4</a>), Job goes on to recount in the most bitter terms he has yet used the flagrancy of his wrong as something that calls out for expiation like the blood of Cain (<a onClick="return mV(\'Job\',16,18);">16:18</a>), and breaks out with the conviction that his witness and voucher who will hear his prayer for mediation is on high (<a onClick="return mV(\'Job\',16,\'19-21\');">16:19-21</a>). Then after Bildad in a spiteful retort has matched his complaint with a description of the calamities of the wicked (an augmented echo of Eliphaz), and he has pathetically bewailed the treachery of earthly friends (<a onClick="return mV(\'Job\',19,13,14,21,22);">19:13,14,21,22</a>), he mounts, as it were, at a bound to the sublime ultimatum of his faith in an utterance which he would fain see engraved on the rock forever (<a onClick="return mV(\'Job\',19,\'23-29\');">19:23-29</a>). "I know that my Redeemer liveth," he exclaims; literally, my Go\'el (go\'ali), or next of kin, the person whose business in the old Hebrew idea was to maintain the rights of an innocent wronged one and avenge his blood. He does not recede from the idea that his wrong is from God (compare <a onClick="return mV(\'Job\',19,6,21);">19:6,21</a>); but over his dust stands his next of kin, and as the result of this one\'s intercession Job, in his own integral person, shall see God no more a stranger. So confident is he that he solemnly warns the friends who have falsely impeached him that it is they, not he, who are in peril (<a onClick="return mV(\'Job\',19,28,29);">19:28,29</a>; compare <a onClick="return mV(\'Job\',13,10,11);">13:10,11</a>).<P>D) To Job\'s Verdict on Things as They Are:<P>1. Climax and Subsidence of the Friends\' Charge:<P>That in this conviction of a living Redeemer Job\'s faith has reached firm and final ground is evident from the fact that he does not recur to his old doubts at all. They are settled, and settled right. But now, leaving them, he can attend to what the friends have been saying. Zophar, the third speaker, following, presses to vehement, extreme their iterated portrayal of the wicked man\'s terrific woes; it seems the design of the writer to make them outdo themselves in frantic overstatement of their thesis. As Zophar ceases, and Job has thus, as it were, drawn all their fire, Job refutes them squarely, as we shall presently see. Meanwhile, in the course of his extended refutation, the friends begin a third round of speeches. Eliphaz, who has already taken alarm at the tendency of Job\'s words, as those of a depraved skeptic and ruinous to devotion (<a onClick="return mV(\'Job\',15,4,5,6);">15:4-6</a>), now in the interests of his orthodoxy brings in his bill of particulars. It is the kind of theoretical cant that has had large prevalence in dogmatic religion, but in Job\'s case atrociously false. He accuses Job of the most heartless cruelties and frauds (<a onClick="return mV(\'Job\',22,\'5-11\');">22:5-11</a>), and of taking occasion to indulge in secret wickedness when God was not looking (<a onClick="return mV(\'Job\',22,\'12-14\');">22:12-14</a>); to this it is that he attributes the spiritual darkness with which Job is encompassed. Then in a beautiful exhortation—beautiful when we forget its unreal condition (<a onClick="return mV(\'Job\',22,23);">22:23</a>)—he ends by holding open to Job The way of reinstatement and peace. This is the last word of the friends that has any weight. Bildad follows Job\'s next speech indeed very briefly (<a onClick="return mV(\'Job\',25,\'1-\');">Job 25</a>), giving a last feeble echo of their doctrine of total depravity; a reply which Job ridicules and carries on in a kind of parody (<a onClick="return mV(\'Job\',26,\'1-\');">Job 26</a>). Zophar does not speak a third time at all. He has nothing to say. And this silence of his is the writer\'s way of making the friends\' theory subside ingloriously.<P>2. The Real Cause of Job\'s Dismay:<P>The idea that Job has a defensible cause or sees farther than they is wholly lost on the friends; to them he is simply a wicked man tormented by the consciousness of guilt, and they attribute the tumult of his thoughts to a wrath, or vexation, which blinds and imperils his soul (compare <a onClick="return mV(\'Job\',5,2);">5:2</a>; <a onClick="return mV(\'Job\',18,4);">18:4</a>). That is not the cause of his dismay at all, nor is it merely that his personal fate is inscrutable (compare <a onClick="return mV(\'Job\',23,17);">23:17</a> margin). He is confounded rather, even to horror, because the probable facts of the world-order prove the utter falsity of all that they allege. Leaving his case, the righteous man\'s, out of the account, he sees the wicked just as prosperous, just as secure, just as honored in life and death, as the righteous (<a onClick="return mV(\'Job\',21,\'5-15\',\'29-33\');">21:5-15,29-33</a>). The friends ought to see so plain a fact as well as he (<a onClick="return mV(\'Job\',21,29);">21:29</a>). To all outward appearance there is absolutely no diversity of fate between righteous and wicked (<a onClick="return mV(\'Job\',21,\'23-26\');">21:23-26</a>). The friends\' cut-and-dried Wisdom-doctrine and their thrifty haste to justify God (compare <a onClick="return mV(\'Job\',13,7,8);">13:7,8</a>) have landed them in a lie; the truth is that God has left His times mysterious to men (<a onClick="return mV(\'Job\',24,1);">24:1</a>). They may as well own to the full the baffling fact of the impunity of wickedness; the whole of <a onClick="return mV(\'Job\',24,\'1-\');">Job 24</a> is taken up with details of it. Wisdom, with its rigid law of reward and punishment, has failed to penetrate the secret. A hard regime of justice, work and wage, conduct and desert, does not sound the deep truth of
