 the Epistle the guilt of sin as constituting an objective disability to fellowship with God is strongly emphasized. "If We say that we have no sin, we deceive ourselves" (<a onClick="return mV(\'1Jo\',1,8);">1Joh 1:8</a>). The phrase "to have sin" is peculiar to John, and specifically denotes the culpability of the agent (compare <a onClick="return mV(\'Jhn\',9,41);">Joh 9:41</a>; <a onClick="return mV(\'Jhn\',15,22,24);">15:22,24</a>; <a onClick="return mV(\'Jhn\',19,11);">19:11</a>). Sin is essentially that which needs God\'s forgiveness (<a onClick="return mV(\'1Jo\',1,9);">1Joh 1:9</a>; <a onClick="return mV(\'1Jo\',2,1,2);">2:1,2</a>); and to this end an intercessor and a propitiation have been provided. Such culpability is universal: "If we say that we have not sinned, we"—not only deceive ourselves—"we make him a liar" (<a onClick="return mV(\'1Jo\',1,10);">1Joh 1:10</a>).<P>A second passage (<a onClick="return mV(\'1Jo\',3,\'4-9\');">1Joh 3:4-9</a>) emphasizes the ethical quality of sin—its antagonism to the nature of God and of the children of God. The word which defines the constitutive principle of sin is "lawlessness" (<a onClick="return mV(\'1Jo\',3,4);">1Joh 3:4</a>). Sin is fundamentally the denial of the absoluteness of moral obligation, the repudiation of the eternal law upon which all moral life is based. In other words, to sin is to assert one\'s own will as the rule of action against the absolutely good will of God. But again, the Epistle gives the warning that "all unrighteousness is sin" (<a onClick="return mV(\'1Jo\',5,17);">1Joh 5:17</a>). Everything that is not right is wrong, Every morally inferior course of action, however venial it may appear, is sin and contains the elements of positive guilt. The perplexing topic of "sin unto death" demands too special treatment to be dealt with here.<P>2. Propitiation:<P>(1) In the Gospel.<P>The paucity of reference in the Fourth Gospel to the propitiating aspect of Christ\'s redemptive work has been seized upon as proof that, though the writer did not consciously reject the orthodox doctrine, it was really alien to his system. But such a criticism might be directed with almost equal force against the Synoptics. It was no part of John\'s plan, as has been said, to expound a doctrine of propitiation; yet his frontispiece to the ministry of Jesus is "the Lamb of God that taketh away the sin of the world"; and, as Dr. Inge has pointed out, the same type of the Paschal Lamb underlies the whole narrative of the Passion. In the high-priestly prayer our Lord expressly represents Himself as the covenant-sacrifice which consecrates His disciples as the people of God (<a onClick="return mV(\'Jhn\',17,19);">Joh 17:19</a>); while the Synoptic "ransom for many" is paralleled by the interpretation of Christ\'s death as effectual "for the nation; and not for the nation only, but that he might also gather together into one the children of God that are scattered abroad" (<a onClick="return mV(\'Jhn\',11,51,52);">Joh 11:51,52</a>; compare <a onClick="return mV(\'1Jo\',2,2);">1Joh 2:2</a>).<P>(2) In the Epistle.<P>In the Epistle the doctrinal statement is much more explicit. The fact of propitiation is placed in the forefront. The passage which immediately follows the Prologue (<a onClick="return mV(\'1Jo\',1,6);">1Joh 1:6-2:2</a>) introduces a group of ideas—propitiation, blood, forgiveness, cleansing—which are taken directly from the sacrificial system of the Old Testament, and are expressed, indeed, in technical Levitical terms. The mode of action by which Christ accomplished and still accomplishes His mission as the Saviour of the world is: "He is the propitiation for our sins; and not for ours only, but also for the whole world" (<a onClick="return mV(\'1Jo\',2,2);">1Joh 2:2</a>). Propitiation has its ultimate source in the moral nature of God. It is no device for inducing a reluctant Deity to forgive; it is the way by which the Father brings back His sinning children to Himself. In John\'s conception it is the supreme act of God\'s supreme attribute, love. "Herein is love" (<a onClick="return mV(\'1Jo\',4,10);">1Joh 4:10</a>). Yet it is a real work of propitiation in which this love goes forth for man\'s salvation—a work, that is, which expiates the guilt of sin, which restores sinful offenders to God by rendering their sin null and inoperative as a barrier to fellowship with Him. This propitiatory virtue is regarded as concentrated in the "blood of Jesus his Son" (<a onClick="return mV(\'1Jo\',1,7);">1Joh 1:7</a>), that is to say, in the Divine-human life offered to God in the sacrifice of the cross. This, if we walk in the light as He is in the light, "cleanseth us from all sin"—removes from us the stain of our guilt, and makes us clean in God\'s sight. In virtue of this, Christ is the penitent sinner\'s advocate (paraclete-helper) with the Father (<a onClick="return mV(\'1Jo\',2,1);">1Joh 2:1</a>). The words "with the Father" are highly significant. Even the Father\'s love can urge nothing in apology for sin, nothing that avails to absolve from its guilt. But there is one who can urge on our behalf what is at once the strongest condemnation of our sin and plea for its remission—Himself, "Jesus Christ the righteous" (<a onClick="return mV(\'1Jo\',2,1);">1Joh 2:1</a>). "And he (Himself) is the propitiation for our sins." John does not speak of Christ as "making propitiation"; He, Himself, in virtue of all He is—Jesus Christ, in whom the Divine ideal of humanity is consummated, in whom the Father sees His own essential righteousness revealed, Jesus Christ the Righteous—is both propitiation and intercession. The two acts are not only united in one person, but constitute the one reconciling work by which there is abiding fellowship between God and His sinning people.<P>(3) One with New Testament Teaching.<P>In this statement of the doctrine of propitiation, memorable as it is, there is nothing notably original. It tacitly presupposes, as New Testament teaching everywhere does, that God, in bestowing the sovereign grace of pardon and sonship, must deal truthfully and adequately with sin as a violation of the moral order; and with John, as with other New Testament writers, the necessity and efficacy of sacrifice as the means by which this is accomplished are simply axiomatic. His great contribution to Christian thought is the vision of the cross in the heart of the eternal love. How suggestive are these two statements when placed side by side! "Herein is love...that he loved us, and sent his Son to be the propitiation for our sins" (<a onClick="return mV(\'1Jo\',4,10);">1Joh 4:10</a>); and "Hereby know we love (recognize what it is), because he laid down his life for us" (<a onClick="return mV(\'1Jo\',3,16);">1Joh 3:16</a>). God\'s sending His Son and Christ\'s laying down His life are moral equivalents. The sacrifice of Christ is the sacrifice of God. John\'s doctrine of propitiation follows as a moral necessity from his doctrine of God. If God is love, nothing is more inevitably true than that He suffers on account of human sin; and to deny Him the power to help and save men by bearing their burden would be to deny to Him love\'s highest prerogative.``1';
isbe[5096]='Johannine Theology, 2`VI. Eternal Life.<P>The development of the conception of eternal life must be set along with the doctrine of the moral nature of God and the doctrine of the incarnation as one of the greatest contributions of the Johannine theology to New Testament thought. With this conception the Gospel begins (<a onClick="return mV(\'Jhn\',1,4);">Joh 1:4</a>) and ends (<a onClick="return mV(\'Jhn\',20,31);">Joh 20:31</a>); and, in like manner, the Epistle (<a onClick="return mV(\'1Jo\',1,2);">1Joh 1:2</a>; <a onClick="return mV(\'1Jo\',5,20);">5:20</a>). The designation most frequently employed is simply "the life" (he zoe); 17 times in the Gospel and 6 times in the First Epistle it is described qualitatively as "eternal"; but the adjective brings out only what is implicit in the noun. In harmony with the universal Biblical conception, John regards life as the summum bonum, in which the reality of fellowship with God consists, which therefore fulfills the highest idea of being—"perfect truth in perfect action" (Westcott). Christ Himself is "the life" (<a onClick="return mV(\'Jhn\',14,6);">Joh 14:6</a>), its only bestower and unfailing source (<a onClick="return mV(\'Jhn\',14,19);">Joh 14:19</a>). He came that we might have it abundantly (<a onClick="return mV(\'Jhn\',10,10);">Joh 10:10</a>).<P>1. Ethical Rather than Eschatological:<P>But this conception is uniquely developed in two directions. While the eschatological element is not lost, it is absorbed in the ethical. The ideas of duration and futurity, which are properly and originally expressed by the adjective "eternal" (aionios = belonging to an eon—specifically to "the coming eon"), become secondary to that of timeless moral quality. Always life is regarded as a present possession rather than as future felicity (e.g. <a onClick="return mV(\'Jhn\',3,36);">Joh 3:36</a>; <a onClick="return mV(\'Jhn\',20,31);">20:31</a>; <a onClick="return mV(\'1Jo\',3,14,15);">1Joh 3:14,15</a>; <a onClick="return mV(\'1Jo\',5,12);">5:12</a>). For John the question whether it is possible to make the best of both worlds is meaningless. Eternal life is the best, the Divine, kind of life, whether in this world or another. It is the kind of life that has its perfect manifestation in Christ (<a onClick="return mV(\'1Jo\',1,2);">1Joh 1:2</a>; <a onClick="return mV(\'1Jo\',5,11);">5:11</a>). To possess that nature which produces thoughts and motives and desires, words and deeds like His, is to have eternal life.<P>2. Metaphysical Aspect:<P>Metaphysically the conception undergoes a development which is equally remarkable, though in the judgment of many, of more questionable value. It has already been seen (see above, II) that life is conceived as the animating principle or essence of the Divine nature, the inward energy of which all its activities are the manifold outgoing. And this conception is carried through with strict consistency. The spiritual life in men, which is "begotten of God," is the vital essence, the mystic principle which is manifested in all the capacities and activities of Christian personality. It does not consist in, and still less is it a result following, repentance, faith, obedience or love; it is that of which they are the fruits and the evidences. Thus instead of "This do, and thou shalt live" (<a onClick="return mV(\'Luk\',10,28);">Lu 10:28</a>), John says, conversely, "Every one also, that doeth righteousness is (= has been) begotten of" God (<a onClick="return mV(\'1Jo\',2,29);">1Joh 2:29</a>); instead of "The just shall live by faith" (<a onClick="return mV(\'Rom\',1,17);">Ro 1:17</a>, the King James Version), "Whosoever believeth that Jesus is the Christ is (= has been) begotten of God" (<a onClick="return mV(\'1Jo\',5,1);">1Joh 5:1</a>). The human activity is the result and proof of Divine life already imparted, not the condition or means of its attainment. In the Johannine conception life is cause, not effect; not phenomenon, but essence; not the complex whole of the qualities, activities and experiences of the spiritual man, but that which makes them possible—the inscrutable, Divinely communicated principle (<a onClick="return mV(\'Jhn\',3,8);">Joh 3:8</a>) in which the capacity for them is given and by which also it is realized.<P>Reply to Criticism.<P>This Johannine conception of life is vigorously criticized as importing into the interpretation of Christian experience principles and modes of thought borrowed from Greek philosophy. But the tendency to infer causes from effects and to reason from phenomena to essence is not peculiar to Greek philosophy; it is native to the human intellect. The Johannine conception of spiritual life is closely analogous to the common conception of physical life. We do not conceive that a man lives because he breathes and feels and acts; we think and we say that he does these things because he lives, because there is in him that mystic principle we call life. Only to the thinker trained in the logic of empiricism is it possible to define life solely by its phenomena, as e.g. "the continuous adjustment of internal to external relations" (Spencer). The ordinary mind instinctively passes behind the phenomena to entity of which they are the manifestation. The Johannine conception, moreover, lies in the natural line of development for New Testament thought. It is implicit in that whole strain of our Lord\'s synoptic teaching which regards doing as only the outcome of being, and which is emphasized in such utterances as "Either make the tree good, and its fruit good; or make the tree corrupt, and its fruit corrupt: for the tree is known by its fruit" (<a onClick="return mV(\'Mat\',12,33);">Mt 12:33</a>); as also in the whole Pauline doctrine of the new creation and the mystical indwelling of Christ in the members of His body. And while it is no doubt true that the Johannine conception of life was immediately influenced by contact with Hellenism, it is one which was sure, sooner or later, to emerge in Christian theology.<P>3. Development of Doctrine:<P>(1) Source in God.<P>In the development of the doctrine we note the following points. (a) The sole and absolute source of life is God, the Father, revealed in Christ. "The Father hath life in himself" (<a onClick="return mV(\'Jhn\',5,26);">Joh 5:26</a>). He is the "living Father" by whom the Son lives (<a onClick="return mV(\'Jhn\',6,57);">Joh 6:57</a>); the "true God, and eternal life" (<a onClick="return mV(\'1Jo\',5,20);">1Joh 5:20</a>). Eternal life is nothing else than the immanence of God in moral beings created after His likeness; the Divine nature reproducing itself in human nature; the energy of the Spirit of God in the spiritual nature of man. This is its ultimate definition.<P>(2) Mediated by Christ.<P>Of this life Christ is the sole mediator (<a onClick="return mV(\'Jhn\',6,33,57);">Joh 6:33,57</a>; <a onClick="return mV(\'Jhn\',11,25);">11:25</a>; <a onClick="return mV(\'Jhn\',14,6);">14:6</a>). The witness is that "God gave unto us eternal life, and this life is in his Son" (<a onClick="return mV(\'1Jo\',5,11);">1Joh 5:11</a>). This mediation is grounded in the relation, eternally subsisting within the Godhead, of the Logos to the Father. The life manifested and seen in the historic Christ (<a onClick="return mV(\'1Jo\',1,1);">1Joh 1:1</a>) is "the life, the eternal life," which existed in relation to the Father (<a onClick="return mV(\'1Jo\',1,2);">1Joh 1:2</a>). By the incarnation of the Son the eternal life in its Divine fullness has become incorporate with humanity, a permanent source of regenerative power to "as many as received him" (<a onClick="return mV(\'Jhn\',1,12);">Joh 1:12</a>). It is His own relation to the Father that He reproduces in men (<a onClick="return mV(\'Jhn\',17,23);">Joh 17:23</a>).<P>(3) Through the Spirit.<P>In the communication of this life the Spirit is the one direct agent (<a onClick="return mV(\'Jhn\',3,\'5-8\');">Joh 3:5-8</a>; see above, under IV).<P>(4) The Divine "Begetting."<P>The act of Divine self-communication is constantly and exclusively expressed by the word "beget" (gennao—<a onClick="return mV(\'Jhn\',1,13);">Joh 1:13</a>; <a onClick="return mV(\'Jhn\',3,3);">3:3</a>,<a onClick="return mV(\'Jhn\',3,\'5-8\');">5-8</a>; <a onClick="return mV(\'1Jo\',2,29);">1Joh 2:29</a>; <a onClick="return mV(\'1Jo\',3,9);">3:9</a>, etc.). The word is of far-reaching significance. It implies not only that life has its ultimate origin in God, but that its communication is directly and solely His act. In how literal a sense the Divine begetting is to be understood appears very strikingly in <a onClick="return mV(\'1Jo\',3,9);">1Joh 3:9</a>: "Whosoever is begotten of God doeth no sin; because his seed abideth in him." The unique expression "his seed" signifies the new life-principle which is the formative element of the "children of God." This abides in him who has received it. It stamps its own character upon his life and determines its whole development.<P>(5) The "Children of God."<P>Those who are "begotten of God" are ipso facto "children of God" (tekna theou, <a onClick="return mV(\'Jhn\',1,12);">Joh 1:12</a>; <a onClick="return mV(\'Jhn\',11,52);">11:52</a>; <a onClick="return mV(\'1Jo\',3,1,2,10);">1Joh 3:1,2,10</a>; <a onClick="return mV(\'1Jo\',5,2);">5:2</a>). The term connotes primarily the direct communication of the Father\'s own nature; and secondarily the fact that the nature thus communicated has not as yet reached its full stature, but contains the promise of a future glorious development. We are now children of God, but what it fully is to be children of God is not yet made manifest (<a onClick="return mV(\'1Jo\',3,2);">1Joh 3:2</a>). Participation in this life creates a family fellowship (koinonia) at once human and Divine. Those who are begotten of God and walk in the light have "fellowship one with another" (<a onClick="return mV(\'1Jo\',1,7);">1Joh 1:7</a>). They are "brethren" and are knit together by the instincts (<a onClick="return mV(\'1Jo\',5,1);">1Joh 5:1</a>) and the duties of mutual love (<a onClick="return mV(\'Jhn\',13,34);">Joh 13:34</a>; <a onClick="return mV(\'Jhn\',15,12);">15:12</a>; <a onClick="return mV(\'1Jo\',3,16);">1Joh 3:16</a>; <a onClick="return mV(\'1Jo\',4,11);">4:11</a>) and of mutual watchfulness and intercession (<a onClick="return mV(\'1Jo\',5,16);">1Joh 5:16</a>).<P>On the Divine side they have fellowship "with the Father, and with his Son Jesus Christ" (<a onClick="return mV(\'1Jo\',1,3);">1Joh 1:3</a>). In this Divine fellowship the life "begotten" is nourished and sustained; and no term is more characteristic of the Johannine vocabulary, alike in Gospel and Epistles, than the word "abide" (menein), by which this is expressed. There is, however, a noticeable difference in the modes of statement. In the Epistle, the formulas almost exclusively employed are these: "God abides in us," "We abide in God," "God abides in us and we in him." In the Gospel the reciprocal indwelling is that of Christ and His disciples (<a onClick="return mV(\'Jhn\',15,\'4-10\');">Joh 15:4-10</a>), which has its Divine counterpart in that of the Father and the Son (<a onClick="return mV(\'Jhn\',14,10);">Joh 14:10</a>; <a onClick="return mV(\'Jhn\',17,23);">17:23</a>; <a onClick="return mV(\'Jhn\',15,10);">15:10</a>). This diversity is consistent with the different points of view occupied in the two documents. The Gospel is christocentric; the Epistle, theocentric. In the one is given the concrete presentment of the incarnate Son; in the other the immediate intuition of the Divine nature revealed in Him. While the theme common to both is the "Word of life," the special theme of the Gospel is the Word who reveals and imparts the life; in the Epistle it is the life revealed and imparted by the Word, and the thought of the indwelling Christ is naturally carried up to the ultimate truth of the indwelling God.<P>(6) The Divine Abiding.<P>The vitalizing union by which the Divine life is sustained in those who are begotten of God consists in two reciprocal activities, not separable and not identical—God\'s (or Christ\'s) abiding in us and our abiding in Him. As in the similitude of the vine and the branches (<a onClick="return mV(\'Jhn\',15,\'1-10\');">Joh 15:1-10</a>), the life imparted is dependent for its sustenance and growth upon a continuous influx from the parent source: as it is the sap of the vine that vitalizes the branches, producing leaf and blossom and fruit, so does the life of God support and foster in His children its own energies of love and truth and purity. But to this end the abiding of God in us has as its necessary counterpart our abiding in Him. We can respond to the Divine influence or reject it; open or obstruct the channels through which the Divine life flows into ours (<a onClick="return mV(\'Jhn\',15,6,7,10);">Joh 15:6,7,10</a>; <a onClick="return mV(\'Jhn\',8,31);">8:31</a>). Hence, abiding in God is a subject of instruction and exhortation (<a onClick="return mV(\'Jhn\',15,4);">Joh 15:4</a>; <a onClick="return mV(\'1Jo\',2,27);">1Joh 2:27</a>f); and here the idea of persistent and stedfast purpose which belongs to the word menein comes clearly into view. As the abiding of God in us is the persistent and purposeful action by which the Divine nature influences ours, so our abiding in God is the persistent and purposeful submission of ourselves to that influence. The means of doing this are stedfast loyalty to the truth as it is revealed in Christ and announced in the apostolic Gospel (<a onClick="return mV(\'Jhn\',8,31);">Joh 8:31</a>; <a onClick="return mV(\'Jhn\',15,7);">15:7</a>; <a onClick="return mV(\'1Jo\',2,27);">1Joh 2:27</a>), keeping God\'s commandments (<a onClick="return mV(\'Jhn\',14,23);">Joh 14:23</a>; <a onClick="return mV(\'Jhn\',15,10);">15:10</a>; <a onClick="return mV(\'1Jo\',3,24);">1Joh 3:24</a>), and loving one another (<a onClick="return mV(\'1Jo\',4,12,16);">1Joh 4:12,16</a>). Thus only is the channel of communication kept clear between the source and the receptacle of life.<P>VII. Human Nature and Its Regeneration.<P>The necessity of regeneration is fundamental to the whole theological scheme (<a onClick="return mV(\'Jhn\',3,3,5,7);">Joh 3:3,5,7</a>). Life which consists in union with God does not belong to man as he is naturally constituted: those who know that they have eternal life know that it is theirs because they have "passed out of death into life" (<a onClick="return mV(\'1Jo\',3,14);">1Joh 3:14</a>; <a onClick="return mV(\'Jhn\',5,24);">Joh 5:24</a>).<P>1. The World:<P>The unregenerate state of human nature is specially connected with the Johannine conception of the "world" (kosmos). This term has a peculiar elasticity of application; and Westcott\'s definition—"the order of finite being, regarded as apart from God"—may be taken as expressing the widest idea that underlies John\'s use of the word. When the kosmos is material, it signifies<P>(1) the existing terrestrial creation (<a onClick="return mV(\'Jhn\',1,10);">Joh 1:10</a>; <a onClick="return mV(\'Jhn\',13,1);">13:1</a>; <a onClick="return mV(\'Jhn\',16,28);">16:28</a>), especially as contrasted with the sphere of the heavenly and eternal. When it refers to humanity, it is either<P>(2) the totality of mankind as needing redemption and as the object of God\'s redeeming love (<a onClick="return mV(\'Jhn\',3,16);">Joh 3:16</a>; <a onClick="return mV(\'1Jo\',2,2);">1Joh 2:2</a>; <a onClick="return mV(\'1Jo\',4,14);">4:14</a>), or<P>(3) the mass of unbelieving men, hostile to Christ and resisting salvation (e.g. <a onClick="return mV(\'Jhn\',15,18);">Joh 15:18</a>). Of the world in this sense it is said that it has no perception of the true nature of God and the Divine glory of Christ (<a onClick="return mV(\'Jhn\',1,10);">Joh 1:10</a>; <a onClick="return mV(\'Jhn\',17,25);">17:25</a>; <a onClick="return mV(\'1Jo\',3,1);">1Joh 3:1</a>); that it hates the children of God (<a onClick="return mV(\'Jhn\',15,18,19);">Joh 15:18,19</a>; <a onClick="return mV(\'Jhn\',17,14);">17:14</a>; <a onClick="return mV(\'1Jo\',3,13);">1Joh 3:13</a>); that the spirit of Antichrist dwells in it (<a onClick="return mV(\'1Jo\',4,3,4);">1Joh 4:3,4</a>); that to it belong the false prophets and their adherents (<a onClick="return mV(\'1Jo\',4,1,5);">1Joh 4:1,5</a>); that it is under the dominion of the wicked one (<a onClick="return mV(\'Jhn\',12,31);">Joh 12:31</a>; <a onClick="return mV(\'Jhn\',14,30);">14:30</a>; <a onClick="return mV(\'Jhn\',16,11);">16:11</a>; <a onClick="return mV(\'1Jo\',5,19);">1Joh 5:19</a>); that the constituents of its life are "the lust of the flesh and the lust of the eyes and the vainglory of life" (<a onClick="return mV(\'1Jo\',2,16);">1Joh 2:16</a>); that it passeth away (<a onClick="return mV(\'1Jo\',2,17);">1Joh 2:17</a>); that Christ has conquered it (<a onClick="return mV(\'Jhn\',16,33);">Joh 16:33</a>), and that "whatsoever is begotten of God" conquers it (<a onClick="return mV(\'1Jo\',5,4);">1Joh 5:4</a>) by the power of faith in Him (<a onClick="return mV(\'1Jo\',5,5);">1Joh 5:5</a>).<P>Thus the "world" (in this darker significance) is composed of those who still love the darkness rather than the light (<a onClick="return mV(\'Jhn\',3,19);">Joh 3:19</a>), who, when Christ is presented to them, obstinately retain their blindness and enmity. Nevertheless, the "world" is not beyond the possibility of salvation. The Holy Spirit, acting in the Christian community, will convince the world with regard to sin and righteousness and judgment (<a onClick="return mV(\'Jhn\',16,8);">Joh 16:8</a>); and the evidence of the unity of Divine fellowship among Christ\'s disciples will lead it to believe in His Divine mission (<a onClick="return mV(\'Jhn\',17,23);">Joh 17:23</a>).<P>2. Two Classes in the Human Race:<P>Thus, it is true that John teaches "a distinction of two great classes in the human race—those who are from above and those who are from beneath—children of light and children of darkness." But that he teaches this in any Gnostic or semignostic fashion is an assertion for which there is no real basis. He distinguishes between those who love the light and those who love the darkness rather than the light, between those who "receive" Christ and those who "will not" come unto Him that they may have life. This distinction, however, he traces to nothing in the natural constitution of the two classes, but solely to the regenerating act of God (<a onClick="return mV(\'Jhn\',1,13);">Joh 1:13</a>; <a onClick="return mV(\'Jhn\',6,44);">6:44</a>). His doctrine of regeneration is, in fact, his solution of the problem created by the actual existence of those two classes among men—a problem which is forced upon every thoughtful Christian mind by the diverse and opposite results of evangelism. It is this that lies behind such utterances as these: "Every one that is of the truth heareth my voice" (<a onClick="return mV(\'Jhn\',18,37);">Joh 18:37</a>); "Ye believe not, because ye are not of my sheep. My sheep hear my voice...and they follow me" (<a onClick="return mV(\'Jhn\',10,26,27);">Joh 10:26,27</a>); "Every one that hath heard from the Father, cometh unto me. No man can come unto me except it be given unto him of the Father" (<a onClick="return mV(\'Jhn\',6,45,65);">Joh 6:45,65</a>). In these and all similar passages, belief or unbelief in Christ, when He is presented, depends upon antecedent spiritual predisposition (John\'s equivalent to the Pauline predestination). There exists in certain persons what is lacking in others, a power of spiritual vision by which Christ is recognized, a capacity and a predisposition to receive Him. But this predisposition is not (any more than Paul\'s predestination) theirs by gift of nature. John refuses to find its source in human personality (<a onClick="return mV(\'Jhn\',1,13);">Joh 1:13</a>; <a onClick="return mV(\'1Jo\',5,1);">1Joh 5:1</a>). The children of God are not a superior species of the genus homo. They are men who have passed from death into life, and who have done so because they are begotten of God. John\'s doctrine is thus the antithesis of Gnosticism. The Gnostic distinction of two classes in the human race glorified men; its proper and inevitable fruit was spiritual pride. The effect of John\'s doctrine is to humble man and glorify God, to satisfy the innermost Christian consciousness that not even for their appropriation of God\'s gift in Christ can believers take credit to themselves; that in nothing can the human spirit do more than respond to the Divine, and that, in the last analysis, this power itself is of God. Regeneration in the Johannine sense is not to be identified with conversion. It is the communication of that vision of truth and that capacity for new moral activity which issue in conversion. The doctrine of regeneration contained in the Johannine writings is the fullest recognition in the New Testament that all the conscious experiences and activities of the Christian life are the result of God\'s own inscrutable work of begetting in the depths of human personality, and of renewing and replenishing there, the energies of the Divine.<P>VIII. The Church and Sacraments.<P>1. The Church:<P>While the word "church" is not found, the idea lies near the base of the Johannine theology. The Divine life communicated to men creates a Divine brotherhood, a "fellowship" which is with the Father and "with his Son Jesus Christ" (<a onClick="return mV(\'1Jo\',1,3);">1Joh 1:3</a>) and also "one with another" (<a onClick="return mV(\'1Jo\',1,7);">1Joh 1:7</a>)—a fellowship which is consecrated by the self-consecration of Jesus (<a onClick="return mV(\'Jhn\',17,19);">Joh 17:19</a>), in which men are cleansed from all sin by His blood (<a onClick="return mV(\'1Jo\',1,7);">1Joh 1:7</a>), and which is maintained by His intercessory action as the Paraclete with the Father (<a onClick="return mV(\'1Jo\',2,1);">1Joh 2:1</a>). This fellowship is realized in the actual Christian community and there only; but it is essentially inward and spiritual, not mechanically ecclesiastical, In the visible community spurious elements may intrude themselves, as is proved when schism unmasks those who, though they have belonged to the external organization, have never been partakers of its real life (<a onClick="return mV(\'1Jo\',2,19);">1Joh 2:19</a>). Only among those who walk in the light of God does true fellowship exist (<a onClick="return mV(\'1Jo\',1,7);">1Joh 1:7</a>).<P>2. The Sacraments:<P>From the doctrine of the Divine nature as life and light one might a priori infer the possibilities of a Johannine view of the sacraments. It is evident that there is room in the Johannine system of thought for a genuinely sacramental mode of Divine action—the employment of definite external acts, not as symbols only, but as real media of Divine communication. On the other hand, the truth that God is not life only but light also—self-revealing as well as self-imparting—would necessarily exclude any magical ex opere operato theory by which spiritual efficacy is attributed either to the physical elements in themselves or to the physical act of participation. And (though there is little or no explicit statement) such is the type of doctrine we actually find. With regard to all sacramental rites the universal principle applies: \'It is the spirit that quickeneth, the flesh profiteth nothing\' (<a onClick="return mV(\'Jhn\',6,63);">Joh 6:63</a>).<P>(1) Baptism.<P>Yet baptism is the physical counterpart of the Spirit\'s work in regeneration, and great importance is attached to it as the means of admission to the new life of the kingdom (<a onClick="return mV(\'Jhn\',3,5);">Joh 3:5</a>).<P>(2) The Lord\'s Supper.<P>The omission of all reference to the institution of the Lord\'s Supper (the incident of the feet-washing and the proclamation of the new commandment taking its place in the Gospel-narrative) is thought to indicate that John was conscious of a tendency to attach a superstitious value to the outward observance, and desired emphatically to subordinate this to what was spiritual and essential. The omission, to whatever motive it may have been due, is counter-balanced by the sacramental discourse (<a onClick="return mV(\'Jhn\',6,\'1-\');">Joh 6</a>). While the language of this discourse is not to be interpreted in a technically eucharistic sense, its purpose, or one of its purposes, undoubtedly, is to set forth the significance of the Lord\'s Supper in the largest light. Christ gives to men the bread of life, which is His own flesh and of which men must eat that they may live (<a onClick="return mV(\'Jhn\',6,\'50-55\');">Joh 6:50-55</a>). "He that eateth my flesh and drinketh my blood abideth in me and I in him." This eating and drinking is essentially of the Spirit. It signifies a derivation of life analogous to that of the Son Himself from the Father. "As the living Father sent me, and I live because of the Father; so he that eateth me, he also shall live because of me" (<a onClick="return mV(\'Jhn\',6,57);">Joh 6:57</a>). To "eat the flesh" of the Son of Man is to receive spiritual nourishment from Him, to live by His life. Yet there is nothing in John\'s way of thinking to exclude a real sacramental efficiency. "The act which is nothing when it is performed ignorantly and mechanically is of sovereign value to those who have apprehended its true meaning. The material elements represent the flesh and blood of Christ—His Divine Person given for the life of the world. He is present in them, not merely by way of symbol, but actually; but there must be something in the recipient corresponding to the spiritual reality which is conveyed through the gift. The outward act of participation must be accompanied with belief in Christ and a true insight into the nature of His work and a will to know and serve Him. The sacrament becomes operative as the bread of life through this receptive spirit on the part of those who observe it" (Scott, The Fourth Gospel, 127-28).<P>IX. Eschatology.<P>1. Type of Thought Idealistic:<P>The type of mind revealed in the Johannine writings is one that instinctively leans to the ideal and the spiritual in its contemplation of life, grasping what is of universal significance and dwelling upon events only as they are the embodiment of eternal principles. Where this fashion of thought is so strongly developed, the eschatological, like the historical, becomes secondary.<P>2. Yet History Not Ignored:<P>In John there is but one life—the eternal; and there is but one world—the world of the ideal, which is also the only real. Yet he is not an idealist, pure and simple. For him events are not merely symbols; history is not allegory. The incarnation is a historical fact, the Parousia a future event. His thought does not move in a world of mere abstractions, a world in which nothing ever happens. His true distinction as a thinker lies in the success with which he unites the two strains of thought, the historical and the ideal. The word which may be said to express his conception of history is "manifestation" (compare <a onClick="return mV(\'Jhn\',2,11);">Joh 2:11</a>; <a onClick="return mV(\'Jhn\',9,3);">9:3</a>; but especially <a onClick="return mV(\'1Jo\',1,2);">1Joh 1:2</a>; <a onClick="return mV(\'1Jo\',2,19,28);">2:19,28</a>; <a onClick="return mV(\'1Jo\',3,2,5,8);">3:2,5,8</a>; <a onClick="return mV(\'1Jo\',4,9);">4:9</a>). The incarnation is only the manifestation of \'what was from the beginning\' (<a onClick="return mV(\'1Jo\',1,1,2);">1Joh 1:1,2</a>); the mission of Christ, the manifestation of the love eternally latent in the depths of the Divine nature (<a onClick="return mV(\'1Jo\',4,9);">1Joh 4:9</a>). The successive events of history are the emergence into visibility of what already exists. In them the potential becomes actual.<P>3. Nor Eschatology:<P>Thus John has an eschatology, as well as a history. He profoundly spiritualizes. He reaches down through the pictorial representations of the traditional apocalyptic, and inquires what essential principle each of these embodies. Then he discovers that this principle is already universally and inevitably in operation; and this, the present spiritual reality, becomes for him the primary thought. Judgment means essentially the sifting and separation, the classification of men according to their spiritual affinities. But every day men are thus classifying themselves by their attitude toward Christ; this, the true judgment of the world, is already present fact. So also the coming and presence of Christ must always be essentially a spiritual fact, and as such it is already a present fact. There is, in the deepest significance of the word, a perpetual coming of Christ in Christian experience. This, however, does not prevent John from firmly holding the certainty of a fuller manifestation of these facts in the future, when tendencies shall have reached a final culmination, and principles which are now apprehended only by faith will be revealed in all the visible magnitude of their consequences.<P>4. Eschatological Ideas:<P>We shall now briefly survey the Johannine presentation of the chief eschatological ideas.<P>(1) Eternal life.<P>It has already been said that the most distinctive feature in the conception of eternal life is that it is not a future immortal felicity so much as a present spiritual state. The category of duration recedes before that of moral quality. Yet it has its own stupendous importance. In triumphant contrast with the poor ephemeralities of the worldly life, he that doeth the will of God "abideth for ever" (<a onClick="return mV(\'1Jo\',2,17);">1Joh 2:17</a>); and the complete realization of the life eternal is still in the future (<a onClick="return mV(\'Jhn\',4,36);">Joh 4:36</a>; <a onClick="return mV(\'Jhn\',6,27);">6:27</a>; <a onClick="return mV(\'Jhn\',12,25);">12:25</a>).<P>(2) Antichrist.<P>The view of Antichrist is strikingly characteristic. Tacitly setting aside the lurid figure of popular traditions, John grasps the essential fact that is expressed by the name and idea of Antichrist (= one who in the guise of Christ opposes Christ), and finds its fulfillment in the false teaching which substituted for the Christ of the gospel the fantastic product of Gnostic imagination (<a onClick="return mV(\'1Jo\',4,3);">1Joh 4:3</a>). But in this he reads the sign that the world\'s day has reached its last hour (<a onClick="return mV(\'1Jo\',2,18);">1Joh 2:18</a>).<P>(3) Resurrection.<P>While the Fourth Gospel so carefully records the proofs of Christ\'s resurrection, noticeably little (in the Epistle, nothing) is made of the thought of a future resurrection from the dead. For the Christian, the death of the body is a mere incident. "Whosoever liveth and believeth on me shall never die" (<a onClick="return mV(\'Jhn\',11,26);">Joh 11:26</a>; compare <a onClick="return mV(\'Jhn\',8,51);">Joh 8:51</a>). Regeneration—union with Christ—is the true resurrection (<a onClick="return mV(\'Jhn\',6,50,51,58);">Joh 6:50,51,58</a>). And yet, again, the eschatological idea is not lost. Side by side with the essential truth the supplementary and interpretative truth is given its right place. "Whoso eateth my flesh and drinketh my blood hath eternal life; and I will raise him up at the last day" (<a onClick="return mV(\'Jhn\',6,54);">Joh 6:54</a> the King James Version). If Christ says "I am the life: whosoever liveth and believeth on me shall never die," He also says "I am the resurrection: he that believeth on me, though he die, yet shall he live" (<a onClick="return mV(\'Jhn\',11,25);">Joh 11:25</a>).<P>(4) Judgment.<P>As has already been said, John regards judgment as essentially a present fact of life. Christ does not pass judgment upon men—that is not the purpose of His coming (<a onClick="return mV(\'Jhn\',3,17);">Joh 3:17</a>; <a onClick="return mV(\'Jhn\',12,47);">12:47</a>). Yet Christ is always of necessity judging men—compelling them to pass judgment upon themselves. For judgment He is come into the world (<a onClick="return mV(\'Jhn\',9,39);">Joh 9:39</a>). By their attitude toward Him men involuntarily but inevitably classify themselves, reveal what spirit they are of, and automatically register themselves as being or as not being "of the truth" (<a onClick="return mV(\'Jhn\',18,37);">Joh 18:37</a>). Judgment is not the assigning of a character from without, but the revelation of a character from within. And this is not future, but present. "He that believeth not hath been judged...because he hath not believed on the name of the only begotten Son of of God" (<a onClick="return mV(\'Jhn\',3,18);">Joh 3:18</a>). Yet the apostle indubitably looks forward to a future Day of Judgment (<a onClick="return mV(\'Jhn\',12,48);">Joh 12:48</a>; <a onClick="return mV(\'1Jo\',4,17);">1Joh 4:17</a>). Nor is this simply an "unconscious concession to orthodoxy." The judgment to come will be the full manifestation of the judgment that now is, that is to say, of the principles according to which men are in reality approved or condemned already. What this present judgment, the classification of men by their relation to Christ, ultimately signifies, is not at all realized by the "world," is not fully realized even in Christian faith. There must be a day when all self-deception shall cease and all reality shall be manifested.<P>(5) The Parousia.<P>In like manner the conception of the Parousia is primarily spiritual. The substitution in the Fourth Gospel of the Supper Discourse (<a onClick="return mV(\'Jhn\',14,1);">Joh 14-16</a>) for the apocalyptic chapters in the Synoptics is of the utmost significance. It is not a Christ coming on the clouds of heaven that is presented, but a Christ who has come and is ever coming to dwell in closest fellowship with His people (see above under IV). Yet John by no means discards belief in the Parousia as a historical event of the future. If Christ\'s abiding-place is in those that love Him and keep His word, there is also a Father\'s House in which there are many abiding-places, whither He goes to prepare a place for them and whence He will come again to receive them unto Himself (<a onClick="return mV(\'Jhn\',14,2,3);">Joh 14:2,3</a>). Still more is this emphasized in the Epistle. The command "Love not the world" is sharpened by the assurance that the world is on the verge, aye, in the process of dissolution (<a onClick="return mV(\'1Jo\',2,17);">1Joh 2:17</a>). The exhortation to "abide in him" is enforced by the dread of being put to shame at His impending advent (<a onClick="return mV(\'1Jo\',2,28);">1Joh 2:28</a>). The hope of being made partakers in His manifested glory is the consummation of all that is implied in our being now children of God (<a onClick="return mV(\'1Jo\',3,2,3);">1Joh 3:2,3</a>).<P>(a) A "Manifestation":<P>But this future crisis will be only the manifestation of the existing reality (<a onClick="return mV(\'1Jo\',3,2);">1Joh 3:2</a>). The Parousia will, no more than the incarnation, be the advent of a strange Presence in the world. It will be, as on the Mount of Transfiguration, the outshining of a latent glory; not the arrival of one who is absent, but the self-revealing of one who is present. As to the manner of Christ\'s appearing, the Epistle is silent. As to its significance, we are left in no doubt. It is a historical event; occurring once for all; the consummation of all Divine purpose that has governed human existence; the final crisis in the history of the church, of the world, and of every man.<P>(b) Relation to Believers:<P>Especially for the children of God, it will be a coming unto salvation. "Beloved, now are we children of God, and it is not yet made manifest what we shall be. We know that, if he shall be manifested, we shall be like him; for we shall see him as he is" (<a onClick="return mV(\'1Jo\',3,2);">1Joh 3:2</a>). Here the Johannine idea of "manifestation" is strikingly employed. "What we shall be" will be essentially what we are—children of God. No new element will be added to the regenerate nature. All is there that ever will be there. But the epoch of full development is not yet. Only when Christ—the Christ who is already in the world—shall be manifested, then also the children of God who are in the world will be manifested as being what they are. They also will have come to their Mount of Transfiguration. As eternal life here is mediated through this first manifestation (<a onClick="return mV(\'1Jo\',1,2);">1Joh 1:2</a>), so eternal life hereafter will be mediated through this second and final manifestation. "We know that we shall be like him, because we shall see him as he is." It is true that here according to our capacity we behold Him as He is (<a onClick="return mV(\'Jhn\',1,14);">Joh 1:14</a>); but perception, now dim and wavering, will then be intense and vivid. The vision of the future is in some sense corporeal as well as spiritual. Sense and faith will coincide. It will then have ceased to be expedient that Christ should go away in order that the Spirit of truth may come. We shall possess in the same experience the privilege of the original eyewitnesses of the incarnate life and the inward ministry of the Spirit. And seeing Him as He is, we shall be like Him. Vision will beget likeness, and likeness again give clearness to vision. And as the vision is in some unconjecturable fashion corporeal as well as spiritual, so also is the assimilation (compare <a onClick="return mV(\'Phl\',3,21);">Php 3:21</a>). The very idea of the spiritual body is that it perfectly corresponds to the character to which it belongs. The outward man will take the mold of the inward man, and will share with it its perfected likeness to the glorified manhood of Jesus Christ. Such is the farthest view opened to our hope by the Johannine eschatology; and it is that which, of all others, has been most entrancing to the imagination and stimulating to the aspiration of the children of God.<P>LITERATURE.<P>The following works may be mentioned as treating specially of the Theology: B. Weiss, Der Johannische Lehrbegriff, Berlin, 1862; O. Holtzmann, Das Johannes-Evangelium untersucht und erklart, Darmstadt, 1887; Beyschlag, Neutestamentliche Theologie, Halle, 1896; Pfleiderer, Das Urchristentum, Berlin,1902,English translation, Williams and Norgate, London; E. Haupt, Der erste Brief des Johannes, Colberg,1869,English translation, T. and T. Clark, Edinburgh; Grill, Untersuchungen uber die Entstehung des vierten Evangeliums, Tubingen, 1902; G.B. Stevens, The Johannine Theology, New York, 1894; id., The Theology of the New Testament,1899,also The Christian Doctrine of Salvation,1905,T. and T. Clark, Edinburgh; O. Cone, The Gospel and Its Earliest Interpretations, New York, 1893; Scott, The Fourth Gospel, Its Purpose and Theology, T. and T. Clark, 1906; Law, The Tests of Life: A Study of the First Epistle of John (dealing specially with the Theology), Edinburgh and New York, 1909; Denney, Jesus and the Gospel, New York, 1909; Judge, Cambridge Biblical Essays, Macmillan, 1910.``97';
isbe[5097]='John (1)`jon (Ioannes): The name of several persons mentioned in the Apocrypha:<P>(1) Father of Mattathias, grandfather of Judas Maccabeus and his brothers (1Macc 2:1).<P>(2) Eldest son of Mattathias, surnamed <a href="./study/isbe/search.html?string=GADDIS">GADDIS</a> (which see).<P>(3) Father of Eupolemus, one of the envoys sent to Rome by Judas Maccabeus (1Macc 8:17; 2Macc 4:11).<P>(4) John Hyrcanus, "a valiant man," son of Simon, and nephew of Judas Maccabeus (1Macc 13:53; 16:1).<P>See <a href="./study/isbe/search.html?string=ASMONEANS">ASMONEANS</a>; <a href="./study/isbe/search.html?string=MACCABEES">MACCABEES</a>.<P>(5) One of the envoys sent to treat with Lysias (2Macc 11:17).``79';
isbe[5098]='John (2)`(Ioannes): The name of 4 persons:<P>(1) <a href="./study/isbe/search.html?string=JOHN+THE+BAPTIST">JOHN THE BAPTIST</a> (which see).<P>(2) The apostle, the son of Zebedee, and brother of James (see <a href="./study/isbe/search.html?string=JOHN,+THE+APOSTLE">JOHN, THE APOSTLE</a>).<P>(3) A relative of Annas the high priest, who sat in the Sanhedrin when Peter and John were tried (<a onClick="return mV(\'Act\',4,6);">Ac 4:6</a>). Lightfoot supposes him to be the Jochanan ben Zacchai of the Talmud, who, however, did not belong to the family of the high priest. Nothing is really known of him.<P>(4) <a href="./study/isbe/search.html?string=JOHN+MARK">JOHN MARK</a> (which see).<P>(5) Father of Simon Peter (<a onClick="return mV(\'Jhn\',1,42);">Joh 1:42</a>; <a onClick="return mV(\'Jhn\',21,15,17);">21:15,17</a>, margin "Greek Joanes: called in <a onClick="return mV(\'Mat\',16,17);">Mt 16:17</a>, Jonah").``78';

isbe[5100]='John the Baptist`(Ioanes):<P><b>I. SOURCES</b><P><b>II. PARENTAGE</b><P><b>III. EARLY LIFE</b><P><b>IV. MINISTRY</b><P class="in15">1. The Scene<P class="in15">2. His First Appearance<P class="in15">3. His Dress and Manner<P class="in15">4. His Message<P class="in15">5. His Severity<P><b>V. BAPTISM</b><P class="in15">1. Significance<P class="in30">(1) Lustrations Required by the Levitical Law<P class="in30">(2) Anticipation of Messianic Lustrations Foretold by the Prophets<P class="in30">(3) Proselyte Baptism<P class="in15">2. Baptism of Jesus<P><b>VI. IMPRISONMENT AND DEATH</b><P class="in15">1. The Time<P class="in15">2. The Occasion<P><b>VII. JOHN AND HIS DISCIPLES</b><P class="in15">1. The Inner Circle<P class="in15">2. Their Training<P class="in15">3. Their Fidelity<P><b>VIII. JOHN AND JESUS</b><P class="in15">1. John\'s Relation to Jesus<P class="in15">2. Jesus\' Estimate of John<P><b>LITERATURE</b><hr /><P>I. Sources.<P>The sources of first-hand information concerning the life and work of John the Baptist are limited to the New Testament and Josephus Luke and Matthew give the fuller notices, and these are in substantial agreement. The Fourth Gospel deals chiefly with the witness after the baptism. In his single notice (Ant., XVIII, v, 2), Josephus makes an interesting reference to the cause of John\'s imprisonment. See VI, 2, below.<P>II. Parentage.<P>John was of priestly descent. His mother, Elisabeth, was of the daughters of Aaron, while his father, Zacharias, was a priest of the course of Abija, and did service in the temple at Jerusalem. It is said of them that "they were both righteous before God, walking in all the commandments and ordinances of the Lord blameless" (<a onClick="return mV(\'Luk\',1,6);">Lu 1:6</a>). This priestly ancestry is in interesting contrast with his prophetic mission.<P>III. Early Life.<P>We infer from Luke\'s account that John was born about six months before the birth of Jesus. Of the place we know only that it was a city of the hill country of Judah. Our definite information concerning his youth is summed up in the angelic prophecy, "Many shall rejoice at his birth. For he shall be great in the sight of the Lord, and he shall drink no wine nor strong drink; and he shall be filled with the Holy Spirit, even from his mother\'s womb" (<a onClick="return mV(\'Luk\',1,\'14-16\');">Lu 1:14-16</a>), and in Luke\'s brief statement, "And the child grew, and waxed strong in spirit, and was in the deserts till the day of his showing unto Israel" (<a onClick="return mV(\'Luk\',1,80);">Lu 1:80</a>). The character and spiritual insight of the parents shown in the incidents recorded are ample evidence that his training was a fitting preparation for his great mission.<P>IV. Ministry.<P>1. The Scene:<P>The scene of the Baptist\'s ministry was partly in the wilderness of Southern Judea and partly in the Jordan valley. Two locations are mentioned, Bethany or Bethabara (<a onClick="return mV(\'Jhn\',1,28);">Joh 1:28</a>), and Aenon near Salim (<a onClick="return mV(\'Jhn\',3,23);">Joh 3:23</a>). Neither of these places can be positively identified. We may infer from <a onClick="return mV(\'Jhn\',3,2);">Joh 3:2</a> that he also spent some time in Peraea beyond the Jordan.<P>2. His First Appearance:<P>The unusual array of dates with which Luke marks the beginning of John\'s ministry (<a onClick="return mV(\'Luk\',3,1,2);">Lu 3:1,2</a>) reveals his sense of the importance of the event as at once the beginning of his prophetic work and of the new dispensation. His first public appearance is assigned to the 15th year of Tiberius, probably 26 or 27 AD, for the first Passover attended by Jesus can hardly have been later than 27 AD (<a onClick="return mV(\'Jhn\',2,20);">Joh 2:20</a>).<P>3. His Dress and Manner:<P>John\'s dress and habits were strikingly suggestive of Elijah, the old prophet of national judgment. His desert habits have led some to connect him with that strange company of Jews known as the Essenes. There is, however, little foundation for such a connection other than his ascetic habits and the fact that the chief settlement of this sect was near the home of his youth. It was natural that he should continue the manner of his youthful life in the desert, and it is not improbable that he intentionally copied his great prophetic model. It was fitting that the one who called men to repentance and the beginning of a self-denying life should show renunciation and self-denial in his own life. But there is no evidence in his teaching that he required such asceticism of those who accepted his baptism.<P>4. His Message:<P>The fundamental note in the message of John was the announcement of the near approach of the Messianic age. But while he announced himself as the herald voice preparing the way of the Lord, and because of this the expectant multitudes crowded to hear his word, his view of the nature of the kingdom was probably quite at variance with that of his hearers. Instead of the expected day of deliverance from the foreign oppressor, it was to be a day of judgment for Israel. It meant good for the penitent, but destruction for the ungodly. "He will gather his wheat into the garner, but the chaff he will burn up with...fire" (<a onClick="return mV(\'Mat\',3,12);">Mt 3:12</a>). "The axe also lieth at the root of the trees: every tree therefore that bringeth not forth good fruit is hewn down, and cast into the fire" (<a onClick="return mV(\'Luk\',3,9);">Lu 3:9</a>). Yet this idea was perhaps not entirely unfamiliar. That the delay in the Messiah\'s coming was due to the sinfulness of the people and their lack of repentance, was a commonplace in the message of their teachers (Edersheim, Life and Times of Jesus the Messiah, I, 169).<P>The call to repentance was then a natural message of preparation for such a time of judgment. But to John repentance was a very real and radical thing. It meant a complete change of heart and life. "Bring forth...fruits worthy of repentance" (<a onClick="return mV(\'Luk\',3,8);">Lu 3:8</a>). What these fruits were he made clear in his answers to the inquiring multitudes and the publicans and soldiers (<a onClick="return mV(\'Luk\',3,\'10-14\');">Lu 3:10-14</a>). It is noticeable that there is no reference to the usual ceremonies of the law or to a change of occupation. Do good; be honest; refrain from extortion; be content with wages.<P>5. His Severity:<P>John used such violence in addressing the Pharisees and Sadducees doubtless to startle them from their self-complacency. How hopelessly they were blinded by their sense of security as the children of Abraham, and by their confidence in the merits of the law, is attested by the fact that these parties resisted the teachings of both John and Jesus to the very end.<P>With what vigor and fearlessness the Baptist pressed his demand for righteousness is shown by his stern reproof of the sin of Herod and Herodias, which led to his imprisonment and finally to his death.<P>V. Baptism.<P>1. Significance:<P>The symbolic rite of baptism was such an essential part of the work of John that it not only gave him his distinctive title of "the Baptist" (ho baptistes), but also caused his message to be styled "preaching the baptism of repentance." That a special virtue was ascribed to this rite, and that it was regarded as a necessary part of the preparation for the coming of the Messiah, are shown by its important place in John\'s preaching, and by the eagerness with which it was sought by the multitudes. Its significance may best be understood by giving attention to its historical antecedents, for while John gave the rite new significance, it certainly appealed to ideas already familiar to the Jews.<P>(1) Lustrations Required by the Levitical Law.<P>The divers washings required by the law (<a onClick="return mV(\'Lev\',11,\'1-\');">Le 11-15</a>) have, without doubt, a religious import. This is shown by the requirement of sacrifices in connection with the cleansing, especially the sin offering (<a onClick="return mV(\'Lev\',14,8,9,19,20);">Le 14:8,9,19,20</a>; compare <a onClick="return mV(\'Mar\',1,44);">Mr 1:44</a>; <a onClick="return mV(\'Luk\',2,22);">Lu 2:22</a>). The designation of John\'s baptism by the word baptizein, which by New Testament times was used of ceremonial purification, also indicates some historical connection (compare Sirach 34:25).<P>(2) Anticipation of Messianic Lustrations Foretold by Prophets.<P>John understood that his baptism was a preparation for the Messianic baptism anticipated by the prophets, who saw that for a true cleansing the nation must wait until God should open in Israel a fountain for cleansing (<a onClick="return mV(\'Zec\',13,1);">Zec 13:1</a>), and should sprinkle His people with clean water and give them a new heart and a new spirit (<a onClick="return mV(\'Eze\',36,25,26);">Eze 36:25,26</a>; <a onClick="return mV(\'Jer\',33,8);">Jer 33:8</a>). His baptism was at once a preparation and a promise of the spiritual cleansing which the Messiah would bestow. "I indeed baptize you with water unto repentance: but he that cometh after me...shall baptize you with the Holy Spirit and with fire" (<a onClick="return mV(\'Mat\',3,11);">Mt 3:11</a> margin).<P>(3) Proselyte Baptism.<P>According to the teaching of later Judaism, a stranger who desired to be adopted into the family of Israel was required, along with circumcision, to receive the rite of baptism as a means of cleansing from the ceremonial uncleanness attributed to him as a Gentile. While it is not possible to prove the priority of this practice of proselyte baptism to the baptism of John, there can be no doubt of the fact, for it is inconceivable, in view of Jewish prejudice, that it would be borrowed from John or after this time.<P>While it seems clear that in the use of the rite of baptism John was influenced by the Jewish customs of ceremonial washings and proselyte baptism, his baptism differed very essentially from these. The Levitical washings restored an unclean person to his former condition, but baptism was a preparation for a new condition. On the other hand, proselyte baptism was administered only to Gentiles, while John required baptism of all Jews. At the same time his baptism was very different from Christian baptism, as he himself declared (<a onClick="return mV(\'Luk\',3,16);">Lu 3:16</a>). His was a baptism of water only; a preparation for the baptism "in the Spirit" which was to follow. It is also to be observed that it was a rite complete in itself, and that it was offered to the nation as a preparation for a specific event, the advent of the Messiah.<P>We may say, then, that as a "baptism of repentance" it meant a renunciation of the past life; as a cleansing it symbolized the forgiveness of sins (<a onClick="return mV(\'Mar\',1,4);">Mr 1:4</a>), and as preparation it implied a promise of loyalty to the kingdom of the Messiah. We have no reason to believe that Jesus experienced any sense of sin or felt any need of repentance or forgiveness; but as a Divinely appointed preparation for the Messianic kingdom His submission to it was appropriate.<P>2. Baptism of Jesus:<P>While the multitudes flocked to the Jordan, Jesus came also to be baptized with the rest. "John would have hindered him, saying, I have need to be baptized of thee, and comest thou to me? But Jesus answering said unto him, Suffer it now: for thus it becometh us to fulfill all righteousness" (<a onClick="return mV(\'Mat\',3,\'13-15\');">Mt 3:13-15</a>). Wherein was this act a fulfillment of righteousness? We cannot believe that Jesus felt any need of repentance or change of life. May we not regard it rather as an identification of Himself with His people in the formal consecration of His life to the work of the kingdom?<P>VI. Imprisonment and Death.<P>1. The Time:<P>Neither the exact time of John\'s imprisonment nor the period of time between his imprisonment and his death can be determined. On the occasion of the unnamed feast of <a onClick="return mV(\'Jhn\',5,1);">Joh 5:1</a>, Jesus refers to John\'s witness as already past. At least, then, his arrest, if not his death, must have taken place prior to that incident, i.e. before the second Passover of Jesus\' ministry.<P>2. The Occasion:<P>According to the Gospel accounts, John was imprisoned because of his reproof of Herod\'s marriage with Herodias, the wife of his brother Philip (<a onClick="return mV(\'Luk\',3,19,20);">Lu 3:19,20</a>; compare <a onClick="return mV(\'Mat\',14,3,4);">Mt 14:3,4</a>; <a onClick="return mV(\'Mar\',6,17,18);">Mr 6:17,18</a>). Josephus says (Ant., XVIII, v, 2) that Herod was influenced to put John to death by the "fear lest his great influence over the people might put it in his power or inclination to raise a rebellion. Accordingly, he was sent a prisoner, out of Herod\'s suspicious temper, to Macherus, and was there put to death." This account of Josephus does not necessarily conflict with the tragic story of the Gospels. If Herod desired to punish or destroy him for the reasons assigned by the evangelists, he would doubtless wish to offer as the public reason some political charge, and the one named by Josephus would be near at hand.<P>VII. John and His Disciples.<P>1. The Inner Circle:<P>Frequent reference is made in the Gospel narrative to the disciples of John. As the multitudes crowded to his baptism, it was natural that he should gather about him an inner circle of men who should receive special instruction in the meaning of his work, and should aid him in the work of baptism, which must have soon increased beyond his power to perform alone. It was in the formation of this inner circle of immediate followers that he prepared a sure foundation for the work of the Messiah; for it was from this inner group that the disciples of Jesus were mainly drawn, and that with his consent and through his witness to the superior worth of the latter, and the temporary character of his own mission (<a onClick="return mV(\'Jhn\',1,\'29-44\');">Joh 1:29-44</a>).<P>2. Their Training:<P>Concerning the substance of their training, we know from the disciples of Jesus (<a onClick="return mV(\'Luk\',11,1);">Lu 11:1</a>) that it included forms of prayer, and from his own disciples (<a onClick="return mV(\'Mat\',9,14);">Mt 9:14</a>) we learn that frequent fastings were observed. We may be sure also that he taught them much concerning the Messiah and His work.<P>3. Their Fidelity:<P>There is abundant evidence of the great fidelity of these disciples to their master. This may be observed in their concern at the over-shadowing popularity of Jesus (<a onClick="return mV(\'Jhn\',3,26);">Joh 3:26</a>); in their loyalty to him in his imprisonment and in their reverent treatment of his body after his death (<a onClick="return mV(\'Mar\',6,29);">Mr 6:29</a>). That John\'s work was extensive and his influence lasting is shown by the fact that 20 years afterward Paul found in far-off Ephesus certain disciples, including Apollos, the learned Alexandrian Jew, who knew no other baptism than that of John (<a onClick="return mV(\'Act\',19,\'1-7\');">Ac 19:1-7</a>).<P>VIII. John and Jesus.<P>1. John\'s Relation to Jesus:<P>John assumed from the first the role of a herald preparing the way for the approaching Messianic age. He clearly regarded his work as Divinely appointed (<a onClick="return mV(\'Jhn\',1,33);">Joh 1:33</a>), but was well aware of his subordinate relation to the Messiah (<a onClick="return mV(\'Mar\',1,7);">Mr 1:7</a>) and of the temporary character of his mission (<a onClick="return mV(\'Jhn\',3,30);">Joh 3:30</a>). The Baptist\'s work was twofold. In his preaching he warned the nation of the true character of the new kingdom as a reign of righteousness, and by his call to repentance and baptism he prepared at least a few hearts for a sympathetic response to the call and teaching of Jesus. He also formally announced and bore frequent personal testimony to Jesus as the Messiah.<P>There is no necessary discrepancy between the synoptic account and that of the Fourth Gospel in reference to the progress of John\'s knowledge of the Messianic character of Jesus. According to <a onClick="return mV(\'Mat\',3,14);">Mt 3:14</a>, John is represented as declining at first to baptize Jesus because he was conscious of His superiority, while in <a onClick="return mV(\'Jhn\',1,\'29-34\');">Joh 1:29-34</a> he is represented as claiming not to have known Jesus until He was manifested by the heavenly sign. The latter may mean only that He was not known to him definitely as the Messiah until the promised sign was given.<P>The message which John sent to Jesus from prison seems strange to some in view of the signal testimonies which he had previously borne to His character. This need not indicate that he had lost faith in the Messiahship of Jesus, but rather a perplexity at the course of events. The inquiry may have been in the interest of the faith of his disciples or his own relief from misgivings due to Jesus\' delay in assuming the expected Messianic authority. John evidently held the prophetic view of a temporal Messianic kingdom, and some readjustment of view was necessary.<P>2. Jesus\' Estimate of John:<P>Jesus was no less frank in His appreciation of John. If praise may be measured by the worth of the one by whose lips it is spoken, then no man ever received such praise as he who was called by Jesus a shining light (<a onClick="return mV(\'Jhn\',5,35);">Joh 5:35</a>), more than a prophet (<a onClick="return mV(\'Mat\',11,9);">Mt 11:9</a>), and of whom He said, "Among them that are born of women there hath not arisen a greater than John the Baptist" (<a onClick="return mV(\'Mat\',11,11);">Mt 11:11</a>). If, on the other hand, He rated him as less than the least in the kingdom of heaven, this was a limitation of circumstances, not of worth.<P>Jesus paid high tribute to the Divine character and worth of John\'s baptism; first, by submitting to it Himself as a step in the fulfillment of all righteousness; later, by repeated utterance, especially in associating it with the birth of the Spirit as a necessary condition of inheriting eternal life (<a onClick="return mV(\'Jhn\',3,5);">Joh 3:5</a>); and, finally, in adopting baptism as a symbol of Christian discipleship.<P>LITERATURE.<P>The relative sections in the Gospel Commentaries, in the Lives of Christ, and the articles on John the Baptist in the several Bible dictionaries. There are a number of monographs which treat more minutely of details: W.C. Duncan, The Life, Character and Acts of John the Baptist, New York, 1853; Erich Haupt, Johannes der Taufer, Gutersloh, 1874; H. Kohler, Johannes der Taufer, Halle, 1884; R.C. Houghton, John the Baptist: His Life and Work, New York, 1889; H.R. Reynolds, John the Baptist, London, 1890; J. Feather, John the Baptist, Edinburgh, 1894; George Matheson in Representative Men of the New Testament, 24-66, Edinburgh, 1905; T. Innitzer, Johannes der Taufer, Vienna, 1908; A.T. Robertson, John the Loyal, New York, 1911.``121';
