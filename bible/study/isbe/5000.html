God\'s dealings, either with righteous or wicked. What then? Shall Wisdom go, or shall it rise to a higher level of outlook and insight?<P>3. Manhood in the Ore:<P>In some such dim inquiry as this, it would seem, Job goes on from where his friends sit silenced to figure some positive solution of things as they are. He begins with himself and his steadfastly held integrity, sealing his utterance by the solemn Hebrew oath (<a onClick="return mV(\'Job\',27,\'2-6\');">27:2-6</a>), and as solemnly disavowing all part or sympathy with the wicked (<a onClick="return mV(\'Job\',27,7);">27:7</a>; compare <a onClick="return mV(\'Job\',21,16);">21:16</a>). He has already found a meaning in his own searching experience; he is being tried for a sublime assay, in which all that is permanent and precious in him shall come out as gold (<a onClick="return mV(\'Job\',23,10);">23:10</a>). But this thought of manhood in the ore is no monopoly of his; it may hold for all. What then of the wicked? In a passage which some have deemed the lost third speech of Zophar (<a onClick="return mV(\'Job\',27,\'8-23\');">27:8-23</a>), and which, indeed, recounts what all the friends have seen (<a onClick="return mV(\'Job\',27,12);">27:12</a>), he sets forth the case of the wicked in its true light. The gist of it is that the wicked have not the joy of God (<a onClick="return mV(\'Job\',27,10);">27:10</a>), or the peace of a permanent hope. It is in much the same tone as the friends\' diatribes, but with a distinct advance from outward disaster toward tendency and futility. The ore is not being purged for a noble assay; and this will work their woe. Then finally, in the celebrated <a onClick="return mV(\'Job\',28,\'1-\');">Job 28</a>, comes up the summary of wisdom itself. That remains, after all this testing of motive, a thing intact and elemental; and man\'s part in it is just what Job\'s life has been, to fear God and shun evil (<a onClick="return mV(\'Job\',28,28);">28:28</a>).<P>4. Job Reads His Indictment:<P>As the crowning pronouncement on things as they are, Job in his final and longest speech, describes in a beautiful retrospect his past life, from his "autumn days" when the friendship of God was over his tent and he was a counselor and benefactor among men (<a onClick="return mV(\'Job\',29,\'1-\');">Job 29</a>), through this contrasted time of his wretchedness and curse-betraying disease, when the most degraded despise him (<a onClick="return mV(\'Job\',30,\'1-\');">Job 30</a>), until now as he draws consciously near the grave, he recounts in solemn review the principles and virtues that have guided his conduct—a noble summary of the highest Hebrew ideals of character (<a onClick="return mV(\'Job\',31,\'1-\');">Job 31</a>). This he calls, in sublime irony, the indictment which his Adversary has written; and like a prince, bearing it upon his shoulder and binding it to him like a crown, he is ready to take it with him beyond the bourn to the presence of his Judge. With this tremendous proposal, sanctioned Hebrew-fashion by a final curse if it prove false, the words of Job are ended.<P>E) The Denoucement:<P>The friends are silenced, not enlightened. They have clung to their hard thesis to the stubborn end; postulating enough overt crime on Job\'s part to kill him (<a onClick="return mV(\'Job\',22,\'5-9\');">Job 22:5-9</a>), and clinching their hypothesis with their theory of innate depravity (<a onClick="return mV(\'Job\',4,18,19);">Job 4:18,19</a>; <a onClick="return mV(\'Job\',15,14,15);">15:14,15</a>; <a onClick="return mV(\'Job\',25,\'4-6\');">25:4-6</a>) and spiritual hebetude (<a onClick="return mV(\'Job\',5,2);">Job 5:2</a>; <a onClick="return mV(\'Job\',15,26,27);">15:26,27</a>; <a onClick="return mV(\'Job\',22,10,11);">22:10,11</a>); but toward Job\'s higher level of honest integrity and exploring faith they have not advanced one inch; and here they lie, fossilized dogmatists, fixed and inveterate in their odium theologicum—a far cry from the friendship that came from afar to condole and console. Job, on the other hand, staking all on the issue of his integrity, has held on his way in sturdy consistency (compare <a onClick="return mV(\'Job\',17,9);">17:9</a>), and stood his ground before the enigma of things as they are. Both parties have said their say; the story is evidently ready for its denouement. Job, too, is ready for the determining word, though it would seem he expects it to be spoken only in some unseen tribunal; the friends rather savagely wish that God would speak and reprove Job for his presumption (compare <a onClick="return mV(\'Job\',11,5,11);">11:5,11</a>). But how shall the solution be brought about in this land of Uz where all may see? And above all, how shall it affect the parties concerned? A skillfully told story should not leave this out.<P>1. The Self-constituted Interpreter:<P>For this determining pronouncement the writer has chosen to have both parties definitely represented, apparently at their best. So, instead of proceeding at once to the summons from the whirlwind, he introduces here a new character, Elihu, a young man, who has listened with growing impatience to the fruitless discussion, and now must set both parties right or burst (<a onClick="return mV(\'Job\',32,19);">Job 32:19</a>). It is like the infusion of young blood into a theodicy too arrogant in its antiquity (compare <a onClick="return mV(\'Job\',8,\'8-10\');">Job 8:8-10</a>; <a onClick="return mV(\'Job\',15,10,19);">15:10,18</a>; <a onClick="return mV(\'Job\',12,12);">12:12</a> margin, or better as question). This character of Elihu is conceived in a spirit of satire, not without a dash of grim humor. His self-confidence, not to say conceit, is strongly accentuated (<a onClick="return mV(\'Job\',32,\'11-22\');">Job 32:11-22</a>); he assumes the umpire function for which Job has pleaded (<a onClick="return mV(\'Job\',33,6,7);">33:6,7</a>; compare <a onClick="return mV(\'Job\',9,33,34,35);">9:33-35</a>; <a onClick="return mV(\'Job\',13,20,21,22);">13:20-22</a>); and is sure he represents the perfect in knowledge (<a onClick="return mV(\'Job\',36,2,3,4);">36:2-4</a>; <a onClick="return mV(\'Job\',37,16);">37:16</a>). He speaks four times, addressing himself alternately to Job and the friends. His words, though designedly diffuse, are not without wisdom and beauty; he makes less of Job\'s deep-seated iniquity than do the friends, but blames him for speaking in the wicked man\'s idiom (<a onClick="return mV(\'Job\',34,7,8,9,36,37);">34:7-9,36,37</a>), and warns him against inclining more to iniquity than submission (<a onClick="return mV(\'Job\',36,21);">36:21</a>); but his positive contribution to the discussion is the view he holds of the chastening influence of dreams and visions (<a onClick="return mV(\'Job\',33,\'14-18\');">33:14-18</a>; compare <a onClick="return mV(\'Job\',7,13,14,15);">7:13-15</a>), and of the pains of disease (<a onClick="return mV(\'Job\',33,\'-28\');">33:19-28</a>), especially if the sufferer has an "angel (messenger) interpreter" to reveal its meaning, such a one perhaps as Elihu feels himself to be. As he proceeds in his speech, his words indicate that a storm is rising; and so long as it is distant he employs it to descant on the wonders of God in Nature, wonders which to him mean little more than arbitrary marvels of power; but as it approaches nearer and shows exceptional phenomena as of a theophany, his words become incoherent, and he breaks off with an abject attempt to disclaim his pretensions. Such is the effect, with him, of the near presence of God. It overwhelms, paralyzes, stops the presumptuous currents of life.<P>2. The Whirlwind and the Voice:<P>The writer of the book has not committed the literary fatuity of describing the whirlwind, except as Elihu has seen its oncoming, first with conceit of knowledge, then with wild access of terror—a description in which his essentially vapid personality is reflected. For the readers the significance of the whirlwind is in the Voice it encloses, the thing it says. And here the writer has undertaken the most tremendous task ever attempted by the human imagination: to make the Almighty speak, and speak in character. And one fatuity at least he has escaped; he has not made God bandy arguments with men, or piece together the shifting premises of logic. The whole of the two discourses from the whirlwind is descriptive; a recounting of observable phenomena of created nature, from the great elemental things, earth and sea and light and star and storm, to the varied wonders of animal nature—all things in which the questing mind of man may share, laying hold in his degree on its meaning or mystery. Thus, as a sheer literary personation, it fails at no point of the Godlike. It begins with a peremptory dismissal of Elihu: "Who is this that darkeneth counsel by words without knowledge?" (<a onClick="return mV(\'Job\',38,2);">Job 38:2</a>). Then Job is bidden gird up his loins like a strong man, and listen and answer. The fact that Job alone, of all the company, can stand, as it were, on common terms with God is premonitory of the outcome. Of the two Divine discourses, the first (<a onClick="return mV(\'Job\',38,\'1-\');">Job 38</a>; <a onClick="return mV(\'Job\',39,\'1-\');">39</a>) emphasizes more especially the unsearchable wisdom of creation; and the lesson it brings home to Job is that a being who is great enough—or presumptuous enough—to criticize and censure is great enough to resolve his own criticism (<a onClick="return mV(\'Job\',40,2);">40:2</a>). To this, of course, Job has no answer; he has presented his plea, which he neither adds to nor takes back (<a onClick="return mV(\'Job\',40,3,4,5);">40:3-5</a>). Resuming, then, the Voice in the second discourse (<a onClick="return mV(\'Job\',40,\'6-\');">40:6</a>-<a onClick="return mV(\'Job\',41,\'1-34\');">41:34</a>) goes on to describe two great beasts, as it were, elemental monsters of Nature: Behemoth—probably the hippopotamus—vast in resisting and overcoming power, yet unaware of it, and easily subduable by man; and Leviathan—probably the crocodile—a wonder of beautiful adaptedness to its function in Nature, yet utterly malignant, unsubduable, untamable. And the lesson brought home to Job by this strange distribution of creative power is that he, who has called in question God\'s right to work as He does, had better undertake to lower human pride and "tread down the wicked where they stand" (<a onClick="return mV(\'Job\',40,12);">40:12</a>), thus demonstrating his ability to save himself and manage mankind (<a onClick="return mV(\'Job\',40,14);">40:14</a>). By this illuminating thought Job\'s trenchancy of demand is utterly melted away into contrition and penitence (<a onClick="return mV(\'Job\',42,\'1-6\');">42:1-6</a>); but one inspiring effect is his, the thing indeed which he has persistently sought (compare <a onClick="return mV(\'Job\',23,3);">23:3</a>): God is no more a hearsay, such as the friends have defended and his Wisdom has speculated about; his eye sees Him here on earth, and in his still unremoved affliction, no stranger, but a wise and communable Friend, just as his confident faith had pictured he would, in some embodied sphere beyond suffering (<a onClick="return mV(\'Job\',19,27);">19:27</a>).<P>3. The Thing That Is Right:<P>Two of the parties in the story have met the august theophany, and it has wrought its effect on them according to the spirit of the man. The self-constituted interpreter, Elihu, has collapsed as suddenly as he swelled up and exhibited himself. The man of integrity, Job, has reached the beatific goal of his quest. What now of the friends who came from far to confirm their Wisdom, and who were so sure they were defending the mind of God? they are not left without a sufficing word, addressed straight to their spokesman Eliphaz (<a onClick="return mV(\'Job\',42,7);">Job 42:7</a>); but their way to light is through the man whose honesty they outraged. Eliphaz\' closing words had promised mediatorial power to Job if he would return from iniquity and acquaint himself with God (<a onClick="return mV(\'Job\',22,30);">22:30</a>); Job is now the mediator, though he has held consistently to the terms they reprobated. And the Divine verdict on them is: "Ye have not spoken of me the thing that is right, as my servant Job hath" (<a onClick="return mV(\'Job\',42,7);">42:7</a>). These are the words of the Being who acknowledged that in permitting this whole trial He was \'swallowing Job up causelessly\' (<a onClick="return mV(\'Job\',2,3);">2:3</a>). Job\'s honest and immensely revelatory words, anger, remonstrance, bold arraignment of God\'s way and all, were "the thing that is right." There is no more tremendous Divine pronouncement in all Scripture than this.<P>4. The Restored Situation:<P>Here certain myopic students of the Book of Job think the story should end. It offends them, apparently, to see Satan\'s work undone; if they had had the making of the story they would have left Job still suffering, as if disinterested virtue could not be its own reward without it. The author, at least the final author, evidently did not think so; in the ideals and sanctions that prevailed in his age he knew better what he was about. It is not my business to cut the book to modern pattern, but to note what is there. Job is restored to health, to double his former wealth, to family and honor and a ripe old age. These were what the friends predicted for him on condition of his owning to guilt and calling injustice desert; but in no word of his has he intimated that worldly reinstatement was his wish or his object, the contrary rather. And what he sought he obtained, in richer measure than he sought; obtained it still in suffering, and on earth, "in the place where may see" (compare <a onClick="return mV(\'Job\',34,26);">34:26</a> margin). It is no discount to the value of this, nor on the other hand is it an essential addition, to express it not only in spiritual terms, but in terms current among men. And one fundamental thing this restored situation shows, or at least takes for granted, namely, that the quarrel has not been with Wisdom itself, its essence or its sanctions, but only with its encroaching false motive. Deepened, not invaded, its Newtonian law that it is well with the righteous, ill with the wicked, remains intact, an external sanction to live by, in spite of temporal exceptions. A spiritual principle of great significance, too, seems to be indicated, as it were, furtively, in the words, "And Yahweh turned the captivity of Job, when he prayed for his friends." He had stood on his integrity demanding his right, and became a self-loathing penitent; out of dust and ashes he prayed for his friends, and became again such a power in health and wealth as he had been in his "autumn days."<P>IV. The Problem and the Purpose.<P>1. Beyond the Didactic Tether:<P>If the foregoing section has rightly shown that the main thrust and interest of the Book of Job lies not in its debate but in its narrative, we have therein the best clue to its problem and its purpose. The sublime self-portrayal of a man who held fast his integrity against God and man and death and darkness tells its own story and teaches its own lesson, beyond the power of didactic propositions or deductions to compass. The book is not a sermon but a vital, throbbing uprising of the human spirit. It is warm with the life of sound manhood; the inner life with its hopes, its doubts, its convictions, its supreme affiance; to impose on this any tether of didacticism is to chili its spirit and make it dogmatic and academic. The reading of its problem which mainly holds the field today is expressed in the question, "Why does God afflict the righteous?" and so the book is resolved into a theodicy, a justification of God\'s ways with man. Well the friends of Job do their best to make their interpretation a theodicy, even outraging palpable fact to do it; they monopolize the didactic element of the poem; but their chief contention is that God does not afflict the righteous but the wicked, and that Job is a flagrant case in point who adds rebellion to his sin (compare <a onClick="return mV(\'Job\',34,37);">34:37</a>). Job does not know why God afflicts the righteous; he only knows that it is a grievous fact, which to him seems utterly un-Godlike. God knows, undoubtedly, but He does not tell. Yet all the while an answer to the question is shaping itself in personality, in intrinsic manhood, in the sturdy truth and loyalty of Job\'s spirit. So, going beyond the didactic tether, we may say that in a deeper sense God is justified after all; if such a result of desperate trial is possible in man, it is worth all the rigor of the experiment. But it is as truly an anthropodicy (excuse the word!) as a theodicy; it puts the essential man on a plane above all that Satan can prove by his lying sneers of self-interest, or the friends\' poisoning of the wells by their theory of natural depravity. It comes back after all to the story of Job; he lives the answer to the problem, his personality is the teaching.<P>2. What Comes of Limiting the Purpose:<P>It is from this point of view that we can best judge of the critical attacks that have been made on the structure and coherence of the Book of Job. The book has suffered its full share of negative disintegration at the hands of the critics; mostly subjective it seems to me, coming from a too restricted view of its problem and purpose, or from lack of that long patient induction which will not be content until it sees all the elements of its creative idea in fitting order and proportion. To limit the purpose to the issue of a debated theodicy, is to put some parts in precarious tenure; accordingly, there are those to whom the Epilogue seems a superfluity, the Prologue an afterthought, <a onClick="return mV(\'Job\',28,\'1-\');">Job 28</a> a fugitive poem put in to fill up—not to go on to still more radical excisions. On the score of regularity of structure, too, this limitation of design has had equally grave results. Elihu has perhaps fared the worst. He must go, the critics almost universally say, because forsooth he was not formally introduced in the Prologue; and naturally enough, as soon as he has received notice to quit, the language which in one view fits him so dramatically to his part begins to bristle with Aramaisms (\'of the kindred of Ram,\' <a onClick="return mV(\'Job\',32,2);">32:2</a>) and strange locutions, the alleged marks of a later bungling hand. Then, further, Zophar must needs round out the mechanical three-times-three of structure by coming up the third time; accordingly, Job is levied upon to contribute some of his words (<a onClick="return mV(\'Job\',27,\'13-23\');">27:13-23</a>) to help him out. I need not go into further detail. The foregoing section has done something, I hope, to justify my conviction that the book has a homogeneous design and structure just as it is. Whatever its vicissitudes since the first draft was made, it may turn out after all that the last edition is the best.<P>3. The Book\'s Own Import of Purpose:<P>We are not left in the dark as to the large purpose of the Book of Job, if we will follow its own indications consistently. Satan\'s question at the beginning, "Doth Job fear God for nought?" sets us on the track of it. To give that question a Godlike and not a Satanic answer, to prove in the person of Job That man has it in him to make his life an unbought loyalty to the Divine, is a purpose large enough to include many subsidiary purposes. But behind this appears, on the part of the author, a purpose which relates his story intimately to the intellectual tendencies of his day. The book embodies, especially in theories of the friends, a searching epitome of the status to which the wisdom philosophy of his time had arrived. That philosophy was a nobly founded theory of life; Job himself had been and continued (compare <a onClick="return mV(\'Job\',28,28);">28:28</a>) thoroughly at one with it. Soundly identified with righteousness and piety, Wisdom had in religious idiom defined the elements of right and wrong living, and had in no uncertain terms fixed its sanctions of reward and penalty. But from a warm, pulsating life it had become an orthodoxy. Its rigid world had room for only two classes of men: the righteous, bound for the sure rewards of life; the wicked, bound for sure failure and destruction. It brooked no real exception to this austere law of being. But two grave evils were invading its system. One was its hard blindness to facts, or, what is as bad, its determination at all hazards to explain them away. From the psalms of the period (compare e.g. <a onClick="return mV(\'Psa\',37,\'1-\');">Psalms 37</a>; <a onClick="return mV(\'Psa\',49,\'1-\');">49</a>; <a onClick="return mV(\'Psa\',73,\'1-\');">73</a>) we can see how the evident happiness and prosperity of the wicked was troubling devout minds. The other was that under this prevailing philosophy life was becoming too cold-blooded and calculable a thing, a virtual feeder of self-interest. The doubt lay very near whether conduct so sanctioned was a thing intrinsic and sincere or a thing bought and sold. This equivocal state of things could not long endure. Sooner or later Satan\'s question of motive must stab it to the heart; and we may be sure that to the author of the book the impulse to ask the question was not all Satanic. The interests of true wisdom, no less than of skepticism, demanded that the question of inner motive be raised and solved. Nay, Yahweh Himself, whom Satan mocked as abettor of the situation, was on trial. Have we not material here, then, for a sublime purpose, a mighty epic of test and trial and victory? Out of it, not Job alone, but Wisdom must emerge purified, enlightened, spiritualized.<P>4. Problem of the Intrinsic Man:<P>So much for the purpose of the book. The problem corresponds to it. If we take it as the baffling problem of suffering, or more specifically why God afflicts the righteous, the sufficing answer is, Job is why. To give such essential integrity as his its ultimate proof and occasion is worth the injustice and the unmerited pain. In other words, the problem is more deeply concerned with man\'s intrinsic nature than with God\'s mysterious dealings. When God created man in His own image, did He endow him most fundamentally with the spirit of commercialism, or with the spirit of unbought loyalty to the Godlike? And when created man was made fallible and mortal, did that mean an inescapable inherent depravity, or was the potency of noblest manhood still left at the center of his being? Here again Job is the embodied answer. The friends, veritable Calvinists before Calvin, urge depravity; they would exalt God by making man His utter contrast. But Job\'s stedfast integrity proves that man, one man at least, is at heart sound and true. And if one man, then the potency of soundness exists in manhood. The book is indeed a theodicy; but still more truly it is a boldly maintained anthropodicy, a vindication of the intrinsic worth of man.<P>V. Considerations of Age and Setting.<P>1. Shadowy Contacts with History:<P>The questions who was the personal author of the Book of Job, and what was its age, are at best only a matter of conjecture; and my revised conjecture, arrived at since I wrote my Epic of the Inner Life, must go for what it is worth. It seems to me much better to regard a story so homogeneous and interrelated as in the main the composition of one mind than to distribute it, as some critics do, among various authors, supplementers, and editors. As to its age, there is so little identifiable contact with political or ecclesiastical history that its composition has been ascribed to many periods, from the time of Abraham to late in post-exilic times. The fact that its scene is laid in the patriarchal past and in a land outside of Palestine indicates the author\'s design to dissociate it from contemporary events and conditions; such contact with these as exist, therefore, must be read between the lines. The book does not hold with full consistency to patriarchal conditions. Job\'s friends appeal with the complacency of wisdom-prospered men to the ancient tenure of the land (<a onClick="return mV(\'Job\',15,19);">15:19</a>); and yet, as Job complains, the heartless greed of the landholding class in removing landmarks and oppressing the poor (<a onClick="return mV(\'Job\',24,\'2-12\');">24:2-12</a>) connotes the prevalence of such outrages as were denounced by Isaiah and Micah before the Assyrian crisis. Such evils would not decrease under Manasseh and Jehoiakim, and might well be portrayed in reminiscence by an exilic writer. On the top of this consideration may be cited the most definite reference to a historical event that the book contains: the passage <a onClick="return mV(\'Job\',12,\'17-25\');">Job 12:17-25</a>, which vividly describes, by an eyewitness ("Lo, mine eye hath seen all this," <a onClick="return mV(\'Job\',13,1);">13:1</a>), a wholesale deportation and humiliation of eminent persons, just like that told of Jehoiachin and his court in <a onClick="return mV(\'2Ki\',24,\'13-15\');">2Ki 24:13-15</a>. To my mind this is illuminative for the age of the book. It seems to have been written by one who saw the Chaldean deportation of 587 BC. May I be suffered to carry the suggestion a step farther? It will be remembered that the chief personage of that deportation was for 37 years a state prisoner in Babylon, at the end of which time he was "taken from durance and judgment" (compare <a onClick="return mV(\'Isa\',53,8);">Isa 53:8</a> the King James Version) and lived thenceforth honored with kings (<a onClick="return mV(\'2Ki\',25,\'27-30\');">2Ki 25:27-30</a> = <a onClick="return mV(\'Jer\',52,\'31-34\');">Jer 52:31-34</a>). I take him to have been the original of the individualized Servant of Yahweh described and describing himself in Second Isaiah. In one of his self-descriptions he says that Yahweh has given him "the tongue of them that are taught" (<a onClick="return mV(\'Isa\',50,4);">Isa 50:4</a>); in another that Yahweh has made his "mouth like a sharp sword" and himself "a polished shaft" (<a onClick="return mV(\'Isa\',49,2);">Isa 49:2</a>). What he said or wrote is of course unidentifiable; but it is certain that in some cultural way he was a hidden power for good to his people. What if this Book of Job were a prison-made book, like Pilgrim\'s Progress and Don Quixote, but as much greater as the experience that underlay it was more momentous? I do not see but this suggestion is as probable as any that have been made; and some expressions of the book become thereby very striking, as for instance, the reference to prisoners (<a onClick="return mV(\'Job\',3,118,19);">3:18,19</a>), to the servant longing for release (<a onClick="return mV(\'Job\',7,2);">7:2</a>), the general sense of being despised, the several references to Job as "my servant Job" (<a onClick="return mV(\'Job\',1,8);">1:8</a>; <a onClick="return mV(\'Job\',2,3);">2:3</a>; <a onClick="return mV(\'Job\',42,7,8);">42:7,8</a>), the description of his restoration as a turned captivity, and his successful intercession for the friends (<a onClick="return mV(\'Job\',42,10);">42:10</a>; compare <a onClick="return mV(\'Isa\',53,12);">Isa 53:12</a>). I would merely suggest the idea, however, not press it.<P>2. Place in Biblical Literature:<P>If the Book of Job is a product of the time of Jehoiachin\'s imprisonment, it is in worthy and congenial literary company. Isaiah, fostering the faith of a new-born spiritual "remnant," had gathered the elements of that sublime vision (<a onClick="return mV(\'Isa\',1,1);">Isa 1:1</a>) of Israel\'s mission among the nations which a later hand was even now, four generations after, working to supplement and finish, in a prophecy (<a onClick="return mV(\'Isa\',40,\'1-\';">Isa 40:1-66:24</a>) which, as all recognize, constitutes the closest parallel in spirited idea to our book. Seers, priests and singers had long busied themselves with the literary treasures of the past; drawing out of dusty archives and putting into popular idiom the ancient laws and counsels of Moses (Deuteronomy; see under <a href="./study/isbe/search.html?string=JOSIAH">JOSIAH</a>); Collecting and adapting the old Davidic psalms and composing new ones, as Hezekiah\'s reorganization of the worship required. Ezekiel was at Tel Abib planning for the reconstruction of the temple, and perhaps by his use of the name "Job" veiling a cryptic reference (<a onClick="return mV(\'Eze\',14,14,20);">Eze 14:14,20</a>). The affiliations of the Book of Job, however, were more specifically, with the wisdom literature; and long before this the "men of Hezekiah" (<a onClick="return mV(\'Pro\',25,1);">Pr 25:1</a>) had gathered their aftermath of the Solomonic proverbs, to supplement the maxims which had been the educative pabulum of the people (see under <a href="./study/isbe/search.html?string=PROVERBS,+THE+BOOK+OF">PROVERBS, THE BOOK OF</a>). It was with the care and principle of this diffused instruction, now the most popular vein of literature, that the Book of Job concerned itself. That had become apparent as soon as the maxims were coordinated in an anthology, and an introduction to the collection had been composed, extolling Wisdom as the guide and savior of life. To a spiritually-minded thinker with the Hebrew genius for religion the motivation of Wisdom must sooner or later come. With its values should be apprehended also its unguarded points and tendencies. It was exposed to the one-sided drift of all popular things. In an age when revision and deeper insight were the literary order of the day, Wisdom would come in with the other strains of literature for purification and maturing; and there was not wanting an experience, the basis of an almost unbelievable report (compare <a onClick="return mV(\'Isa\',53,1);">Isa 53:1</a>) to give depth and poignancy to Job\'s personal story of suffering and integrity.<P>3. Parallels and Echoes:<P>In the amazing sureness and vigor. of its message the Book of Job stands out unique and alone; but it is by no means without its lesser parallels in faith and doubt, above which it rises like a mountain above its retinue of foothills. Mention has been made above of a number of Psalms (e.g. <a onClick="return mV(\'Psa\',37,\'1-\');">37</a>; <a onClick="return mV(\'Psa\',49,\'1-\');">49</a>; <a onClick="return mV(\'Psa\',73,\'1-\');">73</a>) which with different degrees of assurance witness to the struggle of faith with the problem of the rampant and successful wicked. <a onClick="return mV(\'Psa\',49,\'1-\');">Ps 49</a>, one of the psalms of the sons of Korah, is especially noteworthy, because it expressly employs the popular mashal, that is, the Wisdom vehicle, to convey a corrective lesson about unblest riches, drawing a conclusion not unlike that of <a onClick="return mV(\'Job\',27,\'8-23\');">Job 27:8-23</a>, though in milder tone. Not less noteworthy also is the note of suffering and its mysteriousness which pervades many of the psalms, especially of Asaph and Heman; <a onClick="return mV(\'Psa\',88,\'1-\');">Psalms 88</a> and <a onClick="return mV(\'Psa\',102,\'1-\');">102</a> might both have been composed with special reference to Hezekiah\'s sickness and set beside his psalm in <a onClick="return mV(\'Isa\',38,\'1-\');">Isa 38</a>, but also they are so fully in the tone of Job\'s complaint, especially <a onClick="return mV(\'Psa\',88,\'1-\');">Ps 88</a>, that Professor Godet, not unplausibly, conjectures that the Book of Job was written by its author Heman. Hezekiah\'s deadly sickness itself (<a onClick="return mV(\'Isa\',38,\'1-\');">Isa 38</a>), which was of a leprous nature, banishing him from the house of God, and which was miraculously healed—an experience regarding which Hezekiah\'s own writing (<a onClick="return mV(\'Isa\',38,\'10-20\');">Isa 38:10-20</a>) is strikingly in the key of Job\'s complaint—furnishes the nearest parallel to, or adumbration of, Job\'s affliction; but also in the accounts of the Servant of Yahweh there are hints of a similar stroke of God\'s judgment (compare <a onClick="return mV(\'Isa\',52,14);">Isa 52:14</a>; <a onClick="return mV(\'Isa\',53,3);">53:3</a>). The passage <a onClick="return mV(\'Job\',7,17,18);">Job 7:17,18</a> has been called "a bitter parody" of <a onClick="return mV(\'Psa\',8,4);">Ps 8:4</a>; it may be so, but the conditions are in utter contrast, and nothing can be concluded as to which is original and which echo. As to expression, the most remarkable parallel to Job, perhaps, is the passage <a onClick="return mV(\'Jer\',20,\'14-18\');">Jer 20:14-18</a>, in which, like Job, the prophet Jeremiah curses the day of his birth. This curse in Job would naturally be remembered by all readers as one of the most characteristic features of the book; and in like manner the curse in Jeremiah may have stood out in the memory of his disciples, of whom the writer of Job may have been one, and figure in a similar literary situation. Ezekiel\'s naming of Job along with Noah and Daniel (<a onClick="return mV(\'Eze\',14,14,20);">Eze 14:14,20</a>), as a type of atoning righteousness, is doubly remarkable if the writer of Job was a contemporary; he may have taken the name from a well-known legend, and there may have underlain it a double meaning, known to an inner circle, referring cryptically to one whose real name it might be impolitic to pronounce. Whenever written, the outline and meaning of Job\'s momentous experience must have won speedily to a permanent place in the universal Hebrew memory; so that centuries afterward James could write to the twelve tribes scattered abroad (<a onClick="return mV(\'Jam\',5,11);">5:11</a>), "Ye have heard of the patience of Job, and have seen the end of the Lord."<P>LITERATURE.<P>A.B. Davidson, "The Book or Job" (Cambridge Bible for Schools), 1884; A.S. Peake, "Job" (New Century Bible), 1905; S.R. Driver, The Book of Job in the Revised Version, 1906; J. T. Marshall, The Book of Job, 1904; J.F. Genung, Epic of the Inner Life, 1891; G.G. Bradley, Lectures on Job in Westminster Abbey, 1887; F.C. Cook in The Speaker\'s Commentary, 1882. Among German writers, A. Dillmann, Hiob erklart, 1891; K. Budde, Das Buch Hiob ubersetzt und erklart, 1896 (see The Expositor T, VIII, iii); B. Duhm, Das Buch Hiob erklart, 1897; G. Beer, Der text des Buches Hiob untersucht, 1897; Gibson, "The Book of Job" (Oxford Commentaries), 1899.``66';

isbe[5081]='Jobab`jo\'-bab (yobhabh, perhaps "howling"; Iobab):<P>(1) "Son" of Joktan (<a onClick="return mV(\'Gen\',10,29);">Ge 10:29</a>; <a onClick="return mV(\'1Ch\',1,23);">1Ch 1:23</a>).<P>See <a href="./study/isbe/search.html?string=TABLE+OF+NATIONS">TABLE OF NATIONS</a>.<P>(2) An Edomite king (<a onClick="return mV(\'Gen\',36,33,34);">Ge 36:33,34</a>; <a onClick="return mV(\'1Ch\',1,44,45);">1Ch 1:44,45</a>).<P>(3) King of Madon (<a onClick="return mV(\'Jos\',11,1);">Jos 11:1</a>).<P>(4) <a onClick="return mV(\'1Ch\',8,9);">1Ch 8:9</a>; and (5) <a onClick="return mV(\'1Ch\',8,18);">1Ch 8:18</a>, Benjamites.<P>The name is confused with that of Job in Septuagint of <a onClick="return mV(\'Job\',42,17);">Job 42:17</a>.``1';

isbe[5086]='Joel (1)`jo\'-el (yo\'el, popularly interpreted as "Yahweh is God"; but see HPN, 153; BDB, 222a):<P>(1) The firstborn of Samuel (<a onClick="return mV(\'1Sa\',8,2);">1Sa 8:2</a>; <a onClick="return mV(\'1Ch\',6,33);">1Ch 6:33</a>), and supplied in the Revised Version (British and American) of <a onClick="return mV(\'1Ch\',6,28);">1Ch 6:28</a>, correctly).<P>(2) A Simeonite prince (<a onClick="return mV(\'1Ch\',4,35);">1Ch 4:35</a>).<p>(3) A Reubenite chief (<a onClick="return mV(\'1Ch\',5,4,8);">1Ch 5:4,8</a>).<P>(4) A Gadite chief, perhaps the same as (3) (<a onClick="return mV(\'1Ch\',5,12);">1Ch 5:12</a>). He might be the chief of "a family or clan whose members might be reckoned as belonging to either or both of the tribes" (Curtis, Chronicles, 122).<P>(5) A Levite ancestor of Samuel (<a onClick="return mV(\'1Ch\',6,36);">1Ch 6:36</a>), called "Shaul" in <a onClick="return mV(\'1Ch\',6,24);">6:24 (Hebrew 9)</a>).<P>(6) A chief of Issachar (<a onClick="return mV(\'1Ch\',7,3);">1Ch 7:3</a>).<P>(7) One of David\'s mighty men (<a onClick="return mV(\'1Ch\',11,38);">1Ch 11:38</a>), brother of Nathan. <a onClick="return mV(\'2Sa\',23,36);">2Sa 23:36</a> has "Igal son of Nathan," and the Septuagint\'s Codex Vaticanus has "son" in 1 Chronicles, a reading which Curtis adopts.<P>See <a href="./study/isbe/search.html?string=IGAL">IGAL</a>.<P>(8) A Levite (<a onClick="return mV(\'1Ch\',15,7,11,17);">1Ch 15:7,11,17</a>), probably the Joel of <a onClick="return mV(\'1Ch\',23,8);">1Ch 23:8</a> and <a onClick="return mV(\'1Ch\',26,22);">26:22</a>.<P>(9) David\'s tribal chief over half of Manasseh (<a onClick="return mV(\'1Ch\',27,20);">1Ch 27:20</a>).<P>(10) A Levite of Hezekiah\'s time (<a onClick="return mV(\'2Ch\',29,12);">2Ch 29:12</a>).<P>(11) One of those who had married foreign wives (<a onClick="return mV(\'Ezr\',10,43);">Ezr 10:43</a>) = "Juel" of 1Esdras 9:35.<P>(12) A Benjamite "overseer" in Jerusalem (<a onClick="return mV(\'Neh\',11,9);">Ne 11:9</a>).<P>(13) Ioel, the prophet (<a onClick="return mV(\'Joe\',1,1);">Joe 1:1</a>; <a onClick="return mV(\'Act\',2,16);">Ac 2:16</a>).`<a href="./study/isbe/search.html?string=JOEL+2">JOEL 2</a>`149';
isbe[5087]='Joel (2)`(yo\'el; Ioel):<P><b>I. THE PROPHET</b><P><b>II. THE BOOK</b><P class="in15">1. Literary Form<P class="in15">2. Outline of Contents<P class="in15">3. Interpretation<P class="in30">(1) Literal<P class="in30">(2) Allegorical<P class="in15">4. Indications of Date<P class="in30">(1) Place in the Canon<P class="in30">(2) Language and Style<P class="in30">(3) Quotations<P class="in30">(4) The Situation<P class="in45">(a) Political<P class="in45">(b) Religious<P class="in45">(c) Ritualistic<P class="in30">(5) Foreign Nations Mentioned or Omitted<P class="in30">(6) Some Notable Expressions<P class="in15">5. View of Professor Merx<P class="in15">6. Connections with the New Testament<p><b>LITERATURE</b><hr /><P>I. The Prophet.<P>The Book of Joel stands second in the collection of the twelve Prophets in the Hebrew Canon. The name (yo\'el), meaning "Yahweh is God," seems to have been common, as we find a dozen other persons bearing it at various periods of the Biblical history. Beyond the fact that he was the son of Pethuel, there is no intimation in the book as to his native place, date, or personal history; nor is he mentioned in any other part of the Old Testament; so that any information on these points must be matter of inference, and the consideration of them must follow some examination of the book itself.<P>II. The Book.<P>1. Literary Form:<P>This takes largely the form of addresses, the occasion and scope of which have to be gathered from the contents. There is no narrative, properly so called, except at one place (<a onClick="return mV(\'Joe\',2,18);">Joe 2:18</a>), "Then was Yahweh jealous for his land," etc., and even there the narrative form is not continued. Yet, though the earlier portions at least may be the transcript of actual addresses in which the speaker had his audience before him, this would not apply to the later portions, in which also the direct address is still maintained (e.g. <a onClick="return mV(\'Joe\',3,11);">Joe 3:11</a>, "Haste ye, and come, all ye nations round about"). This form of direct address is, indeed, characteristic of the style throughout (e.g. <a onClick="return mV(\'Joe\',2,21);">Joe 2:21</a>; <a onClick="return mV(\'Joe\',3,4,9,13);">3:4,9,13</a>). There is this also to be said of its literary character, that "the style of Joel is bright and flowing," his "imagery and language are fine" (Driver, LOT); "his book is a description, clear, well arranged, and carried out with taste and vivacity, of the present distress and of the ideal future. Joel may be reckoned among the classics of Hebrew literature. The need of a commentary for details, as is the case with Amos and Hosea, is here hardly felt" (Reuss, Das Altes Testament).<P>2. Outline of Contents:<P>The book in the original consists of 4 chapters, which, however, are in our version reduced to 3, by making the portion which constitutes chapter 3 in the Hebrew the concluding portion (<a onClick="return mV(\'Joe\',2,\'28-32\');">2:28-32</a>) of chapter 2. The book begins in gloom, and its close is bright. Up to <a onClick="return mV(\'Joe\',2,18);">Joe 2:18</a> there is some great trouble or a succession of troubles culminating at <a onClick="return mV(\'Joe\',2,\'28-32\');">2:28-32</A> (<a onClick="return mV(\'Joe\',3,\'1-\');">Joe 3</a> in Hebrew). And the concluding portion, <a onClick="return mV(\'Joe\',3,\'1-\');">Joe 3 (Joe 4 in Hebrew)</a>, in which the prophet projects his view into futurity, begins with judgment but ends with final blessedness. There is a progression in the thought, rising from the solid, sorely smitten earth to a region ethereal, and the stages of advance are marked by sudden, sharp calls (<a onClick="return mV(\'Joe\',1,2,14);">1:2,14</a>; <a onClick="return mV(\'Joe\',3,9);">3:9</a>), or by the blasts of the trumpet which prelude the shifting scenes (<a onClick="return mV(\'Joe\',2,1,15);">2:1,15</a>).<P><a onClick="return mV(\'Joe\',1,\'1-\');">Joe 1</a> begins with an address, sharp and peremptory, in which the oldest inhabitant is appealed to whether such a calamity as the present has ever been experienced, and all are called to take note so that the record of it may be handed down to remotest posterity. The land has suffered from a succession of disasters, the greatest that could befall an agricultural country, drought and locusts. The two are in fact inextricably connected, and the features of both are mixed up in the description of their effects. The extent of the disaster is vividly depicted by the singling out of the classes on whom the calamity has fallen, the drinkers of wine, the priests,<P>the vine-dressers, the husbandmen; and, toward the close of the chapter, the lower animals are pathetically introduced as making their mute appeal to heaven for succor (<a onClick="return mV(\'Joe\',1,18,19,20);">1:18-20</a>). Specially to be noted is the manner in which the priests are introduced (<a onClick="return mV(\'Joe\',1,9);">1:9</a>), and how with them is associated the climax of the affliction. The prophet had just said "my land" (<a onClick="return mV(\'Joe\',1,6);">1:6</a>), "my vine" and "my fig-tree" (<a onClick="return mV(\'Joe\',1,7);">1:7</a>); and, though many modern expositors take the pronoun as referring to the nation or people, it would appear more appropriate, since the people is objectively addressed, to regard the prophet as identifying himself with the God in whose name he is speaking. And then the transition to <a onClick="return mV(\'Joe\',1,8);">Joe 1:8</a> becomes intelligible, in which certainly the land is personified as a female: "Lament like a virgin girded with sackcloth for the husband of her youth." The underlying idea seems to be the conception of the land as Yahweh\'s and of Yahweh as the ba\'al "lord," or husband of people and land. This is the idea so much in evidence in the Book of Hosea, and so much perverted by the people whom he addressed, who ascribed their corn (grain) and wine and oil to the Canaanite Baals. The idea in its purer form is found in the "land Beulah," "married land" (<a onClick="return mV(\'Isa\',62,4,5);">Isa 62:4,5</a>). If it was this that was in Joel\'s mind, the mention of the priests comes naturally. The products of the land were Yahweh\'s gifts, and the acknowledgment of His lordship was made by offerings of the produce laid on His altar. But if nothing was given, nothing could be offered; the "cutting off" of the meal and drink offerings was the mark of the widowhood and destitution of the land. Hence, the pathetic longing (<a onClick="return mV(\'Joe\',2,14);">Joe 2:14</a>) that at least so much may be left as to assure the famished land that the supreme calamity, the loss of God, has not fallen. Thus the visitation is set in a religious light: the graphic description is more than a poetic picture. It is the Lord\'s land that is wasted; hence, the summons (<a onClick="return mV(\'Joe\',1,14);">Joe 1:14</a>) to "cry unto Yahweh," and in the verses that follow the supplication by man and beast for deliverance.<P><a onClick="return mV(\'Joe\',2,\'1-17\');">Joe 2 up to verse 17</a> seems to go over the same ground as <a onClick="return mV(\'Joe\',1,\'1-\');">Joe 1</a>, and it has also two parts parallel respectively to two parts of that chapter: <a onClick="return mV(\'Joe\',2,\'1-11\');">2:1-11</A> is parallel to <a onClick="return mV(\'Joe\',1,\'2-12\');">1:2-12</A>, and <a onClick="return mV(\'Joe\',2,\'12-17\');">2:12-17</a> to <a onClick="return mV(\'Joe\',1,\'13-20\');">1:13-20</a>. The former part in both cases is chiefly descriptive of the calamity, while the latter part is more hortatory. Yet there is an advance; for, whereas in <a onClick="return mV(\'Joe\',1,\'2-12\');">1:2-12</a> the attention is fixed on the devastation, in <a onClick="return mV(\'Joe\',2,\'1-11\');">2:1-11</A> it is the devastator, the locust, that is particularly described; also, in <a onClick="return mV(\'Joe\',2,\'12-17\');">2:12-17</a> the tone is more intensely religious: "Rend your heart, and not your garments" (<a onClick="return mV(\'Joe\',2,13);">2:13</A>). Finally it is to be noted that it is at the close of this portion that we get the first reference to external nations: "Give not thy heritage to reproach, that the nations should use a byword against them: wherefore should they say among the peoples, Where is their God?" (<a onClick="return mV(\'Joe\',2,17);">2:17</a> margin). If the view given above of <a onClick="return mV(\'Joe\',1,6,7,8);">1:6-8</a> be correct, this is merely an expansion of the germinal idea there involved. And so it becomes a pivot on which the succeeding portion turns: "Then was Yahweh jealous for his land, and had pity on his people" (<a onClick="return mV(\'Joe\',2,18);">2:18</a>).<P>There is a sharp turn at <a onClick="return mV(\'Joe\',2,18);">Joe 2:18</a>, marked by the sudden variation of the verbal forms. Just as in <a onClick="return mV(\'Amo\',7,10);">Am 7:10</a>, in the midst of the prophet\'s discourse, we come upon the narration, "Then Amaziah the priest of Beth-el sent to Jeroboam," etc., so here we have obviously to take the narrative to be the sequence of the foregoing address, or, more properly speaking, we have to infer that what Joel had counseled had been done. The fast had been sanctified, the solemn assembly had been called, all classes or their representatives had been gathered to the house of the Lord, the supplication had been made, and "then was Yahweh jealous for his land, and had pity on his people." In point of fact, as the Hebrew student will perceive, all the verbs from <a onClick="return mV(\'Joe\',2,15);">2:15</a> may be read, with a change of the points, as simple perfects, with the exception of the verbs for "weep" and "say" in <a onClick="return mV(\'Joe\',2,17);">2:17</a>, which might be descriptive imperfects. But no doubt the imperative forms are to be read, expressing as they do more graphically the doing of the thing prescribed. And, this sharp turn having been made, it will be noticed how the discourse proceeds on a higher gradient, forming a counterpart to the preceding context. Step by step, in inverse order, we pass the former points, beginning opposite what was last the "reproach among the nations" (<a onClick="return mV(\'Joe\',2,19);">2:19</a>; compare <a onClick="return mV(\'Joe\',2,7);">2:7</a>), passing the destruction of the great army (<a onClick="return mV(\'Joe\',2,20);">2:20</a>; compare <a onClick="return mV(\'Joe\',2,\'2-11\');">2:1-11</a>), then touching upon the various kinds of vegetation affected (<a onClick="return mV(\'Joe\',2,\'21-24\');">2:21-24</a>; compare <a onClick="return mV(\'Joe\',1,12);">1:12</a>, <a onClick="return mV(\'Joe\',1,10);">10</a>, etc.), and ending with the reversal of the fourfold devastation with which the prophet began (<a onClick="return mV(\'Joe\',2,25);">2:25</A>; compare <a onClick="return mV(\'Joe\',1,4);">1:4</A>). So that what at the outset was announced as a calamity unprecedented and unparalleled, now becomes a deliverance as enduring as God\'s presence with His people is forever assured.<P>Up to this point there has been an observable sequence and connection, so that, while the prophet has steadily progressed upward, we can look down from the point reached and see the whole course that has been traversed. But now in <a onClick="return mV(\'Joe\',2,\'28-32\');">Joe 2:28-32 (Joe 3</a> in Hebrew)</a> he passes abruptly to what "shall come to pass afterward." And yet no doubt there was a connection of thought in his mind, of which we obtain suggestions in the new features of the description. There is "the sound of abundance of rain" (<a onClick="return mV(\'1Ki\',18,41);">1Ki 18:41</a>) in this pouring out of the Spirit upon all flesh; in the sons and daughters, old men and young, servants and handmaidens, we seem to recognize the representative gathering of <a onClick="return mV(\'Joe\',2,15);">Joe 2:15</a>f; those engaged in the priestly function of, supplication here endued with prophetic gifts, "a kingdom of priests, and a holy nation" (<a onClick="return mV(\'Exd\',19,6);">Ex 19:6</a>), all the Lord\'s people become prophets (<a onClick="return mV(\'Num\',11,29);">Nu 11:29</a>). Again we see the sky overcast and sun and moon darkened before the great and terrible day of the Lord, as if the prophet had said: There shall be greater things than these; a new era is coming in which God\'s hand will be laid more heavily upon the world, and His people will be quickened to a clearer vision of His working. The "day of Yahweh" has yet to come in a fuller sense than the locust plague suggested, and there will be a more effective deliverance than from drought and dearth; but then as now there will be found safety in Mt. Zion and Jerusalem. This, however, implies some danger with which Jerusalem has been threatened; a "remnant," an "escaped" portion involves a disaster or crisis out of which new life comes. And so the prophet goes on in <a onClick="return mV(\'Joe\',3,1);">Joe 3 (Joe 4 in Hebrew)</a>, still speaking of "those days" and "that time," to tell us of the greater deliverance from the greater trouble to which he has been alluding. There is nothing in the antecedent chapters to indicate what "that time" and "those days" are, or what the prophet means by bringing again the captivity of Judah and Jerusalem. These are questions of interpretation. In the meantime, we may note the general features of the scene now set before us. A great assize is to be held in the valley of Jehoshaphat, in which "all nations" there assembled by Divine summons will be judged for offenses against God\'s people and heritage (<a onClick="return mV(\'Joe\',3,\'1-8\');">3:1-8</A>). And again, just as in <a onClick="return mV(\'Joe\',1,\'1-\');">Joe 1</a>; <a onClick="return mV(\'Joe\',2,\'1-\');">2</a> the prophet exhibited the plague of locusts in two pictures, so here in <a onClick="return mV(\'Joe\',3,\'9-21\');">3:9-21</A> the picture of the great assize is transformed into a bloody picture in the same valley, not so much of battle as of slaughter, a treading of the wine-press. There is a confused multitude in "the valley of decision"; sun and moon are darkened, and the stars withdraw their shining; the "day of Yahweh" has finally come; and, when the din is silenced and clear light again falls upon the scene, all is peace and prosperity, the last of the enemies destroyed, and the Lord dwelleth in Zion.<P>3. Interpretation:<P>(1) Literal.<P>Thus the book forms a fairly intelligible and connected whole when we read in the literal sense of the language. That is to say: a time of continued drought combined with an unprecedented visitation of locusts gives occasion to the prophet to call his people to the recognition of the Divine hand and to earnest supplication that the threatened ruin of people and land may be averted. The removal of the calamity is interpreted as a mark of restored Divine favor and an assurance of prosperity based on God\'s unchangeable purpose of good to His people. But these great doings of Nature\'s God suggest yet greater deeds of Israel\'s God of a more spiritual kind, the outpouring, like copious showers, of Divine blessing, so that the whole community would be set on a higher level of spiritual apprehension. And thus the prophet is led on to speak of the "last things." Judah and Jerusalem, highly distinguished and signally protected, are bound up with a world-wide purpose; Israel, in a word, cannot be conceived apart from non-Israel. And as non-Israel had in the past been an opposing power, in the great "day of Yahweh," wrong should be at last righted, the nations judged, and Israel and Israel\'s God be glorified. No doubt the interpretation is not without difficulties. We may not be able to detect the motives of the sudden transitions, or to say how much of the purport of the latter part was in the prophet\'s mind when he was engaged on the former part. And the description of the locust is so highly poetical that there is a temptation to see in it a reference to a great invading army.<P>(2) Allegorical.<P>These considerations, combined with the undoubted eschatological strain of the closing part of the book, led early commentators (and they have had followers in modern times) to an allegorical interpretation of the locust, and to regard the whole book as pointing forward to future history. Thus, in Jerome\'s time, the 4 names of the locust in <a onClick="return mV(\'Joe\',1,4);">1:4</a> were supposed to designate<P class="in15">(1) the Assyrians and Babylonians,<P class="in15">(2) the Medes and Persians,<P class="in15">(3) the Macedonians and Antiochus Epiphanes, and<P class="in15">(4) the Romans.<P>But, apart from the consideration that the analogy of prophecy would lead us to look for some actual situation or occurrence of his time as the starting-point of Joel\'s discourse, a close observation and acquaintance with the habits of the locust confirm the prophet\'s description, albeit highly figurative and poetical, as minutely accurate in all its details. It is to be observed that, though spoken of as an army (and at the present day the Oriental calls the locust the "army of God"), there is no mention of bloodshed. The designation "the Northern one," which has been considered inappropriate because the locust comes from the parched plain of the eastern interior, need not cause perplexity; for the Hebrew, while it has names for the 4 cardinal points of the compass, has none for the intermediate points: Judea might be visited by locusts coming from the northeast, or, coming from the East, they might strike the country at a point to the north of Palestine and travel southward. So the wind which destroys the locust (<a onClick="return mV(\'Joe\',2,20);">Joe 2:20</a>) would be a northwesterly wind, driving the forepart into the Dead Sea and the hinder part into the Mediterranean.<P>4. Indications of Date:<P>The Book of Joel has been assigned by different authorities to very various dates, ranging over 4 or 5 centuries; but, as will appear in the sequel, it comes to be a question whether the book is very early or very late, in fact, whether Joel is perhaps the very earliest or the very last or among the last of the writing prophets. This diversity of opinion is due to the fact that there are no direct indications of date in the book itself, and that such indirect indications as it affords are held to be capable of explanation on the one view or the other. It will be noticed also that, to add to the uncertainty, many of the arguments adduced are of a negative kind, i.e. consideration of what the prophet does not mention or refer to, and the argument from silence is notoriously precarious. It will, therefore, be convenient to specify the indications available, and to note the arguments drawn from them in support of the respective dates.<P>(1) Place in the Canon.<P>An argument for a very early date is based upon the place of the book in the, collection of the "twelve" minor prophets.<P>It stands, in the Hebrew Bible, between Hosea and Amos, who are usually spoken of as the earliest "writing prophets." It is true that, in the Septuagint collection, the order is different, namely, Hosea, Amos, Micah, Joel, Obadiah, Jonah; which may indicate that as early as the time of the formation of the Canon of the Prophets there was uncertainty as to the place of Joel, Obadiah, and Jon, which contain no direct indication of their dates. But, seeing that there has evidently been a regard to some chronological order, the books being arranged according to the Assyrian, Babylonian and Persian periods, it cannot be without significance that Joel has found a place so high up in the collection. The three indisputably post-exilian books stand together at the end. If Joel is late, it must be as late as the latest of these, possibly a great deal later. But if that is so, there was the greater likelihood of its date being known to the collectors. It would be a very hazardous assumption that prophetical books were not read or copied from the time of their first composition till the time they were gathered into a Canon. And, if they were so read and copied, surely the people who handled them took some interest in preserving the knowledge of their origin and authorship.<P>In this connection, attention is directed to the resemblances to the Book of Amos before which Joel stands. These are regarded by Reuss as favoring the early date. That large and beautiful passage with which the Book of Amos opens dwells upon the thought that the threatenings, which had formerly been uttered against the nations, are about to receive their fulfillment, and that Yahweh could not take back His word. Now it is just such a threatening that fills the last part of the Book of Joel. Indeed Amos begins his book with the very phrase in which Joel opens his closing address, "Yahweh will roar from Zion, and utter his voice from Jerus" (<a onClick="return mV(\'Amo\',1,2);">Am 1:2</a>; <a onClick="return mV(\'Joe\',3,16);">Joe 3:16</a>). At the end of Amos also the happy fertility of Canaan is described in similar terms to those in Joel (<a onClick="return mV(\'Amo\',9,13);">Am 9:13</a>; <a onClick="return mV(\'Joe\',3,18);">Joe 3:18</a>). Reuss, moreover, draws attention to the remarkable expression found in Joel, and also, though in modified terms, in two Prophets of the Assyrian period: "Beat your plowshares into swords, and your pruning-hooks into spears," says Joel (<a onClick="return mV(\'Joe\',3,10);">3:10</a>), whereas we have the oracle in <a onClick="return mV(\'Isa\',2,4);">Isa 2:4</a> and <a onClick="return mV(\'Mic\',4,3);">Mic 4:3</a>, "They shall beat their swords into plowshares, and their spears into pruning-hooks"; and it is suggested that, if these were current phrases, they were more likely to have been coined in the form employed by Joel in earlier and less settled times, when sudden alarms of war called the peaceful husbandman to the defense of his fields and flocks. Further, it is pointed out that Amos reproaches the people of his day for impenitence, although Yahweh had given them "cleanness of teeth" and "want of bread" and had "withholden the rain...when there were yet three months to the harvest," and smitten them with blasting and mildew and the palmer worm (<a onClick="return mV(\'Amo\',4,\'6-9\');">Am 4:6-9</a>); and all this is the more striking because Joel represents the distress of his day as unprecedented in magnitude.<P>To all this, advocates of the late date reply that we cannot determine the date of a book by its place in the Canon; for that the collectors were guided by other considerations. As to the resemblances to Amos, it may have been on the strength of these very resemblances that the Book of Joel, bearing no date in itself, was placed beside that of Amos. Moreover, it is maintained, as we shall see presently, that Joel has resemblances to other prophets, some of them confessedly of late date, proving that he was acquainted with writings of a very late time.<P>(2) Language and Style.<P>Another argument for an early date is based upon the purity of the language and character of the style. The book is written in what may be described as classical Hebrew, and shows no trace of decadence of language. It is no doubt true that "the style is the man," as is strikingly illustrated in the very different styles of Amos and Hosea, who were practically contemporaneous; so that arguments of this kind are precarious. Still, it is to be noted, that though there is nothing archaic in the style of Joel, neither is there anything archaic in the style of Amos, who would, by the exclusion of Joel, be our earliest example of written prophecy.<P>The advocates of the very late date reply that the style of Joel is too good to be archaic; and that his admittedly classic style is to be explained by the supposition that, living at a late time, he was a diligent student of earlier prophetic literature, and molded his style upon the classical.<P>(3) Quotations.<P>Here, therefore, must be mentioned an argument much relied on by the advocates of a very late date. It is said that there are so many resemblances in thought and expression to other Old Testament books that it is incredible that so many writers posterior to the early date claimed for Joel should have quoted from this little book or expanded thoughts contained in it. A very elaborate comparison of Joel with late writers has been made by Holzinger in ZATW, 1889, 89-131; his line of argument being that, while resemblances to undoubtedly early writers may be explained as the work of a writer in the Renaissance imitating older models, the resemblances to others known to be late, such as Jeremiah, Ezekiel, II Isaiah, Psalms, Nehemiah, Chronicles, etc., cannot be so explained if Joel is taken to be early. The principal passages in question are given in the Cambridge Bible for Schools and Colleges, "Book of Joel," by Professor Driver, who also takes the view that Joel is late.<P>The list is not, perhaps, so formidable as its length would imply. Both writers confess that from several of the passages no conclusion of any value can be drawn, and that there is always a difficulty in determining priority when similarities in diction are found. Many of the expressions quoted look as if they might have been commonplaces of the prophetical literature; and, if it was possible for a very late writer to quote from so many antecedent writings, it was as possible and much easier for a number of late writers to go back to the very earliest prophets, especially if their words were memorable and germinal. We have heard of the man who objected to Shakespeare because he was full of quotations; and there is perhaps not a line of Gray\'s "Elegy" that has not been quoted somewhere, while some of his lines have become household words. But the strongest objection to this argument is this: if Joel had the minute acquaintance with antecedent writers and followed them so closely as is implied, he not only varies from them in essential particulars, but falls below them, as we shall see, in his anticipations of the future.<P>(4) The Situation.<P>We have now to look at features of a more concrete and tangible character, which promise to give more positive results. It is maintained by the advocates of the late date that the situation and immediate outlook of the prophet are not only consistent with the late date but preclude any preexilian date altogether. The elements of the situation are these: Whereas all the prophets before the downfall of Samaria (722 BC), and even Jeremiah and Ezekiel, mention the Northern Kingdom, it is not once named or referred to in Joel; for the occurrence of the name "Israel" in <a onClick="return mV(\'Joe\',2,27);">2:27</a>; <a onClick="return mV(\'Joe\',3,2,16);">3:2,16</a> cannot support this sense. Judah and Jerusalem fill our prophet\'s actual horizon (<a onClick="return mV(\'Joe\',2,1,32);">2:1,32</A>; <a onClick="return mV(\'Joe\',3,6.16.20);">3:6,16f., 20</a>); no king is mentioned or implied, but the elders with the priests seem to be the prominent and ruling class. Further, the temple and its worship are central (<a onClick="return mV(\'Joe\',1,14);">1:14</a>; <a onClick="return mV(\'Joe\',2,15);">2:15f</a>) and so important that the cutting off of the meal offering and drink offering is tantamount to national ruin (<a onClick="return mV(\'Joe\',1,9,13,16);">1:9,13,16</a>; <a onClick="return mV(\'Joe\',2,14);">2:14</a>). Again, there is no mention of the prevailing sins of preexilian times, the high places with their corrupt worship, or indeed of any specific sin for which the people were to humble themselves, while fasting and putting on sackcloth seem to have a special virtue. All the circumstances, it is held, conform exactly to the time of the post-exilian temple and to no other time. The Northern Kingdom was no more, there was no king in Jerusalem, the temple was the center and rallying-point of national life, its ritual the pledge and guarantee of God\'s presence and favor; the period of legalism had set in. It is confidently averred that at no period prior to the regime inaugurated by Ezra and Nehemiah was there such a conjunction of circumstances.<P>(a) Political:<P>In reply, it is urged in favor of the early date that there was a period in preexilian time when such a situation existed, namely, the early years of the reign of Joash, when that prince was still an infant; for Jehoiada the priest acted practically as regent after the death of Athaliah, 836 BC (<a onClick="return mV(\'2Ki\',11,\'1-17\');">2Ki 11:1-17</a>). This would sufficiently account for the absence of mention of a king in the book. At such a time the priesthood must have held a prominent position, and the temple would overshadow the palace in importance. The omission of the Northern Kingdom may be accounted for by the fact that at that time the two kingdoms were on friendly terms; for the two royal houses were connected by marriage, and the kingdoms were in alliance (<a onClick="return mV(\'2Ki\',3,6);">2Ki 3:6</a>ff; <a onClick="return mV(\'2Ki\',8,28);">8:28</a>). Or the omission may have no more significance than the fact that Joel was concerned with an immediate and near present distress and had no occasion to mention the Northern Kingdom. To show how unsafe it is to draw conclusions from such silence, it may be observed that throughout the first 5 chapters of Isaiah, larger in bulk than the whole Book of Joel, only Judah and Jerusalem are mentioned; and, even if it should be maintained that a part or the whole of these chapters dates from after the deportation of the ten tribes, still it is noteworthy that, when the prophet could have made as good use of a reference to the event as Jeremiah and Ezekiel, he does not do so.<P>(b) Religious:<P>The fact that there is no mention of specific national sins, and particularly of the worship of the high places, of which preexilian prophets have so much to say, is made much of by advocates of the late date, Dr. A.B. Davidson, e.g., declaring it to be "doubtful whether such a state of things existed at any time prior to the restoration from exile" (Expos, March, 1888); but perhaps this argument proves too much. If we are to deduce the state of religion in Joel\'s day from, what he does not say on the subject, it may be doubted whether at any time, either before or after the exile, such a condition prevailed. The post-exilian prophets certainly knew of sins in their time, sins, too, which restrained the rain and blasted the wine and oil and corn (<a onClick="return mV(\'Hag\',1,11);">Hag 1:11</a>). For all that Joel says on the subject, the condition of things implied is as consistent with the time of Jehoiada as with that of Nehemiah. And what shall we say of Isaiah\'s positive description of the condition of Jerusalem before his time: "the faithful city...she that was full of justice! righteousness lodged in her" (<a onClick="return mV(\'Isa\',1,21);">Isa 1:21</a>)? When was that? So also his promise: "I will restore thy judges as at the first, and thy counselors as at the beginning: afterward thou shalt be called The city of righteousness, a faithful town" (<a onClick="return mV(\'Isa\',1,26);">Isa 1:26</a>). Higher praise could scarcely be bestowed, and there is nothing in the Book of Joel to imply that he assumed so much.<P>(c) Ritualistic:<P>Too much has been made of the references to ritual, as if they necessarily implied a post-exilian date. It is not legitimate here to assume that the idea of centralization of worship originated in Josiah\'s days, and that the priestly legislation is post-exilic. The mention of "old men" or "elders" is no such indication. Wellhausen himself maintains that the expression everywhere in Joel means nothing more than "old men"; and, even if it had an official connotation, the official elders are an old tribal institution in Israel. It may be noted here again that in the first 5 chapters of Isaiah elders also are mentioned, and more indubitably in an official sense, although the time was that of the monarchy (<a onClick="return mV(\'Isa\',3,2,14);">Isa 3:2,14</a>). And as to the sanctity of the temple, it will hardly be denied that in the time of Jehoiada the Jerusalem temple was a place of far more importance than any supposed local shrine, and especially when there was a call to a united national supplication (see <a onClick="return mV(\'2Ki\',11,\'1-\');">2Ki 11</a>). In point of fact the alleged references to ritual are very few and in most general terms. The "fast" is not denoted by the phrases in the legal codes, and was evidently on the footing of such observances as are common and instinctive at all times and among all persons (<a onClick="return mV(\'Jdg\',20,26);">Jud 20:26</a>; <a onClick="return mV(\'1Sa\',7,6);">1Sa 7:6</a>; <a onClick="return mV(\'2Sa\',1,12);">2Sa 1:12</a>; <a onClick="return mV(\'Jon\',3,5);">Jon 3:5</a>). And where in any law-code are priests enjoined to lie all night in sackcloth (<a onClick="return mV(\'Joe\',1,13);">Joe 1:13</a>)? Or what prescription in any code requires young and old, bridegroom and bride, to press together into the temple (<a onClick="return mV(\'Joe\',2,16);">Joe 2:16</a>)? And why should not any or all of these things have been done in face of a sudden emergency threatening the ruin of an agricultural people? Moreover, Joel, so far from ascribing virtue to these outward marks of humiliation in a legalistic spirit, immediately after mentioning them says: "Rend your heart, and not your garments, and turn unto Yahweh your God" (<a onClick="return mV(\'Joe\',2,13);">Joe 2:13</a>).<P>The only ritual references are to the meal offering and the drink offering (<a onClick="return mV(\'Joe\',1,9,13);">Joe 1:9,13</a>; <a onClick="return mV(\'Joe\',2,14);">2:14</a>), and these were not characteristically post-exilian. Indeed, they may be regarded as primitive forms of offering, the produce of the ground without which, among an agricultural people, we can hardly imagine a system of offerings to exist. They are both ancient. Amos regards the meal offering as well known (<a onClick="return mV(\'Amo\',5,22,25);">Am 5:22,25</a>), and Isaiah uses the word "vain oblations" in speaking of its abuse (<a onClick="return mV(\'Isa\',1,13);">Isa 1:13</a>). And though the noun for drink offering is not mentioned in the older prophets, Hosea knows the related verb and the act of pouring out wine to the Lord (<a onClick="return mV(\'Hsa\',9,4);">Ho 9:4</a>), and it may be asked whether it is likely that the people performed the act and had no name for the offering itself. Moreover, in an undisputed passage (<a onClick="return mV(\'2Ki\',16,13,15);">2Ki 16:13,15</a>), both offerings are mentioned in the time of Ahaz. As for the contention that our prophet regards these offerings of so much importance that the cessation of them would be fatal, if our interpretation of <a onClick="return mV(\'Joe\',1,8);">Joe 1:8</a>f above be correct, the earlier date would be much more appropriate. It was not because the offering threatened to cease, but because the thing offered threatened to be cut off, that Joel was so perturbed. The popular view as to the relation of Yahweh to His land was ancient, and had a foundation of truth; and in fact Hosea\'s teaching would fitly follow and complete that of Joel. Finally it is to be said that Joel\'s fine forecast of the outpouring of the Spirit, and of the universal extension of prophetic activity is as far removed as possible from the "legalistic" tendency that set in after the exile. And if the argument from silence is of any force at all, it is surely a very remarkable thing that in a book of post-exilian times, there should be no mention of prince or governor, or even of high priest.<P>(5) Foreign Nations Mentioned or Omitted.<P>Allusions to foreign nations, or the absence of allusion, would obviously promise to afford indications of the time of the prophet; and yet here also the allusions have been adduced in support of either of the divergent dates. The facts here are as follows: In the first two chapters, where the prophet, as is generally understood, is speaking of his own time and its pressing distress, there is no mention of any foreign nation, not even the kingdom of the ten tribes. The only expression which has been taken to be significant in this connection is the word translated "the northern" army (<a onClick="return mV(\'Joe\',2,20);">Joe 2:20</a>), which some refer to the Assyrians, while others explain it of a northern army in late or apocalyptic time. In <a onClick="return mV(\'Joe\',3,\'1-\');">Joe 3</a>, however, when the prophet is speaking of "those days" and "that time" in the future, when the Lord "shall bring back the captivity of Judah and Jerusalem," there is to be a gathering of "all nations" in the valley of Jehoshaphat (<a onClick="return mV(\'Joe\',3,1);">3:1</a>f); and later on "all the nations" are summoned to appear in the same valley for judgment (<a onClick="return mV(\'Joe\',3,11);">3:11</a>f). "Tyre, and Sidon, and all the regions of Philistia" are specially reproached (<a onClick="return mV(\'Joe\',3,4);">3:4</a>) because they have carried into their temples the sacred treasures, and have sold the children of Judah and Jerusalem unto the "sons of the Grecians" (<a onClick="return mV(\'Joe\',3,6);">3:6</a>); in recompense for which their sons and daughters are to be sold into the hand of the children of Judah, to be sold by them to "the men of Sheba, to a nation far off" (<a onClick="return mV(\'Joe\',3,8);">3:8</a>). Finally, at the close (<a onClick="return mV(\'Joe\',3,19);">3:19</a>f), "Egypt shall be a desolation, and Edom shall be a desolate wilderness, for the violence done to the children of Judah, because they have shed innocent blood in their land."<P>It is acknowledged that, on either hypothesis, there are difficulties in accounting for the presence or absence of names of foreign nations in this presentation. Those who advocate the late date point with confidence to the silence as to the kingdom of the ten tribes, or to the kingdom of Damascus, which, on their hypothesis, had passed away, and the equally significant silence as to Assyria, which had long ago been superseded by the Babylonian and Persian empires of the East. As to the mention of Tyre and Sidon and the coasts of Philistia (<a onClick="return mV(\'Joe\',3,\'4-6\');">Joe 3:4-6</a>), Driver says: "The particular occasion referred to by Joel must remain uncertain: but the Phoenicians continued to act as slave-dealers long after the age of Amos: and the notice of Javan (Greece) suits better a later time, when Syrian slaves were in request in Greece" (Cambridge Bible, "Joel," 17). The same writer says on <a onClick="return mV(\'Joe\',3,19);">Joel 3:19</a>: "There is so little that is specific in what is said in this verse with reference to either Egypt or Edom, that both countries are probably named (at a time when the Assyrians and Chaldeans had alike ceased to be formidable to Judah) as typical examples of countries hostile to the Jews." It is pointed out, moreover, that the enmity of Edom was particularly manifest at a late period when Jerusalem was destroyed by the Chaldeans, and that this was remembered and resented long afterward (<a onClick="return mV(\'Oba\',1,\'10-16\');">Ob 1:10-16</a>; <a onClick="return mV(\'Eze\',25,12);">Eze 25:12</a>ff; <a onClick="return mV(\'Eze\',35,\'1-\');">35</a>; <a onClick="return mV(\'Psa\',137,7);">Ps 137:7</a>).<P>On the hypothesis of the early date, it is urged that there was no occasion to refer to the Northern Kingdom. If it was friendly, the inclusive name of Israel for the whole people was sufficient to denote this, and that it was not hostile in the early days of Joash has already been pointed out. As to Damascus, it was not till the last years of the reign of Joash that Hazael showed hostility to Jerusalem (<a onClick="return mV(\'2Ki\',12,17);">2Ki 12:17</a>f); and danger from Assyria had not yet emerged, and appears only faintly in Amos (<a onClick="return mV(\'Amo\',3,11);">Am 3:11</a>; <a onClick="return mV(\'Amo\',6,14);">6:14</a>). Then it is pointed out that history records how, in the reign of Jehoram, the grandfather of Joash, "Edom revolted from under the hand of Judah, and made a king over themselves" (<a onClick="return mV(\'2Ki\',8,20);">2Ki 8:20</a>; <a onClick="return mV(\'2Ch\',21,8);">2Ch 21:8</a>), and the historian adds that the revolt continued "unto this day." It may well have been that in such a revolt the resident Judeans in the land of Edom suffered the violence referred to in <a onClick="return mV(\'Joe\',3,19);">Joe 3:19</a>. Moreover, the Chronicler mentions that, in the same reign, "Yahweh stirred up against Jehoram the spirit of the Philistines, and of the Arabians that are beside the Ethiopians: and they came up against Judah, and brake into it, and carried away all the substance that was found in the king\'s house, and his sons also, and his wives," etc. (<a onClick="return mV(\'2Ch\',21,16);">2Ch 21:16</a>f). This might be what is referred to in <a onClick="return mV(\'Joe\',3,\'4-6\');">Joe 3:4-6</a>. If the royal family were carried away there would most probably be a deportation of other prisoners, who, taken by the seaboard Philistines, would, through the great maritime power of the day, be sold to the distant Greeks. And here it is pointed out that Amos singles out the very nations mentioned by Joel: Philistines, Tyre and Sidon and Edom, and reproaches them with offenses such as Joel specifies (<a onClick="return mV(\'Amo\',1,\'6-12\');">Am 1:6-12</a>). And then, it is added, if the book is as late as Nehemiah, why is nothing said of Samaritans, Moabites, and Ammonites, who showed such marked hostility in his days (<a onClick="return mV(\'Neh\',2,19);">Ne 2:19</a
