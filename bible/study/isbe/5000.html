isbe = [];

isbe[5001]='Jeshimon`je-she\'-mon, jesh\'-i-mon (ha-yeshimon, "the desert," and in the Revised Version (British and American) so translated but in the King James Version, <a onClick="return mV(\'Num\',21,20);">Nu 21:20</a>; <a onClick="return mV(\'Num\',23,28);">23:28</a>; <a onClick="return mV(\'1Sa\',23,19,24);">1Sa 23:19,24</a>; <a onClick="return mV(\'1Sa\',26,1,3);">26:1,3</a>, "Jeshimon" as a place-name. In Numbers, the Septuagint reads he eremos, "the desert"; in 1 Samuel, the Septuagint reads Iessaimon): In these passages probably two districts are referred to:<P>(1) The "desert" north of the Dead Sea, which was overlooked from Pisgah (<a onClick="return mV(\'Num\',21,20);">Nu 21:20</a>; <a onClick="return mV(\'Num\',23,28);">23:28</a>). This is the bare and sterile land, saturated with salt, lying on each side of the Jordan north of the Dead Sea, where for miles practically no vegetable life can exist.<P>(2) The sterile plateau west of the steep cliffs bordering the western shores of the Dead Sea. Here between the lower slopes of the Judean hills, where thousands of Bedouin live and herd their flocks, and the more fertile borders of the sea with their oases (\'Ain Feshkhah, \'Ain Jidy, etc.), is a broad strip of utterly waterless land, the soft chalky hills of which are, for all but a few short weeks, destitute of practically any vegetation. The Hill of Hachilah was on the edge of this desert (<a onClick="return mV(\'1Sa\',23,19);">1Sa 23:19</a>; <a onClick="return mV(\'1Sa\',26,1,3);">26:1,3</a>), and the Arabah was to its south (<a onClick="return mV(\'1Sa\',23,24);">1Sa 23:24</a>). It is possible that the references in Numbers may also apply to this region.<P>The word "Jeshimon" (yeshimon) is often used as a common noun in referring to the desert of Sinai (<a onClick="return mV(\'Deu\',32,10);">De 32:10</a>; <a onClick="return mV(\'Psa\',78,40);">Ps 78:40</a>; <a onClick="return mV(\'Psa\',106,14);">106:14</a>; <a onClick="return mV(\'Isa\',43,19);">Isa 43:19</a>, etc.), and except in the first two of these references, when we have "wilderness," it is always translated "desert." Although used in 7 passages in poetical parallelism to midhbar, translated "wilderness," it really means a much more hopeless place; in a midhbar animals can be pastured, but a yeshimon is a desolate waste.``117';
isbe[5002]='Jeshishai`je-shish\'-a-i (yeshishay, "aged"): A Gadite chief (and family?) (<a onClick="return mV(\'1Ch\',5,14);">1Ch 5:14</a>).``1';
isbe[5003]='Jeshohaiah`jesh-o-ha\'-ya, jesh-o-hi\'-a (yeshochayah, meaning unknown): A prince in Simeon (<a onClick="return mV(\'1Ch\',4,36);">1Ch 4:36</a>).``1';
isbe[5004]='Jeshua`jesh\'-u-a, je-shu\'-a (yeshua\'): A place occupied by the children of Judah after their return from captivity (<a onClick="return mV(\'Neh\',11,26);">Ne 11:26</a>), evidently, from the places named with it, in the extreme south of Judah. It may correspond with the Shema of <a onClick="return mV(\'Jos\',15,26);">Jos 15:26</a>, and possibly to the Sheba of 19:2. The site may be Khirbet Sa\'weh, a ruin upon a prominent hill, Tell es Sa\'weh, 12 miles east-northeast of Beersheba. The hill is surrounded by a wall of large blocks of stone. PEF, III, 409-10, Sh XXV.``1';
isbe[5005]='Jeshua; Jeshuah`jesh\'-u-a, je-shu\'-a (yeshua\', "Yahweh is deliverance" or "opulence"; compare <a href="./study/isbe/search.html?string=JOSHUA">JOSHUA</a>):<P>(1) the King James Version "Jeshuah," head of the 9th course of priests, and possibly of "the house of Jeshua" (<a onClick="return mV(\'1Ch\',24,11);">1Ch 24:11</a>; <a onClick="return mV(\'Ezr\',2,36);">Ezr 2:36</a>; <a onClick="return mV(\'Neh\',7,39);">Ne 7:39</a>).<P>(2) A Levite of Hezekiah\'s time (<a onClick="return mV(\'2Ch\',31,15);">2Ch 31:15</a>).<P>(3) Son of Jozadak = Joshua the high priest (<a onClick="return mV(\'Ezr\',2,2);">Ezr 2:2</a>; <a onClick="return mV(\'Ezr\',3,2,8);">3:2,8</a>; <a onClick="return mV(\'Ezr\',4,3);">4:3</a>; <a onClick="return mV(\'Ezr\',5,2);">5:2</a>; <a onClick="return mV(\'Ezr\',10,18);">10:18</a>; <a onClick="return mV(\'Neh\',7,7);">Ne 7:7</a>; <a onClick="return mV(\'Neh\',12,1,7,10,26);">12:1,7,10,26</a>); see <a href="./study/isbe/search.html?string=JOSHUA+(4)">JOSHUA (4)</a> = "Jesus" (1Esdras 5:48 and Sirach 49:12).<P>(4) A man of Pahath-moab, some of whose descendants returned from Babylon to Jerusalem with Zerubbabel (<a onClick="return mV(\'Ezr\',2,6);">Ezr 2:6</a>; <a onClick="return mV(\'Neh\',7,11);">Ne 7:11</a>) = "Jesus" (1Esdras 58).<P>(5) Head of a Levitical house which had oversight of the workmen in the temple (<a onClick="return mV(\'Ezr\',2,40);">Ezr 2:40</a>; <a onClick="return mV(\'Ezr\',3,9);">3:9</a>; <a onClick="return mV(\'Neh\',7,43);">Ne 7:43</a>). He is mentioned again in <a onClick="return mV(\'Neh\',8,7);">Ne 8:7</a> as taking part in explaining the Torah to the people, in <a onClick="return mV(\'Neh\',9,4);">Ne 9:4</a>f (compare <a onClick="return mV(\'Neh\',12,8);">12:8</a>) as leading in the worship, and in <a onClick="return mV(\'Neh\',10,9);">10:9 (Hebrew 10)</a> as sealing the covenant; this Jeshua is called son of Azaniah (<a onClick="return mV(\'Neh\',10,9);">Ne 10:9</a>). To these references should be added probably <a onClick="return mV(\'Neh\',12,24);">Ne 12:24</a>, where commentators read, "Jeshua, Binnui, Kadmiel" for "Jeshua the son of Kadmiel." Perhaps Jozabad (<a onClick="return mV(\'Ezr\',8,33);">Ezr 8:33</a>) is a "son" of this same Jeshua; compare <a onClick="return mV(\'Ezr\',8,33);">Ezr 8:33</a> = 1Esdras 8:63, where the King James Version is "Jesu," the Revised Version (British and American) "Jesus." He is the same as Jessue (the King James Version), Jesus (Revised Version) (1Esdras 5:26).<P>(6) Father of Ezer, a repairer of the wall (<a onClick="return mV(\'Neh\',3,19);">Ne 3:19</a>).<P>(7) <a href="./study/isbe/search.html?string=JOSHUA">JOSHUA</a>, son of Nun (<a onClick="return mV(\'Neh\',8,17);">Ne 8:17</a>) (which see).``149';
isbe[5006]='Jeshurun`je-shu\'-run, jesh\'-u-run (yeshurun, "upright one," <a onClick="return mV(\'Deu\',32,15);">De 32:15</a>; <a onClick="return mV(\'Deu\',33,5,26);">33:5,26</a>; <a onClick="return mV(\'Isa\',44,2);">Isa 44:2</a>): Septuagint translates it "the beloved one" egapemenos, the perfect participle passive of agapao), and in <a onClick="return mV(\'Isa\',44,2);">Isa 44:2</a> adds "Israel"; Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) has dilectus in <a onClick="return mV(\'Deu\',32,15);">De 32:15</a>, elsewhere rectissimus; Aquila, Symmachus, Theodotion have "upright." For the form, Duhm compares zebhulun, Zebulun.<P>(1) The name used to be explained as a diminutive form, a pet name, and some, e.g. Cornill, Schultz (Old Testament Theology, English translation, II,29,note 12) still explain it so, "the righteous little people." But there is no evidence that the ending -un had a diminutive force.<P>(2) Most moderns take it as a poetical or ideal title of Israel, derived from yashar, "upright"; it is held to contain a tacit reference to the word Israel (yisra\'el), of which the first three consonants are almost the same as those of "Jeshurun"; in <a onClick="return mV(\'Num\',23,10);">Nu 23:10</a> the term "the righteous ones" (yesharim) is supposed to contain a similar reference. Most commentators compare also "the Book of Jashar," and it has been held that "Jashar" is similarly a name by which Israel is called.<P>See <a href="./study/isbe/search.html?string=JASHAR">JASHAR</a>.<P>Following Bacher (ZATW, 1885, 161ff), commentators hold that in Isaiah this new name, a coinage due to the author of Second Isaiah and adopted in Deuteronomy, stands in contrast to Jacob, "the supplanter," as his name was explained by the Hebrews (compare <a onClick="return mV(\'Hsa\',12,\'2-4\');">Ho 12:2-4</a>). Israel is here given a new name, "the upright, pious one," and with the new name goes new chance in life, to live up to its meaning. Driver (Deuteronomy, 361) says that in <a onClick="return mV(\'Deu\',32,15);">De 32:15</a> "where the context is of declension from its ideal (it is) applied reproachfully. \'Nomen Recti pro Israele ponens, ironice eos perstringit qui a rectitudine defecerant\' (Calv.). Elsewhere it is used as a title of honor." the King James Version has "Jesurun" in <a onClick="return mV(\'Isa\',44,2);">Isa 44:2</a>.``149';
isbe[5007]='Jesiah`je-si\'-a (<a onClick="return mV(\'1Ch\',23,20);">1Ch 23:20</a> the King James Version).`<a href="./study/isbe/search.html?string=ISSHIAH">ISSHIAH</a>`1';
isbe[5008]='Jesias`je-si\'-as (Iesias; the King James Version Josias (1Esdras 8:33)): Corresponding to Jeshaiah, son of Athaliah (<a onClick="return mV(\'Ezr\',8,7);">Ezr 8:7</a>).``1';
isbe[5009]='Jesimiel`je-sim\'-i-el (yesimi\'el, "God establishes"): A prince of Simeon (<a onClick="return mV(\'1Ch\',4,36);">1Ch 4:36</a>).``1';
isbe[5010]='Jesse`jes\'-e (yishay, meaning doubtful; according to Gesenius it = "wealthy"; Olshausen, Gram., sections 277f; conjectures yesh yah, "Yahweh exists"; Wellhausen (<a onClick="return mV(\'1Sa\',14,49);">1Sa 14:49</a>) explains it as \'abhishay (see <a href="./study/isbe/search.html?string=ABISHAI">ABISHAI</a>); Iessai; <a onClick="return mV(\'Rth\',4,17,22);">Ru 4:17,22</a>; <a onClick="return mV(\'1Sa\',16,\'1-\');">1Sa 16</a>; <a onClick="return mV(\'1Sa\',17,\'1-\');">17</a>; <a onClick="return mV(\'1Sa\',20,\'1-\');">20</a>; <a onClick="return mV(\'1Sa\',22,\'1-\');">22</a>; <a onClick="return mV(\'1Sa\',25,10);">25:10</a>; <a onClick="return mV(\'2Sa\',20,1);">2Sa 20:1</a>; <a onClick="return mV(\'2Sa\',23,1);">23:1</a>; <a onClick="return mV(\'1Ki\',12,16);">1Ki 12:16</a>; <a onClick="return mV(\'1Ch\',10,14);">1Ch 10:14</a>; <a onClick="return mV(\'1Ch\',12,18);">12:18</a>; <a onClick="return mV(\'Psa\',72,20);">Ps 72:20</a>; <a onClick="return mV(\'Isa\',11,1,10);">Isa 11:1,10</a> (= <a onClick="return mV(\'Rom\',15,12);">Ro 15:12</a>)); <a onClick="return mV(\'Mat\',1,5,6);">Mt 1:5,6</a>; <a onClick="return mV(\'Act\',13,22);">Ac 13:22</a>): Son of Obed, grandson of Boaz, and father of King David. The grouping of the references to Jesse in 1 Samuel is bound up with that of the grouping of the whole narrative of David and Saul. See <a href="./study/isbe/search.html?string=SAMUEL,+BOOKS+OF">SAMUEL, BOOKS OF</a>. There seem to be three main veins in the narrative, so far as Jesse is concerned.<P>(1) In <a onClick="return mV(\'1Sa\',16,\'1-13\');">1Sa 16:1-13</a>, where Jesse is called the Bethlehemite. Samuel is sent to seek among Jesse\'s sons successor to Saul.<P>Both Samuel and Jesse fail to discern at first Yahweh\'s choice, Samuel thinking that it would be the eldest son (<a onClick="return mV(\'1Sa\',16,6);">1Sa 16:6</a>), while Jesse had not thought it worth while to call the youngest to the feast (<a onClick="return mV(\'1Sa\',16,11);">1Sa 16:11</a>).<P>(2) (a) In <a onClick="return mV(\'1Sa\',16,\'14-23\');">1Sa 16:14-23</a>, Saul is mentally disturbed, and is advised to get a harpist. David "the son of Jesse the Bethlehemite" is recommended by a courtier, and Saul sends to Jesse for David.<P>"And Jesse took ten loaves (so emend and translate, and not as the Revised Version (British and American), "an ass laden with bread"), and a (skin) bottle of wine, and a kid, and sent them" to Saul as a present with David, who becomes a courtier of Saul\'s with his father\'s consent.<P>(b) The next mention of Jesse is in three contemptuous references by Saul to David as "the son of Jesse" in <a onClick="return mV(\'1Sa\',20,27,30);">1Sa 20:27,30,31</a>, part of the quarrel-scene between Saul and Jonathan. (But it is not quite certain if <a onClick="return mV(\'1Sa\',20,\'1-\');">1Sa 20</a> belongs to the same source as <a onClick="return mV(\'1Sa\',16,\'14-23\');">16:14-23</A>.) In answer to the first reference, Jonathan calls his friend "David," and Saul repeats the phrase "the son of Jesse," abusing Jonathan personally (<a onClick="return mV(\'1Sa\',20,30);">1Sa 20:30</a>, where the meaning is uncertain). The reference to David as "the son of Jesse" here and in the following verse is contemptuous, not because of any reproach that might attach itself to Jesse, but, as Budde remarks, because "an upstart is always contemptuously referred to under his father\'s name" in courts and society. History repeats itself!<P>(c) Further references of a like kind are in the passage, <a onClick="return mV(\'1Sa\',22,\'6-23\');">1Sa 22:6-23</a>, namely, in <a onClick="return mV(\'1Sa\',22,7,8,13);">22:7,8,13</a> by Saul, and repeated by Doeg in <a onClick="return mV(\'1Sa\',22,9);">22:9</a>.<P>(d) The final one of this group is in <a onClick="return mV(\'1Sa\',25,10);">1Sa 25:10</a>, where Nabal sarcastically asks "Who is David? and who is the son of Jesse?"<P>(3) The parts of <a onClick="return mV(\'1Sa\',17,\'1-\');">1Sa 17</A>-<a onClick="return mV(\'1Sa\',18,\'1-5\');">18:5</a> which are omitted by Septuagint B, i.e. <a onClick="return mV(\'1Sa\',17,\'12-31\',41,48,50,55);">17:12-31,41,48b,50,55</A>-<a onClick="return mV(\'1Sa\',18,\'1-6\');">18:6a</a>. Here Jesse is mentioned as "an Ephrathite of Beth-lehem-judah" (<a onClick="return mV(\'1Sa\',17,12);">17:12</A>, not "that" Ephrathite, which is a grammatically impossible translation of the Massoretic Text), Ephrath or Ephrathah being another name for Bethlehem, or rather for the district. He is further said to have eight sons (<a onClick="return mV(\'1Sa\',17,12);">17:12</a>), of whom the three eldest had followed Saul to the war (<a onClick="return mV(\'1Sa\',17,13);">17:13</A>).<P>Jesse sends David, the shepherd, to his brothers with provisions (<a onClick="return mV(\'1Sa\',17,17);">1Sa 17:17</a>). Afterward David, on being brought to Saul and asked who he is, answers, "I am the son of thy servant Jesse the Bethlehemite" (<a onClick="return mV(\'1Sa\',17,58);">1Sa 17:58</a>). Jesse is also described (<a onClick="return mV(\'1Sa\',17,12);">1Sa 17:12</a>) as being "in the days of Saul an old man, advanced in years" (so emend and translate, not as the Revised Version (British and American), "stricken in years among men"). The mention of his having 8 sons in <a onClick="return mV(\'1Sa\',17,12);">1Sa 17:12</a> is not in agreement with <a onClick="return mV(\'1Ch\',2,\'13-15\');">1Ch 2:13-15</a>, which gives only 7 sons with two sisters, but where Syriac gives 8, adding, from <a onClick="return mV(\'1Sa\',27,18);">27:18</A>, Elihu which Massoretic Text has there probably by corruption (Curtis, Chronicles, 88). <a onClick="return mV(\'1Sa\',16,10);">1Sa 16:10</a> should be translated "and Jesse made his 7 sons to pass before Samuel" (not as the Revised Version (British and American), the King James Version, "seven of his sons"). Budde (Kurz. Hand-Komm., "Samuel," 114) holds <a onClick="return mV(\'1Sa\',16,\'1-13\');">1Sa 16:1-13</a> to be a late Midrash, and (ibid., 123f) omits<P class="in15">(a) "that" in <a onClick="return mV(\'1Sa\',17,12);">17:12</A>;<P class="in15">(b) also "and he had 8 sons" as due to a wrong inference from <a onClick="return mV(\'1Sa\',16,10);">16:10</a>;<P class="in15">(c) the names of the 3 eldest in <a onClick="return mV(\'1Sa\',17,13);">17:13</a>;<P class="in15">(d) <a onClick="return mV(\'1Sa\',17,14);">17:14b</A>; he then changes <a onClick="return mV(\'1Sa\',17,15);">17:15a</a>, and reads thus: (<a onClick="return mV(\'1Sa\',17,12);">12</a>) "Now David was the son of an Ephrathite of Bethlehem-Judah, whose name was Jesse who was ....(years) old at the time of Saul. (<a onClick="return mV(\'1Sa\',17,13);">13</a>) And the 3 eldest sons of Jesse had marched with Saul to the war, (<a onClick="return mV(\'1Sa\',17,14);">14</a>) and David was the youngest, (<a onClick="return mV(\'1Sa\',17,15);">15</A>) and David had remained to feed his father\'s sheep at Bethlehem. (<a onClick="return mV(\'1Sa\',17,16);">16</A>) Now the Philistines came," etc.<P>According to all these narratives in 1 Samuel, whether all 3 be entirely independent of one another or not, Jesse had land in Bethlehem, probably outside the town wall, like Boaz (see <a href="./study/isbe/search.html?string=BOAZ">BOAZ</a>) his grandfather (<a onClick="return mV(\'Rth\',4,17);">Ru 4:17</a>). In <a onClick="return mV(\'1Sa\',22,3,4);">1Sa 22:3,4</a> David entrusts his father and mother to the care of the king of Moab, but from <a onClick="return mV(\'1Sa\',20,29);">20:29</A> some have inferred that Jesse was dead (although most critics assign <a onClick="return mV(\'1Sa\',22,3);">22:3</a> at any rate to the same stratum as chapter <a onClick="return mV(\'1Sa\',20,\'1-\');">20</a>).<P>Jonathan tells Saul that David wanted to attend a family sacrificial feast at Bethlehem (<a onClick="return mV(\'1Sa\',20,29);">1Sa 20:29</a>). Massoretic Text reads, "And he, my brother, has commanded me," whereas we should probably read with Septuagint, "and my brethren have commanded me," i.e. the members of the clan, as we have farther on in the verse, "Let me get away, I pray thee, and see my brethren." As to Jesse\'s daughters, see <a href="./study/isbe/search.html?string=ABIGAIL">ABIGAIL</a>; <a href="./study/isbe/search.html?string=NAHASH">NAHASH</a>.<P>(4) Of the other references to Jesse, the most noteworthy is that in <a onClick="return mV(\'Isa\',11,1);">Isa 11:1</a>: "There shall come forth a shoot out of the stock of Jesse, and a branch out of his roots shall bear fruit," i.e. out of Jesse\'s roots (compare <a onClick="return mV(\'Rev\',5,5);">Re 5:5</a>). "Why Jesse and not David?" asks Duhm; and he answers, "Because the Messiah will be a second David, rather than a descendant of David." Marti explains it to mean that he will be, not from David, but from a collateral line of descent. Duhm\'s explanation suggests a parallelism between David and Christ, of whom the former may be treated as a type similar to Aaron and Melchizedek in He. Saul might pour contempt upon "the son of Jesse," but Isaiah has given Jesse here a name above all Hebrew names, and thus does Providence mock "society."`<a href="./study/isbe/search.html?string=ROOT+OF+JESSE">ROOT OF JESSE</a>`149';
isbe[5011]='Jesting`jest\'-ing: Used from Tyndale down as the translation of eutrapelia (<a onClick="return mV(\'Eph\',5,4);">Eph 5:4</a>). Aristotle uses the original in his Ethics iv.14 as an equivalent of "quick-witted," from its root meaning "something easily turned," adding that, since the majority of people love excessive jesting, the word is apt to be degraded. This is the case here, where it clearly has a flavor of the coarse or licentious.``1';
isbe[5012]='Jesui`jes\'-u-i.`<a href="./study/isbe/search.html?string=ISHVI">ISHVI</a>`1';
isbe[5013]='Jesuites`jes\'-u-its.`<a href="./study/isbe/search.html?string=ISHVI">ISHVI</a>`1';
isbe[5014]='Jesurun`je-su\'-run, jes\'-u-run.`<a href="./study/isbe/search.html?string=JESHURUN">JESHURUN</a>`1';
isbe[5015]='Jesus`je\'-zus (Iesous, for yehoshua\'):<P>(1) Joshua, son of Nun (the King James Version <a onClick="return mV(\'Act\',7,45);">Ac 7:45</a>; <a onClick="return mV(\'Hbr\',4,8);">Heb 4:8</a>; compare 1Macc 2:55; 2Esdras 7:37).<P>(2) (3) High priest and Levite.<P>See <a href="./study/isbe/search.html?string=JESHUA">JESHUA, 2, 5</a>.<P>(4) Son of Sirach.<P>See <a href="./study/isbe/search.html?string=SIRACH">SIRACH</a>.<P>(5) An ancestor of Jesus (<a onClick="return mV(\'Luk\',3,29);">Lu 3:29</a>, the King James Version "Jose").`<a href="./study/isbe/search.html?string=JESUS+CHRIST+1">JESUS CHRIST 1</a>; <a href="./study/isbe/search.html?string=JESUS+CHRIST+2">JESUS CHRIST 2</a>; <a href="./study/isbe/search.html?string=JESUS+CHRIST+3">JESUS CHRIST 3</a>`1';
isbe[5016]='Jesus Christ, 1 Outline`je\'-zus krist (Iesous Christos):<p><b>I. THE NAMES</b><p><b>II. ORDER OF TREATMENT</b><p><b>PART I. INTRODUCTORY</b><p><b>I. THE SOURCES</b><P class="in15">1. In General<P class="in15">2. Denial of Existence of Jesus<P class="in15">3. Extra-Christian Notices<P class="in15">4. The Gospels<P class="in30">(1) The Synoptics<P class="in30">(2) The Fourth Gospel<p><b>II. THE PREPARATION</b><P class="in15">1. Both Gentile and Jewish<P class="in15">2. Old Testament Preparation<P class="in15">3. Post-exilic Preparation<p><b>III. THE OUTWARD SITUATION</b><P class="in15">1. The Land<P class="in30">Its Divisions<P class="in15">2. Political Situation<P class="in30">Changes in Territory<P class="in15">3. The Religious Sects<P class="in30">(1) The Scribes<P class="in30">(2) The Pharisees<P class="in30">(3) The Sadducees<P class="in30">(4) The Essenes<p><b>IV. THE CHRONOLOGY</b><P class="in15">1. Date of the Birth of Jesus<P class="in15">2. Date of His Baptism<P class="in15">3. Length of Ministry<P class="in15">4. Date of Christ\'s Death<p><b>PART II. THE PROBLEMS OF THE LIFE OF JESUS</b><p><b>I. THE MIRACLES</b><P class="in15">1. The "Modern" Attitude<P class="in15">2. Supernatural in the Gospels<p><b>II. THE MESSIAHSHIP</b><P class="in15">1. Reserve of Jesus and Modern Criticism<P class="in15">2. A Growing Revelation<p><b>III. KINGDOM AND APOCALYPSE</b><P class="in15">1. The Kingdom—Present or Future?<P class="in15">2. Apocalyptic Beliefs<p><b>IV. THE CHARACTER AND CLAIMS</b><P class="in15">1. Denial of Christ\'s Moral Perfection<P class="in15">2. Sinlessness and the Messianic Claim<p><b>PART III. COURSE OF THE EARTHLY LIFE OF JESUS</b><P class="in15">1. Divisions of the History<P class="in15">2. Not a Complete "Life"<p><b>A. FROM THE NATIVITY TO THE BAPTISM AND TEMPTATION</b><p><b>I. THE NATIVITY</b><P class="in15">1. Hidden Piety in Judaism<P class="in15">2. Birth of the Baptist<P class="in15">3. The Annunciation and Its Results<P class="in15">4. The Birth at Bethlehem<P class="in30">(1) The Census of Quirinius<P class="in30">(2) Jesus Born<P class="in15">5. The Incidents of the Infancy<P class="in30">(1) The Visit of the Shepherds<P class="in30">(2) The Circumcision and Presentation in the Temple<P class="in30">(3) Visit of the Magi<P class="in15">6. Flight to Egypt and Return to Nazareth<P class="in15">7. Questions and Objections<P class="in30">(1) The Virgin Birth<P class="in30">(2) The Genealogies<p><b>II. THE YEARS OF SILENCE—THE TWELFTH YEAR</b><P class="in15">1. The Human Development<P class="in15">2. Jesus in the Temple<p><b>IlI. THE FORERUNNER AND THE BAPTISM</b><P class="in15">1. The Preaching of John<P class="in30">The Coming Christ<P class="in15">2. Jesus Is Baptized<p><b>IV. THE TEMPTATION</b><P class="in15">1. Temptation Follows Baptism<P class="in15">2. Nature of the Temptation<P class="in15">3. Stages of the Temptation<P class="in30">Its Typical Character<p><b>B. THE EARLY JUDAEAN MINISTRY</b><p><b>I. THE TESTIMONIES OF THE BAPTIST</b><P class="in15">1. The Synoptics and John<P class="in15">2. Threefold Witness of the Baptist<p><b>II. THE FIRST DISCIPLES</b><P class="in15">1. Spiritual Accretion<P class="in15">2. "Son of Man" and "Son of God"<p><b>III. THE FIRST EVENTS</b><P class="in15">1. The First Miracle<P class="in15">2. The First Passover, and Cleansing of the Temple<P class="in15">3. The Visit of Nicodemus<P class="in15">4. Jesus and John<p><b>IV. JOURNEY TO GALILEE—THE WOMAN OF SAMARIA</b><P class="in15">1. Withdrawal to Galilee<P class="in15">2. The Living Water<P class="in15">3. The True Worship<P class="in15">4. Work and Its Reward<p><b>C. THE GALILEAN MINISTRY AND VISITS TO THE FEASTS</b><P class="in15">1. The Scene<P class="in15">2. The Time<P><b>FIRST PERIOD—FROM THE BEGINNING OF THE MINISTRY IN GALILEE TILL THE MISSION OF THE TWELVE</b><p><b>I. OPENING INCIDENTS</b><P class="in15">1. Healing of Nobleman\'s Son<P class="in15">2. The Visit to Nazareth<P class="in15">3. Call of the Four Disciples<P class="in15">4. At Capernaum<P class="in45">a) Christ\'s Teaching<P class="in45">b) The Demoniac in the Synagogue<P class="in60">Demon-Possession: Its Reality<P class="in45">c) Peter\'s Wife\'s Mother<P class="in45">d) The Eventful Evening<p><b>II. FROM THE FIRST GALILEAN CIRCUIT TILL THE CHOICE OF THE APOSTLES</b><P class="in15">1. The First Circuit<P class="in15">2. Capernaum Incidents<P class="in45">a) Cure of the Paralytic<P class="in45">b) Call and Feast of Matthew<P class="in15">3. The Unnamed Jerusalem Feast<P class="in45">a) The Healing at Bethesda<P class="in45">b) Son and Father<P class="in45">c) The Threefold Witness<P class="in15">4. Sabbath Controversies<P class="in45">a) Plucking of the Ears of Grain<P class="in45">b) The Man with the Withered Hand<P class="in45">c) Withdrawal to the Sea<P class="in15">5. The Choosing of the Twelve<P class="in45">a) The Apostolic Function<P class="in45">b) The Lists<P class="in45">c) The Men<p><b>III. FROM THE SERMON ON THE MOUNT WILL THE PARABLES OF THE KINGDOM—A SECOND CIRCUIT</b><P class="in15">1. The Sermon on the Mount<P class="in45">a) The Blessings<P class="in45">b) True Righteousness—the Old and the New Law<P class="in45">c) Religion and Hypocrisy—True and False Motive<P class="in45">d) The True Good and Cure for Care<P class="in45">e) Relation to the World\'s Evil—the Conclusion<P class="in15">2. Intervening Incidents<P class="in45">a) Healing of the Centurion\'s Servant<P class="in45">b) The Widow of Nain\'s Son Raised<P class="in45">c) Embassy of John\'s Disciples—Christ and His Generation<P class="in45">d) The First Anointing—the Woman who Was a Sinner<P class="in15">3. Second Galilean Circuit—Events at Capernaum<P class="in45">a) Galilee Revisited<P class="in45">b) Cure of Demoniac—Discourse on Blasphemy<P class="in60">The Sign of Jonah<P class="in45">c) Christ\'s Mother and Brethren<P class="in15">4. Teaching in Parables<P class="in45">Parables of the Kingdom<p><b>IV. FROM THE CROSSING TO GADARA TO THE MISSION OF THE TWELVE—A THIRD CIRCUIT</b><P class="in15">1. Crossing of the Lake—Stilling of the Storm<P class="in45">a) Aspirants for Discipleship<P class="in45">b) The Storm Calmed<P class="in15">2. The Gadarene (Gerasene) Demoniac<P class="in15">3. Jairus\' Daughter Raised—Woman with Issue of Blood<P class="in45">a) Jairus\' Appeal and Its Result<P class="in45">b) The Afflicted Woman Cured<P class="in15">4. Incidents of Third Circuit<P class="in15">5. The Twelve Sent Forth—Discourse of Jesus<P class="in45">a) The Commission<P class="in45">b) Counsels and Warnings<P><b>SECOND PERIOD—AFTER THE MISSION OF THE TWELVE TILL THE DEPARTURE FROM GALILEE</b><p><b>I. FROM THE DEATH OF THE BAPTIST TILL THE DISCOURSE ON THE BREAD OF LIFE</b><P class="in15">1. The Murder of the Baptist and Herod\'s Alarms<P class="in15">2. The Feeding of the Five Thousand<P class="in15">3. Walking on the Sea<P class="in15">4. Gennesaret—Discourse on the Bread of Life<P class="in30">Peter\'s First Confession<p><b>II. FROM DISPUTES WITH THE PHARISEES TILL THE TRANSFIGURATION</b><P class="in15">1. Jesus and Tradition—Outward and Inward Purity<P class="in15">2. Retirement to Tyre and Sidon—the Syrophoenician Woman<P class="in15">3. At Decapolis—New Miracles<P class="in45">a) The Deaf Man<P class="in45">b) Feeding of the Four Thousand<P class="in15">4. Leaven of the Pharisees, etc.—Cure of Blind Man<P class="in15">5. At Caesarea Philippi—the Great Confession—First Announcement of Passion<P class="in15">6. The Transfiguration—the Epileptic Boy<p><b>III. FROM PRIVATE JOURNEY THROUGH GALILEE TILL RETURN FROM THE FEAST OF TABERNACLES</b><P class="in15">1. Galilee and Capernaum<P class="in45">a) Second Announcement of the Passion<P class="in45">b) The Temple Tax<P class="in45">c) Discourse on Greatness and Forgiveness<P class="in30">(1) Greatness in Humility<P class="in30">(2) Tolerance<P class="in30">(3) The Erring Brother<P class="in30">(4) Parable of Unmerciful Servant<P class="in15">2. The Feast of Tabernacles—Discourses, etc.<P class="in45">a) The Private Journey—Divided Opinions<P class="in45">b) Christ\'s Self-Witness<P class="in45">c) The Woman Taken in Adultery<P class="in45">d) The Cure of the Blind Man.<P class="in45">e) The Good Shepherd<P class="in15">Chronological Note<p><b>D. LAST JOURNEY TO JERUSALEM—JESUS IN PERAEA</b><p><b>I. FROM LEAVING GALILEE TILL THE FEAST OF THE DEDICATION</b><P class="in15">1. Rejected by Samaria<P class="in15">2. Mission of the Seventy<P class="in15">3. The Lawyer\'s Question—Parable of Good Samaritan<P class="in15">4. Discourses, Parables, and Miracles<P class="in45">a) Original to Luke<P class="in45">b) The Infirm Woman—the Dropsied Man<P class="in45">c) Parable of the Great Supper<P class="in45">d) Counting the Cost<P class="in15">5. Martha and Mary<P class="in15">6. Feast of the Dedication<p><b>II. FROM THE ABODE AT BETHABARA TILL THE RAISING OF LAZARUS</b><P class="in15">1. Parables of Lost Sheep, Lost Piece of Silver and Prodigal Son<P class="in15">2. Parables of the Unjust Steward and the Rich Man and Lazarus<P class="in15">3. The Summons to Bethany—Raising of Lazarus<p><b>III. FROM THE RETIREMENT TO EPHRAIM TILL THE ARRIVAL AT BETHANY</b><P class="in15">1. Retreat to Ephraim<P class="in15">2. The Journey Resumed<P class="in15">3. Cure of the Lepers<P class="in15">4. Pharisaic Questionings<P class="in45">a) Divorce<P class="in45">b) Coming of the Kingdom<P class="in45">c) Parable of the Unjust Judge<P class="in15">5. The Spirit of the Kingdom<P class="in45">a) Parable of Pharisee and Publican<P class="in45">b) Blessing of the Babies<P class="in45">c) The Rich Young Ruler<P class="in15">6. Third Announcement of the Passion<P class="in15">7. The Rewards of the Kingdom<P class="in45">a) Parable of the Laborers in the Vineyard<P class="in45">b) The Sons of Zebedee<P class="in15">8. Jesus at Jericho<P class="in45">a) The Cure of Bartimeus<P class="in45">b) Zaccheus the Publican<P class="in45">c) Parable of the Pounds<P class="in30">Arrival at Bethany<p><b>E. THE PASSION WEEK—BETRAYAL, TRIAL, AND CRUCIFIXION</b><p><b>I. THE EVENTS PRECEDING THE LAST SUPPER</b><P class="in15">1. The Chronology<P class="in15">2. The Anointing at Bethany<P class="in15">3. The Entry into Jerusalem<P class="in30">Jesus Weeping over Jerusalem—Return to Bethany<P class="in15">4. Cursing of the Fig Tree—Second Cleansing of the Temple<P class="in30">Were There Two Cleansings?<P class="in15">5. The Eventful Tuesday<P class="in45">a) The Demand for Authority—Parables<P class="in60">The Two Sons—the Wicked Husbandmen—the Marriage of the King\'s Son<P class="in45">b) Ensnaring Questions, etc.<P class="in60">(1) Tribute to Caesar—the Resurrection—the Great Commandment<P class="in60">(2) David\'s Son and Lord<P class="in45">c) The Great Denunciation<P class="in45">d) The Widow\'s Offering<P class="in60">e) The Visit of the Greeks<P class="in45">f) Discourse on the Last Things<P class="in45">g) Parables of Ten Virgins, Talents and Last Judgment<P class="in15">6. A Day of Retirement<P class="in15">7. An Atmosphere of Plotting—Judas and the Priests<p><b>II. FROM THE LAST SUPPER TILL THE CROSS</b><P class="in15">1. The Chronology<P class="in15">2. The Last Supper<P class="in45">a) The Preparation<P class="in45">b) Dispute about Precedence—Washing of the Disciples\' Feet—Departure of Judas<P class="in45">c) The Lord\'s Supper<P class="in45">d) The Last Discourses—Intercessory Prayer<P class="in45">e) The Departure and Warning<P class="in15">3. Gethsemane—the Betrayal and Arrest<P class="in45">a) Agony in the Garden<P class="in45">b) Betrayal by Judas—Jesus Arrested<P class="in15">4. Trial before the Sanhedrin<P class="in30">Legal and Historical Aspects<P class="in45">a) Before Annas and Caiaphas—the Unjust Judgment<P class="in45">b) The Threefold Denial<P class="in45">c) Remorse and Suicide of Judas<P class="in15">5. Trial before Pilate<P class="in45">a) The Attitude of the Accusers<P class="in45">b) The Attitude of Pilate<P class="in60">(1) Jesus Sent to Herod<P class="in60">(2) "Not This Man, but Barabbas"<P class="in60">(3) "Ecce Homo"<P class="in60">(4) A Last Appeal—Pilate Yields<P class="in45">c) The Attitude of Jesus<p><b>III. THE CRUCIFIXION AND BURIAL</b><P class="in15">1. The Crucifixion<P class="in45">a) On the Way<P class="in45">b) Between the Thieves—the Superscription—the Seamless Robe<P class="in45">c) The Mocking—the Penitent Thief—Jesus and His Mother<P class="in45">d) The Great Darkness—the Cry of Desertion<P class="in45">e) Last Words and Death of Jesus<P class="in45">f) The Spear-Thrust—Earthquake and Rending of the Veil<P class="in15">2. The Burial<P class="in45">a) The New Tomb<P class="in45">b) The Guard of Soldiers<p><b>F. THE RESURRECTION AND ASCENSION</b><P>The Resurrection a Fundamental Fact<P class="in15">1. The Resurrection<P class="in30">a) The Easter Morning—the Open Tomb<P class="in45">(1) The Angel and the Keepers<P class="in45">(2) Visit of the Women<P class="in45">(3) The Angelic Message<P class="in30">b) Visit of Peter and John—Appearance to Mary<P class="in45">Report to the Disciples—Incredulity<P class="in30">c) Other Easter-Day Appearances (Emmaus, Jerusalem)<P class="in30">d) The Second Appearance to the Eleven—the Doubt of Thomas<P class="in30">e) The Galilean Appearances<P class="in45">(1) At the Sea of Tiberias—the Draught of Fish—Peter\'s Restoration<P class="in45">(2) On the Mountain—the Great Commission—Baptism<P class="in30">f) Appearance to James<P class="in30">g) The Last Meeting<P class="in15">2. The Ascension<p><b>PART IV. EPILOGUE: THE APOSTOLIC TEACHING</b><P class="in15">1. After the Ascension<P class="in15">2. Revelation through the Spirit<P class="in15">3. Gospels and Epistles<P class="in15">4. Fact of Christ\'s Lordship<P class="in15">5. Significance of Christ\'s Person<P class="in15">6. Significance of the Cross and Resurrection<P class="in15">7. Hope of the Advent<p><b>LITERATURE</b><hr />``132';
isbe[5017]='Jesus Christ, 2`<P>Jesus Christ: The Founder of the Christian religion; the promised Messiah and Saviour of the world; the Lord and Head of the Christian church.<P>I. The Names.<P>1. Jesus:<P>(Iesous) is the Greek equivalent of the Hebrew "Joshua" (yehoshua\'), meaning "Yahweh is salvation." It stands therefore in the Septuagint and Apocrypha for "Joshua," and in <a onClick="return mV(\'Act\',7,45);">Ac 7:45</a> and <a onClick="return mV(\'Hbr\',4,8);">Heb 4:8</a> likewise represents the Old Testament Joshua; hence, in the Revised Version (British and American) is in these passages rendered "Joshua." In <a onClick="return mV(\'Mat\',1,21);">Mt 1:21</a> the name as commanded by the angel to be given to the son of Mary, "for it is he that shall save his people from their sins" (see below on "Nativity"). It is the personal name of the Lord in the Gospels and the Acts, but generally in the Epistles appears in combination with "Christ" or other appellative (alone in <a onClick="return mV(\'Rom\',3,26);">Ro 3:26</a>; <a onClick="return mV(\'Rom\',4,24);">4:24</a>; <a onClick="return mV(\'1Cr\',12,3);">1Co 12:3</a>; <a onClick="return mV(\'2Cr\',11,4);">2Co 11:4</a>; <a onClick="return mV(\'Phl\',2,10);">Php 2:10</a>; <a onClick="return mV(\'1Th\',4,14);">1Th 4:14</a>; <a onClick="return mV(\'Hbr\',7,22);">Heb 7:22</a>; <a onClick="return mV(\'Hbr\',10,19);">10:19</a>, etc.).<P>2. Christ:<P>(Christos) is the Greek equivalent of the Hebrew "Messiah" (mashiach; compare in the New Testament, <a onClick="return mV(\'Jhn\',1,41);">Joh 1:41</a>; <a onClick="return mV(\'Jhn\',4,25);">4:25</a>, "Messiah"), meaning "anointed" (see <a href="./study/isbe/search.html?string=MESSIAH">MESSIAH</a>). It designates Jesus as the fulfiller of the Messianic hopes of the Old Testament and of the Jewish people. It will be seen below that Jesus Himself made this claim. After the resurrection it became the current title for Jesus in the apostolic church. Most frequently in the Epistles He is called "Jesus Christ," sometimes "Christ Jesus" (<a onClick="return mV(\'Rom\',8,1,2,39);">Ro 8:1,2,39</a>; <a onClick="return mV(\'1Cr\',1,2,30);">1Co 1:2,30</a>; <a onClick="return mV(\'1Cr\',4,15);">4:15</a>; <a onClick="return mV(\'Eph\',1,1);">Eph 1:1</a>; <a onClick="return mV(\'Phl\',1,1);">Php 1:1</a>; <a onClick="return mV(\'Col\',1,4,28);">Col 1:4,28</a> the King James Version; <a onClick="return mV(\'1Th\',2,14);">1Th 2:14</a>, etc.), often "Christ" alone (<a onClick="return mV(\'Rom\',1,16);">Ro 1:16</a> the King James Version; <a onClick="return mV(\'Rom\',5,6,8);">Ro 5:6,8</a>; <a onClick="return mV(\'Rom\',6,4,8,9);">6:4,8,9</a>; <a onClick="return mV(\'Rom\',8,10);">8:10</a>, etc.). In this case "Christ" has acquired the force of a proper name. Very frequently the term is associated with "Lord" (kurios)—"the (or "our") Lord Jesus Christ" (<a onClick="return mV(\'Act\',11,17);">Ac 11:17</a>; <a onClick="return mV(\'Act\',15,11);">15:11</a> the King James Version; <a onClick="return mV(\'Act\',16,31);">Ac 16:31</a> the King James Version; <a onClick="return mV(\'Act\',20,21);">Ac 20:21</a>; <a onClick="return mV(\'Act\',28,31);">28:31</a>; <a onClick="return mV(\'Rom\',1,7);">Ro 1:7</a>; <a onClick="return mV(\'Rom\',5,1,11);">5:1,11</a>; <a onClick="return mV(\'Rom\',13,14);">13:14</a>; <a onClick="return mV(\'1Cr\',16,23);">1Co 16:23</a>, etc.).<P>II. Order of Treatment.<P>In studying, as it is proposed to do in this article, the earthly history of Jesus and His place in the faith of the apostolic church, it will be convenient to pursue the following order:<P>First, as introductory to the whole study, certain questions relating to the sources of our knowledge of Jesus, and to the preparation for, and circumstances of, His historical appearance, invite careful attention (Part I).<P>Next, still as preliminary to the proper narrative of the life of Jesus, it is desirable to consider certain problems arising out of the presentation of that life in the Gospels with which modern thought is more specially concerned, as determining the attitude in which the narratives are approached. Such are the problems of the miracles, the Messiahship, the sinless character and supernatural claims of Jesus (Part II).<P>The way is then open for treatment in order of the actual events of Christ\'s life and ministry, so far as recorded. These fall into many stages, from His nativity and baptism till His death, resurrection and ascension (Part III).<P>A final division will deal with Jesus as the exalted Lord in the aspects in which He is presented in the teaching of the Epistles and remaining writings of the New Testament (Part IV).<P>PART I. INTRODUCTORY<P>I. The Sources.<P>1. In General:<P>The principal, and practically the only sources for our knowledge of Jesus Christ are the four Canonical Gospels—distinction being made in these between the first three (Synoptic) Gospels, and the Gospel of John. Nothing, either in the few notices of Christ in non-Christian authors, or in the references in the other books of the New Testament, or in later Christian literature, adds to the information which the Gospels already supply. The so-called apocryphal Gospels are worthless as authorities (see under the word); the few additional sayings of Christ (compare <a onClick="return mV(\'Act\',20,35);">Ac 20:35</a>) found in outside writings are of doubtful genuineness (compare a collection of these in Westcott\'s Introduction to the Study of the Gospels, Appendix C; see also <a href="./study/isbe/search.html?string=LOGIA">LOGIA</a>).<P>2. Denial of Existence of Jesus:<P>It marks the excess to which skepticism has gone that writers are found in recent years who deny the very existence of Jesus Christ (Kalthoff, Das Christus-Problem, and Die Entstehung des Christenthums; Jensen, Das Gilgamesch-Epos, I; Drews, Die Christusmythe; compare on Kalthoff, Schweitzer, The Quest of the Historical Jesus, English translation, 313ff; Jensen is reviewed in the writer\'s The Resurrection of Jesus, chapter ix). The extravagance of such skepticism is its sufficient refutation.<P>3. Extra-Christian Notices:<P>Of notices outside the Christian circles the following may be referred to.<P>(1) Josephus.<P>There is the famous passage in Josephus, Ant, XVIII, iii, 3, commencing, "Now there was about this time, Jesus, a wise man, if it be lawful to call him a man," etc. It is not unlikely that Josephus had some reference to Jesus, but most agree that the passage in question, if not entirely spurious, has been the subject of Christian interpolation (on the lit. and different views, see Schurer, Jewish People in the Time of Christ, Div II, volume II, 143ff; in support of interpolation, Edersheim on "Josephus," in Dictionary of Christ. Biography).<P>(2) Tacitus.<P>The Roman historian, Tacitus, in a well-known passage relating to the persecution of Nero (Ann. xv.44), tells how the Christians, already "a great multitude" (ingens multitudo), derived their name "from one Christus, who was executed in the reign of Tiberius by the procurator of Judea, Pontius Pilate."<P>(3) Suetonius also, in his account of Claudius, speaks of the Jews as expelled from Rome for the raising of tumults at the instigation of one "Chrestus" (impulsore Chresto), plainly a mistake for "Christus." The incident is doubtless that referred to in <a onClick="return mV(\'Act\',18,2);">Ac 18:2</a>. 4. The Gospels:<P>The four Gospels, then, with their rich contents, remain as our primary sources for the knowledge of the earthly life of Jesus.<P>(1) The Synoptics.<P>It may be taken for granted as the result of the best criticism that the first three Gospels (Matthew, Mark, Luke) all fall well within the apostolic age (compare Harnack, Altchr. Lit., Pref; see <a href="./study/isbe/search.html?string=GOSPELS">GOSPELS</a>). The favorite theory at present of the relations of these Gospels is, that Mark is an independent Gospel, resting on the teaching of Peter; that Matthew and Luke have as sources the Gospel of Mark and a collection of discourses, probably attributable to the apostle Matthew (now commonly called Q); and that Luke has a third, well-authenticated source (<a onClick="return mV(\'Luk\',1,\'1-4\');">Lu 1:1-4</a>) peculiar to himself. The present writer is disposed to allow more independence to the evangelists in the embodying of a tradition common to all; in any case, the sources named are of unexceptionable authority, and furnish a strong guaranty for the reliability of the narratives. The supreme guaranty of their trustworthiness, however, is found in the narratives themselves; for who in that (or any) age could imagine a figure so unique and perfect as that of Jesus, or invent the incomparable sayings and parables that proceeded from His lips? Much of Christ\'s teaching is high as heaven above the minds of men still.<P>(2) The Fourth Gospel.<P>The Fourth Gospel stands apart from the Synoptics in dealing mainly with another set of incidents (the Jerusalem ministry), and discourses of a more private and intimate kind than those belonging to the Galilean teaching. Its aim, too, is doctrinal—to show that Jesus is "the Son of God," and its style and mode of conception are very different from those of the Synoptic Gospels. Its contents touch their narratives in only a few points (as in <a onClick="return mV(\'Jhn\',6,\'4-21\');">Joh 6:4-21</a>). Where they do, the resemblance is manifest. It is obvious that the reminiscences which the Gospel contains have been long brooded over by the apostle, and that a certain interpretative element blends with his narration of incidents and discourses. This, however, does not warrant us in throwing doubt, with so many, on the genuineness of the Gospel, for which the external evidence is exceptionally strong (compare Sanday, The Criticism of the Fourth Gospel; Drummond, Character and Authorship of the Fourth Gospel; and see <a href="./study/isbe/search.html?string=JOHN,+GOSPEL+OF">JOHN, GOSPEL OF</a>). The Gospel is accepted here as a genuine record of the sayings and doings of Jesus which it narrates.<P>II. The Preparation.<P>1. Both Gentile and Jewish:<P>In the Gospels and throughout the New Testament Jesus appears as the goal of Old Testament revelation, and the point to which all providential developments tended. He came, Paul says, in "the fullness of the time" (<a onClick="return mV(\'Gal\',4,4);">Ga 4:4</a>). It has often been shown how, politically, intellectually, morally, everything in the Greco-Roman world was ready for such a universal religion as Jesus brought into it (compare Baur\'s Hist of the Church in the First Three Cents., English translation, chapter i). The preparation in Israel is seen alike in God\'s revelations to, and dealings with, the chosen people in the patriarchal, Mosaic, monarchical and prophetic periods, and in the developments of the Jewish mind in the centuries immediately before Christ.<P>2. Old Testament Preparation:<P>As special lines in the Old Testament preparation may be noted the ideas of the Messianic king, a ruler of David\'s house, whose reign would be righteous, perpetual, universal (compare <a onClick="return mV(\'Isa\',7,13);">Isa 7:13-9:7</a>; <a onClick="return mV(\'Isa\',32,1,2);">32:1,2</a>; <a onClick="return mV(\'Jer\',33,15,16);">Jer 33:15,16</a>; <a onClick="return mV(\'Psa\',2,\'1-10\');">Ps 2:1-10</a>, etc.); of a Righteous Sufferer (<a onClick="return mV(\'Psa\',22,\'1-\');">Ps 22</a>, etc.), whose sufferings are in <a onClick="return mV(\'Isa\',53,\'1-\');">Isa 53</a> declared to have an expiatory and redeeming character; and of a Messianic kingdom, which, breaking the bounds of nationalism, would extend through the whole earth and embrace all peoples (compare <a onClick="return mV(\'Isa\',60,\'1-\');">Isa 60</a>; <a onClick="return mV(\'Psa\',87,\'1-\');">Ps 87</a>; <a onClick="return mV(\'Dan\',2,44);">Da 2:44</a>; <a onClick="return mV(\'Dan\',7,27);">7:27</a>, etc.). The kingdom, at the same time, is now conceived of under a more spiritual aspect. Its chief blessings are forgiveness and righteousness.<P>3. Post-exilian Preparation:<P>The age succeeding the return from exile witnessed a manifold preparation for the advent of Christ. Here may be observed the decentralization of the Jewish religious ideals through the rise of synagogue worship and the widespread dispersion of the race; the contact with Hellenic culture (as in Philo); but especially the marked sharpening of Messianic expectations. Some of these were of a crude apocalyptic character (see <a href="./study/isbe/search.html?string=APOCALYPTIC+LITERATURE">APOCALYPTIC LITERATURE</a>; <a href="./study/isbe/search.html?string=ESCHATOLOGY+OF+THE+OLD+TESTAMENT">ESCHATOLOGY OF THE OLD TESTAMENT</a>); many were political and revolutionary; but some were of a purer and more spiritual kind (compare <a onClick="return mV(\'Luk\',2,25,38);">Lu 2:25,38</a>). To these purer elements Jesus attached Himself in His preaching of the kingdom and of Himself as its Lord. Even in the Gentile world, it is told, there was an expectation of a great One who about this time would come from Judea (Tacitus, History v.13; Suet. Vespas. 4).<P>III. The Outward Situation.<P>1. The Land:<P>Of all lands Palestine was the most fitted to be the scene of the culminating revelation of God\'s grace in the person and work of Jesus Christ, as before it was fitted to be the abode of the people chosen to receive and preserve the revelations that prepared the way for that final manifestation. At once central and secluded—at the junction of the three great continents of the Old World, Asia, Africa and Europe—the highway of nations in war and commerce—touching mighty powers on every hand, Egypt, Syria, Assyria, kingdoms of Asia Minor, as formerly more ancient empires, Hittite and Babylonian, now in contact with Greece and Rome, yet singularly enclosed by mountain, desert, Jordan gorge, and Great Sea, from ready entrance of foreign influences, Palestine has a place of its own in the history of revelation, which only a Divine wisdom can have given it (compare Stanley, Sinai and Palestine, Part II, chapter ii; G.A. Smith, Hist. Geog. of the Holy Land, Book I, chapters i, ii; Lange, Life of Christ, I, 246ff).<P>Its Divisions.<P>Palestine, in the Roman period, was divided into four well-defined provinces or districts—Judaea, with Jerusalem as its center, in the south, the strong-hold of Jewish conservatism; Samaria, in the middle, peopled from Assyrian times by mixed settlers (<a onClick="return mV(\'2Ki\',17,\'24-34\');">2Ki 17:24-34</a>), preponderatingly heathen in origin, yet now professing the Jewish religion, claiming Jewish descent (compare <a onClick="return mV(\'Jhn\',4,12);">Joh 4:12</a>), possessing a copy of the law (Samaritan Pentateuch), and a temple of their own at Gerizim (the original temple, built by Manasseh, circa 409 BC, was destroyed by John Hyrcanus, 109 BC); Galilee—"Galilee of the Gentiles" (<a onClick="return mV(\'Mat\',4,15);">Mt 4:15</a>; compare <a onClick="return mV(\'Isa\',9,1);">Isa 9:1</a>)—in the north, the chief scene of Christ\'s ministry, freer and more cosmopolitan in spirit, through a large infusion of Gentile population, and contact with traders, etc., of varied nationalities: these in Western Palestine, while on the east, "beyond Jordan," was Peraea, divided up into Peraea proper, Batanea, Gaulonitis, Ituraea, Trachonitis, Decapolis, etc. (compare <a onClick="return mV(\'Mat\',4,25);">Mt 4:25</a>; <a onClick="return mV(\'Mat\',19,1);">19:1</a>; <a onClick="return mV(\'Luk\',3,1);">Lu 3:1</a>). The feeling of bitterness between Jews and Samaritans was intense (<a onClick="return mV(\'Jhn\',4,9);">Joh 4:9</a>). The language of the people throughout was <a href="./study/isbe/search.html?string=ARAMAIC">ARAMAIC</a> (which see), but a knowledge of the Greek tongue was widely diffused, especially in the north, where intercourse with Greek-speaking peoples was habitual (the New Testament writings are in Greek). Jesus doubtless used the native dialect in His ordinary teaching, but it is highly probable that He also knew Greek, and was acquainted with Old Testament Scriptures in that language (the Septuagint). In this case He may have sometimes used it in His preaching (compare Roberts, Discussions on the Gospels).<P>2. Political Situation:<P>The miserable story of the vicissitudes of the Jewish people in the century succeeding the great persecution of Antiochus Epiphanes and the Maccabean revolt—a story made up of faction, intrigue, wars, murders, massacres, of growing degeneracy of rulers and nation, of repeated sackings of Jerusalem and terrible slaughters—till Herod, the Idumean, misnamed "the Great," ascended the throne by favor of the Romans (37 BC), must be read in the books relating to the period (Ewald, History of Israel, V; Milman, Hist of Jews; Schurer, History of the Jewish People in Time of Christ, Div I, Vol I; Stanley, Jewish Church, III, etc.). Rome\'s power, first invited by Judas Maccabeus (161 BC), was finally established by Pompey\'s capture of Jerusalem (63 BC). Herod\'s way to the throne was tracked by crime and bloodshed, and murder of those most nearly related to him marked every step in his advance. His taste for splendid buildings—palace, temple (<a onClick="return mV(\'Mat\',24,1);">Mt 24:1</a>; <a onClick="return mV(\'Jhn\',2,20);">Joh 2:20</a>), fortresses, cities (Sebaste, Caesarea, etc.)—and lavish magnificence of his royal estate and administration, could not conceal the hideousness of his crafty, unscrupulous selfishness, his cold-blooded cruelty, his tyrannous oppression of his subjects. "Better be Herod\'s hog (hus) than his son (huios)," was the comment of Augustus, when he heard of the dying king\'s unnatural doings.<P>Changes in Territory.<P>At the time of Christ\'s birth, the whole of Palestine was united under Herod\'s rule, but on Herod\'s death, after a long reign of 37 (or, counting from his actual accession, 34) years, his dominions were, in accordance with his will, confirmed by Rome, divided. Judea and Samaria (a few towns excepted) fell to his son Archelaus (<a onClick="return mV(\'Mat\',2,22);">Mt 2:22</a>), with the title of "ethnarch"; Galilee and Perea were given to Herod Antipas, another son, with the title of "tetrarch" (<a onClick="return mV(\'Mat\',14,1);">Mt 14:1</a>; <a onClick="return mV(\'Luk\',3,1,19);">Lu 3:1,19</a>; <a onClick="return mV(\'Luk\',23,7);">23:7</a>; <a onClick="return mV(\'Act\',13,1);">Ac 13:1</a>); Herod Philip, a third son, received Iturea, Trachonitis, and other parts of the Northern trans-Jordanic territory, likewise as "tetrarch" (<a onClick="return mV(\'Luk\',3,1);">Lu 3:1</a>; compare <a onClick="return mV(\'Mat\',14,3);">Mt 14:3</a>; <a onClick="return mV(\'Mar\',6,17);">Mr 6:17</a>). A few years later, the tyranny of Archelaus provoked an appeal of his subjects to Augustus, and Archelaus, summoned to Rome, was banished to Gaul (7 AD). Thereafter Judea, with Samaria, was governed by a Roman procurator, under the oversight of the prefect of Syria.<P>3. The Religious Sects:<P>In the religious situation the chief fact of interest is the place occupied and prominent part played by the religious sects—the <a href="./study/isbe/search.html?string=Pharisees">Pharisees</a>, the <a href="./study/isbe/search.html?string=SADDUCEES">Sadducees</a>, and (though unmentioned in the Gospels, these had an important influence on the early history of the church) the <a href="./study/isbe/search.html?string=ESSENES">Essenes</a>. The rise and characteristics of these sects can here only be alluded to (see special articles).<P>(1) The Scribes.<P>From the days of Ezra zealous attention had been given to the study of the law, and an order of men had arisen—the "scribes"—whose special business it was to guard, develop and expound the law. Through their labors, scrupulous observance of the law, and, with it, of the innumerable regulations intended to preserve the law, and apply it in detail to conduct (the so-called "tradition of the elders," <a onClick="return mV(\'Mat\',15,2);">Mt 15:2</a>ff), became the ideal of righteousness. The sects first appear in the Maccabean age. The Maccabean conflict reveals the existence of a party known as the "Assidaeans" (Hebrew chacidhim), or "pious" ones, opposed to the lax Hellenizing tendencies of the times, and staunch observers of the law. These in the beginning gave brave support to Judas Maccabeus, and doubtless then embraced the best elements of the nation.<P>(2) The Pharisees.<P>From them, by a process of deterioration too natural in such cases, developed the party of legalists known in the Gospels as the "Pharisees" ("separated"), on which Christ\'s sternest rebukes fell for their self-righteousness, ostentation, pride and lack of sympathy and charity (<a onClick="return mV(\'Mat\',6,2,23);">Mt 6:2</a>ff; <a onClick="return mV(\'Mat\',23,\'23,\'1-\');">23</a>; <a onClick="return mV(\'Luk\',18,\'9-14\');">Lu 18:9-14</a>). They gloried in an excessive scrupulosity in the observance of the externals of the law, even in trivialities. To them the multitude that knew not the law were "accursed" (<a onClick="return mV(\'Jhn\',7,49);">Joh 7:49</a>). To this party the great body of the scribes and rabbis belonged, and its powerful influence was eagerly sought by contending factions in the state.<P>(3) The Sadducees.<P>Alongside of the Pharisees were the "Sadducees" (probably from "Zadok")—rather a political and aristocratic clique than a religious sect, into whose possession the honors of the high-priesthood and other influential offices hereditarily passed. They are first met with by name under John Hyrcanus (135-106 BC). The Sadducees received only the law of Moses, interpreted it in a literal, secularistic spirit, rejected the Pharisaic traditions and believed in neither resurrection, angel nor spirit (<a onClick="return mV(\'Act\',23,8);">Ac 23:8</a>). Usually in rivalry with the Pharisees, they are found combining with these to destroy Jesus (<a onClick="return mV(\'Mat\',26,3,4,5,57);">Mt 26:3-5,57</a>).<P>(4) The Essenes.<P>The third party, the "Essenes," differed from both (some derive also from the Assideans) in living in fraternities apart from the general community, chiefly in the desert of Engedi, on the northwest shore of the Dead Sea, though some were found also in villages and towns; in rejecting animal sacrifices, etc., sending only gifts of incense to the temple; in practicing celibacy and community of goods; in the wearing of white garments; in certain customs (as greeting the sunrise with prayers) suggestive of oriental influence. They forbade slavery, war, oaths, were given to occult studies, had secret doctrines and books, etc. As remarked, they do not appear in the Gospel, but on account of certain resemblances, some have sought to establish a connection between them and John the Baptist and Jesus. In reality, however, nothing could be more opposed than Essenism to the essential ideas and spirit of Christ\'s teaching (compare Schurer, as above, Div. II, Vol. II, 188ff; Kuenen, Hibbert Lects on National Religions and Universal Religions, 199-208; Lightfoot, Colossians, 114-79).<P>IV. The Chronology.<P>The leading chronological questions connected with the life of Jesus are discussed in detail elsewhere (<a href="./study/isbe/search.html?string=CHRONOLOGY+OF+THE+NEW+TESTAMENT">CHRONOLOGY OF THE NEW TESTAMENT</a>; <a href="./study/isbe/search.html?string=QUIRINIUS">QUIRINIUS</a>, etc.); here it is sufficient to indicate the general scheme of dating adopted in the present article, and some of the grounds on which it is preferred. The chief questions relate to the dates of the birth and baptism of Jesus, the duration of the ministry and the date of the crucifixion.<P>1. Date of the Birth of Jesus:<P>Though challenged by some (Caspari, Bosanquet, Conder, etc., put it as late as 1 BC) the usual date for the death of Herod the Great, March, 4 BC (year of Rome 750), may be assumed as correct (for grounds of this dating, see Schurer, op. cit., Div. I, Vol. I, 464-67). The birth of Jesus was before, and apparently not very long before, this event (<a onClick="return mV(\'Mat\',2,\'1-\');">Mt 2</a>). It may therefore be placed with probability in the latter part of the previous year (5 BC), the ordinary dating of the commencement of the Christian era being thus, as is generally recognized, four years too late. There is no certainty as to the month or day of the birth. The Christmas date, December 25, is first met with in the West in the 4th century (the Eastern date was January 6), and was then possibly borrowed from a pagan festival. December, in the winter season, seems unlikely, as unsuitable for the pasturing of flocks (<a onClick="return mV(\'Luk\',2,8);">Lu 2:8</a>), though this objection is perhaps not decisive (Andrews, Conder). A more probable date is a couple of months earlier. The synchronism with Quirinius (<a onClick="return mV(\'Luk\',2,2);">Lu 2:2</a>) is considered in connection with the nativity. The earlier datings of 6, 7,or even 8 BC, suggested by Ramsay, Mackinlay and others, on grounds of the assumed Roman census, astronomical phenomena, etc., appear to leave too long an interval before the death of Herod, and conflict with other data, as <a onClick="return mV(\'Luk\',3,1);">Lu 3:1</a> (see below).<P>2. Date of Baptism:<P>John is said by Luke to have begun to preach and baptize "in the fifteenth year of Tiberius" (<a onClick="return mV(\'Luk\',3,1);">Lu 3:1</a>), and Jesus "was about thirty years of age" (<a onClick="return mV(\'Luk\',3,23);">Lu 3:23</a>) when He was baptized by John, and entered on His ministry. If the 15th year of Tiberius is dated, as seems most likely, from his association with Augustus as colleague in the government, 765 AUC, or 12 AD (Tacitus, Annals i.3; Suetonius on Augustus, 97), and if Jesus may be supposed to have been baptized about 6 months after John commenced his work, these data combine in bringing us to the year 780 AUC, or 27 AD, as the year of our Lord\'s baptism, in agreement with our former conclusion as to the date of His birth in 5 BC. To place the birth earlier is to make Jesus 32 or 33 years of age at His baptism—an unwarrantable extension of the "about." In accord with this is the statement in <a onClick="return mV(\'Jhn\',2,20);">Joh 2:20</a> that the temple had been 46 years in building (it began in 20-19 BC) at the time of Christ\'s first Passover; therefore in 780 AUC, or 27-AD (compare Schurer, op. cit., Div. I, Vol. I, 410).<P>3. Length of Ministry:<P>The determination of the precise duration of our Lord\'s ministry involves more doubtful elements. Setting aside, as too arbitrary, schemes which would, with some of the early Fathers, compress the whole ministry into little over a single year (Browne, Hort, etc.)—a view which involves without authority the rejection of the mention of the Passover in <a onClick="return mV(\'Jhn\',6,4);">Joh 6:4</a>—there remains the choice between a two years\' and a three years\' ministry. Both have able advocates (Turner in article "Chronology," and Sanday in article "Jesus Christ," in H D B, advocate the two years\' scheme; Farrar, Ramsay, D. Smith, etc., adhere to the three years\' scheme). An important point is the view taken of the unnamed "feast" in <a onClick="return mV(\'Jhn\',5,1);">Joh 5:1</a>. John has already named a Passover—Christ\'s first—in <a onClick="return mV(\'Jhn\',2,13,23);">2:13,23</A>; another, which Jesus did not attend, is named in <a onClick="return mV(\'Jhn\',6,4);">6:4</a>; the final Passover, at which He was crucified, appears in all the evangelists. If the "feast" of <a onClick="return mV(\'Jhn\',5,1);">Joh 5:1</a> (the article is probably to be omitted) is also, as some think, a Passover, then John has four Passovers, and a three years\' ministry becomes necessary. It is claimed, however, that in this case the "feast" would almost certainly have been named. It still does not follow, even if a minor feast—say Purim—is intended, that we are shut up to a two years\' ministry. Mr. Turner certainly goes beyond his evidence in affirming that "while two years must, not more than two years can, be allowed for the interval from <a onClick="return mV(\'Jhn\',2,13,23);">Joh 2:13,23</a> to <a onClick="return mV(\'Jhn\',11,55);">Joh 11:55</a>." The two years\' scheme involves, as will be seen on consideration of details, a serious overcrowding and arbitrary transposition of incidents, which speak to the need of longer time. We shall assume that the ministry lasted for three years, reserving reasons till the narrative is examined.<P>4. Date of Christ\'s Death:<P>On the hypothesis now accepted, the crucifixion of Jesus took place at the Passover of 30 AD. On the two years\' scheme it would fall a year earlier. On both sides it is agreed that it occurred on the Friday of the week of the Passover, but it is disputed whether this Friday was the 14th or the 15th day of the month. The Gospel of John is pleaded for the former date, the Synoptics for the latter. The question will be considered in connection with the time of the Last Supper. Meanwhile it is to be observed that, if the 15th is the correct date, there seems reason to believe that the 15th of Nisan fell on a Friday in the year just named, 783 AUG, or 30 AD. We accept this provisionally as the date of the crucifixion.``132';
isbe[5018]='Jesus Christ, 3`PART II. THE PROBLEMS OF THE LIFE OF JESUS<P>I. The Miracles.<P>1. The "Modern" Attitude:<P>Everyone is aware that the presence of miracle in the Gospels is a chief ground of the rejection of its history by the representatives of the "modern" school. It is not questioned that it is a super-natural person whose picture is presented in the Gospels. There is no real difference between the Synoptics and John in this respect. "Even the oldest Gospel," writes Bousset, "is written from the standpoint of faith; already for Mark, Jesus is not only the Messiah of the Jewish people, but the miraculous eternal Son of God, whose glory shone in the world" (Was wissen wir von Jesus? 54, 57). But the same writer, interpreting the "modern" spirit, declares that no account embracing supernatural events can be accepted as historical. "The main characteristic of this modern mode of thinking," he says, "rests upon the determination to try to explain everything that takes place in the world by natural causes, or—to express it in another form—it rests on the determined assertion of universal laws to which all phenomena, natural and spiritual, are subject" (What Is Religion? English translation, 283).<P>2. Supernatural in the Gospels:<P>With such an assumption it is clear that the Gospels are condemned before they are read. Not only is Jesus there a supernatural person, but He is presented as super-natural in natural in character, in works, in claims (see below); He performs miracles; He has a supernatural birth, and a supernatural resurrection. All this is swept away. It may be allowed that He had remarkable gifts of healing, but these are in the class of "faithcures" (thus Harnack), and not truly supernatural. When one seeks the justification for this selfconfident dogmatism, it is difficult to discover it, except on the ground of a pantheistic or monistic theory of the universe which excludes the personal God of Christianity. If God is the Author and Sustainer of the natural system, which He rules for moral ends, it is impossible to see why, for high ends of revelation and redemption, a supernatural economy should not be engrafted on the natural, achieving ends which could not otherwise be attained. This does not of course touch the question of evidence for any particular miracle, which must be judged of from its connection with the person of the worker, and the character of the apostolic witnesses. The well-meant effort to explain all miracles through the action of unknown natural laws—which is what Dr. Sanday calls "making both ends meet" (Life of Christ in Recent Research, 302)—breaks down in the presence of such miracles as the instantaneous cleansing of the leper, restoration of sight to the blind, the raising of the dead, acts which plainly imply an exercise of creative power. In such a life as Christ\'s, transcendence of the ordinary powers of Nature is surely to be looked for.<P>II. The Messiahship.<P>1. Reserve of Jesus and Modern Criticism:<P>A difficulty has been found in the fact that in all the Gospels Jesus knew Himself to be the Messiah at least from the time of His baptism, yet did not, even to His disciples, unreservedly announce Himself as such till after Peter\'s great confession at Caesarea Philippi (<a onClick="return mV(\'Mat\',16,13);">Mt 16:13</a>). On this seeming secrecy the bold hypothesis has been built that Jesus in reality never made the claim to Messiahship, and that the passages which imply the contrary in Mark (the original Gospel) are unhistorical (Wrede; compare on this and other theories, Schweitzer, The Quest of the Historical Jesus, English translation; Sanday, The Life of Christ in Recent Research). So extreme an opinion is rejected by most; but modern critics vie with each other in the freedom with which they treat the testimony of the evangelists on this subject. Baldensperger, e.g., supposes that Jesus did not attain full certainty on His Messiahship till near the time of Peter\'s confession, and arbitrarily transposes the earlier sections in which the title "Son of Man" occurs till after that event (Das Selbstbewusstsein Jesu, 2nd edition, 246). Bousset thinks that Jesus adopted the Messianic role as the only one open to Him, but bore it as a "burden" (compare his Jesus). Schweitzer connects it with apocalyptic ideas of a wildly fantastic character (op. cit., chapter xix).<P>2. A Growing Revelation:<P>There is, however, no need for supposing that Peter\'s confession marks the first dawn of this knowledge in the minds of the apostles. Rather was it the exalted expression of a faith already present, which had long been maturing. The baptism and temptation, with the use of the title "Son of Man," the tone of authority in His teaching, His miracles, and many special incidents, show, as clearly as do the discourses in John, that Jesus was from the beginning fully conscious of His vocation, and His reserve in the use of the title sprang, not from any doubt in His own mind as to His right to it, but from His desire to avoid false associations till the true nature of His Messiahship should be revealed. The Messiahship was in process of self-revelation throughout to those who had eyes to see it (compare <a onClick="return mV(\'Jhn\',6,\'66-71\');">Joh 6:66-71</a>). What it involved will be seen later.<P>III. Kingdom and Apocalypse.<P>1. The Kingdom—Present or Future?:<P>Connected with the Messiahship is the idea of the "Kingdom of God" or "of heaven," which some in modern times would interpret in a purely eschatological sense, in the light of Jewish apocalyptic conceptions (Johannes Weiss, Schweitzer, etc.). The kingdom is not a thing of the present, but wholly a thing of the future, to be introduced by convulsions of Nature and the Parousia of the Son of Man. The language of the Lord\'s Prayer, "Thy kingdom come," is quoted in support of this contention, but the next petition should guard against so violent an inference. "Thy will be done," Jesus teaches His disciples to pray, "as in heaven, so on earth" (<a onClick="return mV(\'Mat\',6,10);">Mt 6:10</a>). The kingdom is the reign of God in human hearts and lives in this world as well as in the next. It would not be wrong to define it as consisting essentially in the supremacy of God\'s will in human hearts and human affairs, and in every department of these affairs. As Jesus describes the kingdom, it has, in the plain meaning of His words, a present being on earth, though its perfection is in eternity. The parables in <a onClick="return mV(\'Mat\',13,\'1-\');">Mt 13</a> and elsewhere exhibit it as founded by the sowing of the word of truth (Sower), as a mingling of good and evil elements (Tares), as growing from small beginnings to large proportions (Mustard Seed), as gradually leavening humanity (Leaven), as of priceless value (Treasure; Pearl; compare <a onClick="return mV(\'Mat\',6,33);">Mt 6:33</a>); as terminating in a judgment (Tares, Dragnet); as perfected in the world to come (<a onClick="return mV(\'Mat\',13,43);">Mt 13:43</a>). It was a kingdom spiritual in nature (<a onClick="return mV(\'Luk\',17,20,21);">Lu 17:20,21</a>), universal in range (<a onClick="return mV(\'Mat\',8,11);">Mt 8:11</a>; <a onClick="return mV(\'Mat\',21,43);">21:43</a>, etc.), developing from a principle of life within (<a onClick="return mV(\'Mar\',4,\'26-29\');">Mr 4:26-29</a>), and issuing in victory over all opposition (<a onClick="return mV(\'Mat\',21,44);">Mt 21:44</a>).<P>2. Apocalyptic Beliefs:<P>It is difficult to pronounce on the extent to which Jesus was acquainted with current apocalyptic beliefs, or allowed these to color the imagery of parts of His teachings. These beliefs certainly did not furnish the substance of His teaching, and it may be doubted whether they more than superficially affected even its form. Jewish apocalyptic knew nothing of a death and resurrection of the Messiah and of His return in glory to bring in an everlasting kingdom. What Jesus taught on these subjects sprang from His own Messianic consciousness, with the certainty He had of His triumph over death and His exaltation to the right hand of God. It was in Old Testament prophecy, not in late Jewish apocalypse, that His thoughts of the future triumph of His kingdom were grounded, and from the vivid imagery of the prophets He borrowed most of the clothing of these thoughts. <a onClick="return mV(\'Isa\',53,\'1-\');">Isa 53</a> e.g., predicts not only the rejection and death of the Servant of Yahweh (<a onClick="return mV(\'Isa\',53,3,7,8,9,12);">53:3,7-9,12</A>), but the prolongation of His days and His victorious reign (<a onClick="return mV(\'Isa\',53,\'10-12\');">53:10-12</A>). Daniel, not the Book of Enoch, is the source of the title, "Son of Man," and of the imagery of coming on the clouds of heaven (<a onClick="return mV(\'Dan\',7,13);">Da 7:13</a>). The ideas of resurrection, etc., have their ground in the Old Testament (see <a href="./study/isbe/search.html?string=ESCHATOLOGY+OF+THE+OLD+TESTAMENT">ESCHATOLOGY OF THE OLD TESTAMENT</a>). With the extravagant, unspiritual forms into which these conceptions were thrown in the Jewish apocalyptic books His teaching had nothing in common. The new apocalyptic school represented by Schweitzer reduces the history of Jesus to folly, fanaticism and hopeless disillusionment.<P>IV. The Character and Claims.<P>1. Denial of Christ\'s Moral Perfection:<P>Where the Gospels present us in Jesus with the image of a flawless character—in the words of the writer to the Hebrews, "holy, guileless, undefiled, separated from sinners" (<a onClick="return mV(\'Hbr\',7,26);">Heb 7:26</a>)—modern criticism is driven by an inexorable necessity to deprive Jesus of His sinless perfection, and to impute to Him the error, frailty, and moral infirmity that belong to ordinary mortals. In Schweitzer\'s portraiture (compare op. cit.), He is an apocalyptic enthusiastic, ruled by illusory ideals, deceiving Himself and others as to who He was, and as to the impending end of the world. Those who show a more adequate appreciation of Christ\'s spiritual greatness are still prevented by their humanitarian estimate of His person and their denial of the supernatural in history from recognizing the possibility of His sinlessness. It may confidently be said that there is hardly a single writer of the modern school who grants Christ\'s moral perfection. To do so would be to admit a miracle in humanity, and we have heard that miracle is by the highest rational necessity excluded. This, however, is precisely the point on which the modern so-called "historical-critical" mode of presentation most obviously breaks down. The ideal of perfect holiness in the Gospels which has fascinated the conscience of Christendom for 18 centuries, and attests itself anew to every candid reader, is not thus lightly to be got rid of, or explained away as the invention of a church gathered out (without the help of the ideal) promiscuously from Jews and Gentiles. It was not the church—least of all such a church—that created Christ, but Christ that created the church.<P>(1) The Sinlessness Assured.<P>The sinlessness of Jesus is a datum in the Gospels. Over against a sinful world He stands as a Saviour who is Himself without sin. His is the one life in humanity in which is presented a perfect knowledge and unbroken fellowship with the Father, undeviating obedience to His will, unswerving devotion under the severest strain of temptation and suffering to the highest ideal of goodness. The ethical ideal was never raised to so absolute a height as it is in the teaching of Jesus, and the miracle is that, high as it is in its unsullied purity, the character of Jesus corresponds with it, and realizes it. Word and life for once in history perfectly agree. Jesus, with the keenest sensitiveness to sin in thought and feeling as in deed, is conscious of no sin in Himself, confesses no sin, disclaims the presence of it, speaks and acts continually on the assumption that He is without it. Those who knew Him best declared Him to be without sin (<a onClick="return mV(\'1Pe\',2,22);">1Pe 2:22</a>; <a onClick="return mV(\'1Jo\',3,5);">1Joh 3:5</a>; compare <a onClick="return mV(\'2Cr\',5,21);">2Co 5:21</a>). The Gospels must be rent in pieces before this image of a perfect holiness can be effaced from them.<P>(2) What This Implies.<P>How is this phenomenon of a sinless personality in Jesus to be explained? It is itself a miracle, and can only be made credible by a creative miracle in Christ\'s origin. It may be argued that a Virgin Birth does not of itself secure sinlessness, but it will hardly be disputed that at least a sinless personality implies miracle in its production. It is precisely because of this that the modern spirit feels bound to reject it. In the Gospels it is not the Virgin Birth by itself which is invoked to explain Christ\'s sinlessness, but the supernatural conception by the Holy Spirit (<a onClick="return mV(\'Luk\',1,35);">Lu 1:35</a>). It is because of this conception that the birth is a virgin one. No explanation of the supernatural element in Christ\'s Person is more rational or credible (see below on "Nativity").<P>2. Sinlessness and the Messianic Claim:<P>If Jesus from the first was conscious of Himself as without sin and if, as the converse of this, He knew Himself as standing in an unbroken filial fellowship with the Father, He must early have become conscious of His special vocation, and learnt to distinguish Himself from others as one called to bless and save them. Here is the true germ of His Messianic consciousness, from which everything subsequently is unfolded. He stood in a rapport with the Father which opened His spirit to a full, clear revelation of the Father\'s will regarding Himself, His mission, the kingdom He came to found, His sufferings as the means of salvation to the world, the glory that awaited Him when His earthly work was done. In the light of this revelation He read the Old Testament Scriptures and saw His course there made plain. When the hour had come He went to John for baptism, and His brief, eventful ministry, which should end in the cross, began. This is the reading of events which introduces consistency and purpose into the life of Jesus, and it is this we mean to follow in the sketch now to be given.``132';
isbe[5019]='Jesus Christ, 4A`PART III. COURSE OF THE EARTHLY LIFE OF JESUS<P>1. Divisions of the History:<P>The wonderful story of the life of the world\'s Redeemer which we are now to endeavor to trace falls naturally into several divisions:<P class="in15">A. From the Nativity to the Baptism and Temptation.<P class="in15">B. The Early Judean Ministry.<P class="in15">C. The Galilean Ministry and Visits to the Feasts.<P class="in15">D. The Last Journey to Jerusalem.<P class="in15">E. The Passion Week—Betrayal, Trial, and Crucifixion.<P class="in15">F. The Resurrection and Ascension.<P>2. Not a Complete "Life":<P>To avoid misconception, it is important to remember, that, rich as are the narratives of the Gospels, materials do not exist for a complete biography or "Life" of Jesus. There is a gap, broken only by a single incident, from His infancy till His 30th year; there are cycles of events out of myriads left unrecorded (<a onClick="return mV(\'Jhn\',21,25);">Joh 21:25</a>); there are sayings, parables, longer discourses, connected with particular occasions; there are general summaries of periods of activity comprised in a few verses. The evangelists, too, present their materials each from his own standpoint—Matthew from theocratic, Mark from that of Christ\'s practical activity, Luke from the universalistic and human-sympathetic, John from the Divine. In reproducing the history respect must be had to this focusing from distinct points of view.<P>A. FROM THE NATIVITY TO THE BAPTISM AND TEMPTATION<P>I. The Nativity.<P>1. Hidden Piety in Judaism: Old Testament prophecy expired with the promise on its lips, "Behold, I send my messenger, and he shall prepare the way before me: and the Lord, whom ye seek, will suddenly come to his temple; and the messenger of the covenant, whom ye desire, behold, he cometh, saith Yahweh of hosts" (<a onClick="return mV(\'Mal\',3,1);">Mal 3:1</a>). In the years immediately before Christ\'s birth the air was tremulous with the sense of imp
