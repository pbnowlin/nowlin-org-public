ness if a distinction be observed between the nearer event of the destruction of Jerusalem—also in its way a coming of the Son of Man—and the more remote event of the final parousia. The former, to which <a onClick="return mV(\'Mat\',24,\'15-28\');">Mt 24:15-28</a> more specially belong, seems referred to by the "these things" in <a onClick="return mV(\'Mat\',24,34);">24:34</a>, which, it is declared, shall be fulfilled in that generation. Of the final parousia, on the other hand, it is declared in <a onClick="return mV(\'Mat\',24,36);">24:36</a> that "of that day and hour knoweth no one, not even the angels of heaven, neither the Son, but the Father only" (compare <a onClick="return mV(\'Mar\',13,32);">Mr 13:32</a>). The difficulty occasioned by the immediately of <a onClick="return mV(\'Mat\',24,29);">Mt 24:29</a> is relieved by recalling the absence of perspective and grouping of future events in all apocalyptic prophecy—the consummation ever rising as the background of the immediate experience which is its prelude. The discourse then divides itself into a general part (<a onClick="return mV(\'Mat\',24,\'4-14\');">Mt 24:4-14</a>), delineating the character of the entire period till the consummation (false Christs and prophets, wars, tribulations, apostasies, preaching of the gospel to all nations, etc.); a special part relating to the impending destruction of the city, with appropriate warnings (<a onClick="return mV(\'Mat\',24,\'15-28\');">Mt 24:15-28</a>); and a closing part (<a onClick="return mV(\'Mat\',24,\'32-51\');">Mt 24:32-51</a>) relating mainly to the final parousia, but not without reference to preceding events in the extension of Christ\'s kingdom, and ingathering of His elect (<a onClick="return mV(\'Mat\',24,30,31);">Mt 24:30,31</a>). Warning is given of the suddenness of the coming of the Son of Man, and the need of being prepared for it (<a onClick="return mV(\'Mat\',24,\'37-51\');">Mt 24:37-51</a>). The whole is a massive prophecy, resting on Christ\'s consciousness that His death would be, not the defeat of His mission, but the opening up of the way to His final glorification and triumph.<P>g) Parables of Ten Virgins, Talents and Last Judgment:<P>(<a onClick="return mV(\'Mat\',25,\'1-\');">Matthew 25</a>)<P>To this great discourse on the solemnities of the end, Jesus, still addressing His disciples, added three memorable parables of instruction and warning (<a onClick="return mV(\'Mat\',25,\'1-\');">Mt 25</a>)—the first, that of the Ten Virgins, picturing, under the figure of virgins who went to meet the bridegroom with insufficient provision of oil for their lamps, the danger of being taken unawares in waiting for the Son of Man; the second, that of the Talents, akin to the parable in Luke of the Pounds (<a onClick="return mV(\'Luk\',19,\'11-27\');">19:11-27</a>), emphasizing the need of diligence in the Lord\'s absence; the third, that of the Sheep and Goats, or Last Judgment, showing how the last division will be made according as discipleship is evinced by loving deeds done to those in need on earth—such deeds being owned by Christ the King as done to Himself. Love is thus declared to be the ultimate law in Christ\'s kingdom (compare <a onClick="return mV(\'1Cr\',13,\'1-\');">1Co 13</a>); the loveless spirit is reprobated. "These shall go away into eternal punishment: but the righteous into eternal life" (<a onClick="return mV(\'Mat\',25,46);">Mt 25:46</a>).<P>6. A Day of Retirement:<P>(compare <a onClick="return mV(\'Jhn\',12,36);">John 12:36</a>)<P><a onClick="return mV(\'Luk\',21,37,38);">Lu 21:37,38</a> might suggest that Jesus taught in the temple every day till the Thursday of the Passover; if, however, the denunciation took place, as nearly all agree, on Tuesday, an exception must be made of the Wednesday, which Jesus probably spent in retirement in Bethany in preparation of spirit for His last great conflict (others arrange differently, and put some of the preceding events in this day). The summary in <a onClick="return mV(\'Jhn\',12,\'36-43\');">Joh 12:36-43</a> connects the blindness of mind of the Pharisees with Isaiah\'s vision (<a onClick="return mV(\'Isa\',6,10);">Isa 6:10</a>), and with the prophecy of the rejected Servant (<a onClick="return mV(\'Isa\',53,1);">Isa 53:1</a>).<P>7. An Atmosphere of Plotting—Judas and the Priests:<P>(<a onClick="return mV(\'Mat\',26,\'1-5\',\'14-16\');">Matthew 26:1-5,14-16</a>; <a onClick="return mV(\'Mar\',14,1,2,10,11);">Mark 14:1,2,10,11</a>; <a onClick="return mV(\'Luk\',22,\'1-6\');">Luke 22:1-6</a>)<P>The plot for the destruction of Jesus was meanwhile maturing. Two days before the Passover (Tuesday evening), Jesus forewarned the disciples of His approaching betrayal and crucifixion (<a onClick="return mV(\'Mat\',26,2);">Mt 26:2</a>); and probably at that very hour a secret meeting of the chief priests and elders was being held in the court of the house of the high priest, Caiaphas (Matthew), to consult as to the means of putting Him to death. Their resolve was that it should not be done on the feast day, lest there should be a tumult; but the appearance of Judas, who since the anointing had seemingly meditated this step, speedily changed their plans. For the paltry sum of 30 pieces of silver (shekels of the sanctuary, less than $20 or 4 pounds (1915); the price of a slave, <a onClick="return mV(\'Exd\',21,32);">Ex 21:32</a>; compare <a onClick="return mV(\'Zec\',11,12);">Zec 11:12</a>), the recreant disciple, perhaps persuading himself that he was really forcing Jesus to an exercise of His Messianic power, agreed to betray his Lord. The covenant of infamy was made, and the traitor now only waited his opportunity to carry out his project.``132';
isbe[5025]='Jesus Christ, 4E2`II. From the Last Supper till the Cross.<P>1. The Chronology:<P>A question of admitted difficulty arises in the comparison of the Synoptics and John as to the dates of the Last Supper and of the crucifixion. The Synoptics seem clearly to place the Last Supper on the evening of the 14th of Nisan (in Jewish reckoning, the beginning of the 15th), and to identify it with the ordinary paschal meal (<a onClick="return mV(\'Mat\',26,\'17-19\');">Mt 26:17-19</a>). The crucifixion then took place on the 15th. John, on the contrary, seems to place the supper on the day before the Passover (<a onClick="return mV(\'Jhn\',13,1);">13:1</a>), and the crucifixion on the 14th, when the Passover had not yet been eaten (<a onClick="return mV(\'Jhn\',18,28);">18:28</a>; <a onClick="return mV(\'Jhn\',19,14);">19:14</a>). Many, on this ground, affirm an irreconcilable discrepancy between John and the Synoptics, some (e.g. Meyer, Farrar, less decisively Sanday) preferring John; others (Strauss, Baur, Schmiedel, etc.) using the fact to discredit John. By those who accept both accounts, various modes of reconciliation are proposed. A favorite opinion (early church writers; many moderns, as Godet, Westcott, Farrar) is that Jesus, in view of His death, anticipated the Passover, and ate His parting meal with His disciples on the evening of the 13th; others (e.g. Tholuck, Luthardt, Edersheim, Andrews, D. Smith), adhering to the Synoptics, take the view, here shared, that the apparent discrepancy is accounted for by a somewhat freer usage of terms in John. Details of the discussion must be sought in the works on the subject. The case for the anticipatory view is well given in Westcott, Introduction to the Study of the Gospels, 339ff; and in Farrar, Life of Christ, Excur. X; a good statement of that for the Synoptics may be seen in Andrews, Life of our Lord; compare Tholuck, Commentary on John, on <span class="noTag">13:1</span>; Luthardt, Commentary on John, on <span class="noTag">13:1; 18:28</span>; D. Smith, Days of His Flesh, App. II. The language of the Synoptists ("the first day of unleavened bread, when they sacrificed the passover," <a onClick="return mV(\'Mar\',14,12);">Mr 14:12</a>) leaves no doubt that they intended to identify the Last Supper with the regular Passover, and it is hardly conceivable that they could be mistaken on so vital a point of the apostolic tradition. This also was the view of the churches of Asia Minor, where John himself latterly resided. On the other hand, the phrase to "eat the passover" in <a onClick="return mV(\'Jhn\',18,28);">Joh 18:28</a> may very well, in John\'s usage, refer to participation in the special sacrifices which formed a chief feature of the proceedings on the 15th. The allusion in <a onClick="return mV(\'Jhn\',13,1);">Joh 13:1</a> need mean no more than that, the Passover now impending, Jesus, loving His disciples to the end, gave them a special token of that love during the meal that ensued. The "preparation of the passover" in <a onClick="return mV(\'Jhn\',19,14,31);">Joh 19:14,31</a> most naturally refers to the preparation for the Sabbath of the Passover week, alluded to also by the Synoptics (<a onClick="return mV(\'Mat\',27,62);">Mt 27:62</a>; <a onClick="return mV(\'Mar\',15,42);">Mr 15:42</a>; <a onClick="return mV(\'Luk\',23,54);">Lu 23:54</a>). The objections based on rabbinical regulations about the Sabbath are convincingly met by Tholuck (see also Andrews). We assume, therefore, that our Lord ate the Passover with His disciples at the usual time—the evening of the 14th of Nisan (i.e. the beginning of the 15th).<P>2. The Last Supper:<P>(<a onClick="return mV(\'Mat\',26,\'17-35\');">Matthew 26:17-35</a>; <a onClick="return mV(\'Mar\',14,\'12-31\');">Mark 14:12-31</a>; <a onClick="return mV(\'Luk\',22,\'7-38\');">Luke 22:7-38</a>; <a onClick="return mV(\'Jhn\',13,\'1-\');">John 13</a>; compare <a onClick="return mV(\'1Cr\',11,\'23-25\');">1Co 11:23-25</a>)<P>In the scene in the upper chamber, at the observance of the Last Supper, we enter the holy of holies of this part of the Lord\'s history. It is difficult, in combining the narratives, to be sure of the order of all the particulars, but the main events are clear. They may be exhibited as follows:<P>a) The Preparation:<P>On "the first day of unleavened bread"—Thursday, 14th of Nisan—Jesus bade two of His disciples (Luke names Peter and John) make the needful preparations for the observance of the Passover. This included the sacrificing of the lamb at the temple, and the securing of a guest-chamber. Jesus bade the disciples follow a man whom they would meet bearing a pitcher, and at the house where he stopped they would find one willing to receive them. The master of the house, doubtless a disciple, at once gave them "a large upper room furnished and ready" (Mark); there they made ready.<P>b) Dispute about Precedence—Washing of the Disciples\' Feet—Departure of Judas:<P>Evening being come, Jesus and the Twelve assembled, and took their places for the meal. We gather from <a onClick="return mV(\'Jhn\',13,23);">Joh 13:23</a> that John reclined next to Jesus (on the right), and the sequel shows that Judas and Peter were near on the other side. It was probably this arrangement that gave rise to the unseemly strife for precedence among the disciples narratedin <a onClick="return mV(\'Luk\',22,\'24-30\');">Lu 22:24-30</a>. The spirit thus displayed Jesus rebuked, as He had more than once had occasion to do (compare <a onClick="return mV(\'Mar\',9,\'33-37\');">Mr 9:33-37</a>); then (for here may be inserted the beautiful incident in <a onClick="return mV(\'Jhn\',13,1);">Joh 13:1</a>ff), rising from the table, He gave them an amazing illustration of His own precept, "He that is chief (let him become) as he that doth serve...I am in the midst of you as he that serveth" (<a onClick="return mV(\'Luk\',22,26,27);">Lu 22:26,27</a>), in divesting Himself of His garments, girding Himself with a towel, and performing the act of a servant in washing His disciples\' feet. Peter\'s exclamation must have expressed the feelings of all: "Lord, dost thou wash my feet?" The act of the Divine Master was a wonderful lesson in humility, but Jesus used it also as a parable of something higher. "If I wash thee not (i.e. if thou art not cleansed by the receiving of my word and spirit, which this washing symbolizes), thou hast no part with me"; then on Peter\'s further impulsive protest, "Lord, not my feet only, but also my hands and my head," the word: "He that is bathed needeth not save to wash his feet, but is clean every whit" (i.e. sanctification of the inner man is once for all, but there is need for cleansing from the sins of the daily walk). Resuming His place at the table, He bade them imitate the example He had just given them.<P>Is it I?<P>An ominous word had accompanied the reply to Peter, "Ye are not all clean" (<a onClick="return mV(\'Jhn\',13,10,11);">Joh 13:10,11</a>). As the supper proceeded, the meaning of this was made plain. Judas, who had already sold his Master, was at the table with the rest. He had permitted Jesus to wash his feet, and remained unmoved by that surpassing act of condescending love. Jesus was "troubled in spirit" and now openly declared, "One of you shall betray me" (the Greek word means literally, "deliver up": compare <a onClick="return mV(\'Luk\',22,4,6);">Lu 22:4,6</a>, and the Revised Version margin throughout). It was an astounding announcement to the disciples, and from one and another came the trembling question, "Lord, is it I?" Jesus answered that it was one of those dipping his hand with Him in the dish (Mark), and spoke of the woe that would overtake the betrayer ("Good were it for that man if he had not been born"). John, at a sign from Peter, asked more definitely, "Who is it?" (John). Jesus said, but to John only, it was he to whom He would give a sop, and the sop was given to Judas. The traitor even yet sought to mask his treachery by the words, "Is it I, Rabbi?" and Jesus replied, though still not aloud, "Thou hast said" (Matthew); then, as Satanic passion stirred the breast of Judas, He added, "What thou doest, do quickly" (John). Judas at once rose and went out—into the night (<a onClick="return mV(\'Jhn\',13,30);">Joh 13:30</a>). The disciples, not comprehending his abrupt departure, thought some errand had been given him for the feast or for the poor. Jesus was relieved by his departure and spoke of the glory coming to Himself and to His Father, and of love as the mark of true discipleship (<a onClick="return mV(\'Jhn\',13,\'31-35\');">Joh 13:31-35</a>).<P>c) The Lord\'s Supper:<P>The forms of the observance of the Passover by the Jews are given elsewhere (see <a href="./study/isbe/search.html?string=PASSOVER">PASSOVER</a>). Luke alone of the New Testament writers speaks of 2 cups (<a onClick="return mV(\'Jhn\',22,17,20);">22:17,20</a>); in Jewish practice 4 cups were used. The "Western" text, Codex Bezae (D), omits Luke\'s 2nd cup, from which some (compare Sanday, Hastings, Dictionary of the Bible (five volumes)) infer duplication, but this is not necessary. Luke\'s 1st cup (<a onClick="return mV(\'Luk\',22,17);">Lu 22:17</a>) may be that with which the paschal supper opened; the 2nd cup—that mentioned by all the writers—was probably the 3rd Jewish cup, known as "the cup of blessing" (compare <a onClick="return mV(\'1Cr\',10,16);">1Co 10:16</a>). Some, however, as Meyer, make it the 4th cup. It is implied in Matthew, Mark, John, that by this time Judas had gone. Left thus with His own, the essentials of the paschal meal being complete, Jesus proceeded, by taking and distributing bread and wine, associating them with His body and blood, soon to be offered in death upon the cross, to institute that sacred rite in which, through all ages since (though its simplicity has often been sadly obscured) His love and sacrifice have been commemorated by His church. There are variations of phrase in the different accounts, but in the essentials of the sacramental institution there is entire agreement. Taking bread, after thanks to God, Jesus broke it, and gave it to the disciples with the words, "This is my body"; the cup, in like manner, after thanksgiving, He gave them with the words, "This is my blood of the covenant (in Luke and Paul, "the new covenant in my blood") which is poured out for many" (Matthew adds, "unto remission of sins"). Luke and Paul add what is implied in the others: "This do in remembrance of me" (<a onClick="return mV(\'Luk\',22,19);">Lu 22:19</a>; <a onClick="return mV(\'1Cr\',11,24);">1Co 11:24</a>). Nothing could more plainly designate the bread and wine as holy symbols of the Lord\'s body and blood, offered in death for man\'s redemption, and sealing in His blood a new covenant with God; nor, so long as the rite is observed in its Divine simplicity, as Jesus instituted it, will it be possible to expunge from His death the character of a redeeming sacrifice. In touching words Jesus intimated that He would no more drink of the fruit of the vine till He drank it new with them in their Father\'s Kingdom (on the doctrinal aspects, see <a href="./study/isbe/search.html?string=EUCHARIST">EUCHARIST</a>; <a href="./study/isbe/search.html?string=SACRAMENTS">SACRAMENTS</A>; <a href="./study/isbe/search.html?string=LORD\'S+SUPPER">LORD\'S SUPPER</a>).<P>d) The Last Discourses—Intercessory Prayer:<P>The Supper was over, and parting was imminent, but Jesus did not leave the holy chamber till He had poured out His inmost heart in those tender, consolatory, profoundly spiritual addresses which the beloved disciple has preserved for us in <a onClick="return mV(\'Jhn\',14,\'1-\');">John 14</a>; <a onClick="return mV(\'Jhn\',15,\'1-\');">15</a>; and <a onClick="return mV(\'Jhn\',16,\'1-\');">16</a>, followed by the wonderful closing intercessory prayer of <a onClick="return mV(\'Jhn\',17,\'1-\');">John 17</a>. He was leaving them, but their hearts were not to be disquieted, for they would see Him again (<a onClick="return mV(\'Jhn\',14,18);">14:18</a>; <a onClick="return mV(\'Jhn\',16,16);">16:16</a>ff), and if, ere long, He would part with them again in visible form, it was only outwardly He would be separated from them, for He would send them the Holy Spirit, the Paraclete, who would take His place, to guide them into all truth, and bring all things to their remembrance that He had said to them (<a onClick="return mV(\'Jhn\',14,16,17);">14:16,17</A>; <a onClick="return mV(\'Jhn\',15,26);">15:26</a>; <a onClick="return mV(\'Jhn\',16,\'7-14\');">16:7-14</a>). If He went away, it was to prepare a place for them, and He would come again to receive them to Himself in His Father\'s house (<a onClick="return mV(\'Jhn\',14,1,2,3);">14:1-3</a>); let them meanwhile show their love to Him by keeping His commandments (<a onClick="return mV(\'Jhn\',14,15,23,24);">14:15,23,24</a>). In the Spirit He Himself and the Father would dwell in the souls that loved Him (<a onClick="return mV(\'Jhn\',14,\'21-23\');">14:21-23</a>). The intimacy of their union with Him would be like that of branches in the vine; only by abiding in Him could they bring forth fruit (<a onClick="return mV(\'Jhn\',15,1);">15:1</A>ff). They would have tribulations (<a onClick="return mV(\'Jhn\',15,18);">15:18</a>ff; <a onClick="return mV(\'Jhn\',16,1,2);">16:1,2</a>), but as His dying bequest He left them His own peace (<a onClick="return mV(\'Jhn\',14,27);">14:27</A>); that would sustain their hearts in all trial (<a onClick="return mV(\'Jhn\',16,33);">16:33</a>). With many such promises did He comfort them in view of the terrible ordeal through which they were soon to pass; then, addressing His Father, He prayed for their holy keeping, and their final admission to His glory (<a onClick="return mV(\'Jhn\',17,\'9-18\',24\');">17:9-18,24</a>).<P>These solemn discourses finished, Jesus and His disciples sang a hymn (the "Hallel") and departed to go to the Mount of Olives. Comparing the evangelists, one would infer that the conversation in which Jesus foretold the denial of Peter at least commenced before they left the chamber (<a onClick="return mV(\'Luk\',22,31);">Lu 22:31</a>; John connects it, probably through relation of subject, with the exposure of Judas, <a onClick="return mV(\'Jhn\',13,\'36-38\');">Joh 13:36-38</a>); but it seems to have continued on the way (Matthew, Mark).<P>e) The Departure and Warning:<P>Jesus had spoken of their being "offended" in Him that night. In his exaltation of spirit, Peter declared that though all should be offended in Him, he would never be offended. Jesus, who had already warned Peter that Satan sought to have him, that he might sift him as wheat (<a onClick="return mV(\'Luk\',22,31);">Lu 22:31</a>; but "I made supplication for thee," etc.), now told him that before the cock should crow, he would thrice deny Him. Peter stoutly maintained that he would die rather than be guilty of so base an act—so little did he or the others (<a onClick="return mV(\'Mat\',26,35);">Mt 26:35</a>; <a onClick="return mV(\'Mar\',14,31);">Mr 14:31</a>) know themselves! The enigmatic words in <a onClick="return mV(\'Luk\',22,36);">Lu 22:36</a> about taking scrip and sword point metaphorically to the need, in the times that were coming upon them, of every lawful means of provision and self-defence; the succeeding words show that "sword" is not intended to be taken literally (<a onClick="return mV(\'Luk\',22,38);">22:38</a>).<P>3. Gethsemane—the Betrayal and Arrest:<P>(<a onClick="return mV(\'Mat\',26,\'36-56\');">Matthew 26:36-56</a>; <a onClick="return mV(\'Mar\',14,\'32-53\');">Mark 14:32-53</a>; <a onClick="return mV(\'Luk\',22,\'39-53\');">Luke 22:39-53</a>; <a onClick="return mV(\'Jhn\',18,\'1-12\');">John 18:1-12</a>)<P>Descending to the valley, Jesus and His disciples, crossing the brook Kidron ("of the cedars"), entered the "garden" (John) known as Gethsemane ("oil-press"), at the foot of the Mount of Olives. Here took place the agony, which is the proper commencement of the Passion, the betrayal by Judas and the arrest of Jesus.<P>During the evening the thoughts of Jesus had been occupied mainly with His disciples; now that the hour had come when the things predicted concerning Him should have fulfillment (<a onClick="return mV(\'Luk\',22,37);">Lu 22:37</a> "your hour, and the power of darkness," <a onClick="return mV(\'Luk\',22,53);">Lu 22:53</a>), it was inevitable that mind and spirit should concentrate on the awful bodily and mental sufferings that lay before Him.<P>a) Agony in the Garden:<P>It was not the thought of physical suffering alone—from that also the pure and sensitive humanity of Jesus shrank with natural horror—but death to Him, the Holy One and Prince of Life, had an indescribably hateful character as a hostile power in humanity, due to the judgment of God on sin, and now descending upon Him through the workings of the vilest of human passions in the religious heads of His nation. What anguish to such an One, filled with love and the desire to save, to feel Himself rejected, betrayed, deserted, doomed to a malefactor\'s cross—alone, yet not alone, for the Father was with Him! (<a onClick="return mV(\'Jhn\',16,32);">Joh 16:32</a>). The burden on His spirit when He reached Gethsemane was already, as the language used shows, all but unendurable—"amazed," "sore troubled," "My soul is exceeding sorrowful even unto death" (Mark). There, bidding the other disciples wait, He took with Him Peter, and James, and John, and withdrew into the recesses of the garden. Leaving these also a little behind, He sank on the ground in solitary "agony" (Luke), and "with strong crying and tears" (<a onClick="return mV(\'Hbr\',5,7);">Heb 5:7</a>), poured out His soul in earnest supplication to His Father. "Let this cup pass away from me"—it could not be, but thus the revulsion of His nature was expressed—"howbeit not what I will, but what thou wilt." The passage in Luke (<a onClick="return mV(\'Luk\',22,44);">22:44</a>), "His sweat became as it were great drops of blood," etc., though omitted in certain manuscripts, doubtless preserves a genuine trait. Returning to the three, He found them overpowered with sleep: even the support of their wakeful sympathy was denied Him! "Watch and pray," He gently admonished them, "that ye enter not into temptation." A second and third time the same thing happened—wrestling with God on His part, sleep on theirs, till, with Divine strengthening (<a onClick="return mV(\'Luk\',22,41);">Lu 22:41</a>), victory was attained, and calm restored. "Sleep on now," He said to His disciples (the crisis is past; your help can avail no more): "Arise, let us be going" (the future has to be faced; the betrayer is at hand. See the remarkable sermon of F.W. Robertson, II, sermon 22).<P>b) Betrayal by Judas—Jesus Arrested:<P>The crisis had indeed arrived. Through the darkness, even as Jesus spoke, was seen flashing the light of torches and lanterns, revealing a mingled company of armed men—Roman soldiers, temple officers (John), others—sent by the chief priests, scribes and elders, to apprehend Jesus. Their guide was Judas. It had been found impracticable to lay hands on Jesus in public, but Judas knew this retreat (<a onClick="return mV(\'Jhn\',18,2);">Joh 18:2</a>), and had arranged, by an act of dastardly treachery, to enable them to effect the capture in privacy. The sign was to be a kiss. With an affectation of friendship, only possible to one into whose heart the devil had truly entered (<a onClick="return mV(\'Luk\',22,3);">Lu 22:3</a>; <a onClick="return mV(\'Jhn\',13,27);">Joh 13:27</a>), Judas advanced, and hailing Jesus as "\'Master," effusively kissed Him (<a onClick="return mV(\'Mat\',26,49);">Mt 26:49</a>; <a onClick="return mV(\'Mar\',14,45);">Mr 14:45</a> margin). Jesus had asked, "Betrayest thou the Son of man with a kiss?" (Luke); now He said, "Friend, do that for which thou art come" (Matthew). The soldiers essayed to take Jesus, but on their first approach, driven back as by a supernatural power, they fell to the ground (John). A proof thus given of the voluntariness of His surrender (compare <a onClick="return mV(\'Mat\',26,53);">Mt 26:53</a>: "Thinkest thou that I cannot beseech my Father," etc.), Jesus, remarking only on the iniquity of secret violence when every day they had opportunity to take Him in the temple, submitted to be seized and bound. At this point Peter, with characteristic impetuosity, remembering, perhaps, his pledge to die, if need be, with Jesus, drew a sword, and cut off the right ear of the high priest\'s servant, Malchus (John gives the names). If he thought his deed justified by what Jesus had earlier said about "swords" (<a onClick="return mV(\'Luk\',22,36,38);">Lu 22:36,38</a>), he was speedily undeceived by Jesus\' rebuke (<a onClick="return mV(\'Jhn\',18,11);">Joh 18:11</a>), and by His healing of the ear (Luke; the last miracle of Jesus before His death). How little this flicker of impulsive boldness meant is shown by the general panic that immediately followed. "All the disciples," it is related, "left him, and fled" (Matthew, Mark). Mark tells of a young man who had come upon the scene with only a linen cloth cast about his naked body, and who fled, leaving the cloth behind (<a onClick="return mV(\'Mar\',14,51,52);">14:51,52</A>). Not improbably the young man was Mark himself.<P>4. Trial before the Sanhedrin:<P>(<a onClick="return mV(\'Mat\',26,\'57-75\');">Matthew 26:57-75</a>; <a onClick="return mV(\'Mat\',27,\'1-10\');">27:1-10</a>; <a onClick="return mV(\'Mar\',14,\'53-72\');">Mark 14:53-72</a>; <a onClick="return mV(\'Mar\',15,1);">15:1</a>; <a onClick="return mV(\'Luk\',22,\'54-71\');">Luke 22:54-71</a>; <a onClick="return mV(\'Jhn\',18,\'12-27\');">John 18:12-27</a>; compare <a onClick="return mV(\'Act\',1,18,19);">Ac 1:18,19</a>):<P>It would be about midnight when Jesus was arrested, and He was at once hurried to the house of Caiaphas, the high priest, where in expectation of the capture, a company of chief priests, scribes and elders—members of the Sanhedrin—were already assembled. Here the first stage in the trial of Jesus took place.<P>The legal and constitutional questions connected with the trial of Jesus are considered in the article on <a href="./study/isbe/search.html?string=JESUS+CHRIST,+THE+ARREST+AND+TRIAL+OF">JESUS CHRIST, THE ARREST AND TRIAL OF</a>; see also Dr. Taylor Innes, The Trial of Jesus Christ; on the powers of the Sanhedrin, see <a href="./study/isbe/search.html?string=SANHEDRIN">SANHEDRIN</a>, and compare Schurer, Jewish People, etc., II,1,pp. 163ff. There seems little doubt that, while certain judicial forms were observed, the trial was illegal in nearly every particular. The arrest itself was arbitrary, as not rounded on any formal accusation (the Sanhedrin, however, seems to have arrogated to itself powers of this kind; compare <a onClick="return mV(\'Act\',4,1);">Ac 4:1</a>ff); but the night session, lack of definite charge, search for testimony, interrogation of accused, haste in condemnation, were unquestionably in flagrant violation of the established rules of Jewish judicial procedure in such cases. It is to be remembered that the death of Jesus had already been decided on by the heads of the Sanhedrin, so that the trial was wholly a means to a foregone conclusion. On the historical side, certain difficulties arise. John seems to make the first interrogation of Jesus take place before Annas, father-in-law to Caiaphas (on Annas, see below; though deposed 15 years before, he retained, in reality, all the dignity and influence of the high-priesthood; compare <a onClick="return mV(\'Luk\',3,2);">Lu 3:2</a>; <a onClick="return mV(\'Act\',4,6);">Ac 4:6</a>); after which He is sent to Caiaphas (<a onClick="return mV(\'Jhn\',18,13);">Joh 18:13,14</a>,<a onClick="return mV(\'Jhn\',18,\'19-24\');">19-24</a>). The narrative is simplified if either<P class="in15">(1) <a onClick="return mV(\'Jhn\',18,\'19-23\');">Joh 18:19-23</a> are regarded as a preliminary interrogatory by Annas till matters were prepared for the arraignment before Caiaphas; or<P class="in15">(2) <a onClick="return mV(\'Jhn\',18,24);">18:24</a> is taken as retrospective (in the sense of "had sent," as in the King James Version), and the interrogation is included in the trial by Caiaphas compare (<a onClick="return mV(\'Jhn\',18,19);">18:19</A>: "the high priest").<P>Annas and Caiaphas may be presumed from the account of Peter\'s denials to have occupied the same official residence; else Annas was present on this night to be in readiness for the trial. The frequently occurring term "chief priests" denotes the high priests, with those who had formerly held this rank, and members of their families (compare Schurer, op. cit., 203ff). They formed, with the scribes, the most important element in the Sanhedrin.<P>a) Before Annas and Caiaphas—the Unjust Judgment:<P>First Jesus was led before Annas, then by him, after a brief interview, was transferred, still bound, to Caiaphas. Annas had been deposed, as above noticed, much earlier (15 AD), but still retained the name and through his sons and relations, as long as he lived, exercised much of the authority of high priest. Like all those holding this high office, he and Caiaphas were Sadducees. Annas—if he is the questioner in <a onClick="return mV(\'Jhn\',18,\'19-23\');">Joh 18:19-23</a>—asked Jesus concerning His disciples and His teaching. Such interrogation was unlawful, the duty of the accuser, in Jewish law, being to produce witnesses; properly, therefore, Jesus referred him to His public teaching in the temple, and bade him ask those who heard Him there. An officer standing by struck Jesus with his hand for so speaking: an indignity which Jesus endured with meek remonstrance (<a onClick="return mV(\'Jhn\',18,22,23);">18:22,23</a>).<P>(1) An Illegal Session.<P>Meanwhile a company of the Sanhedrin had assembled (23 sufficed for a quorum), and Jesus was brought before this tribunal, which was presided over by Caiaphas. A hurried search had been made for witnesses (this, like the night session, was illegal), but even the suborned testimony thus obtained ("false witnesses") was found useless for the purpose of establishing, constructively or directly, a charge of blasphemy against Jesus. At length two witnesses were produced who gave a garbled version of the early saying of Jesus (<a onClick="return mV(\'Jhn\',2,19);">Joh 2:19</a>) about destroying the temple and rebuilding it in three days. To speak against the temple might be construed as speaking against God (compare <a onClick="return mV(\'Mat\',23,16,21);">Mt 23:16,21</a>; <a onClick="return mV(\'Act\',6,13,14);">Ac 6:13,14</a>), but here too the witnesses broke down through lack of agreement. At all costs, however, must Jesus be condemned: the unprecedented course therefore was taken of seeking a conviction from the mouth of the accused Himself. Rising from his seat, the high priest adjured Jesus by the living God to tell them whether He was the Christ, the Son of God (in Mark, "Son of the Blessed"). In using this title, Caiaphas had evidently in view, as in <a onClick="return mV(\'Jhn\',5,18);">Joh 5:18</a>; <a onClick="return mV(\'Jhn\',10,33);">10:33</a>, a claim to equality with God. The supreme moment had come, and Jesus did not falter in His reply: "Thou hast said." Then, identifying Himself with the Son of Man in Daniel\'s vision (<a onClick="return mV(\'Dan\',7,13,14);">Da 7:13,14</a>), He solemnly added, "Henceforth (from His resurrection on) ye shall see the Son of man sitting at the right hand of Power, and coming on the clouds of heaven." It was enough. Without even the pretense of inquiry into the truth or falsehood of the claim, the high priest rent his garments, exclaiming, "He hath spoken blasphemy," and by assent of all Jesus was adjudged worthy of death. Abuse and insult followed. The minions of the Sanhedrin were permitted to spit on the condemned One, smite Him, blindfold and mock Him, saying, "Prophesy unto us, thou Christ: who is he that struck thee?" Then, with further blows, He was led away (<a onClick="return mV(\'Mat\',26,68);">Mt 26:68</a>).<P>(2) A Morning Confirmation.<P>To give color of judicial sanction to these tumultuous and wholly irregular night proceedings, a more formal meeting of the Sanhedrin was convened as soon as day had dawned (<a onClick="return mV(\'Mat\',27,1);">Mt 27:1</a>; <a onClick="return mV(\'Mar\',15,1);">Mr 15:1</a>; <a onClick="return mV(\'Luk\',22,\'66-71\');">Lu 22:66-71</a>). Probably the irregularities were held to be excused by the urgency of the occasion and the solemnities of the feast. Jesus was again brought forward; new questions were put which He declined to answer. Possibly a new avowal of His Messiahship was made (more probably Luke includes in this scene, the only one he records, some of the particulars of the earlier proceedings). The judgment of the past night was confirmed.<P>b) The Threefold Denial:<P>While this greatest moral tragedy of the trial and condemnation of Jesus was in process, a lesser, but still awful, tragedy in the history of a soul was being enacted in the court of the same building (from this the chamber in which the Sanhedrin sat was visible), in the threefold denial of his Master by the apostle Peter. Peter, who had followed "afar off" (Luke), had gained access to the court through an unnamed disciple, whom it is easy to identify with John (<a onClick="return mV(\'Jhn\',18,15);">Joh 18:15</a>). As he stood warming himself at a fire which had been kindled, the maid who had admitted them (John), gazing attentively at Peter, said boldly, "Thou also wast with Jesus the Galilean" (<a onClick="return mV(\'Mat\',26,69);">Mt 26:69</a>). Unnerved, and affrighted by his surroundings, Peter took the readiest mode of escape in denial. "I know him not." His heart must have sunk within him as he framed the words, and the crowing of a cock at the moment (Mark—perhaps an hour after midnight), reminding him of his Master\'s warning, completed his discomfiture. Guiltily he withdrew to the porch, only a little after to be accosted by another (the maid had spoken to her neighbors, Mark), with the same charge. More afraid than ever, he declared again, "I know not this man," and, seeing he was not believed, strengthened the denial with an oath. Yet a third time, an hour later, a bystander (or several, Mark), this time founding on his Galilean speech, pronounced, "Of a truth thou art one of them." Peter, to clear himself, cursed and swore, anew disclaiming knowledge of his Lord. To this depth had the boastful apostle fallen—as low, it might seem, as Judas! But there was a difference. As Peter spoke the cock again crew—the cockcrow which gives its form to three of the narratives (Mark alone mentions the double cockcrowing). At the same instant, either from within, or as He was being led forth, Jesus turned and looked on His erring disciple. That look—so full of pity, sorrow, reproach—could never be forgotten! Its effect was instantaneous: "Peter went out, and wept bitterly."<P>c) Remorse and Suicide of Judas:<P>Peter\'s heartfelt repentance has its counterfoil in the remorse of Judas, which, bitter as it also was, cannot receive the nobler name. First, Judas sought to return the 30 shekels paid him as the price of blood ("I betrayed innocent blood"); then, when callously rebuffed by the priests and elders, he flung down the accursed money in the sanctuary, and went and hanged himself. Matthew and Acts seem to follow slightly divergent traditions as to his end and the purchase of the potter\'s field. The underlying facts probably are that the priests applied the money, which they could not put into the treasury (Matthew), to the purchase of the field, where, either before or after the purchase, Judas destroyed himself (Acts: falling and bursting asunder), assigning it as a place to bury strangers in. Its connection with Judas is attested by its name, "Akeldama," "the field of blood."<P>The Jews might condemn, but they had no power to execute sentence of death (<a onClick="return mV(\'Jhn\',18,31);">Joh 18:31</a>). This power had been taken from them by the Romans, and was now vested in the Roman governor. The procurator of Judea was Pontius Pilate, a man hated by the Jews for his ruthless tyranny (see <a href="./study/isbe/search.html?string=PILATE">PILATE</a>), yet, as the Gospels show him, not without a sense of right, but vacillating and weak-willed in face of mob clamor, and risk to his own interests.<P>5. Trial before Pilate:<P>(<a onClick="return mV(\'Mat\',27,2);">Matthew 27:2</a>,<a onClick="return mV(\'Mat\',27,\'11-31\');">11-31</a>; <a onClick="return mV(\'Mar\',15,\'1-20\');">Mark 15:1-20</a>; <a onClick="return mV(\'Luk\',23,\'1-25\');">Luke 23:1-25</a>; <a onClick="return mV(\'Jhn\',18,\'28-40\');">John 18:28-40</a>; <a onClick="return mV(\'Jhn\',19,\'1-16\');">19:1-16</a>)<P>His residence in Jerusalem ("Praetorium," the English Revised Version "palace") was probably Herod\'s former palace (thus Schurer, G.A. Smith, etc.), on the tesselated pavement (<a onClick="return mV(\'Jhn\',19,13);">Joh 19:13</a>) in the semicircular front of which was placed the tribunal (bema) from which judgments were delivered. It was to this place Jesus was now brought. The events took place when it was "early" (<a onClick="return mV(\'Jhn\',18,28);">Joh 18:28</a>), probably between 6 a.m. and 7 a.m. (compare <a onClick="return mV(\'Jhn\',19,14);">Joh 19:14</a>, Roman camputation).<P>a) The Attitude of the Accusers:<P>Jesus was taken within the Praetorium, but His accusers were too scrupulous about defilement at the Passover festival (<a onClick="return mV(\'Jhn\',18,28);">Joh 18:28</a>) to enter the building. Pilate therefore came out to hear their accusation. They would fain have had him endorse their condemnation without further inquiry, but this he would not do. They would not have it that it was a simple question of their law, yet had to justify their demand for a death sentence (<a onClick="return mV(\'Jhn\',18,31);">Joh 18:31</a>). They based, therefore, on the alleged revolutionary character of Christ\'s teaching, His forbidding to pay tribute to Caesar (a false charge), His claim to be a king (<a onClick="return mV(\'Luk\',23,2,5);">Lu 23:2,5</a>), to all which charges Jesus answered not a word (<a onClick="return mV(\'Mar\',15,3,5);">Mr 15:3,5</a>). At a later stage, after Pilate, who knew very well that no mere sedition against the Roman power had called forth all this passion (witness the choice of Barabbas), had repeatedly declared that he found no crime in Jesus (<a onClick="return mV(\'Mar\',15,14);">Mr 15:14</a>; <a onClick="return mV(\'Luk\',23,4,14,22);">Lu 23:4,14,22</a>; <a onClick="return mV(\'Jhn\',18,38);">Joh 18:38</a>; <a onClick="return mV(\'Jhn\',19,4,6);">19:4,6</a>), the real spring of their action was laid bare: "We have a law, and by that law he ought to die, because he made himself the Son of God" (<a onClick="return mV(\'Jhn\',19,7);">Joh 19:7</a>). When it was seen how this declaration made Pilate only the more unwilling to yield to their rage, return was made to the political motive, now in the form of personal threat: "If thou release this man, thou art not Caesar\'s friend" (<a onClick="return mV(\'Jhn\',19,12);">Joh 19:12</a>). This was Pilate\'s weak point, and the Jews knew it. The clamor grew ever louder, "Crucify him, crucify him." Hate of Jesus and national degradation could go no farther than in the cry, "We have no king but Caesar" (<a onClick="return mV(\'Jhn\',19,15);">Joh 19:15</a>).<P>b) The Attitude of Pilate:<P>Pilate was from the first impressed with the innocence of Jesus, and was sincerely anxious, as his actions showed, to save Him from the terrible and ignominious death His implacable enemies were bent on inflicting upon Him. His crime was that, as Roman judge, he finally, against his own convictions, through fear of a charge of disloyalty to Caesar, yielded up to torture and death One whom he had pronounced guiltless, to gratify the brutal passions of a mob. By Pilate\'s own admissions, Christ\'s death was, not a punishment for any crime, but a judicial murder. First, through private examination, Pilate satisfied himself that the kingship Jesus claimed ("Thou sayest") carried with it no danger to the throne of Caesar. Jesus was a king indeed, but His kingdom was not of this world; was not, like earthly kingdoms, supported by violence; was founded on the truth, and gathered its subjects from those that received the truth (<a onClick="return mV(\'Jhn\',18,36,37);">Joh 18:36,37</a>). The indifference to the name of truth which the jaded mind of Pilate confessed ("What is truth?") could not hide from him the nobility of soul of the Holy One who stood before him. He declared publicly, "I find no fault in this man," and thereafter sought means of saving Him, at least of shifting the responsibility of His condemnation from himself to others.<P>(1) Jesus Sent to Herod.<P>Hearing in the clamor round the judgment seat that Jesus was a Galilean, and remembering that Herod Antipas, who had jurisdiction in that region, was in the city, Pilate\'s first expedient was to send Jesus to Herod, to be examined by him (<a onClick="return mV(\'Luk\',23,\'6-11\');">Lu 23:6-11</a>). This act of courtesy had the effect of making Herod and Pilate, who had been at enmity, again friends (<a onClick="return mV(\'Luk\',23,12);">Lu 23:12</a>); otherwise it failed of its object. Herod was pleased enough to see One he had so often heard about—even thought in his flippancy that a miracle might be done by Him—but when Jesus, in presence of "that fox" (<a onClick="return mV(\'Luk\',13,32);">Lu 13:32</a>), refused to open His mouth in answer to the accusations heaped upon Him, Herod, with his soldiers, turned the matter into jest, by clothing Jesus in gorgeous apparel, and sending Him back as a mock-king to Pilate.<P>(2) "Not This Man, but Barabbas."<P>Pilate\'s next thought was to release Jesus in pursuance of a Jewish custom of setting free a prisoner at the feast, and to this end, having again protested that no fault had been found in Him, offered the people the choice between Jesus and a notorious robber and murderer called Barabbas, then in prison. Just then, as he sat on the judgment seat, a message from his wife regarding a dream she had ("Have thou nothing to do with that righteous man," <a onClick="return mV(\'Mat\',27,19);">Mt 27:19</a>) must strongly have influenced his superstitious mind. Pilate could hardly have conceived that the multitude would prefer a murderer to One so good and pure; but, instigated by the priests, they perpetrated even this infamy, shouting for the release of Barabbas and the crucifixion of Jesus.<P>(3) "Ecce Homo."<P>Pilate\'s weakness now began to reveal itself. He proposed to "chastise" (scourge) Jesus—why "chastise," if He was innocent?—then release Him. But this compromise, as was to be anticipated, only whetted the eagerness for blood, and the cries grew ever louder, "Crucify him." Pilate, however, as if yielding to the storm, did deliver Jesus to be scourged (scourging—a fearful infliction—preceded crucifixion), the cruelty being aggravated by the maltreatment of the soldiers, who, outstripping former mockeries, put on His head a crown of thorns, arrayed Him in a purple robe, and rained blows upon His bleeding face and form. It seems to have been a design of Pilate to awake pity, for once again he brought Jesus forth, and in this affecting guise, with new attestation of His innocence, presented Him to the people in the words, "Behold, the man!" (<a onClick="return mV(\'Jhn\',19,5);">Joh 19:5</a>). How hideous the mockery, at once to declare of such an one, "I find no crime in him," and to exhibit Him to the crowd thus shamefully abused! No pity dwelt in these hearts, however, and the shouts became still angrier, "Crucify him."<P>(4) A Last Appeal—Pilate Yields.<P>The words of the leaders, "He made himself the Son of God," spoken as a reason for putting Jesus to death (<a onClick="return mV(\'Jhn\',19,7);">Joh 19:7</a>), struck a new fear into the heart of Pilate. It led him again to enter the Praetorium, and inquire of this strange prisoner, unlike any he had ever seen, "Whence art thou?" Jesus was silent. "Knowest thou not," asked Pilate, "that I have power to release thee, and have power to crucify thee?" Jesus answered only that he, Pilate, had no power over Him at all save what was given him of God; the greater therefore was the crime of those who had subjected Him to this abuse of Divinely given power. Again Pilate went out and sought to release Him, but was met by the fierce cries that foreboded complaint to Caesar (<a onClick="return mV(\'Jhn\',19,12);">Joh 19:12</a>). A tumult seemed imminent, and Pilate succumbed. Here probably (though possibly after the choice of Barabbas) is to be placed the washing of his hands by Pilate—a vain disclaiming of his responsibility—recorded in <a onClick="return mV(\'Mat\',27,24);">Mt 27:24</a>, and the awful answer of the people, "His blood be on us, and on our children" (<a onClick="return mV(\'Mat\',27,25);">27:25</a>). Pilate now ascends the judgment seat, and, fully conscious of the iniquity of his procedure, pronounces the formal sentence which dooms Jesus to the cross. The trial over, Jesus is led again into the Pretorium, where the cruel mockery of the soldiers is resumed in intensified form. The Holy One, thorn-crowned, clad in purple, a reed thrust into His hand, is placed at the mercy of the whole band, who bow the knee in ridicule before Him ("Hail, King of the Jews"), spit upon Him in contempt, smite Him on the head with the reed (Matthew, Mark). Then, stripped of the robe, His own garments are put on Him, in preparation for the end.<P>c) The Attitude of Jesus:<P>In all this hideous scene of cruelty, injustice, and undeserved suffering, the conspicuous feature in the bearing of Jesus is the absolute calmness, dignity and meekness with which He endures the heaviest wrongs and insults put upon Him. The picture in <a onClick="return mV(\'Isa\',53,7,8);">Isa 53:7,8</a> is startling in its fidelity: "When he was afflicted he opened not his mouth; as a lamb that is led to the slaughter, and as a sheep that before its shearers is mute, so he opened not his mouth. By oppression and judgment he was taken away," etc. There is no return of the perturbation of Gethsemane. As if the strength won there had raised Him into a peace that nothing could shake, He passed through the frightful physical exhaustion, mental strain, agony of scourging, suffering from wounds and blows, of that terrible night and morning, with unbroken fortitude and unembittered spirit. Not a word of complaint passes His lips; He makes no reply to accusations; when reviled, He reviles not again; He takes all with submission, as part of the cup the Father has given Him to drink. It is a spectacle to move the stoniest heart. Well to remember that it is the world\'s sin, in which all share, that mingled the bitter draught!<P>III. The Crucifixion and Burial.<P>1. The Crucifixion:<P>(<a onClick="return mV(\'Mat\',27,\'31-56\');">Matthew 27:31-56</a>; <a onClick="return mV(\'Mar\',15,\'20-41\');">Mark 15:20-41</a>; <a onClick="return mV(\'Luk\',23,\'26-49\');">Luke 23:26-49</a>; <a onClick="return mV(\'Jhn\',19,\'16-37\');">John 19:16-37</a>)<P>Crucifixion was the form of punishment reserved by the Romans for slaves, foreigners and the vilest criminals, and could not be inflicted on a Roman citizen. With its prolonged and excruciating torture, it was the most agonizing and ignominious death which the cruelty of a cruel age could devise. Jewish law knew nothing of it (the \'hanging on a tree\' of <a onClick="return mV(\'Deu\',21,22,23);">De 21:22,23</a>, was after death; compare <a onClick="return mV(\'Gal\',3,13);">Ga 3:13</a>), yet to it the Jewish leaders hounded Pilate on to doom their Messiah. The cross was no doubt of the usual Roman shape (see <a href="./study/isbe/search.html?string=CROSS">CROSS</a>). The site of Golgotha, "the place of a skull" (in Luke "Calvary," the Latinized form), is quite uncertain. It may have been a slight mound resembling a skull (thus Meyer, Luthardt, Godet, etc.), but this is not known. It is only plain that it was outside the wall, in the immediate vicinity of the city (see note below on sepulcher). The time of the crucifixion was about 9 a.m. (<a onClick="return mV(\'Mar\',15,25);">Mr 15:25</a>). The day (Friday) was the "preparation" for the Sabbath of the Passover week (Matthew, Mark, Luke; compare <a onClick="return mV(\'Jhn\',19,14,31);">Joh 19:14,31</a>).<P>a) On the Way:<P>It was part of the torment of the victim of this horrible sentence that he had to bear his own cross (according to some only the patibulum, or transverse beam) to the place of execution. As Jesus, staggering, possibly fainting, under this burden, passed out of the gate, a stranger coming from the country, Simon, a man of Cyrene, was laid hold of, and compelled to carry the cross (such an one would not be punctilious about rabbinical rules of travel, especially as it was not the regular Sabbath). Jesus, however, was not wholly unpitied. In the crowd following Him were some women of Jerusalem, who bewailed and lamented Him. The Lord, turning, bade these weep, not for Him, but for themselves and for their children. "If they do these things in the green tree, what shall be done in the dry?" (<a onClick="return mV(\'Luk\',23,\'27-31\');">Lu 23:27-31</a>).<P>b) Between the Thieves—the Superscription—the Seamless Robe:<P>Golgotha being reached, the crucifixion at once took place under the care of a centurion and a quaternion of soldiers. With ruthless blows, hands and feet were nailed to the wood, then the cross was reared (the perpendicular part may, as some think, have first been placed in position). As if to emphasize, from Pilate\'s point of view, the irony of the proceedings, two robbers were crucified with Jesus, on right and left, an undesigned fulfillment of prophecy (<a onClick="return mV(\'Isa\',53,12);">Isa 53:12</a>). It was doubtless when being raised upon the cross that Jesus uttered the touching prayer—His 1st word on the cross (its genuineness need not be questioned, though some ancient manuscripts omit)—"Father, forgive them; for they know not what they do" (Luke). Above His head, according to custom, was placed a tablet with His accusation, written in three languages, Hebrew, Greek and Latin. The chief priests took offense at the form, "This is the King of the Jews," and wished the words changed to, "He said, I am King," etc., but Pilate curtly dismissed their complaint: "What I have written I have written" (John). Whether Jesus still wore the crown of thorns is doubtful. The garments of the Crucified were divided among the soldiers, but for His inner garment, woven without seam, they cast lots (compare <a onClick="return mV(\'Psa\',22,18);">Ps 22:18</a>). A draught of wine mingled with an opiate (gall or myrrh), intended to dull the senses, was offered, but refused.<P>c) The Mocking—the Penitent Thief—Jesus and His Mother:<P>The triumph of Christ\'s enemies now seemed complete, and their glee was correspondingly unrestrained. Their victim\'s helplessness was to them a disproof of His claims. Railing, and wagging their heads, they taunted Him, "If thou art the Son of God, come down from the cross"; "He saved others; himself he cannot save." At first the robbers who were crucified with Him (possibly only one) joined in this reproach, but ere long there was a change. The breast of one of the malefactors opened to the impression of the holiness and meekness of Jesus, and faith took the place of scorn. He rebuked his neighbor for reviling One who had "done nothing amiss"; then, addressing Jesus, he prayed: "Jesus, remember me when thou comest in thy kingdom." The reply of Jesus—His 2nd word on the cross—surpassed what even the penitent in these strange circumstances could have anticipated "Today shalt thou be with me in Paradise" (Luke). A not less touching incident followed—perhaps preceded—this rescue of a soul in its last extremity. Standing near the cross was a group of holy women, one of them the mother of Jesus Himself (<a onClick="return mV(\'Jhn\',19,25);">Joh 19:25</a> Mary the mother of Jesus, Mary\'s sister, Mary the wife of Clopas—some identify the two latter—Mary Magdalene). Mary, whose anguish of spirit may be imagined, was supported by the disciple John. Beholding them—His 3rd word from the cross—Jesus tenderly commended His mother to the care of John; to Mary, "Woman, behold, thy son"; to John, "Beho1d, thy mother." From that time Mary dwelt with John.<P>Three hours passed, and at noon mocking was hushed in presence of a startling natural change. The sun\'s light failed (Luke), and a deep darkness, lasting for 3 hours, settled over the land. The darkness was preternatural in its time and occasion, whatever natural agencies may have been concerned in it. The earthquake a little later (Matthew) would be due to the same causes. It was as if Nature veiled itself, and shuddered at the enormity of the crime which was being perpetrated.<P>d) The Great Darkness—the Cry of Desertion:<P>But the outer gloom was only the symbol of a yet more awful darkness that, toward the close of this period, overspread the soul of Jesus Himself. Who shall fathom the depths of agony that lay in that awful cry—the 4th from the cross—that burst loudly from the lips of Jesus, "Eli, Eli, lama sabachthani"—"My God, My God, why hast thou forsaken me" (or, "Why didst thou forsake me?")—words borrowed from <a onClick="return mV(\'Psa\',22,1);">Ps 22:1</a>! It was before remarked that death was not a natural event to Jesus, but ever had in it to His mind its significance as a judgment of God on sin. Here it was not simply death that He experienced in its most cruel form, but death bereft of the sensible comforts of the Father\'s presence. What explanation of that mystery can be found which does not take into account with <a onClick="return mV(\'Isa\',53,1);">Isa 53</a> (compare <a onClick="return mV(\'Jhn\',1,29);">Joh 1:29</a>) His character as Sin-Bearer, even as the unbroken trust with which in His loneliness He clings to God ("My God") may be felt to have in it the element of atonement? On this, however, the present is not the place to dwell.<P>e) Last Words and Death of Jesus:<P>The end was now very near. The victim of crucifixion sometimes lingered on in his agony for days; but the unexampled strain of body and mind which Jesus had undergone since the preceding day brought an earlier termination to His sufferings. Light was returning, and with it peace; and in the consciousness that all things were now finished (<a onClick="return mV(\'Jhn\',19,28);">Joh 19:28</a>), Jesus spoke again—the 5th word—"I thirst" (John). A sponge filled with vinegar was raised on a reed to His lips, while some who had heard His earlier words ("Eli, Eli," etc.), and thought He called for Elijah, said, "Let us see whether Elijah cometh to save him" (Matthew). With a last effort, Jesus cried aloud—6th and memorable word—"It is finished," then, in a final utterance—the 7th—commended His spirit to God: "Father into thy hands I commend my spirit" (Luke). Following on this word, bowing His head, He surrendered Himself to death. It will be seen that of the 7 words spoken from the cross, 3 are preserved by Luke alone (1st, 2nd, 7th), 3 by John alone (3rd, 5th, 6th), while the 4th cry ("Eli, Eli," etc.) occurs only in the first 2 evangelists (Matthew and Mark, however, speak of Jesus "crying with a loud voice" at the close).<P>f) The Spear Thrust—Earthquake and Rending of the Veil:<P>Jesus had died; the malefactors still lived. It was now 3 o\'clock in the afternoon, and it was desired that the bodies should not remain upon the cross on the approaching Sabbath. Permission was therefore obtained from Pilate for the soldiers to break the legs of the crucified (crurifragium), and so hasten death. When it was discovered that Jesus was already dead, a soldier, possibly to make sure, pierced His side with a spear, and John, who was present, notices as a special fact that "there came out blood and water" (<a onClick="return mV(\'Jhn\',19,34);">19:34</a>). Whether this means, as Stroud and others have contended, that Jesus literally died of rupture of the heart, or what other physiological explanation may be given of the phenomenon, to which the apostle elsewhere attaches a symbolical significance (<a onClick="return mV(\'1Jo\',5,6);">1Joh 5:6</a>), need not be here discussed (see <a href="./study/isbe/search.html?string=BLOOD+AND+WATER">BLOOD AND WATER</a>). This, however, was not the only startling and symbolically significant fact attending the death of Jesus. A great darkness had preluded the death; now, at the hour of His termination, the veil of the temple (i.e. of the inner shrine) was rent from top to bottom—surely a sign that the way into the holiest of all was now opened for mankind (<a onClick="return mV(\'Hbr\',9,8,12);">Heb 9:8,12</a>)—and a great earthquake shook the city and rent the rocks. Matthew connects with this the statement that from the tombs thus opened "many bodies of the saints...were raised; and coming forth out of the tombs after his resurrection they entered into the holy city and appeared unto many" (<a onClick="return mV(\'Luk\',27,52,53);">27:52,53</A>). There is nothing in itself improbable, though none of the other evangelists mention it, in such an early demonstration being given of what the Lord\'s death and resurrection meant for believers. In other ways the power of the cross was revealed. A dying robber had been won to penitence; now the centurion who commanded the soldiers was brought to the avowal, "Truly this was the Son of God" (Matthew, Mark; in Luke, "a righteous man"). The mood of the crowd, too, was changed since the morning; they "returned, smiting their breasts" (<a onClick="return mV(\'Luk\',23,48);">Lu 23:48</a>). "Afar off," speechless with sorrow, stood the women who had followed Jesus from Galilee, with other friends and disciples. The evangelists name Mary Magdalene, Mary, the mother of James and Joses, Salome (Mark), and Joanna, the wife of Chuza, Herod\'s steward (Luke).<P>2. The Burial:<P>(<a onClick="return mV(\'Mat\',27,\'57-66\');">Matthew 27:57-66</a>; compare <a onClick="return mV(\'Mat\',28,\'11-15\');">28:11-15</A>; <a onClick="return mV(\'Mar\',15,\'42-47\');">Mark 15:42-47</a>; <a onClick="return mV(\'Luk\',23,\'50-56\');">Luke 23:50-56</a>; <a onClick="return mV(\'Jhn\',19,\'38-42\');">John 19:38-42</a>)<P>Jesus had conquered hearts on His cross; now His death reveals friends from the wealthier classes, hitherto kept back by fear (<a onClick="return mV(\'Jhn\',19,38,39);">Joh 19:38,39</a>), who charge themselves with His honorable burial. One was Joseph of Arimathea, a just man, "looking for the kingdom of God," of whom the interesting fact is recorded that, though a member of the Sanhedrin, "he had not consented to their counsel and deed" (Luke); the other was Nicodemus, he who came to Jesus by night (<a onClick="return mV(\'Jhn\',3,1,2);">Joh 3:1,2</a>; <a onClick="return mV(\'Jhn\',19,39);">19:39</a>), mentioned again only in <a onClick="return mV(\'Jhn\',7,\'50-52\');">Joh 7:50-52</a>, where, also as a member of the Sanhedrin, he puts in a word for Jesus.<P>a) The New Tomb:<P>Joseph of Arimathea takes the lead. "Having dared," as Mark says (<a onClick="return mV(\'Mar\',15,43);">15:43</A>, Gr), he begged the body of Jesus from Pilate, and having obtained it, bought linen cloth wherein to wrap it, and reverently buried it in a new rock-tomb of his own (Matthew, Mark), "where never man had yet lain" (Luke). John furnishes the further particulars that the tomb was in a "garden," near where Jesus was crucified (<a onClick="return mV(\'Jhn\',19,41,42);">19:41,42</A>). He tells also of the munificence of Nicodemus, who brought as much as 100 pounds (about 75 lbs. avoir.) of spices—"a mixture of myrrh and aloes" (<a onClick="return mV(\'Jhn\',19,39);">19:39</a>), with which to enwrap the body of Jesus. This is not to be thought of as an "anointing": rather, the spices formed a powder strewn between the folds of the linen bandages (compare Luthardt, Commentary on <a onClick="return mV(\'Jhn\',19,40);">Joh 19:40</a>). The body, thus prepared, was then placed in the tomb, and a great stone rolled to tile entrance. The burial was of necessity a very hurried one, which the holy women who witnessed it—Mary Magdalene and Mary the mother of Joses are specially mentioned (Matthew, Mark)—purposed to supplement by an anointing when the Sabbath was past (compare <a onClick="return mV(\'Luk\',23,56);">Lu 23:56</a>).<P>b) The Guard of Soldiers:<P>Though Jesus was dead, the chief priests and Pharisees were far from easy in their minds about Him. Mysterious words of His had been quoted about His building of the temple in three days; possibly Judas had told something. about His sayings regarding His death and rising again on the 3rd day; in any case, His body was in the hands of His disciples, and they might remove it, and create the persuasion that He had risen. With this plea they went to Pilate, and asked from him a watch of soldiers to guard the tomb. To make assurance doubly sure, they sealed the tomb with the official seal. The result of their efforts was only, under Providence, to provide new evidence of the reality of the resurrection!<P>The uncertainty attaching to the site of Golgotha attaches also to the site of Joseph\'s rock-tomb. Opinion is about equally divided in favor of, and against, the traditional site, where the Church of the Holy Sepulchre now stands. A principal ground of uncertainty is whether that site originally lay within or without the second wall of the city (compare Stanley, Sinai and Palestine, 457ff; G.A. Smith, Jerusalem, II, 576; a good conspectus of the different opinions, with the authorities, is given in Andrews, Part VII).``132';
isbe[5026]='Jesus Christ, 4F`F. THE RESURRECTION AND ASCENSION<P>The Resurrection a Fundamental Fact:<P>The resurrection of Jesus, with its completion in the ascension, setting the seal of the Father\'s acceptance on His finished work on earth, and marking the decisive change from His state of humiliation to that of exaltation, may be called in a true sense the corner stone of Christianity (compare <a onClick="return mV(\'1Cr\',15,14,17);">1Co 15:14,17</a>). It was on the preaching of Christ crucified and risen that the Christian church was founded (e.g. <a onClick="return mV(\'Act\',2,\'32-36\');">Ac 2:32-36</a>; <a onClick="return mV(\'1Cr\',15,3,4);">1Co 15:3,4</a>). Professor Harnack would distinguish between "the Easter faith" (that Jesus lives with God) and "the Easter message," but the church never had any Easter faith apart from the Easter message. The subversion of the fact of the resurrection is therefore a first task to which unbelief addresses itself. The modern spirit rules it out a priori as miraculous. The historical fact is denied, and innumerable theories (imposture, theories of swoon, of hallucination, mythical theories, spiritualistic theories, etc.) are invented to explain the belief. None of these theories can stand calm examination (see the writer\'s work, The Resurrection of Jesus). The objections are but small dust of the balance compared with the strength of the evidence for the fact. From the standpoint of faith, the resurrection of Jesus is the most credible of events. If Jesus was indeed such an One as the gospel history declares Him to be, it was impossible that death should hold Him (<a onClick="return mV(\'Act\',2,24);">Ac 2:24</a>). The resurrection, in turn, confirms His claim to be the Son of God (<a onClick="return mV(\'Rom\',1,4);">Ro 1:4</a>).<P>1. The Resurrection:<P>(<a onClick="return mV(\'Mat\',28,1);">Matthew 28</a>; <a onClick="return mV(\'Mar\',16,1);">Mark 16</a>; <a onClick="return mV(\'Luk\',24,1);">Luke 24</a>; <a onClick="return mV(\'Jhn\',20,1);">John 20</a>; <a onClick="return mV(\'Jhn\',21,1);">21</a>; <a onClick="return mV(\'1Cr\',15,\'3-8\');">1 Corinthians 15:3-8</a>)<P>With the narratives of the resurrection are here included as inseparably connected, those of the appearances of Jesus in Jerusalem and Galilee. The accounts will show that, while the body of Jesus was a true body, identical with that which suffered on the cross (it could be seen, touched, handled), it exhibited attributes which showed that Jesus had entered, even bodily, on a new phase of existence, in which some at least of the ordinary limitations of body were transcended. Its condition in the interval between the resurrection and the ascension was an intermediate one—no longer simply natural, yet not fully entered into the state of glorification. "I am not yet ascended...I ascend" (<a onClick="return mV(\'Jhn\',20,17);">Joh 20:17</a>); in these two parts of the one saying the mystery of the resurrection body is comprised.<P>a) The Easter Morning—the Open Tomb:<P>The main facts in the resurrection narratives stand out clearly. "According to all the Gospels," the arch-skeptic Strauss concedes, "Jesus, after having been buried on the Friday evening, and lain during the Sabbath in the grave, came out of it restored to life at daybreak on Sunday" (New Life of Jesus, I, 397, English translations). Discrepancies are alleged in detail as to the time, number, and names of the women, number of angels, etc.; but most of these vanish on careful examination. The Synoptics group their material, while John gives a more detailed account of particular events.<P>(1) The Angel and the Keepers.<P>No eye beheld the actual resurrection, which took place in the early morning, while it was still dark. Matthew records that there was "a great earthquake," and tells of the descent of an angel of the Lord, who rolled away the stone, and sat upon it. Before his dazzling aspect the keepers became as dead men, and afterward fled. The chief priests bribed them to conceal the facts, and say the body had been stolen (<a onClick="return mV(\'Mat\',28,\'2-4\');">Mt 28:2-4</a>,<a onClick="return mV(\'Mat\',28,\'11-15\');">11-15</a>).<P>(2) Visit of the Women.<P>The first intimation of the resurrection to the disciples was the discovery of the empty tomb by the women who had come at early dawn (<a onClick="return mV(\'Mat\',28,1);">Mt 28:1</a>; <a onClick="return mV(\'Mar\',16,2);">Mr 16:2</a>; <a onClick="return mV(\'Luk\',24,1);">Lu 24:1</a>; <a onClick="return mV(\'Jhn\',20,1);">Joh 20:1</a>) with spices, prepared to anoint the body of Jesus (<a onClick="return mV(\'Mar\',16,1);">Mr 16:1</a>; compare <a onClick="return mV(\'Luk\',23,56);">Lu 23:56</a>). Apparently ignorant of the guard, the women were concerned on their way as to who should roll away the stone from the door of the tomb (<a onClick="return mV(\'Mar\',16,3);">Mr 16:3</a>), and were much surprised to find the stone rolled away, and the tomb open. There is no need for supposing that the women mentioned all came together. It is much more probable that they came in different groups or companies—perhaps Mary Magdalene and the other Mary, or these with Salome, first (Matthew, Mark; compare the "we" of <a onClick="return mV(\'Jhn\',20,2);">Joh 20:2</a>); then Joanna and other members of the Galilean band (Luke). (On the appearance of Jesus to Mary, see below.)<P>(3) The Angelic Message.<P>As the women stood, perplexed and affrighted, at the tomb, they received a vision of angels (Matthew and Mark speak only of one angel; Luke and John mention two; all allude to the dazzling brightness), who announced to them that Jesus had risen ("He is not here; for he is risen;...come, see the place where the Lord lay"), and bade them tell His disciples that He went before them to Galilee, where they should see Him (Matthew, Mark; Luke, who does not record the Galilean appearances, omits this part, and recalls the words spoken by Jesus in Galilee, concerning His death and resurrection; compare <a onClick="return mV(\'Mat\',16,21);">Mt 16:21</a>). The women departed with "trembling and astonishment" (Mark), yet "with great joy" (Matthew). Here the original Mark breaks off (<a onClick="return mV(\'Mar\',16,8);">Mr 16:8</a>), the remaining verses being an appendix. But it is granted that Mark must originally have contained an account of the report to the disciples, and of an appearance of Jesus in Galilee.<P>b) Visit of Peter and John—Appearance to Mary:<P>(John; compare <a onClick="return mV(\'Mar\',16,9,10);">Mark 16:9,10</a>; <a onClick="return mV(\'Luk\',24,12,24);">Luke 24:12,24</a>)<P>The narrative in John enlarges in important respects those of the Synoptics. From it we learn that Mary Magdalene (no companion is named, but one at least is implied in the "we" of <a onClick="return mV(\'Jhn\',20,2);">20:2</a>), concluding from the empty tomb that the body of Jesus had been removed, at once ran to carry the news to Peter and John ("They have taken away the Lord out of the tomb, and we know not where they have laid him"). These apostles lost no time in hastening to the spot. John, who arrived first, stooping down, saw the linen cloths lying, while Peter, entering, beheld also the napkin for the head rolled up in a place by itself. After John likewise had entered ("He saw, and believed"), they returned to their home. Meanwhile Mary had come back disconsolate to the tomb, where, looking in, she, like the other women, had a vision of two angels. It was then that Jesus addressed her, "Why weepest thou?" At first she thought it was the gardener, but on Jesus tenderly naming her, "Mary," she recognized who it was, and, with the exclamation, "Rabboni" ("Teacher"), would have clasped Him, but He forbade: "Touch me not," etc. (<a onClick="return mV(\'Jhn\',20,17);">Joh 20:17</a>, margin "Take not hold on me"), i.e. "Do not wait, but hasten to tell my disciples that I am risen, and ascend to my Father" (the ascension-life had already begun, altering earlier relations).<P>Report to the Disciples—Incredulity.<P>The appearance of Jesus to the other women (<a onClick="return mV(\'Mat\',28,9,10);">Mt 28:9,10</a>) is referred to below. It is probable that, on the way back, Mary Magdalene rejoined her sisters, and that the errand to the disciples—or such of them as could be found—was undertaken together. Their report was received with incredulity (<a onClick="return mV(\'Luk\',24,11);">Lu 24:11</a>; compare <a onClick="return mV(\'Mar\',16,11);">Mr 16:11</a>). The visit of Peter referred to in <a onClick="return mV(\'Luk\',24,12);">Lu 24:12</a> is doubtless that recorded more precisely in John.<P>c) Other Easter-Day Appearances (Emmaus, Jerusalem):<P>Ten appearances of Jesus altogether after His resurrection are recorded, or are referred to; of these five were on the day of resurrection. They are the following:<P>(1) The first is the appearance to Mary Magdalene above described.<P>(2) The second is an appearance to the women as they returned from the tomb, recorded in <a onClick="return mV(\'Mat\',28,9,10);">Mt 28:9,10</a>. Jesus met them, saying, "All hail," and as they took hold of His feet and worshipped Him, He renewed the commission they had received for the disciples. Some regard this as only a generalization of the appearance to Mary Magdalene, but it seems distinct.<P>(3) An appearance to Peter, attested by both <a onClick="return mV(\'Luk\',24,34);">Lu 24:34</a> and Paul (<a onClick="return mV(\'1Cr\',15,5);">1Co 15:5</a>). This must have been early in the day, probably soon after Peter\'s visit to the tomb. No particulars are given of this interview, so marked an act of grace of the risen Lord to His repentant apostle. The news of it occasioned much excitement among the disciples (<a onClick="return mV(\'Luk\',24,34);">Lu 24:34</a>).<P>(4) The fourth was an appearance to two disciples on their way from Jerusalem to Emmaus—a village about two hours distant (<a onClick="return mV(\'Luk\',24,\'12-35\');">Lu 24:12-35</a>; <a onClick="return mV(\'Mar\',16,12,13);">Mr 16:12,13</a>). They were conversing on the sad events of the last few days, and on the strange tidings of the women\'s vision of angels, when Jesus overtook them, and entered into conversation with them. At first they did not recognize Him—a token, as in Mary\'s case, of change in His appearance—though their hearts burned within them as He opened to them the Scriptures about Christ\'s sufferings and glory. As the day was closing, Jesus abode with them to the evening meal; then, as He blessed and brake the bread, "Their eyes were opened, and they knew him; and he vanished out of their sight" (<a onClick="return mV(\'Luk\',24,30,31);">Lu 24:30,31</a>). They hastily rose, and returned to the company of disciples at Jerusalem. According to <a onClick="return mV(\'Mar\',16,13);">Mr 16:13</a>, their testimony, like that of the women, was not at first believed.<P>(5) The fifth appearance was that to "the eleven," with others, in the evening—an appearance recorded by Luke (<a onClick="return mV(\'Luk\',24,36);">24:36</a>ff), and John (<a onClick="return mV(\'Jhn\',20,\'19-23\');">20:19-23</a>), and alluded to by Paul (<a onClick="return mV(\'1Cr\',15,5);">1Co 15:5</a>). The disciples from Emmaus had just come in, and found the company thrilling with excitement at the news that the Lord had appeared to Simon (Luke). The doors were closed for fear of the Jews, when suddenly Jesus appeared in their midst with the salutation, "Peace be unto you" (Luke, John; doubt is unnecessarily cast on <a onClick="return mV(\'Luk\',24,36,40);">Lu 24:36,40</a>, by their absence from some Western texts). The disciples were affrighted; they thought they had seen a spirit (Luke); "disbelieved for joy" (<a onClick="return mV(\'Luk\',24,41);">Lu 24:41</a>). To remove their fears, Jesus showed them His hands and His feet (in John, His side), and ate before them (Luke). He then breathed on them, saying, "Receive ye the Holy Spirit," and renewed the commission formerly given to remit and retain sins (John; compare <a onClick="return mV(\'Mat\',18,17,18);">Mt 18:17,18</a>). The breathing was anticipative of the later affusion of the Spirit at Pentecost (compare <a onClick="return mV(\'Jhn\',7,39);">Joh 7:39</a>; <a onClick="return mV(\'Act\',2,\'1-\');">Ac 2</a>); the authority delegated depends for its validity on the possession of that Spirit, and its exercise according to the mind of Christ (compare e.g. <a onClick="return mV(\'1Cr\',5,3);">1Co 5:3</a>). The incident strikingly illustrates at once the reality of Christ\'s risen body, and the changed conditions under which that body now existed.<P>d) The Second Appearance to the Eleven—the Doubt of Thomas:<P>Eight days after this first appearance—i.e. the next Sunday evening—a second appearance of Jesus to the apostles took place in the same chamber and under like conditions ("the doors being shut"). The peculiar feature of this second meeting was the removal of the doubt of Thomas who, it is related, had not been present on the former occasion. Thomas, devoted (compare <a onClick="return mV(\'Jhn\',11,16);">Joh 11:16</a>), but of naturally questioning temperament (<a onClick="return mV(\'Jhn\',14,5);">Joh 14:5</a>), refused to believe on the mere report of others that the Lord had risen, and demanded indubitable sensible evidence for himself. Jesus, at the second appearance, after salutation as before, graciously gave the doubting apostle the evidence he asked: "Reach hither thy finger, and see my hands," etc. (<a onClick="return mV(\'Jhn\',20,27);">Joh 20:27</a>), though, as the event proved, the sign was not needed. The faith and love of the erst-while doubter leaped forth at once in adoring confession: "My Lord and my God." It was well; but Jesus reminded him that the highest faith is not that which waits on the evidence of sense ("Blessed are they that have not seen, and yet have believed," <a onClick="return mV(\'Jhn\',20,29)
