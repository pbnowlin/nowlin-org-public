isbe[6801]='Pentecost`pen\'-te-kost:<P>1. In the Old Testament:<P>As the name indicates (pentekoste), this second of the great Jewish national festivals was observed on the 50th day, or 7 weeks, from the Paschal Feast, and therefore in the Old Testament it was called "the feast of weeks." It is but once mentioned in the historical books of the Old Testament (<a onClick="return mV(\'2Ch\',8,12,13);">2Ch 8:12,13</a>), from which reference it is plain, however, that the people of Israel, in Solomon\'s day, were perfectly familiar with it: "offering according to the commandment of Moses, on the sabbaths, and on the new moons, and on the set feasts, three times in the year, even in the feast of unleavened bread, and in the feast of weeks, and in the feast of tabernacles." The requirements of the three great festivals were then well understood at this time, and their authority was founded in the Mosaic Law and unquestioned. The festival and its ritual were minutely described in this Law. Every male in Israel was on that day required to appear before the Lord at the sanctuary (<a onClick="return mV(\'Exd\',34,22,23);">Ex 34:22,23</a>). It was the first of the two agrarian festivals of Israel and signified the completion of the barley-harvest (<a onClick="return mV(\'Lev\',23,15,16);">Le 23:15,16</a>; <a onClick="return mV(\'Deu\',16,9,10);">De 16:9,10</a>), which had begun at the time of the waving of the first ripe sheaf of the first-fruits (<a onClick="return mV(\'Lev\',23,11);">Le 23:11</a>). Pentecost, or the Feast of Weeks, therefore fell on the 50th day after this occurrence. The wheat was then also nearly everywhere harvested (<a onClick="return mV(\'Exd\',23,16);">Ex 23:16</a>; <a onClick="return mV(\'Exd\',34,22);">34:22</a>; <a onClick="return mV(\'Num\',28,26);">Nu 28:26</a>), and the general character of the festival was that of a harvest-home celebration. The day was observed as a Sabbath day, all labor was suspended, and the people appeared before Yahweh to express their gratitude (<a onClick="return mV(\'Lev\',23,21);">Le 23:21</a>; <a onClick="return mV(\'Num\',28,26);">Nu 28:26</a>). The central feature of the day was the presentation of two loaves of leavened, salted bread unto the Lord (<a onClick="return mV(\'Lev\',23,17,20);">Le 23:17,20</a>; <a onClick="return mV(\'Exd\',34,22);">Ex 34:22</a>; <a onClick="return mV(\'Num\',28,26);">Nu 28:26</a>; <a onClick="return mV(\'Deu\',16,10);">De 16:10</a>). The size of each loaf was fixed by law. It must contain the tenth of an ephah, about three quarts and a half, of the finest wheat flour of the new harvest (<a onClick="return mV(\'Lev\',23,17);">Le 23:17</a>). Later Jewish writers are very minute in their description of the preparation of these two loaves (Josephus, Ant, III, x, 6). According to the Mishna (Menachoth, xi.4), the length of the loaf was 7 handbreadths, its width 4, its depth 7 fingers. <a onClick="return mV(\'Lev\',23,18);">Le 23:18</a> describes the additional sacrifices required on this occasion. It was a festival of good cheer, a day of joy. Free-will offerings were to be made to the Lord (<a onClick="return mV(\'Deu\',16,10);">De 16:10</a>), and it was to be marked by a liberal spirit toward the Levite, the stranger, and orphans and widows (<a onClick="return mV(\'Deu\',16,11,14);">De 16:11,14</a>). Perhaps the command against gleaning harvest-fields has a bearing on this custom (<a onClick="return mV(\'Lev\',23,22);">Le 23:22</a>).<P>The Old Testament does not give it the historical significance which later Jewish writers have ascribed to it. The Israelites were admonished to remember their bondage on that day and to reconsecrate themselves to the Lord (<a onClick="return mV(\'Deu\',16,12);">De 16:12</a>), but it does not yet commemorate the giving of the Law at Sinai or the birth of the national existence, in the Old Testament conception (<a onClick="return mV(\'Exd\',19,\'1-\');">Ex 19</a>). Philo, Josephus, and the earlier Talmud are all ignorant of this new meaning which was given to the day in later Jewish history. It originated with the great Jewish rabbi Maimonides and has been copied by Christian writers. And thus a view of the Jewish Pentecost has been originated, which is wholly foreign to the scope of the ancient institution.<P>2. In the New Testament:<P>The old Jewish festival obtained a new significance, for the Christian church, by the promised outpouring of the Holy Spirit (<a onClick="return mV(\'Jhn\',16,7,13);">Joh 16:7,13</a>). The incidents of that memorable day, in the history of Christianity, are told in a marvelously vivid and dramatic way in the Acts of the Apostles. The old rendering of sumplerousthai (<a onClick="return mV(\'Act\',2,1);">Ac 2:1</a>) by "was fully come" was taken by Lightfoot (Her. Heb.) to signify that the Christian Pentecost did not coincide with the Jewish, just as Christ\'s last meal with His disciples was considered not to have coincided with the Jewish Passover, on Nisan 14. The bearing of the one on the other is obvious; they stand and fall together. the Revised Version (British and American) translates the obnoxious word simply "was now come." Meyer, in his commentary on the Acts, treats this question at length. The tradition of the ancient church placed the first Christian Pentecost on a Sunday. According to John, the Passover that year occurred on Friday, Nisan 14 (<a onClick="return mV(\'Jhn\',18,28);">18:28</A>). But according to Matthew, Mark, and Luke, the Passover that year occurred on Thursday, Nisan 14, and hence, Pentecost fell on Saturday. The Karaites explained the shabbath of <a onClick="return mV(\'Lev\',23,15);">Le 23:15</a> as pointing to the Sabbath of the paschal week and therefore always celebrated Pentecost on Sunday. But it is very uncertain whether the custom existed in Christ\'s day, and moreover it would be impossible to prove that the disciples followed this custom, if it could be proved to have existed. Meyer follows the Johannic reckoning and openly states that the other evangelists made a mistake in their reckoning. No off-hand decision is possible, and it is but candid to admit that here we are confronted with one of the knottiest problems in the harmonizing of the Gospels.<P>See <a href="./study/isbe/search.html?string=CHRONOLOGY+OF+THE+NEW+TESTAMENT">CHRONOLOGY OF THE NEW TESTAMENT</a>.<P>The occurrences of the first pentecostal day after the resurrection of Christ set it apart as a Christian festival and invested it, together with the commemoration of the resurrection, with a new meaning. We will not enter here upon a discussion of the significance of the events of the pentecostal day described in <a onClick="return mV(\'Act\',2,\'1-\');">Ac 2</a>. That is discussed in the article under <a href="./study/isbe/search.html?string=TONGUES">TONGUES</a> (which see). The Lutherans, in their endeavor to prove the inherent power of the Word, claim that "the effects then exhibited were due to the divine power inherent in the words of Christ; and that they had resisted that power up to the day of Pentecost and then yielded to its influence." This is well described as "an incredible hypothesis" (Hodge, Systematic Theology, III, 484). The Holy Spirit descended in answer to the explicit promise of the glorified Lord, and the disciples had been prayerfully waiting for its fulfillment (<a onClick="return mV(\'Act\',1,4,14);">Ac 1:4,14</a>). The Spirit came upon them as "a power from on high." God the Holy Spirit proved on Pentecost His personal existence, and the intellects, the hearts, the lives of the apostles were on that day miraculously changed. By that day they were fitted for the arduous work that lay before them. There is some difference of opinion as to what is the significance of Pentecost for the church as an institution. The almost universal opinion among theologians and exegetes is this: that Pentecost marks the rounding of the Christian church as an institution. This day is said to mark the dividing line between the ministry of the Lord and the ministry of the Spirit. The later Dutch theologians have advanced the idea that the origin of the church, as an institution, is to be found in the establishment of the apostolate, in the selection of the Twelve. Dr. A. Kuyper holds that the church as an institution was founded when the Master selected the Twelve, and that these men were "qualified for their calling by the power of the Holy Spirit." He distinguishes between the institution and the constitution of the church. Dr. H. Bavinck says: "Christ gathers a church about Himself, rules it directly so long as He is on the earth, and appoints twelve apostles who later on will be His witnesses. The institution of the apostolate is an especially strong proof of the institutionary character which Christ gave to His church on the earth" (Geref. Dogm., IV, 64).<P>Whatever we may think of this matter, the fact remains that Pentecost completely changed the apostles, and that the enduement with the Holy Spirit enabled them to become witnesses of the resurrection of Christ as the fundamental fact in historic Christianity, and to extend the church according to Christ\'s commandment. Jerome has an especially elegant passage in which Pentecost is compared with the beginning of the Jewish national life on Mt. Sinai (Ad Tabiol, section 7): "There is Sinai, here Sion; there the trembling mountain, here the trembling house; there the flaming mountain, here the flaming tongues; there the noisy thunderings, here the sounds of many tongues; there the clangor of the ramshorn, here the notes of the gospel-trumpet." This vivid passage shows the close analogy between the Jewish and Christian Pentecost.<P>3. Later Christian Observance:<P>In the post-apostolic Christian church Pentecost belonged to the so-called "Semestre Domini," as distinct from the "Semestre Ecclesiae" the church festivals properly so called. As yet there was no trace of Christmas, which began to appear about 360 AD. Easter, the beginning of the pentecostal period, closed the "Quadragesima," or "Lent," the entire period of which had been marked by self-denial and humiliation. On the contrary, the entire pentecostal period, the so-called "Quinquagesima," was marked by joyfulness, daily communion, absence of fasts, standing in prayer, etc. Ascension Day, the 40th day of the period, ushered in the climax of this joyfulness, which burst forth in its fullest volume on Pentecost. It was highly esteemed by the Fathers. Chrysostom calls it "the metropolis of the festivals" (De Pentec., Hom. ii); Gregory of Nazianzen calls it "the day of the Spirit" (De Pentec., Orat. 44). All the Fathers sound its praises. For they fully understood, with the church of the ages, that on that day the dispensation of the Spirit was begun, a dispensation of greater privileges and of a broader horizon and of greater power than had hitherto been vouchsafed to the church of the living God. The festival "Octaves," which, in accordance with the Jewish custom, devoted a whole week to the celebration of the festival, from the 8th century, gave place to a two days\' festival, a custom still preserved by the Roman church and such Protestant bodies as follow the ecclesiastical year. The habit of dressing in white and of seeking baptism on Pentecost gave it the name "Whitsunday," by which it is popularly known all over the world.``42';
isbe[6802]='Penuel`pe-nu\'-el, pen\'-u-el.`<a href="./study/isbe/search.html?string=PENIEL">PENIEL</a>`1';
isbe[6803]='Penury`pen\'-u-ri (machcor): In <a onClick="return mV(\'Pro\',14,23);">Pr 14:23</a>, with sense of "poverty," "want": "The talk of the lips tendeth only to penury." In the New Testament the word in <a onClick="return mV(\'Luk\',21,4);">Lu 21:4</a> (husterema) is in the Revised Version (British and American) translated "want" (of the widow\'s mites).``1';
isbe[6804]='People`pe\'-p\'-l: In English Versions of the Bible represents something over a dozen Hebrew and Greek words. Of these, in the Old Testament, \'am, is overwhelmingly the most common (about 2,000 times), with le\'om, and goy, next in order; but the various Hebrew words are used with very little or no difference in force (e.g. <a onClick="return mV(\'Pro\',14,28);">Pr 14:28</a>; but, on the other hand, in <a onClick="return mV(\'Psa\',44,\'1-\');">Ps 44</a> contrast verses <a onClick="return mV(\'Psa\',44,12);">12</a> and <a onClick="return mV(\'Psa\',44,14);">14</A>). Of the changes introduced by the Revised Version (British and American) the only one of significance (cited explicitly in the Preface to the English Revised Version) is the frequent use of the plural "peoples" (strangely avoided in the King James Version except <a onClick="return mV(\'Rev\',10,11);">Re 10:11</a>; <a onClick="return mV(\'Rev\',17,15);">17:15</a>), where other nations than Israel are in question. So, for instance, in <a onClick="return mV(\'Psa\',67,4);">Ps 67:4</a>; <a onClick="return mV(\'Isa\',55,4);">Isa 55:4</a>; <a onClick="return mV(\'Isa\',60,2);">60:2</a>, with the contrast marked in <a onClick="return mV(\'Psa\',33,10);">Ps 33:10</a> and <a onClick="return mV(\'Psa\',33,12);">12</A>; <a onClick="return mV(\'Psa\',77,14,15);">Ps 77:14 and 15</a>, etc. In the New Testament, laos, is the most common word, with ochlos, used almost as often in the King James Version. But in the Revised Version (British and American) the latter word is almost always rendered "multitude," "people" being retained only in <a onClick="return mV(\'Luk\',7,12);">Lu 7:12</a>; <a onClick="return mV(\'Act\',11,24,26);">Ac 11:24,26</a>; <a onClick="return mV(\'Act\',19,26);">19:26</a>, and in the fixed phrase "the common people" (ho polus ochlos) in <a onClick="return mV(\'Mar\',12,37);">Mr 12:37</a>; <a onClick="return mV(\'Jhn\',12,9,12);">Joh 12:9,12</a> margin (the retention of "people" would have been better in <a onClick="return mV(\'Jhn\',11,42);">Joh 11:42</a>, also), with "crowd" (<a onClick="return mV(\'Mat\',9,23,25);">Mt 9:23,25</a>; <a onClick="return mV(\'Act\',21,35);">Ac 21:35</a>). The only special use of "people" that calls for attention is the phrase "people of the land." This may mean simply "inhabitants," as <a onClick="return mV(\'Eze\',12,19);">Eze 12:19</a>; <a onClick="return mV(\'Eze\',33,2);">33:2</a>; <a onClick="return mV(\'Eze\',39,13);">39:13</a>; but in <a onClick="return mV(\'2Ki\',11,14);">2Ki 11:14</a>, etc., and the parallel in 2 Chronicles, it means the people as contrasted with the king, while in <a onClick="return mV(\'Jer\',1,18);">Jer 1:18</a>, etc., and in <a onClick="return mV(\'Eze\',7,27);">Eze 7:27</a>; <a onClick="return mV(\'Eze\',22,29);">22:29</a>; <a onClick="return mV(\'Eze\',46,3,9);">46:3,9</a>, it means the common people as distinguished from the priests and the aristocracy. A different usage is that for the heathen (<a onClick="return mV(\'Gen\',23,7,12,13);">Ge 23:7,12,13</a>; <a onClick="return mV(\'Num\',14,9);">Nu 14:9</a>) or half-heathen (<a onClick="return mV(\'Ezr\',9,1,2);">Ezr 9:1,2</a>; <a onClick="return mV(\'Ezr\',10,2,11);">10:2,11</a>; <a onClick="return mV(\'Neh\',10,\'28-31\');">Ne 10:28-31</a>) inhabitants of Palestine. From this last use, the phrase came to be applied by some rabbis to even pure-blooded Jews, if they neglected the observance of the rabbinic traditions (compare <a onClick="return mV(\'Jhn\',7,49);">Joh 7:49</a> the King James Version).`<a href="./study/isbe/search.html?string=CHILDREN+OF+THE+EAST">CHILDREN OF THE EAST</a>`48';
isbe[6805]='Peor`pe\'-or (ha-pe\'or; Phogor):<P>(1) A mountain in the land of Moab, the last of the three heights to which Balaam was guided by Balak in order that he might curse Israel (<a onClick="return mV(\'Num\',23,28);">Nu 23:28</a>). It is placed by Eusebius, Onomasticon on the way between Livias and Heshbon, 7 Roman miles from the latter. Buhl would identify it with Jebel el-Mashaqqar, on which are the ruins of an old town, between Wady A\'yun Musa and Wady Chesban.<P>(2) A town in the Judean uplands added by Septuagint (Phagor) to the list in <a onClick="return mV(\'Jos\',15,9);">Jos 15:9</a>. It may be identical with Khirbet Faghur to the south of Bethlehem.<P>(3) Peor, in <a onClick="return mV(\'Num\',25,18);">Nu 25:18</a>; <a onClick="return mV(\'Num\',31,16);">31:16</a>; <a onClick="return mV(\'Jos\',22,17);">Jos 22:17</a>, is a divine name standing for "Baal-peor."<P>(4) In <a onClick="return mV(\'Gen\',36,39);">Ge 36:39</a>, Septuagint reads Phogor for "Pau" (Massoretic Text), which in <a onClick="return mV(\'1Ch\',1,50);">1Ch 1:50</a> appears as "Pai."``54';
isbe[6806]='Peraea`pe-re\'-a (he Peraia, Peraios, Peraites):<P>1. The Country:<P>This is not a Scriptural name, but the term used by Josephus to denote the district to which the rabbis habitually refer as "the land beyond Jordan." This corresponds to the New Testament phrase peran tou Iordanou (<a onClick="return mV(\'Mat\',4,15);">Mt 4:15</a>; <a onClick="return mV(\'Mat\',19,1);">19:1</a>, etc.). The boundaries of the province are given by Josephus (BJ, III, iii, 3). In length it reached from Pella in the north to Macherus in the south, and in breadth from the Jordan on the west to the desert on the east. We may take it that the southern boundary was the Arnon. The natural boundary on the north would be the great gorge of the Yarmuk. Gadara, Josephus tells us (BJ, IV, vii,3,6), was capital of the Peraea. But the famous city on the Yarmuk was a member of the Decapolis, and so could hardly take that position. More probably Josephus referred to a city the ruins of which are found at Jedur—a reminiscence of the ancient name—not far from es-SalT. The Northern Gadara then holding the land on the southern bank of the Yarmuk, the northern boundary of the Peraea would run, as Josephus says, from Pella eastward. For the description of the country thus indicated see <a href="./study/isbe/search.html?string=GILEAD">GILEAD, 2</a>.<P>In the time of the Maccabees the province was mainly gentile, and Judas found it necessary to remove to Judea the scattered handful of Jews to secure their safety (1Macc 5:45).<P>2. History:<P>Possibly under Hyrcanus Jewish influence began to prevail; and before the death of Janneus the whole country owned his sway (HJP, I, i,297, 306). At the death of Herod the Great it became part of the tetrarchy of Antipas (Ant., XVII, vii, 1). The tetrarch built a city on the site of the ancient Beth-haram (<a onClick="return mV(\'Jos\',13,27);">Jos 13:27</a>) and called it Julias in honor of the emperor\'s wife (Ant., XVIII, ii, 1; BJ, II, ix 1). Here Simon made his abortive rising (Ant., XVII, x, 6; BJ, II, iv, 2). Claudius placed it under the government of Felix (BJ, II, xii, 8). It was finally added to the Roman dominions by Placidus (BJ, IV, vii, 3-6). Under the Moslems it became part of the province of Damascus.<P>Peraea, "the land beyond Jordan," ranked along with Judea and Galilee as a province of the land of Israel. The people were under the same laws as regarded tithes, marriage and property.<P>Peraea lay between two Gentile provinces on the east, as Samaria between two Jewish provinces on the west of the Jordan. The fords below Beisan and opposite Jericho afforded communication with Galilee and Judea respectively. Peraea thus formed a link connecting the Jewish provinces, so that the pilgrims from any part might go to Jerusalem and return without setting foot on Gentile soil. And, what was at least of equal importance, they could avoid peril of hurt or indignity which the Samaritans loved to inflict on Jews passing through Samaria (<a onClick="return mV(\'Luk\',9,52);">Lu 9:52</a>f; Ant, XX, vi, 1; Vita, 52).<P>It seems probable that Jesus was baptized within the boundaries of the Peraea; and hither He came from the turmoil of Jerusalem at the Feast of the Dedication (<a onClick="return mV(\'Jhn\',10,40);">Joh 10:40</a>). It was the scene of much quiet and profitable intercourse with His disciples (<a onClick="return mV(\'Mat\',19,\'1-\');">Mt 19</a>; <a onClick="return mV(\'Mar\',10,\'1-31\');">Mr 10:1-31</a>; <a onClick="return mV(\'Luk\',18,\'15-30\');">Lu 18:15-30</a>). These passages are by many thought to refer to the period after His retirement to Ephraim (<a onClick="return mV(\'Jhn\',11,54);">Joh 11:54</a>). It was from Peraea that He was summoned by the sisters at Bethany (<a onClick="return mV(\'Jhn\',11,3);">Joh 11:3</a>).<P>Peraea furnished in Niger one of the bravest men who fought against the Romans (BJ, II, xx, 4; IV, vi, 1). From Bethezob, a village of Peraea, came Mary, whose story is one of the most appalling among the terrible tales of the siege of Jerusalem (BJ, VI, iii, 4). Josephus mentions Peraea for the last time (BJ, VI, v, 1), as echoing back the doleful groans and outcries that accompanied the destruction of Jerusalem.``54';
isbe[6807]='Perazim, Mount`per\'-a-zim, pe-ra\'-zim (har-peratsim): "Yahweh will rise up as in mount Perazim" (<a onClick="return mV(\'Isa\',28,21);">Isa 28:21</a>). It is usually considered to be identical with <a href="./study/isbe/search.html?string=BAAL-PERAZIM">BAAL-PERAZIM</a> (which see), where David obtained a victory over the Philistines (<a onClick="return mV(\'2Sa\',5,20);">2Sa 5:20</a>; <a onClick="return mV(\'1Ch\',14,11);">1Ch 14:11</a>).``1';
isbe[6808]='Perdition`per-dish\'-un (apoleia, "ruin" or "loss," physical or eternal): The word "perdition" occurs in the English Bible 8 times (<a onClick="return mV(\'Jhn\',17,12);">Joh 17:12</a>; <a onClick="return mV(\'Phl\',1,28);">Php 1:28</a>; <a onClick="return mV(\'2Th\',2,3);">2Th 2:3</a>; <a onClick="return mV(\'1Ti\',6,9);">1Ti 6:9</a>; <a onClick="return mV(\'Hbr\',10,39);">Heb 10:39</a>; <a onClick="return mV(\'2Pe\',3,7);">2Pe 3:7</a>; <a onClick="return mV(\'Rev\',17,11,18);">Re 17:11,18</a>). In each of these cases it denotes the final state of ruin and punishment which forms the opposite to salvation. The verb apolluein, from which the word is derived, has two meanings:<P>(1) to lose;<P>(2) to destroy.<P>Both of these pass over to the noun, so that apoleia comes to signify:<P>(1) loss;<P>(2) ruin, destruction.<P>The former occurs in <a onClick="return mV(\'Mat\',26,8);">Mt 26:8</a>; <a onClick="return mV(\'Mar\',14,4);">Mr 14:4</a>, the latter in the passages cited above. Both meanings had been adopted into the religious terminology of the Scriptures as early as the Septuagint. "To be lost" in the religious sense may mean "to be missing" and "to be ruined," The former meaning attaches to it in the teaching of Jesus, who compares the lost sinner to the missing coin, the missing sheep, and makes him the object of a seeking activity (<a onClick="return mV(\'Mat\',10,6);">Mt 10:6</a>; <a onClick="return mV(\'Mat\',15,24);">15:24</a>; <a onClick="return mV(\'Mat\',18,11);">18:11</a>; <a onClick="return mV(\'Luk\',15,4,6,8,24,32);">Lu 15:4,6,8,24,32</a>; <a onClick="return mV(\'Luk\',19,10);">19:10</a>). "To be lost" here signifies to have become estranged from God, to miss realizing the relations which man normally sustains toward Him. It is equivalent to what is theologically called "spiritual death." This conception of "loss" enters also into the description of the eschatological fate of the sinner as assigned in the judgment (<a onClick="return mV(\'Luk\',9,24);">Lu 9:24</a>; <a onClick="return mV(\'Luk\',17,33);">17:33</a>), which is a loss of life. The other meaning of "ruin" and "destruction" describes the same thing from a different point of view. Apoleia being the opposite of soteria, and soteria in its technical usage denoting the reclaiming from death unto life, apoleia also acquires the specific sense of such ruin and destruction as involves an eternal loss of life (<a onClick="return mV(\'Phl\',1,28);">Php 1:28</a>; <a onClick="return mV(\'Hbr\',10,39);">Heb 10:39</a>). Perdition in this latter sense is equivalent to what theology calls "eternal death." When in <a onClick="return mV(\'Rev\',17,8,11);">Re 17:8,11</a> it is predicated of "the beast," one of the forms of the world-power, this must be understood on the basis of the Old Testament prophetic representation according to which the coming judgment deals with powers rather than persons.<P>The Son of Perdition is a name given to Judas (<a onClick="return mV(\'Jhn\',17,12);">Joh 17:12</a>) and to the Antichrist (<a onClick="return mV(\'2Th\',2,3);">2Th 2:3</a>). This is the well-known Hebrew idiom by which a person typically embodying a certain trait or character or destiny is called the son of that thing. The name therefore represents Judas and the Antichrist (see <a href="./study/isbe/search.html?string=MAN+OF+SIN">MAN OF SIN</a>) as most irrecoverably and completely devoted to the final apoleia.``182';
isbe[6809]='Peres`pe\'-rez.`<a href="./study/isbe/search.html?string=MENE">MENE</a>`1';
isbe[6810]='Peresh`pe\'-resh (peresh, "dung"): Son of Machir, grandson of Manasseh through his Aramitish concubine (<a onClick="return mV(\'1Ch\',7,14,16);">1Ch 7:14,16</a>).``1';
isbe[6811]='Perez-Uzza`pe-rez-uz\'-za.`<a href="./study/isbe/search.html?string=UZZA">UZZA</a>`1';
isbe[6812]='Perez; Pharez`pe\'-rez, fa\'-rez (perets, "breach"): One of the twins born to Judah by Tamar, Zerah\'s brother (<a onClick="return mV(\'Gen\',38,29,30);">Ge 38:29,30</a>). In the King James Version <a onClick="return mV(\'Mat\',1,3);">Mt 1:3</a> and <a onClick="return mV(\'Luk\',3,33);">Lu 3:33</a>, he is called "Phares," the name in 1Esdras 5:5. He is "Pharez" in the King James Version <a onClick="return mV(\'Gen\',46,12);">Ge 46:12</a>; <a onClick="return mV(\'Num\',26,20,21);">Nu 26:20,21</a>; <a onClick="return mV(\'Rth\',4,12,18);">Ru 4:12,18</a>; <a onClick="return mV(\'1Ch\',2,4,5);">1Ch 2:4,5</a>; <a onClick="return mV(\'1Ch\',4,1);">4:1</a>; <a onClick="return mV(\'1Ch\',9,4);">9:4</a>. In the King James Version and the Revised Version (British and American) <a onClick="return mV(\'1Ch\',27,3);">1Ch 27:3</a>; <a onClick="return mV(\'Neh\',11,4,6);">Neh 11:4,6</a>, he is "Perez." He is important through the fact that by way of Ruth and Boaz and so through Jesse and David his genealogy comes upward to the Saviour. The patronymic "Pharzite" occurs in <a onClick="return mV(\'Num\',26,20);">Nu 26:20</a> the King James Version.<P>Perezites (<a onClick="return mV(\'Num\',16,20);">Nu 16:20</a>, the King James Version "Pharzites"). The patronymic of the name Perez.``186';
isbe[6813]='Perfect; Perfection`pur\'-fekt, per-fek\'-shun (shalem, tamim; teleios, teleiotes):<P>1. In the Old Testament:<P>"Perfect" in the Old Testament is the translation of shalem, "finished," "whole," "complete," used (except in <a onClick="return mV(\'Deu\',25,15);">De 25:15</a>, "perfect weight") of persons, e.g. a "perfect heart," i.e. wholly or completely devoted to Yahweh (<a onClick="return mV(\'1Ki\',8,61);">1Ki 8:61</a>, etc.; <a onClick="return mV(\'1Ch\',12,38);">1Ch 12:38</a>; <a onClick="return mV(\'Isa\',38,3);">Isa 38:3</a>, etc.); tamim, "complete," "perfect," "sound or unblemished," is also used of persons and of God, His way, and law ("Noah was a just man and perfect," the Revised Version margin "blameless" (<a onClick="return mV(\'Gen\',6,9);">Ge 6:9</a>); "As for God, his way is perfect" (<a onClick="return mV(\'Psa\',18,30);">Ps 18:30</a>); "The law of Yahweh is perfect" (<a onClick="return mV(\'Psa\',19,7);">Ps 19:7</a>), etc.); tam, with the same, meaning, occurs only in Job, except twice in Psalms (<a onClick="return mV(\'Job\',1,1,8);">Job 1:1,8</a>; <a onClick="return mV(\'Job\',2,3);">2:3</a>, etc.; <a onClick="return mV(\'Psa\',37,37);">Ps 37:37</a>; <a onClick="return mV(\'Psa\',64,4);">64:4</a>); kalil, "complete," and various other words are translated "perfect."<P>Perfection is the translation of various words so translated once only: kalil (<a onClick="return mV(\'Lam\',2,15);">La 2:15</a>); mikhlal, "completeness" (<a onClick="return mV(\'Psa\',50,2);">Ps 50:2</a>); minleh, "possession" (<a onClick="return mV(\'Job\',15,29);">Job 15:29</a>, the King James Version "neither shall the prolong the perfection thereof upon the earth," the American Standard Revised Version "neither shall their possessions be extended on the earth," margin "their produce bend to the earth"; the English Revised Version reverses this text and margin); tikhlah, "completeness," or "perfection (<a onClick="return mV(\'Psa\',119,96);">Ps 119:96</a>); takhlith (twice), "end," "completeness" (<a onClick="return mV(\'Job\',11,7);">Job 11:7</a>, "Canst thou find out the Almighty unto perfection?" <a onClick="return mV(\'Job\',28,3);">28:3</A>, "searcheth out all" the Revised Version (British and American) the King James Version, the Revised Version (British and American) "to the furthest bound"; compare <a onClick="return mV(\'Job\',26,10);">Job 26:10</a>, "unto the confines of light and darkness"); tom, "perfect," "completeness" (<a onClick="return mV(\'Isa\',47,9);">Isa 47:9</a>, the King James Version "They shall come upon thee in their perfection," the Revised Version (British and American) "in their full measure"). the Revised Version margin gives the meaning of "the Urim and the Thummim" (<a onClick="return mV(\'Exd\',28,30);">Ex 28:30</a> etc.) as "the Lights and the Perfections."<P>2. In the New Testament:<P>In the New Testament "perfect" is usually the tr of teleios, primarily, "having reached the end," "term," "limit," hence, "complete," "full," "perfect" (<a onClick="return mV(\'Mat\',5,48);">Mt 5:48</a>, "Ye therefore shall be perfect, as your heavenly Father is perfect"; <a onClick="return mV(\'Mat\',19,21);">Mt 19:21</a>, "if thou wouldst be perfect; <a onClick="return mV(\'Eph\',4,13);">Eph 4:13</a>, the King James Version "till we all come...unto a perfect man," the Revised Version (British and American) "full-grown"; <a onClick="return mV(\'Phl\',3,15);">Php 3:15</a>, "as many as are perfect," the American Revised Version margin "full-grown"; <a onClick="return mV(\'1Cr\',2,6);">1Co 2:6</a>; <a onClick="return mV(\'Col\',1,28);">Col 1:28</a>, "perfect in Christ"; <a onClick="return mV(\'Col\',4,12);">4:12</A>; <a onClick="return mV(\'Jam\',3,2);">Jas 3:2</a> margin, etc.).<P>Other words are teleioo. "to perfect," "to end," "complete" (<a onClick="return mV(\'Luk\',13,32);">Lu 13:32</a>, "The third day I am perfected," the Revised Version margin "end my course"; <a onClick="return mV(\'Jhn\',17,23);">Joh 17:23</a>, "perfected into one"; <a onClick="return mV(\'2Cr\',12,9);">2Co 12:9</a>; <a onClick="return mV(\'Phl\',3,12);">Php 3:12</a>, the Revised Version (British and American) "made perfect"; <a onClick="return mV(\'Hbr\',2,10);">Heb 2:10</a>, etc.); also epiteleo, "to bring through to an end" (<a onClick="return mV(\'2Cr\',7,1);">2Co 7:1</a>, "perfecting holiness in the fear of God"; <a onClick="return mV(\'Gal\',3,3);">Ga 3:3</a>, "Are ye now made perfect by the flesh?" the King James Version, the Revised Version (British and American) "perfected in the flesh," margin "Do ye now make an end in the flesh?"); katartizo "to make quite ready," "to make complete," is translated "perfect," "to perfect" (<a onClick="return mV(\'Mat\',21,16);">Mt 21:16</a>, "perfected praise"; <a onClick="return mV(\'Luk\',6,40);">Lu 6:40</a>, "Every one when he is perfected shall be as his teacher"; <a onClick="return mV(\'1Cr\',1,10);">1Co 1:10</a>; <a onClick="return mV(\'2Cr\',13,11);">2Co 13:11</a>, "be perfected"; <a onClick="return mV(\'1Th\',3,10);">1Th 3:10</a>; <a onClick="return mV(\'1Pe\',5,10);">1Pe 5:10</a>, the Revised Version margin "restore"); akribos, "accurately," "diligently," is translated "perfect" (<a onClick="return mV(\'Luk\',1,3);">Lu 1:3</a>, "having had perfect understanding," the Revised Version (British and American) "having traced...accurately"; <a onClick="return mV(\'Act\',18,26);">Ac 18:26</a> the King James Version, the Revised Version (British and American) "more accurately"). We have also artios, "fitted," "perfected" (<a onClick="return mV(\'2Ti\',3,7);">2Ti 3:7</a>, the Revised Version (British and American) "complete"); pleroo, "to fill," "to make full" (<a onClick="return mV(\'Rev\',3,2);">Re 3:2</a>, the American Standard Revised Version "perfected," the English Revised Version "fulfilled"); katartismos, "complete adjustment," "perfecting" (<a onClick="return mV(\'Eph\',4,12);">Eph 4:12</a>, "for the perfecting of the saints").<P>Perfection is the translation of katartisis "thorough adjustment," "fitness" (<a onClick="return mV(\'2Cr\',13,9);">2Co 13:9</a>, the Revised Version (British and American) "perfecting"); of teleiosis (<a onClick="return mV(\'Hbr\',7,11);">Heb 7:11</a>); of teleiotess (<a onClick="return mV(\'Hbr\',6,1);">Heb 6:1</a>, the Revised Version margin "full growth"); it is translated "perfectness" (<a onClick="return mV(\'Col\',3,14);">Col 3:14</a>); "perfection" in <a onClick="return mV(\'Luk\',8,14);">Lu 8:14</a> is the translation of telesphoreo, "to bear on to completion or perfection." In Apocrypha "perfect," "perfection," etc., are for the most part the translation of words from telos, "the end," e.g. The <span class="noTag">Wisdom of Solomon 4:13</span>; Ecclesiasticus 34:8; 44:17; 45:8, suntelia "full end"; 24:28; 50:11.<P>The Revised Version (British and American) has "perfect" for "upright" (<a onClick="return mV(\'2Sa\',22,24,26);">2Sa 22:24,26</a> twice); for "sound" (<a onClick="return mV(\'Psa\',119,80);">Ps 119:80</a>); for "perform" (<a onClick="return mV(\'Phl\',1,16);">Php 1:16</a>); for "undefiled" (<a onClick="return mV(\'Psa\',119,1);">Ps 119:1</a>, margin "upright in way"); for "perfect peace, and at such a time" (<a onClick="return mV(\'Ezr\',7,12);">Ezr 7:12</a>), "perfect and so forth"; for "He maketh my way perfect" (<a onClick="return mV(\'2Sa\',22,33);">2Sa 22:33</a>), "He guideth the perfect in his way," margin "or, \'setteth free.\' According to another reading, \'guideth my way in perfectness\'";" shall himself perfect," margin "restore," for, "make you perfect" (<a onClick="return mV(\'1Pe\',5,10);">1Pe 5:10</a>); "perfecter" for "finisher" (<a onClick="return mV(\'Hbr\',12,2);">Heb 12:2</a>); "perfectly" is omitted in the Revised Version (British and American) (<a onClick="return mV(\'Mat\',14,36);">Mt 14:36</a>); "set your hope perfectly on" for the King James Version "hope to the end for" (<a onClick="return mV(\'1Pe\',1,13);">1Pe 1:13</a>).<P>3. The Christian Ideal:<P>Perfection is the Christian ideal and aim, but inasmuch as that which God has set before us is infinite—"Ye therefore shall be perfect, as your heavenly Father is perfect" (<a onClick="return mV(\'Mat\',5,48);">Mt 5:48</a>)—absolute perfection must be forever beyond, not only any human, but any finite, being; it is a divine ideal forever shining before us, calling us upward, and making endless progression possible. As noted above, the perfect man, in the Old Testament phrase, was the man whose heart was truly or wholly devoted to God. Christian perfection must also have its seat in such a heart, but it implies the whole conduct and the whole man, conformed thereto as knowledge grows and opportunity arises, or might be found. There may be, of course, a relative perfection, e.g. of the child as a child compared with that of the man. The Christian ought to be continually moving onward toward perfection, looking to Him who is able to "make you perfect in every good thing (or work) to do his will, working in us that which is well-pleasing in his sight, through Jesus Christ to whom be the glory forever and ever. Amen (<a onClick="return mV(\'Hbr\',13,21);">Heb 13:21</a>).``185';
isbe[6814]='Perform`per-form\' (Fr. parfournir, "to furnish completely," "to complete" "finish entirely"): In modern English, through a mistaken connection with "form," "perform" usually suggests an act in its continuity, while the word properly should emphasize only the completion of the act. the King James Version seems to have used the word in order to convey the proper sense (compare <a onClick="return mV(\'Rom\',15,28);">Ro 15:28</a>; <a onClick="return mV(\'2Cr\',8,11);">2Co 8:11</a>; <a onClick="return mV(\'Phl\',1,6);">Php 1:6</a>, where the Revised Version (British and American) has respectively "accomplish," "complete," "perfect"), but usually with so little justification in the Hebrew or Greek that "do" would have represented the original even better. the Revised Version (British and American) has rarely changed the word in the Old Testament, and such changes as have been made (<a onClick="return mV(\'Deu\',23,23);">De 23:23</a>; <a onClick="return mV(\'Est\',1,15);">Es 1:15</a>, etc.) seem based on no particular principle. In the New Testament the word has been kept only in <a onClick="return mV(\'Mat\',5,33);">Mt 5:33</a> and <a onClick="return mV(\'Rom\',4,21);">Ro 4:21</a>, but in neither verse does the Greek accent the completion of the act, in the former case apodidomi, literally, "to give back," in the latter poieo, "to make," "to do," being used.<P>Performance is found in the King James Version Sirach 19:20 (the Revised Version (British and American) "doing"); 2Macc 11:17 (inserted needlessly and omitted by the Revised Version (British and American)); <a onClick="return mV(\'Luk\',1,45);">Lu 1:45</a> (the Revised Version (British and American) "fulfilment"); <a onClick="return mV(\'2Cr\',8,11);">2Co 8:11</a> (the Revised Version (British and American) "completion").``48';
isbe[6815]='Perfume-Making``<a href="./study/isbe/search.html?string=CRAFTS">CRAFTS</a>`1';
isbe[6816]='Perfume; Perfumer`pur\'-ium, per-fum\' (qetoreth qatar literally, "incense"): The ancients were fond of sweet perfumes of all kinds (<a onClick="return mV(\'Pro\',27,9);">Pr 27:9</a>), and that characteristic is still especially true of the people of Bible lands. Perfumed oils were rubbed on the body and feet. At a feast in ancient Egypt a guest was anointed with scented oils, and a sweet-smelling water lily was placed in his hand or suspended on his forehead. In their religious worship the Egyptians were lavish with their incense. Small pellets of dried mixed spices and resins or resinous woods were burned in special censers. In the preparation of bodies for burial, perfumed oils and spices were used. Many Biblical references indicate the widespread use of perfumes. <a onClick="return mV(\'Sgs\',7,8);">So 7:8</a> suggests that the breath was purposely scented; clothing as well as the body was perfumed (<a onClick="return mV(\'Psa\',45,8);">Ps 45:8</a>; <a onClick="return mV(\'Sgs\',3,6);">So 3:6</a>; <a onClick="return mV(\'Sgs\',4,11);">4:11</a>); couches and beds were sprinkled with savory scents (<a onClick="return mV(\'Pro\',7,17);">Pr 7:17</a>); ointments were used in the last rites in honor of the dead (<a onClick="return mV(\'2Ch\',16,14);">2Ch 16:14</a>; <a onClick="return mV(\'Luk\',24,1);">Lu 24:1</a>; <a onClick="return mV(\'Jhn\',19,39);">Joh 19:39</a>). The writer has in his collection a lump of prepared spices and resins taken from a tomb dating from the lst or 2nd century AD, which was apparently fused and run into the thoracic cavity, since an impression of the ribs has been made on the perfume. Its odor is similar to that of the incense used today, and it perfumes the whole case where it is kept. The above collection also contains a small glass vial in which is a bronze spoon firmly held in some solidified ointment, probably formerly perfumed oil. Perfumes were commonly kept in sealed alabaster jars or cruses (<a onClick="return mV(\'Luk\',7,38);">Lu 7:38</a>). Thousands of these cruses have been unearthed in Palestine and Syria.<P>Perfumes were mixed by persons skilled in the article In the King James Version these are called "apothecaries" (raqqach). The Revised Version (British and American) "perfumer" is probably a more correct rendering, as the one who did the compounding was not an apothecary in the same sense as is the person now so designated (<a onClick="return mV(\'Exd\',30,25,35);">Ex 30:25,35</a>; <a onClick="return mV(\'Exd\',37,29);">37:29</a>; <a onClick="return mV(\'Ecc\',10,1);">Ec 10:1</a>).<P>Today incense is used in connection with all religious services of the oriental Christian churches. Although there is no direct mention of the uses of incense in the New Testament, such allusions as Paul\'s "a sacrifice to God for an odor of a sweet smell" (<a onClick="return mV(\'Eph\',5,2);">Eph 5:2</a>; <a onClick="return mV(\'Phl\',4,18);">Php 4:18</a>) would seem to indicate that it was used by the early Christians.<P>The delight of the people of Syria in pleasant odors is recorded in their literature. The attar of roses (from Arabic \'itr, "a sweet odor") was a wellknown product of Damascus. The guest in a modern Syrian home is not literally anointed with oil, but he is often given, soon after he enters, a bunch of aromatic herbs or a sweet-smelling flower to hold and smell. During a considerable portion of the year the country air is laden with the odor of aromatic herbs, such as mint and sage. The Arabic phrase for taking a walk is shemm el-hawa\', literally, "smell the air."`<a href="./study/isbe/search.html?string=INCENSE">INCENSE</a>; <a href="./study/isbe/search.html?string=OIL">OIL</a>; <a href="./study/isbe/search.html?string=OINTMENT">OINTMENT</a>`133';
isbe[6817]='Perga`pur\'-ga (Perge):<P>1. Location and History:<P>An important city of the ancient province of Pamphylia, situated on the river Cestris, 12 miles northeast of Attalia. According to <a onClick="return mV(\'Act\',13,13);">Ac 13:13</a>, Paul, Barnabas and John Mark visited the place on their first missionary journey, and 2 years later, according to <a onClick="return mV(\'Act\',14,24,25);">Ac 14:24,25</a>, they may have preached there. Though the water of the river Cestris has now been diverted to the fields for irrigating purposes, in ancient times the stream was navigable, and small boats from the sea might reach the city. It is uncertain how ancient Perga is; its walls, still standing, seem to come from the Seleucidan period or from the 3rd century BC. It remained in the possession of the Seleucid kings until 189 BC, when Roman influence became strong in Asia Minor. A long series of coins, beginning in the 2nd century BC, continued until 286 AD, and upon them Perga is mentioned as a metropolis. Though the city was never a stronghold of Christianity, it was the bishopric of Western Pamphylia, and several of the early Christians were martyred there. During the 8th century under Byzantine rule the city declined; in 1084 Attalia became the metropolis, and Perga rapidly fell to decay. While Attalia was the chief Greek and Christian city of Pamphylia, Perga was the seat of the local Asiatic goddess, who corresponded to Artemis or Diana of the Ephesians, and was locally known as Leto, or the queen of Perga. She is frequently represented on the coins as a huntress, with a bow in her hand, and with sphinxes or stags at her side.<P>2. The Ruins:<P>The ruins of Perga are now called Murtana. The walls, which are flanked with towers, show the city to have been quadrangular in shape. Very broad streets, running through the town, and intersecting each other, divided the city into quarters. The sides of the streets were covered with porticos, and along their centers were water channels in which a stream was always flowing. They were covered at short intervals by bridges. Upon the higher ground was the acropolis, where the earliest city was built, but in later times the city extended to the south of the hill, where one may see the greater part of the ruins. On the acropolis is the platform of a large structure with fragments of several granite columns, probably representing the temple of the goddess Leto; others regard it as the ruin of an early church. At the base of the acropolis are the ruins of an immense theater which seated 13,000 people, the agora, the baths and the stadium. Without the walls many tombs are to be seen.``7';
isbe[6818]='Pergamos; Pergamum`pur\'-ga-mos, or pur\'-ga-mum (he Pergamos, or to Pergamon):<P>1. History:<P>Pergamos, to which the ancient writers also gave the neuter form of the name, was a city of Mysia of the ancient Roman province of Asia, in the Caicus valley, 3 miles from the river, and about 15 miles from the sea. The Caicus was navigable for small native craft. Two of the tributaries of the Caicus were the Selinus and the Kteios. The former of these rivers flowed through the city; the latter ran along its walls. On the hill between these two streams the first city stood, and there also stood the acropolis, the chief temples, and theaters of the later city. The early people of the town were descendants of Greek colonists, and as early as 420 BC they struck coins of their own. Lysimachus, who possessed the town, deposited there 9,000 talents of gold. Upon his death, Philetaerus (283-263 BC) used this wealth to found the independent Greek dynasty of the Attalid kings. The first of this dynasty to bear the title of king was Attalus I (241-197 BC), a nephew of Philetaerus, and not only did he adorn the city with beautiful buildings until it became the most wonderful city of the East, but he added to his kingdom the countries of Mysia, Lydia, Caria, Pamphylia and Phrygia. Eumenes II (197-159 BC) was the most illustrious king of the dynasty, and during his reign the city reached its greatest height. Art and literature were encouraged, and in the city was a library of 200,000 volumes which later Antony gave to Cleopatra. The books were of parchment which was here first used; hence, the word "parchment," which is derived from the name of the town Pergamos. Of the structures which adorned the city, the most renowned was the altar of Zeus, which was 40 ft. in height, and also one of the wonders of the ancient world. When in 133 BC Attalus III, the last king of the dynasty, died, he gave his kingdom to the Roman government. His son, Aristonicus, however, attempted to seize it for himself, but in 129 he was defeated, and the Roman province of Asia was formed, and Pergamos was made its capital. The term Asia, as here employed, should not be confused with the continent of Asia, nor with Asia Minor. It applied simply to that part of Asia Minor which was then in the possession of the Romans, and formed into the province of which Pergamos was the capital. Upon the establishment of the province of Asia there began a new series of coins struck at Pergamos, which continued into the 3rd century AD. The magnificence of the city continued.<P>2. Religions:<P>There were beautiful temples to the four great gods Zeus, Dionysus, Athena and Asklepios. To the temple of the latter, invalids from all parts of Asia flocked, and there, while they were sleeping in the court, the god revealed to the priests and physicians by means of dreams the remedies which were necessary to heal their maladies. Thus opportunities of deception were numerous. There was a school of medicine in connection with the temple. Pergamos was chiefly a religious center of the province. A title which it bore was "Thrice Neokoros," meaning that in the city 3 temples had been built to the Roman emperors, in which the emperors were worshipped as gods. Smyrna, a rival city, was a commercial center, and as it increased in wealth, it gradually became the political center. Later, when it became the capital, Pergamos remained the religious center. As in many of the towns of Asia Minor, there were at Pergamos many Jews, and in 130 BC the people of the city passed a decree in their favor. Many of the Jews were more or less assimilated with the Greeks, even to the extent of bearing Greek names.<P>3. Christianity:<P>Christianity reached Pergamos early, for there one of the Seven Churches of the Book of Revelation stood, and there, according to <a onClick="return mV(\'Rev\',2,13);">Re 2:13</a>, Antipas was marryred; he was the first Christian to be put to death by the Roman state. The same passage speaks of Pergamos as the place "where Satan\'s throne is," probably referring to the temples in which the Roman emperors were worshipped. During the Byzantine times Pergamos still continued as a religious center, for there a bishop lived. However, the town fell into the hands of the Seljuks in 1304, and in 1336 it was taken by Suleiman, the son of Orkhan, and became Turkish.<P>The modern name of the town, which is of considerable size, possessing 15 mosques, is Bergama, the Turkish corruption of the ancient name. One of its mosques is the early Byzantine church of Sophia. The modern town is built among the ruins of the ancient city, but is far less in extent. From 1879 to 1886 excavations among the ruins were conducted by Herr Humann at the expense of the German government. Among them are still to be seen the base of the altar of Zeus, the friezes of which are now in the Pergamon Museum, Berlin; theater, the agora, the gymnasium and several temples. In ancient times the city was noted for its ointments, pottery and parchment; at present the chief articles of trade are cotton, wool, opium, valonia, and leather.``7';
isbe[6819]='Perida`pe-ri\'-da (peridha\' "recluse"): A family of "Solomon\'s servants" (<a onClick="return mV(\'Neh\',7,57);">Ne 7:57</a>). In <a onClick="return mV(\'Ezr\',2,55);">Ezr 2:55</a>, a difference in the Hebrew spelling gives "Peruda" for the same person, who is also the "Pharida" of 1Esdras 5:33.``1';
isbe[6820]='Perizzite`per\'-i-zit, pe-riz\'-it (perizzi; Pherezaios): Signifies "a villager," and so corresponds with the Egyptian fellah. Hence, the Perizzite is not included among the sons of Canaan in <a onClick="return mV(\'Gen\',10,\'1-\');">Ge 10</a>, and is also coupled with the Canaanite (<a onClick="return mV(\'Gen\',13,7);">Ge 13:7</a>; <a onClick="return mV(\'Gen\',34,30);">34:30</a>; <a onClick="return mV(\'Jdg\',1,4);">Jud 1:4</a>). We hear, accordingly, of Canaanites and Perizzites at Shechem (<a onClick="return mV(\'Gen\',34,30);">Ge 34:30</a>), at Bezek in Judah (<a onClick="return mV(\'Jdg\',1,4);">Jud 1:4</a>) and, according to the reading of the Septuagint, at Gezer (<a onClick="return mV(\'Jos\',16,10);">Jos 16:10</a>). In <a onClick="return mV(\'Deu\',3,5);">De 3:5</a> and <a onClick="return mV(\'1Sa\',6,18);">1Sa 6:18</a>, where the King James Version has "unwalled towns" and "country villages," the Septuagint has "Perizzite," the literal translation of the Hebrew being "cities of the Perizzite" or "villager" and "village of the Perizzite." The same expression occurs in <a onClick="return mV(\'Est\',9,19);">Es 9:19</a>, where it is used of the Jews in Elam. In <a onClick="return mV(\'Jos\',17,15,18);">Jos 17:15,18</a>, where the Manassites are instructed to take possession of the forest land of Carmel, "Perizzites and Rephaim" are given as the equivalent of "Canaanite."``157';
isbe[6821]='Perjury`pur\'-ju-ri.`<a href="./study/isbe/search.html?string=CRIMES">CRIMES</a>; <a href="./study/isbe/search.html?string=OATH">OATH</a>; <a href="./study/isbe/search.html?string=PUNISHMENTS">PUNISHMENTS</a>`1';
isbe[6822]='Perpetual; Perpetually; Perpetuity`per-pet\'-u-al, per-pet\'-u-al-i, pur-pe-tu\'-i-ti (\'olam, netsach, tamidh):<P>Perpetual is usually the translation of \'olam, properly, "a wrapping up" or "hiding," used often of time indefinitely long, and of eternity when applied to God; hence, we have, "for perpetual generations" (<a onClick="return mV(\'Gen\',9,12);">Ge 9:12</a>); "the priesthood by a perpetual statute" (<a onClick="return mV(\'Exd\',29,9);">Ex 29:9</a>; compare <a onClick="return mV(\'Exd\',31,16);">Ex 31:16</a>; <a onClick="return mV(\'Lev\',3,17);">Le 3:17</a>; <a onClick="return mV(\'Lev\',24,9);">24:9</a>, etc.); "placed the sand for the bound of the sea, by a perpetual decree, that it cannot pass it" (<a onClick="return mV(\'Jer\',5,22);">Jer 5:22</a>, the Revised Version margin "an everlasting ordinance which it cannot pass"); "sleep a perpetual sleep" (<a onClick="return mV(\'Jer\',51,39,57);">Jer 51:39,57</a>); "Moab shall be...a perpetual desolation" (<a onClick="return mV(\'Zep\',2,9);">Ze 2:9</a>), etc.; netsach, "preeminence," "perpetuity," "eternity" (often translated "for ever," <a onClick="return mV(\'Psa\',9,6);">Ps 9:6</a>), is translated "perpetual" (<a onClick="return mV(\'Psa\',74,3);">Ps 74:3</a>; <a onClick="return mV(\'Jer\',15,18);">Jer 15:18</a>); natsach (participle) (<a onClick="return mV(\'Jer\',8,5);">Jer 8:5</a>); tamidh, "continuance," generally rendered "continually," but sometimes "perpetual" or "perpetually" (<a onClick="return mV(\'Exd\',30,8);">Ex 30:8</a>; <a onClick="return mV(\'Lev\',6,20);">Le 6:20</a>).<P>"Perpetually" is the rendering of \'adh, properly "progress," "duration," hence, long or indefinite time, eternity (usually in the King James Version rendered "for ever "), in <a onClick="return mV(\'Amo\',1,11);">Am 1:11</a>, "His anger did tear perpetually"; and of kol ha-yamim, "all the days" (<a onClick="return mV(\'1Ki\',9,3);">1Ki 9:3</a>; <a onClick="return mV(\'2Ch\',7,16);">2Ch 7:16</a>, "my heart shall be there perpetually"; compare <a onClick="return mV(\'Mat\',28,20);">Mt 28:20</a>, pasas tas hemeras, literally, "all the days").<P>Perpetuity occurs in the Revised Version (British and American) of <a onClick="return mV(\'Lev\',25,23,30);">Le 25:23,30</a>, "The land shall not be sold in perpetuity," "The house...shall be made sure in perpetuity."<P>Perpetual is frequent in the Apocrypha, most often as the translation of aionios and kindred words, e.g. Judith 13:20, "a perpetual praise"; <span class="noTag">The Wisdom of Solomon 10:14</span>, "perpetual glory," the Revised Version (British and American) "eternal"; Ecclesiasticus 11:33, "a perpetual blot," the Revised Version (British and American) "blame for ever"; 1Macc 6:44, "a perpetual name," the Revised Version (British and American) "everlasting"; aenaos, "ever-flowing," occurs in <span class="noTag">The Wisdom of Solomon 11:6</span> (so the Revised Version); endeleches, "constant" (Ecclesiasticus 41:6, "perpetual reproach").<P>For "perpetual" (<a onClick="return mV(\'Jer\',50,5);">Jer 50:5</a>; <a onClick="return mV(\'Hab\',3,6);">Hab 3:6</a>) the Revised Version has "everlasting"; for "the old hatred" (<a onClick="return mV(\'Eze\',25,15);">Eze 25:15</a>), "perpetual enmity"; for "perpetual desolation" (<a onClick="return mV(\'Jer\',25,12);">Jer 25:12</a>) "desolate forever," margin "Hebrew \'everlasting desolations.\'"``185';
isbe[6823]='Persecution`pur-se-ku\'-shun [diogmos] (<a onClick="return mV(\'Mat\',13,21);">Mt 13:21</a>; <a onClick="return mV(\'Mar\',4,17);">Mr 4:17</a>; <a onClick="return mV(\'Mar\',10,30);">10:30</a>; <a onClick="return mV(\'Act\',8,1);">Ac 8:1</a>; <a onClick="return mV(\'Act\',13,50);">13:50</a>; <a onClick="return mV(\'Rom\',8,35);">Ro 8:35</a>; <a onClick="return mV(\'2Cr\',12,10);">2Co 12:10</a>; <a onClick="return mV(\'2Th\',1,4);">2Th 1:4</a>; <a onClick="return mV(\'2Ti\',3,11);">2Ti 3:11</a>)):<P>1. Persecution in Old Testament Times<P>2. Between the Testaments<P>3. Foretold by Christ<P>4. A Test of Discipleship<P>5. A Means of Blessing<P>6. Various Forms<P>7. In the Case of Jesus<P>8. Instigated by the Jews<P>9. Stephen<P>10. The Apostles James and Peter<P>11. Gentile Persecution<P class="in15">Christianity at First Not a Forbidden Religion<P>12. The Neronic Persecution<P class="in15">(1) Testimony of Tacitus<P class="in15">(2) Reference in 1 Peter<P class="in15">(3) Tacitus Narrative<P class="in15">(4) New Testament References<P>13. Persecution in Asia<P>14. Rome as Persecutor<P>15. Testimony of Pliny, 112 AD<P>16. 2nd and 3rd Centuries<P>17. Best Emperors the Most Cruel Persecutors<P>18. Causes of Persecution<P>19. 200 Years of Persecution<P>20. Persecution in the Army<P>21. Tertullian\'s Apology<P>22. "The Third Race"<P>23. Hatred against Christians<P>24. The Decian Persecution<P>25. Libelli<P>26. The Edict of Milan<P>27. Results of Persecution<hr /><P>The importance of this subject may be indicated by the fact of the frequency of its occurrence, both in the Old Testament and New Testament, where in the King James Version the words "persecute," "persecuted," "persecuting" are found no fewer than 53 times, "persecution" 14 times, and "persecutor" 9 times.<P>1. Persecution in Old Testament Times:<P>It must not be thought that persecution existed only in New Testament times. In the days of the Old Testament it existed too. In what Jesus said to the Pharisees, He specially referred to the innocent blood which had been shed in those times, and told them that they were showing themselves heirs—to use a legal phrase—to their fathers who had persecuted the righteous, "from the blood of Abel the righteous unto the blood of Zachariah" (<a onClick="return mV(\'Mat\',23,35);">Mt 23:35</a>).<P>2. Between the Testaments:<P>In the period between the close of the Old Testament and the coming of Christ, there was much and protracted suffering endured by the Jews, because of their refusal to embrace idolatry, and of their fidelity to the Mosaic Law and the worship of God. During that time there were many patriots who were true martyrs, and those heroes of faith, the Maccabees, were among those who "know their God...and do exploits" (<a onClick="return mV(\'Dan\',11,32);">Da 11:32</a>). \'We have no need of human help,\' said Jonathan the Jewish high priest, \'having for our comfort the sacred Scriptures which are in our hands\' (1Macc 12:9).<P>In the Epistle to the Hebrews, persecution in the days of the Old Testament is summed up in these words: "Others had trial of mockings and scourgings, yea, moreover of bonds and imprisonment: they were stoned, they were sawn asunder, they were tempted, they were slain with the sword: they went about in sheepskins, in goatskins; being destitute, afflicted, illtreated (of whom the world was not worthy)" (<a onClick="return mV(\'Hbr\',11,\'36-38\');">Heb 11:36-38</a>).<P>3. Foretold by Christ:<P>Coming now to New Testament times, persecution was frequently foretold by Christ, as certain to come to those who were His true disciples and followers. He forewarned them again and again that it was inevitable. He said that He Himself must suffer it (<a onClick="return mV(\'Mat\',16,21);">Mt 16:21</a>; <a onClick="return mV(\'Mat\',17,22,23);">17:22,23</a>; <a onClick="return mV(\'Mar\',8,31);">Mr 8:31</a>).<P>4. A Test of Discipleship:<P>It would be a test of true discipleship. In the parable of the Sower, He mentions this as one of the causes of defection among those who are Christians in outward appearance only. When affliction or persecution ariseth for the word\'s sake, immediately the stony-ground hearers are offended (<a onClick="return mV(\'Mar\',4,17);">Mr 4:17</a>).<P>5. A Means of Blessing:<P>It would be a sure means of gaining a blessing, whenever it came to His loyal followers when they were in the way of well-doing; and He thus speaks of it in two of the Beatitudes, "Blessed are they that have been persecuted for righteousness\' sake: for theirs is the kingdom of heaven"; "Blessed are ye when men shall reproach you, and persecute you...for my sake" (<a onClick="return mV(\'Mat\',5,10,11);">Mt 5:10,11</a>; see also <a onClick="return mV(\'Mat\',5,12);">Mt 5:12</a>).<P>6. Various Forms:<P>It would take different forms, ranging through every possible variety, from false accusation to the infliction of death, beyond which, He pointed out (<a onClick="return mV(\'Mat\',10,28);">Mt 10:28</a>; <a onClick="return mV(\'Luk\',12,4);">Lu 12:4</a>), persecutors are unable to go. The methods of persecution which were employed by the Jews, and also by the heathen against the followers of Christ, were such as these:<P>(1) Men would revile them and would say all manner of evil against them falsely, for Christ\'s sake (<a onClick="return mV(\'Mat\',5,11);">Mt 5:11</a>).<P>(2) Contempt and disparagement: "Say we not well that thou art a Samaritan, and hast a demon?" (<a onClick="return mV(\'Jhn\',8,48);">Joh 8:48</a>); "If they have called the master of the house Beelzebub, how much more them of his household!" (<a onClick="return mV(\'Mat\',10,25);">Mt 10:25</a>).<P>(3) Being, solely on account of their loyalty to Christ, forcibly separated from the company and the society of others, and expelled from the synagogues or other assemblies for the worship of God: "Blessed are ye, when men shall hate you, and when they shall separate you from their company, and reproach you, and cast out your name as evil, for the Son of man\'s sake" (<a onClick="return mV(\'Luk\',6,22);">Lu 6:22</a>); "They shall put you out of the synagogues" (<a onClick="return mV(\'Jhn\',16,2);">Joh 16:2</a>).<P>(4) Illegal arrest and spoliation of goods, and death itself.<P>All these various methods, used by the persecutor, were foretold, and all came to pass. It was the fear of apprehension and death that led the eleven disciples to forsake Jesus in Gethsemane and to flee for their lives. Jesus often forewarned them of the severity of the persecution which they would need to encounter if they were loyal to Him: "The hour cometh, that whosoever killeth you shall think that he offereth service unto God" (<a onClick="return mV(\'Jhn\',16,2);">Joh 16:2</a>); "I send unto you prophets...some of them shall ye kill and crucify; and some of them shall ye scourge in your synagogues, and persecute from city to city" (<a onClick="return mV(\'Mat\',23,34);">Mt 23:34</a>).<P>7. In the Case of Jesus:<P>In the case of Christ Himself, persecution took the form of attempts to entrap Him in His speech (<a onClick="return mV(\'Mat\',22,15);">Mt 22:15</a>); the questioning of His authority (<a onClick="return mV(\'Mar\',11,28);">Mr 11:28</a>); illegal arrest; the heaping of every insult upon Him as a prisoner; false accusation; and a violent and most cruel death.<P>8. Instigated by the Jews:<P>After our Lord\'s resurrection the first attacks against His disciples came from the high priest and his party. The high-priesthood was then in the hands of the Sadducees, and one reason which moved them to take action of this kind was their \'sore trouble,\' because the apostles "proclaimed in Jesus the resurrection from the dead" (<a onClick="return mV(\'Act\',4,2);">Ac 4:2</a>; <a onClick="return mV(\'Act\',5,17);">5:17</a>). The gospel based upon the resurrection of Christ was evidence of the untruth of the chief doctrines held by the Sadducees, for they held that there is no resurrection. But instead of yielding to the evidence of the fact that the resurrection had taken place, they opposed and denied it, and persecuted His disciples. For a time the Pharisees were more moderate in their attitude toward the Christian faith, as is shown in the case of Gamaliel (<a onClick="return mV(\'Act\',5,34);">Ac 5:34</a>); and on one occasion they were willing even to defend the apostle Paul (<a onClick="return mV(\'Act\',23,9);">Ac 23:9</a>) on the doctrine of the resurrection. But gradually the whole of the Jewish people became bitter persecutors of the Christians. Thus, in the earliest of the Pauline Epistles, it is said, "Ye also suffered the same things of your own countrymen, even as they (in Judea) did of the Jews; who both killed the Lord Jesus and the prophets, and drove out us, and please not God, and are contrary to all men" (<a onClick="return mV(\'1Th\',2,14,15);">1Th 2:14,15</a>).<P>9. Stephen:<P>Serious persecution of the Christian church began with the case of Stephen (<a onClick="return mV(\'Act\',7,\'1-60\');">Ac 7:1-60</a>); and his lawless execution was followed by "a great persecution" directed against the Christians in Jerusalem. This "great persecution" (<a onClick="return mV(\'Act\',8,1);">Ac 8:1</a>) scattered the members of the church, who fled in order to avoid bonds and imprisonment and death. At this time Saul signalized himself by his great activity, persecuting "this Way unto the death, binding and delivering into prisons both men and women" (<a onClick="return mV(\'Act\',22,4);">Ac 22:4</a>).<P>10. The Apostles, James and Peter:<P>By and by one of the apostles was put to death—the first to suffer of "the glorious company of the apostles"—James the brother of John, who was slain with the sword by Herod Agrippa (<a onClick="return mV(\'Act\',12,2);">Ac 12:2</a>). Peter also was imprisoned, and was delivered only by an angel (<a onClick="return mV(\'Act\',12,\'7-11\');">Ac 12:7-11</a>).<P>11. Gentile Persecution:<P>During the period covered by the Acts there was not much purely Gentile persecution: at that time the persecution suffered by the Christian church was chiefly Jewish. There were, however, great dangers and risks encountered by the apostles and by all who proclaimed the gospel then. Thus, at Philippi, Paul and Silas were most cruelly persecuted (<a onClick="return mV(\'Act\',16,\'19-40\');">Ac 16:19-40</a>); and, even before that time, Paul and Barnabas had suffered much at Iconium and at Lystra (<a onClick="return mV(\'Act\',14,5,19);">Ac 14:5,19</a>). On the whole the Roman authorities were not actively hostile during the greater part of Paul\'s lifetime. Gallio, for instance, the deputy of Achaia, declined to go into the charge brought by the Jews at Corinth against Paul (<a onClick="return mV(\'Act\',18,14,15,16);">Ac 18:14,15,16</a>). And when Paul had pleaded in his own defense before King Herod Agrippa and the Roman governor Festus, these two judges were agreed in the opinion, "This man doeth nothing worthy of death or of bonds" (<a onClick="return mV(\'Act\',26,31);">Ac 26:31</a>). Indeed it is evident (see Ramsay, Paul the Traveler and the Roman Citizen, 308) that the purpose of Paul\'s trial being recorded at length in the Acts is to establish the fact that the preaching of the gospel was not forbidden by the laws of the Roman empire, but that Christianity was a religio licita, a lawful religion.<P>Christianity at First Not a Forbidden Religion.<P>This legality of the Christian faith was illustrated and enforced by the fact that when Paul\'s case was heard and decided by the supreme court of appeal at Rome, he was set free and resumed his missionary labors, as these are recorded or referred to in the Pastoral Epistles "One thing, however, is clear from a comparison of Philippians with 2 Timothy. There had been in the interval a complete change in the policy toward Christianity of the Roman government. This change was due to the great fire of Rome (July, 64). As part of the persecution which then broke out, orders were given for the imprisonment of the Christian leaders. Poppea, Tigellinus and their Jewish friends were not likely to forget the prisoner of two years before. At the time Paul was away from Rome, but steps were instantly taken for his arrest. The apostle was brought back to the city in the autumn or winter of 64....That he had a trial at all, instead of the summary punishment of his brethren. witnesses to the importance attached by the government to a show of legality in the persecution of the leader" (Workman, Persecution in the Early Church, 38).<P>See <a href="./study/isbe/search.html?string=PASTORAL+EPISTLES">PASTORAL EPISTLES</a>; <a href="./study/isbe/search.html?string=PAUL,+THE+APOSTLE">PAUL, THE APOSTLE</a>.<P>12. The Neronic Persecution:<P>The legal decisions which were favorable to the Christian faith were soon overturned on the occasion of the great fire in Rome, which occurred in July, 64. The public feeling of resentment broke out against the emperor to such a degree that, to avoid the stigma, just or unjust, of being himself guilty of setting the city on fire, he made the Christians the scapegoats which he thought he needed. Tacitus (Annals xv. 44) relates all that occurred at that time, and what he says is most interesting, as being one of the very earliest notices found in any profane author, both of the Christian faith, and of Christ Himself.<P>(1) Testimony of Tacitus.<P>What Tacitus says is that nothing that Nero could do, either in the way of gifts to the populace or in that of sacrifice the Roman deities, could make the people believe that he was innocent of causing the great fire which had consumed their dwellings. Hence, to relieve himself of this infamy he falsely accused the Christians of being guilty of the crime of setting the city on fire. Tacitus uses the strange expression "the persons commonly called Christians who were hated for their enormities." This is an instance of the saying of all manner of evil against them falsely, for Christ\'s sake. The Christians, whose lives were pure and virtuous and beneficent, were spoken of as being the offscouring of the earth.<P>(2) Reference in 1 Peter.<P>The First Epistle of Peter is one of the parts of the New Testament which seem to make direct reference to the Neronic persecution, and he uses words (<a onClick="return mV(\'1Pe\',4,12);">1Pe 4:12</a>) which may be compared with the narrative of Tacitus: "Beloved, think it not strange concerning the fiery trial among you, which cometh upon you to prove you, as though a strange thing happened unto you: but insomuch as ye are partakers of Christ\'s sufferings, rejoice....If ye are reproached for the name of Christ, blessed are ye; because the Spirit of glory and the Spirit of God resteth upon you. For let none of you suffer as a murderer, or a thief, or an evil-doer, or as a meddler in other men\'s matters: but if a man suffer as a Christian, let him not be ashamed; but let him glorify God in this name. For the time is come for judgment to begin at the house of God....Wherefore let them also that suffer according to the will of God commit their souls in well-doing unto a faithful Creator."<P>(3) Tacitus\' Narrative.<P>How altogether apposite and suitable was this comforting exhortation to the case of those who suffered in the Neronic persecution. The description which Tacitus gives is as follows: "Christus, the founder of that name, was put to death as a criminal by Pontius Pilate, procurator in the reign of Tiberius. But the pernicious superstition, repressed for a time, broke out again not only through Judea, where the mischief originated, but through the city of Rome also, whither all things horrible and disgraceful flow from all quarters as to a common sink, and where they are encouraged. Accordingly, first, those were seized who confessed they were Christians; next, on their information, a vast multitude were convicted, not so much on the charge of setting the city on fire, as of hating the human race. And in their deaths they were made the subject of sport, for they were covered with the skins of wild beasts and were worried to death by dogs, or nailed to crosses, or set fire to, and when day declined were burned to serve for nocturnal lights. Nero offered his own gardens for that spectacle, and exhibited circus games, indiscriminately mingling with the common people dressed as a charioteer, or else standing in his chariot. Whence a feeling of compassion arose toward the sufferers, though guilty and deserving to be made examples of by capital punishment, because they seemed not to be cut off for the public good, but to be victims to the ferocity of one man."<P>See <a href="./study/isbe/search.html?string=NERO">NERO</a>.<P>(4) New Testament References.<P>Three of the books of the New Testament bear the marks of that most cruel persecution under Nero, the Second Epistle to Timothy, the First Epistle of Peter—already referred to—and the Revelation of John. In 2 Timothy, Paul speaks of his impending condemnation to death, and the terror inspired by the persecution causes "all" to forsake him when he is brought to public trial (<a onClick="return mV(\'2Ti\',4,16);">2Ti 4:16</a>).<P>The "fiery trial" is spoken of in 1 Peter, and Christians are exhorted to maintain their faith with patience; they are pleaded with to have their "conversation honest" (<a onClick="return mV(\'1Pe\',2,12);">1Pe 2:12</a> the King James Version), so that all accusations directed against them may be seen to be untrue, and their sufferings shall then be, not for ill-doing, but only for the name of Christ (<a onClick="return mV(\'1Pe\',3,14,16);">1Pe 3:14,16</a>). "This important epistle proves a general persecution (<a onClick="return mV(\'1Pe\',1,6);">1Pe 1:6</a>; <a onClick="return mV(\'1Pe\',4,12,16);">4:12,16</a>) in Asia Minor north of the Taurus (<a onClick="return mV(\'1Pe\',1,1);">1Pe 1:1</a>; note especially Bithynia) and elsewhere (<a onClick="return mV(\'1Pe\',5,9);">1Pe 5:9</a>). The Christians suffer \'for the name,\' but not the name alone (<a onClick="return mV(\'1Pe\',4,14);">1Pe 4:14</a>). They are the objects of vile slanders (<a onClick="return mV(\'1Pe\',2,12,15);">1Pe 2:12,15</a>; <a onClick="return mV(\'1Pe\',3,\'14-16\');">3:14-16</a>; <a onClick="return mV(\'1Pe\',4,4,15);">4:4,15</a>), as well as of considerable zeal on the part of officials (<a onClick="return mV(\'1Pe\',5,8);">1Pe 5:8 (Greek 3:15)</a>). As regards the slanders, the Christians should be crcumspect (<a onClick="return mV(\'1Pe\',2,15,16);">1Pe 2:15,16</a>; <a onClick="return mV(\'1Pe\',3,16,17);">3:16,17</a>; <a onClick="return mV(\'1Pe\',4,15);">4:15</a>). The persecution will be short, for the end of all things is at hand (<a onClick="return mV(\'1Pe\',4,7,13);">1Pe 4:7,13</a>; <a onClick="return mV(\'1Pe\',5,4);">5:4</a>)" (Workman, Persecution in the Early Church, 354).<P>13. Persecution in Asia:<P>In Revelation, the apostle John is in "Patmos for the word of God and the testimony of Jesus" (<a onClick="return mV(\'Rev\',1,9);">Re 1:9</a>). Persecution has broken out among the Christians in the province of Asia. At Smyrna, there is suffering, imprisonment and prolonged tribulation; but the sufferers are cheered when they are told that if they are faithful unto death, Christ will give them the crown of life (<a onClick="return mV(\'Rev\',2,10);">Re 2:10</a>). At Pergamum, persecution has already resulted in Antipas, Christ\'s faithful martyr, being slain (<a onClick="return mV(\'Rev\',2,13);">Re 2:13</a>). At Ephesus and at Thyatira the Christians are commended for their patience, evidently indicating that there had been persecution (<a onClick="return mV(\'Rev\',2,2,19);">Re 2:2,19</a>). At Philadelphia there has been the attempt made to cause the members of the church to deny Christ\'s name (<a onClick="return mV(\'Rev\',3,8);">Re 3:8</a>); their patience is also commended, and the hour of temptation is spoken of, which comes to try all the world, but from which Christ promised to keep the faithful Christians in Philadelphia. Strangely enough, there is no distinct mention of persecution having taken place in Sardis or in Laodicea.<P>14. Rome as Persecutor:<P>As the book proceeds, evidences of persecution are multiplied. In <a onClick="return mV(\'Rev\',6,9);">Re 6:9</a>, the apostle sees under the altar the souls of them that were slain for the word of God and for the testimony which they held; and those souls are bidden to rest yet for a little season "until their fellow-servants also and their brethren, who should be killed even as they were, should have fulfilled their course" (<a onClick="return mV(\'Rev\',6,11);">Re 6:11</a>). The meaning is that there is not yet to be an end of suffering for Christ\'s sake; persecution may continue to be as severe as ever. Compare <a onClick="return mV(\'Rev\',20,4);">Re 20:4</a> "I saw the souls of them that had been beheaded for the testimony of Jesus, and for the word of God, and such as worshipped not the beast," for the persecution had raged against all classes indiscriminately, and Roman citizens who were true to Christ had suffered unto death. It is to these that reference is made in the words "had been beheaded," decapitation being reserved as the most honorable form of execution, for Roman citizens only. So terrible does the persecution of Christians by the imperial authorities become, that Rome is "drunken with the blood of the saints, and with the blood of the martyrs of Jesus" (<a onClick="return mV(\'Rev\',17,6);">Re 17:6</a>; <a onClick="return mV(\'Rev\',16,6);">16:6</a>; see also <a onClick="return mV(\'Rev\',18,24);">Re 18:24</a>; <a onClick="return mV(\'Rev\',19,2);">19:2</a>).<P>Paul\'s martyrdom is implied in 2 Timothy, throughout the whole epistle, and especially in <a onClick="return mV(\'2Ti\',4,6,7,8);">4:6,7,8</A>. The martyrdom of Peter is also implied in <a onClick="return mV(\'Jhn\',21,18,19);">Joh 21:18,19</a>, and in <a onClick="return mV(\'2Pe\',1,14);">2Pe 1:14</a>. The abiding. impression made by these times of persecution upon the mind of the apostle John is also seen in the defiance of the world found throughout his First Epistle (<a onClick="return mV(\'1Jo\',2,17);">1Joh 2:17</a>; <a onClick="return mV(\'1Jo\',5,19);">5:19</a>), and in the rejoicing over the fall of Babylon, the great persecuting power, as that fall is described in such passages as <a onClick="return mV(\'Rev\',14,8);">Re 14:8</a>; <a onClick="return mV(\'Rev\',15,2,3);">15:2,3</a>; <a onClick="return mV(\'Rev\',17,14);">17:14</a>; <a onClick="return mV(\'Rev\',18,24);">18:24</a>.<P>Following immediately upon the close of the New Testament, there is another remarkable witness to the continuance of the Roman persecution against the Christian church. This is Pliny, proconsul of Bithynia.<P>15. Testimony of Pliny, 112 AD:<P>In 111 or 112 AD, he writes to the emperor Trajan a letter in which he describes the growth of the Christian faith. He goes on to say that "many of all ages and of all ranks and even of both sexes are being called into danger, and will continue to be so. In fact the contagion of this superstition is not confined to the cities only, but has spread to the villages and country districts." He proceeds to narrate how the heathen temples had been deserted and the religious rites had been abandoned for so long a time: even the sacrificial food—that is, the flesh of the sacrificial victims—could scarcely find a purchaser.<P>But Pliny had endeavored to stem the tide of the advancing Christian faith, and he tells the emperor how he had succeeded in bringing back to the heathen worship many professing Christians. That is to say, he had used persecuting measures, and had succeeded in forcing some of the Christians to abandon their faith. He tells the methods he had used. "The method I have observed toward those who have been brought before me as Christians is this. I asked them wheth
