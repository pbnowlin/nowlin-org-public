n its substance, incorruptible: in its purity, undefiled: in beauty, unfading" (Alford).<P>Now why does the apostle in the very opening of his Epistle give so lofty a place to the saints\' inheritance? He does so in order to comfort and encourage his fellow-believers with the consolations of the Lord Himself, that they may bear stedfastly their manifold sufferings and triumph over their weighty afflictions. Hence, he writes: "Wherein ye greatly rejoice, though now for a little while, if need be, ye have been put to grief in manifold trials, that the proof of your faith...may be found unto praise and glory and honor at the revelation of Jesus Christ" (<a onClick="return mV(\'1Pe\',1,\'6-9\');">1Pe 1:6-9</a>). He lifts their thoughts and their gaze up far above the troubles and distresses around them to Him whose they are, whom they serve, who will by and by crown them with immortal bliss.<P>4. Testimony of Prophets:<P>The prophets and their study are described in <a onClick="return mV(\'1Pe\',1,10,11);">1Pe 1:10,11</a>: "Concerning which salvation the prophets sought and searched diligently, who prophesied of the grace that should come unto you," etc. With Peter and his fellow-apostles the testimony of the prophets was authoritative and final. Where they had a clear word from the Old Testament Scriptures, they felt that every question was settled and controversy was at an end.<P>(1) Salvation.<P>The burden of the prophetic communications was salvation. The prophets spoke on many subjects; they had to exhort, rebuke and entreat their wayward contemporaries; to denounce sin, to announce judgment on the guilty and to recall them to repentance and reformation. But ever and anon their vision was filled with the future and its blessedness, their voices would swell with rapture as they saw and foretold the great salvation to be brought to the world and the grace that would then so copiously go out unto men; for the Messiah was to appear and to suffer, the just for the unjust, that He might bring us to God.<P>(2) Spirit of Christ.<P>The prophet\'s messages were the messages of the Spirit of Christ. It was He who testified beforehand the sufferings of Christ and the glories that should follow. The prophets always disclaim any part in the origination of their messages. They affirm in the most positive and solemn manner that their predictions are not their own, but God\'s. Hence, they are called the Lord\'s "spokesmen," the Lord\'s "mouth" (<a onClick="return mV(\'Exd\',4,15,16);">Ex 4:15,16</a>; <a onClick="return mV(\'Exd\',7,1,2);">7:1,2</a>; <a onClick="return mV(\'2Pe\',1,21);">2Pe 1:21</a>).<P>(3) Prophetic Study.<P>They "sought and searched diligently." These terms are strong and emphatic. They pored over the predictions which the Spirit had revealed through themselves; they scrutinized them with eager and prolonged inquiry. Two points engaged their attention: "What time or what manner of time the Spirit of Christ which was in them did point unto." The first "what" relates to the time of the Messiah\'s advent; the second "what" to the events and circumstances which would attend His appearing—a fruitful theme, one that engages the inquiry of nobler students—"which things angels desire to look into."<P>5. The Christian Brotherhood:<P>The Christian brotherhood is described in <a onClick="return mV(\'1Pe\',2,9,10);">1Pe 2:9,10</a>: "But ye are an elect race, a royal priesthood, a holy nation, a people for God\'s own possession, that ye may show forth the excellencies of him who called you out of darkness into his marvelous light." The brotherhood is the new Israel. The apostle describes it in terms which were applied to the old Israel, but which include more than the ancient Israel ever realized. The exalted conception is by one who was a strict Jew, the apostle of the circumcision, and who held somewhat closely to the Mosaic institutions to the end of his life. All the more significant on this account is his testimony. The descriptive titles which he here gathers together and places on the brow of the Christian brotherhood are of the most illustrious sort. A distinguished man, a noble, a general, a statesman, will sometimes appear in public with his breast covered with resplendent decorations which mark his rank or his achievements. But such distinctions sink into insignificance alongside of this dazzling cluster. This is the heavenly nobility, the royal family of the Lord of glory, decorated with badges brighter far than ever glittered on the breast of king or emperor. But even in this instance Peter reminds Christians of the glorious destiny awaiting them that they may be strengthened and stimulated to stedfastness and loyalty in the midst of the trials and afflictions to which they are subjected (<a onClick="return mV(\'1Pe\',2,11,12);">1Pe 2:11,12</a>)<P>6. Spirits in Prison:<P>A study of <a onClick="return mV(\'1Pe\',3,\'18-20\');">1Pe 3:18-20</a>—"preached unto the spirits in prison"—should here follow in the present cursory review of the characteristic features of the Epistle, but anything like an adequate examination of this difficult passage would require more space than could be given it. Suffice it to quote a sentence from Professor Zahn (New Testament, II, 289) with which the writer agrees: "That interpretation of <a onClick="return mV(\'1Pe\',3,19);">1Pe 3:19</a> is in all probability correct, according to which a preaching of Christ at the time of the Flood is referred to, i.e. a preaching through Noah, so that Noah is here represented as a preacher of righteousness, as in <a onClick="return mV(\'2Pe\',2,5);">2Pe 2:5</a>."<P>See <a href="./study/isbe/search.html?string=PRISON,+SPIRITS+IN">PRISON, SPIRITS IN</a>.<P>VI. Analysis.<P>A very general analysis of the Epistle is the following:<P>(1) Christian privileges, <a onClick="return mV(\'1Pe\',1,\'1-\');">1Pe 1</A>-<a onClick="return mV(\'1Pe\',2,\'1-10\');">2:10</a>.<P>(2) Christian duties, <a onClick="return mV(\'1Pe\',2,\'11-\');">1Pe 2:11-4:11</a>.<P>(3) Persecutions and trials, <a onClick="return mV(\'1Pe\',4,\'12-\');">1Pe 4:12</A>-<a onClick="return mV(\'1Pe\',4,\'5-11\');">5:11</a>.<P>(4) Personal matters and salutations, <a onClick="return mV(\'1Pe\',5,\'12-14\');">1Pe 5:12-14</a>.<P>The chief doctrines of Christianity are found in 1 Peter. The vicarious suffering and death of the Lord Jesus Christ (<a onClick="return mV(\'1Pe\',2,24);">2:24</A>; <a onClick="return mV(\'1Pe\',3,18);">3:18</a>); the new birth (<a onClick="return mV(\'1Pe\',1,3,13);">1:3,13</A>); redemption by the blood of Christ (<a onClick="return mV(\'1Pe\',1,18,19);">1:18,19</A>), faith, hope, patient endurance under unjust suffering, and holiness of life, are all pressed upon Christians with great earnestness and force.<P>LITERATURE.<P>Bible Dicts., DB, HDB, Davis, DB, EB, Sch-Herz, volume VIII; Intros: Westcott, Salmon, Zahn; Vincent, Word Studies; Commentaries: Bible Commentary, Cambridge Bible for Schools; Lillie, Jameson, Fausett and Brown, Alford, Bigg, Mayor (on 2 Peter), Johnstone (homiletical), New York, 1888; Hort, <span class="noTag">1Pe 1:1-2:17</span>, New York, 1898.``123';
isbe[6847]='Peter, the Second Epistle of`<b>I. EXTERNAL EVIDENCE IN FAVOR OF ITS APOSTOLIC AUTHORITY</b><P class="in15">1. Ancient Opinion<P class="in15">2. Modern Opinion<P class="in15">3. Dr. Chase\'s View<P>II. INTERNAL EVIDENCE IN SUPPORT OF ITS APOSTOLIC AUTHORITY<P class="in15">1. Style and Diction<P class="in15">2. Reason of Dissimilarities<P class="in15">3. Claim to Petrine Authorship<P class="in15">4. Christian Earnestness<P class="in15">5. Relation to Apostles<P class="in15">6. Autobiographical Allusions<P class="in15">7. Quoted by Jude<P><b>III. DOCTRINAL TEACHINGS OF THE EPISTLE</b><P class="in15">1. Saving Knowledge<P class="in30">(1) Basis<P class="in30">(2) Growth<P class="in30">(3) Inerrancy of Sources<P class="in15">2. The Three Worlds<P class="in30">(1) The Old World<P class="in30">(2) The Present World<P class="in30">(3) The New World<hr /><P>The Second Epistle of Peter comes to us with less historical support of its genuineness than any other book of the New Testament. In consequence, its right to a place in the Canon is seriously doubted by some and denied by others. There are those who confidently assign it to the Apostolic age and to the apostle whose name it bears in the New Testament, while there are those who as confidently assign it to post-apostolic times, and repudiate its Petrine authorship. It is not the aim of this article to trace the history of the two opinions indicated above, nor to cite largely the arguments employed in the defense of the Epistle, or those in opposition to it; nor to attempt to settle a question which for more than a thousand years the wisest and best men of the Christian church have been unable to settle. Such a procedure would in this case be the height of presumption. What is here attempted is to point out as briefly as may be some of the reasons for doubting its canonicity, on the one hand, and those in its support, on the other.<P>I. External Evidence in Favor of Its Apostolic Authority.<P>1. Ancient Opinion:<P>It must be admitted at the very outset that the evidence is meager. The first writer who mentions it by name is Origen (circa 240 AD). In his homily on Joshua, he speaks of the two Epistles of Peter. In another place he quotes <a onClick="return mV(\'2Pe\',1,4);">2Pe 1:4</a>: "partakers of the divine nature," and gives it the name of Scripture. But Origen is careful to say that its authority was questioned: "Peter has left one acknowledged Epistle, and perhaps a second, for this is contested." Eusebins, bishop of Caesarea, regarded it with even more suspicion than did Origen, and accordingly he placed it among the disputed books (Antilegomena). Jerome knew the scruples which many entertained touching the Epistle, but notwithstanding, he included it in his Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) Version. The main reason for Jerome\'s uncertainty about it he states to be "difference of style from 1 Peter." He accounts for the difference by supposing that the apostle "made use of two different interpreters." As great teachers and scholars as Origen, Eusebius, and Jerome, e.g. Athanasius, Augustine, Epiphanius, Rufinus and Cyril, received it as genuine. At the Reformation Erasmus rejected 2 Peter; Luther seems to have had no doubt of its genuineness; while Calvin felt some hesitancy because of the "discrepancies between it and the First." In the 4th century, two church councils (Laodicea, circa 372, and Carthage, 397) formally recognized it and placed it in the Canon as equal in authority with the other books of the New Testament.<P>2. Modern Opinion:<P>The opinion of modern scholars as to references in post-apostolic literature to 2 Peter is not only divided, but in many instances antagonistic. Salmon, Warfield, Zahn and others strongly hold that such references are to be found in the writings of the 2nd century, perhaps in one or two documents of the 1st. They insist with abundant proof in support of their contention that Irenaeus, Justin Martyr, the Shepherd of Hermas, and the Didache, and Clement of Rome, were all acquainted with the Epistle and made allusions to it in their writings. Weighing as honestly and as thoroughly as one can the citations made from that literature, one is strongly disposed to accept the evidence as legitimate and conclusive.<P>3. Dr. Chase\'s View:<P>On the other side, Professor Chase (HDB) has subjected all such references and allusions in the primitive writings to a very keen and searching criticism, and it must be frankly confessed that he has reduced the strength of the evidence and argument very greatly. But Professor Chase himself, from the remains of the ancient literature, and from the internal evidence of the Epistle itself, arrives at the conclusion that 2 Peter is not at all an apostolic document, that it certainly was not written by Peter, nor in the 1st century of our era, but about the middle of the 2nd century, say 150 AD. If this view is accepted, we must pronounce the Epistle a forgery, pseudonymous and pseudepigraphic, with no more right to be in the New Testament than has the Apocalypse of Peter or the romance of the Shepherd of Hermas.<P>II. Internal Evidence in Support of Its Apostolic Authority.<P>1. Style and Diction:<P>At first sight, this seems to be not altogether reassuring, but looking deeper into the letter itself we arrive at a satisfactory conclusion. Difference of style between the two Epistles attributed to Peter is given as one prominent reason for questioning the validity of the Second. It is mainly if not entirely on this ground that Jerome, Calvin and others hesitated to receive it. It is noteworthy that in the earlier times objections were not urged because of its relation to Jude—its borrowing from Jude, as is often charged in our days. Its alleged dissimilarity to 1 Peter in diction, structure, and measurably in its contents, explains why it was discredited. Admitting that there is substantial ground for this criticism, nevertheless there are not a few instances in which words rarely found in the other Biblical books are common to the two Epistles. Some examples are given in proof: "precious" (<a onClick="return mV(\'1Pe\',1,7,19);">1Pe 1:7,19</a>; <a onClick="return mV(\'2Pe\',1,1);">2Pe 1:1</a>) (a compound), occurring often in Rev, not often in other books; "virtue" (<a onClick="return mV(\'1Pe\',2,9);">1Pe 2:9</a>, the King James Version margin; <a onClick="return mV(\'2Pe\',1,3);">2Pe 1:3</a>), found elsewhere only in <a onClick="return mV(\'Phl\',4,8);">Php 4:8</a>; "supply" (<a onClick="return mV(\'1Pe\',4,11);">1Pe 4:11</a>; <a onClick="return mV(\'2Pe\',1,5);">2Pe 1:5</a>), rare in other books; "love of brethren" (<a onClick="return mV(\'1Pe\',1,22);">1Pe 1:22</a>; <a onClick="return mV(\'2Pe\',1,7);">2Pe 1:7</a> margin), only in three places besides; "behold" (<a onClick="return mV(\'1Pe\',2,12);">1Pe 2:12</a>; <a onClick="return mV(\'1Pe\',3,2);">3:2</a> (verbal form); <a onClick="return mV(\'2Pe\',1,16);">2Pe 1:16</a>) (eyewitnesses), not found elsewhere in the New Testament; "without blemish," "without spot" (<a onClick="return mV(\'1Pe\',1,19);">1Pe 1:19</a>; <a onClick="return mV(\'2Pe\',3,14);">2Pe 3:14</a>) (order of words reversed); also positive side (<a onClick="return mV(\'2Pe\',2,13);">2Pe 2:13</a>), "spots and blemishes"; the words do not occur elsewhere; "ungodly" (<a onClick="return mV(\'1Pe\',4,18);">1Pe 4:18</a>; <a onClick="return mV(\'2Pe\',2,5);">2Pe 2:5</a>; <a onClick="return mV(\'2Pe\',3,7);">3:7</a>) occurs in but three other places, except Jude, which has it three times.<P>2. Reason of Dissimilarities:<P>Besides, there are many striking similarities in thought and diction in the two Epistles. Two instances are given. In the First the saved are described as the "elect" (<a onClick="return mV(\'1Pe\',1,1);">1Pe 1:1</a>), and as "called" (<a onClick="return mV(\'1Pe\',2,21);">1Pe 2:21</a>). In the Second, the two great truths are brought together (<a onClick="return mV(\'2Pe\',1,10);">2Pe 1:10</a>). Likewise, in both stress is laid upon prophecy (<a onClick="return mV(\'1Pe\',1,\'10-12\');">1Pe 1:10-12</a>; <a onClick="return mV(\'2Pe\',1,\'19-21\');">2Pe 1:19-21</a>). Now, all this tends to prove that the writer of the Second Epistle was well acquainted with the peculiarity of diction employed in the First, and that he made use purposely of its uncommon terms, or, if the Second was written by another than the apostle, he succeeded surprisingly well in imitating his style. The latter alternative does not merit discussion. The differences arise mainly out of the subjects treated in the two, and the design which the writer seems to have kept constantly in view. In the First, he sought to comfort, strengthen and sustain his persecuted brethren; this is his supreme aim. In the Second he is anxious to warn and to shield those whom he addresses as to impending dangers more disastrous and more to be feared than the sufferings inflicted by a hostile world. In the First, judgment had begun at the house of God (<a onClick="return mV(\'1Pe\',4,17,18);">1Pe 4:17,18</a>), and believers were to arm, not to resist their persecutors, but for martyrdom (<a onClick="return mV(\'1Pe\',4,1);">1Pe 4:1</a>). But in the Second, a very different condition of things is brought to view. Ungodly men holding degrading principles and practicing shocking immoralities were threatening to invade the Christian brotherhood. Evil of a most vicious sort was detected by the watchful eye of the writer, and he knew full well that if suffered to continue and grow, as assuredly it would, utter ruin for the cause he loved would ensue. Therefore he forewarns and denounces the tendency with the spirit and energy of a prophet of God.<P>3. Claim to Petrine Authorship:<P>2 Peter opens with the positive statement of Peter\'s authorship: "Simon ["Symeon," Nestle, Weymouth] Peter, a servant...of Jesus Christ." The insertion of "Symeon," the old Hebrew name, in the forefront of the document is significant. If a forger had been writing in Peter\'s name he would have begun his letter almost certainly by copying the First Epistle and simply written, "Peter, an apostle of Jesus Christ." Note also that "servant" is introduced into the Second Epistle, but absent from the First. He designates himself as a servant and apostle of Jesus Christ. "Although several pseudonymous writings appear in early Christian literature, there is no Christian document of value written by a forger who uses the name of an apostle" (Dods, SBD). If this important statement is accepted at its full worth, it goes far to settle the question of authorship. Both "servant" and "apostle" appear in the opening sentence, and the writer claims both for himself.<P>4. Christian Earnestness:<P>Furthermore, the writer is distinctively a Christian; he addresses those who "have obtained a like precious faith with us in the righteousness of our God and the Saviour Jesus Christ" (<a onClick="return mV(\'2Pe\',1,1);">2Pe 1:1</a>). His is the same precious faith which all the saints enjoy; his also the exceeding great and precious promises of God, and he expects with all other believers to be made a partaker of the divine nature (<a onClick="return mV(\'2Pe\',1,3,4);">2Pe 1:3,4</a>). Is it at all probable that one with such a faith and such expectations would deliberately forge the name of Simon Peter, an apostle of Jesus Christ? The writer is unsparing in his denunciations of false teachers, corrupters of others, and perverters of the truth. He instances the fall of the angels, the destruction of Sodom, the rebuke of Balaam, as examples of the doom of those who know the truth and yet live in shameful sin and crime. Would a Christian and servant of Jesus Christ be at all likely to commit in the most flagrant manner the things he so vehemently condemns? If the writer was not the apostle Peter, he was a false teacher, a corrupter of others, and a hypocrite, which seems incredible to us.<P>5. Relation of Apostles:<P>Moreover, he associates himself with the other apostles (<a onClick="return mV(\'2Pe\',3,2);">2Pe 3:2</a>), is in full sympathy with Paul and is acquainted with Paul\'s Epistles (<a onClick="return mV(\'2Pe\',3,15,16);">2Pe 3:15,16</a>), and he holds and teaches the same fundamental truth. An apostolic spirit breathes through this document such as is generally absent from spurious writings and such as a forger does not exhibit. He is anxiously concerned for the purity of the faith and for the holiness and fidelity of believers. He exhorts them to give "diligence that ye may be found in peace, without spot and blameless in his sight," and that they "grow in the grace and knowledge of our Lord and Saviour Jesus Christ" (<a onClick="return mV(\'2Pe\',3,14,18);">2Pe 3:14,18</a>). All this and much more of like devout teaching is apostolic in tone and betokens genuineness and reality.<P>6. Autobiographical Allusions:<P>Still further, the writer appeals to certain facts in the life of Peter that are almost autobiographical. For example, he speaks of "putting off of my tabernacle...even as our Lord Jesus Christ signified unto me" (<a onClick="return mV(\'2Pe\',1,13,14);">2Pe 1:13,14</a>). The reference undoubtedly is to <a onClick="return mV(\'Jhn\',13,36);">Joh 13:36</a>; <a onClick="return mV(\'Jhn\',21,18,19);">21:18,19</a>. He claims to have been a witness of the Transfiguration (<a onClick="return mV(\'2Pe\',1,\'16-18\');">2Pe 1:16-18</a>). He indirectly claims the inspiration without which true prophecy is impossible (<a onClick="return mV(\'2Pe\',1,\'19-21\');">2Pe 1:19-21</a>). He asserts that this is his "second epistle" (<a onClick="return mV(\'2Pe\',3,1);">2Pe 3:1</a>). This testimony on the part of the writer is personal, emphatic and direct. It reads much like Peter\'s plain way of speaking of himself at the Council of Jerusalem, "Ye know that a good while ago God made choice among you, that by my mouth the Gentiles should hear the word of the gospel, and believe" (<a onClick="return mV(\'Act\',15,7);">Ac 15:7</a>).<P>7. Quoted by Jude:<P>Once more, Jude appears to quote from 2 Peter (see <a href="./study/isbe/search.html?string=JUDE">JUDE</a>). The question of the priority of the two Epistles is by no means settled. Many recent writers give the precedence to Jude, others to Peter. One of the highest authority, by Zahn (New Testament, II, 238ff), argues with great force in support of the view that Peter\'s is the older and that Jude cites from it. The arguments in favor of this latter belief are here only summarized:<P>(1) Jude cites from writings other than Scripture, as the apocryphal Book of Enoch and perhaps also from the Assumption of Moses. Peter scarcely quotes from any source. The former would be more likely to cite <a onClick="return mV(\'2Pe\',2,\'1-\');">2Pe 2</a>-<a onClick="return mV(\'2Pe\',3,\'1-3\');">3:3</A></a> than the latter from <a onClick="return mV(\'Jud\',1,\'4-16\');">Jude 1:4-16</a>. The resemblance between these two sections of the Epistles is so close that one must have drawn both thoughts and language from the other, or both availed themselves of the same documentary source. Of this latter supposition antiquity furnishes no hint. The differences are as marked as the resemblances, and hence, the one who cites from the other is no servile copyist. The real difference between the two is that between prediction and fulfillment.<P>(2) Peter predicts the advent of the "false teachers" (<a onClick="return mV(\'2Pe\',2,1);">2Pe 2:1</a>). His principal verbs are in the future tense (<a onClick="return mV(\'2Pe\',2,1,2,3,12,13);">2Pe 2:1,2,3,12,13</a>). He employs the present tense indeed in describing the character and the conduct of the libertines (<a onClick="return mV(\'2Pe\',2,17,18);">2Pe 2:17,18</a>), but their presence and their disastrous teaching he puts in the future (<a onClick="return mV(\'2Pe\',2,13,14);">2Pe 2:13,14</a>). The deadly germs were there when he wrote, the rank growth would speedily follow. Jude, on the contrary, throughout his short letter, speaks of the same corrupters as already come; his objects are present, they are in the midst of the people of God and actively doing their deadly work.<P>(3) Jude twice refers to certain sources of information touching these enemies, with which his readers were acquainted and which were designed to warn them of the danger and keep them from betrayal. The two sources were<P>(a) a writing that spoke of "ungodly men, turning the grace of our God into lasciviousness, and denying our only Master and Lord, Jesus Christ," <a onClick="return mV(\'Jde\',1,4);">1:4</A>;<P>(b) the prediction of Peter that "in the last days mockers shall come with mockery, walking after their own lusts" (<a onClick="return mV(\'2Pe\',3,3);">2Pe 3:3</a>). Jude urges his readers to remember the words which the apostles of Christ had before spoken, and then he cites this prediction of Peter in almost the exact terms: "In the last time there shall be mockers, walking after their ungodly lusts." He applies the prediction to the libertines then and there practicing their unholy deeds: "These are they, who make separations, sensual, having not the Spirit." The conclusion is inevitable. Jude quotes from Peter.<P>(4) Chronology gives the priority to Peter. The apostle died between 63-67 AD, probably in 64 AD. The vast majority of recent interpreters date the Epistle of Jude at 75-80 AD. There is no doubt but that it was written after the destruction of Jerusalem, 70 AD. Accordingly, it is later than Peter\'s death by from 5 to 10 years. Jude quoted from 2 Peter. This being so, it follows that his Epistle endorses that of Peter as being apostolic and likewise canonical, for he recognizes Peter as an apostle and gifted with the prophetic spirit.<P>See <a href="./study/isbe/search.html?string=JUDE">JUDE</a>; <a href="./study/isbe/search.html?string=PETER+(SIMON)">PETER (SIMON)</A>.<P>III. Doctrinal Teachings of the Epistle.<P>Only some of the more important features of the Epistle are here noticed. If all were treated as they deserve to be, this article would expand into the proportions of a commentary.<P>1. Saving Knowledge:<P>The key-word of 1 Peter is Hope; of 2 Peter Knowledge. The apostle gives to this gift of grace a prominent place (<a onClick="return mV(\'2Pe\',1,2,3,5,6,8);">1:2,3,5,6,8</a>; <a onClick="return mV(\'2Pe\',2,20,21);">2:20,21</A>; <a onClick="return mV(\'2Pe\',3,18);">3:18</A>). The term he uses is largely in the intensified form, namely, "full knowledge"; that is, knowledge that rests on fact, knowledge that comes to the believer as something supernatural, as being communicated by the Spirit of God, and therefore is true and complete. The grace and peace Peter asks for the saints should issue in the knowledge of God and of Jesus our Lord, who has granted unto us all things that pertain unto life and godliness through the knowledge of Him (<a onClick="return mV(\'2Pe\',1,2,3);">1:2,3</A>).<P>(1) Basis:<P>The basis of saving knowledge rests on the "exceeding great and precious promises" which He has made us, and which become ours by faith in Him. It leads us into acquaintance with the righteousness of God, into the realization of our calling as saints, and of the glorious destiny that awaits them who know and trust God (<a onClick="return mV(\'2Pe\',1,\'2-4\');">2Pe 1:2-4</a> the King James Version).<P>(2) Growth:<P>The growth in true knowledge (<a onClick="return mV(\'2Pe\',1,\'5-11\');">2Pe 1:5-11</a>): "In your faith supply virtue," etc. He does not ask that faith be supplied, that these believers already had. But starting with faith as the foundation of all, let the other excellencies and virtues be richly and abundantly furnished. The original word for "supply" is derived from the Greek "chorus," in behalf of the members of which the manager supplied all the equipments needed. And Peter appropriating that fact urges Christians to give all diligence to furnish themselves with the gifts and grace he mentions, which are far more needful to the Christian than were the equipments for the ancient chorus.<P>See <a href="./study/isbe/search.html?string=SUPPLY">SUPPLY</a>.<P>What a magnificent cluster Peter here gives! Each springs out of the other; each is strengthened by the other. "In your faith supply virtue," or fortitude, manliness; and let virtue supply "knowledge." Knowledge by itself tends to puff up. But tempered by the others, by self-control, by patience, by godliness, by love, it becomes one of the most essential and powerful forces in the Christian character. Paul begins his list of the "fruits of the Spirit" with love (<a onClick="return mV(\'Gal\',5,22);">Ga 5:22</a>); Peter ends his with love. It is like a chain, each link holds fast to its fellow and is a part of the whole. It matters little at which end of the chain we begin to count, for the links form a unity, and to touch one is to touch all. God freely gives what we need and all we need; we are to "add all diligence" to supply the need richly.<P>(3) Inerrancy of Sources:<P>Inerrancy of the sources of saving knowledge (<a onClick="return mV(\'2Pe\',1,\'16-21\');">2Pe 1:16-21</a>). The apostle rests his teaching on two trustworthy facts:<P>(a) the fact and meaning of the Saviour\'s Transfiguration;<P>(b) the fact of the inspiration of the Holy Spirit.<P>Taken together these two facts invest his teaching with infallible certainty. "For we did not follow cunningly devised fables, when we made known unto you the power and coming of our Lord Jesus Christ, but we were eyewitnesses of his majesty." Pagan mythology, so widely prevailing at the time in Asia Minor, indeed over the whole heathen world, was composed of "myths" (Peter\'s word) skillfully framed and poetically embellished. Jewish cabalism, and the wild vagaries springing up in the Christian brotherhood itself had no place in the gospel message nor in apostolic teaching. What Peter and his fellow-disciples taught was the very truth of God, for at the Transfiguration they saw the outshining glory of the Son of God, they heard the Divine Voice, they beheld the two visitants from the unseen world, Moses and Elijah. Of the majestic scene they were eyewitnesses. Peter adds, "And we have the word of prophecy made more sure." The Transfiguration has confirmed what the prophets say touching the future and God\'s purpose to fill the earth with His glory; every word He has spoken is to be made good.<P>Moreover, the apostle appeals to the inspiration of the prophets in confirmation of his teaching: "No prophecy of scripture is of private interpretation. For no prophecy ever came by the will of man: but men spake from God, being moved by the Holy Spirit." He recognizes this as primary truth, that prophecy is not of one\'s own origination, nor is it to be tied up to the times of the prophet. The prophecy was brought to him, as it is brought to us. Peter and his fellow-believers did not follow "cunningly devised fables"; they were borne along in their prophetic utterances by the Spirit.<P>2. The Three Worlds:<P>Of course in <a onClick="return mV(\'2Pe\',3,\'5-13\');">2Pe 3:5-13</a>, where the three worlds are spoken of, three globes are not meant, but three vast epochs, three enormous periods in earth\'s history. The apostle divides its history into three clearly defined sections, and mentions some of the characteristic features of each.<P>(1) The Old World.<P>"The world that then was" (<a onClick="return mV(\'2Pe\',3,6);">2Pe 3:6</a>): this is his first world. It is the antediluvian world that is meant, the world which the Flood overwhelmed. Scoffers in Peter\'s time asked, no doubt with a sneer, "Where is the promise of his coming? for, from the day that the fathers fell asleep, all things continue as they were from the beginning of the creation" (<a onClick="return mV(\'2Pe\',3,4);">2Pe 3:4</a>). This is a surprisingly modern inquiry. Mockers then as now appealed to the continuity of natural processes, and to the inviolability of Nature\'s laws. Nature keeps her track with unwavering precision. There is no sign of any change; no catastrophe is likely, is possible. The promise of His coming fails. Peter reminds the skeptics that a mighty cataclysm did once overwhelm the world. The Flood drowned every living thing, save those sheltered within the ark. As this is a historical fact, the query of the mockers is foolish.<P>(2) The Present World.<P>Peter\'s second world is "the heavens that now are, and the earth" (<a onClick="return mV(\'2Pe\',3,7);">2Pe 3:7</a>). It is the present order of things in sky and earth that is meant. He asserts that this world is "stored up for fire, being reserved against the day of judgment and destruction of ungodly men." The margin reads, "stored with fire," i.e., it contains within itself the agency by which it may be consumed. The world that now is, is held in strict custody, reserved, not for a second deluge, but for fire. The advent of Christ and the judgment are associated in Scripture with fire: "Our God shall come, and shall not keep silence: a fire shall devour before him, and it shall be very tempestuous round about him" (<a onClick="return mV(\'Psa\',50,3);">Ps 50:3</a> the King James Version; compare <a onClick="return mV(\'Isa\',66,15,16);">Isa 66:15,16</a>; <a onClick="return mV(\'Dan\',7,10,11);">Da 7:10,11</a>). Nor is the New Testament silent on this point: "the revelation of the Lord Jesus from heaven with the angels of his power in flaming fire" (<a onClick="return mV(\'2Th\',1,7);">2Th 1:7</a>).<P>Ample materials are stored up in the earth for its consumption by fire. The oils and the gases so inflammable and destructive in their energy can, when it may please God to release these forces, speedily reduce the present order of things to ashes. Peter\'s language does not signify earth\'s annihilation, nor its dissolution as an organic body, nor the end of time. He speaks of cosmical convulsions and physical revolutions of both sky and earth, such as shall transform the planet into something glorious and beautiful.<P>(3) The New World.<P>The third world is this: "But, according to his promise, we look for new heavens and a new earth, wherein dwelleth righteousness" (<a onClick="return mV(\'2Pe\',3,13);">2Pe 3:13</a>). This is Paradise restored. We have sure ground for the expectancy; the last two chapters of Revelation contain the prophetic fulfillment: "And I saw a new heaven and a new earth: for the first heaven and the first earth are passed away; and the sea is no more." The accomplishment of these sublime predictions will involve a fundamental change in the constitution of the globe. Life would be impossible if the sea was no more. But He who made the world can surely recreate it, clearing it of every vestige of sin and misery and imperfection, fitting it for the dwelling of perfect beings and of His supreme glory. Immanuel will dwell with the holy inhabitants of the new earth and in the new Jerusalem which is to descend into the glorified planet. John is bidden, "Write, for the predictions are faithful and true; they shall not fail to come to pass."<P>"Earth, thou grain of sand on the shore of the Universe of God,<P>On thee has the Lord a great work to complete."<P>LITERATURE.<P>See at end of <a href="./study/isbe/search.html?string=PETER,+THE+FIRST+EPISTLE+OF">PETER, THE FIRST EPISTLE OF</a>; <a href="./study/isbe/search.html?string=PETER+(SIMON)">PETER (SIMON)</a>.``123';
isbe[6848]='Pethahiah`peth-a-hi\'-a (Pethachyah, "Yah opens up"):<P>(1) Chief of the 19th course of priests (<a onClick="return mV(\'1Ch\',24,16);">1Ch 24:16</a>).<P>(2) One of the Levites having "foreign wives" (<a onClick="return mV(\'Ezr\',10,23);">Ezr 10:23</a>; <a onClick="return mV(\'Neh\',9,5);">Ne 9:5</a>; "Patheus" in 1Esdras 9:23).<P>(3) Son of Meshezabeel, descendant of Judah, who was "at the king\'s hand in all matters concerning the people" (<a onClick="return mV(\'Neh\',11,24);">Ne 11:24</a>).``1';
isbe[6849]='Pethor`pe\'-thor (pethor; Phathoura, Bathoura): The dwelling-place of Balaam, situated on "the river" (the Euphrates) (<a onClick="return mV(\'Num\',22,5,13);">Nu 22:5</a>). <P>1. Possibly the Asyrian Pitru:<P>In <a onClick="return mV(\'Deu\',23,4);">De 23:4</a>, it is further described as being in Mesopotamia (Aram-naharaim). Pethor is identified with the Pedru(i) of the geographical lists of Thothmes III (circa 1500 BC) and the Pitru (Pithru) of the Assyrian king Shalmaneser II, who states that in his 3rd year (857 BC) he took the city Ana-Assur-utir-acbat (meaning: "I founded (it) anew for Assur"), which the Hattaa (Hittites) called Pitru. He says that it lay on the farther (western) bank of the Euphrates, by the Sagurru or Sagura River, the modern Sajur. The importance of Pitru is indicated by the fact that he received there the tribute of the kings of Carchemish, Comagene, Melitene and other districts.<P>2. Difficulties of Identification:<P>As Pitru is about 400 miles from Moab, this meant for Balaam a three or four weeks\' journey, but the messengers sent to fetch him, though they had to travel that distance twice, could naturally, by pressing their mounts, have performed it much less time. Doubt may likewise be entertained as to the identity of Pethor with Pitru by the absence in the latter of the o, which would lead one to expect rather the Assyrian form Pit(h)uru. Shalmaneser, however, says that Pitru was the Hittite name, and that may account for it. With regard to the derivation, nothing can at present be said, except that, as a Hittite name, Tomkins (Records of the Past, V (London, 1891), 38) has compared the name Pitru with the Pteria of Herodotus i.76 (identified with Bog-haz-keui, the great Hittite capital in Cappadocia, in ancient times called Hattu).``136';
isbe[6850]='Pethuel`pe-thu\'-el (pethu\'el, "God\'s opening"): Father of Joel the prophet (<a onClick="return mV(\'Joe\',1,1);">Joe 1:1</a>).``1';
isbe[6851]='Petition`pe-tish\'-un: Used in English Versions of the Bible only as a noun, usually as representing the Hebrew she\'elah (<a onClick="return mV(\'Psa\',20,5);">Ps 20:5</a>, mish\'alah), from the common verb sha\'al, "to ask." The noun, consequently, has no technical meaning, and may be used indifferently in the active (<a onClick="return mV(\'Est\',7,2);">Es 7:2</a>) or passive (<a onClick="return mV(\'1Sa\',1,27);">1Sa 1:27</a>) sense, or for a petition addressed to either God (<a onClick="return mV(\'1Sa\',1,17);">1Sa 1:17</a>) or man (<a onClick="return mV(\'1Ki\',2,16);">1Ki 2:16</a>), while in <a onClick="return mV(\'Jdg\',8,24);">Jud 8:24</a>; <a onClick="return mV(\'Job\',6,8);">Job 6:8</a>; <a onClick="return mV(\'Psa\',106,15);">Ps 106:15</a>, it is rendered simply "request." Otherwise "petition" represents the Aramaic ba\'u (<a onClick="return mV(\'Dan\',6,7,13);">Da 6:7,13</a>), the Greek aitema (<a onClick="return mV(\'1Jo\',5,15);">1Joh 5:15</a>), and deesis (1Macc 7:37, the Revised Version (British and American) "supplication"), and the Latin oratio (2Esdras 8:24).ru with the Pteria of Herodotus i.76 (identified with Bog-haz-keui, the great Hittite capital in Cappadocia, in ancient times called Hattu).``48';

isbe[6853]='Peulthai; Peullethai`pe-ul\'-thi, pe-ul\'-e-thi (pe\'ullethay, "Yah\'s seed"): One of the "porters," 8th son of Obed-edom (<a onClick="return mV(\'1Ch\',26,5);">1Ch 26:5</a>).``1';
isbe[6854]='Phaath Moab`fa\'-ath, mo\'-ab (Codex Alexandrinus Phaath Moab; Codex Vaticanus followed by Swete, Phthaleimoab (1Esdras 5:11); 1Esdras 8:31 (the King James Version "Pahath Moab"), Codex Vaticanus followed by Swete reads Maathmoab; Fritzsche in both places reads Phaath Moab): One of the families, part of which, consisting "of the sons of Jesus and Joab 2,812," went up out of captivity with Zerubbabel and Joshua (1Esdras 5:11), and part of which, namely, "Eliaonias the son of Zaraias and with him 200 men," went up with Ezra (1Esdras 8:31 equals "Pahath-moab" of <a onClick="return mV(\'Ezr\',2,6);">Ezr 2:6</a>; <a onClick="return mV(\'Ezr\',8,4);">8:4</a>; (<a onClick="return mV(\'Ezr\',10,30);">10:30</A>); and <a onClick="return mV(\'Neh\',7,11);">Ne 7:11</a> (<a onClick="return mV(\'Neh\',3,11);">3:11</A>; <a onClick="return mV(\'Neh\',10,14);">10:14</a>)). As the name of a Jewish clan or family the name Phaath or Pahath Moab presents difficulties of which explanations are offered, though none is convincing. It is generally taken as "ruler of Moab," which may refer to the Israelite conquest of Moab in which this family may have distinguished itself, or it may have arisen from the settlement and incorporation of a Moabite family in Hebrew territory, or from the settlement of an Israelite family in Moabite territory (compare <a onClick="return mV(\'1Ch\',4,22);">1Ch 4:22</a>); or it may be the corruption of some unknown word or name. Instances of such corruption are quite common in these apocryphal Hebrew proper names.`<a href="./study/isbe/search.html?string=PAHATH+MOAB">PAHATH-MOAB</a>`5';
isbe[6855]='Phacareth`fak\'-a-reth (Phakareth, but Codex Vaticanus, followed by Swete, correctly reads Sabeie, together, Codex Alexandrinus followed by the King James Version reading "sons of Sabie," as a distinct family, 1Esdras 5:34): The same as "Pochereth-hazzebaim" of <a onClick="return mV(\'Ezr\',2,57);">Ezr 2:57</a>.``1';
isbe[6856]='Phaisur`fa\'-sur, fa-i\'-sur (Codex Vaticanus Phaisour; Codex Alexandrinus Phaisou): Head of one of the families of priests some of whom had taken "strange wives" (1Esdras 9:22) equals "Pashhur" of <a onClick="return mV(\'Ezr\',10,22);">Ezr 10:22</a>; styled "Phassurus" in 1Esdras 5:25.``1';
isbe[6857]='Phaldeus`fal-de\'-us (Codex Alexandrinus (Fritzsche) Phaldaios; Codex Vaticanus (Swete) Phaladaios; the King James Version Phaldaius): One of those who stood on Ezra\'s left hand when he expounded the Law (1Esdras 9:44) equals "Pedaiah" of <a onClick="return mV(\'Neh\',8,4);">Ne 8:4</a>.``1';
isbe[6858]='Phaleas`fa-le\'-as (Phalaias): A family of "temple-servants" who went up with Zerubbabel from Babylon (1Esdras 5:29) = "Padon" of <a onClick="return mV(\'Ezr\',2,44);">Ezr 2:44</a>; the King James Version Phaldaius): One of those who stood on Ezra\'s left hand when he expounded the Law (1Esdras 9:44) = "Pedaiah" of <a onClick="return mV(\'Neh\',8,4);">Ne 8:4</a>.``1';
isbe[6859]='Phalec`fa\'-lek (Phalek, Westcott and Hort, The New Testament in Greek, Phalek): the King James Version; Greek form of "Peleg" (thus the Revised Version (British and American)) (<a onClick="return mV(\'Luk\',3,35);">Lu 3:35</a>).``1';
isbe[6860]='Phalias`fa-li\'-as (Phalias Codex Alexandrinus Phiathas; the King James Version, Biatas, following Aldine Biatas): One of the Levites who read and explained the Law to the multitude (1Esdras 9:48) = "Pelaiah" of <a onClick="return mV(\'Neh\',8,7);">Ne 8:7</a>. Ezra\'s left hand when he expounded the Law (1Esdras 9:44) = "Pedaiah" of <a onClick="return mV(\'Neh\',8,4);">Ne 8:4</a>.``1';
