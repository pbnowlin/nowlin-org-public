="return mV(\'Mat\',12,34,39);">12:34,39</a>; <a onClick="return mV(\'Luk\',11,29);">Lu 11:29</a>), but never identifies Himself with it. It is those who do the will of God with whom He feels kinship (<a onClick="return mV(\'Mat\',12,50);">Mt 12:50</a>), and He offers Himself to the morally sick as a physician (<a onClick="return mV(\'Mat\',9,12);">Mt 9:12</a>). He proposes Himself as an example of the highest virtues (<a onClick="return mV(\'Mat\',11,28);">Mt 11:28</a>) and pronounces him blessed who shall find no occasion of stumbling in Him (<a onClick="return mV(\'Mat\',11,6);">Mt 11:6</a>).<P>(3) Unity of the Person.<P>These manifestations of a human and divine consciousness simply stand side by side in the records of our Lord\'s self-expression. Neither is suppressed or even qualified by the other. If we attend only to the one class we might suppose Him to proclaim Himself wholly divine; if only to the other we might equally easily imagine Him to be representing Himself as wholly human. With both together before us we perceive Him alternately speaking out of a divine and out of a human consciousness; manifesting Himself as all that God is and as all that man is; yet with the most marked unity of consciousness. He, the one Jesus Christ, was to His own apprehension true God and complete man in a unitary personal life.<P>VII. The Two Natures Everywhere Presupposed.<P>There underlies, thus, the entire literature of the New Testament a single, unvarying conception of the constitution of our Lord\'s person. From Matthew where He is presented as one of the persons of the Holy Trinity (<a onClick="return mV(\'Mat\',28,19);">28:19</a>)—or if we prefer the chronological order of books, from the Epistle of James where He is spoken of as the Glory of God, the Shekinah (2:1)—to the Apocalypse where He is represented as declaring that He is the Alpha and the Omega, the First and the Last, the Beginning and the End (<a onClick="return mV(\'Rev\',1,8),17;">Re 1:8,17</a>; <a onClick="return mV(\'Rev\',22,13);">22:13</a>), He is consistently thought of as in His fundamental being just God. At the same time from the Synoptic Gospels, in which He is dramatized as a man walking among men, His human descent carefully recorded, and His sense of dependence on God so emphasized that prayer becomes almost His most characteristic action, to the Epistles of John in which it is made the note of a Christian that He confesses that Jesus Christ has come in flesh (<a onClick="return mV(\'1Jo\',4,2);">1Joh 4:2</a>) and the Apocalypse in which His birth in the tribe of Judah and the house of David (<a onClick="return mV(\'Rev\',5,5);">Re 5:5</a>; <a onClick="return mV(\'Rev\',22,16);">22:16</a>), His exemplary life of conflict and victory (<a onClick="return mV(\'Rev\',3,21);">Re 3:21</a>), His death on the cross (<a onClick="return mV(\'Rev\',11,8);">Re 11:8</a>) are noted, He is equally consistently thought of as true man. Nevertheless, from the beginning to the end of the whole series of books, while first one and then the other of His two natures comes into repeated prominence, there is never a question of conflict between the two, never any confusion in their relations, never any schism in His unitary personal action; but He is obviously considered and presented as one, composite indeed, but undivided personality. In this state of the case not only may evidence of the constitution of our Lord\'s person properly be drawn indifferently from every part of the New Testament, and passage justly be cited to support and explain passage without reference to the portion of the New Testament in which it is found, but we should be without justification if we did not employ this common presupposition of the whole body of this literature to illustrate and explain the varied representations which meet us cursorily in its pages, representations which might easily be made to appear mutually contradictory were they not brought into harmony by their relation as natural component parts of this one unitary conception which underlies and gives consistency to them all. There can scarcely be imagined a better proof of the truth of a doctrine than its power completely to harmonize a multitude of statements which without it would present to our view only a mass of confused inconsistencies. A key which perfectly fits a lock of very complicated wards can scarcely fail to be the true key.<P>VIII. Formulation of the Doctrine.<P>Meanwhile the wards remain complicated. Even in the case of our own composite structure, of soul and body, familiar as we are with it from our daily experience, the mutual relations of elements so disparate in a single personality remain an unplumbed mystery, and give rise to paradoxical modes of speech which would be misleading, were not their source in our duplex nature well understood. We may read, in careful writers, of souls being left dead on battlefields, and of everybody\'s immortality. The mysteries of the relations in which the constituent elements in the more complex personality of our Lord stand to one another are immeasurably greater than in our simpler case. We can never hope to comprehend how the infinite God and a finite humanity can be united in a single person; and it is very easy to go fatally astray in attempting to explain the interactions in the unitary person of natures so diverse from one another. It is not surprising, therefore, that so soon as serious efforts began to be made to give systematic explanations of the Biblical facts as to our Lord\'s person, many onesided and incomplete statements were formulated which required correction and complementing before at length a mode of statement. was devised which did full justice to the Biblical data. It was accordingly only after more than a century of controversy, during which nearly every conceivable method of construing and misconstruing the Biblical facts had been proposed and tested, that a formula was framed which successfully guarded the essential data supplied by the Scriptures from destructive misconception. This formula, put together by the Council of Chalcedon, 451 AD, declares it to have always been the doctrine of the church, derived from the Scriptures and our Lord Himself, that our Lord Jesus Christ is "truly God and truly man, of a reasonable soul and body; consubstantial with the Father according to the Godhead, and consubstantial with us according to the manhood; in all things like unto us, without sin; begotten before all ages of the Father according to the Godhead, and in these latter days, for us and for our salvation, born of the Virgin Mary, the Mother of God, according to the manhood; one and the same Christ, Son, Lord, Only-begotten, to be acknowledged in two natures-inconfusedly, unchangeably, indivisibly, inseparably; the distinction of natures being by no means taken away by the union, but rather the property of each nature being preserved, and concurring in one Person and one subsistence, not parted or divided into two persons, but one and the same Son, and Only-begotten, God, the Word, the Lord Jesus Christ." There is nothing here but a careful statement in systematic form of the pure teaching of the Scriptures; and therefore this statement has stood ever since as the norm of thought and teaching as to the person of the Lord. As such, it has been incorporated, in one form or another, into the creeds of all the great branches of the church; it underlies and gives their form to all the allusions to Christ in the great mass of preaching and song which has accumulated during the centuries; and it has supplied the background of the devotions of the untold multitudes who through the Christian ages have been worshippers of Christ.<P>LITERATURE.<P>The appropriate sections in the treatises on the Biblical theology of the New Testament; also A. B. Bruce, The Humiliation of Christ, 2nd edition, Edinburgh, 1881; R. L. Ottley, The Doctrine of the Incarnation, London, 1896; H. C. Powell, The Principle of the Incarnation, London, 1896; Francis J. Hall, The Kenotic Theory, New York, 1898; C. A. Briggs, The Incarnation of the Lord, New York, 1902; G. S. Streatfeild, The Self-Interpretation of Jesus Christ, London, 1906; B. B. Warfield, The Lord of Glory, New York, 1907; James Denhey, Jesus and the Gospel, London, 1909; M. Lepin, Christ and the Gospel: or, Jesus the Messiah and Son of God, Philadelphia, 1910; James Stalker, The Christology of Jesus, New York, 1899; D. Somerville, Paul\'s Conception of Christ, Edinburgh, 1897; E.H. Gifford, The Incarnation: a Study of <span class="noTag">Philippians 2:5-11</span>, London, 1897; S.N. Rostron, The Christology of Paul, London, 1912; E. Digges La Touche, The Person of Christ in Modern Thoughts, London, 1912.<P>(NOTE.—In this article the author has usually given his own translation of quotations from Scripture, and not that of any particular version.)``187';
isbe[6835]='Person, Personality`pur\'-sun, pur\'-s\'n, pur-un-al\'-ti (nephesh, \'ish, \'adham, panim, prosopon, hupostasis): The most frequent word for "person" in the Old Testament is nephesh, "soul" (<a onClick="return mV(\'Gen\',14,21);">Ge 14:21</a>, "Give me the persons, and take the goods"; <a onClick="return mV(\'Gen\',36,6);">Ge 36:6</a>, the King James Version "all the persons" <a onClick="return mV(\'Num\',5,6);">Nu 5:6</a> the King James Version "that person," etc.) \'ish "a man," "an individual," Is also used (<a onClick="return mV(\'Jdg\',9,2);">Jud 9:2</a>, "threescore and ten persons"; <a onClick="return mV(\'1Sa\',16,18);">1Sa 16:18</a>, "a comely person," etc.); \'adham, "a man," "a human being" (<a onClick="return mV(\'Num\',31,28);">Nu 31:28</a>, "of the persons, and of the oxen"; <a onClick="return mV(\'Pro\',6,12);">Pr 6:12</a>, "a worthless person," etc.); \'enosh, "a man," "a weak, mortal man," occurs twice (<a onClick="return mV(\'Jdg\',9,4);">Jud 9:4</a>, the King James Version "vain and light persons"; <a onClick="return mV(\'Zep\',3,4);">Ze 3:4</a>); ba\'al, "owner," "lord," is once translated "person" (<a onClick="return mV(\'Pro\',24,8);">Pr 24:8</a>, the King James Version "a mischievous person"), and methim, "men," once (<a onClick="return mV(\'Psa\',26,4);">Ps 26:4</a>, the King James Version "vain persons"); panim "face," is frequently translated "person" when the reference is to the external appearance, as of persons in high places, rich persons who could favor or bribe, etc., chiefly in the phrases "regarding the person," "accepting the person" (<a onClick="return mV(\'Deu\',10,17);">De 10:17</a>; <a onClick="return mV(\'Mal\',1,8);">Mal 1:8</a>).<P>In the New Testament prosopon, "face," "countenance," stands in the same connection (<a onClick="return mV(\'Mat\',22,16);">Mt 22:16</a>,"thou regardest not the person of men"; <a onClick="return mV(\'Gal\',2,6);">Ga 2:6</a>, "God accepteth not man\'s person"; <a onClick="return mV(\'Act\',10,34);">Ac 10:34</a>, "God is no respecter of persons"; <a onClick="return mV(\'Rom\',2,11);">Ro 2:11</a>, "there is no respect of persons with God"; <a onClick="return mV(\'Eph\',6,9);">Eph 6:9</a>; <a onClick="return mV(\'Col\',3,25);">Col 3:25</a>; <a onClick="return mV(\'Jam\',2,1,9);">Jas 2:1,9</a>); in <a onClick="return mV(\'2Cr\',1,11);">2Co 1:11</a> we have "persons" (prosopon), absolute as in the later Greek, "the gift bestowed...by many persons," the only occurrence in the New Testament; in <a onClick="return mV(\'2Cr\',2,10);">2Co 2:10</a> prosopon may stand for "presence," as the Revised Version (British and American) "in the presence of Christ," but it might mean "as representing Christ"; in <a onClick="return mV(\'Hbr\',1,3);">Heb 1:3</a>, the King James Version hupostasis, "that which lies under," substratum, is rendered "person," "the express image of his person," i.e. of God, which the Revised Version (British and American) renders "the very image of his substance," margin "the impress of his substance," i.e. the manifestation or expression of the invisible God and Father. "Person" is also frequently supplied as the substantive implied in various adjectives, etc., e.g. profane, perjured, vile.<P>In the Apocrypha we have prosopon translated "person" (Judith 7:15, the Revised Version (British and American) "face"; Ecclesiasticus 10:5, etc.); the "accepting of persons" is condemned (The <span class="noTag">Wisdom of Solomon 6:7</span>; Ecclesiasticus 4:22,27; 7:6; 20:22, the Revised Version (British and American) "by a foolish countenance"; 35:13; 42:1; "With him (God) is no respecter of persons, Ecclesiasticus 35:12).<P>The Revised Version (British and American) has "soul" for "person" (<a onClick="return mV(\'Num\',5,6);">Nu 5:6</a>), "face" (<a onClick="return mV(\'Jer\',52,25);">Jer 52:25</a>), "man" (<a onClick="return mV(\'Mat\',27,24);">Mt 27:24</a>); "reprobate" for "vile person" (<a onClick="return mV(\'Psa\',15,4);">Ps 15:4</a>), the American Standard Revised Version, the English Revised Version margin "fool" (<a onClick="return mV(\'Isa\',32,5,6);">Isa 32:5,6</a>); the American Standard Revised Version "men of falsehood" for "vain persons" (<a onClick="return mV(\'Psa\',26,4);">Ps 26:4</a>); for "a wicked person," the Revised Version (British and American) has "an evil thing" (<a onClick="return mV(\'Psa\',101,4);">Ps 101:4</a>); "back to thee in his own person" (auton, different text) for "again thou therefore receive him" (<a onClick="return mV(\'Phm\',1,12);">Phm 1:12</a>); "take away life" for "respect any person" (<a onClick="return mV(\'2Sa\',14,14);">2Sa 14:14</a>); "with seven others" for "the eighth person" (<a onClick="return mV(\'2Pe\',2,5);">2Pe 2:5</a>); "false swearers" for "perjured persons" (<a onClick="return mV(\'1Ti\',1,10);">1Ti 1:10</a>); "seven thousand persons" for "of men seven thousand" (<a onClick="return mV(\'Rev\',11,13);">Re 11:13</a>).<P>Personality is that which constitutes and characterizes a person. The word "person" (Latin, persona) is derived from the mask through which an actor spoke his part (persona). "From being applied to the mask, it came next to be applied to the actor, then to the character acted, then to any assumed character, then to anyone having any character or station"; lastly, it came to mean an individual, a feeling, thinking and acting being. For full personality there must be self-consciousness, with the capability of free thought and action—self-determination—hence, we speak of personal character, personal action, etc. A person is thus a responsible being, while an animal is not. Personality is distinctive of man. The personality is the unit of the entire rational being, perhaps most clearly represented by "the will"; it is that which is deepest in man, belonging, of course, not to the realm of space or the region of the visible, but existing as a spiritual reality in time, with a destiny beyond it. It is the substance (hupostasis) of the being, that which underlies all its manifestations; hence, the rendering "the express image of his person" in <a onClick="return mV(\'Hbr\',1,3);">Heb 1:3</a> the King James Version. Hupostasis was employed by the early Greek Fathers to express what the Latins intended by persona; afterward prosopon was introduced.<P>Recent psychology has brought into prominence elements in the subconscious realm, the relation of which to the personality is obscure. There seems to be more in each individual than is normally expressed in the personal consciousness and action. The real, responsible personality, however, is something which is always being formed. The phenomenon of double personality is pathological, as truly the result of brain disease as is insanity.<P>In the Bible man is throughout regarded as personal, although it was only gradually that the full importance of the individual as distinct from the nation was realized. The use of prosopon for "person" indicates also a more external conception of personality than the modern. With the Hebrews the nephesh was the seat of personality, e.g. "Thou wilt not leave my soul (nephesh) to Sheol" (<a onClick="return mV(\'Psa\',16,10);">Ps 16:10</a>); "Thou hast brought up my soul from Sheol" (<a onClick="return mV(\'Psa\',30,3);">Ps 30:3</a>). God is also always regarded as personal (who has created man in His own image), and although the representations seem often anthropomorphic they are not really such. The divine personality could only be conceived after the analogy of the human, as far as it could be definitely conceived at all; but God was regarded as transcending, not only the whole of Nature, but all that, is human, e.g. "God is not a man, that he should lie" (<a onClick="return mV(\'Num\',23,19);">Nu 23:19</a>; <a onClick="return mV(\'1Sa\',15,29);">1Sa 15:29</a>); "Canst thou by searching find out God?" (<a onClick="return mV(\'Job\',11,7);">Job 11:7</a>; <a onClick="return mV(\'Isa\',40,28);">Isa 40:28</a>; compare <a onClick="return mV(\'Ecc\',3,11);">Ec 3:11</a>; <a onClick="return mV(\'Ecc\',8,17);">8:17</a>, etc.). In the New Testament the personality of God is, on the warrant of Jesus Himself, conceived after the analogy of human fatherhood, yet as transcending all our human conceptions: "How much more?" (<a onClick="return mV(\'Mat\',7,11);">Mt 7:11</a>); "Who hath known the mind of the Lord? or who hath been his counselor?" (<a onClick="return mV(\'Rom\',11,34);">Ro 11:34</a>). Man is body, soul and spirit, but God in Himself is Spirit, infinite, perfect, ethical Spirit (<a onClick="return mV(\'Mat\',5,48);">Mt 5:48</a>; <a onClick="return mV(\'Jhn\',4,24);">Joh 4:24</a>). He is forever more than all that is created, "For of him, and through him, and unto him, are all things" (<a onClick="return mV(\'Rom\',11,36);">Ro 11:36</a>). The human personality, being spiritual, survives bodily dissolution and in Christ becomes clothed again with a spiritual body (<a onClick="return mV(\'Phl\',3,21);">Php 3:21</a>; <a onClick="return mV(\'1Cr\',15,44);">1Co 15:44</a>).``185';

isbe[6837]='Persuade; Persuasion`per-swad\', per-swazhun: (1) In the older English "persuade" need not mean "convince" (although this is its usual sense in the King James Version: <a onClick="return mV(\'Mat\',27,20);">Mt 27:20</a>, etc.), but may mean only "attempt to convince," "argue with." This is well brought out in <a onClick="return mV(\'Act\',26,28);">Ac 26:28</a>, where the Greek is literally "In little thou \'persuadest\' peitheis to make me a Christian." the King James Version took peitheis as "convince" ("almost thou persuadest me ...."), but this is impossible, and so the Revised Version (British and American) rendered peitheis by "thou wouldest fain." To keep something of the language of the King James Version, "persuasion" was supplied after "little," but it should have been italicized, for it is merely conjectural, as the American Revised Version margin recognizes by giving "time" as an alternative for "persuasion." The text of the passage, however, is suspected. See <a href="./study/isbe/search.html?string=ALMOST">ALMOST</a>. Similarly in <a onClick="return mV(\'Act\',13,43);">Ac 13:43</a>, the Revised Version (British and American) replaces "persuade" by "urge," and the same change should have been made also in <a onClick="return mV(\'2Ki\',18,32);">2Ki 18:32</a> and its parallels. (2) The "popular persuasions" of 1Esdras 5:73 are "efforts to persuade the people" (uncertain text, however). <a onClick="return mV(\'Act\',19,8);">Ac 19:8</a> the King James Version writes "persuading the things" (the Revised Version (British and American) "as to the things") for "present the things persuasively." And in <a onClick="return mV(\'Gal\',1,10);">Ga 1:10</a> (the English Revised Version and the King James Version, not in the American Standard Revised Version) and <a onClick="return mV(\'2Cr\',5,11);">2Co 5:11</a>, there is a half-ironic force in the word: Paul\'s enemies have accused him of using unworthy persuasion in making his conversions.``48';
isbe[6838]='Peruda`pe-roo\'-da (perudha\').`<a href="./study/isbe/search.html?string=PERIDA">PERIDA</a>`1';
isbe[6839]='Perverse`per-vurs\':The group "perverse, -ly, -ness," "act perversely" in the King James Version represents nearly 20 Hebrew words, of which, however, most are derivatives of the stems \'awah, luz, \'aqash. The Revised Version (British and American) has made few changes. In <a onClick="return mV(\'Job\',6,30);">Job 6:30</a>, the Revised Version (British and American) "mischievous" is better for the taste of a thing, and in <a onClick="return mV(\'Isa\',59,3);">Isa 59:3</a> greater emphasis is gained by the Revised Version (British and American) "wickedness." In <a onClick="return mV(\'Eze\',9,9);">Eze 9:9</a>, "wresting of judgment" is perhaps too concrete, and "perverseness" is kept in the margin (inverted in the King James Version). the Revised Version margin "headlong" in <a onClick="return mV(\'Num\',22,32);">Nu 22:32</a> is over-literal, but in <a onClick="return mV(\'Num\',23,21);">23:21</A> the American Standard Revised Version margin\'s "trouble" is a distinct improvement.``1';
isbe[6840]='Pestilence`pes\'-ti-lens (debher; loimos): Any sudden fatal epidemic is designated by this word, and in its Biblical use it generally indicates that these are divine visitations. The word is most frequently used in the prophetic books, and it occurs 25 times in Jeremiah and Ezekiel, always associated with the sword and famine. In 4 other passages it is combined with noisome or evil beasts, or war. In <a onClick="return mV(\'Amo\',4,10);">Am 4:10</a> this judgment is compared with the plagues of Egypt, and in <a onClick="return mV(\'Hab\',3,5);">Hab 3:5</a> it is a concomitant of the march of God from the Arabian mountain. There is the same judicial character associated with pestilence in <a onClick="return mV(\'Exd\',5,3);">Ex 5:3</a>; <a onClick="return mV(\'Exd\',9,15);">9:15</a>; <a onClick="return mV(\'Lev\',26,25);">Le 26:25</a>; <a onClick="return mV(\'Num\',14,12);">Nu 14:12</a>; <a onClick="return mV(\'Deu\',28,21);">De 28:21</a>; <a onClick="return mV(\'2Sa\',24,21);">2Sa 24:21</a>; <a onClick="return mV(\'1Ch\',21,12);">1Ch 21:12</a>; <a onClick="return mV(\'Eze\',14,19,21);">Eze 14:19,21</a>. In the dedication prayer of Solomon, a special value is besought for such petitions against pestilence as may be presented toward the temple (<a onClick="return mV(\'2Ch\',6,28);">2Ch 6:28</a>). Such a deliverance is promised to those who put their trust in God (<a onClick="return mV(\'Psa\',91,6);">Ps 91:6</a>). Here the pestilence is called noisome, a shortened form of "annoysome," used in the sense of "hateful" or that which causes trouble or distress. In modern English it has acquired the sense of loathsome. "Noisome" is used by Tyndale where the King James Version and the Revised Version (British and American) have "hurtful" in <a onClick="return mV(\'1Ti\',6,9);">1Ti 6:9</a>. <a onClick="return mV(\'Act\',19,8);">Ac 19:8</a> the King James Version writes "persuading the things" (the Revised Version (British and American) "as to the things") for "present the things persuasively." And in <a onClick="return mV(\'Gal\',1,10);">Ga 1:10</a> (the English Revised Version and the King James Version, not in the American Standard Revised Version) and <a onClick="return mV(\'2Cr\',5,11);">2Co 5:11</a>, there is a half-ironic force in the word: Paul\'s enemies have accused him of using unworthy persuasion in making his conversions.<P>The Latin word pestilentia is connected with pestis, "the plague," but pestilence is used of any visitation and is not the name of any special disease; debher is applied to diseases of cattle and is translated "murrain."<P>In the New Testament pestilence is mentioned in our Lord\'s eschatological discourse (<a onClick="return mV(\'Mat\',24,7);">Mt 24:7</a> the King James Version; <a onClick="return mV(\'Luk\',21,11);">Lu 21:11</a>) coupled with famine. The assonance of loimos and limos in these passages (loimos is omitted in the Revised Version (British and American) passage for Mt) occurs in several classical passages, e.g. Herodotus vii.171. The pestilence is said to walk in darkness (<a onClick="return mV(\'Psa\',91,6);">Ps 91:6</a>) on account of its sudden onset out of obscurity not associated with any apparent cause.``107';
isbe[6841]='Pestle`pes\'-\'l (\'eli): A rounded implement of wood or stone used for pounding, bruising, or powdering materials in a mortar. Used only in <a onClick="return mV(\'Pro\',27,22);">Pr 27:22</a>. The assonance of loimos and limos in these passages (loimos is omitted in the Revised Version (British and American) passage for Mat) occurs in several classical passages, e.g. Herodotus vii.171. The pestilence is said to walk in darkness (<a onClick="return mV(\'Psa\',91,6);">Ps 91:6</a>) on account of its sudden onset out of obscurity not associated with any apparent cause.`<a href="./study/isbe/search.html?string=MORTAR">MORTAR</a>`1';
isbe[6842]='Peter, Apocalypse of``<a href="./study/isbe/search.html?string=APOCRYPHAL+GOSPELS">APOCRYPHAL GOSPELS</a>; <a href="./study/isbe/search.html?string=LITERATURE,+SUB+APOSTOLIC">LITERATURE, SUB-APOSTOLIC</a>`1';
isbe[6843]='Peter, Epistles of``<a href="./study/isbe/search.html?string=PETER,+THE+FIRST+EPISTLE+OF">PETER, THE FIRST EPISTLE OF</a>; <a href="./study/isbe/search.html?string=PETER,+THE+SECOND+EPISTLE+OF">PETER, THE SECOND EPISTLE OF</a>`1';
isbe[6844]='Peter, Gospel According To``<a href="./study/isbe/search.html?string=APOCRYPHAL+GOSPELS">APOCRYPHAL GOSPELS</a>; <a href="./study/isbe/search.html?string=LITERATURE,+SUB+APOSTOLIC">LITERATURE, SUB-APOSTOLIC</a>`1';
isbe[6845]='Peter, Simon`pe\'-ter, si\'-mon): <p>1. Name and Early Career<P>2. First Appearance in Gospel History<P>3. Life-Story<P class="in15">(1) First Period<P class="in15">(2) Second Period<P>4. Character<P>5. Writings<P class="in15">(1) First Epistle<P class="in15">(2) Second Epistle<P>6. Theology<P class="in15">(1) Messianic Teaching<P class="in15">(2) Justification<P class="in15">(3) Redemption<P class="in15">(4) Future Life<P class="in15">(5) Holy Scripture<P class="in15">(6) Apostasy and Judgment<P class="in15">(7) Second Coming of Christ<P>LITERATURE<hr /><P>The data for this article are found chiefly in the four Gospels; in <a onClick="return mV(\'Act\',1,\'1-\');">Ac 1-15</a>; in <a onClick="return mV(\'Gal\',1,\'1-\');">Ga 1</a> and <a onClick="return mV(\'Gal\',2,\'1-\');">2</A>; and in the two Epistles of Peter.<P>1. Name and Early Career:<P>Simon (or Simeon) was the original name of Peter, the son of Jonas (or John), and brother of Andrew, a disciple of John the Baptist, as Peter also may have been. A fisherman by occupation, he was an inhabitant of Bethsaida on the Sea of Galilee, though subsequently he dwelt with his family at Capernaum (<a onClick="return mV(\'Mat\',4,18);">Mt 4:18</a>; <a onClick="return mV(\'Mat\',8,14);">8:14</a>; <a onClick="return mV(\'Mat\',10,2);">10:2</a>; <a onClick="return mV(\'Mat\',16,16,17);">16:16,17</a>; <a onClick="return mV(\'Mat\',17,25);">17:25</a>; <a onClick="return mV(\'Mar\',1,16,29,30,36);">Mr 1:16,29,30,36</a>; <a onClick="return mV(\'Luk\',5,3,4,5,8,10);">Lu 5:3,4,5,8,10</a>; <a onClick="return mV(\'Luk\',22,31);">22:31</a>; <a onClick="return mV(\'Luk\',24,34);">24:34</a>; <a onClick="return mV(\'Jhn\',1,\'40-44\');">Joh 1:40-44</a>).<P>2. First Appearance in Gospel History:<P>His first appearance in Gospel history is in <a onClick="return mV(\'Jhn\',1,\'35-42\');">Joh 1:35-42</a>, when Andrew, having discovered Jesus to be the Messiah, "first findeth his own brother Simon," and "brought him unto Jesus"; on which occasion it was that the latter, beholding him, said, "Thou shalt be called Cephas," an Aramaic surname whose Greek synonym is Petros, or Peter, meaning "a rock" or "stone" At this time also he received his first call to the discipleship of Jesus, although, in common with that of others of the Twelve, this call was twice repeated. See <a onClick="return mV(\'Mat\',4,19);">Mt 4:19</a>; <a onClick="return mV(\'Mar\',1,17);">Mr 1:17</a>; <a onClick="return mV(\'Luk\',5,3);">Lu 5:3</a> for the second call, and <a onClick="return mV(\'Mat\',10,2);">Mt 10:2</a>; <a onClick="return mV(\'Mar\',3,14,16);">Mr 3:14,16</a>; <a onClick="return mV(\'Luk\',6,13,14);">Lu 6:13,14</a> for the third. Some interpret the second as that when he was chosen to be a constant companion of Jesus, and the third when he was at length selected as an apostle.<P>3. Life-Story:<P>The life-story of Peter falls into two parts: first, from his call to the ascension of Christ; secondly, from that event to the close of his earthly career.<P>(1) First Period:<P>The first period again may be conveniently divided into the events prior to the Passion of Christ and those following. There are about ten of the former: the healing of his wife\'s mother at Capernaum (<a onClick="return mV(\'Mat\',8,14);">Mt 8:14</a>); the great draught of fishes, and its effect in his self-abasement and surrender of his all to Jesus (<a onClick="return mV(\'Luk\',5,\'1-11\');">Lu 5:1-11</a>); his call to the apostolic office and his spiritual equipment therefor (<a onClick="return mV(\'Mat\',10,2);">Mt 10:2</a>); his attachment to his Master, as shown in his attempt to walk upon the waves (<a onClick="return mV(\'Mat\',14,28);">Mt 14:28</a>); the same attachment as shown at a certain crisis, in his inquiry "Lord, to whom shall we go?" (<a onClick="return mV(\'Jhn\',6,68);">Joh 6:68</a>); his noble confession of Jesus as the Christ, the Son of the living God, and, alas, the rebuke that followed it (<a onClick="return mV(\'Mat\',16,\'13-23\');">Mt 16:13-23</a>); the exalted privileges he enjoyed with James and John as witness of the raising of Jairus\' daughter (<a onClick="return mV(\'Mar\',5,37);">Mr 5:37</a>) and the transfiguration of his Lord (<a onClick="return mV(\'Mat\',17,\'1-5\');">Mt 17:1-5</a>); and finally, the incident of the tribute money, found only in <a onClick="return mV(\'Mat\',17,24);">Mt 17:24</a>.<P>The events beginning at the Passion are more easily recalled, because to so large an extent are they found in all the Gospels and about in the same order. They commence with the washing of his feet by the Master at the time of the last Passover, and the two mistakes he made as to the spiritual import of that act (<a onClick="return mV(\'Jhn\',13,\'1-10\');">Joh 13:1-10</a>); the first of his presumptuous boastings as to the strength of his devotion to his Master, and the warning of the latter as to Satan\'s prospective assault upon him (<a onClick="return mV(\'Luk\',22,\'31-34\');">Lu 22:31-34</a>), twice repeated before the betrayal in Gethsemane (<a onClick="return mV(\'Mat\',26,\'31-35\');">Mt 26:31-35</a>); the admission to the garden to behold the Saviour\'s deepest distress, the charge to watch and pray, and the failure to do so through sleepiness (<a onClick="return mV(\'Mat\',26,\'36-46\');">Mt 26:36-46</a>); the mistaken courage in severing the ear of Malchus (<a onClick="return mV(\'Jhn\',18,\'10-12\');">Joh 18:10-12</a>); the forsaking of his Lord while the latter was being led away as a prisoner, his following Him afar off, his admission into the high priest\'s palace, his denial "before them all," his confirmation of it by an oath, his remembrance of the warning when "the Lord turned and looked upon Peter," and his tears of bitterness as he went out (<a onClick="return mV(\'Mat\',26,\'56-58\');">Mt 26:56-58</a>; <a onClick="return mV(\'Mar\',14,\'66-72\');">Mr 14:66-72</a>; <a onClick="return mV(\'Luk\',22,\'54-62\');">Lu 22:54-62</a>; <a onClick="return mV(\'Jhn\',18,\'15-27\');">Joh 18:15-27</a>).<P>It will be seen that the story of Peter\'s fall is thus related by all the evangelists, but, to quote another, "None have described it in a more heinous light, than Mark; and if, as is generally supposed, that Gospel was reviewed by Peter himself and even written under his direction this circumstance may be considered as an evidence of his integrity and sincere contrition."<P>Nothing more is heard of Peter until the morning of the resurrection, when, on the first tidings of the event, he runs with John to see the tomb (<a onClick="return mV(\'Jhn\',20,\'1-10\');">Joh 20:1-10</a>); his name is especially mentioned to the women by the angel (<a onClick="return mV(\'Mar\',16,7);">Mr 16:7</a>); and on the same day he sees Jesus alive before any of the rest of the Twelve (<a onClick="return mV(\'Luk\',24,34);">Lu 24:34</a>; <a onClick="return mV(\'1Cr\',15,5);">1Co 15:5</a>). Subsequently, at the Sea of Tiberias, Peter is given an opportunity for a threefold confession of Jesus whom he had thrice denied, and is once more assigned to the apostolic office; a prediction follows as to the kind of death he should die, and also a command to follow his Lord (<a onClick="return mV(\'Jhn\',21,\'1-\');">Joh 21</a>).<P>(2) Second Period:<P>The second period, from the ascension of Christ to the conversion of Paul, is more briefly sketched. After the ascension, of which Peter was doubtless a witness, he "stood up in the midst of the brethren" in the upper room in Jerusalem to counsel the choice of a successor to Judas (<a onClick="return mV(\'Act\',1,\'15-26\');">Ac 1:15-26</a>). On the day of Pentecost he preaches the first gospel sermon (<a onClick="return mV(\'Act\',2,\'1-\');">Ac 2</a>), and later, in company with John, instrumentally heals the lame man, addresses the people in the Temple, is arrested, defends himself before the Sanhedrin and returns to his "own company" (<a onClick="return mV(\'Act\',3,\'1-\');">Ac 3</a>; <a onClick="return mV(\'Act\',4,\'1-\');">4</a>). He is again arrested and beaten (<a onClick="return mV(\'Act\',5,\'1-\');">Ac 5</a>); after a time he is sent by the church at Jerusalem to communicate the Holy Spirit to the disciples at Samaria (<a onClick="return mV(\'Act\',8,\'1-\');">Ac 8</a>). Returning to Jerusalem (where presumably Paul visits him, <a onClick="return mV(\'Gal\',1,18);">Ga 1:18</a>), he afterward journeys "throughout all parts," heals Aeneas at Lydda, raises Dorcas from the dead at Joppa, sees a vision upon the housetop which influences him to preach the gospel to the Gentile centurion at Caesarea, and explains this action before "the apostles and the brethren that were in Judea" (<a onClick="return mV(\'Act\',9,\'32-41\');">Ac 9:32-41</a>; chapter <a onClick="return mV(\'Act\',11,\'1-\');">11</a>).<P>After a while another persecution arose against the church, and Herod Agrippa, having put James to death, imprisons Peter with the thought of executing him also. Prayer is made by the church on his behalf, however, and miraculous deliverance is given him (<a onClick="return mV(\'Act\',12,\'1-\');">Ac 12</a>). Retiring for a while from public attention, he once more comes before us in the church council at Jerusalem, when the question is to be settled as to whether works are needful to salvation, adding his testimony to that of Paul and Barnabas in favor of justification by faith only (<a onClick="return mV(\'Act\',15,\'1-\');">Ac 15</a>).<P>Subsequently, he is found at Antioch, and having fellowship with GentileChristians until "that certain came from James," when "he drew back and separated himself, fearing them that were of the circumcision," for which dissembling Paul "resisted him to the face, because he stood condemned" (<a onClick="return mV(\'Gal\',2,\'11-14\');">Ga 2:11-14</a>).<P>Little more is authentically known of Peter, except that he traveled more or less extensively, being accompanied by his wife (<a onClick="return mV(\'1Cr\',9,5);">1Co 9:5</a>), and that he wrote two epistles, the second of which was penned as he approached the end of his life (<a onClick="return mV(\'2Pe\',1,\'12-15\');">2Pe 1:12-15</a>).<P>The tradition is that he died a martyr at Rome about 67 AD, when about 75 years old. His Lord and Master had predicted a violent death for him (<a onClick="return mV(\'Jhn\',21,18,19);">Joh 21:18,19</a>), which it is thought came to pass by crucifixion under Nero. It is said that at his own desire he was crucified head downward, feeling himself unworthy to resemble his Master in his death.<P>It should be observed, however, that the tradition that he visited Rome is only tradition and nothing more, resting as it does partly upon a miscalculation of some of the early Fathers, "who assume that he went to Rome in 42 AD, immediately after his deliverance from prison" (compare <a onClick="return mV(\'Act\',11,17);">Ac 11:17</a>). Schaff says this "is irreconcilable with the silence of Scripture, and even with the mere fact of Paul\'s Epistle to the Romans, written in 58, since the latter says not a word of Peter\'s previous labors in that city, and he himself never built on other men\'s foundations" (<a onClick="return mV(\'Rom\',15,20);">Ro 15:20</a>; <a onClick="return mV(\'2Cr\',10,15,16);">2Co 10:15,16</a>).<P>4. Character:<P>The character of Peter is transparent and easily analyzed, and it is doubtless true that no other "in Scriptural history is drawn for us more clearly or strongly." He has been styled the prince of the apostles, and, indeed, seems to have been their leader on every occasion. He is always named first in every list of them, and was their common spokesman. He was hopeful, bold, confident, courageous, frank, impulsive, energetic, vigorous, strong, and loving, and faithful to his Master notwithstanding his defection prior to the crucifixion. It is true that he was liable to change and inconsistency, and because of his peculiar temperament he sometimes appeared forward and rash. Yet, as another says, "His virtues and faults had their common root in his enthusiastic disposition," and the latter were at length overruled by divine grace into the most beautiful humility and meekness, as evinced in his two Epistles.<P>The leadership above referred to, however, should not lead to the supposition that he possessed any supremacy over the other apostles, of which there is no proof. Such supremacy was never conferred upon him by his Master, it was never claimed by himself, and was never conceded by his associates. See in this Connection <a onClick="return mV(\'Mat\',23,\'8-12\');">Mt 23:8-12</a>; <a onClick="return mV(\'Act\',15,13,14);">Ac 15:13,14</a>; <a onClick="return mV(\'2Cr\',12,11);">2Co 12:11</a>; <a onClick="return mV(\'Gal\',2,11);">Ga 2:11</a>.<P>It is true that when Christ referred to the meaning of his name (<a onClick="return mV(\'Mat\',16,18);">Mt 16:18</a>), He said, "Upon this rock I will build my church," but He did not intend to teach that His church would be built upon Peter, but upon Himself as confessed by Peter in <a onClick="return mV(\'Mat\',16,16);">Mt 16:16</a>. Peter is careful to affirm this in the first of his two Epistles (<a onClick="return mV(\'1Pe\',2,\'4-9\');">1Pe 2:4-9</a>). Moreover, when Christ said, "I will give unto thee the keys of the kingdom of heaven," etc. (<a onClick="return mV(\'Mat\',16,19);">Mt 16:19</a>), He invested him with no power not possessed in common with his brethren, since they also afterward received the same commission (<a onClick="return mV(\'Mat\',18,18);">Mt 18:18</a>; <a onClick="return mV(\'Jhn\',20,23);">Joh 20:23</a>). A key is a badge of power or authority, and, as many Protestant commentators have pointed out, to quote the language of one of them, "the apostolic history explains and limits this trust, for it was Peter who opened the door of the gospel to Israel on the day of Pentecost (<a onClick="return mV(\'Act\',2,\'38-42\');">Ac 2:38-42</a>) and to the Gentiles in the house of Cornelius (<a onClick="return mV(\'Act\',10,\'34-46\');">Ac 10:34-46</a>)." Some, however, regard this authority as identical with the great commission (<a onClick="return mV(\'Mat\',28,19);">Mt 28:19</a>).<P>See <a href="./study/isbe/search.html?string=KEYS,+POWER+OF+THE">KEYS, POWER OF THE</a>.<P>5. Writings:<P>The two Epistles of Peter were written presumably late in life, as appears especially of the Second (<a onClick="return mV(\'2Pe\',1,\'12-15\');">2Pe 1:12-15</a>). Both were addressed to the same class of persons, chiefly Jewish Christians scattered abroad in the different provinces of Asia Minor, among whom Paul and his associates had planted the gospel (<a onClick="return mV(\'1Pe\',1,1,2);">1Pe 1:1,2</a>; <a onClick="return mV(\'2Pe\',3,1);">2Pe 3:1</a>). The First was written at Babylon (<a onClick="return mV(\'1Pe\',5,13);">1Pe 5:13</a>), doubtless the famous Babylon on the Euphrates, which, though destroyed as a great capital, was still inhabited by a small colony of people, principally Jews (see Weiss, Introduction, II, 150).<P>See also <a href="./study/isbe/search.html?string=PETER,+THE+FIRST+EPISTLE+OF">PETER, THE FIRST EPISTLE OF</a>.<P>(1) First Epistle.<P>The theme of the First Epistle seems to be the living hope to which the Christian has been begotten, and the obligations it lays upon him. The living hope is expounded in the earlier part of <a onClick="return mV(\'1Pe\',1,\'1-13\');">1Pe 1:1-13</a>, where the obligations begin to be stated, the first group including hope, godly fear, love to the brethren, and praise (<a onClick="return mV(\'1Pe\',1,\'13-\');">1:13</a>-<a onClick="return mV(\'1Pe\',2,\'1-10\');">2:10</A>).<P>The writer drops his pen at this point, to take it up again to address those who were suffering persecution for righteousness\' sake, upon whom two more obligations are impressed, submission to authority, and testimony to Christ (<a onClick="return mV(\'1Pe\',2,11);">1Pe 2:11-4:6</a>). The third group which concludes the book begins here, dealing with such themes as spiritual hospitality in the use of heavenly gifts, patience in suffering, fidelity in service, and humility in ministering to one another. The letter was Sent to the churches "by Silvanus, our faithful brother," the author affirming that his object in writing was to exhort and testify concerning "the true grace of God" (<a onClick="return mV(\'1Pe\',5,12);">1Pe 5:12</a>).<P>The genuineness of this First Epistle has never been doubted, except of course by those who in these latter days have doubted everything, but the same cannot be said of the Second. It is not known to whom the latter was entrusted; as a matter of fact it found no place in the catalogues of the New Testament Scriptures of the 2nd and 3rd centuries. The first church employing it was at Alexandria, but subsequently the church at large became satisfied from internal evidence of its genuineness and inspiration, and when the Canon was pronounced complete in the 4th century, it was without hesitancy received.<P>(2) Second Epistle.<P>The Second Epistle claims to have been written by Peter (<a onClick="return mV(\'2Pe\',1,1);">2Pe 1:1</a>; <a onClick="return mV(\'2Pe\',3,1,2);">3:1,2</a>), to doubt which would start more serious difficulties than can be alleged against its genuineness, either because of its late admission to the Canon or its supposed diversity of style from Peter\'s early writing.<P>See <a href="./study/isbe/search.html?string=PETER,+THE+SECOND+EPISTLE+OF">PETER, THE SECOND EPISTLE OF</a>.<P>His object is the same in both Epistles, to "stir up your sincere mind by putting you in remembrance" (<a onClick="return mV(\'2Pe\',3,1);">2Pe 3:1</a>). Like Paul in his Second Epistle to Timothy, he foresees the apostasy in which the professing church will end, the difference being that Paul speaks of it in its last stage when the laity have become infected (<a onClick="return mV(\'2Ti\',3,\'1-5\');">2Ti 3:1-5</a>; <a onClick="return mV(\'2Ti\',4,3,4);">4:3,4</a>), while Peter sees it in its origin as traceable to false teachers (<a onClick="return mV(\'2Pe\',2,\'1-3\',\'15-19\');">2Pe 2:1-3,15-19</a>). As in the First Epistle he wrote to exhort and to testify, so here it is rather to caution and warn. This warning was, as a whole, against falling from grace (<a onClick="return mV(\'2Pe\',3,17,18);">2Pe 3:17,18</a>), the enforcement of which warning is contained in <a onClick="return mV(\'2Pe\',1,\'2-11\');">2Pe 1:2-11</a>, the ground of it in <a onClick="return mV(\'2Pe\',1,\'12-21\');">1:12-21</a>, and the occasion of it in the last two chapters. To speak only of the occasion: This, as was stated, was the presence of false teachers (<a onClick="return mV(\'2Pe\',2,1);">2:1</A>), whose eminent success is predicted (<a onClick="return mV(\'2Pe\',2,2);">2:2</A>), whose punishment is certain and dreadful (<a onClick="return mV(\'2Pe\',2,\'3-9\');">2:3-9</A>), and whose description follows (<a onClick="return mV(\'2Pe\',2,\'10-22\');">2:10-22</A>). The character of their false teaching (<a onClick="return mV(\'2Pe\',3,\'1-\');">2Pe 3</a>) forms one of the most interesting and important features of the Epistle, focusing as it does on the Second Coming of Christ.<P>6. Theology:<P>The theology of Peter offers an interesting field of study because of what may be styled its freshness and variety in comparison with that of Paul and John, who are the great theologians of the New Testament.<P>(1) Messianic Teaching.<P>In the first place, Peter is unique in his Messianic teaching as indicated in the first part of the Acts, where he is the chief personage, and where for the most part his ministry is confined to Jerusalem and the Jews. The latter, already in covenant relations with Yahweh, had sinned in rejecting Jesus as the Messiah, and Peter\'s preaching was directed to that point, demanding repentance or a change of mind about Him. The apparent failure of the Old Testament promises concerning the Davidic kingdom (<a onClick="return mV(\'Isa\',11,\'10-12\');">Isa 11:10-12</a>; <a onClick="return mV(\'Jer\',23,\'5-8\');">Jer 23:5-8</a>; <a onClick="return mV(\'Eze\',37,\'21-28\');">Eze 37:21-28</a>) was explained by the promise that the kingdom would be set up at the return of Christ (<a onClick="return mV(\'Act\',2,\'25-31\');">Ac 2:25-31</a>; <a onClick="return mV(\'Act\',15,\'14-16\');">15:14-16</a>); which return, personal and corporeal, and for that purpose, is presented as only awaiting their national repentance (<a onClick="return mV(\'Act\',3,\'19-26\');">Ac 3:19-26</a>). See Scofield, Reference Bible, at the places named.<P>(2) Justification.<P>But Peter\'s special ministry to the circumcision is by no means in conflict with that of Paul to the Gentiles, as demonstrated at the point of transition in <a onClick="return mV(\'Act\',10,\'1-\');">Ac 10</a>. Up until this time the gospel had been offered to the Jews only, but now they have rejected it in the national sense, and "the normal order for the present Christian age" is reached (<a onClick="return mV(\'Act\',13,\'44-48\');">Ac 13:44-48</a>). Accordingly, we find Peter, side by side with Paul, affirming the great doctrine of justification by faith only, in the words, "We believe that through the grace of the Lord Jesus Christ we (Jews) shall be saved, even as they (Gentiles)" (<a onClick="return mV(\'Act\',15,11);">Ac 15:11</a> the King James Version). Moreover, it is clear from Peter\'s Second Epistle (<a onClick="return mV(\'2Pe\',1,1);">2Pe 1:1</a>) that his conception of justification from the divine as well as the human side is identical with that of Paul, since he speaks of justifying faith as terminating on the righteousness of our God and Saviour Jesus Christ. As we understand it, this is not the righteousness which God is, but the righteousness which God gives (compare <a onClick="return mV(\'Rom\',1,16,17);">Ro 1:16,17</a>; <a onClick="return mV(\'Rom\',3,\'21-25\');">3:21-25</a>; <a onClick="return mV(\'2Cr\',5,20,21);">2Co 5:20,21</a>).<P>(3) Redemption.<P>Passing from his oral to his written utterances, Peter is particularly rich in his allusions to the redemptive work of Christ. Limiting ourselves to his First Epistle, the election of the individual believer is seen to be the result of the sprinkling of Christ\'s blood (<a onClick="return mV(\'1Pe\',1,1);">1Pe 1:1</a>); his obedience and godly fear are inspired by the sacrifice of the "lamb without blemish and without spot: Who verily was foreordained before the foundation of the world" (<a onClick="return mV(\'1Pe\',1,\'17-20\');">1Pe 1:17-20</a> the King James Version). But most interesting are the manner and the connection in which these sublime truths are sometimes set before the reader. For example, an exhortation to submission on the part of household slaves is the occasion for perhaps the most concise and yet comprehensive interpretation of Christ\'s vicarious sufferings anywhere in the New Testament (<a onClick="return mV(\'1Pe\',2,\'18-25\');">1Pe 2:18-25</a>, especially the last two verses; compare also in its context <a onClick="return mV(\'1Pe\',3,\'18-22\');">1Pe 3:18-22</a>).<P>(4) Future Life.<P>Next to the redemptive work of Christ, the Petrine teaching about the future life claims attention. The believer has been begotten again unto "a lively (or living) hope" (<a onClick="return mV(\'1Pe\',1,3);">1Pe 1:3</a>); which is "an inheritance" "reserved in heaven" (<a onClick="return mV(\'1Pe\',1,4);">1Pe 1:4</a>); and associated with "praise, and glory and honor at the revelation (Second Coming) of Jesus Christ" (<a onClick="return mV(\'1Pe\',1,7,13);">1Pe 1:7,13</a>; <a onClick="return mV(\'1Pe\',4,13);">4:13</a>; <a onClick="return mV(\'1Pe\',5,4,10);">5:4,10</a>; <a onClick="return mV(\'2Pe\',1,11,16);">2Pe 1:11,16</a>; <a onClick="return mV(\'2Pe\',3,13);">3:13</a>, etc.). This "hope" or "inheritance" is so real and so precious as to cause rejoicing even in times of heaviness and trial (<a onClick="return mV(\'1Pe\',1,6);">1Pe 1:6</a>); to stimulate to holiness of living (<a onClick="return mV(\'1Pe\',1,\'13-16\');">1Pe 1:13-16</a>); to patience in persecution (<a onClick="return mV(\'1Pe\',4,12,13);">1Pe 4:12,13</a>); fidelity in service (<a onClick="return mV(\'1Pe\',5,\'1-4\');">1Pe 5:1-4</a>); stedfastness against temptation (5:8-10); and growth in grace (<a onClick="return mV(\'2Pe\',1,10,11);">2Pe 1:10,11</a>). It is a further peculiarity that the apostle always throws the thought of the present suffering forward into the light of the future glory. It is not as though there were merely an allotment of suffering here, and an allotment of glory by and by, with no relation or connection between the two, but the one is seen to be incident to the other (compare <a onClick="return mV(\'1Pe\',1,7,11);">1Pe 1:7,11</a>; <a onClick="return mV(\'1Pe\',4,13);">4:13</a>; <a onClick="return mV(\'1Pe\',5,1);">5:1</a>; <a onClick="return mV(\'2Pe\',3,12,13);">2Pe 3:12,13</a>). It is this circumstance, added to others, that gives Peter the title of the apostle of hope, as Paul has been called the apostle of faith, and John the apostle of love.<P>(5) Holy Scripture.<P>Considering their limitations as to space, Peter\'s Epistles are notable for the emphasis they lay upon the character and authority of the Holy Scriptures. <a onClick="return mV(\'1Pe\',1,\'10-12\');">1Pe 1:10-12</a> teaches a threefold relation of the Holy Spirit to the Holy Word as its Author, its Revealer, and its Teacher or Preacher. The same chapter (<a onClick="return mV(\'1Pe\',1,\'22-25\');">1:22-25</a>) speaks of its life-giving and purifying power as well as its eternal duration. <a onClick="return mV(\'1Pe\',2,\'1);">1 Peter 2</a> opens with a declaration of its vital relation to the Christian\'s spiritual growth. In <a onClick="return mV(\'1Pe\',4,11);">4:11</A>, it is shown to be the staple of the Christian\'s ministry. Practically the whole of the Second Epistle is taken up with the subject. Through the "exceeding great and precious promises" of that Word, Christians become "partakers of the divine nature" (<a onClick="return mV(\'2Pe\',1,4);">2Pe 1:4</a> the King James Version); that they may be kept "always in remembrance" is Peter\'s object in writing (<a onClick="return mV(\'2Pe\',1,\'12-15\');">2Pe 1:12-15</a> the King James Version); the facts of that Word rest on the testimony of eyewitnesses (<a onClick="return mV(\'2Pe\',1,\'16-18\');">2Pe 1:16-18</a>); its origin is altogether divine (<a onClick="return mV(\'2Pe\',1,20,21);">2Pe 1:20,21</a>); which is as true of the New Testament as of the Old Testament (<a onClick="return mV(\'2Pe\',3,2);">2Pe 3:2</a>); including the Epistles of Paul (<a onClick="return mV(\'2Pe\',3,15,16);">2Pe 3:15,16</a>).<P>(6) Apostasy and Judgment.<P>This appreciation of the living Word of God finds an antithesis in the solemn warning against apostate teachers and teaching forming the substance of <a onClick="return mV(\'2Pe\',2,\'1-\');">2 Peter 2</a> and <a onClick="return mV(\'2Pe\',3,\'1-\');">3</A>. The theology here is of judgment. It is swift and "lingereth not" (<a onClick="return mV(\'2Pe\',2,\'1-3\');">2:1-3</a>); the Judge is He who "spared not" in olden time (<a onClick="return mV(\'2Pe\',2,\'4-7\');">2:4-7</a>); His delay expresses mercy, but He "will come as a thief" (<a onClick="return mV(\'2Pe\',3,9,10);">3:9,10</a>); the heavens "shall pass away," the earth and its works shall be burned up (<a onClick="return mV(\'2Pe\',3,10);">3:10</A>); "What manner of persons ought ye to be in all holy living and godliness?" (<a onClick="return mV(\'2Pe\',3,11);">3:11</A>).<P>(7) Second Coming of Christ.<P>Peter\'s theology concerning judgment is a further illustration of the Messianic character of his instruction. For example, the Second Coming of Christ of which he speaks in the closing chapter of the Second Epistle is not that aspect of it associated with the translation of His church, and of which Paul treats (<a onClick="return mV(\'1Th\',4,\'13-18\');">1Th 4:13-18</a>), but that pertaining to Israel and the day of Yahweh spoken of by the Old Testament prophets (<a onClick="return mV(\'Isa\',2,\'12-22\');">Isa 2:12-22</a>; <a onClick="return mV(\'Rev\',19,\'11-21\');">Re 19:11-21</a>, etc.).<P>LITERATURE.<P>The history of Peter is treated more or less at length in the introductions to the commentaries on his Epistles, and in works on the life of Christ. But particular reference is made to the following: E. W. Farrar, Early Days of Christianity, London, 1882; J. S. Howson, Studies in the Life of Peter, London, 1883; H. A. Birks, Life and Character of Peter, London, 1887; W. M. Ramsay, The Church in the Roman Empire, London, 1893; Mason Gallagher, Was Peter Ever at Rome? Philadelphia, 1895; A. C. McGiffert, The Apostolic Age, New York, 1897; W. H. Griffith Thomas, The Apostle Peter, London, 1904; G. Matheson, Representative Men of the New Testament, London, 1905; A. J. Southhouse, The Making of Simon Peter) New York, 1906; A. C. Gaebtelein, The Gospel of Matthew, New York, 1907; The Acts of the Apostles, New York, 1912; Edmundson, Church in Rome in the 1st Century, 1913; Smith, The Days of His Flesh, New York, 1911.<P>On theology of Peter, consult the subject in works on Systematic or Biblical, Theology, and see also R. W. Dale The Atonement, 97-148. London 1875: C. A. Briggs, Messiah of the Apostles, 21-41, New York, 1895; Scofield, Reference Bible, where pertinent.<P>Among commentaries on 1 and 2 Peter may be mentioned: Brown, 3 volumes, Edinburgh, 1848-56; Demarest, 2 volumes, New York, 1851-65; Leighton, republished, Philadelphia, 1864; Lillie, New York, 1869; G. F. C. Fronmuller, in Lange\'s Comm., English translation, New York, 1874; Plumptre, Cambridge Bible, 1883; Spitta, Der zweite Brief des Petrus, Halle, 1885; F. B. Meyer, London, 1890; Lumby, Expositor\'s Bible, London, 1894; J. H. Jowett, London, 1905; Bigg, ICC, 1901.``69';
isbe[6846]='Peter, the First Epistle of`<b>I. CANONICITY OF 1 PETER</b><P class="in15">1. External Evidence<P class="in15">2. Internal Evidence<P><b>II. THE ADDRESS</b><P class="in15">Silvanus<P><b>III. PLACE AND TIME OF COMPOSITION</b><P class="in15">1. Babylon: Which?<P class="in15">2. Babylon Not Rome<P><b>IV. DESIGN</b><P class="in15">1. Persecution<P class="in15">2. Example of Christ<P class="in15">3. Relation to State<P><b>V. CHARACTERISTIC FEATURES OF THE EPISTLE</b><P class="in15">1. Freedom in Structure<P class="in15">2. Hope<P class="in15">3. Inheritance<P class="in15">4. Testimony of Prophets<P class="in30">(1) Salvation<P class="in30">(2) Spirit of Christ<P class="in30">(3) Prophetic Study<P class="in15">5. The Christian Brotherhood<P class="in15">6. Spirits in Prison<P><b>VI. ANALYSIS</b><P><b>LITERATURE</b><hr /><P>Simon Peter was a native of Galilee. He was brought to the Saviour early in His ministry by his brother Andrew (<a onClick="return mV(\'Jhn\',1,40,41);">Joh 1:40,41</a>). His call to the office of apostle is recorded in <a onClick="return mV(\'Mat\',10,\'1-4\');">Mt 10:1-4</a>; <a onClick="return mV(\'Mar\',3,\'13-16\');">Mr 3:13-16</a>.<P>He occupied a distinguished place among the Lord\'s disciples. In the four lists of the apostles found in the New Testament his name stands first (<a onClick="return mV(\'Mat\',10,\'2-4\');">Mt 10:2-4</a>; <a onClick="return mV(\'Mar\',3,\'16-19\');">Mr 3:16-19</a>; <a onClick="return mV(\'Luk\',6,\'14-16\');">Lu 6:14-16</a>; <a onClick="return mV(\'Act\',1,13);">Ac 1:13</a>). He is the chief figure in the first twelve chapters of the Acts. It is Peter that preaches the first Christian sermon (<a onClick="return mV(\'Act\',2,\'1-\');">Ac 2</a>), he that opens the door of the gospel to the Gentile world in the house of the Roman soldier, Cornelius, and has the exquisite delight of witnessing scenes closely akin to those of Pentecost at Jerusalem (<a onClick="return mV(\'Act\',10,\'44-47\');">Ac 10:44-47</a>). It was given him to pronounce the solemn sentence on the guilty pair, Ananias and Sapphira, and to rebuke in the power of the Spirit the profane Simon Magus (<a onClick="return mV(\'Act\',5,\'1-11\');">Ac 5:1-11</a>; <a onClick="return mV(\'Act\',8,\'18-23\');">8:18-23</a>). In these and the like instances Peter exhibited the authority with which Christ had invested him (<a onClick="return mV(\'Mat\',16,19);">Mt 16:19</a>)—an authority bestowed upon all the disciples (<a onClick="return mV(\'Jhn\',20,22,23);">Joh 20:22,23</a>)—the power to bind and to loose.<P>Two Epistles are ascribed to Peter. Of the Second doubt and uncertainty have existed from the early ages to the present. The genuineness and authenticity of the First are above suspicion.<P>I. Canonicity of 1 Peter.<P>1. External Evidence:<P>The proof of its integrity and trustworthiness is ample and altogether satisfactory. It falls into parts: external and internal. The historical attestation to its authority as an apostolic document is abundant. Polycarp, disciple of the apostle John, martyed in 156 AD at 86 or more years of age, refers to the Epistle in unmistakable terms. Irenaeus, a man who may well be said to represent both the East and the West, who was a disciple of Polycarp, quotes it copiously, we are assured. Clement of Alexandria, born circa 150 AD, died circa 216 AD, cites it many times in his Stromata, one passage (<a onClick="return mV(\'1Pe\',4,8);">1Pe 4:8</a>) being quoted five times by actual count. "The testimony of the early-church is summed up by Eusebius (Historia Ecclesiastica, III, xxiii, 3). He places it among those writings about which no question was ever raised, no doubt ever entertained by any portion of the catholic church" (Professor Lumby in Bible Comm.).<P>2. Internal Evidence:<P>The internal evidence in favor of the Epistle is as conclusive as the external. The writer is well acquainted with our Lord\'s teaching, and he makes use of it to illustrate and enforce his own. The references he makes to that teaching are many, and they include the four Gospels. He is familiar likewise with the Epistles, particularly James, Romans, and Ephesians. But what is especially noteworthy is the fact that 1 Peter in thought and language stands in close relation with the apostle\'s discourses as recorded in Acts. By comparing <a onClick="return mV(\'1Pe\',1,17);">1Pe 1:17</a> with <a onClick="return mV(\'Act\',10,34);">Ac 10:34</a>; <a onClick="return mV(\'1Pe\',1,21);">1Pe 1:21</a> with <a onClick="return mV(\'Act\',2,\'32-36\');">Ac 2:32-36</a> and <a onClick="return mV(\'Act\',10,40,41);">10:40,41</a>; <a onClick="return mV(\'1Pe\',2,7,8);">1Pe 2:7,8</a> with <a onClick="return mV(\'Act\',4,10,11);">Ac 4:10,11</a>; <a onClick="return mV(\'1Pe\',2,17);">1Pe 2:17</a> with <a onClick="return mV(\'Act\',10,28);">Ac 10:28</a>, and <a onClick="return mV(\'1Pe\',3,18);">1Pe 3:18</a> with <a onClick="return mV(\'Act\',3,14);">Ac 3:14</a>, one will perceive how close the parallel between the two is. The inference from these facts appears legitimate, namely, 1 Peter in diction and thought belongs to the same period of time and moves in the same circle of truth as do the other writings of the New Testament. The writer was an apostle, and he was Simon Peter.<P>II. The Address.<P>Peter writes to the "elect who are sojourners of the Dispersion." James employs the term "Dispersion" to designate believing Hebrews of the Twelve Tribes who lived outside the land (<a onClick="return mV(\'Jam\',1,1);">Jas 1:1</a>). The Jews included in it the whole body of Israelites scattered among the Gentile nations (<a onClick="return mV(\'Jhn\',7,35);">Joh 7:35</a>). But we must not conclude from this that the Epistle is directed to Christian Jews alone. Gentile believers are by no means excluded, as <a onClick="return mV(\'1Pe\',1,14,18,20);">1Pe 1:14,18,20</a>; <a onClick="return mV(\'1Pe\',2,10);">2:10</a>; <a onClick="return mV(\'1Pe\',3,6);">3:6</a>; <a onClick="return mV(\'1Pe\',4,3,4);">4:3,4</a> abundantly attest. Indeed, the Gentile element in the churches of Asia Minor largely predominated at the time. The term "sojourners" represents a people away from home, strangers in a strange land; the word is translated "pilgrims" in <a onClick="return mV(\'1Pe\',2,11);">2:11</A> and <a onClick="return mV(\'Hbr\',11,13);">Heb 11:13</a>—an appropriate name for those who confess that they have here no continuing city, but who seek one to come. While no doubt Peter had believing Israelites in mind when he wrote, for he never forgot that his ministry belonged primarily to the circumcision (<a onClick="return mV(\'Gal\',2,7,8);">Ga 2:7,8</a>), he did not neglect the more numerous Gentile converts, and to these he speaks as earnestly as to the others; and these also were "sojourners."<P>Three of the four provinces Peter mentions, namely, Pontus, Cappadocia, and Asia, had representatives at the memorable Pentecost in Jerua (<a onClick="return mV(\'Act\',2,9);">Ac 2:9</a>; <a onClick="return mV(\'1Pe\',1,1);">1Pe 1:1</a>). Many of these "sojourners of the Dispersion" may have believed the message of the apostle and accepted salvation through Jesus Christ, and returned home to tell the good news to their neighbors and friends. This would form a strong bond of union between them and Peter, and would open the way for him to address them in the familiar and tender manner of the Epistle.<P>Silvanus:<P>Silvanus appears to have been the bearer of the letter to the Christians of Asia Minor: "By Silvanus, our faithful brother, as I account him, I have written unto you briefly" (<a onClick="return mV(\'1Pe\',5,12);">1Pe 5:12</a>). It is an assumption to assert from these words that Silvanus was employed in the composition of the letter. The statement denotes rather the bearer than the writer or secretary. Silvanus was Paul\'s companion in the ministry to the Asiatic churches, and since we do not read of him as going with Paul to Jerusalem or to Rome, it is probable he returned from Corinth (<a onClick="return mV(\'Act\',18,5);">Ac 18:5</a>) to Asia Minor and labored there. He and Peter met, where no one knows, though not a few think in Rome; as likely a guess perhaps is in Palestine. At any rate, Silvanus gave Peter an account of the conditions in the provinces, the afflictions and persecutions of believers, and the deep need they had for sympathy and counsel. He would, accordingly, be of the greatest assistance to the apostle. This seems to account for the peculiarity of language which Peter uses: "By Silvanus, our faithful brother, I have written unto you," as if he had some share in furnishing the contents of the Epistle.<P>III. Place and Time of Composition.<P>1. Babylon: Which?:<P>According to <a onClick="return mV(\'1Pe\',5,13);">1Pe 5:13</a> the Epistle was written in Babylon. But what place is meant? Two cities having this name were known in apostolic times. One was in Egypt, probably on or near the present site of Cairo, and we are told that it was a "city of no small importance." Epiphanius calls it "great Babylon" (Zahn). The absence, however, of all tradition that would tend to identify this place with the Babylon of the Epistle seems to shut it out of the problem. Babylon on the Euphrates is regarded by many as the place here designated. Jews in considerable numbers still dwelt in Babylon, notwithstanding the massacre of thousands in the reign of Claudius and the flight of multitudes into other countries. There is much to be said in favor of this city as the place meant, and yet the absence of tradition in its support is a very serious difficulty. A third view regards it as symbolical of Rome. Roman Catholics thus interpret it, and not a few Protestants so understand it. Tradition which runs back into the first half of the 2nd century appears to favor it, though much uncertainty and obscurity still surround the earliest ages of our era, in spite of the unwearied researches of modern scholars. Papias, bishop of Hierapolis, who lived in the first half of the 2nd century, appears to have had no doubt that Peter was martyred in Rome, and that the Babylon of the Epistle designates the Imperial City. There are very serious objections to this interpretation. One is, that it is totally out of keeping with Peter\'s manner of writing. Preeminently he is direct and matter-of-fact in his style. The metaphorical language he employs is mostly drawn from the Old Testament, or, if from himself, it is so common of use as to be well understood by all readers. It is altogether improbable that this man, plain of speech almost to bluntness, should interject in the midst of his personal explanations and final salutations such a mystical epithet with no hint of what he means by it, or why he employs such a mode of speech.<P>2. Babylon Not Rome:<P>Besides, there is no evidence that Rome was called Babylon by the Christians until the Book of Revelation was published, i.e. circa 90-96 AD. But if 1 Peter is dependent on the Apocalypse for this name of Babylon as Rome, Peter could not have been its author, for he died years before that date. The Epistle was written about 64 AD, at the time when persecutions under the infamous Nero were raging, at which time also the apostle himself bore his witness and went to his heavenly home, even as his Master had forewarned him (<a onClick="return mV(\'Jhn\',21,18,19);">Joh 21:18,19</a>). While not unmindful of the great difficulties that beset the view, nevertheless we are reclined to the opinion that the Babylon of <a onClick="return mV(\'1Pe\',5,13);">1Pe 5:13</a> is the ancient city on the Euphrates.<P>See <a href="./study/isbe/search.html?string=PETER,+(SIMON)">PETER, (SIMON)</a>.<P>IV. Design.<P>The apostle had more than one object in view when he addressed the "elect" in Asia Minor. The Lord Jesus had charged him, "Feed my lambs" "Tend my sheep"—"Feed my sheep" (<a onClick="return mV(\'Jhn\',21,\'15-17\');">Joh 21:15-17</a>). His two Epistles certify how faithfully he obeyed the charge. With loving and tender hand he feeds the lambs and tends the whole flock, warns against foes, guards from danger, and leads them into green pastures and beside still waters. He reminds them of the glorious inheritance they are to possess (<a onClick="return mV(\'1Pe\',1,\'3-9\');">1Pe 1:3-9</a>); he exhorts them to walk in the footsteps of the uncomplaining Christ (<a onClick="return mV(\'1Pe\',2,\'20-25\');">1Pe 2:20-25</a>); to be compassionate, loving, tender-hearted, humble-minded, and circumspect in their passage through this unfriendly world (<a onClick="return mV(\'1Pe\',3,\'8-12\');">1Pe 3:8-12</a>). He sums up the main duties of Christian life in the short but pregnant sentences, "Honor all men. Love the brotherhood. Fear God. Honor the king" (<a onClick="return mV(\'1Pe\',2,17);">1Pe 2:17</a>). But his supreme object is to comfort and encourage them amid the persecutions and the sufferings to which they were unjustly subjected, and to fortify them against the heavier trials that were impending.<P>1. Persecution:<P>From the beginning the Christian church was the object of suspicion and of hatred, and many of its adherents had suffered even unto death at the hands of both hostile Jews and fanatical Gentiles. But these afflictions were generally local and sporadic. There were churches of large membership and wide influence which were unmolested (<a onClick="return mV(\'1Cr\',4,\'8-10\');">1Co 4:8-10</a>), and which seem to have been able to get fair treatment in heathen courts (<a onClick="return mV(\'1Cr\',6,\'1-6\');">1Co 6:1-6</a>). But the condition brought to view in 1 Peter is altogether different. Trials and afflictions of the severest sort assail them, and an enmity and hostility, bent on their destruction, pursue them with tireless energy. The whole Christian body shared in the persecutions (<a onClick="return mV(\'1Pe\',5,9);">5:9<A>). The trial was a surprise (<a onClick="return mV(\'1Pe\',4,12);">4:12</A>), both in its intensity, for Peter calls it "fiery," and for its unexpectedness. The apostle represents it as a savage beast of prey, a roaring lion, prowling about them to seize and devour (<a onClick="return mV(\'1Pe\',5,8,9);">5:8,9</A>).<P>A variety of charges were brought against the Christians, but they were calumnies and slanders, without any foundation in fact. They were spoken against as evil-doers (<a onClick="return mV(\'1Pe\',2,12);">1Pe 2:12</a> kakopoion; malefici, Tacitus calls them). Their adversaries railed against them (<a onClick="return mV(\'1Pe\',3,9);">1Pe 3:9</a>); reviled them (<a onClick="return mV(\'1Pe\',3,16);">1Pe 3:16</a>); spake evil of them (<a onClick="return mV(\'1Pe\',4,4);">1Pe 4:4</a>); reproached them for the name of Christ (<a onClick="return mV(\'1Pe\',4,14);">1Pe 4:14</a>). These are ugly epithets. They show how bitter was the hatred and how intense the hostility felt by the heathen toward the Christians who dwelt among them. If there had been any justification for such antagonism in the character and the conduct of Christ\'s people, if they were evil-doers, "haters of the human race," to be classed with thieves and murderers and meddlers in other men\'s matters (<a onClick="return mV(\'1Pe\',4,\'14-16\');">1Pe 4:14-16</a>), as they were accused of being and doing, we could understand the fierce opposition which assailed them and the savage purpose to suppress them altogether, but the only ground for the enmity felt against them was the refusal of the Christians to join their heathen neighbors in their idolatries, their feasts, winebibbings, revelings, carousings, lasciviousness and lusts in which once they freely shared (<a onClick="return mV(\'1Pe\',4,\'2-4\');">1Pe 4:2-4</a>). The Asian saints had renounced all such wicked practices, had separated themselves from their old companions in riotous living and revolting debaucheries; they were witnesses against their immoralities, and hence, became the objects of intense dislike and persecuting animosity. Peter bears testimony to the high character, the purity of life and the self-sacrificing devotion of these believers. In all Asia Minor no better company of men and women could be found than these disciples of Jesus Christ; none more submissive to constituted authority, none more ready to help their fellow-men in their distress and trouble. The head and front of their offending was their separation from the ungodly world about them, and their solemn witness against the awful sins done daily before their eyes.<P>2. Example of Christ:<P>How mightily does the apostle minister to his suffering friends! He bids them remember the uncomplaining Christ when He was unjustly afflicted by cruel men (<a onClick="return mV(\'1Pe\',2,\'19-25\');">1Pe 2:19-25</a>). He tells them how they may effectively put to silence their accusers, and refute the calumnies and the slanders that are so cruelly circulated against them, namely, by living such pure and godly lives, by being so meek, docile, patient, stedfast, true and faithful to God, that none can credit the false accusations (<a onClick="return mV(\'1Pe\',2,\'1-5\');">1Pe 2:1-5</a>; <a onClick="return mV(\'1Pe\',2,\'13-17\');">2:13-17</a>; <a onClick="return mV(\'1Pe\',3,8,9,\'13-17\');">3:8,9,13-17</a>; <a onClick="return mV(\'1Pe\',5,\'6-11\');">5:6-11</a>).<P>3. Relation to State:<P>There is little or no evidence in the Epistle that the persecutions were inflicted by imperial authority or that the state was dealing with the Christians as enemies who were dangerous to the peace of society. In the provinces to which the letter was sent there seems to have been complete absence of formal trial and punishment through the courts. Peter does not speak of Iegal proceedings against the Christians by the magistrates. On the contrary, he urges them to be subject to every ordinance of man for the Lord\'s sake: whether to the king as supreme; or unto governors, as sent by him for vengeance on evil-doers and for praise to them that do well (<a onClick="return mV(\'1Pe\',2,13);">1Pe 2:13</a>). They are to honor all men, to honor the king (<a onClick="return mV(\'1Pe\',2,17);">1Pe 2:17</a>). This submission would scarcely be pressed if the state had already proscribed Christianity and decreed its total suppression. This the imperial government did later on, but there is no evidence furnished by the apostle that in 64 AD—the date of the Epistle—the government formally denounced Christians and determined to annihilate them.<P>Peter exhorts his fellow-believers to silence their persecutors by their upright conduct (<a onClick="return mV(\'1Pe\',2,15);">1Pe 2:15</a>); they are thus to put them to shame who falsely accuse them (<a onClick="return mV(\'1Pe\',3,16);">1Pe 3:16</a>); and they are not to combat evil with evil nor answer reviling with reviling, but contrariwise with blessing (<a onClick="return mV(\'1Pe\',3,9);">1Pe 3:9</a>). The antagonism here indicated obviously springs from the heathen populace; there is no hint of arraignment before magistrates or subjection to legal proceedings. It is unbelievers who revile and slander and denounce the people of God in the provinces.<P>Everything in the Epistle points to the time of Nero, 64 AD, and not to the time of Domitian or Trajan, or even Titus. In Rome vast multitudes of Christians were put to death in the most brutal fashion, so Tacitus relates, but the historian asserts that there was a sinister report to the effect that Nero himself instigated the burning of the city (July 19, 64), and "he (Nero) falsely diverted the charge on to a set of people to whom the vulgar gave the name of Christians (or Chrestians), and who were detested for the abominations which they perpetrated." See <a href="./study/isbe/search.html?string=NERO">NERO</a>. Certain facts are clear from Tacitus\' statements, namely, that at the time the Christians were well known as a distinct sect; and that they were subjected to the dreadful sufferings inflicted upon them because they were Christians; and the persecutions at the time were instigated by the fear and the brutality of the tyrant. Peter likewise recognizes the fact that believers were disliked and calumniated by their heathen neighbors for the same reason—they were Christians: "If ye are reproached for the name of Christ, blessed are ye" (<a onClick="return mV(\'1Pe\',4,14);">1Pe 4:14</a>); "But if a man suffer as a Christian, let him not be ashamed; but let him glorify God in this name" (<a onClick="return mV(\'1Pe\',4,16);">1Pe 4:16</a>). But the imperial government at the time does not appear to have taken formal action for the overthrow of Christianity as a system inimical to the empire. Of course, where direct charges of a criminal nature were made against Christians, judicial inquiry into them would be instituted. But in the Epistle what believers had to endure and suffer were the detraction, the vituperation, the opprobrium and the vile and malignant slanders with which the heathen assailed them.<P>V. Characteristic Features of the Epistle.<P>It has certain very distinct marks, some of which may be noticed.<P>1. Freedom in Structure:<P>It does not observe a close logical sequence in its structure, as those of Paul so prominently display. There is truth in Dean Alford\'s statement, although perhaps he pushes it rather far: "The link between one idea and another is found, not in any progress of unfolding thought or argument, but in the last word of the foregoing sentence which is taken up and followed out in the new one" (see <a onClick="return mV(\'1Pe\',1,5,6,7,9,10);">1Pe 1:5,6,7,9,10</a>, etc.). This peculiarity, however, does not interfere with the unity of the epistle, it rather adds to it, and it gives to it a vividness which it otherwise might not possess.<P>2. Hope:<P>It is the epistle of hope. How much it makes of this prime grace! Peter seems never to grow weary of describing it and exalting its radiant beauty and desirableness. He calls it a living hope (<a onClick="return mV(\'1Pe\',1,3);">1Pe 1:3</a>). It is born by the resurrection of Jesus Christ from the dead, and it calmly awaits the glorious inheritance that soon will be enjoyed. It is a hope that will be perfected at the advent of Christ (<a onClick="return mV(\'1Pe\',1,13);">1Pe 1:13</a>), and it is set on God, hence, cannot fail (<a onClick="return mV(\'1Pe\',1,21);">1Pe 1:21</a>). With sickly, dying hope we are quite familiar. The device which a certain state (South Carolina) has inscribed on its Great Seal is, dum spiro spero ("while I live I hope"). Such a hope may serve for a commonwealth whose existence is limited to this world, but a man needs something more enduring, something imperishable. "It is a fearful thing when a man and his hopes die together" (Leighton). A Christian can confidently write, "when I am dying I hope," for his is a living hope that fills and thrills the future with a blessed reality.<P>3. Inheritance:<P>The Christian\'s glorious inheritance (<a onClick="return mV(\'1Pe\',1,\'3-5\');">1Pe 1:3-5</a>) is depicted in one of the most comprehensive and suggestive descriptions of the believer\'s heritage found in the Bible. It is declared to be "incorruptible." The word points to its substance. It is imperishable. In it there is no element of decay. It holds in its heart no germ of death. Like its author, the living God, it is unchangeable and eternal. It is "undefiled." It is not stained by sin nor polluted by crime, either in its acquisition or its possession. Human heritages generally are marred by human wrongs. There is hardly an acre of soil that is not tainted by fraud or violence. The coin that passes from hand to hand is in many instances soiled by guilt. But this of Peter is absolutely pure and holy. It "fadeth not away." It never withers. Ages do not impair its beauty or dim its luster. Its bloom will remain fresh, its fragrance undiminished, forever. Thus our inheritance "is glorious in these respects: it is i
