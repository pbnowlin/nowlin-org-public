 to men, a beginning would need to be taken from the intimations as to the nature of the person of the Messiah in Old Testament prophecy, and an attempt would require to be made to discriminate the exact contribution of each organ of revelation to our knowledge. And were there added to this a desire to ascertain the progress of the apprehension of this mystery by men, there would be demanded a further inquiry into the exact degree of understanding which was brought to the truth revealed at each stage of its revelation. The magnitudes with which such investigations deal, however, are very minute; and the profit to be derived from them is not, in a case like the present, very great. It is, of course, of importance to know how the person of the Messiah was represented in the predictions of the Old Testament; and it is a matter at least of interest to note, for example, the difficulty experienced by our Lord\'s immediate disciples in comprehending all that was involved in His manifestation. But, after all, the constitution of our Lord\'s person is a matter of revelation, not of human thought; and it is preeminently a revelation of the New Testament, not of the Old Testament. And the New Testament is all the product of a single movement, at a single stage of its development, and therefore presents in its fundamental teaching a common character. The whole of the New Testament was written within the limits of about half a century; or, if we except the writings of John, within the narrow bounds of a couple of decades; and the entire body of writings which enter into it are so much of a piece that it may be plausibly represented that they all bear the stamp of a single mind. In its fundamental teaching, the New Testament lends itself, therefore, more readily to what is called dogmatic than to what is called genetic treatment; and we shall penetrate most surely into its essential meaning if we take our start from its clearest and fullest statements, and permit their light to be thrown upon its more incidental allusions. This is peculiarly the case with such a matter as the person of Christ, which is dealt with chiefly incidentally, as a thing already understood by all, and needing only to be alluded to rather than formally expounded. That we may interpret these allusions aright, it is requisite that we should recover from the first the common conception which underlies them all.<P>I. Teaching of Paul.<P>1. <a onClick="return mV(\'Phl\',2,\'5-9\');">Philippians 2:5-9</a>:<P>(1) General Drift of the Passage.<P>We begin, then, with the most didactic of the New Testament writers, the apostle Paul, and with one of the passages in which he most fully intimates his conception of the person of his Lord, <a onClick="return mV(\'Phl\',2,\'5-9\');">Php 2:5-9</a>. Even here, however, Paul is not formally expounding the doctrine of the Person of Christ; he is only alluding to certain facts concerning His person and action perfectly well known to his readers, in order that he may give point to an adduction of Christ\'s example. He is exhorting his readers to unselfishness, such unselfishness as esteems others better than ourselves, and looks not only on our own things but also on those of others. Precisely this unselfishness, he declares, was exemplified by our Lord. He did not look upon His own things but the things of others; that is to say, He did not stand upon His rights, but was willing to forego all that He might justly have claimed for Himself for the good of others. For, says Paul, though, as we all know, in His intrinsic nature He was nothing other than God, yet He did not, as we all know right well, look greedily on His condition of equality with God, but made no account of Himself, taking the form of a servant, being made in the likeness of men; and, being found in fashion as a man, humbled Himself, becoming obedient up to death itself, and that, the death of the cross. The statement is thrown into historical form; it tells the story of Christ\'s life on earth. But it presents His life on earth as a life in all its elements alien to His intrinsic nature, and assumed only in the performance of an unselfish purpose. On earth He lived as a man, and subjected Himself to the common lot of men. But He was not by nature a man, nor was He in His own nature subject to the fortunes of human life. By nature He was God; and He would have naturally lived as became God—\'on an equality with God.\' He became man by a voluntary act, \'taking no account of Himself,\' and, having become man, He voluntarily lived out His human life under the conditions which the fulfillment of His unselfish purpose imposed on Him.<P>(2) Our Lord\'s Intrinsic Deity.<P>The terms in which these great affirmations are made deserve the most careful attention. The language in which our Lord\'s intrinsic Deity is expressed, for example, is probably as strong as any that could be devised. Paul does not say simply, "He was God." He says, "He was in the form of God," employing a turn of speech which throws emphasis upon our Lord\'s possession of the specific quality of God. "Form" is a term which expresses the sum of those characterizing qualities which make a thing the precise thing that it is. Thus, the "form" of a sword (in this case mostly matters of external configuration) is all that makes a given piece of metal specifically a sword, rather than, say, a spade. And "the form of God" is the sum of the characteristics which make the being we call "God," specifically God, rather than some other being—an angel, say, or a man. When our Lord is said to be in "the form of God," therefore, He is declared, in the most express manner possible, to be all that God is, to possess the whole fullness of attributes which make God God. Paul chooses this manner of expressing himself here instinctively, because, in adducing our Lord as our example of self-abnegation; his mind is naturally resting, not on the bare fact that He is God, but on the richness and fullness of His being as God. He was all this, yet He did not look on His own things but on those of others.<P>It should be carefully observed also that in making this great affirmation concerning our Lord, Paul does not throw it distinctively into the past, as if he were describing a mode of being formerly our Lord\'s, indeed, but no longer His because of the action by which He became our example of unselfishness. our Lord, he says, "being," "existing," "subsisting" "in the form of God"—as it is variously rendered. The rendering proposed by the Revised Version margin, "being originally," while right in substance, is somewhat misleading. The verb employed means "strictly \'to be beforehand,\' \'to be already\' so and so" (Blass, Grammar of New Testament Greek, English translation, 244), "to be there and ready," and intimates the existing circumstances, disposition of mind, or, as here, mode of subsistence in which the action to be described takes place. It contains no intimation, however, of the cessation of these circumstances or disposition, or mode of subsistence; and that, the less in a case like the present, where it is cast in a tense (the imperfect) which in no way suggests that the mode of subsistence intimated came to an end in the action described by the succeeding verb (compare the parallels: <a onClick="return mV(\'Luk\',16,14,23);">Lu 16:14,23</a>; <a onClick="return mV(\'Luk\',23,50);">23:50</a>; <a onClick="return mV(\'Act\',2,30);">Ac 2:30</a>; <a onClick="return mV(\'Act\',3,2);">3:2</a>; <a onClick="return mV(\'2Cr\',8,17);">2Co 8:17</a>; <a onClick="return mV(\'2Cr\',12,16);">12:16</a>; <a onClick="return mV(\'Gal\',1,14);">Ga 1:14</a>). Paul is not telling us here, then, what our Lord was once, but rather what He already was, or, better, what in His intrinsic nature He is; he is not describing a past mode of existence of our Lord, before the action he is adducing as an example took place—although the mode of existence he describes was our Lord\'s mode of existence before this action—so much as painting in the background upon which the action adduced may be thrown up into prominence. He is telling us who and what He is who did these things for us, that we may appreciate how great the things He did for us are.<P>(3) No Examination.<P>And here it is important to observe that the whole of the action adduced is thrown up thus against this background—not only its negative description to the effect that our Lord (although all that God is) did not look greedily on His (consequent) being on an equality with God; but its positive description as well, introduced by the "but ...." and that in both of its elements, not merely that to the effect (<a onClick="return mV(\'Phl\',2,7);">Php 2:7</a>) that \'he took no account of himself\' (rendered not badly by the King James Version, He "made himself of no reputation"; but quite misleading by the Revised Version (British and American), He "emptied himself"), but equally that to the effect (<a onClick="return mV(\'Phl\',2,8);">Php 2:8</a>) that "he humbled himself." It is the whole of what our Lord is described as doing in <a onClick="return mV(\'Phl\',2,\'6-8\');">Php 2:6-8</a>, that He is described as doing despite His "subsistence in the form of God." So far is Paul from intimating, therefore, that our Lord laid aside His Deity in entering upon His life on earth, that he rather asserts that He retained His Deity throughout His life on earth, and in the whole course of His humiliation, up to death itself, was consciously ever exercising self-abnegation, living a life which did not by nature belong to Him, which stood in fact in direct contradiction to the life which was naturally His. It is this underlying implication which determines the whole choice of the language in which our Lord\'s earthly life is described. It is because it is kept in mind that He still was "in the form of God," that is, that He still had in possession all that body of characterizing qualities by which God is made God, for example, that He is said to have been made, not man, but "in the likeness of man," to have been found, not man, but "in fashion as a man"; and that the wonder of His servanthood and obedience, the mark of servanthood, is thought of as so great. Though He was truly man, He was much more than man; and Paul would not have his readers imagine that He had become merely man. In other words, Paul does not teach that our Lord was once God but had become instead man; he teaches that though He was God, He had become also man.<P>An impression that Paul means to imply, that in entering upon His earthly life our Lord had laid aside His Deity, may be created by a very prevalent misinterpretation of the central clause of his statement—a misinterpretation unfortunately given currency by the rendering of English Revised Version: "counted it not a prize to be on an equality with God, but emptied himself," varied without improvement in the American Standard Revised Version to: "counted not the being on an equality with God a thing to be grasped, but emptied himself." The former (negative) member of this clause means just: He did not look greedily upon His being on an equality with God; did not "set supreme store" by it (see Lightfoot on the clause). The latter (positive) member of it, however, cannot mean in tithesis to this, that He therefore "emptied himself," divested Himself of this, His being on an equality with God, much less that He "emptied himself," divested Himself of His Deity ("form of God") itself, of which His being on an equality with God is the manifested consequence. The verb here rendered "emptied" is in constant use in a metaphorical sense (so only in the New Testament: <a onClick="return mV(\'Rom\',4,14);">Ro 4:14</a>; <a onClick="return mV(\'1Cr\',1,17);">1Co 1:17</a>; <a onClick="return mV(\'1Cr\',9,15);">9:15</a>; <a onClick="return mV(\'2Cr\',9,3);">2Co 9:3</a>) and cannot here be taken literally. This is already apparent from the definition of the manner in which the "emptying" is said to have been accomplished, supplied by the modal clause which is at once attached: by "taking the form of servant." You cannot "empty" by "taking"—adding. It is equally apparent, however, from the strength of the emphasis which, by its position, is thrown upon the "himself." We may speak of our Lord as "emptying Himself" of something else, but scarcely, with this strength of emphasis, of His "emptying Himself" of something else. This emphatic "Himself," interposed between the preceding clause and the verb rendered "emptied," builds a barrier over which we cannot climb backward in search of that of which our Lord emptied Himself. The whole thought is necessarily contained in the two words, "emptied himself," in which the word "emptied" must therefore be taken in a sense analogous to that which it bears in the other passages in the New Testament where it occurs. Paul, in a word, says here nothing more than that our Lord, who did not look with greedy eyes upon His estate of equality with God, emptied Himself, if the language may be pardoned, of Himself; that is to say, in precise accordance with the exhortation for the enhancement of which His example is adduced, that He did not look on His own things. \'He made no account of Himself,\' we may fairly paraphrase the clause; and thus all question of what He emptied Himself of falls away. What our Lord actually did, according to Paul, is expressed in the following clauses; those now before us express more the moral character of His act. He took "the form of a servant," and so was "made in the likeness of men." But His doing this showed that He did not set overweening store by His state of equality with God, and did not account Himself the sufficient object of all the efforts. He was not self-regarding: He had regard for others. Thus, He becomes our supreme example of self-abnegating conduct.<P>See also <a href="./study/isbe/search.html?string=KENOSIS">KENOSIS</a>.<P>(4) Our Lord\'s Humanity.<P>The language in which the act by which our Lord showed that He was self-abnegating is described, requires to be taken in its complete meaning. He took "the form of a servant, being made in the likeness of men," says Paul. The term "form" here, of course, bears the same full meaning as in the preceding instance of its occurrence in the phrase "the form of God." It imparts the specific quality, the whole body of characteristics, by which a servant is made what we know as a servant, our Lord assumed, then, according to Paul, not the mere state or condition or outward appearance of a servant, but the reality; He became an actual "servant" in the world. The act by which He did this is described as a "taking," or, as it has become customary from this description of it to phrase it, as an "assumption." What is meant is that our Lord took up into His personality a human nature; and therefore it is immediately explained that He took the form of a servant by "being made in the likeness of men." That the apostle does not say, shortly, that He assumed a human nature, is due to the engagement of his mind with the contrast which he wishes to bring out forcibly for the enhancement of his appeal to our Lord\'s example, between what our Lord is by nature and what He was willing to become, not looking on His own things but also on the things of others. This contrast is, no doubt, embodied in the simple opposition of God and man; it is much more pungently expressed in the qualificative terms, "form of God" and "form of a servant." The Lord of the world became a servant in the world; He whose right it was to rule took obedience as His life-characteristic. Naturally therefore Paul employs here a word of quality rather than a word of mere nature; and then defines his meaning in this word of quality by a further epexegetical clause. This further clause—"being made in the likeness of men"—does not throw doubt on the reality of the human nature that was assumed, in contradiction to the emphasis on its reality in the phrase "the form of a servant." It, along with the succeeding clause—"and being found in fashion as a man"—owes its peculiar form, as has already been pointed out, to the vividness of the apostle\'s consciousness, that he is speaking of one who, though really man, possessing all that makes a man a man, is yet, at the same time, infinitely more than a man, no less than God Himself, in possession of all that makes God God. Christ Jesus is in his view, therefore (as in the view of his readers, for he is not instructing his readers here as to the nature of Christ\'s person, but reminding them of certain elements in it for the purposes of his exhortation), both God and man, God who has assumed man into personal union with Himself, and has in this His assumed manhood lived out a human life on earth.<P>2. Other Pauline Passages:<P>The elements of Paul\'s conception of the person of Christ are brought before us in this suggestive passage with unwonted fullness. But they all receive endless illustration from his occasional allusions to them, one or another, throughout his Epistles. The leading motive of this passage, for example, reappears quite perfectly in <a onClick="return mV(\'2Cr\',8,9);">2Co 8:9</a>, where we are exhorted to imitate the graciousness of our Lord Jesus Christ, who became for our sakes (emphatic) poor—He who was (again an imperfect participle, and therefore without suggestion of the cessation of the condition described) rich—that we might by His (very emphatic) poverty be made rich. Here the change in our Lord\'s condition at a point of time perfectly understood between the writer and his readers is adverted to and assigned to its motive, but no further definition is given of the nature of either condition referred to. We are brought closer to the precise nature of the act by which the change was wrought by such a passage as <a onClick="return mV(\'Gal\',4,4);">Ga 4:4</a>. We read that "When the fullness of the time came, God sent forth his Son, born of a woman, born under the law, that he might redeem them that were under the law." The whole transaction is referred to the Father in fulfillment of His eternal plan of redemption, and it is described specifically as an incarnation: the Son of God is born of a woman—He who is in His own nature the Son of God, abiding with God, is sent forth from God in such a manner as to be born a human being, subject to law. The primary implications are that this was not the beginning of His being; but that before this He was neither a man nor subject to law. But there is no suggestion that on becoming man and subject to law, He ceased to be the Son of God or lost anything intimated by that high designation. The uniqueness of His relation to God as His Son is emphasized in a kindred passage (<a onClick="return mV(\'Rom\',8,3);">Ro 8:3</a>) by the heightening of the designation to that of God\'s "own Son," and His distinction from other men is intimated in the same passage by the declaration that God sent Him, not in sinful flesh, but only the likeness of sinful flesh." The reality of our Lord\'s flesh is not thrown into doubt by this turn of speech, but His freedom from the sin which is associated with flesh as it exists in lost humanity is asserted (compare <a onClick="return mV(\'2Cr\',5,21);">2Co 5:21</a>). Though true man, therefore (<a onClick="return mV(\'1Cr\',15,21);">1Co 15:21</a>; <a onClick="return mV(\'Rom\',5,21);">Ro 5:21</a>; <a onClick="return mV(\'Act\',17,31);">Ac 17:31</a>), He is not without differences from other men; and these differences do not concern merely the condition (as sinful) in which men presently find themselves; but also their very origin: they are from below, He from above—\'the first man is from the earth, earthy; the second man is from heaven\' (<a onClick="return mV(\'1Cr\',15,47);">1Co 15:47</a>). This is His peculiarity: He was born of a woman like other men; yet He descended from heaven (compare <a onClick="return mV(\'Eph\',4,9);">Eph 4:9</a>; <a onClick="return mV(\'Jhn\',3,13);">Joh 3:13</a>). It is not meant, of course, that already in heaven He was a man; what is meant is that even though man He derives His origin in an exceptional sense from heaven. Paul describes what He was in heaven (but not alone in heaven)—that is to say before He was sent in the likeness of sinful flesh (though not alone before this)—in the great terms of "God\'s Son," "God\'s own Son," "the form of God," or yet again in words whose import cannot be mistaken, \'God over all\' (<a onClick="return mV(\'Rom\',9,5);">Ro 9:5</a>). In the last cited passage, together with its parallel earlier in the same epistle (<a onClick="return mV(\'Rom\',1,3);">Ro 1:3</a>), the two sides or elements of our Lord\'s person are brought into collocation after a fashion that can leave no doubt of Paul\'s conception of His twofold nature. In the earlier of these passages he tells us that Jesus Christ was born, indeed, of the seed of David according to the flesh, that is, so far as the human side of His being is concerned, but was powerfully marked out as the Son of God according to the Spirit of Holiness, that is, with respect to His higher nature, by the resurrection of the dead, which in a true sense began in His own rising from the dead. In the later of them, he tells us that Christ sprang indeed, as concerns the flesh, that is on the human side of His being, from Israel, but that, despite this earthly origin of His human nature, He yet is and abides (present participle) nothing less than the Supreme God, "God over all (emphatic), blessed forever." Thus Paul teaches us that by His coming forth from God to be born of woman, our Lord, assuming a human nature to Himself, has, while remaining the Supreme God, become also true and perfect man. Accordingly, in a context in which the resources of language are strained to the utmost to make the exaltation of our Lord\'s being clear—in which He is described as the image of the invisible God, whose being antedates all that is created, whom, through whom and to whom all things have been created, and in whom they all subsist—we are told not only that (naturally) in Him all the fulhess dwells (<a onClick="return mV(\'Col\',1,19);">Col 1:19</a>), but, with complete explication, that \'all the fullness of the Godhead dwells in him bodily\' (<a onClick="return mV(\'Col\',2,9);">Col 2:9</a>); that is to say, the very Deity of God, that which makes God God, in all its completeness, has its permanent home in our Lord, and that in a "bodily fashion," that is, it is in Him clothed with a body. He who looks upon Jesus Christ sees, no doubt, a body and a man; but as he sees the man clothed with the body, so he sees God Himself, in all the fullness of His Deity clothed with the humanity. Jesus Christ is therefore God "manifested in the flesh" (<a onClick="return mV(\'1Ti\',3,16);">1Ti 3:16</a>), and His appearance on earth is an "epiphany" (<a onClick="return mV(\'2Ti\',1,10);">2Ti 1:10</a>), which is the technical term for manifestations on earth of a God. Though truly man, He is nevertheless also our "great God" (<a onClick="return mV(\'Tts\',2,13);">Tit 2:13</a>).<P>II. Teaching of the Epistle to the Hebrews.<P>The conception of the person of Christ which underlies and finds expression in the Epistle to the Hebrews is indistinguishable from that which governs all the allusions to our Lord in the Epistles of Paul. To the author of this epistle our Lord is above all else the Son of God in the most eminent sense of that word; and it is the divine dignity and majesty belonging to Him from His very nature which forms the fundamental feature of the image of Christ which stands before his mind. And yet it is this author who, perhaps above all others of the New Testament writers, emphasizes the truth of the humanity of Christ, and dwells with most particularity upon the elements of His human nature and experience.<P><a onClick="return mV(\'Hbr\',2,1);">Hebrews 2:1</a>ff:<P>(1) Background of Express Deity.<P>The great Christological passage which fills <a onClick="return mV(\'Hbr\',2,\'1-\');">Hebrews 2</a> of the Epistle to the Hebrews rivals in its richness and fullness of detail, and its breadth of implication, that of <a onClick="return mV(\'Phl\',2,\'1-\');">Philippians 2</a>. It is thrown up against the background of the remarkable exposition of the divine dignity of the Son which occupies <a onClick="return mV(\'Hbr\',1,\'1-\');">Hebrews 1</a> (notice the "therefore" of <a onClick="return mV(\'Hbr\',2,1);">2:1</A>). There the Son had been declared to be "the effulgence of his (God\'s) glory, and the very image of his substance," through whom the universe has been created and by the word of whose power all things are held in being; and His exaltation above the angels, by means of whom the Old Covenant had been inaugurated, is measured by the difference between the designations "ministering spirits" proper to the one, and the Son of God, nay, God itself (<a onClick="return mV(\'Hbr\',1,8,9);">1:8,9</A>), proper to the other. The purpose of the succeeding statement is to enhance in the thought of the Jewish readers of the epistle the value of the salvation wrought by this divine Saviour, by removing from their minds the offense they were in danger of taking at His lowly life and shameful death on earth. This earthly humiliation finds its abundant justification, we are told, in the greatness of the end which it sought and attained. By it our Lord has, with His strong feet, broken out a pathway along which, in Him, sinful man may at length climb up to the high destiny which was promised him when it was declared he should have dominion over all creation. Jesus Christ stooped only to conquer, and He stooped to conquer not for Himself (for He was in His own person no less than God), but for us.<P>(2) Completeness of Humanity.<P>The language in which the humiliation of the Son of God is in the first instance described is derived from the context. The establishment of His divine majesty in chapter <a onClick="return mV(\'Hbr\',1,\'1-\');">1</A> had taken the form of an exposition of His infinite exaltation above the angels, the highest of all creatures. His humiliation is described here therefore as being "made a little lower than the angels" (<a onClick="return mV(\'Hbr\',2,9);">Heb 2:9</a>). What is meant is simply that He became man; the phraseology is derived from <a onClick="return mV(\'Psa\',8,\'1-\');">Ps 8</a> the King James Version, from which had just been cited the declaration that God had made man (despite his insignificance) "but a little lower than the angels," thus crowning him with glory and honor. The adoption of the language of the psalm to describe our Lord\'s humiliation has the secondary effect, accordingly, of greatly enlarging the reader\'s sense of the immensity of the humiliation of the Son of God in becoming man: He descended an infinite distance to reach man\'s highest conceivable exaltation. As, however, the primary purpose of the adoption of the language is merely to declare that the Son of God became man, so it is shortly afterward explained (<a onClick="return mV(\'Hbr\',2,14);">Heb 2:14</a>) as an entering into participation in the blood and flesh which are common to men: "Since then the children are sharers in flesh and blood, he also himself in like manner partook of the same." The voluntariness, the reality the completeness of the assumption of humanity by the Son of God, are all here emphasized.<P>The proximate end of our Lord\'s assumption of humanity is declared to be that He might die; He was "made a little lower than the angels...because of the suffering of death" (<a onClick="return mV(\'Hbr\',2,9);">Heb 2:9</a>); He took part in blood and flesh in order that through death ...."(<a onClick="return mV(\'Hbr\',2,14);">Heb 2:14</a>). The Son of God as such could not die; to Him belongs by nature an "indissoluble life" (<a onClick="return mV(\'Hbr\',7,16);">Heb 7:16</a> margin). If He was to die, therefore, He must take to Himself another nature to which the experience of death were not impossible (<a onClick="return mV(\'Hbr\',2,17);">Heb 2:17</a>). Of course it is not meant that death was desired by Him for its own sake. The purpose of our passage is to save its Jewish readers from the offense of the death of Christ. What they are bidden to observe is, therefore, Jesus, who was made a little lower than the angels because of the suffering of death, \'crowned with glory and honor, that by the grace of God the bitterness of death which he tasted might redound to the benefit of every man\' (<a onClick="return mV(\'Hbr\',2,9);">Heb 2:9</a>), and the argument is immediately pressed home that it was eminently suitable for God Almighty, in bringing many sons into glory, to make the Captain of their salvation perfect (as a Saviour) by means of suffering. The meaning is that it was only through suffering that these men, being sinners could be brought into glory. And therefore in the plainer statement of <a onClick="return mV(\'Hbr\',2,14);">Heb 2:14</a> we read that our Lord took part in flesh and blood in order "that through death he might bring to nought him that had the power of death, that is, the Devil; and might deliver all them who through fear of death were all their lifetime subject to bondage"; and in the still plainer statement of <a onClick="return mV(\'Hbr\',2,17);">2:17</a> that the ultimate object of His assimilation to men was that He might "make propitiation for the sins of the people." It is for the salvation of sinners that our Lord has come into the world; but, as that salvation can be wrought only by suffering and death, the proximate end of His assumption of humanity remains that He might die; whatever is more than this gathers around this.<P>The completeness of our Lord\'s assumption of humanity and of His identification of Himself with it receives strong emphasis in this passage. He took part in the flesh and blood which is the common heritage of men, after the same fashion that other men participate in it (<a onClick="return mV(\'Hbr\',2,14);">Heb 2:14</a>); and, having thus become a man among men, He shared with other men the ordinary circumstances and fortunes of life, "in all things" (<a onClick="return mV(\'Hbr\',2,17);">Heb 2:17</a>). The stress is laid on trials, sufferings, death; but this is due to the actual course in which His life ran—and that it might run in which He became man—and is not exclusive of other human experiences. What is intended is that He became truly a man, and lived a truly human life, subject to all the experiences natural to a man in the particular circumstances in which He lived.<P>(3) Continued Possession of Deity.<P>It is not implied, however, that during this human life—"the days of his flesh" (<a onClick="return mV(\'Hbr\',5,7);">Heb 5:7</a>)—He had ceased to be God, or to have at His disposal the attributes which belonged to Him as God. That is already excluded by the representations of <a onClick="return mV(\'Hbr\',1,\'1-\');">Hebrews 1</a>. The glory of this dispensation consists precisely in the bringing of its revelations directly by the divine Son rather than by mere prophets (<a onClick="return mV(\'Hbr\',1,1);">1:1</A>), and it was as the effulgence of God\'s glory and the express image of His substance, upholding the universe by the word of His power, that this Son made purification of sins (<a onClick="return mV(\'Hbr\',1,3);">1:3</A>). Indeed, we are expressly told that even in the days of the flesh, He continued still a Son (<a onClick="return mV(\'Hbr\',5,8);">5:8</a>), and that it was precisely in this that the wonder lay: that though He was and remained (imperfect participle) a Son, He yet learned the obedience He had set Himself to (compare <a onClick="return mV(\'Phl\',2,8);">Php 2:8</a>) by the things which He suffered. Similarly, we are told not only that, though an Israelite of the tribe of Judah, He possessed "the power of an indissoluble life" (<a onClick="return mV(\'Hbr\',7,16);">Heb 7:16</a> margin), but, describing that higher nature which gave Him this power as an "eternal Spirit" (compare "spirit of holiness," <a onClick="return mV(\'Rom\',1,4);">Ro 1:4</a>), that it was through this eternal Spirit that He could offer Himself without blemish unto God, a real and sufficing sacrifice, in contrast with the shadows of the Old Covenant (<a onClick="return mV(\'Hbr\',9,14);">Heb 9:14</a>). Though a man, therefore, and truly man, sprung out of Judah (<a onClick="return mV(\'Hbr\',7,14);">Heb 7:14</a>), touched with the feeling of human infirmities (<a onClick="return mV(\'Hbr\',4,15);">Heb 4:15</a>), and tempted like as we are, He was not altogether like other men. For one thing, He was "without sin" (<a onClick="return mV(\'Hbr\',4,15);">Heb 4:15</a>; <a onClick="return mV(\'Hbr\',7,26);">7:26</a>), and, by this characteristic, He was, in every sense of the words, separated from sinners. Despite the completeness of His identification with men, He remained, therefore, even in the days of His flesh different from them and above them.<P>III. Teaching of Other Epistles.<P>It is only as we carry this conception of the person of our Lord with us—the conception of Him as at once our Supreme Lord, to whom our adoration is due, and our fellow in the experiences of a human life—that unity is induced in the multiform allusions to Him throughout, whether the Epistles of Paul or the Epistle to the Hebrews, or, indeed, the other epistolary literature of the New Testament. For in this matter there is no difference between those and these. There are no doubt a few passages in these other letters in which a plurality of the elements of the person of Christ are brought together and given detailed mention. In <a onClick="return mV(\'1Pe\',3,18);">1Pe 3:18</a>, for instance, the two constitutive elements of His person are spoken of in the contrast, familiar from Paul, of the "flesh" and the "spirit." But ordinarily we meet only with references to this or that element separately. Everywhere our Lord is spoken of as having lived out His life as a man; but everywhere also He is spoken of with the supreme reverence which is due to God alone, and the very name of God is not withheld from Him. In <a onClick="return mV(\'1Pe\',1,11);">1Pe 1:11</a> His pre-existence is taken for granted; in <a onClick="return mV(\'Jam\',2,1);">Jas 2:1</a> He is identified with the Shekinah, the manifested Yahweh—\'our Lord Jesus Christ, the Glory\'; in Jude verse 4 He is "our only Master (Despot) and Lord"; over and over again He is the divine Lord who is Yahweh (e.g. <a onClick="return mV(\'1Pe\',2,3,13);">1Pe 2:3,13</a>; <a onClick="return mV(\'2Pe\',3,2,18);">2Pe 3:2,18</a>); in <a onClick="return mV(\'2Pe\',1,1);">2Pe 1:1</a>, He is roundly called "our God and Saviour." There is nowhere formal inculcation of the entire doctrine of the person of Christ. But everywhere its elements, now one and now another, are presupposed as the common property of writer and readers. It is only in the Epistles of John that this easy and unstudied presupposition of them gives way to pointed insistence upon them.``187';
isbe[6833]='Person of Christ, 4-5`IV. Teaching of John.<P>1. The Epistles:<P>In the circumstances in which he wrote, John found it necessary to insist upon the elements of the person of our Lord—His true Deity, His true humanity and the unity of His person—in a manner which is more didactic in form than anything we find in the other writings in form than anything we find in the other writings of New Testament. The great depository of his teaching on the subject is, of course, the prologue to his Gospel. But it is not merely in this prologue, nor in the Gospel to which it forms a fitting introduction, that these didactic statements are found. The full emphasis of John\'s witness to the twofold nature of the Lord is brought out, indeed, only by combining what he says in the Gospel and in the Epistles. "In the Gospel," remarks Westcott (on <a onClick="return mV(\'Jhn\',20,31);">Joh 20:31</a>), "the evangelist shows step by step that the historical Jesus was the Christ, the Son of God (opposed to mere \'flesh\'); in the Epistle he reaffirms that the Christ, the Son of God, was true man (opposed to mere \'spirit\'; <a onClick="return mV(\'1Jo\',4,2);">1Joh 4:2</a>)." What John is concerned to show throughout is that it was "the true God" (<a onClick="return mV(\'1Jo\',5,20);">1Joh 5:20</a>) who was "made flesh" (<a onClick="return mV(\'Jhn\',1,14);">Joh 1:14</a>); and that this \'only God\' (<a onClick="return mV(\'Jhn\',1,18);">Joh 1:18</a>, the Revised Version margin "God only begotten") has truly come "in...flesh" (<a onClick="return mV(\'1Jo\',4,2);">1Joh 4:2</a>). In all the universe there is no other being of whom it can be said that He is God come in flesh (compare <a onClick="return mV(\'2Jo\',1,7);">2Joh 1:7</a>, He that "cometh in the flesh," whose characteristic this is). And of all the marvels which have ever occurred in the marvelous history of the universe, this is the greatest—that \'what was from the beginning\' (<a onClick="return mV(\'1Jo\',2,13,14);">1Joh 2:13,14</a>) has been heard and gazed upon, seen and handled by men (<a onClick="return mV(\'1Jo\',1,1);">1Joh 1:1</a>).<P>2. Prologue to the Gospel:<P>From the point of view from which we now approach it, the prologue to the Gospel of John may be said to fall into three parts. In the first of these, the nature of the Being who became incarnate in the person we know as Jesus Christ is described; in the second, the general nature of the act we call the incarnation; and in the third, the nature of the incarnated person.<P>See <a href="./study/isbe/search.html?string=JOHANNINE+THEOLOGY">JOHANNINE THEOLOGY, III</a>; <a href="./study/isbe/search.html?string=JOHN,+GOSPEL+OF">JOHN, GOSPEL OF, IV, 1, (3), 2.</a><P>(1) The Being Who Was Incarnated.<P>John here calls the person who became incarnate by a name peculiar to himself in the New Testament—the Logos or "Word." According to the predicates which he here applies to Him, he can mean by the "Word" nothing else but God Himself, "considered in His creative, operative, self-revealing, and communicating character," the sum total of what is divine (C.F. Schmid). In three crisp sentences he declares at the outset His eternal subsistence, His eternal intercommunion with God, His eternal identity with God: \'In the beginning the Word was; and the Word was with God; and the Word was God\' (<a onClick="return mV(\'Jhn\',1,1);">Joh 1:1</a>). "In the beginning," at that point of time when things first began to be (<a onClick="return mV(\'Gen\',1,1);">Ge 1:1</a>), the Word already "was." He antedates the beginning of all things. And He not merely antedates them, but it is immediately added that He is Himself the creator of all that is: \'All things were made by him, and apart from him was not made one thing that hath been made\' (<a onClick="return mV(\'Jhn\',1,3);">Joh 1:3</a>). Thus He is taken out of the category of creatures altogether. Accordingly, what is said of Him is not that He was the first of existences to come into being—that \'in the beginning He already had come into being\'—but that \'in the beginning, when things began to come into being, He already was.\' It is express eternity of being that is asserted: "the imperfect tense of the original suggests in this relation, as far as human language can do so, the notion of absolute, supra-temporal existence" (Westcott). This, His eternal subsistence, was not, however, in isolation: "And the Word was with God." The language is pregnant. It is not merely coexistence with God that is asserted, as of two beings standing side by side, united in a local relation, or even in a common conception. What is suggested is an active relation of intercourse. The distinct personality of the Word is therefore not obscurely intimatead. From all eternity the Word has been with God as fellow: He who in the very beginning already "was," "was" also in communion with God. Though He was thus in some sense a second along with God, He was nevertheless not a separate being from God: "And the Word was"—still the eternal "was"—"God." In some sense distinguishable from God, He was in an equally true sense identical with God. There is but one eternal God; this eternal God, the Word is; in whatever sense we may distinguish Him from the God whom He is "with," He is yet not another than this God, but Himself is this God. The predicate "God" occupies the position of emphasis in this great declaration, and is so placed in the sentence as to be thrown up in sharp contrast with the phrase "with God," as if to prevent inadequate inferences as to the nature of the Word being drawn even momentarily from that phrase. John would have us realize that what the Word was in eternity was not merely God\'s coeternal fellow, but the eternal God\'s self.<P>(2) The Incarnation.<P>Now, John tells us that it was this Word, eternal in His subsistence, God\'s eternal fellow, the eternal God\'s self, that, as "come in the flesh," was Jesus Christ (<a onClick="return mV(\'1Jo\',4,2);">1Joh 4:2</a>). "And the Word became flesh" (<a onClick="return mV(\'Jhn\',1,14);">Joh 1:14</a>), he says. The terms he employs here are not terms of substance, but of personality. The meaning is not that the substance of God was transmuted into that substance which we call "flesh." "The Word" is a personal name of the eternal God; "flesh" is an appropriate designation of humanity in its entirety, with the implications of dependence and weakness. The meaning, then, is simply that He who had just been described as the eternal God became, by a voluntary act in time, a man. The exact nature of the act by which He "became" man lies outside the statement; it was matter of common knowledge between the writer and the reader. The language employed intimates merely that it was a definite act, and that it involved a change in the life-history of the eternal God, here designated "the Word." The whole emphasis falls on the nature of this change in His life-history. He became flesh. That is to say, He entered upon a mode of existence in which the experiences that belong to human beings would also be His. The dependence, the weakness, which constitute the very idea of flesh, in contrast with God, would now enter into His personal experience. And it is precisely because these are the connotations of the term "flesh" that John chooses that term here, instead of the more simply denotative term "man." What he means is merely that the eternal God became man. But he elects to say this in the language which throws best up to view what it is to become man. The contrast between the Word as the eternal God and the human nature which He assumed as flesh, is the hinge of the statement. Had the evangelist said (as he does in <a onClick="return mV(\'1Jo\',4,2);">1Joh 4:2</a>) that the Word \'came in flesh,\' it would have been the continuity through the change which would have been most emphasized. When he says rather that the Word became flesh, while the continuity of the personal subject is, of course, intimatead, it is the reality and the completeness of the humanity assumed which is made most prominent.<P>(3) The Incarnated Person.<P>That in becoming flesh the Word did not cease to be what He was before entering upon this new sphere of experiences, the evangelist does not leave, however, to mere suggestion. The glory of the Word was so far from quenched, in his view, by His becoming flesh, that he gives us at once to understand that it was rather as "trailing clouds of glory" that He came. "And the Word became flesh," he says, and immediately adds: "and dwelt among us (and we beheld his glory, glory as of the only begotten from the Father), full of grace and truth" (<a onClick="return mV(\'Jhn\',1,14);">Joh 1:14</a>). The language is colored by reminiscences from the Tabernacle, in which the Glory of God, the Shekinah, dwelt. The flesh of our Lord became, on its assumption by the Word, the Temple of God on earth (compare <a onClick="return mV(\'Jhn\',2,19);">Joh 2:19</a>), and the glory of the Lord filled the house of the Lord. John tells us expressly that this glory was visible, that it was precisely what was appropriate to the Son of God as such. "And we beheld his glory," he says; not divined it, or inferred it, but perceived it. It was open to sight, and the actual object of observation. Jesus Christ was obviously more than man; He was obviously God. His actually observed glory, John tells us further, was a "glory as of the only begotten from the Father." It was unique; nothing like it was ever seen in another. And its uniqueness consisted precisely in its consonance with what the unique Son of God, sent forth from the Father, would naturally have; men recognized and could not but recognize in Jesus Christ the unique Son of God. When this unique Son of God is further described as "full of grace and truth," the elements of His manifested glory are not to be supposed to be exhausted by this description (compare <a onClick="return mV(\'Jhn\',2,11);">Joh 2:11</a>). Certain items of it only are singled out for particular mention. The visible glory of the incarnated Word was such a glory as the unique Son of God, sent forth from the Father, who was full of grace and truth, would naturally manifest.<P>That nothing should be lacking to the declaration of the continuity of all that belongs to the Word as such into this new sphere of existence, and its full manifestation through the veil of His flesh, John adds at the close of his exposition the remarkable sentence: \'As for God, no one has even yet seen him; God only begotten, who is in the bosom of the Father—he hath declared him\' (<a onClick="return mV(\'Jhn\',1,18);">Joh 1:18</a> margin). It is the incarnate Word which is here called \'only begotten God.\' The absence of the article with this designation is doubtless due to its parallelism with the word "God" which stands at the head of the corresponding clause. The effect of its absence is to throw up into emphasis the quality rather than the mere individuality of the person so designated. The adjective "only begotten" conveys the idea, not of derivation and subordination, but of uniqueness and consubstantiality: Jesus is all that God is, and He alone is this. Of this \'only begotten God\' it is now declared that He "is"—not "was," the state is not one which has been left behind at the incarnation, but one which continues uninterrupted and unmodified—"into"—not merely "in"—"the bosom of the Father"—that is to say, He continues in the most intimate and complete communion with the Father. Though now incarnate, He is still "with God" in the full sense of the external relation intimated in <a onClick="return mV(\'Jhn\',1,1);">Joh 1:1</a>. This being true, He has much more than seen God, and is fully able to "interpret" God to men. Though no one has ever yet seen God, yet he who has seen Jesus Christ, "God only begotten," has seen the Father (compare <a onClick="return mV(\'Jhn\',14,9);">Joh 14:9</a>; <a onClick="return mV(\'Jhn\',12,45);">12:45</a>). In this remarkable sentence there is asserted in the most direct manner the full Deity of the incarnate Word, and the continuity of His life as such in His incarnate life; thus He is fitted to be the absolute revelation of God to man.<P>3. The Gospel:<P>This condensed statement of the whole doctrine of the incarnation is only the prologue to a historical treatise. The historical treatise which it introduces, naturally, is written from the point of view of its prologue. Its object is to present Jesus Christ in His historical manifestation, as obviously the Son of God in flesh. "These are written," the Gospel testifies, "that ye may believe that Jesus is the Christ, the Son of God" (<a onClick="return mV(\'Jhn\',20,31);">Joh 20:31</a>); that Jesus who came as a man (<a onClick="return mV(\'Jhn\',1,30);">Joh 1:30</a>) was thoroughly known in His human origin (<a onClick="return mV(\'Jhn\',7,27);">Joh 7:27</a>), confessed Himself man (<a onClick="return mV(\'Jhn\',8,40);">Joh 8:40</a>), and died as a man dies (<a onClick="return mV(\'Jhn\',19,5);">Joh 19:5</a>), was, nevertheless, not only the Messiah, the Sent of God, the fulfiller of all the divine promises of redemption, but also the very Son of God, that God only begotten, who, abiding in the bosom of the Father, is His sole adequate interpreter. From the beginning of the Gospel onward, this purpose is pursued: Jesus is pictured as ever, while truly man, yet manifesting Himself as equally truly God, until the veil which covered the eyes of His followers was wholly lifted, and He is greeted as both Lord and God (<a onClick="return mV(\'Jhn\',20,28);">Joh 20:28</a>). But though it is the prime purpose of this Gospel to exhibit the divinity of the man Jesus, no obscuration of His manhood is involved. It is the Deity of the man Jesus which is insisted on, but the true manhood of Jesus is as prominent in the representation as in any other portion of the New Testament. Nor is any effacement of the humiliation of His earthly life involved. For the Son of man to come from heaven was a descent (<a onClick="return mV(\'Jhn\',3,13);">Joh 3:13</a>), and the mission which He came to fulfill was a mission of contest and conflict, of suffering and death. He brought His glory with Him (<a onClick="return mV(\'Jhn\',1,14);">Joh 1:14</a>), but the glory that was His on earth (<a onClick="return mV(\'Jhn\',17,22);">Joh 17:22</a>) was not all the glory which He had had with the Father before the world was, and to which, after His work was done, He should return (<a onClick="return mV(\'Jhn\',17,5);">Joh 17:5</a>). Here too the glory of the celestial is one and the glory of the terrestrial is another. In any event, John has no difficulty in presenting the life of our Lord on earth as the life of God in flesh, and in insisting at once on the glory that belongs to Him as God and on the humiliation which is brought to Him by the flesh. It is distinctly a duplex life which he ascribes to Christ, and he attributes to Him without embarrassment all the powers and modes of activity appropriate on the one hand to Deity and on the other to sinless (<a onClick="return mV(\'Jhn\',8,46);">Joh 8:46</a>; compare <a onClick="return mV(\'Jhn\',14,30);">Joh 14:30</a>; <a onClick="return mV(\'1Jo\',3,5);">1Joh 3:5</a>) human nature. In a true sense his portrait of our Lord is a dramatization of the God-man which he presents to our contemplation in his prologue. V. Teaching of the Synoptic Gospels.<P>The same may be said of the other Gospels. They are all dramatizations of the God-man set forth in thetical exposition in the prologue to John\'s Gospel. The Gospel of Luke, written by a known companion of Paul, gives us in a living narrative the same Jesus who is presupposed in all Paul\'s allusions to Him. That of Mark, who was also a companion of Paul, as also of Peter, is, as truly as the Gospel of John itself, a presentation of facts in the life of Jesus with a view to making it plain that this was the life of no mere man, human as it was, but of the Son of God Himself. Matthew\'s Gospel differs from its fellows mainly in the greater richness of Jesus\' own testimony to His Deity which it records. What is characteristic of all three is the inextricable interlacing in their narratives of the human and divine traits which alike marked the life they are depicting. It is possible, by neglecting one series of their representations and attending only to the other, to sift out from them at will the portrait of either a purely divine or a purely human Jesus. It is impossible to derive from them the portrait of any other than a divine-human Jesus if we surrender ourselves to their guidance and take off of their pages the portrait they have endeavored to draw. As in their narratives they cursorily suggest now the fullness of His Deity and now the completeness of His humanity and everywhere the unity of His person, they present as real and as forcible a testimony to the constitution of our Lord\'s person as uniting in one personal life a truly divine and a truly human nature, as if they announced this fact in analytical statement. Only on the assumption of this conception of our Lord\'s person as underlying and determining their presentation, can unity be given to their representations; while, on this supposition, all their representations fall into their places as elements in one consistent whole. Within the limits of their common presupposition, each Gospel has no doubt its own peculiarities in the distribution of its emphasis. Mark lays particular stress on the divine power of the man Jesus, as evidence of His supernatural being; and on the irresistible impression of a veritable Son of God, a Divine Being walking the earth as a man, which He made upon all with whom He came into contact. Luke places his Gospel by the side of the Epistle to the Hebrews in the prominence it gives to the human development of the Divine Being whose life on earth it is depicting and to the range of temptation to which He was subjected. Matthew\'s Gospel is notable chiefly for the heights of the divine self-consciousness which it uncovers in its report of the words of Him whom it represents as nevertheless the Son of David, the Son of Abraham; heights of divine self-consciousness which fall in nothing short of those attained in the great utterances preserved for us by John. But amid whatever variety there may exist in the aspects on which each lays his particular emphasis, it is the same Jesus Christ which all three bring before us, a Jesus Christ who is at once God and man and one individual person. If that be not recognized, the whole narrative of the Synoptic Gospels is thrown into confusion; their portrait of Christ becomes an insoluble puzzle; and the mass of details which they present of His life-experiences is transmuted into a mere set of crass contradictions.`<a href="./study/isbe/search.html?string=GOSPELS,+THE+SYNOPTIC">GOSPELS, THE SYNOPTIC</a>`187';
isbe[6834]='Person of Christ, 4-8`VI. Teaching of Jesus.<P>1. The Johannine Jesus:<P>The Gospel narratives not only present us, however, with dramatizations of the God-man, according to their authors\' conception of His composite person. They preserve for us also a considerable body of the utterances of Jesus Himself, and this enables us to observe the conception of His person which underlay and found expression in our Lord\'s own teaching. The discourses of our Lord which have been selected for record by John have been chosen (among other reasons) expressly for the reason that they bear witness to His essential Deity. They are accordingly peculiarly rich in material for forming a judgment of our Lord\'s conception of His higher nature. This conception, it is needless to say, is precisely that which John, taught by it, has announced in the prologue to his Gospel, and has illustrated by his Gospel itself, compacted as it is of these discourses. It will not be necessary to present the evidence for this in its fullness. It will be enough to point to a few characteristic passages, in which our Lord\'s conception of His higher nature finds especially clear expression.<P>(1) His Higher Nature.<P>That He was of higher than earthly origin and nature, He repeatedly asserts. "Ye are from beneath," he says to the Jews (<a onClick="return mV(\'Jhn\',8,23);">Joh 8:23</a>), "I am from above: ye are of this world; I am not of this world" (compare <a onClick="return mV(\'Jhn\',17,16);">Joh 17:16</a>). Therefore, He taught that He, the Son of Man, had "descended out of heaven" (<a onClick="return mV(\'Jhn\',3,13);">Joh 3:13</a>), where was His true abode. This carried with it, of course, an assertion of pre-existence; and this pre-existence is explicitly affirmed: "What then," He asks, "if ye should behold the Son of man ascending where he was before?" (<a onClick="return mV(\'Jhn\',6,62);">Joh 6:62</a>). It is not merely pre-existence, however, but eternal pre-existence which He claims for Himself: "And now, Father," He prays (<a onClick="return mV(\'Jhn\',17,5);">Joh 17:5</a>), "glorify thou me with thine own self with the glory which I had with thee before the world was" (compare <a onClick="return mV(\'Jhn\',17,24);">Joh 17:24</a>); and again, as the most impressive language possible, He declares (<a onClick="return mV(\'Jhn\',8,58);">Joh 8:58</a> the King James Version): "Verily, verily, I say unto you, Before Abraham was, I am," where He claims for Himself the timeless present of eternity as His mode of existence. In the former of these two last cited passages, the character of His pre-existent life is intimated; in it He shared the Father\'s glory from all eternity ("before the world was"); He stood by the Father\'s side as a companion in His glory. He came forth, when He descended to earth, therefore, not from heaven only, but from the very side of God (<a onClick="return mV(\'Jhn\',8,42);">Joh 8:42</a>; <a onClick="return mV(\'Jhn\',17,8);">17:8</a>). Even this, however, does not express the whole truth; He came forth not only from the Father\'s side where He had shared in the Father\'s glory; He came forth out of the Father\'s very being—"I came out from the Father, and am come into the world" (<a onClick="return mV(\'Jhn\',16,28);">Joh 16:28</a>; compare <a onClick="return mV(\'Jhn\',8,42);">Joh 8:42</a>). "The connection described is inherent and essential, and not that of presence or external fellowship" (Westcott). This prepares us for the great assertion: "I and the Father are one" (<a onClick="return mV(\'Jhn\',10,30);">Joh 10:30</a>), from which it is a mere corollary that "He that hath seen me hath seen the Father" (<a onClick="return mV(\'Jhn\',14,9);">Joh 14:9</a>; compare <a onClick="return mV(\'Jhn\',8,19);">Joh 8:19</a>; <a onClick="return mV(\'Jhn\',12,45);">12:45</a>).<P>(2) His Humiliation<P>In all these declarations the subject of the affirmation is the actual person speaking: it is of Himself who stood before men and spoke to them that our Lord makes these immense assertions. Accordingly, when He majestically declared, "I and the Father are" (plurality of persons) "one" (neuter singular, and accordingly, singleness of being), the Jews naturally understood Him to be making Himself, the person then speaking to them, God (<a onClick="return mV(\'Jhn\',10,33);">Joh 10:33</a>; compare <a onClick="return mV(\'Jhn\',5,18);">Joh 5:18</a>; <a onClick="return mV(\'Jhn\',19,7);">19:7</a>). The continued sameness of the person who has been, from all eternity down to this hour, one with God, is therefore fully safeguarded. His earthly life is, however, distinctly represented as a humiliation. Though even on earth He is one with the Father, yet He "descended" to earth; He had come out from the Father and out of God; a glory had been left behind which was yet to be returned to, and His sojourn on earth was therefore to that extent an obscuration of His proper glory. There was a sense, then, in which, because He had "descended," He was no longer equal with the Father. It was in order to justify an assertion of equality with the Father in power (<a onClick="return mV(\'Jhn\',10,25,29);">Joh 10:25,29</a>) that He was led to declare: "I and my Father are one" (<a onClick="return mV(\'Jhn\',10,30);">Joh 10:30</a>). But He can also declare "The Father is greater than I" (<a onClick="return mV(\'Jhn\',14,28);">Joh 14:28</a>). Obviously this means that there was a sense in which He had ceased to be equal with the Father, because of the humiliation of His present condition, and in so far as this humiliation involved entrance into a status lower than that which belonged to Him by nature. Precisely in what this humiliation consisted can be gathered only from the general, implication of many statements. In it He was a "man": \'a man who hath told you the truth, which I have heard from God\' (<a onClick="return mV(\'Jhn\',8,40);">Joh 8:40</a>), where the contrast with "God" throws the assertion of humanity into emphasis (compare <a onClick="return mV(\'Jhn\',10,33);">Joh 10:33</a>). The truth of His human nature is, however, everywhere assumed and endlessly illustrated, rather than explicitly asserted. He possessed a human soul (<a onClick="return mV(\'Jhn\',11,27);">Joh 11:27</a>) and bodily parts (flesh and blood, <a onClick="return mV(\'Jhn\',6,53);">Joh 6:53</a>ff; hands and side, <a onClick="return mV(\'Jhn\',20,27);">20:27</a>); and was subject alike to physical affections (weariness, <a onClick="return mV(\'Jhn\',4,6);">Joh 4:6</a>, and thirst, <a onClick="return mV(\'Jhn\',19,28);">19:28</a>, suffering and death), and to all the common human emotions—not merely the love of compassion (<a onClick="return mV(\'Jhn\',13,34);">Joh 13:34</a>; <a onClick="return mV(\'Jhn\',14,21);">14:21</a>; <a onClick="return mV(\'Jhn\',15,\'8-13\');">15:8-13</a>), but the love of simple affection which we pour out on "friends" (<a onClick="return mV(\'Jhn\',11,11);">Joh 11:11</a>; compare <a onClick="return mV(\'Jhn\',15,14,15);">Joh 15:14,15</a>), indignation (<a onClick="return mV(\'Jhn\',11,33,38);">Joh 11:33,38</a>) and joy (<a onClick="return mV(\'Jhn\',15,11);">Joh 15:11</a>; <a onClick="return mV(\'Jhn\',17,13);">17:13</a>). He felt the perturbation produced by strong excitement (<a onClick="return mV(\'Jhn\',11,33);">Joh 11:33</a>; <a onClick="return mV(\'Jhn\',11,27);">11:27</a>; <a onClick="return mV(\'Jhn\',13,21);">13:21</a>), the sympathy with suffering which shows itself in tears (<a onClick="return mV(\'Jhn\',11,35);">Joh 11:35</a>), the thankfulness which fills the grateful heart (<a onClick="return mV(\'Jhn\',6,11,23);">Joh 6:11,23</a>; <a onClick="return mV(\'Jhn\',11,41);">11:41</a>; <a onClick="return mV(\'Jhn\',16,27);">16:27</a>). Only one human characteristic was alien to Him: He was without sin: "the prince of the world," He declared, "hath nothing in me" (<a onClick="return mV(\'Jhn\',14,30);">Joh 14:30</a>; compare <a onClick="return mV(\'Jhn\',8,46);">Joh 8:46</a>). Clearly our Lord, as reported by John, knew Himself to be true God and true man in one indivisible person, the common subject of the qualities which belong to each.<P>2. The Synoptic Jesus:<P>(1) His Deity.<P>(a) <a onClick="return mV(\'Mar\',13,32);">Mark 13:32</a>:<P>The same is true of His self-consciousness as revealed in His sayings recorded by the synoptists. Perhaps no more striking illustration of this could be adduced than the remarkable declaration recorded in <a onClick="return mV(\'Mar\',13,32);">Mr 13:32</a> (compare <a onClick="return mV(\'Mat\',24,36);">Mt 24:36</a>): \'But of that day or that hour knoweth no one, not even the angels in heaven, nor yet the Son, but the Father.\' Here Jesus places Himself, in an ascending scale of being, above "the angels in heaven," that is to say, the highest of all creatures, significantly marked here as supramundane. Accordingly, He presents Himself elsewhere as the Lord of the angels, whose behests they obey: "The Son of man shall send forth his angels, and they shall gather out of his kingdom all things that cause stumbling, and them that do iniquity" (<a onClick="return mV(\'Mat\',13,41);">Mt 13:41</a>), "And he shall send forth his angels with a great sound of a trumpet, and they shall gather together his elect from the four winds, from one end of heaven to the other" (<a onClick="return mV(\'Mat\',24,31);">Mt 24:31</a>; compare <a onClick="return mV(\'Mat\',13,49);">Mt 13:49</a>; <a onClick="return mV(\'Mat\',25,31);">25:31</a>; <a onClick="return mV(\'Mar\',8,38);">Mr 8:38</a>).Thus the "angels of God" (<a onClick="return mV(\'Luk\',12,8,9);">Lu 12:8,9</a>; <a onClick="return mV(\'Luk\',15,10);">15:10</a>) Christ designates as His angels, the "kingdom of God" (<a onClick="return mV(\'Mat\',12,28);">Mt 12:28</a>; <a onClick="return mV(\'Mat\',19,24);">19:24</a>; <a onClick="return mV(\'Mat\',21,31,43);">21:31,43</A>; Mark and Luke often) as His Kingdom, the "elect of God" (<a onClick="return mV(\'Mar\',13,20);">Mr 13:20</a>; <a onClick="return mV(\'Luk\',18,7);">Lu 18:7</a>; compare <a onClick="return mV(\'Rom\',8,33);">Ro 8:33</a>; <a onClick="return mV(\'Col\',3,12);">Col 3:12</a>; <a onClick="return mV(\'Tts\',1,1);">Tit 1:1</a>) as His elect. He is obviously speaking in <a onClick="return mV(\'Mar\',13,22);">Mr 13:22</a> out of a divine self-consciousness: "Only a Divine Being can be exalted above angels" (B. Weiss). He therefore designates Himself by His divine name, "the Son," that is to say, the unique Son of God (<a onClick="return mV(\'Mar\',9,7);">Mr 9:7</a>; <a onClick="return mV(\'Mar\',1,11);">1:11</a>), to claim to be whom would for a man be blasphemy (<a onClick="return mV(\'Mar\',14,61,64);">Mr 14:61,64</a>). But though He designates Himself by this divine name, He is not speaking of what He once was, but of what at the moment of speaking He is: the action of the verb is present, "knoweth." He is claiming, in other words, the supreme designation of "the Son," with all that is involved in it, for His present self, as He moved among men: He is, not merely was, "the Son." Nevertheless, what He affirms of Himself cannot be affirmed of Himself distinctively as "the Son." For what He affirms of Himself is ignorance—"not even the Son" knows it; and ignorance does not belong to the divine nature which the term "the Son" connotes. An extreme appearance of contradiction accordingly arises from the use of this terminology, just as it arises when Paul says that the Jews "crucified the Lord of glory" (<a onClick="return mV(\'1Cr\',2,8);">1Co 2:8</a>), or exhorts the Ephesian elders to "feed the church of God which he purchased with his own blood" (<a onClick="return mV(\'Act\',20,28);">Ac 20:28</a> margin); or John Keble praises our Lord for the blood of souls by Thee redeemed." It was not the Lord of Glory as such who was nailed to the tree, nor have either "God" or "souls" blood to shed.<P>We know how this apparently contradictory mode of speech has arisen in Keble\'s case. He is speaking of men who are composite beings, consisting of souls and bodies, and these men come to be designated from one element of their composite personalities, though what is affirmed by them belongs rather to the other; we may speak, therefore, of the "blood of souls" meaning that these "souls," while not having blood as such, yet designate persons who have bodies and therefore blood. We know equally how to account for Paul\'s apparent contradictions. We know that he conceived of our Lord as a composite person, uniting in Himself a divine and a human nature. In Paul\'s view, therefore, though God as such has no blood, yet Jesus Christ who is God has blood because He is also man. He can justly speak, therefore, when speaking of Jesus Christ of His blood as the blood of God. When precisely the same phenomenon meets us in our Lord\'s speech of Himself, we naust presume that it is the outgrowth of precisely the same state of things. When lie speaks of "the Son" (who is God) as ignorant, we must understand that tie is designating Himself as "the Son" because of His higher nature, and yet has in mind the ignorance of His lower nature; what He means is that the person properly designated "the Son" is ignorant, that is to say with respect to the human nature which is as intimate an element of His personality as is His Deity.<P>When our Lord says, then, that "the Son knows not," He becomes as express a witness to the two natures which constitute His person as Paul is when he speaks of the blood of God, or as Keble is a witness to the twofold constitution of a human being when he speaks of souls shedding blood. In this short sentence, thus, our Lord bears witness to His divine nature with its supremacy above all creatures, to His human nature with its creaturely limitations, and to the unity of the subject possessed of these two natures.<P>(b) Other Passages: Son of Man and Son of God:<P>All these elements of His personality find severally repeated assertions in other utterances of our Lord recorded in the Synoptics. There is no need to insist here on the elevation of Himself above the kings and prophets of the Old Covenant (<a onClick="return mV(\'Mat\',12,41);">Mt 12:41</a>), above the temple itself (<a onClick="return mV(\'Mat\',12,6);">Mt 12:6</a>), and the ordinances of the divine law (<a onClick="return mV(\'Mat\',12,8);">Mt 12:8</a>); or on His accent of authority in both His teaching and action, His great "I say unto you" (<a onClick="return mV(\'Mar\',5,21,22);">Mr 5:21,22</a>), \'I will; be cleansed\' (<a onClick="return mV(\'Mar\',1,41);">Mr 1:41</a>; <a onClick="return mV(\'Mar\',2,5);">2:5</a>; <a onClick="return mV(\'Luk\',7,14);">Lu 7:14</a>); or on His separation of Himself from men in His relation to God, never including them with Himself in an "Our Father," but consistently speaking distinctively of "my Father" (e.g. <a onClick="return mV(\'Luk\',24,49);">Lu 24:49</a>) and "your Father" (e.g. <a onClick="return mV(\'Mat\',5,16);">Mt 5:16</a>); or on His intimation that He is not merely David\'s Son but David\'s Lord, and that a Lord sitting on the right hand of God (<a onClick="return mV(\'Mat\',22,44);">Mt 22:44</a>); or on His parabolic discrimination of Himself a Son and Heir from all "servants" (<a onClick="return mV(\'Mat\',21,33);">Mt 21:33</a>); or even on His ascription to Himself of the purely divine functions of the forgiveness of sins (<a onClick="return mV(\'Mar\',2,8);">Mr 2:8</a>) and judgment of the world (<a onClick="return mV(\'Mat\',25,31);">Mt 25:31</a>), or of the purely divine powers of reading the heart (<a onClick="return mV(\'Mar\',2,8);">Mr 2:8</a>; <a onClick="return mV(\'Luk\',9,47);">Lu 9:47</a>), omnipotence (<a onClick="return mV(\'Mat\',24,30);">Mt 24:30</a>; <a onClick="return mV(\'Mar\',14,62);">Mr 14:62</a>) and omnipresence (<a onClick="return mV(\'Mat\',18,20);">Mt 18:20</a>; <a onClick="return mV(\'Mat\',28,10);">28:10</a>). These things illustrate His constant assumption of the possession of divine dignity and attributes; the claim itself is more directly made in the two great designations which He currently gave Himself, the Son of Man and the Son of God. The former of these is His favorite self-designation. Derived from <a onClick="return mV(\'Dan\',7,13,14);">Da 7:13,14</a>, it intimates on every occasion of its employment our Lord\'s consciousness of being a supramundane being, who has entered into a sphere of earthly life on a high mission, on the accomplishment of which He is to return to His heavenly sphere, whence He shall in due season come back to earth, now, however, in His proper majesty, to gather up the fruits of His work and consummate all things. It is a designation, thus, which implies at once a heavenly preexistence, a present humiliation, and a future glory; and He proclaims Himself in this future glory no less than the universal King seated on the throne of judgment for quick and dead (<a onClick="return mV(\'Mar\',8,31);">Mr 8:31</a>; <a onClick="return mV(\'Mat\',25,31);">Mt 25:31</a>). The implication of Deity imbedded in the designation, Son of Man, is perhaps more plainly spoken out in the companion designation, Son of God, which our Lord not only accepts at the hands of others, accepting with it the implication of blasphemy in permitting its application to Himself (<a onClick="return mV(\'Mat\',26,63,65);">Mt 26:63,65</a>; <a onClick="return mV(\'Mar\',14,61,64);">Mr 14:61,64</a>; <a onClick="return mV(\'Luk\',22,29,30);">Lu 22:29,30</a>), but persistently claims for Himself both, in His constant designation of God as His Father in a distinctive sense, and in His less frequent but more pregnant designation of Himself as, by way of eminence, "the Son." That His consciousness of the peculiar relation to God expressed by this designation was not an attainment of His mature spiritual development, but was part of His most intimate consciousness from the beginning, is suggested by the sole glimpse which is given us into His mind as a child (<a onClick="return mV(\'Luk\',2,49);">Lu 2:49</a>). The high significance which the designation bore to Him is revealed to us in two remarkable utterances preserved, the one by both Matthew (<a onClick="return mV(\'Mat\',11,27);">11:27</a>ff) and Luke (<a onClick="return mV(\'Luk\',10,22);">10:22</a>ff), and the other by Matthew (<a onClick="return mV(\'Mat\',28,19);">28:19</a>).<P>(c) <a onClick="return mV(\'Mat\',11,27);">Matthew 11:27</a>; <a onClick="return mV(\'Mat\',28,19);">28:19</a>:<P>In the former of these utterances, our Lord, speaking in the most solemn manner, not only presents Himself, as the Son, as the sole source of knowledge of God and of blessedness for men, but places Himself in a position, not of equality merely, but of absolute reciprocity and interpenetration of knowledge with the Father. "No one," He says, "knoweth the Son, save the Father; neither doth any know the Father, save the Son ...."" varied in Luke so as to read: "No one knoweth who the Son is, save the Father; and who the Father is, save the Son ...." as if the being of the Son were so immense that only God could know it thoroughly; and the knowledge of the Son was so unlimited that He could know God to perfection. The peculiarly pregnant employment here of the terms "Son" and "Father" over against one another is explained to us in the other utterance (<a onClick="return mV(\'Mat\',28,19);">Mt 28:19</a>). It is the resurrected Lord\'s commission to His disciples. Claiming for Himself all authority in heaven and on earth—which implies the possession of omnipotence—and promising to be with His followers \'alway, even to the end of the world\'—which adds the implications of omnipresence and omniscience—He commands them to baptize their converts \'in the name of the Father and of the Son and of the Holy Spirit.\' The precise form of the formula must be carefully observed. It does not read: \'In the names\' (plural)—as if there were three beings enumerated, each with its distinguishing name. Nor yet: \'In the name of the Father, Son and Holy Spirit,\' as if there were one person, going by a threefold name. It reads: \'In the name (singular) of the Father, and of the (article repeated) Son, and of the (article repeated) Holy Spirit,\' carefully distinguishing three persons, though uniting them all under one name. The name of God was to the Jews Yahweh, and to name the name of Yahweh upon them was to make them His. What Jesus did in this great injunction was to command His followers to name the name of God upon their converts, and to announce the name of God which is to be named on their converts in the threefold enumeration of "the Father" and "the Son" and \'the Holy Spirit.\' As it is unquestionable that He intended Himself by "the Son," He here places Himself by the side of the Father and the Spirit, as together with them constituting the one God. It is, of course, the Trinity which He is describing; and that is as much as to say that He announces Himself as one of the persons of the Trinity. This is what Jesus, as reported by the Synoptics, understood Himself to be.<P>See <a href="./study/isbe/search.html?string=TRINITY">TRINITY</A>.<P>(2) His Humanity.<P>In announcing Himself to be God, however, Jesus does not deny that He is man also. If all His speech of Himself rests on His consciousness of a divine nature, no less does all His speech manifest His consciousness of a human nature. He easily identifies Himself with men (<a onClick="return mV(\'Mat\',4,4);">Mt 4:4</a>; <a onClick="return mV(\'Luk\',4,4);">Lu 4:4</a>), and receives without protest the imputation of humanity (<a onClick="return mV(\'Mat\',11,19);">Mt 11:19</a>; <a onClick="return mV(\'Luk\',7,34);">Lu 7:34</a>). He speaks familiarly of His body (<a onClick="return mV(\'Mat\',26,12,26);">Mt 26:12,26</a>; <a onClick="return mV(\'Mar\',14,8);">Mr 14:8</a>; <a onClick="return mV(\'Mar\',14,22);">14:22</a>; <a onClick="return mV(\'Luk\',22,19);">Lu 22:19</a>), and of His bodily parts—His feet and hands (<a onClick="return mV(\'Luk\',24,39);">Lu 24:39</a>), His head and feet (<a onClick="return mV(\'Luk\',7,\'44-46\');">Lu 7:44-46</a>), His flesh and bones (<a onClick="return mV(\'Luk\',24,39);">Lu 24:39</a>), His blood (<a onClick="return mV(\'Mat\',26,28);">Mt 26:28</a>; <a onClick="return mV(\'Mar\',14,24);">Mr 14:24</a>; <a onClick="return mV(\'Luk\',22,20);">Lu 22:20</a>). We chance to be given indeed a very express affirmation on His part of the reality of His bodily nature; when His disciples were terrified at His appearing before them after His resurrection, supposing Him to be a spirit, He reassures them with the direct declaration: "See my hands and my feet, that it is I myself: handle me, and see; for a spirit hath not flesh and bones, as ye behold me having" (<a onClick="return mV(\'Luk\',24,39);">Lu 24:39</a>). His testimony to His human soul is just as express: "My soul," says He, "is exceeding sorrowful, even unto death" (<a onClick="return mV(\'Mat\',26,38);">Mt 26:38</a>; <a onClick="return mV(\'Mar\',14,34);">Mr 14:34</a>). He speaks of the human dread with which He looked forward to His approaching death (<a onClick="return mV(\'Luk\',12,50);">Lu 12:50</a>), and expresses in a poignant cry His sense of desolation on the cross (<a onClick="return mV(\'Mat\',27,46);">Mt 27:46</a>; <a onClick="return mV(\'Mar\',15,34);">Mr 15:34</a>). He speaks also of His pity for the weary and hungering people (<a onClick="return mV(\'Mat\',15,32);">Mt 15:32</a>; <a onClick="return mV(\'Mar\',8,2);">Mr 8:2</a>), and of a strong human desire which He felt (<a onClick="return mV(\'Luk\',22,15);">Lu 22:15</a>). Nothing that is human is alien to Him except sin. He never ascribes imperfection to Himself and never betrays consciousness of sin. He recognizes the evil of those about Him (<a onClick="return mV(\'Luk\',11,13);">Lu 11:13</a>; <a onClick="return mV(\'Mat\',7,11);">Mt 7:11</a>; <a onClick
