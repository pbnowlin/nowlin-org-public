er they were Christians. If they admitted it, I repeated the question a second and a third time, and threatened them with punishment. If they persisted I ordered them to be punished. For I did not doubt, whatever the nature of that which they confessed might be, that a contumacious and inflexible obstinacy ought to be punished. There were others also, possessed with the same infatuation, whom, because they were Roman citizens, I ordered to be sent to Rome. But this crime spreading, as is usually the case, while it was actually under legal prosecution, several cases occurred. An anonymous information was laid before me, containing the names of many persons. Those who denied that they were Christians, or that they had ever been so, repeated after me an invocation of the gods, and offered prayer, with wine and incense, to your statue, which I had ordered to be brought in for this very purpose, along with the statues of the gods, and they even reviled the name of Christ; whereas there is no forcing, it is said, those who are really Christians into any of these compliances: I thought it proper to discharge them. Others who were accused by a witness at first confessed themselves Christians, but afterward denied it. Some owned indeed that they had been Christians formerly, but had now, some for several years, and a few above 20 years ago, renounced it. They all worshipped your statue and the images of the gods....I forbade the meeting of any assemblies, and therefore I judged it to be so much the more necessary to endeavor to extort the real truth by putting to the torture two female slaves, who were called deaconesses, yet I found nothing but an absurd and extravagant superstition."<P>In Trajan\'s reply to Pliny he writes, "They (the Christians) ought not to be searched for. If they are brought before you and convicted, they should be punished, but this should be done in such a way, that he who denies that he is a Christian, and when his statement is proved by his invoking our deities, such a person, although suspected for past conduct, must nevertheless be forgiven, because of his repentance."<P>These letters of Pliny and Trajan treat state-persecution as the standing procedure—and this not a generation after the death of the apostle John. The sufferings and tribulation predicted in <a onClick="return mV(\'Rev\',2,10);">Re 2:10</a>, and in many other passages, had indeed come to pass. Some of the Christians had denied the name of Christ and had worshipped the images of the emperor and of the idols, but multitudes of them had been faithful unto death, and had received the martyr\'s crown of life.<P>16. 2nd and 3rd Centuries:<P>Speaking generally, persecution of greater or less severity was the normal method employed by the Roman empire against the Christian church during the 2nd and the 3rd centuries It may be said to have come to an end only about the end of the 3rd or the beginning of the 4th century, when the empire became nominally Christian. When the apostolic period is left, persecution becomes almost the normal state in which the church is found. And persecution, instead of abolishing the name of Christ, as the persecutors vainly imagined they had succeeded in doing, became the means of the growth of the Christian church and of its purity. Both of these important ends, and others too, were secured by the severity of the means employed by the persecuting power of the Roman empire.<P>Under Trajan\'s successor, the emperor Hadrian, the lot of the Christians was full of uncertainty: persecution might break out at any moment. At the best Hadrian\'s regime was only that of unauthorized toleration.<P>17. Best Emperors the Most Cruel Persecutors:<P>With the exception of such instances as those of Nero and Domitian, there is the surprising fact to notice, that it was not the worst emperors, but the best, who became the most violent persecutors. One reason probably was that the ability of those emperors led them to see that the religion of Christ is really a divisive factor in any kingdom in which civil government and pagan religion are indissolubly bound up together. The more that such a ruler was intent on preserving the unity of the empire, the more would be persecute the Christian faith. Hence, among the rulers who were persecutors, there are the names of Antoninus Pius. Marcus Aurelius the philosopher-emperor, and Septimius Severus (died at York, 211 Ad).<P>18. Causes of Persecution:<P>Persecution was no accident, which chanced to happen, but which might not have occurred at all. It was the necessary consequence of the principles embodied in the heathen Roman government, when these came into contact and into conflict with the essential principles of the Christian faith. The reasons for the persecution of the Christian church by the Roman empire were<P>(1) political;<P>(2) on account of the claim which the Christian faith makes, and which it cannot help making, to the exclusive allegiance of the heart and of the life.<P>That loyalty to Christ which the martyrs displayed was believed by the authorities in the state to be incompatible with the duties of a Roman citizen. Patriotism demanded that every citizen should united in the worship of the emperor, but Christians refused to take pat in the worship on any terms, and so they continually lived under the shadow of a great hatred, which always slumbered, and might break out at any time. The claim which the Christian faith made to the absolute and exclusive loyalty of all who obeyed Christ was such that it admitted of no compromise with heathenism. To receive Christ into the pantheon as another divinity, as one of several—this was not the Christian faith. To every loyal follower of Christ compromise with other faiths was an impossibility. An accommodated Christianity would itself have been false to the only true God and Jesus Christ whom He had sent, and would never have conquered the world. To the heathen there were lords many and gods many, but to the Christians there was but one God the Father and one Lord Jesus Christ, the Saviour of the world (<a onClick="return mV(\'1Cr\',8,5,6);">1Co 8:5,6</a>). The essential absoluteness of the Christian faith was its strength, but this was also the cause of its being hated.<P>"By a correct instinct paganisms of all sorts discerned in the infant church their only rival. So, while the new Hercules was yet in the cradle, they sent their snakes to kill him. But Hercules lived to cleanse out the Augean stables" (Workman, op. cit., 88).<P>19. 200 Years of Persecution:<P>"For 200 years, to become a Christian meant the great renunciation, the joining a despised and persecuted sect, the swimming against the tide of popular prejudice, the coming under the ban of the Empire, the possibility at any moment of imprisonment and death under its most fearful forms. For 200 years he that would follow Christ must count the cost, and be prepared to pay the same with his liberty and life. For 200 years the mere profession of Christianity was itself a crime. Christianus sum was almost the one plea for which there was Persecution no forgiveness, in itself all that was necessary as a \'title\' on the back of the condemned. He who made it was allowed neither to present apology, nor call in the aid of a pleader. \'Public hatred,\' writes Tertullian, \'asks but one thing, and that not investigation into the crimes charged, but simply the confession of the Christian name.\' For the name itself in periods of stress, not a few, meant the rack, the blazing shirt of pitch, the lion, the panther, or in the case of maidens an infamy worse than death" (Workman, 103).<P>20. Persecution in the Army:<P>Service in the Roman army involved, for a Christian, increasing danger in the midst of an organized and aggressive heathenism. Hence, arose the persecution of the Christian soldier who refused compliance with the idolatrous ceremonies in which the army engaged, whether those ceremonies were concerned with the worship of the Roman deities or with that of Mithraism. "The invincible saviour," as Mithra was called, had become, at the time when Tertullian and Origen wrote, the special deity of soldiers. Shrines in honor of Mithra were erected through the entire breadth of the Roman empire, from Dacia and Pannonia to the Cheviot Hills in Britain. And woe to the soldier who refused compliance with the religious sacrifices to which the legions gave their adhesion! The Christians in the Roman legions formed no inconsiderable proportion of "the noble army of martyrs," it being easier for the persecuting authorities to detect a Christian in the ranks of the army than elsewhere.<P>21. Tertullian\'s Apology:<P>In the 2nd and 3rd centuries, Christians were to be found everywhere, for Tertullian, in an oftentimes quoted passage in his Apology, writes, "We live beside you in the world, making use of the same forum, market, bath, shop, inn, and all other places of trade. We sail with you, fight shoulder to shoulder, till the soil, and traffic with you"; yet the very existence of Christian faith, and its profession, continued to bring the greatest risks. "With the best will in the world, they remained a peculiar people, who must be prepared at any moment to meet the storm of hatred" (Workman, 189). For them it remained true that in one way or another, hatred on the part of the world inevitably fell to the lot of those who walked in the footsteps of the Master; "All that would live godly in Christ Jesus shall suffer persecution" (<a onClick="return mV(\'2Ti\',3,12);">2Ti 3:12</a>).<P>22. "The Third Race":<P>The strange title, "the third race," probably invented by the heathen, but willingly accepted by the Christians without demur, showed with what a bitter spirit the heathen regarded the faith of Christ. "The first race" was indifferently called the Roman, Greek, or Gentile. "The second race" was the Jews; while "the third race" was the Christian. The cry in the circus of Carthage was Usque quo genus tertium? "How long must we endure this third race?"<P>23. Hatred against Christians:<P>But one of the most powerful causes of the hatred entertained by the heathen against the Christians was, that though there were no citizens so loyal as they, yet in every case in which the laws and customs of the empire came into conflict with the will of God, their supreme rule was loyalty to Christ, they must obey God rather than man. To worship Caesar, to offer even one grain of incense on the shrine of Diana, no Christian would ever consent, not even. when this minimum of compliance would save life itself.<P>The Roman empire claimed to be a kingdom of universal sway, not only over the bodies and the property of all its subjects, but over their consciences and their souls. It demanded absolute obedience to its supreme lord, that is, to Caesar. This obedience the Christian could not render, for unlimited obedience of body, soul and spirit is due to God alone, the only Lord of the conscience. Hence, it was that there arose the antagonism of the government to Christianity, with persecution as the inevitable result.<P>These results, hatred and persecution, were, in such circumstances, inevitable; they were "the outcome of the fundamental tenet of primitive Christianity, that the Christian ceased to be his own master, ceased to have his old environment, ceased to hold his old connections with the state; in everything he became the bond-servant of Jesus Christ, in everything owing supreme allegiance and fealty to the new empire and the Crucified Head. \'We engage in these conflicts,\' said Tertullian, \'as men whose very lives are not our own. We have no master but God\'" (Workman, 195).<P>24. The Decian Persecution:<P>The persecution inaugurated by the emperor Decius in 250 AD was particularly severe. There was hardly a province in the empire where there were no martyrs; but there were also many who abandoned their faith and rushed to the magistrates to obtain their libelli, or certificates that they had offered heathen sacrifice. When the days of persecution were over, these persons usually came with eagerness to seek readmission to the church. It was in the Decian persecution that the great theologian Origen, who was then in his 68th year, suffered the cruel torture of the rack; and from the effects of what he then suffered he died at Tyre in 254.<P>25. Libelli:<P>Many libelli have been discovered in recent excavations in Egypt. In the The Expository Times for January,1909,p. 185, Dr. George Milligan gives an example, and prints the Greek text of one of these recently discovered Egyptian libelli. These libelli are most interesting, illustrating as they do the account which Cyprian gives of the way in which some faint-hearted Christians during the Decian persecution obtained certificates—some of these certificates being true to fact, and others false—to the effect that they had sacrificed in the heathen manner. The one which Dr. Milligan gives is as follows: "To those chosen to superintend the sacrifices at the village of Alexander Island, from Aurelius Diogenes, the son of Sarabus, of the village of Alexander Island, being about 72 years old, a scar on the right eyebrow. Not only have I always continued sacrificing to the gods, but now also in your presence, in accordance with the decrees, I have sacrificed and poured libations and tasted the offerings, and I request you to countersign my statement. May good fortune attend you. I, Aurelius Diogenes, have made this request."<P>(2nd Hand) "I, Aurelius Syrus, as a participant, have certified Diogenes as sacrificing along with us."<P>(1st Hand) "The first year of the Emperor Caesar Gaius Messius Quintus Trajan Decius Plus Felix Augustus, Epiph. 2" (= June 25, 250 AD).<P>Under Valerian the persecution was again very severe, but his successor, Gallienus, issued an edict of toleration, in which he guaranteed freedom of worship to the Christians. Thus Christianity definitely became a religio licita, a lawful religion. This freedom from persecution continued until the reign of Diocletian.<P>26. The Edict of Milan:<P>The persecution of the Christian church by the empire of Rome came to an end in March, 313 AD, when Constantine issued the document known as the "Edict of Milan," which assured to each individual freedom of religious belief. This document marks an era of the utmost importance in the history of the world. Official Roman persecution had done its worst, and had failed; it was ended now; the Galilean had conquered.<P>27. Results of Persecution:<P>The results of persecution were:<P>(1) It raised up witnesses, true witnesses, for the Christian faith. Men and women and even children were among the martyrs whom no cruelties, however refined and protracted, could terrify into denial of their Lord. It is to a large extent owing to persecution that the Christian church possesses the testimony of men like Quadratus and Tertullian and Origen and Cyprian and many others. While those who had adopted the Christian faith in an external and formal manner only generally went back from their profession, the true Christian, as even the Roman proconsul Pliny testifies, could not be made to do this. The same stroke which crushed the straw—such is a saying of Augustine\'s—separated the pure grain which the Lord had chosen.<P>(2) Persecution showed that the Christian faith is immortal even in this world. Of Christ\'s kingdom there shall be no end. "Hammer away, ye hostile bands, your hammers break, God\'s altar stands." Pagan Rome, Babylon the Great, as it is called by the apostle John in the Apocalypse tried hard to destroy the church of Christ; Babylon was drunk with the blood of the saints. God allowed this tyranny to exist for 300 years, and the blood of His children was shed like water. Why was it necessary that the church should have so terrible and so prolonged an experience of suffering? It was in order to convince the world that though the kings of the earth gather themselves against the Lord and against His Christ, yet all that they can do is vain. God is in the midst of Zion; He shall help her, and that right early. The Christian church, as if suspended between heaven and earth, had no need of other help than that of the unseen but divine hand, which at every moment held it up and kept it from falling. Never was the church more free, never stronger, never more flourishing, never more extensive in its growth, than in the days of persecution.<P>And what became of the great persecuting power, the Roman empire? It fell before the barbarians. Rome is fallen in its ruins, and its idols are utterly abolished, while the barbarians who overwhelmed the empire have become the nominally Christian nations of modern Europe, and their descendants have carried the Christian faith to America and Australia and Africa and all over the world.<P>(3) Persecution became, to a large extent, an important means of preserving the true doctrines of the person and of the work of Christ. It was in the ages of persecution that Gnosticism died, though it died slowly. It was in the ages of persecution that Arianism was overthrown. At the Council of Nicea in 325 AD, among those who were present and took part in the discussion and in the decision of the council, there were those who "bore in their bodies the branding-marks of Jesus," who had suffered pain and loss for Christ\'s sake.<P>Persecution was followed by these important results, for God in His wisdom had seen fit to permit these evils to happen, in order to change them into permanent good; and thus the wrath of man was overruled to praise God, and to effect more ultimate good, than if the persecutions had not taken place at all. What, in a word, could be more divine than to curb and restrain and overrule evil itself and change it into good ? God lets iniquity do what it pleases, according to its own designs; but in permitting it to move on one side, rather than on another, He overrules it and makes it enter into the order of His providence. So He lets this fury against the Christian ith be kindled in the hearts of persecutors, so that they afflict the saints of the Most High. But the church remains safe, for persecution can work nothing but ultimate good in the hand of God. "The blood of the martyrs is the seed of the church." So said Tertullian, and what he said is true.<P>Persecution has permanently enriched the history of the church. It has given us the noble heritage of the testimony and the suffering of those whose lives would otherwise have been unrecorded. Their very names as well as their careers would have been unknown had not persecution "dragged them into fame and chased them up to heaven."<P>Persecution made Christ very near and very precious to those who suffered. Many of the martyrs bore witness, even when in the midst of the most cruel torments, that they felt no pain, but that Christ was with them. Instances to this effect could be multiplied. Persecution made them feel how true Christ\'s words were, that even as He was not of the world, so they also were not of it. If they had been of the world, the world would love its own, but because Christ had chosen them out of the world, therefore the world hated them. They were not greater than their Lord. If men had persecuted Jesus, they would also persecute His true disciples. But though they were persecuted, they were of good cheer, Christ had overcome the world; He was with them; He enabled them to be faithful unto death. He had promised them the crown of life.<P>Browning\'s beautiful lines describe what was a common experience of the martyrs, how Christ "in them" and "with them," "quenched the power of fire," and made them more than conquerors:<P>"I was some time in being burned,<P>But at the close a Hand came through<P>The fire above my head, and drew<P>My soul to Christ, whom now I see.<P>Sergius, a brother, writes for me<P>This testimony on the wall—<P>For me, I have forgot it all."``155';
isbe[6824]='Persepolis`per-sep\'-o-lis (2Macc 9:2; Persepolis, Persaipolis, in Ptolemy Persopolis; original Persian name unknown; Pahlavi Stakhr, now Ictakhr and Shihil Minar, "Forty Turrets"):<P>1. Location:<P>The ruins of Persepolis lie about 35 miles northeast of Shiraz and some 40 miles south of the ruins of Pasargadae.<P>2. History:<P>The magnificent palace of which such striking remains are still visible (Takht i Jamshid) was built by Darius and Xerxes of white marble and black stone. The city was captured, pillaged and burnt by Alexander in 324 BC, most of the inhabitants being massacred or enslaved. Much of the treasure of the Persian kings was found there. Curtius says the palace was never rebuilt. Antioehus Epiphanes (166 BC) tried but failed to plunder the temple (of Anaitis, Anihita?) there (2Macc 9:2; perhaps this is the incident referred to in 1Macc 6:1ff, and Polyb. xxxi.11). At Persepolis were the sepulchers of the Achemenian kings (except Cyrus). Long and important inscriptions of Darius and Xerxes are found at Persepolis and the neighboring Naqsh i Rustam, in cuneiform characters and in the Aehaemenian Persian, Assyrian and neo-Susian tongues (published by Spiegel, Rawlinson and Weisbaeh). Clitarehus first among Europeans mentions the city. The writer of this article visited it in 1892. Not now inhabited.<P>LITERATURE.<P>Inscriptions (as above), Arrian, Curtius, Polybius, Pliny, Diod. Siculus, medieval and modern travelers.``175';
isbe[6825]='Perseus`pur\'-sus, pur\'-se-us (Perseus): In 1Macc 8:5 the conquest of "Perseus, king of the Citims" (the Revised Version (British and American) "king of Chittim") was part of the "fame of the Romans" which reached the ears of Judas. This Perseus, the son and successor of Philip III of Macedonia, came to the throne in 178 BC and was the last king of Maccedonia. In 171 BC began the war with Rome which ended in his disastrous defeat and capture at Pydna, 168 BC (to which 1Macc 8:5 refers), by L. Aemilius Paulus. Macedonia soon became a Roman province. Perseus was led to Rome to grace the triumph of his conqueror, by whose clemency he was spared, and died in captivity at Rome (Polyb. xxix. 17; Livy xliv. 40ff).<P>Kittim or Chittim, properly of the people of the town of Citium in Cyprus, then signifying Cyprians, and extended by Jewish writers (<a onClick="return mV(\'Gen\',10,4);">Ge 10:4</a>; <a onClick="return mV(\'Num\',24,24);">Nu 24:24</a>; <a onClick="return mV(\'Isa\',23,1);">Isa 23:1</a>; <a onClick="return mV(\'Jer\',2,10);">Jer 2:10</a>; <a onClick="return mV(\'Eze\',27,6);">Eze 27:6</a>; <a onClick="return mV(\'Dan\',11,30);">Da 11:30</a>; Josephus, Ant, I, vi) to include the coasts of Greece generally, is here applied to Maccdonia. In 1Macc 1:1 Macedonia (or Greece) is called "the land of Chittim."``5';
isbe[6826]='Perseverance`pur-se-ver\'-ans: The word occurs only once in the King James Version (<a onClick="return mV(\'Eph\',6,18);">Eph 6:18</a>), where it refers quite simply to persistence in prayer. In theology (especially in the phrase "final perseverance") the word has come to denote a special persistency, the undying continuance of the new life (manifested in faith and holiness) given by the Spirit of God to man. It is questioned whether such imparted life is (by its nature, or by the law of its impartation) necessarily permanent indestructible so that the once regenerate and believing man has the prospect of final glory infallibly assured. This is not the place to trace the history of a great and complex debate. It is more fitting here to point to the problem as connected with that supreme class of truths in which, because of our necessary mental limits, the entire truth can only be apprehended as the unrevealed but certain harmony of seeming contradictions. Scripture on the one hand abounds with assurances of "perseverance" as a fact, and largely intimates that an exulting anticipation of it is the intended experience of the believer (see <a onClick="return mV(\'Jhn\',10,28);">Joh 10:28</a> above all, and compare among other passages <a onClick="return mV(\'Rom\',8,\'31-37\');">Ro 8:31-37</a>; <a onClick="return mV(\'1Pe\',1,8,9);">1Pe 1:8,9</a>). On the other hand, we find frequent and urgent warnings and cautions (see e.g. <a onClick="return mV(\'1Cr\',8,11);">1Co 8:11</a>; <a onClick="return mV(\'1Cr\',9,27);">9:27</a>). The teacher dealing with actual cases, as in pastoral work, should be ready to adopt both classes of utterances, each with its proper application; applying the first, e.g., to the true but timid disciple, the latter to the self-confident. Meanwhile Scripture on the whole, by the manner and weight of its positive statements, favors a humble belief of the permanence, in the plan of God, of the once-given new life. It is as if it laid down perseverance" as the divine rule for the Christian, while the negative passages came in to caution the man not to deceive himself with appearances, nor to let any belief whatever palliate the guilt and minimize the danger of sin. In the biographies of Scripture, it is noteworthy that no person appears who, at one time certainly a saint, was later certainly a castaway. The awful words of <a onClick="return mV(\'Hbr\',6,\'4-6\');">Heb 6:4-6</a>; <a onClick="return mV(\'Hbr\',10,26,27);">10:26,27</a> appear to deal with cases (such as Balaam\'s) of much light but no loving life, and so are not precisely in point. Upon the whole subject, it is important to make "the Perseverance of the Saviour" our watchword rather than "the Perseverance of the saint."``46';
isbe[6827]='Persia`pur\'-sha, (parats; Persia; in Assyrian Parsu, Parsua; in Achemenian Persian Parsa, modern Fars): In the Bible (<a onClick="return mV(\'2Ch\',36,20,22,23);">2Ch 36:20,22,23</a>; <a onClick="return mV(\'Ezr\',1,1,8);">Ezr 1:1,8</a>; <a onClick="return mV(\'Est\',1,3,14,18);">Es 1:3,14,18</a>; <a onClick="return mV(\'Est\',10,2);">10:2</a>; <a onClick="return mV(\'Eze\',27,10);">Eze 27:10</a>; <a onClick="return mV(\'Eze\',38,5);">38:5</a>; <a onClick="return mV(\'Dan\',8,20);">Da 8:20</a>; <a onClick="return mV(\'Dan\',10,1);">10:1</a>; <a onClick="return mV(\'Dan\',11,2);">11:2</a>) this name denotes properly the modern province of Fars, not the whole Persian empire. The latter was by its people called Airyaria, the present Iran (from the Sanskrit word arya, "noble"); and even now the Persians never call their country anything but Iran, never "Persia." The province of Persis lay to the east of Elam (Susiana), and stretched from the Persian Gulf to the Great Salt Desert, having Carmania on the southeast. Its chief cities were Persepolis and Pasargadae. Along the Persian Gulf the land is low, hot and unhealthy, but it soon begins to rise as one travels inland. Most of the province consists of high and steep mountains and plateaus, with fertile valleys. The table-lands in which lie the modern city of Shiraz and the ruins of Persepolis and Pasargadae are well watered and productive. Nearer the desert, however, cultivation grows scanty for want of water. Persia was doubtless in early times included in Elam, and its population was then either Semitic or allied to the Accadians, who founded more than one state in the Babylonian plain. The Aryan Persians seem to have occupied the country in the 8th or 9th century BC.``175';
isbe[6828]='Persian Language and Literature (Ancient)`pur\'-shan, pur\'-zhan, RATURE (ANCIENT):<P><b>I. LANGUAGE (Introductory)</b><P class="in15">Dialects<P><b>II. OLD PERSIAN INSCRIPTIONS</b><P><b>III. MEDIC DIALECT</b><P class="in15">1. Ordinary Ayestic<P class="in15">2. Gathic<P><b>IV. ZOROASTER</b><P class="in15">1. His Date, etc.<P class="in15">2. Date of Avesta<P class="in15">3. Divisions of the present Avesta<P class="in30">(1) The Yasna<P class="in30">(2) The Vispered<P class="in30">(3) The Vendidad<P class="in30">(4) The Yashts<P class="in30">(5) The Khorda Avesta<P><b>V. PAHLAVI</b><P class="in15">1. Literature<P class="in15">2. Comparison<P><b>LITERATURE</b>.<hr /><P>I. Language: (Introductory).<P>The Persian language, ancient and modern alike, is an Aryan tongue. In its ancient forms it is more closely connected with Vedic Sanskrit than with any other language except Armenian. Most of its roots are to be found also in Slavonic, Greek, Latin and other tongues of the same stock.<P>Dialects:<P>There were two main dialects in the ancient language of Iran (Airyanem),<P>(1) that of the Persians proper, and<P>(2) that of the Medes.<P>The former is known to us from the inscriptions of the Achemenian kings, the latter from the Avesta, and a few Median words preserved for us by Herodotus and other Greek writers.<P>II. Old Persian Inscriptions.<P>These fall between 550 and 330 BC, and contain about 1,000 lines and 400 words. They are carved upon the rocks in a cuneiform character, simplified from that of the neo-Susian, which again comes from the neo-Babylonian syllabary. In Old Persian inscriptions only 44 characters are employed, of which 7 are ideographs or contractions. The remaining 37 phonetic signs are syllabic, each consisting of an open syllable and not merely of a single letter, except in case of separate vowels. The syllabary, though much simpler than any other cuneiform system, does not quite attain therefore to being an alphabet. It was written from left to right, like the other cuneiform syllabaries. Of Cyrus the Great only one Persian sentence has been found: Adam Kurush Khshayathiya Hakhamanishiya, "I am Cyrus the King, the Achemenian." Darius I has left us long inscriptions, at Behistan (Besitun), Mt. Alvand, Persepolis, Naqsh i Rustam, etc., and one at Suez, the latter mentioning his conquest of Egypt and the construction of the first (?) Suez canal:<P>Adam niyashtayam imam yuviyam kantanaiy haca Pirava nama rauta tya Mudrayaiy danauvatiy abiy daraya tya haca Parsa aiti.<P>("I commanded to dig this canal from the river named the Nile, which flows through Egypt, to the sea which comes from Persia.")<P>We have also inscriptions of Xerxes at Persepolis and many short ones of Artaxerxes I, Artaxerxes Mnemon, and Artaxerxes Ochus. From them all taken together we learn much concerning the history and the religion of the Achemenian period. It is from Achemenian or Old Persian, and not from the Medic or Avestic, that modern Persian has sprung through Pahlavi and Dari as intermediate stages. This is probably due to the political supremacy which the Persians under the Achaemenides gained over the Medes. The few words in the inscriptions which might otherwise be doubtful can be understood through comparison with Armenian and even with the modern Pets, e.g. yuviya in the above inscription is the modern vulgar Pets jub.<P>III. Medic Dialect.<P>1. Ordinary Avestic:<P>The Medic dialect is represented in literature by the Avesta or sacred books of the Zoroastrians (Parsis). The word Avesta does not occur in the book itself and is of uncertain meaning and signification. It is probably the Abashta of Beh. Inscr., IV,64,and means either<P>(1) an interview, meeting (Sanskrit avashta, "appearance before a judge"; At. ava-sta, "to stand near"), or (2) a petition (Pahl. apastan, "petition"; Arm. apastan, "refuge," "asylum"),<P>in either case deriving its name from Zoroaster\'s drawing near to Ahura Mazda in worship.<P>This dialect represents a much greater decadence in grammar and vocabulary than does the Old Persian. Many of its consonants and most of its vowels are weakened. Its verbs have almost entirely lost the augment; its declensional system shows extreme confusion. It stands to Old Persian grammatically somewhat as English does to German Its alphabet, consisting of 43 letters, is derived from the Syriac (probably the Estrangela), and is written from right to left. As a specimen of the language of most of the Avesta we give the following extract (Yasna LXIV, 15(61)):<P>Daidi moi, ye gam tasho apasca urvarwsca<P>Ameretata, haurvata, Spenista Mainyu Mazda,<P>Tevishi, utayuiti, Mananha Vohu, senhe.<P>"Give me, O thou who didst make the bull (earth),<P>and the waters and the plants, immortality, health—<P>O most Bountiful Spirit, Mazda<p>—strength, might, through Vohu Mano, I say.")<P>2. Gathic:<P>There is a sub-dialect of Medic (Avestic) known as the Gatha-dialect, from the fact that the Gathas or "Hymns" (Yasna XXVIII-XXXIV, XLII-L, LII), and also the prayers (Yatha Ahu Vairyo, Ashem Vohu, Airyama Ishyo, and originally Yenhe Halam, and a few scattered passages elsewhere) are composed in it. This represents, speaking generally, an older form of the Avestic. It is probably the old language of Bactria or of Margiana Gatha I,2,runs thus:<P>Ye vw, Mazda Ahura, pairijasai Vohu Mananha,<P>Maibyo davoi ahvw (astivatasca hyatca mananho)<P>Ayapta Ashat haca, yais rapento daidit hvathre.<P>"To me, O Ahura Mazda, who approach you two through Vohu Mano,<P>grant the benefits from Asha, (those) of both worlds,<P>both of the material (world)<P>and of that which is of the spirit, through which (benefits)<P>may (Asha) place in glory those who please him.")<P>The meter of the Gathas, like that of the other Avestic poems, is based on the number of syllables in a line, with due regard to the caesura. But the condition of the text is such that there is great difficulty in recovering the original reading with sufficient accuracy to enable us to lay down rules on the subject with any certainty. The first Gatha is composed of strophes of 3 lines each (as above). Each line contains 16 syllables, with a caesura after the 7th foot.<P>IV. Zoroaster.<P>1. His Date, etc.:<P>Many of the Gathas are generally ascribed to Zoroaster himself, the rest to his earliest disciples. They compose the most ancient part of the Avesta. It is now becoming a matter of very great probability that Zoroaster lived at earliest in the middle of the 7th century BC, more probably a century later. The Arta Viraf Namak says that his religion remained pure for 300 years, and connects its corruption with the alleged destruction of much of the Avesta in the palace burned by Alexander at Persepolis, 324.BC. This traditional indication of date is confirmed by other evidence. Zoroaster\'s prince Vishtaspa (in Greek Hustaspes) bears the same name as the father of Darius I, and was probably the same person. Vishtaspa\'s queen Hutaosa, who also protected and favored Zoroaster, bears the same name (in Greek Atossa) as Cambyses\' sister who afterward married Darius, and probably belonged to the same family. Zoroastrianism comes to the fore under Darius, whereas Cyrus in his inscriptions speaks as a decided polytheist. Hence, we conclude that the earliest part of the Avesta belongs to circa 550 BC. Of Zoroaster himself we learn much from the Avesta, which traces his genealogy back for 10 generations. It mentions his wife\'s name (Hvovi), and tells of his 3 sons and 3 daughters. His first disciple was Frashaostra, his wife\'s natural uncle. His own name means "Owner of the yellow camel," and has none of the higher meanings sometimes assigned to it by those who would deny his existence. Tradition says he was born at Ragha (Raga, Rai) about 5 1/2 miles south of the present Tehran, though some think his native place was Western Atropatene (Azarbaijan). Rejected by his own tribe, the Magi, he went to Vishtispa\'s court in Bactria. The faith which he taught spread to the Persian court (very naturally, if Vishtispa was identical with Darius\' father) and thence throughout the country. Tradition (Yasht XIX, 2, etc.) says that the Avesta was revealed to Zoroaster on Mt. Ushi-darena ("intellect-holding") in Sistan. But it is not the composition of one man or of one age.<P>2. Date of Avesta:<P>Herodotus makes no mention of Zoroaster, but speaks of the Magi (whom he calls a Median tribe (i.101)) as already performing priestly functions. His description of their repetition of charms and theological compositions (i.132) would agree very well with recitation of the Gathas and Yasna. Mention of controversies with Gautama, Buddha\'s disciples (Yasht XIII, 16) who probably reached Persia in the 2nd century BC, is another indication of date. The fact that in both the Yasna and the Vendidad heretics (zanda) are mentioned who preferred the commentary (zand) on the Avesta to the Avesta itself, is a sign of late date. Names of certain persons found in the Avesta (e.g. Atare-pata, a Dastur who lived under Hormuzd I, 273 AD, and Rastare-Yaghenti, whom the Dinkarl identifies with the chief Mobed of Sapor II, 309-379 AD, Aderpad Marespand, and who, according to the Patet, section 28, "purified" the revelation made to Zoroaster, i.e. revised the text of the earlier parts of the Avesta) enable us to prove that certain portions of the work as we now have it were composed as late as near the end of the 4th century of our era. It is said that the text was in confusion in the time of Vologases I (51-78 (?) AD). A reccnsion was then begun, and continued with much zeal by Ardashir Papakan, 226-240 AD. According to Geldner (Prolegomena, xlvi) the final recension took place some considerable time after Yezdigird III (overthrown 642 AD). In the times of the Sasanides there were, it is said, 21 Naskas or volumes of the Avesta, and the names of these are given in the Dinkart (Book IX). Of these we now possess only one entire Naska, the Vendidad, and portions of three others.<P>3. Divisions of the Present Avesta:<P>The present Avesta is divided into 5 parts:<P>(1) The Yasna<P>The Yasna root yaz, Sanskrit yaj, "to invoke," "to praise") contains 72 chapters of hymns for use at sacrifices, etc., including the "Older Yasna" or Gathas.<P>(2) The Vispered<P>The Vispered (vispa, "every," "all," and radha, "a lord") is divided into 24 chapters in Geldner\'s edition; it is supplementary to the Yasna.<P>(3) The Vendidad<P>The Vendidad (van plus daea plus data, "law for " vanquishing the demons") contains 22 chapters. The first chapter contains the Iranian myth about the order in which the provinces of the Iranian world were created by Ahura Mazda. It tells how the Evil Spirit, Anro Mainyus, created plagues, sins and death, to destroy the good creatures of the Good Spirit. The greater part of the book contains ceremonial laws and formulas, some of them loathsome and all rather petty and superstitious in character.<P>(4) The Yashts<P>The Yashts, 21 in all, are hymns, telling many mythological tales about Mithra, Tishtriya, etc.<P>(5) The Khorda Avesta<P>The Khorda Avesta ("Little Avesta") consists of a number of short compositions, hymns, etc., compiled by the Aderpad Marespand (Adharpadh Mahraspand, Atarobat Mansarspendan) already mentioned, in Sapor II\'s reign.<P>Much of the Avesta is said to have been destroyed by the Khalffah \'Umar\'s orders when Persia was conquered by the Arabs after the battle of Nahavand (642 AD). Certainly \'Umar ordered the destruction of Persian libraries, as we learn from the Kashfu\'z Zunun (p. 341).<P>V. Pahlavi.<P>1. Literature:<P>Under ancient Persian literature may be classed the Pahlavi<P>(a) inscriptions of Sapor at Hajiabad and elsewhere,<P>(b) legends on Sasanian coins,<P>(c) translations of certain parts of the Avesta, made under the Sasanides for the most part,<P>(d) such books as the Arta Viraf Namak, the Zad Sparam, Dinkart, Ormazd Yasht, Patet, Bundishnih, etc.<P>These are mostly of religious import. The Arta Viraf Namak gives a description of the visit of the young dastur Arta Viraf, to the Zoroastrian heaven. The Bundihishnih ("creation") tells how Ormazd and Ahriman came into being, and treats of the 9,000 years\' struggle between them. Pahlavi, as written (the so-called Huzvaresh), contains an immense number of Aramaic words, but the Persian terminations attached to these show that they were read as Persian: thus yehabunt-ano is written, and dat-ano ("to give") is read. Pahlavi works that are no longer extant are the sources of the Vis o Ramin, Zaratusht Namah, Shahnamah, etc.<P>2. Comparison:<P>In order to understand the relation in which the Persian dialects and stages in the history of the language stand to one another, it may be well to subjoin a list of words in Old Persian, Avestic, Pahlavi and modern Persian. It will be seen that Ayestic is not the source of the Aryan part of the present tongue.<P>MEANING AVESTIC OLD PERSIAN PAHLAVI MODERN PERSIAN<P>Friend.... zusta daushta dost dust<P>Hand...... zasta dasta dast dast<P>Bactreia.. Bakhdhi Bakhtri Bahr Balkh<P>Straight.. drva(sta)@@ duruva(sta) drust durust<P>Greatest.. mazista@@ mathishta mahist mahin Most right razista@@ rasta rast rast<P>Abode..... nmana maniya man man-dan ("to remain")<P>(Gathic<P>demana)<P>@@superlatives<P>LITERATURE.<P>Achaemenian inscriptions, Korsowitz, Spiegel, Rawlinson: Geiger and Kuhn (editors), Grundriss der iranischen Philologie; Darmesteter, Etudes iraniennes; Spiegel, Eranische Altertumskunde; Noldeke, Aufsatze zur persischen Geschichte; W. Geiger, Ostiranische Kultur im Alterium; Geldner\'s edition of Avesta; Professor Browne, Literary History of Persia; De Harlez, Manuel de la langue de l\' Avesta, Manuel de la langue Pehlevie, and Introduction to the Avesta; Haug, Book of Artd Viraf; Cook, Origins of Religion and Language.``175';
isbe[6829]='Persian Religion (Ancient)`<b>I. BEFORE ZOROASTER</b><P class="in15">1. Early Aryan Religion<P class="in15">2. Avesta and Rig-Veda<P class="in15">3. The Creator<P><b>II. ZOROASTRIANISM</b><P class="in15">1. Leading Principle<P class="in15">2. Not Monotheistic<P class="in30">(1) Darius and Xerxes<P class="in30">(2) Ahura Mazda<P class="in15">3. Objects of Worship<P class="in15">4. Anro Mainyus and His Creatures<P class="in15">5. Production versus Destruction Fertility<P class="in15">6. Contest between Ormazd and Ahriman<P class="in15">7. Ethics<P class="in15">8. Sacred Thread<P class="in15">9. Early Traditions<P class="in15">10. The Earth<P class="in15">11. Heaven and Hell<P class="in15">12. Interment<P class="in15">13. Worship<P class="in15">14. The Magi<P class="in15">15. Eschatology<P class="in15">16. Hebrew and Christian Influence<P class="in15">17. No Virgin Birth<P><b>LITERATURE</b><hr /><P>I. Before Zoroaster.<P>1. Early Aryan Religion:<P>There are clear indications in the Avesta that the religion of the Medes and Persians before Zoroaster\'s time agreed in most respects with that of the Indian Aryans, and in a less degree with the beliefs of the Aryans in general. All the Aryan tribes in very ancient times showed great respect for the dead, though they carefully distinguished them from the gods (compare Rig-Veda X, 56, 4). The latter were principally the powers of Nature, the wind, fire, water, the sky, the sun, the earth, and a host of personifications. The procreative powers in Nature, animate and inanimate, seeming to be the source of animal and vegetable life, received adoration, which ultimately led to unspeakable corruption. Herodotus tells us that the Persians in his time worshipped the sun, moon, sky, earth, fire, wind and water (i.131). Offerings to the gods were laid on a mass of pomegranate twigs (baresman; Sanskrit, barhis), and the flesh of victims was boiled, not burnt. Libations of haoma-juice were poured out, just as in India the soma was the drink of both gods and their worshippers.<P>2. Avesta and Rig-Veda:<P>A comparison between the spiritual beings mentioned in the Avesta and those spoken of in the Rig-Veda is most instructive in two ways. It shows that the original religion of the Iranians and of the Indian Aryans agreed very closely; and it also enables us to realize the immensity of the reformation wrought by Zoroaster. Many of the names of supernatural beings are practically the same; e.g. Indra (Indra, Andra), Mitra (Mithra), Aryaman (Airyaman), Asura (Ahura), Apam Napat (Apam Napat), Tvashtri (? Tishtrya), Rama (Raman), Vayu (Vayu), Vata (Vata). So are many words of religious import, as Soma (Haoma), Mantra (Mathra), Hotra (Zaotar). The Yama of India is the Yima of Persia, and the father of the one is Vivasvat and that of the other Vivanhat, which is the same word with dialectic change. The Holy River of the Avesta, Aredhvi Sura, the Unstained (Anahita), is represented by the Sarasvati, the Ganga (Ganges) and other sacred streams worshipped in India. In Persia Atar (or Fire) is a son of Ahura Mazda (Yasna LXIV, 46-53), as Agni (equals Ignis) is of Tvashtri in the Rig-Veda. Armaiti is Ahura Mazda\'s daughter, as Saranyu in the Rig-Veda is the daughter of Tvashtri, the "Creator." The use of gomez (bovis urina) for purification is common to both India and Persia. Though the soma-plant is not now the same as the haoma, the words are the same, and no doubt they at one time denoted one and the same plant. Many of the myths of the Avesta have a great resemblance to those of the Rig-Veda. This comparison might be extended almost indefinitely.<P>In another respect also there is an important agreement between the two. Though some 33 deities are adored in the Vedic Hymns, yet, in spite of polytheism and low ideas of the divine, traces of something higher may be found. Varuna, for instance, represents a very-lofty conception. In the closest connection with him stands Asura, who is a being of great eminence, and whose sons are the gods, especially the Adityas.<P>3. The Creator:<P>Tvashtri again is creator of heaven and earth and of all beings, though his worship was ultimately in Vedic times displaced by that of Indra. It is clear then that the Indian Aryans were worshippers of the Creator and that they knew something of Him long before they sank into polytheism. In the Avesta and in the Persian cuneiform inscriptions alike, Ahura Mazda occupies much the same position as Varuna, Asura (the same word as Ahura), or Tvashtri in the Rig-Veda, or rather in the ancient belief of which traces are retained in the latter work. Hence, as the Avesta teaches, Zoroaster was not for the first time preaching the existence of Ahura Mazda, but he was rather endeavoring to recall his people to the belief of their ancestors, the doctrine which Ahura Mazda had taught Yima in primeval time in his first revelation (Vendidad II, 1-16, 42). The great truth of the existence of the Creator, testified to by tradition, reason and conscience, undoubtedly contributed largely to Zoroaster\'s success, just as a similar proclamation of the God Most High (Allah ta\'ala\'), worshipped by their ancestors, helped the thoughtful among the Arabs in later years to accept Muhammad\'s teaching. The consciousness in each case that the doctrine was not new but very ancient, materially helped men to believe it true.<P>II. Zoroastrianism.<P>1. Leading Principle:<P>The reformation wrought by Zoroaster was a great one. He recognized—as Euripides in Greece did later—that "if the gods do aught shameful, they are not gods." Hence, he perceived that many of the deities worshipped in Iran were unworthy of adoration, being evil in character, hostile to all good and therefore to the "All-Wise" Spirit (Ahura Mazda) and to men. Hence, his system of dualism, dividing all beings, spiritual or material, into two classes, the creatures of Ahura Mazda and those of the "Destroying Mind" (Anro Mainyus). So many of the popular deities were evil that Zoroaster used the word daeva (the same as deva, deus, and Aramaic di) to denote henceforth an evil spirit, just as Christianity turned the Greek daimones and daimonia (words used in a good sense in classical authors) into "demons." Instead of this now degraded word daeva, he employed baga (Old Persian; Av. bagha, Vedic bhaga, "distribution," "natron" "lord") for "God."<P>2. Not Monotheistic:<P>But, it must be remembered that Zoroaster did not teach monotheism. Darius says that "Auramazda and the other gods that there are" brought him aid (Beh. Inscr., IV, 60-63), and both he and Xerxes speak of Auramazda as "the greatest of the gods." So, even in the first Gatha, Zoroaster himself invokes Asha, Vohu-Mano, maiti, Sraosha, and even Geus-urvan ("the Soul of the Bull"), as well as Ahura Mazda.<P>(1) Darius and Xerxes.<P>Darius mentions the "clan-gods," but does not name any of them. He and Xerxes ascribe the creation of heaven and earth to Auramazda, and say that the latter, "Who made this earth, who made yon sky, who made man, who made happiness for man," has appointed each of them king. It is "by the grace of Auramazda" (vashna Auramazdaha) that Darius conquers his enemies. But both Artaxerxes Mnemon and Artaxerxes Ochus couple Mithra and Anahata (Anahita) with Auramazda (Ahura Mazda) in praying for the protection of the empire.<P>(2) Ahura Mazda.<P>In the Avesta, Ahura Mazda is one of the seven Amesha spentas or "Bountiful Immortals." He is the father of one of them, Spentas Armaiti, who is also his spouse. He is primus inter pares among them, their chief, but by no means the only god. Monotheism is distinctly taught in later Zoroastrian works, for instance, in the Zaratusht-Namah, composed 1278 AD, but it is due to Christian and Islamic influence.<P>3. Objects of Worship:<P>The modern Zoroastrian view, clearly stated in the Dasatir i Asmani and elsewhere, that all the good creatures of Ormazd (Ahura Mazda) are entitled to adoration, undoubtedly rests upon the Avesta. There we find, in the first place, the Amesha Spentas, who occupy in regard to Mazda the same position as do the Vedic Adityas toward Varuna, though not one of the Adityas is identical with any of the Amesha Spentas.<P>The names of these are: (1) Ahura Mazda (otherwise called Spento Mainyus or "Bountiful Mind");<P>(2) Vohu Mano ("Good Mind");<P>(3) Asha Vahista ("Best Righteousness");<P>(4) Khshathra Vairya ("Excellent Ruler");<P>(5) Spenta Amaiti ("Bounteous Piety");<P>(6) Haurvatat ("Health");<P>(7) Ameretat ("Immortality").<P>Each has a special province: thus Armaiti is the general spirit of earth and presides over its fruitfulness. She is the troness of virtuos matrons. Khshathra is the guardian of metals. Vohu Mano guards sheep and cattle and introduces to Ahura Mada the spirits of the just. Next in rank come the Yazatas ("Worshipful Ones"), of whom there are a large number. Three of them, Mithra, Rashnu and Sraosha, preside at the judgment of the dead on the 4th day from death. Rashnu holds the scales in which a man\'s deeds are weighed. Sraosha guards the soul during the first three nights after death. Airyaman Ishya ("the longed-for comrade") is the protector of mankind, the bestower of peace and happiness. On one occasion (Vend., Farg. XXII, 23-29) Ahura Mazda sends his messenger Nairyo Sanha ("male instructor") to ask his aid against overwhelming odds. Riman Hvastra, the bosom friend of Mithra, presides over the atmosphere and also gives its taste to food. Mithra is the genius of truth, possessed of 1,000 ears, and riding in a single-wheeled chariot (the sun), while darting golden darts and driving fiery steeds. Tishtrya, identified with the dog-star Sirius, sends rain and is by Ahura Mazda endowed with his own power and dignity (Yasht VIII, 52ff). This is true of Mithra also (Yasht X, 1) Atar ("Fire"), Vayu ("Air"), Vata ("Wind"), Verethraghna ("Mars"), Saoka ("Prosperity"), Aratat (genius of Justice), Vizista ("Lightning"), Fradatfshu (the guardian of cattle), Berejya (genius of grain), Cista and Daena ("Knowledge" and "Religion"), who are others of the Yazatas. All these are entitled to worship at the hands of the true adorer of Mazda (Mazdayasna, opposed to Daevayasna, or worshipper of the demons).<P>4. Anro Mainyus and His Creatures:<P>In opposition to the creatures of Ahura Mazda are those of Anro Mainyus, who is the source of all moral and material evil. The first chapter of the Vendidad tells how he created something bad in opposition to everything good made by Ahura Mazda.<P>A demon is the adversary of each Amesha Spenta: Aka Mano ("Evil Mind") that of Vohu Mano, and so in order: Indra (or Andra, "demon of untruthfulness"), Saurva ("evil government") Nonhaithya ("discontent"), Tauru ("who poisons water") and Zairi ("poison"), being antagonistic to the other Bountiful Immortals. Aeshma-Daeva ("Demon of Wrath")—the Asmodeus of Tobit 3:8—is the special foe of Sraosha, the genius of obedience. Apaosha, demon of drought, is the enemy of Tishtrya. Buiti (or Buidhi) teaches men to worship idols, and also causes death. Bushyasta is the demon of sloth. Vidhatus or Astuvidhstus causes death by destroying the body. Other evil beings, Drujes, Pairikas, Jainis, Yatus, are so numerous in the later parts of the Avesta that a pious Zoroastrian must have lived in continual dread of their assaults. He had even to conceal the parings of his nails, lest they should be used as darts to his injury by these his spiritual foes.<P>5. Production versus Destruction:<P>Holiness does not enter into Zoroaster\'s conception of the divine nature. This is a point to which attention has not yet been properly directed, though its importance can hardly be exaggerated. The epithet Spenta, often applied to Ahura Mazda and mistranslated "Holy," is by the Zoroastrians themselves in Pahlavi rendered afzunik, i.e. "that causes increase." Its (?) span or spen equals (Sanskrit) svi, "to swell," "to grow," "to increase." The opposite to this is the term anro (angro, from (?) angh; compare German eng, "narrow") to the Evil Spirit, and denoting "narrowing," "decreasing," "destroying." Hence, as the Destroyer, he is styled pourumahrka, "full of death."<P>Fertility.<P>Ahura Mazda and his assistants promote life, fertility in man, beast and plant, agriculture, increase; while Ahro Mainyus and his creatures cause destruction and death. Atar ("Fire"), also styled Apam Napat ("Offspring of the Waters"), is the vital flame and the male energy in the world; Aredhvi Sura Anahita is the female. As a river the latter flows from Mt. Hukairya, a peak in the Elburz Range (Yasna LXIV), into the Caspian Sea (Vourukasha) in the midst of which grows the tree Hvapa ("well watered") which bears the seeds of all plants. Anahita means "\'undefiled," but it is applied to purity of water (to defile any of the four "elements" was, for later Zoroastrians, a grievous sin) and not to any moral purity in the goddess. Her association with Mithra was close, even in Herodotus time, for he falls into the mistake of saying (i.131) that the Persians called Aphrodite Mithra, when he should have said Anaitis (Anahita). Though god of truth and righteousness Mithra is not associated with moral purity (chastity). On the contrary, he was said to fertilize the earth with his rays, as sun-god, and Anahita as goddess of fruitfulness represented the female principle in conjunction with him. The vileness which led to the identification of Anahita with the Babylonian Mylitta was doubtless of later date than Zoroaster\'s time, yet there was little or nothing in Zoroastrianism to check it. Something similar asserts itself in Armenia, as well as in Iran, and in fact in all Nature-worship everywhere. Associated with this was the form of incest known as next-of-kin marriage (Av. Hvaetva-datha, Pahl. Khvetukdas), which permitted and encouraged marriages between brothers and sisters.<P>6. Contest between Ormazd and Ahriman:<P>According to later Zoroastrian belief, the contest between Ormazd (Ahura Mazda) and Ahriman (Anro Mainyus), after continuing for 9,000 years, is to be decided in favor of the former only through his possessing foreknowledge and Ahriman\'s lacking it (Bund., I). Both came into existence independently in limitless time (Av. Zrvana Akarana; Vend., Farg. XIX, 13; Pahl. Daman i Akandrakhom-and, Bund., I), which, personified in the Vendidad, is called "Self-created," and is there by Ahura Mazda\'s command invoked by Zoroaster in conjunction with Vayu, the Air, the Winds, "the bountiful, beauteous daughter of Ahura Mazda" (Armaiti), the Earth, and other objects of worship (loc. cit.). No creature of Ahriman is to be worshipped; hence, Indra, though in later Vedic times rising in India to a leading position in the Pantheon, is in the Avesta accounted a fiend, the very impersonation of the Lie which the Avesta so firmly denounces and which Darius mentions as the cause of all the rebellions, which produced so much bloodshed in his time. No virtue was valued so highly as truth in ancient Iran, as Herodotus agrees with the Avesta in testifying.<P>7. Ethics:<P>Avestic morality encourages the destruction of all hurtful things, as being of Anro Mainyus\' creation, and the propagation of everything good. Hence, agriculture is especially commended, together with the rearing of cattle and sheep. Somewhat later the whole duty of man was said to consist in good thoughts, good words, good deeds. Fierce opposition to every other religion was enjoined as a religious duty, and, under the Sasanides especially, this led to fearful and repeated persecutions of Christians throughout the empire.<P>8. Sacred Thread:<P>The Sacred Thread (Av. Aiwyonhana; Skt. Upavitam, etc., now by the Parsis styled the Kushti) plays as important a part in Zoroastrianism as in Hinduism. So do charms, mathras (Sanskrit, mantras), consisting in repetitions of the verses of the Avesta. The latter is even adored.<P>9. Early Traditions:<P>The first thing created by Ahura Mazda was a Bull, which may represent the earth, and reminds us of the Cow Audhumla in the Edda (Gylfaginning VI). This was killed Traditions by Anro Mainyus (in a later version, by Mithra). His spirit (Geus Urvan) went to heaven and became the guardian of cattle. The first man was Gaya-maretan ("Mortal Life"); hence, the phrase Haca Gayat Marethnat a Saosh-yantat, "from Gaya-maretan (Gayomard), Kayomarth) to Saoshyant" (Yasna XXVI, 10; Yasht XIII, 145), means "from the beginning to the end of the world." From the Airyanem Vaejo ("Aryan germ"), the first home of the Iranians, men were compelled to migrate because Anro Mainyus so altered the climate that the winter became ten months long and the summer only two. Yima Khshaeta ("Yima the Brilliant," Persian, Jamshid), son of Vivanhat, though he twice refused Ahura Mazda\'s commission to guard his creatures, and though by three lies he lost the "Royal Light" (Chvareno Kavaem) which he originally possessed, was yet directed to prepare a very extensive enclosure (Vara), in which he preserved "the seeds of sheep and cattle, of men, of dogs, of birds, and of red, glowing fires" from some terribly severe winters which came upon the earth (Vendidad II; Yasht XIX). The Bundihishnih tale of a flood differs from this, preserving an independent narrative. Ahura Mazda\'s law was preached to men within Yima\'s enclosure.<P>10. The Earth:<P>The earth consists of seven divisions, called Karshvares (compare the Sanskrit dvipas). Only one of these, Chvaniratha, is inhabited by men; the others are separated from it by impassable abysses. Sun, moon, and stars revolve round Mt. Taera, a peak in the Elburz Mountains (Demavend?). A later legend says that the Elburz Range surrounds the earth.<P>11. Heaven and Hell:<P>Each god and man possesses a fravashi, which has been compared to a guardian spirit and seems to differ from the soul (urvan). After judgment by Mithra, Rashnu and Sraosha, the souls of the dead must cross the Chinvat-bridge ("Bridge of the Judge"), which is guarded by two dogs and is narrow and difficult for the unjust, but wide and easy for the just. The righteous man then advances through three Paradises, those of Good Thoughts, Good Words and Good Works (Humata, Hukhta, Hvarsta: Yasht XVI; Arta Viraf Namak, VII IX), until, led by Sraosha, Atar, and Vohu Mano, he finally reaches Ahura Mazda\'s abode of light and glory, Garo-nmana (in Gathas, Garo-demana; Pahl. Garotman), where Ahura Mazda himself receives him with the words: "Greeting to thee; well hast thou come; from that mortal world hast thou come to this pure, bright place" (A. V. Namak, XI,8,9). But the soul of the wicked man, passing through regions of Evil Thoughts, Evil Words and Evil Deeds, finally reaches a dark and gloomy Hell (Duzhanh). In later times it was believed that those not yet fit for heaven waited in Misvana Gatus, an intermediate place where the extra merits of the just were stored up for the benefit of the less fortunate (Vend., Farg. XIX). A later name was Hamistakan. But De Harlez is of the opinion that this idea was borrowed from medieval Christianity.<P>12. Interment:<P>In primeval times the Persians buried or burned their dead. Zoroastrianism may have introduced the dakhma (Vendidad, passim) or Tower of Silence, on which bodies are exposed to be eaten by vultures. Those of which the ruins have been discovered at Al Hibbah are very ancient. But in Herodotus\' time it was usual, after permitting the flesh to be devoured by dogs and birds, to cover the bones with wax and bury them (Herodotus i.140). This was done to prevent them from coming in contact with and so polluting the earth. The custom of burial is proved by the tombs of the Achemenian kings near Persepolis, and that of Cyrus, a stone chamber raised high above the ground, at Pasargadae.<P>13. Worship:<P>Zoroastrianism permits no idol-worship and no temples, fire-altars only being used. These were served by Atharvans or fire-priests, who fed the fire with costly wood and poured into it libations of haomajuice, taking care to cover their mouths with a cloth (paiti-dhana) to keep the sacred fire from being polluted by their breath. Sacrifices were often offered on the tops of the highest mountains under the open sky (Herodotus i.132; Xen. Cyrop. viii).<P>14. The Magi:<P>The Magi doubtless owed their monopoly of priestly functions to their being Zoroaster\'s own tribe. They are not mentioned as priests in the Persian cuneiform inscriptions. Only once does the word. "Magus" occur in the Avesta, and then in composition (Moghu-tbish, a Magus-hater, Yasna LXV, 7). It is not necessary to trace to Babylonian influence the decay of Zoroastrianism and its degradation in late Achemenian times. This was at least in large measure due to a revival of the ideas and practices forbidden by Zoroaster, which reassert themselves in some parts of the Avesta, and which afterward gave rise to Mithraism.<P>15. Eschatology:<P>The Avesta states that, 1,000 years after Zoroaster\'s death, a prophet named Ukhshyat-ereta will arise from his seed to restore his religion. After another 1,000 years another, Ukhshyat-nemanh, will appear for the same purpose. The end of the world will come 1,000 years later. Then a third prophet, Saoshyant, will be born, and will usher in the Restoration (frasho-kereti) of the world to its primitive happiness and freedom from the evil creatures of Anro Mainyus. This process will be completed in 57 years, during which 6 other prophets will perform in the other 6 Karshvares the work which will here be accomplished by Saoshyant. But mention of this Restoration occurs only in very late parts of the Avesta (e.g. Vend., Farg. XVIII, 51). It does not mean Resurrection, as De Harlez has shown. Later still, something of the kind was believed, and in the Bundihishnih (chapter v) and the Patet (section 28) we have the word ristakhiz (from Av. irista, "departed," and chvis,"to rise"), which does mean "rising of the dead." But it can hardly be doubted that the doctrine is due to Hebrew and Christian influence, especially when we consider the late and uncertain date of the books in which the idea occurs.<P>16. Hebrew and Christian Influence:<P>Israelites settled in Media in large numbers in or about 730-728 BC under Sargon (<a onClick="return mV(\'2Ki\',17,6);">2Ki 17:6</a>), long before Zoroaster\'s birth. It is possible that his reformation may have owed much therefore to Hebrew influence.<P>See, further, <a href="./study/isbe/search.html?string=ZOROASTRIANISM">ZOROASTRIANISM</a>.<P>The idea of virgin birth has been asserted to occur in Zoroastrianism, both with reference to Zoroaster himself and to the last three great prophets of whom mention has been made. This is an error. The Avesta and all later Zoroastrian books speak of Zoroaster\'s birth as quite natural, his father being Pourushaspa. Nor is virgin birth referred to in the case of Saoshyant and the rest.<P>17. No Virgin Birth:<P>(Mater cuiusque ex iis, sese in lacu quodam lavans, Zoroastris semine illic reposito grayida facta filium pariet: Vend., Farg. XIX, 4-6; Yasht XIII, 128, 142; Bund., XXXII, 8, 9.) Virginity is not highly esteemed in the Avesta, though fornication is condemned.<P>LITERATURE.<P>Geldner\'s edition of text of Avesta; De Harlez, Avesta; Achemenian Inscriptions; Sacred Books of the East, volumes IV, XXIII, XXXI; Grassmann, Worterbuch zum Rig Veda; Haug and West, Arta Viraf Namak; Spiegel, Einleitung in die trad. Schriften der Parsen; Eranische Altertumskunde; Darmesteter, Etudes iraniennes; Haug, Essays on...Religion of Parsis; De Harlez, Manuel du Pehlavi; Cook, Origins of Religion and Language.`<a href="./study/isbe/search.html?string=ZOROASTRIANISM">ZOROASTRIANISM</a>`175';
isbe[6830]='Persians`pur\'-shanz, -zhanz (parac, also equals <a href="./study/isbe/search.html?string=PERSIA,+PERSIS">PERSIA, PERSIS</a> (which see); adjective parci Hebrew, and parcay, Aramaic.; Persai, adjective only in <a onClick="return mV(\'Neh\',12,22);">Ne 12:22</a>; <a onClick="return mV(\'Dan\',6,28);">Da 6:28</a>; Achaem. Persian Parsa, name of both country and people; does not occur in Avesta):<P><b>I. AFFINITY</b><P class="in15">1. Three Classes<P class="in15">2. Tribal and Clan Divisions<P class="in15">3. Achemenian Dynasty<P><b>II. CIVILIZATION</b><P class="in15">1. Writing<P class="in15">2. Institutions and Customs<P><b>III. HISTORY</b><P class="in15">1. Cyrus<P class="in15">2. Capture of Babylon<P class="in15">3. Cambyses<P class="in15">4. Pseudo-Smerdis<P class="in15">5. Darius I<P class="in15">6. Darius\' Suez Canal<P class="in15">7. Xerxes I<P class="in15">8. Artaxerxes II<P class="in15">9. Xerxes II<P class="in15">10. Later Persian Kings<P><b>IV. FIRST MENTION IN INSCRIPTIONS</b><P><b>LITERATURE</b><hr /><P>The Persians are not mentioned in the Bible until the exilic books (<a onClick="return mV(\'2Ch\',36,20,22,23);">2Ch 36:20,22,23</a>; <a onClick="return mV(\'Ezr\',1,1,2,8);">Ezr 1:1,2,8</a>; <a onClick="return mV(\'Ezr\',3,7);">3:7</a>; <a onClick="return mV(\'Est\',1,19);">Es 1:19</a>, etc.; <a onClick="return mV(\'Dan\',5,28);">Da 5:28</a>; <a onClick="return mV(\'Dan\',6,8,12,15,28);">6:8,12,15,28</a>), being previously included under the Medes (<a onClick="return mV(\'Gen\',10,2);">Ge 10:2</a>), as they were by Thucydides, and even by Xenophon often.<P>Archaemenes (Hakhamanish)<P>Teispes (Chaishpish, Sispis)<P>Cyrus Ariaramnes (Ariyaramna)<P>Cambyses Arsames (Arshama)<P>Cyrus the Great Hystaspes (Vishtaspa)<P>Cambyses Darius I<P>Xerxes I (Ahasuerus)<P>Artaxerxes I (Longimanus)<P>Xerxes II Sogdianus Darius II<P>(Nothos, Ochos)<P>Artaxerxes III (Ochos) (Sisygambis, a daughter)<P>Arses<P>Darius III (Codomannus)<P>(<a onClick="return mV(\'Neh\',12,22);">Neh. 12:22</a>; 1Macc. 1:1)<P>I. Affinity.<P>Being of the same stock as the Medes they shared the name Aryans (Achaem. ariya; Av. airya; Sanskrit, arya, "noble"); compare the Naqsh i Rustam Inscription, where Darius I calls himself "a Persian, son of a Persian, an Aryan, of Aryan descent" (II. 13, 14). Tradition assigns as their earliest known habitat the so-called Airyanem Vaejo ("Aryan germ"), a district between the Jaxartes and the Oxus (Vendidad I), whence they migrated gradually to what was afterward known as Persis (modern Fars), including probably part of Elam.<P>1. Three Classes:<P>The Avesta shows that the Medo-Pers community was divided into 3 classes (zantu): the Athravans or fire-priests, the Rathaestars or charioteers, and the Vastryafshuyans or cattle-rearers (compare the three original Hindu castes, the Brahmans, the Kshattriyas and the Vaisyas). A fourth class, the artisans or Hutis, came later. But these were classes, not castes.<P>2. Tribal and Clan Divisions:<P>They were also divided into tribes, clans (Achaem. vith; Av. vis; compare vicus) and families or households (Achaem. tauma; Av. nmana). Herodotus (i.125) mentions ten Persian tribes, the chief being the Pasargadae, to which belonged the Achemenian clan (phretre) which included the royal family. This dynasty traced its origin to Achaemenes (Chakhamanish) according to Darius and Herodotus.Oxus (Vendidad I), whence they migrated gradually to what was afterward known as Persis (modern Fars), including probably part of Elam.<P>3. Achemenian Dynasty:<P>The following scheme will serve to show the descent of the line of Persian kings mentioned in the Bible and in secular history up to the time of the fall of the dynasty in 331 BC.<P>II. Civilization.<P>1. Writing:<P>The Persians had indulged less in luxury than the Medes, until their conquest of Media and other lands under Cyrus the Great gave them the opportunity, which they were not slow to embrace, being famed for their readiness to adopt foreign customs. Writing was introduced from Babylonia through Elam.<P>2. Institutions and Customs:<P>This cuneiform character was afterward superseded by one derived from Syria, from which came the Avestic writing, which, in its corrupt Pahlavi form, lasted until the Arabian conquest imposed the Arabic character on the people. The Achemenian kings probably borrowed from Babylon and further developed their system of royal posts (<a onClick="return mV(\'Est\',8,14);">Es 8:14</a>) or messengers (and even the words aggaroi, and astandai, used to denote them, are almost certainly Babylonian). Of these men\'s pace it was said, "No mortal thing is quicker." The custom of showing special honor to the "Benefactors of the King" (Herodotos viii.85: orosaggai equals Av. uru plus sanh, "widely renowned") is referred to in <a onClick="return mV(\'Est\',6,1,2,3);">Es 6:1,2,3</a>, and that of covering the (head and) face of a criminal condemned to death (with a large black cap) (<a onClick="return mV(\'Est\',7,8,9);">Es 7:8,9</a>) occurs in the Shahnamah also.<P>(1) The King.<P>The king was an arbitrary ruler with unlimited power, the council of seven princes who stood nearest to the throne (<a onClick="return mV(\'Est\',1,14);">Es 1:14</a>; compare Herodotos iii. 70-84) having no share in the government.<P>(2) The Army.<P>As soldiers, the Persians were famous as archers and javelin-throwers; they were also skilled in the use of the sling, and above all in riding. Boys were taken from the women\'s into the men\'s part of the house at the age of 5, and were there trained in "riding, archery and speaking the truth" until 20 years old. In Darius\' inscriptions, as well as in the Avesta, lying is regarded as a great crime.<P>(3) Marriage.<P>The Persians practiced polygamy, and marriages between those next of kin were approved of. Pride and garrulity are mentioned as distinctive of the Persian character.<P>III. History.<P>1. Cyrus:<P>Persian history, as known to us, begins with Cyrus the Great. His ancestors, for at least some generations, seem to have been chiefs or "kings" of Anshan, a district in Persia or Elam. Cyrus himself (Western Asiatic Inscriptions, V, plate 35) gives his genealogy up to and including Teispes, entitling all his ancestors whom he mentions, kings of Anshan. Phraortes, king of the Medes, is said to have first subjugated the Persians to that kingdom about 97 years before Cyrus (Herodotus i.102). Cyrus himself headed his countrymen\'s revolt against Astyages, who advanced to attack Pasargadae (549 BC). His army mutinied and surrendered him to Cyrus, whom the Greeks held to be his grandson on the mother\'s side. Cyrus, becoming supreme ruler of both Medes and Persians, advanced to the conquest of Lydia. He defeated and captured Croesus, overran Lydia, and compelled the Greek colonies in Asia Minor to pay tribute (547 BC).<P>2. Capture of Babylon:<P>He overthrew the Sute (Bedouin) across the Tigris the following year, and was then invited by a large party in Babylonia to come to their help against the usurper Nabunahid, whose religious zeal had led him to collect as many as possible of the idols from other parts of Babylonia and remove them to Babylon, thereby increasing the sacredness and magnificence of that city but inflicting injury on neighboring and more ancient sanctuaries. Defeating Nabunahid\'s army and capturing the king, Cyrus sent his own forces under Gobryas (Gubaru, Gaubaruva)to take possession of Babylon. This he did in June,538,"without opposition and without a battle." The citadel, however, where Belshazzar "the king\'s son" was in command, held out for some months, and was then taken in a night attack in which "the king\'s son" was slain. Cyrus made Gobryas viceroy of Chaldea, and he "appointed governors in Babylonia (Cyrus\' "Annalistic Tablet"). When Gobryas died within the year, Cyrus\' son Cambyses was made viceroy of the country, now become a province of the Persian empire. Cyrus restored the gods to their sanctuaries, and this doubtless led to permission being given to the Jews to return to Jerusalem, taking with them their sacred vessels, and to rebuild their temple. Cyrus was killed in battle against some frontier tribe (accounts differ where) in 529 BC. His tomb at Murghab, near the ruins of Pasargadae, is still standing.<P>3. Cambyses:<P>Cyrus\' son and successor, Cambyses, invaded Egypt and conquered it after a great battle near Pelusium (525 BC). During his absence, a Magian, Gaumata, who pretended to be Smerdis (Bardiya), Cambyses\' murdered brother, seized the throne. Marching against him, Cambyses committed suicide.<P>4. Pseudo-Smerdis:<P>After a reign of 7 months, the usurper was overthrown and slain by Darius and his 6 brother-nobles (their names in Herodotus iii.70 are confirmed with one exception in Darius\' Besitun Inscription, column iv, 80-86). Darius became king as the heir of Cambyses (521 BC). But in nearly every part of the empire rebellions broke out, in most cases headed by real or pretended descendants of the ancient kings of each country.<P>5. Darius I:<P>After at least 3 years\' struggle Darius\' authority was firmly established everywhere. He then divided the empire into satrapies, or provinces (dahyava), of which there were at first 23 (Beh. Inscription, column i, 13-17), and ultimately at least 29 (Naqsh i Rustam Inscription, 22-30). Over these he placed satraps of noble Persian or Median descent, instead of representatives of their ancient kings. His empire extended from the Indus to the Black Sea, from the Jaxartes to beyond the Nile.<P>6. Darius\' Suez Canal:<P>Darius united the latter river with the Red Sea by a canal, the partly obliterated inscription commemorating which may perhaps be thus restored and rendered: "I am a Persian; with Persia I seized Egypt. I commanded to dig this canal from the river named the Nile (Pirava), which flows through Egypt, to this sea which comes from Persia. Then this canal was dug, according as I commanded. And I said, \'Come ye from the Nile through this canal to Persia.\' " Darius\' expedition into Scythia, his success in subduing the rebellion among the Asiatic Greeks, his attempts to conquer Greece itself and his overthrow at Marathon (499-490 BC) are part of the history of Greece. A rebellion in Egypt had not been repressed when Darius died in 485 BC.<P>7. Xerxes I:<P>Xerxes I, who succeeded his father, regained Egypt, but his failure in his attempts to conquer Greece largely exhausted his empire. In 464 BC he was murdered. His son Artaxerxes I, surnamed "the longarmed," succeeded him, being himself succeeded in 424 BC by his son Xerxes II, who was murdered the following year. This ended the legitimate Achemenian line, the next king, Darius II (styled Nothos, or "bastard," as well as Ochos), being one of Artaxerxes\' illegitimate sons (we pass over Sogdianus\' brief reign).<P>8. Artaxerxes II:<P>Artaxerxes II, Mnemon, succeeded his father and left the throne to his son Artaxerxes III, Ochos. The latter was murdered with all his sons but the youngest, Arses, by an Egyptian eunuch Bagoas, probably in revenge for Artaxerxes\' conduct in Egypt (338 BC).<P>9. Xerxes II:<P>Arses was murdered by Bagoas 3 years later, when Darius III, Codomannus, the son of Sisygambis, daughter of Artaxerxes II, and her husband, a Persian noble, ascended the throne.<P>10. Later Persian Kings:<P>Darius was completely overthrown by Alexander the Great in the battle of Gaugamela or Arbela, 331 BC, and shortly after fell by an assassin\'s hand. This ended the Persian empire of the Achaemenides, the whole of the lands composing it becoming part of the empire of Macedon.<P>IV. First Mention in Inscriptions.<P>Persia (Parsua) is first mentioned as a country in an inscription of Rammanu Nirari III (WAI, I, plate 35, <span class="noTag">number 1</span>, l. 8), who boasts of having conquered it and other lands (he reigned from 812 to 783 or from 810 to 781 BC).<P>LITERATURE.<P>Besides the main authorities mentioned in the text, we learn much from Spiegel, Die Altper-sischen Keilinschriften, Arrian, Thucydides, Polybius, Strabo, Curtius.``175';
isbe[6831]='Persis`pur\'-sis (Persis): The name of a female member of the Christian community at Rome, to whom Paul sent greetings (<a onClick="return mV(\'Rom\',16,12);">Ro 16:12</a>). Paul designates her "the beloved, who labored much in the Lord." The name is not found in inscriptions of the imperial household, but it occurs as the name of a freedwoman (CIL, VI, 23, 959).``1';
isbe[6832]='Person of Christ, 1-3`Method of the Article<P><b>I. THE TEACHING OF PAUL</b><P class="in15">1. <a onClick="return mV(\'Phl\',2,\'5-9\');">Philippians 2:5-9</a><P class="in30">(1) General Drift of Passage<P class="in30">(2) our Lord\'s Intrinsic Deity<P class="in30">(3) No Examination<P class="in30">(4) our Lord\'s Humanity<P class="in15">2. Other Pauline Passages<P><b>II. THE TEACHING OF THE EPISTLE TO THE HEBREWS</b><P class="in15"><a onClick="return mV(\'Hbr\',2,1);">Hebrews 2:1</a>ff<P class="in30">(1) Background of Express Deity<P class="in30">(2) Completeness of Humanity<P class="in30">(3) Continued Possession of Deity<P><b>III. THE TEACHING OF OTHER EPISTLES</b><P><b>IV. THE TEACHING OF JOHN</b><P class="in15">1. The Epistles<P class="in15">2. Prologue to the Gospel<P class="in30">(1) The Being Who Was Incarnated<P class="in30">(2) The Incarnation<P class="in30">(3) The Incarnated Person<P class="in15">3. The Gospel<P><b>V. THE TEACHING OF THE SYNOPTIC GOSPELS</b><P><b>VI. THE TEACHING OF JESUS</b><P class="in15">1. The Johannine Jesus<P class="in30">(1) His Higher Nature<P class="in30">(2) His Humiliation<P class="in15">2. The Synoptic Jesus<P class="in30">(1) His Deity<P class="in45">(a) <a onClick="return mV(\'Mar\',13,32);">Mark 13:32</a><P class="in45">(b) Other Passages: Son of Man and Son of God<P class="in45">(c) <a onClick="return mV(\'Mat\',11,27);">Matthew 11:27</a>; <a onClick="return mV(\'Mat\',28,19);">28:19</a><P class="in30">(2) His Humanity<P class="in30">(3) Unity of the Person<P><b>VII. THE TWO NATURES EVERYWHERE PRESUPPOSED</b><P><b>VIII. FORMULATION OF THE DOCTRINE</b><P><b>LITERATURE</b><hr /><P>Method of the Article:<P>It is the purpose of this article to make as clear as possible the conception of the Person of Christ, in the technical sense of that term, which lies on—or, if we prefer to say so, beneath—the pages of the New Testament. Were it its purpose to trace out the process by which this great mystery has been revealed
