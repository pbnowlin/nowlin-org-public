isbe[6863]='Phaltiel`fal\'-ti-el (palti\'el; Syriac "Psaltiel"; Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) and the King James Version Salathiel): "The captain of the people" who came to Esdras between his first and second vision (2Esdras 5:16). Fritzsche (Libri Apocrypha vet. test.) reads "Phalthiel."`<a href="./study/isbe/search.html?string=PALTIEL">PALTIEL</a>`1';
isbe[6864]='Phanuel`fan-u\'-el, fan\'-u-el (penu\'el, "vision of God"; Phanouel): Parent of Anna (<a onClick="return mV(\'Luk\',2,36);">Lu 2:36</a>).`<a href="./study/isbe/search.html?string=PENIEL">PENIEL</a>`1';
isbe[6865]='Pharakim`far\'-a-kim (Pharakeim Codex Vaticanus Pharakem; the King James Version Pharacim): One of the families of temple-servants who returned with Zerubbabel (1Esdras 5:31; not found in Ezra or Nehemiah).``1';
isbe[6866]='Pharaoh`fa\'-ro, fa\'-ra-o (par\'oh; Pharao); Egyptian per aa, "great house"):em; the King James Version Pharacim): One of the families of temple-servants who returned with Zerubbabel (1Esdras 5:31; not found in Ezra or Nehemiah).<P>1. The Use of Name in Egypt:<P>Many and strange differences of opinion have been expressed concerning the use of this name in Egypt and elsewhere, because of its importance in critical discussions (see below). Encyclopaedia Biblica says "a name given to all Egyptian kings in the Bible"; it also claims that the name could not have been received by the Hebrews before 1000 BC. HDB (III, 819) says that a letter was addressed to Amenhotep as "Pharaoh, lord of," etc. According to Winckler\'s theory of a North Arabian Musri, it was the Hebrews alone in ancient times who adopted the term Pharaoh from the Egyptians, the name not being found even in the Tell el-Amarna Letters or anywhere else in cuneiform literature for the king of Egypt. Such a result is obtained according to Winckler\'s theory by referring every reference in cuneiform to "Pir\'u, king of Musri" to the North Arabian country.<P>In Egyptian inscriptions the term "Pharaoh" occurs from the Pyramid inscriptions onward. At first it is used with distinct reference to its etymology and not clearly as an independent title. Pharaoh, "great house," like Sublime Porte, was applied first as a metaphor to mean the government. But as in such an absolute monarchy as Egypt the king was the government, Pharaoh was, by a figure of speech, put for the king. Its use in Egypt clearly as a title denoting the ruler, whoever he might be, as Caesar among the Romans, Shah among Persians, and Czar among Russians, belongs to a few dynasties probably beginning with the XVIIIth, and certainly ending not later than the XXIst, when we read of Pharaoh Sheshonk, but the Bible does not speak so, but calls him "Shishak king of Egypt" (<a onClick="return mV(\'1Ki\',14,25);">1Ki 14:25</a>). This new custom in the use of the title Pharaoh does not appear in the Bible until we have "Pharaoh-necoh." Pharaoh is certainly used in the time of Rameses II, in the "Tale of Two Brothers" (Records of the Past, 1st series, II, 137; Recueil de Travaux, XXI,13,l. 1).<P>2. Significance of Use in the Bible:<P>It appears from the preceding that Biblical writers use this word with historical accuracy for the various periods to which it refers, not only for the time of Necoh and Hophra, but for the time of Rameses II, and use the style of the time of Rameses II for the time of Abraham and Joseph, concerning which we have not certain knowledge of its use in Egypt. It is strongly urged that writers of the 7th or 5th century BC would not have been able to make such historical use of this name, while, to a writer at the time of the exodus, it would have been perfectly natural to use Pharaoh for the king without any further name; and historical writers in the time of the prophets in Palestine would likewise have used Pharaoh-necoh and Pharaoh Hophra. This evidence is not absolutely conclusive for an early authorship of the Pentateuch and historical books, but is very difficult to set aside for a late authorship (compare <a onClick="return mV(\'Gen\',12,\'14-20\');">Ge 12:14-20</a>; <a onClick="return mV(\'Gen\',41,14);">41:14</a>; <a onClick="return mV(\'Exd\',1,11);">Ex 1:11</a>; <a onClick="return mV(\'Exd\',3,11);">3:11</a>; <a onClick="return mV(\'1Ki\',3,1);">1Ki 3:1</a>; <a onClick="return mV(\'1Ki\',14,25);">14:25</a>; <a onClick="return mV(\'2Ki\',23,29);">2Ki 23:29</a>; <a onClick="return mV(\'Jer\',44,30);">Jer 44:30</a>; also <a onClick="return mV(\'1Ki\',11,19);">1Ki 11:19</a>; <a onClick="return mV(\'2Ki\',18,21);">2Ki 18:21</a>; <a onClick="return mV(\'1Ch\',4,18);">1Ch 4:18</a>).``93';
isbe[6867]='Pharaoh Hophra`hof\'-ra (par\'oh chophra\'; Houaphre):<P>1. Sole King, 589-570 BC:<P>He is so called in Scripture (<a onClick="return mV(\'Jer\',44,30);">Jer 44:30</a>); Herodotus calls him Apries (ii.169). He is known on the monuments as Uah \'ab \'ra]. He was the son of Psammetichus II, whose Greek mercenaries have left in scriptions upon the rocks of Abu-Sim-bel, and the grandson of Pharaoh-necoh. He reigned alone from 589 BC to 570 BC, and jointly, by compulsion of his people, with his son-in-law Aahmes (Greek Amasis) for some years longer.<P>2. Alliance with Zedekiah:<P>No sooner had he mounted the throne than he yielded to the overtures of Zedekiah of Judah, who thought Hophra\'s accession a good opportunity for throwing off the yoke of Babylon. So, as Ezekiel says (<a onClick="return mV(\'Eze\',17,15);">17:15</a>), "he rebelled against him (Nebuchadrezzar) in sending his ambassadors into Egypt, that they might give him horses and much people." Zedekiah had entered into the intrigue against the advice of Jeremiah, and it proved fatal to Zedekiah and the kingdom. Nebuchadrezzar was not slow to punish the disloyalty of his vassal, and in a brief space his armies were beleaguering Jerusalem. The Egyptians did indeed march to the relief of their allies, and the Chaldeans drew off their forces from Jerusalem to meet them. But the Egyptians returned without attempting to meet the Chaldeans in a pitched battle, and Jerusalem was taken, the walls broken down and the temple burnt up with fire.<P>3. Reception of Jeremiah and Jewish Captives:<P>When Jerusalem had fallen and Nebuchadrezzar\'s governor, Gedaliah, had been assassinated, the dispirited remnant of Judah, against the advice of Jeremiah, fled into Egypt, carrying the prophet with them. They settled at Tahpanhes, then Daphnae (modern Tell Defenneh), now identified with a mound bearing the significant name of Qatsr Bint el Yahudi, "the palace of the Jew\'s daughter." Here Pharaoh had a palace, for Jeremiah took great stones and hid them in mortar in the brickwork "which is at the entry of Pharaoh\'s house at Tahpanhes," and prophesied that Nebuchadrezzar would spread his royal pavilion over them (<a onClick="return mV(\'Jer\',43,\'8-13\');">Jer 43:8-13</a>). The Pharaoh of that day was Hophra, and when the fortress of Tahpanhes was discovered and cleared in 1886, the open-air platform before the entrance was found. "Here the ceremony described by Jeremiah took place before the chiefs of the fugitives assembled on the platform, and here Nebuchadrezzar spread his royal pavilion. The very nature of the site is precisely applicable to all the events" (Flinders Petrie, Nebesheh and Defenneh, 51). It was in 568 BC that the prophecy was fulfilled when Nebuchadrezzar marched into the Delta.<P>4. Palace of Memphis:<P>More recently, in 1909, in the course of excavations carried on by the British School of Archaeology in Egypt, the palace of King Apries, Pharaoh Hophra, has been discovered on the site of Memphis, the ancient capital of Egypt. Under the gray mud hill, close to the squalid Arab village of Mitrahenny, which every tourist passes on the way to Sakkhara, had lain for centuries Hophra\'s magnificent palace, 400 ft. long by 200 ft., with a splendid pylon, an immense court, and stonelined halls, of which seven have been found intact. With many other objects of value there was found a fitting of a palanquin of solid silver, decorated with a bust of Hathor with a gold face. It is said to be of the finest workmanship of the time of Apries, a relic of the fire, which, Jeremiah predicted at Tahpanhes, the Lord of Hosts was to kindle "in the houses of the gods of Egypt" (<a onClick="return mV(\'Jer\',43,12);">Jer 43:12</a>).<P>Pharaoh Hophra, as Jeremiah prophesied (44:29f), became the victim of a revolt and was finally strangled.<P>LITERATURE.<P>Flinders Petrie, History of Egypt, III, 344f; Wiedemann, Geschichte von Alt-Aegypten, 190ff; Flinders Petrie and J. H. Walker, Memphis, I, II ("The Palace of Apries"); Herodotus ii.161-69.``128';
isbe[6868]='Pharaoh\'s Daughter`(bath-par\'oh): The princess who rescued Moses (<a onClick="return mV(\'Exd\',2,\'5-10\');">Ex 2:5-10</a>; <a onClick="return mV(\'Hbr\',11,24);">Heb 11:24</a>). This is probably a title as well as an appellation, indicating not only one of the daughters of a Pharaoh, but also some very distinguished rank, thought to be most probably that of the heir to the throne by birth; though she was debarred from reigning by reason of sex, she still possessed the right to entail the scepter and crown to her oldest son. Positive identification of the "Pharaoh\'s daughter" mentioned in the Bible is not possible yet. All attempts toward identification are, of course, guided by the particular theory of the oppressor accepted. If the Pharaoh of the Oppression was Rameses II, as is most likely, then Pharaoh\'s daughter was probably the daughter of Seti I, an older sister of Rameses II. If, as many think, the Pharaoh of the Oppression was Thothmes III, then Pharaoh\'s daughter was some unknown princess. Some have thought she was Hatshepsut, the "Queen Elizabeth of Egypt."``93';
isbe[6869]='Pharaoh-Necoh`ne\'-ko (par\'oh nekhoh, also nekho; Nechao (<a onClick="return mV(\'2Ki\',23,29,33,34);">2Ki 23:29,33,34</a>; <a onClick="return mV(\'2Ch\',35,22);">2Ch 35:22</a>; <a onClick="return mV(\'2Ch\',36,4);">36:4</a>, the King James Version, Necho, the Revised Version (British and American) <a href="./study/isbe/search.html?string=NECO">NECO</a>; <a onClick="return mV(\'Jer\',46,2);">Jer 46:2</a>; <a onClick="return mV(\'2Ch\',35,20);">2Ch 35:20</a>, the King James Version Necho, the Revised Version (British and American) <a href="./study/isbe/search.html?string=NECO">NECO</a>)):<P>1. Pharaoh-Necoh, 610-594 BC:<P>Nekau II of the monuments—Greek Nekos—was the 2nd king of the XXVIth Dynasty, being the son of Psammetichus I, famous in Greek contemporary history, whose long reign has left so many memorials both in Upper and Lower Egypt (Herodotus ii. 153, 158, 169). The great event of his reign (610-594 BC) was his expedition across Syria to secure for himself a share in the decaying empire of Assyria. In the days of Esarhaddon and Ashurbanipal, Egypt had been tributary to Assyria, and, when it began to break up, Egypt and other subject kingdoms saw their opportunity to throw off its yoke. Psammetichus had turned back the Scythian hordes which had reached his border on their western march, and now his son Necoh was to make a bold stroke for empire.<P>2. Battle of Megiddo, 608 BC:<P>On his expedition toward the East, he had to pass through the territory of Judah, and he desired to have Josiah its king as an ally. Whatever may have been his reasons, Josiah remained loyal to his Assyrian suzerain, declined the Egyptian alliance, and threw himself across the path of the invader. The opposing armies met on the battlefield of Megiddo, 608 BC, where Josiah was mortally wounded and soon after died amid the lamentations of his people. Necoh marched northward, captured Kadesh, and pressed on to the Euphrates. Not having met an enemy there, he seems to have turned back and established himself for a time at Riblah in Syria. To Riblah he summoned Jehoahaz whom the people had anointed king in room of his father Josiah, deposed him after a brief reign of 3 months, and set his brother Jehoiakim on the throne as the vassal of Egypt. Jehoiakim paid up the tribute of a hundred talents of silver and a talent of gold which Necoh had imposed upon the land, but he recovered it by exactions which he made from the people (<a onClick="return mV(\'2Ki\',23,35);">2Ki 23:35</a>).<P>3. Battle of Carchemish, 604 BC:<P>The Egyptian monarch still kept some hold upon Syria, and his presence there had attracted the attention of the newly established power at Babylon. The Chaldeans under Nebuchadrezzar set out for the Euphrates, and, meeting the army of Pharaoh-necoh at Carchemish, inflicted upon him a signal defeat. The Chaldeans were now undisputed masters of Western Asia, and the sacred historian relates that "the king of Egypt came not again any more out of his land; for the king of Babylon had taken, from the brook of Egypt unto the river Euphrates, all that pertained to the king of Egypt" (<a onClick="return mV(\'2Ki\',24,7);">2Ki 24:7</a>).<P>4. Commercial Development of Egypt:<P>While Pharaoh-necoh II was ambitious to extend his empire, he was bent also upon the commercial development of Egypt. For this he set himself to collect a navy. He had two fleets built, composed of triremes, one of them to navigate the Mediterranean, the other to navigate the Red Sea. In order to secure a combination of his fleets, he conceived the idea of reopening the canal between the Nile and the Red Sea which had been originally constructed by Seti I and Rameses II, two Pharaohs of the days of the Israelite oppression, but had become silted up by desert sands. He excavated this old canal, following the line of the former cutting, and widening it so that two triremes might meet and pass each other in it. According to Herodotus he was obliged to desist from the undertaking in consequence of the mortality among the laborers, and it was left to Darius to complete. He also resolved to try whether it was possible to circumnavigate Africa, and, manning his ships with Phoenician sailors, he sent them forth with instructions to keep the coast of Africa on their right and to return to Egypt by way of the Mediterranean. They succeeded, and, rounding the Cape of Good Hope from the east, anticipated by two millenniums the feat which Vasco da Gama accomplished from the West. The enterprise took more than two years, and the result of it was of no practical value. Herodotus, when he visited Egypt in 450 BC, saw still remaining the docks which Necoh had built for the accommodation of his fleet.<P>LITERATURE.<P>Flinders Petrie, History of Egypt, III, 335ff; Wiedemann, Geschichte von Alt-Aegypten, 179-90; Rawlinson, Egypt ("Story of the Nations"), 354ff; Herodotus ii.158, 159.``128';
isbe[6870]='Pharathon`far\'-a-thon (Pharathon): One of the strong cities of Judea fortified by Bacchides during the Maccabean war (1Macc 9:50). Septuagint reads "Thamnatha-pharathon" as the name of one city. Josephus, however (Ant., XIII, i, 3), and Syriac supply the "and" between them. The name represents a Hebrew pir\'athon. If it is to be taken strictly as in Judean territory, it cannot be identified with <a href="./study/isbe/search.html?string=PIRATHON">PIRATHON</a> (which see) of <a onClick="return mV(\'Jdg\',12,15);">Jud 12:15</a>. In that case we should probably seek for it with Dr. G.A. Smith in some fortress covering the top of Wady Far\'ah.``54';
isbe[6871]='Phares`fa\'-rez (Phares): the King James Version; Greek form of "Perez" (thus the Revised Version (British and American)) (<a onClick="return mV(\'Mat\',1,3);">Mt 1:3</a>; <a onClick="return mV(\'Luk\',3,33);">Lu 3:33</a>).``1';
isbe[6872]='Pharez`fa\'-rez (King James Version 1Esdras 5:9; 8:30): The same as Revised Version <a href="./study/isbe/search.html?string=PHOROS">PHOROS</a> (which see).``1';
isbe[6873]='Pharida`fa-ri\'-da (Phareida, A, Pharida; King James Version Pharira): The clan name of one of the families of "the servants of Solomon" who came up from Babylon with Zerubbabel (1Esdras 5:33) = "Peruda" of <a onClick="return mV(\'Ezr\',2,55);">Ezr 2:55</a> = "Perida" of <a onClick="return mV(\'Neh\',7,57);">Ne 7:57</a>.``1';
isbe[6874]='Pharira`fa-ri\'-ra: King James Version = Revised Version <a href="./study/isbe/search.html?string=PHARIDA">PHARIDA</a> (which see).``1';
isbe[6875]='Pharisees`far\'-i-sez (perushim; Pharisaioi):<P>1. Name and General Character<P>2. Authorities—Josephus—New Testament—Talmud<P><b>I. HISTORY OF THE SECT</b><P class="in15">1. Associated at First with Hasmoneans, but Later Abandon Them<P class="in15">2. Change of Name<P class="in15">3. Later Fortunes of the Sect<P class="in15">4. In New Testament Times<P class="in15">5. In Post-apostolic Times<P><b>II. DOCTRINES OF THE PHARISEES</b><P class="in15">1. Josephus\'s Statements Colored by Greek Ideas<P class="in15">2. Conditional Reincarnation<P class="in15">3. New Testament Presentation of Pharisaic Doctrines—Angels and Spirits—Resurrection<P class="in15">4. Traditions Added to the Law<P class="in15">5. Traditional Interpretations of the Law by Pharisees (Sabbath, etc.)<P class="in15">6. Close Students of the Text of Scripture<P class="in30">(1) Messianic Hopes<P class="in30">(2) Almsgiving<P><b>III. ORGANIZATION OF THE PHARISAIC PARTY</b><P class="in15">The Chabherim—Pharisaic Brotherhoods<P><b>IV. CHARACTER OF THE PHARISEES</b><P class="in15">1. Pharisees and People of the Land<P class="in15">2. Arrogance toward Other Jews<P class="in15">3. Regulations for the Chabher<P class="in15">4. The New Testament Account<P class="in30">(1) Their Scrupulosity<P class="in30">(2) Their Hypocrisy<P class="in15">5. Talmudic Classification of the Pharisees<P><p>V. OUR LORD\'S RELATION TO THE PHARISEES</b><P class="in15">1. Pharisaic Attempts to Gain Christ Over<P class="in15">2. Reasons for Pharisaic Hatred of Christ<P class="in15">3. Our Lord\'s Denunciation of the Pharisees<P><b>LITERATURE</b><hr /><P>1. Name and General Character:<P>A prominent sect of the Jews. The earliest notice of them in Josephus occurs in connection with Jonathan, the high priest. Immediately after the account of the embassy to the Lacedaemonians, there is subjoined (Josephus, Ant, XIII, v, 9) an account of the Pharisees, Sadducees and Essenes, therefore implying that then and in this connection they had been prominent, although no notice of any of these parties is to be found that confirms that view. Later (XIII, x, 5), the Pharisees are represented as envious of the success of John Hyrcanus; Eleazar, one of them, insults him at his own table. From the fact that earlier in the history the Assideans occupy a similar place to that occupied later by the Pharisees, it may be deduced that the two parties are in a measure one. See <a href="./study/isbe/search.html?string=HASIDAEANS">HASIDAEANS</a>; <a href="./study/isbe/search.html?string=ASMONEANS">ASMONEANS</a>. It would seem that not only the Pharisees, but also the Essenes, were derived from the Assideans or chacidhim.<P>2. Authorities—Josephus—New Testament—Talmud:<P>In considering the characteristics and doctrines of the Pharisees we are in some difficulty from the nature of our authorities. The writers of the New Testament assume generally that the character and tenets of the Pharisees are well known to their readers, and only lay stress on the points in which they were in antagonism to our Lord and His followers. The evidence of Josephus, a contemporary and himself a Pharisee, is lessened in value by the fact that he modified his accounts of his people to suit the taste of his Roman masters. The Pharisees, with him, are a philosophic sect, and not an active political party. Their Messianic hopes are not so much as mentioned. Although the Talmud was written, both Mishna and Gemara, by the descendants of the Pharisees, the fact that the Gemara, from which most of our information is derived, is so late renders the evidence deduced from Talmudic statements of little value. Even the Mishna, which came into being only a century after the fall of the Jewish state, shows traces of exaggeration and modification of facts. Still, taking these deficiencies into consideration, we may make a fairly consistent picture of the sect. The name means "separatists," from parash, "to separate"—those who carefully kept themselves from any legal contamination, distinguishing themselves by their care in such matters from the common people, the \'am ha\'arets, who had fewer scruples. Like the Puritans in England during the 17th century, and the Presbyterians in Scotland during the same period, the Pharisees, although primarily a religious party, became ere long energetically political. They were a closely organized society, all the members of which called each other chabherim, "neighbors"; this added to the power they had through their influence with the people.<P>I. History of the Sect.<P>The Assideans (chacidhim) were at first the most active supporters of Judas Maccabeus in his struggle for religious freedom. A portion of them rather than fight retired to the desert to escape the tyranny of Epiphanes (1Macc 2:27f). The followers of these in later days became the Essenes. When Judas Maccabeus cleansed the temple and rededicated it with many sacrifices, it is not expressly said, either in the Books of Maccabees or by Josephus, that he acted as high priest, but the probability is that he did so. This would be a shock to the Assidean purists, as Judas, though a priest, was not a Zadokite; but his actions would be tolerated at that time on account of the imminent necessity for the work of reconsecration and the eminent services of Judas himself and his family.<P>1. Associated at First with Hasmoneans, but Later Abandon Them:<P>When Bacchides appeared against Jerusalem with Alcimus in his camp, this feeling against Judas took shape in receiving the treacherous Alcimus into Jerusalem and acknowledging him as high priest, a line of action which soon showed that it was fraught with disaster, as Alcimus murdered many of the people. They had to betake themselves anew to Judas, but this desertion was the beginning of a separating gulf which deepened when he made a treaty with the idolatrous Romans. As is not infrequently the case with religious zealots, their valor was associated with a mystic fanaticism. The very idea of alliance with heathen powers was hateful to them, so when Judas began to treat with Rome they deserted him, and he sustained the crushing defeat of Eleasa. Believing themselves the saints of God and therefore His peculiar treasure, they regarded any association with the heathen as faithlessness to Yahweh. Their attitude was much that of the Fifth Monarchy men in the time of Cromwell, still more that of the Cameronians in Scotland at the Revolution of 1688 who, because William of Orange was not a "covenanted" king, would have none of him. As the later Hasmoneans became more involved in worldly politics, they became more and more alienated from the strict Assideans, yet the successors of Judas Maccabeus retained their connection with the party in a lukewarm fashion, while the Sadducean sect was gaining in influence.<P>About this time the change of name seems to have been effected. They began to be called Pharisees, perushim, instead of chacidhim—"separatists" instead of saints. A parallel instance is to be found in the religious history of England.<P>2. Change of Name:<P>The Puritans of the 17th century became in the 19th "Non-conformists." The earliest instance of the Pharisees\' intervening in history is that referred to in Josephus (Ant., XIII, x, 5), where Eleazar, a Pharisee, demanded that John Hyrcanus should lay down the high-priesthood because his mother had been a captive, thus insinuating that he—Hyrcanus—was no true son of Aaron, but the bastard of some nameless heathen to whom his mother had surrendered herself. This unforgivable insult to himself and to the memory of his mother led Hyrcanus to break with the Pharisaic party definitely. He seems to have left them severely alone.<P>3. Later Fortunes of the Sect:<P>The sons of Hyrcanus, especially Alexander Janneus, expressed their hostility in a more active way. Alexander crucified as many as 800 of the Pharisaic party, a proceeding that seems to intimate overt acts of hostility on their part which prompted this action. His whole policy was the aggrandizement of the Jewish state, but his ambition was greater than his military abilities. His repeated failures and defeats confirmed the Pharisees in their opposition to him on religious grounds. He scandalized them by calling himself king, although not of the Davidic line, and further still by adopting the heathen name "Alexander," and having it stamped in Greek characters on his coins. Although a high priest was forbidden to marry a widow, he married the widow of his brother. Still further, he incurred their opposition by abandoning the Pharisaic tradition as to the way in which the libation water was poured out. They retaliated by rousing his people against him and conspiring with the Syrian king. On his deathbed he advised his wife, Alexandra Salome, who succeeded him on the throne, to make peace with the Pharisees. This she did by throwing herself entirely into their hands. On her death a struggle for the possession of the throne and the high-priesthood began between her two sons, John Hyrcanus II and Aristobulus II. The latter, the more able and energetic, had the support of the Sadducees; the former, the elder of the two brothers, had that of the Pharisees. In the first phase of the conflict, Hyrcanus was defeated and compelled to make a disadvantageous peace with his brother, but, urged by Antipater, the Idumean, he called in Aretas, who inclined the balance at once to the side of Hyrcanus. The Romans were appealed to and they also, moved partly by the astuteness of Antipater, favored Hyrcanus. All this resulted ultimately in the supremacy of the Herodians, who through their subservience to Rome became inimical to the Pharisees and rivals of the Sadducees.<P>4. In New Testament Times:<P>When the New Testament records open, the Pharisees, who have supreme influence among the people, are also strong, though not predominant, in the Sanhedrin. The Herodians and Sadducees, the one by their alliance with the Roman authorities, and the other by their inherited skill in political intrigue, held the reins of government. If we might believe the Talmudic representation, the Pharisees were in the immense majority in the Sanhedrin; the nasi\', or president, and the \'abh-beth-din, or vice-president, both were Pharisees. This, however, is to be put to the credit of Talmudic imagination, the relation of which to facts is of the most distant kind.<P>Recently Buchler (Das grosse Synedrion in Jerusalem) has attempted to harmonize these Talmudic fables with the aspect of things appearing in the New Testament and Josephus. He assumes that there were two Sanhedrins, one civil, having to do with matters of government, in which the Sadducees were overwhelmingly predominant, and the other scholastic, in which the Pharisees were equally predominant—the one the Senate of the nation, like the Senate of the United States, the other the Senate of a university, let us say, of Jerusalem. Although followed by Rabbi Lauterbach in the Jewish Encyclopedia, this attempt cannot be regarded as successful. There is no evidence for this dual Sanhedrin either in the New Testament or Josephus, on the one hand, or in the Talmud on the other.<P>Outside the Sanhedrin the Pharisees are ubiquitous, in Jerusalem, in Galilee, in Peraea and in the Decapolis, always coming in contact with Jesus. The attempts made by certain recent Jewish writers to exonerate them from the guilt of the condemnation of our Lord has no foundation; it is contradicted by the New Testament records, and the attitude of the Talmud to Jesus.<P>The Pharisees appear in the Book of Acts to be in a latent way favorers of the apostles as against the high-priestly party. The personal influence of Gamaliel, which seems commanding, was exercised in their favor. The anti-Christian zeal of Saul the Tarsian, though a Pharisee, may have been to some extent the result of the personal feelings which led him to perpetuate the relations of the earlier period when the two sects were united in common antagonism to the teaching of Christ. He, a Pharisee, offered himself to be employed by the Sadducean high priest (<a onClick="return mV(\'Act\',9,1,2);">Ac 9:1,2</a>) to carry on the work of persecution in Damascus. In this action Saul appears to have been in opposition to a large section of the Pharisaic party. The bitter disputes which he and the other younger Pharisees had carried on with Stephen had possibly influenced him.<P>5. In Post-apostolic Times:<P>When Paul, the Christian apostle, was brought before the Sanhedrin at Jerusalem, the Pharisaic party were numerous in the Council, if they did not even form the majority, and they readily became his defenders against the Sadducees.<P>From Josephus we learn that with the outbreak of the war with the Romans the Pharisees were thrust into the background by the more fanatical Zealots, Simon ben Gioras and John of Gischala (BJ, V, i). The truth behind the Talmudic statements that Gamaliel removed the Sanhedrin to Jabneh and that Johanan ben Zakkai successfully entreated Vespasian to spare the scholars of that city is that the Pharisees in considerable numbers made peace with the Romans. In the Mishna we have the evidence of their later labors when the Sanhedrin was removed from Jabneh, ultimately to Tiberias in Galilee. There under the guidance of Jehuda ha-Qadhosh ("the Holy") the Mishna was reduced to writing. It may thus be said that Judaism became Pharisaism, and the history of the Jews became that of the Pharisees. In this later period the opposition to Christianity sprang up anew and became embittered, as may be seen in the Talmudic fables concerning Jesus.<P>II. Doctrines of the Pharisees.<P>1. Josephus\' Statements Colored by Greek Ideas:<P>The account given of the doctrines of the Pharisees by Josephus is clearly influenced by his desire to parallel the Jewish sects with the Greek philosophical schools. He directs especial attention to the Pharisaic opinion as to fate and free will, since on this point the Stoic and Epicurean sects differed very emphatically. He regards the Pharisaic position as mid-way between that of the Sadducees, who denied fate altogether and made human freedom absolute, and that of the Essenes that "all things are left in the hand of God." He says "The Pharisees ascribe all things to fate and God, yet allow that to do what is right or the contrary is principally in man\'s own power, although fate cooperates in every action." It is to be noted that Josephus, in giving this statement of views, identifies "fate" with "God," a process that is more plausible in connection with the Latin fatum, "something decreed," than in relation to the impersonal moira, or heimarmene, of the Greeks. As Josephus wrote in Greek and used only the second of these terms, he had no philological inducement to make the identification; the reason must have been the matter of fact. In other words, he shows that the Pharisees believed in a personal God whose will was providence.<P>2. Conditional Reincarnation:<P>In connection with this was their doctrine of a future life of rewards and punishments. The phrase which Josephus uses is a peculiar one: "They think that every soul is immortal; only the souls of good men will pass into another body, but the souls of the evil shall suffer everlasting punishment" (aidia timoria kolazesthai). From this it has been deduced that the Pharisees held the transmigration of souls. In our opinion this is a mistake. We believe that really it is an attempt of Josephus to state the doctrine of the resurrection of the body in a way that would not shock Hellenic ideas. The Greek contempt for the body made the idea of the resurrection abhorrent, and in this, as in most philosophical matters, the Romans followed the Greeks. It would seem that Josephus regarded the Pharisees as maintaining that this resurrection applied only to the righteous. Still even this restriction, though certainly the natural interpretation, is not absolutely necessary. This is confirmed by the corresponding section in the Antiquities (XVIII, i, 3): "They also believe...that under the earth there will be rewards or punishments, according as they have lived virtuously or viciously in this life, and the latter are to be detained in an everlasting prison, but that the former shall have power to revive and live again." Josephus also declares the Pharisees to be very attentive students of the law of God: "they interpret the law with careful exactitude."<P>3. New Testament Presentation of Pharisaic Doctrines—Angels and Spirits—Resurrection:<P>Nothing in the Gospels or the Acts at all militates against any part of this representation, but there is much to fill it out. They believed in angels and spirits (<a onClick="return mV(\'Act\',23,8);">Ac 23:8</a>). From the connection it is probable that the present activity of such beings was the question in the mind of the writer. In that same sentence belief in the resurrection is ascribed to the Pharisees.<P>4. Traditions Added to the Law:<P>Another point is that to the bare letter of the Law they added traditions. While the existence of these traditions is referred to in Gospels, too little is said to enable us to grasp their nature and extent (<a onClick="return mV(\'Mat\',15,2);">Mt 15:2</a>ff; <a onClick="return mV(\'Mat\',16,5);">16:5</a>ff; <a onClick="return mV(\'Mar\',7,\'1-23\');">Mr 7:1-23</a>). The evangelists only recorded these traditional glosses when they conflicted with the teaching of Christ and were therefore denounced by Him. We find them exemplified in the Mishna. The Pharisaic theory of tradition was that these additions to the written law and interpretations of it had been given by Moses to the elders and by them had been transmitted orally down through the ages. The classical passage in the Mishna is to be found in Pirqe\' Abhoth: "Moses received the (oral) Law from Sinai and delivered it to Joshua and Joshua to the elders, and the elders to the prophets and the prophets to the men of the great synagogue." Additions to these traditions were made by prophets by direct inspiration, or by interpretation of the words of the written Law. All this mass, as related above, was reduced to writing by Jehuda ha-Qadhosh in Tiberias, probably about the end of the 2nd century AD. Jehuda was born, it is said, 135 AD, and died somewhere about 220 AD.<P>The related doctrines of the immortality of the soul, the resurrection of the body, and the final judgment with its consequent eternal rewards and punishments formed a portion and a valuable portion of this tradition.<P>5. Traditional Interpretations of the Law by Pharisees (Sabbath, etc.):<P>Less valuable, at times burdensome and hurtful, were the minute refinements they introduced into the Law. Sometimes the ingenuity of the Pharisaic doctors was directed to lighten the burden of the precept as in regard to the Sabbath. Thus a person was permitted to go much farther than a Sabbath day\'s journey if at some time previous he had deposited, within the legal Sabbath day\'s journey of the place he wished to reach, bread and water; this point was now to be regarded as the limit of his house, and consequently from this all distances were to be ceremonially reckoned (Jewish Encyclopedia, under the word "Erub"): The great defect of Pharisaism was that it made sin so purely external. An act was right or wrong according as some external condition was present or absent; thus there was a difference in bestowing alms on the Sabbath whether the beggar put his hand within the door of the donor or the donor stretched his hand beyond his own threshold, as may be seen in the first Mishna in the Tractate Shabbath. A man did not break the Sabbath rest of his ass, though he rode on it, and hence did not break the Sabbath law, but if he carried a switch with which to expedite the pace of the beast he was guilty, because he had laid a burden upon it.<P>6. Close Students of the Text of Scripture:<P>Along with these traditions and traditional interpretations, the Pharisees were close students of the sacred text. On the turn of a sentence they suspended many decisions. So much so, that it is said of them later the Text of that they suspended mountains from hairs. This is especially the case with regard to the Sabbath law with its burdensome minutiae. At the same time there was care as to the actual wording of the text of the Law; this has a bearing on textual criticism, even to the present day. A specimen of Pharisaic exegesis which Paul turns against their followers as an argumentum ad hominem may be seen in <a onClick="return mV(\'Gal\',3,16);">Ga 3:16</a>: "He saith not, And to seeds, as of many; but as of one, And to thy seed, which is Christ."<P>(1) Messianic Hopes.<P>It is also to be said for them, that they maintained the Messianic hopes of the nation when their rivals were ready to sacrifice everything to the Romans, in order to gain greater political influence for themselves. Their imagination ran riot in the pictures they drew of these future times, but still they aided the faith of the people who were thus in a position to listen to the claims of Christ. They were led by Rabbi Aqiba in the reign of Hadrian to accept Bar-Cochba about a century after they had rejected Jesus. They were fanatical in their obedience to the Law as they understood it, and died under untold tortures rather than transgress.<P>(2) Almsgiving.<P>They elevated almsgiving into an equivalent for righteousness. This gave poverty a very different place from what it had in Greece or among the Romans. Learning was honored, although its possessors might be very poor. The story of the early life of Hillel brings this out. He is represented as being so poor as to be unable sometimes to pay the small daily fee which admitted pupils to the rabbinic school, and when this happened, in his eagerness for the Law, he is reported to have listened on the roof to the words of the teachers. This is probably not historically true, but it exhibits the Pharisaic ideal.<P>III. Organization of the Pharisaic Party.<P>We have no distinct account of this organization, either in the Gospels, in Josephus, or in the Talmud. But the close relationship which the members of the sect sustained to each other, their habit of united action as exhibited in the narratives of the New Testament and of Josephus are thus most naturally explained. The Talmudic account of the chabherim affords confirmation of this. These were persons who primarily associated for the study of the Law and for the better observance of its precepts. No one was admitted to these chabhuroth without taking an oath of fidelity to the society and a promise of strict observance of Levitical precepts.<P>The Chabherim—Pharisaic Brotherhoods:<P>One of the elements of their promise has to be noted. The chabher promised not to pay ma\'asroth, "tithe," or terumah, "heave offering," to a priest who was not a chabher. They were only permitted to take this oath when their associates in the brotherhood certified to their character. Even then the candidate had to pass through a period of probation of 30 days, according to the "house of Hillel," of a year, according to the "house of Shammai." This latter element, being quite more Talmudico, may be regarded as doubtful. Association with any not belonging to the Pharisaic society was put under numerous restrictions. It is at least not improbable that when the lawyer in <a onClick="return mV(\'Luk\',10,29);">Lu 10:29</a> demanded "Who is my neighbor?" he was minded to restrict the instances of the command in <a onClick="return mV(\'Lev\',19,18);">Le 19:18</a> to those who were, like himself, Pharisees. A society which thus had brotherhoods all over Palestine and was separated from the rest of the community would naturally wield formidable power when their claims were supported by the esteem of the people at large. It is to be observed that to be a chabher was a purely personal thing, not heritable like priesthood, and women as well as men might be members. In this the Pharisees were like the Christians. In another matter also there was a resemblance between them and the followers of Jesus; they, unlike the Sadducees, were eager to make proselytes. "Ye compass sea and land to make one proselyte" (<a onClick="return mV(\'Mat\',23,15);">Mt 23:15</a>). Many members of Roman society, especially women, were proselytes, as, for instance, Poppea Sabina.<P>IV. Character of the Pharisees.<P>1. Pharisees and People of the Land:<P>Because the ideal of the Pharisees was high, and because they reverenced learning and character above wealth and civil rank they had a tendency to despise those who did not agree with them. We see traces of this in the Gospels; thus <a onClick="return mV(\'Jhn\',7,49);">Joh 7:49</a>: "This multitude that knoweth not the law are accursed." The distinction between the Pharisees, the Puritans and the \'am ha-\'arets, "the people of the land," began with the distinction that had to be kept between the Jews and the Gentiles who had entered the land as colonists or intruders. These would, during the Babylonian captivity, almost certainly speak Western Aramaic, and would certainly be heathen and indulge in heathen practices. They were "the people of the land" whom the returning exiles found in possession of Judea.<P>2. Arrogance toward Other Jews:<P>Mingled with them were the few Jews that had neither been killed nor deported by the Babylonians, nor carried down into Egypt by Johanan, the son of Kareah. As they had conformed in a large measure to the habits of their heathen neighbors and intermarried with them, the stricter Jews, as Ezra and Nehemiah, regarded them as under the same condemnation as the heathen, and shrank from association with them. During the time of our Lord\'s life on earth the name was practically restricted to the ignorant Jews whose conformity to the law was on a broader scale than that of the Pharisees. Some have, however, dated the invention of the name later in the days of the Maccabean struggle, when the ceremonial precepts of the Law could with difficulty be observed. Those who were less careful of these were regarded as \'am ha-\'arets.<P>3. Regulations for the Chabher:<P>The distinction as exhibited in the Talmud shows an arrogance on the part of the Pharisaic chabher that must have been galling to those who, though Jews as much as the Pharisees, were not Puritans like them. A chabher, that is a Pharisee, might not eat at the table of a man whose wife was of the \'am ha-\'arets, even though her husband might be a Pharisee. If he would be a full chabher, a Pharisee must not sell to any of the \'am ha-\'arets anything that might readily be made unclean. If a woman of the \'am ha-\'arets was left alone in a room, all that she could touch without moving from her place was unclean. We must, however, bear in mind that the evidence for this is Talmudic, and therefore of but limited historical value.<P>4. The New Testament Account;<P>(1) Their Scrupulosity.<P>We find traces of this scrupulosity in the Gospels. The special way in which the ceremonial sanctity of the Pharisees exhibited itself was in tithing, hence the reference to their tithing "mint and anise and cummin" (<a onClick="return mV(\'Mat\',23,23);">Mt 23:23</a>). In the parable of the Pharisee and the Publican, one of the things that the Pharisee plumes himself on is that he gives tithes of all he possesses (<a onClick="return mV(\'Luk\',18,12);">Lu 18:12</a>). He is an example of the Pharisaic arrogance of those "who trusted in themselves that they were righteous and set all others at nought." Their claiming the first seats in feasts and synagogues (<a onClick="return mV(\'Mat\',23,6);">Mt 23:6</a>) was an evidence of the same spirit.<P>(2) Their Hypocrisy.<P>Closely akin to this is the hypocrisy of which the Pharisees were accused by our Lord. When we call them "hypocrites," we must go back to the primary meaning of the word. They were essentially "actors," poseurs. Good men, whose character and spiritual force have impressed themselves on their generation, have often peculiarities of manner and tone which are easily imitated. The very respect in which they are held by their disciples leads those who respect them to adopt unconsciously their mannerisms of voice and deportment. A later generation unconsciously imitates, "acts the part." In a time when religion is persecuted, as in the days of Antiochus Epiphanes, or despised as it was in the Hellenizing times which preceded and succeeded, it would be the duty of religious men not to hide their convictions. The tendency to carry on this public manifestation of religious acts after it had ceased to be protest would be necessarily great. The fact that they gained credit by praying at street corners when the hour of prayer came, and would have lost credit with the people had they not done so, was not recognized by them as lessening the moral worth of the action. Those who, having lived in the period of persecution and contempt, survived in that when religion was held in respect would maintain their earlier practice without any arriere-pensee. The succeeding generation, in continuing the practice, consciously "acted." They were poseurs. Their hypocrisy was none the less real that it was reached by unconscious stages. Hypocrisy was a new sin, a sin only possible in a spiritual religion, a religion in which morality and worship were closely related. Heathenism, which lay in sacrifices and ceremonies by which the gods could be bribed, or cajoled into favors, had a purely casual connection with morality; its worship was entirely a thing of externals, of acting, "posing." Consequently, a man did not by the most careful attention to the ceremonies of religion produce any presumption in favor of his trustworthiness. There was thus no sinister motive to prompt to religion. The prophets had denounced the insincerity of worship, but even they did not denounce hypocrisy, i.e. religion used as a cloak to hide treachery or dishonesty. Religion had become more spiritual, the connection between morality and worship more intimate by reason of the persecution of the Seleucids.<P>5. Talmudic Classification of the Pharisees:<P>The Talmud to some extent confirms the representation of the Gospels. There were said to be seven classes of Pharisees:<P>(1) the "shoulder" Pharisee, who wears his good deeds on his shoulders and obeys the precept of the Law, not from principle, but from expediency;<P>(2) the "wait-a-little" Pharisee, who begs for time in order to perform a meritorious action;<P>(3) the "bleeding" Pharisee, who in his eagerness to avoid looking on a woman shuts his eyes and so bruises himself to bleeding by stumbling against a wall; (4) the "painted" Pharisee, who advertises his holiness lest any one should touch him so that he should be defiled;<P>(5) the "reckoning" Pharisee, who is always saying "What duty must I do to balance any unpalatable duty which I have neglected?";<P>(6) the "fearing" Pharisee, whose relation to God is one merely of trembling awe;<P>(7) the Pharisee from "love." In all but the last there was an element of "acting," of hypocrisy. It is to be noted that the Talmud denounces ostentation; but unconsciously that root of the error lies in the externality of their righteousness; it commands an avoidance of ostentation which involves equal "posing."<P>V. Our Lord\'s Relationship to the Pharisees.<P>1. Pharisaic Attempts to Gain Christ Over:<P>The attitude of the Pharisees to Jesus, to begin with, was, as had been their attitude to John, critical. They sent representatives to watch His doings and His sayings and report. They seem to have regarded it as possible that He might unite Himself with them, although, as we think, His affinities rather lay with the Essenes. Gradually their criticism became opposition. This opposition grew in intensity as He disregarded their interpretations of the Sabbatic law, ridiculed their refinements of the law of tithes and the distinctions they introduced into the validity of oaths, and denounced their insincere posing. At first there seems to have been an effort to cajole Him into compliance with their plans. If some of the Pharisees tempted Him to use language which would compromise Him with the people or with the Roman authorities, others invited Him to their tables, which was going far upon the part of a Pharisee toward one not a chabher. Even when He hung on the cross, the taunt with which they greeted Him may have had something of longing, lingering hope in it: "If he be the King of Israel, let him now come down from the cross, and we will believe him" (<a onClick="return mV(\'Mat\',27,42);">Mt 27:42</a> King James Version). If He would only give them that sign, then they would acknowledge Him to be the Messiah.<P>2. Reasons for Pharisaic Hatred of Christ:<P>The opposition of the Pharisees to Jesus was intensified by another reason. They were the democratic party; their whole power lay in the reputation they had with the people for piety. our Lord denounced them as hypocrites; moreover He had secured a deeper popularity than theirs. At length when cajolery failed to win Him and astute questioning failed to destroy His popularity, they combined with their opponents, the Sadducees, against Him as against a common enemy.<P>3. Our Lord\'s Denunciation of the Pharisees:<P>On the other hand, Jesus denounced the Pharisees more than He denounced any other class of the people. This seems strange when we remember that the main body of the religious people, those who looked for the Messiah, belonged to the Pharisees, and His teaching and theirs had a strong external resemblance. It was this external resemblance, united as it was with a profound spiritual difference, which made it incumbent on Jesus to mark Himself off from them. All righteousness with them was external, it lay in meats and drinks and divers washings, in tithing of mint, anise and cummin. He placed religion on a different footing, removed it into another region. With Him it was the heart that must be right with God, not merely the external actions; not only the outside of the cup and platter was to be cleansed, but the inside first of all. It is to be noted that, as observed above, the Pharisees were less antagonistic to the apostles when their Lord had left them. The after-history of Pharisaism has justified Our Lord\'s condemnation.<P>LITERATURE.<P>Histories of Israel:<P>Ewald, V, 365ff, English translation; Herzfeld, III, 354ff; Jost, I, 197ff; Gratz, V, 91ff; Derenbourg, 75-78, 117-44, 452-54; Holtzmann, II, 124ff; Renan, V, 42ff; Stanley, III, 376ff; Cornill, 145ff, English translation; Schurer, II, ii, 4ff, English translation (GJV4, II. 447ff); Kuenen, III, 233ff. ET.<P>Life and Times of Christ:<P>Hausrath, I, 135ff, English translation; Edersheim, I, 310ff; Lange, I, 302ff, English translation; Farrar, II. 494ff; Geikie, II, 223.ff; Keim, I, 250ff; Thomson. Books Which Influenced our Lord, 50ff; Weiss. I, 285ff. English translation; de Pressense, 116ff.<P>Articles in Encyclopedias, Bible Dictionaries, Lexicons, etc.:<P>Ersch and Gruber, Allg. Eric (Daniel); Winer, Realworterbuch; Herzog, RE, edition 1 (Reuss), editions 2, 3 (Sieffert); Hamburger, Realenic.; Smith\'s DB (Twisleton); Kitto\'s Cyclopaedia of Biblical Lit. (Ginsburg); HDB (Eaton); Encyclopedia Biblica (Cowley. Prince); Schenkel, Bibel-Lexicon (Hausrath); Jewish Encyclopedia (Kohler); Temple Dict. of the Bible (Christie); Hastings, DCG (Hugh Scott, Mitchell).<P>Monographs:<P>Wellhausen, Montet, Geiger, Baneth, Muller, Hanne, Davaine, Herford; Weber, System der altsynagogen Palestinischen Theologie, 10ff, 44ff; Keil, Biblical Archaeology, II, 1680; Ryle and James, Psalms of Solomon. xlivff; Nicolas. Doctrines religieuses des juifs, 48ff.``173';

isbe[6880]='Phaselis`fa-se\'-lis (Phaselis): A city of Lycia in Southern Asia Minor, on the seacoast, near the boundary of Pamphylia, to which country some ancient writers have assigned it. Situated on the extreme end of a promontory which projected into the sea, and with high mountains in the rear, it was separated both politically and geographically from the rest of Lycia. Hence it may be understood how it early became the favorite haunt of pirates. Already in the 6th century BC, when trade was carried on with Egypt, the city struck coins of its own; upon them the prow and the stern of a war galley were commonly represented. The coinage ceased in 466 BC, but it was resumed about 400 BC, when the city again became practically independent. For a time Phaselis was under the control of the Seleucid kings of Syria, but in 190 BC it again regained its independence or continued as a member of the league of Lycian cities (1Macc 15:23). Before the beginning of the Christian era it had lost considerable of its earlier importance, yet it was still famed for its temple of Athene in which it was said that the sword of Achilles was preserved, and also for the attar of roses which was produced there. It figures little in early Christian history, yet in Byzantine times it was the residence of a bishop. Its site, now marked by the ruins of the stadium, temples and theater, bears the Turkish name of Tekir Ova.`<a href="./study/isbe/search.html?string=LYCIA">LYCIA</a>`7';

isbe[6891]='Philadelphia`fil-a-del-\'fi-a (Philadelphia: A city of ancient Lydia in Asia Minor on the Cogamus River, 105 miles from Smyrna. It stood upon a terrace 650 ft. above the sea. Behind it are the volcanic cliffs to which the Turks have given the name of Devitt, or "inkwells"; on the other side of the city the land is exceedingly fertile, and there was produced a wine of whose excellence the celebrated Roman poet Virgil wrote. Philadelphia is not so ancient as many of the other cities of Asia Minor, for it was founded after 189 BC on one of the highways which led to the interior. Its name was given to it in honor of Attalus II, because of his loyalty to his elder brother, Eumenes II, king of Lydia. Still another name of the city was Decapolis, because it was considered as one of the ten cities of the plain. A third name which it bore during the 1st century. AD was Neo-kaisaria; it appears upon the coins struck during that period. During the reign of Vespasian, it was called Flavia. Its modern name, Ala-shehir, is considered by some to be a corruption of the Turkish words Allah-shehir, "the city of God," but more likely it is a name given it from the reddish color of the soil. In addition to all of these names it sometimes bore the title of "Little Athens" because of the magnificence of the temples and other public buildings which adorned it. Philadelphia quickly became an important and wealthy trade center, for as the coast cities declined, it grew in power, and retained its importance even until late Byzantine times. One of the Seven Churches of the Book of Revelation (<a onClick="return mV(\'Rev\',3,7);">Re 3:7</a>) was there, and it was the seat of a bishop. As in most Asia Minor cities, many Jews lived there, and they possessed a synagogue. During the reign of Tiberius the city was destroyed by an earthquake, yet it was quickly rebuilt. Frederick Barbarossa entered it while on his crusade in 1190. Twice, in 1306 and 1324, it was besieged by the Seljuk Turks, but it retained its independence until after 1390, when it was captured by the combined forces of the Turks and Byzantines. In 1403 Tamerlane captured it, and, it is said, built about it a wall of the corpses of his victims.<P>Ala-shehir is still a Christian town; one-fourth of its modern population is Greek, and a Greek bishop still makes his home there. One of the chief modern industries is a liquorice factory; in the fields about the city the natives dig for the roots. On the terrace upon which the ancient city stood, the ruins of the castle and the walls may still be seen, and among them is pointed out the foundation of the early church. The place may now best be reached by rail from Smyrna.``7';
isbe[6892]='Philarches`fi-lar\'-kez.`<a href="./study/isbe/search.html?string=PHYLARCHES">PHYLARCHES</a>`1';
isbe[6893]='Philemon`fi-le\'-mon, fi-le\'-mun (Philemon): Among the converts of Paul, perhaps while at Ephesus, was one whom he calls a "fellow-worker," Philemon (<a onClick="return mV(\'Phm\',1,1);">Phm 1:1</a>). He was probably a man of some means, was celebrated for his hospitality (<a onClick="return mV(\'Phm\',1,\'5-7\');">Phm 1:5-7</a>) and of considerable importance in the ecclesia at Colosse. It was at his house (<a onClick="return mV(\'Phm\',1,2);">Phm 1:2</a>) that the Colossian Christians met as a center. It is more than probable that this was a group of the Colossian church rather than the entire ekklesia. His wife was named Apphia (<a onClick="return mV(\'Phm\',1,2);">Phm 1:2</a>); and Archippus (<a onClick="return mV(\'Phm\',1,2);">Phm 1:2</a>) was no doubt his son. From <a onClick="return mV(\'Col\',4,17);">Col 4:17</a> we learn that Archippus held an office of some importance in Colosse, whether he was a presbyter (Abbott, ICC), or an evangelist, or perhaps the reader (Zahn), we cannot tell. He is called here (<a onClick="return mV(\'Phm\',1,2);">Phm 1:2</a>) Paul\'s "fellow-soldier."<P>The relation between the apostle and Philemon was so close and intimate that Paul does not hesitate to press him, on the basis of it, to forgive his slave, Onesimus, for stealing and for running away.<P>Tradition makes Philemon the bishop of Colosse (Apostolical Constitutions, vii, 46), and the Greek Martyrology (Menae) for November 22 tells us that he together with his wife and son and Onesimus were martyred by stoning before Androcles, the governor, in the days of Nero. With this the Latin Martyrology agrees (compare Lightfoot, Ignatius, II, 535). This evidence, however, is unsatisfactory and cannot be trusted as giving unquestionable facts as to Philemon. The only sure information is that in the epistle bearing his name.`<a href="./study/isbe/search.html?string=PHILEMON,+EPISTLE+TO">PHILEMON, EPISTLE TO</a>`101';
isbe[6894]='Philemon, Epistle to`This most beautiful of all Paul\'s Epistles, and the most intensely human, is one of the so-called Captivity Epistles of which Ephesians, Colossians, and Philippians are the others. Of these four <a href="./study/isbe/search.html?string=PHILIPPIANS">PHILIPPIANS</a> (which see) stands apart, and was written more probably after the other three. These are mutually interdependent, sent by the same bearer to churches of the same district, and under similar conditions.<P>1. Place of Writing:<P>There is some diversity of opinion as to the place from which the apostle wrote these letters. Certain scholars (Reuss, Schenkel, Weiss, Holtzmann, Hilgenfeld, Hausrath and Meyer) have urged Caesarea in opposition to the traditional place, Rome. The arguments advanced are first that Onesimus would have been more likely to have escaped to Caesarea than to Rome, as it is nearer Colosse than Rome is, to which we may reply that, though Caesarea is nearer, his chance of escape would have been far greater in the capital than in the provincial city. Again it is said that as Onesimus is not commended in Ephesians, he had already been left behind at Colosse; against which there are advanced the precarious value of an argument from silence, and the fact that this argument assumes a particular course which the bearers of the letters would follow, namely, through Colosse to Ephesus. A more forcible argument is that which is based on the apostle\'s expected visit. In <a onClick="return mV(\'Phl\',2,24);">Php 2:24</a> we read that he expected to go to Macedonia on his release; in <a onClick="return mV(\'Phm\',1,22);">Phm 1:22</a> we find that he expected to go to Colosse. On the basis of this latter reference it is assumed that he was to the south of Colosse when writing and so at Caesarea. But it is quite as probable that he would go to Colosse through Philippi as the reverse; and it is quite possible that even if he had intended to go direct to Colosse when he wrote to Philemon, events may have come about to cause him to change his plans. The last argument, based on the omission of any reference to the earthquake of which Tacitus (Ann. xiv.27) and Eusebius (Chron., O1, 207) write, is of force as opposed to the Roman origin of the letters only on the assumption that these writers both refer to the same event (by no means sure) and that the epistles. were written after that event, and that it was necessary that Paul should have mentioned it. If the early chronology be accepted it falls entirely, as Tacitus\' earlier date would be after the epistles. were written. In addition we have the further facts, favorable to Rome, that Paul had no such freedom in Cuesarea as he is represented in these epistles as enjoying; that no mention is made of Philip who was in Caesarea and a most important member of that community (<a onClick="return mV(\'Act\',21,8);">Ac 21:8</a>), and finally that there is no probability that so large a body of disciples and companions could have gathered about the apostle in his earlier and more strict imprisonment, at Caesarea. We may therefore conclude that the Captivity Epistles were written from Rome, and not from Caesarea.<P>2. Authenticity:<P>The external evidence for the epistle is less extensive than that of some of the other epp., but it is abundantly strong. The play on the word Onesimus which Paul himself uses (<a onClick="return mV(\'Phm\',1,11);">Phm 1:11</a>) is found in Ignatius, Ephesians, ii. This may not mean necessarily a literary connection, but it suggests this. The epistle is known to Tertullian, and through him we know that Marcion accepted it (Adv. Marc., v.21). It is in the list in the Muratorian Fragment (p. 106, l. 27), and is quoted by Origen as Pauline (Hom. in Jer., 19) and placed by Eusebius (Historia Ecclesiastica, III, xxv) among the acknowledged books.<P>It has twice been the object of attack. In the 4th and 5th centuries it was opposed as unworthy of Paul\'s mind and as of no value for edification. This attack was met successfully by Jerome (Commentary on Philemon, praef.), Chrysostom (Argum. in Philem) and Theodore of Mopsuestia (Spicil. in Solesm, I, 149), and the epistle. was finally established in its earlier firm position. The later attack by Baur was inspired by his desire to break down the corroborative value of Phm to the other Captivity Epistles, and has been characterized by Weiss as one of Baur\'s worst blunders. The suggestions that it is interpolated (Holtzmann), or allegorical (Weizsacker and Pfleiderer), or based on the letter of Pliny (Ep. IX, 21) to Sabinianus (Steck), are interesting examples of the vagaries of their authors, but "deserve only to be mentioned" (Zahn). In its language, style and argument the letter is clearly Pauline.<P>3. Date:<P>The date will, as is the case with the other Captivity Epistles, depend on the chronology. If the earlier scheme be followed it may be dated about 58, if the later about 63, or 64.<P>4. Argument:<P>The apostle writes in his own and Timothy\'s name to his friend <a href="./study/isbe/search.html?string=PHILEMON">PHILEMON</a> (which see) in behalf of Onesimus, a runaway slave of the latter. Beginning with his usual thanksgiving, here awakened by the report of Philemon\'s hospitality, he intercedes for his \'son begotten in his bonds\' (<a onClick="return mV(\'Phm\',1,10);">Phm 1:10</a>), Onesimus, who though he is Philemon\'s runaway slave is now "a brother." It is on this ground that the apostle pleads, urging his own age, and friendship for Philemon, and his present bonds. He pleads, however, without belittling Onesimus\' wrongdoing, but assuming himself the financial responsibility for the amount of his theft. At the same time the apostle quietly refers to what Philemon really owes him as his father in Christ, and begs that he will not disappoint him in his expectation. He closes with the suggestion that he hopes soon to visit him, and with greetings from his companions in Rome.<P>5. Value:<P>The charm and beauty of this epistle have been universally recognized. Its value to us as giving a glimpse of Paul\'s attitude toward slavery and his intimacy with a man like Philemon cannot be over-estimated. One of the chief elements of value in it is the picture it gives us of a Christian home in the apostolic days; the father and mother well known for their hospitality, the son a man of position and importance in the church, the coming and going of the Christian brethren, and the life of the brotherhood centering about this household.<P>LITERATURE.<P>Lightfoot, Col and Philem; Vincent, "Phil" and "Philem" (ICC); yon Soden, Hand Commentar; Alexander, in Speaker\'s Commentary.``101';
isbe[6895]='Philetus`fi-le\'-tus (Philetos (<a onClick="return mV(\'2Ti\',2,17);">2Ti 2:17</a>)):<P>1. The Nature of His Error:<P>This person is mentioned by Paul, who warns Timothy against him as well as against his associate in error, Hymeneus. The apostle speaks of Hymeneus and Philetus as instances of men who were doing most serious injury to the church by their teaching, and by what that teaching resulted in, both in faith and morals. The specific error of these men was that they denied that there would be any bodily resurrection. They treated all Scriptural references to such a state, as figurative or metaphorical. They spiritualized it absolutely, and held that the resurrection was a thing of the past. No resurrection was possible, so they taught, except from ignorance to knowledge, from sin to righteousness. There would be no day when the dead would hear the voice of Christ and come forth out of the grave. The Christian, knowing that Christ was raised from the dead, looked forward to the day when his body should be raised in the likeness of Christ\'s resurrection. But this faith was utterly denied by the teaching of Hymeneus and Philetus.<P>2. How It Overthrew Faith:<P>This teaching of theirs, Paul tells us, had overthrown the faith of some. It would also overthrow Christian faith altogether, for if the dead are not raised, neither is Christ risen from the dead, and "ye are yet in your sins" (<a onClick="return mV(\'1Cr\',15,17);">1Co 15:17</a>).<P>The denial of the resurrection of the body, whether of mankind generally or of Christ, is the overthrow of the faith. It leaves nothing to cling to, no living Christ, who saves and leads and comforts His people. The apostle proceeds to say that teaching of this kind "eats as doth a gangrene," and that it increases unto more ungodliness. As a canker or gangrene eats away the flesh, so does such teaching eat away Christian faith. Paul is careful to say, more than once, that the teaching which denies that there will be a resurrection of the dead leads inevitably to "ungodliness" and to "iniquity."`<a href="./study/isbe/search.html?string=HYMENAEUS">HYMENAEUS</a>`155';
isbe[6896]='Philip (1)`fil\'-ip (Philippos, "lover of horses"):<P>(1) The father of Alexander the Great (1Macc 1:1; 6:2), king of Macedonia in 359-336 BC. His influence for Greece and for mankind in general lay in hastening the decadence of the Greek city-state and in the preparations he left to Alexander for the diffusion throughout the world of the varied phases of Greek intellectual life.<P>(2) A Phrygian left by Antiochus Epiphanes as governor at Jerusalem (circa 170 BC) and described in 2Macc 5:22 as "more barbarous" than Antiochus himself, burning fugitive Jews who had assembled in caves near by "to keep the sabbath day secretly" (2Macc 6:11) and taking special measures to check the opposition of Judas Maccabeus (2Macc 8:8). There is some ground for identifying him with—<P>(3) A friend or foster-brother of Antiochus (2Macc 9:29), appointed by Antiochus on his deathbed as regent. Lysias already held the office of regent, having brought up the son of Antiochus from his youth, and on the death of his father set him up as king under the name of Eupator. The accounts of the rivalries of the regents and of the fate of Philip as recorded in 1Macc 6:56; 2Macc 9:29; Josephus, Ant, XII, ix,7,are not easily reconciled.<P>(4) Philip V, king of Macedonia in 220-179 BC. He is mentioned in 1Macc 8:5 as an example of the great power of the Romans with whom Judas Maccabeus made a league on conditions described (op. cit.). The conflict of Philip with the Romans coincided in time with that of Hannibal, after whose defeat at Zama the Romans were able to give undivided attention to the affairs of Macedonia. Philip was defeated by the Romans under Flaminius, at Cynoscephalae (197 BC), and compelled to accept the terms of the conquerors. He died in 179, and was succeeded by his son Perseus, last king of Macedonia, who lost his crown in his contest with the Romans.`<a href="./study/isbe/search.html?string=PERSEUS">PERSEUS</a>`79';
isbe[6897]='Philip (2)`(Philippos):<P>1. New Testament References:<P>One of the Twelve Apostles. Philip belonged to Bethsaida of Galilee (<a onClick="return mV(\'Jhn\',1,44);">Joh 1:44</a>; <a onClick="return mV(\'Jhn\',12,21);">12:21</a>). Along with Andrew and other fellow-townsmen, he had journeyed to Bethany to hear the teaching of John the Baptist, and there he received his first call from Christ, "Follow me" (<a onClick="return mV(\'Jhn\',1,43);">Joh 1:43</a>). Like Andrew, Philip immediately won a fresh follower, Nathanael, for Jesus (<a onClick="return mV(\'Jhn\',1,45);">Joh 1:45</a>). It is probable that he was present at most of the events recorded of Jesus\' return journey from Bethany to Galilee, and that the information relating to these was supplied to John by him and Andrew (compare <a href="./study/isbe/search.html?string=ANDREW">ANDREW</a>). His final ordination to the Twelve is recorded in <a onClick="return mV(\'Mat\',10,3);">Mt 10:3</a>; <a onClick="return mV(\'Mar\',3,18);">Mr 3:18</a>; <a onClick="return mV(\'Luk\',6,14);">Lu 6:14</a>; <a onClick="return mV(\'Act\',1,13);">Ac 1:13</a>. At the feeding of the 5,000, Philip was asked the question by Jesus, "Whence are we to buy bread, that these may eat?" (<a onClick="return mV(\'Jhn\',6,\'5-7\');">Joh 6:5-7</a>). He was appealed to by the Greeks when they desired to interview Jesus at the Passover (<a onClick="return mV(\'Jhn\',12,\'20-33\');">Joh 12:20-33</a>). During the address of Jesus to His disciples after the Last Supper, Philip made the request, "Lord, show us the Father, and it sufficeth us" (<a onClick="return mV(\'Jhn\',14,8);">Joh 14:8</a>).<P>2. Apocryphal References:<P>According to the "Genealogies of the Twelve Apostles," Philip was of the house of Zebulun (compare Budge, Contendings of the Apostles, II, 50). Clement of Alexandria (Strom., iii.4, 25,and iv.9, 73) gives the tradition identifying him with the unknown disciple who asked permission to go and bury his father ere he followed Jesus (compare <a onClick="return mV(\'Mat\',8,21);">Mt 8:21</a>; <a onClick="return mV(\'Luk\',9,59);">Lu 9:59</a>), and says that he died a natural death. Owing to confusion with Philip the evangelist, there is much obscurity in the accounts of Apocrypha literature concerning the earlier missionary activities of Philip the apostle. The "Ac of Philip" tell of a religious controversy between the apostle and a Judean high priest before the philosophers of Athens. Later Latin documents mention Gaul (Galatia) as his field. As to his sending Joseph of Arimathea thence to Britain, see <a href="./study/isbe/search.html?string=JOSEPH+OF+ARIMATHAEA">JOSEPH OF ARIMATHAEA</a>. The evidence seems conclusive that the latter part of his life was spent in Phrygia. This is supported by Polycrates (bishop of Ephesus in the 2nd century), who states that he died at Hierapolis, by Theodoret, and by the parts of the Contendings of the Apostles dealing with Philip. Thus, according to "The Preaching of Philip and Peter" (compare Budge, Contendings of the Apostles, II, 146), Phrygia was assigned to Philip as a mission field by the risen Christ when He appeared to the disciples on the Mount of Olives, and "The Martyrdom of Philip in Phrygia" (Budge, II, 156) tells of his preaching, miracles and crucifixion there.<P>Philip was regarded in early times as the author of "The Gospel of Philip," a Gnostic work of the 2nd century, part of which was preserved by Epiphanius (compare Hennecke, Neutestamentliche Apokryphen, 40, 41).<P>See <a href="./study/isbe/search.html?string=APOCRYPHAL+GOSPELS">APOCRYPHAL GOSPELS</a>.<P>3. Character:<P>As with Andrew, Philip\'s Greek name implies he had Greek connections, and this is strengthened by the fact that he acted as the spokesman of the Greeks at the Passover. Of a weaker mold than Andrew, he was yet the one to whom the Greeks would first appeal; he himself possessed an inquirer\'s spirit and could therefore sympathize with their doubts and difficulties. The practical, strong-minded Andrew was naturally the man to win the impetuous, swift-thinking Peter; but the slower Philip, versed in the Scriptures (compare <a onClick="return mV(\'Jhn\',1,45);">Joh 1:45</a>), appealed more to the critical Nathanael and the cultured Greeks. Cautious and deliberate himself, and desirous of submitting all truth to the test of sensuous experience (compare <a onClick="return mV(\'Jhn\',14,8);">Joh 14:8</a>), he concluded the same criterion would be acceptable to Nathanael also (compare <a onClick="return mV(\'Jhn\',1,46);">Joh 1:46</a>). It was the presence of this materialistic trend of mind in Philip that induced Jesus, in order to awaken in His disciple a larger and more spiritual faith, to put the question in <a onClick="return mV(\'Jhn\',6,6);">Joh 6:6</a>, seeking "to prove him." This innate diffidence which affected Philip\'s religious beliefs found expression in his outer life and conduct also. It was not merely modesty, but also a certain lack of self-reliance, that made him turn to Andrew for advice when the Greeks wished to see Jesus. The story of his later life is, however, sufficient to show that he overcame those initial defects in his character, and fulfilled nobly the charge that his risen Lord laid upon him (compare <a onClick="return mV(\'Mat\',28,\'16-20\');">Mt 28:16-20</a>).``88';
isbe[6898]='Philip (3)`("tetrarch," <a onClick="return mV(\'Luk\',3,1);">Lu 3:1</a>).`<a href="./study/isbe/search.html?string=HEROD">HEROD</a>`1';
isbe[6899]='Philip, the Evangelist`One of "the seven" chosen to have the oversight of "the daily ministration" of the poor of the Christian community in Jerusalem (<a onClick="return mV(\'Act\',6,5);">Ac 6:5</a>). Whether Philip, bearing a Greek name, was a Hellenist, is not known, but his missionary work reveals to us one free from the religious prejudices of the strict Hebrew.<P>The martyrdom of Stephen was the beginning of a systematic persecution of the church in Jerusalem, and all except the apostles were scattered over Judea and Samaria (<a onClick="return mV(\'Act\',8,1);">Ac 8:1</a>), and even as far as Phoenicia, Cyprus and Antioch (<a onClick="return mV(\'Act\',11,19);">Ac 11:19</a>). Thus, the influence of the new teaching was extended, and a beginning made to the missionary movement. The story of Philip\'s missionary labors is told in <a onClick="return mV(\'Act\',8,5);">Ac 8:5</a>ff. He went to the chief city of Samaria, called Sebaste in honor of Augustus (Greek Sebastos). The Samaritans, of mixed Israelite and Gentile blood, had, in consequence of their being rigidly excluded from the Jewish church since the return from exile, built on Mt. Gerizim a rival sanctuary to the temple. To them Philip proclaimed the Christ and wrought signs, with the result that multitudes gave heed, and "were baptized, both men and women." They had been under the influence of a certain sorcerer, Simon, who himself also believed and was baptized, moved, as the sequel proved, by the desire to learn the secret of Philip\'s ability to perform miracles (see <a href="./study/isbe/search.html?string=SIMON+MAGUS">SIMON MAGUS</a>). The apostles (<a onClick="return mV(\'Act\',8,14);">Ac 8:14</a>) at Jerusalem sanctioned the admission of Samaritans into the church by sending Peter and John, who not only confirmed the work of Philip, but also themselves preached in many Samaritan villages.<P>The next incident recorded is the conversion of a Gentile, who was, however, a worshipper of the God of Israel, a eunuch under Candace, queen of the Ethiopians. As he was returning from worshipping in the temple at Jerusalem, he was met by Philip on the road to Gaza. Philip expounded to him that portion of <a onClick="return mV(\'Isa\',53,\'1-\');">Isa 53</a> which he had been reading aloud as he sat in his chariot, and preached unto him Jesus. It is another sign of Philip\'s insight into the universality of Christianity that he baptized this eunuch who could not have been admitted into full membership in the Jewish church (<a onClick="return mV(\'Deu\',23,1);">De 23:1</a>).<P>See <a href="./study/isbe/search.html?string=ETHIOPIAN+EUNUCH">ETHIOPIAN EUNUCH</a>.<P>After this incident, Philip went to Azotus (Ashdod), and then traveled north to Caesarea, preaching in the cities on his way. There he settled, for Luke records that Paul and his company abode in the house of Philip, "the evangelist," "one of the seven," for some days (<a onClick="return mV(\'Act\',21,8);">Ac 21:8</a>). This occurred more than 20 years after the incidents recorded in <a onClick="return mV(\'Act\',8,\'1-\');">Ac 8</a>. Both at this time and during Paul\'s imprisonment at Caesarea, Luke had the opportunity of hearing about Philip\'s work from his own lips. Luke records that Philip had 4 daughters who were preachers (<a onClick="return mV(\'Act\',21,9);">Ac 21:9</a>).<P>The Jewish rebellion, which finally resulted in the fall of Jerusalem, drove many Christians out of Palestine, and among them Philip and his daughters. One tradition connects Philip and his daughters with Hierapolis in Asia, but in all probability the evangelist is confounded with the apostle. Another tradition represents them as dwelling at Tralles, Philip being the first bishop of the Christian community.``78';
