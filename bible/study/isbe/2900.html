isbe[2925]='Ela`e\'-la (Ela, 1Esdras 9:27):<P>(1) Same as Elam (<a onClick="return mV(\'Ezr\',10,26);">Ezr 10:26</a>).<P>(2) Father of Shimei (<a onClick="return mV(\'1Ki\',4,18);">1Ki 4:18</a>, the King James Version "Elah").`<a href="./study/isbe/search.html?string=ELAH+(1)">ELAH</a>`1';
isbe[2926]='Eladah`el\'-a-da.`<a href="./study/isbe/search.html?string=ELEADAH">ELEADAH</a>`1';
isbe[2927]='Elah (1)`e\'-la (\'elah, "oak" or "terebinth"):<P>(1) A "duke" or "sheik" (head of a clan, the Revised Version (British and American) "chief") of Edom (<a onClick="return mV(\'Gen\',36,41);">Ge 36:41</a>).<P>(2) Shimei-ben-Elah, Solomon\'s commissary in Benjamin (<a onClick="return mV(\'1Ki\',4,18);">1Ki 4:18</a> the King James Version).<P>(3) A son of Caleb the son of Jephunneh (<a onClick="return mV(\'1Ch\',4,15);">1Ch 4:15</a>).<P>(4) Father of Hoshea, last king of Israel (<a onClick="return mV(\'2Ki\',15,30);">2Ki 15:30</a>; <a onClick="return mV(\'2Ki\',17,1);">17:1</a>).<P>(5) A Benjamite, son of Uzzi, one of the chiefs of the tribes when the country was settled (<a onClick="return mV(\'1Ch\',9,8);">1Ch 9:8</a>).<P>(6) King of Israel.`<a href="./study/isbe/search.html?string=ELAH+2">ELAH 2</a>`1';
isbe[2928]='Elah (2)`e\'-la.<P>Son of Baasha, fourth king of Israel (<a onClick="return mV(\'1Ki\',16,\'6-14\');">1Ki 16:6-14</a>).<P>He reigned two years, 888-887 BC. The statement that he came to the throne in the 26th year of Asa, reigned two years, and died in the 27th year of Asa, illustrates the Hebrew method of synchronizing the reigns of the kings of Israel and Judah (compare <a onClick="return mV(\'1Ki\',15,33);">1Ki 15:33</a>; <a onClick="return mV(\'1Ki\',16,8);">16:8</a>). Elah appears to have been a debauchee. While he was drinking himself drunk in the house of Azra, his chamberlain, Zimri, one of his military leaders, conspired against him and murdered him. According to Josephus (VIII, xii, 4) he took advantage of the absence of the army, which was at Gibbethon, to kill Elah. The extirpation of the royal family followed the murder of the king. Baasha\'s dynasty had its origin in a murder and it ended in a murder. The government had no stability. These revolutions illustrate the truth that "they who take the sword shall perish with the sword."``125';
isbe[2929]='Elah, Vale of`(\'emeq ha-\'elah, "valley of the terebinth"; he koilas Ela; A, tes druos):<P>The scene of the events of <a onClick="return mV(\'1Sa\',17,2);">1Sa 17:2</a>ff, referred to also in <a onClick="return mV(\'1Sa\',21,9);">1Sa 21:9</a>. There can be no doubt that this is the Wady ec Cunt ("valley of the tercbinth"), or part of it. This is the southernmost of the great valleys which cut through the Shephelah. Commencing near Hebron, close to Beit Sur, it descends under the name Wady es Sur in a more or less northerly direction until near Beit Nettif where it turns abruptly west and receives the name Wady ec CunT. Here it is joined by the Wady en Najil, coming from the north, and from the east by the Wady el-Jindy, down which descends an ancient road from Bethlehem. Where all these valleys coalesce the Wady ec Cunt expands into a wide and level bottom, half a mile across. On a steep hill to the southern side and a little southeast of the wide expanse is Kh. esh-Shuweikeh, the site of Socoh. That the great events of <a onClick="return mV(\'1Sa\',17,2);">1Sa 17:2</a>ff took place here there can be no doubt: the Philistines ranged themselves upon the southern hills; the Israelites to the north or northeast. Upon the wide level valley the contest with Goliath occurred. The exact position of Saul\'s forces may be a matter of speculation, but the late Principal Miller of Madras, who made a special study of the locality (Least of All Lands, chapter v), considered that the little valley ascending northeast from Wady ec Cunt to Belt Nettif was probably the actual Vale of Elah and that here the Israelites had their fortifications. His elucidation of the whole story is most convincing.``117';
isbe[2930]='Elam`e\'-lam (\'elam):<P>(1) A son of Shem (<a onClick="return mV(\'Gen\',10,22);">Ge 10:22</a>; <a onClick="return mV(\'1Ch\',1,17);">1Ch 1:17</a>; see <a href="./study/isbe/search.html?string=ELAMITES">ELAMITES</a>).<P>(2) A Benjamite (<a onClick="return mV(\'1Ch\',8,24);">1Ch 8:24</a>).<P>(3) A Korahite (<a onClick="return mV(\'1Ch\',26,3);">1Ch 26:3</a>).<P>(4) Heads of families in the return (<a onClick="return mV(\'Ezr\',2,7);">Ezr 2:7</a> parallel <a onClick="return mV(\'Neh\',7,12);">Ne 7:12</a>; <a onClick="return mV(\'Ezr\',2,31);">Ezr 2:31</a> parallel <a onClick="return mV(\'Neh\',7,34);">Ne 7:34</a>; <a onClick="return mV(\'Ezr\',8,7);">Ezr 8:7</a>; <a onClick="return mV(\'Ezr\',10,2,26);">10:2, 26</a>).<P>(5) A chief of the people (<a onClick="return mV(\'Neh\',10,14);">Ne 10:14</a>).<P>(6) A priest (<a onClick="return mV(\'Neh\',12,42);">Ne 12:42</a>).``1';
isbe[2931]='Elam; Elamites`e\'-lam, e\'-lam-its (\'elam; Ailam; <a onClick="return mV(\'Jer\',49,36);">Jer 49:36</a>. Codex Sinaiticus \'the original scribe\' reads Elam)<P>The scene of the events of <a onClick="return mV(\'1Sa\',17,2);">1Sa 17:2</a>ff, referred to also in <a onClick="return mV(\'1Sa\',21,9);">1Sa 21:9</a>. There can be no doubt that this is the Wady ec Cunt ("valley of the tercbinth"), or part of it. This is the southernmost of the great valleys which cut through the Shephelah. Commencing near Hebron, close to Beit Sur, it descends under the name Wady es Sur in a more or less northerly direction until near Beit Nettif where it turns abruptly west and receives the name Wady ec CunT. Here it is joined by the Wady en Najil, coming from the north, and from the east by the Wady el-Jindy, down which descends an ancient road from Bethlehem. Where all these valleys coalesce the Wady ec Cunt expands into a wide and level bottom, half a mile across. On a steep hill to the southern side and a little southeast of the wide expanse is Kh. esh-Shuweikeh, the site of Socoh. That the great events of <a onClick="return mV(\'1Sa\',17,2);">1Sa 17:2</a>ff took place here there can be no doubt: the Philistines ranged themselves upon the southern hills; the Israelites to the north or northeast. Upon the wide level valley the contest with Goliath occurred. The exact position of Saul\'s forces may be a matter of speculation, but the late Principal Miller of Madras, who made a special study of the locality (Least of All Lands, chapter v), considered that the little valley ascending northeast from Wady ec Cunt to Belt Nettif was probably the actual Vale of Elah and that here the Israelites had their fortifications. His elucidation of the whole story is most convincing.<P><b>Contents</b><P>1. Geographical Position and Names<P>2. Surface Configuration<P>3. Mountain Ranges<P>4. Rivers <P>5. Climate<P>6. Vegetation<P>7. Fauna<P>8. The Population<P>9. The Principal Cities<P>10. Apirti and the "Bandit Nations"<P>11. The Languages of Elam<P>12. History<P class="in15">(1) The Earliest Period<P class="in15">(2) Sargon of Agade and His Successors<P class="in15">(3) The Suzerainty of the Kings of Ur<P class="in15">(4) Elam Becomes Predominant 2280 Years BC<P class="in15">(5) The Extension of Elamite Authority Westward<P class="in15">(6) Babylonia Again Supreme<P class="in15">(7) Hurbatila\'s Challenge to Kuri-galzu<P class="in15">(8) Elam Again Supreme<P class="in15">(9) Elam Again Defeated, but Recovers<P class="in15">(10) The Conflict between Elam and Assyria<P class="in15">(11) Sennacherib against Chaldea and Elam<P class="in15">(12) Assyrian Friendship and Elamite Ingratitude<P class="in15">(13) Te-umman and the Elamite Seed-royal; Assyria\'s Triumph<P class="in15">(14) Elamite Ingratitude and Treachery<P class="in15">(15) Elam\'s Further Changes of Rulers<P class="in15">(16) King Tammaritu\'s Treachery<P class="in15">(17) Dominion Passes from Assyria<P class="in15">(18) The Later State of Elam<p>13. Elamite Religion<p>14. Elam\'s Importance; Her Literature<p>15. Art during the 1st and 2nd Prehistoric Periods<p>16. Art in the Archaic Period, That of the Viceroys, and That of the Kings<p>17. Temperament of the Inhabitants of Elam<P><b>LITERATURE</b><P>1. Geographical Position and Names:<P>A well-known tract, partly mountainous, whose western boundary, starting on the northeast side of the Persian Gulf, practically followed the course of the lower Tigris. It was bounded on the north by Media, on the east by Persia and on the west by Babylonia. The Assyro-Babylonians called the tract Elamtu, expressed ideographically by the Sumerian characters for Nimma or Numma, which seems to have been its name in that language. As Numma or Elam apparently means "height," or the like, these names were probably applied to it on account of its mountainous nature. Another name by which it was known in early times was Ashshan, for Anshan or Anzan (Anzhan), one of its ancient cities. The great capital of the tract, however, was Susa (Shushan), whence its Greek name of Susiana, interchanging with Elymais, from the Semitic Elam.<P>2. Surface Configuration:<P>Elam consisted of a plain occupying a depression in the mountains of Iran or Persia. Of this the smaller part—which, however, was also the most ancient historically—lay between the Pusht-e-Kuh on the west, the Lur mountains on the North, the Bakhtiari heights to the east and southeast, and the hills of Ahwaz to the south. The larger plain has as its northern boundary these same Ahwaz hills, and reaches to the sea on the south.<P>3. Mountain Ranges:<P>The Pusht-e-Kuh mountains are a series of very high parallel ranges described as "a veritable wall" between Mesopotamia and the elevated depression of the Kerkha. Its principal peak is in the Kebir-Kuh (2,500 meters = 8,200 ft.)—a difficult range of surprising regularity. The valleys on the southwest slope belong properly to Babylonia, and could be invaded on that side with ease, but northeast of the Kebir-Kuh the country is well protected not only against Mesopotamia, on the west, but also against Persia on the east. The nomad Lurs of the present day are practically independent of Persia. The mountain ranges of Luristan increase in height as one approaches the Persian plain, the loftiest summits of the principal range attaining a height of 5,000 meters (= 16,400 ft.).<P>4. Rivers:<P>From these mountain ranges descend large rivers which flow through Elam to the sea. The Kerkha (Gamas-ab) rises in the Persian plain near Nehavend, and is practically a torrent until it reaches Susa, below which it becomes less rapid, and loses itself in the Hawizeh marshes. The Ab-e-Diz, a river with a greater volume of water, is formed by the uniting of two streams above Dizful. It is so violent that it carries down boulders and even tree-trunks from the mountains, and after a winding course joins the Karun at Kut-e-Bende-Kir. The Belad-Rud, between the Ab-e-Diz and the Kerkha, rises in the mountains of Luristan, and varies greatly as to its volume, being sometimes a mere brook, and at others a large river. The Karun, with which a number of small streams unite, rises in the Bakhtiari mountains. After receiving the Ab-e-Diz and the Belad-Rud at Kut-e-Bende-Kir, it becomes an important waterway, navigable as far as Shuster. This is identified with the Biblical Ulai (Assyrian Ulaa, classical Eulaeus). In ancient times emptying itself into the Persian Gulf, which in past centuries extended much farther inland than now, it at present joins the Shattel-Arab at Mohammerah.<P>5. Climate:<P>The climate is a variable one. Between November 1 and 15 the rains begin, with southeast and south winds, and the mountains are covered with snow. In January and February there are violent storms, and the night brings 8 degrees or 10 degrees of frost. Spring begins at the end of February, and vegetation advances so rapidly that harvest takes place about the end of April. The wind then turns south and southwest, bringing with it a heat rising sometimes to 140 degree F., destroying all the verdure of the country. Notwithstanding the rigors of the climate, however, it was in ancient times a well-populated district, and exceedingly fruitful, as now. That the district of Arabistan is poor and barren is due to the carelessness and improvidence of the people, who, like the people of the Turkish province of Bagdad, have neglected the ancient irrigation canals which fertilized the land.<P>6. Vegetation:<P>The vegetation of Susiana is said not to be very varied. On the river banks are to be found willows, tamarisks and many kinds of acacias. Apparently there are no forests—the sacred groves referred to by Assur-bani-apli are thought by De Morgan to have been artificial plantations. Oranges and lemons, which are at present cultivated there, are late importations. The date palm has been brought from the banks of the Shatt-el-Arab, and the pomegranate and other fruit trees from the Iranian plain. Wheat and barley, sown in October and November, are harvested in April. Sorghum remains in the ground all through the dry season, and is watered artificially until October, and cut in November. Castor beans, indigo, lentils, haricots, etc., are less cultivated.<P>7. Fauna:<P>The fauna is said at present to be less numerous than formerly. It contains species both of central Asia, Europe, and, to a certain extent, Africa. The elephant, wild ass, wild ox and ostrich are no longer to be found on the Chaldeo-Elamite plain, but a few examples of the lion still exist there. Bears, panthers, wild boars, wolves, wild cats, foxes, jackals, and several species of wild dogs, however, still exist. Numbers of porcupines inhabit the brushwood by the rivers and marshes. Among the birds which do not leave the country are the eagle, vulture, falcon, raven, francolin, martin, sparrow, tomtit, wagtail, etc. The winter birds of passage are the pelican, stork, crane, cormorant, sea gull, many species of wild duck, the wild goose, bustard, woodcock, snipe, pigeon, turtledove, and numerous brilliantly colored waders. The water-courses are full of fish, among them being the barbel, silurus, carp (sometimes of great size), and gurnards similar to those of the Nile. Some of the rivers being salt, sea fish are also to be found, and it is not rare to see sharks at Shuster, and eels in the lower Karun.<P>8. The Population:<P>The population is naturally not homogeneous. Arab tribes, who are in reality Semites, occupy the plains, while Iranians inhabit the cities and dwell at the mountain bases. According to De Morgan, the original population was mainly negritic, and has mingled with the Arab stock to such an extent that mulattoes among them are not rare. He regards this type as being represented among the soldiers as well as among the people conquered by Naram-Sin about 3000 BC. Nevertheless pure Semites had settled in the country at a very early date, and it is probably on account of this that Elam is called (<a onClick="return mV(\'Gen\',10,22);">Ge 10:22</a>) a son of Shem—indeed, the many Sere inscriptions found by the French explorers at Susa show how strong their influence was. It was to all appearance during the 2nd millennium BC that certain Kassites overran West Mesopotamia, and settled in the northern part of Elam, which was thereafter called by the Assyrians mat Kassi, "the land of the Cosseans." As these people seem to have spoken an Aryan language, there was apparently no really new race introduced in consequence of their invasion.<P>9. The Principal Cities:<P>The two principal cities were Susa or Shushan, called Susun in the native texts, and regarded as the old capital, situated on the Ulai (Karkha); and Anzan (Ashshan, Anshan), more to the southwest. This latter was the capital of Cyrus the Great and his immediate predecessors, the tract having been conquered apparently by Sispis (Teispes), his ancestor, at the end of the 6th century BC. Susa, an important commercial center in the 3rd millennium BC, became again one of the three capitals of the Pets empire during the rule of the Achemenians.<P>10. Apirti and the "Bandit Nations":<P>From the inscriptions of Mal-Amir, to the east, we learn that that was the place of another kingdom called Apirti, the land of the Apharsites of <a onClick="return mV(\'Ezr\',4,9);">Ezr 4:9</a>. In the 2nd (so-called Median or Scythian) version of the late Persian inscriptions this name is given as Hapirti, Halpirti, and Haltupirti, and appears as the equivalent of the Babylonian Elammat (Elamtu) or Elam without the nominative ending. In the Persian version this appears as (H)uwaja or (H)uwazha, whence the modern Huz or Khuzistan. This implies that the kings of Apirti at one time held dominion over Susa, and perhaps the whole of Elam. Strabo (xi.13,1,6), quoting Nearchus, speaks of "four bandit nations" who occupied the mountains east of the Euphrates—the Amardians or Mardians on the Persian border, the Uxians, and Elymeans on the borders of Persia and Susa, and the Cosseans (Kassites) by the Medes. The Amardians would seem to have been the Apirti (Hapirti), the Uxians were probably from (H)uwaja, while the Elymeans (compare 1Macc 6:1) were the Elamites. Among the tribes who made the history of the country, therefore, were probably the Uxians, who seem not to be mentioned in the early inscriptions.<P>11. The Languages of Elam:<P>The dialects of Susa, the second Achemenian VSS, and of Apirti, differ but slightly from each other. They are variants of an agglutinative tongue, and are apparently not related to any other known language. The statement in <a onClick="return mV(\'Gen\',10,22);">Ge 10:22</a>, therefore, applies only to the Semitic section of the population, as it is unlikely that the people speaking Apirtian could be described as "sons of Shem."<P>12. History:<P>(1) The Earliest Period.<P>Beginning with the semi-mythical period, we have the story of the fight of the Babylonian hero Gilgames with the Elamite tyrant Humbaba, who was defeated by the hero and his helper Enki-du, and beheaded. The earliest really historical reference to the Elamites as the foes of Babylonia, however, is apparently that contained in a letter from the priest Lu-enna to the priest En-e-tarzi announcing that the Elamites had invaded Lagas and carried off considerable booty. The writer, however, had attacked the Elamites, and taken plunder from them in his turn. As there seems to be a reference to division of spoil, this is an excellent parallel to the Elamite expedition, made in alliance with the Babylonians, against the cities of the plain (<a onClick="return mV(\'Gen\',14,\'1-\');">Ge 14</a>).<P>(2) Sargon of Agade and His Successors.<P>Sargon of Agade, early in his reign, attacked the Elamites, but apparently Elam only fell under the dominion of the Babylonians during the time of Naram-Sin, his son, who is seemingly shown leading his troops in that region on the splendid stele bearing his name that was found at Susa. Elam apparently regained its independence, however, during the time of Uruwus king of Kis, who invaded the country, and brought back considerable spoil. One of the chiefs of Susa about this time was Simbi-ishak. Chaldean domination, however, did not last long, for Dungi, king of Ur of the Chaldees, about 2500 BC, invaded the country, accompanied by his vassal Gudea, viceroy of Lagas. Dungi has left evidences of his conquests in the buildings which he erected at Susa, but the principal buildings of this period were constructed by Ba-sa-Susinak, son of Simbi-ishak, viceroy of Susa and potentate in Elam. He built a temple to the god Sugu, reservoirs, the gate of Susinak, and dug the Sidur canal. He was evidently one of the great rulers of the land.<P>(3) The Suzerainty of the Kings of Ur.<P>Somewhat later came Idadu I, his son Kal-Ruhuratir, and his grandson Idadu II, who in turn occupied the throne during the time of Bur-Sin, king of Ur. Elam was at this time still under Babylonian suzerainty, which continued under his successor, Gimil-Sin, who also built at Susa, his vassal being Ebarti-kin-Daddu, viceroy of Susa. Gimil-Sin was succeeded by his son Ibi-Sin as overlord in Elam, who invaded and devastated the country, probably to suppress a a revolt. There was apparently no ill-will between the two nations, however, for the viceroy of Susa is said to have married a daughter of Ibi-Sin. Another and possibly later viceroy seems to have married Mekubi, daughter of Billama, viceroy of Asnunnak, who, as Elamite princess, erected buildings at Susa.<P>(4) Elam Becomes Predominant 2280 Years BC.<P>It was probably shortly after this that Kudur-Nahhunte threw off the Semitic yoke, and, invading Babylonia, brought back much spoil to Elam. The date indicated for this ruler by the inscriptions of Assurbani-apli is 2280 BC. The positions of the rulers of Elam and Babylonia were now changed, and the kings of Babylon had to acknowledge Elamite suzerainty. As Elamite and Babylonian sovereign, Kudur-Nahhunte entrusted Susa to a feudatory ruler, and among the viceroys who governed Elam may be mentioned Sirukdu\', who constructed at Susa, and Temti-Agun, his sister\'s son, who built in that city the temple to Isme-karab, "for the health of Kutir-Nahhunte and his family." After passing to other rulers, the government of Susa fell to Ebari, father of Silhaha, during whose reign Simti-Silhak ruled in Babylonia. Nur-Addi and Rim-Anum, kings of Larsa (Elassar), were his vassals.<P>(5) The Extension of Elamite Authority Westward.<P>Attapaksu (or Attahusu), Silhaha\'s sister\'s son, then became "shepherd of Susa." Among the temples which he built was one dedicated to the goddess Narute, and he erected a bridge near his residence. Kudur-mabuk, son of Simti-Silhak, was at this time adda ("father," probably meaning protector) of Emutbalu and the West—Amurru, the land of the Amorites, whither marched Chedorlaomer and Amraphel, with their allies, in the time of Abraham (<a onClick="return mV(\'Gen\',14,\'1-\');">Ge 14</a>). Kudur-mabuk of Larsa was succeeded by his son Eri-Aku (probably the Iri-Agun of Larsa of the Elamite texts), and if he be really, as seems probable, the Arioch of <a onClick="return mV(\'Gen\',14,1,9);">Ge 14:1, 9</a>, then this is also the period when Chedorlaomer ruled in Elam. The strange thing, however, is, that the name of this last does not occur in any recognizable form, unless it be the Kudurlahgumal of certain half-legendary inscriptions (see <a href="./study/isbe/search.html?string=CHEDORLAOMER">CHEDORLAOMER</a>). The Elamite line in Larsa was continued after the death of Eri-Aku by Rim-Sin, his brother, who succeeded him.<P>(6) Babylonia Again Supreme.<P>What the history of Elam during this period was remains to be discovered, but Hammurabi, who is identified with the Amraphel of <a onClick="return mV(\'Gen\',14,1,9);">Ge 14:1, 9</a>, seems to have invaded the country in his 30th year. In his 31st he defeated Rim-Sin of Larsa, following this up, in his 32nd, by overthrowing the army of Asnunnak. All these successes in Elam and its dependencies probably made the kingdom of Babylon supreme in the land. But more details bearing upon this period are needed. It is thought probable that the Elamite king Sadi(?) or Taki (?) came into conflict with, and was defeated by, Ammi-caduga, the 4th in descent from Hammurabi, who reigned about 1890 BC. Apparently the Elamite ruler had tried to regain his independence, but failed.<P>(7) Hurbatila\'s Challenge to Kuri-galzu.<P>Omitting the names of rulers concerning whom but little or nothing is known, we come to the reign of Untas-Gal, patron of the articles. Numerous temples were built by him, and sanctuaries at Susa dedicated. He has left a magnificent bronze statue representing his queen Napir-Asu. He seems to have been overthrown by Untahas-Gal, of a more legitimate line, who was likewise a builder of temples. After the apparently short reign of Kidin-Hutran came that of Hurpatila (Hurbatila), who, desiring to throw off the Babylonian yoke, challenged Kuri-galzu, king of Babylon, to battle at Dur-Dungi. The challenge was accepted, with disastrous results, for Hurbatila was captured by the Babylonian king at the place named. This, however, did not put an end to the strife, and in the end Kidin-Hutrudas was victorious over Belnadin-sum, king of Babylon, about 1180 BC.<P>(8) Elam Again Supreme.<P>Later came the military exploits of Sutruk-Nahhunte, who invaded Babylonia, slew the king Zagaga-sum-iddina, and helped by his son Kutir-Nahhunte, destroyed Sippar, and took away the stele of Naram-Sin, the code of Hammurabi, and several other monuments, which were carefully preserved at Susa. He also defeated the king of Asnunnak. It is this collection of spoils which has contributed to make the success of the French excavations at Susa what it is.<P>(9) Elam Again Defeated, but Recovers.<P>The war between Babylonia and Elam recorded for the reign of Nebuchadrezzar I (circa 1020 BC) probably took place, according to Scheil, during the reign of Silbina-hamru-Laqamar. The Elamite king was defeated on the banks of the Ulai, Elam was ravaged, and much spoil taken. The principality called Namar was detached from Susian territory and reunited to the domain of Babylonia. Apparently the Elamites now turned their attention to regaining their military prestige, the result being that an Elamite king occupied the Babylonian throne from 939 to 934 BC. The history of this period has still to be discovered, but the Babylonians apparently soon shook off the Elamite yoke. It is about this time, however, that another power—Assyria—appeared on the scene, and took the field—not only against Babylon, but also on the borders of Elam. An Elamite contemporary of Nabonassar of Babylon was Humbanigas, 742 BC.<P>(10) The Conflict between Elam and Assyria.<P>At this time, however, the Assyrians became dominant in Babylonia (see <a href="./study/isbe/search.html?string=TIGLATH-PILESER">TIGLATH-PILESER</a> and <a href="./study/isbe/search.html?string=SHALMANESER">SHALMANESER</a>), but it was probably not until the reign of Sargon of Assyria (see <a href="./study/isbe/search.html?string=SARGON">SARGON</a>) that Elam came into conflict with Assyria. Merodach-baladan, a pretender to the throne of Babylon, made common cause with Humbanigas, who fought with the Assyrian army at Der. Naturally the Assyrians claim the victory, but the Babylonians say that they were defeated. After the death of Humbanigas, his successor, Sutur-Nahhundi or Ishtar-hundu (Babylonian), still befriended Merodach-baladan, and advanced to his help. Sargon first attacked the Chaldeans and defeated them at Dur-Athara, and, entering Elam, stormed and captured the cities of the land. The Elamite king took refuge in the mountains, and Merodach-baladan had to resist the Assyrians unaided.<P>(11) Sennacherib against Chaldea and Elam.<P>As Sargon had his attention fully occupied elsewhere, he made no attempt to follow up his success, and it seems not to have been until the reign of Sennacherib that any serious invasion of the country on the part of the Assyrians was made. In 697 BC that king marched again against Merodach-baladan, who had taken refuge at Nagitu and other places on the Elamite side of then elongated Persian Gulf. Here the Chaldeans, with their Elamite allies, were defeated, and the Elamite cities plundered and destroyed. Hallusu, king of Elam, on the retirement of the Assyrian troops, invaded Babylonia as being part of the territories of the Assyrian king, and having captured Assur-nadin-sum, Sennacherib\'s son, who had ruled in Babylon 6 years, carried him off to Elam, setting Nergal-usezib on the throne of Babylonia. On the arrival of the Assyrian avenging host in Baby1onia, Nergal-usezib fled to Elam, but was captured near Niffer. The Elamites were evidently very dissatisfied with their king—possibly owing to his policy—and killed him in a revolt after a reign of six years. This action on the part of the Elamites, however, did not save the people from Assyrian vengeance, for Sennacherib invaded and ravaged the country from Ras to Bit-Burnaki. Apparently the Elamites had expected their new ruler, Kudurru (Kudur-Nahhunte), to save them from the reprisals of the Assyrians, but as he had failed to do this, he, in his turn, was deposed and killed after a reign of 10 months. The new king of Elam was Umman-Menanu, who espoused the cause of Musezib-Marduk, the new king of Babylon, and gathering a force of Babylonians and Elamites at Halule, fought a battle there, in which the Babylonians record success for the allies. Sennacherib, however, himself claims the victory, and describes with great wealth of detail the horrors of the fight. Next year (689 BC) Sennacherib marched into Babylonia to complete the work, and Musezib-Marduk, having been captured, was sent prisoner to Assyria. Umman-Menanu died at the end of the year, after a 4 years\' reign, and was succeeded by Humba-haldasu I (689-682 BC), of whom nothing is known. In 682 BC Humba-haldasu II mounted the throne. The death of Sennacherib and the troubles attending the accession of Esarhaddon encouraged Nabuzer-napisti-Itsir, son of Merodach-baladan, again to raise the standard of revolt. Defeat was the result, and he fled to Elam, there to be captured by Humba-haldasu and put to death.<P>(12) Assyrian Friendship and Elamite Ingratitude.<P>Friendship with Assyria was a complete reversal of Elamite policy, and to all appearance peace, though probably unpopular, persisted between the two countries for several years. Humba-haldasu\'s two brothers revolted against him and assassinated him, and Urtaku, one of the murderers, took the Elamite throne. Not daring to be openly hostile to Assyria, however, he sent his brother Te-umman to intrigue in Chaldea in favor of a man named Nabuusallim, but the Chaldean chiefs answered that Na\'id-Marduk, their lord, lived, and they were the servants of the king of Assyria. Also, during a famine in Elam, certain Elamite tribes migrated into Assyria to escape the scarcity, and were kindly treated by Assur-bani-apli, who had succeeded his father on the Assyrian throne. Notwithstanding this, however, Urtaku invaded Babylonia as ally of certain Chaldean tribes. Overtaken by the Assyrian army, he fought with them near his own border, but was defeated and fled. He died prematurely (by his own hand) the same year, and was succeeded by his brother Te-umman (Tepti-Humban).<P>(13) Te-umman and the Elamite Seed-royal; Assyria\'s Triumph.<P>This king, who is described by Assur-bani-apli as being in the likeness of an evil spirit, immediately set to work to secure the death of all the sons of Urtaku and Umman-aldase (Humba-Haldasu II), his brother; and these princes, five in number, with 60 of the royal seed of Elam, fled and sought refuge with the Assyrian king. Te-umman immediately sent two messengers to Assur-bani-apli demanding the surrender of the fugitives. This was refused, and war broke out between the two countries immediately after. The Assyrians came up with the Elamites at Der, but Te-umman feared to join issue there, and retreating, took up a strong position near his capital, Susa, with his front protected by the river Ulai. Defections from his army now so weakened the forces of Te-umman that he endeavored to treat with Assur-bani-apli, who naturally refused to listen to terms, and ordered his troops to attack. The defeat of the Elamites was a foregone conclusion, and Te-umman perished, with his son, in the thick of the battle, as is dramatically depicted by the sculptors of Assur-bani-apli in the bas-reliefs which adorned the walls of his palace. An Assyrian general was now sent to Susa with Umman-igas, the prince chosen to succeed Te-umman, and he was proclaimed while the bodies of the fallen Elamites covered the battlefield, and the waters of the Ulai carried others down to the place of its outflow. Tammaritu, the new king\'s youngest brother, was at the same time made king of Hidalu, in the mountain region. In the triumphal procession at Nineveh which took place on the Assyrian army\'s return, the head of Te-umman and his son Tamritu figured, the former hanging from the neck of Dunanu, king of Gambulu, and the latter from the neck of Samgunu, Dunanu\'s brother.<P>(14) Elamite Ingratitude and Treachery.<P>For a time there was peace in Elam, but soon the discontent of Samas-sum-ukin, king of Babylon, Assur-bani-apli\'s brother, sought to break it. Urged by him, Umman-igas forgot the benefits which he had received at the hands of Assur-bani-apli, and sent an army into Babylonia under the command of Undasi, son of Te-umman, telling him to avenge upon Assyria the killing of his father. Notwithstanding the great strength of the allied army, they did not succeed in making headway against the Assyrians. Tammaritu, nephew of Umman-igas, after the defeat of the Elamite forces in Chaldea, revolted against him, and having defeated him, cut off his head, and took the crown. Samas-sum-ukin immediately turned his attention to the new ruler, and induced him by fresh presents to come likewise to his aid. Tammaritu therefore marched at the head of an army into Babylonia, but in his absence Indabigas, one of his servants, headed a revolt against him, and proclaimed himself king in Susa. In the battle which ensued between the two pretenders, Tammaritu was defeated, and fled to the seacoast with a part of the Elamite royal family. He ultimately embarked in a ship on the Persian Gulf with the intention of escaping, but was wrecked, and gave himself up to an Assyrian officer, who sent him to Assyria.<P>(15) Elam\'s Further Changes of Rulers.<P>Indabigas, the new Elamite king, now sent an embassy to make peace with Assur-bani-apli, who at once demanded the surrender of Nabu-bel-sumati, son of Merodach-baladan, and the Assyrians whom he had enticed and taken with him. Before this demand could reach Indabigas, however, his people had revolted against him and put him to death, and Umman-aldasu, son of Attametu, sat on the throne, after defeating Indabigas on the banks of the Huthut. The same demand was made to Ummanaldasu as had been made to Indabigas, but Nabubel-sumati, not wishing to fall into the hands of the Assyrians, called on his armor-bearer to dispatch him, and the two ran each other through with their swords.<P>(16) King Tammaritu\'s Treachery.<P>Nevertheless Assur-bani-apli decided to replace Tammaritu, the former Elamite king, on the throne, and to this end invaded Elam. The Assyrians were, as usual, successful, and on learning this, Umman-aldas fled to the mountains. Entering Susa, Tammaritu was once more proclaimed king of Elam, he, in return, promising to regard Assur-bani-apli as his lord, and to pay tribute. No sooner had the Assyrian army departed, than the new king of Elam began to plot against the power which had raised him. To all appearance his intentions to revolt were reported to the Assyrian king, who at once sent an army and plundered the country, and Tammaritu again fell into Assur-bani-apli\'s hands. Umman-aldas now returned and resumed the government. Unwilling to regard his former efforts as fruitless, the Assyrian king decided to finally subdue the land, and to this end invaded it, the pretext being that the Elamites refused to deliver up the image of the goddess Nana, which had been carried off from Erech 1,635 years before, in the time of Kudur-Nahhunte (see (4) above). The two armies faced each other on the banks of the Itite, and after an attack in which the Assyrians were at a disadvantage, the Elamites gave way, and Umman-aldas fled to the mountains. According to the Assyrian king\'s record, an enormous booty was taken, including many sacred and ancient royal statues preserved at Susa. The image of Nana was restored to its shrine at Erech with great rejoicing. In the triumphal celebrations at Nineveh, Tammaritu was one of the captive kings who drew the Assyrian king\'s chariot to the temple of Ishtar, when he rendered the goddess thanks for his victories.<P>(17) Dominion Passes from Assyria.<P>To all appearance Elam now became a province of the Assyrian empire, though not for long, as this collapsed in the year 606 BC, and the center of government was shifted to Babylon, under Nabopolassar, who became its ruler. Nebuchadrezzar (604), Evil-Merodach (561), Neriglissar (559), and Nabonidus (555-538 BC), were successively masters of Elam. The mention of the kings of Elam in <a onClick="return mV(\'Jer\',25,25);">Jer 25:25</a>, however, suggests that the old states of the country had practically resumed their independence; though 49:35-39 prophesies the dismemberment of the country, and the destruction of its king and princes. This is thought to refer to the annexation of the country by Teispes, and its passing, through his line—Cyrus, Cambyses, and Cyrus the Great, who were all kings of Anzan—to Darius Hystaspis. In <a onClick="return mV(\'Isa\',21,2);">Isa 21:2</a> it is apparently the later Cyrus who is referred to when Elam, with Media, is called upon "to go up" to the siege of Babylon.<P>(18) The Later State of Elam.<P>After Cyrus, the history of Elam was that of Persia, of which it henceforth formed a part. In all probability, however, the Elamites were as warlike and as intractable as ever. During the reign of the little-known Kharacenian king, Aspasine, they made incursions into Babylonia, one of the opponents of this king\'s generals being Pittit, "the enemy, the Elamite"—a phrase of old standing, apparently. Elam, to its whole extent, was smitten with the sword, and Pittit (was slain or captured). One of the cities which they attacked was Apameia, probably that on the Sellas river. <a onClick="return mV(\'Act\',2,9);">Ac 2:9</a> implies that the old language of Elam was still in use, and the Elamites were still recognized as a nationality, as late as the 1st century of our era.<P>13. Elamite Religion:<P>Owing to the many Semites in Elam, and the nearness of the Babylonian states, Babylonian deities—Anu and Anatu, Enlil and Ninlil, Merodach and Zer-panitu, Samas and Aa, Tammuz and Ishtar, Ninip, Nergal, Hadad or Rimmon, etc.—were largely worshipped (see <a href="./study/isbe/search.html?string=BABEL,+BABYLON">BABEL, BABYLON</a>). The chief deity of the non-Semitic pantheon seems to have been Insusinak, the patron-deity of Susa, identified with Ninip, the son of Enlil, by the Babylonians, who guote also other names applied to him—Lahuratil Simes, Adaene, Susinak, and Dagbak. Merodach seems to have been represented by the Sumerian character Gal, "great," and Zer-panitu was apparently called Nin-sis in Elam. Ishtar was known as Usan. Lagamar, Laqamar, or Lagamal, was apparently identified with the Babylonian Lagamal, one of the gods of Dailem near Babylon—his name is generally regarded as forming part of the name <a href="./study/isbe/search.html?string=CHEDORLAOMER">CHEDORLAOMER</a> (which see). Nahhunte, Na\'hunte, or (Babylonian) Nan-hundi was the Babylonian sun-god Samas; Kunzibami was the W. Semitic Hadad, also known by his Mitannian (Hittite) name of Tesup. Humban, Human, or Umman (Assyrian), "the god of gods," "the king," was possibly regarded as the Babylonian Merodach. The currency of Babylonian myths in Elam is suggested by the name of the goddess Belala, possibly the Babylonian Belili, sister of Tammuz. The word for "god" in Elamite was nap, explained by the Babylonians as one of the names of Enlil, implying that the Elamites regarded him as "the god" by divine right. Of their deities, six (one of them being Lagamar) were worshipped only by Elamite kings. Elam had temples and temple-towers similar to those in Babylonia, as well as sacred groves, wherein no stranger penetrated. (See <a href="./study/isbe/search.html?string=ERE">ERE</a>, under the word "Elamites.")<P>14. Elam\'s Importance; Her Literature:<P>The rediscovery of the history of Elam is one of the most noteworthy things of modern research. It has revealed to us the wonderful development which that kingdom had made at an exceedingly early date, and shows that it was politically just as important as the Babylonian states 4,000 years BC, though probably hardly so advanced in art and literature. Nevertheless, the country had adopted the cuneiform method of writing, and possessed also another script, seemingly of more ancient date. As both Semitic Babylonian and Susian (Anzanite) were spoken in the country, numerous documents in both languages have been found, mostly historical, or of the nature of dedications, some of which are inscribed on objects presented to temples. There are also a number of archaic tablets of the nature of accounts, written in a peculiar cuneiform character. The cylinder-seals are either inscribed with dedications, or with the name of the owner, his father, and the god whom he worshipped, as in Babylonia. Of other literature there are but mere traces—an exorcism against mosquitos shows the desire of the people to rid themselves of the discomforts of this life. Contracts testify to the existence of laws, but the laws themselves have yet to be discovered. The stele of Hammurabi, which was found at Susa, did not belong to Elamitic literature, but to that of Babylonia.<P>15. Art during the 1st and 2nd Prehistoric Periods:<P>Elamite art during the first period was naturally rude, and it is doubtful whether metals were then used, as no traces of them were found. There were also no inscribed monuments. The pottery, however, was of extreme delicacy, and very elegant. The second period is described as being less artistic than the first. The pottery is more ordinary, and also more roughly made, though better ware also exists. Painted ornamentation is found. Vessels of white or pink limestone, some of them very large, occur, but alabaster is exceedingly rare. There is no indication of writing at this period, but rudely engraved seals, with animal forms, are found. The buildings were of crude brick or piled-up earth, though baked brick was sometimes used. A change seems to have taken place in the conditions of life at the end of this period, implying invasion by a more civilized race.<P>16. Art in the Archaic Period, That of Viceroys, and That of the Kings:<P>The indications of invasion during the second prehistoric period are confirmed, according to M. Jequier, by what is found in the layer of the archaic period, which succeeded it. This is accentuated by the numerous inscribed clay tablets, some of the which have impressions of quite remarkable cylinder-seals. The pottery is scanty and not characteristic, but the working of alabaster into vases had developed considerably, and some of the smaller forms (ointment or scent-bottles) are good and varied. Some have the form of the duck, the wild boar, and other animals. During the period of the issake or viceroys, fine sculptures in low relief occur—the scorpion-man and the sacred tree, military prisoners with their guard, siegeoperations and the dead on the battlefield; and as examples of work in the round, ivory and alabaster statuettes. Later on, during the time of the kings of Elam and Susa, the objects of art increase in number, though large objects in the round are rare. Noteworthy are the statuettes and statues in bronze, the former being very numerous. The largest production of this kind is the almost lifesize statue of queen Napir-Asu, consort of Untas-Gal, which, however, is unfortunately headless. It is a remarkable piece of work, and has great artistic merit.<P>17. Temperament of the Inhabitants of Elam:<P>In all probability Elam was much hindered in her material and intellectual development by the intractable and warlike nature of her people—indeed, the history of the country, as far as it is known, is a record of strife and conflict, and the temperament indicated by the ancient records seems to have been inherited by the wild tribes which occupy the more inaccessible districts. What conduced to quarrels and conflicts in ancient times was the law of succession, for the Elamite kings were not generally succeeded by their eldest sons, but by their brothers (see <a href="./study/isbe/search.html?string=ELLASAR">ELLASAR</a>). The inhabitants of the towns at the present time in all probability do not differ in any essential respect from those of Persia in general, and among them there is probably no great amount of ancient Elamite blood, though the Elamite type is met with, and probably occurs, in consequence of ancient mingling, in various parts of modern Persia.<P>LITERATURE.<P>For the most complete account of the discoveries in Elam, see Memoires de la delegation en Perse, Iff, Mission scientifique en Perse, Iff, and Histoire et travaux de la delegation en Perse, all under the editorship of J. de Morgan, and written by De Morgan, V. Scheil, G. Lampre, G. Jequier, etc.; also W. K. Loftus, Chaldea and Susiana, 1857.``136';
isbe[2932]='Elasa`el\'-a-sa, ele-a\'sa (Alasa; the King James Version Eleasa):<P>The place where Judas pitched his camp before the battle in which he was overwhelmed and slain (1Macc 9:5).<P>It probably corresponds to the modern Khirbet il\'asa, between the two Beth-horons.``1';
isbe[2933]='Elasah`el\'-a-sa (\'el\'asah, "God has made"):<P>(1) An Israelite who had married a foreign wife (<a onClick="return mV(\'Ezr\',10,22);">Ezr 10:22</a>).<P>(2) A son of Shaphan, by whom, with Gemariah, King Zedekiah sent a message to Babylon (<a onClick="return mV(\'Jer\',29,3);">Jer 29:3</a>).`<a href="./study/isbe/search.html?string=ELEASAH">ELEASAH</a>`1';
isbe[2934]='Elath; Eloth`e\'-lath, or e\'-loth (\'eloth, \'elath; Ailon (<a onClick="return mV(\'Deu\',2,8);">De 2:8</a>), Ailath (<a onClick="return mV(\'2Ki\',16,6);">2Ki 16:6</a>)):<P>A seaport on the Red Sea in the territory of Edom. It is named along with Ezion-geber in the account of Israel\'s journey round the land of Edom (<a onClick="return mV(\'Deu\',2,8);">De 2:8</a>). It appears as Ailath, and Alion in the Septuagint, and in Josephus as Ilanis (Ant., VIII, vi, 4), while Eusebius (Onomasticon) has Aila. From this we may gather that the Aramaic Ilan or Ilana was in use as well as the Hebrew \'elath or \'eloth. The name, "grove," was doubtless derived from the presence of certain sacred trees. It may be identical with El-paran of <a onClick="return mV(\'Gen\',14,6);">Ge 14:6</a>, and Elah of <a onClick="return mV(\'Gen\',36,41);">Ge 36:41</a>. When David conquered Edom, Elath passed into the hands of Israel (<a onClick="return mV(\'2Sa\',8,14);">2Sa 8:14</a>). It was a position of great importance in connection with the trade with Southern Arabia. Here the merchant fleets of Solomon and Jehoshaphat were fitted out, and hence, they sailed (<a onClick="return mV(\'1Ki\',9,26);">1Ki 9:26</a>; <a onClick="return mV(\'2Ch\',8,17);">2Ch 8:17</a>; <a onClick="return mV(\'1Ki\',22,48);">1Ki 22:48</a>).<P>In the reign of Jehoram, son of Jehoshaphat, Edom shook off the hand of Judah (<a onClick="return mV(\'2Ki\',8,20);">2Ki 8:20</a>), but under Amaziah and Uzziah it was again subdued (<a onClick="return mV(\'2Ki\',14,7,10,22);">2Ki 14:7, 10, 22</a>). Finally it was taken from Ahaz by Rezin, king of Syria. The Jews were driven out and the Syrians (Edomites?) took permanent possession (<a onClick="return mV(\'2Ki\',16,6);">2Ki 16:6</a>). It is identical with the modern \'Aqaba, at the head of the gulf of that name.``54';
isbe[2935]='Elberith`el-be\'-rith (<a onClick="return mV(\'Jdg\',9,46);">Jud 9:46</a>).`<a href="./study/isbe/search.html?string=BAAL+BERITH">BAAL-BERITH</a>`1';
