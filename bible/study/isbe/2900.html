isbe[2937]='Eldaah`el-da\'-a (\'elda\'ah, "God has called"?): A son of Midian (<a onClick="return mV(\'Gen\',25,4);">Ge 25:4</a>; <a onClick="return mV(\'1Ch\',1,33);">1Ch 1:33</a>).``1';
isbe[2938]='Eldad`el\'-dad (\'eldadh, "God has loved"):<P>One of the 70 elders chosen by Moses at the command of Yahweh to share "the burden of the people" (<a onClick="return mV(\'Num\',11,\'16-25\');">Nu 11:16-25</a>). Eldad and his companion Medad were not present with the rest at the tent of meeting, yet the Spirit rested also upon them and they prophesied in the camp (<a onClick="return mV(\'Num\',11,\'26-29\');">Nu 11:26-29</a>).``1';
isbe[2939]='Eldad And Modad, Book of`el\'-dad, mo\'-dad:<P>In the Septuagint they are called Eldad and Modad. In the King James Version the names are given as Eldad and Medad; meaning "God has loved" ("God loves") and "object of love" (?).<P>They were two of the seventy elders chosen by Moses (<a onClick="return mV(\'Num\',11,26);">Nu 11:26</a>), and while the others obeyed the summons and went to the tabernacle, these two remained in the camp and prophesied (<a onClick="return mV(\'Num\',11,26);">Nu 11:26</a>). The nature of their prophecy is not recorded, and this naturally became a good subject for the play of the imagination. It furnished the basis for a lost work which was quoted by Hermas (Vis 2 3): "The Lord is near to them who return unto him, as it is written in Eldad and Modad, who prophesied to the people in the wilderness." The Palestine Targums also filled in the subject of the prophecy of Eldad and Modad, and, as they have it, it related to the coming of Gog and Magog against Israel at the end of the days. One of the Targums has the expression, "The Lord is near to them that are in the hour of tribulation." The authors of the Targums were either dependent upon that work or upon a similar tradition; and the former of these views is the more probable. Lightfoot and Holtzman think the lengthy quotation in 1 Clem 23 and 2 Clem 11 is from the Book of Eldad and Modad. The work is found in the Stichometry of Nicephorus and consists of 400 stichoi, which would make it about twice the length of the Cant.``62';
isbe[2940]='Elder``<a href="./study/isbe/search.html?string=ELDER+IN+THE+NEW+TESTAMENT">ELDER IN THE NEW TESTAMENT</a>; <a href="./study/isbe/search.html?string=ELDER+IN+THE+OLD+TESTAMENT">ELDER IN THE OLD TESTAMENT</a>`1';
isbe[2941]='Elder in the New Testament`(presbuteros):<P>(1) The word is used adjectivally to denote seniority (<a onClick="return mV(\'Luk\',15,25);">Lu 15:25</a>; <a onClick="return mV(\'1Ti\',5,2);">1Ti 5:2</a>).<P>(2) Referring to the Jewish elders of the synagogue, usually associated with the scribes and Pharisees, and New Testament passages cited in the previous article.<P>(3) It denotes certain persons appointed to hold office in the Christian church, and to exercise spiritual oversight over the flock entrusted to them. From the references in <a onClick="return mV(\'Act\',14,23);">Ac 14:23</a>; <a onClick="return mV(\'Act\',20,17);">20:17</a> it may be inferred that the churches generally had elders appointed over them. That "elders" and "bishops" were in apostolic and sub-apostolic times the same, is now almost universally admitted; in all New Testament references their functions are identical. The most probable explanation of the difference of names is that "elder" refers mainly to the person, and "bishop" to the office; the name "elder" emphasizes what he is, while "bishop," that is "overseer," emphasizes what the elder or presbyter does.`<a href="./study/isbe/search.html?string=BISHOP">BISHOP</a>; <a href="./study/isbe/search.html?string=CHURCH+GOVERNMENT">CHURCH GOVERNMENT</a>; <a href="./study/isbe/search.html?string=MINISTRY">MINISTRY</a>`68';
isbe[2942]='Elder in the Old Testament`el\'-der, (zaqen):<P>Among primitive peoples authority seems naturally to be invested in those who by virtue of greater age and, consequently, experience are best fitted to govern thus Iliad iii.149. Later the idea of age became merged in that of dignity (Il. ii.404, ii.570; Odyssey ii.14). In like manner the word patres came to be used among the Romans (Cic. Rep. 2,8,14). So also among the Germans authority was entrusted to those who were older; compare Tacitus Agricola. The same is true among the Arabians to the present day, the sheik being always a man of age as well as of authority.<P>From the first the Hebrews held this view of government, although the term "elder" came later to be used of the idea of the authority for which, at first, age was regarded necessary. Thus the office appears in both the Jahwist, J (9th century BC) (<a onClick="return mV(\'Exd\',3,16);">Ex 3:16</a>; <a onClick="return mV(\'Exd\',12,21);">12:21</a>; <a onClick="return mV(\'Exd\',24,1);">24:1</a>, of the elders of the Hebrews; and of the Egyptians, <a onClick="return mV(\'Gen\',50,7);">Ge 50:7</a>); and Elohist (E) (8th century BC) (<a onClick="return mV(\'Exd\',17,5);">Ex 17:5</a>; <a onClick="return mV(\'Exd\',18,12);">18:12</a>; <a onClick="return mV(\'Exd\',19,7);">19:7</a> (the second Deuteronomist (D2)); <a onClick="return mV(\'Jos\',24,31);">Jos 24:31</a>, elders of Israel, or of the people. Compare the principle of selection of heads of tens, fifties, etc., <a onClick="return mV(\'Exd\',18,13);">Ex 18:13</a>ff, seventy being selected from a previous body of elders); compare Jahwist(j)-Elohist(e) (<a onClick="return mV(\'Num\',11,16,24);">Nu 11:16, 24</a>). Seventy are also mentioned in <a onClick="return mV(\'Exd\',24,1);">Ex 24:1</a>, while in <a onClick="return mV(\'Jdg\',8,14);">Jud 8:14</a> seventy-seven are mentioned, although this might be taken to include seven princes. Probably the number was not uniform.<P>Elder as a title continues to have place down through the times of the Judges (<a onClick="return mV(\'Jdg\',8,16);">Jud 8:16</a>; <a onClick="return mV(\'Jdg\',2,7);">2:7</a>); compare <a onClick="return mV(\'Rth\',4,2);">Ru 4:2</a>ff into the kingdom. Saul asked to be honored before the elders (<a onClick="return mV(\'1Sa\',15,30);">1Sa 15:30</a>); the elders of Bethlehem appeared before Samuel (<a onClick="return mV(\'1Sa\',16,4);">1Sa 16:4</a>); the elders appeared before David in Hebron (<a onClick="return mV(\'2Sa\',17,15);">2Sa 17:15</a>; <a onClick="return mV(\'1Ch\',11,3);">1Ch 11:3</a>); elders took part in the temple procession of Solomon (<a onClick="return mV(\'1Ki\',8,3);">1Ki 8:3</a>; <a onClick="return mV(\'2Ch\',5,4);">2Ch 5:4</a>). They continued through the Persian period <a onClick="return mV(\'Ezr\',5,5,9);">Ezr 5:5, 9</a>; <a onClick="return mV(\'Ezr\',6,7,14);">6:7, 14</a>; <a onClick="return mV(\'Ezr\',10,8,14);">10:8, 14</a>; <a onClick="return mV(\'Joe\',1,14);">Joe 1:14</a> margin and the Maccabean period Judith 6:16; 7:23; 8:10; 10:6; 13:12; 1Macc 12:35, while the New Testament presbuteros, <a onClick="return mV(\'Mat\',16,21);">Mt 16:21</a>; <a onClick="return mV(\'Mat\',26,47,57);">26:47, 57</a>; <a onClick="return mV(\'Mar\',8,31);">Mr 8:31</a>; <a onClick="return mV(\'Luk\',9,22);">Lu 9:22</a>; <a onClick="return mV(\'Act\',4,5,23);">Ac 4:5, 23</a> makes frequent mention of the office.<P>The elders served as local magistrates, in bringing murderers to trial (<a onClick="return mV(\'Deu\',19,12);">De 19:12</a>; <a onClick="return mV(\'Deu\',21,1);">21:1</a>ff; <a onClick="return mV(\'Jos\',20,4);">Jos 20:4</a>), punishing a disobedient son (<a onClick="return mV(\'Deu\',21,19);">De 21:19</a>), inflicting penalty for slander (<a onClick="return mV(\'Deu\',22,15);">De 22:15</a>), for noncompliance with the Levirate marriage law (<a onClick="return mV(\'Deu\',25,7);">De 25:7</a>ff), enforcing the Law (<a onClick="return mV(\'Deu\',27,1);">De 27:1</a>), conducting the service in expiation of unwitting violation of the Law (<a onClick="return mV(\'Lev\',4,13);">Le 4:13</a>ff).<P>In certain passages different classes of officers are mentioned as "judges and officers" (<a onClick="return mV(\'Deu\',16,18);">De 16:18</a>), "elders" and "officers" (<a onClick="return mV(\'Deu\',31,28);">De 31:28</a>), "heads, tribes, elders officers" (<a onClick="return mV(\'Deu\',29,10);">De 29:10 (Hebrew 9)</a>. It is probable that both classes were selected from among the elders, and that to one class was assigned the work of judging, and that the "officers" exercised executive functions (Schurer). In entirely Jewish communities the same men would be both officers of the community and elders of the synagogue. In this case the same men would have jurisdiction over civil and religious matters.<P>LITERATURE.<P>Schurer, GJV3, section 23, especially 175ff Eng. edition, II, i, 149ff; Benzinger, H A2, 51; Deissmann, Bibelstudien, 153ff (sv. ...); BDB, 278 (...); Preuschen, Griechisch-Deutsches Handworterbuch, under the word, 958 f.``164';
isbe[2943]='Elead`el\'-e-ad (\'el\'adh, "God has testified"):<P>An Ephraimite, slain while making a raid, by the men of Gath (<a onClick="return mV(\'1Ch\',7,21);">1Ch 7:21</a>).``1';
isbe[2944]='Eleadah; Eladah`el-e-a\'-da, (the King James Version) (\'el\'adhah, "God has adorned"):<P>An Ephraimite (<a onClick="return mV(\'1Ch\',7,20);">1Ch 7:20</a>).``1';
isbe[2945]='Elealeh`e-le-a\'-le (\'el\'aleh, "God has ascended"):<P>Lay in the country taken from Sihon and within the lot given to Reuben (<a onClick="return mV(\'Num\',32,3,17);">Nu 32:3, 17</a>f). "Their names being changed" seems to apply to all the towns mentioned. There is no indication of the other names. Elealeh is noticed with Heshbon in the oracles against Moab in <a onClick="return mV(\'Isa\',15,4);">Isa 15:4</a>; <a onClick="return mV(\'Isa\',16,9);">16:9</a>; <a onClick="return mV(\'Jer\',48,34);">Jer 48:34</a>. Eusebius (Onomasticon) locates it one Roman mile from Heshbon. It is represented today by el\'Al, a mound crowned with ruins, about a mile north of Chesban.``1';
isbe[2946]='Eleasa`el-e-a\'-sa.`<a href="./study/isbe/search.html?string=ELASA">ELASA</a>`1';
isbe[2947]='Eleasah`el-e-a\'-sa (in Hebrew identical with <a href="./study/isbe/search.html?string=ELASAH">ELASAH</a>, which see):<P>(1) A descendant of Judah (<a onClick="return mV(\'1Ch\',2,39,40);">1Ch 2:39-40</a>).<P>(2) A Benjamite, a descendant of Saul (<a onClick="return mV(\'1Ch\',8,37);">1Ch 8:37</a>; <a onClick="return mV(\'1Ch\',9,43);">9:43</a>).``1';
isbe[2948]='Eleazar`el-e-a\'-zar, e-le-a\'-zar (\'el-\'azar; Eleazar, "God is helper"):<P>(1) The 3rd son of Aaron by Elisheba (<a onClick="return mV(\'Exd\',6,23);">Ex 6:23</a>; <a onClick="return mV(\'Num\',3,2);">Nu 3:2</a>).<P>He married one of the daughters of Putiel, who bore him Phinehas (<a onClick="return mV(\'Exd\',6,25);">Ex 6:25</a>). With his father and 3 brothers he was consecrated to the priest\'s office (<a onClick="return mV(\'Exd\',28,1);">Ex 28:1</a>). After the destruction of Nadab and Abihu, he occupied a more important position, and he and Ithamar "ministered in the priest\'s office in the presence of Aaron their father" (<a onClick="return mV(\'Lev\',10,6);">Le 10:6</a>f; <a onClick="return mV(\'Num\',3,4);">Nu 3:4</a>; <a onClick="return mV(\'1Ch\',24,2);">1Ch 24:2</a>ff). He was given the oversight of the Levites and had charge of the tabernacle and all within it (<a onClick="return mV(\'Num\',3,32);">Nu 3:32</a>; <a onClick="return mV(\'Num\',4,16);">4:16</a>). To Eleazar fell the duty of beating out for an altar covering the censers of Korah and his fellow-conspirators who had attempted to seize the priesthood (<a onClick="return mV(\'Num\',16,37,39);">Nu 16:37, 39</a>). On the death of Aaron, Eleazar succeeded him (<a onClick="return mV(\'Num\',20,25);">Nu 20:25</a>ff). He assisted Moses with the census after the plague in the plains of Moab (<a onClick="return mV(\'Num\',26,1);">Nu 26:1</a>ff), and with Moses and the elders heard the petition of the daughters of Zelophehad who wished to be served as heirs to their father (<a onClick="return mV(\'Num\',27,1);">Nu 27:1</a>ff). After the entrance into Canaan, Eleazar and Joshua gave effect to the decision arrived at by giving the daughters of Zelophehad a share in the land of Manasseh (<a onClick="return mV(\'Jos\',17,4);">Jos 17:4</a>). He was priest and adviser to Joshua, the successor of Moses (<a onClick="return mV(\'Num\',27,19);">Nu 27:19</a>; <a onClick="return mV(\'Num\',31,12);">31:12</a>ff), whom he also assisted in partitioning Canaan among the tribes (<a onClick="return mV(\'Num\',34,17);">Nu 34:17</a>; <a onClick="return mV(\'Jos\',14,1);">Jos 14:1</a>; <a onClick="return mV(\'Jos\',19,51);">19:51</a>; <a onClick="return mV(\'Jos\',21,1);">21:1</a>). He was buried in the hill (the Revised Version, margin "Gibeah") of Phinehas his son in the hill country of Ephraim (<a onClick="return mV(\'Jos\',24,33);">Jos 24:33</a>). For some reason unknown the descendants of Ithamar seem to have held the chief position among the priests from Eli till the accession of Solomon, when Abiathar was sent into retirement, and Zadok, the descendant of Eleazar, was appointed in his place (<a onClick="return mV(\'1Ki\',2,26);">1Ki 2:26</a>ff). Ezra was a descendant of Zadok (<a onClick="return mV(\'Ezr\',7,1);">Ezr 7:1</a>ff); and the high priest\'s office was in the family of Zadok till the time of the Maccabees.<P>(2) The son of Abinadab, sanctified to keep the ark of Yahweh, when it was brought from Beth-shemesh to Kiriath-jearim after being sent back by the Philistines (<a onClick="return mV(\'1Sa\',7,1);">1Sa 7:1</a>).<P>(3) The son of Dodai, one of David\'s three mighty men. A famous feat of arms with David at Ephes-dammim is recorded (<a onClick="return mV(\'2Sa\',23,9);">2Sa 23:9</a>f; <a onClick="return mV(\'1Ch\',11,12);">1Ch 11:12</a>f where he is named the son of Dodo).<P>(4) A Levite, a son of Mahli, a Merarite. It is recorded that he had no sons, but daughters only, who were married to their cousins (<a onClick="return mV(\'1Ch\',23,21,22);">1Ch 23:21-22</a>; <a onClick="return mV(\'1Ch\',24,28);">24:28</a>).<P>(5) A priest who accompanied Ezra from Babylon (<a onClick="return mV(\'Ezr\',8,33);">Ezr 8:33</a>); the son of Phinehas. (5) and (6) may be identical.<P>(6) A priest who took part in the dedication of the wall of Jerusalem (<a onClick="return mV(\'Neh\',12,42);">Ne 12:42</a>).<P>(7) A son of Mattathias and brother of Judas Maccabeus (1Macc 2:5; 6:43f; 2Macc 8:23).<P>See <a href="./study/isbe/search.html?string=ASMONEANS">ASMONEANS</a>; <a href="./study/isbe/search.html?string=MACCABAEUS;+ MACCABEES">MACCABEES</a>.<P>(8, 9) Two others are mentioned in 1Macc 8:17; 2Macc 6:18ff.<P>(10) An ancestor of Jesus, 3 generations before Joseph (<a onClick="return mV(\'Mat\',1,15);">Mt 1:15</a>).``78';
isbe[2949]='Eleazurus`el-e-a-zu\'-rus, the Revised Version (British and American) <a href="./study/isbe/search.html?string=ELIASIBUS">ELIASIBUS</a> (which see).``1';
isbe[2950]='Elect`e-lekt\':<P>That is, "chosen," "selected."<P>In the Old Testament the word represents derivatives of bachar, elegit;<P>In the New Testament eklektos. It means properly an object or objects of selection.<P>This primary meaning sometimes passes into that of "eminent," "valuable," "choice"; often thus as a fact, in places where the King James Version uses "chosen" (or "elect") to translate the original (eg. <a onClick="return mV(\'Isa\',42,1);">Isa 42:1</a>; <a onClick="return mV(\'1Pe\',2,6);">1Pe 2:6</a>). In the King James Version "elect" (or "chosen") is used of Israel as the race selected for special favor and to be the special vehicle of Divine purposes (<span class="noTag">so</span> 4 times in Apocrypha, Tobit and Ecclus); of the great Servant of Yahweh (compare <a onClick="return mV(\'Luk\',23,35);">Lu 23:35</a>; the "Christ of God, his chosen"); compare eminent saints as Jacob, Moses, Rufus (<a onClick="return mV(\'Rom\',16,13);">Ro 16:13</a>); "the lady," and her "sister" of 2 John; of the holy angels (<a onClick="return mV(\'1Ti\',5,21);">1Ti 5:21</a>); with a possible suggestion of the lapse of other angels. Otherwise, and prevalently in the New Testament, it denotes a human community, also described as believers, saints, the Israel of God; regarded as in some sense selected by Him from among men, objects of His special favor, and correspondingly called to special holiness and service.<P>In the English versions "elect" is not used as a verb: "to choose" is preferred; eg. <a onClick="return mV(\'Mar\',13,20);">Mr 13:20</a>; <a onClick="return mV(\'Eph\',1,4);">Eph 1:4</a>.`<a href="./study/isbe/search.html?string=ELECTION">ELECTION</a>`46';
isbe[2951]='Elect Lady`e-lekt\' la\'-di (eklekte kuria; 2 <a onClick="return mV(\'Jhn\',1,1);">Joh 1:1</a>):<P>In accordance with strict grammatical usage these words of address may be translated in three ways: "to an elect lady" (which as an address is too indefinite); or, both words being taken as proper names, "to Eklekte Kuria" (an improbable combination of two very rare names); or "to Eklekte, lady" = anglice, "to the lady (or \'Madam\') Eklekte."<P>The other translations which have been given—"to the elect lady" or "to the elect Kuria"—are open to objection on account of the omission of the article; but this violation of rule is perhaps not without parallel (compare <a onClick="return mV(\'1Pe\',1,1);">1Pe 1:1</a>).<P>The translation adopted will partly depend upon whether we regard the epistle as addressed to an individual or to a community. Dr. Rendel Harris believes this question to be settled by the discovery in the papyri of numerous instances which prove that kurios and kuria were used by ancient letter-writers as terms of familiar endearment, applicable to brother, sister, son, wife, or intimate friend of either sex (Expositor, March, 1901; see also Findlay, Fellowship in the Life Eternal, chapter iii). In the light of this suggestion we should naturally translate, "to my (dear) lady Eklekte."<P>Grammatically, this is strongly supported by <a onClick="return mV(\'1Ti\',1,2);">1Ti 1:2</a> and <a onClick="return mV(\'2Ti\',1,2);">2Ti 1:2</a> (Timotheo gnesio...agapeto...tekno = "to Timothy my true...beloved...child"); and the fact that the name Eklekte has not yet been discovered, though Eklektos has, offers no grave objection. This is the translation favored by Clement of Alexandria, who says of the epistle: scripta vero est ad quandam Babyloniam nomine Electam, significat autem electionem ecclesiae sanctae ("It is written to a certain Babylonian, Electa by name; but it signifies the further election of the holy church"). It seems doubtful whether he means by the last clause that Electa is simply a personification of the church, or a real person whose name was derived from the Christian idea of election. Either way the rendering, "to the lady Electa," is suitable, and upon the whole it seems the best. Eklekte is not an adjective but a noun. If a person is intended, it is "the lady Electa"; if a church, it is designated, not "the elect Lady," but "the lady Elect." The mention of "thy elect sister" in <a onClick="return mV(\'2Jo\',1,13);">2Joh 1:13</a> does not hinder either supposition.`<a href="./study/isbe/search.html?string=CYRIA">CYRIA</a>; <a href="./study/isbe/search.html?string=JOHN+THE+EPISTLES+OF">JOHN, THE EPISTLES OF</a>`97';
isbe[2952]='Election`e-lek\'-shun (ekloge, "choice," "selection"):<P>Contents<P><b>I. THE WORD IN SCRIPTURE</b><P><b>II. THE MYSTERIOUS ELEMENT</b><P><b>III. INCIDENCE UPON COMMUNITY AND INDIVIDUAL</b><P><b>IV. COGNATE AND ILLUSTRATIVE BIBLICAL LANGUANGE</b><P><b>V. LIMITATIONS OF INQUIRY HERE. SCOPE OF ELECTION</b><P><b>VI. PERSEVERANCE</b><P><p><b>VII. CONSIDERATIONS IN RELIEF OF THOUGHT</b><P class="in15">1. Antinomies<P class="in15">2. Fatalism Another Thing<P class="in15">3. The Moral Aspects<P class="in15">4. "We know in Part"<P class="in15">5. The Unknown Future<hr /><P>I. The Word in Scripture.<P>The word is absent from the Old Testament, where the related Hebrew verb (bachar) is frequent. In the New Testament it occurs 6 times (<a onClick="return mV(\'Rom\',9,11);">Ro 9:11</a>; <a onClick="return mV(\'Rom\',11,5,7,28);">11:5, 7, 28</a>; <a onClick="return mV(\'1Th\',1,4);">1Th 1:4</a>; <a onClick="return mV(\'2Pe\',1,10);">2Pe 1:10</a>). In all these places it appears to denote an act of Divine selection taking effect upon human objects so as to bring them into special and saving relations with God: a selection such as to be at once a mysterious thing, transcending human analysis of its motives (so eminently in <a onClick="return mV(\'Rom\',9,11);">Ro 9:11</a>), and such as to be knowable by its objects, who are (2 Pet) exhorted to "make it sure," certain, a fact to consciousness. It is always (with one exception, <a onClick="return mV(\'Rom\',9,11);">Ro 9:11</a>; see below) related to a community, and thus has close affinity with the Old Testament teachings upon the privileged position of Israel as the chosen, selected race (see under <a href="./study/isbe/search.html?string=ELECT">ELECT</a>). The objects of election in the New Testament are, in effect, the Israel of God, the new, regenerate race called to special privilege and special service. From one point of view, that of the external marks of Christianity, they may thus be described as the Christian community in its widest sense, the sense in which the sacramental position and the real are prima facie assumed to coincide. But from 2 Peter it is manifest that much more than this has to be said if the incidence of the word present to the writer\'s mind is to be rightly felt. It is assumed there that the Christian, baptized and a worshipper, may yet need to make "sure" his "calling and election" as a fact to his consciousness. This implies conditions in the "election" which far transcend the tests of sacred rite and external fellowship.<P>II. The Mysterious Element.<P>Such impressions of depth and mystery in the word are confirmed by the other, passages. In <a onClick="return mV(\'Rom\',9,11);">Ro 9:11</a> the context is charged with the most urgent and even staggering challenges to submission and silence in the presence of the inscrutable. To illustrate large assertions as to the liberty and sovereignty of the Divine dealings with man, the apostle brings in Esau and Jacob, individuals, twins as yet unborn, and points to the inscrutable difference of the Divine action toward them as such. Somehow, as a matter of fact, the Eternal appears as appointing to unborn Esau a future of comparative disfavor and to Jacob of favor; a future announced to the still pregnant mother. Such discrimination was made and announced, says the apostle, "that the purpose of God according to election might stand." In the whole passage the gravest stress is laid upon the isolation of the "election" from the merit or demerit of its objects.<P>III. Incidence upon Community and Individual.<P>It is observable that the same characteristic, the inscrutable, the sovereign, is attached in the Old Testament to the "election" of a favored and privileged nation. Israel is repeatedly reminded (see eg. <a onClick="return mV(\'Deu\',7,\'1-\');">De 7</a>) that the Divine call and choice of them to be the people of God has no relation to their virtues, or to their strength. The reason lies out of sight, in the Divine mind. So too "the Israel of God" (<a onClick="return mV(\'Gal\',6,16);">Ga 6:16</a>) in the New Testament, the Christian community, "the new, peculiar race," holds its great privileges by quite unmerited favor (eg. <a onClick="return mV(\'Tts\',3,5);">Tit 3:5</a>). And the nature of the case here leads, as it does not in the case of the natural Israel, to the thought of a Divine election of the individual, similarly inscrutable and sovereign. For the idea of the New Israel involves the thought that in every genuine member of it the provisions of the New Covenant (<a onClick="return mV(\'Jer\',31,31);">Jer 31:31</a>f) are being fulfilled: the sins are remembered no more, and the law is written in the heart. The bearer of the Christian name, but not of the Christian spiritual standing and character, having "not the Spirit of Christ, is none of his" (<a onClick="return mV(\'Rom\',8,9);">Ro 8:9</a>). The chosen community accordingly, not as it seems ab extra, but as it is in its essence, is a fellowship of individuals each of whom is an object of unmerited Divine favor, taking effect in the new life. And this involves the exercise of electing mercy. Compare eg. <a onClick="return mV(\'1Pe\',1,3);">1Pe 1:3</a>. And consider <a onClick="return mV(\'Rom\',11,\'4-7\');">Ro 11:4-7</a> (where observe the exceptional use of "the election," meaning "the company of the elect").<P>IV. Cognate and Illustrative Biblical Language.<P>It is obvious that the aspects of mystery which gather round the word "election" are not confined to it alone. An important class of words, such as "calling," "predestination" "foreknowledge," "purpose," "gift," bears this same character; asserting or connoting, in appropriate contexts, the element of the inscrutable and sovereign in the action of the Divine will upon man, and particularly upon man\'s will and affection toward God. And it will be felt by careful students of the Bible in its larger and more general teachings that one deep characteristic of the Book, which with all its boundless multiplicity is yet one, is to emphasize on the side of man everything that can humble, convict, reduce to worshipping silence (see for typical passages <a onClick="return mV(\'Job\',40,3,4);">Job 40:3-4</a>; <a onClick="return mV(\'Rom\',3,19);">Ro 3:19</a>), and on the side of God everything which can bring home to man the transcendence and sovereign claims of his almighty Maker. Not as unrelated utterances, but as part of a vast whole of view and teaching, occur such passages as <a onClick="return mV(\'Eph\',2,8,9);">Eph 2:8-9</a> and <a onClick="return mV(\'Rom\',11,\'33-36\');">Ro 11:33-36</a>, and even the stern, or rather awestruck, phrases of <a onClick="return mV(\'Rom\',9,20,21);">Ro 9:20-21</a>, where the potter and the clay are used in illustration.<P>V. Limitations of Inquiry Here. Scope of Election.<P>We have sought thus in the simplest outline to note first the word "election" and then some related Scriptural words and principles, weighing the witness they bear to a profound mystery in the action of the Divine will upon man, in the spiritual sphere. What we have thus seen leaves still unstated what, according to Scripture, is the goal and issue of the elective act. In this article, remembering that it is part of a Bible Encyclopedia, we attempt no account of the history of thought upon election, in the successive Christian centuries, nor again any discussion of the relation of election in Scripture to extra-Scriptural philosophies, to theories of necessity, determination, fatalism. We attempt only to see the matter as it lies before us in the Bible. Studying it so, we find that this mysterious action of God on man has relation, in the Christian revelation, to nothing short of the salvation of the individual (and of the community of such individuals) from sin and condemnation, and the preservation of the saved to life eternal. We find this not so much in any single passage as in the main stream of Biblical language and tone on the subject of the Divine selective action. But it is remarkable that in the recorded thought of our Lord Himself we find assertions in this direction which could hardly be more explicit. See <a onClick="return mV(\'Jhn\',6,37,44,45);">Joh 6:37, 44-45</a>; <a onClick="return mV(\'Jhn\',10,\'27-29\');">10:27-29</a>. To the writer the best summary of the Scriptural evidence, at once definite and restrained, is the language of the 17th Anglican art.: "They which be endued with so excellent a benefit of God be called according to God\'s purpose by His Spirit working in due season; they through grace obey the calling; they be justified freely; they be made sons of God by adoption; they be made like the image of His only begotten Son Jesus Christ; they walk religiously in good works, and at length, by God\'s mercy, they attain to everlasting felicity."<P>VI. Perseverance.<P>The anxious problem of <a href="./study/isbe/search.html?string=PERSEVERANCE">PERSEVERANCE</a> will be treated under that word. It may be enough here to say that alike what we are permitted to read as revealed, and what we may humbly apprehend as the reason of the case, tend to the reverent belief that a perseverance (rather of the Lord than of the saints) is both taught and implied. But when we ponder the nature of the subject we are amply prepared for the large range of Scriptures which on the other hand condemn and preclude, for the humble disciple, so gross a misuse of the doctrine as would let it justify one moment\'s presumption upon Divine mercy in the heart which is at the same time sinning against the Divine love and holiness.<P>VII. Considerations in Relief of Thought.<P>We close, in view of this last remark, with some detached notes in relief, well remembering the unspeakable trial which to many devout minds the word before us has always brought.<P>1. Antinomies:<P>First in place and importance is the thought that a spiritual fact like election, which belongs to the innermost purpose and work of the Eternal, necessarily leads us to a region where comprehension is impossible, and where we can only reverently apprehend. The doctrine passes upward to the sphere where antinomies live and move, where we must be content to hear what sound to us contradictions, but which are really various aspects of infinite truth. Let us be content to know that the Divine choice is sovereign; and also that "his tender mercies are over all his works," that \'He willeth not the death of a sinner,\' that "God is love." Let us relieve the tension of such submissive reliance by reverently noting how the supreme antinomy meets one type of human need with its one side, and with its other another. To the "fearful saint" the Divine sovereignty of love is a sacred cordial. To the seeking penitent the Divine comprehensiveness of love opens the door of peace. To the deluded theorist who does not love and obey, the warnings of a fall and ruin which are possible, humanly, from any spiritual height, are a merciful beacon on the rocks.<P>2. Fatalism Another Thing:<P>Further, we remember that election, in Scripture, is as different as possible from the fatal necessity of, eg. the Stoics. It never appears as mechanical, or as a blind destiny. It has to do with the will of a God who has given us otherwise supreme proofs that He is all-good and all-kind. And it is related to man not as a helpless and innocent being but as a sinner. It is never presented as an arbitrary force majeure. Even in <a onClick="return mV(\'Rom\',9,\'1-\');">Ro 9</a> the "silence" called for is not as if to say, "You are hopelessly passive in the grasp of infinite power," but, "You, the creature, cannot judge your Maker, who must know infinitely more of cause and reason than his handiwork can know." The mystery, we may be sure, had behind it supreme right and reason, but in a region which at present at least we cannot penetrate. Again, election never appears as a violation of human will. For never in the Bible is man treated as irresponsible. In the Bible the relation of the human and Divine wills is inscrutable; the reality of both is assured.<P>3. The Moral Aspects:<P>Never is the doctrine presented apart from a moral context. It is intended manifestly to deepen man\'s submission to—not force, but—mystery, where such submission means faith. In the practical experience of the soul its designed effect is to emphasize in the believer the consciousness (itself native to the true state of grace) that the whole of his salvation is due to the Divine mercy, no part of it to his merit, to his virtue, to his wisdom. In the sanctified soul, which alone, assuredly, can make full use of the mysterious truth, is it designed to generate, together and in harmony, awe, thanksgiving and repose.<P>4. "We Know in Part":<P>A necessary caution in view of the whole subject is that here, if anywhere in the regions of spiritual study, we inevitably "know in part," and in a very limited part. The treatment of election has at times in Christian history been carried on as if, less by the light of revelation than by logical processes, we could tabulate or map the whole subject. Where this has been done, and where at the same time, under a sort of mental rather than spiritual fascination, election has been placed in the foreground of the system of religious thought, and allowed to dominate the rest, the truth has (to say the least) too often been distorted into an error. The Divine character has been beclouded in its beauty. Sovereignty has been divorced from love, and so defaced into an arbitrary fiat, which has for its only reason the assertion of omnipotence. Thus, the grievous wrong has been done of aischron ti legein peri tou Theiou, "defamation of God." For example, the revelation of a positive Divine selection has been made by inference to teach a corresponding rejection ruthless and terrible, as if the Eternal Love could ever by any possibility reject or crush even the faintest aspiration of the created spirit toward God. For such a thought not even the dark words of <a onClick="return mV(\'Rom\',9,18);">Ro 9:18</a> give Scriptural excuse. The case there in hand, Pharaoh\'s, is anything but one of arbitrary power trampling on a human will looking toward God and right. Once more, the subject is one as to which we must on principle be content with knowledge so fragmentary that its parts may seem contradictory in our present imperfect light. The one thing we may be sure of behind the veil is, that nothing can be hidden there which will really contradict the supreme and ruling truth that God is love.<P>5. The Unknown Future:<P>Finally, let us from another side remember that here, as always in the things of the Spirit, "we know in part." The chosen multitude are sovereignly "called,...justified,...glorified" (<a onClick="return mV(\'Rom\',8,29,30);">Ro 8:29-30</a>). But for what purposes? Certainly not for an end terminating in themselves. They are saved, and kept, and raised to the perfect state, for the service of their Lord. And not till the cloud is lifted from the unseen life can we possibly know what that service under eternal conditions will include, what ministries of love and good in the whole universe of being.``46';
isbe[2953]='Electrum`e-lek\'-trum:<P>The Revised Version, margin rendering of chashmal, of <a onClick="return mV(\'Eze\',1,4,27);">Eze 1:4, 27</a>; <a onClick="return mV(\'Eze\',8,2);">8:2</a> Septuagint elektron, Vulgate (Jerome\'s Latin Bible, 390-405 AD.) electrum). Both the King James Version and the English Revised Version have "amber" while the American Standard Revised Version has "glowing metal." Gesenius says electrum must not be understood as being here used for amber, but for a kind of metal remarkable for brightness, compounded of gold and silver. "Amber" is undoubtedly a poor rendering, as the Hebrew term means "polished brass." the American Standard Revised Version has the more correct rendering. <a href="./study/isbe/search.html?string=AMBER">AMBER</a>, however, may well have been known to Ezekiel (Encyclopaedia Biblica, which see).`<a href="./study/isbe/search.html?string=STONES,+PRECIOUS">STONES, PRECIOUS</a>; <a href="./study/isbe/search.html?string=BUYING">BUYING</a>`62';
isbe[2954]='Element; Elements`el\'-e-ment, (ta stoicheia, "the letters of the alphabet," "the elements out of which all things are formed," "the heavenly bodies," "the fundamental principles of any art or science"):<P>(1) In <a onClick="return mV(\'2Pe\',3,10);">2Pe 3:10</a>, the constituent parts of the physical universe ("elements shall be dissolved with fervent heat," the American Revised Version, margin "the heavenly bodies").<P>(2) In <a onClick="return mV(\'Gal\',4,3,9);">Ga 4:3, 9</a>, the Revised Version (British and American) has "rudiments," as in the King James Version margin, and in <a onClick="return mV(\'Col\',2,8,20);">Col 2:8, 20</a>, where the reference is to imperfect Jewish ordinances.`<a href="./study/isbe/search.html?string=RUDIMENTS">RUDIMENTS</a>`1';
isbe[2955]='Eleph`e\'-lef (ha-\'eleph, "the ox"):<P>A place in the lot of Benjamin not far from Jerusalem (<a onClick="return mV(\'Jos\',18,28);">Jos 18:28</a>). The name is omitted by Septuagint, unless, indeed, it is combined with that of Zelah. It may be identical with Lifta, a village W. of Jerusalem (Conder, HDB, under the word).<P>Others identify Lifta with Nephtoah.``1';
isbe[2956]='Elephant`el\'-e-fant<P>(<a onClick="return mV(\'Job\',40,15);">Job 40:15</a> the King James Version margin, the American Revised Version, margin "hippopotamus," the Revised Version (British and American) "ivory"); <a onClick="return mV(\'1Ki\',10,22);">1Ki 10:22</a> the King James Version margin; <a onClick="return mV(\'2Ch\',9,21);">2Ch 9:21</a> the King James Version; 1Macc 3:34; 6:28ff; 8:6 Possibly in Job it is the extinct mammoth.`<a href="./study/isbe/search.html?string=BEHEMOTH">BEHEMOTH</a>; <a href="./study/isbe/search.html?string=IVORY">IVORY</a>`1';

isbe[2958]='Eleutherus`e-lu\'-ther-us (Eleutheros; 1Macc 11:7; 12:30):<P>A river separating Syria and Phoenicia.``1';
isbe[2959]='Eleven, the`e-lev\'-\'-n, (hoi hendeka):<P>The eleven apostles remaining after the death of Judas. The definite article used serves to designate them as a distinct and definite group whose integrity was not destroyed by the loss of one of the twelve. The college of "the Twelve" had come to be so well recognized that the gospel writers all used on occasions the word with the definite article to represent the Twelve Apostles chosen by Jesus. This custom still remained and the numeral merely changed, as, "Afterward he was manifested unto the eleven" (<a onClick="return mV(\'Mar\',16,14);">Mr 16:14</a>; compare <a onClick="return mV(\'Luk\',24,9,33);">Lu 24:9, 33</a>; <a onClick="return mV(\'Act\',2,14);">Ac 2:14</a>). On the other hand, however, the substantive is also sometimes used, as "The eleven disciples went into Galilee" (<a onClick="return mV(\'Mat\',28,16);">Mt 28:16</a>; compare also <a onClick="return mV(\'Act\',1,26);">Ac 1:26</a>). As an illustration of the fixedness of usage, Paul refers to the eleven as "the twelve" when he recounts the appearances of Jesus after His resurrection: "And that he appeared to Cephas; then to the twelve" (<a onClick="return mV(\'1Cr\',15,5);">1Co 15:5</a>).``25';
isbe[2960]='Eleven; Stars`e-lev\'-\'-n.`<a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>`1';
isbe[2961]='Elhanan`el-ha\'-nan (\'elchanan, "whom God gave"):<P>(1) A great warrior in the army of David who slew a Philistine giant. There is a discrepancy between <a onClick="return mV(\'2Sa\',21,19);">2Sa 21:19</a> and <a onClick="return mV(\'1Ch\',20,5);">1Ch 20:5</a>. In the former passage we read, "And there was again war with the Philistines at Gob; and Elhanan, the son of Jaare-oregim the Beth-lehemite, slew Goliath the Gittite, the staff of whose spear was like a weaver\'s beam"; while in the latter we are told, "And there was again war with the Philistines; and Elhanan the son of Jair slew Lahmi the brother of Goliath the Gittite, the staff of whose spear was like a weaver\'s beam." Most modern critics prefer as the original text of the latter part of the two discrepant statements the following: "and Elhanan the son of Jair the Beth-lehemite slew Goliath the Gittite, the staff of whose spear was like a weaver\'s beam." It is contended that the Chronicler slightly modified the text before him, in order to bring it into harmony with <a onClick="return mV(\'1Sa\',17,\'1-\');">1Sa 17</a>, where David is said to have slain a Philistine giant Goliath. There is almost unanimous agreement that "Jaare-oregim" is a corrupt reading, and the "Jair" in 1 Chronicles is to be preferred. From Jerome to the present some scholars identify Elhanan with David, and thus remove the discrepancy. Ewald (Hist, III, 70) argued that the name "Goliath" was inserted in <a onClick="return mV(\'1Sa\',17,\'1-\');">1Sa 17</a> and <a onClick="return mV(\'1Sa\',21,\'1-\');">21</a> by the narrators whose compositions are embodied in Samuel, Elhanan being the real victor over Goliath, while David\'s antagonist was simply called "the Philistine."<P>(2) The son of Dodo of Bethlehem, one of David\'s mighty men (<a onClick="return mV(\'2Sa\',23,24);">2Sa 23:24</a>; <a onClick="return mV(\'1Ch\',11,26);">1Ch 11:26</a>). Some moderns think that there was only one Elhanan, and that he was the son of Dodo of the clan of Jair.``156';
isbe[2962]='Eli`e\'-li (\'eli):<P>A descendant of Ithamar, the fourth son of Aaron, who exercised the office of high priest in Shiloh at the time of the birth of Samuel. For the first time in Israel, Eli combined in his own person the functions of high priest and judge, judging Israel for 40 years (<a onClick="return mV(\'1Sa\',4,18);">1Sa 4:18</a>). The incidents in Eli\'s life are few; indeed, the main interest of the narrative is in the other characters who are associated with him. The chief interest centers in Samuel. In Eli\'s first interview with Hannah (<a onClick="return mV(\'1Sa\',1,12);">1Sa 1:12</a>ff), she is the central figure; in the second interview (<a onClick="return mV(\'1Sa\',1,24);">1Sa 1:24</a>ff), it is the child Samuel. When Eli next appears, it is as the father of Hophni and Phinehas, whose worthless and licentious lives had profaned their priestly office, and earned for them the title "men of Belial" (or "worthlessness").<P>Eli administered no stern rebuke to his sons, but only a gentle chiding of their greed and immorality. Thereafter he was warned by a nameless prophet of the downfall of his house, and of the death of his two sons in one day (<a onClick="return mV(\'1Sa\',2,\'27-36\');">1Sa 2:27-36</a>), a message later confirmed by Samuel, who had received this word directly from Yahweh Himself (<a onClick="return mV(\'1Sa\',3,11);">1Sa 3:11</a>ff). The prophecy was not long in fulfillment. During the next invasion by the Philistines, the Israelites were utterly routed, the ark of God was captured, and Hophni and Phinehas were both slain. When the news reached Eli, he was so overcome that he "fell from off his seat backward by the side of the gate; and his neck brake, and he died" (<a onClick="return mV(\'1Sa\',4,18);">1Sa 4:18</a>). The character of Eli, while sincere and devout, seems to have been entirely lacking in firmness. He appears from the history to have been a good man, full of humility and gentleness, but weak and indulgent. His is not a strong personality; he is always overshadowed by some more commanding or interesting figure.``68';
isbe[2963]='Eli, Eli, Lama, Sabachthani`e\'-li or a\'-le, la\'-ma, sa-bak\'-tha-ni.`<a href="./study/isbe/search.html?string=GOD,+NAMES+OF ">ELOI</a>`1';
isbe[2964]='Eliab`e-li\'-ab (\'eli\'abh, "God is father"):<P>(1) Prince of the tribe of Zebulun in the Exodus (<a onClick="return mV(\'Num\',1,9);">Nu 1:9</a>; <a onClick="return mV(\'Num\',2,7);">2:7</a>; <a onClick="return mV(\'Num\',7,24,29);">7:24, 29</a>; <a onClick="return mV(\'Num\',10,16);">10:16</a>).<P>(2) A Reubenite, father of Dathan and Abiram (<a onClick="return mV(\'Num\',16,11,12);">Nu 16:11-12</a>; <a onClick="return mV(\'Num\',26,8);">26:8</a>f; <a onClick="return mV(\'Deu\',11,6);">De 11:6</a>).<P>(3) Eldest son of Jesse and brother of David (<a onClick="return mV(\'1Sa\',16,6);">1Sa 16:6</a>), once called Elihu (<a onClick="return mV(\'1Ch\',27,18);">1Ch 27:18</a>). He was of commanding appearance (<a onClick="return mV(\'1Sa\',16,6);">1Sa 16:6</a>) and when serving with Saul\'s army at the time when it was confronting the Philistines and Goliath, was inclined to lord it over his brother David (<a onClick="return mV(\'1Sa\',17,28);">1Sa 17:28</a>f). His daughter Abihail became a Wife of Rehoboam (<a onClick="return mV(\'2Ch\',11,18);">2Ch 11:18</a>).<P>(4) An Ephraimite, an ancestor of Samuel (<a onClick="return mV(\'1Ch\',6,27);">1Ch 6:27</a>); called Eliel in <a onClick="return mV(\'1Ch\',6,34);">1Ch 6:34</a>, and Elihu in <a onClick="return mV(\'1Sa\',1,1);">1Sa 1:1</a>.<P>(5) A Gadire warrior with David (<a onClick="return mV(\'1Ch\',12,9);">1Ch 12:9</a>), one of 11 mighty men (<a onClick="return mV(\'1Ch\',12,8,14);">1Ch 12:8, 14</a>).<P>(6) A Levite musician (<a onClick="return mV(\'1Ch\',15,18,20);">1Ch 15:18, 20</a>; <a onClick="return mV(\'1Ch\',16,5);">16:5</a>).<P>(7) An ancestor of Judith (Judith 8:1; compare Judith 9:2).``57';
isbe[2965]='Eliada; Eliadah`e-li\'-a-da, (\'elyadha\', "God is knowing." Compare HPN,219,266, 301; Epidae, or Elidae):<P>(1) One of the sons of David (<a onClick="return mV(\'2Sa\',5,16);">2Sa 5:16</a>; <a onClick="return mV(\'1Ch\',3,8);">1Ch 3:8</a>; called <a href="./study/isbe/search.html?string=BEELIADA">BEELIADA</A>, <a onClick="return mV(\'1Ch\',14,7);">1Ch 14:7</a> (which see)).<P>(2) A descendant of Benjamin and a captain in the army of Jehoshaphat, commander of 200,000 men (<a onClick="return mV(\'2Ch\',17,17);">2Ch 17:17</a>).<P>(3) Father of Rezon, an "adversary" of Solomon (<a onClick="return mV(\'1Ki\',11,23);">1Ki 11:23</a>, the King James Version "Eliadah").``1';
isbe[2966]='Eliadas`e-li\'-a-das (Eliadas):<P>A son of Zamoth who had married a strange wife (1Esdras 9:28); called Elioenai in <a onClick="return mV(\'Ezr\',10,27);">Ezr 10:27</a>.``1';
isbe[2967]='Eliadun`e-li\'-a-dun, the Revised Version (British and American)<P><a href="./study/isbe/search.html?string=ILIADUN">ILIADUN</a> (which see).``1';
isbe[2968]='Eliah`e-li\'-a.`<a href="./study/isbe/search.html?string=ELIJAH">ELIJAH</a>`1';
isbe[2969]='Eliahba`e-li\'-a-ba, e-li-a\'-ba (\'elyach-ba\', "God hides"):<P>One of David\'s 30 mighty men (<a onClick="return mV(\'2Sa\',23,32);">2Sa 23:32</a>; <a onClick="return mV(\'1Ch\',11,33);">1Ch 11:33</a>).``1';
isbe[2970]='Eliakim`e-li\'-a-kim (\'elyaqim; Eliakeim, "God sets up"):<P>(1) The son of Hilkiah who succeeded Shebna as gorvernor of the palace and "grand vizier" under Hezekiah (<a onClick="return mV(\'Isa\',22,20);">Isa 22:20</a>). The functions of his office are seen from the oracle of Isaiah in which Shebna is deposed and Eliakim set in his place (<a onClick="return mV(\'Isa\',22,15);">Isa 22:15</a>ff). He is the "treasurer" (the Revised Version, margin "steward"), and is "over the house" (<a onClick="return mV(\'Isa\',22,15);">Isa 22:15</a>).<P>At his installation he is clothed with a robe and girdle, the insignia of his office, and, having the government committed into his hand, is the "father to the inhabitants of Jerusalem, and to the house of Judah" (<a onClick="return mV(\'Isa\',22,21);">Isa 22:21</a>). The key of the house of David is laid on his shoulder, and he alone has power to open and shut, this being symbolic of his absolute authority as the king\'s representative (<a onClick="return mV(\'Isa\',22,22);">Isa 22:22</a>).<P>One of Solomon\'s officials is the first mentioned as occupying this position (<a onClick="return mV(\'1Ki\',4,6);">1Ki 4:6</a>), and this office was continued in both the Northern and Southern Kingdom (<a onClick="return mV(\'1Ki\',16,9);">1Ki 16:9</a>; <a onClick="return mV(\'1Ki\',18,3);">18:3</a>; <a onClick="return mV(\'2Ki\',10,5);">2Ki 10:5</a>; <a onClick="return mV(\'2Ki\',15,5);">15:5</a>). Its importance is seen from the fact that after Azariah was smitten with leprosy, Jotham his heir "was over the household, judging the people of the land" (<a onClick="return mV(\'2Ki\',15,5);">2Ki 15:5</a>).<P>When Sennacherib sent an army against Jerusalem in 701, Eliskim was one of these Jewish princes who held on behalf of Hezekiah a parley with the Assyrian officers (<a onClick="return mV(\'2Ki\',18,18,26,37);">2Ki 18:18, 26, 37</a>; <a onClick="return mV(\'Isa\',36,3,11,22);">Isa 36:3, 11, 22</a>). As a result of the invader\'s threats, he was sent by Hezekiah in sackcloth to Isaiah, entreating his prayers to Yahweh on behalf of Jerusalem (<a onClick="return mV(\'2Ki\',19,2);">2Ki 19:2</a>; <a onClick="return mV(\'Isa\',37,2);">Isa 37:2</a>).<P>(2) The original name of Jehoiakim, the son of Josiah, whom Pharaoh-necoh made king of Judah (<a onClick="return mV(\'2Ki\',23,34);">2Ki 23:34</a>; <a onClick="return mV(\'2Ch\',36,4);">2Ch 36:4</a>).<P>(3) A priest who assisted at the dedication of the wall of Jerusalem, rebuilt after his return from Babylon (<a onClick="return mV(\'Neh\',12,41);">Ne 12:41</a>).<P>(4) A grandson of Zerubbabel and ancestor of Jesus (<a onClick="return mV(\'Mat\',1,13);">Mt 1:13</a>).<P>(5) An ancestor of Jesus (<a onClick="return mV(\'Luk\',3,30);">Lu 3:30</a>).``78';
isbe[2971]='Eliali`e-li\'-a-li (Elialei):<P>1Esdras 9:34; possibly corresponds to "Binnui" in <a onClick="return mV(\'Ezr\',10,38);">Ezr 10:38</a>.``1';
isbe[2972]='Eliam`e-li\'-am (\'eli\'-am, "people\'s God"?):<P>(1) Father of Bathsheba (<a onClick="return mV(\'2Sa\',11,3);">2Sa 11:3</a>); in <a onClick="return mV(\'1Ch\',3,5);">1Ch 3:5</a> called Ammiel.<P>(2) One of David\'s "thirty," son of Ahithophel the Gilonite (<a onClick="return mV(\'2Sa\',23,34);">2Sa 23:34</a>).``1';
isbe[2973]='Eliaonias`e-li-a-o-ni\'-as (Elialonias):<P>A descendant of Phaath Moab (1Esdras 8:31); called "Eliehoenai" in <a onClick="return mV(\'Ezr\',8,4);">Ezr 8:4</a>.``1';
isbe[2974]='Elias`e-li\'-as.`<a href="./study/isbe/search.html?string=ELIJAH">ELIJAH</a>`1';
isbe[2975]='Eliasaph`e-li\'-a-saf (\'elyacaph, "God has added"):<P>(1) Son of Deuel; prince of the tribe of Gad in the Exodus (<a onClick="return mV(\'Num\',1,14);">Nu 1:14</a>; <a onClick="return mV(\'Num\',2,14);">2:14</a>; <a onClick="return mV(\'Num\',7,42,47);">7:42, 47</a>; <a onClick="return mV(\'Num\',10,20);">10:20</a>).<P>(2) Son of Lael; prince of the Gershonites (<a onClick="return mV(\'Num\',3,24);">Nu 3:24</a>).``1';
isbe[2976]='Eliashib`e-li\'-a-shib (\'elyashibh, "God restores"):<P>(1) A descendant of David (<a onClick="return mV(\'1Ch\',3,24);">1Ch 3:24</a>).<P>(2) Head of the eleventh course of priests (<a onClick="return mV(\'1Ch\',24,12);">1Ch 24:12</a>).<P>(3) The high priest in the time of Nehemiah. He, with his brethren the priests, helped in the rebuilding of the wall (<a onClick="return mV(\'Neh\',3,1);">Ne 3:1</a>). But later he was "allied unto Tobiah" the Ammonite (<a onClick="return mV(\'Neh\',13,4);">Ne 13:4</a>) and allowed that enemy of Nehemiah the use of a great chamber in the temple (<a onClick="return mV(\'Neh\',13,5);">Ne 13:5</a>); and one of his grandsons, a son of Joiada, married a daughter of Sanballat the Horonite and was for this expelled from the community by Nehemiah (<a onClick="return mV(\'Neh\',13,28);">Ne 13:28</a>).<P>(4,5,6) Three Israelites, one a "singer," who had married foreign wives (<a onClick="return mV(\'Ezr\',10,24,27,36);">Ezr 10:24, 27, 36</a>).<P>(7) Father of Jehohanan (<a onClick="return mV(\'Ezr\',10,6);">Ezr 10:6</a>); probably identical with (3) above. Called Eliasib in 1Esdras 9:1.`<a href="./study/isbe/search.html?string=SANBALLAT">SANBALLAT</a>`57';
isbe[2977]='Eliasib`e-li\'-a-sib.`<a href="./study/isbe/search.html?string=ELIASHIB">ELIASHIB</a>`1';
isbe[2978]='Eliasibus`e-li-as\'-i-bus (Eliasibos, the King James Version Eleazurus):<P>One of the holy singers who had married a foreign wife (1Esdras 9:24); called "Eliashib" in <a onClick="return mV(\'Ezr\',10,27);">Ezr 10:27</a>.``1';
isbe[2979]='Eliasimus`e-li-as\'-i-mus (Eliasimos; the King James Version Elisimus):<P>One who had married a foreign wife (1Esdras 9:28).``1';
isbe[2980]='Eliasis`e-li\'-a-sis (Eliasis):<P>One who had married a foreign wife (1Esdras 9:34); corresponds to "Jaasu" in <a onClick="return mV(\'Ezr\',10,37);">Ezr 10:37</a>.``1';
isbe[2981]='Eliathah`e-li\'-a-tha (\'eli\'-athah, "God has come"):<P>A Hemanite, head of the twentieth division of the temple musicians (<a onClick="return mV(\'1Ch\',25,4,27);">1Ch 25:4, 27</a>).``1';
isbe[2982]='Elidad`e-li\'-dad (\'elidhadh, "God has loved"):<P>Prince of Benjamin in the division of the land (<a onClick="return mV(\'Num\',34,21);">Nu 34:21</a>); perhaps the same as <a href="./study/isbe/search.html?string=ELDAD">ELDAD</a> (which see).``1';
isbe[2983]='Eliehoenai`e-li-e-ho\'-e-ni (\'elyeho\'enay, "to Yahweh are mine eyes"):<P>(1) (the King James Version Elioenai) a Korahite doorkeeper (<a onClick="return mV(\'1Ch\',26,3);">1Ch 26:3</a>).<P>(2) (the King James Version Elihoenai) Head of a family in the Return (<a onClick="return mV(\'Ezr\',8,4);">Ezr 8:4</a>).``1';
isbe[2984]='Eliel`e-li\'-el, el\'-i-el (\'eli\'el, "El is God," or "my God is God"):<P>(1,2,3) Mighty men of David (<a onClick="return mV(\'1Ch\',11,46,47);">1Ch 11:46-47</a>; <a onClick="return mV(\'1Ch\',12,11);">12:11</a>).<P>(4) A chief of Manasseh, east of the Jordan (<a onClick="return mV(\'1Ch\',5,24);">1Ch 5:24</a>).<P>(5, 6) Two chiefs of Benjamin (<a onClick="return mV(\'1Ch\',8,20,22);">1Ch 8:20, 22</a>).<P>(7) A chief Levite from Hebron (<a onClick="return mV(\'1Ch\',15,9,11);">1Ch 15:9, 11</a>):<P>(8) A Kohathite in the line of Elkshah, Samuel and Heman (<a onClick="return mV(\'1Ch\',6,34);">1Ch 6:34</a>).<P>(9) A Levite of the time of Hezekiah (<a onClick="return mV(\'2Ch\',31,13);">2Ch 31:13</a>).`<a href="./study/isbe/search.html?string=ELIAB">ELIAB</a>`1';
isbe[2985]='Elienai`el-i-e\'-na-i (\'eli\'enay):<P>A Benjamite chief (<a onClick="return mV(\'1Ch\',8,20);">1Ch 8:20</a>)``1';
isbe[2986]='Eliezer`el-i-e\'-zer, e-li-e\'-zer (\'eli\'ezer; Eliezer, "God is help"):<P>(1) The chief servant of Abram (<a onClick="return mV(\'Gen\',15,2);">Ge 15:2</a>); the American Standard Revised Version "Eliezer of Damascus," the English Revised Version "Dammesek Eliezer." The Hebrew is peculiar: literally, "And the son of the possession (mesheq) of my house is Dammeseq (of) Eliezer." A possible but unlikely meaning is that his property would become the possession of Damascus, the city of Eliezer. Targum Syriac (Revised Version margin) read "Eliezer the Damascene": this supposes a reading, "Eliezer ha- dammasqi" or "mid-dammeseq." The text may be corrupt: the assonance between mesheq and Dammeseq is suspicious. Abram calls Eliezer "one born in my house" i.e. a dependant, a member of his household, and so regards him as his heir, Lot having gone from him (<a onClick="return mV(\'Gen\',13,\'1-\');">Ge 13</a>). Eliezer is probably the servant, "the eider of his house, that ruled over all that he had," of <a onClick="return mV(\'Gen\',24,\'1-\');">Ge 24</a>.<P>(2) The 2nd son of Moses and Zipporah, called thus for "the God of my father was my help, and delivered me from the sword of Pharaoh" (<a onClick="return mV(\'Exd\',18,4);">Ex 18:4</a>; <a onClick="return mV(\'1Ch\',23,15);">1Ch 23:15</a>ff).<P>(3) A son of Becher, one of the sons of Benjamin (<a onClick="return mV(\'1Ch\',7,8);">1Ch 7:8</a>).<P>(4) A priest who assisted in bringing up the ark from the house of Obed-edom to Jerusalem (<a onClick="return mV(\'1Ch\',15,24);">1Ch 15:24</a>).<P>(5) The son of Zichri, ruler over the Reubenites in the time of David (<a onClick="return mV(\'1Ch\',27,16);">1Ch 27:16</a>).<P>(6) The son of Dodavahu of Mareshah who prophesied the destruction of the ships which Jehochaphat, king of Judah, built, because he had done so in cooperation with Ahaziah, king of Israel (<a onClick="return mV(\'2Ch\',20,35);">2Ch 20:35</a>ff).<P>(7) One of the messengers whom Ezra sent to Iddo, the chief at Casiphia, with the request for ministers for the Temple (<a onClick="return mV(\'Ezr\',8,16);">Ezr 8:16</a>ff).<P>(8,9,10) A priest, a Levite, and one of the sons of Harim who had married non-Israelitish women (<a onClick="return mV(\'Ezr\',10,18,23,31);">Ezr 10:18, 23, 31</a>).<P>(11) An ancestor of Jesus in the genealogy given by Luke (<a onClick="return mV(\'Luk\',3,29);">Lu 3:29</a>).``78';
