isbe[2901]='Eglah`eg\'-la (\'eghlah, "heifer"):<P>Wife of David and mother of Ithream (<a onClick="return mV(\'2Sa\',3,5);">2Sa 3:5</a> parallel <a onClick="return mV(\'1Ch\',3,3);">1Ch 3:3</a>).``1';
isbe[2902]='Eglaim`eg\'-la-im (\'eghlayim; Agaleim):<P>A place named in <a onClick="return mV(\'Isa\',15,8);">Isa 15:8</a>, possibly in the south of Moab. Eusebius (Onomasticon) identifies it with Agallim, a village 8 Roman miles south of Areopolis. It cannot now be identified.``1';
isbe[2903]='Eglath-Shelishiyah`eg\'-lath-shel-i-shi\'-ya (\'eghlath shelishiyah):<P>Found in <a onClick="return mV(\'Isa\',15,5);">Isa 15:5</a>; <a onClick="return mV(\'Jer\',48,34);">Jer 48:34</a> (Hebrew) in oracles against Moab. the King James Version translates "an heifer of three years old"; the Revised Version (British and American) takes it as the name of a place, but the American Revised Version, margin has "a heifer three years old," according to Septuagint. In the former case strong and unconquered cities, Zoar and Horonaim, are compared to the heifer not yet broken to the yoke. Such use of "heifer" is not infrequent (compare <a onClick="return mV(\'Jer\',46,20);">Jer 46:20</a>; <a onClick="return mV(\'Hsa\',10,11);">Ho 10:11</a>, etc.). The majority of scholars, however, take it as a place-name. Some would read "the third Eglath," as if there were three towns of that name. No probable identification has been suggested.``54';
isbe[2904]='Eglon (1)`eg\'-lon (\'eghlon, "circle"):<P>A king of Moab in the period of the Judges who, in alliance with Ammon and Amalek, overcame Israel and made Jericho his capital, presumably driven across the Jordan by the turmoil in his own kingdom which at that time was probably being used as a battle ground by Edom and the desert tribes (compare <a onClick="return mV(\'Gen\',36,35);">Ge 36:35</a>). After 18 years of servitude the children of Israel were delivered by Ehud the Benjamite, who like so many other Benjamites (compare <a onClick="return mV(\'Jdg\',20,16);">Jud 20:16</a>) was left-handed. Under the pretext of carrying a present to the tyrant, he secured a private interview and assassinated him with a two-edged sword which he had carried concealed on his right side (<a onClick="return mV(\'Jdg\',3,\'19-22\');">Jud 3:19-22</a>). Ehud made his escape, rallied the children of Israel about him and returned to conquer the Moabites (<a onClick="return mV(\'Jdg\',3,30);">Jud 3:30</a>).``80';
isbe[2905]='Eglon (2)`eg\'-lon (\'eghlon; Odollam):<P>A royal Canaanite city whose king joined the league headed by Adonizedek of Jerusalem against the Gibeonites, which suffered overwhelming defeat at the hands of Joshua (<a onClick="return mV(\'Jos\',10,\'1-\');">Jos 10</a>). Joshua passed from Libnah to Lachish, and from Lachish to Eglon on his way to Hebron (<a onClick="return mV(\'Jos\',10,31);">10:31</a>ff). It was in the Shephelah of Judah (<a onClick="return mV(\'Jos\',15,39);">15:39</a>). The name seems to be preserved in that of Khirbet \'Ajlan, about 10 miles west of Beit Jibrin. Professor Petrie, however, thinks that the site of Tell Nejileh better suits the requirements. While Khirbet \'Ajlan is a comparatively modern site, the city at Tell Nejileh must have been contemporary with that at Tell el-Chesy (Lachish). It lies fully three miles southeast of Tell el-Chesy.``54';
isbe[2906]='Egypt`e\'-jipt:<P><b>I. THE COUNTRY</b><P class="in15">1. The Basis of the Land<P class="in15">2. The Nile Valley<P class="in15">3. Earliest Human Remains<P class="in15">4. Climate<P class="in15">5. Conditions of Life<P class="in15">6. The Nile<P class="in15">7. The Fauna<P class="in15">8. The Flora<P class="in15">9. The Prehistoric Races<P><b>II. THE HISTORY</b><P class="in15">1. 1st and 2nd Ages: Prehistoric<P class="in15">2. 3d Age: Ist and IInd Dynasties<P class="in15">3. 4th Age: IIIrd through VIth Dynasties<P class="in15">4. 5th Age: VIIth through XIVth Dynasties<P class="in15">5. 6th Age: XVth through XXIVth Dynasties<P class="in15">6. 7th Age: XXVth Dynasty to Roman Times<P class="in15">7. 8th Age: Arabic<P class="in15">8. Early Foreign Connections<P><b>III. THE OLD TESTAMENT CONNECTIONS</b><P class="in15">1. Semitic Connections<P class="in15">2. Abramic Times<P class="in15">3. Circumcision<P class="in15">4. Joseph<P class="in15">5. Descent into Egypt<P class="in15">6. The Oppression<P class="in15">7. The Historic Position<P class="in15">8. The Plagues<P class="in15">9. Date of the Exodus<P class="in15">10. Route of the Exodus<P class="in15">11.Numbers of the Exodus<P class="in15">12. Israel in Canaan<P class="in15">13. Hadad<P class="in15">14. Pharaoh\'s Daughter<P class="in15">15. Shishak<P class="in15">16. Zerakh<P class="in15">17. The Ethiopians<P class="in15">18. Tahpanhes<P class="in15">19. Hophra<P class="in15">20. The Jews of Syene<P class="in15">21. The New Jerusalem of Oniah<P class="in15">22. The Egyptian Jew<P class="in15">23. Cities and Places Alphabetically<P><b>IV. THE CIVILIZATION</b><P class="in15">1. Language<P class="in15">2. Writing<P class="in15">3. Literature<P class="in15">4. Four Views of Future Life<P class="in15">5. Four Groups of Gods<P class="in15">6. Foreign Gods<P class="in15">7. Laws<P class="in15">8. Character<P><b>V. LITERATURE</b><hr /><P>Egypt (mitsrayim; he Aiguptos):<P>Usually supposed to represent the dual of Mitsrayim, referring to "the two lands," as the Egyptians called their country. This dualism, however, has been denied by some.<P>I. The Country.<P>1. The Basis of the Land:<P>Though Egypt is one of the earliest countries in recorded history, and as regards its continuous civilization, yet it is a late country in its geological history and in its occupation by a settled population. The whole land up to Silsileh is a thick mass of Eocene limestone, with later marls over that in the lower districts. It has been elevated on the east, up to the mountains of igneous rocks many thousand feet high toward the Red Sea. It has been depressed on the west, down to the Fayum and the oases below sea-level. This strain resulted in a deep fault from north to south for some hundreds of miles up from the Mediterranean. This fault left its eastern side about 200 ft. above its western, and into it the drainage of the plateau poured, widening it out so as to form the Nile valley, as the permanent drain of Northeast Africa. The access of water to the rift seems to have caused the basalt outflows, which are seen as black columnar basalt south of the Fayum, and brown massive basalt at Khankah, north of Cairo.<P>2. The Nile Valley:<P>The gouging out of the Nile valley by rainfall must have continued when the land was 300 ft. higher than at present, as is shown by the immense fails of strata into collapsed caverns which were far below the present Nile level. Then, after the excavations of the valley, it has been submerged to 500 ft. lower than at present, as is shown by the rolled gravel beds and deposits on the tops of the water-worn cliffs, and the filling up of the tributary valleys—as at Thebes—by deep deposits, through which the subsequent stream beds have been scoured out. The land still had the Nile source 30 ft. higher than it is now within the human period, as seen by the worked flints in high gravel beds above the Nile plain. The distribution of land and water was very different from that at present when the land was only 100 ft. lower than now. Such a change would make the valley an estuary up to south of the Fayum, would submerge much of the western desert, and would unite the Gulf of Suez and the Mediterranean. Such differences would entirely alter the conditions of animal life by sea and land. And as the human period began when the water was considerably higher, the conditions of climate and of life must have greatly changed in the earlier ages of man\'s occupation.<P>3. Earliest Human Remains:<P>The earliest human remains belonging to the present condition of the country are large paleolithic flints found in the side valleys at the present level of the Nile. As these are perfectly fresh, and not rolled or altered, they show that paleolithic man lived in Egypt under the present conditions. The close of this paleolithic age of hunters, and the beginning of a settled population of cultivators, cannot have been before the drying up of the climate, which by depriving the Nile of tributary streams enfeebled it so that its mud was deposited and formed a basis for agriculture. From the known rate of deposit, and depth of mud soil, this change took place about 10,000 years ago. As the recorded history of the country extends 7,500 years, and we know of two prehistoric ages before that, it is pretty well fixed that the disappearance of paleolithic man, and the beginning of the continuous civilization must have been about 9,000 to 10,000 years ago. For the continuation of this subject see the section on "History" below.<P>4. Climate:<P>The climate of Egypt is unique in the world. So far as solar heat determines it, the condition is tropical; for, though just north of the tropic which lies at the boundary of Egypt and Nubia, the cloudless condition fully compensates for higher latitude. So far as temperature of the air is concerned, the climate is temperate, the mean heat of the winter months being 52 degree and of the summer about 80 degree, much the same as Italy. This is due to the steady prevalence of north winds, which maintain fit conditions for active, strenuous work. The rainlessness and dry air give the same facility of living that is found in deserts, where shelter is only needed for temperature and not for wet; while the inundation provides abundant moisture for the richest crops.<P>5. Conditions of Life:<P>The primitive condition—only recently changed—of the crops being all raised during five cool months from November to April, and the inundation covering the land during all the hot weather, left the population free from labor during the enervating season, and only required their energies when work was possible under favorable conditions. At the same time it gave a great opportunity for monumental work, as any amount of labor could be drawn upon without the smallest reduction in the produce of the country. The great structures which covered the land gave training and organization to the people, without being any drain upon the welfare of the country. The inundation covering the plain also provided the easiest transport for great masses from the quarries at the time when labor was abundant. Thus the climatic conditions were all in favor of a great civilization, and aided its production of monuments. The whole mass of the country being of limestone, and much of it of the finest quality, provided material for construction at every point. In the south, sandstone and granite were also at hand upon the great waterway.<P>6. The Nile:<P>The Nile is the great factor which makes life possible in Northeast Africa, and without it Egypt would only be a desolate corner of the Sahara. The union of two essentially different streams takes place at Kharrum. The White or light Nile comes from the great plains of the Sudan, while the Blue or dark Nile descends from the mountains of Abyssinia. The Sudan Nile from Gondokoro is filtered by the lakes and the sudd vegetation, so that it carries little mud; the Abyssinian Nile, by its rapid course, brings down all the soil which is deposited in Egypt, and which forms the basis for cultivation. The Sudan Nile rises only 6 ft. from April to November; while the Abyssinian Nile rises 26 ft. from April to August. The latter makes the rise of the inundation, while the Sudan Nile maintains the level into the winter. In Egypt itself the unchecked Nile at Aswan rises 25 ft. from the end of May to the beginning of September; while at Cairo, where modified by the irrigation system, it rises 16 ft. from May to the end of September. It was usually drained off the land by the beginning of November, and cultivation was begun. The whole cultivable land of Egypt is but the dried-up bed of the great river, which fills its ancient limits during a third of the year. The time taken by a flush of water to come down the Nile is about 15 days from 400 miles above Khartum to Aswan, and about 6 days from Aswan to Cairo, or 80 to 90 miles a day, which shows a flow of 3 to 3 1/2 miles an hour when in flood.<P>7. The Fauna:<P>The fauna has undergone great changes during the human period. At the close of the prehistoric age there are represented the giraffe, elephant, wild ox, lion, leopard, stag, long-necked gazelle and great dogs, none of which are found in the historic period. During historic times various kinds of antelopes have been exterminated, the hippopotamus was driven out of the Delta during Roman times, and the crocodile was cleared out of Upper Egypt and Nubia in the last century. Cranes and other birds shown on early sculptures are now unknown in the country. The animals still surviving are the wolf, jackal, hyena, dogs, ichneumon, jerboa, rats, mice, lizards (up to 4 ft. long) and snakes, besides a great variety of birds, admirably figured by Whymper, Birds of Egypt. Of tamed animals, the ox, sheep, goat and donkey are ancient; the cat and horse were brought in about 2000 BC, the camel was not commonly known till 200 AD, and the buffalo was brought to Egypt and Italy in the Middle Ages.<P>8. The Flora:<P>The cultivated plants of Egypt were numerous. In ancient times we find the maize (durrah), wheat, barley and lentil; the vine, currant, date palm, dum palm, fig, olive and pomegranate; the onion, garlic, cucumber, melon and radish; the sont acacia, sycamore and tamarisk; the flax, henna and clover; and for ornament, the lotus, convolvulus and many others. The extension of commerce brought in by the Greek period, the bean, pea, sesame, lupin, helbeh, colocasia and sugar-cane; also the peach, walnut, castor-oil and pear. In the Roman and Arabic ages came in the chick pea, oats, rice, cotton, orange and lemon. In recent times have come the cactus, aloe, tomato, Indian corn, lebbek acacia and beetroot. Many European flowering and ornamental plants were also used in Egypt by the Greeks, and brought in later by the Arabs.<P>9. The Prehistoric Races:<P>The original race in Egypt seems to have been of the steatopygous type now only found in South Africa. Figures of this race are known in the caves of France, in Malta, and later in Somaliland. As this race was still known in Egypt at the beginning of the neolithic civilization, and is there represented only by female figures in the graves, it seems that it was being exterminated by the newcomers and only the women were kept as slaves. The neolithic race of Egypt was apparently of the Libyan stock. There seems to have been a single type of the Amorites in Syria, the prehistoric Egyptians and the Libyans; this race had a high, well-filled head, long nose slightly aquiline, and short beard; the profile was upright and not prognathous, the hair was wavy brown. It was a better type than the present south Europeans, of a very capable and intelligent appearance. From the objects found, and the religious legends, it seems that this race was subdued by an eastern, and probably Arabian race, in the prehistoric age.<P>II. The History.<P>The founders of the dynastic history were very different, having a profile with nose and forehead in one straight line, and rather thick, but well-formed lips. Historically the indications point to their coming from about Somali land by water, and crossing into Egypt by the Koptos road from the Red Sea. The IInd Dynasty gave place to some new blood, probably of Sudany origin. In the VIth and VIIth Dynasties foreigners poured in apparently from the North, perhaps from Crete, judging by their foreign products. The XVth and XVIth Dynasties were Hyksos, or Semitic "princes of the desert" from the East. The XVIIth and XVIIIth Dynasties were Berber in origin. The XIXth Dynasty was largely Semitic from Syria. The XXIId Dynasty was headed by an eastern adventurer Sheshenq, or Shusinak, "the man of Susa." The XXVth Dynasty was Ethiopian. The XXVIth Dynasty was Libyan. The Greeks then poured into the Delta and the Fayum, and Hellenized Egypt. The Roman made but little change in the population; but during his rule the Arab began to enter the eastern side, and by 641 AD the Arab conquest swept the land, and brought in a large part—perhaps the majority—of the ancestors of the present inhabitants. After 3 centuries the Tunisians—the old Libyans—conquered Egypt again. The later administrations by Syrians, Circassians, Turks and others probably made no change in the general population. The economic changes of the past century have brought in Greeks, Italians and other foreigners to the large towns; but all these only amount to an eightieth of the population. The Coptics are the descendants of the very mixed Egyptians of Roman age, kept separate from the Arab invaders by their Christianity. They are mainly in Upper Egypt, where some villages are entirely Coptic, and are distinguished by their superior cleanliness, regularity, and the freedom of the women from unwholesome seclusion. The Coptics, though only a fifteenth of the population, have always had a large share of official posts, owing to their intelligence and ability being above that of the Muslim.<P>1. 1st and 2d Ages: Prehistoric:<P>In dealing with the history, we here follow the dating which was believed and followed by the Egyptians themselves. All the monumental remains agree with this, so far as they can check it; and the various arbitrary reductions that have been made on some periods are solely due to some critics preferring their internal sense to all the external facts. For the details involved in the chronology, see Historical Studies, II (British School of Archaeology in Egypt). The general outline of the periods is given here, and the detailed view of the connection with Old Testament history is treated in later sections.<P>1st Age.<P>The prehistoric age begins probably about 8000 BC, as soon as there was a sufficient amount of Nile deposit to attract a settled population. The desert river valley of Egypt was probably one of the latest haunts of steatopygous Paleolithic man of the Bushman type. So soon as there was an opening for a pastoral or agricultural people, he was forced away by settlers from Libya. These settlers were clad in goatskins, and made a small amount of pottery by hand; they knew also of small quantities of copper, but mainly used flint, of which they gradually developed the finest working known in any age. They rapidly advanced in civilization. Their pottery of red polished ware was decorated with white clay patterns, exactly like the pottery still made in the mountains of Algeria. The forms of it were very varied and exquisitely regular, although made without the wheel. Their hardstone vases are finer than any of those of the historic ages. They adopted spinning, weaving and woodwork.<P>2nd Age.<P>Upon these people came in others probably from the East, who brought in the use of the Arab face-veil, the belief in amulets, and the Persian lapis lazuli. Most of the previous forms of pottery disappear, and nearly all the productions are greatly altered. Copper became common, while gold, silver and lead were also known. Heliopolis was probably a center of rule.<P>2. 3d Age: Ist and IId Dynasties:<P>About 5900 BC a new people came in with the elements of the art of writing, and a strong political ability of organization. Before 5800 BC they had established kings at Abydos in Upper Egypt, and for 3 centuries they gradually increased their power. On the carved slates which they have left, the standards of the allied tribes are represented; the earliest in style shows the standard of Koptos, the next has a standard as far north as Hermopolis, and the latest bears the standard of Letopolis, and shows the conquest of the Fayum, or perhaps one of the coast lakes. This last is of the first king of the Ist Dynasty, Mena.<P>The conquest of all Egypt is marked by the beginning of the series of numbered dynasties beginning with Mena, at about 5550 BC. The civilization rapidly advanced. The art was at its best under the third king, Zer, and thence steadily declined. Writing was still ideographic under Mena, but became more syllabic and phonetic toward the end of the dynasty. The work in hardstone was at its height in the vases of the early part of the Ist Dynasty, when an immense variety of beautiful stones appear. It greatly fell off on reaching the IId Dynasty. The tombs were all of timber, built in large pits in the ground.<P>3. 4th Age: IIIrd through VIth Dynasties:<P>The IInd Dynasty fell about 5000 BC, and a new power rapidly raised the art from an almost barbarous state to its highest triumphs by about 4750 BC, when the pyramid building was started. Khufu, the builder of the Great Pyramid in the IVth Dynasty, was one of the greatest rulers of Egypt. He organized the administration on lines which lasted for ages. He reformed the religious system, abolishing the endowments, and substituting models for the sacrifice of animals. He trained the largest body of skilled labor that ever appeared, for the building of his pyramid, the greatest and most accurate structure that the world has ever seen. The statuary of this age is more lifelike than that of any later age. The later reigns show steady decay in the character of work, with less dignity and more superficiality in the article<P>4. 5th Age: VIIth through XIVth Dynasties:<P>By about 4050 BC, the decline of Egypt allowed of fresh people pressing in from the North, probably connected with Crete. There are few traces of these invaders; a curious class of barbaric buttons used as seals are their commonest remains. Probably the so-called "Hyksos sphinxes" and statues are of these people, and belong to the time of their attaining power in Egypt. By 3600 BC, the art developed into the great ages of the XIth to the XIIth Dynasties which lasted about 2 centuries. The work is more scholastic and less natural than before; but it is very beautiful and of splendid accuracy. The exquisite jewelry of Dahshur is of this age. After some centuries of decay this civilization passed away.<P>5. 6th Age: XVth through XXIVth Dynasties:<P>The Semitic tribes had long been filtering into Egypt, and Babylonian Semites even ruled the land until the great migration of the Hyksos took place about 2700 BC. These tribes were ruled by kings entitled "princes of the desert," like the Semitic Absha, or Abishai, shown in the tomb of Beni-hasan, as coming to settle in Egypt. By 1700 BC the Berbers who had adopted the Egyptian civilization pressed down from the south, and ejected the Hyksos rule. This opened the most flourishing period of Egyptian history, the XVIIIth Dynasty, 1587-1328 BC. The profusion of painted tombs at Thebes, which were copied and popularized by Gardner Wilkinson, has made the life of this period very familiar to us. The immense temples of Karnak and of Luqsor, and the finest of the Tombs of the Kings have impressed us with the royal magnificence of this age. The names of Thothmes I and III, of the great queen Hatshepsut, of the magnificent Amenhotep III, and of the monotheist reformer Akchenaton are among those best known in the history. Their foreign connections we shall notice later.<P>The XIXth and XXth Dynasties were a period of continual degradation from the XVIIIth. Even in the best work of the 6th Age there is hardly ever the real solidity and perfection which is seen in that of the 4th or 5th Ages. But under the Ramessides cheap effects and showy imitations were the regular system. The great Rameses II was a great advertiser, but inferior in power to half a dozen kings of the previous dynasty. In the XXth Dynasty one of the royal daughters married the high priest of Amen at Thebes; and on the unexpected death of the young Rameses V, the throne reverted to his uncle Rameses VI, whose daughter then became the heiress, and her descendants, the high priests of Amen, became the rightful rulers. This priestly rule at Thebes; beginning in 1102 BC, was balanced by a purely secular rule of the north at Tanis (Zoan). These lasted until the rise of Sheshenq I (Shishak) in 952 BC, the founder of the XXIId Dynasty. His successors gradually decayed till the fall of the XXIIIrd Dynasty in 721 BC. The Ethiopian XXVIth Dynasty then held Egypt as a province of Ethiopia, down to 664 BC.<P>6. 7th Age: XXVth Dynasty to Roman Times:<P>It is hard to say when the next age began—perhaps with the Ethiopians; but it rose to importance with the XXVIth Dynasty under Psamtek (Psammitichos I), 664-610 BC, and continued under the well-known names of Necoh, Hophra and Amasis until overthrown by the Persians in 525 BC. From 405 to 342 the Egyptians were independent; then the Persians again crushed them, and in 332 they fell into the hands of the Macedonians by the conquest of Alexander.<P>The Macedonian Age of the Ptolemies was one of the richest and most brilliant at its start, but soon faded under bad rulers till it fell hopelessly to pieces and succumbed to the Roman subjection in 30 BC. From that time Egypt was ground by taxation, and steadily impoverished. By 300 AD it was too poor to keep even a copper currency in circulation, and barter became general. Public monuments entirely ceased to be erected, and Decius in 250 AD is the last ruler whose name was written in the old hieroglyphs, which were thenceforward totally forgotten. After three more centuries of increasing degradation and misery, the Arab invasion burst upon the land, and a few thousand men rode through it and cleared out the remaining effete garrisons of the empire in 641 AD.<P>7. 8th Age: Arabic:<P>The Arab invasion found the country exhausted and helpless; repeated waves of tribes poured in, and for a generation or two there was no chance of a settlement. Gradually the majority of the inhabitants were pressed into Islam, and by about 800 AD a strong government was established from Bagdad, and Egypt rapidly advanced. In place of being the most impoverished country it became the richest land of the Mediterranean. The great period of medieval Egypt was under the guidance of the Mesopotamian civilization, 800-969 AD. The Tunisian dominion of the Fatimites, 969-1171, was less successful. Occasionally strong rulers arose, such as Salah-ed-Din (Saladin), but the age of the Mamalukes, 1250-1577, was one of steady decline. Under the Turkish dominion,1517, Egypt was split up into many half-independent counties, whose rulers began by yielding tribute, but relapsed into ignoring the Caliphate and living in continual internal feuds. In 1771 Aly Bey, a slave, succeeded in conquering Syria. The French and British quarrel left Muhamed Aly to rise supreme, and to guide Egypt for over 40 years. Again Egypt conquered Syria, 1831-39, but was compelled by Europe to retreat. The opening of the Suez Canal (1869) necessarily led to the subjection of Egypt to European direction.<P>8. Early Foreign Connections:<P>The foreign connections of Egypt have been brought to light only during the last 20 years. In place of supposing that Egypt was isolated until the Greek conquest, we now see that it was in the closest commercial relation with the rest of the world throughout its history. We have already noted the influences which entered by conquest. During the periods of high civilization in Egypt, foreign connections came into notice by exploration and by trade. The lazuli of Persia was imported in the prehistoric age, as well as the emery of Smyrna. In the Ist Dynasty, Egypt conquered and held Sinai for the sake of the turquoise mines. In the IIIrd Dynasty, large fleets of ships were built, some as much as 160 ft. long; and the presence of much pottery imported from Crete and the north, even before this, points to a Mediterranean trade. In the Vth Dynasty, King Unas had relations with Syria. From the XIIth Dynasty comes the detailed account of the life of an Egyptian in Palestine (Sanehat); and Cretan pottery of this age is found traded into Egypt.<P>III. The Old Testament Connections.<P>1. Semitic Connections:<P>The Hyksos invasion unified the rule of Syria and Egypt, and Syrian pottery is often found in Egypt of this age. The return of the wave, when Egypt drove out the Hyksos, and conquered Syria out to the Euphrates, was the greatest expansion of Egypt. Tahutmes I set up his statue on the Euphrates, and all Syria was in his hands. Tahutmes III repeatedly raided Syria, bringing back plunder and captives year by year throughout most of his reign. The number of Syrian artists and of Syrian women brought into Egypt largely changed the style of art and the standard of beauty. Amenhotep III held all Syria in peace, and recorded his triumphs at the Euphrates on the walls of the temple of Soleb far up in Nubia. His monotheist son, Amenhotep IV, took the name of Akhenaton, "the glory of the sun\'s disc," and established the worship of the radiant sun as the Aton, or Adon of Syria. The cuneiform letters from Tell el-Amarna place all this age before us in detail. There are some from the kings of the Amorites and Hittites, from Naharain and even Babylonia, to the great suzerain Amenhotep III. There is also the long series describing the gradual loss of Syria under Akhenaton, as written by the governors and chiefs, of the various towns. The main letters are summarized in the Students\' History of Egypt, II, and full abstracts of all the letters are in Syria and Egypt, arranged in historical order.<P>Pal was reconquered by Seti I and his son Rameses II, but they only held about a third of the extent which formerly belonged to Amenhotep III. Merenptah, son of Rameses, also raided Southern Palestine. After that; it was left alone till the raid of Sheshenq in 933 BC. The only considerable assertion of Egyptian power was in Necoh\'s two raids up to the Euphrates, in 609 and 605 BC. But Egypt generally held the desert and a few minor points along the south border of Palestine. The Ptolemies seldom possessed more than that, their aspirations in Syria not lasting as permanent conquests. They were more successful in holding Cyprus.<P>2. Abramic Times:<P>We now come to the specific connections of Egypt with the Old Testament. The movement of the family of Abram from Ur in the south of Mesopotamia up to Haran in the north (<a onClick="return mV(\'Gen\',11,31);">Ge 11:31</a>) and thence down Syria into Egypt (<a onClick="return mV(\'Gen\',12,5,10);">Ge 12:5, 10</a>) was like that of the earlier Semitic "princes of the desert," when they entered Egypt as the Hyksos kings about 2600 BC. Their earlier dominion was the XVth Dynasty of Egypt, and that was followed by another movement, the XVIth Dynasty, about 2250 BC, which was the date of the migration of Terah from Ur. Thus the Abramic family took part in the second Hyksos movement. The cause of these tribal movements has been partly explained by Mr. Huntington\'s researches on the recurrence of dry periods in Asia (Royal Geogr. Soc., May 26, 1910: The Pulse of Asia). Such lack of rain forces the desert peoples on to the cultivated lands, and then later famines are recorded. The dry age which pushed the Arab tribes on to the Mediterranean in 640 AD was succeeded by famines in Egypt during 6 centuries So as soon as Abram moved into Syria a famine pushed him on to Egypt (<a onClick="return mV(\'Gen\',12,10);">Ge 12:10</a>). To this succeeded other famines in Canaan (<a onClick="return mV(\'Gen\',26,1);">Ge 26:1</a>), and later in both Canaan and Egypt (<a onClick="return mV(\'Gen\',41,56);">Ge 41:56</a>; <a onClick="return mV(\'Gen\',43,1);">43:1</a>; <a onClick="return mV(\'Gen\',47,13);">47:13</a>). The migration of Abram was thus conditioned by the general dry period, which forced the second Hyksos movement of which it was a part. The culture of the Hyksos was entirely nomadic, and agrees in all that we can trace with the patriarchal culture pictured in Gen.<P>3. Circumcision:<P>Circumcision was a very ancient mutilation in Egypt, and is still kept up there by both Muslim and Christian. It was first adopted by Abram for Ishmael, the son of the Egyptian Hagar (<a onClick="return mV(\'Gen\',16,3);">Ge 16:3</a>; <a onClick="return mV(\'Gen\',17,23);">17:23</a>), before Isaac was promised. Hagar married Ishmael to an Egyptian (<a onClick="return mV(\'Gen\',21,21);">Ge 21:21</a>), so that the Ishmaelites, or Hagarenes, of Gilead and Moab were three-quarters Egyptian.<P>At Gerar, in the south of Palestine, Egyptian was the prevailing race and language, as the general of Abimelech was Phichol, the Egyptian name Pa-khal, "the Syrian," showing that the Gerarites were not Syrians.<P>4. Joseph:<P>The history of Joseph rising to importance as a capable slave is perfectly natural in Egypt at that time, and equally so in later periods down to our own days. That this occurred during the Hyksos period is shown by the title given to Joseph—Abrekh, (\'abhrekh) (<a onClick="return mV(\'Gen\',41,43);">Ge 41:43</a>) which is Abarakhu, the high Babylonian title. The names Zaphnath-paaneah, Asenath, and Potipherah have been variously equated in Egyptian, Naville seeing forms of the XVIIIth Dynasty in them, but Spiegelberg, with more probability, seeing types of names of the XXIInd Dynasty or later. The names are most likely an expansion of the original document; but there is not a single feature or incident in the relations of Joseph to the Egyptians which is at all improbable from the history and civilization that we know. See <a href="./study/isbe/search.html?string=JOSEPH">JOSEPH</a>.<P>5. Descent into Egypt:<P>The descent into Egypt and sojourn there are what might be expected of any Semitic tribe at this time. The allocation in Goshen (<a onClick="return mV(\'Gen\',47,27);">Ge 47:27</a>) was the most suitable, as that was on the eastern border of the Delta, at the mouth of the Wady Tumilat, and was a district isolated from the general Egyptian population. The whole of Goshen is not more than 100 square miles, being bounded by the deserts, and by the large Egyptian city of Budastis on the west. The accounts of the embalming for 40 days and mourning for 70 days (<a onClick="return mV(\'Gen\',50,3);">Ge 50:3</a>), and putting in a coffin (<a onClick="return mV(\'Gen\',50,26);">Ge 50:26</a>) are exact. The 70 days\' mourning existed both in the Ist Dynasty and in the XXth.<P>6. The Oppression:<P>The oppression in Egypt began with a new king that knew not Joseph. This can hardly be other than the rise of the Berber conquerors who took the Delta from the Hyksos at the beginning of the XVIIIth Dynasty, 1582 BC, and expelled the Hyksos into Syria. It could not be later than this, as the period of oppression in Egypt is stated at 4 centuries (<a onClick="return mV(\'Gen\',15,13);">Ge 15:13</a>; <a onClick="return mV(\'Act\',7,6);">Ac 7:6</a>), and the Exodus cannot be later than about 1220 BC, which leaves 360 years for the oppression. Also this length of oppression bars any much earlier date for the Exodus. The 360 years of oppression from 430 of the total sojourn in Egypt, leaves 70 years of freedom there. As Joseph died at 110 (<a onClick="return mV(\'Gen\',50,26);">Ge 50:26</a>), this implies that he was over 40 when his family came into Egypt, which would be quite consistent with the history.<P>7. The Historic Position:<P>The store cities Pithom and Raamses are the sites Tell el-Maskhuta and Tell Rotab in the Wady Tumilat, both built by Rameses II as frontier defenses. It is evident then that the serving with rigor was under that king, probably in the earlier part of his long reign of 67 years (1300-1234 BC), when he was actively campaigning in Palestine. This is shown in the narrative, for Moses was not yet born when the rigor began (<a onClick="return mV(\'Exd\',1,\'1-\');">Ex 1</a>; <a onClick="return mV(\'Exd\',2,2);">2:2</a>), and he grew up, slew an Egyptian, and then lived long in Midian before the king of Egypt died (<a onClick="return mV(\'Exd\',2,23);">Ex 2:23</a>), perhaps 40 or 50 years after the rigorous servitude began, for he is represented as being 80 at the time of the Exodus (<a onClick="return mV(\'Deu\',34,7);">De 34:7</a>). These numbers are probably not precise, but as a whole they agree well enough with Egyptian history. After the king died, Moses returned to Egypt, and began moving to get his kin away to the eastern deserts, with which he had been well acquainted in his exile from Egypt. A harsher servitude ensues, which might be expected from the more vigorous reign of Merenptah, after the slackness of the old age of Rameses. The campaign of Merenptah against Israel and other people in Palestine would not make him any less severe in his treatment of Semites in Egypt.<P>8. The Plagues:<P>The plagues are in the order of usual seasonal troubles in Egypt, from the red unwholesome Nile in June, through the frogs, insects, hail and rain, locusts, and sandstorms in March. The death of the firstborn was in April at the Passover.<P>9. Date of the Exodus:<P>The date of the Exodus is indicated as being about 1200 BC, by the 4 centuries of oppression, and by the names of the land and the city of Rameses (<a onClick="return mV(\'Gen\',47,4);">Ge 47:4</a>; compare <a onClick="return mV(\'Exd\',1,11);">Ex 1:11</a>). The historical limit is that the Egyptians were incessantly raiding Palestine down to 1194 BC, and then abandoned it till the invasion of Shishak. As there is no trace of these Egyptian invasions during all the ups and downs of the age of the Judges, it seems impossible to suppose the Israelites entered Canaan till after 1194 BC. The setting back of the Exodus much earlier has arisen from taking three simultaneous histories of the Judges as consecutive, as we shall notice farther on. The facts stated above, and the length of all three lines of the priestly genealogies, agree completely with the Egyptian history in putting the Exodus at about 1220 BC, and the entry into Canaan about 1180 BC.<P>10. Route of the Exodus:<P>The route of the Exodus was first a concentration at Raamses or Tell Rotab, in the Wady Tumliat, followed by a march to Succoth, a general name for the region of Bedawy booths; from there to Etham in the edge of the wilderness, about the modern Nefisheh. Thence they turned and encamped before Pi-hahiroth, the Egyptian Pa-qaheret, a Serapeum. Thus turning south to the west of the Red Sea (which then extended up to Tell el-Maskhuta), they had a Migdol tower behind them and Baal-zephon opposite to them. They were thus "entangled in the land." Then the strong east wind bared the shallows, and made it possible to cross the gulf and reach the opposite shore. They then went "three days in the wilderness," the three days\' route without water to Marah, the bitter spring of Hawara, and immediately beyond reached Elim, which accords entirely with the Wady Gharandel. Thence they encamped by the Red Sea. All of this account exactly agrees with the traditional route down the west of the Sinaitic peninsula; it will not agree with any other route, and there is no reason to look for any different location of the march.<P>See <a href="./study/isbe/search.html?string=EXODUS,+THE+BOOK+OF,+1">EXODUS 1</a>.<P>11. Numbers of the Exodus:<P>The numbers of the Israelites have long been a difficulty. On the one hand are the census lists (<a onClick="return mV(\'Num\',1,\'1-\');">Nu 1</a>; <a onClick="return mV(\'Num\',2,\'1-\');">2</a>;<a onClick="return mV(\'Num\',26,\'1-\');">26</A>), with their summaries of 600,000 men besides children and a mixed multitude (<a onClick="return mV(\'Exd\',12,37,38);">Ex 12:37-38</a>; <a onClick="return mV(\'Exd\',38,26);">38:26</a>; <a onClick="return mV(\'Num\',1,46);">Nu 1:46</a>; <a onClick="return mV(\'Num\',11,21);">11:21</a>). On the other hand there are the exact statements of there being 22,273 firstborn, that is, fathers of families (<a onClick="return mV(\'Num\',3,43);">Nu 3:43</a>), and that 40,000 armed men entered Canaan with Joshua (<a onClick="return mV(\'Jos\',4,13);">Jos 4:13</a>), also the 35,000 who fought at Ai (<a onClick="return mV(\'Jos\',8,3,12);">Jos 8:3-12</a>), and the 32,000 who fought against Midian (<a onClick="return mV(\'Jdg\',7,3);">Jud 7:3</a>). Besides these, there are the general considerations that only 5,000 to 10,000 people could live in Goshen, that the Amalekites with whom the Israelites were equally matched (<a onClick="return mV(\'Exd\',17,11);">Ex 17:11</a>) could not have exceeded about 5,000 in Sinai, that Moses judged all disputes, and that two midwives attended all the Israelite births, which would be 140 a day on a population of 600,000. Evidently, the statements of numbers are contradictory, and the external evidence is all in accord with lesser numbers. Proposals to reduce arbitrarily the larger numbers have been frequent; but there is one likely line of misunderstanding that may have originated the increase. In the census lists of the tribes, most of the hundreds in the numbers are 400 or 500, others are near those, and there are none whatever on 000,100,800 or 900. Evidently, the hundreds are independent of the thousands. Now in writing the statements, such as "Reuben, 46,500," the original list would be 46 \'eleph, 5 hundred people, and \'eleph means either "thousands" or else "groups" or "families." Hence, a census of 46 tents, 500 people, would be ambiguous, and a later compiler might well take it as 46,500. In this way the whole census of 598 tents, 5,550 people, would be misread as 603,550 people. The checks on this are, that the number per tent should be reasonable in all cases, that the hundreds should not fluctuate more than the tents between the first and last census, and that the total should correspond to the known populations of Goshen and of Sinai; these requirements all agree with this reading of the lists. The ulterior details beyond the Egyptian period are dealt with in Egypt and Israel,45,55.<P>See <a href="./study/isbe/search.html?string=EXODUS,+THE+BOOK+OF,+3-4">EXODUS 4</a>.<P>12. Israel in Canaan:<P>Two points need notice here as incidentally bearing on the Egyptian connections:<P>(1) the Israelites in Palestine before the Exodus, indicated by Merenptah triumphing over them there before 1230 BC, and the raids during the Egyptian residence (<a onClick="return mV(\'1Ch\',7,21);">1Ch 7:21</a>); <P>(2) the triple history of the Judges, west, north, and east, each totaling to 120 years, in accord with the length of the four priestly genealogies (<a onClick="return mV(\'1Ch\',6,\'4-8\');">1Ch 6:4-8</a>, <a onClick="return mV(\'1Ch\',6,\'22-28\');">22-28; <a onClick="return mV(\'1Ch\',6,\'33-35\');">33-35</a>; <a onClick="return mV(\'1Ch\',6,\'39-43\');">39-43</a>; <a onClick="return mV(\'1Ch\',6,\'44-47\');">44-47</a>), and showing that the dates are about 1220 BC the Exodus, 1180 BC the entry to Canaan, 1150 BC the beginning of Judges, 1030 BC Saul (Egypt and Israel, 52-58).<P>13. Hadad:<P>The connections with the monarchy soon begin. David and Joab attacked Edom (<a onClick="return mV(\'2Sa\',8,14);">2Sa 8:14</a>), and Hadad, the young king, was carried off by his servants to Egypt for safety. The Pharaoh who received and supported him must have been Siamen, the king of Zoan, which city was then an independent capital apart from the priest kings of Thebes (<a onClick="return mV(\'1Ki\',11,\'15-22\');">1Ki 11:15-22</a>). Hadad was married to the Egyptian queen\'s sister when he grew up, probably in the reign of Pasebkhanu II.<P>14. Pharaoh\'s Daughter:<P>The Pharaoh whose daughter was married to Solomon must have been the same Pasebkhanu; he reigned from 987-952 BC, and the marriage was about 970 in the middle of the reign. Another daughter of Pasebkhanu was Karamat, who was the wife of Shishak. Thus Solomon and Shishak married two sisters, and their aunt was queen of Edom. This throws light on the politics of the kingdoms. Probably Solomon had some child by Pharaoh\'s daughter, and the Egyptians would expect that to be the heir. Shishak\'s invasion, on the death of Solomon, was perhaps based upon the right of a nephew to the throne of Judah.<P>15. Shishak:<P>The invasion of Shishak (Egyptian, Sheshenq) took place probably at the end of his reign. His troops were Lubim (Libyans), Sukkim (men of Succoth, the east border) and Kushim (Ethiopians). The account of the war is on the side of the great fore-court at Karnak, which shows long lists of places in Judah, agreeing with the subjugation recorded in <a onClick="return mV(\'1Ki\',14,25,26);">1Ki 14:25-26</a>, and <a onClick="return mV(\'2Ch\',12,\'2-4\');">2Ch 12:2-4</a>.<P>16. Zerakh:<P>Zerakh, or Usarkon, was the next king of Egypt, the son of Karamat, Solomon\'s sister-in-law. He invaded Judah unsuccessfully in 903 BC (<a onClick="return mV(\'2Ch\',14,9);">2Ch 14:9</a>) with an army of Libyans and Sudanis (<a onClick="return mV(\'2Ch\',16,8);">2Ch 16:8</a>). A statue of the Nile, dedicated by him, and naming his descent from Karamat and Pasebkhanu, is in the British Museum.<P>17. The Ethiopians:<P>After a couple of centuries the Ethiopian kings intervened. Shabaka was appointed viceroy of Egypt by his father Piankhy, and is described by the Assyrians as Sibe, commander-in-chief of Muzri, and by the Hebrews as Sua or So, king of Egypt (<a onClick="return mV(\'2Ki\',17,4);">2Ki 17:4</a>). Tirhakah next appears as a viceroy, and Hezekiah was warned against trusting to him (<a onClick="return mV(\'2Ki\',19,9);">2Ki 19:9</a>). These two kings touch on Jewish history during their vice-royalties, before their full reigns began. Necoh next touches on Judah in his raid to Carchemish in 609 BC, when he slew Josiah for opposing him (<a onClick="return mV(\'2Ki\',23,29,30);">2Ki 23:29-30</a>; <a onClick="return mV(\'2Ch\',35,\'20-24\');">2Ch 35:20-24</a>).<P>18. Tahpanhes:<P>After the taking of Jerusalem, for fear of vengeance for the insurrection of Ishmael (<a onClick="return mV(\'2Ki\',25,25,26);">2Ki 25:25-26</a>; <a onClick="return mV(\'Jer\',40,\1-\');">Jer 40</a>; <a onClick="return mV(\'Jer\',41,\'1-\');">Jer 41</a>; <a onClick="return mV(\'Jer\',42,\'1-\');">Jer 42</a>), the remnant of the Jews fled to the frontier fortress of Egypt, Tahpanhes, Tehaphnehes, Greek Daphnae, modern Defenneh, about 10 miles west of the present Suez Canal (<a onClick="return mV(\'Jer\',43,\'7-13\');">Jer 43:7-13</a>). The brick pavement in front of the entrance to the fortress there, in which Jeremiah hid the stones, has been uncovered and the fortress completely planned. It was occupied by Greeks, who there brought Greek words and things into contact with the traveling Jews for a couple of generations before the fall of Jerusalem.<P>19. Hophra:<P>The prophecy that Hophra would be delivered to them that sought his life (<a onClick="return mV(\'Jer\',44,30);">Jer 44:30</a>) was fulfilled, as he was kept captive by his successor, Amasis, for 3 years, and after a brief attempt at liberty, he was strangled.<P>20. The Jews at Syene:<P>The account of the Jews settled in Egypt (<a onClick="return mV(\'Jer\',44,\'1-\');">Jer 44</a>) is singularly illustrated by the Aramaic Jewish papyri found at Syene (Aswan). These show the use of Aramaic and of oaths by Yahu, as stated of 5 cities in Egypt (<a onClick="return mV(\'Isa\',19,18);">Isa 19:18</a>). The colony at Syene was well-to-do, though not rich; they were householders who possessed all their property by regular title-deeds, who executed marriage settlements, and were fully used to litigation, having in deeds of sale a clause that no other deed could be valid. The temple of Yahu filled the space between two roads, and faced upon 3 houses, implying a building about 60 or 70 ft. wide. It was built of hewn stone, with stone columns, 7 gates, and a cedar roof. It was destroyed in 410, after lasting from before Cambyses in 525 BC, and a petition for rebuilding it was granted in 407.<P>21. The New Jerusalem of Oniah:<P>The most flourishing period of the Jews in Egypt was when Oniah IV, the son of the rightful high priest Oniah, was driven from Jerusalem by the abolition of Jewish worship and ordinances under Antiochus. In 170 BC he fled to Egypt, and there established a new Jerusalem with a temple and sacrifices as being the only way to maintain the Jewish worship. Oniah IV was a valiant man, general to queen Cleopatra I; and he offered to form the Jewish community into a frontier guard on the east of Egypt, hating the Syrians to the uttermost, if the Jews might form their own community. They so dominated the eastern Delta that troops of Caesar could not pass from Syria to Alexandria without their assent. The new Jerusalem was 20 miles north of Cairo, a site now known as Tell el-Yehudiyeh. The great mound of the temple still remains there, with the Passover ovens beneath it, and part of the massive stone fortifications on the front of it. This remained a stronghold of free Judaism until after Titus took Jerusalem; and it was only when the Zealots tried to make it a center of insurrection, that at last it was closed and fell into decay. Josephus is the original authority for this history (see Egypt and Israel, 97-110).<P>22 The Egyptian Jew:<P>The Jew in Egypt followed a very different development from the Babylonian Jew, and this Egyptian type largely influenced Christianity. In the colony at Syene a woman named "Trust Yahweh" had no objection to swearing by the Egyptian goddess Seti when making an Egyptian contract; and in <a onClick="return mV(\'Jer\',44,\'15-19\');">Jer 44:15-19</a>, the Jews boasted of their heathen worship in Egypt. Oniah had no scruple in establishing a temple and sacrifices apart from Jerusalem, without any of the particularism of the Maccabean zealots. Philo at Alexandria labored all his life for the union of Jewish thought with Greek philosophy. The Hermetic books show how, from 500 to 200 BC, religious thought was developing under eclectic influence of Egyptian Jewish, Persian, Indian and Greek beliefs, and producing the tenets about the second God, the Eternal Son, who was the Logos, and the types of Conversion, as the Divine Ray, the New Birth, and the Baptism. Later the Wisdom literature of Alexandria, 200-100 BC, provided the basis of thought and simile on which the Pauline Epistles were built. The great wrench in the history of the church came when it escaped from the Babylonian-Jewish formalism of the Captivity, which ruled at Jerusalem, and grew into the wider range of ideas of the Alexandrian Jews. These ideas had been preserved in Egypt from the days of the monarchy, and had developed a great body of religious thought and phraseology from their eclectic connections. The relations of Christianity with Egypt are outside our scope, but some of them will be found in Egypt and Israel, 124-41.<P>23. Cities and Places Alphabetically:<P>The Egyptian cities, places and peoples named in the Old Testament may briefly be noted. <a href="./study/isbe/search.html?string=AVEN">AVEN</a> (<a onClick="return mV(\'Eze\',30,17);">Eze 30:17</a>) or <!--<a href="./study/isbe/search.html?string=ON+(1)"> --><a href="file:./study/isbe/BLB/study/isbe/6500.html?toc=6557">ON</a> (<a onClick="return mV(\'Gen\',41,45);">Ge 41:45</a>) is the \'An of Egyptian, the Greek Heliopolis, now Matarieh, 7 miles north of Cairo. It was the seat of prehistoric government, the royal emblems were kept there as the sacred relics of the temple, and its high priest was "the great seer," one of the greatest of the religious officials. The schools of Heliopolis were celebrated, and it seems to have always been a center of learning. The site is now marked by the great enclosure of the temple, and one obelisk of Senusert (XIIth Dynasty). It was here that the Egyptian kings had at their installation to come and bathe in the lake in which the sun bathes daily, the \'Ainesh-Shems, or "Lake of the Sun" of the Arabs, connected with the fresh spring here which Christian tradition attributes to the visit of the Virgin and Child. The great sycamore tree here is the successor of that under which the Virgin is said to have rested.<P><a href="./study/isbe/search.html?string=BAAL-ZEPHON">BAAL-ZEPHON</a> was a shrine on the eastern site of the head of the Red Sea, a few miles south of Ismailiyeh; no trace is now known of it (<a onClick="return mV(\'Exd\',14,2);">Ex 14:2</a>).<P><a href="./study/isbe/search.html?string=CUSH+(1)">CUSHIM</a> or Ethiopians were a part of the Egyptian army of Shishak and of Usarkon (<a onClick="return mV(\'2Ch\',12,3);">2Ch 12:3</a>; <a onClick="return mV(\'2Ch\',16,8);">16:8</a>). The army was in 4 brigades, that of Ptah of Memphis, central Egypt; that of Amen of Thebes, Southern Egypt and Ethiopia; that of Set of the eastern frontier (Sukkim); and that of Ra, Heliopolis and the Delta.<P>COSHEN was a fertile district at the west end of the Wady Tumilat, 40 to 50 miles northeast of Cairo. It was bounded by the deserts on the north and southeast, and by the Egyptian city of Bubastis on the west. Its area was not over 100 square miles; it formerly supported 4,000 Bedouin and now about 12,000 cultivators.<P><a href="./study/isbe/search.html?string=LUBIM">LUBIM</a>, the Libyans who formed part of the Egyptian army as light-armed archers, from very early times.<P><a href="./study/isbe/search.html?string=MIGDOL">MIGDOL</a> is the name of any tower, familiar also as Magdala. It was applied to some watchtower on the west of the Red Sea, probably on the high land above the Serapeum.<P><a href="./study/isbe/search.html?string=NO-AMON">NO</a> is Thebes, in Assyrian Nia, from the Egyptian Nu, "the city." This was the capital of the XIIth Dynasty, and of the XVIIth-XXIst Dynasties. Owing to the buildings being of sandstone, which is not of much use for reworking, they have largely remained since the desolation of the city under Ptolemy X. The principal divisions of the site are:<P>(1) Karnak, with the temple of the XIIth Dynasty, built over by all the successive kings of the XVIIIth Dynasty, and enlarged by Seti I and Rameses II, and by Shishak, Tirhakah, and the Ptolemies. The whole temple of Amon and its subsidiary temples form the largest mass of ruins that is known.<P>(2) Luqsor, the temple to commemorate the divine birth of Amenhotep III (1440 BC), added to by Rameses II.<P>(3) The funerary temples, bordering the western shore, of the kings of the XVIIIth to XXth Dynasties. These have mostly been destroyed, by the unscrupulous quarrying done by each king on the work of his predecessors; the only temple in fair condition is that of Rameses III, which is left because no later king required its material for building.<P>(4) The great cemetery, ranging from the splendid rock halls of the Tombs of the Kings, covered with paintings, down to the humblest graves. For any detailed account see either Baedeker\'s or Murray\'s Guides, or Weigall\'s Guide to Antiquities.<P><a href="./study/isbe/search.html?string=NOPH">NOPH</a>, the Egyptian Men-nofer, Greek Memphis, now Mitraheny, 12 miles south of Cairo. This was the capital from the foundation at the beginning of the dynasties. Thebes and Alexandria shared its importance, but it was the seat of government down to the Arab invasion. In Roman times it was as large as London north of the Thames. The outlying parts are now all buried by the rise of the soil, but more than a mile length of ruins yet remains, which are now being regularly worked over by the British School. The heart of the city is the great metropolitan temple of Ptah, nearly all of which is now under 10 feet of soil, and under water most of the year. This is being excavated in sections, as it is all private property. At the north end of the ruins is the palace mound, on which has been cleared the palace of Apries (Hophra). Other temples have been located, as well as the foreign quarter containing early Greek pottery and the temple of Proteus named by Herodotus (see <a href="./study/isbe/search.html?string=MEMPHIS">Memphis, I, II, III</a>).<P><a href="./study/isbe/search.html?string=PATHROS">PATHROS</a> is the usual name for Upper Egypt in the prophets. It is the Egyptian Pa-ta-res, "the south land."<P><a href="./study/isbe/search.html?string=PI-BESETH">PI-BESETH</a> is the Egyptian Pa-Bast, Greek Bubastis, at the eastern side of the Delta, the city of the cat-headed goddess Bast. The ruins are still large, and the temple site has been excavated, producing sculptures from the IVth Dynasty onward.<P><a href="./study/isbe/search.html?string=PITHOM">PITHOM</a> is the Egyptian Pa-Tum, the city of the Sun-god Tum or Atmu, who was worshipped on the east of the Delta. The site has remains of the fortress of Rameses II, built by the Israelites, and is now known as Tell el-Maskhuta, 11 miles west of Ismailia.<P><a href="./study/isbe/search.html?string=RAAMSES">RAAMSES</a> is the other city built by the Israelites, now Tell Rotab, 20 miles west of Ismailia. A wailed camp existed here from early times, and the temple of Rameses was built on the top of the older ruins. A large part of the temple front is now at Philadelphia, excavated by the British School.<P><a href="./study/isbe/search.html?string=SIN+(2)">SIN</a> is the Greek Pelusium, Assyrian Siinu, Arabic Tineh, now some desolate mounds at the extreme east coast of Egypt.<P><a href="./study/isbe/search.html?string=SUCCOTH+(2)">SUCCOTH</a> was the district of "booths," the eastern part of the Wady Tumilat. It was written in Egyptian Thuku and abbreviated to Thu in which form it appears as a Roman name. The people of Succoth were Sukkim, named in the army of Shishak (<a onClick="return mV(\'2Ch\',12,3);">2Ch 12:3</a>).<P><a href="./study/isbe/search.html?string=SYENE">SYENE</a>, Hebrew Seweneh, modern Aswan, the southern border town of Egypt at the Cataract. The greater part of the old town was on the island of Elephantine. There the Jewish papyri were found, and that was probably the Jewish settlement with the temple of Yahu. The town on the eastern bank—the present Aswan—was of less importance.<P><a href="./study/isbe/search.html?string=TEHAPHNEHES">TAHPANHES, TEHAPHNEHES</a>, Greek Daphnae, Arabic Tell Defeneh. This was the first station on the Syrian road which touched the Nile canals, about 10 miles west of Kantara on the Suez Canal. It seems to have been founded by Psammetichus about 664 BC, to hold his Greek mercenaries. The fort, built by him, abounded in Greek pottery, and was finally desolated about 566 BC, as described by Herodotus. The fort and camp have been excavated; and the pavement described by Jeremiah (chapter 43), as opposite to the entrance, has been identified.<P><a href="./study/isbe/search.html?string=ZOAN">ZOAN</a>, Greek Tanis, Arabic San, is about 26 miles from the Suez Canal, and slightly more from the coast. The ruins of the temple are surrounded by the wall of Pasebkhanu, 80 ft. thick of brickwork, and a ring of town ruins rises high around it. The temple was built in the VIth Dynasty, adorned with many statues in the XIIth and XIIIth Dynasties, and under Rameses II had many large granite obelisks and statues, especially one colossus of the king in red granite about 90 ft. high. It is probable that the Pharaoh lived here at the time of the Exodus.<P>IV. The Civilization.<P>1. Language:<P>We now turn to some outline of the civilization of the Egyptians. The language had primitive relations with the Semitic and the Libyan. Perhaps one common stock has separated into three languages—Semitic, Egyptian, and Libyan. But though some basal words and grammar are in common, all the bulk of the words of daily life were entirely different in the three, and no one could be said to be derived from the other. Egyptian so far as we can see, is a separate language without any connection as close as that between the Indo-European group. From its proximity to Syria, Semitic loan words were often introduced, and became common in the XVIIIth Dynasty and fashionable in the XIXth. The language continually altered, and decayed in the later periods until Coptic is as different from it as Italian is from Latin.<P>2. Writing:<P>The writing was at first ideographic, using a symbol for each word. Gradually, signs were used phonetically; but the symbol, or some emblem of the idea of the word, continued to be added to it, now called a determinative. From syllabic signs purely alphabetic signs were produced by clipping and decay, so that by 1000 to 500 BC the writing was almost alphabetic. After that it became modified by the influence of the short Greek alphabet, until by 200 AD it was expressed in Greek letters with a few extra signs. The actual signs used were elaborate pictures of the objects in the early times, and even down to the later periods very detailed signs were carved for monumental purposes. But as early as the Ist Dynasty a very much simplified current hand had been started, and during the pyramid period this became hardly recognizable from the original forms. Later on this current hand, or hieratic, is a study by itself and was written much more fully than the hieroglyphs on monuments, as its forms were so corrupt that an ample spelling was needed to identify the word. By about 800 BC begins a much shortened set of signs, still more remote from their origins, known as demotic, which continued as the popular writing till Roman times. On public decrees the hieroglyphic and demotic are both given, showing that a knowledge of one was useless for reading the other, and that they were separate studies.<P>3. Literature:<P>The literature begins during the pyramid period, before 4000 BC, with biographies and collections of maxims for conduct; these show well-regulated society, and would benefit any modern community in which they were followed. In the XIIth Dynasty tales appear, occupied with magic and foreign travel and wonders. A long poem in praise of the king shows very regular versification and system, of the type of <a onClick="return mV(\'Psa\',136,\'1-\');">Ps 136</a>, the refrain differing in each stanza and being probably repeated in chorus, while the independent lines were sung by the leader. In the XVIIIth Dynasty, tales of character begin to develop and show much skill, long annals were recorded, and in the XIXth Dynasty there is an elaborate battle poem describing the valor of Rameses II. At about 700 BC there is a considerable tale which describes the quarrels of the rival chiefs, and the great fight regulated like a tournament by which the differences were settled. Such are the principal literary works apart from business documents.<P>4. Four Views of Future Life:<P>The religion of Egypt is an enormous subject, and that by which Egypt is perhaps most known. Here we can only give an outline of the growth and subdivisions of it. There never was any one religion in Egypt during historic times. There were at least four religions, all incompatible, and all believed in at once in varying degrees. The different religions can best be seen apart by their incongruity regarding the future life.<P>(1) The dead wandered about the cemetery seeking food, and were partly fed by the goddess in the sycamore tree. They therefore needed to have plates of food and jars of water in the tomb, and provided perpetually by their descendants in front of the doorway to the grave. The deceased is represented as looking out over this doorway in one case. Here came in the great principle of substitution. For the food, substitute its image which cannot decay, and the carved table of offerings results. For the farmstead of animals, substitute its carved image on the walls and the animal sculptures result. For the life of the family, substitute their carved figures doing all that was wanted, sacrificing and serving, and the family sculptures result. For the house, substitute a model upon the grave, and the pottery soul-houses appear with their furniture and provisions. For the servants, put their figures doing household work, and their service is eternal. For the master himself, put the most lifelike image that can be made, and his soul will occupy that as a restful home fitted for it. This principle is still believed in. Funeral offerings of food are still put even in Muslim graves, and a woman will visit a grave, and, removing a tile, will talk through a hole to her dead husband.<P>(2) The dead went to the kingdom of Osiris, to which only the good were admitted, while the evil were rejected, and consumed either by monsters or by fire. This heavenly kingdom was a complete duplicate of the earthly life. They planted and reaped, sported and played. And as the Egyptian felicity consisted in making others work for them, so each man was provided with a retinue of serfs to cultivate the land for him. These ushabti figures in later times usually number 400, and often 1 in 10 of them is clad as an overseer. A special chapter of the Book of the Dead is to be recited to animate them, and this, more or less abbreviated, is often inscribed upon the figures.<P>(3) The dead joined the company of the immortal gods, who float on the heavenly ocean in the boat of the sun. With them they have to face the terrors of the hours of the night when the sun goes through the underworld. Long charms and directions are needed for safety in this passage, and these form a large part of the funerary tests, especially on the Tombs of the Kings in the XVIIIth-XXIst Dynasties. To reach the boat of the sun a boat must be provided in the tomb, with its sailors and sails and oars. Such are frequent from the VIth-XIIIth Dynasties.<P>(4) The dead were carried off by the Hathor cow, or a bull, to wait for a bodily resurrection. In order to preserve the body for some life after the present age, each part must be protected by an appropriate amulet; hence, dozens of different amulets were placed on the body, especially from about 600-400 BC.<P>Now it will be seen that each of these beliefs contradicts the other three, and they represent, therefore, different religious origins.<P>5. Four Groups of Gods:<P>The mythology is similarly diverse, and was unified by uniting analogous gods. Hence, when we see the compounds such as Ptah-Sokar-Osiris, or Amen-Ra or Osiris-Khentamenti, it is clear that each god of the compound belongs to a different religion, like Pallas-Athene or Zeus-Labrandeus, in Greek compounds. So far as we can at present see, the gods linked with each of the beliefs about the soul are as follows:<P>(1) The Soul in the Tombs and Cemetery.<P>With this belief belong the animal gods, which form the earliest stratum of the religion; also Sokar the god of "Silence," and Mert Sokar, the "Lover of Silence," as the gods of the dead. With this was allied a belief in the soul sometimes going to the west, and hence, Khent-amenti, a jackal-headed god, "he who is in the west," became the god of the dead.<P>(2) The Soul in the Heavenly Kingdom.<P>Osiris is the lord of this kingdom, Isis his sister-wife, Horus their son, Nebhat (Nephthys) the sister of Isis, and Set her husband. Set also was regarded as coequal with Horus. This whole mythology results probably from the fusion of tribes who were originally monotheistic, and who each worshipped one of these deities. It is certain that the later parts of this mythology are tribal history, regarded as the victories and defeats of the gods whom the tribes worshipped.<P>(3) The Soul in the Sun-Boat.<P>Ra was the Sun-god, and in other forms worshipped as Khepera and Atmu. The other cosmic gods of the same group are Nut, the heaven, and her husband Geb, the earth; Shu, space, and his sister Tefnut. Anher the Sky-god belongs to Upper Egypt.<P>(4) The Mummy with Amulets, Preserved for a Future Life.<P>Probably to this group belong the gods of principles, Hathor the female principle; Min the male principle; Ptah the architect and creator of the universe; his spouse Maat, abstract truth and justice.<P>6. Foreign Gods:<P>Foreign gods frequently appear also in Egypt, mostly from Syria. Two importations were of great effect. Aton the radiant energy of the sun, the Adon or "lord," Adonai, Adonis, was introduced as a sole deity by Akhenaton 1380 BC, and all other gods were proscribed. This was a strictly rational and scientific religion, attributing all life and power to the action of the sun\'s rays; but it only lasted 20 years in Egypt, and then vanished. The other important worship was that of Zeus Sarapis. The Zeus statue is said to have been imported from Sinope by Ptolemy I, but the Sarapis was the god of Memphis, Osarhapi, the Osiris form of the Hapi bull. The Egyptian worshipped his old gods; the Greek was satisfied with Zeus; and both nations united in adoring Zeus Sarapis. The temples and ritual are too wide a subject to touch in our present space; but the essential principle was that of providing a banquet for the god, and feasting in his temple, not that of an expiatory sacrifice or burnt offering, which is Semitic.<P>7. Laws:<P>The laws are but little known until the late Greek accounts. Marriage was usual with a sister, but this may have been with a half-sister, as among the Greeks and early Hebrews. Polygamy was unusual, but was legal, as many as six wives being represented in one instance. Kings of course had unlimited harems. Divorce was unusual, but was probably easy. In Coptic times a marriage contract provides for divorce by either party, upon paying six times the marriage gift. Property was strictly guarded.<P>8. Character:<P>The national character was easygoing, kindly, never delighting in torture like the Assyrians and Romans, but liable to be too slack and careless. Firmness, decision and fortitude were held up as the leading virtues. The structure of society, the arts and the industries are outside of the scope of this article.<P>(For differing views on chronology and sites, see articles <a href="./study/isbe/search.html?string=EXODUS">EXODUS</a>; <a href="./study/isbe/search.html?string=WANDERINGS+OF+ISRAEL">WANDERINGS OF ISRAEL</a>; <a href="./study/isbe/search.html?string=PITHOM">PITHOM</a>; <a href="./study/isbe/search.html?string=RAAMSES">RAAMSES</a>, etc., and on individual kings, etc., articles under their names, and <a href="./study/isbe/search.html?string=EGYPTIAN+KINGS">EGYPTIAN KINGS</a>.)<P>LITERATURE.<P>Works in English, that are the most accessible, are stated in preference to foreign works, the references to which will be seen in the books stated below.<P>The Country: Baedeker\'s Egypt; on the flora, Petrie, Hawara, Biahmu, and Arsioe.<P>The History: Prehistoric: Petrie, Diospolis Parva, etc.; de Morgan, Recherches; Maspero, The Dawn of Civilization, The Struggle of the Nations, The Passing of the Empires; Petrie, Student\'s History of Egypt; Breasted, A History of Egypt, etc. On the Ist-IInd Dynasties, Petrie, Royal Tombs. On the IIId-VIth Dynasties, Petrie, The Pyramids and Temples of Gizeh; Murray, Saqqara Mastabas I. On the VIIth-XIVth Dynasties, Petrie, Gizeh and Rifeh; de Morgan, Dahchour, I, II. On the XVth-XXIVth Dynasties, Weigall, Guide to Antiquities; Baedeker on Thebes; Petrie, Six Temples at Thebes. On the XXVth Dynasty to Roman times, Petrie, Temple of Apries; Mahaffy, The Empires of the Ptolemies; Milne, History of Egypt under Roman Rule. On the early foreign connections, Petrie, Methods and Aims in Archaeology.<P>On the Semitic Connections: Petrie, Syria and Egypt from the Tell el-Amarna Tablets. On the Old Testament Connections: Petrie, Egypt and Israel.<P>On the Language: Murray, Elementary Grammar.<P>On the Writing and Literature: Erman, Life in Ancient Egypt; Petrie, Egyptian Tales, I, II.<P>On the Religion: Wiedemann, Religion of the Ancient Egyptians.<P>On the Customs: Wilkinson, Manners and Customs of the Ancient Egyptians.<P>On the Arts: Petrie, The Arts and Crafts of Ancient Egypt.``135';

isbe[2910]='Egyptian, the`e-jip\'-shan (ho Aiguptios):<P>Mentioned in <a onClick="return mV(\'Act\',21,38);">Ac 21:38</a>, by Claudius Lysias as having "before these days stirred up to sedition and led out into the wilderness the four thousand men of the <a href="./study/isbe/search.html?string=ASSASSINS">ASSASSINS</a>" (which see). Reference to this Egyptian and to the suppression of his rebellion by the procurator Felix is likewise found in Josephus (Ant., XX, viii, 6; BJ, II, xiii, 5).``1';

isbe[2912]='Ehi`e\'-hi (\'ehi):<P>Apparently a contracted form (<a onClick="return mV(\'Gen\',46,21);">Ge 46:21</a>).`<a href="./study/isbe/search.html?string=AHIRAM">AHIRAM</a>`1';
isbe[2913]='Ehud`e\'-hud (ehudh, "united," "strong"):<P>A Benjamite, son of Gera, deliverer of Israel from oppression by Moab (<a onClick="return mV(\'Jdg\',3,\'15-30\');">Jud 3:15-30</a>). Gaining access alone to the presence of King Eglon under pretense of a secret errand connected with the payment of Israel\'s tribute, Ehud, a left-handed man, drew the sword he had concealed upon his right side, and thrust the king through. He locked the doors of the upper chamber after him, made his escape, and with the Israelites overcame Moab at the fords of the Jordan, slaying some 10,000. Ehud\'s name occurs again in the Benjamite genealogy (<a onClick="return mV(\'1Ch\',7,10);">1Ch 7:10</a>).``57';
isbe[2914]='Either`e\'-ther, i\'-ther:<P>Often in the sense still common, "one or the other" (<a onClick="return mV(\'1Ch\',21,21);">1Ch 21:21</a>; <a onClick="return mV(\'Mat\',6,24);">Mt 6:24</a>, etc.), but also in the obsolete sense of "both" or "each" (<a onClick="return mV(\'Lev\',10,1);">Le 10:1</a>; <a onClick="return mV(\'1Ki\',7,15);">1Ki 7:15</a>; <a onClick="return mV(\'Jhn\',19,18);">Joh 19:18</a>; <a onClick="return mV(\'Rev\',22,2);">Re 22:2</a>), or in place of (Revised Version) "or" (<a onClick="return mV(\'Luk\',6,42);">Lu 6:42</a>; <a onClick="return mV(\'Luk\',15,8);">15:8</a>; <a onClick="return mV(\'Phl\',3,12);">Php 3:12</a>; <a onClick="return mV(\'Jam\',3,12);">Jas 3:12</a>).``1';
isbe[2915]='Eker`e\'-ker (\'eqer, "root"):<P>A Jerahmeelite (<a onClick="return mV(\'1Ch\',2,27);">1Ch 2:27</a>).``1';
isbe[2916]='Ekrebel`ek\'-re-bel (Ekrebel):<P>Appears only in Judith 7:18. It lay on the brook Mochmur, south of Dothart. It is identical with Akrabbein, of which Eusebius (Onomasticon) speaks as the capital of the district of Akrabattine. It corresponds to the modern \'Akrabeh, 8 miles southeast of Nablus.``1';
isbe[2917]='Ekron; Ekronite`ek\'-ron, ek\'-ron-it \'eqron, "migration," "rooting out"; Akkaron:<P>The most northerly of the chief cities of the Philistines. It was not subdued by Joshua (<a onClick="return mV(\'1Ch\',13,3);">13:3</a>) but was allotted, in the division of the land, first to Judah and then to Dan (<a onClick="return mV(\'Jos\',15,11,45,46);">Jos 15:11, 45-46</a>; <a onClick="return mV(\'Jos\',19,43);">19:43</a>). It was taken by Judah (<a onClick="return mV(\'Jdg\',1,18);">Jud 1:18</a>). The people of Ekron are prominent in the story of the ark in the land of the Philistines. It was they who proposed to have it sent back to Israel (<a onClick="return mV(\'1Sa\',5,10);">1Sa 5:10</a>; <a onClick="return mV(\'1Sa\',6,16,17);">6:16-17</a>). After the defeat of the Philistines, when David killed Goliath, the Israelites pursued them to the gates of Ekron, which was evidently the nearest walled town in which the fugitives could take refuge (<a onClick="return mV(\'1Sa\',17,52);">1Sa 17:52</a>). It was the seat of the worship of the god Baalzebub, as appears in the account of the sickness and death of Ahaziah (<a onClick="return mV(\'2Ki\',1,2,3,16);">2Ki 1:2-3; <a onClick="return mV(\'2Ki\',6,16);">6:16</a>). It is included among other cities in the denunciations of Amos (<a onClick="return mV(\'Amo\',1,8);">1:8</a>) and of Jeremiah (<a onClick="return mV(\'Jer\',25,20);">25:20</a>). Zephaniah declares that it shall be rooted up (<a onClick="return mV(\'Zep\',2,4);">2:4</a>), and Zechariah speaks of its consternation at the fall of Tyre (<a onClick="return mV(\'Zec\',9,5,7);">9:5,7</a>).<P>From the Assyrian records we learn that it revolted against Sennacherib and expelled Padi, the governor he had placed over it, and sent him to Hezekiah, at Jerusalem, for safe keeping. Sennacherib marched against it and Ekron called in the aid of the king of Mutsri, formerly supposed to be Egypt but now regarded by some scholars as a district of Northwestern Arabia. Sennacherib raised the siege of Ekron to defeat this army, which he did at Eltekeh, and then returned and took the city by storm and put to death the leaders of the revolt and carried their adherents into captivity. He then compelled Hezekiah to restore Padi, who was once more made governor. This affair led to the famous attack of Sennacherib on Hezekiah and Jerusalem (Rawl., Anc. Mon., II, 159). Ekron is mentioned in 1Macc 10:89 as being given by Alexander Balas to Jonathan Maccabeus, and it appears in the accounts of the first Crusade.<P>Ekronite:<P>An inhabitant of Ekron, used in plural in <a onClick="return mV(\'Jos\',13,3);">Jos 13:3</a> and <a onClick="return mV(\'1Sa\',5,10);">1Sa 5:10</a>.``138';

isbe[2922]='El-Beth-El`el-beth\'-el (el beth-\'el, "God of Bethel"; Baithel):<P>By this name Jacob called the scene of his vision at Luz, when he returned from Paddan-aram (<a onClick="return mV(\'Gen\',35,7);">Ge 35:7</a>).``1';
isbe[2923]='El-Elohe-Israel`el-e-lo\'-he-iz\'-ra-el, el-el\'-o-he-iz\'-ra-el (\'el \'elohe yisra\'el, translated "God, the God of Israel" in the American Revised Version, margin and the King James Version margin):<P>Found only in <a onClick="return mV(\'Gen\',33,20);">Ge 33:20</a> as the name given to the altar erected at Shechem by Jacob, henceforth, known as Israel, on the parcel of ground purchased by him from the inhabitants of Shechem, his first encampment of length and importance since the return to Palestine from Paddan-aram and the eventful night at Peniel (<a onClick="return mV(\'Gen\',32,30);">Ge 32:30</a>). This unusual combination of names has given occasion for much speculation and for various text emendations. Already the Septuagint sought to meet the difficulty by reading wa-yiqra\' \'el \'elohe yisra\'el, "and he called upon the God of Israel," instead of the wa-yiqra\' lo \'el of Massoretic Text, "and he called it El" etc. Wellhausen, followed by Dillmann, Driver and others, changes "altar" to "pillar," because the Hebrew verb, hitstsibh, is used with mitstsbhah, "pillar," in <a onClick="return mV(\'Gen\',35,14,20);">Ge 35:14, 20</a>, so making this religious act a parallel to that at Bethel. But Delitzsch, New Commentary on Genesis, properly rejects this purely fanciful change, and understands the compound name as the altar\'s inscription. Dillmann well suggests that "altar" (or "pillar") be supplied, reading thus: "called it the altar of El, the God of Israel." The peculiar phrase is best and most readily understood in its close connection with the struggle at Peniel, recorded in <a onClick="return mV(\'Gen\',32,\'1-\');">Ge 32</a>. Being victorious in that struggle, Jacob received the new name "Israel"; and to his first altar in Palestine he gave that name of God which appeared in his own new name, further explaining it by the appositive phrase "Elohe-Israel." Thus, his altar was called, or dedicated to, "El, the God of Israel."``109';
