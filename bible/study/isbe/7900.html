isbe[7961]='Shebaniah`sheb-a-ni\'-a, she-ban\'-ya (shebhanyah, in <a onClick="return mV(\'1Ch\',15,24);">1Ch 15:24</a>, shebhanyahu):<P>(1) Name of a Levite or a Levitical family that participated in the religious rites that followed the reading of the Law (<a onClick="return mV(\'Neh\',9,4);">Ne 9:4</a>). The name is given in <a onClick="return mV(\'Neh\',10,10);">Ne 10:10</a> among those that sealed the covenant.<P>(2) A priest or Levite who took part in the sealing of the covenant (<a onClick="return mV(\'Neh\',10,4);">Ne 10:4</a>; <a onClick="return mV(\'Neh\',12,14);">12:14</a>). See <a href="./study/isbe/search.html?string=SHECANIAH">SHECANIAH</a>.<P>(3) Another Levite who sealed the covenant (<a onClick="return mV(\'Neh\',10,12);">Ne 10:12</a>).<P>(4) A priest in the time of David (<a onClick="return mV(\'1Ch\',15,24);">1Ch 15:24</a>).``1';
isbe[7962]='Shebarim`sheb\'-a-rim, she-ba\'-rim (ha-shebharim; sunetripsan): After the repulse of the first attack on their city the men of Ai chased the Israelites "even unto Shebarim" (<a onClick="return mV(\'Jos\',7,5);">Jos 7:5</a>). the Revised Version margin reads "the quarries"; so Keil, Steuernagel, etc. Septuagint reads "until they were broken," i.e. until the rout was complete. The direction of the flight was of course from Ai toward Gilgal in the Jordan valley. No trace of such name has yet been found.``1';
isbe[7963]='Shebat`she-bat\' (shebhat): The 11th month of the Jewish year (<a onClick="return mV(\'Zec\',1,7);">Zec 1:7</a>), corresponding to February.`<a href="./study/isbe/search.html?string=CALENDAR">CALENDAR</a>`1';
isbe[7964]='Sheber`she\'-ber (shebher; Codex Vaticanus Saber, Codex Alexandrinus Seber): A son of Caleb by his concubine Maacah (<a onClick="return mV(\'1Ch\',2,48);">1Ch 2:48</a>).``1';
isbe[7965]='Shebna`sheb\'-na (shebhna\'; Somnas; but shebhnah, in <a onClick="return mV(\'2Ki\',18,18,26);">2Ki 18:18,26</a>; meaning uncertain (<a onClick="return mV(\'2Ki\',18,18,26,37);">2Ki 18:18,26,37</a>; <a onClick="return mV(\'2Ki\',19,2);">19:2</a> = <a onClick="return mV(\'Isa\',36,3,11,22);">Isa 36:3,11,22</a>; <a onClick="return mV(\'Isa\',37,2);">37:2</a>; <a onClick="return mV(\'Isa\',22,15);">22:15</a>)):<P>1. Position in <a onClick="return mV(\'Isa\',22,\'1-\');">Isaiah 22</a>:<P>In <a onClick="return mV(\'Isa\',22,15);">Isa 22:15</a> Shebna is referred to as he "who is over the house," or household, apparently that of the king. The phrase is translated "steward of the house" in the Revised Version (British and American) of <a onClick="return mV(\'Gen\',43,16,19);">Ge 43:16,19</a>; <a onClick="return mV(\'Gen\',44,1);">44:1</a>, and occurs also in <a onClick="return mV(\'Gen\',39,4);">39:4</a>, "overseer"; <a onClick="return mV(\'Gen\',44,4);">44:4</A>. It is used of an officer of the Northern Kingdom in <a onClick="return mV(\'1Ki\',16,9);">1Ki 16:9</a>; <a onClick="return mV(\'1Ki\',18,3);">18:3</a>; <a onClick="return mV(\'2Ki\',10,5);">2Ki 10:5</a>. This officer is distinguished from him "that was over the city" in <a onClick="return mV(\'2Ki\',10,5);">2Ki 10:5</a>, and it is said in <a onClick="return mV(\'2Ki\',15,5);">2Ki 15:5</a> that after his father Azariah was stricken with leprosy, "Jotham, the king\'s son, was over the household, judging all the people of the land." Again <a onClick="return mV(\'Isa\',22,15);">Isa 22:15</a> speaks of "this cokhen," a phrase that must apply to Shebna if the prophecy refers to him. This word is the participle of a verb meaning "to be of use or service," so "to benefit" in <a onClick="return mV(\'Job\',15,3);">Job 15:3</a>; <a onClick="return mV(\'Job\',22,2);">22:2</a>; <a onClick="return mV(\'Job\',34,9);">34:9</a>. The feminine participle is employed of Abishag in <a onClick="return mV(\'1Ki\',1,24);">1Ki 1:2,4</a>, where King James Version, margin translates "cherisher"; BDB renders it "servitor" or "steward" in <a onClick="return mV(\'Isa\',22,15);">Isa 22:15</a>. It occurs also as a Canaanite gloss in the Tell el-Amarna Letters (Winckler, number 237, 9). The cokhen was evidently a high officer: Shebna had splendid chariots (<a onClick="return mV(\'Isa\',22,18);">22:18</A>), but what the office exactly was is not certain. The other reference to Shebna in the title of the prophecy would lead one to conclude that it denoted him "who was over the household," i.e. governor of the palace, probably, or major-domo. The word cokhen is thus a general title; others deny this, maintaining that it would then occur more frequently.<P>2. Shebna in <a onClick="return mV(\'2Ki\',18,1);">2 Kings 18</a>f:<P>In <a onClick="return mV(\'2Ki\',18,1);">2Ki 18</a>f = <a onClick="return mV(\'Isa\',36,\'1-\');">Isa 36</a>f we find too a Shebna mentioned among the officers of Hezekiah. There he is called the copher, "scribe" or "secretary," i.e. a minister of state of some kind, whereas Eliakim is he "who is over the household." Is then the Shebna of <a onClick="return mV(\'Isa\',22,\'1-\');">Isa 22</a> the same as this officer? It is of course possible that two men of the same name should hold high office about the same time. We find a Joshua (ben Asaph) "recorder" under Hezekiah (<a onClick="return mV(\'2Ki\',18,18);">2Ki 18:18</a>) and a Joshua (ben Joahaz) having the very same position under Josiah a century later (<a onClick="return mV(\'2Ch\',34,8);">2Ch 34:8</a>). But such a coincidence is rare. Had there been two high officers of state bearing this name, it is most probable that they would somehow have been distinguished one from the other. Shebna\'s name is thought to be Aramaic, thus pointing to a foreign descent, but G. B. Gray, "Isaiah," ICC, 373ff, denies this. We can perhaps safely infer that he was a parvenu from the fact that he was hewing himself a sepulcher in Jerusalem, apparently among those of the nobility, whereas a native would have an ancestral burial-place in the land.<P>However, in 2 Kings, Shebna is the scribe and not the governor of the palace. How is this to be explained? The answer is in Isaiah\'s prophecy.<P>3. <a onClick="return mV(\'Isa\',22,15);">Isaiah 22:15</a>ff:<P>The prophecy of <a onClick="return mV(\'Isa\',22,\'1-\');">Isa 22</a> divides itself into 3 sections. The words "against (not as the Revised Version (British and American) "unto") Shebna who is over the house," or palace, are properly the title of the prophecy, and should come therefore at the very beginning of verse <a onClick="return mV(\'Isa\',22,15);">15</a>.<P>(1) <a onClick="return mV(\'Isa\',22,\'15-18\');">Isa 22:15-18</a> form one whole. In <a onClick="return mV(\'Isa\',22,16);">22:16</a> the words "hewing him out a sepulchre," etc., should be placed immediately before the rest of the verse as <a onClick="return mV(\'Isa\',22,16);">22:16a</A> with the rest of the section is in the second person. We thus read (<a onClick="return mV(\'Isa\',22,15,16,17);">22:15-17</a>): \'Against Shebna who was over the house. Thus saith the Lord, Yahweh of hosts, Go unto this steward (Revised Version margin) that is hewing him out a sepulchre on high, graying a habitation for himself in the rock, (and say) What doest thou here and whom hast thou here that thou hast hewed thee out here a sepulchre? Behold, Yahweh of hosts, ....\' etc. G.H. Box (Isaiah) would further transpose some parts of <a onClick="return mV(\'Isa\',22,17);">22:17</a>f. Shebna is to be tossed like a ball into "a land wide of sides," i.e. a broad extensive land. He is addressed as a disgrace to the house of his royal master. The prophet\'s language is that of personal invective, and one asks what had made him so indignant. Some (e.g. Dillmann, Delitzsch) suggest that Shebna was the leader of a pro-Egyptian party, while others (e.g. Cheyne) believe that the party was pro-Assyrian (compare <a onClick="return mV(\'Isa\',8,\'5-8\');">Isa 8:5-8</a> a). The actual date of the prophecy can only be inferred.<P>(2) <a onClick="return mV(\'Isa\',22,\'19-23\');">Isa 22:19-23</a> contains a prophecy which states that Eliakim is to be given someone\'s post, apparently that of Shebna, if this section be by Isaiah; <a onClick="return mV(\'Isa\',22,23);">22:23</a>, however, is held by many to be a gloss. These verses are not so vehement in tone as the previous ones. Some maintain that the section is not by Isaiah (Duhm, Marti). It can, however, be Isaianic, only later in date than <a onClick="return mV(\'Isa\',22,15);">22:15</a>ff, being possibly meant to modify the former utterance. The palace governor is to lose his office and to be succeeded by Eliakim, who is seen to hold that post in <a onClick="return mV(\'2Ki\',18,1);">2Ki 18</a> f. See <a href="./study/isbe/search.html?string=ELIAKIM">ELIAKIM</a>.<P>(3) <a onClick="return mV(\'Isa\',22,24);">Isa 22:24</a>f are additions to the two utterances by a later hand; they predict the ruin of some such official as Eliakim owing to his own family.<P>4. Date of the Prophecy:<P>There is nothing a priori against believing that these three sections are entirely independent one of another, but there seems to be some connection between (1) and (2), and again between (2) and (3). Now the question that has to be solved is that of the relation of <a onClick="return mV(\'Isa\',22,15);">Isa 22:15</a>ff with <a onClick="return mV(\'2Ki\',18,1);">2Ki 18</a>f = <a onClick="return mV(\'Isa\',36,\'1-\');">Isa 36</a>f; where are given the events of 701 BC. We have the following facts:<P>(a) Shebna is scribe in 701, and Eliakim is governor of the palace;<P>(b) Shebna is governor of the palace in <a onClick="return mV(\'Isa\',22,15);">Isa 22:15</a>, and is to be deposed;<P>(c) if <a onClick="return mV(\'Isa\',22,\'18-22\');">Isa 22:18-22</a> be by Isaiah, Eliakim was to succeed Shebna in that post.<P>Omitting for the moment everything but (a) and (b), the only solution that is to any extent satisfactory is that <a onClick="return mV(\'Isa\',22,\'15-18\');">Isa 22:15-18</a> is to be dated previous to 701 BC. This is the view preferred by G.B. Gray, in the work quoted And this is the most satisfactory theory if we take (2) above into consideration. The prophecy then contained in (1) had not been as yet fulfilled in 701, but (2) had come to pass; Shebna was no longer governor of the palace, but held the position of scribe. Exile might still be in store for him.<P>Another explanation is put forward by K. Fullerton in AJT, IX, 621-42 (1905) and criticized by E. Konig in X, 675-86 (1906). Fullerton rejects verses 24f as not due to Isaiah, and maintains that <a onClick="return mV(\'Isa\',22,\'15-18\');">Isa 22:15-18</a> was spoken by the prophet early in the reign of Manasseh, i.e. later than <a onClick="return mV(\'2Ki\',18,\'1-\');">2Ki 18</a>f; "not so much as a prophecy, a simple prediction, as an attempt to drive Shebna from office....It must be admitted that Isaiah probably did not succeed. The reactionary party seems to have remained in control during the reign of Manasseh....Fortunately, the moral significance of Isaiah does not depend on the fulfillment of this or that specific prediction. We are dealing not with a walking oracle, but with a great character and a noble life" (p. 639). He then infers from the massacres of Manasseh (<a onClick="return mV(\'2Ki\',21,16);">2Ki 21:16</a>) "that a conspiracy had been formed against him by the prophetic party which proposed to place Eliakim on the throne" (p. 640). Isaiah he thinks would not "resort to such violent measures," and so the character of Isaiah makes it questionable whether he was the author of <a onClick="return mV(\'Isa\',22,\'20-23\');">22:20-23</a>. This part would then be due to the prophetic party "who went a step farther than their great leader would approve." This view assumes too much,<P>(a) that the terms in <a onClick="return mV(\'Isa\',22,\'20-23\');">22:20-23</A> refer to kingly power;<P>(b) that Eliakim was of Davidic descent, unless we have a man of non-Davidic origin aiming at the throne, which is again a thing unheard of in Judah; and<P>(c) that there was such a plot in the reign of Manasseh, of which we have no proof.``149';
isbe[7966]='Shebuel`she-bu\'-el, sheb\'-u-el (shebhu\'el; Soubael):<P>(1) A son of Gershom and grandson of Moses (<a onClick="return mV(\'1Ch\',23,16);">1Ch 23:16</a>). He was "ruler over the treasures" (<a onClick="return mV(\'1Ch\',26,24);">1Ch 26:24</a>). In <a onClick="return mV(\'1Ch\',24,20);">1Ch 24:20</a> he is called "Shubael," which is probably the original form of the name (see Gray, HPN, 310).<P>(2) A son of Heman (<a onClick="return mV(\'1Ch\',25,4);">1Ch 25:4</a>), called in <a onClick="return mV(\'1Ch\',25,20);">1Ch 25:20</a> "Shubael" (Septuagint as in <a onClick="return mV(\'1Ch\',25,4);">25:4</A>).``1';
isbe[7967]='Shecaniah; Shechaniah`shek-a-ni\'-a, shekan\'-ya (shekhanyah (in <a onClick="return mV(\'1Ch\',24,11);">1Ch 24:11</a>; <a onClick="return mV(\'2Ch\',31,15);">2Ch 31:15</a>, shekhanyahu); Codex Vaticanus Ischania, Sekenia):<P>(1) A descendant of Zerubbabel (<a onClick="return mV(\'1Ch\',3,21,22);">1Ch 3:21,22</a>). This is the same Shecaniah mentioned in <a onClick="return mV(\'Ezr\',8,3);">Ezr 8:3</a>.<P>(2) "The sons of Shecaniah," so the Massoretic Text of <a onClick="return mV(\'Ezr\',8,5);">Ezr 8:5</a> reads, were among those who returned with Ezra, but a name appears to have been lost from the text, and we should probably read "of the sons of Zattu, Shecaniah the son of Jahaziel" (compare 1Esdras 8:32, "of the sons of Zathoes, Sechenias the son of Jezelus").<P>(3) Chief of the tenth course of priests (<a onClick="return mV(\'1Ch\',24,11);">1Ch 24:11</a>).<P>(4) A priest in the reign of Hezekiah (<a onClick="return mV(\'2Ch\',31,15);">2Ch 31:15</a>).<P>(5) A contemporary of Ezra who supported him in his opposition to foreign marriages (<a onClick="return mV(\'Ezr\',10,2);">Ezr 10:2</a>).<P>(6) The father of Shemaiah, "the keeper of the east gate" (<a onClick="return mV(\'Neh\',3,29);">Ne 3:29</a>).<P>(7) The father-in-law of Tobiah the Ammonite (<a onClick="return mV(\'Neh\',6,18);">Ne 6:18</a>).<P>(8) The eponym of a family which returned with Zerubbabel (<a onClick="return mV(\'Neh\',12,3);">Ne 12:3</a>). It is the same name which, by an interchange of "bh" and "kh", appears as Shebaniah (see <a href="./study/isbe/search.html?string=SHEBANIAH">SHEBANIAH, (2)</a>) in <a onClick="return mV(\'Neh\',10,4,12,14);">Ne 10:4,12,14</a>.``197';
isbe[7968]='Shechem`she\'-kem (shekhem, "shoulder"; Suchem, he Sikima, ta Sikima, etc.; the King James Version gives "Sichem" in <a onClick="return mV(\'Gen\',12,6);">Ge 12:6</a>; and "Sychem" in <a onClick="return mV(\'Act\',7,16);">Ac 7:16</a>):<P>1. Historical:<P>This place is first mentioned in connection with Abraham\'s journey from Haran. At the oak of Moreh in the vicinity he reared his first altar to the Lord in Palestine (<a onClick="return mV(\'Gen\',12,6);">Ge 12:6</a>f). It was doubtless by this oak that Jacob, on his return from Paddan-aram, buried "the strange (the American Standard Revised Version "foreign") gods" (<a onClick="return mV(\'Gen\',35,4);">Ge 35:4</a>). Hither he had come after his meeting with Esau (<a onClick="return mV(\'Gen\',33,18);">Ge 33:18</a>). Eusebius, in Onomasticon, here identifies Shechem with Shalem; but see <a href="./study/isbe/search.html?string=SHALEM">SHALEM</a>. To the east of the city Jacob pitched his tent in a "parcel of ground" which he had bought from Hamor, Shechem\'s father (<a onClick="return mV(\'Gen\',33,19);">Ge 33:19</a>). Here also he raised an altar and called it El-Elohe-Israel, "God, the God of Israel" (<a onClick="return mV(\'Gen\',33,20);">Ge 33:20</a>). Then follows the story of Dinah\'s defilement by Shechem, son of the city\'s chief; and of the treacherous and terrible vengeance exacted by Simeon and Levi (<a onClick="return mV(\'Gen\',34,\'1-\');">Genesis 34</a>). To the rich pasture land near Shechem Joseph came to seek his brethren (<a onClick="return mV(\'Gen\',37,12);">Ge 37:12</a>). It is mentioned as lying to the west of Michmethath (el-Makhneh) on the boundary of Manasseh (<a onClick="return mV(\'Jos\',17,7);">Jos 17:7</a>). It was in the territory of Ephraim; it was made a city of refuge, and assigned to the Kohathite Levites (<a onClick="return mV(\'Jos\',20,7);">Jos 20:7</a>; <a onClick="return mV(\'Jos\',21,21);">21:21</a>). Near the city the Law was promulgated (<a onClick="return mV(\'Deu\',27,11);">De 27:11</a>; <a onClick="return mV(\'Jos\',8,33);">Jos 8:33</a>). When his end was approaching Joshua gathered the tribes of Israel here and addressed to them his final words of counsel and exhortation (chapter <a onClick="return mV(\'Jos\',24,\'1-\');">24</A>). Under the oak in the neighboring sanctuary he set up the stone of witness (<a onClick="return mV(\'Jos\',24,26);">24:26</a>). The war of conquest being done, Joseph\'s bones were buried in the parcel of ground which Jacob had bought, and which fell to the lot of Joseph\'s descendants (<a onClick="return mV(\'Jos\',24,33);">24:33</a>). Abimelech, whose mother was a native of the city, persuaded the men of Shechem to make him king (<a onClick="return mV(\'Jdg\',9,\'1-6\');">Jud 9:1-6</a>), evidently seeking a certain consecration from association with "the oak of the pillar that was in Shechem." Jotham\'s parable was spoken from the cliff of Gerizim overhanging the town (<a onClick="return mV(\'Jdg\',9,7);">Jud 9:7</a>). After a reign of three years Abimelech was rejected by the people. He captured the city, razed it to the foundations, and sowed it with salt. It was then the seat of Canaanite idolatry, the temple of Baal-berith being here (<a onClick="return mV(\'Jdg\',9,4),46;">Jud 9:4,46</a>). In the time of the kings we find that the city was once more a gathering-place of the nation. It was evidently the center, especially for the northern tribes; and hither Rehoboam came in the hope of getting his succession to the throne confirmed (<a onClick="return mV(\'1Ki\',12,1);">1Ki 12:1</a>; <a onClick="return mV(\'2Ch\',10,1);">2Ch 10:1</a>). At the disruption Jeroboam fortified the city and made it his residence (<a onClick="return mV(\'2Ch\',10,25);">2Ch 10:25</a>; Ant, VIII, viii, 4). The capital of the Northern Kingdom was moved, however, first to Tirzah and then to Samaria, and Shechem declined in political importance. Indeed it is not named again in the history of the monarchy. Apparently there were Israelites in it after the captivity, some of whom on their way to the house of the Lord at Jerusalem met a tragic fate at the hands of Ishmael ben Nethaniah (<a onClick="return mV(\'Jer\',41,5);">Jer 41:5</a>). It became the central city of the Samaritans, whose shrine was built on Mt. Gerizim (Sirach 50:26; Ant, XI, viii, 6; XII, i, 1; XIII, iii, 4). Shechem was captured by John Hyrcanus in 132 BC (Ant., XIII, ix, 1; BJ, I, ii, 6). It appears in the New Testament only in the speech of Stephen (<a onClick="return mV(\'Act\',7,16);">Ac 7:16</a>, King James Version "Sychem"). Some (e.g. Smith, DB, under the word) would identify it with Sychar of <a onClick="return mV(\'Jhn\',4,5);">Joh 4:5</a>; but see <a href="./study/isbe/search.html?string=SYCHAR">SYCHAR</a>. Under the Romans it became Flavia Neapolis. In later times it was the seat of a bishopric; the names of five occupants of the see are known.<P>2. Location and Physical Features:<P>There is no doubt as to the situation of ancient Shechem. It lay in the pass which cuts through Mts. Ephraim, Ebal and Gerizim, guarding it on the north and south respectively. Along this line runs the great road which from time immemorial has formed the easiest and the quickest means of communication between the east of the Jordan and the sea. It must have been a place of strength from antiquity. The name seems to occur in Travels of a Mohar (Max Muller, Asien u. Europa, 394), "Mountain of Sahama" probably referring to Ebal or Gerizim. The ancient city may have lain somewhat farther east than the modern Nablus, in which the Roman name Neapolis survives. The situation is one of great beauty. The city lies close to the foot of Gerizim. The terraced slopes of the mountain rise steeply on the south. Across the valley, musical with the sound of running water, the great bulk of Ebal rises on the north, its sides, shaggy with prickly pear, sliding down into grain fields and orchards. The copious springs which supply abundance of water rise at the base of Gerizim. The fruitful and well-wooded valley winds westward among the hills. It is traversed by the carriage road leading to Jaffa and the sea. Eastward the valley opens upon the plain of Makhneh. To the east of the city, in a recess at the base of Gerizim, is the sanctuary known as Rijal el-\'Amud, literally, "men of the column" or "pillar," where some would locate the ancient "oak of Moreh" or "of the pillar." Others would find it in a little village farther east with a fine spring, called Balata, a name which may be connected with ballut, "oak." Still farther to the east and near the base of Ebal is the traditional tomb of Joseph, a little white-domed building beside a luxuriant orchard. On the slope of the mountain beyond is the village of \'Askar; see <a href="./study/isbe/search.html?string=SYCHAR">SYCHAR</a>. To the south of the vale is the traditional Well of Jacob; see <a href="./study/isbe/search.html?string=JACOB\'S+WELL">JACOB\'S WELL</a>. To the southwest of the city is a small mosque on the spot where Jacob is said to have mourned over the blood-stained coat of Joseph. In the neighboring minaret is a stone whereon the Ten Commandments are engraved in Samaritan characters. The main center of interest in the town is the synagogue of the Samaritans, with their ancient manuscript of the Pentateuch.<P>3. Modern Shechem:<P>The modern town contains about 20,000 inhabitants, the great body of them being Moslems. There are some 700 or 800 Christians, chiefly belonging to the Greek Orthodox church. The Samaritans do not total more than 200. The place is still the market for a wide district, both east and west of Jordan. A considerable trade is done in cotton and wool. Soap is manufactured in large quantities, oil for this purpose being plentifully supplied by the olive groves. Tanning and the manufacture of leather goods are also carried on. In old times the slopes of Ebal were covered with vineyards; but these formed a source of temptation to the "faithful." They were therefore removed by authority, and their place taken by the prickly pears mentioned above.``54';
isbe[7969]='Shechemites`she\'-kem-its (hashikhmi; Suchemei): The descendants of Shechem the son of Gilead, a clan of Eastern Manasseh (<a onClick="return mV(\'Num\',26,31);">Nu 26:31</a>; <a onClick="return mV(\'Jos\',17,2);">Jos 17:2</a>).``1';
isbe[7970]='Shed, Shedding`The three Hebrew words, naghar, sim or sum and shaphakh, translated "shed" in many Old Testament passages, always mean a "pouring out," and in nearly every case point to the effusion of blood (<a onClick="return mV(\'Gen\',9,6);">Ge 9:6</a>; <a onClick="return mV(\'Num\',35,33);">Nu 35:33</a>; <a onClick="return mV(\'Deu\',21,7);">De 21:7</a>; <a onClick="return mV(\'2Sa\',20,10);">2Sa 20:10</a>; <a onClick="return mV(\'1Ch\',22,8);">1Ch 22:8</a>; <a onClick="return mV(\'Pro\',1,16);">Pr 1:16</a>, etc.). The Greek words ekcheo, and ekchuno, have precisely the same specific meaning (<a onClick="return mV(\'Mat\',23,35);">Mt 23:35</a>; <a onClick="return mV(\'Mat\',26,28);">26:28</a>; <a onClick="return mV(\'Mar\',14,24);">Mr 14:24</a>; <a onClick="return mV(\'Luk\',11,50);">Lu 11:50</a>; <a onClick="return mV(\'Hbr\',9,22);">Heb 9:22</a>; <a onClick="return mV(\'Rev\',16,6);">Re 16:6</a>). Sometimes they are tropically used in reference to the outpouring of the Holy Spirit (<a onClick="return mV(\'Act\',2,33);">Ac 2:33</a> the King James Version; <a onClick="return mV(\'Tts\',3,6);">Tit 3:6</a>), and to the outpouring of the love of God in the believer\'s heart (<a onClick="return mV(\'Rom\',5,5);">Ro 5:5</a>).``42';
isbe[7971]='Shedeur`shed\'-e-ur, she-de\'-ur (shedhe\'ur, "daybreak"; Codex Vaticanus Sediour, Ediour): The father of Elizur, the chief of Reuben (<a onClick="return mV(\'Num\',1,5);">Nu 1:5</a>; <a onClick="return mV(\'Num\',2,10);">2:10</a>; <a onClick="return mV(\'Num\',7,30);">7:30</a>). French Delitzsch correctly conceives the name as an Assyrian compound, sad uri, "daybreak." Cf, however, Gray, HPN, 169, 197, who emends the text to read Shaddai \'Ur, "Shaddai is flame."``1';
isbe[7972]='Sheep`shep:<P>1. Names:<P>The usual Hebrew word is tso\'n, which is often translated "flock," e.g. "Abel...brought of the firstlings of his flock" (<a onClick="return mV(\'Gen\',4,4);">Ge 4:4</a>); "butter of the herd, and milk of the flock" (<a onClick="return mV(\'Deu\',32,14);">De 32:14</a>). The King James Version and the English Revised Version have "milk of sheep." Compare Arabic da\'n. The Greek word is probaton. For other names, see notes under <a href="./study/isbe/search.html?string=CATTLE">CATTLE</a>; <a href="./study/isbe/search.html?string=EWE">EWE</a>; <a href="./study/isbe/search.html?string=LAMB">LAMB</a>; <a href="./study/isbe/search.html?string=RAM">RAM.</a><P>2. Zoology:<P>The origin of domestic sheep is unknown. There are 11 wild species, the majority of which are found in Asia, and it is conceivable that they may have spread from the highlands of Central Asia to the other portions of their habitat. In North America is found the "bighorn," which is very closely related to a Kamschatkan species. One species, the urial or sha, is found in India. The Barbary sheep, Ovis tragelaphus, also known as the aoudad or arui, inhabits the Atlas Mountains of Northwest Africa. It is thought by Tristram to be zemer, English Versions of the Bible "chamois" of <a onClick="return mV(\'Deu\',14,5);">De 14:5</a>, but there is no good evidence that this animal ranges eastward into Bible lands. Geographically nearest is the Armenian wild sheep, Ovis gmelini, of Asia Minor and Persia. The Cyprian wild sheep may be only a variety of the last, and the mouflon of Corsica and Sardinia is an allied species. It is not easy to draw the line between wild sheep and wild goats. Among the more obvious distinctions are the chin beard and strong odor of male goats. The pelage of all wild sheep consists of hair, not wool, and this indeed is true of some domestic sheep as the fat-rumped short-tailed sheep of Abyssinia and Central Asia. The young lambs of this breed have short curly wool which is the astrachan of commerce. Sheep are geologically recent, their bones and teeth not being found in earlier deposits than the pleiocene or pleistocene. They were, however, among the first of domesticated animals.<P>3. Sheep of Palestine:<P>The sheep of Syria and Palestine are characterized by the possession of an enormous fat tail which weighs many pounds and is known in Arabic as \'alyat, or commonly, liyat. This is the \'alyah, "fat tail" (the King James Version "rump") (<a onClick="return mV(\'Exd\',29,22);">Ex 29:22</a>; <a onClick="return mV(\'Lev\',3,9);">Le 3:9</a>; <a onClick="return mV(\'Lev\',7,3);">7:3</a>; <a onClick="return mV(\'Lev\',8,25);">8:25</a>; <a onClick="return mV(\'Lev\',9,19);">9:19</a>), which was burned in sacrifice. This is at the present day esteemed a great delicacy. Sheep are kept in large numbers by the Bedouin, but a large portion of the supply of mutton for the cities is from the sheep of Armenia and Kurdistan, of which great droves are brought down to the coast in easy stages. Among the Moslems every well-to-do family sacrifices a sheep at the feast of al-\'adcha\', the 10th day of the month dhu-l-chijjat, 40 days after the end of ramadan, the month of fasting. In Lebanon every peasant family during the summer fattens a young ram, which is literally crammed by one of the women of the household, who keeps the creature\'s jaw moving with one hand while with the other she stuffs its mouth with vine or mulberry leaves. Every afternoon she washes it at the village fountain. When slaughtered in the fall it is called ma\'luf, "fed," and is very fat and the flesh very tender. Some of the meat and fat are eaten at once, but the greater part, fat and lean, is cut up fine, cooked together in a large vessel with pepper and salt, and stored in an earthen jar. This, the so-called qauramat, is used as needed through the winter.<P>In the mountains the sheep are gathered at night into folds, which may be caves or enclosures of rough stones. Fierce dogs assist the shepherd in warding off the attacks of wolves, and remain at the fold through the day to guard the slight bedding and simple utensils. In going to pasture the sheep are not driven but are led, following the shepherd as he walks before them and calls to them. "When he hath put forth all his own, he goeth before them, and the sheep follow him: for they know his voice" (<a onClick="return mV(\'Jhn\',10,4);">Joh 10:4</a>).<P>4. Old Testament References:<P>The sheepfolds of Reuben on the plain of Gilead are referred to in <a onClick="return mV(\'Num\',32,16);">Nu 32:16</a> and <a onClick="return mV(\'Jdg\',5,16);">Jud 5:16</a>. A cave is mentioned in <a onClick="return mV(\'1Sa\',24,3);">1Sa 24:3</a> in connection with the pursuit of David by Saul. The shepherd origin of David is referred to in <a onClick="return mV(\'Psa\',78,70);">Ps 78:70</a>:<P class="in15">"He chose David also his servant,<br>And took him from the sheepfolds."<P>Compare also <a onClick="return mV(\'2Sa\',7,8);">2Sa 7:8</a> and <a onClick="return mV(\'1Ch\',17,7);">1Ch 17:7</a>.<P>The shearing of the sheep was a large operation and evidently became a sort of festival. Absalom invited the king\'s sons to his sheep-shearing in Baal-hazor in order that he might find an opportunity to put Amnon to death while his heart was "merry with wine" (<a onClick="return mV(\'2Sa\',13,\'23-29\');">2Sa 13:23-29</a>). The character of the occasion is evident also from the indignation of David at Nabal when the latter refused to provide entertainment at his sheep-shearing for David\'s young men who had previously protected the flocks of Nabal (<a onClick="return mV(\'1Sa\',25,\'2-13\');">1Sa 25:2-13</a>). There is also mention of the sheep-shearing of Judah (<a onClick="return mV(\'Gen\',38,12);">Ge 38:12</a>) and of Laban (<a onClick="return mV(\'Gen\',31,19);">Ge 31:19</a>), on which occasion Jacob stole away with his wives and children and his flocks.<P>Sheep were the most important sacrificial animals, a ram or a young male being often specified. Ewes are mentioned in <a onClick="return mV(\'Lev\',3,6);">Le 3:6</a>; <a onClick="return mV(\'Lev\',4,32);">4:32</a>; <a onClick="return mV(\'Lev\',5,6);">5:6</a>; <a onClick="return mV(\'Lev\',14,10);">14:10</a>; <a onClick="return mV(\'Lev\',22,28);">22:28</a>; <a onClick="return mV(\'Num\',6,14);">Nu 6:14</a>.<P>In the Books of Chronicles we find statements of enormous numbers of animals consumed in sacrifice: "And king Solomon offered a sacrifice of twenty and two thousand oxen, and a hundred and twenty thousand sheep" (<a onClick="return mV(\'2Ch\',7,5);">2Ch 7:5</a>); "And they sacrificed unto Yahweh in that day (in the reign of Asa)...seven hundred oxen and seven thousand sheep" (<a onClick="return mV(\'2Ch\',15,11);">2Ch 15:11</a>); at the cleansing of the temple by Hezekiah "the consecrated things were six hundred oxen and three thousand sheep. But the priests were too few, so that they could not flay all the burnt-offerings: wherefore their brethren the Levites did help them" (<a onClick="return mV(\'2Ch\',29,33);">2Ch 29:33</a>f); and "Hezekiah king of Judah did give to the assembly for offerings a thousand bullocks and seven thousand sheep; and the princes gave to the assembly a thousand bullocks and ten thousand sheep" (<a onClick="return mV(\'2Ch\',30,24);">2Ch 30:24</a>). In the account of the war of the sons of Reuben and their allies with the Hagrites, we read: "And they took away their cattle; of their camels fifty thousand, and of sheep two hundred and fifty thousand, and of asses two thousand, and of men a hundred thousand" (<a onClick="return mV(\'1Ch\',5,21);">1Ch 5:21</a>). Mesha king of Moab is called a "sheep-master," and we read that "he rendered unto the king of Israel the wool of a hundred thousand lambs, and of a hundred thousand rams" (<a onClick="return mV(\'2Ki\',3,4);">2Ki 3:4</a>).<P>5. Figurative:<P>Christ is represented as the Lamb of God (<a onClick="return mV(\'Isa\',53,7);">Isa 53:7</a>; <a onClick="return mV(\'Jhn\',1,29);">Joh 1:29</a>; <a onClick="return mV(\'Rev\',5,6);">Re 5:6</a>). Some of the most beautiful passages in the Bible represent God as a shepherd: "From thence is the shepherd, the stone of Israel" (<a onClick="return mV(\'Gen\',49,24);">Ge 49:24</a>); "Yahweh is my shepherd; I shall not want" (<a onClick="return mV(\'Psa\',23,1);">Ps 23:1</a>; compare <a onClick="return mV(\'Isa\',40,11);">Isa 40:11</a>; <a onClick="return mV(\'Eze\',34,\'12-16\');">Eze 34:12-16</a>). Jesus said "I am the good shepherd; and I know mine own, and mine own know me...and I lay down my life for the sheep" (<a onClick="return mV(\'Jhn\',10,14);">Joh 10:14</a>f). The people without leaders are likened to sheep without a shepherd (<a onClick="return mV(\'Num\',27,17);">Nu 27:17</a>; <a onClick="return mV(\'1Ki\',22,17);">1Ki 22:17</a>; <a onClick="return mV(\'2Ch\',18,16);">2Ch 18:16</a>; <a onClick="return mV(\'Eze\',34,5);">Eze 34:5</a>). Jesus at the Last Supper applies to Himself the words of <a onClick="return mV(\'Zec\',13,7);">Zec 13:7</a>; "I will smite the shepherd, and the sheep of the flock shall be scattered abroad" (<a onClick="return mV(\'Mat\',26,31);">Mt 26:31</a>; <a onClick="return mV(\'Mar\',14,27);">Mr 14:27</a>). The enemies of Yahweh are compared to the fat of the sacrifice that is consumed away in smoke (<a onClick="return mV(\'Psa\',37,20);">Ps 37:20</a>). God\'s people are "the sheep of his pasture" (<a onClick="return mV(\'Psa\',79,13);">Ps 79:13</a>; <a onClick="return mV(\'Psa\',95,7);">95:7</a>; <a onClick="return mV(\'Psa\',100,3);">100:3</a>). In sinning they become like lost sheep (<a onClick="return mV(\'Isa\',53,6);">Isa 53:6</a>; <a onClick="return mV(\'Jer\',50,6);">Jer 50:6</a>; <a onClick="return mV(\'Eze\',34,6);">Eze 34:6</a>; <a onClick="return mV(\'Luk\',15,3);">Lu 15:3</a>). In the mouth of Nathan the poor man\'s one little ewe lamb is a vivid image of the treasure of which the king David has robbed Uriah the Hittite (<a onClick="return mV(\'2Sa\',12,3);">2Sa 12:3</a>). In <a onClick="return mV(\'Sgs\',6,6);">So 6:6</a>, the teeth of the bride are likened to a flock of ewes. It is prophesied that "the wolf shall dwell with the lamb" (<a onClick="return mV(\'Isa\',11,6);">Isa 11:6</a>) and that "the wolf and the lamb shall feed together" (<a onClick="return mV(\'Isa\',65,25);">Isa 65:25</a>). Jesus says to His disciples, "I send you forth as sheep in the midst of wolves" (<a onClick="return mV(\'Mat\',10,16);">Mt 10:16</a>; compare <a onClick="return mV(\'Luk\',10,3);">Lu 10:3</a>). In the parable of the Good Shepherd we read: "He that is a hireling, and not a shepherd, whose own the sheep are not, beholdeth the wolf coming, and leaveth the sheep, and fleeth" (<a onClick="return mV(\'Jhn\',10,12);">Joh 10:12</a>).``37';
isbe[7973]='Sheep Gate`(sha\'ar ha-tso\'-n (<a onClick="return mV(\'Neh\',3,1,32);">Ne 3:1,32</a>; <a onClick="return mV(\'Neh\',12,39);">12:39</a>)): One of the gates of Jerusalem, probably near the northeast corner.`<a href="./study/isbe/search.html?string=JERUSALEM">JERUSALEM</a>; <a href="./study/isbe/search.html?string=BETHESDA">BETHESDA</a>; <a href="./study/isbe/search.html?string=SHEEP+MARKET">SHEEP MARKET</a>`1';
isbe[7974]='Sheep Market`(<a onClick="return mV(\'Jhn\',5,2);">Joh 5:2</a>, the Revised Version (British and American) "sheep gate"): The Greek (he probatike) means simply something that pertains to sheep.`<a href="./study/isbe/search.html?string=BETHESDA">BETHESDA</a>; <a href="./study/isbe/search.html?string=SHEEP+GATE">SHEEP GATE</a>`1';
isbe[7975]='Sheep Tending`ten\'-ding: The Scriptural allusions to pastoral life and the similes drawn from that life are the most familiar and revered in the Bible. Among the first verses that a child learns is "The Lord is my shepherd, I shall not wants" (<a onClick="return mV(\'Psa\',23,1);">Ps 23:1</a> the King James Version, the English Revised Version). What follower of the Master does not love to dwell on the words of the "Good Shepherd" chapter in the Gospel of John (<a onClick="return mV(\'Jhn\',10,\'1-\');">Joh 10</a>)? Jesus must have drawn a sympathetic response when He referred to the relationship of sheep to shepherd, a relationship familiar to all His hearers and doubtless shared by some of them with their flocks. As a rule the modern traveler in the Holy Land meets with disappointment if he comes expecting to see things as they were depicted in the Bible. An exception to this is the pastoral life, which has not changed one what since Abraham and his descendants fed their flocks on the rich plateaus east of the Jordan or on the mountains of Palestine and Syria. One may count among his most prized experiences the days and nights spent under the spell of Syrian shepherd life.``133';
isbe[7976]='Sheep-Master`(noqedh, "herdsman," <a onClick="return mV(\'2Ki\',3,4);">2Ki 3:4</a>).`<a href="./study/isbe/search.html?string=SHEEP+SHEARING">SHEEP-SHEARING</a>`1';
isbe[7977]='Sheep-Shearing`shep\'-sher-ing: The sheep-shearing is done in the springtime, either by the owners (<a onClick="return mV(\'Gen\',31,19);">Ge 31:19</a>; <a onClick="return mV(\'Gen\',38,13);">38:13</a>; <a onClick="return mV(\'Deu\',15,19);">De 15:19</a>; <a onClick="return mV(\'1Sa\',25,2,4);">1Sa 25:2,4</a>) or by regular "shearers" (gazaz) (<a onClick="return mV(\'1Sa\',25,7,11);">1Sa 25:7,11</a>; <a onClick="return mV(\'Isa\',53,7);">Isa 53:7</a>). There were special houses for this work in Old Testament times (<a onClick="return mV(\'2Ki\',10,12,14);">2Ki 10:12,14</a>). The shearing was carefully done so as to keep the fleece whole (<a onClick="return mV(\'Jdg\',6,37);">Jud 6:37</a>). The sheep of a flock are not branded but spotted. Lime or some dyestuff is painted in one or more spots on the wool of the back as a distinguishing mark. In <a onClick="return mV(\'2Ki\',3,4);">2Ki 3:4</a>, Mesha, the chief or sheikh of Moab, was a sheep-master, literally, "a sheep spotter."``133';
isbe[7978]='Sheepcote; Sheepfold`shep\'-kot, shep\'-kot, shep\'-fold (gedherah, mikhlah, mishpethayim, naweh; aule): At night the sheep are driven into a sheepfold if they are in a district where there is danger from robbers or wild beasts. These folds are simple walled enclosures (<a onClick="return mV(\'Num\',32,16);">Nu 32:16</a>; <a onClick="return mV(\'Jdg\',5,16);">Jud 5:16</a>; <a onClick="return mV(\'2Ch\',32,28);">2Ch 32:28</a>; <a onClick="return mV(\'Psa\',78,70);">Ps 78:70</a>; <a onClick="return mV(\'Zep\',2,6);">Ze 2:6</a>; <a onClick="return mV(\'Jhn\',10,1);">Joh 10:1</a>). On the top of the wall is heaped thorny brushwood as a further safeguard. Sometimes there is a covered hut in the corner for the shepherd. Where there is no danger the sheep huddle together in the open until daylight, while the shepherd watches over them (<a onClick="return mV(\'Gen\',31,39);">Ge 31:39</a>; <a onClick="return mV(\'Luk\',2,8);">Lu 2:8</a>). In the winter time caves are sought after (<a onClick="return mV(\'1Sa\',24,3);">1Sa 24:3</a>; <a onClick="return mV(\'Zep\',2,6);">Ze 2:6</a>). The antiquity of the use of some of the caves for this purpose is indicated by the thick deposit of potassium nitrate formed from the decomposition of the sheep dung.``133';
isbe[7979]='Sheepskin`shep\'-skin.`<a href="./study/isbe/search.html?string=BOTTLE">BOTTLE</a>; <a href="./study/isbe/search.html?string=DRESS">DRESS</a>; <a href="./study/isbe/search.html?string=RAMS\'+skins">RAMS\' SKINS</a>`1';
isbe[7980]='Sheerah`she\'-e-ra (she\'erah; Codex Alexandrinus Saara, Codex Vaticanus omits): A daughter of Ephraim, who, according to the Massoretic Text of <a onClick="return mV(\'1Ch\',7,24);">1Ch 7:24</a> (the King James Version "Sherah"), built the two Beth-horons and Uzzen-sheerah. The verse has been suspected because elsewhere in the Old Testament the founders of cities are men. Uzzen-sheerah as a place is unidentified; Conder suggests as the site Bet Sira, a village 2 miles southwest of the Lower Beth-horon (Mem 3 16).``1';
isbe[7981]='Sheet`shet. See <a href="./study/isbe/search.html?string=DRESS">DRESS</a>; compare <a onClick="return mV(\'Act\',10,11);">Ac 10:11</a>, "as it were a great sheet" (othone).``1';
isbe[7982]='Shehariah`she-ha-ri\'-a (sheharyah): A Benjamite (<a onClick="return mV(\'1Ch\',8,26);">1Ch 8:26</a>).``1';
isbe[7983]='Shekel`shek\'-\'-l, shek\'-el, she\'-kel, she\'-kul (sheqel): A weight and a coin. The Hebrew shekel was the 50th part of a mina, and as a weight about 224 grains, and as money (silver) was worth about 2 shillings 9d., or 66 cents (in 1915). No gold shekel has been found, and hence, it is inferred that such a coin was not used; but as a certain amount of gold, by weight, it is mentioned in <a onClick="return mV(\'2Ch\',3,9);">2Ch 3:9</a> and is probably intended to be supplied in <a onClick="return mV(\'2Ki\',5,5);">2Ki 5:5</a>. The gold shekel was 1/60 of the heavy Babylonian mina and weighed about 252 grains. In value it was about equal to 2 British pounds and 1 shilling, or about $10.00 (in 1915). See <a href="./study/isbe/search.html?string=MONEY">MONEY</a>; <a href="./study/isbe/search.html?string=WEIGHTS+AND+MEASURES">WEIGHTS AND MEASURES</a>. In the Revised Version (British and American) of <a onClick="return mV(\'Mat\',17,27);">Mt 17:27</a> "shekel" replaces "piece of money" of the King James Version, the translation of stater.`<a href="./study/isbe/search.html?string=STATER">STATER</a>`138';
isbe[7984]='Shekel of the King\'s Weight, Royal Shekel`(\'ebhen ha-melekh, "stone (i.e. weight) of the king"): The shekel by which Absalom\'s hair was weighed (<a onClick="return mV(\'2Sa\',14,26);">2Sa 14:26</a>), probably the light shekel of 130 grains.`<a href="./study/isbe/search.html?string=WEIGHTS+AND+MEASURES">WEIGHTS AND MEASURES</a>`1';
isbe[7985]='Shekel of the Sanctuary; Sacred Shekel`(sheqel ha-qodhesh (<a onClick="return mV(\'Num\',7,\'1-\');">Nu 7</a> passim)): The same as the silver shekel mentioned under <a href="./study/isbe/search.html?string=SHEKEL">SHEKEL</a> (which see), except in <a onClick="return mV(\'Exd\',38,24);">Ex 38:24</a>, where it is used in measuring gold. The term is used for offerings made for sacred purposes.``1';
isbe[7986]='Shekinah`she-ki\'-na (shekhinah, "that which dwells," from the verb shakhen, or shakhan, "to dwell," "reside"): This word is not found in the Bible, but there are allusions to it in <a onClick="return mV(\'Isa\',60,2);">Isa 60:2</a>; <a onClick="return mV(\'Mat\',17,5);">Mt 17:5</a>; <a onClick="return mV(\'Luk\',2,9);">Lu 2:9</a>; <a onClick="return mV(\'Rom\',9,4);">Ro 9:4</a>. It is first found in the Targums.`<a href="./study/isbe/search.html?string=GLORY">GLORY</a>`1';
isbe[7987]='Shelah`she\'-la (shelah; Sala):<P>(1) The youngest son of Judah and the daughter of Shua the Canaanite (<a onClick="return mV(\'Gen\',38,5,11,14,26);">Ge 38:5,11,14,26</a>; <a onClick="return mV(\'Gen\',46,12);">46:12</a>; <a onClick="return mV(\'Num\',26,20);">Nu 26:20 (Hebrew 16)</a>; <a onClick="return mV(\'1Ch\',2,3);">1Ch 2:3</a>; <a onClick="return mV(\'1Ch\',4,21);">4:21</a>). He gave his name to the family of the Shelanites (<a onClick="return mV(\'Num\',26,20);">Nu 26:20 (Hebrew 16)</a>). Probably "the Shelanite" should be substituted for "the Shilonite" of <a onClick="return mV(\'Neh\',11,5);">Ne 11:5</a>; <a onClick="return mV(\'1Ch\',9,5);">1Ch 9:5</a>.<P>(2) (shelach): The son or (Septuagint) grandson of Arpachshad and father of Eber (<a onClick="return mV(\'Gen\',10,24);">Ge 10:24</a>; <a onClick="return mV(\'Gen\',11,13,14,15);">11:13 (12), 14,15</a>; <a onClick="return mV(\'1Ch\',1,18,24);">1Ch 1:18,24</a>; <a onClick="return mV(\'Luk\',3,35);">Lu 3:35</a>).<P>(3) <a onClick="return mV(\'Neh\',3,15);">Ne 3:15</a> = "Shiloah" of <a onClick="return mV(\'Isa\',8,6);">Isa 8:6</a>.`<a href="./study/isbe/search.html?string=SILOAM">SILOAM</a>`1';
isbe[7988]='Shelanites`she\'-lan-its, she-la\'-nits.`<a href="./study/isbe/search.html?string=SHELAH">SHELAH</a>`1';
isbe[7989]='Shelemiah`shel-e-mi\'-a, she-lem\'-ya (shelemyah; Codex Vaticanus Selemia, Codex Alexandrinus (Selemias):<P>(1) One of the sons of Bani who married foreign wives in the time of Ezra (<a onClick="return mV(\'Ezr\',10,39);">Ezr 10:39</a>), called "Selemias" in 1Esdras 9:34.<P>(2) Father of Hananiah who restored part of the wall of Jerusalem (<a onClick="return mV(\'Neh\',3,30);">Ne 3:30</a>) (Codex Vaticanus Telemia, ..., Telemias). (3) A priest who was appointed one of the treasurers to distribute the Levitical tithes by Nehemiah (<a onClick="return mV(\'Neh\',13,13);">Ne 13:13</a>).<P>(4) The father of Jehucal (or Jucal) in the reign of Zedekiah (<a onClick="return mV(\'Jer\',37,3);">Jer 37:3</a>; <a onClick="return mV(\'Jer\',38,1);">38:1</a>; in the second passage the name is Shelemyahu).<P>(5) The father of Irijah, the captain of the ward, who arrested Jeremiah as a deserter to the Chaldeans (<a onClick="return mV(\'Jer\',37,13);">Jer 37:13</a>).<P>(6) <a onClick="return mV(\'1Ch\',26,14);">1Ch 26:14</a>. See <a href="./study/isbe/search.html?string=MESHELEMIAH">MESHELEMIAH</a>.<P>(7) Another of the sons of Bani who married foreign wives in the time of Ezra (<a onClick="return mV(\'Ezr\',10,41);">Ezr 10:41</a>). It is of interest to note that the order of names in this passage—Sharai, Azarel, and Shelemiah—is almost identical with the names in <a onClick="return mV(\'Jer\',36,26);">Jer 36:26</a>, namely, Seraiah, Azriel, Shelemiah.<P>(8) Ancestor of Jehudi (<a onClick="return mV(\'Jer\',36,14);">Jer 36:14</a>).<P>(9) Septuagint omits.) Son of Abdeel, one of the men sent by Jehoiakim to seize Baruch and Jeremiah after Baruch had read the "roll" in the king\'s presence (<a onClick="return mV(\'Jer\',36,26);">Jer 36:26</a>).``197';
isbe[7990]='Sheleph`she\'-lef (shaleph, in pause; Septuagint Saleph): Son of Joktan (<a onClick="return mV(\'Gen\',10,26);">Ge 10:26</a>; <a onClick="return mV(\'1Ch\',1,20);">1Ch 1:20</a>). Sheleph is the name of a Yemenite tribe or district, named on Sabean inscriptions and also by Arabian geographers, located in Southern Arabia.``1';
isbe[7991]='Shelesh`she\'-lesh (shelesh; Codex Vaticanus Seme; Codex Alexandrinus Selles, Lucian, Selem): An Asherite, son of Helem (<a onClick="return mV(\'1Ch\',7,35);">1Ch 7:35</a>).``1';
isbe[7992]='Shelomi`she-lo\'-mi, shel\'-o-mi (shelomi): An Asherite (<a onClick="return mV(\'Num\',34,27);">Nu 34:27</a>).``1';
isbe[7993]='Shelomith`she-lo\'-mith, shel\'-o-mith (shelomith; in <a onClick="return mV(\'Ezr\',8,10);">Ezr 8:10</a>, shelomith):<P>(1) The mother of the man who was stoned for blasphemy (<a onClick="return mV(\'Lev\',24,11);">Le 24:11</a>) (BAF, Salomeith, Lucian, Salmith).<P>(2) Daughter of Zerubbabel (<a onClick="return mV(\'1Ch\',3,19);">1Ch 3:19</a>) (Codex Vaticanus Salomethei; Codex Alexandrinus Salomethi, Lucian, Salomith).<P>(3) One of the "sons of Izhar" (<a onClick="return mV(\'1Ch\',23,18);">1Ch 23:18</a>) (Codex Vaticanus Salomoth; Codex Alexandrinus Saloumoth, Lucian, Salomith), called "Shelomoth" in <a onClick="return mV(\'1Ch\',24,22);">24:22</A>.<P>(4) The name of a family whose representatives returned with Ezra (<a onClick="return mV(\'Ezr\',8,10);">Ezr 8:10</a>) (Codex Vaticanus Saleimouth; Lucian, Salimoth). The Massoretic Text here should read, "and the sons of Bani; Shelomith, son of Josiphiah"; and in 1Esdras 8:36, "of the sons of Banias, Salimoth, son of Josaphias."``197';
isbe[7994]='Shelomoth`she-lo\'-moth, shel\'-o-moth, -moth (shelomoth):<P>(1) An Izharite (<a onClick="return mV(\'1Ch\',24,22);">1Ch 24:22</a>, Codex Vaticanus and Codex Alexandrinus Salomoth; Lucian, Salomith = "Shelomith" of <a onClick="return mV(\'1Ch\',23,18);">1Ch 23:18</a>).<P>(2) A Levite descended from Eliezer ben Moses (<a onClick="return mV(\'1Ch\',26,25);">1Ch 26:25</a>, Qere shelomith; <a onClick="return mV(\'1Ch\',26,28);">1Ch 26:28</a>).<P>(3) A Gershonite (<a onClick="return mV(\'1Ch\',23,9);">1Ch 23:9</a>, Qere Shelomith; Codex Vaticanus Alotheim, Codex Alexandrinus Salomeith).``1';
isbe[7995]='Shelumiel`she-lu\'-mi-el (shelumi\'el; both the punctuation and interpretation are in doubt. Massoretic Text punctuates the first element as a passive participle; the use of the participle in compounds is common in Assyrian but rare in Heb (compare Gray, HPN, 200). The meaning of the present form, if it be correct, is "at peace with God" (Hommel, Ancient Hebrew Tradition, 200, "my friend is God"). Septuagint reads Salamiel: Prince of the tribe of Simeon (<a onClick="return mV(\'Num\',1,6);">Nu 1:6</a>; <a onClick="return mV(\'Num\',2,12);">2:12</a>; <a onClick="return mV(\'Num\',7,36,41);">7:36,41</a>; <a onClick="return mV(\'Num\',10,19);">10:19</a>). The genealogy of Judith (8:1) is carried back to this Shelumiel or Shelamiel, called there "Salamiel."``197';
isbe[7996]='Shem`shem (shem; Sem):<P>1. Position in Noah\'s Family: His Name:<P>The eldest son of Noah, from whom the Jews, as well as the Semitic ("Shemitic") nations in general have descended. When giving the names of Noah\'s three sons, Shem is always mentioned first (<a onClick="return mV(\'Gen\',9,18);">Ge 9:18</a>; <a onClick="return mV(\'Gen\',10,1);">10:1</a>, etc.); and though "the elder" in "Shem the brother of Japheth the elder" (<a onClick="return mV(\'Gen\',10,21);">Ge 10:21</a> margin) is explained as referring to Shem, this is not the rendering of Onkelos. His five sons peopled the greater part of West Asia\'s finest tracts, from Elam on the east to the Mediterranean on the west. Though generally regarded as meaning "dusky" (compare the Assyr-Babylonian samu—also Ham—possibly = "black," Japheth, "fair"), it is considered possible that Shem may be the usual Hebrew word for "name" (shem), given him because he was the firstborn—a parallel to the Assyr-Babylonian usage, in which "son," "name" (sumu) are synonyms (W. A. Inscriptions, V, plural 23, 11, 29-32abc).<P>2. History, and the Nations Descended from Him:<P>Shem, who is called "the father of all the children of Eber," was born when Noah had attained the age of 500 years (<a onClick="return mV(\'Gen\',5,32);">Ge 5:32</a>). Though married at the time of the Flood, Shem was then childless. Aided by Japheth, he covered the nakedness of their father, which Ham, the youngest brother, had revealed to them; but unlike the last, Shem and Japheth, in their filial piety, approached their father walking backward, in order not to look upon him. Two years after the Flood, Shem being then 100 years old, his son Arpachshad was born (<a onClick="return mV(\'Gen\',11,10);">Ge 11:10</a>), and was followed by further sons and daughters during the remaining 500 years which preceded Shem\'s death. Noah\'s prophetic blessing, on awakening from his wine, may be regarded as having been fulfilled in his descendants, who occupied Syria (Aramaic), Palestine (Canaan), Chaldea (Arpachshad), Assyria (Asshur), part of Persia (Elam), and Arabia (Joktan). In the first three of these, as well as in Elam, Canaanites had settled (if not in the other districts mentioned), but Shemites ruled, at some time or other, over the Canaanites, and Canaan thus became "his servant" (<a onClick="return mV(\'Gen\',9,25,26);">Ge 9:25,26</a>). The tablets found in Cappadocia seem to show that Shemites (Assyrians) had settled in that district also, but this was apparently an unimportant colony. Though designated sons of Shem, some of his descendants (e.g. the Elamites) did not speak a Semitic language, while other nationalities, not his descendants (e.g. the Canaanites), did.`<a href="./study/isbe/search.html?string=HAM">HAM</a>; <a href="./study/isbe/search.html?string=JAPHETH">JAPHETH</a>; <a href="./study/isbe/search.html?string=TABLE+OF+NATIONS">TABLE OF NATIONS</a>`136';
isbe[7997]='Shema (1)`she\'-ma (shema\'; Samaa): A city of Judah in the Negeb (<a onClick="return mV(\'Jos\',15,26);">Jos 15:26</a>). If, as some think, identical with <a href="./study/isbe/search.html?string=SHEBA">SHEBA</a> (which see) of <a onClick="return mV(\'Jos\',19,2);">Jos 19:2</a>, then the latter must have been inserted here from <a onClick="return mV(\'Jos\',15,26);">Jos 15:26</a>. It is noticeable that the root letters (sh-m-\') were those from which Simeon is derived. Shema is probably identical with Jeshua (<a onClick="return mV(\'Neh\',11,26);">Ne 11:26</a>). The place was clearly far south, and it may be Kh. Sa\'wah, a ruin upon a prominent hilltop between Kh. \'Attir and Khirbet el-Milch. There is a wall around the ruins, of large blocks of conglomerate flint (PEF, III, 409, Sh XXV).``117';
isbe[7998]='Shema (2)`(shema\'):<P>(1) A Reubenite (<a onClick="return mV(\'1Ch\',5,8);">1Ch 5:8</a>, Codex Vaticanus and Codex Alexandrinus Sama, Lucian, Semeei). See <a href="./study/isbe/search.html?string=SHIMEI">SHIMEI</a>.<P>(2) One of the heads of "fathers\' houses" in Aijalon, who put to flight the inhabitants of Gath (<a onClick="return mV(\'1Ch\',8,13);">1Ch 8:13</a>, Codex Vaticanus and Codex Alexandrinus Sama, Lucian, Samoa); in <a onClick="return mV(\'1Ch\',8,21);">1Ch 8:21</a> he is called "Shimei." The statement is very obscure and the whole incident is probably due to some marginal note.<P>(3) One of those who stood at Ezra\'s right during the reading of the Law (<a onClick="return mV(\'Neh\',8,4);">Ne 8:4</a>, Samaias). He is called "Sammus" in 1Esdras 9:43.``197';
isbe[7999]='Shemaah`she-ma\'-a, shem\'-a-a (ha-shema\'-ah; Codex Vaticanus Ama, Codex Alexandrinus Samaa, Lucian, Asma): A Benjamite, who was the father, according to the Massoretic Text, of Ahiezer and Joash; but according to the Septuagint huios = (ben) instead of (bene) of Joash alone (<a onClick="return mV(\'1Ch\',12,3);">1Ch 12:3</a>). The original text may have read ben yeho-shama\' (compare hoshama\', of <a onClick="return mV(\'1Ch\',3,18);">1Ch 3:18</a>); then a dittography of the following (h) caused the error (Curtis, ICC).``1';
isbe[8000]='Shemaiah`she-ma\'-ya, she-mi\'-a (shema\'yah (in <a onClick="return mV(\'2Ch\',11,2);">2Ch 11:2</a>; <a onClick="return mV(\'2Ch\',17,8);">17:8</a>; <a onClick="return mV(\'2Ch\',31,15);">31:15</a>; <a onClick="return mV(\'2Ch\',35,9);">35:9</a>; <a onClick="return mV(\'Jer\',26,20);">Jer 26:20</a>; <a onClick="return mV(\'Jer\',29,24);">29:24</a>; <a onClick="return mV(\'Jer\',36,12);">36:12</a>, shema\'yahu), "Jahveh hears"): The name is most frequently borne by priests, Levites and prophets.<P>(1) Codex Vaticanus Sammaias; Codex Alexandrinus Samaias (<a onClick="return mV(\'2Ch\',12,5,7);">2Ch 12:5,7</a>). A prophet who, together with Ahijah, protested against Rehoboam\'s contemplated war against the ten revolted tribes (<a onClick="return mV(\'1Ki\',12,\'22-24\');">1Ki 12:22-24</a> = <a onClick="return mV(\'2Ch\',11,\'2-4\');">2Ch 11:2-4</a>). He declared that the rebellion had divine sanction. The second Greek account knows nothing of Ahijah in this connection and introduces Shemaiah at the gathering at Shechem where both Jeroboam and Rehoboam were present; it narrates that on this occasion Shemaiah (not Ahijah) rent his garment and gave ten parts to Jeroboam to signify the ten tribes over which he was to become king. (This version, however, is not taken very seriously, because of its numerous inconsistencies.) Shemaiah also prophesied at the invasion of Judah by Shishak (<a onClick="return mV(\'2Ch\',12,\'5-7\');">2Ch 12:5-7</a>). His message was to the effect that as the princes of Israel had humbled themselves, God\'s wrath against their idolatrous practices would not be poured out upon Jerusalem by the hand of Shishak (<a onClick="return mV(\'2Ch\',13,7);">2Ch 13:7</a>). He is mentioned as the author of a history of Rehoboam (<a onClick="return mV(\'2Ch\',12,15);">2Ch 12:15</a>).<P>(2) Son of Shecaniah (<a onClick="return mV(\'1Ch\',3,22);">1Ch 3:22</a>, Samaia), a descendant of Zerubbabel. This is also the name of one of the men who helped to repair the wall (<a onClick="return mV(\'Neh\',3,29);">Ne 3:29</a>, Semeia (...) (compare Curtis, ICC, in <a onClick="return mV(\'1Ch\',3,\'17-24\');">1Ch 3:17-24</a>)).<P>(3) A Simeonite (<a onClick="return mV(\'1Ch\',4,37);">1Ch 4:37</a>, Codex Vaticanus Sumeon; Codex Alexandrinus Samaias), identical, perhaps, with the Shimei of <a onClick="return mV(\'1Ch\',4,26,27);">1Ch 4:26,27</a>.<P>(4) A Reubenite (<a onClick="return mV(\'1Ch\',5,4);">1Ch 5:4</a>, Codex Vaticanus Semeei; Codex Alexandrinus Semein), called Shema in <a onClick="return mV(\'1Ch\',5,8);">1Ch 5:8</a>.<P>(5) A Merarite Levite (<a onClick="return mV(\'1Ch\',9,14);">1Ch 9:14</a>; <a onClick="return mV(\'Neh\',11,15);">Ne 11:15</a>, Samaia), one of those who dwelt in Jerusalem.<P>(6) A Levite of the family of Jeduthun, father of Obadiah or Abda (<a onClick="return mV(\'1Ch\',9,16);">1Ch 9:16</a>, Sameia, Codex Alexandrinus Samias, called "Shammua" in <a onClick="return mV(\'Neh\',11,17);">Ne 11:17</a>).<P>(7) Head of the Levitical Kohathite clan of Elizaphan in the time of David (<a onClick="return mV(\'1Ch\',15,8);">1Ch 15:8</a>, Codex Vaticanus Samaias; Codex Alexandrinus Samaia; Codex Sinaiticus Sameas; <a onClick="return mV(\'1Ch\',15,11);">1Ch 15:11</a>, Codex Vaticanus Samias; Codex Alexandrinus Semeias; Codex Sinaiticus Samai). He may be the same person as (8).<P>(8) The scribe (<a onClick="return mV(\'1Ch\',24,6);">1Ch 24:6</a>), the son of Nethanel, who registered the names of the priestly courses.<P>(9) A Korahite Levite, eldest son of Obed-edom (<a onClick="return mV(\'1Ch\',26,4,6);">1Ch 26:4,6</a>, Codex Vaticanus Samaias; Codex Alexandrinus Sameias; <a onClick="return mV(\'1Ch\',26,7);">1Ch 26:7</a>, Codex Vaticanus Samai; Codex Alexandrinus Semeia).<P>(10) A Levite (<a onClick="return mV(\'2Ch\',17,8);">2Ch 17:8</a>, Codex Vaticanus Samouas; Codex Alexandrinus Samouias). One of the commission appointed by Jehoshaphat to teach the book of the Law in Judah. The names of the commissioners as a whole belong to a period later than the 9th century. (Gray, HPN, 231).<P>(11) One of the men "over the free-will offerings of God" (<a onClick="return mV(\'2Ch\',31,15);">2Ch 31:15</a>, Semeei).<P>(12) A Levite of the family of Jeduthun in the reign of Hezekiah (<a onClick="return mV(\'2Ch\',29,14);">2Ch 29:14</a>), one of those who assisted in the purification of the Temple.<P>(13) A chief of the Levites (<a onClick="return mV(\'2Ch\',35,9);">2Ch 35:9</a>), called "Samaias" in Septuagint and 1Esdras 1:9.<P>(14) A "chief man" under Ezra (<a onClick="return mV(\'Ezr\',8,16);">Ezr 8:16</a>), called "Maasmas" and "Samaias" in 1Esdras 8:43,44.<P>(15) A member of the family of Adonikam (<a onClick="return mV(\'Ezr\',8,13);">Ezr 8:13</a>, Codex Vaticanus Samaia; Codex Alexandrinus Samaeia; "Samaias" in 1Es 8:39).<P>(16) A priest of the family of Harim who married a foreign wife (<a onClick="return mV(\'Ezr\',10,21);">Ezr 10:21</a>), called "Sameus" in 1Esdras 9:21.<P>(17) A layman of the family of Harim who married a foreign wife (<a onClick="return mV(\'Ezr\',10,31);">Ezr 10:31</a>), called "Sabbeus" in 1Esdras 9:32.<P>(18) A prophet (<a onClick="return mV(\'Neh\',6,\'10-14\');">Ne 6:10-14</a>, Codex Vaticanus Semeei; Codex Alexandrinus Semei), employed by Sanballat and Tobiah to frighten Nehemiah and hinder the rebuilding of the wall.<P>(19) One of the 24 courses of priests, 16th under Zerubbabel (<a onClick="return mV(\'Neh\',12,6);">Ne 12:6</a>, Codex Sinaiticus and Codex Alexandrinus Semeias), 15th under Joiakim (<a onClick="return mV(\'Neh\',12,18);">Ne 12:18</a>; Codex Sinaiticus and Codex Alexandrinus Semeia), and 21st under Nehemiah (<a onClick="return mV(\'Neh\',10,8);">Ne 10:8</a>, Samaia), mentioned in connection with the dedication of the wall.<P>(20) A priest, descendant of Asaph (<a onClick="return mV(\'Neh\',12,35);">Ne 12:35</a>).<P>(21) A singer (or clan) participating in the dedication of the wall (<a onClick="return mV(\'Neh\',12,36);">Ne 12:36</a>).<P>(22) Father of the prophet Urijah (<a onClick="return mV(\'Jer\',26,20);">Jer 26:20</a>, Codex Vaticanus and Codex Alexandrinus Samaias; Codex Sinaiticus Maseas).<P>(23) A false prophet who was upbraided by Jeremiah (<a onClick="return mV(\'Jer\',29,\'24-32\');">29:24-32</a>) for attempting to hinder his work. He is styled "the Nehelamite" and was among those carried into captivity with Jehoiachin. In opposition to Jeremiah, he predicted a speedy ending to the captivity. Jeremiah foretold the complete destruction of Shemaiah\'s family.<P>(24) Father of Delaiah, who was a prince in the reign of Zedekiah (<a onClick="return mV(\'Jer\',36,12);">Jer 36:12</a>).<P>(25) "The great," kinsman of Tobias (Tobit 5:13).``197';
