<script type="text/javascript">
isbe = [];

isbe[7901]='Shallum (2)`(shallum, shallum, "the requited one" (<a onClick="return mV(\'2Ki\',15,\'10-15\');">2Ki 15:10-15</a>)): The 15th king of Israel, and successor of Zechariah, whom he publicly assassinated in the 7th month of his reign. Nothing more is known of Shallum than that he was a son of Jabesh, which may indicate that he was a Gileadite from beyond Jordan. He is said to have made "a conspiracy" against Zechariah, so was not alone in his crime. The conspirators, however, had but a short-lived success, as, when Shallum had "reigned for the space of a month in Samaria," Menahem, then at Tirzah, one of the minor capitals of the kingdom, went up to Samaria, slew him and took his place.<P>It was probably at this time that Syria threw off the yoke of tribute to Israel (see <a href="./study/isbe/search.html?string=JEROBOAM">JEROBOAM</a>, II), as when next we meet with that kingdom, it is under its own king and in alliance with Samaria (<a onClick="return mV(\'2Ki\',16,5);">2Ki 16:5</a>).<P>The 10 years of rule given to Menahem (<a onClick="return mV(\'2Ki\',15,17);">2Ki 15:17</a>) may be taken to include the few months of military violence under Zechariah and Shallum, and cover the full years 758-750, with portions of years before and after counted as whole ones. The unsuccessful usurpation of Shallum may therefore be put in 758 BC (some date lower).``17';
isbe[7902]='Shallun`shal\'-un (shallun, not in the Septuagint): Another form of Shallum, the son of Col-hozeh. He was the ruler of the district of Mizpah. He assisted Nehemiah in building the wall of Jerusalem and in repairing the gate by the Pool of Siloah at the King\'s Gardens (<a onClick="return mV(\'Neh\',3,15);">Ne 3:15</a>).``1';
isbe[7903]='Shalmai`shal\'-mi, shal\'-ma-i: the King James Version form in <a onClick="return mV(\'Ezr\',2,46);">Ezr 2:46</a> for "Shamlai"; <a onClick="return mV(\'Neh\',7,48);">Ne 7:48</a> "<a href="./study/isbe/search.html?string=SALMAI">Salmai</a>" (which see).``1';
isbe[7904]='Shalman`shal\'-man (shalman): A name of uncertain meaning, found only once in the Old Testament (<a onClick="return mV(\'Hsa\',10,14);">Ho 10:14</a>), in connection with a place-name, equally obscure, "as Shalman destroyed Betharbel." Shalman is most commonly interpreted as a contracted form of Shalmaneser, the name of several Assyrian kings. If this explanation is correct, the king referred to cannot be identified. Some have thought of Shalmaneser IV, who is said to have undertaken expeditions against the West in 775 and in 773-772. Others have proposed Shalmaneser V, who attacked Samaria in 725. This, however, is improbable, because the activity of Hosea ceased before Shalmaneser V became king. Shalman has also been identified with Salamanu, a king of Moab in the days of Hosea, who paid tribute to Tiglath-pileser V of Assyria; and with Shalmah, a Northern Arabian tribe that invaded the Negeb. The identification of <a href="./study/isbe/search.html?string=BETH-ARBEL">BETH-ARBEL</A> (which see) is equally uncertain. From the reference it would seem that the event in question was well known and, therefore, probably one of recent date and considerable importance, but our present historical knowledge does not enable us to connect any of the persons named with the destruction of any of the localities suggested for Beth-arbel. The ancient translations offer no solution; they too seem to have been in the dark.``50';
isbe[7905]='Shalmaneser`shal-ma-ne\'-zer (shalman\'ecer; Septuagint Samennasar, Salmandsar): The name of several Assyrian kings. See <a href="./study/isbe/search.html?string=ASSYRIA">ASSYRIA</A>; <a href="./study/isbe/search.html?string=CAPTIVITY">CAPTIVITY</a>. It is Shalmaneser IV who is mentioned in the Biblical history (<a onClick="return mV(\'2Ki\',17,3);">2Ki 17:3</a>; <a onClick="return mV(\'2Ki\',18,9);">18:9</a>). He succeeded Tiglathpileser on the throne in 727 BC, but whether he was a son of his predecessor, or a usurper, is not apparent. His reign was short, and, as no annals of it have come to light, we have only the accounts contained in 2 Kings for his history. In the passages referred to above, we learn that Hoshea, king of Israel, who had become his vassal, refused to continue the payment of tribute, relying upon help from So, king of Egypt. No help, however, came from Egypt, and Hoshea had to face the chastising forces of his suzerain with his own unaided resources, the result being that he was taken prisoner outside Samaria and most likely carried away to Nineveh. The Biblical narrative goes on to say that the king of Assyria came up throughout all the land, and went up to Samaria and besieged it 3 years. There is reason to believe that, as the siege of Samaria was proceeding, Shalmaneser retired to Nineveh and died, for, when the city was taken in 722 BC, it is Sargon who claims, in his copious annals, to have captured it and carried its inhabitants into captivity. It is just possible that Shalman (<a onClick="return mV(\'Hsa\',10,14);">Ho 10:14</a>) is a contraction for Shalmaneser, but the identity of Shalman and of Beth-arbel named in the same passage is not sufficiently made out.<P>LITERATURE.<P>Schrader, COT, I, 258ff; McCurdy, HPM, I, 387ff.``128';
isbe[7906]='Shama`sha\'-ma (shama\'): One of David\'s heroes (<a onClick="return mV(\'1Ch\',11,44);">1Ch 11:44</a>).``1';
isbe[7907]='Shamai`sham\'-a-i.`<a href="./study/isbe/search.html?string=SALMAI">SALMAI</a>`1';
isbe[7908]='Shamariah`sham-a-ri\'-a, sha-mar\'-ya.`<a href="./study/isbe/search.html?string=SHEMARIAH">SHEMARIAH</a>`1';
isbe[7909]='Shambles`sham\'-b\'-lz (makellon): A slaughter-house; then a butcher\'s stall, meat-market. The word is once used in the New Testament in <a onClick="return mV(\'1Cr\',10,25);">1Co 10:25</a>.``1';
isbe[7910]='Shame`sham (bosh, "to be ashamed," bosheth, "shame," qalon; aischune, "ignominy," atimia, "dishonor," and other words): An oft-recurring word in Scripture almost uniformly bound up with a sense of sin and guilt. It is figuratively set forth as a wild beast (<a onClick="return mV(\'Jer\',3,24);">Jer 3:24</a>), a Nessus-garment (<a onClick="return mV(\'Jer\',3,25);">Jer 3:25</a>), a blight (<a onClick="return mV(\'Jer\',20,18);">Jer 20:18</a>), a sin against one\'s own soul (<a onClick="return mV(\'Hab\',2,10);">Hab 2:10</a>), and twice as the condensed symbol of Hebrew abomination—Baal (<a onClick="return mV(\'Jer\',11,13);">Jer 11:13</a> margin; <a onClick="return mV(\'Hsa\',9,10);">Ho 9:10</a> margin; see <a href="./study/isbe/search.html?string=ISH-BOSHETH">ISH-BOSHETH</a>). It is bracketed with defeat (<a onClick="return mV(\'Isa\',30,3);">Isa 30:3</a>), reproach (<a onClick="return mV(\'Psa\',69,7);">Ps 69:7</a>; <a onClick="return mV(\'Isa\',54,4);">Isa 54:4</a>; <a onClick="return mV(\'Mic\',2,6);">Mic 2:6</a>), confusion (<a onClick="return mV(\'Isa\',6,7);">Isa 6:7</a>), nakedness (<a onClick="return mV(\'Isa\',47,3);">Isa 47:3</a>; <a onClick="return mV(\'Mic\',1,11);">Mic 1:11</a>), everlasting contempt (<a onClick="return mV(\'Dan\',12,2);">Da 12:2</a>), folly (<a onClick="return mV(\'Pro\',18,13);">Pr 18:13</a>), cruelty (<a onClick="return mV(\'Isa\',50,6);">Isa 50:6</a>; <a onClick="return mV(\'Hbr\',12,2);">Heb 12:2</a>), poverty (<a onClick="return mV(\'Pro\',13,18);">Pr 13:18</a>), nothingness (<a onClick="return mV(\'Pro\',9,7);">Pr 9:7</a> the King James Version), unseemliness (<a onClick="return mV(\'1Cr\',11,6);">1Co 11:6</a>; <a onClick="return mV(\'1Cr\',14,35);">14:35</a> the King James Version; <a onClick="return mV(\'Eph\',5,12);">Eph 5:12</a>), and "them that go down to the pit" (<a onClick="return mV(\'Eze\',32,25);">Eze 32:25</a>). In the first Biblical reference to this emotion, "shame" appears as "the correlative of sin and guilt" (Delitzsch, New Commentary on Genesis and Biblical Psychology). Shamelessness is characteristic of abandoned wickedness (<a onClick="return mV(\'Phl\',3,19);">Php 3:19</a>; <a onClick="return mV(\'Jud\',1,13);">Jude 1:13</a>, margin "Greek: \'shames\'"). Manifestly, then, shame is a concomitant of the divine judgment upon sin; the very worst that a Hebrew could wish for an enemy was that he might be clothed with shame (<a onClick="return mV(\'Psa\',109,29);">Ps 109:29</a>), that the judgment of God might rest upon him visibly.<P>Naturally, to the Hebrew, shame was the portion of those who were idolaters, who were faithless to Yahweh or who were unfriendly to themselves—the elect people of Yahweh. Shame is to come upon Moab because Moab held Israel in derision (<a onClick="return mV(\'Jer\',48,39);">Jer 48:39</a>, <a onClick="return mV(\'Jer\',48,27);">27</a>), and upon Edom "for violence against his brother Jacob" (<a onClick="return mV(\'Oba\',1,10);">Ob 1:10</a>). But also, and impartially, shame is the portion of faithless Israelites who deny Yahweh and follow after strange gods (<a onClick="return mV(\'Eze\',7,18);">Eze 7:18</a>; <a onClick="return mV(\'Mic\',7,10);">Mic 7:10</a>; <a onClick="return mV(\'Hsa\',10,6);">Ho 10:6</a>, and often). But shame, too, comes upon those who exalt themselves against God, who trust in earthly power and the show of material strength (<a onClick="return mV(\'2Ch\',32,21);">2Ch 32:21</a>; <a onClick="return mV(\'Isa\',30,3);">Isa 30:3</a>); and upon those who make a mock of righteousness (<a onClick="return mV(\'Job\',8,22);">Job 8:22</a>; <a onClick="return mV(\'Psa\',35,26);">Ps 35:26</a>; <a onClick="return mV(\'Psa\',132,18);">132:18</a>). With a fine sense of ethical distinctions the Biblical writers recognize that in confessing to a sense of shame there is hope for better things. Only in the most desperate cases is there no sense of shame (<a onClick="return mV(\'Hsa\',4,18);">Ho 4:18</a>; <a onClick="return mV(\'Zep\',3,5);">Ze 3:5</a>; <a onClick="return mV(\'Phl\',3,19);">Php 3:19</a>; <a onClick="return mV(\'Jud\',1,13);">Jude 1:13</a>); in pardon God is said to remove shame (<a onClick="return mV(\'Isa\',54,4);">Isa 54:4</a> twice; <a onClick="return mV(\'Isa\',61,7);">Isa 61:7</a>).<P>On conditions beyond the grave the Biblical revelation is exceedingly reticent, but here and there are hints that shame waits upon the wicked here and hereafter. Such an expression as that in Daniel (<a onClick="return mV(\'Dan\',12,2);">12:2</a>) cannot be ignored, and though the writing itself may belong to a late period and a somewhat sophisticated theological development, the idea is but a reflection of the earlier and more elementary period, when the voice of crime and cruelty went up from earth to be heard in the audience chamber of God (<a onClick="return mV(\'Gen\',4,11);">Ge 4:11</a>; <a onClick="return mV(\'Gen\',6,13);">6:13</a>). In the New Testament there is similar reticence but also similar implications. It cannot be much amiss to say that in the mind of the Biblical writers sin was a shameful thing; that part of the punishment for sin was a consciousness of guilt in the sense of shame; and that from this consciousness of guilt there was no deliverance while the sin was unconfessed and unforgiven. "Many of them that sleep in the dust of the earth shall awake, some to everlasting life and some to shame and everlasting contempt." From one\'s own past there is no deliverance, save through contrition of spirit and the grace and forgiveness of God. While the sense of shame persists, or, in other words, while the moral constitution of man\'s nature remains as it is, there will never be wanting an avenger of sin.``168';
isbe[7911]='Shamed`sha\'-med.`<a href="./study/isbe/search.html?string=SHEMED">SHEMED</a>`1';
isbe[7912]='Shamefacedness`sham\'-fast-nes, sham-fas\'-ed-nes.`<a href="./study/isbe/search.html?string=SHAMEFASTNESS">SHAMEFASTNESS</a>`1';
isbe[7913]='Shamefastness`sham\'-fast-nes: The original the King James Version translation of aidos, in Sirach 41:16 and <a onClick="return mV(\'1Ti\',2,9);">1Ti 2:9</a>. Perhaps half a century later the spelling "shamefacedness" supplanted the better form, and continues in the ordinary editions of the King James Version. The Revised Version (British and American), however, rightly restores "shamefastness."``1';
isbe[7914]='Shamer`sha\'-mer.`<a href="./study/isbe/search.html?string=SHEMER">SHEMER</a>`1';
isbe[7915]='Shamgar`sham\'-gar (shamgar):<P>1. Biblical Account:<P>One of the judges, son of Anath (\'anath), in whose days, which preceded the time of Deborah (<a onClick="return mV(\'Jdg\',5,6,7);">Jud 5:6,7</a>) and followed those of Ehud, Israel\'s subjugation was so complete that "the highways were unoccupied, and the travelers walked through byways." The government had become thoroughly disorganized, and apparently, as in the days of Deborah, the people were entirely unprepared for war. Shamgar\'s improvised weapon with which he helped to "save Israel" is spoken of as an oxgoad. With this he smote of the Philistines 600 men. This is the first mention of the Philistines as troublesome neighbors of the Israelites (<a onClick="return mV(\'Jdg\',3,31);">Jud 3:31</a>). According to a tradition represented in Josephus (Ant., V, iv, 3), Shamgar died in the year he became judge.<P>2. Critical Hypotheses:<P>Several writers have challenged the Biblical account on the following grounds: that in <a onClick="return mV(\'Jdg\',5,\'1-\');">Jud 5</a> no mention is made of any deliverance; that the name "Shamgar" resembles the name of a Hittite king and the name "Anath" that of a Syrian goddess; that the deed recorded in <a onClick="return mV(\'Jdg\',3,31);">Jud 3:31</a> is analogous to that of Samson (<a onClick="return mV(\'Jdg\',15,15);">Jud 15:15</a>), and that of Shammah, son of Agee (<a onClick="return mV(\'2Sa\',23,11);">2Sa 23:11</a>f); and lastly, that in a group of Greek manuscripts and other versions this verse is inserted after the account of Samson\'s exploits. None of these is necessarily inconsistent with the traditional account. Neverthelesss, they have been used as a basis not only for overthrowing the tradition, but also for constructive theories such as that which makes Shamgar a foreign oppressor and not a judge, and even the father of Sisera. There is, of course, no limit to which this kind of interesting speculation cannot lead.<P>(For a complete account of these views see Moore, "Judges," in ICC, 1895, 104f; and same author in Journal of the American Oriental Society, XIX, 2, 159-60.)``80';
isbe[7916]='Shamhuth`sham\'-huth.`<a href="./study/isbe/search.html?string=SHAMMUAH">SHAMMUAH</a>`1';
isbe[7917]='Shamir (1)`sha\'-mer (shamir; Sameir):<P>(1) Mentioned along with Jattir and Socoh (<a onClick="return mV(\'Jos\',15,48);">Jos 15:48</a>) as one of the cities of Judah in the hill country. Possibly it is Khirbet (or Umm) Somerah, 2,000 ft. above sea-level, a site with ancient walls, caves, cisterns and tombs not far west of Debir (edh Dhatheriyeh) and 2 miles north of Anab (\'Anab) (Palestine Exploration Fund, III,262,286, Sh XX).<P>(2) A place in the hill country of Ephraim (<a onClick="return mV(\'Jdg\',10,1);">Jud 10:1</a>) from which came "Tola, the son of Pual, a man of Issachar," who judged Israel 23 years; he died and was buried there. It is an attractive theory (Schwartz) which would identify the place with the semi-fortified and strongly-placed town of Sanur on the road from Nablus to Jenin. A local chieftain in the early part of the last century fortified Sanur and from there dominated the whole district. That Sanur could hardly have been within the bounds of Issachar is an objection, but not necessarily a fatal one. It is noticeable that the Septuagint\'s Codex Alexandrinus has Samareia, for Shamir (Palestine Exploration Fund, II, Sh XI).``117';
isbe[7918]='Shamir (2)`(shamir; Samer): A Kohathite, son of Micah (<a onClick="return mV(\'1Ch\',24,24);">1Ch 24:24</a>).``1';
isbe[7919]='Shamlai`sham\'-la-i, sham\'-li.`<a href="./study/isbe/search.html?string=SALMAI">SALMAI</a>`1';
isbe[7920]='Shamma`sham\'-a (shamma\'; Codex Vaticanus Sema; Codex Alexandrinus Samma): An Asherite (<a onClick="return mV(\'1Ch\',7,37);">1Ch 7:37</a>).``1';
isbe[7921]='Shammah`sham\'-a (shammah):<P>(1) The son of Reuel, the son of Esau, a tribal chief of Edom (<a onClick="return mV(\'Gen\',36,13,17);">Ge 36:13,17</a>; <a onClick="return mV(\'1Ch\',1,37);">1Ch 1:37</a>, Somé).<P>(2) The third son of Jesse and brother of David. Together with his two other brothers he fought under Saul in the campaign against the Philistines and was with the army in the valley of Elah when David slew Goliath (<a onClick="return mV(\'1Sa\',17,13);">1Sa 17:13</a>). One redactor states that he was a witness of the anointing of David by Samuel (<a onClick="return mV(\'1Sa\',16,\'1-13\');">1Sa 16:1-13</a>). He was the father of Jonadab, the friend of Amnon (<a onClick="return mV(\'2Sa\',13,3);">2Sa 13:3</a>), and that Jonathan whose victory over a Philistine giant is narrated in <a onClick="return mV(\'2Sa\',21,20);">2Sa 21:20</a>ff was also his son. His name is rendered as "Shammah" (<a onClick="return mV(\'1Sa\',16,9);">1Sa 16:9</a>; <a onClick="return mV(\'1Sa\',17,13);">17:13</a>), "Shimeah" (<a onClick="return mV(\'2Sa\',13,3,12);">2Sa 13:3,12</a>), "Shimei" (<a onClick="return mV(\'2Sa\',21,21);">2Sa 21:21</a>), and "Shimea" (<a onClick="return mV(\'1Ch\',2,13);">1Ch 2:13</a>; <a onClick="return mV(\'1Ch\',20,7);">20:7</a>).<P>(3) The son of Agee, a Hararite, one of the "three mighty men" of David (<a onClick="return mV(\'2Sa\',23,11);">2Sa 23:11</a>, Septuagint Samaia), who held the field against the Philistines. The parallel passage (<a onClick="return mV(\'1Ch\',11,10);">1Ch 11:10</a>) ascribes this deed to Eleazar, the son of Dodo. The succeeding incident (<a onClick="return mV(\'2Sa\',23,13);">2Sa 23:13</a>), namely, the famous act of three of David\'s heroes who risked their lives to bring their leader water from the well of Bethlehem, has frequently been credited to Shammah and two other members of "the three"; but the three warriors are plainly said (<a onClick="return mV(\'2Sa\',23,13);">2Sa 23:13</a>) to belong to "the thirty"; <a onClick="return mV(\'2Sa\',23,33);">2Sa 23:33</a> should read "Jonathan, son of Shammah, the Hararite." Jonathan, one of David\'s "thirty," was a son of Shammah; the word "son" has been accidentally omitted (Driver, Budde, Kittel, etc.). The parallel passage (<a onClick="return mV(\'1Ch\',11,34);">1Ch 11:34</a>) has "son of Shagee," which is probably, a misreading for "son of Agee." Lucian\'s version, "son of Shammah," is most plausible. "Shimei the son of Ela" (<a onClick="return mV(\'1Ki\',4,18);">1Ki 4:18</a>) should also appear in this passage if Lucian\'s reading of "Ela" for "Agee" (<a onClick="return mV(\'2Sa\',23,11);">2Sa 23:11</a>) be correct.<P>(4) A Harodite (<a onClick="return mV(\'2Sa\',23,25,33);">2Sa 23:25,33</a>), i.e. probably a native of \'Ain-charod (\'Ain Jalud, <a onClick="return mV(\'Jdg\',7,1);">Jud 7:1</a>; see <a href="./study/isbe/search.html?string=HAROD">HAROD</A>). One of "the thirty" and captain of Solomon\'s 5th monthly course. In the parallel lists (<a onClick="return mV(\'1Ch\',11,27);">1Ch 11:27</a>) he is called "the Harorite" (this last being a scribal error for Harodite) and "Shamhuth the Izrahate" (<a onClick="return mV(\'1Ch\',27,8);">1Ch 27:8</a>).``197';
isbe[7922]='Shammai`sham\'a-i, sham\'-i (shammay):<P>(1) A Jerahmeelite (<a onClick="return mV(\'1Ch\',2,28,32);">1Ch 2:28,32</a>).<P>(2) The son of Rekem and father of Maon (<a onClick="return mV(\'1Ch\',2,44);">1Ch 2:44</a>).<P>(3) A Judahite (<a onClick="return mV(\'1Ch\',4,17);">1Ch 4:17</a>).``1';
isbe[7923]='Shammoth`sham\'-oth, sham\'-oth.<P>See <a href="./study/isbe/search.html?string=SHAMMAH">SHAMMAH, (4)</A>.``1';
isbe[7924]='Shammua; Shammuah`sha-mu\'-a, sham\'-u-a (shammua\'):<P>(1) The Reubenite spy (<a onClick="return mV(\'Num\',13,4);">Nu 13:4</a>, Samouel, and other forms).<P>(2) One of David\'s sons (<a onClick="return mV(\'2Sa\',5,14);">2Sa 5:14</a>; <a onClick="return mV(\'1Ch\',14,4);">1Ch 14:4</a>, Sammous). In <a onClick="return mV(\'1Ch\',3,5);">1Ch 3:5</a> he is called "Shimea."<P>(3) A Levite (<a onClick="return mV(\'Neh\',11,17);">Ne 11:17</a>); he is called "Shemaiah" in <a onClick="return mV(\'1Ch\',9,16);">1Ch 9:16</a>.<p>(4) The head of a priestly family (<a onClick="return mV(\'Neh\',12,18);">Ne 12:18</a>); a contemporary of Joiakim.``1';
isbe[7925]='Shamsherai`sham\'-she-ri, sham-she-ra\'-i (shamsheray): A Benjamite (<a onClick="return mV(\'1Ch\',8,26);">1Ch 8:26</a>).``1';
isbe[7926]='Shape`shap: In the King James Version the translation of eidos, "form," "appearance" (<a onClick="return mV(\'Luk\',3,22);">Lu 3:22</a>; <a onClick="return mV(\'Jhn\',5,37);">Joh 5:37</a>), and of homoioma, "likeness," "resemblance" (<a onClick="return mV(\'Rev\',9,7);">Re 9:7</a>). The meaning of these words is not so much "tangible shape," in which sense we use the word in modern English, but rather "aspect," "appearance," the looks of a thing or a person. This is even the case where the word is joined with the adjective somatikos, "bodily" as in the passage <a onClick="return mV(\'Luk\',3,22);">Lu 3:22</a>, "The Holy Spirit descended in a bodily form (i.e. "in a corporeal appearance," the King James Version "in a bodily shape"), as a dove, upon him." The second passage also refers to the "appearance" of God, and cannot therefore be regarded as material shape: "Ye have neither heard his voice at any time, nor seen his form" (the King James Version "shape") (<a onClick="return mV(\'Jhn\',5,37);">Joh 5:37</a>). As has been seen from the above quotations, the Revised Version (British and American) which retains the translation "shape" for homoioma, has translated eidos with "form," which also serves to render several other Greek synonyms, such as morphe (<a onClick="return mV(\'Mar\',16,12);">Mr 16:12</a>; <a onClick="return mV(\'Phl\',2,6);">Php 2:6</a>f), morphosis (<a onClick="return mV(\'Rom\',2,20);">Ro 2:20</a>; <a onClick="return mV(\'2Ti\',3,5);">2Ti 3:5</a>), tupos (the Revised Version margin "pattern" <a onClick="return mV(\'Rom\',6,17);">Ro 6:17</a>), and hupotuposis (the Revised Version (British and American) "pattern," <a onClick="return mV(\'2Ti\',1,13);">2Ti 1:13</a>). In the King James Version <span class="noTag">The Wisdom of Solomon 18:1</span> "shape" translates morphe, the Revised Version (British and American) "form."``106';
isbe[7927]='Shapham`sha\'-fam (shapham; Sapham, Sabat): Name of a Gadite chief, who had the second place in command of his tribe (<a onClick="return mV(\'1Ch\',5,12);">1Ch 5:12</a>). So far as the fragmentary genealogies are intelligible, they seem to indicate that Shap-ham and his chief, Joel, lived in the time of Saul and shared in the war against the Hagrites (<a onClick="return mV(\'1Ch\',5,\'7-10\',\'18-22\');">1Ch 5:7-10,18-22</a>), but it is to be noted that these lists were first recorded between the years 750 and 740 BC, just before the eastern tribes were carried into captivity.``1';
isbe[7928]='Shaphan`sha\'-fan (shaphan, "rockbadger," English Versions of the Bible "coney"; Saphphan): An old totem clan name (so W.R. Smith; compare, however, the article <a href="./study/isbe/search.html?string=TOTEMISM">TOTEMISM</a>; Gray, Gray, Studies in Hebrew Proper Names, 103ff, and Jacob\'s Studies in Biblical Archaeology, 84ff).<P>(1) Son of Azaliah and scribe of King Josiah. He received from Hilkiah the Book of the Law which had been found in the Temple (<a onClick="return mV(\'2Ki\',22,3);">2Ki 22:3</a>ff; <a onClick="return mV(\'2Ch\',34,\'8-28\');">2Ch 34:8-28</a>). It was from Shaphan\'s lips that Josiah heard the Law read. Shaphan was also one of those sent by the king to the prophetess Huldah (<a onClick="return mV(\'2Ki\',22,\'1-\');">2Ki 22</a>; <a onClick="return mV(\'2Ch\',34,\'1-\');">2Ch 34</a>). He was undoubtedly one of the staunchest supporters of Josiah in his work of reform. He was the father of Ahikam (<a onClick="return mV(\'2Ki\',22,12);">2Ki 22:12</a>; <a onClick="return mV(\'2Ch\',34,20);">2Ch 34:20</a>; <a onClick="return mV(\'Jer\',26,24);">Jer 26:24</a>), who befriended and protected the prophet Jeremiah. Another son, Elasah, was one of the two men entrusted by Jeremiah with his letter to the captives in Babylon (<a onClick="return mV(\'Jer\',29,3);">Jer 29:3</a>). A third son, Gemariah, vainly tried to prevent King Jehoiakim from burning "the roll" (<a onClick="return mV(\'Jer\',36,10,11,12,25);">Jer 36:10,11,12,25</a>). The Micaiah of <a onClick="return mV(\'Jer\',36,11,12);">Jer 36:11,12</a>, and Gedaliah, the governor of Judea after the captivity of 586 BC, were his grandsons (<a onClick="return mV(\'Jer\',39,14);">Jer 39:14</a>).<P>(2) Perhaps the father of Jaazaniah, one of the 70 men whom Ezekiel saw, in his vision of the Temple, sacrificing to idols (<a onClick="return mV(\'Eze\',8,11);">Eze 8:11</a>).``197';
isbe[7929]='Shaphat`sha\'-fat (shaphat):iah, one of the 70 men whom Ezekiel saw, in his vision of the Temple, sacrificing to idols (<a onClick="return mV(\'Eze\',8,11);">Eze 8:11</a>).<P>(1) The Simeonite spy (<a onClick="return mV(\'Num\',13,5);">Nu 13:5</a>, Saphat).<P>(2) The father of the prophet Elisha (<a onClick="return mV(\'1Ki\',19,16);">1Ki 19:16</a>; <a onClick="return mV(\'2Ki\',3,11);">2Ki 3:11</a>, Septuagint Saphath).<P>(3) A name in the royal genealogy of Judah (<a onClick="return mV(\'1Ch\',3,22);">1Ch 3:22</a>).<P>(4) A Gadite (<a onClick="return mV(\'1Ch\',5,12);">1Ch 5:12</a>).<P>(5) One of David\'s herdsmen (<a onClick="return mV(\'1Ch\',27,29);">1Ch 27:29</a>).``1';
isbe[7930]='Shapher`sha\'-fer.`<a href="./study/isbe/search.html?string=SHEPHER">SHEPHER</a>`1';
isbe[7931]='Shaphir`sha\'-fer (shaphir, "glittering"; kalos; the King James Version Saphir): One of a group of towns mentioned in <a onClick="return mV(\'Mic\',1,\'10-15\');">Mic 1:10-15</a>. From the association with Gath, Achzib (of Judah) and Mareshah, it would seem that the places mentioned were in Southwestern Palestine. According to Eusebius, in Onomasticon, there was a Sapheir, "in the hill country" (from a confusion with Shamir (<a onClick="return mV(\'Jos\',15,48);">Jos 15:48</a>), where Septuagint A has Sapheir) between Eleutheropolis and Ascalon. The name probably survives in that of three villages called es-Suafir, in the plain, some 3 1/2 miles southeast of Ashdod (PEF, II, 413, Sh XV). Cheyne (EB, col. 4282) suggests the white "glittering" hill Tell ec-Cafi, at the entrance to the Wady ec-Sunt, which was known to the Crusaders as Blanchegarde, but this site seems a more probable one for <a href="./study/isbe/search.html?string=GATH">GATH</A> (which see).``117';
isbe[7932]='Sharai`sha-ra\'-i, sha\'-ri (sharay): One of the sons of Bani who had married foreign wives (<a onClick="return mV(\'Ezr\',10,40);">Ezr 10:40</a>).``1';
isbe[7933]='Sharaim`sha-ra\'-im.`<a href="./study/isbe/search.html?string=SHAARAIM">SHAARAIM</a>`1';
isbe[7934]='Sharar`sha\'-rar.`<a href="./study/isbe/search.html?string=SACAR">SACAR</a>`1';
isbe[7935]='Share`shar.`<a href="./study/isbe/search.html?string=PLOW">PLOW</a>`1';
isbe[7936]='Sharezer`sha-re\'zer (sar\'etser, shar\'etser): Corresponds to the Assyrian Shar-ucur, "protect the king"; found otherwise, not as a complete name, but as elements in personal names, e.g. Bel-shar-ucur, "may Bel protect the king," which is the equivalent of Belshazzar (<a onClick="return mV(\'Dan\',5,1);">Da 5:1</a>). The name is borne by two persons in the Old Testament:<P>(1) The son of Sennacherib, king of Assyria, who with <a href="./study/isbe/search.html?string=ADRAMMELECH">ADRAMMELECH</a> (which see) murdered his father (<a onClick="return mV(\'2Ki\',19,37);">2Ki 19:37</a>; <a onClick="return mV(\'Isa\',37,38);">Isa 37:38</a>). The Babylonian Chronicle says concerning Sennacherib\'s death: "On the 20th day of Tebet Sennacherib, king of Assyria, was slain by his son in a revolt." This differs from the Old Testament account in that it speaks of only one murderer, and does not give his name. How the two accounts can be harmonized is still uncertain. Hitzig, (Kritik, 194ff), following Abydenus, as quoted by Eusebius, completed the name of Sennacherib\'s son, so as to read Nergal-sharezer = Nergal-shar-ucur (<a onClick="return mV(\'Jer\',39,3,13);">Jer 39:3,13</a>), and this is accepted by many modern scholars. Johns thinks that Sharezer (shar\'etser or sar\'etser) may be a corruption from Shar-etir-Ashur, the name of a son of Sennacherib (1-vol HDB, under the word). The question cannot be definitely settled.<P>(2) A contemporary of the prophet Zechariah, mentioned in connection with the sending of a delegation to the spiritual heads of the community to inquire concerning the propriety of continuing the fasts: "They of Beth-el had sent Sharezer and Regem-melech" (<a onClick="return mV(\'Zec\',7,2);">Zec 7:2</a>). This translation creates a difficulty in connection with the succeeding words, literally, "and his men." The Revisers place in the margin as an alternative rendering, "They of Beth-el, even Sharezer...had sent." Sharezer sounds peculiar in apposition to "they of Beth-el"; hence, some have thought, especially since Sharezer seems incomplete, that in the two words Beth-el and Sharezer we have a corruption of what was originally a single proper name, perhaps Bel-sharezer = Bel-shar-ucur = Bel-shazzar. The present text, no matter how translated, presents difficulties.`<a href="./study/isbe/search.html?string=REGEM-MELECH">REGEM-MELECH</a>`50';
isbe[7937]='Sharon`shar\'-un (ha-sharon, with the definite article possibly meaning "the plain"; to pedion, ho drumos, ho Saron):<P>(1) This name is attached to the strip of fairly level land which runs between the mountains and the shore of the Mediterranean, stretching from Nahr Ruben in the south to Mt. Carmel in the north. There are considerable rolling hills; but, compared with the mountains to the east, it is quite properly described as a plain. The soil is a deep rich loam, which is favorable to the growth of cereals. The orange, the vine and the olive grow to great perfection. When the many-colored flowers are in bloom it is a scene of rare beauty.<P>Of the streams in the plain four carry the bulk of the water from the western slopes of the mountains to the sea. They are also perennial, being fed by fountains. Nahr el-\'Aujeh enters the sea to the north of Jaffa; Nahr Iskanderuneh 7 miles, and Nahr el-Mefjir fully 2 miles south of Caesarea; and Nahr ez-Zerqa, the "Crocodile River," 2 1/2 miles north of Caesarea. Nahr el-Falik runs its short course about 12 miles north of Nahr el-\'Aujeh. Water is plentiful, and at almost any point it may be obtained by digging. Deep, finely built wells near some of the villages are among the most precious legacies left by the Crusaders. The breadth of the plain varies from 8 to 12 miles, being broadest in the Sharon. There are traces of a great forest in the northern part, which accounts for the use of the term drumos. Josephus (Ant., XIV, xiii, 3) speaks of "the woods" (hoi drumoi) and Strabo (xvi) of "a great wood." There is still a considerable oak wood in this district. The "excellency" of Carmel and Sharon (<a onClick="return mV(\'Isa\',35,2);">Isa 35:2</a>) is probably an allusion to the luxuriant oak forests. As in ancient times, great breadths are given up to the pasturing of cattle. Over David\'s herds that fed in Sharon was Shitrai the Sharonite (<a onClick="return mV(\'1Ch\',27,29);">1Ch 27:29</a>). In the day of Israel\'s restoration "Sharon shall be a fold of flocks" (<a onClick="return mV(\'Isa\',65,10);">Isa 65:10</a>). Jerome speaks of the fine cattle fed in the pastures of Sharon, and also sings the praises of its wine (Comm. on <a onClick="return mV(\'Isa\',33,\'1-\');">Isa 33</a> and <a onClick="return mV(\'Isa\',65,\'1-\');">65</A>). Toward the Sharon no doubt there was more cultivation then than there is at the present day. The German colony to the north of Jaffa, preserving in its name, Sarona, the old Greek name of the plain, and several Jewish colonies are proving the wonderful productiveness of the soil. The orange groves of Jaffa are far-famed.<P>"The rose of Sharon" (<a onClick="return mV(\'Sgs\',2,1);">So 2:1</a>) is a mistranslation: chabhatstseleth is not a "rose," but the white narcissus, which in season abounds in the plain.<P>Sharon is mentioned in the New Testament only in <a onClick="return mV(\'Act\',9,35);">Ac 9:35</a>.<P>(2) A district east of the Jordan, occupied by the tribe of Gad (<a onClick="return mV(\'1Ch\',5,16);">1Ch 5:16</a>; here the name is without the article). Kittel ("Chronicles," SBOT) suggests that this is a corruption from "Sirion," which again is synonymous with Hermon. He would therefore identify Sharon with the pasture lands of Hermon. Others think that the mishor or table-land of Gilead is intended.<P>(3) In <a onClick="return mV(\'Jos\',12,18);">Jos 12:18</a> we should perhaps read "the king of Aphek in Sharon." See <a href="./study/isbe/search.html?string=LASSHARON">LASSHARON</A>. The order seems to point to some place northeast of Tabor. Perhaps this is to be identified with the Sarona of Eusebius, Onomasticon, in the district between Tabor and Tiberias. If so, the name may be preserved in that of Sarona on the plateau to the southwest of Tiberias.``54';
isbe[7938]='Sharonite`shar\'-un-it (ha-sharoni; ho Saroneites): Applied in Scripture only to Shitrai (<a onClick="return mV(\'1Ch\',27,29);">1Ch 27:29</a>).`<a href="./study/isbe/search.html?string=SHARON">SHARON</a>`1';
isbe[7939]='Sharuhen`sha-roo\'-hen (sharuchen; hoi agroi auton): One of the cities in the territory of Judah assigned to Simeon (<a onClick="return mV(\'Jos\',19,6);">Jos 19:6</a>). In <a onClick="return mV(\'Jos\',15,32);">Jos 15:32</a> it is called "Shilhim," and in <a onClick="return mV(\'1Ch\',4,31);">1Ch 4:31</a>, "<a href="./study/isbe/search.html?string=SHAARAIM">Shaaraim</a>" (which see).``1';
isbe[7940]='Shashai`sha\'-shi (shashay; Sesei): One of the sons of Bani who had married foreign wives (<a onClick="return mV(\'Ezr\',10,40);">Ezr 10:40</a>) = "Sesis" in 1Esdras 9:34.``1';
isbe[7941]='Shashak`sha\'-shak (shashak): Eponym of a Benjamite family (<a onClick="return mV(\'1Ch\',8,14,25);">1Ch 8:14,25</a>).``1';
isbe[7942]='Shaul; Shaulites`sha\'-ul, sha\'-ul-its (sha\'ul; Saoul):<P>(1) A king of Edom (<a onClick="return mV(\'Gen\',36,37);">Ge 36:37</a> = <a onClick="return mV(\'1Ch\',1,48);">1Ch 1:48</a>).<P>(2) A son of Simeon (<a onClick="return mV(\'Gen\',46,10);">Ge 46:10</a>; <a onClick="return mV(\'Exd\',6,15);">Ex 6:15</a>; <a onClick="return mV(\'Num\',26,13);">Nu 26:13</a>; <a onClick="return mV(\'1Ch\',4,24);">1Ch 4:24</a>). The clan was of notoriously impure stock, and, therefore, Shaul is called "the son of a Canaanitish woman" (<a onClick="return mV(\'Gen\',46,10);">Ge 46:10</a>; <a onClick="return mV(\'Exd\',6,15);">Ex 6:15</a>); the clan was of mixed Israelite and Canaanitish descent. The patronymic Shaulites is found in <a onClick="return mV(\'Num\',26,13);">Nu 26:13</a>.<P>(3) An ancestor of Samuel (<a onClick="return mV(\'1Ch\',6,24);">1Ch 6:24 (Hebrew 9)</a>); in <a onClick="return mV(\'1Ch\',6,36);">1Ch 6:36</a> he is called "Joel."``1';
isbe[7943]='Shaveh, Vale of`sha\'-ve (\'emeq shaweh).`<a href="./study/isbe/search.html?string=KING\'s+vale">KING\'S VALE</a>`1';
isbe[7944]='Shaveh-Kiriathaim`sha\'-ve-kir-ya-tha\'-im (shaweh qiryathayim; en Saue te polei): Here Chedorlaomer is said to have defeated the Emim (<a onClick="return mV(\'Gen\',14,5);">Ge 14:5</a>). the Revised Version margin reads "the plain of Kiriathaim." If this rendering is right, we must look for the place in the neighborhood of Kiriathaim of Moab (<a onClick="return mV(\'Jer\',48,1);">Jer 48:1</a>, etc.), which is probably represented today by el-Qareiyat, about 7 miles to the north of Dibon.``1';
isbe[7945]='Shaving`shav\'-ing (in <a onClick="return mV(\'Job\',1,20);">Job 1:20</a>, gazaz, usually galach; in <a onClick="return mV(\'Act\',21,24);">Ac 21:24</a>, xurao): Customs as to shaving differ in different countries, and in ancient and modern times. Among the Egyptians it was customary to shave the whole body (compare <a onClick="return mV(\'Gen\',41,14);">Ge 41:14</a>). With the Israelites, shaving the head was a sign of mourning (<a onClick="return mV(\'Deu\',21,12);">De 21:12</a>; <a onClick="return mV(\'Job\',1,20);">Job 1:20</a>); ordinarily the hair was allowed to grow long, and was only cut at intervals (compare Absalom, <a onClick="return mV(\'2Sa\',14,26);">2Sa 14:26</a>). Nazirites were forbidden to use a razor, but when their vow was expired, or if they were defiled, they were to shave the whole head (<a onClick="return mV(\'Num\',6,5,9,18);">Nu 6:5,9,18</a>; compare <a onClick="return mV(\'Act\',21,24);">Ac 21:24</a>). The shaving of the beard was not permitted to the Israelites; they were prohibited from shaving off even "the corner of their beard" (<a onClick="return mV(\'Lev\',21,5);">Le 21:5</a>). It was an unpardonable insult when Hanun, king of the Ammonites, cut off the half of the beards of the Israelites whom David had sent to him (<a onClick="return mV(\'2Sa\',10,4);">2Sa 10:4</a>; <a onClick="return mV(\'1Ch\',19,4);">1Ch 19:4</a>).<P>Shaving "with a razor that is hired" is Isaiah\'s graphic figure to denote the complete devastation of Judah by the Assyrian army (<a onClick="return mV(\'Isa\',7,20);">Isa 7:20</a>).``132';
isbe[7946]='Shavsha`shav\'-sha (shawsha\'; in <a onClick="return mV(\'2Sa\',20,25);">2Sa 20:25</a>, Kethibh, sheya\', Kere, shewa\', English Versions of the Bible "Sheva," are refuted by the Septuagint; in <a onClick="return mV(\'2Sa\',8,\'15-18\');">2Sa 8:15-18</a>, in other respects identical with Chronicles, "Seraiah" is found; the Septuagint varies greatly in all passages; it is the general consensus that Shavsha is correct): State secretary or scribe during the reign of David (<a onClick="return mV(\'1Ch\',18,16);">1Ch 18:16</a>; <a onClick="return mV(\'2Sa\',20,25);">2Sa 20:25</a>). He was the first occupant of this office, which was created by David. It is significant that his father\'s name is omitted in the very exact list of David\'s officers of state (<a onClick="return mV(\'1Ch\',18,\'14-17\');">1Ch 18:14-17</a> parallel <a onClick="return mV(\'2Sa\',8,\'15-18\');">2Sa 8:15-18</a>); this fact, coupled with the foreign sound of his name, points to his being an "alien"; the assumption that the state secretary handled correspondence with other countries may explain David\'s choice of a foreigner for this post. Shavsha\'s two sons, Elihoreph and Ahijah, were secretaries of state under Solomon; they are called "sons of Shisha" (<a onClick="return mV(\'1Ki\',4,3);">1Ki 4:3</a>), "Shisha" probably being a variant of "Shavsha."``197';
isbe[7947]='Shawl`shol: the Revised Version (British and American) substitutes "shawls" for the King James Version "wimples" in <a onClick="return mV(\'Isa\',3,22);">Isa 3:22</a>.`<a href="./study/isbe/search.html?string=DRESS">DRESS</a>`1';
isbe[7948]='Sheaf; Sheaves`shef, shevz (\'alummah, \'omer, \'amir): When the grain is reaped, it is laid in handfuls back of the reaper to be gathered by children or those who cannot stand the harder work of reaping (<a onClick="return mV(\'Psa\',129,7);">Ps 129:7</a>). The handfuls are bound into large sheaves, two of which are laden at a time on a donkey (compare <a onClick="return mV(\'Neh\',13,15);">Ne 13:15</a>). In some districts carts are used (compare <a onClick="return mV(\'Amo\',2,13);">Am 2:13</a>). The sheaves are piled about the threshing-floors until threshing time, which may be several weeks after harvest. It is an impressive sight to see the huge stacks of sheaves piled about the threshing-floors, the piles often covering an area greater than the nearby villages (see <a href="./study/isbe/search.html?string=AGRICULTURE">AGRICULTURE</A>). The ancient Egyptians bound their grain into small sheaves, forming the bundles with care so that the heads were equally distributed between the two ends (see Wilkinson, Ancient Egyptians,1878, II, 424; compare Joseph\'s dream, <a onClick="return mV(\'Gen\',37,\'5-8\');">Ge 37:5-8</a>). The sheaves mentioned in <a onClick="return mV(\'Gen\',37,\'10-12\',15);">Ge 37:10-12,15</a> must have been handfuls. It is a custom in parts of Syria for the gatherers of the sheaves to run toward a passing horseman and wave a handful of grain, shouting kemshi, kemshi (literally, "handful"). They want the horseman to feed the grain to his horse. In Old Testament times forgotten sheaves had to be left for the sojourner (<a onClick="return mV(\'Deu\',24,19);">De 24:19</a>); compare the kindness shown to Ruth by the reapers of Boaz (<a onClick="return mV(\'Rth\',2,7,15);">Ru 2:7,15</a>).<P>Figurative: "Being hungry they carry the sheaves" is a picture of torment similar to that of the hungry horse urged to go by the bundle of hay tied before him (<a onClick="return mV(\'Job\',24,10);">Job 24:10</a>). The joyful sight of the sheaves of an abundant harvest was used by the Psalmist to typify the joy of the returning captives (<a onClick="return mV(\'Psa\',126,6);">Ps 126:6</a>).``133';
isbe[7949]='Sheal`she\'-al (she\'al, "request"): One of the Israelites of the sons of Bani who had taken foreign wives (<a onClick="return mV(\'Ezr\',10,29);">Ezr 10:29</a>, Septuagint: Salouia; Septuagint, Lucian, Assael; 1Es 9:30</a>, "Jasaelus").``1';
isbe[7950]='Shealtiel`she-ol\'-ti-el (she\'alti\'el, but in <a onClick="return mV(\'Hag\',1,12,14);">Hag 1:12,14</a>; <a onClick="return mV(\'Hag\',2,2);">2:2</a>, shalti\'el; Septuagint and the New Testament always Salathiel, hence, "Salathiel" of 1Esdras 5:5,48,56; 6:2; the King James Version of <a onClick="return mV(\'Mat\',1,12);">Mt 1:12</a>; <a onClick="return mV(\'Luk\',3,27);">Lu 3:27</a>): Father of Zerubbabel (<a onClick="return mV(\'Ezr\',3,2,8);">Ezr 3:2,8</a>; <a onClick="return mV(\'Ezr\',5,2);">5:2</a>; <a onClick="return mV(\'Neh\',12,1);">Ne 12:1</a>; <a onClick="return mV(\'Hag\',1,1,12,14);">Hag 1:1,12,14</a>; <a onClick="return mV(\'Hag\',2,2,23);">2:2,23</a>). But, according to <a onClick="return mV(\'1Ch\',3,17);">1Ch 3:17</a>, Shealtiel was the oldest son of King Jeconiah; in <a onClick="return mV(\'1Ch\',3,19);">3:19</A> the Massoretic Text makes Pedaiah, a brother of Shealtiel, the father of Zerubbabel (compare Curtis, ICC).``1';
isbe[7951]='Shear`sher.`<a href="./study/isbe/search.html?string=SHEEP">SHEEP</a>; <a href="./study/isbe/search.html?string=SHEEP+TENDING">SHEEP TENDING</a>`1';
isbe[7952]='Shear-Jashub`she-ar-ja\'-shub or jash\'-ub (she\'ar yashubh, "a remnant shall return"; Septuagint ho kataleiphtheis Iasoub): The son of Isaiah, who accompanied him when he set out to meet Ahaz (<a onClick="return mV(\'Isa\',7,3);">Isa 7:3</a>). The name like that of other children of prophets (compare "Immanuel," "Mahershalal-hash-baz," "Lo-ruhamah," etc.) is symbolic of a message which the prophet wishes to emphasize. Thus Isaiah uses the very words she\'ar yashubh to express his oft-repeated statement that a remnant of Israel will return to Yahweh (<a onClick="return mV(\'Isa\',10,21);">Isa 10:21</a>).``1';
isbe[7953]='Sheariah`she-a-ri-a, she-ar\'-ya (she\'aryah; Saraia): A descendant of Saul (<a onClick="return mV(\'1Ch\',8,38);">1Ch 8:38</a>; <a onClick="return mV(\'1Ch\',9,44);">9:44</a>).``1';
isbe[7954]='Shearing House`sher\'-ing (beth \'eqedh ha-ro\'im, "house of binding of the shepherds"; Codex Vaticanus Baithakath (Codex Alexandrinus Baithakad) ton poimenon): Here in the course of his extinction of the house of Ahab, Jehu met and destroyed 42 men, "the brethren of Ahaziah king of Judah" (<a onClick="return mV(\'2Ki\',10,\'12-14\');">2Ki 10:12-14</a>). Eusebius (in Onomasticon) takes the phrase as a proper name, Bethacath, and locates the village 15 miles from Legio in the plain. This seems to point to identification with Beit Kad, about 3 miles east of Jenin.``1';
isbe[7955]='Sheath`sheth.`<a href="./study/isbe/search.html?string=SWORD">SWORD</a>`1';
isbe[7956]='Sheba (1)`she\'-ba (shebha\'; Saba):<P>(1) Sheba and Dedan are the two sons of Raamah son of Cush (<a onClick="return mV(\'Gen\',10,7);">Ge 10:7</a>).<P>(2) Sheba and Dedan are the two sons of Jokshan the son of Abraham and Keturah (<a onClick="return mV(\'Gen\',25,3);">Ge 25:3</a>).<P>(3) Sheba is a son of Joktan son of Eber who was a descendant of Shem (<a onClick="return mV(\'Gen\',10,28);">Ge 10:28</a>).<P>From the above statements it would appear that Sheba was the name of an Arab tribe, and consequently of Semitic descent. The fact that Sheba and Dedan are represented as Cushite (<a onClick="return mV(\'Gen\',10,7);">Ge 10:7</a>) would point to a migration of part of these tribes to Ethiopia, and similarly their derivation from Abraham (<a onClick="return mV(\'Gen\',25,3);">Ge 25:3</a>) would indicate that some families were located in Syria. In point of fact Sheba was a South-Arabian or Joktanite tribe (<a onClick="return mV(\'Gen\',10,28);">Ge 10:28</a>), and his own name and that of some of his brothers (e.g. Hazarmaveth = Hadhramaut) are place-names in Southern Arabia.<P>The Sabeans or people of Saba or Sheba, are referred to as traders in gold and spices, and as inhabiting a country remote from Palestine (<a onClick="return mV(\'1Ki\',10,1);">1Ki 10:1</a>f; <a onClick="return mV(\'Isa\',60,6);">Isa 60:6</a>; <a onClick="return mV(\'Jer\',6,20);">Jer 6:20</a>; <a onClick="return mV(\'Eze\',27,22);">Eze 27:22</a>; <a onClick="return mV(\'Psa\',72,15);">Ps 72:15</a>; <a onClick="return mV(\'Mat\',12,42);">Mt 12:42</a>), also as slave-traders (<a onClick="return mV(\'Joe\',3,8);">Joe 3:8</a>), or even desert-rangers (<a onClick="return mV(\'Job\',1,15);">Job 1:15</a>; <a onClick="return mV(\'Job\',6,19);">6:19</a>; compare CIS 84 3).<P>By the Arab genealogists Saba is represented as great-grandson of Qachtan (= Joktan) and ancestor of all the South-Arabian tribes. He is the father of Chimyar and Kahlan. He is said to have been named Saba because he was the first to take prisoners (shabhah) in war. He founded the capital of Saba and built its citadel Marib (Mariaba), famous for its mighty barrage.<P>1. History: The authentic history of the Sabeans, so far as known, and the topography of their country are derived from South-Arabian inscriptions, which began to be discovered about the middle of the last century, and from coins dating from about 150 BC to 150 AD, the first collection of which was published in 1880, and from the South-Arabian geographer Hamdani, who was later made known to European scholars. One of the Sabean kings is mentioned on Assyrian inscriptions of the year 715 BC; and he is apparently not the earliest. The native monuments are scattered over the period extending from before that time until the 6th century AD, when the<P>Sabean state came to an end, being most numerous about the commencement of our era. Saba was the name of the nation of which Marib was the usual capital. The Sabeans at first shared the sovereignty of South Arabia with Himyar and one or two other nations, but gradually absorbed the territories of these some time after the Christian era. The form of government seems to have been that of a republic or oligarchy, the chief magistracy going by a kind of rotation, and more than one "king" holding office simultaneously (similarly <a onClick="return mV(\'Deu\',4,47);">De 4:47</a> and often in the Old Testament). The people seem to have been divided into patricians and plebeians, the former of whom had the right to build castles and to share in the government.<P>2. Religion:<P>A number of deities are mentioned on the inscriptions, two chief being Il-Maqqih and Ta\'lab. Others are Athtar (masculine form of the Biblical \'ashtaroth), Rammon (the Biblical Rimmon), the Sun, and others. The Sun and Athtar were further defined by the addition of the name of a place or tribe, just as Baal in the Old Testament. Worship took the form of gifts to the temples, of sacrifices, especially incense, of pilgrimages and prayers. Ceremonial ablution, and abstinence from certain things, as well as formal dedication of the worshipper and his household and goods to the deity, were also religious acts. In return the deity took charge of his worshipper\'s castle, wells, and belongings, and supplied him with cereals, vegetables and fruits, as well as granted him male issue.<P>3. Civilization:<P>(1) The chief occupations of the Sabeans were raiding and trade. The chief products of their country are enumerated in <a onClick="return mV(\'Isa\',60,6);">Isa 60:6</a>, which agrees with the Assyrian inscriptions. The most important of all commodities was incense, and it is significant that the same word which in the other Semitic languages means "gold," in Sabean means "perfume" (and also "gold"). To judge, however, from the number of times they are mentioned upon the inscriptions, agriculture bulked much more largely in the thoughts of the Sabean than commerce, and was of equal importance with religion.<P>(2) The high position occupied by women among the Sabeans is reflected in the story of the Queen of Sheba and Solomon. In almost all respects women appear to have been considered the equal of men, and to have discharged the same civil, religious and even military functions. Polygamy does not seem to have been practiced. The Sabean inscriptions do not go back far enough to throw any light upon the queen who was contemporary with Solomon, and the Arabic identification of her with Bilqis is merely due to the latter being the only Sabean queen known to them. Bilqis must have lived several centuries later than the Hebrew monarch.<P>(3) The alphabet used in the Sabean inscriptions is considered by Professor Margoliouth to be the original Semitic alphabet, from which the others are derived. In other respects Sabean art seems to be dependent on that of Assyria, Persia and Greece. The coins are Greek and Roman in style, while the system of weights employed is Persian.<P>See further <a href="./study/isbe/search.html?string=SABAEANS">SABAEANS</a>.<P>LITERATURE.<P>Rodiger and Osidander in ZDMG, volumes XX and XXI; Halevy in Journal Asiatique, Serie 6, volume IX; Corpus Inscriptionum Semiticarum, pt. IV, edition by J. and H. Derenbourg; Hamdani, edition by D. H. Muller, 1891; Mordtmann, Himyarische Inschriften, 1893; Hommel, Sudarabische Chresthomathie, 1893; Glaser, Abyssinien in Arabien, 1895; D. H. Muller, Sudarabische Alterthumer, 1899; Derenbourg, Les monuments sabeens, 1899. On the coins, Schlumberger, Le tresor de San\'a, 1880; Mordtmann in Wiener numismatische Zeitschrift, 1880.``189';
isbe[7957]='Sheba (2)`she\'-ba (shebha\'; Sabee, or Samaa): The name of one of the towns allotted to Simeon (<a onClick="return mV(\'Jos\',19,2);">Jos 19:2</a>). the King James Version mentions it as an independent town, but as it is not mentioned at all in the parallel list (<a onClick="return mV(\'1Ch\',4,28);">1Ch 4:28</a>), and is omitted in <a onClick="return mV(\'Jos\',19,2);">Jos 19:2</a> in some manuscripts, it is probable that the Revised Version (British and American) is correct in its translation "Beer-sheba or Sheba." Only in this way can the total of towns in this group be made 13 (<a onClick="return mV(\'Jos\',19,6);">Jos 19:6</a>). If it is a separate name, it is probably the same as <a href="./study/isbe/search.html?string=SHEMA">SHEMA</a> (which see).``117';
