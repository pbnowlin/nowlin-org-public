isbe[2401]='Creature`kre\'-tur: The word "creature," as it occurs in the New Testament, is the translation and also the exact English equivalent of the Greek ktisis, or ktisma, from ktizo, "to create." In the Old Testament, on the other hand, it stands for words which have in the original no reference to creation, but which come from other roots. Nephesh, "living creature" (literally, "a breathing thing"), occurs in the accounts of the Creation and the Flood and at the close of the lists of clean and unclean animals in <a onClick="return mV(\'Lev\',11,46);">Le 11:46</a>. Chay, "living creature" (literally, "a living thing"), occurs 13 times in <a onClick="return mV(\'Eze\',1,\'1-\');">Eze 1</a>; <a onClick="return mV(\'Eze\',3,\'1-\');">3</a> and <a onClick="return mV(\'Eze\',10,\'1-\');">10</a> (see <a href="./study/isbe/search.html?string=CREATURE,+LIVING">CREATURE, LIVING</a>). Sherets, "moving creature" (literally, "a swarming thing," generally rendered "<a href="./study/isbe/search.html?string=CREEPING+THING">creeping thing</a>," which see), occurs once in <a onClick="return mV(\'Gen\',1,20);">Ge 1:20</a>. \'Ochim, "doleful creatures," occurs once only in <a onClick="return mV(\'Isa\',13,21);">Isa 13:21</a>. It appears to be an onomatopoetic word referring to the mournful sounds emitted by the animals in question. From the context it is fair to suppose that owls may be the animals referred to.`<a href="./study/isbe/search.html?string=OWL">OWL</a>; <a href="./study/isbe/search.html?string=CREATION">CREATION</a>`37';
isbe[2402]='Creature, Living`(chayyah; zoon): "Living creature" (chayyah) is the designation of each of the composite figures in Ezekiel\'s visions (<a onClick="return mV(\'Eze\',1,5,13);">Eze 1:5, 13</a>ff; <a onClick="return mV(\'Eze\',3,13);">3:13</a>; <a onClick="return mV(\'Eze\',10,15,17,20);">10:15, 17, 20</a>) and, the Revised Version (British and American), of the similar beings in the visions of the Apocalypse, instead of the extremely unfortunate translation of zoon in the King James Version by "beasts" (<a onClick="return mV(\'Rev\',4,6);">Re 4:6</a>ff; <a onClick="return mV(\'Rev\',5,6);">5:6</a>ff; <a onClick="return mV(\'Rev\',6,1);">6:1</a>ff; <a onClick="return mV(\'Rev\',7,11);">7:11</a>; <a onClick="return mV(\'Rev\',14,3);">14:3</a>; <a onClick="return mV(\'Rev\',15,7);">15:7</a>; <a onClick="return mV(\'Rev\',19,4);">19:4</a>), which, however, went back to Wycliff, in whose time the word had not the low meaning which "beast," "beastly" have with us; hence, he translates <a onClick="return mV(\'1Cr\',15,44);">1Co 15:44</a>, "It is sowen beestli body," meaning simply animal (see Trench\'s Select Glossary); in Revelation "the beasts of the earth," the "beasts" that came up, the notable "beast" that men worshipped, represent the Greek therion, "a wild beast."<P>The "living creatures" in Ezekiel\'s vision (<a onClick="return mV(\'Eze\',1,5);">Eze 1:5</a>ff) were four in number, "with the general appearance of a man, but each with four faces and four wings, and straight legs with the feet of an ox. Under their wings are human hands, and these wings are so joined that they never require to turn. The front face is that of a man; right and left of this are the faces of a lion and (of) an ox, and behind, that of an eagle...out of the midst of them gleam fire, torches, lightnings, and connected with them are four wheels that can turn in every direction, called whirling wheels (<a onClick="return mV(\'Eze\',10,12,13);">Eze 10:12-13</a>). Like the creatures, these are alive, covered with eyes, the sign of intelligence; the spirit of the living creatures is in them. They are afterward discovered by the prophet to be cherubim" (Schultz, Old Testament Theology, II, 233). See <a href="./study/isbe/search.html?string=CHERUBIM">CHERUBIM</a>. In Ezekiel\'s vision they seem to be the bearers of the throne and glory of God; the bearers of His presence and of His revelation (<a onClick="return mV(\'Eze\',9,3);">Eze 9:3</a>; <a onClick="return mV(\'Eze\',10,3);">10:3</a>). They also sound forth His praise (<a onClick="return mV(\'Eze\',3,12);">Eze 3:12</a>; <a onClick="return mV(\'Eze\',10,2);">10:2</a>). (See Schultz as above.)<P>The four living creatures in <a onClick="return mV(\'Rev\',4,6);">Re 4:6</a> are not under the throne but "in the midst of the throne" (the American Revised Version, margin "before"; see <a onClick="return mV(\'Rev\',7,17);">Re 7:17</a>; compare <a onClick="return mV(\'Rev\',5,6);">Re 5:6</a>) and "round about the throne." They are also cherubim, and seem to represent the four beings that stand at the head of the four divisions of the creation; among the untamed animals the lion; among cattle the calf or ox; among birds the eagle; among all created beings the man. It gives "a perfect picture of true service, which should be as brave as the lion, patient as the ox, aspiring as the eagle, intelligent as man" (Milligan in the place cited.). They represent the powers of Nature—of the creation, "full of eyes" as denoting its permeation with the Divine Reason, the wings signifying its constant, ready service, and the unceasing praise the constant doing of God\'s will. The imagery is founded on Ezekiel as that had been modified in apocalyptic writings and as it was exalted in the mind of the Seer of Patmos.``185';
isbe[2403]='Credit`kred\'-it (pisteuein; 1Macc 10:46 the King James Version, the Revised Version (British and American) "gave no credence"; The <span class="noTag">Wisdom of Solomon 18:6</span> the King James Version, the Revised Version (British and American) "trusted"; 1Macc 1:30 the King James Version, the Revised Version (British and American) "credence"): In the modern commercial sense the noun "credit" does not occur in the canonical Scriptures or in the Apocrypha.``1';
isbe[2404]='Creditor`kred\'-i-ter:<P>(a) nosheh, participle of nashah: <a onClick="return mV(\'Exd\',22,24);">Ex 22:24</a> (English translation: 25); <a onClick="return mV(\'2Ki\',4,1);">2Ki 4:1</a>; <a onClick="return mV(\'Isa\',50,1);">Isa 50:1</a>; translated "extortioner," <a onClick="return mV(\'Psa\',109,11);">Ps 109:11</a>; "taker of usury," <a onClick="return mV(\'Isa\',24,2);">Isa 24:2</a> the King James Version;<P>(b) malweh, participle of lawah, <a onClick="return mV(\'Isa\',24,2);">Isa 24:2</a> the Revised Version (British and American), the King James Version "lender";<P>(c) ba\'al mashsheh yadho: "lord of the loan of his hand," <a onClick="return mV(\'Deu\',15,2);">De 15:2</a>;<P>(d) danistes: <a onClick="return mV(\'Luk\',7,41);">Lu 7:41</a>, "creditor" the King James Version, "lender" the Revised Version (British and American); compare further danistos, Sirach 29:28, "lender" the King James Version, "money-lender" the Revised Version (British and American):<P>In the ideal social system of the Old Testament, debts are incurred only because of poverty, and the law protected the poor debtor from his creditor, who in <a onClick="return mV(\'Exd\',22,25);">Ex 22:25</a> is forbidden to demand interest, and in <a onClick="return mV(\'Deu\',15,2);">De 15:2</a> to exact payment in view of the nearness of the year of release. <a onClick="return mV(\'2Ki\',4,1);">2Ki 4:1</a> shows that the actual practice was not so considerate, and in consequence the creditor fell into bad repute. In <a onClick="return mV(\'Psa\',109,11);">Ps 109:11</a> he is the extortioner; in <a onClick="return mV(\'Pro\',29,13);">Pr 29:13</a> the oppressor is evidently the creditor, though a different word is used; compare also <a onClick="return mV(\'Pro\',22,7);">Pr 22:7</a>. In Sirach 29:28 the importunity of the creditor is one of the hardships of the poor man of understanding. The actual practice of the Jews may be gathered from <a onClick="return mV(\'Neh\',5,1);">Ne 5:1</a>ff; <a onClick="return mV(\'Jer\',34,8);">Jer 34:8</a>ff; and Sirach 29:1-11.`<a href="./study/isbe/search.html?string=DEBT">DEBT</a>`13';
isbe[2405]='Creed; Creeds`kred:<p><b>I. SCRIPTURAL BASIS</b><P class="in15">1. In the Old Testament<P class="in15">2. In the New Testament—Gospels<P class="in15">3. In the Epistles<P class="in30">(1) Paul<P class="in30">(2) Later Writings<P class="in30">(3) Hebrews<p><b>II. HISTORICAL FORMS</b><P class="in15">1. The Apostles\' Creed<P class="in15">2. The Nicene Creed<P class="in30">(1) Origin, Date, Character<P class="in30">(2) "Filioque" Clause<P class="in15">3. The Athanasian Creed<P class="in30">(1) Authorship<P class="in30">(2) Question of Imposture<P class="in30">(3) Value and Features<P class="in15">4. The Reformation Creeds<P><b>LITERATURE</b><hr /><P>By "creed" we understand the systematic statement of religious faith; and by the creeds of the Christian church we mean the formal expression of "the faith which was delivered unto the saints." The word is derived from the first word of the Latin versions of the Apostles\' Creed, and the name is usually applied to those formulas known as the Apostles\', the Nicene and the Athanasian creeds.<P>In this article we shall first indicate the Scriptural foundation and rudimentary Biblical statements upon which the distinctive dogmas of the church are based; and, secondly, briefly describe the origin and nature of the three most important symbols of belief which have dominated Christian thought.<p>I. Scriptural Basis.<P>There are three forms in which the religious instinct naturally expresses itself—in a ritual, a creed and a life. Men first seek to propitiate the Deity by some outward act and express their devotion in some external ceremony. Next they endeavor to explain their worship and to find a rationale of it in certain facts which they formulate into a confession; and lastly, not content with the outward act or the verbal interpretation of it, they attempt to express their religion in life.<P>Pagan religion first appears in the form of a rite. The worshipper was content with the proper performance of a ceremony and was not, in the earliest stage at least, concerned with an interpretation of his act. The myths, which to some extent were an attempt to rationalize ritual, may be regarded as the earliest approach to a formulated statement of belief. But inasmuch as the myths of early pagan religion are not obligatory upon the reason or the faith of the worshipper, they can scarcely be regarded as creeds. Pagan religion, strictly speaking, has no theology and having no real historical basis of facts does not possess the elements of a creed. In this respect it is distinguished from revealed religion. This latter rests upon facts, the meaning and interpretation of which are felt to be necessary to give to revelation its values and authority.<P>1. In the Old Testament:<P>Even in the Old Testament there are not wanting the germs of a creed. In the Decalogue we have the beginnings of the formulation of belief, and in the proclamation, "Hear, O Israel: Yahweh our God is one Yahweh" (<a onClick="return mV(\'Deu\',6,4);">De 6:4</a>), we have what may be regarded as the symbol of the Old Testament faith and the earliest attempt to enunciate a doctrine.<P>2. In the New Testament—Gospels:<P>It is to the New Testament, however, we must turn to find the real indications of such a statement of belief as may be designated a creed. We must remember that Christ lived and taught for a time before any attempt was made to portray His life or to record His sayings. The earliest writings are not the Gospels, but some of the Epistles, and it is to them we must look for any definite explanation of the facts which center in the appearance of Christ upon the earth. At the same time in the sequence of events the personality and teaching of Jesus come first, and in the relation to Him of His disciples and converts and in their personal confessions and utterances of faith we have the earliest suggestions of an expression of belief. The confession of Nathanael (<a onClick="return mV(\'Jhn\',1,49);">Joh 1:49</a>), "Rabbi, thou art the Son of God," and still more the utterance of Peter (<a onClick="return mV(\'Mat\',16,16);">Mt 16:16</a>), "Thou art the Christ, the Son of the living God," and the exclamation of Thomas (<a onClick="return mV(\'Jhn\',20,28);">Joh 20:28</a>), contain the germ of a creed. It is to be noted that all these expressions of belief have Christ as their object and give utterance with more or less explicitness to a conviction of His Divine nature and authority.<P>3. In the Epistles:<P>(1) Paul:<P>But while these sayings in the Gospels were no doubt taken up and incorporated in later interpretations, it is to the Epistles that we must first go, for an explanation of the facts of Christ\'s person and His relation to God and man. Paul\'s Epistles are really of the nature of a confession and manifesto of Christian belief. Communities of believers already existed when the apostle directed to them his earliest letters. In their oral addresses the apostles must have been accustomed not only to state facts which were familiar to their hearers, but also to draw inferences from them as to the meaning of Christ and the great truths centering in His person—His incarnation, His death and resurrection (as we may see from the recorded sermons of Peter and Paul in Acts). It is to these facts that the Epistles appeal. It was at once natural and necessary that some expression of the faith once delivered to the saints should be formulated for a body whose members were pledged to each other and united for common action, and whose bond of union was the acknowledgment of "one Lord, one faith." Paul recognizes it as vital to the very spirit of religion that some definite profession of belief in Christ should be made: "If thou shalt confess with thy mouth Jesus as Lord, and shalt believe in thy heart that God raised him from the dead, thou shalt be saved" (<a onClick="return mV(\'Rom\',10,9);">Ro 10:9</a>). These words would seem to imply that a confession of the Deity, the atoning death, and resurrection of Jesus was the earliest form of Christian creed.<P>It must also be observed that from the very first the confession of faith seems to have been connected with the administration of baptism. Already in the story of the Ethiopian eunuch (<a onClick="return mV(\'Act\',8,37);">Ac 8:37</a> the King James Version) (a passage indeed of doubtful genuineness but attested by Irenaeus and therefore of great antiquity) we find that as a condition of baptism the convert is asked to declare his belief in Jesus Christ as the Son of God. The passage in <a onClick="return mV(\'1Ti\',6,12);">1Ti 6:12</a>; (compare <a onClick="return mV(\'Hbr\',10,23);">Heb 10:23</a>), "Lay hold on the life eternal, whereunto thou wast called, and didst confess the good confession in the sight of many witnesses," may refer to a confession required only of those who were being ordained: but the context leads us to infer that it was a baptismal vow asked of members not less than of ministers of the church. The probability is that the earliest form of creed reflected little more than Christ\'s final command to baptize all men "into the name of the Father and of the Son and of the Holy Spirit" (<a onClick="return mV(\'Mat\',28,19);">Mt 28:19</a>), or perhaps simply "into the name of the Lord Jesus" (<a onClick="return mV(\'Act\',19,5);">Ac 19:5</a>). The verse in <a onClick="return mV(\'Act\',8,37);">Ac 8:37</a> the King James Version, though disputed by some, is instructive in this connection. Faith in Jesus Christ was regarded as the cardinal point of the New Revelation and may have been taken to imply a relation to the Father as well as a promise of the Holy Spirit.<P>It is evident that the creeds that have come down to us are mainly an expression of the doctrine of the Trinity as embodied in the original baptismal formula derived from Our Lord\'s commission. Already indeed in some places of the Old Testament this doctrine is foreshadowed; but it is first clearly incorporated in the Lord\'s command just mentioned and in the benediction of Paul (<a onClick="return mV(\'2Cr\',13,14);">2Co 13:14</a>), and subsequently in the Christian doxologies. Some scholars have preferred to find traces in the later writings of the New Testament of a more definite summary of belief: as in the allusion to the form of sound words (<a onClick="return mV(\'2Ti\',1,13);">2Ti 1:13</a>), the "deposit" or "good deposit" which was to be kept (<a onClick="return mV(\'1Ti\',6,20);">1Ti 6:20</a> the Revised Version, margin; <a onClick="return mV(\'2Ti\',1,14);">2Ti 1:14</a> the Revised Version, margin); also in "the faithful words" enumerated in these epistles (<a onClick="return mV(\'1Ti\',1,15);">1Ti 1:15</a>; <a onClick="return mV(\'1Ti\',3,1);">3:1</a>; <a onClick="return mV(\'1Ti\',4,8,9);">4:8-9</a>; <a onClick="return mV(\'2Ti\',2,11);">2Ti 2:11</a>); and in the remarkable passage in the beginning of <a onClick="return mV(\'Hbr\',6,\'1-\');">Heb 6</a> in which the elementary doctrines of the Christian religion are enumerated; first on the subjective side, repentance and faith, and then objectively, the resurrection and the judgment. There are also brief summaries in several of the Pauline Epistles of what the apostle must have considered to be essential tenets. Thus for example we have the death, burial and resurrection of Christ mentioned in <a onClick="return mV(\'1Cr\',15,3);">1Co 15:3</a>f; <a onClick="return mV(\'Rom\',1,3);">Ro 1:3</a>f. Such summaries or confessions of personal faith as in <a onClick="return mV(\'2Th\',2,13);">2Th 2:13</a>f are frequent in Paul\'s writings and may correspond to statements of truth which the apostle found serviceable for catechetical purposes as he moved from one Christian community to another.<P>See <a href="./study/isbe/search.html?string=CATECHIST">CATECHIST</a>.<P>(2) Later Writings:<P>It is not indeed till a much later age—the age of Irenaeus and Tertullian (175-200 AD)—that we meet with any definite summary of belief. But it cannot be doubted that these Scriptural passages to which we have referred not only served as the first forms of confession but also contributed the materials out of which the articles of the church\'s faith were formulated. As soon as Christian preaching and teaching were exercised there would be a felt need for explicit statement of the truths revealed in and through Jesus Christ. It may be said that all the main facts which were subsequently embodied in the creeds have their roots in the New Testament Scripture and especially in the Pauline Epistles. The only exception which might be made is in the case of the virgin birth. It does not lie within the scope of this article to comment upon the silence of the epistles on this subject. This, however, we may say, that the omissions of Paul\'s reference to it does not prove it untrue. It only proves at most that it was not a part of the ground upon which the Christ was commended to the first acceptance of faith. But though no direct allusion to the virgin birth occurs in Paul\'s writings the truth which gives spiritual value to the fact of the virgin conception, namely, God\'s new creation of humanity in Christ, is a vital and fundamental element in the faith both of Paul and of the whole early church. The Christian life is essentially a new creation (<a onClick="return mV(\'2Cr\',5,17);">2Co 5:17</a>; <a onClick="return mV(\'Gal\',6,15);">Ga 6:15</a>; <a onClick="return mV(\'Rom\',6,4);">Ro 6:4</a>) in Jesus Christ, the second Adam (<a onClick="return mV(\'Rom\',5,\'12-21\');">Ro 5:12-21</a>), who is from heaven (<a onClick="return mV(\'1Cr\',15,47);">1Co 15:47</a>). Into this spiritual context the facts recorded by Matthew and Luke introduce no alien or incompatible element (compare W. Richmond, The Creed in the Epistles of Paul; Orr, The Virgin Birth of Christ). And therefore the story of Christ\'s birth as we have it in the Synoptics finds a natural place in the creed of those who accept the Pauline idea of a new creation in Christ.<P>See <a href="./study/isbe/search.html?string=VIRGIN+BIRTH">VIRGIN BIRTH</a>.<P>(3) Hebrews:<P>It is beyond the scope of this article to discuss the evidences of development in the main doctrines of the gospel, but however the later ages may have elaborated them, the leading tenets of the subsequent faith of the church—the doctrine of the Trinity; our Lord\'s divinity and real humanity; His atoning death and resurrection; the doctrine of the Holy Spirit and of the catholicity and unity of the church—stand clear and distinct in these earliest Scriptural sources.<p>II. Historical Forms.<P>Faith implies a creed as a confession and testimony. Such a confession and testimony answers to a natural impulse of the soul. Hence, a profession of faith is at once a personal, a social and a historical testimony. A formal creed witnesses to the universality of faith, binds believers together, and unites the successive ages of the church. It is the spontaneous expression of the life and experience of the Christian society. As the purpose of this article is chiefly to indicate the Scriptural sources of the creeds rather than to discuss their origin and history, we can only briefly describe the main historical forms which have prevailed in the Christian church.<P>1. The Apostles\' Creed:<P>The Apostles\' Creed, in ancient times called the Roman Creed, though popularly regarded as the earliest, was probably not the first in chronological order. Its origin and growth are involved in considerable obscurity (see separate article, <a href="./study/isbe/search.html?string=APOSTLES\'+CREED+THE">APOSTLES\' CREED</a>; and compare Heurtley, Harmonia Symbolica).<P>2. The Nicene Creed:<P>(1) Origin, Date, Character:<P>The Nicene Creed, called sometimes "the Creed of the 318" from the number of bishops reputed to have been present, was authorized at the Council of Nice in 325 AD, and completed by the Council of Constantinople in 381, when the clauses which follow the mention of the Holy Ghost were added. The opinions of Arius at the beginning of the 4th century created such unrest as to call forth not only the admonition of bishops but also the intervention of the emperor Constantine, who, as a professed Christian, had become the patron of the church. The efforts of the emperor, however, had no effect in allaying the dissensions of the church at Alexandria, which, upon the banishment of Arius, spread throughout eastern Christendom. It was decided, therefore, to convoke a general council of bishops in which the Catholic doctrine should be once and for all formally declared. This, the first ecumenical council, met at Nicea in Bithynia in 325 AD. There is no detailed record of the proceedings. "We do not know whether it lasted weeks or days" (Stanley, Lects on East Ch.). Arius; being only a presbyter, had no seat in the conclave, but was allowed to express his opinions. His chief opponent was Athanasius.<P>(2) "Filioque" Clause:<P>The controversy turned upon the nature of the Son and His relation to the Father. The word homoousios ("of one substance with"), used in the course of the argument with a view of disputeing the extreme orthodox position, became the battleground between the parties. The Arians violently condemned. The Sabellians or Semi-Arians to evade its full force contended for the term homoiousios ("of like substance"). But the majority finally adopted the former expression as the term best suited to discriminate their view of the relation of the Father and Son from the Arian view. The assent of the emperor was gained and the words "being of one substance with the Father" were incorporated into the creed. The clauses descriptive of the Holy Spirit were added or confirmed at a later council (382), and were designed to refute the Macedonian heresy which denied His equality with the Father and Son, and reduced the Holy Spirit to a level with the angels.<P>The phrase "proceedeth from the Father and the Son" is also of historical importance. The last three words are a later addition to the creed by western churches, formally adopted by the Council of Toledo in 589. But when the matter was referred in the 9th century to Leo III he pronounced against them as unauthorized. This interpolation, known as the Filioque, marks the difference still between the Latin and Greek churches. From the 9th century no change has been made in the Nicene Creed. It has remained, without the Filioque clause, the ecumenical symbol of the Eastern Church; and with the addition of that word it has taken its place among the three great creeds of the Western Church.<P>3. The Athanasian Creed:<P>(1) Authorship:<P>The Athanasian Creed, or the Symbolum Quicunque, as it is called, from its opening words, differs entirely in its origin and history from those we have just considered. It is not a gradual growth like the Apostles\' Creed, nor is it the outcome of synodical authority like the Nicene Creed. "When the composition appears for the first time as a document of authority it is cited in its completeness and as the work of the Father whose name it has since, in the most part, borne, although it was not brought to light for many centuries after his death" (Lumby, History of the Creeds). Without going into the full and intricate evidence which has been brought forward by scholars to prove that it is incorrectly attributed to Athanasius, it is sufficient to observe that both authorship and date are uncertain. Dr. Swainson proves in the most conclusive manner that the existence of this creed cannot be traced before the age of Charlemagne, and that its origin may probably be ascribed to then existing demand for a more detailed exposition of the faith than was to be found in the Apostles\' Creed. It is nowhere mentioned at synods before the end of the 8th century, whose special business it was to discuss the very matters which were afterward embodied within it in such detail.<P>(2) Question of Imposture:<P>The question of imposture has been raised with regard to this creed, and it has been maintained by some that it was originally a forgery of the same nature as the "false decretals" and the equally famous "Donation of Constantine" (Swainson). But it may be said that the word "imposture" is incorrectly applied to "a natural and inevitable result of the working of the mind of the Western Church toward a more elaborate and detailed confession of its Trinitarian faith" (Tulloch, Encyclopedia Brit). The imposture, if there was any, consisted not in the origin of the creed but in the ascription of it to a name and a date with which it had no connection. This was done no doubt to secure for it credit and authority, and was supposed to be justified by its special doctrinal import.<P>(3) Value and Features:<P>This symbol, though too compendious and elaborate to serve the purposes of a creed, itself standing in need of exposition and explanation, has its value as representing a further stage of doctrinal development. If the Apostles\' Creed determined the nature of God and the Nicene Creed defined the character and relation of the Son and the Holy Spirit, the Athanasian Creed may be regarded as establishing the great doctrine of the Trinity. Its distinguishing features are the monitory clauses and its uncompromising statement of the value of the Christian faith. The other creeds set forth the mercies of Revelation; this adds the danger of rejecting them. The others declare the faith; this insists also on its necessity. This, also, alone insists upon the necessity of good works (Yonge, An Exposition of the Apostles\' Creed). The closing warning is based on Christ\'s own words: "Depart from me," etc. (<a onClick="return mV(\'Mat\',25,41,46);">Mt 25:41, 46</a>). If this creed is solemn in its admonitions, we must remember that so also are the Gospels. On the whole it is a comprehensive summary of truth, laying down the rule of faith as a foundation, following out its issues of good or evil. True belief is closely connected with right action.<P>With the adoption of the "Athanasian" symbol, the creed-making of the early and medieval church ceases. Of the three mentioned one only in the broadest sense, the Nicene, is Catholic. Neither the Apostles\' nor the Athanasian Creed is known to the Greek or oriental church which remained faithful to the faith settled by the holy Fathers at Nicea. The two others adopted by the West are really gradual growths or consequences from it, without any definite parentage or synodic authority. But the faith as defined at Nicea and ratified by subsequent councils is the only true Catholic symbol of the universal church.<P>4. The Reformation Creeds:<P>With the Reformation a new era of creed-formation began. It will not, however, be necessary to do more than mention some of the confessions of the Reformed churches which consist mainly of elaborations of the original creeds with the addition of special articles designed to emphasize and safeguard the distinctive doctrines and ecclesiastical positions of particular branches of the church. Of this nature are the Confessions of the Lutheran church—the Augsburg Confession of 1530; the Genevese or Calvinistic of 1549 consisting of 26 articles, defining particularly the nature of the Sacraments; confessions of the Dutch church confirmed at the Synod of Dort in 1619 and known as the "Decrees of Dort"; and the famous Heidelberg Catechism. To this series of Protestant confessions must be added the 39 Articles of the Church of England and the Westminster Confession of Faith, which is the doctrinal standard not only. of the churches of Scotland, but of the principal Presbyterian churches of Britain and America.<P>LITERATURE.<P>Winer, Doctrines and Confessions of Christendom (translation Clark, 1873): Lumby, History of the Creeds; Swainson, The Nicene and Apostles\' Creeds (1875); Heurtley, Harmonia Symbolica (1858); Zahn, Apost. Symb. (1892); Harnack, Apost. Glaubensbekenntnis; Swete, Apostles\' Creed; Hefele, Councils of the Church; Schaff, The Creeds of Christendom. For exposition, and of a more popular nature, may be mentioned the works of Hooker, Barrow, and Beveridge, and especially Bishop Pearson; Westcott, Historic Faith; Norris, Rudiments of Theology; W. W. Harvey, The Three Creeds; J. Eyre Yonge, An Exposition of the Apostles\' Creed (1888); Wilfred Richmond, The Creed in the Epistles of Paul (1909).``2';
isbe[2406]='Creek`krek, colloq. krik (kolpos (<a onClick="return mV(\'Act\',27,39);">Ac 27:39</a>), the Revised Version (British and American) "bay"): The spot has been identified as the traditional Bay of Paul about 8 miles Northwest of the town of Valetta in the island of Malta.`<a href="./study/isbe/search.html?string=MELITA">MELITA</a>`1';
isbe[2407]='Creeping Thing`krep\'-ing (remes, sherets; herpeton): Remes and sherets, with the root verbs ramas and sharats, are used without any sharp distinction for insects and other small creatures. Ramas means clearly "to creep," and is used even of the beasts of the forest (<a onClick="return mV(\'Psa\',104,20);">Ps 104:20</a>), while sharats is rather "to swarm." But in at least one passage (<a onClick="return mV(\'Lev\',11,44);">Le 11:44</a>), we have the noun, sherets, with the verb ramas; "with any manner of creeping thing that moveth upon the earth." The principal passages where these words occur are the accounts of the Creation and the Flood and the references to unclean animals in Leviticus and in the vision of Peter. In the last we have the word herpeton as the Greek equivalent of the Hebrew words (<a onClick="return mV(\'Act\',10,12);">Ac 10:12</a>). Winged creeping things (sherets ha-\'oph, <a onClick="return mV(\'Lev\',11,20);">Le 11:20</a>ff), as well as the wingless, are unclean, but an exception is made in favor of the locusts, "which have legs above their feet, where-with to leap upon the earth."`<a href="./study/isbe/search.html?string=INSECTS">INSECTS</a>; <a href="./study/isbe/search.html?string=LOCUST">LOCUST</a>`37';
isbe[2408]='Cremation`kre-ma\'-shun (compare saraph, <a onClick="return mV(\'Jos\',7,15);">Jos 7:15</a>, etc., "shall be burnt with fire"; kaio, <a onClick="return mV(\'1Cr\',13,3);">1Co 13:3</a>, "If I give my body to be burned," etc.): Cremation, while the customary practice of the ancient Greeks, and not unknown among the Romans, was certainly not the ordinary mode of disposing of the dead among the Hebrews or other oriental peoples. Even among the Greeks, bodies were often buried without being burned (Thuc. i. 134,6; Plato Phaedo 115 E; Plut. Lyc. xxvii). Cicero thought that burial was the more ancient practice, though among the Romans both methods were in use in his day (De leg. ii. 22, 56). Lucian (De luctu xxi) expressly says that, while the Greeks burned their dead, the Persians buried them (see <a href="./study/isbe/search.html?string=BURIAL">BURIAL</A>, and compare <a onClick="return mV(\'2Sa\',21,\'12-14\');">2Sa 21:12-14</a>). In the case supposed by <a onClick="return mV(\'Amo\',6,10);">Amos 6:10</a>, when it is predicted that Yahweh, in abhorrence of "the excellency of Jacob," shall "deliver up the city," and, "if there remain ten men in one house, that they shall die," and "a man\'s kinsman (ARVm) shall take him up, even he that burneth him," etc., the suggestion seems to be that of pestilence with accompanying infection, and that this, or the special judgment of Yahweh, is why burning is preferred. When Paul (<a onClick="return mV(\'1Cr\',13,3);">1Co 13:3</a>) speaks of giving his body to be burned, he is simply accommodating his language to the customs of Corinth. (But see Plutarch on Zarmanochegas, and C. Beard, The Universal Christ.)<P>How far religious, or sanitary, or practical reasons were influential in deciding between the different methods, it is impossible to say. That bodies were burned in times of pestilence in the Valley of Hinnom at Jerusalem is without support (see <a onClick="return mV(\'Eze\',39,\'11-16\');">Eze 39:11-16</a>). The "very great burning" at the burial of Asa (<a onClick="return mV(\'2Ch\',16,14);">2Ch 16:14</a>) is not a case of cremation, but of burning spices and furniture in the king\'s honor (compare <a onClick="return mV(\'Jer\',34,5);">Jer 34:5</a>). Nor is <a onClick="return mV(\'1Ki\',13,2);">1Ki 13:2</a> a case in point; it is simply a prophecy of a king who shall take the bones of men previously buried, and the priests of the high places that burn incense in false worship, and cause them to be burned on the defiled altar to further pollute it and render it abominable.<P>There is in the New Testament no instance of cremation, Jewish, heathen or Christian, and clearly the early Christians followed the Jewish practice of burying the dead (see Tert., Apol., xlii; Minuc. Felix, Octav., xxxix; Aug., De civ. Dei, i.12,13). Indeed, cremation has never been popular among Christians, owing largely, doubtless, to the natural influence of the example of the Jews, the indisputable fact that Christ was buried, the vivid hope of the resurrection and the more or less material views concerning it prevalent here and there at this time or that. While there is nothing anti-Christian in it, and much in sanitary considerations to call for it in an age of science, it is not likely that it will ever become the prevailing practice of Christendom.``47';
isbe[2409]='Crescens`kres\'-enz (Kreskes, "increasing"): An assistant of Paul, mentioned in <a onClick="return mV(\'2Ti\',4,10);">2Ti 4:10</a> as having gone to Galatia. That he was one of the Seventy, and that he founded the church in Vienna in Gaul, are traditions without any trustworthy basis.``1';
isbe[2410]='Crescents`kres\'-ents (saharonim): Moon-shaped necklaces (<a onClick="return mV(\'Jdg\',8,21,26);">Jud 8:21, 26</a>; <a onClick="return mV(\'Isa\',3,18);">Isa 3:18</a>).``1';
isbe[2411]='Crete`kret (Krete, ethnic Kretes, <a onClick="return mV(\'Act\',2,11);">Ac 2:11</a>; <a onClick="return mV(\'Tts\',1,12);">Tit 1:12</a>): An island bounding the Aegean Sea on the south. It stretches from 34 degrees 50\' to 35 degrees 40\' North latitude and from 23 degrees 30\' to 26 degrees 20\' East long. With Cythera on the north and Carpathos and Rhodos on the Northeast, it forms a continuous bridge between Greece and Asia Minor. The center of the island is formed by a mountain chain rising to a height of 8,193 ft. in Mt. Ida, and fringed with low valleys beside the coast. There are no considerable rivers; the largest, the Metropole, on the south, is a tiny stream, fordable anywhere. An island of considerable extent (156 miles long, and from 7 to 30 miles broad), in several districts very fertile and possessing one or two good harbors, it seems marked out by its position for an important role in the history of the eastern Mediterranean. But never since an age which was already legendary when Greek history began has Crete occupied a dominating position among the powers of the surrounding continents. Internal dissensions, due in ancient times to the diversity of races inhabiting its soil (Eteocretans—the original inhabitants—Pelasgians, Acheans, Cydonians and Dorians), and in modern times to the fact that a large minority of the population has accepted the Ottoman religion along with Ottoman government, have kept Crete in a position of political inferiority throughout the historical period.<P>1. Early History:<P>Mt. Ida in Crete was famous in Greek legend as the birthplace of Zeus. The half-legendary, half-historical King Minos was said to be the son of Zeus, and to have derived from his father the wisdom to which, by a type of myth common in Greek lands, the constitution of the Cretan cities was ascribed. Minos was accepted as a historical personage by Thucydides and Aristotle, who say that he was the first dynast in Greece to establish dominion on the sea. One of his exploits was the suppression of piracy in Cretan waters, a feat which had to be repeated by the Roman Pompeius at a later period. Aristotle compares the Cretan institutions with those of Sparta; the island was said to have been colonized by Dorians from Peloponnesus (Politics ii.10). The most important cities in Crete were Knossos (whose palace has been excavated with fruitful results by Mr. Arthur Evans), Gortyna, near the Gulf of Messara, and Cydonia, with its river Iardanus. The excavations of Mr. Evans at Knossos and of the Italians at Phastos (near Fair Havens) prove that Crete was a center of Mediterranean civilization in an early age. In the Homeric poems, Crete is said to have contained an hundred cities; at that period the Cretans were still famed as daring sailors. In the classical age of Greek history they never held a leading position. They are mentioned chiefly as traders and mercenary soldiers, skilled especially in archery. During the Hellenistic period Crete remained free. Demetrius Nicator made the island his base of operations before his defeat at Azotus in 148.<P>2. The Jews in Crete:<P>In 141, the Cretan Jews were influential enough to secure the patronage of Rome. They were being oppressed by the people of Gortyna, and appealed to Rome, which granted them protection. In strengthening the position of the Jews, the Romans were copying the Seleucid policy in Asia Minor; both the Seleucids and the Romans found the Jews among their most devoted supporters in their subject states. This interference of Rome in the interest of her future partisans paved the way for her annexation of the island in the following century. From this date, there was a strong and prosperous body of Jews in Crete, and Cretans are mentioned among the strangers present at the Feast of Pentecost in <a onClick="return mV(\'Act\',2,11);">Ac 2:11</a>. Its alliance with Mithradates the Great, and the help it gave to the Cilician pirates gave Rome the pretext she desired for making war on Crete, and the island was annexed by. Metellus in 67 BC. With Cyrene on the north coast of Africa, it was formed into a Roman province. When Augustus divided the Empire between the Senate and himself, Crete and Cyrene were sufficiently peaceful to be given to the Senate.<P>3. Later History:<P>They formed one province till the time of Constantine, who made Crete a separate province. The Saracens annexed Crete in 823 AD, but it was recaptured for the Byzantine Empire by Nicephorus Phokas in the following century. From the 13th till the 17th century it was held by the Venetian Republic: from this period dates its modern name "Kandia," which the Venetians gave to the Saracen capital Khandax, and afterward to the whole island. After a desperate resistance, lasting from 1645 to 1669 AD, Crete fell into the hands of the Turks, who still exercise a nominal suzerainty over the island.<P>4. Crete in the Old Testament:<P>In <a onClick="return mV(\'1Sa\',30,14);">1Sa 30:14</a>; <a onClick="return mV(\'Eze\',25,16);">Eze 25:16</a>, and <a onClick="return mV(\'Zep\',2,5);">Ze 2:5</a>, the Philistines are described as Cherethites, which is usually taken to mean Cretans. The name is connected with Caphtor and the Caphtorim (<a onClick="return mV(\'Deu\',2,23);">De 2:23</a>; <a onClick="return mV(\'Jer\',47,4);">Jer 47:4</a>; <a onClick="return mV(\'Amo\',9,7);">Am 9:7</a>). The similarity between the river-names Jordan and Iardanos (Homer Odyssey iii. 292) "about whose streams the Kydones dwelt," has suggested that. Caphtor is to be identified with Cydonia; or possibly it was the name of the whole island. Tacitus believed in an ancient connection between Crete and Palestine; the Jews, he said, were fugitives from Crete, and derived their name Iudaei from Mt. Ida (Hist. v.2). Crete is mentioned in connection with the campaign of Demetrius Nicator, referred to above, in 1Macc 10:67.<P>See <a href="./study/isbe/search.html?string=CAPHTOR">CAPHTOR</A>; <a href="./study/isbe/search.html?string=CHERETHITES">CHERETHITES</A>.<P>5. Crete in the New Testament:<P>Crete owes its connection with Pauline history to the accident of a gale which forced the ship carrying Paul to Rome to take shelter on the south coast of the island. In the harbor of Myra, on the coast of Lycia, the centurion in charge of Paul transferred him from the Adramyttian ship which had brought them from Caesarea, to a ship from Alexandria in Egypt, bound for Ostia with a cargo of grain. The fact that the centurion was in virtual command of the ship (<a onClick="return mV(\'Act\',27,11);">Ac 27:11</a>) proves that it was one of the vessels in the imperial transport service. Leaving Myra they came opposite Cnidus with difficulty, against a head-wind. The ordinary course from Cnidus in good weather was to steer straight for Cythera, but on this occasion the west or northwest winds made this route impracticable, and they sailed under the lee of Crete, whose south coast would shelter them from a northwest gale, and afford occasional protection from a west gale. They passed Salmone, the northeast corner of Crete, with difficulty, and worked round the coast to Fair Havens, a harbor somewhat to the east of Cape Matala. The great Feast fell while they were at Fair Havens; in 59 AD it was On October 5, in the middle of the season when the equinoxes made sailing impossible. Paul advised the centurion to winter in Fair Havens, but the captain wished to reach Phoenix, a harbor farther to the west, where ships from Egypt were accustomed to put in during the stormy season. It was decided to follow the captain\'s advice; but on its way to Phoenix the ship was struck by a northeast wind called Euraquilo, which rushed down from Mt. Ida. The ship was carried out to sea; it managed to run under the lee of Cauda, an island 23 miles west of Cape Matala, where the crew hauled in the boat, undergirded the ship, and slackened sail. On the fourteenth night they were driven on the coast of Malta, and wrecked.<P>The narrative does not state that Paul landed in Crete, but as the ship lay for some time at Fair Havens (<a onClick="return mV(\'Act\',27,8,9);">Ac 27:8-9</a>) he had plenty of opportunity to land, but not to travel inland. The centurion gave him permission to land at Sidon. Paul left Titus in Crete (<a onClick="return mV(\'Tts\',1,5);">Tit 1:5</a>); tradition made the latter its first bishop, and patron saint.<P>6. The Cretans:<P>Cretans were present, as noted above, at the Feast of Pentecost (<a onClick="return mV(\'Act\',2,11);">Ac 2:11</a>). Paul\'s estimate of the Cretan character (<a onClick="return mV(\'Tts\',1,\'10-16\');">Tit 1:10-16</a>) was the one current in antiquity. Paul quotes (<a onClick="return mV(\'Tts\',1,12);">Tit 1:12</a>) a well-known line of the Cretan poet Epimenides (who lived about 600 BC) on the mendacity of the Cretans. The sentiment was repeated by Callimachus (Hymn to Zeus 8). Other ancient witnesses to the detestation in which the Cretan character was held are Livy xliv.45, and Plutarch Aemilius section 23.<P>LITERATURE.<P>Smith, Voyage and Shipwreck of Paul; Ramsay, Paul the Traveler and Roman Citizen, 320-30. On Crete in Greek and Roman times, consult e.g. Grote, Holm, and Mommsen. A succinct account of the prehistoric archaeology of the island is given in Burrows, The Discoveries in Crete, and Bailkie, The Sea Kings of Crete.``20';
isbe[2412]='Crib`(\'ebhuc): "Crib" translates the Hebrew word \'ebhuc exactly, as it denotes "a barred receptacle for fodder used in cowsheds and foldyards; also in fields, for beasts lying out in the winter." The Hebrew is from a word meaning to feed (\'abhac), and is used in the precise sense of the English word in <a onClick="return mV(\'Job\',39,9);">Job 39:9</a> of the "crib" of the wild ox, in <a onClick="return mV(\'Pro\',14,4);">Pr 14:4</a>, "Where no oxen are, the crib is clean," and in <a onClick="return mV(\'Isa\',1,3);">Isa 1:3</a>, "The ox knoweth his owner, and the ass his master\'s crib."``1';
isbe[2413]='Cricket`krik\'-et (chargol): This occurs in <a onClick="return mV(\'Lev\',11,22);">Le 11:22</a> (the King James Version "beetle"), and doubtless refers to some kind of locust or grasshopper.`<a href="./study/isbe/search.html?string=BEETLE">BEETLE</a>; <a href="./study/isbe/search.html?string=LOCUST">LOCUST</a>; <a href="./study/isbe/search.html?string=INSECTS">INSECTS</a>`1';
isbe[2414]='Crier`kri\'-er (qara\'; compare boao):<P>(1) Neither is this exact word found in English Versions of the Bible, nor a word exactly corresponding to it in the Hebrew Bible, but the character it stands for appears as "one who cries aloud," i.e., proclaims mandates or gives public messages. In <a onClick="return mV(\'Pro\',1,21);">Pr 1:21</a> it is said, "She (Wisdom) crieth in the chief place of concourse." John the Baptist calls himself "the voice of one crying in the wilderness" (<a onClick="return mV(\'Jhn\',1,23);">Joh 1:23</a>)—like a herald going before the king.<P>(2) In the East today every village even has its public crier, selected for his loud or penetrating voice, and appointed to give notice of the fresh orders or mandates of the mudir ("governor") or other authorities. The muezzin of the Moslems, who at the five appointed times of prayer mounts the minaret and calls the faithful to prayer, is another striking example. Something like the ancient "heralds" of the king were the "heralds" of the Middle Ages in Europe who, preceded by trumpeters, made official proclamations:``47';
isbe[2415]='Crime; Crimes`krim, krimz: This. term is used in English as the equivalent of the Hebrew mishpat, "judgment," "verdict" (<a onClick="return mV(\'Eze\',7,23);">Eze 7:23</a>); zimmah, "a heinous crime" (<a onClick="return mV(\'Job\',31,11);">Job 31:11</a>); \'asham = "a fault," "sin" (<a onClick="return mV(\'Gen\',26,10);">Ge 26:10</a>, English Versions of the Bible "guiltiness"); and Greek aitia, "case," "cause" (<a onClick="return mV(\'Act\',25,27);">Ac 25:27</a>, the Revised Version (British and American) "charges"). In the King James Version <a onClick="return mV(\'Jhn\',18,38);">Joh 18:38</a>; <a onClick="return mV(\'Jhn\',19,4,6);">19:4, 6</a>, the rendition is "fault."<P>egklema, "indictment," "charge" (<a onClick="return mV(\'Act\',25,16);">Ac 25:16</a> the King James Version) is changed in the Revised Version (British and American) to "matter." A crime is a transgression against the public right; serious offense against the law; a base weakness or iniquity, all of which are regarded by the Bible as offenses against<P class="in15">(1) God, or<P class="in15">(2) man, or<P class="in15">(3) both.<P>An injury to the creature is regarded as obnoxious to the Creator. Specific forms of crime are the following:<P><a href="./study/isbe/search.html?string=ADULTERY"><b>Adultery</b></a>. See separate article.<P><a href="./study/isbe/search.html?string=ASSASSINATION"><b>Assassination</b></a>.<p>This term does not occur in the English Versions of the Bible, but, of course, is included in the more general "to kill," or "to slay" (haragh = "to smite with deadly intent" "destroy," "kill," "murder," "put to death"). The law distinguished between unpremeditated and premeditated slaying, pronouncing a curse upon the latter (<a onClick="return mV(\'Deu\',27,25);">De 27:25</a>). David expresses the deepest abhorrence of such an act (<a onClick="return mV(\'2Sa\',4,\'9-12\');">2Sa 4:9-12</a>). Instances are found recorded in <a onClick="return mV(\'Jdg\',3,\'15-22\');">Jud 3:15-22</a>; <a onClick="return mV(\'2Sa\',3,27);">2Sa 3:27</a>; <a onClick="return mV(\'2Sa\',4,\'5-7\');">4:5-7</a>; <a onClick="return mV(\'2Sa\',13,28,29);">13:28-29</a>; <a onClick="return mV(\'2Sa\',20,9,10);">20:9-10</a>; <a onClick="return mV(\'2Ki\',12,20);">2Ki 12:20</a>; <a onClick="return mV(\'2Ki\',19,37);">19:37</a>; <a onClick="return mV(\'Isa\',37,38);">Isa 37:38</a>. See also separate article.<P><b>Bestiality</b>.<p>According to Webster: "unnatural connection with a beast." This form of vice was treated by the Mosaic law as something exceedingly loathsome and abhorrent, calling for extreme language in its description and rigorous measures in its punishment. Both the beast and the guilty human were to be put to death (<a onClick="return mV(\'Exd\',22,19);">Ex 22:19</a>; <a onClick="return mV(\'Lev\',18,23);">Le 18:23</a>; <a onClick="return mV(\'Lev\',20,15,16);">20:15-16</a>; <a onClick="return mV(\'Deu\',27,21);">De 27:21</a>), in order, as the Talmud says, to obliterate all memory of the crime.<P><a href="./study/isbe/search.html?string=BLASPHEMY"><b>Blasphemy</b></A>. See separate article.<p><b>Breach of Covenant</b><P>Breach of Covenant (parar \'eth ha-berith). According to Poucher (HDB, article "Crimes"), this term included:<P class="in15">(1) failure to observe the Day of Atonement (<a onClick="return mV(\'Lev\',23,29);">Le 23:29</a>); work on that day (<a onClick="return mV(\'Lev\',23,28);">Le 23:28</a>);<P class="in15">(2) sacrifice of children to Moloch (<a onClick="return mV(\'Lev\',20,3);">Le 20:3</a>);<P class="in15">(3) neglect of circumcision (<a onClick="return mV(\'Gen\',17,14);">Ge 17:14</a>; <a onClick="return mV(\'Exd\',4,26);">Ex 4:26</a>);<P class="in15">(4) unauthorized manufacture of the holy oil (<a onClick="return mV(\'Exd\',30,33);">Ex 30:33</a>);<P class="in15">(5) anointing an alien therewith (<a onClick="return mV(\'Exd\',30,33);">Ex 30:33</a>);<P class="in15">(6) neglect of the Passover (<a onClick="return mV(\'Num\',9,13);">Nu 9:13</a>).<P>Note also the following: <a onClick="return mV(\'Gen\',17,14);">Ge 17:14</a>; <a onClick="return mV(\'Lev\',26,\'15-44\');">Le 26:15-44</a>; <a onClick="return mV(\'Deu\',29,25);">De 29:25</a>; <a onClick="return mV(\'Deu\',31,16,20);">31:16, 20</a>. Paul (<a onClick="return mV(\'Rom\',1,31);">Ro 1:31</a>) speaks of asunthetoi = "Convenant—breakers."<P><b>Breach of Ritual</b>.<p>A term not found in the Scriptures, but designed to cover a number of acts prohibited by the ceremonial law. They have been exhaustively enumerated by Poucher (HDB, article "Crimes"):<P class="in15">(1) eating blood, whether of fowl or beast (<a onClick="return mV(\'Lev\',7,27);">Le 7:27</a>; <a onClick="return mV(\'Lev\',17,14);">17:14</a>);<P class="in15">(2) eating fat of the beast of sacrifice (<a onClick="return mV(\'Lev\',7,25);">Le 7:25</a>);<P class="in15">(3) eating leavened bread during the Passover (<a onClick="return mV(\'Exd\',12,15,19);">Ex 12:15, 19</a>);<P class="in15">(4) failure to bring an offering when an animal is slaughtered for food (<a onClick="return mV(\'Lev\',17,4);">Le 17:4</a>);<P class="in15">(5) offering sacrifice while the worshipper is under the ban of uncleanness. (<a onClick="return mV(\'Lev\',7,20,21);">Le 7:20-21</a>; <a onClick="return mV(\'Lev\',22,3,4,9);">22:3-4, 9</a>);<P class="in15">(6) making holy ointment for private use (<a onClick="return mV(\'Exd\',30,32,33);">Ex 30:32-33</a>);<P class="in15">(7) using the same for perfume (<a onClick="return mV(\'Exd\',30,38);">Ex 30:38</a>);<P class="in15">(8) neglect of purification in general (<a onClick="return mV(\'Num\',19,13,20);">Nu 19:13, 20</a>);<P class="in15">(9) slaughtering an animal for food away from the door of the tabernacle (<a onClick="return mV(\'Lev\',17,4,9);">Le 17:4, 9</a>); even the alien must comply, so that the introduction of worship at other places might be avoided;<P class="in15">(10) touching holy things illegally (<a onClick="return mV(\'Num\',4,16,20);">Nu 4:16, 20</a> the Revised Version (British and American) "the sanctuary").<P>The punishment for the non-observance of these prohibitions was the "cutting off" from the transgressor\'s people (nikhrath miqqerebh = "cut off from among," i.e. excommunicated).<P><b>Breach of Trust</b>. See <a href="./study/isbe/search.html?string=TRUST,+BREACH+OF">TRUST, BREACH OF</A>.<P><a href="./study/isbe/search.html?string=BRIBERY"><b>Bribery</b></a>. See separate article.<P><a href="./study/isbe/search.html?string=CRIMES"><b>Burglary</b></A>.<p>This term does not occur. The corresponding act is defined as "thievery accompanied by breaking," and it places the offender beyond protection from violence (<a onClick="return mV(\'Exd\',22,2);">Ex 22:2</a>). The crime might be committed in various degrees, and to burglarize the "devoted things" was punishable by death (<a onClick="return mV(\'Jos\',7,25);">Jos 7:25</a>), as was also man-stealing (<a onClick="return mV(\'Exd\',21,16);">Ex 21:16</a>; <a onClick="return mV(\'Deu\',24,7);">De 24:7</a>).<P><a href="./study/isbe/search.html?string=DEBT"><b>Debt</b></a>. See separate article.<P><a href="./study/isbe/search.html?string=DECEPTION"><b>Deception</b></a>. See separate article.<P><a href="./study/isbe/search.html?string=DISOBEDIENCE"><b>Disobedience</b></a>. See separate article.<P><a href="./study/isbe/search.html?string=DIVINATION"><b>Divination</b></a>. See separate article.<P><a href="./study/isbe/search.html?string=DRUNKENNESS"><b>Drunkenness</b></a>. See separate article.<p><p>Evil Speaking, (Slander)</b>. See <a href="./study/isbe/search.html?string=EVIL-SPEAKING"><b>SPEAKING EVIL;</b> <a href="./study/isbe/search.html?string=SLANDER">Slander</a>.<P><b>Falsehood</b>.<p>Occurs as the rendition of ma\'al = "treachery," "sin," "trespass" (<a onClick="return mV(\'Job\',21,34);">Job 21:34</a>); and of sheqer = "a sham," "deceit," "lying" (<a onClick="return mV(\'2Sa\',18,13);">2Sa 18:13</a>; <a onClick="return mV(\'Psa\',7,14);">Ps 7:14</a>; <a onClick="return mV(\'Psa\',119,118);">119:118</a>; <a onClick="return mV(\'Psa\',144,8,11);">144:8, 11</a>; <a onClick="return mV(\'Isa\',28,15);">Isa 28:15</a>; <a onClick="return mV(\'Isa\',57,4);">57:4</a>; <a onClick="return mV(\'Isa\',59,13);">59:13</a>; <a onClick="return mV(\'Jer\',10,14);">Jer 10:14</a>; <a onClick="return mV(\'Jer\',13,25);">13:25</a>; <a onClick="return mV(\'Hsa\',7,1);">Ho 7:1</a>; <a onClick="return mV(\'Mic\',2,11);">Mic 2:11</a>). In every case willful perversion of the truth or preference for the untruth is at least presupposed, hence, falsehood always marks an evil disposition, enmity against truth, and hence, against God; consequently is criminal in the fullest sense.<P><b>False Swearing</b>.<p>"Swearing to a lie or falsehood" (sheqer) is mentioned in <a onClick="return mV(\'Lev\',6,3,5);">Le 6:3, 5</a>; <a onClick="return mV(\'Lev\',19,12);">19:12</a>; <a onClick="return mV(\'Jer\',5,2);">Jer 5:2</a>; <a onClick="return mV(\'Jer\',7,9);">7:9</a>; <a onClick="return mV(\'Hsa\',10,4);">Ho 10:4</a>; <a onClick="return mV(\'Zec\',5,4);">Zec 5:4</a>. From these passages and their context, it appears that this crime was considered in the twofold sense of a wrong against<P class="in15">(1) the neighbor, and<P class="in15">(2) against God, for the oath was an appeal to God as a witness to the truthfulness of the statement; hence, to swear falsely was to represent God as supporting a false statement.<P><b>Fornication</b>.<p>Hebrew, zanah = "to commit adultery," especially of the female, and less frequently of mere fornication, seldom of involuntary ravishment; also used figuratively in the sense of idolatry, the Jewish people being regarded as the spouse of Yahweh (<a onClick="return mV(\'2Ch\',21,11);">2Ch 21:11</a>; <a onClick="return mV(\'Isa\',23,17);">Isa 23:17</a>; <a onClick="return mV(\'Eze\',16,26);">Eze 16:26</a>). Once we find the derivative noun taznuth (<a onClick="return mV(\'Eze\',16,29);">Eze 16:29</a>). In the New Testament, with both the literal and the figurative application, we find porneia, and porneuo (<a onClick="return mV(\'Mat\',5,32);">Mt 5:32</a>; <a onClick="return mV(\'Mat\',15,19);">15:19</a>; <a onClick="return mV(\'Jhn\',8,41);">Joh 8:41</a>; <a onClick="return mV(\'Act\',15,20);">Ac 15:20</a>; <a onClick="return mV(\'1Cr\',5,1);">1Co 5:1</a>; <a onClick="return mV(\'1Cr\',6,13,18);">6:13, 18</a>; <a onClick="return mV(\'1Cr\',7,2);">7:2</a>; <a onClick="return mV(\'1Cr\',10,8);">10:8</a>; <a onClick="return mV(\'2Cr\',12,21);">2Co 12:21</a>; <a onClick="return mV(\'Gal\',5,19);">Ga 5:19</a>; <a onClick="return mV(\'Eph\',5,3);">Eph 5:3</a>; <a onClick="return mV(\'Col\',3,5);">Col 3:5</a>; <a onClick="return mV(\'1Th\',4,3);">1Th 4:3</a>; <a onClick="return mV(\'Rev\',2,14,20,21);">Re 2:14, 20-21</a>; <a onClick="return mV(\'Rev\',9,21);">9:21</a>; <a onClick="return mV(\'Rev\',14,8);">14:8</a>; <a onClick="return mV(\'Rev\',17,2,4);">17:2, 4</a>). The intensive ekporneuo = "to be utterly unchaste" is found in <a onClick="return mV(\'Jud\',1,7);">Jude 1:7</a>. Every form of unchastity is included in the term "fornication."<P><a href="./study/isbe/search.html?string=FORSWEAR"><b>Forswear</b></A>.<p>Found only in <a onClick="return mV(\'Mat\',5,33);">Mt 5:33</a> in the sense of committing perjury (epiorkeo).<P><b>Harlotry</b>.<p>The avocational or at least habitual, notorious practice of unchastity. In most instances the ordinary term for unchaste living, zanah, is employed (<a onClick="return mV(\'Gen\',34,31);">Ge 34:31</a>; <a onClick="return mV(\'Gen\',38,15,24);">38:15, 24</a>; <a onClick="return mV(\'Lev\',21,14);">Le 21:14</a>; <a onClick="return mV(\'Jos\',2,1);">Jos 2:1</a> (Rahab); <a onClick="return mV(\'Jdg\',11,1);">Jud 11:1</a>; <a onClick="return mV(\'Jdg\',16,1);">16:1</a>; <a onClick="return mV(\'1Ki\',3,16);">1Ki 3:16</a>; <a onClick="return mV(\'Pro\',7,10);">Pr 7:10</a>; <a onClick="return mV(\'Pro\',29,3);">29:3</a>; <a onClick="return mV(\'Jer\',5,7);">Jer 5:7</a>; <a onClick="return mV(\'Amo\',7,17);">Am 7:17</a>). For the publicly known woman of the street and the professional devotee in the pagan temple-worship, the term kedheshah, was employed (<a onClick="return mV(\'Gen\',38,21,22);">Ge 38:21-22</a> the King James Version; <a onClick="return mV(\'Hsa\',4,14);">Ho 4:14</a>). The Greek porne, occurs in <a onClick="return mV(\'Mat\',21,31);">Mt 21:31</a>f; <a onClick="return mV(\'Luk\',15,30);">Lu 15:30</a>; <a onClick="return mV(\'1Cr\',6,15,16);">1Co 6:15-16</a>; <a onClick="return mV(\'Hbr\',11,31);">Heb 11:31</a>; <a onClick="return mV(\'Jam\',2,25);">Jas 2:25</a>. Figurative: Often used metaphorically of idolatry or any defection from the Divine covenant, and applied particularly to Jerusalem (<a onClick="return mV(\'Isa\',1,21);">Isa 1:21</a>); the Jewish nation (<a onClick="return mV(\'Jer\',2,20);">Jer 2:20</a>; <a onClick="return mV(\'Jer\',3,1,6);">3:1, 6</a>ff; often in <a onClick="return mV(\'Eze\',16,\'1-\');">Eze 16</a> and <a onClick="return mV(\'Eze\',23,\'1-\');">Eze 23</a>; <a onClick="return mV(\'Mic\',1,7);">Mic 1:7</a>); Israel (<a onClick="return mV(\'Hsa\',4,15);">Ho 4:15</a>); Nineveh (<a onClick="return mV(\'Nah\',3,4);">Na 3:4</a>); Tyro, with reference to the various arts employed to renew her commerce (<a onClick="return mV(\'Isa\',23,16);">Isa 23:16</a>) and to her restored traffic (<a onClick="return mV(\'Isa\',23,17);">Isa 23:17</a>); and to antiChristian "Babylon" (<a onClick="return mV(\'Rev\',17,5,15);">Re 17:5, 15</a>; <a onClick="return mV(\'Rev\',19,2);">19:2</a>). See also <a href="./study/isbe/search.html?string=FORNICATION">Fornication</a>.<P><a href="./study/isbe/search.html?string=HOMICIDE"><b>Homicide</b></a>. See separate article.<P>"<a href="./study/isbe/search.html?string=MANSLAYER"><b>Manslayer</b></a>"<p>(ratsach, "to dash in pieces," "to kill," "to murder"; Greek androphonos, with the same meaning): Mentioned in <a onClick="return mV(\'Num\',35,6,12);">Nu 35:6, 12</a>; <a onClick="return mV(\'1Ti\',1,9);">1Ti 1:9</a>. The Hebrew law distinguished between the premeditated and the unpremeditated slaying. See separate article.<P><a href="./study/isbe/search.html?string=IDOLATRY"><b>Idolatry</b></a>. See separate article.<P><b>Ill-treatment of Parents</b>. (<a onClick="return mV(\'Exd\',21,15,17);">Ex 21:15, 17</a>; <a onClick="return mV(\'Lev\',20,9);">Le 20:9</a>; <a onClick="return mV(\'Deu\',21,18);">De 21:18</a>ff). See below.<P><b>Injuries to the Person </b>(<a onClick="return mV(\'Exd\',21,18);">Ex 21:18</a>ff; <a onClick="return mV(\'Lev\',24,19);">Le 24:19</a>f; <a onClick="return mV(\'Deu\',25,11);">De 25:11</a>).<P><b>Irreverence</b>.<p>Lack of respect for God or His natural representatives, the parents or governmental officers. See also Parents, Crimes against; <a href="./study/isbe/search.html?string=BLASPHEMY">Blasphemy</a>.<P><b>Incest</b>.<p>Designated in Hebrew by zimmah, "vice," "wickedness," "refined immorality" (<a onClick="return mV(\'Lev\',18,17);">Le 18:17</a>; <a onClick="return mV(\'Lev\',20,14);">20:14</a>); also "unnatural vice," tebhel, the same word that is used to designate the unnatural commingling with beasts. Amnon\'s deed is designated as checedh, indicating the degradation of the tenderness natural between brothers and sisters into a tenderness of an immoral character (<a onClick="return mV(\'2Sa\',13,\'1-\');">2Sa 13</a>). The crime of sexual relation of persons within the degrees of relationship forbidden by the Levitical law, as for instance, that of Lot\'s daughters with their father (<a onClick="return mV(\'Gen\',19,33);">Ge 19:33</a>); the son with his father\'s concubines, as for instance, Reuben (<a onClick="return mV(\'Gen\',35,22);">Ge 35:22</a>), and Absalom (<a onClick="return mV(\'2Sa\',16,22);">2Sa 16:22</a>; compare <a onClick="return mV(\'1Cr\',5,1);">1Co 5:1</a>); that of the father-in-law with his daughter-in-law (<a onClick="return mV(\'Gen\',38,15);">Ge 38:15</a>ff; compare <a onClick="return mV(\'Eze\',22,11);">Eze 22:11</a>); of the brother with the sister or half-sister, as for instance, Amnon (<a onClick="return mV(\'2Sa\',13,14);">2Sa 13:14</a>); of the brother-in-law with the sister-in-law (<a onClick="return mV(\'Mat\',14,3);">Mt 14:3</a>); with the wife\'s mother, or the wife\'s daughter while living in apparent marriage with the mother (<a onClick="return mV(\'Lev\',20,14);">Le 20:14</a>; <a onClick="return mV(\'Lev\',18,17);">18:17</a>). Illicit relation with the brother\'s widow is designated (<a onClick="return mV(\'Lev\',20,21);">Le 20:21</a>) as a disgraceful deed, literally, "uncleanness" (excepting the levirate marriage). Such acts were forbidden on the ground that the Jews were to avoid the evil practices of the Canaanites and the Egyptians in regard to marriage within the specified limits, because this would naturally result in breaking down the sanctity of the bonds connecting near relatives, and in throwing open the flood gates of immorality among them. It is the Divine plan that the unions based on mutual choice and love, mingled with carnality, shall become clarified more and more into the purer love of close consanguineal relations; not vice versa. Then, too, such provisions would secure higher results in training and in the production of mentally and physically healthy children, the balancing and evening up of contrasts of Nature, and the production of new and improved types. The principle on which the prohibitions are imposed seems to be this: Marriage is forbidden between any person and a direct ancestor or a direct descendant or any close relative, such as brother or sister of either himself or any of his ancestors or any of his immediate descendants.<P><b>Infanticide</b>.<P>This crime, in the form in which it has been and is prevalent among barbarous nations, seems to have been quite foreign to the minds of the Hebrews, for they had too lofty a conception of the value of human life, and children were considered a blessing; their absence in the home, a curse (compare <a onClick="return mV(\'Exd\',1,17,21);">Ex 1:17, 21</a>; <a onClick="return mV(\'Psa\',127,\'1-\');">Ps 127</a>; <a onClick="return mV(\'Psa\',128,\'1-\');">Ps 128</a>). For this reason, there appeared to be no reason to prohibit it by law, except as the Israelites might be influenced to sacrifice their children to Molech when following the religious customs of the Canaanites. See <a href="./study/isbe/search.html?string=MOLECH">MOLECH</a>.<P><b>Kidnapping (Man-Stealing)</b>.<p>andrapodistes = "man-stealer," "slave-dealer" (<a onClick="return mV(\'1Ti\',1,10);">1Ti 1:10</a>). This was a mortal offense; but it seems that it, like some other forms of iniquity, was unknown to the Hebrews, except as they came in contact with it through their intercourse with other nations, such as the Romans and the Greeks, whose mythology frequently alludes to such acts. <a href="./study/isbe/search.html?string=LIE+LYING">Lying</a>, <a href="./study/isbe/search.html?string=Malice">Malice</a>, Manslaughter, <a href="./study/isbe/search.html?string=MURDER">Murder</a>, <a href="./study/isbe/search.html?string=Oath">Oath</a>. See separate articles.<P><b>Parents, Crimes Against</b>.<p>The law enjoined upon the infant all the reverence toward his parents, especially the father, that he could bestow on a merely human being. The reason for this lay in the fact that the heads of families were expected to transmit the Divine law to their household, and thus to stand in the place of God. That the mother was to share this reverence practically on equal terms with the father is shown by the fact that each is mentioned separately whenever obedience and reverence are enjoined upon the child (<a onClick="return mV(\'Deu\',5,16);">De 5:16</a>). As the specific crime against Yahweh consisted in blasphemy and open rebellion against the law, so the crime against parents consisted in deliberate disobedience and stubbornness (<a onClick="return mV(\'Deu\',21,18);">De 21:18</a>). And here again both the father and the mother are directed to lay hands upon him and bring him unto the elders for punishment. How greatly such conduct was held in horror is seen in many of the Proverbs, especially <a onClick="return mV(\'Pro\',30,17);">Pro 30:17</a>. It would be hard to specify all the acts which, in view of the above, would be considered crimes against the parents, but it is evident that everything which would lower their dignity and influence or violate their sense of just recognition must be carefully avoided, as witness the curse visited upon Ham (<a onClick="return mV(\'Gen\',9,\'20-27\');">Ge 9:20-27</a>).<P><b>Perjury</b>.<p>See <a href="./study/isbe/search.html?string=FALSE+SWEARING">False Swearing</a>; <a href="./study/isbe/search.html?string=FORSWEAR">Forswear</a> above; also article <a href="./study/isbe/search.html?string=OATH">OATH</a>.<P><a href="./study/isbe/search.html?string=PROPHESYINGS,+FALSE"><b>Prophesying, False</b></a>.<p>By reason of his position as the recognized mouthpiece of Yahweh, the prophet\'s word was weighty in influence; hence, to prophesy falsely was equivalent to practicing fraud publicly. Jeremiah described the condition as "wonderful and horrible," which made such things possible (<a onClick="return mV(\'Jer\',5,30,31);">Jer 5:30-31</a>). See also <a onClick="return mV(\'Jer\',23,32);">Jer 23:32</a>; <a onClick="return mV(\'Jer\',29,8,9);">29:8-9</a>; <a onClick="return mV(\'Eze\',21,23);">Eze 21:23</a>; <a onClick="return mV(\'Zec\',10,2);">Zec 10:2</a>; <a onClick="return mV(\'Mat\',7,15);">Mt 7:15</a>; <a onClick="return mV(\'Mat\',24,11,24);">24:11, 24</a>; <a onClick="return mV(\'Mar\',13,22);">Mr 13:22</a>; <a onClick="return mV(\'Luk\',6,26);">Lu 6:26</a>; <a onClick="return mV(\'Act\',13,6);">Ac 13:6</a> (Bar-Jesus); <a onClick="return mV(\'2Pe\',2,1);">2Pe 2:1</a>; <a onClick="return mV(\'1Jo\',4,1);">1Joh 4:1</a>; <a onClick="return mV(\'Rev\',16,13);">Re 16:13</a>; <a onClick="return mV(\'Rev\',19,20);">19:20</a>; <a onClick="return mV(\'Rev\',20,10);">20:10</a>. See also <a href="./study/isbe/search.html?string=PROPHESYINGS,+FALSE">separate article</a>.<P><a href="./study/isbe/search.html?string=PROSTITUTION"><b>Prostitution</b></a>.<P>Hebrew and Christian morality never condoned this practice, though the Bible recognizes its existence as a fact even among God\'s people. The Hebrew father was forbidden (<a onClick="return mV(\'Lev\',19,29);">Le 19:29</a>) to give his daughter over to a life of shame (chalal, "to profane a person, place or thing," "to pollute"). See also Fornication, Harlotry, and Whoredom below.<P><b>Rape</b>.<P>chazak = "to seize," "bind," "restrain," "conquer," "force," "ravish." The punishment for this crime was greater when the act was committed against a betrothed woman (<a onClick="return mV(\'Deu\',22,\'25-29\');">De 22:25-29</a>). See also Seduction.<P><b>Removing Landmarks</b>. (<a onClick="return mV(\'Deu\',19,14);">De 19:14</a>). See <a href="./study/isbe/search.html?string=LANDMARK">LANDMARK</a>.<P><b>Reviling</b> (<a onClick="return mV(\'Exd\',22,28);">Ex 22:28</a>).<P>See Irreverence above and article <a href="./study/isbe/search.html?string=REVILE">REVILE</a>.<P><a href="./study/isbe/search.html?string=ROBBERY">Robbery</a>.<P>gazal = "to pluck off," "strip," "rob," "take away by force or violence"; forbidden in the law and frequently referred to as despicable (<a onClick="return mV(\'Lev\',19,13);">Le 19:13</a>; <a onClick="return mV(\'Lev\',26,22);">26:22</a>; <a onClick="return mV(\'1Sa\',23,1);">1Sa 23:1</a>; <a onClick="return mV(\'Pro\',22,22);">Pr 22:22</a>; <a onClick="return mV(\'Isa\',10,2,13);">Isa 10:2, 13</a>; <a onClick="return mV(\'Isa\',17,14);">17:14</a>; <a onClick="return mV(\'Eze\',33,15);">Eze 33:15</a>; <a onClick="return mV(\'Eze\',39,10);">39:10</a>; <a onClick="return mV(\'Mal\',3,8,9);">Mal 3:8-9</a>).<P><b>Sabbath-Breaking</b>.<P>As the Hebrew Sabbath was regarded as a day of rest, all acts absolutely unnecessary were considered a violation, a "breaking" of the Sabbath, which appears sufficiently from the commandment (<a onClick="return mV(\'Exd\',20,\'8-11\');">Ex 20:8-11</a>); and the head of the household was held responsible for the keeping of this commandment on the part of all sojourners under his roof.<P>No other law gave the sophistical legalists of later Judaism so much opportunity for hair-splitting distinctions as did this. In answer to the question what labors were forbidden, they mentioned 39 specific forms of work, and then proceeded to define what constituted each particular form. But as even these definitions would not cover all possible questions, special precepts were invented. In order that one might not be caught in the midst of unfinished labors, when the Sabbath began (at sunset), certain forms of work must not be undertaken on Friday. Thus it was forbidden to fry meat, onions or eggs, if there was not sufficient time for them to be fully cooked before evening. No bread, no cakes, must be put into the oven, if there was not sufficient time remaining for their surface to brown before night.<P>See <a href="./study/isbe/search.html?string=SABBATH">SABBATH</a>.<P><b>Seduction</b>.<P>ta\'ah, "to dissemble," "seduce," and Ta\'ah, with the same meaning; apoplanao, "to lead astray"; planao, "to go astray," "deceive," "err," "seduce"; and goes, "a wizard," "an impostor," "seducer." In all the passages in which the idea of seduction is expressed in the English the term is used not in the modern sense of a trespass against a woman\'s person, but in the more general and figurative sense of leading into sin generally (<a onClick="return mV(\'2Ki\',21,9);">2Ki 21:9</a>; <a onClick="return mV(\'Pro\',12,26);">Pr 12:26</a> the King James Version.; <a onClick="return mV(\'Isa\',19,13);">Isa 19:13</a> the King James Version; <a onClick="return mV(\'Eze\',13,10);">Eze 13:10</a>; <a onClick="return mV(\'Mar\',13,22);">Mr 13:22</a> the King James Version; <a onClick="return mV(\'2Ti\',3,13);">2Ti 3:13</a> the King James Version; <a onClick="return mV(\'1Jo\',2,26);">1Jo 2:26</a> the King James Version; <a onClick="return mV(\'Rev\',2,20);">Re 2:20</a>). However, the modern English idea of the word is expressed in the law found in <a onClick="return mV(\'Exd\',22,16,17);">Ex 22:16-17</a>.<P><a href="./study/isbe/search.html?string=SLANDER"><b>Slander</b></a>. See separate article.<P><a href="./study/isbe/search.html?string=SODOMY"><b>Sodomy</b></a>. See <a href="./study/isbe/search.html?string=UNNATURAL+VICE">Unnatural Vice</a>.<P><b>Speaking Evil</b>.<P>"To bring an evil (ra\') name upon" (<a onClick="return mV(\'Deu\',19,15);">De 19:15</a>; <a onClick="return mV(\'1Ki\',22,23);">1Ki 22:23</a>; <a onClick="return mV(\'Psa\',34,13);">Ps 34:13</a>; <a onClick="return mV(\'Psa\',41,5);">41:5</a>; <a onClick="return mV(\'Psa\',50,19);">50:19</a>; <a onClick="return mV(\'Psa\',109,20);">109:20</a>; <a onClick="return mV(\'Psa\',140,11);">140:11</a>; <a onClick="return mV(\'Pro\',15,28);">Pr 15:28</a>; <a onClick="return mV(\'Pro\',16,30);">16:30</a>). Evil speaking is considered a crime because it is simply the expression of the evil intents of the heart. This is brought out more clearly in the New Testament (<a onClick="return mV(\'Mat\',7,17,18);">Mt 7:17-18</a>; <a onClick="return mV(\'Mat\',12,34,35);">12:34-35</a>; <a onClick="return mV(\'Mar\',9,39);">Mr 9:39</a>; <a onClick="return mV(\'Luk\',6,45);">Lu 6:45</a>). As such, evil speaking (blasphemia) is represented as entirely unworthy a Christian character (<a onClick="return mV(\'Eph\',4,31);">Eph 4:31</a>; <a onClick="return mV(\'1Pe\',4,4,14);">1Pe 4:4, 14</a>; <a onClick="return mV(\'2Pe\',2,2,10,12);">2Pe 2:2, 10, 12</a>; <a onClick="return mV(\'Jam\',4,11);">Jas 4:11</a>; <a onClick="return mV(\'Jud\',1,10);">Jude 1:10</a>); and katalaleo = "babble against," "gossip." It will be noticed from the above that evil speaking against those in authority is designated with the same word ("blasphemy") as raillery against God, they being considered God\'s representatives on earth. See also <a href="./study/isbe/search.html?string=EVIL-SPEAKING">EVIL-SPEAKING</a>; <a href="./study/isbe/search.html?string=SLANDER">SLANDER</a>.<P><b>Stealing</b>.<P>Hebrew ganabh = "to thieve" (literal, or figurative); by implication, "to deceive," "carry away," "secretly bring," "steal away" (<a onClick="return mV(\'Gen\',44,8);">Ge 44:8</a>; <a onClick="return mV(\'Exd\',20,15);">Ex 20:15</a>; <a onClick="return mV(\'Exd\',21,16);">21:16</a>; <a onClick="return mV(\'Exd\',22,1);">22:1</a>; <a onClick="return mV(\'Pro\',6,30);">Pr 6:30</a>; <a onClick="return mV(\'Zec\',5,3);">Zec 5:3</a>; <a onClick="return mV(\'Gen\',31,20,26);">Ge 31:20, 26</a>f; <a onClick="return mV(\'2Sa\',15,6);">2Sa 15:6</a>; <a onClick="return mV(\'2Sa\',19,3);">19:3</a>; <a onClick="return mV(\'Job\',27,20);">Job 27:20</a>; <a onClick="return mV(\'Pro\',9,17);">Pr 9:17</a> ("Stolen waters are sweet"; the forbidden is attractive; compare <a onClick="return mV(\'Rom\',7,7);">Ro 7:7</a>)). Greek klepto = "to filch," "steal" (<a onClick="return mV(\'Mat\',6,19,20);">Mt 6:19-20</a>; <a onClick="return mV(\'Mat\',19,18);">19:18</a>; <a onClick="return mV(\'Jhn\',10,10);">Joh 10:10</a>; <a onClick="return mV(\'Rom\',2,21);">Ro 2:21</a>; <a onClick="return mV(\'Rom\',13,9);">13:9</a>; <a onClick="return mV(\'Eph\',4,28);">Eph 4:28</a>). See <a href="./study/isbe/search.html?string=THEFT">Theft</A>.<P><b>Suicide</b>.<P>No special law is found against this crime, for it is included in the prohibition against killing. Contrary to the practice and the philosophy of paganism, the act was held in deep abhorrence by the Hebrews because of the high value placed on human life. It was held inexcusable that any but the most degraded and satanic should lay hands on their own lives. Only the remorse of the damned could drive one to it, as witness Saul (<a onClick="return mV(\'1Sa\',31,4);">1Sa 31:4</a>) and Judas (<a onClick="return mV(\'Mat\',27,5);">Mt 27:5</a>).<P><b>Theft</b>.<P>Hebrew genebhah "stealing" (concrete), "something stolen," "theft" (<a onClick="return mV(\'Exd\',22,3,4);">Ex 22:3-4</a>); mentioned in connection with other wickedness (klope) in <a onClick="return mV(\'Mat\',15,19);">Mt 15:19</a>; <a onClick="return mV(\'Mar\',7,21);">Mr 7:21</a>; and (klemma) in <a onClick="return mV(\'Rev\',9,21);">Re 9:21</a>. All three words are used abstractly for the act and concretely for the thing stolen. See <a href="./study/isbe/search.html?string=THIEF">THIEF</a>.<P>Unchastity. No other form of sin is mentioned with disapproval and threats more frequently than the various forms of carnal vice, for no other sin is more natural or widespread. See <a href="./study/isbe/search.html?string=CHASTITY">CHASTITY</a>; <a href="./study/isbe/search.html?string=LEWDNESS">LEWDNESS</a>; <a href="./study/isbe/search.html?string=MARRIAGE">MARRIAGE</a>.<P><b>Unnatural Vice (Sodomy)</b>.<P>Alluded to with delicacy, but positively condemned as an abomination (<a onClick="return mV(\'Gen\',13,13);">Ge 13:13</a>; <a onClick="return mV(\'Gen\',19,5,7);">19:5, 7</a>; <a onClick="return mV(\'Lev\',18,22);">Le 18:22</a>; <a onClick="return mV(\'Lev\',20,13);">20:13</a>). It was the specific form of wickedness through which Sodom became notorious, so that "sodomite" is the regular translation of qadhesh, "a (quasi) sacred person," i.e. (technically) "a (male or female) devotee to licentious idolatry" (<a onClick="return mV(\'Deu\',23,17);">De 23:17</a>; <a onClick="return mV(\'1Ki\',14,24);">1Ki 14:24</a>; <a onClick="return mV(\'1Ki\',15,12);">15:12</a>; <a onClick="return mV(\'1Ki\',22,46);">22:46</a>; <a onClick="return mV(\'2Ki\',23,7);">2Ki 23:7</a>; <a onClick="return mV(\'Job\',36,14);">Job 36:14</a> margin). Though permitted and even encouraged in heathen cult, it was never to be tolerated in the worship of Yahweh.<
