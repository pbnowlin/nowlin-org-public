isbe[2422]='Criticism of the Bible`krit\'-i-siz\'-m: <b>Criticism in General</b><p><b>I. Divisions</b><P class="in15">1. Lower or Textual Criticism<P class="in15">2. Higher Criticism<p><b>II. LOWER OR TEXTUAL CRITICISM</b><P class="in15">1. Origin of the Science<P class="in15">2. Methods Employed<P class="in15">3. Causes of Error<P class="in15">4. Weighing of Authorities<P class="in30">(1) The Old Testament<P class="in60">Manuscripts and Versions<P class="in30">(2) The New Testament<P class="in60">(a) Manuscripts and Versions<P class="in60">(b) The Western Text<P class="in60">(c) Results<p><b>III. HIGHER CRITICISM</b><P class="in15">1. The Old Testament<P class="in30">(1) Astruc and Successors<P class="in30">(2) Hupfeld<P class="in30">(3) Graf and Wellhausen<P class="in30">(4) Literary and Historical Grounds of Theory<P class="in30">(5) The Codes<P class="in30">(6) Effects on History, etc.<P class="in30">(7) General Results<P class="in30">(8) Criticism of Theory<P class="in15">2. The New Testament<P class="in30">(1) The School of Baur<P class="in30">(2) Synoptical Criticism<P class="in60">(a) Oral, Documentary, and Dependence Theories<P class="in60">(b) The "Logia"<P class="in60">(c) Two-Source Theory<P class="in60">(d) Authorship—Lukan and Johannine Questions<P class="in30">(3) Modern "Critical-Historical" School<P class="in30">(4) Remaining Writings of New Testament<P><b>LITERATURE</b><hr /><P>Criticism in General:<P>So much has been said and written in recent years on "Criticism" that it is desirable that the reader should have an exact idea of what criticism is, of the methods it employs, and of the results it reaches, or believes itself to have reached, in its application to Scripture. Such a survey will show the legitimacy and indispensableness of a truly scientific criticism, at the same time that it warns against the hasty acceptance of speculative and hypothetical constructions. Criticism is more than a description of phenomena; it implies a process of sifting, testing, proving, sometimes with the result of establishing, often with that of modifying or reversing, traditional opinions. Criticism goes wrong when used recklessly, or under the influence of some dominant theory or prepossession. A chief cause of error in its application to the record of a supernatural revelation is the assumption that nothing supernatural can happen. This is the vitiating element in much of the newer criticism, both of the Old Testament and of the New Testament.<p>I. Divisions.<P>1. Lower or Textual Criticism:<P>Criticism of Scripture ("Biblical criticism") is usually divided into what is called "lower or textual criticism" and "higher criticism"—the latter a phrase round which many misleading associations gather. "Lower criticism" deals strictly with the text of Scripture, endeavoring to ascertain what the real text of each book was as it came from the hands of its author; "higher criticism" concerns itself with the resultant problems of age, authorship, sources, simple or composite character, historical worth, relation to period of origin, etc.<P>2. Higher Criticism:<P>The former—"textual criticism"—has a well-defined field in which it is possible to apply exact canons of judgment: the latter—"higher criticism"—while invaluable as an aid in the domain of Biblical introduction (date, authorship, genuineness, contents, destination, etc.), manifestly tends to widen out illimitably into regions where exact science cannot follow it, where, often, the critic\'s imagination is his only law.<P>It was only gradually that these two branches of criticism became differentiated. "Textual criticism" for long took the lead, in association with a sober form of Biblical "introduction." The relations now tend to be reversed. "Higher criticism," having largely absorbed "introduction" into itself, extends its operations into the textual field, endeavoring to get behind the text of the existing sources, and to show how this "grew" from simpler beginnings to what it now is. Here, also, there is wide opening for arbitrariness. It would be wrong, however, to deny the legitimate place of "higher criticism," or belittle the great services it is capable of rendering, because of the abuses to which it is frequently liable.<P>It is now necessary that these two forms of criticism should be looked at more particularly.<p>II. Lower or Textual Criticism.<P>1. Origin of the Science:<P>We take first lower or textual criticism. There has never been a time when criticism of Scripture—lower and higher—has been altogether absent. The Jews applied a certain criticism to their sacred writings, alike in the selection of the books, and in the settlement of the text. Examples are seen in the marginal notes to the Hebrew Scriptures (Qere and Kethibh). The Fathers of the early church compared manuscripts of the New Testament books, noting their differences, and judging of the books themselves. The Reformers, it is well known, did not accept blindly the judgments of antiquity, but availed themselves of the best light which the new learning afforded. The materials at the disposal of scholars in that age, however, were scanty, and such as existed were not used with much thoroughness or critical discernment. As aids multiplied with progress of discovery, comparison of manuscripts and versions one with another and with patristic quotations, revealed manifold divergencies and it became apparent that, in both Old Testament and New Testament, the text in current use in the church was far from perfect. "Various readings" accumulated. Not a few of these, indeed, were obvious blunders; many had little or no support in the more ancient authorities; for others, again, authority was fairly equally divided. Some were interpolations which had no right to be in the text at all. How, in these circumstances, was the true text to be ascertained? The work was one of great delicacy, and could only be accomplished by the most painstaking induction of facts, and the strictest application of sound methods. Thus arose a science of textual criticism, which, ramifying in many directions, has attained vast dimensions, and yielded an immense body of secure knowledge in its special department.<P>2. Methods Employed:<P>The materials with which textual criticism works (apparatus criticus) are, as just said, chiefly manuscripts, versions (translations into other tongues), quotations and allusions in patristic writings, with lectionaries (church service-books), and similar aids. The first step is the collection and collation of the material, to which fresh discovery is constantly adding; the noting of its peculiarities, and testing of its age and value; the grouping and designation of it for reference. A next important task is the complete collection of the "various readings" and other diversities of text (omissions, interpolations, etc.), brought to light through comparison of the material, and the endeavor to assign these to their respective causes.<P>3. Causes of Error:<P>More frequently than not errors manuscripts are unintentional, and the causes giving rise to them are sufficiently obvious. Such are the carelessness of scribes, lapses of memory, similarity of sounds (in dictation), or in shape of letters (in copying), wrong dividing of words, omission of a line or clause owing to successive lines or clauses ending with the same word. Intentional changes, again, arise from insertion in the text of marginal notes or glosses, from motives of harmonizing, from the substitution of smoother for harsher or more abrupt expressions—more rarely, from dogmatic reasons.<P>4. Weighing of Authorities:<P>Mistakes of the above kinds can generally be detected by careful scrutiny of sources, but a large number of cases remain in which the correct reading is still doubtful. These, next, have to be dealt with by the impartial weighing and balancing of authorities; a task involving new and delicate inquiries, and the application of fresh rules. It does not suffice to reckon numbers; manuscripts and versions have themselves to be tested as respects reliability and value. Through the presence of peculiarities pointing to a common origin manuscripts come to be grouped into classes and families, and their individual testimony is correspondingly discounted. Older authorities, naturally, are preferred to younger but the possibility has to be reckoned with that a later manuscript may preserve a reading which the older manuscripts have lost. Such rules obtain as that, of two readings, preference is to be given to the more difficult, as less likely to be the result of corruption. But even this has its limits, for a reading may be difficult even to the point of unintelligibility, yet may arise from a simple blunder. As a last resort, in cases of perplexity, conjectural emendation may be admitted; only, however, as yielding probability, not certainty.<P>In the application of these principles an important distinction has to be made between the Old Testament and the New Testament, arising from the relative paucity of material for critical purposes in the one case, and the abundance in the other. The subject is treated here generally; for details see articles on <a href="./study/isbe/search.html?string=LANGUAGES+OF+THE+OLD+TESTAMENT">LANGUAGES OF THE OLD TESTAMENT</a>; <a href="./study/isbe/search.html?string=LANGUAGE+OF+THE+NEW+TESTAMENT">LANGUAGE OF THE NEW TESTAMENT</a>; <a href="./study/isbe/search.html?string=TEXT+AND+MANUSCRIPTS+OF+THE+NEW+TESTAMENT">TEXT AND MANUSCRIPTS OF THE NEW TESTAMENT</a>.<P>(1) The Old Testament:<P>Manuscripts and Versions:<P>In the Old Testament, textual criticism labors under the peculiar disadvantage that, with one minute exception (a papyrus fragment of the 2nd century, giving a version of the Decalogue), all known Hebrew manuscripts are late (the oldest not going beyond the 9th century AD); further, that the manuscripts seem all to be based on one single archetype, selected by the rabbis at an early date, and thereafter adhered to by copyists with scrupulous care (compare G. A. Smith, OTJC, 69ff; Driver, Text of Sam, xxxviiff; Strack, however, dissents). The variations which these manuscripts present, accordingly, are slight and unimportant. For a knowledge of the state of the text prior to the adoption of this standard, criticism is dependent on comparison with the versions—especially the <a href="./study/isbe/search.html?string=SEPTUAGINT">SEPTUAGINT</A> (which see), with the <a href="./study/isbe/search.html?string=SAMARITAN+PENTATEUCH">SAMARITAN PENTATEUCH</a> (which see), and with parallel passages in the Old Testament itself (e.g. in Samual, Kings, Chronicles). Frequent obscurities in the Hebrew text, with undeniable discrepancies in names and numbers, show that before the fixing of the text extensive corruption had already entered. A simple instance of mistake is in <a onClick="return mV(\'Isa\',9,3);">Isa 9:3</a>, where the King James Version reads: "Thou hast multiplied the nation, and not increased the joy." The context shows that the "not" is out of place: the Revised Version (British and American) therefore rightly reads (with the Hebrew Qere: the sounds are similar), "thou hast increased their joy." In the Septuagint the divergences are often very great in order, arrangement, and readings; there are extensive interpolations and omissions (in Jeremiah, Graf reckons that 2,700 words of the Massoretic text are omitted); evidences, where the alterations are not of design, that the Hebrew manuscripts employed by the translators often differed widely from those approved in Palestine. The Samaritan recension likewise exhibits considerable differences.<P>It does not follow that, where difference exists, these rival texts are to be preferred to the Massoretic. Few, since the exhaustive examination of Gesenius, would affirm the superiority of the Samaritan to the Hebrew; even in regard to the Septuagint the trend of opinion seems increasingly in favor of the text of the Massoretes (compare Skinner, "Genesis," International Critical Commentary, xxxv-xxxvi). There is no need, however, to maintain the general superiority of the above texts to the Massoretic to be convinced that, in many instances, the Septuagint, in some cases, probably, even the Sam, has retained readings from which the Massoretic Text has departed. Old Testament criticism has, therefore, a clear field for its labors, and there can be little doubt that, in its cautious application, it has reached many sound results. Less reliance can be placed on the conjectural criticism now so largely in vogue. Dr. G. A. Smith has justly animadverted on the new textual criticism of the poetical and prophetical books, "through which it drives like a great plowshare, turning up the whole surface, and menacing not only the minor landmarks, but, in the case of the prophets, the main outlines of the field as well" (Quarterly Review, January, 1907). This, however, trenches on the domain of the higher criticism.<P>(2) The New Testament:<P>In the New Testament the materials of criticism are vastly more abundant than in the Old Testament; but, with the abundance, while a much larger area of certainty is attainable, more intricate and difficult problems also arise. The wealth of manuscripts of the whole or parts of the Greek New Testament far exceeds that existing for any other ancient writings (Nestle mentions 3,829: 127 uncials and 3,702 cursives: Introduction to the Textual Criticism of the Greek New Testament, English translation, 34-35, 81); the manuscripts of versions (excluding the Vulgate, reckoned by thousands), are likewise very numerous.<P>(a) Manuscripts and Versions:<P>Greek manuscripts are usually divided into uncials and cursives (or minuscules) from the character of the writing; the oldest uncials go back to the 4th and 5th centuries. The five chief, that alone need be named, are the Codex Sinaiticus (4th century), the Codex Vaticanus (B, 4th century), the Codex Alexandrinus (A, 5th century), the Codex Ephraemi (C, 5th century), the Codex Bezae (D, Gospels and Acts, Greek and Latin, 6th century). These manuscripts again are grouped according to affinities (Bengel, Griesbach, Lachmann, are here chief precursors; Westcott and Hort, chief modern authority), Codex Sinaiticus and Codex Vaticanus (B) going together as representing one type of text, in the opinion of Westcott and Hort, The New Testament in Greek the best (the so-called "Neutral"); Codex Bezae (D) representing a "Western" text, with marked peculiarities; A and C exhibiting mixed texts. The VSS, in turn, Syriac, Old Latin, Egyptian (originating with 2nd and 3rd centuries), present interesting problems in their relations to one another and to the Greek manuscripts Codex Sinaiticus, Codex Vaticanus, and Codex Bezae. With the Syriac versions (Sinaitic, Curetonian, Peshitta), Tatian\'s Diatessaron, or Harmony of the Gospels, ought to be mentioned. Formerly the Peshitta was taken to be the oldest Syriac version (2nd century); now, especially since the discovery of the Lewis (Sinaitic) palimpsest, it tends to be regarded as a later revision of the older Syriac texts (probably by Rabula of Edessa, beginning of the 5th century). The Old Latin, also the old Syriac, manuscripts show marked affinities with the text of Codex Bezae (D)—the "Western" type.<P>(b) The Western Text:<P>The question chiefly exercising scholars at the present time is, accordingly, the relation of the Westcott and Hort, The New Testament in the Greek text based on Codex Sinaiticus and Codex Vaticanus to the Western text represented by Codex Bezae, but now finding early support from the Old Latin and Syriac, as well as from quotations in the 2nd and 3rd Fathers. The Western text is discounted by Westcott and Hort, The New Testament in Greek for its para-phrastic character, and "astonishing freedom" in changing, inserting and omitting (Westcott-Hort, 122ff); yet, on internal grounds, certain important omissions in this text of the last three chapters of Luke are accepted by these authorities as representing the purer text, the rejected readings being termed "non-Western interpolations." A newer school, however, is disposed to accept the Western readings, as, to a much larger extent than was formerly supposed, the more original; while some writers, as Blass, Nestle, in part Zahn (compare Nestle, op. cit., 324ff), seek a solution of the difference of texts in theory of two editions (Blass, Luke and Acts; Zahn, Acts alone). This theory has not met with much acceptance, and the problems of the Western text must still be regarded as unsolved. The question is not, indeed, vital, as no important doctrine of the New Testament is affected; but it touches the genuineness of several passages to which high value is attached. E.g. the words at the Supper, "which is given for you," etc. (<a onClick="return mV(\'Luk\',22,19,20);">Lu 22:19-20</a>, not in D), are excluded by Westcott and Hort, The New Testament in Greek as a non-Western interpolation; while the passage on the angel and the bloody sweat (<a onClick="return mV(\'Luk\',22,43,44);">Lu 22:43-44</a> in both Codex Sinaiticus and Codex Bezae), and the first word on the cross, "Father, forgive them," etc. (<a onClick="return mV(\'Luk\',23,34);">Lu 23:34</a>, in Codex Sinaiticus, omitted by Codex Bezae (D) and the Sinaitic Syriac), are rejected as Western interpolations. The Revised Version (British and American) retains these passages with marginal note.<P>(c) Results:<P>As respects results, it may be said generally that the labors of a long line of scholars have given us a New Testament text on which, in nearly all essential respects, we can safely rely. Others, it is to be owned, take a less sanguine view (compare Nestle, op. cit., 227ff). The correct reading seems undeniably settled in a large majority of cases. The Revised Version (British and American) embodies most of the assured results; doubtful cases are noted in the margin. Among passages long known to be interpolations, now altogether removed, is that on the three witnesses in <a onClick="return mV(\'1Jo\',5,8);">1Jo 5:8</a>. The two longest passages noted as not belonging to the original text are the last 12 verses of Mark (<a onClick="return mV(\'Mar\',16,\'9-20\');">16:9-20</a>), and the story of the woman taken in adultery (<a onClick="return mV(\'Jhn\',7,\'53-\');">Joh 7:53</a>-<a onClick="return mV(\'Jhn\',8,\'1-11\');">8:11</a>).<p>III. Higher Criticism.<P>The scope of the higher criticism has already been indicated. Many of the inquiries it undertakes were formerly covered by what was called Biblical introduction; the flight of the newer science, however, is bolder, and the problems it seeks to solve are more complicated and far-reaching. An important part of its work is the analysis of books, with the view of determining their component parts (e.g. the J, E, P, D, of the Pentateuch), the age, origin, and characteristics of each, their connection with external conditions and the state of belief and life of the time. The nature of its task will be better understood from a rapid survey of its procedure.<P>1. The Old Testament:<P>Higher criticism began, mainly, with the Old Testament. Already in the 2nd century, Gnostics assailed the Old Testament as the work of an inferior deity (the Demiurge), and heretical Ebionites (Clementine Recognitions and Homilies) declared it to be corrupted with false prophecy. In the 17th century Spinoza prepared the way in his Tractatus (1670) for future rationalistic attacks.<P>(1) Astruc and Successors.<P>The beginning of higher criticism in the stricter sense is commonly associated with the French physician Astruc, who, in his Conjectures, in 1753, drew attention to the fact that, in some sections of Genesis, the Divine name employed is "Elohim" (God), in others, "Yahweh." This he accounted for by the use of distinct documents by Moses in the composition of the book. Eichhorn (1779), to whom the name "higher criticism" is due, supplemented Astruc\'s theory by the correct observation that this distinction in the use of the names was accompanied by other literary peculiarities. It soon became further evident that, though the distinction in the names mostly ceased after the revelation of Yahweh to Moses (<a onClick="return mV(\'Exd\',3,6);">Ex 3:6</a>), the literary peculiarities extended much farther than Genesis, indeed till the end of Joshua (Bleek, 1822; Ewald, 1831; Stahelin, 1835). Instead of a "Pentateuch," recognized as of composite authorship, there was now postulated a "Hexateuch" (see <a href="./study/isbe/search.html?string=PENTATEUCH">PENTATEUCH</a>; <a href="./study/isbe/search.html?string=HEXATEUCH">HEXATEUCH</a>). Meanwhile De Wette (1805-6), on grounds of style and contents, had claimed for Deuteronomy an origin not earlier than the reign of Josiah. "Fragmentary" theories, like Vater\'s, which contributed little to the general development, may be left unnoticed. A conservative school, headed by Hengstenberg (1831) and Havernick (1837), contested these conclusions of the critics, and contended for the unity and Mosaic authorship of the Pentateuch. Bolder spirits, as Vatke (1835), anticipated the conclusions of the newer critical school in declaring that the Levitical laws were latest of all in origin. Their voices were as yet unheeded.<P>(2) Hupfeld. A distinct advance on preceding theories was made by Hupfeld (1853; in part anticipated by Ilgen, 1789). Hitherto the prevailing assumption had been that there was one fundamental document—the so-called Elohistic, dated usually in the age of the Judges, or the time of Saul or David—and that the Yahwistic parts were "supplementary" to this (not a separate document). It was the merit of Hupfeld to perceive that not a few of the sections in the "Elohistic" document did not bear the usual literary marks of that writing, but closely resembled the "Yahwistic" sections in everything but the use of the Divine name. These portions he singled out and erected into a document by themselves (though they bear no signs of being such), while the Yahwistic parts were relieved of their "supplementary" character, and regarded as belonging to a distinct document also. There were thus now 3 documents, attributed to as many authors—the original Elohist, the 2nd or Younger Elohist (E) and the Jahwist (Jahwist). Deuteronomy, as a distinct book, was added to these, making 4 documents in all.<P>(3) Graf and Wellhausen.<P>Thus matters stood till the appearance of Graf\'s work, The Historical Books of the Old Testament, in 1866, through which something like a revolution in the critical outlook was effected. Following in the track of Vatke, earlier, Reuss, of Strassburg, had taken up the idea that the Levitical legislation could not, as was commonly presumed, be earlier than Deuteronomy, but was, on the contrary, later—in fact, a product of the age of the exile. Graf adopted and developed this theory. He still for a time, while putting the laws late, maintained an earlier date for the Elohistic narratives. He was soon led, however, to see that laws and history must go together; so the whole Elohistic writing was removed from its former place, and brought down bodily to the end of the religious development. Graf, at the same time, did not regard it as an independent document. At first theory was scouted, but gradually, through the able advocacy of Kuenen and Wellhausen—especially the latter—it secured ascendancy, and is now regarded as the critical view par excellence. Order and nomenclature of the assumed documents were now changed. The Elohist, instead of standing first, was put last under the designation P or Priestly Code; Wellhausen\'s symbol for this writing was Q. Its date was taken to be post-exilian. The Jahwist becomes J; the Elohist becomes E. These are placed in the 9th or 8th centuries BC (circa 850-750), but are supposed to have been combined a century or so later (JE). Deuteronomy, identified with the law-book found in the temple in the reign of Josiah (<a onClick="return mV(\'2Ki\',22,\'1-\');">2Ki 22</a>), is thought to have been written shortly before that time. The order is therefore no longer 1st Elohist-Jahwist and 2nd Elohist-D, but J and E-D-P. The whole, it is held, was finally united into the great law-book (Pent) brought by Ezra to Jerusalem from Babylon (458 BC; <a onClick="return mV(\'Ezr\',7,\'6-10\');">Ezr 7:6-10</a>), and read by him before the people 14 years later (444 BC; <a onClick="return mV(\'Neh\',8,\'1-\');">Ne 8</a>).<P>(4) Literary and Historical Grounds of Theory.<P>A sketch like the above gives, of course, no proper idea of the grounds on which, apart from the distinction in the Divine names, the critical theory just described is based. The grounds are partly literary—the discrimination of documents, e.g. resting on differences of style and conception, duplicates, etc. (see <a href="./study/isbe/search.html?string=PENTATEUCH">PENTATEUCH</a>)—but partly also historical, in accordance with the critic\'s conception of the development of religion and institutions in Israel. A main reliance is placed on the fact that the history, with its many sanctuaries up to the time of Deuteronomy, is in conflict with the law of that book, which recognizes only one sanctuary as legitimate (chapter <a onClick="return mV(\'Deu\',12,\'1-\');">12</a>), and equally with the Priestly Code, which throughout assumes this centralizing law. The laws of Deu and Priestly Code, therefore, cannot be early. The prophets, it is held, knew nothing of a Levitical legislation, and refused to regard the sacrificial system as Divine (<a onClick="return mV(\'Jer\',7,22);">Jer 7:22</a>ff).<P>(5) The Codes:<P>The code under which older Israel lived was that formulated in the Book of the Covenant (<span="noTag">Ex 20-23</span>), which permitted many altars (<a onClick="return mV(\'Exd\',20,24);">Ex 20:24</a>f). The law of Deuteronomy was the product of a centralizing movement on the part of the prophets, issuing in the reformation of Josiah. The Priestly Code was the work of fertile brains and pens of post-exilian priests and scribes, incorporating older usage, devising new laws, and throwing the whole into the fictitious form of Mosaic wilderness legislation.<P>(6) Effects on History, etc.<P>The revolution wrought by these newer constructions, however, is not adequately realized till regard is had to their effects on the picture given in the Old Testament itself of Israel\'s history, religion and literature. It is not too much to say that this picture is nearly completely subverted. By the leaders of the school (Graf, Kuenen, Wellhausen, Duhm, Stade, etc.) the supernatural element in the history and religion is totally eliminated; even by those who do not go so far, little is left standing. The history of the Pentateuch—indeed the history down to the time of the kings—is largely given up. Genesis is legend, Exodus hardly more trustworthy, Joshua a romance. The histories of Samuel and David are "written up" by a theocratic narrator. None of the laws—even the Decalogue—are allowed to be certainly Mosaic. Monotheism is believed to have come in with Amos and Hosea; earlier, Yahweh was a "tribal" God. Ark, tabernacle, priesthood, feasts, as depicted in the Priestly Code, are post-exilic fiction. The treatment accorded to the Pentateuch necessarily reacts on the other historical books; the prophetic literature suffers in an almost equal degree through disintegration and mutilation. It is not Isaiah alone—where the question has long been mooted of the post-exilian origin of chapters 40-66 (see <a href="./study/isbe/search.html?string=ISAIAH">ISAIAH</a>); the critical knife is applied with scarcely less freedom to the remaining prophetical books. Few, if any, of the psalms are allowed to be preexilic. Daniel is a work of the Maccabean age.<P>(7) General Results.<P>As a general summary of the results of the movement, which it is thought "the future is not likely to reverse," the following may be quoted from Professor A. S. Peake: "The analysis of the Pentateuch into four main documents, the identification of the law on which Josiah\'s reformation was based with some form of the Deuteronomic Code, the compilation of that code in the reign of Manasseh at the earliest, the fixing of the Priestly Code to a date later than Ezekiel, the highly composite character of some parts of the prophetic literature, especially the Book of Isaiah, the post-exilian origin of most of the Psalms, and large parts of the Book of Proverbs, the composition of Job not earlier than the exile and probably later, the Maccabean date of Daniel, and the slightly earlier date of Ecclesiastes" ("Present Movement of Biblical Science," in Manchester, Inaugural Lects, 32).<P>(8) Criticism of Theory.<P>The criticism of this elaborate theory belongs to the arts which deal with the several points involved, and is not here attempted at length (compare the present writer\'s Orr, The Problem of the Old Testament). The gains that have accrued from it on the literary side in a more exact and scholarly knowledge of the phenomena to be explained (e.g. distinction in the Divine names; distinction of P element in the Pentateuch from that known as JE) are not to be questioned; on the historical and religious sides also much has been done to quicken interest, enlarge knowledge and correct older ideas which have proved untenable—in general, to place the whole facts of the Old Testament in a clearer and more assured light. On the other hand, much even in the literary criticism is subjective, arbitrary and conjectural, while the main hypothesis of the subsequentness of the Levitical law to Ezekiel, with the general view taken of the historical and religious development in Israel, is open to the most serious exception. The Old Testament has its own account to give of the origin of its religion in the monotheism of Abraham, the covenants with the patriarchs, the legislation through Moses, which is not thus readily to be set aside in the interests of a theory resting largely on naturalistic pre-suppositions (see <a href="./study/isbe/search.html?string=BIBLE">BIBLE</a>). There is not a word in the history in <a onClick="return mV(\'Neh\',8,\'1-\');">Ne 8</a> to suggest that the law introduced by Ezra was a new one; it was received without demur by a deeply divided community as the ancient law of Moses. So with the law of Deuteronomy in the time of Josiah (<a onClick="return mV(\'2Ki\',22,\'1-\');">2Ki 22</a>). Its genuineness was doubted by no one. The position of theory, generally, is by no means so secure as many of its adherents suppose. Internally, it is being pushed to extremes which tend to discredit it to sober minds, and otherwise is undergoing extensive modifications. Documents are multiplied, dates lowered, authors are converted into "schools." Archaeologists, in large majority, declare against it. The facts they adduce tend to confirm the history in parts where it had been most impugned. The new Babylonian school in Germany (that of Winckler) assails it in its foundations. Recently, the successor of Kuenen in Leyden, Professor B. D. Eerdmans, formerly a supporter, has broken with theory in its entirety, and subjects the documentary hypothesis to a damaging criticism. It is too early yet to forecast results, but the opinion may be hazarded that, as in the case of the Tubingen New Testament critical school in last century referred to below, the prevailing critical theory of the Old Testament will experience fundamental alteration in a direction nearer to older ideas, though it is too much to expect that traditional views will ever be resuscitated in their completeness.<P>2. The New Testament:<P>Higher criticism of the New Testament may be said to begin, in a Deistic spirit, with Reimarus (Fragments, published by Lessing, 1778), and, on Hegelian lines, with Strauss (Life of Jesus, 1835). In the interests of his mythical theory, Strauss subjected every part of the gospel history to a destructive criticism.<P>(1) The School of Baur.<P>In a more systematic way, F. Baur (1826-60), founder of the famous Tubingen school, likewise proceeding from Hegel, applied a drastic criticism to all the documents of the New Testament. Strauss started with the Gospels. Baur sought firmer ground in the phenomena of the Apostolic Age. The key to Baur\'s theory lies in the alleged existence of Pauline and Petrine parties in the early church, in conflict with one another. The true state of matters is mirrored, he holds, not in the Book of Acts, a composition of the 2nd century, written to gloss over the differences between the original apostles and Paul, but in the four contemporary and undoubtedly genuine epistles of Paul, Galatians, 1 and 2 Corinthians, and Roman, and in the Book of Revelation. In these documents the church is seen rent by a schism that threatened its very existence. By and by attempts were made at conciliation, the stages of which are reflected in the Gospels and remaining writings of the New Testament. The Fourth Gospel, about 170 AD, brings up the rear. This theory, which found influential support in the scholarship of the time (Schwegler, Zeller, etc.), could not stand the test of impartial investigation, and is now on all sides discredited. Professor Bacon, in a recent work, pronounces its theory of the Johannine writings to be "as obsolete as the Ptolemaic geography" (Fourth Gospel, 20). Its influence on later criticism has, however, been considerable. (2) Synoptic Criticism.<P>Meanwhile more sober scholarship was concerning itself with the intricate problem of the relations of the Synoptic Gospels. The problem is a very real one (see <a href="./study/isbe/search.html?string=GOSPELS">GOSPELS</a>). The three gospels of Matthew, Mark and Luke are seen on inspection to exhibit an amount of agreement in subject-matter, order, often in language, which cannot be accounted for except on theory of some common source. Suppose the Gospels divided into sections, in 52 of these the narratives coincide, 12 more are common to Matthew and Mark, 5 to Mark and Luke, and 14 to Matthew and Luke, while 5 are peculiar to Matthew, 2 to Mark and 9 to Luke. The verbal agreement is greater in the recital of the words of others, particularly of words of Jesus, than in the narrative portions.<P>(i) Oral, Documentary, and Dependence Theories:<P>How is this to be explained? Three forms of theory were early propounded—the oral, the documentary, and the hypothesis of dependence of one gospel upon another. Of these theories, the oldest is the 3rd (Augustine already held that Mark was an abridgment of Matthew and Luke), and to it, in combination with the 2nd, though in reversed order (Mark being put first), it will be seen below that criticism has largely reverted. The oral theory, proposed by Gieseler (1818), has, till recently, been the favorite one in England (Westcott, Alford, etc., with Godet, Pressense, Ebrard, etc., on the Continent). In it resemblances in the three Gospels are explained by an oral tradition assumed to have attained a relatively fixed form while the apostles were yet teaching together in Jerusalem. The documentary theory took its origin with Eichhorn (1794), but in the hands of Marsh (1801), finally in Eichhorn\'s own (1804), received so elaborate a development as completely to discredit it. The dependence theory, in turn, went through every possible shape. Gradually, with sifting, certain combinations were eliminated (those which put Luke first, or Matthew last, or made Mark a middle term), till only two remained—Matthew, Luke, Mark (Griesbach 1789-90, Baur, etc.), and Mark, Matthew, Luke (Weisse,1838,Wilke,1838,etc.). The prestige of the Baur school obtained a temporary ascendancy for the former view—that which put Mark last; this, however, has now quite given way in favor of Mark\'s priority. There remained a division of opinion as to whether the Mark employed by the other evangelists was the canonical Mark (Weisse, Meyer, B. Weiss, etc.), or an ur-Markus (Holtzmann, Reuss, etc.), but the difficulties of the latter hypothesis proved so insurmountable that Holtzmann finally gave it up.<P>(ii) The "Logia":<P>It is obvious, however, that the use of Mark by the other evangelists, even if granted, does not yet completely solve the synoptical problem. There is still to be considered that large mass of matter—chiefly discourses—common to Matthew and Luke, not to speak of the material peculiar to Luke itself. For the explanation of these sections it becomes necessary to postulate a second source, usually identified with the much-canvassed Logia of Papias, and designated by recent scholars (Wellhausen, etc.) Q. It is regarded as a collection of discourses, possibly by Matthew, with or without an admixture of narrative matter (B. Weiss, etc.).<P>(iii) Two-Source Theory:<P>This yields the "two-source" theory at present prevailing in synoptical criticism (for a different view, compare Zahn\'s Introduction). Matthew and Luke, on this view, are not independent Gospels, but are drawn up on the basis of<P>(1) Mark and<P>(2) Q = the Logia, with original material on the part of Luke (see <a href="./study/isbe/search.html?string=GOSPELS">GOSPELS</a>).<P>A theory which commands the assent of so many scholars has necessarily great weight. It cannot, however, be regarded as finally established. Many grave difficulties remain; there is, besides, a prima facie improbability in a Gospel like Mark\'s being treated in the manner supposed or included among the "attempts" which Luke\'s own Gospel was designed to supersede (<a onClick="return mV(\'Luk\',1,\'1-4\');">Lu 1:1-4</a>; compare Wright, Luke\'s Gospel in Greek, xiv, xv).<P>(iv) Authorship—Lukan and Johannine Questions:<P>With criticism of the sources of the Gospels there goes, of course, the question of authorship. A powerful vindication of the Lucan authorship of the 3rd Gospel and the Book of Acts has recently come from the pen of Professor A. Harnack, who maintains that in this, as in most other points regarding early Christian literature, "tradition is right" (compare his Luke, the Physician, English translation). Outside the Synoptics, the burning question still is the authorship of the Johannine writings. Here also, however, the extreme positions of the Baur school are entirely given up ("It is perfectly apparent," says Professor Bacon, "that Baur mistook the period of dissemination for that of origin," op. cit., 21), and powerful defenses of Johannine authorship have of late appeared (notably Sanday\'s Criticism of the Fourth Gospel, and ex-Principal Drummond\'s Character and Authorship of the Fourth Gospel).<P>See <a href="./study/isbe/search.html?string=JOHN,+GOSPEL+OF">JOHN, GOSPEL OF</a>.<P>(3) Modern "Historical-Critical" School.<P>On the other hand, a new and intensely aggressive radical school has recently come to the front, the so-called "historical-critical," which treats the text and history of the Gospels generally with a recklessness to which no limits can be put. It is even doubted if Jesus claimed to be the Messiah (Wrede). Sayings are accepted, rejected, or mutilated at pleasure. The latest phase of this school is the "Apocalyptic," which finds the essence of Christ\'s message in His insistence on the approaching end of the world (compare Schweitzer, Von Reimarus zu Wrede; English translation The Quest of the Historical Jesus). These excesses may be depended on to cure themselves.<P>(4) Remaining Writings of the New Testament.<P>For the rest of the writings on the New Testament, the trend of criticism has been in the main in a conservative direction. One by one the Pauline Epistles have been given back to the apostle—doubt chiefly still resting in certain minds on the Pastorals. The Book of Revelation is restored by most to the age of Domitian, where tradition places it. Its relation to the Fourth Gospel and to John is still in dispute, and some moderns would see in it a groundwork of Jewish apocalypse. These and kindred questions are discussed in the arts devoted to them.<P>LITERATURE.<P>Articles on Text, manuscripts, VSS, of Old Testament and New Testament in Bible Dicts. and Encyclopedias: works on Introduction to Old Testament and New Testament.<P>On the Old Testament.<P>S. Davidson, Revision of the English Old Testament; W. R. Smith, Old Testament in the Jewish Church; Wellhausen, Prol to the Hist of Israel (English translation); Kuenen, The Hexateuch (English translation); Oxford Hexateuch according to the Revised Version (British and American); Orr, Problem of the Old Testament, and Bible Under Trial; H. M. Wiener, Essays on Pentateuchal Criticism; W. Moller. Are the Critics Right? (English translation).<P>On the New Testament.<P>Westcott and Hort, The New Testament in Greek, Intro; F. G. Kenyon, Handbook to the Textual Criticism of the New Testament; Nestle, Textual Crit of the Greek Testament (English translation); Scrivener, Introduction to the Criticism of the New Testament, 4th edition; K. Lake, The Text of the New Testament; Ebrard, Gospel History (English translation); F. C. Burkitt, The Gospel History and Its Transmission; Sanday, The Life of Christ in Recent Research; Schweitzer, Von Reimarus zu Wrede (English translation: The Quest of the Historical Jesus): A. S. Peake, A Critical Introduction to the New Testament.``132';

isbe[2425]='Crook-Backed`krook\'-bakt (gibben; kurtos): A disqualification for the priesthood (<a onClick="return mV(\'Lev\',21,20);">Le 21:20</a>); was probably an angular curvature of the spine, usually the result of tubercular caries of the vertebrae. It was by no means uncommon in ancient Egypt, where I have found a considerable number of spines affected with this disease. Some Talmudic authorities explain it as meaning "very dark colored," but this is unlikely.<P>The woman bound by the spirit of infirmity and unable to lift herself (<a onClick="return mV(\'Luk\',13,\'11-17\');">Lu 13:11-17</a>) was affected with senile kyphosis, a chronic bone disease often found among aged men (and more frequently women) whose lives have been spent in agricultural labor. In these the vertebrae become altered in shape so that it is impossible to straighten the back. Some rabbinical authorities believed all deformities to be due to Satan, and to this our Lord seems to have alluded in his rebuke to those who caviled at His healing on the Sabbath. I have found this condition in some Egyptian skeletons, and have seen it in a Palestinian fellah. A skeleton affected with a similar curvature was found buried under the threshold of a house at Gezer, where she had evidently been offered as a foundation sacrifice.``107';
isbe[2426]='Crooked`krook\'-ed (\'awah, \'aqash, \'aqalqal, \'aqallathon, pethaltol; skolios): Primarily designates something that is bent, twisted or deformed (<a onClick="return mV(\'Isa\',27,1);">Isa 27:1</a>; <a onClick="return mV(\'Isa\',45,2);">45:2</a> the King James Version).<P>Figurative:<P>(1) It designates a course of action that deviates from rectitude, especially deceit, guile, hypocrisy (<a onClick="return mV(\'Deu\',32,5);">De 32:5</a>; <a onClick="return mV(\'Pro\',2,15);">Pr 2:15</a>; <a onClick="return mV(\'Ecc\',1,15);">Ec 1:15</a>; <a onClick="return mV(\'Luk\',3,5);">Lu 3:5</a>; compare <a onClick="return mV(\'Phl\',2,15);">Php 2:15</a>);<P>(2) trials (sent by God, <a onClick="return mV(\'Ecc\',7,13);">Ec 7:13</a>; <a onClick="return mV(\'Lam\',3,9);">La 3:9</a>);<P>(3) difficulties (removed by God, <a onClick="return mV(\'Isa\',42,16);">Isa 42:16</a>).``1';
isbe[2427]='Crooked Serpent`krook\'-ed sur\'-pent.`<a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>`1';
isbe[2428]='Crop`(1) As noun the translation of mur\'-ah (<a onClick="return mV(\'Lev\',1,16);">Le 1:16</a>), which is the craw of a bird, especially of doves and pigeons, which had to be removed by the priest before he offered the birds as a burnt sacrifice.<P>(2) As a verb it is (<a onClick="return mV(\'Eze\',17,4,22);">Eze 17:4, 22</a>) the translation of qataph, which has the meaning of "cutting off," "cutting down," "plucking."``1';
isbe[2429]='Cross`(stauros, "a cross," "the crucifixion"; skolops, "a stake," "a pole"): The name is not found in the Old Testament. It is derived from the Latin word crux. In the Greek language it is stauros, but sometimes we find the word skolops used as its Greek equivalent. The historical writers, who transferred the events of Roman history into the Greek language, make use of these two words. No word in human language has become more universally known than this word, and that because all of the history of the world since the death of Christ has been measured by the distance which separates events from it. The symbol and principal content of the Christian religion and of Christian civilization is found in this one word.<P>1. Forms of the Cross:<P>The cross occurs in at least four different forms:<P>(1) the form usually seen in pictures, the crux immissa, in which the upright beam projected above the shorter crosspiece; this is most likely the type of cross on which the Saviour died, as may be inferred from the inscription which was nailed above His head;<P>(2) the crux commissa, or Anthony\'s cross, which has the shape of the letter T;<P>(3) the Greek cross of later date, in which the pieces are equally long;<P>(4) the crux decussata, or Andrew\'s cross, which has the shape of the letter X.<P>2. Discovery of the True Cross:<P>The early church historians Socrates (1, 17), Sozomen (2, 1), Rufinus (1, 7) and Theodoret (1, 18) all make mention of this tradition. The most significant thing is that Eusebius (Vit. Const., iii.26-28), who carries more weight than they all together, wholly omits it.<P>According to it, Helena, the mother of Constantine the Great, in 325 AD, when she was 79 years old, discovered the true cross of Jesus by an excavation she caused to be made on the traditional spot of His grave. With the cross of the Saviour were found the two crosses of the malefactors who were crucified with Him. A miracle of healing, wrought by touching the true cross, revealed its identity. Whenfound it was intact, even the holy nails of the crucifixion being discovered. The main part of the cross was deposited by Helena in a church erected over the spot. Of the remainder, a portion was inserted into the head of the statue of Constantine, and the balance was placed in a new church, specially erected for it at Rome and named after it Santa Croce. Small fragments of the wood of the true cross were sold, encrusted with gold and jewels, and since many among the wealthy believers were desirous of possessing such priceless relics, the miracle of the "multiplication of the cross" was devised, so that the relic suffered no diminution "et quasi intacta maneret" (Paulinus epistle 11 ad Sev). Fragments of the true cross are thus to be found in many Roman Catholic churches of many countries, all over Christendom. It is said that the East celebrated the staurosimos hemera (Crucifixion Day) on September 14, since the 4th century. The evidence for this fact is late and untrustworthy. It is certain that the West celebrated the Invention of the Cross, on May 3, since the time of Gregory the Great in the 6th century. The finding and publication of the apocryphal "Doctrina Addaei" has made it evident that the entire legend of the discovery of the cross by Helena is but a version of the old Edessa legend, which tells of an identical discovery of the cross, under the very same circumstances, by the wife of the emperor Claudius, who had been converted to Christianity by the preaching of Peter.<P>3. Symbolical Uses of the Cross:<P>(1) Extra-Scriptural.<P>The sign of the cross was well known in the symbolics of various ancient nations. Among the Egyptians it is said to have been the symbol of divinity and eternal life, and to have been found in the temple of Serapis. It is known either in the form of the Greek cross or in the form of the letter "T". The Spaniards found it to be well known, as a symbol, by the Mexicans and Peruvians, perhaps signifying the four elements, or the four seasons, or the four points of the compass.<P>(2) Scriptural.<P>The suffering implied in crucifixion naturally made the cross a symbol of pain, distress and burden-bearing. Thus Jesus used it Himself (<a onClick="return mV(\'Mat\',10,38);">Mt 10:38</a>; <a onClick="return mV(\'Mat\',16,24);">16:24</a>). In Paulinic literature the cross stands for the preaching of the doctrine of the Atonement (<a onClick="return mV(\'1Cr\',1,18);">1Co 1:18</a>; <a onClick="return mV(\'Gal\',6,14);">Ga 6:14</a>; <a onClick="return mV(\'Phl\',3,18);">Php 3:18</a>; <a onClick="return mV(\'Col\',1,20);">Col 1:20</a>). It expresses the bond of unity between the Jew and the Gentile (<a onClick="return mV(\'Eph\',2,16);">Eph 2:16</a>), and between the believer and Christ, and also symbolizes sanctification (<a onClick="return mV(\'Gal\',5,24);">Ga 5:24</a>). The cross is the center and circumference of the preaching of the apostles and of the life of the New Testament church.<P>4. Crucifixion:<P>As an instrument of death the cross was detested by the Jews. "Cursed is everyone that hangeth on a tree" (<a onClick="return mV(\'Gal\',3,13);">Ga 3:13</a>; compare <a onClick="return mV(\'Deu\',21,23);">De 21:23</a>), hence, it became a stumbling-block to them, for how could one accursed of God be their Messiah? Nor was the cross differently considered by the Romans. "Let the very name of the cross be far away not only from the body of a Roman citizen, but even from his thoughts, his eyes, his ears" (Cicero Pro Rabirio 5). The earliest mode of crucifixion seems to have been by impalation, the transfixion of the body lengthwise and crosswise by sharpened stakes, a mode of death-punishment still well known among the Mongol race. The usual mode of crucifixion was familiar to the Greeks, the Romans, the Egyptians, Persians and Babylonians (Thuc. 1, 110; Herod. iii.125, 159). Alexander the Great executed two thousand Tyrian captives in this way, after the fall of the city. The Jews received this form of punishment from the Syrians and Romans (Ant., XII, v, 4; XX, vi, 2; BJ, I, iv, 6). The Roman citizen was exempt from this form of death, it being considered the death of a slave (Cicero In Verrem i. 5, 66; Quint. viii.4). The punishment was meted out for such crimes as treason, desertion in the face of the enemy, robbery, piracy, assassination, sedition, etc. It continued in vogue in the Roman empire till the day of Constantine, when it was abolished as an insult to Christianity. Among the Romans crucifixion was preceded by scourging, undoubtedly to hasten impending death. The victim then bore his own cross, or at least the upright beam, to the place of execution. This in itself proves that the structure was less ponderous than is commonly supposed. When he was tied to the cross nothing further was done and he was left to die from starvation. If he was nailed to the cross, at least in Judea, a stupefying drink was given him to deaden the agony. The number of nails used seems to have been indeterminate. A tablet, on which the feet rested or on which the body was partly supported, seems to have been a part of the cross to keep the wounds from tearing through the transfixed members (Iren., Adv. haer., ii.42). The suffering of death by crucifixion was intense, especially in hot climates. Severe local inflammation, coupled with an insignificant bleeding of the jagged wounds, produced traumatic fever, which was aggravated the exposure to the heat of the sun, the strained of the body and insufferable thirst. The swelled about the rough nails and the torn lacerated tendons and nerves caused excruciating agony. The arteries of the head and stomach were surcharged with blood and a terrific throbbing headache ensued. The mind was confused and filled with anxiety and dread foreboding. The victim of crucifixion literally died a thousand deaths. Tetanus not rarely supervened and the rigors of the attending convulsions would tear at the wounds and add to the burden of pain, till at last the bodily forces were exhausted and the victim sank to unconsciousness and death. The sufferings were so frightful that "even among the raging passions of war pity was sometimes excited" (BJ, V, xi, 1). The length of this agony was wholly determined by the constitution of the victim, but death rarely ensued before thirty-six hours had elapsed. Instances are on record of victims of the cross who survived their terrible injuries when taken down from the cross after many hours of suspension (Josephus, Vita, 75). Death was sometimes hastened by breaking the legs of the victims and by a hard blow delivered under the armpit before crucifixion. Crura fracta was a well-known Roman term (Cicero Phil. xiii.12). The sudden death of Christ evidently was a matter of astonishment (<a onClick="return mV(\'Mar\',15,44);">Mr 15:44</a>). The peculiar symptoms mentioned by John (<a onClick="return mV(\'Jhn\',19,34);">19:34</a>) would seem to point to a rupture of the heart, of which the Saviour died, independent of the cross itself, or perhaps hastened by its agony.`<a href="./study/isbe/search.html?string=BLOOD+AND+WATER">BLOOD AND WATER</a>`42';
isbe[2430]='Crossway`kros\'-wa (perek, literally, "division"): A forking or dividing of the way. Obadiah warns Edom, "And stand thou not in the crossway, to cut off those of his that escape" (<a onClick="return mV(\'Oba\',1,14);">Obad 1:14</a>). In Septuagint, "a mountain pass."``1';
isbe[2431]='Crown`kroun: The word crown in the Old Testament is a translation of five different Hebrew words, and in the New Testament of two Greek words. These express the several meanings, and must be examined to ascertain the same.<P>1. In Hebrew:<P>The five Hebrew words are as follows:<P class="in15">(1) qodhqodh, from qadhadh;<P class="in15">(2) zer, from zarar;<P class="in15">(3) nezer, or nezer, both from nazar;<P class="in15">(4) atarah, from \'atar;<P class="in15">(5) kether, from kathar.<P>(1) Qodhqodh means "the crown of the head," and is also rendered in the King James Version "top of the head," "scalp," "pate." It comes from qadhadh, meaning "to shrivel up," "contract," or bend the body or neck through courtesy. Both the Revised Version (British and American) and the American Standard Revised Version, in <a onClick="return mV(\'Deu\',28,35);">De 28:35</a> and <a onClick="return mV(\'Deu\',33,16);">33:16</a>, translation it "crown" instead of "top" as in the King James Version. Jacob in his prophecy concerning his sons says: "The blessings of thy father...shall be on the head of Joseph, and on the crown of the head of him that is prince among his brethren" (<a onClick="return mV(\'Gen\',49,26);">Ge 49:26</a> the American Revised Version, margin). Other references are: <a onClick="return mV(\'Deu\',33,20);">De 33:20</a>; <a onClick="return mV(\'2Sa\',14,25);">2Sa 14:25</a>; <a onClick="return mV(\'Job\',2,7);">Job 2:7</a>; <a onClick="return mV(\'Isa\',3,17);">Isa 3:17</a>; <a onClick="return mV(\'Jer\',2,16);">Jer 2:16</a>; <a onClick="return mV(\'Jer\',48,45);">48:45</a>. Translated "scalp" in <a onClick="return mV(\'Psa\',68,21);">Ps 68:21</a> and "pate" in <a onClick="return mV(\'Psa\',7,16);">Ps 7:16</a>.<P>(2) Zer means a "chaplet," something spread around the top as a molding about the border, and because of its wreath-like appearance called a crown. "That which presses, binds" (BDB). Comes from zarar, meaning "to diffuse" or "scatter." It is used in <a onClick="return mV(\'Exd\',25,11,24,25);">Ex 25:11, 24-25</a>; <a onClick="return mV(\'Exd\',30,3,4);">30:3-4</a>; <a onClick="return mV(\'Exd\',37,2,11,12,26,27);">37:2, 11-12, 26-27</a>.<P>(3) Nezer means something "set apart"; i.e. a dedication to the priesthood or the dedication of a Nazarite, hence, a chaplet or fillet as a symbol of such consecration. The word in the King James Version is rendered "crown," "consecration," "separation," "hair." Comes from nazar, meaning "to hold aloof" from impurity, even from drink and food, more definitely, "to set apart" for sacred purposes, i.e. "to separate," "devote," "consecrate." It is found in <a onClick="return mV(\'Exd\',29,6);">Ex 29:6</a>; <a onClick="return mV(\'Exd\',39,30);">39:30</a>; <a onClick="return mV(\'Lev\',8,9);">Le 8:9</a>; <a onClick="return mV(\'Lev\',21,12);">21:12</a>; <a onClick="return mV(\'2Sa\',1,10);">2Sa 1:10</a>; <a onClick="return mV(\'2Ki\',11,12);">2Ki 11:12</a>; <a onClick="return mV(\'2Ch\',23,11);">2Ch 23:11</a>; <a onClick="return mV(\'Psa\',89,39);">Ps 89:39</a>; <a onClick="return mV(\'Psa\',132,18);">132:18</a>; <a onClick="return mV(\'Pro\',27,24);">Pr 27:24</a>; <a onClick="return mV(\'Zec\',9,16);">Zec 9:16</a>.<P>(4) \'Atarah means a crown in the usual sense. Comes from \'atar, meaning "to encircle," as in war for offense or defense; also actually and figuratively "to crown." Rendered sometimes "to compass." It is used in <a onClick="return mV(\'2Sa\',12,30);">2Sa 12:30</a>; <a onClick="return mV(\'1Ch\',20,2);">1Ch 20:2</a>; <a onClick="return mV(\'Est\',8,15);">Es 8:15</a>; <a onClick="return mV(\'Job\',19,9);">Job 19:9</a>; <a onClick="return mV(\'Job\',31,36);">31:36</a>; <a onClick="return mV(\'Psa\',21,3);">Ps 21:3</a>; <a onClick="return mV(\'Pro\',4,9);">Pr 4:9</a>; <a onClick="return mV(\'Pro\',12,4);">12:4</a>; <a onClick="return mV(\'Pro\',14,24);">14:24</a>; <a onClick="return mV(\'Pro\',16,31);">16:31</a>; <a onClick="return mV(\'Pro\',17,6);">17:6</a>; <a onClick="return mV(\'Sgs\',3,11);">So 3:11</a>; <a onClick="return mV(\'Isa\',28,1,3,5);">Isa 28:1,3,5</a>; <a onClick="return mV(\'Isa\',62,3);">62:3</a>; <a onClick="return mV(\'Jer\',13,18);">Jer 13:18</a>; <a onClick="return mV(\'Lam\',5,16);">La 5:16</a>; <a onClick="return mV(\'Eze\',16,12);">Eze 16:12</a>; <a onClick="return mV(\'Eze\',21,26);">21:26</a>; <a onClick="return mV(\'Eze\',23,42);">23:42</a>; <a onClick="return mV(\'Zec\',6,11,14);">Zec 6:11, 14</a>; "crowned," <a onClick="return mV(\'Sgs\',3,11);">So 3:11</a>; "crownest," <a onClick="return mV(\'Psa\',65,11);">Ps 65:11</a>; "crowneth," <a onClick="return mV(\'Psa\',103,4);">Ps 103:4</a>, the Revised Version (British and American) translations "crowned," of <a onClick="return mV(\'Psa\',8,5);">Ps 8:5</a> "hast crowned." the American Standard Revised Version prefers to translation "crowning," in <a onClick="return mV(\'Isa\',23,8);">Isa 23:8</a>, "the bestower of crowns."<P>(5) Kether means a "circlet" or "a diadem." From kathar, meaning "to enclose": as a friend, "to crown"; as an enemy, "to besiege." Variously translated "beset round," "inclose round," "suffer," "compass about." Found in <a onClick="return mV(\'Est\',1,11);">Es 1:11</a>; <a onClick="return mV(\'Est\',2,17);">2:17</a>; <a onClick="return mV(\'Est\',2,6);">6:8</a>; "crowned," in <a onClick="return mV(\'Pro\',14,18);">Pr 14:18</a>.<P>2. In Greek:<P>The two Greek words of the New Testament translated crown are:<P class="in15">(1) stephanos, from stepho, and<P class="in15">(2) diadema, from diadeo, "to bind round."<P>(1) Stephanos means a chaplet (wreath) made of leaves or leaf-like gold, used for marriage and festive occasions, and expressing public recognition of victory in races, games and war; also figuratively as a reward for efficient Christian life and service (see <a href="./study/isbe/search.html?string=GAMES">GAMES</a>). This symbol was more noticeable and intricate than the plain fillet. Only in the Revelation of John is stephanos called "golden." The "crown of thorns" which Jesus wore was a stephanos (woven wreath) of thorns; the kind is not known (<a onClick="return mV(\'Mat\',27,29);">Mt 27:29</a>; <a onClick="return mV(\'Mar\',15,17);">Mr 15:17</a>; <a onClick="return mV(\'Jhn\',19,2,5);">Joh 19:2, 5</a>). Luke makes no mention of it. Whether intended to represent royalty or victory, it was caricature crown. Stephanos is found in <a onClick="return mV(\'1Cr\',9,25);">1Co 9:25</a>; <a onClick="return mV(\'Phl\',4,1);">Php 4:1</a>; <a onClick="return mV(\'1Th\',2,19);">1Th 2:19</a>; <a onClick="return mV(\'2Ti\',4,8);">2Ti 4:8</a>; <a onClick="return mV(\'Jam\',1,12);">Jas 1:12</a>; <a onClick="return mV(\'1Pe\',5,4);">1Pe 5:4</a>; <a onClick="return mV(\'Rev\',2,10);">Re 2:10</a>; <a onClick="return mV(\'Rev\',3,11);">3:11</a>; <a onClick="return mV(\'Rev\',6,2);">6:2</a>; <a onClick="return mV(\'Rev\',12,1);">12:1</a>; <a onClick="return mV(\'Rev\',14,14);">14:14</a>; plural in <a onClick="return mV(\'Rev\',4,4,10);">Re 4:4, 10</a>; <a onClick="return mV(\'Rev\',9,7);">9:7</a>; "crowned" in <a onClick="return mV(\'2Ti\',2,5);">2Ti 2:5</a>; <a onClick="return mV(\'Hbr\',2,9);">Heb 2:9</a>; "crownedst" in <a onClick="return mV(\'Hbr\',2,7);">Heb 2:7</a>.<P>(2) Diadema is the word for "diadem," from dia (about) and deo (bound), i.e. something bound about the head. In the three places where it occurs (<a onClick="return mV(\'Rev\',12,3);">Re 12:3</a>; <a onClick="return mV(\'Rev\',13,1);">13:1</a>; <a onClick="return mV(\'Rev\',19,12);">19:12</a>) both the Revised Version (British and American) and the American Standard Revised Version translation it not "crowns" but "diadems," thus making the proper distinction between stephanos and diadema, such as is not done either in the King James Version or the Septuagint (see Trench, Synonyms of the New Testament). According to Thayer the distinction was not observed in Hellenic Greek "Diadems" are on the dragon (<a onClick="return mV(\'Rev\',12,3);">Re 12:3</a>), the beast (<a onClick="return mV(\'Rev\',13,1);">Re 13:1</a>) and on the Rider of the White Horse, "the Faithful and True" (<a onClick="return mV(\'Rev\',19,12);">Re 19:12</a>). In each case the "diadems" are symbolic of power to rule.<P>3. Use and Significance:<P>There are five uses of the crown as seen in the Scripture references studied, namely, decoration, consecration, coronation, exaltation, and remuneration.<p>(1) Decoration.<P>The zer of Exodus, as far as it was a crown at all, was for ornamentation, its position not seeming to indicate any utility purpose. These wavelet, gold moldings, used in the furnishings of the tabernacle of Moses, were placed about<P>(a) the table of shewbread (<a onClick="return mV(\'Exd\',25,24);">Ex 25:24</a>; <a onClick="return mV(\'Exd\',37,11);">37:11</a>);<P>(b) the ark of the covenant (<a onClick="return mV(\'Exd\',25,11);">Ex 25:11</a>; <a onClick="return mV(\'Exd\',37,2);">37:2</a>);<P>(c) the altar of incense (<a onClick="return mV(\'Exd\',30,3,4);">Ex 30:3-4; <a onClick="return mV(\'Exd\',37,26,27);">37:26-27</a>). The position of these crowns is a debated question among archaeologists. Their purpose other than decoration is not known. The encircling gold might signify gratitude, parity and enduring worth.<P>(2) Consecration.<P>The nezer had a twofold use as the crown of consecration:<P>(a) It was placed as a frontlet on the miter of the high priest, being tied with a blue lace (<a onClick="return mV(\'Exd\',39,30);">Ex 39:30</a>). The priestly crown was a flat piece of pure gold, bearing the inscription, "Holy to Yahweh," signifying the consecration of the priest as the representative of the people (<a onClick="return mV(\'Exd\',29,6);">Ex 29:6</a>; <a onClick="return mV(\'Lev\',8,9);">Le 8:9</a>).<P>(b) Likewise the Hebrew king (<a onClick="return mV(\'2Ki\',11,12);">2Ki 11:12</a>) was set apart by God in wearing on his head a royal nezer, whether of silk or gold we do not know. It was set with jewels (<a onClick="return mV(\'Zec\',9,16);">Zec 9:16</a>) and was light enough to be taken into battle (<a onClick="return mV(\'2Sa\',1,10);">2Sa 1:10</a>).<P>(3) Coronation.<P>The ordinary use of the crown. There were three kinds of kingly crowns used in coronation services:<P>(a) The nezer or consecration crown, above referred to, was the only one used in crowning Hebrew kings. What seems to be an exception is in the case of Joshua, who represented both priest and king (<a onClick="return mV(\'Zec\',6,11);">Zec 6:11</a> the American Revised Version, margin).<P>(b) The \'atarah, and<P>(c) the kether were used in crowning foreign monarchs.<P>No king but a Hebrew could wear a nezer—a "Holy to Yahweh" crown. It is recorded that David presumed to put on his own head the \'atarah of King Malcam (<a onClick="return mV(\'2Sa\',12,30);">2Sa 12:30</a> the American Revised Version, margin). The kether or jeweled turban was the crown of the Persian king and queen (<a onClick="return mV(\'Est\',1,11);">Es 1:11</a>; <a onClick="return mV(\'Est\',2,17);">2:17</a>; <a onClick="return mV(\'Est\',6,8);">6:8</a>).<P>(4) Exaltation.<P>The \'atarah, the stephanos and the diadema were used as crowns of exaltation. Stephanos was the usual crown of exaltation for victors of games, achievement in war and places of honor at feasts. The \'atarah was worn at banquets (<a onClick="return mV(\'Sgs\',3,11);">So 3:11</a>; <a onClick="return mV(\'Isa\',28,1,3);">Isa 28:1, 3</a>), probably taking the form of a wreath of flowers; also as a crown of honor and victory (<a onClick="return mV(\'Eze\',16,12);">Eze 16:12</a>; <a onClick="return mV(\'Eze\',21,26);">21:26</a>; <a onClick="return mV(\'Eze\',23,42);">23:42</a>). Stephanos is the crown of exaltation bestowed upon Christ (<a onClick="return mV(\'Rev\',6,2);">Re 6:2</a>; <a onClick="return mV(\'Rev\',14,14);">14:14</a>; <a onClick="return mV(\'Hbr\',2,9);">Heb 2:9</a>). "Exaltation was the logical result of Christ\'s humiliation" (Vincent). The Apocalyptic woman and locusts receive this emblem of exaltation (<a onClick="return mV(\'Rev\',12,1);">Re 12:1</a>; <a onClick="return mV(\'Rev\',9,7);">9:7</a>). The symbolic dragon and beast are elevated, wearing diadema, (<a onClick="return mV(\'Rev\',12,3);">Re 12:3</a>; <a onClick="return mV(\'Rev\',13,1);">13:1</a>). The conquering Christ has "upon his head...many diadems" (<a onClick="return mV(\'Rev\',19,12);">Re 19:12</a>). See further Tertullian, De corona.<P>(5) Remuneration.<P>Paul, witnessing the races and games, caught the vision of wreath-crowned victors flush with the reward of earnest endeavor. See <a href="./study/isbe/search.html?string=GAMES">GAMES</a>. He also saw the persistent, faithful Christian at the end of his hard-won race wearing the symbolic stephanos of rejoicing (<a onClick="return mV(\'1Th\',2,19);">1Th 2:19</a> the King James Version), of righteousness (<a onClick="return mV(\'2Ti\',4,8);">2Ti 4:8</a>), of glory (<a onClick="return mV(\'1Pe\',5,4);">1Pe 5:4</a>), of life (<a onClick="return mV(\'Jam\',1,12);">Jas 1:12</a>; <a onClick="return mV(\'Rev\',2,10);">Re 2:10</a>). Paul\'s fellow Christians were his joy and stephanos (<a onClick="return mV(\'Phl\',4,1);">Php 4:1</a>), "of which Paul might justly make his boast" (Ellicott). Long before Paul, his Hebrew ancestors saw the \'atarah of glory (<a onClick="return mV(\'Pro\',4,9);">Pr 4:9</a>) and the \'atarah of a good wife, children\'s children, riches and a peaceful old age (<a onClick="return mV(\'Pro\',12,4);">Pr 12:4</a>; <a onClick="return mV(\'Pro\',14,24);">14:24</a>; <a onClick="return mV(\'Pro\',16,31);">16:31</a>; <a onClick="return mV(\'Pro\',17,6);">17:6</a>). For Apocrypha references see 1Macc 10:29; 11:35; 13:39.``142';
isbe[2432]='Crown of Thorns`thornz (akdnthinos stephanos): Three of the four evangelists mention the crown of thorns, wherewith the rude Roman soldiers derided the captive Christ (<a onClick="return mV(\'Mat\',27,29);">Mt 27:29</a>; <a onClick="return mV(\'Mar\',15,17);">Mr 15:17</a>; <a onClick="return mV(\'Jhn\',19,2);">Joh 19:2</a>). All speak of the akanthine (Acanthus) crown, but there is no certainty about the peculiar plant, from the branches of which this crown of cruel mockery was plaited. The rabbinical books. mention no less than twenty-two words in the Bible signifying thorny plants, and the word akantha in the New Testament Greek is a generic and not a specific term. And this word or its adjective is used in the three Gospels, quoted above. It is therefore impossible definitely to determine what was the exact plant or tree, whose thorny branches were selected for this purpose. Tobler (Denkbl., 113, 179) inclines to the Spina Christi, as did Hasselquist. Its botanical name is Zizyphus Spina Christi, It is very common in the East. Its spines are small and sharp, its branches soft, round and pliable, and the leaves look like ivy, with a dark, shiny green color, making them therefore very adaptable to the purpose of the soldiers. Others have designated the Paliurus aculeatus or the Lycium horridum. Both Geikie (Life of Christ, 549) and Farrar (Life of Christ, note 625) point to the Nubk (Zizyphus lotus). Says the latter, "The Nubk struck me, as it has all travelers in Palestine, as being most suitable both for mockery and pain, since its leaves are bright and its thorns singularly strong. But though the Nubk is very common on the shores of Galilee, I saw none of it near Jerusalem." The settlement of the question is manifestly impossible.``42';
isbe[2433]='Crucifixion`kroo-si-fik\'-shun`<a href="./study/isbe/search.html?string=CROSS">CROSS</a>; <a href="./study/isbe/search.html?string=PUNISHMENTS">PUNISHMENTS</a>`1';
isbe[2434]='Cruel; Cruelty`kroo\'-el, kroo\'-el-ti \'akhzar, ("harsh," "fierce," chamac, "violence"): There are various uses of the word "cruel" in the Old Testament:<P>(a) "the cruel (deadly) venom of asps" (<a onClick="return mV(\'Deu\',32,33);">De 32:33</a>);<P>(b) spoken of men of relentless hate: "They hate me with cruel hatred" (<a onClick="return mV(\'Psa\',25,19);">Ps 25:19</a>; compare <a onClick="return mV(\'Pro\',5,9);">Pr 5:9</a>; <a onClick="return mV(\'Pro\',11,17);">11:17</a>; <a onClick="return mV(\'Pro\',12,10);">12:10</a>; <a onClick="return mV(\'Jer\',6,23);">Jer 6:23</a>; <a onClick="return mV(\'Jer\',50,42);">50:42</a>);<P>(c) Job speaks of God\'s dealings with him as "cruel" and arbitrary: "Thou art turned to be cruel to me" (<a onClick="return mV(\'Job\',30,21);">Job 30:21</a>); conscious of his virtue, yet holding God to be the author of his sufferings, Job is driven to the conclusion that God has become his enemy and is bent upon destroying him;<P>(d) the "day of Yahweh"—a prophetic phrase to denote the time of God\'s manifestation in judgment—is described as coming, "cruel, with wrath and fierce anger" (<a onClick="return mV(\'Isa\',13,9);">Isa 13:9</a>). The word "cruelty" has nearly disappeared from the Bible. In the Revised Version (British and American) it occurs only in <a onClick="return mV(\'Psa\',27,12);">Ps 27:12</a>. The King James Version has it in <a onClick="return mV(\'Gen\',49,5);">Ge 49:5</a>; <a onClick="return mV(\'Psa\',74,20);">Ps 74:20</a> (the Revised Version (British and American) "violence"); <a onClick="return mV(\'Eze\',34,4);">Eze 34:4</a> (perekh, "crushing," the Revised Version (British and American) "rigor").<P>The Old Testament records many acts on the part of chosen individuals and the elect nation which are marked by gross cruelty, particularly when measured by the leaders are standards of our own age. Some of these acts are sanctioned by Scripture or even presented as commanded by God, as, for example, the sacrifice of Isaac, the extermination of the Canaanites, the authorization of the avenger of blood and of human slavery, and of retaliation for evil. Some of the deeds performed by Divinely appointed of Israel are characterized by inhumanity. Samuel "hewed Agag in pieces" (<a onClick="return mV(\'1Sa\',15,33);">1Sa 15:33</a>). David massacred the Ammonites with great barbarity (<a onClick="return mV(\'2Sa\',12,31);">2Sa 12:31</a>). Elijah slew the prophets of Baal (<a onClick="return mV(\'1Ki\',18,40);">1Ki 18:40</a>; compare <a onClick="return mV(\'2Ki\',1,10);">2Ki 1:10</a>; <a onClick="return mV(\'2Ki\',10,25);">10:25</a>). Some of the utterances of the Psalmists breathe spirit of hate and revenge, as in the so-called imprecatory psalms (<a onClick="return mV(\'Psa\',137,8,9);">Ps 137:8-9</a>; <a onClick="return mV(\'Psa\',139,21);">139:21</a>f). This has often been a matter of great perplexity to the devout student of the Bible. He has found it difficult to reconcile such practices, which bear the stamp of Divine approval, with the highest standards of Christian morality. It is sometimes urged in justification that these deeds are permitted, but not commanded by God. But this answer if we recognize the fact, which Jesus emphasizes, that the in attendant cruelties and horrors. The Old Testament religion is a self-accommodation to the low moral standard of those whom it was designed to instruct. This He reiterates in the Sermon on the Mount (<a onClick="return mV(\'Mat\',5,22,28,34);">Mt 5:22, 28, 34</a>), and affirms in His reference to the hardness of the ancestral Jewish heart (<a onClick="return mV(\'Mat\',19,8);">Mt 19:8</a>). In the Old Testament we are dealing with the childhood of the world, in which revelation is compelled to limit itself to the comprehension of its subjects. It must speak so that they can understand. It must start with them where it finds them. It walk, that character may grow step by step. A gradual development of spiritual and ethical ideals may clearly be traced in the sacred records. We must therefore read the Old Testament narratives and interpret their teaching, not according to the standards of our own age, but the light of the age to which these narratives belong. The spirit of Elijah may not be the spirit of Christ (<a onClick="return mV(\'Luk\',9,55);">Lu 9:55</a>). While many of the acts of cruelty and barbarity recorded in the Old Testament are indicative of an age of a low type of morality, yet we must at the same time recognize the fact, that Israel\'s religion by emphasizing holy living and righteous conduct created an atmosphere favorable for the growth of high ethical ideals. Wherever this religion is seen at its best, as in the teachings of the prophets, it is the mark of the righteous man to treat human life as sacred and to refrain scrupulously from inflicting unnecessary pain. Even the Gentiles shall be brought to judgment for their barbarities and inhuman practices (<a onClick="return mV(\'Amo\',1,2);">Am 1:2</a>f; <a onClick="return mV(\'2Ki\',25,7);">2Ki 25:7</a>). Among the blessings of the Messianic kingdom, predicted by the prophets, is the cessation of war with all of its Law of Israel also reflected this tendency toward humanity, and many of its ordinances, while seemingly inhuman, really tended to mitigate prevailing barbarity. Instances of such ordinances those referring to the maltreatment of slaves (<a onClick="return mV(\'Exd\',21,20);">Ex 21:20</a>), to the Cities of Refuge (<a onClick="return mV(\'Num\',35,19);">Nu 35:19</a>ff; compare <a onClick="return mV(\'Jos\',20,\'1-\');">Jos 20</a>), to rules of warfare (<a onClick="return mV(\'Deu\',20,10);">De 20:10</a>f), etc. The extermination of the Canaanites is represented as a Divine judgment upon a morally corrupt civilization (<a onClick="return mV(\'Gen\',15,16);">Ge 15:16</a>; <a onClick="return mV(\'Deu\',12,30);">De 12:30</a>). It is declared necessary in order to guard the Hebrews from contamination by the sins of the Canaanites (<a onClick="return mV(\'Exd\',23,32);">Ex 23:32</a>). It is not so far back, that many of the practices that are condemned by the most enlightened Christianity of our day, prevailed universally and were not thought incompatible with Christian civilization. Even our own time needs to secure a more widespread practical recognition of the principles of humanity, kindness and justice, which are professedly the law of the Christian life. L. Kaiser must lead them along lines in which they of their own volition can hardly meets the facts of the case. We shall arrive at a truer answer``1';
isbe[2435]='Crumb`krum (psichion, "a little bit"): Occurs only in the New Testament, of remnants of food, scraps. Lazarus desired "to be fed with the crumbs that fell from the rich man\'s table" (<a onClick="return mV(\'Luk\',16,21);">Lu 16:21</a>). "Even the (little) dogs eat of the crumbs" (<a onClick="return mV(\'Mat\',15,27);">Mt 15:27</a>; <a onClick="return mV(\'Mar\',7,28);">Mr 7:28</a>), "possibly the fragments of bread on which the guests wiped their hands (after thrusting them into the common dish), and flung to the dogs" (Farrar, Life of Christ, I, 476).``1';
isbe[2436]='Cruse`kroos: A small earthen vessel or flask, usually for holding liquids: tsappachath; as water, <a onClick="return mV(\'1Sa\',26,11,12,16);">1Sa 26:11-12, 16</a>; <a onClick="return mV(\'1Ki\',19,6);">1Ki 19:6</a>; it being porous, the liquid is kept cool; also for holding oil, as in <a onClick="return mV(\'1Ki\',17,12,14,16);">1Ki 17:12,14,16</a>.<P>In <a onClick="return mV(\'1Ki\',14,3);">1Ki 14:3</a> ("a cruse of honey") the word baqbuq, would be better rendered "bottle," doubtless deriving its name from the gurgling sound of issuing liquids. In <a onClick="return mV(\'2Ki\',2,20);">2Ki 2:20</a> tselochith, is not a jar or flask, but a dish, or platter, for salt or other substances.<P>In the New Testament a small jar or vial, alabastron, "alabaster cruse" or flask, for holding ointment; not "box" as in the King James Version (<a onClick="return mV(\'Mat\',26,7);">Mt 26:7</a>; <a onClick="return mV(\'Mar\',14,3);">Mr 14:3</a>; <a onClick="return mV(\'Luk\',7,37);">Lu 7:37</a>; compare <a onClick="return mV(\'1Sa\',10,1);">1Sa 10:1</a>; <a onClick="return mV(\'2Ki\',9,1,3);">2Ki 9:1, 3</a>, where "box" in the King James Version is used for "vial" the Revised Version (British and American)).``137';
isbe[2437]='Cry, Crying`kri\'-ing (zaaq, tsa\'aq (and forms), qara\', shawa\', rinnah; boao, krazo, phoneo):<P>Various words are translated "cry," "crying," etc., the chief of which are those above given; za\'aq and tsa\'aq denote especially a cry for help, from pain or distress, and are frequently used for crying to God, e.g. (za\'aq, <a onClick="return mV(\'Exd\',2,23);">Ex 2:23</a>; <a onClick="return mV(\'Jdg\',3,9,15);">Jud 3:9, 15</a>; <a onClick="return mV(\'Psa\',22,5);">Ps 22:5</a>; <a onClick="return mV(\'Psa\',107,13,19);">107:13, 19</a>; <a onClick="return mV(\'Mic\',3,4);">Mic 3:4</a>); (tsa\'aq, <a onClick="return mV(\'Exd\',8,12);">Ex 8:12</a>; <a onClick="return mV(\'Exd\',15,25);">15:25</a>; <a onClick="return mV(\'Psa\',34,17);">Ps 34:17</a>; <a onClick="return mV(\'Psa\',77,1);">77:1</a>; <a onClick="return mV(\'Isa\',19,20);">Isa 19:20</a>; <a onClick="return mV(\'Lam\',2,18);">La 2:18</a>); qara\' (a mimetic word) has the widest signification, but is often used of appealing to God (frequently translated "call," "called," etc., <a onClick="return mV(\'Gen\',39,14,15,18);">Ge 39:14-15, 18</a>; <a onClick="return mV(\'Gen\',41,43);">41:43</a>; <a onClick="return mV(\'Deu\',15,9);">De 15:9</a>; <a onClick="return mV(\'Deu\',24,15);">24:15</a>; <a onClick="return mV(\'1Ki\',18,27);">1Ki 18:27</a>; <a onClick="return mV(\'Psa\',3,4);">Ps 3:4</a>; <a onClick="return mV(\'Psa\',22,2);">22:2</a>; <a onClick="return mV(\'Psa\',27,7);">27:7</a>; <a onClick="return mV(\'Pro\',1,21);">Pr 1:21</a>; <a onClick="return mV(\'Isa\',34,14);">Isa 34:14</a>; <a onClick="return mV(\'Jer\',2,2);">Jer 2:2</a>, etc.); shawa\', "to cry aloud" (<a onClick="return mV(\'Job\',29,12);">Job 29:12</a>; <a onClick="return mV(\'Job\',30,20,28);">30:20, 28</a>; <a onClick="return mV(\'Psa\',18,6,41);">Ps 18:6, 41</a>; <a onClick="return mV(\'Psa\',88,13);">88:13</a>; <a onClick="return mV(\'Jon\',2,2);">Jon 2:2</a>; <a onClick="return mV(\'Hab\',1,2);">Hab 1:2</a>, etc.); rinnah,
