P><a href="./study/isbe/search.html?string=USURY"><b>Usury</b></a>. See separate article.<P><b>Witnessing, False</b>.<P>The Hebrew idiom is \'edh sheqer, "witness of a falsehood," "lie" (<a onClick="return mV(\'Exd\',20,16);">Ex 20:16</a>; <a onClick="return mV(\'Deu\',19,16,18);">De 19:16, 18</a>; <a onClick="return mV(\'Pro\',6,19);">Pr 6:19</a>; <a onClick="return mV(\'Pro\',14,5,25);">14:5, 25</a>; <a onClick="return mV(\'Pro\',19,5,9);">19:5, 9</a>); Greek pseudomartureo, "to bring false testimony"; -marturia, "bearing of false testimony" (<a onClick="return mV(\'Mar\',10,19);">Mr 10:19</a>; <a onClick="return mV(\'Mar\',14,56,57);">14:56-57</a>). It goes without saying that the law was emphatic in its denunciation of this practice, and in order that the innocent might be protected against the lying accuser, a criminal was to be convicted only on the testimony of at least two or three witnesses, testifying to the same facts (<a onClick="return mV(\'Num\',35,30);">Nu 35:30</a>). If one be found testifying falsely, he was to be punished by suffering the penalty which would have been inflicted on him against whom he testified, had he been convicted (<a onClick="return mV(\'Deu\',19,\'16-19\');">De 19:16-19</a>).<P><b>Whoredom</b>.<P>Hebrew zanah = "to commit adultery," "fornication or illicit incontinence of any kind"; and its derivative taznuth = "fornication," "harlotry," "whoredom"; Greek porneuo (verb), and porneia (noun), of the same meaning. The following passages will reveal the estimate in which such uncleanness was held, and the fact that men and women given to it were held in equal abhorrence and designated by the same terms: <a onClick="return mV(\'Gen\',38,24);">Ge 38:24</a>; <a onClick="return mV(\'Lev\',19,29);">Le 19:29</a>; <a onClick="return mV(\'Num\',14,33);">Nu 14:33</a>; <a onClick="return mV(\'Num\',25,1);">25:1</a>; <a onClick="return mV(\'Eze\',16,\'1-\');">Eze 16</a>; <a onClick="return mV(\'Eze\',23,3,7,8,11,27,29,43);">23:3, 7-8, 11, 27, 29, 43</a>; <a onClick="return mV(\'Eze\',43,7,9);">43:7, 9</a>; <a onClick="return mV(\'Hsa\',1,2);">Ho 1:2</a>; <a onClick="return mV(\'Hsa\',2,4);">2:4</a>; <a onClick="return mV(\'Hsa\',4,11,12);">4:11-12</a>; <a onClick="return mV(\'Hsa\',6,10);">6:10</a>; <a onClick="return mV(\'Nah\',3,4);">Na 3:4</a>; <a onClick="return mV(\'Mat\',5,32);">Mt 5:32</a>; <a onClick="return mV(\'Rom\',1,26);">Ro 1:26</a>f; <a onClick="return mV(\'1Cr\',5,1);">1Co 5:1</a>; <a onClick="return mV(\'1Cr\',7,2);">7:2</a>; <a onClick="return mV(\'1Cr\',10,8);">10:8</a>; <a onClick="return mV(\'Jud\',1,7);">Jude 1:7</a>; <a onClick="return mV(\'Rev\',2,14,20);">Re 2:14, 20</a>f; <a onClick="return mV(\'Rev\',18,9);">18:9</a>; <a onClick="return mV(\'Rev\',19,2);">19:2</a>.<P>Figurative: Because of the infidelity to the lifemate and to right living involved in such acts, the practice became symbolical of infidelity to God and His law, and thus served as a frequent figure of speech for Israel\'s error and apostasy.`<a href="./study/isbe/search.html?string=HARLOT">HARLOT</a>`77';

isbe[2417]='Cripple`krip\'-\'-l (cholos): Only occurs in <a onClick="return mV(\'Act\',14,8);">Ac 14:8</a>, denoting the congenitally lame man at Lystra. In the King James Version (1611) the word is spelled "creeple." It originally meant one whose body is bent together as in the attitude of creeping. This was probably a case of infantile paralysis.``1';
isbe[2418]='Crisping Pins`kris\'-ping: Pins for crisping, or curling, the hair. Thus the King James Version renders Hebrew charitim (<a onClick="return mV(\'Isa\',3,22);">Isa 3:22</a>; compare Vulgate). the Revised Version (British and American) substitutes more correctly "satchels" (so Qimchi (compare <a onClick="return mV(\'2Ki\',5,23);">2Ki 5:23</a>); compare Arabic). Others think of girdles; still others of veils or head-bands.``1';
isbe[2419]='Crispus`kris\'-pus (Krispos, "curled"): One of the small number baptized by Paul among the Corinthian Christians (<a onClick="return mV(\'1Cr\',1,14);">1Co 1:14</a>). He had been ruler of the Jewish synagogue, but he "believed in the Lord with all his house"; and, following Paul, withdrew from the synagogue (<a onClick="return mV(\'Act\',18,7,8);">Ac 18:7-8</a>). He seems to have been succeeded by Sosthenes (<a onClick="return mV(\'Act\',18,17);">Ac 18:17</a>). According to tradition he became bishop of Aegina.``1';
isbe[2420]='Criticism`(The Graf-Wellhausen Hypothesis)<p><b>I. PRELIMINARY</b><P class="in15">1. Thesis<P class="in15">2. Historical Perspective<P class="in15">3. Inspiration and Criticism<p><b>II. THE LEGISLATION</b><P class="in15">1. Groups<P class="in15">2. Covenant Code<P class="in15">3. The Sanctuary<P class="in15">4. Kinds of Sacrifice<P class="in15">5. Sacrifice in General<P class="in15">6. Vestments<P class="in15">7. Priests and Levites<P class="in15">8. Dues<P class="in15">9. Miscellaneous<P class="in15">10. Summary<P class="in15">11. Additional Note<p><b>III. THE HISTORY</b><P class="in15">1. Chronicles<P class="in15">2. Kings, etc.<P class="in15">3. The Conquest<P class="in15">4. Ideas of God<P class="in15">5. Priesthood<P class="in15">6. Summary<p><b>IV. RECONSTRUCTION</b><P class="in15">1. Covenant Code<P class="in15">2. Deuteronomy<P class="in15">3. Later<P class="in15">4. Evaluation<P><b>LITERATURE</b><hr /><p>I. Preliminary.<P>1. Thesis:<P>In <a onClick="return mV(\'Jer\',7,22,23);">Jer 7:22-23</a> we read: "For I spake not unto your fathers, nor commanded them in the day that I brought them out of the land of Egypt, concerning burnt-offerings or sacrifices: but this thing I commanded them, saying, Hearken unto my voice, and I will be your God, and ye shall be my people." It is the contention of the present article that this statement of the prophet is correct (compare II, 5).<P>More specifically, it is contended that evidence can be produced from the Old Testament to show that Israel\'s religion can be seen in a long period of growth; and in this growth a fixed sacrificial law, with a minutely regulated ritual obligatory on all Israelites, the culmination and not the beginning of the process. It is contended, moreover, that this conception of the development of the institutional side of the religion of the Old Testament is attained by the strictest evaluation of all the Old Testament evidence and by no a priori considerations.<P>2. Historical Perspective:<P>To be sure, one is met at once in the Old Testament by what seem to be complete denials of this point of view. In the Pentateuch we find statement after statement that a given law was due not to some late author but to Moses himself, and there are numerous passages in the historical books (most notably in Chronicles) that speak of these laws as in effect from the earliest times. Such evidence must be paid all possible respect and must be overruled only on the most imperative considerations.<P>However, if for the moment the books of the Old Testament be viewed only as historical documents, it will be admitted that the possibility of overruling such evidence may well arise. And it may very well arise without calling in question in the slightest degree the good faith of the writers of questioned passages; for an acquisition of historical perspective comes very late in intellectual evolution, particularly—though not only—in the realm of religious history. Even the trained scholar has to be on his guard lest he read back the concepts of his own time into some past generation, while the non-specialist never succeeds in avoiding this error completely. For the uncultured mind, especially for the Oriental, the problem scarcely exists. That which is generally accepted and which is not obviously novel tends to be classified as that which "always has been." A law so old that its actual source is forgotten is referred as a matter of course to some great lawgiver of the past. A custom that in a writer\'s own day is universally observed by the pious must always have been observed by the pious. Even documentary evidence to the contrary is not convincing to such a writer, for that documents may be wrong is not a modern discovery. To be sure, the older document may be copied mechanically or the discrepancy may not even be noticed. But it is never surprising when we find a writer simply accrediting the pious men of old with the customs of his own day, since even documentary evidence to the contrary he felt could not be right. This is not forgery, as we understand the word, nor need there be the faintest moral reproach connected with such conduct. Quite on the contrary, such a writer may well be acting in the only sense that the conscience of any man of his generation could conceive right.<P>3. Inspiration and Criticism:<P>However, the Old Testament is not a mere collection of human documents, and another question arises. Does the acceptance of inspiration compel us to assume that in every case a writer\'s ordinary historical methods were entirely overruled? The question is a rather broad one and does not relate merely to the correct transmission of historic facts. To be asked, rather, is this: Did God present to His instruments a mechanically accurate set of past facts which would give a conception of history that no one of the sacred writer\'s generation could understand? Or did He suffer His revelation to find expression in terms of the current conceptions of history, much as we are accustomed to say it found expression in terms of the current conceptions of science? A full discussion of the various theological arguments involved would be quite outside the province of an article of this Encyclopedia, but reference must be made to two important Biblical arguments:<P>(1) In a question which thus affects the amount covered by the inspiration of the Bible, quotations from the Bible itself beg the question when adduced to show entire infallibility. So appeals to the New Testament are hardly helpful. Moreover, they prove too much. In <a onClick="return mV(\'Jud\',1,14,15);">Jude 1:14-15</a> there is a quotation from the Book of Enoch (<span class="noTag">1:9</span>), which is made in the most formal manner possible. But will anyone maintain that this compels us to believe that our Book of Enoch was actually written by Enoch, the seventh from Adam? Yet if the quotation had been taken from an Old Testament work, precisely this would have been maintained.<P>(2) Far more important is the use of the Old Testament by Christ, for here a quite different authority comes in. But the question must be asked: Just how far did our Lord\'s use of a passage involve ratification of all the current ideas about that passage? A good answer is supplied by <a onClick="return mV(\'Act\',1,6,7);">Ac 1:6-7</a>. When He is asked, "Dost thou at this time restore the kingdom to Israel?" we know that the pedantically "correct" answer would have been, "The kingdom never will be restored to Israel in any such sense as ye conceive of it." Yet this is precisely what Christ does not say. "It is not for you to know times or seasons." No hint was given at all that the kingdom was universal, for the disciples would find that out for themselves in good time. In order that they should be able to do God\'s work there was no need to bewilder them with a truth as yet altogether revolutionary. And any close student of the "Kingdom of God" passages soon realizes how often Christ uses current terminology without comment, even when it seems almost materialistic. A literal exegesis of <a onClick="return mV(\'Luk\',22,18);">Lu 22:18</a> would necessitate believing that grapes will grow in the world to come and that Christ will drink wine made from them, and almost certainly the disciples gathered just this idea from the words. But no one today finds them in the least a difficulty. The exact extent of the kingdom and the exact nature of the happiness in it were irrelevant to what the disciples had to do. And so it cannot be thought an injustice to treat Christ\'s use of the Old Testament by exactly the same rules, all the more as nowhere, not even in <a onClick="return mV(\'Mar\',12,36);">Mr 12:36</a>, does the argument turn on the original human author or the date of writing. What Christ Himself, in His inner consciousness, knew on the subject is something beyond our immediate data. But His use of the Old Testament lends no support to a Kenotic theory, not even on the wildest Old Testament critical hypotheses.<P>See <a href="./study/isbe/search.html?string=KENOSIS">KENOSIS</a>.<p>II. The Legislation.<P>As is well known, among the laws of the Pentateuch there exist several well-marked groups, of which the most formal is <a onClick="return mV(\'Deu\',24,\'12-\');">De 12-26</a>.<P>1. Groups:<P>Another such group is <a onClick="return mV(\'Lev\',17,\'1-\');">Le 17-26</a> or the Holiness Code (H), and still another is <a onClick="return mV(\'Exd\',20,\'22-\');">Ex 20:22-23:19</a> or the Covenant Code (CC). With this last is closely connected the Decalogue and the little compend <a onClick="return mV(\'Exd\',34,\'17-26\');">Ex 34:17-26</a>. Now it will be convenient for present purposes to designate the remaining mass of Pentateuchal legislation under the non-committal symbol X.<P>2. Covenant Code:<P>In the first place, attention may be directed to Covenant Code as a whole. Whatever it was meant to be, it was not meant as a mere interims code for the period of the wanderings, either in its civil or its religious prescriptions. One piece of evidence alone is enough to show the contrary: in the laws touching settlements of disputes it is presupposed that Moses himself is not accessible. And the life assumed is agricultural. Men are living in fields with settled boundaries (<a onClick="return mV(\'Exd\',22,5,6);">Ex 22:5-6</a>). The vine and the olive are both under cultivation (<a onClick="return mV(\'Exd\',22,5,29);">Ex 22:5, 29</a>; <a onClick="return mV(\'Exd\',23,11);">23:11</a>), under such settled circumstances that the rest of the Sabbatical year can be observed. And of the feasts, Weeks and Tabernacles are connected with the harvests (<a onClick="return mV(\'Exd\',23,16);">Ex 23:16</a>). Of course, Moses may very well have given commands that looked to the future, but the present contention is simply that it was the remote and not the immediate future that is in point on this assumption. The life is Canaan and not the wilderness. But, now, the life is very primitive life. Flocks are of great importance, as is shown by the proportion of space given to laws about them. Rulers are mentioned only in <a onClick="return mV(\'Exd\',22,28);">Ex 22:28</a> (nasi\'), and judges, as settled officers, are not mentioned at all, for the very rare word in <a onClick="return mV(\'Exd\',21,22);">Ex 21:22</a> (palil, <a onClick="return mV(\'Deu\',32,31);">De 32:31</a>; <a onClick="return mV(\'Job\',31,11);">Job 31:11</a> only) should be translated "umpire." Indeed in <a onClick="return mV(\'Exd\',23,\'1-9\');">Ex 23:1-9</a> the duties of citizens, witness and judge are so intermingled as to suggest that judgment was administered by a general gathering of the people. It is taken for granted that a master has marital rights over his maidservants (<a onClick="return mV(\'Exd\',21,\'7-11\');">Ex 21:7-11</a>). Coined money is mentioned only in <a onClick="return mV(\'Exd\',21,32);">Ex 21:32</a>, if there. There is no attempt to define proportions exactly; compare <a onClick="return mV(\'Exd\',22,5);">Ex 22:5</a> ("best of his own field") and <a onClick="return mV(\'Exd\',22,29);">Ex 22:29</a> (the amount of the gift—a tenth?—not stated). Similarly there is no precise dating of the feasts of Weeks and Tabernacles in <a onClick="return mV(\'Exd\',23,16);">23:16</a>, while the exact day in Abib (<a onClick="return mV(\'Exd\',23,15);">Ex 23:15</a>) is at least not specified. Now, if this code could be isolated from the rest of the legislation, would not one refer it naturally on the above grounds alone to a time not very far either way from that of Saul?<P>Now, in what follows, the prescriptions of the various codes will be compared with each other in regard to the various institutions of Israel\'s religion and also studied in the wider evidence of the historical books. The evidence of Chronicles, however, will be omitted for the most part, as a separate section is devoted to it (III, 1).<P>3 The Sanctuary:<P>(1) The firstling is to be with its dam seven days, but on the eighth (not later!) it is to be given to God. The offerings from the harvest and from the presses (wine and olives) are to be offered without delay (<a onClick="return mV(\'Exd\',22,29,30);">Ex 22:29-30</a>). Consequently the place of offering must have been readily accessible. By what has been said above and by the mention of "presses" here, ready accessibility in Palestine is presupposed. But this implies a multiplicity of sanctuaries. And in Samuel-Kings this multiplicity of sanctuaries is exactly what is found. Samuel sacrifices in Mizpah (<a onClick="return mV(\'1Sa\',7,9);">1Sa 7:9</a>), in Ramah (<a onClick="return mV(\'1Sa\',9,12);">1Sa 9:12</a>ff), in Gilgal (<a onClick="return mV(\'1Sa\',11,15);">1Sa 11:15</a>) and in Bethlehem (<a onClick="return mV(\'1Sa\',16,5);">1Sa 16:5</a>). David\'s family held a yearly sacrifice in Bethlehem, which David attended regularly (<a onClick="return mV(\'1Sa\',20,6);">1Sa 20:6</a>). Solomon received a special revelation from God at Gibeon (<a onClick="return mV(\'1Ki\',3,4);">1Ki 3:4</a>ff—for the account in Chronicles see III, 1). Although the heart of Asa was perfect and the way of Jehoshaphat right, yet the many altars were suffered to remain (<a onClick="return mV(\'1Ki\',15,14);">1Ki 15:14</a>; <a onClick="return mV(\'1Ki\',22,43);">22:43</a>—again for Chronicles see III, 1). The destruction of the altars of God was to Elijah a terrible calamity (<a onClick="return mV(\'1Ki\',19,10);">1Ki 19:10</a>). While Amos and Hosea abound in denunciations of sacrifices as substitutes for righteousness, yet they never even intimate a duty to offer sacrifices in some other place (<a onClick="return mV(\'Amo\',1,2);">Am 1:2</a>; <a onClick="return mV(\'Hsa\',3,5);">Ho 3:5</a> are irrelevant). Not even do <a onClick="return mV(\'Mic\',4,2);">Mic 4:2</a> and <a onClick="return mV(\'Isa\',2,2);">Isa 2:2</a> imply that Jerusalem was to have the sole right to the cult.<P>(2) Ezekiel is the first prophet who makes the place of sacrifice a matter of paramount importance, and this importance of the place is, in the Pentateuch, emphasized primarily in Deuteronomy. It is needless to collect the familiar evidence from Deuteronomy, but an illuminating comparison with Covenant Code is given by the laws for firstlings. No longer is the firstling given on the eighth day. It must be kept, but not worked or shorn, until the time when "year by year" it may be eaten in the chosen place (<a onClick="return mV(\'Deu\',15,19,20);">De 15:19-20</a>). So now the fruits of the field and the "presses" are not offered "without delay" but again "year by year," with a provision for turning them into money if the way be too long to the sanctuary (<a onClick="return mV(\'Deu\',14,\'22-27\');">De 14:22-27</a>). Deuteronomy and Covenant Code evidently have distinct conceptions—and again attention may be called to the fact that Covenant Code contains laws for Palestine, not for the wilderness. The Law of Holiness (H), <a onClick="return mV(\'Lev\',17,\'1-\');">Le 17-26</a>, is as explicit as Deuteronomy—sacrifice anywhere except at the Tent is a capital offense (<a onClick="return mV(\'Lev\',17,8,9);">Le 17:8-9</a>). And the evidence of X need not be collected, but, passing out of the Pentateuch for the moment, <a onClick="return mV(\'Jos\',22,\'10-34\');">Jos 22:10-34</a> represents Israel as understanding from the first entrance into Canaan that sacrifice at any altar but the one was the worst of crimes.<P>(3) How is the offering of sacrifices in various places by such men as Samuel to be explained? That the worship was disorganized and the proper sanctuary could not be reached is hardly an explanation. For no disorganization of the country could be great enough to justify the offering of sacrifices in places not only unauthorized but flatly forbidden in <a onClick="return mV(\'Lev\',17,8,9);">Le 17:8-9</a>. On theory of Mosaic origin for the whole of the Pentateuchal legislation, Samuel knew as much about the clear statements of the Law as does any Jew of today, but it is clearly enough recognized by all Jews that no disorganization of the county or Divine reprobation of the Temple justifies sacrifice in any other place. A key, however, seems to be found in <a onClick="return mV(\'Deu\',12,\'8-11\');">De 12:8-11</a>, where sacrifice in various places is actually authorized until such a time as the land should be pacified and the Divine choice given to a place—a time represented in the history of Israel as about the time of David, or perhaps Solomon. This certainly does explain the situation as it is found in Samuel-Kings. Only, it is in flat contradiction with H and X.<P>This point is important. <a onClick="return mV(\'Deu\',12,\'8-11\');">De 12:8-11</a> not only represents sacrifice in various places as permitted until some later time, but it represents Moses and the Israelites as practicing the same things in the wilderness—"the things that we do here this day, every man whatsoever is right in his own eyes; for ye are not as yet come," etc.; i.e. Deuteronomy\'s conception was that in the wilderness Moses and the Israelites offered sacrifice wherever they thought good. This was to continue until God gave them rest from their enemies round about. Then the sacrifices were to be brought to the chosen place and to be offered nowhere else. Now, the conception in H and X is wholly different. On the mount Moses received directions for the building of the Tabernacle, with its altar. From the beginning it was a capital offense to offer sacrifices on any other altar than this (<a onClick="return mV(\'Lev\',17,8,9);">Le 17:8-9</a>), which was carried everywhere on the wanderings and brought into Canaan. In the very days of Phinehas, the offering of sacrifices on a different altar was enough to make civil war justifiable (<a onClick="return mV(\'Jos\',22,12);">Jos 22:12</a>). For further discussion see III, 2.<P>(4) The difficulties of these data are obvious but are completely satisfied by the assumption that different conceptions of past history are present. Deuteronomy belongs to a period when the unity of the sanctuary had become an established fact, but still before the memory of the many altars as comparatively legitimate was extinguished. H and X, however, belong to a considerably later day, when the unity of the sanctuary had been so long taken for granted that no pious Israelite could conceive that anything else had ever existed. The reference of the commands to Moses is altogether in oriental manner.<P>NOTE.—<a onClick="return mV(\'Exd\',20,24);">Ex 20:24</a> has not been used in the above argument, but with the evidence presented there seems to be no obstacle to the translations of the EV. The familiar evidence of Judges is of course merely cumulative.<P><a onClick="return mV(\'Lev\',1,\'1-\');">Leviticus 1-7</a> contains a list of the various kinds of sacrifices:<P>4. Kinds of Sacrifice:<P>(a) the sin offering and the trespass offering, very elaborately treated and obviously of the highest importance;<P>(b) the whole burnt offering and the peace offering; and, standing a little by itself, the meal offering.<P>The latter is of no especial significance for the present discussion and may be neglected. Now a curious fact may be noted. In the prophetic writings before Ezekiel there is not one single reference to class (a). This is not simply the argument from silence, for sacrifices with their special names are mentioned freely and sacrificial rites described—invariably of class (b), even when presented for penitential purposes. If the offering is not burnt whole, the worshipper eats of it—it is a peace offering. <a onClick="return mV(\'Jer\',7,21);">Jer 7:21</a> is a particularly significant example, but compare <a onClick="return mV(\'Amo\',4,4,5);">Am 4:4-5</a>; <a onClick="return mV(\'Amo\',5,22,25);">5:22, 25</a>; <a onClick="return mV(\'Hsa\',8,13);">Ho 8:13</a>; <a onClick="return mV(\'Hsa\',9,4);">9:4</a>; <a onClick="return mV(\'Isa\',1,11);">Isa 1:11</a>; <a onClick="return mV(\'Isa\',22,\'12-14\');">22:12-14</a>; <a onClick="return mV(\'Isa\',28,7,8);">28:7-8</a>; <a onClick="return mV(\'Jer\',6,20);">Jer 6:20</a>. Turning to Samuel-Kings we find this borne out. The names of the sin and trespass offerings appear in <a onClick="return mV(\'2Ki\',12,16);">2Ki 12:16</a>, but it is money that is referred to (the English Versions of the Bible should be checked with the Hebrew here), just as the golden mice appear as a trespass offering in <a onClick="return mV(\'1Sa\',6,3);">1Sa 6:3</a>ff. And in the codes, neither Covenant Code nor Deuteronomy mentions class (a) and even in H they appear only in <a onClick="return mV(\'Lev\',19,21,22);">Le 19:21-22</a>; i.e. what in later times appear as the greatest sacrifices of Israel—by <a onClick="return mV(\'Lev\',8,\'1-\');">Le 8</a> Israel\'s first sacrifice was a sin offering—are found only in X and are mentioned in the prophets for the first time in <a onClick="return mV(\'Eze\',40,39);">Eze 40:39</a>, while the other classes are mentioned frequently. It seems difficult to escape the inference that class (a) appeared relatively late in Israel\'s history, a point discussed more fully in IV.<P>5. Sacrifice in General:<P>The problem presented by <a onClick="return mV(\'Jer\',7,22);">Jer 7:22</a> is a very serious one. Obviously, to say that the command to offer sacrifice was not given on the day of the Exodus but on Sinai, is quite unsatisfactory, for this would make Jeremiah quibble. He denies categorically that a command to offer sacrifice was part of the Divine Law at all. Now, if it be noted that the offering of firstlings and first-fruits was altogether distinct from the regular sacrifices, it will be seen that Jeremiah can very well presuppose Covenant Code or even Deuteronomy, both of which contain only regulative prescriptions for sacrifice. (Whether Jeremiah actually did conceive Covenant Code and Deuteronomy as binding is another question.) But by what exegesis of the passage can Jeremiah pre-suppose X? The natural inference is that the regulations of X became obligatory on Israel after Jeremiah\'s day.<P>6. Vestments:<P>What follows is in itself an infinitesimal matter but the evidence is significant. The prohibition of steps for the altar in <a onClick="return mV(\'Exd\',20,26);">Ex 20:26</a> is based on the fact that the ministrants X were very scantily clad (compare the light clothing of pilgrims at Mecca). This is corroborated in <a onClick="return mV(\'2Sa\',6,14,20,21,22);">2Sa 6:14, 20-22</a>, where Michal reproves David for exposing himself. But in the priests wear rather elaborate vestments, over linen breeches (<a onClick="return mV(\'Exd\',28,42);">Ex 28:42</a>). And, to call in Chronicles for the moment, this is the conception found there of David\'s religious zeal at the bringing in of the ark. Besides the ephod he wears a long linen robe and Michal despises him, not for exposing himself, but only for dancing (<a onClick="return mV(\'1Ch\',15,\'27-29\');">1Ch 15:27-29</a>).<P>7. Priests and Levites:<P>(1) Covenant Code has no regulations regarding the priesthood, but of course it does not follow that this silence has any significance. However, Samuel-Kings furnish us with certain evidence. Samuel, although an Ephraimite (<a onClick="return mV(\'1Sa\',1,1);">1Sa 1:1</a>), offers sacrifice repeatedly (see 3, above). In <a onClick="return mV(\'2Sa\',20,25,26);">2Sa 20:25-26</a> the Hebrew says that Zadok and Abiathar were kohanim, and also Ira the Jairite was kohen unto David. Exactly the same word is used for Zadok and Ira in practically the same sentence, and no one without prior conceptions would have dreamed of giving it entirely distinct translations under the circumstances, as do the King James Version and the Revised Version texts (not margins). Again in <a onClick="return mV(\'2Sa\',8,18);">2Sa 8:18</a> it is said that David\'s sons were kohanim and in <a onClick="return mV(\'1Ki\',4,5);">1Ki 4:5</a> that Zabud was kohen. Now if kohen does not mean "priest" in these passages, they are the only cases out of a total of 750 occurrences. That the Chronicler understood the word to mean priest is shown by the fact that in his parallel to <a onClick="return mV(\'2Sa\',8,18);">2Sa 8:18</a> (<a onClick="return mV(\'1Ch\',18,17);">1Ch 18:17</a>) he uses a different word altogether. The natural inference from these passages is that the restriction of priestly ministration to a certain line came about after Solomon\'s time (compare <a onClick="return mV(\'Jdg\',17,12,13);">Jud 17:12-13</a>, a Levite is desirable but not essential).<P>(2) In Deuteronomy the priesthood appears as limited to the sons of Levi, but it is at least safe to say that no explicit distinction is made within the tribe. In <a onClick="return mV(\'Deu\',21,5);">Deu 21:5</a> the priests are the "sons of Levi," just as in <a onClick="return mV(\'Deu\',17,9);">Deu 17:9</a>; <a onClick="return mV(\'Deu\',18,1);">18:1</a>; <a onClick="return mV(\'Deu\',24,8);">24:8</a> the term is "the priests the Levites." In <a onClick="return mV(\'Deu\',10,8);">Deu 10:8</a> the right to bless and in <a onClick="return mV(\'Deu\',33,\'8-11\');">Deu 33:8-11</a> the right to offer incense and sacrifice are in no ways said to be restricted to a very small proportion of the tribe. Compare <a onClick="return mV(\'Jer\',33,21,22);">Jer 33:21-22</a> (here questions of authenticity are irrelevant). A clear distinction within the tribe of Levi appears in the prophetic writings for the first time in <a onClick="return mV(\'Eze\',44,\'10-31\');">Eze 44:10-31</a>, where two kinds of Levites are spoken of, "the priests the Levites, the sons of Zadok" (verse <a onClick="return mV(\'Eze\',44,15);">15</a>) and the Levites, simply (verse <a onClick="return mV(\'Eze\',44,10);">10</a>). No third class is recognized (compare <a onClick="return mV(\'Eze\',40,45,46);">Eze 40:45-46</a>, where the distinction is between two classes of priests). Now, the distinction between the Zadokian and non-Zadokian Levites is based by Ezekiel on one thing only, in the past the former had been faithful and the latter had not (<a onClick="return mV(\'Eze\',44,\'10-15\');">Eze 44:10-15</a>). Because the former had ministered before idols, therefore should they not come to execute the office of a priest, but perform only inferior ministrations. Now this can mean only that the non-Zadokians are excluded from priestly privileges that they once possessed. The non-Zadokians, if they had not sinned, would still have been legitimate priests in Ezekiel\'s eyes, for otherwise the exclusion from the altar would be eviscerated of all meaning as a punishment; i.e. Ezekiel knows of only two kinds of Levites, both kinds originally legitimate priests, but one class now to be forbidden access to the altar because of sin. A third class of Levite, non-Aaronites, who never had had access to the altar, but who, because of their righteousness, had been blessed with the privilege to perform minor ministerial acts, is conspicuous in Ezekiel by its absence. And this absence, in the face of the immense amount of minute detail contained in <a onClick="return mV(\'Eze\',40,\'1-\');">Eze 40-48</a>, can be explained on no other hypothesis than that Ezekiel did not know of such a class. When the immense importance of the non-Aaronite Levites in Chronicles, Ezra, etc., is thought of, what other explanation can be given for their omission in Ezekiel\'s elaborate regulations for the cult? To whom did Ezekiel consider the more menial work in the Temple would have fallen if the non-Zadokians had not sinned? Probably he never raised the question at all, but there is no objection to supposing that he would have assigned it to the priesthood as a whole.<P>(3) It is needless to collect the evidence of X. The non-Aaronite Levites appear there as ministers of the greatest importance, elaborately set apart, and with their duties and privileges accurately defined (<a onClick="return mV(\'Num\',8,\'1-\');">Nu 8</a>, especially). Now, it is submitted that this evidence points in its most natural interpretation to a gradual narrowing of the priestly privileges in Israel through a period of many centuries. It is natural, though by no means necessary, to identify the non-Zadokians of Ezekiel with the non-Aaronites of X. At all events it is argued that in course of time, long after the priesthood had become restricted to Levites only, a considerable proportion of the latter lost their priestly privilege. Ezekiel stood near enough to the change (that he was the actual innovator is improbable) to state the fact of the degradation and its cause. X regarded the distinction as of such long standing that it must be accredited to Moses himself. It is highly probable that evidence of the change is to be found in <a onClick="return mV(\'Deu\',18,\'6-8\');">De 18:6-8</a>, but this will not be pressed here.<P>8. Dues:<P>(1) In Covenant Code first-fruits are to be offered in <a onClick="return mV(\'Exd\',23,19);">Ex 23:19</a> and a portion (perhaps a tenth, but not specified as such) of the whole harvest in <a onClick="return mV(\'Exo\',22,29);">22:29</a>. Nothing is said about their disposition. In Deuteronomy, the first-fruits of grain, wine and oil (with fleece) belong to the "priests the Levites" (<a onClick="return mV(\'Deu\',18,4);">18:4</a>). And the basket of "fruit" in the beautiful rite of <a onClick="return mV(\'Deu\',26,\'1-11\');">26:1-11</a> probably had the same destination. Of the general harvest the tithe is to be dedicated, as explained at length in <a onClick="return mV(\'Deu\',14,\'22-29\');">14:22-29</a>. The worshipper is to eat it himself, but shall take care to see that the Levite receives a portion. Every third year, however, the tithe is to be spent for the benefit of all who need charity, including the Levite. Note that in either case the Levite receives only a part of the tithe. In X the first-fruits are again assigned to the clergy (but now specifically to the priests—<a onClick="return mV(\'Num\',18,12,13);">Nu 18:12-13</a>). But it appears that the tithe is to be given wholly to the Levites in <a onClick="return mV(\'Num\',18,\'21-24\');">Nu 18:21-24</a>. The contradiction with <a onClick="return mV(\'Deu\',14,\'22-29\');">De 14:22-29</a> is real. That two tithes were to be paid by the worshipper may safely be assumed as impossible, as a tax of one-fifth would have been unendurable. (It may be noted, though, that in later days the very pious took this interpretation—compare Tobit 1:7—but it is certain that no such ruling ever maintained generally.) An alternative explanation offered is that it could be assumed that the Levite would invite the worshipper to join in a feast on the tithe. Frankly, it is difficult to treat this as quite candid. In Deuteronomy the worshipper is anything rather than a mere guest at another man\'s banquet. When the tithe has been brought as money, the worshipper is to spend it on anything that best pleases him, and of the Levite it is said only "thou shalt not forsake him." Moreover, the tithe is to be consumed at the sanctuary and nowhere else (<a onClick="return mV(\'Deu\',14,23);">De 14:23</a>; compare <a onClick="return mV(\'Deu\',12,11);">Deu 12:11</a>). In <a onClick="return mV(\'Num\',18,\'1-\');">Nu 18</a>, however, the tithe becomes the exclusive property of the Levite and it is assigned him as his source of income (verses <a onClick="return mV(\'Num\',18,\'25-32\');">25-32</a>) and so exclusively is it his that it in turn is tithed. And, far from being turned into a feast at which the worshipper shares, it need not be consumed at the sanctuary at all but may be eaten in "every place," wherever the Levite and his family may happen to live (verse <a onClick="return mV(\'Num\',18,31);">31</a>). It would be hard to conceive of two rules more mutually exclusive than the tithe directions in Deuteronomy and Numbers. That the livelihood provided for the Levites in Deuteronomy is pitiful is hardly in point and at all events he received more than did the widow and the orphan. But compare IV.<P>(2) Firstlings in Covenant Code must be offered on the eighth day (<a onClick="return mV(\'Exd\',22,30);">Ex 22:30</a>), but in <a onClick="return mV(\'Deu\',15,\'19-22\');">De 15:19-22</a> they were preserved, without being worked or shorn, until "year by year" they could be taken up to the sanctuary. (Apparently by <a onClick="return mV(\'Deu\',14,\'23-25\');">14:23-25</a> it might be converted into money in case of great distance.) Here the worshipper was to offer it and eat of it (a peace offering). But in <a onClick="return mV(\'Num\',18,\'15-18\');">Nu 18:15-18</a> the firstling becomes the personal property of the priest and he receives the flesh of the animal, if it can be sacrificed (i.e. it is his peace offering, not the worshipper\'s). There is no question of giving back a portion to the worshipper, again. Note, moreover, that in <a onClick="return mV(\'Deu\',15,\'21-23\');">De 15:21-23</a>, an animal not fit for sacrifice was eaten at home by the worshipper and so did not come in contact with the priest at all; contrast <a onClick="return mV(\'Num\',18,15);">Nu 18:15</a>.<P>(3) A minor matter is found in the portion of the peace offering that went to the priest. In <a onClick="return mV(\'Deu\',18,3);">De 18:3</a> it is specified as the shoulder, two cheeks and maw. In X (<a onClick="return mV(\'Exd\',29,26,27,28);">Ex 29:26-28</a>, etc.) this has become the breast and the right thigh—a considerably more advantageous portion.<P>(4) In Deu it is laid down that a Levite has no inheritance among his brethren (<a onClick="return mV(\'Deu\',10,9);">Deu 10:9</a>; <a onClick="return mV(\'Deu\',12,12);">12:12</a>; <a onClick="return mV(\'Deu\',18,1);">18:1</a>) and hence, is recommended as an object of charity, like the widow and the orphan. And, like the widow and the orphan, he lives "within thy gates" (<a onClick="return mV(\'Deu\',12,12);">Deu 12:12</a>, etc.), i.e. in the same cities as the rest of the Israelites. Now in X the adjurations to charity disappear, because he receives a fixed income (from the tithe), but it is said that this tithe is given the Levites in lieu of an inheritance, "Among the children of Israel they shall have no inheritance" (<a onClick="return mV(\'Num\',18,\'21-24\');">Nu 18:21-24</a>), In another part of X, however, there is still a different conception—the Levites receive no less than forty-eight cities with ample "suburbs," expressly said to be given them "from the inheritance" of Israel (<a onClick="return mV(\'Num\',35,\'1-8\');">Nu 35:1-8</a>). So in <a onClick="return mV(\'Lev\',25,\'32-34\');">Le 25:32-34</a> the houses of the Levites are "their possession among the children of Israel," and the fields "their perpetual possession" and inalienable. Is there any natural explanation of these passages except that they represent increasing efforts to provide properly for the Levites as time went on? That the different rules represent advances within Moses\' own period cannot be taken seriously, especially as on this hypothesis the Deuteronomy laws would have been the latest. See, in addition, III.<P>9. Miscellaneous:<P>(1) Covenant Code and Deuteronomy have little mention of coined money and little attempt to define fractions exactly. Contrast the elaborate regulations of, e.g. <a onClick="return mV(\'Lev\',27,\'1-\');">Le 27</a>. It is not contended that the Israelites could not have had enough culture in Moses\' day to calculate so accurately, but attention must be drawn to the extreme contrast.<P>(2) In Covenant Code (<a onClick="return mV(\'Exd\',23,16);">Ex 23:16</a>) the year begins in the fall, in H (<a onClick="return mV(\'Lev\',23,5);">Le 23:5</a>) and X (<a onClick="return mV(\'Exd\',12,2);">Ex 12:2</a>; <a onClick="return mV(\'Num\',9,5);">Nu 9:5</a>; <a onClick="return mV(\'Num\',28,16);">28:16</a>) it begins in the spring.<P>(3) <a onClick="return mV(\'Deu\',16,3);">De 16:3</a> explains the use of unleavened bread at the Passover as due to the haste with which the Israelites left Egypt (as in <a onClick="return mV(\'Exd\',12,39);">Ex 12:39</a>), while <a onClick="return mV(\'Exd\',12,\'15-20\');">Ex 12:15-20</a> makes this use depend on the positive command of God before the first-born were slain. And note that, in <a onClick="return mV(\'Exd\',12,\'18-20\');">Ex 12:18-20</a> is a simple repetition of <a onClick="return mV(\'Exd\',12,\'15-17\');">Ex 12:15-17</a> with a more precise dating added. For this matter of dating compare the rough statements of Covenant Code with the exactness of <a onClick="return mV(\'Lev\',23,\'1-\');">Le 23</a>.<P>(4) In Covenant Code marital rights of the master over his maidservants are taken for granted (<a onClick="return mV(\'Exd\',21,\'7-11\');">Ex 21:7-11</a>); in <a onClick="return mV(\'Deu\',15,17);">De 15:17</a> the maidservant has the same privilege of release as the manservant, with the evident assumption that slavery does not confer marital rights on the master. (It is of course gratuitous to assume that two different kinds of maidservants are meant, particularly as in both cases the maidservant is contrasted in general with the manservant in general.) Note, moreover, that in <a onClick="return mV(\'Exd\',20,17);">Ex 20:17</a> "wife" follows "house" in the prohibition against coveting, while in <a onClick="return mV(\'Deu\',5,21);">De 5:21</a> "wife" precedes "house" and a different verb is used. The inference is natural that between Covenant Code and Deuteronomy woman, both as slave and as wife, had risen to a higher position.<P>(5) In both Covenant Code (<a onClick="return mV(\'Exd\',21,6);">Ex 21:6</a>) and <a onClick="return mV(\'Deu\',15,17);">De 15:17</a> life-long slavery is permitted, if the slave desires it, otherwise the slave is free at the end of the sixth year. In H (<a onClick="return mV(\'Lev\',25,\'39-43\');">Le 25:39-43</a>), the slave serves until the Jubilee year and then goes free absolutely.<P>10. Summary:<P>Now, it is not claimed that all the discrepancies in the above lists are incapable of reconciliation, although the examples chosen are among those where reconciliation is extremely difficult. The claim is made, however, that all of this evidence is cumulative and that each successive item points more and more forcibly toward a single conclusion—that in the legislation of the Pentateuch, especially when considered in connection with the Prophets and with Samuel-Kings, there have been incorporated laws belonging to very different periods. And, for the most part, a development from the simple to the highly organized can be traced. And this conclusion explains all the facts.<P>11. Additional Note:<P>The above examples have been chosen as those where no changes in the text need be made. Of the other instances, only one need be considered—<a onClick="return mV(\'Lev\',17,\'1-\');">Le 17</a>. On its surface, this chapter appears to refer solely to life in the wilderness. But in <a onClick="return mV(\'Lev\',17,8,10,12,13,15);">Le 17:8, 10, 12-13, 15</a> it appears that living in the midst of the Israelites are settled non-Israelites. And the "open field" of <a onClick="return mV(\'Lev\',17,5);">Le 17:5</a> is a contrast to city, not to tent, life. Now in <a onClick="return mV(\'Lev\',17,\'3-5\');">Le 17:3-5</a> the question is not at all idolatry but eating of blood at an ordinary meal. An exact commentary is found on this in <a onClick="return mV(\'1Sa\',14,\'32-35\');">1Sa 14:32-35</a>, where the Israelites sin in eating the blood of animals "slain on the ground"; i.e. in both <a onClick="return mV(\'Lev\',17,\'1-\');">Le 17</a> and <a onClick="return mV(\'1Sa\',14,\'1-\');">1Sa 14</a>, at every slaying of an animal for food, some formal disposition of the blood had to be made. In <a onClick="return mV(\'Lev\',17,4);">Le 17:4</a> this is sacrificial, and the appearance of the altar in <a onClick="return mV(\'1Sa\',14,35);">1Sa 14:35</a> points in the same direction. Now this investing of every slaying of an animal with a sacrificial character, explains the permission of <a onClick="return mV(\'Deu\',12,\'20-25\');">De 12:20-25</a> to eat flesh "after all the desire of thy soul," a permission inexplicable unless there had been an earlier contrary practice. It is to be noted, moreover, that in <a onClick="return mV(\'Deu\',12,16);">De 12:16</a> the blood is to be disposed of by pouring it on the earth, the practice condemned in <a onClick="return mV(\'1Sa\',14,32);">1Sa 14:32</a>. The conclusion is that before the legislation of Deuteronomy the Israelite offered the blood of every slain sacrificial animal at the local sanctuary. Deuteronomy\'s rigid enforcement of the one sanctuary made this impossible, and so permission was given to eat flesh at home, provided the blood was not eaten, and provided that it was disposed of in a non-sacrificial way. Now in <a onClick="return mV(\'Lev\',17,\'3-5\');">Le 17:3-5</a> it becomes clear what has happened. The passage read originally something like this: \'What man soever there be of the house of Israel, that killeth an ox, or lamb, or goat, and hath not brought it to offer it as an oblation unto Yahweh, blood shall be imputed unto that man. ....\' This offering was to take place at the local sanctuary. But when the passage was incorporated into the whole body of the legislation, the editor was working at a time when the legitimacy of the local sanctuaries had long been forgotten. And so references to the "camp" and "the tent of meeting" were inserted, in accordance with the only laws that the editor conceived could ever have prevailed. The discrepancies with <a onClick="return mV(\'Lev\',17,5,8);">Le 17:5, 8</a>, etc., were probably not observed.<P>It is to be understood that this passage is not used as presenting a basic argument for the Graf-Wellhausen hypothesis. But it is cited as an example of other passages where the text is to be considered. And, also, because the assertion is made that this particular passage is a death-blow to the "critical" hypothesis. Naturally, it is nothing of the sort.<p>III. The History.<P>1. Chronicles:<P>It may be said at the outset that many of the attacks on the historic value of Chronicles have been very gravely exaggerated. But, none the less, a close comparison with Samuel-Kings shows that the Chronicler has most certainly read back into history the religious institutions of his own late day—it need not be said, with perfect innocence and sincerity. For instance, in comparing <a onClick="return mV(\'2Ki\',11,4);">2Ki 11:4</a> with <a onClick="return mV(\'2Ch\',23,\'2-6\');">2Ch 23:2-6</a>, we find the statement of Kings that Jehoiada brought captains of the Carites and of the guard into the house of Yahweh quite altered. In Chronicles Jehoiada summons Levites and heads of houses, with the express provision that only Levites shall enter into the house of Yahweh. So holy a priest as Jehoiada could not have acted as Kings says he did act. Similarly, the statement in <a onClick="return mV(\'1Ki\',15,14);">1Ki 15:14</a> that Asa did not remove the high places is changed into the statement that he did remove the high places (<a onClick="return mV(\'2Ch\',14,\'3-5\');">2Ch 14:3-5</a>), and only those in (northern) Israel were left (<a onClick="return mV(\'2Ch\',15,17);">2Ch 15:17</a>). So did Jehoshaphat (<a onClick="return mV(\'2Ch\',17,6);">2Ch 17:6</a>), although in <a onClick="return mV(\'2Ch\',20,33);">2Ch 20:33</a> the explicit statement to the contrary is copied (unnoticed?) from <a onClick="return mV(\'1Ki\',22,43);">1Ki 22:43</a>. Such righteous kings must have enforced the single sanctuary. The almost trivial matter of David\'s garb when the ark was brought into Jerusalem (contrast <a onClick="return mV(\'2Sa\',6,\'20-22\');">2Sa 6:20-22</a> with <a onClick="return mV(\'1Ch\',15,\'27-29\');">1Ch 15:27-29</a>) has been noticed already in II, 6. The important matter in Chronicles, however, is the history of the Tabernacle. In <a onClick="return mV(\'1Ch\',16,\'39-42\');">1Ch 16:39-42</a> the Tabernacle is at Gibeon, with the full ministry surrounding it, with the exception of a detail left before the Ark in Jerusalem (compare <a onClick="return mV(\'1Ch\',9,\'17-32\');">1Ch 9:17-32</a>). And in <a onClick="return mV(\'2Ch\',5,5);">2Ch 5:5</a> it is brought up to Jerusalem, although the disposition made of it is not explained. Otherwise it is mentioned in <a onClick="return mV(\'1Ch\',6,48);">1Ch 6:48</a>; <a onClick="return mV(\'1Ch\',21,29);">21:29</a>; <a onClick="return mV(\'2Ch\',1,3);">2Ch 1:3</a>. But the narrative presents some serious difficulties. Why did David build a special tent for the Ark in Jerusalem (<a onClick="return mV(\'1Ch\',16,1);">1Ch 16:1</a>), if the one Divinely appointed covering for the Ark was still standing—not to be brought to Jerusalem until its utility was past (<a onClick="return mV(\'2Ch\',5,5);">2Ch 5:5</a>)? That it was too fragile to be moved can hardly be taken seriously. In the first place, this explanation is without the least support in the text. And, in the second place, it is incredible for such a solid structure of wood, silver and brass, however much repair the curtains might have needed. Moreover, this explanation will not do at all for Bezalel\'s brazen altar, which was still quite usable in <a onClick="return mV(\'2Ch\',1,5);">2Ch 1:5</a>, making the construction of a new altar (<a onClick="return mV(\'2Ch\',4,1);">2Ch 4:1</a>) altogether inexplicable. The impression is created at once that the Chronicler has injected the Tabernacle into a narrative that knew nothing of it. This is corroborated by <a onClick="return mV(\'1Ch\',21,29,30);">1Ch 21:29-30</a>; the altar at the floor of Ornan is explained by the difficulty of reaching the Tabernacle. But the Ark, the natural means for an inquiry of God, was in Jerusalem, with an altar by it (<a onClick="return mV(\'1Ch\',16,1);">1Ch 16:1</a>)—why this third altar on the threshing-floor? The inaccessibility of the Tabernacle is invoked here only to solve what was a difficulty to the Chronicler. Now if <a onClick="return mV(\'2Ch\',1,3);">2Ch 1:3</a> be compared with <a onClick="return mV(\'1Ki\',3,\'2-4\');">1Ki 3:2-4</a>, the key of the whole is discovered. Kings not only does not mention the presence of the Tabernacle at Gibeon, but excludes it. Solomon\'s sacrificing at Gibeon is explained by saying that such was the custom of all Israel, who sacrificed in high places before the Temple was built; Solomon also sacrificed in highplaces and Gibeon was a great high-place. This is an apology for Solomon\'s conduct—why should the editor of Kings have apologized for sacrifice offered at the Divinely appointed Tabernacle? The Chronicler, however, could not believe that God blessed Solomon when offering sacrifice in a way forbidden by the law of Chronicle\'s times, and hence, he solves the difficulty by bringing in something that is unknown to the narrative in Kings.<P>2. Kings, etc.:<P>Indeed, Kings mentions the Tabernacle only in <a onClick="return mV(\'1Ki\',8,4);">1Ki 8:4</a>. Samuel mentions the Tabernacle as such only in <a onClick="return mV(\'1Sa\',2,22);">1Sa 2:22</a>. Judges does not mention the Tabernacle at all (<a onClick="return mV(\'Jdg\',18,31);">Jud 18:31</a> is the only possibility and the word there is "house"). Now <a onClick="return mV(\'1Sa\',2,22);">1Sa 2:22</a> is not found in the Vatican Septuagint, and the description of the Tabernacle as a tent contradicts <a onClick="return mV(\'1Sa\',1,9);">1Sa 1:9</a>; <a onClick="return mV(\'1Sa\',3,15);">3:15</a>, where it appears as a temple or house. So it must be dropped as a gloss. Nor will it be denied that <a onClick="return mV(\'1Ki\',8,4);">1Ki 8:4</a> looks suspiciously like a gloss as well, particularly in view of the presence of Levites there, who are practically unmentioned elsewhere in Samuel-Kings. At all events, there are only these two possible mentions of what should have been the center of Israel\'s worship in all of Judges-Samuel-Kings. This is not the ordinary argument from silence, it is silent about what should have been the most vital matter of all. Deuteronomy knows nothing of the Tabernacle, and, as has already been shown in II, states as clearly as language only can that in the wilderness the centralization of worship was not observed. The argument from silence alone would be conclusive here, for how could the author of Deuteronomy in his passionate advocacy of the single sanctuary fail to appeal to the single sanctuary already established by God\'s decree, if he knew anything about it? But not only is there no such mention in Deuteronomy but a positive exclusion of such a sanctuary in express terms. The case would seem to be complete. The Tabernacle of X and Chronicles is an ideal structure projected back into the past, just as the temple of Ezekiel is an ideal structure projected into the future. And it is needless to appeal to the familiar argument that the Tabernacle of <a onClick="return mV(\'Exd\',26,\'1-\');">Ex 26</a> would have been blown to pieces by the first storm. It had no provision for tent poles deeply sunk, which alone could resist the blasts of the desert.<P>It is impossible in the space of the present article to enter into all the corroborative evidence, but a very few important arguments may be mentioned.<P>3. The Conquest:<P>Simple people tend most naturally to think of heroes of the past as more and more glorious as time passes. Now <a onClick="return mV(\'Jdg\',1,\'1-\');">Jud 1</a> describes the conquest of Canaan as a slow and laborious process after Joshua\'s death. But in <a onClick="return mV(\'Jos\',10,\'40-43\');">Jos 10:40-43</a>; <a onClick="return mV(\'Jos\',11,\'10-23\');">11:10-23</a>; <a onClick="return mV(\'Jos\',21,\'43-45\');">21:43-45</a>—especially <a onClick="return mV(\'Jos\',11,\'16-19\');">11:16-19</a>—Canaan was completely swept of its inhabitants by Joshua in a series of annihilatory campaigns, making <a onClick="return mV(\'Jdg\',1,\'1-\');">Jud 1</a> quite impossible. Evidently the Joshua passages cited belong to a very much later conception of the past history. The fate of Hebron is especially interesting. In <a onClick="return mV(\'Jdg\',1,20);">Jud 1:20</a> Caleb takes Hebron after Joshua\'s death. But in <a onClick="return mV(\'Jos\',15,\'1-\');">Jos 15</a> Caleb takes Hebron during Joshua\'s lifetime and at the latter\'s direction. In <a onClick="return mV(\'Jos\',10,36,37);">Jos 10:36-37</a>, however, Joshua takes Hebron personally and annihilates its inhabitants. Here are three distinct conceptions of Hebron\'s fate, again. But still a fourth is found in <a onClick="return mV(\'Jos\',21,11,12);">Jos 21:11-12</a>: it was not Caleb who received the city but the Levites. This evidently belongs to the time when the Levitical right to cities had become a commonplace, and was therefore referred to the earliest days. The accounts of the annihilation of the Canaanites arose naturally enough. Accordings to Judges the conquest was gradual and merciful. But the Canaanites seduced Israel to idolatry repeatedly. Therefore they should have been routed out (<a onClick="return mV(\'Deu\',20,\'16-18\');">De 20:16-18</a>). But Joshua was righteous and had all power. Therefore he must have rooted them out. How they suddenly reappeared again was a question that was not raised. But perhaps it may be thought a relief to understand that the ruthless campaigns of the Israelites are due to reflection and not to descriptions of what actually happened.<P>4. Ideas of God:<P>Simple people think of God quite naturally and reverently as a greater man. So in <a onClick="return mV(\'Exd\',24,\'9-11\');">Ex 24:9-11</a> we read that Moses and many others met God in the mount, they all saw Him. and ate and drank before Him. A slightly more refined point of view is in <a onClick="return mV(\'Exd\',33,11);">Ex 33:11</a>, where Moses (but no one else) sees God face to face, and <a onClick="return mV(\'Num\',12,8);">Nu 12:8</a>, where again he (alone) sees the form of God. But in <a onClick="return mV(\'Exd\',33,20);">Ex 33:20</a> no man, not even Moses, can see God face to face. In <a onClick="return mV(\'Deu\',4,\'11-15\');">De 4:11-15</a> it is laid down that only darkness was seen—"ye saw no form." Perhaps Moses was thought of as an exception, but the contradiction of the concept that conceived over seventy Israelites besides Moses to have seen God is complete.<P>5. Priesthood:<P>The reading back of an official priesthood into the time of Moses can be seen in certain passages where Aaron appears predominantly. Contrast, e.g. <a onClick="return mV(\'Exd\',8,\'20-24\');">Ex 8:20-24</a>; <a onClick="return mV(\'Exd\',15,\'23-26\');">15:23-26</a>; <a onClick="return mV(\'Exd\',17,\'1-7\');">17:1-7</a> with <a onClick="return mV(\'Exd\',7,\'1-19\');">Ex 7:1-19</a>; <a onClick="return mV(\'Exd\',16,9,10);">16:9-10</a>; <a onClick="return mV(\'Num\',20,\'2-13\');">Nu 20:2-13</a>. Yet despite the importance of Aaron in the latter passages, in <a onClick="return mV(\'Exd\',33,11);">Ex 33:11</a> the minister of Moses in the Tent is Joshua, who is not a priest at all. Contrast similarly <a onClick="return mV(\'Deu\',31,14,15);">De 31:14-15</a> with <a onClick="return mV(\'Num\',27,\'18-21\');">Nu 27:18-21</a>, noting how Eleazar appears in the latter passage, although the former excludes him. At the time of X it was not thought possible that Moses could have acted without the official mediation of the official priest.<P>6. Summary:<P>Reasons of space preclude a further discussion of the other arguments here, such as the linguistic. As a matter of fact, the sections that contain the more developed concepts contain also a different vocabulary. To be repeated, however, is the fact that the argument is cumulative and that a single explanation of the differences is offered in the hypothesis of very varying dates for the various portions. Of course an exact analysis of every verse and a rigorous reconstruction of every source is not claimed to be possible. Many scholars have been carried by their enthusiasm for analysis into making preposterous dissections. But the principal lines of division are sufficiently clear. And it may be hoped the reader will not think that the acceptance of them has been dictated by any motive except that of facing the truth—least of all by any motive of a weakened faith in the power of God or a suspicion of the miraculous.<p>IV. Reconstruction.<P>1. Covenant Code:<P>Israel came into Canaan, after having received through the mediation of Moses a covenant relation with God and (almost certainly) some accompanying legislation. But this legislation seems not to have prescribed the ritual form that the worship of God was to take. In part, old forms were simply continued and in part new forms were gradually developed or appropriated, the emphasis of the Law at that time being on the moral and the ritual being left quite free. In especial, sacrifices were offered wherever Israelites happened to live, doubtless frequently at former Canaanite sanctuaries, now rededicated to Yahweh. The local sanctuary was the center of the life. Men went thither to learn God\'s will and to give a religious character to what we should call purely secular transactions (contracts, etc.). Firstlings were offered there on the eighth day, first-fruits at once, every meal of flesh food was given a sacrificial character (peace offering), and, for more solemn purposes, the whole burnt offering was offered. So the local sanctuary corresponded to our "village church"; it was the religious home of the people. Certain of these sanctuaries had an especial dignity, above all Shiloh, where the Ark was. Later, when a united Israel had been realized, David brought the Ark to Jerusalem that the national capital might become the center of the national religious life as well, and Solomon enshrined the Ark in the Temple. So to Jerusalem there resorted naturally the best of Israel\'s religious leaders, and there the worship of God would be found in its purest form, normally speaking.<P>2. Deuteronomy:<P>As time went on, the progress of culture and the freer contact with other nations had bad effects as well as good. New and degrading religious practices flowed into the country and they revived old but equally degrading religious practices that had survived from the Canaanites. The priesthood at Jerusalem did not escape a taint, but the place where such rites gained the readiest foothold was of course the obscure local sanctuaries. Not the best-minded king or the most zealous prophet, could watch all the services at them all, and attempts at purging them of idolatry or idolatrous rites (Elijah, Jehu, etc.) could not effect permanent improvement. And it could not have been very long after David\'s own day that the idea must have begun to grow that complete prohibition of country sacrifices and the rigid centralization of everything at Jerusalem was the only measure possible. This would soon become a fixed conviction of the better class of the Jerusalem priesthood and in a few generations would be a tradition. Detailed precepts to carry this tradition into effect arose necessarily and in turn became a tradition and in course of time were regarded as Moses\' work and committed to writing. In this way the legislation of Deuteronomy took form and at the time of its discovery under Josiah there is not the slightest occasion to attribute fraud to anyone engaged in the transaction. The document agreed fairly well with what was the tradition of Jerusalem, and no one at that day could distinguish between a writing a century old or even less and a writing of Moses own time. The country priests and the mass of the people were not consulted as to enforcing it, and they would not have known if they had been consulted. On any reading of the history, the reforms proceeded from a very small group, and any general "tradition of the Jews" was nonexistent.<P>3. Later:<P>(1) The reforms added to theoretical tradition the additional influence of practical experience and the idea of course dominated the minds of the more earnest among the exiles. Ezekiel, in particular, realized that only at a single sanctuary could the worship of God be kept pure—the single sanctuary was God\'s will. And Ezekiel\'s influence was immense. Now it is to be noted that at the return only those came back who had a real enthusiasm for Jerusalem, as Babylonia was, materially speaking, a far more attractive place than the Palestine of that day. That the single sanctuary could have been questioned by any of these Jews or that they could have conceived of Moses as instituting anything of less dignity is impossible.<P>(2) Other reforms also had been at work. Even in Deuteronomy the more primitive note of joyousness was maintained in the sacrifices. But joyousness in simple life is often dissipation in cultured life and the peace offering could be made a debauch (<a onClick="return mV(\'Isa\',22,\'12-14\');">Isa 22:12-14</a>; <a onClick="return mV(\'Pro\',7,14);">Pr 7:14</a>). A sense of personal guilt had become far better developed and the incongruity of penitential worship with a festal meal was recognized. A very slight change was made: the portion was to be eaten by the priest instead of the worshipper—and the sin and trespass offerings emerged. The abuses were cut away by this one stroke and the peace offering proper retired into the background. And sacrifices were made the proper center of the official worship. In accord with the growing culture, proportions of gifts, dates of feasts, etc., were specified more and more exactly, the worship was surrounded with a more impressive ritual, and, in particular, the officiating priests substituted vestments suited to the better taste of the time for the old loin-cloth. Traces are left in the Old Testament of difficulties regarding the rights of the various classes of priests to minister but the matter was settled eventually in a manner that satisfied all. Priests formerly guilty of idolatry and their descendants were admitted to share in the worship and the priestly revenues, but the actual offering of sacrifice was restricted to those who had been faithful. The proper support of the clergy so formed required, in accordance with their dignity, more elaborate provisions than had been needed in the simpler times of old, but was accomplished in a manner again entirely satisfactory. The religion of no other nation could have survived the Babylonian exile intact. But Israel returned, with the elements formerly necessary but now outgrown changed into a form adapted to the new task the nation had before it—the preparation of itself and the world for the advent of Christ.<P>4. Evaluation:<P>This growth toward the higher, involving as it did the meeting of all kinds of obstacles, the solving of all kinds of problems, the learning when to abandon elements that had been transcended, is unique in the history of religions. And the explanation of its uniqueness can be found only in the guidance of God. And in the history as reconstructed God is seen truly as the Father, who trained His children little by little, giving them only what they were able to receive but bringing them surely to Himself. And in the documents that contain the precepts for each stage of progress God\'s hand can be seen no less clearly. To be sure, in the secular science of history (as in physics or astronomy) His revelation was expressed in forms that His people could understand. This alteration—and this alteration only—in our view of what is covered by Biblical inspiration is the sacrifice demanded by the Graf-Wellhausen hypothesis.<P>LITERATURE.<P>This is overwhelming and reference must be made to the separate articles. The standard analysis is that of The Oxford Hexateuch (1900), more briefly in The Composition of the Hexateuch by Carpenter and Harford (Battersby) (1902). Marx, Die Bucher Moses und Josua (1907), is the best brief introduction. Gunkel\'s Genesis (1910) in the Nowack series, his more popular Die Urgeschichte und die Patriarchen (1911), and his "Die israelitische Literatur" in Die Kultur der Gegenwart, I, 7 (1906), should on no account be neglected. The best treatment of the inspiration question from the standpoint of pure dogmatics is F. J. Hall\'s Authority: Ecclesiastical and Biblical (1908).<P>In the above discussion it has been assumed that our text of the Old Testament is at least relatively trustworthy. The reader interested in what can be done by textual reconstruction will find the opposite poles represented in the works of Wiener and of Cheyne.<P>(EDITORIAL NOTE: The promoters of the Encyclopedia are not to be understood as endorsing all the views set forth in Dr. Easton\'s article (see <a href="./study/isbe/search.html?string=CRITICISM+OF+THE+BIBLE">CRITICISM OF THE BIBLE</a>). It was thought right, however, that, in such a work of reference, there should be given a full and adequate presentation of so popular a theory.)``48';
