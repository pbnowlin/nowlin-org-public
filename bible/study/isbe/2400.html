isbe[2481]='Cyprians`sip\'-ri-ans (Kuprioi): Occurs in 2Macc 4:29. Menelaus who was high priest at Jerusalem, and Sostratus who was governor of the citadel, were summoned by King Antiochus to appear before him. "Menelaus left his own brother Lysimachus for his deputy in the high-priesthood; and Sostratus left Crates, who was over the Cyprians." The Cyprians were the inhabitants of the island of Cyprus. Barnabas, who was Paul\'s associate on his first missionary journey, was a Cyprian (Kuprios; see <a onClick="return mV(\'Act\',4,36);">Ac 4:36</a>). the Revised Version (British and American) designates him as a man of Cyprus. The governor of the island was called a Cypriarch (see 2Macc 12:2, and compare <a href="./study/isbe/search.html?string=ASIARCH">ASIARCH</a>).``62';
isbe[2482]='Cyprus`si\'-prus (Kupros):<P>1. Name:<P>An island situated near the Northeast corner of the Levant, in an angle formed by the coasts of Cilicia and Syria. In the Old Testament it is called Kittim, after the name of its Phoenician capital Kition. The identification is expressly made by Josephus (Ant., I, vi, 1) and by the Cyprian bishop Epiphanius (Haer., xxx.25). In the tablets from Tell el-Amarna it is referred to as Alashia (E. Meyer, Gesch. des Alterthums,12,section 499), in Egyptian records as Asi, while in the Assyrian cuneiform inscriptions it is named Yavnan.<P>2. Geography:<P>The island is the largest in the Mediterranean with the exception of Sardinia and Sicily, its area being about 3,584 square miles. It lies in 34 degrees 30\'-35 degrees 41\' North latitude and 32 degrees 15\'-34 degrees 36\' East longitude, only 46 miles distant from the nearest point of the Cilician coast and 60 miles from the Syrian. Thus from the northern shore of the island the mainland of Asia Minor is clearly visible and Mt. Lebanon can be seen from Eastern Cyprus. This close proximity to the Cilician and Syrian coasts, as well as its position on the route between Asia Minor and Egypt, proved of great importance for the history and civilization of the island. Its greatest length, including the Northeast promontory, is about 140 miles, its greatest breadth 60 miles. The southwest portion of Cyprus is formed by a mountain complex, culminating in the peaks of Troodos (6,406 ft.), Madhari (5,305 ft.), Papofitsa (5,124 ft.) and Machaira (4,674 ft.). To the Northeast of this lies the great plain of the Mesorea, nearly 60 miles in length and 10 to 20 in breadth, in which lies the modern capital Nicosia (Lefkosia). It is watered chiefly by the Pediaeus (modern Pedias), and is bounded on the north by a mountain range, which is continued to the east-northeast in the long, narrow promontory of the Karpass, terminating in Cape Andrea, the ancient Dinaretum. Its highest peaks are Buffavento (3,135 ft.) and Hagios Elias (3,106 ft.). The shore-plain to the north of these hills is narrow, but remarkably fertile.<P>3. Products:<P>Cyprus is richly endowed by nature. Its fruits and flowers were famous in antiquity. Strabo, writing under Augustus, speaks of it as producing wine and oil in abundance and corn sufficient for the needs of its inhabitants (XIV, 684). The elder Pliny refers to Cyprian salt, alum, gypsum, mica, unguents, laudanum, storax, resin and precious stones, including agate, jasper, amethyst, lapis lazuli and several species of rock-crystal. His list includes the diamond (xxxvii.58) and the emerald (xxxvii.6, 66), but there is reason to believe that under these names a variety of rock-crystal and the beryl are intended. The chief source of the island\'s wealth, however, lay in its mines and forests. Silver is mentioned by Strabo (loc. cit.) among its products; copper, which was called by the Greeks after the name of the island, was extensively mined there from the earliest period down to the Middle Ages; iron too was found in considerable quantities from the 9th century until Roman times. Scarcely less important were the forests, which at an early date are said to have covered almost the whole island. The cypress seems to have been the principal tree, but Pliny tells of a giant cedar, 130 Roman feet in height, felled in Cyprus (xvi.203), and the island supplied timber for shipbuilding to many successive powers.<P>4. Early History:<P>The original inhabitants of Cyprus appear to have been a race akin to the peoples of Asia Minor. Its vast resources in copper and timber gained for it a considerable importance and wide commercial relations at a very remote period. Its wealth attracted the attention of Babylonia and Egypt, and there is reason to believe that it was conquered by Sargon I, king of Accad, and about a millennium later by Thothmes III, of the XVIIIth Egyptian Dynasty (1501-1447 BC). But the influences which molded its civilization came from other quarters also. Excavation has shown that in Cyprus were several seats of the Minoan culture, and there can be little doubt that it was deeply influenced by Crete. The Minoan writing may well be the source of the curious Cyprian syllabic script, which continued in use for the representation of the Greek language down to the 4th century BC (A. J. Evans, Scripta Minoa, I). But the Minoan origin of the Cyprian syllabary is still doubtful, for it may have been derived from the Hittite hieroglyphs. Phoenician influences too were at work, and the Phoenician settlements—Citium, Amathus, Paphos and others—go back to a very early date. The break-up of the Minoan civilization was followed by a "Dark Age," but later the island received a number of Greek settlers from Arcadia and other Hellenic states, as we judge not only from Greek tradition but from the evidence of the Cyprian dialect, which is closely akin to the Arcadian. In 709 BC Sargon II of Assyria made himself master of Cyprus, and tribute was paid by its seven princes to him and to his grandson, Esarhaddon (681-667 BC). The overthrow of the Assyrian Empire probably brought with it the independence of Cyprus, but it was conquered afresh by Aahmes (Amasis) of Egypt (Herod. ii. 182) who retained it till his death in 526 BC; but in the following year the defeat of his son and successor Psamtek III (Psammenitus) by Cambyses brought the island under Persian dominion (Herod. iii.19, 91).<P>5. Cyprus and the Greeks:<P>In 501 the Greek inhabitants led by Onesilus, brother of the reigning prince of Salamis, rose in revolt against the Persians, but were decisively beaten (Herodotus v.104ff), and in 480 we find 150 Cyprian ships in the navy with which Xerxes attacked Greece (Herod. vii.90). The attempts of Pausanias and of Cimon to win Cyprus for the Hellenic cause met with but poor success, and the withdrawal of the Athenian forces from the Levant after their great naval victory off Salamis in 449 was followed by a strong anti-Hellenic movement throughout the island led by Abdemon, prince of Citium. In 411 Euagoras ascended the throne of Salamis and set to work to assert Hellenic influence and to champion Hellenic civilization. He joined with Pharnabazus the Persian satrap and Conon the Athenian to overthrow the naval power of Sparta at the battle of Cnidus in 394, and in 387 revolted from the Persians. He was followed by his son Nicocles, to whom Isocrates addressed the famous panegyric of Euagoras and who formed the subject of an enthusiastic eulogy by the same writer. Cyprus seems later to have fallen once again under Persian rule, but after the battle of Issus (333 BC) it voluntarily gave in its submission to Alexander the Great and rendered him valuable aid at the siege of Tyre. On his death (323) it fell to the share of Ptolemy of Egypt. It was, however, seized by Demetrius Poliorcetes, who defeated Ptolemy in a hotly contested battle off Salamis in 306. But eleven years later it came into the hands of the Ptolemies and remained a province of Egypt or a separate but dependent kingdom until the intervention of Rome (compare 2Macc 10:13). We hear of a body of Cyprians, under the command of a certain Crates, serving among the troops of Antiochus Epiphanes of Syria and forming part of the garrison of Jerusalem about 172 BC (2Macc 4:29). This interpretation of the passage seems preferable to that according to which Crates had been governor of Cyprus under the Ptolemies before entering the service of Antiochus.<P>6. Cyprus and Rome:<P>In 58 BC the Romans resolved to incorporate Cyprus in their empire and Marcus Porcius Cato was entrusted with the task of its annexation. The reigning prince, a brother of Ptolemy Auletes of Egypt, received the offer of an honorable retirement as high priest of Aphrodite at Paphos, but he preferred to end his life by poison, and treasures amounting to some 7,000 talents passed into Roman hands, together with the island, which was attached to the province of Cilicia. In the partition of the Roman empire between Senate and Emperor, Cyprus was at first (27-22 BC) an imperial province (Dio Cassius liii.12), administered by a legatus Augusti pro praetore or by the imperial legate of Cilicia. In 22 BC, however, it was handed over to the Senate together with Southern Gaul in exchange for Dalmatia (Dio Cassius liii. 12; liv.4) and was subsequently governed by ex-praetors bearing the honorary title of proconsul and residing at Paphos. The names of about a score of these governors are known to us from ancient authors, inscriptions and coins and will be found in D. G. Hogarth, Devia Cypria, App. Among them is Sergius Paulus, who was proconsul at the time of Paul\'s visit to Paphos in 46 or 47 AD, and we may notice that the title applied to him by the writer of the Acts (<a onClick="return mV(\'Act\',13,7);">13:7</a>) is strictly accurate.<P>7. Cyprus and the Jews:<P>The proximity of Cyprus to the Syrian coast rendered it easy of access from Palestine, and Jews had probably begun to settle there even before the time of Alexander the Great. Certainly the number of Jewish residents under the Ptolemies was considerable (1Macc 15:23; 2Macc 12:2) and it must have been increased later when the copper mines of the island were farmed to Herod the Great (Josephus, Ant, XVI, iv, 5; XIX, xxvi, 28; compare Corpus Inscriptionum Graecarum, 2628). We shall not be surprised, therefore, to find that at Salamis there was more than one synagogue at the time of Paul\'s visit (<a onClick="return mV(\'Act\',13,5);">Ac 13:5</a>). In 116 AD the Jews of Cyprus rose in revolt and massacred no fewer than 240,000 Gentiles. Hadrian crushed the rising with great severity and drove all the Jews from the island. Henceforth no Jew might set foot upon it, even under stress of shipwreck, on pain of death (Dio Cassius lxviii.32).<P>8. The Church in Cyprus:<P>In the life of the early church Cyprus played an important part. Among the Christians who fled from Judea in consequence of the persecution which followed Stephen\'s death were some who "travelled as far as Phoenicia, and Cyprus" (<a onClick="return mV(\'Act\',11,19);">Ac 11:19</a>) preaching to the Jews only. Certain natives of Cyprus and Cyrene took a further momentous step in preaching at Antioch to the Greeks also (<a onClick="return mV(\'Act\',11,20);">Ac 11:20</a>). Even before this time Joseph Barnabas, a Levite born in Cyprus (<a onClick="return mV(\'Act\',4,36);">Ac 4:36</a>), was prominent in the early Christian community at Jerns, and it was in his native island that he and Paul, accompanied by Barnabas nephew, John Mark, began their first missionary journey (<a onClick="return mV(\'Act\',13,4);">Ac 13:4</a>). After landing at Salamis they passed "through the whole island" to Paphos (<a onClick="return mV(\'Act\',13,6);">Ac 13:6</a>), probably visiting the Jewish synagogues in its cities. The Peutinger Table tells us of two roads from Salamis to Paphos in Roman times, one of which ran inland by way of Tremithus, Tamassus and Soil, a journey of about 4 days, while the other and easier route, occupying some 3 days, ran along the south coast by way of Citium, Amathus and Curium. Whether the "early disciple," Mnason of Cyprus, was one of the converts made at this time or had previously embraced Christianity we cannot determine (<a onClick="return mV(\'Act\',21,16);">Ac 21:16</a>). Barnabas and Mark revisited Cyprus later (<a onClick="return mV(\'Act\',15,39);">Ac 15:39</a>), but Paul did not again land on the island, though he sighted it when, on his last journey to jerus, he sailed south of it on his way from Patara in Lycia to Tyre (<a onClick="return mV(\'Act\',21,3);">Ac 21:3</a>), and again when on his journey to Rome he sailed "under the lee of Cyprus," that is, along its northern coast, on the way from Sidon to Myra in Lycia (<a onClick="return mV(\'Act\',27,4);">Ac 27:4</a>). In 401 AD the Council of Cyprus was convened, chiefly in consequence of the efforts of Theophilus of Alexandria, the inveterate opponent of Origenism, and took measures to check the reading of Origen\'s works. The island, which was divided into 13 bishoprics, was declared autonomous in the 5th century, after the alleged discovery of Matthew\'s Gospel in the tomb of Barnabas at Salamis. The bishop of Salamis was made metropolitan by the emperor Zeno with the title "archbishop of all Cyprus," and his successor, who now occupies the see of Nicosia, still enjoys the privilege of signing his name in red ink and is primate over the three other bishops of the island, those of Paphos, Kition and Kyrenia, all of whom are of metropolitan rank.<P>9. Later History:<P>Cyprus remained in the possession of the Roman and then of the Byzantine emperors, though twice overrun and temporarily occupied by the Saracens, until 1184, when its ruler, Isaac Comnenus, broke away from Constantinople and declared himself an independent emperor. From him it was wrested in 1191 by the Crusaders under Richard I of England, who bestowed it on Guy de Lusignan, the titular king of Jerusalem, and his descendants. In 1489 it was ceded to the Venetians by Catherine Cornaro, widow of James II, the last of the Lusignan kings, and remained in their hands until it was captured by the Ottoman Turks under Sultan Selim II, who invaded and subjugated the island in 1570 and laid siege to Famagusta, which, after a heroic defense, capitulated on August 1, 1571. Since that time Cyprus has formed part of the Turkish empire, in spite of serious revolts in 1764 and 1823; since 1878, however, it has been occupied and administered by the British government, subject to an annual payment to the Sublime Porte of $92,800 and a large quantity of salt. The High Commissioner, who resides at Nicosia, is assisted by a Legislative Council of 18 members. The estimated population ia 1907 was 249,250, of whom rather more than a fifth were Moslems and the remainder chiefly members of the Greek Orthodox church.<P>LITERATURE.<P>An exhaustive bibliography will be found in C. D. Cobham, An Attempt at a Bibliography of Cyprus, Nicosia, 4th edition, 1900. The following works may be specially mentioned: E. Oberhummer, Aus Cypern, Berlin, 1890-92; Studien zur alten Geographic yon Kypros, Munich 1891; A. Sakellarios, Ta Kupriaka, Athens, 1890-91. References in ancient sources are collected in J. Meursius, Cyprus, Amsterdam,1675,and W. Engel, Kypros, Berlin, 1841. For Cyprian archaeology see P. Gardner, New Chapters in Greek History, chapter vi, London, 1892; J. L. Myres and M. OhnefalschRichter, Catalogue of the Cyprus Museum, Oxford, 1899; M. O. Richter, Kypros, die Bibel und Homer, Berlin, 1893; D. G. Hogarth, Devia Cypria, London, 1889; and J. L. Myres\' article on "Cypriote Archaeology" in Encyclopedia Britannica, 11th edition, VII, 697ff. For excavations, Journal of Hellenic Studies, IX, XI, XII, XVII, and Excavations Cyprus, London (British Museum), 1900; for art, G. Perrot and C. Chipiez, Art in Phoenicia and Cyprus, English translation, London, 1885; for coins, B. V. Head, Historia Numorum, Oxford, 1911; for inscriptions, Sammlung der griech. Dialekt-Inschriften, I, Gottingen, 1883; for the Cyprian church, J. Hackett, History of the Orthodox Church of Cyprus, London, 1901; for authorities on medieval and modern history, CL. D. Cobham, Encyclopedia Britannica (11th edition), 11th edition, VII, 701.``176';
isbe[2483]='Cyrama`si-ra\'-ma, sir\'-a-ma.`<a href="./study/isbe/search.html?string=KIRAMA">KIRAMA</a>`1';
isbe[2484]='Cyrene`si-re\'-ne (Kurene "wall"):<P>1. Location:<P>Cyrene was a city of Libya in North Africa, lat. 32 degrees 40\' North, long. 22 degrees 15\' East. It lay west of ancient Egypt, from which it was separated by a portion of the Libyan desert, and occupied the territory now belonging to Barca and Tripoli. It was situated upon an elevated plateau about 2,000 ft. above the sea, from which it was distant some 10 miles. A high range of mountains lies to the south, about 90 miles inland. This shelters the coast land from the scorching heat of the Sahara. The range drops down toward the north in a series of terrace-like elevations, thus giving to the region a great variety of climate and vegetation. The soil is fertile.<P>2. History:<P>Cyrene was originally a Greek colony rounded by Battus in 630 BC. Because of the fertility of the soil, the great variety in climate and vegetation, together with its commercial advantages in location, the city soon rose to great wealth and importance. Greater fame, however, came to it through its distinguished citizens. It was the home of Callimachus the poet, Carneacles the founder of the New Academy at Athens, and Eratosthenes the mathematician. To these must be added, from later times, the elegant ancient Christian writer Synesius. So important did this Greek colony become that, in little more than half a century, Amasis II of Egypt formed an alliance with Cyrene, marrying a Greek lady of noble, perhaps royal, birth (Herod. ii.181). Ptolemy III (Euergetes I), 231 BC, incorporated Cyrene with Egypt. The city continued, though with much restlessness, a part of the Egyptian empire until Apion, the last of the Ptolemies, willed it to Rome. It henceforth belonged to a Roman province.<P>In the middle of the 7th century, the conquering Saracens took possession of Cyrene, and from that time to this it has been the habitation of wandering tribes of Arabs.<P>3. Biblical Importance:<P>Cyrene comes into importance in Biblical history through the dispersion of the Jews. Ptolemy I, son of Lagus, transported Jews to this and other cities of Libya (Josephus, CAp, II, 4) and from this time on Jews were very numerous there. By the return of the Jews of the Dispersion to the feasts at Jerusalem, Cyrenians came to have a conspicuous place in the New Testament history. "A man of Cyrene, Simon by name," was caught by the Roman soldiers and compelled to bear the cross of Jesus (<a onClick="return mV(\'Mat\',27,32);">Mt 27:32</a>; compare <a onClick="return mV(\'Mar\',15,21);">Mr 15:21</a>; <a onClick="return mV(\'Luk\',23,26);">Lu 23:26</a>). See <a href="./study/isbe/search.html?string=CYRENIAN">CYRENIAN</a>. Jews from Cyrene were among those present on the day of Pentecost. Their city appears as one of the important points in the wide circle of the Dispersion described by Peter in his sermon on that occasion (<a onClick="return mV(\'Act\',2,10);">Ac 2:10</a>). Cyrenian Jews were of sufficient importance in those days to have their name associated with a synagogue at Jerusalem (<a onClick="return mV(\'Act\',6,9);">Ac 6:9</a>). And when the persecution arose about Stephen, some of these Jews of Cyrene who had been converted at Jerusalem, were scattered abroad and came with others to Antioch and preached the word "unto the Jews only" (<a onClick="return mV(\'Act\',11,19,20);">Ac 11:19-20</a> the King James Version), and one of them, Lucius, became a prophet in the early church there. In this case, as in so many others, the wise providence of God in the dispersion of the Jews in preparation for the spread of the gospel of the Messiah is seen.<P>4. Archaeology:<P>In the ruins of Cyrene are to be seen the remains of some beautiful buildings, and a few sculptures have been removed. The most interesting remains of the wondrous civilization of this Greek colony are in a great system of tombs, some built, but the finest cut in the solid rock of the cliff. Doric architecture and brilliant decorative painting adorn these tombs.<P>LITERATURE<P>Herodotus ii; Josephus, Apion; Thrige, Res Cyrenensium.``93';
isbe[2485]='Cyrenian; Cyrenians`si-re\'-ni-an (Kurenaios, "a native or inhabitant of Cyrene"): Two Jews of Cyrene are mentioned in the New Testament, namely, Simon (<a onClick="return mV(\'Mar\',15,21);">Mr 15:21</a> and <a onClick="return mV(\'Luk\',23,26);">Lu 23:26</a> the King James Version) who was impressed to bear the Lord\'s cross (<a onClick="return mV(\'Mar\',15,21);">Mr 15:21</a> the Revised Version, margin), and Lucius, a Christian teacher at Antioch (<a onClick="return mV(\'Act\',13,1);">Ac 13:1</a>).`<a href="./study/isbe/search.html?string=CYRENE">CYRENE</a>; <a href="./study/isbe/search.html?string=LUCIUS">LUCIUS</a>; <a href="./study/isbe/search.html?string=SIMON+(2)">SIMON (2)</a>`1';
isbe[2486]='Cyrenius`si-re\'-ni-us (Kurenios, "of Cyrene").`<a href="./study/isbe/search.html?string=QUIRINIUS">QUIRINIUS</a>`1';
isbe[2487]='Cyria`sir\'-i-a (Kuria): The word means "lady," feminine of lord, and it is so translated in the King James Version and the text of the Revised Version (British and American) (<a onClick="return mV(\'2Jo\',1,5);">2Joh 1:5</a> the Revised Version, margin). But it is possible that the word is a proper name, and this possibility is recognized by placing Cyria, the usual transliteration of the word, in the margin by the Revised Version (British and American).``1';
isbe[2488]='Cyrus`si\'-rus (koresh; Old Persian Kurus; Babylonian Kur(r)as, Kur(r)asu; Greek Kuros, <a onClick="return mV(\'2Ch\',36,22);">2Ch 36:22</a>, etc.):<P>1. Genealogy of Cyrus<P>2. His Country, Ansan or Anzan<P>3. His Origin (Herodotus)<P>4. His Origin (Xenophon)<P>5. His Origin (Nicolaus of Damascus)<P>6. His Origin (Ctesias)<P>7. Babylonian Records of His Reign—The Cylinder of Nabonidus<p>8. The Babylonian Chronicle<P>9. The Babylonian Chronicle—The Capture of Babylon<P>10. The Cylinder of Cyrus<P>11. Cyrus\' History from Greek Sources<P>12. The Massagetae<P>13. The Sacae, Berbices, etc.<P>14. Doubt as to the Manner of His Death<P>15. Cyrus\' Reputation<P>16. Why Did the Babylonians Accept Him?<P>17. Cyrus and the Jews<P>18. Cyrus in Persia—His Bas-relief<hr /><P>1. Genealogy of Cyrus:<P>The son of the earlier Cambyses, of the royal race of the Achemenians. His genealogy, as given by himself, is as follows: "I am Cyrus, king of the host, the great king, the mighty king, king of Tindir (Babylon), king of the land of Sumeru and Akkadu, king of the four regions, son of Cambyses, the great king, king of the city Ansan, grandson of Cyrus, the great king, king of the city Ansan, great-grandson of Sispis (Teispes), the great king, king of the city Ansan, the all-enduring royal seed whose sovereignty Bel and Nebo love," etc. (WAI, V, plural 35, 20-22).<P>2. His Country, Ansan or Anzan:<P>As, in the Babylonian inscriptions, Assan (Ansan, Anzan) is explained as Elam—the city was, in fact, the capital of that country—it is probable that Cyrus\' name was Elamite; but the meaning is doubtful. The Greek etymology connecting it with khor, "the sun" in Persian, may therefore be rejected. According to Strabo, he was at first called Agradates, the name by which he was universally known being taken from that of the river Cyrus. This, however, is more likely to have been the reason why his grandfather (after whom he was probably named) was called Cyrus.<P>3. His Origin (Herodotus):<P>Several versions of his birth and rise to power are recorded. Herodotus (i.95) mentions three. In that which he quotes (i.107ff), it is said that Mandane was the daughter of the Median king Astyages, who, in consequence of a dream which he had had, foretelling the ultimate triumph of her son over his dynasty, gave her in marriage to a Persian named Cambyses, who was not one of his peers. A second dream caused him to watch for her expected offspring, and when Cyrus came into the world Astyages delivered the child to his relative, Harpagus, with orders to destroy it. Being Unwilling to do this, he handed the infant to a Shepherd named Mitradates, who, his wife having brought forth a still-born child, consented to spare the life of the infant Cyrus. Later on, in consequence of his imperious acts, Cyrus was recognized by Astyages, who came to learn the whole story, and spared him because, having once been made king by his companions in play, the Magians held the predictions concerning his ultimate royal state to have been fulfilled. The vengeance taken by Astyages upon Harpagus for his apparent disobedience to orders is well known: his son was slain, and a portion, disguised, given him to eat. Though filled with grief, Harpagus concealed his feelings, and departed with the remains of his son\'s body; and Cyrus, in due course, was sent to stay with his parents, Cambyses and Mandane. Later on, Harpagus persuaded Cyrus to induce the Persians to revolt, and Astyages having blindly appointed Harpagus commander-in-chief of the Median army, the last-named went over to the side of Cyrus. The result was an easy victory for the latter, but Astyages took care to impale the Magians who had advised him to spare his grandson. Having gathered another, but smaller, army, he took the field in person, but was defeated and captured. Cyrus, however, who became king of Media as well as of Persia, treated him honorably and well.<P>4. His Origin (Xenophon):<P>According to Xenophon, Cyropedia i. section 2, Cambyses, the father of Cyrus, was king of Persia. (NOTE: He may have added Persia to his dominion, but according to Cyrus himself, he was king of Ansan or Elam.) Until his 12th year, Cyrus was educated in Persia, when he was sent for, with his mother, by Astyages, to whom he at once manifested much affection. Astyages is said to have been succeeded by his son Cyaxares, and Cyrus then became his commander-in-chief, subduing, among others, the Lydians. He twice defeated the Assyrians (= Babylonians), his final conquest of the country being while the Median king was still alive. As, however, the Cyropedia is a romance, the historical details are not of any great value.<P>5. His Origin (Nicolaus of Damascus):<P>Nicolaus of Damascus describes Cyrus as the son of a Mardian bandit named Atradates, his mother\'s name being Argoste. While in service in the palace of Astyages, he was adopted by Artembarks, cupbearer, and thus obtained prominence. Cyrus now made his bandit-father satrap of Persia, and, with base ingratitude, plotted against his king and benefactor. The preparations for a revolt having been made, he and his general Oibaras were victorious at Hyrba, but were defeated at Parsagadae, where his father Atradates was captured and later on died. Cyrus now took refuge in his mountain home, but the taunts of the women sent him and his helpers forth again, this time to victory and dominion.<P>6. His Origin (Ctesias):<P>Ctesias also states that there was no relationship between Cyrus and Astyages (Astyigas), who, when Cyrus conquered Media, fled to Ecbatana, and was there hidden by his daughter Amytis, and Spitamas her husband. Had not Astyages yielded, Cyrus, it is said, would have tortured them, with their children. Cyrus afterward liberated Astyages, and married his daughter Amytis, whose husband he had put to death for telling a falsehood. The Bactrians are said to have been so satisfied at the reconciliation of Cyrus with Astyages and his daughter, that they voluntarily submitted. Cyrus is said by Ctesias to have been taken prisoner by the Sacae, but he was ransomed. He died from a wound received in battle with the Derbices, assisted by the Indians.<P>7. Babylonian Records of His Reign—the Cylinder of Nabonidus:<P>In the midst of so much uncertainty, it is a relief to turn to the contemporary documents of the Babylonians, which, though they do not speak of Cyrus\' youth in detail, and refer only to other periods of his career in which they were more immediately interested, may nevertheless, being contemporary, be held to have an altogether special authority. According to the inscriptions, the conflict with Astyages took place in 549 BC. From the cylinder of Nabonidus we learn that the Medes had been very successful in their warlike operations, and had gone even as far afield as Haran, which they had besieged. The Babylonjan King Nabonidus desired to carry out the instructions of Merodach, revealed in a dream, to restore the temple of Sin, the Moon-god, in that city. This, however, in consequence of the siege, he could not do, and it was revealed to him in a dream that the power of Astyages would be overthrown at the end of three years, which happened as predicted. "They (the gods Sin and Merodach) then caused Cyrus, king of Anzan, his (Merodach\'s) young servant, with his little army, to rise up against him (the Median); he destroyed the extensive Umman-manda (Medes), Istuwegu (Astyages), king of the Medes, he captured, and took (him) prisoner to his (own) land." The account of this engagement in the Babylonian Chronicle (which is, perhaps, Cyrus\' own), is as follows: "(Astyages) gathered his army, and went against Cyrus, king of Ansan, to capture him, and (as for) Astyages, his army revolted against him and took him, and gave him to Cyrus."<P>8. The Babylonian Chronicle:<P>Cyrus went to the land of Ecbatana, his royal city. He carried off from Ecbatana silver, gold, furniture, merchandise, and took to the land of Ansan the furniture and merchandise which he had captured.<P>The above is the entry for the 6th year of Nabonidus, which corresponds with 549 BC; and it will be noticed that he is here called "king of Ansan." The next reference to Cyrus in the Babylonian Chronicle is the entry for Nabonidus\' 9th year (546 BC), where it is stated that "Cyrus, king of the land of Parsu (Persia) gathered his army, and crossed the Tigris below Arbela," and in the following month (Iyyar) entered the land of Is- ...., where someone seems to have taken a bribe, garrisoned the place, and afterward a king ruled there. The passage, however, is imperfect, and therefore obscure, but we may, perhaps, see therein some preparatory move on the part of Cyrus to obtain possession of the tract over which Nabonidus claimed dominion. The next year (545 BC) there seems to have been another move on the part of the Persians, for the Elamite governor (?) is referred to, and had apparently some dealings with the governor of Erech. All this time things seem to have been the same in Babylonia, the king\'s son (he is not named, but apparently Belshazzar is meant) and the soldiers remaining in Akkad (possibly used in the old sense of the word, to indicate the district around Sippar), where it was seemingly expected that the main attack would be delivered. The reference to the governor of Erech might imply that some conspiracy was on foot more to the south—a movement of which the native authorities possibly remained in ignorance.<P>9. The Babylonian Chronicle—the Capture of Babylon:<P>After a gap which leaves four years unaccounted for, we have traces of four lines which mention the goddess Ishtar of Erech, and the gods of the land of Par ....(? Persia) are referred to. After this comes the long entry, which, though the date is broken away, must refer to the 17th year of Nabonidus. A royal visit to a temple is referred to, and there is mention of a revolt. Certain religious ceremonies were then performed, and others omitted. In the month Tammuz, Cyrus seems to have fought a battle in Opis, and succeeded in attacking the army of Akkad situated on the Tigris. On the 14th of the month, Sippar was taken without fighting, and Nabonidus fled. On the 16th Ugbaru (Gobryas) governor of Media, entered Babylon, with the army of Cyrus, without fighting, and there Nabonidus was captured with his followers. At this time E-saggil and the temples of the land seem to have been closed, possibly to prevent the followers of Nabonidus from taking sanctuary there, or else to prevent plotters from coming forth; and on the 3rd of Marcheswan (October), Cyrus entered Babylon. "Crowds collected before him, proposing peace for the city; Cyrus, command the peace of Babylon, all of it." Gobryas, his vice-regent, then appointed governors in Babylon, and the gods whom Nabonidus had taken down to Babylon, were returned to their shrines. On the night of the 11th of Marcheswan, Ugbaru went against (some part of Babylon), and the son of the king died; and there was mourning for him from the 27th of Adar to the 3rd of Nisan (six days). There is some doubt as to whether the text speaks of the king or the son of the king, but as there is a record that Nabonidus was exiled to Carmania, it would seem most likely that the death of Belshazzar "in the night" is here referred to. The day after the completion of the mourning (the 4th of Nisan), Cambyses, son of Cyrus, performed ceremonies in the temple E-nig-had-kalamma, probably in connection with the new year\'s festival, for which Cyrus had probably timed his arrival at Babylon. According to Herodotus (i.191), Babylon\' was taken during a festival, agreeing with <a onClick="return mV(\'Dan\',5,1);">Da 5:1</a>ff.<P>10. The Cylinder of Cyrus:<P>The other inscription of Cyrus, discovered by Mr. H. Rassam at Babylon, is a kind of proclamation justifying his seizure of the crown. He states that the gods (of the various cities of Babylonia) forsook their dwellings in anger that he (Nabonidus) had made them enter within Su-anna (Babylon). Merodach, the chief divinity of Babylon, sought also a just king, the desire of his heart, whose hand he might hold—Cyrus, king of Ansan, he called his title—to all the kingdoms together (his) name was proclaimed.<P>The glory of Cyrus\' conquests probably appealed to the Babylonians, for Cyrus next states that Merodach placed the whole of the troops of Qutu (Media) under his feet, and the whole of the troops of the Manda (barbarians and mercenaries). He also caused his hands to hold the people of the dark head (Asiatics, including the Babylonians)—in righteousness and justice he cared for them. He commanded that he should go to his city Babylon, and walked by his side like a friend and a companion—without fighting and battle Merodach caused him to enter Su-anna. By his high command, the kings of every region from the upper sea to the lower sea (the Mediterranean to the Persian Gulf), the kings of the Amorites, and the dwellers in tents, brought their valuable tribute and kissed his feet within Su-anna (Babylon). From Nineveh(?), the city Assur, Susa, Agade, the land of Esnunnak, Zamban, Me-Turnu, and Deru, to the borders of Media, the gods inhabiting them were returned to their shrines, and all the people were collected and sent back to their dwellings. He finishes by soliciting the prayers of the gods to Bel and Nebo for length of days and happiness, asking them also to appeal to Merodach on behalf of Cyrus "his worshipper," and his son Cambyses.<P>11. Cyrus\' History from Greek Sources:<P>It was probably between the defeat of Astyages and the capture of Babylon that Cyrus defeated Croesus and conquered Lydia. After preparing to attack the Greek cities of Asia Minor, he returned to Ecbatana, taking Croesus with him. The states which had formed the Lydian empire, however, at once revolted, and had again to be reduced to submission, this time by Harpagus, his faithful general, after a determined resistance. It was at this period that Cyrus subdued the nations of Upper Asia, his next objective being Babylonia (section 9 and the two preceding paragraphs). In this connection it is noteworthy that, in the Babylonian official account, there is no mention of his engineering works preparatory to the taking of Babylon—the turning of the waters of the Gyndes into a number of channels in order to cross (Herod. i.189); the siege of Babylon, long and difficult, and the final capture of the city by changing the course of the Euphrates, enabling his army to enter by the bed of the river\' (Herodotus i.190-91). There may be some foundation for this statement, but if so, the king did not boast of it—perhaps because it did not entail any real labor, for the irrigation works already in existence may have been nearly sufficient for the purpose. It seems likely that the conquest of Babylon opened the way for other military exploits. Herodotus states that he next attacked the Massagetae, who were located beyond the Araxes.<P>12. The Massagetae:<P>One-third of their army was defeated, and the son of Tomyris, the queen, captured by a stratagem; but on being freed from his bonds, he committed suicide. In another exceedingly fierce battle which followed, the Persian army was destroyed, and Cyrus himself brought his life to an end there, after a reign of 29 years. (He had ruled over Media for 11, and over Babylonia (and Assyria) for 9 years.) According to the Babylonian contract-tablets, Cambyses, his son, was associated with him on the throne during the first portion of his 1st year of rule in Babylon.<P>13. The Sacae, Berbices, etc.:<P>According to Ctesias, Cyrus made war with the Bactrians and the Sacae, but was taken prisoner by the latter, and was afterward ransomed. He died from a wound received in battle with the Berbices. Diodorus agrees, in the main, with Herodotus, but relates that Cyrus was captured by the Scythian queen (apparently Tomyris), who crucified or impaled him.<P>14. Doubt as to the Manner of His Death:<P>It is strange that, in the case of such a celebrated ruler as Cyrus, nothing certain is known as to the manner of his death. The accounts which have come down to us seem to make it certain that he was killed in battle with some enemy, but the statements concerning his end are conflicting. This absence of any account of his death from a trustworthy source implies that Herodotus is right in indicating a terrible disaster to the Persian arms, and it is therefore probable that he fell on the field of battle—perhaps in conflict with the Massagetae, as Herodotus states. Supposing that only a few of the Persian army escaped, it may be that not one of those who saw him fall lived to tell the tale, and the world was dependent on the more or less trustworthy statements which the Massagetae made.<P>15. Cyrus\' Reputation:<P>That he was considered to be a personage of noble character is clear from all that has come down to us concerning him, the most noteworthy being Xenophon\'s Cyropedia and Institution of Cyrus. The Babylonian inscriptions do not reproduce Babylonian opinion, but the fact that on the occasion of the siege of Babylon the people trusted to his honor and came forth asking peace for the city (apparently with every confidence that their request would be granted); and that the Babylonians, as a whole, were contented under his rule, may be regarded as tacit confirmation. Nabonidus, before the invasion of his territory by the Persian forces, was evidently well disposed toward him, and looked upon him, as we have seen, as "the young servant of Merodach," the patron deity of Babylon.<P>16. Why Did the Babylonians Accept Him?:<P>It is not altogether clear, however, why theBabylonians submitted to him with so little resistance—their inscriptions contain no indication that they had real reason to be dissatisfied with the rule of Nabonidus—he seems to have been simply regarded as somewhat unorthodox in his worship of the gods; but could they expect an alien, of a different religion, to be better in that respect? Dissatisfaction on the part of the Babyloninn priesthood was undoubtedly at the bottom of their discontent, however, and may be held to supply a sufficient reason, though it does not redound to the credit of Babylonian patriotism. It has been said that the success of Cyrus was in part due to the aid given him by the Jews, who, recognizing him as a monotheist like themselves, gave him more than mere sympathy; but it is probable that he could never have conquered Babylonia had not the priests, as indicated by their own records, spread discontent among the people. It is doubtful whether we may attribute a higher motive to the priesthood, though that is not altogether impossible. The inner teaching of the Babylonian polytheistic faith was, as is now well known, monotheistic, and there may have been, among the priests, a desire to have a ruler holding that to be the true faith, and also not so inclined as Nabonidus to run counter to the people\'s (and the priests\') prejudices. Jewish influence would, in some measure, account for this.<P>17. Cyrus and the Jews:<P>If the Jews thought that they would be more sympathetically treated under Cyrus\' rule, they were not disappointed. It was he who gave orders for the rebuilding of the Temple at Jerusalem (<a onClick="return mV(\'2Ch\',36,23);">2Ch 36:23</a>; <a onClick="return mV(\'Ezr\',1,2);">Ezr 1:2</a>; <a onClick="return mV(\'Ezr\',5,13);">5:13</a>; <a onClick="return mV(\'Ezr\',6,3);">6:3</a>), restored the vessels of the House of the Lord which Nebuchadnezzar had taken away (<a onClick="return mV(\'Ezr\',1,7);">Ezr 1:7</a>), and provided funds to bring cedar trees from Lebanon (<a onClick="return mV(\'Ezr\',3,7);">Ezr 3:7</a>). But he also restored the temples of theBabylonians, and brought back the images of the gods to their shrines. Nevertheless the Jews evidently felt that the favors he granted them showed sympathy for them, and this it probably was which caused Isaiah (<a onClick="return mV(\'Isa\',44,28);">44:28</a>) to see in him a "shepherd" of the Lord, and an anointed king (Messiah, to Christo mou, <a onClick="return mV(\'Isa\',45,1);">Isa 45:1</a>)—a title suggesting to later writers that he was a type of Christ (Hieron., Commentary on <a onClick="return mV(\'Isa\',44,1);">Isa 44:1</a>).<P>18. Cyrus in Persia—His Bas-relief:<P>From Persia we do not get any help as to his character, nor as to the estimation in which he was held. His only inscription extant is above his idealized bas-relief at Murghab, where he simply writes: "I am Cyrus, the Achemenian." The stone shows Cyrus standing, looking to the right, draped in a fringed garment resembling those worn by the ancientBabylonians, reaching to the feet. His hair is combed back in the Persian style, and upon his head is an elaborate Egyptian crown, two horns extending to front and back, with a uraeus serpent rising from each end, and between the serpents three vase-like objects, with discs at their bases and summits, and serrated leaves between. There is no doubt that this crown is symbolical of his dominion over Egypt, the three vase-like objects being modifications of the triple helmet-crown of the Egyptian deities. The king is represented as four-winged in the Assyro-Babylonian style, probably as a claim to divinity in their hierarchy as well as to dominion in the lands of Merodach and Assur. In his right hand, which is raised to the level of his shoulder, he holds a kind of scepter seemingly terminating in a bird\'s head—in all probability also a symbol of Babylonian dominion, though the emblem of the Babylonian cities of the south was most commonly a bird with wings displayed.``136';

isbe[2490]='Dabbesheth`dab\'-e-sheth (dabbesheth; Dabasthai; the King James Version Dabbasheth, dab\'a-sheth): A town on the western boundary of Zebulun (<a onClick="return mV(\'Jos\',19,11);">Jos 19:11</a>). It is probably identical with the modern Dabsheh, a ruined site to the east of Acre.``1';
isbe[2491]='Daberath`dab\'-e-rath (ha-dabherath, "pasture"; Dabeiroth): A city in the territory of Issachar, on the boundary between that tribe and Zebulun (<a onClick="return mV(\'Jos\',19,12);">Jos 19:12</a>). It was assigned to the Gershonite Levites (<a onClick="return mV(\'Jos\',21,28);">Jos 21:28</a>; <a onClick="return mV(\'1Ch\',6,72);">1Ch 6:72</a>). The most probable identification is with Dabuiriyeh, a village on the lower western slopes of Tabor.``1';
isbe[2492]='Dabria`da\'-bri-a: One of the five who wrote down the visions of Esdras, described (2Esdras 14:24) as "ready to write swiftly."``1';
isbe[2493]='Dacubi; Dacobi` da-ku\'-bi, da-ko\'-bi, King James Version: Head of a family of gate-keepers (1Esdras 5:28).`<a href="./study/isbe/search.html?string=AKKUB">AKKUB</a>; <a href="./study/isbe/search.html?string=DAKUBI">DAKUBI</a>`1';
isbe[2494]='Daddeus`da-de\'-us, the Revised Version (British and American); <a href="./study/isbe/search.html?string=LODDEUS">LODDEUS</a> (Loddaios), which see.``1';

isbe[2496]='Dagon`da\'-gon (daghon; apparently derived from dagh, "fish"): Name of the god of the Philistines (according to Jerome on <a onClick="return mV(\'Isa\',46,1);">Isa 46:1</a> of the Philistines generally); in the Bible, Dagon is associated with Gaza (<a onClick="return mV(\'Jdg\',16,\'1-\');">Jud 16</a>) but elsewhere with Ashdod (compare <a onClick="return mV(\'1Sa\',5,\'1-\');">1Sa 5</a> and 1Macc 10:83f; 11:4); in <a onClick="return mV(\'1Ch\',10,10);">1Ch 10:10</a> there is probably an error (compare the passage <a onClick="return mV(\'1Sa\',31,10);">1Sa 31:10</a>). The god had his temple ("the house of Dagon") and his priests. When the ark was captured by the Philistines, it was conducted to Ashdod where it was placed in the house of Dagon by the side of the idol. But on the morrow it was found that the idol lay prostrate before the ark of the Lord. It was restored to its place; but on the following day Dagon again lay on the ground before the ark, this time with the head and both hands severed from the body and lying upon the miphtan (the word is commonly interpreted to mean "threshold"; according to Winckler, it means "pedestal"); the body alone remained intact. The Hebrew says: "Dagon alone remained." Whether we resort to an emendation (dagho, "his fish-part") or not, commentators appear to be right in inferring that the idol was half-man, half-fish. Classic authors give this form to Derceto. The sacred writer adds that from that time on the priests of Dagon and all those that entered the house of Dagon refrained from stepping upon the miphtan of Dagon. See <a onClick="return mV(\'1Sa\',5,\'1-5\');">1Sa 5:1-5</a>. The prophet Zephaniah (<a onClick="return mV(\'Zep\',1,9);">Ze 1:9</a>) speaks of an idolatrous practice which consisted in leaping over the miphtan. The Septuagint in 1 Samuel indeed adds the clause: "but they were accustomed to leap." Leaping over the threshold was probably a feature of the Philistine ritual which the Hebrews explained in their way. A god Dagon seems to have been worshipped by the Canaanites;<P>LITERATURE<P>Commentaries on Judges and 1 Samuel; Winckler, Altoriental. Forschungen, III, 383.`<a href="./study/isbe/search.html?string=BETH-DAGON">BETH-DAGON</a>`115';
isbe[2497]='Daily`da\'-li: This word, coming as it does from the Hebrew yom "day," and the Greek hemera, suggests either day by day (<a onClick="return mV(\'Exd\',5,13);">Ex 5:13</a>), that which is prepared for one daily (<a onClick="return mV(\'Neh\',5,18);">Ne 5:18</a>), as e.g. our "daily bread," meaning bread sufficient for that day (<a onClick="return mV(\'Mat\',6,11);">Mt 6:11</a>); or day by day continuously, one day after another in succession, as "the daily burnt offering" (<a onClick="return mV(\'Num\',29,6);">Nu 29:6</a> the King James Version), "daily ministration" (<a onClick="return mV(\'Act\',6,1);">Ac 6:1</a>), and "daily in the temple" (<a onClick="return mV(\'Act\',5,42);">Ac 5:42</a> the King James Version). The meaning of the word "daily" as used in the Lord\'s Prayer (<a onClick="return mV(\'Mat\',6,11);">Mt 6:11</a>) seems to indicate sufficient for our need, whether we consider that need as a day at a time, or day after day as we are permitted to live. "Give us bread sufficient for our sustenance."``181';
isbe[2498]='Daily offering; Daily Sacrifice``<a href="./study/isbe/search.html?string=SACRIFICE">SACRIFICE</a>`1';
isbe[2499]='Dainties; Dainty (Meats)`dan\'-tis (maT\'ammoth, "things full of taste," man\'ammim, ma\'adhan; liparos, "fat," "shining"): Jacob is represented as predicting of Asher, "He shall yield royal dainties" (<a onClick="return mV(\'Gen\',49,20);">Ge 49:20</a>; compare parallel clause, "His bread shall be fat," and <a onClick="return mV(\'Deu\',33,24);">De 33:24</a>, "Let him dip his foot in oil"). David, praying to be delivered from the ways of "men that work inquiry," cries, "Let me not eat of their dainties" (<a onClick="return mV(\'Psa\',141,4);">Ps 141:4</a>). The man who sitteth "to eat with a ruler" (<a onClick="return mV(\'Pro\',23,\'1-3\');">Pr 23:1-3</a>) is counseled, "If thou be a man given to appetite, be not desirous of his dainties; seeing they are deceitful food" (compare John\'s words in the woes upon Babylon (<a onClick="return mV(\'Rev\',18,14);">Re 18:14</a>), "All things that were dainties and sumptuous are perished from thee," and Homer\'s Iliad (Pope). xviii.456). "Dainties," then, are luxuries, costly, delicate and rare. This idea is common to all the words thus rendered; naturally associated with kings\' tables, and with the lives of those who are lovers of pleasure and luxury. By their associations and their softening effects they are to be abstained from or indulged in moderately as "deceitful food" by those who would live the simple and righteous life which wisdom sanctions. They are also "offered not from genuine hospitality, but with some by-ends." He should also shun the dainties of the niggard (<a onClick="return mV(\'Pro\',23,6);">Pr 23:6</a>), who counts the cost (<a onClick="return mV(\'Pro\',23,7);">Pr 23:7</a> the Revised Version, margin) of every morsel that his guest eats.`<a href="./study/isbe/search.html?string=DELICATE">DELICATE</a>; <a href="./study/isbe/search.html?string=FOOD">FOOD</a>`47';
isbe[2500]='Daisan`da\'-san, da\'-i-san (Daisan): Head of a family of temple servants (1Esdras 5:31) called Rezin in <a onClick="return mV(\'Ezr\',2,48);">Ezr 2:48</a>; <a onClick="return mV(\'Neh\',7,50);">Ne 7:50</a>, the interchange of "D" and "R" in Hebrew being not uncommon.``1';
