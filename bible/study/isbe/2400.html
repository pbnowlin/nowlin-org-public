 "a shouting," whether for joy or grief (<a onClick="return mV(\'1Ki\',8,28);">1Ki 8:28</a>; <a onClick="return mV(\'Psa\',17,1);">Ps 17:1</a>; <a onClick="return mV(\'Psa\',61,1);">61:1</a>; <a onClick="return mV(\'Psa\',88,2);">88:2</a>; <a onClick="return mV(\'Psa\',119,169);">119:169</a>; <a onClick="return mV(\'Psa\',142,6);">142:6</a>; <a onClick="return mV(\'Isa\',43,14);">Isa 43:14</a> the Revised Version (British and American) "rejoicing," etc.). Other Hebrew words are \'anaq, "to groan" (<a onClick="return mV(\'Eze\',9,4);">Eze 9:4</a>; <a onClick="return mV(\'Eze\',24,17);">24:17</a> the King James Version; <a onClick="return mV(\'Eze\',26,15);">Eze 26:15</a> the King James Version); hamah, "to make a noise" (<a onClick="return mV(\'Psa\',55,17);">Ps 55:17</a> the King James Version); rua\', "to shout" (<a onClick="return mV(\'Jdg\',7,21);">Jud 7:21</a> the King James Version; <a onClick="return mV(\'Job\',30,5);">Job 30:5</a>; <a onClick="return mV(\'Isa\',42,13);">Isa 42:13</a>, etc.); ranan, "to cry aloud" (<a onClick="return mV(\'Psa\',84,2);">Ps 84:2</a>; <a onClick="return mV(\'Lam\',2,19);">La 2:19</a>); shoa\', "crying" (<a onClick="return mV(\'Isa\',22,5);">Isa 22:5</a>); teshu\'oth, "crying," "noise" (<a onClick="return mV(\'Job\',39,7);">Job 39:7</a> the King James Version).<P>In the New Testament we have boao, "to cry," "shout" (<a onClick="return mV(\'Mat\',3,3);">Mt 3:3</a>; <a onClick="return mV(\'Mar\',1,3);">Mr 1:3</a>; <a onClick="return mV(\'Mar\',15,34);">15:34</a>; <a onClick="return mV(\'Gal\',4,27);">Ga 4:27</a>, etc.); krazo (mimetic, the hoarse cry of the raven), "to cry out" (<a onClick="return mV(\'Mat\',9,27);">Mt 9:27</a>; <a onClick="return mV(\'Mat\',14,30);">14:30</a>; <a onClick="return mV(\'Mat\',21,9);">21:9</a>; <a onClick="return mV(\'Mat\',27,50);">27:50</a>; <a onClick="return mV(\'Mar\',5,5);">Mr 5:5</a>; <a onClick="return mV(\'Gal\',4,6);">Ga 4:6</a>; <a onClick="return mV(\'Rev\',6,10);">Re 6:10</a>; <a onClick="return mV(\'Rev\',7,2);">7:2</a>, etc.); phoneo, "to give forth the voice," "sound" (<a onClick="return mV(\'Luk\',8,8);">Lu 8:8</a>; <a onClick="return mV(\'Luk\',16,24);">16:24</a>; <a onClick="return mV(\'Luk\',23,46);">23:46</a>; <a onClick="return mV(\'Act\',16,28);">Ac 16:28</a>; <a onClick="return mV(\'Rev\',14,18);">Re 14:18</a> the King James Version); anaboao, "to cry out" (<a onClick="return mV(\'Mat\',27,46);">Mt 27:46</a>; <a onClick="return mV(\'Luk\',9,38);">Lu 9:38</a>); aphiemi, "to let go," "to send away" (<a onClick="return mV(\'Mar\',15,37);">Mr 15:37</a> the King James Version); epiboao, "to cry about" (anything) (<a onClick="return mV(\'Act\',25,24);">Acts 25:24</a>); epiphoneo, "to give forth the voice upon" (<a onClick="return mV(\'Luk\',23,21);">Lu 23:21</a> the King James Version); kraugazo, "to make a cry, or outcry, or clamor" (<a onClick="return mV(\'Mat\',12,19);">Mt 12:19</a>; <a onClick="return mV(\'Mat\',15,22);">15:22</a>; <a onClick="return mV(\'Jhn\',11,43);">Joh 11:43</a>; <a onClick="return mV(\'Jhn\',18,40);">18:40</a>; <a onClick="return mV(\'Jhn\',19,6,15);">19:6, 15</a>; <a onClick="return mV(\'Act\',22,23);">Ac 22:23</a>); anakrazo, "to cry out" (<a onClick="return mV(\'Mar\',1,23);">Mr 1:23</a>; <a onClick="return mV(\'Luk\',4,33);">Lu 4:33</a>, etc.); krauge, "a crying out" (<a onClick="return mV(\'Mat\',25,6);">Mt 25:6</a>; <a onClick="return mV(\'Act\',23,9);">Ac 23:9</a> the King James Version; <a onClick="return mV(\'Hbr\',5,7);">Heb 5:7</a>; <a onClick="return mV(\'Rev\',21,4);">Re 21:4</a>).<P>For "cry" the Revised Version (British and American) has "sound" (<a onClick="return mV(\'2Ch\',13,12);">2Ch 13:12</a>); "cry because of these things" (<a onClick="return mV(\'Job\',30,24);">Job 30:24</a> the English Revised Version); "cry out" (<a onClick="return mV(\'Job\',31,38);">Job 31:38</a>; <a onClick="return mV(\'Isa\',42,14);">Isa 42:14</a>); "call" (<a onClick="return mV(\'Psa\',28,1);">Ps 28:1</a>; <a onClick="return mV(\'Psa\',61,2);">61:2</a>; <a onClick="return mV(\'Psa\',141,1);">141:1</a>); "be blind" (<a onClick="return mV(\'Isa\',29,9);">Isa 29:9</a>); "groan" (<a onClick="return mV(\'Eze\',26,15);">Eze 26:15</a>); "pant" (<a onClick="return mV(\'Joe\',1,20);">Joe 1:20</a>); "cry aloud" (<a onClick="return mV(\'Mat\',12,19);">Mt 12:19</a>); "clamor" (<a onClick="return mV(\'Act\',23,9);">Ac 23:9</a>). Among the other changes are, "moan" for "cry aloud" (<a onClick="return mV(\'Psa\',55,17);">Ps 55:17</a>); "sound an alarm" (<a onClick="return mV(\'Hsa\',5,8);">Ho 5:8</a>); "take your pleasure," margin "blind yourselves." for "cry ye out" (<a onClick="return mV(\'Isa\',29,9);">Isa 29:9</a>): "sigh, but not aloud" for "forbear to cry" (<a onClick="return mV(\'Eze\',21,17);">Eze 21:17</a>); "shoutings" for "crying" (<a onClick="return mV(\'Job\',39,7);">Job 39:7</a>); "destruction" for "crying" (<a onClick="return mV(\'Pro\',19,18);">Pr 19:18</a>, where we have instead of "let not thy soul spare for his crying," "set not thy heart on his destruction," margin, Hebrew "causing him to die" (muth, "to put to death")); "went up" for "crying aloud" (<a onClick="return mV(\'Mar\',15,8);">Mr 15:8</a>, different text); "cry" for "voice" (<a onClick="return mV(\'Luk\',1,42);">Lu 1:42</a>); for "had cried" (<a onClick="return mV(\'Luk\',23,46);">Lu 23:46</a>), the American Standard Revised Version has "crying."``185';
isbe[2438]='Crystal`kris\'-tal: In English Versions of the Bible the word is probably intended to signify rock-crystal, crystallized quartz. This the Greeks called krustallos, "ice," believing it to have been formed from water by intense cold. Thus in <a onClick="return mV(\'Rev\',4,6);">Re 4:6</a>; <a onClick="return mV(\'Rev\',21,11);">21:11</a>; <a onClick="return mV(\'Rev\',22,1);">22:1</a>, either "crystal" (EV) or "ice" (Greek, krustallos) suits the context. The word rendered "crystal" in <a onClick="return mV(\'Eze\',1,22);">Eze 1:22</a> (qerach) is ambiguous in precisely the same way (the Revised Version, margin "ice"). In <a onClick="return mV(\'Job\',28,17);">Job 28:17</a> the context favors the King James Version "crystal," rather than the Revised Version (British and American) "glass" (zekhukhith). Finally, in <a onClick="return mV(\'Job\',28,18);">Job 28:18</a> the Revised Version (British and American) reads "crystal" for the King James Version "pearls" (Hebrew gabhish; the weight of evidence favors the Revised Version (British and American) in spite of the parallelism suggested by the King James Version).`<a href="./study/isbe/search.html?string=STONES,+PRECIOUS">STONES, PRECIOUS</a>`57';
isbe[2439]='Cub`kub (kubh; the King James Version Chub): The word occurs only in <a onClick="return mV(\'Eze\',30,5);">Eze 30:5</a>. There it is almost certainly a corruption, and we should read, as in Septuagint, "Lub," i.e. Libya. Libya, in the earlier part of the same verse (the King James Version), is a mistr of "Put," thus correctly rendered in the Revised Version (British and American).``1';
isbe[2440]='Cubit`ku\'-bit (\'ammah; pechus): The standard for measures of length among the Hebrews. They derived it from the Babylonians, but a similar measure was used in Egypt with which they must have been familiar. The length of the cubit is variously estimated, since there seems to have been a double standard in both countries, and because we have no undisputed example of the cubit remaining to the present time. The original cubit was the length of the forearm, from the elbow to the end of the middle finger, as is implied from the derivation of the word in Hebrew and in Latin (cubitum). It seems to be referred to also in <a onClick="return mV(\'Deu\',3,11);">De 3:11</a>: "after the cubit of a man." But this was too indefinite for a scientific standard, and the Babylonians early adopted a more accurate method of measurement which passed to the nations of the West. They had a double standard, the so-called royal cubit and the ordinary one. From the remains of buildings in Assyria and Babylonia, the former is made out to be about 20,6 inches, and a cubit of similar length was used in Egypt and must have been known to the Hebrews. This was probably the cubit mentioned by <a onClick="return mV(\'Eze\',40,5);">Eze 40:5</a> and perhaps that of Solomon\'s temple, "cubits after the first measure" (<a onClick="return mV(\'2Ch\',3,3);">2Ch 3:3</a>), i.e. the ancient cubit. The ordinary cubit of commerce was shorter, and has been variously estimated at between 16 and 18 or more inches, but the evidence of the Siloam inscription and of the tombs in Palestine seems to indicate 17,6 inches as the average length. See <a href="./study/isbe/search.html?string=WEIGHTS+AND+MEASURES">WEIGHTS AND MEASURES</a>. This was the cubit of six palms, while the longer one was of seven (<a onClick="return mV(\'Eze\',40,5);">Eze 40:5</a>). The cubit mentioned in <a onClick="return mV(\'Jdg\',3,16);">Jud 3:16</a> is from a different word in Hebrew (gomedh) and was probably shorter, for Ehud girded it on his thigh under his clothing.<P>The New Testament references are <a onClick="return mV(\'Mat\',6,27);">Mt 6:27</a>; <a onClick="return mV(\'Luk\',12,25);">Lu 12:25</a>, "Which of you...can add a cubit unto the measure of his life?"; <a onClick="return mV(\'Jhn\',21,18);">Joh 21:18</a>, "about two hundred cubits off"; <a onClick="return mV(\'Rev\',21,17);">Re 21:17</a>, "the wall thereof, a hundred and forty and four cubits."``138';
isbe[2441]='Cuckow; Cuckoo`kook\'-oo, kuk\'-oo (shachaph; laros; Latin Cuculus canorus): The Hebrew root from which the word shachaph is derived means "to be lean" and "slender," and in older versions of the Bible was translated cuckow (cuckoo). It was mentioned twice in the Bible (<a onClick="return mV(\'Lev\',11,16);">Le 11:16</a>, and practically the same in <a onClick="return mV(\'Deu\',14,15);">De 14:15</a> the King James Version "cuckoo"), in the list of unclean birds. The Latin term by which we designate the bird is very similar to the Arabic, and all names for it in different countries are so nearly the same that they prove themselves based on its double cry, "cuck-oo," or the single note "kowk" or "gouk." The bird is as old as history, and interesting because the European species placed its eggs in the nests of other birds, which gave rise to much fiction concerning its habits. The European bird is a brownish gray with white bars underneath, and larger than ours, which are a beautiful olive gray, with tail feathers of irregular length touched with white, knee tufts, black or yellow bill, according to species, and beautiful sleek head and shining eyes. Our birds build their own nests, attend their young with care and are much loved for their beauty. Their food is not repulsive in any species; there never was any reason why they should have been classed among the abominations, and for these reasons scientists in search of a "lean, slender" bird of offensive diet and habit have selected the "<a href="./study/isbe/search.html?string=SEA-MEW">SEA-MEW</a>" (which see) which is substituted for cuckoo in the Revised Version (British and American) with good natural-history reason to sustain the change.``167';
isbe[2442]='Cucumber`ku\'-kum-ber (qishshu\'im; sikuos): One of the articles of food for which Israel in the wilderness looked back with longing to Egypt (<a onClick="return mV(\'Num\',11,5);">Nu 11:5</a>). Cucumbers are great favorites with all the people of Palestine. Two varieties occur, Cucumis sativus (Arabic, Khyar), originally a product of Northwest India, which is smooth-skinned, whitish and of delicate flavor, and requires much water in its cultivation, and Cucumis chate (Arabic, faqqus), which is long and slender but less juicy than the former. Probably the Biblical reference is to this latter as it is a plant much grown in Egypt where it is said to attain unusual excellence.<P>A "garden of cucumbers" or more literally a "place of cucumbers" (miqshdh), is mentioned in <a onClick="return mV(\'Isa\',1,8);">Isa 1:8</a>; Baruch 6:70. "A lodge in a garden of cucumbers" (<a onClick="return mV(\'Isa\',1,8);">Isa 1:8</a>) is the rough wooden booth erected by the owner from which he keeps guard over his ripening vegetables. It is commonly raised upon poles and, when abandoned for the season, it falls into decay and presents a dreary spectacle of tottering poles and dead leaves.``117';
isbe[2443]='Cud``<a href="./study/isbe/search.html?string=CHEW;+CUD">CHEW</a>`1';
isbe[2444]='Culture`kul\'-tur: Found only in 2Esdras 8:6 the King James Version and the Revised Version (British and American), "give...culture to our understanding," i.e. to nourish it as seed in the ground.``1';
isbe[2445]='Cumber; Cumbered`kum\'-ber, (katargeo, "to make idle," perispaomai, "to be drawn about," in mind "to be distracted"): Spoken of the barren fig tree in the parable: "Cut it down; why doth it also cumber (block up, make unproductive) the ground?" (<a onClick="return mV(\'Luk\',13,7);">Lu 13:7</a>). Cumbered means to be over-occupied with cares or business, distracted: "But Martha was cumbered about much serving" (<a onClick="return mV(\'Luk\',10,40);">Lu 10:40</a>). The word cumbrance occurs only in <a onClick="return mV(\'Deu\',1,12);">De 1:12</a>: "How can I myself alone bear your cumbrance?" (Torach, "an encumbrance," "a burden"). Compare <a onClick="return mV(\'Isa\',1,14);">Isa 1:14</a>, where the Revised Version, margin has "cumbrance," the Revised Version (British and American) "trouble."``1';
isbe[2446]='Cumi`koo\'-me, ku\'-mi.`<a href="./study/isbe/search.html?string=TALITHA+CUMI">TALITHA CUMI</a>`1';
isbe[2447]='Cummin`kum\'-in (kammon; kuminon): The seed of the herb Cuminum cyminum (Natural Order Umbelliferae). It has carminative properties and is used for flavoring various dishes, especially during fasts. In flavor and appearance it resembles caraway, though it is less agreeable to western palates. As an illustration of Yahweh\'s wisdom it is said (<a onClick="return mV(\'Isa\',28,25,27);">Isa 28:25, 27</a>) that cummin is scattered in sowing and beaten out with a rod in threshing. These facts are true in Palestine today. The Jews paid tithes of cummin (<a onClick="return mV(\'Mat\',23,23);">Mt 23:23</a>)``1';
isbe[2448]='Cun`kun (kun, A, ek ton eklekton poleon, "from the chosen cities"): One of the cities of Hadarezer, king of Syria, spoiled by David (<a onClick="return mV(\'1Ch\',18,8);">1Ch 18:8</a>, the King James Version "Chun"). In the parallel passage (<a onClick="return mV(\'2Sa\',8,8);">2Sa 8:8</a>) its place is taken by <a href="./study/isbe/search.html?string=BEROTHAH">BEROTHAH</a>, which see.``1';
isbe[2449]='Cunning`kun\'-ing (chakham, chashabh): In Bible-English "cunning" means always "wise" or "skilful"; the word does not occur in the bad sense, and it is found in the Old Testament only. The chief Hebrew words are chakham, "wise," "skilful" (<a onClick="return mV(\'2Ch\',2,7);">2Ch 2:7</a> the King James Version "a man cunning to work in gold"; <a onClick="return mV(\'2Ch\',2,13);">2Ch 2:13</a>; <a onClick="return mV(\'Isa\',3,3);">Isa 3:3</a> the King James Version, etc.); chashabh, "to think," "devise," "desire" (<a onClick="return mV(\'Exd\',26,1,31);">Ex 26:1, 31</a>; <a onClick="return mV(\'Exd\',28,6,15);">28:6, 15</a> the King James Version, etc.). We have also da\'ath, "knowledge" (<a onClick="return mV(\'1Ki\',7,14);">1Ki 7:14</a> the King James Version); bin, "to be intelligent" (<a onClick="return mV(\'1Ch\',25,7);">1Ch 25:7</a> the King James Version); machasbebheth, "thought," "device," "design" (<a onClick="return mV(\'Exd\',31,4);">Ex 31:4</a>; <a onClick="return mV(\'Exd\',35,33,35);">35:33, 35</a> the King James Version); \'aman, "artificer" (<a onClick="return mV(\'Sgs\',7,1);">So 7:1</a> the King James Version); yadha\', "to know," once translated "cunning" (<a onClick="return mV(\'Dan\',1,4);">Da 1:4</a> the King James Version).<P>For cunning the American Standard Revised Version gives "skilful" (<a onClick="return mV(\'Exd\',31,4);">Ex 31:4</a>, etc.; <a onClick="return mV(\'Isa\',3,3);">Isa 3:3</a> "expert"); for "cunning work" the work of the "skilful workman" (<a onClick="return mV(\'Exd\',26,1,31);">Ex 26:1, 31</a>, etc., the English Revised Version "cunning workman"); for "curious," "skilfully woven," the English Revised Version "cunningly woven" (<a onClick="return mV(\'Exd\',28,8);">Ex 28:8</a>, etc.).``185';
isbe[2450]='Cup`(Most frequently, koc; four other words in one passage each; poterion): A vessel for drinking from, of a variety of material (gold, silver, earthenware), patterns (<a onClick="return mV(\'Est\',1,7);">Es 1:7</a>) and elaboration.<P>Figurative: By ordinary figure of speech, put sometimes for the contents of the cup, namely, for that which is drunk (<a onClick="return mV(\'Mat\',26,39);">Mt 26:39</a>). In both Old Testament and New Testament applied figuratively to that which is portioned out, and of which one is to partake; most frequently used of what is sorrowful, as God\'s judgments, His wrath, afflictions, etc. (<a onClick="return mV(\'Psa\',11,6);">Ps 11:6</a>; <a onClick="return mV(\'Psa\',75,8);">75:8</a>; <a onClick="return mV(\'Isa\',51,17);">Isa 51:17</a>; <a onClick="return mV(\'Rev\',14,10);">Re 14:10</a>). In a similar sense, used by Christ concerning the sufferings endured by Him (<a onClick="return mV(\'Mat\',26,39);">Mt 26:39</a>), and the calamities attending the confession of His name (<a onClick="return mV(\'Mat\',20,23);">Mt 20:23</a>). In the Old Testament applied also to the blessedness and joy of the children of God, and the full provision made for their wants (<a onClick="return mV(\'Psa\',16,5);">Ps 16:5</a>; <a onClick="return mV(\'Psa\',23,5);">23:5</a>; <a onClick="return mV(\'Psa\',116,13);">116:13</a>; compare <a onClick="return mV(\'Jer\',16,7);">Jer 16:7</a>; <a onClick="return mV(\'Pro\',31,6);">Pr 31:6</a>). All these passages refer not only to the experience of an allotted joy and sorrow, but to the fact that all others share in this experience. Within a community of those having the same interests or lot, each received his apportioned measure, just as at a feast, each cup is filled for the individual to drain at the same time that his fellow-guests are occupied in the same way.<P>The Holy Supper is called "the cup of the Lord" (<a onClick="return mV(\'1Cr\',10,21);">1Co 10:21</a>), since it is the Lord who makes the feast, and tenders the cup, just as "the cup of demons" with which it is contrasted, refers to what they offer and communicate. In <a onClick="return mV(\'1Cr\',11,25);">1Co 11:25</a>, the cup is called "the new covenant in my blood," i.e. it is a pledge and seal and means of imparting the blessings of the new covenant (<a onClick="return mV(\'Hbr\',10,16);">Heb 10:16</a>f)—a covenant established by the shedding of the blood of Christ. The use of the word "cup" for the sacrament shows how prominent was the part which the cup had in the Lord\'s Supper in apostolic times. Not only were all commanded to drink of the wine (<a onClick="return mV(\'Mat\',26,27);">Mt 26:27</a>), but the very irregularities in the Corinthian church point to its universal use (<a onClick="return mV(\'1Cr\',11,27);">1Co 11:27</a>). Nor does the Roman church attempt to justify its withholding the cup from the laity (the communion in one form) upon conformity with apostolic practice, or upon direct Scriptural authority. This variation from the original institution is an outgrowth of the doctrines of transubstantiation and sacramental concomitance, of the attempt to transform the sacrament of the Eucharist into the sacrifice of the Mass, and of the wide separation between clergy and laity resulting from raising the ministry to the rank of a sacerdotal order. The practice was condemned by Popes Leo I (died 461) and Gelasius (died 496); but gained a firm hold in the 12th century, and was enacted into a church regulation by the Council of Constance in 1415.<P>See also <a href="./study/isbe/search.html?string=BLESSING,+CUP+OF">BLESSING, CUP OF</a>.<P>As to the use of cups for divination (<a onClick="return mV(\'Gen\',44,5);">Ge 44:5</a>), the reference is to superstitious practice derived from the Gentiles. For various modes of divining what is unknown by the pouring of water into bowls, and making observations accordingly, see Geikie, Hours with the Bible, I, 492f; and article <a href="./study/isbe/search.html?string=DIVINATION">DIVINATION</a>.``84';
isbe[2451]='Cupbearer`kup\'-bar-er (mashqeh, "one giving drink"; oinochoos): An officer of high rank at ancient oriental courts, whose duty it was to serve the wine at the king\'s table. On account of the constant fear of plots and intrigues, a person must be regarded as thoroughly trustworthy to hold this position. He must guard against poison in the king\'s cup, and was sometimes required to swallow some of the wine before serving it. His confidential relations with the king often endeared him to his sovereign and also gave him a position of great influence. This officer is first mentioned in Scripture in <a onClick="return mV(\'Gen\',40,1);">Ge 40:1</a>ff, where the Hebrew word elsewhere translated "cupbearer" is rendered "butler." The phrase "chief of the butlers" (<a onClick="return mV(\'Gen\',40,2);">Ge 40:2</a>) accords with the fact that there were often a number of such officials under one as chief (compare Xen. Hellen. vii.1, 38). Nehemiah (compare <a onClick="return mV(\'Neh\',1,11);">Ne 1:11</a>) was cupbearer to Artaxerxes Longimanus, and was held in high esteem by him, as the record shows. His financial ability (<a onClick="return mV(\'Neh\',5,8,10,14,17);">Ne 5:8, 10, 14, 17</a>) would indicate that the office was a lucrative one. Cupbearers are mentioned further in <a onClick="return mV(\'1Ki\',10,5);">1Ki 10:5</a>; <a onClick="return mV(\'2Ch\',9,4);">2Ch 9:4</a>, where they, among other evidences of royal splendor, are stated to have impressed the queen of Sheba with Solomon\'s glory. The title Rabshakeh (<a onClick="return mV(\'Isa\',36,2);">Isa 36:2</a>), once thought to mean "chief of the cupbearers," is now given a different derivation and explained as "chief of the officers," or "princes" (BDB under the word). See further on cupbearers Herod. iii.34; Xen. Cyrop. i.3,8,9; Josephus, Ant, XVI, viii, 1; Tobit 1:22.``44';
isbe[2452]='Cupboard`kub\'-erd (kulikion, 1Macc 15:32): A kind of sideboard in or on which Simon\'s gold and silver vessels were displayed, and which, among other evidences of his glory, amazed the Syrian envoy Athenobius. Compare the Roman abacus, said to have been introduced into Rome from Asia.``1';
isbe[2453]='Curdle`kur\'-dl (qapha\', "to congeal," "harden," "curdle"): Occurs in <a onClick="return mV(\'Job\',10,10);">Job 10:10</a>, "Hast thou not...curdled me like cheese?" i.e. made him take solid form. "The formation of the embryo is a mystery on which the Hebrew dwells with a deep and reverential awe: compare <a onClick="return mV(\'Psa\',139,\'13-16\');">Ps 139:13-16</a>." These similes are often met with in the Koran and oriental poetry. See Speaker\'s Commentary in the place cited``1';
isbe[2454]='Cure; Cures`kur: Represents the words gahah, marpe\', raphdh; therapeuo, iasis. Gahah in <a onClick="return mV(\'Pro\',17,22);">Pr 17:22</a> translated "medicine" means properly the removal of a bandage from a healed wound, and, is used figuratively in <a onClick="return mV(\'Hsa\',5,13);">Ho 5:13</a>; marpe\', "healing," is used in the sense of deliverance of the city in <a onClick="return mV(\'Jer\',33,6);">Jer 33:6</a>; with a negative particle in <a onClick="return mV(\'2Ch\',21,18);">2Ch 21:18</a> it is used to describe the bowel disease of Jehoram as incurable. The Greek words are used of physical cures (iasis in <a onClick="return mV(\'Luk\',13,32);">Lu 13:32</a>) as contradistinguished from the casting out of demons as <a onClick="return mV(\'Mat\',17,16);">Mt 17:16</a>; <a onClick="return mV(\'Luk\',7,21);">Lu 7:21</a>; <a onClick="return mV(\'Jhn\',5,10);">Joh 5:10</a>. Cure is only used in the New Testament in the sense of physical healing; in the Old Testament usually in the sense of spiritual or national deliverance from danger.``107';
isbe[2455]='Curious`ku\'-ri-us (machashebheth; periergos): The above Hebrew word, meaning "thought," "device," "design," is translated "curious," <a onClick="return mV(\'Exd\',35,32);">Ex 35:32</a> the King James Version "curious works"; the English Revised Version "cunning"; the American Standard Revised Version "skilful"; cheshebh ("device," "devised work"), translated the King James Version "curious girdle," is translated by the English Revised Version "cunningly woven band," the American Standard Revised Version "skilfully" (<a onClick="return mV(\'Exd\',28,8,27,28);">Ex 28:8, 27-28</a>; <a onClick="return mV(\'Exd\',29,5);">29:5</a>; <a onClick="return mV(\'Exd\',39,5,20,21);">39:5, 20-21</a>; <a onClick="return mV(\'Lev\',8,7);">Le 8:7</a>). In <a onClick="return mV(\'Psa\',139,15);">Ps 139:15</a> raqam, "embroidered," "variegated" is used figuratively of a child in the womb, translated "curiously wrought"; "the body or the fetus is described as woven together of so many different-colored threads, like a cunning and beautiful network or tapestry" (Perowne in the place cited.). See also <a href="./study/isbe/search.html?string=CURDLE">CURDLE</A>. Periergos, "working round about," is used of the "curious arts" of some in Ephesus who brought their books to be burned (<a onClick="return mV(\'Act\',19,19);">Ac 19:19</a> the American Standard Revised Version "magical").`<a href="./study/isbe/search.html?string=ASTROLOGY">ASTROLOGY</a>`185';
isbe[2456]='Current Money``<a href="./study/isbe/search.html?string=MONEY,+CURRENT">MONEY, CURRENT</a>`1';
isbe[2457]='Curse`kurs (\'alah (<a onClick="return mV(\'Num\',5,21,23,27);">Nu 5:21, 23, 27</a>, etc.), me\'erah (<a onClick="return mV(\'Pro\',3,33);">Pr 3:33</a>; <a onClick="return mV(\'Mal\',2,2);">Mal 2:2</a>, etc.), klalah (<a onClick="return mV(\'Gen\',27,12,13);">Ge 27:12-13</a>); katara (<a onClick="return mV(\'Gal\',3,10,13);">Ga 3:10, 13</a>): This word as noun and verb renders different Hebrew words, some of them being more or less synonymous, differing only in degree of strength. It is often used in contrast with "bless" or "blessing" (<a onClick="return mV(\'Deu\',11,29);">De 11:29</a>). When a curse is pronounced against any person, we are not to understand this as a mere wish, however violent, that disaster should overtake the person in question, any more than we are to understand that a corresponding "blessing" conveys simply a wish that prosperity should be the lot of the person on whom the blessing is invoked. A curse was considered to possess an inherent power of carrying itself into effect. Prayer has been defined as a wish referred to God. Curses (or blessings) were imprecations referred to supernatural beings in whose existence and power to do good or inflict harm primitive man believed. The use of magic and spells of all kinds is based on the belief that it is possible to enlist the support of the superhuman beings with whom the universe abounds, and to persuade them to carry out the suppliant\'s wishes. It has been suggested that spells were written on pieces of parchment and cast to the winds in the belief that they would find their way to their proper destination—that some demoniac being would act as postman and deliver them at the proper address. In <a onClick="return mV(\'Zec\',5,\'1-3\');">Zec 5:1-3</a> the "flying roll," with curses inscribed on it "goeth forth over the face of the whole land." It would find its way into the house of every thief and perjurer. But it was not always possible to commit curses to writing, it was enough to utter them aloud. Generally the name of some deity would be coupled with such imprecations, as Goliath cursed David by his gods (<a onClick="return mV(\'1Sa\',17,43);">1Sa 17:43</a>). Such curses once uttered possessed the power of self-realization. It was customary for heads of families in their declining years to bless their children, such a blessing being, not simply a paternal wish that their children should prosper in life, but a potent factor in determining their welfare (<a onClick="return mV(\'Gen\',9,25);">Ge 9:25</a>). in this case Jacob seeks his father\'s blessing, which was more than his father\'s good wishes for his future career. Such blessings and curses were independent of moraI considerations. Before moral distinctions played any part in molding theological conceptions it was not necessary, before a spell could be effectual, that the individual against whom the spell was pronounced should be deserving, on moral grounds, of the fate which was invoked on him. It was sufficient that he should be the foe of the author of the curse. We may assume that such curses signalized the commencement of a battle. But in process of time such indiscriminate imprecations would not satisfy enlightened moral judgment. In the dramatic situation depicted in <a onClick="return mV(\'Deu\',11,29);">De 11:29</a>; <a onClick="return mV(\'Deu\',27,12);">27:12</a>f the curse was placed on Mt. Ebal and the blessing. on Mr. Gerizim. But the curse was the penalty for disobedience, as the blessing was the reward for obedience. The Book of Proverbs <a onClick="return mV(\'Pro\',26,2);">Pr 26:2</a> summarily dismisses the traditional belief—"the curse that is causeless alighteth not." "In the discourses of Jesus we find blessings and curses. They are however simply authoritative declarations of the eternal connection between right doing and happiness, wrong doing and misery" (Cheyne). <P>Whereas curses by ordinary persons were considered more or less efficacious—some god being always only too glad to speed them on their way to their destination—yet special persons—"holy" persons—in virtue of their special relation to Divine beings possessed special powers of pronouncing effectual curses on account of their powers of enlisting supernatural aid. Balaam, according to the narrative in <a onClick="return mV(\'Num\',22,\'1-\');">Nu 22</a>f; was an expert in the art. Balak was convinced that Balaam\'s curse would bring about the defeat of the Israelites (see Gray, "Numbers," ICC).<P>The term—and the thing signified—plays an important part in Paul\'s interpretation of the cross. In the light of the law all men are guilty. There is no acquittal through appeal to a law that commands and never forgives—prohibits and never relents. The violator of the law is under a curse. His doom has been pronounced. Escape is impossible. But on the cross Jesus Christ endured the curse—for "cursed is every one that hangeth on a tree" (<a onClick="return mV(\'Gal\',3,10,13);">Ga 3:10, 13</a>)—and a curse that has overtaken its victim is a spent force.<P>Jesus commands His disciples, "Bless them that curse you" (<a onClick="return mV(\'Luk\',6,28);">Lu 6:28</a>; compare <a onClick="return mV(\'Rom\',12,14);">Ro 12:14</a>). He Himself cursed the fruitless fig tree (<a onClick="return mV(\'Mar\',11,21);">Mr 11:21</a>)—a symbol of the doom of a fruitless people.<P>Curse as the rendering of cherem, implies a totally different, idea.`<a href="./study/isbe/search.html?string=ACCURSED">ACCURSED</a>; <a href="./study/isbe/search.html?string=PUNISHMENTS">PUNISHMENTS</a>`103';
isbe[2458]='Curtain`kur\'-t\'-n, -ten, -tin: The word ordinarily used for curtain is yeri\'ah. Thus in <a onClick="return mV(\'Exd\',26,1);">Ex 26:1</a>ff; <a onClick="return mV(\'Exd\',36,8);">36:8</a>ff of the curtains of the tabernacle (see <a href="./study/isbe/search.html?string=TABERNACLE">TABERNACLE</a>); in <a onClick="return mV(\'2Sa\',7,2);">2Sa 7:2</a>; <a onClick="return mV(\'Psa\',104,2);">Ps 104:2</a>; <a onClick="return mV(\'Sgs\',1,5);">So 1:5</a>; <a onClick="return mV(\'Isa\',54,2);">Isa 54:2</a>; <a onClick="return mV(\'Jer\',4,20);">Jer 4:20</a>; <a onClick="return mV(\'Jer\',10,20);">10:20</a>; <a onClick="return mV(\'Jer\',49,29);">49:29</a>; <a onClick="return mV(\'Hab\',3,7);">Hab 3:7</a>.<P>Figurative: In <a onClick="return mV(\'Isa\',40,22);">Isa 40:22</a> (like <a onClick="return mV(\'Psa\',104,2);">Ps 104:2</a>, of the heavens), the word used is doq, literally, "gauze."``1';
isbe[2459]='Cush (1)`kush (kush):<P>1. The Ancestor of Many Nations:<P>(1) The first of the sons of Ham, from whom sprang Seba, Havilah, Sabtah, Raamah and Sabtecah. He was also the father of Nimrod, who rounded Babel (Babylon) and the other great states of Shinar or Babylonia (<a onClick="return mV(\'Gen\',10,\'6-8\');">Ge 10:6-8</a>). The meaning of the name is uncertain.<P>(2) The name of the country around which the Gihon flowed (<a onClick="return mV(\'Gen\',2,13);">Ge 2:13</a>), rendered "Ethiopia" in the King James Version, but in view of the distance of that country from the other rivers mentioned, this seems to be an unlikely identification.<P>2. A District of the Garden of Eden:<P>Fried. Delitzsch has suggested (Wo lag das Paradies? 74ff) that the watercourse in question is the canal Gu-hande or Arahtu, which, coming from the south, entered Babylon a little to the east of the Euphrates, and, flowing alongside the Festival-Street, entered the Euphrates to the north of Nebuchadrezzar\'s palace. Koldewey (Tempel von Babylon und Borsippa, 38) regards the Gu-hande as the section of the Euphrates itself at this point. There is no indication, however, that the district which it enclosed was ever called Kusu or Cush, and the suppression of the final syllable of Gu-hande would remain unexplained. Moreover, the identification of Cush with a possible Cas, for Kasdu, "Chaldea," seems likewise improbable, especially as that name could only have been applied, in early times, to the district bordering on the Persian Gulf (see <a href="./study/isbe/search.html?string=CHALDEA">CHALDEA</a>).<P>3. Probably not in Asia Minor:<P>Another theory is, that the Cush of <a onClick="return mV(\'Gen\',2,13);">Ge 2:13</a> is the Kusu of certain Assyrian letters, where it seems to designate a district in the neighborhood of Cappadocia. This identification apparently leads us back to an ancient tradition at one time current in the East, but later forgotten, which caused the Pyramus river to assume the name of Jihun (i.e. Gihon). This stream rises in the mountains northeast of the Gulf of Alexandretta, and, taking a southwesterly course, flows into the Mediterranean near Karatash. Though nearer than the Ethiopian Cush, this is still too far west, and therefore unsatisfactory as an identification—all the streams or waterways of the Garden of Eden ought to flow through the same district.<P>4. The Ethiopian Cush:<P>(3) The well-known country of Cush or Ethiopia, from Syene (<a onClick="return mV(\'Eze\',29,10);">Eze 29:10</a>) southward—Egyptian Kos, Babylonian Kusu, Assyrian Kusu. This name sometimes denotes the land (<a onClick="return mV(\'Isa\',11,11);">Isa 11:11</a>; <a onClick="return mV(\'Isa\',18,1);">18:1</a>; <a onClick="return mV(\'Zep\',3,10);">Ze 3:10</a>; <a onClick="return mV(\'Eze\',29,10);">Eze 29:10</a>; <a onClick="return mV(\'Job\',28,19);">Job 28:19</a>; <a onClick="return mV(\'Est\',1,1);">Es 1:1</a>; <a onClick="return mV(\'Est\',8,9);">8:9</a>); sometimes the people (<a onClick="return mV(\'Isa\',20,4);">Isa 20:4</a>; <a onClick="return mV(\'Jer\',46,9);">Jer 46:9</a>; <a onClick="return mV(\'Eze\',38,5);">Eze 38:5</a>); but is in many passages uncertain. Notwithstanding that the descendants of Ham are always regarded as non-Semites, the Ethiopians, Ge\'ez, as they called themselves, spoke a Semitic language of special interest on account of its likeness to Himyaritic, and its illustration of certain forms in Assyro-Babylonian. These Cushites were in all probability migrants from another (more northerly) district, and akin to the Canaanites—like them, dark, but by no means black, and certainly not Negroes. W. Max Muller (Asien und Europa, 113 note) states that it cannot be proved whether the Egyptians had quite black neighbors (on the south). In earlier times they are represented as brown, and later as brown mingled with black, implying that negroes only came to their knowledge as a distinct and extensive race in comparatively late times. Moses\' (first?) wife (<a onClick="return mV(\'Num\',12,1);">Nu 12:1</a>) was certainly therefore not a Negress, but simply a Cushite woman, probably speaking a Semitic language—prehistoric Ge\'ez or Ethiopian (see <a href="./study/isbe/search.html?string=CUSHITE+WOMAN">CUSHITE WOMAN</a>). In all probability Semitic tribes were classed as Hamitic simply because they acknowledged the supremacy of the Hamitic Egyptians, just as the non-Semetic Elamites were set down as Semites (<a onClick="return mV(\'Gen\',10,22);">Ge 10:22</a>) on account of their acknowledging Babylonian supremacy. It is doubtful whether the Hebrews, in ancient times, knew of the Negro race—they probably became acquainted with them long after the Egyptians.<P>5. Negroes Probably not Included:<P>In the opinion of W. Max Mailer (A, und East, 112), the Egyptians, when they became acquainted with the Negroes, having no word to express this race, classed them with the nechese, which thereafter included the Negroes. If the Hebrew name Phinehas (Pi-nechas) be really Egyptian and mean "the black," there is still no need to suppose that this meant "the Negro," for no Israelite would have borne a name with such a signification. The treasurer of Candace queen of Meroe (<a onClick="return mV(\'Act\',8,\'27-39\');">Ac 8:27-39</a>)—the Ethiopian eunuch—was an Abyssinian, not a Negro; and being an educated man, was able to read the Hebrew Scriptures in the Greek (Septuagint) version. Cush (mat Kusi, pr. Kushi) is frequently mentioned in the Assyrian inscriptions in company with Melubha (Merohha) to indicate Ethiopia and Meroe.`<a href="./study/isbe/search.html?string=EDEN">EDEN</a>; <a href="./study/isbe/search.html?string=ETHIOPIA">ETHIOPIA</a>; <a href="./study/isbe/search.html?string=TABLE+OF+NATIONS">TABLE OF NATIONS</a>`136';
isbe[2460]='Cush (2)`kush (kush; Septuagint Chousei, <a onClick="return mV(\'Psa\',7,1);">Ps 7 title</a>): A Benjamite, perhaps he that "was without cause" the "adversary" of David (compare <a onClick="return mV(\'Psa\',7,4);">Ps 7:4</a>).`<a href="./study/isbe/search.html?string=CUSHI">CUSHI</a>`1';
isbe[2461]='Cushan`kushan: In the psalm of Habakkuk (<a onClick="return mV(\'Hab\',3,7);">Hab 3:7</a>) "the tents of Cushan" are mentioned in an individualizing description of the effects of a theophany. Parallel is the phrase "the curtains of the land of Midian." Septuagint renders Cushan, kushan, by Aithiopon, reading perhaps kushim, or kushin (kushin). The context indicates that the same land or people is intended as the Old Testament elsewhere calls Cush, yet vaguely and not in any strict geographical usage that would limit it to Africa.``1';
isbe[2462]='Cushan-Rishathaim`ku\'-shan-rish-a-tha\'-im (kushan rish\'athayim, translated, or rather interpreted, as "man from Cush, he of the twofold crime"; Septuagint Chousarsathaim, the King James Version Chushan-rishathaim): Mentioned in <a onClick="return mV(\'Jdg\',3,\'8-10\');">Jud 3:8-10</a> as a king of Mesopotamia who was chosen by God as his tool to chastise the Israelites for their idolatry. After Joshua\'s death the children of Israel soon began to affiliate themselves with the heathen peoples among whom they dwelt. This was the fertile source of all their troubles. God delivered ("sold") them into the hands of the heathen. Cushan-Rishathaim is the first whose name is given in this connection. Barring this short passage in Judges nothing is known of the man. Eight years the Israelites were under his dominion, when the Lord raised up a deliverer to them, Othniel, the son of Kenaz, Caleb\'s younger brother—the first of the judges.``8';
isbe[2463]='Cushi`ku\'-shi: This name represents kushi, (in the original Septuagint Chousei, Chousi), either with or without the article. With the article (so in <a onClick="return mV(\'2Sa\',18,\'21-32\');">2Sa 18:21-32</a> seven out of eight times, all readings supported by the Septuagint) it simply indicate that the person so designated was of the Cushite people, as in <a onClick="return mV(\'Jer\',38,7);">Jer 38:7</a>ff. Its use without the article has doubtless developed out of the foregoing according to a familiar process. For the Cush of <a onClick="return mV(\'Psa\',7,1);">Ps 7, title</a> read "Cushi" with Septuagint.<P>(1) The messenger (the Revised Version (British and American) "the Cushite") sent by Joab to acquaint David with the victory over Absalom. That this man was in fact a foreigner is indicated by his ignorance of a shorter path which Ahimaaz took, by his being unrecognized by the watchman who recognizes Ahimaaz, and by his ignorance, as compared with Ahimaaz, of the sentiments of David, whom he knows only as a king and not as a man. <a onClick="return mV(\'2Sa\',18,21);">2Sa 18:21</a> (twice, the second time without the article), <a onClick="return mV(\'2Sa\',18,22,23,31);">2Sa 18:22-23, 31</a> (twice), <a onClick="return mV(\'2Sa\',18,32);">2Sa 18:32</a> (twice).<P>(2) The great-grandfather of Jehudi, a contemporary of Jeremiah (<a onClick="return mV(\'Jer\',36,14);">Jer 36:14</a>). The name Jehudi itself ("a man of Judah") is sufficient refutation of the opinion that the use of Cushi as or in lieu of a proper name "seems to show that there were but few Cushites among the Israelites."<P>(3) The father of Zephaniah the prophet (<a onClick="return mV(\'Zep\',1,1);">Ze 1:1</a>).``15';
isbe[2464]='Cushion`koosh\'-un (proskephalaion): In New Testament, only in <a onClick="return mV(\'Mar\',4,38);">Mr 4:38</a> the Revised Version (British and American). The word means literally, a cushion for the head (the King James Version "pillow") but was also used of one for sitting or reclining upon, e.g. of a rower\'s cushion. The article used with it in this passage suggests that it was one of the customary furnishings of the boat, and it was probably similar to the cushion placed for the comfort of passengers in the stern of modern boats on the Sea of Galilee. "Silken cushions" of <a onClick="return mV(\'Amo\',3,12);">Am 3:12</a> the Revised Version (British and American) is a rendering of the Hebrew demesheq from its supposed connection with damask. These cushions formed the divan, often the only article of furniture in an oriental reception room. "Cushions" occurs further in the somewhat doubtful the Revised Version, margin rendering of <a onClick="return mV(\'Pro\',7,16);">Pr 7:16</a>; <a onClick="return mV(\'Pro\',31,22);">31:22</a>.``44';
isbe[2465]='Cushite`kush\'-it: Whereas kushi, is elsewhere rendered Ethiopian, in <a onClick="return mV(\'2Sa\',18,\'21-32\');">2Sa 18:21-32</a> it is rendered Cushite in the Revised Version (British and American) (see <a href="./study/isbe/search.html?string=CUSHI">CUSHI</a> and compare <a href="./study/isbe/search.html?string=CUSHITE+WOMAN">CUSHITE WOMAN</a>). Its plural, which occurs in Zephaniah, Daniel and 2 Chronicles, also in the form kushiyim, in Amos, is uniformly translated Ethiopians, following Septuagint. The other Old Testament books use simply kush, for people as well as land.``1';
isbe[2466]='Cushite Woman; Ethiopian Woman`kush\'-it: In <a onClick="return mV(\'Num\',12,1);">Nu 12:1</a> Moses is condemned by his sister Miriam and his brother Aaron "because of the Cushite woman ha-\'ishshah ha-kushith whom he had married"; and the narrator immediately adds by way of needed explanation, "for he had married a Cushite woman" (\'ishshah khushith). Views regarding this person have been of two general classes:<P>(1) She is to be identified with Zipporah (<a onClick="return mV(\'Exd\',2,21);">Ex 2:21</a> and elsewhere), Moses\' Midianite wife, who is here called "the Gushite," either in scorn of her dark complexion (compare <a onClick="return mV(\'Jer\',13,23);">Jer 13:23</a>) and foreign origin (so most older exegetes), or as a consequence of an erroneous notion of the late age when this apocryphal addition, "because of the Cushite," etc., was inserted in the narrative (so Wellhansen).<P>(2) She is a woman whom Moses took to wife after the death of Zipporah, really a Cushite (Ethiopian) by race, whether the princess of Meroe of whom Josephus (Ant., II, x, 2) romances (so Targum of Jonathan), or one of the "mixed multitude" (<a onClick="return mV(\'Exd\',12,38);">Ex 12:38</a>; compare <a onClick="return mV(\'Num\',11,4);">Nu 11:4</a>) that accompanied the Hebrews on their wanderings (so Ewald and most). Dillmann suggests a compromise between the two classes of views, namely, that this woman is a mere "variation in the saga" from the wife elsewhere represented as Midianite, yet because of this variation she was understood by the author as distinct from Zipporah. The implication of the passage, in any case, is clearly that this connection of Moses tended to injure his prestige in the eyes of race-proud Hebrews, and, equally, that in the author\'s opinion such a view of the matter was obnoxious to God.``15';
isbe[2467]='Custody`kus\'-to-di (yadh, pequddah): In <a onClick="return mV(\'Est\',2,3,8);">Es 2:3, 8</a> bis. <a onClick="return mV(\'Est\',2,14);">14</a>, yadh, "the hand," is translated "Custody": pequddah, "numbering," "charge"; occurs in <a onClick="return mV(\'Num\',3,36);">Nu 3:36</a> the Revised Version (British and American) "the appointed charge," margin, Hebrew "the office of the charge."``1';
isbe[2468]='Custom (1)`kus\'-tum (tax):<P>(a) halakh, <a onClick="return mV(\'Ezr\',4,13,20);">Ezr 4:13, 20</a>; <a onClick="return mV(\'Ezr\',7,24);">7:24</a> the King James Version;<P>(b) belo, <a onClick="return mV(\'Ezr\',4,13);">Ezr 4:13</a>, etc.;<P>(c) telonion, <a onClick="return mV(\'Mat\',9,9);">Mt 9:9</a>; <a onClick="return mV(\'Mar\',2,14);">Mr 2:14</a>; <a onClick="return mV(\'Luk\',5,27);">Lu 5:27</a>, "receipt of custom" the King James Version, the Revised Version (British and American) "place of toll," the collectors\' office;<P>(d) telos, <a onClick="return mV(\'Mat\',17,25);">Mt 17:25</a> (the Revised Version (British and American) "toll"); <a onClick="return mV(\'Rom\',13,7);">Ro 13:7</a>; <span class="noTag">1Macc 11:35</a> (the Revised Version (British and American) "tolls"; compare 1Macc 10:31).<P>The tax designated by halakh in <a onClick="return mV(\'Ezr\',4,13);">Ezr 4:13</a>, etc., is usually taken to mean a road tax, a toll, from root halakh, but compare Winckler, Altorientalische Forschungen, II, 463, which derives from root ilku, a command, a decree, hence, an imposed tax. Belo from root yabhal is supposed to be a tax on merchandise or produce (as distinguished from "tribute" or the tax on houses, lands and persons), usually paid in kind and levied for the support of the native or provincial government. See Ryle, Cambridge Bible, Ezra-Nehemiah, in the place cited Telos in New Testament and Maccabees is an indirect tax farmed out to the publicans.``13';
isbe[2469]='Custom (2)`kus\'-tum (usage): In the Old Testament, except, <a onClick="return mV(\'Gen\',31,35);">Ge 31:35</a> where the Revised Version (British and American) renders, better, "manner" (derekh, "way"), the words translated "custom" are choq, chuqqah, "statute," and mishpaT, "judgment." Such passages as <a onClick="return mV(\'Jdg\',11,39);">Jud 11:39</a>; <a onClick="return mV(\'Jer\',32,11);">Jer 32:11</a>, and especially <a onClick="return mV(\'Ezr\',3,4);">Ezr 3:4</a> (the King James Version "custom," the Revised Version (British and American) "ordinance"), illustrate the difficulty of deciding upon the proper translation, in cases where "custom" might become "statute," "usage" establish itself as "law." In <a onClick="return mV(\'Lev\',18,30);">Le 18:30</a>; <a onClick="return mV(\'Jer\',10,3);">Jer 10:3</a> the reference is to heathen religious practices.<P>In the New Testament <a onClick="return mV(\'Luk\',1,9);">Lu 1:9</a>; <a onClick="return mV(\'Luk\',2,42);">2:42</a>; <a onClick="return mV(\'Act\',6,14);">Ac 6:14</a>; <a onClick="return mV(\'Act\',15,1);">15:1</a> (the King James Version "manner"); <a onClick="return mV(\'Luk\',16,21);">Lu 16:21</a>; <a onClick="return mV(\'Luk\',21,21);">21:21</a> (ethos), and <a onClick="return mV(\'Luk\',2,27);">Lu 2:27</a> from the same Greek root, refer likewise to definitely established religious practices; in every case except <a onClick="return mV(\'Act\',16,21);">Ac 16:21</a>, those of the Jewish law. The Revised Version (British and American) makes the translation of ethos uniform, reading "custom" in <a onClick="return mV(\'Luk\',22,39);">Lu 22:39</a> (the King James Version "wont") and in <a onClick="return mV(\'Jhn\',19,40);">Joh 19:40</a>; <a onClick="return mV(\'Act\',25,16);">Ac 25:16</a>; <a onClick="return mV(\'Hbr\',10,25);">Heb 10:25</a> (the King James Version "manner"). Greek eiothos, from the same root, is rendered "custom" in <a onClick="return mV(\'Luk\',4,16);">Lu 4:16</a> by English Versions of the Bible, and by the Revised Version (British and American) also in <a onClick="return mV(\'Act\',17,2);">Ac 17:2</a>, its only other occurrence in the New Testament. In <a onClick="return mV(\'Jhn\',18,39);">Joh 18:39</a>; <a onClick="return mV(\'1Cr\',11,16);">1Co 11:16</a> "custom" is the translation of Greek sunetheia, in the sense of "usage" rather than of "law."``57';
isbe[2470]='Cut; Cutting`(karath, gadha\', kachadh, nathach; apokopto, ekkopto): Many Hebrew words are translated "cut." Of these karath, "to cut down, out, off," is the most frequent. As "cut off" it is used in the sense of laying or destroying (<a onClick="return mV(\'Gen\',9,11);">Ge 9:11</a>; <a onClick="return mV(\'Deu\',12,29);">De 12:29</a>; <a onClick="return mV(\'1Ki\',11,16);">1Ki 11:16</a>; <a onClick="return mV(\'Psa\',101,8);">Ps 101:8</a>, etc.), also for cutting off transgressors from the community of Yahweh, which meant probably separation, or exclusion, rather than death or destruction (<a onClick="return mV(\'Gen\',17,14);">Ge 17:14</a>; <a onClick="return mV(\'Exd\',12,15,19);">Ex 12:15, 19</a>). Other words are damam, ("to be silent," "cease" <a onClick="return mV(\'Jer\',25,37);">Jer 25:37</a> the King James Version; <a onClick="return mV(\'Jer\',48,2);">Jer 48:2</a>); tsamath "to destroy" (<a onClick="return mV(\'Psa\',54,5);">Ps 54:5</a> the King James Version; <a onClick="return mV(\'Psa\',94,23);">Ps 94:23</a>, etc.); gadhadh, "to cut, one\'s self," is used of the cutting of one\'s flesh before heathen gods and in mourning for the dead, which was forbidden to the Israelites, (<a onClick="return mV(\'Deu\',14,1);">De 14:1</a>; <a onClick="return mV(\'1Ki\',18,28);">1Ki 18:28</a>; <a onClick="return mV(\'Jer\',16,6);">Jer 16:6</a>; <a onClick="return mV(\'Jer\',41,5);">41:5</a>; <a onClick="return mV(\'Jer\',47,5);">47:5</a>); seret, sareteth, "incision," are also used of those "cuttings of the flesh" (<a onClick="return mV(\'Lev\',19,28);">Le 19:28</a>; compare <a onClick="return mV(\'Lev\',21,5);">Le 21:5</a>). See <a href="./study/isbe/search.html?string=CUTTINGS+IN+THE+FLESH">CUTTINGS IN THE FLESH</a>. The cutting of the hair of head and beard in mourning for the dead is referred to in <a onClick="return mV(\'Isa\',15,2);">Isa 15:2</a>; "Every, beard is cut off" (gadha\'), and <a onClick="return mV(\'Jer\',7,29);">Jer 7:29</a>, gazaz, "Cut off thy hair" (the Revised Version, margin "thy crown"), O Jerusalem (compare <a onClick="return mV(\'Isa\',22,12);">Isa 22:12</a>; <a onClick="return mV(\'Jer\',16,6);">Jer 16:6</a>; <a onClick="return mV(\'Eze\',7,18);">Eze 7:18</a>; <a onClick="return mV(\'Amo\',8,10);">Am 8:10</a>). This early and widespread practice was also forbidden to the Israelites as being unworthy of them in their relation to Yahweh (<a onClick="return mV(\'Lev\',19,27);">Le 19:27</a>; <a onClick="return mV(\'Deu\',14,1);">De 14:1</a>).<P>Charosheth, "carving," "engraving," is used for the cutting of stones (<a onClick="return mV(\'Exd\',31,5);">Ex 31:5</a>; <a onClick="return mV(\'Exd\',35,33);">35:33</a>).<P>In the New Testament we have apokopto "to cut away" (<a onClick="return mV(\'Mar\',9,43,45);">Mr 9:43, 45</a>; <a onClick="return mV(\'Gal\',5,12);">Ga 5:12</a> the King James Version; see <a href="./study/isbe/search.html?string=CONCISION">CONCISION</a>); diaprio, "to saw through" (<a onClick="return mV(\'Act\',5,33);">Ac 5:33</a>, "they were cut to the heart"); dichotomeo, "to cut in two" (<a onClick="return mV(\'Mat\',24,51);">Mt 24:51</a>); suntemno, "to cut together" (<a onClick="return mV(\'Rom\',9,28);">Ro 9:28</a>), "finishing it and cutting it short," i. e; "making it conclusive and brief."<P>"mutilate themselves," the American Standard Revised Version "go "rest"), "noontide," margin "Or, tranquillity" (Gesenius, Delitzsch, etc., "in the quiet of my days"); instead of, "I would that they were even cut off which trouble you" (<a onClick="return mV(\'Gal\',5,12);">Ga 5:12</a>), Among the changes of the Revised Version (British and American) are "brought to silence" for "cut down" (<a onClick="return mV(\'Jer\',25,37);">Jer 25:37</a>), also for "cut off" (<a onClick="return mV(\'Zec\',12,3);">Zec 12:3</a>); for "cut off," "pass through" (<a onClick="return mV(\'Job\',11,10);">Job 11:10</a>), head" (<a onClick="return mV(\'Amo\',9,1);">Am 9:1</a>), "break them in pieces on the head of"; for "in the cutting off of my days" (<a onClick="return mV(\'Isa\',38,10);">Isa 38:10</a>; Hebrew demi, "silence," the English Revised Version has "cut themselves off," margin beyond circumcision," margin, Greek: "mutilate themselves." W. L. Walker "gone" (<a onClick="return mV(\'Psa\',90,10);">Ps 90:10</a>); "rolled up" (<a onClick="return mV(\'Isa\',38,12);">Isa 38:12</a>); "cut off" for "destroy" (<a onClick="return mV(\'Psa\',18,40);">Ps 18:40</a>; <a onClick="return mV(\'Psa\',69,4);">69:4</a>; <a onClick="return mV(\'Psa\',118,10,11,12);">118:10-12</a>); for "cut them in the (<a onClick="return mV(\'Jer\',49,26);">Jer 49:26</a>; <a onClick="return mV(\'Jer\',50,30);">50:30</a>); "sore wounded" for "cut in pieces"``1';
isbe[2471]='Cuth; Cuthah`kuth, ku\'-tha (kuth, kuthah; Choua, Chountha): The longer writing is the better of the two, and gives the Hebrew form of the name of one of the cities from which Sargon of Assyria brought colonists to fill the places of the Israelites which he deported from Samaria in 772 BC (<a onClick="return mV(\'2Ki\',17,24,30);">2Ki 17:24, 30</a>). Probably in consequence of their predominating numbers, the inhabitants of Samaria in general were then called kuthiyim, or Cutbeans.<p>1. The Ruins of Cuthah:<P>From contract-tablets found at Tel-Ibrahim by the late Hormuzd Hassam, on which the ancient name of the place is given as Gudua or Kutu, it would seem that that is the site which has to be identified with the Biblical Cuthah. It lies to the Northeast of Babylon, and was one of the most important cities of the Babylonian empire. The explorer describes the ruins as being about 3,000 ft. in circumference and 280 ft. high, and adjoining them on the west lies a smaller mound, crowned with a sanctuary dedicated to Ibrahim (Abraham). From the nature of the ruins, Rassam came to the conclusion that the city was much more densely populated after the fall of Babylon than in earlier times. A portion of the ruins were in a very perfect state, and suggested an unfinished building.<P>2. The Temple:<P>The great temple of the city was called E-mes-lam, and was dedicated to Nergal (compare <a onClick="return mV(\'2Ki\',17,30);">2Ki 17:30</a>), one of whose names was Meslam-ta-ea. Both city and temple would seem to have been old Sumerian foundations, as the name Gudua and its later Sere form, Kutu, imply.<P>LITERATURE.<P>See Rassam, Asshur and the Land of Nimrod,396,409, and, for details of the worship of Nergal, PSBA, December, 1906, 203-18.``136';
isbe[2472]='Cutha`ku\'-tha (Koutha; 1Esdras 5:32, the King James Version Coutha): Head of a family of temple servants who returned with Zerubbabel from Babylon; not mentioned in the canonical lists.``1';

isbe[2477]='Cuttings in the Flesh`(seret, sareteth): For relatives or friends to cut or beat themselves even to free blood-flowing, especially in the violence of grief in mourning for their dead (see <a href="./study/isbe/search.html?string=BURIAL">BURIAL</a>; <a href="./study/isbe/search.html?string=MOURNING">MOURNING</a>), was a widely prevalent custom among ancient peoples, and is well-nigh universal among uncivilized races today (see Spencer, Prin. of Soc., 3rd edition, I, 163ff). The fact is abundantly attested for most of the nations of antiquity, but there are two notable exceptions, the Egyptians (Herod. ii.61, 85; Wilkinson, Anc. Egyptian II, 374), and the Hebrews (<a onClick="return mV(\'Deu\',14,1);">De 14:1</a>; <a onClick="return mV(\'Lev\',21,5);">Le 21:5</a>). According to Plutarch (Sol. 21) Solon forbade the women of Athens to beat themselves to the effusion of blood, and the laws of the Twelve Tables, quoted by Cic. (De leg. ii.23) contained a like injunction. Among the ancient Arabs the forbidden practice was associated, as among the Hebrews, with the cutting off of the hair (Wellhausen, Skizzen, III, 160f).<P>That the prohibition among the Hebrews was urgently called for is made clear by the way it is dealt with by the Law and the prophets. The Law of Holiness reads: "Ye are the children of Yahweh your God: ye shall not cut yourselves" (<a onClick="return mV(\'Deu\',14,1);">De 14:1</a>), or "make any incision" (seret; <a onClick="return mV(\'Lev\',19,28);">Le 19:28</a>, sareteth; Septuagint entomis) in the flesh "for the dead." Probably the earliest reference to the custom as actually prevalent among the Hebrews is in <a onClick="return mV(\'Hsa\',7,14);">Ho 7:14</a> (ERVm). It was widely prevalent in the time of Jeremiah among his countrymen, even as among the Philistines (<a onClick="return mV(\'Jer\',47,5);">Jer 47:5</a>) and the Moabites (<a onClick="return mV(\'Jer\',48,37);">Jer 48:37</a>; compare <a onClick="return mV(\'Amo\',8,10);">Am 8:10</a>; <a onClick="return mV(\'Isa\',3,24);">Isa 3:24</a>; <a onClick="return mV(\'Isa\',15,2);">15:2</a>; <a onClick="return mV(\'Isa\',22,12);">22:12</a>; <a onClick="return mV(\'Mic\',1,16);">Mic 1:16</a>; <a onClick="return mV(\'Eze\',7,18);">Eze 7:18</a>).<P>In seeking for the reason or purpose underlying all such prohibitions, we may note, first, that the "cuttings" and "baldness" forbidden are alike said to be "for the dead." Not less explicitly are they said to be incompatible with Israel\'s unique relation to Yahweh—a relation at once of sonship (<a onClick="return mV(\'Deu\',14,1);">De 14:1</a>) and of consecration (<a onClick="return mV(\'Deu\',14,2);">De 14:2</a>). Moreover such mutilations of the body are always dealt with as forming part of the religious rites of the heathen (as of the Canaanitish Baal (<a onClick="return mV(\'1Ki\',18,28);">1Ki 18:28</a>) note "after their manner," see article in HDB, under the word). Both such shedding of blood and the dedication of the hair are found in almost all countries of that day in intimate connection with the rituals of burial and the prevailing belief in the necessity of propitiating the spirit of the deceased. The conclusion, then, seems clearly warranted that such tokens of grief were prohibited because they carried with them inevitably ideas and associations distinctly heathen in character and so incompatible with the pure religion of Yahweh, and unworthy of those who had attained to the dignity of the sons ("children") of Yahweh.<P>LITERATURE.<P>Benzinger, Heb Arch., section 23; Nowack, Heb Arch., I, 33f; Tylor, Prim. Cult.; W. R. Smith, Rel Semitic, Lect IX; and Comm., Knobel-Dillmann, Ex-Le on <span class="noTag">);">Le 19:28</span>; Driver, Deuteronomy on <span class="noTag">14:1</a>; and Lightfoot, Ga on <span class="noTag">6:17</a>.`<a href="./study/isbe/search.html?string=MARK">MARK</A>; <a href="./study/isbe/search.html?string=STIGMATA">STIGMATA</a>`47';
