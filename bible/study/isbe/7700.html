isbe[7751]='Sea-Mew`se\'-mu (shachaph; laros; Latin, Larus canus): The sea-gull. Used by modern translators in the list of abominations in the place of the cuckoo (<a onClick="return mV(\'Lev\',11,16);">Le 11:16</a>; <a onClick="return mV(\'Deu\',14,15);">De 14:15</a>). It is very probable that the sea-gull comes closer to the bird intended than the <a href="./study/isbe/search.html?string=CUCKOO">CUCKOO</a> (which see). The sea-gull is a "slender" bird, but not "lean" as the root shachaph implies. However, with its stretch of wing and restless flight it gives this impression. Gulls are common all along the Mediterranean coast and around the Sea of Galilee. They are thought to have more intelligence than the average bird, and to share with some eagles, hawks, vultures and the raven the knowledge that if they find mollusk they cannot break they can carry it aloft and drop it on the rocks. Only a wise bird learns this. Most feathered creatures pick at an unyielding surface a few times and then seek food elsewhere. There are two reasons why these birds went on the abomination lists. To a steady diet of fish they add carrion. Then they are birds of such nervous energy, so exhaustless in flight, so daring in flying directly into the face of fierce winds, that the Moslems believed them to be tenanted with the souls of the damned. Moses was reared and educated among the Egyptians, and the laws he formulated often are tinged by traces of his early life. History fails to record any instance of a man reared in Egypt who permitted the killing of a gull, ibis, or hoopoe.``167';
isbe[7752]='Sea-Monster`se\'-mon-ster: <a onClick="return mV(\'Gen\',1,21);">Ge 1:21</a> (tanninim), "sea monsters," the King James Version "whales," Septuagint (ta kete), "sea-monsters," "huge fish," or "whales." <a onClick="return mV(\'Job\',7,12);">Job 7:12</a> (tannin), "sea-monster" the King James Version "whale," the Septuagint drakon, "dragon." <a onClick="return mV(\'Psa\',74,13);">Ps 74:13</a> (tanninim), the American Standard Revised Version and the English Revised Version margin. "sea-monsters," the King James Version and the English Revised Version "dragons," the King James Version margin "whales" Septuagint drakontes, "dragons" <a onClick="return mV(\'Psa\',148,7);">Ps 148:7</a> (tanninim), "sea-monsters" the King James Version and the English Revised Version "dragons," the English Revised Version margin "sea-monsters" or "water-spouts," Septuagint drakontes, "dragons." <a onClick="return mV(\'Lam\',4,3);">La 4:3</a> (tannin) "jackals," the King James Version "sea monsters" the King James Version margin "sea calves," Septuagint drakontes. <a onClick="return mV(\'Mat\',12,40);">Mt 12:40</a> (referring to Jonah) (ketos), English Versions of the Bible "whale," the Revised Version margin "sea-monster." In the Apocrypha, the Revised Version (British and American) changes the King James Version "whale (ketos) into "sea-monster" in Sirach 43:25 but not in Song of Three Children verse 57.`<a href="./study/isbe/search.html?string=DRAGON">DRAGON</a>; <a href="./study/isbe/search.html?string=JACKAL">JACKAL</a>; <a href="./study/isbe/search.html?string=WHALE">WHALE</a>`37';
isbe[7753]='Seah`se\'-a (ce\'ah): A dry measure equal to about one and one-half pecks.`<a href="./study/isbe/search.html?string=WEIGHTS+AND+MEASURES">WEIGHTS AND MEASURES</a>`1';
isbe[7754]='Seal`sel (substantive chotham, "seal," "signet," Tabba\'ath, "signet-ring"; Aramaic \'izqa\'; sphragis; verb chatham, (Aramaic chatham); (sphragizo), (katasphragizomai, "to seal"):<P>I. Literal Sense.<P>A seal is an instrument of stone, metal or other hard substance (sometimes set in a ring), on which is engraved some device or figure, and is used for making an impression on some soft substance, as clay or wax, affixed to a document or other object, in token of authenticity.<P>1. Prevalence in Antiquity:<P>The use of seals goes back to a very remote antiquity, especially in Egypt, Babylonia and Assyria. Herodotus (i.195) records the Babylonian custom of wearing signets. In Babylonia the seal generally took the form of a cylinder cut in crystal or some hard stone, which was bored through from end to end and a cord passed through it. The design, often accompanied by the owner\'s name, was engraved on the curved part. The signet was then suspended by the cord round the neck or waist (compare the Revised Version (British and American) "cord" in <a onClick="return mV(\'Gen\',38,18);">Ge 38:18</a>; "upon thy heart...upon thine arm," i.e. one seal hanging down from the neck and another round the waist; <a onClick="return mV(\'Sgs\',8,6);">So 8:6</a>). In Egypt, too, as in Babylonia, the cylinder was the earliest form used for the purpose of a seal; but this form was in Egypt gradually superseded by the scarab (= beetle-shaped) as the prevailing type. Other forms, such as the cone-shaped, were also in use. From the earliest period of civilization the finger-ring on which some distinguishing badge was engraved was in use as a convenient way of carrying the signet, the earliest extant rings being those found in Egyptian tombs. Other ancient peoples, such as the Phoenicians, also used seals. From the East the custom passed into Greece and other western countries. Devices of a variety of sorts were in use at Rome, both by the emperors and by private individuals. In ancient times, almost every variety of precious stones was used for seals, as well as cheaper material, such as limestone or terra-cotta. In the West wax came early into use as the material for receiving the impression of the seal, but in the ancient East clay was the medium used (compare <a onClick="return mV(\'Job\',38,14);">Job 38:14</a>). Pigment and ink also came into use.<P>2. Seals among the Hebrews:<P>That the Israelites were acquainted with the use in Egypt of signets set in rings is seen in the statement that Pharaoh delivered to Joseph his royal signet as a token of deputed authority (<a onClick="return mV(\'Gen\',41,41);">Ge 41:41</a>f). They were also acquainted with the use of seals among the Persians and Medes (<a onClick="return mV(\'Est\',3,12);">Es 3:12</a>; <a onClick="return mV(\'Est\',8,\'8-10\');">8:8-10</a>; <a onClick="return mV(\'Dan\',6,17);">Da 6:17</a>). The Hebrews themselves used them at an early period, the first recorded instance being <a onClick="return mV(\'Gen\',38,1825);">Ge 38:18,25</a>, where the patriarch Judah is said to have pledged his word to Tamar by leaving her his signet, cord and staff. We have evidence of engraved signets being in important use among them in early times in the description of the two stones on the high priest\'s ephod (<a onClick="return mV(\'Exd\',28,11);">Ex 28:11</a>; <a onClick="return mV(\'Exd\',39,6);">39:6</a>), of his golden plate (<a onClick="return mV(\'Exd\',28,36);">Ex 28:36</a>; <a onClick="return mV(\'Exd\',39,30);">39:30</a>), and breastplate (<a onClick="return mV(\'Exd\',39,14);">Ex 39:14</a>). Ben-Sirach mentions as a distinct occupation the work of engraving on signets (Sirach 38:27). From the case of Judah and the common usage in other countries, we may infer that every Hebrew of any standing wore a seal. In the case of the signet ring, it was usual to wear it on one of the fingers of the right hand (<a onClick="return mV(\'Jer\',22,24);">Jer 22:24</a>). The Hebrews do not seem to have developed an original type of signets. The seals so far discovered in Palestine go to prove that the predominating type was the Egyptian, and to a less degree the Babylonian.<P>3. Uses of Sealing:<P>(1) One of the most important uses of sealing in antiquity was to give a proof of authenticity and authority to letters, royal commands, etc. It served the purposes of a modern signature at a time when the art of writing was known to only a few. Thus Jezebel "wrote letters in Ahab\'s name, and sealed them with his seal" (<a onClick="return mV(\'1Ki\',21,8);">1Ki 21:8</a>); the written commands of Ahasuerus were "sealed with the king\'s ring," "for the writing which is written in the king\'s name, and sealed with the king\'s ring, may no man reverse" (<a onClick="return mV(\'Est\',8,8,10);">Es 8:8,10</a>; <a onClick="return mV(\'Est\',3,12);">3:12</a>).<P>(2) Allied to this is the formal ratification of a transaction or covenant. Jeremiah sealed the deeds of the field which he bought from Hanamel (<a onClick="return mV(\'Jer\',32,\'10-14\');">Jer 32:10-14</a>; compare <a onClick="return mV(\'Jer\',32,44);">Jer 32:44</a>); Nehemiah and many others affixed their seal to the written covenant between God and His people (<a onClick="return mV(\'Neh\',9,38);">Ne 9:38</a>; <a onClick="return mV(\'Neh\',10,1);">10:1</a>).<P>(3) An additional use was the preservation of books in security. A roll or other document intended for preservation was sealed up before it was deposited in a place of safety (<a onClick="return mV(\'Jer\',32,14);">Jer 32:14</a>; compare the "book...close sealed with seven seals," <a onClick="return mV(\'Rev\',5,1);">Re 5:1</a>). In sealing the roll, it was wrapped round with flaxen thread or string, then a lump of clay was attached to it impressed with a seal. The seal would have to be broken by an authorized person before the book could be read (<a onClick="return mV(\'Rev\',5,2,5,9);">Re 5:2,5,9</a>; <a onClick="return mV(\'Rev\',6,1,3);">6:1,3</a>, etc.).<P>(4) Sealing was a badge of deputed authority and power, as when a king handed over his signet ring to one of his officers (<a onClick="return mV(\'Gen\',41,42);">Ge 41:42</a>; <a onClick="return mV(\'Est\',3,10);">Es 3:10</a>; <a onClick="return mV(\'Est\',8,2);">8:2</a>; 1Ma 6:15).<P>(5) Closed doors were often sealed to prevent the entrance of any unauthorized person. So the door of the lion\'s den (<a onClick="return mV(\'Dan\',6,17);">Da 6:17</a>; compare Bel and the Dragon verse 6:14). Herodotus mentions the custom of sealing tombs (ii.121). So we read of the chief priests and Pharisees sealing the stone at the mouth of our Lord\'s tomb in order to "make the sepulchre sure" against the intrusion of the disciples (<a onClick="return mV(\'Mat\',27,66);">Mt 27:66</a>). Compare the sealing of the abyss to prevent Satan\'s escape <a onClick="return mV(\'Rev\',20,3);">Re 20:3</a>). A door was sealed by stretching a cord over the stone which blocked the entrance, spreading clay or wax on the cord, and then impressing it with a seal.<P>(6) To any other object might a seal be affixed, as an official mark of ownership; e.g. a large number of clay stoppers of wine jars are still preserved, on which seal impressions of the cylinder type were stamped, by rolling the cylinder along the surface of the clay when it was still soft (compare <a onClick="return mV(\'Job\',38,14);">Job 38:14</a>).<P>II. Metaphorical Use of the Term.<P>The word "seal," both substantive and verb, is often used figuratively for the act or token of authentication, confirmation, proof, security or possession. Sin is said not to be forgotten by God, but treasured and stored up with Him against the sinner, under a seal (<a onClick="return mV(\'Deu\',32,34);">De 32:34</a>; <a onClick="return mV(\'Job\',14,17);">Job 14:17</a>). A lover\'s signet is the emblem of love as an inalienable possession (<a onClick="return mV(\'Sgs\',8,6);">So 8:6</a>); an unresponsive maiden is "a spring shut up, a fountain sealed" (<a onClick="return mV(\'Sgs\',4,12);">So 4:12</a>). The seal is sometimes a metaphor for secrecy. That which is beyond the comprehension of the uninitiated is said to be as "a book that is sealed" (<a onClick="return mV(\'Isa\',29,11);">Isa 29:11</a>f; compare the book with seven seals, <a onClick="return mV(\'Rev\',5,1);">Re 5:1</a>). Daniel is bidden to "shut up the words" of his prophecy "and seal the book, even to the time of the end," i.e. to keep his prophecy a secret till it shall be revealed (<a onClick="return mV(\'Dan\',12,4,9);">Da 12:4,9</a>; compare <a onClick="return mV(\'Rev\',10,4);">Re 10:4</a>). Elsewhere it stands for the ratification of prophecy (<a onClick="return mV(\'Dan\',9,24);">Da 9:24</a>). The exact meaning of the figure is sometimes ambiguous (as in <a onClick="return mV(\'Job\',33,16);">Job 33:16</a>; <a onClick="return mV(\'Eze\',28,12);">Eze 28:12</a>). In the New Testament the main ideas in the figure are those of authentication, ratification, and security. The believer in Christ is said to "set his seal to this, that God is true" (<a onClick="return mV(\'Jhn\',3,33);">Joh 3:33</a>), i.e. to attest the veracity of God, to stamp it with the believer\'s own endorsement and confirmation. The Father has sealed the Son, i.e. authenticated Him as the bestower of life-giving bread (<a onClick="return mV(\'Jhn\',6,27);">Joh 6:27</a>). The circumcision of Abraham was a "sign" and "seal," an outward ratification, of the righteousness of faith which he had already received while uncircumcised (<a onClick="return mV(\'Rom\',4,11);">Ro 4:11</a>; compare the prayer offered at the circumcision of a child, "Blessed be He who sanctified His beloved from the womb, and put His ordinance upon his flesh, and sealed His offering with the sign of a holy covenant"; also Targum <span class="noTag">Cant 38</span>: "The seal of circumcision is in your flesh as it was sealed in the flesh of Abraham"). Paul describes his act in making over to the saints at Jerusalem the contribution of the Gentiles as having "sealed to them this fruit" (<a onClick="return mV(\'Rom\',15,28);">Ro 15:28</a>); the meaning of the phrase is doubtful, but the figure seems to be based on sealing as ratifying a commercial transaction, expressing Paul\'s intention formally to hand over to them the fruit (of his own labors, or of spiritual blessings which through him the Gentiles had enjoyed), and to mark it as their own property. Paul\'s converts are the "seal," the authentic confirmation, of his apostleship (<a onClick="return mV(\'1Cr\',9,2);">1Co 9:2</a>). God by His Spirit indicates who are His, as the owner sets his seal on his property; and just as documents are sealed up until the proper time for opening them, so Christians are sealed up by the Holy Spirit "unto the day of redemption" (<a onClick="return mV(\'Eph\',1,13);">Eph 1:13</a>; <a onClick="return mV(\'Eph\',4,30);">4:30</a>; <a onClick="return mV(\'2Cr\',1,22);">2Co 1:22</a>). Ownership, security and authentication are implied in the words, "The firm foundation of God standeth, having this seal, The Lord knoweth them that are his" (<a onClick="return mV(\'2Ti\',2,19);">2Ti 2:19</a>). The seal of God on the foreheads of His servants (<a onClick="return mV(\'Rev\',7,\'2-4\');">Re 7:2-4</a>) marks them off as His own, and guarantees their eternal security, whereas those that "have not the seal of God on their foreheads" (<a onClick="return mV(\'Rev\',9,4);">Re 9:4</a>) have no such guaranty.<P>On the analogy of the rite of circumcision (see above), the term "seal" (sphragis) was at a very early period applied to Christian baptism. But there is no sufficient ground for referring such passages as <a onClick="return mV(\'Eph\',1,13);">Eph 1:13</a>; <a onClick="return mV(\'Eph\',4,30);">4:30</a>; <a onClick="return mV(\'2Cr\',1,22);">2Co 1:22</a> to the rite of baptism (as some do). The use of the metaphor in connection with baptism came after New Testament times (early instances are given in Gebhardt and Lightfoot on 2 Clem 7:6). Harnack and Hatch maintain that the name "seal" for baptism was taken from the Greek mysteries, but Anrich and Sanday-Headlam hold that it was borrowed from the Jewish view of circumcision as a seal.`<a href="./study/isbe/search.html?string=MYSTERY">MYSTERY</a>`49';
isbe[7755]='Sealed, Fountain`seld, These words, applied to the bride (<a onClick="return mV(\'Sgs\',4,12);">So 4:12</a>), find their explanation under <a href="./study/isbe/search.html?string=SEAL">SEAL</a> (which see). Anything that was to be authoritatively protected was sealed. Where water was one of the most precious things, as in the East, fountains and wells were often sealed (<a onClick="return mV(\'Gen\',29,3);">Ge 29:3</a>; <a onClick="return mV(\'Pro\',5,\'15-18\');">Pr 5:15-18</a>).``1';
isbe[7756]='Sealskin`sel\'-skin: The rendering of the Revised Version (British and American) (<a onClick="return mV(\'Exd\',25,5);">Ex 25:5</a>; <a onClick="return mV(\'Eze\',16,10);">Eze 16:10</a>) for \'or tachash, the Revised Version margin "porpoise-skin," the King James Version "badgers\' skin." A seal, Monachus albiventer, is found in the Mediterranean, though not in the Red Sea, but it is likely that tachash means the dugong, which is found in the Red Sea.`<a href="./study/isbe/search.html?string=BADGER">BADGER</a>; <a href="./study/isbe/search.html?string=PORPOISE">PORPOISE</a>`1';
isbe[7757]='Seam; Seamless`sem, sem\'-les: The coat or inner garment (chiton) of Jesus is described in <a onClick="return mV(\'Jhn\',19,23);">Joh 19:23</a> as "without seam" (arrhaphos), i.e. woven in one piece.``1';
isbe[7758]='Sear`ser: In <a onClick="return mV(\'1Ti\',4,2);">1Ti 4:2</a> for (kausteriazo), "burn with a hot iron" (compare "cauterize"), the King James Version "having their conscience seared with a hot iron," and the Revised Version margin. "Seared" in this connection means "made insensible," like the surface of a deep burn after healing. The verb, however, probably means "brand" (so the Revised Version (British and American)). "Criminals are branded on their forehead, so that all men may know their infamy. The consciences of certain men are branded just as truly, so that there is an inward consciousness of hypocrisy." See the commentaries``1';
isbe[7759]='Search`surch: Some peculiar senses are:<P>(1) In the books of Moses, especially in Numbers, "searching out the land" means to spy out (raggel), to investigate carefully, to examine with a view to giving a full and accurate report on.<P>(2) When applied to the Scriptures, as in <a onClick="return mV(\'Ezr\',4,15,19);">Ezr 4:15,19</a> (baqqer); <a onClick="return mV(\'Jhn\',5,39);">Joh 5:39</a>; <a onClick="return mV(\'1Pe\',1,11);">1Pe 1:11</a> (eraunao), it means to examine, to study out the meaning. In <a onClick="return mV(\'Act\',17,11);">Ac 17:11</a>, the Revised Version (British and American) substitutes "examining" for the "searched" of the King James Version. See <a href="./study/isbe/search.html?string=SEARCHINGS">SEARCHINGS</a>.<P>(3) "Search out" often means to study critically, to investigate carefully, e.g. <a onClick="return mV(\'Job\',8,8);">Job 8:8</a>; <a onClick="return mV(\'Job\',29,16);">29:16</a>; <a onClick="return mV(\'Ecc\',1,13);">Ec 1:13</a>; <a onClick="return mV(\'Lam\',3,40);">La 3:40</a>; <a onClick="return mV(\'Mat\',2,8);">Mt 2:8</a>; <a onClick="return mV(\'1Cr\',2,10);">1Co 2:10</a>; <a onClick="return mV(\'1Pe\',1,10);">1Pe 1:10</a>.<P>(4) When the word is applied to God\'s searching the heart or spirit, it means His opening up, laying bare, disclosing what was hidden, e.g. <a onClick="return mV(\'1Ch\',28,9);">1Ch 28:9</a>; <a onClick="return mV(\'Psa\',44,21);">Ps 44:21</a>; <a onClick="return mV(\'Psa\',139,1);">139:1</a>; <a onClick="return mV(\'Pro\',20,27);">Pr 20:27</a>; <a onClick="return mV(\'Jer\',17,10);">Jer 17:10</a>; <a onClick="return mV(\'Rom\',8,27);">Ro 8:27</a>.``64';
isbe[7760]='Search the Scriptures`The sentence beginning with (eraunate), in <a onClick="return mV(\'Jhn\',5,39);">Joh 5:39</a> the King James Version has been almost universally regarded as meaning "Search the scriptures, for in them ye think ye have eternal life." But one cannot read as far as dokeite, "ye think," without feeling that there is something wrong with the ordinary version. This verb is at least a disturbing element in the current of thought (if not superfluous), and only when the first verb is taken as an indicative does the meaning of the writer become clear. The utterance is not a command, but a declaration: "Ye search the scriptures, because ye think that in them," etc. Robert Barclay as early as 1675, in his Apology for the True Christian Divinity (91ff), refers to two scholars before him who had handed down the correct tradition: "Moreover, that place may be taken in the indicative mood, Ye search the Scriptures; which interpretation the Greek word will bear, and so Pasor translated it: which by the reproof following seemeth also to be the more genuine interpretation, as Cyrillus long ago hath observed." So Dr. Edwin A. Abbott, in his Johannine Grammar (London,1906,section 2439 (i)). See also Transactions American Philological Association, 1901, 64 f.``71';
isbe[7761]='Searchings`sur\'-chingz (chiqre (lebh), from chaqar, to "search," "explore," "examine thoroughly"): In the song of Deborah the Reubenites are taunted because their great resolves of heart, chiqeqe lebh, led to nothing but great "searchings" of heart, chiqre lebh, and no activity other than to remain among their flocks (<a onClick="return mV(\'Jdg\',5,15);">Jud 5:15</a>f). The first of the two Hebrew expressions so emphatically contrasted (though questioned by commentators on the authority of 5 manuscripts as a corruption of the second) can with reasonable certainty be interpreted "acts prescribed by one\'s understanding" (compare the expressions chakham lebh, nebhon lebh, in which the heart is looked upon as the seat of the understanding). The second expression may mean either irresolution or hesitation based on selfish motives, as the heart was also considered the seat of the feelings, or answerability to God (compare <a onClick="return mV(\'Jer\',17,10);">Jer 17:10</a>; <a onClick="return mV(\'Pro\',25,3);">Pr 25:3</a>); this rendering would explain the form liphelaghoth in <a onClick="return mV(\'Jdg\',5,16);">Jud 5:16</a>, literally, \'for the water courses of Reuben, great the searchings of heart!\'``81';
isbe[7762]='Seasons`se\'-z\'nz (summer: qayits, Chaldaic qayit (<a onClick="return mV(\'Dan\',2,35);">Da 2:35</a>); (theros; winter: cethaw) (<a onClick="return mV(\'Sgs\',2,11);">So 2:11</a>), (choreph; cheimon): The four seasons in Palestine are not so marked as in more northern countries, summer gradually fading into winter and winter into summer. The range of temperature is not great. In the Bible we have no reference to spring or autumn; the only seasons mentioned are "summer and winter" (<a onClick="return mV(\'Gen\',8,22);">Ge 8:22</a>; <a onClick="return mV(\'Psa\',74,17);">Ps 74:17</a>; <a onClick="return mV(\'Zec\',14,8);">Zec 14:8</a>).<P>Winter is the season of rain lasting from November to May. "The winter is past; the rain is over" (<a onClick="return mV(\'Sgs\',2,11);">So 2:11</a>). See <a href="./study/isbe/search.html?string=RAIN">RAIN</a>. The temperature at sealevel in Palestine reaches freezing-point occasionally, but seldom is less than 40deg. F. On the hills and mountains it is colder, depending on the height. The people have no means of heating their houses, and suffer much with the cold. They wrap up their necks and heads and keep inside the houses out of the wind as much as possible. "The sluggard will not plow by reason of the winter" (<a onClick="return mV(\'Pro\',20,4);">Pr 20:4</a>). Jesus in speaking of the destruction of Jerusalem says, "Pray ye that your flight be not in the winter" (<a onClick="return mV(\'Mat\',24,20);">Mt 24:20</a>). Paul asks Timothy to "come before winter" (<a onClick="return mV(\'2Ti\',4,21);">2Ti 4:21</a>) as navigation closed then and travel was virtually impossible.<P>Summer is very hot and rainless. "(When) the fig tree...putteth forth its leaves, ye know that the summer is nigh" (<a onClick="return mV(\'Mar\',13,28);">Mr 13:28</a>); "The harvest is past, the summer is ended" (<a onClick="return mV(\'Jer\',8,20);">Jer 8:20</a>). It is the season of harvesting and threshing (<a onClick="return mV(\'Dan\',2,35);">Da 2:35</a>). "He that gathereth in summer is a wise son" (<a onClick="return mV(\'Pro\',10,5);">Pr 10:5</a>).`<a href="./study/isbe/search.html?string=COLD">COLD</a>; <a href="./study/isbe/search.html?string=HEAT">HEAT</a>; <a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>`85';
isbe[7763]='Seat`set: This word is used to translate the Hebrew words (moshabh, shebheth, kicce\', and tekhunah), once (<a onClick="return mV(\'Job\',23,3);">Job 23:3</a>). It translates the Greek word (kathedra) (<a onClick="return mV(\'Mat\',21,12);">Mt 21:12</a>; <a onClick="return mV(\'Mat\',23,2);">23:2</a>; <a onClick="return mV(\'Mar\',11,15);">Mr 11:15</a>), and "chief seat" translates the compound word (protokathedria) (<a onClick="return mV(\'Mat\',23,6);">Mt 23:6</a>; <a onClick="return mV(\'Mar\',12,39);">Mr 12:39</a>; <a onClick="return mV(\'Luk\',20,46);">Lu 20:46</a>). In the King James Version it translates (thronos) (<a onClick="return mV(\'Luk\',1,52);">Lu 1:52</a>; <a onClick="return mV(\'Rev\',2,13);">Re 2:13</a>; <a onClick="return mV(\'Rev\',4,4);">4:4</a>; <a onClick="return mV(\'Rev\',11,16);">11:16</a>; <a onClick="return mV(\'Rev\',13,2);">13:2</a>; <a onClick="return mV(\'Rev\',16,10);">16:10</a>), which the Revised Version (British and American) renders "throne." It denotes a place or thing upon which one sits, as a chair, or stool (<a onClick="return mV(\'1Sa\',20,18);">1Sa 20:18</a>; <a onClick="return mV(\'Jdg\',3,20);">Jud 3:20</a>). It is used also of the exalted position occupied by men of marked rank or influence, either in good or evil (<a onClick="return mV(\'Mat\',23,2);">Mt 23:2</a>; <a onClick="return mV(\'Psa\',1,1);">Ps 1:1</a>).``29';
isbe[7764]='Seats, Chief`sets.`<a href="./study/isbe/search.html?string=CHIEF+SEATS">CHIEF SEATS</a>`1';
isbe[7765]='Seba`se\'-ba (cebha\'; Saba (<a onClick="return mV(\'Gen\',10,7);">Ge 10:7</a>; <a onClick="return mV(\'1Ch\',1,9);">1Ch 1:9</a>); Greek ibid., but Codex Vaticanus has (Saban):<P>1. Forms of Name, and Parentage of Seba:<P>The first son of Cush, his brothers being Havilah, Sabtah, Raamah, and Sabtecha. In <a onClick="return mV(\'Psa\',72,10);">Ps 72:10</a> and <a onClick="return mV(\'Isa\',43,3);">Isa 43:3</a> (where the Greek has Soene), Seba is mentioned with Egypt and Ethiopia, and must therefore have been a southern people. In <a onClick="return mV(\'Isa\',45,14);">Isa 45:14</a> we meet with the gentilic form, (csebha\'im) (Sabaeim), rendered "Sabaeans," who are described as "men of stature" (i.e. tall), and were to come over to Cyrus in chains, and acknowledge that God was in him—their merchandise, and that of the Ethiopians, and the labor of Egypt, were to be his.<P>2. Position of the Nation:<P>Their country is regarded as being, most likely, the district of Saba, north of Adulis, on the west coast of the Red Sea. There is just a possibility that the Sabi River, stretching from the coast to the Zambesi and the Limpopo, which was utilized as a waterway by the states in that region, though, through silting, not suitable now, may contain a trace of the name, and perhaps testifies to still more southern extensions of the power and influence of the Sebaim. (See Th. Bent, The Ruined Cities of Mashonaland, 1892.) The ruins of this tract are regarded as being the work of others than the black natives of the country. Dillmann, however, suggests (on <a onClick="return mV(\'Gen\',10,7);">Ge 10:7</a>) that the people of Seba were another branch of the Cushites east of Napatha by the Arabian Sea, of which Strabo (xvi. 4,8,10) and Ptolemy (iv.7, 7f) give information.`<a href="./study/isbe/search.html?string=SHEBA">SHEBA</a>`136';
isbe[7766]='Sebam`se\'-bam (sebham; Sebama; the King James Version Shebam): A town in the upland pasture land given to the tribes of Reuben and Gad. It is named along with Heshbon, Elealeh and Nebo (<a onClick="return mV(\'Num\',32,3);">Nu 32:3</a>). It is probably the same place as Sibmah (the King James Version "Shibmah") in <a onClick="return mV(\'Num\',32,38);">Nu 32:38</a> (so also <a onClick="return mV(\'Jos\',13,19);">Jos 13:19</a>). In the time of Isaiah and Jeremiah it was a Moabite town, but there is no record of how or when it was taken from Israel. It appears to have been famous for the luxuriance of its vines and for its summer fruits (<a onClick="return mV(\'Isa\',16,8);">Isa 16:8</a>f; <a onClick="return mV(\'Jer\',48,32);">Jer 48:32</a>). Eusebius (in Onomasticon) calls it a city of Moab in the land of Gilead which fell to the tribe of Reuben. Jerome (Comm. in <a onClick="return mV(\'Isa\',5,\'1-\');">Isa 5</a>) says it was about 500 paces from Heshbon, and he describes it as one of the strong places of that region. It may be represented by the modern Simia, which stands on the south side of Wady Chesban, about 2 miles from Chesban. The ancient ruins are considerable, with large sarcophagi; and in the neighboring rock wine presses are cut (PEFM, "Eastern Palestine," 221f).``54';
isbe[7767]='Sebat`se-bat\', se\'-bat (<a onClick="return mV(\'Zec\',1,7);">Zec 1:7</a>).`<a href="./study/isbe/search.html?string=SHEBAT">SHEBAT</a>`1';
isbe[7768]='Secacah`se-ka\'-ka, sek\'-a-ka (cekhakhah; Codex Vaticanus Aichioza; Codex Alexandrinus Sochocha): One of the six cities "in the wilderness of Judah" (<a onClick="return mV(\'Jos\',15,61);">Jos 15:61</a>), that is in the uncultivated lands to the west of the Dead Sea, where a scanty pasturage is still obtained by wandering Bedouin tribes. There are many signs in this district of more settled habitation in ancient times, but the name Secacah is lost. Conder proposed Khirbet edition Diqqeh (also called Khirbet es Siqqeh), "the ruin of the path," some 2 miles south of Bethany. Though an ancient site, it is too near the inhabited area; the name, too, is uncertain (PEF, III, 111, Sh XVII).``117';
isbe[7769]='Sechenias`sek-e-ni\'-as:<P>(1) (Codex Alexandrinus Sechenias; omitted in Codex Vaticanus and Swete): 1Esdras 8:29 = "Shecaniah" in <a onClick="return mV(\'Ezr\',8,3);">Ezr 8:3</a>; the arrangement in Ezra is different.<P>(2) (Codex Alexandrinus Sechenias, but Codex Vaticanus and Swete, Eiechonias): Name of a person who went up at the head of a family in the return with Ezra (1Esdras 8:32) = "Shecaniah" in <a onClick="return mV(\'Ezr\',8,5);">Ezr 8:5</a>.``1';
isbe[7770]='Sechu`se\'-ku (sekhu).`<a href="./study/isbe/search.html?string=SECU">SECU</a>`1';
isbe[7771]='Second Coming`sek\'-und kum\'-ing.`<a href="./study/isbe/search.html?string=PAROUSIA">PAROUSIA</a>; <a href="./study/isbe/search.html?string=ESCHATOLOGY+OF+THE+NEW+TESTAMENT">ESCHATOLOGY OF THE NEW TESTAMENT</a>`1';
isbe[7772]='Second Death``<a href="./study/isbe/search.html?string=DEATH">DEATH</a>; <a href="./study/isbe/search.html?string=ESCHATOLOGY+OF+THE+NEW+TESTAMENT">ESCHATOLOGY OF THE NEW TESTAMENT</a>`1';
isbe[7773]='Second Sabbath``<a href="./study/isbe/search.html?string=SABBATH,+SECOND+AFTER+THE+FIRST">SABBATH, SECOND AFTER THE FIRST</a>`1';
isbe[7774]='Secondarily`sek\'-un-da-ri-li: the King James Version for (deuteron) (<a onClick="return mV(\'1Cr\',12,28);">1Co 12:28</a>). Probably without distinction from "secondly" (so the Revised Version (British and American), and so the King James Version also for deuteron in Sirach 23:23). Still the King James Version may have wished to emphasize that the prophets have a lower rank than the apostles.``1';
isbe[7775]='Secret`se\'-kret: In <a onClick="return mV(\'Eze\',7,22);">Eze 7:22</a>, English Versions of the Bible has "secret place" for (tsaphan), "hide," "treasure." A correct translation is, "They shall profane my cherished place" (Jerusalem), and there is no reference to the Holy of Holies. The other uses of "secret" in the Revised Version (British and American) are obvious, but Revised Version\'s corrections of the King James Version in <a onClick="return mV(\'Jdg\',13,18);">Jud 13:18</a>; <a onClick="return mV(\'1Sa\',5,9);">1Sa 5:9</a>; <a onClick="return mV(\'Job\',15,11);">Job 15:11</a> should be noted.``1';
isbe[7776]='Sect`sekt (hairesis): "Sect" (Latin, secta, from sequi, "to follow") is in the New Testament the translation of hairesis, from haireo, "to take," "to choose"; also translated "heresy," not heresy in the later ecclesiastical sense, but a school or party, a sect, without any bad meaning attached to it. The word is applied to schools of philosophy; to the Pharisees and Sadducees among the Jews who adhered to a common religious faith and worship; and to the Christians. It is translated "sect" (<a onClick="return mV(\'Act\',5,17);">Ac 5:17</a>, of the Sadducees; <a onClick="return mV(\'Act\',15,5);">Ac 15:5</a>, of the Pharisees; <a onClick="return mV(\'Act\',24,5);">Ac 24:5</a>, of the Nazarenes; <a onClick="return mV(\'Act\',26,5);">Ac 26:5</a>, of the Pharisees; <a onClick="return mV(\'Act\',28,22);">Ac 28:22</a>, of the Christians); also the Revised Version (British and American) <a onClick="return mV(\'Act\',24,14);">Ac 24:14</a> (the King James Version and the English Revised Version margin "heresy"), "After the Way which they call a sect, so serve I the God of our fathers" (just as the Pharisees were "a sect"); it is translated "heresies" (<a onClick="return mV(\'1Cr\',11,19);">1Co 11:19</a>, margin "sects," the American Standard Revised Version "factions," margin "Greek: \'heresies\'"; the English Revised Version reverses the American Standard Revised Version text and margin; <a onClick="return mV(\'Gal\',5,20);">Ga 5:20</a>, the American Standard Revised Version "parties," margin "heresies"; the English Revised Version reverses text and margin; <a onClick="return mV(\'2Pe\',2,1);">2Pe 2:1</a>, "damnable heresies," the Revised Version (British and American) "destructive heresies," margin "sects of perdition"); the "sect" in itself might be harmless; it was the teaching or principles which should be followed by those sects that would make them "destructive." Hairesis occurs in 1Macc 8:30 ("They shall do it at their pleasure," i.e. "choice"); compare Septuagint <a onClick="return mV(\'Lev\',22,18,19);">Le 22:18,21</a>.`<a href="./study/isbe/search.html?string=HERESY">HERESY</a>`185';
isbe[7777]='Secu`se\'-ku (sekhu; Codex Vaticanus en Sephei; Codex Alexandrinus en Sokcho; the King James Version Sechu): This name occurs only in the account of David\'s visit to Samuel (<a onClick="return mV(\'1Sa\',19,22);">1Sa 19:22</a>). Saul, we are told, went to "Ramah, and came to the great well that is in Secu," where he inquired after Samuel and David. It evidently lay between the residence of Saul at Gibeah and Ramah. It is impossible to come to any sure conclusion regarding it. Conder suggested its identification with Khirbet Suweikeh, which lies to the south of Bireh. This is possible, but perhaps we should read with the Septuagint\'s Codex Vaticanus, "He came to the cistern of the threshing-floor that is on the bare hill" (en to Sephei). The threshing-floors in the East are naturally on high exposed ground where this is possible, and often form part of the area whence water in the rainy season is conducted to cisterns. This might have been a place actually within the city of Ramah.``54';
isbe[7778]='Secundus`se-kun\'-dus (Westcott-Hort Greek text Se\'koundos, Textus Receptus of the New Testament, Sekou\'ndos): A Thessalonian who was among those who accompanied Paul from Greece to Asia (<a onClick="return mV(\'Act\',20,4);">Ac 20:4</a>). They had preceded Paul and waited for him at Troas. If he were one of the representatives of the churches in Macedonia and Greece, entrusted with their contributions to Jerusalem (<a onClick="return mV(\'Act\',24,17);">Ac 24:17</a>; <a onClick="return mV(\'2Cr\',8,23);">2Co 8:23</a>), he probably accompanied Paul as far as Jerusalem. The name is found in a list of politarchs on a Thessalonian inscription.``1';
isbe[7779]='Secure; Security`se-kur\', se-ku\'-ri-ti: The word batach and its derivatives in Hebrew point to security, either real or imaginary. Thus we read of a host that "was secure" (<a onClick="return mV(\'Jdg\',8,11);">Jud 8:11</a>) and of those "that provoke God (and) are secure" (<a onClick="return mV(\'Job\',12,6);">Job 12:6</a>); but also of a security that rests in hope and is safe (<a onClick="return mV(\'Job\',11,18);">Job 11:18</a>). The New Testament words (poieo amerimnous), used in <a onClick="return mV(\'Mat\',28,14);">Mt 28:14</a> (the King James Version "secure you"), guarantee the safety of the soldiers, who witnessed against themselves, in the telling of the story of the disappearance of the body of Christ.<P>Securely is used in the sense of "trustful," "not anticipating danger" (<a onClick="return mV(\'Pro\',3,29);">Pr 3:29</a>; <a onClick="return mV(\'Mic\',2,8);">Mic 2:8</a>; Ecclesiasticus 4:15).<P>The word (hikanon, translated security (<a onClick="return mV(\'Act\',17,9);">Ac 17:9</a>), may stand either for a guaranty of good behavior exacted from, or for some form of punishment inflicted on, Jason and his followers by the rulers of Thessalonica.``42';
isbe[7780]='Sedecias`sed-e-si\'-as:<P>The King James Version = the Revised Version (British and American) <a href="./study/isbe/search.html?string=SEDEKIAS">SEDEKIAS</a> (which see).``1';
isbe[7781]='Sedekias`sed-e-ki\'-as:<P>(1) (Codex Alexandrinus and Codex Vaticanus Sedekias; the King James Version Zedechias): 1Esdras 1:46 (44) = Zedekiah king of Judah; also in Baruch 1:8 where the King James Version reads "Sedecias."<P>(2) In Baruch 1:1 (the King James Version "Sedecias"), an ancestor of Baruch, "the son of Asadias," sometimes (but incorrectly) identified with the false prophet "Zedekiah the son of Maaseiah" (<a onClick="return mV(\'Jer\',29,21);">Jer 29:21</a>).``1';
isbe[7782]='Sedition`se-dish\'-un: The translation in <a onClick="return mV(\'Ezr\',4,15,19);">Ezr 4:15,19</a> for \'eshtaddur, "struggling," "revolt"; in 2Esdras 15:16 for inconstabilitio, "instability" with "be seditious" for stasiazo, "rise in rebellion" in 2Macc 14:6. In addition, the King James Version has "sedition" for stasis, "standing up," "revolt" (the Revised Version (British and American) "insurrection") in <a onClick="return mV(\'Luk\',23,19,25);">Lu 23:19,25</a>; <a onClick="return mV(\'Act\',24,5);">Ac 24:5</a>, with (dichostasia), "a standing asunder" (the Revised Version (British and American) "division") in <a onClick="return mV(\'Gal\',5,20);">Ga 5:20</a>. As "sedition" does not include open violence against a government, the word should not have been used in any of the above cases.``1';
isbe[7783]='Seduce; Seducer`se-dus\', se-dus\'-er (Hiphil of (Ta\'ah, or ta\'ah, "to err"; of pathah, "to be simple"; planao, apoplanao, "to lead astray"):<P>(1) The word "seduce" is only used in the Bible in its general meaning of "to lead astray," "to cause to err," as from the paths of truth, duty or religion. It occurs in the King James Version and the Revised Version (British and American) <a onClick="return mV(\'Eze\',13,10);">Eze 13:10</a>; <a onClick="return mV(\'2Ki\',21,9);">2Ki 21:9</a>; <a onClick="return mV(\'1Ti\',4,1);">1Ti 4:1</a>; <a onClick="return mV(\'Rev\',2,20);">Re 2:20</a>; in the King James Version only, <a onClick="return mV(\'Pro\',12,26);">Pr 12:26</a> (the Revised Version (British and American) "causeth to err"); <a onClick="return mV(\'Isa\',19,13);">Isa 19:13</a> (the Revised Version (British and American) "caused to go astray"); <a onClick="return mV(\'Mar\',13,22);">Mr 13:22</a>; <a onClick="return mV(\'1Jo\',2,26);">1Joh 2:26</a> (the Revised Version (British and American) "lead astray"). The noun "seducer" (<a onClick="return mV(\'2Ti\',3,13);">2Ti 3:13</a> the King James Version, goes) is correctly changed in the Revised Version (British and American) into "impostor."<P>(2) It is not found in its specific sense of "to entice a female to surrender her chastity." Yet the crime itself is referred to and condemned.<P>Three cases are to be distinguished:<P>(a) The seduction of an unbetrothed virgin: In this case the seducer cording to J-E (<a onClick="return mV(\'Exd\',22,16);">Ex 22:16</a>f) is to be compelled to take the virgin as his wife, if the father consents, and to pay the latter the usual purchase price, the amount of which is not defined. In the Deuteronomic Code (<a onClick="return mV(\'Deu\',22,28);">De 22:28</a>) the amount is fixed at 50 shekels, and the seducer forfeits the right of divorce.<P>(b) The seduction of a betrothed virgin: This case (<a onClick="return mV(\'Deu\',22,\'23-27\');">De 22:23-27</a>; not referred to in the other codes) is treated as virtually one of adultery, the virgin being regarded as pledged to her future husband as fully as if she were formally married to him; the penalty therefore is the same as for adultery, namely, death for both parties (except in the case where the girl can reasonably be acquitted of blame, in which case the man only is put to death).<P>(c) The seduction of a betrothed bondmaid (mentioned only in <a onClick="return mV(\'Lev\',19,\'20-22\');">Le 19:20-22</a>): Here there is no infliction of death, because the girl was not free; but the seducer shall make a trespass offering, besides paying the fine.`<a href="./study/isbe/search.html?string=CRIMES">CRIMES</a>; <a href="./study/isbe/search.html?string=PUNISHMENTS">PUNISHMENTS</a>`49';
isbe[7784]='See`se: In addition to the ordinary sense of perceiving by the eye, we have<P>(1) chazah, "to see" (in vision): "Words of Amos...which he saw concerning Israel" (<a onClick="return mV(\'Amo\',1,1);">Am 1:1</a>). The revelation was made to his inward eye. "The word of Yahweh...which he (Micah) saw concerning Samaria" (<a onClick="return mV(\'Mic\',1,1);">Mic 1:1</a>), describing what he saw in prophetic vision (compare <a onClick="return mV(\'Hab\',1,1);">Hab 1:1</a>); see <a href="./study/isbe/search.html?string=REVELATION">REVELATION</a>, III, 4;<P>(2) horao, "to take heed": "See thou say nothing" (<a onClick="return mV(\'Mar\',1,44);">Mr 1:44</a>);<P>(3) eidon, "to know," "to note with the mind": "Jesus saw that he answered discreetly" (<a onClick="return mV(\'Mar\',12,34);">Mr 12:34</a>);<P>(4) theoreo, "to view," "to have knowledge or experience of": "He shall never see death" (<a onClick="return mV(\'Jhn\',8,51);">Joh 8:51</a>).``91';
isbe[7785]='Seed`sed (Old Testament always for zera\', Aramaic (<a onClick="return mV(\'Dan\',2,43);">Da 2:43</a>) zera\', except in <a onClick="return mV(\'Joe\',1,17);">Joe 1:17</a> for perudhoth (plural, the Revised Version (British and American) "seeds," the King James Version "seed"), and <a onClick="return mV(\'Lev\',19,19);">Le 19:19</a> (the King James Version "mingled seed") and <a onClick="return mV(\'Deu\',22,9);">De 22:9</a> (the King James Version "divers seeds") for kil\'ayim, literally, "two kinds," the Revised Version (British and American) "two kinds of seed." Invariably in Greek Apocrypha and usually in the New Testament for sperma, but <a onClick="return mV(\'Mar\',4,26,27);">Mr 4:26,27</a>; <a onClick="return mV(\'Luk\',8,5,11);">Lu 8:5,11</a>; <a onClick="return mV(\'2Cr\',9,10);">2Co 9:10</a> for sporos, and <a onClick="return mV(\'1Pe\',1,23);">1Pe 1:23</a> for spora):<P>(1) For "seed" in its literal sense see <a href="./study/isbe/search.html?string=AGRICULTURE">AGRICULTURE</a>. Of interest is the method of measuring land by means of the amount of seed that could be sown on it (<a onClick="return mV(\'Lev\',27,16);">Le 27:16</a>). The prohibition against using two kinds of seed in the same field (<a onClick="return mV(\'Lev\',19,19);">Le 19:19</a>; <a onClick="return mV(\'Deu\',22,9);">De 22:9</a>) undoubtedly rests on the fact that the practice had some connection with Canaanitish worship, making the whole crop "consecrated" (taboo). <a onClick="return mV(\'Jer\',31,27);">Jer 31:27</a> uses "seed of man" and "seed of beast" as a figure for the means by which God will increase the prosperity of Israel (i.e. "seed yielding men").<P>(2) For the transferred physiological application of the word to human beings (<a onClick="return mV(\'Lev\',15,16);">Le 15:16</a>, etc.) see <a href="./study/isbe/search.html?string=CLEAN">CLEAN</a>; <a href="./study/isbe/search.html?string=UNCLEANNESS">UNCLEANNESS</a>. The conception of Christians as "born" or "begotten" of God (see <a href="./study/isbe/search.html?string=REGENERATION">REGENERATION</a>) gave rise to the figure in <a onClick="return mV(\'1Pe\',1,23);">1Pe 1:23</a>; <a onClick="return mV(\'1Jo\',3,9);">1Joh 3:9</a>. If the imagery is to be stressed, the Holy Spirit is meant. In I <a onClick="return mV(\'Jhn\',3,9);">Joh 3:9</a> a doctrine of certain Gnostics is opposed. They taught that by learning certain formulas and by submitting to certain rites, union with God and salvation could be attained without holiness of life. John\'s reply is that union with a righteous God is meaningless without righteousness as an ideal, even though shortcomings exist in practice (<a onClick="return mV(\'1Jo\',1,8);">1Joh 1:8</a>).<P>(3) From the physiological use of "seed" the transition to the sense of "offspring" was easy, and the word may mean "children" (<a onClick="return mV(\'Lev\',18,21);">Le 18:21</a>, etc.) or even a single child (<a onClick="return mV(\'Gen\',4,25);">Ge 4:25</a>; <a onClick="return mV(\'1Sa\',1,11);">1Sa 1:11</a> the Revised Version margin). Usually, however, it means the whole posterity (<a onClick="return mV(\'Gen\',3,15);">Ge 3:15</a>, etc.); compare "seed royal" (<a onClick="return mV(\'2Ki\',11,1);">2Ki 11:1</a>, etc.), and "Abraham\'s seed" (<a onClick="return mV(\'2Ch\',20,7);">2Ch 20:7</a>, etc.) or "the holy seed" (<a onClick="return mV(\'Ezr\',9,2);">Ezr 9:2</a>; <a onClick="return mV(\'Isa\',6,13);">Isa 6:13</a>; 1Es 8:70; compare <a onClick="return mV(\'Jer\',2,21);">Jer 2:21</a>) as designations of Israel. So "to show one\'s seed" (<a onClick="return mV(\'Ezr\',2,59);">Ezr 2:59</a>; <a onClick="return mV(\'Neh\',7,61);">Ne 7:61</a>) is to display one\'s genealogy, and "one\'s seed" may be simply one\'s nation, conceived of as a single family (<a onClick="return mV(\'Est\',10,3);">Es 10:3</a>). From this general sense there developed a still looser use of "seed" as meaning simply "men" (<a onClick="return mV(\'Mal\',2,15);">Mal 2:15</a>; <a onClick="return mV(\'Isa\',1,4);">Isa 1:4</a>; <a onClick="return mV(\'Isa\',57,4);">57:4</a>; Wis 10:15; 12:11, etc.).<P>In <a onClick="return mV(\'Gal\',3,16);">Ga 3:16</a> Paul draws a distinction between "seeds" and "seed" that has for its purpose a proof that the promises to Abraham were realized in Christ and not in Israel. The distinction, however, overstresses the language of the Old Testament, which never pluralizes zera\' when meaning "descendants" (plural only in <a onClick="return mV(\'1Sa\',8,15);">1Sa 8:15</a>; compare <a onClick="return mV(\'Rom\',4,18);">Ro 4:18</a>; <a onClick="return mV(\'Rom\',9,7);">9:7</a>). But in an argument against rabbinical adversaries Paul was obliged to use rabbinical methods (compare <a onClick="return mV(\'Gal\',4,25);">Ga 4:25</a>). For modern purposes it is probably best to treat such an exegetical method as belonging simply to the (now superseded) science of the times.``48';
isbe[7786]='Seer`se\'-er, ser: The word in English Versions of the Bible represents two Hebrew words, ro\'eh (<a onClick="return mV(\'1Sa\',9,9,11,18,19);">1Sa 9:9,11,18,19</a>; <a onClick="return mV(\'2Sa\',15,27);">2Sa 15:27</a>; <a onClick="return mV(\'1Ch\',9,22);">1Ch 9:22</a>, etc.), And chozeh (<a onClick="return mV(\'2Sa\',24,11);">2Sa 24:11</a>; <a onClick="return mV(\'2Ki\',17,13);">2Ki 17:13</a>; <a onClick="return mV(\'1Ch\',21,9);">1Ch 21:9</a>; <a onClick="return mV(\'1Ch\',25,5);">25:5</a>; <a onClick="return mV(\'1Ch\',29,29);">29:29</a>, etc.). The former designation is from the ordinary verb "to see"; the latter is connected with the verb used of prophetic vision. It appears from <a onClick="return mV(\'1Sa\',9,9);">1Sa 9:9</a> that "seer" (ro\'-eh) was the older name for those who, after the rise of the more regular orders, were called "prophets." It is not just, however, to speak of the "seers" or "prophets" of Samuel\'s time as on the level of mere fortune-tellers. What insight or vision they possessed is traced to God\'s Spirit. Samuel was the ro\'-eh by pr-eeminence, and the name is little used after his time. Individuals who bear the title "seer" (chozeh) are mentioned in connection with the kings and as historiographers (<a onClick="return mV(\'2Sa\',24,11);">2Sa 24:11</a>; <a onClick="return mV(\'1Ch\',21,9);">1Ch 21:9</a>; <a onClick="return mV(\'1Ch\',25,5);">25:5</a>; <a onClick="return mV(\'1Ch\',29,29);">29:29</a>; <a onClick="return mV(\'2Ch\',9,29);">2Ch 9:29</a>; <a onClick="return mV(\'2Ch\',12,15);">12:15</a>; <a onClick="return mV(\'2Ch\',19,2);">19:2</a>, etc.), and distinction is sometimes made between "prophets" and "seers" (<a onClick="return mV(\'2Ki\',17,13);">2Ki 17:13</a>; <a onClick="return mV(\'1Ch\',29,29);">1Ch 29:29</a>, etc.). Havernick thinks that "seer" denotes one who does not belong to the regular prophetic order (Introductions to Old Testament, 50ff, English translation), but it is not easy to fix a precise distinction.`<a href="./study/isbe/search.html?string=PROPHET">PROPHET</a>; <a href="./study/isbe/search.html?string=PROPHECY">PROPHECY</a>`132';
isbe[7787]='Seethe`seth: Old English for "boil"; past tense, "sod" (<a onClick="return mV(\'Gen\',25,29);">Ge 25:29</a>), past participle, "sodden" (<a onClick="return mV(\'Lam\',4,10);">La 4:10</a>). See <a onClick="return mV(\'Exd\',23,19);">Ex 23:19</a> the King James Version.``1';
isbe[7788]='Segub`se\'-gub (seghubh (Qere), seghibh (Kethibh); Codex Vaticanus Zegoub; Codex Alexandrinus Segoub): 15:27; <a onClick="return mV(\'1Ch\',9,22);">1Ch 9:22</a>, etc.), And chozeh (<a onClick="return mV(\'2Sa\',24,11);">2Sa 24:11</a>; <a onClick="return mV(\'2Ki\',17,13);">2Ki 17:13</a>; <a onClick="return mV(\'1Ch\',21,9);">1Ch 21:9</a>; <a onClick="return mV(\'1Ch\',25,5);">25:5</a>; <a onClick="return mV(\'1Ch\',29,29);">29:29</a>, etc.). The former designation is from the ordinary verb "to see"; the latter is connected with the verb used of prophetic vision. It appears from <a onClick="return mV(\'1Sa\',9,9);">1Sa 9:9</a> that "seer" (ro\'-eh) was the older name for those who, after the rise of the more regular orders, were called "prophets." It is not just, however, to speak of the "seers" or "prophets" of Samuel\'s time as on the level of mere fortune-tellers. What insight or vision they possessed is traced to God\'s Spirit. Samuel was the ro\'-eh by pr-eeminence, and the name is little used after his time. Individuals who bear the title "seer" (chozeh) are mentioned in connection with the kings and as historiographers (<a onClick="return mV(\'2Sa\',24,11);">2Sa 24:11</a>; <a onClick="return mV(\'1Ch\',21,9);">1Ch 21:9</a>; <a onClick="return mV(\'1Ch\',25,5);">25:5</a>; <a onClick="return mV(\'1Ch\',29,29);">29:29</a>; <a onClick="return mV(\'2Ch\',9,29);">2Ch 9:29</a>; <a onClick="return mV(\'2Ch\',12,15);">12:15</a>; <a onClick="return mV(\'2Ch\',19,2);">19:2</a>, etc.), and distinction is sometimes made between "prophets" and "seers" (<a onClick="return mV(\'2Ki\',17,13);">2Ki 17:13</a>; <a onClick="return mV(\'1Ch\',29,29);">1Ch 29:29</a>, etc.). Havernick thinks that "seer" denotes one who does not belong to the regular prophetic order (Introductions to Old Testament, 50ff, English translation), but it is not easy to fix a precise distinction.<P>(1) The youngest son of Hiel, the rebuilder of Jericho (<a onClick="return mV(\'1Ki\',16,34);">1Ki 16:34</a>). The death of Segub is probably connected with the primitive custom of laying foundations with blood, as, indeed, skulls were found built in with the brickwork when the tower of Bel at Nippur was excavated. See <a href="./study/isbe/search.html?string=GEZER">GEZER</a>. If the death of the two sons was based on the custom just mentioned, the circumstance was deliberately obscured in the present account. The death of Segub may have been due to an accident in the setting up of the gates. In any event, tradition finally yoked the death of Hiel\'s oldest and youngest sons with a curse said to have been pronounced by Joshua on the man that should venture to rebuild Jericho (<a onClick="return mV(\'Jos\',6,26);">Jos 6:26</a>).<P>(2) Son of Hezron and father of Jair (<a onClick="return mV(\'1Ch\',2,21);">1Ch 2:21</a>).``197';
isbe[7789]='Seir`se\'-ir:<P>(1) (har se\'-ir, "Mt. Seir" (<a onClick="return mV(\'Gen\',14,6);">Ge 14:6</a>, etc.), \'erets se\'-ir (<a onClick="return mV(\'Gen\',32,3);">Ge 32:3</a>, etc.); to oros Seeir, ge Seeir): In <a onClick="return mV(\'Gen\',32,3);">Ge 32:3</a> "the land of Seir" is equated with "the field of Edom." The Mount and the Land of Seir are alternative appellations of the mountainous tract which runs along the eastern side of the Arabah, occupied by the descendants of Esau, who succeeded the ancient Horites (<a onClick="return mV(\'Gen\',14,6);">Ge 14:6</a>; <a onClick="return mV(\'Gen\',36,20);">36:20</a>), "cave-dwellers," in possession. For a description of the land see <a href="./study/isbe/search.html?string=EDOM">EDOM</a>.<P>(2) (har se\'ir; Codex Vaticanus Assar; Codex Alexandrinus Seeir): A landmark on the boundary of Judah (<a onClick="return mV(\'Jos\',15,10);">Jos 15:10</a>), not far from Kiriath-jearim and Chesalon. The name means "shaggy," and probably here denoted a wooded height. It may be that part of the range which runs northeast from Saris by Karyat el-\'Anab and Biddu to the plateau of el-Jib. Traces of an ancient forest are still to be seen here.``54';
isbe[7790]='Seirah`se-i\'-ra, se\'-i-ra (ha-se\'irah; Codex Vaticanus Seteirotha; Codex Alexandrinus Seeirotha; the King James Version, Seirath): The place to which Ehud escaped after his assassination of Eglon, king of Moab (<a onClick="return mV(\'Jdg\',3,26);">Jud 3:26</a>). The name is from the same root as the foregoing, and probably applied to some shaggy forest. The quarries by which he passed are said to have been by Gilgal (<a onClick="return mV(\'Jdg\',3,19);">Jud 3:19</a>), but there is nothing to guide us to an identification. Eusebius, in Onomasticon, gives the name, but no indication of the site.``1';
isbe[7791]='Seirath`se-i\'-rath, se\'-i-rath.`<a href="./study/isbe/search.html?string=SEIRAH">SEIRAH</a>`1';
isbe[7792]='Sela`se\'-la (sela\', ha-cela\' (with the article); petra, he petra; the King James Version Selah (<a onClick="return mV(\'2Ki\',14,7);">2Ki 14:7</a>)): English Versions of the Bible renders this as the name of a city in <a onClick="return mV(\'2Ki\',14,7);">2Ki 14:7</a>; <a onClick="return mV(\'Isa\',16,1);">Isa 16:1</a>. In <a onClick="return mV(\'Jdg\',1,36);">Jud 1:36</a>; <a onClick="return mV(\'2Ch\',25,12);">2Ch 25:12</a>; and <a onClick="return mV(\'Oba\',1,3);">Ob 1:3</a>, it translates literally, "rock"; but the Revised Version margin in each case "Sela." It is impossible to assume with Hull (HD B, under the word) that this name, when it appears in Scripture, always refers to the capital of Edom, the great city in Wady Musa. In <a onClick="return mV(\'Jdg\',1,36);">Jud 1:36</a> its association with the Ascent of Akrabbim shuts us up to a position toward the southwestern end of the Dead Sea. Probably in that case it does not denote a city, but some prominent crag. Moore ("Judges," ICC, 56), following Buhl, would identify it with es-Safieh, "a bare and dazzlingly white sandstone promontory 1,000 ft. high, east of the mud fiats of es-Sebkah, and 2 miles south of the Dead Sea." A more probable identification is a high cliff which commands the road leading from Wady el-Milh, "valley of Salt," to Edom, over the pass of Akrabbim. This was a position of strategic importance, and if fortified would be of great strength. (In this passage "Edomites" must be read for "Amorites.") The victory of Amaziah was won in the Valley of Salt. He would naturally turn his arms at once against this stronghold (<a onClick="return mV(\'2Ki\',14,7);">2Ki 14:7</a>); and it may well be the rock from the top of which he hurled his prisoners (<a onClick="return mV(\'2Ch\',25,12);">2Ch 25:12</a>). He called it Jokteel, a name the meaning of which is obscure. Possibly it is the same as Jekuthiel (<a onClick="return mV(\'1Ch\',4,18);">1Ch 4:18</a>), and may mean "preservation of God" (OHL, under the word). No trace of this name has been found. The narratives in which the place is mentioned put identification with Petra out of the question.<P>"The rock" (the Revised Version margin "Sela") in <a onClick="return mV(\'Oba\',1,3);">Ob 1:3</a>, in the phrase "thou that dwellest in the clefts of the rock." is only a vivid and picturesque description of Mt. Edom. "The purple mountains into which the wild sons of Esau clambered run out from Syria upon the desert, some hundred miles by twenty, of porphyry and red sandstone. They are said to be the finest rock scenery in the world. \'Salvator Rosa never conceived so savage and so suitable a haunt for banditti.\'...The interior is reached by defiles so narrow that two horsemen may scarcely ride abreast, and the sun is shut out by the overhanging rocks....Little else than wild fowls\' nests are, the villages: human eyries perched on high shelves or hidden away in caves at the ends of the deep gorges" (G. A. Smith. The Book of the Twelve Prophets. II. 178f).<P>In <a onClick="return mV(\'Isa\',16,1);">Isa 16:1</a>; <a onClick="return mV(\'Isa\',42,11);">42:11</a> the Revised Version (British and American), perhaps we have a reference to the great city of Petra. Josephus (Ant., IV, vii, 1) tells us that among the kings of the Midianites who fell before Moses was one Rekem, king of Rekem (akre, or rekeme), the city deriving its name from its founder. This he says was the Arabic name; the Greeks called it Petra. Eusebius, Onomasticon says Petra is a city of Arabia in the land of Edom. It is called Jechthoel; but the Syrians call it Rekem. Jokteel, as we have seen, must be sought elsewhere. There can be no doubt that Josephus intended the city in Wady Musa. Its Old Testament name was Bozrah (<a onClick="return mV(\'Amo\',1,12);">Am 1:12</a>, etc.). Wetzstein (Excursus in Delitzsch\'s Isaiah, 696ff) hazards the conjecture that the complete ancient nine was Bozrat has-Sela, "Bozrah of the Rock."<P>This "rose-red city half as old as Time"<P>Sela was for long difficult of access, and the attempt to visit it was fraught with danger. In recent years, however, it has been seen by many tourists and exploring parties. Of the descriptions written the best is undoubtedly that of Professor Dalman of Jerusalem (Petra und seine Felsheiligtumer, Leipzig, 1908). An excellent account of this wonderful city, brightly and interestingly written, will be found in Libbey and Hoskins\' book (The Jordan Valley and Petra, New York and London, 1905; see also National Geographic Magazine, May,1907,Washington, D.C.). The ruins lie along the sides of a spacious hollow surrounded by the many-hued cliffs of Edom, just before they sink into the Arabah on the west. It is near the base of Jebel Harun, about 50 miles from the Dead Sea, and just north of the watershed between that sea and the Gulf of Akaba. The valley owes its modern name, Wady Musa, "Valley of Moses," to its connection with Moses in Mohammedan legends. While not wholly inaccessible from other directions, the two usual approaches are that from the southwest by a rough path, partly artificial, and that from the east. The latter is by far the more important. The valley closes to the east, the only opening being through a deep and narrow defile, called the Sik, "shaft," about a mile in length. In the bottom of the Sik flows westward the stream that rises at \'Ain Musa, east of the cleft is the village of Elji, an ancient site, corresponding to Gaia of Eusebius (Onomasticon). Passing this village, the road threads its way along the shadowy winding gorge, overhung by lofty cliffs. When the valley is reached, a sight of extraordinary beauty and impressiveness opens to the beholder. The temples, the tombs, theater, etc., hewn with great skill and infinite pains from the living rock, have defied to an astonishing degree the tooth of time, many of the carvings being as fresh as if they had been cut yesterday. An idea of the scale on which the work was done may be gathered from the size of theater, which furnished accommodation for no fewer than 3,000 spectators.<P>Such a position could not have been overlooked in ancient times; and we are safe to assume that a city of importance must always have existed here. It is under the Nabateans, however, that Petra begins to play a prominent part in history. This people took possession about the end of the 4th century BC, and continued their sway until overcome by Hadrian, who gave his own name to the city—Hadriana. This name, however, soon disappeared. Under the Romans Petra saw the days of her greatest splendor.<P>According to old tradition Paul visited Petra when he went into Arabia (<a onClick="return mV(\'Gal\',1,17);">Ga 1:17</a>). Of this there is no certainty; but Christianity was early introduced, and the city became the seat of a bishopric. Under the Nabateans she was the center of the great caravan trade of that time. The merchandise of the East was brought hither; and hence, set out the caravans for the south, the west, and the north. The great highway across the desert to the Persian Gulf was practically in her hands. The fall of the Nabatean power gave Palmyra her chance; and her supremacy in the commerce of Northern Arabia dates from that time. Petra shared in the declining fortunes of Rome; and her death blow was dealt by the conquering Moslems, who desolated Arabia Petrea in 629-32 AD. The place now furnishes a retreat for a few poor Bedawy families.``54';
isbe[7793]='Sela-Hammahlekoth`se-la-ha-ma\'-le-koth, -koth (cela\'ha-machleqoth; petra he meristheisa): "The rock of divisions (or, escape)" (<a onClick="return mV(\'1Sa\',23,28);">1Sa 23:28</a> margin). "Saul...pursued after David in the wilderness of Maon. And Saul went on this side of the mountain, and David and his men on that side of the mountain: and David made haste to get away for fear of Saul" (<a onClick="return mV(\'1Sa\',23,25,26);">1Sa 23:25,26</a>). The name seems to survive in Wady Malaki, "the great gorge which breaks down between Carmel and Maon eastward, with vertical cliffs" (PEF, III, 314, Sh. XXI).``1';

isbe[7796]='Selemia`sel-e-mi\'-a: One of the swift scribes whose services Ezra was commanded to secure (2Esdras 14:24). The name is probably identical with <a href="./study/isbe/search.html?string=SELEMIAS">SELEMIAS</a> of 1Esdras 9:34 (which see).``1';
isbe[7797]='Selemias`sel-e-mi\'-as (Selemias): One of those who put away their "strange wives" (1Esdras 9:34) = "Shelemiah". in <a onClick="return mV(\'Ezr\',10,39);">Ezr 10:39</a>, and probably identical with "Selemia" in 2Esdras 14:24.``1';
isbe[7798]='Seleucia`se-lu\'-shi-a (Seleukia): The seaport of Antioch from which it <span class="noTag">is</span> 16 miles distant. It is situated 5 miles north of the mouth of the Orontes, in the northwestern corner of a fruitful plain at the base of Mt. Rhosus or Pieria, the modern Jebel Musa, a spur of the Amanus Range. Built by Seleucus Nicator (died 280 BC) it was one of the Syrian Tetrapolis, the others being Apameia, Laodicea and Antioch. The city was protected by nature on the mountain side, and, being strongly fortified on the south and west, was considered invulnerable and the key to Syria (Strabo 751; Polyb. v.58). It was taken, however, by Ptolemy Euergetes (1Macc 11:8) and remained in his family till 219 BC, when it was recovered for the Seleucids by Antiochus the Great, who then richly adorned it. Captured again by Ptolemy Philometor in 146 BC, it remained for a short time in the hands of the Egyptians. Pompey made it a free city in 64 BC in return for its energy in resisting Tigranes (Pliny, NH, v.18), and it was then greatly improved by the Romans, so that in the 1st century AD it was in a most flourishing condition.<P>On their first missionary journey Paul and Barnabas passed through it (<a onClick="return mV(\'Act\',13,4);">Ac 13:4</a>; <a onClick="return mV(\'Act\',14,26);">14:26</a>), and though it is not named in <a onClick="return mV(\'Act\',15,30,39);">Ac 15:30,39</a>, this route is again implied; while it is excluded in <a onClick="return mV(\'Act\',15,3);">Ac 15:3</a>.<P>The ruins are very extensive and cover the whole space within the line of the old walls, which shows a circuit of four miles. The position of the Old Town, the Upper City and the suburbs may still be identified, as also that of the Antioch Gate, the Market Gate and the King\'s Gate, which last leads to the Upper City. There are rock-cut tombs, broken statuary and sarcophagi at the base of the Upper City, a position which probably represents the burial place of the Seleucids. The outline of a circus or amphitheater can also be traced, while the inner harbor is in perfect condition and full of water. It <span class="noTag">is</span> 2,000 ft. long by 1,200 ft. broad, and covers 47 acres, being oval or pear-shaped. The passage seaward, now silted up, was protected by two strong piers or moles, which are locally named after Barnabas and Paul. The most remarkable of the remains, however, is the great water canal behind the city, which the emperor Constantius cut through the solid rock in 338 AD. It <span class="noTag">is</span> 3,074 ft. long, has an average breadth of 20 ft., and is in some places 120 ft. deep. Two portions of 102 and 293 ft. in length are tunneled. The object of the work was clearly to carry the mountain torrent direct to the sea, and so protect the city from the risk of flood during the wet season.<P>Church synods occasionally met in Seleucia in the early centuries, but it gradually sank into decay, and long before the advent of Islam it had lost all its significance.``23';
isbe[7799]='Seleucidae`se-lu\'-si-de.`<a href="./study/isbe/search.html?string=SELEUCUS">SELEUCUS</a>`1';
isbe[7800]='Seleucus`se-lu\'-kus (Seleukos):<P>(1) Seleucus I (Nicator, "The Conqueror"), the founder of the Seleucids or House of Seleucus, was an officer in the grand and thoroughly equipped army, which was perhaps the most important part of the inheritance that came to Alexander the Great from his father, Philip of Macedon. He took part in Alexander\'s Asiatic conquests, and on the division of these on Alexander\'s death he obtained the satrapy of Babylonia. By later conquests and under the name of king, which he assumed in the year 306, he became ruler of Syria and the greater part of Asia Minor. His rule extended from 312 to 280 BC, the year of his death; at least the Seleucid era which seems to be referred to in 1Macc 1:16 is reckoned from Seleucus I, 312 BC to 65 BC, when Pompey reduced the kingdom of Syria to a Roman province. He followed generally the policy of Alexander in spreading Greek civilization. He founded Antioch and its port Seleucia, and is said by Josephus (Ant., XII, iii, 1) to have conferred civic privileges upon the Jews. The reference in <a onClick="return mV(\'Dan\',11,5);">Da 11:5</a> is usually understood to be to this ruler.<P>(2) Seleucus II (Callinicus, "The Gloriously Triumphant"), who reigned from 246 to 226 BC, was the son of Antiochus Soter and is "the king of the north" in <a onClick="return mV(\'Dan\',11,\'7-9\');">Da 11:7-9</a>, who was expelled from his kingdom by Ptolemy Euergetes.<P>(3) Seleucus III (Ceraunus, "Thunderbolt"), son of Seleucus II, was assassinated in a campaign which he undertook into Asia Minor. He had a short reign of rather more than 2 years (226-223 BC) and is referred to in <a onClick="return mV(\'Dan\',11,10);">Da 11:10</a>.<P>(4) Seleucus IV (Philopator, "Fond of his Father") was the son and successor of Antiochus the Great and reigned from 187 to 175 BC. He is called "King of Asia" (2Macc 3:3), a title claimed by the Seleucids even after their serious losses in Asia Minor (see 1Macc 8:6; 11:13; 12:39; 13:32). He was present at the decisive battle of Magnesia (190 BC). He was murdered by <a href="./study/isbe/search.html?string=HELIODORUS">HELIODORUS</a> (which see), one of his own courtiers whom he had sent to plunder the Temple (2Macc 3:1-40; <a onClick="return mV(\'Dan\',11,20);">Da 11:20</a>).<P>For the connection of the above-named Seleucids with the "ten horns" of <a onClick="return mV(\'Dan\',7,24);">Da 7:24</a>, the commentators must be consulted.<P>Seleucus V (125-124 BC) and Seleucus VI (95-93 BC) have no connection with the sacred narrative.``79';
