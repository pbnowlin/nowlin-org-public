isbe = [];

isbe[7701]='Scattered Abroad`skat\'-erd a-brod\'.`<a href="./study/isbe/search.html?string=DISPERSION">DISPERSION</a>`1';
isbe[7702]='Scent`sent:<P>(1) In <a onClick="return mV(\'Hsa\',14,7);">Ho 14:7</a>, "The scent (margin "his memorial") thereof shall be as the wine of Lebanon." "Scent" is used for zekher (so Massoretic Text, but the pointing is uncertain), properly "memorial," whence the Revised Version margin. The English translation comes through the Septuagint which took z-k-r as "offering of sweet savor," and so "sweet savor." For the "wine of Lebanon" see <a href="./study/isbe/search.html?string=WINE">WINE</a>. If this translation is not right, the alternative is "memorial" in the sense of "renown."<P>(2) <a onClick="return mV(\'Job\',14,9);">Job 14:9</a>; <a onClick="return mV(\'Jer\',48,11);">Jer 48:11</a> for reach, "odor." "Scent" of the water in <a onClick="return mV(\'Job\',14,9);">Job 14:9</a> is poetic for "contact with."<P>(3) The Wisdom of Solomon 11:18 the King James Version has "filthy scents of scattered smoke," where "scent" is used in the obsolete sense of "disagreeable odor." The translation is, however, very loose, and "scents" is a gloss; the Revised Version (British and American) "noisome smoke."``48';
isbe[7703]='Sceptre; Scepter`sep\'-ter (shebheT, sharbhiT, expanded form in <a onClick="return mV(\'Est\',4,11);">Es 4:11</a>; <a onClick="return mV(\'Est\',5,2);">5:2</a>; <a onClick="return mV(\'Est\',8,4);">8:4</a>; rhabdos (Additions to Esther 15:11; <a onClick="return mV(\'Hbr\',1,8);">Heb 1:8</a>), skeptros): A rod or mace used by a sovereign as a symbol of royal authority. The Hebrew shebhet is the ordinary word for rod or club, and is used of an ordinary rod (compare <a onClick="return mV(\'2Sa\',7,14);">2Sa 7:14</a>), of the shepherd\'s crook (<a onClick="return mV(\'Psa\',23,4);">Ps 23:4</a>), scribe\'s baton or marshal\'s staff (<a onClick="return mV(\'Jdg\',5,14);">Jud 5:14</a>), as well as of the symbol of royalty. Its symbolism may be connected with the use of the shebhet for protection (<a onClick="return mV(\'2Sa\',23,21);">2Sa 23:21</a>; <a onClick="return mV(\'Psa\',23,4);">Ps 23:4</a>) or for punishment (<a onClick="return mV(\'Isa\',10,24);">Isa 10:24</a>; <a onClick="return mV(\'Isa\',30,31);">30:31</a>). It is used with reference to the royal line descended from Judah (<a onClick="return mV(\'Gen\',49,10);">Ge 49:10</a>), and figuratively of sovereignty in general and possibly of conquest (<a onClick="return mV(\'Num\',24,17);">Nu 24:17</a>, in Israel; <a onClick="return mV(\'Isa\',14,5);">Isa 14:5</a>, in Babylonia; <a onClick="return mV(\'Amo\',1,5,8);">Am 1:5,8</a>, in Syria, among Philistines; <a onClick="return mV(\'Zec\',10,11);">Zec 10:11</a>, in Egypt), the disappearance or cutting off of him that holdeth the scepter being tantamount to loss of national independence. The kingship of Yahweh is spoken of as a scepter (<a onClick="return mV(\'Psa\',45,6);">Ps 45:6 (Hebrew verse 7)</a> quoted in <a onClick="return mV(\'Hbr\',1,8);">Heb 1:8</a>). The manner of using the scepter by an oriental monarch is suggested in the act of Ahasuerus, who holds it out to Esther as a mark of favor. The subject touches the top of it, perhaps simply as an act of homage or possibly to indicate a desire to be heard. The scepter of Ahasuerus is spoken of as "golden" (<a onClick="return mV(\'Est\',5,2);">Es 5:2</a>), but it is probable that scepters were ordinarily made of straight branches (mateh) of certain kinds of vines (<a onClick="return mV(\'Eze\',19,11,14);">Eze 19:11,14</a>).<P>It is sometimes difficult to determine whether the word shebhet is used in figurative passages in the sense of scepter or merely in the ordinary sense of staff (e.g. <a onClick="return mV(\'Psa\',125,3);">Ps 125:3</a>, the King James Version "rod," the Revised Version (British and American) and the American Standard Revised Version "sceptre" (of the wicked); <a onClick="return mV(\'Psa\',2,9);">Ps 2:9</a>, "rod of iron"; <a onClick="return mV(\'Pro\',22,8);">Pr 22:8</a>, "rod of his wrath"). Another word, mechoqeq, literally, "prescribing" (person or thing), formerly translated uniformly "lawgiver," is now generally taken, on the basis of parallelism, to mean "sceptre" in four poetic passages (<a onClick="return mV(\'Gen\',49,10);">Ge 49:10</a>, "ruler\'s staff" to avoid repetition; <a onClick="return mV(\'Num\',21,18);">Nu 21:18</a>; <a onClick="return mV(\'Psa\',60,7);">Ps 60:7</a>; <a onClick="return mV(\'Psa\',108,8);">108:8</a>).``81';
isbe[7704]='Sceva`se\'-va (Skeua): A Jew, a chief priest, resident in Ephesus, whose seven sons were exorcists (<a onClick="return mV(\'Act\',19,14);">Ac 19:14</a>). Ewald regards the name as being Hebrew shekhabhyah. He was not an officiating priest, as there were only synagogues in Asia Minor. He may have belonged to a high-priestly family, or perhaps at one time he had been at the head of one of the 24 courses in the temple.<P>In the narrative the construction is loose. There were seven sons (<a onClick="return mV(\'Act\',19,14);">Ac 19:14</a>), and it would appear (<a onClick="return mV(\'Act\',19,16);">Ac 19:16</a>) that in this particular case all were present. But (<a onClick="return mV(\'Act\',19,16);">Ac 19:16</a>) the demon-possessed man over-powered "both of them." Textus Receptus of the New Testament gets over the difficulty by omitting "both," but Codices Sinaiticus, Alexandrinus, Vaticanus, Bezae, so Tischendorf, Westcott and Hort, von Soden, and the best critics, retain the difficult reading. The explanation is that <a onClick="return mV(\'Act\',19,14);">Ac 19:14</a> states the custom: "who did this" being hoi touto poiountes, "who used to do this." <a onClick="return mV(\'Act\',19,15);">Ac 19:15</a> and 16 state a particular case in which two took part, but the incident is introduced in a careless manner.<P>Ewald would translate amphoteron as "in both sides," but this is impossible. Baur understood "disciples" for "sons." Codex Bezae and Syriac have an interesting expansion which Blass considers original (<a onClick="return mV(\'Act\',19,14);">Ac 19:14</a>): "Among whom also the sons (Syriac \'seven\') of a certain Sceva, a priest, wished to do the same, (who) were in the custom of exorcising such. And entering into the demon-possessed man they began to call upon the Name, saying, \'We charge you by Jesus whom Paul preaches to come out.\' "``78';
isbe[7705]='Schism`siz\'-m (schisma): Only in <a onClick="return mV(\'1Cr\',12,25);">1Co 12:25</a>. The same Greek word, literally, "a split," is translated "rent" in <a onClick="return mV(\'Mat\',9,16);">Mt 9:16</a>; <a onClick="return mV(\'Mar\',2,21);">Mr 2:21</a>; and "division" in <a onClick="return mV(\'Jhn\',7,43);">Joh 7:43</a>; <a onClick="return mV(\'Jhn\',9,16);">9:16</a>; <a onClick="return mV(\'Jhn\',10,19);">10:19</a>. It designates "a separation," not from, but within, the church, interfering with the harmonious coordination and cooperation of the members described in the preceding verses (<a onClick="return mV(\'1Cr\',12,18);">1Co 12:18</a>). The ecclesiastical meaning is that of a break from a church organization, that may or may not be connected with a doctrinal dissent.``1';
isbe[7706]='School`skool (schole).`<a href="./study/isbe/search.html?string=TYRANNUS">TYRANNUS</a>`1';
isbe[7707]='Schoolmaster`skool\'-mas-ter: <a onClick="return mV(\'Gal\',3,24);">Ga 3:24</a>f the King James Version reads: "The law was our schoolmaster to bring us unto Christ, that we might be justified by faith. But after that faith is come, we are no longer under a schoolmaster." "Schoolmaster" is a translation of paidagogos, literally, "child-leader." This paidagagos was not a teacher but a slave, to whom in wealthy families the general oversight of a boy was committed. It was his duty to accompany his charge to and from school, never to lose sight of him in public, to prevent association with objectionable companions, to inculcate moral lessons at every opportunity, etc. He was a familiar figure in the streets, and the (sour) "face of paidagogos" and "to follow one like a paidagogos" were proverbial expressions. Naturally, to the average boy the paidagogos must have represented the incorporation of everything objectionable. Hence, Paul\'s figure may be paraphrased: "The law was a paidagogos, necessary but irksome, to direct us until the time of Christ. Then was the time of our spiritual coming-of-age, so that the control of the paidagogos ceased." The word paidagogos was taken over into Aramaic at an early date, and Paul\'s language; which is hardly that of a mere adult observer, suggests that he had had personal experience with the institution. Wealthy and intensely orthodox Jewish parents living in a Gentile city may well have adopted such a precaution for the protection of their children.<P>No English word renders paidagogos adequately. "Schoolmaster" is quite wrong, but Revised Version\'s "tutor" (compare <a onClick="return mV(\'1Cr\',4,15);">1Co 4:15</a>) is little better in modern English.``48';
isbe[7708]='Schools of the Prophets``<a href="./study/isbe/search.html?string=EDUCATION">EDUCATION</a>; <a href="./study/isbe/search.html?string=PROPHETS">PROPHETS</a>`1';
isbe[7709]='Science`si\'-ens: This word as found in the King James Version means simply "knowledge." "Science" occurs in the King James Version only in two places, <a onClick="return mV(\'Dan\',1,4);">Da 1:4</a>, "children...understanding science" (yodhe\'edha\'ath, "those who understand science"). The meaning of the term here is "knowledge," "wisdom." The only other occurrence of "science" is in the New Testament (<a onClick="return mV(\'1Ti\',6,20);">1Ti 6:20</a>, "avoiding...oppositions of science falsely so called," tes pseudonumou gnoseos, "the falsely called gnosis"). "Science" is the translation of the Greek gnosis, which in the New Testament is usually rendered "knowledge." The science here referred to was a higher knowledge of Christian and divine things, which false teachers alleged that they possessed, and of which they boasted. It was an incipient form of Gnosticism, and it prevailed to a considerable extent in the churches of proconsular Asia, e.g. in Colosse and Ephesus. Timothy is put on his guard against the teaching of this gnosis falsely so called, for it set itself in opposition to the gospel.<P>"Science" in the modern sense of the word, as the discovery and orderly classification and exposition of the phenomena and of the laws of Nature, is not found either in the Old Testament or the New Testament unless the passage in Daniel be interpreted as meaning the scientific knowledge which the learned men of Babylon possessed of mathematics and astronomy, etc. See also <a onClick="return mV(\'Act\',7,22);">Ac 7:22</a>. To the Hebrew mind all natural phenomena meant the working of the hand of God in the world, directly and immediately, without the intervention of any secondary laws.`<a href="./study/isbe/search.html?string=GNOSTICISM">GNOSTICISM</a>`155';
isbe[7710]='Scimitar`sim\'-i-tar, -ter (akindke): Formerly given as "fauchion" in the King James Version Judith 13:6; 16:9, the weapon which Judith took down from the rail of the bed at Holofernes\' head, and with which she severed his head from his body.``1';
isbe[7711]='Scoff; Scoffer`skof, skof\'-er: The verb indicates the manifestation of contempt by insulting words or actions; it combines bitterness with ridicule. It is much more frequent in the Revised Version (British and American) than in the King James Version, replacing "scorn" of the latter in <a onClick="return mV(\'Psa\',1,1);">Ps 1:1</a>; <a onClick="return mV(\'Pro\',1,22);">Pr 1:22</a>, etc. "Scorn" refers rather to an inner emotion based on a sense of superiority; "scoff," to the outward expression of this emotion.``1';
isbe[7712]='Scorn`skorn: Fox Talbot connects this English word with the Danish skarn, "dirt," "ordure" "mud," "mire." As distinguished from such words as "mock," "deride," "scoff," all of which refer specifically to the various ways in which scorn finds outward expression, scorn itself denotes a subjective state or reaction.<P>Further, this state or reaction is not simple but complex. It includes a sense of superiority, resentment, and aversion. This reaction occurs when one is confronted with a person or a proposition that by challenging certain things for itself evokes a vivid sense of one\'s own superiority and awakens mingled resentment, repulsion and contempt by the hollowness of its claims and its intrinsic inferiority or worse. Scorn is a hotter, fiercer emotion than disdain or contempt. It is obvious that scorn may—indeed, it not uncommonly does—arise in connection with an not grounded, arrogant sense of self-esteem.<P>The word, outside of the phrase "laugh to scorn," is found only in the Old Testament, and then only 4 times (<a onClick="return mV(\'Est\',3,6);">Es 3:6</a>; King James Version, <a onClick="return mV(\'Psa\',44,13);">Ps 44:13</a>; <a onClick="return mV(\'Psa\',79,4);">79:4</a>; <a onClick="return mV(\'Hab\',1,10);">Hab 1:10</a>), and it represents three different Hebrew words for none of which it is a suitable rendering. The two words "thought scorn" in <a onClick="return mV(\'Est\',3,6);">Es 3:6</a> represent but one in Hebrew, namely, bazah, for which "disdain" would be a nearer equivalent. In <a onClick="return mV(\'Hab\',1,10);">Hab 1:10</a> (the King James Version) the word translated "scorn" is micchaq, "an object of laughter," "laughing-stock." In <a onClick="return mV(\'Psa\',44,13);">Ps 44:13</a>; <a onClick="return mV(\'Psa\',79,4);">79:4</a> the Hebrew word is la\'agh from a root, probably meaning "to stutter," "stammer," for which "mocking" is a better English equivalent. In the King James Version <a onClick="return mV(\'Job\',34,7);">Job 34:7</a>; <a onClick="return mV(\'Psa\',123,4);">Ps 123:4</a>, la\'agh is rendered "scorning". (the rendering given in <a onClick="return mV(\'Pro\',1,22);">Pr 1:22</a> to latson, a word from a totally different root and one much more nearly approximating the fundamental idea of the English word "Scorn." In <a onClick="return mV(\'Pro\',29,8);">Pr 29:8</a> and <a onClick="return mV(\'Isa\',28,14);">Isa 28:14</a> latson is rendered "scornful").<P>As a verb the word is the translation given to la\'agh, "to mock" (<a onClick="return mV(\'2Ki\',19,21);">2Ki 19:21</a> parallel <a onClick="return mV(\'Isa\',37,22);">Isa 37:22</a> <a onClick="return mV(\'Job\',22,19);">Job 22:19</a>; <a onClick="return mV(\'Neh\',2,19);">Ne 2:19</a>; <a onClick="return mV(\'Psa\',22,7);">Ps 22:7</a>, "all laugh to scorn"); qalas = "to scoff" (<a onClick="return mV(\'Eze\',16,31);">Eze 16:31</a>, margin "Greek: scoffeth," but text still "scorneth"); for the noun tsechoq, "laughter" (<a onClick="return mV(\'Eze\',23,32);">Eze 23:32</a>); sachaq = to laugh," "laugh at" (<a onClick="return mV(\'Job\',39,7,18);">Job 39:7,18</a>; <a onClick="return mV(\'2Ch\',30,10);">2Ch 30:10</a>), with the noun sechoq, "laugh to scorn" (the Revised Version (British and American) "laughing-stock," <a onClick="return mV(\'Job\',12,4);">Job 12:4</a>); luts = "to scoff" (as used in ethical and religious connections) (<a onClick="return mV(\'Job\',16,20);">Job 16:20</a>; <a onClick="return mV(\'Pro\',3,34);">Pr 3:34</a>; <a onClick="return mV(\'Pro\',9,12);">9:12</a>, all "scoff" in the Revised Version (British and American)); in <a onClick="return mV(\'Pro\',19,28);">Pr 19:28</a> the Revised Version (British and American), not happily, "mock at." the Revised Version (British and American) is warranted in substituting "scoff" for "scorn" because the context indicates some form of outward expression of the scorn.<P>The Revised Version (British and American) always (except <a onClick="return mV(\'Job\',12,4);">Job 12:4</a>; Sirach 6:4; 1Macc 10:70) retains "laugh to scorn" (<a onClick="return mV(\'2Ki\',19,21);">2Ki 19:21</a>; <a onClick="return mV(\'2Ch\',30,10);">2Ch 30:10</a>; <a onClick="return mV(\'Neh\',2,19);">Ne 2:19</a>; <a onClick="return mV(\'Job\',22,19);">Job 22:19</a>; <a onClick="return mV(\'Psa\',22,7);">Ps 22:7</a>; <a onClick="return mV(\'Isa\',37,22);">Isa 37:22</a>; <a onClick="return mV(\'Eze\',16,31);">Eze 16:31</a>; <a onClick="return mV(\'Eze\',23,32);">23:32</a>; 2Es 2:21</a>; Jdt 12:12; Wis 4:18; Sir 7:11; 13:7; 20:17; <a onClick="return mV(\'Mat\',9,24);">Mt 9:24</a>; <a onClick="return mV(\'Mar\',5,40);">Mr 5:40</a>; <a onClick="return mV(\'Luk\',8,53);">Lu 8:53</a>). The verb in Apocrypha and the New Testament is usually katagelao, but in The Wisdom of Solomon 4:1 ekgelao; in Sirach 13:7 katamokomai; and in 2Esdras 2:21 inrideo. In addition "scorn" is retained in <a onClick="return mV(\'Est\',3,6);">Es 3:6</a>; <a onClick="return mV(\'Job\',39,7,18);">Job 39:7,18</a>; 2Es 8:56 (contemno). In <a onClick="return mV(\'Pro\',19,28);">Pr 19:28</a> "scorn" is changed to "mock at" but elsewhere invariably to "scoff."<P>Scorner is the translation of the participle of luts and once of the participle of latsats. For "scorner" the Revised Version (British and American) everywhere substitutes—properly—"scoffer." Outside of Proverbs (and <a onClick="return mV(\'Hsa\',7,5);">Ho 7:5</a>) the word is to be found only in <a onClick="return mV(\'Psa\',1,2);">Ps 1:2</a>. The force of the word has been well indicated by Cheyne, who says that the "scorner (scoffer) is one who despises that which is holy and avoids the company of the noble \'wise men,\' but yet in his own vain way seeks for truth; his character is marked by arrogance as that of the wise is characterized by devout caution."``116';
isbe[7713]='Scorpion`skor\'-pi-un (aqrabh; compare Arabic aqrab, "scorpion"; ma\'aleh \'aqrabbim, "the ascent of Akrabbim"; skorpios. Note that the Greek and Hebrew may be akin; compare, omitting the vowels, \'krb and skrp): In <a onClick="return mV(\'Deu\',8,15);">De 8:15</a>, we have, "who led thee through the great and terrible wilderness, wherein were fiery serpents (nachash saraph) and scorpions (\'aqrabh)." Rehoboam (<a onClick="return mV(\'1Ki\',12,11);">1Ki 12:11,14</a>; <a onClick="return mV(\'2Ch\',10,11,14);">2Ch 10:11,14</a>) says, "My father chastised you with whips, but I will chastise you with scorpions." Ezekiel is told to prophesy to the children of Israel (2:6), and "Be not afraid of them, neither be afraid of their words, though briers and thorns are with thee, and thou dost dwell among scorpions." "The ascent of Akrabbim," the north end of Wadi-ul-\'Arabah, south of the Dead Sea, is mentioned as a boundary 3 times (<a onClick="return mV(\'Num\',34,4);">Nu 34:4</a>; <a onClick="return mV(\'Jos\',15,3);">Jos 15:3</a>; <a onClick="return mV(\'Jdg\',1,36);">Jud 1:36</a>). Jesus says to the Seventy (<a onClick="return mV(\'Luk\',10,19);">Lu 10:19</a>), "Behold, I have given you authority to tread upon serpents and scorpions," and again in <a onClick="return mV(\'Luk\',11,12);">Lu 11:12</a> He says, "Or if he shall ask an egg, will he give him a scorpion?"<P>Note that we have here three doublets, the loaf and the stone, the fish and the serpent, and the egg and the scorpion, whereas in the passage in Matthew (<a onClick="return mV(\'Mat\',7,9);">7:9</A>f) we have only the loaf and stone and the fish and serpent. Encyclopedia Biblica (s.v. "Scorpion") ingeniously seeks to bring Luke into nearer agreement with Matthew by omitting from Luke the second doublet, i.e. the fish and the serpent, instancing several texts as authority for the omission, and reading opson, "fish," for oon, "egg."<P>In <a onClick="return mV(\'Rev\',9,\'2-10\');">Re 9:2-10</a> there come out of the smoke of the abyss winged creatures ("locusts," akrides) like war-horses with crowns of gold, with the faces of men, hair of women, teeth of lions, breastplates of iron, and with stinging tails like scorpions. In Ecclesiasticus 26:7 it is said of an evil wife, "He that taketh hold of her is as one that graspeth a scorpion." In 1Macc 6:51 we find mention of "pieces skorpidia, diminutive of skorpios to cast darts." In Plutarch skorpios is used in the same sense (Liddell and Scott, under the word skorpios.<P>In the passage cited from Deuteronomy, and probably also in the name "ascent of Akrabbim," we find references to the abundance of scorpions, especially in the warmer parts of the country. Though there is a Greek proverb, "Look for a scorpion under every stone," few would agree with the categorical statement of Tristram (NHB) that "every third stone is sure to conceal one." Nevertheless, campers and people sleeping on the ground need to exercise care in order to avoid their stings, which, though often exceedingly painful for several hours, are seldom fatal.<P>Scorpions are not properly insects, but belong with spiders, mites and ticks to the Arachnidae. The scorpions of Palestine are usually 2 or 3 inches long. The short cephalothorax bears a powerful pair of jaws, two long limbs terminating with pincers, which make the creature look like a small crayfish or lobster, and four pairs of legs. The rest of the body consists of the abdomen, a broad part continuous with the cephalothorax, and a slender part forming the long tail which terminates with the sting. The tail is usually carried curved over the back and is used for stinging; the prey into insensibility. Scorpions feed mostly on insects for which they lie in wait. The scorpion family is remarkable for having existed with very little change from the Silurian age to the present time.<P>It does not seem necessary to consider that the words of Rehoboam (<a onClick="return mV(\'1Ki\',12,11);">1Ki 12:11</a>, etc.) refer to a whip that was called a scorpion, but rather that as the sting of a scorpion is worse than the lash of a whip, so his treatment would be harsher than his father\'s.``37';
isbe[7714]='Scorpions, Chastising With`skor\'-pi-unz.`<a href="./study/isbe/search.html?string=PUNISHMENTS">PUNISHMENTS</a>; <a href="./study/isbe/search.html?string=SCORPION">SCORPION</a>`1';
isbe[7715]='Scourge; Scourging`skurj, skur\'-jing mastix, mastigoo; in <a onClick="return mV(\'Act\',22,25);">Ac 22:25</a> mastizo, in <a onClick="return mV(\'Mar\',15,15);">Mr 15:15</a> parallel <a onClick="return mV(\'Mat\',27,26);">Mt 27:26</a> phragelloo): A Roman implement for severe bodily punishment. Horace calls it horribile flagellum. It consisted of a handle, to which several cords or leather thongs were affixed, which were weighted with jagged pieces of bone or metal, to make the blow more painful and effective. It is comparable, in its horrid effects, only with the Russian knout. The victim was tied to a post (<a onClick="return mV(\'Act\',22,25);">Ac 22:25</a>) and the blows were applied to the back and loins, sometimes even, in the wanton cruelty of the executioner, to the face and the bowels. In the tense position of the body, the effect can easily be imagined. So hideous was the punishment that the victim usually fainted and not rarely died under it. Eusebius draws a horribly realistic picture of the torture of scourging (Historia Ecclesiastica, IV, 15). By its application secrets and confessions were wrung from the victim (<a onClick="return mV(\'Act\',22,24);">Ac 22:24</a>). It usually preceded capital punishment (Livy xxxiii.36). It was illegal to apply the flagallum to a Roman citizen (<a onClick="return mV(\'Act\',22,25);">Ac 22:25</a>), since the Porcian and Sempronian laws, 248 and 123 BC, although these laws were not rarely broken in the provinces (Tac. Hist. iv.27; Cic. Verr. v.6, 62; Josephus, BJ, II, xiv, 9). As among the Russians today, the number of blows was not usually fixed, the severity of the punishment depending entirely on the commanding officer. In the punishment of Jesus, we are reminded of the words of <a onClick="return mV(\'Psa\',129,3);">Ps 129:3</a>. Among the Jews the punishment of flagellation was well known since the Egyptian days, as the monuments abundantly testify. The word "scourge" is used in <a onClick="return mV(\'Lev\',19,20);">Le 19:20</a>, but the American Standard Revised Version translates "punished," the original word biqqoreth expressing the idea of investigation. <a onClick="return mV(\'Deu\',25,3);">De 25:3</a> fixed the mode of a Jewish flogging and limits the number of blows to 40. Apparently the flogging was administered by a rod. The Syrians reintroduced true scourging into Jewish life, when Antiochus Epiphanes forced them by means of it to eat swine\'s flesh (2Macc 6:30; 7:1). Later it was legalized by Jewish law and became customary (<a onClick="return mV(\'Mat\',10,17);">Mt 10:17</a>; <a onClick="return mV(\'Mat\',23,34);">23:34</a>; <a onClick="return mV(\'Act\',22,19);">Ac 22:19</a>; <a onClick="return mV(\'Act\',26,11);">26:11</a>), but the traditional limitation of the number of blows was still preserved. Says Paul in his "foolish boasting": "in stripes above measure," "of the Jews five times received I forty stripes save one," distinguishing it from the "beatings with rods," thrice repeated (<a onClick="return mV(\'2Cr\',11,\'23-25\');">2Co 11:23-25</a>).<P>The other Old Testament references (<a onClick="return mV(\'Job\',5,21);">Job 5:21</a>; <a onClick="return mV(\'Job\',9,23);">9:23</a>; <a onClick="return mV(\'Isa\',10,26);">Isa 10:26</a>; <a onClick="return mV(\'Isa\',28,15,18);">28:15,18</a> shot; <a onClick="return mV(\'Jos\',23,13);">Jos 23:13</a> shotet) are figurative for "affliction." Notice the curious mixture of metaphors in the phrase "over-flowing scourge" (<a onClick="return mV(\'Isa\',28,\'15-18\');">Isa 28:15-18</a>).``42';
isbe[7716]='Scrabble`skrab\'-l: Occurs only in <a onClick="return mV(\'1Sa\',21,13);">1Sa 21:13</a>, as the translation of tawah: "David...feigned himself mad and scrabbled on the doors of the gate." "To scrabble" (modern English "scrawl") is here to make unmeaning marks; tawah means "to make a mark" from taw, "a mark," especially as a cross (<a onClick="return mV(\'Eze\',9,4);">Eze 9:4</a>), a signature (<a onClick="return mV(\'Job\',31,35);">Job 31:35</a>, see the Revised Version (British and American)), the name of the Hebrew letter taw ("t") originally made in the form of a cross; the Revised Version margin has "made marks"; but Septuagint has tumpanizo, "to beat as a drum," which the Vulgate, Ewald, Driver and others follow ("beat upon" or "drummed on the doors of the city," which seems more probable).``1';
isbe[7717]='Screech Owl`skrech.`<a href="./study/isbe/search.html?string=NIGHT+MONSTER">NIGHT-MONSTER</a>`1';
isbe[7718]='Scribes`skribz: The existence of law leads necessarily to a profession whose business is the study and knowledge of the law; at any rate, if the law is extensive and complicated. At the time of Ezra and probably for some time after, this was chiefly the business of the priests. Ezra was both priest and scholar (copher). It was chiefly in the interest of the priestly cult that the most important part of the Pentateuch was written. The priests were therefore also in the first instance the scholars and the guardians of the Law; but in the course of time this was changed. The more highly esteemed the Law became in the eyes of the people, the more its study and interpretation became a lifework by itself, and thus there developed a class of scholars who, though not priests, devoted themselves assiduously to the Law. These became known as the scribes, that is, the professional students of the Law. During the Hellenistic period, the priests, especially those of the upper class, became tainted with the Hellenism of the age and frequently turned their attention to paganistic culture, thus neglecting the Law of their fathers more or less and arousing the scribes to opposition. Thus, the scribes and not the priests were now the zealous defenders of the Law, and hence, were the true teachers of the people. At the time of Christ, this distinction was complete. The scribes formed a solid profession which held undisputed sway over the thought of the people. In the New Testament they are usually called (grammateis), i.e. "students of the Scriptures," "scholars," corresponding to the Hebrew (copherim) = homines literati, those who make a profession of literary studies, which, in this case, of course, meant chiefly the Law. Besides this general designation, we also find the specific word (nomikoi), i.e. "students of the Law," "lawyers" (<a onClick="return mV(\'Mat\',22,35);">Mt 22:35</a>; <a onClick="return mV(\'Luk\',7,30);">Lu 7:30</a>; <a onClick="return mV(\'Luk\',10,25);">10:25</a>; <a onClick="return mV(\'Luk\',11,45,52);">11:45,52</a>; <a onClick="return mV(\'Luk\',14,3);">14:3</a>); and in so far as they not only know the Law but also teach it they are called (nomodidaskaloi), "doctors of the Law" (<a onClick="return mV(\'Luk\',5,17);">Lu 5:17</a>; <a onClick="return mV(\'Act\',5,34);">Ac 5:34</a>).<P>The extraordinary honors bestowed on these scholars on the part of the people are expressed in their honorary titles. Most common was the appellative "rabbi" = "my lord" (<a onClick="return mV(\'Mat\',23,7);">Mt 23:7</a> and otherwise). This word of polite address gradually became a title. The word "rabboni" (<a onClick="return mV(\'Mar\',10,51);">Mr 10:51</a>; <a onClick="return mV(\'Jhn\',20,16);">Joh 20:16</a>) is an extensive form, and was employed by the disciples to give expression to their veneration of Christ. In the Greek New Testament "rabbi" is translated as (kurie) (<a onClick="return mV(\'Mat\',8,2,6,8,21,25);">Mt 8:2,6,8,21,25</a> and otherwise), or (didaskale) (<a onClick="return mV(\'Mat\',8,19);">Mt 8:19</a> and otherwise), in Luke by (epistata) (<a onClick="return mV(\'Luk\',5,5);">Lu 5:5</a>; <a onClick="return mV(\'Luk\',8,24,45);">8:24,45</a>; <a onClick="return mV(\'Luk\',9,33,49);">9:33,49</a>; <a onClick="return mV(\'Luk\',17,13);">17:13</a>). Besides these, we find (pater), "father," and (kathegetes), "teacher" (<a onClick="return mV(\'Mat\',23,9);">Mt 23:9</a>f).<P>From their students the rabbis demanded honors even surpassing those bestowed on parents. "Let the honor of thy friend border on the honor of thy teacher, and the honor of thy teacher on the fear of God" (\'Abhoth 4 12). "The honor of thy teacher must surpass the honor bestowed on thy father; for son and father are both in duty bound to honor the teacher" (Kerithoth 6 9). Everywhere the rabbis demanded the position of first rank (<a onClick="return mV(\'Mat\',23,6);">Mt 23:6</a>f; <a onClick="return mV(\'Mar\',12,38);">Mr 12:38</a>f; <a onClick="return mV(\'Luk\',11,43);">Lu 11:43</a>; <a onClick="return mV(\'Luk\',20,46);">20:46</a>). Their dress equaled that of the nobility. They wore (stolai), "tunics," and these were the mark of the upper class.<P>Since the scribes were lawyers (see <a href="./study/isbe/search.html?string=LAWYER">LAWYER</a>), much of their time was occupied in teaching and in judicial functions, and both these activities must be pursued gratuitously. Rabbi Zadok said: "Make the knowledge of the Law neither a crown in which to glory nor a spade with which to dig." Hillel used to say: "He who employs the crown (of the Law) for external purposes shall dwindle." That the judge should not receive presents or bribes was written in the Law (<a onClick="return mV(\'Exd\',23,8);">Ex 23:8</a>; <a onClick="return mV(\'Deu\',16,19);">De 16:19</a>); hence, the Mishna said: "If anyone accept pay for rendering judgment, his judgment is null and void." The rabbis were therefore obliged to make their living by other means. Some undoubtedly had inherited wealth; others pursued a handicraft besides their study of the Law. Rabbi Gamaliel II emphatically advised the pursuit of a business in addition to the pursuit of the Law. It is well known that the apostle Paul kept up his handicraft even after he had become a preacher of the gospel (<a onClick="return mV(\'Act\',18,3);">Ac 18:3</a>; <a onClick="return mV(\'Act\',20,34);">20:34</a>; <a onClick="return mV(\'1Cr\',4,12);">1Co 4:12</a>; <a onClick="return mV(\'1Cr\',9,6);">9:6</a>; <a onClick="return mV(\'2Cr\',11,7);">2Co 11:7</a>; <a onClick="return mV(\'1Th\',2,9);">1Th 2:9</a>; <a onClick="return mV(\'2Th\',3,8);">2Th 3:8</a>), and the same is reported of many rabbis. But in every instance the pursuit of the Law is represented as the worthier, and warning is given not to overestimate the value of the ordinary avocation. It was a saying of Hillel: "He that devotes himself to trade will not become wise." The principle of gratuity was probably carried out in practice only in connection with the judicial activity of the scribes; hardly in connection with their work as teachers. Even the Gospels, in spite of the admonition that the disciples should give without pay because they had received without pay (<a onClick="return mV(\'Mat\',10,8);">Mt 10:8</a>), nevertheless also state that the workman is worthy of his hire (<a onClick="return mV(\'Mat\',10,10);">Mt 10:10</a>; <a onClick="return mV(\'Luk\',10,7);">Lu 10:7</a>); and Paul (<a onClick="return mV(\'1Cr\',9,14);">1Co 9:14</a>) states it as his just due that he receive his livelihood from those to whom he preaches the gospel, even though he makes use of this right only in exceptional cases (<a onClick="return mV(\'1Cr\',9,\'3-18\');">1Co 9:3-18</a>; <a onClick="return mV(\'2Cr\',11,8,9);">2Co 11:8,9</a>; <a onClick="return mV(\'Gal\',6,6);">Ga 6:6</a>; <a onClick="return mV(\'Phl\',4,10,18);">Php 4:10,18</a>). Since this appears to have been the thought of the times, we are undoubtedly justified in assuming that the Jewish teachers of the Law also demanded pay for their services. Indeed, the admonitions above referred to, not to make instruction in the Law the object of self-interest, lead to the conclusion that gratuity was not the rule; and in Christ\'s philippics against the scribes and Pharisees He makes special mention of their greed (<a onClick="return mV(\'Mar\',12,40);">Mr 12:40</a>; <a onClick="return mV(\'Luk\',16,14);">Lu 16:14</a>; <a onClick="return mV(\'Luk\',20,47);">20:47</a>). Hence, even though they ostensibly gave instruction in the Law gratuitously, they must have practiced methods by which they indirectly secured their fees.<P>Naturally the place of chief influence for the scribes up to the year 70 AD was Judea. But not only there were they to be found. Wherever the zeal for the law of the fathers was a perceptible force, they were indispensable; hence, we find them also in Galilee (<a onClick="return mV(\'Luk\',5,17);">Lu 5:17</a>) and in the Diaspora. In the Jewish epitaphs in Rome, dating from the latter days of the empire, grammateis are frequently mentioned; and the Babylonian scribes of the 5th and 6th centuries were the authors of the most monumental work of rabbinical Judaism—the Talmud.<P>Since the separation of the Pharisaic and the Sadducean tendencies in Judaism, the scribes generally belonged to the Pharisaic class; for this latter is none other than the party which recognized the interpretations or "traditions" which the scribes in the course of time had developed out of the body of the written Law and enforced upon the people as the binding rule of life. Since, however, "scribes" are merely "students of the Law," there must also have been scribes of the Sadducee type; for it is not to be imagined that this party, which recognized only the written Law as binding, should not have had some opposing students in the other class. Indeed, various passages of the New Testament which speak of the "scribes of the Pharisees" (<a onClick="return mV(\'Mar\',2,16);">Mr 2:16</a>; <a onClick="return mV(\'Luk\',5,30);">Lu 5:30</a>; <a onClick="return mV(\'Act\',23,9);">Ac 23:9</a>) indicate that there were also "scribes of the Sadducees."<P>Under the reign and leadership of the scribes, it became the ambition of every Israelite to know more or less of the Law. The aim of education in family, school and synagogue was to make the entire people a people of the Law. Even the common laborer should know what was written in the Law; and not only know it, but also do it. His entire life should be governed according to the norm of the Law, and, on the whole, this purpose was realized in a high degree. Josephus avers: "Even though we be robbed of our riches and our cities and our other goods, the Law remains our possession forever. And no Jew can be so far removed from the and of his fathers nor will he fear a hostile commander to such a degree that he would not fear his Law more than his commander." So loyal were the majority of the Jews toward their Law that they would gladly endure the tortures of the rack and even death for it. This frame of mind was due almost wholly to the systematic and persistent instruction of the scribes.<P>The motive underlying this enthusiasm for the Law was the belief in divine retribution in the strictest judicial sense. The prophetic idea of a covenant which God had made with His select people was interpreted purely in the judicial sense. The covenant was a contract through which both parties were mutually bound. The people are bound to observe the divine Law literally and conscientiously; and, in return for this, God is in duty bound to render the promised reward in proportion to the services rendered. This applies to the people as a whole as well as to the individual. Services and reward must always stand in mutual relation to each other. He who renders great services may expect from the justice of God that he will receive great returns as his portion, while, on the other hand, every transgression also must be followed by its corresponding punishment.<P>The results corresponded to the motives. Just as the motives in the main were superficial, so the results were an exceedingly shallow view of religious and moral life. Religion was reduced to legal formalism. All religious and moral life was dragged down to the level of law, and this must necessarily lead to the following results:<P>(1) The individual is governed by a norm, the application of which could have only evil results when applied in this realm. Law has the purpose of regulating the relations of men to each other according to certain standards. Its object is not the individual, but only the body of society. In the law, the individual must find the proper rule for his conduct toward society as an organism. This is a matter of obligation and of government on the part of society. But religion is not a matter of government; where it is found, it is a matter of freedom, of choice, and of conduct.<P>(2) By reducing the practice of religion to the form of law, all acts are placed on a paragraph with each other. The motives are no longer taken into consideration, but only the deed itself.<P>(3) From this it follows that the highest ethical attainment was the formal satisfaction of the Law, which naturally led to finical literalism.<P>(4) Finally, moral life must, under such circumstances, lose its unity and be split up into manifold precepts and duties. Law always affords opportunity for casuistry, and it was the development of this in the guidance of the Jewish religious life through the "precepts of the elders" which called forth Christ\'s repeated denunciation of the work of the scribes.``77';
isbe[7719]='Scrip`skrip: A word connected with "scrap," and meaning a "bag," either as made from a "scrap" (of skin) or as holding "scraps" (of food, etc.). the King James Version has "scrip" in <a onClick="return mV(\'1Sa\',17,40);">1Sa 17:40</a> and 6 times in New Testament; the English Revised Version has "wallet" in the New Testament, but retains "script" in <a onClick="return mV(\'1Sa\',17,40);">1Sa 17:40</a>; the American Standard Revised Version has "wallet" throughout.`<a href="./study/isbe/search.html?string=BAG">BAG</a>`1';
isbe[7720]='Scripture`skrip\'-tur (he graphe, plural hai graphai): The word means "writing." In the Old Testament it occurs in the King James Version only once, "the scripture of truth," in <a onClick="return mV(\'Dan\',10,21);">Da 10:21</a>, where it is more correctly rendered in the Revised Version (British and American), "the writing of truth." The reference is not to Holy Scripture, but to the book in which are inscribed God\'s purposes. In the New Testament, "scripture" and "scriptures" stand regularly for the Old Testament sacred books regarded as "inspired" (<a onClick="return mV(\'2Ti\',3,16);">2Ti 3:16</a>), "the oracles of God" (<a onClick="return mV(\'Rom\',3,2);">Ro 3:2</a>). Compare on this usage <a onClick="return mV(\'Mat\',21,42);">Mt 21:42</a>; <a onClick="return mV(\'Mat\',22,29);">22:29</a>; <a onClick="return mV(\'Mar\',12,10);">Mr 12:10</a>; <a onClick="return mV(\'Luk\',4,21);">Lu 4:21</a>; <a onClick="return mV(\'Luk\',24,27,32,45);">24:27,32,45</a>; <a onClick="return mV(\'Jhn\',5,39);">Joh 5:39</a>; <a onClick="return mV(\'Jhn\',10,35);">10:35</a>; <a onClick="return mV(\'Act\',8,32);">Ac 8:32</a>; <a onClick="return mV(\'Act\',17,2,11);">17:2,11</a>; <a onClick="return mV(\'Rom\',15,4);">Ro 15:4</a>; <a onClick="return mV(\'Rom\',16,26);">16:26</a>, etc.; in <a onClick="return mV(\'Rom\',1,2);">Ro 1:2</a>, "holy scriptures." See <a href="./study/isbe/search.html?string=BIBLE">BIBLE</a>. The expression "holy scriptures" in <a onClick="return mV(\'2Ti\',3,15);">2Ti 3:15</a> the King James Version represents different words (hiera grammata) and is properly rendered in the Revised Version (British and American) "sacred writings." In <a onClick="return mV(\'2Pe\',3,16);">2Pe 3:16</a>, the term "scriptures" is extended to the Eppistle of Paul. In <a onClick="return mV(\'Jam\',4,5);">Jas 4:5</a>, the words occur: "Think ye that the scripture speaketh in vain? Doth the spirit which he made to dwell in us long unto envying?" The passage is probably rather a summary of Scripture teaching than intended as a direct quotation. Others (e.g. Westcott) think the word is used in a wide sense of a Christian hymn.``132';
isbe[7721]='Scriptures, Search the`skrip\'-turz.`<a href="./study/isbe/search.html?string=SEARCH+THE+SCRIPTURES">SEARCH THE SCRIPTURES</a>`1';
isbe[7722]='Scroll`skrol.`<a href="./study/isbe/search.html?string=ROLL">ROLL</a>`1';
isbe[7723]='Scum`skum (chel\'ah; Septuagint ios, "poison" or "verdigris"; compare Plato Rep. 609a): The word is only found in <a onClick="return mV(\'Eze\',24,6,11,12);">Eze 24:6,11,12</a>, where the Revised Version (British and American) translates it "rust." The fact, however, that the caldron is of brass and therefore not liable to rust, and the astonishment expressed that the fire did not remove it (<a onClick="return mV(\'Eze\',24,12);">24:12</A>), would seem to point to the preferability of the translation "scum," the residue of dirt adhering to the caldron from previous use.``1';
isbe[7724]='Scurvy`skur\'-vi (garabh); psora agria (<a onClick="return mV(\'Lev\',21,20);">Le 21:20</a>; <a onClick="return mV(\'Lev\',22,22);">22:22</a>)): This word is used to denote an itchy, scaly disease of the scalp, probably any of the parasitic diseases which are known as tinea, porrigo or impetigo. These cases have no relation whatever to the disease now known as scorbutus or scurvy. The name was probably derived from its scaliness, and the old Greek physicians believed these diseases to be peculiarly intractable.<P>The name "Gareb" is used in <a onClick="return mV(\'Jer\',31,39);">Jer 31:39</a> as the placename of a hill at or near the southeastern corner of Jerusalem, probably from the bare roughness of the surface of its slope at the southern end of the Wady er-Rababi. Another hill of this name is mentioned near Shiloh in the Talmud, and the name is given to one of David\'s warriors (<a onClick="return mV(\'2Sa\',23,38);">2Sa 23:38</a>).<P>Scurvy etymologically means any condition of scaliness of skin which can be scraped off, such as dandruff.``107';
isbe[7725]='Scythians`sith\'-i-anz (hoi Skuthai): The word does not occur in the Hebrew of the Old Testament, but Septuagint of <a onClick="return mV(\'Jdg\',1,27);">Jud 1:27</a> inserts (Skuthon polis (Scythopolis), in explanation, as being the same as Beth-shean. The same occurs in Apocrypha (Judith 3:10; 1Macc 12:29), and the Scythians as a people in 2Macc 4:47, and the adjective in 3Macc 7:5. The people are also mentioned in the New Testament (<a onClick="return mV(\'Col\',3,11);">Col 3:11</a>), where, as in Maccabees, the fact that they were barbarians is implied. This is clearly set forth in classical writers, and the description of them given by Herodotus in book iv of his history represents a race of savages, inhabiting a region of rather indefinite boundaries, north of the Black and Caspian seas and the Caucasus Mountains. They were nomads who neither plowed nor sowed (iv.19), moving about in wagons and carrying their dwellings with them (ibid. 46); they had the most filthy habits and never washed in water (ibid. 75); they drank the blood of the first enemy killed in battle, and made napkins of the scalps and drinking bowls of the skulls of the slain (ibid. 64-65). Their deities were many of them identified with those of the Greeks, but the most characteristic rite was the worship of the naked sword (ibid. 62), and they sacrificed every hundredth man taken in war to this deity. War was their chief business, and they were a terrible scourge to the nations of Western Asia. They broke through the barrier of the Caucasus in 632 BC and swept down like a swarm of locusts upon Media and Assyria, turning the fruitful fields into a desert; pushing across Mesopotamia, they ravaged Syria and were about to invade Egypt when Psammitichus I, who was besieging Ashdod, bought them off by rich gifts, but they remained in Western Asia for 28 years, according to Herodotus. It is supposed that a company of them settled in Beth-shean, and from this circumstance it received the name Scythopolis. Various branches of the race appeared at different times, among the most noted of which were the <a href="./study/isbe/search.html?string=PARTHIANS">PARTHIANS</a> (which see).``138';
isbe[7726]='Scythopolis`si-thop\'-o-lis, si-thop\'-o-lis.`<a href="./study/isbe/search.html?string=BETH-SHEAN">BETH-SHEAN</a>`1';
isbe[7727]='Sea`se (yam; thalassa; in <a onClick="return mV(\'Act\',27,5);">Ac 27:5</a> pelagos): The Mediterranean is called ha-yam ha-gadhol, "the great sea" (<a onClick="return mV(\'Num\',34,6);">Nu 34:6</a>; <a onClick="return mV(\'Jos\',1,4);">Jos 1:4</a>; <a onClick="return mV(\'Eze\',47,10);">Eze 47:10</a>, etc.); ha-yam ha-\'acharon, "the hinder," or "western sea" (<a onClick="return mV(\'Deu\',11,24);">De 11:24</a>; <a onClick="return mV(\'Deu\',34,2);">34:2</a>; <a onClick="return mV(\'Joe\',2,20);">Joe 2:20</a>; <a onClick="return mV(\'Zec\',14,8);">Zec 14:8</a>); yam pelishtim, "the sea of the Philis" (<a onClick="return mV(\'Exd\',23,31);">Ex 23:31</a>); the King James Version translates yam yapho\' in <a onClick="return mV(\'Ezr\',3,7);">Ezr 3:7</a> by "sea of Joppa," perhaps rightly.<P>The Dead Sea is called yam ha-melach, "the Salt Sea" (<a onClick="return mV(\'Num\',34,3);">Nu 34:3</a>; <a onClick="return mV(\'Deu\',3,17);">De 3:17</a>; <a onClick="return mV(\'Jos\',3,16);">Jos 3:16</a>, etc.); ha-yam ha-qadhmoni, "the east sea" (<a onClick="return mV(\'Eze\',47,18);">Eze 47:18</a>; <a onClick="return mV(\'Joe\',2,20);">Joe 2:20</a>; <a onClick="return mV(\'Zec\',14,8);">Zec 14:8</a>); yam ha-\'arabhah,"the sea of the Arabah" (<a onClick="return mV(\'Deu\',3,17);">De 3:17</a>; <a onClick="return mV(\'Jos\',3,16);">Jos 3:16</a>; <a onClick="return mV(\'Jos\',12,3);">12:3</a>; <a onClick="return mV(\'2Ki\',14,25);">2Ki 14:25</a>).<P>The Red Sea is called yam cuph, literally, "sea of weeds" (<a onClick="return mV(\'Exd\',10,19);">Ex 10:19</a>; <a onClick="return mV(\'Num\',14,25);">Nu 14:25</a>; <a onClick="return mV(\'Deu\',1,1);">De 1:1</a>; <a onClick="return mV(\'Jos\',2,10);">Jos 2:10</a>; <a onClick="return mV(\'Jdg\',11,16);">Jud 11:16</a>; <a onClick="return mV(\'1Ki\',9,26);">1Ki 9:26</a>; <a onClick="return mV(\'Neh\',9,9);">Ne 9:9</a>; <a onClick="return mV(\'Psa\',106,7);">Ps 106:7</a>; <a onClick="return mV(\'Jer\',49,21);">Jer 49:21</a>, etc.); (eruthra thalassa), literally, "red sea" (The Wisdom of Solomon 19:7; <a onClick="return mV(\'Act\',7,36);">Ac 7:36</a>; <a onClick="return mV(\'Hbr\',11,29);">Heb 11:29</a>); yam mitsrayim, "the Egyptian sea" (<a onClick="return mV(\'Isa\',11,15);">Isa 11:15</a>).<P>Yam is used of the Nile in <a onClick="return mV(\'Nah\',3,8);">Na 3:8</a> and probably also in <a onClick="return mV(\'Isa\',19,5);">Isa 19:5</a>, as in modern Arabic bachr, "sea," is used of the Nile and its affluents. Yam is often used for "west" or "westward," as "look from the place where thou art,...westward" (<a onClick="return mV(\'Gen\',13,14);">Ge 13:14</a>); "western border" (<a onClick="return mV(\'Num\',34,6);">Nu 34:6</a>). Yam is used for "sea" in general (<a onClick="return mV(\'Exd\',20,11);">Ex 20:11</a>); also for "molten sea" of the temple (<a onClick="return mV(\'1Ki\',7,23);">1Ki 7:23</a>).<P>The Sea of Galilee is called kinnereth, "Chinnereth" (<a onClick="return mV(\'Num\',34,11);">Nu 34:11</a>); kinaroth, "Chinneroth" (<a onClick="return mV(\'Jos\',11,2);">Jos 11:2</a>); kinneroth, "Chinneroth" (<a onClick="return mV(\'1Ki\',15,20);">1Ki 15:20</a>); yam kinnereth, "the sea of Chinnereth" (<a onClick="return mV(\'Num\',34,11);">Nu 34:11</a>; <a onClick="return mV(\'Jos\',13,27);">Jos 13:27</a>); yam kinneroth, "the sea of Chinneroth (<a onClick="return mV(\'Jos\',12,3);">Jos 12:3</a>); (he limne Gennesaret), "the lake of Gennesaret" (<a onClick="return mV(\'Luk\',5,1);">Lu 5:1</a>); and (to hudor Gennesar), "the water of Gennesar" (1Macc 11:67), from late Hebrew ginecar, or (genecar; he thalassa tes Galilaias), "the sea of Galilee" (<a onClick="return mV(\'Mat\',4,18);">Mt 4:18</a>; <a onClick="return mV(\'Mat\',15,29);">15:29</a>; <a onClick="return mV(\'Mar\',1,16);">Mr 1:16</a>; <a onClick="return mV(\'Mar\',7,31);">7:31</a>; <a onClick="return mV(\'Jhn\',6,1);">Joh 6:1</a>); (he thalassa tes Tiberiados), "the sea of Tiberias" (<a onClick="return mV(\'Jhn\',21,1);">Joh 21:1</a>; compare <a onClick="return mV(\'Jhn\',6,1);">Joh 6:1</a>).<P>In <a onClick="return mV(\'Jer\',48,32);">Jer 48:32</a> we have yam ya\'zer, "the sea of Jazer." Jazer is a site east of the Jordan, not satisfactorily identified (<a onClick="return mV(\'Num\',21,32);">Nu 21:32</a>; <a onClick="return mV(\'Num\',32,1,3,15);">32:1,3,15</a>; <a onClick="return mV(\'Jos\',13,25);">Jos 13:25</a>; <a onClick="return mV(\'Jos\',21,39);">21:39</a>; <a onClick="return mV(\'2Sa\',24,5);">2Sa 24:5</a>; <a onClick="return mV(\'1Ch\',6,81);">1Ch 6:81</a>; <a onClick="return mV(\'1Ch\',26,31);">26:31</a>; <a onClick="return mV(\'Isa\',16,8,9);">Isa 16:8,9</a>).<P>In midhbar yam, "the wilderness of the sea" (<a onClick="return mV(\'Isa\',21,1);">Isa 21:1</a>), there may perhaps be a reference to the Persian Gulf.`<a href="./study/isbe/search.html?string=SEA+OF+JAZER">SEA OF JAZER</a>`37';

isbe[7748]='Sea, the Great`(ha-yam ha-gadhol):<P>1. Names of the Sea:<P>This is the name given to the Mediterranean, which formed the western boundary of Palestine (<a onClick="return mV(\'Num\',34,6);">Nu 34:6</a>f; <a onClick="return mV(\'Jos\',15,12);">Jos 15:12,47</a>; <a onClick="return mV(\'Eze\',47,19);">Eze 47:19</a>f; <a onClick="return mV(\'Eze\',48,28);">48:28</a>). It is also called "the hinder sea" (Hebrew ha-yam ha-\'aharon), i.e. the western sea (<a onClick="return mV(\'Deu\',11,24);">De 11:24</a>; <a onClick="return mV(\'Deu\',34,2);">34:2</a>; <a onClick="return mV(\'Joe\',2,20);">Joe 2:20</a>; <a onClick="return mV(\'Zec\',14,8);">Zec 14:8</a>), and "the sea of the Philis" (<a onClick="return mV(\'Exd\',23,31);">Ex 23:31</a>), which, of course, applies especially to the part washing the shore of Philistia, from Jaffa southward. Generally, when the word "sea" is used, and no other is definitely indicated, the Mediterranean is intended (<a onClick="return mV(\'Gen\',49,13);">Ge 49:13</a>; <a onClick="return mV(\'Num\',13,29);">Nu 13:29</a>, etc.). It was the largest sheet of water with which the Hebrews had any acquaintance. Its gleaming mirror, stretching away to the sunset, could be seen from many an inland height.<P>2. Israel and the Sea:<P>It bulked large in the minds of the landsmen—for Israel produced few mariners—impressing itself upon their speech, so that "seaward" was the common term for "westward" (<a onClick="return mV(\'Exd\',26,22);">Ex 26:22</a>; <a onClick="return mV(\'Jos\',5,1);">Jos 5:1</a>, etc.). Its mystery and wonder, the raging of the storm, and the sound of "sorrow on the sea," borne to their upland ears, infected them with a strange dread of its wide waters, to which the seer of Patmos gave the last Scriptural expression in his vision of the new earth, where "the sea is no more" (<a onClick="return mV(\'Rev\',21,1);">Re 21:1</a>).<P>3. The Coast Line:<P>Along the coast lay the tribal territories assigned to Asher, Zebulun, Manasseh, Dan and Judah. Many of the cities along the shore they failed to possess, however, and much of the land. The coast line offered little facility for the making of harbors. The one seaport of which in ancient times the Hebrews seem to have made much use was Joppa—the modern Jaffa (<a onClick="return mV(\'2Ch\',2,16);">2Ch 2:16</a>, etc.). From this place, probably, argosies of Solomon turned their prows westward. Here, at least, "ships of Tarshish" were wont to set out upon their adventurous voyages (<a onClick="return mV(\'Jon\',1,3);">Jon 1:3</a>). The ships on this sea figure in the beautiful vision of Isaiah (<a onClick="return mV(\'Isa\',60,8);">60:8</a>f).<P>See <a href="./study/isbe/search.html?string=ACCO">ACCO</a>; <a href="./study/isbe/search.html?string=JOPPA">JOPPA</a>.<P>4. The Sea in the New Testament:<P>The boy Jesus, from the heights above Nazareth, must often have looked on the waters of the great sea, as they broke in foam on the curving shore, from the roots of Carmel to the point at Acre. Once only in His journeyings, so far as we know, did He approach the sea, namely on His ever-memorable visit to the "borders of Tyre and Sidon" (<a onClick="return mV(\'Mat\',15,21);">Mt 15:21</a>; <a onClick="return mV(\'Mar\',7,24);">Mr 7:24</a>). The sea, in all its moods, was well known to the great apostle of the Gentiles. The three shipwrecks, which he suffered (<a onClick="return mV(\'2Cr\',11,25);">2Co 11:25</a>), were doubtless due to the power of its angry billows over the frail craft of those old days.<P>See <a href="./study/isbe/search.html?string=PAUL">PAUL</a>.<P>5. Debt of Palestine to the Sea:<P>The land owes much to the great sea. During the hot months of summer, a soft breeze from the water springs up at dawn, fanning all the seaward face of the Central Range. At sunset the chilled air slips down the slopes and the higher strata drift toward the uplands, charged with priceless moisture, giving rise to the refreshing dews which make the Palestinian morning so sweet.`<a href="./study/isbe/search.html?string=MEDITERRANEAN+SEA">MEDITERRANEAN SEA</a>`54';
isbe[7749]='Sea, the Molten; Sea, the Brazen`mol\'-t\'n, or (yam mutsaq, yam hanechosheth): This was a large brazen (bronze) reservoir for water which stood in the court of Solomon\'s Temple between the altar and the temple porch, toward the south (<a onClick="return mV(\'1Ki\',7,\'23-26\');">1Ki 7:23-26</a>; <a onClick="return mV(\'2Ch\',4,\'2-5\',10);">2Ch 4:2-5,10</a>). The bronze from which it was made is stated in <a onClick="return mV(\'1Ch\',18,8);">1Ch 18:8</a> to have been taken by David from the cities Tibhath and Cun. It replaced the laver of the tabernacle, and, like that, was used for storing the water in which the priests washed their hands and their feet (compare <a onClick="return mV(\'Exd\',30,18);">Ex 30:18</a>; <a onClick="return mV(\'Exd\',38,8);">38:8</a>). It rested on 12 brazen (bronze) oxen, facing in four groups the four quarters of heaven. For particulars of shape, size and ornamentation, see <a href="./study/isbe/search.html?string=TEMPLE">TEMPLE</a>. The "sea" served its purpose till the time of Ahaz, who took away the brazen oxen, and placed, the sea upon a pavement (<a onClick="return mV(\'2Ki\',16,17);">2Ki 16:17</a>). It is recorded that the oxen were afterward taken to Babylon (<a onClick="return mV(\'Jer\',52,20);">Jer 52:20</a>). The sea itself shared the same fate, being first broken to pieces (<a onClick="return mV(\'2Ki\',25,13,16);">2Ki 25:13,16</a>).``17';
