:1,6</a>f); and the 70 idolatrous elders seen by Ezekiel (<a onClick="return mV(\'Eze\',8,11);">Eze 8:11</a>). It is also used of periods: 70 days of Egyptian mourning for Jacob (<a onClick="return mV(\'Gen\',50,3);">Ge 50:3</a>); 70 years of trial (<a onClick="return mV(\'Isa\',23,15,17);">Isa 23:15,17</a>; <a onClick="return mV(\'Jer\',25,11);">Jer 25:11</a>f; <a onClick="return mV(\'Dan\',9,2);">Da 9:2</a>; <a onClick="return mV(\'Zec\',1,12);">Zec 1:12</a>; <a onClick="return mV(\'Zec\',7,5);">7:5</a>); the 70 weeks of Daniel (<a onClick="return mV(\'Dan\',9,24);">Da 9:24</a>); and the 70 years of human life (<a onClick="return mV(\'Psa\',90,10);">Ps 90:10</a>). Other noticeable uses of 70 are the 70 palm trees of Elim (<a onClick="return mV(\'Exd\',15,27);">Ex 15:27</a> parallel <a onClick="return mV(\'Num\',33,9);">Nu 33:9</a>); the offering of 70 bullocks in the time of Hezekiah (<a onClick="return mV(\'2Ch\',29,32);">2Ch 29:32</a>), and the offering by the heads of the tribes of 12 silver bowls each of 70 shekels (<a onClick="return mV(\'Num\',7,13);">Nu 7:13</a>). In the New Testament we have the 70 apostles (<a onClick="return mV(\'Luk\',10,1,17);">Lu 10:1,17</a>), but the number is uncertain with Codices Vaticanus and Bezae and some versions reading 72, which is the product, not of 7 and 10, but of 6 and 12. Significant seventies are also met with outside of the Bible. The most noteworthy are the Jewish belief that there were 70 nations outside Israel, with 70 languages, under the care of 70 angels, based perhaps on the list in <a onClick="return mV(\'Gen\',10,\'1-\');">Ge 10</a>; the Sanhedrin of about 70 members; the translation of the Pentateuch into Greek by Septuagint (more exactly 72), and the 70 members of a family in one of the Aramaic texts of Sendschirli. This abundant use of 70 must have been largely due to the fact that it was regarded as an intensified 7.<P>Seventy and seven, or 77, a combination found in the words of Lamech (<a onClick="return mV(\'Gen\',4,24);">Ge 4:24</a>); the number of the princes and elders of Succoth (<a onClick="return mV(\'Jdg\',8,14);">Jud 8:14</a>); and the number of lambs in a memorable sacrifice (<a onClick="return mV(\'Ezr\',8,35);">Ezr 8:35</a>), would appeal in the same way to the oriental fancy.<P>The product of seven and seventy (Greek hebdomekontakis hepta) is met with once in the New Testament (<a onClick="return mV(\'Mat\',18,22);">Mt 18:22</a>), and in the Septuagint of the above-quoted <a onClick="return mV(\'Gen\',4,24);">Ge 4:24</a>. Moulton, however (Grammar of Greek New Testament Prolegomena, 98), renders in both passages 70 plus 7; contra, Allen, "Mt," ICC, 199. The number is clearly a forceful equivalent of "always."<P>Seven thousand in <a onClick="return mV(\'1Ki\',19,18);">1Ki 19:18</a> parallel <a onClick="return mV(\'Rom\',11,4);">Ro 11:4</a> may be a round number chosen on account of its embodiment of the <span class="noTag">number 7</span>. In the Moabite Stone the number of Israelites slain at the capture of the city of Nebo by the Moabites is reckoned at 7,000.<P>The half of seven seems sometimes to have been regarded as significant. In <a onClick="return mV(\'Dan\',7,25);">Da 7:25</a>; <a onClick="return mV(\'Dan\',9,27);">9:27</a>; <a onClick="return mV(\'Dan\',12,7);">12:7</a>; <a onClick="return mV(\'Luk\',4,25);">Lu 4:25</a> parallel 5:17; <a onClick="return mV(\'Rev\',11,2);">Re 11:2</a>; <a onClick="return mV(\'Rev\',13,5);">13:5</a> a period of distress is calculated at 3 1/2 years, that is, half the period of sacred completeness.<P>2. The Number Three:<P>The number three seems early to have attracted attention as the number in which beginning, middle and end are most distinctly marked, and to have been therefore regarded as symbolic of a complete and ordered whole. Abundant illustration of its use in this way in Babylonian theology, ritual and magic is given from the cuneiform texts by Hehn (op. cit., 63ff), and the hundreds of passages in the Bible in which the number occurs include many where this special significance either lies on the surface or not far beneath it. This is owing in some degree perhaps to Babylonian influence, but will have been largely due to independent observation of common phenomena—the arithmetical fact mentioned above and familiar trios, such as heaven, earth, and sea (or "the abyss"); morning, noon and night; right, middle, and left, etc. In other words, 3 readily suggested completeness, and was often used with a glance at that meaning in daily life and daily speech. Only a selection from the great mass of Biblical examples can be given here.<P>(1) Three is often found of persons and things sacred or secular, e.g. Noah\'s 3 sons (<a onClick="return mV(\'Gen\',6,10);">Ge 6:10</a>); Job\'s 3 daughters (<a onClick="return mV(\'Job\',1,2);">Job 1:2</a>; <a onClick="return mV(\'Job\',42,13);">42:13</a>) and 3 friends (<a onClick="return mV(\'Job\',2,11);">Job 2:11</a>); Abraham\'s 3 guests (<a onClick="return mV(\'Gen\',18,2);">Ge 18:2</a>); and Sarah\'s 3 measures of meal (<a onClick="return mV(\'Gen\',18,6);">Ge 18:6</a>; compare <a onClick="return mV(\'Mat\',13,33);">Mt 13:33</a> parallel); 3 in military tactics (<a onClick="return mV(\'Jdg\',7,16,20);">Jud 7:16,20</a>; <a onClick="return mV(\'Jdg\',9,43);">9:43</a>; <a onClick="return mV(\'1Sa\',11,11);">1Sa 11:11</a>; <a onClick="return mV(\'1Sa\',13,17);">13:17</a>; <a onClick="return mV(\'Job\',1,17);">Job 1:17</a>); 3 great feasts (<a onClick="return mV(\'Exd\',23,14);">Ex 23:14</a>); the 3 daily prayers (<a onClick="return mV(\'Psa\',55,17);">Ps 55:17</a>; <a onClick="return mV(\'Dan\',6,10,13);">Da 6:10,13</a>); the 3 night watches (<a onClick="return mV(\'Jdg\',7,19);">Jud 7:19</a>); God\'s 3-fold call of Samuel (<a onClick="return mV(\'1Sa\',3,8);">1Sa 3:8</a>); the 3 keepers of the temple threshold (<a onClick="return mV(\'Jer\',52,24);">Jer 52:24</a>); the 3 presidents appointed by Darius (<a onClick="return mV(\'Dan\',6,2);">Da 6:2</a>); the 3 temptations (<a onClick="return mV(\'Mat\',4,3,5,8);">Mt 4:3,5f; 8 f</a> parallel); the 3 prayers in Gethsemane (<a onClick="return mV(\'Mat\',26,39,42,44);">Mt 26:39,42,44</a> parallel); Peter\'s 3 denials (<a onClick="return mV(\'Mat\',26,34,75);">Mt 26:34,75</a> parallel); the Lord\'s 3-fold question and 3-fold charge (<a onClick="return mV(\'Jhn\',21,15);">Joh 21:15</a>); and the 3-fold vision of the sheet (<a onClick="return mV(\'Act\',10,16);">Ac 10:16</a>).<P>(2) In a very large number of passages 3 is used of periods of time: 3 days; 3 weeks; 3 months and 3 years. So in <a onClick="return mV(\'Gen\',40,12,13,18);">Ge 40:12,13,18</a>; <a onClick="return mV(\'Exd\',2,2);">Ex 2:2</a>; <a onClick="return mV(\'Exd\',10,22);">10:22</a>f; <a onClick="return mV(\'2Sa\',24,13);">2Sa 24:13</a>; <a onClick="return mV(\'Isa\',20,3);">Isa 20:3</a>; <a onClick="return mV(\'Jon\',1,17);">Jon 1:17</a>; <a onClick="return mV(\'Mat\',15,32);">Mt 15:32</a>; <a onClick="return mV(\'Luk\',2,46);">Lu 2:46</a>; <a onClick="return mV(\'Luk\',13,7);">13:7</a>; <a onClick="return mV(\'Act\',9,9);">Ac 9:9</a>; <a onClick="return mV(\'2Cr\',12,8);">2Co 12:8</a>. The frequent reference to the resurrection "on the 3rd day" or "after 3 days" (<a onClick="return mV(\'Mat\',16,21);">Mt 16:21</a>; <a onClick="return mV(\'Mat\',27,63);">27:63</a>, etc.) may at the same time have glanced at the symbolic use of the number and at the belief common perhaps to the Jews and the Zoroastrians that a corpse was not recognizable after 3 days (for Jewish testimony compare <a onClick="return mV(\'Jhn\',11,39);">Joh 11:39</a>; Yebamoth xvi.3; Midrash, Genesis, chapter c; Semachoth viii; for Persian ideas compare The Expository Times, XVIII, 536).<P>(3) The <span class="noTag">number 3</span> is also used in a literary way, sometimes appearing only in the structure. Note as examples the 3-fold benediction of Israel (<a onClick="return mV(\'Num\',6,24);">Nu 6:24</a>); the Thrice Holy of the seraphim (<a onClick="return mV(\'Isa\',6,3);">Isa 6:3</a>); the 3-fold overturn (<a onClick="return mV(\'Eze\',21,27);">Eze 21:27 (Hebrew 32))</a>; the 3-fold refrain of <a onClick="return mV(\'Psa\',42,\'1-\');">Psalms 42</a>-<a onClick="return mV(\'Psa\',43,\'1-\');">43</A> regarded as one psalm (<a onClick="return mV(\'Psa\',42,5,11);">Ps 42:5,11</a>; <a onClick="return mV(\'Psa\',43,5);">43:5</a>); the 3 names of God (the Mighty One, God, Yahweh, <a onClick="return mV(\'Jos\',22,22);">Jos 22:22</a>; compare <a onClick="return mV(\'Psa\',50,1);">Ps 50:1</a>); the 3 graces of <a onClick="return mV(\'1Cr\',13,\'1-\');">1Co 13</a>; the 3 witnesses (<a onClick="return mV(\'1Jo\',5,8);">1Joh 5:8</a>); the frequent use of 3 and 3rd in Revelation; the description of God as "who is and who was and who is to come" (<a onClick="return mV(\'Rev\',1,4);">Re 1:4</a>); and \'the Father, the Son, and the Holy Spirit\' (<a onClick="return mV(\'Mat\',28,19);">Mt 28:19</a>). In some of these cases 3-fold repetition is a mode of expressing the superlative, and others remind us of the remarkable association of 3 with deity alluded to by Plato and Philo, and illustrated by the triads of Egypt and Babylonia and the Far East. It cannot, however, be proved, or even made probable, that there is any direct connection between any of these triads and the Christian Trinity. All that can be said is, that the same numerical symbolism may have been operative in both cases.<P>3. The Number Four:<P>The 4 points of the compass and the 4 phases of the moon will have been early noticed, and the former at any rate will have suggested before Biblical times the use of 4 as a symbol of completeness of range, of comprehensive extent. As early as the middle of the 3rd millennium BC Bah rulers (followed long afterward by the Assyrians) assumed the title "king of the 4 quarters" meaning that their rule reached in all directions, and an early conqueror claimed to have subdued the 4 quarters. There are not a few illustrations of the use of 4 in some such way in the Bible. The 4 winds (referred to also in the cuneiform texts and the Book of the Dead) are mentioned again and again (<a onClick="return mV(\'Jer\',49,36);">Jer 49:36</a>; <a onClick="return mV(\'Eze\',37,9);">Eze 37:9</a>), and the 4 quarters or corners (<a onClick="return mV(\'Isa\',11,12);">Isa 11:12</a>; <a onClick="return mV(\'Eze\',7,2);">Eze 7:2</a>; <a onClick="return mV(\'Rev\',20,8);">Re 20:8</a>). We read also of the 4 heads of the river of Eden (<a onClick="return mV(\'Gen\',2,10);">Ge 2:10</a>), of 4 horns, 4 smiths, 4 chariots, and horses of 4 colors in the visions of Zechariah (<a onClick="return mV(\'Zec\',1,8);">1:8</a>, Septuagint; <a onClick="return mV(\'Zec\',1,18);">1:18</a>ff; <a onClick="return mV(\'Zec\',6,1);">6:1</a>ff), the chariots being directly connected with the 4 winds; 4 punishments (<a onClick="return mV(\'Jer\',15,3);">Jer 15:3</a>; <a onClick="return mV(\'Eze\',14,21);">Eze 14:21</a>, the latter with a remarkable Assyrian parallel), the 4 kingdoms in Nebuchadnezzar\'s dream as interpreted (<a onClick="return mV(\'Dan\',2,37);">Da 2:37</a>) and Daniel\'s vision (<a onClick="return mV(\'Dan\',7,3);">Da 7:3</a>); the 4 living creatures in Ezekiel (<a onClick="return mV(\'Eze\',1,5);">1:5</a>ff; compare <a onClick="return mV(\'Eze\',1,10);">1:10</a>), each with 4 faces and 4 wings, and the 4 modeled after them (<a onClick="return mV(\'Rev\',4,6);">Re 4:6</a>, etc.). In most of these cases 4 is clearly symbolical, as in a number of passages in Apocrypha and Pseudepigrapha. Whether the frequent use of it in the structure of the tabernacle, Solomon\'s temple, and Ezekiel\'s temple has anything to do with the symbolic meaning is not clear, but the latter can probably be traced in proverbial and prophetic speech (<a onClick="return mV(\'Pro\',30,15,18,21,24,29);">Pr 30:15,18,21,24,29</a>; <a onClick="return mV(\'Amo\',1,3,6);">Am 1:3,6</a>, etc.). The 4 transgressions of the latter represent full-summed iniquity, and the 4-fold grouping in the former suggested the wide sweep of the classification. Perhaps it is not fanciful to find the idea in the 4 sets of hearers of the gospel in the parable of the Sewer (<a onClick="return mV(\'Mat\',13,\'19-23\');">Mt 13:19-23</a> parallel). The rabbis almost certainly had it in mind in their 4-fold grouping of characters in six successive paragraphs (Ab v.16-21) which, however, is of considerably later date.<P>4. The Number Ten:<P>As the basis of the decimal system, which probably originated in counting with the fingers, 10 has been a significant number in all historical ages. The 10 antediluvian patriarchs (<a onClick="return mV(\'Gen\',5,\'1-\');">Ge 5</a>; compare the 10 Babylonian kings of Berosus, and 10 in early Iranian and Far-Eastern myths); the 10 righteous men who would have saved Sodom (<a onClick="return mV(\'Gen\',18,32);">Ge 18:32</a>); the 10 plagues of Egypt; the 10 commandments (<a onClick="return mV(\'Exd\',20,\'2-17\');">Ex 20:2-17</a> parallel <a onClick="return mV(\'Deu\',5,\'6-21\');">De 5:6-21</a>; the 10 commandments found by some in <a onClick="return mV(\'Exd\',34,\'14-26\');">Ex 34:14-26</a> are not clearly made out); the 10 servants of Gideon (<a onClick="return mV(\'Jdg\',6,27);">Jud 6:27</a>); the 10 elders who accompanied Boaz (<a onClick="return mV(\'Rth\',4,2);">Ru 4:2</a>); the 10 virgins of the parable (<a onClick="return mV(\'Mat\',25,1);">Mt 25:1</a>); the 10 pieces of silver (<a onClick="return mV(\'Luk\',15,8);">Lu 15:8</a>); the 10 servants entrusted with 10 pounds (<a onClick="return mV(\'Luk\',19,13);">Lu 19:13</a>), the most capable of whom was placed over 10 cities (<a onClick="return mV(\'Luk\',19,17);">Lu 19:17</a>); the 10 days\' tribulation predicted for the church of Smyrna (<a onClick="return mV(\'Rev\',2,10);">Re 2:10</a>); the use of "10 times" in the sense of "many times" (<a onClick="return mV(\'Gen\',31,7);">Ge 31:7</a>; <a onClick="return mV(\'Neh\',4,12);">Ne 4:12</a>; <a onClick="return mV(\'Dan\',1,20);">Da 1:20</a>, etc., an idiom met with repeatedly in Tell el-Amarna Letters); and the use of 10 in sacred measurements and in the widely diffused custom of tithe, and many other examples show plainly that 10 was a favorite symbolic number suggestive of a rounded total, large or small, according to circumstances. The number played a prominent part in later Jewish life and thought. Ten times was the Tetragrammaton (YHWH) uttered by the high priest on the Day of Atonement; 10 persons must be present at a nuptial benediction; 10 constituted a congregation in the synagogue; 10 was the usual number of a company at the paschal meal, and of a row of comforters of the bereaved. The world was created, said the rabbis, by ten words, and Abraham was visited with 10 temptations (Ab v..1 and 4; several other illustrations are found in the context).<P>5. The Number Twelve:<P>The 12 months and the 12 signs of the zodiac probably suggested to the old Babylonians the use of 12 as a symbolic or semi-sacred number, but its frequent employment by the Israelites with special meaning cannot at present be proved to have originated in that way, although the idea was favored by both Josephus and Philo. So far as we know, Israelite predilection for 12 was entirely due to the traditional belief that the nation consisted of 12 tribes, a belief, it is true, entertained also by the Arabs or some of them, but with much less intensity and persistence. In Israel the belief was universal and ineradicable. Hence, the 12 pillars set up by Moses (<a onClick="return mV(\'Exd\',24,4);">Ex 24:4</a>); the 12 jewels in the high priest\'s breast-plate (<a onClick="return mV(\'Exd\',28,21);">Ex 28:21</a>); the 12 cakes of showbread (<a onClick="return mV(\'Lev\',24,5);">Le 24:5</a>); the 12 rods (<a onClick="return mV(\'Num\',17,2);">Nu 17:2</a>); the 12 spies (<a onClick="return mV(\'Num\',13,\'1-\');">Nu 13</a>); the 12 stones placed by Joshua in the bed of Jordan (<a onClick="return mV(\'Jos\',4,9);">Jos 4:9</a>); the 12 officers of Solomon (<a onClick="return mV(\'1Ki\',4,7);">1Ki 4:7</a>); the 12 stones of Elijah\'s altar (<a onClick="return mV(\'1Ki\',18,31);">1Ki 18:31</a>); the 12 disciples or apostles (26 times), and several details of apocalyptic imagery (<a onClick="return mV(\'Rev\',7,5);">Re 7:5</a>ff; <a onClick="return mV(\'Rev\',12,1;">12:1</a>; <a onClick="return mV(\'Rev\',21,12,14,16,21);">21:12,14,16,21</a>; <a onClick="return mV(\'Rev\',22,2);">22:2</a>; compare also <a onClick="return mV(\'Mat\',14,20);">Mt 14:20</a> parallel <a onClick="return mV(\'Mat\',19,28);">Mt 19:28</a> parallel <a onClick="return mV(\'Mat\',26,53);">Mt 26:53</a>; <a onClick="return mV(\'Act\',26,7);">Ac 26:7</a>). The number pointed in the first instance at unity and completeness which had been sanctioned by Divine election, and it retained this significance when applied to the spiritual Israel. Philo indeed calls it a perfect number. Its double in <a onClick="return mV(\'Rev\',4,4);">Re 4:4</a>, etc., is probably also significant.<P>6. Other Significant Numbers:<P>Five came readily into the mind as the half of 10. Hence, perhaps its use in the parable of the Virgins (<a onClick="return mV(\'Mat\',25,2);">Mt 25:2</a>). It was often employed in literary division, e.g. in the Pentateuch, the Psalms, the part of the Hagiographa known as the Meghilljth, the Ethiopic Enoch and Matthew (<a onClick="return mV(\'Mat\',7,28);">7:28</a>; <a onClick="return mV(\'Mat\',11,1);">11:1</a>; <a onClick="return mV(\'Mat\',13,53);">13:53</a>; <a onClick="return mV(\'Mat\',19,1);">19:1</A>; <a onClick="return mV(\'Mat\',26,1);">26:1</a>; compare Sir J. Hawkins, Horae Synopticae(2), 163ff). It seems to have been occasionally suggestive of relative smallness, as in <a onClick="return mV(\'Lev\',26,8);">Le 26:8</a>, the 5 loaves (<a onClick="return mV(\'Mat\',14,17);">Mt 14:17</a> parallel), <a onClick="return mV(\'1Cr\',14,19);">1Co 14:19</a>, and perhaps in Tell el-Amarna Letters. It has been remarked (Skinner, "Gen," ICC, 483) that the number occurs repeatedly in reference to matters Egyptian (<a onClick="return mV(\'Gen\',41,34);">Ge 41:34</a>; <a onClick="return mV(\'Gen\',45,22);">45:22</a>; <a onClick="return mV(\'Gen\',47,2);">47:2</a>; <a onClick="return mV(\'Isa\',19,18);">Isa 19:18</a>), but there seems to be no satisfactory explanation. Sixty: Although, as was before observed, there is no direct trace in the Bible of the numerical system based on 60, there are a few passages where there may be a distant echo. The 60 cities of Argob (<a onClick="return mV(\'Deu\',3,4);">De 3:4</a>; <a onClick="return mV(\'Jos\',13,30);">Jos 13:30</a>; <a onClick="return mV(\'1Ki\',4,13);">1Ki 4:13</a>); the 60 mighty men and the 60 queens of <a onClick="return mV(\'Sgs\',3,7);">So 3:7</a>; <a onClick="return mV(\'Sgs\',6,8);">6:8</a>, the double use of 60 of Rehoboam\'s harem and family (<a onClick="return mV(\'2Ch\',11,21);">2Ch 11:21</a>), the 3 sacrifices of 60 victims each (<a onClick="return mV(\'Num\',7,88);">Nu 7:88</a>), and the length of Solomon\'s temple, 60 cubits (<a onClick="return mV(\'1Ki\',6,2);">1Ki 6:2</a> parallel <a onClick="return mV(\'2Ch\',3,3);">2Ch 3:3</a>), may perhaps have a remote connection with the Babylonian use. It must be remembered that the latter was current in Israel and the neighboring regions in the division of the talent into 60 minas. A few passages in the Pseudepigrapha may be similarly interpreted, and the Babylonian Talmud contains, as might be expected, many clear allusions. In the Bible, however, the special use of the number is relatively rare and indirect. One hundred and ten, the age attained by Joseph (<a onClick="return mV(\'Gen\',50,22);">Ge 50:22</a>), is significant as the Egyptian ideal of longevity (Smith, DB2, 1804f; Skinner, "Gen," ICC, 539f). One hundred and fifty-three: The Greek poet Oppian (circa 171 AD) and others are said to have reckoned the number of fishes in the world at this figure (compare Jerome on <a onClick="return mV(\'Eze\',47,\'1-\');">Eze 47</a>), and some scholars find a reference to that belief in <a onClick="return mV(\'Jhn\',21,11);">Joh 21:11</a> in which case the number would be symbolic of comprehensiveness. That is not quite impossible, but the suggestion cannot be safely pressed. Throughout this discussion of significant numbers it must be borne in mind that writers and teachers may often have been influenced by the desire to aid the memory of those they addressed, and may to that end have arranged thoughts and facts in groups of 3, or 4, or 7, or 10, and so on (Sir John Hawkins, Horae Synopticae2, 166f). They will at the same time have remembered the symbolic force of these numbers, and in some cases, at least, will have used them as round numbers. There are many places in which the round and the symbolic uses of a number cannot be sharply distinguished.<P>VI. Gematria.<P>(Gematriya\'). A peculiar application of numbers which was in great favor with the later Jews and some of the early Christians and is not absolutely unknown to the Bible, is Gematria, that is the use of the letters of a word so as by means of their combined numerical value to express a name, or a witty association of ideas. The term is usually explained as an adaptation of the Greek word geometria, that is, "geometry," but Dalman (Worterbuch, under the word) connects it in this application of it with grammateia. There is only one clear example in Scripture, the number of the beast which is the number of a man, six hundred sixty and six (<a onClick="return mV(\'Rev\',13,18);">Re 13:18</a>). If, as most scholars are inclined to believe, a name is intended, the numerical value of the letters composing which adds up to 666, and if it is assumed that the writer thought in Hebrew or Aramaic. Nero Caesar written with the consonants nun (n) equals 50, resh (r) equals 200, waw (w) equals 6, nun (n) equals 50, qoph (q) equals 100, camekh (c) equals 60, resh (r) equals 200: total equals 666, seems to be the best solution. Perhaps the idea suggested by Dr. Milligan that the 3-fold use of 6 which just falls short of 7, the number of sacred completeness, and is therefore a note of imperfection, may have been also in the writer\'s mind. Some modern scholars find a second instance in <a onClick="return mV(\'Gen\',14,14);">Ge 14:14</a> and <a onClick="return mV(\'Gen\',15,2);">15:2</A>. As the numerical value of the consonants which compose Eliezer in Hebrew add up to 318, it has been maintained that the number is not historical, but has been fancifully constructed by means of gematria out of the name. This strange idea is not new, for it is found in the Midrash on <a onClick="return mV(\'Gen\',43,\'1-\');">Ge 43</a> in the name of a rabbi who lived circa 200 AD, but its antiquity is its greatest merit.<P>LITERATURE.<P>In addition to other books referred to in the course of the article: Hehn, Siebenzahl und Sabbath bei den Babyloniern und im Altes Testament; Konig, Stilistik, Rhetorik, Poetik, etc., 51-57, and the same writer\'s article "Number" in HDB; Sir J. Hawkins, Horae Synopticae2, 163-67; Wiener, Essays in Pentateuchal Criticism, 155-69; "Number" in HDB (1-vol); EB; Jewish Encyclopedia; Smith, DB; "Numbers" in DCG; "Zahlen" in the Dicts. of Wiener, Riehm2, Guthe; "Zahlen" and "Sieben" in RE3.``162';

isbe[6458]='Numbering``<a href="./study/isbe/search.html?string=DAVID">DAVID</a>; <a href="./study/isbe/search.html?string=QUIRINIUS">QUIRINIUS</a>`1';
isbe[6459]='Numbers, Book of`num\'-berz:<P><b>I. TITLE AND CONTENTS</b><P class="in15">1. Title<P class="in15">2. Contents<P><b>II. LITERARY STRUCTURE</b><P class="in15">1. Alleged Grounds of Distribution<P class="in15">2. Objections to Same<P class="in30">(1) Hypothesis Unproved<P class="in30">(2) Written Record Not Impossible<P class="in30">(3) No Book Ever Thus Constructed<P class="in30">(4) Inherent Difficulties of Analysis<P class="in45">(a) The Story of the Spies<P class="in45">(b) Rebellion of Korah<P class="in45">(c) Story of Balaam<P><b>III. HISTORICAL CREDIBILITY</b><P class="in15">1. Seeming Chronological Inaccuracies<P class="in30">(1) The Second Passover (<span class="noTag">Numbers 9:1-5</span>)<P class="in30">(2) The Thirty-seven Years\' Chasm<P class="in30">(3) Fortieth Year<P class="in15">2. So-called Statistical Errors<P class="in30">(1) Number of the Fighting Men<P class="in30">(2) Size of the Congregation<P class="in45">(a) Multiplication of People<P class="in45">(b) Exodus in One Day<P class="in45">(c) Support in Wilderness<P class="in45">(d) Room at Mt. Sinai<P class="in45">(e) Slow Conquest of Canaan<P class="in30">(3) Number of the Firstborn<P class="in15">3. Alleged Physical Impossibilities<P class="in30">(1) Duties of the Priests<P class="in30">(2) Assembling of the Congregation<P class="in30">(3) Marching of the Host<P class="in30">(4) Victory over Midian<P><b>IV. AUTHORSHIP</b><P class="in15">1. Against the Mosaic Authorship<P class="in30">(1) Alternating Use of Divine Names<P class="in30">(2) Traces of Late Authorship<P class="in15">2. For the Mosaic Authorship<P class="in30">(1) Certain Passages Have the Appearance of Having Been Written by Moses<P class="in30">(2) Acquaintance on the Part of the Author with Egyptian Manners and Customs<P><b>LITERATURE</b><hr /><P>I. Title and Contents.<P>1. Title:<P>Styled in the Hebrew Bible bemidhbar, "in the wilderness," from the 5th word in <a onClick="return mV(\'Num\',1,1);">Nu 1:1</a>, probably because of recording the fortunes of Israel in the Sinaitic desert. The 4th book of the Pentateuch (or of the Hexateuch, according to criticism) was designated Arithmoi in the Septuagint, and Numeri in the Vulgate, and from this last received its name "Numbers" in the King James Version, in all 3 evidently because of its reporting the 2 censuses which were taken, the one at Sinai at the beginning and the other on the plains of Moab at the close of the wanderings.<P>2. Contents:<P>Of the contents the following arrangement will be sufficiently detailed:<P>(1) Before leaving Sinai, <a onClick="return mV(\'Num\',1,\'1-\');">Nu 1:1-10:10</a> (a period of 19 days, from the 1st to the 20th of the 2nd month after the exodus), describing:<P class="in15">(a) The numbering and ordering of the people, <a onClick="return mV(\'Num\',1,\'1-\');">Numbers 1-4</a>.<P class="in15">(b) The cleansing and blessing of the congregation, <a onClick="return mV(\'Num\',5,\'1-\');">Numbers 5</a>; <a onClick="return mV(\'Num\',6,\'1-\');">6</a>.<P class="in15">(c) The princes\' offerings and the dedication of the altar, <a onClick="return mV(\'Num\',7,\'1-\');">Numbers 7</a>; <a onClick="return mV(\'Num\',8,\'1-\');">8</a>.<P class="in15">(d) The observance of a second Passover, <a onClick="return mV(\'Num\',9,\'1-14\');">Nu 9:1-14</a>.<P class="in15">(e) The cloud and the trumpets for the march, <a onClick="return mV(\'Num\',9,\'15\');">Nu 9:15</a>-<a onClick="return mV(\'Num\',10,\'1-10\');">10:10</a>.<P>(2) From Sinai to Kadesh, <a onClick="return mV(\'Num\',10,\'11-\');">Nu 10:11-14:45</a> (a period of 10 days, from the 20th to the 30th of the 2nd month), narrating:<P class="in15">(a) The departure from Sinai, <a onClick="return mV(\'Num\',10,\'11-35\');">Nu 10:11-35</a>.<P class="in15">(b) The events at Taberah and Kibroth-hattaavah, <a onClick="return mV(\'Num\',11,\'1-\');">Numbers 11</a>.<P class="in15">(c) The rebellion of Miriam and Aaron, <a onClick="return mV(\'Num\',12,\'1-\');">Numbers 12</a>.<P class="in15">(d) The mission of the spies, <a onClick="return mV(\'Num\',13,\'1-\');">Numbers 13</a>; <a onClick="return mV(\'Num\',14,\'1-\');">14</a>.<P>(3) The wanderings in the desert, <a onClick="return mV(\'Num\',15,\'1-\');">Numbers 15-19</a> (a period of 37 years, from the end of the 2nd to the beginning of the 40th year), recording:<P class="in15">(a) Sundry laws and the punishment of a Sabbath breaker, <a onClick="return mV(\'Num\',15,\'1-\');">Numbers 15</a>.<P class="in15">(b) The rebellion of Korah, <a onClick="return mV(\'Num\',16,\'1-\');">Numbers 16</a>.<P class="in15">(c) The budding of Aaron\'s rod, <a onClick="return mV(\'Num\',17,\'1-\');">Numbers 17</a>.<P class="in15">(d) The duties and revenues of the priests and Levites, <a onClick="return mV(\'Num\',18,\'1-\');">Numbers 18</a>.<P class="in15">(e) The water of separation for the unclean, <a onClick="return mV(\'Num\',19,\'1-\');">Numbers 19</a>.<P>(4) From Kadesh to Moab, <a onClick="return mV(\'Num\',20,\'1-\');">Numbers 20</a>; <a onClick="return mV(\'Num\',21,\'1-\');">21</a> (a period of 10 months, from the beginning of the 40th year), reciting:<P class="in15">(a) The story of Balaam, <a onClick="return mV(\'Num\',22,\'2-\');">Nu 22:2-24:25</a>.<P class="in15">(b) The zeal of Phinehas, <a onClick="return mV(\'Num\',25,\'1-\');">Numbers 25</a>.<P class="in15">(c) The second census, <a onClick="return mV(\'Num\',26,\'1-51\');">Nu 26:1-51</a>.<P class="in15">(d) Directions for dividing the land, <a onClick="return mV(\'Num\',26,\'52-\');">Nu 26:52</A>-<a onClick="return mV(\'Num\',27,\'1-11\');">27:11</a>.<P class="in15">(e) Appointment of Moses\' successor, <a onClick="return mV(\'Num\',27,\'12-23\');">Nu 27:12-23</a>.<P class="in15">(f) Concerning offerings and vows, <a onClick="return mV(\'Num\',28,\'1-\');">Numbers 28-30</a>.<P class="in15">(g) War with Midian, <a onClick="return mV(\'Num\',31,\'1-\');">Numbers 31</a>.<P class="in15">(h) Settlement of Reuben and Gad, <a onClick="return mV(\'Num\',32,\'1-\');">Numbers 32</a>.<P class="in15">(i) List of camping stations, <a onClick="return mV(\'Num\',33,\'1-49\');">Nu 33:1-49</a>.<P class="in15">(j) Canaan to be cleared of its inhabitants and divided, <a onClick="return mV(\'Num\',33,\'50-\');">Nu 33:50-34:29</a>.<P class="in15">(k) Cities of refuge to be appointed, <a onClick="return mV(\'Num\',35,\'1-\');">Numbers 35</a>.<P class="in15">(l) The marriage of heiresses, <a onClick="return mV(\'Num\',36,\'1-\');">Numbers 36</a>.<P>II. Literary Structure.<P>According to modern criticism, the text of Numbers, like that of the other books of the Pentateuch (or Hexateuch), instead of being regarded as substantially the work of one writer (whatever may have been his sources of information and whoever may have been its first or latest editor), should be distributed—not always in solid blocks of composition, but frequently in fragments, in sentences, clauses or words, so mysteriously put together that they cannot now with certainty be separated—among three writers, J, E and P with another D (at least in one part)—these writers, individuals and not schools (Gunkel), belonging, respectively: J to the 9th century BC (circa 830), E to the 8th century BC (circa 750), P to the 5th century BC (circa 444), and D to the 7th century BC (circa 621).<P>1. Alleged Grounds of Distribution:<P>The grounds upon which this distribution is made are principally these:<P>(1) the supposed preferential use of the Divine names, of Yahweh (Yahweh, "Lord") by J, and of Elohim ("God") by E and P—a theory, however, which hopelessly breaks down in its application, as Orr (POT, chapter vii), Eerdmans (St, 33ff) and Wiener (EPC, I) have conclusively shown, and as will afterward appear;<P>(2) distinctions in style of composition, which are not always obvious and which, even if they were, would not necessarily imply diversity of authorship unless every author\'s writing must be uniform and monotonous, whatever his subject may be; and<P>(3) perhaps chiefly a preconceived theory of religious development in Israel, according to which the people in pre-Mosaic times were animists, totemists and polytheists; in Mosaic times and after, henotheists or worshippers of one God, while recognizing the existence of other gods; and latterly, in exilic and post-exilic times, monotheists or worshippers of the one living and true God—which theory, in order to vindicate its plausibility, required the reconstruction of Israel\'s religious documents in the way above described, but which is now rejected by archaeologists (Delitzsch and A. Jeremias) and by theologians (Orr, Baentsch (though accepting the analysis on other grounds) and Konig) as not supported by facts.<P>2. Objections to Same:<P>Without denying that the text-analysis of criticism is on the first blush of it both plausible and attractive and has brought to light valuable information relative to Scripture, or without overlooking the fact that it has behind it the names of eminent scholars and is supported by not a few considerations of weight, one may fairly urge against it the following objections.<P>(1) Hypothesis Unproved.<P>At the best, theory is an unproved and largely imaginary hypothesis, or series of hypotheses—"hypothesis built on hypothesis" (Orr); and nothing more strikingly reveals this than<P>(a) the frequency with which in the text-analysis conjecture ("perhaps" and "probably") takes the place of reasoned proof<P>(b) the arbitrary manner in which the supposed documents are constructed by the critics who, without reason given, and often in violation of their own rules and principles, lift out of J (for instance) every word or clause they consider should belong to E or the Priestly Code (P), and vice versa every word or clause out of E or P that might suggest that the passage should be assigned to J, at the same time explaining the presence of the inconvenient word or clause in a document to which it did not belong by the careless or deliberate action of a redactor; and<P>(c) the failure even thus to construct the documents successfully, most critics admitting that J and E cannot with confidence be separated from each other—Kuenen himself saying that "the attempt to make out a Jehovistic and an Elohistic writer or school of writers by means of the Divine names has led criticism on a wrong way"; and some even denying that P ever existed as a separate document at all, Eerdmans (St, 33, 82), in particular, maintaining, as the result of elaborate exegesis, that P could not have been constructed in either exilic or post-exilic times "as an introduction to a legal work."<P>(2) Written Record Not Impossible.<P>It is impossible to demonstrate that the story of Israel\'s "wanderings" was not committed to writing by Moses, who certainly was not unacquainted with the art of writing, who had the ability, if any man had, to prepare such a writing, whose interest it was, as the leader of his people, to see that such writing, whether done by himself or by others under his supervision, was accurate, and who besides had been commanded by God to write the journeyings of Israel (<a onClick="return mV(\'Num\',33,2);">Nu 33:2</a>). To suppose that for 500 years no reliable record of the fortunes of Israel existed, when during these years writing was practiced in Egypt and Babylon; and that what was then fixed in written characters was only the tradition that had floated down for 5 centuries from mouth to mouth, is simply to say that little or no dependence can be placed upon the narrative, that while there may be at the bottom of it some grains of fact, the main body of it is fiction. This conclusion will not be readily admitted.<P>(3) No Book Ever Thus Constructed.<P>No reliable evidence exists that any book either ancient or modern was ever constructed as, according to criticism, the Pentateuch, and in particular Numbers, was. Volumes have indeed been composed by two or more authors, acting in concert, but their contributions have never been intermixed as those of J, E, D and P are declared to have been; nor, when joint authorship has been acknowledged on the title-page, has it been possible for readers confidently to assign to each author his own contribution. And yet, modern criticism, dealing with documents more than 2,000 years old and in a language foreign to the critics—which documents, moreover, exist only in manuscripts not older than the 10th century AD (Buhl, Canon and Text of the Old Testament, 28), and the text of which has been fixed not infallibly either as to consonant or vowel—claims that it can tell exactly (or nearly so) what parts, whether paragraphs, sentences, clauses or words, were supplied by J, E, P and D respectively. Credat Judaeus Apella!<P>(4) Inherent Difficulties of Analysis.<P>The critical theory, besides making of the text of Numbers, as of the other books of the Pentateuch, such a patchwork as is unthinkable in any document with ordinary pretension to historical veracity, is burdened with inherent difficulties which make it hard to credit, as the following examples taken from Numbers, will show.<P>(a) The Story of the Spies:<P><a onClick="return mV(\'Num\',13,\'1-\');">Numbers 13</a> and <a onClick="return mV(\'Num\',14,\'1-\');">14</A> are thus distributed by Cornill, Driver, Strack and E B:<P>JE, <a onClick="return mV(\'Num\',13,\'17-20\',22,23,24,\'26-33\');">Nu 13:17b-20,22-24,26b-31,32b,33</A>; <a onClick="return mV(\'Num\',14,3,4,8,9,\'11-25\',\'39-45\');">14:3,4,8,9,11-25,39-45</a>.<P>P, <a onClick="return mV(\'Num\',13,\'1-17\',21,25,26);">Nu 13:1-17a,21,25,26a</A> (to Paran), <a onClick="return mV(\'Num\',13,32);">32a</A>; <a onClick="return mV(\'Num\',14,1,2,);">14:1,2</A> (in the main), <a onClick="return mV(\'Num\',14,5,6,7,10,\'26-38\');">5-7,10,26-38</a> (in the main).<P>Kautzsch generally agrees; and Hartford-Battersby in HDB professes ability to divide between J and E.<P>(i) According to this analysis, however, up to the middle of the 5th century BC, either JE began at <a onClick="return mV(\'Num\',13,17);">Nu 13:17b</a>, in which case it wanted both the instruction to search the land and the names of the searchers, both of which were subsequently added from P (assuming it to have been a separate document, which is doubtful); or, if JE contained both the instruction and the names, these were supplanted by <a onClick="return mV(\'Num\',13,\'1-17\');">13:1-17a</A> from P. As the former of these alternatives is hardly likely, one naturally asks why the opening verses of JE were removed and those of P substituted? And if they were removed, what has become of them? Does not the occurrence of Yahweh in <a onClick="return mV(\'Num\',13,\'1-17\');">13:1-17a</A>, on the critical principles of some, suggest that this section is the missing paragraph of JE?<P>(ii) If the JE passages furnish a nearly complete narrative (Driver), why should the late compiler or editor have deemed it necessary to insert two whole verses, <a onClick="return mV(\'Num\',13,21);">13:21</A> and <a onClick="return mV(\'Num\',13,25);">25</A>, and two halves, <a onClick="return mV(\'Num\',13,26);">13:26a</a> and <a onClick="return mV(\'Num\',13,32);">32a</A>, if not because without these the original JE narrative would have been incomplete? <a onClick="return mV(\'Num\',13,21);">Nu 13:21</a> states in general terms that the spies searched the whole land, proceeding as far north as Hamath, after which <a onClick="return mV(\'Num\',13,22);">13:22</A> mentions that they entered the country from the south and went up to Hebron and Eshcol, without at all stating an incongruity (Gray) or implying (Driver) that they traveled no farther north—the reason for specifying the visit to Eshcol being the interesting fact that there the extraordinary cluster of grapes was obtained. <a onClick="return mV(\'Num\',13,25,26);">Nu 13:25,26</a> a relate quite naturally that the spies returned to Kadesh after 40 days and reported what they had found to Moses and Aaron as well as to all the congregation. Without these verses the narrative would have stated neither how long the land had been searched nor whether Moses and Aaron had received any report from their messengers, although <a onClick="return mV(\'Num\',13,26);">13:26b</A> implies that a report was given to some person or persons unnamed. That Moses and Aaron should not have been named in JE is exceedingly improbable. <a onClick="return mV(\'Num\',13,32);">Nu 13:32a</a> is in no way inconsistent with <a onClick="return mV(\'Num\',13,\'26-31\');">13:26b-31</A>, which state that the land was flowing with milk and honey. What <a onClick="return mV(\'Num\',13,32);">13:32a</A> adds is an expression of the exaggerated fears of the spies, whose language could not mean that the land was so barren that they would die of starvation, a statement which would have expressly contradicted <a onClick="return mV(\'Num\',13,27);">13:27</A> (JE)—in which case why should it have been inserted?—but that, notwithstanding its fruitfulness, the population was continually being wasted by internecine wars and the incursions of surrounding tribes. The starvation theory, moreover, is not supported by the texts (<a onClick="return mV(\'Lev\',26,38);">Le 26:38</a>; <a onClick="return mV(\'Eze\',36,13);">Eze 36:13</a>) usually quoted in its behalf.<P>(iii) To argue (Driver) for two documents because Joshua is not always mentioned along with Caleb is not strikingly convincing; while if Joshua is not included among the spies in JE, that is obviously because the passages containing his name have been assigned beforehand to P. But if Joshua\'s name did not occur in JE, why would it have been inserted in the story by a post-exilic writer, when even in <a onClick="return mV(\'Deu\',1,36);">De 1:36</a> Joshua is not expressly named as one of the spies, though again the language in <a onClick="return mV(\'Deu\',1,38);">De 1:38</a> tacitly suggests that both Caleb and Joshua were among the searchers of the land, and that any partition of the text which conveys the impression that Joshua was not among the spies is wrong?<P>(iv) If the text-analysis is as the critics arrange, how comes it that in JE the name Yahweh does not once occur, while all the verses containing it are allocated to P?<P>(b) Rebellion of Korah:<P><a onClick="return mV(\'Num\',16,\'1-\');">Numbers 16</a> and <a onClick="return mV(\'Num\',17,\'1-\');">17</A> are supposed to be the work of "two, if not three," contributors (Driver, Kautzsch)—the whole story being assigned to P (enlarged by additions about which the text analysts are not unanimous), with the exception of <a onClick="return mV(\'Num\',16,1,2,\'12-15\',\'25-34\');">16:1b, 2a, 12-15,25,26,27b-34</A>, which are given to JE, though variations here also are not unknown.<P>It is admitted that the JE verses, if read continuously, make out a story of Dathan and Abiram as distinguished from Korah and his company; that the motives of Dathan and Abiram probably differed from those of Korah and his company, and that Dathan and Abiram were swallowed up by an earthquake, while the 250 incense-offerers were destroyed by fire. To conclude from this, however, that three or even two narratives have been intermixed is traveling beyond the premises.<P>(i) If JE contained more about the conspiracy of the Reubenites, Dathan and Abiram, than has been preserved in the verses assigned to it, what has become of the excised verses, if they are not those ascribed to P; and, if they are not, what evidence exists that P\'s verses are better than the lost verses of JE? And how comes it that in P the Divine name used throughout, with one exception, <a onClick="return mV(\'Num\',16,22);">16:22</A>, is Yahweh, while in JE it occurs only 6 times? (ii) If JE contained only the parts assigned to it and nothing more happened than the Reubenite emeute, why should the Korahite rebellion have been added to it 4 centuries later, if that rebellion never happened? (iii) If the Korahite conspiracy did happen, why should it have been omitted in JE, and nothing whispered about it till after the exile? (iv) If the two conspiracies, ecclesiastical (among the princes) and civil (among the laymen), arose contemporaneously, and the conspirators made common cause with one another, in that there was nothing unusual or contrary to experience. (v) If Moses addressed himself now to Korah and again to Dathan and Abiram, why should not the same document say so? (vi) If Dathan and Abiram were engulfed by an earthquake, and the 250 princes were consumed by fire from the tabernacle, even that does not necessitate two documents, since both events might have occurred together. (vii) It is not certain that P (<a onClick="return mV(\'Num\',16,\'35-42\');">16:35-43</a>) represents Korah as having been consumed by fire, while JE (<a onClick="return mV(\'Num\',16,\'31-33\');">16:31-33</A>) declares he was swallowed up by the earth. At least P (<a onClick="return mV(\'Num\',26,10);">26:10</a>) distinctly states that Korah was swallowed up by the earth, and that only the 250 were consumed by fire.<P>Wherefore, in the face of these considerations, it is not too much to say that the evidence for more documents than one in this story is not convincing.<P>(c) Story of Balaam:<P><a onClick="return mV(\'Num\',22,\'1-\');">Numbers 22-24</a> fare more leniently at the hands of analysis, being all left with JE, except <a onClick="return mV(\'Num\',22,1);">22:1</A>, which is generously handed over to P. Uncertainty, however, exists as to how to partition chapter <a onClick="return mV(\'Num\',22,\'1-\');">22</A> between J and E. Whether all should be given to E because of the almost uniform use of Elohim rather than of Yahweh, with the exception of <a onClick="return mV(\'Num\',22,\'22-35\');">22:22-35a</a>, which are the property of J because of the use of Yahweh (Driver, Kautzsch); or whether some additional verses should not be assigned to J (Cornill, HDB), critics are not agreed. As to <a onClick="return mV(\'Num\',23,\'1-\');">Numbers 23</a> and <a onClick="return mV(\'Num\',24,\'1-\');">24</a>, authorities hesitate whether to give both to J or to E, or chapter <a onClick="return mV(\'Num\',23,\'1-\');">23</A> to E and chapter <a onClick="return mV(\'Num\',24,\'1-\');">24</a> to J, or both to a late redactor who had access to the two sources—surely an unsatisfactory demonstration in this case at least of the documentary hypothesis. Comment on the use of the Divine names in this story is reserved till later.<P>Yet, while declining to accept this hypothesis as proved, it is not contended that the materials in Numbers are always arranged in chronological order, or that the style of composition is throughout the same, or that the book as it stands has never been revised or edited, but is in every jot and tittle the same as when first constructed. In <a onClick="return mV(\'Num\',7,\'1-\');">Numbers 7</a>, e.g., the narrative goes back to the 1st day of the 1st month of the 2nd year, and in chapter <a onClick="return mV(\'Num\',9,\'1-\');">9</a> to the 1st month of the 2nd year, though chapter <a onClick="return mV(\'Num\',1,\'1-\');">1</a> begins with the 1st day of the 2nd month of the 2nd year. There are also legislative passages interspersed among the historical, and poetical among the prosaic, but diversity of authorship, as already suggested, cannot be inferred from either of these facts unless it is impossible for a writer to be sometimes disorderly in the arrangement of his materials; and for a lawgiver to be also a historian, and for a prose writer occasionally to burst into song. Assertions like these, however, cannot be entertained. Hence, any argument for plurality of documents rounded on them must be set aside. Nor is it a fair conclusion against the literary unity of the book that its contents are varied in substance and form and have been subjected, as is probable, to revision and even to interpolations, provided always these revisions and interpolations have not changed the meaning of the book. Whether, therefore, the Book of Numbers has or has not been compiled from preexisting documents, it cannot be justly maintained that the text-analysis suggested by the critics has been established, or that the literary unity of Numbers has been disproved.<P>III. Historical Credibility.<P>Were the narrative in this book written down immediately or soon after the events it records, no reason would exist for challenging its authenticity, unless it could be shown either from the narrative itself or from extraneous sources that the events chronicled were internally improbable, incredible or falsified. Even should it be proved that the text consists of two or more preexisting documents interwoven with one another, this would not necessarily invalidate its truthfulness, if these documents were practically contemporaneous with the incidents they report, and were not combined in such a way as to distort and misrepresent the occurrences they related. If, however, these pre-existing documents were prepared 500 (JE) or 1,000 (P) years after the incidents they narrate, and were merely a fixing in written characters of traditions previously handed down (JE), or of legislation newly invented and largely imaginary (P), it will not be easy to establish their historical validity. The credibility of this portion of the Pentateuch has been assailed on the alleged ground that it contains chronological inaccuracies, statistical errors and physical impossibilities.<P>1. Seeming Chronological Inaccuracies:<P>(1) The Second Passover (<a onClick="return mV(\'Num\',9,\'1-5\');">Numbers 9:1-5</a>)<P>The critical argument is that a contemporary historian would naturally have placed this paragraph before <a onClick="return mV(\'Num\',1,1);">Nu 1:1</a>. The answer is that possibly he would have done so had his object been to observe strict chronological order, which it manifestly was not (see <a onClick="return mV(\'Num\',7,\'1-\');">Numbers 7</a> and <a onClick="return mV(\'Num\',9,\'1-\');">9</A>), and had he when commencing the book deemed it necessary to state that the Israelites had celebrated a second Passover on the legally appointed day, the 14th of the 1st month of the 2nd year. This, however, he possibly at first assumed would be understood, and only afterward, when giving the reason for the supplementary Passover, realized that in after years readers might erroneously conclude that this was all the Passover that had been kept in the 2nd year. So to obviate any such mistaken inference, he prefixed to his account of the Little Passover, as it is sometimes called, a statement to the effect that the statutory ordinance, the Great Passover, had been observed at the usual time, in the usual way, and that, too, in obedience to the express commandment of Yahweh.<P>(2) The Thirty-seven Years\' Chasm.<P>Whether <a onClick="return mV(\'Num\',20,1);">Nu 20:1</a> be considered the beginning of the 3rd or of the 40th year, in either case a period of 37 years is passed over—in the one case in almost unbroken silence; in the other with scarcely anything of moment recorded save Korah\'s rebellion and the publication of a few laws concerning offerings to be made when the people reached the land of their habitation. To pronounce the whole book unhistorical because of this long interval of absolute or comparative silence (Bleek) is unreasonable. Most histories on this principle would be cast into the wastebasket. Besides, a historian might have as good reason for passing over as for recording the incidents of any particular period. And this might have been the case with the author of Numbers. From the moment sentence of death was passed upon the old generation at Kadesh, till the hour when the new generation started out for Canaan, he may have counted that Israel had practically ceased to be the people of Yahweh, or at least that their fortunes formed no part of the history of Yahweh\'s kingdom; and it is noticeable that scarcely had the tribes reassembled at Kadesh in preparation for their onward march than Miriam and Aaron, probably the last of the doomed generation, died. Accordingly, from this point on, the narrative is occupied with the fortunes of the new generation. Whether correct or not, this solution of the 37 years\' silence (Kurtz) is preferable to that which suggests (Ewald) that the late compiler, having found it impossible to locate all the traditions he had collected into the closing years of the wanderings, placed the rest of them in the first 2 years, and left the interval a blank—a solution which has not even the merit of being clever and explains nothing. It does not explain why, if the narrator was not writing history, there should have been an interval at all. A romancer would not have missed so splendid an opportunity for exercising his art, would not have left a gap of 37 years unfilled, but like the writers of the apocryphal Gospels would have crowded it with manufactured tales.<P>On the better theory, not only is the silence explained, but the items inserted are accounted for as well. Though the unbelieving generation had ceased to be the people of Yahweh, Aaron had not yet been sentenced to exclusion from the promised land, He was still one of the representatives of the kingdom of Yahweh, and Korah\'s rebellion practically struck a blow at that kingdom. As such it was punished, and the story of its breaking out and suppression was recorded, as a matter that vitally concerned the stability of the kingdom. For a like reason, the legislative sections were included in the narrative. They were Yahweh\'s acts and not the people\'s. They were statutes and ordinances for the new generation in the new land.<P>(3) Fortieth Year.<P>The events recorded as having taken place between the 1st of the 5th month (the date of Aaron\'s death) and the 1st of the 11th month (the date of Moses\' address) are so numerous and important as to render it impossible, it is said, to maintain the credibility of this portion of the narrative. But<P>(a) it is not certain that all the events in this section were finished before Moses began his oration; neither<P>(b) is it necessary to hold that they all occurred in succession; while<P>(c) until the rapidity with which events followed one another is ascertained, it will not be possible to decide whether or not they could all have been begun and finished within the space of 6 months.<P>2. So-called Statistical Errors:<P>(1) Number of the Fighting Men.<P>This, which may be set down roughly at 600,000, has been challenged on two grounds:<P>(a) that the number is too large, and<P>(b) that the censuses at Sinai and in Moab are too nearly equal.<P>The first of these objections will be considered in the following section when treating of the size of the congregation. The second will not appear formidable if it be remembered<P>(a) that it is neither impossible nor unusual for the population of a country to remain stationary for a long series of years;<P>(b) that there was a special fitness in Israel\'s ease that the doomed generation should be replaced by one as nearly as possible equal to that which had perished;<P>(c) that had the narrative been invented, it is more than likely that the numbers would have been made either exactly equal or more widely divergent; and<P>(d) that so many variations occurring in the strength of the tribes as numbered at Sinai and again in Moab, while the totals so nearly correspond, constitutes a watermark of truthfulness which should not be overlooked.<P>(2) Size of the Congregation.<P>Taking the fighting men at 600,000 and the whole community at 4 1/2 times that number, or about 2 1/2 millions, several difficulties emerge which have led to the suggestion (Eerdmans, Conder, Wiener) that the 600,000 should be reduced (to, say, 6,000), and the entire population to less than 30,000. The following alleged impossibilities are believed to justify this reduction:<P>(a) that of 70 families increasing to 2 1/2 millions between the descent into, and the departure from, Egypt;<P>(b) that of 2 1/2 millions being led out of Egypt in one day;<P>(c) that of obtaining support for so large a multitude with their flocks in the Sinaitic desert;<P>(d) that of finding room for them either before the Mount at Sinai, or in the limited territory of Palestine; and<P>(e) that of the long time it took to conquer Palestine if the army was 600,000 strong.<P>(a) Multiplication of People:<P>As to the possibility of 70 souls multiplying in the course of 215 years or 7 generations (to take the shorter interval rather than the longer of 430 years) into 2 1/2 millions of persons giving 600,000 fighting men, that need not be regarded as incredible till the rate of increase in each family is exactly known. Allowing to each of Jacob\'s grandsons who were married (say 51 out of 53), 4 male descendants (Colenso allows 4 1/2), these would in 7 generations—not in 4 (Colenso)—amount to 835,584, and with surviving fathers and grandfathers added might well reach 900,000, of whom 600,000 might be above 20 years of age. But in point of fact, without definite data about the number of generations, the rates of birth and of mortality in each generation, all calculations are at the best problematical. The most that can be done is to consider whether the narrative mentions any circumstances fitted to explain this large number of fighting men and the great size of the congregation, and then whether the customary objections to the Biblical statement can be satisfactorily set aside.<P>As for corroborative circumstances, the Bible expressly states that during the years of the oppression the Hebrews were extraordinarily fruitful, and that this was the reason why Pharaoh became alarmed and issued his edict for the destruction of the male children. The fruitfulness of the Hebrews, however, has been challenged (Eerdmans, Verger schichte Israels, 78) on the ground that were the births so numerous as this presupposes, two midwives (<a onClick="return mV(\'Exd\',1,15);">Ex 1:15</a>) would not have sufficed for the necessary offices. But if the two to whom Pharaoh spake were the superintendents of the midwives throughout Goshen, to whom the king would hardly address himself individually, or if they were the two officiating in Hellopolls, the statement in <a onClick="return mV(\'Exd\',1,15);">Ex 1:15</a> will appear natural enough, and not opposed to the statement in <a onClick="return mV(\'Exd\',1,10);">Ex 1:10</a> that Pharaoh was alarmed at the multiplication of the Hebrews in his land. And, indeed, if the Hebrews were only 30,000 strong, it is not easy to see why the whole might of Egypt could not have kept them in subjection. Then as to the congregation being 2 1/2 millions if the 2 fighting men were 600,000, that corresponds with the proportion which existed among the Helvetii, who had 92,000 men capable of bearing arms out of a population, including children, old men and women, of 368,000 souls (Caesar, BG, i, 20). This seems to answer the objection (Eerdmans, Vorgeschichte Israels, 78) that the unschooled Oriental is commonly addicted to exaggeration where numbers are concerned.<P>(b) Exodus in One Day:<P>The second difficulty would be serious were it necessary to suppose that the Israelites had never heard about their projected journey till the 14th of the 1st month. But the idea of going forth from Egypt must have been before them since the day Moses went to Pharaoh to demand their liberation; and at least 4 days before the 14th they had begun to prepare for departure. In circumstances such as these, with a people thirsting for liberty and only waiting the signal to move, aware also of the hour at which that signal would be given, namely, at midnight, it does not appear so formidable a task as is imagined to get them all assembled in one day at a fore-appointed rendezvous, more especially as they were not likely to delay or linger in their movements. But how could there have been 2 1/2 millions of fugitives, it is asked (Eerdmans, Wiener), if Pharaoh deemed 600 chariots sufficient for pursuit? The answer is that Pharaoh did not reckon 600 chariots sufficient, but in addition to these, which were "chosen chariots," he took all the chariots of Egypt, his horsemen and his army (<a onClick="return mV(\'Exd\',14,7,9);">Ex 14:7,9</a>), which were surely adequate to overcome a weaponless crowd, however big it might be. And that it was big, a vast horde indeed, Pharaoh\'s host implies.<P>(c) Support in Wilderness:<P>The supposed difficulty of obtaining support for 2 1/2 millions of people with the flocks and herds in the Sinaitic desert takes for granted that the desert was then as barren a region as it is now, which cannot be proved, and is as little likely to be correct as it would be to argue that Egypt, which was then the granary of the world, was no more fertile than it was 10 years ago, or that the regions in which Babylon and Assyria were situated were as desolate then as they are now. This supposition disregards the fact that Moses fed the flocks of Jethro for 40 years in that same region of Sinai; that when the Israelites passed through it, it was inhabited by several powerful tribes. It overlooks, too, the fact that the flocks and herds of Israel were not necessarily all cooped up in one spot, but were most likely spread abroad in districts where water and vegetation could be found. And it ignores the statement in the narrative that the Israelites were not supplied exclusively by the produce of the desert, but had manna from heaven from the 1st day of the 2nd month after leaving Egypt till they reached Canaan. Rationalistic expositors may relegate this statement to the limbo of fable, but unless the supernatural is to be eliminated altogether from the story, this statement must be accorded its full weight. So must the two miraculous supplies of water at Horeb (<a onClick="return mV(\'Exd\',17,\'1-\');">Ex 17</a>) and at Kadesh (<a onClick="return mV(\'Num\',20,\'1-\');">Nu 20</a>) be treated. It is sometimes argued that these supplies were quite insufficient for 2 1/2 millions of people with their flocks and herds; and that therefore the congregation could not have been so large. But the narrative in Numbers states, and presumably it was the same in Exodus, that the smitten rock poured forth its water so copiously and so continuously that \'the people drank abundantly with their flocks.\' Wherefore no conclusion can be drawn from this against the reported size of the congregation.<P>(d) Room at Mt. Sinai:<P>As to the impossibility of finding room for 2 1/2 millions of people either before the Mount at Sinai or within the land of Canaan (Conder), few will regard this as self-evident. If the site of their encampment was the Er-Rahab plain (Robinson, Stanley)—though the plain of Sebayeh, admittedly not so roomy, has been mentioned (Ritter, Kurtz, Knobel)—estimates differ as to the sufficiency of accommodation to be found there. Conder gives the dimensions of the plain as 4 square miles, which he deems insufficient, forgetting, perhaps, that "its extent is farther increased by lateral valleys receding from the plain itself" (Forty Days in the Desert, 73; compare Keil on <a onClick="return mV(\'Exd\',19,1,2);">Ex 19:1,2</a>). Kalisch, though putting the size of the plain at a smaller figure, adds that "it thus furnished ample tenting ground for the hosts of Israel"—a conclusion accepted by Ebers, Riehm and others. In any case it seems driving literal interpretation to extreme lengths to hold that camping before the Mount necessarily meant that every member of the host required to be in full view of Sinai. As to not finding room in Canaan, it is doubtful if, after the conquest, the remnants of both peoples at any time numbered as many persons as dwelt in Palestine during the most flourishing years of the kingdom. It may well be that the whole population of Palestine today amounts to only about 600,000 souls; but Palestine today under Turkish rule is no proper gauge for judging of Palestine under David or even under Joshua.<P>(e) Slow Conquest of Canaan:<P>The long time it took to conquer Palestine (Eerdmans, Vorgeschichte Israels, 78) is no solid argument to prove the unreliable character of the statement about the size of the army, and therefore of the congregation. Every person knows that in actual warfare, victory does not always go with the big battalions; and in this instance the desert-trained warriors allowed themselves to be seduced by the idolatries and immoralities of the Canaanites and forgot to execute the commission with which they had been entrusted, namely, to drive out the Canaanites from the land which had been promised to their fathers. Had they been faithful to Yahweh, they would not have taken so long completely to possess the land (<a onClick="return mV(\'Psa\',81,13,14);">Ps 81:13,14</a>). But if instead of having 600,000 stalwart soldiers they had only possessed 6,000, it is not difficult to see how they could not drive out the Canaanites. The difficulty is to perceive how they could have achieved as much as they did.<P>(3) Number of the Firstborn.<P>That the 22,273 firstborn males from 1 month old and upward (<a onClick="return mV(\'Num\',3,43);">Nu 3:43</a>) is out of all proportion to the 603,550 men of 20 years old and upward, being much too few, has frequently (Bleek, Bohlen, Colenso and others) been felt as a difficulty, since it practically involves the conclusion that for every firstborn there must have been 40 or 45 males in each family. Various solutions of this difficulty have been offered. The prevalence of polygamy has been suggested (Michaelis, Havernick). The exclusion of firstborn sons who were married, the inclusion only of the mother\'s firstborn, and the great fruitfulness of Hebrew mothers have been called in to surmount the difficulty (Kurtz). But perhaps the best explanation is that only those were counted who were born after the Law was given on the night of the departure from Egypt (<a onClick="return mV(\'Exd\',13,2);">Ex 13:2</a>; <a onClick="return mV(\'Num\',3,13);">Nu 3:13</a>; <a onClick="return mV(\'Num\',8,17);">8:17</a>) (Keil, Delitzsch, Gerlach). It may be urged, of course, that this would require an exceptionally large number of births in the 13 months; but in the exceptionally joyous circumstances of the emancipation this might not have been impossible. In any case, it does not seem reasonable on account of this difficulty, which might vanish were all the facts known, to impeach the historical accuracy of the narrative, even in this particular.<P>(NOTE.—In Scotland, with a population of nearly double that of the Israelites, namely, 4,877,648, the marriages in 1909 were 30,092, the lowest on record for 55 years. At this rate the births in Israel during the first 12 months after the exodus might have been 15,046, assuming each marriage to have had issue. As this marriage rate, however, is excessively low for Scotland in normal years, the number of marriages and therefore of births in Israel in the first year after the exodus may well have been twice, if not 3 times, 15,046, i.e. 30,092, or 45,138. Reckoning the half of these as males, namely, 15,046 or 22,569, it does not appear as if the number of the firstborn in the text were quite impossible, on the supposition made.)<P>3. Alleged Physical Impossibilities:<P>(1) Duties of the Priests.<P>These are supposed to have been so onerous that Aaron and his sons could not possibly have performed them. But<P>(a) the Levitical laws, though published in the desert, were not necessarily intended to receive full and minute observance there, but only in Canaan.<P>(b) In point of fact, as Moses afterward testified (<a onClick="return mV(\'Deu\',12,8);">De 12:8</a>), the Levitical laws were not scrupulously kept in the wilderness.<P>(c) There is no reason to suppose that the Passover of the 2nd year was celebrated otherwise than it had been in Egypt before the exodus, the slaughtering of the lambs being performed by the heads of families. And<P>(d) as the Levites were set apart to minister to the tabernacle (<a onClick="return mV(\'Num\',1,50);">Nu 1:50</a>), they would be able in many ways to assist the priests.<P>(2) Assembling of the Congregation.<P>The assembling of the congregation at the door of the tabernacle (<a onClick="return mV(\'Num\',10,3,4);">Nu 10:3,4</a>) has been adduced as another physical impossibility; and no doubt it was if every man, woman and child, or even only every man was expected to be there; but not if the congregation was ordinarily represented by its "renowned" or "called" men, princes of the tribes of their fathers, heads of thousands of Israel (<a onClick="return mV(\'Num\',1,16);">Nu 1:16</a>). To suppose that anything else was meant is surely not required. When Moses called all Israel and spake unto them (<a onClick="return mV(\'Deu\',5,1);">De 5:1</a>; <a onClick="return mV(\'Deu\',29,2);">29:2</a>), no intelligent person understands that he personally addressed every individual, or spoke so as to be heard by every individual, though what he said was intended for all. An additional difficulty in the way of assembling the congregation, and by implication an argument against the size of the congregation, has been discovered in the two silver trumpets which, it is contended, were too few for summoning so vast a host as 2 1/2 millions of people. But it is not stated in the narrative either<P>(a) that it was absolutely necessary that every individual in the camp should hear the sound of the trumpets any more than it was indispensable that Balaam\'s curse should re-echo to the utmost bounds of Israel (<a onClick="return mV(\'Num\',23,13);">Nu 23:13</a>), or that a public proclamation by a modern state, though prefaced by means of an "Oyez," should be heard by all within the state or even within its capital; or<P>(b) if it was necessary that everyone should hear, that the trumpeters could not move about through the camp but must remain stationary at the tabernacle door; or<P>(c) that in the clear air of the desert the sound of the trumpets would not travel farther than in the noisy and murky atmosphere of modern cities; or<P>(d) that should occasion arise for more trumpets than two, Moses and his successors were forbidden to make them.<P>(3) Marching of the Host.<P>The marching of the host in four main divisions of about half a million each (<a onClick="return mV(\'Num\',2,\'1-\');">Nu 2</a>; <a onClick="return mV(\'Num\',10,\'14-20\');">10:14-20</a>) has also been pronounced a stumbling-block (Colenso, Eerdmans, Doughty), inasmuch as the procession formed (i.e. if no division began to fall into line till its predecessor had completed its evolutions) would require the whole day for its completion, and would make a column of unprecedented length—of 22 miles (Colenzo), of 600 miles (Doughty)—and would even on the most favorable hypothesis travel only a few miles, when the whole line would again need to reconstruct the camp. The simple statement of this shows its absurdity as an explanation of what actually took place on the march, and indirectly suggests that the narrative may be historical after all, as no romancer of a late age would have risked his reputation by laying down such directions for the march, if they were susceptible of no other explanation than the above. How precisely the march was conducted may be difficult or even impossible to describe in such a way as to obviate all objections. But some considerations may be advanced to show that the march through the desert was neither impossible nor incredible.<P>(a) The deploying of the four main divisions into line may have gone on simultaneously, as they were widely apart from each other, on the east (Judah), on the south (Reuben), on the west (Ephraim) and on the north (Dan).<P>(b) There is no ground for thinking that the march would be conducted, at least at first, with the precision of a modern army, or that each division would extend itself to the length of 22 miles. It is more than likely that they would follow their standards as best they could or with such order as could be arranged by their captains.<P>(c) If the camps of Judah and Reuben started their preparations together, say at 6 o\'clock in the morning (which might be possible), and occupied 4 hours in completing these, they might begin to advance at 10 o\'clock and cover 10 miles in another 4 hours, thus bringing them on to 2 PM, after which 4 hours more would enable them to encamp themselves for the night, if that was necessary. The other two divisions falling into line, say at 2 o\'clock, would arrive at 6 PM, and by 10 PM would be settled for the night.<P>(d) It does not seem certain that every night upon the march they would arrange themselves into a regularly constructed camp; rather it is reasonable to conclude that this would be done only when they had reached a spot where a halt was to be made for some time.<P>(e) In any case, in the absence of more details as to how the march was conducted, arithmetical calculations are of little value and are not entitled to discredit the truthfulness of the narrative.<P>(4) Victory over Midian.<P>This has been objected to on moral grounds which are not now referred to. It is the supposed impossibility of 12,000 Israelites slaying all the male Midianites, capturing all their women and children, including 32,000 virgins, seizing all their cattle and flocks, with all their goods, and burning all their cities and castles without the loss of a single man (<a onClick="return mV(\'Num\',31,49);">Nu 31:49</a>), which occasions perplexity. Yet Scripture relates several victories of a similar description, as e.g. that of Abraham over the kings of the East (<a onClick="return mV(\'Gen\',14,15);">Ge 14:15</a>), in which, so far as the record goes, no loss was incurred by the patriarch\'s army; that of Gideon\'s 300 over the Midianites at a later date (<a onClick="return mV(\'Jdg\',7,22);">Jud 7:22</a>); that of Samson single-handed over 1,000 Philistines (<a onClick="return mV(\'Jdg\',15,15);">Jud 15:15</a>); and that of Jehoshaphat at the battle of Tekoa (<a onClick="return mV(\'2Ch\',20,24);">2Ch 20:24</a>), which was won without a blow—all more or less miraculous, no doubt. But in profane history, Tacitus (Ann. xiii.39) relates an instance in which the Romans slaughtered all their foes without losing a single man; and Strabo (xvi.1128) mentions a battle in which 1,000 Arabs were slain by only 2 Romans; while the life of Saladin contains a like statement concerning the issue of a battle (Havernick, Intro, 330). Hence, Israel\'s victory over Midian does not afford sufficient ground for challenging its historic credibility.<P>IV. Authorship.<P>Restricting attention to evidence from Numbers itself, it may be remarked in a general way that the question of authorship is practically settled by what has been advanced on its literary structure and historical credibility. For, if the materials of the book were substantially the work of one pen (whoever may have been their first collector or last redactor), and if these materials are upon the whole trustworthy, there will be little room to doubt that the original pen was in the hand of a contemporary and eyewitness of the incidents narrated, and that the contemporary and eyewitness was Moses, who need not, however, have set down everything with his own hand, all that is necessary to justify the ascription of the writing to him being that it should have been composed by his authority and under his supervision. In this sense it is believed that indications are not wanting in the book both against and for the Mosaic authorship; and these may now be considered.<P>1. Against the Mosaic Authorship:<P>(1) Alternating Use of Divine Names. This usage, after forming so characteristic a feature in Genesis and largely disappearing in Exodus and Leviticus, reasserts itself in Numbers, and more particularly in the story of Balaam. If <a onClick="return mV(\'Num\',23,\'1-\');">Numbers 23</a> and <a onClick="return mV(\'Num\',24,\'1-\');">24</A> can be explained only as late documents pieced together, because of the use of "God" in chapter <a onClick="return mV(\'Num\',23,\'1-\');">23</A> and of "Lord" in chapter <a onClick="return mV(\'Num\',24,\'1-\');">24</A>, then Moses was not their author. But if the varying use of the divine names is susceptible of explanation on the assumption that the two chapters originally formed one document, then most distinctly the claim of Moses to authorship is not debarred. Now whether Balaam was a false or a true prophet, it is clear that he could hope to please Balak only by cursing Israel in the name of Yahweh, the God \'Elohim of Israel; and so it is always Yahweh he consults or pretends to consult before replying to the messengers of Balak. Four times he did so (<a onClick="return mV(\'Num\',22,8,19);">22:8,19</a>; <a onClick="return mV(\'Num\',23,3,15);">23:3,15</a>); and 3 times it was Elohim who met him (<a onClick="return mV(\'Num\',22,9,20);">22:9,20</A>; <a onClick="return mV(\'Num\',23,14);">23:14</A>), while every time it was Yahweh who put the word in his mouth. Can any conclusion be fairer than that the historian regarded \'Elohim and Yahweh as the same Divine Being, and represented this as it were by a double emphasis, which showed<P>(a) that the Yahweh whom Balaam consulted was Elohim or the supreme God, and<P>(b) that the God who met Balaam and supplied him with oracles was Israel\'s Lord? Thus explained, the alternate use of the Divine names does not require the hypothesis of two single documents rolled into one; and indeed the argument from the use of the divine names is now generally abandoned.<P>(2) Traces of Late Authorship.<P>Traces of late authorship are believed to exist in several passages:<P>(a) <a onClick="return mV(\'Num\',15,\'32-36\');">Nu 15:32-36</a> seems to imply that the writer was no longer in the wilderness, which may well have been the case, if already he was in the land of Moab.<P>(b) <a onClick="return mV(\'Num\',20,5);">20:5</A> suggests, it is said, that the people were then in Canaan. But the language rather conveys the impression that they were not yet come to Canaan; and in point of fact the people were at Kadesh in the wilderness of Zin.<P>(c) In <a onClick="return mV(\'Num\',21,14,15,17,18,\'27-30\');">21:14,15,17,18,27-30</a>, certain archaic songs are cited as if the people were familiar with them, and the Arnon is mentioned as the border of Moab long before Israel reached the river. But that poets were among the people at the time of the exodus and probably long before, the song of Moses (<a onClick="return mV(\'Exd\',15,\'1-\');">Ex 15</a>) shows, and that a Book of the Wars of the Lord was begun to be composed soon after the defeat of Amalek is not an unreasonable hypothesis (<a onClick="return mV(\'Exd\',17,14);">Ex 17:14</a>). As for the statement that "Arnon leaneth upon the borders of Moab," that may have been superfluous as a matter of information to the contemporaries of Moses when they were about to cross the stream (Strack, Einl, 25), but it was quite in place in an old prophetic song, as showing that their present position had been long before anticipated and foretold.<P>(d) <a onClick="return mV(\'Num\',23,7);">24:7</A>, according to criticism, could not have been composed before the rise of the monarchy; and certainly it could not, if prediction of future events is impossible. But if reference to a coming king in Israel was put into Balaam\'s mouth by the Spirit of God, as the narrator says, then it could easily have been made before the monarchy; and so could<P>(e) <a onClick="return mV(\'Num\',24,17,18);">24:17,18</a> have been written before the reign of David, though the conquest of the Edomites only then began (<a onC
