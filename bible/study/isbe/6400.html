isbe[6429]='Nob`nob (nobh; Codex Vaticanus Nomba; Codex Alexandrinus Noba, and other forms): An ancient priestly town to which David came on his way south when he fled from Saul at Gibeah (<a onClick="return mV(\'1Sa\',21,1);">1Sa 21:1</a>). Here he found refuge and succor with Ahimelech. This was observed by Doeg the Edomite, who informed the king, and afterward became the instrument of Saul\'s savage vengeance on the priests, and on all the inhabitants of the city (<a onClick="return mV(\'1Sa\',22,\'1-\');">1Sa 22</a>). The name occurs in <a onClick="return mV(\'Neh\',11,32);">Ne 11:32</a> in a list of cities, immediately after Anathoth. In Isaiah\'s ideal account of the Assyrians\' march against Jerusalem, Nob is clearly placed south of Anathoth. Here, says the prophet, the Assyrian shall shake his hand at the mount of the daughter of Zion, the hill of Jerusalem. It was a place, therefore, from which the Holy City and the temple were clearly visible.<P>The district in which the site must be sought is thus very definitely indicated; but within this district no name at all resembling Nob has been discovered, and so no sure identification is yet possible. \'Anata (Anathoth) <span class="noTag">is</span> 2 1/2 miles northeast of Jerusalem. Nob therefore lay between that and the city, at a point where the city could be seen, apparently on the great road from the Nob. Rather more than a mile north of Jerusalem rises the ridge Ras el-Mesharif (2,665 ft.), over which the road from the Nob passes; and here the traveler approaching from that direction obtains his first sight of the city. It is fittingly named "the look-out." Col. Conder states the case for identifying this height with Mt. Scopus where Titus established his camp at the siege of Jerusalem (PEFS, 1874, 111ff). Immediately south of the ridge, to the east of the road, there is a small plateau, south of which there is a lower ridge, whence the slopes dip into Wady el-Joz. This plateau, on which Titus may have sat, is a very probable site for Nob. It quite suits the requirements of Isaiah\'s narrative, and not less those of David\'s flight. Gibeah lay not far to the north, and this lay in the most likely path to the south.``54';
isbe[6430]='Nobah`no\'-ba (nobhah; Codex Vaticanus Naboth, Nabai; Codex Alexandrinus Naboth, Nabeth):<P>(1) Nobah the Manassite, we are told, "went and took Kenath, and the villages thereof, and called it Nobah, after his own name" (<a onClick="return mV(\'Num\',32,42);">Nu 32:42</a>). There can be little doubt that the ancient Kenath is represented by the modern Qanawat, on the western slope of Jebel ed-Druze, the ancient name having survived that of Nobah.<P>(2) A city which marked-the course of Gideon\'s pursuit of the Midianites (<a onClick="return mV(\'Jdg\',8,11);">Jud 8:11</a>). It is possible that this may be identical with (1). Cheyne argues in favor of this (Encyclopaedia Biblica, under the word "Gideon"). But its mention along with Jogbehah points to a more southerly location. This may have been the original home of the clan Nobah. Some would read, following the Syriac in <a onClick="return mV(\'Num\',21,30);">Nu 21:30</a>, "Nobah which is on the desert," instead of "Nophah which reacheth unto Medeba." No site with a name resembling this has yet been recovered. If it is to be distinguished from Kenath, then probably it will have to be sought somewhere to the northeast of Rabbath-Ammon (\'Amman).``54';
isbe[6431]='Nobai`no\'-bi, nob\'-a-i (nobhay, or nebhay): One of those who took part in sealing the covenant (<a onClick="return mV(\'Neh\',10,19);">Ne 10:19</a>).``1';
isbe[6432]='Noble; Nobles; Nobleman`no\'-b\'-l, no\'-b\'-lz, no\'-b\'-l-man (chorim, \'addir; eugenes, Kratistos, basilikos): "Nobles" is the translation of the Hebrew chorim (occurring only in the plural), "free-born," "noble" (<a onClick="return mV(\'1Ki\',21,8,11);">1Ki 21:8,11</a>; <a onClick="return mV(\'Neh\',2,16);">Ne 2:16</a>; <a onClick="return mV(\'Neh\',6,17);">6:17</a>, etc.); of \'addir, "begirded," "mighty," "illustrious" or "noble" (<a onClick="return mV(\'Jdg\',5,13);">Jud 5:13</a>; <a onClick="return mV(\'2Ch\',23,20);">2Ch 23:20</a>, etc.); of nadhibh, "liberal," "a noble" (<a onClick="return mV(\'Num\',21,18);">Nu 21:18</a>; <a onClick="return mV(\'Pro\',8,16);">Pr 8:16</a>, etc.).<P>Other words are gadhol, "great" (<a onClick="return mV(\'Jon\',3,7);">Jon 3:7</a>); yaqqir, Aramaic "precious" (<a onClick="return mV(\'Ezr\',4,10);">Ezr 4:10</a>); naghidh, "a leader" (<a onClick="return mV(\'Job\',29,10);">Job 29:10</a>); partemim, "foremost ones" (<a onClick="return mV(\'Est\',1,3);">Es 1:3</a>; <a onClick="return mV(\'Est\',6,9);">6:9</a>); atsilim, "those near," "nobles" (<a onClick="return mV(\'Exd\',24,11);">Ex 24:11</a>); bariah, "fugitive" (<a onClick="return mV(\'Isa\',43,14);">Isa 43:14</a>); kabhedh, "weighty," "honored" (<a onClick="return mV(\'Psa\',149,8);">Ps 149:8</a>); eugenes, "wellborn" (<a onClick="return mV(\'Act\',17,11);">Ac 17:11</a>; <a onClick="return mV(\'1Cr\',1,26);">1Co 1:26</a>); kratistos, "strongest," "most powerful" (<a onClick="return mV(\'Act\',24,3);">Ac 24:3</a>; <a onClick="return mV(\'Act\',26,25);">26:25</a>).<P>The Apocrypha, the King James Version and the Revised Version (British and American), still further enlarges the list. In the Revised Version (British and American) we have megistanes, "great ones" (1Esdras 1:38; 8:26, with entimos, "in honor"; The <span class="noTag">Wisdom of Solomon 18:12</span>). Otherwise the Revised Version\'s uses of "noble," and "nobleness" are for words containing the root genitive and referring to birth (compare The <span class="noTag">Wisdom of Solomon 8:3</span>; 2Macc 6:27,31; 12:42; 14:42 twice). The King James Version\'s uses are wider (Judith 2:2, etc.).<P>Nobleman is, in <a onClick="return mV(\'Luk\',19,12);">Lu 19:12</a>, the translation of eugenes anthropos, "a man well born," and in <a onClick="return mV(\'Jhn\',4,46,49);">Joh 4:46,49</a> of basilikos, "kingly," "belonging to a king," a designation extended to the officers, courtiers, etc., of a king, the Revised Version margin "king\'s officer"; he was probably an official, civil or military, of Herod Antipas, who was styled "king" (basileus).<P>For "nobles" (<a onClick="return mV(\'Isa\',43,14);">Isa 43:14</a>), the King James Version "have brought down all their nobles," the Revised Version (British and American) has "I will bring down all of them as fugitives," margin "or, as otherwise read, all their nobles even," etc.; for "nobles" (<a onClick="return mV(\'Jer\',30,21);">Jer 30:21</a>), "prince"; the English Revised Version has "worthies" for "nobles" (<a onClick="return mV(\'Nah\',3,18);">Na 3:18</a>); the Revised Version (British and American) has "the noble" for "princes" (<a onClick="return mV(\'Pro\',17,26);">Pr 17:26</a>): "nobles" for "princes" (<a onClick="return mV(\'Job\',34,18);">Job 34:18</a>; <a onClick="return mV(\'Dan\',1,3);">Da 1:3</a>), for "Nazarites" (<a onClick="return mV(\'Lam\',4,7);">La 4:7</a>, margin "Nazirites"); "her nobles" for "his fugitives," margin "or, as other otherwise read, fugitives" (<a onClick="return mV(\'Isa\',15,5);">Isa 15:5</a>); the American Standard Revised Version has "noble" for "liberal" (<a onClick="return mV(\'Isa\',32,5);">Isa 32:5</a>); for "The nobles held their peace," the King James Version margin "The voice of the nobles was hid" (<a onClick="return mV(\'Job\',29,10);">Job 29:10</a>), the Revised Version (British and American) has "The voice of the nobles was hushed," margin "Hebrew: hid"; for "most noble" (<a onClick="return mV(\'Act\',24,3);">Ac 24:3</a>; <a onClick="return mV(\'Act\',26,25);">26:25</a>), "most excellent."``185';
isbe[6433]='Nod`nod (nodh): The land of Eden, to which Cain migrated after the murder of his brother and his banishment by Yahweh (<a onClick="return mV(\'Gen\',4,16);">Ge 4:16</a>). Conjecture is useless as to the region intended. The ideas of China, India, etc., which some have entertained, are groundless. The territory was evidently at some distance, but where is now undiscoverable.``1';
isbe[6434]='Nodab`no\'-dab (nodhabh; Nadabaioi): A Hagrite clan which, along with Jetur and Naphish, suffered complete defeat at the hands of the trans-Jordanic Israelites (<a onClick="return mV(\'1Ch\',5,19);">1Ch 5:19</a>). It has been suggested that Nodab is a corruption of Kedemah or of Nebaioth, names which are associated with Jetur and Naphish in the lists of Ishmael\'s sons (<a onClick="return mV(\'Gen\',25,15);">Ge 25:15</a>; <a onClick="return mV(\'1Ch\',1,31);">1Ch 1:31</a>), but it is difficult to see how even the most careless copyist could so blunder. There is a possible reminiscence of the name in Nudebe, a village in the Chauran.``1';
isbe[6435]='Noe`no\'-e (Noe): the King James Version of <a onClick="return mV(\'Mat\',24,37,38);">Mt 24:37,38</a>; <a onClick="return mV(\'Luk\',3,36);">Lu 3:36</a>; <a onClick="return mV(\'Luk\',17,26,27);">17:26,27</a>; Tobit 4:12. Greek form of <a href="./study/isbe/search.html?string=NOAH">NOAH</a> (which see) (thus the Revised Version (British and American)).``1';
isbe[6436]='Noeba`no\'-e-ba (Noeba): Head of one of the families of temple-servants (1Esdras 5:31) equals "Nekoda" of <a onClick="return mV(\'Ezr\',2,48);">Ezr 2:48</a>.``1';
isbe[6437]='Nogah`no\'-ga (noghah, "splendor"): A son of David born at Jerusalem (<a onClick="return mV(\'1Ch\',3,7);">1Ch 3:7</a>; <a onClick="return mV(\'1Ch\',14,6);">14:6</a>). In the parallel list (<a onClick="return mV(\'2Sa\',5,14,15);">2Sa 5:14,15</a>) this name is wanting. In its Greek form (Naggai) it occurs in the genealogy of Jesus (<a onClick="return mV(\'Luk\',3,25);">Lu 3:25</a>).``1';
isbe[6438]='Nohah`no\'-ha (nochah, "rest"): The fourth son of Benjamin (<a onClick="return mV(\'1Ch\',8,2);">1Ch 8:2</a>). It is probable that in <a onClick="return mV(\'Jdg\',20,43);">Jud 20:43</a>, instead of "a resting-place" we should read "Nohah," which may have been the settlement of the family.``1';
isbe[6439]='Noise`noiz (qol, hamon, sha\'on; phone): "Noise" is most frequently the translation of qol, "voice," "sound," in the King James Version (<a onClick="return mV(\'Exd\',20,18);">Ex 20:18</a>, "the noise of the trumpet," the Revised Version (British and American) "voice"; <a onClick="return mV(\'Exd\',32,17,18);">Ex 32:17 twice, 18</a>; <a onClick="return mV(\'Jdg\',5,11);">Jud 5:11</a>, "(they that are delivered) from the noise of the archers," the Revised Version (British and American) "far from the noise," etc., margin "because of the voice of"; <a onClick="return mV(\'1Sa\',4,6);">1Sa 4:6</a>, etc.); hamon, "noise," "sound" (<a onClick="return mV(\'1Sa\',14,19);">1Sa 14:19</a>); roghez, "anger," "rage" (<a onClick="return mV(\'Job\',37,2);">Job 37:2</a>); rea\', "outcry" (<a onClick="return mV(\'Job\',36,33);">Job 36:33</a>); sha\'on, "desolation," "noise" (<a onClick="return mV(\'Isa\',24,8);">Isa 24:8</a>; <a onClick="return mV(\'Isa\',25,5);">25:5</a>); teshu\'oth "cry," "crying" (<a onClick="return mV(\'Job\',36,29);">Job 36:29</a>); patsah, "to break forth" (<a onClick="return mV(\'Psa\',98,4);">Ps 98:4</a>); shamea, "to hear," etc. (<a onClick="return mV(\'Jos\',6,10);">Jos 6:10</a>; <a onClick="return mV(\'1Ch\',15,28);">1Ch 15:28</a>); phone, "sound," "voice," is translated "noise" (<a onClick="return mV(\'Rev\',6,1);">Re 6:1</a>, "I heard as it were the noise of thunder," the Revised Version (British and American) "saying as with a voice of thunder"); rhoizedon, "with a hissing or rushing sound" (<a onClick="return mV(\'2Pe\',3,10);">2Pe 3:10</a>, "with a great noise"); ginetai phone (<a onClick="return mV(\'Act\',2,6);">Ac 2:6</a>, the King James Version "when this was noised abroad," margin "when this voice was made," the Revised Version (British and American) "when this sound was heard"); akouo, "to hear"; dialaleo, "to talk or speak" throughout, are also translated "noised" (<a onClick="return mV(\'Mar\',2,1);">Mr 2:1</a>; <a onClick="return mV(\'Luk\',1,65);">Lu 1:65</a>). So the Revised Version (British and American) (compare Judith 10:18, "noised among the tents"). Otherwise in the Revised Version (British and American) Apocrypha, throos "confused noise" (The <span class="noTag">Wisdom of Solomon 1:10</span>); boe, "outcry" (Judith 14:19); echos,"sound" (The <span class="noTag">Wisdom of Solomon 17:18</span>; compare Sirach 40:13); Latin vox, "voice" (2Esdras 5:7).<P>For "noise" (<a onClick="return mV(\'Psa\',65,7);">Ps 65:7</a> twice), the Revised Version (British and American) has "roaring"; for "make a noise like the noise of the seas" (<a onClick="return mV(\'Isa\',17,12);">Isa 17:12</a>), "the uproar (margin "multitude") of many peoples, that roar like the roaring of the seas"; for "a voice of noise from the city" (<a onClick="return mV(\'Isa\',66,6);">Isa 66:6</a>), "a voice of tumult from the city"; for "noise" (<a onClick="return mV(\'Jer\',10,22);">Jer 10:22</a>), "voice"; for "a noise" (<a onClick="return mV(\'1Ch\',15,28);">1Ch 15:28</a>), "sounding aloud," "voice" (<a onClick="return mV(\'Eze\',43,2);">Eze 43:2</a>); for "every battle of the warrior is with confused noise" (<a onClick="return mV(\'Isa\',9,5);">Isa 9:5</a>), "all the armor of the armed man in the tumult," margin "every boot of the booted warrior"; for "make a noise," "moan" (<a onClick="return mV(\'Psa\',55,2);">Ps 55:2</a>), "roar" (<a onClick="return mV(\'Isa\',17,12);">Isa 17:12</a>); for "make a loud noise" (<a onClick="return mV(\'Psa\',98,4);">Ps 98:4</a>), "break forth"; for "maketh a noise" (<a onClick="return mV(\'Jer\',4,19);">Jer 4:19</a>), "is disquieted"; for "the noise of his tabernacle" (<a onClick="return mV(\'Job\',36,29);">Job 36:29</a>), "the thunderings of his pavilion"; for "make any noise with your voice (<a onClick="return mV(\'Jos\',6,10);">Jos 6:10</a>), "let your voice be heard"; "joyful noise," for "shouting" (<a onClick="return mV(\'Isa\',16,10);">Isa 16:10</a>); for "The Lord on high is mightier than the noise of many waters, yea, than the mighty waves of the sea" (<a onClick="return mV(\'Psa\',93,4);">Ps 93:4</a>), "Above the voices of many waters, the mighty breakers of the sea, Yahweh on high is mighty."``185';
isbe[6440]='Noisome`noi\'-sum (hawwah, ra\'; kakos): "Noisome" from "annoy" (annoysome) has in Bible English the meaning of "evil," "hurtful," not of "offensive" or "loathsome." It is the translation of hawwah, "mischief," "calamity" (<a onClick="return mV(\'Psa\',91,3);">Ps 91:3</a>, "noisome pestilence," the Revised Version (British and American) "deadly"); of ra\', a common word for "evil" (<a onClick="return mV(\'Eze\',14,15,21);">Eze 14:15,21</a>), "noisome beasts" (the Revised Version (British and American) "evil"). It occurs also in <a onClick="return mV(\'Job\',31,40);">Job 31:40</a> the King James Version margin as the translation of bo\'shah, "noisome weeds," the King James Version and the Revised Version (British and American) "cockle," as in the King James Version margin; of kakos, "evil," "bad" (<a onClick="return mV(\'Rev\',16,2);">Re 16:2</a>), "a noisome and grievous sore." "Noisome" also occurs in Apocrypha (2Macc 9:9) as the translation of baruno, "to make heavy," "oppress," where it seems to have the meaning of "loathsome."``185';
isbe[6441]='Non`non (non): <a onClick="return mV(\'1Ch\',7,27);">1Ch 7:27</a> the King James Version and the Revised Version margin.`<a href="./study/isbe/search.html?string=NUN">NUN</a>`1';
isbe[6442]='Nooma`no\'-o-ma (Nooma, Codex Vaticanus Ooma; the King James Version Ethma): 1Esdras 9:35 equals "Nebo" of <a onClick="return mV(\'Ezr\',10,43);">Ezr 10:43</a>, of which it is a corruption.``1';
isbe[6443]='Noon; Noonday`noon, noon\'-da (tsohorayim; mesembria): The word means light, splendor, brightness, and hence, the brightest part of the day (<a onClick="return mV(\'Gen\',43,16,25);">Ge 43:16,25</a>; <a onClick="return mV(\'Act\',22,6);">Ac 22:6</a>).`<a href="./study/isbe/search.html?string=MIDDAY">MIDDAY</a>; <a href="./study/isbe/search.html?string=DAY+AND+NIGHT">DAY AND NIGHT</a>; <a href="./study/isbe/search.html?string=TIME">TIME</a>`1';
isbe[6444]='Noph`nof (noph; in <a onClick="return mV(\'Hsa\',9,6);">Ho 9:6</a> moph): A name for the Egyptian city Memphis (so the Septuagint), hence, thus rendered in the Revised Version (British and American) (<a onClick="return mV(\'Isa\',19,13);">Isa 19:13</a>; <a onClick="return mV(\'Jer\',2,16);">Jer 2:16</a>; <a onClick="return mV(\'Jer\',44,1);">44:1</a>; <a onClick="return mV(\'Eze\',30,13,16);">Eze 30:13,16</a>).`<a href="./study/isbe/search.html?string=MEMPHIS">MEMPHIS</a>`1';
isbe[6445]='Nophah`no\'-fa (nophach; the Septuagint does not transliterate): A city mentioned only in <a onClick="return mV(\'Num\',21,30);">Nu 21:30</a> (see <a href="./study/isbe/search.html?string=NOBAH">NOBAH</a>). Septuagint reads: kai hai gunaikes eti prosexekausan pur epi Moab, "and the women besides (yet) kindled a fire at (against) Moab." The text has evidently suffered corruption.``1';
isbe[6446]='North; North Country`north, (tsaphon, from tsaphan, "to hide," i.e. "the hidden," "the dark" (Gesenius); borrhas, boreas (Judith 16:4); septentrio (2Esdras 15:43)): In addition to the many places where "north" occurs merely as a point of the compass, there are several passages in Jeremiah, Ezekiel, and Zephaniah, where it refers to a particular country, usually Assyria or Babylonia: <a onClick="return mV(\'Jer\',3,18);">Jer 3:18</a>, "They shall come together out of the land of the north to the land that I gave for an inheritance unto your fathers"; <a onClick="return mV(\'Jer\',46,6);">Jer 46:6</a>, "In the north by the river Euphrates have they stumbled and fallen"; <a onClick="return mV(\'Eze\',26,7);">Eze 26:7</a>, "I will bring upon Tyre Nebuchadrezzar king of Babylon, king of kings, from the north"; <a onClick="return mV(\'Zep\',2,13);">Ze 2:13</a>, "He will stretch out his hand against the north, and destroy Assyria, and will make Nineveh a desolation."<P>While the site of Nineveh was northeast of Jerusalem, and that of Babylon almost due east, it was not unnatural for them to be referred to as "the north," because the direct desert routes were impracticable, and the roads led first into Northern Syria and then eastward (compare however <a onClick="return mV(\'Gen\',29,1);">Ge 29:1</a>, "Then Jacob went on his journey, and came to the land of the children of the east").<P>In <a onClick="return mV(\'Eze\',38,6);">Eze 38:6</a>, we have, "Gomer, and all his hordes; the house of Togarmah in the uttermost parts of the north." It is uncertain what country is here referred to. Some have supposed Armenia (compare <a onClick="return mV(\'Gen\',10,3);">Ge 10:3</a>; <a onClick="return mV(\'1Ch\',1,6);">1Ch 1:6</a>; <a onClick="return mV(\'Eze\',27,14);">Eze 27:14</a>).<P>The north border of the promised land, as outlined in <a onClick="return mV(\'Num\',34,\'7-9\');">Nu 34:7-9</a> and <a onClick="return mV(\'Eze\',47,\'15-17\');">Eze 47:15-17</a>, cannot be determined with certainty, because some of the towns named cannot be identified, but it was approximately the latitude of Mt. Hermon, not including Lebanon or Damascus.`<a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>`37';
isbe[6447]='Northeast, Southeast`These words occur in <a onClick="return mV(\'Act\',27,12);">Ac 27:12</a>, "if by any means they could reach Phoenix, and winter there; which is a haven of Crete, looking north-east and south-east." the Revised Version margin has, "Greek, down the south-west wind and down the north-west wind," which is a literal translation of the Greek: eis Phoinika...limena tes Kretes bleponta (looking) kata liba (the southwest wind) kai kata choron (the northwest wind). Choros does not appear to occur except here, but the corresponding Latin caurus or corus is found in Caesar, Vergil, and other classical authors. The King James Version has "lieth toward the south west and north west." Kata, with a wind or stream, means, "down the wind or stream," i.e. in the direction that it is blowing or flowing, and this interpretation would indicate a harbor open to the east. If lips, and choros, are used here as names of directions rather than of winds, we should expect a harbor open to the west. There is good reason for identifying Phoenix (the King James Version "Phenice") with Loutro on the south shore of Crete (EB, under the word "Phenice"), whose harbor is open to the east.`<a href="./study/isbe/search.html?string=PHOENIX">PHOENIX</a>`37';
isbe[6448]='Nose-Jewels`noz-ju\'-elz, -joo\'-elz (nezem (probably from nazam, "muzzle") a "nose-ring," or "nose-jewel," so rendered in <a onClick="return mV(\'Isa\',3,21);">Isa 3:21</a>; "jewel in a swine\'s snout," <a onClick="return mV(\'Pro\',11,22);">Pr 11:22</a>, the King James Version margin "ring"; "jewel on thy forehead," <a onClick="return mV(\'Eze\',16,12);">Eze 16:12</a>, "ring upon thy nose"): In <a onClick="return mV(\'Gen\',24,22);">Ge 24:22</a>, the King James Version rendered incorrectly "earring"; compare <a onClick="return mV(\'Gen\',24,47);">Ge 24:47</a>. Indeed, the word had also a more generic meaning of "ring" or "jewelry," whether worn in the nose or not. See <a onClick="return mV(\'Gen\',35,4);">Ge 35:4</a>; <a onClick="return mV(\'Exd\',32,2);">Ex 32:2</a>, where the ornament was worn in the ear. There are several cases without specification, uniformly rendered, without good reason, however, "earring" in the King James Version (<a onClick="return mV(\'Exd\',35,22);">Ex 35:22</a>; <a onClick="return mV(\'Jdg\',8,24,25);">Jud 8:24,25</a>; <a onClick="return mV(\'Job\',42,11);">Job 42:11</a> ("ring"); <a onClick="return mV(\'Pro\',25,12);">Pr 25:12</a>; <a onClick="return mV(\'Hsa\',2,13);">Ho 2:13 (15)</a>).<P>The nose-jewel was made of gold or of silver, usually, and worn by many women of the East. It was a ring of from an inch to about three inches (in extreme cases) in diameter, and was passed through the right nostril. Usually there were pendant from the metal ring jewels, beads or coral. Such ornaments are still worn in some parts of the East.`<a href="./study/isbe/search.html?string=AMULET">AMULET</a>; <a href="./study/isbe/search.html?string=JEWEL">JEWEL</a>`137';
isbe[6449]='Nose; Nostrils`noz, nos\'-trilz (\'aph, "nose," nechirayim, dual of nechir, "nostrils"): The former expression (\'aph from \'anph, like Arabic \'anf) is often translated "<a href="./study/isbe/search.html?string=FACE">face</a>" (which see under the word) in the English Versions of the Bible. It is frequently referred to as the organ of breathing, in other words, as the receptacle of the breath or spirit of God: "Yahweh...breathed into his nostrils the breath of life; and man became a living soul" (<a onClick="return mV(\'Gen\',2,7);">Ge 2:7</a>; compare <a onClick="return mV(\'Gen\',7,22);">Ge 7:22</a>); "My life is yet whole in me, and the spirit of God is in my nostrils" (<a onClick="return mV(\'Job\',27,3);">Job 27:3</a>). Therefore a life which depends on so slight a thing as a breath is considered as utterly frail and of no great consequence: "Cease ye from man, whose breath is in his nostrils; for wherein is he to be accounted of?" (<a onClick="return mV(\'Isa\',2,22);">Isa 2:22</a>; compare Wis 2:2).<P>In poetical language such a breath of life is ascribed even to God, especially with regard to the mighty storm which is thought to proceed from His nostrils (<a onClick="return mV(\'Exd\',15,8);">Ex 15:8</a>; <a onClick="return mV(\'2Sa\',22,9);">2Sa 22:9</a>; <a onClick="return mV(\'Psa\',18,8,15);">Ps 18:8,15</a>).<P>The phrase, "a smoke in my nose, a fire that burneth all the day" (<a onClick="return mV(\'Isa\',65,5);">Isa 65:5</a>), is equivalent to a perpetual annoyance and cause of irritation. A cruel custom of war, in which the vanquished had their noses and ears cut off by their remorseless conquerors, is alluded to in <a onClick="return mV(\'Eze\',23,25);">Eze 23:25</a>. As a wild animal is held in check by having his nose pierced and a hook or ring inserted in it (<a onClick="return mV(\'Job\',40,24);">Job 40:24</a>; <a onClick="return mV(\'Job\',41,2);">41:2 (Hebrew 40:26)</a>), so this expression is used to indicate the humbling and taming of an obstinate person (<a onClick="return mV(\'2Ki\',19,28);">2Ki 19:28</a>; <a onClick="return mV(\'Isa\',37,29);">Isa 37:29</a>; compare <a onClick="return mV(\'Eze\',29,4);">Eze 29:4</a>; <a onClick="return mV(\'Eze\',38,4);">38:4</a>). But men, and especially women, had their noses pierced for the wearing of jewelry (<a onClick="return mV(\'Gen\',24,47);">Ge 24:47</a>; <a onClick="return mV(\'Isa\',3,21);">Isa 3:21</a>; <a onClick="return mV(\'Eze\',16,12);">Eze 16:12</a>). In one passage the meaning is not quite clear, namely, in the enumeration of blemishes which disable a "son of Aaron" from the execution of the priest\'s office (<a onClick="return mV(\'Lev\',21,18);">Le 21:18</a>), where English Versions of the Bible translates "flat (margin "slit") nose." The Hebrew word is charum, which is a hapax legomenon. It corresponds, however, to the Arabic charam, charman (kharam, kharman), which means "to open," "to pierce the nose," especially the bridge of the nose. We may accept this meaning as the one intended in the passage.<P>Another dark and much discussed passage must still be referred to: "And, lo, they put the branch to their nose" (<a onClick="return mV(\'Eze\',8,17);">Eze 8:17</a>). The usual explanation (whereof the context gives some valuable hints) is that a rite connected with the worship of Baal (the sun) is here alluded to (see Smend and A.B. Davidson\'s commentaries on the passage). A similar custom is known from Persian sun-worship, where a bunch (baretsma) of dates, pomegranates or tamarisks was held to the nose by the worshipper, probably as an attempt to keep the Holy One (sun) from being contaminated by sinful breath (Spiegel, Eranische Altertamer, III, 571). Among modern Jews posies of myrtle and other fragrant herbs are held to the nose by the persons attending on the ceremony of circumcision, for the alleged reason of making the sight and smell of blood bearable. Another interpretation of the above passage would understand zemorah, in the sense of "male sexual member" (see Gesenius-Buhl, under the word; Levy, Nhb. Worterbuch, I, 544), and the whole passage as a reference to a sensuous Canaanite rite, such as is perhaps alluded to in <a onClick="return mV(\'Isa\',57,8);">Isa 57:8</a>. In that case the \'appam, "their nose "of the Massoretic Text would have to be considered as tiqqun copherim (a correction of the scribes) for \'appi, "my face." Or read "They cause their stench (zemoratham) to come up to my face" (Kraetzschmar, at the place).`<a href="./study/isbe/search.html?string=BRANCH">BRANCH</a>`106';
isbe[6450]='Notable`no\'-ta-b\'-l (chazuth; gnostos): "Notable" is the translation of chazuth, "conspicuous" (chazah, "to see"), e.g. <a onClick="return mV(\'Dan\',8,5);">Da 8:5</a>, "a notable horn," i.e. "conspicuous," the King James Version margin "a horn of sight"; <a onClick="return mV(\'Dan\',8,8);">Da 8:8</a>, "notable (horns)"; of gnostos, "known" "knowledge" (<a onClick="return mV(\'Act\',4,16);">Ac 4:16</a>); of episemos, "noted," "notable" (<a onClick="return mV(\'Mat\',27,16);">Mt 27:16</a>; in <a onClick="return mV(\'Rom\',16,7);">Ro 16:7</a> "of note" of epiphanes, "very manifest," "illustrious" (compare "Antiochus Epiphanes"); <a onClick="return mV(\'Act\',2,20);">Ac 2:20</a>, "that great and notable day," quoted from <a onClick="return mV(\'Joe\',2,31);">Joe 2:31</a>; Septuagint for yare\', "to be feared," the King James Version and the Revised Version (British and American) "terrible" (compare <a onClick="return mV(\'Mal\',4,5);">Mal 4:5</a>); "notable" occurs also in 2Macc 3:26 (ekprepes); 2Macc 14:33, the Revised Version (British and American) "for all to see"; 2Macc 6:28 (gennaios), "a notable example," the Revised Version (British and American) "noble"; notably, only in 2Macc 14:31 (gennaios), "notably prevented," the Revised Version (British and American) "bravely," margin "nobly."``185';
isbe[6451]='Note`not (chaqaq, rasham; semeioo, episemos): "Note" (verb) is the translation of chaqaq, "to grave," "to inscribe," etc. (<a onClick="return mV(\'Isa\',30,8);">Isa 30:8</a>, "note it in a book," the Revised Version (British and American) "inscribe"); of rasham, "to note down," etc. (<a onClick="return mV(\'Dan\',10,21);">Da 10:21</a>, the Revised Version (British and American) "inscribed"); of semeioo, "to put a sign on" (<a onClick="return mV(\'2Th\',3,14);">2Th 3:14</a>, "note that man").<P>"Note" (noun) is the translation of episemos, "marked upon," "distinguished" (<a onClick="return mV(\'Rom\',16,7);">Ro 16:7</a>, "who are of note among the apostles").<P>"Notes" (musical) occurs in The <span class="noTag">Wisdom of Solomon 19:18</span>, "notes of a psaltery" (phthoggos).``185';
isbe[6452]='Nothing`nuth\'-ing (lo\', lo\' me\'umah, etc.; medeis, oudeis): "Nothing" is represented by various words and phrases, often with lo\', which is properly a substantive with the meaning of "nothing." Most frequently we have lo\' me\'umah, "not anything" (<a onClick="return mV(\'Gen\',40,15);">Ge 40:15</a>; <a onClick="return mV(\'Jdg\',14,6);">Jud 14:6</a>).<P>Other forms are lo\' dhabhar, "not anything"; (<a onClick="return mV(\'Gen\',19,8);">Ge 19:8</a>); lo\'khol, "not any(thing)" (<a onClick="return mV(\'Gen\',11,6);">Ge 11:6</a>; <a onClick="return mV(\'Pro\',13,7);">Pr 13:7</a>); la\' (Aramaic), "no," "nothing" (<a onClick="return mV(\'Dan\',4,35);">Da 4:35</a>, "as nothing"); \'ephec, "end," "cessation" (<a onClick="return mV(\'Isa\',34,12);">Isa 34:12</a>); bilti, "without," "save," "not" (<a onClick="return mV(\'Isa\',44,10);">Isa 44:10</a>; <a onClick="return mV(\'Amo\',3,4);">Am 3:4</a>); \'ayin, "there is not" (<a onClick="return mV(\'Isa\',41,24);">Isa 41:24</a>); once, tohu, "emptiness" (<a onClick="return mV(\'Job\',6,18);">Job 6:18</a>); bal mah, "not anything" (<a onClick="return mV(\'Pro\',9,13);">Pr 9:13</a>); chinnam, "free," "gratis" (<a onClick="return mV(\'2Sa\',24,24);">2Sa 24:24</a>); ma\'at, "to make small," "bring to nothing" (<a onClick="return mV(\'Jer\',10,24);">Jer 10:24</a>); raq, "only" (<a onClick="return mV(\'Gen\',26,29);">Ge 26:29</a>); le\'al, "for nothing" (<a onClick="return mV(\'Job\',24,25);">Job 24:25</a>).<P>In 2Macc 7:12, we have "nothing," adverbially (en oudeni), "he nothing regarded the pains" (compare <a onClick="return mV(\'1Ki\',15,21);">1Ki 15:21</a>); 2Macc 9:7 (oudamos), the Revised Version (British and American) "in no wise"; The <span class="noTag">Wisdom of Solomon 2:11</span>, "nothing worth" (achrestos), the Revised Version (British and American) "of no service"; Baruch 6:17,26.<P>For "nothing" the Revised Version (British and American) has "none" (<a onClick="return mV(\'Exd\',23,26);">Ex 23:26</a>; <a onClick="return mV(\'Joe\',2,3);">Joe 2:3</a>), "never" (<a onClick="return mV(\'Neh\',5,8);">Ne 5:8</a>), "not wherewith" (<a onClick="return mV(\'Pro\',22,27);">Pr 22:27</a>), "vanity and nought" (<a onClick="return mV(\'Isa\',41,29);">Isa 41:29</a>); for "answered nothing" (<a onClick="return mV(\'Mar\',15,5);">Mr 15:5</a>), "no more answered anything"; "answered nothing" in <a onClick="return mV(\'Mar\',15,3);">Mr 15:3</a> is omitted; "anything" for "nothing" (<a onClick="return mV(\'1Ti\',6,7);">1Ti 6:7</a>), "not anything" (<a onClick="return mV(\'Act\',20,20);">Ac 20:20</a>), "not" (<a onClick="return mV(\'1Cr\',8,2);">1Co 8:2</a>), "no word" (<a onClick="return mV(\'Luk\',1,37);">Lu 1:37</a>), "not wherewith" (<a onClick="return mV(\'Luk\',7,42);">Lu 7:42</a>); for "to nothing" (<a onClick="return mV(\'Job\',6,18);">Job 6:18</a>), "up into the waste"; for "it is nothing with" (<a onClick="return mV(\'2Ch\',14,11);">2Ch 14:11</a>), "there is none besides," margin "like"; for "lacked nothing" (<a onClick="return mV(\'1Ki\',4,27);">1Ki 4:27</a>), "let nothing be lacking," for "nothing doubting" (<a onClick="return mV(\'Act\',11,12);">Ac 11:12</a>), "making no distinction"; for "hoping for nothing again" (<a onClick="return mV(\'Luk\',5,35);">Lu 5:35</a>), "never despairing"; for "are nothing" (<a onClick="return mV(\'Act\',21,24);">Ac 21:24</a>), "no truth in"; for "nothing shall offend them" (<a onClick="return mV(\'Psa\',119,165);">Ps 119:165</a>), "no occasion of stumbling"; for "bring to nothing" (<a onClick="return mV(\'1Cr\',1,19);">1Co 1:19</a>), the English Revised Version "reject," the American Standard Revised Version "bring to nought"; "nothing better" for "no good" (<a onClick="return mV(\'Ecc\',3,12);">Ec 3:12</a>), for "not" (<a onClick="return mV(\'Mat\',13,34);">Mt 13:34</a>, different text), for "no man" (<a onClick="return mV(\'Act\',9,8);">Ac 9:8</a>), "for nothing," for "free" (<a onClick="return mV(\'Exd\',21,11);">Ex 21:11</a>); "miss nothing" for "not sin" (<a onClick="return mV(\'Job\',5,24);">Job 5:24</a>), margin "shalt not err"; "and shall have nothing" for "and not for himself" (<a onClick="return mV(\'Dan\',9,26);">Da 9:26</a>, margin "there shall be none belonging to him").``185';
isbe[6453]='Nought`not (chinnam; katargeo) "Nought" is to be distinguished from "naught" implying "badness" (see <a href="./study/isbe/search.html?string=NAUGHT">NAUGHT</a>). "Nought" in the sense of "nothing," etc., is the translation of chinnam, "gratis" (<a onClick="return mV(\'Gen\',29,15);">Ge 29:15</a>), and of various other words occurring once only, e.g. \'awen, "vanity" (<a onClick="return mV(\'Amo\',5,5);">Am 5:5</a>); tohu, "vacancy," "ruin" (<a onClick="return mV(\'Isa\',49,4);">Isa 49:4</a>); \'epha\', "nothing" (<a onClick="return mV(\'Isa\',41,24);">Isa 41:24</a>); nabhel, "to fade" (<a onClick="return mV(\'Job\',14,18);">Job 14:18</a>, margin "fadeth away"); pur, "to make void" (<a onClick="return mV(\'Psa\',33,10);">Ps 33:10</a>); katargeo, "to make without effect" (<a onClick="return mV(\'1Cr\',1,28);">1Co 1:28</a>; <a onClick="return mV(\'1Cr\',2,6);">2:6</a>); oudeis, "not even one" (<a onClick="return mV(\'Act\',5,36);">Ac 5:36</a>); apelegmos, "refutation" (<a onClick="return mV(\'Act\',19,27);">Ac 19:27</a>, the Revised Version (British and American) "come into disrepute"); dorean, "without payment" (<a onClick="return mV(\'2Th\',3,8);">2Th 3:8</a>, the Revised Version (British and American) "for nought"); eremoo, "to desolate" (<a onClick="return mV(\'Rev\',18,17);">Re 18:17</a>, the Revised Version (British and American) "made desolate"); kataluo, "to loose down" (<a onClick="return mV(\'Act\',5,38);">Ac 5:38</a>, the Revised Version (British and American) "be overthrown"). In Apocrypha we have "set at nought" and "come to nought," etc. (1Esdras 1:56; 2Esdras 2:33; 8:59).<P>For "nought" the Revised Version (British and American) has "perish" (<a onClick="return mV(\'Deu\',28,63);">De 28:63</a>); for "come to nought" (<a onClick="return mV(\'Job\',8,22);">Job 8:22</a>), "be no more"; "nought" for "not ought" (<a onClick="return mV(\'Exd\',5,11);">Ex 5:11</a>), for "no might" (<a onClick="return mV(\'Deu\',28,32);">De 28:32</a>); for "brought to silence," twice (<a onClick="return mV(\'Isa\',15,1);">Isa 15:1</a>), "brought to nought"; the American Standard Revised Version "bring to nought" (<a onClick="return mV(\'1Cr\',1,19);">1Co 1:19</a>) for "bring to nothing" (the English Revised Version "reject"); "nought but terror" (<a onClick="return mV(\'Isa\',28,19);">Isa 28:19</a>) for "a vexation only"; "brought to nought" (<a onClick="return mV(\'Isa\',16,4);">Isa 16:4</a>) for "is at an end"; "come to nought" for "taken none effect" (<a onClick="return mV(\'Rom\',9,6);">Ro 9:6</a>); "set at nought" for "despise" (<a onClick="return mV(\'Rom\',14,3);">Ro 14:3</a>).``185';
isbe[6454]='Nourish`nur\'-ish (giddel, chiyyah, kilkel, ribbah; trepho, anatrepho, ektrepho, entrepho): While the word "nourish" was ordinarily an appropriate rendering in the time of the King James Version, the word has since become much less frequent, and some senses have largely passed out of ordinary use, so that the meaning would now in most cases be better expressed by some other word. Giddel means "to bring up," "rear (children)" (<a onClick="return mV(\'Isa\',1,2);">Isa 1:2</a>, margin "made great"; <a onClick="return mV(\'Isa\',23,4);">Isa 23:4</a>; <a onClick="return mV(\'Dan\',1,5);">Da 1:5</a>); "cause (a tree) to grow" (<a onClick="return mV(\'Isa\',44,14);">Isa 44:14</a>). Chiyyah means "to preserve alive" (with some implication of care) (<a onClick="return mV(\'2Sa\',12,3);">2Sa 12:3</a>; <a onClick="return mV(\'Isa\',7,21);">Isa 7:21</a>, the American Standard Revised Version "keep alive"). Kilkal means "to support," "maintain" "provide for" (especially with food) (<a onClick="return mV(\'Gen\',45,11);">Ge 45:11</a>; <a onClick="return mV(\'Gen\',47,12);">47:12</a>; <a onClick="return mV(\'Gen\',50,21);">50:21</a>). Ribbah means "to bring up," "rear (whelps)," in a figurative use <a onClick="return mV(\'Eze\',19,2);">Eze 19:2</a>). Trepho means "to feed" (transitively) (<a onClick="return mV(\'Act\',12,20);">Ac 12:20</a>, the Revised Version (British and American) "feed"; <a onClick="return mV(\'Rev\',12,14);">Re 12:14</a>); "to fatten" (<a onClick="return mV(\'Jam\',5,5);">Jas 5:5</a>, the context indicating an unfavorable meaning). Anatrepho is "to bring up," "rear," like giddel (<a onClick="return mV(\'Act\',7,20,21);">Ac 7:20,21</a>); ektrepho is "to take care of" (<a onClick="return mV(\'Eph\',5,29);">Eph 5:29</a>); entrepho means "to bring up in," "train in" (<a onClick="return mV(\'1Ti\',4,6);">1Ti 4:6</a>).``12';
isbe[6455]='Novice`nov\'-is (neophutos, "newly planted"): In this sense it is found in Septuagint of <a onClick="return mV(\'Job\',14,9);">Job 14:9</a> and <a onClick="return mV(\'Isa\',5,7);">Isa 5:7</a>. In the New Testament it occurs once only (<a onClick="return mV(\'1Ti\',3,6);">1Ti 3:6</a>), where it means a person newly planted in the Christian faith, a neophyte, a new convert, one who has recently become a Christian. This term occurs in the list which Paul gives of the qualifications which a Christian bishop must possess. The apostle instructs Timothy, that if any man desires the office of a bishop, he must not be "novice," must not be newly converted, or recently brought to the faith of Christ "lest he be lifted up with pride, and fall into the condemnation of the devil."<P>This means that a recent convert runs the very serious risk of being wise in his own eyes, of despising those who are still on the level from which, by his conversion, he has been lifted; and so he becomes puffed up with high ideas of his own importance. He has not yet had time to discover his limitations, he is newly planted, he does not fully understand his true position in the Christian community, he overestimates himself. For these reasons he is peculiarly liable to instability, and to the other weaknesses and sins connected with an inflated opinion of his own powers. His pride is a sure indication of a coming fall. A novice, therefore, must on no account be appointed to the office in question, for he would be sure to bring disgrace upon it.``155';
isbe[6456]='Number`num\'-ber:<P><b>I. NUMBER AND ARITHMETIC</b><P><b>II. NOTATION OF NUMBERS</b><P class="in15">1. By Words<P class="in15">2. By Signs<P class="in15">3. By Letters<P><b>III. NUMBERS IN OLD TESTAMENT HISTORY</b><P><b>IV. ROUND NUMBERS</b><P><b>V. SIGNIFICANT NUMBERS</b><P class="in15">1. Seven and Its Multiples<P class="in30">(1) Ritual Use of Seven<P class="in30">(2) Historical Use of Seven<P class="in30">(3) Didactic or Literary Use of Seven<P class="in30">(4) Apocalyptic Use of Seven<P class="in15">2. The Number Three</a><P class="in15">3. The Number Four<P class="in15">4. The Number Ten<P class="in15">5. The Number Twelve<P class="in15">6. Other Significant Numbers<P><b>VI. GEMATRIA</b><P><b>LITERATURE</b><hr /><P>I. Number and Arithmetic.<P>The system of counting followed by the Hebrews and the Semites generally was the decimal system, which seems to have been suggested by the use of the ten fingers. Hebrew had separate words only for the first nine units and for ten and its multiples. Of the sexagesimal system, which seems to have been introduced into Babylonia by the Sumerians and which, through its development there, has influenced the measurement of time and space in the western civilized world even to the present day; there is no direct trace in the Bible, although, as will be shown later, there are some possible echoes. The highest number in the Bible described by a single word <span class="noTag">is</span> 10,000 (ribbo or ribbo\', murias). The Egyptians, on the other hand, had separate words for 100,000, 1,000,000, 10,000,000. The highest numbers referred to in any way in the Bible are: "a thousand thousand" (<a onClick="return mV(\'1Ch\',22,14);">1Ch 22:14</a>; <a onClick="return mV(\'2Ch\',14,9);">2Ch 14:9</a>); "thousands of thousands" (<a onClick="return mV(\'Dan\',7,10);">Da 7:10</a>; <a onClick="return mV(\'Rev\',5,11);">Re 5:11</a>); "thousands of ten thousands" (<a onClick="return mV(\'Gen\',24,60);">Ge 24:60</a>); "ten thousand times ten thousand" (<a onClick="return mV(\'Dan\',7,10);">Da 7:10</a>; <a onClick="return mV(\'Rev\',5,11);">Re 5:11</a>); and twice that figure (<a onClick="return mV(\'Rev\',9,16);">Re 9:16</a>). The excessively high numbers met with in some oriental systems (compare Lubbock, The Decimal System, 17ff) have no parallels in Hebrew. Fractions were not unknown. We find 1/3 (<a onClick="return mV(\'2Sa\',18,2);">2Sa 18:2</a>, etc.); 1/2 (<a onClick="return mV(\'Exd\',25,10,17);">Ex 25:10,17</a>, etc.); 1/4 (<a onClick="return mV(\'1Sa\',9,8);">1Sa 9:8</a>); 1/5 (<a onClick="return mV(\'Gen\',47,24);">Ge 47:24</a>); 1/6 (<a onClick="return mV(\'Eze\',46,14);">Eze 46:14</a>); 1/10 (<a onClick="return mV(\'Exd\',16,36);">Ex 16:36</a>); 2/10 (<a onClick="return mV(\'Lev\',23,13);">Le 23:13</a>); 3/10 (<a onClick="return mV(\'Lev\',14,10);">Le 14:10</a>), and 1/100 (<a onClick="return mV(\'Neh\',5,11);">Ne 5:11</a>). Three other fractions are less definitely expressed: 2/3 by "a double portion," literally, "a double mouthful" by (<a onClick="return mV(\'Deu\',21,17);">De 21:17</a>; <a onClick="return mV(\'2Ki\',2,9);">2Ki 2:9</a>; <a onClick="return mV(\'Zec\',13,8);">Zec 13:8</a>); 4/5 by "four parts" (<a onClick="return mV(\'Gen\',47,24);">Ge 47:24</a>), and 9/10 by "nine parts" (<a onClick="return mV(\'Neh\',11,1);">Ne 11:1</a>). Only the simplest rules of arithmetic can be illustrated from the Old Testament. There are examples of addition (<a onClick="return mV(\'Gen\',5,\'3-31\');">Ge 5:3-31</a>; <a onClick="return mV(\'Num\',1,\'20-46\');">Nu 1:20-46</a>); subtraction (<a onClick="return mV(\'Gen\',18,28);">Ge 18:28</a>); multiplication (<a onClick="return mV(\'Lev\',25,8);">Le 25:8</a>; <a onClick="return mV(\'Num\',3,46);">Nu 3:46</a>), and division (<a onClick="return mV(\'Num\',31,27);">Nu 31:27</a>). In <a onClick="return mV(\'Lev\',25,50);">Le 25:50</a>ff is what has been said to imply a kind of rule-of-three sum. The old Babylonians had tables of squares and cubes intended no doubt to facilitate the measurement of land (Sayce, Assyria, Its Princes, Priests, and People, 118; Bezold, Ninive und Babylon, 90, 92); and it can scarcely be doubted that the same need led to similar results among the Israelites, but at present there is no evidence. Old Hebrew arithmetic and mathematics as known to us are of the most elementary kind (Nowack, HA, I, 298).<P>II. Notation of Numbers.<P>1. By Words:<P>No special signs for the expression of numbers in writing can be proved to have been in use among the Hebrews before the exile. The Siloam Inscription, which is probably the oldest specimen of Hebrew writing extant (with the exception of the ostraca of Samaria, and perhaps a seal or two and the obscure Gezer tablet), has the numbers written in full. The words used there for 3,200, 1,000 are written as words without any abbreviation. The earlier text of the Moabite Stone which practically illustrates Hebrew usage has the <span class="noTag">numbers</span> 30, 40, 50, 100, 200,  7,000 written out in the same way.<P>2. By Signs:<P>After the exile some of the Jews at any rate employed signs such as were current among the Egyptians, the Arameans, and the Phoenicians—an upright line for 1, two such lines for 2, three for 3, and so on, and special signs for 10, 20,100. It had been conjectured that these or similar signs were known to the Jews, but actual proof was not forthcoming until the discovery of Jewish papyri at Assuan and Elephantine in 1904 and 1907. In these texts, ranging from 494 to circa 400 BC, the dates are stated, not in words, but in figures of the kind described. We have therefore clear evidence that numerical signs were used by members of a Jewish colony in Upper Egypt in the 5th century BC. Now, as the existence of this colony can be traced before 525 BC, it is probable that they used this method of notation also in the preceding century. Conjecture indeed may go as far as its beginning, for it is known that there were Jews in Pathros, that is Upper Egypt, in the last days of Jeremiah (<a onClick="return mV(\'Jer\',44,1,15);">Jer 44:1,15</a>). Some of the first Jewish settlers in Elephantine may have known the prophet and some of them may have come from Jerusalem, bringing these signs with them. At present, however, that is pure hypothesis.<P>3. By Letters:<P>In the notation of the chapters and verses of the Hebrew Bible and in the expression of dates in Hebrew books the consonants of the Hebrew alphabet are employed for figures, i.e. the first ten for 1-10, combinations of these for 11-19, the following eight for 20-90, and the remainder for 100,200,300, 400. The letters of the Greek alphabet were used in the same way. The antiquity of this kind of numerical notation cannot at present be ascertained. It is found on Jewish coins which have been dated in the reign of the Maccabean Simon (143-135 BC), but some scholars refer them to a much later period. All students of the Talmud are familiar with this way of numbering the pages, or rather the leaves, but its use there is no proof of early date. The numerical use of the Greek letters can be abundantly illustrated. It is met with in many Greek papyri, some of them from the 3rd century BC (Hibeh Papyri, numbers 40-43, etc.); on several coins of Herod the Great, and in some manuscripts of the New Testament, for instance, a papyrus fragment of Matthew (Oxyrhynchus Pap., 2) where 14 is three times represented by iota-delta (I-D) with a line above the letters, and some codices of <a onClick="return mV(\'Rev\',13,18);">Re 13:18</a> where 666 is given by the three letters "chi" "xi" "vau" (or digaroma). It is possible that two of these methods may have been employed side by side in some cases, as in the Punic Sacrificial Tablet of Marseilles, where (l. 6) 150 is expressed first in words, and then by figures.<P>III. Numbers in Old Testament History.<P>Students of the historical books of the Old Testament have long been perplexed by the high numbers which are met with in many passages, for example, the number ascribed to the Israelites at the exodus (<a onClick="return mV(\'Exd\',12,37);">Ex 12:37</a>; <a onClick="return mV(\'Num\',11,21);">Nu 11:21</a>), and on two occasions during the sojourn in the wilderness (<a onClick="return mV(\'Num\',1,\'1-\');">Nu 1</a>; <a onClick="return mV(\'Num\',26,\'1-\');">26</a>)—more than 600,000 adult males, which means a total of two or three millions; the result of David\'s census 1,300,000 men (<a onClick="return mV(\'2Sa\',24,9);">2Sa 24:9</a>) or 1,570,000 (<a onClick="return mV(\'1Ch\',21,5);">1Ch 21:5</a>), and the slaughter of half a million in a battle between Judah and Israel (<a onClick="return mV(\'2Ch\',13,17);">2Ch 13:17</a>). There are many other illustrations in the Books of Chronicles and elsewhere. That some of these high figures are incorrect is beyond reasonable doubt, and is not in the least surprising, for there is ample evidence that the numbers in ancient documents were exceptionally liable to corruption. One of the best known instances is the variation of 1,466 years between the Hebrew text and the Septuagint (text of Codex Vaticanus) as to the interval from the creation of Adam to the birth of Abram. Other striking cases are <a onClick="return mV(\'1Sa\',6,19);">1Sa 6:19</a>, where 50,070 ought probably to be 70 (Josephus, Ant., VI, i, 4); <a onClick="return mV(\'2Sa\',15,7);">2Sa 15:7</a>, where 40 years ought to be 4 years; the confusion of 76 and 276 in the manuscripts of <a onClick="return mV(\'Act\',27,37);">Ac 27:37</a>, and of 616 and 666 in those of <a onClick="return mV(\'Rev\',13,18);">Re 13:18</a>. Hebrew manuscripts furnish some instructive variations. One of them, number 109 of Kennicott, reads (<a onClick="return mV(\'Num\',1,23);">Nu 1:23</a>) 1,050 for 50,000; 50 for 50,000 (<a onClick="return mV(\'Num\',2,6);">Nu 2:6</a>), and 100 for 100,000 (<a onClick="return mV(\'Num\',2,16);">Nu 2:16</a>). It is easy to see how mistakes may have originated in many cases. The Hebrew numerals for 30, etc., are the plurals of the units, so that the former, as written, differ from the latter only by the addition of the two Hebrew letters yodh ("y") and mem ("m") composing the syllable -im. Now as the mem was often omitted, 3 and 30, 4 and 40, etc., could readily be confused. If signs or letters of the alphabet were made use of, instead of abbreviated words, there would be quite as much room for misunderstanding and error on the part of copyists. The high numbers above referred to as found in Exodus and Numbers have been ingeniously accounted for by Professor Flinders Petrie (Researches in Sinai) in a wholly different way. By understanding \'eleph not as "thousand," but as "family" or "tent," he reduces the number to 5,550 for the first census, and 5,730 for the second. This figure, however, seems too low, and the method of interpretation, though not impossible, is open to criticism. It is generally admitted that the number as usually read is too high, but the original number has not yet been certainly discovered. When, however, full allowance has been made for the intrusion of numerical errors into the Hebrew text, it is difficult to resist the belief that, in the Books of Chronicles, at any rate, there is a marked tendency to exaggeration in this respect. The huge armies again and again ascribed to the little kingdoms of Judah and Israel cannot be reconciled with some of the facts revealed by recent research; with the following, for instance: The army which met the Assyrians at Karkar in 854 BC and which represented 11 states and tribes inclusive of Israel and the kingdom of Damascus, cannot have numbered at the most more than about 75,000 or 80,000 men (HDB,1909,65b), and the Assyrian king who reports the battle reckons the whole levy of his country at only 102,000 (Der alte Orient, XI, i,14,note). In view of these figures it is not conceivable that the armies of Israel or Judah could number a million, or even half a million. The contingent from the larger kingdom contributed on the occasion mentioned above consisted of only 10,000 men and 2,000 chariots (HDB, ib). The safest conclusion, therefore, seems to be that, while many of the questionable numbers in the present text of the Old Testament are due to copyists, there is a residuum which cannot be so accounted for.<P>IV. Round Numbers.<P>The use of definite numerical expressions in an indefinite sense, that is, as round numbers, which is met with in many languages, seems to have been very prevalent in Western Asia from early times to the present day. Sir W. Ramsay (Thousand and One Churches, 6) remarks that the modern Turks have 4 typical numbers which are often used in proper names with little or no reference to their exact numerical force—3,7,40, 1,001. The Lycaonian district which gives the book its name is called Bin Bir Kilisse, "The Thousand and One Churches," although the actual number in the valley is only 28. The modern Persians use 40 in just the same way. "Forty years" with them often means "many years" (Brugsch, cited by Konig, Stilistik, 55). This lax use of numbers, as we think, was probably very frequent among the Israelites and their neighbors. The inscription on the Moabite Stone supplies a very instructive example. The Israelite occupation of Medeba by Omri and his son for half the reign of the latter is there reckoned (II.7f) at 40 years. As, according to <a onClick="return mV(\'1Ki\',16,23,29);">1Ki 16:23,29</a>, the period extended to only 23 years at the most, the number 40 must have been used very freely by Mesha\'s scribe as a round number. It is probably often used in that way in the Bible where it is remarkably frequent, especially in reference to periods of days or years. The 40 days of the Flood (<a onClick="return mV(\'Gen\',7,4,17);">Ge 7:4,17</a>), the arrangement of the life of Moses in three periods of 40 years each (<a onClick="return mV(\'Act\',7,23);">Ac 7:23</a>; <a onClick="return mV(\'Exd\',7,7);">Ex 7:7</a>; <a onClick="return mV(\'Deu\',34,7);">De 34:7</a>), the 40 years\' rule or reign of Eli (<a onClick="return mV(\'1Sa\',4,18);">1Sa 4:18</a>), of Saul (<a onClick="return mV(\'Act\',13,21);">Ac 13:21</a>; compare Josephus, Ant, VI, xiv, 9), of David (<a onClick="return mV(\'1Ki\',2,11);">1Ki 2:11</a>), of Solomon (<a onClick="return mV(\'1Ki\',11,42);">1Ki 11:42</a>) and of Jehoash (<a onClick="return mV(\'2Ki\',12,1);">2Ki 12:1</a>), the 40 or 80 years of rest (<a onClick="return mV(\'Jdg\',3,11,30);">Jud 3:11,30</a>; <a onClick="return mV(\'Jdg\',5,31);">5:31</a>; <a onClick="return mV(\'Jdg\',8,28);">8:28</a>), the 40 years of Philistine oppression (<a onClick="return mV(\'Jdg\',13,1);">Jud 13:1</a>), the 40 days\' challenge of Goliath (<a onClick="return mV(\'1Sa\',17,16);">1Sa 17:16</a>), the 40 days\' fast of Moses (<a onClick="return mV(\'Exd\',34,28);">Ex 34:28</a>), Elijah (<a onClick="return mV(\'1Ki\',19,8);">1Ki 19:8</a>), and Jesus (<a onClick="return mV(\'Mat\',4,2);">Mt 4:2</a> and parallel), the 40 days before the destruction of Nineveh (<a onClick="return mV(\'Jon\',3,4);">Jon 3:4</a>), and the 40 days before the Ascension (<a onClick="return mV(\'Act\',1,3);">Ac 1:3</a>), all suggest conventional use, or the influence of that use, for it can hardly be supposed that the number in each of these cases, and in others which might be mentioned, was exactly 40. How it came to be so used is not quite certain, but it may have originated, partly at any rate, in the idea that 40 years constituted a generation or the period at the end of which a man attains maturity, an idea common, it would seem, to the Greeks, the Israelites, and the Arabs. The period of 40 years in the wilderness in the course of which the old Israel died out and a new Israel took its place was a generation (<a onClick="return mV(\'Num\',32,13);">Nu 32:13</a>, etc.). The rabbis long afterward regarded 40 years as the age of understanding, the age when a man reaches his intellectual prime (Ab, v, addendum). In the Koran (Sura 46) a man is said to attain his strength when he attains to 40 years, and it was at that age, according to tradition, that Muhammad came forward as a prophet. In this way perhaps 40 came to be used as a round number for an indefinite period with a suggestion of completeness, and then was extended in course of time to things as well as Seasons.<P>Other round numbers are:<P>(1) some of the higher numbers;<P>(2) several numerical phrases.<P>Under (1) come the following numbers. One hundred, often of course to be understood literally, but evidently a round number in <a onClick="return mV(\'Gen\',26,12);">Ge 26:12</a>; <a onClick="return mV(\'Lev\',26,8);">Le 26:8</a>; <a onClick="return mV(\'2Sa\',24,3);">2Sa 24:3</a>; <a onClick="return mV(\'Ecc\',8,12);">Ec 8:12</a>; <a onClick="return mV(\'Mat\',19,29);">Mt 19:29</a> and parallel. A thousand (thousands), very often a literal number, but in not a few cases indefinite, e.g. <a onClick="return mV(\'Exd\',20,6);">Ex 20:6</a> parallel <a onClick="return mV(\'Deu\',5,10);">De 5:10</a>; <a onClick="return mV(\'Deu\',7,9);">7:9</a>; <a onClick="return mV(\'1Sa\',18,7);">1Sa 18:7</a>; <a onClick="return mV(\'Psa\',50,10);">Ps 50:10</a>; <a onClick="return mV(\'Psa\',90,4);">90:4</a>; <a onClick="return mV(\'Psa\',105,8);">105:8</a>; <a onClick="return mV(\'Isa\',60,22);">Isa 60:22</a>, etc. Ten thousand (Hebrew ribbo, ribboth, rebhabhah; Greek murids, murioi) is also used as a round number as in <a onClick="return mV(\'Lev\',26,8);">Le 26:8</a>; <a onClick="return mV(\'Deu\',32,30);">De 32:30</a>; <a onClick="return mV(\'Sgs\',5,10);">So 5:10</a>; <a onClick="return mV(\'Mic\',6,7);">Mic 6:7</a>. The yet higher figures, thousands of thousands, etc., are, in almost all cases, distinctly hyperbolical round numbers, the most remarkable examples occurring in the apocalyptic books (<a onClick="return mV(\'Dan\',7,10);">Da 7:10</a>; <a onClick="return mV(\'Rev\',5,11);">Re 5:11</a>; <a onClick="return mV(\'Rev\',9,16);">9:16</a>; Ethiopic Enoch 40:1).<P>(2) The second group, numerical phrases, consists of a number of expressions in which numbers are used roundly, in some cases to express the idea of fewness. One or two, etc.: "a day or two" (<a onClick="return mV(\'Exd\',21,21);">Ex 21:21</a>), "a heap, two heaps" (<a onClick="return mV(\'Jdg\',15,16);">Jud 15:16</a> the Revised Version margin), "one of a city, and two of a family" (<a onClick="return mV(\'Jer\',3,14);">Jer 3:14</a>), "not once, nor twice," that is "several times" (<a onClick="return mV(\'2Ki\',6,10);">2Ki 6:10</a>). Two or three: "Two or three berries in the (topmost) bough" (<a onClick="return mV(\'Isa\',17,6);">Isa 17:6</a>; compare <a onClick="return mV(\'Hsa\',6,2);">Ho 6:2</a>), "Where two or three are gathered together in my name," etc. (<a onClick="return mV(\'Mat\',18,20);">Mt 18:20</a>). Konig refers to Assyrian, Syrian, and Arabic parallels. Three or four: the most noteworthy example is the formula which occurs 8 times in <a onClick="return mV(\'Amo\',1,3,6,9,11,13);">Am 1:3,6,9,11,13</a>; <a onClick="return mV(\'Amo\',2,1,4,6);">2:1,4,6</a>, "for three transgressions...yea for four." That the numbers here are round numbers is evident from the fact that the sins enumerated are in most cases neither 3 nor 4. In <a onClick="return mV(\'Pro\',30,15,18,21,29);">Pr 30:15,18,21,29</a>, on the other hand, where we have the same rhetorical device, <i>climax ad majus</i>, 4 is followed by four statements and is therefore to be taken literally. Again, Konig (same place) points to classical and Arabic parallels. <i>Four or five:</i> "Four or five in the outmost branches of a fruitful tree" (<a onClick="return mV(\'Isa\',17,6);">Isa 17:6</a>). <i>Five or six:</i> "Thou shouldest have smitten (Syria) five or six times" (<a onClick="return mV(\'2Ki\',13,19);">2Ki 13:19</a>), an idiom met with also in Tell el-Amarna Letters (Konig, ib). <i>Six and seven:</i> "He will deliver thee in six troubles; yea, in seven there shall no evil touch thee" (<a onClick="return mV(\'Job\',5,19);">Job 5:19</a>). <i>Seven and eight:</i> "Seven shepherds, and eight principal men" (<a onClick="return mV(\'Mic\',5,5);">Mic 5:5</a>), that is, "enough and more than enough" (Cheyne); "Give a portion to seven, yea, even unto eight" (<a onClick="return mV(\'Ecc\',11,2);">Ec 11:2</a>). In one remarkable phrase which occurs (with slight variations of form) 24 times in the Old Testament, two Hebrew words, meaning respectively "yesterday" and "third," are mostly used so as together to express the idea of vague reference to the past. the Revised Version (British and American) renders in a variety of ways: "beforetime" (<a onClick="return mV(\'Gen\',31,2);">Ge 31:2</a>, etc.), "aforetime" (<a onClick="return mV(\'Jos\',4,18);">Jos 4:18</a>), "heretofore" (<a onClick="return mV(\'Exd\',4,10);">Ex 4:10</a>, etc.), "in time (or "times") past" (<a onClick="return mV(\'Deu\',19,4,6);">De 19:4,6</a>; <a onClick="return mV(\'2Sa\',3,17);">2Sa 3:17</a>, etc.).<P>V. Significant Numbers.<P>Numerical symbolism, that is, the use of numbers not merely, if at all, with their literal numerical value, or as round numbers, but with symbolic significance, sacred or otherwise, was widespread in the ancient East, especially in Babylonia and regions more or less influenced by Babylonian culture which, to a certain extent, included Canaan. It must also be remembered that the ancestors of the Israelites are said to have been of Babylonian origin and may therefore have transmitted to their descendants the germs at least of numerical symbolism as developed in Babylonia in the age of Hammurabi. Be that as it may, the presence of this use of numbers in the Bible, and that on a large scale, cannot reasonably be doubted, although some writers have gone too far in their speculations on the subject. The numbers which are unmistakably used with more or less symbolic meaning are 7 and its multiples, and 3,4,10 and 12.<P>1. Seven and Its Multiples:<P>By far the most prominent of these is the <span class="noTag">number 7</span>, which is referred to in one way or another in nearly 600 passages in the Bible, as well as in many passages in the Apocrypha and the Pseudepigrapha, and later Jewish literature. Of course the number has its usual numerical force in many of these places, but even there not seldom with a glance at its symbolic significance. For the determination of the latter we are not assigned to conjecture. There is clear evidence in the cuneiform texts, which are our earliest authorities, that the Babylonians regarded 7 as the number of totality, of completeness. The Sumerians, from whom the Semitic Babylonians seem to have borrowed the idea, equated 7 and "all." The 7-storied towers of Babylonia represented the universe. Seven was the expression of the highest power, the greatest conceivable fullness of force, and therefore was early pressed into the service of religion. It is found in reference to ritual in the age of Gudea, that is perhaps about the middle of the 3rd millennium BC. "Seven gods" at the end of an enumeration meant "all the gods" (for these facts and the cuneiform evidence compare Hehn, Siebenzahl und Sabbath bei den Babyloniern und im Altes Testament, 4ff). How 7 came to be used in this way can only be glanced at here. The view connecting it with the gods of the 7 planets, which used to be in great favor and still has its advocates, seems to lack ancient proof. Hehn (op. cit., 44ff) has shown that the number acquired its symbolic meaning long before the earliest time for which that reference can be demonstrated. As this sacred or symbolic use of 7 was not peculiar to the Babylonians and their teachers and neighbors, but was more or less known also in India and China, in classical lands, and among the Celts and the Germans, it probably originated in some fact of common observation, perhaps in the four lunar phases each of which comprises 7 days and a fraction. Conspicuous groups of stars may have helped to deepen the impression, and the fact that 7 is made up of two significant numbers, each, as will be shown, also suggestive of completeness——3 and 4—may have been early noticed and taken into account. The Biblical use of 7 may be conveniently considered under 4 heads:<P class="in15">(1) ritual use;<P class="in15">(2) historical use;<P class="in15">(3) didactic or literary use;<P class="in15">(4) apocalyptic use.<P>(1) Ritual Use of Seven.<P>The <span class="noTag">number 7</span> plays a conspicuous part in a multitude of passages giving rules for worship or purification, or recording ritual actions. The 7th day of the week was holy (see <a href="./study/isbe/search.html?string=SABBATH">SABBATH</a>). There were 7 days of unleavened bread (<a onClick="return mV(\'Exd\',34,18);">Ex 34:18</a>, etc.), and 7 days of the Feast of Tabernacles (<a onClick="return mV(\'Lev\',23,34);">Le 23:34</a>). The 7th year was the sabbatical year (<a onClick="return mV(\'Exd\',21,2);">Ex 21:2</a>, etc.). The Moabite Balak built Balaam on three occasions 7 altars and provided in each case 7 bullocks and 7 rams (<a onClick="return mV(\'Num\',23,1,14,29);">Nu 23:1,14,29</a>). The Mosaic law prescribed 7 he-lambs for several festal offerings (<a onClick="return mV(\'Num\',28,11,19,27);">Nu 28:11,19,27</a>, etc.). The 7-fold sprinkling of blood is enjoined in the ritual of the Day of Atonement (<a onClick="return mV(\'Lev\',16,14,19);">Le 16:14,19</a>), and elsewhere. Seven-fold sprinkling is also repeatedly mentioned in the rules for the purification of the leper and the leprous house (<a onClick="return mV(\'Lev\',14,7,16,27,51);">Le 14:7,16,27,51</a>). The leprous Naaman was ordered to bathe 7 times in the Jordan (<a onClick="return mV(\'2Ki\',5,10);">2Ki 5:10</a>). In cases of real or suspected uncleanness through leprosy, or the presence of a corpse, or for other reasons, 7 days\' seclusion was necessary (<a onClick="return mV(\'Lev\',12,2);">Le 12:2</a>, etc.). Circumcision took place after 7 days (<a onClick="return mV(\'Lev\',12,3);">Le 12:3</a>). An animal must be 7 days old before it could be offered in sacrifice (<a onClick="return mV(\'Exd\',22,30);">Ex 22:30</a>). Three periods of 7 days each are mentioned in the rules for the consecration of priests (<a onClick="return mV(\'Exd\',29,30,35,37);">Ex 29:30,35,37</a>). An oath seems to have been in the first instance by 7 holy things (<a onClick="return mV(\'Gen\',21,29);">Ge 21:29</a> and the Hebrew word for "swear"). The <span class="noTag">number 7</span> also entered into the structure of sacred objects, for instance the candlestick or lamp-stand in the tabernacle and the second temple each of which had 7 lights (<a onClick="return mV(\'Num\',8,2);">Nu 8:2</a>; <a onClick="return mV(\'Zec\',4,2);">Zec 4:2</a>). Many other instances of the ritual use of 7 in the Old Testament and many instructive parallels from Babylonian texts could be given.<P>(2) Historical Use of Seven.<P>The <span class="noTag"number 7</span> also figures prominently in a large number of passages which occur in historical narrative, in a way which reminds us of its symbolic significance. The following are some of the most remarkable: Jacob\'s 7 years\' service for Rachel (<a onClick="return mV(\'Gen\',29,20);">Ge 29:20</a>; compare <a onClick="return mV(\'Gen\',29,27);">Ge 29:27</a>f), and his bowing down 7 times to Esau (<a onClick="return mV(\'Gen\',33,3);">Ge 33:3</a>); the 7 years of plenty, and the 7 years of famine (<a onClick="return mV(\'Gen\',41,53);">Ge 41:53</a>f); Samson\'s 7 days\' marriage feast (<a onClick="return mV(\'Jdg\',14,12);">Jud 14:12</a>; compare <a onClick="return mV(\'Gen\',29,27);">Ge 29:27</a>), 7 locks of hair (<a onClick="return mV(\'Jdg\',16,19);">Jud 16:19</a>), and the 7 withes with which he was bound (<a onClick="return mV(\'Jdg\',16,7);">Jud 16:7</a>f); the 7 daughters of Jethro (<a onClick="return mV(\'Exd\',2,16);">Ex 2:16</a>), the 7 sons of Jesse (<a onClick="return mV(\'1Sa\',16,10);">1Sa 16:10</a>), the 7 sons of Saul (<a onClick="return mV(\'2Sa\',21,6);">2Sa 21:6</a>), and the 7 sons of Job (<a onClick="return mV(\'Job\',1,2);">Job 1:2</a>; compare <a onClick="return mV(\'Job\',42,13);">Job 42:13</a>); the 7 days\' march of the 7 priests blowing 7 trumpets round the walls of Jericho, and the 7-fold march on the 7th day (<a onClick="return mV(\'Jos\',6,8);">Jos 6:8</a>); the 7 ascents of Elijah\'s servant to the top of Carmel (<a onClick="return mV(\'1Ki\',18,43);">1Ki 18:43</a>f); the 7 sneezes of the Shunammitish woman\'s son (<a onClick="return mV(\'2Ki\',4,35);">2Ki 4:35</a>); the heating of Nebuchadnezzar\'s furnace 7 times more than it was wont to be heated (<a onClick="return mV(\'Dan\',8,19);">Da 8:19</a>), and the king\'s madness for 7 times or years (<a onClick="return mV(\'Dan\',4,16,23,25,32);">Da 4:16,23,25,32</a>); Anna\'s 7 years of wedded life (<a onClick="return mV(\'Luk\',2,36);">Lu 2:36</a>); the 7 loaves of the 4,000 (<a onClick="return mV(\'Mat\',15,\'34-36\');">Mt 15:34-36</a> parallel) and the 7 baskets full of fragments (<a onClick="return mV(\'Mat\',15,37);">Mt 15:37</a> parallel); the 7 brothers in the conundrum of the Sadducees (<a onClick="return mV(\'Mat\',22,25);">Mt 22:25</a> parallel); the 7 demons cast out of Mary Magdalene (<a onClick="return mV(\'Mar\',16,9);">Mr 16:9</a> parallel <a onClick="return mV(\'Luk\',8,2);">Lu 8:2</a>); the 7 ministers in the church at Jerusalem (<a onClick="return mV(\'Act\',6,3);">Ac 6:3</a>), and the 7 sons of Sceva (<a onClick="return mV(\'Act\',19,14);">Ac 19:14</a>, but the Western text represents them as only 2). The number must no doubt be understood literally in many of these passages, but even then its symbolic meaning is probably hinted at by the historian. When a man was said to have had 7 sons or daughters, or an action was reported as done or to be done 7 times, whether by design or accident, the number was noted, and its symbolic force remembered. It cannot indeed be regarded in all these cases as a sacred number, but its association with sacred matters which was kept alive among the Jews by the institution of the Sabbath, was seldom, if ever, entirely overlooked.<P>(3) Didactic or Literary Use of Seven.<P>The symbolic use of 7 naturally led to its employment by poets and teachers for the vivid expression of multitude or intensity. This use is sometimes evident, and sometimes latent. (a) Evident examples are the 7-fold curse predicted for the murderer of Cain (<a onClick="return mV(\'Gen\',4,15);">Ge 4:15</a>); fleeing 7 ways (<a onClick="return mV(\'Deu\',28,7,25);">De 28:7,25</a>); deliverance from 7 troubles (<a onClick="return mV(\'Job\',5,19);">Job 5:19</a>); praise of God 7 times a day (<a onClick="return mV(\'Psa\',119,164);">Ps 119:164</a>); 7 abominations (<a onClick="return mV(\'Pro\',26,25);">Pr 26:25</a>; compare <a onClick="return mV(\'Pro\',6,16);">Pr 6:16</a>); silver purified 7 times, that is, thoroughly purified (<a onClick="return mV(\'Psa\',12,6);">Ps 12:6</a>); 7-fold sin; 7-fold repentance, and 7-fold forgiveness (<a onClick="return mV(\'Luk\',17,4);">Lu 17:4</a>; compare <a onClick="return mV(\'Mat\',18,21);">Mt 18:21</a>); 7 evil spirits (<a onClick="return mV(\'Mat\',12,45);">Mt 12:45</a> parallel <a onClick="return mV(\'Luk\',11,26);">Lu 11:26</a>). The last of these, as well as the previous reference to the 7 demons cast out of Mary Magdalene reminds us of the 7 spirits of Beliar (Testament to the Twelve Patriarchs, Reuben chapters 2 and 3) and of the 7 evil spirits so often referred to in Babylonian exorcisms (compare Hehn, op. cit., 26ff), but it is not safe to connect our Lord\'s words with either. The Babylonian belief may indeed have influenced popular ideas to some extent, but there is no need to find a trace of it in the Gospels. The 7 demons of the latter are sufficiently accounted for by the common symbolic use of 7. For other passages which come under this head compare <a onClick="return mV(\'Deu\',28,7,25);">De 28:7,25</a>; <a onClick="return mV(\'Rth\',4,15);">Ru 4:15</a>; <a onClick="return mV(\'1Sa\',2,5);">1Sa 2:5</a>; <a onClick="return mV(\'Psa\',79,12);">Ps 79:12</a>. (b) Examples of latent use of the <span class="noTag">number 7</span>, of what Zockler (RE3, "Sieben") calls "latent heptads," are not infrequent. The 7-fold use of the expression "the voice of Yahweh" in <a onClick="return mV(\'Psa\',29,\'1-\');">Ps 29</a>, which has caused it to be named "The Psalm of the Seven Thunders," and the 7 epithets of the Divine Spirit in <a onClick="return mV(\'Isa\',11,2);">Isa 11:2</a>, cannot be accidental. In both cases the number is intended to point at full-summed completeness. In the New Testament we have the 7 beatitudes of character (<a onClick="return mV(\'Mat\',5,\'3-9\');">Mt 5:3-9</a>); the 7 petitions of the Paternoster (<a onClick="return mV(\'Mat\',6,9);">Mt 6:9</a>f); the 7 parables of the Kingdom in <a onClick="return mV(\'Mat\',13,1);">Mt 13</a>; the 7 woes pronounced on the Pharisees (<a onClick="return mV(\'Mat\',23,13,15,16,23,25,27,29);">Mt 23:13,15,16,23,25,27,29</a>), perhaps the 7 sayings of Jesus, beginning with "I am" (ego eimi) in the Fourth Gospel (<a onClick="return mV(\'Jhn\',6,35);">Joh 6:35</a>; <a onClick="return mV(\'Jhn\',8,12);">8:12</a>; <a onClick="return mV(\'Jhn\',10,7,11);">10:7,11</a>; <a onClick="return mV(\'Jhn\',11,25);">11:25</a>; <a onClick="return mV(\'Jhn\',14,6);">14:6</a>; <a onClick="return mV(\'Jhn\',15,1);">15:1</a>), and the 7 disciples at the Lake after the Resurrection (<a onClick="return mV(\'Jhn\',21,2);">Joh 21:2</a>). Several groups of 7 are found in the Epistles and in Revelation: 7 forms of suffering (<a onClick="return mV(\'Rom\',8,35);">Ro 8:35</a>); 7 gifts or charismata (<a onClick="return mV(\'Rom\',12,\'6-9\');">Ro 12:6-9</a>); 7 attributes of the wisdom that is from above (<a onClick="return mV(\'Jam\',3,17);">Jas 3:17</a>); 7 graces to be added to faith (<a onClick="return mV(\'2Pe\',1,5);">2Pe 1:5</a>); two doxologies each containing 7 words of praise (<a onClick="return mV(\'Rev\',5,12);">Re 5:12</a>; <a onClick="return mV(\'Rev\',7,12);">7:12</a>), and 7 classes of men (<a onClick="return mV(\'Rev\',6,15);">Re 6:15</a>). Other supposed instances of 7-fold grouping in the Fourth Gospel are pointed out by E.A. Abbott (Johannine Grammar, 2624ff), but are of uncertain value.<P>(4) Apocalyptic Use of Seven.<P>As might be expected, 7 figures greatly in apocalyptic literature, although it is singularly absent from the apocalyptic portion of Daniel. Later works of this kind, however—the writings bearing the name of Enoch, the Testaments of Reuben and Levi, 2 Esd, etc.—supply many illustrations. The doctrine of the 7 heavens which is developed in the Slavonic Enoch and elsewhere and may have been in the first instance of Babylonian origin is not directly alluded to in the Bible, but probably underlies the apostle\'s reference to the third heaven (<a onClick="return mV(\'2Cr\',12,2);">2Co 12:2</a>). In the one apocalyptic writing in the New Testament, 7 is employed with amazing frequency. We read of 7 churches (<a onClick="return mV(\'Rev\',1,4);">Re 1:4</a>, etc.); 7 golden candlesticks (<a onClick="return mV(\'Rev\',1,12);">Re 1:12</a>, etc.); 7 stars (<a onClick="return mV(\'Rev\',1,16);">Re 1:16</a>); 7 angels of the churches (<a onClick="return mV(\'Rev\',1,20);">Re 1:20</a>); 7 lamps of fire (<a onClick="return mV(\'Rev\',4,5);">Re 4:5</a>); 7 spirits of God (<a onClick="return mV(\'Rev\',1,4);">Re 1:4</a>; <a onClick="return mV(\'Rev\',3,1);">3:1</a>; <a onClick="return mV(\'Rev\',4,5);">4:5</a>); a book with 7 seals (<a onClick="return mV(\'Rev\',5,1);">Re 5:1</a>); a lamb with 7 horns and 7 eyes (<a onClick="return mV(\'Rev\',5,6);">Re 5:6</a>); 7 angels with 7 trumpets (<a onClick="return mV(\'Rev\',8,2);">Re 8:2</a>); 7 thunders (<a onClick="return mV(\'Rev\',10,3);">Re 10:3</a>); a dragon with 7 heads and 7 diadems (<a onClick="return mV(\'Rev\',13,3);">Re 13:3</a>); a beast with 7 heads (<a onClick="return mV(\'Rev\',18,1);">Re 18:1</a>); 7 angels having the 7 last plagues (<a onClick="return mV(\'Rev\',15,1);">Re 15:1</a>); and 7 golden bowls of the wrath of God (<a onClick="return mV(\'Rev\',15,7);">Re 15:7</a>) and a scarlet-colored beast with 7 heads (<a onClick="return mV(\'Rev\',17,3);">Re 17:3</a>) which are 7 mountains (<a onClick="return mV(\'Rev\',17,9);">Re 17:9</a>) and 7 kings (<a onClick="return mV(\'Rev\',17,10);">Re 17:10</a>). The writer, whoever he was, must have had his imagination saturated with the numerical symbolism which had been cultivated in Western Asia for millenniums. There cannot be a shadow of doubt that 7 for him expressed fullness, completeness. As this inquiry will have shown, the significance of the number is practically the same throughout the Bible. Although a little of it may have been rubbed off in the course of ages, the main idea suggested by 7 was never quite lost sight of in Biblical times, and the number is still used in the life and song of the Holy Land and Arabia with at least an echo of its ancient meaning.<P>The significance of 7 extends to its multiples. Fourteen, or twice 7, is possibly symbolic in some cases. The stress laid in the Old Testament on the 14th of the month as the day of the Passover (<a onClick="return mV(\'Exd\',12,6);">Ex 12:6</a> and 16 other places), and the regulation that 14 lambs were to be offered on each of the 7 days of the Feast of Tabernacles (<a onClick="return mV(\'Num\',29,13,15);">Nu 29:13,15</a>) hint at design in the selection of the number, especially in view of the fact that 7 and 7 occur repeatedly in cuneiform literature—in magical and liturgical texts, and in the formula so often used in the Am Tab: "7 and 7 times at the feet of the king my lord...I prostrate myself." The arrangement of the generations from Abraham to Christ in three groups of 14 each (<a onClick="return mV(\'Mat\',1,17);">Mt 1:17</a>) is probably intentional, so far as the number in each group is concerned. It is doubtful whether the number has any symbolic force in <a onClick="return mV(\'Act\',27,27);">Ac 27:27</a>; <a onClick="return mV(\'2Cr\',12,2);">2Co 12:2</a>; <a onClick="return mV(\'Gal\',2,1);">Ga 2:1</a>. Of course it must be remembered that both the Hebrew and Greek words for 14 (\'arba\'ah asar; dekatessares) suggest that it is made up of 10 and 4, but constant use of 7 in the sense above defined will have influenced the application of its double, at least in some cases.<P>Forty-nine, or 7 X 7, occurs in two regulations of the Law. The second of the three great festivals took place on the 50th day after one of the days of unleavened bread (<a onClick="return mV(\'Lev\',23,15);">Le 23:15</a>), that is, after an interval of 7 X 7 days; and two years of Jubilee were separated by 7 X 7 years (<a onClick="return mV(\'Lev\',25,8);">Le 25:8</a>). The combination is met with also in one of the so-called Penitential Psalms of Babylonia: "Although my sins are 7 times 7, forgive me my sins."<P>Seven multiplied by ten, or 70, was a very strong expression of multitude which is met with in a large number of passages in the Old Testament. It occurs of persons: the 70 descendants of Jacob (<a onClick="return mV(\'Exd\',15,\'1-\');">Ex 15</a>; <a onClick="return mV(\'Deu\',10,22);">De 10:22</a>); the 70 elders of Israel (<a onClick="return mV(\'Exd\',24,1,9);">Ex 24:1,9</a>; <a onClick="return mV(\'Num\',11,16,24);">Nu 11:16,24</a>f); the 70 kings ill treated by Adoni-bezek (<a onClick="return mV(\'Jdg\',1,7);">Jud 1:7</a>); the 70 sons of Gideon (<a onClick="return mV(\'Jdg\',8,30);">Jud 8:30</a>; <a onClick="return mV(\'Jdg\',9,2);">9:2</a>); the 70 descendants of Abdon who rode on 70 asscolts (<a onClick="return mV(\'Jdg\',12,14);">Jud 12:14</a>); the 70 sons of Ahab (<a onClick="return mV(\'2Ki\',10,1,6);">2Ki 10
