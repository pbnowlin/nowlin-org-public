isbe[6402]='Nicolaitans`nik-o-la\'-i-tanz Nikolaitai):<P>1. The Sect:<P>A sect or party of evil influence in early Christianity, especially in the 7 churches of Asia. Their doctrine was similar to that of Balaam, "who taught Balak to cast a stumblingblock before the children of Israel, to eat things sacrificed to idols, and to commit fornication" (<a onClick="return mV(\'Rev\',2,14,15);">Re 2:14,15</a>). Their practices were strongly condemned by John, who praised the church in Ephesus for "hating their works" (<a onClick="return mV(\'Rev\',2,6);">Re 2:6</a>), and blamed the church in Pergamum for accepting in some measure their teaching (<a onClick="return mV(\'Rev\',2,15);">Re 2:15</a>). Except that reference is probably made to their influence in the church at Thyatira also, where their leader was "the woman Jezebel, who calleth herself a prophetess" (<a onClick="return mV(\'Rev\',2,20);">Re 2:20</a>; compare <a onClick="return mV(\'Rev\',2,14);">Re 2:14</a>), no further direct information regarding them is given in Scripture.<P>2. References:<P>Reference to them is frequent in post-apostolic literature. According to Irenaeus (Adv. Haer., i.26,3; iii.10,7), followed by Hippolytus (Philos., vii.36), they were founded by Nicolaus, the proselyte of Antioch, who was one of the seven chosen to serve at the tables (<a onClick="return mV(\'Act\',6,5);">Ac 6:5</a>). Irenaeus, as also Clement of Alexandria (Strom., ii.20), Tertullian and others, unite in condemning their practices in terms similar to those of John; and reference is also made to their Gnostic tendencies. In explanation of the apparent incongruity of such an immoral sect being founded by one of "good report, full of the Spirit and of wisdom" (compare <a onClick="return mV(\'Act\',6,3);">Ac 6:3</a>), Simcox argues that their lapse may have been due to reaction from original principles of a too rigid asceticism. A theory, started in comparatively modern times, and based in part on the similarity of meaning of the Greek "Nikolaus," and the Hebrew "Balaam," puts forward the view that the two sects referred to under these names were in reality identical. Yet if this were so, it would not have been necessary for John to designate them separately.<P>3. Nicolaitan Controversy:<P>The problem underlying the Nicolaitan controversy, though so little direct mention is made of it in Scripture, was in reality most important, and concerned the whole relation of Christianity to paganism and its usages. The Nicolaitans disobeyed the command issued to the Gentile churches, by the apostolic council held at Jerusalem in 49-50 AD, that they should refrain from the eating of "things sacrificed to idols" (<a onClick="return mV(\'Act\',15,29);">Ac 15:29</a>). Such a restriction, though seemingly hard, in that it prevented the Christian communities from joining in public festivals, and so brought upon them suspicion and dislike, was yet necessary to prevent a return to a pagan laxity of morals. To this danger the Nicolaitans were themselves a glaring witness, and therefore John was justified in condemning them. In writing to the Corinthians, Paul gives warning against the same evil practices, basing his arguments on consideration for the weaker brethren (compare <a onClick="return mV(\'1Cr\',8,\'1-\');">1Co 8</a>).<P>LITERATURE.<P>Simcox, "Revelation" in the Cambridge Bible; H. Cowan in Hastings, Dictionary of the Bible (five volumes), article "Nicolaitans"; H.B. Swete, The Apocalypse of John, lxxff, 27, 28, 37.``88';
isbe[6403]='Nicolaus; Nicolas`nik-o-la\'-us (English Versions of the Bible), nik\'-o-las (Nikolaos): One of "the seven" chosen to have the oversight of "the daily ministration" to the poor of the church in Jerusalem (<a onClick="return mV(\'Act\',6,5);">Ac 6:5</a>). He is called "a proselyte of Antioch"; the other 6 were therefore probably Jews by birth. This is the first recorded case of the admission of a proselyte into office in the Christian church. Some of the church Fathers (Irenaeus, Hippolytus, Pseudo-Tertullian) state that he was the founder of the sect called <a href="./study/isbe/search.html?string=NICOLAITANS">NICOLAITANS</a> (which see) (<a onClick="return mV(\'Rev\',2,15);">Re 2:15</a>). Other Fathers seem to suggest that this was a vain claim made by this sect in seeking apostolic authority for their opinions. It may be that the opinions of this sect were an antinomian exaggeration of the preaching of Nicolaus.``78';
isbe[6404]='Nicopolis`ni-kop\'-o-lis (Nikopolis): A city in Palestine, half-way between Jaffa and Jerusalem, now called Ammas, mentioned in 1Macc 3:40,57 and 9:50. The earlier city (Emmaus) was burnt by Quintilius Varus, but was rebuilt in 223 AD as Nicopolis.<P>The Nicopolis, however, to which Paul urges Titus to come (pros me eis Nikopolin, ekei gar kekrika paracheimasai (<a onClick="return mV(\'Tts\',3,12);">Tit 3:12</a>)) is probably the city of that name situated on the southwest promontory of Epirus. If this view is correct, the statement made by some writers that from Eastern Greece (Athens, Thessalonica, Philippi, Corinth) Paul\'s labors extended to Italy, that he never visited Western Greece, requires modification. It is true that we do not hear of his preaching at Patras, Zacynthus, Cephallenia, Corcyra (the modern Corfu), which, as a way-station to and from Sicily, always held preeminence among the Ionian islands; but there can be little doubt that, if his plan of going to Nicopolis was carried out, he desired to evangelize the province of Epirus (as well Acarnania) in Western Greece. Indeed, it was in this very city of Nicopolis, probably, that he was arrested and taken to Rome for trial—during one of the winters between 64-67 AD.<P>Nicopolis was situated only a few miles north of the modern Prevesa, the chief city of Epirus today, the city which the Greeks bombarded in 1912 in the hope of wresting it from the Turks. The ancient city was founded by Augustus, whose camp happened to be pitched there the night before the famous fight with Antony (31 BC). The gulf, called Ambracia in ancient times, is now known as Arta. On the south side was Actium, where the battle was fought. Directly across, only half mile distant, on the northern promontory, was the encampment of Augustus. To commemorate the victory over his antagonist, the Roman emperor built a city on the exact spot where his army had encamped ("Victory City"). On the hill now called Michalitzi, on the site of his own tent, he built a temple to Neptune and instituted games in honor of Apollo, who was supposed to have helped him in the sea-fight. Nicopolis soon became the metropolis of Epirus, with an autonomous constitution, according to Greek custom. But in the time of the emperor Julian (362) the city had fallen into decay, at least in part. It was plundered by the Goths, restored by Justinian, and finally disappeared entirely in the Middle Ages, so far as the records of history show. One document has Nikopolis he nun Prebeza, "Nicopolis], which is now Prebeza." In the time of Augustus, however, Nicopolis was a flourishing town. The emperor concentrated here the population of Aetolia and Acarnania, and made the city a leading member of the Amphictyonic Council. There are considerable ruins of the ancient city, including two theaters, a stadium, an aqueduct, etc.<P>LITERATURE.<P>Kuhn, Ueber die Entstehung der staate der Alten.``71';

isbe[6407]='Night`nit.<P>1. In the Old Testament:<P>Figurative uses: The word "night" (laylah or layil is sometimes used figuratively in the Old Testament. Thus, Moses compares the brevity of time, the lapse of a thousand years, to "a watch in the night" (<a onClick="return mV(\'Psa\',90,4);">Ps 90:4</a>). Adversity is depicted by it in such places as <a onClick="return mV(\'Job\',35,10);">Job 35:10</a>; compare <a onClick="return mV(\'Isa\',8,20);">Isa 8:20</a>; <a onClick="return mV(\'Jer\',15,9);">Jer 15:9</a>. Disappointment and despair are apparently depicted by it in the "burden of Dumah" (<a onClick="return mV(\'Isa\',21,11,12);">Isa 21:11,12</a>); and spiritual blindness, coming upon the false prophets (<a onClick="return mV(\'Mic\',3,6);">Mic 3:6</a>); again sudden and overwhelming confusion (<a onClick="return mV(\'Amo\',5,8);">Am 5:8</a>; <a onClick="return mV(\'Isa\',59,10);">Isa 59:10</a> the King James Version, nesheph, "twilight" as in the Revised Version (British and American)).<P>2. In the New Testament:<P>On the lips of Jesus (<a onClick="return mV(\'Jhn\',9,4);">Joh 9:4</a>) it signifies the end of opportunity to labor; repeated in that touching little allegory spoken to His disciples when He was called to the grave of Lazarus (<a onClick="return mV(\'Jhn\',11,9,10);">Joh 11:9,10</a>). Paul also uses the figure in reference to the Parousia (<a onClick="return mV(\'Rom\',13,12);">Ro 13:12</a>), where "night" seems to refer to the present aeon and "day" to the aeon to come. He also uses it in <a onClick="return mV(\'1Th\',5,5,7);">1Th 5:5,7</a> where the status of the redeemed is depicted by "day," that of the unregenerate by "night," again, as the context shows, in reference to the Parousia. In <a onClick="return mV(\'Rev\',21,25);">Re 21:25</a> and <a onClick="return mV(\'Rev\',22,5);">22:5</a>, the passing of the "night" indicates the realization of that to which the Parousia looked forward, the establishment of the kingdom of God forever. See also Delitzsch, Iris, 35.`<a href="./study/isbe/search.html?string=DAY+AND+NIGHT">DAY AND NIGHT</a>`42';
isbe[6408]='Night Hawk`nit\'-hok (tachmac, "tachmas"; glaux, but sometimes strouthos, and seirenos; Latin camprimulgus): The Hebrew tachmac means "to tear and scratch the face," so that it is very difficult to select the bird intended by its use. Any member of the eagle, vulture, owl or hawk families driven to desperation would "tear and scratch" with the claws and bite in self-defence. The bird is mentioned only in the lists of abominations (see <a onClick="return mV(\'Lev\',11,16);">Le 11:16</a>; <a onClick="return mV(\'Deu\',14,15);">De 14:15</a>). There are three good reasons why the night-hawk or night-jar, more properly, was intended. The lists were sweeping and included almost every common bird unfit for food. Because of its peculiar characteristics it had been made the object of fable and superstition. It fed on wing at night and constantly uttered weird cries. Lastly, it was a fierce fighter when disturbed in brooding or raising its young. Its habit was to lie on its back and fight with beak and claw with such ferocity that it seemed very possible that it would "tear and scratch the face." Some commentators insist that the bird intended was an owl, but for the above reasons the night-jar seems most probable; also several members of the owl family were clearly indicated in the list.`<a href="./study/isbe/search.html?string=HAWK">HAWK</a>`167';
isbe[6409]='Night-Monster`nit\'-mon-ster (lilith; Septuagint onokentauros; Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) lamia):<P><b>I. THE ACCEPTED TRANSLATION</b><P class="in15">1. Professor Rogers\' Statement<P class="in15">2. Exception to the Statement<P><b>II. FOLKLORE IN THE OLD TESTAMENT</b><P class="in15">1. Paucity of References<P class="in15">2. References in Highly Poetical Passages<P class="in15">3. The References Allusive<P class="in15">4. Possibility of Non-mythological Interpretation<P class="in15">5. The Term Lilith.<hr /><P>I. The Accepted Translation.<P>The term "night-monster"\' is a hypothetical translation of the Hebrew term lilith, used once only, in <a onClick="return mV(\'Isa\',34,14);">Isa 34:14</a>. The word is translated in the King James Version "screech-owl," margin "night monster," the Revised Version (British and American) "night-monster," margin "Lilith." The term "night-monster" is also an interpretation, inasmuch as it implies that the Hebrew word is a Babylonian loan-word, and that the reference indicates a survival of primitive folklore.<P>1. Professor Rogers\' Statement:<P>Concerning this weird superstition, and its strange, single appearance in the Book of Isaiah, Professor Rogers has this to say: "The lil, or ghost, was a night-demon of terrible and baleful influence upon men, and only to be cast out with many incantations. The lil was attended by a serving maid, the ardat lili ("maid of night"), which in the Semitic development was transferred into the feminine lilitu. It is most curious and interesting to observe that this ghost-demon lived on through the history of the Babylonian religion, and was carried out into the Hebrew religion, there to find one single mention in the words of one of the Hebrew prophets" (Religions of Assyria and Babylonia, 76, 77).<P>2. Exception to the Statement:<P>Exception is to be taken to this statement, admitting the etymological assumption upon which it rests, that "lilith" is a word in mythology, on the ground that the conception of a night-demon has no place in the religion of the Hebrews as exhibited in the Scriptures. It is certainly worthy of more than passing notice that a conception which is very prominent in the Babylonian mythology, and is worked out with great fullness of doctrinal and ritualistic detail, has, among the Hebrews, so far receded into the background as to receive but one mention in the Bible, and that a bald citation without detail in a highly poetic passage.<P>The most that can possibly be said, with safety, is that if the passage in Isaiah is to be taken as a survival of folklore, it is analogous to those survivals of obsolete ideas still to be found in current speech, and in the literature of the modern world (see <a href="./study/isbe/search.html?string=LUNATIC">LUNATIC</a>). There is no evidence of active participation in this belief, or even of interest in it as such, on the part of the prophetical writer. On the contrary, the nature of the reference implies that the word was used simply to add a picturesque detail to a vivid, imaginative description. All positive evidence of Hebrew participation in this belief belongs to a later date (see Buxtorf\'s Lexicon, under the word "Talmud").<P>II. Folklore in the Old Testament.<P>Attention has been called elsewhere to the meagerness, in the matter of detail, of Old Testament demonology (see <a href="./study/isbe/search.html?string=DEMON,+DEMONOLOGY">DEMON, DEMONOLOGY</a>; <a href="./study/isbe/search.html?string=COMMUNION+WITH+DEMONS">COMMUNION WITH DEMONS</a>). A kindred fact of great importance should be briefly noticed here, namely, that the traces of mythology and popular folklore in the Bible are surprisingly faint and indistinct. We have the following set of items in which such traces have been discovered: "Rahab" (rachabh), mentioned in <a onClick="return mV(\'Job\',9,13);">Job 9:13</a>; <a onClick="return mV(\'Job\',26,12);">26:12</a>; <a onClick="return mV(\'Isa\',51,9);">Isa 51:9</a>; "Tanin" (tannin), <a onClick="return mV(\'Isa\',27,1);">Isa 27:1</a>; "Leviathan" (liwyathan), <a onClick="return mV(\'Job\',3,8);">Job 3:8</a>; <a onClick="return mV(\'Psa\',74,14);">Ps 74:14</a>; <a onClick="return mV(\'Isa\',27,1);">Isa 27:1</a>; <a onClick="return mV(\'Eze\',29,3);">Eze 29:3</a>; <a onClick="return mV(\'Job\',41,\'1-\');">Job 41</a> passim; the "serpent in the sea," in <a onClick="return mV(\'Amo\',9,3);">Am 9:3</a>; "Seirim" (se\'irim), <a onClick="return mV(\'2Ch\',11,15);">2Ch 11:15</a>; <a onClick="return mV(\'Lev\',17,7);">Le 17:7</a>; <a onClick="return mV(\'2Ki\',23,8);">2Ki 23:8</a>; <a onClick="return mV(\'Isa\',13,21);">Isa 13:21</a>; <a onClick="return mV(\'Isa\',34,14);">34:14</a>; "Alukah" (\'aluqah), <a onClick="return mV(\'Pro\',30,15);">Pr 30:15</a>; "Azazel (\'aza\'zel) <a onClick="return mV(\'Lev\',16,8,10,26);">Le 16:8,10,26</a> "Lilith" (ut sup.), <a onClick="return mV(\'Isa\',34,14,15);">Isa 34:14,15</a>.when disturbed in brooding or raising its young. Its habit was to lie on its back and fight with beak and claw with such ferocity that it seemed very possible that it would "tear and scratch the face." Some commentators insist that the bird intended was an owl, but for the above reasons the night-jar seems most probable; also several members of the owl family were clearly indicated in the list.<P>A review of these passages brings certain very interesting facts to light.<P>1. Paucity of References:<P>The references are few in number. Rahab is mentioned 3 times; Tannin (in this connection), once; Leviathan, 5 times; the serpent in the sea, once; Seirim, 5 times (twice with references to idols); Alukah, once; Azazel, 3 times in one chapter and in the same connection; Lilith, once.<P>2. References in Highly Poetical Passages:<P>These references, with the single exception of Azazel to which we shall return a little later, are all in highly poetical passages. On general grounds of common-sense we should not ascribe conscious and deliberate mythology to writers or speakers of the Bible in passages marked by imaginative description and poetic imagery, any more than we should ascribe such beliefs to modern writers under like circumstances. Poetry is the realm of truth and not of matter of fact. In passages of this tenor, mythology may explain the word itself and justify its appropriateness, it does not explain the use of the term or disclose the personal view of the writer. 3. The References Allusive:<P>All these references are in the highest degree allusive. They exhibit no exercise of the mythological fancy and have received no embroidery with details. This is most significant. So far as our specific references are concerned, we are dealing with petrified mythology, useful as literary embellishment, but no longer interesting in itself.<P>4. Possibility of Non-mythological Interpretation:<P>Every one of these words is sufficiently obscure in origin and uncertain in meaning to admit the possibility of a non-mythological interpretation; indeed, in several of the parallels a non-mythological use is evident. Bible-Dict. writers are apt to say (e.g. concerning lilith) that there is no doubt concerning the mythological reference. The reader may discover for himself that the lexicographers are more cautious (see Brown, Driver, and Briggs, Hebrew and English Lexicon of the Old Testament, in the place cited.). The use of "Rahab" in <a onClick="return mV(\'Job\',26,12);">Job 26:12</a> is not mythological for the simple reason that it is figurative; the use of "Leviathan" in <a onClick="return mV(\'Isa\',27,1);">Isa 27:1</a> and <a onClick="return mV(\'Eze\',29,3);">Eze 29:3</a> comes under the same category. In <a onClick="return mV(\'Job\',40,\'1-\');">Job 40</a> and <a onClick="return mV(\'Job\',41,\'1-\');">41</A>, if the identification of behemoth and leviathan with hippopotamus and crocodile be allowed to stand and the mythological significance of the two be admitted, we have the stage where mythology has become a fixed and universal symbolism which can be used to convey truth apart from the belief in it as reality (see <a href="./study/isbe/search.html?string=LEVIATHAN">LEVIATHAN</a>; "Job," New Century Bible, p. 335; Meth. Rev., May, 1913, 429ff). The sea serpent of <a onClick="return mV(\'Amo\',9,3);">Am 9:3</a> is not necessarily the dragon or Tiamat, and the use of the term is merely suggestive. The term se\'ir is in literal use for "he-goat" (<a onClick="return mV(\'Num\',15,24);">Nu 15:24</a>, et al.) and is doubtful throughout. Ewald translates it "he-goat" in <a onClick="return mV(\'Isa\',34,14);">Isa 34:14</a> and "Satyr" in <a onClick="return mV(\'Isa\',34,21);">13:21</A>. It means literally "shaggy monster" (Vulgate, pilosus). We do not hesitate on the basis of the evidence to erase "Alukah" (<a onClick="return mV(\'Pro\',30,15);">Pr 30:15</a>, the Revised Version (British and American) "horse-leech," by some translated "vampire") and "Azazel" (<a onClick="return mV(\'Lev\',16,8);">Le 16:8</a>, etc.), interpreted as a "demon of the desert," from the list of mythological words altogether. As ripe a scholar as Perowne ("Proverbs," Cambridge Bible) combats the idea of vampire, and Kellogg ("Leviticus," Expositor\'s Bible, in the place cited.) has simply put to rout the mythological-demonic interpretation of Azazel. Even in the case of Lilith the derivation is obscure, and the objections urged against the demonic idea by Alexander have not altogether lost their force (see Commentary on Isaiah, in the place cited.). There is a close balance of probabilities in one direction or the other.<P>5. The Term Lilith:<P>One further fact with regard to Lilith must be considered. The term occurs in a list of creatures, the greater part of which are matter-of-fact animals or birds. A comparative glance at a half-dozen translates of the passage <a onClick="return mV(\'Isa\',34,\'11-14\');">Isa 34:11-14</a> will convince any reader that there are a great many obscure and difficult words to be found in the list. Following Delitzsch\'s translation we have: "pelican," "hedge-hog," "horned-owl," "raven," "wild-dog," "ostrich," "forest-demon" (se\'ir), "night-monster." This is a curious mixture of real and imaginary creatures. Alexander acutely observes that there is too much or too little mythology in the passage. One of two conclusions would seem to follow from a list so constructed: Either all these creatures are looked upon as more or less demonic (see Whitehouse, Hastings, Dictionary of the Bible (five volumes), article "Demon," with which compare West M. Alexander, Demonic Possession in the New Testament, 16), or, as seems to the present writer far more probable, none in the list is considered otherwise than as supposed literal inhabitants of the wilderness. The writer of <a onClick="return mV(\'Isa\',34,14);">Isa 34:14</a>, who was not constructing a scientific treatise, but using his imagination, has constructed a list in which are combined real and imaginary creatures popularly supposed to inhabit unpeopled solitudes. There still remains a by no means untenable supposition that none of the terms necessarily are mythological in this particular passage.``169';
isbe[6410]='Night-Watch`nit\'-woch (\'ashmurah ba-laylah, "watch in the night"): One of the three or four divisions of the night.`<a href="./study/isbe/search.html?string=WATCH">WATCH</a>; <a href="./study/isbe/search.html?string=TIME">TIME</a>`1';
isbe[6411]='Nile`nil (Neilos, meaning not certainly known; perhaps refers to the color of the water, as black or blue. This name does not occur in the Hebrew of the Old Testament or in the English translation):<P><b>I. THE NILE IN PHYSICAL GEOGRAPHY</b><P class="in15">1. Description<P class="in15">2. Geological Origin<P class="in15">3. The Making of Egypt<P class="in15">4. The Inundation<P class="in15">5. The Infiltration<P><b>II. THE NILE IN HISTORY</b><P class="in15">1. The Location of Temples<P class="in15">2. The Location of Cemeteries<P class="in15">3. The Damming of the Nile<P class="in15">4. Egyptian Famines<P><b>III. THE NILE IN RELIGION</b><P class="in15">1. The Nile as a God<P class="in15">2. The Nile in the Osirian Myth<P class="in15">3. The Celestial Nile<hr /><P>A river of North Africa, the great river of Egypt. The name employed in the Old Testament to designate the Nile is in the Hebrew ye\'or, Egyptian aur, earlier, atur, usually translated "river," also occasionally "canals" (<a onClick="return mV(\'Psa\',78,44);">Ps 78:44</a>; <a onClick="return mV(\'Eze\',29,3);">Eze 29:3</a>). In a general way it means all the water of Egypt. The Nile is also the principal river included in the phrase nahare kush, "rivers of Ethiopia" (<a onClick="return mV(\'Isa\',18,1);">Isa 18:1</a>). Poetically the Nile is called yam, "sea" (<a onClick="return mV(\'Job\',41,31);">Job 41:31</a>; <a onClick="return mV(\'Nah\',3,8);">Na 3:8</a>; probably <a onClick="return mV(\'Isa\',18,2);">Isa 18:2</a>), but this is not a name of the river. shichor, not always written fully, has also been interpreted in a mistaken way of the Nile (see <a href="./study/isbe/search.html?string=SHIHOR">SHIHOR</a>). Likewise nahar mitsrayim, "brook of Egypt," a border stream in no way connected with the Nile, has sometimes been mistaken for that river.<P>See <a href="./study/isbe/search.html?string=RIVER+OF+EGYPT">RIVER OF EGYPT</a>.<P>I. The Nile in Physical Geography.<P>1. Description:<P>The Nile is formed by the junction of the White Nile and the Blue Nile in latitude 15 degree 45\' North and longitude 32 degree 45\' East. The Blue Nile rises in the highlands of Abyssinia, latitude 12 degree 30\' North, long. 35 degree East, and flows northwest 850 miles to its junction with the White Nile. The White Nile, the principal branch of the north, rises in Victoria Nyanza, a great lake in Central Africa, a few miles north of the equator, long. 33 degree East (more exactly the Nile may be said to rise at the headwaters of the Ragera River, a small stream on the other side of the lake, 3 degree south of the equator), and flows north in a tortuous channel, 1,400 miles to its junction with the Blue Nile. From this junction-point the Niles flows north through Nubia and Egypt 1,900 miles and empties into the Mediterranean Sea, in latitude 32 degree North, through 2 mouths, the Rosetta, east of Alexandria, and the Damietta, west of Port Said. There were formerly 7 mouths scattered along a coast-line of 140 miles.<P>2. Geological Origin:<P>The Nile originated in the Tertiary period and has continued from that time to this, though by the subsidence of the land 220 ft. along the Mediterranean shore in the Pluvial times, the river was very much shortened. Later in the Pluvial times the land rose again and is still rising slowly.<P>3. The Making of Egypt:<P>Cultivable Egypt is altogether the product of the Nile, every particle of the soil having been brought down by the river from the heart of the continent and deposited along the banks and especially in the delta at the mouth of the river. The banks have risen higher and higher and extended farther and farther back by the deposit of the sediment, until the valley of arable land varies in width in most parts from 3 or 4 miles to 9 or 10 miles. The mouth of the river, after the last elevation of the land in Pluvial times, was at first not far from the latitude of Cairo. From this point northward the river has built up a delta of 140 miles on each side, over which it spreads itself and empties into the sea through its many mouths.<P>4. The Inundation:<P>The, watering of Egypt by the inundation from the Nile is the most striking feature of the physical character of that land, and one of the most interesting and remarkable physical phenomena in the world. The inundation is produced by the combination of an indirect and a direct cause. The indirect cause is the rain and melting snow on the equatorial mountains in Central Africa, which maintains steadily a great volume of water in the White Nile. The direct cause is torrential rains in the highlands of Abyssinia which send down the Blue Nile a sudden great increase in the volume of water. The inundation has two periods each year. The first begins about July 15 and continues until near the end of September. After a slight recession, the river again rises early in October in the great inundation. High Nile is in October, 25 to 30 ft., low Nile in June, about 12 1/2 ft. The Nilometer for recording the height of the water of inundation dates from very early times. Old Nilometers are found still in situ at Edfu and Assuan. The watering and fertilizing of the land is the immediate effect of the inundation; its ultimate result is that making of Egypt which is still in progress. The settling of the sediment from the water upon the land has raised the surface of the valley about 1 ft. in 300 to 400 years, about 9 to 10 ft. near Cairo since the beginning of the early great temples. The deposit varies greatly at other places. As the deposit of sediment has been upon the bottom of the river, as well as upon the surface of the land, though more slowly, on account of the swiftness of the current, the river also has been lifted up, and thus the inundation has extended farther and farther to the east, and the west, as the level of the valley would permit, depositing the sediment and thus making the cultivable land wider, as well as the soil deeper, year by year. At Heliopolis, a little north of Cairo, this extension to the east has been 3 to 4 miles since the building of the great temple there.<P>At Luxor, about 350 miles farther up the river, where the approach toward the mountains is much steeper, the extension of the good soil to the east and the west is inconsiderable.<P>5. The Infiltration:<P>The ancient Egyptians were right in calling all the waters of Egypt the Nile, for wherever water is obtained by digging it is simply the Nile percolating through the porous soil. This percolation is called the infiltration of the Nile. It always extends as far on either side of the Nile as the level of the water in the river at the time will permit. This infiltration, next to the inundation, is the most important physical phenomenon in Egypt. By means of it much of the irrigation of the land during the dry season is carried on from wells. It has had its influence also in the political and religious changes of the country (compare below).<P>II. The Nile in History.<P>1. The Location of Temples:<P>Some of the early temples were located near the Nile, probably because of the deification of the river. The rising of the surface of the land, and at the same time of the bed of the river, from the inundation lifted both Egypt and its great river, but left the temples down at the old level. In time the infiltration of the river from its new higher level reached farther and farther and rose to a higher level until the floor of these old temples was under water even at the time of lowest Nile, and then gods and goddesses, priests and ceremonial all were driven out. At least two of the greatest temples and most sacred places, Heliopolis and Memphis, had to be abandoned. Probably this fact had as much to do with the downfall of Egypt\'s religion, as its political disasters and the actual destruction of its temples by eastern invaders. Nature\'s God had driven out the gods of Nature.<P>2. The Location of Cemeteries:<P>Some prehistoric burials are found on the higher ground, as at Kefr \'Amar. A thousand years of history would be quite sufficient to teach Egyptians that the Nile was still making Egypt. Thenceforth, cemeteries were located at the mountains on the eastern and the western boundaries of the valley. Here they continue to this day, for the most part still entirely above the waters of the inundation—and usually above the reach of the infiltration.<P>3. The Damming of the Nile:<P>The widening of the cultivable land by means of long canals which carried the water from far up the river to levels higher than that of the inundation, farther down the river was practiced from very early times. The substitution of dams for long canals was reserved for modern engineering skill. Three great dams have been made: the first a little Nile of Cairo, the greatest at Assuan, and the last near Asyut.<P>4. Egyptian Famines:<P>Famines in Egypt are always due to failure in the quantity of the waters of inundation. Great famines have not been frequent. The cause of the failure in the water of inundation is now believed to be not so much a lack of the water of inundation from the Blue Nile as the choking of the channel of the White Nile in the great marsh land of the Sudan by the sud, a kind of sedge, sometimes becoming such a tangled mass as to close the channel and impede the flow of the regular volume of water so that the freshet in the Blue Nile causes but little inundation at the usual time, and during the rest of the year the Nile is so low from the same cause that good irrigation by canals and wells is impossible. A channel through the sud is now kept open by the Egyptian government.<P>III. The Nile in Religion.<P>One of the gods of the Egyptian pantheon was Hapi, the Nile. In early times it divided the honors with Ra, the sun-god. No wonder it was so.<P>1. The Nile as a God:<P>If the Egyptians set out to worship Nature-gods at all, surely then the sun and the Nile first.<P>2. The Nile in Osirian Myth:<P>The origin of the Osirian myth is still much discussed. Very much evidence, perhaps conclusive evidence, can be adduced to prove that it rose originally from the Nile; that Osiris was first of all the Nile, then the water of the Nile, then the soil, the product of the waters of the Nile, and then Egypt, the Nile and all that it produced.<P>3. The Celestial Nile:<P>Egypt was the Egyptian\'s little world, and Egypt was the Nile. It was thus quite natural for the Egyptians in considering the celestial world to image it in likeness of their own world with a celestial Nile flowing through it. It is so represented in the mythology, but the conception of the heavens is vague.``93';
isbe[6412]='Nimrah; Beth-Nimrah`nim\'-ra (nimrah; Codex Vaticanus Nambra; Codex Alexandrinus Ambram), or (beth nimrah; Codex Vaticanus Namram; Codex Alexandria Ambran (<a onClick="return mV(\'Num\',32,36);">Nu 32:36</a>); Codex Vaticanus Baithanabra; Codex Alexandrinus Bethamna (<a onClick="return mV(\'Jos\',13,27);">Jos 13:27</a>)): These two names evidently refer to the same place; but there is no reason to think, as some have done, from the similarity of the names, that it is identical with <a href="./study/isbe/search.html?string=NIMRIM">NIMRIM</a> (which see). On the contrary, the indications of the passages cited point to a site east of the Jordan valley and Nimrah of the Dead Sea. About 11 miles northeast of the mouth of the Jordan, where Wady Nimrin, coming down from the eastern up-lands, enters the plain, stands a hill called Tell Nimrin, with tombs and certain traces of ancient building. This may be certainly identified with Nimrah and Beth-nimrah; and it corresponds to Bethnambris of Eusebius, Onomasticon, which lay 5 Roman miles Nimrah of Livias.``54';
isbe[6413]='Nimrim`nim\'-rim (me nimrim; Codex Vaticanus Nebrein; Codex Alexandrinus Ebrim (<a onClick="return mV(\'Jer\',48,34);">Jer 48:34</a>); to hudor tes Nimreim (<a onClick="return mV(\'Isa\',15,6);">Isa 15:6</a>)): The meaning appears to be "pure" or "wholesome water." The name occurs only in <a onClick="return mV(\'Isa\',15,6);">Isa 15:6</a> and <a onClick="return mV(\'Jer\',48,34);">Jer 48:34</a> in oracles against Moab. In each case it is mentioned in association with Zoar and Horonaim. It is therefore probably to be sought to the southeast of the Dead Sea. Eusebius, Onomasticon, places a town, Bennamareim, to the Nimrim of Zoar, and identifies it with the Old Testament "Nimrim," as it seems, correctly. The name is still found in Wady Numeireh, opening on the sea at Burj Numeirah, Nimrim of Ghor es-Safiyeh. The waters of Nimrim may be sought either in Moiyet Numeirah or in the spring higher up, where lie the ruins of a town in a well-watered and fruitful district (Buhl, GAP, 272).``54';
isbe[6414]='Nimrod`nim\'-rod (nimrodh; Nebrod): A descendant of Ham, mentioned in "the generations of the sons of Noah" (<a onClick="return mV(\'Gen\',10,\'1-\');">Ge 10</a>; compare <a onClick="return mV(\'1Ch\',1,10);">1Ch 1:10</a>) as a son of Cush. He established his kingdom "in the land of Shinar," including the cities "Babel, and Erech, and Accad, and Calneh" (<a onClick="return mV(\'Gen\',10,10);">Ge 10:10</a>), of which only Babel, or Babylon, and Erech, or Uruk, have been identified with certainty. "The land of Shinar" is the old name for Southern Babylonia, afterward called Chaldea (\'erets kasdim), and was probably more extensive in territory than the Sumer of the inscriptions in the ancient royal title, "King of Shumer and Accad," since Accad is included here in Shinar. Nimrod, like other great kings of Mesopotamian lands, was a mighty hunter, possibly the mightiest and the prototype of them all, since to his name had attached itself the proverb: "Like Nimrod a mighty hunter before Yahweh" (<a onClick="return mV(\'Gen\',10,9);">Ge 10:9</a>). In the primitive days of Mesopotamia, as also in Palestine, wild animals were so numerous that they became a menace to life and property (<a onClick="return mV(\'Exd\',23,29);">Ex 23:29</a>; <a onClick="return mV(\'Lev\',26,22);">Le 26:22</a>); therefore the king as benefactor and protector of his people hunted these wild beasts. The early conquest of the cities of Babylonia, or their federation into one great kingdom, is here ascribed to Nimrod. Whether the founding and colonization of Assyria (<a onClick="return mV(\'Gen\',10,11);">Ge 10:11</a>) are to be ascribed to Nimrod will be determined by the exegesis of the text. English Versions of the Bible reads: "Out of that land he (i.e. Nimrod) went forth into Assyria, and builded Nineveh," etc., this translation assigning the rise of Assyria to Nimrod, and apparently being sustained by <a onClick="return mV(\'Mic\',5,5,6);">Mic 5:5,6</a> (compare J. M. P. Smith, "Micah," ICC, in the place cited.); but American Revised Version, margin renders: "Out of that land went forth Asshur, and builded Nineveh," which translation is more accurate exegetically and not in conflict with <a onClick="return mV(\'Mic\',5,6);">Mic 5:6</a>, if in the latter "land of Nimrod" be understood, not as parallel with, but as supplemental to, Assyria, and therefore as Babylon (compare commentaries of Cheyne, Pusey, S. Clark, in the place cited.).<P>Nimrod has not been identified with any mythical hero or historic king of the inscriptions. Some have sought identification with Gilgamesh, the flood hero of Babylonia (Skinner, Driver, Delitzsch); others with a later Kassite king (Haupt, Hilprecht), which is quite unlikely; but the most admissible correspondence is with Marduk, chief god of Babylon, probably its historic founder, just as Asshur, the god of Assyria, appears in verse 11 as the founder of the Assyrian empire (Wellhausen, Price, Sayce). Lack of identification, however, does not necessarily indicate mythical origin of the name.`<a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>; <a href="./study/isbe/search.html?string=BABYLONIA+AND+ASSYRIA,+RELIGION+OF">BABYLONIA AND ASSYRIA, RELIGION OF</a>; <a href="./study/isbe/search.html?string=MERODACH">MERODACH</a>; <a href="./study/isbe/search.html?string=ORION">ORION</a>`109';
isbe[6415]='Nimshi`nim\'-shi (nimshi): The grandfather of Jehu (<a onClick="return mV(\'2Ki\',9,2,14);">2Ki 9:2,14</a>). Jehu\'s usual designation is "son of Nimshi" (<a onClick="return mV(\'1Ki\',19,16);">1Ki 19:16</a>).``1';
isbe[6416]='Nineveh`nin\'-e-ve (nineweh; Nineue, Nineui; Greek and Roman writers, Ninos):<p><b>I. BEGINNINGS, NAME, POSITION</b><P class="in15">1. First Biblical Mention<P class="in15">2. Etymology of the Name<P class="in15">3. Position on the Tigris<P><b>II. NINEVEH AND ITS SURROUNDINGS</b><P class="in15">1. Its Walls<P class="in15">2. Principal Mounds and Gateways<P class="in15">3. Extent and Population within the Walls<P class="in15">4. Extent outside the Walls<P class="in15">5. Calah, Resen and Rehoboth-Ir<P class="in15">6. Khorsabad<P class="in15">7. Sherif Khan and Selamieh<P class="in15">8. Nimroud<P><b>III. PALACES AT NINEVEH PROPER</b><P class="in15">1. The Palace of Sennacherib<P class="in15">2. The Palace of Assur-bani-apli<P><b>IV. SENNACHERIB\'S DESCRIPTION OF NINEVEH</b><P class="in15">1. The Walls<P class="in15">2. The Gates—Northwest<P class="in15">3. The Gates—South and East<P class="in15">4. The Gates—West<P class="in15">5. The Outer Wall: the Plantations<P class="in15">6. The Water-Supply, etc.<P class="in15">7. How the Bas-Reliefs Illustrate the King\'s Description<P class="in15">8. Nineveh the Later Capital<P><b>V. LAST DAYS AND FALL OF NINEVEH</b><P><b>LITERATURE</b><hr /><P>I. Beginnings, Name, Position.<P>1. First Biblical Mention:<P>The first Biblical mention of Nineveh is in <a onClick="return mV(\'Gen\',10,11);">Ge 10:11</a>, where it is stated that <a href="./study/isbe/search.html?string=NIMROD">NIMROD</a> (which see) or Asshur went out into Assyria, and builded Nineveh and Rehoboth-Ir, and Calah, and Resen between Nineveh and Calah, with the addition, "the same is the great city." Everything indicates that these statements are correct, for Nineveh was certainly at one time under Babylonian rule, and was at first not governed by Assyrian kings, but by issake or viceroys of Assur, the old capital. To all appearance Nineveh took its name from the Babylonian Nina near Lagas in south Babylonia, on the Euphrates, from which early foundation it was probably colonized. The native name appears as Ninua or Nina (Ninaa), written with the character for "water enclosure" with that for "fish" inside, implying a connection between Nina and the Semitic nun, "fish."<P>2. Etymology of the Name:<P>The Babylonian Nina was a place where fish were very abundant, and Ishtar or Nina, the goddess of the city, was associated with Nin-mah, Merodach\'s spouse, as goddess of reproduction. Fish are also plentiful in the Tigris at Mosul, the modern town on the other side of the river, and this may have influenced the choice of the site by the Babylonian settlers, and the foundation there of the great temple of Ishtar or Nina. The date of this foundation is unknown, but it may have taken place about 3000 BC.<P>3. Position on the Tigris:<P>Nineveh lay on the eastern bank of the Tigris, at the point where the Khosr falls into that stream. The outline of the wall is rectangular on the west, but of an irregular shape on the east. The western fortifications run from northwest to southeast, following, roughly, the course of the river, which now flows about 1,500 yards from the walls, instead of close to them, as in ancient times.<P>II. Nineveh and Its Surroundings.<P>According to the late G. Smith, the southwestern wall has a length of about 2 1/2 miles, and is joined at its western corner by the northwestern wall, which runs in a northeasterly direction for about 1 1/3 miles.<P>1. Its Walls:<P>The northeastern wall, starting here, runs at first in a southeasterly direction, but turns southward, gradually approaching the southwestern wall, to which, at the end of about 3 1/4 miles, it is joined by a short wall, facing nearly south, rather more than half a mile long.<P>2. Principal Mounds and Gateways:<P>The principal mounds are Kouyunjik, a little northeast of the village of \'Amusiyeh, and Nebi-Yunas, about 1,500 yards to the southeast. Both of these lie just within the southwest wall. Extensive remains of buildings occupy the fortified area. Numerous openings occur in the walls, many of them ancient, though some seem to have been made after the abandonment of the site. The principal gate on the northwest was guarded by winged bulls (see Layard, Monuments of Nineveh, 2nd series, plural 3; Nineveh and Babylon, 120). Other gates gave access to the various commercial roads of the country, those on the east passing through the curved outworks and the double line of fortifications which protected the northeastern wall from attack on that side, where the Ninevites evidently considered that they had most to fear.<P>3. Extent and Population within the Walls:<P>According to G. Smith, the circuit of the inner wall is about 8 miles, and Captain Jones, who made a trigonometrical survey in 1854, estimated that, allotting to each inhabitant 50 square yards, the city may have contained 174,000 inhabitants. If the statement in <a onClick="return mV(\'Jon\',4,11);">Jon 4:11</a>, that the city contained 120,000 persons who could not discern between their right hand and their left, be intended to give the number of the city\'s children only, then the population must have numbered about 600,000, and more than three cities of the same extent would have been needed to contain them.<P>4. Extent outside the Walls:<P>It has therefore been supposed—and that with great probability—that there was a large extension of the city outside its walls. This is not only indicated by <a onClick="return mV(\'Jon\',3,3);">Jon 3:3</a>, where it is described as "an exceeding great city of three days\' journey" to traverse, but also by the extant ruins, which stretch southeast along the banks of the Tigris as far as Nimroud (Calah) while its northern extension may have been regarded as including Khorsabad.<P>5. Calah, Resen and Rehoboth-Ir:<P>Concerning the positions of two of the cities mentioned with Nineveh, namely, Calah and Resen, there can be no doubt, notwithstanding that Resen has not yet been identified—Calah is the modern Nimroud, and Resen lay between that site and Nineveh.<P>The name Rehoboth-Ir has not yet been found in the inscriptions, but Fried. Delitzsch has suggested that it may be the rebit Ninua of the inscriptions, northeast of Nineveh. If this be the case, the Nineveh of Jonah contained within it all the places in <a onClick="return mV(\'Gen\',10,11,12);">Ge 10:11,12</a>, and Khorsabad besides.<P>6. Khorsabad:<P>Taking the outlying ruins from north to south, we begin with Khorsabad (Dur-Sarru-kin or Dur-Sargina), 12 miles northeast of Kouyunjik, the great palace mound of Nineveh proper. Khorsabad is a great enclosure about 2,000 yards square, with the remains of towers and gateways. The palace mound lies on its northwest face, and consists of an extensive platform with the remains of Sargon\'s palace and its temple, with a ziqqurat or temple-tower similar to those at Babylon, Borsippa, Calah and elsewhere. This last still shows traces of the tints symbolical of the 7 planets of which its stages were, seemingly, emblematic. The palace ruins show numerous halls, rooms and passages, many of which were faced with slabs of coarse alabaster, sculptured in relief with military operations, hunting-scenes, mythological figures, etc., while the principal entrances were flanked with the finest winged human-headed bulls which Assyrian art has so far revealed. The palace was built about 712 BC, and was probably destroyed by fire when Nineveh fell in 606 BC, sharing the same fate. Some of the slabs and winged bulls are in the Louvre and the British Museum, but most of the antiquarian spoils were lost in the Tigris by the sinking of the rafts upon which they were loaded after being discovered.<P>7. Sherif Khan and Selamieh:<P>Another outlying suburb was probably Tarbicu, now represented by the ruins at Sherif Khan, about 3 miles north of Kouyunjik. In this lay a temple—"palace" Sennacherib calls it—dedicated to Nergal. In ancient times it must have been a place of some importance, as Esarhaddon seems to have built a palace there, as well as a "seat" for his eldest son, Assur-bani-apli. The site of Resen, "between Nineveh and Calah," is thought to be the modern Selamieh, 12 miles south of Nineveh, and 3 miles north of Nimroud (Calah). It is in the form of an irregular enclosure on a high mound overlooking the Tigris, with a surface of about 400 acres. No remains of buildings, sculptures or inscriptions have, however, been found there.<P>8. Nimroud:<P>After Nineveh. itself (Kouyunjik), the ruins known as Nimroud, 14 or 15 miles southeast, are the most important. They mark the site of the ancient Calah, and have already been described under that heading (see p. 539). As there stated, the stone-faced temple-tower seems to be referred to by Ovid, and is apparently also mentioned by Xenophon (see <a href="./study/isbe/search.html?string=RESEN">RESEN</a>). The general tendency of the accumulated references to these sites supports theory that they were regarded as belonging to Nineveh, if not by the Assyrians themselves (who knew well the various municipal districts), at least by the foreigners who had either visited the city or had heard or read descriptions of it.<P>III. Palaces at Nineveh Proper.<P>The palaces at Nineveh were built upon extensive artificial platforms between 30 and 50 ft. high, either of sundried brick, as at Nimroud, or of earth and rubbish, as at Kouyunjik. It is thought that they were faced with masonry, and that access was gained to them by means of flights of deep steps, or sloping pathways. Naturally it is the plan of the basement floor alone that can at present be traced, any upper stories that may have existed having long since disappeared. The halls and rooms discovered were faced with slabs of alabaster or other stone, often sculptured with bas-reliefs depicting warlike expeditions, the chase, religious ceremonies and divine figures. The depth of the accumulations over these varies from a few inches to about 30 ft., and if the amount in some cases would seem to be excessive, it is thought that this may have been due either to the existence of upper chambers, or to the extra height of the room. The chambers, which are grouped around courtyards, are long and narrow, with small square rooms at the ends. The partition walls vary from 6 to 15 ft. in thickness, and are of sun-dried brick, against which the stone paneling was fixed. As in the case of the Babylonian temples and palaces, the rooms and halls open into each other, so that, to gain access to those farthest from the courtyard entrance, one or more halls or chambers had to be traversed. No traces of windows have been discovered, and little can therefore be said as to the method of lighting, but the windows were either high up, or light was admitted through openings in the roof.<P>1. The Palace of Sennacherib:<P>The palace of Sennacherib lay in the southeast corner of the platform, and consisted of a courtyard surrounded on all four sides by numerous long halls, and rooms, of which the innermost were capable of being rendered private. It was in this palace that were found the reliefs depicting the siege of Lachish, with the representation of Sennacherib seated on his "standing" throne, while the captives and the spoil of the city passed before him. The grand entrance was flanked by winged bulls facing toward the spectator as he entered. They were in couples, back to back, on each side of the doorway, and between each pair the ancient Babylonian hero-giant, carrying in one hand the "boomerang," and holding tightly with his left arm a struggling lion (Layard, Nineveh and Babylon, 137) was represented, just as at his father Sargon\'s palace at Khorsabad. The upper part of these imposing figures had been destroyed, but they were so massive, that the distinguished explorer attributed their overthrow not to the act of man, but to some convulsion of Nature.<P>2. The Palace of Assur-bani-apli:<P>In the north of the mound are the ruins of the palace of Assur-bani-apli or Assur-bani-pal, discovered by Hormuzd Rassam. His latest plan (Asshur and the Land of Nimrod, Cincinnati and New York,1897,plate facing p. 36) does not give the whole of the structure, much of the building having been destroyed; but the general arrangement of the rooms was upon the traditional lines. The slabs with which they were paneled showed bas-reliefs illustrating the Assyrian campaigns against Babylonia, certain Arab tribes, and Elam. As far as they are preserved, the sculptures are wonderfully good, and the whole decorative scheme of the paneled walls, of which, probably, the greater part is forever lost, may be characterized, notwithstanding their defects of perspective and their mannerisms, as nothing less than magnificent. The lion-hunts of the great king, despite the curious treatment of the animals\' manes (due to the sculptors\' ignorance of the right way to represent hair) are admirable. It would be difficult to improve upon the expressions of fear, rage and suffering on the part of the animals there delineated. The small sculptures showing Assur-bani-apli hunting the goat and the wild ass are not less noteworthy, and are executed with great delicacy.<P>IV. Sennacherib\'s Description of Nineveh.<P>1. The Walls:<P>In all probability the best description of the city is that given by Sennacherib on the cylinder recording his expedition to Tarsus in Cilicia. From ancient times, he says, the circuit of the city had measured 9,300 cubits, and he makes the rather surprising statement that his predecessors had not built either the inner or the outer wall, which, if true, shows how confident they were of their security from attack. He claims to have enlarged the city by 12,515 (cubits). The great defensive wall which he built was called by the Sumerian name of Bad-imgallabi-lu-susu, which he translates as "the wall whose glory overthrows the enemy." He made the brickwork 40 (cubits) thick, which would probably not greatly exceed the estimate of G. Smith, who reckoned it to have measured about 50 ft. The height of the wall he raised to 180 tipki, which, admitting the estimate of Diodorus, should amount to about 100 ft.<P>2. The Gates—Northwest:<P>In this enclosing wall were 15 gates, which he enumerates in full. Three of these were situated in the short northwest wall—the gate of Hadad; the gate of Uru or Hadad of Tarbisu (Sherif Khan), and the gate of the moon-god Nannar, Sennacherib\'s own deity. The plans show five openings in the wall on this side, any of which may have been the gate used when going to Tarbicu, but that adorned with winged bulls probably furnished the shortest route.<P>3. The Gates—South and East:<P>The gates looking toward the south and the east were the Assur-gate (leading to the old capital); Sennacherib\'s Halzi-gate; the gate of Samas of Gagal, the gate of the god Enlil of Kar-Ninlil, and the "covered gate," which seems to have had the reputation of letting forth the fever-demon. After this are mentioned the Sibaniba-gate, and the gate of Halah in Mesopotamia. This last must have been the extreme northeastern opening, now communicating with the road to Khorsabad, implying that Halah lay in that direction.<P>4. The Gates—West:<P>The gates on the west or river-side of the city were "the gate of Ea, director of my watersprings"; the quay-gate, "bringer of the tribute of my peoples"; the gate of the land of Bari, within which the presents of the Sumilites entered (brought down by the Tigris from Babylonia, in all probability); the gate of the tribute-palace or armory; and the gate of the god Sar-ur—"altogether 5 gates in the direction of the west." There are about 9 wide openings in the wall on this side, 2 being on each side of the Kouyunjik mound, and 2 on each side of that called Nebi-Yunus. As openings at these points would have endangered the city\'s safety, these 4 have probably to be eliminated, leaving 2 only north of Nebi-Yunus, 2 between that and Kouyunjik, and one north of Kouyunjik. Minor means of exit probably existed at all points where they were regarded as needful.<P>5. The Outer Wall: the Plantations:<P>To the outer wall of the city Sennacherib gave a Sumerian name meaning, "the wall which terrifies the enemy." At a depth of 54 gar, the underground water-level, its foundations were laid upon blocks of stone, the object of this great depth being to frustrate undermining. The wall was made "high like a mountain." Above and below the city he laid out plantations, wherein all the sweet-smelling herbs of Heth (Palestine and Phoenicia) grew, fruitful beyond those of their homeland. Among them were to be found every kind of mountain-vine, and the plants of all the nations around.<P>6. The Water-Supply, etc.:<P>In connection with this, in all probability, he arranged the water-supply, conducting a distant water-course to Nineveh by means of conduits. Being a successful venture, he seems to have watered therewith all the people\'s orchards, and in winter 1,000 corn fields above and below the city. The force of the increased current in the river Khosr was retarded by the creation of a swamp, and among the reeds which grew there were placed wild fowl, wild swine, and deer(?). Here he repeated his exotic plantations, including trees for wood, cotton (apparently) and seemingly the olive.<P>7. How the Bas-Reliefs Illustrate the King\'s Description:<P>Sennacherib\'s bas-reliefs show some of the phases of the work which his cylinder inscriptions describe. We see the winged bulls, which are of colossal dimensions, sometimes lying on their sledges (shaped like boats or Assyrian ships), and sometimes standing and supported by scaffolding. The sledges rest upon rollers, and are dragged by armies of captives urged to action by taskmasters with whips. Others force the sledges forward from behind by means of enormous levers whose upper ends are held in position by guy-ropes. Each side has to pull with equal force, for if the higher end of the great lever fell, the side which had pulled too hard suffered in killed and crushed, or at least in bruised, workmen of their number. In the background are the soldiers of the guard, and behind them extensive wooded hills. In other bas-reliefs it is apparently the pleasure grounds of the palace which are seen. In these the background is an avenue of trees, alternately tall and short, on the banks of a river, whereon are boats, and men riding astride inflated skins, which were much used in those days, as now. On another slab, the great king himself, in his hand-chariot drawn by eunuchs, superintends the work.<P>8. Nineveh the Later Capital:<P>How long Nineveh had been the capital of Assyria is unknown. The original capital was Assur, about 50 miles to the south, and probably this continued to be regarded as the religious and official capital of the country. Assur-nacir-Apli seems to have had a greater liking for Calah (Nimroud), and Sargon for Khorsabad, where he had founded a splendid palace. These latter, however, probably never had the importance of Nineveh, and attained their position merely on account of the reigning king building a palace and residing there. The period of Nineveh\'s supremacy seems to have been from the beginning of the reign of Sennacherib to the end of that of Assur-bani-apli, including, probably, the reigns of his successors likewise—a period of about 98 years (704-606 BC).<P>V. Last Days and Fall of Nineveh.<P>Nineveh, during the centuries of her existence, must have seen many stirring historical events; but the most noteworthy were probably Sennacherib\'s triumphal entries, including that following the capture of Lachish, the murder of that great conqueror by his sons (the recent theory that he was killed at Babylon needs confirmation); and the ceremonial triumphs of Assur-bani-apli—the great and noble Osnappar (<a onClick="return mV(\'Ezr\',4,10);">Ezr 4:10</a>). After the reign of Assur-bani-apli came his son Assur-etil-ilani, who was succeeded by Sin-sarra-iskun (Saracos), but the history of the country, and also of the city, is practically non-existent during these last two reigns. The Assyrian and Babylonian records are silent with regard to the fall of the city, but Alexander Polyhistor, Abydenus and Syncellus all speak of it. The best account, however, is that of Diodorus Siculus, who refers to a legend that the city could not be taken until the river became its enemy. Arbaces, the Scythian, besieged it, but could not make any impression on it for 2 years. In the 3rd year, however, the river (according to Commander Jones, not the Tigris, but the Khosr), being swollen by rains, and very rapid in its current, carried away a portion of the wall, and by this opening the besiegers gained an entrance. The king, recognizing in this the fulfillment of the oracle, gathered together his concubines and eunuchs, and, mounting a funeral pyre which he had caused to be constructed, perished in the flames. This catastrophe is supposed to be referred to in <a onClick="return mV(\'Nah\',1,8);">Na 1:8</a>: "With an over-running flood he (the Lord) will make a full end of her place (i.e. of Nineveh)," and <a onClick="return mV(\'Nah\',2,6);">Na 2:6</a>: "The gates of the rivers are opened, and the palace is dissolved." The destruction of the city by fire is probably referred to in <a onClick="return mV(\'Nah\',3,13,15);">3:13,15</A>. The picture of the scenes in her streets—the noise of the whip, the rattling wheels, the prancing horses, the bounding chariots (<a onClick="return mV(\'Nah\',3,2);">3:2</A>ff), followed by a vivid description of the carnage of the battlefield—is exceedingly striking, and true to their records and their sculptures.<P>LITERATURE.<P>The standard books on the discovery and exploration of Nineveh are Layard, Nineveh and Its Remains (two volumes, 1849); Nineveh and Babylon (1853); Monuments of Nineveh, 1st and 2nd series (plates) (1849 and 1853); and Hormuzd Hassam, Asshur and the Land of Nimrod (Cincinnati and New York, 1897).``136';
isbe[6417]='Nineveh, Library of`<b>I. THE DISCOVERY</b><P><b>II. THE LIBRARY</b><P><b>III. WRITING-MATERIALS</b><P><b>IV. CONTENTS</b><P class="in15">1. Philology<P class="in15">2. Astronomy and Astrology<P class="in15">3. Religious Texts<P class="in15">4. Law<P class="in15">5. Science<P class="in15">6. Literature<P class="in15">7. History and Chronology<P class="in15">8. Commerce<P class="in15">9. Letters<hr /><P>I. The Discovery.<P>In the spring of 1850, the workmen of Sir A.H. Layard at Nineveh made an important discovery. In the ruins of the palace of Assur-bani-pal they found a passage which opened into two small chambers leading one into the other. The doorway was guarded on either side by figures of Ea, the god of culture and the inventor of letters, in his robe of fishskin. The walls of the chambers had once been paneled with bas-reliefs, one of which represented a city standing on the shore of a sea that was covered with galleys. Up to the height of a foot or more the floor was piled with clay tablets that had fallen from the shelves on which they had been arranged in order, and the larger number of them was consequently broken. Similar tablets, but in lesser number, were found in the adjoining chambers. After Layard\'s departure, other tablets were discovered by Mr. Hormuzd Rassam, and then the excavations ceased for many years. The discovery of the Babylonian version of the account of the Deluge, however, by Mr. George Smith in 1873 led the proprietors of the Daily Telegraph to send him to Nineveh in the hope that the missing portions of the story might be found. He had not been excavating there long before he came across a fragment of another version of the story, and then once more the excavations came to an end. Since then expeditions have been sent by the British Museum which have resulted in the recovery of further remains of the ancient library of Nineveh.<P>II. The Library.<P>The tablets formed a library in the true sense of the word. Libraries had existed in the cities of Babylonia from a remote date, and the Assyrian kings, whose civilization was derived from Babylonia, imitated the example of Babylonia in this as in other respects. The only true booklover among them, however, was Assur-bani-pal. He was one of the most munificent royal patrons of learning the world has ever seen, and it was to him that the great library of Nineveh owed its existence. New editions were made of older works, and the public and private libraries of Babylonia were ransacked in search of literary treasures.<P>III. Writing-Materials.<P>Fortunately for us the ordinary writing-material of the Babylonians and Assyrians was clay. It was more easily procurable than papyrus or parchment, and was specially adapted for the reception of the cuneiform characters. Hence, while the greater part of the old Egyptian literature, which was upon papyrus, has perished that of Babylonia and Assyria has been preserved. In Babylonia the tablets after being inscribed were often merely dried in the sun; in the damper climate of Assyria they were baked in a kiln. As a large amount of text had frequently to be compressed into a small space, the writing is sometimes so minute as to need the assistance of a magnifying glass before it can be read. It is not surprising, therefore, that in the library-chambers of Nineveh Layard found a magnifying lens of crystal, which had been turned on the lathe.<P>IV. Contents.<P>1. Philology:<P>The subject-matter of the tablets included all the known branches of knowledge. Foremost among them are the philological works. The inventors of the cuneiform system of writing had spoken an agglutinative language, called Sumerian, similar to that of the Turks or Finns today; and a considerable part of the early literature had been written in this language, which to the later Semitic Babylonians and Assyrians was what Latin was to the European nations in the Middle Ages. The student was therefore provided with grammars and dictionaries of the two languages, as well as with reading-books and interlinear translates into Assyrian of the chief Sumerian texts. Besides this, long lists of the cuneiform characters were drawn up with their phonetic and ideographic values, together with lists of Assyrian synonyms, in which, for example, all the equivalents are given of the word "to go." The Assyrian lexicographers at times attempted etymologies which are as wide of the mark as similar etymologies given by English lexicographers of a past generation. Sabattu, "Sabbath," for instance, is derived from the two Sumerian words sa "heart" and bat, "to end," and so is explained to mean "day of rest for the heart." It is obvious that all this implies an advanced literary culture. People do not begin to compile grammars and dictionaries or to speculate on the origin of words until books and libraries abound and education is widespread.<P>2. Astronomy and Astrology:<P>Astronomy occupied a prominent place in Assyrian literature, but it was largely mingled with astrology. The Babylonians were the founders of scientific astronomy; they were the first to calculate the dates of lunar and solar eclipses, and to give names to the signs of the Zodiac. Among the contents of the library of Nineveh are reports from the Royal Observatory, relating to the observation of eclipses and the like.<P>3. Religious Texts:<P>A knowledge of astronomy was needed for the regulation of the calendar, and the calendar was the special care of the priests, as the festivals of the gods and the payment of tithes were dependent upon it. Most of the religious texts went back to the Sumerian period and were accordingly provided with Assyrian translations. Some of them were hymns to the gods, others were the rituals used in different temples. There was, moreover, a collection of psalms, as well as numerous mythological texts.<P>4. Law:<P>The legal literature was considerable. The earliest law books were in Sumerian, but the great code compiled by Hammurabi, the contemporary of Abraham, was in Semitic Babylonian (see <a href="./study/isbe/search.html?string=HAMMURABI">HAMMURABI</a>). Like English law, Assyro-Babylonian law was case-made, and records of the cases decided from time to time by the judges are numerous.<P>5. Science:<P>Among scientific works we may class the long lists of animals, birds, fishes, plants and stones, together with geographical treatises, and the pseudo-science of omens. Starting from the belief that where two events followed one another, the first was the cause of the second, an elaborate pseudo-science of augury had been built up, and an enormous literature arose on the interpretation of dreams, the observation of the liver of animals, etc. Unfortunately Assur-bani-pal had a special predilection for the subject, and the consequence is that his library was filled with works which the Assyriologist would gladly exchange for documents of a more valuable character. Among the scientific works we may also include those on medicine, as well as numerous mathematical tables.<P>6. Literature:<P>Literature was largely represented, mainly in the form of poems on mythological, religious or historical subjects. Among these the most famous is the epic of the hero Gilgames in twelve books, the Babylonian account of the Deluge being introduced as an episode in the eleventh book. Another epic was the story of the great battle between the god Merodach and Tiamat, the dragon of chaos and evil, which includes the story of the creation.<P>7. History and Chronology:<P>Historical records are very numerous, the Assyrians being distinguished among the nations of antiquity by their historical sense. In Assyria the royal palace took the place of the Bah or Egyptian temple; and where the Babylonian or the Egyptian would have left behind him a religious record, the Assyrian adorned his walls with accounts of campaigns and the victories of their royal builders. The dates which are attached to each portion of the narrative, and the care with which the names of petty princes and states are transcribed, give a high idea of the historical precision at which the Assyrians aimed. The Assyrian monuments are alone sufficient to show that the historical sense was by no means unknown to the ancient peoples of the East, and when we remember how closely related the Assyrians were to the Hebrews in both race and language, the fact becomes important to the Biblical student. Besides historical texts the library contained also chronological tables and long lists of kings and dynasties with the number of years they reigned. In Babylonia time was marked by officially naming each year after some event that had occurred in the course of it; the more historically-minded Assyrian named the year after a particular official, called limmu, who was appointed on each New Year\'s Day. In Babylonia the chronological system went back to a very remote date. The Babylonians were a commercial people, and for commercial purposes it was necessary to have an exact register of the time.<P>8. Commerce:<P>The library contained trading documents of various sorts, more especially contracts, deeds of sale of property and the like. Now and then we meet with the plan of a building. There were also fiscal documents relating to the taxes paid by the cities and provinces of the empire to the imperial treasury.<P>9. Letters:<P>One department of the library consisted of letters, some of them private, others addressed to the king or to the high officials. Nearly a thousand of these have already been published by Professor Harper.<P>The clay books, it need hardly be added, were all carefully numbered and catalogued, the Assyrian system of docketing and arranging the tablets being at once ingenious and simple. The librarians, consequently, had no difficulty in finding any tablet or series of tablets that might be asked for. We may gather from the inscription attached to the larger works copied from Babylonian originals as well as to other collections of tablets that the library was open to all "readers."``157';
isbe[6418]='Ninevites`nin\'-e-vits (Nineu(e)itai): Only in <a onClick="return mV(\'Luk\',11,30);">Lu 11:30</a>. The parallel passage (<a onClick="return mV(\'Mat\',12,41);">Mt 12:41</a>), with <a onClick="return mV(\'Luk\',11,32);">Lu 11:32</a>, has the fuller form, "men of Nineveh," which gives the meaning.``1';
isbe[6419]='Niphis`ni\'-fis (Neipheis, Codex Alexandrinus Phineis; the King James Version Nephis): Given in 1Esdras 5:21 margin as equals "Magbish" of <a onClick="return mV(\'Ezr\',2,30);">Ezr 2:30</a>, whose sons are the same in number (156) as those of Niphis, but it would seem rather to be the equivalent of Nebo in 2:29.``1';
isbe[6420]='Nisan`ni\'-san (nican): The first month of the Jewish year in which occurred the Passover and which corresponds to April. The month is the same as Abib, which occurs in the Pentateuch. Nisan occurs in <a onClick="return mV(\'Neh\',2,1);">Ne 2:1</a> and <a onClick="return mV(\'Est\',3,7);">Es 3:7</a>. It denotes "the month of flowers."`<a href="./study/isbe/search.html?string=CALENDAR">CALENDAR</a>`1';
isbe[6421]='Nisroch`nis\'-rok, niz\'-rok (nicrokh): The Assyrian god in whose temple Sennacherib was worshipping when put to death by his sons (<a onClick="return mV(\'2Ki\',19,37);">2Ki 19:37</a>; <a onClick="return mV(\'Isa\',37,38);">Isa 37:38</a>). The name is not found elsewhere. Some identify him with Asshur, the national deity.`<a href="./study/isbe/search.html?string=BABYLONIA+AND+ASSYRIA,+RELIGION+OF">BABYLONIA AND ASSYRIA, RELIGION OF</a>`1';
isbe[6422]='Nitre`ni\'-ter (nether; nitron): Nitre as used in the King James Version does not correspond to the present use of that term. Nitre or niter is now applied to sodium or potassium nitrate. The writer has in his collection a specimen of sodium carbonate, called in Arabic natrun, which was taken from the extensive deposits in Lower Egypt where it is found as a deposit underneath a layer of common salt. Similar deposits are found in Syria and Asia Minor. This is probably the "nitre" of the Bible. the American Standard Revised Version has rendered niter "lye" in <a onClick="return mV(\'Jer\',2,22);">Jer 2:22</a>, and "soda" in <a onClick="return mV(\'Pro\',25,20);">Pr 25:20</a>. Soda or lye has been used as a cleansing agent from earliest times. It effervesces energetically, when treated with an acid; hence, the comparison in <a onClick="return mV(\'Pro\',25,20);">Pr 25:20</a> of the heavy-hearted man roiled by the sound of singing to the sizzling of soda on which vinegar has been poured.`<a href="./study/isbe/search.html?string=VINEGAR">VINEGAR</a>`133';
isbe[6423]='No`no.`<a href="./study/isbe/search.html?string=NO+AMON">NO-AMON</a>`1';
isbe[6424]='No-Amon`no-a\'-mon (no\' \'amon, Egyptian nut, "a city," with the feminine ending t, and Amon, proper name of a god, City Amon, i.e. the "City," par excellence, of the god Amon; translated in the King James Version "populous No," following the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) in a misunderstanding of the word \'amon; the Revised Version (British and American) "No-amon"): Occurs in this form only in <a onClick="return mV(\'Nah\',3,8);">Na 3:8</a>, but \'amon minno\', "Amon of No," occurs in <a onClick="return mV(\'Jer\',46,25);">Jer 46:25</a>. Compare also <a onClick="return mV(\'Eze\',30,\'14-16\');">Eze 30:14-16</a>, where no\', is undoubtedly the same city.<P>The description of No-amon in <a onClick="return mV(\'Nah\',3,8);">Na 3:8</a> seems to be that of a delta city, but yam, "sea" in that passage is used poetically for the Nile, as in <a onClick="return mV(\'Job\',41,31);">Job 41:31</a> and in <a onClick="return mV(\'Isa\',18,2);">Isa 18:2</a>. With this difficulty removed, the Egyptian etymology of the name leaves no doubt as to the correct identification of the place. The "City Amon" in the days of Nahum, Jeremiah and Ezekiel was Thebes (compare the article "Thebes" in any general encyclopedia).``93';
isbe[6425]='Noadiah`no-a-di\'-a (no\'adhyah, "tryst of Yah"; Noadei):<P>(1) Son of Binnui, one of the Levites to whom Ezra entrusted the gold and silver and sacred vessels which he brought up from Babylon (<a onClick="return mV(\'Ezr\',8,33);">Ezr 8:33</a>); also called <a href="./study/isbe/search.html?string=MOETH">MOETH</a> (which see), son of Sabannus (1Esdras 8:63).<P>(2) A prophetess associated with Tobiah and Sanballat in opposition to Nehemiah (<a onClick="return mV(\'Neh\',6,14);">Ne 6:14</a>).``1';
isbe[6426]='Noah (1)`no\'-a (noach, "rest"; Septuagint Noe; Josephus, Nochos): The 10th in descent from Adam in the line of Seth (<a onClick="return mV(\'Gen\',5,28,29);">Ge 5:28,29</a>). Lamech here seems to derive the word from the nacham, "to comfort," but this is probably a mere play upon the name by Noah\'s father. The times in which Noah was born were degenerate, and this finds pathetic expression in Lamech\'s saying at the birth of Noah, "This same shall comfort us in our work and in the toil of our hands, which cometh because of the ground which Yahweh hath cursed." Concerning theory that Noah is the name of a dynasty, like Pharaoh or Caesar, rather than of a single individual, see <a href="./study/isbe/search.html?string=ANTEDILUVIANS">ANTEDILUVIANS</a>. In his 600th year the degenerate races of mankind were cut off by the Deluge. But 120 years previously (<a onClick="return mV(\'Gen\',6,3);">Ge 6:3</a>) he had been warned of the catastrophe, and according to <a onClick="return mV(\'1Pe\',3,20);">1Pe 3:20</a> had been preparing for the event by building the ark (see <a href="./study/isbe/search.html?string=ARK">ARK</a>; <a href="./study/isbe/search.html?string=DELUGE+OF+NOAH">DELUGE OF NOAH</a>). In the cuneiform inscriptions Noah corresponds to "Hasisadra" (Xisuthrus). After the flood Noah celebrated his deliverance by building an altar and offering sacrifices to Yahweh (<a onClick="return mV(\'Gen\',8,20);">Ge 8:20</a>), and was sent forth with God\'s blessing to be "fruitful, and multiply, and replenish the earth" (<a onClick="return mV(\'Gen\',9,1);">Ge 9:1</a>), as Adam had been sent forth at the beginning (<a onClick="return mV(\'Gen\',1,28);">Ge 1:28</a>). In token of the certainty of God\'s covenant not to destroy the race again by flood, a rainbow spanned the sky whose reappearance was ever after to be a token of peace. But Noah was not above temptation. In the prosperity which followed, he became drunken from the fruit of the vineyard he had planted. His son Ham irreverently exposed the nakedness of his father, while Shem and Japheth covered it from view (<a onClick="return mV(\'Gen\',9,22,23);">Ge 9:22,23</a>). The curse upon Canaan the son of Ham was literally fulfilled in subsequent history when Israel took possession of Palestine, when Tyre fell before the arms of Alexander, and Carthage surrendered to Rome.``198';
isbe[6427]='Noah (2)`(no\'ah, "movement"): One of the daughters of Zelophehad (<a onClick="return mV(\'Num\',26,33);">Nu 26:33</a>; <a onClick="return mV(\'Num\',27,1);">27:1</a>; <a onClick="return mV(\'Num\',36,11);">36:11</a>; <a onClick="return mV(\'Jos\',17,3);">Jos 17:3</a>).``1';
isbe[6428]='Noah, Book (Apocalypse) of``<a href="./study/isbe/search.html?string=APOCALYPTIC+LITERATURE">APOCALYPTIC LITERATURE</a>`1';
