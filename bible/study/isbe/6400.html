lick="return mV(\'2Sa\',8,14);">2Sa 8:14</a>; <a onClick="return mV(\'1Ki\',11,1);">1Ki 11:1</a>; <a onClick="return mV(\'1Ch\',18,12,13);">1Ch 18:12,13</a>).<P>Examples such as these show that many, if not most, of the like objections against the Mosaic authorship of this book are capable of at least possible solution; and that Kuenen\'s caution should not be forgotten: "He who relies upon the impression made by the whole, without interrogation of the parts one by one, repudiates the first principles of all scientific research, and pays homage to superficiality" (Religion of Israel, I, 11).<P>2. For the Mosaic Authorship:<P>(1) Certain Passages Have the Appearance of Having Been Written by Moses.<P>These are:<P>(a) those which bear evidence of having been intended for a people not settled in cities but dwelling in tents and camps, as e.g. <a onClick="return mV(\'Num\',1,\'1-\');">Numbers 1-4</a>, describing the arrangements for the census and the formation of the camp; <a onClick="return mV(\'Num\',6,24,25,26);">6:24-26</a>, the high-priestly benediction; <a onClick="return mV(\'Num\',10,35,36);">10:35,36</a>, the orders for the marching and the halting of the host; <a onClick="return mV(\'Num\',10,\'1-9\');">10:1-9</a>, the directions about the silver trumpets; <a onClick="return mV(\'Num\',19,\'1-\');">Numbers 19</a>, the legislation which obviously presupposes the wilderness as the place for its observance (<a onClick="return mV(\'Num\',19,3,7,9,14);">19:3,7,9,14</A>). If criticism allows that these and other passages have descended from the Mosaic age, why should it be necessary to seek another author for them than Moses? And if Moses could have composed these passages, a presumption at least is created that the whole book has proceeded from his pen.<P>(b) The patriotic songs taken from the Book of the Wars of the Lord (<a onClick="return mV(\'Num\',21,\'1-\');">Numbers 21</a>), which some critics (Cornill, Kautzsch and others) hold cannot be later than 750 BC, are by equally competent scholars (Bleek, De Wette, E. Meyer, Konig and others) recognized as parts of Israel\'s inheritance from the Mosaic age, whenever they were incorporated in Numbers.<P>(c) The list of camping stations (<a onClick="return mV(\'Num\',33,\'1-\');">Numbers 33</a>) is expressly assigned to him. Whether "by the commandment of the Lord" should be connected with the "journeys" (Konig) or the "writing" makes no difference as to the authorship of this chapter, at least in the sense that it is based on a Mosaic document (Strack). It is true that even if this chapter as it stands was prepared by Moses, that does not amount to conclusive evidence of the Mosaic authorship of the whole book. Yet it creates a presumption in its favor (Drechsler, Keil, Zahn). For why should Moses have been specially enjoined to write so comparatively uninteresting and unprofitable a document as a list of names, many of which are now incapable of identification, if that was all? But if Moses was already writing up a journal or history of the wanderings, whether by his own hand or by means of amanuenses, and whether by express command or without it (not an unreasonable supposition), there was no particular need to record that this was so. If, however, Moses was not thinking of preserving an itinerary, and God for reasons of His own desired that he should do so, then there was need for a special commandment to be given; and need that it should be recorded to explain why Moses incorporated in his book a list of names that in most people\'s judgment might have been omitted without imperiling the value of the book. Looked at in this way, the order to prepare this itinerary rather strengthens the idea of the Mosaic authorship of the whole book.<P>(2) Acquaintance on the Part of the Author with Egyptian Manners and Customs.<P>This points in the direction of Moses.<P>(a) The trial by jealousy (<a onClick="return mV(\'Num\',5,\'11-31\');">Nu 5:11-31</a>) may be compared with the tale of Setnau, belonging probably to the 3rd century BC, but relating to the times of Rameses II, in which Ptahnefer-ka, having found the book which the god Thoth wrote with his own hand, copied it on a piece of papyrus, dissolved the copy in water and drank the solution, with the result that he knew all the book contained (RP, IV, 138). (b) The consecration of the Levites (<a onClick="return mV(\'Num\',8,7);">Nu 8:7</a>) resembled the ablutions of the Egyptian priests who shaved their heads and bodies every 3rd day, bathed twice during the day and twice during the night, and performed a grand ceremony of purification, preparatory to their seasons of fasting, which sometimes lasted from 7 to 40 days and even more (WAE, I, 181).<P>(c) Uncleanness from contact with the dead (<a onClick="return mV(\'Num\',19,11);">Nu 19:11</a>) was not unknown to the Egyptians, who required their priests to avoid graves, funerals and funeral feasts (Porphyry, De Abst. ii.50, quoted in Speaker\'s Comm.).<P>(d) The fish, cucumbers, melons, leeks, onions and garlic referred to in <a onClick="return mV(\'Num\',11,5);">Nu 11:5</a> were articles of diet in Egypt (Herodotus ii.93):<P>(e) The antiquarian statement about Hebron (<a onClick="return mV(\'Num\',13,22);">13:22</A>) fits in well with a writer in Mosaic times. "A later writer could have had no authority for making the statement and no possible reason for inventing it" (Pulpit Commentary on Numbers). On a candid review of all the arguments pro and con, it is not too much to say that the preponderance of evidence lies on the side of the substantial Mosaicity of the Book of Numbers.<P>LITERATURE.<P>Comms. on Numbers by Bertheau (ET), Knobel, Keil (ET), Dillmann, Strack, Lange (English translation); in Speaker\'s Comm., Pulpit Comm., ICC (Gray); Biblical Intros of De Wette, Hengstenberg, Havernick, Bleek, Konig, Strack, Cornill, Driver; in encs, etc., RE, HDB, EB, Sch-Herz; critical comms.: Reuss, Die Geschichte der heiligen Schriften AT; Kuenen, The Religion of Israel (English translation); Wellhausen, Geschichte Israels and Prolegomena (English translation); Klostermann, Der Pentateuch; Eerdmans, Alttest. Studien; Addis, Documents of Hexateuch; Olford Hexateuch; EPC.``192';
isbe[6460]='Numenius`nu-me\'-ni-us (Noumenios): The son of Antiochus, and Antipater were the two ambassadors whom Jonathan sent to the Romans, "to the Spartans, and to other places," after his victory in the plain of Hazor (Galilee) over the princes of Demetrius (1Macc 12:1ff) about 144 BC. Their mission was to confirm and renew the friendship and treaty which had existed from the days of Judas (1Macc 8:17ff). They were well received and successful, both at Rome (1Macc 12:3f) and at Sparta (1Macc 12:19ff; 14:22f). After the death of Jonathan, the victories of Simon and the establishment of peace, Simon sent Numenius on a second embassy to Rome (1Macc 14:24), again to confirm the treaty and present a golden shield weighing 1,000 minae—apparently just before the popular decree by which Simon was created high priest, leader and captain "for ever" (1Macc 14:27ff), September, 141 BC. The embassy returned in 139 BC, bearing letters from the senate to the kings of Egypt, Syria and "all the countries," confirming the integrity of Jewish territory, and forbidding these kings to disturb the Jews, and requiring them also to surrender any deserters (1Macc 14:15ff). See also <a href="./study/isbe/search.html?string=LUCIUS">LUCIUS</a>; Schurer, Gesch. des judischen Volkes (3rd and 4th editions), I, 236, 250 f.``5';
isbe[6461]='Nun (1)`noon ("n"): The 14th letter of the Hebrew alphabet; transliterated in this Encyclopedia as "n". It came also to be used for the number 50.`<a href="./study/isbe/search.html?string=ALPHABET">ALPHABET</a>`1';
isbe[6462]='Nun (2)`nun (nun "fish," derivative meaning "fecundity"): Father of Joshua (referred to thus 29 times) (<a onClick="return mV(\'Exd\',33,11);">Ex 33:11</a>; <a onClick="return mV(\'Num\',11,28);">Nu 11:28</a>, etc.; <a onClick="return mV(\'1Ch\',7,27);">1Ch 7:27</a>, margin "Non"; Sirach 46:1, margin "Nave").``1';
isbe[6463]='Nurse; Nursing`nurs, nurs\'-ing: "Nurse" in the King James Version represents two different Hebrew words: In 8 passages (<a onClick="return mV(\'Gen\',24,59);">Ge 24:59</a>; <a onClick="return mV(\'Gen\',35,8);">35:8</a>; <a onClick="return mV(\'Exd\',2,7,9);">Ex 2:7,9</a>; <a onClick="return mV(\'2Ki\',11,2);">2Ki 11:2</a>; <a onClick="return mV(\'2Ch\',22,11);">2Ch 22:11</a>; <a onClick="return mV(\'Isa\',49,23);">Isa 49:23</a>) the word—noun or verb—renders some form of the verb yanaq, "to suck." The feminine causative part. of this verb is commonly used to denote nurse or foster-mother. According to <a onClick="return mV(\'Exd\',2,7);">Ex 2:7</a> Moses\' mother—"a nurse of the Hebrew women"—became, at Pharaoh\'s daughter\'s request, the foster-mother of the foundling. Joash, the son of Ahaziah, was in charge of a nurse until he was 7 years old (<a onClick="return mV(\'2Ki\',11,2);">2Ki 11:2</a>; <a onClick="return mV(\'2Ch\',22,11);">2Ch 22:11</a>). But it is obvious that the term was used in a more general way, e.g. of a lady\'s maid or tire-woman. Rebekah was accompanied by her nurse when she left home to be married (<a onClick="return mV(\'Gen\',24,59);">Ge 24:59</a>; <a onClick="return mV(\'Gen\',35,8);">35:8</a>). In 5 passages (<a onClick="return mV(\'Num\',11,12);">Nu 11:12</a>; <a onClick="return mV(\'Rth\',4,16);">Ru 4:16</a>; <a onClick="return mV(\'2Sa\',4,4);">2Sa 4:4</a>; <a onClick="return mV(\'Isa\',49,23);">Isa 49:23</a>; <a onClick="return mV(\'Isa\',60,4);">60:4</a> the King James Version) "nurse" represents the Hebrew word, \'aman, "to support," "be faithful," "nourish." The participle of this verb denoted a person who had charge of young children—a guardian or governess. Naomi took charge of Ruth\'s child "and became nurse unto it" (<a onClick="return mV(\'Rth\',4,16);">Ru 4:16</a>). In <a onClick="return mV(\'Num\',11,12);">Nu 11:12</a> Moses asks whether he has to take charge of the Israelites "as a nursing-father carrieth the sucking child." The same word is found in <a onClick="return mV(\'2Ki\',10,15);">2Ki 10:15</a> (the King James Version "them that brought up," i.e. "guardians of the sons of Ahab) and in <a onClick="return mV(\'Est\',2,7);">Es 2:7</a> (the King James Version "and he brought up," i.e. he (Mordecai) adopted, his niece). Deutero-Isa uses both terms together (<a onClick="return mV(\'Isa\',49,23);">Isa 49:23</a>) to describe the exalted position of Israel in the future when foreign kings and queens will offer their services and wait upon the chosen people.<P>In the solitary passage in the New Testament where "nurse" occurs, it renders the Greek word trophos. In this case the word does not mean a hired nurse, but a mother who nurses her own children (<a onClick="return mV(\'1Th\',2,7);">1Th 2:7</a>).``103';
isbe[6464]='Nurture`nur\'-tur: The word occurs in the King James Version in <a onClick="return mV(\'Eph\',6,4);">Eph 6:4</a> as the translation of paideia, but the Revised Version (British and American) changes to "chastening," and uses "nurture" (verb) for the King James Version "bring up" (ektrepho) in the first part of the verse. Paideia has the idea of training and correction; in the Revised Version (British and American) 2Esdras 8:12 for Latin erudio; and compare the King James Version The <span class="noTag">Wisdom of Solomon 3:11</span>; Sirach 18:13 (paideuo), etc.``1';
isbe[6465]='Nuts`nuts:<P>(1) (\'eghoz; karua; Arabic jauz, "the walnut" (<a onClick="return mV(\'Sgs\',6,11);">So 6:11</a>)): This is certainly the walnut tree, Juglans regia, a native of Persia and the Himalayas which flourishes under favorable conditions in all parts of Palestine; particularly in the mountains. In such situations it attains the height of from 60 to 90 ft. A grove of such trees affords the most delightful shade.<P>(2) (botnim; terebinthoi (<a onClick="return mV(\'Gen\',43,11);">Ge 43:11</a>, margin "pistachio nuts")): The Hebrew is perhaps allied to the Arabic butm, the "terebinth," which is closely allied to the Pistacia vera, Natural Order Anacardiaceae, which produces pistachio nuts. These nuts, known in Arabic as fistuq, are prime favorites with the people of Palestine. They are oblong, 3/4 inches long, with green, oily cotyledons. They are eaten raw and are also made into various sweets and confectionery. They are a product of Palestine, very likely to be sent as a present to Egypt (<a onClick="return mV(\'Gen\',43,11);">Ge 43:11</a>).``117';
isbe[6466]='Nymphas`nim\'-fas (Numphas; Lachmann, Tregelles (margin), Westcott and Hort, The New Testament in Greek read Numpha, the name of a woman (<a onClick="return mV(\'Col\',4,15);">Col 4:15</a>)):<P>1. A Christian in Laodicea:<P>A Christian resident in Laodicea, to whom Paul sends salutations in the epistle which he wrote from Rome to the church in Colosse, the latter city being only a very few miles distant from Laodicea. Indeed, so near were they, that Paul directs that the Epistle to the Colossians be read also in Laodicea. Nymphas—or if Nympha be read, then it is a Christian lady who is meant—was a person of outstanding worth and importance in the church of Laodicea, for he had granted the use of his dwelling-house for the ordinary weekly meetings of the church. The apostle\'s salutation is a 3-fold one—to the brethren that are in Laodicea, that is to the whole of the Christian community in that city, and to Nymphas, and to the church in his house.<P>2. The Church in His House:<P>This fact, that the church met there, also shows that Nymphas was a person of some means, for a very small house could not have accommodated the Christian men and women who gathered together on the first day of every week for the purposes of Christian worship. The church in Laodicea—judging not only from the Epistle to the Ephesians, which is really Paul\'s Epistle to the Laodiceans, and which indicates that the church in Laodicea had a numerous membership, but also from what is said of it in <a onClick="return mV(\'Rev\',3,17);">Re 3:17</a> the King James Version—must have been large and influential: "Thou sayest, I am rich, and increased with goods, and have need of nothing." The house of Nymphas, therefore, must have possessed a large room or saloon sufficiently commodious to allow the meeting of a numerous company. Nymphas would he a person both of Christian character and of generous feeling, and of some amount of wealth. Nothing more is known regarding him, as this is the only passage in which he is named.``155';
isbe[6467]='Oabdius`o-ab\'-di-us (Codex Alexandrinus Oabdios; Codex Vaticanus eios, Fritzsche, Ioabdios, omitted in the King James Version): One of the sons of Ela who put away their "strange wives" (1Esdras 9:27) = "Abdi" of <a onClick="return mV(\'Ezr\',10,26);">Ezr 10:26</a>.``1';
isbe[6468]='Oak`ok: Several Hebrew words are so translated, but there has always been great doubt as to which words should be translated "oak" and which "terebinth." This uncertainty appears in the Septuagint and all through English Versions of the Bible; in recent revisions "terebinth" has been increasingly added in the margin. All the Hebrew words are closely allied and may originally have had simply the meaning of "tree" but it is clear that, when the Old Testament was written, they indicated some special kind of tree.<P>1. Hebrew Words and References:<P>The words and references are as follows:<P>(1) \'elah (in the Septuagint usually terebinthos. in Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) terebinthus, or, more commonly, quercus) (<a onClick="return mV(\'Gen\',35,4);">Ge 35:4</a>; <a onClick="return mV(\'Jdg\',6,11,19);">Jud 6:11,19</a>; <a onClick="return mV(\'2Sa\',18,9,10,14);">2Sa 18:9,10,14</a>; <a onClick="return mV(\'1Ki\',13,14);">1Ki 13:14</a>; <a onClick="return mV(\'1Ch\',10,12);">1Ch 10:12</a>; <a onClick="return mV(\'Isa\',1,30);">Isa 1:30</a>; <a onClick="return mV(\'Eze\',6,13);">Eze 6:13</a>—in all these margin "terebinth "). In <a onClick="return mV(\'Isa\',6,13);">Isa 6:13</a> (the King James Version "teil tree") and <a onClick="return mV(\'Hsa\',4,13);">Ho 4:13</a> (the King James Version "elms") the translation is "terebinths" because of the juxtaposition of \'allon, translated "oaks." "Vale of Elah" (margin "the Terebinth") is found in <a onClick="return mV(\'1Sa\',17,2,19);">1Sa 17:2,19</a>; <a onClick="return mV(\'1Sa\',21,9);">21:9</a>. The expression in <a onClick="return mV(\'Isa\',1,30);">Isa 1:30</a>, "whose leaf fadeth," is more appropriate to the terebinth than the oak (see below).<P>(2) \'allah (terebinthos, quercus (Vulgate)), apparently a slight variant for \'elah; only in <a onClick="return mV(\'Jos\',24,26);">Jos 24:26</a>; <a onClick="return mV(\'Gen\',35,4);">Ge 35:4</a> (\'elah) and in <a onClick="return mV(\'Jdg\',9,6);">Jud 9:6</a> (\'elon).<P>(3) \'elim or \'eylim, perhaps plural of \'elah occurs in <a onClick="return mV(\'Isa\',1,29);">Isa 1:29</a> (margin "terebinths"); <a onClick="return mV(\'Isa\',57,5);">Isa 57:5</a>, margin "with idols," the King James Version "idols," margin "oaks"; <a onClick="return mV(\'Isa\',61,3);">Isa 61:3</a>, "trees"; <a onClick="return mV(\'Eze\',31,14);">Eze 31:14</a> (text very doubtful), "height," the King James Version margin "upon themselves"; \'el, in El-paran Septuagint terebinthos) (<a onClick="return mV(\'Gen\',14,6);">Ge 14:6</a>), probably means the "tree" or "terebinth" of Paran. Celsius (Hierob. 1,34ff) argues at length that the above words apply well to the <a href="./study/isbe/search.html?string=TEREBINTH">TEREBINTH</a> (which see) in all the passages in which they occur.<P>(4) \'elon (usually drus, "oak"), in <a onClick="return mV(\'Gen\',12,6);">Ge 12:6</a>; <a onClick="return mV(\'Gen\',13,18);">13:18</a>; <a onClick="return mV(\'Gen\',14,13);">14:13</a>; <a onClick="return mV(\'Gen\',18,1);">18:1</a>; <a onClick="return mV(\'Deu\',11,30);">De 11:30</a>; <a onClick="return mV(\'Jos\',19,33);">Jos 19:33</a>; <a onClick="return mV(\'Jdg\',4,11);">Jud 4:11</a>; <a onClick="return mV(\'Jdg\',9,6,37);">9:6,37</a>; <a onClick="return mV(\'1Sa\',10,3);">1Sa 10:3</a> (the King James Version "plain"); in all these references the margin has "terebinth" or "terebinths." In <a onClick="return mV(\'Gen\',12,6);">Ge 12:6</a>; <a onClick="return mV(\'Deu\',11,30);">De 11:30</a> we have "oak" or "oaks" "of the teacher" (Moreh); "oak in Zaanannim" in <a onClick="return mV(\'Jdg\',4,11);">Jud 4:11</a>; <a onClick="return mV(\'Jos\',19,33);">Jos 19:33</a>; the "oak of Meonenim," margin "the augurs\' oak (or, terebinth)" in <a onClick="return mV(\'Jdg\',9,37);">Jud 9:37</a>.<P>(5) \'allon (commonly drus, or balanos), in <a onClick="return mV(\'Gen\',35,8);">Ge 35:8</a> (compare <a onClick="return mV(\'Gen\',35,4);">35:4</A>); <a onClick="return mV(\'Hsa\',4,13);">Ho 4:13</a>; <a onClick="return mV(\'Isa\',6,13);">Isa 6:13</a>, is contrasted with \'elah, showing that \'allon and \'elah cannot be identical, so no marginal references occur; also in <a onClick="return mV(\'Isa\',44,14);">Isa 44:14</a>; <a onClick="return mV(\'Amo\',2,9);">Am 2:9</a>, but in all other passages, the margin "terebinth" or "terebinths" occurs. "Oaks of Bashan" occurs in <a onClick="return mV(\'Isa\',2,13);">Isa 2:13</a>; <a onClick="return mV(\'Eze\',27,6);">Eze 27:6</a>; <a onClick="return mV(\'Zec\',11,2);">Zec 11:2</a>.<P>If (1) (2) (3) refer especially to the terebinth, then (4) and (5) are probably correctly translated "oak." If we may judge at all by present conditions, "oaks" of Bashan is far more correct than "terebinths" of Bashan.<P>2. Varieties of Oak:<P>There are, according to Post (Flora of Palestine, 737-41), no less than 9 species of oak (Natural Order Cupuliferae) in Syria, and he adds to these 12 sub-varieties. Many of these have no interest except to the botanist. The following species are widespread and distinctive:<p>(1) The "Turkey oak," Quercus cerris, known in Arabic as Ballut, as its name implies, abounds all over European Turkey and Greece and is common in Palestine. Under favorable conditions it attains to great size, reaching as much as 60 ft. in height. It is distinguished by its large sessile acorns with hemispherical cups covered with long, narrow, almost bristly, scales, giving them a mossy aspect. The wood is hard and of fine grain. Galls are common upon its branches.<P>(2) Quercus lusitanica (or Ballota), also known in Arabic as Ballut, like the last is frequently found dwarfed to a bush, but, when protected, attains a height of 30 ft. or more. The leaves are denate or crenate and last late into the winter, but are shed before the new twigs are developed. The acorns are solitary or few in cluster, and the cupules are more or less smooth. Galls are common, and a variety of this species is often known as Q. infectoria, on account of its liability to infection with galls.<P>(3) The Valonica oak (Q. aceglops), known in Arabic as Mellut, has large oblong or ovate deciduous leaves, with deep serrations terminating in a bristle-like point, and very large acorns, globular, thick cupules covered with long reflexed scales. The cupules, known commercially as valonica, furnish one of the richest of tanning materials.<P>(4) The Evergreen oak is often classed under the general name "Ilex oak" or Holm (i.e. holly-like) oak. Several varieties are described as occurring in Palestine. Q. ilex usually has rather a shrublike growth, with abundant glossy, dark-green leaves, oval in shape and more or less prickly at the margins, though sometimes entire. The cupules of the acorns are woolly. It shows a marked predilection for the neighborhood of the sea. The Q. coccifera (with var. Q. pseudococcifera) is known in Arabic as Sindian. The leaves, like the last, usually are prickly. The acorns are solitary or twin, and the hemispherical cupules are more or less velvety. On the Q. coccifera are found the insects which make the well-known Kermes dye. These evergreen oaks are the common trees at sacred tombs, and the once magnificent, but now dying, "Abraham\'s oak" at Hebron is one of this species.<P>3. Oaks in Modern Palestine:<P>Oaks occur in all parts of Palestine, in spite of the steady ruthless destruction which has been going on for centuries. All over Carmel, Tabor, around Banias and in the hills to the west of Nazareth, to mention well-known localities, there are forests of oak; great tracts of country, especially in Galilee and east of the Jordan, are covered by a stunted brushwood which, were it not for the wood-cutter, would grow into noble trees. Solitary oaks of magnificent proportions occur in many parts of the land, especially upon hilltops; such trees are saved from destruction because of their "sacred" character. To bury beneath such a tree has ever been a favorite custom (compare <a onClick="return mV(\'Gen\',35,8);">Ge 35:8</a>; <a onClick="return mV(\'1Ch\',10,12);">1Ch 10:12</a>). Large trees like these, seen often from great distances, are frequently landmarks (<a onClick="return mV(\'Jos\',19,33);">Jos 19:33</a>) or places of meeting (compare "Oak of Tabor," <a onClick="return mV(\'1Sa\',10,3);">1Sa 10:3</a>). The custom of heathen worship beneath oaks or terebinths (<a onClick="return mV(\'Hsa\',4,13);">Ho 4:13</a>; <a onClick="return mV(\'Eze\',6,13);">Eze 6:13</a>, etc.) finds its modern counterpart in the cult of the Wely in Palestine. The oak is sometimes connected with some historical event, as e.g. Abraham\'s oak of Mamre now shown at Hebron, and "the oak of weeping," Allon bacuth, of <a onClick="return mV(\'Gen\',35,8);">Ge 35:8</a>.``117';
isbe[6469]='Oak of Tabor`(\'elon tabhor): Thus the Revised Version (British and American) in <a onClick="return mV(\'1Sa\',10,3);">1Sa 10:3</a> for the King James Version "plain of Tabor" (the Revised Version margin "terebinth"). Tabor was famous for its groves of oak, but what "oak" is meant here is not known. Ewald thinks that "Tabor" is a different pronunciation for "Deborah," and connects with <a onClick="return mV(\'Gen\',35,8);">Ge 35:8</a>; but this is not likely.`<a href="./study/isbe/search.html?string=OAK">OAK</a>`1';
isbe[6470]='Oar`or.`<a href="./study/isbe/search.html?string=SHIPS+AND+BOATS">SHIPS AND BOATS</a>`1';
isbe[6471]='Oath`oth (shebhu\'ah, probably from shebha\', "seven," the sacred number, which occurs frequently in the ritual of an oath; horkos; and the stronger word \'alah, by which a curse is actually invoked upon the oath-breaker Septuagint ara)): In <a onClick="return mV(\'Mat\',26,\'70-74\');">Mt 26:70-74</a> Peter first denies his Lord simply, then with an oath (shebhu\'ah), then invokes a curse (\'alah), thus passing through every stage of asseveration.<P>1. Law Regarding Oaths:<P>The oath is the invoking of a curse upon one\'s self if one has not spoken the truth (<a onClick="return mV(\'Mat\',26,74);">Mt 26:74</a>), or if one fails to keep a promise (<a onClick="return mV(\'1Sa\',19,6);">1Sa 19:6</a>; <a onClick="return mV(\'1Sa\',20,17);">20:17</a>; <a onClick="return mV(\'2Sa\',15,21);">2Sa 15:21</a>; <a onClick="return mV(\'2Sa\',19,23);">19:23</a>). It played a very important part, not only in lawsuits (<a onClick="return mV(\'Exd\',22,11);">Ex 22:11</a>; <a onClick="return mV(\'Lev\',6,3,5);">Le 6:3,5</a>) and state affairs (Ant., XV, x, 4), but also in the dealings of everyday life (<a onClick="return mV(\'Gen\',24,37);">Ge 24:37</a>; <a onClick="return mV(\'Gen\',50,5);">50:5</a>; <a onClick="return mV(\'Jdg\',21,5);">Jud 21:5</a>; <a onClick="return mV(\'1Ki\',18,10);">1Ki 18:10</a>; <a onClick="return mV(\'Ezr\',10,5);">Ezr 10:5</a>). The Mosaic laws concerning oaths were not meant to limit the widespread custom of making oaths, so much as to impress upon the people the sacredness of an oath, forbidding on the one hand swearing falsely (<a onClick="return mV(\'Exd\',20,7);">Ex 20:7</a>; <a onClick="return mV(\'Lev\',19,12);">Le 19:12</a>; <a onClick="return mV(\'Zec\',8,17);">Zec 8:17</a>, etc.), and on the other swearing by false gods, which latter was considered to be a very dark sin (<a onClick="return mV(\'Jer\',12,16);">Jer 12:16</a>; <a onClick="return mV(\'Amo\',8,14);">Am 8:14</a>). In the Law only two kinds of false swearing are mentioned: false swearing of a witness, and false asseveration upon oath regarding a thing found or received (<a onClick="return mV(\'Lev\',5,1);">Le 5:1</a>; <a onClick="return mV(\'Lev\',6,2);">6:2</a>ff; compare <a onClick="return mV(\'Pro\',29,24);">Pr 29:24</a>). Both required a sin offering (<a onClick="return mV(\'Lev\',5,1);">Le 5:1</a>). The Talmud gives additional rules, and lays down certain punishments for false swearing; in the case of a thing found it states what the false swearer must pay (Makkoth 2 3; Shebhu\'oth 8 3). The Jewish interpretation of the 3rd commandment is that it is not concerned with oaths, but rather forbids the use of the name of Yahweh in ordinary cases (so Dalman).<P>2. Forms of Swearing:<P>Swearing in the name of the Lord (<a onClick="return mV(\'Gen\',14,22);">Ge 14:22</a>; <a onClick="return mV(\'Deu\',6,13);">De 6:13</a>; <a onClick="return mV(\'Jdg\',21,7);">Jud 21:7</a>; <a onClick="return mV(\'Rth\',1,17);">Ru 1:17</a>, etc.) was a sign of loyalty to Him (<a onClick="return mV(\'Deu\',10,20);">De 10:20</a>; <a onClick="return mV(\'Isa\',48,11);">Isa 48:11</a>; <a onClick="return mV(\'Jer\',12,16);">Jer 12:16</a>). We know from Scripture (see above) that swearing by false gods was frequent, and we learn also from the newly discovered Elephantine papyrus that the people not only swore by Jahu (= Yahweh) or by the Lord of Heaven, but also among a certain class of other gods, e.g. by Herem-Bethel, and by Isum. In ordinary intercourse it was customary to swear by the life of the person addressed (<a onClick="return mV(\'1Sa\',1,26);">1Sa 1:26</a>; <a onClick="return mV(\'1Sa\',20,3);">20:3</a>; <a onClick="return mV(\'2Ki\',2,2);">2Ki 2:2</a>); by the life of the king (<a onClick="return mV(\'1Sa\',17,55);">1Sa 17:55</a>; <a onClick="return mV(\'1Sa\',25,26);">25:26</a>; <a onClick="return mV(\'2Sa\',11,11);">2Sa 11:11</a>); by one\'s own head (<a onClick="return mV(\'Mat\',5,36);">Mt 5:36</a>); by the earth (<a onClick="return mV(\'Mat\',5,35);">Mt 5:35</a>); by the heaven (<a onClick="return mV(\'Mat\',5,34);">Mt 5:34</a>; <a onClick="return mV(\'Mat\',23,22);">23:22</a>); by the angels (BJ, II, xvi, 4); by the temple (<a onClick="return mV(\'Mat\',23,16);">Mt 23:16</a>), and by different parts of it (<a onClick="return mV(\'Mat\',23,16);">Mt 23:16</a>); by Jerusalem (<a onClick="return mV(\'Mat\',5,35);">Mt 5:35</a>; compare Kethubhoth <span class="noTag">2:9</span>). The oath "by heaven" (<a onClick="return mV(\'Mat\',5,34);">Mt 5:34</a>; <a onClick="return mV(\'Mat\',23,22);">23:22</a>) is counted by Jesus as the oath in which God\'s name is invoked. Jesus does not mean that God and heaven are identical, but He desires to rebuke those who paltered with an oath by avoiding a direct mention of a name of God. He teaches that such an oath is a real oath and must be considered as sacredly binding.<P>3. The Formula:<P>Not much is told us as to the ceremonies observed in taking an oath. In patriarchal times he who took the oath put his hand under the thigh of him to whom the oath was taken (<a onClick="return mV(\'Gen\',24,2);">Ge 24:2</a>; <a onClick="return mV(\'Gen\',47,29);">47:29</a>). The most usual form was to hold up the hand to heaven (<a onClick="return mV(\'Gen\',14,22);">Ge 14:22</a>; <a onClick="return mV(\'Exd\',6,8);">Ex 6:8</a>; <a onClick="return mV(\'Deu\',32,40);">De 32:40</a>; <a onClick="return mV(\'Eze\',20,5);">Eze 20:5</a>). The wife suspected of unfaithfulness, when brought before the priest, had to answer "Amen, Amen" to his adjuration, and this was considered to be an oath on her part (<a onClick="return mV(\'Num\',5,22);">Nu 5:22</a>). The usual formula of an oath was either: "God is witness betwixt me and thee" (<a onClick="return mV(\'Gen\',31,50);">Ge 31:50</a>), or more commonly: "As Yahweh (or God) liveth" (<a onClick="return mV(\'Jdg\',8,19);">Jud 8:19</a>; <a onClick="return mV(\'Rth\',3,13);">Ru 3:13</a>; <a onClick="return mV(\'2Sa\',2,27);">2Sa 2:27</a>; <a onClick="return mV(\'Jer\',38,16);">Jer 38:16</a>); or "Yahweh be a true and faithful witness amongst us" (<a onClick="return mV(\'Jer\',42,5);">Jer 42:5</a>). Usually the penalty invoked by the oath was only suggested: "Yahweh (or God) do so to me" (<a onClick="return mV(\'Rth\',1,17);">Ru 1:17</a>; <a onClick="return mV(\'2Sa\',3,9,35);">2Sa 3:9,35</a>; <a onClick="return mV(\'1Ki\',2,23);">1Ki 2:23</a>; <a onClick="return mV(\'2Ki\',6,31);">2Ki 6:31</a>); in some cases the punishment was expressly mentioned (<a onClick="return mV(\'Jer\',29,22);">Jer 29:22</a>). Nowack suggests that in general the punishment was not expressly mentioned because of a superstitious fear that the person swearing, although speaking the truth, might draw upon himself some of the punishment by merely mentioning it.<P>Philo expresses the desire (ii.194) that the practice of swearing should be discontinued, and the Essenes used no oaths (BJ, II, viii, 6; Ant., XV, x, 4).<P>4. Oaths Permissible:<P>That oaths are permissible to Christians is shown by the example of our Lord (<a onClick="return mV(\'Mat\',26,63);">Mt 26:63</a>f), and of Paul (<a onClick="return mV(\'2Cr\',1,23);">2Co 1:23</a>; <a onClick="return mV(\'Gal\',1,20);">Ga 1:20</a>) and even of God Himself (<a onClick="return mV(\'Hbr\',6,\'13-18\');">Heb 6:13-18</a>). Consequently when Christ said, "Swear not at all" (<a onClick="return mV(\'Mat\',5,34);">Mt 5:34</a>), He was laying down the principle that the Christian must not have two standards of truth, but that his ordinary speech must be as sacredly true as his oath. In the kingdom of God, where that principle holds sway, oaths become unnecessary.``98';
isbe[6472]='Obadiah`o-ba-di\'-a (\'obhadhyah, more fully \'obhadhyahu, "servant of Yahweh"):<P>(1) The steward or prime minister of Ahab, who did his best to protect the prophets of Yahweh against Jezebel\'s persecution. He met Elijah on his return from Zarephath, and bore to Ahab the news of Elijah\'s reappearance (<a onClick="return mV(\'1Ki\',18,\'3-16\');">1Ki 18:3-16</a>).<P>(2) The prophet (<a onClick="return mV(\'Oba\',1,1);">Ob 1:1</a>). See <a href="./study/isbe/search.html?string=OBADIAH,+BOOK+OF">OBADIAH, BOOK OF</a>.<P>(3) A descendant of David (<a onClick="return mV(\'1Ch\',3,21);">1Ch 3:21</a>).<P>(4) A chief of the tribe of Issachar (<a onClick="return mV(\'1Ch\',7,3);">1Ch 7:3</a>).<P>(5) A descendant of Saul (<a onClick="return mV(\'1Ch\',8,38);">1Ch 8:38</a>; <a onClick="return mV(\'1Ch\',9,44);">9:44</a>).<P>(6) A Levite descended from Jeduthun (<a onClick="return mV(\'1Ch\',9,16);">1Ch 9:16</a>), identical with Abda (<a onClick="return mV(\'Neh\',11,17);">Ne 11:17</a>).<P>(7) A chief of the Gadites (<a onClick="return mV(\'1Ch\',12,9);">1Ch 12:9</a>).<P>(8) A Zebulunite, father of the chief Ishmaiah (<a onClick="return mV(\'1Ch\',27,19);">1Ch 27:19</a>).<P>(9) One of the princes sent by Jehoshaphat to teach the law in Judah (<a onClick="return mV(\'2Ch\',17,7);">2Ch 17:7</a>).<P>(10) A Merarite employed by Josiah to oversee the workmen in repairing the temple (<a onClick="return mV(\'2Ch\',34,12);">2Ch 34:12</a>).<P>(11) The head of a family who went up with Ezra from Babylon (<a onClick="return mV(\'Ezr\',8,9);">Ezr 8:9</a>).<P>(12) One of the men who sealed the covenant with Nehemiah (<a onClick="return mV(\'Neh\',10,5);">Ne 10:5</a>).<P>(13) A gate-keeper in the days of Nehemiah (<a onClick="return mV(\'Neh\',12,25);">Ne 12:25</a>).<P>The name "Obadiah" was common in Israel from the days of David to the close of the Old Testament. An ancient Hebrew seal bears the inscription "Obadiah the servant of the King."``156';
isbe[6473]='Obadiah, Book of`Obadiah is the shortest book in the Old Testament. The theme of the book is the destruction of Edom. Consequent upon the overthrow of Edom is the enlargement of the borders of Judah and the establishment of the kingship of Yahweh. Thus far all scholars are agreed; but on questions of authorship and date there is wide divergence of opinion.<P>1. Contents of the Book:<P>(1) Yahweh summons the nations to the overthrow of proud Edom. The men of Esau will be brought down from their lofty strongholds; their hidden treasures will be rifled; their confederates will turn against them; nor will the wise and the mighty men in Edom be able to avert the crushing calamity (<a onClick="return mV(\'Oba\',1,\'1-9\');">Ob 1:1-9</a>).<P>(2) The overthrow of Edom is due to the violence and cruelty shown toward his brother Jacob. The prophet describes the cruelty and shameless gloating over a brother\'s calamity, in the form of earnest appeals to Edom not to do the selfish and heartless deeds of which he had been guilty when Jerusalem was sacked by foreign foes (<a onClick="return mV(\'Oba\',1,\'10-14\');">Ob 1:10-14</a>).<P>(3) The day of the display of Yahweh\'s retributive righteousness upon the nations is near. Edom shall be completely destroyed by the people whom he has tried to uproot, while Israel\'s captives shall return to take possession of their own land and also to seize and rule the mount of Esau. Thus the kingship of Yahweh shall be established (<a onClick="return mV(\'Oba\',1,\'15-21\');">Ob 1:15-21</a>).<P>2. Unity of the Book:<P>The unity of Obadiah was first challenged by Eichhorn in 1824, <a onClick="return mV(\'Oba\',1,\'17-21\');">1:17-21</A> being regarded by him as an appendix attached to the original exilic prophecy in the time of Alexander Janneus (104-78 BC). Ewald thought that an exilic prophet, to whom he ascribed <a onClick="return mV(\'Oba\',1,\'11-14\');">1:11-14</A> and <a onClick="return mV(\'Oba\',1,\'19-21\');">19-21</a>, had made use of an older prophecy by Obadiah in <a onClick="return mV(\'Oba\',1,\'1-10\');">1:1-10,</A> and in <a onClick="return mV(\'Oba\',1,\'15-18\');">1:15-18</A> of material from another older prophet who was contemporary, like Obadiah, with Isaiah. As the years went on, the material assigned to the older oracle was limited by some to <a onClick="return mV(\'Oba\',1,\'1-9\');">1:1-9</a> and by others to <a onClick="return mV(\'Oba\',1,\'1-6\');">1:1-6</a>. Wellhausen assigned to <a onClick="return mV(\'Oba\',1,\'1-5\',7,10,11,13,14,15);">Obadiah 1:1-5,7,10,11,13,14,15b</a>, while all else was regarded as a later appendix. Barton\'s theory of the composition of Obadiah is thus summed up by Bewer: "<a onClick="return mV(\'Oba\',1,\'1-6\');">Ob 1:1-6</a> are a pre-exilic oracle of Obadiah, which was quoted by Jeremiah, and readapted with additions (<a onClick="return mV(\'Oba\',1,\'7-15\');">Ob 1:7-15</a>) by another Obadiah in the early post-exilic days; <a onClick="return mV(\'Oba\',1,\'16-21\');">1:16-21</a> form an appendix, probably from Maccabean times" (ICC, 5). Bewer\'s own view is closely akin to Barton\'s. He thinks that Obadiah, writing in the 5th century BC, "quoted <a onClick="return mV(\'Oba\',1,\'1-4\');">1:1-4</a> almost, though not quite, literally; that he commented on the older oracle in <a onClick="return mV(\'Oba\',1,\'5-7\');">1:5-7</a>, partly in the words of the older prophet, partly in his own words, in order to show that it had been fulfilled in his own day; and that in <a onClick="return mV(\'Oba\',1,8-9);">1:8,9</a> he quoted once more from the older oracle without any show of literalness." He ascribes to <a onClick="return mV(\'Oba\',1,\'10-14\');">Obadiah 1:10-14</a> and <a onClick="return mV(\'Oba\',1,15);">15b</a>. The appendix consists of two sections, <a onClick="return mV(\'Oba\',1,\'15-18\');">1:15a, 16-18</A> and <a onClick="return mV(\'Oba\',1,\'19-21\');">1:19-21</A>, possibly by different authors, <a onClick="return mV(\'Oba\',1,18);">1:18</A> being a quotation from some older prophecy. To the average Bible student all this minute analysis of a brief prophecy must seem hypercritical. He will prefer to read the book as a unity; and in doing so will get the essence of the message it has for the present day.<P>3. Date of the Book:<P>Certain preliminary problems require solution before the question of date can be settled.<P>(1) Relation of Obadiah and <a onClick="return mV(\'Jer\',49,\'1-\');">Jeremiah 49</a>.<P>(a) Did Obadiah quote from Jeremiah? Pusey thus sets forth the impossibility of such a solution: "Out of 16 verses of which the prophecy of Jeremiah against Edom consists, four are identical with those of Obadiah; a fifth embodies a verse of Obadiah\'s; of the eleven which remain, ten have some turns of expression or idioms, more or fewer, which recur in Jeremiah, either in these prophecies against foreign nations, or in his prophecies generally. Now it would be wholly improbable that a prophet, selecting verses out of the prophecy of Jeremiah, should have selected precisely those which contain none of Jeremiah\'s characteristic expressions; whereas it perfectly fits in with the supposition that Jeremiah interwove verses of Obadiah with his own prophecy, that in verses so interwoven there is not one expression which occurs elsewhere in Jeremiah" (Minor Prophets, I, 347).<P>(b) Did Jeremiah quote from Obadiah? It is almost incredible that the vigorous and well-articulated prophecy in Obadiah could have been made by piecing together detached quotations from Jer; but Jeremiah may well have taken from Obadiah many expressions that fell in with his general purpose. There are difficulties in applying this view to one or two verses, but it has not been disproved by the arguments from meter advanced by Bewer and others.<P>(c) Did both Obadiah and Jeremiah quote from an older oracle? This is the favorite solution among recent scholars, most of whom think that Obadiah preserves the vigor of the original, while Jeremiah quotes with more freedom; but Bewer in ICC, after a detailed comparison, thus sums up: "Our conclusion is that Obadiah quoted in <a onClick="return mV(\'Oba\',1,\'1-9\');">Ob 1:1-9</a> an older oracle, the original of which is better preserved in <a onClick="return mV(\'Jer\',49,\'1-\');">Jer 49</a>." The student will do well to get his own first-hand impression from a careful comparison of the two passages. With <a onClick="return mV(\'Oba\',1,\'1-4\');">Ob 1:1-4</a> compare <a onClick="return mV(\'Jer\',49,\'14-16\');">Jer 49:14-16</a>; with <a onClick="return mV(\'Oba\',1,5,6);">Ob 1:5,6</a> compare <a onClick="return mV(\'Jer\',49,9,10);">Jer 49:9,10 a</a>; with <a onClick="return mV(\'Oba\',1,8);">Ob 1:8</a> compare <a onClick="return mV(\'Jer\',49,7);">Jer 49:7</a>; with <a onClick="return mV(\'Oba\',1,9);">Ob 1:9</a> a compare <a onClick="return mV(\'Jer\',49,22);">Jer 49:22b</a>. On the whole, the view that Jeremiah, who often quotes from earlier prophets, draws directly from Obadiah, with free working over of the older prophets, seems still tenable.<P>(2) Relation of Obadiah and Joel.<P>There seems to be in <a onClick="return mV(\'Joe\',2,32);">Joe 2:32 (Hebrew 3:5)</a> a direct allusion to <a onClick="return mV(\'Oba\',1,17);">Ob 1:17</a>. If Joel prophesied during the minority of the boy king Joash (circa 830 BC), Obadiah would be, on this hypothesis, the earliest of the writing prophets.<P>(3) What Capture of Jerusalem Is Described in <a onClick="return mV(\'Oba\',1,\'10-14\');">Obadiah 1:10-14</a>?<P>The disaster seems to have been great enough to be called "destruction" (<a onClick="return mV(\'Oba\',1,12);">Ob 1:12</a>). Hence, most scholars identify the calamity described by Obadiah with the capture and destruction of Jerusalem by the Chaldeans in 587 BC. But it is remarkable, on this hypothesis, that no allusion is made either in Obadiah or <a onClick="return mV(\'Jer\',49,\'7-22\');">Jer 49:7-22</a> to the Chaldeans or to the destruction of the temple or to the wholesale transportation of the inhabitants of Jerusalem to Babylonia. We know, however, from <a onClick="return mV(\'Eze\',35,\'1-15\');">Eze 35:1-15</a> and <a onClick="return mV(\'Psa\',137,7);">Ps 137:7</a> that Edom rejoiced over the final destruction of Jerusalem by the Chaldeans in 587 BC, and that they encouraged the destroyers to blot out the holy city. Certain it is that the events of 587 accord remarkably with the language of <a onClick="return mV(\'Oba\',1,\'10-14\');">Ob 1:10-14</a>. Pusey indeed argues from the use of the form of the direct prohibition in <a onClick="return mV(\'Oba\',1,\'12-14\');">Ob 1:12-14</a> that Edom had not yet committed the sins against which the prophet warns him, and so Jerusalem was not yet destroyed, when Obadiah wrote. But almost all modern scholars interpret the language of <a onClick="return mV(\'Oba\',1,\'12-14\');">Ob 1:12-14</a> as referring to what was already past; the prophet "speaks of what the Edomites had actually done as of what they ought not to do." The scholars who regard Obadiah as the first of the writing prophets locate his ministry in Judah during the reign of Jehoram (circa 845 BC). Both 2 Kings and 2 Chronicles tell of the war of rebellion in the days of Jehoram when Edom, after a fierce struggle, threw off the yoke of Judah (<a onClick="return mV(\'2Ki\',8,\'20-22\');">2Ki 8:20-22</a>; <a onClick="return mV(\'2Ch\',21,\'8-10\');">2Ch 21:8-10</a>). Shortly after the revolt of Edom, according to <a onClick="return mV(\'2Ch\',21,16);">2Ch 21:16</a>f; the Philistines and Arabians broke into Judah, "and carried away all the substance that was found in the king\'s house, and his sons also, and his wives; so that there was never a son left him, save Jehoahaz, the youngest of his sons." Evidently the capital city fell into the hands of the invaders. It was a calamity of no mean proportions.<P>The advocates of a late date call attention to three points that weaken the case for an early date for Obadiah:<P>(a) The silence of 2 Kings as to the invasion of the Philistines and Arabians. But what motive could the author of Chronicles have had for inventing the story?<P>(b) The absence of any mention of the destruction of the city by the Philistines and Arabians. It must be acknowledged that the events of 587 BC accord more fully with the description in <a onClick="return mV(\'Oba\',1,\'10-14\');">Ob 1:10-14</a>, though the disaster in the days of Jehoram must have been terrible.<P>(c) The silence as to Edom in <a onClick="return mV(\'2Ch\',21,16);">2Ch 21:16</a>f. But so also are the historic books silent as to the part that Edom took in the destruction of Jerusalem in 587.<P>It is true that exilic and post-exilic prophets and psalmists speak in bitter denunciation of the unbrotherly conduct of Edom (<a onClick="return mV(\'Lam\',4,21,22);">La 4:21,22</a>; <a onClick="return mV(\'Eze\',25,\'12-14\');">Eze 25:12-14</a>; <a onClick="return mV(\'Eze\',35,\'1-15\');">35:1-15</a>; <a onClick="return mV(\'Psa\',137,7);">Ps 137:7</a>; <a onClick="return mV(\'Mal\',1,\'1-5\');">Mal 1:1-5</a>; compare also <a onClick="return mV(\'Isa\',34,1);">Isa 34</a> and 63:1-6); but it is also true that the earliest Hebrew literature bears witness to the keen rivalry between Esau and Jacob (<a onClick="return mV(\'Gen\',25,22);">Ge 25:22</a>f; <a onClick="return mV(\'Gen\',27,41);">27:41</a>; <a onClick="return mV(\'Num\',20,\'14-21\');">Nu 20:14-21</a>), and one of the earliest of the writing prophets denounces Edom for unnatural cruelty toward his brother (<a onClick="return mV(\'Amo\',1,11);">Am 1:11</a>f; compare <a onClick="return mV(\'Joe\',3,19);">Joe 3:19 (Heb 4:19)</a>).<P>(4) The Style of Obadiah.<P>Most early critics praise the style. Some of the more recent critics argue for different authors on the basis of a marked difference in style within the compass of the twenty-one verses in the little roll. Thus Selbie writes in HDB: "There is a difference in style between the two halves of the book, the first being terse, animated, and full of striking figures, while the second is diffuse and marked by poverty of ideas and trite figures." The criticism of the latter part of the book is somewhat exaggerated, though it may be freely granted that the first half is more original and vigorous. The Hebrew of the book is classic, with scarcely any admixture of Aramaic words or constructions. The author may well have lived in the golden age of the Hebrew language and literature.<P>(5) Geographical and Historical Allusions.<P>The references to the different sections and cities in the land of Israel and in the land of Edom are quite intelligible. As to Sepharad (<a onClick="return mV(\'Oba\',1,20);">Ob 1:20</a>) there is considerable difference of opinion. Schrader and some others identify it with a Shaparda in Media, mentioned in the annals of Sargon (722-705 BC). Many think of Asia Minor, or a region in Asia Minor mentioned in Persian inscriptions, perhaps Bithynia or Galatia (Sayce). Some think that the mention of "the captives of this host of the children of Israel" and "the captives of Jerusalem" (<a onClick="return mV(\'Oba\',1,20);">Ob 1:20</a>) proves that both the Assyrian captivity and the Babylonian exile were already past. This argument has considerable force; but it is well to remember that Amos, in the first half of the 8th century, describes wholesale deportations from the land of Israel by men engaged in the slave trade (<a onClick="return mV(\'Amo\',1,\'6-10\');">Am 1:6-10</a>). The problem of the date of Obadiah has not been solved to the satisfaction of Biblical students. Our choice must be between a very early date (circa 845) and a date shortly after 587, with the scales almost evenly balanced.<P>4. Interpretation of the Book:<P>Obadiah is to be interpreted as prediction rather than history. In <a onClick="return mV(\'Oba\',1,\'11-14\');">1:11-14</a> there are elements of historic description, but <a onClick="return mV(\'Oba\',1,\'1-10\');">1:1-10</a> and <a onClick="return mV(\'Oba\',1,\'15-21\');">15-21</a> are predictive.<P>LITERATURE.<P>Comms.: Caspari, Der Prophet Obadjah ausgelegt, 1842; Pusey, The Minor Prophets, 1860; Ewald, Commentary on the Prophets of the Old Testament (English translation), II, 277ff, 1875; Keil (ET), 1880; T.T. Perowne (in Cambridge Bible), 1889; von Orelli (English translation), The Minor Prophets, 1893; Wellhausen, Die kleinen Propheten, 1898; G.A. Smith, The Book of the Twelve Prophets, II, 163ff, 1898; Nowack, Die kleinen Propheten, 1903; Marti, Dodekapropheton, 1903; Eiselen, The Minor Prophets, 1907; Bewer, ICC, 1911. Miscellaneous: Kirkpatrick, Doctrine of the Prophets, 33ff; Intros of Driver, Wildeboer, etc.; Selbie in HDB, III, 577-80; Barton in JE, IX, 369-70; Cheyne in EB, III, 3455-62; Peckham, An Introduction to the Study of Obadiah, 1910; Kent, Students\' Old Testament, III, 1910.``156';
