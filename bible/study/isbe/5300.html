isbe[5377]='Laban`la\'-ban: The person named Laban, labhan; (Laban, possibly connected with the root meaning "to be white," from which in Hebrew the adjective meaning "white" has just this form) is first introduced to the reader of Genesis in the story of the wooing of Rebekah (<a onClick="return mV(\'Gen\',24,\'1-\');">Genesis 24</a>). He belonged to that branch of the family of Terah that was derived from Abraham\'s brother Nahor and his niece Milcah. The genealogy of this branch is traced in <a onClick="return mV(\'Gen\',22,\'20-24\');">Ge 22:20-24</a>; but, true to its purpose and the place it occupies in the book, this genealogy brings the family down to Rebekah, and there stops without mentioning Laban. Accordingly, when Rebekah is introduced in the narrative of <a onClick="return mV(\'Gen\',24,\'1-\');">Genesis 24</a>, she is referred to (<a onClick="return mV(\'Gen\',24,15,24);">24:15,24</A>) in a way that recalls to the reader the genealogy already given; but when her brother Laban is introduced (<a onClick="return mV(\'Gen\',24,29);">24:29</A>), he is related to his sister by the express announcement, "And Rebekah had brother, and his name was Laban." In this chapter he takes prominent part in the reception of Abraham\'s servant, and in the determination of his sister\'s future. That brothers had an effective voice in the marriage of their sisters is evident, not only from extra-Biblical sources, but from the Bible itself; see e.g. <a onClick="return mV(\'Sgs\',8,8);">So 8:8</a>. In <a onClick="return mV(\'Gen\',24,\'1-\');">Ge 24</a>, however, Laban is perhaps more prominent than even such custom can explain (compare <a onClick="return mV(\'Gen\',24,31,50,55);">24:31,50,55</A>), and we are led to see in him already the same forcefulness and egotism that are abundantly shown in the stories from his later life. The man\'s eager hospitality (verse <a onClick="return mV(\'Gen\',24,31);">31</A>), coming immediately after his mental inventory of the gifts bestowed by the visitor upon his sister (<a onClick="return mV(\'Gen\',24,30);">24:30</A>), has usually, and justly, been regarded as a proof of the same greed that is his most conspicuous characteristic in the subsequent chapters.<P>The story of that later period in Laban\'s life is so interwoven with the career of Jacob that little need here be added to what is said of Laban in <a href="./study/isbe/search.html?string=JACOB">JACOB, III, 2</A> (which see). By the time of Jacob\'s arrival he is already a very old man, for over 90 years had elapsed since Rebekah\'s departure. Yet even at the end of Jacob\'s 20 years\' residence with him he is represented as still energetic and active (<a onClick="return mV(\'Gen\',31,19,23);">Ge 31:19,23</a>), not only ready for an emergency like the pursuit after Jacob, but personally superintending the management of his huge flocks.<P>His home is in Haran, "the city of Nahor," that is, the locality where Nahor and his family remained at the time when the rest of Terah\'s descendants emigrated to Canaan (<a onClick="return mV(\'Gen\',11,31);">Ge 11:31</a>; <a onClick="return mV(\'Gen\',12,5);">12:5</a>). Since Haran, and the region about it where his flocks fed, belonged to the district called Aram (see <a href="./study/isbe/search.html?string=PADDAN-ARAM">PADDAN-ARAM</A>; <a href="./study/isbe/search.html?string=MESOPOTAMIA">MESOPOTAMIA</A>), Laban is often called "the Aramean" (English Versions of the Bible, "the Syrian," from Septuagint 5 ho Suros); see <a onClick="return mV(\'Gen\',25,20);">Ge 25:20</a>; <a onClick="return mV(\'Gen\',28,5);">28:5</a>; <a onClick="return mV(\'Gen\',31,20,24);">31:20,24</a>. It is uncertain how far racial affinity may be read into this term, because the origin and mutual relationships of the various groups or strata of the Sere family are not yet clear. For Laban himself it suffices that he was a Semite, living within the region early occupied by those who spoke the Sere dialect that we call Aramaic. This dialect is represented in the narrative of Genesis as already differentiated from the dialect of Canaan that was Jacob\'s mother-tongue; for "the heap of witness," erected by uncle and nephew before they part (<a onClick="return mV(\'Gen\',31,47);">Ge 31:47</a>), is called by the one Jegar-saha-dutha and by the other Galeed—phrases which are equivalent in meaning, the former Aramaic, the latter Hebrew. (Ungnad, Hebrdische Grammatik,1912,section 6 puts the date of the differentiation of Aramaic from "Amurritish" at "about 1500 BC"; Skinner, "Genesis," ICC, argues that <a onClick="return mV(\'Gen\',31,47);">Ge 31:47</a> is a gloss, following Wellhausen, Dillmann, et al.)<P>The character of Laban is interesting to observe. On the one hand it shows a family likeness to the portraits of all his relations in the patriarchal group, preeminently, however, to his sister Rebekah, his daughter Rachel, and his nephew Jacob. The nearer related to Laban such figures are, the more conspicuously, as is fitting, do they exhibit Laban\'s mingled cunning, resourcefulness, greed and self-complacency. And, on the other hand, Laban\'s character is sui generis; the picture we get of him is too personal and complex to be denominated merely a "type." It is impossible to resolve this man Laban into a mythological personage—he is altogether human—or into a tribal representative (e.g. of "Syria" over against "Israel" equal Jacob) with any degree of satisfaction to the world of scholarship. Whether a character of reliable family tradition, or of popular story-telling, Laban is "a character"; and his intimate connection with the chief personage in Israel\'s national recollections makes it highly probable that he is no more and no less historical than Jacob himself (compare <a href="./study/isbe/search.html?string=JACOB">JACOB, VI</A>).``15';
isbe[5378]='Labana`lab\'-a-na (Labana, 1Esdras 5:29): Called Lebanah in <a onClick="return mV(\'Ezr\',2,45);">Ezr 2:45</a>.``1';
isbe[5379]='Labor`la\'-ber (yeghia\', \'amal; kopos): The word (noun and verb) denoting hard work or "toil" (thus in the Revised Version (British and American) of <a onClick="return mV(\'Deu\',26,7);">De 26:7</a>; <a onClick="return mV(\'Jos\',7,3);">Jos 7:3</a>; <a onClick="return mV(\'Rev\',2,2);">Re 2:2</a>) represents several Hebrew and Greek words, chiefly those above. Occasionally, as in <a onClick="return mV(\'Hab\',3,17);">Hab 3:17</a> (ma\'aseh), it stands for "fruit of labor." Sometimes, in conjunction with "travail," it refers to childbirth (<a onClick="return mV(\'Gen\',35,16,17);">Ge 35:16,17</a>, yaladh; compare <a onClick="return mV(\'1Th\',2,9);">1Th 2:9</a>; <a onClick="return mV(\'2Th\',3,8);">2Th 3:8</a>). Examples of the word in the ordinary sense are: of yeghia\', <a onClick="return mV(\'Gen\',31,42);">Ge 31:42</a>; <a onClick="return mV(\'Job\',39,11,16);">Job 39:11,16</a>; <a onClick="return mV(\'Psa\',128,2);">Ps 128:2</a>; of \'amal, common in <a onClick="return mV(\'Ecc\',1,3,8);">Ec 1:3,8</a>; <a onClick="return mV(\'Ecc\',2,10,11,18);">2:10,11,18</a>, etc.; of kopos, <a onClick="return mV(\'1Cr\',15,58);">1Co 15:58</a> ("your labor is not vain," etc.); <a onClick="return mV(\'1Th\',1,3);">1Th 1:3</a> ("work of faith and labor of love"; compare <a onClick="return mV(\'Hbr\',6,10);">Heb 6:10</a>); <a onClick="return mV(\'1Ti\',5,17);">1Ti 5:17</a> ("labor in the word and in teaching").`<a href="./study/isbe/search.html?string=WORK">WORK</a>; <a href="./study/isbe/search.html?string=SLAVERY">SLAVERY</a>`132';
isbe[5380]='Laccunus`lak\'-u-nus (Lakkounos; the King James Version Lacunus): One of the sons of Addi who returned with Ezra and had married a foreign wife (1Esdras 9:31). The name does not, as might have been expected, occur in <a onClick="return mV(\'Ezr\',10,30);">Ezr 10:30</a>. See note on the passage (in Lange\'s Commentary) as to the reconciliation of the lists in 1Esdras and Ezra.``1';
isbe[5381]='Lace`las (pathil, variously rendered in <a onClick="return mV(\'Gen\',38,18,25);">Ge 38:18,25</a>; <a onClick="return mV(\'Exd\',39,3);">Ex 39:3</a>; <a onClick="return mV(\'Num\',15,38);">Nu 15:38</a>; <a onClick="return mV(\'Num\',19,15);">19:15</a>; <a onClick="return mV(\'Jdg\',16,9);">Jud 16:9</a>; <a onClick="return mV(\'Eze\',40,3);">Eze 40:3</a>): In modern English the noun "lace" usually denotes a delicate ornamental fabric, but in the word in the sense of "that which binds" is still in perfectly good use, especially in such combinations as "shoelace" etc. It is this latter significance that is found in <a onClick="return mV(\'Exd\',28,28);">Ex 28:28</a> ("They shall bind...with a lace of blue"); <a onClick="return mV(\'Exd\',28,37);">28:37</A>; <a onClick="return mV(\'Exd\',39,21,31);">39:21,31</A>, and in Sirach 6:30 the King James Version, klosma (the Revised Version (British and American) "riband").``1';
isbe[5382]='Lacedaemonians`las-e-de-mo\'-ni-anz (Spartidtai; once only Lakedaimonioi, 2Macc 5:9): The inhabitants of Sparta or Lacedaemon with whom the Jews claimed some kinship and formed alliances (1Macc 12:2,5,6,20,21; 14:20,23; 15:23; 2Macc 5:9). The alliance mentioned in 1Macc 12:5-23 is based, among other grounds, on that of a common descent of Jews and Lacedaemonians from Abraham, for which the only probable presumption—suggested by Ewald—is the similarity of names, "Pelasgi" and Peleg son of Eber (<a onClick="return mV(\'Gen\',10,25);">Ge 10:25</a>; <a onClick="return mV(\'Gen\',11,16);">11:16</a>). This has been reasonably objected to, and perhaps the most that can be said on this point is that the belief in some relationship between the Jews and the Lacedaemonians seems to have prevailed when 1Macc was written. The alliance itself is said to have been formed (1Macc 12:20) between Areus, king of the Lacedaemonians and Onias the high priest; but it is not easy to make out a consistent chronology for the transaction. For the renewal of the alliance (circa 144 BC) by Jonathan (1Macc 12:5-18) and again by Simon (1Macc 14:16-23), something can be said, as the Greeks had finally been deprived of independence in 146 BC, and Sparta was only obliged to lend assistance to Rome and may be supposed to have been doing so in helping the Jews against Syria. It is possible, too, that as against Syrian Hellenism the Jews were anxious to show that they had the assistance of distinguished Greeks, though the actual power of Sparta was much reduced from that of former times. The facts, at least of the alliance and the correspondence, seem to be sufficiently attested, though it is not easy to reconcile all the particulars. Josephus (Ant., XII, iv, 10; XIII, v, 8; XIV, xii, 2, 3) gives the correspondence at greater length than the writer of the Maccabees.``79';
isbe[5383]='Lachish`la\'-kish (lakhish; Septuagint Lachis (<a onClick="return mV(\'Jos\',15,39);">Jos 15:39</a>), Maches):<P>1. Location:<P>A town in the foothills of the Shephelah on the border of the Philistine plain, belonging to Judah, and, from the mention of Eglon in connection with it, evidently in the southwestern portion of Judah\'s territory. Eusebius, Onomasticon locates it 7 miles from Eleutheropolis (Beit Jibrin) toward Daroma, but as the latter place is uncertain, the indication does not help in fixing the site of Lachish. The city seems to have been abandoned about 400 BC, and this circumstance has rendered the identification of the site difficult. It was formerly fixed at Umm Lakis, from the similarity of the name and because it was in the region that the Biblical references to Lachish seem to indicate, but the mound called Tell el-Hesy is now generally accepted as the site. This was first suggested by Conder in 1877 (PEFS, 1878, 20), and the excavations carried on at the Tell by the Palestine Exploration Fund in 1890-93 confirmed his identification. Tell el-Hesy is situated on a wady, or valley, of the same name (Wady el Hesy), which runs from a point about 6 miles west of Hebron to the sea between Gaza and Askelon. It is a mound on the very edge of the wady, rising some 120 ft. above it and composed of debris to the depth of about 60 ft., in which the excavations revealed the remains of distinct cities which had been built, one upon the ruins of another. The earliest of these was evidently Amorite, and could not have been later than 1700 BC, and was perhaps two or three centuries earlier (Bliss, Mound of Many Cities). The identification rests upon the fact that the site corresponds with the Biblical and other historical notices of Lachish, and especially upon the discovery of a cuneiform tablet in the ruins of the same character as the Tell el-Amarna Letters, and containing the name of Zimridi, who is known from these tablets to have been at one time Egyptian governor of Lachish. The tablets, which date from the latter part of the 15th or early part of the 14th century BC, give us the earliest information in regard to Lachish, and it was then an Egyptian dependency, but it seems to have revolted and joined with other towns in an attack upon Jerusalem, which was also an Egyptian dependency. It was perhaps compelled to do so by the Khabiri who were then raiding this region. The place was, like Gaza, an important one for Egypt, being on the frontier and on the route to Jerusalem, and the importance is seen in the fact that it was taken and destroyed and rebuilt so many times.<P>2. History:<P>We first hear of it in the history of Israel when Joshua invaded the land. It was then an Amorite city, and its king, Japhia, joined the confederacy formed by Adonizedek, king of Jerusalem, to resist Joshua. They were defeated in the remarkable battle at Gibeon, and the five confederate kings were captured and put to death at Makkedah (<a onClick="return mV(\'Jos\',10,\'1-\');">Jos 10</a> passim; <a onClick="return mV(\'Jos\',12,11);">Jos 12:11</a>). Lachish was included in the lot of Judah (<a onClick="return mV(\'Jos\',15,39);">15:39</A>), and it was rebuilt, or fortified, by Rehoboam (<a onClick="return mV(\'2Ch\',11,5,9);">2Ch 11:5,9</a>). It was besieged by Sennacherib in the reign of Hezekiah and probably taken (<a onClick="return mV(\'2Ki\',18,13);">2Ki 18:13</a>) when he invaded Judah and besieged Jerusalem, but the other references to the siege leave it doubtful (<a onClick="return mV(\'2Ki\',18,14,17);">2Ki 18:14,17</a>; <a onClick="return mV(\'2Ki\',19,8);">19:8</a>; <a onClick="return mV(\'2Ch\',32,9);">2Ch 32:9</a>; <a onClick="return mV(\'Isa\',36,2);">Isa 36:2</a>; <a onClick="return mV(\'Isa\',37,8);">37:8</a>). The Assyrian monuments, however, render it certain that the place was captured. The sculptures on the walls of Sennacherib\'s palace picture the storming of Lachish and the king on his throne receiving the submission of the captives (Ball, Light from the East, 190-91). This was in 701 BC, and to this period we may assign the enigmatical reference to Lachish in <a onClick="return mV(\'Mic\',1,13);">Mic 1:13</a>, "Bind the chariot to the swift steed, O inhabitant of Lachish: she was the beginning of sin to the daughter of Zion." The cause of the invasion of Sennacherib was a general revolt in Phoenicia, Palestine, and Philistia, Hezekiah joining in it and all asking Egypt for aid (Rawlinson, Five Great Monarchies of the Ancient Eastern World, chapter ix). Isaiah had warned Judah not to trust in Egypt (<a onClick="return mV(\'Isa\',20,5,6);">Isa 20:5,6</a>; <a onClick="return mV(\'Isa\',30,\'1-5\');">30:1-5</a>; <a onClick="return mV(\'Isa\',31,1);">31:1</a>), and as Lachish was the place where communication was held with Egypt, being a frontier fortress, perhaps even having an Egyptian garrison, it would be associated with the "sin" of the Egyptian alliance (HGHL, 234).<P>The city was evidently rebuilt after its destruction by Sennacherib, for we find Nebuchadnezzar fighting against it during his siege of Jerusalem (<a onClick="return mV(\'Jer\',34,7);">Jer 34:7</a>). It was doubtless destroyed by him, but we are informed by Nehemiah (<a onClick="return mV(\'Neh\',11,30);">11:30</a>) that some of the returned Jews settled there after the captivity. It is very likely that they did not reoccupy the site of the ruined city, but settled as peasants in the territory, and this may account for the transference of the name to Umm Lakis, 3 or 4 miles from Tell el-Hesy, where some ruins exist, but not of a kind to suggest Lachish (Bliss, op. cit). No remains of any importance were found on the Tell indicating its occupation as a fortress or city later than that destroyed by the king of Babylon, but it was occupied in some form during the crusades, Umm Lakis being held for a time by the Hospitallers, and King Richard is said to have made it a base of operations in his war with Saladin (HGHL). The Tell itself, if occupied, was probably only the site of his camp, and it has apparently remained since that time without inhabitants, being used for agricultural purposes only.`<a href="./study/isbe/search.html?string=PALESTINE+EXPLORATION">PALESTINE EXPLORATION</a>`138';
isbe[5384]='Lack`(forms of chacer, "to lack," ayin, "nought"): This word in its various forms has the usual meaning of "want," "need," "deficiency." There is but little change in the use of the word in the different versions. Sometimes one of the common synonyms is exchanged for the word itself, e.g. in the Old Testament, <a onClick="return mV(\'1Sa\',21,15);">1Sa 21:15</a> the Revised Version (British and American) has "lack" ("Do I lack madmen?") where the King James Version has "need of"; <a onClick="return mV(\'Pro\',5,23);">Pr 5:23</a>, "for lack," instead of "without"; <a onClick="return mV(\'Pro\',6,32);">6:32</A>, "void of" for "lacketh"; <a onClick="return mV(\'Pro\',10,21);">10:21</A>, "lack" for "want"; <a onClick="return mV(\'Pro\',31,11);">31:11</A>, "lack" for "need"; <a onClick="return mV(\'Isa\',59,15);">Isa 59:15</a>, "lacking" for "faileth." In the New Testament "lack" is the translation of hustereo, literally, "to be behind," and endees, "in want." In <a onClick="return mV(\'Luk\',8,6);">Lu 8:6</a>, the Revised Version (British and American) reads "had no" instead of "lacked" in the King James Version. In <a onClick="return mV(\'2Cr\',11,9);">2Co 11:9</a>, the Revised Version gives "my want" for "which was lacking to me" in the King James Version; in <a onClick="return mV(\'Col\',1,24);">Col 1:24</a> "that which is lacking" for "that which is behind"; <a onClick="return mV(\'Jam\',2,15);">Jas 2:15</a> "lack" for "destitute." It will readily be seen that sometimes the slight variation helps to explain the meaning.``64';
isbe[5385]='Lacunus`la-ku\'-nus.`<a href="./study/isbe/search.html?string=LACCUNUS">LACCUNUS</a>`1';
isbe[5386]='Lad`In the Old Testament this word occurs as the translation of na\'ar, "young person," "child," "servant," the Revised Version (British and American) properly substituting "servant" in <a onClick="return mV(\'2Ki\',4,19);">2Ki 4:19</a>; <a onClick="return mV(\'Jdg\',16,26);">Jud 16:26</a> is another passage where either sense of the original word may be intended. The word occurs in the New Testament in <a onClick="return mV(\'Jhn\',6,9);">Joh 6:9</a> as the translation of paidarion; in <a onClick="return mV(\'Act\',20,12);">Ac 20:12</a>, pais (the King James Version "young man").``1';
isbe[5387]='Ladan`la\'-dan (la\'dan, the King James Version, Laadan):<P>(1) A descendant of Ephraim, and an ancestor of Joshua (<a onClick="return mV(\'1Ch\',7,26);">1Ch 7:26</a>).<P>(2) A Levite of the family of Gershon (<a onClick="return mV(\'1Ch\',23,7,8,9);">1Ch 23:7,8,9</a>; <a onClick="return mV(\'1Ch\',26,21);">26:21</a>), also called <a href="./study/isbe/search.html?string=LIBNI">LIBNI</A> (which see).``1';
isbe[5388]='Ladanum`lad\'-a-num (loT): <a onClick="return mV(\'Gen\',37,25);">Ge 37:25</a> the Revised Version margin; elsewhere <a href="./study/isbe/search.html?string=MYRRH">MYRRH</A> (which see).``1';
isbe[5389]='Ladder`lad\'-er.`<a href="./study/isbe/search.html?string=SIEGE">SIEGE</a>`1';
isbe[5390]='Ladder of Tyre`(He klimax (apo tes klimakos) Turou): Not mentioned in the Old Testament or the New Testament, but in Apocrypha (1Macc 11:59), where it is said that Antiochus VI, after having confirmed Jonathan in the high-priesthood, appointed his brother Simon captain over the territory included between the Ladder of Tyre and the borders of Egypt. The Ladder has been located at different points on the coast between Tyre and Acre, such as the Ras el-\'Abyadh ("Promontorium Album" of the ancient geographers), about 7 miles south of Tyre, and Ras en-Naqurah, about 6 miles farther south, and Ras el-Musheirifeh, a little farther on. These are capes jutting westward into the sea from the ridge which runs parallel to the general line of the coast. These capes project more than a mile into the sea, and present a very bold and precipitous front from 200 to 300 ft. in height. The ascent on either side of the promontory is very steep, and at Ras el-\'Abyadh steps were cut in the white rock, which led to the identification of this point with the Ladder, but a reference to Josephus (B J, II, x, 2) leads to a different conclusion. He locates it 100 stadia north of Acre, which corresponds fairly well with the southern limit of the whole promontory, which is about 12 miles north of Acre, but not at all with Ras el-\'Abyadh. The altitude of el Musheirifeh is greater than that of el-\'Abyadh and may have had steps cut in it similar to the latter. It is more probable that the Ladder of Tyre was here, or at en-Naqurah, but the term applied to the whole promontory, which offered a serious obstacle to the passage of armies, or even caravans, since the approach is precipitous on either side, and at Ras el-\'Abyadh the road skirts the edge of a sheer precipice, where a misstep would hurl one into the sea some 200 ft. below. The application of the term to the whole promontory seems to be indicated by Josephus, since he speaks of it as one of the mountains which encompass the plain of Ptolemais (Acre) and the highest of all. This would not be true of any one of the three capes mentioned, but would be if the hills behind, which form their base, were included. That it was designated as the Ladder of Tyre rather than of Acre was probably due to the fact that the promontory is nearer the former city (see Thomson, LB, II, edition 1882; SWP, name-lists, under the word).``138';
isbe[5391]='Lade; Lading`lad, lad\'-ing: "To lade" in the sense of "to load" is retained by the Revised Version (British and American) in nearly all passages where the word occurs in the King James Version (but compare the King James Version and the Revised Version (British and American) reading of <a onClick="return mV(\'Psa\',68,19);">Ps 68:19</a>; <a onClick="return mV(\'Isa\',46,1);">Isa 46:1</a>), "They laded us with such things" (<a onClick="return mV(\'Act\',28,10);">Ac 28:10</a> the King James Version). The epithithemi, "to put on," is rendered by the Revised Version (British and American), "They put on board such things." <a onClick="return mV(\'Luk\',11,46);">Lu 11:46</a> the Revised Version (British and American) reads "ye load" instead of the King James Version "ye lade."<P>Lading (phortion) is found in <a onClick="return mV(\'Act\',27,10);">Ac 27:10</a> in its usual meaning, "the lading of a ship."``1';
isbe[5392]='Lady`la\'-di: This word should be taken in the sense of "mistress" in <a onClick="return mV(\'Isa\',47,5,7);">Isa 47:5,7</a> (Hebrew gebhereth) (so the American Standard Revised Version). In <a onClick="return mV(\'Jdg\',5,29);">Jud 5:29</a>; <a onClick="return mV(\'Est\',1,18);">Est 1:18</A> it is the translation of another Hebrew word (sarah), best rendered "princess" (so the Revised Version (British and American) in Esther, but not in Judges). In  <a onClick="return mV(\'2Jo\',1,1,5);">2Joh 1:1,5</a> it is the translation of kuria, which some interpreters regard as a proper name.`<a href="./study/isbe/search.html?string=CYRIA">CYRIA</a>; <a href="./study/isbe/search.html?string=JOHN,+THE+EPISTLES+OF">JOHN, THE EPISTLES OF</a>; <a href="./study/isbe/search.html?string=ELECT+LADY">ELECT LADY</a>`1';
isbe[5393]='Lael`la\'-el (la\'el, "belonging to God"): Father of Eliasaph, the prince of the father\'s house of the Gershonites (<a onClick="return mV(\'Num\',3,24);">Nu 3:24</a>).``1';
isbe[5394]='Lahad`la\'-had (lahaah): A descendant of Judah (<a onClick="return mV(\'1Ch\',4,2);">1Ch 4:2</a>).``1';
isbe[5395]='Lahai-Roi`la-hi\'-roi, la-hi-ro\'-i, la\'hi-roi (lachay ro\'i).`<a href="./study/isbe/search.html?string=BEER-LAHAI-ROI">BEER-LAHAI-ROI</a>`1';
isbe[5396]='Lahmam`la\'-mam (lachmam): A town in the Judean Shephelah (<a onClick="return mV(\'Jos\',15,40);">Jos 15:40</a>, the Revised Version margin "Lahmas") possibly the modern el-Lachm, 2 1/2 miles south of Beit Jibrin.``1';
isbe[5397]='Lahmas`la\'-mas.`<a href="./study/isbe/search.html?string=LAHMAM">LAHMAM</a>`1';
isbe[5398]='Lahmi`la\'-mi (lachmi): According to <a onClick="return mV(\'1Ch\',20,5);">1Ch 20:5</a>, the brother of Goliath of Gath.`<a href="./study/isbe/search.html?string=ELHANAN">ELHANAN</a>`1';
isbe[5399]='Laish`la\'-ish (layish):<P>(1) A city in the upper Jordan valley, apparently colonized by the Sidonians, which was captured by the Danires and called <a href="./study/isbe/search.html?string=DAN">DAN</A> (which see) (<a onClick="return mV(\'Jdg\',18,7);">Jud 18:7</a>, etc.; <a onClick="return mV(\'Isa\',10,30);">Isa 10:30</a> the King James Version). In <a onClick="return mV(\'Jos\',19,47);">Jos 19:47</a> the name appears as "Leshem."<P>(2) A Benjamite, father of Palti or Paltiel, to whom Michal, David\'s wife, was given by Saul (<a onClick="return mV(\'1Sa\',25,44);">1Sa 25:44</a>; <a onClick="return mV(\'2Sa\',3,15);">2Sa 3:15</a>).``1';
isbe[5400]='Laishah`la-i\'-sha, la\'-ish-a (layshah, the King James Version, Laish): A place named in <a onClick="return mV(\'Isa\',10,30);">Isa 10:30</a> with Gallim and Anathoth. It should apparently be sought on the north of Jerusalem. Some would identify Gallim with Beit Jala, near Bethlehem. Conder suggests \'Isawiyeh on the eastern slope, to the north-northeast of the Mount of Olives.``1';
