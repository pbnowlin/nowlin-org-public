f His activity is described in the following terms, "And it came to pass soon afterwards, that he went about through cities and villages, preaching and bringing the good tidings of the kingdom of God, and with him the twelve." When the Twelve are sent forth by themselves, the purpose of their mission is, in <a onClick="return mV(\'Luk\',9,2);">Lu 9:2</a>, given in these words, "And he sent them forth to preach the kingdom of God, and to heal the sick." In <a onClick="return mV(\'Mat\',13,11);">Mt 13:11</a>, the parables, which formed so large and prominent a portion of His teaching, are denominated collectively "the mysteries of the kingdom of heaven"; and it will be remembered how many of these commence with the phrase, "The kingdom of heaven is like."<P>2. "Kingdom of Heaven" and "Kingdom of God":<P>In these quotations, and in others which might easily be adduced, it will be observed that the phrases "the kingdom," "the kingdom of God," "the kingdom of heaven" are used interchangeably. The last of the three, "the kingdom of heaven," is confined to the First Gospel, which does not, however, always make use of it; and it is not certain what may have been the reason for the substitution. The simplest explanation would be that heaven is a name for God, as, in the parable of the Prodigal Son, the penitent says, "I have sinned against heaven," and we ourselves might say, "Heaven forbid!" It is not, however, improbable that the true meaning has to be learned from two petitions of the Lord\'s Prayer, the one of which is epexegetic of the other, "Thy kingdom come. Thy will be done on earth, as it is in heaven." Here the disciples are instructed to pray that the kingdom of God may come, but this is equivalent to the petition that the will of God may be done on earth; Jesus is, however, aware of a region in the universe where the will of God is at present being perfectly and universally done, and, for reasons not difficult to surmise, He elevates thither the minds and hearts of those who pray. The kingdom of heaven would thus be so entitled because it is already realized there, and is, through prayer and effort, to be transferred thence to this earth.<P>3. Relation to the Old Testament (Daniel, etc.):<P>Although, however, the phrase held this master position in the teaching of Jesus, it was not of His invention. It was employed before Him by John the Baptist, of whom we read, in <a onClick="return mV(\'Mat\',3,1);">Mt 3:1</a>f; "And in those days cometh John the Baptist, preaching in the wilderness of Judea, saying, Repent ye; for the kingdom of heaven is at hand." Indeed, the phrase is far older; for, on glancing toward the Old Testament, we come at once, in <a onClick="return mV(\'Dan\',2,44);">Da 2:44</a>, to a passage where the young prophet, explaining to the monarch the image of gold, silver, iron and clay, which, in his dream, he had seen shattered by "a stone cut out without hands," interprets it as a succession of world-kingdoms, destined to be destroyed by "a kingdom of God," which shall last forever; and, in his famous vision of the "son of man" in <a onClick="return mV(\'Dan\',7,14);">7:14</a>, it is said, "There was given him dominion, and glory, and a kingdom, that all the peoples, nations, and languages should serve him: his dominion is an everlasting dominion, which shall not pass away, and his kingdom that which shall not be destroyed."<P>These passages in Daniel form undoubtedly the proximate source of the phrase; yet the idea which it represents mounts far higher. From the first the Jewish state was governed by laws believed to be derived directly from heaven; and, when the people demanded a king, that they might be like other nations, they were reproached for desiring any king but God Himself. With this sublime conception the actual monarchy was only a compromise, the reigning monarch passing for Yahweh\'s representative on earth. In David, the man after God\'s own heart, the compromise was not unsatisfactory; in Solomon it was still tolerable; but in the majority of the kings of both Judah and Israel it was a dismal and disastrous failure. No wonder that the pious sighed and prayed that Yahweh might take to Himself His great power and reign, or that the prophets predicted the coming of a ruler who would be far nearer to God than the actual kings and of whose reign there would be no end. Even when the political kingdom perished and the people were carried away into Babylon, the intelligent and truly religious among them did not cease to cherish the old hope, and the very aspect of the worldpowers then and subsequently menacing them only widened their conceptions of what that kingdom must be which could overcome them all. The return from Babylon seemed a miraculous confirmation of their faith, and it looked as if the day long prayed for were about to dawn. Alas, it proved a day of small things. The era of the Maccabees was only a transitory gleam; in the person of Herod the Great a usurper occupied the throne; and the eagles of the Romans were hovering on the horizon. Still Messianic hopes flourished, and Messianic language filled the mouths of the people.<P>II. Its Use by Jesus—Contrast with Jewish Conceptions.<P>1. Current Jewish Opinions:<P>Schurer, in his History of the Jewish People in the Time of Jesus Christ (II,11,126ff), has drawn up a kind of Messianic creed, in no fewer than eleven articles, which he believes was extensively diffused at this period. The Sadducees, indeed, had no participation in these dreams, as they would have called them, being absorbed in money-making and courtiership; but the Pharisees cherished them, and the Zealots received their name from the ardor with which they embraced them. The true custodians, however, of these conceptions were the Prosdechomenoi, as they have been called, from what is said of them in the New Testament, that they "waited for the kingdom of God." To this class belonged such men as Nicodemus and Joseph of Arimathea (<a onClick="return mV(\'Luk\',23,51);">Lu 23:51</a>), but it is in the beginning of the Gospel of Luke that we are introduced to its most numerous representatives, in the groups surrounding the infant Baptist and the infant Saviour (<a onClick="return mV(\'Luk\',2,25,38);">Lu 2:25,38</a>); and the truest and amplest expression of their sentiments must be sought in the inspired hymns which rose from them on this occasion. The center of their aspirations, as there depicted, is a kingdom of God—not, however, of worldly splendor and force, but of righteousness and peace and joy in the Holy Spirit; beginning in humility, and passing to exaltation only through the dark valley of contrition.<P>2. Relation of Jesus to Same:<P>Such was the circle in which both the Baptist and Jesus were reared and it was out of this atmosphere that the conception of the kingdom of God came into their minds. It has frequently been said that, in making use of this term, Jesus accommodated Himself to the opinions and language of His fellow-countrymen; and there is truth in this, because, in order to secure a footing on the solid earth of history, He had to connect His own activity with the world in which He found Himself. Yet the idea was native to His home and His race, and therefore to Himself; and it is not improbable that He may at first have been unaware of the wide difference between His own thoughts on the subject and those of His contemporaries.<P>3. Growing Divergence and Contrast:<P>When, however, He began, in the course of His ministry, to speak of the kingdom of God, it soon became manifest that by Him and by His contemporaries it was used in different senses; and this contrast went on increasing until there was a great gulf fixed between Him and them. The difference cannot better be expressed than by saying, as is done by B. Weiss, that He and they laid the accent on different halves of the phrase, they emphasizing "the kingdom" and He "of God." They were thinking of the expulsion of the Romans, of a Jewish king and court, and of a world-wide dominion going forth from Mt. Zion; He was thinking of righteousness, holiness and peace, of the doing of the will of God on earth as it is done in heaven. So earthly and fantastic were the expectations of the Jewish multitude that He had to escape from their hands when they tried to take Him by force and make Him a king. The authorities never acknowledged the pretensions of One who seemed to them a religious dreamer, and, as they clung to their own conceptions, they grew more and more bitter against One who was turning the most cherished hopes of a nation into ridicule, besides threatening to bring down on them the heavy hand of the Roman. And at last they settled the controversy between Him and them by nailing Him to a tree.<P>4. Prophetic Character of the "Temptation":<P>At one time Jesus had felt the glamor of the popular Messianic ideas, and at all times He must have been under temptation to accommodate His own ideas to the prejudices of those on whose favor His success seemed to be dependent. The struggle of His mind and will with such solicitations is embodied in what is called the Temptation in the Wilderness (<a onClick="return mV(\'Mat\',4,\'1-11\');">Mt 4:1-11</a>). There He was tempted to accept the dominion of the world at the price of compromise with evil; to be a bread-king, giving panem et circenes; and to curry favor with the multitude by some display, like springing from the pinnacle of the temple. The incidents of this scene look like representative samples of a long experience; but they are placed before the commencement of His public activity in order to show that He had already overcome them; and throughout His ministry He may be said to have been continually declaring, as He did in so many words at its close, that His kingdom was not of this world.<P>5. Modern "Futuristic" Hypothesis (J. Weiss, Schweitzer):<P>It is very strange that, in spite of this, He should be believed, even by Christian scholars, to have held a purely futuristic and apocalyptic view of the kingdom Himself. He was all the time expecting, it is said, that the heavens would open and the kingdom descend from heaven to earth, a pure and perfect work of God. This is exactly what was expected by the Jewish multitude, as is stated in <a onClick="return mV(\'Luk\',19,11);">Lu 19:11</a>; and it is precisely what the authorities believed Him to be anticipating. The controversy between Him and them was as to whether Yahweh would intervene on His behalf or not; and, when no intervention took place, they believed they were justified in condemning Him. The premises being conceded, it is difficult to deny the force of their argument. If Jesus was all the time looking out for an appearance from heaven which never arrived, what better was He than a dreamer of the ghetto?<P>6. Weakness of This View:<P>It was by Johannes Weiss that this hypothesis was started in recent times; and it has been worked out by Schweitzer as the final issue of modern speculation on the life of Christ (see his The Quest of the Historical Jesus). But in opposition to it can be quoted not a few sayings of Jesus which indicate that, in His view, the kingdom of God had already begun and was making progress during His earthly ministry, and that it was destined to make progress not by catastrophic and apocalyptic interference with the course of Providence, but, as the grain grows—first the blade, then the ear, after that the full grain in the ear (<a onClick="return mV(\'Mar\',4,\'26-29\');">Mr 4:26-29</a>). Of such sayings the most remarkable is <a onClick="return mV(\'Luk\',17,20);">Lu 17:20</a>f; "And being asked by the Pharisees, when the kingdom of God cometh, he answered them and said, The kingdom of God cometh not with observation: neither shall they say, Lo, here! or, There! for lo, the kingdom of God is within you." "Observation," in this quotation, is an astronomical term, denoting exactly such a manifestation in the physical heavens as Jesus is assumed to have been looking for; so that He denies in so many words the expectation attributed to Him by those representatives of modern scholarship.<P>7. Positive Conceptions of Jesus:<P>In the nature of the case the kingdom must have been growing from stage to stage during His earthly ministry. He Himself was there, embodying the kingdom in His person; and the circle gathered around Him partook of the blessings of the kingdom. This circle might have grown large enough to be coextensive with the country; and, therefore, Jesus retained the consciousness of being the Messiah, and offered Himself in this character to His fellow-countrymen by the triumphal entry into Jerusalem. But the citizens of the kingdom had to enter it one by one, not in a body, as the Jews were expecting. Strait was the gate; it was the narrow gate of repentance. Jesus began by repeating the initial word of the teaching of His forerunner; and He had too much reason to continue repeating it, as the hypocrisy and worldliness of Pharisees and Sadducees called for denunciation from His lips. To the frailties of the publicans and sinners, on the contrary, He showed a strange mildness; but this was because He knew the way of bringing such sinners to His feet to confess their sins themselves. To the penitent He granted pardon, claiming that the Son of man had power on earth to forgive sins. Then followed the exposition of righteousness, of which the Sermon on the Mount is a perfect specimen. Yet it commences with another watchword—that of blessedness, the ingredients of which are set forth in all their comprehensiveness. In the same way, in other passages, He promises "rest" "peace" and the like; and again and again, where He might be expected to employ the term "kingdom of God," He substitutes "life" or "eternal life." Such were the blessings He had come into the world to bestow; and the most comprehensive designation for them all was "the kingdom of God."<P>It is true, there was always imperfection attaching to the kingdom as realized in His lifetime, because He Himself was not yet made perfect. Steadily, from the commencement of the last stage of His career, He began to speak of His own dying and rising again. To those nearest Him such language was at the time a total mystery; but the day came when His apostles were able to speak of His death and ascension as the crown and glory of His whole career. When His life seemed to be plunging over the precipice, its course was so diverted by the providence of God that, by dying, He became the Redeemer of mankind and, by missing the throne of the Jews, attained to that of the universe, becoming King of kings and Lord of lords.<P>III. The Idea in History.<P>1. Apostolic and Post-apostolic Age:<P>After the death of Jesus, there soon ensued the destruction of the Jewish state; and then Christianity went forth among the nations, where to have spoken of it as a kingdom of God would have unnecessarily provoked hostility and called forth the accusation of treason against the powers that be. Hence, it made use of other names and let "the kingdom of God" drop. This had commenced even in Holy Scripture, where, in the later books, there is a growing infrequency in the use of the term. This may be alleged as proof that Jesus was being forgotten; but it may only prove that Christianity was then too much alive to be trammeled with words and phrases, even those of the Master, being able at every stage to find new language to express its new experience.<P>2. Early Christian Centuries:<P>In the early Christian centuries, "the kingdom of God" was used to designate heaven itself, in which from the first the development of the kingdom was to issue; this, in fact, being not infrequently the meaning of the phrase even in the mouth of Jesus. The Alexandrian thinkers brought back the phrase to designate the rule of God in the conscience of men. Augustine\'s great work bears a title, De Civitate Dei, which is a translation of our phrase; and to him the kingdom of God was the church, while the world outside of the church was the kingdom of Satan. From the time of Charlemagne there were in the world, side by side, two powers, that of the emperor and that of the pope; and the history of the Middle Ages is the account of the conflict of these two for predominance, each pretending to struggle in the name of God. The approaching termination of this conflict may be seen in Wycliffe\'s great work De Dominio Divino, this title also being a translation of our phrase.<P>3. Reformation Period:<P>During the struggles of the Reformation the battles of the faith were fought out under other watchwords; and it was rather amongsuch sectaries as the Baptists, that names like Fifth Monarchy and Rule of the Saints betrayed recollection of the evangelic phraseology; but how near, then and subsequently, the expression of men\'s thoughts about authority in church and state came to the language of the Gospels could easily be demonstrated, for example, from the Confessions and Books of Discipline of the Scottish church.<P>4. Later Ideas:<P>The very phrase, "the kingdom of God," reappeared at the close of the Reformation period among the Pietists of Germany, who, as their multiplying benevolent and missionary activities overflowed the narrow boundaries of the church, as it was then understood, spoke of themselves as working for the kingdom of God, and found this more to their taste than working for the church. The vague and humanitarian aspirations of Rationalism sometimes assumed to themselves the same title; but it was by Ritschl and his followers that the phrase was brought back into the very heart of theology. In the system of Ritschl there are two poles—the love of God and the kingdom of God. The love of God enfolds within itself God\'s purpose for the world, to be realized in time; and this progressive realization is the kingdom of God. It fulfils itself especially in the faithful discharge of the duties of everyone\'s daily vocation and in the recognition that in the course of Providence all things are working together for good to them that love God.<P>IV. Place in Theology.<P>1. Danger of Exageration:<P>There are those to whom it appears self-evident that what was the leading phrase in the teaching of Jesus must always be the master-word in theology; while others think this to be a return from the spirit to the letter. Even Jesus, it may be claimed, had this phrase imposed upon Him quite as much as He chose it for Himself; and to impose it now on theology would be to entangle the movements of Christian thought with the cerements of the dead.<P>2. Elements of Living Power in Idea:<P>This is an interesting controversy, on both sides of which much might be said. But in the phrase "the kingdom of God" there are elements of living power which can never pass away.<P>(1) It expresses the social Power inside of Christianity. A kingdom implies multitude and variety, and, though religion begins with the individual, it must aim at brotherhood, organization and expansion.<P>(2) It expresses loyalty. However much kings and kingdoms may fail to touch the imagination in an age of the world when many countries have become or are becoming republican, the strength to conquer and to endure will always have to be derived from contact with personalities. God is the king of the kingdom of God, and the Son of God is His vicegerent; and without the love of God the Father and the grace of the Lord Jesus Christ no progress can be made with the Christianization of the world.<P>(3) It keeps alive the truth, suggested by Jesus in the Lord\'s Prayer, that the doing of the will of God on earth is the one thing needful. This is the true end of all authority in both church and state, and behind all efforts thus directed there is at work the potency of heaven.<P>(4) It reminds all generations of men that their true home and destiny is heaven. In not a few of our Lord\'s own sayings, as has been remarked, our phrase is obviously only a name for heaven; and, while His aim was that the kingdom should be established on earth, He always promised to those aiding in its establishment in this world that their efforts would be rewarded in the world to come. The constant recognition of a spiritual and eternal world is one of the unfailing marks of genuine Christianity.<P>LITERATURE.<P>See the works on New Testament Theology by Weiss, Beyschlag, Holtzmann, Feine, Schlatter, Weinel, Stevens, Sheldon; and on the Teaching of Jesus by Wendt, Dalman, Bruce; Candlish, The Kingdom of God; Robertson, Regnum Dei; Stalker, The Ethic of Jesus.``163';

isbe[5326]='Kings, Books of`<b>I. TITLE</b><P><b>II. SCOPE</b><P><b>III. CHARACTER OF BOOKS AND POSITION IN THE HEBREW CANON</b><P class="in15">1. Purpose<P class="in15">2. Character of Data<P><b>IV. HISTORICAL VALUE</b><P class="in15">1. Treatment of Historical Data<P class="in15">2. Chronology<P class="in15">3. Value of Assyrian Records<P class="in15">4. Plan<P><b>V. COMPOSITION</b><P class="in15">1. Nature of the Books<P class="in15">2. Sources<P class="in15">3. Kent\'s Scheme<P class="in15">4. The Jahwist (Jahwist) and the Elohist (E)<P><b>VI. DATE</b><P><b>LITERATURE</b><hr /><P>I. Title.<P>The Hebrew title reads, melakhim, "kings," the division into books being based on the Septuagint where the Books of Kings are numbered 3rd and 4th, the Books of Kingdoms (Basileion), the Books of Samuel being numbered respectively 1st and 2nd. The separation in the Hebrew into 2 Books of Kings dates to the rabbinic Bible of Daniel Bomberg (Venice, 1516-17), who adds in a footnote, "Here the non-Jews (i.e. Christians) begin the 4th Book of Kings." The Hebrew Canon treats the 2 Books of Samuel as one book, and the 2 Books of Kings as one. Hence, both the King James Version and the Revised Version (British and American) read incorrectly, "The First Book of Kings," even the use of the article being superfluous.<P>II. Scope.<P>The Books of Kings contain 47 chapters (I, 22 chs; II, 25 chs), and cover the period from the conspiracy of Adonijah and the accession of Solomon (975 BC) to the liberation of Jehoiachin after the beginning of the Exile (561 BC). The subject-matter may be grouped under certain heads, as the last days of David (<a onClick="return mV(\'1Ki\',1,\'1-\');">1Ki 1</a>-<a onClick="return mV(\'1Ki\',1,\'1-11\');">2:11</a>); Solomon and his times (<a onClick="return mV(\'1Ki\',2,12);">1Ki 2:12-11:43</a>); the Northern Kingdom to the coming of Assyria (<a onClick="return mV(\'1Ki\',12,16);">1Ki 12:16-2Ki 17:41</a>) (937-722 BC), including 9 dynastic changes; the Southern Kingdom to the coming of Babylon (<a onClick="return mV(\'1Ki\',12,1);">1Ki 12:1-2Ki 25:21</a>, the annals of the two kingdoms being given as parallel records until the fall of Israel) (937-586 BC), during which time but one dynasty, that of David, occupied the throne; the period of exile to 561 BC (<a onClick="return mV(\'2Ki\',25,\'22-30\');">2Ki 25:22-30</a>). A simpler outline, that of Driver, would be:<P>(1) Solomon and his times (<a onClick="return mV(\'1Ki\',1,\'1-11\');">1Ki 1-11</a>);<P>(2) Israel and Judah to the fall of Israel (<a onClick="return mV(\'1Ki\',12,\'1-\');">1Ki 12-2Ki 17</a>); Judah to the fall of Jerusalem (586 BC), and the captivity to the liberation of Jehoiachin (561 BC) (<a onClick="return mV(\'2Ki\',18,\'1-\');">2Ki 18-25</a>).<P>"Above all, there are three features in the history, which, in the mind of the author, are of prime importance as shown by the prominence he gives them in his narrative.<P>(1) The dynasty of David is invested with peculiar dignity. This had two aspects. It pointed back to the Divine election of the nation in the past, and gave the guaranty of indefinite national perpetuity in the future. The promise of the \'sure mercies of David\' was a powerful uniting influence in the Exile.<P>(2) The Temple and its service, for which the writer had such special regard, contributed greatly to the phase of national character of subsequent times. With all the drawbacks and defacements of pure worship here was the stated regular performance of sacred rites, the development and regulation of priestly order and ritual law, which stamped themselves so firmly on later Judaism.<P>(3) Above all, this was the period of bloom of Old Testament prophecy. Though more is said of men like Elijah and Elisha, who have left no written words, we must not forget the desires of pre-exilic prophets, whose writings have come down to us—men who, against the opposition of rulers and the indifference of the people, testified to the moral foundation on which the nation was constituted, vindicated Divine righteousness, rebuked sin, and held up the ideal to which the nation was called."—Robertson, Temple B D, 369 f.<P>III. Character of Books and Position in Hebrew Canon.<P>The Books of Kings contain much historical material, yet the historical is not their primary purpose. What in our English Bibles pass for historical books are in the Hebrew Canon prophetic books, the Books of Joshua, Judges, 1 Samuel, 2 Samuel, 1 Kings and 2 Kings being classed as the "Earlier Prophets."<P>1. Purpose:<P>The chief aim of these books is didactic, the imparting of great moral lessons backed up by well-known illustrations from the nation\'s history and from the lives of its heroes and leaders. Accordingly, we have here a sort of historical archipelago, more continuous than in the Pentateuch, yet requiring much bridging over and conjecture in the details.<P>2. Character of Data:<P>The historical matter includes, in the case of the kings of Israel, the length of the reign and the death; in the case of the kings of Judah there are included also the age at the date of accession, the name of the mother, and mention of the burial. The beginnings of the reigns in each case are dated from a point in the reign of the contemporary ruler, e.g. <a onClick="return mV(\'1Ki\',15,1);">1Ki 15:1</a>: "Now in the 18th year of king Jeroboam the son of Nebat began Abijam to reign over Judah."<P>IV. Historical Value.<P>1. Treatment of Historical Data:<P>These books contain a large amount of authentic data, and, along with the other books of this group which constitute a contemporaneous narrative, Joshua, Judges, 1 Samuel, 2 Samuel, must be accorded high rank among ancient documents. To be sure the ethical and religious value is first and highest, nevertheless the historical facts must be reckoned at their true worth. Discrepancies and contradictions are to be explained by the subordination of historical details to the moral and religious purpose of the books, and to the diversity of sources whence these data are taken, that is, the compilers and editors of the Books of Kings as they now stand were working not for a consistent, continuous historical narrative, but for a great ethical and religious treatise. The historical material is only incidental and introduced by way of illustration and confirmation. For the oriental mind these historical examples rather than the rigor of modern logic constitute the unanswerable argument.<P>2. Chronology:<P>There cannot be as much said relative to the chronological value of the books. Thus, e.g., there is a question as to the date of the close of Ahaz\' reign. According to <a onClick="return mV(\'2Ki\',18,10);">2Ki 18:10</a>, Samaria fell in the 6th year of Hezekiah\'s reign. The kings who followed Hezekiah aggregate 110 years; 586 plus 110 plus 29 (Hezekiah, <a onClick="return mV(\'2Ki\',18,2);">2Ki 18:2</a>) = 725. But in <a onClick="return mV(\'2Ki\',18,13);">2Ki 18:13</a> we learn that Sennacherib\'s invasion came in the 14th year of Hezekiah\'s reign. Then 701 plus 14 = 715. With this last agrees the account of Hezekiah\'s sickness (<a onClick="return mV(\'2Ki\',20,\'1-\');">2Ki 20</a>). In explanation of <a onClick="return mV(\'2Ki\',18,13);">2Ki 18:13</a>, however, it is urged by some that the writer has subtracted the 15 years of <a onClick="return mV(\'2Ki\',20,6);">2Ki 20:6</a> from the 29 years of Hezekiah\'s reign. Again, e.g. in <a onClick="return mV(\'1Ki\',6,1);">1Ki 6:1</a>, we learn that Solomon began to build the temple 480 years "after the children of Israel were come out of the Land of Egypt" Septuagint here reads 440 years). This would make between Moses and David 12 generations of 40 years each. But counting the Exodus in the reign of Merenptah, 1225-1215 BC, and the beginning of the erection of the temple 975 BC, or after, we could not make out more than (1225-975) 250 years. Further, if the total length of reigns in Israel and Judah as recorded in the parallel accounts of Kings be added for the two kingdoms, the two amounts do not agree. And, again, it is not certain whether in their annals the Hebrews predated or post-dated the reigns of their kings, i.e. whether the year of a king\'s death was counted his last year and the first year of his successor\'s reign, or whether the following year was counted the first year of the succeeding king (compare Curtis in H D B, I, 400,1,f; Marti in E B, I, coll. 777ff).<P>3. Value of Assyrian Records:<P>The Babylonians and Assyrians were more skilled and more careful chronologers, and it is by reference to their accounts of the same or of contemporary events that a sure footing is found. Hence, the value of such monuments as those of Shalmaneser IV and Sennacherib—and here mention should be made also of the Moabite Stone.<P>4. Plan:<P>The plan of the books is prevailingly chronological, although at times the material is arranged in groups (e.g. <a onClick="return mV(\'2Ki\',2,\'1-\');">2Ki 2:1-8:15</a>, the Elisha stories).<P>V. Composition.<P>1. Nature of the Books:<P>The Books of Kings are of the nature of a compilation. The compiler has furnished a framework into which he has arranged the historical matter drawn from other sources. There are chronological data, citations of authorities, judgments on the character and deeds of the several rulers, and moral and religious teachings drawn from the attitude of the rulers in matters of religion, especially toward heathen cults. The point of view is that of the prophets of the national party as one against foreign influence. "Both in point of view and in phraseology the compiler shows himself to be strongly influenced by Deuteronomy." (The principal editor is styled RD, i.e. Deuteronomic Redactor.) The Deuteronomic law was the touchstone, and by his loyalty to, or apostasy from, that standard, each king stands approved or condemned. This influence also appears in passages where the editor takes liberties in the expansion and adaptation of material. There is marked recurrence of phrases occurring elsewhere chiefly or even wholly in Deuteronomy, or in books showing Deuteronomic influence (Burney in H D B, II, 859f). In <a onClick="return mV(\'2Ki\',17,\'1-\');">2Ki 17</a> we have a test of the nation on the same standards; compare also <a onClick="return mV(\'1Ki\',2,3);">1Ki 2:3</a>f; <a onClick="return mV(\'1Ki\',9,\'1-9\');">9:1-9</a>; <a onClick="return mV(\'2Ki\',14,6);">2Ki 14:6</a>; <a onClick="return mV(\'Deu\',24,16);">De 24:16</a>.<P>2. Sources:<P>In numerous instances the sources are indicated, as "the book of the acts of Solomon" (<a onClick="return mV(\'1Ki\',11,41);">1Ki 11:41</a>), "the chronicles of the kings of Judah" (<a onClick="return mV(\'1Ki\',14,29);">1Ki 14:29</a>), "the chronicles of the kings of Israel" (<a onClick="return mV(\'1Ki\',15,31);">1Ki 15:31</a>). A score or more of these sources are mentioned by title in the several books of the Old Testament. Thus "the history of Samuel the seer," "the history of Nathan the prophet." "the history of Gad the seer" (<a onClick="return mV(\'1Ch\',29,29);">1Ch 29:29</a>); "the prophecy of Ahijah the Shilonite," "the visions of Iddo the seer concerning Jeroboam the son of Nebat" (<a onClick="return mV(\'2Ch\',9,29);">2Ch 9:29</a>; compare <a onClick="return mV(\'2Ch\',12,15);">2Ch 12:15</a>; <a onClick="return mV(\'2Ch\',13,22);">13:22</a>; <a onClick="return mV(\'2Ch\',20,34);">20:34</a>; <a onClick="return mV(\'2Ch\',32,32);">32:32</a>). Thus the "book of the kings of Israel" is mentioned 17 times (for all kings except Jehoram and Hoshea); the "book of the chronicles of the kings of Judah" is mentioned 15 times (for all except Ahaziah, Athaliah, Jehoahaz, Jehoiachin and Zedekiah). Whether the compiler had recourse to the archives themselves or to a work based on the archives is still a question.<P>3. Kent\'s Scheme:<P>Kent, Student\'s Old Testament (II, chart, and pp. ix-xxvi), gives the following scheme for showing the sources:<P>(1) Early stories about the Ark (circa 950 BC or earlier), Saul stories and David stories (950-900 BC) were united (circa 850 BC) to make early Judean Saul and David stories. With these last were combined (circa 600 BC) popular Judean David stories (circa 700 BC) later Ephraimite Samuel narratives (circa 650 BC), and very late popular prophetic traditions (650-600 BC) in a first edition of the Books of Samuel.<P>(2) Annals of Solomon (circa 950 BC), early temple records (950-900 BC), were united (circa 800 BC) with popular Solomon traditions (850-800 BC) in a "Book of the Acts of Solomon." A Jeroboam history (900-850 BC), an Ahab history (circa 800 BC), and a Jehu history (circa 750 BC) were united with the annals of Israel (after 950 to circa 700 BC) in the "Chronicles of the Kings of Israel" (700 or after). Early Ephraimite Elisha narratives (800-750 BC), influenced by a Samaria cycle of Elisha stories (750-700 BC) and a Gilgal cycle of Elisha stories (700-650 BC), were joined about 600 BC with the "Book of the Acts of Solomon" and the "Chronicles of the Kings of Israel" in a "first edition of the Books of Kings."<P>(3) The first edition of Samuel, the first edition of Kings and Isaiah stories (before 550 BC) were united (circa 550 BC) in a final revision of Samuel and Kings.<P>(4) From "annals of Judah" (before 900 to 650 BC or after), temple records (before 850 to after 650 BC), and a Hezekiah history (circa 650 BC), was drawn material for the "Chronicles of the kings of Judah" (circa 600 BC).<P>(5) From this last work and the final revision of Samuel and Kings was taken material for a "Midhrash of the Book of the Kings of Israel and Judah" (circa 300 BC), and from this work, the final revision of Samuel and Kings, and a possible temple history (after 400)—itself from the final revision of Samuel and Kings—came the Books of Chronciles (circa 250 BC).<P>4. The Jahwist (Jahwist) and the Elohist (E):<P>The distinctions between the great documents of the Pentateuch do not appear so clearly here. The summary, "epitome") is the work of a Jewish redactor; the longer narratives (e.g. <a onClick="return mV(\'1Ki\',17,\'1-\');">1Ki 17-2Ki 8</a>; <a onClick="return mV(\'1Ki\',13,\'14-21\');">13:14-21</A>) "are written in a bright and chaste Hebrew style, though some of them exhibit slight peculiarities of diction, due, doubtless (in part), to their Northern Israelite origin" (E). The writers of these narratives are thought to have been prophets, in most cases from the Northern Kingdom.<P>VI. Date.<P>There are numerous data bearing on the date of Kings, and indications of different dates appear in the books. The closing verses bring down the history to the 37th year of the Captivity (<a onClick="return mV(\'2Ki\',25,27);">2Ki 25:27</a>); yet the author, incorporating his materials, was apparently not careful to adjust the dates to his own time, as in <a onClick="return mV(\'1Ki\',8,8);">1Ki 8:8</a>; <a onClick="return mV(\'1Ki\',12,19);">12:19</a>; <a onClick="return mV(\'2Ki\',8,22);">2Ki 8:22</a>; <a onClick="return mV(\'2Ki\',16,6);">16:6</a>, which refer to conditions that passed away with the Exile. The work was probably composed before the fall of Jerusalem (586 BC), and was revised during or shortly after the Exile, and also supplemented by the addition of the account of the downfall of the Judean kingdom. There are traces of a post-exilic hand, as, e.g., the mention of "the cities of Samaria" (<a onClick="return mV(\'1Ki\',13,32);">1Ki 13:32</a>), implying that Samaria was a province, which was not the case until after the Exile. The existence of altars over the land (<a onClick="return mV(\'1Ki\',19,10);">1Ki 19:10</a>), and the sanctuary at Carmel, were illegal according to the Deuteronomic law, as also was the advice given to Elisha (<a onClick="return mV(\'2Ki\',3,19);">2Ki 3:19</a>) to cut down the fruit trees in time of war; (<a onClick="return mV(\'Deu\',20,19);">De 20:19</a>).<P>LITERATURE.<P>K. Budde, Das Buch der Richter, Mohr, Leipzig; John Skinner, "Kings," in New Century Bible, Frowde, New York; C.F. Burney, Notes on the Hebrew Text of the Books of Kings, Clarendon Press, Oxford; 1903; R. Kittel, Die Bucher der Konige, Vandenhoeck and Ruprecht, Leipzig, 1900; I. Benzinger, Die Bucher der Konige, Mohr, 1899; C.F. Kent, Student\'s Old Testament, Scribner, 1905; S.R. Driver, Introduction to the Literature of the Old Testament, Scribner, new revised edition, 1910; J.E. McFadyen, Introduction to the Old Testament, Armstrong, New York, 1906; Carl H. Cornill, Einleitung in die kanonischen Bucher Altes Testament, Mohr, 6th edition, 1908; A. F. Kirkpatrick, The Divine Library of the Old Testament, Macmillan, 1891.``164';
