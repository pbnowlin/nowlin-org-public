isbe[5301]='Kid`(1) gedhi (<a onClick="return mV(\'Exd\',23,19);">Ex 23:19</a>, etc.);<P>(2) feminine gedhiyah (<a onClick="return mV(\'Isa\',11,6);">Isa 11:6</a>, etc.);<P>(3) gedhi \'izzim, English Versions of the Bible "kid," literally, "kid of the goats," the King James Version margin (<a onClick="return mV(\'Jdg\',6,19);">Jud 6:19</a>, etc.);<P>(4) \'ez, literally, "goat" (<a onClick="return mV(\'Deu\',14,21);">De 14:21</a>; <a onClick="return mV(\'1Ki\',20,27);">1Ki 20:27</a>); .<P>(5) se\'ir \'izzim, the King James Version "kid of the goats," the Revised Version (British and American) "he-goat" (<a onClick="return mV(\'Gen\',37,31);">Ge 37:31</a>; <a onClick="return mV(\'Lev\',9,3);">Le 9:3</a>, etc.);<P>(6) eriphos (<a onClick="return mV(\'Luk\',15,29);">Lu 15:29</a>).`<a href="./study/isbe/search.html?string=GOAT">GOAT</a>`1';
isbe[5302]='Kidnapping (Manstealing)`kid\'-nap-ing The term itself occurs only in the New Testament andrapodistes = "manstealer") in <a onClick="return mV(\'1Ti\',1,10);">1Ti 1:10</a>. The crime was directly forbidden in the Hebrew law (<a onClick="return mV(\'Exd\',21,16);">Ex 21:16</a>; <a onClick="return mV(\'Deu\',24,7);">De 24:7</a>), and was made punishable with death.``1';
isbe[5303]='Kidneys`kid\'-niz (always in the plural: kelayoth; nephroi; Latin renes, whence the English "reins"): "Reins" and "kidneys" are synonyms, but the King James Version undertook a distinction by using the former word in the figurative, the latter in the literal passages. the English Revised Version has followed the King James Version exactly, but the American Standard Revised Version has retained "reins" only in <a onClick="return mV(\'Job\',16,13);">Job 16:13</a>; <a onClick="return mV(\'Lam\',3,13);">La 3:13</a>; <a onClick="return mV(\'Rev\',2,23);">Re 2:23</a>, elsewhere substituting "heart," except in <a onClick="return mV(\'Psa\',139,13);">Ps 139:13</a>, where "inward parts" is used. the King James Version and the English Revised Version also have "reins" for chalatsayim, in <a onClick="return mV(\'Isa\',11,5);">Isa 11:5</a> (the American Standard Revised Version "loins"). The physiological function of the kidneys is not referred to in the Bible, but has been introduced (quite wrongly) by the King James Version margin to <a onClick="return mV(\'Lev\',15,2);">Le 15:2</a>; <a onClick="return mV(\'Lev\',22,4);">22:4</a>.<P>(1) The kidneys owe their importance in the Bible partly to the fact that they are imbedded in fat, and fat of such purity that fat of the kidneys was a proverbial term for surpassing excellence (<a onClick="return mV(\'Deu\',32,14);">De 32:14</a> margin). For the visceral fat was the part of the animal best adapted for sacrificial burning, and hence, came to be deemed peculiarly sacred (<a onClick="return mV(\'Lev\',7,\'22-25\');">Le 7:22-25</a>; <a onClick="return mV(\'1Sa\',2,16);">1Sa 2:16</a>). Accordingly, the kidneys with the fat surrounding them were burned in every sacrifice in which the entire animal was not consumed, whether in peace (<a onClick="return mV(\'Lev\',3,4,10,15);">Le 3:4,10,15</a>; <a onClick="return mV(\'Lev\',9,19);">9:19</a>), sin (<a onClick="return mV(\'Exd\',29,13);">Ex 29:13</a>; <a onClick="return mV(\'Lev\',4,9);">Le 4:9</a>; <a onClick="return mV(\'Lev\',8,16);">8:16</a>; <a onClick="return mV(\'Lev\',9,10);">9:10</a>), or trespass, (<a onClick="return mV(\'Lev\',7,4);">Le 7:4</a>) offerings; compare the "ram of consecration" (<a onClick="return mV(\'Exd\',29,22);">Ex 29:22</a>; <a onClick="return mV(\'Lev\',8,25);">Le 8:25</a>). So in <a onClick="return mV(\'Isa\',34,6);">Isa 34:6</a>, "fat of the kidneys of rams" is chosen as a typical sacrificial term to parallel "blood of lambs and goats."<P>(2) The position of the kidneys in the body makes them particularly inaccessible, and in cutting up an animal they are the last organs to be reached. Consequently, they were a natural symbol for the most hidden part of a man (<a onClick="return mV(\'Psa\',139,13);">Ps 139:13</a>), and in <a onClick="return mV(\'Job\',16,13);">Job 16:13</a> to "cleave the reins asunder" is to effect the total destruction of the individual (compare <a onClick="return mV(\'Job\',19,27);">Job 19:27</a>; <a onClick="return mV(\'Lam\',3,13);">La 3:13</a>). This hidden location, coupled with the sacred sacrificial use, caused the kidneys to be thought of as the seat of the innermost moral (and emotional) impulses. So the reins instruct (<a onClick="return mV(\'Psa\',16,7);">Ps 16:7</a>) or are "pricked" (<a onClick="return mV(\'Psa\',73,21);">Ps 73:21</a>), and God can be said to be far from the reins of sinners (<a onClick="return mV(\'Jer\',12,2);">Jer 12:2</a>). In all of these passages "conscience" gives the exact meaning. So the reins rejoice (<a onClick="return mV(\'Pro\',23,16);">Pr 23:16</a>), cause torment (2Esdras 5:34), or tremble in wrath (1Macc 2:24). And to "know" or "try the reins" (usually joined with "the heart") is an essential power of God\'s, denoting His complete knowledge of the nature of every human being (<a onClick="return mV(\'Psa\',7,9);">Ps 7:9</a>; <a onClick="return mV(\'Psa\',26,2);">26:2</a>; <a onClick="return mV(\'Jer\',11,20);">Jer 11:20</a>; <a onClick="return mV(\'Jer\',17,10);">17:10</a>; <a onClick="return mV(\'Jer\',20,12);">20:12</a>; Wis 1:6; <a onClick="return mV(\'Rev\',2,23);">Re 2:23</a>). See <a href="./study/isbe/search.html?string=FAT">FAT</a>; <a href="./study/isbe/search.html?string=PSYCHOLOGY">PSYCHOLOGY</a>; <a href="./study/isbe/search.html?string=SACRIFICE">SACRIFICE</a>. Compare RS2, 379-80, and for Greek sacrificial parallels Journal of Philology, XIX (1890), 46. The anatomical relations are well exhibited in the plate in Sacred Books of the Old Testament, "Leviticus."``48';
isbe[5304]='Kidron`kid\'-ron (Kedron; the King James Version Cedron): A place which, in obedience to Antiochus Sidetes, Cendebaeus fortified (1Macc 15:39ff), to which, when defeated, he fled, hotly pursued by John and Judas, sons of Simon the Maccabee, who burned the city (1Macc 16:4ff). It is named along with Jamnia (Yebna) and Azotus (Esdud). It is possibly identical with Katrah], a village about 3 miles southwest of \'Aqir (Ekron).``1';
isbe[5305]='Kidron, the Brook`(nachal qidhron; in <a onClick="return mV(\'Jhn\',18,1);">Joh 18:1</a> (the King James Version Cedron), ho cheimarrhous ton Kedron, according to the Revised Version margin, the last two words are to be considered as meaning "of the cedars." The Hebrew word has been very generally accepted as from qadhar, "to become black," but it is an attractive suggestion (Cheyne) that it may be a phonetic variation of gidderon, "a spot for enclosures for cattle," of which latter there must have been many around the now buried caves which lay at the base of the cliffs around the spring Gihon):<P>1. Wady Sitti Miriam:<P>The Nachal Qidhron is the valley known today as the Wady Sitti Miriam, which lies between the eastern walls of Jerusalem and the Mount of Olives. It commences in the plateau to the north of the city, and after making a wide sweep southeast, under the name Wady el Joz ("Valley of the Walnuts"), passes south until level with the southeastern corner of the temple-area where its bed is spanned by an old bridge; here the bottom of the valley, 40 ft. beneath the present surface level, is 400 ft. below the temple-platform. From this point it narrows and deepens gradually, bending slightly west of south, and, after receiving the Tyropoeon valley, joins a little farther southwest with the Valley of Hinnom to form the Wady en Nar which winds on through the "wilderness of Judea" to the Dead Sea. Where the three valleys run together is a large open space filled with gardens (the <a href="./study/isbe/search.html?string=KING\'S+GARDEN">KING\'S GARDEN</a>, which see), which are kept irrigated all the year round by means of the overflow waters from the \'Ain Silwan (see <a href="./study/isbe/search.html?string=SILOAM">SILOAM</a>). It is where the Hinnom valley runs into the Kidron that some would locate <a href="./study/isbe/search.html?string=TOPHETH">TOPHETH</a> (which see). Except at the irrigated gardens, the ravine is a dry valley containing water only during and immediately after heavy rain, but in ancient times the rocky bottom—now buried beneath many feet of rich soil—must have contained a little stream from Gihon for at least some hundreds of yards. This was the "brook that flowed through the midst of the land" (<a onClick="return mV(\'2Ch\',32,4);">2Ch 32:4</a>). The length of the valley from its head to Bir Eyyub <span clas="noTag">is</span> 2 3/4 miles.<P>2. Traditions:<P>Since the 4th century AD, this valley has been known as the Valley of Jehoshaphat (see <a href="./study/isbe/search.html?string=JEHOSHAPHAT,+VALLEY+OF">JEHOSHAPHAT, VALLEY OF</a>), and from quite early times it was a favorite situation for interments (<a onClick="return mV(\'2Ki\',23,4,6,12);">2Ki 23:4,6,12</a>; <a onClick="return mV(\'2Ch\',34,4,5);">2Ch 34:4,5</a>); it is by Moslem and Jewish tradition the scene of the last judgment, and was known to the Moslems in the Middle Ages as Wady Jehannum; see <a href="./study/isbe/search.html?string=GEHENNA">GEHENNA</a>. It is probable that the "graves of the common people," where King Jehoiakim cast the body of the prophet Uriah, were here (<a onClick="return mV(\'Jer\',26,23);">Jer 26:23</a>), and it has been suggested, with less probability, that here too may have been the scene of Ezekiel\'s vision of the "valley of dry bones" (<a onClick="return mV(\'Eze\',37,\'1-\');">Eze 37</a>; compare <a onClick="return mV(\'Jer\',31,40);">Jer 31:40</a>).<P>3. The Fields of Kidron:<P>The Fields of Kidron (<a onClick="return mV(\'2Ki\',23,4);">2Ki 23:4</a>), though generally identified with the open, lower part of this valley, where it is joined by the Tyropoeon valley, may more probably have been in the upper part where the wide expanded valley receives the name Wady el Joz; this part is actually on the road to Bethel.<P>4. Historical Associations:<P>The most dramatic scene associated with the Kidron is that recorded in connection with its earliest Scriptural mention (<a onClick="return mV(\'2Sa\',15,23);">2Sa 15:23</a>), when David, flying before his rebellious son Absalom, here stood on the Jerusalem side of the valley while all his adherents passed over. "And all the country wept with a loud voice, and all the people passed over: the king also himself passed over the brook Kidron...toward the way of the wilderness." The passing over this brook appears to have been viewed as the solemn abandonment of the Jerusalem territory (compare <a onClick="return mV(\'1Ki\',2,37);">1Ki 2:37</a>). In <a onClick="return mV(\'1Ki\',15,13);">1Ki 15:13</a>; <a onClick="return mV(\'2Ch\',15,16);">2Ch 15:16</a>, we read that Asa burnt at the brook Kidron "an abominable image for an Asherab" which Maacah, his mother, had set up. In the reforms of Hezekiah, "all the uncleanness that they found in the temple of Yahweh" was carried by the Levites to the brook Kidron (<a onClick="return mV(\'2Ch\',29,16);">2Ch 29:16</a>); "All the altars for incense took they away, and cast them into the brook Kidron" (<a onClick="return mV(\'2Ch\',30,14);">2Ch 30:14</a>). This locality was again used in the reforms of Josiah when the king "brought out the Asherah from the house of Yahweh, without Jerusalem, unto the brook Kidron, and burned it at the brook Kidron, and beat it to dust, and cast the dust thereof upon the graves of the common people" (<a onClick="return mV(\'2Ki\',23,6);">2Ki 23:6</a>). The same treatment was given to the vessels made for Baal, the Asherah and the host of heaven (<a onClick="return mV(\'2Ki\',23,4);">2Ki 23:4</a>), and the two idolatrous altars of Manasseh (<a onClick="return mV(\'2Ki\',23,12);">2Ki 23:12</a>). Josephus (Ant., IX, vii, 3) states that Athaliah was slain in the valley of Kidron, but this does not quite tally with the account (<a onClick="return mV(\'2Ki\',11,16);">2Ki 11:16</a>). It was a valley associated with graves and the ashes of abominations, but it was prophesied that it should be "holy unto Yahweh" (<a onClick="return mV(\'Jer\',31,40);">Jer 31:40</a>). Twice it is mentioned simply as "the valley," nachal (<a onClick="return mV(\'2Ch\',33,14);">2Ch 33:14</a>; <a onClick="return mV(\'Neh\',2,15);">Ne 2:15</a>). Very different from these earlier scenes is the last Scriptural reference (<a onClick="return mV(\'Jhn\',18,1);">Joh 18:1</a>), when Jesus "went forth with his disciples over the brook Kidron" for His last hours of spiritual struggle and prayer before the turmoil of the end.``117';
isbe[5306]='Kilan`ki\'-lan (Kilan; the King James Version Ceilan): Mentioned with Azetas in 1Esdras 5:15; their sons returned among the exiles with Zerubbabel. The names do not appear in the lists of Ezra and Nehemiah.``1';

isbe[5308]='Kin``<a href="./study/isbe/search.html?string=KINDRED">KINDRED</a>`1';
isbe[5309]='Kin, Next of``<a href="./study/isbe/search.html?string=KINSMAN">KINSMAN</a>`1';
isbe[5310]='Kinah`ki\'-na (qinah): An unidentified town on the southern boundary of Judah, toward Edom (<a onClick="return mV(\'Jos\',15,22);">Jos 15:22</a>). The word qinah means "elegy," "dirge," "lament for the dead." The name, however, may have been derived from the Kenites, qeniy, who had settlements in the south (<a onClick="return mV(\'1Sa\',27,10);">1Sa 27:10</a>, etc.).``1';
isbe[5311]='Kindness`kind\'-nes (checedh; chrestotes): "Kindness" in the Old Testament is (with one exception) the translation of checedh, "kindness," "favor," "mercy," etc., used chiefly of man but also of God (<a onClick="return mV(\'Gen\',20,13);">Ge 20:13</a>; <a onClick="return mV(\'Gen\',40,14);">40:14</a>; <a onClick="return mV(\'1Sa\',15,6);">1Sa 15:6</a>; <a onClick="return mV(\'1Sa\',20,14,15);">20:14,15</a>; <a onClick="return mV(\'2Sa\',9,3);">2Sa 9:3</a>; <a onClick="return mV(\'Neh\',9,17);">Ne 9:17</a>; <a onClick="return mV(\'Psa\',141,5);">Ps 141:5</a>; <a onClick="return mV(\'Isa\',54,8,10);">Isa 54:8,10</a>, etc.); Tobh, "good," is once so translated (<a onClick="return mV(\'2Sa\',2,6);">2Sa 2:6</a>). In the New Testament chrestotes, "usefulness," "beneficence," is rendered "kindness" 4 times in the King James Version (<a onClick="return mV(\'2Cr\',6,6);">2Co 6:6</a>; <a onClick="return mV(\'Eph\',2,7);">Eph 2:7</a>; <a onClick="return mV(\'Col\',3,12);">Col 3:12</a>; <a onClick="return mV(\'Tts\',3,4);">Tit 3:4</a>, and in <a onClick="return mV(\'Gal\',5,22);">Ga 5:22</a> the Revised Version (British and American)); see <a href="./study/isbe/search.html?string=GENTLENESS">GENTLENESS</a>; <a href="./study/isbe/search.html?string=GOODNESS">GOODNESS</a>. Philanthropia, "love of mankind," is translated "kindness" <a onClick="return mV(\'Act\',28,2);">Ac 28:2</a>), and philadelphia, "love of the brotherhood" (<a onClick="return mV(\'2Pe\',1,7);">2Pe 1:7</a>, the English Revised Version "love of the brethren," the American Revised Version margin "Gr, love of the brethren").<P>For "kindness" (<a onClick="return mV(\'Psa\',31,21);">Ps 31:21</a>) the Revised Version (British and American) has "lovingkindness," and the American Standard Revised Version in other places where the reference is to God; for "shew," "shewed kindness" (<a onClick="return mV(\'Jos\',2,12);">Jos 2:12</a>) "deal," "dealt kindly"; for "The desire of man is his kindness" (<a onClick="return mV(\'Pro\',19,22);">Pr 19:22</a>) the American Standard Revised Version has "That which maketh a man to be desired is his kindness," the English Revised Version "The desire of man is (the measure of) his kindness," like the American Standard Revised Version in m; for "merciful kindness" (<a onClick="return mV(\'Psa\',117,2);">Ps 117:2</a>) the American Standard Revised Version has "lovingkindness," the English Revised Version "mercy "; both have "lovingkindness" (<a onClick="return mV(\'Psa\',119,76);">Ps 119:76</a>); for "of great kindness" (<a onClick="return mV(\'Neh\',9,17);">Ne 9:17</a>; <a onClick="return mV(\'Joe\',2,13);">Joe 2:13</a>; <a onClick="return mV(\'Jon\',4,2);">Jon 4:2</a>) the American Standard Revised Version has "abundant in lovingkindness," the English Revised Version "plenteous in mercy"; the Revised Version (British and American) has "kindness" for "mercy" (<a onClick="return mV(\'Gen\',39,21);">Ge 39:21</a>); for "pity" (<a onClick="return mV(\'Job\',6,14);">Job 6:14</a>); for "goodness" (<a onClick="return mV(\'Pro\',20,6);">Pr 20:6</a>); "favor and kindness" the American Standard Revised Version, for "grace and favor" (<a onClick="return mV(\'Est\',2,17);">Es 2:17</a>).`<a href="./study/isbe/search.html?string=LOVINGKINDNESS">LOVINGKINDNESS</a>; <a href="./study/isbe/search.html?string=MERCY">MERCY</a>`1';
isbe[5312]='Kindred`kin\'-dred: Several words are rendered "kindred" in the King James Version. \'ach, "brother," was used loosely among Hebrews for a member of the same tribe or family, a relative; and is once translated "kindred" (<a onClick="return mV(\'1Ch\',12,29);">1Ch 12:29</a> the King James Version). Once also somewhat loosely as the translation of modha\'ath, literally, "acquaintance" (<a onClick="return mV(\'Rth\',3,2);">Ru 3:2</a>; compare same root in <a onClick="return mV(\'Rth\',1,1);">2:1</A>, rendered "kinsman"); once, for the, figurative expression, "men of thy redemption" (ge\'ullah, referring to the law of the redemption of land by kinsmen, <a onClick="return mV(\'Lev\',25,25);">Le 25:25</a>). The two most common words for kindred are: (1) moledheth, "related by birth" (<a onClick="return mV(\'Gen\',12,1);">Ge 12:1</a>; <a onClick="return mV(\'Gen\',24,4,7);">24:4,7</a>; <a onClick="return mV(\'Gen\',31,3,13);">31:3,13</a>; <a onClick="return mV(\'Gen\',32,9);">32:9</a>; <a onClick="return mV(\'Gen\',43,7);">43:7</a>; <a onClick="return mV(\'Num\',10,30);">Nu 10:30</a>; <a onClick="return mV(\'Est\',2,10,20);">Es 2:10,20</a>; <a onClick="return mV(\'Est\',8,6);">8:6</a>); (2) mishpachah, "family" (<a onClick="return mV(\'Gen\',24,38,40,41);">Ge 24:38,40,41</a>; <a onClick="return mV(\'Jos\',6,23);">Jos 6:23</a>; <a onClick="return mV(\'Rth\',2,3);">Ru 2:3</a>; <a onClick="return mV(\'1Ch\',16,28);">1Ch 16:28</a>; <a onClick="return mV(\'Job\',32,2);">Job 32:2</a>; <a onClick="return mV(\'Psa\',22,27);">Ps 22:27</a>; <a onClick="return mV(\'Psa\',96,7);">96:7</a>).<P>In the New Testament (several times), genos, "kindred by birth," so, of same family, tribe or race (<a onClick="return mV(\'Act\',4,6);">Ac 4:6</a>; <a onClick="return mV(\'Act\',7,13,19);">7:13,19</a> the Revised Version (British and American) "race"); so also suggeneia (<a onClick="return mV(\'Luk\',1,61);">Lu 1:61</a>; <a onClick="return mV(\'Act\',7,3,14);">Ac 7:3,14</a>). In the King James Version phule, "tribe," rendered "kindred" (<a onClick="return mV(\'Rev\',1,7);">Re 1:7</a>; <a onClick="return mV(\'Rev\',5,9);">5:9</a>; <a onClick="return mV(\'Rev\',7,9);">7:9</a>; <a onClick="return mV(\'Rev\',11,9);">11:9</a>; <a onClick="return mV(\'Rev\',13,7);">13:7</a>; <a onClick="return mV(\'Rev\',14,6);">14:6</a>), but better "tribe" as in the Revised Version (British and American). patria, rendered "kindred" in <a onClick="return mV(\'Act\',3,25);">Ac 3:25</a>, is better "families," as in the Revised Version (British and American).``137';
isbe[5313]='Kine`kin:<P>(1) \'alaphim, plural of \'eleph, "ox," or "cow," the American Standard Revised Version "cattle," the King James Version and the English Revised Version "kine" (<a onClick="return mV(\'Deu\',7,13);">De 7:13</a>; <a onClick="return mV(\'Deu\',28,4,18,51);">28:4,18,51</a>);<P>(2) baqar, "ox" or "cow," the American Standard Revised Version "herd," the King James Version and the English Revised Version "kine" (<a onClick="return mV(\'Deu\',32,14);">De 32:14</a>; <a onClick="return mV(\'2Sa\',17,29);">2Sa 17:29</a>);<P>(3) paroth plural of parah, "young cow" or "heifer," the Revised Version (British and American) "kine" in <a onClick="return mV(\'Gen\',41,\'2-27\');">Ge 41:2-27</a>; <a onClick="return mV(\'1Sa\',6,\'7-14\');">1Sa 6:7-14</a>; <a onClick="return mV(\'Amo\',4,1);">Am 4:1</a>; in <a onClick="return mV(\'Gen\',32,15);">Ge 32:15</a>, the American Standard Revised Version has "cows."`<a href="./study/isbe/search.html?string=CATTLE">CATTLE</a>; <a href="./study/isbe/search.html?string=COW">COW</a>`1';
isbe[5314]='King of the Jews`The title applied in mockery of Jesus, and put by Pilate on His cross (<a onClick="return mV(\'Mat\',27,29,37);">Mt 27:29,37</a> parallel <a onClick="return mV(\'Mar\',15,26);">Mr 15:26</a>, etc.).`<a href="./study/isbe/search.html?string=JESUS+CHRIST">JESUS CHRIST</a>; <a href="./study/isbe/search.html?string=KING,+CHRIST+AS">KING, CHRIST AS</a>`1';
isbe[5315]='King\'s Dale``<a href="./study/isbe/search.html?string=DALE,+KING\'s">DALE, KING\'S</a>`1';
isbe[5316]='King\'s Garden`gan-ha-melekh): In <a onClick="return mV(\'Neh\',3,15);">Ne 3:15</a>, mention is made of "the pool of Shelah by the king\'s garden"; in <a onClick="return mV(\'2Ki\',25,4);">2Ki 25:4</a>; <a onClick="return mV(\'Jer\',52,7);">Jer 52:7</a>, "All the men of war fled by night by the way of the gate between the two walls, which was by the king\'s garden"; see also <a onClick="return mV(\'Jer\',39,4);">Jer 39:4</a>. The "king\'s winepresses" (<a onClick="return mV(\'Zec\',14,10);">Zec 14:10</a>), which must have been to the extreme south of the city, were clearly in this neighborhood. The references all point to the one situation in Jerusalem where it is possible for gardens to flourish all the year round, namely, the part of the Kidron valley below the Tyropoeon which is watered by the overflow from the Pool of Siloam (see <a href="./study/isbe/search.html?string=SILOAM">SILOAM</a>). Here the vegetable gardens of the peasants of Siloam present an aspect of green freshness unknown elsewhere in Jerusalem.``117';
isbe[5317]='King\'s Mother`The queen-dowager occupied a very important position at the court of the kings of Israel, e.g. Bathsheba (<a onClick="return mV(\'1Ki\',2,19);">1Ki 2:19</a>); Maacah (<a onClick="return mV(\'1Ki\',15,13);">1Ki 15:13</a>); Athaliah (<a onClick="return mV(\'2Ch\',22,2);">2Ch 22:2</a>); and Nehushta (<a onClick="return mV(\'2Ki\',24,8);">2Ki 24:8</a>; <a onClick="return mV(\'Jer\',13,18);">Jer 13:18</a>).`<a href="./study/isbe/search.html?string=QUEEN">QUEEN</a>; <a href="./study/isbe/search.html?string=QUEEN+MOTHER">QUEEN MOTHER</a>`1';
isbe[5318]='King\'s Pool`(berekhath hamelekh): This is possibly the Pool of Siloam (<a onClick="return mV(\'Neh\',2,14);">Ne 2:14</a>), and may have been so named as being near to the "king\'s garden."``1';
isbe[5319]='King\'s Vale`(\'emeq ha-melekh; Septuagint in Genesis reads to pedion ("the plain") basileos, in 2 Samuel, he koilas ("valley") tou basileos; the King James Version King\'s Dale): The place where the king of Sodom met Abram (<a onClick="return mV(\'Gen\',14,17);">Ge 14:17</a>), and the situation of Absalom\'s monument (<a onClick="return mV(\'2Sa\',18,18);">2Sa 18:18</a>). It was identical with the Vale of Shaveh, and was evidently near Salem, the city of Melchizedek (<a onClick="return mV(\'Gen\',14,17);">Ge 14:17</a>). If <a href="./study/isbe/search.html?string=SALEM">SALEM</a> (which see) is Jerusalem, then Absalom\'s pillar was also near that city, Josephus writes (Ant., VII, x, 3), "Absalom had erected for himself a marble pillar in the king\'s dale, two furlongs (stadia) from Jerusalem, which he named Absalom\'s Hand." In all probability this "pillar" was a rough upright stone—a matstsebhah—but its site is lost. The traditional Greek-Egyptian tomb of perhaps 100-200 years BC which has been hewn out of the rock on the eastern side of the Kidron valley is manifestly misnamed "Absalom\'s pillar," and the Kidron ravine (nachal) cannot be the King\'s Vale (\'emeq).``117';
isbe[5320]='King, Christ As`<b>I. THE REALITY OF CHRIST\'S KINGSHIP</b><P class="in15">1. The Old Testament Foreshadowings<P class="in30">In the Psalms and Prophets<P class="in15">2. The Gospel Presentation<P class="in30">(1) Christ\'s Claim to Be King<P class="in30">(2) Christ\'s Acceptance of the Title<P class="in30">(3) Christ Charged and Condemned as King<P class="in30">(4) The Witness of the Resurrection and of Apostolic Preaching<P class="in30">(5) The Testimony of the Epistles and Apocalypse<P><b>II. CHRIST\'S TITLE TO KINGSHIP</b><P class="in15">1. By Birth<P class="in15">2. By Divine Appointment<P class="in15">3. By Conquest<P class="in15">4. By the Free Choice of His People<P><b>III. THE NATURE OF CHRIST\'S KINGSHIP</b><P class="in15">1. Spiritual<P class="in15">2. Universal<P class="in30">(1) Kingdom of Grace, of Power<P class="in30">(2) Kingdom of Glory<P class="in15">3. Eternal<hr /><P>I. The Reality of Christ\'s Kingship.<P>There can be no question but that Christ is set before us in Scripture as a king. The very title Christ or "Messiah" suggests kingship, for though the priest is spoken of as "anointed," and full elucidation of the title as applied to Jesus must take account of His threefold office of prophet, priest and king, yet generally in the Old Testament it is the king to whom the epithet is applied.<P>1. The Old Testament Foreshadowings:<P>We may briefly note some of the Old Testament predictions of Christ as king. The first prediction which represents the Christ as having dominion is that of Jacob concerning the tribe Of Judah: "Until Shiloh come; and unto him shall the obedience of the peoples be" (<a onClick="return mV(\'Gen\',49,10);">Ge 49:10</a>); then kingly dignity and dominion are suggested by the star and scepter in Balaam\'s prophecy (<a onClick="return mV(\'Num\',24,\'15-17\');">Nu 24:15-17</a>). As yet, however, Israel has no king but God, but when afterward a king is given and the people become familiar with the idea, the prophecies all more or less have a regal tint, and the coming one is preeminently the coming king.<P>In the Psalms and Prophets<P>We can only indicate a few of the many royal predictions, but these will readily suggest others. In <a onClick="return mV(\'Psa\',2,\'1-\');">Ps 2</a> the voice of Yahweh is heard above all the tumult of earth, declaring, "Yet I have set my king upon my holy hill of Zion." So in <a onClick="return mV(\'Psa\',24,\'1-\');">Psalms 24</a>; <a onClick="return mV(\'Psa\',45,\'1-\');">45</a>; <a onClick="return mV(\'Psa\',72,\'1-\');">72</a>; <a onClick="return mV(\'Psa\',89,\'1-\');">89</a> and <a onClick="return mV(\'Psa\',110,\'1-\');">110</A> we have special foreshadowings of the Messianic king. The babe that Isaiah sees born of a virgin is also the "Prince of Peace" (<a onClick="return mV(\'Isa\',9,6,7);">Isa 9:6,7</a>), of the increase of whose government there shall be no end, and as the prophet gazes on him he joyfully exclaims: "Behold, a king shall reign in righteousness" (<a onClick="return mV(\'Isa\',32,1);">Isa 32:1</a>). Jeremiah, the prophet of woe, catches bright glimpses of his coming Lord, and with rapture intensified by the surrounding sorrow cries: "Behold, the days come, saith Yahweh, that I will raise unto David a righteous Branch, and he shall reign as king and deal wisely, and shall execute justice and righteousness in the land" (<a onClick="return mV(\'Isa\',23,5);">23:5</A>). Ezekiel, dwelling amid his wheels, sees in the course of Providence many revolutions, but they are all to bring about the dominion of Christ: "I will overturn, overturn, overturn...until he come whose right it is; and I will give it him" (<a onClick="return mV(\'Eze\',21,27);">21:27</A>). Daniel sees the rise and progress, the decline and fall of many mighty empires, but beyond all he sees the Son of man inheriting an everlasting kingdom (<a onClick="return mV(\'Dan\',7,13);">7:13</A>). Hosea sees the repentant people of Israel in the latter days seeking Yahweh their God, and David (the greater David) their king (<a onClick="return mV(\'Hsa\',3,5);">3:5</a>). Micah sees the everlasting Ruler coming out of Bethlehem clad in the strength and majesty of Yahweh, who shall "be great unto the ends of the earth" (<a onClick="return mV(\'Mic\',5,4);">5:4</A>). Zechariah, exulting in His near approach, cries: "Rejoice greatly, O daughter of Zion; shout, O daughter of Jerusalem: behold, thy king cometh unto thee" (<a onClick="return mV(\'Zec\',9,9);">9:9</A>), and he follows His varied course through gloom and through glory, until the strong conviction is born in his heart and expressed in the glowing words: "Yahweh shall be King over all the earth" (<a onClick="return mV(\'Zec\',14,9);">14:9</a>). The more extreme higher critics would, of course, deny that these are direct predictions of Jesus Christ, but most, if not all, would admit that they are ideal representations which were only fully realized in Jesus of Nazareth.<P>2. The Gospel Presentation:<P>The Gospels present Christ as king. Matthew, tracing His genealogy, gives special prominence to His royal lineage as son of David. He tells of the visit of the Magi who inquire for the newborn king of the Jews, and the scribes answer Herod\'s question by showing from Micah\'s prophecy that the Christ to be born in Bethlehem would be a "governor," and would rule, "be shepherd of my people Israel" (<a onClick="return mV(\'Mat\',2,5,6);">Mt 2:5,6</a>). Luke\'s account of the Nativity contains the angel\'s declaration that the child to be born and named Jesus would occupy the throne of David and reign over the house of Jacob forever (<a onClick="return mV(\'Luk\',1,32,33);">Lu 1:32,33</a>). In John\'s account of the beginning of Christ\'s ministry, one of His early disciples, Nathanael, hails Him as "King of Israel" (<a onClick="return mV(\'Jhn\',1,49);">Joh 1:49</a>), and Jesus does not repudiate the title. If Mark has no such definite word, he nevertheless describes the message with which Jesus opens His ministry as the "gospel" of "the kingdom of God" (<a onClick="return mV(\'Mar\',1,14,15);">1:14,15</a>). The people nurtured in the prophetical teaching expect the coming one to be a king, and when Jesus seems to answer to their ideal of the Messiah, they propose taking Him by force and making Him king (<a onClick="return mV(\'Jhn\',6,15);">Joh 6:15</a>).<P>(1) Christ\'s Claim to Be King<P>Christ Himself claimed to be king. In claiming to be the Messiah He tacitly claimed kingship, but there are specific indications of the claim besides. In all His teaching of the kingdom it is implied, for though He usually calls it the "kingdom of God" or "of heaven," yet it is plain that He is the administrator of its affairs. He assumes to Himself the highest place in it. Admission into the kingdom or exclusion from it depends upon men\'s attitude toward Him. In His explanation of the parable of the Tares, He distinctly speaks of His kingdom, identifying it with the kingdom of God. "The Son of man shall send forth his angels, and they shall gather out of his kingdom all things that cause stumbling, and them that do iniquity...Then shall the righteous shine forth as the sun in the kingdom of their Father" (<a onClick="return mV(\'Mat\',13,\'41-43\');">Mt 13:41-43</a>). He speaks of some seeing "the Son of man coming in his kingdom" (<a onClick="return mV(\'Mat\',16,28);">Mt 16:28</a>), of the regeneration, "when the Son of man shall sit on the throne of his glory" (<a onClick="return mV(\'Mat\',19,28);">Mt 19:28</a>), of Himself under the guise of a nobleman who goes "into a far country, to receive for himself a kingdom," and does receive it (<a onClick="return mV(\'Luk\',19,\'12-15\');">Lu 19:12-15</a>).<P>(2) Christ\'s Acceptance of the Title<P>When the mother of John and James comes asking that her two sons may occupy the chief places of honor in His kingdom, He does not deny that He is a king and has a kingdom, while indicating that the places on His right and left hand are already determined by the appointment of the Father (<a onClick="return mV(\'Mat\',20,\'21-23\');">Mt 20:21-23</a>). He deliberately takes steps to fulfill the prediction of Zec: "Behold, thy king cometh," and He accepts, approves and justifies the hosannas and the homage of the multitude (<a onClick="return mV(\'Mat\',21,\'1-16\');">Mt 21:1-16</a>; <a onClick="return mV(\'Mar\',11,\'1-\');">Mr 11</a>; <a onClick="return mV(\'Luk\',19,\'1-\');">Lu 19</a>; <a onClick="return mV(\'Jhn\',12,\'1-\');">Joh 12</a>). In His great picture of the coming judgment (<a onClick="return mV(\'Mat\',25,\'1-\');">Mt 25</a>), the Son of man sits upon the throne of His glory, and it is as "the king" that He blesses and condemns. The dying thief prays, "Remember me when thou comest in thy kingdom" (<a onClick="return mV(\'Luk\',23,42);">Lu 23:42</a>), and Jesus gives His royal response which implies full acceptance of the position.<P>(3) Christ Charged and Condemned as King<P>His claim throughout had been so definite that His enemies make this the basis of their charge against Him before Pilate, that He said that "he himself is Christ a king," and when Pilate asks, "Art thou the King?" He answers, "Thou sayest," which was equivalent to "yes" (<a onClick="return mV(\'Luk\',23,2,3);">Lu 23:2,3</a>). In the fuller account of John, Jesus speaks to Pilate of "my kingdom," and says "Thou sayest that I am a king. To this end have I been born" (<a onClick="return mV(\'Jhn\',18,37);">Joh 18:37</a>). His claim is perpetuated in the superscription of the cross in the three languages: "This is the King of the Jews," and although the priests wished it to be altered so as to detract from His claim, they yet affirm the fact of that claim when they say: "Write not, The King of the Jews; but, that he said, I am King of the Jews" (<a onClick="return mV(\'Jhn\',19,21);">Joh 19:21</a>). The curtain of His earthly life falls upon the king in seeming failure; the taunt of the multitude, "Let the Christ, the King of Israel, now come down from the cross" (<a onClick="return mV(\'Mar\',15,32);">Mr 15:32</a>), meets with no response, and the title on the cross seems a solemn mockery, like the elaborate, cruel jest of the brutal soldiers clothing Him with purple, crowning Him with thorns and hailing Him King of the Jews.<P>(4) The Witness of the Resurrection and of Apostolic Preaching.<P>But the resurrection throws new light upon the scene, and fully vindicates His claims, and the sermon of Peter on the day of Pentecost proclaims the fact that the crucified one occupies the throne. "Let all the house of Israel therefore know assuredly, that God hath made him both Lord and Christ, this Jesus whom ye crucified" (<a onClick="return mV(\'Act\',2,36);">Ac 2:36</a>). The early preaching of the apostles, as recorded in the Acts, emphasizes His lordship, His kingship; these men were preachers in the literal sense—heralds of the king.<P>(5) The Testimony of the Epistles and Apocalypse.<P>We need not consider in detail the testimony of the Epistles. The fact that Christ is king is everywhere implied and not infrequently asserted. He is "Lord of both the dead and the living" (<a onClick="return mV(\'Rom\',14,9);">Ro 14:9</a>). He is risen "to rule over the Gentiles" (<a onClick="return mV(\'Rom\',15,12);">Ro 15:12</a>). "He must reign, till he hath put all his enemies under his feet" (<a onClick="return mV(\'1Cr\',15,25);">1Co 15:25</a>). He is at the right hand of God "above all rule, and authority," etc. (<a onClick="return mV(\'Eph\',1,\'20-22\');">Eph 1:20-22</a>). Evil men have no "inheritance in the kingdom of Christ and God" (<a onClick="return mV(\'Eph\',5,5);">Eph 5:5</a>), and believers are "translated into the kingdom of the Son of his love" (<a onClick="return mV(\'Col\',1,13);">Col 1:13</a>). He has been given the name that is above every name "that in the name of Jesus every knee should bow," etc. (<a onClick="return mV(\'Phl\',2,\'9-11\');">Php 2:9-11</a>). Those who suffer with Christ are to "reign with him" (<a onClick="return mV(\'2Ti\',2,12);">2Ti 2:12</a>), at "his appearing and his kingdom" (<a onClick="return mV(\'2Ti\',4,1);">2Ti 4:1</a>), and He will save them "unto his heavenly kingdom" (<a onClick="return mV(\'2Ti\',4,18);">2Ti 4:18</a>); "the eternal kingdom of our Lord and Saviour Jesus Christ" (<a onClick="return mV(\'2Pe\',1,11);">2Pe 1:11</a>). Of the Son it is said: "Thy throne, O God, is for ever and ever" (<a onClick="return mV(\'Hbr\',1,8);">Heb 1:8</a>), and He is a King-Priest "after the order of Melchizedek" (<a onClick="return mV(\'Hbr\',7,17);">Heb 7:17</a>). In the Apocalypse, appropriately, the predominant aspect of Christ is that of a king. He is the "ruler of the kings of the earth" (<a onClick="return mV(\'Rev\',1,5);">Re 1:5</a>), "King of the ages" (<a onClick="return mV(\'Rev\',15,3);">Re 15:3</a>), "King of kings" (<a onClick="return mV(\'Rev\',17,14);">Re 17:14</a>; <a onClick="return mV(\'Rev\',19,16);">19:16</a>), "and he shall reign for ever and ever" (<a onClick="return mV(\'Rev\',11,15);">Re 11:15</a>). The reality of Christ\'s kingship is thus placed beyond all doubt.<P>II. Christ\'s Title to Kingship.<P>1. By Birth:<P>After the analogy of earthly kingships it might be said that Jesus Christ is a king by birth. He was born a king. His mother, like His reputed father, "was of the house and family of David" (<a onClick="return mV(\'Luk\',2,4);">Lu 2:4</a>). The angel in nouncing His birth declares that He will occupy the throne of His father David. The Pharisees have no hesitation in affirming that the Christ would be Son of David (<a onClick="return mV(\'Mat\',22,45);">Mt 22:45</a>; <a onClick="return mV(\'Mar\',12,35);">Mr 12:35</a>; <a onClick="return mV(\'Luk\',20,41);">Lu 20:41</a>). Frequently in life He was hailed as "Son of David," and after His ascension, Peter declares that the promise God had made to David that "of the fruit of his loins he would set one upon his throne" (<a onClick="return mV(\'Act\',2,30);">Ac 2:30</a>) was fulfilled in Jesus of Nazareth; while Paul declares that the gospel of God was "concerning his Son, who was born of the seed of David according to the flesh" (<a onClick="return mV(\'Rom\',1,3);">Ro 1:3</a>). So that on the human side He had the title to kingship as son of David, while on the Divine side as Son of God He had also the right to the throne.<P>2. By Divine Appointment:<P>David was king by Divine choice and appointment, and this was the ideal in the case of his successors. The figment of "Divine right"—by virtue of which modern kings have claimed to rule—was, in the first instance, a reminiscence of the Biblical ideal. But the ideal is realized in Christ. Of the coming Messianic King, Yahweh said: "Yet I have set my king upon my holy hill of Zion" (<a onClick="return mV(\'Psa\',2,6);">Ps 2:6</a>), and the great proclamation of Pentecost was an echo of that decree: "Let all the house of Israel therefore know assuredly, that God hath made him both Lord and Christ, this Jesus whom ye crucified" (<a onClick="return mV(\'Act\',2,36);">Ac 2:36</a>), while the apostle declares that "God highly exalted him, and gave unto him the name which is above every name" (<a onClick="return mV(\'Phl\',2,9);">Php 2:9</a>), and again and again the great Old Testament word of Yahweh is applied to Christ: "Sit thou on my right hand, till I make thine enemies the footstool of thy feet" (<a onClick="return mV(\'Hbr\',1,13);">Heb 1:13</a>).<P>3. By Conquest:<P>Often in the olden times kingship was acquired by conquest, by superior prowess. According to one etymology of our word "king," it means the "able man," "the one who can," and everyone remembers Carlyle\'s fine passage thereon. In the highest sense, this is true of Christ, who establishes His sway over men\'s hearts by His matchless prowess, the power of His infinite love and the charm of His perfect character.<P>4. By the Free Choice of His People:<P>Except in the most autocratic form of kingship, some place has been given to the suffrage of the people, and the other phases of the title have been confirmed and ratified by the voice of the people as they cry, "God save the king!" and no king is well established on the throne if he is not supported by the free homage of his subjects. Christ as king wins the love of His people, and they gladly acknowledge His sway. They are of one heart to make Him king.<P>III. The Nature of Christ\'s Kingship.<P>We know that the Jews expected a material kingdom, marked by earthly pomp and state; a kingdom on the lines of the Davidic or Solomonic kingdom, and others since have made the same mistake.<P>1. Spiritual:<P>The Scriptures plainly declare, Christ Himself clearly taught, that His kingship was spiritual. "My kingdom," said He, "is not of this world" (<a onClick="return mV(\'Jhn\',18,36);">Joh 18:36</a>), and all the representations given of it are all consistent with this declaration. Some have emphasized the preposition ek here, as if that made a difference in the conception: "My kingdom is not of this world." Granted that the preposition indicates origin, it still leaves the statement an assertion of the spirituality of the kingdom, for if it is not from this kosmos, from this earthly state of things, it must be from the other world—not the earthly but the heavenly; not the material but the spiritual. The whole context shows that origin here includes character, for Christ adds, "If my kingdom were of this world, then would my servants fight, that I should not be delivered to the Jews." Because it is of an unworldly origin, it is not to be propagated by, worldly means, and the non-use of worldly means declares it to be of an unworldly character. So that to assert that Christ means that His kingdom was not to arise out of this world, but to come down from heaven, is not at all to deny, but rather, indeed, to declare its essential spirituality, its unworldliness, its otherworldliness.<P>Throughout the New Testament, spirituality appears as the prevailing characteristic of Christ\'s reign. Earthly kingdoms are based upon material power, the power of the sword, the power of wealth, etc., but the basal factor of Christ\'s kingdom is righteousness (<a onClick="return mV(\'Mat\',5,20);">Mt 5:20</a>; <a onClick="return mV(\'Mat\',6,33);">6:33</a>; <a onClick="return mV(\'Rom\',14,17);">Ro 14:17</a>; <a onClick="return mV(\'Hbr\',1,8);">Heb 1:8</a>, etc.). The ruling principle in earthly kingdoms is selfish or sectional or national aggrandizement; in the kingdom of Christ it is truth. Christ is king of truth. "Art thou a king then?" said Pilate. "I am," said Christ (for that is the force of "thou sayest that I am a king"). "To this end have I been born, and to this end am I come into the world, that I should bear witness unto the truth," and He adds, "Every one that is of the truth heareth my voice" (<a onClick="return mV(\'Jhn\',18,37);">Joh 18:37</a>). Elsewhere He says: "I am the...truth" (<a onClick="return mV(\'Jhn\',14,6);">Joh 14:6</a>), and at the head of the armies of heaven He still wears the title "Faithful and True" (<a onClick="return mV(\'Rev\',19,11);">Re 19:11</a>); but if righteousness and truth occupy such a prominent place in His kingdom, it follows that it must be distinguished by its spirituality. His immediate subjects are spiritual men and women; its laws are spiritual; its work is spiritual; all the forces emanating from it, operating through it, centering in it, are spiritual.<P>2. Universal:<P>The Jewish idea of the Messiah\'s reign was a narrow national one. For them it meant the glorification of the sons of Abraham, the supremacy of Judaism over all forms of faith and all systems of philosophy; the subjection to Jewish sway of the haughty Roman, the cultured Greek and the rude barbarian. The Messiah was to be a greater king than David or Solomon, but still a king after the same sort; much as the limits of the kingdom might extend, it would be but an extension on Jewish lines; others might be admitted to a share in its privileges, but they would have to become naturalized Jews, or occupy a very subordinate place. The prophetic ideal, however, was a universal kingdom, and that was the conception endorsed and emphasized by Christ. (For the prophetic ideal such passages may be noted as <a onClick="return mV(\'Psa\',2,\'1-\');">Psalms 2</a>; <a onClick="return mV(\'Psa\',22,\'1-\');">22</a>; <a onClick="return mV(\'Psa\',72,\'1-\');">72</a>; <a onClick="return mV(\'Isa\',11,10);">Isa 11:10</a>; <a onClick="return mV(\'Dan\',7,13,14);">Da 7:13,14</a>, etc.) Of course, the predictions have a Jewish coloring, and people who did not apprehend the spirituality might well construe this amiss; but, closely examined, it will be found that the prophets indicate that men\'s position in the coming kingdom is to be determined by their relation to the king, and in that we get the preparation for the full New Testament ideal. The note of universality is very marked in the teaching of Christ. All barriers are to be broken down, and Jews and Gentiles are to share alike in the privileges of the new order. "Many shall come from the east and the west, and shall sit down with Abraham, and Isaac, and Jacob, in the kingdom of heaven" (<a onClick="return mV(\'Mat\',8,11);">Mt 8:11</a>), and stranger still to the Jewish ear: "The sons of the kingdom shall be cast forth into the outer darkness" (<a onClick="return mV(\'Mat\',8,12);">Mt 8:12</a>). In the parables of the kingdom (<a onClick="return mV(\'Mat\',13,\'1-\');">Mt 13</a>), the field, in which is sown the good seed of the kingdom, is the world, and the various other figures give the same idea of unlimited extent. The same thought is suggested by the declaration, "Other sheep I have, which are not of this fold" (<a onClick="return mV(\'Jhn\',10,16);">Joh 10:16</a>), also by the confident affirmation: "I, if I be lifted up, from the earth, will draw all men unto myself" (<a onClick="return mV(\'Jhn\',12,32);">Joh 12:32</a>), and so with many other statements of the Gospels.<P>The terms of the commission are enough to show the universal sovereignty which Christ claims over men: "Go ye therefore," He says, as possessing all authority in heaven and on earth, "and make disciples of all the nations" (<a onClick="return mV(\'Mat\',28,19);">Mt 28:19</a>), coupled with the royal assurance, "Ye shall be my witnesses...unto the uttermost part of the earth" (<a onClick="return mV(\'Act\',1,8);">Ac 1:8</a>). The Book of Acts shows, in the carrying out of the commission, the actual widening of the borders of Christ\'s kingdom to include believers of all tions. Peter is taught, and announces clearly, the great truth that Gentiles are to be received upon the same terms as the Jews. But through Paul as the apostle of the Gentiles this glorious truth is most fully and jubilantly made known. In the dogmatic teaching of his Epistles he shows that all barriers are broken down, the middle wall of the fence between Jew and Gentile no longer exists. Those who were aliens and strangers are now made nigh in Christ, and "are no more strangers and sojourners, but ye are fellow-citizens with the saints, and of the household of God" (<a onClick="return mV(\'Eph\',2,19);">Eph 2:19</a>). That household, that commonwealth, is, in Pauline language, equivalent to the kingdom, and in the same epistle, he describes the same privileged position as being an "inheritance in the kingdom of Christ and God" (<a onClick="return mV(\'Eph\',5,5);">Eph 5:5</a>). The Saviour\'s kingdom cannot be bounded by earthly limits, and all attempts to map it out according to human rules imply a failure to recognize the true Scriptural idea of its universality.<P>(1) Kingdom of Grace, of Power.<P>Most of what we have said applies to that phase of Christ\'s kingdom which is generally called his kingdom of grace; there is another phase called the kingdom of power. Christ is in a special sense king in Zion, king in His church—that is universal in conception and destined to be so in reality—but He is also king of the universe. He is "head over all things"; <a onClick="return mV(\'Eph\',1,22);">Eph 1:22</a>; <a onClick="return mV(\'Col\',1,18);">Col 1:18</a>, and other passages clearly intimate this. He rules over all. He does so not simply as God, but as God-man, as mediator. It is as mediator that He has the name above every name; it is as mediator that He sits upon the throne of universal power.<P>(2) Kingdom of Glory.<P>There is also the phase of the kingdom of glory. Christ\'s reign now is truly glorious. The essential spirituality of it implies its glory, for as the spiritual far surpasses the material in value, so the glory of the spiritual far transcends the glory of the material. The glory of worldly pomp, of physical force, of human prowess or genius, must ever pale before the glory of righteousness, truth, spirituality. But Christ\'s kingdom is glorious in another sense; it is a heavenly kingdom. It is the kingdom of grace into which saved sinners now enter, but it is also the kingdom of heavenly glory, and in it the glorified saints have a place. Entrance into the kingdom of grace in this earthly state secures entrance into the kingdom of glory. Rightly does the church confess: "Thou art the King of Glory, O Christ." The kingdom is yet to assume an externally glorious form. That is connected with the appearing of Christ (<a onClick="return mV(\'2Ti\',4,1);">2Ti 4:1</a>), the glory that shall be revealed, the heavenly kingdom. The kingdom in that stage cannot be entered by flesh and blood (<a onClick="return mV(\'1Cr\',15,50);">1Co 15:50</a>), man in his mortality—but the resurrection change will give the fitness, when in the fullest sense the kingdom of this world shall have "become the kingdom of our Lord, and of his Christ" (<a onClick="return mV(\'Rev\',11,15);">Re 11:15</a>).<P>3. Eternal:<P>It would be easy to multiply quotations in proof of this. The great passage in <a onClick="return mV(\'Dan\',7,\'1-\');">Da 7</a> emphatically declares it. The echo of this is heard in the angel\'s announcement: "He shall reign over the house of Jacob for ever; and of his kingdom there shall be no end" (<a onClick="return mV(\'Luk\',1,33);">Lu 1:33</a>). The reign of 1,000 years which so greatly occupies the thoughts of so many brethren, whatever we may decide as to its nature, is but an episode in the reign of Christ. He is reigning now, He shall reign forever. <a onClick="return mV(\'Rev\',11,15);">Re 11:15</a>, above quoted, is often cited as applying to the millennium, but it goes on to say "and he shall reign (not for 1,000 years simply, but) for ever and ever." So, many of the glowing predictions of the Old Testament, which are often assigned to the millennium, indicate no limit, but deal with the enduring and eternal.<P>The difficult passage in <a onClick="return mV(\'1Cr\',15,\'24-28\');">1Co 15:24-28</a> must be interpreted in the light of those declarations concerning the eternity of Christ\'s reign. It is evidently as mediator that He delivers up the kingdom to the Father. The dispensation of mediator comes to an end. All has been done according to the purpose of redemption. All the ransomed are finally gathered home. He sees of the travail of His soul and is satisfied. Obdurate enemies are subdued. God\'s glory has been fully vindicated. The Son becoming subject to the Father, God governs directly and is all in all. But the Son in some sense still reigns and through Him God\'s glory will ever shine, while the kingdom eternally rests upon redemption. We may summarize by saying that Christ is king of truth, king of salvation (<a onClick="return mV(\'Mat\',21,5);">Mt 21:5</a>; <a onClick="return mV(\'Zec\',9,9);">Zec 9:9</a>); king of grace; king of peace (<a onClick="return mV(\'Luk\',19,38);">Lu 19:38</a>; <a onClick="return mV(\'Hbr\',7,2);">Heb 7:2</a>); king of righteousness (<a onClick="return mV(\'Hbr\',1,8);">Heb 1:8</a>; <a onClick="return mV(\'Hbr\',7,2);">7:2</a>); king of glory (<a onClick="return mV(\'Mat\',25,\'31-34\');">Mt 25:31-34</a>); king eternal; king of saints, king of the ages; king of kings (<a onClick="return mV(\'Rev\',19,16);">Re 19:16</a>). "Upon his head are many diadems" (<a onClick="return mV(\'Rev\',19,12);">Re 19:12</a>).`<a href="./study/isbe/search.html?string=CHRIST,+OFFICES+OF">CHRIST, OFFICES OF</a>`110';
isbe[5321]='King; Kingdom`king\'-dum:<P><b>I. KING</b><P class="in15">1. Etymology and Definition<P class="in15">2. Earliest Kings<P class="in15">3. Biblical Signification of the Title<P>II. KINGDOM<P class="in15">1. Israel\'s Theocracy<P class="in15">2. Period of Judges<P class="in15">3. Establishment of the Monarchy<P class="in15">4. Appointment of King<P class="in15">5. Authority of the King<P class="in15">6. Duties of the King<P class="in15">7. The Symbols of Royal Dignity<P class="in15">8. Maintenance and Establishment<P class="in30">(1) Income<P class="in30">(2) The Royal Court<P class="in15">9. Short Character Sketch of Israel\'s Kingdom<P><b>LITERATURE</b><hr /><P>I. King.<P>1. Etymology and Definition:<P>The Hebrew word for king is melekh; its denominative malakh, "to reign" "to be king." The word is apparently derived from the mlkh which denotes: (1) in the Arabic (the verb and the noun) it means "to possess," "to reign," inasmuch as the possessor is also "lord" and "ruler"; (2) in the Aramaic melekh), and Assyrian "counsel," and in the Syrian "to consult"; compare Latin, consul.<P>If, as has been suggested, the root idea of "king" is "counsellor" and not "ruler," then the rise of the kingly office and power would be due to intellectual superiority rather than to physical prowess. And since the first form of monarchy known was that of a "city-state," the office of king may have evolved from that of the chief "elder" or intellectual head of the clan.<P>2. Earliest Kings:<P>The first king of whom we read in the Bible was Nimrod (<a onClick="return mV(\'Gen\',10,\'8-10\');">Ge 10:8-10</a>), who was supposedly the founder of the Babylonian empire. Historical research regarding the kings of Babylonia and Egypt corroborates this Biblical statement in so far as the ancestry of these kings is traced back to the earliest times of antiquity. According to <a onClick="return mV(\'Isa\',19,11);">Isa 19:11</a>, it was the pride of the Egyptian princes that they could trace their lineage to most ancient kings. The Canaanites and Philistines had kings as early as the times of Abraham (<a onClick="return mV(\'Gen\',14,2);">Ge 14:2</a>; <a onClick="return mV(\'Gen\',20,2);">20:2</a>). Thus also the Edomites, who were related to Israel (<a onClick="return mV(\'Gen\',36,31);">Ge 36:31</a>), the Moabites, and the Midianites had kings (<a onClick="return mV(\'Num\',22,4);">Nu 22:4</a>; <a onClick="return mV(\'Num\',31,8);">31:8</a>) earlier than the Israelites.<P>In <a onClick="return mV(\'Gen\',14,18);">Ge 14:18</a> we read of Melchizedek, who was a priest, and king of Salem. At first the extent of the dominion of kings was often very limited, as appears from 70 of them being conquered by Adonibezek (<a onClick="return mV(\'Jdg\',1,7);">Jud 1:7</a>), 31 by Joshua (<a onClick="return mV(\'Jos\',12,7);">Jos 12:7</a>), and 32 being subject to Ben-hadad (<a onClick="return mV(\'1Ki\',20,1);">1Ki 20:1</a>).<P>3. Biblical Signification of the Title:<P>The earliest Biblical usage of this title "king," in consonance with the general oriental practice, denotes an absolute monarch who exercises unchecked control over his subjects. In this sense the title is applied to Yahweh, and to human rulers. No constitutional obligations were laid upon the ruler nor were any restrictions put upon his arbitrary authority. His good or bad conduct depended upon his own free will.<P>The title "king" was applied also to dependent kings. In the New Testament it is used even for the head of a province (<a onClick="return mV(\'Rev\',17,12);">Re 17:12</a>). To distinguish him from the smaller and dependent kings, the king of Assyria bore the title "king of kings."<P>II. Kingdom.<P>The notable fact that Israel attained to the degree of a kingdom rather late, as compared with the other Semitic nations, does not imply that Israel, before the establishment of the monarchy, had not arrived at the stage of constitutional government, or that the idea of a kingdom had no room in the original plan of the founder of the Hebrew nation. For a satisfactory explanation we must take cognizance of the unique place that Israel held among the Semitic peoples.<P>1. Israel\'s Theocracy:<P>It is universally recognized that Israel was a singular community. From the beginning of its existence as a nation it bore the character of a religious and moral community, a theocratic commonwealth, having Yahweh Himself as the Head and Ruler. The theocracy is not to be mistaken for a hierarchy, nor can it strictly be identified with any existent form of political organization. It was rather something over and above, and therefore independent of the political organization. It did not supersede the tribal organization of Israel, but it supplied the centralizing power, constituting Israel a nation. In lieu of a strong political center, the unifying bond of a common allegiance to Yahweh, i.e. the common faith in Him, the God of Israel, kept the tribes together. The consciousness that Yahweh was Israel\'s king was deeply rooted, was a national feeling, and the inspiration of a true patriotism (<a onClick="return mV(\'Exd\',15,18);">Ex 15:18</a>; <a onClick="return mV(\'Exd\',19,6);">19:6</a>; <a onClick="return mV(\'Jdg\',5,\'1-\');">Jud 5</a>). Yahweh\'s kingship is evinced by the laws He gave to Israel, by the fact that justice was administered in His name (<a onClick="return mV(\'Exd\',22,28);">Ex 22:28</a>), and by His leading and siding Israel in its wars (<a onClick="return mV(\'Exd\',14,14);">Ex 14:14</a>; <a onClick="return mV(\'Exd\',15,3);">15:3</a>; <a onClick="return mV(\'Num\',21,14);">Nu 21:14</a>; <a onClick="return mV(\'1Sa\',18,17);">1Sa 18:17</a>; <a onClick="return mV(\'1Sa\',25,28);">25:28</a>). This decentralized system which characterized the early government of Israel politically, in spite of some great disadvantages, proved advantageous for Israel on the whole and served a great providential purpose. It safeguarded the individual liberties and rights of the Israelites. When later the monarchy was established, they enjoyed a degree of local freedom and self-control that was unknown in the rest of the Semitic world; there was home rule for every community, which admitted the untrammeled cultivation of their inherited religious and social institutions.<P>From the political point of view Israel, through the absence of a strong central government, was at a great disadvantage, making almost impossible its development into a world-empire. But this barrier to a policy of self-aggrandizement was a decided blessing from the viewpoint of Israel\'s providential mission to the world. It made possible the transmission of the pure religion entrusted to it, to later generations of men without destructive contamination from the ungodly forces with which Israel would inevitably have come into closer contact, had it not been for its self-contained character, resulting from the fashion of a state it was providentially molded into. Only as the small and insignificant nation that it was, could Israel perform its mission as "the depository and perpetuating agency of truths vital to the welfare of humanity." Thus its religion was the central authority of this nation, supplying the lack of a centralized government. Herein lay Israel\'s uniqueness and greatness, and also the secret of its strength as a nation, as long as the loyalty and devotion to Yahweh lasted. Under the leadership of Moses and Joshua who, though they exercised a royal authority, acted merely as representatives of Yahweh, the influence of religion of which these leaders were a personal embodiment was still so strong as to keep the tribes united for common action. But when, after the removal of these strong leaders, Israel no longer had a standing representative of Yahweh, those changes took place which eventually necessitated the establishment of the monarchy.<P>2. Period of Judges:<P>In the absence of a special representative of Yahweh, His will as Israel\'s King was divined by the use of the holy lot in the hand of the highest priest. But the lot would not supply the place of a strong personal leader. Besides, many of the Israelites came under the deteriorating influence of the Canaanite worship and began to adopt heathenish customs. The sense of religious unity weakened, the tribes became disunited and ceased to act in common, and as a result they were conquered by their foes. Yahweh came to their assistance by sending them leaders, who released the regions where they lived from foreign attacks. But these leaders were not the strong religious personalities that Moses and Joshua had been; besides, they had no official authority, and their rule was only temporary and local. It was now that the need of a centralized political government was felt, and the only type of permanent organization of which the age was cognizant was the kingship. The crown was offered to Gideon, but he declined it, saying: "Yahweh shall rule over you" (<a onClick="return mV(\'Jdg\',8,22,23);">Jud 8:22,23</a>). The attempt of his son, Abimelech, to establish a kingship over Shechem and the adjacent country, after the Canaanitic fashion, was abortive.<P>The general political condition of this period is briefly and pertinently described by the oft-recurring statement in Judges: "In those days there was no king in Israel: every man did that which was right in his own eyes."<P>3. Establishment of the Monarchy:<P>Not until the time of Samuel was a formal kingdom established over Israel. An attempt to ameliorate conditions by a union of civil and religious functions in the hands of Eli, the priest, had failed through the degeneracy of his sons. Similarly the hopes of Israel in a hereditary judgeship had been disappointed through the corruption of the sons of Samuel. The Philistines were threatening the independence and hope of Israel. Its very existence as a distinct race, and consequently the future of Yahweh\'s religion, imperatively demanded a king. Considering that it was the moral decline of the nation that had created the necessity for a monarchy, and moreover that the people\'s desire for a king originated from a purely national and not from a religious motive, the unwillingness of Samuel, at first, to comply with the demand for a king is not surprising. Even Yahweh declared: "They have not rejected thee but they have rejected me," etc. Instead of recognizing that they themselves were responsible for the failures of the past, they blamed the form of government they had, and put all their hopes upon a king. That it was not the monarchy as such that was objectionable to Yahweh and His prophet is evidenced by the fact that to the patriarchs the promise had been given: "Kings shall come out of thy loins" (<a onClick="return mV(\'Gen\',17,6);">Ge 17:6</a>; <a onClick="return mV(\'Gen\',35,11);">35:11</a>). In view of this Moses had made provision for a kingship (<a onClick="return mV(\'Deu\',17,\'14-20\');">De 17:14-20</a>). According to the Mosaic charter for the kingship, the monarchy when established must be brought into consonance with the fact that Yahweh was Israel\'s king. Of this fact Israel had lost sight when it requested a kingship like that of the neighboring peoples. Samuel\'s gloomy prognostications were perfectly justified in view of such a kingship as they desired, which would inevitably tend to selfish despotism (<a onClick="return mV(\'1Sa\',8,11);">1Sa 8:11</a>f). therefore God directs Samuel to give them a king—since the introduction of a kingship typifying the kingship of Christ lay within the plan of His economy—not according to their desire, but in accordance with the instructions of the law concerning kings (<a onClick="return mV(\'Deu\',17,\'14-20\');">De 17:14-20</a>), in order to safeguard their liberties and prevent the forfeiture of their mission.<P>4. Appointment of King:<P>According to the Law of Moses Yahweh was to choose the king of israel, who was to be His representative. The choice of Yahweh in the case of Saul is implied by the anointing of Saul by Samuel and through the confirmation of this choice by the holy lot (<a onClick="return mV(\'1Sa\',10,\'1-20\');">1Sa 10:1-20</a>). This method of choosing the king did not exclude the people altogether, since Saul was publicly presented to them, and acknowledged as king (<a onClick="return mV(\'1Sa\',10,24);">1Sa 10:24</a>). The participation of the people in the choice of their king is more pronounced in the case of David, who, having been designated as Yahweh\'s choice by being anointed by Samuel, was anointed again by the elders of Israel before he actually became king (<a onClick="return mV(\'2Sa\',2,4);">2Sa 2:4</a>).<P>The anointing itself signified the consecration to an office in theocracy. The custom of anointing kings was an old one, and by no means peculiar to Israel (<a onClick="return mV(\'Jdg\',9,8,15);">Jud 9:8,15</a>). The hereditary kingship began with David. Usually the firstborn succeeded to the throne, but not necessarily. The king might choose as his successor from among his sons the one whom he thought best qualified.<P>5. Authority of the King:<P>The king of Israel was not a constitutional monarch in the modern sense, nor was he an autocrat in the oriental sense. He was responsible to Yahweh, who had chosen him and whose vicegerent and servant he was. Furthermore, his authority was more or less limited on the religious side by the prophets, the representatives of Yahweh, and in the political sphere by the "elders," the representatives of the people, though as king he stood above all. Rightly conceived, his kingship in relation to Yahweh, who was Israel\'s true king, implied that he was Yahweh\'s servant and His earthly substitute. In relation to his subjects his kingship demanded of him, according to the Law, "that his heart be not lifted up above his brethren" (<a onClick="return mV(\'Deu\',17,20);">De 17:20</a>).<P>6. Duties of the King:<P>In a summary way the king was held responsible for all Israel as the Lord\'s people. His main duty was to defend it against its enemies, and for this reason it devolved upon him to raise and maintain a standing army; and it was expected of him that he be its leader in case of war (<a onClick="return mV(\'1Sa\',8,20);">1Sa 8:20</a>). In respect to the judiciary the king was a kind of supreme court, or court of final appeal, and as such, as in the days of Solomon, might be approached by his most humble subjects (<a onClick="return mV(\'2Sa\',15,2);">2Sa 15:2</a>; <a onClick="return mV(\'1Ki\',3,16);">1Ki 3:16</a>). Legislative functions he had none and was himself under the law (<a onClick="return mV(\'1Ki\',21,4);">1Ki 21:4</a>; <a onClick="return mV(\'Deu\',17,19);">De 17:19</a>). The king was also in a way the summus episcopus in Israel. His very kingship was of an entirely religious character and implied a unity of the heavenly and earthly rule over Israel through him who as Yahweh\'s substitute sat "upon the throne of the kingdom of Yahweh over Israel" (<a onClick="return mV(\'1Ch\',17,14);">1Ch 17:14</a>; <a onClick="return mV(\'1Ch\',28,5);">28:5</a>; <a onClick="return mV(\'1Ch\',29,23);">29:23</a>), who was "Yahweh\'s anointed" (<a onClick="return mV(\'1Sa\',24,10);">1Sa 24:10</a>; <a onClick="return mV(\'1Sa\',26,9);">26:9</a>; <a onClick="return mV(\'2Sa\',1,14);">2Sa 1:14</a>), and also bore the title of "son of Yahweh" and "the first-born," the same as Israel did (<a onClick="return mV(\'Exd\',4,22);">Ex 4:22</a>; <a onClick="return mV(\'Hsa\',11,1);">Ho 11:1</a>; <a onClick="return mV(\'2Sa\',7,14);">2Sa 7:14</a>; <a onClick="return mV(\'Psa\',89,27);">Ps 89:27</a>; <a onClick="return mV(\'Psa\',2,7);">2:7</a>). Thus a place of honor was assigned to the king in the temple (<a onClick="return mV(\'2Ki\',11,4);">2Ki 11:4</a>; <a onClick="return mV(\'2Ki\',23,3);">23:3</a>; <a onClick="return mV(\'Eze\',46,1,2);">Eze 46:1,2</a>); besides, he officiated at the national sacrifices (especially mentioned of David and Solomon). He prayed for his people and blessed them in the name of Yahweh (<a onClick="return mV(\'2Sa\',6,18);">2Sa 6:18</a>; <a onClick="return mV(\'2Sa\',24,25);">24:25</a>; <a onClick="return mV(\'1Ki\',3,4,8);">1Ki 3:4,8</a>; <a onClick="return mV(\'1Ki\',8,14,55,62);">8:14,55,62</a>; <a onClick="return mV(\'1Ki\',9,25);">9:25</a>). Apparently it was the king\'s right to appoint and dismiss the chief priests at the sanctuaries, though in his choice he was doubtless restricted to the Aaronites (<a onClick="return mV(\'1Ch\',16,37,39);">1Ch 16:37,39</a>; <a onClick="return mV(\'2Sa\',8,17);">2Sa 8:17</a>; <a onClick="return mV(\'1Ki\',2,27,35);">1Ki 2:27,35</a>). The priesthood was under the king\'s supervision to such an extent that he might concern himself about its organization and duties (<a onClick="return mV(\'1Ch\',15,16,23,24);">1Ch 15:16,23,24</a>; <a onClick="return mV(\'1Ch\',16,\'4-6\');">16:4-6</a>), and that he was responsible for the purity of the cult and the maintenance of the order of worship. In general he was to watch over the religious life and conduct of his people, to eradicate the high places and every form of idolatry in the land (<a onClick="return mV(\'2Ki\',18,4);">2Ki 18:4</a>). <a onClick="return mV(\'Eze\',45,22);">Eze 45:22</a> demands of the prince that he shall provide at the Passover a bullock for a sin offering for all the people.<P>7. The Symbols of Royal Dignity:<P>The marks of royal dignity, besides the beautiful robes in which the king was attired (<a onClick="return mV(\'1Ki\',22,10);">1Ki 22:10</a>), were:<P>(1) the diadem nezer) and the crown (atarah, <a onClick="return mV(\'2Sa\',1,10);">2Sa 1:10</a>; <a onClick="return mV(\'2Ki\',11,12);">2Ki 11:12</a>; <a onClick="return mV(\'2Sa\',12,30);">2Sa 12:30</a>), the headtire;<P>(2) the scepter (shebheT), originally a long, straight staff, the primitive sign of dominion and authority (<a onClick="return mV(\'Gen\',49,10);">Ge 49:10</a>; <a onClick="return mV(\'Num\',24,17);">Nu 24:17</a>; <a onClick="return mV(\'Isa\',14,5);">Isa 14:5</a>; <a onClick="return mV(\'Jer\',48,17);">Jer 48:17</a>; <a onClick="return mV(\'Psa\',2,9);">Ps 2:9</a>; <a onClick="return mV(\'Psa\',45,7);">45:7</a>). Saul had a spear (<a onClick="return mV(\'1Sa\',18,10);">1Sa 18:10</a>; <a onClick="return mV(\'1Sa\',22,6);">22:6</a>);<P>(3) the throne (kicce\',<a onClick="return mV(\'1Ki\',10,\'18-20\');">1Ki 10:18-20</a>), the symbol of majesty. Israel\'s kings also had a palace (<a onClick="return mV(\'1Ki\',7,\'1-12\');">1Ki 7:1-12</a>; <a onClick="return mV(\'1Ki\',22,39);">22:39</a>; <a onClick="return mV(\'Jer\',22,14);">Jer 22:14</a>), a royal harem (<a onClick="return mV(\'2Sa\',16,21);">2Sa 16:21</a>), and a bodyguard (<a onClick="return mV(\'2Sa\',8,18);">2Sa 8:18</a>; <a onClick="return mV(\'2Sa\',15,18);">15:18</a>).<P>8. Maintenance and Establishment:<P>(1) Income.<P>(a) According to the custom of the times presents were expected of the subjects (<a onClick="return mV(\'1Sa\',10,27);">1Sa 10:27</a>; <a onClick="return mV(\'1Sa\',16,20);">16:20</a>) and of foreigners (<a onClick="return mV(\'2Sa\',8,2);">2Sa 8:2</a>; <a onClick="return mV(\'1Ki\',5,1);">1Ki 5:1</a>ff; <a onClick="return mV(\'1Ki\',10,25);">10:25</a>; <a onClick="return mV(\'2Ch\',32,23);">2Ch 32:23</a>), and these often took the form of an annual tribute.<P>(b) In time of war the king would lay claim to his share of the booty (<a onClick="return mV(\'2Sa\',8,11);">2Sa 8:11</a>; <a onClick="return mV(\'2Sa\',12,30);">12:30</a>; <a onClick="return mV(\'1Ch\',26,27);">1Ch 26:27</a>).<P>(c) Various forms of taxes were in vogue, as a part of the produce of the land (<a onClick="return mV(\'1Ki\',9,11);">1Ki 9:11</a>; <a onClick="return mV(\'1Sa\',17,25);">1Sa 17:25</a>), forced labor of the Canaanites (<a onClick="return mV(\'1Ki\',9,20);">1Ki 9:20</a>; <a onClick="return mV(\'2Ch\',2,16);">2Ch 2:16</a>) and also of the Israelites (<a onClick="return mV(\'1Ki\',5,13);">1Ki 5:13</a>; <a onClick="return mV(\'1Ki\',11,28);">11:28</a>; <a onClick="return mV(\'1Ki\',12,4);">12:4</a>), the first growth of the pasture lands (<a onClick="return mV(\'Amo\',7,1);">Am 7:1</a>), toll collected from caravans (<a onClick="return mV(\'1Ki\',10,15);">1Ki 10:15</a>).<P>(d) Subdued nations had to pay a heavy tribute (<a onClick="return mV(\'2Ki\',3,4);">2Ki 3:4</a>).<P>(e) The royal domain often comprised extensive possessions (<a onClick="return mV(\'1Ch\',27,\'25-31\');">1Ch 27:25-31</a>).<P>(2) The Royal Court.<P>The highest office was that of the princes (<a onClick="return mV(\'1Ki\',4,2);">1Ki 4:2</a>), who were the king\'s advisers or counselors. In <a onClick="return mV(\'2Ki\',25,19);">2Ki 25:19</a> and <a onClick="return mV(\'Jer\',52,25);">Jer 52:25</a> they are called "they that saw the king\'s face" (compare also <a onClick="return mV(\'1Ki\',12,6);">1Ki 12:6</a>, "stood before Solomon"). The following officers of King David are mentioned: the captain of the host (commander-in-chief), the captain of the Cherethites and the Pelethites (bodyguard), the recorder (chronicler and reminder), the scribe (secretary of state), the overseer of the forced labor, the chief ministers or priests (confidants of the king, usually selected from the royal family) (<a onClick="return mV(\'2Sa\',8,\'16-18\');">2Sa 8:16-18</a>; <a onClick="return mV(\'2Sa\',20,\'23-26\');">20:23-26</a>).<P>During the reign of Solomon other officers were added as follows: the overseer over the twelve men "who provided victuals for the king and his household" (<a onClick="return mV(\'1Ki\',4,5,7);">1Ki 4:5,7</a>), the officer over the household (<a onClick="return mV(\'1Ki\',4,6);">1Ki 4:6</a>; <a onClick="return mV(\'1Ki\',18,3);">18:3</a>) (steward, the head of the palace who had "the key" in his possession, <a onClick="return mV(\'Isa\',22,22);">Isa 22:22</a>); the king\'s friend (<a onClick="return mV(\'1Ki\',4,5);">1Ki 4:5</a>; <a onClick="return mV(\'1Ch\',27,33);">1Ch 27:33</a>) is probably the same as the king\'s servant mentioned among the high officials in <a onClick="return mV(\'2Ki\',22,12);">2Ki 22:12</a>. It is not stated what his duties were. Minor officials are servants, cupbearer (<a onClick="return mV(\'1Ki\',10,5);">1Ki 10:5</a>), keeper of the wardrobe (<a onClick="return mV(\'2Ki\',22,14);">2Ki 22:14</a>; <a onClick="return mV(\'2Ki\',10,22);">10:22</a>), eunuchs (chamberlains, not mentioned before the division of the kingdom) (<a onClick="return mV(\'1Ki\',22,9);">1Ki 22:9</a>; <a onClick="return mV(\'2Ki\',8,6);">2Ki 8:6</a>).<P>9. Short Character Sketch of Israel\'s Kingdom:<P>No higher conceptions of a good king have ever been given to the world than those which are presented in the representations of kingship in the Old Testament, both actual and ideal. Though Samuel\'s characterization of the kingship was borne out in the example of a great number of kings of Israel, the Divine ideal of a true king came as near to its realization in the case of one king of Israel, at least, as possibly nowhere else, namely, in the case of David. Therefore King David appears as the type of that king in whom the Divine ideal of a Yahweh-king was to find its perfect realization; toward whose reign the kingship in Israel tended. The history of the kingship in Israel after David is, indeed, characterized by that desire for political aggrandizement which had prompted the establishment of the monarchy, which was contrary to Israel\'s Divine mission as the peculiar people of the Yahweh-king. When Israel\'s kingdom terminated in the Bah exile, it became evident that the continued existence of the nation was possible even without a monarchical form of government. Though a kingdom was established again under the Maccabees, as a result of the attempt of Antiochus to extinguish Israel\'s religion, this kingdom was neither as perfectly national nor as truly religious in its character as the Davidic. It soon became dependent on Rome. The kingship of Herod was entirely alien to the true Israelite conception.<P>It remains to be said only that the final attempt of Israel in its revolt against the Roman Empire, to establish the old monarchy, resulted in its downfall as a nation, because it would not learn the lesson that the future of a nation does not depend upon political greatness, but upon the fulfillment of its Divine mission.<P>LITERATURE.<P>J.P. McCurdy, History, Prophecy and the Monuments; Riehm, Handwiirterbuch des bibl. Alterrums; Hastings, Dictionary of the Bible (five volumes); Kinzler, Bibl. Altes Testament.``141';
isbe[5322]='Kingdom of God (of Heaven), the`(he basileia ton ouranon; he basileia tou theou):<P><b>I. MEANING AND ORIGIN OF THE TERM</b><P class="in15">1. Place in the Gospels<P class="in15">2. "Kingdom of Heaven" and "Kingdom of God"<P class="in15">3. Relation to the Old Testament (Daniel, etc.)<P><b>II. ITS USE BY JESUS—CONTRAST WITH JEWISH CONCEPTIONS</b><P class="in15">1. Current Jewish Opinions<P class="in15">2. Relation of Jesus to Same<P class="in15">3. Growing Divergence and Contrast<P class="in15">4. Prophetic Character of the "Temptation"<P class="in15">5. Modern "Futuristic" Hypothesis (J. Weiss, Schweitzer)<P class="in15">6. Weakness of This View<P class="in15">7. Positive Conceptions of Jesus<P><b>III. THE IDEA IN HISTORY</b><P class="in15">1. Apostolic and Post-apostolic Age<P class="in15">2. Early Christian Centuries<P class="in15">3. Reformation Period<P class="in15">4. Later Ideas<P><b>IV. PLACE IN THEOLOGY</b><P class="in15">1. Danger of Exaggeration<P class="in15">2. Elements of Living Power in Idea<P><b>LITERATURE</b><hr /><P>The "kingdom of God" is one of the most remarkable ideas and phrases of all time, having begun to be used very near the beginnings of history and continuing in force down to the present day.<P>I. Meaning and Origin of the Term<P>1. Place in the Gospels:<P>Its use by Jesus is by far its most interesting aspect; for, in the Synoptists, at least, it is His watchword, or a comprehensive term for the whole of His teaching. Of this the ordinary reader of Scripture may hardly be aware, but it becomes evident and significant to the student. Thus, in <a onClick="return mV(\'Mat\',4,23);">Mt 4:23</a>, the commencement of the ministry is described in these words, "And Jesus went about in all Galilee, teaching in their synagogues, and preaching the gospel of the kingdom, and healing all manner of disease and all manner of sickness among the people"; and, somewhat later, in <a onClick="return mV(\'Luk\',8,1);">Lu 8:1</a>, the expansion o
