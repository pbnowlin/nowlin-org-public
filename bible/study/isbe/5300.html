isbe[5328]='Kinsman; Kinswoman`kinz\'-man, kinz\'-woom-an: Most frequently of the go\'-el, the one who had a right to "redeem"; referring to the custom of avenging the blood of a slain kinsman; hence, a blood relative (<a onClick="return mV(\'Num\',5,8);">Nu 5:8</a>; <a onClick="return mV(\'Rth\',2,20);">Ru 2:20</a>; <a onClick="return mV(\'Rth\',3,9,12);">3:9,12</a>; <a onClick="return mV(\'Rth\',4,1,3,6,8,14);">4:1,3,6,8,14</a>; compare "performing the part of a kinsman," <a onClick="return mV(\'Rth\',3,13);">Ru 3:13</a>); in <a onClick="return mV(\'Rth\',2,1);">Ru 2:1</a>, better rendered "acquaintance." Also qarobh, one near, rendered "kinsman" (<a onClick="return mV(\'Psa\',38,11);">Ps 38:11</a>); probably better, "neighbor." Once, she\'-er, "flesh kin," rendered "kinsman" (<a onClick="return mV(\'Num\',27,11);">Nu 27:11</a>; compare <a onClick="return mV(\'Lev\',18,6);">Le 18:6</a>; <a onClick="return mV(\'Lev\',25,49);">25:49</a>; <a onClick="return mV(\'Lev\',20,19);">20:19</a>; <a onClick="return mV(\'Lev\',21,2);">21:2</a>, rendered "kin"). suggenes, "of same race" (compare suggebeia, "kindred"), used of blood relationship of varying degrees of nearness (<a onClick="return mV(\'Luk\',14,12);">Lu 14:12</a>; <a onClick="return mV(\'Jhn\',18,26);">Joh 18:26</a>; <a onClick="return mV(\'Act\',10,24);">Ac 10:24</a>; <a onClick="return mV(\'Rom\',9,3);">Ro 9:3</a>; <a onClick="return mV(\'Rom\',16,7,11,21);">16:7,11,21</a>). Rendered "kin" in <a onClick="return mV(\'Mar\',6,4);">Mr 6:4</a>.<P>Kinswoman:<P>she\'er, "kin by blood," or "by flesh" (compare above; also <a onClick="return mV(\'Lev\',18,12);">Le 18:12</a>f; also compare <a onClick="return mV(\'Lev\',18,6);">18:6</A>, "near of kin" the King James Version); also same root, ferm. form, sha\'-arah (<a onClick="return mV(\'Lev\',18,17);">Le 18:17</a>), is thy "kinswoman." In <a onClick="return mV(\'Pro\',7,4);">Pr 7:4</a>, "Call understanding thy kinswoman" might be more accurately rendered, "thy familiar friend," the Revised Version margin (from modha\', "acquaintance"); compare similar rendering of modha\'ath, under <a href="./study/isbe/search.html?string=KINDRED">KINDRED</a>. <a onClick="return mV(\'Luk\',1,36);">Lu 1:36</a> the Revised Version (British and American), "kinswoman" (suggenis), the King James Version "cousin" (suggenes); same is rendered "kinsfolk" (<a onClick="return mV(\'Luk\',1,58);">Lu 1:58</a> the Revised Version (British and American)).``137';
isbe[5329]='Kir`kur, kir (kir):<P>1. Meaning:<P>The meaning of Kir is "inclosure" or "walled place," and it is therefore doubtful whether it is a place-name in the true sense of the word. In <a onClick="return mV(\'2Ki\',16,9);">2Ki 16:9</a> it is mentioned as the place whither Tiglath-pileser IV carried the Syrian (Aramean) captives which he deported from Damascus after he had taken that city. In <a onClick="return mV(\'Amo\',1,5);">Am 1:5</a> the prophet announces that the people of Syria (Aram) shall go into captivity unto Kir, and in <a onClick="return mV(\'Amo\',9,7);">9:7</A> it is again referred to as the place whence the Lord had brought the Syrians (Arameans) as Israel had been brought out of Egypt, and the Philistines from Caphtor.<P>2. How Rendered in the Septuagint:<P>Except in one manuscript (Septuagint, Codex Alexandrinus), where it appears as the Libyan Cyrene (<a onClick="return mV(\'2Ki\',16,9);">2Ki 16:9</a>), it is never rendered in the Septuagint as a place-name. Thus the place whence the Syrians were brought (<a onClick="return mV(\'Amo\',9,7);">Am 9:7</a>) is not Kir, but "the deep" or "the ditch" Septuagint ek bothrou, "pit"), probably a translation of some variant rather than of the word "Kit" itself. Comparing the Assyrian-Babylonian kiru (for qiru), "wall," "inclosure," "interior," or the like, Kir might have the general meaning of a place parted off for the reception of exiled captives. Parallels would be Kir Moab, "the enclosure of Moab," Kir Heres or Kir Chareseth, "the enclosure of brick" Septuagint hoi lithoi toni toichou). It seems probable that there was more than one place to which the Assyrians transported captives or exiles, and if their practice was to place them as far as they could from their native land, one would expect, for Palestinian exiles, a site or sites on the eastern side of the Tigris and Euphrates.<P>3. An Emendation of <a onClick="return mV(\'Isa\',22,5);">Isaiah 22:5</a>:<P>In <a onClick="return mV(\'Isa\',22,5);">Isa 22:5</a> occurs the phrase, "a breaking down of the walls, and a crying to the mountains" (meqarqar qir we-shoa\' \'el ha-har—"a surrounding of the wall," etc., would be better), and the mention of qir and shoa\' here has caused Fried. Delitzsch to suggest that we have to read, instead of qir, qoa\', combined with shoa\', as in <a onClick="return mV(\'Eze\',23,23);">Eze 23:23</a>. Following this, but retaining qir, Cheyne translates "Kir undermineth, and Shoa is at the mount," but others accept Delitzsch\'s emendation, Winckler conjecturing that the rendering should be "Who stirreth up Koa\' and Shoa\' against the mountain" (Alttest. Untersuchungen, 177). In the next verse (<a onClick="return mV(\'Isa\',22,6);">Isa 22:6</a>) Kir is mentioned with Elam—a position which a city for western exiles would require.<P>4. Soldiers of Kir in Assyrian Army:<P>The mention of Elam as taking the quiver, and Kir as uncovering the shield, apparently against "the valley of the vision" (in or close to Jerusalem), implies that soldiers from these two places, though one might expect them to be hostile to the Assyrians in general, were to be found in their armies, probably as mercenaries. See Fried. Delitzsch, Wo lag das Paradies? 233; Schrader, COT, 425.``136';
isbe[5330]='Kir of Moab`(qir moa\'-abh; Septuagint has to teichos, "the wall," "fortress"):<P>1. Identification:<P>The name, at least in this form, appears only once (<a onClick="return mV(\'Isa\',15,1);">Isa 15:1</a>) as that of a city in Moab. It is named with Ar of Moab, with which possibly it may be identical, since \'ar or \'ir is the Hebrew equivalent of the Moabite Qir. The Targum hence reads "Kerak in Moab." There can be no doubt that the Kerak here intended is represented by the modern town of that name, with which, consequently, Kir Moab is almost universally identified. It must always have been a place of importance. It is mentioned as Charakmoba (Karakmoba) in the Acts of the Council of Jerusalem (536 AD) and by the early geographers. It dominated the great caravan road connecting Syria with Egypt and Arabia. The Crusaders therefore directed attention to it, and held possession from 1167 till it fell again into the hands of the Moslems under Saladin, 1188. The Chroniclers speak of it as in el Belqa, and the chief city of Arabia Secunda. Under the title of Petra Deserti the Crusaders founded here a bishop\'s see. The Greek bishop of Petra still has his seat in Kerak.<P>2. Discription:<P>Kerak stands upon a lofty spur projecting westward from the Moab plateau, with Wady \'Ain Franjy on the south, and Wady el-Kerak on the north, about 10 miles from the Dead Sea. The sides of the mountain sink sharply into these deep ravines, which unite immediately to the west, and, as Wady el-Kerak, the great hollow runs northwestward to the sea. It is a position of great natural strength, being connected with the uplands to the east only by a narrow neck. It <span clas="noTag">is</span> 3,370 ft. above the level of the sea. The mountains beyond the adjacent valleys are much higher. The place was surrounded by a strong wall, with five towers, which can still be traced in its whole length. The most northerly tower is well preserved. The most interesting building at Kerak is the huge castle on the southern side. It is separated from the adjoining hill on the right by a large artificial moat; and it is provided with a reservoir. A moat also skirts the northern side of the fortress, and on the east the wall has a sloped or battered base. The castle is then separated from the town. The walls are very thick, and are well preserved. Beneath the castle is a chapel in which traces of frescoes are still visible. In days of ancient warfare the place must have been practically impregnable. It could be entered only by two roads passing through rock-cut tunnels. The main danger must always have been failure of water supply. There are springs immediately outside the city; but those alone would not be sufficient. Great cisterns were therefore constructed in the town and also in the castle. The half-nomadic inhabitants of Kerak today number some 1,140 families (Musil, Arabia Petrea, III, 97). The Greek church claims about 2,000 souls; the rest are Moslems. They are wild and fearless people, not greatly inclined to treat strangers with courtesy and kindness. In the spring of 1911 the town was the center of a rising against the government, which was not quelled until much blood had been shed.``54';
isbe[5331]='Kirama`ki-r\'-ma, kir\'-a-ma (Kirama; the King James Version, Cirama): The people of Kirama returned with Zerubbabel from Babylon (1Esdras 5:20); the "Ramah" of <a onClick="return mV(\'Ezr\',2,26);">Ezr 2:26</a> (which see).``1';
isbe[5332]='Kiriath`kir\'-i-ath (qiryath, "city"; the King James Version Kirjath): Mentioned (<a onClick="return mV(\'Jos\',18,28);">Jos 18:28</a>) as a city of Benjamin; has been identified with Kuriet el \'Enab, "town of grapes," a prosperous town on the highroad between Jerusalem and Jaffa; it is sometimes spoken of by the inhabitants as Qurieh. It is, however, generally thought that Kiriath here stands for <a href="./study/isbe/search.html?string=KIRIATH-JEARIM">KIRIATH-JEARIM</a> (which see). See PEF, III, 132, Sh XVII.``1';
isbe[5333]='Kiriath-Arba`kir-i-ath-ar\'-ba.`<a href="./study/isbe/search.html?string=HEBRON">HEBRON</a>`1';
isbe[5334]='Kiriath-Arim`kir-i-ath-a\'-rim (<a onClick="return mV(\'Ezr\',2,25);">Ezr 2:25</a>).`<a href="./study/isbe/search.html?string=KIRIATH+JEARIM">KIRIATH-JEARIM</a>`1';
isbe[5335]='Kiriath-Baal`kir-i-ath-ba\'-al`<a href="./study/isbe/search.html?string=KIRIATH-JEARIM">KIRIATH-JEARIM</a>`1';
isbe[5336]='Kiriath-Huzoth`kir-i-ath hu\'-zoth: qiryath-chutsoth, "city of streets"; Septuagint reads) poleis epauleon, "city of villages," from which we may infer a reading chatseroth, for chutsoth; the King James Version, Kirjathhuzoth): A place to which, after their meeting, Balak and Balaam went together (<a onClick="return mV(\'Num\',22,39);">Nu 22:39</a>). They met at "the City of Moab" (<a onClick="return mV(\'Num\',22,36);">Nu 22:36</a>), which is probably identical with <a href="./study/isbe/search.html?string=KIR+OF+MOAB">KIR OF MOAB</a> (which see); Kiriath-huzoth was probably therefore not far from that city. Some would identify it with Kiriathaim; some with Kerioth; as yet there is no certainty.``1';
isbe[5337]='Kiriath-Jearim`kir-i-ath je\'-a-rim, kir-i-ath je-a\'-rim (qiryath-ye\'-arim, "city of thickets"; Septuagint he polis Iareim; the King James Version Kirjathjearim): One of the four chief cities of the Gibeonites (<a onClick="return mV(\'Jos\',9,17);">Jos 9:17</a>); a city, of Judah (<a onClick="return mV(\'Jos\',15,60);">Jos 15:60</a>), evidently an ancient, Semitic "high place", hence, the name "Kiriath-Baal" (same place); it was one of the places on the border line between Judah and Benjamin (<a onClick="return mV(\'Jos\',18,14,15);">Jos 18:14,15</a>; <a onClick="return mV(\'Jos\',15,11);">15:11</a> (where it is called "Baalah"); compare <a onClick="return mV(\'1Ch\',13,6);">1Ch 13:6</a>). It is mentioned as in Judah (<a onClick="return mV(\'Jos\',15,60);">Jos 15:60</a>; <a onClick="return mV(\'Jos\',18,14);">18:14</a>; <a onClick="return mV(\'Jdg\',18,12);">Jud 18:12</a>), but if <a href="./study/isbe/search.html?string=KIRIATH">KIRIATH</A> (which see) is identical with it, it is mentioned as belonging to Benjamin (<a onClick="return mV(\'Jos\',18,28);">Jos 18:28</a>; in <a onClick="return mV(\'2Sa\',6,2);">2Sa 6:2</a>, Baale-judah).<P>1. Scripture References:<P><a onClick="return mV(\'Jdg\',18,12);">Jud 18:12</a> records that the men of Dan set forth out of Zorah and Eshtaol and encamped in Mahaneh-dan behind (west of) Kiriath-jearim. (In <a onClick="return mV(\'Jdg\',13,25);">Jud 13:25</a> Mahaneh-dan ("the camp of Dan") is described as between Zorah and Eshtaol; see <a href="./study/isbe/search.html?string=MAHANEH-DAN">MAHANEH-DAN</a>.) To this sanctuary the ark of Yahweh was brought, from Beth-shemesh by the people of Kiriath-jearim, and they "brought it into the house of Abinadab in the hill (m "Gibeah"]; and sanctified Eleazar his son to keep the ark of Yahweh" (<a onClick="return mV(\'1Sa\',7,1);">1Sa 7:1</a>). Here it abode twenty years (<a onClick="return mV(\'1Sa\',7,2);">1Sa 7:2</a>; <a onClick="return mV(\'2Sa\',6,\'2-4\');">2Sa 6:2-4</a>; compare <a onClick="return mV(\'1Ch\',13,6);">1Ch 13:6</a>; <a onClick="return mV(\'2Ch\',1,4);">2Ch 1:4</a>). Clearly it was in the hills somewhere to the east of Beth-shemesh.<P>The prophet Uriah-ben-shemaiah, killed by Jehoiskim, belonged to Kiriath-jearim (<a onClick="return mV(\'Jer\',26,20);">Jer 26:20</a>f).<P>In <a onClick="return mV(\'Ezr\',2,25);">Ezr 2:25</a> (compare <a onClick="return mV(\'Neh\',7,29);">Ne 7:29</a>), this place occurs under the name "Kiriath-arim." In 1Esdras 5:19 the name occurs as "Kiriathiarius."<P>2. Position:<P>The exact position of this important Israelite sanctuary has never been satisfactorily settled. Some of the data appear to be contradictory. For example, Josephus (Ant., VI, i, 4) says it was a city in the neighborhood of Beth-shemesh, while Eusebius and Jerome (Onomasticon) speak of it ("Cariathiareim") in their day as a village 9 or 10 miles from Jerusalem on the way to Lydda. But it is open to doubt whether the reputed site of their day had any serious claims. Any suggested site should fulfill the following conditions:<P>(1) It must harmonize with the boundary line of Judah and Benjamin between two known points—the "waters of Nephtoah," very generally supposed to be Lifta, and Chesalon, certainly Kesla (<a onClick="return mV(\'Jos\',15,10);">Jos 15:10</a>).<P>(2) It should not be too far removed from the other cities of the Gibeonites—Gibeon, Chephirah and Beeroth—but those places, which are all identified, are themselves fairly widely apart.<P>(3) Mahaneh-dan ("the camp of Dan") is described as between Zorah and Eshtaol, and was west of Kiriath-jearim; this, and the statement of Josephus that it was in the neighborhood of Beth-shemesh, makes it probable that the site was near the western edge of the mountains of Judah. Zorah (now Sara\'), Eshtaol (now Eshu\'a) and Beth-shemesh (now \'Ain Shems), are all within sight of each other close to the Vale of Sorek.<P>(4) The site should be a sanctuary (or show signs of having been such), and be at least on a height (Gibeah, <a onClick="return mV(\'1Sa\',7,1);">1Sa 7:1</a> margin).<P>(5) The name may help us, but it is as well to note that the first part of the name, in the form "Kirathiarius" (1Esdras 5:19), appears to have survived the exile rather than the second.<P>3. Suggested Identifications:<P>The first suggested identification was that of Robinson (BE, II, 11, 12), namely, Kuriet el \'Enab, the "town of grapes," a flourishing little town about 9 miles west of Jerusalem on the carriage road to Jaffa. The district around is still fairly well wooded (compare ye\'arim = "thickets"). This village is commonly known as Abu Ghosh, from the name of a robber chieftain who, with his family, flourished there in the first half of the last century. Medieval ecclesiastical tradition has made this place the Anathoth of Jeremiah, and a handsome church from the time of the Crusades, now thoroughly repaired, exists here to mark this tradition. This site suits well as regards the border line, and the name Quriet is the exact equivalent of Kiriath; it also fits in with the distance and direction given the Eusebius, Onomasticon, but it cannot be called satisfactory in all respects. Soba, in the neighborhood, has, on account of its commanding position, been selected, but except for this one feature it has no special claims. The late Colonel Conder has very vigorously advocated the claims of a site he discovered on the south side of the rugged Wady Ismae\'n, called Khurbet \'Erma, pointing out truly that \'Erma is the exact equivalent of \'Arim (<a onClick="return mV(\'Ezr\',2,25);">Ezr 2:25</a>). Unfortunately the 2nd part of the name would appear from the references in 1Esdras and in Eusebius (Onomasticon) to be that part which was forgotten long ago, so that the argument even of the philological—the strongest—grounds cannot be of much value. The greatest objections in the minds of most students are the unsuitability of the position to the requirements of the Judah-Benjamin frontier and its distance from the other Gibeonite cities.<P>The present writer suggests another site which, in his opinion, meets at least some of the requirements better than the older proposals. Standing on the hill of Beth-shcmesh and looking northwest, with the cities of Zorah (Sur\'ah) and Eshtaol (Eshu\'-a) full in view, a lofty hill crowned by a considerable forest catches the eye. The village a little below the summit is called Beit Machcir, and the hilltop itself is the shrine of a local saint known as Sheikh el Ajam. So "holy" is the site, that no trees in this spot are ever cut, nor is fallen brushwood removed. There is a Wely or sanctuary of the saint, and round about are scores of very curious and apparently ancient graves. Southward from this site the eye follows the line of Judean hills—probably the Mt. Jearim of <a onClick="return mV(\'Jos\',15,10);">Jos 15:10</a>—until it strikes the outstanding point of Kesla (Chesslon), some 2 miles to the south. If the ark was taken here, the people of Beth-shemesh could have followed its progress almost the whole way to its new abode. Although the name, which appears to mean "besieged" or "confined," in no degree helps, in all the other respects (see 2 above), this site suits well the conditions of Kiriath-jearim.<P>LITERATURE.<P>See PEFS, 1878, 196-99; PEF, III, 43-52; HGHL, 225f; BR, II, 11f; Buhl, G A the Priestly Code (P), Index.``117';
isbe[5338]='Kiriath-Sannah`kir-i-ath-san\'-a (qiryath sannah; the King James Version Kirjath Sannah): In <a onClick="return mV(\'Jos\',15,49);">Jos 15:49</a> it is called "Debir," and is identical with <a href="./study/isbe/search.html?string=KIRIATH-SEPHER">KIRIATH-SEPHER</a> (which see). Aspolis grammaton, "city of books," is the reading in Septuagint, the most natural explanation is that cannah, is a copyist\'s error for cepher, but Sayce considers this an ancient Canaanite name meaning "city of instruction," and that it occurs in the Tell el-Amarna Letters in the form "Bit\' sani."``1';
isbe[5339]='Kiriath-Sepher`kir-i-ath-se\'-fer (qiryath cepher; translated by many, as if it were Hebrew, as "house of books." Septuagint polis grammaton; the King James Version, Kirjath Sepher; other suggestions have been made: "border-town" (Moore) or "tolltown" (G.A. Smith): In two parallel passages (<a onClick="return mV(\'Jos\',15,15);">Jos 15:15</a>f; <a onClick="return mV(\'Jdg\',1,11);">Jud 1:11</a>f), it is mentioned as identical with <a href="./study/isbe/search.html?string=DEBIR">DEBIR</a> (which see), which has been frequently identified with edh-Dhaheriyeh. Sayce would place Kiriath-Sepher to the W. of Gath. See PEFS, 1893, 33-35.``1';
isbe[5340]='Kiriathaim`kir-i-aitha\'-im (qiryathaym, "two cities"; the King James Version, Kirjathaim):<P>(1) A city in the uplands of Moab formerly held by Sihon, and given by Moses to Reuben, who is said to have fortified it (<a onClick="return mV(\'Num\',32,37);">Nu 32:37</a>; <a onClick="return mV(\'Jos\',13,19);">Jos 13:19</a>). It is named along with Elealeh and Nebo in the former passage, and with Sibmah in the latter. It was in the hands of Moab in Mesha\'s time, and he claims to have fortified it (M S, l.10). For Jeremiah (<a onClick="return mV(\'Jer\',48,1,23);">48:1,23</a>) and Ezekiel (<a onClick="return mV(\'Eze\',25,9);">25:9</a>) it is a Moabite town. Eusebius, Onomasticon, identifies it with Coraitha, a Christian village 10 Roman miles west of Madeba. This is the modern Qaraiyat, about 11 miles west of Madeba, and 5 miles east of Macherus. This, however, may represent Kerioth, while the towns with which it is named would lead us to look for Kiriathaim to the north of Wady Zerqa Ma\'in. From this city was named Shaveh-kiriathaim, "the plain of Kiriathaim" (<a onClick="return mV(\'Gen\',14,5);">Ge 14:5</a>).<P>(2) A city in the territory of Naphtali, assigned to the Gershonite Levites (<a onClick="return mV(\'1Ch\',6,76);">1Ch 6:76</a>), corresponding to "Kartan" in <a onClick="return mV(\'Jos\',21,32);">Jos 21:32</a>.``54';
isbe[5341]='Kirjath`kur\'-jath, kir\'-jath.`<a href="./study/isbe/search.html?string=KIRIATH">KIRIATH</a>`1';
isbe[5342]='Kirjath-Arba`kur-jath-ar\'-ba, kir-jath-ar\'-ba.`<a href="./study/isbe/search.html?string=KIRIATH-ARBA">KIRIATH-ARBA</a>`1';
isbe[5343]='Kirjath-Baal`kur-jath-ba\'-al, kir-jath-ba\'-al.`<a href="./study/isbe/search.html?string=KIRIATH-JEARIM">KIRIATH-JEARIM</a>`1';
isbe[5344]='Kirjathaim`kur-ja-tha\'-im, kir-ja-tha\'-im.`<a href="./study/isbe/search.html?string=KIRIATHAIM">KIRIATHAIM</a>`1';
isbe[5345]='Kiseus`kis-e\'-us (Kiseus; Septuagint, Codex Vaticanus (Swete) reads Keisaios; the King James Version, Cisai): The great-grandfather of Mordecai (<span class="noTag">Additions to Esther 11:2</span>).`<a href="./study/isbe/search.html?string=KISH">KISH</a>`1';
isbe[5346]='Kish`kish (qish; Kis, Keis, "bow," "power"): The name of five persons mentioned in the Bible:<P>(1) The son of Abiel and the father of Saul, the first king of Israel. He was of the tribe of Benjamin, of the family of the Matrites (<a onClick="return mV(\'1Sa\',9,1);">1Sa 9:1</a>; <a onClick="return mV(\'1Sa\',14,51);">14:51</a>; compare <a onClick="return mV(\'Act\',13,21);">Ac 13:21</a>; <a onClick="return mV(\'1Sa\',10,21);">1Sa 10:21</a>). According to <a onClick="return mV(\'1Ch\',8,33);">1Ch 8:33</a> and <a onClick="return mV(\'1Ch\',9,39);">9:39</A>, "Ner begat Kish" By reading "Ner begat Abner" (compare <a onClick="return mV(\'1Sa\',14,51);">1Sa 14:51</a>; <a onClick="return mV(\'1Ch\',6,28);">1Ch 6:28</a>), the difficulty is at least partly overcome. In <a onClick="return mV(\'1Ch\',12,1);">1Ch 12:1</a>, Kish is also mentioned as the father of Saul, and again in <a onClick="return mV(\'2Sa\',21,14);">2Sa 21:14</a>, we are told that the sepulcher of Kish was located in the country of Benjamin, in Zela. His place of residence seems to have been at Gibeah.<P>(2) Another Kish is mentioned (<a onClick="return mV(\'1Ch\',8,29);">1Ch 8:29</a>f; <a onClick="return mV(\'1Ch\',9,35);">9:35</a>f) as the son of Jeiel and his wife Maacah. He is usually supposed to be the uncle of Saul\'s father.<P>(3) A Levite, the son of Mahli the Merarite (<a onClick="return mV(\'1Ch\',23,21);">1Ch 23:21</a>f; compare <a onClick="return mV(\'1Ch\',24,29);">24:29</a>).<P>(4) Another Merarite Levite in the time of Hezekiah (<a onClick="return mV(\'2Ch\',29,12);">2Ch 29:12</a>).<P>(5) The great-grandfather of Mordecai, of the tribe of Benjamin (<a onClick="return mV(\'Est\',2,5);">Es 2:5</a>).``8';
isbe[5347]='Kishi`kish\'i (qishi, "snarer," "fowler"): Father of Ethan, one of the singers David "set over the service of song" in the house of the Lord (<a onClick="return mV(\'1Ch\',6,31);">1Ch 6:31</a>); the "Kushaiah" of <a onClick="return mV(\'1Ch\',15,17);">1Ch 15:17</a> (compare <a onClick="return mV(\'1Ch\',6,44);">1Ch 6:44</a>).``1';
isbe[5348]='Kishion`kish\'-i-on, kish\'-yon (qishyon): A city in the territory of Issachar (<a onClick="return mV(\'Jos\',19,20);">Jos 19:20</a>), given to the Gershonite Levites (<a onClick="return mV(\'Jos\',21,28);">21:28</A>; the King James Version wrongly "Kishon"). The parallel passage in <a onClick="return mV(\'1Ch\',6,72);">1Ch 6:72</a> reads "Kedesh" instead of "Kishion." The true reading is probably qidhshon. Conder suggests a likely identification with Tell Abu Kedes, not far from Taanach.``1';
isbe[5349]='Kishon`ki\'-shon, kish\'on (qishon; Keison): The "watercourse" or "torrent stream" along the banks of which the great battle was fought between Israel, led by Deborah and Barak, and the army of Sisera, in the waters of which so many perished (<a onClick="return mV(\'Jdg\',4,7);">Jud 4:7</a>, etc.). It is probably mentioned earlier as "the brook that is before Jokneam" (<a onClick="return mV(\'Jos\',19,11);">Jos 19:11</a>; see <a href="./study/isbe/search.html?string=JOKNEAM">JOKNEAM</a>). It appears again as the scene of Elijah\'s slaughter of the prophets of Baal (<a onClick="return mV(\'1Ki\',18,40);">1Ki 18:40</a>). "The torrent" par excellence in the district is the modern el-Muqatta\', a stream which drains all the plain of Esdraelon to the west of the watershed—a line drawn from Iksal to Nain, and thence to el-Fuleh and Zer\'in. All the water east of this line, from the Nazareth hills, Tabor and Little Hermon, flows down Wady esh-Sherrar and Nahr Jalud into the Jordan. The Kishon collects the streams from the western slopes of Gilboa in the rainy season; and the water from the strong spring at Jenin. Contributions also come from the copious fountains in the neighborhood of Megiddo. At Sa\'adiyeh, again, some 3 miles east of Chaifa, its volume is largely increased by springs rising at the base of Carmel, on the edge of the plain of Acre. From Jenin in the southeast, the deep torrent bed follows a westerly direction, with numerous. windings cutting the plain in two, until it reaches the pass at the northeastern base of Carmel. Through the gorge between the mountain and the hills of Galilee it reaches the plain of Acre. From Sa\'adiyeh it flows in a deep sluggish stream through the marsh-land to the sea near Chaifa. In this part the crocodile is said to have been seen at times.<P>In the summer season the water from the springs is largely absorbed by irrigation, and the upper reaches of the river are soon dry. The bed runs along the bottom of a trench some 20 ft. deep through the plain. It is easily crossed at the fords by those who know how to avoid the localities of the springs. In time of heavy rains the trench is swiftly filled, and the soft soil of the plain goes to mud. Remembering this, it is easy to understand the disaster that overwhelmed the heavily armed cavalry and chariots of Sisera. The chief ford for long was to the west of the gorge where the stream issues into the plain of Acre, on the highway from Chaifd to Nazareth. Here it is now spanned by a substantial bridge, while the railway crosses a little higher up. At the mouth of the river it is generally easily forded on the sand bank thrown up by the waves beating against the current of the stream. The main traffic here is now carried by a wooden bridge.<P>The phrase nachal qedhumim in <a onClick="return mV(\'Jdg\',5,21);">Jud 5:21</a> is not easy of interpretation. English Versions of the Bible translates, "that ancient river"; G.A. Smith, "torrent of spates"; while others think it may refer to a stream other than the Kishon. Guthe suggests that both names may be derived from those of places adjoining the river. Kishon may possibly mean the "tortuous" stream, referring to the windings of its course.``54';
isbe[5350]='Kislev`kis\'-lef (kiclew; the King James Version Chisleu, the Revised Version (British and American) "Chislev"): The 9th month of the Jewish year, corresponding to December. The word is found in <a onClick="return mV(\'Neh\',1,1);">Ne 1:1</a> and <a onClick="return mV(\'Zec\',7,1);">Zec 7:1</a>. The derivation is uncertain.`<a href="./study/isbe/search.html?string=CALENDAR">CALENDAR</a>`1';
isbe[5351]='Kiss`(nashaq; phileo, kataphilo, philema): The kiss is common in eastern lands in salutation, etc., on the cheek, the forehead, the beard, the hands, the feet, but not (in Pal) the lips (Cheyne, E B, under the word "Salutations"). In the Bible there is no sure instance of the kiss in ordinary salutation. We have in the Old Testament naschaq, "to kiss," used<P>(1) of relatives (which seems the origin of the practice of kissing; compare <a onClick="return mV(\'Sgs\',8,1);">So 8:1</a>, "Oh that thou wert as my brother...I would kiss thee; yea, and none would despise me"); <a onClick="return mV(\'Gen\',27,26,27);">Ge 27:26,27</a> (Isaac and Jacob); <a onClick="return mV(\'Gen\',29,11);">29:11</a> (Jacob and Rachel); <a onClick="return mV(\'Gen\',33,4);">33:4</A> (Esau and Jacob); <a onClick="return mV(\'Gen\',45,15);">45:15</A> (Joseph and his brethren); <a onClick="return mV(\'Gen\',48,10);">48:10</A> (Jacob and Joseph\'s sons); <a onClick="return mV(\'Gen\',50,1);">50:1</A> (Joseph and his father); <a onClick="return mV(\'Exd\',4,27);">Ex 4:27</a> (Aaron and Moses); <a onClick="return mV(\'Exd\',18,7);">18:7</a> (Moses and Jethro, united with obeisance); <a onClick="return mV(\'Rth\',1,9,14);">Ru 1:9,14</a> (Naomi and her daughters-in-law—a farewell); <a onClick="return mV(\'2Sa\',14,33);">2Sa 14:33</a> (David and Absalom); <a onClick="return mV(\'1Ki\',19,20);">1Ki 19:20</a> (Elisha and his parents—a farewell); see also <a onClick="return mV(\'Gen\',29,13);">Ge 29:13</a>; <a onClick="return mV(\'Gen\',31,28,55);">31:28,55</a>; Tobit 7:6; 10:12.<P>(2) Of friendship and affection; compare <a onClick="return mV(\'1Sa\',20,41);">1Sa 20:41</a> (David and Jonathan); <a onClick="return mV(\'2Sa\',15,5);">2Sa 15:5</a> (Absalom and those who came to him); <a onClick="return mV(\'2Sa\',19,39);">19:39</a> (David and Barzillai—a farewell); <a onClick="return mV(\'2Sa\',20,9);">20:9</a> (Joab and Amasa); <a onClick="return mV(\'Pro\',27,6);">Pr 27:6</a> ("the kisses (neshiqah) of an enemy"); 1Esdras 4:47 ("the king stood up, and kissed him").<P>(3) Of love; compare <a onClick="return mV(\'Sgs\',1,2);">So 1:2</a>, "Let him kiss me with the kisses (neshiqah) of his mouth"; <a onClick="return mV(\'Pro\',7,13);">Pr 7:13</a> (of the feigned love of "the strange woman").<P>(4) Of homage, perhaps; compare <a onClick="return mV(\'1Sa\',10,1);">1Sa 10:1</a> (Samuel after anointing David king); <a onClick="return mV(\'Gen\',41,40);">Ge 41:40</a>, "Unto thy word shall all my people be ruled," the Revised Version margin "order themselves," or "do homage," the King James Version margin "Hebrew be armed or kiss" (nashaq); <a onClick="return mV(\'Psa\',2,12);">Ps 2:12</a>, "Kiss the son" (American Standard Revised Version), the English Revised Version margin "Some versions render, \'Lay hold of (or receive) instruction\'; others, \'Worship in purity\' "; some ancient versions give \'Kiss (or, do homage) purely.\'<P>(5) Of idolatrous practices; compare <a onClick="return mV(\'1Ki\',19,18);">1Ki 19:18</a>; <a onClick="return mV(\'Hsa\',13,2);">Ho 13:2</a> (compare <a onClick="return mV(\'Hsa\',8,5,6);">8:5,6</a>; <a onClick="return mV(\'Hsa\',10,5);">10:5</a>); <a onClick="return mV(\'Job\',31,27);">Job 31:27</a>, probably, "kissing the hand to the sun or moon" (compare <a onClick="return mV(\'Job\',31,26,27);">31:26,27</A>). See <a href="./study/isbe/search.html?string=ADORATION">ADORATION</a>.<P>(6) A figurative use may be seen in <a onClick="return mV(\'Psa\',85,10);">Ps 85:10</a>; <a onClick="return mV(\'Pro\',24,26);">Pr 24:26</a>; <a onClick="return mV(\'Eze\',3,13);">Eze 3:13</a>, where "touched" is nashaq (see the King James Version margin).<P>(7) In <span class="noTag">Additions to Esther 13:13</span> we have "I could have been content...to kiss the soles of his feet," and in Ecclesiasticus 29:5, "Till he hath received, he will kiss a man\'s hands"—marks of self-humiliation or abasement.<P>In the New Testament we have phileo, "to kiss," "to be friendly," and kataphileo, "to kiss thoroughly," "to be very friendly"—the first in <a onClick="return mV(\'Mat\',26,48);">Mt 26:48</a>; <a onClick="return mV(\'Mar\',14,44);">Mr 14:44</a>; <a onClick="return mV(\'Luk\',22,47);">Lu 22:47</a>, of the kiss with which Judas betrayed his Master. This was probably meant to be taken as an expression of special regard, which is expressed by the kataphileo of <a onClick="return mV(\'Mat\',26,49);">Mt 26:49</a>; <a onClick="return mV(\'Mar\',14,45);">Mr 14:45</a>; the same word is used of the woman who kissed the feet of Christ (<a onClick="return mV(\'Luk\',7,38,45);">Lu 7:38,45</a>); of the father\'s greeting of the returning prodigal (<a onClick="return mV(\'Luk\',15,20);">Lu 15:20</a>); and of the farewell to Paul of the Ephesian Christians (<a onClick="return mV(\'Act\',20,37);">Ac 20:37</a>); philema, "a kiss," "a mark of friendship," is used by our Lord as that which Simon omitted to give him (which may refer to ordinary hospitality), but which the woman had bestowed so impressively (<a onClick="return mV(\'Luk\',7,45);">Lu 7:45</a>); of the kiss of Judas (<a onClick="return mV(\'Luk\',22,48);">Lu 22:48</a>); and of the "holy kiss" wherewith Christians greeted each other, which, according to the general usage we have seen, would be as the members of one family in the Lord, or as specially united in holy love (<a onClick="return mV(\'Rom\',16,16);">Ro 16:16</a>; <a onClick="return mV(\'1Cr\',16,20);">1Co 16:20</a>; <a onClick="return mV(\'2Cr\',13,12);">2Co 13:12</a>; <a onClick="return mV(\'1Th\',5,26);">1Th 5:26</a>; <a onClick="return mV(\'1Pe\',5,14);">1Pe 5:14</a>). There is reason to believe that, as a rule, men only thus greeted men, and women, women. In the Apostolical Constitutions (3rd century) it is so enjoined.``185';
isbe[5352]='Kite`kit (\'ayyah; iktinos; Latin Milvus ictinus or regalis): A medium-sized member of the hawk tribe (see <a href="./study/isbe/search.html?string=HAWK">HAWK</a>). This bird <span clas="noTag">is</span> 27 inches long, of bright reddish-brown color, has sharply pointed wings and deeply forked tail. It is supposed to have exceptionally piercing eyes. It takes moles, mice, young game birds, snakes and frogs, as well as carrion for food. Its head and facial expression are unusually eagle-like. It was common over Palestine in winter, but bred in the hills of Galilee and rough mountainous places, so it was less conspicuous in summer. It is among the lists of abominations (see <a onClick="return mV(\'Lev\',11,14);">Le 11:14</a> and <a onClick="return mV(\'Deu\',14,13);">De 14:13</a>). It is notable that this is the real bird intended by Job to be used as that whose eye could not trace the path to the silver mine:<P class="in15">"That path no bird of prey knoweth,<br>Neither hath the falcon\'s eye seen it" (<a onClick="return mV(\'Job\',28,7);">Job 28:7</a>).<P>The word used here in the original Hebrew is \'ayyah, which was the name for kite. Our first translators used "vulture"; our latest efforts give "falcon," a smaller bird of different markings, not having the kite\'s reputation for eyesight.``167';
isbe[5353]='Kithlish`kith\'-lish (kithlish).`<a href="./study/isbe/search.html?string=CHITLISH">CHITLISH</a>`1';
isbe[5354]='Kitron`kit-\'ron (qitron): An unidentified place in Zebulun, not possessed by the tribe (<a onClick="return mV(\'Jdg\',1,30);">Jud 1:30</A>). It may be identical with Kattath of <a onClick="return mV(\'Jos\',19,15);">Jos 19:15</a>. In the Talmud it is identified with Sepphoris, which is represented by the modern village of Seffuriyeh].``1';
isbe[5355]='Kittim`kit\'-im (kittim, <a onClick="return mV(\'Isa\',23,12);">Isa 23:12</a>; <a onClick="return mV(\'Jer\',2,10);">Jer 2:10</a>; kittiyim, apparently plural of kitti (not found, but compare (4) below); Ketioi, Kitioi, Ketieim, <a onClick="return mV(\'Jer\',2,10);">Jer 2:10</a>; Chettieim, Chettein):ntified with Sepphoris, which is represented by the modern village of Seffuriyeh].<P>1. Two Usages of the Name:<P>In <a onClick="return mV(\'Gen\',10,4);">Ge 10:4</a> the word is applied to the descendants of Javan, and indicates, therefore, the Greek-Latin races, whose territory extended along the coasts of the Mediterranean, and included its islands. By the side of Kittim are mentioned Elisha, Tarshish, and Dodanim (= Rodanim of <a onClick="return mV(\'1Ch\',1,7);">1Ch 1:7</a>), generally explained respectively as Sicily with Southern Italy, Spain and Rhodes. In its narrower sense Kittim appears simply to have stood for the island of Cyprus—it is mentioned between Bashan (= Pal) and the isles of Elisha in <a onClick="return mV(\'Eze\',27,6,7);">Eze 27:6,7</a>, and with this <a onClick="return mV(\'Isa\',23,1,12);">Isa 23:1,12</a> agree, Kittim occurring in these passages between Tarshish, Tyre and Sidon.<P>2. In Its Limited Sense:<P>The oldest etymology is apparently that of Josephus, who connects Kittim with the well-known old Cypriote city Kition (Citium) (Ant., I, vi, 1), testifying to the settling of the Kittim on the island. This word he further connects with Chethima, from Chethimus, and states that it was on account of Cyprus being the home of those people that all islands were called Chethim by the Hebrews. The derivation of an ancient Chethim from Chethimus, however, would make the m to be a radical, and this, with the substitution of Ch (= Kh) for Kittim, renders his proposed etymology somewhat doubtful.<P>3. In Its Extended Sense:<P>The statement of Josephus, that "all islands, and the greatest part of the sea-coast, are called Chethim (= Kittim) by the Hebrews," on the other hand, must be taken as the testimony of one well acquainted with the opinions of the learned world in his time. In <a onClick="return mV(\'Jer\',2,10);">Jer 2:10</a> and <a onClick="return mV(\'Eze\',27,6);">Eze 27:6</a> the isles of Kittim are expressly spoken of, and this confirms the statement of Josephus concerning the extended meaning of the name. This would explain its application to the Roman fleet in <a onClick="return mV(\'Dan\',11,30);">Da 11:30</a> (so the Vulgate), and the Macedonians in 1Macc 1:1 (Chettieim) and 8:5 (Kitians). In the latter passage the Greek writer seems to have been thinking more of the Cyprian Kition than of the Hebrew Kittim.<P>4. Colonization of Cyprus:<P>According to Herodotus (vii. 90), Cyprus was colonized from Greece, Phoenicia, and Ethiopia. Referring to the plundering of the temple of Aphrodite at Askalon by the Scythians (i.105), he states that her temple in Cyprus was an offshoot from that ancient foundation, as reported by the Cyprians themselves, Phoenicians having founded it at Cythera, on arriving from Syria. The date of the earliest Phoenician settlements in Cyprus is unknown, but it has been suggested that they were anterior to the time of Moses. Naturally they brought with them their religion, the worship of the moon-goddess Atargatis (Derceto) being introduced at Paphos, and the Phoenician Baal at Kition. If Kition be, then, a Semitic word (from the same root as the Hebrew Kittim), it has been transferred from the small band of Phoenician settlers which it at first designated, to the non-Sem Japhethites of the west. Kition occurs in the Phoenician inscriptions of Cyprus under the forms K(i)t(t) and K(i)t(t)i, the latter being by far the more common (CIS, I, i, 10,11,14,19, etc.).<P>5. Its Successive Masters:<P>The early history of Cyprus is uncertain. According to the Assyrian copy of Sargon of Agade\'s omens, that king (about 3800 BC in the opinion of Nabonidus; 2800 BC in the opinion of many Assyriologists) is said to have crossed "the sea of the setting sun" (the Mediterranean), though the Babylonian copy makes it that of "the rising sun"—i.e. the Persian Gulf. Be this as it may, General Cesnola discovered at Curium, in Cyprus, a seal-cylinder apparently inscribed "Mar-Istar, son of Ilu-bani, servant (worshipper) of Naram-Sin," the last named being the deified son of Sargon. In the 16th century BC, Cyprus was tributary to Thothmes III. About the year 708 BC, Sargon of Assyria received the submission of the kings of the district of Ya\', in Cyprus, and set up at Citium the stele bearing his name, which is now in the Royal Museum at Berlin. Esarhaddon and his son Assur-bani-apli each received tribute from the 10 Cyprian princes who acknowledged Assyrian supremacy. The island was conquered by the Egyptian king Amasis, and later formed part of the Persian empire, until the revolt of Evagoras in 410 BC. The Assyrians knew the island under the name of Yad(a)nanu, the "Wedan" (Vedan) of <a onClick="return mV(\'Eze\',27,19);">Eze 27:19</a> Revised Version (British and American) (Sayce, PSBA, 1912, 26).<P>6. The Races Therein and Their Languages:<P>If the orthodox date for the composition of Genesis be accepted, not only the Phoenicians, but also the Greeks, or a people of Greek-Latin stock, must have been present in Cyprus, before the time of Moses, in sufficient number to make them the predominant portion of the population. As far as can be judged, the Phoenicians occupied only the eastern and southern portion of the island. Paphos, where they had built a temple to Ashtoreth and set up an \'asherah (a pillar symbolizing the goddess), was one of their principal settlements. The rest of the island was apparently occupied by the Aryans, whose presence there caused the name of Kittim to be applied to all the Greek-Latin countries of the Mediterranean. Greek and Phoenician were the languages spoken on the island, as was proved by George Smith\'s demonstration of the nature of the non-Phoenician text of the inscription of King Melek-yathon of Citium (370 BC). The signs used in the Greek-Cyprian inscriptions are practically all syllabic.<P>7. The Testimony of Cyprian Art:<P>The many influences which have modified the Cyprian race are reflected in the ancient art, which shows the effect of Babylonian, Egyptian Phoenician and Greek contacts. Specimens are to be found in many museums, but the finest collection of examples of Cyprian art is undoubtedly that of the Metropolitan Museum of Art in New York. Some of the full-length figures are life-size, and the better class of work is exceedingly noteworthy.`<a href="./study/isbe/search.html?string=CYPRUS">CYPRUS</a>`136';
isbe[5356]='Kneading`ned\'ing.`<a href="./study/isbe/search.html?string=BREAD">BREAD</a>`1';
isbe[5357]='Knee; Kneel`ne nel ("knee," berekh; Aramaic \'arekhubbah; gonu; "kneel"; barakh; Aramaic berakh; gonupeto): Most of the uses are obvious, and the figurative use of "knees" as the symbol of strength (<a onClick="return mV(\'Job\',4,4);">Job 4:4</a>; <a onClick="return mV(\'Hbr\',12,12);">Heb 12:12</a>, etc.) needs no explanation. The disease of the knees mentioned in <a onClick="return mV(\'Deu\',28,35);">De 28:35</a> is perhaps some form of leprosy. In <a onClick="return mV(\'Job\',3,12);">Job 3:12</a> the "knees" seem to be used for the lap, as the place where a child receives its first care. Three times in Genesis the knees appear in connection with primitive adoption customs. In <a onClick="return mV(\'Gen\',30,3);">30:3</a> a fiction is enacted that purports to represent Rachel as the actual mother of Bilhah\'s children. By a somewhat similar rite in <a onClick="return mV(\'Gen\',48,12);">48:12</a>, Jacob (the "knees" here are Jacob\'s, not Joseph\'s) adopts Ephraim and Manasseh, so that they are counted as two of the twelve patriarchs and not as members of a single Joseph tribe. In the same way Machir\'s children are adopted by Joseph in <a onClick="return mV(\'Gen\',50,23);">50:23</a>, and this is certainly connected with the counting of Machir (instead of Manasseh) as one of the tribes in <a onClick="return mV(\'Jdg\',5,14);">Jud 5:14</a>. See <a href="./study/isbe/search.html?string=TRIBE">TRIBE</a>; and for the idea underlying this paternal adoption, compare <a href="./study/isbe/search.html?string=THIGH">THIGH</a>. From among classical instances of the same customs compare Homer, Odyssey, xix. 401ff, where Autolukos, grandfather of Ulysses, receives the newborn grandchild on his knees and gives him his name. Thus also we have to understand the numerous representations in Egyptian sculpture, showing the king as an infant on the knees or the lap of a goddess.<P>Kneeling was less commonly an attitude of prayer among the Jews than was standing, but references to kneeling are of course abundant. For kneeling (or prostrating one\'s self) before a superior`<a href="./study/isbe/search.html?string=ATTITUDES">ATTITUDES</a>; <a href="./study/isbe/search.html?string=SALUTATION">SALUTATION</a>`48';
isbe[5358]='Knife`nif:<P>(1) ma\'akheleth, literally, an instrument for eating; but used of large knives for slaying animals, cutting up a carcass or a sacrificial victim (<a onClick="return mV(\'Gen\',22,6,10);">Ge 22:6,10</a>; <a onClick="return mV(\'Jdg\',19,29);">Jud 19:29</a>; <a onClick="return mV(\'Pro\',30,14);">Pr 30:14</a>).<P>(2) cherebh, rendered generally "sword," but in <a onClick="return mV(\'Jos\',5,2,3);">Jos 5:2,3</a> of stone knives for circumcision (compare <a onClick="return mV(\'Exd\',4,25);">Ex 4:25</a>), probably of similar knives in <a onClick="return mV(\'1Ki\',18,28);">1Ki 18:28</a>, used by Baal prophets in gashing themselves. In <a onClick="return mV(\'Eze\',5,12);">Eze 5:12</a> the King James Version, "knife," probably better the Revised Version (British and American), "sword."<P>(3) ta\'ar, usually rendered "razor," in combination with ha-copher, "knife of the writer," or "penknife" (<a onClick="return mV(\'Jer\',36,23);">Jer 36:23</a>).<P>(4) machalaphim, "slaughter-knives" (<a onClick="return mV(\'Ezr\',1,9);">Ezr 1:9</a>).<P>(5) sakkin, Aramaic, "knife" (<a onClick="return mV(\'Pro\',23,2);">Pr 23:2</a>). Early knives were commonly made of sharp stones, especially of flint, later of bronze and iron. The-former remained in use in religious ceremonies long after the latter were in common use.<P>Knives were not generally used at meals, meats being cut into bits before served, and bread being. broken into fragments. Herod used a knife for paring apples, and attempted suicide with the instrument (Josephus, Ant, XVII, vii, 1; BJ, I, xxxiii, 7).``137';
isbe[5359]='Knock`nok (krouo): The oriental house was fitted with heavy doors which were bolted and locked with wooden keys too large to be carried about, so that even a member of the household could not secure entrance until in response to his knock or call the door should be opened by someone within. At night the delay would be increased by the difficulty of arousing the inmates sleeping within the inner chambers. To persons familiar with such experiences, the words of Jesus concerning a higher entrance, "Knock, and it shall be opened unto you" (<a onClick="return mV(\'Mat\',7,7);">Mt 7:7</a>; <a onClick="return mV(\'Luk\',12,36);">Lu 12:36</a>), would have a unique force not easy for us to appreciate.``121';
isbe[5360]='Knop`nop: In <a onClick="return mV(\'Exd\',25,31);">Ex 25:31</a>ff; <a onClick="return mV(\'Exd\',37,17);">37:17</a>ff (kaphtor), part of the ornaments of the golden candlestick; in <a onClick="return mV(\'1Ki\',6,18);">1Ki 6:18</a>; <a onClick="return mV(\'1Ki\',7,24);">7:24</a> (peqa\'im), gourd-like ornaments of the lining of Solomon\'s temple, and of the brazen sea (in <a onClick="return mV(\'1Ki\',6,18);">1Ki 6:18</a>, the Revised Version margin "gourds").<P>See <a href="./study/isbe/search.html?string=CANDLESTICK,+THE+GOLDEN">CANDLESTICK, THE GOLDEN</A>; <a href="./study/isbe/search.html?string=TEMPLE">TEMPLE</A>; <a href="./study/isbe/search.html?string=SEA,+THE+MOLTEN">SEA, THE MOLTEN</A>.``1';
isbe[5361]='Know; Knowledge`no, nol\'-ej (in Hebrew chiefly yadha\', noun da\'ath; in Greek ginosko, oida\' "to know fully," epiginosko, noun gnosis epignosis): Knowledge strictly is the apprehension by the mind of some fact or truth in accordance with its real nature; in a personal relation the intellectual act is necessarily conjoined with the element of affection and will (choice, love, favor, or, conversely, repugnance, dislike, etc.). Knowledge is distinguished from "opinion" by its greater certainty. The mind is constituted with the capacity for knowledge, and the desire to possess and increase it. The character of knowledge varies with its object. The senses give knowledge of outward appearances; the intellect connects and reasons about these appearances, and arrives at general laws or truths; moral truth is apprehended through the power inherently possessed by men of distinguishing right and wrong in the light of moral principles; spiritual qualities require for their apprehension spiritual sympathy ("They are spiritually judged," <a onClick="return mV(\'1Cr\',2,14);">1Co 2:14</a>). The highest knowledge possible to man is the knowledge of God, and while there is that in God\'s infinity which transcends man\'s power of comprehension (<a onClick="return mV(\'Job\',11,7,9);">Job 11:7,9</a>), God is knowable in the measure in which He has revealed Himself in creation (<a onClick="return mV(\'Rom\',1,19,20);">Ro 1:19,20</a>, "that which is known of God," etc.), and supremely in Jesus Christ, who alone perfectly knows the Father, and reveals Him to man (<a onClick="return mV(\'Mat\',11,27);">Mt 11:27</a>). This knowledge of God in Jesus Christ is "life eternal" (<a onClick="return mV(\'Jhn\',17,3);">Joh 17:3</a>). Knowledge is affirmed of both God and man, but with the wide contrast that God\'s knowledge is absolute, unerring, complete, intuitive, embracing all things, past, present, and future, and searching the inmost thoughts of the heart (<a onClick="return mV(\'Psa\',139,1,23);">Ps 139:1,23</a>); whereas man\'s is partial, imperfect, relative, gradually acquired, and largely mixed with error ("Now we see in a mirror darkly...in part," <a onClick="return mV(\'1Cr\',13,12);">1Co 13:12</a>). All these points about knowledge are amply brought out in the Scripture usage of the terms. A large part of the usage necessarily relates to natural knowledge (sometimes with a carnal connotation, as <a onClick="return mV(\'Gen\',4,1,17);">Ge 4:1,17</a>), but the greatest stress also is laid on the possession of moral and spiritual knowledge (e.g. <a onClick="return mV(\'Psa\',119,66);">Ps 119:66</a>; <a onClick="return mV(\'Pro\',1,4,7,22,29);">Pr 1:4,7,22,29</a>; <a onClick="return mV(\'Pro\',8,10);">8:10</a>, etc.; <a onClick="return mV(\'Luk\',1,77);">Lu 1:77</a>; <a onClick="return mV(\'Rom\',15,14);">Ro 15:14</a>; <a onClick="return mV(\'2Pe\',1,5,6);">2Pe 1:5,6</a>). The highest knowledge, as said, is the knowledge of God and Christ, and of God\'s will (<a onClick="return mV(\'Hsa\',6,6);">Ho 6:6</a>; <a onClick="return mV(\'Rom\',11,33);">Ro 11:33</a>; <a onClick="return mV(\'Eph\',1,17);">Eph 1:17</a>; <a onClick="return mV(\'Eph\',4,13);">4:13</a>; <a onClick="return mV(\'Phl\',1,9);">Php 1:9</a>; <a onClick="return mV(\'Phl\',3,8);">3:8</a>; <a onClick="return mV(\'Col\',1,9,10);">Col 1:9,10</a>, etc.). The moral conditions of spiritual knowledge are continually insisted on ("If any man willeth to do his will, he shall know of the teaching, whether it is of God," <a onClick="return mV(\'Jhn\',7,17);">Joh 7:17</a>). On the. other hand, the pride of intellectual knowledge is condemned; it must be joined with love ("Knowledge puffeth up, <a onClick="return mV(\'1Cr\',8,1);">1Co 8:1</a>). The stronger term epignosis is used to denote the full and more perfect knowledge which is possessed in Christ, the conditions of which are humility and love. Of knowledge as connoting favor, choice, on the part of God, there are many examples (<a onClick="return mV(\'Psa\',1,6);">Ps 1:6</a>, Yahweh knoweth the way of the righteous"; <a onClick="return mV(\'Gal\',4,9);">Ga 4:9</a>, "know God, or rather to be known by God"; compare <a onClick="return mV(\'Rom\',8,29);">Ro 8:29</a>, "whom he fore-knew").ectual knowledge as the Divine omnipotence is different from muscular strength. Consequently, the passage of this knowledge into a human intellect is impossible, and the problem of the incarnation should be stated: What effect did Divine omniscience in the person have on the conscious intellect of the manhood? There is so little help from the past to be gained in answering this question, that it must remain open at present—if, indeed, it is ever capable of a full answer. But that ignorance in the intellect of the manhood is fully consistent with omniscience in the person seems to be not merely a safe answer to the question as stated, but an inevitable answer if the true humanity of Christ is to be maintained at all.`<a href="./study/isbe/search.html?string=FOREKNOWLEDGE">FOREKNOWLEDGE</a>`132';
isbe[5362]='Koa`ko\'-a (qoa\'): A people named with Pekod and Shoa as enemies of Jerusalem (<a onClick="return mV(\'Eze\',23,23);">Eze 23:23</a>). Their location was probably northeast of Babylonia.``1';
isbe[5363]='Kohath; Kohathites`ko\'-hath, ko\'-hath-its (qehath, qohathi; Kaath): Second son of Levi, and ancestor of Moses and Aaron (<a onClick="return mV(\'Gen\',46,11);">Ge 46:11</a>; <a onClick="return mV(\'Exd\',6,\'16-20\');">Ex 6:16-20</a>; <a onClick="return mV(\'Num\',3,17);">Nu 3:17</a>; <a onClick="return mV(\'1Ch\',6,1);">1Ch 6:1</a>, etc.). The Kohathites formed one of the three divisions of the tribe of Levi; the other two being the Gershonites and the Merarites (<a onClick="return mV(\'Num\',3,17);">Nu 3:17</a>). The Kohathites consisted of four families, the Amramites, the Izharites, the Hebronites, and the Uzzielites (<a onClick="return mV(\'Num\',3,19,27);">Nu 3:19,27</a>, etc.). Their place in the wilderness was on the southern side of the tabernacle (<a onClick="return mV(\'Num\',3,29);">Nu 3:29</a>), and their number is given (from a month old) as 8,600 (<a onClick="return mV(\'Num\',3,28);">Nu 3:28</a>). Their special charge was "the ark, and the table, and the candlestick, and the altars, and the vessels of the sanctuary wherewith they minister, and the screen, and all the service thereof" (<a onClick="return mV(\'Num\',3,31);">Nu 3:31</a>; compare <a onClick="return mV(\'Num\',7,9);">Nu 7:9</a>). After the conquest 23 cities were assigned them by lot (<a onClick="return mV(\'Jos\',21,4,5);">Jos 21:4,5</a>). In David\'s time and after, Heman, a Kohathite, and his family had a prominent place in the service of the music of the sanctuary (<a onClick="return mV(\'1Ch\',6,33);">1Ch 6:33</a>ff; <a onClick="return mV(\'1Ch\',16,41);">16:41</a>ff; <a onClick="return mV(\'1Ch\',25,1);">25:1</a>); David likewise divided the Levites into courses (the Kohathites, <a onClick="return mV(\'1Ch\',23,\'12-20\');">1Ch 23:12-20</a>; <a onClick="return mV(\'1Ch\',24,\'20-25\');">24:20-25</a>). We read of the Kohathites in the reign of Jehoshaphat at Engedi (<a onClick="return mV(\'2Ch\',20,19);">2Ch 20:19</a>), and in connection with the cleansing of the temple under Hezekiah (<a onClick="return mV(\'2Ch\',29,12,14);">2Ch 29:12,14</a>).``132';
isbe[5364]='Koheleth`ko-hel\'-eth (qoheleth).`<a href="./study/isbe/search.html?string=ECCLESIASTES">ECCLESIASTES</a>`1';
isbe[5365]='Kolaiah`ko-la\'-ya, ko-li\'-a (qolayah, "voice of Yah"):<P>(1) A Benjamite, son of Maaseiah (<a onClick="return mV(\'Neh\',11,7);">Ne 11:7</a>).<P>(2) Father of Ahab, a false prophet and a lecherous man (<a onClick="return mV(\'Jer\',29,\'21-23\');">Jer 29:21-23</a>).``1';
isbe[5366]='Konae`ko\'-ne (Kona): Some manuscripts have komas, from which we have in the King James Version "the villages." The name occurs in the account of the measures taken to secure the country against Holofernes (Judith 4:4). If Kona be correct, we may possibly identify the place with Cyamon.``1';
isbe[5367]='Kor`kor.`<a href="./study/isbe/search.html?string=COR">COR</a>`1';
isbe[5368]='Korah`ko\'-ra, (qorach, "baldness," possibly; Kore):<P>(1) One of the 3 sons of Oholibamah, Esau\'s Hivite wife. The account says that the 3 were born in Canaan before Esau withdrew to the Seir mountain country. They are mentioned 3 times in the brief account from 3 points of view (<a onClick="return mV(\'Gen\',36,5,14,18);">Ge 36:5,14,18</a>; <a onClick="return mV(\'1Ch\',1,35);">1Ch 1:35</a>), the 3rd mention being in the list of "chiefs."<P>(2) One of the sons of Eliphaz, the son of Adah, Esau\'s Hittite wife (<a onClick="return mV(\'Gen\',36,16);">Ge 36:16</a>). He is mentioned as one of the Edomite "chiefs."<P>If one has the habit, finding a statement anywhere, of thinking that the statement ought to be changed into something else, he will be interested in the attempts to identify these Edomite Korahs with Korah (3).<P>(3) A son of Hebron (<a onClick="return mV(\'1Ch\',2,43);">1Ch 2:43</a>), the son of Mareshah, mentioned in the Caleb group of families in Judah.<P>(4) The son of Izhar the son of Kohath the son of Levi (<a onClick="return mV(\'Exd\',6,16);">Ex 6:16</a>ff; <a onClick="return mV(\'Num\',16,1);">Nu 16:1</a>; <a onClick="return mV(\'1Ch\',6,18,\'31-38\');">1Ch 6:18,31-38</a>), a younger contemporary of Moses. There may have been generations, omitted in the record, between Izhar and Korah; that is a natural way of accounting for Amminadab (<a onClick="return mV(\'1Ch\',6,\'22-30\');">1Ch 6:22-30</a>).<P>1. The Catastrophe in the Wilderness:<P>This Korah is best known as the man whom the opening earth is said to have swallowed up along with his associates when they were challenging the authority of Moses and Aaron in the wilderness (<a onClick="return mV(\'Num\',16,\'1-\');">Nu 16</a>; <a onClick="return mV(\'Num\',17,\'1-\');">17</a>). Korah is presented as the principal in the affair. The company is spoken of as his company, and those who were swallowed up as being "all the men that appertained unto Korah." (<a onClick="return mV(\'Num\',16,11,32);">Nu 16:11,32</a>). It is under his name that the affair is referred to (<a onClick="return mV(\'Num\',26,9);">Nu 26:9</a>; <a onClick="return mV(\'Num\',27,3);">27:3</a>). But Dathan and Abiram of the tribe of Reuben are not much less prominent than Korah. In <a onClick="return mV(\'Num\',16,\'1-\');">Nu 16</a> and <a onClick="return mV(\'Num\',26,\'1-\');">26</a> they are mentioned with Korah, and are mentioned without him in <a onClick="return mV(\'Deu\',11,6);">De 11:6</a> and <a onClick="return mV(\'Psa\',106,17);">Ps 106:17</a>. Another Reubenite, On, the son of Peleth, was in the conspiracy. It has been inferred that he withdrew, but there is no reason either for or against the inference. Equally baseless is the inference that Zelophehad of Manassel joined it, but withdrew (<a onClick="return mV(\'Num\',27,3);">Nu 27:3</a>). The account implies that there were other Levites in it besides Korah (<a onClick="return mV(\'Num\',16,\'7-10\');">Nu 16:7-10</a>), and it particularly mentions 250 "men of renown," princes, such men as would be summoned if there were a public assembly (<a onClick="return mV(\'Num\',16,2,17,35);">Nu 16:2,17,35</a>). These men, apparently, were of different tribes.<P>The position taken by the malcontents was that "all the congregation are holy, every one of them," and that it was therefore a usurpation for Moses and Aaron to confine the functions of an incense-burning priest to Aaron alone. Logically, their objection lay equally against the separation of Aaron and his sons from the rest of the Levites, and against the separation of the Levites from the rest of the people. On the basis of this, Moses made expostulation with the Levites. He arranged that Korah and the 250, along with Aaron, should take their places at the doorway of the tent of meeting, with their censers and fire and incense, so that Yahweh might indicate His will in the matter. Dathan and Abiram insolently refused his proposals.<P>The record says that Korah\'s "whole congregation," including himself and the 250 with their censers, met Moses and Aaron and "all the congregation" of Israel at the doorway of the tent of meeting. For the purposes of the transaction in hand the tent was now "the mishkan of Korah, Dathan and Abiram," and their followers. Yahweh directed Moses to warn all other persons to leave the vicinity. Dathan and Abiram, however, were not at the mishkan. The account says that Moses, followed by the eiders of Israel, went to them to their tents; that he warned all persons to leave that vicinity also; that Dathan and Abiram and the households stood near the tents; that the earth opened and swallowed them and their property and all the adherents of Korah who were on the spot; that fire from Yahweh devoured the 250 who offered incense. The narrative does not say whether the deaths by fire and by the opening of the earth were simultaneous. It does not say whether Korah\'s sons participated in the rebellion, or what became of Korah himself. In the allusion in <a onClick="return mV(\'Num\',26,\'1-\');">Nu 26</a> we are told, apparently, that Korah was swallowed up, and that "the sons of Korah died not." The deaths of the principal offenders, by fire and by being swallowed up, were followed by plague in which 14,700 perished (<a onClick="return mV(\'Num\',16,49);">Nu 16:49 (Hebrew 17:14)</a>).<P>2. Critical Treatments of This Story:<P>Any appreciative reader sees at once that we have here either a history of certain miraculous facts, or a wonder-story devised for teaching religious lessons. As a story it is artistically admirable—sufficiently complicated to be interesting, but clear and graphic and to the point. In the Hebrew there are 2 or 3 instances of incomplete grammatical construction, such as abound in the early literary products of any language, when these have been fortunate enough to escape editorial polishing. In such a case it is possibly not unwise just to take a story as it stands. Nothing will be added to either its religious or its literary value by subjecting it to doubtful alleged critical processes.<P>If, however, one has committed himself to certain critical traditions concerning the Hexateuch, that brings him under obligation to lead this story into conformity with the rest of his theory. Attempts of this kind have been numerous. Some hold that the Korah of this narrative is the Edomite Korah, and that Peleth means Philistine, and that our story originally grew out of some claim made by Edomites and Philistines. It is held that the story of Korah was originally one story, and that of Dathan and Abiram another, and that someone manipulated the two and put them together. See the treatments of the Book of Numbers in Driver, Introduction; Addis, Documents of the Hexateuch; Carpenter and Battersby, Hexateuch; Bacon, Exodus; Paterson on Numbers, in the Polychrome Bible. These and other like works give source-analyses of our story. Some of the points they make are plausible. In such a case no one claims any adequate basis of fact for his work; each theory is simply a congeries of ingenious guesses, and no two of the guessers guess alike.<P>As in many other Biblical instances, one of the results of the alleged critical study is the resolving of a particularly fine story into two or more supposed earlier stories each of which is absolutely bald and crude and uninteresting, the earlier stories and the combining of these into their present form being alike regarded as processes of legendary accretion. The necessary inference is that the fine story we now have was not the product of some gifted mind, guided by facts and by literary and religious inspiration, but is an accidental result of mere patchwork. Such a theory does not commend itself to persons of literary appreciation.``11';
isbe[5369]='Korahites; Sons of Korah`ko\'-ra-its (qorchi), (beno qorach; in the King James Version appears also as Korhite, Kohathite, Kore): This phrase is used to denote Assir and Elkanah and Abiasaph, Korah\';s 3 individual sons (<a onClick="return mV(\'Exd\',6,24);">Ex 6:24</a>; compare <a onClick="return mV(\'Num\',26,11);">Nu 26:11</a>). But its more frequent use, and that to which interest attaches, is in the titles of some of the Psalms.<P>The genealogical details concerning Korahites are rather full. In 3 places we find the list of the 7 successive generations closing with the prophet Samuel and his son Joel (<a onClick="return mV(\'1Ch\',6,\'31-38\');">1Ch 6:31-38</a>,<a onClick="return mV(\'1Ch\',6,\'22-30\');">22-30</a>; <a onClick="return mV(\'1Sa\',1,1,20);">1Sa 1:1,20</a>; <a onClick="return mV(\'1Sa\',8,2);">8:2</a>); the two in Chronicles mention most of the generations between Korahites and Joel. The fragmentary lists in <a onClick="return mV(\'1Ch\',9,\'1-\');">1Ch 9</A>; <a onClick="return mV(\'1Ch\',25,\.1-\');">25</a>; <a onClick="return mV(\'1Ch\',26,\'1-\');">26</a> connect the list with the 4 generations following Joel (<a onClick="return mV(\'1Ch\',6,33);">1Ch 6:33</a>; <a onClick="return mV(\'1Ch\',9,\'19-31\');">9:19-31</a>; <a onClick="return mV(\'1Ch\',26,1);">26:1</a>), and with 2 generations in the very latest Bible times (<a onClick="return mV(\'1Ch\',9,31);">1Ch 9:31</a>).<P>The adjective "Korhite" appears also in the King James Version as "Korathite," Kore," and "Korahite," the last being the form preferred in the English Revised Version. It is used 4 times in the singular. Once it designates an individual (<a onClick="return mV(\'1Ch\',9,31);">1Ch 9:31</a>); 3 times it denotes the successors of Korahites taken collectively (<a onClick="return mV(\'Exd\',6,24);">Ex 6:24</a>; <a onClick="return mV(\'Num\',26,58);">Nu 26:58</a>; <a onClick="return mV(\'1Ch\',26,19);">1Ch 26:19</a>); 4 times it is used in the plural, denoting the members of this succession of men (<a onClick="return mV(\'1Ch\',9,19);">1Ch 9:19</a>; <a onClick="return mV(\'1Ch\',12,6);">12:6</a>; <a onClick="return mV(\'1Ch\',26,1);">26:1</a>; <a onClick="return mV(\'2Ch\',20,19);">2Ch 20:19</a>). As variants of this use, "the sons of the Korahites" appears once, and "the children of the Korahites" once (<a onClick="return mV(\'1Ch\',26,19);">1Ch 26:19</a>; <a onClick="return mV(\'2Ch\',20,19);">2Ch 20:19</a>).<P>In these various passages the Korahites families are counted like the other Levitical families. In <a onClick="return mV(\'1Ch\',12,6);">1Ch 12:6</a> we have an account of 5 men who are designated as "the Korahites," who joined David when he was at Ziklag—Elkanah, Isshiah, Azarel, Joezer, Jashobeam. They are described as expert warriors, especially with the bow and sling, and as being "of Saul\'s brethren of Benjamin." Some of them may plausibly be identified with men of the same name mentioned elsewhere. These Korahites may have been cousins of the Samuel family, and they may have resided not very far apart.<P>The record speaks with some emphasis of a line of Korahites doorkeepers.<P>In the latest Old Testament times one Mattithiah, "the first-born of Shallum the Korahite," held "the office of trust over the things that were baked in pans" (<a onClick="return mV(\'1Ch\',9,31);">1Ch 9:31</a>). Shallum was "the son of Kore, the son of Ebiasaph, the son of Korah." In this expression 15 or more generations are omitted between Ebiasaph and Kore, and perhaps as many between Kore and Shallum. The record proceeds to supply some of the omitted names between Kore and Shallum. The representative of the line in David\'s time was "Zechariah the son of Meshelemiah" (<a onClick="return mV(\'1Ch\',9,21);">1Ch 9:21</a>). In all periods the Korahites were "keepers of the thresholds of the tent." Back in the time of "Phinehas the son of Eleazar," "their fathers had been over the camp of Yahweh" (<a onClick="return mV(\'1Ch\',9,19,20);">1Ch 9:19,20</a>). Zechariah was, in his time, "porter of the door of the tent of meeting" (<a onClick="return mV(\'1Ch\',9,21);">1Ch 9:21</a>), and Shallum was still the chief of the porters (<a onClick="return mV(\'1Ch\',9,17);">1Ch 9:17</a>). The record for David\'s time supports and supplements this. It says that the doorkeepers, according to the arrangements made by David, included a Korahites contingent, its leading men being Meshelemiah and his son Zechariah (<a onClick="return mV(\'1Ch\',26,1,2,9,14);">1Ch 26:1,2,9,14</a>), and that Meshelemiah was "the son of Kore, of the sons of Asaph." Adopting the common conjecture that Asaph is here a variant for Ebiasaph, we have here the same abridgment of the genealogical list as in <a onClick="return mV(\'1Ch\',9,\'1-\');">1Ch 9</a>.<P>More interesting, however, than the fighting Korahites who claimed succession from Moses to Nehemiah, are the."sons of Korah" who were somehow connected with the service of song. One of the genealogies is introduced by the statement: "These are they whom David set over the service of song in the house of Yahweh, after that the ark had rest. And they ministered with song before the tabernacle of the tent of meeting, until Solomon had built the house of Yahweh in Jerus" (<a onClick="return mV(\'1Ch\',6,31,32);">1Ch 6:31,32</a>). Then the writer proceeds to mention first "Heman the singer, the son of Joel, the son of Samuel," and so on, carrying the genealogy back to Korah and Levi. After thus mentioning Heman, he speaks of "his brother Asaph, who stood on his right hand," and traces Asaph\'s descent back to Gershom the son of Levi; and then says, "and on the left hand their brethren the sons of Merari." Of these the principal leader is Ethan (otherwise called Jeduthun), and his descent is here traced back to Levi.<P>In this way we are introduced to David\'s 3 great leaders in choral and orchestral music. Among them Heman the Korahite has at first the place of primacy, though Asaph, later, comes to the front. The events just referred to are mentioned again, more in detail, in the account of David\'s bringing the ark to Jerusalem. There it is said that at the suggestion of David "the Levites appointed Heman the son of Joel," and also Asaph and Ethan, "and with them" several others, "their brethren of the second degree" (<a onClick="return mV(\'1Ch\',15,17,18);">1Ch 15:17,18</a>). The record proceeds to speak of the services of "the singers, Heman, Asaph, and Ethan," and their associates, in the pageantry of the bringing of the ark to Jerusalem. After that, it says, Asaph had charge of the services of thanksgiving and praise before the ark in Jerusalem, while Heman and Jeduthun served in the high place at Gibeon (<a onClick="return mV(\'1Ch\',16,4,37,\'39-42\');">1Ch 16:4ff, 37,39-42</a>). Later, the record says (<a onClick="return mV(\'1Ch\',25,\'1-\');">1Ch 25</a>), David made an elaborate organization, under Asaph and Heman and Jeduthun, for prophesying with song and instrumental music.<P>As the records of David\'s time, according to the Chronicler, thus attribute to him great achievements in sacred music and song, so the records of subsequent times reiterate the same thing. David\'s interest in sacred music is mentioned in connection with Solomon\'s temple, in connection with the times of Joash and Hezekiah and Josiah, in connection with the institutions and exploits of the times after the exile (e.g. <a onClick="return mV(\'2Ch\',7,6);">2Ch 7:6</a>; <a onClick="return mV(\'2Ch\',23,18);">23:18</a>; <a onClick="return mV(\'2Ch\',29,25);">29:25</a>ff; <a onClick="return mV(\'2Ch\',35,15);">35:15</a>; <a onClick="return mV(\'Ezr\',3,10);">Ezr 3:10</a>; <a onClick="return mV(\'Neh\',12,24,36,45,46);">Ne 12:24,36,45,46</a>). Asaph and Heman and Jeduthun led the magnificent choir and orchestra at the dedication of the temple (<a onClick="return mV(\'2Ch\',5,12);">2Ch 5:12</a>). One of the sons of Asaph prophesied, and the sons of the Korahites sang at the crisis in the time of Jehoshaphat (<a onClick="return mV(\'2Ch\',20,14,19);">2Ch 20:14,19</a>). The sons of Asaph and the sons of Heman and the sons of Jeduthun were present, and there was instrumental music and loud singing, according to the appointment of David and his associates, at the time of Hezekiah\'s Passover (<a onClick="return mV(\'2Ch\',29,13);">2Ch 29:13</a>). Singing, and Asaph and Heman and Jeduthun and David have an important place in the record concerning Josiah. And the records of the post-exilian times make the singers and the "sons of Asaph" and the arrangements of David as conspicuous as the law of Moses itself.<P>Add to this that the names Asaph or Heman or Ethan or Jeduthun, or the designation "the sons of Korah" are attached to 25 or more of the Psalms (e.g. <a onClick="return mV(\'Psa\',42,\'1-\');">Psalms 42-49</a>; <a onClick="return mV(\'Psa\',50,\'1-\');">50</a>; <a onClick="return mV(\'Psa\',62,1);">62</a>; <a onClick="return mV(\'Psa\',72,\'1-\');">72-85</A>), and we have a body of testimony that is at least abundant and intelligible. It is to the effect that there was elaborate organization, on a large scale, in connection with the musical services of the temple at Jerusalem; that this began in the time of David, as a part of the preparation for building the temple, under the influence of the family traditions of the prophet Samuel; and that the movement continued in the generations following David, either surviving the exile, or being revived after the exile. In connection with this movement, the phrases "sons of Korah," "sons of Asaph," "sons of Heman," "sons of Jeduthun" denote, in some cases, merely lineal escent; but in other cases they denote each an aggregate of persons interested in sacred song and music—a guild or society or succession or group—arising out of the movement which originated in David\'s time. See, for example, "sons of Asaph" (<a onClick="return mV(\'1Ch\',25,1,2);">1Ch 25:1,2</a>; <a onClick="return mV(\'2Ch\',20,14);">2Ch 20:14</a>; compare <a onClick="return mV(\'2Ch\',20,19);">2Ch 20:19</a>; <a onClick="return mV(\'2Ch\',29,13);">29:13</a>; <a onClick="return mV(\'2Ch\',35,15);">35:15</a>; <a onClick="return mV(\'Ezr\',2,41);">Ezr 2:41</a>; <a onClick="return mV(\'Ezr\',3,10);">3:10</a>; <a onClick="return mV(\'Neh\',7,44);">Ne 7:44</a>; <a onClick="return mV(\'Neh\',11,22);">11:22</a>) and "sons of Korah" in the titles of <a onClick="return mV(\'Psa\',42,\'1-\');">Psalms 42-49</a> and <a onClick="return mV(\'Psa\',84,\'1-\');">84</A>; <a onClick="return mV(\'Psa\',85,\'1-\');">85</A>; <a onClick="return mV(\'Psa\',87,\'1-\');">87-89</A>. Traces of these aggregates appear in the times of Solomon, of Jehoshaphat, of Joash, of Hezekiah, of Josiah, of Zerubbabel, of Ezra and Nehemiah.<P>If a person holds that the mention of an event in Chronicles is to be regarded as proof that the event never occurred, that person will of course deny that the testimony thus cited is true to fact. He is likely to hold that the guilds of singers arose in the exile, and that, some generations after Nehemiah, they fabricated for themselves the ecclesiastical and physical pedigrees now found in the Books of Chronicles. If, however, we accord fair play to the Chronicler as a witness, we shall be slow to discredit the minute and interfitting testimony which he has placed before us.``11';
isbe[5370]='Korathites`ko\'-rath-its: In the King James Version for "Korabites," <a onClick="return mV(\'Num\',26,58);">Nu 26:58</a>.`<a href="./study/isbe/search.html?string=KORAH">KORAH</a>`1';
isbe[5371]='Kore`ko-\'re (qore, "one who proclaims"):<P>(1) A Levite of David\'s time, descended from Kohath and Korah. See <a href="./study/isbe/search.html?string=KORAH">KORAH, 4</A>. Shallum, Chief doorkeeper in the latest Bible times, is described as "the son of Kore, the son of Ebiasaph, the son of Korah" (<a onClick="return mV(\'1Ch\',9,19);">1Ch 9:19</a>). This expression omits the generations between Shallum and Kore, and those between Kore and Ebidsaph, perhaps 15 generations or more in each case. The context supplies two of the omitted names, of the time of David, Meshelemiah and his son Zechariah (<a onClick="return mV(\'1Ch\',9,21,22);">1Ch 9:21,22</a>). The record for the time of David mentions these two, with some particulars, calling Meshelemiah the son of Kore (<a onClick="return mV(\'1Ch\',26,1,2,9,14);">1Ch 26:1,2,9,14</a>). It describes them as "Korahites" "of the sons of Asaph." It is usual to regard this last clause as a variant for "the son of Ebiasaph," thus making the description identical with that in <a onClick="return mV(\'1Ch\',9,19);">1Ch 9:19</a>. With this understanding, the text claims that "the Korahites," Kore and Meshelemiah and Zechariah, come midway in a line of sanctuary ministrants, extending continuously from Moses to Nehemiah.<P>(2) "The son of Imnah the Levite, the porter at the east gate," who "was over the freewill-offerings," in the time of Hezekiah (<a onClick="return mV(\'2Ch\',31,14);">2Ch 31:14</a>). Very likely in the same line with (1) above.<P>(3) In <a onClick="return mV(\'1Ch\',26,1);">1Ch 26:1</a> the King James Version for <a href="./study/isbe/search.html?string=KORAHITES">KORAHITES</A> (which see).``11';
isbe[5372]='Korhites`kor\'-hits: In the King James Version for "Korahites" in <a onClick="return mV(\'Exd\',6,24);">Ex 6:24</a>; <a onClick="return mV(\'1Ch\',12,6);">1Ch 12:6</a>; <a onClick="return mV(\'1Ch\',26,1);">26:1</a>; <a onClick="return mV(\'2Ch\',20,19);">2Ch 20:19</a>.`<a href="./study/isbe/search.html?string=KORAH">KORAH</a>`1';
isbe[5373]='Koz`koz.`<a href="./study/isbe/search.html?string=HAKKOZ">HAKKOZ</a>`1';
isbe[5374]='Kushaiah`ku-sha\'-ya, ku-shi\'-a (qushayahu, "bow of Yah"): A Merarite Levite (<a onClick="return mV(\'1Ch\',15,17);">1Ch 15:17</a>), called in <a onClick="return mV(\'1Ch\',6,44);">1Ch 6:44</a> <a href="./study/isbe/search.html?string=KISHI">KISHI</A> (which see).``1';
isbe[5375]='Laadah`la\'-a-da (la\'dah): A descendant of Judah (<a onClick="return mV(\'1Ch\',4,21);">1Ch 4:21</a>).``1';
