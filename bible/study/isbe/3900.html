isbe[3941]='Greeting`gret\'-ing (sha\'-al; chairo, aspasmos, aspazomai):<P>(1) Sha\'-al means "to ask," "to inquire of anyone respecting welfare," hence, "to greet." In the Old Testament the word "greet" occurs only once in the King James Version or the Revised Version (British and American), namely, in <a onClick="return mV(\'1Sa\',25,5);">1Sa 25:5</a>, "Go to Nabal, and greet him in my name." But it is implied in other places where shalom ("well," "prosperity," "peace"), the common Hebrew greeting, is used; e.g. in <a onClick="return mV(\'Gen\',37,4);">Ge 37:4</a>, it is said of Joseph that "his brethren could not speak peaceably unto him," i.e. could not give him the common friendly greeting of "Peace!" "Peace be to thee!" So, in <a onClick="return mV(\'Gen\',43,27);">Ge 43:27</a>, the Revised Version (British and American) "He asked them of their welfare" (King James Version margin "peace"); <a onClick="return mV(\'Exd\',18,7);">Ex 18:7</a>, "They asked each other of their Welfare"(king James Version, margin "peace"); <a onClick="return mV(\'2Sa\',11,7);">2Sa 11:7</a>, "how Joab did, and how the people did" (the Revised Version (British and American) "fared," the King James Version margin "of the peace of"); Joab said to Amasa (<a onClick="return mV(\'2Sa\',20,9);">2Sa 20:9</a>), the Revised Version (British and American) "Is it well with thee, my brother?" (Hebrew "Art thou in peace, my brother?"); Boaz greeted his reapers with "Yahweh be with you," and they answered, "Yahweh bless thee" (<a onClick="return mV(\'Rth\',2,4);">Ru 2:4</a>; compare <a onClick="return mV(\'Psa\',129,8);">Ps 129:8</a>, "The blessing of Yahweh be upon you; we bless you in the name of Yahweh"). For the king, we have, the King James Version and the English Revised Version God save the king (m "Let the king live," the American Standard Revised Version "(Long) live the king") (<a onClick="return mV(\'1Sa\',10,24);">1Sa 10:24</a>, etc.); "Let my lord king David live for ever" (<a onClick="return mV(\'1Ki\',1,31);">1Ki 1:31</a>; see also <a onClick="return mV(\'Neh\',2,3);">Ne 2:3</a>; <a onClick="return mV(\'Dan\',2,4);">Da 2:4</a>, etc.). In Ecclesiasticus 6:5 it is said "a fair-speaking tongue will increase kind greetings," the Revised Version (British and American) "multiply courtesies" (euprosegora).<P>(2) When Jesus sent forth His disciples to proclaim the kingdom, they were to "salute" the house they came to (<a onClick="return mV(\'Mat\',10,12);">Mt 10:12</a>), saying (<a onClick="return mV(\'Luk\',10,5);">Lu 10:5</a>), "Peace (eirene) be to this house!"; if it was not worthy, the blessing should return to themselves. After His resurrection He greeted His disciples saying, "Peace be unto you" (<a onClick="return mV(\'Luk\',24,36);">Lu 24:36</a>; <a onClick="return mV(\'Jhn\',20,19,21,26);">Joh 20:19, 21, 26</a>); He left His "peace" with them as His parting blessing (<a onClick="return mV(\'Jhn\',14,27);">Joh 14:27</a>)—"not as the world giveth," in a formal way. A frequent form of greeting in the New Testament is chairo ("to rejoice," imperative and infinitive, chaire, chairete, "Joy to thee," "Joy to you," translated "Hail!" and "All hail!" <a onClick="return mV(\'Mat\',26,49);">Mt 26:49</a>; <a onClick="return mV(\'Mat\',27,29);">27:29</a>; <a onClick="return mV(\'Mat\',28,9);">28:9</a>; <a onClick="return mV(\'Mar\',15,18);">Mr 15:18</a>; <a onClick="return mV(\'Luk\',1,28);">Lu 1:28</a>; <a onClick="return mV(\'Jhn\',19,3);">Joh 19:3</a>), "Rejoice!" (<a onClick="return mV(\'Phl\',3,1);">Php 3:1</a>; the English Revised Version, margin "farewell"). Another word for greeting is aspasmos, "greetings in the markets" (the King James Version <a onClick="return mV(\'Mat\',23,7);">Mt 23:7</a>; <a onClick="return mV(\'Mar\',12,38);">Mr 12:38</a>, "salutations"; <a onClick="return mV(\'Luk\',11,43);">Lu 11:43</a>, "greetings," <a onClick="return mV(\'Luk\',20,46);">Lu 20:46</a>; also <a onClick="return mV(\'Luk\',1,29,41,44);">Lu 1:29, 41, 44</a>; <a onClick="return mV(\'1Cr\',16,21);">1Co 16:21</a>; <a onClick="return mV(\'Col\',4,18);">Col 4:18</a>; <a onClick="return mV(\'2Th\',3,17);">2Th 3:17</a>; in all these places the Revised Version (British and American) has "salutation").<P>(3) Of epistolary greetings we have examples in <a onClick="return mV(\'Ezr\',4,17);">Ezr 4:17</a>, "Peace" (shelam), etc.; <a onClick="return mV(\'Ezr\',5,17);">5:7</a>; <a onClick="return mV(\'Dan\',4,1);">Da 4:1</a>; <a onClick="return mV(\'Dan\',6,25);">6:25</a>. These are frequent in the Apoc: 1Esdras 6:7, "to King Darius greeting" (chairo); 8:9; 1Macc 10:18, etc.; 2Macc 1:10, "greeting, health," etc. We have the same form in <a onClick="return mV(\'Act\',15,23);">Ac 15:23</a>; <a onClick="return mV(\'Act\',23,26);">23:26</a>. In <a onClick="return mV(\'3Jo\',1,14);">3Joh 1:14</a> it is, "Peace (be) unto thee. The friends salute thee." Paul opens most of his epistles with the special Christian greeting, "Grace to you and peace from God our Father and the Lord Jesus Christ" (<a onClick="return mV(\'Rom\',1,7);">Ro 1:7</a>; <a onClick="return mV(\'1Cr\',1,3);">1Co 1:3</a>, etc.). Also at the close, "The grace of the Lord Jesus Christ be with you" (<a onClick="return mV(\'1Cr\',16,23);">1Co 16:23</a>; <a onClick="return mV(\'2Cr\',13,14);">2Co 13:14</a>, etc.). He directs greetings to be given to various persons, and sends greetings from those who are with him (<a onClick="return mV(\'Rom\',16,\'5-23\');">Ro 16:5-23</a>; <a onClick="return mV(\'1Cr\',16,19);">1Co 16:19</a>; <a onClick="return mV(\'2Cr\',13,13);">2Co 13:13</a>; <a onClick="return mV(\'Phl\',4,21);">Php 4:21</a>; <a onClick="return mV(\'Col\',4,10);">Col 4:10</a>, etc.). In those cases the word is aspazomai, and the Revised Version (British and American) translates "salute," etc. (compare <a onClick="return mV(\'Jam\',1,1);">Jas 1:1</a>; <a onClick="return mV(\'1Pe\',1,2);">1Pe 1:2</a>; <a onClick="return mV(\'1Pe\',5,14);">5:14</a>; <a onClick="return mV(\'2Pe\',1,2);">2Pe 1:2</a>; <a onClick="return mV(\'2Jo\',1,3,13);">2Joh 1:3, 13</a>; <a onClick="return mV(\'Jud\',1,2);">Jude 1:2</a>).`<a href="./study/isbe/search.html?string=GODSPEED">GODSPEED</a>; <a href="./study/isbe/search.html?string=KISS">KISS</a>`185';
isbe[3942]='Greyhound`gra\'-hound.`<a href="./study/isbe/search.html?string=DOG">DOG</a>`1';
isbe[3943]='Grief; Grieve`gref, grev: There are some 20 Hebrew words translated in the King James Version by "grief," "grieve," "to be grieved," etc. Among the chief are chalah, choli, yaghon, ka\'ac, atsabh. They differ, partly, in their physical origin, and partly, in the nature and cause of the feeling expressed. the Revised Version (British and American) in several instances gives effect to this.<P>(1) Chalah, choli express the sense of weakness, sickness, pain (e.g. Samson, in <a onClick="return mV(\'Jdg\',16,7,11,17);">Jud 16:7, 11, 17</a>, "Then shall I become weak (chalah), and be as another man"); <a onClick="return mV(\'Isa\',17,11);">Isa 17:11</a> the King James Version, "a heap in the day of grief"; <a onClick="return mV(\'Isa\',53,3,4);">Isa 53:3-4</a>, "a man of sorrows, and acquainted with grief," "He hath borne our griefs" (choli), the Revised Version, margin Hebrew "sickness, sicknesses"; <a onClick="return mV(\'Isa\',53,10);">53:10</A>, "He hath put him to grief," the Revised Version, margin "made him sick" (chalah) (translated by Dillmann and others, "to crush him incurably"; compare <a onClick="return mV(\'Mic\',6,13);">Mic 6:13</a>; <a onClick="return mV(\'Nah\',3,19);">Na 3:19</a>); yaghon, perhaps from the pain and weariness of toil (<a onClick="return mV(\'Psa\',31,10);">Ps 31:10</a>), "For my life is spent with grief," the Revised Version (British and American) "sorrow"; "The Lord added grief to my sorrow," the Revised Version (British and American) "sorrow to my pain" (<a onClick="return mV(\'Jer\',45,3);">Jer 45:3</a>); ka\'ac implies provocation, anger, irritation; thus Hannah said to Eli (the King James Version), "Out of the abundance of my complaint and my grief (the Revised Version (British and American) "provocation") have I spoken" (<a onClick="return mV(\'1Sa\',1,16);">1Sa 1:16</a>). <a onClick="return mV(\'Psa\',6,7);">Ps 6:7</a>; <a onClick="return mV(\'Psa\',31,9);">31:9</a>, "grief"; <a onClick="return mV(\'Pro\',17,25);">Pr 17:25</a>, "A foolish son is a grief to his father" (i.e. source of provocation; the same word is rendered "wrath" in <a onClick="return mV(\'Pro\',12,16);">12:16</A>, the King James Version "a fool\'s wrath," the Revised Version (British and American) "vexation"; so also <a onClick="return mV(\'Pro\',27,3);">Pr 27:3</a>); <a onClick="return mV(\'Job\',6,2);">Job 6:2</a>, "Oh that my grief were thoroughly weighed," the Revised Version (British and American) "Oh that my vexation were but weighed" (in <a onClick="return mV(\'Job\',5,2);">5:2</a> the King James Version the same word is translated "wrath," the Revised Version (British and American) "vexation"); ke\'ebh, is "sorrow," "pain," properly "to hurt." It occurs in <a onClick="return mV(\'Job\',2,13);">Job 2:13</a> "His grief (the Revised Version, margin "or pain") was very great"; also <a onClick="return mV(\'Job\',16,6);">16:6</a> the Revised Version (British and American), "grief"; makh\'obh "sorrows," "pain," "suffering" (<a onClick="return mV(\'2Ch\',6,29);">2Ch 6:29</a>, the Revised Version (British and American) "sorrow"; <a onClick="return mV(\'Psa\',69,26);">Ps 69:26</a>, the Revised Version, margin "or pain"; <a onClick="return mV(\'Isa\',53,3);">Isa 53:3</a>, "a man of sorrows"; <a onClick="return mV(\'Isa\',53,4);">53:4</A>, "Surely he hath carried our sorrows"); marah and marar indicate "bitterness" (<a onClick="return mV(\'Gen\',26,35);">Ge 26:35</a>; <a onClick="return mV(\'Gen\',49,23);">49:23</a>; <a onClick="return mV(\'1Sa\',30,6);">1Sa 30:6</a>; <a onClick="return mV(\'Rth\',1,13);">Ru 1:13</a>; <a onClick="return mV(\'Pro\',14,10);">Pr 14:10</a>, "The heart knoweth its own bitterness, marah); puqah implies staggering, or stumbling, only in <a onClick="return mV(\'1Sa\',25,31);">1Sa 25:31</a>, "This shall be no grief unto thee," the Revised Version, margin Hebrew "cause of staggering"; ra\' (a common word for "evil") denotes an evil, a calamity, only once in the King James Version translated "grief," namely, of Jonah\'s gourd, "to deliver him from his grief," the Revised Version (British and American) "from his evil case" (<a onClick="return mV(\'Jon\',4,6);">Jon 4:6</a>); yara\', "to be evil," <a onClick="return mV(\'Deu\',15,10);">De 15:10</a>, the Revised Version (British and American) "Thy heart shall not be grieved when thou givest unto him" (also <a onClick="return mV(\'1Sa\',1,8);">1Sa 1:8</a>; <a onClick="return mV(\'Neh\',2,10);">Ne 2:10</a>; <a onClick="return mV(\'Neh\',13,8);">13:8</a>; several times translated "grievous"); charah, "to burn," "to be wroth" (e.g. <a onClick="return mV(\'Gen\',4,6);">Ge 4:6</a>, "Why art thou wroth?"), is translated "grieved" in <a onClick="return mV(\'Gen\',45,5);">Ge 45:5</a>, and <a onClick="return mV(\'1Sa\',15,11);">1Sa 15:11</a> the King James Version (the Revised Version (British and American) "Samuel was wroth"); the same word is often used of the kindling of anger; la\'ah, "to be weary," "tired," "faint" (<a onClick="return mV(\'Pro\',26,15);">Pr 26:15</a>), the King James Version "The slothful hideth his hand in his bosom, it grieveth him to bring it again to his mouth," the Revised Version (British and American) "wearieth"; also <a onClick="return mV(\'Job\',4,2);">Job 4:2</a>; atsabh, "to grieve," "to be vexed," occurs in <a onClick="return mV(\'Gen\',6,6);">Ge 6:6</a>; <a onClick="return mV(\'Gen\',34,7);">34:7</a>; <a onClick="return mV(\'Gen\',45,5);">45:5</a>, etc.; <a onClick="return mV(\'Psa\',78,40);">Ps 78:40</a>, "How oft did they...grieve him in the desert." Of other words sometimes translated "grief" may be mentioned quT, "to weary of," "to loathe" (<a onClick="return mV(\'Psa\',95,10);">Ps 95:10</a>), "Forty long years was I grieved with that generation"; in <a onClick="return mV(\'Psa\',119,158);">119:158</a>; <a onClick="return mV(\'Psa\',193,21);">139:21</a>, the Revised Version, margin "loathe"; chamets, implying to be bitterly or violently moved, sour (often translated "leavened"), only in <a onClick="return mV(\'Psa\',73,21);">Ps 73:21</a>, the Revised Version (British and American) "For my soul was grieved," margin, Hebrew "was in a ferment."<P>(2) In the New Testament "grief," "grieve," etc., are infrequent. The commonest words are lupe (<a onClick="return mV(\'1Pe\',2,19);">1Pe 2:19</a>), the Revised Version (British and American) "griefs," elsewhere translated "sorrow"; lupeo, "to grieve," "afflict" (<a onClick="return mV(\'Mar\',10,22);">Mr 10:22</a>, the Revised Version (British and American) "sorrowful"; <a onClick="return mV(\'Jhn\',21,17);">Joh 21:17</a> "Peter was grieved"; <a onClick="return mV(\'Rom\',14,15);">Ro 14:15</a>; <a onClick="return mV(\'2Cr\',2,4);">2Co 2:4</a>, the Revised Version (British and American) "made sorry"; <a onClick="return mV(\'2Cr\',2,5);">2:5</A>, "caused sorrow"; <a onClick="return mV(\'Eph\',4,30);">Eph 4:30</a>, "Grieve not the Holy Spirit of God"); diaponeomai, literally, "to labor through," "to grieve self" occurs twice (<a onClick="return mV(\'Act\',4,2);">Ac 4:2</a>; <a onClick="return mV(\'Act\',16,18);">16:18</a> the Revised Version (British and American) "sore troubled"); stenazo, "to groan, or sigh," once only translated "grief" (<a onClick="return mV(\'Hbr\',13,17);">Heb 13:17</a>), the Revised Version, margin "groaning"; prosochthizo, "to be indignant," etc., twice (<a onClick="return mV(\'Hbr\',3,10,17);">Heb 3:10, 17</a>, the Revised Version (British and American) "displeased"). The reference is to <a onClick="return mV(\'Psa\',95,10);">Ps 95:10</a>, where the Septuagint by this Greek word translates qut (see above).<P>The less frequency in the New Testament of words denoting "grief" is significant. Christ came "to comfort all that mourn—to give a garland for ashes, the oil of joy for mourning, the garment of praise for the spirit of heaviness." Christians, however, cannot but feel sorrow and be moved by grief, and it is to be noted that in both the Old Testament and New Testament, God Himself is said to be susceptible to grief.``185';
isbe[3944]='Grievance`grev\'-ans (\'amal): Occurs only in the King James Version as a translation of <a onClick="return mV(\'Hab\',1,3);">Hab 1:3</a>, "Why dost thou show me iniquity, and cause me to behold grievance?" (the Revised Version (British and American) "look upon perverseness"); \'amal is also translated "perverseness" by the King James Version and the Revised Version (British and American) in <a onClick="return mV(\'Num\',23,21);">Nu 23:21</a>, "perverseness in Israel"; <a onClick="return mV(\'Isa\',10,1);">Isa 10:1</a>, the King James Version "grievousness," the Revised Version (British and American) "perverseness." In <a onClick="return mV(\'Hab\',1,13);">Hab 1:13</a>, the King James Version translates the same word "iniquity" (margin "grievance"), "Thou art of purer eyes than to behold evil and canst not look on iniquity" (margin "grievance"), the Revised Version (British and American) "perverseness." The word means originally "toil," "labor" with sorrow, misery, etc., as the consequence, and is often so translated. It is the word in <a onClick="return mV(\'Isa\',53,11);">Isa 53:11</a>, "He shall see of the travail of his soul, and shall be satisfied."``185';
isbe[3945]='Grievous; Grievously; Greievousness`grev\'-us; grev\'-us-li; grev\'-us-nes: In addition to several of the words mentioned under <a href="study/isbe/search.html?string=GRIEF">GRIEF</a> (which see), we have kabhedh ("heavy") 8 times, e.g. <a onClick="return mV(\'Gen\',12,10);">Ge 12:10</a>, "The famine was grievous in the land," the Revised Version (British and American) "sore"; marats ("powerful"), "a grievous curse" (<a onClick="return mV(\'1Ki\',2,8);">1Ki 2:8</a>); cur, "to turn aside" (<a onClick="return mV(\'Jer\',6,28);">Jer 6:28</a>), "grievous revolters"; qasheh, "to make sharp" (<a onClick="return mV(\'1Ki\',12,4);">1Ki 12:4</a>; <a onClick="return mV(\'2Ch\',10,4);">2Ch 10:4</a>); tachalu\'im (<a onClick="return mV(\'Jer\',16,4);">Jer 16:4</a>), "They shall die grievous deaths," the Revised Version, margin "deaths of sicknesses"; \'athaq (<a onClick="return mV(\'Psa\',31,18);">Ps 31:18</a>), "which speak grievous things proudly," the Revised Version (British and American) "against the righteous insolently"; cheT, "sin" (<a onClick="return mV(\'Lam\',1,8);">La 1:8</a>), "Jerus hath grievously sinned" (literally, "hath sinned a sin"); ma\'al, "trespass" (<a onClick="return mV(\'Eze\',14,13);">Eze 14:13</a>), "trespassing grievously" (literally, "trespassing a trespass") the Revised Version (British and American) "committing a trespass"; kobhedh, "weight" (<a onClick="return mV(\'Isa\',21,15);">Isa 21:15</a>), "grievousness"; barus, "heavy," "grievous wolves" (<a onClick="return mV(\'Act\',20,29);">Ac 20:29</a>), "grievous charges" (<a onClick="return mV(\'Act\',25,7);">Ac 25:7</a>), "His commandments are not grievous" (<a onClick="return mV(\'1Jo\',5,3);">1Joh 5:3</a>); okneros, the Revised Version (British and American) "irksome" (<a onClick="return mV(\'Phl\',3,1);">Php 3:1</a>); poneros, "evil" (<a onClick="return mV(\'Rev\',16,2);">Re 16:2</a>), "a grievous sore"; dusbastaktos, "grievous to be borne" (<a onClick="return mV(\'Mat\',23,4);">Mt 23:4</a>; <a onClick="return mV(\'Luk\',11,46);">Lu 11:46</a>); deinos, "greatly," "grievously tormented" (<a onClick="return mV(\'Mat\',8,6);">Mt 8:6</a>); kakos, "badly," "grievously vexed" (<a onClick="return mV(\'Mat\',15,22);">Mt 15:22</a>).``185';

isbe[3949]='Groan`gron (na\'aq, \'anaq; stenazo, embrimaomai): The English word, noun and verb, is an attempt to imitate the vocal sound which is expressive of severe pain or distress, physical or mental. It is cognate with the Scottish dialect word girn, and with grin in its original obsolete sense, as used in the Anglican Prayer-book version of <a onClick="return mV(\'Psa\',59,6,14);">Ps 59:6, 14</a>, "grin like a dog and go about the city"; here "grin" is a translation of hamah, and means the sound of the nightly howling of the pariah dogs in Jerusalem and other oriental cities. It is used in the Old Testament:<P>(1) To denote the expression accompanying physical suffering, as in the case of the Israelites in Egypt oppressed by Pharaoh\'s taskmasters (<a onClick="return mV(\'Exd\',2,24);">Ex 2:24</a>; <a onClick="return mV(\'Exd\',6,5);">6:5</a>), or in Palestine under the yoke of the Canaanites (<a onClick="return mV(\'Jdg\',2,18);">Jud 2:18</a>, neqaqah). It is also used in Job\'s description of the sufferings and wretchedness of the poor (<a onClick="return mV(\'Job\',24,12);">Job 24:12</a>) as well as in his complaint concerning his own suffering when smitten by the hand of God (<a onClick="return mV(\'Job\',23,2);">Job 23:2</a>). The Psalmist speaks of groaning when fever-stricken and remorseful, the King James Version and the Revised Version (British and American) "roaring all the day long" (<a onClick="return mV(\'Psa\',32,3);">Ps 32:3</a>; <a onClick="return mV(\'Psa\',38,9);">38:9</a>; <a onClick="return mV(\'Psa\',102,5);">102:5</a>; <a onClick="return mV(\'Psa\',22,1);">22:1</a>).<P>(2) The expression of suffering on the part of beasts, hungry and thirsty in drought (<a onClick="return mV(\'Joe\',1,18);">Joe 1:18</a>).<P>(3) The manifestation of mental and spiritual distress as in <a onClick="return mV(\'Psa\',6,6);">Ps 6:6</a>; <a onClick="return mV(\'Psa\',102,20);">102:20</a> (the Revised Version (British and American) "sighing").<P>(4) Metaphorically groaning is the despairing note of Egypt in the prophecy of her overthrow by Babylon, the sound being that uttered by a deadly wounded man (<a onClick="return mV(\'Eze\',30,24);">Eze 30:24</a>; similarly in the prophecy of the Persian conquest the misery of Babylon is thus represented by <a onClick="return mV(\'Jer\',51,52);">Jer 51:52</a>); and the misery of Tyre when taken by Babylon is similarly described (<a onClick="return mV(\'Eze\',26,15);">Eze 26:15</a>, the King James Version "cry").<P>The word for "sigh" (\'anachah) is closely allied, and the meanings are sufficiently akin, so that the terms seem interchangeable. A sigh is physically a sign of respiratory distress due to depressed action of the heart; sighing is consequently the indication of physical weakness or mental disquietude, as <a onClick="return mV(\'Psa\',12,5);">Ps 12:5</a>; <a onClick="return mV(\'Psa\',31,10);">31:10</a>; <a onClick="return mV(\'Psa\',79,11);">79:11</a>; <a onClick="return mV(\'Isa\',21,2);">Isa 21:2</a>; <a onClick="return mV(\'Isa\',24,7);">24:7</a>; <a onClick="return mV(\'Isa\',35,10);">35:10</a>; <a onClick="return mV(\'Jer\',45,3);">Jer 45:3</a>.<P>Na\'aq is the crying of persons dying or starving, as in <a onClick="return mV(\'Eze\',30,24);">Eze 30:24</a>; <a onClick="return mV(\'Job\',24,12);">Job 24:12</a>. A somewhat similar word, haghah, means the complaining sound like that of the cooing of doves (<a onClick="return mV(\'Isa\',59,11);">Isa 59:11</a>; <a onClick="return mV(\'Nah\',2,7);">Na 2:7</a>). Nehi is the sound of lamentation of the dead (<a onClick="return mV(\'Jer\',9,10);">Jer 9:10</a>; <a onClick="return mV(\'Jer\',31,15);">31:15</a>; <a onClick="return mV(\'Amo\',5,16);">Am 5:16</a>).<P>In the New Testament "groaning" is used for the expression of mental distress. In <a onClick="return mV(\'Jhn\',11,33,35);">Joh 11:33, 35</a> the word used is part of the verb embrimaomai, which conveys the idea of deep and earnest emotion. The same word in two other passages is translated "strictly charged," and indicates the emphasis of the charge (<a onClick="return mV(\'Mat\',9,30);">Mt 9:30</a>; <a onClick="return mV(\'Mar\',1,43);">Mr 1:43</a>). Elsewhere "sighing" and "groaning" are renderings of words derived from the verb stenazo, as in <a onClick="return mV(\'Rom\',8,23);">Ro 8:23</a>; <a onClick="return mV(\'2Cr\',5,2,4);">2Co 5:2, 4</a>; <a onClick="return mV(\'Mar\',7,34);">Mr 7:34</a>; <a onClick="return mV(\'Mar\',8,12);">8:12</a>. Stephen calls the groaning of Israel in Egypt stenagmos (<a onClick="return mV(\'Act\',7,34);">Ac 7:34</a>), and the united wail of the travailing creation is expressed by Paul by the word sunstenazei (<a onClick="return mV(\'Rom\',8,22);">Ro 8:22</a>). The sigh is a characteristic sign of woe in <a onClick="return mV(\'Isa\',21,2);">Isa 21:2</a>; <a onClick="return mV(\'Isa\',24,7);">24:7</a>; <a onClick="return mV(\'Jer\',45,3);">Jer 45:3</a>; <a onClick="return mV(\'Lam\',1,4,8,11,12);">La 1:4,8,11,12</A>; <a onClick="return mV(\'Eze\',9,4);">Eze 9:4</a>; <a onClick="return mV(\'Eze\',21,6);">21:6</a> f.``107';
isbe[3950]='Gross`gros (\'araphel): Used twice with "darkness" in <a onClick="return mV(\'Isa\',60,2);">Isa 60:2</a>; <a onClick="return mV(\'Jer\',13,16);">Jer 13:16</a>. In the New Testament the verb pachuno, "to make fat," is applied twice to "making gross" the heart (<a onClick="return mV(\'Mat\',13,15);">Mt 13:15</a>; <a onClick="return mV(\'Act\',28,27);">Ac 28:27</a>).`<a href="./study/isbe/search.html?string=GREASE">GREASE</a>`1';
isbe[3951]='Ground; Grounded`ground, ground\'-ed (\'adhamah, \'erets; ge):<P>(1) "Ground" is in the King James Version the translation of \'adhamah, "the soil," the ground so called from its red color, frequently also translated "earth" and "land" (<a onClick="return mV(\'Gen\',2,5);">Ge 2:5</a>f; etc.; <a onClick="return mV(\'Exd\',3,5);">Ex 3:5</a>; <a onClick="return mV(\'Exd\',8,21);">8:21</a>, etc.); it is more often the translation of \'erets, which means rather the earth, most often translated "earth" and "land" (<a onClick="return mV(\'Gen\',18,2);">Ge 18:2</a>; <a onClick="return mV(\'Psa\',74,7);">Ps 74:7</a>; <a onClick="return mV(\'Isa\',3,26);">Isa 3:26</a>, etc.); other words are chelqah, "portion," "field" (<a onClick="return mV(\'2Sa\',23,12);">2Sa 23:12</a>, the Revised Version (British and American) "plot"); charish, "ploughing" (<a onClick="return mV(\'1Sa\',8,12);">1Sa 8:12</a>); sadheh, "a plain," "a field" (<a onClick="return mV(\'1Ch\',11,13);">1Ch 11:13</a>, the Revised Version (British and American) "plot of ground"); for other special words see dry; <a href="study/isbe/search.html?string=FALLOW">FALLOW</a>; <a href="study/isbe/search.html?string=PARCHED">PARCHED</A>.<P>(2) In the New Testament the common word for "ground" is ge, "earth," "soil," "land" (<a onClick="return mV(\'Mat\',13,8);">Mt 13:8</a>; <a onClick="return mV(\'Act\',7,33);">Ac 7:33</a>, "holy ground," etc.); other words are agros, "field" (<a onClick="return mV(\'Luk\',14,18);">Lu 14:18</a>, "I have bought a piece of ground" the Revised Version (British and American) "field"); chorion, "spot," "place" (<a onClick="return mV(\'Jhn\',4,5);">Joh 4:5</a>, "parcel of ground").<P>(3) As past participle of "to grind," "ground" appears as the translation of riphoth, pounded grain (<a onClick="return mV(\'2Sa\',17,19);">2Sa 17:19</a>, the Revised Version (British and American) "bruised"); "ground" is also the translation of Tachan (<a onClick="return mV(\'Exd\',32,20);">Ex 32:20</a>; <a onClick="return mV(\'Num\',11,8);">Nu 11:8</a>; <a onClick="return mV(\'Deu\',9,21);">De 9:21</a>, the Revised Version (British and American) "grinding").<P>(4) "Ground," as the basis or foundation of anything, occurs in <a onClick="return mV(\'1Ti\',3,15);">1Ti 3:15</a> as the translation of hedraioma (from edaphos), "the pillar and ground of the truth," the Revised Version, margin "stay."<P>"Grounded" is used in the sense of founded, based, fixed in (<a onClick="return mV(\'Isa\',30,32);">Isa 30:32</a>), "and in every place where the grounded staff shall pass, which the Lord shall lay upon him," the King James Version margin "Hebrew every passing of the rod founded," the Revised Version (British and American) "and every stroke (margin "Hebrew passing") of the appointed staff (margin "Or staff of doom (Hebrew foundation)"), which Yahweh shall lay upon him"; following, <a onClick="return mV(\'Isa\',30,31);">Isa 30:31</a>, "with his rod will he (Yahweh) smite him"; Delitzsch, "every stroke of the rod of destiny which Yahweh causes to fall upon Asshur"; the word is mucadhah, from yacadh, "to place," "to found," "to appoint," "to ordain," hence, "appointed rod (of punishment)," seems the simplest rendering.<P>In <a onClick="return mV(\'Eph\',3,17);">Eph 3:17</a> we have "rooted and grounded in love," and in <a onClick="return mV(\'Col\',1,23);">Col 1:23</a>, "if ye continue in the faith, grounded and settled," the Revised Version (British and American) "steadfast," both themelioo, "to lay a foundation." In Ecclesiasticus 18:6 "ground" is used for the "bottom of things," but the Revised Version (British and American) has "to track them out" (exichneuo), "to trace out."<P>(5) Figurative uses of "ground" are as representing the heart in relation to its reception of words of truth and righteousness (<a onClick="return mV(\'Jer\',4,3);">Jer 4:3</a>; <a onClick="return mV(\'Hsa\',10,12);">Ho 10:12</a>, "Break up your fallow ground"); to the word of the kingdom as preached by Christ (<a onClick="return mV(\'Mat\',13,8,23);">Mt 13:8, 23</a>); dry, parched, thirsty ground stands for a poor condition (<a onClick="return mV(\'Psa\',107,33,35);">Ps 107:33, 35</a>; <a onClick="return mV(\'Isa\',35,7);">Isa 35:7</a>; <a onClick="return mV(\'Isa\',44,3);">44:3</a>; <a onClick="return mV(\'Isa\',53,2);">53:2</a>; <a onClick="return mV(\'Eze\',19,13);">Eze 19:13</a>).``185';
isbe[3952]='Grove`grov:<P>(1) \'asherah.<P>(2) \'eshel (<a onClick="return mV(\'Gen\',21,33);">Ge 21:33</a> the King James Version, the Revised Version (British and American) "a tamarisk tree")`<a href="./study/isbe/search.html?string=TAMARISK">TAMARISK</a>; <a href="./study/isbe/search.html?string=ASHERAH">ASHERAH</a>`1';
isbe[3953]='Grudge`gruj (natar; stenazo, goggusmos): "Grudge" (perhaps a mimetic word, compare Greek gru) is "to grumble" or "murmur" at any person or thing, to entertain an envious or covetous feeling, to do or give anything unwillingly, etc. It occurs in the King James Version as the translation of natar, "to keep (anger)" (<a onClick="return mV(\'Lev\',19,18);">Le 19:18</a>, "Thou shalt not...bear any grudge against the children of thy people"); in <a onClick="return mV(\'Psa\',59,15);">Ps 59:15</a>, as the translation, in text, of Hebrew lun or lin, "to pass the night," "to tarry," Niphal, "to show oneself obstinate," "to murmur or complain" (of the enemies who were hunting David like dogs), "Let them wander up and down for meat, and grudge if they be not satisfied," margin "If they be not satisfied then will they stay all night," the Revised Version (British and American) "And tarry all night if they be not satisfied"; but see <a onClick="return mV(\'Exd\',15,24);">Ex 15:24</a>; <a onClick="return mV(\'Exd\',16,2);">16:2</a>; <a onClick="return mV(\'Num\',14,2);">Nu 14:2</a>; <a onClick="return mV(\'Jos\',9,18);">Jos 9:18</a>, etc., where the translation is "murmur"; may not the meaning be "and growl (or howl) if they be not satisfied"? "Grudge" formerly implied open expression of discontent, etc., e.g. Wyclif has in <a onClick="return mV(\'Luk\',15,2);">Lu 15:2</a>, "The farisies and scribis grucchiden seiynge," etc.<P>In <a onClick="return mV(\'Jam\',5,9);">Jas 5:9</a>, stenazo, "to groan," "to complain" (from affliction or from impatience or ill-humor), is translated "grudge," "Grudge not one against another, brethren," the Revised Version (British and American) "murmur not"; goggusmos, "a murmuring" (compare <a onClick="return mV(\'Jhn\',7,12);">Joh 7:12</a>f; <a onClick="return mV(\'Act\',6,1);">Ac 6:1</a>), is rendered "grudging" (<a onClick="return mV(\'1Pe\',4,9);">1Pe 4:9</a>), "Use hospitality one to another without grudging," the Revised Version (British and American) "murmuring"; compare <a onClick="return mV(\'Phl\',2,14);">Php 2:14</a>; me ek lupes, "not out of grief," is "without grudging" (<a onClick="return mV(\'2Cr\',9,7);">2Co 9:7</a>, the Revised Version (British and American) "not grudging" margin, Greek "of sorrow"); in Ecclesiasticus 10:25 we have "will not grudge" (gogguzo), the Revised Version (British and American) "murmur."<P>"Grudge" was frequent in the earlier VSS, but is changed in the King James Version for the most part into "murmur"; the Revised Version (British and American) completes the change, except <a onClick="return mV(\'Lev\',19,18);">Le 19:18</a>, and text of <a onClick="return mV(\'2Cr\',9,7);">2Co 9:7</a>.``185';
isbe[3954]='Guard`gard:<P>(1) sar ha-Tabbachim, "captain of the guard," literally, "slaughterers" (<a onClick="return mV(\'Gen\',37,36);">Ge 37:36</a>; <a onClick="return mV(\'Gen\',39,1);">39:1</a>; <a onClick="return mV(\'Gen\',40,3,4);">40:3-4</a>; <a onClick="return mV(\'Gen\',41,10,12);">41:10, 12</a>); rabh Tabbachim (<a onClick="return mV(\'2Ki\',25,8,11,20);">2Ki 25:8, 11, 20</a>; <a onClick="return mV(\'Jer\',39,9);">Jer 39:9</a>, etc.); rabh tabbachayyah (<a onClick="return mV(\'Dan\',2,14);">Da 2:14</a>); ratsim, "guard," the King James Version "footmen" (<a onClick="return mV(\'1Sa\',22,17);">1Sa 22:17</a>); sare ha-ratsim, "chief of the guard" the King James Version "captains of the guard" (<a onClick="return mV(\'1Ki\',14,27);">1Ki 14:27</a>); ta\' ha-ratsim, "guard-chamber" (<a onClick="return mV(\'1Ki\',14,28);">1Ki 14:28</a>; compare <a onClick="return mV(\'Eze\',40,21);">Eze 40:21</a>, etc., where "lodges" are "guardrooms"; see A.B. Davidson at the place).<P>(2) mishmar, "guard," a defense to a point of danger (<a onClick="return mV(\'Neh\',4,22);">Ne 4:22</a>f; <a onClick="return mV(\'Eze\',38,7);">Eze 38:7</a>).<P>(3) mishma\'ath, "guard" (<a onClick="return mV(\'2Sa\',23,23);">2Sa 23:23</a>, where the American Revised Version, margin and the Revised Version, margin have "council," the body over which Benaiah was set by David and whose functions were perhaps those of consultation)<P>(4) spekoulator, "guard" (<a onClick="return mV(\'Mar\',6,27);">Mr 6:27</a>, "a man of Herod\'s guard," where, as in one or two other cases, Mark, writing for Romans, simply transliterates the Latin speculator "a scout," "an executioner," as in loc.).<P>(5) stratopedarches, "captain of the guard" the King James Version, "captain of the praetorian guard" the Revised Version, margin, <a onClick="return mV(\'Act\',28,16);">Ac 28:16</a>. See <a href="study/isbe/search.html?string=CAPTAIN">CAPTAIN</a>.<P>(6) (koustodia), "watch" the King James Version, "guard" the American Standard Revised Version and the Revised Version (British and American) (<a onClick="return mV(\'Mat\',27,65,66);">Mt 27:65-66</a>; <a onClick="return mV(\'Mat\',28,11);">28:11</a>).<P>1. Royal Body-Guard:<P>An oriental monarch\'s body-guard consisted of picked men attached to his person and ready to fulfill his pleasure in important and confidential concerns. At the courts of Egypt and Babylon the members of the guard were known as "slaughterers," "executioners" (<a onClick="return mV(\'Gen\',37,36);">Ge 37:36</a> King James Version margin, the American Revised Version, margin and the Revised Version, margin, where Potiphar is called their captain); <a onClick="return mV(\'2Ki\',25,8);">2Ki 25:8</a>, where Nebuzaradan is called their captain (King James Version margin "chief marshal"). Whether it had ever been the function of the body-guard to kill meat for the royal table there is little directly to show; that they acted as executioners can be well understood. In Israel they were known as "the footmen" (<a onClick="return mV(\'1Sa\',22,17);">1Sa 22:17</a> the King James Version, the American Revised Version, margin and the Revised Version, margin "runners") who acted as royal messengers or couriers from the time of Saul onward (<a onClick="return mV(\'2Ki\',10,25);">2Ki 10:25</a>; <a onClick="return mV(\'2Ki\',11,6);">11:6</a>); and this designation connects them with the couriers of the kings of Persia (<a onClick="return mV(\'Est\',3,13,15);">Es 3:13, 15</a>; <a onClick="return mV(\'Est\',8,14);">8:14</a>, where our versions render "posts," though the Hebrew is ratsim).<P>2. Composed of Foreigners:<P>The men of the royal body-guard were usually foreigners like the janissaries of oriental monarchs down to modern times, who prefer to have around their persons warriors uninfluenced by family connection with the people of the land. Rameses II had such a body-guard whose commanders ranked with the great officers of the crown (Maspero, Struggle of the Nations, 766). David\'s body-guard of 600, known also as the gibborim or "mighty men," consisted of Cherethites, Pelethites, and Gittites (<a onClick="return mV(\'2Sa\',15,18);">2Sa 15:18</a>; <a onClick="return mV(\'2Sa\',20,23);">20:23</a>), and we read of Carites (<a onClick="return mV(\'2Ki\',11,19);">2Ki 11:19</a>), who may have been Carians or Cretans, as forming part of the guard at the coronation of King Jehoash.<P>3. Connection with the Temple:<P>That this guard had duties in connection with the temple as well as the king\'s house seems clear. That they were employed as slaughterers of the sacrifices before the Levites were entrusted with the office is unlikely, inasmuch as this guard is not said to have been composed of "slaughterers" but of "runners." But they accompanied King Rehoboam when he visited the temple (<a onClick="return mV(\'1Ki\',14,28);">1Ki 14:28</a>), and to their captains were committed the shields of brass which took the place of the shields of gold which Solomon had hung up in the temple; Jehoiada employed their captains to put Athaliah to death and to exterminate the worshippers of Baal who had fled to the temple precincts (<a onClick="return mV(\'2Ki\',11,4);">2Ki 11:4</a>); the temple gate leading to the palace was called "the gate of the guard" (<a onClick="return mV(\'2Ki\',11,19);">2Ki 11:19</a>). At this time, and for this occasion, at least, the royal body-guard were the temple guards; and when Ezekiel drew up his plans for the temple which he conceived to replace the temple destroyed by Nebuchadrezzar, the "lodges" or "little chambers" were rooms for the accommodation of the temple guard (<a onClick="return mV(\'Eze\',40,7,10.21,33);">Eze 40:7, 10, 21, 33</a>, etc.).<P>LITERATURE.<P>Robertson Smith, OTJC, 262, and note.``128';
isbe[3955]='Guardian`gar\'-di-an.`<a href="./study/isbe/search.html?string=FAMILY">FAMILY</a>; <a href="./study/isbe/search.html?string=ANGEL">ANGEL</a>`1';
isbe[3956]='Gudgodah`gud-go\'-da (gudhgodhah): A place in the wilderness journeyings (<a onClick="return mV(\'Deu\',10,7);">De 10:7</a>), corresponding to Hor-haggidgad in <a onClick="return mV(\'Num\',33,32);">Nu 33:32</a>. Septuagint in each case renders (Gadgad). The site cannot now be identified; but there may be an echo of the ancient name in that of Wady Gudaghid, a confluent of Wady Jerafeh, which comes down from et Tih into the \'Arabah nearly due west of Petra. There are difficulties, however, as the consonants do not correspond.``1';
isbe[3957]='Guest`gest (qara\'; anakeimai): Oriental customs growing out of a nomadic life demand a greater abandon and freedom with respect to the relation of host and guest than are permitted by the conventionalities of western life. A householder is expected to entertain a traveler, and in turn the traveler may accept with perfect ease the hospitality shown without any obligation to pay. See <a href="study/isbe/search.html?string=HOSPITALITY">HOSPITALITY</a>. The significance of the word is that of one who is called or invited. A certain sacredness, unknown to modern western society, was attached to the guest, so that a special apartment was set aside for the guests. See <a href="study/isbe/search.html?string=GUEST-CHAMBER">GUEST-CHAMBER</a>. In the Old Testament only 3 times is the word itself used, with reference to the guests of Adonijah (<a onClick="return mV(\'1Ki\',1,41,49);">1Ki 1:41, 49</a>), of the foolish woman (<a onClick="return mV(\'Pro\',9,18);">Pr 9:18</a>), and of Yahweh (<a onClick="return mV(\'Zep\',1,7);">Ze 1:7</a>). In the New Testament, 3 times (<a onClick="return mV(\'Mat\',22,10);">Mt 22:10</a>f; <a onClick="return mV(\'Luk\',19,7);">Lu 19:7</a> the King James Version, the Revised Version (British and American) "to lodge"). Though but few actual uses of the word occur, there are abounding illustrations of the guest relation in both Old Testament and New Testament. Especially is this manifest in the striking social attitudes of Jesus on occasions. Notable among these are the hospitality of Matthew (<a onClick="return mV(\'Luk\',5,29);">Lu 5:29</a>); Jesus\' relation to Martha and Mary (<a onClick="return mV(\'Luk\',10,38);">Lu 10:38</a>), and His entrance into the home of Zaccheus (<a onClick="return mV(\'Luk\',19,1);">Lu 19:1</a>). Likewise Jesus spoke frequently of the relation which should exist between the guest and his host (see <a onClick="return mV(\'Luk\',7,\'44-46\');">Lu 7:44-46</a>; <a onClick="return mV(\'Mat\',25,35);">Mt 25:35</a>; <a onClick="return mV(\'Mat\',10,40);">10:40</a>).``25';
isbe[3958]='Guest-Chamber`gest\'-cham-ber: The translation of<P>(1) (lishkah) (<a onClick="return mV(\'1Sa\',9,22);">1Sa 9:22</a>, the King James Version "parlor"), and<P>(2) (kataluma) (<a onClick="return mV(\'Mar\',14,14);">Mr 14:14</a> parallel <a onClick="return mV(\'Luk\',22,11);">Lu 22:11</a>).<P>The lishkah was probably a room in which the sacrificial feasts were held. Kataluma is derived from kataluo, which means "to slacken," i.e. the ropes of the beasts of burden, and hence, "to lodge." Kataluma has accordingly often the sense of "inn," but as used in Mark and Luke it has the narrower meaning of a room in which to eat.``1';
isbe[3959]='Guide`gid (\'alluph, nachal, nachah; hodegos, hodegeo): "Guide" (noun) is the translation of \'alluph, "an intimate," "a friend," the leader of a family or tribe: <a onClick="return mV(\'Psa\',55,13);">Ps 55:13</a>, "a man mine equal, my guide," the Revised Version (British and American) "my companion"; <a onClick="return mV(\'Pro\',2,17);">Pr 2:17</a>, "the guide of her youth," the Revised Version (British and American) "friend," margin "or guide"; <a onClick="return mV(\'Jer\',3,4);">Jer 3:4</a>, "My father, thou (art) the guide of my youth," the Revised Version, margin "companion"; <a onClick="return mV(\'Mic\',7,5);">Mic 7:5</a>, "Put ye not confidence in a guide," the American Standard Revised Version "in a friend," margin "confidant" (which the context shows to be the meaning), the English Revised Version "guide," margin "familiar friend"; once of katsin, "a judge," "a military leader or commander" (compare <a onClick="return mV(\'Jos\',10,24);">Jos 10:24</a>; <a onClick="return mV(\'Dan\',11,18);">Da 11:18</a>); <a onClick="return mV(\'Pro\',6,7);">Pr 6:7</a>, the Revised Version (British and American) "chief," margin "judge"; once nahagh, "to lead," is translated "guide" (<a onClick="return mV(\'Psa\',48,14);">Ps 48:14</a>). In the New Testament hodegos, "a way-leader," is translated "guide" (<a onClick="return mV(\'Mat\',23,16);">Mt 23:16</a>, "ye blind guides"; <a onClick="return mV(\'Mat\',23,24);">Mt 23:24</a>; <a onClick="return mV(\'Act\',1,16);">Ac 1:16</a>; <a onClick="return mV(\'Rom\',2,19);">Ro 2:19</a>); "to guide" is the translation of nachah, "to lead forth" (<a onClick="return mV(\'Job\',38,32);">Job 38:32</a>; <a onClick="return mV(\'Psa\',73,24);">Ps 73:24</a>); once of \'ashar, Piel, "to guide" or "lead straight (<a onClick="return mV(\'Pro\',23,19);">Pr 23:19</a>); of ya\'ats, "to command," "to give counsel" ("I will guide thee with mine eye," the Revised Version (British and American) "I will counsel thee with mine eye upon thee," <a onClick="return mV(\'Psa\',32,8);">Ps 32:8</a>); of kul, "to contain," "to sustain" (<a onClick="return mV(\'Psa\',112,5);">Ps 112:5</a>, "He will guide his affairs with discretion," the Revised Version (British and American) "He shall maintain his cause in judgment"); of nahagh, "to drive," "to lead" (<a onClick="return mV(\'Psa\',78,52);">Ps 78:52</a>); of hodegeo, "to show the way," "guide" (<a onClick="return mV(\'Jhn\',16,13);">Joh 16:13</a>, "He shall guide you into all truth," the Revised Version (British and American) "the truth"; <a onClick="return mV(\'Act\',8,31);">Ac 8:31</a>); oikodespoteo is translated "to guide the house" the Revised Version (British and American) "rule the household" (<a onClick="return mV(\'1Ti\',5,14);">1Ti 5:14</a>); the word means literally, to be a house-master (the head of the house).<P>The Revised Version (British and American) has "guide" for "lead" (<a onClick="return mV(\'Psa\',25,5);">Ps 25:5</a>; <a onClick="return mV(\'Mat\',15,14);">Mt 15:14</a>; <a onClick="return mV(\'Luk\',6,39);">Lu 6:39</a>; <a onClick="return mV(\'Rev\',7,17);">Re 7:17</a>); "a guide to" for "more excellent than" (<a onClick="return mV(\'Pro\',12,26);">Pr 12:26</a>); "guided" for "brought in" (<a onClick="return mV(\'Psa\',78,26);">Ps 78:26</a>); "guideth" for "maketh" (<a onClick="return mV(\'2Sa\',22,33);">2Sa 22:33</a>), for "leadeth" (<a onClick="return mV(\'Psa\',23,3);">Ps 23:3</a>); "my heart yet guiding me," margin "holding its course," for "yet acquainting mine heart" (<a onClick="return mV(\'Ecc\',2,3);">Ec 2:3</a>).<P>"Guide-posts" is substituted for "high heaps" (<a onClick="return mV(\'Jer\',31,21);">Jer 31:21</a>).``185';
isbe[3960]='Guile`gil (mirmah; dolos): "Guile" is twice the translation of mirmah, "fraud," "deceit" (<a onClick="return mV(\'Psa\',34,13);">Ps 34:13</a>, "Keep...thy lips from speaking guile"; <a onClick="return mV(\'Psa\',55,11);">Ps 55:11</a>, "deceit and guile," the Revised Version (British and American) "oppression (margin "fraud") and guile"); once of \'ormah, "craftiness," "guile" (<a onClick="return mV(\'Exd\',21,14);">Ex 21:14</a>); once of remiyah, "deception," "fraud" (<a onClick="return mV(\'Psa\',32,2);">Ps 32:2</a>, "in whose spirit there is no guile"); in the New Testament of dolos, "bait," hence, generally, "fraud," "guile," "deceit"; Septuagint for mirmah (<a onClick="return mV(\'Isa\',53,9);">Isa 53:9</a>, English Versions of the Bible "deceit") and for remiyah (<a onClick="return mV(\'Job\',13,7);">Job 13:7</a>, English Versions of the Bible "deceitfully"; <a onClick="return mV(\'Jhn\',1,47);">Joh 1:47</a>; <a onClick="return mV(\'2Cr\',12,16);">2Co 12:16</a>, "Being crafty, I caught you with guile"; <a onClick="return mV(\'1Th\',2,3);">1Th 2:3</a>; <a onClick="return mV(\'1Pe\',2,1);">1Pe 2:1</a>; <a onClick="return mV(\'1Pe\',2,22);">2:22</a>; <a onClick="return mV(\'1Pe\',3,10);">3:10</a>, quoted from <a onClick="return mV(\'Psa\',34,13);">Ps 34:13</a>; <a onClick="return mV(\'Rev\',14,5);">Re 14:5</a>, "In their mouth was found no guile," the Revised Version (British and American) after corrected text, "no lie").<P>Paul\'s words in <a onClick="return mV(\'2Cr\',12,16);">2Co 12:16</a> have sometimes been quoted in justification of "guile" in religious work, etc.; but he is not describing his actual procedure; but that which the Corinthians might have attributed to him; the lips of the Christian must be kept free from all guile (<a onClick="return mV(\'Psa\',34,13);">Ps 34:13</a>; <a onClick="return mV(\'1Pe\',2,1);">1Pe 2:1</a>, etc.; The <span class="noTag">Wisdom of Solomon 1:5</span> "A holy spirit of discipline will flee deceit" (dolos), the Revised Version (British and American) "A holy spirit"). "Guile" does not appear in Apocrypha; dolos is frequently rendered "deceit."<P>The Revised Version (British and American) has "guile" for "subtilty" (<a onClick="return mV(\'Gen\',27,35);">Ge 27:35</a>; <a onClick="return mV(\'Act\',13,10);">Ac 13:10</a>); "cover itself with guile" for "is covered by deceit" (<a onClick="return mV(\'Pro\',26,26);">Pr 26:26</a>); "with guile" for "deceitfully" (<a onClick="return mV(\'Gen\',34,13);">Ge 34:13</a>); "spiritual milk which is without guile" for "sincere milk of the word," the English Revised Version, margin "reasonable," the American Revised Version, margin, Greek "belonging to the reason" (compare <a onClick="return mV(\'Rom\',12,1);">Ro 12:1</a>; <a onClick="return mV(\'1Pe\',2,2);">1Pe 2:2</a>); "guileless" for "harmless" (<a onClick="return mV(\'Hbr\',7,26);">Heb 7:26</a>).``185';
isbe[3961]='Guilt`gilt: The Christian idea of guilt involves three elements: responsibility (Greek aitia, "cause," depending upon a man\'s real freedom), blameworthiness (Latin reatus culpae, depending upon a man\'s knowledge and purpose) and the obligation to make good through punishment or compensation (Latin reatus poenae; compare Greek opheilema, "debt," <a onClick="return mV(\'Mat\',6,12);">Mt 6:12</a>). In other words, in thinking of guilt we ask the questions of cause, motive and consequence, the central idea being that of the personal blameworthiness of the sinner.<P>I. In the Old Testament.<P>1. The Ritualistic and Legalistic Conception:<P>Not all of this is found at once in the Old Testament. The idea of guilt corresponds to that of righteousness or holiness. When these are ritual and legal, instead of ethical and spiritual, they will determine similarly the idea of guilt. This legalistic and ritualistic conception of guilt may first be noted. Personal blameworthiness does not need to be present. "If any one sin, and do any of the things which Yahweh hath commanded not to be done; though he knew it not, yet is he guilty, and shall bear his iniquity" (<a onClick="return mV(\'Lev\',5,17);">Le 5:17</a>). The man is guilty, not because he might or should have known; he may merely have touched unwittingly the body of an unclean beast (<a onClick="return mV(\'Lev\',5,2,);">Le 5:2-3</a>). The guilt is here because the law has been transgressed and must be made good (compare <a onClick="return mV(\'Lev\',5,15,16);">Le 5:15-16</a>; <a onClick="return mV(\'Lev\',4,2,3,13,22,27);">4:2-3, 13, 22, 27</a>; see also <a onClick="return mV(\'Lev\',5,2,3,4,17);">5:2, 3, 4, 17</A>).<P>Moreover, the element of personal responsibility is sometimes lacking where guilt is assigned. The priest may sin "so as to bring guilt on the people" (<a onClick="return mV(\'Lev\',4,3);">Le 4:3</a>). One man\'s wrongdoing may "cause the land to sin" (<a onClick="return mV(\'Deu\',24,4);">De 24:4</a>). Israel has sinned in Achan\'s greed and therefore suffers. Even when the guilty man is found, his children and his very cattle must bear the guilt and punishment with him, though there is no suggestion of their participation or even knowledge (<a onClick="return mV(\'Jos\',7,\'1-\');">Jos 7</a>; compare <a onClick="return mV(\'2Sa\',24,\'1-\');">2Sa 24</a>). Here the full moral idea of sin and guilt is wanting because the idea of personality and personal responsibility has not come to its own. The individual is still merged here in the clan or nation.<P>The central idea in all this is not that of the individual, his responsibility, his motive, his blame. It is that of a rule and the transgression of it, which must be made good. For this reason we see the ú ideas of sin and guilt and punishment constantly passing over into each other. This may be seen by noting the use of the words whose common root is\'-sh-m, the distinctive Hebrew term for guilt. In <a onClick="return mV(\'Lev\',5,\'1-\');">Le 5 to 7</a> in the adjective form it is rendered "guilty," in the noun as "trespass offering." In <a onClick="return mV(\'Hsa\',5,15);">Ho 5:15</a> it seems to mean punishment (see margin, "have borne their guilt," and compare <a onClick="return mV(\'Eze\',6,6);">Eze 6:6</a>), while in <a onClick="return mV(\'Num\',5,7,8);">Nu 5:7-8</a> the idea is that of compensation (rendered "restitution for guilt").<P>2. Prophetic Teaching:<P>With the prophets, the ideas of sin and righteousness come out more clearly as ethical and personal, and so we mark a similar advance in the conception of guilt. It is not ritual correctness that counts with God, incense and sacrifices and new moons and Sabbaths, but to cease to do evil, to learn to do well (<a onClick="return mV(\'Isa\',1,\'1-\');">Isa 1</a>). Thus the motive and the inner spirit come in (<a onClick="return mV(\'Mic\',6,8);">Mic 6:8</a>; <a onClick="return mV(\'Isa\',57,15);">Isa 57:15</a>; <a onClick="return mV(\'Isa\',58,\'1-12\');">58:1-12</a>), and guilt gains a new depth and quality. At the same time the idea of personal responsibility comes. A man is to bear his own sins. The children\'s teeth are not to be set on edge because the fathers have eaten sour grapes (<a onClick="return mV(\'Jer\',31,29,30);">Jer 31:29-30</a>; <a onClick="return mV(\'Eze\',18,\'29-32\');">Eze 18:29-32</a>; <a onClick="return mV(\'2Ki\',14,6);">2Ki 14:6</a>; compare <a onClick="return mV(\'2Sa\',24,17);">2Sa 24:17</a>).<P>II. In the New Testament.<P>1. With Jesus:<P>Here as elsewhere Jesus came to fulfill. With Him it is the inner attitude of the soul that decides. It is the penitent publican who goes down justified, not the Pharisee with his long credit account (<a onClick="return mV(\'Luk\',18,\'9-14\');">Lu 18:9-14</a>). That is why His attitude is so kindly toward some notorious sinners and so stern toward some religious leaders. The Pharisees are outwardly correct, but their spirit of bigotry and pride prevents their entering the kingdom of heaven, while the penitent harlots and publicans take it by storm.<P>Because it is not primarily a matter of the outward deed but of the inner spirit, Jesus marks different degrees of guilt as depending upon a man\'s knowledge and motive (<a onClick="return mV(\'Luk\',11,\'29-32\');">Lu 11:29-32</a>; <a onClick="return mV(\'Luk\',12,47,48);">12:47-48</a>; <a onClick="return mV(\'Luk\',23,34);">23:34</a>). And yet Jesus does not lighten the sense of guilt but rather deepens it. The strength of the Old Testament thought lay in this, that it viewed all transgression as a sin against God, since all law came from Him. This religious emphasis remains with Jesus (<a onClick="return mV(\'Luk\',15,21);">Lu 15:21</a>; compare <a onClick="return mV(\'Psa\',51,4);">Ps 51:4</a>). But with Jesus God is far more than a giver of rules. He gives Himself. And so the guilt is the deeper because the sin is against this love and mercy and fellowship which God offers us. Jesus shows us the final depth of evil in sin. Here comes the New Testament interpretation of the cross, which shows it on the one hand as the measure of God\'s love in the free gift of His Son, and on the other as the measure of man\'s guilt whose sin wrought this and made it necessary.<P>2. With Paul:<P>Paul also recognizes differences of degree in guilt, the quality of blameworthiness which is not simply determined by looking at the outward transgression (<a onClick="return mV(\'Act\',17,30);">Ac 17:30</a>; <a onClick="return mV(\'Eph\',4,18);">Eph 4:18</a>; <a onClick="return mV(\'Rom\',2,9);">Ro 2:9</a>; <a onClick="return mV(\'Rom\',3,26);">3:26</a>; <a onClick="return mV(\'Rom\',5,13);">5:13</a>; <a onClick="return mV(\'Rom\',7,13);">7:13</a>). He, too, looks within to decide the question of guilt (<a onClick="return mV(\'Rom\',14,23);">Ro 14:23</a>). But sin is not a matter of single acts or choices with Paul. He sees it as a power that comes to rule a man\'s life and that rules in the race. The question therefore arises, Does Paul think of guilt also as native, as belonging to man because man is a part of the race? Here it can merely be pointed out that <a onClick="return mV(\'Rom\',5,\'12-21\');">Ro 5:12-21</a> does not necessarily involve this. Paul is not discussing whether all men committed sin in Adam\'s fall, or whether all are guilty by virtue of their very place in a race that is sinful. It is not the question of guilt in fact or degree, but merely the fact that through one man men are now made righteous as before through one sin came upon them all. This no more involves native guilt as a non-ethical conception than it does the idea that the righteousness through Christ is merely forensic and non-ethical. Paul is simply passing over the other elements to assert one fact. <a onClick="return mV(\'Rom\',1,\'1-\');">Ro 1</a> suggests how Paul looked at universal sin as involving guilt because universal knowledge and choice entered in.<P>LITERATURE.<P>Mueller, Christian Doctrine of Sin, I, 193-267; Schultz, Old Testament Theology; Kaehler, article "Schuld," Hauck-Herzog, Realencyklopadie fur protestantische Theologie und Kirche.`<a href="./study/isbe/search.html?string=SIN+(1)">SIN</a>`143';
