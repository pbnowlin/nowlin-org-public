isbe[3930]='Grease`gres (chelebh, "fat," "suet"): The word occurs once in the metaphorical sense "prosperous," then dull, gross, brutal: "Their heart is as fat as grease" (<a onClick="return mV(\'Psa\',119,70);">Ps 119:70</a>; compare <a onClick="return mV(\'Isa\',6,10);">Isa 6:10</a>, and see <a href="study/isbe/search.html?string=FAT">FAT</a>).``1';
isbe[3931]='Great; Greatness`grat, grat\'-nes: "Great" occurs very often in Scripture. The chief words so translated are gadhol, rabh; megas, polus.<P>(1) In the Old Testament many other terms are employed:<P>(a) gadhol is used to express greatness in various senses, chiefly of magnitude, including excellence, e.g. "great lights" (<a onClick="return mV(\'Gen\',1,16);">Ge 1:16</a>); "the great city" (<a onClick="return mV(\'Gen\',10,12);">Ge 10:12</a>); "a great nation" (<a onClick="return mV(\'Gen\',12,2);">Ge 12:2</a>); "a great sight" (<a onClick="return mV(\'Exd\',3,3);">Ex 3:3</a>); "Moses was very great" (<a onClick="return mV(\'Exd\',11,3);">Ex 11:3</a>); "the great God" (<a onClick="return mV(\'Deu\',10,17);">De 10:17</a>; <a onClick="return mV(\'Neh\',1,5);">Ne 1:5</a>); "great is Yahweh" (<a onClick="return mV(\'Psa\',48,1);">Ps 48:1</a>). It is sometimes translated by "mighty" (<a onClick="return mV(\'Deu\',4,37);">De 4:37</a>; <a onClick="return mV(\'Deu\',7,21);">7:21</a>, "a mighty God," the Revised Version (British and American) "great"). It is also used to designate the high priest (literally, "great," <a onClick="return mV(\'Lev\',21,10);">Le 21:10</a>; <a onClick="return mV(\'Zec\',3,1);">Zec 3:1</a>, etc.); also to express the "elder" of a family, e.g. <a onClick="return mV(\'Gen\',27,1);">Ge 27:1</a>, "Esau his eldest son," the Revised Version (British and American) "elder"; probably also of great stature: "a great man among the Anakims," the Revised Version (British and American) "the greatest" (<a onClick="return mV(\'Jos\',14,15);">Jos 14:15</a>).<P>(b) rabh denotes, rather, quantity, number, therefore, often, "many" (<a onClick="return mV(\'Gen\',21,34);">Ge 21:34</a>, etc.; <a onClick="return mV(\'Exd\',2,23);">Ex 2:23</a> the Revised Version (British and American), etc.); "abundant" (<a onClick="return mV(\'Exd\',34,6);">Ex 34:6</a>, the English Revised Version "plenteous"), and similar terms; thus we have "a great people" (<a onClick="return mV(\'Jos\',17,14);">Jos 17:14</a>); "His mercies are great," the Revised Version, margin "many" (<a onClick="return mV(\'2Sa\',24,14);">2Sa 24:14</a>; <a onClick="return mV(\'1Ch\',21,13);">1Ch 21:13</a>); "Great was the company," the Revised Version (British and American) "a great host" (<a onClick="return mV(\'Psa\',68,11);">Ps 68:11</a>); "great reward" (<a onClick="return mV(\'Psa\',19,11);">Ps 19:11</a>); "Mine iniquity...is great" (<a onClick="return mV(\'Psa\',25,11);">Ps 25:11</a>); "exceedingly" (<a onClick="return mV(\'Psa\',123,3);">Ps 123:3</a>). In the Septuagint rabh is, for the most part, translated by polus. But it is used for "great" in other senses, e.g. "the great (God)" (<a onClick="return mV(\'Pro\',26,10);">Pr 26:10</a>), the Revised Version (British and American) "as an archer," margin "master worker; Hebrew text obscure"; "a saviour, and a great one," the Revised Version (British and American) "defender," margin "or a mighty one" (<a onClick="return mV(\'Isa\',19,20);">Isa 19:20</a>); "Great shall be the peace" (<a onClick="return mV(\'Isa\',54,13);">Isa 54:13</a>), etc. It is sometimes translated "mighty" (<a onClick="return mV(\'Psa\',89,50);">Ps 89:50</a>, the Revised Version, margin "many"; <a onClick="return mV(\'Isa\',63,1);">Isa 63:1</a>).<P>(c) Other words thus translated are kabhedh, "heavy," e.g. "so great a people," the Revised Version (British and American) "thy great people," margin "heavy" (<a onClick="return mV(\'1Ki\',3,9);">1Ki 3:9</a>); me\'odh, implying force, might, e.g. "with all his might" (<a onClick="return mV(\'2Ki\',23,25);">2Ki 23:25</a>). \'El and \'Elohim are sometimes used to express greatness. In <a onClick="return mV(\'Psa\',36,6);">Ps 36:6</a>, we have "Thy righteousness is like the great (\'El) mountains," the Revised Version (British and American) "mountains of God"; in <a onClick="return mV(\'Gen\',30,8);">Ge 30:8</a>, "with great (\'Elohim) wrestlings," the Revised Version (British and American) "mighty," margin "wrestlings of God"; and in <a onClick="return mV(\'1Sa\',14,15);">1Sa 14:15</a> "a very great (\'Elohim) trembling," the Revised Version (British and American) "exceeding great," margin "a trembling of God."<P>(2) New Testament<p>(a) Megas denotes magnitude, in its various aspects, physical, moral, etc., e.g. "great joy" (<a onClick="return mV(\'Mat\',2,10);">Mt 2:10</a>); "a great light" (<a onClick="return mV(\'Mat\',4,16);">Mt 4:16</a>); "the great King" (<a onClick="return mV(\'Mat\',5,35);">Mt 5:35</a>); "great in the kingdom" (<a onClick="return mV(\'Mat\',5,19);">Mt 5:19</a>, etc.); "Great is thy faith" (<a onClick="return mV(\'Mat\',15,28);">Mt 15:28</a>); "The greatest is charity" (love), the Revised Version, margin "greater" (<a onClick="return mV(\'1Cr\',13,13);">1Co 13:13</a>); "a great high priest" (<a onClick="return mV(\'Hbr\',4,14);">Heb 4:14</a>); "the great shepherd" (<a onClick="return mV(\'Hbr\',13,20);">Heb 13:20</a>); "a great voice" (<a onClick="return mV(\'Rev\',1,10);">Re 1:10</a>); in Revelation megas is very frequent.<P>(b) Polus denotes properly number, multitude, e.g. "great multitudes" (<a onClick="return mV(\'Mat\',4,25);">Mt 4:25</a>); "a great company" (<a onClick="return mV(\'Luk\',5,29);">Lu 5:29</a>, the Revised Version (British and American) "a great multitude"; frequent in the Gospels); "great possessions" (<a onClick="return mV(\'Mar\',10,22);">Mr 10:22</a>). But also "great" in the sense of magnitude, e.g. "great plainness of speech," the Revised Version (British and American) "boldness" (<a onClick="return mV(\'2Cr\',3,12);">2Co 3:12</a>; <a onClick="return mV(\'2Cr\',7,4);">7:4</a>); "a great trial of affliction," the Revised Version (British and American) "much proof" (<a onClick="return mV(\'2Cr\',8,2);">2Co 8:2</a>); "great love" (<a onClick="return mV(\'Eph\',2,4);">Eph 2:4</a>).<P>(c) Among other terms we have telikoutos, "so great" (in degree), "so great a salvation" (<a onClick="return mV(\'Hbr\',2,3);">Heb 2:3</a>); tosoutos, "so great" (in quantity), "so great faith" (<a onClick="return mV(\'Mat\',8,10);">Mt 8:10</a>; <a onClick="return mV(\'Luk\',7,9);">Lu 7:9</a>); "so great a cloud of witnesses" (<a onClick="return mV(\'Hbr\',12,1);">Heb 12:1</a>); hosos, "how great" (in quantity) (<a onClick="return mV(\'Mar\',3,8);">Mr 3:8</a>; <a onClick="return mV(\'Mar\',5,19);">5:19</a>f); helikos, "how great" (in degree) (<a onClick="return mV(\'Col\',2,1);">Col 2:1</a>; <a onClick="return mV(\'Jam\',3,5);">Jas 3:5</a>, "how great a matter," the Revised Version (British and American) "how much wood," margin "how great a forest"); pelikos, "how great" (in degree) (<a onClick="return mV(\'Hbr\',7,4);">Heb 7:4</a>); posos, "how great" (in quantity) (<a onClick="return mV(\'Mat\',6,23);">Mt 6:23</a>), etc.<P>(3) In His person and teaching, Jesus introduced into the world a new conception of greatness. It was to be found in humility and self-forgetting service: "Whosoever would become great among you shall be your minister (the Revised Version, margin "servant"); and whosoever would be first among you shall be your servant (the Revised Version, margin "(Greek) bond-servant"): even as the Son of man came not to be ministered unto, but to minister, and to give his life a ransom for many" (<a onClick="return mV(\'Mat\',20,\'26-28\');">Mt 20:26-28</a>; compare also <a onClick="return mV(\'Mat\',18,\'1-4\');">Mt 18:1-4</a>; <a onClick="return mV(\'Mat\',23,11);">23:11</a>; <a onClick="return mV(\'Phl\',2,\'5-11\');">Php 2:5-11</a>).``185';
isbe[3932]='Greaves`grevz.`<a href="./study/isbe/search.html?string=ARMOR;+arms">ARMOR, ARMS</a>`1';
isbe[3933]='Grecians; Greeks`gre\'-shanz, greks: In the Old Testament the word "Grecians" occurs but once (<a onClick="return mV(\'Joe\',3,6);">Joe 3 (4):6</a>). For references to Greece in the Old Testament see <a href="study/isbe/search.html?string=JAVAN">JAVAN</A>. In the King James Version of the Old Testament Apocrypha "Grecians" and "Greeks" are used without distinction, e.g. 1Macc 1:10; 6:2; 8:9; 2Macc 4:15,36. Thus, in 1Macc 1:1, Alexander the Great is spoken of as king of Greece, and in 1Macc 1:10 the Macedonian empire is called "the kingdom of the Greeks" (basileia Hellenon). In 2Macc 13:2 the army of Antiochus, king of Syria, is called "Grecian" (dunamis Hellenike), and in 2Macc 6:8 the "Greek cities" (poleis Hellenides) are Macedonian colonies. Reference is made in 2Macc 6:1 to an aged Athenian who was sent by Antiochus the king charged with the duty of Hellenizing the Jews; in 2Macc 9:15 Antiochus vows that he will make the Jews equal to the Athenians; in 1Macc 12-14, reference is made to negotiations of Jonathan, the high priest, with the Spartans, whom he calls brethren, seeking the renewal of a treaty of alliance and amity against the Syrians. With the spread of Greek power and influence, everything not specifically Jewish was called Greek; thus in 2Macc 4:36; 11:2; 3Macc 3:3,1 the "Greeks" contrasted with the Jews are simply non-Jews, so called because of the prevalence of Greek institutions and culture, and "Greek" even came to be used in the sense of "anti-Jewish" (2Macc 4:10,15; 6:9; 11:24).<P>In <a onClick="return mV(\'Isa\',9,12);">Isa 9:12</a> the Septuagint reads tous Hellenas, for Pelishtim, "Philistines"; but we are not therefore justified in assuming a racial connection between the Philistines and the Greeks. Further light on the ethnography of the Mediterranean<P>basin may in time show that there was actually such a connection; but the rendering in question proves nothing, since "the oppressing sword" of <a onClick="return mV(\'Jer\',46,16);">Jer 46:16</a> and <a onClick="return mV(\'Jer\',50,16);">50:16</a> is likewise rendered in the Septuagint with "the sword of the Greeks" (machaira Hellenike). In all these cases the translators were influenced by the conditions existing in their own day, and were certainly not disclosing obscure relations long forgotten and newly discovered.<P>In the New Testament, English Versions of the Bible attempts to distinguish between (Hellenes), which is rendered "Greeks," and (Hellenistai), which is rendered "Grecians" or "Grecian Jews," or in the Revised Version, margin "Hellenists," e.g. <a onClick="return mV(\'Act\',6,1);">Ac 6:1</a>; <a onClick="return mV(\'Act\',9,29);">9:29</a>. These latter were Jews of the Dispersion, who spoke Greek (see <a href="study/isbe/search.html?string=HELLENISM">HELLENISM</a>; <a href="study/isbe/search.html?string=HELLENIST">HELLENIST</A>), as distinguished from Palestinian Jews; but since many of the latter also spoke Greek by preference, the distinction could in no sense be absolute. Indeed in <a onClick="return mV(\'Jhn\',7,35);">Joh 7:35</a>, "the Dispersion among (the Revised Version, margin, Greek "of") the Greeks," can hardly refer to any but "Grecian Jews" (Hellenistai), although Hellenes is used, and in <a onClick="return mV(\'Jhn\',12,20);">Joh 12:20</a> the "Greeks" (Hellenes) who went up to worship at the feast of the Passover were almost certainly "Grecian Jews" (Hellenistai). Thus, while English Versions of the Bible consistently renders Hellenes with "Greeks," we are not by that rendering apprised of the real character of the people so designated. This difficulty is aggravated by the fact, already noted in connection with the Old Testament Apocrypha, that, in consequence of the spread of Hellenism, the term Hellenes was applied not only to such as were of Hellenic descent, but also to all those who had appropriated the language of Greece, as the universal means of communication, and the ideals and customs collectively known as Hellenism. The latter were thus in the strict sense Hellenists, differing from the "Grecians" of English Versions of the Bible only in that they were not of Jewish descent. In other words, Hellenes (except perhaps in <a onClick="return mV(\'Jhn\',7,35);">Joh 7:35</a> and <a onClick="return mV(\'Jhn\',12,20);">12:20</A>, as noted above) is, in general, equivalent to ta ethne, "Gentiles" (see <a href="study/isbe/search.html?string=GENTILES">GENTILES</A>). The various readings of the manuscripts (and hence the difference between the King James Version and the Revised Version (British and American)) in <a onClick="return mV(\'1Cr\',1,23);">1Co 1:23</a> well illustrate this. There is consequently much confusion, which it is quite impossible, with our limited knowledge of the facts in particular cases, to clear up. In general, it would seem probable that where "Greeks" are comprehensively contrasted with "Jews," the reference is to "Gentiles," as in <a onClick="return mV(\'Act\',14,1);">Ac 14:1</a>; <a onClick="return mV(\'Act\',17,4);">17:4</a>; <a onClick="return mV(\'Act\',18,4);">18:4</a>; <a onClick="return mV(\'Act\',19,10,17);">19:10, 17</a>; <a onClick="return mV(\'Act\',20,21);">20:21</a>; <a onClick="return mV(\'Rom\',1,16);">Ro 1:16</a>; <a onClick="return mV(\'Rom\',10,12);">10:12</a>; <a onClick="return mV(\'1Cr\',1,\'22-24\');">1Co 1:22-24</a> (the Revised Version (British and American) "Gentiles," representing ethnesin; <a onClick="return mV(\'Gal\',3,28);">Ga 3:28</a>; <a onClick="return mV(\'Col\',3,11);">Col 3:11</a>. In <a onClick="return mV(\'Mar\',7,26);">Mr 7:26</a> the woman of Tyre, called "a Greek (the Revised Version, margin "Gentile") a Syrophoenician," was clearly not of Hellenic descent. Whether Titus (<a onClick="return mV(\'Gal\',2,3);">Ga 2:3</a>) and the father of Timothy; (<a onClick="return mV(\'Act\',16,1,3);">Ac 16:1, 3</a>) were in the strict sense "Greeks," we have no means of knowing. In <a onClick="return mV(\'Rom\',1,14);">Ro 1:14</a>, "I am debtor both to Greeks and to Barbarians," there is an undoubted reference to Greeks strictly so called; possibly, though by no means certainly, the "Greeks" of <a onClick="return mV(\'Act\',21,28);">Ac 21:28</a>, alluding to Trophimus the Ephesian (<a onClick="return mV(\'Act\',21,29);">Ac 21:29</a>), are to be taken in the same sense. References to the Greek language occur in <a onClick="return mV(\'Jhn\',19,20);">Joh 19:20</a> (<a onClick="return mV(\'Luk\',23,38);">Lu 23:38</a> is properly omitted in the Revised Version (British and American)); <a onClick="return mV(\'Act\',21,37);">Ac 21:37</a>; <a onClick="return mV(\'Rev\',9,11);">Re 9:11</a>.<P>In <a onClick="return mV(\'Act\',11,20);">Ac 11:20</a> the manuscripts vary between Hellenistas, and Hellenas (the King James Version "Grecians," the Revised Version (British and American) "Greeks"), with the preponderance of authority in favor of the former; but even if one adopts the latter, it is not clear whether true Greeks or Gentiles are intended.``75';
isbe[3934]='Greece, Religion in Ancient` <p><b>I. THE GREEK GODS</b><P class="in15">1. Greek Myths<P class="in15">2. Mythology Distinguished from Religion<P class="in15">3. Local Shrines<P class="in15">4. Epithets of the Gods<P class="in15">5. Nature of the Gods of Worship<P class="in15">6. Relation of Greek Gods to Nature<P class="in15">7. The Greater Gods of Greece<P class="in15">8. Nature Gods<P class="in15">9. Gods of Human Activities and Emotions<P><b>II. REVELATION: INSPIRATION</b><P class="in15">1. Omens<P class="in15">2. Divination by Sacrifice<P class="in15">3. Dreams<P class="in15">4. Oracles<P><b>III. FORMS OF WORSHIP</b><P class="in15">1. Shrines<P class="in15">2. Temples<P class="in15">3. Priests<P class="in15">4. Seasons of Worship: Festivals<P class="in15">5. Elements of Worship<P class="in15">6. Prayer<P class="in15">7. Burnt Offering, or Sacrificial Meal<P class="in15">8. Meaning of Sacrifice<P class="in15">9. Propitiatory Sacrifice<P class="in15">10. Purification<P class="in15">11. The Great Religious Festivals<P class="in15">12. Mysteries at Eleusis<P class="in15">13. Absence of Magic and Mystery<P><b>IV. THE FUTURE LIFE</b><P class="in15">1. Funeral Rites<P class="in15">2. Future Life in the Homeric Poems<P class="in15">3. Later Beliefs in Immortality<P><b>V. SIN, EXPIATION, AND THE RELIGIOUS LIFE</b><P class="in15">1. Greek Idea of Sin<P class="in15">2. Religious Ideals<P><b>VI. THE INFLUENCE OF GREEK RELIGION ON CHRISTIANITY</b><P class="in15">1. Greek Philosophy and Christian Theology<P class="in15">2. Greek Influence on Christian Liturgy<P class="in15">3. Greek Influence on the Sacraments<P><b>LITERATURE</b><hr /><P>I. The Greek Gods.<P>1. Greek Myths:<P>The gods of ancient Greece are well known to our western civilization through the myths which have found so large a place in our literature. In Greece itself, fancy had free play in dealing with these divine beings, and the myths were the main treasure-house from which the poet drew; the same myths and the same gods, under different names, reappear in Rome; and Rome passed them on, a splendid heritage of imagination, to the literatures of later Europe. It is characteristic of myths that they deal with persons, not so different from men in their nature, but with more than human powers. Gods, nymphs and satyrs, noble "heroes" or evil spirits have superhuman powers in varying degree, but they remain persons with a human interest because of their human type. And, further, as men are organized in families, cities and states, so there is a tendency to organize the beings of myth into social groups, and even to bring men, heroes and gods together into one large social organism, the universe of persons.<P>These Greek myths, the story of Athena\'s birth full-armed from the brain of Zeus, of Circe\'s magic potion, of Poseidon\'s chariot on the waves, and of Apollo\'s shafts are familiar to us from childhood. To regard them as expressing the content of Greek religion is as natural as it is false. Very few myths have any religious meaning at all, in spite of the large part the gods play in them. A little comparison with the facts of worship serves to show that here the gods are quite different from the gods of story.<P>2. Mythology Distinguished from Religion:<P>Some of the gods hardly appear in myths, and some of the beings of myth are not worshipped; in worship, each god is for the time being the only god thought of, not a member of the hierarchy established in myth; moreover in myth the gods are treated as universal, while the gods of worship are most closely attached, each to one shrine. Along with these external differences goes the one essential difference between a being of story and an object of worship. The failure to recognize the deep meaning of Greek religion results from the superficial assumption that myths constitute a peculiar kind of theology, when in reality they teach but little, and that, indirectly, about religion proper.<P>3. Local Shrines:<P>The essential fact about the gods of Greek religion is that each god was worshipped in a unique form at one or another particular shrine by a group of worshippers more or less definite. The group might include the state, the dwellers in one locality or simply the family; whatever its limits, it included those connected with the god by a social-religious tie, and the fundamental purpose of the worship was to strengthen this tie. In a city like Athens there were hundreds of such shrines, varying in importance, each the place where one particular phase of a god was worshipped at specified times. The particular form of the god was ordinarily indicated by an epithet attached to his name, Zeus Olympios, Dionysus Eleutherios, Athena Nike. This epithet might refer to the locality of the worship (Aphrodite of the Gardens), to the center from which the worship was brought (Artemis Brauronia), to some local spirit identified with the greater god (Poseidon Erechtheus), or to the nature of the god himself (Apollo Patroos).<P>4. Epithets of the Gods:<P>Each of the many shrines in Athens had thus its unique god, its group of worshippers connected with the god, its particular form of worship and times of worship, its own officials. While the state exercised general supervision over all the shrines, they were not organized in a hierarchy under any distinctly religious officials, but remained as independent units. Religious worship in a given city meant the aggregation of independent worships at the different local shrines.<P>5. Nature of the Gods of Worship:<P>The god of worship, then, was the god of a local shrine whose blessing and favor were sought at certain times by those who had the right to worship there. As in myth the gods were drawn after human types, that is, with human virtues and human frailties, and bodies almost human, except that they were not made to die; so in worship the gods were persons not unlike men in their nature. Worship proceeds on the assumption that gods are like human rulers, in that men honor the gods by games and processions, seek to please them by gifts, and ask them to share banquets made in their honor. Only the humanness of the gods in worship is something more subtle, more intimate than in myth. No stress is laid on human form or the vagaries of human character in the gods of worship; in form they remain spirits more or less vague, but spirits who care for men, who may be approached as a man approaches his ruler, spirits bound to man by close social ties which it is his duty and pleasure to strengthen. Zeus is father of gods and men, a father not untouched by the needs of his children; Athena cares for the city of Athens as her special pride; each family worships gods which are all but akin to the family; in the gymnasium, Apollo or Hermes is represented as the patron and ideal of the youths who exercise there; the drama is part of the service of Dionysus; in a word each form of human activity, be it work or pleasure, was a point of contact with the gods. The real forces at work in the world were first men, and secondly beings with a nature like man\'s, but with powers superior to man\'s; worship was the attempt to ally the gods more closely to man by social-religious ties, in order that as both worked together the ends of life might be successfully attained. This conception of the gods as higher members of society is the keynote of Greek religion. In some ethnic religions the gods seem to be evil beings whose desire for mischief man must overcome; in others they are beings to be avoided as much as possible; or again they are rulers who delight in man\'s abject servitude; or again by cultivating the friendship of one god, man may hope to win blessing and avoid harm from the others. In Greece all the gods of worship were essentially friendly to man, because they were akin to him and a part of the society in which he lived.<P>6. Relation of Greek Gods to Nature:<P>The relation of the gods to Nature is not so simple as might at first appear. Within certain limits the forces of Nature were subject to the will of the gods. From the Greek point of view, however, the relation is much more intimate, in that the forces in the world, at least in so far as they affect man, are personal activities, activities that express the will of divine beings. We say that Poseidon personifies the sea, Gaia the earth, Helios the sun; and the origin of religion has been sought in man\'s awe before the forces of Nature. The truer statement is that the Greek world, including the physical world, was made up of spiritual beings, not of physical forces. "The fire, as useful as it is treacherous, is the province of Hephaestus; all the dangers and changeableness of the sea are reflected in Poseidon and his followers; an Artemis is there to guide the hunter, a Demeter to make the grain sprout, a Hermes or Apollo to watch over the herds; Athena is the spirit of wisdom, Hermes of shrewdness, Ares of tumultuous war....In a word the Greek gods are in the world, not above the world, superior beings who embody in personal form all the forces that enter into human life." The contrast between such a personal point of view and the mechanical view of modern science is as marked as the contrast between it and the Hebrew conception of a universe brought into being and controlled by a God quite distinct from the physical world.<P>7. The Greater Gods of Greece:<P>Of the particular gods, little need be said. The five greater gods, Zeus, Hera, Athena, Apollo and Artemis, are not closely connected with any one phenomenon of Nature or human life, though Zeus has to do with the sky, and Apollo and Artemis acquire a connection with the sun and moon. The most important worship of Zeus was at Olympia, where the pan-Hellenic games were held in his honor. Elsewhere he was worshipped mainly in connection with the weather and the changing seasons. Apparently much of his preeminence in Greek thought was due to myth. Hera was worshipped with Zeus on mountain tops, but her special place in worship was as the goddess of marriage. Athena, the maiden goddess of war and of handicrafts, was worshipped especially in Northern Greece. War dances found a place in her worship, and she was rarely represented without aegis, spear and helmet. All the arts, agriculture, handicrafts, even the art of government, were under her care. Apollo was worshipped widely as the protector of the crops, and of the shepherd\'s flocks. In this aspect his festivals included purifications and rites to ward off dangers. He was also the god of music and of prophecy. At Delphi his prophetic powers won great renown, but the Pythian games with their contests in music, in rhythmic dancing, and in athletic sports were hardly less important. Artemis, in myth the chaste sister of Apollo, was worshipped as the queen of wild creatures and the mother of life in plants as well as in animals. She was the patron and the ideal of young women, as was Apollo of young men.<P>8. Nature Gods:<P>The gods most closely associated with Nature were not so important for religion. Gain, mother earth, received sacrifices occasionally as the abode of the dead. Rhea in Crete, Cybele in Asia Minor, also in origin forms of the earth mother, received more real worship; this had to do primarily with the birth of vegetation in the spring, and again with its destruction by drought and heat. Rivers were honored in many places as gods of fertility, and springs as nymphs that blessed the land and those who cultivated it. Poseidon was worshipped that he might bless fishing and trade by sea; inland he was sometimes recognized as the "father of waters," and a god of fertility; and where horses were raised, it was under the patronage of Poseidon. The heavenly bodies marked the seasons of worship, but were rarely themselves worshipped. In general, the phenomena of Nature seem to have been too concrete to rouse sentiments of worship in Greece.<P>9. Gods of Human Activity and Emotions:<P>A third class of gods, gods of human activities and emotions, were far more important for religion. Demeter, once no doubt a form of the original earth-goddess, was the goddess of the grain, worshipped widely and at many seasons by an agricultural people. Dionysus, god of souls, of the inner life, and of inspiration by divine power, was worshipped by all who cultivated the vine or drank wine. The Attic drama was the most important development of his worship. Hermes was quite generally honored as the god of shepherds and the god of roads. As the herald, and the god of trade and gain, he found a place in the cities. Aphrodite was perhaps first the goddess of the returning life of the spring; in Greece proper she was rather the goddess of human love, of marriage and the family, the special patron of women. Ares, the Thracian god of war, was occasionally worshipped in Greece, but more commonly the god of each state was worshipped to give success in battle to his people. Hephaestus, pictured as himself a lame blacksmith working at the art which was under his protection, was worshipped now as the fire, now as the patron of cunning work in metal. Asclepius received men\'s prayers for relief from disease.<P>II. Revelation: Inspiration.<P>For the Greeks revelation was a knowledge of the divine will in special circumstances, and inspiration was evinced by the power to foresee the divine purpose in a particular case. There is no such thing as the revelation of the divine nature, nor any question of universal truth coming to men through an inspired teacher; men knew a god through his acts, not through any seer or prophet. But some warning in danger or some clue to the right choice in perplexity might be expected from gods so close to human need as were the Greek gods. The Homeric poems depicted the gods as appearing to men to check them, to encourage them or to direct them. In Homer also men might be guided by signs; while in later times divine guidance came either from signs or from men who were so close to the gods as to foresee something of the divine purpose.<P>1. Omens:<P>The simplest class of signs were those that occurred in Nature. In the Iliad the thunderbolt marked the presence of Zeus to favor his friends or check those whose advance he chose to stop. The Athenian assembly adjourned when rain began to fall. Portents in Nature—meteors, comets, eclipses, etc.—claimed the attention of the superstitious; but there was no science of astrology, and superstition had no great hold on the Greeks. In the Homeric poems, birds frequently denoted the will of the gods, perhaps because their place was in the sky beyond any human control, perhaps because certain birds were associated with particular gods. The presence of an eagle on the right hand (toward the east) was favorable, especially when it came in answer to prayer. At times, the act of the bird is significant, as when the eagle of Zeus kills the geese eating grain in Odysseus\' hall—portent of the death of the suitors. In later Greek history there are but few references to signs from birds. The theory of these signs in Nature is very simple: all Nature but expresses the will of the gods, and when the gods wish to give men some vague hint of the future, it is necessary only to cause some event not easily explained to attract man\'s attention.<P>2. Divination by Sacrifice:<P>From the 5th century on, divination by means of sacrificial victims took the place ordinarily of signs such as have just been described. In the presence of the enemy or before some important undertaking, animals were sacrificed to the gods. If they came willingly to the altar, if the inward parts, especially the liver, were sound and well shaped and of good color, if the sacrifice burned freely and without disturbing the arrangement on the altar, success might be expected. The theory was very simple: if the gods were pleased and accepted the sacrifice, their favor was assured; but if the sacrifice deviated in any way from the normal, it would not please the gods. Thus any sacrifice might have prophetic significance, while sacrifices offered before important undertakings had special meaning. The practice arose of repeating sacrifices before a battle until a favorable one was obtained, and at length, as religion began to lose its hold, the time came when a general might disregard them completely.<P>3. Dreams:<P>An important means of learning the will of the gods was through dreams, when the ordinary channels of perception were closed and the mind was free to receive impressions from the gods. The treacherousness of dreams was fully recognized, even in the Homeric poem; students of natural science came to recognize that dreams arose from natural causes; none the less they were generally regarded as a source of knowledge about the future, and gradually a science for interpreting dreams was evolved. For Pindar and for Plato the soul was more free when the body slept, and because the soul was the divine part of man\'s nature it could exercise the power of divination in sleep. Many of the recorded dreams are signs which came to the mind in sleep, like the dreams of Joseph and of Pharaoh, signs that needed later interpretation.<P>See <a href="study/isbe/search.html?string=DIVINATION">DIVINATION</a>; <a href="study/isbe/search.html?string=DREAM;+DREAMER">DREAM</a>.<P>Prophets and seers were not as important in Greece as among many peoples. The blind Teiresias belongs to the realm of myth, though there were great families of seers, like the Iamidae at Olympia, who were specially gifted to interpret dreams, or signs from sacrifices. Ordinarily it was the "chresmologist," the man with a collection of ancient sayings to be applied to present events, whose advice was sought in time of need; or else men turned to the great oracles of Greece.<P>4. Oracles:<P>The most important oracle was that of Apollo at Delphi. Hither came envoys of nations as well as individuals, and none went away without some answer to their questions. After preliminary sacrifices, the priestess purified herself and mounted the tripod in the temple; the question was propounded to her by a temple official, and it was his function also to put her wild ravings into hexameter verse for the person consulting the oracle. A considerable number of these answers remain to us, all, of course, somewhat vague, many of them containing shrewd advice on the question that was brought to the oracle. The honor paid to the oracle and its influence, on the whole an influence making for high ethical standards and wise statesmanship, must be recognized. The early Christian Fathers held that the Pythian priestess was inspired by an evil spirit; later critics have treated the whole institution as a clever device to deceive the people; but in view of the respect paid to the oracle through so many generations, it is hard to believe that its officials were not honest in their effort to discover and make known the will of the god they served.<P>III. Forms of Worship.<P>1. Shrines:<P>It has already been pointed out that Greek religion centered about local shrines. While in early times the shrine consisted of an altar with perhaps a sacred grove, and later it might be no more than a block of stone on which offerings were laid, the more important shrines consisted of a plot of land sacred to the god, a temple or home for the god, and an altar for sacrifices. The plot of land, especially in the case of shrines outside a city, might be very large, in which case it often was used as a source of income to the shrine, being cultivated by the priests or leased under restrictions to private persons.<P>2. Temples:<P>In this precinct stood the temple, facing toward the east, so that the morning sun would flood its interior when it was opened on a festival day. With one or two exceptions, the temple was not a place of assembly for worship, but a home for the god. It contained some symbol of his presence, after the 5th century BC ordinarily an image of the god; it served as the treasure-house for gifts brought to the god; worship might be offered in it by the priests, while the people gathered at the sacrifice outside. And as a home for the god, it was adorned with all the beauty and magnificence that could be commanded. The images of the gods, the noblest creation of sculpture in the 5th and 4th centuries, were not exactly "idols"; that is, the images were not themselves worshipped, even though they were thought to embody the god in some semblance to his true form. In Greece men worshipped the gods themselves, grateful as they were to artists who showed them in what beautiful form to think of their deities.<P>3. Priests:<P>Each of these shrines was directly in the hands of one or more officials, whose duty it was to care for the shrine and to keep up its worship in due form. Occasionally the priesthood was hereditary and the office was held for life; quite as often priests were chosen for a year or a term of years; but it was exceptional when the duties of the office prevented a man from engaging in other occupations. In distinction from the priests of many other forms of religion, the Greek priest was not a sacred man set apart for the service of the gods; the office may be called sacred, but the office was distinct from the man. The result was important, in that the priests in Greece could never form a caste by themselves, nor could they claim any other powers than were conferred on them by the ritual of the shrine. Thus Greek religion remained in the possession of the people, and developed no esoteric side either in dogma or in worship.<P>4. Seasons of Worship: Festivals:<P>The seasons of worship varied with each particular shrine. While the state observed no recurring sabbath, it recognized a certain number of religious festivals as public holidays; thus at Athens the number of religious holidays in the year was somewhat larger than our fifty-two Sundays. The tradition of each shrine determined whether worship should be offered daily or monthly or yearly, and also what were the more important seasons of worship. The principle of the sacred days was that at certain seasons the god was present in his temple expecting worship; just as it was the principle of sacred places that the temple should be located where the presence of the god had been felt and therefore might be expected again. Neither the location of the temple nor the seasons of worship were determined primarily by human convenience.<P>5. Elements of Worship:<P>The elements of worship in Greece were<P class="in15">(1) prayers, hymns, and votive offerings,<P class="in15">(2) the sacrificial meal,<P class="in15">(3) propitiatory sacrifice and purification, and<P class="in15">(4) the processions, musical contests and athletic games, which formed part of the larger festivals.<P>The heroes of Homer prayed to the gods at all times, now a word of prayer in danger, now more formal prayers in connection with a sacrifice; and such was doubtless the practice in later times.<P>6. Prayer:<P>In the more formal prayers, it was customary to invoke the god with various epithets, to state the petition, and to give the reason why a favorable answer might be expected—either former worship by the petitioner, or vows of future gifts, or former answers to prayer, or an appeal to the pity of the god. Sometimes a prayer reads as if it were an attempt to win divine favor by gifts; more commonly, if not always, the appeal is to a relationship between man and his god, in which man\'s gifts play a very subordinate part. Thanksgiving finds small place in prayer or in sacrifice, but it was rather expressed in votive offerings. In every temple these abounded, as in certain Roman Catholic shrines today; and as is the case today they might be of value in themselves, they might have some special reference to the god, or they might refer to the human need in which the giver had found help. So far as the great public festivals are concerned, the prayer seems to have been merged with the hymn of praise in which the element of petition found a small place.<P>7. Burnt Offering or Sacrificial Meal:<P>The most common form of worship consisted of the sacrificial meal, like the meat offering or meal offering of the Hebrews. The sacrifice consisted of a domestic animal, selected in accordance with the ritual of the shrine where it was to be offered. First the animal was led to the altar, consecrated with special rites and killed by the offerer or the priest while hymns and cries of worship were uttered by the worshippers. Then some of the inward parts were roasted and eaten by priests and worshippers. Finally the remainder of the creature was prepared, the thigh bones wrapped in fat and meat to be burned for the god, the balance of the meat to be roasted for the Worshippers; and with libations of wine the whole was consumed. The religious meaning of the act is evidently found in the analogy of a meal prepared for an honored guest.<P>8. Meaning of the Sacrifice:<P>The animal, an object valuable in itself, is devoted to this religious service; the god and his worshippers share alike this common meal; and the god is attached to his worshippers by a closer social bond, because they show their desire to honor and commune with him, while he condescends to accept the gift and to share the meal they have prepared. (Possibly the animal was once thought to have been made divine by the act of consecration, or the god was believed to be present in his flesh, but there is no evidence that such a belief existed in the 5th century BC, or later.) The simple, rational character of this worship is characteristic of Greek religion.<P>9. Propitiatory Sacrifice:<P>When men felt that the gods were displeased or in circumstances where for any reason their favor was doubtful, a different form of sacrifice was performed. A black animal was selected, and brought to a low altar of earth; the sacrifice was offered toward evening or at night, and the whole animal was consumed by fire. While in general this type of sacrifice may be called propitiatory, its form, if not its meaning, varied greatly. It might be worship to spirits of the earth whose anger was to be feared; it might be offered when an army was going into battle, or when the crops were in danger of blight, or of drought; or again it was the normal form of worship in seasons of pestilence or other trouble. Sometimes the emphasis seems to be laid on the propitiation of anger by an animal wholly devoted to the god, while at other times there is the suggestion that some evil substance is removed by the rite.<P>10. Purification:<P>The later conception is clearer in rites of purification, where, by washing, by fire, or by the blood of an animal slain for the purpose, some form of defilement is removed. In the sacrifice of a pig to Demeter for this purpose, or of a dog to Hecate, some mystic element may exist, since these animals were sacred to the respective goddesses.<P>These various elements of worship were combined in varying degree in the great religious festivals. These lasted from a day to a fortnight. After purification of the worshippers, which might be simple or elaborate, and some preliminary sacrifice, there was often a splendid procession followed by a great public sacrifice.<P>11. The Great Religious Festivals:<P>In the greater festivals, this was followed by athletic games and horse races in honor of the god, and sometimes by contests in music and choral dancing, or, in the festivals of Dionysus at Athens, by the performance of tragedy and comedy in theater. In all this, the religious element seems to retreat into the background, though analogies may be found in the history of Christianity. The religious mystery plays were the origin of our own drama; and as for the horse races, one may still see them performed as a religious function, for example, at Siena. The horse races and the athletic games were performed for the gods as for some visiting potentate, a means of affording them pleasure and doing them honor. The theatrical performances apparently originated in ceremonies more essentially religious, in which men acted some divine drama depicting the experiences attributed to the gods themselves.<P>12. Mysteries at Eleusis:<P>This last feature is most evident in the mysteries at Eleusis, where the experiences of Demeter and Persephone were enacted by the people with the purpose of bringing the worshippers into some more intimate connection with these goddesses, such that their blessing was assured not only for this world, but for the life after death.<P>13. Absence of Magic and Mystery:<P>In all the forms of Greek worship perhaps the most striking feature was the absence of magic or superstition, almost the absence of mystery. Men approached the gods as they would approach superior men, bringing them petitions and gifts, making great banquets for their entertainment, and performing races and games for their pleasure, although this was by no means the whole of Greek religion, a phase of religion far more highly developed in the rational atmosphere of Greek thought than among other races. As the Greek gods were superior members of the social universe, so Greek worship was for the most part social, even human, in its character.<P>IV. The Future Life.<P>1. Funeral Rites:<P>Greek thought of the life after death was made up of three elements which developed successively, while the earlier ones never quite lost their hold on the people in the presence of the later. The oldest and most permanent thought of the future found its expression in the worship of ancestors. Whether the body of the dead was buried or burned, the spirit was believed to survive, an insubstantial shadowy being in the likeness of the living man. And rites were performed for these shades to lay them to rest and to prevent them from injuring their survivors, if not to secure their positive blessing. As at other points in Greek religion, the rites are fairly well known, while the belief must be inferred from the rites. The rites consisted first of an elaborate funeral, including sometimes animal sacrifices and even athletic games, and secondly of gifts recurring at stated intervals, gifts of water for bathing, of wine and food, and of wreaths and flowers. The human wants and satisfaction of the spirit are thus indicated. And the purpose is perhaps to keep the spirit alive, certainly to keep it in good humor so that it will not injure the survivors and bring on them defilement which would mean the wrath of the gods. At the same time, any contact with death demands purification before one can approach the gods in worship.<P>2. Future Life in the Homeric Poems:<P>The second element in Greek thought of the future life appears in the Homeric poems, and through the epic exerted a wide influence on later periods. Here the separateness of the souls of the dead from the human life is emphasized. Once the bodies of the dead are burned, the souls go to the realm of Hades, whence there is no return even in dreams, and where (according to one view) not even consciousness remains to them. It would seem that the highly rational view of the world in the epic, a point of view which laid stress on the greater Olympian gods, banished the belief in souls as akin to the belief in sinister and magic influences. We might almost say that the thought of the greater gods as personal rulers tended to drive out the thought of lesser and more mystic spiritual influences, and made a place for souls only as shades in the realm of Hades. Certainly the result for Greek religion was to render far less vivid any idea of a real life after death.<P>3. Later Beliefs in Immortality:<P>The third element was associated with the worship of the gods of the lower world, and in particular Demeter and Persephone. In this worship, particularly at Eleusis, the fact of life after death was assumed, a fact that the Greeks never had denied; but the reality of the future life, the persistence of human relationship after death, and the kindly rule of Persephone as Queen of Souls were vividly impressed on the worshippers. In part through the influence of the Orphic sect, the actual divinity of the soul was believed by many thinkers, a doctrine which was formulated by Plato in a manner which profoundly affected early Christian thought. If the epic emphasis on the greater gods made the souls mere shades in Hades, it was again a religious movement, namely the worship of gods like Persephone and Dionysus, which taught to some Greeks the divine reality of the soul and its hope for a blessed life in communion with the gods.<P>This development in Greece is the more interesting because there are indications of the same. thing in Hebrew history. In the Old Testament there are found traces of an old worship of souls, practiced by races akin to the Hebrews if not by the Hebrews themselves; this worship was brought to an end under the clarifying power of the worship of Yahweh; and finally the later prophets perceived the truth that while souls were not to be worshipped, the dead who died in the Lord did not become mere shades, but continued to live as the objects of His Divine love.<P>V. Sin, Expiation, and the Religious Life.<P>1. Greek Idea of Sin:<P>The ancient Hebrew religion made much of sin, and of the remedy for sin which God, in loving mercy to His people, had provided; in Greece the thought of sin found no such place in the religious life, though of course it was not absent altogether. If sin is defined as that which causes divine displeasure and wrath, it appears in Greek thought in three forms:<P class="in15">(1) as the transgression of moral law,<P class="in15">(2) as neglect of the gods and consequent presumption, and<P class="in15">(3) as pollution.<P>The cause of sin is traced to human folly, either some passion like envy or anger or desire for gain, or to undue self-reliance which develops into presumption; and once a man has started in the wrong direction, his sin so affects judgment and will that he is all but inevitably led on into further sin. According to the simple Greek theodicy, the transgression of moral law brings its penalty, nor can any sacrifice induce the gods to intervene on behalf of the transgressor. All that expiation can accomplish is to set right the spirit of the transgressor so that he will not be led into further sin. Neglect of the gods—the second type of sin—brings its penalty in the results of divine wrath, but in this case, prompt repentance and submission to the gods may appease the wrath and therefore change its results. Pollution, the third cause of divine displeasure, often cannot be called sin; the failure to remove pollution, however, especially before one approaches the gods, is a just cause of divine anger. In general the Greek thought of sin centers about the idea of undue self-reliance and presumption, (hubris), which is the opposite of the characteristic Greek virtue, (sophrosune), namely that temperate mode of life in which everything is viewed in right proportion. Inasmuch as the Greek gods are righteous rulers, the nature of sin lies in its opposition to divine justice, not in unholiness or in the rejection of divine love.<P>2. Religious Ideals:<P>The demands of the religious life in Greece were relatively simple. To avoid acts of impiety such as are mentioned above, to perform the ordinary acts of worship regularly and punctiliously, were all that was required, though the religious man might find many opportunities for worship beyond what was expected of everyone. Little is said of the spirit of worship which underlay the outward acts. Nor does the command, "Be ye therefore holy, even as I am holy," find an echo in Greece. At the same time the fact that the gods so definitely represented human ideals of life, must have meant that in a way men aimed to make their lives conform to divine ideals. The essential feature of the religious life was the true recognition of human dependence on the gods, a dependence which showed itself in obedience to the divine rule, in trustful confidence that the gods would bless their worshippers, in resignation when misfortune came, and particularly in the belief in the loving care and protection of the divine rulers. In Greece, the religious man looked to the gods not so much for salvation from evil, as for positive blessings.<P>VI. The Influence of Greek Religion on Christianity.<P>1. Greek Philosophy and Christian Theology:<P>This is not the place to speak of the decadence of Greek religion, of its ameliorating influence on the Alexandrian world, or of the control it exercised over the Roman state. Its most permanent effect is found rather in Christianity. And here its shaping influence is first noted in Christian theology beginning with Paul and the Apostle John. For although Greek religion was more free from dogma or anything that could be called theology than are most religions, it furnished the religious content to the greatest philosophical systems we know; and all through the centuries the leaders of Christian thought have been trained in the religious philosophy of Plato and of Aristotle. Our Christian conceptions of the nature of God and the soul, of the relation of God to the physical universe, and of God\'s government of the world, have been worked out along the lines laid down by these Greek thinkers. And while the debt is primarily to Greek philosophy, it should never be forgotten that Greek philosophy formulated these conceptions out of the material which Greek religion furnished; indeed one may believe that it was the religious conceptions formulated by centuries of thoughtful worshippers which found final expression in the Greek philosophic systems.<P>2. Greek Influence on Christian Liturgy:<P>Again, the organization of the early Christian church and its form of government was quite as much Greek as it was Hebrew in origin. Here the influence of Greek religion as such was less marked; still it must be remembered that every form of Greek organization had its religious side, be it family, or school, or state; and further, that some phases of religion in Greece were quite thoroughly organized in a manner that was adapted without much difficulty to the conditions of the new religion. Moreover the thought of the Greek priest as not a sacred man, but a man appointed by the community to a sacred office, was naturally adopted by the nascent Christian communities. Even in the organization of worship, in the prayers and hymns and liturgy which gradually developed from the simplest beginnings, it is not difficult to trace the influence of what the Greek converts to Christianity had been brought up to regard as worship of the gods.<P>3. Greek Influence on the Sacraments:<P>The most striking case of the effect of the old religion on the new is found in the method of celebrating the Christian sacraments. In the 2nd century AD, the baptismal bath took place after a brief period of instruction, and at the common meal the bread and wine were blessed in commemoration of the Master. Three centuries passed and this simplicity had given way to splendid ceremony. Baptism ordinarily was performed only on the "mystic night," the night before Easter. Almost magic rites with fasting had exorcised evil from the candidate; ungirded, with loose hair and bare feet, he went down into the water, and later was anointed with oil to signify the gift of the Holy Spirit; then the candidates, dressed in white, wearing crowns, and carrying torches, proceeded to their first communion in which a mixture of honey and milk might take the place of wine. The whole ceremony had been assimilated to what Greek religion knew as an initiation, in which the baptized underwent some essential change of nature. They were said to have "put on the dress of immortality."<P>The Lord\'s Supper was carefully limited to those who had been through this initiation, and even among these, at length, degrees of privilege arose. The ceremony came to be known as a mystery, the table as an altar, the officiating priest as a "hierarch," and the result as a blessed "vision" of sacred things by which the resurrection life was imparted. In its formal character and the interpretation of its meaning, as well as in the terms used to describe it, the effect of the Greek mysteries may be seen.<P>Yet during these three centuries Christianity had been waging a life-and-death struggle with the old religion. It is indeed impossible to believe that converts to Christianity should intentionally copy the forms of a worship which they had often at much cost to themselves rejected as false. The process must have been slow and quite unconscious. As the language of heathen philosophy was used in forming a Christian theology, so the conceptions and practices which had developed in Greek religion found their way into the developing Christian ritual. Much of this ritual which had no essential place in Christianity was later rejected; some still remains, the contribution of the religious life of Greece to the forms of worship in our world religion.<P>LITERATURE.<P>O. Gruppe, "Griechische Mythologie und Religionsgeschichte" in I. von Muller\'s Handbuch, 1897-1906; Preller-Robert, Griechische Mythologie, I, 1894; W. H. Roscher, Ausfuhrliches Lexikon der griechischen und romishen Mythologie, 1884-; L. R. Farnell, The Cults of the Greek States, 1896-1910; L. Campbell, Religion in Greek Literature, 1898; J. Adam, The Religious Teachers of Greece, 1908; P. Stengel, "Die griechischen Kultusaltertumer," in I. von Muller\'s Handbuch, 2nd edition, 1898; B.I. Wheeler, Dionysus and Immortality, 1899; E. Hatch, Greek Ideas and Usages, Their Influence upon the Christian Church, 1890; G. Anrich, Das antike Mysterienwesen in seinem Einfluss auf das Christentum, 1894; E. E. G., The Makers of Hellas: A Critical Inquiry into the Philosophy and Religion of Ancient Greece, 1903; E. Caird, Evolution of Theology in Greek Philosophers, 1904; E.A. Gardner, Religion and Art in Ancient Greece, 1910; A. Fairbanks, Handbook of Greek Religion, 1910.``55';
isbe[3935]='Greece, Sons of`"I will stir up thy sons, O Zion, against thy sons, O Greece, and will make thee as the sword of a mighty man" (<a onClick="return mV(\'Zec\',9,13);">Zec 9:13</a>). The passage doubtless refers to the captive Hebrews who are held by the Greeks. The exhortation is to insurrection against the Greeks. Although bearing a striking similarity to the passage in <a onClick="return mV(\'Joe\',3,6);">Joe 3:6</a>, there is evidently no connection between the two. In the first, there was conflict between the nations; in the second, simply a reflection upon Tyre and Sidon for having sold into Greece certain Jewish captives. From a Jewish standpoint the Maccabean wars were really between Jews and Greeks.`<a href="./study/isbe/search.html?string=JAVAN">JAVAN</a>; <a href="./study/isbe/search.html?string=ASMONEANS">ASMONEANS</a>`1';
isbe[3936]='Greece; Graecia`gres, gre\'-sha;<P>1. Name:<P>In the earliest times there was no single name universally and exclusively in use either of the people or of the land of Greece. In Homer, three appellations, (Achaioi), (Danaoi), (Argeioi), were with no apparent discrimination applied to all the Greeks. By the Orientals they were called Ionians. See <a href="./study/isbe/search.html?string=JAVAN">JAVAN</a>. The name (Hellenes), which in historical times came into general use as a collective appellation, was applied in Homer to a small tribe in Thessaly. But the corresponding name (Hellas) was not primarily a geographical term, but designated the abode of the Hellenes wherever they had their own states or cities. In the 4th century BC many felt, as did Isocrates, that even "Hellene" stood not so much for a distinction in race, as for preeminence of culture, in contrast to the despised "Barbarian." Hence, there was much dispute as touching certain peoples, as, e.g. the Epirotes, Macedonians, and even the Thessalians, whether they should be accounted Hellenes and as included in Hellas. The word (Graikoi), Latin Graeci) occurs in Aristotle, who says that it was an older name for those who were later called Hellenes. The meaning and truth of this statement are alike in doubt; but he probably refers only to the tribe inhabiting the vicinity of Dodona, in Epirus. At any rate, Graeci and Graecia owed their introduction practically to the Romans after their contact with the Greeks in the war with Pyrrhus, and in consequence they included (what "Hellenes" and "Hellas" did not) Epirus and Macedonia.<P>2. Location and Area:<P>"Hellas," as the land of the Hellenes, is used in a broad sense to include not only Greece proper, but also the islands of the Ionian and Aegean seas, the seaboard of the Hellespont, of the Pontus, and of Asia Minor, the flourishing colonial regions of Magna Grecia and Sicily, Crete, and occasionally Cyprus, Cyrene, and the scattered colonies dotting the shore of the Mediterranean, almost to the Pillars of Hercules. "Grecia," however, was used in a more restricted sense as applying to "Continuous" (or continental) Greece, which forms the southern extremity of the Balkan peninsula. While the Romans included Macedonia and Epirus, it will be well for us to limit Greece to the territory lying roughly below 40 degrees, and extending almost to 36 degrees North latitude, and ranging between 17 degrees and 23 degrees East longitude. If, as is proper, we include the immediately adjacent islands, its greatest length, from Mt. Olympus in the north to Cythera in the south, is about 280 miles; its greatest breadth, from Cephallenia in the west to Euboea in the east, is about 240 miles. The area, however, owing to the great irregularity of its contour, is far less than one might expect, amounting to about 30,000 square miles. With an area, therefore, considerably less than that of Portugal, Greece has a coastline exceeding in length that of Spain and Portugal combined. In Greece the ratio of coastline to area <span class="noTag">is</span> 1:3 1/4, whereas that of the Iberian peninsula <span clas="noTag">is</span> 1:25.<P>3. Mountain Structure:<P>The northern boundary of Greece is formed by an irregular series of mountain chains, beginning on the west with the Acroceraunian range and ending in Mt. Olympus (now, Elymbos, 9,790 ft.) on the east. Intersecting this line, the lofty Pindus range, forming the backbone of Northern Greece, extends southward to Mt. Tymphrestus (now, Velouchi, 7,610 ft.) in Aetolia, at which point spurs radiate through Central Greece. The highest peaks are Mt. Corax (now, Vardusia, 8,180 ft.) in Aetolia, Mt. Oeta (7,060 ft.), Parnassus (now, Lyakoura, 8,070 ft.), Helicon (now, Paleo Vouno, 5,740 ft.), Cithaeron (now, Elatias, 4,630 ft.), lying on the boundary between Boeotia and Attica, Mt. Geranea (now, Makri Plaghi, 4,500 ft.), north of the Isthmus, and, in Attica, Parnes (now, Ozea, 4,640 ft.), Pentelicon (now, Mendeli, 3,640 ft.) and Hymettus (now Trelovouni, 3,370 ft.). Along the eastern coast extends a broken range of mountains, the highest peaks of which are Ossa (now, Kissavos, 6,400 ft.), Pelion (now, Plessidi, 5,310 ft.); and, in Euboea, which virtually belongs to this range, Dirphys (now, Delphi, 5,730 ft.) and Ocha (now, Elias, 4,610 ft.). Southern Greece, or the Peloponnesus, is united to Central Greece only by a narrow isthmus (now cut by a canal 4 miles long), with a minimum altitude of about 250 ft. In the northern portion, a confused mass of mountains rises to great heights in Cyllene (now, Ziria, 7,790 ft.), Erymanthus (now, Olonos, 7,300 ft), Maenalus (now, Apano Chrepa, 6,500 ft.), all in Arcadia, Panachaicus (now, Voidia, 6,320 ft.), in Achaia; and, running southward through Laconia, the two important ranges called Taygetus (now, Pentedaktylo, 7,900 ft.) and Parnon (now, Malevo, 6,430 ft.). Minor ranges jut seaward in Argolis, Laconia and Messenia.<P>4. Rivers and Lakes:<P>The rainfall in Greece is not abundant and is confined largely to late autumn and winter. Whether the present rainfall differs much in amount from that of antiquity is a matter in dispute, although it seems reasonable to assume that the progressive denudation of the mountains since the 5th century AD has entailed a corresponding loss in humidity. Even in antiquity, however, the rivers of Greece were much like the arroyos of the southwest portion of the U.S.A., which are in winter raging mountain torrents, and in summer dry channels. Owing to the proximity of the sea to all points in Greece, the rivers are short, and the scarcity of springs makes them dependent upon the direct and immediate rainfall. Among the more considerable rivers may be enumerated, in Northern Greece, the Peneius, with its tributaries, in Thessaly; Central Greece, the Achelous and the Evenus, in Aetolia; the Spercheius, flowing between Oeta and Othrys into the Maliac Gulf; the storied, but actually insignificant, Ilyssus and Cephissus, of the Attic plain; in Southern Greece, the Alpheius, rising in Arcadia and flowing westward through Elis, and the Eurotas, which drains Laconia. Eastern Greece consists of a series of somewhat considerable basins, which become lakes in winter and are pestilent marshes in summer, except where Nature or man has afforded an outlet. The former is the case with the Peneius, which has cut a channel through the celebrated Vale of Tempe. Lake Copais, in Boeotia, affords an example of man\'s activity. The Minyae, in prehistoric times, are credited with enlarging the natural outlets, and so draining the basin for a time; in recent times the same undertaking has again been brought to a successful issue. Similar basins occur at Lake Boebeis, in Thessaly, and at Lake Stymphalus, in Arcadia, besides others of less importance. Western Greece has relatively few such basins, as at Lake Pambotis, in Epirus, and at Lake Trichonis, in Aetolia. In many cases, where there is no surface outlet to these basins, subterranean channels (called by the Greeks Katavothrae) are formed in the calcareous rock, through which the waters are drained and occasionally again brought to the surface at a lower level.<P>5. Climate:<P>The climate of Greece was probably much the same in ancient times as it is today, except that it may have been more salubrious when the land was more thickly populated and better cultivated. Herodotus says that of all countries, Greece possessed the most happily tempered seasons; and Hippocrates and Aristotle commend it for the absence of extremes of heat and cold, as favorable for intelligence and energy. But owing to the inequalities of its surface, to the height of its mountains and the depth of its valleys, the climate varies greatly in different districts. In the highlands of the interior the winter is often cold and severe, the snow lying on the ground until late in the spring, while in the lowlands near the sea there is rarely any severe weather, and snow is almost unknown. The following data for Athens may be taken as a basis for comparison: humidity 41 per cent, rainfall 13,1 inches, distributed over 100 days; mean temperature, Jan. 48,2 degrees F., July 80,6 degrees F. Greece lies open to the northern winds which, during certain seasons, prevail and give a bracing quality to the air not always present in places of the same latitude.<P>6. Geology:<P>The western half of Greece, in which the mountain ranges run generally from north to south, consists of a formation of grayish and yellowish-white compact limestone, while the eastern half—Macedonia, Thessaly, Euboea, Cyllene, and the mountains from Artemision to Cape Malea and Taygetus—together with the greater part of Attica and of the Cyclades, consists of mica-schist and crystalline-granular limestone (marble) Tertiary formations occur in narrow strips on the north and northwest slopes of the ranges in the Peloponnesus and in the valley of the Eurotas, in Boeotia and Euboea. Volcanic action is evidenced both in the parallel elevations of similar or contemporary formation, and in the earthquakes frequent in all ages, especially in Southern and Central Greece, and in the islands of the Aegean. Perennially active volcanoes are nowhere found in Greece, but new formations due to volcanic action are most clearly seen on the island of Them among the Cyclades, where they have occurred within the last half-century. The solfatara between Megara and Corinth, and the abundant hot springs at widely scattered points in Greece also bear witness to the volcanic character of the region. Many an ancient site, venerated for its sanctity in antiquity, like those of Delphi and Olympia, in their ruined temples offer mute testimony to the violence of the earthquakes; and history records repeated instances of cities engulfed by tidal waves of appalling height.<P>7. Topography:<P>Mention has already been made of the sinuous coastline of Greece, and the land has been spoken of as consisting of three divisions. Northern Greece, to which Epirus and Thessaly belong, is marked off from Central Greece by the deep indentations of the Ambracian Gulf on the west and the Maliac Gulf on the east. The Pegasean Gulf, virtually continued by Lake Boebeis, reaches far into Thessaly, and divides it from Magnesia, which lies to the eastward. The land of the Dolopians really belongs to Northern Greece. Central Greece consists of Acarnania and Aetolia on the west, and of Phocis, Boeotia and Attica (with the adjacent island of Euboea) on the east, separated by a group of lesser states, Aenis, Oetaea, Doris, Locris and Phocis. Southern Greece is separated from central Greece by the Corinthian and Saronic Gulfs, which almost meet at the Isthmus of Corinth, and are now, after repeated efforts, dating from the time of Julius Caesar, united by a sea-level canal. Megaris, which, by its position, belongs to Central Greece, is here, in accordance with its political affinities and predilections, classed with Corinth, the keeper of the isthmus, as belonging to Southern Greece. Facing the Corinthian Gulf, Achaia forms the northern division of the Peloponnesus, touching Elis, Arcadia and Argolis, which belt the peninsula in this order from west to east Arcadia is the only political division which does not have access to the sea, occupying as it does the great central plateau intersected by lesser ranges of varying height. The southernmost divisions, Messenia and Laconia, are deeply indented by the Messeniac and Laconic Gulfs, and Laconia is separated from the peninsula of Argolis by the Argolic Gulf, all of which head somewhat west of north of the subjacent islands, which a reasonable view must include in the boundaries of Greece, Euboea has already been mentioned; but we should add the group of great islands lying in the Ionian Sea, namely, Corcyra (now, Corfu), Leukas, Ithaca, Cephallenia (now, Cephalonia), Zacynthus (now, Zante), and Cythera (now, Cerigo), at the mouth of the Laconic Gulf, as well as Salamis and Aegina in the Saronic Gulf.<P>Greece was never, in ancient times, a united state, but consisted of a large number of separate states. These were essentially of two types, (a) city-states, in which a city dominated the adjacent territory whose free population constituted its citizenship, or (b) confederacies, in which neighboring cities or districts combined into political organizations which we may call federal states. These matters cannot, however, be discussed except in connection with the history of Greece, for which the reader must consult the standard works. It may be advisable here, however, to name the principal cities of Greece. Northern Greece had no great cities which developed as commercial centers. Aegina was the first to attain to special importance, then Corinth and Athens; Chalcis and Eretria, in Euboea, were for a time rich and prosperous, and Megara, in Megarid, and Argos, in Argolis, became formidable rivals of Athens. Sparta, though never a commercial center, early won and long maintained the hegemony of Greece, for a while disputed by Athens, in virtue of her power as the home of the militant Dorian aristocracy, which was disastrously defeated by the Beotians under Epaminondas, when Thebes, for a time, assumed great importance. Megalopolis, in Arcadia, enjoyed a brief prominence at the time of the Achean League, and Corcyra flourished in the 5th and 4th centuries BC. We should also not fail to mention three great centers of Greek religion: Olympia, in Elis, as the chief sanctuary of Zeus; Delphi, in Phocis, as the oracular seat of Apollo; and Eleusis, in Attica, as the pilgrim-shrine to which all Greeks resorted who would be initiated in the mysteries of Demeter and Cora. Argos also possessed a far-famed shrine of Hera, and Thermopile and Calauria were the centers at which met the councils of influential amphictyonies. Epidaurus was famous for her sanctuary of Asclepius. Delos, a little island in mid-Aegean, celebrated as a sanctuary of Apollo and as the meeting-place of a most influential amphictyony, falls without the limits of Greece proper; but Dodona, in Southern Epirus, should be mentioned as the most ancient and venerable abode of the oracle of Zeus. The Greeks, incorrigibly particularistic in politics, because of the almost insuperable barriers erected by Nature between neighboring peoples in the lofty mountain ranges, were in a measure united by their religion which, like the sea, another element making for intercourse and union, touched them at nearly every point.<P>For Greece in the Old Testament, see <a href="./study/isbe/search.html?string=JAVAN">JAVAN</A>. In the New Testament "Greece" occurs but once—<a onClick="return mV(\'Act\',20,2);">Ac 20:2</a>—where it is distinguished from Macedonia.``75';
