isbe[3903]='Gotholias`goth-o-li\'-as (Gotholias): Father of Josias, one of the sons of Elam who returned from Babylon with Ezra (1Esdras 8:33). The name corresponds to Athaliah, the Greek Gotholias being substituted for the Hebrew guttural \'ayin, as in Gomorrah, Gaza, etc. Taken with <a onClick="return mV(\'2Ki\',11,1);">2Ki 11:1</a>, the name would seem to have been used for both men and women.``1';
isbe[3904]='Gothoniel`go-tho\'-ni-el (Gothoniel): The same as Othniel, father of Chabris who was one of the governors of the city of Bethulia (Judith 6:15).``1';
isbe[3905]='Gourd`gord, goord (qiqayon): The Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) has hedera ("ivy"), which is impossible. Philologically qiqayon appears to be connected with kiki, which was the Egyptian name for the castor oil plant (Ricinus communis). This grows plentifully all over the Orient, and under favorable conditions may reach a height of 10 to 15 ft.; its larger leaves afford a grateful shade. The requirements of the narrative in <a onClick="return mV(\'Jon\',4,6);">Jon 4:6</a>ff are, however, much more suitably met by the "bottle gourd" (Cucurbita lagenaria), the Arab qar\'ah. This is a creeping, vinelike plant which may frequently be seen trained over the rough temporary sun-shelters erected in fields or by the roadside in Palestine and Mesopotamia.``117';
isbe[3906]='Gourd, Wild`wild (paqqu\'oth sadheh, <a onClick="return mV(\'2Ki\',4,39);">2Ki 4:39</a>): The root paqa\', means "to split" or "burst open," and on this ground these "wild gourds" have been identified with the fruit of the squirting cucumber (Ecballium elaterium). This little gourd, 1 1//2 to 2 inches long, when fully ripe falls suddenly when touched or shaken, the bitter, irritating juice is squirted to a considerable distance, and the seeds are thrown all around. It is exceedingly common in Palestine, and its familiar poisonous properties, as a drastic cathartic, made it unlikely that under any circumstances its fruit could be mistaken for any edible gourd; it is, too, in no way vinelike ("wild vine," <a onClick="return mV(\'2Ki\',4,39);">2Ki 4:39</a>) in appearance; the stem is stiff and upright, and there are no tendrils. The traditional plant, Cucumis prophetarium, which grows in the desert, and has very small "gourds," has nothing really to recommend it. By far the most probable plant is the Colocynth (Citrullus colocynthis), belonging like the last two, to Natural Order, Cucurbitaceae. This view has the support of the Septuagint and Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) It is a vinelike plant which spreads over the ground or attaches itself by its spiral tendrils to other plants. The rounded "gourds" are 3 inches or more in diameter, and contain a pulp intensely bitter and, in any but minute quantities, extremely poisonous.``117';
isbe[3907]='Government`guv\'-ern-ment: The government of the Hebrews varied at different periods, of which we may distinguish seven:<P>(1) The nomadic period, from the Exodus to the entrance into Palestine;<P>(2) The period of transition from nomadic to civil life;<P>(3) The monarchy;<P>(4) The period of subjection to other oriental nations;<P>(5) The period from Ezra to the Greeks;<P>(6) Greek rule;<P>(7) Roman rule.<HR /><P>1. The Nomadic Period:<P>The government of the primitive period is that proper to nomadic tribes composed of families and clans, in no wise peculiar to the Hebrews, but shared in its essential features by the most diverse peoples at a corresponding stage of civilization. Though we might draw illustrations from many sources, the government of the Bedouins, Semitic nomads inhabiting the steppes of Arabia, affords the most instructive parallel. In the patriarchal state the family is the household (including slaves and concubines) of the father, who is its head, having power of life and death over his children (<a onClick="return mV(\'Gen\',22,\'1-\');">Ge 22</a>; <a onClick="return mV(\'Jdg\',11,31);">Jud 11:31</a>). A clan is a collection of families under a common chieftain, chosen for his personal qualifications, such as prowess and generous hospitality. The composition of the clan was essentially shifting, subject, according to circumstances, to the loss or accession of individuals and families. Although the possession of the same grazing-grounds doubtless played a large part in determining the complexion of the clan, the fiction of descent from a common ancestor was maintained, even when kinship was established by the blood covenant. In all probability community of worship, which cemented the tribe, served as the most effective bond of union also in the clan. Vestiges of such clan cults are still to be detected (<a onClick="return mV(\'1Sa\',20,5);">1Sa 20:5</a>ff; <a onClick="return mV(\'Jdg\',18,19);">Jud 18:19</a>). The familiar tradition of the twelve tribes must not be allowed to blind us to the evidence that the tribe also was not constant. Mention of the Kenites (<a onClick="return mV(\'Jdg\',1,16);">Jud 1:16</a>) and the list of tribes in the Song of Deborah (<a onClick="return mV(\'Jdg\',5,\'1-\');">Jud 5</a>) remind us that such organizations vanished. In the readjustment incident to the change from the pastoral life of the nomad to that of the settled agricultural population of Palestine, many units were doubtless shifted from one tribe to another, and the same result may be assumed as following from the endless strife between the tribes before and during the period of the kings. The large and powerful tribe of Judah seems to have originated comparatively late. The union of the tribes under the leadership of Moses was essentially similar to the formation of a new tribe out of a group of clans actuated by a desire to accomplish a common end. Many such temporary aggregations must have originated, only to succumb to the centrifugal forces of jealousy and conflicting interests. Even after the entrance of the Hebrews into Palestine, their history for long is that of kindred tribes, rather than that of a nation. The leadership of Moses rested on personal, not on constitutional, authority, and was rendered precarious by the claims of family and of clan, as in the case of Korah, Dathan, and Abiram (<a onClick="return mV(\'Num\',16,\'1-\');">Nu 16</a>). The authority of Moses naturally extended to the administration of justice, as well as to matters pertaining to war and religion. He appointed officers to assist him in this judicial function (<a onClick="return mV(\'Exd\',18,21);">Ex 18:21</a>), but the laws according to which they rendered judgment were those of custom and usage, not those of a written code. As among the tribal chieftains, important matters were referred to the leader, who, in cases of doubt or in default of recognized custom, resorted to the lot or to the oracle.<P>2. The Period of Transition:<P>When the nomad tribes settled in Palestine to become an agricultural people, there ensued a period of unrest due to the necessity for read-justment to changed conditions. The old tribal organization, admirably adapted to the former, ill suited the new requirements. These may be summed up in the demand for the substitution of local organization, based on the rights of individuals, for the tribal government, which had regard solely to the interests of family, clan and tribe. Such readjustment did not, of course, at once ensue, but came piecemeal in answer to the gradually realized wants of the community. Nor was the development entirely from within, but was unquestionably in large measure influenced by the institutions existing among the Canaanite population, only a part of which had been expelled by the invaders. Although the tribes still clung to the fiction of descent from a common ancestor, which was embodied in the accepted genealogies with their filiation of clans into tribes and of tribes into a nation, that which henceforth passed as a "tribe" was less an aggregation of kindred units than a geographical unit or group of units. The times were turbulent, disturbed by contending elements within and by foes without the tribes. Then it was that there arose a class of chieftains of strongly marked character, called by a new name. The "judge" (shophet) was not the ruler of a nation, but the chieftain of a tribe, winning and maintaining his authority by virtue of his personal prowess. The cases of Gideon and Abimelech (<a onClick="return mV(\'Jdg\',8,\'1-\');">Jud 8</a>; <a onClick="return mV(\'Jdg\',9,\'1-\');">9</A>) show that the authority of the "judge" was not hereditary. Agreeably to the generally changed conditions, the "elders" (zeqenim), who were formerly heads of families or kindreds, now came, possibly under the influence of the Canaanites, to be constituted an aristocratic upper class, with certain functions as administrative officers and councilors. Cities also grew and acquired importance, so that the adjacent hamlets were subordinated to them, probably even ruled from them as executive centers. In all this there is a certain similarity to the process by which, in the period just preceding the beginning of real history, Athens became the metropolis of Attica, and conventional tribes supplanted those based on kinship, while the rise of the purely local organization of the demos led speedily to the appearance of the "tyrants." The high places of clans and tribes continued to be frequented, and certain "seers" (<a onClick="return mV(\'1Sa\',9,6);">1Sa 9:6</a>) enjoyed considerable prestige by virtue of their peculiar relation to the tribal god.<P>3. The Monarchy:<P>While the succession of tribal chieftains and of the "judges" depended on personal qualifications, the principle of heredity is essential to the institution of monarchy, which originated in the desire to regulate the succession with a view to having an assured authoritative leadership. This principle could not, of course, be invoked in the appointment of Saul, the first king (melekh), who won this distinction in virtue of his personal prowess, supported by the powerful influence of the "seer," Samuel. His son Ishbosheth ruled two years over Israel, but lost his throne through the disaffection of his subjects (<a onClick="return mV(\'2Sa\',2,\'1-\');">2Sa 2-4</a>). The accession of David, king of Judah, to the throne of all Israel was likewise exceptional, owing as much to the character of the heir presumptive as to his own qualifications. Solomon, as the choice of his father David, succeeded by right of heredity with the support of the military and religious leaders. In the Southern Kingdom of Judah, heredity was henceforth observed because of its homogeneity and the consequent absence of internal discord; whereas the principle often failed in the turbulent Northern Kingdom of Israel, which was distracted by tribal jealousies. But even when not effectually operative, heredity was recognized as constituting a claim to the succession, although the popular voice, which had been supreme in the institution of the monarchy, was a power always to be reckoned with.<P>(1) Royal Prerogatives.<P>The history and functions of monarchy defined the prerogatives and duties of the king. Just as the head of the family, or the chieftain of a tribe, functioned as representative of those subject to him in matters of religion, war, and the administration of justice, so also was it with the king. In all these spheres he was supreme, exercising his authority either personally or through representatives who thus became part of the royal establishment. It is to be noted that the sacerdotal or sacral character of the king, which was merely an extension of his privileges as individual and head of a household, was not emphasized among the Hebrews to a like extent as among other oriental peoples; and the priests whom he appointed were perhaps in the first instance court chaplains, though in time they came to assume greater authority. The responsibility of the king for the public safety carried with it the obligation to guard the state treasures, to which the treasures of the temples were felt to belong; and it was his privilege to use them when necessary for defense. The levying of taxes, also, and the collection and use of revenues from various sources likewise fell of necessity to the king and his representatives.<P>(2) Officers.<P>In regard to the constitution of the king\'s court under Saul and David we learn comparatively little; even touching that of Solomon we are not fully informed, although we know that it must have been far removed from the original simplicity. We may classify the known officers as follows:<P>(a) religious: priests (<a onClick="return mV(\'2Sa\',8,17);">2Sa 8:17</a>; <a onClick="return mV(\'2Sa\',20,23);">20:23</a>);<P>(b) household: cupbearer (<a onClick="return mV(\'1Ki\',10,5);">1Ki 10:5</a>); master of the vestry (<a onClick="return mV(\'2Ki\',10,22);">2Ki 10:22</a>); master of the household (<a onClick="return mV(\'1Ki\',4,6);">1Ki 4:6</a>), who probably was a eunuch (<a onClick="return mV(\'1Ki\',22,9);">1Ki 22:9</a>; <a onClick="return mV(\'2Ki\',8,6);">2Ki 8:6</a>; <a onClick="return mV(\'2Ki\',9,32);">9:32</a>);<P>(c) state: scribe or clerk (<a onClick="return mV(\'2Sa\',8,17);">2Sa 8:17</a>; <a onClick="return mV(\'2Sa\',20,25);">20:25</a>, etc.); recorder, or prompter (<a onClick="return mV(\'1Ki\',4,3);">1Ki 4:3</a>); king\'s counselor (<a onClick="return mV(\'2Sa\',15,12);">2Sa 15:12</a>); and, perhaps, the king\'s friend (<a onClick="return mV(\'2Sa\',15,37);">2Sa 15:37</a>; <a onClick="return mV(\'2Sa\',16,16);">16:16</a>); overseer of taskwork (<a onClick="return mV(\'2Sa\',20,24);">2Sa 20:24</a>);<P>(d) military: commander-in-chief of the army (<a onClick="return mV(\'2Sa\',8,16);">2Sa 8:16</a>); commander of the king\'s guards (?)(<a onClick="return mV(\'2Sa\',8,18);">2Sa 8:18</a>; <a onClick="return mV(\'2Sa\',20,23);">20:23</a>).<P>(3) Fiscal Institutions.<P>The simplicity of Saul\'s rule was such as to make slight demands upon the resources of the people. He lived in the manner of a tribal chieftain on his ancestral estate, receiving from his subjects voluntary gifts (<a onClick="return mV(\'1Sa\',10,27);">1Sa 10:27</a>; <a onClick="return mV(\'1Sa\',16,20);">16:20</a>), and also, without doubt, his due share of the booty. Whether he instituted a regular tax (compare <a onClick="return mV(\'1Sa\',17,25);">1Sa 17:25</a>) is not certain. With the growth and prosperity of the nation, David changed the character of the court, imitating in a measure the state of other oriental potentates. It is not clear whether he levied a regular tax, although it may be surmised that he had it in view, together with the regulation of taskwork, in ordaining the census taken in his time (<a onClick="return mV(\'2Sa\',24,1);">2Sa 24:1</a>). We know that he received his portion of the booty (<a onClick="return mV(\'2Sa\',8,11);">2Sa 8:11</a>; <a onClick="return mV(\'2Sa\',12,30);">12:30</a>). The increasing luxury of Solomon\'s court required the imposition of additional taxes. It is probable that some income was derived from the enforced cultivation of crown lands (<a onClick="return mV(\'1Sa\',8,12);">1Sa 8:12</a>), although the taskwork, which became extremely burdensome and subsequently provoked the secession of the Northern Kingdom, was chiefly applied to public works. The tribute of subject peoples (<a onClick="return mV(\'1Ki\',4,21);">1Ki 4:21</a>) was considerable (<a onClick="return mV(\'1Ki\',10,14);">1Ki 10:14</a>). We now for the first time hear of taxes upon caravans and merchants, although it was in all probability a source of income even in the time of the nomad chieftains; there was also revenue from the carrying trade of his merchant fleet (<a onClick="return mV(\'1Ki\',10,11,22);">1Ki 10:11, 22</a>) and from the trade in horses and chariots carried on with Egypt (<a onClick="return mV(\'1Ki\',10,28);">1Ki 10:28</a>). Solomon also divided his kingdom into twelve provinces commanded by prefects, who should provide victuals for the king and his household: each prefect had to make provision for a month in the year (<a onClick="return mV(\'1Ki\',4,7);">1Ki 4:7</a>). It does not appear whether Judah, which is not included in the list of provinces, was as a mark of special favor exempted from this tax, or whether the omission is to be otherwise explained. The seizure of the vineyard of Naboth by Ahab (<a onClick="return mV(\'1Ki\',21,\'1-\');">1Ki 21</a>) makes it seem not improbable that the property of persons condemned on certain charges was confiscate to the king.<P>(4) Administration of Justice.<P>The king, like the tribal chieftain of the steppes, still sat in judgment, but chiefly in matters of moment; less important cases were decided by the prefects of provinces and other officers. Under the earlier kings there was no code except the Book of the Covenant (<a onClick="return mV(\'Exd\',20,\'1-\');">Ex 20</a>; <a onClick="return mV(\'Exd\',22,\'1-\');">Ex 22</a>; <a onClick="return mV(\'Exd\',23,\'1-\');">Ex 23</a>), but judgment was rendered on the basis of the law of custom or usage, the function of the judge being essentially that of an arbiter. For the later code see <a href="study/isbe/search.html?string=DEUTERONOMY">DEUTERONOMY</A>.<P>(5) Religion.<P>The king was regarded as the natural representative of his people before God; but while he did exercise certain sacerdotal functions in person, such offices were generally performed by the priest whom he had appointed.<P>(6) Secular Administration.<P>The authority of the king in matters of state was exercised partly by him in person, partly through his ministers, the "princes" (<a onClick="return mV(\'1Ki\',4,2);">1Ki 4:2</a>). Among these functions are to be classed the communication with subject and foreign princes and the direction of the taskwork, which was employed for public improvements, partly military, as in the fortification of cities, partly religious, as in the building of the temple. Local affairs had always been left largely to the tribes and their subdivisions, but, with the gradual increase of royal authority, the king sought to exercise it more and more in the conduct of the village communities. Conversely, the "elders of the people," as the (albeit aristocratic) representatives of the communes, occasionally had a voice even in larger matters of state.<P>4. Israel under Oriental Potentates:<P>The principle of local autonomy; was widely observed in the oriental states, which concerned themselves chiefly about political and military organization and about the collection of revenues. Hence, there is no occasion for surprise on finding that the Jews enjoyed a large measure of autonomy during the period of their subjection to other oriental powers and that even during the exile they resorted, in matters of dispute, to their own representatives for judgment. Under Persian rule Palestine formed part of the satrapy lying west of the Euphrates and had, for a time, its own governor.<P>5. After the Restoration:<P>Ezra and Nehemiah endeavored to introduce a new code, which, after a period of perhaps two centuries, established a dual form of government subject to the supreme authority of the suzerain power. By the new code the secular officers were subordinated to the high priest, who thus virtually assumed the position of a constitutional prince, ruling under the Law. The "prince," however, as the representative of the tribes, and the "elders of the people," as the representatives of the communes, continued to exercise a certain limited authority.<P>6. The Greeks:<P>Under the Greek rulers of Egypt and Syria the Jews continued to enjoy a large measure of autonomy, still maintaining in general the type of internal government formulated under Ezra and Nehemiah. We now hear of a council of "elders" presided over by the high priest. The latter, appointed by the kings, was recognized as ethnarch by both Ptolemies and Seleucids and held accountable for the payment of the tribute, for the exaction of which he was, of course, empowered to levy taxes. The brief period of political independence under the Hasmoneans (see <a href="study/isbe/search.html?string=ASMONEANS">ASMONEANS</A>) did not materially alter the character compare the government, except that the high who had long been a prince in everything but in name, now openly so styled himself. The council of the "elders" survived, although with slightly diminished authority. In other respects the influence of Greek institutions made itself felt.<P>7. The Romans:<P>When Pompey terminated the reign of the Hasmoneans, the government still continued with little essential change. Following the example of the Greek kings, the Romans at Romans first appointed the high priest to the "leadership of the nation." He was soon, however, shorn for a time of his political dignity, the country being divided into five districts, each governed by its "synod"; but Caesar once more elevated the high priest to the office of ethnarch. Under Herod, the high priest and the synedrium (Sanhedrin), appointed or deposed at will as his interests seemed to require, lost much of their former prestige and power. After the death of Herod the land was again divided, and a procurator, subordinate to the governor of Syria, ruled in Judea, having practical independence in his sphere. In their internal affairs the Jews now, as under former masters, enjoyed a large measure of freedom. The high priest no longer exercising any political authority, the synedrium, of which he was a member, now gained in influence, being in fact an aristocratic council in many respects not unlike the Roman senate. It combined judicial and administrative functions, limited in the exercises of its authority only by the provision that its decisions might be reviewed by the procurator. (See <a href="study/isbe/search.html?string=GOVERNOR">GOVERNOR</a>.) Naturally the outlying jurisdictions were organized on the same model, each with its synedrium competent in local matters. The synedrium at Jerusalem served also as a governing board for the city.``75';
isbe[3908]='Governor`guv\'-er-ner: The word "governor" is employed in English Versions of the Bible in rendering a great variety of Hebrew and Greek words. In certain cases strict consistency is neither observed nor possible.<P>1. In the Old Testament:<P>In the rendering of Hebrew terms account has naturally been taken of the translations offered in Septuagint, which, being the work of different hands, is both uneven in quality and inconsistent. But there are inherent difficulties which can never be entirely overcome. First and most important, there is the difficulty arising from our ignorance of many details of the government of the oriental nations to which the terms apply. Hardly less is the embarrassment occasioned by the vague employment of words in indiscriminate reference to persons of superior rank and somehow exercising authority. There is consequently much confusion in the use of titles such as "deputy," "duke," "judge," "lawgiver," "overseer" "prince" "ruler" etc. for which the student may consult the special articles.<P>(1) alluwph or \'alluph, "governor" (the Revised Version (British and American) "chieftain") in Judah (<a onClick="return mV(\'Zec\',9,7);">Zec 9:7</a>; <a onClick="return mV(\'Zec\',12,5);">12:5</a>f).<P>(2) choqeq (<a onClick="return mV(\'Jdg\',5,9);">Jud 5:9</a>; <a onClick="return mV(\'Jdg\',5,14);">5:14</a>, the King James Version margin"or lawgivers"). The word is variously rendered with "ruler" or "lawgiver" in English Versions of the Bible of <a onClick="return mV(\'Gen\',49,10);">Ge 49:10</a>; <a onClick="return mV(\'Deu\',33,21);">De 33:21</a>; <a onClick="return mV(\'Isa\',33,22);">Isa 33:22</a>.<P>(3) moshel, participle of mashal, "to be master," "to rule" (<a onClick="return mV(\'Gen\',45,26);">Ge 45:26</a>, the Revised Version (British and American) "ruler").<P>(4) nasi\' (<a onClick="return mV(\'2Ch\',1,2);">2Ch 1:2</a>, the Revised Version (British and American) "prince").<P>(5) caghan (<a onClick="return mV(\'Dan\',3,2);">Da 3:2</a>; <a onClick="return mV(\'Jer\',51,23);">Jer 51:23</a>, the Revised Version, margin "or lieutenants"; <a onClick="return mV(\'Jer\',51,28,57);">Jer 51:28, 57</a>; <a onClick="return mV(\'Eze\',23,6,12,23);">Eze 23:6, 12, 23</a>). The same word is rendered "rulers" or "deputies" (<a onClick="return mV(\'Isa\',41,25);">Isa 41:25</a>; <a onClick="return mV(\'Ezr\',9,2);">Ezr 9:2</a>; <a onClick="return mV(\'Neh\',2,16);">Ne 2:16</a>; <a onClick="return mV(\'Neh\',5,7);">5:7</a>; <a onClick="return mV(\'Neh\',7,5);">7:5</a>; <a onClick="return mV(\'Neh\',12,40);">12:40</a>).<P>(6) pechah, is variously used:<P class="in15">(a) of the military governor of a province among the Assyrians (<a onClick="return mV(\'Isa\',36,9);">Isa 36:9</a>);<P class="in15">(b) among the Chaldees (<a onClick="return mV(\'Eze\',23,6,23);">Eze 23:6, 23</a>; <a onClick="return mV(\'Jer\',51,23,28,57);">Jer 51:23, 28, 57</a>);<P class="in15">(c) among the Persians (<a onClick="return mV(\'Est\',3,12);">Es 3:12</a>; <a onClick="return mV(\'Est\',8,9);">8:9</a>; <a onClick="return mV(\'Est\',9,3);">9:3</a>);<P class="in15">(d) of the governor-general of the province beyond the River (Euphrates) (<a onClick="return mV(\'Ezr\',8,36);">Ezr 8:36</a>; <a onClick="return mV(\'Neh\',2,7);">Ne 2:7:9</a>);<P class="in15">(e) of Nehemiah as subordinate "governor in the land of Judah" under him (<a onClick="return mV(\'Neh\',5,14);">Ne 5:14</a>);<P class="in15">(f) of Zerubbabel as "governor of Judah" (<a onClick="return mV(\'Hag\',1,1,14);">Hag 1:1, 14</a>; <a onClick="return mV(\'Hag\',2,2,21);">2:2, 21</a>);<P class="in15">(g) of Solomon\'s governors (<a onClick="return mV(\'1Ki\',10,15);">1Ki 10:15</a>; <a onClick="return mV(\'1Ki\',20,24);">20:24</a> (in Syria)).<P>(7) paqidh (<a onClick="return mV(\'Jer\',20,1);">Jer 20:1</a>, the Revised Version (British and American) "chief officer"). Elsewhere it is rendered "overseer" or "officer" (compare <a onClick="return mV(\'Gen\',41,34);">Ge 41:34</a>; <a onClick="return mV(\'2Ki\',25,19);">2Ki 25:19</a>; <a onClick="return mV(\'Neh\',11,9,22);">Ne 11:9, 22</a>).<P>(8) sar "governor of the city" (<a onClick="return mV(\'1Ki\',22,26);">1Ki 22:26</a>). Elsewhere commonly rendered "prince."<P>(9) shallit (<a onClick="return mV(\'Gen\',42,6);">Ge 42:6</a>). Elsewhere rendered "ruler" or "captain."<P>(10) tirshatha\' the Revised Version (British and American) "the governor," the King James Version "the Tirshatha" (<a onClick="return mV(\'Ezr\',2,63);">Ezr 2:63</a>; <a onClick="return mV(\'Neh\',7,70);">Ne 7:70</a>).<P>See <a href="study/isbe/search.html?string=TIRSHATHA">TIRSHATHA</a>.<P>2. In the New Testament:<P>The word "governor" in English Versions of the Bible represents an almost equal variety of Greek words. Here again the usage is for the most part lax and untechnical; but since reference is chiefly had to officers of the Roman imperial administration, concerning which we possess ample information, no embarrassment is thereby occasioned. The words chiefly in use for "governor" are derived from root ag-," drive," "lead":<P>(1) hegeomai, "lead" (<a onClick="return mV(\'Mat\',2,6);">Mt 2:6</a>; of Joseph as grand vizier of Egypt, <a onClick="return mV(\'Act\',7,10);">Ac 7:10</a>).<P>(2) hegemon, "leader" (<a onClick="return mV(\'Mat\',10,18);">Mt 10:18</a>; <a onClick="return mV(\'1Pe\',2,14);">1Pe 2:14</a>; of Pilate, <a onClick="return mV(\'Mat\',27,2,11,14,15,21,27);">Mt 27:2, 11, 14, 15, 21, 27</a>; of Felix, <a onClick="return mV(\'Act\',23,24,26,33);">Ac 23:24, 26, 33</a>; of Festus, <a onClick="return mV(\'Act\',24,1,10);">Ac 24:1, 10</a>; <a onClick="return mV(\'Act\',26,30);">26:30</a>).<P>(3) hegemoneuo, "function as leader" (<a onClick="return mV(\'Luk\',2,2);">Lu 2:2</a>; of Pilate, <a onClick="return mV(\'Luk\',3,1);">Lu 3:1</a>).<P>To these are added terms of more specific meaning:<P>(4) ethnarches, "ethnarch" or "ruler of a nation" (<a onClick="return mV(\'2Cr\',11,32);">2Co 11:32</a>).<P>See <a href="study/isbe/search.html?string=GOVERNMENT">GOVERNMENT</a>, 6, 7.<P>(5) euthuno "direct," "guide" (<a onClick="return mV(\'Jam\',3,4);">Jas 3:4</a>). Here the Revised Version (British and American) properly render it "steersman."<P>(6) architriklinos, "president of a banquet" (<a onClick="return mV(\'Jhn\',2,8);">Joh 2:8</a>f; the American Standard Revised Version "ruler of the feast ").<P>(7) oikonomos, "steward," "manager of a household or estate" (<a onClick="return mV(\'Gal\',4,2);">Ga 4:2</a>, the Revised Version (British and American) "stewards").<P>It is thus seen that in the New Testament "governor" in the political sense occurs chiefly in reference to the Roman procurators of Judea—Pilate, Felix, and Festus. See <a href="study/isbe/search.html?string=PILATE;+PONTIUS">PILATE</a>; <a href="study/isbe/search.html?string=FELIX">FELIX</a>; <a href="study/isbe/search.html?string=FESTUS;+PORCIUS">FESTUS</a>. It remains for us here to speak briefly of the government of Roman provinces.<P>Latin provincia signifies a magistrate\'s sphere of duty or authority, either<P class="in15">(a) judicially or legally, defining the scope of his competence, or<P class="in15">(b) geographically, designating the territorial limits within which he may exercise authority.<P>It is in the latter sense that we are now considering the word. When, in the 3rd century BC, Rome began to rule conquered lands outside Italy, each territory was set under the authority of a single magistrate, and hence came to be called a "province." Conquered territories left under the rule of native princes or kings were not so designated, although their government was practically directed by Rome. At first provinces were governed by proconsuls or proprietors (i.e. ex-consuls or ex-praetors); but with the steady multiplication of provinces various expedients became necessary in order to provide governors of suitable rank and dignity. Thus, the number of praetors was largely augmented, and the term of possible service as governor was extended. Under Augustus the provinces were parceled out between the emperor and the senate, the former reserving for himself such as seemed to require the maintenance of a considerable armed force. In these the emperor was himself proconsul. Early in the Empire imperial provinces of a different type appear, in which the emperor, regarded as sovereign proprietor, governs by a viceroy (praefectus) or steward (procurator). In some of these, tributary kings or princes ruled with the emperor\'s representative—a legatus or a procurator—by their side, much as England now rules Egypt. Among the provinces so ruled were Egypt and Judea, partly, no doubt, because of their strategic position, partly because of the temper of their inhabitants.``75';
isbe[3909]='Goyim`goi\'-yim.`<a href="./study/isbe/search.html?string=GOIIM">GOIIM</a>`1';
isbe[3910]='Gozan`go\'-zan (gozan; Gozan, Codex Vaticanus, Gozar in <a onClick="return mV(\'2Ki\',17,6);">2Ki 17:6</a>, Chozar in <a onClick="return mV(\'1Ch\',5,26);">1Ch 5:26</a>): A place in Assyria to which Israelites were deported on the fall of Samaria (<a onClick="return mV(\'2Ki\',17,6);">2Ki 17:6</a>; <a onClick="return mV(\'2Ki\',18,11);">18:11</a>; <a onClick="return mV(\'1Ch\',5,26);">1Ch 5:26</a>). It is also mentioned in a letter of Sennacherib to Hezekiah (<a onClick="return mV(\'2Ki\',19,12);">2Ki 19:12</a>; <a onClick="return mV(\'Isa\',37,12);">Isa 37:12</a>). The district is that named Guzana by the Assyrians, and Gauzanitis by Ptolemy, west of Nisibis, with which, in the Assyrian geographical list (WAI, II, 53, l. 43), it is mentioned as the name of a city (alu Guzana; alu Nasibina). It became an Assyrian province, and rebelled in 759 BC, but was again reduced to subjection.`<a href="./study/isbe/search.html?string=HABOR">HABOR</a>; <a href="./study/isbe/search.html?string=HALAH">HALAH</a>`132';
isbe[3911]='Graba`gra\'-ba.`<a href="./study/isbe/search.html?string=AGGABA">AGGABA</a>`1';
isbe[3912]='Grace`gras:<P>1. The Word Charis:<P>In the English New Testament the word "grace" is always a translation of (charis), a word that occurs in the Greek text something over 170 times (the reading is uncertain in places). In secular Greek of all periods it is also a very common word, and in both Biblical and secular Greek it is used with far more meanings than can be represented by any one term in English Primarily<P>(a) the word seems to denote pleasant external appearance, "gracefulness" "loveliness"; compare the personificaion in the Graces." Such a use is found in <a onClick="return mV(\'Luk\',4,22);">Lu 4:22</a>, where \'wondered at the charm of his words\' is a good translation; and similarly in <a onClick="return mV(\'Col\',4,6);">Col 4:6</a>.<P>(b) Objectively, charis may denote the impression produced by "gracefulness," as in <a onClick="return mV(\'3Jo\',1,4);">3Joh 1:4</a> \'greater gratification have I none than this\' (but many manuscripts read chara, "joy," here).<P>(c) As a mental attribute charis may be translated by "graciousness," or, when directed toward a particular person or persons, by "favor." So in <a onClick="return mV(\'Luk\',2,52);">Lu 2:52</a>, "Jesus advanced...in favor with God and men."<P>(d) As the complement to this, charis denotes the emotion awakened in the recipient of such favor, i.e. "gratitude." So <a onClick="return mV(\'Luk\',17,9);">Lu 17:9</a> reads literally, \'Has he gratitude to that servant?\' In a slightly transferred sense charis designates the words or emotion in which gratitude is expressed, and so becomes "thanks" (some 10 times, <a onClick="return mV(\'Rom\',6,17);">Ro 6:17</a>, etc.)\'.<P>(e) Concretely, charis may mean the act by which graciousness is expressed, as in <a onClick="return mV(\'1Cr\',16,3);">1Co 16:3</a>, where the King James Version translates by "liberality," and the Revised Version (British and American) by "bounty." These various meanings naturally tend to blend into each other, and in certain cases it is difficult to fix the precise meaning that the writer meant the word to convey, a confusion that is common to both New Testament and secular Greek And in secular Greek the word has a still larger variety of meanings that scarcely concern theologian.<P>2. Grace as Power:<P>Naturally, the various meanings of the word were simply taken over from ordinary language by the New Testament writers. And so it is quite illegitimate to try to construct on the basis of all the occurrences of the word a single doctrine that will account for all the various usages. That one word could express both "charm of speech" and "thankfulness for blessings" was doubtless felt to be a mere accident, if it was thought of at all. But none the less, the very elasticity of the word enabled it to receive still another—new and technically Christian—meaning. This seems to have originated in part by fusing together two of the ordinary significances. In the first place, as in (e) above, charis may mean "a gift." In <a onClick="return mV(\'1Cr\',16,3);">1Co 16:3</a>; <a onClick="return mV(\'2Cr\',8,19);">2Co 8:19</a> it is the money given by the Corinthians to the Jerusalemites. In <a onClick="return mV(\'2Cr\',9,8);">2Co 9:8</a> it is the increase of worldly goods that God grants for charitable purposes. In <a onClick="return mV(\'2Cr\',1,15);">2Co 1:15</a> it is the benefit received by the Corinthians from a visit by Paul. In a more spiritual sense charis is the endowment for an office in the church (<a onClick="return mV(\'Eph\',4,7);">Eph 4:7</a>), more particularly for the apostolate (<a onClick="return mV(\'Rom\',1,5);">Ro 1:5</a>; <a onClick="return mV(\'Rom\',12,3);">12:3</a>; <a onClick="return mV(\'Rom\',15,15);">15:15</a>; <a onClick="return mV(\'1Cr\',3,10);">1Co 3:10</a>; <a onClick="return mV(\'Eph\',3,2,7);">Eph 3:2, 7</a>). So in <a onClick="return mV(\'1Cr\',1,\'4-7\');">1Co 1:4-7</a> margin charis is expanded into "word and all knowledge," endowments with which the Corinthians were especially favored. In <a onClick="return mV(\'1Pe\',1,13);">1Pe 1:13</a> charis is the future heavenly blessedness that Christians are to receive; in <a onClick="return mV(\'1Pe\',3,7);">3:7</A> it is the present gift of "life." In the second place, charis is the word for God\'s favor, a sense of the term that is especially refined by Paul (see below). But God\'s favor differs from man\'s in that it cannot be conceived of as inactive. A favorable "thought" of God\'s about a man involves of necessity the reception of some blessing by that man, and "to look with favor" is one of the commonest Biblical paraphrases for "bestow a blessing." Between "God\'s favor" and "God\'s favors" there exists a relation of active power, and as charis denoted both the favor and the favors, it was the natural word for the power that connected them. This use is very clear in <a onClick="return mV(\'1Cr\',15,10);">1Co 15:10</a>, where Paul says, "not I, but the grace of God which was with me" labored more abundantly than they all: grace is something that labors. So in <a onClick="return mV(\'2Cr\',12,9);">2Co 12:9</a>, "My grace is sufficient for thee: for my power is made perfect in weakness"; compare <a onClick="return mV(\'2Ti\',2,1);">2Ti 2:1</a>, "strengthened in the grace," and <a onClick="return mV(\'1Pe\',4,10);">1Pe 4:10</a>, "stewards of the manifold grace." Evidently in this sense "grace" is almost a synonym for the Spirit (see <a href="study/isbe/search.html?string=HOLY+SPIRIT,+1">HOLY SPIRIT</a>), and there is little real difference between "full of the Holy Spirit" and "full of grace and power" in <a onClick="return mV(\'Act\',6,5,8);">Ac 6:5, 8</a>, while there is a very striking parallel between <a onClick="return mV(\'Eph\',4,\'7-13\');">Eph 4:7-13</a> and <a onClick="return mV(\'1Cr\',12,\'4-11\');">1Co 12:4-11</a>, with "gifts of grace" in the one passage, and "gifts of the Spirit" in the other. And this connection between grace and the Spirit is found definitely in the formula "Spirit of grace" in <a onClick="return mV(\'Hbr\',10,29);">Heb 10:29</a> (compare <a onClick="return mV(\'Zec\',12,10);">Zec 12:10</a>). And, as is well known, it is from this sense of the word that the Catholic doctrine of grace developed.<P>3. Grace in Justification:<P>This meaning of charis was obtained by expanding and combining other meanings. By the opposite process of narrowly restricting one of the meanings of the word, it came again into Christian theology as a technical term, but this time in a sense quite distinct from that just discussed. The formation of this special sense seems to have been the work of Paul. When charis is used with the meaning "favor," nothing at all is implied as to whether or not the favor is deserved. So, for instance, in the New Testament, when in <a onClick="return mV(\'Luk\',2,52);">Lu 2:52</a> it is said that "Jesus advanced...in favor with God and men," the last possible thought is that our Lord did not deserve this favor. Compare also <a onClick="return mV(\'Luk\',2,40);">Lu 2:40</a> and <a onClick="return mV(\'Act\',2,47);">Ac 2:47</a> and, as less clear cases, <a onClick="return mV(\'Luk\',1,30);">Lu 1:30</a>; <a onClick="return mV(\'Act\',7,46);">Ac 7:46</a>; <a onClick="return mV(\'Hbr\',4,16);">Heb 4:16</a>; <a onClick="return mV(\'Hbr\',12,15,28);">12:15, 28</a>. But the word has abundant use in secular Greek in the sense of unmerited favor, and Paul seized on this meaning of the word to express a fundamental characteristic of Christianity. The basic passage is <a onClick="return mV(\'Rom\',11,5,6);">Ro 11:5-6</a>, where as a definition is given, "If it is by grace, it is no more of works: otherwise grace is no more grace." That the word is used in other senses could have caused no 1st-century reader to miss the meaning, which, indeed, is unmistakable. "Grace" in this sense is an attitude on God\'s part that proceeds entirely from within Himself, and that is conditioned in no way by anything in the objects of His favor. So in <a onClick="return mV(\'Rom\',4,4);">Ro 4:4</a>. If salvation is given on the basis of what a man has done, then salvation is given by God as the payment of a debt. But when faith is reckoned for what it is not, i.e. righteousness, there is no claim on man\'s part, and he receives as a pure gift something that he has not earned. (It is quite true that faith involves moral effort, and so may be thought of as a sort of a "work"; it is quite true that faith does something as a preparation for receiving God\'s further gifts. But it simply clouds the exegetical issue to bring in these ideas here, as they certainly were not present in Paul\'s mind when the verses were being written.) "Grace" then, in this sense is the antinomy to "works" or to "law"; it has a special relation to the guilt of sin (<a onClick="return mV(\'Rom\',5,20);">Ro 5:20</a>; <a onClick="return mV(\'Rom\',6,1);">6:1</a>), and has almost exactly the same sense as "mercy." Indeed, "grace" here differs from "mercy" chiefly in connoting eager love as the source of the act. See <a href="study/isbe/search.html?string=JUSTIFICATION">JUSTIFICATION</A>. Of course it is this sense of grace that dominates <a onClick="return mV(\'Rom\',3,\'1-\');">Ro 3-6</a>, especially in the thesis <a onClick="return mV(\'Rom\',3,24);">3:24</A>, while the same use is found in <a onClick="return mV(\'Gal\',2,21);">Ga 2:21</a>; <a onClick="return mV(\'Eph\',2,5,8);">Eph 2:5, 8</a>; <a onClick="return mV(\'2Ti\',1,9);">2Ti 1:9</a>. The same strict sense underlies <a onClick="return mV(\'Gal\',1,6);">Ga 1:6</a> and is found, less sharply formulated, in <a onClick="return mV(\'Tts\',3,\'5-7\');">Tit 3:5-7</a>. (<a onClick="return mV(\'Gal\',5,4);">Ga 5:4</a> is perhaps different.) Outside of Paul\'s writings, his definition of the word seems to be adopted in <a onClick="return mV(\'Jhn\',1,17);">Joh 1:17</a>; <a onClick="return mV(\'Act\',15,11);">Ac 15:11</a>; <a onClick="return mV(\'Hbr\',13,9);">Heb 13:9</a>, while a perversion of this definition in the direction of antinomianism is the subject of the invective in <a onClick="return mV(\'Jud\',1,4);">Jude 1:4</a>. And, of course, it is from the word in this technical Pauline sense that an elaborate Protestant doctrine of grace has been developed.<P>4. Special Uses:<P>A few special uses of the word may be noted. That the special blessing of God on a particular undertaking (<a onClick="return mV(\'Act\',14,26);">Ac 14:26</a>; <a onClick="return mV(\'Act\',15,40);">15:40</a>) should be called a "grace" needs no explanation. In <a onClick="return mV(\'Luk\',6,\'32-34\');">Lu 6:32-34</a>, and <a onClick="return mV(\'1Pe\',2,19);">1Pe 2:19-20</a>, charis seems to be used in the sense of "that which deserves the thanks of God," i.e. a specifically Christian act as distinguished from an act of "natural morality." "Grace for grace" in <a onClick="return mV(\'Jhn\',1,16);">Joh 1:16</a> is a difficult phrase, but an almost exact parallel in Philo (Poster. Cain, 43) may fix the sense as "benefit on benefit." But the tendency of the New Testament writers is to combine the various meanings the word can have, something that is particularly well illustrated in <a onClick="return mV(\'2Cr\',8,\'1-\');">2Co 8</a>; <a onClick="return mV(\'2Cr\',9,\'1-\');">9</a>. In these two chapters the word occurs 10 t, but in so many different senses as to suggest that Paul is consciously playing with the term. Charis is the money given to the Jerusalemites by the Corinthians (<a onClick="return mV(\'2Cr\',8,19);">2Co 8:19</a>), it is the increase of goods that God will grant the Corinthians (<a onClick="return mV(\'2Cr\',9,8);">2Co 9:8</a>), it is the disposition of the givers (<a onClick="return mV(\'2Cr\',8,6);">2Co 8:6</a>), it is the power of God that has wrought this disposition (<a onClick="return mV(\'2Cr\',8,1);">2Co 8:1</a>; <a onClick="return mV(\'2Cr\',9,14);">9:14</a>), it is the act of Christ in the Incarnation (<a onClick="return mV(\'2Cr\',8,9);">2Co 8:9</a>; contrast the distinction between "God\'s grace" and "Christs act" in <a onClick="return mV(\'Hbr\',2,9);">Heb 2:9</a>), it is the thanks that Paul renders (<a onClick="return mV(\'2Cr\',9,15);">2Co 9:15</a>). That all a Christian is and all that he has is God\'s gift could have been stated of course without the use of any special term at all. But in these two chapters Paul has taught this truth by using for the various ideas always the same term and by referring this term to God at the beginning and the end of the section. That is, to the multiplicity of concepts there is given a unity of terminology, corresponding to the unity given the multiple aspects of life by the thought of entire dependence on God. So charis, "grace," becomes almost an equivalent for "Christianity," viewed as the religion of dependence on God through Christ. As one may think of entering Christianity, abiding in it, or falling from it, so one may speak of entering into (<a onClick="return mV(\'Rom\',5,2);">Ro 5:2</a>), abiding in (<a onClick="return mV(\'Act\',13,43);">Ac 13:43</a>), or falling from (<a onClick="return mV(\'Gal\',5,4);">Ga 5:4</a>) grace; compare <a onClick="return mV(\'1Pe\',5,12);">1Pe 5:12</a>. So the teaching of Christianity may be summed up as word or gospel of grace (<a onClick="return mV(\'Act\',14,3);">Ac 14:3</a>; <a onClick="return mV(\'Act\',20,24,32);">20:24, 32</a>). So "grace be with you" closes the Epistles as a sufficient summary of all the blessings that can be wished Christian readers. At the beginning of the Epistles the words "and peace" are usually added, but this is due only to the influence of the Jewish greeting "peace be with you" (<a onClick="return mV(\'Luk\',10,5);">Lu 10:5</a>, etc.), and not to any reflection on "grace" and "peace" as separate things. (It is possible that the Greek use of chairein, "rejoice," as an epistolary salutation (so in <a onClick="return mV(\'Jam\',1,1);">Jas 1:1</a>) influenced the Christian use of charis. But that "grace and peace" was consciously regarded as a universalistic combination of Jewish and Gentile custom is altogether unlikely.) The further expansion of the introductory formula by the introduction of "mercy" in 1 and 2Ti is quite without theological significance.<P>5. Teaching of Christ:<P>In the Greek Gospels, charis is used in the words of Christ only in <a onClick="return mV(\'Luk\',6,\'32-34\');">Lu 6:32-34</a>; <a onClick="return mV(\'Luk\',17,9);">17:9</a>. As Christ spoke in Aram, the choice of this word is due to Luke, probably under the influence of its common Christian use in his own day. And there is no word in our Lord\'s recorded sayings that suggests that He employed habitually any especial term to denote grace in any of its senses. But the ideas are unambiguously present. That the pardon of sins is a free act on God\'s part may be described as an essential in Christ\'s teaching, and the lesson is taught in all manner of ways. The prodigal knowing only his own wretchedness (<a onClick="return mV(\'Luk\',15,20);">Lu 15:20</a>), the publican without merit to urge (<a onClick="return mV(\'Luk\',18,13);">Lu 18:13</a>), the sick who need a physician (<a onClick="return mV(\'Mar\',2,17);">Mr 2:17</a>), they who hunger and thirst after righteousness (<a onClick="return mV(\'Mat\',5,6);">Mt 5:6</a>), these are the ones for whom God\'s pardon is inexhaustible. And positive blessings, be they temporal or spiritual, are to be looked for from God, with perfect trust in Him who clothes the lilies and knows how to give good gifts to His children (<a onClick="return mV(\'Mat\',7,11);">Mt 7:11</a>; here <a onClick="return mV(\'Luk\',11,13);">Lu 11:13</a> has "Holy Spirit" for "gifts," doubtless a Lukan interpretation, but certainly a correct one). Indeed, it is not too much to say that Christ knows but one unpardonable sin, the sin of spiritual self-satisfaction—"That which is exalted among men is an abomination in the sight of God" (<a onClick="return mV(\'Luk\',16,15);">Lu 16:15</a>; compare <a onClick="return mV(\'Luk\',17,\'7-10\');">Lu 17:7-10</a>; <a onClick="return mV(\'Mat\',20,\'1-16\');">Mt 20:1-16</a>).<P>6. In the Old Testament:<P>There is no word in Hebrew that can represent all the meanings of charis, and in the Septuagint charis itself is used, practically, only as a translation of the Hebrew chen, "favor," this restriction of meaning being due to the desire to represent the same Hebrew word by the same Greek word as far as possible. And chen, in turn, is used chiefly only in the phrase "find favor" (<a onClick="return mV(\'Gen\',6,8);">Ge 6:8</a>, etc.), whether the reference is to God or men, and without theological importance. Much nearer Paul\'s use of charis is ratson, "acceptance," in such passages as <a onClick="return mV(\'Isa\',60,10);">Isa 60:10</a>, "In my favor have I had mercy on thee"; <a onClick="return mV(\'Psa\',44,3);">Ps 44:3</a>, "not...by their own sword...but...because thou wast favorable unto them." Perhaps still closer parallels can be detected in the use of checedh, "kindness," "mercy," as in <a onClick="return mV(\'Exd\',20,6);">Ex 20:6</a>, etc. But, of course, a limitation of the sources for the doctrine to passages containing only certain words would be altogether unjust. The main lines seem to be these:<P>(1) Technically, salvation by grace in the New Testament is opposed to an Old Testament doctrine of salvation by works (<a onClick="return mV(\'Rom\',4,4);">Ro 4:4</a>; <a onClick="return mV(\'Rom\',11,6);">11:6</a>), or, what is the same thing, by law (<a onClick="return mV(\'Rom\',6,14);">Ro 6:14</a>; <a onClick="return mV(\'Jhn\',1,17);">Joh 1:17</a>); i.e men and God are thought of as parties to a contract, to be fulfilled by each independently. Most of the legislation seems to presuppose some idea of man as a quantity quite outside of God, while <a onClick="return mV(\'Deu\',30,\'11-14\');">De 30:11-14</a> states explicitly that the law is not too hard nor too far off for man.<P>(2) Yet even this legalism is not without important modifications. The keeping of the law is man\'s work, but that man has the law to keep is something for which God only is to be thanked. <a onClick="return mV(\'Psa\',119,\'1-\');">Ps 119</a> is the essence of legalism, but the writer feels overwhelmed throughout by the greatness of the mercy that disclosed such statutes to men. After all, the initial (and vital!) act is God\'s not man\'s. This is stated most sharply in <a onClick="return mV(\'Eze\',23,\'1-4\');">Eze 23:1-4</a>—Oholibah and her sister became God\'s, not because of any virtue in them, but in spite of most revolting conduct. Compare <a onClick="return mV(\'Deu\',7,7);">De 7:7</a>, etc.<P>(3) But even in the most legalistic passages, an absolute literal keeping of the law is never (not even in such a passage as <a onClick="return mV(\'Num\',15,30,31);">Nu 15:30-31</a>) made a condition of salvation. The thought of transgression is at all times tempered with the thought of God\'s pardon. The whole sacrificial system, in so far as it is expiatory, rests on God\'s gracious acceptance of something in place of legal obedience, while the passages that offer God\'s mercy without demanding even a sacrifice (<a onClick="return mV(\'Isa\',1,18);">Isa 1:18</a>; <a onClick="return mV(\'Mic\',7,\'18-20\');">Mic 7:18-20</a>, etc.) are countless. Indeed, in <a onClick="return mV(\'Eze\',16,\'1-\');">Eze 16</a>; <a onClick="return mV(\'Eze\',20,\'1-\');">20</a>; <a onClick="return mV(\'Eze\',23,\'1-\');">23</a>, mercy is promised to a nation that is spoken of as hardly even desiring it, a most extreme instance.<P>(4) But a mere negative granting of pardon is a most deficient definition of the Old Testament idea of God\'s mercy, which delights in conferring positive benefits. The gift to Abraham of the land of Canaan, liberation from Egypt, food in the wilderness, salvation from enemies, deliverance from exile—all of Israel\'s history can be felt to be the record of what God did for His people through no duty or compulsion, grateful thanksgiving for such unmerited blessings filling, for instance, much of the Psalter. The hearts of men are in God\'s keeping, to receive from Him the impulse toward what is right (<a onClick="return mV(\'1Ch\',29,18);">1Ch 29:18</a>, etc.). And the promise is made that the God who has manifested Himself as a forgiving Father will in due time take hold of His children to work in them actual righteousness (<a onClick="return mV(\'Isa\',1,26);">Isa 1:26</a>; <a onClick="return mV(\'Isa\',4,3,4);">4:3-4</a>; <a onClick="return mV(\'Isa\',32,\'1-8\');">32:1-8</a>; <a onClick="return mV(\'Isa\',33,24);">33:24</a>; <a onClick="return mV(\'Jer\',31,33,34);">Jer 31:33-34</a>; <a onClick="return mV(\'Eze\',36,25);">Eze 36:25-26</a>; <a onClick="return mV(\'Zec\',8,\'1-\');">Zec 8</a>; <a onClick="return mV(\'Dan\',9,24);">Da 9:24</a>; <a onClick="return mV(\'Psa\',51,\'10-12\');">Ps 51:10-12</a>) With this promise—for the Old Testament always a matter of the future—the Old Testament teaching passes into that of the New Testament.<P>7. Summary:<P>Most of the discussions of the Biblical doctrine of grace have been faulty in narrowing the meaning of "grace" to some special sense, and then endeavoring to force this special sense on all the Biblical passages. For instance, Roman scholars, starting with the meaning of the word in (say) <a onClick="return mV(\'2Cr\',12,9);">2Co 12:9</a>, have made <a onClick="return mV(\'Rom\',3,24);">Ro 3:24</a> state that men are justified by the infusion of Divine holiness into them, an interpretation that utterly ruins Paul\'s argument. On the other hand, Protestant extremists have tried to reverse the process and have argued that grace cannot mean anything except favor as an attitude, with results that are equally disastrous from the exegetical standpoint. And a confusion has resulted that has prevented men from seeing that most of the controversies about grace are at cross-purposes. A rigid definition is hardly possible, but still a single conception is actually present in almost every case where "grace" is found—the conception that all a Christian has or is, is centered exclusively in God and Christ, and depends utterly on God through Christ. The kingdom of heaven is reserved for those who become as little children, for those who look to their Father in loving confidence for every benefit, whether it be for the pardon so freely given, or for the strength that comes from Him who works in them both to will and to do.<P>LITERATURE.<P>All the Biblical theologies contain full discussions of the subject; for the New Testament the closest definitions are given by Bernard Weiss. But for the meaning of "grace" in any particular place the commentaries must be consulted, although the student may be warned against discussions that argue too closely from what may seem to be parallel passages.``48';
isbe[3913]='Gracious`gra\'-shus (chanan; charis): In general, the word means "to favor," "to show kindness" to an inferior and "to be compassionate." All Old Testament passages are derived from the same root, and yet there are two evident shades of meaning derived from it.<p class="in15">(1) As above, "favorable" or, causative, "to cause to be gracious," as "Yahweh make his face to shine upon thee, and be gracious unto thee" (<a onClick="return mV(\'Num\',6,25);">Nu 6:25</a>); "And the Lord was gracious unto them" (<a onClick="return mV(\'2Ki\',13,23);">2Ki 13:23</a> the King James Version); "The Lord is gracious and full of compassion" (<a onClick="return mV(\'Psa\',145,8);">Ps 145:8</a> the King James Version).<p class="in15">(2) In a modified sense, "graceful," "winsome" or "attractive," as applied particularly to persons and things. Used thus 3 times in the Old Testament and once in the New Testament. "A gracious woman retaineth honor" (<a onClick="return mV(\'Pro\',11,16);">Pr 11:16</a> the King James Version; compare <a onClick="return mV(\'Ecc\',10,12);">Ec 10:12</a>; <a onClick="return mV(\'Luk\',4,22);">Lu 4:22</a>).<P>The word is used once in the New Testament from root of Greek word chrestos, meaning "useful" as a benefit: "if ye have tasted that the Lord is gracious" (<a onClick="return mV(\'1Pe\',2,3);">1Pe 2:3</a>).<P>In the main, however, the adjective is applied in the Old Testament to Yahweh, as indicative of His favor and mercy, His long-suffering and general inclination of favor and kindness.``25';

isbe[3915]='Graft`graft (egkentrizo; the Revised Version (British and American) "graft"; the King James Version, "graff"): The word occurs 6 times in <a onClick="return mV(\'Rom\',11,\'1-\');">Ro 11</a>. Paul assumed that those living about Rome were familiar with the process of grafting olive trees, for olive culture had been adopted by the Greeks and Romans in Paul\'s time. The wild olive trees (Arabic colloquial, zeitun berri) are cut back, slits made on the freshly sawed branch ends, and two or three grafts from a cultivated olive (Arabic colloquial, zeitun jouwi) are inserted in such a way that the bark of the scion and of the branch coincide. The exposed ends are smeared with mud made from clay, and then bound with cloth or date straw, which is held by thongs made from the bark of young mulberry branches. The fruit thus obtained is good. Wild olives cannot be made cultivated olives by engrafting, as Paul implies (<a onClick="return mV(\'Rom\',11,24);">Ro 11:24</a>), but a wild olive branch thus grafted would thrive. So Gentiles would flourish spiritually when grafted into the fullness of God\'s mercy, first revealed to the world through Israel.``133';

isbe[3919]='Grapes, Wild`(be\'ushim, <a onClick="return mV(\'Isa\',5,2);">Isa 5:2, 4</a>): A word closely allied to bo\'shah, <a onClick="return mV(\'Job\',31,40);">Job 31:40</a>, translated "<a href="study/isbe/search.html?string=COCKLE">cockle</A>" (which see). It implies something noisome or worthless, but no particular fruit.``1';
isbe[3920]='Grasp`grasp: The word harpagmos (<a onClick="return mV(\'Phl\',2,6);">Php 2:6</a>), is rendered by the King James Version "robbery," by the Revised Version (British and American) "a prize," and by the American Standard Revised Version "a thing to be grasped." By derivation the term may denote either an act of seizing or the aim or result of the action. In the context Paul is discussing, not Christ\'s opinion of His equality with God, but His amazing self-sacrifice in laying aside His equally for our sakes. He but laid it aside for us. It is better to render with the Revised Version (British and American) "a prize."``1';
isbe[3921]='Grass`gras:<P>(1) chatsir, from a root meaning "greenness"; compare Arabic Khudra, which includes grasses and green vegetables (<a onClick="return mV(\'1Ki\',18,5);">1Ki 18:5</a>; <a onClick="return mV(\'2Ki\',19,26);">2Ki 19:26</a>; <a onClick="return mV(\'Job\',40,15);">Job 40:15</a>; <a onClick="return mV(\'Psa\',104,14);">Ps 104:14</a>, etc.). <a onClick="return mV(\'Isa\',15,6);">Isa 15:6</a> is translated in the King James Version "have," the Revised Version (British and American) "grass"; <a onClick="return mV(\'Pro\',27,25);">Pr 27:25</a>, English Versions of the Bible "hay," margin "Hebrew grass"; <a onClick="return mV(\'Num\',11,5);">Nu 11:5</a> English Versions of the Bible translates "leeks." It is a term for herbage in general.<P>(2) deshe\', from root meaning "to sprout abundantly." Generally translated "tender grass" (<a onClick="return mV(\'Gen\',1,11);">Ge 1:11</a>f; <a onClick="return mV(\'2Sa\',23,4);">2Sa 23:4</a>; <a onClick="return mV(\'Job\',6,5);">Job 6:5</a>; <a onClick="return mV(\'Isa\',15,6);">Isa 15:6</a>; <a onClick="return mV(\'Isa\',66,14);">66:14</a>; <a onClick="return mV(\'Jer\',14,5);">Jer 14:5</a>, etc.); translated "grass" (<a onClick="return mV(\'Job\',6,5);">Job 6:5</a>; <a onClick="return mV(\'Jer\',14,5);">Jer 14:5</a>); translated "herb" (<a onClick="return mV(\'2Ki\',19,26);">2Ki 19:26</a>; <a onClick="return mV(\'Psa\',27,2);">Ps 27:2</a>; <a onClick="return mV(\'Isa\',37,27);">Isa 37:27</a>; <a onClick="return mV(\'Isa\',66,14);">66:14</a>). In <a onClick="return mV(\'Jer\',50,11);">Jer 50:11</a> we have "heifer at grass" (deshe\') in the King James Version and the Revised Version, margin, but in the Revised Version (British and American) "heifer that treadeth out the grain." (dethe\'), the Aramaic form, occurs in <a onClick="return mV(\'Dan\',4,15,23);">Da 4:15, 23</a>, and is translated "tender grass."<P>(3) chashash, probably "dry" or "cut grass"; compare Arabic chashesh, "dry fodder" or "cut grass" (<a onClick="return mV(\'Isa\',5,24);">Isa 5:24</a>, the King James Version "chaff," the Revised Version (British and American) "dry grass"; <a onClick="return mV(\'Isa\',33,11);">Isa 33:11</a>, English Versions of the Bible "chaff").<P>(4) leqesh, from root meaning "to come late," hence used in <a onClick="return mV(\'Amo\',7,1);">Am 7:1</a> for the "latter growth" of grass after mowing.<P>(5) yereq, literally, "green thing" (<a onClick="return mV(\'Num\',22,4);">Nu 22:4</a>, elsewhere translated "herb").<P>(6) \'esebh (<a onClick="return mV(\'Deu\',11,15);">De 11:15</a>, etc.), generally translated "herb" (for (5) and (6) see <a href="study/isbe/search.html?string=HERB">HERB</a>).<P>(7) chortos (<a onClick="return mV(\'Mat\',6,30);">Mt 6:30</a>; <a onClick="return mV(\'Mat\',14,19);">14:19</a>; <a onClick="return mV(\'Mar\',6,39);">Mr 6:39</a>; <a onClick="return mV(\'Luk\',12,28);">Lu 12:28</a>; <a onClick="return mV(\'Jhn\',6,10);">Joh 6:10</a>; <a onClick="return mV(\'Jam\',1,10,11);">Jas 1:10-11</a>; <a onClick="return mV(\'1Pe\',1,24);">1Pe 1:24</a>; <a onClick="return mV(\'Rev\',8,7);">Re 8:7</a>; <a onClick="return mV(\'Rev\',9,4);">9:4</a>); translated "blade" (<a onClick="return mV(\'Mat\',13,26);">Mt 13:26</a> <a onClick="return mV(\'Mar\',4,28);">Mr 4:28</a>); translated "hay" (<a onClick="return mV(\'1Cr\',3,12);">1Co 3:12</a>).<P>There are 243 species of true grasses (Natural Order, Gramineae) in Palestine, but Hebrew, like modern Arabic, does not discriminate between these and other herbs which together make up herbage. Actual turf is practically unknown in Palestine, and grass seed is not artificially sown; young green barley is used in the neighborhood of towns as fresh fodder for horses and cattle. It is not the native custom to cut herbage for hay, though the writer has seen many carloads of sweet-smelling hay being carried from the land by Circassian settlers, east of the Jordan.<P>The "grass upon the house tops" (<a onClick="return mV(\'Psa\',129,6);">Ps 129:6</a>; <a onClick="return mV(\'Isa\',37,27);">Isa 37:27</a>), the growth which springs from the seeds mingled with the mud of which the roof is made, springs up quickly with the rains, but as quickly dries up before it reaches half its normal height—or not infrequently is set on fire.<P>Dew, rain or showers upon the grass are mentioned (<a onClick="return mV(\'Deu\',32,6);">De 32:6</a>; <a onClick="return mV(\'Pro\',19,12);">Pr 19:12</a>; <a onClick="return mV(\'Mic\',5,7);">Mic 5:7</a>; <a onClick="return mV(\'Psa\',72,6);">Ps 72:6</a>, "rain upon the mown grass," i.e. the grass eaten short by cattle).``117';

isbe[3923]='Grate; Grating`grat, grat\'-ing (mikhbar, resheth; the King James Version Grate): This "grating of network of brass" (<a onClick="return mV(\'Exd\',27,4);">Ex 27:4</a>; <a onClick="return mV(\'Exd\',38,4);">38:4</a>), called also "the net" (<a onClick="return mV(\'Exd\',27,4);">Ex 27:4</a>f), and "grating of brass" (<a onClick="return mV(\'Exd\',38,4);">Ex 38:4</a>), was that reticulated casting or wrought work of bronze which, in the tabernacle system, formed an element of the altar of sacrifice. Its position is well defined: "Thou shalt put it under the ledge round the altar beneath, that the net may reach halfway up the altar" (<a onClick="return mV(\'Exd\',27,5);">Ex 27:5</a>; compare <a onClick="return mV(\'Exd\',38,4);">Ex 38:4</a>). The altar being a hollow box—"hollow with planks" (<a onClick="return mV(\'Exd\',27,8);">Ex 27:8</a>)—3 cubits high, overlaid with brass, and presumably filled with stones, there appears to have been a ledge round about it halfway from the base, from which depended vertically this grating of bronze. On the grating were four rings through which the staves were passed by which the altar was borne (<a onClick="return mV(\'Exd\',27,4,7);">Ex 27:4, 7</a>). If the ledge was for the priests to stand on while handling the sacrifices on the altar, the grating need be thought of only as an ornamental support for the ledge. Others ascribe to it different uses.``17';

isbe[3927]='Gravel`grav\'-el (chatsats, from root chatsats, "to divide." Kindred roots have the meaning of "to cut," "to hew," "to sharpen," hence chets, "arrow" (<a onClick="return mV(\'2Ki\',13,17);">2Ki 13:17</a>; <a onClick="return mV(\'Psa\',64,7);">Ps 64:7</a> and often); compare Arabic chacca, "to fall to the lot of," chiccah, "portion"): In <a onClick="return mV(\'Pro\',20,17);">Pr 20:17</a>, we have:<P class="in15">"Bread of falsehood is sweet to a man;<br>But afterwards his mouth shall be filled with gravel."<P>And in <a onClick="return mV(\'Lam\',3,16);">La 3:16</a>:<P class="in15">"He hath also broken my teeth with gravel stones;<br> he hath covered me with ashes."<P>The only other occurrence of the word is in <a onClick="return mV(\'Psa\',77,17);">Ps 77:17</a>, where it is the equivalent of chets, "arrow" (see supra):<P class="in15">"The clouds poured out water;<br>The skies sent out a sound:<br>Thine arrows also went abroad."<P><a onClick="return mV(\'Pro\',20,17);">Pr 20:17</a> and <a onClick="return mV(\'Lam\',3,16);">La 3:16</a> both suggest the frequent occurrence of grit in the coarse bread, the source of the grit being not necessarily the grindstone, but possibly even small stones originally mingled with the wheat and never properly separated from it.``37';
isbe[3928]='Gravity`grav\'-i-ti (semnotes): The word, meaning properly "venerableness," "sanctity," is used in 2Macc 3:12 of the "sanctity" of the temple. In <a onClick="return mV(\'1Ti\',3,4);">1Ti 3:4</a> the writer declares that a characteristic of a bishop should be that he has "his children in subjection with all gravity." Titus is enjoined (<a onClick="return mV(\'Tts\',2,7);">2:7</A>f) in his "doctrine" (teaching) to show "uncorruptness, gravity, sound speech (Revised Version), that cannot be condemned" (compare <a onClick="return mV(\'1Ti\',3,8);">1Ti 3:8</a>). In <a onClick="return mV(\'1Ti\',2,2);">1Ti 2:2</a> the same word is translated "honesty" (the Revised Version (British and American) "gravity"), "that we may lead a tranquil and quiet life in all godliness and gravity." A better rendering of semnotes might be "dignity" or "dignified seriousness" (Olshausen), which quality is necessary, both on the part of parents in relation to their children, if they are to be properly trained, and on the part of preachers and teachers, if their "doctrine" is to be worthily represented. All mere lightness of demeanor (the opposite of gravity) tells against the great trusts committed to both parents and teachers (compare <a onClick="return mV(\'1Ti\',3,11);">1Ti 3:11</a>; <a onClick="return mV(\'Tts\',2,2);">Tit 2:2</a>). Such "gravity" or "dignified seriousness" ought indeed to characterize Christian demeanor in general, as in <a onClick="return mV(\'1Ti\',2,2);">1Ti 2:2</a> above.``185';
